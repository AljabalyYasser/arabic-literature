# النشر إلى Cloudflare من GitHub Actions مباشرة، بلا خدمة البناء في Cloudflare (Workers Builds):
# يُبنى الموقع هنا، ثم يرفعه wrangler، ثم يُتحقق من أن الموقع المنشور يعرض ما بُني الآن بالضبط.
# يحتاج سرًّا واحدًا في المستودع: CLOUDFLARE_API_TOKEN (رمز بقالب «Edit Cloudflare Workers»).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://arabic-literature.aljabalyyasser.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 393ddeb51837f6fc1ad8a5759ebaaee8

      # الأصول تُخدم كما رُفعت، فالصفحة المنشورة تطابق المبنية حرفًا إذا نجح النشر.
      - name: Verify the live site
        run: |
          for page in / /path/1/ /updates/; do
            ok=
            for i in $(seq 1 12); do
              if curl -fsS "$SITE$page" -o live.html && cmp -s live.html "dist${page}index.html"; then ok=1; break; fi
              sleep 10
            done
            if [ -z "$ok" ]; then echo "::error::$page on the live site does not match this build"; exit 1; fi
            echo "$page matches this build"
          done
