# النسخة الموسعة لصفحة الباب 1 كما كانت في الإيداع c39b4d6، قبل اختصارها.
# داخلي، لا يظهر في الموقع. كل ما فيها بإحالاته، ويُرجع إليه عند كتابة قضايا العصر ومسارات أعلامه.
# تنبيه: فيها آراء لشوقي ضيف وغيره لم تُنسب في المتن إلى أصحابها، وكتب لاحقة لم تُفصل عن كتب العصر. تُصحَّح عند استعمالها (docs/content-guide.md، «الرأي يُنسب في المتن»).
summary: "نحو مئة وخمسين سنة قبل الإسلام، في جزيرة العرب وأطرافها [@deif، ج1 ص38–39]. هنا يبدأ الشعر العربي الذي وصلنا: قصائد يرويها الناس حفظًا، وقبائل تفاخر بشعرائها، وأسواق يتنافسون فيها."
overview:
  history: |
    كانت جزيرة العرب قبائل متفرقة، أكثرها في البادية. وعلى أطرافها قامت ثلاث إمارات عربية: الغساسنة في الشام، اتخذهم الروم حاجزًا بينهم وبين البدو وعونًا في حروبهم مع الفرس؛ والمناذرة في الحِيرة، اتخذهم الفرس درعًا مثل ذلك؛ وكِنْدة في شمالي نجد بين الطرفين [@deif، ج1 ص40]. فكان الشاعر يقف بباب ملك الحِيرة أو ملك غسّان يمدحه ويعتذر إليه، ويشهد حروبه.

    وقامت بين القبائل حروب طويلة سمّوها «أيامًا»، «لأنهم كانوا يتحاربون نهارًا، فإذا جنّهم الليل وقفوا القتال حتى يخرج الصباح» [@deif، ج1 ص64]. وكانت لهم أسواق تجتمع فيها القبائل، أشهرها عُكاظ، ولم تكن للبيع والشراء فقط، بل كانت تتعداهما «إلى الأدب والشعر والحرب والسلم والعادات» [@afghani، ص285].
  change: |
    في هذا العصر تقاربت لهجات القبائل، فصارت هناك «لغة أدبية عامة، هي الفصحى، ينظم بها شعراء العرب جميعًا شعرهم» [@deif، ج1 ص120]. ويرى شوقي ضيف أنها لهجة قريش، وأنها سادت قبل الإسلام في القبائل كلها [@deif، ج1 ص134].

    واكتمل الشعر نفسه: قصيدة طويلة يفتتحها الشاعر غالبًا بوصف الأطلال وبكاء الديار، ثم يصف رحلته في الصحراء وناقته أو فرسه، ثم يمضي إلى غرضه [@deif، ج1 ص183]. ولم يكن هذا الشعر يُكتب؛ كان الشاعر ينشد قصيدته فيحفظها الناس ويروونها، و«النهر الكبير الذي فاض بالشعر الجاهلي إنما هو الرواية الشفوية» [@deif، ج1 ص141]. ثم جمعه رواة القرنين الثاني والثالث في الإسلام، فعن جمعهم أخذ كل من جاء بعدهم [@deif، ج1 ص163].
  arts:
    - title: القصيدة
      text: "فن العصر الأول. قصيدة طويلة على وزن واحد وقافية واحدة، لها نظام من المعاني تسير عليه: الأطلال، ثم الرحلة، ثم الغرض [@deif، ج1 ص183]."
    - title: الأمثال
      text: "أصدق ما بقي من نثر الجاهلية، لأن من شأنها «أن لا تغير، وأن تظل طويلًا بصورتها» [@deif، ج1 ص404]. ولكثير منها قصة تُروى."
    - title: الخطابة والوصايا
      text: "كانوا يخطبون في الأسواق والوفود، وعند الصلح والزواج، وينصح الحكيم قومه وبنيه [@deif، ج1 ص412]. لكن نصوصها لم تصلنا موثقة، لبعد ما بين قولها وتدوينها [@deif، ج1 ص410]."
    - title: سجع الكُهّان
      text: "كلام مسجوع يزعم أصحابه أنهم يعرفون به الغيب [@deif، ج1 ص420]."
    - title: القصص
      text: "كانوا يجتمعون للسمر إذا أرخى الليل سدوله، فيروون أخبار أيامهم وأبطالهم [@deif، ج1 ص399]."
  writersTitle: الخطباء والحكماء
  writers:
    - name: "قُسّ بن ساعِدة الإيادِيّ"
      text: "أشهر خطبائهم. تُروى له خطبة بسوق عُكاظ على جمل أحمر، فيها: «من عاش مات، ومن مات فات، وكل ما هو آت آت» [@deif، ج1 ص415]."
    - name: "أَكْثَم بن صَيْفِيّ"
      text: "من «خطباء تميم المفوّهين» [@deif، ج1 ص414]، وحكيم تُروى عنه الأمثال والوصايا [@deif، ج1 ص406–407]."
    - name: "عامِر بن الظَّرِب العَدْوانِيّ"
      text: "حكيم يُروى أنه لما أسنّ أمر ابنته أن تقرع له العصا إذا جار عن الحكم [@deif، ج1 ص407]."
    - name: "ضَمْرة بن ضَمْرة"
      text: "خطيب قال للنعمان حين ازدراه لدمامته: «إن الرجال لا تُكال بالقُفْزان» [@deif، ج1 ص414]."
  books:
    - title: "المعلقات"
      text: "سبع قصائد، يقال إن أول من رواها مجموعة في ديوان خاص بها حمّاد الراوية، وسُمّيت بذلك لنفاستها، لا لأنها عُلّقت على الكعبة [@deif، ج1 ص176]. ونقرؤها بشرح ابن الأَنْبارِيّ."
    - title: "المفضليات"
      text: "جمعها المفضّل الضبّي راوية الكوفة، وهي عند شوقي ضيف «أروع ما بأيدينا من نصوص الشعر الجاهلي ووثائقه التي لا يرقى إليها الشك» [@deif، ج1 ص153]."
    - title: "الأصمعيات"
      text: "مختارات الأصمعي راوية البصرة، وهي «كالمفضليات ثقة ودقة» [@deif، ج1 ص155]."
    - title: "طبقات فحول الشعراء"
      text: "لابن سَلّام (ت 232هـ)، دوّن فيه «كثيرًا من ملاحظات أهل العلم والدراية في رواية الشعر القديم» [@deif، ج1 ص164]."
    - title: "الأغاني"
      text: "لأبي الفَرَج الأصفهاني (ت 356هـ)، وهو عند شوقي ضيف «أكبر مصدر لتاريخ الشعر الجاهلي وأصحابه» [@deif، ج1 ص182]."
    - title: "حماسة أبي تمّام"
      text: "من الكتب الجامعة التي بدأ تأليفها في القرن الثالث، وحفظت كثيرًا من الشعر الجاهلي [@deif، ج1 ص163]."
  texts:
    - title: "«قِفا نَبْكِ» لامرئ القَيْس"
      text_id: qifa-nabki
      text: "أشهر المعلقات، ومطلعها عند النقاد «أفضل ابتداء صنعه شاعر» [@ibn-rashiq، ج1 ص218]."
    - title: "«لخَوْلة أطلال» لطَرَفة"
      text_id: li-khawla-atlal
      text: "المعلقة التي جعلت صاحبها عند ابن قُتَيْبة «أجودهم طويلة» [@ibn-qutayba، ج1 ص182]."
    - title: "«أليلتنا بذي حُسُم أنيري» للمُهَلْهِل"
      text_id: alaylatana
      text: "رثاء كليب في حرب البسوس. والمهلهل عند ابن سَلّام أول من «قصّد القصائد وذكر الوقائع» [@ibn-sallam، ج1 ص39]."
    - title: "«ألا لا تلوماني» لعبد يَغُوث الحارِثيّ"
      text: "قالها أسيرًا بعد أن أُسر يوم الكُلاب [@iqd، ج6 ص82]، وحفظتها المفضليات [@mufaddaliyyat، ص155]. نموذج لقصيدة الساعة الأخيرة."
    - title: "خطبة قُسّ بن ساعِدة بعُكاظ"
      text: "أشهر ما يُروى من الخطابة الجاهلية [@deif، ج1 ص415]، وهي منسوبة إليه لا تثبت، لأن الخطابة الجاهلية لم تصلنا نصوصها موثقة [@deif، ج1 ص410]."
