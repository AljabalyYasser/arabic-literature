# النسخة الموسعة لصفحة الباب 6 كما كانت في الإيداع c39b4d6، قبل اختصارها.
# داخلي، لا يظهر في الموقع. كل ما فيها بإحالاته، ويُرجع إليه عند كتابة قضايا العصر ومسارات أعلامه.
# تنبيه: فيها آراء لشوقي ضيف وغيره لم تُنسب في المتن إلى أصحابها، وكتب لاحقة لم تُفصل عن كتب العصر. تُصحَّح عند استعمالها (docs/content-guide.md، «الرأي يُنسب في المتن»).
summary: "أكثر من ستة قرون، من قيام الدولة الأيوبية سنة 567هـ [@deif، ج7 ص27] إلى الحملة الفرنسية على مصر سنة 1213هـ/1798م [@deif، ج7 ص43]: أيوبيون ثم مماليك ثم عثمانيون. صارت القاهرة ودمشق مركزَي الأدب، وكثرت الموسوعات والبديعيات والمديح النبوي، وازدهر الأدب الشعبي. وشاع وصفه بالانحطاط، وفي هذا الوصف نظر."
overview:
  history: |
    في أول المحرم سنة 567هـ أقام صلاح الدين الخطبة في مصر لبني العباس، «وبذلك انتهى أمر الفاطميين وحكمهم للديار المصرية» [@deif، ج7 ص27]. ثم هزم الصليبيين في حِطِّين سنة 583هـ [@deif، ج7 ص29] وفتح القدس، فأطلقت انتصاراته «ألسنة الشعراء فى مصر وجميع البلدان العربية حتى لم يكد يبقى شاعر نابه إلا قصده مادحا» [@deif، ج7 ص171].

    وسقطت بغداد في يد التتار سنة 656هـ [@deif، ج5 ص5]، فصارت مصر «ملاذا لعلماء العالم العربى النازحين من وجه النورمان والإسبان غربا ومن وجه المغول شرقا» [@deif، ج7 ص7]. وقامت دولة المماليك في مصر والشام، وصدّت التتار في عين جالوت سنة 658هـ، وهي «من المعارك الفاصلة فى التاريخ» [@deif، ج7 ص35]. وكثرت المدارس في عهدهم حتى قال ابن بطوطة إن أحدًا لا يستطيع أن يحيط بها لكثرتها [@deif، ج7 ص8].

    ثم انتصر العثمانيون في مَرْج دابِق سنة 922هـ [@deif، ج7 ص40]، وحمل السلطان سليم من مصر كتبها وصنّاعها، «وهكذا جرّدت مصر من علمائها وفنّانيها وتراثها الفكرى والفنى» [@deif، ج7 ص41]، وصارت التركية لغة الدواوين [@deif، ج6 ص300]. وانتهى العصر بالحملة الفرنسية على مصر سنة 1213هـ/1798م، ويرى شوقي ضيف أن الأَولى أن تُدرس مع العصر الحديث [@deif، ج7 ص43].
  change: |
    شاع وصف هذا العصر بالانحطاط، ويردّ شوقي ضيف ذلك. فالمؤرخون للأدب نعتوه بأنه «زمن انحطاط وركود فى جميع جوانب الحياة العقلية، وهو ما تنقضه الحقائق السابقة نقضا»، ويرى «أن مصر لم تشهد حقبا علمية مزدهرة بمقدار ما شهدت فى زمن المماليك» [@deif، ج7 ص86–87]. لكنه يقرّ بأن الحركة العلمية انتكست بعد الفتح العثماني، وإن «ظلت جذوات منها تتقد فى الجامع الأزهر وفى بعض المدارس» [@deif، ج7 ص87].

    وصار البديع «مقياس إبداعهم» منذ القاضي الفاضل [@deif، ج7 ص9]. وأحبّوا منه التورية، وهي أن يذكر الشاعر لفظًا له معنيان: قريب يتبادر إلى الذهن، وبعيد هو المقصود. وهي عند شوقي ضيف لون «يصور مزاج المصريين وميلهم من قديم إلى النكتة» [@deif، ج6 ص136]. ويرى أن البديع في مصر «لم يسمج ولم يثقل ولم يتحول إلى صور من التكلف المقيت حتى أيام العثمانيين» [@deif، ج7 ص185]، أما في الشام والعراق فصار التصنع «ظاهرة عامة» [@deif، ج6 ص140].

    ودخلت لغة الحياة اليومية الشعر، ونظم بعضهم بالعامية «حتى يصلوا مباشرة إلى التأثير فى الناس» [@deif، ج7 ص386]. وغلب على العلم الجمع والشرح: وضعوا المتون، وهي المختصرات التي يحفظها الطلاب، ثم شرحوها، «وامتازت الحركة العلمية لعهد المماليك بكتابة دوائر معارف كبرى» [@deif، ج7 ص86].
  arts:
    - title: المديح النبوي
      text: "«أخذ هذا المديح يزدهر فى زمن الحروب الصليبية» [@deif، ج7 ص497]، وبلغ ذروته عند البوصيري."
    - title: البديعيات
      text: "«قصائد فى مديح الرسول صلّى الله عليه وسلم تسمى البديعيات وتشرح شروحا مطولة» [@deif، ج7 ص184]، يحمل كل بيت منها لونًا من ألوان البديع."
    - title: الموشح والزجل في المشرق
      text: "وضع ابن سناء الملك عروض الموشحات «كما وضع الخليل بن أحمد عروض الشعر العربى ونظامه» [@deif، ج7 ص177]، وأخذت مصر تشارك في الزجل حتى بلغت فيه «غاية لا تكاد تدرك» [@deif، ج7 ص387]."
    - title: خيال الظل
      text: "ألّف ابن دانيال «ثلاث تمثيليات أو كما يسميها بابات لتمثّل على مسرح خيال الظل فى أيامه، وهو مسرح دمّى متحركة متحاورة» [@deif، ج7 ص382]."
    - title: الرسائل الديوانية
      text: "«وتبلغ الرسائل الديوانية الذروة الأدبية على يد القاضى الفاضل وزير صلاح الدين، ويتألق نجمه وتصبح له مدرسة كبيرة» [@deif، ج7 ص10]."
    - title: السير الشعبية
      text: "كسيرة عنترة، والسيرة الهلالية، وسيرة الظاهر بيبرس، وسيرة سيف بن ذي يزن، «وجميعها تصور البطولة العربية وفضائلها الرفيعة» [@deif، ج7 ص11]."
  poets:
    - name: "ابن سَناء المُلْك (ت 608هـ)"
      text: "شاعر صلاح الدين، وواضع أصول الموشح، وهو عند شوقي ضيف «أهم شعراء مصر قبل العصر الحديث» [@deif، ج7 ص494]."
    - name: "ابن النَّبِيه (ت 619هـ)"
      text: "«وغزله يتسامى إلى مستوى وجدانى رفيع، مما دفع المغنين إلى التغنى به» [@deif، ج7 ص495]."
    - name: "ابن الفارِض (ت 632هـ)"
      text: "له «أشعار لعلها أروع ما نظمه الصوفية فى حبهم الإلهى، حتى لقّب بحق سلطان العاشقين» [@deif، ج7 ص358]."
    - name: "البَهاء زُهَيْر (ت 656هـ)"
      text: "صاحب الغزل الرقيق، قال فيه ابن خلكان: «شعره كله لطيف، وهو-كما يقال-السهل الممتنع» [@deif، ج7 ص281]."
    - name: "البُوصِيرِيّ (ت 696هـ)"
      text: "صاحب «البردة»، «اتجه إلى المديح النبوى، وبلغ فيه ذروة لم يبلغها أحد قبله ولا فى زمنه» [@deif، ج7 ص363]."
    - name: "ابن دانِيال (ت 710هـ)"
      text: "شاعر الفكاهة، وصاحب بابات خيال الظل، «وأبدع المسرحيات الثلاث وأطرفها «طيف الخيال»» [@deif، ج7 ص382]."
    - name: "صَفِيّ الدين الحِلِّيّ (ت 750هـ)"
      text: "صاحب أشهر البديعيات، «مدحة نبوية تضم أبياتها نحو مائة وخمسين محسّنا من محسنات البديع» [@deif، ج5 ص355]."
    - name: "ابن نُباتة المِصْرِيّ (ت 768هـ)"
      text: "أصبح «حامل لواء الشعر فى زمانه، غير منازع ولا مدافع» كما يقول ابن كثير والسبكي [@deif، ج7 ص211]."
    - name: "عَبْد الغَنِيّ النّابُلُسِيّ (ت 1143هـ)"
      text: "شاعر صوفي من العصر العثماني، جذبه «مذهب ابن عربى الصوفى الفلسفى» [@deif، ج6 ص288]."
  writers:
    - name: "القاضي الفاضِل (ت 596هـ)"
      text: "وزير صلاح الدين و«أهم كتاب مصر، وهو رأس مدرسة ظلت حية فى أيام الأيوبيين والمماليك» [@deif، ج7 ص497]. وكان صلاح الدين يقول: «لا تظنوا أنى ملكت البلاد بسيوفكم، إنما ملكتها بقلم القاضى الفاضل» [@deif، ج7 ص412]."
    - name: "العِماد الأصْفَهانِيّ (ت 597هـ)"
      text: "كاتب صلاح الدين، «أديب كبير: كاتب وشاعر» [@deif، ج6 ص301]."
    - name: "ابن خَلِّكان (ت 681هـ)"
      text: "«أكبر كتاب التراجم وأوثقهم»، صاحب «وفيات الأعيان» [@deif، ج7 ص155]."
    - name: "ابن مَنْظُور (ت 711هـ)"
      text: "صاحب «لسان العرب» [@deif، ج7 ص114]."
    - name: "النُّوَيْرِيّ (ت 733هـ)"
      text: "صاحب «نهاية الأرب»، وهو «أشبه بدائرة معارف» [@zirikli، ج1 ص165]."
    - name: "ابن خَلْدُون (ت 808هـ)"
      text: "تونسي استقر بالقاهرة، «وقد بهر ابن خلدون معاصريه ومن جاءوا بعدهم إلى اليوم بتاريخه» [@deif، ج9 ص324]."
    - name: "القَلْقَشَنْدِيّ (ت 821هـ)"
      text: "صاحب «صبح الأعشى»، «موسوعة ضخمة فى أربعة عشر مجلدا ظل يعنى بتأليفها فى نحو ربع قرن من الزمان» [@deif، ج7 ص451]."
    - name: "ابن حِجّة الحَمَوِيّ (ت 837هـ)"
      text: "صاحب بديعية شرحها «بحيث أصبح الشرح-كما سماه-خزانة أدب» [@deif، ج6 ص307]."
    - name: "السُّيُوطِيّ (ت 911هـ)"
      text: "«وهو أغزر العلماء المصريين زمن المماليك بعامة تأليفا وتصنيفا» [@deif، ج7 ص114]."
  books:
    - title: "صبح الأعشى"
      text: "للقلقشندي، «سجل تاريخى حافل بمعلومات نفيسة عن مكاتبات الحكام فى العالم العربى على مر العصور بجانب أنه معلمة جغرافية رائعة» [@deif، ج7 ص157]."
    - title: "نهاية الأرب في فنون الأدب"
      text: "للنويري، يتناول علوم الفلك والجغرافيا والتاريخ الطبيعي وتاريخ الدولة العربية «من أقدم الأزمنة حتى زمن النويرى» [@deif، ج7 ص86]."
    - title: "لسان العرب"
      text: "لابن منظور، «وهو أكبر معجم لغوى عربى ظهر فى الأزمنة الماضية» [@deif، ج7 ص114]."
    - title: "وفيات الأعيان"
      text: "لابن خلكان، بدأ تأليفه في القاهرة «سنة 654 وأتمّه بها سنة 672» [@deif، ج7 ص155]."
    - title: "كتاب العبر، ومقدمته"
      text: "لابن خلدون، سمّاه «كتاب العبر، وديوان المبتدإ والخبر، في أيّام العرب والعجم والبربر» [@ibn-khaldun، ج1 ص10]، و«الكتاب الأول مقدمة فى الفلسفة الاجتماعية» [@deif، ج9 ص324]."
    - title: "خزانة الأدب وغاية الأرب"
      text: "لابن حجة، شرح لبديعيته، ويُعدّ «مرجعا أساسيا للشعر والشعراء فى زمن الأيوبيين والمماليك» [@deif، ج6 ص307]."
    - title: "دار الطراز في عمل الموشحات"
      text: "لابن سناء الملك، قال فيه: «ولم أر أحدًا صنف في أصولها ما يكون للمتعلم مثالًا يحتذى» [@dar-al-tiraz، ص31]."
    - title: "المزهر في علوم اللغة"
      text: "للسيوطي، وهو عند شوقي ضيف «أكبر دائرة معارف فى المباحث اللغوية» [@deif، ج7 ص115]."
  texts:
    - title: "البردة «أمن تذكّر جيران بذي سلم» للبوصيري"
      text: "«ولا تزال هذه القصيدة وأختها الهمزية تنشد إلى اليوم فى حفلات الموالد وحلقات الذكر الصوفى» [@deif، ج7 ص365]، وقد خمّسها الشعراء وسبّعوها عشرات المرات [@deif، ج7 ص173]."
    - title: "خمرية ابن الفارض «شربنا على ذكر الحبيب مدامة»"
      text: "قمة الشعر الصوفي، ومعها تائيته الكبرى التي تبلغ «سبعمائة وستين بيتا أو تزيد» [@deif، ج7 ص360]."
    - title: "كتاب القاضي الفاضل بفتح القدس"
      text: "كتبه على لسان صلاح الدين إلى الخليفة، وهو عند شوقي ضيف «من أروع رسائله» [@deif، ج7 ص415]، ونصه في «صبح الأعشى» [@subh، ج8 ص284]."
    - title: "خطبة الجمعة الأولى في القدس بعد الفتح"
      text: "لمحيي الدين بن الزكي، أولها: «الحمد لله معزّ الإسلام بنصره، ومذلّ الشرك بقهره» [@deif، ج6 ص331]، وتُقرأ كاملة في «وفيات الأعيان» [@wafayat، ج4 ص231]."
    - title: "موشحات ابن سناء الملك"
      text: "بها نُقل الموشح إلى المشرق، «فإذا موشحاته لا تقل روعة موسيقية عن موشحات الأندلسيين» [@deif، ج7 ص178]."
    - title: "بديعية صفي الدين الحلي، وبديعية ابن حجة"
      text: "صارت القصيدة الواحدة كتابًا في البديع، قال ابن حجة في بديعيته: «وسميتها: تقديم أبي بكر» [@khizana-hamawi، ج1 ص18]."
    - title: "«طيف الخيال» لابن دانيال"
      text: "«وهى مسرحية شعرية نثرية» [@deif، ج7 ص382]، حاول أن يجعلها «قريبة قربا شديدا إلى عامية أهل القاهرة لزمنه» [@deif، ج7 ص382]."
    - title: "مقدمة ابن خلدون"
      text: "وفيها: «ويعبّر الحكماء عن هذا بقولهم الإنسان مدنيّ بالطّبع» [@ibn-khaldun، ج1 ص54]."
    - title: "«ألف ليلة وليلة» في صياغتها المصرية"
      text: "«وأهم من كل ما سبق لمصر فى الكتاب أنها هى التى صاغته بلغتها العامية وانتشر بها فى العالم العربى منذ القرن الثامن الهجرى» [@deif، ج7 ص489]."
  notes:
    poets: "وفي خطة العصر لامية ابن الوردي، ولم نوثقها بعد من مصادرنا المعتمدة."
