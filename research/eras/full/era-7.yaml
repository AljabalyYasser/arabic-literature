# النسخة الموسعة لصفحة الباب 7 كما كانت في الإيداع c39b4d6، قبل اختصارها.
# داخلي، لا يظهر في الموقع. كل ما فيها بإحالاته، ويُرجع إليه عند كتابة قضايا العصر ومسارات أعلامه.
# تنبيه: فيها آراء لشوقي ضيف وغيره لم تُنسب في المتن إلى أصحابها، وكتب لاحقة لم تُفصل عن كتب العصر. تُصحَّح عند استعمالها (docs/content-guide.md، «الرأي يُنسب في المتن»).
summary: "من نزول الحملة الفرنسية مصر سنة 1213هـ/1798م [@deif، ج1 ص14] إلى ما بعد الحرب العالمية الأولى. رأى العرب فيه علوم أوروبا، وجاءت المطبعة والصحافة والترجمة، فأحيا الشعراء أسلوب القدماء، وتحرر النثر من السجع، ووُلدت المقالة والرواية والمسرحية."
overview:
  history: |
    نزلت الحملة الفرنسية مصر سنة 1798م، «ورأى المصريون المطبعة التي جلبها نابليون معه، وكانت تطبع بالحروف العربية منشوراته» [@deif-muasir، ص13]، وتنبّهوا «إلى أن وراء حياتهم حياة أخرى في أوربا» [@deif-muasir، ص22]. ثم أرسل محمد علي منذ سنة 1826م البعوث إلى أوروبا، وعلى رأس أولها رفاعة الطهطاوي، وأنشأ مدرسة الألسن، ثم «تأسس قلم للترجمة سنة 1842» [@deif-muasir، ص23].

    وطُبعت كتب القدماء، «فلما طبعت لهم كليلة ودمنة لابن المقفع وكتابات الجاحظ وابن خلدون وغيرهم كما طبعت لهم دواوين أبي تمام وأبي نواس والمتنبي وأضرابهم رأوا أساليب جديدة» [@deif-muasir، ص30]. وصدرت «الوقائع المصرية» سنة 1828م [@deif-muasir، ص33]، وأنشأ علي مبارك دار الكتب المصرية سنة 1870م [@deif-muasir، ص32]. ونزل مصر كثير من أدباء الشام، «وقد نهضوا بصحافتنا خير نهوض»، وحملوا إليها فن التمثيل [@deif-muasir، ص25]. وكانت للشام نهضتها أيضًا: فيها صنع بطرس البُسْتانِيّ «دائرة المعارف» العربية [@zirikli، ج2 ص58]، واصطنع إبراهيم اليازِجِيّ حروف الطباعة العربية ببيروت [@zirikli، ج1 ص77].

    ثم قامت ثورة عُرابي سنة 1882م، فاستعان الخديوي بالإنجليز، «ومن حينئذ أصبحت مصر خاضعة» لهم [@deif-muasir، ص16]، وحوكم كتّاب المقالة مع زعماء الثورة [@deif-muasir، ص205]. واشتدت الحركة الوطنية بعد حادثة دِنْشِوَاي سنة 1906م [@deif-muasir، ص17]، وفتحت الجامعة المصرية أبوابها سنة 1908م [@deif-muasir، ص26]. وبعد الحرب العالمية الأولى وثورة 1919م «انتقلنا إلى دور جديد» [@deif-muasir، ص188]، وظهر «جيل كبير قد تم لمصر تثقفُه بالآداب الغربية ثقافة منظمة» [@deif-muasir، ص27].
  change: |
    تحرر النثر من السجع والبديع، و«انتصر الأسلوب الجديد، الأسلوب العربي المرسل» [@deif-muasir، ص182]، وهو الذي يجري بلا سجع. وصار الأدباء يكتبون للناس لا للأمراء، فلم يعودوا «يخاطبون بأدبهم ملوكًا وأمراء يتملقونهم»، «بل أصبحوا يخاطبون الجماهير» [@deif-muasir، ص36].

    وتجاذب الأدبَ تياران: إحياء القديم، والأخذ عن الغرب، فكان في القرن التاسع عشر «هذا الصراع الأدبي الطريف بين من يمكن أن نسميهم محافظين، ومن كانوا مجددين» [@deif-muasir، ص31]. وثبتت الفصحى، وأخفقت الدعوة إلى الكتابة بالعامية «واقتصرت على الصحف الفكاهية» [@deif-muasir، ص182].

    وفي أوائل القرن العشرين ظهر «جيل جديد تثقف ثقافة عميقة بالآداب الإنجليزية وغيرها من الآداب الغربية» [@deif-muasir، ص58]. أراد هذا الجيل أن يعبّر الشعر عن نفس الشاعر، فالشعر عند عبد الرحمن شكري «نسيج نفسه وليس نسيج الأحداث السياسية والعواطف القومية» [@deif-muasir، ص131].
  arts:
    - title: شعر الإحياء
      text: "عاد به البارودي ومن بعده إلى أسلوب القدماء، فكان «مذهبه الفني؛ بَعْثُ الأسلوب القديم في الشعر وتعمد إحيائه» [@deif-muasir، ص88]."
    - title: المقالة
      text: "دفعت الصحافة الأدباء «إلى إنشاء فن المقالة، وهو فن لم يعرفه العرب القدماء» [@deif-muasir، ص183]."
    - title: الخطابة السياسية والقضائية
      text: "«مصر إذن هي التي سبقت البلاد العربية إلى إنشاء الخطابة القضائية وإحياء الخطابة السياسية» [@deif-muasir، ص186]."
    - title: القصة والرواية
      text: "بدأت بالترجمة، ومرت بالمقامة التي صارت عند المويلحي «قصة اجتماعية طويلة» [@deif-muasir، ص187]، حتى كانت «زينب» لهيكل، و«المحاولة الثانية هي التي تعد بحق أول محاولة كاملة لنا في صنع قصة بالمعنى الغربي الحديث» [@deif-muasir، ص209]. ونقرؤها في العصر الحديث."
    - title: المسرحية
      text: "«فإن المسرحية لم يكن لها عندنا أصول؛ لسبب بسيط؛ هو أنه لم يوجد عندنا مسرح قديم» [@deif-muasir، ص213]. ثم أدخل شوقي التمثيل في الشعر، فألّف «سبع تمثيليات، ست منها مآس، وواحدة ملهاة» [@deif-muasir، ص80]."
    - title: الشعر الوجداني
      text: "شعر الذات عند جماعة الديوان وشعراء المهجر وجماعة أبولو، وشعراء المهجر «يتأثرون تأثرًا عميقًا بالنزعة الرومانسية الغربية» [@deif-muasir، ص163]. أما أبولو «فلم يكن لها هدف شعري ولا مذهب أدبي معين، بل هي جماعة كل شعر مصري» [@deif-muasir، ص70]."
  poets:
    - name: "ناصِيف اليازِجِيّ (ت 1287هـ / 1871م)"
      text: "من لبنان، «شاعر من كبار الأدباء في عصره» [@zirikli، ج7 ص350]."
    - name: "محمود سامي البارُودِيّ (ت 1322هـ / 1904م)"
      text: "رائد الإحياء، «وبما قدمنا كله كان البارودي أول المجددين في الشعر العربي الحديث» [@deif-muasir، ص91]."
    - name: "أحمد شَوْقِي (ت 1351هـ / 1932م)"
      text: "أمير الشعراء، «إنه سابق الشعراء في النصف الأول من هذا القرن غير منازَع ولا مدافَع» [@deif-muasir، ص120]، وأول من أدخل المسرحية في الشعر العربي [@deif-muasir، ص80]."
    - name: "حافِظ إبراهيم (ت 1351هـ / 1932م)"
      text: "شاعر النيل، «وكان حافظ هو الصوت الأول الذي لبى حاجة الجماعة المصرية» [@deif-muasir، ص106]."
    - name: "خَلِيل مُطْران (ت 1368هـ / 1949م)"
      text: "لبناني نزل مصر، «كان شاعرًا ممتازًا من شعراء النهضة الذين بثوا في الشعر العربي الحديث روح العصر»، ودعا إلى وحدة القصيدة [@deif-muasir، ص128]، أي أن تكون القصيدة كلها موضوعًا واحدًا متصلًا."
    - name: "جَمِيل صِدْقِي الزَّهاوِيّ (ت 1354هـ / 1936م)"
      text: "من بغداد، «شاعر، ينحو منحى الفلاسفة، من طلائع نهضة الأدب العربي في العصر الحاضر» [@zirikli، ج2 ص137]."
    - name: "مَعْرُوف الرُّصافِيّ (ت 1364هـ / 1945م)"
      text: "«شاعر العراق في عصره» [@zirikli، ج7 ص268]."
    - name: "عبد الرحمن شُكْرِي (ت 1378هـ / 1958م)"
      text: "رائد جماعة الديوان، «إنه شاعر وجداني ذاتي بالمعنى الكامل الذي يفهمه الغربيون عن الشاعر الغنائي» [@deif-muasir، ص131]."
    - name: "عباس محمود العَقّاد (ت 1383هـ / 1964م)"
      text: "شاعر الديوان وناقدها، «وتصدَّى العقاد لشوقي في كتاب \"الديوان\" سنة 1921» [@deif-muasir، ص137]."
    - name: "إيليا أبو ماضِي (ت 1377هـ / 1957م)"
      text: "«من كبار شعراء المهجر. ومن أعضاء (الرابطة القلمية) فيه» [@zirikli، ج2 ص35]."
    - name: "أحمد زكي أبو شادِي (ت 1374هـ / 1955م)"
      text: "مؤسس جماعة أبولو سنة 1932م [@deif-muasir، ص70]، «وسيرى القارئ أن قيادته لهذه الجماعة أقوى من شعره» [@deif-muasir، ص5]."
  writers:
    - name: "رِفاعة الطَّهْطاوِيّ (ت 1290هـ / 1873م)"
      text: "إمام البعثة وناظر مدرسة الألسن، وبه «كان ذلك بدء نهضتنا الأدبية المصرية؛ ولكنه كان بدْأً مضطربًا» [@deif-muasir، ص171]."
    - name: "محمد عَبْدُه (ت 1323هـ / 1905م)"
      text: "«فهو الذي أخرج كتاباتنا الصحفية من الدائرة البالية العتيقة دائرة السجع وما يرتبط به من أنواع البديع إلى دائرة الأسلوب الحر السليم» [@deif-muasir، ص227]."
    - name: "مصطفى لُطْفِي المَنْفَلُوطِيّ (ت 1343هـ / 1924م)"
      text: "كاتب المقالة العاطفية، «وكانت هذه الآثار المثل الأعلى للشباب في إنشائهم وفي صَقْل أساليبهم» [@deif-muasir، ص233]."
    - name: "محمد المُوَيْلِحِيّ (ت 1348هـ / 1930م)"
      text: "صاحب «حديث عيسى بن هشام»، «أديب، في إنشائه إبداع» [@zirikli، ج5 ص305]."
    - name: "جُبْران خَلِيل جُبْران (ت 1349هـ / 1931م)"
      text: "«نابغة الكتّاب المعاصرين في المهجر الأميركي، وأوسعهم خيالا» [@zirikli، ج2 ص110]."
    - name: "مصطفى صادق الرّافِعِيّ (ت 1356هـ / 1937م)"
      text: "«وكان محافظًا محافظة شديدة، ووضعته الظروف ليحمل راية القديم» [@deif-muasir، ص190]، حتى لقّبه شوقي ضيف «كاتب الإسلام والعروبة» [@deif-muasir، ص247]."
    - name: "إبراهيم عبد القادر المازِنِيّ (ت 1368هـ / 1949م)"
      text: "ناقد الديوان، «أما المازني فنقد شكري، ثم نقد المنفلوطي وأسلوبه نقدًا ثائرًا» [@deif-muasir، ص189]."
    - name: "طه حُسَيْن (ت 1393هـ / 1973م)"
      text: "«جدد مناهج، وأحدث ضجة في عالم الأدب العربيّ» [@zirikli، ج3 ص231]، ومضى «يختط طرقًا جديدة في أبحاثه الأدبية وفي عالم القصة» [@deif-muasir، ص284]."
  books:
    - title: "تخليص الإبريز في تلخيص باريز"
      text: "لرفاعة الطهطاوي، وفيه «أخذ يصف الحياة الفرنسية من جميع نواحيها المادية والاجتماعية والسياسية» [@deif-muasir، ص171]."
    - title: "الوسيلة الأدبية"
      text: "لحسين المَرْصَفِيّ، وكان «أكبر نبع» استقى منه شوقي، «وهو يضم بين دفتيه أروع ما للقدماء من نماذج» [@deif-muasir، ص114]."
    - title: "الشوقيات"
      text: "ديوان شوقي، «طبَع ديوانه للجمهور طبعته الأولى في سنة 1898» [@deif-muasir، ص117]."
    - title: "تحرير المرأة، والمرأة الجديدة"
      text: "لقاسم أمين، جمع مقالاته «في كتاب بعنوان \"تحرير المرأة\"، وأتبعه بكتاب آخر سماه \"المرأة الجديدة\"» [@deif-muasir، ص184]."
    - title: "النظرات"
      text: "للمنفلوطي، «وهي مجموعة كبيرة من المقالات الاجتماعية نشرها المنفلوطي في أوائل القرن بصحيفة \"المؤيد\"» [@deif-muasir، ص230]."
    - title: "حديث عيسى بن هشام"
      text: "للمويلحي، نشره حلقات في صحيفة، ثم جمعها «ويذيعها سنة 1906» [@deif-muasir، ص235]."
    - title: "إلياذة هوميروس"
      text: "ترجمها سليمان البُسْتانِيّ شعرًا، «مزاوجًا فيها بين البحور العربية ومبقيًا على كل سماتها وخصائصها الملحمية» [@deif-muasir، ص25]."
    - title: "الديوان في الأدب والنقد"
      text: "للعقاد والمازني، ومنه كانت حملة العقاد على شوقي سنة 1921م [@deif-muasir، ص137]."
  texts:
    - title: "«سل الجيزة الفيحاء عن هرمي مصر» للبارودي"
      text: "وصف بها الهرمين، «وهي أول قصيدة حديثة في آثارنا الفرعونية» [@deif-muasir، ص90]."
    - title: "«نهج البردة» لشوقي"
      text: "«الميمية التي عارض فيها بردة البوصيري» [@deif-muasir، ص112]، والمعارضة أن ينظم الشاعر على وزن قصيدة سابقة وقافيتها يباريها."
    - title: "«اللغة العربية تنعى حظها بين أهلها» لحافظ"
      text: "«وقد نشرها في أول القرن حين كانت تهب عاصفة العامية ضد العربية، وهي من غُرَرِ قصائده» [@deif-muasir، ص109]."
    - title: "«المساء» لمطران"
      text: "«وهي قصيدة باهرة، وبها كل طوابع الجديد عند خليل مطران، فهي تجربة شعورية كاملة» [@deif-muasir، ص126]."
    - title: "«الرحمة» للمنفلوطي"
      text: "من مقالات «النظرات»، وفيها ينادي: «الرحمة الرحمة!» [@deif-muasir، ص231]."
    - title: "«حديث عيسى بن هشام» للمويلحي"
      text: "مقامة طويلة صارت نقدًا لمجتمع عصره: «وهذا النموذج القصير تحول عند المويلحي إلى قصة اجتماعية طويلة» [@deif-muasir، ص187]."
    - title: "«في الشعر الجاهلي» لطه حسين"
      text: "«وأثار هذا البحث بما فيه من آراء جديدة ضجة واسعة في الناس والبرلمان» [@deif-muasir، ص193]. ونعود إليه في قضية الانتحال من العصر الجاهلي."
    - title: "«الأيام» لطه حسين"
      text: "سيرته، «فأخرج الجزء الأول منها في سنة 1929» [@deif-muasir، ص281]، و«في رأي كثير من النقاد الشرقيين والغربيين أن هذه القصة أروع ما كتبه طه حسين» [@deif-muasir، ص284]."
  notes:
    poets: "وفي خطة العصر ميخائيل نُعَيْمة من شعراء المهجر، ولم نجد له بعد سندًا في مصادرنا المعتمدة، ولا لتاريخ «الرابطة القلمية» التي جمعت شعراء المهجر في أمريكا."
