# النسخة الموسعة لصفحة الباب 3 كما كانت في الإيداع c39b4d6، قبل اختصارها.
# داخلي، لا يظهر في الموقع. كل ما فيها بإحالاته، ويُرجع إليه عند كتابة قضايا العصر ومسارات أعلامه.
# تنبيه: فيها آراء لشوقي ضيف وغيره لم تُنسب في المتن إلى أصحابها، وكتب لاحقة لم تُفصل عن كتب العصر. تُصحَّح عند استعمالها (docs/content-guide.md، «الرأي يُنسب في المتن»).
summary: "نحو تسعين سنة، من «عام الجماعة» سنة 41هـ [@zirikli، ج2 ص200] إلى سقوط دولة بني أمية سنة 132هـ [@deif، ج2 ص342]. عصرٌ اختلط فيه العرب بغيرهم وانتشروا في المشرق والمغرب، «مما أذكى فى نفوسهم جذوة الشعر» [@deif، ج2 ص5]: فيه النقائض، والشعر السياسي، والغزل بمدرستيه، وفي آخره وُلدت الكتابة الفنية."
overview:
  history: |
    صارت الخلافة إلى معاوية «وأصبحت وراثية فى هذا البيت» [@deif، ج2 ص183]، وقامت دولة بني أمية في الشام [@zirikli، ج7 ص261]. ولم يرضَ كثيرون بذلك، فانقسم الناس أحزابًا: أنصار بني أمية، والشيعة، والخوارج، والزبيريون. وكان الشعر يجري على كل لسان، «واتخذه الأمويون وخصومهم أداة للتعبير عن آرائهم السياسية المختلفة» [@deif، ج2 ص193].

    وتتابعت الأحداث الكبرى: قُتل الحسين بكَرْبَلاء سنة 61هـ [@zirikli، ج2 ص243]، فصار قتله في نفوس الشيعة «نارا حامية» [@deif، ج2 ص190]. وقامت فتنة ابن الزبير، فعادت العصبية القبلية، و«هيأت فى قوة لعودة أشعار الفخر والهجاء» [@deif، ج2 ص152]. وحارب الخوارج الدولة سنين طويلة، «وقد تطاير فيها شعر كثير» [@deif، ج2 ص189].

    وفي البصرة ظلت القبائل تتنافس طوال العصر [@deif، ج2 ص160]، وكان سوق المِرْبَد مسرح شعرائها. وكان العرب يستعينون في دواوين الدولة، أي سجلاتها، بالفرس في العراق وبالروم في مصر والشام، حتى «عرّبت تلك الدواوين» في عصر عبد الملك [@deif، ج2 ص201]، فنشأت «طبقة كبيرة من كتّاب محترفين» [@deif، ج2 ص466]. ثم قامت الثورة على بني أمية و«قوّضت حكمهم سنة 132 للهجرة» [@deif، ج2 ص342].
  change: |
    خرجت العربية من جزيرتها، «ومن حينئذ لم يعد اللسان العربى خاصّا بأبناء الجزيرة وحدهم» [@deif، ج2 ص169]، و«أصبحت لغة القرآن هى اللغة العامة» بين العرب في كل مكان [@deif، ج2 ص170]. ولما اختلطوا بغيرهم فشا اللحن، أي الخطأ في الإعراب، «وانتشار اللحن على هذه الشاكلة هو الذى دفع لظهور اللغويين والنحاة» [@deif، ج2 ص175].

    وفي مكة والمدينة كثر الغناء، فأثّر في الشعر: خفّت ألفاظه، وكان ذلك «أول دفعة قوية نحو تصفية الشعر العربى من ألفاظه البدوية الجافية». وتغيّر الغزل، فلم يعد بكاءً على الأطلال، «بل أصبح غالبا تصويرا لأحاسيس الحب» [@deif، ج2 ص348].

    وفي النثر أقام الوعّاظ أسلوبًا جديدًا «على الازدواج والترادف وتحلية الكلام بالأخيلة والمقابلات»، والازدواج أن تأتي الجمل أزواجًا متوازنة، فكانوا بذلك «أول من مهّد لوضع قواعد البلاغة العربية» [@deif، ج2 ص7]. ثم نقل الكتّاب هذا الأسلوب إلى رسائل الدولة، حتى صارت الرسالة عند عبد الحميد فنًّا أدبيًّا [@deif، ج2 ص485].
  arts:
    - title: النقائض
      text: "قصيدة يرد بها الشاعر على قصيدة خصمه، فينقض فخره ويهجوه. «وكأننا أصبحنا بإزاء مناظرات شعرية، وهى مناظرات كانت تتخذ سوق المربد مسرحا لها» [@deif، ج2 ص242]."
    - title: الشعر السياسي
      text: "الشعر «الذى صوّر فيه الزبيريون والخوارج والشيعة وغيرهم نظرياتهم فى الحكم» [@deif، ج2 ص6]."
    - title: الغزل العُذْرِيّ
      text: "«غزل نقى طاهر ممعن فى النقاء والطهارة، وقد نسب إلى بنى عذرة» [@deif، ج2 ص359]، وموطنه بوادي نجد والحجاز."
    - title: الغزل الصريح
      text: "غزل مكة والمدينة، يصرّح فيه الشاعر بحبه وزياراته لمحبوباته، «وعلى رأسهم عمر بن أبى ربيعة والأحوص والعرجىّ» [@deif، ج2 ص349]."
    - title: الرَّجَز
      text: "طالت الأرجوزة، وهي القصيدة من بحر الرجز، و«سلكوا فيها الطّرديّات»، أي شعر الصيد [@deif، ج2 ص6]. ثم صارت أراجيز رُؤْبة «متون لغوية كاملة» يحفظها أهل اللغة [@deif، ج2 ص404]."
    - title: الخطابة والرسائل
      text: "«ولعل عصرا عربيّا لم تزدهر فيه الخطابة كما ازدهرت فى عصر بنى أمية» [@deif، ج2 ص6]. وفي آخره كتب عبد الحميد «رسائل أدبية لا يقصد بها إلى سياسة» [@deif، ج2 ص485]."
  poets:
    - name: "جَرِير (ت 110هـ)"
      text: "«لا يبارى فى عذوبة كلمه وحلاوة نغمه» [@deif، ج2 ص289]. هو والفرزدق والأخطل «الثلاثة المتفق على أنهم أشعر أهل عصرهم» [@zirikli، ج5 ص123]."
    - name: "الفَرَزْدَق (ت 110هـ)"
      text: "خصم جرير في النقائض، وقالوا في شعره: «لولا شعره لذهب ثلث لغة العرب» [@deif، ج2 ص275]."
    - name: "الأَخْطَل (ت 90هـ)"
      text: "التَّغْلِبيّ، شاعر الدولة في عهد عبد الملك، أمر «من يعلن بين الناس أنه شاعر بنى أمية وشاعر أمير المؤمنين» [@deif، ج2 ص262]."
    - name: "عُمَر بن أبي رَبِيعة (ت 93هـ)"
      text: "رأس الغزل الصريح، خلّف «أضخم ديوان لا فى عصره فحسب، بل فى جميع العصور العربية» [@deif، ج2 ص350]."
    - name: "جَمِيل بُثَيْنة (ت 82هـ)"
      text: "«لعل حياة جميل أوضح حياة بين الشعراء العذريين»، ولذلك كان شعره «أوثق شعر العذريين» [@deif، ج2 ص367]."
    - name: "كُثَيِّر عَزّة (ت 105هـ)"
      text: "صاحب عزّة، وكان عند المرزباني «شاعر أهل الحجاز في الإسلام، لا يقدمون عليه أحدا» [@zirikli، ج5 ص219]. ويعدّه شوقي ضيف في شعراء الشيعة [@deif، ج2 ص319]."
    - name: "مَجْنون لَيْلى"
      text: "أشهر عشاق العرب، والرواة يشكّون في وجوده. قال الأصمعي: «رجلان ما عرفا فى الدنيا قط إلا بالاسم: مجنون بنى عامر وابن القرّيّة» [@deif، ج2 ص360]."
    - name: "ذُو الرُّمّة (ت 117هـ)"
      text: "«أكبر شاعر يتغنى بالصحراء العربية» [@deif، ج2 ص391]. وقال أبو عمرو بن العلاء: «فتح الشعر بإمرئ القيس وختم بذي الرمة» [@zirikli، ج5 ص124]."
    - name: "الكُمَيْت (ت 126هـ)"
      text: "شاعر الهاشميين، «نهج بشعره نهجا جديدا، إذ أخضعه لصورة المقالة المعاصرة له وما تشفع به من براهين وأدلة» [@deif، ج2 ص326]."
    - name: "ابن قَيْس الرُّقَيّات (ت نحو 85هـ)"
      text: "«فهو شاعر الزبيريين ونظريتهم السياسية غير مدافع» [@deif، ج2 ص293]."
  writersTitle: الخطباء والكتّاب
  writers:
    - name: "عَبْد الحَمِيد الكاتِب (ت 132هـ)"
      text: "«أبلغ كتّاب هذا العصر وأبرعهم»، حتى قيل: «فتحت الرسائل بعبد الحميد وختمت بابن العميد» [@deif، ج2 ص474]."
    - name: "زِياد بن أبيه (ت 53هـ)"
      text: "«وكان خطيبا لا يبارى فى جودة خطابته» [@deif، ج2 ص424]."
    - name: "الحَجّاج (ت 95هـ)"
      text: "«يعدّ فى الذروة من أهل الخطابة والبيان فى العصر، حتى ليوضع مع زياد بن أبيه فى طبقة واحدة» [@deif، ج2 ص420]."
    - name: "الحَسَن البَصْرِيّ (ت 110هـ)"
      text: "من الوعّاظ، و«يعدّ أخطب خطبائهم وأبلغ بلغائهم» [@deif، ج2 ص445]. وهو «أكبر من ثبّتوا فى هذا العصر ذلك الأسلوب المونق الذى تأثّر به عبد الحميد» [@deif، ج2 ص450]."
    - name: "الأَحْنَف بن قَيْس (ت 72هـ)"
      text: "خير من يمثّل خطابة المحافل «بين أيدى الخلفاء والولاة» [@deif، ج2 ص484]."
  books:
    - title: "النقائض"
      text: "نقائض جرير والفرزدق بشرح أبي عُبَيْدة (ت 209هـ)، يستعين فيه بأيام العرب «بحيث تعدّ وثائق تاريخية طريفة» [@deif، ج2 ص245]."
    - title: "ديوان جرير"
      text: "برواية محمد بن حَبِيب (ت 245هـ) [@diwan-jarir، ج1 ص45]، ومنه نقرأ جريرًا."
    - title: "ديوان ذي الرمة"
      text: "بشرح أبي نصر الباهِلِيّ صاحب الأصمعي، ويفتتح بالبائية التي قال الأصمعي إنه «لم يزل يزيد على كلمته التي على الباء حتى مات» [@diwan-dhi-al-rumma، ج1 ص8]."
    - title: "الهاشميات"
      text: "مدائح الكميت في بني هاشم، «وهاشمياته مطبوعة ومشهوره» [@deif، ج2 ص192]."
    - title: "بواكير التأليف"
      text: "في هذا العصر بدأ العرب يؤلفون: كتب عَبِيد بن شَرِيّة «أخبار الأمم الماضية» [@deif، ج2 ص454]، ووضع يونس الكاتب «أول كتاب فى الغناء» [@deif، ج2 ص455]."
    - title: "الأغاني"
      text: "لأبي الفَرَج الأصفهاني (ت 356هـ)، وفيه أكثر أخبار شعراء العصر، فقد «فتح لهم فى كتابه فصولا طويلة» [@deif، ج2 ص486]."
    - title: "البيان والتبيين"
      text: "للجاحظ (ت 255هـ)، ومنه نقرأ خطب العصر، وقد «وقف الجاحظ طويلا فى كتابه البيان والتبيين يشيد بقدرتهم الخطابية» [@deif، ج2 ص405]."
  texts:
    - title: "«أقلّي اللوم عاذل والعتابا» لجرير"
      text: "هجا بها الراعي النُّمَيْرِيّ، وفيها «فغضّ الطرف إنك من نمير» [@diwan-jarir، ج2 ص813–821]. ويسوق شوقي ضيف خبرها صورةً لشاعر النقائض في المربد [@deif، ج2 ص244]."
    - title: "«خفّ القطين فراحوا منك أو بكروا» للأخطل"
      text: "قد تكون أروع نقائضه مع جرير، ويستهلها بالنسيب، أي الغزل في أول القصيدة، ووصف حزنه لفراق أحبته [@deif، ج2 ص253]."
    - title: "«أتصحو بل فؤادك غير صاح» لجرير"
      text: "المدحة التي فيها «ألستم خير من ركب المطايا» [@diwan-jarir، ج1 ص85–89]. ويعدّ شوقي ضيف جريرًا بها «شاعرا سياسيا بالمعنى التام، شاعرا يحامى عن نظرية الأمويين فى الحكم» [@deif، ج2 ص282]."
    - title: "«أمن آل نعم أنت غاد فمبكر» لعمر بن أبي ربيعة"
      text: "قصيدة يحكي فيها مغامرة ليلية، فيصور «اقتحامه لليل والأهوال والأحراس على بعض صواحبه» [@deif، ج2 ص353]."
    - title: "«ألا ليت شعري هل أبيتنّ ليلة» لجميل"
      text: "نموذج الغزل العذري، «وهو يرتل غزله كأنه صلوات يودعها عبادته» [@deif، ج2 ص369]."
    - title: "«ما بال عينك منها الماء ينسكب» لذي الرمة"
      text: "في نحو مئة بيت «يصور ثلاثة مشاهد رائعة من مشاهد الصحراء» [@deif، ج2 ص392]. وقال جرير: «لو خرس ذو الرمة بعد قصيدته: \" ما بال عينك منها الماء ينسكب \" لكان أشعر الناس» [@zirikli، ج5 ص124]."
    - title: "خطبة زياد «البتراء»"
      text: "خطبها بالبصرة، وهي عند شوقي ضيف «أروع خطبة سياسية» في العصر [@deif، ج2 ص424]. وسُمّيت البتراء لأنه «لم يحمد الله فيها، ولم يصل على النبي» [@bayan، ج2 ص40]."
    - title: "خطبة الحجاج بالكوفة «أنا ابن جلا وطلّاع الثنايا»"
      text: "ذروة خطابة الوعيد السياسي [@deif، ج2 ص420]، وتُقرأ في البيان والتبيين [@bayan، ج2 ص210]."
    - title: "رسالة عبد الحميد إلى الكتّاب"
      text: "«تعدّ دستورا دقيقا لوظيفة الكاتب» [@deif، ج2 ص474]، وبها وأمثالها «تحولت الرسائل عنده إلى رسائل أدبية حقيقية» [@deif، ج2 ص478]."
  notes:
    texts: "وتشتهر للفرزدق قصيدة «هذا الذي تعرف البطحاء وطأته»، لكن شوقي ضيف يشك في نسبتها إليه [@deif، ج2 ص273]."
