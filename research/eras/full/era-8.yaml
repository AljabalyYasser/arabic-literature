# النسخة الموسعة لصفحة الباب 8 كما كانت في الإيداع c39b4d6، قبل اختصارها.
# داخلي، لا يظهر في الموقع. كل ما فيها بإحالاته، ويُرجع إليه عند كتابة قضايا العصر ومسارات أعلامه.
# تنبيه: فيها آراء لشوقي ضيف وغيره لم تُنسب في المتن إلى أصحابها، وكتب لاحقة لم تُفصل عن كتب العصر. تُصحَّح عند استعمالها (docs/content-guide.md، «الرأي يُنسب في المتن»).
summary: "يبدأ حيث تنتهي النهضة، بعد الحرب العالمية الأولى، ويمتد إلى اليوم. فيه تغيّر شكل القصيدة: بقي العمود، وظهر إلى جانبه شعر التفعيلة، ونضجت الرواية والقصة القصيرة والمسرحية حتى صارت فنونًا عربية كاملة."
overview:
  history: |
    يرى شوقي ضيف أن «أدبنا المصري الحديث إنما يتم بمعناه الكامل بعد الحرب الأولى في هذا القرن» [@deif-muasir، ص200]. وفي الحرب العالمية الثانية «أُغْلق البحر الأبيض أمام أدبائنا، فلم تعد تَرِدُ إليهم القصص الغربية، فعكفوا على أنفسهم»، فنضجت القصة على أيديهم [@deif-muasir، ص211–212].

    ثم «نشبت معركتنا، بل معركة العرب قاطبة، مع إسرائيل»، وقامت ثورة 23 يوليو سنة 1952م في مصر [@deif-muasir، ص75]. «وقد دفعت هذه الأحداث الخطيرة شعرنا إلى تطور واسع في مضمونه»، حتى «أصبح الشاعر لا يعيش لنفسه وحدها، بل يعيش أيضًا للجماعة» [@deif-muasir، ص75–76].

    واتسع التعليم، ففتحت مصر «ثلاث جامعات: جامعة عين شمس، وجامعة الإسكندرية، وجامعة أسيوط، ثم الجامعات الإقليمية» [@deif-muasir، ص197]، ونشأ «أدب صحافي وإذاعي لم يكن يعرفه أسلافنا، وهو أدب سريع» [@deif-muasir، ص203]. وكتب العقاد سنة 1960م أن الشعر لم يعد وحده ميدان العاطفة والخيال، «بل تشاركه فيه الصور المتحركة والقصص المطولة والنوادر الموجزة، ومناظر التمثيل ومسموعات الإذاعة» [@aqqad-lugha، ص93].

    وأكثر ما في هذه الصفحة عن مصر، لأن مصدرنا المعتمد الأول لهذا العصر كتاب شوقي ضيف «الأدب العربي المعاصر في مصر»، وقد كتبه بين سنتي 1957 و1961م [@deif-muasir، ص6–8]. أما ما بعد ذلك، وأدب العراق والشام والمغرب والجزيرة، فنكمله حين نبلغ هذا العصر ونعتمد مصادره.
  change: |
    تجدّد شكل القصيدة في فرعين: فرع «يستند على تراثنا السابق» من المزدوج والموشحات والرباعيات، وفرع «يستند على صور الشعر الغربي» [@deif-muasir، ص77]. فجُرّب الشعر المرسل، وهو الذي تُلغى فيه القافية، فلم يُصب «النجاح المنشود» [@deif-muasir، ص78]. ثم جاء «الشعر الحر»، وهو ما نسميه اليوم شعر التفعيلة، والتفعيلة وحدة الوزن في البحر، مثل «فاعلن» و«مستفعلن». وهو عند شوقي ضيف شعر «لا تتخفف فقط من القافية، بل تتخفف أيضًا من أثقال العروض، بحيث يمكن أن يتألف بيت من تفعيلة أو تفعيلتين، وبيت ثان يليه من ثلاث تفعيلات أو أكثر» [@deif-muasir، ص78].

    واختلف النقاد فيه. كتب شوقي ضيف أنه «قد كثر من يصنعونها في هذه الأيام بحجة أنها تقضي على الحشو ورتابة القوافي»، ثم قال: «ونزعم زعمًا أنها لن تعيش بيننا طويلا إلا إذا دعمها أصحابها بقيم صوتية كثيرة تتلافى ما فقدته من أنغام القافية وتقابل الشطور» [@deif-muasir، ص78]. ورأى العقاد أن أوزان الشعر العربي «قائمة على أساس صالح للبناء عليه، وتجديد الأنماط والأشكال فيه» [@aqqad-lugha، ص86]. ولأصحاب التفعيلة رأي آخر نعرضه في بابه حين نعتمد مصادره.

    وفي النثر نشأت لغة وسطى، إذ «بدا للعِيَان أن أدباءنا ينشئون لغة جديدة بين العربية والعامية، فيها فصاحة الأولى وجزالتها، وفيها سهولة الثانية» [@deif-muasir، ص201].
  arts:
    - title: القصيدة العمودية
      text: "بقيت إلى جانب الجديد، ودافع عنها العقاد، فالغرب عنده ليس فيه «من فنون النظم جديد نأخذ منه في أبواب التوزين والتنويع» [@aqqad-lugha، ص87]."
    - title: شعر التفعيلة
      text: "«الشعر الحر» بلفظ معاصريه. ويرى شوقي ضيف أن «شعراء المهاجر الأمريكي هم أول من صنعوا منظومات في هذه الصورة الغربية وتأثرهم أبو شادي في بعض أشعاره» [@deif-muasir، ص78]. وهذا رأيه، ولغيره في ريادته رأي آخر نعرضه في بابه."
    - title: شعر الوجدان الجماعي
      text: "اسم وضعه شوقي ضيف لشعر «المكافح في سبيل الجماعة» بعد الحرب الثانية [@deif-muasir، ص76]."
    - title: الرواية
      text: "«أما القصة الاجتماعية الطويلة التي بدأها هيكل، فإنها خطت خطوات واسعة» بعد الحرب الأولى [@deif-muasir، ص210]، حتى «أصبحت عندنا قصة مصرية فعلًا» [@deif-muasir، ص212]."
    - title: القصة القصيرة
      text: "سمّاها معاصروها الأقصوصة، «وقد كثر بعد الحرب الأولى من يكتبون الأقصوصة كتابة فنية بارعة» [@deif-muasir، ص210]."
    - title: المسرحية
      text: "في النثر «ظهر توفيق الحكيم فوثب به وثبة لم يكن يحلم بها كل من سبقوه» [@deif-muasir، ص216]، وفي الشعر خلف شوقيَ عزيز أباظة [@deif-muasir، ص82]."
  poets:
    - name: "بِشارة الخُورِي، الأخطل الصغير (ت 1388هـ / 1968م)"
      text: "من حراس العمود في لبنان، و«أشهر شعراء لبنان في العصر الحديث» [@zirikli، ج2 ص53]."
    - name: "عزيز أباظة (ت 1393هـ / 1973م)"
      text: "«وتقلّ هذه المحاولات التمثيلية في الشعر بعد شوقي حتى يتاح لها شاعر معاصر هو عزيز أباظة»، ومن مسرحياته «قيس ولبنى» و«العباسة» و«شجرة الدر» [@deif-muasir، ص82]."
    - name: "بَدْر شاكر السَّيّاب (ت 1384هـ / 1964م)"
      text: "«أديب عراقي، كثير النظم»، ومن دواوينه «أنشودة المطر» و«المعبد الغريق» [@zirikli، ج2 ص45]."
  writers:
    - name: "محمد حسين هَيْكَل (ت 1376هـ / 1956م)"
      text: "صاحب «زينب»، «وهي أول محاولة قصصية بارعة في أدبنا، عمد فيها إلى وصف حياة الريف والفلاحين» [@deif-muasir، ص270]."
    - name: "توفيق الحَكِيم"
      text: "رائد المسرح النثري، «أوجد لنا مسرحًا مصريًّا، له فلسفته التي يقف بها بجانب المسارح الغربية القديمة والحديثة» [@deif-muasir، ص294]."
    - name: "محمود تَيْمُور (ت 1393هـ / 1973م)"
      text: "«مؤسس فن الأقصوصة في الأدب العربي الحديث»، «فهو أستاذ الأقصوصة في عصرنا غير منازَع» [@deif-muasir، ص302]."
    - name: "نَجِيب مَحْفُوظ"
      text: "«فيُعْنَى بتصوير الطبقات الوسطى والشعبية وما تخضع له من الظروف المختلفة في البيئة والمجتمع» [@deif-muasir، ص211]."
    - name: "محمد مَنْدُور (ت 1384هـ / 1965م)"
      text: "ناقد، «وكان من كبار النقاد» [@zirikli، ج7 ص111]."
  books:
    - title: "زينب"
      text: "لهيكل، قال في مقدمتها: «نشرت هذه القصة للمرة الأولى في سنة 1914» [@haykal-zaynab، ص9]، وهي عند شوقي ضيف «أول محاولة كاملة لنا في صنع قصة بالمعنى الغربي الحديث» [@deif-muasir، ص209]."
    - title: "عودة الروح"
      text: "للحكيم، «ونشرها في سنة 1933 في جزأين»، يعرض فيها «المحيط الاجتماعي في بلاده قبل ثورة سنة 1919» [@deif-muasir، ص289]."
    - title: "اللغة الشاعرة"
      text: "للعقاد، صدر سنة 1960م، وفيه فصل «الشعر العربي والمذاهب الغربية الحديثة» يدافع فيه عن أوزان الشعر العربي [@aqqad-lugha، ص81–93]."
    - title: "الأدب العربي المعاصر في مصر"
      text: "لشوقي ضيف، كتبه في لحظة التحول نفسها، وفيه أول وصف للشعر الحر في مصادرنا [@deif-muasir، ص77–78]."
  texts:
    - title: "«أهل الكهف» للحكيم"
      text: "قال فيها طه حسين: «إنها حَدَثٌ في تاريخ الأدب العربي، وإنها تضاهي أعمال فطاحل أدباء الغرب» [@deif-muasir، ص294]."
    - title: "«شهرزاد» للحكيم"
      text: "«ولعل ذلك ما جعل الغربيين يترجمون آثاره إلى لغاتهم؛ بل لقد مثَّلوا بعض مسرحياته، وخاصة شهرزاد» [@deif-muasir، ص294]."
    - title: "«قيس ولبنى» لعزيز أباظة"
      text: "من مسرحياته الشعرية على طريقة شوقي [@deif-muasir، ص82]."
  notes:
    poets: "وفي خطة هذا العصر شعراء لم نجد لهم بعد سندًا في مصادرنا المعتمدة، فلا نكتب عنهم هنا حتى نعتمد مصادرهم: الجَواهِرِيّ، وعمر أبو رِيشة، وبَدَوِيّ الجَبَل، والبَرَدُّونِيّ، ونازِك الملائكة، وأدونيس، ومحمد الماغُوط، ونِزار قَبّانِي، ومحمود دَرْوِيش. ولا نجد فيها بعدُ ما يوثق ريادة نازك والسيّاب لشعر التفعيلة."
    writers: "وفي خطة العصر الطَّيِّب صالح، ويوسف إدريس، وزكريا تامر، ولم نجد لهم بعد سندًا في مصادرنا المعتمدة."
    texts: "ولم نجد بعد في مصادرنا المعتمدة نصًّا من شعر التفعيلة أو قصيدة النثر، ولا من شعر نزار قباني ومحمود درويش، ولا من روايات نجيب محفوظ. وتُضاف حين نعتمد مصادرها."
