# النسخة الموسعة لصفحة الباب 5 كما كانت في الإيداع c39b4d6، قبل اختصارها.
# داخلي، لا يظهر في الموقع. كل ما فيها بإحالاته، ويُرجع إليه عند كتابة قضايا العصر ومسارات أعلامه.
# تنبيه: فيها آراء لشوقي ضيف وغيره لم تُنسب في المتن إلى أصحابها، وكتب لاحقة لم تُفصل عن كتب العصر. تُصحَّح عند استعمالها (docs/content-guide.md، «الرأي يُنسب في المتن»).
summary: "نحو ثمانية قرون، من فتح العرب للأندلس سنة 92هـ/711م إلى خروجهم منها سنة 897هـ/1492م [@deif، ج8 ص5]. بدأ أدبها يحاكي المشرق، ثم صارت له شخصيته: فيه الموشح والزجل، وشعر الطبيعة، ورثاء المدن الضائعة."
overview:
  history: |
    فتح العرب الأندلس سنة 92هـ، وظل الشعر فيها «محدودا زمن الولاة» حتى عهد عبد الرحمن الأوسط (206–238هـ)، وهو «بدء الازدهار الحضارى والثقافى بالأندلس، وأيضا بدء الازدهار الأدبى» [@deif، ج8 ص137]. ثم أعلن عبد الرحمن الناصر نفسه خليفة في أواخر سنة 316هـ، «وبذلك تكاملت للأندلس شخصيتها السياسية» [@deif، ج8 ص31]، وصار جامع قرطبة في عهد ابنه الحكم «جامعة كبرى» [@deif، ج8 ص32].

    ثم كانت الفتنة، وانقسمت الأندلس دويلات يحكمها ملوك الطوائف، «وتنافست هذه البلدان تنافسا أدى إلى طور حضارى راق كما أدى إلى نهضة واسعة فى الأدب والعلم» [@deif، ج8 ص35]. فبعد أن «كانت قرطبة وحدها هى التى تنثر الدنانير» على الشعراء، تعددت المراكز التي تغدق عليهم [@deif، ج8 ص142].

    وأخذ الإسبان المدن واحدة بعد أخرى: طُلَيْطِلة سنة 478هـ، فعبر المرابطون من المغرب والتقى الجمعان في الزَّلّاقة سنة 479هـ [@deif، ج8 ص39]، ثم قرطبة سنة 633هـ وإشبيلية سنة 646هـ [@deif، ج8 ص43]. وبقيت غَرْناطة وحدها لبني الأحمر [@deif، ج8 ص44]، حتى سلّم أبو عبد الله الصغير «مفاتيح المدينة لفرناند وزوجته إيزابيلا سنة 897 للهجرة» [@deif، ج8 ص538]. وهاجر كثير من الأندلسيين إلى المغرب والمشرق «حاملين معهم علومهم وآدابهم» [@deif، ج8 ص145].
  change: |
    تعرّب أهل البلاد حتى من بقي منهم على النصرانية. وأقوى دليل على ذلك عند شوقي ضيف صرخة قسٍّ يتحسّر على شبان النصارى يهملون لغتهم اللاتينية «بينما يقبلون فى شغف على تعلم العربية» [@deif، ج8 ص6].

    وبدأ الأدب الأندلسي يحاكي المشرق، حتى قال الصاحب بن عبّاد حين قرأ «العقد الفريد»: «هذه بضاعتنا ردّت إلينا» [@deif، ج8 ص189]. وشكا ابن بسّام أن أهل الأندلس «أبوا إلا متابعة أهل الشرق»، فجمع في «الذخيرة» «محاسن أهل بلدي وعصري» [@dhakhira، ج1 ص12]. ثم استقلت شخصيته، فابتكر الموشح والزجل، وأدخل العامية الأندلسية في الأدب، فكانت ألفاظ الخرجة، وهي آخر أقفال الموشح، «أعجمية أو عامية» [@deif، ج8 ص151].

    وشاركت المرأة في الأدب، «وكانت لبعضهن ندوات يؤمها بعض الشعراء ورجال الأدب والفكر» [@deif، ج8 ص8]. وفي آخر العصر غلب التكلف، وصار «التصنع بدع العصر للإتيان بمحسنات البديع من جناس وطباق ولف ونشر وتوريات» [@deif، ج8 ص293].
  arts:
    - title: الموشح
      text: "فن أندلسي، عرّفه ابن سناء المُلْك: «الموشح كلام منظوم على وزن مخصوص، وهو يتألف في الأكثر من ستة أقفال وخمسة أبيات» [@dar-al-tiraz، ص32]، والأقفال والأبيات أجزاؤه التي تتناوب فيه. وأول من اخترع طريقته بالأندلس «محمد بن محمود القبري الضرير» [@dhakhira، ج1 ص469]."
    - title: الزجل
      text: "نظمت العامة على طريقة الموشح «بلغتهم الحضرية من غير أن يلتزموا فيها إعرابا، واستحدثوا فنا سموه بالزجل»، كما يقول ابن خلدون [@deif، ج8 ص165]."
    - title: شعر الطبيعة
      text: "«وتبلغ الأندلس فى شعر الطبيعة ذروة لعل إقليما عربيا لم يبلغها على مر العصور» [@deif، ج8 ص542]، وكثيرًا ما يمتزج بالغزل والخمر [@deif، ج8 ص293]."
    - title: الغزل
      text: "«وفيه تتفوق الأندلس-فى رأينا- على جميع البلدان العربية بما بثّت فيه من لوعات وجد لحب عذرى عفيف» [@deif، ج8 ص7–8]."
    - title: رثاء الممالك والاستصراخ
      text: "رثوا دولهم «حين تغرب شمسها وتدور عليها الدوائر» [@deif، ج8 ص9]، واستنجدوا بالمسلمين، فأخذت «قصائد الاستنفار والاستصراخ وطلب الغوث والعون تتكاثر فى الأندلس منذ عصر أمراء الطوائف» [@deif، ج8 ص378]."
    - title: النثر الفني
      text: "«وازدهر النثر فى الأندلس ازدهارا لا يقل عن ازدهار الشعر فيها» [@deif، ج8 ص543]، «وتتميز الأندلس بكثرة الرسائل الأدبية الخالصة» [@deif، ج8 ص10]."
  poets:
    - name: "ابن دَرّاج القَسْطَلِّيّ (ت 421هـ)"
      text: "قال فيه الثعالبي: «كان بصقع الأندلس كالمتنبى بصقع الشام» [@deif، ج8 ص193]."
    - name: "عُبادة بن ماء السماء (ت 422هـ)"
      text: "«وكان عبادة-بحق-إمام الشعراء فى زمنه» [@deif، ج8 ص309]. وهو الذي أقام الموشحات بعد القبري، «فكأنها لم تسمع بالأندلس إلا منه، ولا أخذت إلا عنه» [@dhakhira، ج1 ص469]."
    - name: "ابن زَيْدُون (ت 463هـ)"
      text: "«من أعلام الشعر والنثر فى الأندلس» [@deif، ج8 ص282]، «وغزله يعدّ فى الذروة من الغزل العربى» [@deif، ج8 ص284]."
    - name: "وَلّادة بنت المُسْتَكْفِي (ت 484هـ)"
      text: "شاعرة أحبها ابن زيدون، «وكان مجلسها بقرطبة منتدى لأحرار المصر» [@deif، ج8 ص282]."
    - name: "المُعْتَمِد بن عَبّاد (ت 488هـ)"
      text: "أمير إشبيلية، «إذ كان شاعرا كبيرا وله ديوان شعر منشور» [@deif، ج8 ص141]. ثم زال ملكه، فانتهى أسيرًا في المغرب يبكيه [@deif، ج8 ص340]."
    - name: "ابن عَبْدُون (ت 529هـ)"
      text: "أشاد به من ترجموا له، «وخاصة برائيته التى رثى فيها دولة المتوكل ببطليوس» [@deif، ج8 ص345]."
    - name: "ابن خَفاجة (ت 533هـ)"
      text: "«وأهم موضوع استنفد أكثر شعره واشتهر به وصف الطبيعة حتى سماه الأندلسيون الجنّان» [@deif، ج8 ص319]، أي البستانيّ."
    - name: "ابن قُزْمان (ت 555هـ)"
      text: "«فصار إمام أهل الزجل المنظوم بكلام عامة الأندلس» [@deif، ج8 ص168]."
    - name: "أبو البَقاء الرُّنْدِيّ (ت 684هـ)"
      text: "«وقد طارت شهرة أبى البقاء الرندى شرقا وغربا لقصيدته النونية» في رثاء الأندلس [@deif، ج8 ص389]."
    - name: "ابن زَمْرَك"
      text: "شاعر غرناطة في آخر العصر، وأبياته في قصر الحمراء «لا تزال ترصع البهو إلى اليوم» [@deif، ج8 ص210]."
  writers:
    - name: "ابن عَبْد رَبِّه (ت 328هـ)"
      text: "صاحب «العقد الفريد»، وكان عند ابن حيّان «زعيمهم وسابق حلبتهم» في شعراء زمانه [@deif، ج8 ص138]."
    - name: "ابن شُهَيْد (ت 426هـ)"
      text: "«لولا ما احتفظ به ابن بسام من رسائله وخاصة من رسالته التوابع والزوابع لفقد النثر الأندلسى دررا بديعة من لآلئه وروائعه» [@deif، ج8 ص451]."
    - name: "ابن حَزْم (ت 456هـ)"
      text: "صاحب «طوق الحمامة»، وهو عند إحسان عباس «صورة الأندلس نفسها حين أرادت لذاتها شخصية مستقلة» [@abbas-qurtuba، ص3]."
    - name: "ابن حَيّان (ت 469هـ)"
      text: "مؤرخ الأندلس، و«كتابات ابن حيان فى المقتبس وغيره طراز من الكتابة التاريخية الأدبية لا مثيل له قبله ولا بعده» [@deif، ج8 ص504]."
    - name: "ابن بَسّام (ت 542هـ)"
      text: "صاحب «الذخيرة»، «ترجم فيه ابن بسام لشعراء عصر أمراء الطوائف وأوائل عصر المرابطين وكتّابهما ترجمات ضافية» [@deif، ج8 ص505]."
    - name: "ابن طُفَيْل (ت 581هـ)"
      text: "صاحب «حي بن يقظان»، «وهو فى الذروة من الفكر الأندلسى» [@deif، ج8 ص512]."
    - name: "حازِم القَرْطاجَنِّيّ (ت 684هـ)"
      text: "صاحب «منهاج البلغاء». كان النقد الأندلسي قبله يرتكز على نقد المشارقة، فأدخل فيه ما نُقل عن اليونان في كتابي «الشعر» و«الخطابة» لأرسطو [@deif، ج8 ص104]."
    - name: "لِسان الدين بن الخَطِيب (ت 776هـ)"
      text: "«أكبر كتاب غرناطة والأندلس فى أزمنتها الأخيرة» [@deif، ج8 ص417]، وقال فيه ابن خلدون: «كان آية من آيات الله فى النظم والنثر والمعارف والأدب» [@deif، ج8 ص419]."
  books:
    - title: "العقد الفريد"
      text: "لابن عبد ربه، موسوعة أدبية، «فالكتاب مشرقى خالص» [@deif، ج8 ص189]. قال في مقدمته: «وسمّيته كتاب (العقد الفريد) لما فيه من مختلف جواهر الكلام، مع دقة السّلك وحسن النّظام» [@iqd، ج1 ص7]."
    - title: "طوق الحمامة"
      text: "لابن حزم، «ألفه فى سكناه بشاطبة سنة 418 أو 419 وموضوعه دراسة الحب العذرى» [@deif، ج8 ص497]."
    - title: "الذخيرة في محاسن أهل الجزيرة"
      text: "لابن بسام، «وقد ترجم لأكثر من مائة شاعر أندلسى» [@deif، ج8 ص7]."
    - title: "المقتبس"
      text: "لابن حيان في تاريخ الأندلس، «وهو نموذج فريد فى كتابة التاريخ كتابة تحليلية بصيرة» [@deif، ج8 ص11]."
    - title: "حي بن يقظان"
      text: "لابن طفيل، قصة فلسفية، وهي «من أروع الأعمال النثرية الأندلسية، بل العربية عامة» [@deif، ج8 ص11]."
    - title: "منهاج البلغاء وسراج الأدباء"
      text: "لحازم، بقيت منه «ثلاثة أقسام تتناول صناعة الشعر وطريقة نظمه» [@deif، ج8 ص104]."
    - title: "نفح الطيب"
      text: "للمَقَّرِيّ (ت 1041هـ)، أُلّف بعد نهاية العصر، لكنه أوسع ما جُمع فيه أدب الأندلس، وفيه يترجم «لعشرين شاعرة كن مشهورات» [@deif، ج8 ص7]."
  texts:
    - title: "«أضحى التنائي بديلا من تدانينا» لابن زيدون"
      text: "قالها في ولّادة، «والقصيدة تكتظ بالحنين وبلوعات قلب محترق وزفراته» [@deif، ج8 ص284]."
    - title: "«الدهر يفجع بعد العين بالأثر» لابن عبدون"
      text: "رثى بها دولة بني الأفطس في بطليوس، وقال ابن بسام إنه «اقتفى فيها أبو محمد أثر فحول القدماء» [@deif، ج8 ص345]."
    - title: "«غريب بأرض المغربين أسير» للمعتمد"
      text: "قالها في أسره بعد زوال ملكه، «وطبيعى لشاعر مثله أن يبكى إمارته ودولته وما كان فيه من عز وسلطان» [@deif، ج8 ص340]."
    - title: "جبلية ابن خفاجة «وأرعن طماح الذؤابة باذخ»"
      text: "يصف جبلًا حتى يصير الجبل صورة الشاعر نفسه: «ونرى أن إنسانية الجبل تتزايد تدريجيا في القصيدة» [@abbas-tawaif، ص209]."
    - title: "«جادك الغيث إذا الغيث همى» للسان الدين بن الخطيب"
      text: "عارض بها موشحة ابن سهل «هل درى ظبي الحمى»، «وكأنها كانت مسك الختام لفن الموشحات بالأندلس» [@deif، ج8 ص155]."
    - title: "«أيها الساقي إليك المشتكى» لابن زُهْر"
      text: "«وقد طار فى المغرب والمشرق موشحه» هذا [@deif، ج8 ص160]."
    - title: "«لكل شيء إذا ما تم نقصان» لأبي البقاء الرندي"
      text: "رثاء الأندلس، «والقصيدة درة يتيمة رائعة، ولروعتها أخذت الأجيال التالية تزيد عليها أبياتا» [@deif، ج8 ص391]، ونصها في «نفح الطيب» [@nafh، ج4 ص486–487]."
    - title: "أبيات ابن زمرك في قصر الحمراء"
      text: "شعر منقوش على جدران البهو «إلى اليوم» [@deif، ج8 ص209–210]."
    - title: "«التوابع والزوابع» لابن شهيد"
      text: "رسالة «استطاع بها أن يبتكر قصة رائعة يدور الحوار بها فيما وراء الطبيعة فى عالم الجن» [@deif، ج8 ص10]."
