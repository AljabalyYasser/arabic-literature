# النسخة الموسعة لصفحة الباب 2 كما كانت في الإيداع c39b4d6، قبل اختصارها.
# داخلي، لا يظهر في الموقع. كل ما فيها بإحالاته، ويُرجع إليه عند كتابة قضايا العصر ومسارات أعلامه.
# تنبيه: فيها آراء لشوقي ضيف وغيره لم تُنسب في المتن إلى أصحابها، وكتب لاحقة لم تُفصل عن كتب العصر. تُصحَّح عند استعمالها (docs/content-guide.md، «الرأي يُنسب في المتن»).
summary: "نحو خمسين سنة، من نزول الوحي سنة 610م [@zirikli، ج6 ص218] إلى «عام الجماعة» سنة 41هـ [@zirikli، ج2 ص200]. نزل فيه القرآن فصار مثال البيان عند العرب، ومضى الشعر يدافع عن الدعوة ويمدح ويرثي، وارتقت الخطابة، وبدأت الكتابة تدخل في أعمال الدولة."
overview:
  history: |
    بدأ العصر بنزول الوحي على النبي ﷺ في غار حِراء سنة 610م [@zirikli، ج6 ص218]، ونزل القرآن مُنجَّمًا، أي مفرّقًا، في ثلاث وعشرين سنة [@deif، ج2 ص25]. وتحدّى العرب أن يأتوا بمثله، «وفعلا عجز العرب عن معارضته عجزا تامّا، فمضوا يجرّدون سيوفهم ويغمدون ألسنتهم» [@deif، ج2 ص30].

    ثم هاجر النبي ﷺ إلى المدينة، وبسنة دخوله إليها، 622م، يبدأ التاريخ الهجري [@zirikli، ج6 ص218]. ودارت الحرب بينه وبين قريش في بدر وأُحُد والخندق، وكان الشعر فيها سلاحًا: يهجو شعراء قريش المسلمين، ويرد عليهم شعراء المدينة [@deif، ج2 ص47]. ولما فُتحت مكة أقبلت القبائل تبايع، و«كان كل وفد يقدم ومعه خطباؤه وشعراؤه» [@deif، ج2 ص43].

    وبعد وفاة النبي ﷺ خرجت الجيوش إلى العراق وفارس والشام ومصر، وكانت الخطبة تسبق السيف، حتى يقول شوقي ضيف إن بلدًا لم يُفتح «إلا بعد أن فتحته خطبة أحد هؤلاء القواد» [@deif، ج2 ص108]. ثم كانت الفتنة: قُتل عثمان سنة 35هـ، وتقاتل المسلمون في الجمل وصِفِّين، وقُتل عليّ سنة 40هـ [@deif، ج2 ص59–60]، «ومن غير شك أذكت كل هذه الأحداث جذوة الشعر العربى إذكاء» [@deif، ج2 ص61]. وانتهى العصر حين سلّم الحسن بن علي الأمر لمعاوية سنة 41هـ، فسُمّي ذلك العام «عام الجماعة» [@zirikli، ج2 ص200].
  change: |
    كان القرآن أكبر ما غيّر اللغة. «وأول ما كان من آثار القرآن الكريم أنه جمع العرب على لهجة قريش» [@deif، ج2 ص31]، ثم «أحلّ فيها معانى لم تكن تعرفها من قبله» [@deif، ج2 ص32]، و«هذّب اللغة من الحوشية ومن اللفظ الغريب» [@deif، ج2 ص33]. وصار أسلوبه المثال الذي يحتذيه الناس: «فعلى هديه أخذ الخطباء والكتاب والشعراء يصوغون آثارهم الأدبية» [@deif، ج2 ص34].

    واستمر الشعر ولم يتوقف كما ظن بعض القدماء، يقول شوقي ضيف: «ليس بصحيح أنه توقّف أو ضعف كما ظن ذلك ابن خلدون» [@deif، ج2 ص43]. لكنه تغيّر: دخلته معانٍ إسلامية، وكان الخلفاء «ينهون عن الهجاء ويعاقبون فيه» [@deif، ج2 ص45]. وأكثر شعرائه مخضرمون، سُمّوا بذلك «لأنهم خلطوا فى حياتهم بين الجاهلية والإسلام فعاشوا فى العصرين معا» [@deif، ج2 ص46].

    وتغيّرت الخطابة: كان السجع يغلب على خطباء الجاهلية، ثم «كاد ينحسر تماما عن الخطابة» [@deif، ج2 ص113]، وصار للخطبة «موضوع واضح يجول فيه الخطيب ويصول» [@deif، ج2 ص114]. وأخذت الكتابة تُستعمل «على نطاق واسع لا فى كتابة القرآن فحسب» [@deif، ج2 ص130]، حتى صارت في عهد عمر «جزءا أساسيّا فى أعمال الدولة» [@deif، ج2 ص134].
  arts:
    - title: شعر الدفاع عن الدعوة
      text: "لما هجا شعراء قريش المسلمين قال حسّان: «أنا لها»، وانضم إليه كعب بن مالك وعبد الله بن رَواحة [@deif، ج2 ص47]. فهم شعراء المدينة الثلاثة."
    - title: المديح النبوي والاعتذار
      text: "«وكان كثير من الشعراء المسلمين يمتدح الرسول وهديه الكريم» [@deif، ج2 ص52]، وأقبل شعراء قريش بعد فتح مكة يعتذرون عما قالوا فيه [@deif، ج2 ص69]."
    - title: الرثاء
      text: "بكى الشعراء النبي ﷺ «بكاء حارّا» [@deif، ج2 ص52]، ورثوا قتلى حروب الرِّدّة والفتوح [@deif، ج2 ص54]."
    - title: شعر الفتوح والرَّجَز
      text: "«وكانوا فى أثناء هذا الجهاد ينظمون أناشيد حماسية مدوّية» [@deif، ج2 ص62]، وشاع فيه الرَّجَز «لأنه كان فعلا الوزن الشعبى» [@deif، ج2 ص67]."
    - title: الخطابة والمناظرة
      text: "«كان ظهور الإسلام إيذانا بتطور واسع فى الخطابة» [@deif، ج2 ص106]. وفي الفتنة عرف العصر المناظرة بين الأحزاب، «بل إنها لتتفجّر تفجرا» [@deif، ج2 ص111]."
    - title: الكتابة
      text: "كتب النبي ﷺ مواثيقه وعهوده، وصارت الكتابة لكل «ما يهمّ المسلمين فى معاملاتهم وعقودهم» [@deif، ج2 ص130]، ثم للرسائل والعهود في دواوين الدولة [@deif، ج2 ص134]."
  poets:
    - name: "حَسّان بن ثابِت (ت 54هـ)"
      text: "«وبحقّ سمّى حسان شاعر الإسلام ورسوله الكريم»، واتفق الرواة والنقاد على أنه «أشعر أهل المدر فى عصره» [@deif، ج2 ص79]، وأهل المَدَر أهل القرى والمدن."
    - name: "كَعْب بن زُهَيْر (ت 26هـ)"
      text: "ابن زهير بن أبي سُلْمى. أنشد «بانت سعاد» بين يدي النبي ﷺ فكساه بُرْدته، «ولقّبت قصيدته من أجلها بالبردة» [@deif، ج2 ص85]."
    - name: "الحُطَيْئة (ت نحو 45هـ)"
      text: "«من مدرسة زهير التى كانت تعنى بالتعبير وصقله» [@deif، ج2 ص96]. هجّاء حبسه عمر، ثم عفا عنه «بعد أن أخذ عليه العهد أن لا يعود إلى الهجاء» [@deif، ج2 ص97]."
    - name: "عَبْد الله بن رَواحة (ت 8هـ)"
      text: "أحد شعراء المدينة الثلاثة، وكان «دائم الاستمداد من القرآن يستلهمه فى هجائه للمشركين» [@deif، ج2 ص68]. استُشهد في مُؤْتة [@zirikli، ج4 ص86]."
    - name: "النّابِغة الجَعْدِيّ"
      text: "بدوي أسلم، فظهر الإسلام في شعره، و«هو من هذه الناحية من خير الأمثلة على أثر الإسلام فى شعر المخضرمين» [@deif، ج2 ص103]."
    - name: "مُتَمِّم بن نُوَيْرة (ت نحو 30هـ)"
      text: "قُتل أخوه مالك في حروب الردة، «ولأخيه متمم فيه مراث رائعة» [@deif، ج2 ص54]، حتى قال له عمر: «لو كنت أقول الشعر لسرّنى أن أقول فى زيد بن الخطاب مثل ما قلت فى أخيك» [@ibn-qutayba، ج1 ص326]."
    - name: "أبو ذُؤَيْب الهُذَلِيّ (ت نحو 27هـ)"
      text: "«ومن شعراء هذيل البارعين فى هذا العصر»، رثى أبناءه بعينيته المشهورة [@deif، ج2 ص73]."
  writersTitle: الخطباء والكتّاب
  writers:
    - name: "النبي ﷺ"
      text: "هو عند شوقي ضيف «الذى فتق معانى هذه الخطابة الدينية التى لم يعرفها العرب قبله» [@deif، ج2 ص121]."
    - name: "أبو بَكْر الصِّدِّيق (ت 13هـ)"
      text: "خطيب يوم البيعة وحروب الردة. و«كان أبو بكر وعمر وعثمان وعلى فى الذروة من الفصاحة والبلاغة» [@deif، ج2 ص121]."
    - name: "عُمَر بن الخَطّاب (ت 23هـ)"
      text: "خطيب وكاتب، وله في الكتابة من بين الخلفاء «القدح المعلّى» [@deif، ج2 ص135]، أي النصيب الأوفى. وله حكم مشهور في زهير: «كان لا يعاظل بين الكلام، ولا يتتبع حوشيه، ولا يمدح الرجل إلا بما فيه» [@ibn-rashiq، ج1 ص98]."
    - name: "عَلِيّ بن أبي طالِب (ت 40هـ)"
      text: "«وكان خطيبا مفوّها لا يشقّ غباره» [@deif، ج2 ص127]، وكثرت خطبه في حروب الفتنة."
    - name: "ثابِت بن قَيْس بن شَمّاس (ت 12هـ)"
      text: "«كان خطيب رسول الله» [@zirikli، ج2 ص98]، وهو الذي ردّ على خطيب وفد تميم [@ibn-hisham، ج2 ص562]."
  books:
    - title: "المصحف"
      text: "جمع أبو بكر القرآن في مصحف واحد، ثم «أتبعه عثمان بمصحفه، وبعث بنسخ منه إلى مختلف الأمصار الإسلامية» [@deif، ج2 ص27]. وهو عند شوقي ضيف «معجمهم اللغوى والأدبى الذى ساروا على هداه» [@deif، ج2 ص34]."
    - title: "السيرة النبوية"
      text: "لابن هشام (ت 213هـ) عن ابن إسحاق، وفيها شعر المغازي، فهو «ينقل عن ابن إسحق عقب كل موقعة حربية ما قيل فيها من شعر» [@deif، ج2 ص47]. لكن ابن إسحاق «كان يحمل كل غثاء من الشعر» كما يقول ابن سلّام [@deif، ج2 ص48]، فلا يؤخذ كل ما فيها."
    - title: "ديوان حسّان"
      text: "«خلّف ديوانا ضخما رواه ابن حبيب، غير أن كثيرا من الشعر المصنوع دخله» [@deif، ج2 ص79]."
    - title: "البيان والتبيين"
      text: "للجاحظ (ت 255هـ)، ومنه نأخذ كثيرًا من خطب العصر ورسائله، ويحيل إليه شوقي ضيف في خطب علي [@deif، ج2 ص128]."
    - title: "تاريخ الطبري"
      text: "للطبري (ت 310هـ)، وفيه أخبار الفتوح والفتنة وخطبها، «وفى تاريخ الطبرى من هذه الخطب كثرة وافرة» [@deif، ج2 ص110]."
    - title: "نهج البلاغة"
      text: "جمعه الشريف الرضي (ت 406هـ) من كلام علي. ويحذّر منه شوقي ضيف: «فإن كثرته وضعت عليه وضعا» [@deif، ج2 ص128]."
  texts:
    - title: "القرآن الكريم"
      text: "النص الذي غيّر اللغة والأسلوب، و«القرآن الكريم مفخرة العرب فى لغتهم» [@deif، ج2 ص30]."
    - title: "خطبة حجة الوداع"
      text: "أولها: «أيها الناس، اسمعوا قولي، فإني لا أدري لعلي لا ألقاكم بعد عامي هذا» [@ibn-hisham، ج2 ص603]. وهي عند شوقي ضيف من أروع ما يصور الخطابة النبوية [@deif، ج2 ص117]."
    - title: "الصحيفة"
      text: "كتاب النبي ﷺ بين المهاجرين والأنصار ويهود المدينة، أوله: «هذا كتاب من محمد النبي» [@ibn-hisham، ج1 ص501]. من أوائل الوثائق التي كُتبت بها أمور الدولة [@deif، ج2 ص130]."
    - title: "«بانت سعاد» لكعب بن زهير"
      text: "قصيدة الاعتذار والمديح التي أنشدها بين يدي النبي ﷺ [@deif، ج2 ص85]، وتُقرأ في السيرة [@ibn-hisham، ج2 ص503]."
    - title: "همزية حسّان «عفت ذات الأصابع»"
      text: "قالها في فتح مكة، وفيها «هجوت محمدا وأجبت عنه» [@ibn-hisham، ج2 ص424]. ويبدؤها بذكر منازل صاحبته كما كان يفعل الجاهليون [@deif، ج2 ص82]."
    - title: "خطبة أبي بكر يوم البيعة"
      text: "«أما بعد أيها الناس، فإني قد وليت عليكم ولست بخيركم» [@ibn-hisham، ج2 ص661]. خطبها بعد أن بايعه الناس خليفة."
    - title: "رسالة عمر إلى أبي موسى الأشعري في القضاء"
      text: "أولها: «أما بعد فإن القضاء فريضة محكمة، وسنة متبعة» [@bayan، ج2 ص33]. وهي عند شوقي ضيف «وثيقة مهمة فيما ينبغى أن يكون عليه الحاكم» [@deif، ج2 ص134]."
    - title: "عينية أبي ذؤيب «أمن المنون وريبها تتوجع»"
      text: "رثى بها أبناءه، «وفيها نحسّ رضاه بقضاء الله مع التحسر اللاذع» [@deif، ج2 ص73]."
  notes:
    poets: "ولَبِيد والخَنْساء أدركا الإسلام أيضًا، ونقرؤهما في العصر الجاهلي، لأن مادتهما الأساسية فيه."
    books: "لم تُؤلَّف في هذا العصر كتب أدب. الكتاب الذي جُمع فيه هو المصحف، وما سواه كتبٌ جاءت بعده فحفظت أدبه."
