number: 1
title: العصر الجاهلي
range: قبل الإسلام
start: 460
summary: "هنا يبدأ الشعر العربي الذي وصلنا. ويقف شوقي ضيف بهذا العصر، متابعًا الجاحظ، عند نحو مئة وخمسين سنة قبل الإسلام [@deif، ج1 ص38–39]: قصائد تُروى حفظًا، وقبائل تفاخر بشعرائها، وأسواق يتنافسون فيها."
overview:
  history: |
    كانت جزيرة العرب قبائل متفرقة، وعلى أطرافها ثلاث إمارات عربية: الغساسنة في الشام، والمناذرة في الحِيرة، وكِنْدة في نجد [@deif، ج1 ص40]. ودارت بين القبائل حروب سمّوها «أيامًا» [@deif، ج1 ص64]، وكانت لهم أسواق أشهرها عُكاظ، تتعدى البيع والشراء «إلى الأدب والشعر والحرب والسلم والعادات» [@afghani، ص285].
  change: |
    يرى شوقي ضيف أن لهجات القبائل تقاربت حتى صارت «لغة أدبية عامة، هي الفصحى، ينظم بها شعراء العرب جميعًا شعرهم» [@deif، ج1 ص120]، وأنها لهجة قريش [@deif، ج1 ص134]. واكتملت القصيدة: تبدأ غالبًا بالأطلال، ثم الرحلة، ثم الغرض [@deif، ج1 ص183]. ولم يكن الشعر يُكتب، بل يرويه الناس حفظًا [@deif، ج1 ص141]، حتى جمعه العلماء في الإسلام [@deif، ج1 ص163].
  arts:
    - title: القصيدة
      text: "قصيدة طويلة على وزن واحد وقافية واحدة، تسير غالبًا من الأطلال إلى الرحلة إلى الغرض [@deif، ج1 ص183]."
    - title: الأمثال
      text: "يرى شوقي ضيف أنها أصدق ما بقي من نثرهم، لأن من شأنها «أن لا تغير، وأن تظل طويلًا بصورتها» [@deif، ج1 ص404]."
    - title: الخطابة والوصايا
      text: "كانوا يخطبون في الأسواق والوفود، وينصح الحكيم قومه [@deif، ج1 ص412]. ويرى شوقي ضيف أن نصوصها لم تصلنا موثقة [@deif، ج1 ص410]."
    - title: سجع الكُهّان
      text: "كلام مسجوع يزعم أصحابه أنهم يعرفون به الغيب [@deif، ج1 ص420]."
  writersTitle: الخطباء والحكماء
  writers:
    - name: "قُسّ بن ساعِدة الإيادِيّ"
      text: "تُروى له خطبة بعُكاظ على جمل أحمر [@deif، ج1 ص415]."
    - name: "أَكْثَم بن صَيْفِيّ"
      text: "حكيم من تميم، تُروى عنه الأمثال والوصايا [@deif، ج1 ص406–407]."
  booksLater:
    - title: "المعلقات"
      text: "سبع قصائد جُمعت بعد الإسلام، ويقال إن أول من رواها مجموعة حمّاد الراوية. ويرى شوقي ضيف أنها سُمّيت بذلك لنفاستها، لا لأنها عُلّقت على الكعبة [@deif، ج1 ص176]."
    - title: "المفضليات"
      text: "اختارها المفضّل الضبّي (ت نحو 168هـ)، وهي عند شوقي ضيف «أروع ما بأيدينا من نصوص الشعر الجاهلي» [@deif، ج1 ص153]."
    - title: "طبقات فحول الشعراء"
      text: "لابن سَلّام (ت 232هـ)، دوّن فيه ملاحظات العلماء في رواية الشعر القديم [@deif، ج1 ص164]."
    - title: "الأغاني"
      text: "لأبي الفَرَج الأصفهاني (ت 356هـ)، وهو عند شوقي ضيف «أكبر مصدر لتاريخ الشعر الجاهلي وأصحابه» [@deif، ج1 ص182]."
  texts:
    - title: "«قِفا نَبْكِ» لامرئ القَيْس"
      text_id: qifa-nabki
      text: "أشهر المعلقات، ومطلعها عند النقاد، كما ينقل ابن رشيق، «أفضل ابتداء صنعه شاعر» [@ibn-rashiq، ج1 ص218]."
    - title: "«لخَوْلة أطلال» لطَرَفة"
      text_id: li-khawla-atlal
      text: "المعلقة التي جعلت صاحبها عند ابن قُتَيْبة «أجودهم طويلة» [@ibn-qutayba، ج1 ص182]."
    - title: "«أليلتنا بذي حُسُم أنيري» للمُهَلْهِل"
      text_id: alaylatana
      text: "رثاء كليب في حرب البسوس. والمهلهل عند ابن سَلّام أول من «قصّد القصائد وذكر الوقائع» [@ibn-sallam، ج1 ص39]."
    - title: "«ألا لا تلوماني» لعبد يَغُوث الحارِثيّ"
      text: "قالها أسيرًا يوم الكُلاب [@iqd، ج6 ص82]، وحفظتها المفضليات [@mufaddaliyyat، ص155]."
    - title: "خطبة قُسّ بن ساعِدة بعُكاظ"
      text: "تُروى في كتب الأدب [@deif، ج1 ص415]، ونسبتها إليه لا تثبت."
  notes:
    books: "لم يُدوَّن في الجاهلية كتاب. وصلنا شعرها بالرواية، ثم جمعه العلماء في الإسلام [@deif، ج1 ص163]."
