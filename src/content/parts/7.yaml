number: 7
title: النهضة
range: من 1213هـ/1798م إلى نحو منتصف القرن العشرين
start: 1798
summary: "من نزول الحملة الفرنسية مصر سنة 1213هـ/1798م [@deif، ج1 ص14] إلى نحو منتصف القرن العشرين. جاءت فيه المطبعة والصحافة والترجمة، فأحيا الشعراء أسلوب القدماء ثم جددوا فيه، وتحرر النثر من السجع، ووُلدت المقالة والرواية والقصة القصيرة والمسرحية."
caveat: "الحد بين النهضة والعصر الحديث تقسيم تعليمي خاص بهذا الموقع، وليس حدًّا متفقًا عليه في تاريخ الأدب، ولذلك لا نجعل له سنة قاطعة. فشوقي ضيف يعامل ما بعد سنة 1798م عصرًا حديثًا واحدًا يمتد إلى أيامنا [@deif، ج1 ص14]."
overview:
  history: |
    نزلت الحملة الفرنسية مصر سنة 1798م، ورأى المصريون «المطبعة التي جلبها نابليون معه» [@deif-muasir، ص13]. ثم أرسل محمد علي البعوث إلى أوروبا منذ سنة 1826م، وأنشأ مدرسة الألسن [@deif-muasir، ص23]، وطُبعت كتب القدماء فرأى الأدباء فيها «أساليب جديدة» [@deif-muasir، ص30]. ونزل مصر أدباء من الشام نهضوا بصحافتها [@deif-muasir، ص25]، وكانت للشام نهضتها، ومنها «دائرة المعارف» العربية لبطرس البُسْتانِيّ [@zirikli، ج2 ص58]. ثم احتل الإنجليز مصر سنة 1882م [@deif-muasir، ص16]، واشتدت الحركة الوطنية، وفُتحت الجامعة المصرية سنة 1908م [@deif-muasir، ص26]. ويرى شوقي ضيف أن الأدب المصري الحديث «إنما يتم بمعناه الكامل بعد الحرب الأولى» [@deif-muasir، ص200].
  change: |
    تحرر النثر من السجع، وانتصر «الأسلوب العربي المرسل» [@deif-muasir، ص182]، وهو الذي يجري بلا سجع. وصار الأدباء يخاطبون الجماهير لا الملوك والأمراء [@deif-muasir، ص36]. وتجاذب الأدبَ تياران: إحياء القديم، والأخذ عن الغرب [@deif-muasir، ص31]. ثم ظهر في أوائل القرن العشرين جيل تثقف بالآداب الإنجليزية، أراد الشعر تعبيرًا عن نفس الشاعر [@deif-muasir، ص58].
  arts:
    - title: شعر الإحياء
      text: "عاد به البارودي ومن بعده إلى أسلوب القدماء [@deif-muasir، ص88]."
    - title: المقالة
      text: "يرى شوقي ضيف أنها «فن لم يعرفه العرب القدماء»، ودفعت إليه الصحافة [@deif-muasir، ص183]."
    - title: القصة والرواية
      text: "بدأت بالترجمة، ومرت بالمقامة الطويلة عند المويلحي [@deif-muasir، ص187]، حتى «زينب» لهيكل [@deif-muasir، ص209]. والأقصوصة، أي القصة القصيرة، كثر كتّابها بعد الحرب الأولى [@deif-muasir، ص210]."
    - title: المسرحية
      text: "لم يكن لها أصل في الأدب العربي القديم [@deif-muasir، ص213]. أدخلها شوقي في الشعر [@deif-muasir، ص80]، ويرى شوقي ضيف أن توفيق الحكيم أرسى قواعدها في النثر [@deif-muasir، ص216]."
    - title: الشعر الوجداني
      text: "شعر الذات عند جماعة الديوان وشعراء المهجر وجماعة أبولو [@deif-muasir، ص58، ص70، ص163]."
  poets:
    - name: "محمود سامي البارُودِيّ (ت 1322هـ / 1904م)"
      text: "يعدّه شوقي ضيف «أول المجددين في الشعر العربي الحديث» [@deif-muasir، ص91]."
    - name: "أحمد شَوْقِي (ت 1351هـ / 1932م)"
      text: "أمير الشعراء، ويراه شوقي ضيف «سابق الشعراء في النصف الأول من هذا القرن» [@deif-muasir، ص120]."
    - name: "حافِظ إبراهيم (ت 1351هـ / 1932م)"
      text: "شاعر النيل، ويراه شوقي ضيف «الصوت الأول الذي لبى حاجة الجماعة المصرية» [@deif-muasir، ص106]."
    - name: "خَلِيل مُطْران (ت 1368هـ / 1949م)"
      text: "لبناني نزل مصر، ودعا إلى وحدة القصيدة [@deif-muasir، ص128]."
    - name: "جَمِيل صِدْقِي الزَّهاوِيّ (ت 1354هـ / 1936م)"
      text: "من بغداد، وهو عند الزركلي «من طلائع نهضة الأدب العربي في العصر الحاضر» [@zirikli، ج2 ص137]."
    - name: "مَعْرُوف الرُّصافِيّ (ت 1364هـ / 1945م)"
      text: "«شاعر العراق في عصره» عند الزركلي [@zirikli، ج7 ص268]."
    - name: "عبد الرحمن شُكْرِي (ت 1378هـ / 1958م)"
      text: "أولهم ذكرًا في روّاد جماعة الديوان عند شوقي ضيف [@deif-muasir، ص58]."
    - name: "إيليا أبو ماضِي (ت 1377هـ / 1957م)"
      text: "من كبار شعراء المهجر عند الزركلي [@zirikli، ج2 ص35]."
  writers:
    - name: "رِفاعة الطَّهْطاوِيّ (ت 1290هـ / 1873م)"
      text: "إمام البعثة، وبه يبدأ شوقي ضيف النهضة الأدبية في مصر [@deif-muasir، ص171]."
    - name: "محمد عَبْدُه (ت 1323هـ / 1905م)"
      text: "يرى شوقي ضيف أنه أخرج الكتابة الصحفية من السجع إلى الأسلوب الحر [@deif-muasir، ص227]."
    - name: "مصطفى لُطْفِي المَنْفَلُوطِيّ (ت 1343هـ / 1924م)"
      text: "يرى شوقي ضيف أن مقالاته كانت «المثل الأعلى للشباب في إنشائهم» [@deif-muasir، ص233]."
    - name: "جُبْران خَلِيل جُبْران (ت 1349هـ / 1931م)"
      text: "«نابغة الكتّاب المعاصرين في المهجر الأميركي» عند الزركلي [@zirikli، ج2 ص110]."
    - name: "عباس محمود العَقّاد (ت 1383هـ / 1964م)"
      text: "شاعر جماعة الديوان وناقدها، تصدّى لشوقي في كتاب «الديوان» سنة 1921م [@deif-muasir، ص137]."
    - name: "طه حُسَيْن (ت 1393هـ / 1973م)"
      text: "يقول الزركلي: «جدد مناهج، وأحدث ضجة في عالم الأدب العربيّ» [@zirikli، ج3 ص231]."
    - name: "توفيق الحَكِيم"
      text: "كاتب المسرح النثري، ويرى شوقي ضيف أنه «أوجد لنا مسرحًا مصريًّا» [@deif-muasir، ص294]."
    - name: "محمود تَيْمُور (ت 1393هـ / 1973م)"
      text: "يعدّه شوقي ضيف «مؤسس فن الأقصوصة في الأدب العربي الحديث» [@deif-muasir، ص302]."
  books:
    - title: "تخليص الإبريز في تلخيص باريز"
      text: "لرفاعة الطهطاوي، يصف فيه الحياة الفرنسية [@deif-muasir، ص171]."
    - title: "الشوقيات"
      text: "ديوان شوقي، وطبعته الأولى سنة 1898م [@deif-muasir، ص117]."
    - title: "النظرات"
      text: "مقالات المنفلوطي في صحيفة «المؤيد» [@deif-muasir، ص230]."
    - title: "حديث عيسى بن هشام"
      text: "للمويلحي، جُمع كتابًا سنة 1906م [@deif-muasir، ص235]."
    - title: "الديوان في الأدب والنقد"
      text: "للعقاد والمازني، سنة 1921م [@deif-muasir، ص137]."
    - title: "زينب"
      text: "لهيكل، قال في مقدمتها: «نشرت هذه القصة للمرة الأولى في سنة 1914» [@haykal-zaynab، ص9]، ويعدّها شوقي ضيف «أول محاولة كاملة لنا في صنع قصة بالمعنى الغربي الحديث» [@deif-muasir، ص209]."
    - title: "عودة الروح"
      text: "للحكيم، نشرها سنة 1933م [@deif-muasir، ص289]."
  texts:
    - title: "«سل الجيزة الفيحاء عن هرمي مصر» للبارودي"
      text: "يعدّها شوقي ضيف «أول قصيدة حديثة في آثارنا الفرعونية» [@deif-muasir، ص90]."
    - title: "«نهج البردة» لشوقي"
      text: "عارض بها بردة البوصيري [@deif-muasir، ص112]، والمعارضة أن ينظم الشاعر على وزن قصيدة سابقة وقافيتها يباريها."
    - title: "«اللغة العربية تنعى حظها بين أهلها» لحافظ"
      text: "نشرها «حين كانت تهب عاصفة العامية ضد العربية» [@deif-muasir، ص109]."
    - title: "«في الشعر الجاهلي» لطه حسين"
      text: "أثار «ضجة واسعة في الناس والبرلمان» [@deif-muasir، ص193]، ونعود إليه في قضية الانتحال."
    - title: "«الأيام» لطه حسين"
      text: "سيرته، أخرج جزأها الأول سنة 1929م [@deif-muasir، ص281]."
    - title: "«أهل الكهف» للحكيم"
      text: "قال فيها طه حسين: «إنها حَدَثٌ في تاريخ الأدب العربي» [@deif-muasir، ص294]."
    - title: "«شهرزاد» للحكيم"
      text: "مُثّلت في الغرب [@deif-muasir، ص294]."
  notes:
    poets: "وفي خطة العصر ميخائيل نُعَيْمة، ولم نجد له بعد سندًا في مصادرنا المعتمدة، ولا لتاريخ «الرابطة القلمية» التي جمعت شعراء المهجر في أمريكا."
