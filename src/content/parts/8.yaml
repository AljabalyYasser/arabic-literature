number: 8
title: العصر الحديث
range: القرن العشرون وما بعده
summary: "العصر الذي تغيّر فيه شكل القصيدة: بقي العمود، وظهر إلى جانبه شعر التفعيلة، ونضجت الرواية والقصة القصيرة والمسرحية."
caveat: "هذه الصفحة مسودة، وليست خريطة مكتملة لهذا العصر. أكثر ما فيها عن مصر، لأنها مبنية أساسًا على كتاب شوقي ضيف «الأدب العربي المعاصر في مصر»، وهو يقف عند سنة 1961م [@deif-muasir، ص6–8]. فلا تغطي ما بعد ذلك، ولا أدب الأقطار الأخرى إلا قليلًا. وحدّ هذا العصر مع النهضة قيد المراجعة."
overview:
  history: |
    يرى شوقي ضيف أن الأدب المصري الحديث «إنما يتم بمعناه الكامل بعد الحرب الأولى» [@deif-muasir، ص200]، وأن الحرب العالمية الثانية، ثم حرب فلسطين، ثم ثورة 1952م في مصر، دفعت الشعر «إلى تطور واسع في مضمونه» [@deif-muasir، ص75]. واتسع التعليم والصحافة والإذاعة، فنشأ «أدب صحافي وإذاعي» [@deif-muasir، ص203].
  change: |
    جُرّب الشعر المرسل، وهو الذي تُلغى فيه القافية، فلم ينجح [@deif-muasir، ص77–78]. ثم جاء «الشعر الحر»، وهو ما نسميه اليوم شعر التفعيلة، والتفعيلة وحدة الوزن في البحر، مثل «فاعلن». ويصفه شوقي ضيف بأنه يتخفف من القافية ومن «أثقال العروض»، فيتألف البيت من تفعيلة أو أكثر [@deif-muasir، ص78]. واختلف النقاد فيه: فشكّ شوقي ضيف في بقائه [@deif-muasir، ص78]، ورأى العقاد أن أوزان الشعر العربي «قائمة على أساس صالح للبناء عليه» [@aqqad-lugha، ص86]. ولأصحاب التفعيلة رأي آخر نعرضه حين نعتمد مصادره.
  arts:
    - title: القصيدة العمودية
      text: "بقيت إلى جانب الجديد، ودافع عنها العقاد [@aqqad-lugha، ص86–87]."
    - title: شعر التفعيلة
      text: "يرى شوقي ضيف أن «شعراء المهاجر الأمريكي هم أول من صنعوا منظومات في هذه الصورة» [@deif-muasir، ص78]، ولغيره في ريادته رأي آخر."
    - title: الرواية
      text: "يرى شوقي ضيف أنها «أصبحت عندنا قصة مصرية فعلًا» [@deif-muasir، ص212]."
    - title: القصة القصيرة
      text: "سمّاها معاصروها الأقصوصة، وكثر كتّابها بعد الحرب الأولى [@deif-muasir، ص210]."
    - title: المسرحية
      text: "يرى شوقي ضيف أن توفيق الحكيم أرسى قواعدها في النثر [@deif-muasir، ص216]، وفي الشعر خلف شوقيَ عزيز أباظة [@deif-muasir، ص82]."
  poets:
    - name: "بِشارة الخُورِي، الأخطل الصغير (ت 1388هـ / 1968م)"
      text: "من حراس العمود، وهو عند الزركلي «أشهر شعراء لبنان في العصر الحديث» [@zirikli، ج2 ص53]."
    - name: "عزيز أباظة (ت 1393هـ / 1973م)"
      text: "صاحب المسرحيات الشعرية بعد شوقي، ومنها «قيس ولبنى» [@deif-muasir، ص82]."
    - name: "بَدْر شاكر السَّيّاب (ت 1384هـ / 1964م)"
      text: "من العراق، ومن دواوينه «أنشودة المطر» [@zirikli، ج2 ص45]."
  writers:
    - name: "توفيق الحَكِيم"
      text: "كاتب المسرح النثري، ويرى شوقي ضيف أنه «أوجد لنا مسرحًا مصريًّا» [@deif-muasir، ص294]."
    - name: "محمود تَيْمُور (ت 1393هـ / 1973م)"
      text: "يعدّه شوقي ضيف «مؤسس فن الأقصوصة في الأدب العربي الحديث» [@deif-muasir، ص302]."
    - name: "نَجِيب مَحْفُوظ"
      text: "يُعنى، كما يقول شوقي ضيف، «بتصوير الطبقات الوسطى والشعبية» [@deif-muasir، ص211]."
    - name: "محمد مَنْدُور (ت 1384هـ / 1965م)"
      text: "ناقد، «وكان من كبار النقاد» عند الزركلي [@zirikli، ج7 ص111]."
  books:
    - title: "زينب"
      text: "لهيكل، قال في مقدمتها: «نشرت هذه القصة للمرة الأولى في سنة 1914» [@haykal-zaynab، ص9]، ويعدّها شوقي ضيف «أول محاولة كاملة لنا في صنع قصة بالمعنى الغربي الحديث» [@deif-muasir، ص209]."
    - title: "عودة الروح"
      text: "للحكيم، نشرها سنة 1933م [@deif-muasir، ص289]."
    - title: "اللغة الشاعرة"
      text: "للعقاد، صدر سنة 1960م، دفاعًا عن أوزان الشعر العربي [@aqqad-lugha، ص81–93]."
  texts:
    - title: "«أهل الكهف» للحكيم"
      text: "قال فيها طه حسين: «إنها حَدَثٌ في تاريخ الأدب العربي» [@deif-muasir، ص294]."
    - title: "«شهرزاد» للحكيم"
      text: "مُثّلت في الغرب [@deif-muasir، ص294]."
    - title: "«قيس ولبنى» لعزيز أباظة"
      text: "من المسرح الشعري على طريقة شوقي [@deif-muasir، ص82]."
  notes:
    poets: "وفي خطة هذا العصر شعراء لم نجد لهم بعد سندًا في مصادرنا المعتمدة: الجَواهِرِيّ، وعمر أبو رِيشة، وبَدَوِيّ الجَبَل، والبَرَدُّونِيّ، ونازِك الملائكة، وأدونيس، ومحمد الماغُوط، ونِزار قَبّانِي، ومحمود دَرْوِيش. ولا نجد فيها بعدُ ما يوثق ريادة نازك والسيّاب لشعر التفعيلة."
    writers: "وفي خطة العصر الطَّيِّب صالح، ويوسف إدريس، وزكريا تامر، ولم نجد لهم بعد سندًا في مصادرنا المعتمدة."
    texts: "ولم نجد بعد في مصادرنا المعتمدة نصًّا من شعر التفعيلة أو قصيدة النثر، ولا من شعر نزار قباني ومحمود درويش، ولا من روايات نجيب محفوظ."
