number: 5
title: الأندلس
range: 92–897هـ / 711–1492م
start: 711
summary: "من فتح العرب للأندلس سنة 92هـ/711م إلى خروجهم منها سنة 897هـ/1492م [@deif، ج8 ص5]، ويعاصر في أكثره العصر العباسي في المشرق. بدأ أدبها يحاكي المشرق، ثم صارت له شخصيته: الموشح والزجل، وشعر الطبيعة، ورثاء المدن."
overview:
  history: |
    ظل الشعر محدودًا زمن الولاة، ثم بدأ الازدهار الأدبي في عهد عبد الرحمن الأوسط [@deif، ج8 ص137]. وأعلن عبد الرحمن الناصر الخلافة في قرطبة سنة 316هـ [@deif، ج8 ص31]. ثم انقسمت الأندلس دويلات يحكمها ملوك الطوائف، فتعددت المراكز التي ترعى الشعراء [@deif، ج8 ص142]. وأخذ الإسبان المدن واحدة بعد أخرى، من طُلَيْطِلة سنة 478هـ [@deif، ج8 ص39] إلى غَرْناطة سنة 897هـ [@deif، ج8 ص538].
  change: |
    تعرّب أهل البلاد حتى من بقي منهم على النصرانية [@deif، ج8 ص6]. وحاكى الأدب المشرق أولًا، حتى قال الصاحب بن عبّاد في «العقد الفريد»: «هذه بضاعتنا ردّت إلينا» [@deif، ج8 ص189]. ثم استقلت شخصيته، ودخلت العامية الأندلسية في الأدب مع الموشح والزجل [@deif، ج8 ص151]، وشاركت فيه المرأة [@deif، ج8 ص8].
  arts:
    - title: الموشح
      text: "عرّفه ابن سناء المُلْك بأنه «كلام منظوم على وزن مخصوص» [@dar-al-tiraz، ص32]. وروى ابن بسّام أن أول من اخترع طريقته بالأندلس «محمد بن محمود القبري الضرير» [@dhakhira، ج1 ص469]، ويرى شوقي ضيف أنه تطوّر عن المسمّطات المشرقية [@deif، ج8 ص7]."
    - title: الزجل
      text: "نظمت العامة على طريقة الموشح «من غير أن يلتزموا فيها إعرابا»، كما يقول ابن خلدون [@deif، ج8 ص165]."
    - title: شعر الطبيعة
      text: "يرى شوقي ضيف أن الأندلس بلغت فيه «ذروة لعل إقليما عربيا لم يبلغها» [@deif، ج8 ص542]."
    - title: رثاء المدن والاستصراخ
      text: "رثوا دولهم ومدنهم، واستنجدوا بالمسلمين منذ عصر الطوائف [@deif، ج8 ص9، ص378]."
    - title: النثر الفني
      text: "كثرت فيه الرسائل الأدبية الخالصة [@deif، ج8 ص10]."
  poets:
    - name: "ابن زَيْدُون (ت 463هـ)"
      text: "يرى شوقي ضيف أن غزله «فى الذروة من الغزل العربى» [@deif، ج8 ص284]."
    - name: "وَلّادة بنت المُسْتَكْفِي (ت 484هـ)"
      text: "شاعرة كان مجلسها بقرطبة منتدى للأدباء [@deif، ج8 ص282]."
    - name: "المُعْتَمِد بن عَبّاد (ت 488هـ)"
      text: "أمير إشبيلية الشاعر، زال ملكه فانتهى أسيرًا في المغرب [@deif، ج8 ص340]."
    - name: "ابن خَفاجة (ت 533هـ)"
      text: "شاعر الطبيعة، سمّاه الأندلسيون «الجنّان» [@deif، ج8 ص319]، أي البستانيّ."
    - name: "ابن قُزْمان (ت 555هـ)"
      text: "صار «إمام أهل الزجل المنظوم بكلام عامة الأندلس» كما ينقل شوقي ضيف [@deif، ج8 ص168]."
    - name: "أبو البَقاء الرُّنْدِيّ (ت 684هـ)"
      text: "اشتهر بنونيته في رثاء الأندلس [@deif، ج8 ص389]."
    - name: "ابن زَمْرَك"
      text: "شاعر غرناطة في آخر العصر، وأبياته منقوشة في قصر الحمراء [@deif، ج8 ص210]."
  writers:
    - name: "ابن عَبْد رَبِّه (ت 328هـ)"
      text: "صاحب «العقد الفريد» [@deif، ج8 ص138]."
    - name: "ابن شُهَيْد (ت 426هـ)"
      text: "صاحب رسالة «التوابع والزوابع» [@deif، ج8 ص451]."
    - name: "ابن حَزْم (ت 456هـ)"
      text: "صاحب «طوق الحمامة»، ويراه إحسان عباس «صورة الأندلس نفسها حين أرادت لذاتها شخصية مستقلة» [@abbas-qurtuba، ص3]."
    - name: "ابن طُفَيْل (ت 581هـ)"
      text: "صاحب «حي بن يقظان» [@deif، ج8 ص512]."
    - name: "لِسان الدين بن الخَطِيب (ت 776هـ)"
      text: "يعدّه شوقي ضيف «أكبر كتاب غرناطة والأندلس فى أزمنتها الأخيرة» [@deif، ج8 ص417]."
  books:
    - title: "العقد الفريد"
      text: "لابن عبد ربه، موسوعة أدبية يرى شوقي ضيف أن مادتها مشرقية [@deif، ج8 ص189]."
    - title: "طوق الحمامة"
      text: "لابن حزم، في الحب [@deif، ج8 ص497]."
    - title: "الذخيرة في محاسن أهل الجزيرة"
      text: "لابن بسّام (ت 542هـ)، تراجم أدباء الطوائف ومختارات من آثارهم [@deif، ج8 ص505]."
    - title: "حي بن يقظان"
      text: "لابن طفيل، قصة فلسفية [@deif، ج8 ص11]."
  booksLater:
    - title: "نفح الطيب"
      text: "للمَقَّرِيّ (ت 1041هـ)، أُلّف بعد نهاية العصر، ونقرأ فيه كثيرًا من أدبه، كنونية الرندي [@nafh، ج4 ص486–487]."
  texts:
    - title: "«أضحى التنائي بديلا من تدانينا» لابن زيدون"
      text: "قالها في ولّادة [@deif، ج8 ص284]."
    - title: "جبلية ابن خفاجة «وأرعن طماح الذؤابة باذخ»"
      text: "يصف جبلًا حتى يصير صورة للشاعر نفسه، كما يقرؤها إحسان عباس [@abbas-tawaif، ص209]."
    - title: "«جادك الغيث إذا الغيث همى» للسان الدين بن الخطيب"
      text: "عارض بها موشحة ابن سهل، ويراها شوقي ضيف «مسك الختام لفن الموشحات بالأندلس» [@deif، ج8 ص155]."
    - title: "«لكل شيء إذا ما تم نقصان» لأبي البقاء الرندي"
      text: "رثاء الأندلس [@deif، ج8 ص391]، ونصها في «نفح الطيب» [@nafh، ج4 ص486–487]."
    - title: "«التوابع والزوابع» لابن شهيد"
      text: "قصة يدور الحوار فيها في عالم الجن [@deif، ج8 ص10]."
