number: 6
title: عصر الدول المتتابعة
range: 567–1213هـ / 1171–1798م
start: 1171
summary: "من قيام الدولة الأيوبية سنة 567هـ [@deif، ج7 ص27] إلى الحملة الفرنسية على مصر سنة 1213هـ/1798م [@deif، ج7 ص43]: أيوبيون ثم مماليك ثم عثمانيون. كثرت فيه الموسوعات والبديعيات والمديح النبوي، وازدهر الأدب الشعبي. ويُوصف كثيرًا بالانحطاط، ويردّ شوقي ضيف هذا الوصف عن زمن الأيوبيين والمماليك."
overview:
  history: |
    أنهى صلاح الدين حكم الفاطميين في مصر سنة 567هـ [@deif، ج7 ص27]، وهزم الصليبيين في حِطِّين سنة 583هـ [@deif، ج7 ص29]، فقصده الشعراء مادحين [@deif، ج7 ص171]. ثم سقطت بغداد سنة 656هـ، فصارت مصر ملاذًا للعلماء [@deif، ج7 ص7]، وصدّ المماليك التتار في عين جالوت سنة 658هـ [@deif، ج7 ص35]. ثم دخل العثمانيون الشام ومصر بعد مَرْج دابِق سنة 922هـ [@deif، ج7 ص40]، وصارت التركية لغة الدواوين [@deif، ج6 ص300].
  change: |
    يرى شوقي ضيف أن وصف هذا العصر بالانحطاط والركود «تنقضه الحقائق»، وأن مصر لم تشهد حقبًا علمية مزدهرة كما شهدت زمن المماليك [@deif، ج7 ص86–87]، ويقرّ بأن الحركة العلمية انتكست بعد الفتح العثماني [@deif، ج7 ص87]. وصار البديع «مقياس إبداعهم» [@deif، ج7 ص9]، وأحبّوا منه التورية، وهي لفظ له معنيان: قريب يتبادر إلى الذهن، وبعيد هو المقصود. ويرى شوقي ضيف أن البديع لم يثقل في مصر [@deif، ج7 ص185]، وأن التصنع صار في الشام والعراق «ظاهرة عامة» [@deif، ج6 ص140]. وغلب على العلم الجمع والشرح والموسوعات [@deif، ج7 ص86].
  arts:
    - title: المديح النبوي
      text: "ازدهر في زمن الحروب الصليبية [@deif، ج7 ص497]."
    - title: البديعيات
      text: "مدائح نبوية يحمل كل بيت منها لونًا من البديع، وتُشرح شروحًا مطولة [@deif، ج7 ص184]."
    - title: الموشح والزجل في المشرق
      text: "وضع ابن سناء المُلْك عروض الموشح [@deif، ج7 ص177]، وشاركت مصر في الزجل [@deif، ج7 ص387]."
    - title: خيال الظل
      text: "تمثيليات لمسرح دمى متحركة، ألّف ابن دانيال ثلاثًا منها [@deif، ج7 ص382]."
    - title: السير الشعبية
      text: "كسيرة عنترة وسيرة الظاهر بيبرس [@deif، ج7 ص11]."
  poets:
    - name: "ابن سَناء المُلْك (ت 608هـ)"
      text: "يعدّه شوقي ضيف «أهم شعراء مصر قبل العصر الحديث» [@deif، ج7 ص494]."
    - name: "ابن الفارِض (ت 632هـ)"
      text: "شاعر الحب الإلهي، ولُقّب «سلطان العاشقين» [@deif، ج7 ص358]."
    - name: "البَهاء زُهَيْر (ت 656هـ)"
      text: "قال فيه ابن خلكان: «شعره كله لطيف، وهو-كما يقال-السهل الممتنع» [@deif، ج7 ص281]."
    - name: "البُوصِيرِيّ (ت 696هـ)"
      text: "صاحب «البردة»، ويرى شوقي ضيف أنه بلغ في المديح النبوي «ذروة لم يبلغها أحد قبله» [@deif، ج7 ص363]."
    - name: "صَفِيّ الدين الحِلِّيّ (ت 750هـ)"
      text: "نظم بديعية تضم نحو مئة وخمسين محسّنًا من محسّنات البديع [@deif، ج5 ص355]."
    - name: "ابن نُباتة المِصْرِيّ (ت 768هـ)"
      text: "«حامل لواء الشعر فى زمانه» كما يقول ابن كثير والسبكي [@deif، ج7 ص211]."
  writers:
    - name: "القاضي الفاضِل (ت 596هـ)"
      text: "وزير صلاح الدين، ويعدّه شوقي ضيف «أهم كتاب مصر» [@deif، ج7 ص497]."
    - name: "ابن خَلِّكان (ت 681هـ)"
      text: "صاحب «وفيات الأعيان» [@deif، ج7 ص155]."
    - name: "ابن خَلْدُون (ت 808هـ)"
      text: "صاحب «المقدمة» و«العبر» [@deif، ج9 ص324]."
    - name: "القَلْقَشَنْدِيّ (ت 821هـ)"
      text: "صاحب «صبح الأعشى» [@deif، ج7 ص451]."
    - name: "السُّيُوطِيّ (ت 911هـ)"
      text: "يعدّه شوقي ضيف «أغزر العلماء المصريين زمن المماليك بعامة تأليفا» [@deif، ج7 ص114]."
  books:
    - title: "لسان العرب"
      text: "لابن منظور (ت 711هـ)، ويعدّه شوقي ضيف «أكبر معجم لغوى عربى ظهر فى الأزمنة الماضية» [@deif، ج7 ص114]."
    - title: "نهاية الأرب في فنون الأدب"
      text: "للنُّوَيْرِيّ (ت 733هـ)، موسوعة في المعارف والتاريخ [@deif، ج7 ص86]."
    - title: "صبح الأعشى"
      text: "للقلقشندي، موسوعة الكتابة الديوانية [@deif، ج7 ص157]."
    - title: "كتاب العبر، ومقدمته"
      text: "لابن خلدون، والكتاب الأول منه «مقدمة فى الفلسفة الاجتماعية» [@deif، ج9 ص324]."
    - title: "دار الطراز في عمل الموشحات"
      text: "لابن سناء الملك، ويقول إنه لم يرَ أحدًا صنّف في أصول الموشحات قبله [@dar-al-tiraz، ص31]."
  texts:
    - title: "البردة «أمن تذكّر جيران بذي سلم» للبوصيري"
      text: "يقول شوقي ضيف: «ولا تزال هذه القصيدة وأختها الهمزية تنشد إلى اليوم» [@deif، ج7 ص365]."
    - title: "خمرية ابن الفارض «شربنا على ذكر الحبيب مدامة»"
      text: "ومعها تائيته الكبرى [@deif، ج7 ص359–360]."
    - title: "كتاب القاضي الفاضل بفتح القدس"
      text: "كتبه على لسان صلاح الدين، ونصه في «صبح الأعشى» [@subh، ج8 ص284]."
    - title: "«طيف الخيال» لابن دانيال"
      text: "مسرحية شعرية نثرية، قريبة من عامية القاهرة في زمنه [@deif، ج7 ص382]."
    - title: "«ألف ليلة وليلة» في صياغتها المصرية"
      text: "يرى شوقي ضيف أن مصر صاغته بعاميتها ونشرته في العالم العربي [@deif، ج7 ص489]."
  notes:
    poets: "وفي خطة العصر لامية ابن الوردي، ولم نوثقها بعد من مصادرنا المعتمدة."
plan:
  - number: "6.1"
    title: هل كان عصر انحطاط؟
  - number: "6.2"
    title: الشعر في عصر الدول المتتابعة
  - number: "6.3"
    title: الموسوعات
  - number: "6.4"
    title: الأدب الشعبي

