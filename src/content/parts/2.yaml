number: 2
title: صدر الإسلام
range: من ظهور الإسلام إلى 41هـ / 610–661م
start: 610
summary: "من نزول الوحي سنة 610م [@zirikli، ج6 ص218] إلى «عام الجماعة» سنة 41هـ [@zirikli، ج2 ص200]. نزل فيه القرآن، ودافع الشعر عن الدعوة ومدح ورثى، وارتقت الخطابة، ودخلت الكتابة أعمال الدولة."
overview:
  history: |
    بدأ العصر بنزول الوحي على النبي ﷺ سنة 610م، ثم كانت الهجرة إلى المدينة سنة 622م، وبها يبدأ التاريخ الهجري [@zirikli، ج6 ص218]. وفي الحرب مع قريش كان الشعر سلاحًا بين شعراء المدينة وشعراء مكة [@deif، ج2 ص47]. وبعد وفاة النبي ﷺ خرجت جيوش الفتوح، ثم كانت الفتنة: قُتل عثمان سنة 35هـ، وعليّ سنة 40هـ [@deif، ج2 ص59–60]. وانتهى العصر حين سلّم الحسن الأمر لمعاوية سنة 41هـ [@zirikli، ج2 ص200].
  change: |
    يرى شوقي ضيف أن القرآن أكبر ما غيّر اللغة: «جمع العرب على لهجة قريش» [@deif، ج2 ص31]، و«هذّب اللغة من الحوشية ومن اللفظ الغريب» [@deif، ج2 ص33]، فصار أسلوبه مثالًا يحتذيه الخطباء والكتّاب والشعراء [@deif، ج2 ص34]. واستمر الشعر، ويردّ شوقي ضيف قول ابن خلدون إنه توقف أو ضعف [@deif، ج2 ص43]، لكن الخلفاء نهوا عن الهجاء [@deif، ج2 ص45]. وأكثر شعرائه مخضرمون، أي عاشوا في الجاهلية والإسلام [@deif، ج2 ص46].
  arts:
    - title: شعر الدفاع عن الدعوة
      text: "ردّ به شعراء المدينة الثلاثة، حسّان وكعب بن مالك وعبد الله بن رَواحة، على شعراء قريش [@deif، ج2 ص47]."
    - title: المديح النبوي والاعتذار
      text: "مدح الشعراء النبي ﷺ [@deif، ج2 ص52]، واعتذر إليه شعراء قريش بعد فتح مكة [@deif، ج2 ص69]."
    - title: الرثاء
      text: "رثوا النبي ﷺ وقتلى حروب الرِّدّة والفتوح [@deif، ج2 ص52، ص54]."
    - title: الخطابة
      text: "يرى شوقي ضيف أن ظهور الإسلام كان «إيذانا بتطور واسع فى الخطابة» [@deif، ج2 ص106]، وفي الفتنة ظهرت المناظرة [@deif، ج2 ص111]."
    - title: الكتابة
      text: "كُتبت بها المواثيق والعهود، ثم صارت في عهد عمر جزءًا من أعمال الدولة [@deif، ج2 ص130، ص134]."
  poets:
    - name: "حَسّان بن ثابِت (ت 54هـ)"
      text: "شاعر الدعوة، ويقول شوقي ضيف: «وبحقّ سمّى حسان شاعر الإسلام» [@deif، ج2 ص79]."
    - name: "كَعْب بن زُهَيْر (ت 26هـ)"
      text: "أنشد «بانت سعاد» بين يدي النبي ﷺ فكساه بُرْدته [@deif، ج2 ص85]."
    - name: "الحُطَيْئة (ت نحو 45هـ)"
      text: "هجّاء حبسه عمر حتى عاهده ألا يعود إلى الهجاء [@deif، ج2 ص97]."
    - name: "مُتَمِّم بن نُوَيْرة (ت نحو 30هـ)"
      text: "رثى أخاه مالكًا المقتول في حروب الردة [@deif، ج2 ص54]."
    - name: "أبو ذُؤَيْب الهُذَلِيّ (ت نحو 27هـ)"
      text: "رثى أبناءه بعينيته المشهورة [@deif، ج2 ص73]."
  writersTitle: الخطباء والكتّاب
  writers:
    - name: "النبي ﷺ"
      text: "يرى شوقي ضيف أنه «الذى فتق معانى هذه الخطابة الدينية التى لم يعرفها العرب قبله» [@deif، ج2 ص121]."
    - name: "أبو بَكْر الصِّدِّيق (ت 13هـ)"
      text: "أُثرت عنه خطب كثيرة [@deif، ج2 ص122]، منها خطبته يوم البيعة [@ibn-hisham، ج2 ص661]."
    - name: "عُمَر بن الخَطّاب (ت 23هـ)"
      text: "خطيب وكاتب، ويجعل له شوقي ضيف في الكتابة «القدح المعلّى» بين الخلفاء [@deif، ج2 ص135]، أي النصيب الأوفى."
    - name: "عَلِيّ بن أبي طالِب (ت 40هـ)"
      text: "كثرت خطبه في حروب الفتنة، ويقول شوقي ضيف: «وكان خطيبا مفوّها لا يشقّ غباره» [@deif، ج2 ص127]."
  books:
    - title: "المصحف"
      text: "جمع أبو بكر القرآن، ثم أتبعه عثمان بمصحفه وبعث بنسخ منه إلى الأمصار [@deif، ج2 ص27]."
    - title: "ديوان حسّان"
      text: "شعره في ديوان رواه ابن حَبِيب (ت 245هـ)، ويرى شوقي ضيف أن «كثيرا من الشعر المصنوع دخله» [@deif، ج2 ص79]."
  booksLater:
    - title: "السيرة النبوية"
      text: "لابن هشام (ت 213هـ)، وفيها شعر المغازي. وينقل شوقي ضيف قول ابن سلّام إن ابن إسحاق «كان يحمل كل غثاء من الشعر» [@deif، ج2 ص48]."
    - title: "البيان والتبيين"
      text: "للجاحظ (ت 255هـ)، ومنه كثير من خطب العصر [@deif، ج2 ص128]."
    - title: "تاريخ الطبري"
      text: "للطبري (ت 310هـ)، وفيه خطب الفتوح والفتنة [@deif، ج2 ص110]."
    - title: "نهج البلاغة"
      text: "جمعه الشريف الرضي (ت 406هـ) من كلام علي، ويحذّر منه شوقي ضيف، لأن «كثرته وضعت عليه وضعا» [@deif، ج2 ص128]."
  texts:
    - title: "القرآن الكريم"
      text: "ويرى شوقي ضيف أنه غيّر اللغة والأسلوب، كما في الفقرة السابقة [@deif، ج2 ص30–34]."
    - title: "خطبة حجة الوداع"
      text: "أولها: «أيها الناس، اسمعوا قولي، فإني لا أدري لعلي لا ألقاكم بعد عامي هذا» [@ibn-hisham، ج2 ص603]."
    - title: "«بانت سعاد» لكعب بن زهير"
      text: "قصيدة الاعتذار والمديح، وتُقرأ في السيرة [@ibn-hisham، ج2 ص503]."
    - title: "همزية حسّان «عفت ذات الأصابع»"
      text: "قالها في فتح مكة، وفيها «هجوت محمدا وأجبت عنه» [@ibn-hisham، ج2 ص424]."
    - title: "رسالة عمر إلى أبي موسى الأشعري في القضاء"
      text: "أولها: «أما بعد فإن القضاء فريضة محكمة، وسنة متبعة» [@bayan، ج2 ص33]."
  notes:
    poets: "ولَبِيد والخَنْساء أدركا الإسلام أيضًا، ونقرؤهما في العصر الجاهلي، لأن مادتهما الأساسية فيه."
