number: 4
title: العصر العباسي
range: 132–656هـ / 750–1258م
summary: العصر العباسي ليس كتلة أدبية واحدة. يمتد أكثر من خمسة قرون، وتتغير داخله مراكز السلطة والثقافة وطرائق الكتابة. لذلك لا يُقرأ المتنبي بوصفه ممثلًا وحيدًا للعصر كله، بل بوصفه صوتًا بارزًا من القرن الرابع الهجري داخل بيئة حلب الحمدانية.
highlights:
  - title: تعدد المراكز
    text: لم تعد بغداد وحدها مركز الفعل السياسي والثقافي؛ برزت إمارات وبلاطات إقليمية جذبت العلماء والشعراء، ومن أبرزها حلب في عهد سيف الدولة.
  - title: نضج علوم العربية
    text: تراكمت جهود النحو واللغة والنقد والبلاغة، وصار الشاعر الكبير يعمل داخل ثقافة لغوية ونقدية واسعة لا داخل تقليد شفهي بسيط.
  - title: اتساع موضوعات الأدب
    text: استمرت أغراض المديح والهجاء والفخر والوصف، لكنها دخلت في سياقات حضرية وسياسية وفكرية جديدة، واشتد حضور الحكمة والوصف الحربي والتجريب الأسلوبي.
  - title: النثر جزء من الصورة
    text: المشهد العباسي لا يختزل في الشعر؛ ازدهرت الرسائل والكتب الجامعة والجدل والنقد والكتابة العلمية والأدبية، فصار الأدب شبكة أوسع من القصيدة.
deep:
  - title: الشعر
    text: استمر البناء الموروث مع طاقة كبيرة على التكثيف والحكمة والمبالغة والصورة المركبة. ولا يعني ذلك أسلوبًا واحدًا؛ فأبو تمام والبحتري والمتنبي يختلفون اختلافًا بيّنًا في بناء الصورة والعبارة.
  - title: النثر
    text: صارت الرسائل والكتب الأدبية والعلمية جزءًا أساسيًا من الثقافة، وازداد أثر الكتابة المؤلفة في تشكيل الذوق والمعرفة.
  - title: النقد واللغة
    text: نشأت حول الشعر طبقة واسعة من الشرح والاحتجاج اللغوي والموازنة والنقد، ولذلك لا ينفصل فهم القصيدة عن تاريخ تلقيها وطرائق شرحها.
  - title: البلاط والحرب
    text: في حلب الحمدانية ارتبط جانب من الشعر بالحروب مع الروم وبمجلس سيف الدولة، فصار الحدث السياسي مادة شعرية حية، لا مجرد خلفية بعيدة.
