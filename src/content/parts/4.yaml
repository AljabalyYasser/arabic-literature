number: 4
title: العصر العباسي
range: 132–656هـ / 750–1258م
start: 750
summary: "من قيام دولة بني العباس سنة 132هـ [@zirikli، ج4 ص116] إلى دخول التتار بغداد سنة 656هـ [@zirikli، ج4 ص140]. صارت فيه بغداد قبلة الشعراء، ونُقلت علوم الأمم إلى العربية، ونضج الشعر والنثر، ونشأ النقد والبلاغة علمين."
overview:
  history: |
    اتخذ العباسيون العراق مقرًّا لخلافتهم [@deif، ج3 ص15]، وبنى المنصور بغداد سنة 145هـ [@deif، ج3 ص16]. ونُقلت إلى العربية كتب الهنود والفرس واليونان، وبلغت الترجمة ذروتها في عهد المأمون [@deif، ج3 ص113]. ثم ضعف سلطان الخليفة، ودخل البُوَيْهيّون بغداد سنة 334هـ [@deif، ج5 ص233]، وقامت دول وإمارات لكل منها بلاط، كبلاط سيف الدولة في حلب [@deif، ج6 ص21]. وانتهى العصر بدخول التتار بغداد سنة 656هـ [@zirikli، ج4 ص140].

    ويرى شوقي ضيف أن ما بعد سنة 334هـ عصر آخر، لأن سلطان الخلافة «تتقلص ظلاله منذ سنة 334» [@deif، ج5 ص5]. ونحن نجمع المدة في باب واحد على التقسيم الشائع.
  change: |
    صفّى الشعراء لغة الشعر، فجمعوا بين الجزالة، وهي قوة اللفظ وفخامته، والرقة [@deif، ج3 ص5]. وأكثروا من البديع، وهو ألوان من التحسين كالطباق والجناس، حتى صنّف ابن المعتز فيه كتابه «البديع» [@deif، ج4 ص329]. وانقسم النقاد بين أنصار الشعر المطبوع، كشعر البحتري، وأنصار أبي تمام وأصحاب الصنعة [@muwazana، ج1 ص4]. ومنذ عصر المقتدر غلب على النثر الأدبي السجع [@deif، ج4 ص6]، وهو أن تتفق أواخر الجمل في الحرف الأخير.
  arts:
    - title: الخمريات والمجون
      text: "اتسع وصف الخمر مع موجة المجون [@deif، ج3 ص178]، وأشهر شعرائه أبو نواس."
    - title: الزهد ثم التصوف
      text: "انتشر شعر الزهد، ثم ظهرت «تباشير التصوف» [@deif، ج3 ص180–181]."
    - title: المناظرات
      text: "فن نثري أنشأه المتكلمون [@deif، ج3 ص6]، وهم علماء يجادلون في العقائد بالحجة العقلية."
    - title: الرسائل
      text: "ازدهرت الرسائل الديوانية، والإخوانية، وهي ما يتراسل به الأصدقاء [@deif، ج3 ص6]."
    - title: المقامة
      text: "حكاية قصيرة ابتدعها بديع الزمان، بطلها أبو الفتح الإسكندري وراويها عيسى بن هشام [@deif، ج5 ص669]."
  poets:
    - name: "بَشّار بن بُرْد (ت 167هـ)"
      text: "يرى شوقي ضيف أنه «سنّ للشعراء أن يزاوجوا مزاوجة دقيقة بين عناصر الشعر التقليدية وعناصره التجديدية» [@deif، ج3 ص5–6]."
    - name: "أبو نُواس (ت 198هـ)"
      text: "شاعر الخمر والمجون [@deif، ج3 ص6]."
    - name: "أبو العَتاهِية (ت 211هـ)"
      text: "شاعر الزهد، وقيل له إن شعرك لا يدخل في عروض الخليل، فقال: «أنا أكبر من العروض» [@deif، ج3 ص253]."
    - name: "أبو تَمّام (ت 231هـ)"
      text: "يرى شوقي ضيف أنه مزج الشعر بالفلسفة وأكثر من البديع [@deif، ج3 ص6]، وحوله اختصم النقاد [@muwazana، ج1 ص4]."
    - name: "البُحْتُرِيّ (ت 284هـ)"
      text: "شاعر البلاط، ويرى شوقي ضيف أن أشعاره «تمثل النزعة المحافظة» [@deif، ج4 ص5]."
    - name: "ابن الرُّومِيّ (ت 283هـ)"
      text: "يعدّه شوقي ضيف «أبرع شعراء العصر» [@deif، ج4 ص324]."
    - name: "المُتَنَبِّي (ت 354هـ)"
      text: "شاعر سيف الدولة، وهو عند الثعالبي «نادرة الفلك وواسطة عقد الدهر في صناعة الشعر» [@yatima، ج1 ص139]."
    - name: "أبو العَلاء المَعَرِّيّ (ت 449هـ)"
      text: "صاحب «اللزوميات»، ويعدّه شوقي ضيف «أكبر مفكر متفلسف إسلامى» [@deif، ج6 ص64]."
  writers:
    - name: "ابن المُقَفَّع (ت 142هـ)"
      text: "نقل إلى العربية ذخائر الفرس [@deif، ج3 ص6]."
    - name: "الجاحِظ (ت 255هـ)"
      text: "يعدّه شوقي ضيف «أكبر كتّاب العصر غير منازع» [@deif، ج4 ص7]."
    - name: "ابن قُتَيْبة (ت 276هـ)"
      text: "يعدّه شوقي ضيف «أكبر مؤلف أدبى ظهر فى العصر بعد الجاحظ» [@deif، ج4 ص612]."
    - name: "أبو حَيّان التَّوْحِيدِيّ (ت نحو 400هـ)"
      text: "يرى شوقي ضيف أنه ورث أسلوب الجاحظ [@deif، ج5 ص462]."
    - name: "عَبْد القاهِر الجُرْجانِيّ (ت 471هـ)"
      text: "صاحب نظرية النظم، وهو عند الزركلي «واضع أصول البلاغة» [@zirikli، ج4 ص48]."
  books:
    - title: "البيان والتبيين، والحيوان"
      text: "للجاحظ، ويرى شوقي ضيف أن ما كُتب قبلهما في البيان «ليست شيئا بالقياس إلى ما نثره الجاحظ» فيهما [@deif، ج4 ص150]."
    - title: "الشعر والشعراء، وعيون الأخبار"
      text: "لابن قتيبة: تراجم الشعراء، وكتاب في ثقافة الكاتب [@deif، ج4 ص612]."
    - title: "الموازنة، والوساطة"
      text: "للآمِدِيّ (ت 370هـ) والقاضي الجرجاني (ت 392هـ)، في الخصومة حول أبي تمام والبحتري ثم حول المتنبي [@deif، ج5 ص302، ص544]."
    - title: "الأغاني"
      text: "لأبي الفَرَج الأصفهاني (ت 356هـ)، ويعدّه شوقي ضيف أهم كتب التراجم التي عنيت بالشعراء [@deif، ج5 ص560]."
    - title: "دلائل الإعجاز، وأسرار البلاغة"
      text: "لعبد القاهر، ويرى شوقي ضيف أنه وضع بهما علمي المعاني والبيان [@deif، ج5 ص541]."
  texts:
    - title: "«كليلة ودمنة» لابن المقفع"
      text: "حكايات هندية نقلها إلى العربية [@deif، ج3 ص511]."
    - title: "«السيف أصدق أنباء من الكتب» لأبي تمام"
      text: "مدح بها المعتصم في فتح عمّورية [@deif، ج3 ص273]، ومطلعها عند الآمدي «أحسن ابتداءاته» [@muwazana، ج1 ص60]."
    - title: "سينية البحتري في إيوان كسرى"
      text: "قالها بعد قتل المتوكل، ويعدّها شوقي ضيف «من روائع الشعر العباسى» [@deif، ج4 ص229]."
    - title: "«على قدر أهل العزم تأتي العزائم» للمتنبي"
      text: "في وقعة الحَدَث، وكان سيف الدولة «معجبا بها كثير الاستعادة لها» [@yatima، ج1 ص43]."
    - title: "مقامات بديع الزمان"
      text: "بها وُلد فن المقامة [@deif، ج5 ص669]."
    - title: "«رسالة الغفران» للمعري"
      text: "أملاها ردًّا على رسالة لابن القارح، ويتصور فيها ابن القارح ناهضًا من قبره يوم البعث [@deif، ج6 ص336]."
