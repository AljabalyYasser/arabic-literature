number: 4
title: العصر العباسي
range: 132–656هـ / 750–1258م
start: 750
summary: "أطول العصور: من قيام دولة بني العباس سنة 132هـ [@zirikli، ج4 ص116] إلى دخول التتار بغداد سنة 656هـ [@zirikli، ج4 ص140]. فيه صارت بغداد قبلة الشعراء، ونُقلت إلى العربية علوم الأمم، ونضج الشعر والنثر، ووُلد النقد والبلاغة علمين."
overview:
  history: |
    قامت دولة بني العباس سنة 132هـ، واتخذ العباسيون «من العراق موئلا لخلافتهم، فعلا نجمه، بينما هوى نجم الشام» [@deif، ج3 ص15]. وبنى المنصور بغداد، ووضع أول لبنة فيها سنة 145هـ [@deif، ج3 ص16]، فجذبت إليها «شعراء كثيرين من الكوفة والبصرة» [@deif، ج3 ص239].

    ونُقلت إلى العربية كتب الهنود والفرس واليونان، وبلغت الترجمة «أبعد غاياتها فى عهد المأمون» [@deif، ج3 ص113]. فدخل الفكر في الشعر، لأن الكتب المترجمة والمناظرات «دفعت الشعراء كما دفعت غيرهم إلى التفكير المتصل» [@deif، ج3 ص147].

    ثم تحولت «مقاليد الحكم من أيدى الفرس إلى أيدى الترك» منذ خلافة المتوكل، ففسدت الإدارة وبقيت الحياة العقلية مزدهرة [@deif، ج4 ص5]. وفي سنة 334هـ دخل البُوَيْهيّون بغداد [@deif، ج5 ص233]، وضعف سلطان الخليفة، وقامت دول وإمارات لكل منها بلاط. أشهرها بلاط سيف الدولة الحَمْدانيّ في حلب، وقيل إنه «لم يجتمع قط بباب أحد من الملوك بعد الخلفاء ما اجتمع ببابه من شيوخ الشعر ونجوم الدهر» [@yatima، ج1 ص37]. ولهذا يرى شوقي ضيف أن ما بعد 334هـ عصر آخر، لأن سلطان الخلافة «تتقلص ظلاله منذ سنة 334» [@deif، ج5 ص5]، ونحن نجمع المدة كلها هنا في باب واحد على التقسيم الشائع. وانتهى العصر حين دخل التتار بغداد سنة 656هـ وقتلوا الخليفة المستعصم، «وبموته انقرضت دولة بني العباس في العراق» [@zirikli، ج4 ص140].
  change: |
    صفّى الشعراء لغة الشعر بذوقهم المتحضر، فكتبوا بـ«أسلوب مصفّى يجمع حينا بين الجزالة والرصانة، وحينا يجمع بين الرقة والعذوبة» [@deif، ج3 ص5]، والجزالة قوة اللفظ وفخامته. وصارت القصيدة الطويلة تكاد تختص بالمديح والرثاء، «بينما تشيع المقطّعات فى الغزل والهجاء والمجون والزهد والحكم» [@deif، ج3 ص193].

    وأكثر الشعراء من البديع، وهو ألوان من التحسين في اللفظ والمعنى كالطباق والجناس، حتى صار مذهبًا، ثم صنّف ابن المعتز كتابه «البديع» «محاولا أن يضع من جهة لأول مرة فنونه وضعا علميا دقيقا» [@deif، ج4 ص329]. وانقسم النقاد فريقين: فريق يفضّل الشعر المطبوع على طريقة العرب كشعر البحتري، وفريق يفضّل أبا تمام، و«هؤلاء أهل المعاني والشعراء أصحاب الصنعة ومن يميل إلى التدقيق وفلسفي الكلام» [@muwazana، ج1 ص4].

    واتسع النثر حتى حمل «الثقافات اليونانية والفارسية والهندية» [@deif، ج3 ص441]. ثم غلب عليه السجع، وهو أن تتفق أواخر الجمل في الحرف الأخير، فلا نصل إلى عصر الخليفة المقتدر «حتى يصبح السجع اللغة العامة للنثر الأدبى جميعه» [@deif، ج4 ص6].
  arts:
    - title: الخمريات والمجون
      text: "«وقد اتسعت موجة المجون كما مرّ بنا، واتسع معها وصف الخمر» [@deif، ج3 ص178]، وأشهر شعرائه أبو نواس."
    - title: الزهد ثم التصوف
      text: "«وقد انتشر فى العصر شعر الزهد، وكان أكثر اتصالا بحياة الجماهير من شعر الخمر والمجون» [@deif، ج3 ص180]. ثم ظهرت «تباشير التصوف» [@deif، ج3 ص181]."
    - title: الشعر التعليمي
      text: "فن جديد «صاغوا فيه من المعارف والتاريخ والأمثال والقصص الحيوانى منظومات طريفة» [@deif، ج3 ص5]."
    - title: المناظرات
      text: "«ونفذ المتكلمون إلى فن نثرى مستحدث هو فن المناظرات» [@deif، ج3 ص6]. والمتكلمون علماء يجادلون في العقائد بالحجة العقلية."
    - title: الرسائل
      text: "«وازدهر النثر الديوانى وكلّ ما اتصل به من رسائل سياسية ومن عهود ووصايا وتوقيعات، وحبّر الكتّاب كثيرا من الرسائل الإخوانية البديعة» [@deif، ج3 ص6]، والإخوانية ما يتراسل به الأصدقاء."
    - title: المقامة
      text: "ابتدعها بديع الزمان، وهي «حكاية قصيرة تقوم على الحوار بين بطل مقاماته: أبى الفتح الإسكندرى وراوية حكاياته وأقاصيصه عيسى بن هشام» [@deif، ج5 ص669]."
  poets:
    - name: "بَشّار بن بُرْد (ت 167هـ)"
      text: "«سنّ للشعراء أن يزاوجوا مزاوجة دقيقة بين عناصر الشعر التقليدية وعناصره التجديدية» [@deif، ج3 ص5–6]."
    - name: "أبو نُواس (ت 198هـ)"
      text: "شاعر الخمر، «تعمّق مذاهب المتكلمين وأسرف على نفسه فى اللهو والمجون» [@deif، ج3 ص6]."
    - name: "أبو العَتاهِية (ت 211هـ)"
      text: "شاعر الزهد. قيل له إن أشعارك لا تدخل في عروض الخليل، فقال: «أنا أكبر من العروض» [@deif، ج3 ص253]."
    - name: "أبو تَمّام (ت 231هـ)"
      text: "«امتزج الشعر عنده بالفلسفة امتزاجا رائعا، بحيث أصبح معرضا باهرا لطرائف البديع» [@deif، ج3 ص6]، وحوله اختصم النقاد بين قديم وجديد."
    - name: "البُحْتُرِيّ (ت 284هـ)"
      text: "«الشاعر الرسمىّ فى بلاط الخلفاء من زمن المتوكل إلى زمن المعتمد، وأشعاره تمثل النزعة المحافظة» [@deif، ج4 ص5]، ويقال لشعره «سلاسل الذهب» [@zirikli، ج8 ص121]."
    - name: "ابن الرُّومِيّ (ت 283هـ)"
      text: "«لا شك فى أنه أبرع شعراء العصر لما يحفل به ديوانه من الموضوعات والمعانى والأخيلة المبتكرة» [@deif، ج4 ص324]."
    - name: "ابن المُعْتَزّ (ت 296هـ)"
      text: "«الشاعر المبدع، خليفة يوم وليلة» [@zirikli، ج4 ص118]، وأشعاره «تزخر بالصور والأخيلة» [@deif، ج4 ص6]."
    - name: "المُتَنَبِّي (ت 354هـ)"
      text: "نزل عند سيف الدولة تسع سنوات، وهو «أعظم كوكب فى سماء الشعر العربى لزمنه» [@deif، ج6 ص63–64]، وعند الثعالبي «نادرة الفلك وواسطة عقد الدهر في صناعة الشعر» [@yatima، ج1 ص139]."
    - name: "أبو فِراس الحَمْدانِيّ (ت 357هـ)"
      text: "الأمير الشاعر، أسره الروم فقال في أسره أروع قصائده [@deif، ج6 ص225]. وكان الصاحب بن عبّاد يقول: «بدئ الشعر بملك وختم بملك يعني امرأ القيس وأبا فراس» [@yatima، ج1 ص57]."
    - name: "الشَّرِيف الرَّضِيّ (ت 406هـ)"
      text: "«زعيم شعراء العراق فى عصره غير مدفع» [@deif، ج5 ص372]."
    - name: "أبو العَلاء المَعَرِّيّ (ت 449هـ)"
      text: "«أكبر مفكر متفلسف إسلامى» [@deif، ج6 ص64]، وديوانه «اللزوميات» هو الأهم «لأنه يحمل فلسفته» [@deif، ج6 ص171]."
  writers:
    - name: "ابن المُقَفَّع (ت 142هـ)"
      text: "«نقل إلى العربية أروع ما تحمل لغته من ذخائر فارسية وغير فارسية» [@deif، ج3 ص6]."
    - name: "الجاحِظ (ت 255هـ)"
      text: "«أكبر كتّاب العصر غير منازع، وكتاباته مرآة صافية لعصره بجميع طبقاته» [@deif، ج4 ص7]."
    - name: "ابن قُتَيْبة (ت 276هـ)"
      text: "«يعدّ أكبر مؤلف أدبى ظهر فى العصر بعد الجاحظ» [@deif، ج4 ص612]."
    - name: "الآمِدِيّ (ت 370هـ)"
      text: "صاحب «الموازنة» بين أبي تمام والبحتري، «وهو يتحيز فى الموازنة للبحترى تحيزا واضحا» [@deif، ج5 ص303]."
    - name: "القاضي الجُرْجانِيّ (ت 392هـ)"
      text: "صاحب «الوساطة بين المتنبي وخصومه» [@deif، ج5 ص544]."
    - name: "بَدِيع الزَّمان الهَمَذانِيّ (ت 398هـ)"
      text: "مبتدع المقامة [@deif، ج5 ص669]، وعن مقاماته «أخذ الحريري أسلوب مقاماته» [@zirikli، ج1 ص115]."
    - name: "أبو حَيّان التَّوْحِيدِيّ (ت نحو 400هـ)"
      text: "وارث الجاحظ، «فاستقر هذا الأسلوب فى نفس أبى حيان وأصبح جزءا لا يتجزأ من أدبه وكتاباته» [@deif، ج5 ص462]."
    - name: "عَبْد القاهِر الجُرْجانِيّ (ت 471هـ)"
      text: "«واضع أصول البلاغة» [@zirikli، ج4 ص48]، وصاحب نظرية النظم التي «بسطها أعظم بسط وفسرّها أروع تفسير» [@deif، ج5 ص541]."
    - name: "الحَرِيرِيّ (ت 516هـ)"
      text: "كتب المقامات على طريقة بديع الزمان، «وآيته الرائعة: المقامات» [@deif، ج5 ص473]."
  books:
    - title: "البيان والتبيين، والحيوان"
      text: "للجاحظ. وجهود غيره في البيان «ليست شيئا بالقياس إلى ما نثره الجاحظ» فيهما [@deif، ج4 ص150]."
    - title: "الشعر والشعراء، وعيون الأخبار"
      text: "لابن قتيبة. الأول «تراجم قصيرة لشعراء العرب حتى عصره»، والثاني «يمد الكاتب فيه بكنوز الثقافات» [@deif، ج4 ص612]."
    - title: "نقد الشعر"
      text: "لقُدامة بن جعفر (ت 337هـ)، يقول في أوله إنه «سيعنى بعلم جيّد الشعر ورديئه وأن أحدا لم يسبقه إلى وضع هذا العلم» [@deif، ج4 ص156]."
    - title: "الموازنة، والوساطة"
      text: "كتابان في الخصومة حول أبي تمام والبحتري ثم حول المتنبي. أولهما للآمدي [@deif، ج5 ص302]، والثاني للقاضي الجرجاني [@deif، ج5 ص544]."
    - title: "الأغاني"
      text: "لأبي الفَرَج الأصفهاني (ت 356هـ)، أهم كتب التراجم التي عنيت بالشعراء، يجعل «الماضى أمامك حاضرا بحذافيره» [@deif، ج5 ص560]."
    - title: "يتيمة الدهر"
      text: "للثعالبي (ت 429هـ)، «وهى تراجم لجميع الأقاليم العربية ومن نبغ فيها من شعراء العروبة من الأندلس حتى أقصى الشرق» [@deif، ج5 ص560]."
    - title: "دلائل الإعجاز، وأسرار البلاغة"
      text: "لعبد القاهر، بهما وضع علم المعاني وعلم البيان: «وكما وضع علم المعانى وضع علم البيان وضعا نهائيا فى كتابه أسرار البلاغة» [@deif، ج5 ص541]."
  texts:
    - title: "«كليلة ودمنة» لابن المقفع"
      text: "حكايات هندية على ألسنة الحيوان، عمد ابن المقفع إليها «فنقله إلى العربية» [@deif، ج3 ص511]."
    - title: "«البخلاء» للجاحظ"
      text: "«مجموعة كبيرة من الأقاصيص الفكهة عن الأشحاء البخلاء فى عصره» [@deif، ج4 ص593]."
    - title: "«السيف أصدق أنباء من الكتب» لأبي تمام"
      text: "مدح بها المعتصم في فتح عمّورية، «وهى ملحمة رائعة» [@deif، ج3 ص273]، ومطلعها عند الآمدي «أحسن ابتداءاته» [@muwazana، ج1 ص60]."
    - title: "«دع عنك لومي فإن اللوم إغراء» لأبي نواس"
      text: "أخذ معناها من الأعشى وزاد فيه، قال ابن قتيبة: «فللأعشى فضل السّبق إليه، ولأبى نواس فضل الزيادة فيه» [@ibn-qutayba، ج1 ص74]."
    - title: "سينية البحتري في إيوان كسرى"
      text: "«تعدّ من روائع الشعر العباسى»، قالها بعد أن زار الإيوان إثر قتل المتوكل [@deif، ج4 ص229]."
    - title: "«على قدر أهل العزم تأتي العزائم» للمتنبي"
      text: "في وقعة الحَدَث، وكان سيف الدولة «معجبا بها كثير الاستعادة لها» [@yatima، ج1 ص43]."
    - title: "«أراك عصيّ الدمع شيمتك الصبر» لأبي فراس"
      text: "«وربما كان أروع قصائد أبى فراس حينئذ قصيدته الرائية» [@deif، ج6 ص225]، قالها وهو أسير عند الروم."
    - title: "مقامات بديع الزمان"
      text: "بها وُلد فن المقامة، ويورد شوقي ضيف «المقامة البصرية» كاملة نموذجًا [@deif، ج5 ص671]."
    - title: "مناظرة السيرافي ومتّى بن يونس"
      text: "مناظرة في النحو والمنطق، «وقد رواها أبو حيان كاملة فى الليلة الثامنة» من «الإمتاع والمؤانسة» [@deif، ج5 ص458]."
    - title: "«رسالة الغفران» للمعري"
      text: "«رسالة طويلة فى نحو مائتى صفحة» أملاها ردًّا على رسالة لابن القارح، ويتصور فيها ابن القارح ناهضًا من قبره يوم البعث [@deif، ج6 ص336]."
