number: 3
title: العصر الأموي
range: 41–132هـ / 661–750م
start: 661
summary: "من «عام الجماعة» سنة 41هـ [@zirikli، ج2 ص200] إلى سقوط دولة بني أمية سنة 132هـ [@deif، ج2 ص342]. فيه النقائض، والشعر السياسي، والغزل العذري والصريح، وفي آخره وُلدت الكتابة الفنية."
overview:
  history: |
    قامت دولة بني أمية في الشام [@zirikli، ج7 ص261]، وصارت الخلافة وراثية [@deif، ج2 ص183]، فانقسم الناس أحزابًا، واتخذ كل حزب الشعر أداة لرأيه السياسي [@deif، ج2 ص193]. وعادت العصبية القبلية في فتنة ابن الزبير [@deif، ج2 ص152]، وكان سوق المِرْبَد بالبصرة مسرح الشعراء [@deif، ج2 ص242]. وفي عهد عبد الملك عُرّبت الدواوين، أي سجلات الدولة، فنشأت طبقة من الكتّاب المحترفين [@deif، ج2 ص201، ص466].
  change: |
    خرجت العربية من جزيرتها وصارت لغة الأمصار [@deif، ج2 ص169–170]، ففشا اللحن، وهو الخطأ في الإعراب، وظهر النحاة [@deif، ج2 ص175]. وفي مكة والمدينة أثّر الغناء في الشعر، فخفّت ألفاظه، وصار الغزل وصفًا لمشاعر الحب لا بكاءً على الأطلال [@deif، ج2 ص348].
  arts:
    - title: النقائض
      text: "قصيدة يرد بها الشاعر على قصيدة خصمه، فينقض فخره ويهجوه، ويشبّهها شوقي ضيف بالمناظرات [@deif، ج2 ص242]."
    - title: الشعر السياسي
      text: "صوّر فيه الزبيريون والخوارج والشيعة وأنصار بني أمية آراءهم في الحكم [@deif، ج2 ص6]."
    - title: الغزل العُذْرِيّ
      text: "غزل عفيف نُسب إلى بني عُذْرة، وشاع في بوادي نجد والحجاز [@deif، ج2 ص359]."
    - title: الغزل الصريح
      text: "غزل مكة والمدينة، يصرّح فيه الشاعر بحبه وزياراته لمحبوباته [@deif، ج2 ص349]."
    - title: الخطابة والرسائل
      text: "يرى شوقي ضيف أن الخطابة لم تزدهر في عصر كما ازدهرت فيه [@deif، ج2 ص6]. وفي آخره صارت الرسالة عند عبد الحميد فنًّا أدبيًّا [@deif، ج2 ص485]."
  poets:
    - name: "جَرِير (ت 110هـ)"
      text: "شاعر النقائض، وهو عند شوقي ضيف «لا يبارى فى عذوبة كلمه وحلاوة نغمه» [@deif، ج2 ص289]."
    - name: "الفَرَزْدَق (ت 110هـ)"
      text: "خصم جرير، وقالوا فيه: «لولا شعره لذهب ثلث لغة العرب» [@deif، ج2 ص275]."
    - name: "الأَخْطَل (ت 90هـ)"
      text: "شاعر بني أمية في عهد عبد الملك [@deif، ج2 ص262]."
    - name: "عُمَر بن أبي رَبِيعة (ت 93هـ)"
      text: "يجعله شوقي ضيف على رأس شعراء الغزل الصريح [@deif، ج2 ص349]."
    - name: "جَمِيل بُثَيْنة (ت 82هـ)"
      text: "يرى شوقي ضيف أن شعره «أوثق شعر العذريين» [@deif، ج2 ص367]."
    - name: "كُثَيِّر عَزّة (ت 105هـ)"
      text: "صاحب عزّة، ويعدّه شوقي ضيف في شعراء الشيعة [@deif، ج2 ص319]."
    - name: "ذُو الرُّمّة (ت 117هـ)"
      text: "شاعر الصحراء، وقال أبو عمرو بن العلاء: «فتح الشعر بإمرئ القيس وختم بذي الرمة» [@zirikli، ج5 ص124]."
    - name: "الكُمَيْت (ت 126هـ)"
      text: "شاعر الهاشميين، جعل شعره حِجاجًا بالبراهين والأدلة [@deif، ج2 ص326]."
  writersTitle: الخطباء والكتّاب
  writers:
    - name: "عَبْد الحَمِيد الكاتِب (ت 132هـ)"
      text: "يعدّه شوقي ضيف «أبلغ كتّاب هذا العصر وأبرعهم» [@deif، ج2 ص474]."
    - name: "زِياد بن أبيه (ت 53هـ)"
      text: "خطيب السياسة، وصاحب «البتراء» [@deif، ج2 ص424]."
    - name: "الحَجّاج (ت 95هـ)"
      text: "يضعه شوقي ضيف مع زياد في الذروة من الخطابة [@deif، ج2 ص420]."
    - name: "الحَسَن البَصْرِيّ (ت 110هـ)"
      text: "من الوعّاظ، ويرى شوقي ضيف أن عبد الحميد تأثّر بأسلوبه [@deif، ج2 ص450]."
  books:
    - title: "ديوان جرير"
      text: "برواية محمد بن حَبِيب (ت 245هـ) [@diwan-jarir، ج1 ص45]."
    - title: "ديوان ذي الرمة"
      text: "بشرح أبي نصر الباهِلِيّ صاحب الأصمعي [@diwan-dhi-al-rumma، ج1 ص8]."
    - title: "الهاشميات"
      text: "مدائح الكميت في بني هاشم [@deif، ج2 ص192]."
    - title: "بواكير التأليف"
      text: "في هذا العصر بدأ العرب يؤلفون، ومنه «أول كتاب فى الغناء» ليونس الكاتب [@deif، ج2 ص454–455]."
  booksLater:
    - title: "النقائض"
      text: "نقائض جرير والفرزدق بجمع أبي عُبَيْدة (ت 209هـ) وشرحه، وفيه أخبار أيام العرب [@deif، ج2 ص245]."
    - title: "الأغاني"
      text: "لأبي الفَرَج الأصفهاني (ت 356هـ)، وفيه أكثر أخبار شعراء العصر [@deif، ج2 ص486]."
    - title: "البيان والتبيين"
      text: "للجاحظ (ت 255هـ)، ومنه نقرأ خطب العصر [@deif، ج2 ص405]."
  texts:
    - title: "«أقلّي اللوم عاذل والعتابا» لجرير"
      text: "هجا بها الراعي النُّمَيْرِيّ، وفيها «فغضّ الطرف إنك من نمير» [@diwan-jarir، ج2 ص813–821]."
    - title: "«خفّ القطين فراحوا منك أو بكروا» للأخطل"
      text: "يرى شوقي ضيف أنها قد تكون أروع نقائضه مع جرير [@deif، ج2 ص253]."
    - title: "«أمن آل نعم أنت غاد فمبكر» لعمر بن أبي ربيعة"
      text: "يحكي فيها مغامرة ليلية، وهي نموذج الغزل الصريح [@deif، ج2 ص353]."
    - title: "«ما بال عينك منها الماء ينسكب» لذي الرمة"
      text: "قال فيها جرير: لو خرس ذو الرمة بعدها «لكان أشعر الناس» [@zirikli، ج5 ص124]."
    - title: "خطبة زياد «البتراء»"
      text: "خطبها بالبصرة، وسُمّيت البتراء لأنه «لم يحمد الله فيها، ولم يصل على النبي» [@bayan، ج2 ص40]."
    - title: "رسالة عبد الحميد إلى الكتّاب"
      text: "يعدّها شوقي ضيف «دستورا دقيقا لوظيفة الكاتب» [@deif، ج2 ص474]."
  notes:
    poets: "ومجنون ليلى من أشهر عشاق العرب، والرواة يشكّون في وجوده [@deif، ج2 ص360]."
