kind: "bayt"
title: "رأيت المنايا خبط عشواء"
part: "1"
order: 2
person: "zuhayr"
verses:
  - "a-min-umm-awfa/057"
meaning: "الموت كالناقة التي لا تبصر: من أصابته أماتته، ومن أخطأته عاش حتى يهرم. قال أبو جَعْفَر: «هو مثل، معناه أن المنايا تأتي بما لا تعرفه، فمن أصابته أماتته، فكأنها ناقة عشواء لا تبصر» [@ibn-al-anbari، ص289]. وسار «خبط عشواء» مثلًا، قال الزَّوْزَنِيّ: «ويقال في المثل: هو خابط خبط عشواء، أي قد ركب رأسه في الضلالة كالناقة التي لا تبصر ليلًا» [@zawzani، ص149]."
chapter: "zuhayr/al-muallaqa-2"
