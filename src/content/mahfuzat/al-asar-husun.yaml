kind: "bayt"
title: "أن الحصون الخيل"
part: "1"
order: 254
person: "al-asar-al-jufi"
verses:
  - "abligh-aba-humran/006"
meaning: "ما يحمي العربي خيله، لا البيوت المبنية بالطين. وسُئل بعض الحكام عن رجل جعل مالًا له «في الحصون» فقال: «اشتروا خيلا واحملوا عليها في سبيل الله؛ ذهب إلى قول الجعفي» [@lisan، ج13 ص121]."
