meaning: "يا نفسُ اصبري صبرًا جميلًا، فما كنت تخافينه قد وقع. مطلع مرثية أوس في فَضَالة بن كَلَدة، قال فيه الأَصْمَعِيّ: «ولم أسمع قطّ ابتداء مرثية أحسن من ابتداء مرثيته» [@ibn-qutayba، ج1 ص202]."
