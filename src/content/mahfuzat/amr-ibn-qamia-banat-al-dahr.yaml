meaning: "أصابتني مصائب الدهر من حيث لا أراها، فكيف بمن يُرمى ولا يقدر أن يرمي؟ سُئل حَمّاد الراوية «من أشعر الناس؟»، فأنشد هذا البيت، وقال: «والشعر لعمرو بن قميئة» [@aghani-dk، ج18 ص142]."
