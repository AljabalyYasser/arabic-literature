meaning: "خاتمة القصيدة: كن أخي بحق فأعرف نصحك من غشك، أو اتخذني عدوًّا يحذر كل منا صاحبه. ثم الحيرة أمام القدر: لا يدري أيلقاه الخير الذي يطلبه أم الشر الذي يطلبه. والبيتان الأولان شاهد عند البغدادي [@khizana، ج11 ص80]."
