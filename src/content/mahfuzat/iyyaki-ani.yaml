person: "sahl-ibn-malik"
text: "إِيّاكِ أَعْنِي وَاسْمَعِي يا جارَهْ"
meaning: "تخاطب أحدًا وتقصد أن يسمع غيره. يقول الميداني: «يضرب لمن يتكلم بكلام ويريد به شيئاً غيره» [@maydani، ج1 ص49]. ويُنسب إلى فتى من فزارة قاله في امرأة استحيا أن يصارحها بحبه."
