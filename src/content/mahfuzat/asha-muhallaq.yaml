kind: "maqta"
title: "نار المُحَلَّق"
part: "1"
order: 1
person: "al-asha"
lines:
  - first: "لَعَمْرِي لَقَدْ لَاحَتْ عُيُونٌ كَثِيرَةٌ"
    second: "إِلَى ضَوْءِ نَارٍ فِي يَفَاعٍ تُحَرَّقُ"
  - first: "تُشَبُّ لِمَقْرُورَيْنِ يَصْطَلِيَانِهَا"
    second: "وَبَاتَ عَلَى النَّارِ النَّدَى وَالْمُحَلَّقُ"
  - first: "رَضِيعَيْ لِبَانٍ ثَدْيَ أُمٍّ تَحَالَفَا"
    second: "بِأَسْحَمَ دَاجٍ عَوْضُ لَا نَتَفَرَّقُ"
story: "nar-al-muhallaq"
meaning: "نار على مرتفع تجذب أعين الناس، يوقدها المحلَّق لضيفين يرتجفان من البرد، وعليها بات الكرم والمحلَّق كأخوين رضعا من ثدي واحد وتحالفا في ليل أسود ألا يفترقا أبدًا. يُروى أن الأَعْشَى أنشدها بعُكاظ فخُطبت بنات المحلَّق كلهن [@aghani-dk، ج9 ص113–114]."
chapter: "al-asha/hayatuhu"
