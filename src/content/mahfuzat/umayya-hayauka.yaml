meaning: "طلب بلا طلب: يمدح الشاعر حياء الكريم، ويجعل الثناء يغني عن السؤال. يجعلها ابن رَشِيق أول أمثلة «الاقتضاء»، ويقول: «فمن أحسن الاقتضاء على ما تخيرته، ونحوت إليه قول أمية بن أبي الصلت لعبد الله بن جدعان» [@ibn-rashiq، ج2 ص158]."
