kind: "bayt"
title: "الرايات البيض والحمر"
part: "1"
order: 2
person: "amr-ibn-kulthum"
verses:
  - "ala-hubbi/019"
meaning: "نذهب برايات الحرب إلى المعركة بيضًا، ونعود بها حمرًا قد رويت من دماء الأعداء، كما ترد الإبل الماء وتصدر عنه رِواء. وزعم بعضهم أنه أفضل مطابقة وقعت في الشعر، فردّ ابن رَشِيق ذلك [@ibn-rashiq، ج2 ص11]."
