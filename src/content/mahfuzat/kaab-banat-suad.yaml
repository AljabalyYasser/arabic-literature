person: "kaab-ibn-zuhayr"
verses:
  - "banat-suad/001"
meaning: "مطلع «بانت سعاد»: فارقته سعاد فصار قلبه سقيمًا من الحب، أسيرًا عندها لم يُفدَ. قال السُّكَّريّ: «ومكبول: محتبس عندها. والكبل: القيد» [@diwan-kaab، ص6]. وفي رواية ابن إسحاق «لَمْ يُفْدَ» [@ibn-hisham، ج2 ص503]."
