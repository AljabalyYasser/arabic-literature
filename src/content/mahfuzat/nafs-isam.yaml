order: 191
person: "isam-ibn-shahbar"
text: "نَفْسُ عِصَامٍ سَوَّدَتْ عِصَامًا"
meaning: "يُضرب فيمن شرف بنفسه لا بآبائه، «في نَبَاهة الرجل من غير قديم» [@maydani، ج2 ص331]. وعِصام بن شَهْبَر حاجب النُّعْمان، والمثل أول رجز يقول أبو الفَرَج إنه قيل فيه، ويجعله العَسْكَرِيّ قوله هو، ثم يقول: «والناس يقولون لمن يفتخر بنفسه عصامى ولمن يفتخر بآبائه عظامى» [@askari-amthal، ج2 ص312]. ومنه قولنا اليوم: رجل عِصاميّ."
