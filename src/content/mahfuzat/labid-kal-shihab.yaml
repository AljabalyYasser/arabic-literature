person: "labid"
verses:
  - "balina/006"
meaning: "ليس الإنسان إلا كالشعلة: تتقد حينًا ثم تعود رمادًا. وفي شرح الطُّوسِيّ: «الشهاب: النار. يحور: يصير» [@diwan-labid، ص169]. قاله في رثاء أخيه أربد، وعدّ ابن قُتَيْبة القصيدة «من جيّد شعره» [@ibn-qutayba، ج1 ص270]."
