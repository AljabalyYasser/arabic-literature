kind: "bayt"
title: "لا أحد أذل من جديس"
part: "1"
order: 238
person: "afira"
story: "tasm-wa-jadis"
lines:
  - first: "لَا أَحَدٌ أَذَلُّ مِنْ جَدِيسِ"
    second: "أَهَكَذَا يُفْعَلُ بِالعَرُوسِ"
meaning: "ليس في الناس أذلّ من قومي جَدِيس: أهكذا تُعامَل العروس، يفتضّها رجل غير زوجها؟ رجز عُفَيْرة حين خرجت إلى قومها في دمها [@aghani-dk، ج11 ص165]، ويرويه ابن بَرِّيّ [@lisan، ج5 ص383]."
