kind: "bayt"
title: "الأذلّان"
part: "1"
order: 97
person: "al-mutalammis"
lines:
  - first: "وَلَا يُقِيمُ عَلَى ضَيْمٍ يُرَادُ بِهِ"
    second: "إِلَّا الأَذَلَّانِ عَيْرُ الحَيِّ وَالوَتِدُ"
  - first: "هَذَا عَلَى الخَسْفِ مَرْبُوطٌ بِرُمَّتِهِ"
    second: "وَذَا يُشَجُّ فَلَا يَرْثِي لَهُ أَحَدُ"
meaning: "لا يرضى بالظلم إلا أذلّ شيئين: حمار الحيّ، يُربط بحبله على الهوان، والوتد، يُدقّ رأسه فلا يرحمه أحد. والضَّيْم: الظلم، والخَسْف: الذل، والرُّمّة: الحبل. يرويهما البغدادي للمتلمّس [@khizana، ج6 ص352]، والمَيْدانيّ شاهدًا على المثل «هو أذل من حمار مقيد» [@maydani، ج2 ص393]."
