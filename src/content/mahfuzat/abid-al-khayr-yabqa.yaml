kind: "bayt"
title: "الخير يبقى وإن طال الزمان به"
part: "1"
order: 143
person: "abid-ibn-al-abras"
verses:
  - "tafa-al-khayal/009"
meaning: "ما يصنعه المرء من خير يبقى أثره مهما طال الزمان، والشر أخبث زاد يحمله. يذكره ابن رَشِيق مع بيت للحُطَيْئة في الأبيات التي في كل شطر منها مثل «قائم بنفسه، غير محتاج إلى صاحبه» [@ibn-rashiq، ج1 ص283]. وفي خبر يرويه أبو الفَرَج يجيء البيت على لسان جنّيّ في صورة حية، وهو خبر يقول فيه أبو الفَرَج نفسه: «وهو خبر مصنوع يتبين التوليد فيه» [@aghani-dk، ج22 ص85]."
