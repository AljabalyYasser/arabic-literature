kind: "bayt"
title: "ألا كل شيء ما خلا الله باطل"
part: "1"
order: 1
person: "labid"
verses:
  - "ala-tasalan/009"
story: "ashar-kalima"
meaning: "كل شيء غير الله فانٍ، وكل نعيم يزول. ويُروى عن النبي صلى الله عليه وسلم: «أشعر كلمة تكلمت بها العرب كلمة لبيد: ألا كل شيء ما خلا الله باطلُ» [@ibn-al-anbari، ص510]. واعترض عثمان بن مَظْعُون على الشطر الثاني لأن نعيم الجنة لا يزول [@khizana، ج2 ص255]."
chapter: "labid/fi-al-islam"
