kind: "bayt"
title: "ما إن يمس الأرض إلا منكب"
part: "1"
order: 284
person: "abu-kabir"
lines:
  - first: "مَا إِنْ يَمَسُّ الْأَرْضَ إِلَّا مَنْكِبٌ"
    second: "مِنْهُ وَحَرْفُ السَّاقِ طَيَّ الْمِحْمَلِ"
meaning: "إذا نام لم يمسّ الأرض منه إلا كتفه وحرف ساقه، منطويًا كما يُطوى محمل السيف، أي حمائله [@sukkari-hudhaliyyin، ص1074]. فهو خفيف لا يستسلم للنوم، ينام على جنبه مستعدًا للوثوب. ومن أبيات الفتى التي يُروى أنها في تأبط شرًّا، والخبر في حكاية [أبو كبير وربيبه](/stories/abu-kabir-wa-rabibuh/)."
