kind: "maqta"
title: "أحب الجون"
part: "1"
order: 165
person: "amr-ibn-shas"
lines:
  - first: "أَرَادَتْ عِرَارًا بِالْهَوَانِ وَمَنْ يُرِدْ"
    second: "عِرَارًا لَعَمْرِي بِالْهَوَانِ فَقَدْ ظَلَمْ"
  - first: "وَإِنَّ عِرَارًا إِنْ يَكُنْ غَيْرَ وَاضِحٍ"
    second: "فَإِنِّي أُحِبُّ الْجَوْنَ ذَا الْمَنْكِبِ الْعَمَمْ"
meaning: "أب يدافع عن ابنه الأسود عِرار أمام امرأته: إن لم يكن أبيض فإنه يحبه أسود تامّ الخلق. وهما البيتان اللذان تمثّل بهما عبد الملك بن مَرْوان أمام عِرار نفسه وهو لا يعرفه [@kamil، ج1 ص217]."
