kind: "bayt"
title: "ومن يغو لا يعدم على الغي لائما"
part: "1"
order: 214
person: "al-muraqqish-al-asghar"
verses:
  - "ala-ya-islami-fatima/022"
meaning: "من أصاب الخير حمد الناس أمره، ومن ضلّ وجد من يلومه على ضلاله. يعدّه ابن قُتَيْبة «مما سبق إليه» المُرَقِّش الأصغر، ويقول إن القُطامِيّ أخذه [@ibn-qutayba، ج1 ص210]."
