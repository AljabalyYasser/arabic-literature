meaning: "أتهجوه ولست له بنظير؟ فليكن الشرير منكما فداء للخيّر. وسار عجزه مثلًا، يقول ابن قُتَيْبة: «والناس يقولون: فشرّكما لخيركما الفداء، وهو عجز بيت لحسّان» [@ibn-qutayba، ج1 ص298]."
