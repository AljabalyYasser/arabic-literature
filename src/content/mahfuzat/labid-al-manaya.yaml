kind: "bayt"
title: "إن المنايا لا تطيش سهامها"
part: "1"
order: 1
person: "labid"
verses:
  - "afat-al-diyar/039"
meaning: "وجدت الذئاب غفلة من ولد البقرة الوحشية فافترسته، والموت لا تخطئ سهامه. قال ابن الأَنْبارِيّ في العجز: «معناه لا تخف سهامها» [@ibn-al-anbari، ص557]. وسار العجز وحده حكمةً في أن الموت لا يخطئ، حتى أنشده سِيبَوَيْه للبيد بصدر آخر [@sibawayh، ج3 ص110]."
chapter: "labid/al-muallaqa-2"
