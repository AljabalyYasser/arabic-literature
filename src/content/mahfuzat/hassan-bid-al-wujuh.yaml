meaning: "يمدح آل جفنة بنقاء الوجوه وكرم الأحساب وعزة الأنوف، وأنهم من الطراز الأول. ويرويه أبو الفَرَج في الأبيات التي أنشدها حسّان جبلة بن الأيهم [@aghani-dk، ج15 ص158]، ويذكره شوقي ضَيْف من رائع مدحه في الغساسنة [@deif، ج2 ص81]."
