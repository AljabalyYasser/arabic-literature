kind: "bayt"
title: "إذا المرء لم يخزن عليه لسانه"
part: "1"
order: 331
person: "imru-al-qais"
verses:
  - "qifa-nabki-irfan/005"
meaning: "من لم يحفظ لسانه، فيكتم به سرّه، فلن يحفظ شيئًا غيره. وصار البيت مثلًا في كتمان السر، يرويه المُبَرِّد لامرئ القَيْس في بابه [@kamil، ج2 ص228]، وهو من مقطوعة مختلف في نسبتها إليه."
