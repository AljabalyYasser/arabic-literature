order: 325
person: "abu-akhzam"
text: "شِنْشِنَةٌ أَعْرِفُها مِنْ أَخْزَمِ"
meaning: "يُضرب في شبه الولد بأبيه. والشِّنْشِنة: «الطبيعة والسجية» [@bayan، ج1 ص269]. وقاله عمر بن الخطاب في ابن عباس يريد أنه يشبه أباه في رأيه وعقله [@bayan، ج1 ص268–269]. ويُنسب إلى أبي أخزم الطائي، جدّ حاتم، وفي أصله أقوال أخرى."
