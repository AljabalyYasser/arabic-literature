kind: "bayt"
title: "أظفارها لم تقلم"
part: "1"
order: 133
person: "aws-ibn-hajar"
lines:
  - first: "لَعَمْرُكَ إِنَّا وَالأَحَالِيفَ هَؤُلَا"
    second: "لَفِي حِقْبَةٍ أَظْفَارُهَا لَمْ تُقَلَّمِ"
meaning: "نحن وهؤلاء الحلفاء في دهر حرب لم تُقلَّم أظفاره، أي في حرب كاملة السلاح. قال الأَصْمَعِيّ: «اخذ هذا المعنى زهير والنابغة من أوس» [@ibn-al-anbari، ص278]، فقال زُهَيْر في معلقته: «له لبد أظفاره لم تقلم» [@ibn-qutayba، ج1 ص201]."
sources:
