person: "abu-duad"
text: "جَارٌ كَجَارِ أَبِي دُؤَادِ"
meaning: "يُضرب في حسن الجوار. والمثل في المجير لا في أبي دؤاد: أبو دؤاد هو الجار المحميّ، ويختلف الرواة في الذي حماه: ملك من اليمن، أو الحارث بن همّام، أو كعب بن مامة [@ibn-qutayba، ج1 ص231–232]. وفيه يقول قيس بن زُهَيْر: «أُطَوِّفُ مَا أُطَوِّفُ ثُمَّ آوِي / إِلَى جَارٍ كَجَارِ أَبِي دُؤَادِ» [@aghani-dk، ج16 ص373]."
story: "jar-abi-duad"
