meaning: "صبرنا في يوم دارة موضوع، والصبر فينا طبع لا تكلّف، نضرب بالسيوف فتقطع الأكفّ والسواعد. وفي «الأغاني» و«الحماسة»: «وكان الصبر منا سجية» [@aghani-dk، ج14 ص7] [@tabrizi-hamasa، ج1 ص147]."
