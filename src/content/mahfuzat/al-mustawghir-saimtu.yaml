kind: "maqta"
title: "ولقد سئمت من الحياة وطولها"
part: "1"
order: 246
person: "al-mustawghir"
lines:
  - first: "وَلَقَدْ سَئِمْتُ مِنَ الْحَيَاةِ وَطُولِهَا"
    second: "وَازْدَدْتُ مِنْ عَدَدِ السِّنِينَ مِئِينَا"
  - first: "مِئَةٌ أَتَتْ مِنْ بَعْدِهَا مِئَتَانِ لِي"
    second: "وَازْدَدْتُ مِنْ عَدَدِ الشُّهُورِ سِنِينَا"
  - first: "هَلْ مَا بَقَا إِلَّا كَمَا قَدْ فَاتَنَا"
    second: "يَوْمٌ يَكُرُّ وَلَيْلَةٌ تَحْدُونَا"
meaning: "ملّ الحياة بعد ثلاثمئة سنة، وما بقي له إلا ما مضى: يوم يرجع وليلة تسوقه. يقول ابن سَلّام إن المستوغر «كان قديما وبقى بقاء طويلا حتى قال» هذه الأبيات [@ibn-sallam، ج1 ص33]."
sources:
  - source: "ibn-sallam"
    loc: "ج1 ص33"
