lines:
  - first: "أَفَبَعْدَ مَقْتَلِ مَالِكِ بْنِ زُهَيْرٍ"
    second: "تَرْجُو النِّسَاءُ عَوَاقِبَ الْأَطْهَارِ"
meaning: "قاله الرَّبِيع بن زِياد العَبْسِيّ حين بلغه مقتل مالك بن زُهَيْر أخي قَيْس: لا وقت بعد اليوم للنساء، فقد جاءت الحرب [@aghani، ج17 ص199]."
