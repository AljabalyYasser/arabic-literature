kind: "maqta"
title: "لعمرك ما يدري امرؤ كيف يتقي"
part: "1"
order: 205
person: "afnun"
verses:
  - "ala-lastu-fi-shay/004"
  - "ala-lastu-fi-shay/005"
meaning: "لا يدري المرء كيف يحترس إن لم يحرسه الله، وكفى حزنًا أن يرحل أصحابه ويبقى هو مدفونًا في موضعه. قالهما أُفْنُون التغلبي وقد لدغته أفعى بالموضع الذي أنذره كاهن أنه يموت فيه [@ibn-qutayba، ج1 ص408]."
