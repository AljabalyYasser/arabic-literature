meaning: "أول موعظة قُسّ بن ساعِدة بعُكاظ: كل حيّ يموت، والميت يفوت فلا يُدرك، وكل ما هو قادم سيأتي لا محالة. والخطبة منسوبة إليه، ورواياتها تختلف [@aghani-dk، ج15 ص247] [@bayan، ج1 ص253]."
