kind: "bayt"
title: "إن الرسول لسيف يستضاء به"
part: "2"
order: 425
person: "kaab-ibn-zuhayr"
verses:
  - "banat-suad/048"
meaning: "الرسول صلى الله عليه وسلم سيف يُهتدى بنوره، سيف هندي مسلول من سيوف الله. وفي السيرة «لنور يستضاء به» [@ibn-hisham، ج2 ص512]. ويروي موسى بن عقبة أن النبي أشار عند هذا البيت «إلى الحلق أن يسمعوا شعر كعب بن زهير» [@aghani-dk، ج17 ص88]."
