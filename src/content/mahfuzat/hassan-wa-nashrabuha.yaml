person: "hassan"
verses:
  - "afat-dhat-al-asabi/009"
meaning: "نشرب الخمر فتجعلنا كالملوك جودًا وعزة، وكالأسود شجاعة لا يكفّنا اللقاء. وهو آخر القسم الجاهلي من الهمزية، ويرويه المُبَرِّد في باب الشراب [@kamil، ج1 ص106]. وتُروى عليه حكاية منسوبة: [حسّان والفتية الشاربون](/stories/fitya-hassan/)."
chapter: "hassan/al-hamziyya-1"
