  - "ya-dar-amra/006"
  - "ya-dar-amra/009"
meaning: "ينذر لَقِيط قومه جيش كسرى، ويطلب منهم أن يولّوا أمرهم رجلًا قويًّا لا يبطره الرخاء ولا تذله الشدة، جرّب الدهر بخيره وشره. وقد تمثل بهذه الأبيات الحَجّاج في المُهَلَّب بن أبي صُفْرة [@kamil، ج2 ص113]، وصار «حلب الدهر أشطره» مثلًا للرجل المجرّب [@askari-amthal، ج1 ص346]."
