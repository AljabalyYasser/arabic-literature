kind: "bayt"
title: "قاتلة مقتولة"
part: "1"
order: 222
person: "jalila"
verses:
  - "ya-bnata-al-aqwam/016"
meaning: "خاتمة قصيدة جَلِيلة في زوجها كُلَيْب: هي قاتلة لأن القاتل أخوها جَسّاس، ومقتولة لأن القتيل زوجها، وترجو أن يرحمها الله. ونسبة القصيدة إليها «منسوب»، لأن خبرها وشعرها من رواية الشَّرْقِيّ بن القُطامِيّ وحده [@aghani، ج5 ص67]."
