person: "rabia-ibn-mukaddam"
text: "أَحْمَى مِنْ مُجِيرِ الظُّعُنِ"
meaning: "يُضرب في الحماية. ومجير الظعن رَبِيعة بن مُكَدَّم، الذي يُروى أنه حمى ظعائن قومه بعد موته: «ما نعلم قتيلا حمى ظعائن غير رَبِيعة بن مكدم» [@maydani، ج1 ص221–222]."
