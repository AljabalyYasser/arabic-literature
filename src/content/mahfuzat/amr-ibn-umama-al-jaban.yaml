kind: "mathal"
part: "1"
order: 208
person: "amr-ibn-umama"
text: "إِنَّ الجَبَانَ حَتْفُهُ مِنْ فَوْقِهِ"
meaning: "الجبان لا ينجيه حذره، فموته يأتيه من حيث لا يحترس. قال المَيْدانيّ: «يشير إلى أن الحَتْفَ إلى الجَبَان أسرعُ منه إلى الشجاع، لأنه يأتيه من حيث لا مَدْفَع له»، و«يضرب في قلة نفع الحذر من القدر» [@maydani، ج1 ص10]. وهو من رجز عَمْرو بن أُمامة حين أحاطت به مُراد."
