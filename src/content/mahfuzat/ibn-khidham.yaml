kind: "bayt"
title: "كما بكى ابن خذام"
part: "1"
order: 1
person: "imru-al-qais"
verses:
  - "laman-al-diyar/004"
meaning: "يطلب من صاحبيه أن يميلا إلى الطلل ليبكيا الديار كما بكاها ابن خِذام. وهو شاعر لا يُعرف له غير ذكره في هذا البيت، قال ابن سَلّام: «لم نسمع شعره الذي بكى فيه ولا شعرا غير هذا البيت» [@ibn-sallam، ج1 ص39]. فامرؤ القَيْس، الذي سبق العرب إلى «التَّبْكاء في الديار» [@ibn-sallam، ج1 ص55]، يذكر هنا من بكاها قبله."
chapter: "imru-al-qais/shir-al-tarid"
status: "review"
