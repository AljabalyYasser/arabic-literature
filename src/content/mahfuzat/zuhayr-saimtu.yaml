meaning: "ملّ زُهَيْر مشاقّ الحياة، ومن عاش ثمانين سنة ملّ لا محالة. قال الزَّوْزَنِيّ: «يقول: مللت مشاق الحياة وشدائدها، ومن عاش ثمانين سنة ملَّ الكبر لا محالة» [@zawzani، ص149]. وفي كتاب المعمَّرين لأبي حاتِم السِّجِسْتانِيّ أنه قاله «حين بلغ الثمانين» [@muammarun، ص83]."
