kind: "bayt"
title: "إذا نزل السحاب بأرض قوم"
part: "1"
order: 312
person: "muawiya-ibn-malik"
verses:
  - "ajadda-al-qalbu/023"
meaning: "إذا أمطرت أرض قوم رعينا نبتها وإن غضبوا، عزًّا وقوة. سمّى النبات باسم المطر الذي أنبته، ويجعله ابن رَشِيق مثالًا على المجاز [@ibn-rashiq، ج1 ص266]، ويقول محققا «المفضليات» إنه «صار مثلا سائرا» [@mufaddaliyyat، ص356، الحاشية]."
