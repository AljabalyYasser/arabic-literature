kind: "bayt"
title: "يرى الوحشة الأنس الأنيس"
part: "1"
order: 73
person: "taabbata-sharran"
lines:
  - first: "يَرَى الوَحْشَةَ الأُنْسَ الأَنِيسَ وَيَهْتَدِي"
    second: "بِحَيْثُ اهْتَدَتْ أُمُّ النُّجُومِ الشَّوَابِكِ"
meaning: "يرى الوحدة في الفلاة أنسًا، ويهتدي في الليل حيث تهتدي النجوم المتشابكة، أي يعرف طريقه بالنجوم. والبيت في [«إني لمهد من ثنائي»](/texts/inni-lamuhdin/) يصف به تأبّط شرًّا ممدوحه، وهو صورة الصعلوك الذي يأنس بالبرية [@tabrizi-hamasa، ج1 ص23]."
sources:
  - source: "tabrizi-hamasa"
    loc: "ج1 ص23"
    url: "https://shamela.ws/book/6907/22"
status: "review"
