kind: "bayt"
title: "فإنما هي إقبال وإدبار"
part: "1"
order: 1
person: "al-khansa"
verses:
  - "qadhan-bi-aynik/012"
meaning: "ناقة فقدت ولدها، ترعى ما دامت غافلة، فإذا تذكرته لم يبق منها إلا الإقبال والإدبار. وهو أقدم شاهد على القصيدة، في كتاب سِيبَوَيْه [@sibawayh، ج1 ص337]، ومثال عبد القاهر على المجاز في الحكم [@dalail، ص300–301]."
chapter: "al-khansa/al-raiyya-1"
