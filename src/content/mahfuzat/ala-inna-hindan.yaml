kind: "maqta"
title: "ألا إن هندًا أصبحت منك محرمًا"
part: "1"
order: 216
lines:
  - first: "أَلَا إِنَّ هِنْدًا أَصْبَحَتْ مِنْكَ مَحْرَمًا"
    second: "وَأَصْبَحْتَ مِنْ أَدْنَى حُمُوَّتِهَا حَمَا"
  - first: "فَأَصْبَحْتَ كَالْمَقْمُورِ جَفْنَ سِلَاحِهِ"
    second: "يُقَلِّبُ بِالْكَفَّيْنِ قَوْسًا وَأَسْهُمَا"
meaning: "صارت هند محرّمة على العاشق، وصار من أقرب أصهارها، وهو كالمقامر الذي خسر غِمْد سيفه فبقي يقلّب قوسه وسهامه. وفي قائلهما خلاف: لعبد الله بن العَجْلان عند ابن قُتَيْبة، وقد أنشدهما فمات [@ibn-qutayba، ج2 ص706–707]، ولمسافر بن أبي عَمْرو عند أبي الفَرَج وأكثر الرواة كما يقول [@aghani-dk، ج22 ص242]، ولهشام بن المُغِيرة عند النَّوْفَلِيّ [@aghani-dk، ج9 ص52]."
