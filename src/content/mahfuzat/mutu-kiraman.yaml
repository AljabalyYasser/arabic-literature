meaning: "موتوا كرامًا في الحرب أو اقتلوا عدوكم، وامشوا إلى نار الحرب تحملون لها الحطب الغليظ اليابس، أي أشعلوها حتى تستعر. من قصيدة التحريض المنسوبة إلى عُفَيْرة [@aghani-dk، ج11 ص166]."
