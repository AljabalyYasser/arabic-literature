text: "وَعِنْدَ جُهَيْنَةَ الخَبَرُ اليَقِينُ"
meaning: "يُضرب لمن يعرف حقيقة الأمر دون غيره. وهو عجز بيت يجعله أبو عُبَيْدة لغُصَين اليهودي، جار بني سهم، يعني بجهينة نفسه، في أول الحرب التي انتهت بيوم دارة موضوع [@aghani-dk، ج14 ص3]، ويروي له هشام بن الكَلْبيّ خبرًا آخر، ويقول الميداني: «يضرب في معرفة الشيء حقيقة» [@maydani، ج2 ص3–5]."
story: "darat-mawdu"
