kind: "maqta"
title: "إنا نعف فلا نريب حليفنا"
part: "1"
order: 272
person: "al-hadira"
verses:
  - "bakarat-sumayya/009"
  - "bakarat-sumayya/010"
  - "bakarat-sumayya/011"
meaning: "فخر بالوفاء والعفّة والجود: لم يُرفع لقومه لواء غدر في مجمع، ولا يرتاب بهم حليف، ويقون أعراضهم بأنفس أموالهم. وكانوا في الجاهلية يرفعون للغادر لواء في سوق عكاظ ليعرفه الناس، كما يقول محققا «المفضليات» [@mufaddaliyyat، ص45، الحاشية]."
