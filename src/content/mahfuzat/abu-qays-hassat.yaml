kind: "maqta"
title: "كل امرئ في شأنه ساع"
part: "1"
order: 184
person: "abu-qays-ibn-al-aslat"
verses:
  - "qalat-wa-lam-taqsid/004"
  - "qalat-wa-lam-taqsid/005"
meaning: "أذهبت الخوذة شعر رأسه من طول لبسها في الحرب، فلا ينام إلا قليلًا، لأنه يسعى في أمر قومه، وكل امرئ يسعى في شأنه. والعجز الأخير يقول فيه الأَصْمَعِيّ إنه من أحكم ما قالته العرب [@tabrizi-ikhtiyarat، ج3 ص1237]."
