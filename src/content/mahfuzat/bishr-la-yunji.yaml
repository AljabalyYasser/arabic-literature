kind: "bayt"
title: "ولا ينجي من الغمرات"
part: "1"
order: 121
person: "bishr-ibn-abi-khazim"
verses:
  - "ala-bana-al-khalitu/056"
meaning: "لا يخلّص من شدائد الحرب إلا الثبات في القتال أو الفرار. خاتمة رائية بِشْر، ويقول المَرْزُوقِيّ فيما ينقله التِّبْرِيزِيّ: «وهذه تجري مجرى الأمثال» [@tabrizi-ikhtiyarat، ج3 ص1442]، واستشهد به صاحب اللسان على معنى البراكاء [@lisan، ج10 ص398]."
