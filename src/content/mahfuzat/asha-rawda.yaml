meaning: "ليست روضة جادها المطر، يضاحك زهرها الشمس، أطيب من هُرَيْرَة رائحة ولا أحسن منها عند الأصيل. جملة واحدة في ثلاثة أبيات، وهي عند ابن قُتَيْبة «أحسن ما قيل في الرياض» [@ibn-qutayba، ج1 ص258]."
