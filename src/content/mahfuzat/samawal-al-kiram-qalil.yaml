kind: "bayt"
title: "الكرام قليل"
part: "1"
order: 162
person: "al-samawal"
lines:
  - first: "تُعَيِّرُنَا أَنَّا قَلِيلٌ عَدِيدُنَا"
    second: "فَقُلْتُ لَهَا إِنَّ الْكِرَامَ قَلِيلُ"
meaning: "عيّرته امرأة بقلة قومه، فجعل القلة نفسها فخرًا: الكرام في الناس قليل. من اللامية المنسوبة إلى السَّمَوْأَل، ويرويه أبو الفَرَج في موضع لابنه شُرَيْح [@aghani-dk، ج6 ص331]."
sources:
