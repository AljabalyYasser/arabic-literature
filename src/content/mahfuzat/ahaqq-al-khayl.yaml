kind: "mathal"
part: "1"
order: 122
person: "bishr-ibn-abi-khazim"
text: "أَحَقُّ الخَيْلِ بِالرَّكْضِ المُعَارُ"
meaning: "أولى الخيل بأن يُجهَد الفرسُ المعار، لأن راكبه لا يشفق عليه، و«المعنى لا شَفَقَة لك على العارية، لآنها ليست لك»، وقيل: المعار المسمَّن [@maydani، ج1 ص203]. وهو عجز بيت في رائية بِشْر «ألا بان الخليط»، لكن «أبا عُبَيدة كان يَزْعُم» أن البيت ليس لبِشْر، «وإنما هو للطِّرِمَّاح» [@maydani، ج1 ص203–204]."
