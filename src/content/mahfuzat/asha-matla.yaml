meaning: "يأمر نفسه بوداع هُرَيْرَة لأن الركب على وشك الرحيل، ثم يرجع فيسأل: وهل تطيق وداعًا؟ وهو أول خمسة أصوات قال مَعْبَد إنها «أشد من فتح المدائن التي فتحها قتيبة» [@kamil، ج2 ص197]."
