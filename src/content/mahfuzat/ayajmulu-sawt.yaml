meaning: "أيجمل أن يُصنع هذا بنسائكم وأنتم رجال كالنمل عددًا؟ لو كنا نحن الرجال وكنتم النساء لما رضينا به. هما البيتان اللذان غُنّيا من قصيدة عُفَيْرة، يبدأ بهما أبو الفَرَج خبرها [@aghani-dk، ج11 ص163]، ونسبتهما إليها منسوبة."
