kind: "bayt"
title: "طعنة ثائر"
part: "1"
order: 183
person: "qays-ibn-al-khatim"
lines:
  - first: "طَعَنْتُ ابْنَ عَبْدِ القَيْسِ طَعْنَةَ ثَائِرٍ"
    second: "لَهَا نَفَذٌ لَوْلَا الشُّعَاعُ أَضَاءَهَا"
meaning: "قاله قيس بن الخَطِيم حين ثأر لأبيه من قاتله العبدي: طعنته طعنة نافذة واسعة، لولا الدم المنتشر منها لرأيت الضوء من خلالها. والنفذ: الثقب، والشعاع: حمرة الدم، كما يفسّرهما محققو «الأغاني» [@aghani-dk، ج3 ص3، الحاشية]. ويرويه ابن سَلّام [@ibn-sallam، ج1 ص230]."
story: "thar-qays-ibn-al-khatim"
