meaning: "أأعبد ربًّا واحدًا أم ألف رب إذا توزعت الأمور على الأرباب؟ سؤال يلخّص خروج زيد بن عَمْرو بن نُفَيْل على أصنام قريش قبل الإسلام، قاله «في فراق دين قومه، وما كان لقي منهم في ذلك» [@ibn-hisham، ج1 ص226]."
