kind: "maqta"
title: "كأن لم يكن بين الحجون إلى الصفا"
part: "1"
order: 239
person: "al-harith-ibn-mudad"
lines:
  - first: "كَأَنْ لَمْ يَكُنْ بَيْنَ الحَجُونِ إِلَى الصَّفَا"
    second: "أَنِيسٌ وَلَمْ يَسْمُرْ بِمَكَّةَ سَامِرُ"
  - first: "بَلَى نَحْنُ كُنَّا أَهْلَهَا فَأَزَالَنَا"
    second: "صُرُوفُ اللَّيَالِي وَالجُدُودُ العَوَاثِرُ"
meaning: "صارت مكة كأن لم يسكنها أحد ولم يسهر فيها قوم يتحدثون، بلى، كنا أهلها فأخرجتنا تقلّبات الأيام وحظوظنا العاثرة. يرويهما ابن إسحاق لعَمْرو بن الحارث بن مُضاض الجُرْهُمِيّ حين أُخرجت جُرْهُم من مكة [@ibn-hisham، ج1 ص114–115]، ويرويهما أبو حاتم للحارث بن مُضاض [@muammarun، ص54]، فنسبتهما منسوبة. وصارا مثلًا لكل قوم زال عزهم."
sources:
