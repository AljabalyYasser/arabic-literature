text: "بُؤْ بِشِسْعِ نَعْلِ كُلَيْب"
story: "bu-bishis"
meaning: "قالها المُهَلْهِل حين قتل بُجَيْرًا: مُتْ فأنت كفء لشِسْع نعل كُلَيْب لا لكُلَيْب نفسه [@qali، ج2 ص131]. فكانت هي التي أدخلت الحارِث بن عُبَاد الحرب."
