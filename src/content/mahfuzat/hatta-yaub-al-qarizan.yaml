text: "حَتَّى يَؤُوبَ الْقَارِظَانِ"
story: "al-qarizan"
meaning: "أي: أبدًا. والقارظان رجلان من عَنَزة خرجا يجنيان القَرَظ فلم يرجعا، أحدهما يَذْكُر بن عَنَزة، يُروى أن خُزَيْمة بن نَهْد قتله، والآخر أبو رُهْم [@aghani-dk، ج13 ص80]. وهو والمثل «حتى يؤوب المنخّل» سواء، «كل ذلك سواء فى معنى التأبيد» [@maydani، ج1 ص211]."
