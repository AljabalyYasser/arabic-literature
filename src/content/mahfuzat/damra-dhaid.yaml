meaning: "لا أجعل همّي نجاة نفسي، بل أدفع العدو عن الموضع الذي يؤتى منه قومي. ويقول محققا «المفضليات»: «لا أجعل كبر همي إحراز نفسي، ولكني أحامي عن حيي وأذود عنهم عدوهم» [@mufaddaliyyat، ص326، الحاشية]."
