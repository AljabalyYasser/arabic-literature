meaning: "بيت الشفاعة: لك في كل حيّ نعمة، فليكن لأخي شأس نصيب من عطائك. فلما سمعه الحارث الغسّاني قال: «نعم وأذنبة»، وأطلق شأسًا والأسرى [@ibn-qutayba، ج1 ص215]."
