kind: "maqta"
title: "خزي الحياة وحرب الصديق"
part: "1"
order: 316
person: "bashama-ibn-al-ghadir"
verses:
  - "hajarat-umama/031"
  - "hajarat-umama/032"
  - "hajarat-umama/033"
meaning: "رسالته إلى قومه: خُيّرتم بين خزي الحياة إن خذلتم حلفاءكم، وحرب الصديق إن نصرتموهم، وكلاهما طعام لا يُستساغ. فإن لم يكن إلا أحدهما فسيروا إلى الموت سيرًا جميلًا، ولا تقعدوا وبكم قوة، فالحوادث تغتال المرء على كل حال [@mufaddaliyyat، ص59، الحاشية]."
