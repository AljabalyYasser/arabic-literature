meaning: "لازمة يكررها المُهَلْهِل سبع مرات في رواية القالِيّ، ويغيّر عَجُزها كل مرة: لا أحد من القتلى يعدل كُلَيْبًا [@qali، ج2 ص132]. وهي من أشهر أمثلة التكرار في الرثاء."
