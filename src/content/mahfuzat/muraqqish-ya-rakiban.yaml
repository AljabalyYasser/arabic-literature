story: "asma-wal-muraqqish"
meaning: "كتبهما المُرَقِّش الأكبر، فيما يروي المُفَضَّل، على رحل أجيره الذي تركه مريضًا في كهف: يحمّل كل راكب أن يبلغ أخويه أنسًا وحرملة، ويستحثّهما ألّا يُفلت الأجير حتى يُقتل. فقرأهما حَرْمَلة فقتل الأجير [@tabrizi-ikhtiyarat، ج2 ص993]."
