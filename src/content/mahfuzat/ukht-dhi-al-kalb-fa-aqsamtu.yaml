kind: "maqta"
title: "فأقسمت يا عمرو لو نبهاك"
part: "1"
order: 288
person: "janub-al-hudhaliyya"
lines:
  - first: "فَأَقْسَمْتُ يَا عَمْرُو لَوْ نَبَّهَاكَ"
    second: "إِذًا نَبَّهَا مِنْكَ أَمْرًا عُضَالَا"
  - first: "إِذًا نَبَّهَا لَيْثَ عِرِّيسَةٍ"
    second: "مُفِيدًا مُفِيتًا نُفُوسًا وَمَالَا"
meaning: "تقول أخت عمرو ذي الكلب في أخيها الذي أكله نمران وهو نائم: لو أيقظاه لأيقظا أمرًا شديدًا، أسدًا في عرينه، يكسب الأموال ويُهلك النفوس. و«العضال» الشديد، و«المفيت» «مهلك النفوس والمال» [@sukkari-hudhaliyyin، ص584]. والخبر في مدخل [عمرو ذي الكلب](/people/groups/1/hudhayl/#amr-dhu-al-kalb)."
sources:
  - source: "sukkari-hudhaliyyin"
    loc: "ص583–584"
    url: "https://archive.org/details/3816pdf/page/n600/mode/1up"
status: "review"
