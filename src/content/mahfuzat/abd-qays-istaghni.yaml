meaning: "عش بما أغناك الله به ولا تسأل الناس، وإذا أصابك الفقر فتجلّد ولا تُظهر حاجتك. وفي حاشية محققي «المفضليات»: «الخصاصة: الفقر والحاجة. التجمل: التجلد وتكلف الصبر» [@mufaddaliyyat، ص385، الحاشية]."
