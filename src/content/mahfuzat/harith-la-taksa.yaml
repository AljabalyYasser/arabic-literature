kind: "bayt"
title: "لا تكسع الشول بأغبارها"
part: "1"
order: 47
person: "harith-ibn-hilliza"
lines:
  - first: "لَا تَكْسَعِ الشَّوْلَ بِأَغْبَارِهَا"
    second: "إِنَّكَ لَا تَدْرِي مَنِ النَّاتِجُ"
meaning: "لا تبقِ اللبن في ضروع نوقك بخلًا، فلعلك تموت فيأخذها غيرك. قال المُبَرِّد: «فإن العرب كانت تنضح على ضروعها الماء البارد ليكون أسمن لأولادها التي في بطونها. والغبر: بقية اللبن في الضرع، فيقول: لاتبق ذلك اللبن لسمن الأولاد، فإنك لاتدري من ينتجها، فلعلك تموت، فتكون للوارث أو يغار عليها» [@kamil، ج1 ص295]. والشَّوْل: النوق التي خفّ لبنها [@lisan، ج11 ص374]. يرويه ابن سَلّام للحارِث [@ibn-sallam، ج1 ص152]؛ أما أبو عُبَيْدة فيروي من قصيدته أربعة أبيات ليس فيها هذا البيت، ويقول: «والباقي مصنوع» [@bayan، ج3 ص202]."
