kind: "mathal"
title: "أوائل الشعر عند ابن سلّام"
part: "1"
order: 231
text: "وَلَمْ يَكُنْ لِأَوَائِلِ العَرَبِ مِنَ الشِّعْرِ إِلَّا الأَبْيَاتُ يَقُولُهَا الرَّجُلُ فِي حَاجَتِهِ، وَإِنَّمَا قُصِّدَتِ القَصَائِدُ وَطُوِّلَ الشِّعْرُ عَلَى عَهْدِ عَبْدِ المُطَّلِبِ وَهَاشِمِ بْنِ عَبْدِ مَنَافٍ"
meaning: "قول ابن سَلّام في نشأة الشعر: بدأ أبياتًا قليلة يقولها الرجل في أمر يعنيه، ثم أُطيل حتى صار قصائد في زمن عبد المطلب جدّ النبي وأبيه هاشم [@ibn-sallam، ج1 ص26]. ونقله ابن قُتَيْبة بلفظ قريب: «لم يكن لأوائل الشعراء إلّا الأبيات القليلة يقولها الرجل عند حدوث الحاجة» [@ibn-qutayba، ج1 ص105]."
