kind: "bayt"
title: "ويبقى من المال الأحاديث والذكر"
part: "1"
order: 151
person: "hatim"
verses:
  - "amawiyya/002"
meaning: "جواب حاتم لماويّة حين لامته على إنفاقه: المال لا يقيم عند أحد، يغدو ويروح، ولا يبقى منه إلا ما يتحدث به الناس عن صاحبه. وهو أول بيت في «الصوت» الذي غنّاه إسحاق المَوْصِليّ من القصيدة [@aghani-dk، ج17 ص362]."
