meaning: "«هوت أمه» دعاء في الظاهر، والمراد به «التعجب والمدح كقولهم: قاتله الله ما أفصحه» [@khizana، ج10 ص436]: ما أعظم ما يأتي به الصبح منه إذا غدا إلى الحرب، وما يأتي به الليل إذا رجع."
