kind: "bayt"
title: "يا شدة ما شددنا غير كاذبة"
part: "1"
order: 38
person: "khidash-ibn-zuhayr"
lines:
  - first: "يَا شَدَّةً مَا شَدَدْنَا غَيْرَ كَاذِبَةٍ"
    second: "عَلَى سَخِينَةَ لَوْلَا اللَّيْلُ وَالْحَرَمُ"
meaning: "قاله خِداش بن زُهَيْر يوم نَخْلة من حرب الفِجار: حملنا على قريش حملة صادقة، ولولا الليل والحرم لأهلكناهم. و«سخينة شئ تعير به قريش فجعله اسما لها» [@ibn-sallam، ج1 ص145]."
sources:
  - source: "ibn-sallam"
    loc: "ج1 ص145"
