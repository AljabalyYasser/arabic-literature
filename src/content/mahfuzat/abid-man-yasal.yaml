kind: "bayt"
title: "من يسأل الناس يحرموه"
part: "1"
order: 142
person: "abid-ibn-al-abras"
verses:
  - "aqfara-min-ahlihi/018"
meaning: "سؤال الناس يعود بالحرمان، وسؤال الله لا يعود بالخيبة. يُروى في بائية عَبِيد [@ibn-qutayba، ج1 ص261]، وقال ابن الأعرابي: «هذا البيت ليزيد بن ضبة الثقفي» [@tabrizi-ashr، ص327]، فنسبته إلى عَبِيد مختلف فيها."
