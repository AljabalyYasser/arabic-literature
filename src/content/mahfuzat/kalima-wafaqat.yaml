person: "al-hadrami-ibn-amir"
text: "كَلِمَةٌ وافَقَتْ قَدَرًا وَأَوْرَثَتْ حِقْدًا"
meaning: "يُضرب للكلمة تُقال عرضًا ثم يقع ما قيل فيها. دعا الحَضْرَمِيّ بن عامر على رجل اتهمه بالفرح بموت إخوته بأن يصيبه مثل مصيبته، فهلك إخوة الرجل جميعًا في بئر انخسفت بهم، فقالها الحضرمي [@askari-amthal، ج1 ص375–376]."
