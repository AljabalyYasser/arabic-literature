meaning: "تدعو الخِرْنِق لقومها القتلى ألا يُنسوا: هم سمّ يقتل أعداءهم، ويفنون إبلهم نحرًا للضيفان، ينزلون عن الخيل في ضيق المعركة فيقاتلون على أقدامهم، وهم أعفّاء. والبيتان من شواهد النحاة على قطع النعت [@khizana، ج5 ص41]."
