kind: "mathal"
part: "1"
order: 322
person: "sinan-ibn-abi-haritha"
text: "لا أَفْعَلُهُ حَتَّى تَرْجِعَ ضالَّةُ غَطَفانَ"
meaning: "يُقال لما لا يكون أبدًا. وضالّة غطفان سِنان بن أبي حارثة المُرّيّ، عنّفه قومه على الجود فركب ناقته «ورمى بها الفلاة فلم يُرَ بعد ذلك» [@maydani، ج2 ص233]، فهو لا يرجع."
