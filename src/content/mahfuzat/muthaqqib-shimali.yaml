kind: "bayt"
title: "فإني لو تخالفني شمالي"
part: "1"
order: 276
person: "al-muthaqqib"
verses:
  - "afatimu-qabla-baynik/003"
meaning: "لو خالفته يده اليسرى كما تخالفه صاحبته لفصلها عن يمينه: يقطع من يقطعه ولو كان أقرب الأشياء إليه. ويرى ابن قتيبة أنه أخذه من بيت للنابغة [@ibn-qutayba، ج1 ص158–159]، ويقول محققا «المفضليات» إن المثقّب أقدم من النابغة [@mufaddaliyyat، ص288، الحاشية]."
