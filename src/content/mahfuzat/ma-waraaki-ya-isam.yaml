text: "مَا وَرَاءَكِ يَا عِصَامُ؟"
story: "khitbat-umm-iyas"
meaning: "سؤال عن الخبر الذي يحمله القادم: ما الذي وراءك من الأخبار؟ يروي الميداني عن المُفَضَّل أن ملكًا من كِنْدة قاله لامرأة بعثها تنظر إلى ابنة عَوْف بن مُحَلِّم، ثم يروي عن أبي عُبَيْد أنه قول النابِغة لعِصام بن شَهْبَر حاجب النُّعْمان [@maydani، ج2 ص262–263]."
