kind: "bayt"
title: "إذا الجوزاء أردفت الثريا"
part: "1"
order: 218
person: "khuzayma-ibn-nahd"
lines:
  - first: "إِذَا الْجَوْزَاءُ أَرْدَفَتِ الثُّرَيَّا"
    second: "ظَنَنْتُ بِآلِ فَاطِمَةَ الظُّنُونَا"
meaning: "إذا طلعت الجوزاء في إثر الثريا، وذلك في القيظ، تفرّقت القبائل على المياه، فظن العاشق الظنون في أهل فاطمة: على أي ماء نزلوا؟ وهو تفسير أبي النَّدَى فيما ينقله المَيْدانيّ [@maydani، ج1 ص426]. يرويه أبو الفَرَج لخُزَيْمة بن نَهْد في فاطمة بنت يَذْكُر [@aghani-dk، ج13 ص78]."
