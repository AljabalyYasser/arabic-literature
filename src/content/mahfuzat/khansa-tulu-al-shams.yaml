kind: "maqta"
title: "يذكّرني طلوع الشمس صخرًا"
part: "1"
order: 1
person: "al-khansa"
verses:
  - "yuarriquni/007"
  - "yuarriquni/008"
meaning: "تذكره من طلوع الشمس إلى غروبها، ولولا كثرة الباكين حولها على إخوانهم لقتلت نفسها. يرويهما القالِيّ عن أبي عُبَيْدة في سينيتها [@qali، ج2 ص163]، ويفسّر المُبَرِّد أولهما [@kamil، ج3 ص113]."
chapter: "al-khansa/marathi-ukhra"
