meaning: "خاتمة الهمزية: لسانه سيف قاطع، وشعره بحر لا تكدّره الدلاء مهما أخذت منه. فخر الشاعر بآلته، وهو آخر بيت في رواية ابن إسحاق [@ibn-hisham، ج2 ص424]."
