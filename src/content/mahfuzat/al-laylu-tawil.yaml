kind: "mathal"
part: "1"
order: 60
person: "al-sulayk-ibn-al-sulaka"
text: "إِنَّ اللَّيْلَ طَوِيلٌ وَأَنْتَ مُقْمِرٌ"
meaning: "قاله السُّلَيْك بن السُّلَكة لرجل جثم عليه وهو نائم في ليلة مقمرة وقال له: استأسر. يريد: أمامك ليل طويل مقمر تجد فيه غيري، فدعني. و«يضرب عند الأمر بالصبر والتأنيّ في طلب الحاجة» [@maydani، ج1 ص30]."
