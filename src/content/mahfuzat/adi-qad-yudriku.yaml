kind: "bayt"
title: "قد يدرك المبطئ"
part: "1"
order: 83
person: "adi-ibn-zayd"
lines:
  - first: "قَدْ يُدْرِكُ الْمُبْطِئُ مِنْ حَظِّهِ"
    second: "وَالْخَيْرُ قَدْ يَسْبِقُ جَهْدَ الْحَرِيصِ"
meaning: "قد ينال المتمهّل نصيبه، وقد يفوت الخيرُ الحريصَ الذي يجهد في طلبه. يقول ابن قُتَيْبة: «ويستجاد له قوله» [@ibn-qutayba، ج1 ص225]، ويرويه المَرْزُبانيّ: «والخير قد يسبق حرص الحريص» [@marzubani، ص250]."
sources:
