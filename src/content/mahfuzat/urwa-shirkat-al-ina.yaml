kind: "maqta"
title: "إنائي شركة"
part: "1"
order: 51
person: "urwa-ibn-al-ward"
lines:
  - first: "إِنِّي امْرُؤٌ عَافِي إِنَائِيَ شِرْكَةٌ"
    second: "وَأَنْتَ امْرُؤٌ عَافِي إِنَائِكَ وَاحِدُ"
  - first: "أَتَهْزَأُ مِنِّي أَنْ سَمِنْتَ وَقَدْ تَرَى"
    second: "بِجِسْمِيَ مَسَّ الحَقِّ وَالحَقُّ جَاهِدُ"
  - first: "أُقَسِّمُ جِسْمِي فِي جُسُومٍ كَثِيرَةٍ"
    second: "وَأَحْسُو قَرَاحَ المَاءِ وَالمَاءُ بَارِدُ"
meaning: "يرد عروة على من عيّره بهزاله: طعامي يشركني فيه الناس وطعامك لك وحدك، فأنا هزيل لأني أقسم قوتي على غيري وأشرب الماء الخالص في البرد. والعافي: طالب المعروف، والقراح: الماء الذي لا يخالطه شيء. وبها قال عبد الملك بن مروان: «ما يسرني أن أحدا من العرب ولدني ممن لم يلدني إلا عروة بن الورد لقوله» [@aghani-dk، ج3 ص74]."
