kind: "bayt"
title: "أقول وقد شدوا لساني بنسعة"
part: "1"
order: 201
person: "abd-yaghuth"
verses:
  - "ala-la-talumani/008"
meaning: "يقول الأسير لآسريه وقد ربطوا لسانه بسير من جلد لئلا يهجوهم: أطلقوا لساني. وبه يضرب الجاحظ المثل لخوف العرب من الهجاء: «وربما شدوا لسانه بنسعة، كما صنعوا بعبد يغوث» [@bayan، ج3 ص273]."
