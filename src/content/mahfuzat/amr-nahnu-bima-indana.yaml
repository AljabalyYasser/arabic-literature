kind: "bayt"
title: "والرأي مختلف"
part: "1"
order: 185
person: "amr-ibn-imri-al-qais"
lines:
  - first: "نَحْنُ بِمَا عِنْدَنَا وَأَنْتَ بِمَا"
    second: "عِنْدَكَ رَاضٍ وَالرَّأْيُ مُخْتَلِفُ"
meaning: "نحن راضون بما عندنا، وأنت راضٍ بما عندك، ورأينا مختلف. قاله عَمْرو بن امرئ القَيْس لمالك بن العَجْلان في حرب سُمَيْر [@jamhara، ص531]، وصار شاهدًا للنحاة على حذف الخبر لدلالة ما بعده عليه [@khizana، ج4 ص277]. ويرويه سِيبَوَيْه لقيس بن الخَطِيم [@sibawayh، ج1 ص74–75]، فنسبته مختلف فيها."
story: "harb-sumayr"
