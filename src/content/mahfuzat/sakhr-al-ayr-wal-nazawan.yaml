meaning: "يهمّ بالأمر الحازم ولا يقدر عليه، كالحمار الذي حيل بينه وبين الوثب. قاله صخر في مرضه الأخير، وصار عجزه مثلًا في من يعجز عما يريد، قال ابن بَرِّيّ: «وأول من قاله صخر بن عمرو السلمي أخو الخنساء» [@lisan، ج15 ص319]."
