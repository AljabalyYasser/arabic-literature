kind: "bayt"
title: "ازجر العين أن تبكي الطلولا"
part: "1"
order: 20
person: "al-muhalhil"
verses:
  - "uzjur-al-ayn/001"
meaning: "امنع عينك من البكاء على الأطلال، ففي الصدر من مقتل كُلَيْب حرارة لا تنطفئ. مطلع يرد عادة الشعراء في البكاء على الديار، وهو أكثر شعر المُهَلْهِل غناءً [@aghani، ج5 ص61–63]."
