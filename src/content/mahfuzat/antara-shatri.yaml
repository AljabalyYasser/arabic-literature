meaning: "نصفي من أشرف عبس أصلًا، ونصفي الآخر أحميه بالسيف. قال ابن قُتَيْبة: «يقول: النصف من نسبى فى خير عبس، وأحمى النصف الآخر، وهو نسبه فى السودان، بالسيف، فأشرّفه أيضا» [@ibn-qutayba، ج1 ص246]."
