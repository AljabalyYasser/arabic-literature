kind: "bayt"
title: "العرض قبل الثياب"
part: "1"
order: 161
person: "al-samawal"
lines:
  - first: "إِذَا الْمَرْءُ لَمْ يَدْنَسْ مِنَ اللُّؤْمِ عِرْضُهُ"
    second: "فَكُلُّ رِدَاءٍ يَرْتَدِيهِ جَمِيلُ"
meaning: "من سلم عرضه من الخسّة فلا يضرّه ما لبس، و«يريد لا يضرّه إخلاق الثياب، إذا كان عرضه سليماً من العاب» [@simt، ج1 ص596]. مطلع لامية تُنسب إلى السَّمَوْأَل، ويردّها بعض القدماء إلى شاعر إسلامي من بني الحارث بن كعب."
sources:
