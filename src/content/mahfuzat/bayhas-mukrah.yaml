person: "bayhas"
text: "مُكْرَهٌ أَخُوكَ لا بَطَلٌ"
meaning: "يُضرب لمن يُحمل على أمر لا يريده: لست شجاعًا، بل دُفعت إليه دفعًا. قاله أبو حنش خال بَيْهَس حين دفعه بيهس إلى غار فيه قتلة إخوته، فقال قائل: «إن أبا حَنَشٍ لَبَطَل» [@maydani، ج1 ص153]. والحكاية في [مدخل بيهس](/people/groups/1/amthal/#bayhas)."
