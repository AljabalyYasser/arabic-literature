kind: "bayt"
title: "بلى إنها تعفو الكلوم"
part: "1"
order: 282
person: "abu-khirash"
lines:
  - first: "بَلَى إِنَّهَا تَعْفُو الْكُلُومُ وَإِنَّمَا"
    second: "نُوَكَّلُ بِالْأَدْنَى وَإِنْ جَلَّ مَا يَمْضِي"
meaning: "الجراح تبرأ، وإنما يلازم الحزنُ المرءَ على المصيبة القريبة، وإن كانت التي مضت أعظم. وفي الشرح المطبوع مع القصيدة أن المعنى: إنما نحزن على الأقرب فالأقرب، وننسى من مضى وإن عظم [@sukkari-hudhaliyyin، ص1230]. قاله أبو خراش بعد أن أقسم ألا ينسى أخاه، فاستدرك على نفسه."
