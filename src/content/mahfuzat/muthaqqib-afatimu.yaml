meaning: "أعطيني شيئًا قبل الفراق، فمنعك ما أسألك مثل فراقك. وهو مطلع القصيدة التي يروي ابن قتيبة أن أبا عمرو بن العلاء قال فيها: «لو كان الشعر مثلها لوجب على الناس أن يتعلّموه» [@ibn-qutayba، ج1 ص383]."
