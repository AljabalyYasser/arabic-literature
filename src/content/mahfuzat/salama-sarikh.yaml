kind: "bayt"
title: "كان الصراخ له قرع الظنابيب"
part: "1"
order: 274
person: "salama-ibn-jandal"
verses:
  - "awda-al-shabab/036"
meaning: "كان قومه إذا جاءهم مستغيث أغاثوه في الحال، فإغاثتهم أن يقرعوا ظنابيبهم، أي يعزموا ويشمّروا للخروج. والظنبوب حرف عظم الساق، ويقال: قرع ظنبوبه لهذا الأمر إذا عزم عليه، كما يقول محققا «المفضليات» [@mufaddaliyyat، ص124، الحاشية]."
