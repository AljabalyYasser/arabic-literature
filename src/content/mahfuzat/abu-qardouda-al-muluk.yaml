meaning: "من نزل بالملوك أصابه شرر من نارهم، فالقرب منهم خطر وإن كان نعمة. قاله أبو قُرْدُودة في رثاء صاحبه ابن عَمّار، وكان قد نهاه عن منادمة النعمان فقتله النعمان [@bayan، ج1 ص281]."
