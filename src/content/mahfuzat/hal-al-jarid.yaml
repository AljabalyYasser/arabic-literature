person: "abid-ibn-al-abras"
text: "حَالَ الجَرِيضُ دُونَ القَرِيضِ"
story: "abid-yawm-al-bus"
meaning: "الجريض: الغصّة، والقريض: الشعر، أي منع الهمّ من القول. يقول العسكري إنه «يضْرب مثلا للمعضلة تعرض فتشغل عَن غَيرهَا»، وإنه لعَبِيد بن الأَبْرَص قاله للمنذر يوم بؤسه [@askari-amthal، ج1 ص359]. ويرويه المَيْداني بأصل آخر: شاب نهاه أبوه عن الشعر حتى مرض، فلما أذن له قال هذا القول [@maydani، ج1 ص191]."
