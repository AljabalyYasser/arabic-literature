text: "المَنِيَّةَ وَلَا الدَّنِيَّةَ"
meaning: "أختار الموت ولا أرضى بالذل. يقول الميداني: «أي أختار المنيةَ على العار»، ويقول: «قيل: المثل لأوس بن حارثة» [@maydani، ج2 ص303]، وهو أول وصيته لابنه مالك في رواية القالِيّ [@qali، ج1 ص102]."
