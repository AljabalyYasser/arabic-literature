kind: "bayt"
title: "تلك المكارم"
part: "1"
order: 192
person: "abu-al-salt"
verses:
  - "li-yatlubi-al-witra/011"
meaning: "هذه هي المكارم حقًّا، لا أن تسقي ضيفك قدحين من لبن ممزوج بالماء. قاله أبو الصَّلْت في سيف بن ذي يَزَن، وصار مثلًا يتمثّل به الشعراء: يذكره ابن سَلّام في ما تأخذه العرب «لا يريدون به السرقة»، ويقول: «ترويه عامر للنابغة الرواة مجمعون أن أبا الصلت بن أبى ربيعة قاله» [@ibn-sallam، ج1 ص58–59]."
sources:
