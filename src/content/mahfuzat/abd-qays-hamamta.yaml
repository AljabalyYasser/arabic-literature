meaning: "تمهّل إذا هممت بشرّ فلعلك تتركه، وأسرع إذا هممت بخير قبل أن يفوتك. وفي رواية الأَصْمَعِيّ: «فاعجل» مكان «فافعل» [@asmaiyyat، ص230]."
