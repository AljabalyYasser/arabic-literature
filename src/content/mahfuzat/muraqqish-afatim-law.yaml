meaning: "يا فاطمة، لو كانت النساء كلهن في بلد وأنتِ وحدك في بلد آخر، لتركتهن وتبعتك هائمًا. والبيت في المفضلية 56 [@mufaddaliyyat، ص246]، ويرويه ابن قُتَيْبة في خبره [@ibn-qutayba، ج1 ص210]."
