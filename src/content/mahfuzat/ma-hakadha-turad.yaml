kind: "mathal"
part: "1"
order: 232
person: "malik-ibn-zayd-manat"
text: "أَوْرَدَهَا سَعْدٌ وَسَعْدٌ مُشْتَمِلْ، مَا هَكَذَا تُورَدُ يَا سَعْدُ الإِبِلْ"
meaning: "أورد سعد الإبل الماء وهو ملتفّ بثوبه لم يشمّر للعمل، وليس هكذا تُسقى الإبل. قاله مالك بن زَيْد مَناة في أخيه سعد [@ibn-sallam، ج1 ص30]، و«يضرب مثلا للرجل يقصر في الأمر» كما يقول العسكري [@askari-amthal، ج1 ص93]."
