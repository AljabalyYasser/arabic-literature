kind: "maqta"
title: "تأخرت أستبقي الحياة"
part: "1"
order: 262
person: "al-husayn-ibn-al-humam"
lines:
  - first: "تَأَخَّرْتُ أَسْتَبْقِي الحَيَاةَ فَلَمْ أَجِدْ"
    second: "لِنَفْسِي حَيَاةً مِثْلَ أَنْ أَتَقَدَّمَا"
  - first: "فَلَسْنَا عَلَى الأَعْقَابِ تَدْمَى كُلُومُنَا"
    second: "وَلَكِنْ عَلَى أَقْدَامِنَا تَقْطُرُ الدِّمَا"
meaning: "تأخرت عن القتال أطلب البقاء، فلم أجد ما يحفظ الحياة مثل التقدم. ولسنا ممن يولّي فتسيل دماء جراحه على عقبيه، بل نستقبل السيوف فتقطر دماؤنا على مقدّم أقدامنا. والبيتان من اختيار أبي تَمّام في «الحماسة» [@tabrizi-hamasa، ج1 ص60–61]، وليسا في رواية المُفَضَّل للقصيدة، وينشد ابن قُتَيْبة الثاني منهما [@ibn-qutayba، ج2 ص634]."
sources:
