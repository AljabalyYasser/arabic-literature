meaning: "رحلت سُميّة في الصباح ولم تُقم، فاغتنم متعة الوداع. وبهذا المطلع كان حسّان بن ثابت، فيما يُروى، يسأل إذا قيل له إن الأشعار تُنوشدت: «فهل أُنشدت كلمة الحُوَيْدِرة» [@aghani-dk، ج3 ص271]."
