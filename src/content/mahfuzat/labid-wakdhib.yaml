kind: "bayt"
title: "واكذب النفس إذا حدثتها"
part: "1"
order: 2
person: "labid"
verses:
  - "inna-taqwa-rabbina/022"
meaning: "منِّ نفسك بالخير ولا تصارحها بالموت والخيبة، فمصارحتها بذلك تقتل الأمل. قال ابن قُتَيْبة: «اكذب النفس أن تعدها الخبر وتمنّيها إيّاه، وإذا صدقها فقال لها مصيرك إلى الهلكة والزوال أزرى ذلك بأمله» [@ibn-qutayba، ج1 ص272]. ونقل البَغْداديّ عن الزَّمَخْشَرِيّ في شطره الأول: «هَذَا المصراع مثل يضْرب فِي الْحَث على الجسارة» [@khizana، ج9 ص303]."
chapter: "labid/fi-al-islam"
status: "review"
