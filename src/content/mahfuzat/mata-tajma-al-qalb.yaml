meaning: "إذا اجتمع لك قلب ذكي، وسيف قاطع، ونفس أبيّة لا تقبل الضيم، تجنّبك الظالمون. وتمثّل به الحَجّاج بن يوسف في خطبة توعّد فيها أهل العراق، فقال: «وإن مثلي ومثلكم قول ابن براقة الهمداني» [@kamil، ج1 ص215]."
