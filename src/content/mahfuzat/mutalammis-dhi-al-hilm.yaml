kind: "bayt"
title: "لذي الحلم تُقرع العصا"
part: "1"
order: 96
person: "al-mutalammis"
verses:
  - "tuayyiruni-ummi/007"
meaning: "يقول المتلمّس لخاله: العاقل يكفيه التنبيه، كما كانت العصا تُقرع لحكيم العرب إذا سها فيتنبه، وما تعلّم الإنسان إلا ليعلم. وفي المثل «أحلم ممن قرعت له العصا»، يقول العَسْكَرِيّ: «وقيل هو عامر بن الظرب العدواني وكان قد أسن فربما هفا في نادي الحكم فتقرع له العصا فيرتدع» [@askari-amthal، ج1 ص406]."
