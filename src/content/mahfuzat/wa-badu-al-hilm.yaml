meaning: "الحلم مع من لا يعرف قدره قد يصير ذلًّا، والشر قد يُنجي حين لا يُنجي الإحسان. ضرب الميداني البيتين مثلًا لقولهم: «قد يدفع الشر بمثله، إذا أعياك غيره» [@maydani، ج2 ص97–98]."
