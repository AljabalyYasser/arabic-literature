person: "al-asha"
verses:
  - "wadda-hurayra/046"
meaning: "يقول ليَزِيد بن مُسْهِر: أنت في سعيك إلى النيل منا كوعل نطح صخرة ليشقها، فلم يضرها وأضعف قرنه. قال التِّبْرِيزِيّ: «المعنى: أنك تكلف نفسك ما لا تصل إليه ويرجع ضرره عليك» [@tabrizi-ashr، ص302]."
