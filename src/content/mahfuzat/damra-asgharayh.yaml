person: "damra-ibn-damra"
text: "الْمَرْءُ بِأَصْغَرَيْهِ: قَلْبِهِ وَلِسَانِهِ"
story: "al-muaydi"
meaning: "قيمة الرجل بأصغر ما فيه، قلبه ولسانه، لا بجسمه. وهو جواب ضمرة لملك الحيرة حين ازدراه [@bayan، ج1 ص201]، وفي اللسان عن ابن السِّكِّيت: «وَمَعْنَاهُ أَن المَرْءَ يَعْلُو الأُمور ويَضْبِطها بِجَنانه وَلِسَانِهِ» [@lisan، ج4 ص458]."
