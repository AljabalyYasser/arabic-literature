kind: "bayt"
title: "وفي الأرض منأى للكريم"
part: "1"
order: 61
person: "al-shanfara"
verses:
  - "aqimu-bani-ummi/003"
meaning: "في الأرض مكان بعيد يلجأ إليه الكريم إذا أُوذي، وموضع يعتزل فيه من يخاف البغض، فلا يلزمه أن يقيم حيث يُهان. وهو من «لامية العرب» المنسوبة إلى الشَّنْفَرَى، ومن أشهر أبياتها. والمنأى: «اسم مكان من نأى أي: بعد» [@khizana، ج3 ص342]."
sources:
  - source: "khizana"
    loc: "ج3 ص342"
