kind: "bayt"
title: "فقد عجبت وما بالدهر من عجب"
part: "1"
order: 286
person: "al-mutanakhkhil"
lines:
  - first: "فَقَدْ عَجِبْتُ وَمَا بِالدَّهْرِ مِنْ عَجَبٍ"
    second: "أَنَّى قُتِلْتَ وَأَنْتَ الْحَازِمُ الْبَطَلُ"
meaning: "يرثي المتنخل ابنه أثيلة: عجبت كيف قُتلت وأنت الحازم الشجاع، ثم يستدرك أن لا عجب في الموت. يقول الشرح: «وما بالموت من عجب»، و«أنى قتلت»: «كيف قتلت وأنت شجاع بطل» [@sukkari-hudhaliyyin، ص1281]. وبه يبدأ ابن قُتَيْبة ما ينشده من المرثية، ويرويه «لقد عجبت» [@ibn-qutayba، ج2 ص648]."
