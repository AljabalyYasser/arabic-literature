kind: "bayt"
title: "ومن تعرض للغربان يزجرها"
part: "1"
order: 114
person: "alqama"
verses:
  - "hal-ma-alimta/037"
meaning: "من تطيّر بالغراب فزجره وهو سالم، فهو المشؤوم لا الغراب. يقول المَرْزُوقِيّ: «كأنه ينكر الإيمان بالطيرة» [@tabrizi-ikhtiyarat، ج3 ص1619]. ويضعه الجاحظ فيمن أنكر الطِّيَرة، وينسبه مرة إلى سلامة بن جندل [@hayawan، ج3 ص214] ومرة إلى عَلْقَمة [@hayawan، ج7 ص87]."
