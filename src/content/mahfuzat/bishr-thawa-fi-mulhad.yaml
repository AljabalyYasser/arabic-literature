kind: "bayt"
title: "ثوى في ملحد لا بد منه"
part: "1"
order: 123
person: "bishr-ibn-abi-khazim"
lines:
  - first: "ثَوَى فِي مُلْحَدٍ لَا بُدَّ مِنْهُ"
    second: "كَفَى بِالمَوْتِ نَأْيًا وَاغْتِرَابَا"
  - first: "رَهِينُ بِلًى وَكُلُّ فَتًى سَيَبْلَى"
    second: "فَشُقِّي الجَيْبَ وَانْتَحِبِي انْتِحَابَا"
story: "maqtal-bishr"
meaning: "يقول لابنته: صار أبوك في لحد لا مفرّ منه، والموت أبعد النأي وأشد الغربة، وهو رهين البلى كما يبلى كل فتى، فشقّي جيبك وابكيه. البيتان اللذان اختارهما الفرزدق وجرير حين سُئلا عن أشعر العرب، «فاتفقا على بشر بن أبي خازم كما ترى» [@ibn-rashiq، ج1 ص96]. ودرجتهما «مختلف فيه»: لا نجد القصيدة تامّة في مصادرنا، والرواة عند الجاحظ يعدّونها من المصنوع في شعره، والفرزدق وجرير يقدّمان بها بِشْرًا [@hayawan، ج6 ص461]. ويرويهما المرتضى بلفظ آخر في البيت الثاني: «فأذرى الدّمع وانتجى انتحابا» [@murtada، ج1 ص341]."
