person: "imru-al-qais"
verses:
  - "la-amruka/019"
meaning: "يمدح سعد بن الضِّباب بأنه جمع أربع خصال، كل واحدة منها من رجل ذكره في البيت قبله: أبيه وخاله ويزيد وحُجْر، ويعطي في صحوه وسكره. قال البغدادي في مدح الكريم بالعطاء في الحالين: «وأول من نطق بهذا امرؤ القَيْس» [@khizana، ج5 ص52]."
chapter: "imru-al-qais/shir-al-tarid"
