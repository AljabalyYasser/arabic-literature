kind: "bayt"
title: "يغشون حتى ما تهر كلابهم"
part: "2"
order: 404
person: "hassan"
verses:
  - "asalta-rasm-al-dar/012"
meaning: "يكثر الضيوف على آل جفنة حتى ألفتهم الكلاب فلا تهرّ عليهم، ولا يسألون عن القادم من بعيد من هو. ويروي ابن رَشِيق عن الحطيئة عند موته: «أبلغوا الأنصار أن أخاهم أمدح الناس حيث يقول: يغشون حتى ما تهر كلابهم» [@ibn-rashiq، ج2 ص139]."
chapter: "hassan/fi-al-jahiliyya"
status: "review"
