kind: "bayt"
title: "وبالأشقين ما كان العقاب"
part: "1"
order: 2
person: "imru-al-qais"
lines:
  - first: "وَقَاهُمْ جَدُّهُمْ بِبَنِي أَبِيهِمْ"
    second: "وَبِالْأَشْقَيْنَ مَا كَانَ الْعِقَابُ"
meaning: "قاله حين أغار على بني كِنانة يظنهم بني أَسَد قتلة أبيه: حماهم حظهم بإخوتهم، ووقع العقاب على الأشقى. وعدّه ابن قُتَيْبة مما يُتمثّل به من شعره [@ibn-qutayba، ج1 ص113]، وذكر المُبَرِّد عجزه في الأعجاز السائرة [@mubarrad-ajaz، ص165]."
chapter: "imru-al-qais/hayatuhu"
