kind: "maqta"
title: "فلأهدين مع الرياح قصيدة"
part: "1"
order: 269
person: "al-musayyab-ibn-alas"
lines:
  - first: "فَلَأُهْدِيَنَّ مَعَ الرِّيَاحِ قَصِيدَةً"
    second: "مِنِّي مُغَلْغَلَةً إِلَى القَعْقَاعِ"
  - first: "تَرِدُ المِيَاهَ فَمَا تَزَالُ غَرِيبَةً"
    second: "فِي القَوْمِ بَيْنَ تَمَثُّلٍ وَسَمَاعِ"
meaning: "يرسل إلى ممدوحه القعقاع بن معبد قصيدة تحملها الرياح، وتنزل مع الركبان على المياه، فتبقى بين الناس غريبة يتمثّلون بها ويسمعونها. والبيتان من المفضلية 11 [@mufaddaliyyat، ص62]، وينشد ابن سَلّام أولهما [@ibn-sallam، ج1 ص156–157]."
