meaning: "شفى نفسي من مرضها أن ينادي الفرسان باسمي في الحرب: تقدّم يا عنترة. قال الزَّوْزَنِيّ: «يريد أن تعويل أصحابه عليه والتجاءهم إليه شفى نفسه ونفى غمه» [@zawzani، ص264]. ويروي أبو جَعْفَر في شرح البيت خبر «العبد لا يحسن الكر» [@ibn-al-anbari، ص360]."
