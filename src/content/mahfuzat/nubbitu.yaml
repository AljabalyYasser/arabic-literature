kind: "maqta"
title: "واستبّ بعدك يا كليب المجلس"
part: "1"
order: 10
person: "al-muhalhil"
lines:
  - first: "نُبِّئْتُ أَنَّ النَّارَ بَعْدَكَ أُوقِدَتْ"
    second: "وَاسْتَبَّ بَعْدَكَ يَا كُلَيْبُ الْمَجْلِسُ"
  - first: "وَتَكَلَّمُوا فِي أَمْرِ كُلِّ عَظِيمَةٍ"
    second: "لَوْ كُنْتَ شَاهِدَهُمْ بِهَا لَمْ يَنْبِسُوا"
meaning: "بعدك أُوقدت نيران غير نارك، وتسابّ أهل مجلسك، وتكلموا في العظائم، ولو كنت حاضرًا ما نطقوا بحرف. كان كُلَيْب «لا تُوقد مع ناره للضيفان نار»، ولا يجسر أحد في مجلسه أن يسابّ غيره [@marzuqi-hamasa، ص655–656]."
chapter: "1/ayyam-al-arab"
sources:
  - source: "marzuqi-hamasa"
    loc: "ص655–656"
