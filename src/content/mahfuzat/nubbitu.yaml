kind: "maqta"
title: "واستبّ بعدك يا كليب المجلس"
part: "1"
order: 10
person: "al-muhalhil"
lines:
  - first: "نُبِّئْتُ أَنَّ النَّارَ بَعْدَكَ أُوقِدَتْ"
    second: "وَاسْتَبَّ بَعْدَكَ يَا كُلَيْبُ الْمَجْلِسُ"
  - first: "وَتَكَلَّمُوا فِي أَمْرِ كُلِّ عَظِيمَةٍ"
    second: "لَوْ كُنْتَ شَاهِدَهُمْ بِهَا لَمْ يَنْبِسُوا"
meaning: "بعدك أُوقدت نيران غير نارك، وتسابّ أهل مجلسك، وتكلموا في العظائم، ولو كنت حاضرًا ما نطقوا بحرف. كان كُلَيْب «لا توقد نار مع ناره» [@iqd، ج6 ص70]، و«كان كليب إذا جلس لم يرفع بحضرته صوت، ولم يستب بفنائه اثنان» [@kamil، ج1 ص251]. والبيتان من أربعة أبيات اختارها أبو تَمّام [@tabrizi-hamasa، ج1 ص385]."
chapter: "1/ayyam-al-arab"
