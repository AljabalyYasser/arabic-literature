kind: "bayt"
title: "كانت مواعيد عرقوب لها مثلا"
part: "2"
order: 422
person: "kaab-ibn-zuhayr"
verses:
  - "banat-suad/010"
meaning: "سعاد لا تفي بوعد، ومواعيدها كمواعيد عرقوب الذي وعد صاحبه ثمر نخلة ثم جدّها ليلًا، فذهب «موعود عرقوب مثلا» كما يقول السُّكَّريّ [@diwan-kaab، ص9]. وصار الشطر الأول مثلًا في إخلاف الوعد."
chapter: "kaab-ibn-zuhayr/banat-suad-1"
