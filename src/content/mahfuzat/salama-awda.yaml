meaning: "رثاء الشباب: ذهب سريعًا والشيب يطلبه، ولو كان ركض الطير يدركه لطلبه. يقول الأصمعي في البيت الثاني: «لَمْ يَقُلْ أَحد فِي هَذَا الْمَعْنَى مِثْلَ هَذَا الْبَيْتِ» [@lisan، ج7 ص159]، ويقول ابن قتيبة إنها أجود شعره [@ibn-qutayba، ج1 ص264]."
