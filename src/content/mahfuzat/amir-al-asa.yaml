person: "amir-ibn-al-zarib"
text: "إِنَّ العَصَا قُرِعَتْ لِذِي الحِلْمِ"
story: "qar-al-asa"
meaning: "العاقل يكفيه التنبيه. يُروى أن عامر بن الظَّرِب لما أسنّ كانت تُقرع له العصا إذا سها في حكمه فينتبه، ويختلف الرواة في الحكيم الذي قُرعت له. يقول الميداني: «والمثل يضرب لمن إذا نُبِّه انتبه» [@maydani، ج1 ص38]."
