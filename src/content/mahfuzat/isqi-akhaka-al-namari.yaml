kind: "mathal"
part: "1"
order: 166
person: "kab-ibn-mama"
text: "اسْقِ أَخَاكَ النَّمَرِيَّ"
meaning: "قاله كَعْب بن مامة للساقي حين آثر رفيقه النَّمَريّ بنصيبه من الماء في سفر، حتى مات عطشًا، فقيل: «أجود من كعب بن مامة» [@maydani، ج1 ص183]. و«يضْرب مثلا لكل من طلب الشَّيْء مرَارًا» [@askari-amthal، ج1 ص94]."
