kind: "bayt"
title: "كالمستجير من الرمضاء بالنار"
part: "1"
order: 3
lines:
  - first: "الْمُسْتَجِيرُ بِعَمْرٍو عِنْدَ كُرْبَتِهِ"
    second: "كَالْمُسْتَجِيرِ مِنَ الرَّمْضَاءِ بِالنَّارِ"
meaning: "في رواية المَيْدانيّ أن كُلَيْبًا استغاث وهو يحتضر بعَمْرو بن الحارِث، فنزل إليه فأجهز عليه، فضُرب به المثل [@maydani، ج1 ص375]. والرمضاء: الأرض الحارة. يُضرب لمن يلجأ من شر إلى ما هو شر منه."
station: "1-2"
sources:
