meaning: "كل غائب يرجع إلا من غيّبه الموت. من أبيات الحكمة في بائية عَبِيد، يرويه ابن قُتَيْبة فيما اختار منها [@ibn-qutayba، ج1 ص261]، ويُقال عند كل فقد."
