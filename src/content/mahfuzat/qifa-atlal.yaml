meaning: "مطلع المعلقة كاملًا: يستوقف صاحبيه عند منزل الحبيبة، ويصف أثر الديار، ويذكر يوم الرحيل، وأصحابه يأمرونه بالصبر، ثم يسأل: هل ينفع البكاء عند رسم دارس؟ وهو عند النقاد «أفضل ابتداء صنعه شاعر» [@ibn-rashiq، ج1 ص218]."
