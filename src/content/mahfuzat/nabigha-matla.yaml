person: "al-nabigha"
verses:
  - "ya-dara-mayya/001"
meaning: "ينادي دار مَيّة وقد خلت من أهلها وطال عليها الدهر، والنداء توجّع لا طلب جواب، كما يقول الأَعْلَم: «فجعل يخاطبها توجعا منه لما رأى من تغيرها، وتذكرا لما عهده منها» [@diwan-nabigha، ص14]. وفي رواية أبي عَمْرو بن العَلاء أن النابِغة دسّ إلى قينة النُّعْمان «بثلاثة أبيات، من أول قوله: يا دار مَيّة بالعَلْياء فالسَّنَد»، فلما سمعها الملك قال: «هذا شعر علويّ، هذا شعر النابغة» [@diwan-nabigha، ص29]."
