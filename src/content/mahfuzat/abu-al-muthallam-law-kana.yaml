kind: "bayt"
title: "لو كان للدهر مال عند متلده"
part: "1"
order: 287
lines:
  - first: "لَوْ كَانَ لِلدَّهْرِ مَالٌ عِنْدَ مُتْلِدِهِ"
    second: "لَكَانَ لِلدَّهْرِ صَخْرٌ مَالَ قُنْيَانِ"
meaning: "مطلع رثاء أبي المثلّم الهذلي لخصمه صخر الغيّ: لو كان الدهر يقتني مالًا لاقتنى صخرًا وأمسكه ولم يفرّط فيه. يقول الشرح: «أى لو كان الدهر يقتنى مالاً لاقتنى صخرًا» [@sukkari-hudhaliyyin، ص284]. والخبر في مدخل [صخر الغي](/people/groups/1/hudhayl/#sakhr-al-ghay)."
