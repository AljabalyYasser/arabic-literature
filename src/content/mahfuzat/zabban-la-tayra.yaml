kind: "maqta"
title: "لا طير إلا على متطير"
part: "1"
order: 314
person: "zabban-ibn-sayyar"
lines:
  - first: "تَعَلَّمْ أَنَّهُ لَا طَيْرَ إِلَّا"
    second: "عَلَى مُتَطَيِّرٍ وَهْوَ الثُّبُورُ"
  - first: "بَلَى شَيْءٌ يُوَافِقُ بَعْضَ شَيْءٍ"
    second: "أَحَايِينًا وَبَاطِلُهُ كَثِيرُ"
meaning: "لا شؤم إلا على من يتشاءم، والتطيّر هلاك صاحبه. وقد يوافق شيء شيئًا أحيانًا فيظن الناس أن الطير صدقت، وأكثر ذلك باطل. يرويهما الجاحظ لزبّان [@bayan، ج3 ص203]، ونسبتهما إليه «منسوب». وتعلّم: اعلم، يقال: «تعلّم في موضع اعلم» [@lisan، ج12 ص417]، والثبور: «الهلاك والخسران والويل» [@lisan، ج4 ص99]."
