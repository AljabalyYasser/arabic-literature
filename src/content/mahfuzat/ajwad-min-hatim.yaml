person: "hatim"
text: "أَجْوَدُ مِنْ حَاتِمٍ"
meaning: "يُضرب في الجود. يقول المَيْدانيّ في حاتم: «كان جواداً شجاعاً شاعراً مُظَفراً، إذا قاتل غَلَب، وإذا غنم نهب، وإذا سُئل وهب، وإذا ضَرَب بالقِداح سَبَق، وإذا أسَرَ أطلق، وإذا أثْرى أنفق» [@maydani، ج1 ص182]. ويرويه العَسْكَرِيّ قبله، ويقول بعد أن يذكر فكّه الأسير بنفسه: «وما روى مثل هذا عن أحد قبله ولا بعده» [@askari-amthal، ج1 ص338]. وقال أبو عُبَيْدة: «أجواد العرب ثلاثة: كعب بن مامة، وحاتم طيئ، (وكلاهما ضرب به المثل)، وهرم بن سنان صاحب زهير» [@ibn-qutayba، ج1 ص235]."
