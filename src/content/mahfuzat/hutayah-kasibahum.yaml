meaning: "حبستَ الذي يكسب لهم قوتهم في حفرة مظلمة، فاغفر يا عمر. وفي رواية ابن السِّكِّيت «غَيَّبْتَ كَاسِبَهُمْ» [@diwan-hutayah، ص208]، واشتهر البيت برواية ابن سَلّام وابن قُتَيْبة «أَلْقَيْتَ كَاسِبَهُمْ» [@ibn-sallam، ج1 ص117] [@ibn-qutayba، ج1 ص316]."
chapter: "al-hutayah/habs-umar"
