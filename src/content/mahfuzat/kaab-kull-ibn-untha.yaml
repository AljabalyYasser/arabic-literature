kind: "bayt"
title: "كل ابن أنثى وإن طالت سلامته"
part: "2"
order: 423
person: "kaab-ibn-zuhayr"
verses:
  - "banat-suad/035"
meaning: "كل إنسان، وإن طالت حياته، سيُحمل يومًا على النعش. قاله كعب حين تخلّى عنه أصدقاؤه، يسلّم أمره للقدر. قال السُّكَّريّ: «الآلة: الحالة. وحدباء: معوجة» [@diwan-kaab، ص19]، ويرى المحققون أن الأنسب تفسيرها بالنعش."
chapter: "kaab-ibn-zuhayr/banat-suad-2"
