kind: "bayt"
title: "فإنك كالليل الذي هو مدركي"
part: "1"
order: 1
person: "al-nabigha"
verses:
  - "afa-dhu-husa/028"
meaning: "يقول للنعمان: لا مهرب منك، فأنت كالليل يدركني أينما ذهبت. قال الأَعْلَم: «أي أنا في قبضتك حيث كنتُ وإن بعدتُ عنك، فأنت كذلك كالليل الذي يُدركني ويشملني بظلامه أينما وجّهت» [@diwan-nabigha، ص38]. ويروي ابن قُتَيْبة أن عمر بن الخطّاب سأل وفد غَطَفان عن قائله، فلما قالوا النابِغة «قال: هذا أشعر شعرائكم» [@ibn-qutayba، ج1 ص157]."
chapter: "al-nabigha/al-itidhariyyatan"
story: "umar-wal-nabigha"
