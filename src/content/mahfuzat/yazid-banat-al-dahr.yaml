kind: "bayt"
title: "هل للفتى من بنات الدهر من واق"
part: "1"
order: 207
person: "yazid-ibn-al-khadhdhaq"
verses:
  - "hal-lil-fata/001"
meaning: "هل يقي الإنسانَ شيءٌ من مصائب الدهر، أو يردّ عنه الموتَ راقٍ؟ هو مطلع القصيدة التي قال فيها أبو عَمْرو بن العلاء: «أوّل شعر قيل فى ذمّ الدنيا قول يزيد بن خذّاق» [@ibn-qutayba، ج1 ص374]، ونسبتها إليه مختلف فيها."
