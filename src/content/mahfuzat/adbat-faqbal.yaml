kind: "bayt"
title: "فاقبل من الدهر ما أتاك به"
part: "1"
order: 298
person: "al-adbat-ibn-quray"
lines:
  - first: "فَاقْبَلْ مِنَ الدَّهْرِ مَا أَتَاكَ بِهِ"
    second: "مَنْ قَرَّ عَيْنًا بِعَيْشِهِ نَفَعَهْ"
meaning: "ارضَ بما يأتيك به الدهر، فمن رضي بعيشه نفعه عيشه. وهو البيت الذي عرفه أبو عُبَيْدة وخلف الأحمر من قصيدة الأضبط حين أُنشدت لهما، ولم يعرفا منها غيره إلا عجز بيت [@aghani-dk، ج18 ص130]. وقرّ عينًا بعيشه: رضي به، من قولهم: أقرّ الله عينك، «أي صادفت ما يرضيك فتقرّ عينك من النظر إلى غيره» [@lisan، ج5 ص86]."
sources:
