kind: "bayt"
title: "فاقبل من الدهر ما أتاك به"
part: "1"
order: 298
person: "al-adbat-ibn-quray"
lines:
  - first: "فَاقْبَلْ مِنَ الدَّهْرِ مَا أَتَاكَ بِهِ"
    second: "مَنْ قَرَّ عَيْنًا بِعَيْشِهِ نَفَعَهْ"
meaning: "ارضَ بما يأتيك به الدهر، فمن رضي بعيشه نفعه عيشه. وهو البيت الذي عرفه أبو عُبَيْدة وخلف الأحمر من قصيدة الأضبط حين أُنشدت لهما، ولم يعرفا منها غيره إلا عجز بيت [@aghani-dk، ج18 ص130]."
sources:
  - source: "aghani-dk"
    loc: "ج18 ص129–130"
    url: "https://archive.org/details/aghani2014/18/page/n131/mode/1up"
status: "review"
