kind: "bayt"
title: "ولقد أبيت على الطوى وأظله"
part: "1"
order: 2
person: "antara"
verses:
  - "tala-al-thawa/012"
meaning: "أبيت الليل جائعًا وأظل النهار جائعًا حتى أنال طعامًا لا يُعاب. قال الأَصْمَعِيّ فيما يرويه أبو الفَرَج: «أبيت بالليل على الطوى وأظل بالنهار كذلك حتى أنال به كريم المأكل أي ما لا عيب فيه علي» [@aghani-dk، ج8 ص242]. وفيه تعريض بقَيْس بن زُهَيْر، «وكان أكولا» [@diwan-antara، ص249]."
chapter: "antara/faris-abs"
story: "ibn-al-sawda"
