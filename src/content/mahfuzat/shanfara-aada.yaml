kind: "mathal"
title: "أعدى من الشنفرى"
part: "1"
order: 60
person: "al-shanfara"
text: "أَعْدَى مِنَ الشَّنْفَرَى"
meaning: "يُضرب في سرعة العَدْو. يقول المَيْدانيّ: «هذا من العَدْو»، ثم يروي عن أبي عَمْرو الشَّيْبانيّ خبر غارة الشَّنْفَرَى وتأبّط شرًّا وابن بَرّاق على بَجِيلة ونجاتهم بالعَدْو، ويقول إن الثلاثة كانوا عدّائين، «ولم يَسِرِ المثل إلا بالشَّنفرى» [@maydani، ج2 ص46–47]."
sources:
  - source: "maydani"
    loc: "ج2 ص46–47"
