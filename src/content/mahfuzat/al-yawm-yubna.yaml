kind: "bayt"
title: "اليوم يبنى لدويد بيته"
part: "1"
order: 234
person: "duwayd-ibn-zayd"
lines:
  - first: "اليَوْمَ يُبْنَى لِدُوَيْدٍ بَيْتُهُ"
    second: "لَوْ كَانَ لِلدَّهْرِ بِلًى أَبْلَيْتُهُ"
meaning: "اليوم يُحفر لي قبري، ولو كان الدهر يبلى لأبليته قبل أن يبليني. قالها دُوَيْد بن زَيْد «حين حضره الموت»، ويرويها ابن سَلّام «من قديم الشعر» [@ibn-sallam، ج1 ص31–32]، ونسبتها إليه منسوبة."
sources:
  - source: "ibn-sallam"
    loc: "ج1 ص31–32"
    url: "https://shamela.ws/book/6738/30"
status: "review"
