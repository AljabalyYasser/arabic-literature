kind: "bayt"
title: "ذريني للغنى أسعى"
part: "1"
order: 53
person: "urwa-ibn-al-ward"
lines:
  - first: "ذَرِينِي لِلْغِنَى أَسْعَى فَإِنِّي"
    second: "رَأَيْتُ النَّاسَ شَرُّهُمُ الفَقِيرُ"
meaning: "يطلب عروة ممن تلومه أن تتركه يسعى في طلب المال، لأن الفقير أهون الناس عندهم. ونهى عبد الله بن جعفر معلّم ولده أن يرويهم إياها، «ويقول: إن هذا يدعوهم إلى الاغتراب عن أوطانهم» [@aghani-dk، ج3 ص75]."
