kind: "bayt"
title: "فألقت عصاها واستقر بها النوى"
part: "1"
order: 329
person: "muaqqir-al-bariqi"
lines:
  - first: "فَأَلْقَتْ عَصاها وَاسْتَقَرَّ بِها النَّوَى"
    second: "كَما قَرَّ عَيْنًا بِالإِيابِ المُسافِرُ"
meaning: "يُضرب لمن استقرّ بعد سفر واطمأن. يقول الميداني عن أبي عبيد: «ومن ذلك قولهم للرجل إذا أقام بالمكان واطمأنَّ به واجتمع له فيه أمرهُ \"قَدْ ألْقَى عَصَاهُ\"» [@maydani، ج1 ص364]. ويرى ابن عبد ربه أن راشد بن عبد ربه استعاره من معقر «لاستعمال العامة له وتمثلهم به» [@iqd، ج6 ص14]."
