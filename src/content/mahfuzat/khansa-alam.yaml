kind: "bayt"
title: "كأنه علم في رأسه نار"
part: "1"
order: 2
person: "al-khansa"
verses:
  - "qadhan-bi-aynik/017"
meaning: "صخر يقتدي به الأدلاء أنفسهم، كأنه جبل على رأسه نار تُرى من بعيد. سمّى به ابن سَلّام قصيدتها [@ibn-sallam، ج1 ص210]، وهو البيت الذي يُروى أنها أنشدته النابِغة في عُكاظ [@aghani-dk، ج11 ص6]، ومثال ابن رَشِيق على الإيغال [@ibn-rashiq، ج2 ص58]."
chapter: "al-khansa/al-raiyya-1"
