meaning: "بكى رفيقه على طريق الروم، فقال له: إنما نطلب ملكًا، إلا أن نموت دونه فنُعذر [@sibawayh، ج3 ص47]. وشوقي ضيف يردّ القصيدة التي هما منها [@deif، ج1 ص245]."
