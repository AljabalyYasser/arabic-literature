meaning: "سائل ينادي من يجيب إلى الكرم فلا يجيبه أحد، فيقول له كعب: ادعُ مرة أخرى وارفع صوتك، لعل أخي يسمعك. يقول البغدادي: «هذا الترجي من شدة ذهوله من عظم مصابه بأخيه» [@khizana، ج10 ص437]."
