meaning: "ظهرت له المرأة كالشمس يحجب الغمام بعضها: بدا طرف منها وبخلت بطرف، كأنها كشفت بعض وجهها وأخفت بعضه. وفي رواية ابن سَلّام «تراءت لنا كالشمس تحت غمامة» [@ibn-sallam، ج1 ص228]."
