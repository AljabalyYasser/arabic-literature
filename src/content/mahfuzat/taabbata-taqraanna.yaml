kind: "bayt"
title: "لتقرعن علي السن من ندم"
part: "1"
order: 72
person: "taabbata-sharran"
verses:
  - "ya-idu/026"
meaning: "آخر المفضلية الأولى: يقول للائمة إنها ستعضّ على سنّها ندمًا يوم تفقده وتتذكر أخلاقه. وقرع السن كناية عن الندم، «يقال: قرعت من كذا، وعلى كذا، سنّي، إذا ندمتَ عليه» [@tabrizi-ikhtiyarat، ج1 ص139]."
sources:
  - source: "tabrizi-ikhtiyarat"
    loc: "ج1 ص139"
