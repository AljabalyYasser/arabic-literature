kind: "bayt"
title: "المرباع"
part: "1"
order: 226
person: "ibn-anama"
verses:
  - "li-umm-al-ard/006"
meaning: "حقوق الرئيس في الغنيمة في الجاهلية: ربعها، وما يصطفيه لنفسه من خيارها، وما يحكم به، وما أصيب في الطريق قبل الغارة، وما لم ينقسم. يقول محققا «الأصمعيات» إن المرباع «كان الرئيس يأخذه في الجاهلية، فلما جاء الإسلام صار الخمس» [@asmaiyyat، ص37، الحاشية]."
sources:
