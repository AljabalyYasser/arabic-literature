kind: "bayt"
title: "أمدح بيت في الجاهلية"
part: "1"
order: 61
person: "abu-al-tamahan-al-qayni"
verses:
  - "idha-qila-ayyu-al-nas/003"
meaning: "يمدح أبو الطَّمَحان بني لَأْم من طيئ: أحسابهم ووجوههم تضيء ظلمة الليل حتى يرى ناظم الخرز ما ينظمه. يقول البغدادي بعد أن يرويه: «ويقال هو أمدح بيت قيل في الجاهلية» [@khizana، ج8 ص96]. ونسبته إليه راجحة، ويرويه ابن قُتَيْبة للَقِيط بن زُرارة [@ibn-qutayba، ج2 ص700]."
