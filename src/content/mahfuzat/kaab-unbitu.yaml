kind: "bayt"
title: "أنبئت أن رسول الله أوعدني"
part: "2"
order: 424
person: "kaab-ibn-zuhayr"
verses:
  - "banat-suad/036"
meaning: "بلغني أن النبي صلى الله عليه وسلم توعّدني، والعفو عنده مرجوّ. أول ذكر للنبي في القصيدة، بعد خمسة وثلاثين بيتًا، وبه يبدأ الاعتذار. ويرويه ابن سَلّام [@ibn-sallam، ج1 ص101]، وعند ابن قُتَيْبة «مبذول» [@ibn-qutayba، ج1 ص153]."
