person: "imru-al-qais"
text: "دَعْ عَنْكَ نَهْبًا صِيحَ فِي حَجَرَاتِهِ"
meaning: "النهب: المال المنهوب، والحجرات: النواحي. «يُضرب لمن ذهب من ماله شيء ثم ذهب بعده ما هو أجلّ منه». وهو صدر بيت لامرئ القَيْس، قاله حين أُغير على إبله، ثم ذهب جاره برواحله التي أعطاه إياها ليطلب بها ماله، فقال: «وَلَكِنْ حَدِيثًا مَا حَدِيثُ الرَّوَاحِلِ» [@maydani، ج1 ص267]."
