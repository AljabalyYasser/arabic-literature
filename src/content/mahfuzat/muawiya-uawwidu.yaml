meaning: "حمل الدية عن قومه ليصلح بينهم، لا ظلمًا ولا خديعة، ليعوّد الحكماء بعده أن يفعلوا مثله إذا ألمّ بالمتفرقين حقّ. وبالبيت الثاني لُقّب معوّد الحكماء [@mufaddaliyyat، ص358، الحاشية]."
