kind: "bayt"
title: "ما تعطي العلوق به"
part: "1"
order: 206
person: "afnun"
verses:
  - "ablig-hubayban/009"
meaning: "العلوق ناقة تشمّ ولدها بأنفها وتعطف عليه ولا تدرّ عليه اللبن، فعطفها لا ينفعه. يُضرب لمن يعد بلسانه ولا يفي، ويقول التِّبْرِيزِيّ في قوم الشاعر: «كأنهم كانوا يظهرون بالقول ما لا يصدّقه الفعل» [@tabrizi-ikhtiyarat، ج3 ص1164]."
