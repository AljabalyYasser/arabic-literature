kind: "bayt"
title: "وإذا نظرت إلى أسرة وجهه"
part: "1"
order: 283
person: "abu-kabir"
lines:
  - first: "وَإِذَا نَظَرْتَ إِلَى أَسِرَّةِ وَجْهِهِ"
    second: "بَرَقَتْ كَبَرْقِ الْعَارِضِ الْمُتَهَلِّلِ"
meaning: "إذا نظرت إلى خطوط وجه هذا الفتى رأيتها تلمع كبرق السحاب الممطر. والأسرّة الطرائق، والعارض السحاب يعترض في السماء، والمتهلل الممطر [@sukkari-hudhaliyyin، ص1074]. وينقل البغدادي عن السيوطي أن عائشة رأت جبين النبي ﷺ يعرق فقالت: «وَلَو رآك أَبُو كَبِير الْهُذلِيّ لعلم أَنَّك أَحَق بِشعرِهِ» [@khizana، ج8 ص208]، وأنشدت هذا البيت."
