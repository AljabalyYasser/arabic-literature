person: "abd-al-masih-ibn-buqayla"
text: "عَرَبٌ اسْتَنْبَطْنَا، وَنَبَطٌ اسْتَعْرَبْنَا"
story: "ibn-buqayla-wa-khalid"
meaning: "جواب عبد المسيح بن بُقَيْلة حين سأله خالد بن الوليد: «اعرب انتم أم نبط؟» [@bayan، ج2 ص100]. أي: نحن عرب صرنا كالنَّبَط، أهل سواد العراق، بمقامنا في القرى، ونَبَط صاروا عربًا بلسانهم. وهو وصف أهل الحِيرة."
