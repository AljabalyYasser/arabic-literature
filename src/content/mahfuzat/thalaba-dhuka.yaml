kind: "bayt"
title: "ألقت ذكاء يمينها في كافر"
part: "1"
order: 279
person: "thalaba-ibn-suayr"
verses:
  - "hal-inda-amrata/011"
meaning: "تذكّرت النعامة بيضها حين بدأت الشمس تغيب في الليل، وذُكاء اسم للشمس والكافر الليل. ومنه أخذ لبيد «حتى إذا ألقت يدًا في كافر»، كما يقول الأصمعي فيما يرويه التبريزي [@tabrizi-ikhtiyarat، ج1 ص620]."
