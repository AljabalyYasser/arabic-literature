text: "امرؤ القيس إذا ركب، وزهير إذا رغب، والنابغة إذا رهب، والأعشى إذا شرب"
meaning: "لكل شاعر حالة يبلغ فيها غايته: امرؤ القَيْس إذا ركب للصيد والغارة، وزُهَيْر إذا رغب في العطاء، والنابِغة إذا خاف فاعتذر، والأَعْشَى في الخمر. وهو عند ابن رَشِيق جواب لكُثَيِّر أو لنُصَيْب حين سُئل: من أشعر العرب؟ [@ibn-rashiq، ج1 ص95]."
chapter: "1/al-muallaqat"
