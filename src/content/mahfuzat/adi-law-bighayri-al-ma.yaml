meaning: "لو غصصت بغير الماء لَلَجأت إلى الماء، فإذا غصصت بالماء فلا ملجأ لي: يقوله عَدِيّ من حبسه للنعمان، ملجئه الذي صار ظالمه. قال الأَصْمَعِيّ: «هذا من أشرف أمثال العرب» [@iqd، ج3 ص39]."
