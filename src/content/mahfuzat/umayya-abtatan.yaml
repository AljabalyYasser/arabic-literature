kind: "bayt"
title: "للموت كأس"
part: "1"
order: 173
person: "umayya"
verses:
  - "huma-tariqan/011"
meaning: "من لم يمت شابًّا مات شيخًا، والموت كأس يشربها كل أحد. يقول ابن عبد ربّه: «وأحكم بيت قالته العرب في وصف الموت، بيت أمية بن أبي الصلت» [@iqd، ج3 ص137]، ويقول ابن منظور بعد أن يرويه لأمية: «وَقِيلَ هُوَ لِبَعْضِ الْحَرُورِيَّةِ» [@lisan، ج6 ص190]، فنسبته مختلف فيها."
