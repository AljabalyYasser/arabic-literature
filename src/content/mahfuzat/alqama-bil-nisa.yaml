person: "alqama"
verses:
  - "taha-bika/008"
  - "taha-bika/009"
meaning: "حكمة عَلْقَمة في النساء: هو العارف بهن، ولا نصيب في ودّهن لمن شاب رأسه أو قلّ ماله. اختارها ابن قُتَيْبة فقال: «ومن جيّد قوله» [@ibn-qutayba، ج1 ص213]، وعاد إليها في آخر ترجمته فيما «يستجاد له» [@ibn-qutayba، ج1 ص216]."
