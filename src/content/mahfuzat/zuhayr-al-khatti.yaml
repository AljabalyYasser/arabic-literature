kind: "bayt"
title: "وهل ينبت الخطي إلا وشيجه"
part: "1"
order: 1
person: "zuhayr"
lines:
  - first: "وَهَلْ يُنْبِتُ الْخَطِّيَّ إِلَّا وَشِيجُهُ"
    second: "وَتُغْرَسُ إِلَّا فِي مَنَابِتِهَا النَّخْلُ"
meaning: "لا ينبت الرمح إلا من القنا، ولا يُغرس النخل إلا حيث ينبت، وكذلك الكرام لا يلدهم إلا الكرام. قال الأَعْلَم: «ولا تغرس النخل إلا بحيث تنبت وتصلح، وكذلك لا يولد الكرام إلا في موضع كريم» [@diwan-zuhayr، ص44]. وعدّه ابن قُتَيْبة «مما يتمثل به من شعره» [@ibn-qutayba، ج1 ص140]."
chapter: "zuhayr/al-abi-haritha"
