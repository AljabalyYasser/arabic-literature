person: "aws-ibn-hajar"
verses: ["ayyatuha-al-nafs/004"]
meaning: "الذكيّ الذي يظن بك الظن فيصيب كأنه رأى وسمع. صار البيت شاهدًا على صدق الفراسة: يفتتح به الجاحظ «باب في صدق الظنّ وجودة الفراسة» [@hayawan، ج3 ص27]، ويقول صاحب اللسان إن أوسًا فسّر به معنى الألمعيّ [@lisan، ج1 ص324]."
