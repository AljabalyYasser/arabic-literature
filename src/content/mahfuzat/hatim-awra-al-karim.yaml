kind: "bayt"
title: "وأعرض عن شتم اللئيم تكرما"
part: "1"
order: 154
person: "hatim"
lines:
  - first: "وَأَغْفِرُ عَوْرَاءَ الْكَرِيمِ ادِّخَارَهُ"
    second: "وَأُعْرِضُ عَنْ شَتْمِ اللَّئِيمِ تَكَرُّمَا"
meaning: "إذا قال فيّ الكريم كلمة قبيحة سترتها عليه وغفرتها، أدّخره ليوم أحتاج إليه، وإذا شتمني اللئيم أعرضت عنه إكرامًا لنفسي. والعوراء: الكلمة القبيحة. يستشهد به سيبويه، وقال: «هو حاتم بن عبد الله الطائىّ» [@sibawayh، ج1 ص367–368]، ويرويه المُبَرِّد بلا نسبة [@kamil، ج1 ص232]، ويقول البَغْداديّ إنه من قصيدة طويلة لحاتم «وهي مسطورة في الحماسة البصرية وغيرها» [@khizana، ج3 ص123]. ونسبته إلى حاتم راجحة، وتمام القصيدة لا يرويه إلا البَغْداديّ عن مصدر متأخر."
