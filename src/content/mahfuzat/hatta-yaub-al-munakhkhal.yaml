text: "حَتَّى يَؤُوبَ الْمُنَخَّلُ"
story: "hatta-yaub-al-munakhkhal"
meaning: "أي: أبدًا. هلك المُنَخَّل اليَشْكُرِيّ فلم يُعلم له خبر، فضربت به العرب المثل «ممن هلك ولم يُعلم له خبر» [@aghani-dk، ج21 ص1]، وهو والقول «حتى يرد الضب» «سواء في معنى التأبيد» [@maydani، ج1 ص211]."
