meaning: "جملة واحدة في خمسة أبيات: الشواء والخمر والناقة والنساء والمال والراحة والغناء كلها من لذة العيش، والفتى مع ذلك هدف للدهر، والدهر ذو أحوال. ويقف عبد القاهر عند أولها: لولا «إنّ» لم يكن الابتداء بالنكرة كلامًا [@dalail، ص320]."
