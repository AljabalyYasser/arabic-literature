  - "abaniyya-in-ahlik/011"
meaning: "الموت خير للفتى وفيه بقية من قوته، من أن يعيش حتى يصير شيخًا يعظّمه الناس وهو يمشي متكئًا على رجلين. قالهما زُهَيْر بن جَناب في كبره [@ibn-sallam، ج1 ص37]، ومات وقد أقسم ألا يشرب إلا الخمر حين جاءه ابنه يقوده [@muammarun، ص32]."
