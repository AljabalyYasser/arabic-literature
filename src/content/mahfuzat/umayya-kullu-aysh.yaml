kind: "maqta"
title: "كل عيش وإن تطاول دهرا"
part: "1"
order: 174
person: "umayya"
lines:
  - first: "كُلُّ عَيْشٍ وَإِنْ تَطَاوَلَ دَهْرًا"
    second: "مُنْتَهَى أَمْرِهِ إِلَى أَنْ يَزُولَا"
  - first: "لَيْتَنِي كُنْتُ قَبْلَ مَا قَدْ بَدَا لِي"
    second: "فِي رُءُوسِ الْجِبَالِ أَرْعَى الْوُعُولَا"
meaning: "كل حياة تنتهي إلى زوال مهما طالت، وليتني عشت راعيًا في رؤوس الجبال قبل أن يظهر لي ما ظهر. يروي ابن سَلّام وابن قُتَيْبة أن أمية قالهما عند موته [@ibn-sallam، ج1 ص267] [@ibn-qutayba، ج1 ص452]."
