meaning: "تلومه سُمَيّة على ما ينفق من ماله في قِرى الضيف والدية والوفود، وتسمّيه غيًّا، فيقبل الاسم ويجعله فخرًا: هذا غيّ لا أتركه ما دام عندي مال. وهي عند محققي «المفضليات» صورة «مما يردد شعراء العرب» [@mufaddaliyyat، ص355، الحاشية]."
