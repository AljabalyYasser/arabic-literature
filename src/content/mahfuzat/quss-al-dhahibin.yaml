kind: "maqta"
title: "في الذاهبين الأولين"
part: "1"
order: 292
person: "quss-ibn-saida"
lines:
  - first: "فِي الذَّاهِبِينَ الأَوَّلِيـ"
    second: "ـنَ مِنَ القُرُونِ لَنَا بَصَائِرْ"
  - first: "لَمَّا رَأَيْتُ مَوَارِدًا"
    second: "لِلْمَوْتِ لَيْسَ لَهَا مَصَادِرْ"
  - first: "وَرَأَيْتُ قَوْمِي نَحْوَهَا"
    second: "يَمْضِي الأَصَاغِرُ وَالأَكَابِرْ"
  - first: "أَيْقَنْتُ أَنِّي لَا مَحَا"
    second: "لَةَ حَيْثُ صَارَ القَوْمُ صَائِرْ"
meaning: "الأبيات التي يُروى أن قُسًّا ختم بها موعظته بعُكاظ: في الأمم الماضية عِبَر لنا، فالموت موارد يردها الناس ولا يصدرون عنها، كالماء يُورد ولا رجوع منه، فلما رأى قومه يمضون إليه صغارًا وكبارًا أيقن أنه صائر إلى ما صاروا إليه. ونسبتها إليه منسوبة كالخطبة [@aghani-dk، ج15 ص247] [@bayan، ج1 ص254]. والقرون جمع قرن، و«القرن: الأمة تأتي بعد الأمة» [@lisan، ج13 ص333]، والبصائر العِبَر، وبهذا البيت يستشهد ابن منظور لقوله: «والبصيرة: العبرة» [@lisan، ج4 ص65]."
story: "quss-fi-ukaz"
