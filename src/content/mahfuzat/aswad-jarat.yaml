meaning: "محت الريح ديار الملوك، وذهبوا جميعًا كأنهم تواعدوا على الرحيل. وتمثّل به رجل أمام علي بن أبي طالب عند مدائن كسرى، وتمثّل به مُزاحم أمام عمر بن عبد العزيز عند قصر خرب من قصور آل جفنة [@aghani-dk، ج13 ص18–19]."
