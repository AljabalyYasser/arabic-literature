person: "imru-al-qais"
order: 2
lines:
  - first: "دَنَتِ السّاعَةُ وَانشَقَّ القَمَر"
    second: "عَن غَزالٍ صادَ قَلبي وَنَفَر"
  - first: "مَرَّ يَومَ العيدِ بي في زينَةٍ"
    second: "فَرَماني فَتَعاطى فَعَقَر"
  - first: "بِسِهامٍ مِن لِحاظٍ فاتِكٍ"
    second: "فَرَّ عَنّي كَهَشيمِ المُحتَظِر"
  - first: "وَإِذا ما غابَ عَنّي ساعَةً"
    second: "كانَتِ السّاعَةُ أَدهى وَأَمَرّ"
verdict: "la-asl"
text: "ليست في ديوان امرئ القَيْس بنشرة عبد الرحمن المُصْطاوِي التي نعتمدها [@diwan-imru-al-qais، ص5–165]، ولا في أخباره في «الأغاني» و«الشعر والشعراء» [@ibn-qutayba، ج1 ص107–136]، ولا في شروح معلقته ولا في غيرها من مصادرنا. وفيها ألفاظ من سورة القمر: «اقتربت الساعة وانشق القمر»، و«فتعاطى فعقر»، و«كهشيم المحتظر»، و«أدهى وأمرّ»."
sources:
  - source: "diwan-imru-al-qais"
    loc: "ص5–165"
    url: "https://shamela.ws/book/27112"
    note: "بحثنا في الديوان كله عن أبياتها، فلم نجد شيئًا."
  - source: "aghani-dk"
    note: "أخبار امرئ القيس في الجزء التاسع. وبحثنا في نص الكتاب كله، في نسخة البحث، عن ألفاظ الأبيات فلم نجد شيئًا."
  - source: "ibn-qutayba"
    loc: "ج1 ص107–136"
    url: "https://shamela.ws/book/23785/100"
    note: "ترجمة امرئ القيس وما اختاره من شعره؛ وليس فيها شيء من الأبيات."
status: "review"
