verdict: "mansub"
text: "قصيدة في مدح النبي ﷺ والدعوة إلى طاعته، لا يرويها أحد ممن ترجموا لأمية من القدماء: ابن سَلّام [@ibn-sallam، ج1 ص259–267] وابن قُتَيْبة [@ibn-qutayba، ج1 ص450–454] وأبو الفَرَج [@aghani-dk، ج4 ص120–133]. وأقدم من ذكرها في مصادرنا عبد القادر البَغْداديّ (ت 1093هـ)، يقول: «ورأيت في ديوانه قصيدة مدح بها النبي»، ويرويها بلا إسناد [@khizana، ج1 ص252]. وهو نفسه يقول قبلها: «ولم يختلف أصحاب الأخبار أنه مات كافرا» [@khizana، ج1 ص252]، والأخبار القديمة كلها على أنه حسد النبي ﷺ ورثى قتلى قريش يوم بدر [@ibn-qutayba، ج1 ص450] [@aghani-dk، ج4 ص122–123]، فمدحه النبي على هذا الوجه لا يستقيم مع خبره."
