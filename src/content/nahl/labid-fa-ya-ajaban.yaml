    note: "«الأشعار المنسوبة للبيد»، رقم 23، والأبيات عنده ثلاثة."
  - source: "aghani-dk"
    loc: "ج4 ص35"
    url: "https://archive.org/details/aghani2014/4/page/n40/mode/1up"
    note: "ترجمة أبي العتاهية: «جاءنا أبو العتاهية إلى منزلنا فقال: زعم الناس أني زنديق، والله ما ديني إلا التوحيد»، ثم الأبيات، وهي أربعة."
  - source: "deif"
