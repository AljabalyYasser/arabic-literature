lines:
  - first: "فَيَا عَجَبًا كَيْفَ يُعْصَى الْإِلٰـ"
    second: "ـهُ أَمْ كَيْفَ يَجْحَدُهُ الْجَاحِدُ"
  - first: "وَفِي كُلِّ شَيْءٍ لَهُ آيَةٌ"
    second: "تَدُلُّ عَلَى أَنَّهُ الْوَاحِدُ"
verdict: "ghayruh"
owner: "أبو العَتاهِيَة"
text: "ليس البيتان في شعر لَبِيد برواية الطُّوسِيّ ولا فيما جمعه إحسان عَبّاس من شعره، فليس في فهرس قوافيه شيء من المتقارب على الدال [@diwan-labid، ص446–447]. وإنما أوردهما في «الأشعار المنسوبة للبيد» وقال: «في محاضرات الأدباء (٢: ١٧٠) أن هذه الأبيات للبيد، وهي في المحاسن والأضداد: ١٢٠ لأبي نواس» [@diwan-labid، ص363]. ويرويهما أبو الفَرَج الأَصْفَهانيّ لأبي العَتاهِيَة بإسناده إلى الخَلِيل بن أَسَد النُّوشَجانيّ، قالهما لما «زعم الناس» أنه زنديق [@aghani-dk، ج4 ص35]، وعلى نسبتهما إليه شَوْقي ضَيْف [@deif، ج3 ص242]."
sources:
  - source: "diwan-labid"
    loc: "ص446–447"
    url: "https://archive.org/details/3929pdf/page/n491/mode/1up"
    note: "فهرس قوافي قصائده وأراجيزه، قافية الدال: مجزوء الكامل والوافر والرجز والطويل والكامل والمنسرح، ولا متقارب فيها."
  - source: "diwan-labid"
