person: "antara"
order: 3
lines:
  - first: "حَكِّم سُيوفَكَ في رِقابِ العُذَّلِ"
    second: "وَإِذا نَزَلتَ بِدارِ ذُلٍّ فَارحَلِ"
  - first: "لا تَسقِني ماءَ الحَياةِ بِذِلَّةٍ"
    second: "بَل فَاسقِني بِالعِزِّ كَأسَ الحَنظَلِ"
  - first: "ماءُ الحَياةِ بِذِلَّةٍ كَجَهَنَّمٍ"
    second: "وَجَهَنَّمٌ بِالعِزِّ أَطيَبُ مَنزِلِ"
verdict: "la-asl"
text: "ليست في ديوان عَنْتَرَة بتحقيق محمد سعيد مولوي. فالقصائد التي على وزنها وقافيتها عنده ثلاث: «طال الثواء على رسوم المنزل»، و«عجبت عبيلة من فتى متبذّل»، و«يا دار عبلة من مشارق مأسل» [@diwan-antara، ص366]، وليس فيها شيء من هذه الأبيات [@diwan-antara، ص246–262، ص338]. ولم نجدها في أخباره في «الأغاني» [@aghani، ج8 ص243–256] ولا في «الشعر والشعراء» [@ibn-qutayba، ج1 ص243–247] ولا في غيرهما من مصادرنا. ويقول المحقق إنه لم يعتمد الأشعار التي أوردتها سيرة عنترة «لتداخل كثير من الشعر المنحول مع بعض أشعار عنترة» [@diwan-antara، ص177]."
