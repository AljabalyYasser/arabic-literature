person: "antara"
order: 5
lines:
  - first: "خُلِقتُ مِنَ الحَديدِ أَشَدَّ قَلبًا"
    second: "وَقَد بَلِيَ الحَديدُ وَما بَليتُ"
  - first: "وَفي الحَربِ العَوانِ وُلِدتُ طِفلًا"
    second: "وَمِن لَبَنِ المَعامِعِ قَد سُقيتُ"
  - first: "وَإِنّي قَد شَرِبتُ دَمَ الأَعادي"
    second: "بِأَقحافِ الرُّؤوسِ وَما رَويتُ"
verdict: "la-asl"
text: "ليست في ديوان عَنْتَرَة بتحقيق محمد سعيد مولوي، وليس فيه قصيدة ولا قطعة على قافية التاء أصلًا [@diwan-antara، ص364–367]. ولم نجدها في أخباره في «الأغاني» ولا في «الشعر والشعراء» [@ibn-qutayba، ج1 ص243–247] ولا في غيرهما من مصادرنا. ويقول المحقق إن «منية النفس»، وهي أول طبعة وصلته من ديوان عنترة (بيروت 1864)، جمع فيها صاحبها «كل ما وصلت إليه يده من شعر منسوب لعنترة، سواء ما كان منه في نسخ الأعلم أو ما كان في السيرة الشعبية» [@diwan-antara، ص54]."
sources:
