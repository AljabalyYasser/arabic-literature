    loc: "ص364–367"
    url: "https://archive.org/details/3562pdf/page/n369/mode/1up"
    note: "فهرس القوافي كله: لا قافية فيه للتاء."
  - source: "diwan-antara"
    loc: "ص54"
    url: "https://archive.org/details/3562pdf/page/n61/mode/1up"
    note: "عن «منية النفس في أشعار عنترة عبس» لإسكندر آغا أبكاريوس."
  - source: "aghani-dk"
    loc: "ج8 ص237"
    note: "أول ترجمة عنترة. وبحثنا في نص الكتاب كله، في نسخة البحث، عن ألفاظ الأبيات فلم نجد شيئًا."
  - source: "ibn-qutayba"
    loc: "ج1 ص243–247"
    url: "https://shamela.ws/book/23785/236"
    note: "ترجمة عنترة وما اختاره من شعره؛ وليس فيها شيء من الأبيات."
