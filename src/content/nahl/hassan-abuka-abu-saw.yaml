verdict: "ghayruh"
owner: "قُدامة بن موسى الجُمَحيّ"
text: "مثال يجتمع فيه النحل مرتين. يقول ابن سَلّام: «ويروى النَّاس لأبى سُفْيَان بن الْحَارِث يَقُول لحسان» البيتين، ثم: «فأخبرنى أهل الْعلم من أهل الْمَدِينَة أَن قدامَة بن مُوسَى ابْن عمر بن قدامَة بن مَظْعُون الجمحى قَالَهَا ونحلها أَبَا سُفْيَان وقريش تروية فى أشعارها تُرِيدُ بذلك الْأَنْصَار وَالرَّدّ على حسان» [@ibn-sallam، ج1 ص249–250]. فهما مصنوعان في الرد على حسّان. ثم نسبهما العسكري في «ديوان المعاني» إلى حسّان نفسه، فجمعهما عرفات في القسم الثالث من الديوان ونقل كلام ابن سَلّام، وذكر أن المَرْزُبانيّ نسبهما لفرات بن حيّان يرد على حسّان، أو لأبي سفيان بن الحارث [@diwan-hassan، ص501]."
