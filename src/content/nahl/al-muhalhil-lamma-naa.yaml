person: "al-muhalhil"
order: 2
lines:
  - first: "لَمّا نَعى النّاعي كُلَيْبًا أَظْلَمَتْ"
    second: "شَمْسُ النَّهارِ فَما تُريدُ طُلوعا"
  - first: "قَتَلوا كُلَيْبًا ثُمَّ قالوا: أَرْتِعوا"
    second: "كَذَبوا، لَقَدْ مَنَعوا الجِيادَ رُتوعا"
  - first: "حَتّى أُبيدَ قَبيلَةً وَقَبيلَةً"
    second: "وَقَبيلَةً وَقَبيلَتَيْنِ جَميعا"
verdict: "la-asl"
text: "ليست في «الأغاني» [@aghani، ج5 ص39–64] ولا «الأمالي» للقالِيّ [@qali، ج2 ص129–134] ولا «الأَصْمَعِيّات» ولا «العقد»، ولم نجد بيتًا منها في كتاب من مصادرنا. والذي يرويه الأَصْمَعِيّ للمُهَلْهِل في هذا المعنى أبيات على قافية الميم، منها «قتلوا كليبًا ثم قالوا: أربعوا / كذبوا وربّ الحلّ والإحرام» و«حتى نبيد قبيلة وقبيلة» [@asmaiyyat، ص156]، وهي في «العقد» أيضًا [@iqd، ج6 ص76]؛ وفي الأبيات السائرة بيتان قريبان منهما لفظًا على قافية العين. وصدر بيتها الأخير «والخيل تقتحم الغبار عوابسا» صدرُ بيت في معلقة عَنْتَرَة [@jamhara، ص372]."
sources:
  - source: "aghani"
    loc: "ج5 ص39–64"
    url: "https://ketabonline.com/ar/books/10786/read?page=1642"
    note: "حرب البسوس وشعر المهلهل فيها؛ وبحثنا في نص الكتاب كله عن ألفاظ الأبيات فلم نجد منها شيئًا."
  - source: "qali"
    loc: "ج2 ص129–134"
    url: "https://shamela.ws/book/9160/413"
    note: "ترجمة المهلهل ورائيته؛ وليست هذه فيها."
  - source: "asmaiyyat"
    loc: "ص156"
    url: "https://shamela.ws/book/6905/142"
    note: "الأصمعية 54 «يا حار لا تجهل على أشياخنا»، وفيها «قتلوا كليبًا ثم قالوا: أربعوا»."
  - source: "iqd"
    loc: "ج6 ص76"
    url: "https://shamela.ws/book/23789/1887"
    note: "الأبيات الميمية نفسها بترتيب آخر، وليس في شعر المهلهل هناك شيء من هذه العينية."
  - source: "jamhara"
    loc: "ص372"
    url: "https://shamela.ws/book/1487/332"
    note: "معلقة عنترة: «والخيل تقتحم الغبار عوابسا، / من بين شيظمة، وأجرد شيظم»."
status: "review"
