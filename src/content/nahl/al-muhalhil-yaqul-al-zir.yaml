    loc: "ج5 ص39–64"
    url: "https://ketabonline.com/ar/books/10786/read?page=1642"
    note: "حرب البسوس وشعر المهلهل فيها؛ وبحثنا في نص الكتاب كله عن ألفاظ الأبيات فلم نجد منها شيئًا."
  - source: "asmaiyyat"
    loc: "ص154–156"
    url: "https://shamela.ws/book/6905/140"
    note: "الأصمعيتان 53 و54 للمهلهل؛ وليست هذه فيهما."
  - source: "qali"
    loc: "ج2 ص129–134"
    url: "https://shamela.ws/book/9160/413"
    note: "ترجمة المهلهل ورائيته؛ وليست هذه فيها."
  - source: "iqd"
    loc: "ج6 ص70–77"
    url: "https://shamela.ws/book/23789/1881"
    note: "حرب بكر وتغلب وشعر المهلهل فيها؛ وليست هذه فيها."
  - source: "ibn-qutayba"
