person: "al-muhalhil"
order: 5
lines:
  - first: "يَقولُ الزّيرُ أَبو لَيْلى المُهَلْهِلْ"
    second: "وَقَلْبُ الزّيرِ قاسي لا يَلينا"
  - first: "وَإِنْ لانَ الحَديدُ ما لانَ قَلْبي"
    second: "وَقَلْبي مِنْ حَديدِ القاسِيينا"
verdict: "la-asl"
text: "ليست في شيء من مصادر شعر المُهَلْهِل القديمة: «الأغاني» [@aghani، ج5 ص39–64]، و«الأَصْمَعِيّات» [@asmaiyyat، ص154–156]، و«الأمالي» للقالِيّ [@qali، ج2 ص129–134]، و«العقد» [@iqd، ج6 ص70–77]، و«الشعر والشعراء» [@ibn-qutayba، ج1 ص288–290]، ولم نجد بيتًا منها في كتاب من مصادرنا. والمتكلم فيها يسمّي نفسه «الزير أبو ليلى المهلهل». ويذكر شوقي ضَيْف أنه «نمت فى العصور الإسلامية أساطير حول هذه الحرب وبطلها التغلبى المهلهل»، وأن قصة شعبية أُلّفت عنه باسم «الزير سالم» [@deif، ج1 ص66]."
sources:
