person: "tarafa"
order: 1
lines:
  - first: "وَأَشَدُّ مَا لَاقَيْتُ مِنْ أَلَمِ الْجَوَى"
    second: "قُرْبُ الْحَبِيبِ وَمَا إِلَيْهِ وُصُولُ"
  - first: "كَالْعِيسِ فِي الْبَيْدَاءِ يَقْتُلُهَا الظَّمَا"
    second: "وَالْمَاءُ فَوْقَ ظُهُورِهَا مَحْمُولُ"
verdict: "la-asl"
text: "ليس البيتان في ديوان طَرَفَة، وليس فيه على قافية اللام إلا ثلاث قصائد من الطويل [@diwan-tarafa، ص61–68]. ولم نجدهما منسوبين إليه في المصادر القديمة التي نعتمدها. وأقدم ما وجدناه للبيت الثاني في مصادرنا تذكرةٌ أنشأها القاضي الفاضِل عن صَلاح الدِّين، وبعث بها «إلى أبواب الخلافة ببغداد»، وينقلها القَلْقَشَنْدِيّ، وفيها البيت بلا نسبة بلفظ «كَالْعِيسِ أَقْتَلُ مَا يَكُونُ لَهَا الظَّمَا» [@subh، ج13 ص85–86]."
sources:
  - source: "diwan-tarafa"
    loc: "ص61–68"
    url: "https://shamela.ws/book/36422/52"
    note: "قافية اللام: «إذا جاء الذي لا بد منه»، و«أتعرف رسم الدار»، و«العبد الذليل»، وكلها من الطويل. وبحثنا في نص الطبعة كله عن ألفاظ البيتين فلم نجد شيئًا."
  - source: "subh"
    loc: "ج13 ص85–86"
    url: "https://shamela.ws/book/9429/6086"
    note: "«نسخة تذكرة أنشأها القاضي الفاضل عن السلطان صلاح الدين يوسف بن أيّوب». والبيت فيها غير منسوب."
