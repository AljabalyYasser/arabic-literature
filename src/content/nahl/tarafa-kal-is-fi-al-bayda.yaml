person: "tarafa"
order: 1
lines:
  - first: "وَأَشَدُّ مَا لَاقَيْتُ مِنْ أَلَمِ الْجَوَى"
    second: "قُرْبُ الْحَبِيبِ وَمَا إِلَيْهِ وُصُولُ"
  - first: "كَالْعِيسِ فِي الْبَيْدَاءِ يَقْتُلُهَا الظَّمَا"
    second: "وَالْمَاءُ فَوْقَ ظُهُورِهَا مَحْمُولُ"
verdict: "la-asl"
text: "ليس البيتان في ديوان طَرَفَة، لا في رواية الأَصْمَعِيّ التي شرحها الأعلم، ولا في صلة الديوان التي جمع فيها محققاه ما رُوي له خارجها: فليس فيه من الكامل شيء على رويّهما، وما فيه على اللام المضمومة المردوفة، أي التي قبلها حرف مدّ، فمن الطويل، كقصيدته «لهند بحزان الشريف طلول» [@diwan-tarafa، ص89] وقطع في صلة الديوان [@diwan-tarafa، ص178]. ولم نجدهما منسوبين إليه في المصادر القديمة التي نعتمدها. وأقدم ما وجدناه للبيت الثاني في مصادرنا تذكرةٌ أنشأها القاضي الفاضِل عن صَلاح الدِّين، وبعث بها «إلى أبواب الخلافة ببغداد»، وينقلها القَلْقَشَنْدِيّ، وفيها البيت بلا نسبة بلفظ «كَالْعِيسِ أَقْتَلُ مَا يَكُونُ لَهَا الظَّمَا» [@subh، ج13 ص85–86]."
