person: "durayd-ibn-al-simma"
order: 1
lines:
  - first: "لَقَدْ أَسْمَعْتَ لَوْ نادَيْتَ حَيًّا"
    second: "وَلَكِنْ لا حَياةَ لِمَنْ تُنادي"
verdict: "ghayruh"
owner: "عبد الرحمن بن الحَكَم"
text: "يرويه أبو الفَرَج ثالثَ ثلاثة أبيات لعبد الرحمن بن الحَكَم، في خبر تهاجيه وعبدِ الرحمن بن حَسّان، وقبلها: «فقال ابن الحكم» [@aghani-dk، ج15 ص117]. ويجعله ابن بَسّام لعَمْرو بن مَعْدِي كَرِب [@dhakhira، ج5 ص11]. ولم نجده لدُرَيْد في شيء من مصادر شعره: «الأَصْمَعِيّات» [@asmaiyyat، ص105–113]، و«الشعر والشعراء» [@ibn-qutayba، ج2 ص737–740]، و«العقد» [@iqd، ج6 ص32–34]، و«الأمالي» للقالِيّ [@qali، ج2 ص161]، و«جمهرة أشعار العرب» [@jamhara، ص466–474]."
sources:
  - source: "aghani-dk"
    loc: "ج15 ص117"
    url: "https://archive.org/details/aghani2014/15/page/n118/mode/1up"
    note: "«فقال ابن الحكم: لقد أبقى بنو مروان حزنا...»، والبيت ثالث الأبيات، في خبر تهاجي عبد الرحمن بن حسان وعبد الرحمن بن الحكم."
  - source: "dhakhira"
    loc: "ج5 ص11"
    url: "https://shamela.ws/book/1035/1791"
    note: "«كما قال عمرو بن معديكرب: لقد ناديت لو أسمعت حيا ولكن لا حياة لمن تنادي»."
  - source: "asmaiyyat"
    loc: "ص105–113"
    url: "https://shamela.ws/book/6905/91"
    note: "الأصمعيتان 28 و29 لدريد؛ وليس البيت فيهما."
  - source: "ibn-qutayba"
    loc: "ج2 ص737–740"
    url: "https://shamela.ws/book/23785/728"
    note: "ترجمة دريد وشعره؛ وليس البيت فيها."
  - source: "iqd"
    loc: "ج6 ص32–34"
    url: "https://shamela.ws/book/23789/1843"
    note: "خبر دريد ومرثيته؛ وليس البيت فيها."
  - source: "qali"
    loc: "ج2 ص161"
    url: "https://shamela.ws/book/9160/445"
    note: "دريد والخنساء؛ وليس البيت فيها."
  - source: "jamhara"
    loc: "ص466–474"
    url: "https://shamela.ws/book/1487/420"
    note: "دالية دريد في المراثي؛ وليس البيت فيها."
status: "review"
