person: "antara"
order: 4
lines:
  - first: "يُنادونَني في السِّلمِ يا ابنَ زَبيبَةٍ"
    second: "وَعِندَ صِدامِ الخَيلِ يا ابنَ الأَطايِبِ"
  - first: "وَلَولا الهَوى ما ذَلَّ مِثلي لِمِثلِهِم"
    second: "وَلا خَضَعَت أُسدُ الفَلا لِلثَّعالِبِ"
verdict: "la-asl"
text: "ليسا في ديوان عَنْتَرَة بتحقيق محمد سعيد مولوي: فالقطعتان اللتان من بحر الطويل على الباء المكسورة عنده، «كأن السرايا بين قوّ وقارة» وبيت «فذوقوا كما ذقنا غداة محجّر»، وليس البيتان فيهما [@diwan-antara، ص278–279، ص333]. ولم نجدهما في أخباره في «الأغاني» ولا في «الشعر والشعراء» [@ibn-qutayba، ج1 ص243–247] ولا في غيرهما من مصادرنا، وإن كان اسم أمه زَبِيبة ثابتًا في أخباره [@aghani-dk، ج8 ص237]. ويقول الزِّرِكْلِيّ في الديوان المطبوع المنسوب إلى عنترة: «أكثر ما فيه مصنوع» [@zirikli، ج5 ص91]."
sources:
