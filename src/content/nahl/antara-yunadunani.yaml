    note: "القطعة 13 كاملة، خمسة أبيات."
  - source: "diwan-antara"
    loc: "ص333"
    url: "https://archive.org/details/3562pdf/page/n338/mode/1up"
    note: "القطعة (8)، بيت واحد من الأزمنة والأمكنة."
  - source: "aghani-dk"
    loc: "ج8 ص237"
    url: "https://archive.org/details/aghani2014/8/page/n236/mode/1up"
    note: "«وأمه أمة حبشية يقال لها زبيبة»."
  - source: "zirikli"
    loc: "ج5 ص91"
    url: "https://shamela.ws/book/12286/4233"
    note: "حكمه في ديوان عنترة المطبوع."
  - source: "aghani-dk"
    loc: "ج8 ص237"
    note: "أول ترجمة عنترة. وبحثنا في نص الكتاب كله، في نسخة البحث، عن ألفاظ الأبيات فلم نجد شيئًا."
  - source: "ibn-qutayba"
    loc: "ج1 ص243–247"
    url: "https://shamela.ws/book/23785/236"
    note: "ترجمة عنترة وما اختاره من شعره؛ وليس فيها شيء من الأبيات."
