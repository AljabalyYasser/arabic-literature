    loc: "ص364"
    url: "https://archive.org/details/3562pdf/page/n369/mode/1up"
    note: "فهرس القوافي، قافية الباء: من الطويل على الباء المكسورة القطعتان 13 و(8) وحدهما، و(7) طويل على الباء المضمومة."
  - source: "diwan-antara"
