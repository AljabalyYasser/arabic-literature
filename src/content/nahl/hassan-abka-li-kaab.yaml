person: "hassan"
order: 1
lines:
  - first: "أَبَكَى لِكَعْبٍ ثُمَّ عُلَّ بِعَبْرَةٍ"
    second: "مِنْهُ وَعَاشَ مُجَدَّعًا لَا يَسْمَعُ"
  - first: "وَلَقَدْ رَأَيْتُ بِبَطْنِ بَدْرٍ مِنْهُمُ"
    second: "قَتْلَى تَسُحُّ لَهَا الْعُيُونُ وَتَدْمَعُ"
verdict: "mansub"
text: "يرويها ابن إسحاق لحسّان جوابًا على كعب بن الأشرف بعد بدر، ثم يقول ابن هشام: «وَأَكْثَرُ أَهْلِ الْعِلْمِ بِالشِّعْرِ يُنْكِرُهَا لِحَسَّانَ» [@ibn-hisham، ج2 ص53]. ويقول محققو السيرة إنهم بحثوا في شعر حسّان فلم يجدوها [@ibn-hisham، ج2 ص53، الحاشية]. وليست في رواية محمد بن حَبِيب للديوان، وإنما هي في القسم الثاني من نشرة عرفات، من زيادات مخطوطة «طا» وحدها، بمطلع آخر [@diwan-hassan، ص426]. فإنكار أكثر أهل العلم بالشعر ينزل بها إلى «منسوب»."
