    second: "ـقْلِ الْمُلِحَّاتِ الدَّوَالِحْ"
verdict: "mansub"
text: "يرويها ابن إسحاق لحسّان يبكي حمزة ومن أصيب يوم أحد [@ibn-hisham، ج2 ص151]، ثم يقول ابن هشام في آخرها: «وَأَكْثَرُ أَهْلِ الْعِلْمِ بِالشِّعْرِ يُنْكِرُهَا لِحَسَّانٍ» [@ibn-hisham، ج2 ص155]. وليست في رواية محمد بن حَبِيب للديوان ولا في زيادات «طا»، وإنما جمعها عرفات من الكتب في القسم الثالث [@diwan-hassan، ص450]. فهي منسوبة."
