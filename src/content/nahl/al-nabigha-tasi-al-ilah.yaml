person: "al-nabigha"
order: 1
lines:
  - first: "تَعْصِي الْإِلٰهَ وَأَنْتَ تُظْهِرُ حُبَّهُ"
    second: "هٰذَا لَعَمْرُكَ فِي الْمَقَالِ بَدِيعُ"
  - first: "لَوْ كُنْتَ تَصْدُقُ حُبَّهُ لَأَطَعْتَهُ"
    second: "إِنَّ الْمُحِبَّ لِمَنْ يُحِبُّ مُطِيعُ"
verdict: "ghayruh"
owner: "مَحْمُود الوَرّاق"
text: "ليس البيتان في ديوان النابِغة برواية الأَصْمَعِيّ ولا بروايتي الطُّوسِيّ وابن السِّكِّيت، وليس في فهرس قصائده على قافية العين شيء من الكامل [@diwan-nabigha، ص266]. وإنما أوردهما محمد أبو الفَضْل إبراهيم في «الشعر المنسوب إلى النابغة الذبياني مما لم يرد في الديوان»، نقلًا عن «العِقْد الثَّمِين» و«التَّوْضِيح والبَيان» [@diwan-nabigha، ص231]. ويرويهما المُبَرِّد بقوله «وقال محمود» [@kamil، ج2 ص4]، وابن عَبْد رَبِّه بقوله «وقال محمود الوراق» [@iqd، ج3 ص168]، وعلى ذلك شَوْقي ضَيْف في كلامه على زهد مَحْمُود الوَرّاق [@deif، ج3 ص410]."
sources:
  - source: "diwan-nabigha"
    loc: "ص266"
    url: "https://archive.org/details/3409pdf_202001/page/n265/mode/1up"
    note: "فهرس قصائد الديوان، قافية العين: ست قصائد من الطويل والبسيط، ولا كامل فيها. والفهرس يشمل الروايات الثلاث، ولا يشمل المنسوب."
  - source: "diwan-nabigha"
    loc: "ص231"
    url: "https://archive.org/details/3409pdf_202001/page/n230/mode/1up"
    note: "«الشعر المنسوب إلى النابغة الذبياني مما لم يرد في الديوان»، وتحت البيتين: «العقد الثمين ١٧٢، التوضيح والبيان ١٠٤». ولا يحكم المحقق عليهما."
  - source: "kamil"
    loc: "ج2 ص4"
    url: "https://shamela.ws/book/8505/440"
    note: "«وقال محمود»، ثم البيتان. وعجز البيت الأول عنده «هٰذَا مُحَالٌ فِي الْقِيَاسِ بَدِيعُ»."
  - source: "iqd"
    loc: "ج3 ص168"
    url: "https://shamela.ws/book/23789/901"
    note: "«وقال محمود الوراق»، ثم ثلاثة أبيات."
  - source: "deif"
    loc: "ج3 ص410"
    url: "https://shamela.ws/book/11996/1312"
    note: "في ترجمة محمود الوراق (ج3 ص409–410)، شاهدًا على قوله في الطاعة ومحبة الله."
