person: "al-nabigha"
order: 2
lines:
  - first: "مَنْ يَطْلُبِ الدَّهْرُ تُدْرِكْهُ مَخَالِبُهُ"
    second: "وَالدَّهْرُ بِالْوِتْرِ نَاجٍ غَيْرُ مَطْلُوبِ"
  - first: "مَا مِنْ أُنَاسٍ ذَوِي مَجْدٍ وَمَكْرُمَةٍ"
    second: "إِلَّا يَشُدُّ عَلَيْهِمْ شِدَّةَ الذِّيبِ"
verdict: "mansub"
text: "ليس البيتان في ديوان النابِغة برواية الأَصْمَعِيّ ولا بروايتي الطُّوسِيّ وابن السِّكِّيت: ليس في فهرس قصائده على وزنهما ورويّهما إلا «إِنِّي كَأَنِّي لَدَى النُّعْمَانِ خَبَّرَهُ» [@diwan-nabigha، ص265]، وليسا فيها [@diwan-nabigha، ص49–53]. وإنما أوردهما محمد أبو الفَضْل إبراهيم في «الشعر المنسوب إلى النابغة الذبياني مما لم يرد في الديوان»، نقلًا عن «العِقْد الثَّمِين» و«التَّوْضِيح والبَيان» [@diwan-nabigha، ص227]. و«العقد الثمين» مجموع طُبع في أوربا سنة 1869م ([~1869]) [@diwan-nabigha، ص291]، ولم نجد البيتين في شيء من المصادر القديمة التي نعتمدها."
sources:
  - source: "diwan-nabigha"
    loc: "ص265"
    url: "https://archive.org/details/3409pdf_202001/page/n264/mode/1up"
    note: "فهرس قصائد الديوان، قافية الباء: ليس فيها من البسيط على الباء المكسورة المردوفة إلا القصيدة الرابعة."
  - source: "diwan-nabigha"
    loc: "ص49–53"
    url: "https://archive.org/details/3409pdf_202001/page/n48/mode/1up"
    note: "القصيدة الرابعة كاملة، ستة عشر بيتًا، وليس فيها البيتان."
  - source: "diwan-nabigha"
    loc: "ص227"
    url: "https://archive.org/details/3409pdf_202001/page/n226/mode/1up"
    note: "«الشعر المنسوب إلى النابغة الذبياني مما لم يرد في الديوان»، أربعة أبيات، وتحتها: «العقد الثمين ١٦٤، التوضيح والبيان ٩٦»."
  - source: "diwan-nabigha"
    loc: "ص291"
    url: "https://archive.org/details/3409pdf_202001/page/n290/mode/1up"
    note: "مراجع التحقيق: «العقد الثمين في دواوين الشعراء الستة الجاهليين لوليم بن الورد طبع أوربا ١٨٦٩ م»، و«التوضيح والبيان عن شعر نابغة ذبيان (مطبعة السعادة بمصر)»."
status: "review"
