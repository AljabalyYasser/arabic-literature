person: "al-muhalhil"
order: 3
lines:
  - first: "هَلْ عَرَفْتَ الغَداةَ مِنْ أَطْلالِ"
    second: "رَهْنِ ريحٍ وَديمَةٍ مِهْطالِ"
  - first: "قَرِّبا مَرْبِطَ المُشَهَّرِ مِنّي"
    second: "لِكُلَيْبٍ الَّذي أَشابَ قَذالي"
verdict: "la-asl"
text: "لم نجدها في شيء من مصادر شعر المُهَلْهِل: «الأغاني» [@aghani، ج5 ص39–64]، و«الأَصْمَعِيّات» [@asmaiyyat، ص154–156]، و«الأمالي» للقالِيّ [@qali، ج2 ص129–134]، و«العقد» [@iqd، ج6 ص70–77]، ولا وجدنا بيتًا منها في كتاب من مصادرنا. والقصيدة التي يرويها القدماء في هذه الحرب على وزنها ورويّها، بلازمة «قرّبا مربط...»، هي قصيدة خصمه الحارِث بن عُبَاد: التي أولها «قربا مربط النعامة» وعجزه «لقحت حرب وائل عن حيال» [@asmaiyyat، ص70–71] [@aghani، ج5 ص53]، ويقول الشريف المُرْتَضَى إنه كرر قوله «قرّبا مربط النعامة» «فى أبيات كثيرة من القصيدة» [@murtada، ج1 ص126]."
sources:
  - source: "aghani"
    loc: "ج5 ص39–64"
    url: "https://ketabonline.com/ar/books/10786/read?page=1642"
    note: "حرب البسوس وشعر المهلهل والحارث بن عباد فيها، وفي ص53 «قرّبا مربط النعامة مني» للحارث؛ وبحثنا في نص الكتاب كله عن ألفاظ هذه القصيدة فلم نجد منها شيئًا."
  - source: "asmaiyyat"
    loc: "ص70–71، ص154–156"
    url: "https://shamela.ws/book/6905/56"
    note: "الأصمعية 17 للحارث بن عباد «قرّبا مربط النعامة مني»، والأصمعيتان 53 و54 للمهلهل، وليس في شيء منها هذه القصيدة."
  - source: "qali"
    loc: "ج2 ص129–134"
    url: "https://shamela.ws/book/9160/413"
    note: "ترجمة المهلهل ورائيته؛ وليست هذه فيها."
  - source: "iqd"
    loc: "ج6 ص70–77"
    url: "https://shamela.ws/book/23789/1881"
    note: "حرب بكر وتغلب، وفيها شعر المهلهل وقصيدة الحارث «قرّبا مربط النعامة»؛ وليست هذه فيها."
  - source: "murtada"
    loc: "ج1 ص126"
    url: "https://shamela.ws/book/20937/155"
    note: "تكرار «قرّبا مربط النعامة» في قصيدة الحارث بن عباد."
status: "review"
