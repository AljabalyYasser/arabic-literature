person: "al-muhalhil"
order: 4
lines:
  - first: "إِنَّ في الصَّدْرِ مِنْ كُلَيْبٍ شُجونًا"
    second: "هاجِساتٍ نَكَأْنَ مِنْهُ الجِراحا"
  - first: "أَنْكَرَتْني حَليلَتي إِذْ رَأَتْني"
    second: "كاسِفَ اللَّوْنِ لا أُطيقُ المُزاحا"
verdict: "la-asl"
text: "ليست في «الأغاني» [@aghani، ج5 ص39–64] ولا «الأَصْمَعِيّات» [@asmaiyyat، ص154–156] ولا «الأمالي» للقالِيّ [@qali، ج2 ص129–134] ولا «العقد» [@iqd، ج6 ص70–77] ولا «جمهرة أشعار العرب» [@jamhara، ص458–462]، ولم نجد بيتًا منها في كتاب من مصادرنا. والذي يرويه أبو الفَرَج للمُهَلْهِل من هذا البحر لامية أولها «أزجر العين أن تبكّي الطلولا / أنّ في الصدر من كليب غليلا» [@aghani، ج5 ص61]، فعجز مطلعها قريب من صدر الأبيات السائرة، والقافية غير القافية."
sources:
  - source: "aghani"
    loc: "ج5 ص39–64، ص61"
    url: "https://ketabonline.com/ar/books/10786/read?page=1664"
    note: "حرب البسوس وشعر المهلهل فيها، وفي ص61 لاميته «ازجر العين أن تبكي الطلولا»؛ وبحثنا في نص الكتاب كله عن ألفاظ هذه الأبيات فلم نجد منها شيئًا."
  - source: "asmaiyyat"
    loc: "ص154–156"
    url: "https://shamela.ws/book/6905/140"
    note: "الأصمعيتان 53 و54 للمهلهل؛ وليست هذه فيهما."
  - source: "qali"
    loc: "ج2 ص129–134"
    url: "https://shamela.ws/book/9160/413"
    note: "ترجمة المهلهل ورائيته؛ وليست هذه فيها."
  - source: "iqd"
    loc: "ج6 ص70–77"
    url: "https://shamela.ws/book/23789/1881"
    note: "حرب بكر وتغلب وشعر المهلهل فيها؛ وليست هذه فيها."
  - source: "jamhara"
    loc: "ص458–462"
    url: "https://shamela.ws/book/1487/412"
    note: "قصيدة المهلهل «جارت بنو بكر» من المُلحَمات؛ وليست هذه في الكتاب."
status: "review"
