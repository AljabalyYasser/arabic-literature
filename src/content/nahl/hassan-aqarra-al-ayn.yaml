person: "hassan"
order: 3
lines:
  - first: "أَقَرَّ الْعَيْنَ أَنْ عُصِبَتْ يَدَاهُ"
    second: "وَمَا إِنْ تُعْصَبَانِ عَلَى خِضَابِ"
verdict: "ghayruh"
owner: "أبو خِراش الهُذَلِيّ، ويُروى لمَعْقِل بن خُوَيْلِد الهُذَلِيّ"
text: "يرويه ابن إسحاق آخر قطعة لحسّان في يوم أحد، ثم يقول ابن هشام: «آخِرُهَا بَيْتًا يُرْوَى لِأَبِي خِرَاشٍ الْهُذَلِيِّ، وَأَنْشَدَنِيهِ لَهُ خَلَفٌ الْأَحْمَرُ»، وفيه «يداها»، يعني امرأته، «فِي غَيْرِ حَدِيثِ أُحُدٍ. وَتُرْوَى الْأَبْيَاتُ أَيْضًا لِمَعْقِلِ ابْن خُوَيْلِدٍ الْهُذَلِيُّ» [@ibn-hisham، ج2 ص78–79]. ويقول عرفات إن هذا البيت «ليس في المخطوطات ولا المطبوعة»، وإنه منسوب لمعقل بن خويلد في ديوان الهذليين [@diwan-hassan، ص368]. فالقطعة لحسّان، والبيت الأخير لغيره: استُعير من شعر هُذَلِيّ في امرأة، وأُلحق بشعر في حرب."
