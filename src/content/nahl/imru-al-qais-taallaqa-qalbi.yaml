person: "imru-al-qais"
order: 1
lines:
  - first: "لِمَن طَلَلٌ بَينَ الجُدَيَّةِ وَالجَبَل"
    second: "مَحَلٌّ قَديمُ العَهدِ طالَت بِهِ الطِّيَل"
  - first: "تَعَلَّقَ قَلبي طَفلَةً عَرَبِيَّةً"
    second: "تَنَعَّمُ في الدّيباجِ وَالحَليِ وَالحُلَل"
  - first: "لَها مُقلَةٌ لَو أَنَّها نَظَرَت بِها"
    second: "إِلى راهِبٍ قَد صامَ لِلَّهِ وَابتَهَل"
  - first: "لَأَصبَحَ مَفتونًا مُعَنًّى بِحُبِّها"
    second: "كَأَن لَم يَصُم لِلَّهِ يَومًا وَلَم يُصَل"
verdict: "la-asl"
text: "ليست في ديوان امرئ القَيْس بنشرة عبد الرحمن المُصْطاوِي التي نعتمدها [@diwan-imru-al-qais، ص5–165]، ولا في أخباره في «الأغاني» و«الشعر والشعراء» [@ibn-qutayba، ج1 ص107–136]، ولا في شروح معلقته ولا في غيرها من مصادرنا. ويقول شوقي ضَيْف إن امرأ القيس شاعر «زيّفت أخباره وزيف عليه كثير من أشعاره» [@deif، ج1 ص245]."
sources:
  - source: "diwan-imru-al-qais"
    loc: "ص5–165"
    url: "https://shamela.ws/book/27112"
    note: "بحثنا في الديوان كله عن مطلعها وأبياتها المشهورة، فلم نجد شيئًا."
  - source: "deif"
    loc: "ج1 ص244–245"
    url: "https://shamela.ws/book/11996/241"
    note: "الشبه حول شعر امرئ القيس، وكثرة ما انتحل عليه."
  - source: "aghani-dk"
    note: "أخبار امرئ القيس في الجزء التاسع. وبحثنا في نص الكتاب كله، في نسخة البحث، عن ألفاظ الأبيات فلم نجد شيئًا."
  - source: "ibn-qutayba"
    loc: "ج1 ص107–136"
    url: "https://shamela.ws/book/23785/100"
    note: "ترجمة امرئ القيس وما اختاره من شعره؛ وليس فيها شيء من الأبيات."
status: "review"
