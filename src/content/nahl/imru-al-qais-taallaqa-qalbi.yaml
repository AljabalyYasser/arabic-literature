verdict: "mansub"
text: "ليست في أصول ديوان امرئ القَيْس المخطوطة، وإنما أوردها محققه أبو الفضل إبراهيم في ملحقه بالشعر المنسوب إليه مما لم يرد في تلك الأصول، بروايتين طويلتين نقلهما عن «العقد الثمين» لآلفارت [@diwan-imru-al-qais، ص466–470]، وقال إن «القصيدتين اللاميتين اللتين في باب المنسوب لامرئ القيس» «مما نحل عليه» [@diwan-imru-al-qais، التصدير ص21]. ولا نجدها في أخباره في «الأغاني» و«الشعر والشعراء» [@ibn-qutayba، ج1 ص107–136]، ولا في شروح معلقته ولا في غيرها من مصادرنا. ويقول شوقي ضَيْف إن امرأ القيس شاعر «زيّفت أخباره وزيف عليه كثير من أشعاره» [@deif، ج1 ص245]."
