person: "hassan"
order: 5
lines:
  - first: "عَلَى أَنْيَابِهَا أَوْ طَعْمُ غَضٍّ"
    second: "مِنَ التُّفَّاحِ هَصَّرَهُ اجْتِنَاءُ"
verdict: "mansub"
text: "بيت يُروى في الهمزية بعد بيتها السادس «كأنّ سبيئة من بيت رأس»، ليتمّ به خبر «كأنّ». وليس في رواية ابن إسحاق. يروي البغدادي قول السُّهَيْليّ: «وَزعم بَعضهم أَن بعده بَيْتا فِيهِ الْخَبَر وَهُوَ على أنيابها الْبَيْت. وَهُوَ مَصْنُوع لَا يشبه شعر حسان وَلَا لَفظه» [@khizana، ج9 ص228]. فالبيت منسوب إلى حسّان، والقصيدة ثابتة بدونه."
sources:
