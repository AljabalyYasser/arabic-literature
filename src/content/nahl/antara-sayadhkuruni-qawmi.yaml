person: "antara"
order: 1
lines:
  - first: "سَيَذكُرُني قَومي إِذا الخَيلُ أَقبَلَت"
    second: "وَفي اللَيلَةِ الظَلماءِ يُفتَقَدُ البَدرُ"
verdict: "ghayruh"
owner: "أبو فِراس الحَمْدانيّ"
text: "ليس في ديوان عَنْتَرَة بتحقيق محمد سعيد مولوي، لا في رواية الأَعْلَم ولا فيما ألحقه المحقق بها، فليس في قافية الراء عنده قطعة من بحر الطويل [@diwan-antara، ص365]. وإنما هو بيت من رائية أبي فِراس الحَمْدانيّ «أراك عصيّ الدمع»، وصدره عنده: «سيذكرني قومي إذا جدّ جدّهم» [@deif، ج6 ص226]. وأبو فراس قُتل سنة 357هـ [@wafayat، ج2 ص60]، ويروي الثَّعالِبِيّ القصيدة له، ولم يختر منها هذا البيت [@yatima، ج1 ص103]."
sources:
  - source: "diwan-antara"
    loc: "ص364–367"
    url: "https://archive.org/details/3562pdf/page/n370/mode/1up"
    note: "فهرس القوافي، ويشمل رواية الأعلم وزيادات البطليوسي وما جمعه المحقق من كتب الأدب. قافية الراء (ص365) ست قطع، ليس فيها شيء من الطويل."
  - source: "deif"
    loc: "ج6 ص226"
    url: "https://shamela.ws/book/11996/3024"
    note: "رائية أبي فراس حين أُسر، وفيها البيت بصدر «إذا جدّ جدّهم»."
  - source: "wafayat"
    loc: "ج2 ص58–61"
    url: "https://shamela.ws/book/1000/532"
    note: "ترجمة أبي فراس، ومقتله سنة 357هـ (ص60). ولا يروي الرائية."
  - source: "yatima"
    loc: "ج1 ص103"
    url: "https://shamela.ws/book/6743/80"
    note: "مختارات من «أراك عصيّ الدمع» لأبي فراس، ليس فيها هذا البيت."
