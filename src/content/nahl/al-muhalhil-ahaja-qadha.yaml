person: "al-muhalhil"
order: 1
lines:
  - first: "أَهاجَ قَذاءَ عَيْنِيَ الإِذِّكارُ"
    second: "هُدُوًّا فَالدُّموعُ لَها انْحِدارُ"
  - first: "دَعَوْتُكَ يا كُلَيْبُ فَلَمْ تُجِبْني"
    second: "وَكَيْفَ يُجيبُني البَلَدُ القِفارُ"
  - first: "وَلَسْتُ بِخالِعٍ دِرْعي وَسَيْفي"
    second: "إِلى أَنْ يَخْلَعَ اللَّيْلَ النَّهارُ"
verdict: "la-asl"
text: "ليست في شيء مما يرويه القدماء من شعر المُهَلْهِل: لا في خبر حرب البَسُوس وشعره فيها عند أبي الفَرَج [@aghani، ج5 ص39–64]، ولا في «الأَصْمَعِيّات» [@asmaiyyat، ص154–156]، ولا في «الأمالي» للقالِيّ [@qali، ج2 ص129–134]، ولا في «العقد» [@iqd، ج6 ص70–77]، ولا في ترجمته عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص288–290]. ولم نجد بيتًا منها في كتاب من مصادرنا، ولا بيتها السائر «ولست بخالع درعي وسيفي». أما رائيته التي يرويها القدماء في رثاء كُلَيْب فقصيدة أخرى، أولها في «العقد»: «أليلتنا بذي حسم أنيري / إذا أنت انقضيت فلا تحوري» [@iqd، ج6 ص75]."
sources:
  - source: "aghani"
    loc: "ج5 ص39–64"
    url: "https://ketabonline.com/ar/books/10786/read?page=1642"
    note: "حرب البسوس وشعر المهلهل فيها؛ وبحثنا في نص الكتاب كله عن ألفاظ القصيدة فلم نجد منها شيئًا."
  - source: "asmaiyyat"
    loc: "ص154–156"
    url: "https://shamela.ws/book/6905/140"
    note: "الأصمعيتان 53 و54 للمهلهل، وأولاهما الرائية «أليلتنا بذي حسم»، وليست هذه فيهما."
  - source: "qali"
    loc: "ج2 ص129–134"
    url: "https://shamela.ws/book/9160/413"
    note: "ترجمته ورائيته؛ وليست هذه فيها."
  - source: "iqd"
    loc: "ج6 ص70–77"
    url: "https://shamela.ws/book/23789/1881"
    note: "حرب بكر وتغلب وشعر المهلهل فيها، وفي ص75 مطلع رائيته «أليلتنا بذي حسم»؛ وليست هذه فيها."
  - source: "ibn-qutayba"
    loc: "ج1 ص288–290"
    url: "https://shamela.ws/book/23785/281"
    note: "ترجمة المهلهل؛ وليست هذه فيها."
