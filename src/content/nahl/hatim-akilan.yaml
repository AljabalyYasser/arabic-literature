person: "hatim"
order: 1
lines:
  - first: "أَيَا ابْنَةَ عَبْدِ اللهِ وَابْنَةَ مَالِكٍ"
    second: "وَيَا ابْنَةَ ذِي الْبُرْدَيْنِ وَالْفَرَسِ الْوَرْدِ"
  - first: "إِذَا مَا صَنَعْتِ الزَّادَ فَالْتَمِسِي لَهُ"
    second: "أَكِيلًا فَإِنِّي لَسْتُ آكِلَهُ وَحْدِي"
verdict: "ghayruh"
owner: "قَيْس بن عاصِم المِنْقَرِيّ"
text: "لم نجدها لحاتم في شيء مما رأيناه من مصادرنا القديمة. يقول أبو الفَرَج في الصوت الذي غُنّي منها: «الشعر لقيس بن عاصم المنقرىّ» [@aghani-dk، ج14 ص68]، ويروي بإسناده أن قيسًا تزوج مَنْفُوسة بنت زيد الفوارس الضَّبّيّ، فأتته بطعام، فقال: «فأين أكيلى؟»، ثم أنشد البيتين [@aghani-dk، ج14 ص71]. ويرويها المُبَرِّد له [@kamil، ج2 ص133]، وهي في «الحماسة» و«البيان والتبيين» بقولهما «وقال آخر» [@tabrizi-hamasa، ج2 ص244] [@bayan، ج3 ص205]. ويقول محقق «أمالي المرتضى» إن ذا البُرْدَين عامر بن أُحَيْمِر بن بَهْدَلة، «جد منفوسة من قبل أمها»، أي إن البيت الأول ينادي امرأة قيس بأجدادها، ويذكر أن التِّبْرِيزِيّ عزاها في شرح الحماسة إلى حاتم «ولم ترد فى ديوانه» [@murtada، ج2 ص161]."
sources:
  - source: "aghani-dk"
    loc: "ج14 ص68"
    url: "https://archive.org/details/aghani2014/14/page/n70/mode/1up"
    note: "صوت من البيتين: «الشعر لقيس بن عاصم المنقرىّ، والغناء لعلّويه»."
  - source: "aghani-dk"
    loc: "ج14 ص71"
    url: "https://archive.org/details/aghani2014/14/page/n73/mode/1up"
    note: "خبر قيس ومنفوسة بإسناد ابن دريد عن عمه عن العباس بن هشام عن أبيه عن جده، والبيتان، وتفسير المحقق لذي البردين."
  - source: "kamil"
    loc: "ج2 ص133"
    url: "https://shamela.ws/book/8505/643"
    note: "«قال رجل من المتقدمين، وهو قيس بن عاصم المنقري»، وأربعة أبيات، وتفسير «قصيا كريما»."
  - source: "tabrizi-hamasa"
    loc: "ج2 ص244"
    url: "https://shamela.ws/book/6907/691"
    note: "«وقال آخر»، والبيتان. وفي حاشية المحقق أن ابنة مالك ماوية زوجة حاتم، وهو رأيه."
  - source: "bayan"
    loc: "ج3 ص205"
    url: "https://shamela.ws/book/10614/756"
    note: "«وقال آخر»، وستة أبيات منها البيتان."
  - source: "murtada"
    loc: "ج2 ص161"
    url: "https://shamela.ws/book/20937/829"
    note: "يرويها المرتضى عن المبرد بلا نسبة، وفي حاشية المحقق محمد أبو الفضل إبراهيم: الكامل ينسبها إلى قيس بن عاصم، والتبريزي إلى حاتم «ولم ترد فى ديوانه»، والأغاني إلى قيس بسنده."
