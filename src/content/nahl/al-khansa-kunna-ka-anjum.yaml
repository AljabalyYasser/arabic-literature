person: "al-khansa"
order: 1
lines:
  - first: "كُنّا كَأَنْجُمِ لَيْلٍ وَسْطَها قَمَرٌ"
    second: "يَجْلو الدُّجى فَهَوى مِنْ بَيْنِنا القَمَرُ"
  - first: "يا صَخْرُ ما كُنْتُ في قَوْمٍ أُسَرُّ بِهِمْ"
    second: "إِلّا وَإِنَّكَ بَيْنَ القَوْمِ مُشْتَهِرُ"
  - first: "فَاذْهَبْ حَميدًا عَلى ما كانَ مِنْ حَدَثٍ"
    second: "فَقَدْ سَلَكْتَ سَبيلًا فيهِ مُعْتَبَرُ"
verdict: "ghayruh"
owner: "صَفِيّة الباهِلِيّة"
text: "ليست في ديوانها بالشرح المنسوب إلى ثَعْلَب، وليس في فهرس قصائده قصيدة على هذه القافية [@diwan-khansa، ص490]. والبيت الأول في «الحماسة» آخرُ أربعة أبيات قالتها صَفِيّة الباهِلِيّة ترثي أخاها [@tabrizi-hamasa، ج1 ص393–394]، ويرويها لها ابن قُتَيْبة أيضًا [@uyun-al-akhbar، ج3 ص75]، وهي في «العقد» لأعرابية ترثي زوجها [@iqd، ج3 ص232]، ويروي الآمِدِيّ البيت لمريم بنت طارق [@muwazana، ج1 ص72]. وإنما نشر لويس شَيْخُو الأبيات الثلاثة للخَنْساء بعنوان «وقالت في صخر» من نسخة واحدة، وكتب تحتها: «ح * روى وحده هذه الأبيات»، ثم قال في حاشيتها: «رُوي بعض هذه الأبيات في حماسة أبي تمّام» «لصفيّة الباهليّة» [@anis-al-julasa، ص134]."
sources:
  - source: "diwan-khansa"
    loc: "ص490"
    url: "https://archive.org/details/3318pdf_202001/page/n489/mode/1up"
    note: "فهرس قصائد الديوان (ص489–492). في قافية الراء إحدى عشرة قصيدة، منها اثنتان من البسيط: «ما هاج حزنك» و«يا عين جودي بدمع منك مغزار»، وليست هذه منها."
  - source: "tabrizi-hamasa"
    loc: "ج1 ص393–394"
    url: "https://shamela.ws/book/6907/376"
    note: "«وقالت صفية الباهلية ترثي أخاها»: «كنا كغصنين في جرثومة سمقا» وثلاثة أبيات بعده، آخرها «كنا كأنجم ليل بينها قمر»."
  - source: "uyun-al-akhbar"
    loc: "ج3 ص75"
    url: "https://shamela.ws/book/23790/937"
    note: "«وقالت صفيّة الباهليّة في أخيها»، والأبيات الأربعة، ورابعها «كنّا كأنجم ليل وسطنا قمر»."
  - source: "iqd"
    loc: "ج3 ص232"
    url: "https://shamela.ws/book/23789/965"
    note: "الأبيات الأربعة نفسها بعنوان «وقال أعرابية ترثي زوجها»."
  - source: "muwazana"
    loc: "ج1 ص72"
    url: "https://shamela.ws/book/26183/70"
    note: "«وقالت مريم بنت طارق ترثى أخاها، في أبيات أنشدها ابن الأنباري في أماليه»، والبيت الأول وحده."
  - source: "anis-al-julasa"
    loc: "ص134"
    url: "https://archive.org/details/qnlhc_12953_en/page/n83/mode/1up"
    note: "الأبيات الثلاثة للخنساء من نسخة واحدة (ح)، وفي الحاشية أنها لصفية الباهلية في حماسة أبي تمام، وفي الحماسة البصرية وحماسة البحتري، وأن البيت الأول لمريم بنت طارق في الموازنة."
status: "review"
