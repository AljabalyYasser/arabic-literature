person: "antara"
order: 2
lines:
  - first: "لا يَحمِلُ الحِقدَ مَن تَعلو بِهِ الرُّتَبُ"
    second: "وَلا يَنالُ العُلا مَن طَبعُهُ الغَضَبُ"
  - first: "وَمَن يَكُن عَبدَ قَومٍ لا يُخالِفُهُم"
    second: "إِذا جَفَوهُ وَيَستَرضي إِذا عَتَبوا"
  - first: "قَد كُنتُ فيما مَضى أَرعى جِمالَهُمُ"
    second: "وَاليَومَ أَحمي حِماهُم كُلَّما نُكِبوا"
verdict: "la-asl"
text: "ليست في ديوان عَنْتَرَة بتحقيق محمد سعيد مولوي، فليس في قافية الباء عنده قطعة من بحر البسيط [@diwan-antara، ص364]، ولم نجدها في أخباره في «الأغاني» ولا في «الشعر والشعراء» [@ibn-qutayba، ج1 ص243–247] ولا في غيرهما من مصادرنا. ويقول المحقق إن دواوين عنترة المطبوعة قبله حوت «ما صح لعنترة وما حمل عليه، وما حفلت به السيرة الشعبية»، ولذلك لم يعتمدها [@diwan-antara، ص56]."
sources:
  - source: "diwan-antara"
    loc: "ص364"
    url: "https://archive.org/details/3562pdf/page/n369/mode/1up"
    note: "فهرس القوافي، قافية الباء: رجز ومتقارب وكامل وطويل ووافر، ولا بسيط فيها."
  - source: "diwan-antara"
    loc: "ص56"
    url: "https://archive.org/details/3562pdf/page/n63/mode/1up"
    note: "رأي المحقق في طبعة دار صادر (1958) وما قبلها من الدواوين المطبوعة."
  - source: "aghani-dk"
    loc: "ج8 ص237"
    note: "أول ترجمة عنترة. وبحثنا في نص الكتاب كله، في نسخة البحث، عن ألفاظ الأبيات فلم نجد شيئًا."
  - source: "ibn-qutayba"
    loc: "ج1 ص243–247"
    url: "https://shamela.ws/book/23785/236"
    note: "ترجمة عنترة وما اختاره من شعره؛ وليس فيها شيء من الأبيات."
status: "review"
