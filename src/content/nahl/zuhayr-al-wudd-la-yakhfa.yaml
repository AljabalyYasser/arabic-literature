person: "zuhayr"
order: 1
lines:
  - first: "الْوُدُّ لَا يَخْفَى وَإِنْ أَخْفَيْتَهُ"
    second: "وَالْبُغْضُ تُبْدِيهِ لَكَ الْعَيْنَانِ"
verdict: "la-asl"
text: "ليس في شعر زُهَيْر برواية الأَعْلَم الشَّنْتَمَرِيّ، ولا في الذيل الذي ألحقه المحقق عن ثَعْلَب وصَعُوداء: ففي قافية النون من فهرس قوافيه أربع قطع لزهير، ليس فيها شيء من الكامل [@diwan-zuhayr، ص310]. ولم نجده منسوبًا إليه في المصادر القديمة التي نعتمدها. وإنما يذكر المَيْدانيّ شطره الثاني قولًا سائرًا لا يسمّي قائله: «هذا كقولهم: الْبُغْضُ تُبْدِيهِ لَكَ الْعَيْنَانِ» [@maydani، ج1 ص76]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص310"
    url: "https://archive.org/details/3917pdf/page/n310/mode/1up"
    note: "فهرس القوافي، قافية النون: «الظنون» ص153 من الوافر، و«فالركن» ص278 من البسيط، و«تعذلاني» ص283 من الوافر، و«أبان» ص290 من الطويل. ولا كامل فيها."
