person: "al-nabigha"
order: 3
lines:
  - first: "أَخْلَاقُ مَجْدِكَ جَلَّتْ مَا لَهَا خَطَرٌ"
    second: "فِي الْبَأْسِ وَالْجُودِ بَيْنَ الْعِلْمِ وَالْخَبَرِ"
  - first: "مُتَوَّجٌ بِالْمَعَالِي فَوْقَ مَفْرِقِهِ"
    second: "وَفِي الْوَغَى ضَيْغَمٌ فِي صُورَةِ الْقَمَرِ"
verdict: "mansub"
text: "ليس البيتان في ديوان النابِغة برواية الأَصْمَعِيّ ولا بروايتي الطُّوسِيّ وابن السِّكِّيت، وليس في فهرس قصائده على قافية الراء شيء من البسيط على هذا الرويّ [@diwan-nabigha، ص266]. وإنما أوردهما محمد أبو الفَضْل إبراهيم في «الشعر المنسوب إلى النابغة الذبياني مما لم يرد في الديوان»، نقلًا عن «العِقْد الثَّمِين» و«التَّوْضِيح والبَيان» [@diwan-nabigha، ص230]، وأولهما مجموع طُبع في أوربا سنة 1869م ([~1869]) [@diwan-nabigha، ص291]. ولم نجد البيتين في شيء من المصادر القديمة التي نعتمدها."
sources:
  - source: "diwan-nabigha"
    loc: "ص266"
    url: "https://archive.org/details/3409pdf_202001/page/n265/mode/1up"
    note: "فهرس قصائد الديوان، قافية الراء: البسيط فيها مفتوح الروي أو مضمومه، أو مكسوره مردوفًا بالألف، ولا شيء على «الخبرِ» و«القمرِ»."
  - source: "diwan-nabigha"
    loc: "ص230"
    url: "https://archive.org/details/3409pdf_202001/page/n229/mode/1up"
    note: "«الشعر المنسوب إلى النابغة الذبياني مما لم يرد في الديوان»، وتحت البيتين: «العقد الثمين ١٦٨، التوضيح والبيان ١٠٠»."
  - source: "diwan-nabigha"
    loc: "ص291"
    url: "https://archive.org/details/3409pdf_202001/page/n290/mode/1up"
    note: "مراجع التحقيق: «العقد الثمين في دواوين الشعراء الستة الجاهليين لوليم بن الورد طبع أوربا ١٨٦٩ م»."
status: "review"
