short: "السُّهَيْلِيّ، الروض الأنف"
author: "أبو القاسم عبد الرحمن بن عبد الله السُّهَيْلِيّ (508–581هـ)"
title: "الروض الأنف في شرح السيرة النبوية لابن هشام"
kind: "primary"
editor: "عبد الرحمن الوكيل"
edition: "الطبعة الأولى، 1387–1390هـ / 1967–1970م، سبعة أجزاء، ومعه السيرة النبوية لابن هشام"
publisher: "دار الكتب الإسلامية لصاحبها توفيق عفيفي عامر، القاهرة"
url: "https://shamela.ws/book/6864"
note: "ترقيمه في المكتبة الشاملة موافق للمطبوع. وفي صفحة عنوان الجزء الأول من المصوّرة: «تحقيق وتعليق وشرح عبد الرحمن الوكيل»، «يطلب من دار الكتب الإسلامية لصاحبها توفيق عفيفي عامر»، وفي ظهرها «الطبعة الأولى 1387هـ – 1967م». وتسمي بطاقة الشاملة الناشر «دار الكتب الحديثة، لصاحبها توفيق عفيفي»، ومنها سنة آخر الأجزاء (1390هـ / 1970م). والمصوّرة في أرشيف الإنترنت (https://archive.org/details/20260208_20260208_2322) تجمع الأجزاء السبعة في ملف واحد، فيختلف فرق الورقة عن الصفحة من جزء إلى جزء: في الجزء 7 رقم الورقة يساوي رقم الصفحة مضافًا إليه 2938 (فُحص على ص160–161). في أعلى الصفحة نص السيرة، وتحت الخط شرح السُّهَيْلِيّ: فنص السيرة يُحال فيه إلى طبعة السقا (ibn-hisham)، ويُحال إلى هذا الكتاب في كلام السُّهَيْلِيّ وحده. وحواشي الوكيل رأيه، فتُنسب إليه. ولا تُنقل إليه أرقام نشرة السلامي (دار إحياء التراث العربي 2000، الشاملة 1514)، فترقيمها غير هذا: قوله في البيت المزيد في الهمزية «وَهَذَا الْبَيْتُ مَوْضُوعٌ» هو في نشرة السلامي ج7 ص252، وفي هذه الطبعة ج7 ص151."
