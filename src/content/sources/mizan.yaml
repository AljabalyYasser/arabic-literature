short: "الذَّهَبِيّ، ميزان الاعتدال"
author: "شمس الدين أبو عبد الله محمد بن أحمد بن عثمان الذَّهَبِيّ (ت 748هـ)"
title: "ميزان الاعتدال في نقد الرجال"
kind: "primary"
editor: "علي محمد البِجاوي"
edition: "الطبعة الأولى، 1382هـ / 1963م، أربعة أجزاء"
publisher: "دار المعرفة للطباعة والنشر، بيروت"
url: "https://shamela.ws/book/1692"
note: "ترقيمه في المكتبة الشاملة موافق للمطبوع. وفي صفحة عنوان المجلد الأول من المصوّرة: «تحقيق علي محمد البجاوي»، «دار المعرفة، بيروت، لبنان»، بلا سنة، وتقديم المحقق مؤرخ «مصر الجديدة، رمضان سنة 1382هـ، فبراير سنة 1963م» (ص ي)، والطبعة الأولى وسنتها من بطاقة الشاملة. والمصوّرة في أرشيف الإنترنت (https://archive.org/details/MizaneLitidal2) في أربعة ملفات بعدد الأجزاء: في الجزء 2 رقم الورقة يساوي رقم الصفحة ناقصًا 1 (فُحص على ص255)، والرابط إليه https://archive.org/details/MizaneLitidal2/02_15345/page/n{الورقة}/mode/1up. نرجع إليه في رواة الأخبار، مثل سيف بن عمر وابن دأب والكلبي. وأحكامه أحكام المحدثين في رواية الحديث، تُنقل بلفظها منسوبة إلى قائليها كما ينقلها الذهبي، وتطبيقها على الشعر الذي يرويه الراوي قرارنا ونصرّح به. وما في تراجمه من حكم في الدين أو المذهب يُنسب إليه ولا نتبناه (خريطة الباب 2، عاشرًا)."
