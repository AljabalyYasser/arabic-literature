short: "صحيح البخاري"
author: "محمد بن إسماعيل البخاري (ت 256هـ)"
title: "الجامع الصحيح (صحيح البخاري)"
kind: "primary"
editor: "مصطفى ديب البغا"
edition: "الطبعة الخامسة، 1414هـ / 1993م، سبعة أجزاء"
publisher: "دار ابن كثير ودار اليمامة، دمشق"
url: "https://shamela.ws/book/735"
note: "نحيل بالجزء والصفحة ورقم الحديث في هذه الطبعة، وترقيم الشاملة موافق للمطبوع. والتخريج تحت الحديث للمحقق. ونقل الحديث في الموقع بلفظه، ومعه حكم المحدثين كما هو: أنه في صحيح البخاري، ولا يُعطى درجة من درجاتنا (خريطة الباب 2، عاشرًا)."
