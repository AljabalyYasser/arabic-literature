short: "العُكْبَرِيّ"
author: "أبو البقاء عبد الله بن الحسين العُكْبَرِيّ (ت 616هـ)"
title: "إعراب لامية الشَّنْفَرَى"
kind: "primary"
editor: "محمد أديب عبد الواحد جمران"
edition: "الطبعة الأولى، 1404هـ / 1984م"
publisher: "المكتب الإسلامي، بيروت"
url: "https://shamela.ws/book/6998"
note: "فيه نص «لامية العرب» كاملًا، ثمانية وستون بيتًا، يشرح لغتها ويعربها بيتًا بيتًا (ص57–147). ترقيمه في المكتبة الشاملة موافق للمطبوع. وفي نص الأبيات في نسخة الشاملة أخطاء طباعة، فنصحح اللفظ من شرح العُكْبَرِيّ نفسه ومن «خزانة الأدب»، ونضبطه نحن."
