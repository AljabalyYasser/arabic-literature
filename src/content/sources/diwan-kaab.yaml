short: "ديوان كعب"
author: "كعب بن زُهَيْر، صنعة أبي سعيد الحسن بن الحسين السُّكَّرِيّ (ت 275هـ)"
title: "شرح ديوان كعب بن زُهَيْر"
kind: "primary"
editor: "القسم الأدبي بدار الكتب المصرية"
edition: "الطبعة الأولى، 1369هـ / 1950م"
publisher: "مطبعة دار الكتب المصرية، القاهرة"
url: "https://archive.org/details/hmmt00206"
note: "الطبعة المعتمدة لشعر كعب. أصلها مخطوطة هالّة المؤرخة 533هـ، وفي عنوانها القديم أن الشرح لثَعْلَب، وفي خاتمتها «تمّ شعر كعب فى رواية السكرى»، ويرجّح المحققون والمَيْمَنيّ السُّكَّرِيّ، فنقول «رواية السكري». والحواشي تحت الخط رأي المحققين، وفيها نقول عن شرح الأحول. وفي آخره «شعر أنشد لكعب ولم ينشر في ديوانه» من جمع المحققين. نحيل إلى الصفحة المطبوعة، وهي في المصوّرة رقم الصفحة زائدًا واحدًا وثلاثين."
