short: "ديوان عَلْقَمة"
author: "عَلْقَمة بن عَبَدة التَّمِيمِيّ، بشرح الأَعْلَم الشَّنْتَمَرِيّ (ت 476هـ)"
title: "شرح ديوان عَلْقَمة بن عَبَدة التَّمِيمِيّ المشهور بعَلْقَمة الفَحْل"
kind: "primary"
editor: "محمد بن أبي شَنَب"
edition: "سلسلة «فحول العرب في علم الأدب»، 1925م (السنة والمطبعة من بيانات المصوّرة، وليستا في صفحة العنوان)"
publisher: "مطبعة جول كربونل، الجزائر"
url: "https://archive.org/details/AAlexandrina-144694"
note: "رواية الأَصْمَعِيّ لشعر عَلْقَمة بشرح الأَعْلَم، كما في صفحة العنوان: «لأبى الحجاج يوسف بن سليمان بن عيسى المعروف بالأعلم الشنتمرى، ويليه جملة مما لم يذكر من شعره فى هذا الشرح». وفيه القصائد الثلاث: «طحا بك قلب» و«هل ما علمت» و«ذهبت من الهجران»، وبعد الثالثة: «كمل جميع ما رواه الأصمعى من شعر علقمة» (ص111)، ثم قطع من رواية أبي علي القالي وغيره، وهي لغير الأَصْمَعِيّ ولكل منها درجته. الأبيات مشكولة، والشرح الذي يلي كل بيتين للأَعْلَم، والحواشي لابن أبي شَنَب ورأيه. المصوّرة بلا نص مقروء، فنحيل بالصفحة المطبوعة، ورقم الورقة فيها يساوي الصفحة مضافًا إليها 9 (فُحص على الورقات 92 و104 و120)."
