short: "ديوان الحُطَيْئة"
author: "الحُطَيْئة جَرْوَل بن أَوْس، برواية ابن السِّكِّيت (ت 244هـ) وشرحه، ومعه شرح السُّكَّرِيّ والسِّجِسْتانيّ"
title: "ديوان الحُطَيْئة بشرح ابن السِّكِّيت والسُّكَّرِيّ والسِّجِسْتانيّ"
kind: "primary"
editor: "نعمان أمين طه"
edition: "الطبعة الأولى، 1378هـ / 1958م (سلسلة «تراث العرب»)"
publisher: "شركة مكتبة ومطبعة مصطفى البابي الحلبي وأولاده، القاهرة"
url: "https://archive.org/details/Diwan_Hutai3a"
note: "الطبعة وسنتها من صفحة العنوان وظهرها. بنى المحقق النص على مخطوطة مكتبة عاطف أفندي (رمزها ع)، ونسبها إلى ابن السِّكِّيت بأدلة من المخطوطة نفسها، وقال: «اعتمدت فى نص الأبيات على مخطوطة ع رواية وضبطا وعددا، فما زاد عليها فى مخطوطة (هـ) أو غيرها أوردته أثناء الشرح» (المقدمة ص20). والرمز هـ رواية السُّكَّرِيّ في نشرة جولدتسيهر، والرمز م رواية السِّجِسْتانيّ في مختارات ابن الشجري، و«هامش ع» حواشي المخطوطة، و«غيره» ما فيها عن غير ابن السِّكِّيت. والقصائد مرتبة بالأغراض لا بترتيب المخطوطة، وفي الحاشية الأولى لكل قصيدة موضعها في الأصول. والقصائد 98–116 جمعها المحقق من كتب الأدب، فليست من رواية ابن السِّكِّيت، ولكل منها درجتها بحسب مصدرها. والحواشي التي تحت الخط رأي المحقق. نحيل إلى الصفحة المطبوعة، ورقم الورقة في المصوّرة يساوي رقم الصفحة ناقصًا واحدًا (فُحص على الصفحات 208–222 و283–293 و329–330 و396–397). والمقدمة (63 صفحة بأرقام مستقلة) في ملف مستقل ضمن المصوّرة https://archive.org/details/0466_20191224 ."
