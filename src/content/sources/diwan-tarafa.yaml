short: "ديوان طَرَفَة"
author: "طَرَفَة بن العَبْد البَكْرِيّ، برواية الأصمعي وشرح الأعلم الشَّنْتَمَرِيّ (ت 476هـ)"
title: "ديوان طَرَفَة بن العَبْد، شرح الأعلم الشَّنْتَمَرِيّ، وتليه طائفة من الشعر المنسوب إلى طَرَفَة"
kind: "primary"
editor: "درية الخطيب ولطفي الصقال"
edition: "الطبعة العربية الثانية (مزيدة ومنقحة)، 2000م"
publisher: "المؤسسة العربية للدراسات والنشر، بيروت، ودائرة الثقافة والفنون، البحرين"
url: "https://archive.org/details/hm3478"
note: "قسمان. «شرح الأعلم» (ص23–142): القصائد 1–14 فيه رواية الأصمعي، وعليها نعتمد، ثم «ما رواه ابن السكيت عن غير الأصمعي» من القصيدة 15. و«صلة الديوان» (ص143–190) جمعها المحققان من الكتب ومن طبعتي سلكسون (1900) وقازان (1909)، ودرجتها أدنى. والنجمة في المتن علامة اختلاف الأصول، وتفصيله في آخر الكتاب (ص239)، والحواشي للمحققين. الطبعة واحدة في مصوّرتين: hm3478، وفيها رقم الورقة هو الصفحة المطبوعة زائدًا سبعة (فُحص من ص23 إلى ص325)؛ و0488_20191224 المسجلة في السجل، وهي ملف PDF مضغوط بلا عارض صفحات ولا مقدمة الطبعة الثانية، ورقم الصفحة فيه هو الرقم المطبوع. وحلّت هذه الطبعة محل نسخة العمل (تحقيق ناصر الدين، دار الكتب العلمية، ط3 2002) في دفعة 2026-10-19، ونُقلت إليها الإحالات كلها."
