note: "ليست تحقيقًا علميًّا للديوان، وحواشيها شرح ميسّر للمفردات. نأخذ منها نص القصائد غير المعلقة، ونقابله بالأقدم: ابن الأَنْبارِيّ وابن قُتَيْبة والميداني وابن رَشِيق. ترقيمها في المكتبة الشاملة موافق للمطبوع."
