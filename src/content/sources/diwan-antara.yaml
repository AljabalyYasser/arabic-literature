short: "ديوان عَنْتَرَة"
author: "عَنْتَرَة بن شَدّاد، برواية الأصمعي وشرح الأعلم الشَّنْتَمَرِيّ (ت 476هـ)"
title: "ديوان عَنْتَرَة: تحقيق ودراسة"
kind: "primary"
editor: "محمد سعيد مولوي"
edition: "بلا تاريخ؛ وأصله رسالة ماجستير في جامعة القاهرة، 1964م"
publisher: "المكتب الإسلامي"
url: "https://archive.org/details/3562pdf"
note: "القسم المعتمد «الديوان بشرح الأعلم الشنتمري» (القصائد 1–27، ص181–314). والقصائد 23–27 زادها الأعلم على رواية الأصمعي فيما يرى المحقق، والقصائد 28–40 زيادات البطليوسي، وما بعدها مما في كتب الأدب، والدرجة تتبع القسم. والفرق بين ورقة المصوّرة والصفحة المطبوعة غير ثابت، وفيها أوراق مقدّمة ومؤخّرة، فنحيل بالصفحة المطبوعة كما تُرى في الصورة."
