short: "الشرح المنسوب إلى ثَعْلَب"
author: "زُهَيْر بن أبي سُلْمَى، بالشرح المنسوب إلى أبي العباس ثَعْلَب (ت 291هـ)"
title: "شرح شعر زُهَيْر بن أبي سُلْمَى"
kind: "primary"
editor: "فخر الدين قباوة"
edition: "الطبعة الثالثة، 1428هـ / 2008م"
publisher: "مكتبة هارون الرشيد، دمشق"
url: "https://archive.org/details/3918pdf"
note: "الرواية الكوفية، شاهد ثانٍ تُقابَل به رواية الأعلم. أصلها نسخة هالّة المؤرخة 533هـ، وفي أولها أنه شرح ثعلب وفي آخرها أنه من رواية السكري، فنقول «الشرح المنسوب إلى ثَعْلَب». والصفحة المطبوعة في المصوّرة رقم الصفحة زائدًا واحدًا."
