author: "عَبِيد بن الأَبْرَص الأَسَدِيّ"
title: "ديوان عَبِيد بن الأَبْرَص (The Dīwāns of ʿAbīd ibn al-Abraṣ, of Asad, and ʿĀmir ibn aṭ-Ṭufail, of ʿĀmir ibn Ṣaʿṣaʿah)"
kind: "primary"
editor: "تشارلز لايل (Charles Lyall)"
edition: "1913م، سلسلة جب التذكارية رقم 21، مع ديوان عامر بن الطُّفَيْل"
publisher: "بريل، ليدن؛ ولوزاك، لندن"
url: "https://archive.org/details/diwansofabidibna21abiduoft"
note: "نشره لايل عن مخطوطة واحدة في المتحف البريطاني، يقول في مقدمته إنها نُسخت في أوائل القرن الخامس الهجري، ولا تُعرف لها نسخة ثانية. في القسم العربي أخبار عَبِيد (ص1–4)، ثم أربع وعشرون قصيدة من المخطوطة بشروح قصيرة (ص5–68)، ثم «ملحق» بقصائد تُنسب إليه في المختارات و«الأغاني» وغيرها (من ص69)، جمعه لايل وليس من المخطوطة. والقسم العربي في المصوّرة مقلوب الترتيب: رقم الورقة يساوي 356 مطروحًا منه رقم الصفحة في ص1–68، وفي الملحق رقم الورقة يساوي 352 مطروحًا منه رقم الصفحة. والحواشي الإنجليزية كلام المحقق."
