short: "ديوان لَبِيد"
author: "لَبِيد بن رَبِيعة العامِرِيّ، بشرح أبي الحسن الطُّوسِيّ وغيره"
title: "شرح ديوان لَبِيد بن رَبِيعة العامِرِيّ"
kind: "primary"
editor: "إحسان عَبّاس"
edition: "سلسلة التراث العربي 8، 1962م"
publisher: "وزارة الإرشاد والأنباء، الكويت"
url: "https://archive.org/details/3929pdf"
note: "الطبعة المعتمدة لشعر لَبِيد. الأقسام الأولى رواية الطُّوسِيّ وشرحه، وما بعدها جمعه المحقق من الكتب، وفي آخره «الأشعار المنسوبة للبيد». وشرح المعلقة فيه جمعه المحقق من شرحي التبريزي والمرزوقي، فنأخذ شرح المعلقة من ابن الأَنْبارِيّ. نحيل إلى الصفحة المطبوعة، وهي في المصوّرة رقم الصفحة ناقصًا خمسًا وأربعين."
