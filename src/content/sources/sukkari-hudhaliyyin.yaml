short: "السُّكَّرِيّ، شرح أشعار الهُذَليِّين"
author: "أبو سعيد الحسن بن الحسين السُّكَّرِيّ (ت 275هـ)"
title: "كتاب شرح أشعار الهُذَليِّين"
kind: "primary"
editor: "عبد الستار أحمد فرّاج، وراجعه محمود محمد شاكر"
edition: "ثلاثة أجزاء بترقيم متصل للصفحات، سلسلة «كنوز الشعر» 3، وتاريخ الفراغ منه 16 ذي القعدة 1384هـ / 18 مارس 1965م"
publisher: "مكتبة دار العروبة، القاهرة (مطبعة المدني)"
url: "https://archive.org/details/3816pdf"
note: "صنعة السُّكَّرِيّ، برواية أبي الحسن علي بن عيسى النحوي عن أبي بكر أحمد بن محمد الحُلْوانيّ عن السُّكَّرِيّ، كما في صفحة العنوان. وما بعد البيت في المتن شرح السُّكَّرِيّ، يجمع فيه أقوال الأصمعي وأبي عمرو الشيباني والجُمَحيّ والباهليّ وغيرهم، والحواشي للمحقق ورأيه. ولم يجد المحقق شرح السُّكَّرِيّ لشعر خمسة شعراء: أبي كبير، وساعدة بن جُؤَيّة، وأبي خِراش، والمُتَنَخِّل، وأسامة بن الحارث، فأخّرهم إلى آخر الجزء الثالث، ونقل شعرهم بشرحه عن مطبوع دار الكتب («ديوان الهذليين») ومطبوع أوربا ومطبوعَي باريس لشعر أبي كبير، وقال فيه إن «هذه الشروح لا ترقى إلى مستوى ما روي عن السكرى» (ص1065). فلا ننسب شرح هؤلاء الخمسة إلى السُّكَّرِيّ، ونقول فيه «الشرح المطبوع مع شعره». ويعلّم المحقق في الحواشي القصائد التي من «القسم الملفق» الذي ليس من رواية الأصمعي. المصوّرة بلا نص مقروء يُعتمد عليه، فنحيل بالصفحة المطبوعة كما تُرى في الصورة، ورقم الورقة يساوي الصفحة مضافًا إليها 17 في المواضع التي فحصناها من الأجزاء الثلاثة."
