short: "التِّبْرِيزِيّ، شرح الاختيارات"
author: "الخطيب التِّبْرِيزِيّ، أبو زكريا يحيى بن علي (ت 502هـ)"
title: "شرح اختيارات المفضَّل"
kind: "primary"
editor: "فخر الدين قباوة"
edition: "الطبعة الثانية، 1407هـ / 1987م؛ والأولى في مجمع اللغة العربية بدمشق، 1391هـ / 1971م"
publisher: "دار الكتب العلمية، بيروت"
url: "https://archive.org/details/3820pdf"
note: "شرح المفضليات، يجمع فيه التِّبْرِيزِيّ شرح ابن الأَنْبارِيّ وشرح المَرْزُوقِيّ، وحقّقه قباوة على «نسخة تامة بخط المؤلف» كما في صفحة العنوان. وهو البديل الذي يسمّيه السجل لنشرة لايل من شرح ابن الأَنْبارِيّ. المصوّرة بلا نص مقروء، فنحيل بالصفحة المطبوعة كما تُرى في الصورة، ورقم الورقة في الجزء الأول يساوي الصفحة مضافًا إليها 16. وما في الحواشي كلام المحقق لا كلام التِّبْرِيزِيّ."
