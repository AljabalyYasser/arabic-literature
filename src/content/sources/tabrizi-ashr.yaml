note: "شرح المعلقات السبع ومعها قصيدتا النابغة والأعشى اللتان أضافهما أبو جعفر النحاس، وبائية عَبِيد. نأخذ منه نص قصيدة الأعشى «ودّع هريرة» وشرحها، ونقابل نصه بنشرة لايل (1894). ترقيمه في المكتبة الشاملة موافق للمطبوع."
