short: "ديوان عُرْوَة"
author: "عُرْوَة بن الوَرْد العَبْسِيّ، صنعة أبي يوسف يعقوب بن إسحاق ابن السِّكِّيت (ت 244هـ)"
title: "شعر عُرْوَة بن الوَرْد العَبْسِيّ"
kind: "primary"
editor: "محمد فؤاد نَعْناع"
edition: "الطبعة الأولى، 1415هـ / 1995م"
publisher: "مكتبة الخانجي، القاهرة؛ ومكتبة دار العروبة، الكويت"
url: "https://archive.org/details/4091pdf"
note: "رواية ابن السِّكِّيت وشرحه، حققها المحقق على مخطوطة جامعة ليبزج، وهي النسخة الوحيدة المعروفة لهذه الرواية، وعلى «منتهى الطلب»، وقابلها بطبعات نولدكه (1863م) وابن أبي شَنَب (1926م) والمَلُّوحي وغيرها. الشرح الذي يلي البيت في المتن لابن السِّكِّيت، والحواشي للمحقق ورأيه. وبعد الديوان قسم «زيادات الديوان» جمعه المحقق من المصادر، وما فيه ليس من رواية ابن السِّكِّيت. نحيل إلى الصفحة المطبوعة، وهي في المصوّرة رقم الصفحة زائدًا خمسة في نص الديوان وما بعده (ص31 فما بعدها)، وزائدًا واحدًا في المقدمة."
