short: "صحيح مسلم"
author: "مسلم بن الحجّاج القُشَيْريّ النَّيْسابوريّ (ت 261هـ)"
title: "صحيح مسلم"
kind: "primary"
editor: "محمد فؤاد عبد الباقي"
edition: "1374هـ / 1955م، خمسة أجزاء متسلسلة الترقيم"
publisher: "مطبعة عيسى البابي الحلبي وشركاه، القاهرة"
url: "https://shamela.ws/book/1727"
note: "نحيل بالجزء والصفحة ورقم الحديث، وترقيم الشاملة موافق للمطبوع. والحواشي تحت الأحاديث شرح المحقق ونقوله عن شُرّاح مسلم، فتُنسب إليه. ونقل الحديث في الموقع بلفظه، ومعه حكم المحدثين كما هو: أنه في صحيح مسلم، ولا يُعطى درجة من درجاتنا (خريطة الباب 2، عاشرًا)."
