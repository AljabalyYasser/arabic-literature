author: "الأعشى ميمون بن قيس"
title: "ديوان الأعشى الكبير ميمون بن قيس"
kind: "primary"
editor: "محمد محمد حُسَيْن"
edition: "الطبعة الثانية، مقدمتها مؤرخة 1388هـ / 1968م"
publisher: "المكتب الشرقي للنشر والتوزيع، بيروت؛ طُبع بمطابع مؤسسة الأهرام"
url: "https://archive.org/details/20201023_20201023_0327"
note: "رواية ثَعْلَب، وترقيم القصائد ترقيم جاير، وعليه أحكام شوقي ضيف. والطبعة الثانية آخر نص راجعه المحقق، أكمل فيها فجوات الأولى (1950) بمخطوطة يمنية، والصفحة فيها تزيد على الأولى ستًّا وثلاثين. والتشكيل فيه ناقص فنتمّه، والحواشي شرح المحقق ورأيه."
