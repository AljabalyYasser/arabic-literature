short: "محمود محمد شاكر، جمهرة المقالات"
author: "محمود محمد شاكر، أبو فهر (ت 1418هـ / 1997م)"
title: "جمهرة مقالات الأستاذ محمود محمد شاكر"
kind: "study"
editor: "جمعها وقرأها وقدم لها الدكتور عادل سليمان جمال"
publisher: "مكتبة الخانجي، القاهرة"
edition: "الطبعة الأولى، 2003م، جزآن متسلسلا الترقيم"
url: "https://shamela.ws/book/20641"
note: "من صفحة العنوان في الشاملة: «جمهرة مقالات الأستاذ محمود محمد شاكر، جمعها وقرأها وقدم لها الدكتور عادل سليمان جمال، مكتبة الخانجي»، وصفحة الحقوق: «الطبعة الأولى، رقم الإيداع: ٢٣٩٠/ ٢٠٠٣». ترقيم الشاملة موافق للمطبوع، والصفحة المطبوعة في الجزء الثاني = رقم صفحة الشاملة ناقص 40 (مثلًا ج2 ص1099 = https://shamela.ws/book/20641/1139). ونأخذ منه شهادة شاكر في محاضرات طه حسين ومقالة مرجليوث: «كانت الجامعة... هي طه حسين» (مجلة الكاتب، مارس 1975، ج2 ص1044–1050)، و«المتنبي ليتني ما عرفته» (مجلة الثقافة، سبتمبر 1978، ج2 ص1093 وما بعدها). ووفاته في 7/8/1997 في مقدمة الجامع (ج1 ص11)."
