title: "ديوان حسّان بن ثابت"
kind: "primary"
editor: "وليد عرفات"
edition: "في جزأين، الجزء الأول: النص والروايات والتخريج، والتمهيد مؤرخ «لندن في نيسان 1971» (سلسلة جب التذكارية)"
publisher: "معهد الدراسات الشرقية والإفريقية بجامعة لندن، وأمناء سلسلة جب التذكارية"
