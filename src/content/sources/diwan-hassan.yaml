note: "الطبعة المرجعية لشعر حسّان، والبيانات من صفحة العنوان والتمهيد. ثلاثة أقسام: الأول «رواية ابن حبيب» عن مخطوطة أحمد الثالث (ط) وغيرها (ق1–225، ص17–402)، والثاني ما انفردت به مخطوطة «طا» (ق226–263، ص405–440)، والثالث ما جمعه المحقق من الكتب (ق264–372، ص441–524). يقول المحقق إنه «حاول ... أن يجمع بين دفتين كل ما نسب إلى حسان بن ثابت من شعر» (التمهيد)، فوجود القطعة في القسم الثالث لا يكفي لنسبتها. ولكل قطعة: المناسبة، والتخريج، والروايات أحيانًا. وجزؤه الثاني (الشروح والتعليقات) لم نجد له مصوّرة، فلا شرح قديمًا في هذه الطبعة. والهمزية «عفت ذات الأصابع» نقرؤها على رواية ابن إسحاق في سيرة ابن هشام، وهذه الطبعة (ق1) شاهدها الثاني. نحيل إلى الصفحة المطبوعة، ورقم الورقة في المصوّرة يساوي رقم الصفحة مضافًا إليه 10 (فُحص على الصفحات 17–20 و34–36 و40 و74–76 و255–256 و368 و426 و501)."
