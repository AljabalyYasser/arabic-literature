short: "ياقوت، معجم البلدان"
author: "شهاب الدين أبو عبد الله ياقوت بن عبد الله الرُّومِيّ الحَمَوِيّ (ت 626هـ)"
title: "معجم البُلْدان"
kind: "dictionary"
edition: "الطبعة الثانية، 1995م، سبعة أجزاء"
publisher: "دار صادر، بيروت"
url: "https://shamela.ws/book/23735"
note: "معجم لأسماء المواضع مرتب على حروف المعجم: يضبط الاسم ويعيّن الموضع، وينشد عليه الشعر كثيرًا. نرجع إليه في تفسير أسماء الأماكن في الشعر، وما يرجّحه في تعيين موضع يُنسب إليه في المتن. ترقيمه في المكتبة الشاملة موافق للمطبوع."
