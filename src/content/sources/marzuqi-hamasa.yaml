short: "المَرْزُوقِيّ"
author: "أبو علي أحمد بن محمد بن الحسن المَرْزُوقِيّ (ت 421هـ)"
title: "شرح ديوان الحماسة (اختيار أبي تَمّام)"
kind: "primary"
editor: "أحمد أمين وعبد السلام هارون"
edition: "الطبعة الأولى، 1411هـ / 1991م، أربعة أقسام"
publisher: "دار الجيل، بيروت"
url: "https://archive.org/details/20200203_20200203_0805"
note: "الطبعة المرجعية، وفيها «مقدمة الشارح» كاملة. ترقيم الصفحات متصل في الأقسام الأربعة، فنحيل على الصفحة المطبوعة وحدها. والمصوّرة المرتبطة تجمع الأقسام الأربعة في ملف واحد، ورقم الورقة فيها هو الصفحة المطبوعة مضافًا إليها 24. ومصوّرات الأقسام منفردة على أرشيف الإنترنت (AAskZad-1137328، و1137333، و1137338، و1137343) من النشرة نفسها، لكنها لا تُفتح على صفحة بعينها. أما تحقيق غريد الشيخ (دار الكتب العلمية، 2003) في المكتبة الشاملة (26536) فنسخة بحث: نبحث فيها ولا نحيل إليها، وقد نُقلت إحالاتنا السابقة عليها إلى هذه الطبعة."
