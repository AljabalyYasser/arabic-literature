short: "ديوان النابِغة"
author: "النابِغة الذُّبْيانيّ، برواية الأصمعي وشرح الأعلم الشَّنْتَمَرِيّ (ت 476هـ)"
title: "ديوان النابِغة الذُّبْيانيّ"
kind: "primary"
editor: "محمد أبو الفضل إبراهيم"
edition: "ذخائر العرب 52، الطبعة الثانية، 1985م"
publisher: "دار المعارف، القاهرة"
url: "https://archive.org/details/3409pdf_202001"
note: "القسم الأول (القصائد 1–22، ص9–122) رواية الأصمعي من نسخة الأعلم وشرحه، وعليه نعتمد. وما بعده (رواية الطوسي من ص123، ورواية ابن السكيت من ص161، والمنسوب من ص227) درجته أدنى. وسنة الطبع من رقم الإيداع في آخره. والصفحة المطبوعة في المصوّرة رقم الصفحة زائدًا واحدًا."
