short: "ديوان زُهَيْر"
author: "زُهَيْر بن أبي سُلْمَى، برواية الأصمعي وشرح الأعلم الشَّنْتَمَرِيّ (ت 476هـ)"
title: "شعر زُهَيْر بن أبي سُلْمَى، صنعة الأعلم الشَّنْتَمَرِيّ"
kind: "primary"
editor: "فخر الدين قباوة"
edition: "الطبعة الثالثة، 1400هـ / 1980م"
publisher: "دار الآفاق الجديدة، بيروت"
url: "https://archive.org/details/3917pdf"
note: "القسم الأول (القصائد 1–20، ص5–197) رواية الأعلم وشرحه، وهو قطعة من كتابه «شرح الأشعار الستة»، وعليه نعتمد. والذيل من ص199 عن ثعلب وصعوداء، ودرجته أدنى، وتعليقاته للمحقق. والصفحة المطبوعة في المصوّرة هي رقم الصفحة نفسه."
