short: "ديوان امرئ القَيْس"
author: "امرؤ القَيْس بن حُجْر الكِنْدِيّ، برواية الأصمعي وشرح الأعلم الشَّنْتَمَرِيّ (ت 476هـ)"
title: "ديوان امرئ القَيْس"
kind: "primary"
editor: "محمد أبو الفضل إبراهيم"
edition: "ذخائر العرب 24، الطبعة الخامسة، 1990م"
publisher: "دار المعارف، القاهرة"
url: "https://archive.org/details/3426pdf_202001"
note: "القسم الأول (القصائد 1–28، ص1–149) رواية الأصمعي من نسخة الأعلم وشرحه، وعليه نعتمد. وما بعده درجته أدنى: رواية المفضل من نسخة الطوسي مما لم يروه الأصمعي (ص151–219)، ثم زيادات النسخ (ص223–364)، ثم «تحقيق رواية الديوان» وفيه اختلاف النسخ (ص365–454)، ثم ملحق بالشعر المنسوب إليه مما لم يرد في أصول الديوان المخطوطة (ص455–478). وسنة الطبع من رقم الإيداع في آخره. ورقم الورقة في المصوّرة رقم الصفحة زائدًا ثمانية وعشرين، إلا التصدير (ص5–21) فرقمه في ذيل الصفحة، والورقة رقمه زائدًا ستة."
