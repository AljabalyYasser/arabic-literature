short: "ابن عبد البَرّ، الاستيعاب"
author: "أبو عمر يوسف بن عبد الله بن محمد بن عبد البَرّ النَّمَرِيّ القُرْطُبِيّ (ت 463هـ)"
title: "الاستيعاب في معرفة الأصحاب"
kind: "primary"
editor: "علي محمد البِجاوي"
edition: "1380هـ / 1960م، أربعة أجزاء متسلسلة الترقيم"
publisher: "مكتبة نهضة مصر، القاهرة؛ وصوّرتها دار الجيل، بيروت، الطبعة الأولى، 1412هـ / 1992م"
url: "https://shamela.ws/book/12288"
note: "ترقيمه في المكتبة الشاملة موافق للمطبوع، والأجزاء الأربعة متسلسلة الترقيم، فنحيل بالجزء والصفحة. بيانات نهضة مصر من بطاقة الشاملة. وفي أرشيف الإنترنت مصوّرة دار الجيل للتحقيق نفسه (https://archive.org/details/esteab)، وصفحة عنوانها: «تحقيق علي محمد البجاوي»، «دار الجيل، بيروت»، «الطبعة الأولى 1412هـ-1992م». وترقيمها ترقيم الشاملة، ورقم الورقة فيها يساوي رقم الصفحة ناقصًا 1 (فُحص على ص1–2 وص346–347). ابن عبد البَرّ ناقل متأخر: ما يرويه بإسناد إلى راوٍ أقدم، كالزبير بن بكّار وأبي عُبَيْدة والأَصْمَعِيّ، فالشاهد ذلك الراوي ونذكره معه، وما يرويه بلا إسناد («وقيل») فأقدم مصادره الاستيعاب نفسه، ويأخذ الخبر درجته بذلك (قاعدة شعر السيرة). والحواشي للمحقق، وإحالاته فيها إلى «ديوانه» على طبعة من ديوان حسّان غير الطبعة التي نعتمدها."
