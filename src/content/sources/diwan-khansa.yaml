short: "ديوان الخَنْساء"
author: "الخَنْساء تُماضِر بنت عَمْرو السُّلَمِيّة، بالشرح المنسوب إلى ثَعْلَب (ت 291هـ)"
title: "ديوان الخَنْساء"
kind: "primary"
editor: "أنور أبو سُوَيْلِم"
edition: "الطبعة الأولى، 1409هـ / 1988م"
publisher: "دار عمّار، عمّان"
url: "https://archive.org/details/3318pdf_202001"
note: "رواية ثَعْلَب عن ابن الأعرابي، من نسخة دار الكتب المصرية، وقوبلت بنسخة الأوقاف ببغداد. والشرح مركّب: أُضيف إليه من شرح ابن الأعرابي وغيره، فنقول «الشرح المنسوب إلى ثَعْلَب». والأرقام بين معقوفين ترقيم المحقق للقصائد، وحواشيه رأيه. نحيل إلى الصفحة المطبوعة، وهي في المصوّرة رقم الصفحة زائدًا واحدًا."
