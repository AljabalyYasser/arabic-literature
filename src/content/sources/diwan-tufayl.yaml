short: "ديوان طُفَيْل"
author: "طُفَيْل بن عَوْف الغَنَوِيّ، رواية الأَصْمَعِيّ (ت 216هـ) بنقل أبي حاتم السِّجِسْتانيّ"
title: "ديوان طُفَيْل الغَنَوِيّ، شرح الأَصْمَعِيّ"
kind: "primary"
editor: "حسّان فلاح أُوغْلي"
edition: "الطبعة الأولى، 1997م"
publisher: "دار صادر، بيروت"
url: "https://archive.org/details/AAlexandrina-111622"
note: "الطبعة وسنتها من صفحة العنوان وظهرها. يقول المحقق إن شعر طفيل «وصل ... إلينا برواية الأصمعي وشرح السجستاني»، وإن كرنكو نشره سنة 1927، ثم نشره محمد عبد القادر أحمد «مفصولاً عن شرح السجستاني» سنة 1967 (ص5). فالشرح الذي يلي البيت في المتن رواية أبي حاتم السِّجِسْتانيّ عن الأَصْمَعِيّ، ونسمّيه «شرح الديوان»، والحواشي للمحقق ورأيه، وفيها نقول من اللسان ومعجم البلدان وغيرهما. والكتاب ثلاثة أقسام: الأول «لديوان طفيل الذي صنعه الأصمعي» (ص21–126)، والثاني «لما روي لطفيل وليس في ديوانه» (ص127–141)، والثالث «لما روي له ولغيره من الشعراء» (ص142–147). والقسمان الأخيران جمعهما المحقق من الكتب، فليسا من رواية الأَصْمَعِيّ، ولكل قطعة فيهما درجتها بحسب مصدرها. وأصل الكتاب رسالة ماجستير في جامعة دمشق (1995). المصوّرة مصوّرة مكتبة الإسكندرية بلا نص مقروء يُعتمد عليه، فنحيل بالصفحة المطبوعة كما تُرى في الصورة، ورقم الورقة فيها يساوي الصفحة مضافًا إليها 3 (فُحص على الورقات 24 و60 و126 و133 و170)."
