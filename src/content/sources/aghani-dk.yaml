short: "أبو الفَرَج الأَصْفَهانيّ"
author: "أبو الفَرَج علي بن الحسين الأَصْفَهانيّ (ت 356هـ)"
title: "الأغاني (طبعة دار الكتب)"
kind: "primary"
editor: "محققو دار الكتب المصرية في الأجزاء الستة عشر الأولى، ثم لجنة الهيئة المصرية العامة للتأليف والنشر"
edition: "طبعة دار الكتب، 24 جزءًا"
publisher: "دار الكتب المصرية، ثم الهيئة المصرية العامة للتأليف والنشر، القاهرة"
url: "https://archive.org/details/aghani2014"
note: "الطبعة المرجعية للأغاني. نحيل على أجزائها وصفحاتها المطبوعة كما تظهر في صور الصفحات على أرشيف الإنترنت، والجزء الحادي عشر في مصوّرة مستقلة. وقد نُقلت إليها إحالاتنا السابقة على طبعة دار الفكر، إلا الجزأين الخامس والسابع حتى يوجدا. وترجمة المتلمّس فيها قصيرة (ج24 ص259–261)، وليست فيها «التكملة» التي في طبعات أخرى، لأنها ليست لأبي الفَرَج كما يقول المحققون."
