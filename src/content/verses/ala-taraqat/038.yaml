first: يَشُقُّ الْحِدَابَ بِالصَّحَارَى وَيَنْتَحِي
second: فِرَاخَ الْعُقَابِ بِالْحِقَاءِ الْمُحَلِّقِ
vocabulary:
- term: يَنْتَحِي
  text: يقصد [@asmaiyyat، ص26، الحاشية].
- term: الْحِقَاءِ
  text: جمع حَقْو، وهو الموضع الغليظ المرتفع على السيل [@asmaiyyat، ص26، الحاشية].
- term: الْمُحَلِّقِ
  text: المرتفع في طيرانه، وإنما خصّ العقاب لأنه يسكن أعالي الجبال [@asmaiyyat، ص26، الحاشية].
