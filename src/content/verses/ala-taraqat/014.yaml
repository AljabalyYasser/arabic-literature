first: وَمَعْشُوقَةٍ طَلَّقْتُهَا بِمُرِشَّةٍ
second: لَهَا سَنَنٌ كَالْأَتْحَمِيِّ الْمُخَرَّقِ
vocabulary:
- term: وَمَعْشُوقَةٍ طَلَّقْتُهَا
  text: أراد امرأة طعن زوجها ففرّق بينها وبينه، فسمّى هذا التفريق طلاقًا [@asmaiyyat، ص23، الحاشية].
- term: مُرِشَّةٍ
  text: الطعنة اتسعت فتفرّق دمها [@asmaiyyat، ص23، الحاشية].
- term: سَنَنٌ
  text: طريق [@asmaiyyat، ص23، الحاشية].
- term: الْأَتْحَمِيِّ
  text: ضرب من البُرود أحمر اللون [@asmaiyyat، ص23، الحاشية].
