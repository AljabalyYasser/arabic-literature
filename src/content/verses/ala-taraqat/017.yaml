first: طَوِيلٍ عُظَامٍ غَيْرِ خَافٍ نَمَى بِهِ
second: سَلِيمُ الشَّظَا فِي مُكْرَبَاتِ الْمُطَبَّقِ
vocabulary:
- term: عُظَامٍ
  text: عظيم [@asmaiyyat، ص23، الحاشية].
- term: غَيْرِ خَافٍ
  text: ظاهر بين الخيل [@asmaiyyat، ص23، الحاشية].
- term: الشَّظَا
  text: عظم لاصق بالركبة [@asmaiyyat، ص23، الحاشية].
- term: الْمُطَبَّقِ
  text: موضع انطباق العظمين، وهو المفصل [@asmaiyyat، ص24، الحاشية].
- term: مُكْرَبَاتِ
  text: الشديدة العَقْد، يريد أن هذا الفرس ينتمي إلى أب كريم [@asmaiyyat، ص24، الحاشية].
