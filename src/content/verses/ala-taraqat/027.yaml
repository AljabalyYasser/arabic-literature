first: كَأَنَّ مَحَافِيرَ السِّبَاعِ حِيَاضَهُ
second: لِتَعْرِيسِهَا جَنْبَ الْإِزَاءِ الْمُمَزَّقِ
vocabulary:
- term: مَحَافِيرَ
  text: جمع مَحْفَر، مصدر ميمي من الحفر، و«حياضه» مفعوله [@asmaiyyat، ص25، الحاشية].
- term: تَعْرِيسِهَا
  text: نزولها ليلًا [@asmaiyyat، ص25، الحاشية].
- term: الْإِزَاءِ
  text: مَصبّ الماء في الحوض [@asmaiyyat، ص25، الحاشية].
