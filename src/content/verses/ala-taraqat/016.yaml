first: وَخَيْلٍ تَعَادَى لَا هَوَادَةَ بَيْنَهَا
second: شَهِدْتُ بِمَدْلُوكِ الْمَعَاقِمِ مُحْنِقِ
vocabulary:
- term: تَعَادَى
  text: تتعادى، من العَدْو [@asmaiyyat، ص23، الحاشية].
- term: لَا هَوَادَةَ
  text: لا لين ولا مصالحة.
- term: الْمَعَاقِمِ
  text: فِقَر في مؤخّر الصلب، أو هي المفاصل [@asmaiyyat، ص23، الحاشية].
- term: مُحْنِقِ
  text: القليل اللحم، الضامر [@asmaiyyat، ص23، الحاشية].
