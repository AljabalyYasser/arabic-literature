first: أَلَا طَرَقَتْ أَسْمَاءُ فِي غَيْرِ مَطْرَقِ
second: وَأَنَّى إِذَا حَلَّتْ بِنَجْرَانَ نَلْتَقِي
vocabulary:
- term: طَرَقَتْ
  text: أتت ليلًا، يريد طيفها في النوم.
- term: مَطْرَقِ
  text: اسم مكان أو زمان من الطُّروق، وهو الإتيان ليلًا [@asmaiyyat، ص21، الحاشية].
- term: وَأَنَّى
  text: وكيف.
