first: كَأَنَّ الْحُدَاةَ وَالْمُشَايِعَ وَسْطَهُ
second: وَعُوذًا مَطَافِيلًا بِأَمْعَزَ مُشْرِقِ
vocabulary:
- term: الْمُشَايِعَ
  text: الذي يصيح بالإبل لتجتمع وتنساق [@asmaiyyat، ص26، الحاشية].
- term: عُوذًا
  text: الإبل الحديثات النتاج، جمع عائذ [@asmaiyyat، ص26، الحاشية].
- term: مَطَافِيلًا
  text: التي معها أولادها [@asmaiyyat، ص26، الحاشية].
- term: أَمْعَزَ
  text: الأرض الحزنة الغليظة ذات الحجارة [@asmaiyyat، ص26، الحاشية].
