explained: false
first: وَعَتْهُ جَوَادٌ لَا يُبَاعُ جَنِينُهَا
second: بِمَنْسُوبَةٍ أَعْرَاقُهُ غَيْرِ مُحْمِقِ
vocabulary:
- term: وَعَتْهُ
  text: حفظته وجمعته، والمراد أمه التي ولدته [@asmaiyyat، ص24، الحاشية].
- term: جَوَادٌ
  text: يقال للذكر والأنثى من الخيل [@asmaiyyat، ص24، الحاشية].
- term: أَعْرَاقُهُ
  text: أصوله، جمع عِرْق [@asmaiyyat، ص24، الحاشية].
- term: مُحْمِقِ
  text: التي تلد الحمقى [@asmaiyyat، ص24، الحاشية].
