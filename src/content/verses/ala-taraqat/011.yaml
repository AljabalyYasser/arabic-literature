first: فَعَثْرَةِ مَوْلًى قَدْ نَعَشْتُ وَأُسْرَةٍ
second: كِرَامٍ وَأَبْطَالٍ لَدَى كُلِّ مَأْزِقِ
vocabulary:
- term: فَعَثْرَةِ
  text: أي فرُبّ عثرة؛ والفاء فاء «رُبّ»، و«رُبّ» تعمل محذوفة [@asmaiyyat، ص23، الحاشية].
- term: نَعَشْتُ
  text: رفعتُه من عثرته [@asmaiyyat، ص23، الحاشية].
- term: مَأْزِقِ
  text: مضيق في الحرب.
