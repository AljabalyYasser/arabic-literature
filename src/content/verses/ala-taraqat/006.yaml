first: وَحَيْثُ الْجَمِيعُ الْحَابِسُونَ بِرَاكِسٍ
second: وَكَانَ الْمِحَاقُ مَوْعِدًا لِلتَّفَرُّقِ
vocabulary:
- term: الْحَابِسُونَ
  text: الذين حبسوا إبلهم عن الرعي [@asmaiyyat، ص22، الحاشية].
- term: رَاكِسٍ
  text: واد [@asmaiyyat، ص22، الحاشية].
- term: الْمِحَاقُ
  text: آخر الشهر إذا انمحق الهلال فلم يُرَ، أراد آخر أيامهم في المقام في الحج [@asmaiyyat، ص22، الحاشية].
