first: مِنَ الْكَاتِمَاتِ الرَّبْوَ تَمْزَعُ مُقْدِمًا
second: سَبُوقًا إِلَى الْغَايَاتِ غَيْرَ مُسَبَّقِ
vocabulary:
- term: الرَّبْوَ
  text: النَّفَس العالي؛ والكاتمات الربو التي لا تلهث [@asmaiyyat، ص24، الحاشية].
- term: تَمْزَعُ
  text: تُسرع في السير [@asmaiyyat، ص24، الحاشية].
- term: مُسَبَّقِ
  text: الذي يُسبَق؛ والعرب تقول للذي يَسبق من الخيل سابق وسبوق [@asmaiyyat، ص24، الحاشية].
