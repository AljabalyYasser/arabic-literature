first: بَصِيرٍ بِأَطْرَافِ الْحِدَابِ مُقَلِّصٍ
second: نَبِيلٍ يُسَاوَى بِالطِّرَافِ الْمُرَوَّقِ
vocabulary:
- term: الْحِدَابِ
  text: جمع حَدَب، وهو الغليظ المرتفع من الأرض [@asmaiyyat، ص24، الحاشية].
- term: مُقَلِّصٍ
  text: الطويل القوائم [@asmaiyyat، ص24، الحاشية].
- term: نَبِيلٍ
  text: الحسن الخِلقة [@asmaiyyat، ص24، الحاشية].
- term: الطِّرَافِ
  text: بيت من أَدَم، أي من جلد [@asmaiyyat، ص24، الحاشية].
- term: الْمُرَوَّقِ
  text: الذي جُعل له رِواق، وهو ستر يُمدّ دون السقف [@asmaiyyat، ص24، الحاشية].
