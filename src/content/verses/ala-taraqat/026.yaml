first: تَبِيتُ إِلَى عِدٍّ تَقَادَمَ عَهْدُهُ
second: بِحَرٍّ تَقَى حَرَّ النَّهَارِ بِغَلْفَقِ
vocabulary:
- term: تَبِيتُ
  text: الضمير للناقة [@asmaiyyat، ص25، الحاشية].
- term: عِدٍّ
  text: القديمة من الرَّكايا، أي الآبار [@asmaiyyat، ص25، الحاشية].
- term: تَقَى
  text: لغة في «اتّقى» [@asmaiyyat، ص25، الحاشية].
- term: غَلْفَقِ
  text: الطُّحْلُب، وهو الخضرة على رأس الماء؛ يريد أن هذا الماء بارد بما علاه من الغلفق [@asmaiyyat، ص25، الحاشية].
