explained: false
first: أَسَالَ شَقًا يَعْلُو الْعِضَاهَ غُثَاؤُهُ
second: يُصَفِّقُ فِي قِيعَانِهَا كُلَّ مَصْفَقِ
vocabulary:
- term: شَقًا
  text: يبدو للمحققين أنه اسم مكان بعينه، ولعله واد سال فيه الماء [@asmaiyyat، ص26، الحاشية].
- term: الْعِضَاهَ
  text: ما عظم من شجر الشوك وطال واشتد شوكه [@asmaiyyat، ص26، الحاشية].
- term: غُثَاؤُهُ
  text: ما يحمله السيل من الزبد والوسخ ونحوه [@asmaiyyat، ص26، الحاشية].
