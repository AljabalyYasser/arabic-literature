explained: false
first: وَمَدَّ الشِّمَالَ طَعْنُهُ فِي عِنَانِهِ
second: وَبَاعَ كَبَوْعِ الشَّادِنِ الْمُتَطَلِّقِ
vocabulary:
- term: طَعْنُهُ فِي عِنَانِهِ
  text: طعن الفرس في العنان إذا مدّه وتبسّط في السير، فإذا فعل ذلك مدّ شمال فارسه [@asmaiyyat، ص24، الحاشية].
- term: بَاعَ
  text: من البَوْع، وهو بسط الباع في المشي [@asmaiyyat، ص24، الحاشية].
- term: الشَّادِنِ
  text: ولد الظبية إذا قوي واشتدّ [@asmaiyyat، ص24، الحاشية].
- term: الْمُتَطَلِّقِ
  text: 'من قولهم: تطلّق الظبي، إذا استنّ في عدوه فمضى ولم يلوِ على شيء [@asmaiyyat، ص24، الحاشية].'
