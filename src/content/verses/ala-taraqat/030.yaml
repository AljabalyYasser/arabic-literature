explained: false
first: عَلَا الْأُكْمَ مِنْهُ وَابِلٌ بَعْدَ وَابِلٍ
second: فَقَدْ أُرْهِقَتْ قِيعَانُهُ كُلَّ مُرْهَقِ
vocabulary:
- term: الْأُكْمَ
  text: جمع أَكَمة، وهي التلّ [@asmaiyyat، ص25، الحاشية].
- term: وَابِلٌ
  text: مطر غزير.
- term: أُرْهِقَتْ
  text: غُشيت، يعني بالماء [@asmaiyyat، ص25، الحاشية].
- term: قِيعَانُهُ
  text: جمع قاع، وهو الأرض السهلة المطمئنة قد انفرجت عنها الجبال والآكام [@asmaiyyat، ص25، الحاشية].
