first: سَرَتْ كُلَّ وَادٍ دُونَ رَهْوَةَ دَافِعٍ
second: وَجِلْذَانَ أَوْ كَرْمٍ بِلِيَّةَ مُحْدِقِ
vocabulary:
- term: رَهْوَةَ
  text: جبل أو طريق بالطائف [@asmaiyyat، ص22، الحاشية].
- term: دَافِعٍ
  text: يدفع الماء، صفة للوادي [@asmaiyyat، ص22، الحاشية].
- term: جِلْذَانَ
  text: موضع قرب الطائف [@asmaiyyat، ص22، الحاشية].
- term: لِيَّةَ
  text: موضع بالطائف أيضًا [@asmaiyyat، ص22، الحاشية].
- term: مُحْدِقِ
  text: محيط، يريد أن الكرم استدار بهذا الموضع [@asmaiyyat، ص22، الحاشية].
