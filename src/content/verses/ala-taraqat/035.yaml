first: فَجَادَ شَرَوْرَا فَالسِّتَارَ فَأَصْبَحَتْ
second: يَعَارُ لَهُ وَالْوَادِيَانِ بِمَوْدِقِ
vocabulary:
- term: شَرَوْرَا فَالسِّتَارَ
  text: مواضع في بلاد بني سُلَيْم، ومثلها «يعار» [@asmaiyyat، ص26، الحاشية].
- term: جَادَ
  text: أصابه بالجَوْد، وهو المطر الغزير [@asmaiyyat، ص26، الحاشية].
- term: مَوْدِقِ
  text: مكان الوَدْق، وهو المطر [@asmaiyyat، ص26، الحاشية].
