first: بِغُرِّ الثَّنَايَا خَيَّفَ الظَّلْمُ نَبْتَهُ
second: وَسُنَّةِ رِئْمٍ بِالْجُنَيْنَةِ مُونِقِ
vocabulary:
- term: بِغُرِّ الثَّنَايَا
  text: بثنايا بيض.
- term: الظَّلْمُ
  text: ماء الأسنان، و«خيّف الظلم نبته» أي تخلّل أسنانه [@asmaiyyat، ص22، الحاشية].
- term: سُنَّةِ رِئْمٍ
  text: طريقة الظبي الخالص البياض، أراد بها الدَّلّ [@asmaiyyat، ص22، الحاشية].
- term: الْجُنَيْنَةِ
  text: موضع [@asmaiyyat، ص22، الحاشية].
- term: مُونِقِ
  text: مُعجِب [@asmaiyyat، ص22، الحاشية].
