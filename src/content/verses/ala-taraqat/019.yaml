first: إِذَا مَا اسْتَحَمَّتْ أَرْضُهُ مِنْ سَمَائِهِ
second: جَرَى وَهْوَ مَوْدُوعٌ وَوَاعِدُ مَصْدَقِ
vocabulary:
- term: اسْتَحَمَّتْ أَرْضُهُ مِنْ سَمَائِهِ
  text: إذا عرق فابتلّ أسفله من أعلاه [@asmaiyyat، ص24، الحاشية].
- term: مَوْدُوعٌ
  text: من الدَّعة، وهي السكون؛ أي يجري لا يُضرب ولا يُزجر [@asmaiyyat، ص24، الحاشية].
- term: وَاعِدُ مَصْدَقِ
  text: يَصدقك فيما يَعِدك من بلوغ الغاية [@asmaiyyat، ص24، الحاشية].
