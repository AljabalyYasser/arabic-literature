first: رَبَأْتُ وَحُرْجُوجٍ جَهَدْتُ رَوَاحَهَا
second: عَلَى لَاحِبٍ مِثْلِ الْحَصِيرِ الْمُشَقَّقِ
vocabulary:
- term: رَبَأْتُ
  text: صرتُ ربيئة، وهو العين والطليعة للقوم لئلا يدهمهم عدو، ولا يكون إلا على جبل أو شرف [@asmaiyyat، ص25، الحاشية].
- term: حُرْجُوجٍ
  text: الناقة الجسيمة الطويلة على وجه الأرض [@asmaiyyat، ص25، الحاشية].
- term: جَهَدْتُ
  text: بلغت جهدها وحملت عليها في السير فوق طاقتها [@asmaiyyat، ص25، الحاشية].
- term: لَاحِبٍ
  text: الطريق الواضح [@asmaiyyat، ص25، الحاشية].
