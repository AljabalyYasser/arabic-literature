explained: false
first: "بَكَرَ الْعَاذِلُونَ فِي وَضَحِ الصُّبْـ"
second: "ـحِ يَقُولُونَ لِي أَلَا تَسْتَفِيقُ"
vocabulary:
  - term: "بَكَرَ"
    text: "جاؤوا بُكرة، أي في أول النهار."
  - term: "الْعَاذِلُونَ"
    text: "اللائمون؛ «العَذْلُ: اللَّومُ» [@lisan، ج11 ص437]."
  - term: "وَضَحِ الصُّبْحِ"
    text: "ضوئه."
  - term: "تَسْتَفِيقُ"
    text: "تصحو مما أنت فيه من الخمر والهوى."
