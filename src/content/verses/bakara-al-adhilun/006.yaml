explained: false
first: "فَدَعَوْا بِالصَّبُوحِ يَوْمًا فَجَاءَتْ"
second: "قَيْنَةٌ فِي يَمِينِهَا إِبْرِيقُ"
vocabulary:
  - term: "الصَّبُوحِ"
    text: "خمر الصباح، «وهو شرب الغداة» [@ibn-al-anbari، ص371]."
  - term: "قَيْنَةٌ"
    text: "جارية مغنية: «والقَيْنةُ: الأَمة المُغنّية» [@lisan، ج13 ص351]."
  - term: "إِبْرِيقُ"
    text: "«إِنَاءٌ، وَجَمْعُهُ أبارِيقُ، فَارِسِيٌّ مُعَرَّبٌ»، وأنشد ابن بَرِّيّ هذا البيت شاهدًا له [@lisan، ج10 ص17]."
