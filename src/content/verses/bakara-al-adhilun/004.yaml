explained: false
first: "زَانَهَا حُسْنُهَا وَفَرْعٌ عَمِيمٌ"
second: "وَأَثِيثٌ صَلْتُ الْجَبِينِ أَنِيقُ"
vocabulary:
  - term: "فَرْعٌ"
    text: "شعر: «والفَرْعُ: الشَّعَرُ التَّامُّ» [@lisan، ج8 ص249]."
  - term: "عَمِيمٌ"
    text: "كثيف؛ و«العَمِيمُ: النبتُ الْكَثِيفُ الحسَن» [@lisan، ج11 ص601]، فاستعاره للشعر."
  - term: "أَثِيثٌ"
    text: "كثير ملتفّ: «أَثَّ النباتُ يَئِثُّ أَثاثةً أَي كثُر والتَفَّ، وَهُوَ أَثِيثٌ، وَيُوصَفُ بِهِ الشَّعَر الكثير» [@lisan، ج2 ص110]."
  - term: "صَلْتُ الْجَبِينِ"
    text: "واضح الجبين مستويه: «الصَّلْتُ: البارِزُ المُسْتَوي» [@lisan، ج2 ص53]."
