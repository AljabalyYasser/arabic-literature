explained: false
first: "ثُمَّ كَانَ الْمِزَاجُ مَاءَ سَمَاءٍ"
second: "غَيْرَ مَا آجِنٍ وَلَا مَطْرُوقِ"
vocabulary:
  - term: "الْمِزَاجُ"
    text: "ما تُمزج به الخمر."
  - term: "مَاءَ سَمَاءٍ"
    text: "ماء مطر."
  - term: "آجِنٍ"
    text: "«الآجِنُ: الماءُ المتغيّرُ الطعمِ واللونِ» [@lisan، ج13 ص8]."
  - term: "مَطْرُوقِ"
    text: "«والطَّرْقُ والمَطرُوق أَيضاً: مَاءُ السَّمَاءِ الَّذِي تَبُولُ فِيهِ الإِبل وتَبْعَرُ»، وأنشد صاحب اللسان هذا البيت لعَدِيّ [@lisan، ج10 ص216]."
