explained: false
first: "قَدَّمَتْهُ عَلَى عُقَارٍ كَعَيْنِ الـ"
second: "ـدِّيكِ صَفَّى سُلَافَهَا الرَّاوُوقُ"
vocabulary:
  - term: "قَدَّمَتْهُ"
    text: "قدّمت الإبريق، أي صبّت منه."
  - term: "عُقَارٍ"
    text: "خمر: «والعُقَارُ: الْخَمْرُ، سُمِّيَتْ بِذَلِكَ لأَنها عاقَرت العَقل وعاقَرت الدَّنّ أَي لَزِمَتْه» [@lisan، ج4 ص598]."
  - term: "كَعَيْنِ الدِّيكِ"
    text: "صافية حمراء كعين الديك."
  - term: "سُلَافَهَا"
    text: "خالصها: «وَقِيلَ: السلافُ والسلافةُ مِنْ كُلِّ شَيْءٍ خالِصُه» [@lisan، ج9 ص160]."
  - term: "الرَّاوُوقُ"
    text: "«المِصْفاةُ، وَرُبَّمَا سَمَّوُا الباطِيةَ راوُوقاً» [@lisan، ج10 ص134]."
