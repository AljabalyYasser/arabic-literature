first: "وَيَلُومُونَ فِيكِ يَا ابْنَةَ عَبْدِ الـ"
second: "ـلَّهِ وَالْقَلْبُ عِنْدَكُمْ مَوْهُوقُ"
vocabulary:
  - term: "مَوْهُوقُ"
    text: "مشدود بالوَهَق، أي أسير عندكم: «الوَهَقُ، بِالتَّحْرِيكِ: حَبْلٌ كالطِّوَل»، وهو «حَبَلٌ كالطِّوَل تُشَدُّ بِهِ الإِبل وَالْخَيْلُ لِئَلَّا تَنِدَّ»، وأنشد ابن بَرِّيّ هذا البيت لعَدِيّ [@lisan، ج10 ص386]."
