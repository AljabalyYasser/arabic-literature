explained: false
first: "مُرَّةٍ قَبْلَ مَزْجِهَا فَإِذَا مَا"
second: "مُزِجَتْ لَذَّ طَعْمُهَا مَنْ يَذُوقُ"
vocabulary:
  - term: "مُرَّةٍ"
    text: "حادّة الطعم قبل أن تُخلط بالماء. وفي رواية اللسان «مُزَّةٍ» بالزاي [@lisan، ج10 ص216]، والمُزّة: «الْخَمْرَةُ الَّتِي فِيهَا مَزَازَةٌ» [@lisan، ج5 ص409]."
  - term: "مَزْجِهَا"
    text: "خلطها بالماء."
