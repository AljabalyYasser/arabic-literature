explained: false
first: "وَطَفَتْ فَوْقَهَا فَقَاقِيعُ كَالدُّرْ"
second: "رِ صِغَارٌ يُثِيرُهَا التَّصْفِيقُ"
vocabulary:
  - term: "طَفَتْ"
    text: "علت."
  - term: "فَقَاقِيعُ"
    text: "حبب الخمر: «هَناتٌ كأَمثالِ القَوارِيرِ الصِّغَارِ مُسْتَدِيرَةٌ تَتَفَقَّعُ عَلَى الْمَاءِ والشرابِ عِنْدَ المَزْجِ بِالْمَاءِ»، وأنشد صاحب اللسان هذا البيت لعَدِيّ [@lisan، ج8 ص256]."
  - term: "التَّصْفِيقُ"
    text: "المزج: «وصَفَّقَ الشرابَ: مزجَه» [@lisan، ج10 ص202]."
