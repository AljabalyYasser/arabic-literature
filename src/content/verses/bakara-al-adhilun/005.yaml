explained: false
first: "وَثَنَايَا مُفَلَّجَاتٌ عِذَابٌ"
second: "لَا قِصَارٌ تُرَى وَلَا هُنَّ رُوقُ"
vocabulary:
  - term: "ثَنَايَا"
    text: "الأسنان الأربع في مقدّم الفم."
  - term: "مُفَلَّجَاتٌ"
    text: "بينها فُرَج يسيرة، وكانوا يستحسنونها: «وفَلَجُ الأَسنان: تباعُدٌ بَيْنَهَا ... وثَغْرٌ مُفَلَّجٌ» [@lisan، ج2 ص346]."
  - term: "رُوقُ"
    text: "طوال مشرفة: «الرَّوَقُ طُولُ الأَسنان وإِشْرافُ العُلْيا عَلَى السُّفْلى» [@lisan، ج10 ص135]."
