explained: false
first: فَلَا وَأَلَتْ تِلْكَ النُّفُوسُ وَلَا أَتَتْ
second: عَلَى رَوْضَةِ الأَجْدَادِ وَهْيَ جَمِيعُ
vocabulary:
- term: وَأَلَتْ
  text: 'قال ابن السِّكِّيت: «فلا وألت: لا نجت، والمنجى والموئل واحد» [@diwan-urwa، ص71].'
- term: رَوْضَةِ الأَجْدَادِ
  text: '«والأجداد: بلد لبني مرة وأشجع وفزارة» [@diwan-urwa، ص71].'
- term: وَهْيَ جَمِيعُ
  text: وهي مجتمعة؛ يدعو على النفوس التي تخاف هذا الخوف ألا تنجو ولا ترجع إلى ديارها سالمة.
sources:
- source: diwan-urwa
  loc: ص71
  url: https://archive.org/details/4091pdf/page/n76/mode/1up
status: review
