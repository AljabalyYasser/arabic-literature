first: لَعَمْرِي لَئِنْ عَشَّرْتُ مِنْ خَشْيَةِ الرَّدَى
second: نُهَاقَ الحَمِيرِ إِنَّنِي لَجَزُوعُ
vocabulary:
- term: عَشَّرْتُ
  text: 'نهقت عشر مرات. قال المَيْدانيّ: «التعشير: نهيقَ الحمار عشرةَ أصواتٍ في طلقَ واحد»، «وذلك أنهم كانوا إذا خافوا من وَبَاء بلدٍ عَشَّروا تعشير الحمير قبل أن يدخلوه، وكانوا يزعمون أن ذلك ينفعهم» [@maydani، ج2 ص42].'
- term: الرَّدَى
  text: الهلاك.
