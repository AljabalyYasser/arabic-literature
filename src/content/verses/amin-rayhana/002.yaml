explained: false
first: يُنَادِي مِنْ بَرَاقِشَ أَوْ مَعِينٍ
second: فَأَسْمَعَ وَاتْلَأَبَّ بِنَا مَلِيعُ
vocabulary:
- term: بَرَاقِشَ أَوْ مَعِينٍ
  text: 'حصنان باليمن [@asmaiyyat، ص172، الحاشية]، وعند البغدادي: «بلدتان كانتا متقابلتين باليمن» [@khizana، ج8 ص180].'
- term: اتْلَأَبَّ
  text: استقام واستوى [@asmaiyyat، ص172، الحاشية].
- term: مَلِيعُ
  text: 'أرض واسعة، «وقيل: التي لا نبات فيها»؛ وفي هذا البيت «يجوز أن يكون المليع هاهنا الفلاة، وأن يكون مليع موضعا بعينه» [@lisan، ج8 ص342].'
