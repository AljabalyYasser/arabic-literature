explained: false
first: رَبَاعِيَةٌ وَقَارِحُهَا وَجَحْشٌ
second: وَهَادِيَةٌ وَتَالِيَةٌ زَمُوعُ
vocabulary:
- term: رَبَاعِيَةٌ
  text: أتان «أسقطت رباعيتها عند تمام الرابعة من سنها» [@asmaiyyat، ص174، الحاشية].
- term: قَارِحُهَا
  text: فحلها، والقارح «الذي انتهت أسنانه، وذلك عند تمام الخامسة» [@asmaiyyat، ص174، الحاشية].
- term: هَادِيَةٌ وَتَالِيَةٌ
  text: 'الهادية: المتقدّمة، والتالية: الأخيرة [@asmaiyyat، ص174، الحاشية].'
- term: زَمُوعُ
  text: 'نشيطة سريعة [@asmaiyyat، ص174، الحاشية]؛ «وقيل: الزموع من الأرانب النشيطة السريعة» [@lisan، ج8 ص143].'
