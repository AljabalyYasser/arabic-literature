first: "كَأَنَّ عَلَى عَوَارِضِهِنَّ رَاحًا"
second: "يُفَضُّ عَلَيْهِ رُمَّانٌ يَنِيعُ"
meaning: "كأن على أسنانهن خمرًا يُكسر عليها رمّان ناضج فيسيل ماؤه فيها، أي إن ريق أفواههن طيب الطعم والرائحة كخمر ممزوجة بعصير الرمان. وفسّر البَغْداديّ مفرداته فقال: «والعارض: الناب والضرس الذي يليه. والراح: الخمر. وينيع: يانع أي: بالغ» [@khizana، ج8 ص185]. ولم يزد الشرّاح على المفردات، فبيان المعنى قراءتنا: لا يصف هنا لون الأسنان، فقد وصفه في البيت السابق، بل يصف طعم ما عليها، وهو الريق. وطعم الريق لا يعرفه إلا من ذاقه، فوصفُه ادّعاءٌ أنه قبّلهن في أفواههن فوجد ريقهن كالخمر بعصير الرمان: فيه نشوة الخمر وحلاوة الرمان. فالمعنى بلغة اليوم: إذا قبّلت إحداهن وجدت فمها حلوًا مسكرًا، كأنه خمر عُصر فيها رمان ناضج."
vocabulary:
  - term: "عَوَارِضِهِنَّ"
    text: "أسنانهن التي تبدو عند الضحك. قال البَغْداديّ: «والعارض: الناب والضرس الذي يليه» [@khizana، ج8 ص185]. وفي اللسان: «العوارض: الثنايا سميت عوارض لأنها في عرض الفم»، وقيل: «ما ولي الشدقين من الأسنان» [@lisan، ج7 ص180]. ويقول محققا الأَصْمَعِيّات: «العوارض: جمع عارض، وهو من الفم ما يبدو منه عند الضحك» [@asmaiyyat، ص173، الحاشية]."
  - term: "رَاحًا"
    text: "خمرًا: «والراح: الخمر» [@khizana، ج8 ص185]."
  - term: "يُفَضُّ"
    text: "يُكسر ويُفرَّق حَبّه فيسيل ماؤه."
  - term: "رُمَّانٌ"
    text: "ثمر معروف، حبّه أحمر كثير الماء، حلو أو مائل إلى الحموضة."
  - term: "يَنِيعُ"
    text: "ناضج: «يانع أي: بالغ» [@khizana، ج8 ص185]. وفي اللسان: «واليانع مثل النضيج والناضج» [@lisan، ج8 ص415]."
syntax:
  - "«كَأَنَّ عَلَى عَوَارِضِهِنَّ رَاحًا»: «كأنّ» حرف تشبيه ونصب، و«على عوارضهنّ» جار ومجرور في محل رفع خبر «كأنّ» مقدم، و«راحًا» اسمها مؤخر منصوب."
  - "«يُفَضُّ عَلَيْهِ رُمَّانٌ يَنِيعُ»: «يُفَضّ» فعل مضارع مبني للمجهول، و«عليه» متعلق به، و«رمّانٌ» نائب فاعل، و«ينيعُ» نعت له، والجملة في محل نصب صفة لـ«راحًا». والضمير في «عليه» للراح، وذكّره حملًا على معنى الشراب. وهذه قراءتنا."
morphology:
  - "«عَوَارِض» جمع «عارِض» على «فَواعِل»."
  - "«يُفَضُّ» مضارع «فُضَّ» المبني للمجهول من المضعّف «فَضَّ»، وأُدغمت عينه في لامه."
  - "«رُمَّان» على «فُعّال»."
  - "«يَنِيع» على «فَعِيل» بمعنى «فاعِل»، أي «يانِع»، ويقول محققا الأَصْمَعِيّات: «الينيع: كاليانع، مثل النضيج والناضج» [@asmaiyyat، ص173، الحاشية]."
rhetoric:
  thesis: "من لون الأسنان (8) إلى طعم الفم: هنا لا يرى بل يذوق. فالغزل يقترب خطوة خطوة: النظر إلى العيون والشعر (7)، ثم الضحك (8)، ثم الفم (9)."
  devices:
    - title: "التشبيه في «كَأَنَّ عَلَى عَوَارِضِهِنَّ رَاحًا»"
      text: "شبّه الريق على الأسنان بالخمر، ووجه الشبه الطعم والرائحة والنشوة، وهي تُذاق وتُشمّ. ثم زاد في المشبه به «يُفَضُّ عَلَيْهِ رُمَّانٌ يَنِيعُ»، فجعل الخمر ممزوجة بعصير الرمان، فاجتمع فيها الإسكار والحلاوة. ووجه الشبه هنا محسوس، فهو من الضرب الذي يكون عند عبد القاهر الجُرْجانيّ «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "الكناية عن التقبيل"
      text: "لم يقل إنه قبّلهن، بل وصف طعم أفواههن، ولا يعرف ذلك إلا من ذاقه. فذكرُ الطعم كناية عن التقبيل. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. وهذه قراءتنا."
  connection: "ثم يصف طيب إحداهن وترفها: «تَرَاهَا الدَّهْرَ مُقْتِرَةً كِبَاءً / وَتَقْدَحُ صَحْفَةً فِيهَا نَقِيعُ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "كَأَنْنَ عَلَى / عَوَارِضِهِنْ / نَ رَاحَنْ = مفاعلَتن / مفاعلَتن / فعولن — يُفَضْضُ عَلَيْ / هِ رُمْمَانُنْ / يَنِيعُو = مفاعلَتن / مفاعلْتن / فعولن"
  note: "سلمت تفعيلتا الحشو في الصدر، ودخل العَصْبُ الثانية من العجز، والعصب «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، فصارت «مفاعلْتن». والعروض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها «القطف، وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وأُشبعت ضمة العين في القافية «ينيعُ» فنُطقت «ينيعو»."
context: "رابع أبيات الغزل بالأبكار (6–11)، وهو في رواية ابن الأعرابي بلفظه وفي موضعه [@khizana، ج8 ص184]. وبه يبلغ الغزل أقرب ما يبلغه: الفم وطعمه، ثم يعود في البيتين التاليين إلى الطيب والثياب."
