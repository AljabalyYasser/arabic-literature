explained: false
first: وَرُبَّ مُحَرِّشٍ فِي جَنْبِ سَلْمَى
second: يُعَلُّ بِعَيْبِهَا عِنْدِي شَفِيعُ
vocabulary:
- term: مُحَرِّشٍ
  text: 'مُغرٍ يُفسد بين الناس، من «التحريش: الإغراء بين القوم» [@khizana، ج8 ص185].'
- term: يُعَلُّ بِعَيْبِهَا
  text: 'يكرّر عيبها مرة بعد مرة [@asmaiyyat، ص173، الحاشية]، من العَلَل، وهو «الشربة الثانية» [@lisan، ج11 ص467]. وفي رواية ابن الأعرابي: «بعينها» [@khizana، ج8 ص184].'
- term: شَفِيعُ
  text: لا يزيده عيب العاذل لها إلا حبًّا، «فكأن عاذلها شفيع لها عنده» [@asmaiyyat، ص173، الحاشية].
