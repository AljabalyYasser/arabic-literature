second: كَمَا يَمْشِي بِأَقْدُحِهِ الْخَلِيعُ
vocabulary:
- term: أَقْدُحِهِ
  text: سهامه التي يُضرب بها في الميسر، جمع قِدح [@asmaiyyat، ص175، الحاشية].
- term: الْخَلِيعُ
  text: «المخلوع المقمور ماله» [@lisan، ج8 ص77]، أي الذي خسر ماله في الميسر.
