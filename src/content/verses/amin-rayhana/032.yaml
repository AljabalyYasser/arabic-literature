first: تَرَى جِيَفَ الْمَطِيِّ بِحَافَتَيْهِ
second: كَأَنَّ عِظَامَهَا الرَّخَمُ الْوُقُوعُ
vocabulary:
- term: جِيَفَ الْمَطِيِّ
  text: جثث الإبل الميتة.
- term: بِحَافَتَيْهِ
  text: بجانبيه.
- term: الرَّخَمُ
  text: 'طير، و«الرخمة: طائر أبقع على شكل النسر خلقة إلا أنه مبقع بسواد وبياض» [@lisan، ج12 ص235].'
- term: الْوُقُوعُ
  text: النازلة على الأرض، الواحد واقع.
