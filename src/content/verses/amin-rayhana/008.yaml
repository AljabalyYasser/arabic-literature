first: "إِذَا يَضْحَكْنَ أَوْ يَبْسِمْنَ يَوْمًا"
second: "تَرَى بَرَدًا أَلَحَّ بِهِ الصَّقِيعُ"
meaning: "إذا ضحكت هؤلاء الأبكار أو ابتسمن رأيت أسنانهن كحبّ البَرَد الذي دام عليه الجليد: بيضاء لامعة باردة. وفسّر البَغْداديّ مفرداته فقال: «والبرد بفتحتين: حب الغمام. والصقيع: الجليد» [@khizana، ج8 ص185]، والبَرَد حبات الثلج الصغيرة التي تنزل مع المطر. ولم يزد الشرّاح على المفردات، فبيان المعنى قراءتنا: شبّه الأسنان بالبَرَد في بياضه وصفائه واستواء حبّاته، ثم زاد «أَلَحَّ بِهِ الصَّقِيعُ»، أي أقام عليه الجليد ودام، فبقي على بياضه وبرده لم يذب. ونرى أنه يريد بالبرودة أيضًا برد الفم ونداوة الريق، فهو يصف في البيت التالي طعم ما على أسنانهن. فالمعنى بلغة اليوم: أسنانهن حين يضحكن بيضاء صافية متناسقة، وأفواههن باردة نديّة."
vocabulary:
  - term: "يَبْسِمْنَ"
    text: "يبتسمن."
  - term: "بَرَدًا"
    text: "«حب الغمام» [@khizana، ج8 ص185]، أي حبات الثلج التي تسقط مع المطر، وأراد بها أسنانهن."
  - term: "أَلَحَّ بِهِ"
    text: "أقام عليه ودام. يقال: «وأَلَحَّ السحابُ بِالْمَطَرِ: دَامَ»، و«وأَلح السحابُ بِالْمَكَانِ: أَقام بِهِ» [@lisan، ج2 ص577]."
  - term: "الصَّقِيعُ"
    text: "«الجليد» [@khizana، ج8 ص185]. وفي اللسان: «والصقِيعُ: الَّذِي يَسْقُطُ مِنَ السَّمَاءِ بِاللَّيْلِ شَبيهٌ بِالثَّلْجِ» [@lisan، ج8 ص201]."
syntax:
  - "«إِذَا»: ظرف لما يستقبل من الزمان متضمن معنى الشرط، و«يَضْحَكْنَ» فعل مضارع مبني على السكون لاتصاله بنون النسوة، والنون فاعل، والجملة في محل جر بإضافة «إذا» إليها."
  - "«أَوْ يَبْسِمْنَ يَوْمًا»: معطوفة على «يضحكن»، و«يومًا» ظرف زمان متعلق بـ«يبسمن»."
  - "«تَرَى بَرَدًا»: جواب «إذا»، وفاعل «ترى» ضمير المخاطب، والخطاب لكل من يراهن، و«بردًا» مفعول به."
  - "«أَلَحَّ بِهِ الصَّقِيعُ»: فعل ماض، و«به» متعلق به، و«الصقيعُ» فاعل، والجملة في محل نصب صفة لـ«بردًا»."
morphology:
  - "«يَضْحَكْنَ» مضارع «ضَحِكَ» على «يَفْعَل»، و«يَبْسِمْنَ» مضارع «بَسَمَ» على «يَفْعِل»، والنون فيهما نون النسوة."
  - "«بَرَد» على «فَعَل» بفتحتين، كما ضبطه البَغْداديّ [@khizana، ج8 ص185]."
  - "«أَلَحَّ» ماضٍ على «أَفْعَلَ» من المضعّف «لَحَّ»، وأُدغمت عينه في لامه."
  - "«صَقِيع» على «فَعِيل»."
rhetoric:
  thesis: "من العيون والشعر (7) إلى الأسنان: لا يراها إلا حين يضحكن، أي حين يكون قريبًا منهن يضاحكنه. ثم يصف في البيت التالي طعم أفواههن."
  devices:
    - title: "الاستعارة في «تَرَى بَرَدًا»"
      text: "لم يقل «ترى أسنانًا كالبرد»، بل حذف الأسنان وذكر البرد مكانها. وهذه الاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. والجامع بين الأسنان والبرد البياض والصفاء واستواء الحبّات."
    - title: "الزيادة في «أَلَحَّ بِهِ الصَّقِيعُ»"
      text: "لم يكتف بالبرد، بل جعل الجليد مقيمًا عليه، فأضاف إلى البياض البرودة والدوام: برد لا يذوب. وهذه قراءتنا."
    - title: "«إِذَا يَضْحَكْنَ أَوْ يَبْسِمْنَ»"
      text: "قرن رؤية الأسنان بضحكهن، فالأسنان لا تُرى إلا في الضحك، وفي ذلك أنهن يضحكن معه ويأنسن به. وهذه قراءتنا."
  connection: "ثم ينتقل من لون الأسنان إلى طعم الفم: «كَأَنَّ عَلَى عَوَارِضِهِنَّ رَاحًا / يُفَضُّ عَلَيْهِ رُمَّانٌ يَنِيعُ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "إِذَا يَضْحَكْ / نَ أَوْ يَبْسِمْ / نَ يَوْمَنْ = مفاعلْتن / مفاعلْتن / فعولن — تَرَى بَرَدَنْ / أَلَحْحَ بِهِصْ / صَقِيعُو = مفاعلَتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ تفعيلتي الحشو في الصدر، والعصب «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، فصارتا «مفاعلْتن». وسلمت تفعيلتا العجز في الحشو. والعروض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها «القطف، وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وأُشبعت ضمة العين في القافية «الصقيعُ» فنُطقت «الصقيعو»."
context: "ثالث أبيات الغزل بالأبكار (6–11). وهو في رواية ابن الأعرابي «بدا بردٌ» مكان «ترى بردًا» [@khizana، ج8 ص184]، وفسّر البَغْداديّ مفرداته ولم يزد [@khizana، ج8 ص185]."
variants:
  - reading: "إِذَا يَضْحَكْنَ أَوْ يَبْسِمْنَ يَوْمًا / بَدَا بَرَدٌ أَلَحَّ بِهِ الصَّقِيعُ"
    status: "رواية ابن الأعرابي فيما يثبته البَغْداديّ"
    note: "«بدا بردٌ» [@khizana، ج8 ص184]، أي ظهر بَرَد، فالبرد فاعل. وفي الأَصْمَعِيّات «ترى بردًا» بالخطاب، والمعنى واحد."
