first: "وَصِبْغُ ثِيَابِهَا فِي زَعْفَرَانٍ"
second: "بِجُدَّتِهَا كَمَا احْمَرَّ النَّجِيعُ"
meaning: "وثيابها مصبوغة بالزعفران، وفي خطوطها حمرة كحمرة الدم. وقال البَغْداديّ في الأبكار، وهو يشرح «فِي أَسِرَّتِهَا الرُّدُوعُ» في البيت 6: «يريد أنهن يصبغن ثيابهن بالزعفران»، وقال في هذا البيت: «والنجيع: الدم» [@khizana، ج8 ص185]. ويفسّر محققا الأَصْمَعِيّات «جُدّتها» بأنها «الخطة، وهي الطريقة في الثوب تخالف لونه»، ويذكران أنها بكسر الجيم «الحداثة» [@asmaiyyat، ص174، الحاشية]. فعلى الضم: في الخطوط المصبوغة بالزعفران من ثوبها حمرة كالدم، وعلى الكسر: ثوبها حين يكون جديدًا أحمر كالدم، قبل أن يبهت صبغه. والزعفران نبات يُصبغ به فيعطي لونًا أصفر يضرب إلى الحمرة، وهو غالي الثمن، فثيابها ثياب امرأة مترفة. وهذه قراءتنا. فالمعنى بلغة اليوم: ثيابها غالية مصبوغة بالزعفران، في خطوطها حمرة قانية كالدم الطري."
vocabulary:
  - term: "وَصِبْغُ"
    text: "ما يُصبغ به، والمراد لون صبغها."
  - term: "زَعْفَرَانٍ"
    text: "نبات يُستخرج منه صبغ أصفر يضرب إلى الحمرة، ويُتطيّب به."
  - term: "بِجُدَّتِهَا"
    text: "يقول محققا الأَصْمَعِيّات: «الجدة، بضم الجيم: الخطة، وهي الطريقة في الثوب تخالف لونه؛ وبكسر الجيم: الحداثة» [@asmaiyyat، ص174، الحاشية]. وفي اللسان: «وجُدَّةُ كُلِّ شَيْءٍ: طَرِيقَتُهُ» [@lisan، ج3 ص108]."
  - term: "النَّجِيعُ"
    text: "«والنجيع: الدم» [@khizana، ج8 ص185]. وفي اللسان: «والنَّجِيعُ: الدمُ، وَقِيلَ: هُوَ دَمُ الجَوفِ خاصَّة، وَقِيلَ: هُوَ الطَّرِيُّ مِنْهُ» [@lisan، ج8 ص348]."
syntax:
  - "«وَصِبْغُ ثِيَابِهَا»: الواو عاطفة، و«صبغُ» مبتدأ مرفوع، وهو مضاف و«ثيابِها» مضاف إليه، والضمير للمرأة التي في «تراها» في البيت السابق."
  - "«فِي زَعْفَرَانٍ»: جار ومجرور متعلق بمحذوف خبر المبتدأ، أي صبغها كائن من زعفران."
  - "«بِجُدَّتِهَا»: جار ومجرور متعلق بمحذوف حال، والضمير «ها» للثياب، أي في خطوط الثياب."
  - "«كَمَا احْمَرَّ النَّجِيعُ»: الكاف حرف جر للتشبيه، و«ما» مصدرية، و«احمرّ النجيعُ» فعل وفاعل، والمصدر المؤول «كاحمرار النجيع» مجرور بالكاف، والجار والمجرور متعلق بمحذوف، والتقدير: يحمرّ بجُدّتها احمرارًا كاحمرار النجيع. وهذه قراءتنا."
morphology:
  - "«صِبْغ» على «فِعْل» بمعنى المفعول، أي ما يُصبغ به."
  - "«جُدَّة» على «فُعْلة» من المضعّف «جَدَّ»، وجمعها «جُدَد»، وفي اللسان: «وَالْجَمْعُ جُدَدٌ» [@lisan، ج3 ص108]."
  - "«احْمَرَّ» على «افْعَلَّ»، وهو بناء للألوان والعيوب."
  - "«نَجِيع» على «فَعِيل»."
rhetoric:
  thesis: "آخر صفات الأبكار ثيابهن: مصبوغة بالزعفران. وبالزعفران بدأ الغزل في البيت 6 «فِي أَسِرَّتِهَا الرُّدُوعُ»، والرَّدْع أثر الزعفران، فالغزل يبدأ بالزعفران في خطوط الكف، وينتهي به في خطوط الثوب. وهذه قراءتنا."
  devices:
    - title: "التشبيه في «كَمَا احْمَرَّ النَّجِيعُ»"
      text: "شبّه حمرة الصبغ بحمرة الدم، ووجه الشبه اللون، وهو يُرى ولا يحتاج إلى تأويل. وتشبيه ثوب امرأة بالدم، عند فارس يقول بعد قليل إن الكتائب والأسنّة أشابت رأسه (21–25)، يجمع الغزل والحرب في صورة واحدة. وهذه قراءتنا."
    - title: "الكناية في «وَصِبْغُ ثِيَابِهَا فِي زَعْفَرَانٍ»"
      text: "لم يقل إنها غنية مترفة، بل ذكر ما يلزم ذلك: ثياب مصبوغة بالزعفران الغالي. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. وتطبيقه على البيت قراءتنا."
  connection: "ثم ينتهي الغزل بعجب أُمامة من شيبه: «وَقَدْ عَجِبَتْ أُمَامَةُ أَنْ رَأَتْنِي / تَفَرَّعَ لِمَّتِي شَيْبٌ فَظِيعُ»، وقال البَغْداديّ بعده: «وهذا آخر الغزل» [@khizana، ج8 ص184]."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "وَصِبْغُ ثِيَا / بِهَا فِي زَعْ / فَرَانِنْ = مفاعلَتن / مفاعلْتن / فعولن — بِجُدْدَتِهَا / كَمَحْ مَرْرَنْ / نَجِيعُو = مفاعلَتن / مفاعلْتن / فعولن"
  note: "دخل العَصْبُ الثانية من الصدر والثانية من العجز، والعصب «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، فصارتا «مفاعلْتن». والعروض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها «القطف، وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وتسقط همزة الوصل في «احْمَرَّ» في درج الكلام، فتتصل ميم «كما» بالحاء الساكنة، وأُشبعت ضمة العين في القافية «النجيعُ» فنُطقت «النجيعو»."
context: "آخر أبيات الغزل بالأبكار (6–11)، وبعده تعجب أُمامة من شيبه في البيت 12. وهو في رواية ابن الأعرابي بلفظه وفي موضعه [@khizana، ج8 ص184]."
