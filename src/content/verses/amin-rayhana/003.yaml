first: وَقَدْ جَاوَزْنَ مِنْ غُمْدَانَ دَارًا
second: لِأَبْوَالِ الْبِغَالِ بِهَا وَقِيعُ
vocabulary:
- term: جَاوَزْنَ
  text: يعني الإبل التي يركبونها، «ولم يجر لها ذكر» [@asmaiyyat، ص173، الحاشية].
- term: غُمْدَانَ
  text: قصر مشهور باليمن [@asmaiyyat، ص173، الحاشية].
- term: وَقِيعُ
  text: 'مَناقع يجتمع فيها الماء: «والوقيع: مناقع الماء» [@lisan، ج8 ص405].'
