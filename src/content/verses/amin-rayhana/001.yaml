explained: false
first: أَمِنْ رَيْحَانَةَ الدَّاعِي السَّمِيعُ
second: يُؤَرِّقُنِي وَأَصْحَابِي هُجُوعُ
vocabulary:
- term: رَيْحَانَةَ
  text: 'اسم امرأة؛ قيل: امرأته المطلّقة، وقيل: أخته أم دُرَيد بن الصِّمّة [@asmaiyyat، ص172، الحاشية].'
- term: الدَّاعِي السَّمِيعُ
  text: 'المنادي المُسمِع صوتَه، فـ«السميع» هنا بمعنى المُسمِع: «ويقال: رجل سميع، أي مسمع» [@kamil، ج1 ص162].'
- term: يُؤَرِّقُنِي
  text: يُسهرني ويمنعني النوم.
- term: هُجُوعُ
  text: نيام، جمع هاجع.
