explained: false
first: وَأَرْضٍ قَدْ قَطَعْتُ بِهَا الْهَوَاهِي
second: مِنَ الْجِنَّانِ سَرْبَخُهَا مَلِيعُ
vocabulary:
- term: الْهَوَاهِي
  text: 'أصوات الجن، في الشنقيطية: «ضوضاة الجن، الواحد هوهاة» [@asmaiyyat، ص176، الحاشية]. وفي اللسان: «القواهي» [@lisan، ج3 ص24].'
- term: الْجِنَّانِ
  text: الجنّ.
- term: سَرْبَخُهَا
  text: '«السربخ: الأرض الواسعة؛ وقيل: هي الأرض البعيدة؛ وقيل: هي المضلة التي لا يهتدى فيها لطريق» [@lisan، ج3 ص24].'
- term: مَلِيعُ
  text: واسع مستوٍ [@lisan، ج8 ص342].
