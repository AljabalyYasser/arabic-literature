explained: false
first: كَأَنَّ الْإِثْمِدَ الْحَارِيَّ فِيهَا
second: يُسَفُّ بِحَيْثُ تَبْتَدِرُ الدُّمُوعُ
vocabulary:
- term: الْإِثْمِدَ
  text: حَجَر يُتّخذ منه الكحل.
- term: الْحَارِيَّ
  text: منسوب إلى الحِيرة على غير قياس [@asmaiyyat، ص173، الحاشية].
- term: يُسَفُّ
  text: يُذَرّ [@khizana، ج8 ص185]، من «أسففت الوشم»، وهو «أن يغرز الجلد بإبرة ثم تحشى المغارز كحلا» [@lisan، ج9 ص153].
- term: تَبْتَدِرُ الدُّمُوعُ
  text: تتسابق الدموع في السيلان.
