explained: false
first: فَأَرْسَلْنَا رَبِيئَتَنَا فَأَوْفَى
second: فَقَالَ أَلَا أَلَا خَمْسٌ رُتُوعُ
vocabulary:
- term: رَبِيئَتَنَا
  text: طليعتنا [@asmaiyyat، ص174، الحاشية]، الذي يرقب لنا من مكان عالٍ.
- term: فَأَوْفَى
  text: علا وأشرف [@asmaiyyat، ص174، الحاشية].
- term: رُتُوعُ
  text: ترعى ما شاءت، جمع راتع، «والرتع لا يكون إلا في الخصب والسعة» [@asmaiyyat، ص174، الحاشية].
