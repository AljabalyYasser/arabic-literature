first: دَنَتْ وَاسْتَأْخَرَ الْأَوْغَالُ عَنْهَا
second: وَخُلِّيَ بَيْنَهُمْ إِلَّا الْوَرِيعُ
vocabulary:
- term: الْأَوْغَالُ
  text: الضعفاء [@asmaiyyat، ص175، الحاشية]، جمع وَغْل، «وهو النذل من الرجال» [@khizana، ج8 ص186].
- term: الْوَرِيعُ
  text: 'الكافّ عن القتال [@asmaiyyat، ص175، الحاشية]؛ وقال البغدادي: «الصغير الضعيف الذي لا غناء عنده» [@khizana، ج8 ص186].'
