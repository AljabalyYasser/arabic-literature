explained: false
first: وَسَوْقُ كَتِيبَةٍ دَلَفَتْ لِأُخْرَى
second: كَأَنَّ زُهَاءَهَا رَأْسٌ صَلِيعُ
vocabulary:
- term: كَتِيبَةٍ
  text: جماعة من الجيش.
- term: دَلَفَتْ
  text: مشت رويدًا متقاربة الخطو، «وذلك لكثرة الجيش» [@asmaiyyat، ص175، الحاشية].
- term: زُهَاءَهَا
  text: 'قدرها وعددها؛ «وزهاء الشيء وزهاؤه: قدره» [@lisan، ج14 ص363].'
- term: رَأْسٌ صَلِيعُ
  text: '«جبل لا نبت عليه»، فيما نقل المحققان عن الشنقيطي [@asmaiyyat، ص175، الحاشية]؛ وقال البغدادي: «والرأس الصليع: الذي انحسر شعر مقدمه» [@khizana، ج8 ص186].'
