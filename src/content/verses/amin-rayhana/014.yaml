first: وَأَحْمِرَةُ الْهُجَيْرَةِ كُلَّ يَوْمٍ
second: يَضُوعُ جِحَاشَهُنَّ بِمَا يَضُوعُ
vocabulary:
- term: أَحْمِرَةُ
  text: جمع حمار، يريد حُمُر الوحش.
- term: الْهُجَيْرَةِ
  text: موضع باليمن [@asmaiyyat، ص174، الحاشية].
- term: يَضُوعُ
  text: 'يُروّع ويُفزع [@asmaiyyat، ص174، الحاشية]؛ «ضاعه يضوعه ضوعا وضوعه، كلاهما: حركه وراعه» [@lisan، ج8 ص228].'
- term: جِحَاشَهُنَّ
  text: أولادهن، الواحد جَحش.
