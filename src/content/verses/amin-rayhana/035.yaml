explained: false
first: سَدِيسٌ نَضَّجَتْهُ بَعْدَ حَمْلٍ
second: تَحَرَّى فِي الْحَنِينِ وَتَسْتَلِيعُ
vocabulary:
- term: سَدِيسٌ
  text: ناقة دخلت في الثامنة، «وذلك إذا ألقى السن التي بعد الرباعية» [@asmaiyyat، ص176، الحاشية].
- term: نَضَّجَتْهُ
  text: 'زادت في حمله على وقت الولادة؛ قال الأَصْمَعِيّ: «إذا حملت الناقة فجازت السنة من يوم لقحت، قيل: أدرجت ونضجت» [@lisan، ج2 ص379].'
- term: تَحَرَّى
  text: تتحرّى، أي تقصد وتجتهد [@asmaiyyat، ص176، الحاشية].
- term: تَسْتَلِيعُ
  text: من اللوعة، «وهي حرقة القلب من الحزن ونحوه. وهذا الفعل لم يذكر في المعاجم» [@asmaiyyat، ص176، الحاشية].
