explained: false
first: لَعَمْرُكَ مَا ثَلَاثٌ حَائِمَاتٌ
second: عَلَى رُبَعٍ يَرُعْنَ وَمَا يَرِيعُ
vocabulary:
- term: ثَلَاثٌ حَائِمَاتٌ
  text: ثلاث نوق طائفات حوله [@asmaiyyat، ص176، الحاشية].
- term: رُبَعٍ
  text: «الفصيل الذي ينتج في الربيع، وهو أول النتاج» [@asmaiyyat، ص176، الحاشية].
- term: يَرُعْنَ وَمَا يَرِيعُ
  text: 'يرجعن إليه ولا يرجع، «أي لهلاكه» [@asmaiyyat، ص176، الحاشية]؛ يقال: «راع يريع وراه يريه أي رجع» [@lisan، ج8 ص138].'
