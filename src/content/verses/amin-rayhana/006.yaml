first: "وَأَبْكَارٍ لَهَوْتُ بِهِنَّ حِينًا"
second: "نَوَاعِمَ فِي أَسِرَّتِهَا الرُّدُوعُ"
meaning: "ورُبّ فتيات أبكار لهوت بهن زمنًا، ناعمات مترفات، في خطوط أكفّهن آثار الزعفران والطيب. قال البَغْداديّ في شرح رواية ابن الأَعْرابيّ: «والأسرة: جمع سرارة بالكسر وهو الخطوط في الكف. والردوع: جمع ردع يقال: به ردع من زعفران أو دم أي: لطخ وأثر. يريد أنهن يصبغن ثيابهن بالزعفران» [@khizana، ج8 ص185]. واللهو بالمرأة التسلي بها والاستمتاع بصحبتها، ويقال «والْتَهَى بامرأَة، فَهِيَ لَهْوَته»، و«قَدْ يُكَنَّى باللَّهْوِ عَنِ الْجِمَاعِ» [@lisan، ج15 ص259]. ولم يقف الشرّاح عند معنى «لهوت بهن»، فبيانه قراءتنا: يفخر عَمْرو بأيام شبابه حين كان يغازل الفتيات العذارى ويلاعبهن ويستمتع بقربهن، وكلهن مترفات متطيّبات. ولم يزد في البيت على كلمة «لهوت» ما يصرّح بالجماع، والبيت التالي يجعله يمشي حولهن ويُعجب بعيونهن التي تبدو من النقاب وبشعورهن، فلهوه بالأبكار هنا مغازلة ونظر وقرب، وإن كانت الكلمة تحتمل ما وراء ذلك."
vocabulary:
  - term: "وَأَبْكَارٍ"
    text: "جمع بِكْر، وهي العذراء التي لم تتزوج."
  - term: "لَهَوْتُ بِهِنَّ"
    text: "تسلّيت بهن واستمتعت بصحبتهن ومغازلتهن. يقال: «والْتَهَى بامرأَة، فَهِيَ لَهْوَته»، و«قَدْ يُكَنَّى باللَّهْوِ عَنِ الْجِمَاعِ» [@lisan، ج15 ص259]."
  - term: "حِينًا"
    text: "زمنًا، والمراد أيام الشباب."
  - term: "نَوَاعِمَ"
    text: "جمع ناعمة، وهي اللينة البدن التي تعيش في النعمة والترف."
  - term: "أَسِرَّتِهَا"
    text: "خطوط باطن الكف. في اللسان: «والسُّرُّ والسِّرُّ والسِّرَرُ والسِّرارُ، كُلُّهُ: خَطُّ بَطْنِ الْكَفِّ وَالْوَجْهِ وَالْجَبْهَةِ ... وَالْجَمْعُ أَسِرَّةٌ وأَسْرارٌ» [@lisan، ج4 ص359]. ويفسرها محققا الأَصْمَعِيّات بأنها جمع «سِرارة»، وهي الخطوط في باطن الكف [@asmaiyyat، ص173، الحاشية]."
  - term: "الرُّدُوعُ"
    text: "جمع رَدْع، وهو «اللطْخ بِالزَّعْفَرَانِ»، وقيل: «أَثَر الخَلُوق والطِّيب فِي الْجَسَدِ» [@lisan، ج8 ص121]. والخَلُوق ضرب من الطيب أكثره زعفران."
syntax:
  - "«وَأَبْكَارٍ»: الواو واو رُبّ، و«أبكارٍ» مجرور بـ«رُبّ» المحذوفة. وقال البَغْداديّ: «وقوله: أمشي حولها هو جواب رب المقدرة في وأبكار» [@khizana، ج8 ص185]، أي إن الفعل الذي يتم به معنى «رُبّ» هو «أُمَشِّي» في البيت التالي: رُبّ أبكارٍ هذه صفتهن أمشي حولهن. فالمعنى يمتد من هذا البيت إلى الذي بعده."
  - "«لَهَوْتُ بِهِنَّ»: فعل وفاعل، و«بهنّ» متعلق به، والجملة في محل جر صفة لـ«أبكار». و«حِينًا» ظرف زمان متعلق بـ«لهوت»."
  - "«نَوَاعِمَ»: صفة ثانية لـ«أبكار» مجرورة، وعلامة جرها الفتحة لأنها ممنوعة من الصرف على صيغة منتهى الجموع."
  - "«فِي أَسِرَّتِهَا الرُّدُوعُ»: «الردوعُ» مبتدأ مؤخر، و«في أسرّتها» جار ومجرور خبر مقدم، والجملة صفة ثالثة. والضمير «ها» مفرد مؤنث يعود على «الأبكار»، وجمع التكسير يجوز أن يعود عليه ضمير المفردة المؤنثة."
morphology:
  - "«أَبْكَار» جمع «بِكْر» على «أَفْعال»."
  - "«لَهَوْتُ» ماضٍ من «لَهَا يَلْهُو»، ناقص واوي."
  - "«نَوَاعِم» جمع «ناعِمة» على «فَواعِل»، من «النَّعْمة»."
  - "«أَسِرَّة» جمع «سِرار» على «أَفْعِلة» [@lisan، ج4 ص359]، و«رُدُوع» جمع «رَدْع» على «فُعُول»."
rhetoric:
  thesis: "بعد صاحبته التي يسميها سَلْمى (4–5) ينتقل إلى الكثرة: فتيات كثيرات لها بهن في شبابه. فالغزل هنا فخر بالشباب الذي سيقول بعد قليل إن الشيب علاه (12)."
  devices:
    - title: "الكناية في «لَهَوْتُ بِهِنَّ»"
      text: "لم يسمّ ما كان بينه وبينهن، بل قال «لهوت»، والكلمة تتسع للمغازلة والملاعبة، و«قد يكنى باللهو عن الجماع» [@lisan، ج15 ص259]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الكناية في «فِي أَسِرَّتِهَا الرُّدُوعُ»"
      text: "لم يقل إنهن مترفات، بل ذكر أثر الزعفران والطيب في خطوط أكفهن. فاليد التي يبقى الطيب في خطوطها يد لا تعمل، وصاحبتها مخدومة منعَّمة. وهذه قراءتنا."
    - title: "«حِينًا»"
      text: "قيّد اللهو بزمن مضى، فالبيت ذكرى لا حاضر. وبهذه الكلمة يستعد السامع لما يأتي في البيت 12: «وَقَدْ عَجِبَتْ أُمَامَةُ أَنْ رَأَتْنِي / تَفَرَّعَ لِمَّتِي شَيْبٌ فَظِيعُ». وهذه قراءتنا."
  connection: "ثم يصف لهوه بهن: «أُمَشِّي حَوْلَهَا وَأَطُوفُ فِيهَا / وَتُعْجِبُنِي الْمَحَاجِرُ وَالْفُرُوعُ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "وَأَبْكَارِنْ / لَهَوْتُ بِهِنْ / نَ حِينَنْ = مفاعلْتن / مفاعلَتن / فعولن — نَوَاعِمَ فِي / أَسِرْرَتِهَرْ / رُدُوعُو = مفاعلَتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ التفعيلة الأولى من الصدر، والعصب «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، فصارت «مفاعلْتن». وسلمت تفعيلتا العجز في الحشو. والعروض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها «القطف، وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وأُشبعت ضمة العين في القافية «الردوعُ» فنُطقت «الردوعو»."
context: "أول أبيات الغزل بالأبكار (6–11)، بعد بيتين في صاحبته التي يسميها سلمى (4–5). ويمتد المعنى إلى البيت التالي، كما يقول البَغْداديّ [@khizana، ج8 ص185]، ثم يصف ثغورهن وطيبهن وثيابهن المصبوغة بالزعفران (8–11)، ثم ينتهي الغزل بعجب أُمامة من شيبه في البيت 12، وقال البَغْداديّ بعده: «وهذا آخر الغزل» [@khizana، ج8 ص184]. وهو في رواية ابن الأعرابي بلفظه وفي موضعه [@khizana، ج8 ص184]. وعلى رواية إسْحاق المَوْصِليّ أن رَيْحانة امرأة طلّقها عمرو ثم «أخذ يشبب بها» [@khizana، ج8 ص182]، يكون هذا الغزل من تشبيبه، أي من ذكره النساء والتغزل بهن في أول القصيدة."
