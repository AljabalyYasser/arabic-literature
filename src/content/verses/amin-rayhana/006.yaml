explained: false
first: وَأَبْكَارٍ لَهَوْتُ بِهِنَّ حِينًا
second: نَوَاعِمَ فِي أَسِرَّتِهَا الرُّدُوعُ
vocabulary:
- term: أَبْكَارٍ
  text: عذارى، الواحدة بِكر.
- term: أَسِرَّتِهَا
  text: خطوط باطن كفّها، جمع «سِرارة» [@asmaiyyat، ص173، الحاشية] [@khizana، ج8 ص185].
- term: الرُّدُوعُ
  text: جمع رَدْع، وهو «أثر الخلوق والطيب في الجسد» [@lisan، ج8 ص121]؛ يريد «أنهن يصبغن ثيابهن بالزعفران» [@khizana، ج8 ص185].
