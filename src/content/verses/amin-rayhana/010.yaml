first: "تَرَاهَا الدَّهْرَ مُقْتِرَةً كِبَاءً"
second: "وَتَقْدَحُ صَحْفَةً فِيهَا نَقِيعُ"
meaning: "تراها طوال الدهر متبخّرة بالعود، وهي تغرف من صحفة فيها نقيع مبرَّد تشربه. فهي امرأة مترفة: يفوح من جسدها وثيابها دخان البخور، وشرابها يُبرَّد لها. وفسّر البَغْداديّ المفردات على رواية ابن الأعرابي «ومقدح صفحة» فقال: «ومقترة: اسم فاعل من القتار بضم القاف وهو هنا الدخنة. والكباء بالكسر والمد: العود. والمقدح بكسر الميم: المغرفة. والنقيع يبرد لها فتشربه» [@khizana، ج8 ص185]. والقُتار الدخان، والدُّخْنة البخور. والضمير المفرد في «تراها» لإحداهن، أو لكل واحدة من الأبكار، وهذه قراءتنا. فالمعنى بلغة اليوم: هي أبدًا معطّرة بدخان العود يشمّه من يقترب منها، ولا تخدم نفسها بل يُبرَّد لها شرابها فتغرف منه."
vocabulary:
  - term: "الدَّهْرَ"
    text: "أبدًا، طوال الزمن."
  - term: "مُقْتِرَةً"
    text: "متبخّرة: «وأقترت المرأة، فهي مقترة إذا تبخرت بالعود» [@lisan، ج5 ص72]. وقال البَغْداديّ: «اسم فاعل من القتار بضم القاف وهو هنا الدخنة» [@khizana، ج8 ص185]."
  - term: "كِبَاءً"
    text: "«والكباء بالكسر والمد: العود» [@khizana، ج8 ص185]، أي عود الطيب الذي يُحرق فيفوح دخانه."
  - term: "وَتَقْدَحُ"
    text: "تغرف. يقول محققا الأَصْمَعِيّات: «تقدح: تغرف ما في الصحفة أو القدر» [@asmaiyyat، ص173، الحاشية]."
  - term: "صَحْفَةً"
    text: "يقول المحققان: «والصحفة: شبه قصعة مسلنطحة عريضة، وهي تشبع الخمسة أو نحوهم» [@asmaiyyat، ص173، الحاشية]، والمسلنطحة المنبسطة."
  - term: "نَقِيعُ"
    text: "يقول المحققان: «ما ينقع في الماء» [@asmaiyyat، ص173، الحاشية]. وفي اللسان: «والنَّقُوعُ والنَّقِيعُ: شَرابٌ يُتَّخَذُ مِنْ زَبِيبٍ يُنْقَعُ فِي الْمَاءِ مِنْ غَيْرِ طَبْخٍ» [@lisan، ج8 ص361]، وقيل: «والنَّقِيعُ والنَّقِيعةُ: المَحْضُ مِنَ اللَّبَنِ يُبَرَّدُ» [@lisan، ج8 ص360]."
syntax:
  - "«تَرَاهَا الدَّهْرَ»: «ترى» فعل مضارع مرفوع بضمة مقدرة على الألف، وفاعله ضمير المخاطب، و«ها» مفعول به، و«الدهرَ» ظرف زمان منصوب متعلق بـ«ترى»، أي طوال الدهر."
  - "«مُقْتِرَةً كِبَاءً»: «مقترةً» حال من «ها»، لأن «ترى» هنا بصرية. و«كباءً» منصوب على نزع الخافض، أي مقترةً بكباءٍ. وهذه قراءتنا."
  - "«وَتَقْدَحُ صَحْفَةً»: الواو عاطفة، و«تقدح» فعل مضارع فاعله ضمير مستتر يعود على المرأة، و«صحفةً» مفعول به على تقدير: تقدح ما في صحفة، والجملة معطوفة على جملة «تراها»."
  - "«فِيهَا نَقِيعُ»: «فيها» جار ومجرور خبر مقدم، و«نقيعُ» مبتدأ مؤخر، والجملة في محل نصب صفة لـ«صحفة»."
morphology:
  - "«مُقْتِرَة» اسم فاعل من «أَقْتَرَ» على «أَفْعَلَ»، من «القُتار» [@khizana، ج8 ص185]."
  - "«كِبَاء» على «فِعال» بالكسر والمد، كما ضبطه البَغْداديّ [@khizana، ج8 ص185]."
  - "«تَقْدَح» مضارع «قَدَحَ» على «يَفْعَل»، و«صَحْفَة» على «فَعْلة»."
  - "«نَقِيع» على «فَعِيل» بمعنى «مَفْعول»، أي المنقوع."
rhetoric:
  thesis: "ينتقل من الجمع إلى المفرد: «تراها»، فيصف واحدة منهن في ترفها: الطيب الدائم والشراب المبرَّد. فبعد العين (7) والأسنان (8) والفم (9) تأتي الرائحة."
  devices:
    - title: "الكناية في «مُقْتِرَةً كِبَاءً» و«تَقْدَحُ صَحْفَةً فِيهَا نَقِيعُ»"
      text: "لم يقل إنها غنية مخدومة، بل ذكر ما يلزم ذلك: بخور العود الغالي لا يفارقها، وشراب يُنقع ويبرَّد لها. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. وتطبيقه على البيت قراءتنا."
    - title: "«الدَّهْرَ»"
      text: "ظرف يجعل الصفة دائمة لا عارضة: ليست متطيبة لمناسبة، بل هي هكذا أبدًا. وهذه قراءتنا."
  connection: "ثم يصف ثيابها: «وَصِبْغُ ثِيَابِهَا فِي زَعْفَرَانٍ / بِجُدَّتِهَا كَمَا احْمَرَّ النَّجِيعُ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "تَرَاهَدْ دَهْ / رَ مُقْتِرَتَنْ / كِبَاءَنْ = مفاعلْتن / مفاعلَتن / فعولن — وَتَقْدَحُ صَحْ / فَتَنْ فِيهَا / نَقِيعُو = مفاعلَتن / مفاعلْتن / فعولن"
  note: "دخل العَصْبُ الأولى من الصدر والثانية من العجز، والعصب «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، فصارتا «مفاعلْتن». والعروض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها «القطف، وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وتسقط همزة الوصل في «الدَّهْرَ» في درج الكلام، وأُشبعت ضمة العين في القافية «نقيعُ» فنُطقت «نقيعو»."
context: "خامس أبيات الغزل بالأبكار (6–11). وهو في رواية ابن الأعرابي «ومقدح صفحة» مكان «وتقدح صحفة» [@khizana، ج8 ص184]، وفسّر البَغْداديّ المِقدح بالمغرفة وقال إن النقيع يبرَّد لها [@khizana، ج8 ص185]."
variants:
  - reading: "تَرَاهَا الدَّهْرَ مُقْتِرَةً كِبَاءً / وَمِقْدَحُ صَحْفَةٍ فِيهَا نَقِيعُ"
    status: "رواية ابن الأعرابي فيما يثبته البَغْداديّ"
    note: "في نسخة الشاملة من الخزانة «ومقدح صفحة» بتقديم الفاء [@khizana، ج8 ص184]، ونراها «صحفة» كما في الأَصْمَعِيّات. و«المقدح بكسر الميم: المغرفة» [@khizana، ج8 ص185]، فالمعنى: ومعها مغرفة صحفة فيها نقيع. وضبط «مِقْدَح» من البَغْداديّ، وسائر الضبط منا."
