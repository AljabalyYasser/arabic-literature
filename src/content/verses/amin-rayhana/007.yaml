first: أُمَشِّي حَوْلَهَا وَأَطُوفُ فِيهَا
second: وَتُعْجِبُنِي الْمَحَاجِرُ وَالْفُرُوعُ
vocabulary:
- term: الْمَحَاجِرُ
  text: جمع مَحجِر، وهو ما دار بالعين، و«محجر العين ما يبدو من النقاب» [@lisan، ج4 ص169].
- term: الْفُرُوعُ
  text: جمع فَرْع، «وهو الشعر التام» [@khizana، ج8 ص185].
