first: "أُمَشِّي حَوْلَهَا وَأَطُوفُ فِيهَا"
second: "وَتُعْجِبُنِي الْمَحَاجِرُ وَالْفُرُوعُ"
meaning: "يقول: كنت أمشي حول هؤلاء الأبكار وأطوف بينهن، وتعجبني عيونهن التي تبدو من النقاب، وشعورهن الطويلة. وهذا البيت عند البَغْداديّ تمام البيت السابق، قال: «وقوله: أمشي حولها هو جواب رب المقدرة في وأبكار»، ثم فسّر: «والمحاجر: جمع محجر العين كمجلس وهو ما يبدو من النقاب. والفروع: جمع فرع وهو الشعر التام» [@khizana، ج8 ص185]. فالمعنى متصلًا بما قبله: رُبّ فتيات أبكار ناعمات لهوت بهن زمنًا، كنت أدور حولهن وأتنقل بينهن، فيفتنني ما يظهر لي منهن: العيون من فتحات النقاب، والشعر الوافر. ولم يزد الشرّاح على المفردات، فبيان المعنى قراءتنا: البيت يفسّر «لَهَوْتُ بِهِنَّ» في البيت السابق، فلهوه بهن هنا نظر وقرب ومغازلة: شابّ يحوم حول الفتيات ويتأمل عيونهن وشعورهن، ولا يذكر لمسًا ولا خلوة."
vocabulary:
  - term: "أُمَشِّي"
    text: "أُكثر المشي وأتردد."
  - term: "وَأَطُوفُ فِيهَا"
    text: "أدور وأتنقل بينهن."
  - term: "الْمَحَاجِرُ"
    text: "«جمع محجر العين كمجلس وهو ما يبدو من النقاب» [@khizana، ج8 ص185]. ويضبطه محققا الأَصْمَعِيّات بفتح الميم مع كسر الجيم وبكسر الميم مع فتح الجيم، ويقولان: «وهو ما دار بالعين من العظم الذي في أسفل الجفن، وهو الذي يبدو من النقاب» [@asmaiyyat، ص173، الحاشية]. وفي اللسان: «محجر العين ما يبدو من النقاب» [@lisan، ج4 ص169]. فالمحاجر العيون وما حولها."
  - term: "الْفُرُوعُ"
    text: "«جمع فرع وهو الشعر التام» [@khizana، ج8 ص185]. وفي اللسان: «وفَرْعُ المرأَة: شعَرُها، وَجَمْعُهُ فُرُوعٌ. وامرأَة فارِعةٌ وفَرْعاءُ: طَوِيلَةُ الشَّعَرِ» [@lisan، ج8 ص249]."
syntax:
  - "«أُمَشِّي حَوْلَهَا»: فعل مضارع مرفوع بضمة مقدرة على الياء للثقل، وفاعله ضمير مستتر تقديره «أنا»، و«حولها» ظرف مكان منصوب متعلق به. وهو جواب «رُبّ» المقدرة في «وأبكارٍ» في البيت السابق، كما قال البَغْداديّ [@khizana، ج8 ص185]، أي إن «رُبّ» وما جرّته يتم معناهما بهذا الفعل: رُبّ أبكارٍ هذه صفتهن أمشّي حولهن."
  - "«وَأَطُوفُ فِيهَا»: معطوف على «أمشّي»، و«فيها» متعلق بـ«أطوف». والضمير «ها» في «حولها» و«فيها» يعود على «الأبكار»، كما عاد عليها في «أسرّتها» في البيت السابق، وجمع التكسير يعود عليه ضمير المفردة المؤنثة."
  - "«وَتُعْجِبُنِي الْمَحَاجِرُ وَالْفُرُوعُ»: «تعجب» فعل مضارع، والنون للوقاية، والياء مفعول به، و«المحاجرُ» فاعل، و«الفروعُ» معطوف عليه. وأنّث الفعل لأن فاعله جمع تكسير. والمراد محاجرهن وفروعهن."
morphology:
  - "«أُمَشِّي» مضارع «مَشَّى» على «فَعَّلَ»، ناقص يائي، والتضعيف فيه للتكثير. وهذه قراءتنا."
  - "«أَطُوف» مضارع «طَافَ» أجوف واوي، من «الطَّوْف»."
  - "«مَحَاجِر» جمع «مَحْجِر» على «مَفاعِل»، و«مَحْجِر» على «مَفْعِل»، ويقال «مِحْجَر» على «مِفْعَل»."
  - "«فُرُوع» جمع «فَرْع» على «فُعُول» [@lisan، ج8 ص249]."
rhetoric:
  thesis: "يفسّر «لَهَوْتُ بِهِنَّ» في البيت السابق: لهوه أن يدور حولهن وينظر. ثم يسمّي ما أعجبه منهن: العيون والشعر، وهما ما يبدو من المرأة المحجوبة. وبعده ينتقل إلى الأسنان والفم والطيب والثياب (8–11)."
  devices:
    - title: "«أُمَشِّي ... وَأَطُوفُ»"
      text: "فعلان يدلان على حركة دائرة حولهن لا تنقطع، والطواف دوران حول شيء معظَّم، فكأن الأبكار عنده مقصد يطوف به. وهذه قراءتنا."
    - title: "«الْمَحَاجِرُ» دون العيون"
      text: "لم يقل العيون، بل المحاجر، وهي ما يبدو من النقاب كما قال البَغْداديّ [@khizana، ج8 ص185]. فالكلمة تصف ما يراه الناظر إلى امرأة منتقبة: عينان وما حولهما، فهو يصف ما رآه حقًّا لا ما يتخيله. وهذه قراءتنا."
  connection: "ثم يصف أسنانهن إذا ضحكن: «إِذَا يَضْحَكْنَ أَوْ يَبْسِمْنَ يَوْمًا / تَرَى بَرَدًا أَلَحَّ بِهِ الصَّقِيعُ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "أُمَشْشِي حَوْ / لَهَا وَأَطُو / فُ فِيهَا = مفاعلْتن / مفاعلَتن / فعولن — وَتُعْجِبُنِلْ / مَحَاجِرُ وَلْ / فُرُوعُو = مفاعلَتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ التفعيلة الأولى من الصدر، والعصب «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، فصارت «مفاعلْتن». وسلمت سائر تفعيلات الحشو. والعروض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها «القطف، وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وأُشبعت ضمة العين في القافية «الفروعُ» فنُطقت «الفروعو»."
context: "جواب «رُبّ» في البيت 6، فالبيتان جملة واحدة كما قال البَغْداديّ [@khizana، ج8 ص185]. وهو في رواية ابن الأعرابي بلفظه وفي موضعه [@khizana، ج8 ص184]. وهو ثاني أبيات الغزل بالأبكار (6–11)، الذي ينتهي بعجب أُمامة من شيبه في البيت 12."
