first: "شُهُبٌ بِأَيْدِي الْقَابِسِينَ إِذَا بَدَتْ"
second: "بِأَكُفِّهِمْ بَهَرَ الظَّلَامَ سَنَاهَا"
vocabulary:
- term: "شُهُبٌ"
  text: "«والشهب جمع شهاب»، «وشبه الكماة بالشهب، لأنهم لا يتخلصون من غمرات الحروب، ويتوقدون فيها توقد النار في الظلمة» [@diwan-antara، ص304]."
- term: "بَهَرَ الظَّلَامَ سَنَاهَا"
  text: "«أي أذهب ضوءها الظلام وغلبه» [@diwan-antara، ص304]."
