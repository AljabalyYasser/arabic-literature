explained: false
first: "وَأَغُضُّ طَرْفِي مَا بَدَتْ لِي جَارَتِي"
second: "حَتَّى يُوَارِيَ جَارَتِي مَأْوَاهَا"
vocabulary:
- term: "أَغُضُّ طَرْفِي"
  text: "«يقول: أغض بصري إذا بدت لي جارتي حتى تدخل منزلها فيواريها، ولا أتبعها نظري» [@diwan-antara، ص308]."
rhetoric:
  thesis: "بيت في العفة: يكف عنترة بصره عن جارته ما دامت ظاهرة، حتى يسترها بيتها."
  devices:
  - title: "الموازنة بين «وَأَغُضُّ طَرْفِي» عند عنترة و«تَغَافَلْتُ» عند عروة بن الورد"
    text: "يقول عروة بن الورد في معنى قريب: «وَإِنْ جَارَتِي أَلْوَتْ رِيَاحٌ بِبَيْتِهَا / تَغَافَلْتُ حَتَّى يَسْتُرَ البَيْتَ جَانِبُهْ» [@diwan-urwa، ص73]، ولم نجده إلا في رواية ابن السِّكِّيت لديوانه، وشرحه: «يقول: إذا ألوت الريح ببيتها، أي: ذهبت به وألقته لم أنظر ناحيتها حتى يُستَر البيتُ» [@diwan-urwa، ص73]. فالمعنى واحد: لا ينظر الرجل إلى جارته حتى يسترها بيتها. والفرق في الفعل والموقف: عنترة «يغض طرفه» والجارة ظاهرة في طريقها إلى بيتها، فهو كفّ للبصر في حال عادية. وعروة «يتغافل»، أي يُظهر الغفلة وهو منتبه، والريح قد كشفت البيت فجأة، فالموقف أشد، والعفة فيه أصعب. وقصيدة عنترة هذه درجتها على الموقع «راجح». ولا نجد ناقدًا قديمًا يقرن البيتين، فالموازنة من قراءتنا."
