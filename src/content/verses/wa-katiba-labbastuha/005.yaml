first: "صُبُرٌ أَعَدُّوا كُلَّ أَجْرَدَ سَابِحٍ"
second: "وَنَجِيبَةٍ ذَبَلَتْ وَخَفَّ حَشَاهَا"
vocabulary:
- term: "أَجْرَدَ سَابِحٍ"
  text: "«الأجرد القصير الشعر من الخيل، وبذلك توصف الجياد، والسابح الذي يمد ضبعيه في الحرب فعل السابح في الماء» [@diwan-antara، ص305]."
- term: "ذَبَلَتْ وَخَفَّ حَشَاهَا"
  text: "ضمرت: «أي خفيفة اللحم أي ضامرة الكشح، وبذلك توصف العتاق» [@diwan-antara، ص305]."
sources:
