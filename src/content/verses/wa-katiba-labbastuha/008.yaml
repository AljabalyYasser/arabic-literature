explained: false
first: "مِنْ كُلِّ أَرْوَعَ مَاجِدٍ ذِي صَوْلَةٍ"
second: "مَرِسٍ إِذَا لَحِقَتْ خُصًى بِكُلَاهَا"
vocabulary:
- term: "أَرْوَعَ مَاجِدٍ"
  text: "«والأروع المعجب المنظر، والماجد الشريف» [@diwan-antara، ص305]."
- term: "لَحِقَتْ خُصًى بِكُلَاهَا"
  text: "كناية عن شدة الفزع: «وصغرت خصية الجبان حتى كادت تلحق كليته، وبهذا يوصف الجبان إذا استولى عليه الجزع» [@diwan-antara، ص305]."
