explained: false
first: "خَرْسَاءَ ظَاهِرَةِ الْأَدَاةِ كَأَنَّهَا"
second: "نَارٌ يُشَبُّ وَقُودُهَا بِلَظَاهَا"
vocabulary:
- term: "خَرْسَاءَ"
  text: "«أي لا يتبين فيها صوت، ولا يفهم لكثرة جلبتها، فكأنها لا ينطق فيها» [@diwan-antara، ص304]."
- term: "ظَاهِرَةِ الْأَدَاةِ"
  text: "«أي كاملة أداة الحرب» [@diwan-antara، ص304]."
- term: "يُشَبُّ وَقُودُهَا بِلَظَاهَا"
  text: "«والوقود: ما أوقدت به النار من حطب، واللظى وهج النار واشتعالها، ومعنى يشب يوقد» [@diwan-antara، ص304]."
sources:
