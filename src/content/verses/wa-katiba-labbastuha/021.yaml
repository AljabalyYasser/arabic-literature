first: "وَلَئِنْ سَأَلْتَ بِذَاكَ عَبْلَةَ خَبَّرَتْ"
second: "أَنْ لَا أُرِيدُ مِنَ النِّسَاءِ سِوَاهَا"
vocabulary:
