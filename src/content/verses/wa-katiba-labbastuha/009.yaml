explained: false
first: "وَصَحَابَةٍ شُمِّ الْأُنُوفِ بَعَثْتُهُمْ"
second: "لَيْلًا وَقَدْ مَالَ الْكَرَى بِطُلَاهَا"
vocabulary:
- term: "شُمِّ الْأُنُوفِ"
  text: "«أي هم أعزة لا يحتملون ضيما» [@diwan-antara، ص306]."
- term: "الْكَرَى بِطُلَاهَا"
  text: "«وقد استولى عليهم الكرى، وأمال طلاهم، والطلى جمع طلية، وهي صفحة العنق. والكرى النوم» [@diwan-antara، ص306]."
