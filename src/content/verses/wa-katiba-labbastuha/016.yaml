vocabulary:
- term: "مَا اسْتَمْتُ أُنْثَى نَفْسَهَا"
  text: "ما طلبت امرأة لنفسي، يقول الأَعْلَم: لم أراودها عن نفسها «طالبا للحرام» [@diwan-antara، ص308]."
- term: "مَوْلَاهَا"
  text: "«ومولاها وليها» [@diwan-antara، ص308]."
