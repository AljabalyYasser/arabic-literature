explained: false
first: "وَكَتِيبَةٍ لَبَّسْتُهَا بِكَتِيبَةٍ"
second: "شَهْبَاءَ بَاسِلَةٍ يُخَافُ رَدَاهَا"
vocabulary:
- term: "لَبَّسْتُهَا بِكَتِيبَةٍ"
  text: "خلطتها بكتيبة مثلها في القتال: «أي غشيتها بمثلها» [@diwan-antara، ص303]."
- term: "شَهْبَاءَ"
  text: "بيضاء من لمعان الحديد: «وجعلها شهباء لكثرة سلاحها» [@diwan-antara، ص303]."
- term: "بَاسِلَةٍ ... رَدَاهَا"
  text: "«والباسلة الكريهة المنظر، والردى الهلاك» [@diwan-antara، ص304]."
sources:
- source: "diwan-antara"
  loc: "ص303–304"
  url: "https://archive.org/details/3562pdf/page/n308/mode/1up"
status: "review"
