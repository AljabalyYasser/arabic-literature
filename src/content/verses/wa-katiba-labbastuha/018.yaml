first: "أَغْشَى فَتَاةَ الْحَيِّ عِنْدَ حَلِيلِهَا"
second: "وَإِذَا غَزَا فِي الْجَيْشِ لَا أَغْشَاهَا"
vocabulary:
- term: "أَغْشَى"
  text: "«أي أزورها واصلا لرحمها ما دام حليلها معها، فإن خرج غازيا لم أغشها» [@diwan-antara، ص308]."
- term: "حَلِيلِهَا"
  text: "زوجها، «والحَلِيل والحَلِيلة: الزَّوْجان» [@lisan، ج11 ص164]."
