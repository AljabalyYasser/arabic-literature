explained: false
first: "فِيهَا الْكُمَاةُ بَنُو الْكُمَاةِ كَأَنَّهُمْ"
second: "وَالْخَيْلُ تَعْثُرُ فِي الْوَغَى بِقَنَاهَا"
vocabulary:
- term: "الْكُمَاةُ"
  text: "«الكماة جمع كمي وهو الذي يكمي شجاعته ليغر قرنه حتى يمكنه من نفسه» [@diwan-antara، ص304]، أي يخفيها."
- term: "تَعْثُرُ فِي الْوَغَى بِقَنَاهَا"
  text: "تعثر الخيل بالرماح الملقاة: «وجعل الخيل تعثر في القنا لكثرة ما يكسر منها أو يسقط في الأرض لشدة الحرب» [@diwan-antara، ص304]."
sources:
