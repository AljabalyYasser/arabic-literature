explained: false
first: "وَأُجِيبُهَا إِمَّا دَعَتْ لِعَظِيمَةٍ"
second: "وَأُعِينُهَا وَأَكُفُّ عَمَّا سَاهَا"
vocabulary:
- term: "إِمَّا دَعَتْ لِعَظِيمَةٍ"
  text: "إن دعت لأمر عظيم: «وأني أجيبها إن دعت لعظيمة تنزل بها، فأعينها على دفعها» [@diwan-antara، ص309]."
- term: "سَاهَا"
  text: "ساءها: «ساءها فخفف الهمزة ثم حذفها ضرورة» [@diwan-antara، ص309]."
sources:
