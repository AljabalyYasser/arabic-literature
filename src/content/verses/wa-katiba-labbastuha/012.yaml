explained: false
first: "وَضَرَبْتُ قَرْنَيْ كَبْشِهَا فَتَجَدَّلَا"
second: "وَحَمَلْتُ مُهْرِي وَسْطَهَا فَمَضَاهَا"
vocabulary:
- term: "كَبْشِهَا"
  text: "«والكبش سيد القوم» [@diwan-antara، ص307]."
- term: "فَتَجَدَّلَا"
  text: "سقطا، يعني القرنين بسقوط صاحبهما، «ويجوز أن يريد فتجدل ثم أشبع الفتحة ضرورة» [@diwan-antara، ص306]."
- term: "فَمَضَاهَا"
  text: "«أي مضى فيها» [@diwan-antara، ص307]."
sources:
- source: "diwan-antara"
  loc: "ص306–307"
  url: "https://archive.org/details/3562pdf/page/n311/mode/1up"
status: "review"
