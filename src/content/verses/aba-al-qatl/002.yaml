first: فَقُلْتُ أَعَبْدَ اللَّهِ أَبْكِي أَمِ الَّذِي
second: لَهُ الْجَدَثُ الْأَعْلَى قَتِيلَ أَبِي بَكْرِ
vocabulary:
- term: أَعَبْدَ اللَّهِ
  text: 'أخوه عبد الله بن الصِّمَّة، «الذي قتلته غطفان» [@aghani-dk، ج10 ص4]، وهو الذي رثاه بالدالية.'
- term: الْجَدَثُ
  text: '«القبر» [@lisan، ج2 ص128].'
- term: قَتِيلَ أَبِي بَكْرِ
  text: 'أخوه قيس، «قتله بنو أبي بكر بن كلاب» [@aghani-dk، ج10 ص4].'
