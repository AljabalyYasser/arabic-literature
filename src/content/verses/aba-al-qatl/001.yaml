explained: false
first: تَقُولُ أَلَا تَبْكِي أَخَاكَ وَقَدْ أَرَى
second: مَكَانَ الْبُكَا لَكِنْ بُنِيتُ عَلَى الصَّبْرِ
vocabulary:
- term: تَقُولُ
  text: 'امرأة تلومه، لا يسميها.'
- term: مَكَانَ الْبُكَا
  text: 'موضع البكاء، أي أن أخاه أهل لأن يُبكى عليه.'
- term: بُنِيتُ عَلَى الصَّبْرِ
  text: 'طُبعت عليه، فهو خُلُقي.'
sources:
- source: tabrizi-hamasa
  loc: ج1 ص340
