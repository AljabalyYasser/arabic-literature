explained: false
first: تَقُولُ أَلَا تَبْكِي أَخَاكَ وَقَدْ أَرَى
second: مَكَانَ الْبُكَا لَكِنْ بُنِيتُ عَلَى الصَّبْرِ
vocabulary:
- term: تَقُولُ
  text: 'امرأة تلومه، لا يسميها.'
- term: مَكَانَ الْبُكَا
  text: "موضع البكاء، أي أن أخاه أهل لأن يُبكى عليه. وفي حاشية محقق شرح الحماسة للتبريزي: «بيان لاستحقاق أخيه أن يبكى عليه» [@tabrizi-hamasa، ج1 ص340، الحاشية]."
- term: بُنِيتُ عَلَى الصَّبْرِ
  text: "طُبعت عليه، فهو خُلُقي؛ وفي الحاشية نفسها: «جبلت على الصبر» [@tabrizi-hamasa، ج1 ص340، الحاشية]."
