first: أَبَى الْقَتْلُ إِلَّا آلَ صِمَّةَ أَنَّهُمْ
second: أَبَوْا غَيْرَهُ وَالْقَدْرُ يَجْرِي إِلَى الْقَدْرِ
vocabulary:
- term: آلَ صِمَّةَ
  text: أهل الصِّمّة، أبي دُرَيْد، أي دُرَيْد وإخوته.
- term: الْقَدْرُ
  text: القضاء؛ «القَدْر والقَدَر القضاء والحكم» [@lisan، ج5 ص74].
