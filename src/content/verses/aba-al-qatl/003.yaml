explained: false
first: فَإِنَّا لَلَحْمُ السَّيْفِ غَيْرَ نَكِيرَةٍ
second: وَنُلْحِمُهُ حِينًا وَلَيْسَ بِذِي نُكْرِ
vocabulary:
- term: لَلَحْمُ السَّيْفِ
  text: طُعمة له، أي يكثر فينا القتل.
- term: غَيْرَ نَكِيرَةٍ
  text: 'حقًّا لا يُنكَر؛ والنكير: الإنكار.'
- term: نُلْحِمُهُ
  text: 'نُطعمه لحم أعدائنا؛ يقال: «ألحمته سيفي»، و«ألحمت القوم إذا قتلتهم حتى صاروا لحما» [@lisan، ج12 ص537].'
