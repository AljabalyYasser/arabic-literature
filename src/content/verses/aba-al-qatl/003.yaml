explained: false
first: وَعَبْدَ يَغُوثَ تَحْجِلُ الطَّيْرُ حَوْلَهُ
second: وَعَزَّ الْمُصَابُ حَثْوُ قَبْرٍ عَلَى قَبْرِ
vocabulary:
- term: وَعَبْدَ يَغُوثَ
  text: 'أم أبكي أخي عبد يَغُوث، و«عبد يغوث قتله بنو مرة» [@aghani-dk، ج10 ص4].'
- term: تَحْجِلُ الطَّيْرُ
  text: 'تمشي حوله تنزو في مشيها، تريد أكله وهو صريع لم يُدفن؛ «ونزوان الغراب: حجله» [@lisan، ج11 ص144].'
- term: وَعَزَّ الْمُصَابُ
  text: 'اشتدّت المصيبة وعظمت.'
- term: حَثْوُ قَبْرٍ عَلَى قَبْرِ
  text: 'دفن أخ بعد أخ، يُحثى التراب على قبر بعد قبر.'
