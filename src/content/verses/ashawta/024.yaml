first: لَا تَلُمْنِي إِنَّهَا مِنْ نِسْوَةٍ
second: رُقَّدِ الصَّيْفِ مَقَالِيتَ نُزُرْ
vocabulary:
- term: رُقَّدِ الصَّيْفِ
  text: ينمن في حرّ الصيف مكفيّات، كناية عن النعمة والترف.
- term: مَقَالِيتَ
  text: جمع مِقْلات، وهي المرأة «إذا لم يبق لها ولد» [@lisan، ج2 ص72].
- term: نُزُرْ
  text: 'قليلات الولد؛ «وامرأة نزور: قليلة الولد، ونسوة نزر» [@lisan، ج5 ص203].'
