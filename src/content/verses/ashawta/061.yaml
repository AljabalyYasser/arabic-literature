first: أَعْوَجِيَّاتٍ طِوَالًا شُزَّبًا
second: دُوخِلَ الصَّنْعَةُ فِيهَا وَالضُّمُرْ
vocabulary:
- term: أَعْوَجِيَّاتٍ
  text: منسوبة إلى أعوج، فحل كريم من خيل العرب.
- term: شُزَّبًا
  text: ضوامر يابسة.
- term: الصَّنْعَةُ
  text: '«وصنعة الفرس: حسن القيام عليه» [@lisan، ج8 ص210].'
- term: الضُّمُرْ
  text: الضُّمْر، وهو خفة اللحم من التضمير.
