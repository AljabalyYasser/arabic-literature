explained: false
first: كَبَنَاتِ الْمَخْرِ يَمْأَدْنَ كَمَا
second: أَنْبَتَ الصَّيْفُ عَسَالِيجَ الْخُضَرْ
vocabulary:
- term: بَنَاتِ الْمَخْرِ
  text: «سحائب يأتين قبل الصيف منتصبات رقاق بيض حسان» [@lisan، ج5 ص161].
- term: يَمْأَدْنَ
  text: 'يتثنّين ويهتززن؛ «ويقال للغصن إذا كان ناعمًا يهتز: هو يمأد مأدًا حسنًا» [@lisan، ج3 ص394].'
- term: عَسَالِيجَ
  text: 'جمع عُسلوج، وهو «الغصن لسنته، وقيل: هو كل قضيب حديث» [@lisan، ج2 ص324].'
- term: الْخُضَرْ
  text: النبات الأخضر. «ويروى الخَضِرْ» [@lisan، ج2 ص324]، وهو نبت ذكره طَرَفَة «فبين أنه من نبات الصيف» [@lisan، ج7 ص270].
