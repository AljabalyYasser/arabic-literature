explained: false
first: جَازَتِ الْبِيدَ إِلَى أَرْحُلِنَا
second: آخِرَ اللَّيْلِ بِيَعْفُورٍ خَدِرْ
vocabulary:
- term: الْبِيدَ
  text: الصحارى الواسعة، الواحدة بيداء.
- term: أَرْحُلِنَا
  text: رحالنا، أي منازلنا في السفر.
- term: بِيَعْفُورٍ خَدِرْ
  text: 'اليعفور: ولد البقرة الوحشية أو تيس الظباء، والخَدِر: المتخلّف عن القطيع؛ أي جاءت في شخص مثل اليعفور. وقيل: أراد باليعفور «الجزء من أجزاء الليل، فالخدر على هذا المظلم» [@lisan، ج4 ص585].'
