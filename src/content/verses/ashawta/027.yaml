first: وَإِذَا تَلْسُنُنِي أَلْسُنُهَا
second: إِنَّنِي لَسْتُ بِمَوْهُونٍ فَقِرْ
vocabulary:
- term: تَلْسُنُنِي أَلْسُنُهَا
