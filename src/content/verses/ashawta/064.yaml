explained: false
first: وَأَنَافَتْ بِهَوَادٍ تُلُعٍ
second: كَجُذُوعٍ شُذِّبَتْ عَنْهَا الْقِشَرْ
vocabulary:
- term: أَنَافَتْ
  text: 'ارتفعت وأشرفت؛ «وأناف الشيء على غيره: ارتفع وأشرف» [@lisan، ج9 ص342].'
- term: هَوَادٍ
  text: أعناق، الواحد هادٍ.
- term: تُلُعٍ
  text: طوال، الواحد أتلع.
- term: شُذِّبَتْ
  text: قُشرت وقُطع ما عليها.
