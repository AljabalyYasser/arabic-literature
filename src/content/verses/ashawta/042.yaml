explained: false
first: لَا تَعِزُّ الْخَمْرُ إِنْ طَافُوا بِهَا
second: بِسِبَاءِ الشَّوْلِ وَالْكُومِ الْبُكُرْ
vocabulary:
- term: تَعِزُّ
  text: تغلو وتشتدّ على مشتريها.
- term: سِبَاءِ
  text: شراء الخمر؛ «سبأ الخمر يسبؤها سبأ وسباء... شراها» [@lisan، ج1 ص93].
- term: الشَّوْلِ
  text: جمع شائلة، وهي من الإبل «التي أتى عليها من حملها أو وضعها سبعة أشهر فخف لبنها» [@lisan، ج11 ص374].
- term: الْكُومِ الْبُكُرْ
  text: 'العظيمة الأسنمة الفتيّة، فيما نرى، من «البكر: الفتي من الإبل» [@lisan، ج4 ص79]. ولم نجد «البُكُر» جمعًا للإبل في اللسان.'
