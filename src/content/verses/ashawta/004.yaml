first: أَرَّقَ الْعَيْنَ خَيَالٌ لَمْ يَقِرّ
second: طَافَ وَالرَّكْبُ بِصَحْرَاءِ يُسُرْ
vocabulary:
- term: أَرَّقَ
  text: أسهر.
- term: خَيَالٌ
  text: طيف الحبيبة يُرى في النوم.
- term: لَمْ يَقِرّ
  text: لم يستقرّ ولم يهدأ.
- term: يُسُرْ
  text: 'موضع؛ قيل: «دَحْلٌ لبني يربوع»، وذكر الجوهري «أنه بالدهناء» [@lisan، ج5 ص300].'
