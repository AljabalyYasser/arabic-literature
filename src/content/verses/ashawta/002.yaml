second: لَيْسَ هَذَا مِنْكِ مَاوِيَّ بِحُرّ
vocabulary:
- term: مَاوِيَّ
  text: 'يا ماويّة، و«ماويّة: اسم امرأة» [@lisan، ج13 ص545].'
- term: بِحُرّ
  text: 'بفعل حسن؛ يقال: «ما هذا منك بحُرٍّ، أي بحسن ولا جميل» [@lisan، ج4 ص182].'
