explained: false
first: وَبِلَادٍ زَعِلٍ ظِلْمَانُهَا
second: كَالْمَخَاضِ الْجُرْبِ فِي الْيَوْمِ الْخَدِرْ
vocabulary:
- term: زَعِلٍ
  text: نشيط.
- term: ظِلْمَانُهَا
  text: ذكور النعام، الواحد ظليم.
- term: الْمَخَاضِ الْجُرْبِ
  text: 'النوق الحوامل المصابة بالجرب؛ و«المخاض: الحوامل من النوق» [@lisan، ج7 ص228].'
- term: الْيَوْمِ الْخَدِرْ
  text: 'قال الليث: «يوم خدر شديد الحر»، وقال الأزهري: «أراد باليوم الخدر المطير ذا الغيم»، وقال ابن السكيت: خصّ المطير بالمخاض الجرب «لأنها إذا جربت توسفت أوبارها فالبرد إليها أسرع» [@lisan، ج4 ص233].'
