first: "نَحْنُ فِي الْمَشْتَاةِ نَدْعُو الْجَفَلَى"
second: "لَا تَرَى الْآدِبَ فِينَا يَنْتَقِرْ"
meaning: "نحن في الشتاء، زمن الشدة والجدب، ندعو الناس جميعًا إلى طعامنا، ولا ترى الداعي منا يختار ناسًا دون ناس."
vocabulary:
  - term: "الْمَشْتَاةِ"
    text: "«زمن الشتاء والجدب» [@dalail، ص135، حاشية المحقق]."
  - term: "الْجَفَلَى"
    text: "«الدعوة العامة» [@dalail، ص135، حاشية المحقق]: أن تدعو الناس كلهم."
  - term: "الْآدِبَ"
    text: "«الداعي إلى الطعام» [@deif، ج1 ص7، الحاشية]."
  - term: "يَنْتَقِرْ"
    text: "يختار من يدعوه؛ و«التقري: الدعوة الخاصة، يختار من يدعوهم وينتقرهم» [@dalail، ص135، حاشية المحقق]. «لا ينتقر: لا يختار أناسا دون آخرين» [@deif، ج1 ص7، الحاشية]."
syntax:
  - "«نحن» مبتدأ، وجملة «ندعو» خبره، و«في المشتاة» متعلق بـ«ندعو»."
  - "«الجفلى» مفعول مطلق منصوب بفتحة مقدرة، على تقدير: ندعو الدعوة الجفلى."
  - "«ترى» بصرية، و«الآدب» مفعولها، وجملة «ينتقر» حال منه."
morphology:
  - "«المَشْتاة» مصدر ميمي أو اسم زمان من «شتا» على «مَفْعَلة»."
  - "«الآدِب» اسم فاعل من «أدَب يأدِب» إذا دعا إلى المأدُبة، وهي الطعام الذي يُدعى إليه الناس [@deif، ج1 ص7]."
  - "«يَنْتَقِر» على «يفتعل» من «النَّقَرى»، وهي الدعوة الخاصة."
rhetoric:
  thesis: "الكرم في أشد الأوقات: في الشتاء حين يقل الطعام، يدعو قومه الناس جميعًا، لا يختارون."
  devices:
    - title: "تقديم الضمير"
      text: "بدأ بـ«نحن» ثم الفعل، ولم يقل «ندعو في المشتاة». وقد استشهد عبد القاهر الجُرْجانيّ بهذا البيت على تقديم المحدَّث عنه، وقال: «وذلك أن من شأن المادح أن يمنع السامعين من الشك فيما يمدح به، ويباعدهم من الشبهة، وكذلك المفتخر» [@dalail، ص134–135]. فتقديم «نحن» توكيد يقطع الشك."
    - title: "المقابلة"
      text: "قابل بين «الجفلى»، وهي دعوة الناس كلهم، و«الانتقار»، وهو اختيار بعضهم: أثبت الأولى لقومه، ونفى الثانية عنهم."
    - title: "قيد الزمن"
      text: "«في المشتاة»: الكرم في الخصب سهل، وفي الشتاء والجدب فضيلة. فالقيد يرفع الفخر."
  connection: "ثم يصف الشواء وقدورهم التي لا تفرغ للأضياف."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ الراء الساكنة"
  scansion: "نَحْنُ فِلْ مَشْ / تَاةِ نَدْعُلْ / جَفَلَى = فاعلاتن / فاعلاتن / فعلن — لَا تَرَلْ ءَا / دِبَ فِينَا / يَنْتَقِرْ = فاعلاتن / فعلاتن / فاعلن"
  note: "وزن الرمل التام «فاعلاتن فاعلاتن فاعلن» في كل شطر، وعَرُوضُه وضَرْبُه محذوفان دائمًا: «فاعلن». ويدخل حشوَه الخَبْن، وهو حذف الثاني الساكن، فتصير «فاعلاتن» «فعِلاتن»، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79–80]. وقد دخل الخبن العَرُوض فصارت «فعِلن»، وهو جائز فيها [@atiq، ص80]، ودخل التفعيلة الثانية من العَجُز. والألف الممدودة في «الآدب» همزة وألف: «ءَا»."
context: "لهذا البيت شأن في تاريخ كلمة «أدب». يقول شوقي ضيف إننا إذا رجعنا إلى العصر الجاهلي «ننقّب عن الكلمة فيه لم نجدها تجري على ألسنة الشعراء، إنما نجد لفظة آدب بمعنى الداعي إلى الطعام»، ويستشهد بهذا البيت، ثم يقول: «ومن ذلك المأدبة بمعنى الطعام الذي يدعى إليه الناس»، و«ليس وراء بيت طَرَفَة أبيات أخرى تدل على أن الكلمة انتقلت في العصر الجاهلي من هذا المعنى الحسي إلى معنى آخر» [@deif، ج1 ص7]."
