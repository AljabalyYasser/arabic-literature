first: فَلَهُ مِنْهَا عَلَى أَحْيَانِهَا
second: صَفْوَةُ الرَّاحِ بِمَلْذُوذٍ خَصِرْ
vocabulary:
- term: عَلَى أَحْيَانِهَا
  text: في أوقاتها، حينًا بعد حين.
- term: الرَّاحِ
  text: الخمر، يريد ريقها.
- term: بِمَلْذُوذٍ خَصِرْ
  text: بريق لذيذ بارد.
