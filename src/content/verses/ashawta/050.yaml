first: ثُمَّ لَا يَخْزَنُ فِينَا لَحْمُهَا
second: إِنَّمَا يَخْزَنُ لَحْمُ الْمُدَّخِرْ
vocabulary:
- term: يَخْزَنُ
  text: يتغيّر وينتن؛ «وخزن اللحم، بالكسر، يخزن... تغير وأنتن» [@lisan، ج13 ص139].
- term: الْمُدَّخِرْ
  text: الذي يدّخر اللحم ولا يُطعمه.
