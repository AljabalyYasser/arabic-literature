first: بَيْنَ أَكْنَافِ خُفَافٍ فَاللِّوَى
second: مُخْرِفٌ تَحْنُو لِرَخْصِ الظِّلْفِ حُرّ
vocabulary:
- term: أَكْنَافِ
  text: جوانب.
- term: خُفَافٍ فَاللِّوَى
  text: موضعان.
- term: مُخْرِفٌ
  text: 'ظبية ولدت في الخريف؛ يقال: «أخرفت الشاة: ولدت في الخريف، فهي مخرف» [@lisan، ج9 ص64].'
- term: لِرَخْصِ الظِّلْفِ حُرّ
  text: 'لولد ليّن الظلف؛ و«الحر: ولد الظبي في بيت طَرَفَة» [@lisan، ج4 ص184].'
