first: ظَلَّ فِي عَسْكَرَةٍ مِنْ حُبِّهَا
second: وَنَأَتْ شَحْطَ مَزَارِ الْمُدَّكِرْ
vocabulary:
- term: عَسْكَرَةٍ
  text: «أي ظل في شدة من حبها» [@lisan، ج4 ص567].
- term: نَأَتْ
  text: بعدت.
- term: شَحْطَ مَزَارِ الْمُدَّكِرْ
  text: 'ما أبعد مزارها على المتذكّر! و«أراد يا شحط مزار المدكر» [@lisan، ج4 ص567]. والشحط: البعد.'
