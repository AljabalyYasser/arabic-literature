first: فَجَعُونِي يَوْمَ زَمُّوا عِيرَهُمْ
second: بِرَخِيمِ الصَّوْتِ مَلْثُومٍ عَطِرْ
vocabulary:
- term: زَمُّوا عِيرَهُمْ
  text: شدّوا الأزمّة على إبلهم للرحيل.
- term: رَخِيمِ الصَّوْتِ
  text: ليّن الصوت رقيقه.
- term: مَلْثُومٍ
  text: 'مُقبَّل، من «لثمها... لثمًا: قبلها» [@lisan، ج12 ص534].'
