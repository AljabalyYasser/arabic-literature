explained: false
first: فُضُلٌ أَحْلَامُهُمْ عَنْ جَارِهِمْ
second: رُحُبُ الْأَذْرُعِ بِالْخَيْرِ أُمُرْ
vocabulary:
- term: فُضُلٌ أَحْلَامُهُمْ
  text: واسعة أحلامهم فاضلة، يحتملون جارهم.
- term: رُحُبُ الْأَذْرُعِ
  text: واسعو الباع، كناية عن الكرم.
- term: أُمُرْ
  text: 'كثيرو الأمر بالخير، الواحد أَمُور؛ يقال: «رجل أمور بالمعروف» [@lisan، ج4 ص29].'
