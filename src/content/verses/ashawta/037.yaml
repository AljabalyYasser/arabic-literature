first: وَلِيَ الْأَصْلُ الَّذِي فِي مِثْلِهِ
second: يُصْلِحُ الْآبِرُ زَرْعَ الْمُؤْتَبِرْ
vocabulary:
- term: الْآبِرُ
  text: 'الذي يُصلح النخل والزرع ويلقّحه؛ «والآبر: العامل» [@lisan، ج4 ص3].'
- term: الْمُؤْتَبِرْ
  text: «رب الزرع» [@lisan، ج4 ص3]؛ وقد ضربه الشاعر «مثلا لإتمام الصنيعة» [@khizana، ج8 ص188].
