explained: false
first: إِنْ نُصَادِفْ مُنْفِسًا لَا تُلْفِنَا
second: فُرُحَ الْخَيْرِ وَلَا نَكْبُو لِضُرّ
vocabulary:
- term: مُنْفِسًا
  text: «المال الذي له قدر وخطر» [@lisan، ج6 ص238].
- term: تُلْفِنَا
  text: تجدنا.
- term: فُرُحَ الْخَيْرِ
  text: فرحين بالخير بطرين، جمع فَرِح.
- term: نَكْبُو
  text: نعثر ونسقط، من كبا الفرس إذا عثر.
