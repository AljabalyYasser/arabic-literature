first: أَيُّهَا الْفِتْيَانُ فِي مَجْلِسِنَا
second: جَرِّدُوا مِنْهَا وِرَادًا وَشُقُرْ
vocabulary:
- term: جَرِّدُوا
  text: أخرجوا للغارة.
- term: وِرَادًا
  text: جمع وَرْد، وهو من الخيل «بين الكميت والأشقر» [@lisan، ج3 ص456].
- term: شُقُرْ
  text: جمع أشقر، وهو الأحمر من الخيل.
