first: وَلَهَا كَشْحَا مَهَاةٍ مُطْفِلٍ
second: تَقْتَرِي بِالرَّمْلِ أَفْنَانَ الزَّهَرْ
vocabulary:
- term: كَشْحَا
  text: 'خصرا، والكشح: ما بين الخاصرة والضلوع.'
- term: مَهَاةٍ مُطْفِلٍ
  text: بقرة وحشية معها ولدها الصغير.
- term: تَقْتَرِي
  text: 'تتتبّع، من «قرا الأمر واقتراه: تتبّعه» [@lisan، ج15 ص175].'
- term: أَفْنَانَ
  text: أغصان.
