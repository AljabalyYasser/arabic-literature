first: قَدْ تَبَطَّنْتُ وَتَحْتِي جَسْرَةٌ
second: تَتَّقِي الْأَرْضَ بِمَلْثُومٍ مَعِرْ
vocabulary:
- term: تَبَطَّنْتُ
  text: توغّلت في داخلها وقطعتها.
- term: جَسْرَةٌ
  text: ناقة ماضية قوية.
- term: مَلْثُومٍ
  text: 'خفّ جرحته الحجارة؛ «وخف ملثوم وملثم: جرحته الحجارة» [@lisan، ج12 ص534].'
- term: مَعِرْ
  text: '«وخف معر: لا شعر عليه» [@lisan، ج5 ص180].'
