explained: false
first: وَهُمُ أَيْسَارُ لُقْمَانَ إِذَا
second: أَغْلَتِ الشَّتْوَةُ أَبْدَاءَ الْجُزُرْ
vocabulary:
- term: أَيْسَارُ لُقْمَانَ
  text: كان للقمان «أيسار يضربون معه بالقداح، وهم ثمانية»، «فضربت العرب بهؤلاء الأيسار المثل كما ضربوه بلقمان» [@maydani، ج2 ص427].
- term: الشَّتْوَةُ
  text: الشتاء، زمن الجدب.
- term: أَبْدَاءَ الْجُزُرْ
  text: جمع بَدْء، وهو «خير عظم في الجزور، وقيل خير نصيب في الجزور» [@lisan، ج1 ص29].
