explained: false
first: كَائِرَاتٍ وَتَرَاهَا تَنْتَحِي
second: مُسْلَحِبَّاتٍ إِذَا جَدَّ الْحُضُرْ
vocabulary:
- term: كَائِرَاتٍ
  text: رافعات أذنابها في عدوها؛ «كار الفرس يكير إذا جرى رافعا ذنبه» [@lisan، ج5 ص157].
- term: تَنْتَحِي
  text: تعتمد في عدوها وتقصد.
- term: مُسْلَحِبَّاتٍ
  text: 'ممتدّات؛ «والمسلحب: الطريق البين الممتد» [@lisan، ج1 ص474].'
- term: الْحُضُرْ
  text: الحُضْر، وهو العدو الشديد.
