explained: false
first: وَلَقَدْ تَعْلَمُ بَكْرٌ أَنَّنَا
second: آفَةُ الْجُزْرِ مَسَامِيحُ يُسُرْ
vocabulary:
- term: بَكْرٌ
  text: بَكْر بن وائِل، وقوم الشاعر منها [@khizana، ج9 ص378].
- term: آفَةُ الْجُزْرِ
  text: 'نُهلك الإبل بالنحر للأضياف؛ والجُزْر: جمع جزور.'
- term: مَسَامِيحُ
  text: أجواد، الواحد مِسماح.
- term: يُسُرْ
  text: 'أهل ميسر يضربون بالقداح على الجُزُر، من «اليسر: المجتمعون على الميسر» [@lisan، ج5 ص298].'
