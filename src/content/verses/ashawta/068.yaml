first: ذُلُقُ الْغَارَةِ فِي إِفْزَاعِهِمْ
second: كَرِعَالِ الطَّيْرِ أَسْرَابًا تَمُرّ
vocabulary:
- term: ذُلُقُ الْغَارَةِ
  text: حِداد سِراع في الغارة.
- term: إِفْزَاعِهِمْ
  text: 'إغاثتهم؛ «وأفزعهم: أغاثهم» [@lisan، ج8 ص252].'
- term: رِعَالِ
  text: جماعات، الواحدة رَعْلة؛ و«الرعلة القطعة من الطير» [@lisan، ج11 ص287].
