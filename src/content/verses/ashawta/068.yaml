first: دُلُقُ الْغَارَةِ فِي إِفْزَاعِهِمْ
second: كَرِعَالِ الطَّيْرِ أَسْرَابًا تَمُرّ
vocabulary:
- term: دُلُقُ الْغَارَةِ
  text: 'جمع دَلُوق، قال الأعلم: «وهو المتقدم المسرع إلى الغارة» [@diwan-tarafa، ص79].'
- term: إِفْزَاعِهِمْ
  text: 'إغاثتهم؛ «وأفزعهم: أغاثهم» [@lisan، ج8 ص252].'
- term: رِعَالِ
  text: جماعات، الواحدة رَعْلة؛ و«الرعلة القطعة من الطير» [@lisan، ج11 ص287].
