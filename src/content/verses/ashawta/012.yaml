first: تَحْسِبُ الطَّرْفَ عَلَيْهَا نَجْدَةً
second: يَا لَقَوْمِي لِلشَّبَابِ الْمُسْبَكِرّ
vocabulary:
- term: نَجْدَةً
  text: 'ثقلًا ومشقة؛ «يقول: شق عليها النظر لنعمتها فهي ساجية الطرف» [@lisan، ج3 ص417].'
- term: الْمُسْبَكِرّ
  text: 'التامّ الممتدّ؛ يقال: «اسبكر الشباب إذا مضى عن وجهه وطال» [@lisan، ج4 ص600].'
