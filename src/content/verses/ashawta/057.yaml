explained: false
first: دُلُقٌ فِي غَارَةٍ مَسْفُوحَةٍ
second: وَلَدَى الْبَأْسِ حُمَاةٌ مَا نَفِرّ
vocabulary:
- term: دُلُقٌ
  text: مسرعون إلى الغارة متقدّمون فيها، وأصله في شرح الأعلم من دَلَق السيف إذا خرج من غمده [@diwan-tarafa، ص76].
- term: مَسْفُوحَةٍ
  text: 'مصبوبة متدفّقة، من «السفح للدم: كالصب» [@lisan، ج2 ص485].'
- term: حُمَاةٌ
  text: يحمون الحِمى ويدفعون عن قومهم.
