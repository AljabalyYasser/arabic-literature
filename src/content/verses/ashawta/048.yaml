first: بِجِفَانٍ تَعْتَرِي نَادِيَنَا
second: مِنْ سَدِيفٍ حِينَ هَاجَ الصِّنَّبِرْ
vocabulary:
- term: جِفَانٍ
  text: قصاع كبيرة للطعام، الواحدة جفنة.
- term: تَعْتَرِي نَادِيَنَا
  text: '«ومعنى تعتري: تلم به وتأتيه. والنادي: مجلس القوم ومتحدثهم» [@khizana، ج9 ص380].'
- term: سَدِيفٍ
  text: «قطع السنام» [@khizana، ج9 ص380].
- term: الصِّنَّبِرْ
  text: '«البرد، وقيل: الريح الباردة في غيم» [@lisan، ج4 ص470].'
