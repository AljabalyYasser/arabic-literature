first: تَخْلِسُ الطَّرْفَ بِعَيْنَيْ بَرْغَزٍ
second: وَبِخَدَّيْ رَشَأٍ آدَمَ غِرّ
vocabulary:
- term: تَخْلِسُ الطَّرْفَ
  text: تسارق النظر.
- term: بَرْغَزٍ
  text: '«ولد البقرة، وقيل: البقرة الوحشية» [@lisan، ج5 ص311].'
- term: رَشَأٍ آدَمَ
  text: ولد ظبية في لونه بياض؛ و«الأدمة... في الظباء لون مشرب بياضًا» [@lisan، ج12 ص11].
- term: غِرّ
  text: صغير لم يجرّب الأمور.
