first: "أَصَحَوْتَ الْيَوْمَ أَمْ شَاقَتْكَ هِرّ"
second: "وَمِنَ الْحُبِّ جُنُونٌ مُسْتَعِرْ"
meaning: "أأفقت اليوم من حبك، أم عاد إليك الشوق إلى هرّ؟ ومن الحب ما هو جنون يشتعل."
vocabulary:
  - term: "صَحَوْتَ"
    text: "أفقت، كما يفيق السكران [@diwan-tarafa، ص39، الحاشية]."
  - term: "شَاقَتْكَ"
    text: "حرّكت فيك الشوق [@diwan-tarafa، ص39، الحاشية]."
  - term: "هِرّ"
    text: "اسم امرأة [@diwan-tarafa، ص39، الحاشية]."
  - term: "مُسْتَعِرْ"
    text: "مشتعل."
syntax:
  - "الهمزة للاستفهام، و«أم» معادلة لها: أصحوت أم شاقتك؟"
  - "«اليوم» ظرف زمان متعلق بـ«صحوت»."
  - "«من الحب» خبر مقدم، و«جنونٌ» مبتدأ مؤخر، و«مستعر» صفته. والجملة معترضة تفسّر السؤال."
morphology:
  - "«صحوت» من «صحا يصحو»، من الصَّحْو، وهو ذهاب السُّكر."
  - "«مُسْتَعِر» اسم فاعل من «استعر» على «افتعل» من «السُّعْر» وهو اشتعال النار."
rhetoric:
  thesis: "مطلع يبدأ بسؤال الشاعر لنفسه، لا بالوقوف على الأطلال كالمعلقة."
  devices:
    - title: "التجريد"
      text: "يخاطب نفسه بـ«صحوتَ» و«شاقتكَ»، فكأنه جرّد من نفسه شخصًا آخر يسأله. والتجريد: أن ينتزع المتكلم من نفسه شخصًا يخاطبه."
    - title: "الاستعارة"
      text: "«صحوت» مستعار من إفاقة السكران، و«مستعر» من اشتعال النار. فالحب عنده سُكر ونار معًا. وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر [@dalail، ص67]."
    - title: "الحكمة في العَجُز"
      text: "«ومن الحب جنون مستعر» حكم عام بعد سؤال خاص، فالعَجُز يجيب عن الصدر: لم يصحُ، لأن من الحب ما هو جنون."
  connection: "ثم يخاطبها باسم آخر، ماويّة، ويصف طيفها الذي زاره ليلًا."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ الراء الساكنة"
  scansion: "أَصَحَوْتَلْ / يَوْمَ أَمْ شَا / قَتْكَ هِرْ = فعلاتن / فاعلاتن / فاعلن — وَمِنَلْ حُبْ / بِ جُنُونُنْ / مُسْتَعِرْ = فعلاتن / فعلاتن / فاعلن"
  note: "وزن الرمل التام «فاعلاتن فاعلاتن فاعلن» في كل شطر، وعَرُوضُه وضَرْبُه محذوفان دائمًا: «فاعلن». ويدخل حشوَه الخَبْن، وهو حذف الثاني الساكن، فتصير «فاعلاتن» «فعِلاتن»، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79–80]. وقد دخل الخبن التفعيلة الأولى من الصدر، والأولى والثانية من العَجُز. والبيت مصرّع، أي اتفق آخر شطريه في القافية: «هِرّ» و«مستعر»."
context: "قال ابن سَلّام: «فأما طَرَفَة فأشعر الناس واحدة وهي قوله: لخَوْلَة أطلال ببُرْقَة ثَهْمَد... وتليها أخرى مثلها وهي: أصحوت اليوم أم شاقتك هر... ومن بعد له قصائد حسان جياد» [@ibn-sallam، ج1 ص138]. فهذه القصيدة عنده في منزلة المعلقة أو قريبًا منها."
