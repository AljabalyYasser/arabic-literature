first: إِنْ تُنَوِّلْهُ فَقَدْ تَمْنَعُهُ
second: وَتُرِيهِ النَّجْمَ يَجْرِي بِالظُّهُرْ
vocabulary:
- term: تُنَوِّلْهُ
  text: 'تعطه؛ «نوّله: أعطاه معروفه» [@lisan، ج11 ص683].'
- term: تُرِيهِ النَّجْمَ يَجْرِي بِالظُّهُرْ
  text: تُظلم عليه الدنيا حتى يرى النجم نهارًا؛ وهو مثل «يضرب عند اشتداد الأمر» [@maydani، ج1 ص294].
