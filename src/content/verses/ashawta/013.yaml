first: حَيْثُمَا قَاظُوا بِنَجْدٍ وَشَتَوْا
second: حَوْلَ ذَاتِ الْحَاذِ مِنْ ثِنْيَيْ وُقُرْ
vocabulary:
- term: قَاظُوا
  text: أقاموا زمن القيظ، وهو الصيف.
- term: شَتَوْا
  text: 'أقاموا الشتاء؛ «فإن أقاموه في موضع قيل: شتوا» [@lisan، ج14 ص421].'
- term: ذَاتِ الْحَاذِ
  text: موضع.
- term: ثِنْيَيْ وُقُرْ
  text: منعطفي وادي وُقُر، وهو موضع.
