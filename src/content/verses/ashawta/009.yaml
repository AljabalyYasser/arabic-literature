first: وَعَلَى الْمَتْنَيْنِ مِنْهَا وَارِدٌ
second: حَسَنُ النَّبْتِ أَثِيثٌ مُسْبَكِرّ
vocabulary:
- term: الْمَتْنَيْنِ
  text: جانبي الظهر.
- term: وَارِدٌ
  text: 'شعر طويل؛ «وشعر وارد: مسترسل طويل» [@lisan، ج3 ص458].'
- term: أَثِيثٌ
  text: كثير ملتفّ.
- term: مُسْبَكِرّ
  text: الممتدّ الطويل، كما يشرحه الأعلم [@diwan-tarafa، ص63].
