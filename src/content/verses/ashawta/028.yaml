first: لَا كَبِيرٌ دَالِفٌ مِنْ هَرَمٍ
second: أَرْهَبُ اللَّيْلَ وَلَا كَلُّ الظُّفُرْ
vocabulary:
- term: دَالِفٌ
  text: 'يمشي مقاربًا خطوه؛ «الدليف: المشي الرويد» [@lisan، ج9 ص106].'
- term: هَرَمٍ
  text: كِبَر السنّ.
- term: كَلُّ الظُّفُرْ
  text: 'ضعيف لا ينال عدوه بأذى؛ «ويقال للمهين: هو كليل الظفر» [@lisan، ج4 ص518].'
