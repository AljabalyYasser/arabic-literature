first: جَابَةُ الْمِدْرَى لَهَا ذُو جُدَّةٍ
second: تَنْفُضُ الضَّالَ وَأَفْنَانَ السَّمُرْ
vocabulary:
- term: جَابَةُ الْمِدْرَى
  text: 'ظبية طلع قرنها أول طلوعه، من «جاب قرنها، أي قطع اللحم وطلع» [@lisan، ج1 ص285]، ويقال بالهمز: جأبة المدرى، «فنبّه بذلك على صغر سنها» [@lisan، ج1 ص248].'
- term: ذُو جُدَّةٍ
  text: ولد في ظهره خطّة؛ و«الجدة الخطة التي في ظهر الحمار تخالف لونه» [@lisan، ج3 ص108].
- term: تَنْفُضُ
  text: تحرّك.
- term: الضَّالَ
  text: 'السِّدر البرّي، والسَّمُر: ضرب من شجر الطلح.'
