explained: false
first: سَادِرًا أَحْسَبُ غَيِّي رَشَدًا
second: فَتَنَاهَيْتُ وَقَدْ صَابَتْ بِقُرّ
vocabulary:
- term: سَادِرًا
  text: «الذي لا يهتم لشيء ولا يبالي ما صنع» [@lisan، ج4 ص355].
- term: غَيِّي
  text: ضلالي.
- term: تَنَاهَيْتُ
  text: كففت وانتهيت.
- term: صَابَتْ بِقُرّ
  text: مثل «يضرب عند شدة تصيبهم، أي صارت الشدة في قرارها» [@maydani، ج1 ص402].
