explained: false
first: طَيِّبُو الْبَاءَةِ سَهْلٌ وَلَهُمْ
second: سُبُلٌ إِنْ شِئْتَ فِي وَحْشٍ وَعِرْ
vocabulary:
- term: الْبَاءَةِ
  text: 'المنزل؛ «والبيئة والباءة والمباءة: المنزل» [@lisan، ج1 ص39]. وقال الأعلم: «الساحة والفناء» [@khizana، ج8 ص188].'
- term: وَحْشٍ وَعِرْ
  text: 'قال الأعلم: «الوحش: المتوحش، وهو كناية عن خشونة الجانب وشدته» [@khizana، ج8 ص189]؛ أي هم وعرون على من أرادهم بسوء.'
