first: "فَاشْرَبْ هَنِيئًا عَلَيْكَ التَّاجُ مُرْتَفِقًا"
second: "فِي رَأْسِ غُمْدَانَ دَارًا مِنْكَ مِحْلَالَا"
vocabulary:
  - term: "مُرْتَفِقًا"
    text: "«المتكئ على مرفقه» [@aghani-dk، ج17 ص302]."
  - term: "غُمْدَانَ"
    text: "«اسم قصر كان لسيف بن ذي يزن باليمن» [@aghani-dk، ج17 ص302]."
  - term: "مِحْلَالَا"
    text: "«الدار التي يحل فيها، أي يقيم فيها» [@aghani-dk، ج17 ص302]."
