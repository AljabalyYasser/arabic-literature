explained: false
first: "لِيَطْلُبَ الْوِتْرَ أَمْثَالُ ابْنِ ذِي يَزَنٍ"
second: "رَيَّمَ فِي الْبَحْرِ لِلْأَعْدَاءِ أَحْوَالَا"
vocabulary:
  - term: "الْوِتْرَ"
    text: "الثأر."
  - term: "رَيَّمَ"
    text: "أقام، أو هو من رام يريم إذا برح، كأنه غاب أعوامًا ثم رجع لأعدائه، كما يشرحه محققو السيرة [@ibn-hisham، ج1 ص65]. ويُروى «لجّج»، أي خاض لجّة البحر."
  - term: "أَحْوَالَا"
    text: "أعوامًا، جمع حَوْل."
sources:
