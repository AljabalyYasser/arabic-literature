explained: false
first: "يَرْمُونَ عَنْ شُدُفٍ كَأَنَّهَا غُبُطٌ"
second: "بِزَمْخَرٍ يُعْجِلُ الْمَرْمِيَّ إِعْجَالَا"
vocabulary:
  - term: "شُدُفٍ"
    text: "الأشخاص العظام، يعني القِسيّ [@ibn-hisham، ج1 ص66]."
  - term: "غُبُطٌ"
    text: "جمع غَبيط، وهو عيدان الهودج، يشبّه بها القسيّ الفارسية [@ibn-hisham، ج1 ص66]."
  - term: "بِزَمْخَرٍ"
    text: "بقصب النُّشّاب، أي السهام [@ibn-hisham، ج1 ص66]."
  - term: "يُعْجِلُ"
    text: "من أعجل، ومصدره «إعجالا» في آخر البيت."
sources:
  - source: "ibn-hisham"
    loc: "ج1 ص66"
