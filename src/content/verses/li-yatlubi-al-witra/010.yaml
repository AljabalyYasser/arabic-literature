explained: false
first: "وَاشْرَبْ هَنِيئًا فَقَدْ شَالَتْ نَعَامَتُهُمْ"
second: "وَأَسْبِلِ الْيَوْمَ فِي بُرْدَيْكَ إِسْبَالَا"
vocabulary:
  - term: "شَالَتْ نَعَامَتُهُمْ"
    text: "هلكوا. والنعامة باطن القدم، ومن هلك ارتفعت رجلاه وانتكس رأسه فظهرت نعامة قدمه، كما يشرحه محققو السيرة [@ibn-hisham، ج1 ص66]."
  - term: "أَسْبِلِ"
    text: "أرخِ ثوبك، والمراد الخيلاء والإعجاب [@ibn-hisham، ج1 ص66]."
sources:
