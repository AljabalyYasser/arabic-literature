explained: false
first: "تِلْكَ الْمَكَارِمُ لَا قَعْبَانِ مِنْ لَبَنٍ"
second: "شِيبَا بِمَاءٍ فَعَادَا بَعْدُ أَبْوَالَا"
vocabulary:
  - term: "قَعْبَانِ"
    text: "تثنية قَعْب، وهو قدح يُحلب فيه [@ibn-hisham، ج1 ص66]."
  - term: "شِيبَا"
    text: "خُلطا، «وشيبا: معناه خلطا» [@aghani-dk، ج17 ص302]."
  - term: "أَبْوَالَا"
    text: "بولًا. يقول: هذه هي المكارم، لا أن تسقي ضيفك قدحين من لبن ممزوج بالماء."
