explained: false
first: "إِنَّ شِوَاءً وَنَشْوَةً"
second: "وَخَبَبَ الْبَازِلِ الْأَمُونِ"
vocabulary:
  - term: "شِوَاءً وَنَشْوَةً"
    text: "يقول محقق «الحماسة»: «الشواء اللحم المشوي والنشوة الخمر والسكر» [@tabrizi-hamasa، ج2 ص13]."
  - term: "خَبَبَ"
    text: "يقول محقق «الحماسة»: «والخبب ضرب من سير الإبل» [@tabrizi-hamasa، ج2 ص13]، وهو ضرب من العدو السريع."
  - term: "الْبَازِلِ"
    text: "يقول محقق «الحماسة»: «والبازل التي قد استكمل لها تسع سنين فتناهت قوتها» [@tabrizi-hamasa، ج2 ص13]."
  - term: "الْأَمُونِ"
    text: "يقول محقق «الحماسة»: «والأمون الناقة التي يؤمن عثارها» [@tabrizi-hamasa، ج2 ص13]."
sources:
  - source: "tabrizi-hamasa"
    loc: "ج2 ص13"
