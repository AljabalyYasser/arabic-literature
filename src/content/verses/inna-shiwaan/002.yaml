explained: false
first: "يُجَشِّمُهَا الْمَرْءُ فِي الْهَوَى"
second: "مَسَافَةَ الْغَائِطِ الْبَطِينِ"
vocabulary:
  - term: "يُجَشِّمُهَا"
    text: "يكلّفها."
  - term: "فِي الْهَوَى"
    text: "في ما يهواه ويطلبه."
  - term: "الْغَائِطِ الْبَطِينِ"
    text: "يقول محقق «الحماسة»: «والغائط المطمئن من الأرض والبطين الواسع الغامض» [@tabrizi-hamasa، ج2 ص13]، أي يقطع عليها الأرض الواسعة البعيدة."
sources:
