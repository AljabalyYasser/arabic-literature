explained: false
first: "وَالْبِيضَ يَرْفُلْنَ كَالدُّمَى"
second: "فِي الرَّيْطِ وَالْمُذْهَبِ الْمَصُونِ"
vocabulary:
  - term: "وَالْبِيضَ"
    text: "النساء الحسان. وهي منصوبة، يقول ابن بَرِّيّ: «والبيض منصوب على العطف على اسم إن في البيت قبله» [@lisan، ج14 ص271]."
  - term: "يَرْفُلْنَ"
    text: "يقول محقق «الحماسة»: «ويرفلن يتبخترن» [@tabrizi-hamasa، ج2 ص13]."
  - term: "كَالدُّمَى"
    text: "يقول محقق «الحماسة»: «والدمى جمع دمية بالضم وهي الصورة من العاج» [@tabrizi-hamasa، ج2 ص13]."
  - term: "الرَّيْطِ"
    text: "يقول محقق «الحماسة»: «والريط جمع ريطة وهي الملاءة الواسعة» [@tabrizi-hamasa، ج2 ص13]."
  - term: "وَالْمُذْهَبِ الْمَصُونِ"
    text: "يقول محقق «الحماسة»: «يريد به الثياب الفاخرة المطرزة بالذهب» [@tabrizi-hamasa، ج2 ص13]."
