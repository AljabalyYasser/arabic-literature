explained: false
first: "وَأَهْلَ جَاشٍ وَمَأْرِبٍ"
second: "وَحَيَّ لُقْمَانَ وَالتُّقُونِ"
vocabulary:
  - term: "جَاشٍ وَمَأْرِبٍ"
    text: "يقول محقق «الحماسة»: «جاش موضع باليمن ومأرب بلد من بلاد اليمن» [@tabrizi-hamasa، ج2 ص14]."
  - term: "لُقْمَانَ"
    text: "يقول محقق «الحماسة»: «ولقمان هو ابن عاديا» [@tabrizi-hamasa، ج2 ص14]."
  - term: "وَالتُّقُونِ"
    text: "في اللسان: «فجمعه على تقون لأنه أراد تقنا، ومن انتسب إليه. والتقون: من بني تقن بن عاد» [@lisan، ج13 ص73]."
