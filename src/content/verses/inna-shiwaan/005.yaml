explained: false
first: "مِنْ لَذَّةِ الْعَيْشِ وَالْفَتَى"
second: "لِلدَّهْرِ وَالدَّهْرُ ذُو فُنُونِ"
vocabulary:
  - term: "مِنْ لَذَّةِ الْعَيْشِ"
    text: "يقول محقق «الحماسة»: «من لذة العيش خبر إن في أول القطعة» [@tabrizi-hamasa، ج2 ص13]: كل ما سبق من لذة العيش."
  - term: "وَالْفَتَى لِلدَّهْرِ"
    text: "الإنسان هدف للدهر، يصيبه بما يشاء."
  - term: "ذُو فُنُونِ"
    text: "ذو ضروب وأحوال، لا يبقى على حال."
sources:
  - source: "tabrizi-hamasa"
    loc: "ج2 ص13"
    url: "https://shamela.ws/book/6907/460"
status: "review"
