explained: false
first: "وَالْكُثْرَ وَالْخَفْضَ آمِنًا"
second: "وَشَرَعَ الْمِزْهَرِ الْحَنُونِ"
vocabulary:
  - term: "الْكُثْرَ"
    text: "يقول محقق «الحماسة»: «الكثر المال الكثير» [@tabrizi-hamasa، ج2 ص13]."
  - term: "الْخَفْضَ"
    text: "يقول محقق «الحماسة»: «والخفض الراحة والدعة» [@tabrizi-hamasa، ج2 ص13]."
  - term: "شَرَعَ الْمِزْهَرِ الْحَنُونِ"
    text: "يقول محقق «الحماسة»: «والشرع أوتار العود وهو المزهر والحنون من الحنين وهو المطرب من الصوت» [@tabrizi-hamasa، ج2 ص13]."
sources:
