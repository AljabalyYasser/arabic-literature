explained: false
first: "أَهْلَكْنَ طَسْمًا وَبَعْدَهُ"
second: "غَذِيَّ بَهْمٍ وَذَا جُدُونِ"
vocabulary:
  - term: "أَهْلَكْنَ"
    text: "الضمير لفنون الدهر وحوادثه."
  - term: "طَسْمًا"
    text: "قبيلة من العرب البائدة، يقول محقق «الحماسة»: «طسم حي من اليمن» [@tabrizi-hamasa، ج2 ص14]."
  - term: "غَذِيَّ بَهْمٍ"
    text: "يقول ابن بَرِّيّ: «وإنما غذي بهم أحد أملاك حمير كان يغذى بلحوم البهم، قال وعليه قول سلمى بن ربيعة الضبي» [@lisan، ج12 ص57]. والبَهْم: صغار الضأن والمعز. أما محقق «الحماسة» فيجعل الغذيّ السخلة، أي ولد الشاة [@tabrizi-hamasa، ج2 ص14]."
  - term: "ذَا جُدُونِ"
    text: "ذو جَدَن، «قيل من أقيال حمير» [@lisan، ج13 ص86]، والقَيْل الملك دون الملك الأعظم."
