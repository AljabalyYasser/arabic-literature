explained: false
first: "جَعَلْتُ بَنِي الْهُجَيْمِ لَهُ دَوَارًا"
second: "إِذَا تَمْضِي جَمَاعَتُهُمْ تَعُودُ"
vocabulary:
- term: "بَنِي الْهُجَيْمِ"
  text: "حيّ من تميم: «وبَنُو الهُجَيم: بَطْنانِ: الهُجَيم بْنِ عَمْرِو بْنِ تَمِيمٍ» [@lisan، ج12 ص603]، وأحد البطنين من الأزد. وهي في الطبعة بفتح الهاء، وضبطناها كما في اللسان."
- term: "دَوَارًا"
  text: "صنم يُطاف حوله: «الدَّوَّارُ صَنَمٌ كَانَتِ الْعَرَبُ تَنْصِبُهُ يَجْعَلُونَ مَوْضِعًا حَوْلَهُ يَدُورُون بِهِ» [@lisan، ج4 ص297]، «والأَشهر في اسم الصنم دَوَارٌ، بِالْفَتْحِ» [@lisan، ج4 ص298]. ويقول الأَعْلَم: «أي جعلتهم يدورون» [@diwan-antara، ص282] «بفرسي كالصنم الذي يدار حوله، ويعكف عليه» [@diwan-antara، ص283]."
