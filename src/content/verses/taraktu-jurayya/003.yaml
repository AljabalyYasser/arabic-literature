explained: false
first: "إِذَا تَقَعُ الرِّمَاحُ بِجَانِبَيْهِ"
second: "تَوَلَّى قَابِعًا فِيهِ صُدُودُ"
vocabulary:
- term: "قَابِعًا"
  text: "«والقابع الذي يدخل رأسه» بين منكبيه [@diwan-antara، ص283]."
- term: "صُدُودُ"
  text: "إعراض. يقول الأَعْلَم في الفرس إذا وقعت الرماح بجانبيه: «تولى عن الخيل، فصد لما يجد من الألم» [@diwan-antara، ص283]."
