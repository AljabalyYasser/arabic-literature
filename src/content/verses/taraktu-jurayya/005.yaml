first: "وَهَلْ يَدْرِي جُرَيَّةُ أَنَّ نَبْلِي"
second: "يَكُونُ جَفِيرَهَا الْبَطَلُ النَّجِيدُ"
vocabulary:
- term: "جَفِيرَهَا"
  text: "«الجفير الكنانة التي تجعل فيها السهام» [@diwan-antara، ص284]."
- term: "الْبَطَلُ النَّجِيدُ"
  text: "«والنجيد الشجاع، أي يقع النبل فيه فيغيب فيكون كالكنانة» [@diwan-antara، ص284]."
