explained: false
first: "كَأَنَّ رِمَاحَهُمْ أَشْطَانُ بِئْرٍ"
second: "لَهَا فِي كُلِّ مَدْلَجَةٍ خُدُودُ"
vocabulary:
- term: "أَشْطَانُ بِئْرٍ"
  text: "حبال البئر: «شبه الرماح في طولها واستقامتها وتأثيرها بجانبي الفرس بحبال البئر» [@diwan-antara، ص284]."
- term: "مَدْلَجَةٍ"
  text: "ممشى الساقي بين البئر والحوض: «والمدلجة ما بين البئر والحوض، والدالج الذي يمشي بالدلو من البئر إلى الحوض» [@diwan-antara، ص284]."
- term: "خُدُودُ"
  text: "شقوق وآثار في الأرض، «والخَدّ والخُدَّة والأُخْدود: الْحُفْرَةُ تَحْفِرُهَا فِي الأَرض مُسْتَطِيلَةً» [@lisan، ج3 ص160]."
