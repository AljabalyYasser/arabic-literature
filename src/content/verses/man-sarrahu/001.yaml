first: "مَنْ سَرَّهُ كَرَمُ الْحَيَاةِ فَلَا يَزَلْ"
second: "فِي مِقْنَبٍ مِنْ صَالِحِي الْأَنْصَارِ"
meaning: "من أحب أن يعيش حياة كريمة فلا يزل في جماعة من فرسان الأنصار الصالحين."
vocabulary:
- term: "كَرَمُ الْحَيَاةِ"
  text: "العيش العزيز الكريم."
- term: "مِقْنَبٍ"
  text: "جماعة الفرسان؛ قال أبو عمرو: «المِقْنَب: ألف وأقل»، وقال الأَصْمَعِيّ: «هم الجماعة من الفوارس نحو الثلاثين أكثر وأقل» [@diwan-kaab، ص26]."
- term: "الْأَنْصَارِ"
  text: "أهل المدينة من الأوس والخزرج الذين نصروا النبي صلى الله عليه وسلم."
context: "مطلع القصيدة التي قالها كعب في الأنصار بعد «بانت سعاد». يروي ابن إسحاق عن عاصم بن عمر بن قتادة أن الأنصار غضبت حين عرّض بهم، «فَقَالَ بَعْدَ أَنْ أَسْلَمَ يَمْدَحُ الْأَنْصَارَ، وَيَذْكُرُ بَلَاءَهُمْ مَعَ رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَمَوْضِعَهُمْ مِنْ الْيَمَنِ» [@ibn-hisham، ج2 ص514]. وفي الديوان أن الأنصار هم الذين قالوا: «ألا ذكرتنا مع إخواننا من قريش!» [@diwan-kaab، ص25]. ويبدأ القصيدة بالمديح مباشرة بلا نسيب، لأنها جواب عن عتاب."
syntax:
- "«مَنْ» اسم شرط مبتدأ، و«سَرَّهُ كَرَمُ الْحَيَاةِ» فعل الشرط، و«كرم» فاعل، والهاء مفعول به."
- "«فَلَا يَزَلْ فِي مِقْنَبٍ» جواب الشرط مقترن بالفاء لأنه طلب، و«لا» ناهية، واسم «يزل» ضمير، و«في مقنب» خبرها."
- "«مِنْ صَالِحِي الْأَنْصَارِ» صفة لـ«مقنب»، وحُذفت نون «صالحين» للإضافة."
morphology:
- "«يَزَلْ» مضارع «زَالَ» الناقصة، مجزوم بلا الناهية، وحُذفت عينه لالتقاء الساكنين."
- "«مِقْنَبٍ» على «مِفْعَل»."
rhetoric:
  thesis: "يجعل صحبة الأنصار شرطًا لكرم الحياة: ليس المدح وصفًا، بل نصيحة لكل من يريد العزة."
  devices:
  - title: "أسلوب الشرط في «مَنْ سَرَّهُ ... فَلَا يَزَلْ»"
    text: "يخرج المديح في صورة حكم عام، فيبدو كأنه حقيقة لا مجاملة."
  - title: "«مِنْ صَالِحِي الْأَنْصَارِ»"
    text: "بعد التعريض بالأنصار في «بانت سعاد» يسمّيهم صراحة في القافية الأولى، فيقابل التعريض بالتصريح."
  connection: "ثم يصف أحلامهم وأكفّهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، وقبلها ألف (رِدْف)، وبعدها ياء الإطلاق: «ـارِي»"
  scansion: "مَنْ سَرْرَهُو / كَرَمُلْ حَيَا / ةِ فَلَا يَزَلْ = متْفاعلن / متَفاعلن / متَفاعلن — فِي مِقْنَبِنْ / مِنْ صَالِحِلْ / أَنْصَارِي = متْفاعلن / متْفاعلن / متْفاعلْ"
  note: "البيت كامل تام: «مَنْ سَرْرَهُو» متْفاعلن بالإضمار، وهو تسكين الثاني من «متَفاعلن». والضرب «أَنْصَارِي» متْفاعلْ، دخله الإضمار والقطع."
variants:
- reading: "مَنْ سَرَّهُ شَرَفُ الْحَيَاةِ"
  status: "رواية"
  note: "عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص154]، كما يذكر المحققون [@diwan-kaab، ص25]."
- reading: "فِي مِقْنَبٍ مِنْ صَالِحِ الْأَنْصَارِ"
  status: "رواية"
  note: "عند ابن سَلّام [@ibn-sallam، ج1 ص103]، وهي رواية الأحول كما يقول المحققون [@diwan-kaab، ص25]."
