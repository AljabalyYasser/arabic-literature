first: "يَتَطَهَّرُونَ كَأَنَّهُ نُسُكٌ لَهُمْ"
second: "بِدِمَاءِ مَنْ عَلِقُوا مِنَ الْكُفَّارِ"
meaning: "يتطهّرون بدماء من أدركوه من الكفار في القتال، كأن ذلك عبادة لهم. قال السُّكَّرِيّ: «النُّسُك: كل شيء ذُبح في الحرم، وجمعه أنساك» [@diwan-kaab، ص35]."
vocabulary:
- term: "يَتَطَهَّرُونَ"
  text: "يتخذونه طهارة."
- term: "نُسُكٌ"
  text: "«كل شيء ذُبح في الحرم» [@diwan-kaab، ص35]، أي قربان وعبادة."
- term: "عَلِقُوا"
  text: "أدركوا وتعلّقوا به في القتال، وفي حاشية ضَيْف: «علقوا: قتلوا» [@deif، ج2 ص86]."
context: "يصف قتال الأنصار في سبيل الدين بلغة العبادة. والبيت مما يرويه ابن سَلّام في الأبيات الأربعة التي يختارها من القصيدة [@ibn-sallam، ج1 ص103]، وابن قُتَيْبة [@ibn-qutayba، ج1 ص155]، والسيرة [@ibn-hisham، ج2 ص514]."
syntax:
- "«يَتَطَهَّرُونَ» فعل وفاعل، و«بِدِمَاءِ» متعلق به، و«مَنْ» موصولة مضاف إليه، و«عَلِقُوا» صلتها."
- "«كَأَنَّهُ نُسُكٌ لَهُمْ» جملة معترضة، والضمير في «كأنه» للتطهر المفهوم من الفعل. و«مِنَ الْكُفَّارِ» بيان لـ«من»."
morphology:
- "«يَتَطَهَّرُونَ» مضارع «تَطَهَّرَ» على «تَفَعَّلَ»."
- "«نُسُكٌ» مصدر على «فُعُل»، ويُطلق على الذبيحة."
rhetoric:
  thesis: "يحوّل القتال إلى عبادة: الدم الذي يُسفك في سبيل الدين طهارة وقربان."
  devices:
  - title: "التشبيه في «كَأَنَّهُ نُسُكٌ لَهُمْ»"
    text: "شبّه القتال بالنُّسُك، أي الذبح في الحرم تقربًا. والشبه لا يُرى، بل يُدرك بالتأوّل: كلاهما دم يُراق طاعةً. وهو من الضرب الذي يقول فيه عبد القاهر الجُرْجانيّ إن الشبه فيه «محصّلاً بضرب من التأوّل» [@asrar، ص90]."
  - title: "المفارقة في «يَتَطَهَّرُونَ ... بِدِمَاءِ»"
    text: "الدم في عرف الناس نجاسة، والشاعر يجعله طهارة. والمفارقة تلفت السامع إلى المعنى الجديد الذي جاء به الإسلام في القتال."
  connection: "ثم ينتقل في رواية السُّكَّرِيّ إلى رحلته إليهم في الهاجرة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، وقبلها ألف (رِدْف)، وبعدها ياء الإطلاق: «ـارِي»"
  scansion: "يَتَطَهْهَرُو / نَ كَأَنْنَهُو / نُسُكُنْ لَهُمْ = متَفاعلن / متَفاعلن / متَفاعلن — بِدِمَاءِ مَنْ / عَلِقُو مِنَلْ / كُفْفَارِي = متَفاعلن / متَفاعلن / متْفاعلْ"
  note: "البيت كامل تام: الصدر كله «متَفاعلن» ثلاث مرات، وهو قليل في القصيدة."
variants:
- reading: "يَتَطَهَّرُونَ يَرَوْنَهُ نُسُكًا لَهُمْ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص514]، وعند أبي الفَرَج [@aghani-dk، ج17 ص90]."
