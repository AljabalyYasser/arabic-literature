first: "وَرِثُوا السِّيَادَةَ كَابِرًا عَنْ كَابِرٍ"
second: "إِنَّ الْكِرَامَ هُمُ بَنُو الْأَخْيَارِ"
meaning: "ورثوا السيادة كبيرًا شريفًا عن كبير شريف، فالكرام هم أبناء الخيار. ويقول المحققون: «أي كبيرًا شريفًا عن كبير شريف» [@diwan-kaab، ص32]."
vocabulary:
- term: "السِّيَادَةَ"
  text: "«مصدر ساد يسود سؤددًا وسيادة» [@diwan-kaab، ص32]."
- term: "كَابِرًا عَنْ كَابِرٍ"
  text: "كبيرًا عن كبير. ويذكر المحققون عن المرزوقي: «لم يوجد كابر بمعنى كبير إلا في هذا المكان»، وعن أبي علي: «كابر ليس اسم فاعل إنما هو صيغة للجمع كالباقر. والمراد كبراء بعد كبراء» [@diwan-kaab، ص32]."
- term: "الْأَخْيَارِ"
  text: "جمع خيِّر."
context: "بعد صفات الأنصار في الحرب والكرم ينتقل إلى نسبهم: الشرف عندهم موروث. ويروي ابن سَلّام أن هذه الأبيات قالها حين أنكرت قريش تعريضه بالأنصار [@ibn-sallam، ج1 ص102–103]، وهو البيت الثاني في رواية السيرة [@ibn-hisham، ج2 ص514]، والأخير في الأبيات التي يوردها شوقي ضَيْف [@deif، ج2 ص87]."
syntax:
- "«السِّيَادَةَ» مفعول «ورثوا»، و«كَابِرًا» حال، و«عَنْ كَابِرٍ» متعلق بـ«كابرًا»."
- "«إِنَّ الْكِرَامَ هُمُ بَنُو الْأَخْيَارِ»: «الكرام» اسم «إنّ»، و«هم» ضمير فصل للتوكيد، و«بنو» خبر مرفوع بالواو لأنه ملحق بجمع المذكر السالم."
morphology:
- "«كَابِرًا» على «فاعل»، والجمهور يجعلونه اسم فاعل بمعنى كبير، وأبو علي يجعله اسم جمع كما سبق."
- "«الْأَخْيَارِ» جمع «خَيِّر» على «أَفْعَال»."
rhetoric:
  thesis: "يجمع للأنصار شرف الفعل وشرف الأصل."
  devices:
  - title: "التكرار في «كَابِرًا عَنْ كَابِرٍ»"
    text: "الكلمة مكررة بحرف «عن» بينهما، فتصور الوراثة سلسلة متصلة: كبير يسلّم إلى كبير."
  - title: "التذييل في «إِنَّ الْكِرَامَ هُمُ بَنُو الْأَخْيَارِ»"
    text: "يختم البيت بحكم عام يؤكد ما قبله، وضمير الفصل «هم» يحصر الكرم فيهم."
  connection: "ثم يرجع نسبهم إلى غسان وأصلهم المنيع."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، وقبلها ألف (رِدْف)، وبعدها ياء الإطلاق: «ـارِي»"
  scansion: "وَرِثُسْ سِيَا / دَةَ كَابِرَنْ / عَنْ كَابِرِنْ = متَفاعلن / متَفاعلن / متْفاعلن — إِنْنَلْ كِرَا / مَ هُمُو بَنُلْ / أَخْيَارِي = متْفاعلن / متَفاعلن / متْفاعلْ"
  note: "«وَرِثُسْ سِيَا» و«دَةَ كَابِرَنْ» متَفاعلن تامتان، و«عَنْ كَابِرِنْ» متْفاعلن بالإضمار. وتُشبع ميم «هُمُ» في العجز."
variants:
- reading: "وَرِثُوا الْمَكَارِمَ كَابِرًا عَنْ كَابِرٍ / إِنَّ الْخِيَارَ هُمُ بَنُو الْأَخْيَارِ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص514]، و«إن الخيار» رواية الأحول كما يقول المحققون [@diwan-kaab، ص32]."
