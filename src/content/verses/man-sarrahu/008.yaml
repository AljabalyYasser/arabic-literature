  text: "«إذا لم يكن لها مطر» [@diwan-kaab، ص28]، أي في الجدب."
- term: "مَقَارِي"
  text: "«واحد المقاري مِقْرى مقصور» [@diwan-kaab، ص28]، وهو الذي يقري الضيف."
