first: "صَدَمُوا عَلِيًّا يَوْمَ بَدْرٍ صَدْمَةً"
second: "دَانَتْ عَلِيٌّ بَعْدَهَا لِنِزَارِ"
meaning: "صدموا بني عليّ يوم بدر صدمة خضعت بعدها بنو عليّ لنِزار. وبنو عليّ عند ابن سَلّام «بنى على بن مَسْعُود وهم بَنو كنَانَة» [@ibn-sallam، ج1 ص103]، أي من قريش وأحلافها الذين قاتلوا يوم بدر."
vocabulary:
- term: "صَدَمُوا"
  text: "ضربوا ضربة قوية في الحرب."
- term: "عَلِيًّا"
  text: "قبيلة لا رجل. ونقل السُّكَّرِيّ فيه أقوالًا: «علي هو علي بن بكر بن وائل»، أو «علي أخو عبد مناة بن كنانة بن خزيمة من أمه»، أو علي بن مسعود الأزدي، «فحضن علي بن مسعود بني أخيه عبد مناة فغلب عليهم» [@diwan-kaab، ص34]. ويقول ابن سَلّام: «يعْنى بنى على بن مَسْعُود وهم بَنو كنَانَة» [@ibn-sallam، ج1 ص103]."
- term: "دَانَتْ"
  text: "خضعت وانقادت."
- term: "نِزَارِ"
  text: "نزار بن معد، أبو مضر وربيعة، أي عرب الشمال، والأنصار من اليمن."
context: "يذكر يوم بدر، أكبر بلاء الأنصار مع النبي صلى الله عليه وسلم، وهو ما يقول ابن إسحاق إن كعبًا أراده: «وَيَذْكُرُ بَلَاءَهُمْ مَعَ رَسُولِ اللَّهِ» [@ibn-hisham، ج2 ص514]. وفي البيت مفارقة: الأنصار، وأصلهم من اليمن، أخضعوا قبيلة من نزار."
syntax:
- "«عَلِيًّا» مفعول «صدموا»، و«يَوْمَ بَدْرٍ» ظرف، و«صَدْمَةً» مفعول مطلق."
- "جملة «دَانَتْ عَلِيٌّ بَعْدَهَا لِنِزَارِ» صفة لـ«صدمة». وأنّث الفعل «دانت» لأن «عليّ» هنا اسم قبيلة."
morphology:
- "«عَلِيٌّ» صُرف وهو اسم قبيلة، لأنه في الأصل اسم رجل مصروف."
- "«صَدْمَةً» مصدر المرة من «صَدَمَ» على «فَعْلَة»."
rhetoric:
  thesis: "يوم واحد يغير موازين القبائل."
  devices:
  - title: "الجناس في «صَدَمُوا ... صَدْمَةً»"
    text: "الفعل ثم مصدر المرة منه: ضربة واحدة كانت كافية."
  - title: "المجاز المرسل في «عَلِيًّا»"
    text: "ذكر الجدّ وأراد بنيه، فصار اسم رجل اسمًا لقبيلة. وقد التبس الاسم على بعض من رواه، فروي البيت لحسان كما يذكر المحققون عن شرح القاموس، وقالوا: «ولم أجده في ديوانه وإنما هو لكعب» [@diwan-kaab، ص34]."
  connection: "ثم يصف تطهّرهم بدماء الكفار."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، وقبلها ألف (رِدْف)، وبعدها ياء الإطلاق: «ـارِي»"
  scansion: "صَدَمُو عَلِيْ / يَنْ يَوْمَ بَدْ / رِنْ صَدْمَةَنْ = متَفاعلن / متْفاعلن / متْفاعلن — دَانَتْ عَلِيْ / يُنْ بَعْدَهَا / لِنِزَارِي = متْفاعلن / متْفاعلن / متَفاعلْ"
  note: "«صَدَمُو عَلِيْ» متَفاعلن تامة، و«يَنْ يَوْمَ بَدْ» متْفاعلن بالإضمار. والضرب «لِنِزَارِي» متَفاعلْ مقطوع."
variants:
- reading: "ضَرَبُوا عَلِيًّا يَوْمَ بَدْرٍ ضَرْبَةً / دَانَتْ لِوَقْعَتِهَا جَمِيعُ نِزَارِ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص515]، ويذكرها المحققون عن شرح القاموس [@diwan-kaab، ص34]."
- reading: "ذَلَّتْ لِوَقْعَتِهَا جَمِيعُ نِزَارِ"
  status: "رواية"
  note: "عند ابن سَلّام [@ibn-sallam، ج1 ص103]، وعند ضَيْف «دانت لوقعتها» [@deif، ج2 ص86]، وعند أبي الفَرَج «صدموا الكتيبة ... ذلت لوقعتها رقاب نزار» [@aghani-dk، ج17 ص90]."
