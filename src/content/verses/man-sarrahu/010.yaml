explained: false
first: "وَالْمُطْعِمُونَ الضَّيْفَ حِينَ يَنُوبُهُمْ"
second: "مِنْ لَحْمِ كُومٍ كَالْهِضَابِ عِشَارِ"
vocabulary:
- term: "يَنُوبُهُمْ"
  text: "«يأتيهم» [@diwan-kaab، ص29]."
- term: "كُومٍ"
  text: "جمع كوماء، وهي «العظيمة السَّنام» [@diwan-kaab، ص29]."
- term: "عِشَارِ"
  text: "جمع عُشَراء، وهي «التي أتت عليها عشرة أشهر من حملها، وهي أعزّ عليهم» [@diwan-kaab، ص29]."
