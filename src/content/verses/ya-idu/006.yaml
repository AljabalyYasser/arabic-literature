explained: false
first: "كَأَنَّمَا حَثْحَثُوا حُصًّا قَوَادِمُهُ"
second: "أَوْ أُمَّ خِشْفٍ بِذِي شَثٍّ وَطُبَّاقِ"
vocabulary:
  - term: "حَثْحَثُوا"
    text: "بمعنى حثّوا وحرّكوا [@tabrizi-ikhtiyarat، ج1 ص110]."
  - term: "حُصًّا قَوَادِمُهُ"
    text: "«ظليماً قد تناثر ريشه»، والظليم ذكر النعام، والقوادم: ريشات الجناح الأولى [@tabrizi-ikhtiyarat، ج1 ص111]."
  - term: "أُمَّ خِشْفٍ"
    text: "«ظبية»، والخِشْف ولدها [@tabrizi-ikhtiyarat، ج1 ص111]."
  - term: "شَثٍّ وَطُبَّاقِ"
    text: "«نبتان يقوّيان الراعية ويضمّرانها» [@tabrizi-ikhtiyarat، ج1 ص111]."
