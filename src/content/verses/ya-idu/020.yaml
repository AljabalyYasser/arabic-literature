explained: false
first: "بَلْ مَنْ لِعَذَّالَةٍ خَذَّالَةٍ أَشِبٍ"
second: "حَرَّقَ بِاللَّوْمِ جِلْدِي أَيَّ تَحْرَاقِ"
vocabulary:
  - term: "عَذَّالَةٍ خَذَّالَةٍ"
    text: "كثير العذل، كثير الخذلان؛ «و«الخذّالة»: الذي يخذله في إرادته ويخالفه فيها» [@tabrizi-ikhtiyarat، ج1 ص130]."
  - term: "أَشِبٍ"
    text: "«المخلَّط عليه المعترض» [@tabrizi-ikhtiyarat، ج1 ص130]."
  - term: "أَيَّ تَحْرَاقِ"
    text: "منصوب على المصدر «وفيه معنى التعجّب أيضاً»، «وهو مَثَل لشدّة تأثير اللوم في جسد الملوم» [@tabrizi-ikhtiyarat، ج1 ص131]."
