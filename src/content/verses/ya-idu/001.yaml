first: "يَا عِيدُ مَا لَكَ مِنْ شَوْقٍ وَإِيرَاقِ"
second: "وَمَرِّ طَيْفٍ عَلَى الأَهْوَالِ طَرَّاقِ"
meaning: "يا هذا الذي يعاودني كل حين، ما أعجب ما بك من شوق وسهر، ومن خيال يمرّ بي ليلًا ويقطع إليّ الأهوال!"
vocabulary:
  - term: "عِيدُ"
    text: "ما يعتاد الإنسان ويعاوده، «فكأنه صار اسماً لما اعتاد الإنسان من حزن أو مرض أو شوق» [@tabrizi-ikhtiyarat، ج1 ص96]."
  - term: "إِيرَاقِ"
    text: "السهر، ويفسّره محقق شرح التِّبْرِيزِيّ بأنه «التأريق. وهو مصدر آرق يؤرق» [@tabrizi-ikhtiyarat، ج1 ص95]."
  - term: "طَيْفٍ"
    text: "«الخيال» [@tabrizi-ikhtiyarat، ج1 ص97]، أي صورة المحبوبة تأتي في النوم."
  - term: "الأَهْوَالِ"
    text: "المخاوف، جمع هَوْل."
  - term: "طَرَّاقِ"
    text: "كثير الطروق، و«طرّاق»: «فعّال من الطروق، لا يكون إلا ليلاً» [@tabrizi-ikhtiyarat، ج1 ص97]."
context: "مطلع القصيدة التي افتتح بها المُفَضَّل الضَّبّيّ اختياره، فهي «المفضلية الأولى». يبدأ تأبّط شرًّا بالشوق والطيف كعادة المطالع، ثم يخرج سريعًا إلى ما يعنيه: نجاته من بَجِيلة، ثم الرجل الذي يستحق البكاء، ثم ردّه على العاذلة. وخبر الغارة على بجيلة ونجاته منها في «الأغاني» على أكثر من رواية [@aghani-dk، ج21 ص133–134]."
syntax:
  - "«يا عيدُ» «نداء مفرد معرفة»، لأنه «بطول الإلف له واتصال المقاساة له، صار عنده كالشيء المخصوص المعين. فكأنه قال: يا أيها العيد» [@tabrizi-ikhtiyarat، ج1 ص95]، [@tabrizi-ikhtiyarat، ج1 ص96]."
  - "«ما» مبتدأ و«لك» خبره، «و«من» في قوله «من شوق» تبيين» [@tabrizi-ikhtiyarat، ج1 ص97]."
  - "«ومرِّ طيفٍ» مجرور بالعطف على «شوق»، و«طرّاقِ» صفة لـ«طيف»، و«على الأهوال» متعلق بـ«طرّاق»."
morphology:
  - "«عِيد» من العَوْد، «واشتقاقه من العود الذي هو الرجوع، إلا أنه جُعل الياء فيه عوضاً لازماً» [@tabrizi-ikhtiyarat، ج1 ص96]، فلم ترجع الواو في جمعه، فقيل: أعياد."
  - "«طرّاق» «وهو بناء المبالغة، وليس باسم الفاعل لـ«طرَق» مخففاً ولا لـ«طرّق» مشدداً، لأن فاعلهما: طارق ومطرّق» [@tabrizi-ikhtiyarat، ج1 ص97]."
  - "«طَيْف» مصدر «طاف يطيف»، «وقيل: أصل طيف طيّف، فخفّف» [@tabrizi-ikhtiyarat، ج1 ص97]."
  - "«إيراق» على «إفعال» مصدر «أَأْرَقَ» بمعنى أرّق، قُلبت الهمزة الثانية ياء."
rhetoric:
  thesis: "يفتتح الصعلوك قصيدته بما يفتتح به الشعراء: شوق وطيف. لكنه يجعل الطيف يقطع الأهوال إليه، كأنه هو أيضًا صعلوك يسري في الليل."
  devices:
    - title: "الاستفهام للتعجب"
      text: "«مالك» لا يسأل عن شيء، بل يتعجب، يقول التِّبْرِيزِيّ: «لفظه استفهام ومعناه التعجب» [@tabrizi-ikhtiyarat، ج1 ص96]، و«كلّ هذا يُراد به التعجب، وإن كان أكثر اللفظ بها متردّداً بين الاستفهام والنداء» [@tabrizi-ikhtiyarat، ج1 ص97]."
    - title: "نداء ما لا يعقل"
      text: "نادى الشوقَ المعتاد كما يُنادى رجل حاضر، لأنه «صار عنده كالشيء المخصوص المعين» [@tabrizi-ikhtiyarat، ج1 ص96]. والنداء يجعل الهمّ شخصًا يُخاطَب، وهذا من الاستعارة التي تعطي المعنى صفة الحيّ، وهي عند عبد القاهر أن تجيء «إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "التصريع"
      text: "بين «إيراقِ» في آخر الصدر و«طرّاقِ» في آخر العجز. والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]."
    - title: "الإجمال ثم التفصيل"
      text: "يقول التِّبْرِيزِيّ في سبب قوله «يا عيد» وحده: «لمّا كان العيد ينصرف إلى أشياء كثيرة قد عدّدها، وهي الشوق والخيال والإيراق، وكان مجموعها لا يبين من لفظة عيد، أجملَ بالنداء وفصّل في التفسير» [@tabrizi-ikhtiyarat، ج1 ص97]."
  connection: "ثم يصف هذا الطيف: يسري حافيًا على التعب والحيات، ويفديه الشاعر بنفسه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المكسورة، فهي قافية"
  scansion: "يَا عِي دُ مَا / لَ كَ مِنْ / شَوْ قِنْ وَ إِي / رَا قِي = مستفعلن / فعِلن / مستفعلن / فعْلن — وَ مَرْ رِ طَيْ / فِنْ عَ لَلْ / أَهْ وَا لِ طَرْ / رَا قِي = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]. والضرب في هذه القصيدة مقطوع «فعْلن»، والقطع: «حذف آخر الوتد المجموع وتسكين ما قبله» [@atiq، ص48]، والعروض مخبونة «فعِلن». وتُمدّ كسرة القاف في آخر البيت فتُنطق «قِي». والبيت مصرّع، فجاءت عروضه مقطوعة مثل ضربه «فعْلن». ودخل الخبن «فاعلن» الأولى في الصدر «لَكَ مِنْ» فصارت «فعِلن»، و«مستفعلن» الأولى في العجز «وَمَرْرِطَيْ» فصارت «متفعلن». والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
variants:
  - reading: "يَا عِيدَ مَالِكَ مِنْ شَوْقٍ وَإِيرَاقِ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«على الإضافة. ويكون «ما» بمعنى الذي و«لك» من صلته، كأنه قال: يا عيدَ الذي لك من شوق» [@tabrizi-ikhtiyarat، ج1 ص97]."
