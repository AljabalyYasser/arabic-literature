explained: false
first: "فَذَاكَ هَمِّي وَغَزْوِي أَسْتَغِيثُ بِهِ"
second: "إِذَا اسْتَغَثْتَ بِضَافِي الرَّأْسِ نَغَّاقِ"
vocabulary:
  - term: "بِضَافِي الرَّأْسِ"
    text: "«برجل كثير الشعر. وإنما جعله ضافي الشعر لكثرة اشتغاله بالغزو، فهو لا يشدّ شعره ولا يتعاهده» [@tabrizi-ikhtiyarat، ج1 ص123]."
  - term: "نَغَّاقِ"
    text: "كثير الصياح، يطول صوته «في أثر الطرائد التي يسوقها» [@tabrizi-ikhtiyarat، ج1 ص123]. ويرى التِّبْرِيزِيّ أن «الرواية الجيدة: «نعّاق» بعين غير معجمة، من قولهم: نعق بالغنم» [@tabrizi-ikhtiyarat، ج1 ص124]."
