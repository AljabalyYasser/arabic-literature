first: "حَمَّالِ أَلْوِيَةٍ شَهَّادِ أَنْدِيَةٍ"
second: "قَوَّالِ مُحْكَمَةٍ جَوَّابِ آفَاقِ"
meaning: "هو رجل يحمل رايات الجيش، ويحضر مجالس القوم، ويقول الكلمة الفاصلة التي تُحسم بها الأمور، ويقطع نواحي الأرض."
vocabulary:
  - term: "أَلْوِيَةٍ"
    text: "«جمع لواء الجيش» [@tabrizi-ikhtiyarat، ج1 ص122]."
  - term: "أَنْدِيَةٍ"
    text: "«جمع نادٍ. والنادي: المجلس» [@tabrizi-ikhtiyarat، ج1 ص122]."
  - term: "مُحْكَمَةٍ"
    text: "«الكلمة الفاصلة القاطعة للأمور. وأصل الإحكام: المنع» [@tabrizi-ikhtiyarat، ج1 ص122]."
  - term: "آفَاقِ"
    text: "«جمع أفق، وهي نواحي الأرض» [@tabrizi-ikhtiyarat، ج1 ص122]."
  - term: "جَوَّابِ"
    text: "كثير الجَوْب، أي القطع والسير في الأرض."
context: "من الأبيات التي يقول فيها الشاعر إنه لا يبكي على امرأة صرمته، بل «لكنما عَوَلي إن كنت ذا عَوَل على بصير بكسب الحمد سبّاق»، ثم يصف هذا الرجل في أربعة أبيات، وهذا آخرها وأشهرها. ويقول التِّبْرِيزِيّ في معناه: «يريد أنه رئيس» [@tabrizi-ikhtiyarat، ج1 ص122]. والرجل الموصوف صورة لما يريد الشاعر أن يكونه، وهذه قراءتنا."
syntax:
  - "الألفاظ الأربعة «حمّال» و«شهّاد» و«قوّال» و«جوّاب» مجرورة صفاتٍ لـ«بصير» في البيت العاشر، تتابعت بلا عاطف."
  - "كل صفة منها مضافة إلى مفعولها: «حمّال ألوية» أي يحمل الألوية، وهي إضافة اسم المبالغة إلى معموله."
  - "«محكمة» صفة لموصوف محذوف، أي: كلمة محكمة."
morphology:
  - "«حمّال» و«شهّاد» و«قوّال» و«جوّاب» على «فعّال» من أوزان المبالغة، تدل على الكثرة والاعتياد."
  - "«ألوية» و«أندية» على «أفعلة» من جموع القلة، و«آفاق» على «أفعال»."
  - "«مُحْكَمة» اسم مفعول من «أحكم» على «أفعل»."
rhetoric:
  thesis: "أربع صفات في أربع كلمات: القيادة في الحرب، والحضور في المجلس، والرأي، والسفر. فالبيت يجمع الرجل الكامل عند العرب في بيت واحد."
  devices:
    - title: "الترصيع"
      text: "قُسّم البيت أربعة أجزاء على نسق واحد: صيغة «فعّال» ثم مضاف إليه على «أفعلة» أو ما يقاربها. والترصيع عند أبي هلال العَسْكَرِيّ «أن يكون حشو البيت مسجوعا، وأصله من قولهم: رصّعت العقد، إذا فصّلته» [@sinaatayn، ص375]."
    - title: "تتابع الصفات"
      text: "أربع صفات بلا واو عطف، كل واحدة منها تامة بنفسها، فيأتي البيت كأنه عدّ سريع لمناقب الرجل. وهذه قراءتنا."
    - title: "الحذف في «قوّال محكمة»"
      text: "حذف الموصوف «كلمة» وأبقى صفتها، لأن المقصود هو الإحكام لا الكلام. ويقول عبد القاهر في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
  connection: "ثم يرجع إلى نفسه: «فذاك همّي وغزوي أستغيث به إذا استغثتَ بضافي الرأس نغّاق»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المكسورة، فهي قافية"
  scansion: "حَمْ مَا لِ أَلْ / وِ يَ تِنْ / شَهْ هَا دِ أَنْ / دِ يَ تِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — قَوْ وَا لِ مُحْ / كَ مَ تِنْ / جَوْ وَا بِ آ / فَا قِي = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]. والضرب في هذه القصيدة مقطوع «فعْلن»، والقطع: «حذف آخر الوتد المجموع وتسكين ما قبله» [@atiq، ص48]، والعروض مخبونة «فعِلن». وتُمدّ كسرة القاف في آخر البيت فتُنطق «قِي». ودخل الخبن «فاعلن» الأولى في الشطرين «وِيَتِنْ» و«كَمَتِنْ» فصارت «فعِلن». والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
variants:
  - reading: "شَهَّادِ أَنْجِيَةٍ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«وهي جمع النجيّ. والمعنى: أنه يشهد مناجاة الرؤساء عند الخطوب، فبرأيه يبرمون، وبقوله يحلّون ويعقدون» [@tabrizi-ikhtiyarat، ج1 ص122]."
