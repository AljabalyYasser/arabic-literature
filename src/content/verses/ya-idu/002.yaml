explained: false
first: "يَسْرِي عَلَى الأَيْنِ وَالحَيَّاتِ مُحْتَفِيًا"
second: "نَفْسِي فِدَاؤُكَ مِنْ سَارٍ عَلَى سَاقِ"
vocabulary:
  - term: "الأَيْنِ"
    text: "الإعياء والتعب [@lisan، ج13 ص44]."
  - term: "مُحْتَفِيًا"
    text: "حافياً، «وهو الذي لا حذاء عليه»، كأنه يقصد «الحُفاة الرَّجّالة خاصة دون الرُّكبان» [@tabrizi-ikhtiyarat، ج1 ص101]."
  - term: "سَارٍ عَلَى سَاقِ"
    text: "ماشٍ على قدمه في الليل، والمعنى: «تفديك نفسي من سارٍ على قدم» [@tabrizi-ikhtiyarat، ج1 ص101]."
