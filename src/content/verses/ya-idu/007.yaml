first: "لَا شَيْءَ أَسْرَعُ مِنِّي لَيْسَ ذَا عُذَرٍ"
second: "وَذَا جَنَاحٍ بِجَنْبِ الرَّيْدِ خَفَّاقِ"
meaning: "لا شيء أسرع مني في عَدْوي تلك الليلة، لا فرس ذو ناصية، ولا طائر يخفق بجناحيه عند أعلى الجبل."
vocabulary:
  - term: "ذَا عُذَرٍ"
    text: "«يعني بـ«ذي عذر» فرساً. والعذر: ما أقبل من شعر الناصية على الوجه» [@tabrizi-ikhtiyarat، ج1 ص112]."
  - term: "الرَّيْدِ"
    text: "«الشمراخ الأعلى في الجبل» [@tabrizi-ikhtiyarat، ج1 ص112]."
  - term: "خَفَّاقِ"
    text: "«الكثير الخفق بالجناح» [@tabrizi-ikhtiyarat، ج1 ص112]."
  - term: "ذَا جَنَاحٍ"
    text: "الطائر، «وإنما خصّ جارح الجبل لأنه أسرع طيراناً من جارح السهل» [@tabrizi-ikhtiyarat، ج1 ص112]."
context: "في وصف عَدْوه ليلة بجيلة. وقوله «لا شيء أسرع مني» «إشارة منه إلى حاله في عدوه في ذلك الوقت، بدليل قوله في البيت الذي يليه «حتى نجوتُ»» [@tabrizi-ikhtiyarat، ج1 ص113]، فليس فخرًا عامًّا بالسرعة في كل حين."
syntax:
  - "«لا» نافية للجنس، و«شيءَ» اسمها مبني على الفتح، و«أسرعُ» خبرها [@tabrizi-ikhtiyarat، ج1 ص113]."
  - "«ليس ذا عذر» فيه وجوه عند التِّبْرِيزِيّ: أن تكون «ليس» بمعنى «لا» فلا تعمل، «فقد قال سيبويه: وبعضهم يجعل «ليس» كـ«ما» و«لا» فلا يعمله في شيء» [@tabrizi-ikhtiyarat، ج1 ص113]؛ أو أن تكون للاستثناء، «وانتصب «ذا عذر» بقوله «ليس» واسمه مضمر فيه» [@tabrizi-ikhtiyarat، ج1 ص114]."
  - "ويرجّح التِّبْرِيزِيّ الاستثناء، فيقول بعد تقديره: «وهو الوجه» [@tabrizi-ikhtiyarat، ج1 ص114]، أي: ليس الأسرعُ ذا عذر."
  - "ويجوز عنده أن تكون الجملة صفة لـ«شيء»، «لأن الخليل جوّز الوصف بـ«ليس» و«لا يكون» في الاستثناء» [@tabrizi-ikhtiyarat، ج1 ص114]."
  - "«وذا جناح» معطوف على «ذا عذر»، و«خفّاقِ» مجرور صفةً لـ«جناحٍ» فصل بينهما الجار والمجرور «بجنب الريد»، والمعنى للطائر، فـ«الخفّاق»: «الكثير الخفق بالجناح» [@tabrizi-ikhtiyarat، ج1 ص112]."
morphology:
  - "«أسرع» على «أفعل» للتفضيل."
  - "«خفّاق» على «فعّال» من أوزان المبالغة، من الخفق وهو «ضرب الشيء بالشيء العريض» [@tabrizi-ikhtiyarat، ج1 ص112]."
  - "«عُذَر» جمع «عُذْرة» على «فُعَل»، كغُرفة وغُرَف."
rhetoric:
  thesis: "يضع الشاعر نفسه فوق الفرس والطائر، أسرع ما يعرفه الإنسان في البرّ والهواء. فالنجاة عند الصعلوك لا تكون بالسلاح، بل بالقدمين."
  devices:
    - title: "المبالغة بالنفي"
      text: "نفى أن يكون شيء أسرع منه، ثم استثنى أسرع ما في الأرض والسماء ليجعلهما في مرتبته أو دونه. وهذه قراءتنا."
    - title: "الكناية عن الموصوف"
      text: "لم يقل: فرس وطائر، بل «ذا عذر» و«ذا جناح»، فذكر صفة كل منهما ودلّ بها عليه، وهو ما يسميه عبد القاهر مجيئًا إلى معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]. ويقول التِّبْرِيزِيّ: «يعني بـ«ذي عذر» فرساً» [@tabrizi-ikhtiyarat، ج1 ص112]."
    - title: "التخصيص في «بجنب الريد»"
      text: "اختار الطائر الذي يسكن قمم الجبال، و«جارح الجبل يصيد الطير وما حلّق في الهواء، فهو أشدّ لطيرانه» [@tabrizi-ikhtiyarat، ج1 ص112]، فالمقارنة بأسرع الطير لا بأيّها."
  connection: "ثم يتم الخبر: «حتى نجوت ولمّا ينزعوا سَلَبي»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المكسورة، فهي قافية"
  scansion: "لَا شَيْ ءَ أَسْ / رَ عُ مِنْ / نِي لَيْ سَ ذَا / عُ ذَ رِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — وَ ذَا جَ نَا / حِنْ بِ جَنْ / بِرْ رَيْ دِ خَفْ / فَا قِي = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]. والضرب في هذه القصيدة مقطوع «فعْلن»، والقطع: «حذف آخر الوتد المجموع وتسكين ما قبله» [@atiq، ص48]، والعروض مخبونة «فعِلن». وتُمدّ كسرة القاف في آخر البيت فتُنطق «قِي». ودخل الخبن «فاعلن» الأولى في الصدر «رَعُ مِنْ» فصارت «فعِلن»، و«مستفعلن» الأولى في العجز «وَذَا جَنَا» فصارت «متفعلن». والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
variants:
  - reading: "أَوْ ذَا جَنَاحٍ بِجَنْبِ الرَّيْدِ خَفَّاقِ"
    status: "رواية التِّبْرِيزِيّ"
    note: "وهي في متن شرحه، ويذكر محققه أن «وذا جناح» في حاشية إحدى النسخ «وهي رواية الأنباري والمرزوقي» [@tabrizi-ikhtiyarat، ج1 ص112]، وهي رواية «المفضليات» [@mufaddaliyyat، ص28]."
  - reading: "لَا شَيْءَ أَجْوَدُ مِنِّي غَيْرَ ذِي نَحَمٍ / أَوْ ذِي كُدُومٍ عَلَى العَانَاتِ نَهَّاقِ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«وعنى بـ«ذي نحم» فرساً»، و«ذو كدوم» «يعني: حماراً» [@tabrizi-ikhtiyarat، ج1 ص113]."
