  - term: "هَدًّا"
    text: "«الهدّ: الصوت الغليظ»، وانتصب على الحال [@tabrizi-ikhtiyarat، ج1 ص119]."
  - term: "أَرْفَاقِ"
    text: "«هي: الرِّفاق» [@tabrizi-ikhtiyarat، ج1 ص119]."
