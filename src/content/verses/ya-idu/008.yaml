explained: false
first: "حَتَّى نَجَوْتُ وَلَمَّا يَنْزِعُوا سَلَبِي"
second: "بِوَالِهٍ مِنْ قَبِيضِ الشَّدِّ غَيْدَاقِ"
vocabulary:
  - term: "سَلَبِي"
    text: "سلاحه، «وسمّى سلاحه «سلباً» ولم يُسلب، إطلاقاً بما كان يؤول إليه لو ظفروا به» [@tabrizi-ikhtiyarat، ج1 ص116]."
  - term: "بِوَالِهٍ"
    text: "بعدوٍ كعدو الذاهب العقل، و«الوَلَه: ذهاب العقل... والمراد: بعدوٍ والهٍ» [@tabrizi-ikhtiyarat، ج1 ص116]."
  - term: "قَبِيضِ الشَّدِّ"
    text: "سريع العدو، و«القبيض: السريع» [@tabrizi-ikhtiyarat، ج1 ص116]."
  - term: "غَيْدَاقِ"
    text: "«الواسع الكثير» [@tabrizi-ikhtiyarat، ج1 ص116]."
