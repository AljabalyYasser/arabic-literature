explained: false
first: "لَيْلَةَ صَاحُوا وَأَغْرَوْا بِي سِرَاعَهُمُ"
second: "بِالعَيْكَتَيْنِ لَدَى مَعْدَى ابْنِ بَرَّاقِ"
vocabulary:
  - term: "أَغْرَوْا بِي سِرَاعَهُمُ"
    text: "حرّضوا عليّ أسرعهم عدواً، «وكأنّ الإغراء أبلغ من البعث والتحضيض» [@tabrizi-ikhtiyarat، ج1 ص109]."
  - term: "العَيْكَتَيْنِ"
    text: "موضع في ديار بَجِيلة [@lisan، ج10 ص472]."
  - term: "مَعْدَى ابْنِ بَرَّاقِ"
    text: "«الموضع الذي عدا فيه ابن برّاق» [@tabrizi-ikhtiyarat، ج1 ص109]، وهو صاحبه عَمْرو بن بَرّاق."
