first: "أَنْ يَسْأَلَ القَوْمُ عَنِّي أَهْلَ مَعْرِفَةٍ"
second: "فَلَا يُخَبِّرُهُمْ عَنْ ثَابِتٍ لَاقِ"
vocabulary:
  - term: "ثَابِتٍ"
    text: "«اسمه» [@tabrizi-ikhtiyarat، ج1 ص136]، أي اسم الشاعر نفسه."
  - term: "لَاقِ"
    text: "لاقٍ، أي من لقيه؛ والمعنى: «فلا تجدي من يأتيك بخبر عن ثابت» [@tabrizi-ikhtiyarat، ج1 ص136]."
