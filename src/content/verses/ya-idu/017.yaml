first: "بَادَرْتُ قُنَّتَهَا صَحْبِي وَمَا كَسِلُوا"
second: "حَتَّى نَمَيْتُ إِلَيْهَا بَعْدَ إِشْرَاقِ"
vocabulary:
  - term: "قُنَّتَهَا"
    text: "«القُنّة: الجبل المنفرد المستطيل في السماء»، عن الخليل [@tabrizi-ikhtiyarat، ج1 ص127]."
  - term: "نَمَيْتُ"
    text: "ارتقيت؛ والمعنى: «بادرتهم لكي أرتقي إليها بعد إضاءة الشمس» [@tabrizi-ikhtiyarat، ج1 ص127]."
