explained: false
first: "لَا شَيْءَ فِي رَيْدِهَا إِلَّا نَعَامَتُهَا"
second: "مِنْهَا هَزِيمٌ وَمِنْهَا قَائِمٌ بَاقِ"
vocabulary:
  - term: "رَيْدِهَا"
    text: "«حرف الجبل المشرف على الهواء» [@tabrizi-ikhtiyarat، ج1 ص128]."
  - term: "نَعَامَتُهَا"
    text: "«خشبات يُشدّ بعضها إلى بعض، وتستظلّ بها الطلائع في القِلال إذا اشتدّ الحرّ» [@tabrizi-ikhtiyarat، ج1 ص127]."
  - term: "هَزِيمٌ"
    text: "«المتكسّر المتقطّع» [@tabrizi-ikhtiyarat، ج1 ص128]."
