first: "سَدِّدْ خِلَالَكَ مِنْ مَالٍ تُجَمِّعُهُ"
second: "حَتَّى تُلَاقِي الَّذِي كُلُّ امْرِئٍ لَاقِ"
meaning: "يقول للائم: سُدّ أنت حاجاتك وفقرك بالمال الذي تجمعه، حتى يأتيك الموت الذي يأتي كل إنسان، فلن ينفعك ما جمعت."
vocabulary:
  - term: "سَدِّدْ"
    text: "«يجوز أن يكون من السَّداد والقصد وإصلاح المعوجّ، ويجوز أن يكون من سدّ الثُّلمة» [@tabrizi-ikhtiyarat، ج1 ص138]."
  - term: "خِلَالَكَ"
    text: "«الخلال»: «خصاصات الفقر. وأصل الخصاصة: الفرجة تكون بين الشيئين» [@tabrizi-ikhtiyarat، ج1 ص137]."
  - term: "الَّذِي كُلُّ امْرِئٍ لَاقِ"
    text: "الموت، أي «ما الناس مشتركون فيه من الفناء، والانتقال إلى الأخرى» [@tabrizi-ikhtiyarat، ج1 ص137]."
context: "من الأبيات التي يردّ فيها الشاعر على من لامه في إتلاف ماله. وقد كان اللائم في البيت العشرين «عذّالة»، ثم قال «يقول أهلكت مالاً»، فالخطاب هنا للرجل، يقول التِّبْرِيزِيّ: «وهذا الخطاب مخصوص به العاذل دون العاذلة» [@tabrizi-ikhtiyarat، ج1 ص137]. ويروي ابن قُتَيْبَة هذه الأبيات في باب تأبّط شرًّا ويقول: «ومن جيّد شعره قوله» [@ibn-qutayba، ج1 ص301]."
syntax:
  - "«سدّدْ» فعل أمر، و«خلالَك» مفعول به، و«من مال» متعلق بـ«سدّد»، وجملة «تجمّعه» صفة لـ«مال»."
  - "«حتى تلاقي» «حتى» حرف غاية، والفعل منصوب بأن مضمرة، وسُكّنت الياء في موضع النصب، والتسكين في هذا كثير في الشعر."
  - "«الذي» مفعول به لـ«تلاقي»، و«كلُّ امرئ لاقٍ» مبتدأ وخبر في صلته، والعائد محذوف تقديره: لاقيه."
  - "ويجوز عند التِّبْرِيزِيّ أن يكون الخطاب للنفس، «وهذا إيذان بأن كلام العواذل لم يكسبه إلا استمراراً على ما هو فيه من الإتلاف» [@tabrizi-ikhtiyarat، ج1 ص138]."
morphology:
  - "«سدّد» على «فعّل» للتكثير، من السَّداد أو من السدّ."
  - "«خِلال» على «فِعال»، يجوز أن يكون «جمع الخَلَل وهي الفرجة»، أو «من الخَلّة التي هي الفقر» [@tabrizi-ikhtiyarat، ج1 ص138]."
  - "«لاقٍ» اسم فاعل من «لقي»، حُذفت ياؤه للتنوين في الرفع."
rhetoric:
  thesis: "الأمر في البيت ليس نصيحة بل سخرية: اجمع ما شئت، فالموت سيأخذك ومالك. فالشاعر يرد على اللائم بحقيقة الموت التي تُسقط حجته."
  devices:
    - title: "الكناية عن الموت"
      text: "لم يذكر الموت، بل قال «الذي كل امرئ لاقٍ»، فدلّ عليه بصفة لا تتخلف عن أحد، ويفسره التِّبْرِيزِيّ بـ«ما الناس مشتركون فيه من الفناء» [@tabrizi-ikhtiyarat، ج1 ص137]. والكناية عند عبد القاهر أن يجيء المتكلم إلى معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "الأمر الخارج عن الطلب"
      text: "«سدّد خلالك» صيغة أمر، لكنه لا يطلب من اللائم شيئًا، بل يتركه وماله ساخرًا، لأن الغاية «حتى تلاقي الذي كل امرئ لاق» تُبطل فائدة الجمع. وهذه قراءتنا."
    - title: "الالتفات"
      text: "انتقل من مخاطبة العاذلة إلى العاذل، ثم يرجع إليها في البيت التالي، و«من عادتهم صرف الكلام عن الجميع إلى الواحد منهم، سواء كانوا في إخبار أو خطاب» [@tabrizi-ikhtiyarat، ج1 ص137]."
  connection: "ثم يرجع إلى العاذلة فيختم القصيدة: «لتقرعِنّ عليّ السنّ من ندم»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المكسورة، فهي قافية"
  scansion: "سَدْ دِدْ خِ لَا / لَ كَ مِنْ / مَا لِنْ تُ جَمْ / مِ عُ هُو = مستفعلن / فعِلن / مستفعلن / فعِلن — حَتْ تَى تُ لَا / قِلْ لَ ذِي / كُلْ لُمْ رِ ئِنْ / لَا قِي = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]. والضرب في هذه القصيدة مقطوع «فعْلن»، والقطع: «حذف آخر الوتد المجموع وتسكين ما قبله» [@atiq، ص48]، والعروض مخبونة «فعِلن». وتُمدّ كسرة القاف في آخر البيت فتُنطق «قِي». ودخل الخبن «فاعلن» الأولى في الصدر «لَكَ مِنْ» فصارت «فعِلن». والخبن: «حذف الثاني الساكن» [@atiq، ص46]. وتُنطق «تلاقي الذي» «تُلاقِلْلَذي»: تقصر الياء لالتقائها بلام «الذي» الساكنة."
variants:
  - reading: "حَتَّى تُلَاقِيَ مَا كُلُّ امْرِئٍ لَاقِي"
    status: "رواية التِّبْرِيزِيّ وابن قُتَيْبَة"
    note: "في متن شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج1 ص137]، وعند ابن قُتَيْبَة «حتّى تلاقى ما كلّ امرئ لاق» [@ibn-qutayba، ج1 ص302]. و«ما» بمعنى «الذي»، «وقد حذف الضمير العائد إلى «ما» من الصلة تخفيفاً» [@tabrizi-ikhtiyarat، ج1 ص138]. وتصح بها الياء مفتوحة على الأصل في النصب."
