first: "إِنِّي إِذَا خُلَّةٌ ضَنَّتْ بِنَائِلِهَا"
second: "وَأَمْسَكَتْ بِضَعِيفِ الوَصْلِ أَحْذَاقِ"
vocabulary:
  - term: "خُلَّةٌ"
    text: "صديقة، ومعنى البيت: «إني إذا صديقة بخلت بوصلها، وأمسكت بعهد ضعيف ذي وُصَل وأقطاع... زهدت في مُخالّتها، وصرفت نفسي عن هواها» [@tabrizi-ikhtiyarat، ج1 ص103]."
  - term: "أَحْذَاقِ"
    text: "جمع وُصف به الواحد، «يقال: حبل أحذاق وأرمام وأرماث، أي: أقطاع» [@tabrizi-ikhtiyarat، ج1 ص103]."
