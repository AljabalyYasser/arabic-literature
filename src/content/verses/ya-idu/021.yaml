explained: false
first: "يَقُولُ أَهْلَكْتَ مَالًا لَوْ قَنِعْتَ بِهِ"
second: "مِنْ ثَوْبِ صِدْقٍ وَمِنْ بَزٍّ وَأَعْلَاقِ"
vocabulary:
  - term: "بَزٍّ"
    text: "البزّ: الثياب [@lisan، ج5 ص311]."
  - term: "أَعْلَاقِ"
    text: "نفائس المال، جمع عِلْق، «والعِلْق، بالكسر: النفيس من كل شيء» [@lisan، ج10 ص268]."
  - term: "يَقُولُ"
    text: "يقول العاذل؛ ويُروى «تقول»، على أن العذّالة امرأة [@tabrizi-ikhtiyarat، ج1 ص132]."
  - term: "ثَوْبِ صِدْقٍ"
    text: "الثوب الجيد، «ثوب صدق: ضد ثوب سوء» [@deif، ج1 ص379]."
