first: "لَتَقْرَعِنَّ عَلَيَّ السِّنَّ مِنْ نَدَمٍ"
second: "إِذَا تَذَكَّرْتِ يَوْمًا بَعْضَ أَخْلَاقِي"
meaning: "ستعضّين على سنّك ندمًا، أيتها اللائمة، يوم تتذكرين أخلاقي بعد أن تفقديني."
vocabulary:
  - term: "لَتَقْرَعِنَّ السِّنَّ"
    text: "لتندمِنّ، «يقال: قرعت من كذا، وعلى كذا، سنّي، إذا ندمتَ عليه»، «والقرع: ضرب الشيء بالشيء» [@tabrizi-ikhtiyarat، ج1 ص139]."
  - term: "أَخْلَاقِي"
    text: "طباعي وأفعالي، والمراد ما فيها من كرم وإقدام."
context: "آخر بيت في القصيدة. بعد أن خاطب العاذل في البيت السابق «رجع إلى مخاطبة العاذلة» [@tabrizi-ikhtiyarat، ج1 ص139]، فختم بتهديد هادئ: ستعرف قيمته حين يغيب."
syntax:
  - "«وقوله «لتقرعِنّ» جواب يمين مضمرة، والنون الثقيلة أُلحقت للتأكيد وتخليص الفعل للاستقبال، وأصله: لتقرعينَنّ» [@tabrizi-ikhtiyarat، ج1 ص139]."
  - "«فلما سقطت النون التقى ساكنان: ياء الضمير والنون الأولى من النون الثقيلة لأنها نونان، فحُذفت الياء لأن الكسرة تدلّ عليها» [@tabrizi-ikhtiyarat، ج1 ص139]."
  - "«وقوله «إذا تذكّرتِ» ظرف لـ«تقرعِنّ». و«تذكّرتِ» في موضع الجر بإضافة «إذا» إليه» [@tabrizi-ikhtiyarat، ج1 ص139]."
  - "«يومًا» ظرف زمان متعلق بـ«تذكّرت»، و«بعضَ» مفعول به."
morphology:
  - "«تقرعِنّ» مضارع «قرع» مؤكد بالنون الثقيلة، مسند إلى ياء المخاطبة المحذوفة."
  - "«تذكّرتِ» على «تفعّلتِ»، وفيه معنى التكلف: تتذكر بعد غفلة."
  - "«أخلاق» على «أفعال» جمع «خُلُق»."
rhetoric:
  thesis: "الشاعر لا يعتذر ولا يتراجع، بل يحيل حكم اللائمة إلى المستقبل: غيابه سيُثبت ما لم يُثبته الكلام."
  devices:
    - title: "الكناية عن الندم"
      text: "قرع السنّ فعل يلازم الندم في العادة، فذكره ودلّ به على الندم، وهذا ما يسميه التِّبْرِيزِيّ «الإبانة عن الندم»، ومثله قولهم: «لقطت الحصى، وعددت الحصى، وخططت في الأرض» [@tabrizi-ikhtiyarat، ج1 ص139]. والكناية عند عبد القاهر أن يجيء المتكلم إلى معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "التوكيد بالقسم والنون"
      text: "لام القسم ونون التوكيد الثقيلة في فعل واحد، فالندم عنده أمر واقع لا محالة. وهذه قراءتنا."
    - title: "حسن الختام"
      text: "ختم القصيدة بالرجوع إلى نفسه وأخلاقه، وهي ما دار عليه البيتان الأخيران. ويقول التِّبْرِيزِيّ في معناه: «لتندمِنّ على سوء عشرتكِ، وإفراطك في لومي وعتبي، إذا فقدتني واضطررتِ إلى تذكّرك أخلاقي» [@tabrizi-ikhtiyarat، ج1 ص139]."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المكسورة، فهي قافية"
  scansion: "لَ تَقْ رَ عِنْ / نَ عَ لَيْ / يَسْ سِنْ نَ مِنْ / نَ دَ مِنْ = متفعلن / فعِلن / مستفعلن / فعِلن — إِ ذَا تَ ذَكْ / كَرْ تِ يَوْ / مَنْ بَعْ ضَ أَخْ / لَا قِي = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]. والضرب في هذه القصيدة مقطوع «فعْلن»، والقطع: «حذف آخر الوتد المجموع وتسكين ما قبله» [@atiq، ص48]، والعروض مخبونة «فعِلن». وتُمدّ كسرة القاف في آخر البيت فتُنطق «قِي». ودخل الخبن «مستفعلن» الأولى في الشطرين «لَتَقْرَعِنْ» و«إِذَا تَذَكْ» فصارت «متفعلن»، و«فاعلن» الأولى في الصدر «نَعَلَيْ» فصارت «فعِلن». والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
variants:
  - reading: "لَتَقْرَعَنَّ عَلَيَّ السِّنَّ مِنْ نَدَمٍ / إِذَا تَذَكَّرْتَ يَوْمًا بَعْضَ أَخْلَاقِي"
    status: "رواية «المفضليات»"
    note: "بالخطاب للمذكر [@mufaddaliyyat، ص31]. وأثبتنا رواية التِّبْرِيزِيّ بالخطاب للعاذلة [@tabrizi-ikhtiyarat، ج1 ص138]، وهي التي يشرحها: «رجع إلى مخاطبة العاذلة» [@tabrizi-ikhtiyarat، ج1 ص139]."
