first: "لَكِنَّمَا عَوَلِي إِنْ كُنْتُ ذَا عَوَلٍ"
second: "عَلَى بَصِيرٍ بِكَسْبِ الحَمْدِ سَبَّاقِ"
vocabulary:
  - term: "عَوَلِي"
    text: "إعوالي، «وهو من العويل والحزن»، وحكى ثَعْلَب أنه «ما يُعوَّل عليه»، فالمعنى: «لكنّما مُعوَّلي ومعتمدي على رجل سبّاق إلى مكارم الأخلاق» [@tabrizi-ikhtiyarat، ج1 ص117]."
