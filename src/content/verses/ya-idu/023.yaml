first: "إِنِّي زَعِيمٌ لَئِنْ لَمْ تَتْرُكُوا عَذَلِي"
second: "أَنْ يَسْأَلَ الحَيُّ عَنِّي أَهْلَ آفَاقِ"
vocabulary:
