first: "نَجَوْتُ مِنْهَا نَجَائِي مِنْ بَجِيلَةَ إِذْ"
second: "أَلْقَيْتُ لَيْلَةَ خَبْتِ الرَّهْطِ أَرْوَاقِي"
meaning: "نجوت من تلك الصديقة التي ضنّت بوصلها كما نجوت من بني بَجِيلة ليلة خَبْت الرَّهْط، حين بذلت كل جهدي في العَدْو."
vocabulary:
  - term: "نَجَائِي"
    text: "«مصدر نجا ينجو» [@tabrizi-ikhtiyarat، ج1 ص104]."
  - term: "بَجِيلَةَ"
    text: "«وهي قبيلة» [@tabrizi-ikhtiyarat، ج1 ص105]، ويزيد محقق شرح التِّبْرِيزِيّ أنها «قبيلة من اليمانية» [@tabrizi-ikhtiyarat، ج1 ص105]."
  - term: "خَبْتِ الرَّهْطِ"
    text: "«الخبت»: «المنخفض من الأرض المستوي»، و«الرهط»: «موضع» [@tabrizi-ikhtiyarat، ج1 ص105]."
  - term: "أَلْقَيْتُ أَرْوَاقِي"
    text: "«يقال: ألقى فلان أرواقه، إذا استفرغ جُهده فيما يفعله»، و«الأرواق»: «جمع الرَّوق، وهو: النَّفْس والهمّ» [@tabrizi-ikhtiyarat، ج1 ص105]."
context: "هذا البيت يكمل البيت الذي قبله: «إني إذا خُلّة ضنّت بنائلها وأمسكت بضعيف الوصل أحذاق»، فـ«خبر «إني» في البيت الذي يليه، وهو قوله «نجوت منها»» [@tabrizi-ikhtiyarat، ج1 ص103]. وبه يخرج الشاعر من الغزل إلى خبر نجاته من بجيلة، وهو الخبر الذي يرويه «الأغاني»: أغار مع صاحبه ابن برّاق على بجيلة، فكمنوا لهما على الماء، فنجوَا بالعَدْو [@aghani-dk، ج21 ص131–134]."
syntax:
  - "«نجوتُ منها» خبر «إنّ» في البيت السابق، و«إذا خلّة» «ظرف له. والتقدير: إني في هذا الوقت من أوقات الصديقة التي ذا صفتها أنجو منها» [@tabrizi-ikhtiyarat، ج1 ص103]."
  - "«نجائي» مفعول مطلق مبيّن للنوع، أي نجوت نجاءً مثل نجائي، و«من بجيلة» متعلق به."
  - "«و«إذ» ظرف لقوله «نجائي» وقد شُرح بقوله «ألقيت»»، و«ليلةَ» «انتصب على الظرف من «ألقيت»» [@tabrizi-ikhtiyarat، ج1 ص105]."
  - "«خبت الرهط» إضافة الموضع إلى ما يُعرف به، «أضاف «الخبت» إليه على طريق التحديد والتبيين» [@tabrizi-ikhtiyarat، ج1 ص105]."
morphology:
  - "«نَجاء» على «فَعال» مصدر «نجا»، وأصله «نَجاوٌ»، قُلبت الواو همزة لتطرّفها بعد ألف زائدة."
  - "«أرواق» على «أفعال» جمع «رَوْق»."
  - "«بَجِيلة» ممنوعة من الصرف للعلمية والتأنيث، فجُرّت بالفتحة."
rhetoric:
  thesis: "الشاعر يجعل فراق المرأة التي ملّته مثل نجاته من أعدائه: لا بكاء ولا حنين، بل خلاص. فالغزل نفسه يُروى بلغة الغارة."
  devices:
    - title: "التشبيه بين نجاتين"
      text: "شبّه تخلّصه من الصديقة بتخلّصه من بجيلة. ويرى التِّبْرِيزِيّ أنه بهذا زاد على غيره من الشعراء، «لأنه عدّ صرف همّه عمّن لا يريده كالخروج من الشدائد»، ثم يستشهد بهذا البيت ويقول: «فعدّ الخلّة إذا ضعف عهدها كعدوّه الذي يريد هُلْكه» [@tabrizi-ikhtiyarat، ج1 ص104]."
    - title: "التضمين"
      text: "لا يتم معنى البيت السابق إلا بهذا البيت، لأن خبر «إني» فيه. والتضمين عند ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
    - title: "الكناية في «ألقيت أرواقي»"
      text: "لم يقل: عدوت بأقصى قوتي، بل قال: ألقيت أرواقي، وهي عبارة تقال لمن «استفرغ جُهده فيما يفعله» [@tabrizi-ikhtiyarat، ج1 ص105]. والكناية عند عبد القاهر أن يجيء المتكلم إلى معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
  connection: "ثم يذكر تلك الليلة: «ليلة صاحوا وأغروا بي سراعهم بالعيكتين لدى معدى ابن برّاق»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المكسورة، فهي قافية"
  scansion: "نَ جَوْ تُ مِنْ / هَا نَ جَا / ئِي مِنْ بَ جِي / لَ ةَ إِذْ = متفعلن / فاعلن / مستفعلن / فعِلن — أَلْ قَيْ تُ لَيْ / لَ ةَ خَبْ / تِرْ رَهْ طِ أَرْ / وَا قِي = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]. والضرب في هذه القصيدة مقطوع «فعْلن»، والقطع: «حذف آخر الوتد المجموع وتسكين ما قبله» [@atiq، ص48]، والعروض مخبونة «فعِلن». وتُمدّ كسرة القاف في آخر البيت فتُنطق «قِي». ودخل الخبن «مستفعلن» الأولى في الصدر «نَجَوْتُ مِنْ» فصارت «متفعلن»، و«فاعلن» الأولى في العجز «لَةَ خَبْ» فصارت «فعِلن». والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
