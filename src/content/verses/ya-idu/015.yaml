explained: false
first: "كَالحِقْفِ حَدَّأَهُ النَّامُونَ قُلْتُ لَهُ"
second: "ذُو ثَلَّتَيْنِ وَذُو بَهْمٍ وَأَرْبَاقِ"
vocabulary:
  - term: "الحِقْفِ"
    text: "«ما احقوقف من الرمل وطال في تراكمه» [@tabrizi-ikhtiyarat، ج1 ص124]."
  - term: "حَدَّأَهُ النَّامُونَ"
    text: "صلّبه الصاعدون عليه؛ وفي رواية التِّبْرِيزِيّ «دملكه»، وهو بمعناه، أي «صلّبه النامون، أي: المترقّون إليه»، يشبّه صاحبه في صلابة جسمه [@tabrizi-ikhtiyarat، ج1 ص124]."
  - term: "ذُو ثَلَّتَيْنِ"
    text: "صاحب قطيعين من الغنم، أي تحسبه في ضُمره «براعٍ»، و«الثَّلّة: القطعة من الضأن» [@tabrizi-ikhtiyarat، ج1 ص125]."
  - term: "بَهْمٍ"
    text: "«أولاد الشاء كلّها» [@tabrizi-ikhtiyarat، ج1 ص125]."
  - term: "أَرْبَاقِ"
    text: "جمع رِبْق، وهو «حبل فيه عدة عُرى تُشدّ به البَهْم» [@lisan، ج10 ص113]."
