first: "سَأَجْزِيكِ أَوْ يَجْزِيكِ عَنِّي مُثَوِّبٌ"
second: "وَقَصْرُكِ أَنْ يُثْنَى عَلَيْكِ وَتُحْمَدِي"
vocabulary:
  - term: "مُثَوِّبٌ"
    text: "«الذى يعطى المحسن ثواب ما عمل» [@aghani-dk، ج11 ص73، الحاشية]."
  - term: "وَقَصْرُكِ"
    text: "«قصرك: غايتك وكفايتك» [@aghani-dk، ج11 ص73، الحاشية]. وفي «عيون الأخبار»: «وقصدك» [@uyun-al-akhbar، ج3 ص186]."
