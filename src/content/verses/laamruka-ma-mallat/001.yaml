explained: false
first: "لَعَمْرُكَ مَا مَلَّتْ ثَوَاءَ ثَوِيِّهَا"
second: "حَلِيمَةُ إِذْ أَلْقَى مَرَاسِيَ مُقْعَدِ"
vocabulary:
  - term: "ثَوَاءَ ثَوِيِّهَا"
    text: "يقول محققو «الأغاني»: «الثواء: الإقامة. والثوى هنا: الضيف» [@aghani-dk، ج11 ص73، الحاشية]، يعني نفسه."
  - term: "أَلْقَى مَرَاسِيَ مُقْعَدِ"
    text: "أقام إقامة من لا يقدر على الحركة، كما تثبت السفينة بمراسيها. و«المقعد: الذى به داء يقعده» [@aghani-dk، ج11 ص73، الحاشية]."
sources:
  - source: "aghani-dk"
    loc: "ج11 ص73"
    url: "https://archive.org/details/Al-aghani_11/page/n72/mode/1up"
status: "review"
