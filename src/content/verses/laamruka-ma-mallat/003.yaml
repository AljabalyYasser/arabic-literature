explained: false
first: "وَلَمْ تُلْهِهَا تِلْكَ التَّكَالِيفُ إِنَّهَا"
second: "كَمَا شِئْتَ مِنْ أُكْرُومَةٍ وَتَخَرُّدِ"
vocabulary:
  - term: "وَلَمْ تُلْهِهَا"
    text: "يقول محققو «الأغاني»: «يقال: لهى عن الشىء يلهى ... إذا كف عنه وتركه. يريد: لم يجعلها تتركه ما تلاقيه فى القيام عليه من تكاليف» [@aghani-dk، ج11 ص73، الحاشية]."
  - term: "أُكْرُومَةٍ"
    text: "كرم."
  - term: "تَخَرُّدِ"
    text: "«التخرد: الحياء والخفر» [@aghani-dk، ج11 ص73، الحاشية]."
sources:
