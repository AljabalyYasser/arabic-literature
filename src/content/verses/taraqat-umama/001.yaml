explained: false
first: "طَرَقَتْ أُمَامَةُ وَالْمَزَارُ بَعِيدُ"
second: "وَهْنًا وَأَصْحَابُ الرِّحَالِ هُجُودُ"
vocabulary:
  - term: "طَرَقَتْ"
    text: "أتت ليلًا، و«لا يكون الطروق إلا بالليل» [@mufaddaliyyat، ص355، الحاشية]، يعني خيالها في النوم."
  - term: "وَهْنًا"
    text: "بعد ساعة من الليل [@mufaddaliyyat، ص355، الحاشية]."
  - term: "هُجُودُ"
    text: "النائمون، جمع هاجد [@mufaddaliyyat، ص355، الحاشية]."
