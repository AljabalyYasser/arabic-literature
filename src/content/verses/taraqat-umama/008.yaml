first: "وَإِذَا نُوَافِقُ جُرْأَةً أَوْ نَجْدَةً"
second: "كُنَّا سُمَيَّ بِهَا الْعَدُوَّ نَكِيدُ"
vocabulary:
  - term: "سُمَيَّ"
    text: "أراد: يا سُمَيّة [@mufaddaliyyat، ص355، الحاشية]، فحذف آخر الاسم في النداء، وهو الترخيم."
  - term: "نَكِيدُ"
    text: "نحتال للعدو ونحاربه."
