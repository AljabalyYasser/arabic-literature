first: "وَإِذَا تُحَمِّلُنَا الْعَشِيرَةُ ثِقْلَهَا"
second: "قُمْنَا بِهِ وَإِذَا تَعُودُ نَعُودُ"
vocabulary:
  - term: "ثِقْلَهَا"
    text: "غرمها وما ينوبها من الحمالات والديات ونحوها [@mufaddaliyyat، ص355، الحاشية]."
  - term: "وَإِذَا تَعُودُ نَعُودُ"
    text: "نفعل ذلك كلما سُئلنا، مرة بعد مرة [@mufaddaliyyat، ص355، الحاشية]."
