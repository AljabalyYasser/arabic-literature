explained: false
first: "بَلْ لَا نَقُولُ إِذَا تَبَوَّأَ جِيرَةٌ"
second: "إِنَّ الْمَحَلَّةَ شِعْبُهَا مَكْدُودُ"
vocabulary:
  - term: "تَبَوَّأَ جِيرَةٌ"
    text: "نزل عندنا جيران."
  - term: "شِعْبُهَا"
    text: "الشِّعب: ما انفرج بين جبلين [@mufaddaliyyat، ص356، الحاشية]."
  - term: "مَكْدُودُ"
    text: "في شدة وضيق. أراد أنه لا يعتذر لأضيافه بما ينوبه من شدة وضيق [@mufaddaliyyat، ص356، الحاشية]."
