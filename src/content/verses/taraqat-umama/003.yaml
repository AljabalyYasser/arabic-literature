first: "إِنِّي امْرُؤٌ مِنْ عُصْبَةٍ مَشْهُورَةٍ"
second: "حُشُدٍ لَهُمْ مَجْدٌ أَشَمُّ تَلِيدُ"
vocabulary:
  - term: "حُشُدٍ"
    text: "الذين يحشدون لضيفهم وجارهم، أي يجتمعون له ولما ينوبهم من قِرًى ونصر [@mufaddaliyyat، ص355، الحاشية]."
  - term: "أَشَمُّ"
    text: "مرتفع عالٍ."
  - term: "تَلِيدُ"
    text: "القديم [@mufaddaliyyat، ص355، الحاشية]."
