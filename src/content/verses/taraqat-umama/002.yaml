first: "أَنَّى اهْتَدَيْتِ وَكُنْتِ غَيْرَ رَجِيلَةٍ"
second: "وَالْقَوْمُ مِنْهُمْ نُبَّهٌ وَرُقُودُ"
vocabulary:
  - term: "أَنَّى"
    text: "كيف."
  - term: "رَجِيلَةٍ"
    text: "«وامرأة رجيلة: صبور على المشي» [@lisan، ج11 ص271]. يعجب كيف اهتدى خيالها إليه وهي لا تقطع الطريق."
  - term: "نُبَّهٌ"
    text: "جمع نابه، بمعنى مستيقظ [@mufaddaliyyat، ص355، الحاشية]."
