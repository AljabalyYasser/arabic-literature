first: أَبَتْ لِي عِفَّتِي وَأَبَى بَلَائِي
second: وَأَخْذِي الْحَمْدَ بِالثَّمَنِ الرَّبِيحِ
vocabulary:
- term: بَلَائِي
  text: ما عُرف من حسن صنيعي وصبري في الحرب.
- term: الرَّبِيحِ
  text: الرابح؛ يشتري الثناء بماله ونفسه ويراه ربحًا.
