first: وَقَوْلِي كُلَّمَا جَشَأَتْ وَجَاشَتْ
second: رُوَيْدَكِ تُحْمَدِي أَوْ تَسْتَرِيحِي
vocabulary:
- term: جَشَأَتْ وَجَاشَتْ
  text: 'نهضت نفسه وارتفعت من حزن أو فزع؛ يريد «تطلّعت ونهضت جزعًا وكراهة» [@lisan، ج1 ص48]. قال المُبَرِّد: «يقال: جشأت مهموز، وجاشت غير مهموز» [@kamil، ج4 ص58].'
- term: رُوَيْدَكِ
  text: تمهّلي واثبتي، يخاطب نفسه.
- term: تَسْتَرِيحِي
  text: تستريحي بالموت.
