first: لِأَدْفَعَ عَنْ مَآثِرَ صَالِحَاتٍ
second: وَأَحْمِيَ بَعْدُ عَنْ عِرْضٍ صَحِيحِ
vocabulary:
- term: مَآثِرَ
  text: "مكارم تُروى وتُذكر؛ «مآثر العرب: مكارمها ومفاخرها التي تؤثر عنها أي تذكر وتروى» [@lisan، ج4 ص7]."
- term: عِرْضٍ صَحِيحِ
  text: "شرف سليم من العيب. والعِرض من الإنسان «جانبه الذي يصونه من نفسه وحسبه ويحامي عنه أن ينتقص» [@lisan، ج7 ص171]."
