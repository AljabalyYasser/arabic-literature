explained: false
first: إِذا قِيلَ أَيُّ النّاسِ خَيْرٌ قَبِيلَةً
second: وَأَصْبَرُ يَوْمًا لا تَوارَى كَواكِبُهْ
vocabulary:
- term: قَبِيلَةً
  text: «قبيلة منصوب على التمييز والمراد باليوم أيام الحرب والقتال» [@tabrizi-hamasa، ج2 ص271].
- term: لا تَوارَى كَواكِبُهْ
  text: '«ولا توارى أصله لا تتورى فحذف إحدى التاءين وكواكبه كناية عن شدة ذلك اليوم» [@tabrizi-hamasa، ج2 ص271]: يوم أظلم بغبار الحرب حتى ظهرت فيه النجوم.'
