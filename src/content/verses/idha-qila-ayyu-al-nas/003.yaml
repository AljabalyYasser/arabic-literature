first: أَضاءَتْ لَهُمْ أَحْسابُهُمْ وَوُجُوهُهُمْ
second: دُجَى اللَّيْلِ حَتَّى نَظَّمَ الجَزْعَ ثاقِبُهْ
vocabulary:
- term: دُجَى اللَّيْلِ
  text: ظلمته.
- term: الجَزْعَ
  text: «والجزع خرز فيه بياض وسواد تشبه به العيون» [@tabrizi-hamasa، ج2 ص272].
- term: نَظَّمَ … ثاقِبُهْ
  text: من يثقب الخرز استطاع أن ينظمه في ظلمة الليل، من ضياء وجوههم.
