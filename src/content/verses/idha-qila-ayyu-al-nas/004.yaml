first: لَهُمْ مَجْلِسٌ لَا يَحْصَرُونَ عَنِ النَّدَى
second: إِذَا مَطْلَبُ المَعْرُوفِ أَجْدَبَ رَاكِبُهْ
vocabulary:
- term: لَا يَحْصَرُونَ عَنِ النَّدَى
  text: '«لا يحصرون عن الندى: لا يبخلون» [@aghani-dk، ج13 ص9، الحاشية].'
- term: أَجْدَبَ رَاكِبُهْ
  text: لم يجد طالب المعروف من يعطيه، كمن نزل أرضًا لا نبات فيها.
