explained: false
first: فَلَوْ كُنْتُ مَثْلُوجَ الفُؤَادِ إِذَا بَدَتْ
second: بِلَادُ الأَعَادِي لَا أُمِرُّ وَلَا أُحْلِي
vocabulary:
- term: مَثْلُوجَ الفُؤَادِ
  text: 'قال ابن السِّكِّيت: «يقال: بات مثلوجَ الفؤاد من الهمّ، أي: بارد الفؤاد ليس له حرارة ولا قوة» [@diwan-urwa، ص56].'
- term: لَا أُمِرُّ وَلَا أُحْلِي
  text: '«من المرارة والحلاوة، وهو مثل، ومعناه: لا خير عنده ولا شر ولا نفع ولا ضر» [@diwan-urwa، ص56].'
