first: يُقَلِّبُ فِي الأَرْضِ الفَضَاءِ بِكَفِّهِ
second: وَهُنَّ مُنَاخَاتٌ وَمِرْجَلُنَا يَغْلِي
vocabulary:
- term: يُقَلِّبُ فِي الأَرْضِ الفَضَاءِ بِكَفِّهِ
  text: 'يقلّب بصره في الأرض الواسعة يحجب الشمس عن عينيه بكفه. قال ابن السِّكِّيت: «يقول: يرمي ببصره وقد أنخنا ونزلنا نطبخ»، «والأرض الفضاء: الواسعة التي لا جبل فيها» [@diwan-urwa، ص57].'
- term: مِرْجَلُنَا
  text: قِدرنا.
sources:
