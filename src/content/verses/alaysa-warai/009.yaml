vocabulary:
- term: قَلِيلٌ تَوَالِيهَا
  text: 'قال ابن السِّكِّيت: «أي: قليل من يتلوها ليُنجيها لأنا نطردها ونسبق بها الناس» [@diwan-urwa، ص57].'
- term: وِتْرِهَا
  text: ثأرها.
- term: الرَّجْلِ
  text: الرجّالة، أي المشاة.
