first: لَعَلَّ انْطِلَاقِي فِي البِلَادِ وَرِحْلَتِي
second: وَشَدِّي حَيَازِيمَ المَطِيَّةِ بِالرَّحْلِ
vocabulary:
- term: رِحْلَتِي
  text: 'قال ابن السِّكِّيت: «يقال: رجلٌ ذو رِحلة، إذا كان قويًا على الارتحال» [@diwan-urwa، ص56].'
- term: حَيَازِيمَ المَطِيَّةِ
  text: 'الحيازيم: جمع حيزوم، وهو وسط الصدر حيث يُشد الحزام، والمطية: الدابة التي تُركب.'
sources:
- source: diwan-urwa
  loc: ص56
