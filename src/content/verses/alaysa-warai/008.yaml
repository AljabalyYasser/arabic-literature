first: سَيَدْفَعُنِي يَوْمًا إِلَى رَبِّ هَجْمَةٍ
second: يُدَافِعُ عَنْهَا بِالعُقُوقِ وَبِالبُخْلِ
vocabulary:
- term: رَبِّ هَجْمَةٍ
  text: 'صاحب قطيع من الإبل؛ قال الأَصْمَعِيّ فيما ينقله ابن السِّكِّيت: «فإذا بلغت خمسين إلى الستين فهي هَجْمَة» [@diwan-urwa، ص56].'
- term: يُدَافِعُ عَنْهَا بِالعُقُوقِ وَبِالبُخْلِ
  text: '«أي يدفع عنها لا يَنحَلُها فأُغير عليها» [@diwan-urwa، ص56]: يمنعها من حقوق قرابته، فهو أولى أن يُغار عليه.'
sources:
- source: diwan-urwa
  loc: ص56
