explained: false
first: رَهِينَةَ قَعْرِ البَيْتِ كُلَّ عَشِيَّةٍ
second: يُلَاعِبُنِي الوِلْدَانُ أَهْدِجُ كَالرَّأْلِ
vocabulary:
- term: رَهِينَةَ قَعْرِ البَيْتِ
  text: 'قال ابن السِّكِّيت: «يقول: أنا مرتهن في البيت لا أبرح قعره» [@diwan-urwa، ص55].'
- term: أَهْدِجُ كَالرَّأْلِ
  text: '«يقال: هَدَجَ يَهْدِجُ، وهو تدارك الخطو. والرأل: فرخ النعام، فيقول: أنا منحنٍ كأني فرخ نعامة» [@diwan-urwa، ص55]. وقال الجاحِظ: «شبّه هدجان الشّيخ الضّعيف في مشيته بهدجان الرّأل» [@hayawan، ج4 ص433].'
