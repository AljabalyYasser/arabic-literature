explained: false
first: "وَعَيَّرَتْنِي بَنُو ذُبْيَانَ خَشْيَتَهُ"
second: "وَهَلْ عَلَيَّ بِأَنْ أَخْشَاكَ مِنْ عَارِ"
vocabulary:
  - term: "خَشْيَتَهُ"
    text: "خوفي من الملك، «أي خشيت الملك فأخبر عنه، ثم خاطبه»، «ويحتمل أن يريد خشية الجيش» [@diwan-nabigha، ص78]."
  - term: "عَارِ"
    text: "عيب يُعيَّر به."
