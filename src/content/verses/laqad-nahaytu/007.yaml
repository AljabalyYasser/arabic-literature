explained: false
first: "إِمَّا عُصِيتُ فَإِنِّي غَيْرُ مُنْفَلِتٍ"
second: "مِنِّي اللِّصَابُ فَجَنْبَا حَرَّةِ النَّارِ"
vocabulary:
  - term: "إِمَّا عُصِيتُ"
    text: "«يقول لقومه: إن عصيتموني وأقمتم بهذا الموضع فإني أنزل هذه المواضع الوعرة، وألجأ إليها، فلا تصل إليّ الخيلُ» [@diwan-nabigha، ص76]."
  - term: "اللِّصَابُ"
    text: "«جمع لِصْب، وهو الشِّعْب الضيّق في الجبل» [@diwan-nabigha، ص76]."
  - term: "حَرَّةِ النَّارِ"
    text: "«والحَرّة: الأرض الصُّلبة ذات الحجارة. وحرّة النار يقال هي لبني مُرّة، ويقال لبني سُلَيم» [@diwan-nabigha، ص76]."
sources:
