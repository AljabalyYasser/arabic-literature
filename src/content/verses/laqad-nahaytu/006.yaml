explained: false
first: "يُذْرِينَ دَمْعًا عَلَى الْأَشْفَارِ مُنْحَدِرًا"
second: "يَأْمُلْنَ رِحْلَةَ حِصْنٍ وَابْنِ سَيَّارِ"
vocabulary:
  - term: "يُذْرِينَ"
    text: "«أي يصببنه ويرمين به» [@diwan-nabigha، ص76]."
  - term: "حِصْنٍ وَابْنِ سَيَّارِ"
    text: "«يريد حصن بن حذيفة الفزاريّ»، وابن سيّار سيد آخر من فَزارة، «وكانا سيّدَي فزارة، وإنما يأملن رحلتهما ليفُكّا أسرهنّ» [@diwan-nabigha، ص76]. وهو زَبّان بن سَيّار في خبر ابن السِّكِّيت [@diwan-nabigha، ص243]."
