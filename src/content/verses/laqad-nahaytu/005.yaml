explained: false
first: "خَلْفَ الْعَضَارِيطِ لَا يُوقَيْنَ فَاحِشَةً"
second: "مُسْتَمْسِكَاتٍ بِأَقْتَابٍ وَأَكْوَارِ"
vocabulary:
  - term: "الْعَضَارِيطِ"
    text: "«الأجراء والتُّبّاع، واحدهم عُضْرُوط» [@diwan-nabigha، ص76]."
  - term: "لَا يُوقَيْنَ فَاحِشَةً"
    text: "«أي لا يمنع منهنّ الفواحش، لأنهن سبايا مملّكات» [@diwan-nabigha، ص76]."
  - term: "بِأَقْتَابٍ وَأَكْوَارِ"
    text: "«والأقتاب: أعواد الرَّحْل. والأكوار: الرحال؛ يصف أنهنّ مردفات، فهنّ يستمسكن بالرحال» [@diwan-nabigha، ص76]."
sources:
