first: "تُدَافِعُ النَّاسَ عَنَّا حِينَ نَرْكَبُهَا"
second: "مِنَ الْمَظَالِمِ تُدْعَى أُمَّ صَبَّارِ"
vocabulary:
  - term: "تُدَافِعُ النَّاسَ عَنَّا"
    text: "«يقول: هذه الحرّة تُدافع الناسَ عنّا من المظالم إذا نزلناها» [@diwan-nabigha، ص77]."
  - term: "أُمَّ صَبَّارِ"
    text: "«اسم الحرّة. والصبّار: الحجارة؛ فكأن هذه الحرّة أمّ الحجارة لكثرتها» [@diwan-nabigha، ص77]."
