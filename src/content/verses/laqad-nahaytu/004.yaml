explained: false
first: "يَنْظُرْنَ شَزْرًا إِلَى مَنْ جَاءَ عَنْ عُرُضٍ"
second: "بِأَوْجُهٍ مُنْكِرَاتِ الرِّقِّ أَحْرَارِ"
vocabulary:
  - term: "شَزْرًا"
    text: "«أي ينظرن بمؤخّر أعينهنّ، يلتفتن يمينًا وشمالًا» [@diwan-nabigha، ص76]."
  - term: "عَنْ عُرُضٍ"
    text: "«أي عن ناحية» [@diwan-nabigha، ص76]."
  - term: "مُنْكِرَاتِ الرِّقِّ أَحْرَارِ"
    text: "«أي كُنّ في حرية، فلما سُبين أنكرنَ الرقّ والعبودية» [@diwan-nabigha، ص76]."
sources:
  - source: "diwan-nabigha"
    loc: "ص76"
