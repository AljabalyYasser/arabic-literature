explained: false
first: "حَتَّى اسْتَقَلَّ بِجَمْعٍ لَا كِفَاءَ لَهُ"
second: "يَنْفِي الْوُحُوشَ عَنِ الصَّحْرَاءِ جَرَّارِ"
vocabulary:
  - term: "اسْتَقَلَّ"
    text: "«أي ارتفع ونهض نحو بني ذبيان» [@diwan-nabigha، ص77]."
  - term: "لَا كِفَاءَ لَهُ"
    text: "«أي ليس ما يكافئه ويكون مثله» [@diwan-nabigha، ص77]."
  - term: "يَنْفِي الْوُحُوشَ"
    text: "«أي يُذعرها في كُنُسها ومراتعها؛ لكثرة جلبته» [@diwan-nabigha، ص77]."
  - term: "جَرَّارِ"
    text: "«الذي له إخوان وتوابع؛ فيجرّ بعضُه بعضًا، ولا يكاد ينقضي» [@diwan-nabigha، ص77]."
sources:
  - source: "diwan-nabigha"
    loc: "ص77"
    url: "https://archive.org/details/3409pdf_202001/page/n76/mode/1up"
status: "review"
