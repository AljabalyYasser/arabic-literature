explained: false
first: "لَقَدْ نَهَيْتُ بَنِي ذُبْيَانَ عَنْ أُقُرٍ"
second: "وَعَنْ تَرَبُّعِهِمْ فِي كُلِّ أَصْفَارِ"
vocabulary:
  - term: "أُقُرٍ"
    text: "وادٍ حماه الملك الغَسّانيّ، «وهو وادٍ مملوءٌ حَمْضًا ومياهًا» [@diwan-nabigha، ص75]، ويقول المحقق في الحاشية: «الحمض: ما ملح وأمرّ من النبات، وهو كفاكهة للإبل» [@diwan-nabigha، ص75]."
  - term: "تَرَبُّعِهِمْ"
    text: "«أي حلولهم زمن الربيع فيه» [@diwan-nabigha، ص75]."
  - term: "فِي كُلِّ أَصْفَارِ"
    text: "«وإنما قال: «في كلّ أصفار»؛ لأن صَفَرًا كان في الربيع يومئذ» [@diwan-nabigha، ص75]، وأصفار جمع صَفَر، الشهر."
sources:
  - source: "diwan-nabigha"
    loc: "ص75"
