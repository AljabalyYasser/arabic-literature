explained: false
first: "أَوْ أَضَعُ الْبَيْتَ فِي سَوْدَاءَ مُظْلِمَةٍ"
second: "تُقَيِّدُ الْعَيْرَ لَا يَسْرِي بِهَا السَّارِي"
vocabulary:
  - term: "سَوْدَاءَ مُظْلِمَةٍ"
    text: "«أي أنزل في أرض سوداء فأضع بيتي بها» [@diwan-nabigha، ص76]، يعني الحرّة."
  - term: "تُقَيِّدُ الْعَيْرَ"
    text: "«أي تمنعه المشي لصلابتها وصعوبتها؛ وإنما خصّ العَيْرَ لأنه أوقح» الدوابّ «وأصلبها حافرًا» [@diwan-nabigha، ص76–77]، والعَيْر الحمار."
sources:
  - source: "diwan-nabigha"
    loc: "ص76–77"
    url: "https://archive.org/details/3409pdf_202001/page/n75/mode/1up"
status: "review"
