explained: false
first: فَلَوْلَا زُهَيْرٌ أَنْ أُكَدِّرَ نِعْمَةً
second: لَقَاذَعْتُ كَعْبًا مَا بَقِيتُ وَمَا بَقَا
vocabulary:
- term: زُهَيْرٌ
  text: زُهَيْر بن أبي سُلْمى، والد كعب [@khizana، ج9 ص497].
- term: أُكَدِّرَ نِعْمَةً
  text: 'أُفسد معروفًا له عندي؛ والتقدير: «فلولا تكدير نعمة لزُهَيْر» [@khizana، ج9 ص497].'
- term: لَقَاذَعْتُ
  text: لرميته بالقَذَع، وهو «الفحش والخنى» [@khizana، ج9 ص497].
- term: بَقَا
  text: بَقِيَ، على لغة طيئ [@khizana، ج9 ص495].
