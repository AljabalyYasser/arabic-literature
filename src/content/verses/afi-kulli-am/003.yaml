first: تُحَضِّضُ جَبَّارًا عَلَيَّ وَرَهْطَهُ
second: وَمَا صِرْمَتِي مِنْهُمْ لِأَوَّلِ مَنْ سَعَى
vocabulary:
- term: تُحَضِّضُ
  text: تحثّ وتُغري؛ والخطاب لكعب بن زُهَيْر [@khizana، ج9 ص496].
- term: جَبَّارًا
  text: 'اسم رجل، قال الأحول: «هو رجل من فزارة» [@khizana، ج9 ص496].'
- term: رَهْطَهُ
  text: قومه.
- term: صِرْمَتِي
  text: 'الصِّرْمة «القطعة من الإبل ما بين الثلاثين إلى الأربعين» [@khizana، ج9 ص496].'
