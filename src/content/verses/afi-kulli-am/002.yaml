explained: false
first: تُجِدُّونَ خَمْشًا بَعْدَ خَمْشٍ كَأَنَّهُ
second: عَلَى فَاجِعٍ مِنْ خَيْرِ قَوْمِكُمُ نُعَا
vocabulary:
- term: تُجِدُّونَ
  text: 'تُحدثون وتجدّدون؛ «يقال: أجدّ فلان الشيء واستجده إذا أحدثه» [@khizana، ج9 ص495].'
- term: خَمْشًا
  text: خدشًا للوجوه بالأظفار في المأتم [@khizana، ج9 ص495].
- term: فَاجِعٍ
  text: «الذي فجعهم بنفسه» [@khizana، ج9 ص495]، أي بموته.
- term: نُعَا
  text: نُعِيَ، أي أُخبر بموته، على لغة طيئ [@khizana، ج9 ص495].
