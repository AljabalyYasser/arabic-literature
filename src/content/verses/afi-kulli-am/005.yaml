explained: false
first: وَيَرْكَبُ يَوْمَ الرَّوْعِ فِيهَا فَوَارِسٌ
second: بَصِيرُونَ فِي طَعْنِ الْأَبَاهِرِ وَالْكُلَى
vocabulary:
- term: الرَّوْعِ
  text: الفزع، يعني يوم الحرب.
- term: فِيهَا
  text: من أجلها، أي من أجل الإبل [@khizana، ج9 ص496].
- term: الْأَبَاهِرِ وَالْكُلَى
  text: 'مقاتل؛ قال الأحول: «الأباهر والكلى مقتلان، والأبهر: عرق في المتن» [@khizana، ج9 ص496].'
