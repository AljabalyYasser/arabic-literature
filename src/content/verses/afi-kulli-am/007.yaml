explained: false
first: وَذَاكَ عَطَاءُ اللَّهِ فِي كُلِّ غَارَةٍ
second: مُشَمِّرَةٍ يَوْمًا إِذَا قَلَصَ الْخُصَى
vocabulary:
- term: ذَاكَ
  text: الإشارة إلى ما تموّل واقتنى [@khizana، ج9 ص498].
- term: مُشَمِّرَةٍ
  text: جادّة، من «شمّر إزاره تشميرًا إذا رفعه» [@khizana، ج9 ص498].
- term: قَلَصَ الْخُصَى
  text: انضمّت وانزوت، «وتقلّص الخصى يكون عند الرعب والفزع» [@khizana، ج9 ص498].
