explained: false
first: أَفِي كُلِّ عَامٍ مَأْتَمٌ تَبْعَثُونَهُ
second: عَلَى مِحْمَرٍ عَوْدٍ أُثِيبَ وَمَا رُضَا
vocabulary:
- term: مَأْتَمٌ
  text: «الجماعة من النساء يجتمعن لحزن أو فرح، والمراد هنا الحزن» [@khizana، ج9 ص494].
- term: مِحْمَرٍ عَوْدٍ
  text: 'المِحْمَر عند أبي زيد: «الفرس الذي يشبه الحمار»، يريد فرسًا هجينًا بطيئًا؛ والعَوْد: «المسن» [@khizana، ج9 ص495].'
- term: أُثِيبَ
  text: «جُعل لنا ثوابًا»، أي جزاءً [@khizana، ج9 ص495].
- term: رُضَا
  text: 'رُضِيَ، بالبناء للمجهول، على لغة طيئ: «يقولون في بقي: بقا، وفي نعي: نعا» [@khizana، ج9 ص495].'
