first: تَرَعَّى بِأَذْنَابِ الشِّعَابِ وَدُونَهَا
second: رِجَالٌ يَرُدُّونَ الظَّلُومَ عَنِ الْهَوَى
vocabulary:
- term: تَرَعَّى
  text: ترعى، وأصلها «تترعّى» [@khizana، ج9 ص496].
- term: أَذْنَابِ الشِّعَابِ
  text: أواخرها؛ والشِّعاب جمع شِعْب، وهو «الموضع المنفرج بين جبلين» [@khizana، ج9 ص496].
- term: دُونَهَا
  text: أي دون هذه الإبل يحمونها [@khizana، ج9 ص496].
