explained: false
first: تَقُولُ أَرَى زَيْدًا وَقَدْ كَانَ مُقْتِرًا
second: أَرَاهُ لَعَمْرِي قَدْ تَمَوَّلَ وَاقْتَنَى
vocabulary:
- term: تَقُولُ
  text: 'تقول يا كعب؛ قال البغدادي: «هذا خطاب لكعب لا حكاية قول عرسه وإن كان ظاهرا» [@khizana، ج9 ص498].'
- term: مُقْتِرًا
  text: 'فقيرًا قليل المال. ويروى: «مُصْرِمًا»، أي صاحب صِرمة [@khizana، ج9 ص498].'
- term: تَمَوَّلَ
  text: '«صار ذا مال. والمال عند العرب: الإبل والماشية» [@khizana، ج9 ص498].'
- term: اقْتَنَى
  text: من «قنيت الشيء إذا اتخذته لنفسك لا للتجارة» [@khizana، ج9 ص498].
