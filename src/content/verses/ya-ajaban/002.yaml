first: وَلَا خَيْرَ فِيهِ غَيْرَ أَنَّ لَهُ غِنًى
second: وَأَنَّ لَهُ كَشْحًا إِذَا قَامَ أَهْضَمَا
vocabulary:
- term: كَشْحًا
  text: 'الكشح: ما بين الخاصرة والضلوع.'
- term: أَهْضَمَا
  text: ضامرًا؛ «ورجل أهضم الكشحين أي منضمهما» [@lisan، ج12 ص614]. «والكلام على الاستهزاء به، لبدانته» [@ibn-qutayba، ج1 ص182، حاشية المحقق].
