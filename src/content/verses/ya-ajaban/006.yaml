first: كَأَنَّ السِّلَاحَ فَوْقَ شُعْبَةِ بَانَةٍ
second: تَرَى نَفَخًا وَرْدَ الْأَسِرَّةِ أَسْحَمَا
vocabulary:
- term: شُعْبَةِ بَانَةٍ
  text: غصن من شجر البان.
- term: نَفَخًا
  text: انتفاخًا وورمًا.
- term: وَرْدَ الْأَسِرَّةِ
  text: 'أحمر الأسارير؛ والأسرّة في الوجه والكف: «الخطوط التي فيهما» [@lisan، ج4 ص361].'
- term: أَسْحَمَا
  text: أسود.
