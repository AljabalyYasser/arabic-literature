explained: false
first: وَيَشْرَبُ حَتَّى يَغْمُرَ الْمَحْضُ قَلْبَهُ
second: وَإِنْ أُعْطَهُ أَتْرُكْ لِقَلْبِيَ مَجْثَمَا
vocabulary:
- term: يَغْمُرَ
  text: يغطي.
- term: الْمَحْضُ
  text: اللبن الخالص «لم يخالطه ماء» [@lisan، ج7 ص227].
- term: مَجْثَمَا
  text: موضعًا يستقر فيه، من «جثم... لزم مكانه فلم يبرح» [@lisan، ج12 ص82]؛ أي لا أملأ جوفي كما يملؤه.
