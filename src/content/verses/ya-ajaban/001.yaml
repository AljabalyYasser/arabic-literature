explained: false
first: فَيَا عَجَبًا مِنْ عَبْدِ عَمْرٍو وَبَغْيِهِ
second: لَقَدْ رَامَ ظُلْمِي عَبْدُ عَمْرٍو فَأَنْعَمَا
vocabulary:
- term: عَبْدِ عَمْرٍو
  text: عبد عَمْرو بن بشر بن مرثد، ابن عم طَرَفَة، وكانت أخت طَرَفَة عنده، فشكت إليه «شيئا من أمر زوجها» [@ibn-qutayba، ج1 ص182].
- term: بَغْيِهِ
  text: ظلمه وتعدّيه.
- term: رَامَ
  text: أراد وطلب.
- term: أَنْعَمَا
  text: 'بالغ وزاد؛ «وأنعم فيه: بالغ... وفعل كذا وأنعم أي زاد» [@lisan، ج12 ص586].'
