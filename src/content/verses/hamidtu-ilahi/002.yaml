explained: false
first: "فَوَاللهِ لَا أَنْسَى قَتِيلًا رُزِئْتُهُ"
second: "بِجَانِبِ قُوسَى مَا مَشَيْتُ عَلَى الْأَرْضِ"
vocabulary:
  - term: "رُزِئْتُهُ"
    text: "أُصبت به وفقدته، و«الرُّزْءُ: المُصِيبةُ بفَقْد الأَعِزَّةِ» [@lisan، ج1 ص86]."
  - term: "قُوسَى"
    text: "بلدة بالسَّراة، وبها قُتل عروة أخو أبي خراش، فيما يقول محققو «الأغاني» [@aghani-dk، ج21 ص204، الحاشية]."
