first: "يُبَادِرُ قُرْبَ اللَّيْلِ فَهْوَ مُهَابِذٌ"
second: "يَحُثُّ الْجَنَاحَ بِالتَّبَسُّطِ وَالْقَبْضِ"
vocabulary:
  - term: "مُهَابِذٌ"
    text: "يعني الطائر، فهو جادّ ناجٍ، وأصله عند الشارح من «يهذب» فقلبه [@sukkari-hudhaliyyin، ص1231]."
  - term: "الْقَبْضِ"
    text: "أن يقبض جناحه [@sukkari-hudhaliyyin، ص1231]."
