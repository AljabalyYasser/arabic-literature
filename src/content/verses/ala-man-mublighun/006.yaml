explained: false
first: "فَقَالَتْ عُدْ فَقُلْتُ لَهَا رُوَيْدًا"
second: "مَكَانَكِ إِنَّنِي ثَبْتُ الجَنَانِ"
vocabulary:
  - term: "عُدْ"
    text: "أعِد الضربة. وعند الجاحظ أن «الأعراب والعامة تزعم أن الغول إذا ضربت ضربة ماتت، إلا أن يعيد عليها الضارب قبل أن تقضي ضربة أخرى، فإنه إن فعل ذلك لم تمت» [@hayawan، ج6 ص438]."
  - term: "ثَبْتُ الجَنَانِ"
    text: "ثابت القلب؛ «والجنان، بالفتح: القلب» [@lisan، ج13 ص93]."
