first: "وَسَاقَا مُخْدَجٍ وَشَوَاةُ كَلْبٍ"
second: "وَثَوْبٌ مِنْ عَبَاءٍ أَوْ شِنَانِ"
vocabulary:
  - term: "مُخْدَجٍ"
    text: "ناقص الخلق."
  - term: "شَوَاةُ كَلْبٍ"
    text: "جلدة رأس كلب، «والشواة: جلدة الرأس» [@lisan، ج14 ص446]."
  - term: "عَبَاءٍ"
    text: "أكسية من صوف."
  - term: "شِنَانِ"
    text: "جمع شنّ، «والشنّ: القربة الخلق» [@lisan، ج13 ص241]."
