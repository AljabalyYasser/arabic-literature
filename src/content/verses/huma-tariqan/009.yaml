first: "قَدْ أَيْقَنَتْ أَنَّهَا تَصِيرُ كَمَا"
second: "كَانَ يَرَاهَا بِالْأَمْسِ خَالِقُهَا"
vocabulary:
  - term: "تَصِيرُ كَمَا كَانَ يَرَاهَا"
    text: "تعود إلى العدم الذي كانت عليه قبل أن تُخلق. وفي رواية أبي الحسن: «وَأَيْقَنَتْ أَنَّهَا تَعُودُ كَمَا / كَانَ بَرَاهَا بِالْأَمْسِ خَالِقُهَا» [@kamil، ج1 ص62]."
