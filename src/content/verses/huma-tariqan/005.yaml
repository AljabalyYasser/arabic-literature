first: "عَبْدٌ دَعَا نَفْسَهُ فَعَاتَبَهَا"
second: "يَعْلَمُ أَنَّ الْبَصِيرَ رَامِقُهَا"
vocabulary:
  - term: "الْبَصِيرَ"
    text: "الله الذي يبصر كل شيء."
  - term: "رَامِقُهَا"
    text: "ناظر إليها لا يغفل عنها، و«رمقَه يَرْمُقه رَمْقاً ورامَقَه: نَظَرَ إِليه» [@lisan، ج10 ص126]."
