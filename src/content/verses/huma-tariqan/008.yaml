first: "أَمَامَهَا قَائِدٌ إِلَيْهِ وَيَحْـ"
second: "ـدُوهَا حَثِيثًا إِلَيْهِ سَائِقُهَا"
vocabulary:
  - term: "يَحْدُوهَا"
    text: "يسوقها من خلفها، وأصله في الإبل: «حَدَا الإِبِلَ ... زَجَرَها خَلْفَها وساقَها» [@lisan، ج14 ص168]."
  - term: "حَثِيثًا"
    text: "مسرعًا."
