first: "وَصَدُّهَا لِلشَّقَاءِ عَنْ طَلَبِ الْـ"
second: "ـجَنَّةِ دُنْيَا وَاللَّهُ مَاحِقُهَا"
vocabulary:
  - term: "وَصَدُّهَا"
    text: "ويصرفها، والمعنى: والذي يصدّها عن طلب الجنة دنيا."
  - term: "مَاحِقُهَا"
    text: "مُذهبها ومبطلها، و«المَحْق: النُّقْصَانُ وَذَهَابُ الْبَرَكَةِ» [@lisan، ج10 ص338]."
