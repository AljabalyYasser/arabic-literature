first: "هُمَا طَرِيقَانِ فَائِزٌ دَخَلَ الْـ"
second: "ـجَنَّةَ حُفَّتْ بِهِ حَدَائِقُهَا"
meaning: "هما طريقان لا ثالث لهما: أحدهما طريق فائز دخل الجنة فأحاطت به حدائقها من كل جانب، والآخر، في البيت التالي، طريق فرقة في الجحيم."
vocabulary:
  - term: "فَائِزٌ"
    text: "ناجٍ ظافر بما يرجو."
  - term: "حُفَّتْ بِهِ"
    text: "أحاطت به."
  - term: "حَدَائِقُهَا"
    text: "بساتينها."
context: "أول ما يرويه ابن قُتَيْبة من القطعة [@uyun-al-akhbar، ج2 ص404]، ويبدأ بالضمير «هما» كأن ما قبله قد ذكر الطريقين، فهو فيما يظهر وسط قصيدة لا أولها. وفيه تُعلن قسمة الناس التي يقوم عليها الوعظ في الأبيات كلها."
syntax:
  - "«هُمَا» ضمير منفصل مبتدأ، و«طريقان» خبره مرفوع بالألف لأنه مثنى."
  - "«فَائِزٌ» خبر لمبتدأ محذوف تقديره: أحدهما طريقُ فائزٍ، أو: فمنهم فائز، وهو أول قسمي التقسيم، وقسيمه «فرقةٌ» في البيت التالي."
  - "«دَخَلَ الْجَنَّةَ» فعل ماض وفاعله ضمير مستتر، و«الجنة» مفعول به على السعة، والجملة نعت لـ«فائز»."
  - "«حُفَّتْ بِهِ حَدَائِقُهَا» فعل ماض مبني للمجهول، و«حدائقُها» نائب فاعل، و«به» متعلق بـ«حُفّت»، والجملة حال من «الجنة»."
morphology:
  - "«طريقان» مثنى «طريق» على «فَعِيل»."
  - "«فائز» اسم فاعل من «فاز يفوز»، وعينه الواو قُلبت همزة."
  - "«حُفّت» ماض مضعّف مبني للمجهول من «حَفَّ»، و«حدائق» جمع «حديقة» على «فَعائِل»."
rhetoric:
  thesis: "يبدأ الواعظ بالنهاية: لا يصف الطريق بل ما ينتهي إليه، فيضع القارئ أمام خيارين قبل أن يبدأ الكلام عن الدنيا."
  devices:
    - title: "التقسيم في «هُمَا طَرِيقَانِ فَائِزٌ ...» و«وَفِرْقَةٌ ...» في البيت التالي"
      text: "يقسم الناس قسمين ويستوفيهما. وهو صحة التقسيم عند قُدامة بن جعفر: «أن يبتدئ الشاعر فيضع أقساماً فيستوفيها، ولا يغادر قسماً منها» [@naqd-al-shir، ص46]."
    - title: "المقابلة بين المفرد «فَائِزٌ» والجمع «فِرْقَةٌ»"
      text: "يجعل الفائز فردًا والهالكين فرقة مع «فِرَق الشيطان»، فكأن النجاة طريق آحاد والهلاك طريق الجموع. وهي قراءتنا."
    - title: "لغة القرآن في «الْجَنَّةَ» و«الْجَحِيمِ» و«فِرَقِ الشَّيْطَانِ»"
      text: "معجم البيتين الأولين معجم ديني لا نجده في شعر البادية، وهذا مما يجعل نسبة القطعة موضع نظر، كما في متن النص."
  connection: "يتمّ التقسيم في البيت التالي: «وَفِرْقَةٌ فِي الْجَحِيمِ مَعْ فِرَقِ الشَّيْطَانِ»."
prosody:
  meter: "البحر المنسرح"
  rhyme: "الرَّوِيّ القاف المضمومة، بعدها هاء الوصل وألف الخروج"
  scansion: "هُمَا طَرِي / قَانِفَائِ / زُنْدَخَلَلْ = مُتَفْعِلُن / مَفْعُلاتُ / مُسْتَعِلُن — جَنْنَةَحُفْ / فَتْبِهِيحَ / دَائِقُهَا = مُسْتَعِلُن / مَفْعُلاتُ / مُسْتَعِلُن"
  note: "في «مُسْتَفْعِلُن» الأولى حُذف الثاني الساكن فصارت «مُتَفْعِلُن»، وهذا الخَبْن. وحُذف الرابع الساكن من «مَفْعُولاتُ» ومن «مُسْتَفْعِلُن» الأخيرة فصارتا «مَفْعُلاتُ» و«مُسْتَعِلُن»، وهذا الطَّيّ، وهو الغالب في عروض المنسرح وضربه. وتُشبع كسرة الهاء في «بِهِ»."
