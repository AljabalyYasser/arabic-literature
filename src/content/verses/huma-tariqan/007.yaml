first: "مَا رَغْبَةُ النَّفْسِ فِي الْبَقَاءِ وَأَنْ"
second: "تَحْيَا قَلِيلًا وَالْمَوْتُ لَاحِقُهَا"
meaning: "ما الذي تنفع النفسَ رغبتُها في البقاء، وفي أن تعيش زمنًا قليلًا آخر، والموت يلحقها لا محالة؟ فالرغبة في الحياة لا تؤخر الموت."
vocabulary:
  - term: "رَغْبَةُ النَّفْسِ"
    text: "حرصها وتعلقها."
  - term: "الْبَقَاءِ"
    text: "دوام الحياة."
  - term: "لَاحِقُهَا"
    text: "مدركها."
context: "قلب القطعة، وهو أول الأبيات التي ينسبها أبو الحسن في «الكامل» إلى رجل من الخوارج، ويرويه هكذا: «مَا رَغْبَةُ النَّفْسِ فِي الْحَيَاةِ وَإِنْ / عَاشَتْ قَلِيلًا فَالْمَوْتُ لَاحِقُهَا» [@kamil، ج1 ص62]. ومنه تنتقل القطعة من وعظ الناس إلى حال النفس الواحدة أمام الموت، حتى تنتهي بالحكمة الجامعة في البيت 11."
syntax:
  - "«مَا» اسم استفهام مبني في محل رفع مبتدأ، و«رغبةُ» خبره، و«النفس» مضاف إليه. ويجوز العكس."
  - "«فِي الْبَقَاءِ» جار ومجرور متعلق بـ«رغبة»، و«وأنْ تحيا» «أن» حرف مصدري ونصب، و«تحيا» فعل مضارع منصوب بفتحة مقدرة، والمصدر المؤول معطوف على «البقاء»."
  - "«قَلِيلًا» نائب عن ظرف الزمان، أي زمنًا قليلًا، أو نعت لمصدر محذوف، أي حياة قليلة."
  - "«وَالْمَوْتُ لَاحِقُهَا» الواو حالية، و«الموتُ» مبتدأ، و«لاحقُها» خبره، والجملة حال من «النفس»."
morphology:
  - "«رَغْبة» على «فَعْلة» من «رغب»."
  - "«البقاء» مصدر «بَقِيَ» على «فَعال»، وهمزته منقلبة عن الياء."
  - "«لاحِق» اسم فاعل من «لَحِقَ» على «فاعِل»، أضيف إلى ضميره."
rhetoric:
  thesis: "سؤال لا جواب له إلا الصمت: النفس تطلب ما تعرف أنها لن تبلغه. فالبيت يجعل الرغبة في الحياة نفسها حجة على عبثها."
  devices:
    - title: "الاستفهام الإنكاري في «مَا رَغْبَةُ النَّفْسِ»"
      text: "لا يسأل عن مقدار الرغبة، بل ينكر جدواها: ما تغني عنها رغبتها؟ والجواب المفهوم: لا شيء."
    - title: "الاستعارة في «وَالْمَوْتُ لَاحِقُهَا»"
      text: "جعل الموت طالبًا يعدو وراء النفس حتى يلحقها، فحذف المشبه به وأبقى من صفاته اللحاق. والاستعارة عند عبد القاهر الجُرْجانيّ أن تريد «تشبيهَ الشيءِ بالشيءِ، فَتَدعَ أنْ تُفْصحَ بالتشبيهِ وتُظْهرَه» [@dalail، ص67]. وتتصل الصورة بما بعدها: للموت قائد يقودها وسائق يحدوها في البيت 8."
    - title: "المقابلة بين «الْبَقَاءِ» و«الْمَوْتُ»"
      text: "يفتتح الرغبة بالبقاء ويختم بالموت، فيضع الضدين في طرفي البيت."
  connection: "يصف البيت التالي الموت قائدًا وسائقًا: «أَمَامَهَا قَائِدٌ إِلَيْهِ وَيَحْدُوهَا حَثِيثًا إِلَيْهِ سَائِقُهَا»."
prosody:
  meter: "البحر المنسرح"
  rhyme: "الرَّوِيّ القاف المضمومة، بعدها هاء الوصل وألف الخروج"
  scansion: "مَارَغْبَتُنْ / نَفْسِفِلْبَ / قَاءِوَأَنْ = مُسْتَفْعِلُن / مَفْعُلاتُ / مُسْتَعِلُن — تَحْيَاقَلِي / لَنْوَلْمَوْتُ / لَاحِقُهَا = مُسْتَفْعِلُن / مَفْعُولاتُ / مُسْتَعِلُن"
  note: "طُويت «مَفْعُولاتُ» في الصدر فصارت «مَفْعُلاتُ»، وسلمت في العجز. والعروض والضرب «مُسْتَعِلُن» مطويّتان."
