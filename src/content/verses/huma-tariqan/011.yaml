first: "مَنْ لَمْ يَمُتْ عَبْطَةً يَمُتْ هَرَمًا"
second: "لِلْمَوْتِ كَأْسٌ وَالْمَرْءُ ذَائِقُهَا"
meaning: "من لم يمت شابًّا صحيحًا مات شيخًا كبيرًا، فلا نجاة من الموت في الحالين: الموت كأس لا بد لكل إنسان أن يشربها."
vocabulary:
  - term: "عَبْطَةً"
    text: "شابًّا، يقول ابن منظور: «وَمَاتَ عَبْطةً أَي شَابًّا، وَقِيلَ: شَابًّا صَحِيحًا»، ثم يستشهد بهذا البيت لأمية [@lisan، ج7 ص347]. وأصل العَبْط نحر الناقة سمينة فتية من غير داء."
  - term: "هَرَمًا"
    text: "في الكبر وضعف الشيخوخة."
  - term: "كَأْسٌ"
    text: "إناء الشراب، و«يُسْتَعَارُ الكأْس فِي جَمِيعِ ضُرُوب الْمَكَارِهِ، كَقَوْلِهِمْ: سَقَاهُ كأْساً مِنَ الذلِّ، وكأْساً مِنَ الحُبِّ والفُرْقة وَالْمَوْتِ» [@lisan، ج6 ص190]."
  - term: "ذَائِقُهَا"
    text: "شاربها، ومن ذاق الكأس فقد شرب منها."
context: "خاتمة القطعة وبيتها السائر، وهو الذي جعل لها شهرتها. يستشهد به المُبَرِّد على معنى «العبطة»: «اعتبط فلان إذا مات شاباً، قال أمية» [@kamil، ج1 ص270]، ويقول ابن عبد ربّه: «وأحكم بيت قالته العرب في وصف الموت، بيت أمية بن أبي الصلت» [@iqd، ج3 ص137]، ويرويه ابن منظور لأمية في موضعين، ثم يقول في أحدهما: «وَقِيلَ هُوَ لِبَعْضِ الْحَرُورِيَّةِ» [@lisan، ج6 ص190]. ويرويه المُبَرِّد وابن عبد ربّه بعد بيت ليس في رواية ابن قُتَيْبة: «يُوشِكُ مَنْ فَرَّ مِنْ مَنِيَّتِهِ / فِي بَعْضِ غِرَّاتِهِ يُوَافِقُهَا» [@kamil، ج1 ص62] [@iqd، ج3 ص137]."
syntax:
  - "«مَنْ» اسم شرط جازم مبني في محل رفع مبتدأ، و«لم يمت» فعل الشرط مجزوم بـ«لم»."
  - "«عَبْطَةً» منصوب على المصدر، أي موتَ عبطةٍ، يقول ابن بَرّي في اللسان: «وَانْتَصَبَ عَلَى الْمَصْدَرِ أَي مَوْت عَبْطَة وَمَوْتُ هَرَم فَحَذَفَ» [@lisan، ج6 ص188]، ومثله «هَرَمًا». ويجوز أن يكونا حالين بمعنى: شابًّا وهَرِمًا."
  - "«يَمُتْ» جواب الشرط مجزوم، وجملة الشرط وجوابه خبر «مَن»."
  - "«لِلْمَوْتِ كَأْسٌ» جملة مستأنفة: «للموت» جار ومجرور متعلق بمحذوف خبر مقدم، و«كأسٌ» مبتدأ مؤخر."
  - "«وَالْمَرْءُ ذَائِقُهَا» الواو عاطفة أو حالية، و«المرءُ» مبتدأ، و«ذائقُها» خبره."
morphology:
  - "«عَبْطة» على «فَعْلة» للمرة من «عَبَطَ»."
  - "«هَرَم» مصدر «هَرِمَ» على «فَعَل»."
  - "«ذائِق» اسم فاعل من «ذاق يذوق» الأجوف الواوي، قُلبت عينه همزة في «فاعِل»."
rhetoric:
  thesis: "حكمة تامة في بيت: الصدر يحصر طريقي الموت فلا يترك لأحد مهربًا، والعجز يحوّل هذه الحقيقة إلى صورة تُحفظ. ولذلك سار مثلًا."
  devices:
    - title: "الطباق بين «عَبْطَةً» و«هَرَمًا»"
      text: "يجمع طرفي العمر، الشباب والشيخوخة، فيستوعب كل ما بينهما: أيًّا كان عمرك فأنت ميت."
    - title: "الاستعارة في «لِلْمَوْتِ كَأْسٌ» و«ذَائِقُهَا»"
      text: "جعل للموت كأسًا تُدار على الناس، وجعل الموت شرابًا يُذاق. والاستعارة عند عبد القاهر الجُرْجانيّ أن تجيء «إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]. وابن منظور يذكر أن الكأس تُستعار لكل مكروه، ومنه الموت [@lisan، ج6 ص190]، فالصورة كانت مألوفة في كلام العرب، وجِدّة البيت في إحكام ضمّها إلى الصدر."
    - title: "التذييل في «لِلْمَوْتِ كَأْسٌ وَالْمَرْءُ ذَائِقُهَا»"
      text: "يعيد في العجز معنى الصدر في صورة حكمة عامة تؤكده. والتذييل عند أبي هلال العسكري «إعادة الألفاظ المترادفة على المعنى بعينه، حتى يظهر لمن لم يفهمه، ويتوكد عند من فهمه» [@sinaatayn، ص373]."
  connection: "خاتمة القطعة في رواية ابن قُتَيْبة، وبعدها ينتقل إلى كلام لبعض الزهاد."
prosody:
  meter: "البحر المنسرح"
  rhyme: "الرَّوِيّ القاف المضمومة، بعدها هاء الوصل وألف الخروج"
  scansion: "مَنْلَمْيَمُتْ / عَبْطَتَنْيَ / مُتْهَرَمَنْ = مُسْتَفْعِلُن / مَفْعُلاتُ / مُسْتَعِلُن — لِلْمَوْتِكَأْ / سُنْوَلْمَرْءُ / ذَائِقُهَا = مُسْتَفْعِلُن / مَفْعُولاتُ / مُسْتَعِلُن"
  note: "طُويت «مَفْعُولاتُ» في الصدر وسلمت في العجز، والعروض والضرب مطويّتان «مُسْتَعِلُن»."
