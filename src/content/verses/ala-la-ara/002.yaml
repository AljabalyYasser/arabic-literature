explained: false
first: "بِدَاهِيَةٍ يُضْغِي الْكِلَابَ حَسِيسُهَا"
second: "وَتَخْرُجُ مِنْ سِرِّ النَّجِيِّ عَلَانِيَهْ"
vocabulary:
- term: "يُضْغِي"
  text: "في الشرح: «ويُضغي: يُسكت»، وعن أبي سعيد الضرير: «يُضغي: يُصيح الكلاب» [@diwan-khansa، ص59]."
- term: "حَسِيسُهَا"
  text: "في الشرح: «حسيسها: حسّها، والحسّ: الصوت» [@diwan-khansa، ص59]."
- term: "النَّجِيِّ"
  text: "في الشرح: «والنجيّ: هم الرجال الذين يتناجون؛ أي يخرج سرهم علانية لأنهم أسرّوها قبلُ ثم أعلنوها» [@diwan-khansa، ص59]."
sources:
- source: "diwan-khansa"
  loc: "ص58–59"
  url: "https://archive.org/details/3318pdf_202001/page/n57/mode/1up"
status: "review"
