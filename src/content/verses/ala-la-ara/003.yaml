first: "أَلَا لَا أَرَى كَفَارِسِ الْجَوْنِ فَارِسًا"
second: "إِذَا مَا عَلَتْهُ جُرْأَةٌ وَغَلَانِيَهْ"
vocabulary:
- term: "إِذَا مَا عَلَتْهُ"
  text: "في الشرح: «أي إذا ما أخذته أريحيّة إلى الجرأة» [@diwan-khansa، ص60]."
- term: "وَغَلَانِيَهْ"
  text: "في الشرح: «والغلانية: إفراط في الغضب، أي: غلوّ في نجدته» [@diwan-khansa، ص61]."
