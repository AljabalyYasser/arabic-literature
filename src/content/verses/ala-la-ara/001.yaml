first: "أَلَا لَا أَرَى فِي النَّاسِ مِثْلَ مُعَاوِيَهْ"
second: "إِذَا طَرَقَتْ إِحْدَى اللَّيَالِي بِدَاهِيَهْ"
vocabulary:
- term: "طَرَقَتْ"
  text: "جاءت ليلًا."
- term: "إِحْدَى اللَّيَالِي"
  text: "في الشرح المنسوب إلى ثَعْلَب: «أي: إحدى الليالي التي تُعرف، كما تقول: إحدى الإحَد، وإحدى الكُبَر: أي واحدة من الليالي، أي: أشدّ الليالي» [@diwan-khansa، ص58]."
