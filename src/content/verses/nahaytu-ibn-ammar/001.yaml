first: "إِنِّي نَهَيْتُ ابْنَ عَمَّارٍ وَقُلْتُ لَهُ"
second: "لَا تَأْمَنَنْ أَحْمَرَ العَيْنَيْنِ وَالشَّعَرَهْ"
vocabulary:
  - term: "ابْنَ عَمَّارٍ"
    text: "نديم النعمان بن المنذر وقتيله."
  - term: "أَحْمَرَ العَيْنَيْنِ وَالشَّعَرَهْ"
    text: "يعني النعمان، وكان أحمر العينين والجلد والشعر كما يقول الجاحظ [@bayan، ج1 ص281]."
