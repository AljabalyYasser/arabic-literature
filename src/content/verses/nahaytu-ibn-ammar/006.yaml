explained: false
first: "لَقَدْ نَهَيْتُكَ عَمَّنْ لَا كِفَاءَ لَهُ"
second: "عِنْدَ الحِفَاظِ وَعَنْ غَوْثٍ وَعَنْ فُطُرَهْ"
vocabulary:
  - term: "لَا كِفَاءَ لَهُ"
    text: "لا نظير له يكافئه."
  - term: "عِنْدَ الحِفَاظِ"
    text: "عند الدفاع عن الحُرَم."
  - term: "غَوْثٍ ... فُطُرَهْ"
    text: "اسما قوم، ولم نجد في مصادرنا من فسّرهما."
