explained: false
first: "يَا جَفْنَةً كَإِزَاءِ الحَوْضِ قَدْ هَدَمُوا"
second: "وَمَنْطِقًا مِثْلَ بُرْدِ اليُمْنَةِ الحِبَرَهْ"
vocabulary:
  - term: "جَفْنَةً"
    text: "قصعة كبيرة يُطعم فيها الضيفان."
  - term: "كَإِزَاءِ الحَوْضِ"
    text: "«والإِزَاءُ: مَصَبُّ الْمَاءِ فِي الْحَوْضِ» [@lisan، ج14 ص33]، أي واسعة كمصبّ الحوض."
  - term: "قَدْ هَدَمُوا"
    text: "قد كسروا، أي قتلوا صاحبها."
  - term: "اليُمْنَةِ"
    text: "«ضربٌ مِنْ بُرود الْيَمَنِ» [@lisan، ج13 ص463]."
  - term: "الحِبَرَهْ"
    text: "«ضَرْبٌ مِنْ بُرُودِ الْيَمَنِ مُنَمَّر» [@lisan، ج4 ص159]، أي مخطط. شبّه به منطق القتيل في حسنه."
