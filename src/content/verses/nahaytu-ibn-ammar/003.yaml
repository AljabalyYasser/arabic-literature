explained: false
first: "إِنْ يَقْتُلُوكَ فَلَا نِكْسٌ وَلَا وَرَعٌ"
second: "عِنْدَ اللِّقَاءِ وَلَا هَوْهَاءَةٌ هُمَرَهْ"
vocabulary:
  - term: "نِكْسٌ"
    text: "«والنِّكْسُ مِنَ الرِّجَالِ الْمُقَصِّرُ عَنْ غَايَةِ النَّجْدَة وَالْكَرَمِ» [@lisan، ج6 ص242]."
  - term: "وَرَعٌ"
    text: "الصغير الضعيف الذي لا غَناء عنده [@lisan، ج8 ص388]."
  - term: "هَوْهَاءَةٌ"
    text: "الأحمق: «هَوْهاءة اللُّبّ أَخْرَقُ» [@lisan، ج15 ص374]."
  - term: "هُمَرَهْ"
    text: "كثير الكلام، من الهَمْر وهو الصبّ [@lisan، ج5 ص266]."
