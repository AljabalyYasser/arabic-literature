explained: false
first: "وَقَدْ نَصَحْتُ لَهُ وَالعَيْشُ تَارِكُهُ"
second: "بَيْنَ الجُدَيْدَاءِ وَالمَوْمَاةِ وَالأَمَرَهْ"
vocabulary:
  - term: "وَالعَيْشُ تَارِكُهُ"
    text: "والحياة مفارقته."
  - term: "الجُدَيْدَاءِ"
    text: "يبدو اسم موضع، ولم نجد تفسيره في مصادرنا."
  - term: "المَوْمَاةِ"
    text: "الفلاة الواسعة."
  - term: "الأَمَرَهْ"
    text: "«العَلَمُ الصَّغِيرُ مِنْ أَعلام الْمَفَاوِزِ من حجارة» [@lisan، ج4 ص32]."
