first: "أَرَى أُمَّ صَخْرٍ مَا تَجِفُّ دُمُوعُهَا"
second: "وَمَلَّتْ سُلَيْمَى مَضْجَعِي وَمَكَانِي"
vocabulary:
  - term: "أُمَّ صَخْرٍ"
    text: "أمه، وهي التي كانت تقول إذا سُئلت عنه: «أصبح صالحا بنعمة الله» [@ibn-qutayba، ج1 ص333]."
  - term: "سُلَيْمَى"
    text: "امرأته، ويسميها ابن قُتَيْبة «امرأته سلمى» [@ibn-qutayba، ج1 ص332]."
