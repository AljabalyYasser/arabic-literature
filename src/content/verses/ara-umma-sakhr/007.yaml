first: "فَلَوْ أَنَّ حَيًّا فَائِتُ المَوْتِ فَاتَهُ"
second: "أَخُو الحَرْبِ فَوْقَ القَارِحِ العَدَوَانِ"
vocabulary:
  - term: "القَارِحِ"
    text: "الفرس التام السن، و«القارح من ذي الحافر: بمنزلة البازل من الإبل» [@lisan، ج2 ص559]."
  - term: "العَدَوَانِ"
    text: "الكثير العدو، و«فرس عدوان إذا كان كثير العدو» [@lisan، ج15 ص32]."
