first: "وَمَا كُنْتُ أَخْشَى أَنْ أَكُونَ جِنَازَةً"
second: "عَلَيْكِ وَمَنْ يَغْتَرُّ بِالحَدَثَانِ"
vocabulary:
  - term: "جِنَازَةً"
    text: "ثِقْلًا، و«إذا ثقل على القوم أمر أو اغتموا به، فهو جنازة» [@lisan، ج5 ص324]."
  - term: "بِالحَدَثَانِ"
    text: "بنوائب الدهر، كما في قولهم: «هل أبقى حدثان الدهر واحدا» [@lisan، ج7 ص358]."
