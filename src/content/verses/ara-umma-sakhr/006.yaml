explained: false
first: "وَحَيٍّ حَرِيدٍ قَدْ صَبَحْتُ بِغَارَةٍ"
second: "كَرِجْلِ جَرَادٍ أَوْ دَبًا كُتُفَانِ"
vocabulary:
  - term: "حَرِيدٍ"
    text: "«وحي حريد: منفرد معتزل من جماعة القبيلة ولا يخالطهم في ارتحاله وحلوله» [@lisan، ج3 ص145]."
  - term: "صَبَحْتُ"
    text: "أتيتهم صباحًا، و«صبحتهم الخيل وصبحتهم: جاءتهم صبحا» [@lisan، ج2 ص505]."
  - term: "كَرِجْلِ جَرَادٍ"
    text: "كجماعة كثيرة من الجراد، و«الرجل، بالكسر: الجراد الكثير» [@lisan، ج11 ص273]."
  - term: "دَبًا"
    text: "«الدبى: الجراد قبل أن يطير» [@lisan، ج14 ص248]."
  - term: "كُتُفَانِ"
    text: "من الجراد «التي ظهرت أجنحتها ولما تطر بعد، فهي تنقز في الأرض نقزانا» [@lisan، ج9 ص295]. ويقول محققا «الأصمعيات» إنها تُضبط بضم الكاف وكسرها مع سكون التاء، وجاءت هنا بضمتين للوزن [@asmaiyyat، ص147، الحاشية]."
