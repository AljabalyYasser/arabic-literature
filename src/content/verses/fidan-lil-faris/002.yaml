first: "أُفَدِّيهِ بِحَيِّ بَنِي سُلَيْمٍ"
second: "بِظَاعِنِهِمْ وَبِالْأَنَسِ الْمُقِيمِ"
vocabulary:
- term: "بِظَاعِنِهِمْ"
  text: "بمن يرحل منهم، من «ظَعَنَ يَظْعَنُ ظَعْناً وظَعَناً، بِالتَّحْرِيكِ، وظُعوناً: ذَهَبَ وَسَارَ» [@lisan، ج13 ص270]."
- term: "وَبِالْأَنَسِ الْمُقِيمِ"
  text: "في الشرح: «الأنَس: أهل الدار الذين فيها» [@diwan-khansa، ص222]."
