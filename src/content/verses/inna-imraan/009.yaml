explained: false
first: أَلْقَوْا إِلَيْكَ بِكُلِّ أَرْمَلَةٍ
second: شَعْثَاءَ تَحْمِلُ مِنْقَعَ الْبُرْمِ
vocabulary:
- term: أَرْمَلَةٍ
  text: امرأة محتاجة لا زوج لها.
- term: شَعْثَاءَ
  text: متلبّدة الشعر مغبرّة.
- term: مِنْقَعَ الْبُرْمِ
  text: «تور صغير أو قديرة صغيرة من حجارة... تكون للصبي يطرحون فيه التمر واللبن يطعمه ويسقاه» [@lisan، ج8 ص362]. والبُرْم جمع بُرْمة، وهي «قدر من حجارة» [@lisan، ج12 ص45].
