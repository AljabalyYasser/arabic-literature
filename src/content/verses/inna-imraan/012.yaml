first: فَسَقَى بِلَادَكَ غَيْرَ مُفْسِدِهَا
second: صَوْبُ الْغَمَامِ وَدِيمَةٌ تَهْمِي
vocabulary:
- term: غَيْرَ مُفْسِدِهَا
  text: 'لا يكثر حتى يفسدها؛ قال ابن رَشِيق: «احتراس للديار من الفساد بكثرة المطر» [@ibn-rashiq، ج2 ص50].'
- term: صَوْبُ الْغَمَامِ
  text: مطر السحاب.
- term: دِيمَةٌ
  text: «مطر يدوم مع سكون» [@lisan، ج1 ص547].
- term: تَهْمِي
  text: تسيل.
