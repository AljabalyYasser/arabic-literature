first: وَأَنَا امْرُؤٌ أَكْوِي مِنَ الْقَصَرِ
second: الْبَادِي وَأَغْشَى الدَّهْمَ بِالدَّهْمِ
vocabulary:
- term: أَكْوِي
  text: أداوي بالكيّ.
- term: الْقَصَرِ
  text: '«داء يأخذ في القَصَرة»، والقَصَرة: «أصل العنق» [@lisan، ج5 ص101–102].'
- term: أَغْشَى الدَّهْمَ بِالدَّهْمِ
  text: 'ألقى الجمع الكثير بجمع كثير؛ «والدهم: العدد الكثير»، «وجيش دهم أي كثير» [@lisan، ج12 ص211].'
