explained: false
first: وَأُجِرُّ ذَا الْكِفْلِ الْقَنَاةَ عَلَى
second: أَنْسَائِهِ فَيَظَلُّ يَسْتَدْمِي
vocabulary:
- term: أُجِرُّ
  text: أطعنه وأترك الرمح فيه يجرّه؛ «أجررته الرمح إذا طعنته به فمشى وهو يجره» [@lisan، ج4 ص127].
- term: الْكِفْلِ
  text: '«الكفل من الرجال: الذي يكون في مؤخر الحرب إنما همته في التأخر والفرار»، وقيل: «الذي لا يثبت على ظهور الخيل» [@lisan، ج11 ص589].'
- term: أَنْسَائِهِ
  text: جمع نَسا، وهو «عرق من الورك إلى الكعب» [@lisan، ج15 ص321].
- term: يَسْتَدْمِي
  text: يسيل دمه.
