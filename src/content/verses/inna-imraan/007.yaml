first: أَبْلِغْ قَتَادَةَ غَيْرَ سَائِلِهِ
second: مِنْهُ الثَّوَابَ وَعَاجِلَ الشُّكْمِ
vocabulary:
- term: قَتَادَةَ
  text: 'قَتادة بن سَلَمة الحَنَفيّ. قالها طَرَفَة يمدحه، كما يقول الأعلم، وقد «أصاب قومه سنة فأتوه فبذل لهم» [@diwan-tarafa، ص102]، أي أن قوم طَرَفَة أصابهم جدب فأعطاهم.'
- term: الثَّوَابَ
  text: الجزاء.
- term: الشُّكْمِ
  text: '«الشكم، بالضم: العطاء، وقيل: الجزاء» [@lisan، ج12 ص323].'
