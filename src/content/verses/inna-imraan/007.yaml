first: أَبْلِغْ قَتَادَةَ غَيْرَ سَائِلِهِ
second: مِنْهُ الثَّوَابَ وَعَاجِلَ الشُّكْمِ
vocabulary:
- term: قَتَادَةَ
  text: قتادة بن مسلمة الحنفي في قول محقق الديوان، وقد أعطى قوم طَرَفَة في سنة شدة [@diwan-tarafa، ص78، الحاشية].
- term: الثَّوَابَ
  text: الجزاء.
- term: الشُّكْمِ
  text: '«الشكم، بالضم: العطاء، وقيل: الجزاء» [@lisan، ج12 ص323].'
