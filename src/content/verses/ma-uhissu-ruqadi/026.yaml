explained: false
first: "وَالبِيضُ يَرْمِينَ القُلُوبَ كَأَنَّهَا"
second: "أُدْحِيُّ بَيْنِ صَرِيمَةٍ وَجَمَادِ"
vocabulary:
  - term: "أُدْحِيُّ"
    text: "يقول محققا «المفضليات»: «الموضع تدحوه النعامة برجلها لتبيض فيه. أراد: كأنها بيض أدحي» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "صَرِيمَةٍ"
    text: "يقول محققا «المفضليات»: «القطعة من الرمل» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "وَجَمَادِ"
    text: "يقول محققا «المفضليات»: «ما غلظ من الأرض وارتفع، لم يبلغ أن يكون جبلا» [@mufaddaliyyat، ص219، الحاشية]."
