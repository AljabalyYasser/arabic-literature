first: "جَرَتِ الرِّيَاحُ عَلَى مَكَانِ دِيَارِهِمْ"
second: "فَكَأَنَّمَا كَانُوا عَلَى مِيعَادِ"
meaning: "مرّت الرياح على الموضع الذي كانت فيه ديارهم، فلم يبق منها أثر، وذهبوا جميعًا، كأنهم تواعدوا على الرحيل في وقت واحد فرحلوا معًا. فالبيت يصف أمرين: محو المكان، وسرعة ذهاب أهله جملةً."
vocabulary:
  - term: "مِيعَادِ"
    text: "الموعد، أي الوقت المتّفق عليه."
context: "قلب مقطع الملوك، والبيت الذي سار من القصيدة. يروي أبو الفَرَج أن مولى جرير بن سهم التميمي كان يسير أمام علي بن أبي طالب، فلما انتهى إلى مدائن كسرى تمثّل بهذا البيت، فقال له علي: «فلِمَ لم تقل كما قال الله جل وعز: «كم تركوا من جنات وعيون»»، ثم قال: «إن هؤلاء كفروا النعمة، فحلّت بهم النقمة» [@aghani-dk، ج13 ص18–19]. ويروي أيضًا أن مُزاحمًا مولى عمر بن عبد العزيز تمثّل به لما مرّا بقصر خرب من قصور آل جَفْنة [@aghani-dk، ج13 ص19]. ويذكر محققا «المفضليات» أن صاحب «وقعة صفين» يسمّي المتمثّل «حر بن قيس» [@mufaddaliyyat، ص217، الحاشية]."
syntax:
  - "«جَرَتِ الرِّيَاحُ»: فعل ماض، والتاء للتأنيث، وكُسرت لالتقاء الساكنين، و«الرياح» فاعل."
  - "«عَلَى مَكَانِ دِيَارِهِمْ»: جار ومجرور متعلق بجرت، و«مكان» مضاف، و«ديار» مضاف إليه، والهاء مضاف إليه."
  - "«فَكَأَنَّمَا»: الفاء عاطفة، و«كأنّ» حرف تشبيه كفّته «ما» عن العمل، فدخلت على الجملة الفعلية."
  - "«كَانُوا عَلَى مِيعَادِ»: «كان» فعل ماض ناقص، وواو الجماعة اسمها، و«على ميعاد» جار ومجرور متعلق بمحذوف خبرها."
morphology:
  - "«الرِّيَاح» جمع «رِيح»، وأصل الياء فيهما واو (من رَوَح)، قُلبت ياء لانكسار ما قبلها."
  - "«دِيَار» جمع «دار»، وأصلها «دِوَار»، قلبت الواو ياء لانكسار ما قبلها."
  - "«مِيعَاد» على «مِفْعَال» من «وَعَد»، أصله «مِوْعَاد»، قلبت الواو ياء لسكونها وانكسار ما قبلها."
rhetoric:
  thesis: "صورة الفناء الجماعي: ديار محاها الريح، وقوم ذهبوا معًا كأنهم على موعد."
  devices:
    - title: "التشبيه في «فَكَأَنَّمَا كَانُوا عَلَى مِيعَادِ»"
      text: "شبّه ذهابهم جميعًا في زمن متقارب بقوم تواعدوا على أمر فجاؤوه معًا. والشبه هنا لا يُرى بالعين، بل يُستخرج بالتأمل، فهو من القسم الثاني من قسمي التشبيه عند عبد القاهر الجُرْجانيّ: «أحدهما أن يكون من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل، والآخر أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]."
    - title: "الكناية في «جَرَتِ الرِّيَاحُ عَلَى مَكَانِ دِيَارِهِمْ»"
      text: "لم يقل: خربت ديارهم، بل قال: جرت الريح على مكانها، فجعل الريح التي تسفي التراب وتمحو الآثار دليلًا على أن الديار لم تعد إلا «مكانًا». وكلمة «مكان» نفسها تقول إن الديار ذهبت وبقي موضعها. وهذه قراءتنا."
  connection: "ثم يرجع إلى ما كانوا فيه قبل ذلك: «وَلَقَدْ غَنُوا فِيهَا بِأَنْعَمِ عِيشَةٍ»، فيقابل الخراب بالنعيم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة، موصولة بالياء"
  scansion: "جَرَتِرْرِيَا / حُعَلَى مَكَا / نِدِيَارِهِمْ = متَفاعلن / متَفاعلن / متَفاعلن — فَكَأَنْنَمَا / كَانُوعَلَى / مِيعَادِي = متَفاعلن / مُتْفاعلن / مُتْفاعلْ"
  note: "جاء الصدر على «متفاعلن» تامة في تفعيلاته الثلاث. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من العجز، والضرب المقطوع فصار «مُتْفاعلْ»: والقطع «بحذف آخر الوتد المجموع وإسكان ما قبله» [@atiq، ص60]."
variants:
  - reading: "جَرَتِ الرِّيَاحُ عَلَى مَحَلِّ دِيَارِهِمْ"
    status: "رواية التِّبْرِيزِيّ وأبي الفَرَج وابن قُتَيْبة"
    note: "[@tabrizi-ikhtiyarat، ج2 ص970] [@aghani-dk، ج13 ص17] [@ibn-qutayba، ج1 ص249]. ويذكر محقق شرح التِّبْرِيزِيّ أن المرزوقي يروي «على مقرّ ديارهم»، وأنه والاختيارين يرويان «فكأنهم كانوا» [@tabrizi-ikhtiyarat، ج2 ص970، الحاشية]."
