explained: false
first: "فَلَقَدْ أَرُوحُ عَلَى التِّجَارِ مُرَجَّلًا"
second: "مَذِلًا بِمَالِي لَيِّنًا أَجْيَادِي"
vocabulary:
  - term: "التِّجَارِ"
    text: "يقول محققا «المفضليات»: «بكسر التاء وتخفيف الجيم: جمع تاجر» [@mufaddaliyyat، ص218، الحاشية]."
  - term: "مُرَجَّلًا"
    text: "يقول محققا «المفضليات»: «أي مرجل الشعر» [@mufaddaliyyat، ص218، الحاشية]."
  - term: "مَذِلًا بِمَالِي"
    text: "يقول محققا «المفضليات»: «أي يقلق بماله حتى ينفقه» [@mufaddaliyyat، ص218، الحاشية]."
  - term: "لَيِّنًا أَجْيَادِي"
    text: "يقول محققا «المفضليات»: «لين الجيد كناية عن الشباب» [@mufaddaliyyat، ص218، الحاشية]."
