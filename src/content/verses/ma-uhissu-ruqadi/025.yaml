first: "وَالبِيضُ تَمْشِي كَالبُدُورِ وَكَالدُّمَى"
second: "وَنَوَاعِمٌ يَمْشِينَ بِالأَرْفَادِ"
vocabulary:
  - term: "وَكَالدُّمَى"
    text: "يقول محققا «المفضليات»: «جمع دمية، وهي الصورة المنقشة من الرخام» [@mufaddaliyyat، ص218، الحاشية]."
  - term: "بِالأَرْفَادِ"
    text: "يقول محققا «المفضليات»: «جمع رفد، بفتح الراء وكسرها، وهو القدح الضخم» [@mufaddaliyyat، ص218، الحاشية]."
