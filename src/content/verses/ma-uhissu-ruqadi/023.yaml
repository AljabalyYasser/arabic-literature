explained: false
first: "مِنْ خَمْرِ ذِي نَطَفٍ أَغَنَّ مُنَطَّقٍ"
second: "وَافَى بِهَا لِدَرَاهِمِ الأَسْجَادِ"
vocabulary:
  - term: "ذِي نَطَفٍ"
    text: "يقول محققا «المفضليات»: «النطف: جمع نطفة، بفتحتين فيهما، وهي القرط» [@mufaddaliyyat، ص218، الحاشية]."
  - term: "أَغَنَّ"
    text: "يقول محققا «المفضليات»: «الذي يخرج صوته من خياشيمه» [@mufaddaliyyat، ص218، الحاشية]."
  - term: "مُنَطَّقٍ"
    text: "يقول محققا «المفضليات»: «غلام عليه نطاق» [@mufaddaliyyat، ص218، الحاشية]."
  - term: "لِدَرَاهِمِ الأَسْجَادِ"
    text: "يقول محققا «المفضليات»: «قال الأصمعي: «دراهم الإسجاد: دراهم الأكاسرة، كانت عليها صور يكفرون لها ويسجدون»» [@mufaddaliyyat، ص218، الحاشية]."
