explained: false
first: "وَمِنَ الحَوَادِثِ لَا أَبَا لَكِ أَنَّنِي"
second: "ضُرِبَتْ عَلَيَّ الأَرْضُ بِالأَسْدَادِ"
vocabulary:
  - term: "بِالأَسْدَادِ"
    text: "يقول محققا «المفضليات»: «جمع سد، بضم السين وفتحها، وهو الحاجز بين الشيئين» [@mufaddaliyyat، ص216، الحاشية]."
  - term: "ضُرِبَتْ عَلَيَّ الأَرْضُ بِالأَسْدَادِ"
    text: "يقول محققا «المفضليات»: «يريد أنه سدت عليه الأرض للضعف والكبر، ولأنه كان أعشى ثم عمي» [@mufaddaliyyat، ص216، الحاشية]."
  - term: "لَا أَبَا لَكِ"
    text: "كلمة تقولها العرب في الخطاب ولا تريد بها حقيقتها، والخطاب لامرأة."
