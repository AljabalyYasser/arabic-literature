first: "مَاذَا أُؤَمِّلُ بَعْدَ آلِ مُحَرِّقٍ"
second: "تَرَكُوا مَنَازِلَهُمْ وَبَعْدَ إِيَادِ"
meaning: "أيّ شيء أرجو من الدنيا بعد أن ذهب آل محرِّق، ملوك الحِيرة، وأخلَوا منازلهم، وبعد أن ذهبت إياد؟ يقول التِّبْرِيزِيّ: «كأنه قال: أي شيء أؤمّل بعد ملوك الأرض، آل عمرو بن هند، وبعد آل إياد»، ويقول: «والمعنى: إذا باد هؤلاء فأنا في أثرهم، لا محالة» [@tabrizi-ikhtiyarat، ج2 ص968–969]. فالسؤال ليس سؤالًا، بل يأس: إذا لم يبق الملوك والأمم القوية، فكيف يبقى هو؟"
vocabulary:
  - term: "آلِ مُحَرِّقٍ"
    text: "يقول محققا «المفضليات»: «محرق: لقب لقب به بعض ملوك العرب» [@mufaddaliyyat، ص217، الحاشية]. ويقول محقق «الأغاني»: «آل محرق هنا: هم ملوك الحيرة من لخم» [@aghani-dk، ج13 ص16، الحاشية]. ويذكر محقق شرح التِّبْرِيزِيّ أن ابن الأَنْبارِيّ ينقل عن ابن حبيب أن «محرّق» هنا ابن الحارث الغسّاني [@tabrizi-ikhtiyarat، ج2 ص968، الحاشية]."
  - term: "تَرَكُوا مَنَازِلَهُمْ"
    text: "يقول التِّبْرِيزِيّ: «أخلَوا مصانعهم وممالكهم» [@tabrizi-ikhtiyarat، ج2 ص969]."
  - term: "إِيَادِ"
    text: "قبيلة من نزار. يقول محقق «الأغاني» إنها خرجت إلى العراق، «وكان لهم مع الأكاسرة أيام مشهودة إلى أن أغار عليهم سابور ذو الأكتاف من ملوك الأكاسرة فأبادهم وأفناهم» [@aghani-dk، ج13 ص16، الحاشية]."
context: "أول مقطع الملوك الذائبين (8–18). كان قد قال إن سبيله «سبيل ذي الأعواد»، أي الموت (5)، فجاء بالشاهد عليه: ملوك الحِيرة وإياد ذهبوا، فمن هو بعدهم؟ وهذا البيت مما يرويه ابن قُتَيْبة من القصيدة بقوله «وفيها يقول» [@ibn-qutayba، ج1 ص248]، ومما كان يتمثّل به الرجل الدارميّ عند القاضي سوّار بن عبد الله، فلما سأله القاضي عن قائله لم يعرفه، فقال القاضي: «رجلٌ من قومك له هذه النباهة وقد قال مثل هذه الحكمة لا ترويها ولا تعرفه!» وتوقف في قبول شهادته [@aghani-dk، ج13 ص16–17]."
syntax:
  - "يذكر التِّبْرِيزِيّ في «ماذا» وجهين: «ماذا» انتصب على أنه مفعول مقدّم، «هذا إذا جعلت «ماذا» بمنزلة اسم واحد. ولك أن تجعل «ما» مبتدأ و«ذا» خبره، كأنه قال: ما الذي أؤمّله» [@tabrizi-ikhtiyarat، ج2 ص968–969]. وعلى الوجه الثاني تكون «ذا» اسمًا موصولًا، وجملة «أؤمّل» صلته، والعائد محذوف."
  - "«بَعْدَ آلِ مُحَرِّقٍ»: ظرف زمان متعلق بأؤمّل، مضاف، و«آلِ» مضاف إليه، و«مُحَرِّقٍ» مضاف إليه ثانٍ."
  - "«تَرَكُوا مَنَازِلَهُمْ»: فعل ماض وفاعله واو الجماعة، و«منازلهم» مفعول به. والجملة في محل نصب حال من «آل محرّق»."
  - "«وَبَعْدَ إِيَادِ»: معطوف على «بعد آل محرّق». و«إياد» مجرور بالإضافة، صُرف على أنه اسم حيّ، وأُطلقت كسرته ياءً في القافية."
morphology:
  - "«أُؤَمِّلُ» مضارع «أَمَّلَ» على «فَعَّلَ»، من الأمل، والتضعيف للتكثير: أرجو وأطيل الرجاء."
  - "«مُحَرِّق» اسم فاعل من «حَرَّقَ» على «فَعَّلَ»، صار لقبًا."
  - "«مَنَازِل» جمع «مَنْزِل» على «مَفَاعِل»، وهي صيغة منتهى الجموع."
rhetoric:
  thesis: "سؤال يائس يستدل بفناء الملوك على فناء الشاعر."
  devices:
    - title: "الاستفهام في «مَاذَا أُؤَمِّلُ»"
      text: "استفهام لا يطلب جوابًا، بل ينفي: لا شيء أؤمّله. وعلى هذا يحمله التِّبْرِيزِيّ حين يقول: «إذا باد هؤلاء فأنا في أثرهم، لا محالة» [@tabrizi-ikhtiyarat، ج2 ص969]."
    - title: "الكناية في «تَرَكُوا مَنَازِلَهُمْ»"
      text: "لم يقل: هلكوا، بل قال: تركوا منازلهم، أي أخلَوها، فدلّ بخلوّ المنازل على موتهم. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "التكرار في «بَعْدَ ... وَبَعْدَ»"
      text: "كرّر الظرف فجعل كل أمة على حدة، فلا يُذكر الملوك وإياد ذكرًا واحدًا، بل خسارة بعد خسارة. وهذه قراءتنا."
  connection: "ثم يفصّل من هم آل محرّق: «أَهْلِ الخَوَرْنَقِ وَالسَّدِيرِ وَبَارِقٍ»، فالبيت التالي بدل من «آل محرّق»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة، موصولة بالياء"
  scansion: "مَاذَا أُؤَمْ / مِلُ بَعْدَ آ / لِمُحَرْرِقِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — تَرَكُوا مَنَا / زِلَهُمْ وَبَعْ / دَإِيَادِي = متَفاعلن / متَفاعلن / متَفاعلْ"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر. والعروض صحيحة «متفاعلن»، والضرب مقطوع: «بحذف آخر الوتد المجموع وإسكان ما قبله» [@atiq، ص60]."
