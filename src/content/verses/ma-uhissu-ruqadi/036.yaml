explained: false
first: "فَإِذَا وَذَلِكَ لَا مَهَاهَ لِذِكْرِهِ"
second: "وَالدَّهْرُ يُعْقِبُ صَالِحًا بِفَسَادِ"
vocabulary:
  - term: "لَا مَهَاهَ"
    text: "يقول محققا «المفضليات»: «لا بقاء» [@mufaddaliyyat، ص220، الحاشية]."
  - term: "فَإِذَا وَذَلِكَ"
    text: "يقول محققا «المفضليات»: «أي ذلك، إشارة إلى ما اقتصه من قبل، والواو زائدة»، وإن البيت «زيادة من منتهى الطلب والمرزوقي» [@mufaddaliyyat، ص220، الحاشية]."
