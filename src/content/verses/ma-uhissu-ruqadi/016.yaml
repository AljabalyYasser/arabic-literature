first: "فِي آلِ غَرْفٍ لَوْ بَغَيْتِ لِيَ الأُسَى"
second: "لَوَجَدْتِ فِيهِمْ إِسْوَةَ العُدَّادِ"
vocabulary:
  - term: "غَرْفٍ"
    text: "يقول محققا «المفضليات»: «لقب مالك الأصغر بن حنظلة بن مالك الأكبر بن زيد مناة بن تميم» [@mufaddaliyyat، ص217، الحاشية]."
  - term: "الأُسَى"
    text: "يقول محققا «المفضليات»: «الأمثال، واحدها إسوة، والهمزة تضم وتكسر فيهما» [@mufaddaliyyat، ص217، الحاشية]."
