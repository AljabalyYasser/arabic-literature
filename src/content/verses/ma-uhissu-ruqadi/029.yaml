explained: false
first: "وَلَقَدْ غَدَوْتُ لِعَازِبٍ مُتَنَاذَرٍ"
second: "أَحْوَى المَذَانِبِ مُؤْنِقِ الرُّوَّادِ"
vocabulary:
  - term: "لِعَازِبٍ"
    text: "يقول محققا «المفضليات»: «البعيد، أراد مكانا» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "مُتَنَاذَرٍ"
    text: "يقول محققا «المفضليات»: «الذي يتناذره الناس لخوفه» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "المَذَانِبِ"
    text: "يقول محققا «المفضليات»: «جمع مذنب، بكسر الميم وفتح النون، وهو المسيل الصغير من الحرة إلى الوادي» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "أَحْوَى"
    text: "يقول محققا «المفضليات»: «الذي اشتدت خضرته حتى ضرب إلى السواد» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "مُؤْنِقِ"
    text: "يقول محققا «المفضليات»: «المعجب» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "الرُّوَّادِ"
    text: "يقول محققا «المفضليات»: «جمع رائد، وهو الذي يدور في البلاد يطلب المرعى» [@mufaddaliyyat، ص219، الحاشية]."
