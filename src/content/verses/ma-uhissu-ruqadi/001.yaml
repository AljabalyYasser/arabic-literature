first: "نَامَ الخَلِيُّ وَمَا أُحِسُّ رُقَادِي"
second: "وَالهَمُّ مُحْتَضِرٌ لَدَيَّ وِسَادِي"
meaning: "نام الخالي من الهموم، وأنا لا أجد للنوم أثرًا، والهمّ حاضر عندي، عند وسادتي. يفسّر التِّبْرِيزِيّ «الخليّ» بأنه «الخالي من الهموم»، و«أحسّ» بقوله: «أي: لا أجد منه أثرا» [@tabrizi-ikhtiyarat، ج2 ص965]. فالشاعر يرى الناس نيامًا وهو ساهر، والهمّ لا يفارق فراشه، كأنه زائر جلس عند رأسه. ثم يقول في البيت التالي إن سهره «من غير ما سقم»، أي ليس مرضًا في الجسد."
vocabulary:
  - term: "الخَلِيُّ"
    text: "«الخالي من الهموم» [@tabrizi-ikhtiyarat، ج2 ص965]."
  - term: "وَمَا أُحِسُّ رُقَادِي"
    text: "يقول التِّبْرِيزِيّ: «أي: لا أجد منه أثرا» [@tabrizi-ikhtiyarat، ج2 ص965]. والرُّقاد: النوم."
  - term: "مُحْتَضِرٌ"
    text: "يقول محققا «المفضليات»: «حاضر» [@mufaddaliyyat، ص216، الحاشية]."
  - term: "وِسَادِي"
    text: "يقول محققا «المفضليات»: «الوساد: الوسادة، أي المخدة» [@mufaddaliyyat، ص216، الحاشية]."
context: "مطلع القصيدة، وبه عرفها القدماء: يذكرها ابن سَلّام بهذا المطلع حين يقول في الأسود: «وَله وَاحِدَة رائعة طَوِيلَة لاحقة بأجود الشّعْر» [@ibn-sallam، ج1 ص147]، وبه نادى رسول الرشيد في الناس: «مَن كان منكم يروى قصيدة الأسود بن يعفر»، ثم أنشد هذا البيت، ووعد من ينشدها عشرة آلاف درهم [@aghani-dk، ج13 ص18]. ويقول محققا «المفضليات» إنه «أجرى في أول قوله حديث الأرق لما يعتلج في صدره من الهموم»، ثم تحدث عن الموت [@mufaddaliyyat، ص215، الحاشية]. فالسهر هنا باب القصيدة كلها: الهمّ الذي لا يُسمّى في المطلع هو الموت الذي يراه قريبًا (5–7)، وزوال الملوك والأمم (8–18)."
syntax:
  - "«نَامَ الخَلِيُّ»: فعل ماض وفاعله مرفوع."
  - "«وَمَا أُحِسُّ رُقَادِي»: الواو حالية، و«ما» نافية، و«أُحِسُّ» فعل مضارع فاعله ضمير المتكلم، و«رقادي» مفعول به منصوب بفتحة مقدّرة منع من ظهورها اشتغال المحل بالكسرة المناسبة لياء المتكلم. والجملة في محل نصب حال."
  - "«وَالهَمُّ مُحْتَضِرٌ لَدَيَّ»: الواو حالية، و«الهمّ» مبتدأ، و«محتضر» خبره، و«لديّ» ظرف مكان متعلق بمحتضر، مضاف إلى ياء المتكلم. والجملة حال ثانية."
  - "«وِسَادِي»: الأقرب في قراءتنا أنه بدل من الظرف «لديّ» يبيّن موضع الحضور، أي: حاضر عند وسادي. ولم يُعرب الشرّاح هذه الكلمة."
morphology:
  - "«الخَلِيّ» صفة مشبهة على «فَعِيل» من «خلا يخلو»، أصلها «خَلِيو»، اجتمعت الواو والياء وسبقت إحداهما بالسكون، فقلبت الواو ياء وأدغمت في الياء."
  - "«أُحِسُّ» مضارع «أَحَسَّ» على «أَفْعَلَ»، من الحِسّ، وأصله «أُحْسِسُ»، أُدغم المثلان بعد نقل حركة الأول إلى الساكن قبله."
  - "«مُحْتَضِر» اسم فاعل من «احْتَضَرَ» على «افْتَعَلَ» من «حَضَر»."
  - "«رُقَاد» مصدر «رَقَد» على «فُعَال»، و«وِسَاد» اسم على «فِعَال»."
rhetoric:
  thesis: "مطلع يقابل بين حالين: نوم غيره وسهره هو، ويجعل الهمّ شخصًا حاضرًا عند فراشه."
  devices:
    - title: "المقابلة في «نَامَ الخَلِيُّ ... وَمَا أُحِسُّ رُقَادِي»"
      text: "بدأ بالنوم في أول البيت، وختم الشطر بنفي النوم عن نفسه، فوضع حال الخليّ في مقابل حاله. والخليّ ليس رجلًا بعينه، بل كل من لا همّ له. وهذه قراءتنا."
    - title: "الاستعارة في «وَالهَمُّ مُحْتَضِرٌ لَدَيَّ وِسَادِي»"
      text: "جعل للهمّ حضورًا عند الوسادة كما يحضر الزائر أو العائد عند رأس المريض، فأعطى المعنى صفة الشخص. وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "التصريع في «رُقَادِي ... وِسَادِي»"
      text: "جعل آخر الصدر على قافية آخر البيت، كما يُصنع في المطالع. والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]."
  connection: "ثم ينفي أن يكون السهر مرضًا: «مِنْ غَيْرِ مَا سَقَمٍ وَلَكِنْ شَفَّنِي / هَمٌّ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة، موصولة بالياء، والبيت مصرّع"
  scansion: "نَامَلْخَلِي / يُوَمَا أُحِسْ / سُرُقَادِي = مُتْفاعلن / متَفاعلن / متَفاعلْ — وَلْهَمْمُ مُحْ / تَضِرُنْ لَدَيْ / يَ وِسَادِي = مُتْفاعلن / متَفاعلن / متَفاعلْ"
  note: "وزن الكامل «متفاعلن» ست مرات. ودخل التفعيلة الأولى من الشطرين الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، فصارت «مُتْفاعلن». وضرب القصيدة كلها مقطوع «متفاعل»، والقطع «بحذف آخر الوتد المجموع وإسكان ما قبله» [@atiq، ص60]، وتبعته العروض هنا لأن البيت مصرّع."
