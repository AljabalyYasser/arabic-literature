first: "وَلَقَدْ عَلِمْتُ سِوَى الَّذِي نَبَّأْتِنِي"
second: "أَنَّ السَّبِيلَ سَبِيلُ ذِي الأَعْوَادِ"
vocabulary:
  - term: "ذِي الأَعْوَادِ"
    text: "يقول محققا «المفضليات»: «يريد الموت، وعنى بالأعواد ما يحمل عليه الميت. وذلك أن البوادي لا جنائز لهم، فهم يضمون عودا إلى عود ويحملون الميت عليها» [@mufaddaliyyat، ص216، الحاشية]."
