explained: false
first: "أَهْلِ الخَوَرْنَقِ وَالسَّدِيرِ وَبَارِقٍ"
second: "وَالقَصْرِ ذِي الشُّرُفَاتِ مِنْ سِنْدَادِ"
vocabulary:
  - term: "الخَوَرْنَقِ"
    text: "يقول محققا «المفضليات»: «قصر بالحيرة» [@mufaddaliyyat، ص217، الحاشية]."
  - term: "وَالسَّدِيرِ"
    text: "يقول محققا «المفضليات»: «قصر أو نهر بالحيرة» [@mufaddaliyyat، ص217، الحاشية]."
  - term: "وَبَارِقٍ"
    text: "يقول محققا «المفضليات»: «ماء بالعراق» [@mufaddaliyyat، ص217، الحاشية]."
  - term: "سِنْدَادِ"
    text: "يقول محققا «المفضليات»: «نهر أسفل من الحيرة بينها وبين البصرة» [@mufaddaliyyat، ص217، الحاشية]."
