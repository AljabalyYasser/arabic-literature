first: "فَإِذَا النَّعِيمُ وَكُلُّ مَا يُلْهَى بِهِ"
second: "يَوْمًا يَصِيرُ إِلَى بِلًى وَنَفَادِ"
meaning: "كانوا في نعيم ولهو، فإذا كل ذلك يصير يومًا إلى البِلى والفناء. يقول التِّبْرِيزِيّ: «والمعنى: كانوا كذلك، ففاجأهم ما حوّلهم، وشغلهم عن ملاهيهم، وانتهى جميعه إلى البلى والزوال» [@tabrizi-ikhtiyarat، ج2 ص971]. فالبيت حكمة عامة يخرج بها الشاعر من خبر الملوك إلى قاعدة: كل نعيم يفنى."
vocabulary:
  - term: "يُلْهَى بِهِ"
    text: "يُتلهّى به ويُشتغل، من اللهو."
  - term: "بِلًى وَنَفَادِ"
    text: "البِلى: القِدَم والتلف، والنَّفاد: الفناء والانقطاع."
context: "ختام صورة الملوك (8–15): بعد الديار التي جرت عليها الرياح (11)، والنعيم الذي كانوا فيه (12–13)، يأتي الحكم الجامع. ويروي ابن قُتَيْبة أن علي بن أبي طالب سمع رجلًا يتمثّل بهذا البيت، فقال: «كَمْ تَرَكُوا مِنْ جَنَّاتٍ وَعُيُونٍ» [@ibn-qutayba، ج1 ص249]. وفي «الأغاني» أن البيت الذي تمثّل به الرجل أمام علي هو «جرت الرياح» (11) [@aghani-dk، ج13 ص18–19]. فالخبر واحد، والبيت مختلف بين الروايتين."
syntax:
  - "«فَإِذَا»: الفاء عاطفة، و«إذا» فجائية. ويقول التِّبْرِيزِيّ: «يريد بـ«إذا» المكاني لا الزماني» [@tabrizi-ikhtiyarat، ج2 ص971]، أي هي إذا المفاجأة لا إذا الشرطية."
  - "«النَّعِيمُ وَكُلُّ مَا يُلْهَى بِهِ»: «النعيم» مبتدأ، و«كلّ» معطوف عليه، و«ما» اسم موصول مضاف إليه، وجملة «يُلهى به» صلته، و«به» نائب فاعل."
  - "«يَوْمًا يَصِيرُ إِلَى بِلًى وَنَفَادِ»: «يومًا» ظرف زمان متعلق بيصير، وجملة «يصير» في محل رفع خبر المبتدأ، و«إلى بلًى» متعلق بيصير، و«نفاد» معطوف."
morphology:
  - "«النَّعِيم» اسم على «فَعِيل» من «نَعِم»."
  - "«يُلْهَى» مضارع مبني للمجهول من «أَلْهَى» على «أَفْعَلَ»، أصل لامه واو (لها يلهو)، قلبت ألفًا."
  - "«بِلًى» مصدر «بَلِيَ» على «فِعَل»، مقصور، و«نَفَاد» مصدر «نَفِدَ» على «فَعَال»."
rhetoric:
  thesis: "حكمة جامعة تنقل الكلام من ملوك بأعيانهم إلى كل نعيم."
  devices:
    - title: "المفاجأة في «فَإِذَا النَّعِيمُ»"
      text: "بإذا الفجائية جعل الانتقال من النعيم إلى الفناء انتقالًا مفاجئًا، وعلى ذلك يشرحه التِّبْرِيزِيّ: «ففاجأهم ما حوّلهم» [@tabrizi-ikhtiyarat، ج2 ص971]."
    - title: "التعميم في «وَكُلُّ مَا يُلْهَى بِهِ»"
      text: "لم يقف عند النعيم، بل أضاف إليه «كل ما يُلهى به»، فشمل الشراب والغناء والصيد وكل ما سيذكره هو نفسه بعد ذلك من لهو شبابه (21–35). وهذه قراءتنا."
    - title: "الطباق بين «النَّعِيمُ» و«بِلًى وَنَفَادِ»"
      text: "وضع النعيم في أول الصدر وفناءه في آخر العجز، فبين البداية والنهاية مسافة البيت كله، وهي مسافة العمر."
  connection: "ثم يأتي بشاهد قريب من قومه: «فِي آلِ غَرْفٍ لَوْ بَغَيْتِ لِيَ الأُسَى»، فبعد الملوك البعيدين يذكر أهله من تميم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة، موصولة بالياء"
  scansion: "فَإِذَنْنَعِي / مُوَكُلْلُمَا / يُلْهَى بِهِي = متَفاعلن / متَفاعلن / مُتْفاعلن — يَوْمَنْ يَصِي / رُإِلَى بِلَنْ / وَنَفَادِي = مُتْفاعلن / متَفاعلن / متَفاعلْ"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، عروض البيت وأول عجزه. وأُشبعت كسرة الهاء في «بِهِ» فصارت «بِهِي». والضرب مقطوع [@atiq، ص60]."
