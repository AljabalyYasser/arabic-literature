explained: false
first: "جَادَتْ سَوَارِيهِ وَآزَرَ نَبْتَهُ"
second: "نُفَأٌ مِنَ الصَّفْرَاءِ وَالزُّبَّادِ"
vocabulary:
  - term: "سَوَارِيهِ"
    text: "يقول محققا «المفضليات»: «جمع سارية، وهي السحابة تمطر ليلا» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "وَآزَرَ"
    text: "يقول محققا «المفضليات»: «عاون أو ساوى ولحق به» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "نُفَأٌ"
    text: "يقول محققا «المفضليات»: «القطع من النبات المتفرقة ههنا وههنا» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "الصَّفْرَاءِ وَالزُّبَّادِ"
    text: "يقول محققا «المفضليات»: «ضربان من العشب» [@mufaddaliyyat، ص219، الحاشية]."
