first: "بِمُشَمِّرٍ عَتِدٍ جَهِيزٍ شَدُّهُ"
second: "قَيْدِ الأَوَابِدِ وَالرِّهَانِ جَوَادِ"
vocabulary:
  - term: "بِمُشَمِّرٍ"
    text: "يقول محققا «المفضليات»: «الفرس الطويل القوائم» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "عَتِدٍ"
    text: "يقول محققا «المفضليات»: «الذي عنده عدة للجري» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "جَهِيزٍ شَدُّهُ"
    text: "يقول محققا «المفضليات»: «سريع عدوه» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "قَيْدِ الأَوَابِدِ"
    text: "يقول محققا «المفضليات»: «الأوابد: الوحش، وقيد الأوابد: كأن الأوابد إذا طلبها في قيده، لاقتداره عليها» [@mufaddaliyyat، ص219، الحاشية]."
  - term: "جَوَادِ"
    text: "يقول محققا «المفضليات»: «الكثير العدو» [@mufaddaliyyat، ص219، الحاشية]."
