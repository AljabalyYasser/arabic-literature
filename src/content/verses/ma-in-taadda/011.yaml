explained: false
first: "فَأَصْبَحَتْ لَاقِحًا مُصَرَّمَةً"
second: "حِينَ تَقَضَّتْ غَوَابِرُ الْمُدَدِ"
vocabulary:
  - term: "فَأَصْبَحَتْ لَاقِحًا"
    text: "يعني الحرب، شبهها بالناقة اللاقح، وفي شرح الطوسي: «هذه الحرب — يقول — قد هاجت فشالوا فيها بالرماح والسيوف كما تشول اللواقح بذنبها» [@diwan-labid، ص161]."
  - term: "مُصَرَّمَةً"
    text: "«لا لبن فيها» [@diwan-labid، ص161]، «يعنى الحرب التى ليست لها درة، إنما درتها الدم» [@diwan-labid، ص161]."
  - term: "غَوَابِرُ الْمُدَدِ"
    text: "«الغوابر: الباقية، والمدد: الغايات واحدتها مدة» [@diwan-labid، ص161]."
sources:
  - source: "diwan-labid"
    loc: "ص161"
