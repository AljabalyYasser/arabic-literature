explained: false
first: "لَمْ يُبْلِغِ الْعَيْنَ كُلَّ نَهْمَتِهَا"
second: "لَيْلَةَ تُمْسِي الْجِيَادُ كَالْقِدَدِ"
vocabulary:
  - term: "نَهْمَتِهَا"
    text: "حاجتها؛ «والنَّهْمَة: الْحَاجَةُ، وَقِيلَ: بلوغُ الهِمَّةِ والشهوةِ فِي الشَّيْءِ» [@lisan، ج12 ص593]. وفي شرح الطوسي: «يقول: لم يبلغ عيني منه كل ما تريد أن تنظر إليه من سرور» [@diwan-labid، ص159]."
  - term: "الْقِدَدِ"
    text: "«السيور ... وإنما يريد أنها ضامرة» [@diwan-labid، ص159]، أي الخيل نحيلة من شدة السير."
