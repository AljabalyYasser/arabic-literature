explained: false
first: "أَخْشَى عَلَى أَرْبَدَ الْحُتُوفَ وَلَا"
second: "أَرْهَبُ نَوْءَ السِّمَاكِ وَالْأَسَدِ"
vocabulary:
  - term: "الْحُتُوفَ"
    text: "«الآجال» [@diwan-labid، ص158]."
  - term: "نَوْءَ السِّمَاكِ وَالْأَسَدِ"
    text: "المطر والعواصف التي تُنسب إلى هذين النجمين؛ قال صاحب اللسان: «وَكَانَتِ الْعَرَبُ تُضِيفُ الأَمْطار والرِّياح والحرَّ وَالْبَرْدَ إِلَى السَّاقِطِ مِنْهَا» [@lisan، ج1 ص175]. وفي شرح الطوسي: «ولم أكن أفرق عليه صاعقة» [@diwan-labid، ص158]."
