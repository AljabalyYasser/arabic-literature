first: "إِنْ يُغْبَطُوا يُهْبَطُوا وَإِنْ أَمِرُوا"
second: "يَوْمًا يَصِيرُوا لِلْهُلْكِ وَالنَّكَدِ"
vocabulary:
  - term: "يُغْبَطُوا يُهْبَطُوا"
    text: "في شرح الطوسي: «يقول: إن غبطوا يوماً فإنهم يموتون. ويهبطوا ها هنا: يموتون» [@diwan-labid، ص160]."
  - term: "أَمِرُوا"
    text: "كثروا؛ «وَالْعَرَبُ تَقُولُ: أَمِرَ بَنُو فُلَانٍ أَي كَثُرُوا» [@lisan، ج4 ص28]."
