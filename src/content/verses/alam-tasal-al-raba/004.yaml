first: "دِيَارٌ لِشَعْثَاءِ الْفُؤَادِ وَتِرْبِهَا"
second: "لَيَالِيَ تَحْتَلُّ الْمَرَاضَ فَتَغْلَمَا"
vocabulary:
  - term: "تِرْبِهَا"
    text: "التي وُلدت معها: «والتِّرْبُ: اللِّدةُ والسِّنُّ» [@lisan، ج1 ص231]."
  - term: "تَغْلَمَا"
    text: "«تَغْلَمُ مَوْضِعٌ»، ويستشهد ابن منظور بالبيت [@lisan، ج12 ص66]."
