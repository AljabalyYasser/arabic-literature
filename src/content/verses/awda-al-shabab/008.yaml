explained: false
first: "تُجْرِي السِّوَاكَ عَلَى غُرٍّ مُفَلَّجَةٍ"
second: "لَمْ يَغْرُهَا دَنَسٌ تَحْتَ الْجَلَابِيبِ"
vocabulary:
  - term: "غُرٍّ مُفَلَّجَةٍ"
    text: "ثنايا بيض متباعدة ما بينها، والفَلَج تباعد ما بين الأسنان [@mufaddaliyyat، ص120، الحاشية]."
  - term: "لَمْ يَغْرُهَا دَنَسٌ"
    text: "لم يلصق بها، وأراد أنها عفيفة [@mufaddaliyyat، ص120، الحاشية]."
  - term: "الْجَلَابِيبِ"
    text: "جمع جِلْباب، وهو الثوب الواسع تلبسه المرأة فوق ثيابها."
