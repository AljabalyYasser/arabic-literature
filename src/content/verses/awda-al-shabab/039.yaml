explained: false
first: "حَتَّى تُرِكْنَا وَمَا تُثْنَى ظَعَائِنُنَا"
second: "يَأْخُذْنَ بَيْنَ سَوَادِ الْخَطِّ فَاللُّوبِ"
vocabulary:
  - term: "تُثْنَى"
    text: "تُمنع وتُردّ عن وجهها [@mufaddaliyyat، ص124، الحاشية]."
  - term: "الْخَطِّ"
    text: "موضع بالبحرين على البحر [@mufaddaliyyat، ص124، الحاشية]."
  - term: "اللُّوبِ"
    text: "جمع لابة، وهي الحَرّة، الأرض ذات الحجارة السود. يريد أن المرعى اتسع لظعائنهم فلا يردّهن أحد عن مكان [@mufaddaliyyat، ص124، الحاشية]."
