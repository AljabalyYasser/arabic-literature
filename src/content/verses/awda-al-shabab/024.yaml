first: "بِالْمَشْرَفِيِّ وَمَصْقُولٍ أَسِنَّتُهَا"
second: "صُمِّ الْعَوَامِلِ صَدْقَاتِ الْأَنَابِيبِ"
vocabulary:
  - term: "بِالْمَشْرَفِيِّ"
    text: "السيف، منسوب إلى المشارف، قرى من أرض العرب."
  - term: "صُمِّ الْعَوَامِلِ"
    text: "العوامل أعالي الرماح، وصُمّ: غير مجوّفة [@mufaddaliyyat، ص122، الحاشية]."
  - term: "صَدْقَاتِ الْأَنَابِيبِ"
    text: "صلبة ما بين عُقَد الرمح [@mufaddaliyyat، ص122، الحاشية]."
