first: "دَعْ ذَا وَقُلْ لِبَنِي سَعْدٍ لِفَضْلِهِمُ"
second: "مَدْحًا يَسِيرُ بِهِ غَادِي الْأَرَاكِيبِ"
vocabulary:
  - term: "بَنِي سَعْدٍ"
    text: "قوم الشاعر، بنو سعد بن زيد مناة من تميم."
  - term: "غَادِي الْأَرَاكِيبِ"
    text: "الغادي الذاهب في الغداة، والأراكيب جمع أُرْكوب، وهو أكثر عددًا من الرَّكْب [@mufaddaliyyat، ص120، الحاشية]."
