explained: false
first: "وَكَرُّنَا خَيْلَنَا أَدْرَاجَهَا رُجُعًا"
second: "كُسَّ السَّنَابِكِ مِنْ بَدْءٍ وَتَعْقِيبِ"
vocabulary:
  - term: "أَدْرَاجَهَا رُجُعًا"
    text: "راجعة في طريقها الذي بدأت فيه، يقال: رجع أدراجه [@mufaddaliyyat، ص121، الحاشية]."
  - term: "كُسَّ السَّنَابِكِ"
    text: "السنابك مقاديم الحوافر، والكَسَس أصله تحاتّ الأسنان، فاستعاره للسنابك: تثلّمت من كثرة السير [@mufaddaliyyat، ص121، الحاشية]."
  - term: "مِنْ بَدْءٍ وَتَعْقِيبِ"
    text: "من غزو ابتدأناه، وغزو عقّبنا به [@mufaddaliyyat، ص121، الحاشية]."
