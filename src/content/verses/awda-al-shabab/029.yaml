first: "كِلَا الْفَرِيقَيْنِ أَعْلَاهُمْ وَأَسْفَلُهُمْ"
second: "يَشْقَى بِأَرْمَاحِنَا غَيْرَ التَّكَاذِيبِ"
vocabulary:
  - term: "كِلَا الْفَرِيقَيْنِ"
    text: "فريقا مَعَدّ: عُليا معدّ من كان منهم بنجد، وسُفلاها من نزل الأرض المنخفضة [@mufaddaliyyat، ص123، الحاشية]."
  - term: "غَيْرَ التَّكَاذِيبِ"
    text: "شقاءً صادقًا، لا كذب فيه."
