first: "كَأَنَّهُ يَرْفَئِيٌّ نَامَ عَنْ غَنَمٍ"
second: "مُسْتَنْفِرٌ فِي سَوَادِ اللَّيْلِ مَذْؤُوبُ"
vocabulary:
  - term: "يَرْفَئِيٌّ"
    text: "راعي الغنم [@mufaddaliyyat، ص121، الحاشية]."
  - term: "مَذْؤُوبُ"
    text: "جاءه الذئب. شبّه فرسه في حدّته وطموح بصره براعٍ نام عن غنمه حتى وقعت فيها الذئاب، فقام مذعورًا [@mufaddaliyyat، ص121، الحاشية]."
