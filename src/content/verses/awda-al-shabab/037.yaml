first: "وَشَدَّ كُورٍ عَلَى وَجْنَاءَ نَاجِيَةٍ"
second: "وَشَدَّ سَرْجٍ عَلَى جَرْدَاءَ سُرْحُوبِ"
vocabulary:
  - term: "كُورٍ"
    text: "رحل الناقة بأداته [@mufaddaliyyat، ص124، الحاشية]."
  - term: "وَجْنَاءَ نَاجِيَةٍ"
    text: "الوجناء الناقة الغليظة، والناجية السريعة [@mufaddaliyyat، ص124، الحاشية]."
  - term: "جَرْدَاءَ سُرْحُوبِ"
    text: "الجرداء الفرس القصيرة الشعر، والسرحوب الطويلة [@mufaddaliyyat، ص124، الحاشية]."
