first: "وَعِنْدَنَا قَيْنَةٌ بَيْضَاءُ نَاعِمَةٌ"
second: "مِثْلُ الْمَهَاةِ مِنَ الْحُورِ الْخَرَاعِيبِ"
vocabulary:
  - term: "قَيْنَةٌ"
    text: "الأمة المغنّية [@mufaddaliyyat، ص120، الحاشية]."
  - term: "الْمَهَاةِ"
    text: "البقرة الوحشية، تُشبَّه بها المرأة في سعة العين [@mufaddaliyyat، ص120، الحاشية]."
  - term: "الْخَرَاعِيبِ"
    text: "جمع خُرْعوب، وهي الشابة الحسنة القوام الرَّخْصة اللينة [@mufaddaliyyat، ص120، الحاشية]."
