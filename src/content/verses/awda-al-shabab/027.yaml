first: "زُرْقًا أَسِنَّتُهَا حُمْرًا مُثَقَّفَةً"
second: "أَطْرَافُهُنَّ مَقِيلٌ لِلْيَعَاسِيبِ"
vocabulary:
  - term: "زُرْقًا"
    text: "جعل أسنّتها زُرقًا لشدة صفائها، وحمرًا لأن الصفاء إذا اشتدّ خالطته حمرة [@mufaddaliyyat، ص123، الحاشية]."
  - term: "مَقِيلٌ لِلْيَعَاسِيبِ"
    text: "اليعاسيب هنا الرؤساء: يقتلونهم فيرفعون رؤوسهم على أسنّتها [@mufaddaliyyat، ص123، الحاشية]."
