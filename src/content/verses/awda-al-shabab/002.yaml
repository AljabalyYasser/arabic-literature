explained: false
first: "وَلَّى حَثِيثًا وَهَذَا الشَّيْبُ يَطْلُبُهُ"
second: "لَوْ كَانَ يُدْرِكُهُ رَكْضُ الْيَعَاقِيبِ"
vocabulary:
  - term: "حَثِيثًا"
    text: "سريعًا [@mufaddaliyyat، ص119، الحاشية]."
  - term: "الْيَعَاقِيبِ"
    text: "جمع يعقوب، و«اليَعْقُوبُ: الذَّكَرُ مِنَ الحَجَل والقَطَا» [@lisan، ج1 ص622]، وخصّه لسرعته. ويجيز ابن سِيدَهْ في اللسان أن يعني بها «جِيادَ الْخَيْلِ» [@lisan، ج7 ص159]."
  - term: "لَوْ كَانَ يُدْرِكُهُ"
    text: "لو كان ركض اليعاقيب يدرك الشباب لطلبه، ولكنه لا يُدرك [@mufaddaliyyat، ص119، الحاشية]."
