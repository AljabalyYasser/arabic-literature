explained: false
first: "كُنَّا نَحُلُّ إِذَا هَبَّتْ شَآمِيَةً"
second: "بِكُلِّ وَادٍ حَطِيبِ الْجَوْفِ مَجْدُوبِ"
vocabulary:
  - term: "شَآمِيَةً"
    text: "ريح الشمال، تهبّ من ناحية الشام [@mufaddaliyyat، ص124، الحاشية]."
  - term: "حَطِيبِ الْجَوْفِ مَجْدُوبِ"
    text: "وادٍ كثير الحطب، والمجدوب هنا المعيب المذموم: ننزل في الجدب بالأودية الكثيرة الحطب لنعقر ونطبخ، ولا نبالي أن يكون المنزل مذمومًا [@mufaddaliyyat، ص124، الحاشية]."
