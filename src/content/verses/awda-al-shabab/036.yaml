first: "كُنَّا إِذَا مَا أَتَانَا صَارِخٌ فَزِعٌ"
second: "كَانَ الصُّرَاخُ لَهُ قَرْعَ الظَّنَابِيبِ"
vocabulary:
  - term: "صَارِخٌ"
    text: "مستغيث، والصُّراخ هنا الإغاثة [@mufaddaliyyat، ص124، الحاشية]."
  - term: "قَرْعَ الظَّنَابِيبِ"
    text: "الظُّنبوب حرف عظم الساق، ويقال: قرع ظنبوبه لهذا الأمر، أي عزم عليه [@mufaddaliyyat، ص124، الحاشية]."
