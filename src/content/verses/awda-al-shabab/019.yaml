explained: false
first: "تَظَاهَرَ النِّيُّ فِيهِ فَهْوَ مُحْتَفِلٌ"
second: "يُعْطِي أَسَاهِيَّ مِنْ جَرْيٍ وَتَقْرِيبِ"
vocabulary:
  - term: "تَظَاهَرَ النِّيُّ"
    text: "النِّيّ الشحم، وتظاهره ركوب بعضه بعضًا [@mufaddaliyyat، ص122، الحاشية]."
  - term: "مُحْتَفِلٌ"
    text: "كثير مجتمع [@mufaddaliyyat، ص122، الحاشية]."
  - term: "أَسَاهِيَّ"
    text: "ضروب وفنون من العدو، لا واحد لها [@mufaddaliyyat، ص122، الحاشية]."
  - term: "تَقْرِيبِ"
    text: "ضرب من العدو دون الجري [@mufaddaliyyat، ص122، الحاشية]."
