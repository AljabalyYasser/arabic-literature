explained: false
first: "يَجْلُو أَسِنَّتَهَا فِتْيَانُ عَادِيَةٍ"
second: "لَا مُقْرِفِينَ وَلَا سُودٍ جَعَابِيبِ"
vocabulary:
  - term: "يَجْلُو أَسِنَّتَهَا"
    text: "يصلحونها ويتعاهدونها [@mufaddaliyyat، ص123، الحاشية]."
  - term: "عَادِيَةٍ"
    text: "الحرب [@mufaddaliyyat، ص123، الحاشية]."
  - term: "مُقْرِفِينَ"
    text: "المُقْرِف الذي داني الهُجنة، والهجين من ولدته أمة [@mufaddaliyyat، ص123، الحاشية]."
  - term: "جَعَابِيبِ"
    text: "القصار الضعاف، واحدهم جُعْبوب [@mufaddaliyyat، ص123، الحاشية]."
