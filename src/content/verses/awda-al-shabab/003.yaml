explained: false
first: "أَوْدَى الشَّبَابُ الَّذِي مَجْدٌ عَوَاقِبُهُ"
second: "فِيهِ نَلَذُّ وَلَا لَذَّاتِ لِلشِّيبِ"
vocabulary:
  - term: "مَجْدٌ عَوَاقِبُهُ"
    text: "إذا تعقّبت أمور الشباب وجدت في عواقبه العزّ وإدراك الثأر والرحلة في المكارم، وليس في الشيب إلا الهرم والعلل، كما في حاشية المحققين [@mufaddaliyyat، ص120، الحاشية]."
  - term: "وَلَا لَذَّاتِ"
    text: "يجوز في تائها الكسر والفتح، والبيت شاهد للنحاة على بناء جمع المؤنث السالم مع «لا» النافية للجنس [@mufaddaliyyat، ص120، الحاشية]."
