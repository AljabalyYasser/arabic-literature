explained: false
first: "لَيْسَ بِأَسْفَى وَلَا أَقْنَى وَلَا سَغِلٍ"
second: "يُعْطَى دَوَاءَ قَفِيِّ السَّكْنِ مَرْبُوبِ"
vocabulary:
  - term: "بِأَسْفَى"
    text: "الخفيف شعر الناصية [@mufaddaliyyat، ص121، الحاشية]."
  - term: "أَقْنَى"
    text: "الذي في أنفه احديداب، وينقل المحققان عن أبي عمرو أن القَنا محمود في الناس مذموم في الخيل [@mufaddaliyyat، ص121، الحاشية]."
  - term: "سَغِلٍ"
    text: "«والسَّغِلُ والوغِلُ: السَّيِءُ الغِذاء الْمُضْطَرِبُ الأَعضاء» [@lisan، ج11 ص337]."
  - term: "دَوَاءَ قَفِيِّ السَّكْنِ"
    text: "الدواء هنا اللبن تُغذّى به الخيل، والسَّكْن أهل الدار. و«القَفِيُّ: الضَّيْف المُكْرَم» [@lisan، ج15 ص197]: يُسقى اللبن كما يُكرم الضيف [@mufaddaliyyat، ص121، الحاشية]."
  - term: "مَرْبُوبِ"
    text: "يُربّى في البيوت ولا يُترك يرعى، لكرامته على أهله [@mufaddaliyyat، ص121، الحاشية]."
