first: "إِنِّي وَجَدْتُ بَنِي سَعْدٍ يُفَضِّلُهُمْ"
second: "كُلُّ شِهَابٍ عَلَى الْأَعْدَاءِ مَشْبُوبِ"
vocabulary:
  - term: "شِهَابٍ"
    text: "أصله الشعلة الساطعة من النار، وأراد الرجل الماضي في أمره [@mufaddaliyyat، ص123، الحاشية]."
  - term: "مَشْبُوبِ"
    text: "مُقوًّى، من قولهم: شببت النار إذا قوّيتها [@mufaddaliyyat، ص123، الحاشية]."
