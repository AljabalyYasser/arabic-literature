explained: false
first: "أَوْدَى الشَّبَابُ حَمِيدًا ذُو التَّعَاجِيبِ"
second: "أَوْدَى وَذَلِكَ شَأْوٌ غَيْرُ مَطْلُوبِ"
vocabulary:
  - term: "أَوْدَى"
    text: "هلك، وأراد: ذهب، وكرّرها تفجّعًا وتوكيدًا [@mufaddaliyyat، ص119، الحاشية]."
  - term: "ذُو التَّعَاجِيبِ"
    text: "كثير العجب، يعجب الناظرين ويروقهم، والتعاجيب جمع لا واحد له [@mufaddaliyyat، ص119، الحاشية]."
  - term: "شَأْوٌ غَيْرُ مَطْلُوبِ"
    text: "الشأو السَّبْق: ذهاب الشباب سبقٌ لا يُدرك ولا يُطلب [@mufaddaliyyat، ص119، الحاشية]."
