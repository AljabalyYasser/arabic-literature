explained: false
first: "مِنْ كُلِّ حَتٍّ إِذَا مَا ابْتَلَّ مُلْبَدُهُ"
second: "صَافِي الْأَدِيمِ أَسِيلِ الْخَدِّ يَعْبُوبِ"
vocabulary:
  - term: "حَتٍّ"
    text: "سريع [@mufaddaliyyat، ص121، الحاشية]."
  - term: "مُلْبَدُهُ"
    text: "موضع اللِّبد من ظهر الفرس، وابتلاله بالعرق [@mufaddaliyyat، ص121، الحاشية]."
  - term: "صَافِي الْأَدِيمِ"
    text: "صفا جلده لحسن القيام عليه وقصر شعره [@mufaddaliyyat، ص121، الحاشية]."
  - term: "يَعْبُوبِ"
    text: "كثير الجري، وهو في حاشية المحققين مشتق من عُباب البحر، وهو ارتفاع موجه [@mufaddaliyyat، ص121، الحاشية]."
