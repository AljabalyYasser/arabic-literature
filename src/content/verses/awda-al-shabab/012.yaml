explained: false
first: "وَالْعَادِيَاتُ أَسَابِيُّ الدِّمَاءِ بِهَا"
second: "كَأَنَّ أَعْنَاقَهَا أَنْصَابُ تَرْجِيبِ"
vocabulary:
  - term: "الْعَادِيَاتُ"
    text: "الخيل [@mufaddaliyyat، ص121، الحاشية]."
  - term: "أَسَابِيُّ الدِّمَاءِ"
    text: "طرائق الدم، واحدتها إسباءة [@mufaddaliyyat، ص121، الحاشية]."
  - term: "أَنْصَابُ تَرْجِيبِ"
    text: "قيل: شبّه أعناقها «بِالْحِجَارَةِ الَّتِي تُذْبَح عَلَيْهَا النَّسائِكُ»، وقال أبو عبيد إن في البيت تفسيرين: أن يكون «شبَّه انْتِصابَ أَعْناقِها بِجِدارِ تَرْجِيبِ النَّخْلِ»، أو أن يكون «أَراد الدِّماءَ الَّتِي تُراقُ فِي رَجَبٍ» [@lisan، ج1 ص413]."
