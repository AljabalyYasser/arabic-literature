first: "يَوْمَانِ يَوْمُ مُقَامَاتٍ وَأَنْدِيَةٍ"
second: "وَيَوْمُ سَيْرٍ إِلَى الْأَعْدَاءِ تَأْوِيبِ"
vocabulary:
