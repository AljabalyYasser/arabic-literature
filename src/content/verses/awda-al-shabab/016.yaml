first: "فِي كُلِّ قَائِمَةٍ مِنْهُ إِذَا انْدَفَعَتْ"
second: "مِنْهُ أَسَاوٍ كَفَرْغِ الدَّلْوِ أُثْعُوبِ"
vocabulary:
  - term: "أَسَاوٍ"
    text: "دفعات من الجري، ويقول المحققان إن هذا الحرف فات المعاجم [@mufaddaliyyat، ص121، الحاشية]."
  - term: "كَفَرْغِ الدَّلْوِ أُثْعُوبِ"
    text: "فرغ الدلو مخرج الماء منها، والأثعوب السائل المنثعب: شبّه دفعات جريه بانصباب الماء من الدلو في سهولته [@mufaddaliyyat، ص121، الحاشية]."
