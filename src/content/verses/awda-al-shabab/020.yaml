explained: false
first: "يُحَاضِرُ الْجُونَ مُخْضَرًّا جَحَافِلُهَا"
second: "وَيَسْبِقُ الْأَلْفَ عَفْوًا غَيْرَ مَضْرُوبِ"
vocabulary:
  - term: "يُحَاضِرُ الْجُونَ"
    text: "الجُون هنا حمر الوحش، ويحاضرها: يباريها في الحُضْر، وهو شدة الجري [@mufaddaliyyat، ص122، الحاشية]."
  - term: "مُخْضَرًّا جَحَافِلُهَا"
    text: "الجحافل للحمير كالشفاه للناس، واخضرارها من أكل الخضرة، وذلك أشدّ لها وأسرع [@mufaddaliyyat، ص122، الحاشية]."
  - term: "الْأَلْفَ عَفْوًا"
    text: "يسبق ألف فرس على هِينة، من غير أن يُضرب [@mufaddaliyyat، ص122، الحاشية]."
