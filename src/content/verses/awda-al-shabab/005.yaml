first: "إِنَّا إِذَا غَرَبَتْ شَمْسٌ أَوِ ارْتَفَعَتْ"
second: "وَفِي مَبَارِكِهَا بُزْلُ الْمَصَاعِيبِ"
vocabulary:
  - term: "بُزْلُ الْمَصَاعِيبِ"
    text: "البُزْل جمع بازل، وهو البعير في تاسع سنيه حين يطلع نابه. والمصاعيب جمع مُصْعَب، وهو الفحل من الإبل [@mufaddaliyyat، ص120، الحاشية]. يقول: في كل وقت، وإبلنا باركة عندنا، نَقري ونعطي، وتمام الكلام في البيت التالي."
