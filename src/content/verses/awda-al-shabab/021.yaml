first: "كَمْ مِنْ فَقِيرٍ بِإِذْنِ اللَّهِ قَدْ جَبَرَتْ"
second: "وَذِي غِنًى بَوَّأَتْهُ دَارَ مَحْرُوبِ"
vocabulary:
  - term: "جَبَرَتْ"
    text: "أغنت ولمّت شعثه، والضمير للخيل [@mufaddaliyyat، ص122، الحاشية]."
  - term: "بَوَّأَتْهُ دَارَ مَحْرُوبِ"
    text: "أنزلته دار من سُلب ماله، أي أفقرت الغنيّ بالغارة عليه [@mufaddaliyyat، ص122، الحاشية]."
