first: "قَدْ يَسْعَدُ الْجَارُ وَالضَّيْفُ الْغَرِيبُ بِنَا"
second: "وَالسَّائِلُونَ وَنُغْلِي مَيْسِرَ النِّيبِ"
vocabulary:
  - term: "مَيْسِرَ النِّيبِ"
    text: "الميسر اللعب بالقِداح، وأراد به الجَزور التي يُتقامر عليها. والنِّيب جمع ناب، وهي المسنّة من النوق، وإغلاؤها شراؤها بثمن غالٍ [@mufaddaliyyat، ص120، الحاشية]."
