first: "كَأَنَّهَا بِأَكُفِّ الْقَوْمِ إِذْ لَحِقُوا"
second: "مَوَاتِحُ الْبِئْرِ أَوْ أَشْطَانُ مَطْلُوبِ"
vocabulary:
  - term: "مَوَاتِحُ الْبِئْرِ"
    text: "حبال يُمتح بها الماء، أي يُنتزع [@mufaddaliyyat، ص123، الحاشية]."
  - term: "أَشْطَانُ مَطْلُوبِ"
    text: "الأشطان الحبال الطوال، واحدها شَطَن، ومطلوب بئر بعيدة القعر بين المدينة والشام [@mufaddaliyyat، ص123، الحاشية]."
