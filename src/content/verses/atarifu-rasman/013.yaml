first: "رِجَالٌ مَتَى يُدْعَوْا إِلَى الحَرْبِ يُرْقِلُوا"
second: "إِلَيْهَا كَإِرْقَالِ الجِمَالِ المَصَاعِبِ"
vocabulary:
  - term: "يُرْقِلُوا"
    text: "يسرعوا، والإرقال ضرب من السير السريع."
  - term: "المَصَاعِبِ"
    text: "الفحول التي لم تُذلَّل بالركوب."
