explained: false
first: "دَعَوْتُ بَنِي عَوْفٍ لِحَقْنِ دِمَائِهِمْ"
second: "فَلَمَّا أَبَوْا سَامَحْتُ فِي حَرْبِ حَاطِبِ"
vocabulary:
  - term: "بَنِي عَوْفٍ"
    text: "بنو عَمْرو بن عَوْف من الأوس، وهم خصوم قومه في هذه الحرب."
  - term: "سَامَحْتُ"
    text: "انقدت إليها ورضيت بها بعد إباء."
  - term: "حَرْبِ حَاطِبِ"
    text: "حرب بين الأوس والخزرج نُسبت إلى حاطِب بن قيس."
sources:
