first: "إِذَا مَا فَرَرْنَا كَانَ أَسْوَا فِرَارِنَا"
second: "صُدُودَ الخُدُودِ وَازْوِرَارَ المَنَاكِبِ"
vocabulary:
  - term: "صُدُودَ الخُدُودِ"
    text: "إمالة الوجوه."
  - term: "ازْوِرَارَ المَنَاكِبِ"
    text: "ميل الأكتاف. يقول: إن فررنا لم نولّ الأدبار، وإنما نميل وجوهنا ومناكبنا عن الطعن ونحن ثابتون."
