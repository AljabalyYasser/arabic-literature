explained: false
first: "إِذَا لَمْ يَكُنْ عَنْ غَايَةِ الحَرْبِ مَدْفَعٌ"
second: "فَأَهْلًا بِهَا إِذْ لَمْ تَزَلْ فِي المَرَاحِبِ"
vocabulary:
  - term: "مَدْفَعٌ"
    text: "سبيل إلى ردّها."
  - term: "المَرَاحِبِ"
    text: "جمع مَرْحَب، أي ما زالت يُقال لها: أهلًا ومرحبًا."
