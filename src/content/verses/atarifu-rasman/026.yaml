explained: false
first: "وَيَوْمَ بُعَاثٍ أَسْلَمَتْنَا سُيُوفُنَا"
second: "إِلَى حَسَبٍ فِي جِذْمِ غَسَّانَ ثَاقِبِ"
vocabulary:
  - term: "بُعَاثٍ"
    text: "آخر أيام الأوس والخزرج قبل الإسلام."
  - term: "جِذْمِ غَسَّانَ"
    text: "أصل غسّان، والأوس والخزرج من الأزد ثم من غسّان."
  - term: "ثَاقِبِ"
    text: "مضيء عالٍ."
