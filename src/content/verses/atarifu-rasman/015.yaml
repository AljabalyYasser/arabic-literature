explained: false
first: "تَرَى قِصَدَ المُرَّانِ فِيهَا كَأَنَّهَا"
second: "تَذَرُّعُ خِرْصَانٍ بِأَيْدِي الشَّوَاطِبِ"
vocabulary:
  - term: "قِصَدَ المُرَّانِ"
    text: "كِسَر الرماح، والمُرّان: الرماح."
  - term: "خِرْصَانٍ"
    text: "قضبان الجريد."
  - term: "الشَّوَاطِبِ"
    text: "النساء يشققن الجريد: «شطبت المرأة الجريد شطبا شقته، فهي شاطبة، لتعمل منه الحصر» [@lisan، ج1 ص496]، وفيه البيت برواية «تُلقى» مكان «فيها»."
