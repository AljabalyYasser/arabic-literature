first: "صَبَحْنَاكُمُ بَيْضَاءَ يَبْرُقُ بَيْضُهَا"
second: "تُبِينُ خَلَاخِيلَ النِّسَاءِ الهَوَارِبِ"
vocabulary:
  - term: "صَبَحْنَاكُمُ بَيْضَاءَ"
    text: "أغرنا عليكم صباحًا بكتيبة بيضاء لكثرة حديدها."
  - term: "تُبِينُ خَلَاخِيلَ"
    text: "تُظهر خلاخيل النساء، لأنهن يرفعن ثيابهن في الهرب."
