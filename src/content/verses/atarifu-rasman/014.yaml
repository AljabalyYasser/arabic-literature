explained: false
first: "إِذَا فَزِعُوا مَدُّوا إِلَيَّ قَوَاحِزًا"
second: "كَمَوْجِ الأَتِيِّ المُزْبِدِ المُتَرَاكِبِ"
vocabulary:
  - term: "فَزِعُوا"
    text: "استُصرخوا فهبّوا للنجدة."
  - term: "قَوَاحِزًا"
    text: "كلمة غامضة في نص «الجمهرة»، لم نجد تفسيرها في مصادرنا."
  - term: "الأَتِيِّ"
    text: "السيل: «الأتي وهو السيل الذي يجيء من أرض مطرت إلى أرض لم تمطر» [@lisan، ج11 ص676]."
