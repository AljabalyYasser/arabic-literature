explained: false
first: "تَبَدَّتْ لَنَا كَالشَّمْسِ تَحْتَ غَمَامَةٍ"
second: "بَدَا حَاجِبٌ مِنْهَا وَضَنَّتْ بِحَاجِبِ"
vocabulary:
  - term: "حَاجِبٌ"
    text: "طرف من قرص الشمس، وهو في المرأة الحاجب فوق العين؛ «وحاجب الشمس: ناحية منها»، وبهذا البيت يستشهد ابن منظور [@lisan، ج1 ص299]."
  - term: "ضَنَّتْ"
    text: "بخلت؛ «الضِّنّة والضِّنّ والمَضَنّة والمَضِنّة، كل ذلك من الإمساك والبخل» [@lisan، ج13 ص261]."
