explained: false
first: "أَصَابَ صَرِيحَ القَوْمِ غَرْبُ سُيُوفِنَا"
second: "وَغَادَرْنَ أَبْنَاءَ الإِمَاءِ الحَوَاطِبِ"
vocabulary:
  - term: "صَرِيحَ القَوْمِ"
    text: "خالصي النسب منهم، أي سادتهم."
  - term: "غَرْبُ سُيُوفِنَا"
    text: "حدّها."
  - term: "أَبْنَاءَ الإِمَاءِ الحَوَاطِبِ"
    text: "أبناء الجواري اللواتي يجمعن الحطب، أي تركنا الأراذل لم نقتلهم."
