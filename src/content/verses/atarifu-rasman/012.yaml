explained: false
first: "وَسَامَحَ فِيهَا الكَاهِنَانِ وَمَالِكٌ"
second: "وَثَعْلَبَةُ الأَخْيَارُ رَهْطُ القَبَاقِبِ"
vocabulary:
  - term: "الكَاهِنَانِ"
    text: "قُرَيْظة والنَّضِير من يهود يثرب: «الأزهري: يقال لقريظة والنضير الكاهنان، وهما قبيلا اليهود بالمدينة» [@lisan، ج13 ص363]. وكانوا حلفاء الأوس يوم بُعاث."
  - term: "سَامَحَ"
    text: "انقاد ووافق."
