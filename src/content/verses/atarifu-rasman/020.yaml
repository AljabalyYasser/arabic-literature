first: "لَوَ انَّكَ تُلْقِي حَنْظَلًا فَوْقَ بَيْضِنَا"
second: "تَدَحْرَجَ عَنْ ذِي سَامِهِ المُتَقَارِبِ"
vocabulary:
  - term: "بَيْضِنَا"
    text: "خُوَذنا."
  - term: "ذِي سَامِهِ"
    text: "البيض المموّه بالذهب: «وقيل: السام عروق الذهب والفضة فى الحجر» [@lisan، ج12 ص313]. يريد أن البيض متلاصق متقارب لا فرجة فيه."
