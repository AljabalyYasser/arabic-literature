first: "فَلَيْتَ سُوَيْدًا رَاءَ مَنْ خَرَّ مِنْهُمُ"
second: "وَمَنْ فَرَّ إِذْ نَحْدُوهُمُ كَالحَلَائِبِ"
vocabulary:
  - term: "رَاءَ"
    text: "رأى، بتقديم الألف على الهمزة."
  - term: "نَحْدُوهُمُ كَالحَلَائِبِ"
    text: "نسوقهم أمامنا كما تُساق النوق الحلوب."
