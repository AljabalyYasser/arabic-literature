explained: false
first: "أَتَعْرِفُ رَسْمًا كَاطِّرَادِ المَذَاهِبِ"
second: "لِعَمْرَةَ وَحْشًا غَيْرَ مَوْقِفِ رَاكِبِ"
vocabulary:
  - term: "رَسْمًا"
    text: "أثرًا باقيًا من الديار."
  - term: "كَاطِّرَادِ المَذَاهِبِ"
    text: "يقول محققو «الأغاني»: «الاطراد: التتابع. والمذاهب: واحدها مذهب وهو جلد تجعل فيه خطوط مذهبة بعضها فى أثر بعض» [@aghani-dk، ج3 ص7، الحاشية]. فآثار الدار خطوط متتابعة كخطوط الجلد المذهّب."
  - term: "وَحْشًا"
    text: "خاليًا لا أنيس فيه."
  - term: "غَيْرَ مَوْقِفِ رَاكِبِ"
    text: "لا يقف فيه إلا راكب عابر."
