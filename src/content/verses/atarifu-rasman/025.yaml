explained: false
first: "لَقِيتُكُمُ يَوْمَ الخَنَادِقِ حَاسِرًا"
second: "كَأَنَّ يَدِي بِالسَّيْفِ مِخْرَاقُ لَاعِبِ"
vocabulary:
  - term: "حَاسِرًا"
    text: "بلا درع ولا مِغْفَر."
  - term: "مِخْرَاقُ لَاعِبِ"
    text: "يقول محققو «الأغاني»: «المخراق: خرقة مفتولة يلعب بها الصبيان» [@aghani-dk، ج3 ص7، الحاشية]. يريد خفّة يده بالسيف."
