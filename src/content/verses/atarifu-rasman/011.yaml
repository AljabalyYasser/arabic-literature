explained: false
first: "مُضَاعَفَةً يَغْشَى الأَنَامِلَ رَيْعُهَا"
second: "كَأَنَّ قَتِيرَهَا عُيُونُ الجَنَادِبِ"
vocabulary:
  - term: "مُضَاعَفَةً"
    text: "درعًا نُسجت حلقتين حلقتين."
  - term: "رَيْعُهَا"
    text: "فضولها، أي هي سابغة يغطي طرفها الأصابع."
  - term: "قَتِيرَهَا"
    text: "«والقتير رؤوس المسامير فى الدرع» [@lisan، ج5 ص72]."
  - term: "الجَنَادِبِ"
    text: "جمع جُنْدَب، ضرب من الجراد."
