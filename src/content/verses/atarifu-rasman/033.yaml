explained: false
first: "فَلَوْلَا ذُرَى الآكَامِ قَدْ تَعْلَمُونَهُ"
second: "وَتَرْكُ الفَضَا شُورِكْتُمُ فِي الكَوَاعِبِ"
vocabulary:
  - term: "ذُرَى الآكَامِ"
    text: "أعالي التلال التي لجؤوا إليها."
  - term: "الفَضَا"
    text: "الأرض الواسعة."
  - term: "شُورِكْتُمُ فِي الكَوَاعِبِ"
    text: "لسُبيت نساؤكم الشابات، والكواعب: الجواري اللواتي نهدت أثداؤهن."
sources:
