explained: false
first: "وَمِثْلَكِ قَدْ أَصْبَيْتُ لَيْسَتْ بِكَنَّةٍ"
second: "وَلَا جَارَةٍ فِينَا حَلِيلَةِ صَاحِبِ"
vocabulary:
  - term: "أَصْبَيْتُ"
    text: "أملت إلى الصِّبا والهوى."
  - term: "بِكَنَّةٍ"
    text: "يقول محققو «الأغاني»: «كنة: امرأة الابن أو الأخ» [@aghani-dk، ج3 ص6، الحاشية]."
  - term: "حَلِيلَةِ صَاحِبِ"
    text: "زوجة صاحب. يقول: لا أغازل امرأة قريب ولا جارة ولا زوجة صديق."
sources:
