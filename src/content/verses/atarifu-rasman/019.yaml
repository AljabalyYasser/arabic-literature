first: "رَمَيْنَا بِهَا الآطَامَ حَوْلَ مُزَاحِمٍ"
second: "قَوَانِسُ أُولَى بَيْضِهَا كَالكَوَاكِبِ"
vocabulary:
  - term: "الآطَامَ"
    text: "الحصون، واحدها أُطُم."
  - term: "مُزَاحِمٍ"
    text: "اسم أُطُم من آطام يثرب."
  - term: "قَوَانِسُ"
    text: "أعالي البَيْض، والبَيْض الخُوَذ."
