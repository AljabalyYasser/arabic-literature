first: "تَتَبَّعُ أَفْياءَ الظِّلالِ عَشِيَّةً"
second: "عَلَى طُرُقٍ كَأَنَّهُنَّ سُبُوبُ"
vocabulary:
  - term: "أَفْياءَ الظِّلالِ"
    text: "أضاف الأفياء إلى الظلال «لأن الفيء يكون بالعشي، ويسمى ظلا. والظل بالغداة، ولا يسمى فيئا» [@tabrizi-ikhtiyarat، ج3 ص1584]."
  - term: "سُبُوبُ"
    text: "جمع سِبّ، وهو الخمار، شبّه الطريق به في استوائه [@tabrizi-ikhtiyarat، ج3 ص1584]."
