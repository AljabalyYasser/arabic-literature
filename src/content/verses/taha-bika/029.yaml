first: "تُقَدِّمُهُ حَتَّى تَغِيبَ حُجُولُهُ"
second: "وأَنْتَ لِبَيْضِ الدّارِعِينَ ضَرُوبُ"
vocabulary:
  - term: "حُجُولُهُ"
    text: "البياض في قوائم الفرس، كما يقول محقق شرح التِّبْرِيزِيّ؛ و«تغيب في الدماء» [@tabrizi-ikhtiyarat، ج3 ص1592]."
  - term: "بَيْضِ الدّارِعِينَ"
    text: "خُوَذ لابسي الدروع."
  - term: "ضَرُوبُ"
    text: "«الكثير الضرب» [@tabrizi-ikhtiyarat، ج3 ص1592]."
