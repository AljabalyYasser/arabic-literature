first: "وقاتَلَ مِنْ غَسّانَ أَهْلُ حِفاظِها"
second: "وهِنْبٌ وقاسٌ جالَدَتْ وشَبِيبُ"
vocabulary:
  - term: "غَسّانَ"
    text: "قال الأَصْمَعِيّ: ماء نزلوا عليه فسُمّوا به [@tabrizi-ikhtiyarat، ج3 ص1594]."
  - term: "أَهْلُ حِفاظِها"
    text: "الذين يحمون حرمها ويغضبون لها."
  - term: "هِنْبٌ وقاسٌ ... وشَبِيبُ"
    text: "أحياء من قُضاعة [@tabrizi-ikhtiyarat، ج3 ص1594]."
  - term: "جالَدَتْ"
    text: "ضاربت بالسيوف."
