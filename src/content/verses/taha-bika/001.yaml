first: "طَحَا بِكَ قَلْبٌ فِي الحِسَانِ طَرُوبُ"
second: "بُعَيْدَ الشَّبَابِ عَصْرَ حَانَ مَشِيبُ"
meaning: "ذهب بك قلبٌ كثيرُ الطرب إلى الحِسان كلَّ مذهب، وقد ولّى شبابك منذ قليل، في الوقت الذي أقبل فيه الشيب."
vocabulary:
  - term: "طَحا بِكَ"
    text: "««طحا»: اتّسع وامتدّ... ويجوز أن يكون معنى «طحا بك»: مرّ» [@tabrizi-ikhtiyarat، ج3 ص1577]، أي ذهب بك بعيدًا."
  - term: "طَرُوبُ"
    text: "كثير الطرب، و«معنى «طروب في الحسان»: له طرب في طلب الحسان، ونشاط في مراودتها» [@tabrizi-ikhtiyarat، ج3 ص1577]."
  - term: "بُعَيْدَ الشَّبابِ"
    text: "بعده بقليل، «صغّر «بعيد» على طريق التقريب» [@tabrizi-ikhtiyarat، ج3 ص1577]."
  - term: "عَصْرَ حانَ مَشِيبُ"
    text: "في الحين الذي جاء فيه الشيب؛ «وإنما أراد: حين ولّى الشباب، وكاد ينصرم، وأقبل الشيب، وقارب في الهجوم» [@tabrizi-ikhtiyarat، ج3 ص1577]."
context: "مطلع المدحة التي قصد بها عَلْقَمة الحارثَ بن أبي شَمِر الغسّانيّ، وكان قد أسر أخاه شَأْسًا، «فرحل إليه يطلب فيه» [@tabrizi-ikhtiyarat، ج3 ص1576]. يبدأ بالغزل كعادة القصيدة، لكنه يقرن الطرب بالشيب من البيت الأول، فيمهّد لحكمته في النساء (8–10). وهذا المطلع أحد اللذين قالت فيهما قريش «هاتان سمطا الدهر» في رواية حَمّاد الراوية [@aghani-dk، ج21 ص201]، والسِّمْط: القلادة."
syntax:
  - "«طحا» فعل ماض، و«بك» جار ومجرور متعلق به، والباء للتعدية: ذهب بك. و«قلبٌ» فاعل، و«طروب» نعت له، و«في الحسان» متعلق بـ«طروب». وقال بعضهم: طروب إلى الحسان، «لكن حروف الجر تتعاقب» [@tabrizi-ikhtiyarat، ج3 ص1577]."
  - "«بُعيدَ» ظرف زمان منصوب متعلق بـ«طحا»، مضاف، و«الشباب» مضاف إليه."
  - "«عصرَ» ظرف زمان منصوب، بدل من «بعيد»، مضاف إلى الجملة الفعلية «حان مشيب»: «حان» فعل ماض، و«مشيب» فاعله."
morphology:
  - "«طروب» صيغة مبالغة على «فَعُول» من طَرِب."
  - "«بُعَيْد» تصغير الظرف «بَعْد»، والتصغير هنا لتقريب الزمن لا للتحقير."
  - "«مَشِيب» مصدر ميمي من شاب يشيب، و«الحِسان» جمع حسناء."
rhetoric:
  thesis: "يفتتح المدحة باعتراف رجل ولّى شبابه ولا يزال قلبه يطرب، فيجمع في بيت واحد الطرب والشيب، وهما ما سيبني عليه حكمته في النساء."
  devices:
    - title: "الإسناد المجازي في «طحا بك قلب»"
      text: "في «طحا بك قلب» جعل القلبَ هو الذي يذهب بصاحبه، والرجلَ هو المسوق، فأسند الفعل إلى القلب وهو في الحقيقة لصاحبه. وهذا مما يسمّيه عبد القاهر الجُرْجانيّ مجازًا في الإسناد، وهو «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]، أي أن الكلمة باقية على معناها، والمجاز في نسبة الفعل إليها."
    - title: "التصغير في «بُعَيْدَ»"
      text: "في «بُعيد الشباب» صغّر الظرف ليقرّب الزمن: لم يبعد عهده بالشباب. ثم قال «عصر حان مشيب»، ولم يتناقض كما يقول التِّبْرِيزِيّ: «ولم يرد التناقض» [@tabrizi-ikhtiyarat، ج3 ص1577]، بل جعل اللحظة الواحدة نهاية للشباب وبداية للشيب."
    - title: "التصريع"
      text: "ختم الصدر بـ«طروب» على قافية العجز «مشيب». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. وقد نقصت العروض هنا كما نقص الضرب، كما في الوزن."
  connection: "ثم يسمّي من يكلّفه قلبه حبها: ليلى، وقد بعدت دارها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة، وقبلها ردف بالواو أو الياء، فهي بائية مردفة"
  scansion: "طَحَابِ / كَقَلْبُنْ فِلْ / حِسَانِ / طَرُوبُو = فعولُ / مفاعيلن / فعولُ / فعولن — بُعَيْدَشْ / شَبَابِعَصْ / رَحَانَ / مَشِيبُو = فعولن / مفاعلن / فعولُ / فعولن"
  note: "الضرب محذوف: حُذف السبب الأخير من «مفاعيلن» «لتصير مفاعي» وتُنقل إلى «فعولن» [@atiq، ص30]. وعروض الطويل «تأتي مقبوضة دائمًا» [@atiq، ص29]، لكنها هنا محذوفة مثل الضرب لأن البيت مصرّع. ودخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر و«فعولن» الثالثة في العجز فصارت «فعولُ»، و«مفاعيلن» في العجز فصارت «مفاعلن». ويستشهد ابن رَشِيق بهذا البيت على تعاقب الواو والياء ردفًا قبل الرويّ: «فالياء في مشيب مقام الواو في طروب» [@ibn-rashiq، ج1 ص159]. وتُمدّ ضمة الباء في آخر الشطرين فتُنطق «بُو»."
