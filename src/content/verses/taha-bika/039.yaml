first: "وإِلّا كَمِيٌّ ذُو حِفاظٍ كَأَنَّهُ"
second: "بِما ابْتَلَّ مِنْ حَدِّ الظُّباتِ خَضِيبُ"
vocabulary:
  - term: "كَمِيٌّ"
    text: "الشجاع، «يكمي شجاعته لوقت الحاجة، أي: يسترها» [@tabrizi-ikhtiyarat، ج3 ص1597]."
  - term: "الظُّباتِ"
    text: "حدود السيوف."
  - term: "خَضِيبُ"
    text: "«قد خُضب بالدم» [@tabrizi-ikhtiyarat، ج3 ص1597]."
