explained: false
first: "مُظَاهِرُ سِرْبَالَيْ حَدِيدٍ عَلَيْهِمَا"
second: "عَقِيلَا سُيُوفٍ مِخْذَمٌ وَرَسُوبُ"
vocabulary:
  - term: "مُظاهِرُ سِرْبالَيْ حَدِيدٍ"
    text: "لابس درعين إحداهما فوق الأخرى؛ قال المُفَضَّل: «لبس الحارث يوم عين أباغ درعين، وتقلد سيفيه: مخذما ورسوبا» [@tabrizi-ikhtiyarat، ج3 ص1592]."
  - term: "عَقِيلا"
    text: "«وعقيلة كل شيء: خياره» [@tabrizi-ikhtiyarat، ج3 ص1592]."
  - term: "مِخْذَمٌ ورَسُوبُ"
    text: "اسما سيفيه: «المخذم»: القاطع، و«الرسوب»: الذي يرسب في الضريبة [@tabrizi-ikhtiyarat، ج3 ص1592]."
