explained: false
first: "وَمَا أَنْتَ أَمْ مَا ذِكْرُهَا رَبَعِيَّةً"
second: "يُخَطُّ لَهَا مِنْ ثَرْمَدَاءَ قَلِيبُ"
vocabulary:
  - term: "وما أَنْتَ"
    text: "يخاطب نفسه منكرًا: أيّ شيء أنت؟ [@tabrizi-ikhtiyarat، ج3 ص1580]."
  - term: "أَمْ"
    text: "المنقطعة، تحوّل الكلام من شيء إلى شيء، «ولذلك يفسّره قوم بـ«بل»» [@tabrizi-ikhtiyarat، ج3 ص1580]."
  - term: "رَبَعِيَّةً"
    text: "من الرَّبائع، وهي أربعة أحياء من بني تَمِيم يُسمّى كل منها ربيعة [@tabrizi-ikhtiyarat، ج3 ص1580]."
  - term: "يُخَطُّ"
    text: "«أي: يُشقّ» [@tabrizi-ikhtiyarat، ج3 ص1581]."
  - term: "ثَرْمَداءَ"
    text: "«قرية بالوَشْم» [@tabrizi-ikhtiyarat، ج3 ص1581]."
  - term: "قَلِيبُ"
    text: "بئر؛ وقال بعض أصحاب المعاني: «وأراد بـ«القليب» القبر»، أي أنها لا تبرح ثرمداء حتى تموت فتُدفن بها [@tabrizi-ikhtiyarat، ج3 ص1581]."
