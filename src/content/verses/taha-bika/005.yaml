explained: false
first: "فَلَا تَعْدِلِي بَيْنِي وَبَيْنَ مُغَمَّرٍ"
second: "سَقَتْكِ رَوَايَا المُزْنِ حِينَ تَصُوبُ"
vocabulary:
  - term: "لا تَعْدِلِي بَيْنِي وبَيْنَ"
    text: "لا تسوّي بيني وبينه، من قولهم: هذا يعدل كذا، «أي: يقوم مقامه» [@tabrizi-ikhtiyarat، ج3 ص1579]."
  - term: "مُغَمَّرٍ"
    text: "«المقهور المغلوب»، وقال المُفَضَّل: «هو الذي غمرته الرجال» [@tabrizi-ikhtiyarat، ج3 ص1579]."
  - term: "رَوايا المُزْنِ"
    text: "الروايا جمع راوية، وهي المزادة يُحمل فيها الماء، والمزن السحاب الأبيض، كما يقول محقق شرح التِّبْرِيزِيّ؛ وجعل للمزن روايا «على التمثيل والاستعارة» [@tabrizi-ikhtiyarat، ج3 ص1579]."
  - term: "تَصُوبُ"
    text: "«أي: تقع» [@tabrizi-ikhtiyarat، ج3 ص1579]."
