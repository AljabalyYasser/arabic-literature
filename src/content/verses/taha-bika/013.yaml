first: "إِلَى الحَارِثِ الوَهَّابِ أَعْمَلْتُ نَاقَتِي"
second: "لِكَلْكَلِهَا وَالقُصْرَيَيْنِ وَجِيبُ"
meaning: "إلى الحارث الكثير العطاء سُقتُ ناقتي وأجهدتها في السير، حتى صار لصدرها وأضلاعها خفقان من شدّة الجهد."
vocabulary:
  - term: "الحارِثِ"
    text: "الحارث بن جبلة بن أبي شَمِر الغسّانيّ، ملك الغساسنة بالشام [@tabrizi-ikhtiyarat، ج3 ص1576]."
  - term: "الوَهّابِ"
    text: "الكثير الهبة. ويُروى «الحرّاب»، «أي: الذي يحرب أعداءه» [@tabrizi-ikhtiyarat، ج3 ص1583]."
  - term: "أَعْمَلْتُ ناقَتِي"
    text: "حملتها على السير وأتعبتها فيه."
  - term: "كَلْكَلِها"
    text: "صدرها، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1583]."
  - term: "القُصْرَيَيْنِ"
    text: "قال الأَصْمَعِيّ: «القصريان» هما «ضلعان يليان الخلف. وهما الصغيران في آخر الأضلاع» [@tabrizi-ikhtiyarat، ج3 ص1584]."
  - term: "وَجِيبُ"
    text: "خفقان واضطراب، «وجعلها «تجيب» لحدّة فؤادها» [@tabrizi-ikhtiyarat، ج3 ص1584]."
context: "بيت الانتقال: بعد الغزل والحكمة ووصف الناقة يسمّي الممدوح أول مرة. وبه وصل ابن قُتَيْبة المطلع حين روى خبر شَأْس [@ibn-qutayba، ج1 ص215]، وكذلك ابن رَشِيق [@ibn-rashiq، ج1 ص57]. والممدوح عند التِّبْرِيزِيّ الحارث بن جبلة، ويروي أبو عَمْرو الشَّيْبانيّ أن عَلْقَمة أنشدها عَمْرو بن الحارث الأعرج، كما ينقل محقق شرحه [@tabrizi-ikhtiyarat، ج3 ص1576]. ويذكر شوقي ضيف أن أكثر الرواة على أنه الحارث بن جبلة، وأن نولدكه ذهب إلى أن القصيدة في الحارث الأصغر [@deif، ج1 ص42]."
syntax:
  - "«إلى الحارث» جار ومجرور متعلق بـ«أعملت»، قُدّم على فعله، و«الوهاب» نعت للحارث. و«أعملت» فعل وفاعل، و«ناقتي» مفعول به."
  - "«لكلكلها» جار ومجرور خبر مقدّم، و«القصريين» معطوف على «كلكلها» مجرور بالياء لأنه مثنى، و«وجيب» مبتدأ مؤخّر. والجملة الاسمية حال من الناقة."
morphology:
  - "«الوهّاب» صيغة مبالغة على «فعّال» من وهب."
  - "«أعملت» على «أفعلت» من العمل، أي جعلتها تعمل في السير."
  - "«القُصْرَيَيْن» مثنى «القُصْرَى» على «فُعْلَى»، قُلبت ألفها ياءً في التثنية."
  - "«وجيب» مصدر وجب القلب يجب، إذا خفق."
rhetoric:
  thesis: "بيت التخلّص: يحوّل مسار القصيدة من الرحلة إلى الممدوح، ويقدّم تعب الناقة ثمنًا دفعه الشاعر قبل أن يسأل."
  devices:
    - title: "التقديم في «إلى الحارث الوهاب أعملت»"
      text: "قدّم الجار والمجرور «إلى الحارث» على الفعل «أعملت»، فكان اسم الممدوح أول ما يسمعه. ويقول عبد القاهر في تعليل التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "التخلّص"
      text: "انتقل من الغزل ووصف الناقة إلى المدح في بيت واحد يجمع الأمرين: الناقة التي وصفها، والممدوح الذي قصده. وانتقال الشاعر من غرض إلى غرض بلا قطع يسمّيه النقاد التخلّص."
    - title: "اختيار «الوهّاب»"
      text: "وصف الممدوح أول ما سمّاه بكثرة الهبة لا بالحرب، فمهّد للسؤال الذي يأتي في آخر القصيدة: «فحقّ لشأس من نداك ذنوب». وهذه قراءتنا، وتؤيدها رواية «الحرّاب» في المقابل."
  connection: "ثم يصف الناقة في طريقها: تتبع أفياء الظلال عشيّة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة المردفة"
  scansion: "إِلَلْحَا / رِثِلْوَهْهَا / بِأَعْمَلْ / تُنَاقَتِي = فعولن / مفاعيلن / فعولن / مفاعلن — لِكَلْكَ / لِهَا وَلْقُصْ / رَيَيْنِ / وَجِيبُو = فعولُ / مفاعيلن / فعولُ / فعولن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب محذوف «فعولن» [@atiq، ص30]. ودخل القبض «فعولن» الأولى والثالثة في العجز."
