first: "وَفِي كُلِّ حَيٍّ قَدْ خَبَطْتَ بِنِعْمَةٍ"
second: "فَحُقَّ لِشَأْسٍ مِنْ نَدَاكَ ذَنُوبُ"
meaning: "لك في كل قبيلة نعمة أسديتها إلى من لا يعرفك، فحقيقٌ أن يكون لشأس نصيب من عطائك."
vocabulary:
  - term: "حَيٍّ"
    text: "قبيلة."
  - term: "خَبَطْتَ بِنِعْمَةٍ"
    text: "أعطيت من غير سابق معرفة؛ «أبو زيد: خبطت الرجل أخبطه خبطًا إذا وصلته... والخبط: طلب المعروف» [@lisan، ج7 ص282]، ثم أنشد البيت [@lisan، ج7 ص283]."
  - term: "شَأْسٍ"
    text: "«قال المفضّل: هو شأس بن عبدة أخو علقمة. وقال أبو عبيدة: قال أبو عمرو بن العلاء: هو ابن أخيه» [@tabrizi-ikhtiyarat، ج3 ص1598]."
  - term: "نَداكَ"
    text: "عطاؤك وجودك."
  - term: "ذَنُوبُ"
    text: "الدلو فيها ماء، والمراد النصيب؛ قال الفرّاء: «الذنوب في كلام العرب: الدلو العظيمة، ولكن العرب تذهب به إلى النصيب والحظ» [@lisan، ج1 ص392]."
context: "البيت الذي عليه خبر القصيدة: «فقال له الحارث لما أنشده: نعم وأذنبة»، ثم خيّره بين الحباء الجزل وأسرى بني تميم، فاختار الأسرى [@tabrizi-ikhtiyarat، ج3 ص1598]. ويرويه ابن قُتَيْبة [@ibn-qutayba، ج1 ص215] وابن رَشِيق [@ibn-rashiq، ج1 ص57] وصاحب اللسان [@lisan، ج6 ص110]. والخبر بتفصيله ودرجته في [فكاك شأس](/stories/fikak-shas/)."
syntax:
  - "«وفي كل حي» جار ومجرور متعلق بـ«خبطت»، قُدّم عليه، و«قد» حرف تحقيق، و«خبطت» فعل وفاعل، و«بنعمة» متعلق به."
  - "«فحُقّ» الفاء للسببية، و«حُقّ» فعل ماض مبني للمجهول بمعنى وجب، و«لشأس» متعلق به، و«من نداك» متعلق بمحذوف حال من «ذنوب» قُدّم عليه، و«ذنوب» نائب فاعل."
morphology:
  - "«حُقّ» ماض مضعّف مبني للمجهول، ومعناه معنى «حقّ»: وجب وثبت."
  - "«خبطت»: ويُروى «خبطّ»، «أراد خبطت فقلب التاء طاء وأدغم الطاء الأولى فيها» [@lisan، ج7 ص283]."
  - "«ذَنُوب» على «فَعُول»، «والجمع أذنبة، وذنائب، وذناب» [@lisan، ج1 ص392]، ومن جمع القلة «أذنبة» جاء جواب الملك."
rhetoric:
  thesis: "يحوّل الحاجة إلى حقّ: لم يقل «أطلق أخي»، بل جعل إطلاقه نصيبًا واجبًا من كرم عمّ القبائل كلها."
  devices:
    - title: "الاستعارة في «ذنوب»"
      text: "في «ذنوب» استعار الدلو الملأى للنصيب من العطاء، فصار الملك بئرًا يستقي منها الناس، وصار لشأس حقّ في دلو منها. وهي الاستعارة عند عبد القاهر: أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وعلى هذا المجاز تجري العرب في الذنوب كما يقول الفرّاء [@lisan، ج1 ص392]."
    - title: "الكناية عن طلب الفكاك"
      text: "لم يذكر الأسر ولا الفداء، بل طلب «ذنوبًا من نداك»، فدلّ على الإطلاق بما يلزمه من العطاء. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "من العامّ إلى الخاصّ"
      text: "الصدر مقدّمة عامة: نعمتك في «كل حيّ»، والعجز نتيجة خاصة: «فحقّ لشأس». والفاء تجعل العطاء لشأس نتيجة لازمة لكرم الملك لا منّة يطلبها. وهذه قراءتنا."
    - title: "جواب الملك بالاستعارة نفسها"
      text: "أخذ الحارث الاستعارة من الشاعر وجمعها، فقال: «نعم وأذنبة» [@tabrizi-ikhtiyarat، ج3 ص1598]، أي: لا دلوًا واحدًا بل دلاءً، فأطلق شأسًا ومعه أسرى تميم."
  connection: "ثم يختم القصيدة: ليس مثله في الناس إلا أسيره، فهو يشرّفه ولا يذلّه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة المردفة"
  scansion: "وَفِي كُلْ / لِحَيْيِنْ قَدْ / خَبَطْتَ / بِنِعْمَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — فَحُقْقَ / لِشَأْسِنْ مِنْ / نَدَاكَ / ذَنُوبُو = فعولُ / مفاعيلن / فعولُ / فعولن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب محذوف «فعولن» [@atiq، ص30]. ودخل القبض «فعولن» الثالثة في الصدر، والأولى والثالثة في العجز."
