first: "وَمَا مِثْلُهُ فِي النَّاسِ إِلَّا أَسِيرُهُ"
second: "مُدَانٍ وَلَا دَانٍ لِذَاكَ قَرِيبُ"
vocabulary:
  - term: "مُدانٍ"
    text: "مقارب."
  - term: "إِلّا أَسِيرُهُ"
    text: "«ليس أحد يدانيه في عزّ، إلا أسيره. يريد: أنه لا يذلّ أسيره، ولا يهينه، ولكنه يشرّفه ويعزّه» [@tabrizi-ikhtiyarat، ج3 ص1599]."
