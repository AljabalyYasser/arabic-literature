first: "وَلَسْتَ لِإِنْسِيٍّ وَلَكِنْ لِمَلْأَكٍ"
second: "تَنَزَّلَ مِنْ جَوِّ السَّمَاءِ يَصُوبُ"
meaning: "لستَ من نسل البشر، بل كأنك ملَك نزل من جوّ السماء يهبط على الناس بالخير، لكثرة خيرك وبركتك."
vocabulary:
  - term: "لِإِنْسِيٍّ"
    text: "لواحد من الإنس، أي: لست منسوبًا إلى البشر."
  - term: "مَلْأَكٍ"
    text: "المَلَك. وأصل الكلمة عند صاحب اللسان «مألك، ثم قلبت الهمزة إلى موضع اللام فقيل ملأك، ثم خففت الهمزة بأن ألقيت حركتها على الساكن الذي قبلها فقيل ملك؛ وقد يستعمل متمما والحذف أكثر»، ثم أنشد هذا البيت [@lisan، ج10 ص394]."
  - term: "جَوِّ السَّماءِ"
    text: "ما بين السماء والأرض."
  - term: "يَصُوبُ"
    text: "ينزل، «وصاب أي نزل» [@lisan، ج1 ص534]."
context: "أعلى درجات المدح في القصيدة، بعد أن ذكر أمانته عنده (25). وهو ليس في كل روايات القصيدة، يقول التِّبْرِيزِيّ: «وفي رواية المرزوقي هذا البيت، وليس في رواية غيره» [@tabrizi-ikhtiyarat، ج3 ص1590]، ومعناه عنده: «كأنك ملك نزل من السماء، لكثرة خيرك، وشمول البركات بمكانك» [@tabrizi-ikhtiyarat، ج3 ص1591]. ونسبته إلى عَلْقَمة مختلف فيها: ينقل صاحب اللسان عن ابن بَرِّيّ: «البيت لرجل من عبد القيس يمدح النعمان؛ وقيل: هو لأبي وجزة يمدح عبد الله بن الزبير؛ وقيل: هو لعلقمة بن عبدة» [@lisan، ج1 ص534]، وأنشده أبو عُبَيْدة «لرجل من عبد القيس جاهلي يمدح بعض الملوك» [@lisan، ج10 ص496]. وينقل محقق شرح التِّبْرِيزِيّ عن البغدادي أنه لم يجده في رواية المُفَضَّل ولا في ديوان عَلْقَمة [@tabrizi-ikhtiyarat، ج3 ص1590]. فنقرؤه لأنه في نص «المفضليات» المعتمد، وننبّه على الخلاف فيه."
syntax:
  - "«لستَ» فعل ناقص، والتاء اسمه، و«لإنسيّ» جار ومجرور خبره، أي: لست منسوبًا لإنسيّ."
  - "«ولكن» حرف استدراك مخفّف لا يعمل، و«لملأك» جار ومجرور متعلق بمحذوف، والتقدير: ولكنك لملأك."
  - "جملة «تنزّل من جوّ السماء» نعت لـ«ملأك»، و«من جوّ» متعلق بـ«تنزّل»، وجملة «يصوب» حال من فاعل «تنزّل»."
morphology:
  - "«مَلْأَك» على «مَفْعَل» مقلوب «مَأْلَك»، يقول الكسائي فيما ينقله صاحب اللسان: «أصله مألك بتقديم الهمزة من الألوك، وهي الرسالة» [@lisan، ج10 ص496]."
  - "«إنسيّ» اسم منسوب إلى الإنس بزيادة ياء النسب المشددة."
  - "«تنزّل» على «تفعّل»، وفيه معنى النزول شيئًا بعد شيء."
rhetoric:
  thesis: "يخرج الممدوح من جنس البشر ويلحقه بالملائكة، وهو أقصى ما في القصيدة من مبالغة في المدح."
  devices:
    - title: "التشبيه المضمر في «لست لإنسي ولكن لملأك»"
      text: "لم يقل «كأنك ملك»، بل نفى عنه البشرية ثم نسبه إلى الملائكة، فجاء التشبيه في صورة الحقيقة. وهذا قريب مما يجعله عبد القاهر أصل الاستعارة: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره» [@dalail، ص67]. ويردّه التِّبْرِيزِيّ إلى التشبيه حين يفسّره: «كأنك ملك» [@tabrizi-ikhtiyarat، ج3 ص1591]."
    - title: "النفي ثم الاستدراك"
      text: "بدأ بالنفي «لست لإنسي» ثم استدرك بـ«لكن»، فبقي السامع لحظة لا يدري ما الممدوح إن لم يكن إنسيًّا، ثم جاءه الجواب: ملك. وهذه قراءتنا."
    - title: "الصورة الحسية في «تنزّل من جوّ السماء يصوب»"
      text: "أتبع «ملأك» بفعلين للنزول، «تنزّل» و«يصوب»، والصَّوْب نزول المطر، فاجتمع في الصورة الملك والغيث معًا."
  connection: "ثم يعود إلى يوم عين أباغ: رجعت بنو كعب بن عوف بربيبها، وتُرك في الجنود ربيب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة المردفة"
  scansion: "وَلَسْتَ / لِإِنْسِيْيِنْ / وَلَاكِنْ / لِمَلْأَكِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — تَنَزْزَ / لَمِنْ جَوْوِسْ / سَمَاءِ / يَصُوبُو = فعولُ / مفاعيلن / فعولُ / فعولن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب محذوف «فعولن» [@atiq، ص30]. ودخل القبض «فعولن» الأولى في الصدر، والأولى والثالثة في العجز. وبقاء الهمزة في «مَلْأَك» هو الذي يقيم الوزن، ولو قال «مَلَك» لنقص مقطع."
