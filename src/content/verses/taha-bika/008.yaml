first: "فَإِنْ تَسْأَلُونِي بِالنِّسَاءِ فَإِنَّنِي"
second: "بَصِيرٌ بِأَدْوَاءِ النِّسَاءِ طَبِيبُ"
meaning: "إن سألتموني عن النساء فأنا عالم بعللهنّ وما يُصلحهنّ، خبير بهنّ خبرةَ الطبيب بأدواء المرضى."
vocabulary:
  - term: "بِالنِّساءِ"
    text: "«يريد: عن النساء» [@tabrizi-ikhtiyarat، ج3 ص1582]، والباء بمعنى «عن»."
  - term: "بَصِيرٌ"
    text: "عالم خبير."
  - term: "أَدْواءِ"
    text: "جمع داء، وأراد ما يعتري النساء من أهواء وعلل في الودّ."
  - term: "طَبِيبُ"
    text: "حاذق عالم بالداء ودوائه."
context: "أول ثلاثة أبيات هي أشهر ما في القصيدة. اختارها ابن قُتَيْبة فقال: «ومن جيّد قوله»، ثم أنشدها [@ibn-qutayba، ج1 ص213]، وعاد إليها في آخر ترجمته: «ويستجاد له من هذا الشعر: فإن تسألونى بالنساء الثلاثة الأبيات» [@ibn-qutayba، ج1 ص216]. تأتي بعد أن لام نفسه على حب ليلى البعيدة (7)، فينتقل من عاشق يُسأل عن حبه إلى مجرّب يُسأل عن النساء."
syntax:
  - "«إن» حرف شرط جازم، و«تسألوني» فعل الشرط مجزوم بحذف النون، والواو فاعل، والنون للوقاية، والياء مفعول به. و«بالنساء» جار ومجرور متعلق بـ«تسألوا»."
  - "«فإنني بصير» جواب الشرط مقترن بالفاء لأنه جملة اسمية، في محل جزم: «إنّ» واسمها الياء، و«بصير» خبرها، و«بأدواء» متعلق بـ«بصير»، و«النساء» مضاف إليه، و«طبيب» خبر ثانٍ."
morphology:
  - "«بصير» و«طبيب» صفتان مشبّهتان على «فَعِيل» تدلّان على الثبوت."
  - "«أدواء» جمع «داء» على «أفعال»، وأصل الداء «دَوَأ»، قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها."
rhetoric:
  thesis: "يقدّم الشاعر نفسه خبيرًا بالنساء، فيصير حكمه التالي فيهنّ حكم مجرّب لا حكم عاشق مغيظ."
  devices:
    - title: "الاستعارة في «بأدواء النساء»"
      text: "في «أدواء النساء» جعل ما يعرض لهنّ من تقلّب الودّ ومَيْل الهوى أدواءً، ثم جعل نفسه «طبيبًا» يعرفها. ولم يذكر المشبّه به صريحًا، بل استعار له اسمه، وهي الاستعارة عند عبد القاهر: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الباء بمعنى «عن» في «تسألوني بالنساء»"
      text: "في «تسألوني بالنساء» جاءت الباء موضع «عن»، واستشهد لها التِّبْرِيزِيّ بآية: «في القرآن: فاسأل به خبيرا» [@tabrizi-ikhtiyarat، ج3 ص1582]."
    - title: "تكرار «النساء»"
      text: "كرّر «النساء» في الشطرين ولم يضمر، فبقي الموضوع ظاهرًا في البيت كله، وصار البيت يُحفظ وحده بلا حاجة إلى ما قبله. وهذه قراءتنا."
  connection: "ثم يفسّر علمه بهنّ: إذا شاب الرجل أو قلّ ماله ذهب نصيبه من ودّهنّ."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة المردفة"
  scansion: "فَإِنْ تَسْ / أَلُونِي بِنْ / نِسَاءِ / فَإِنْنَنِي = فعولن / مفاعيلن / فعولُ / مفاعلن — بَصِيرُنْ / بِأَدْوَاءِنْ / نِسَاءِ / طَبِيبُو = فعولن / مفاعيلن / فعولُ / فعولن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب محذوف «فعولن» [@atiq، ص30]. ودخل القبض «فعولن» الثالثة في الشطرين فصارت «فعولُ»."
