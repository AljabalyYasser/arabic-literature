explained: false
first: "رَغَا فَوْقَهُمْ سَقْبُ السَّمَاءِ فَدَاحِضٌ"
second: "بِشِكَّتِهِ لَمْ يُسْتَلَبْ وَسَلِيبُ"
vocabulary:
  - term: "رَغا فَوْقَهُمْ سَقْبُ السَّماءِ"
    text: "شبّههم «بثمود حين عقروا الناقة، ورغا البكر فيهم، فأهلكهم الله»، والسَّقْب ولد الناقة [@tabrizi-ikhtiyarat، ج3 ص1595]."
  - term: "داحِضٌ"
    text: "«زَلِق» [@tabrizi-ikhtiyarat، ج3 ص1596]."
  - term: "شِكَّتِهِ"
    text: "سلاحه، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1595]."
