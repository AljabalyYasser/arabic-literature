first: "إِذَا شَابَ رَأْسُ المَرْءِ أَوْ قَلَّ مَالُهُ"
second: "فَلَيْسَ لَهُ فِي وُدِّهِنَّ نَصِيبُ"
meaning: "إذا شاب الرجل أو افتقر انصرفت عنه مودّة النساء، فلا يبقى له منها حظ."
vocabulary:
  - term: "شابَ رَأْسُ المَرْءِ"
    text: "ابيضّ شعره، يريد: كبر."
  - term: "وُدِّهِنَّ"
    text: "محبّتهنّ، والضمير للنساء."
  - term: "نَصِيبُ"
    text: "حظّ وقسم."
context: "ثاني الأبيات الثلاثة التي استجادها ابن قُتَيْبة [@ibn-qutayba، ج1 ص213]. هو تفسير «الطب» الذي ادّعاه في البيت السابق: علّة النساء عنده أنهنّ يتبعن الشباب والمال، ويفصّل ذلك البيت التالي: «يردن ثراء المال حيث علمنه، وشرخ الشباب عندهن عجيب». وفي سياق القصيدة يعتذر بها عن هجر ليلى له، فقد ولّى شبابه كما قال في المطلع."
syntax:
  - "«إذا» ظرف متضمّن معنى الشرط، و«شاب رأس المرء» فعل وفاعل ومضاف إليه، وجملة «أو قلّ ماله» معطوفة عليها، والجملتان في محل جر بالإضافة."
  - "«فليس له في ودّهن نصيب» جواب الشرط، واقترن بالفاء لأن فعله جامد. و«له» جار ومجرور خبر «ليس» مقدّم، و«في ودّهن» متعلق بمحذوف حال من «نصيب»، و«نصيب» اسم «ليس» مؤخّر."
morphology:
  - "«شاب» ماض أجوف يائي، مضارعه يشيب، ومصدره الشيب والمشيب."
  - "«قلّ» ماض مضعّف، و«الوُدّ» مصدر ودّ يودّ."
rhetoric:
  thesis: "حكمة تجمع سببين لانصراف النساء، الشيب والفقر، وتجعل كلًّا منهما كافيًا وحده."
  devices:
    - title: "الكناية في «شاب رأس المرء»"
      text: "في «شاب رأس المرء» كناية عن الكبر: ذكر الشيب، وهو أثر يتبع الكبر في الوجود. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "العطف بـ«أو» بين الشيب وقلّة المال"
      text: "عطف «قلّ ماله» على «شاب رأس المرء» بـ«أو» لا بالواو، فكلّ سبب منهما يكفي وحده لذهاب الودّ. ثم يذكر في البيت التالي ضدّيهما: «ثراء المال» و«شرخ الشباب». وهذه قراءتنا."
    - title: "التعميم بلفظ «المرء»"
      text: "يتكلم عن نفسه بلفظ عامّ، «المرء»، فخرج البيت من حكاية حاله إلى حكم على الناس، ولذلك سار مثلًا."
  connection: "ثم يفصّل ما يردنه: ثراء المال حيث علمنه، وشرخ الشباب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة المردفة"
  scansion: "إِذَا شَا / بَرَأْسُلْ مَرْ / ءِأَوْ قَلْ / لَمَالُهُو = فعولن / مفاعيلن / فعولن / مفاعلن — فَلَيْسَ / لَهُو فِي وُدْ / دِهِنْنَ / نَصِيبُو = فعولُ / مفاعيلن / فعولُ / فعولن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب محذوف «فعولن» [@atiq، ص30]. ودخل القبض «فعولن» الأولى والثالثة في العجز. وتُشبَع ضمة الهاء في «ماله» و«له» فتُنطقان «مالُهُو» و«لَهُو»."
