first: "مُنَعَّمَةٌ مَا يُسْتَطَاعُ كِلَامُهَا"
second: "عَلَى بَابِهَا مِنْ أَنْ تُزَارَ رَقِيبُ"
vocabulary:
  - term: "مُنَعَّمَةٌ"
    text: "ناعمة العيش مرفَّهة."
  - term: "كِلامُها"
    text: "مكالمتها، مصدر كالَمَ."
  - term: "مِنْ أَنْ تُزارَ"
    text: "«أي: لئلا تُزار» [@tabrizi-ikhtiyarat، ج3 ص1578]."
  - term: "رَقِيبُ"
    text: "حارس يمنع من زيارتها."
