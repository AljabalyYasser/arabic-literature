explained: false
first: "تَعَفَّقَ بِالأَرْطَى لَها وأَرادَها"
second: "رِجالٌ فَبَذَّتْ نَبْلَهُمْ وكَلِيبُ"
vocabulary:
  - term: "تَعَفَّقَ بِالأَرْطَى لَها"
    text: "«أي: استتر لها، يعني القانص» [@tabrizi-ikhtiyarat، ج3 ص1586]."
  - term: "الأَرْطَى"
    text: "شجر له عروق حمر يُدبغ بورقه، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1586]."
  - term: "بَذَّتْ"
    text: "سبقت وفاتت، كما يقول المحقق [@tabrizi-ikhtiyarat، ج3 ص1586]."
  - term: "كَلِيبُ"
    text: "«الكلاب» [@tabrizi-ikhtiyarat، ج3 ص1586]."
