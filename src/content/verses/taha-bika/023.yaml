explained: false
first: "تُرَادُ عَلَى دِمْنِ الحِيَاضِ فَإِنْ تَعَفْ"
second: "فَإِنَّ المُنَدَّى رِحْلَةٌ فَرُكُوبُ"
vocabulary:
  - term: "تُرادُ"
    text: "«أي: تُعرض» على الماء [@tabrizi-ikhtiyarat، ج3 ص1589]."
  - term: "دِمْنِ الحِياضِ"
    text: "«ما تدمّن من الماء، بسقوط البعر والقذى فيه» [@tabrizi-ikhtiyarat، ج3 ص1589]."
  - term: "تَعَفْ"
    text: "تكره."
  - term: "المُنَدَّى"
    text: "من التندية، وهي عند الأَصْمَعِيّ «الرعي بين السقيتين»؛ يقول: مندّاها عندنا إذا عافت الماء الرحلة والركوب [@tabrizi-ikhtiyarat، ج3 ص1589]."
