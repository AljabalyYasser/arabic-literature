explained: false
first: "بِها جِيَفُ الحَسْرَى فَأَمّا عِظامُها"
second: "فَبِيضٌ وأَمّا جِلْدُها فَصَلِيبُ"
vocabulary:
  - term: "الحَسْرَى"
    text: "النوق المُعْيِيَة التي هلكت في الطريق، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1588]."
  - term: "جِلْدُها"
    text: "«يريد: جلودها» [@tabrizi-ikhtiyarat، ج3 ص1588]."
  - term: "صَلِيبُ"
    text: "«الجلد الذي لم يُدبغ، ولم يُستعمل» [@tabrizi-ikhtiyarat، ج3 ص1588]."
