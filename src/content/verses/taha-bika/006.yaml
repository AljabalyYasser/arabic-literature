explained: false
first: "سَقاكِ يَمانٍ ذُو حَبِيٍّ وعارِضٍ"
second: "تَرُوحُ بِهِ جُنْحَ العَشِيِّ جَنُوبُ"
vocabulary:
  - term: "يَمانٍ"
    text: "سحاب من جهة اليمن، وخصّه «لأنه لا يُخلف» [@tabrizi-ikhtiyarat، ج3 ص1580]."
  - term: "حَبِيٍّ"
    text: "«ما اجتمع من السحاب» [@tabrizi-ikhtiyarat، ج3 ص1580]."
  - term: "عارِضٍ"
    text: "من السحاب «ما يعرض في الأفق» [@tabrizi-ikhtiyarat، ج3 ص1580]."
  - term: "جُنْحَ العَشِيِّ"
    text: "حين تميل الشمس إلى المغيب، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1579]."
  - term: "جَنُوبُ"
    text: "ريح الجنوب، «وهم يتيمّنون بالجنوب» [@tabrizi-ikhtiyarat، ج3 ص1580]."
