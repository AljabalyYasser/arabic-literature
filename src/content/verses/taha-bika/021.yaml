explained: false
first: "هَدانِي إِلَيْكَ الفَرْقَدانِ ولاحِبٌ"
second: "لَهُ فَوْقَ أَصْواءِ المِتانِ عُلُوبُ"
vocabulary:
  - term: "الفَرْقَدانِ"
    text: "نجمان قريبان من القطب يُهتدى بهما."
  - term: "لاحِبٌ"
    text: "«الطريق الواضح» [@tabrizi-ikhtiyarat، ج3 ص1588]."
  - term: "أَصْواءِ"
    text: "«جمع صُوّة، وهي حجارة تُجمع» علامةً للطريق [@tabrizi-ikhtiyarat، ج3 ص1588]."
  - term: "المِتانِ"
    text: "«ما غلظ من الأرض» [@tabrizi-ikhtiyarat، ج3 ص1588]."
  - term: "عُلُوبُ"
    text: "«الآثار» [@tabrizi-ikhtiyarat، ج3 ص1588]."
