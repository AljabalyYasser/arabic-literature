explained: false
first: "وعِيسٍ بَرَيْناها كَأَنَّ عُيُونَها"
second: "قَوارِيرُ فِي أَدْهانِهِنَّ نُضُوبُ"
vocabulary:
  - term: "عِيسٍ"
    text: "«إبل تعلو بياضها حمرة» [@tabrizi-ikhtiyarat، ج3 ص1583]."
  - term: "بَرَيْناها"
    text: "أهزلناها بطول السير، كما يُبرى العود."
  - term: "قَوارِيرُ فِي أَدْهانِهِنَّ نُضُوبُ"
    text: "غارت عيونها من التعب حتى صارت كأنها قوارير «فني الأكثر من أدهانها»، والنضوب: القلة [@tabrizi-ikhtiyarat، ج3 ص1583]."
