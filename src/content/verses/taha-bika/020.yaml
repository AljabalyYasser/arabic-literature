first: "لِتُبْلِغَنِي دارَ امْرِئٍ كانَ نائِيًا"
second: "فَقَدْ قَرَّبَتْنِي مِنْ نَداكَ قَرُوبُ"
vocabulary:
  - term: "نَداكَ"
    text: "عطاؤك."
  - term: "قَرُوبُ"
    text: "من قولهم: قربتُ الماء إذا طلبته، أي ناقة «جادّة في الطلب» [@tabrizi-ikhtiyarat، ج3 ص1587]، ويروي محقق شرح التِّبْرِيزِيّ عن الأَعْلَم أنه اسم ناقته [@tabrizi-ikhtiyarat، ج3 ص1587]."
