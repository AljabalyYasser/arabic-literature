explained: false
first: "فَأَوْرَدْتُهَا مَاءً كَأَنَّ جِمَامَهُ"
second: "مِنَ الأَجْنِ حِنَّاءٌ مَعًا وَصَبِيبُ"
vocabulary:
  - term: "جِمامَهُ"
    text: "ما اجتمع منه وكثر، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1585]."
  - term: "الأَجْنِ"
    text: "تغيّر الماء، كما يقول المحقق [@tabrizi-ikhtiyarat، ج3 ص1585]."
  - term: "حِنّاءٌ مَعًا وصَبِيبُ"
    text: "أي ماؤه من التغيّر كماء الحنّاء والصّبيب مجتمعين، والصبيب: «شجر يكون بالحجاز، يُصبغ به، ويُخضب به الرأس» [@tabrizi-ikhtiyarat، ج3 ص1585]."
