first: "فَلَا تَحْرِمَنِّي نَائِلًا عَنْ جَنَابَةٍ"
second: "فَإِنِّي امْرُؤٌ وَسْطَ القِبَابِ غَرِيبُ"
vocabulary:
  - term: "نائِلًا"
    text: "عطاءً، «وأراد بالنائل إطلاق أخيه شأس من سجنه» [@lisan، ج1 ص277]."
  - term: "عَنْ جَنابَةٍ"
    text: "«أي بُعْد وغُربة» [@lisan، ج1 ص277]."
  - term: "القِبابِ"
    text: "قباب الملك وخيامه."
