explained: false
first: "وناجِيَةٍ أَفْنَى رَكِيبَ ضُلُوعِها"
second: "وحارِكَها تَهَجُّرٌ فَدُؤُوبُ"
vocabulary:
  - term: "ناجِيَةٍ"
    text: "الناقة السريعة، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1585]."
  - term: "رَكِيبَ ضُلُوعِها"
    text: "«ما ركب ضلوعها من الشحم واللحم» [@tabrizi-ikhtiyarat، ج3 ص1584]."
  - term: "حارِكَها"
    text: "«ملتقى الكتفين في مقدم السنام» [@tabrizi-ikhtiyarat، ج3 ص1584]."
  - term: "تَهَجُّرٌ فَدُؤُوبُ"
    text: "التهجّر: السير في الهاجرة، والدؤوب: الإلحاح في السير، كما يقول المحقق [@tabrizi-ikhtiyarat، ج3 ص1585]."
