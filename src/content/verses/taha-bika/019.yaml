explained: false
first: "إِلَيْكَ أَبَيْتَ اللَّعْنَ كَانَ وَجِيفُهَا"
second: "بِمُشْتَبِهَاتٍ هَوْلُهُنَّ مَهِيبُ"
vocabulary:
  - term: "أَبَيْتَ اللَّعْنَ"
    text: "«كلمة كانت العرب تحيّي بها ملوكها في الجاهلية»، معناها: أبيت أيها الملك أن تأتي ما تُلعن عليه [@lisan، ج13 ص387]."
  - term: "وَجِيفُها"
    text: "سيرها السريع، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1587]."
  - term: "مُشْتَبِهاتٍ"
    text: "«الفيافي التي لا أعلام بها، وطرقها تشتبه على المارة» [@tabrizi-ikhtiyarat، ج3 ص1587]."
