explained: false
first: "فَأَدَّتْ بَنُو كَعْبِ بْنِ عَوْفٍ رَبِيبَها"
second: "وغُودِرَ فِي بَعْضِ الجُنُودِ رَبِيبُ"
vocabulary:
  - term: "رَبِيبَها"
    text: "قال الأَصْمَعِيّ: ربيب بني عوف الحارث بن أبي شَمِر، «آب ظافرا» [@tabrizi-ikhtiyarat، ج3 ص1591]."
  - term: "غُودِرَ ... رَبِيبُ"
    text: "تُرك؛ والربيب المغادَر عند الأَصْمَعِيّ المُنْذِر بن ماء السماء، قُتل ولم يحفظه قومه [@tabrizi-ikhtiyarat، ج3 ص1591]. وينقل محقق شرح التِّبْرِيزِيّ عن الأَعْلَم أنه يعني أخاه شَأْسًا، «ومعنى غودر: ترك في الأسرى» [@tabrizi-ikhtiyarat، ج3 ص1591]."
