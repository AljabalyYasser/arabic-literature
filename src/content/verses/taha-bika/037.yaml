first: "كَأَنَّهُمُ صَابَتْ عَلَيْهِمْ سَحَابَةٌ"
second: "صَوَاعِقُهَا لِطَيْرِهِنَّ دَبِيبُ"
vocabulary:
  - term: "صابَتْ"
    text: "«من الصوب، وهو المطر» [@tabrizi-ikhtiyarat، ج3 ص1596]."
  - term: "لِطَيْرِهِنَّ دَبِيبُ"
    text: "الطير التي تصيبها هذه الصواعق «لا تستطيع أن تنهض فتطير، من الفزع» [@tabrizi-ikhtiyarat، ج3 ص1596]، فتدبّ على الأرض."
