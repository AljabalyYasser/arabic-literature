first: "إِذَا غَابَ عَنْهَا البَعْلُ لَمْ تُفْشِ سِرَّهُ"
second: "وَتُرْضِي إِيَابَ البَعْلِ حِينَ يَؤُوبُ"
meaning: "إذا غاب عنها زوجها لم تكشف شيئًا من سرّه، ولم تتحدث بما يجري بينهما في الفراش، وإذا رجع من غيبته وجد منها ما يُرضيه."
vocabulary:
  - term: "البَعْلُ"
    text: "الزوج."
  - term: "لَمْ تُفْشِ سِرَّهُ"
    text: "لم تُذِعه، «أي: لم تحدّث عنه بفاحشة» [@tabrizi-ikhtiyarat، ج3 ص1578]. وفي السرّ عند التِّبْرِيزِيّ وجهان: «يجوز أن يكون ضدّ العلانية، ويجوز أن يكون النكاح خاصّة، أي: تصون سرّه عندها» [@tabrizi-ikhtiyarat، ج3 ص1579]. والنكاح هنا الجماع: لا تحكي لأحد شيئًا مما يكون بينها وبين زوجها في الفراش."
  - term: "إِيابَ ... يَؤُوبُ"
    text: "الإياب: الرجوع، ويؤوب: يرجع."
context: "من صفة ليلى التي بدأ بها القصيدة: «منعّمة» عليها رقيب (البيت 3)، ثم أمينة على زوجها في غيبته وحضوره. فهي امرأة متزوجة، والغزل فيها غزل بالبعيدة الممتنعة، وهو ما يبرّر انصرافه عنها بعد قليل إلى الحكمة ثم إلى الرحلة. وفي «الاختيارين» يأتي قبله البيت السابع، كما يذكر محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1578]."
syntax:
  - "«إذا» ظرف لما يُستقبل من الزمان متضمّن معنى الشرط، وجملة «غاب عنها البعل» في محل جر بالإضافة، و«لم تفش سرّه» جواب الشرط لا محل له."
  - "«وتُرضي» معطوف على «لم تفش»، وفاعله ضمير المرأة، ومفعوله محذوف هو البعل، كما يدلّ تفسير التِّبْرِيزِيّ: «أي: تُرضي البعل، في غيبته، وأوبته» [@tabrizi-ikhtiyarat، ج3 ص1578]. و«إيابَ» على هذا مصدر منصوب نائب عن ظرف الزمان، أي: وقت إيابه، و«حين يؤوب» توكيد له."
  - "وعلى رواية الديوان «وتَرْضَى» يكون «إيابَ» مفعولًا به: ترضى رجوعه وتفرح به."
morphology:
  - "«تُفْشِ» مضارع «أفشى» على «أفعل»، مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة."
  - "«إياب» مصدر «آب» على «فِعال»، و«يؤوب» مضارع أجوف واويّ."
  - "«البَعْل» اسم جامد، وجمعه بُعُولة."
rhetoric:
  thesis: "يمدح المرأة بالأمانة في غيبة الزوج وبحسن الصحبة في حضوره، فحسنها عنده خُلُق قبل أن يكون جسدًا."
  devices:
    - title: "الكناية في «لم تفش سرّه»"
      text: "في «لم تفش سرّه» كناية عن عفّتها وكتمانها: لم يقل إنها عفيفة، بل ذكر ما يلزم العفّة من صون سرّ الزوج. فإن حُمل السرّ على النكاح كما يجيز التِّبْرِيزِيّ، صارت الكناية أدقّ: لا تتحدث بما يكون بينها وبين زوجها. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المقابلة بين «غاب» و«إياب»"
      text: "قابل بين «غاب» في الصدر و«إياب... يؤوب» في العجز، فاستوعب حاليها مع زوجها: غائبًا وحاضرًا. وكرّر لفظ «البعل» في الشطرين ليبقى الزوج حاضرًا في صورتها. وهذه قراءتنا."
  connection: "ثم يلتفت إليها مخاطبًا: لا تسوّي بيني وبين الضعيف المغمور."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة المردفة"
  scansion: "إِذَا غَا / بَعَنْهَلْ بَعْ / لُلَمْ تُفْ / شِسِرْرَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَتُرْضِي / إِيَابَلْ بَعْ / لِحِينَ / يَؤُوبُو = فعولن / مفاعيلن / فعولُ / فعولن"
  note: "العروض مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضرب محذوف «فعولن» كسائر القصيدة [@atiq، ص30]. والقبض حذف الخامس الساكن، ودخل «فعولن» الثالثة في العجز. وتُشبَع ضمة الهاء في «سرّهُ» فتُنطق «سِرْرَهُو»."
