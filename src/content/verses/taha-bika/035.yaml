first: "كَأَنَّ رِجالَ الأَوْسِ تَحْتَ لَبانِهِ"
second: "وما جَمَعَتْ جَلٌّ مَعًا وعَتِيبُ"
vocabulary:
  - term: "لَبانِهِ"
    text: "صدره؛ ويقول محقق شرح التِّبْرِيزِيّ: تحت وطأة الجيش، وقيل تحت صدر فرس الحارث [@tabrizi-ikhtiyarat، ج3 ص1595]."
  - term: "جَلٌّ ... وعَتِيبُ"
    text: "قبيلتان، و«عتيب من جذام» [@tabrizi-ikhtiyarat، ج3 ص1595]."
