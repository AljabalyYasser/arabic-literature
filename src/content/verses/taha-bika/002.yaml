explained: false
first: "يُكَلِّفُنِي لَيْلَى وَقَدْ شَطَّ وَلْيُهَا"
second: "وَعَادَتْ عَوَادٍ بَيْنَنَا وَخُطُوبُ"
vocabulary:
  - term: "يُكَلِّفُنِي"
    text: "الفاعل القلب، أي يكلّفني قلبي حبّ ليلى [@tabrizi-ikhtiyarat، ج3 ص1578]."
  - term: "شَطَّ وَلْيُها"
    text: "بَعُد قربها، والوَلْي: «عهدها» [@tabrizi-ikhtiyarat، ج3 ص1578]."
  - term: "عادَتْ عَوادٍ"
    text: "حالت بيننا الشواغل والموانع، كما يفسّرها محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1577]."
  - term: "خُطُوبُ"
    text: "أمور عظام."
