explained: false
first: "تَخَشْخَشُ أَبْدانُ الحَدِيدِ عَلَيْهِمُ"
second: "كَما خَشْخَشَتْ يُبْسَ الحَصادِ جَنُوبُ"
vocabulary:
  - term: "تَخَشْخَشُ"
    text: "تتصوّت [@tabrizi-ikhtiyarat، ج3 ص1594]."
  - term: "أَبْدانُ الحَدِيدِ"
    text: "«الدروع والجواشن، وما يجري مجراها» [@tabrizi-ikhtiyarat، ج3 ص1594]."
  - term: "يُبْسَ الحَصادِ"
    text: "اليابس من النبت؛ شبّه قعقعة السلاح «بصوت يبيس الكلأ، وقد هبّت الريح عليه» [@tabrizi-ikhtiyarat، ج3 ص1595]."
