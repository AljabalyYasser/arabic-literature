first: "وَأَنْتَ امْرُؤٌ أَفْضَتْ إِلَيْكَ أَمَانَتِي"
second: "وَقَبْلَكَ رَبَّتْنِي فَضِعْتُ رُبُوبُ"
vocabulary:
  - term: "أَفْضَتْ إِلَيْكَ أَمانَتِي"
    text: "«صار إليك، من أمري، ما أمنت معه الضياع» [@tabrizi-ikhtiyarat، ج3 ص1590]."
  - term: "رَبَّتْنِي ... رُبُوبُ"
    text: "«أي: ملكتني قبلك ملوك وأرباب، فضعت، حتى صرت إليك» [@tabrizi-ikhtiyarat، ج3 ص1590]."
