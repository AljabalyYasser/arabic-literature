first: "أَقِيمُوا بَنِي أُمِّي صُدُورَ مَطِيِّكُمْ"
second: "فَإِنِّي إِلَى قَوْمٍ سِوَاكُمْ لَأَمْيَلُ"
meaning: "يا بني أمي، انهضوا بمطاياكم وجِدّوا في السير، فإني مفارقكم إلى قوم غيركم، وقلبي مائل إليهم."
vocabulary:
  - term: "أَقِيمُوا صُدُورَ مَطِيِّكُمْ"
    text: "جِدّوا في السير، «يقال: أقام صدر مطيته. إذا جد في السير وكذلك إذا جد في أمر كان» [@khizana، ج3 ص341]."
  - term: "بَنِي أُمِّي"
    text: "إخوته وقومه، «وأضاف الأبناء إلى الأم لأنها أشد شفقة» [@khizana، ج3 ص341]."
  - term: "المَطِيّ"
    text: "جمع مطيّة، وهي الدابة التي يُركب ظهرها."
  - term: "سِوَاكُمْ"
    text: "غيركم، وهي هنا «صفة (لقوم) في موضع جر» [@ukbari-lamiyya، ص58]."
  - term: "لَأَمْيَلُ"
    text: "لمائل، «أفعل بمعنى فاعل، كما جاء أكبر بمعنى كبير» [@ukbari-lamiyya، ص58]."
context: "مطلع «لامية العرب»، وهي من أشهر قصائد الجاهلية وأكثرها شروحًا، وعدّتها عند البَغْداديّ «ثمانية وستون بيتا» [@khizana، ج3 ص341]. وفي نسبتها خلاف قديم: روى أبو عليّ القالِيّ في سياق كلامه على خَلَف الأحمر: «حدثني أبو بكر بن دريد أن القصيدة المنسوبة إلى الشنفرى التى أولها» هذا البيت «له» [@qali، ج1 ص156]، أي لخلف. والبيت خطاب من الشاعر لقومه يعلن فيه مفارقتهم، وعليه تقوم القصيدة كلها: رجل يترك أهله إلى الصحراء ووحوشها."
syntax:
  - "«أقيموا» فعل أمر وفاعله واو الجماعة، و«صدورَ» مفعول به، و«مطيِّكم» مضاف إليه."
  - "«بني أمي» منادى منصوب بحرف نداء محذوف، والتقدير: يا بني أمي [@khizana، ج3 ص341]."
  - "الفاء في «فإني» تعليلية، وفيها «تنبيها على أن ما قبلها علة لما بعدها» [@ukbari-lamiyya، ص57]: أمرهم بالرحيل لأنه هو راحل عنهم."
  - "«إلى قوم» تتعلق بـ«أميل» «لما فيها من معنى الفعل، ولم يمنع من ذلك لام التوكيد لأنها مؤكدة لمعنى الفعل» [@ukbari-lamiyya، ص59]، و«لأميل» خبر «إنّ» دخلت عليه اللام المزحلقة."
morphology:
  - "«أَمْيَل» على وزن «أفعل»، لكنه هنا ليس للتفضيل، يقول العُكْبَرِيّ: «وليس المعنى أنى أكثر ميلا منكم» [@ukbari-lamiyya، ص58]."
  - "«مَطِيّ» جمع «مَطِيّة» على «فَعِيلة»، من المَطا وهو الظهر."
  - "«أقيموا» من «أقام» على «أفعل»، وأصله «أَقْوِموا»، نُقلت كسرة الواو إلى القاف وقُلبت الواو ياء."
rhetoric:
  thesis: "مطلع يقلب العادة: الشاعر هو الذي يرحل، وقومه هم المأمورون بالقيام. فالبيت إعلان قطيعة بين الفرد وجماعته في أول كلمة."
  devices:
    - title: "الكناية في «أقيموا صدور مطيكم»"
      text: "لم يقل: ارحلوا أو جِدّوا، بل ذكر رفع صدور المطايا، وهو ما يلزم الجِدّ في السير، فدلّ به عليه، وهذا معنى الكناية عند عبد القاهر: أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "التعريض في «بني أمي»"
      text: "ينادي إخوته بأقرب نسب، ثم يعلن أنه يميل إلى غيرهم، فالقرابة المذكورة تزيد القطيعة حدّة. ويقول البَغْداديّ إنه «يؤذن قومه بالرحيل وأن غفلتهم عنه توجب مفارقتهم» [@khizana، ج3 ص341]."
    - title: "المقابلة بين «بني أمي» و«قوم سواكم»"
      text: "في الصدر أقرب الناس نسبًا، وفي العجز قوم غرباء لا يسمّيهم، والشاعر يختار الغرباء. فالبيت قائم على هذا التقابل، والقصيدة ستكشف بعد بيتين أن «القوم» وحوش الصحراء. وهذه قراءتنا."
  connection: "ثم يعلّل الرحيل: فقد قُدّرت الحاجات، والليل مضيء، والمطايا مشدودة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية، ومنها اسمها «لامية العرب»"
  scansion: "أَقِي مُو / بَنِي أُمْ مِي / صُدُو رَ / مَطِي يِ كُمْ = فعولن / مفاعيلن / فعولُ / مفاعلن — فَإِنْ نِي / إِلَى قَوْ مِنْ / سِوَا كُمْ / لَأَمْ يَ لُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. وتُشبَع ضمة اللام في آخر البيت فتُنطق «لُو». ودخل القبض «فعولن» الثانية في الصدر «صُدُورَ» فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
