explained: false
first: "وَلَكِنَّ نَفْسًا مُرَّةً لَا تُقِيمُ بِي"
second: "عَلَى الذَّامِ إِلَّا رَيْثَمَا أَتَحَوَّلُ"
vocabulary:
  - term: "مُرَّةً"
    text: "أبيّة لا تلين على الضيم، و«مرّة صفة نفس بمعنى أبيّة» [@khizana، ج9 ص192]."
  - term: "رَيْثَمَا"
    text: "قدرَ ما، «وريث في الأصل مصدر راث أي: أبطأ استعمل هنا للظرف الزماني أي: إلا بمقدار تحوّلي» [@khizana، ج9 ص193]."
  - term: "الذَّامِ"
    text: "العيب، «الذام: العيب يهمز ولا يهمز» [@khizana، ج9 ص192]."
