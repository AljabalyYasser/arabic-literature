first: "وَأَغْدُو عَلَى القُوتِ الزَّهِيدِ كَمَا غَدَا"
second: "أَزَلُّ تَهَادَاهُ التَّنَائِفُ أَطْحَلُ"
meaning: "وأخرج في الصباح على قليل من الطعام، كما يخرج ذئب خفيف الوركين، أغبر اللون، تتقاذفه الفلوات من واحدة إلى أخرى."
vocabulary:
  - term: "أَغْدُو"
    text: "أخرج غُدوة، «وهي ما بين صلاة الصبح وطلوع الشمس هذا أصله ثم كثر حتى استعمل في الذهاب أي وقت كان» [@khizana، ج9 ص194]."
  - term: "الزَّهِيدِ"
    text: "«القليل» [@ukbari-lamiyya، ص93]."
  - term: "أَزَلُّ"
    text: "«الذئب الأرسح بالمهملات أي: القليل لحم الفخذين» [@khizana، ج9 ص194]."
  - term: "تَهَادَاهُ"
    text: "«تتخذه هدية كلما خرج من تنوفة ودخل في أخرى» [@khizana، ج9 ص194]."
  - term: "التَّنَائِفُ"
    text: "«جمع تنوفة وهي الفلاة» [@khizana، ج9 ص194]."
  - term: "أَطْحَلُ"
    text: "«في لونه كدرة» [@ukbari-lamiyya، ص93]، و«الطُّحْلة لون بين الغبرة والبياض بسواد قليل كلون الرماد، ذئب أطحل» [@lisan، ج11 ص399]."
context: "بداية أشهر لوحات القصيدة: الذئب الجائع. يشبّه الشاعر نفسه بالذئب في بيت واحد، ثم يترك نفسه ويتبع الذئب في عشرة أبيات: يعدو في الريح، ولا يجد قوتًا، فيعوي فتجيبه ذئاب جائعة مثله، ثم يشكو ويشكون ويصبر ويصبرون."
syntax:
  - "«على» في «على القوت» «للتعليل بمعنى اللام» عند البَغْداديّ [@khizana، ج9 ص194]."
  - "«كما» «نعت لمصدر محذوف أي (غدوا كغدو الأزل)» [@ukbari-lamiyya، ص93]، و«ما» مصدرية."
  - "«تهاداه» نعت لـ«أزلّ»، و«أطحل» نعت ثانٍ [@ukbari-lamiyya، ص93]، و«تهاداه» «مضارع محذوف من أوله التاء وأصله تتهاداه. ويجوز أن يكون ماضيا» [@khizana، ج9 ص194]."
morphology:
  - "«أزلّ» و«أطحل» على «أفعل» في الصفات، و«أزل لا ينصرف للوصف ووزن الفعل» [@ukbari-lamiyya، ص93]."
  - "«تَهادى» على «تفاعل»، وفيه معنى التبادل: كل فلاة تدفعه إلى الأخرى."
  - "«تنائف» على «فعائل» جمع «تَنُوفة» على «فَعُولة»، وهو ممنوع من الصرف لأنه على صيغة منتهى الجموع."
rhetoric:
  thesis: "الشاعر يرى نفسه في الذئب: كلاهما يخرج جائعًا إلى أرض لا تعطيه شيئًا. والتشبيه باب إلى لوحة كاملة يصبح فيها الذئب صورة الصعلوك."
  devices:
    - title: "التمثيل"
      text: "لم يشبه الشاعر نفسه بالذئب في صفة واحدة، بل في حال كاملة: الخروج صباحًا، وقلة الزاد، والتنقل بين الفلوات. وهذا تشبيه تمثيلي، يقول عبد القاهر: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "الاستعارة في «تهاداه التنائف»"
      text: "جعل الفلوات تتهادى الذئب كما يتهادى الناس الهدايا، فأعطاها فعل الإنسان. وهي استعارة على ما يصفه عبد القاهر: «وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الاستطراد"
      text: "التشبيه في هذا البيت يفتح وصفًا طويلًا للذئب وصحبه، يستقل حتى ينسى السامع أنه بدأ مشبَّهًا به. وهذه قراءتنا."
  connection: "ثم يتبع الذئب: «غدا طاويًا يعارض الريح هافيًا يخوت بأذناب الشعاب ويعسل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية، ومنها اسمها «لامية العرب»"
  scansion: "وَأَغْ دُو / عَلَلْ قُو تِزْ / زَهِي دِ / كَمَا غَ دَا = فعولن / مفاعيلن / فعولُ / مفاعلن — أَزَلْ لُ / تَهَا دَا هُتْ / تَنَا ءِ / فُ أَطْ حَ لُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. وتُشبَع ضمة اللام في آخر البيت فتُنطق «لُو». ودخل القبض «فعولن» في «زهيدِ» و«أزلُّ» و«تنائِ» فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
