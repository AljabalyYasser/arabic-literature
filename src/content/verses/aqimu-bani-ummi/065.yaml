first: "وَخَرْقٍ كَظَهْرِ التُّرْسِ قَفْرٍ قَطَعْتُهُ"
second: "بِعَامِلَتَيْنِ ظَهْرُهُ لَيْسَ يُعْمَلُ"
vocabulary:
  - term: "خَرْقٍ"
    text: "«الواسع» [@ukbari-lamiyya، ص143]، أي فلاة واسعة."
  - term: "كَظَهْرِ التُّرْسِ"
    text: "«من استوائه» [@ukbari-lamiyya، ص143]."
  - term: "بِعَامِلَتَيْنِ"
    text: "«يعني رجليه» [@ukbari-lamiyya، ص143]."
  - term: "ظَهْرُهُ لَيْسَ يُعْمَلُ"
    text: "لا يُسلك ولا يُركب."
