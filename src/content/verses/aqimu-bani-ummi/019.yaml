explained: false
first: "وَلَسْتُ بِمِحْيَارِ الظَّلَامِ إِذَا انْتَحَتْ"
second: "هُدَى الهَوْجَلِ العِسِّيفِ يَهْمَاءُ هَوْجَلُ"
vocabulary:
  - term: "مِحْيَارِ الظَّلَامِ"
    text: "كثير الحَيْرة في الظلام، و«محيار: من الحيرة» [@ukbari-lamiyya، ص81]."
  - term: "انْتَحَتْ"
    text: "«قصدت واعترضت» [@ukbari-lamiyya، ص81]."
  - term: "الهَوْجَلِ العِسِّيفِ"
    text: "«الهوجل: البليد. والعسيف: السائر على غير هدى» [@ukbari-lamiyya، ص81]."
  - term: "يَهْمَاءُ هَوْجَلُ"
    text: "فلاة «لا عَلَم بها»، والهوجل الثاني «الشديد المسلك المهول» [@ukbari-lamiyya، ص81]."
sources:
