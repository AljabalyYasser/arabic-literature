first: "وَلِي دُونَكُمْ أَهْلُونَ سِيدٌ عَمَلَّسٌ"
second: "وَأَرْقَطُ زُهْلُولٌ وَعَرْفَاءُ جَيْأَلُ"
meaning: "ولي أهل غيركم: ذئب سريع، ونمر أملس، وضبع طويلة العُرف. هؤلاء أهلي بدلًا منكم."
vocabulary:
  - term: "دُونَكُمْ"
    text: "غيركم، «ودون هنا: بمعنى غير» [@khizana، ج8 ص56]."
  - term: "سِيدٌ"
    text: "«الذئب» [@ukbari-lamiyya، ص61]، والسِّيد «مشترك بين الأسد والذئب ومراده الثاني» [@khizana، ج8 ص56]."
  - term: "عَمَلَّسٌ"
    text: "«القوي على السير السريع» [@khizana، ج8 ص56]."
  - term: "أَرْقَطُ"
    text: "«فيه سواد وبياض» [@ukbari-lamiyya، ص61]، «وأراد بالأرقط النمر» [@khizana، ج3 ص342]."
  - term: "زُهْلُولٌ"
    text: "«الأملس وقيل: الخفيف وهو من أوصاف النمر» [@khizana، ج8 ص56]."
  - term: "عَرْفَاءُ"
    text: "الضبع، «يقال للضبع عرفاء لكثرة شعر رقبتها» [@khizana، ج8 ص56]."
  - term: "جَيْأَلُ"
    text: "«من أسماء الضبع» [@ukbari-lamiyya، ص61]."
context: "بعد أن قال إن في الأرض منأى للكريم، يسمّي سكان هذه الأرض: الوحوش. ويقول البَغْداديّ: «التفات من الغيبة إلى الخطاب خاطب به أهله» [@khizana، ج8 ص56]، أي رجع إلى مخاطبة قومه بعد بيتي الحكمة."
syntax:
  - "«أهلون» مبتدأ مؤخر، و«لي» خبر مقدّم [@ukbari-lamiyya، ص61]."
  - "«دونكم» فيه وجهان عند العُكْبَرِيّ: صفة لـ«أهلين» بمعنى «غير» «فلما قدم صار حالا»، أو ظرف متعلق بما يتعلق به الجار [@ukbari-lamiyya، ص61]."
  - "«سِيدٌ» وما عُطف عليه بدل من «أهلون» عند العُكْبَرِيّ [@ukbari-lamiyya، ص62]، أو خبر لمبتدأ محذوف «أي: هم سيد وأرقط وعرفاء» عند البَغْداديّ [@khizana، ج8 ص56]."
  - "«جيألُ» بدل من «عرفاء»، وهو «غير منصرف للعلمية والتأنيث» [@khizana، ج3 ص342]."
morphology:
  - "«أَهْلُون» جمع «أهل» جمع مذكر سالمًا، وهو اسم جنس لا علَم ولا صفة، فجمعه على هذا الوجه قليل."
  - "«عَرْفاء» على «فَعْلاء» مؤنث «أعرف»، وهي «في الأصل صفة» [@ukbari-lamiyya، ص62]، ثم «غلبت حتى جرت مجرى الأسماء» [@ukbari-lamiyya، ص63]."
  - "«جَيْأَل» على «فَيْعَل» [@khizana، ج3 ص342]، علم جنس للضبع."
  - "«عَمَلَّس» على «فَعَلَّل» بتشديد اللام الأولى، و«زُهْلُول» على «فُعْلُول»."
rhetoric:
  thesis: "الشاعر يستبدل بقبيلته الوحوش، فيعطيها اسم الأهل، ثم يصفها كما يُوصف الرجال: بالسرعة والقوة. فالبيت يقلب معنى الأهل."
  devices:
    - title: "الاستعارة في «أهلون»"
      text: "سمّى الذئب والنمر والضبع أهلًا، فأعار اسم الأهل لما ليس بأهل. والاستعارة عند عبد القاهر: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "التعريض"
      text: "في مدح الوحوش ذمّ لقومه، يقول البَغْداديّ: «وهذا تعريضٌ بعشيرته في أنهم لا حماية لهم كهذه الحيوانات» [@khizana، ج8 ص56]."
    - title: "التفصيل بعد الإجمال"
      text: "أجمل في «أهلون» ثم فصّل ثلاثة، ووصف كل واحد بصفة: الذئب «عملّس»، والنمر «أرقط زهلول»، والضبع «عرفاء جيأل». وهذه قراءتنا."
  connection: "ثم يبين لِمَ هم أهله: «هم الأهل لا مستودع السر ذائع لديهم، ولا الجاني بما جرّ يُخذل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية، ومنها اسمها «لامية العرب»"
  scansion: "وَلِي دُو / نَكُمْ أَهْ لُو / نَ سِي دُنْ / عَمَلْ لَ سُنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَأَرْ قَ / طُ زُهْ لُو لُنْ / وَعَرْ فَا / ءُ جَيْ أَ لُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. وتُشبَع ضمة اللام في آخر البيت فتُنطق «لُو». ودخل القبض «فعولن» الأولى في العجز «وأرقَ» فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
