explained: false
first: "إِذَا الأَمْعَزُ الصَّوَّانُ لَاقَى مَنَاسِمِي"
second: "تَطَايَرَ مِنْهُ قَادِحٌ وَمُفَلَّلُ"
vocabulary:
  - term: "الأَمْعَزُ الصَّوَّانُ"
    text: "«الأمعز: المكان الذي فيه حصى، والصوّان: الحجارة الملس» [@ukbari-lamiyya، ص83]."
  - term: "مَنَاسِمِي"
    text: "قدميّ، وأصل المناسم «أخفاف البعير» [@ukbari-lamiyya، ص83]."
  - term: "قَادِحٌ وَمُفَلَّلُ"
    text: "شرر يُقدح منه النار، وحجارة مكسَّرة؛ «والمفلّل: المكسَّر» [@ukbari-lamiyya، ص84]."
