first: "أَوِ الخَشْرَمُ المَبْعُوثُ حَثْحَثَ دَبْرَهُ"
second: "مَحَابِيضُ أَرْدَاهُنَّ سَامٍ مُعَسِّلُ"
vocabulary:
  - term: "الخَشْرَمُ"
    text: "«رئيس النحل» [@ukbari-lamiyya، ص98]."
  - term: "حَثْحَثَ دَبْرَهُ"
    text: "«حرّك وأزعج»، و«الدَّبْر: النحل» [@ukbari-lamiyya، ص98]."
  - term: "مَحَابِيضُ"
    text: "جمع مِحْبَض، «وهو العود مع مُشتار العسل» [@ukbari-lamiyya، ص98]."
  - term: "سَامٍ مُعَسِّلُ"
    text: "«الذي يسمو لطلب العسل» [@ukbari-lamiyya، ص98]."
