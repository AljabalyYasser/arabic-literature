first: "وَفِي الأَرْضِ مَنْأًى لِلْكَرِيمِ عَنِ الأَذَى"
second: "وَفِيهَا لِمَنْ خَافَ القِلَى مُتَعَزَّلُ"
meaning: "في الأرض مكان بعيد يبتعد إليه الكريم عن الأذى، وفيها موضع يعتزل فيه من يخاف البغض."
vocabulary:
  - term: "مَنْأًى"
    text: "«مبتعد» [@ukbari-lamiyya، ص60]، و«المنأى: اسم مكان من نأى أي: بعد» [@khizana، ج3 ص342]."
  - term: "القِلَى"
    text: "«البغض» [@khizana، ج3 ص342]."
  - term: "مُتَعَزَّلُ"
    text: "«منتحى» [@ukbari-lamiyya، ص60]، و«اسم مكان من تعزله بمعنى اعتزله» [@khizana، ج3 ص342]."
context: "بعد أن أعلن الرحيل وعلّله بالحاجات، يرفع الأمر إلى حكمة عامة: الأرض واسعة، فلا يلزم الكريم أن يقيم حيث يُؤذى. وهو أكثر أبيات القصيدة دورانًا مَثَلًا."
syntax:
  - "«وفي الأرض» جار ومجرور متعلق بمحذوف خبر مقدّم، و«منأى» مبتدأ مؤخر مرفوع بضمة مقدّرة على الألف المحذوفة لالتقاء الساكنين."
  - "«للكريم» متعلق بمحذوف صفة لـ«منأى»، و«عن الأذى» متعلق بـ«منأى» نفسه لأنه من «نأى» [@khizana، ج3 ص342]."
  - "«وفيها» خبر مقدّم، و«متعزَّل» مبتدأ مؤخر، و«لمن خاف القلى» متعلق بمحذوف صفة أو حال، و«مَن» موصولة وصلتها «خاف القلى»."
morphology:
  - "«مَنْأًى» على «مَفْعَل» اسم مكان من «نأى ينأى»، وأصله «مَنْأَيٌ» فقُلبت الياء ألفًا ثم حُذفت مع التنوين."
  - "«مُتَعَزَّل» على «مُتَفَعَّل» بفتح العين، اسم مكان من «تعزّل»، ولو كسرها لكان اسم فاعل."
  - "«القِلَى» مصدر «قلاه يقليه» إذا أبغضه، يُكسر فيُقصر، «وإن فتحتها مددت» {K(3,342)}."
rhetoric:
  thesis: "البيت يجعل الرحيل عن القوم خُلُقًا للكريم لا هزيمة: الأرض أوسع من القبيلة، والكرامة أولى من المقام."
  devices:
    - title: "تقديم الخبر"
      text: "قدّم «وفي الأرض» و«وفيها» على المبتدأ، لأن السعة في الأرض هي ما يريد أن يُثبته. ويقول عبد القاهر في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "التقسيم والموازنة"
      text: "شطران متوازيان: «وفي الأرض منأى للكريم عن الأذى» و«وفيها لمن خاف القلى متعزَّل»، في كل منهما مكان، وصاحبه، وما يفرّ منه. فالأذى يقابله القِلى، والمنأى يقابله المتعزَّل. وهذه قراءتنا."
    - title: "إرسال الحكمة"
      text: "خرج البيت من حال الشاعر إلى قاعدة عامة لا يختص بها أحد، فلذلك صار يُتمثّل به منفصلًا عن القصيدة. وهذه قراءتنا."
  connection: "ثم يؤكد المعنى بالقسم: «لعمرك ما بالأرض ضيق على امرئ سرى راغبًا أو راهبًا وهو يعقل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية، ومنها اسمها «لامية العرب»"
  scansion: "وَفِلْ أَرْ / ضِ مَنْ أَنْ لِلْ / كَرِي مِ / عَنِلْ أَ ذَى = فعولن / مفاعيلن / فعولُ / مفاعلن — وَفِي هَا / لِمَنْ خَا فَلْ / قِلَى مُ / تَعَزْ زَ لُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. وتُشبَع ضمة اللام في آخر البيت فتُنطق «لُو». ودخل القبض «فعولن» الثالثة في الشطرين «كريمِ» و«قِلى مُ» فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
