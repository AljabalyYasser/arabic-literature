first: "وَضَافٍ إِذَا هَبَّتْ لَهُ الرِّيحُ طَيَّرَتْ"
second: "لَبَائِدَ عَنْ أَعْطَافِهِ مَا تُرَجَّلُ"
vocabulary:
  - term: "ضَافٍ"
    text: "«السابغ، يعني شعره» [@ukbari-lamiyya، ص141]."
  - term: "لَبَائِدَ"
    text: "«جمع لبيدة، وهو ما تلبّد من شعره» [@ukbari-lamiyya، ص141]."
  - term: "أَعْطَافِهِ"
    text: "جوانبه."
  - term: "تُرَجَّلُ"
    text: "«يُسرَّح ويُدهن» [@ukbari-lamiyya، ص141]."
