first: "ثَلَاثَةُ أَصْحَابٍ فُؤَادٌ مُشَيَّعٌ"
second: "وَأَبْيَضُ إِصْلِيتٌ وَصَفْرَاءُ عَيْطَلُ"
meaning: "يكفيني عن الناس ثلاثة أصحاب: قلب شجاع لا يتردد، وسيف أبيض مجرّد من غمده، وقوس صفراء طويلة."
vocabulary:
  - term: "مُشَيَّعٌ"
    text: "«مقدام، كأنه في شيعته» [@ukbari-lamiyya، ص72]، أي كأن معه أنصارًا يشجعونه."
  - term: "أَبْيَضُ"
    text: "السيف، سُمّي بلونه."
  - term: "إِصْلِيتٌ"
    text: "«سيف مجرد من غمده» [@ukbari-lamiyya، ص72]."
  - term: "صَفْرَاءُ"
    text: "«قوس من نبع» [@ukbari-lamiyya، ص72]، والنَّبع شجر تُتّخذ منه القسيّ، ولونه أصفر."
  - term: "عَيْطَلُ"
    text: "«الطويلة» [@ukbari-lamiyya، ص72]."
context: "يأتي بعد قوله «وإني كفاني فَقْدَ مَن ليس جازيًا بحسنى ولا في قربه متعلَّل»: فالشاعر لا يأسف على من لا يكافئ ولا يُؤنس، لأن له ثلاثة أصحاب يكفونه. ثم يقف عند القوس فيصفها في البيتين التاليين."
syntax:
  - "«ثلاثةُ أصحابٍ» فاعل «كفاني» في البيت السابق [@ukbari-lamiyya، ص72]، وهو تضمين: لا يتم معنى البيت الأول إلا بالثاني."
  - "«فؤادٌ» فيه وجهان: «هو وما بعده من المعطوفات بدل من (ثلاثة) تقديره: كفاني فؤاد وأبيض وصفراء»، أو «خبر مبتدأ محذوف» تقديره: أحدها فؤاد، وثانيها أبيض، وثالثها صفراء [@ukbari-lamiyya، ص72]."
  - "«مشيَّعٌ» صفة لـ«فؤاد»، و«إصليت» صفة لـ«أبيض»، و«عيطل» صفة لـ«صفراء»."
  - "«صفراء» ممنوعة من الصرف لألف التأنيث الممدودة، ورُفعت هنا بالعطف على «فؤاد»."
morphology:
  - "«مُشَيَّع» اسم مفعول من «شيّع» على «فعّل»، والتشييع: المصاحبة والتقوية."
  - "«إِصْلِيت» على «إِفْعِيل» من «صلت»، وهو من أوزان الصفات القليلة."
  - "«عَيْطَل» على «فَيْعَل»، و«أبيض» و«صفراء» على «أفعل» و«فعلاء» في الألوان."
rhetoric:
  thesis: "الصعلوك لا يحتاج إلى قبيلة: قلبه وسلاحه قوم كاملون. فالبيت يعيد تعريف الصحبة كما أعاد البيت الخامس تعريف الأهل."
  devices:
    - title: "الاستعارة في «أصحاب»"
      text: "سمّى القلب والسيف والقوس أصحابًا، فأعطاها صفة من يصحب ويُعين، على طريقة الاستعارة التي يصفها عبد القاهر: «وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الكناية عن الموصوف"
      text: "لم يقل: سيف وقوس، بل «أبيض» و«صفراء»، فذكر صفة لازمة لكل منهما ودلّ بها عليه. وهذا من الكناية التي يجيء فيها المتكلم إلى معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "الإجمال ثم التفصيل"
      text: "قال «ثلاثة أصحاب» فشوّق السامع إلى معرفتهم، ثم عدّهم واحدًا واحدًا، وبدأ بالقلب لأن السلاح لا ينفع بلا قلب. وهذه قراءتنا."
    - title: "التضمين"
      text: "البيت فاعل لفعل في البيت الذي قبله «وإني كفاني فقد من ليس جازيًا»، فلا يتم أحدهما إلا بالآخر [@ukbari-lamiyya، ص72]. والتضمين عند ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
  connection: "ثم يصف القوس وحدها: «هتوف من الملس المتون يزينها رصائع قد نيطت إليها ومحمل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية، ومنها اسمها «لامية العرب»"
  scansion: "ثَلَا ثَ / ةُ أَصْ حَا بِنْ / فُؤَا دُنْ / مُشَيْ يَ عُنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — وَأَبْ يَ / ضُ إِصْ لِي تُنْ / وَصَفْ رَا / ءُ عَيْ طَ لُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. وتُشبَع ضمة اللام في آخر البيت فتُنطق «لُو». ودخل القبض «فعولن» الأولى في الشطرين «ثلاثَ» و«وأبيَ» فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
