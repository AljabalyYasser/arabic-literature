first: "تَرُودُ الأَرَاوِي الصُّحْمُ حَوْلِي كَأَنَّهَا"
second: "عَذَارَى عَلَيْهِنَّ المُلَاءُ المُذَيَّلُ"
vocabulary:
  - term: "تَرُودُ"
    text: "«تذهب وتجيء» [@ukbari-lamiyya، ص145]."
  - term: "الأَرَاوِي"
    text: "إناث الوعول، و«الأراوي جمع أروى» [@ukbari-lamiyya، ص145]."
  - term: "الصُّحْمُ"
    text: "«الحُمر تضرب إلى السواد» [@ukbari-lamiyya، ص146]."
  - term: "المُلَاءُ المُذَيَّلُ"
    text: "الأردية الطويلة، و«المذيّل: الطويل الذيل» [@ukbari-lamiyya، ص146]."
