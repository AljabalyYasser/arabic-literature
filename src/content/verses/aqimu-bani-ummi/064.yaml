explained: false
first: "بَعِيدٍ بِمَسِّ الدُّهْنِ وَالفَلْيِ عَهْدُهُ"
second: "لَهُ عَبَسٌ عَافٍ مِنَ الغِسْلِ مُحْوِلُ"
vocabulary:
  - term: "الفَلْيِ"
    text: "تنقية الشعر من القمل."
  - term: "عَبَسٌ"
    text: "«ما تعلّق بأذيال الشاء من الأوضار» [@ukbari-lamiyya، ص142]، أي الوسخ."
  - term: "عَافٍ"
    text: "«كثير، يعني شعره» [@ukbari-lamiyya، ص142]."
  - term: "الغِسْلِ"
    text: "«ما يُغسل به الرأس» [@ukbari-lamiyya، ص142]."
  - term: "مُحْوِلُ"
    text: "«أتى عليه حَوْل» [@ukbari-lamiyya، ص142]."
sources:
