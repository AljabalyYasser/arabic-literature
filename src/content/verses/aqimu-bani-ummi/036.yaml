explained: false
first: "وَتَشْرَبُ أَسْآرِي القَطَا الكُدْرُ بَعْدَمَا"
second: "سَرَتْ قَرَبًا أَحْنَاؤُهَا تَتَصَلْصَلُ"
vocabulary:
  - term: "أَسْآرِي"
    text: "بقايا شرابي، و«الأسآر: جمع سُؤر، أراد به البقية في الإناء. يقول: أنا أرد الماء قبل القطا لسرعتها» [@ukbari-lamiyya، ص105]."
  - term: "الكُدْرُ"
    text: "ضرب من القطا في لونه كُدرة."
  - term: "قَرَبًا"
    text: "سير الليل إلى الماء."
  - term: "أَحْنَاؤُهَا تَتَصَلْصَلُ"
    text: "«الأحناء: الجوانب، وتتصلصل: تصوِّت» [@ukbari-lamiyya، ص105]."
sources:
