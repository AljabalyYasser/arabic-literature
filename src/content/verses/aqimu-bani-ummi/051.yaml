first: "وَأُعْدِمُ أَحْيَانًا وَأَغْنَى وَإِنَّمَا"
second: "يَنَالُ الغِنَى ذُو البُعْدَةِ المُتَبَذِّلُ"
vocabulary:
  - term: "أُعْدِمُ"
    text: "أفتقر."
  - term: "البُعْدَةِ"
    text: "«البُعد» [@ukbari-lamiyya، ص123]، أي الذي يضرب في الأرض بعيداً."
  - term: "المُتَبَذِّلُ"
    text: "الذي يبذل نفسه ولا يصونها عن المشقة."
