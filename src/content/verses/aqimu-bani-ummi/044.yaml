first: "فَإِنْ تَبْتَئِسْ بِالشَّنْفَرَى أُمُّ قَسْطَلٍ"
second: "لَمَا اغْتَبَطَتْ بِالشَّنْفَرَى قَبْلُ أَطْوَلُ"
meaning: "إن كانت الحرب تحزن اليوم لفراق الشَّنْفَرَى، فلَمَا فرحت به من قبلُ أطول من حزنها عليه."
vocabulary:
  - term: "تَبْتَئِسْ"
    text: "«تلقى بؤسا من فراقه» [@ukbari-lamiyya، ص114]، و«لا تبتئس أي لا تحزن ولا تشتك» [@lisan، ج6 ص21]."
  - term: "أُمُّ قَسْطَلٍ"
    text: "الحرب، «والقسطل: الغبار. وأم قسطل الحرب» [@ukbari-lamiyya، ص114]."
  - term: "اغْتَبَطَتْ"
    text: "فرحت وسُرّت، والغبطة: حسن الحال والسرور."
context: "يأتي بعد وصف نومه على الأرض متوسّدًا ذراعه، فينتقل إلى نفسه فيذكرها باسمها، ويقدّر موته: إن حزنت الحرب لفقده فقد طال فرحها به. وبعده يصف نفسه طريدًا تلاحقه الجنايات."
syntax:
  - "«إنْ» شرطية، و«تبتئسْ» فعل الشرط مجزوم، و«أمُّ قسطل» فاعله."
  - "«لَمَا اغتبطت» «جواب قسم محذوف»، والشرط «موطيء للقسم»، و«جواب القسم أغنى عنه جواب الشرط» [@ukbari-lamiyya، ص114]، [@ukbari-lamiyya، ص115]."
  - "«ما» «بمعنى الذي، وهو مبتدأ، و(أطول) خبره. ويجوز أن تكون (ما) مصدرية» [@ukbari-lamiyya، ص114]، فيكون التقدير: لاغتباطها بالشنفرى قبلُ أطول [@ukbari-lamiyya، ص115]."
  - "«قبلُ» ظرف مبني على الضم لحذف المضاف إليه ونيّة معناه، والتقدير: قبل اليوم."
morphology:
  - "«تبتئس» على «تفتعل» من البؤس، و«اغتبطت» على «افتعلت» من الغبطة، فالوزنان متقابلان في الصدر والعجز."
  - "«أطول» على «أفعل» للتفضيل، وتمييزه محذوف مفهوم من السياق."
rhetoric:
  thesis: "الشاعر يرثي نفسه قبل موته، ويحسب حياته بما أعطى الحرب لا بما أخذ منها: فرحها به أطول من حزنها عليه."
  devices:
    - title: "الالتفات إلى الغيبة"
      text: "تكلم الشاعر عن نفسه بضمير المتكلم في القصيدة كلها، ثم ذكر اسمه «الشَّنْفَرَى» مرتين كأنه يتحدث عن غيره، فصار يرى نفسه من الخارج كما يراها الناس. وهذه قراءتنا."
    - title: "الكناية في «أم قسطل»"
      text: "لم يقل الحرب، بل «أم قسطل»، أي صاحبة الغبار، فذكر ما يلزمها ودلّ به عليها [@ukbari-lamiyya، ص114]. والكناية عند عبد القاهر أن يجيء المتكلم إلى معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "الطباق"
      text: "بين «تبتئس» و«اغتبطت»: الحزن والفرح، وبين الحاضر في «تبتئس» والماضي في «قبلُ». وهذه قراءتنا."
  connection: "ثم يصف نفسه: «طريد جنايات تياسرن لحمه، عقيرته لأيّها حُمّ أوّل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية، ومنها اسمها «لامية العرب»"
  scansion: "فَإِنْ تَبْ / تَئِسْ بِشْ شَنْ / فَرَى أُمْ / مُ قَسْ طَ لِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — لَمَغْ تَ / بَطَتْ بِشْ شَنْ / فَرَى قَبْ / لُ أَطْ وَ لُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. وتُشبَع ضمة اللام في آخر البيت فتُنطق «لُو». ودخل القبض «فعولن» الأولى في العجز «لَمَغْتَ» فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]. وتسقط همزة الوصل في «اغتبطت» في الدرج، فتتصل الميم بالغين."
