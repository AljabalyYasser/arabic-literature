first: "فَعَبَّتْ غِشَاشًا ثُمَّ مَرَّتْ كَأَنَّهَا"
second: "مَعَ الصُّبْحِ رَكْبٌ مِنْ أُحَاظَةَ مُجْفِلُ"
meaning: "فشربت القطا مسرعة شربًا قليلًا متتابعًا، ثم مضت مع الصبح كأنها جماعة من ركب أُحاظة يسرعون."
vocabulary:
  - term: "عَبَّتْ"
    text: "«تابعت الشرب» [@ukbari-lamiyya، ص111]، و«العَبُّ: شُرْبُ الماء من غير مصّ» [@lisan، ج1 ص572]."
  - term: "غِشَاشًا"
    text: "«القليل» [@ukbari-lamiyya، ص111]، أي شربًا قليلًا على عجل."
  - term: "رَكْبٌ"
    text: "جماعة الراكبين."
  - term: "أُحَاظَةَ"
    text: "«قبيلة من الأزد، وقيل: من اليمن» [@ukbari-lamiyya، ص111]."
  - term: "مُجْفِلُ"
    text: "«المسرع» [@ukbari-lamiyya، ص111]، و«أجفل القوم أي هربوا مسرعين» [@lisan، ج11 ص114]."
context: "خاتمة لوحة القطا: سبق الشاعرُ القطا إلى الماء فشرب، ثم جاءت تشرب بقيته، ثم طارت. وفي البيت اسم «أُحاظة»، وهو عند شوقي ضيف من أدلة الصنعة: يرى أن خَلَفًا «ساق فيها اسم موضع فى جنوبى اليمن هو إحاظة ليدل على أن قائلها كان يتجول فى هذه الأنحاء، وحتى يكون ذلك أدعى إلى تصديقها والثقة بها» [@deif، ج1 ص380]. والذي عند العُكْبَرِيّ أنها قبيلة من الأزد [@ukbari-lamiyya، ص111]، والشَّنْفَرَى أزديّ."
syntax:
  - "«غِشاشًا» فيه وجهان: «مفعول (عبت)» أي شربت شيئًا قليلًا، أو «حال، أي عبت عجلة» [@ukbari-lamiyya، ص111]."
  - "«كأنّ» وما عملت فيه «حال من الضمير في (مرت)» [@ukbari-lamiyya، ص111]."
  - "«مع الصبح» «ظرف (لمرت)، ويجوز أن يعمل فيها معنى (كأن)»، و«من أحاظة» «نعت (لركب)، وكذلك (مجفل)» [@ukbari-lamiyya، ص112]."
morphology:
  - "«عبّت» من «عبّ يعبّ» مضعّف، وأصله «عَبَبَتْ» فأُدغمت الباء في الباء."
  - "«غِشاش» على «فِعال»، من المصادر التي تأتي حالًا."
  - "«مُجْفِل» اسم فاعل من «أجفل» على «أفعل»، وجاء مفردًا مذكرًا لأنه صفة لـ«ركب»، وهو لفظ مفرد."
rhetoric:
  thesis: "القطا تشرب وتمضي بسرعة الخائف، والشاعر يراها ركبًا من البشر. فبعد أن صار الذئب صورته، صارت القطا صورة قافلة تسرع عند الصبح."
  devices:
    - title: "التشبيه في هيئة الحركة"
      text: "شبّه سرب القطا وهو ينطلق بعد الشرب بركب يُسرع مع الصبح، فالشبه في الحركة والجمع والوقت معًا. يقول عبد القاهر: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "التقابل بين الحالين"
      text: "صدر البيت شرب على عجل، وعجزه رحيل على عجل: «غِشاشًا» ثم «مُجفِل». فالسرعة تحكم البيت من أوله إلى آخره. وهذه قراءتنا."
    - title: "ذكر الموضع"
      text: "تسمية «أُحاظة» تعطي التشبيه مكانًا معروفًا، وهي عند شوقي ضيف حيلة من الصانع لتوهم السامع أن الشاعر طاف بتلك الأنحاء [@deif، ج1 ص380]."
  connection: "ثم يعود إلى نفسه ويصف نومه على الأرض: «وآلف وجه الأرض عند افتراشها بأهدأ تُنبيه سناسن قُحّل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية، ومنها اسمها «لامية العرب»"
  scansion: "فَعَبْ بَتْ / غِشَا شَنْ ثُمْ / مَ مَرْ رَتْ / كَأَنْ نَ هَا = فعولن / مفاعيلن / فعولن / مفاعلن — مَعَصْ صُبْ / حِ رَكْ بُنْ مِنْ / أُحَا ظَ / ةَ مُجْ فِ لُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. وتُشبَع ضمة اللام في آخر البيت فتُنطق «لُو». ودخل القبض «فعولن» الثالثة في العجز «أُحاظَ» فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
variants:
  - reading: "مِنْ إِحَاظَةَ"
    status: "رواية شوقي ضيف"
    note: "يكتبها «إحاظة» بكسر الهمزة ويجعلها «موضع فى جنوبى اليمن» [@deif، ج1 ص380]، وأثبتنا ضبط العُكْبَرِيّ وتفسيره [@ukbari-lamiyya، ص111]."
