first: "وَأَغْضَى وَأَغْضَتْ وَاتَّسَى وَاتَّسَتْ بِهِ"
second: "مَرَامِيلُ عَزَّاهَا وَعَزَّتْهُ مُرْمِلُ"
vocabulary:
