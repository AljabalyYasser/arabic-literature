    text: "أطبق جفنيه وسكت."
  - term: "اتَّسَى"
    text: "اقتدى وتعزّى."
  - term: "مَرَامِيلُ"
    text: "«الذين لا أقوات لهم» [@ukbari-lamiyya، ص101]."
  - term: "مُرْمِلُ"
    text: "فقير نفد زاده."
