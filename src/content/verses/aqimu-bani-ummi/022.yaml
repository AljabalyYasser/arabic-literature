explained: false
first: "وَأَسْتَفُّ تُرْبَ الأَرْضِ كَيْ لَا يَرَى لَهُ"
second: "عَلَيَّ مِنَ الطَّوْلِ امْرُؤٌ مُتَطَوِّلُ"
vocabulary:
  - term: "أَسْتَفُّ"
    text: "آكل التراب يابساً؛ «سففت الدواء وغيره من كل شيء يابس... هو أكله غير ملتوت» [@khizana، ج9 ص191]."
  - term: "الطَّوْلِ"
    text: "«مصدر طال على القوم يطول... إذا أفضل عليهم. وتطوّل: تفضّل» [@khizana، ج9 ص191]."
