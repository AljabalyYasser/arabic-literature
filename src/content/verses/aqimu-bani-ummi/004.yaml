first: "لَعَمْرُكَ مَا بِالأَرْضِ ضِيقٌ عَلَى امْرِئٍ"
second: "سَرَى رَاغِبًا أَوْ رَاهِبًا وَهْوَ يَعْقِلُ"
vocabulary:
  - term: "رَاغِبًا أَوْ رَاهِبًا"
    text: "طالباً لما يرغب فيه، أو هارباً مما يخافه؛ «يعني: أن من فارق أهله وسافر رغبة في أمر يطلبه أو خوفاً من شيء يجتنبه يرى سعة في حاله إن كان ممن يعقل» [@khizana، ج8 ص56]."
