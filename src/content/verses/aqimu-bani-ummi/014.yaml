explained: false
first: "وَلَسْتُ بِمِهْيَافٍ يُعَشِّي سَوَامَهُ"
second: "مُجَدَّعَةً سُقْبَانُهَا وَهْيَ بُهَّلُ"
vocabulary:
  - term: "مِهْيَافٍ"
    text: "«الذي يبعد بإبله طلب الرعي على غير علم، فيُعطشها» [@ukbari-lamiyya، ص75]."
  - term: "يُعَشِّي سَوَامَهُ"
    text: "يرعى إبله في العشيّ، أي متأخراً."
  - term: "مُجَدَّعَةً"
    text: "«السيئة الغذاء، وقيل: المقطوعات أطراف آذانها» [@ukbari-lamiyya، ص75]."
  - term: "سُقْبَانُهَا"
    text: "«الصغار من النوق» [@ukbari-lamiyya، ص75]."
  - term: "بُهَّلُ"
    text: "«لا صِرار عليها» [@ukbari-lamiyya، ص75]، أي لا يُشدّ على ضروعها فيرضعها أولادها."
sources:
  - source: "ukbari-lamiyya"
    loc: "ص75"
