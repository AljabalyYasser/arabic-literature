explained: false
first: "وَلَيْلَةِ نَحْسٍ يَصْطَلِي القَوْسَ رَبُّهَا"
second: "وَأَقْطُعَهُ اللَّاتِي بِهَا يَتَنَبَّلُ"
vocabulary:
  - term: "لَيْلَةِ نَحْسٍ"
    text: "ليلة شديدة البرد."
  - term: "يَصْطَلِي القَوْسَ رَبُّهَا"
    text: "يوقد صاحبُ القوس قوسَه ليتدفأ بها من شدة البرد."
  - term: "أَقْطُعَهُ"
    text: "سهامه، جمع قِطْع، وهو النصل القصير."
  - term: "يَتَنَبَّلُ"
    text: "يتخذها نبلاً."
sources:
  - source: "ukbari-lamiyya"
    loc: "ص126"
