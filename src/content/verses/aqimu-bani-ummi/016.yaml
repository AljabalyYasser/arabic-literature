explained: false
first: "وَلَا خَرِقٍ هَيْقٍ كَأَنَّ فُؤَادَهُ"
second: "يَظَلُّ بِهِ المُكَّاءُ يَعْلُو وَيَسْفُلُ"
vocabulary:
  - term: "خَرِقٍ"
    text: "متحيّر من الفزع؛ «وخرِق الرجل إذا بقي متحيّراً من همّ أو شدة» [@lisan، ج10 ص76]."
  - term: "هَيْقٍ"
    text: "طويل دقيق، «ولذلك سُمّي الظليم هيقاً» [@lisan، ج10 ص370]، والظليم ذكر النعام، وهو كثير النِّفار."
  - term: "المُكَّاءُ"
    text: "طائر صغير؛ يقول: كأن طائراً في قلبه يعلو ويسفل من الفزع."
