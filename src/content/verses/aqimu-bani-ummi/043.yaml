first: "وَأَعْدِلُ مَنْحُوضًا كَأَنَّ فُصُوصَهُ"
second: "كِعَابٌ دَحَاهَا لَاعِبٌ فَهْيَ مُثَّلُ"
vocabulary:
  - term: "أَعْدِلُ"
    text: "أُقيم وأتوسّد."
  - term: "مَنْحُوضًا"
    text: "«القليل اللحم» [@ukbari-lamiyya، ص113]، يعني ذراعه."
  - term: "فُصُوصَهُ"
    text: "«مواصل عظامه» [@ukbari-lamiyya، ص113]."
  - term: "كِعَابٌ دَحَاهَا"
    text: "كعاب يلعب بها لاعب «دحاها: بسطها» [@ukbari-lamiyya، ص113]."
  - term: "مُثَّلُ"
    text: "«مثلت: انتصبت» [@ukbari-lamiyya، ص113]."
