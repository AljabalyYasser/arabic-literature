explained: false
first: "هُمُ الأَهْلُ لَا مُسْتَوْدَعُ السِّرِّ ذَائِعٌ"
second: "لَدَيْهِمْ وَلَا الجَانِي بِمَا جَرَّ يُخْذَلُ"
vocabulary:
  - term: "مُسْتَوْدَعُ السِّرِّ"
    text: "السرّ الذي يُستودع عندهم، أي «السرّ المستودَع عندهم غير ذائع» [@khizana، ج3 ص342]."
  - term: "ذَائِعٌ"
    text: "منتشر بين الناس."
  - term: "بِمَا جَرَّ"
    text: "بما جنى، يقال: «جرّ عليهم جريرةً، أي: جنى عليهم جناية» [@khizana، ج3 ص342]."
  - term: "يُخْذَلُ"
    text: "يُترك بلا نصرة، من «خذلته وخذلت عنه من باب قتل والاسم الخذلان: إذا تركت نصرته وإعانته وتأخرت عنه» [@khizana، ج3 ص342]."
