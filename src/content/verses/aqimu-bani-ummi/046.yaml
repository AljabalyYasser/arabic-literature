explained: false
first: "تَنَامُ إِذَا مَا نَامَ يَقْظَى عُيُونُهَا"
second: "حِثَاثًا إِلَى مَكْرُوهِهِ تَتَغَلْغَلُ"
vocabulary:
  - term: "تَنَامُ"
    text: "«يعني الجنايات» [@ukbari-lamiyya، ص117]، وأراد طالبيها."
  - term: "حِثَاثًا"
    text: "«سراعاً» [@ukbari-lamiyya، ص117]."
  - term: "تَتَغَلْغَلُ"
    text: "تتسرّب إليه؛ يقول: «إذا أقصر الطالبون عني بالأوتار لم تقصر الجنايات» [@ukbari-lamiyya، ص117]."
