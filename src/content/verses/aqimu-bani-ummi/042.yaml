    text: "«الأهدأ: الشديد الثبات» [@ukbari-lamiyya، ص112]، يعني منكبه."
  - term: "تُنْبِيهِ"
    text: "«تُجفيه وترفعه» [@ukbari-lamiyya، ص112]."
  - term: "سَنَاسِنُ قُحَّلُ"
    text: "«السناسن: مغارز الأضلاع. وقُحَّل: يابسة جافة» [@ukbari-lamiyya، ص112]."
