explained: false
first: "وَكُلٌّ أَبِيٌّ بَاسِلٌ غَيْرَ أَنَّنِي"
second: "إِذَا عَرَضَتْ أُولَى الطَّرَائِدِ أَبْسَلُ"
vocabulary:
  - term: "أَبِيٌّ"
    text: "«الحميّ الأنف، لا يقرّ للضَّيم» [@ukbari-lamiyya، ص65]."
  - term: "بَاسِلٌ"
    text: "الكريه [@ukbari-lamiyya، ص65]، أي الشجاع الذي يُكره لقاؤه."
  - term: "الطَّرَائِدِ"
    text: "«التي تُطرَد» [@ukbari-lamiyya، ص65]، أي الخيل في الغارة."
