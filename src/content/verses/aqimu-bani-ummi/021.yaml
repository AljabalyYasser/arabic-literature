first: "أُدِيمُ مِطَالَ الجُوعِ حَتَّى أُمِيتَهُ"
second: "وَأَضْرِبُ عَنْهُ الذِّكْرَ صَفْحًا فَأَذْهَلُ"
meaning: "أماطل الجوع وأسوّفه كما يُماطَل الغريم، حتى أقتله، وأصرف ذكره عن نفسي فأنساه."
vocabulary:
  - term: "أُدِيمُ"
    text: "أُطيل وأستمر."
  - term: "مِطَالَ"
    text: "«مصدر ماطله بمعنى مطله يمطله مطلاً من باب قتل إذا سوفه بوعد الوفاء مرة بعد مرة» [@khizana، ج9 ص191]."
  - term: "أَضْرِبُ عَنْهُ"
    text: "أُعرض عنه، «وضرب عن كذا وأضرب عنه أيضا: أعرض عنه» [@khizana، ج9 ص191]."
  - term: "صَفْحًا"
    text: "إعراضًا، من صفحة العنق، أي يوليه جانبه."
  - term: "أَذْهَلُ"
    text: "أغفل، وذهل عن الشيء «بمعنى غفل» [@khizana، ج9 ص191]."
context: "من القسم الذي يصف فيه الشاعر صبره على الجوع، وهو أشهر أوصاف القصيدة. ويأتي بعد أن وصف سيره في الظلام وصلابة قدميه على الحجارة."
syntax:
  - "«أديم» جملة مستأنفة، «ويجوز أن يكون خبر مبتدأ محذوف تقديره: أنا أديم» [@ukbari-lamiyya، ص85]."
  - "«حتى» «بمعنى إلى أن، ويجوز أن تكون بمعنى (كي)» [@ukbari-lamiyya، ص85]، و«أميتَه» منصوب بأن مضمرة بعدها."
  - "«وأضربُ» مرفوع معطوف على «أديم»، «ولا يجوز أن ينتصب عطفا على (أميت)»، لأن الغرض أن يخبر عن نفسه بالأمرين [@ukbari-lamiyya، ص85]."
  - "«الذكرَ» مفعول «أضرب»، و«صفحًا» «تمييز ويجوز أن يكون مصدرا في موضع الحال، أي: أضرب عنه الذكر معرضا» [@ukbari-lamiyya، ص86]."
  - "«فأذهلُ» معطوف على «أضرب» «لا على أديم لأن الفاء للترتيب والتعقيب» [@khizana، ج9 ص191]."
morphology:
  - "«مِطال» على «فِعال» مصدر «ماطل» على «فاعل»، وفيه معنى المشاركة: كأن بين الشاعر والجوع مطالبة ومدافعة."
  - "«أُميت» من «أمات» على «أفعل»، وأصله «أُمْوِت»، نُقلت كسرة الواو إلى الميم فقُلبت ياء."
  - "«أَذْهَلُ» مضارع «ذَهَل» لازمًا، يقول البَغْداديّ: «وذهل عن الشيء يذهل بفتحتين ذهولاً بمعنى غفل»، ثم يذكر أنه قد يتعدى، «والأكثر أن يتعدى بالألف فيقال: أذهلني فلان عن الشيء» [@khizana، ج9 ص191]."
rhetoric:
  thesis: "الجوع في البيت غريم يطالب بدَينه، والشاعر يماطله حتى يموت. فالحاجة الجسدية تتحول إلى خصم يغلبه الإنسان بإرادته."
  devices:
    - title: "الاستعارة في «مطال الجوع» و«أميته»"
      text: "جعل الجوع غريمًا يُماطَل، ثم كائنًا حيًّا يُقتل، ولم يذكر الغريم ولا الحيّ، بل ذكر ما يلازمهما: المطال والإماتة. وهي من الاستعارة التي يصفها عبد القاهر بأن تدع «أن تفصح بالتشبيه وتظهره» [@dalail، ص67]."
    - title: "شرح البَغْداديّ للمعنى"
      text: "يقول: «أقوى على رد نفسي عما تهوى وأغلبها وأذهل عن الجوع حتى أنساه» [@khizana، ج9 ص191]. فالبيت عنده في غلبة النفس قبل أن يكون في الجوع."
    - title: "التدرج"
      text: "ثلاث مراحل: مطال، ثم إماتة، ثم ذهول. يبدأ بالمدافعة وينتهي بالنسيان التام. وهذه قراءتنا."
  connection: "ثم يذكر لِمَ يصبر هذا الصبر: «وأستفّ ترب الأرض كي لا يرى له عليّ من الطَّول امرؤ متطوّل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية، ومنها اسمها «لامية العرب»"
  scansion: "أُدِي مُ / مِطَا لَلْ جُو / عِ حَتْ تَى / أُمِي تَ هُو = فعولُ / مفاعيلن / فعولن / مفاعلن — وَأَضْ رِ / بُ عَنْ هُذْ ذِكْ / رَ صَفْ حَنْ / فَأَذْ هَ لُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. وتُشبَع ضمة اللام في آخر البيت فتُنطق «لُو». ودخل القبض «فعولن» الأولى في الشطرين «أُديمُ» و«وأضرِ» فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
