explained: false
first: "وَيَرْكُدْنَ بِالآصَالِ حَوْلِي كَأَنَّنِي"
second: "مِنَ العُصْمِ أَدْفَى يَنْتَحِي الكِيحَ أَعْقَلُ"
vocabulary:
  - term: "يَرْكُدْنَ"
    text: "«يقفن» [@ukbari-lamiyya، ص147]."
  - term: "الآصَالِ"
    text: "العشايا، «والأصيل: العشيّ» [@ukbari-lamiyya، ص147]."
  - term: "العُصْمِ"
    text: "«جمع أعصم، وهو الذي في موضع المِعصم منه بياض، يريد الوعل» [@ukbari-lamiyya، ص147]."
  - term: "أَدْفَى"
    text: "«الذي يميل قرناه إلى ناحيتي ظهره» [@ukbari-lamiyya، ص147]."
  - term: "يَنْتَحِي الكِيحَ"
    text: "يعتمد «ناحية الجبل» [@ukbari-lamiyya، ص147]."
  - term: "أَعْقَلُ"
    text: "«ممتنع في الجبل» [@ukbari-lamiyya، ص147]."
