first: "وَإِلْفُ هُمُومٍ مَا تَزَالُ تَعُودُهُ"
second: "عِيَادًا كَحُمَّى الرِّبْعِ أَوْ هِيَ أَثْقَلُ"
vocabulary:
  - term: "إِلْفُ هُمُومٍ"
    text: "أليفها لا تفارقه."
  - term: "تَعُودُهُ"
    text: "تزوره وتعاوده."
  - term: "حُمَّى الرِّبْعِ"
    text: "الحمّى التي تأتي يوماً وتنقطع يومين؛ «يقول: يعتادني الهمّ كما يعتاد المحموم حمّى الربع» [@ukbari-lamiyya، ص117]."
