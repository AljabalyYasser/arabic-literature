first: "فَلَمَّا الْتَقَيْنَا عَلَى بَابِهَا"
second: "وَمَدَّتْ إِلَيَّ بِأَسْبَابِهَا"
vocabulary:
  - term: "بِأَسْبَابِهَا"
    text: "بما تصله به، جمع سبب: «والسبب: كل شيء يتوصل به إلى غيره» [@lisan، ج1 ص458]، ويقول المحقق: «السبب الحبل وما يتوصل به الى غيره» [@diwan-asha، ص207]."
