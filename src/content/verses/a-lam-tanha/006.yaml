first: "فَلَمَّا الْتَقَيْنَا عَلَى بَابِهَا"
second: "وَمَدَّتْ إِلَيَّ بِأَسْبَابِهَا"
meaning: "فلما التقينا عند باب بيتها، ومدّت إليّ ما يصلني بها، أي أظهرت رضاها ودعتني إليها، كان ما يذكره في البيت التالي. والأسباب في الأصل الحبال، وكل ما يوصل به إلى غيره، كما يقول المحقق: «السبب الحبل وما يتوصل به الى غيره» [@diwan-asha، ص207]. فمدّ الأسباب أن تمدّ المرأة إلى الرجل حبال وصلها: تقرّبه وتطمعه في نفسها. والبيت شرط لم يتم، وجوابه «بذلنا لها حكمها» في البيت السابع."
vocabulary:
  - term: "الْتَقَيْنَا"
    text: "اجتمعنا وجهًا لوجه."
  - term: "بِأَسْبَابِهَا"
    text: "بحبال وصلها، جمع سبب: «والسبب: كل شيء يتوصل به إلى غيره» [@lisan، ج1 ص458]."
syntax:
  - "«فَلَمَّا»: الفاء عاطفة، و«لمّا» ظرف بمعنى «حين» يتضمن معنى الشرط، يليه فعلان معطوفان: «الْتَقَيْنَا» و«وَمَدَّتْ». وجوابه لا يأتي في هذا البيت، بل في أول البيت التالي: «بَذَلْنَا لَهَا حُكْمَهَا»."
  - "«عَلَى بَابِهَا»: جار ومجرور متعلق بـ«التقينا»، و«على» هنا بمعنى «عند»."
  - "«وَمَدَّتْ إِلَيَّ بِأَسْبَابِهَا»: «مدّ» يتعدى بنفسه، وجاء هنا بالباء: مدّت بأسبابها، والباء للإلصاق والتعدية، كما يقال: مدّ بيده."
morphology:
  - "«الْتَقَيْنَا» على «افْتَعَلَ» من «لَقِيَ»، وبناؤه هنا يدل على المشاركة: كلاهما لقي صاحبه."
  - "«أَسْبَاب» جمع «سَبَب» على «أَفْعال»."
rhetoric:
  thesis: "بيت معلَّق لا يتم معناه إلا بالذي بعده: اللقاء عند الباب، ثم الرضا، ثم يأتي الجواب في البيت السابع بالصفقة والجماع. فالقارئ يُحبس عند الباب كما يُحبس الزائر."
  devices:
    - title: "التضمين"
      text: "التضمين أن يتعلق آخر البيت بأول البيت الذي بعده، فلا يتم معناه وحده. وهنا جاء الشرط «فَلَمَّا الْتَقَيْنَا» في هذا البيت، وجوابه «بَذَلْنَا لَهَا حُكْمَهَا» في البيت السابع. ويعدّه ابن رَشِيق عيبًا: «والتضمين: أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
    - title: "الاستعارة في «أَسْبَابِهَا»"
      text: "الأسباب حبال، وقد جعل إظهار الرضا والدعوة إلى الوصل حبالًا تمدّها المرأة إليه، فاستعار اسم الحبل لما يصل بين المتحابّين. والاستعارة عند عبد القاهر الجُرْجانيّ أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
  connection: "وجواب «فلما» في البيت التالي: «بذلنا لها حكمها عندنا»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الباء المكسورة، وبعدها هاء: «بِهَا»"
  scansion: "فَلَمْمَلْ / تَقَيْنَا / عَلَى بَا / بِهَا = فعولن / فعولن / فعولن / فعَلْ — وَمَدْدَتْ / إِلَيْيَ / بِأَسْبَا / بِهَا = فعولن / فعولُ / فعولن / فعَلْ"
  note: "سلمت تفعيلات الصدر من القبض، ودخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الثانية من العجز. وسقطت همزة الوصل في «الْتَقَيْنَا» في الدَّرْج، فاتصلت لام «لمّا» بالتاء. والعروض محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]، والضرب محذوف كذلك [@atiq، ص122]."
context: "يأتي بعد صفتها في ثوبها الواحد (5)، ويمهّد للأبيات الثلاثة التي يصف فيها خلوته بها (7–9). وهو في الصوت الذي يرويه «الأغاني» بعد البيت الخامس، وهو آخر ما يرويه منها [@aghani-dk، ج6 ص299]، فوقف الغناء عند الباب ولم يدخل."
variants:
  - reading: "فَلَمَّا الْتَقَيْنَا عَلَى آلَةٍ / وَمَدَّتْ إِلَيَّ بِأَسْبَابِهَا"
    status: "رواية «الأغاني»"
    note: "«على آلةٍ» مكان «على بابها» [@aghani-dk، ج6 ص299]، والآلة الحالة: «وَالْآلَةُ: الْحَالَةُ» [@lisan، ج11 ص39]، أي التقينا على حال ما، ولا يذكر الباب."
