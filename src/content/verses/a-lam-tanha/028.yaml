explained: false
first: "إِذَا الْحَبَرَاتُ تَلَوَّتْ بِهِمْ"
second: "وَجَرُّوا أَسَافِلَ هُدَّابِهَا"
vocabulary:
  - term: "الْحَبَرَاتُ"
    text: "«والحِبَرَةُ، والحَبَرَةُ: ضَرْبٌ مِنْ بُرُودِ الْيَمَنِ مُنَمَّر» [@lisan، ج4 ص159]."
  - term: "هُدَّابِهَا"
    text: "«هُدْبُ الثَّوْبِ، وهُدْبَتُه، وهُدَّابُه: طَرَفُ الثوبِ، مِمَّا يَلي طُرَّتَه» [@lisan، ج1 ص780]. يصفهم بجرّ ثيابهم خيلاء."
