explained: false
first: "عَلَى كُلِّ حَالٍ لَهَا حَالَةٌ"
second: "وَكُلُّ الْأَجَارِيِّ يُجْرَى بِهَا"
vocabulary:
  - term: "حَالَةٌ"
    text: "هيئة، أي لها في كل وضع هيئة توافقه."
  - term: "الْأَجَارِيِّ"
    text: "الضروب والطرائق، والأصل في جري الخيل: «والأجاريّ: ضروب من جريه، واحدها إجريّا» [@lisan، ج13 ص326]. ويقول المحقق إنها جمع إِجْرِيّا، «وهي الطريقة التي يجرى عليها» [@diwan-asha، ص207]."
  - term: "يُجْرَى بِهَا"
    text: "يُؤتى بها، أي إنها تحسن الأوضاع كلها."
