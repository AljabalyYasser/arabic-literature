first: "عَلَى كُلِّ حَالٍ لَهَا حَالَةٌ"
second: "وَكُلُّ الْأَجَارِيِّ يُجْرَى بِهَا"
meaning: "يعمّم ما ذكره في البيت السابق: في كل وضع من أوضاع الجماع لها هيئة توافقه وتحسنه، وكل ضرب من ضروبه أُتي معها. والأجاريّ في الأصل ضروب جري الفرس: «والأَجارِيُّ: ضُروبٌ مِنْ جَرْيه، وَاحِدُهَا إِجْرِيّا» [@lisan، ج13 ص326]، ويقول المحقق إنها جمع إِجْرِيّا، «وهي الطريقة التي يجرى عليها» [@diwan-asha، ص207]. فشبّه الجماع بركوب الفرس وإجرائه، وجعلها فرسًا تُجرى في كل ضروب الجري. والمعنى بلغة اليوم: جامعتُها في كل الأوضاع، وكانت تجيدها كلها."
vocabulary:
  - term: "حَالٍ"
    text: "وضع وهيئة، والمراد أوضاع الجسدين في الجماع."
  - term: "حَالَةٌ"
    text: "هيئة توافق ذلك الوضع، أي تعرف كيف تكون فيه."
  - term: "الْأَجَارِيِّ"
    text: "ضروب الجري، جمع إِجْرِيّا: «والأَجارِيُّ: ضُروبٌ مِنْ جَرْيه، وَاحِدُهَا إِجْرِيّا» [@lisan، ج13 ص326]، وأصله في جري الخيل والحُمُر."
  - term: "يُجْرَى بِهَا"
    text: "تُجرى هي فيه، أي يُفعل معها، كما يُجرى الفرس في ضروب الجري."
syntax:
  - "«عَلَى كُلِّ حَالٍ»: جار ومجرور متعلق بمحذوف خبر مقدم، و«حَالَةٌ» مبتدأ مؤخر، و«لَهَا» متعلق بمحذوف صفة لـ«حالة» أو خبر ثانٍ. والتقدير: لها على كل حال حالةٌ."
  - "«وَكُلُّ الْأَجَارِيِّ يُجْرَى بِهَا»: «كلُّ» مبتدأ مضاف إلى «الأجاريّ»، وجملة «يُجْرَى بِهَا» خبره، و«يُجرى» مبني للمجهول، ونائب فاعله ضمير يعود على «كل» أو الجار والمجرور «بِهَا»."
  - "تقديم «عَلَى كُلِّ حَالٍ» أول البيت يجعل العموم هو المقصود، ثم يأتي العجز بعموم ثانٍ: «وَكُلُّ الْأَجَارِيِّ»."
morphology:
  - "«الأَجَارِيّ» جمع «إِجْرِيّا»، بكسر الهمزة والراء وتشديد الياء، كما ضبطه المحقق [@diwan-asha، ص207]، من «جَرَى»."
  - "«حالة» مؤنث «حال»، وهما من «حالَ يحولُ» أجوف واوي، قُلبت الواو ألفًا."
  - "«يُجْرَى» مضارع «أُجْرِيَ» المبني للمجهول من «أَجْرَى» على «أَفْعَلَ»، ناقص يائي."
rhetoric:
  thesis: "خاتمة مشهد الخلوة: بعد أن ذكر وضعين في البيت السابق، يقول إنهما لم يكونا كل شيء، فكل الأوضاع جُرّبت معها. ثم ينتقل في البيت التالي إلى الحسرة على ذلك الدهر."
  devices:
    - title: "الاستعارة في «الْأَجَارِيِّ» و«يُجْرَى»"
      text: "جعل المرأة فرسًا، وجعل الجماع إجراءً لها في ضروب العَدْو، فاستعار ألفاظ الخيل للجماع. وركوب الفرس من الصور التي يُكنى بها عن الجماع في شعرهم، كقول امرئ القَيْس في «أَلَا عِمْ صَبَاحًا»: «كَأَنِّيَ لَمْ أَرْكَبْ جَوَادًا لِلَذَّةٍ ... وَلَمْ أَتَبَطَّنْ كَاعِبًا ذَاتَ خَلْخَالِ». والاستعارة عند عبد القاهر الجُرْجانيّ أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الجناس"
      text: "«حَالٍ» و«حَالَةٌ» في الصدر، و«الْأَجَارِيِّ» و«يُجْرَى» في العجز: في كل شطر كلمتان من أصل واحد. والجناس أن تتشابه الكلمتان في اللفظ أو في أصله، وهو هنا يجعل الشطرين متوازيين في البناء."
    - title: "التعميم بعد التقسيم"
      text: "قسّم في البيت السابق («طَوْرًا ... وَطَوْرًا»)، ثم عمّم هنا بـ«كُلّ» مرتين: «عَلَى كُلِّ حَالٍ» و«وَكُلُّ الْأَجَارِيِّ». فالتقسيم ذكر مثالين، والتعميم يقول إن الأمثلة لا تنتهي. وهذه قراءتنا."
  connection: "ثم يتحسّر على ذلك الدهر: «فَكَيْفَ بِدَهْرٍ خَلَا ذِكْرُهُ»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الباء المكسورة، وبعدها هاء: «بِهَا»"
  scansion: "عَلَى كُلْ / لِ حَالِنْ / لَهَا حَا / لَتُنْ = فعولن / فعولن / فعولن / فعَلْ — وَكُلْلُلْ / أَجَارِيْ / يِ يُجْرَى / بِهَا = فعولن / فعولن / فعولن / فعَلْ"
  note: "سلمت التفعيلات الثلاث الأولى في الشطرين من الزحاف. والياء المشددة في «الأجاريِّ» حرفان: الأولى ساكنة تختم «فعولن» الثانية، والثانية مكسورة تبدأ الثالثة. والعروض محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]، والضرب محذوف كذلك [@atiq، ص122]."
context: "آخر الأبيات الصريحة (4–9)، وبعده ينتقل إلى الحسرة على شبابه حين كانت لمّته كجناح الغراب والكواعب ينظرن إليه (10–11). ولم نجد شارحًا قديمًا وقف عند هذه الأبيات، وشرحها الذي بين أيدينا شرح المحقق، وهو يجعلها دليلًا على أن صاحبتها من الجواري المحترفات [@diwan-asha، ص206]. ويرى المحقق أيضًا أن أبيات الخمر (17–24) موضعها الراجح بعد هذا البيت مباشرة [@diwan-asha، ص206]، فيتصل اللهو بالنساء باللهو بالخمر."
