explained: false
first: "كُمَيْتٍ يُرَى دُونَ قَعْرِ الْإِنَى"
second: "كَمِثْلِ قَذَى الْعَيْنِ يُقْذَى بِهَا"
vocabulary:
  - term: "كُمَيْتٍ"
    text: "«الكُمَيْتُ: مِنْ أَسماء الْخَمْرِ فِيهَا حُمرة وَسَوَادٌ» [@lisan، ج2 ص81]."
  - term: "الْإِنَى"
    text: "الإناء، قُصر."
  - term: "قَذَى"
    text: "ما يقع في العين أو في الشراب من غبار ونحوه."
