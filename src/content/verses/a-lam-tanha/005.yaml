first: "تُنَازِعُنِي إِذْ خَلَتْ بُرْدَهَا"
second: "مُفَضَّلَةً غَيْرَ جِلْبَابِهَا"
meaning: "يصف واحدة من تلك النساء: إذا خلت به في بيتها جاذبته ثوبها، يشدّه هو ليكشف جسدها وتشدّه هي تمنّعًا ودلالًا، وليس عليها إلا قميص رقيق واحد تلبسه في خلوتها، لا شيء تحته على بدنها. يقول المحقق في «مفضّلة»: «وهو أن تلبس الجارية ثوبا رقيقا كقميص النوم اذا خلت لنفسها وانما تلبسه في خدرها وخلوتها»، وفي «غَيْرَ جِلْبَابِهَا»: «أي لاتلبس غيره مباشرا لجسمها» [@diwan-asha، ص207]. فهي شبه عارية، والمجاذبة لعب يسبق الجماع الذي تصفه الأبيات التالية."
vocabulary:
  - term: "تُنَازِعُنِي"
    text: "تجاذبني، و«المُنازعةُ: المُجاذَبةُ فِي الأَعْيانِ والمَعاني». وقد تكون بمعنى المعاطاة: «ومُنازَعةُ الكأْس: مُعاطاتُها» [@lisan، ج8 ص351]، فيكون المعنى أنها تشاركه ثوبها فيكونان فيه معًا."
  - term: "خَلَتْ"
    text: "انفردت به في خلوة لا يراهما فيها أحد."
  - term: "بُرْدَهَا"
    text: "ثوبها، قال ابن سِيدَه: «البرد ثوب فيه خطوط» [@lisan، ج3 ص87]."
  - term: "مُفَضَّلَةً"
    text: "في ثوب واحد: «تفضّلت المرأة في بيتها إذا كانت في ثوب واحد كالخيعل ونحوه» [@lisan، ج11 ص526]."
  - term: "جِلْبَابِهَا"
    text: "قميصها: «والجلباب: القميص» [@lisan، ج1 ص272]."
syntax:
  - "«تُنَازِعُنِي»: فعل مضارع، والياء مفعوله الأول، و«بُرْدَهَا» مفعوله الثاني، لأن «نازع» يتعدى إلى مفعولين: نازعته الشيءَ. وجاء المضارع لحكاية حال كانت تتكرر."
  - "«إِذْ خَلَتْ»: «إذ» ظرف لما مضى من الزمان، مضاف إلى جملة «خلت»، متعلق بـ«تنازعني»."
  - "«مُفَضَّلَةً»: حال من فاعل «تنازعني»، أي تنازعني وهي في ثوب واحد. و«غَيْرَ جِلْبَابِهَا»: «غير» هنا بمعنى «إلا»، منصوبة على الاستثناء، والمعنى: مفضّلة لا ثوب عليها إلا جلبابها."
morphology:
  - "«تُنَازِع» مضارع «نازَعَ» على «فاعَلَ»، وهو بناء المشاركة: كلاهما يجذب."
  - "«مُفَضَّلَة» اسم فاعل من «فَضَّلَ» المضعف بمعنى «تَفَضَّلَ»، وأصله من الفُضُل: الثوب الواحد تلبسه المرأة في بيتها."
  - "«جِلْبَاب» على «فِعْلال»، وجمعه جلابيب."
rhetoric:
  thesis: "أول صورة للخلوة: لا يبدأ بالجماع، بل بلعب الثوب. فالمرأة في ثوب واحد رقيق، وهو وهي يتجاذبانه، والقارئ يعرف إلى أين ينتهي هذا التجاذب."
  devices:
    - title: "الإيجاز بالحال"
      text: "«مُفَضَّلَةً غَيْرَ جِلْبَابِهَا»: كلمتان تكشفان حالها كلها، فلا يحتاج إلى وصف جسدها. والحال هنا تقوم مقام الوصف الصريح، وهي قراءتنا."
    - title: "الكناية"
      text: "«تُنَازِعُنِي ... بُرْدَهَا» لم يقل إنه يعرّيها، بل ذكر ما يسبق التعرية ويدل عليها: مجاذبة الثوب. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يذكر لقاءهما عند بابها: «فَلَمَّا الْتَقَيْنَا عَلَى بَابِهَا»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الباء المكسورة، وبعدها هاء: «بِهَا»"
  scansion: "تُنَازِ / عُنِي إِذْ / خَلَتْ بُرْ / دَهَا = فعولُ / فعولن / فعولن / فعَلْ — مُفَضْضَ / لَتَنْ غَيْ / رَ جِلْبَا / بِهَا = فعولُ / فعولن / فعولن / فعَلْ"
  note: "دخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الأولى من الشطرين. والعروض محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]، والضرب محذوف كذلك [@atiq، ص122]."
context: "ثاني أبيات المرأة بعد «وَقَبْلَكِ سَاعَيْتُ فِي رَبْرَبٍ» (4). وهو مع البيت التالي في الصوت الذي يرويه «الأغاني» من القصيدة، بعد أبيات الكعبة والمجلس [@aghani-dk، ج6 ص299]، فكان مما يُغنّى. ويرى المحقق أن هذه الأبيات تصف جارية من المحترفات [@diwan-asha، ص206]."
variants:
  - reading: "تُنَازِعُنِي إِذْ خَلَتْ بُرْدَهَا / مُعَطَّرَةً غَيْرَ جِلْبَابِهَا"
    status: "رواية «الأغاني»"
    note: "«معطّرة» مكان «مفضّلة» [@aghani-dk، ج6 ص299]، فيصير الوصف في طيبها لا في ثوبها."
