explained: false
first: "تُنَازِعُنِي إِذْ خَلَتْ بُرْدَهَا"
second: "مُفَضَّلَةً غَيْرَ جِلْبَابِهَا"
vocabulary:
  - term: "تُنَازِعُنِي"
    text: "تجاذبني."
  - term: "بُرْدَهَا"
    text: "ثوبها، قال ابن سِيدَه: «البرد ثوب فيه خطوط» [@lisan، ج3 ص87]."
  - term: "خَلَتْ"
    text: "انفردت معي في خلوة."
  - term: "مُفَضَّلَةً"
    text: "في ثوب واحد: «تفضّلت المرأة في بيتها إذا كانت في ثوب واحد كالخيعل ونحوه» [@lisan، ج11 ص526]. ويقول المحقق: «وهو أن تلبس الجارية ثوبا رقيقا كقميص النوم اذا خلت لنفسها وانما تلبسه في خدرها وخلوتها» [@diwan-asha، ص207]."
  - term: "غَيْرَ جِلْبَابِهَا"
    text: "يقول المحقق: «أي لاتلبس غيره مباشرا لجسمها» [@diwan-asha، ص207]. والجلباب هنا القميص: «والجلباب: القميص» [@lisan، ج1 ص272]."
