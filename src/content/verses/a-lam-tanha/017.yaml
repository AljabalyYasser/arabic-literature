first: "وَكَأْسٍ شَرِبْتُ عَلَى لَذَّةٍ"
second: "وَأُخْرَى تَدَاوَيْتُ مِنْهَا بِهَا"
meaning: "ورُبّ كأس شربتها طلبًا للذة، وكأس أخرى شربتها دواءً لما أصابني من الأولى. فالخمر عنده داء ودواء معًا: يشربها للطرب، فإذا أصابه خُمارها، وهو ما يعقب السكر من ألم وصداع، عالجه بكأس أخرى منها. وفي اللسان: «وخُمْرَتُها وخُمارُها: مَا خَالَطَ مِنْ سُكْرِهَا، وَقِيلَ: خُمْرَتُها وخُمارُها مَا أَصابك مِنْ أَلمها وَصُدَاعِهَا وأَذاها» [@lisan، ج4 ص255]."
vocabulary:
  - term: "كَأْسٍ"
    text: "الخمر في إنائها؛ قال ابن سِيدَه: «الكأْس الْخَمْرُ نَفْسُهَا اسْمٌ لَهَا» [@lisan، ج6 ص189]."
  - term: "عَلَى لَذَّةٍ"
    text: "لأجل اللذة، طلبًا للطرب."
  - term: "تَدَاوَيْتُ مِنْهَا بِهَا"
    text: "عالجت ما فعلته بي الكأس الأولى بشرب الثانية."
syntax:
  - "«وَكَأْسٍ»: الواو واو «رُبَّ»، و«كأسٍ» مجرور لفظًا بـ«رُبَّ» المحذوفة، مرفوع محلًّا على الابتداء. وجملة «شَرِبْتُ» في محل جر صفة لـ«كأس»، والخبر محذوف يدل عليه السياق: ورُبّ كأس شربتها على لذة قد مضت لي."
  - "«عَلَى لَذَّةٍ» متعلق بـ«شربت»، و«على» هنا للتعليل، كقولك: فعلته على كذا، أي لأجله."
  - "«وَأُخْرَى» معطوفة على «كأس» مجرورة بكسرة مقدرة على الألف، وجملة «تَدَاوَيْتُ» صفة لها. و«مِنْهَا» متعلق بـ«تداويت»، و«مِن» لابتداء الغاية: الداء جاء منها. و«بِهَا» متعلق به أيضًا، والباء للاستعانة: الدواء بها."
morphology:
  - "«تَدَاوَيْتُ» على «تَفَاعَلَ» من «دَاوَى»، وهو هنا لمطاوعة «فاعَلَ»: داويتُه فتداوى، أي عالج نفسه."
  - "«كَأْس» مؤنثة، و«أُخْرَى» مؤنث «آخَر» على «فُعْلَى»، ولذلك وُصفت بها الكأس."
  - "«لَذَّة» على «فَعْلة» من «لَذَّ الشيءُ يَلَذُّ»."
rhetoric:
  thesis: "أشهر بيت في القصيدة، ومن أشهر أبيات الخمر في العربية. والمعنى كله في مفارقة واحدة: الخمر داء، ودواؤها منها. وقد ابتكره الأَعْشَى، ثم أخذه الشعراء بعده."
  devices:
    - title: "المفارقة في «مِنْهَا بِهَا»"
      text: "ختم البيت بضميرين متجاورين يعودان إلى الخمر نفسها: «مِنْهَا» الداء، و«بِهَا» الدواء. فاجتمع النقيضان في شيء واحد وفي كلمتين. وهذه قراءتنا."
    - title: "تقسيم الكأسين"
      text: "قسّم شربه قسمين: الصدر لكأس اللذة، والعَجُز لكأس العلاج، وعطف الثانية على الأولى بـ«وَأُخْرَى». فالبيت يحكي سيرة الشارب كلها في دورتين: يطرب، ثم يتداوى من طربه بطرب جديد."
    - title: "السبق والأخذ"
      text: "الأخذ أن يأخذ شاعر معنى من سبقه فيقوله بلفظه هو. وهذا البيت من أشهر ما أُخذ: يقول ابن قُتَيْبة: «وكان الناس يستجيدون للأعشى قوله»، ثم يذكر قول أبي نُواس «دع عنك لومى فإنّ اللّوم إغراء ... وداونى بالتى كانت هى الدّاء»، ويقول: «فللأعشى فضل السّبق إليه، ولأبى نواس فضل الزيادة فيه» [@ibn-qutayba، ج1 ص74]. وروى المَرْزُبانيّ عن ابن الأعرابي أنه سأل أصحابه أيّهما أحسن، فسكتوا، «فقال: الأول السابق أجود» [@muwashshah، ص336]. وروى عن محمد بن يحيى أن أبا نُواس أخذه «فوالله ما بلغه، وظهر فى لفظه تكلف» [@muwashshah، ص421]. ويقول البَغْداديّ إن الأَعْشَى «أول من ابتكر هذا المعنى»، وإن قيس بن ذَرِيح أخذه فقال: «تداويت من ليلى بليلى من الهوى ... كما يتداوى شارب الخمر بالخمر» [@khizana، ج11 ص434]، والبيت عند المَرْزُبانيّ للمجنون [@muwashshah، ص420]."
  connection: "ثم يقول إنه فعل ذلك «لكي يعلم الناس أني امرؤ أتيت المعيشة من بابها»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الباء المكسورة، وبعدها هاء: «بِهَا»"
  scansion: "وَكَأْسِنْ / شَرِبْتُ / عَلَى لَذْ / ذَتِنْ = فعولن / فعولُ / فعولن / فعَلْ — وَأُخْرَى / تَدَاوَيْ / تُ مِنْهَا / بِهَا = فعولن / فعولن / فعولن / فعَلْ"
  note: "دخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الثانية من الصدر. والعروض محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]، والضرب محذوف كذلك [@atiq، ص122]."
context: "أول مقطع الخمر في القصيدة (17–25)، بعد وصف الناقة. وينشد شوقي ضَيْف هذا البيت والذي بعده مثالًا على أن الأَعْشَى «يصف الخمر وصف مفتون بها، معلنا إنه لا يستطيع عنها انصرافا» [@deif، ج1 ص360]. وهو ما يقف عنده النقاد من القصيدة كلها، ولهذا نشرحه شرحًا كاملًا في نص يُقرأ قراءة حرة."
