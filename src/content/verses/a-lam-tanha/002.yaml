explained: false
first: "لِجَارَتِنَا إِذْ رَأَتْ لِمَّتِي"
second: "تَقُولُ لَكَ الْوَيْلُ أَنَّى بِهَا"
vocabulary:
  - term: "لِمَّتِي"
    text: "«واللِّمَّة: شَعْرُ الرأْس، بِالْكَسْرِ، إِذَا كَانَ فَوْقَ الوَفْرة» [@lisan، ج12 ص551]، والوَفْرة دونها."
  - term: "أَنَّى بِهَا"
    text: "«أَنَّى مَعْنَاهَا كَيْفَ ومِنْ أَيْنَ» [@lisan، ج15 ص438]، أي: من أين لك هذا الشيب؟"
