first: "طِوَالَ الْأَخَادِعِ خُوصَ الْعُيُونِ"
second: "خِمَاصًا مَوَاضِعُ أَحْقَابِهَا"
vocabulary:
  - term: "الْأَخَادِعِ"
    text: "جمع أَخْدَع: «والأَخْدَعانِ: عِرْقان خَفِيّانِ فِي مَوْضِعِ الحِجامة مِنَ العُنق» [@lisan، ج8 ص66]."
  - term: "خُوصَ الْعُيُونِ"
    text: "غائرات العيون من طول السفر."
  - term: "خِمَاصًا"
    text: "ضامرات البطون."
  - term: "أَحْقَابِهَا"
    text: "جمع حَقَب: «الحَقَبُ، بِالتَّحْرِيكِ: الحِزامُ الَّذِي يَلِي حَقْوَ البَعِير» [@lisan، ج1 ص324]."
