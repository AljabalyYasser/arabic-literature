explained: false
first: "وَقَبْلَكِ سَاعَيْتُ فِي رَبْرَبٍ"
second: "إِذَا نَامَ سَامِرُ رُقَّابِهَا"
vocabulary:
  - term: "سَاعَيْتُ"
    text: "«وسَاعَى الأَمَةَ: طَلَبَها لِلْبِغَاء» [@lisan، ج14 ص387]، وأنشد صاحب اللسان بعده بيتًا آخر للأَعْشَى فيه الفعل نفسه."
  - term: "رَبْرَبٍ"
    text: "«والرَّبْرَبُ: القَطِيعُ مِنْ بَقَرِ الْوَحْشِ» [@lisan، ج1 ص409]، يكنّي به عن النساء."
  - term: "سَامِرُ رُقَّابِهَا"
    text: "السامر: من يسهر ليلًا: «وسَمَرَ يَسْمُرُ سَمْراً وسُمُوراً: لَمْ يَنَمْ» [@lisan، ج4 ص376]. والرُّقّاب: الحرّاس، جمع راقب: «والرَّقيبُ: الحَفِيظُ» [@lisan، ج1 ص424]."
