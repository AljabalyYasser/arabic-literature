first: "وَقَبْلَكِ سَاعَيْتُ فِي رَبْرَبٍ"
second: "إِذَا نَامَ سَامِرُ رُقَّابِهَا"
meaning: "يقول لجارته التي عابت شيبه: وقبلكِ كنت أطلب النساء للزنا في جماعات منهن كقطيع البقر الوحشي، آتيهن ليلًا إذا نام الساهرون من حرّاسهن. و«ساعيتُ» كلمة صريحة في معناها: «المُساعاةُ: الزِّنا. يُقَالُ: ساعَت الأَمَةُ إِذَا فَجَرَت، وَسَاعَاهَا فُلَانٌ إِذَا فَجَرَ بِهَا» [@lisan، ج14 ص387]. ويقول المحقق: «المساعاة الفجور وهو خاص بالاماء» [@diwan-asha، ص207]، والإماء الجواري المملوكات. فالمعنى بلغة اليوم: كنت أزني بالجواري ليلًا، أتسلل إليهن حين ينام من يحرسهن."
vocabulary:
  - term: "سَاعَيْتُ"
    text: "زنيتُ، والأصل في الأمة: «وسَاعَى الأَمَةَ: طَلَبَها لِلْبِغَاء»، والبغاء الزنا بأجر. وقال أبو الهيثم فيما ينقله صاحب اللسان: «المُساعاةُ مُساعاةُ الأَمَة إِذَا سَاعَى بِهَا مالِكُها فضَرَب عَلَيْهَا ضَريبَةً تُؤَدِّيها بالزِّنا» [@lisan، ج14 ص387]، أي يفرض عليها سيدها مالًا تكسبه من بيع جسدها."
  - term: "رَبْرَبٍ"
    text: "«والرَّبْرَبُ: القَطِيعُ مِنْ بَقَرِ الْوَحْشِ» [@lisan، ج1 ص409]، ويقول المحقق: «يشبه به النساء» [@diwan-asha، ص207]."
  - term: "سَامِرُ"
    text: "الساهرون ليلًا: «وسَمَرَ يَسْمُرُ سَمْراً وسُمُوراً: لَمْ يَنَمْ» [@lisan، ج4 ص376]. ويقول المحقق: «سامر اسم فاعل من سمر القوم اجتمعوا ليلا للحديث» [@diwan-asha، ص207]، وهو هنا اسم للجماعة."
  - term: "رُقَّابِهَا"
    text: "حرّاسها الذين يرقبونها، جمع راقب: «والرَّقيبُ: الحَفِيظُ» [@lisan، ج1 ص424]."
syntax:
  - "«وَقَبْلَكِ»: ظرف زمان منصوب متعلق بـ«ساعيتُ»، والكاف المكسورة للمخاطبة، وهي الجارة التي قالت له في البيت الثاني «لك الويل أنّى بها». وتقديم الظرف على الفعل يجعل الكلام موازنة بينها وبين من كنّ قبلها."
  - "«سَاعَيْتُ»: فعل ماض وفاعله التاء، ومفعوله محذوف يفهم من السياق، أي ساعيت النساء. و«فِي رَبْرَبٍ» جار ومجرور متعلق به، أي بين جماعة منهن."
  - "«إِذَا نَامَ سَامِرُ رُقَّابِهَا»: «إذا» ظرف متضمن معنى الشرط، وجاء هنا لما مضى على وجه العادة، أي كلما نام. و«سامرُ» فاعل «نام» مضاف إلى «رُقّابها»، والهاء للربرب. وجواب «إذا» محذوف يدل عليه ما قبله."
morphology:
  - "«سَاعَيْتُ» على «فاعَلَ» من السعي، وهو بناء المشاركة، وفي اللسان أنه «مُفاعَلَةٌ مِنَ السَّعْيِ، كأَنَّ كُلُّ وَاحِدٍ مِنْهُمَا يَسْعى لصاحِبه فِي حُصُولِ غَرَضهِ» [@lisan، ج14 ص387]."
  - "«رَبْرَب» رباعي مضعف على «فَعْلَل»، تتكرر فيه الراء والباء."
  - "«رُقَّاب» جمع «راقِب» على «فُعَّال»، كـ«كاتب وكُتّاب»، و«سامِر» اسم فاعل من «سَمَرَ» يُستعمل اسمًا للجماعة."
rhetoric:
  thesis: "بيت يصل الشيب بما قبله من الشباب: الجارة تعيب شيبه، فيرد عليها بأنه قبلها كان يطلب النساء ليلًا. وهو مدخل الأبيات الخمسة التالية التي يصف فيها واحدة منهن وخلوته بها."
  devices:
    - title: "الاستعارة في «رَبْرَبٍ»"
      text: "سمّى النساء قطيعًا من بقر الوحش، ولم يذكر أداة تشبيه، فهي استعارة. والاستعارة عند عبد القاهر الجُرْجانيّ أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، و«تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. ووجه الشبه سعة العيون وحسن المشي واجتماعهن جماعة واحدة."
    - title: "الكلمة الصريحة"
      text: "اختار «سَاعَيْتُ»، وهي كلمة من كلام الناس في زنا الإماء بأجر، لا من كلام الغزل. فلم يقل: وصلتُ أو زرتُ، بل سمّى فعله باسمه. ومن هنا رأى المحقق أن صاحبة القصيدة جارية من الجواري المحترفات، لا امرأة حرة. وهذه الصلة بين الكلمة وقول المحقق قراءتنا."
    - title: "الحارس النائم"
      text: "«إِذَا نَامَ سَامِرُ رُقَّابِهَا»: صورة يتكرر مثلها في غزل الجاهليين الصريح، كقول امرئ القَيْس في «ألا عم صباحًا»: «سموت إليها بعدما نام أهلها». فالمغامرة لا تبدأ إلا حين يغفل الرقيب."
  connection: "ثم يصف واحدة منهن في خلوتها: «تنازعني إذ خلت بردها»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الباء المكسورة، وبعدها هاء: «بِهَا»"
  scansion: "وَقَبْلَ / كِ سَاعَيْ / تُ فِي رَبْ / رَبِنْ = فعولُ / فعولن / فعولن / فعَلْ — إِذَا نَا / مَ سَامِ / رُ رُقْقَا / بِهَا = فعولن / فعولُ / فعولن / فعَلْ"
  note: "دخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الأولى من الصدر والثانية من العجز. والعروض محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]، والضرب محذوف كذلك [@atiq، ص122]."
context: "أول أبيات القصيدة في المرأة: بعد أن أقرّ بأن الحوادث ذهبت بلِمّته (3) يعود إلى شبابه. ويقول المحقق في تقديمه إن الأَعْشَى «لا يصور في صدر القصيدة امرأة من الحرائر. ولكنه يتحدث عن إحدى هذه الطبقة من الجواري اللائي يحترفن الفجور. وذلك واضح من الأبيات (4–9)» [@diwan-asha، ص206]. وفي اللسان أن ثَعْلَبًا لم يقصر الفعل على الإماء: «وعَمّ ثعلبٌ بِهِ الأَمة وَالْحُرَّةَ»، وأنشد للأَعْشَى من شعر آخر: «ومِثْلِكِ خَوْدٍ بادِنٍ قَدْ طَلَبْتُها، ... وساعَيْتُ مَعْصِيّاً إِلَيْهَا وُشاتُها» [@lisan، ج14 ص387]. فالبيت من جانب الأَعْشَى الماجن، وهو الجانب الذي عدّه به ابن سَلّام ممن «يتعهر» [@ibn-sallam، ج1 ص41–42]، أي يحدّث عن فجوره."
