explained: false
first: "وَيَعْلُنُ مِنْهَا صَرِيفُ السَّدِيسْ"
second: "إِذَا صَرَّفَتْهُ بِأَنْيَابِهَا"
vocabulary:
  - term: "يَعْلُنُ"
    text: "يظهر: «عَلَن الأَمْرُ يَعْلُنُ عُلُوناً» [@lisan، ج13 ص288]."
  - term: "صَرِيفُ"
    text: "صوت الأسنان إذا حكّت بعضها ببعض، وفي اللسان: «ابْنُ خَالَوَيْهِ: صَرِيفُ نابِ الناقةِ يَدُلُّ عَلَى كلالِها» [@lisan، ج9 ص191]."
  - term: "السَّدِيسْ"
    text: "«والسَّدِيس: السِّنُّ الَّتِي بعد الرَّباعِيَة» [@lisan، ج6 ص104]."
