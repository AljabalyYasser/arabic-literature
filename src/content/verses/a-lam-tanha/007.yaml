first: "بَذَلْنَا لَهَا حُكْمَهَا عِنْدَنَا"
second: "وَجَادَتْ بِحُكْمِي لِأُلْهَى بِهَا"
meaning: "هذا جواب «فَلَمَّا الْتَقَيْنَا» في البيت السابق: أعطيناها ما طلبت منا، وأعطتني ما طلبت منها، لأتمتع بها. والحُكم هنا ما يحكم به المرء ويشترطه، كما يقول المحقق: «حكمها ما حكمت به واشترطته» [@diwan-asha، ص207]. فهي اشترطت أجرها أو هديتها فأعطاها إياه، وهو اشترط جسدها فأعطته إياه. و«لِأُلْهَى بِهَا» أي لأجامعها، فاللهو يُكنى به عن الجماع: «وَقَدْ يُكَنَّى باللَّهْوِ عَنِ الْجِمَاعِ»، و«واللَّهْوُ: النِّكَاحُ» [@lisan، ج15 ص259]. فالبيت بلغة اليوم: دفعتُ لها ما أرادت، ومكّنتني من نفسها كما أردت، فجامعتها."
vocabulary:
  - term: "بَذَلْنَا"
    text: "أعطينا عن طيب نفس."
  - term: "حُكْمَهَا"
    text: "ما طلبته واشترطته: «حكمها ما حكمت به واشترطته» [@diwan-asha، ص207]."
  - term: "وَجَادَتْ بِحُكْمِي"
    text: "أعطتني ما طلبتُه منها، وهو نفسها."
  - term: "لِأُلْهَى بِهَا"
    text: "لأتلهّى بها، أي لأجامعها؛ في اللسان: «وَقَدْ يُكَنَّى باللَّهْوِ عَنِ الْجِمَاعِ» [@lisan، ج15 ص259]."
syntax:
  - "«بَذَلْنَا لَهَا حُكْمَهَا»: جملة جواب «لمّا» في البيت السادس، لا محل لها من الإعراب. و«حُكْمَهَا» مفعول به، و«لَهَا» و«عِنْدَنَا» متعلقان بـ«بذلنا»."
  - "«وَجَادَتْ بِحُكْمِي»: معطوفة على جملة الجواب، و«جاد» يتعدى بالباء: جاد بالشيء."
  - "«لِأُلْهَى بِهَا»: اللام لام التعليل، و«أُلْهَى» مضارع مبني للمجهول منصوب بـ«أن» مضمرة بعدها بفتحة مقدرة على الألف، والمصدر المؤوَّل مجرور باللام متعلق بـ«جادت». و«بِهَا» متعلق بـ«أُلهى»."
  - "جاء الصدر بضمير الجماعة «بَذَلْنَا» و«عِنْدَنَا»، والعجز بضمير المتكلم الواحد «بِحُكْمِي» و«لِأُلْهَى»، والمتكلم واحد، وهذا من عادة الشعراء في التنقل بين الضميرين."
morphology:
  - "«أُلْهَى» مضارع مبني للمجهول من «أَلْهَاه» إذا شغله، على «أَفْعَلَ» من «لَهَا يَلْهُو»، أي لأُشغَل بها وأتمتّع، ونائب الفاعل ضمير المتكلم المستتر."
  - "«حُكْم» على «فُعْل»، مصدر «حَكَمَ»، وأريد به هنا المحكوم به، أي ما اشتُرط."
  - "«جادَتْ» من «جادَ يجودُ» أجوف واوي، و«بَذَلْنا» من «بَذَلَ» صحيح سالم."
rhetoric:
  thesis: "البيت كله صفقة: عطاء بعطاء. فهو يؤيد ما يراه المحقق من أن صاحبة الأبيات جارية تبيع نفسها، إذ لا ذكر فيه لحب ولا شوق، بل شرط وجزاء."
  devices:
    - title: "المقابلة"
      text: "«بَذَلْنَا لَهَا حُكْمَهَا» في الصدر يقابله «وَجَادَتْ بِحُكْمِي» في العجز: هو يبذل وهي تجود، وحكمها مقابل حكمه. والمقابلة أن يؤتى بمعنيين أو أكثر ثم بما يقابلها على الترتيب."
    - title: "الكناية"
      text: "«لِأُلْهَى بِهَا» لم يسمّ فيه الجماع، بل ذكر اللهو، وهو ما يصحبه ويلزمه، فدلّ به عليه، ولذلك قال صاحب اللسان إنه «قَدْ يُكَنَّى باللَّهْوِ عَنِ الْجِمَاعِ» [@lisan، ج15 ص259]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يصف الجماع نفسه وأوضاعه: «فَطَوْرًا تَكُونُ مِهَادًا لَنَا»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الباء المكسورة، وبعدها هاء: «بِهَا»"
  scansion: "بَذَلْنَا / لَهَا حُكْ / مَهَا عِنْ / دَنَا = فعولن / فعولن / فعولن / فعَلْ — وَجَادَتْ / بِحُكْمِي / لِأُلْهَى / بِهَا = فعولن / فعولن / فعولن / فعَلْ"
  note: "سلمت التفعيلات الثلاث الأولى في الشطرين من الزحاف. والعروض محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]، والضرب محذوف كذلك [@atiq، ص122]."
context: "جواب الشرط الذي بدأ في البيت السادس، وأول الأبيات الثلاثة (7–9) التي يقول عنها المحقق إنها، مع ما قبلها، تدل على أن الأَعْشَى «يتحدث عن إحدى هذه الطبقة من الجواري اللائي يحترفن الفجور» [@diwan-asha، ص206]. وبعده بيتان في الجماع نفسه."
