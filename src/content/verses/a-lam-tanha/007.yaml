explained: false
first: "بَذَلْنَا لَهَا حُكْمَهَا عِنْدَنَا"
second: "وَجَادَتْ بِحُكْمِي لِأُلْهَى بِهَا"
vocabulary:
  - term: "حُكْمَهَا"
    text: "ما طلبته، يقول المحقق: «حكمها ما حكمت به واشترطته» [@diwan-asha، ص207]."
  - term: "وَجَادَتْ بِحُكْمِي"
    text: "أعطتني ما حكمتُ به وطلبته."
  - term: "لِأُلْهَى بِهَا"
    text: "لأتلهّى بها وأتمتّع."
sources:
