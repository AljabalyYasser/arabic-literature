first: "تَرَاهُنَّ مِنْ بَعْدِ إِسْآدِهِنَّ"
second: "وَسَيْرِ النَّهَارِ وَتَدْآبِهَا"
vocabulary:
  - term: "إِسْآدِهِنَّ"
    text: "«والإِسْآد: سَيْرُ اللَّيْلِ كُلِّهِ لَا تَعْرِيسَ فِيهِ» [@lisan، ج3 ص201]."
  - term: "وَتَدْآبِهَا"
    text: "دؤوبها في السير: «والفِعلُ اللَّازِمُ دَأَبَتِ الناقَةُ تَدْأَبُ دُؤُوباً» [@lisan، ج1 ص369]."
