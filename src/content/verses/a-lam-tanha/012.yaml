first: "وَعَنْسٍ حَمَلْتُ عَلَى سَبْسَبٍ"
second: "مُوَاشِكَةً حِينَ يُرْمَى بِهَا"
vocabulary:
  - term: "عَنْسٍ"
    text: "«والعَنْسُ: النَّاقَةُ القويَّةُ، شُبِّهَتْ بِالصَّخْرَةِ لِصَلَابَتِهَا» [@lisan، ج6 ص150]."
  - term: "سَبْسَبٍ"
    text: "«ابْنُ شُمَيْلٍ: السَّبْسَب الأَرض القَفْرُ الْبَعِيدَةُ» [@lisan، ج1 ص460]."
  - term: "مُوَاشِكَةً"
    text: "«وَنَاقَةٌ مُواشِكة: سَرِيعَةٌ» [@lisan، ج10 ص514]."
