explained: false
first: "فَطَوْرًا تَكُونُ مِهَادًا لَنَا"
second: "وَطَوْرًا أَكُونُ فَيُعْلَى بِهَا"
vocabulary:
  - term: "طَوْرًا"
    text: "مرة وحالًا."
  - term: "مِهَادًا"
    text: "فراشًا: «والمهاد: الفراش» [@lisan، ج3 ص410]، أي تكون تحته."
  - term: "وَطَوْرًا أَكُونُ"
    text: "يقول المحقق: «اى وطورا اكون مهادا» [@diwan-asha، ص207]، أي يكون هو تحتها."
  - term: "فَيُعْلَى بِهَا"
    text: "فتُرفع هي فوقه."
