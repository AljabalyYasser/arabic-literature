first: "فَطَوْرًا تَكُونُ مِهَادًا لَنَا"
second: "وَطَوْرًا أَكُونُ فَيُعْلَى بِهَا"
meaning: "يصف أوضاع الجماع بينهما: فمرةً تكون هي الفراش، أي تستلقي تحته ويعلوها، ومرةً أكون أنا الفراش، فتُرفع هي فوقي وتعلوني. والمهاد الفراش: «والمهاد: الفراش» [@lisan، ج3 ص410]، وقال المحقق في العجز: «وطورا أكون أي وطورا أكون مهادا» [@diwan-asha، ص207]. فالبيت صريح في أنهما تبادلا الوضعين: الرجل فوق المرأة، والمرأة فوق الرجل."
vocabulary:
  - term: "طَوْرًا"
    text: "مرةً وحالًا: «الطَّوْرُ: التارَةُ، تَقُولُ: طَوْراً بَعْدَ طَوْرٍ أَي تَارَةً بَعْدَ تَارَةٍ» [@lisan، ج4 ص507]."
  - term: "مِهَادًا"
    text: "فراشًا: «والمهاد: الفراش» [@lisan، ج3 ص410]، ويقول المحقق: «المهاد الفراش والأرض» [@diwan-asha، ص207]."
  - term: "فَيُعْلَى بِهَا"
    text: "فتُرفع هي فوقي، من «أعلى الشيءَ» إذا رفعه."
syntax:
  - "«فَطَوْرًا»: الفاء عاطفة، و«طورًا» ظرف زمان منصوب متعلق بـ«تكون»."
  - "«تَكُونُ مِهَادًا لَنَا»: «تكون» فعل ناقص، واسمه ضمير مستتر يعود على المرأة، و«مهادًا» خبره، و«لنا» متعلق بـ«مهادًا»."
  - "«وَطَوْرًا أَكُونُ»: «أكون» فعل ناقص اسمه ضمير المتكلم، وخبره محذوف دلّ عليه ما في الصدر، أي أكون مهادًا، كما قدّره المحقق [@diwan-asha، ص207]."
  - "«فَيُعْلَى بِهَا»: الفاء عاطفة، و«يُعْلَى» مضارع مبني للمجهول، ونائب فاعله الجار والمجرور «بِهَا»، والمعنى: فيُرفَع بها، أي تُجعل في الأعلى."
morphology:
  - "«مِهَاد» على «فِعال» من «مَهَدَ»، وهو ما يُمهَّد ويُبسط للنوم."
  - "«يُعْلَى» مضارع «أُعْلِيَ» المبني للمجهول من «أَعْلَى» على «أَفْعَلَ»، ناقص واوي أصله من «عَلَا يَعْلُو»، قُلبت لامه ألفًا في المضارع المبني للمجهول."
  - "«طَوْر» على «فَعْل»، وجمعه أطوار."
rhetoric:
  thesis: "أصرح أبيات القصيدة: لا كناية فيه إلا في كلمة «مهاد»، والمعنى بيّن لكل من سمعه. وهو مبني على تقسيم: طورًا هي، وطورًا هو."
  devices:
    - title: "الاستعارة في «مِهَادًا»"
      text: "جعل جسدها فراشًا له، ثم جعل جسده فراشًا لها. فاستعار اسم الفراش لمن يكون تحت صاحبه في الجماع. والاستعارة عند عبد القاهر الجُرْجانيّ أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "حذف الخبر"
      text: "في «وَطَوْرًا أَكُونُ» حذف خبر «أكون»، والسامع يقدّره من الصدر: أكون مهادًا. والحذف هنا أخفّ وأبلغ من التكرار، وهو مما قال فيه عبد القاهر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "التقسيم"
      text: "قسّم البيت بـ«طورًا ... وطورًا»: الصدر لها تحته، والعجز لها فوقه. والتقسيم أن يذكر الشاعر أحوال الشيء أو أقسامه كلها، وهنا يذكر الوضعين ليقول إنه لم يترك منهما شيئًا، ثم يعمّم ذلك في البيت التالي."
  connection: "ثم يعمّم: «على كل حال لها حالة»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الباء المكسورة، وبعدها هاء: «بِهَا»"
  scansion: "فَطَوْرَنْ / تَكُونُ / مِهَادَنْ / لَنَا = فعولن / فعولُ / فعولن / فعَلْ — وَطَوْرَنْ / أَكُونُ / فَيُعْلَى / بِهَا = فعولن / فعولُ / فعولن / فعَلْ"
  note: "دخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الثانية من الشطرين، فتماثل الشطران في الوزن كما تماثلا في البناء. والعروض محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]، والضرب محذوف كذلك [@atiq، ص122]."
context: "بعد البيت الذي ختم الصفقة «بذلنا لها حكمها» (7) يصف الجماع نفسه، ثم يعمّمه في البيت التاسع. وهو من الأبيات التي جعلها المحقق دليلًا على أن صاحبة الأبيات من الجواري المحترفات [@diwan-asha، ص206]. ولم نجد شارحًا قديمًا وقف عنده، فشرح المحقق الحديث وحده بين أيدينا."
