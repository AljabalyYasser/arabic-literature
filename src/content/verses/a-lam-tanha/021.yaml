explained: false
first: "وَمِزْهَرُنَا مُعْمَلٌ دَائِمٌ"
second: "فَأَيُّ الثَّلَاثَةِ أَزْرَى بِهَا"
vocabulary:
  - term: "مِزْهَرُنَا"
    text: "«والمِزْهَرُ: الْعُودِ الَّذِي يُضْرَبِ بِهِ» [@lisan، ج4 ص333]."
  - term: "مُعْمَلٌ"
    text: "مستعمل لا يُترك."
  - term: "أَزْرَى بِهَا"
    text: "«وأَزْرَى بِهِ، بالأَلف، إِزْرَاءً: قَصَّرَ بِهِ وحَقَّرَه وهَوَّنه» [@lisan، ج14 ص356]. يقول: أيّ هذه الثلاثة يُعاب به العيش؟"
