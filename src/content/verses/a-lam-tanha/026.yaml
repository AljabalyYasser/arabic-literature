first: "وَكَعْبَةُ نَجْرَانَ حَتْمٌ عَلَيْـ"
second: "ـكِ حَتَّى تُنَاخِي بِأَبْوَابِهَا"
vocabulary:
  - term: "حَتْمٌ"
    text: "واجب: «قَالَ ابْنُ سِيدَهْ: الحَتْمُ إِيجاب القَضاء» [@lisan، ج12 ص113]."
  - term: "تُنَاخِي"
    text: "تُبرَكي: «وأَناخَ الإِبلَ: أَبركها فَبَرَكَتْ» [@lisan، ج3 ص65]. يخاطب ناقته."
