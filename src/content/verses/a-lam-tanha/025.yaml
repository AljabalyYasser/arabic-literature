first: "أُحِبُّ أُثَافِتَ وَقْتَ الْقِطَافِ"
second: "وَوَقْتَ عُصَارَةِ أَعْنَابِهَا"
vocabulary:
  - term: "أُثَافِتَ"
    text: "موضع، يقول المحقق: «أثافت قرية باليمامة كثيرة الكروم» [@diwan-asha، ص209]."
  - term: "الْقِطَافِ"
    text: "«والقَطَاف والقِطَاف: أَوانُ قَطْفِ الثَّمَرِ» [@lisan، ج9 ص285]."
  - term: "عُصَارَةِ"
    text: "عصر العنب للخمر."
