explained: false
first: "أَكَلْتُ السَّنَامَ فَأَفْنَيْتُهُ"
second: "وَشُدَّ النُّسُوعُ بِأَصْلَابِهَا"
vocabulary:
  - term: "النُّسُوعُ"
    text: "«النِّسْعُ: سَيْرٌ يُضْفَرُ عَلَى هَيْئَةِ أَعِنَّةِ النِّعالِ تُشَدُّ بِهِ الرِّحالُ» [@lisan، ج8 ص352]، والنُّسُوع جمعه."
  - term: "بِأَصْلَابِهَا"
    text: "الأصلاب جمع صُلْب: «الصُّلْبُ والصُّلَّبُ: عَظْمٌ مِنْ لَدُنِ الكاهِل إِلى العَجْب» [@lisan، ج1 ص526]."
