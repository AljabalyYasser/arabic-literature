explained: false
first: "وَإِذْ لِمَّتِي كَجَنَاحِ الْغُدَافِ"
second: "تَرْنُو الْكِعَابُ لِإِعْجَابِهَا"
vocabulary:
  - term: "الْغُدَافِ"
    text: "«الغُداف: الغُراب» [@lisan، ج9 ص262]، يشبّه به سواد شعره."
  - term: "تَرْنُو"
    text: "تديم النظر."
  - term: "الْكِعَابُ"
    text: "جمع كاعب: «وكَعَبَتِ الجاريةُ، تَكْعُبُ وتَكْعِبُ، الأَخيرةُ عَنْ ثعلبٍ، كُعُوباً وكُعُوبةً وكِعابةً وكَعَّبَت: نَهَدَ ثَدْيُها» [@lisan، ج1 ص719]. وجمعها على كِعاب عن ثعلب، كما ينقل صاحب اللسان [@lisan، ج1 ص719]."
