explained: false
first: "رَاحُوا بَصَائِرُهُمْ عَلَى أَكْتَافِهِمْ"
second: "وَبَصِيرَتِي يَعْدُو بِهَا عَتَدٌ وَأَى"
vocabulary:
  - term: "بَصَائِرُهُمْ ... وَبَصِيرَتِي"
    text: "البصيرة هنا الدم، وفي اللسان: «يَعْنِي بِالْبَصَائِرِ دَمَ أَبيهم؛ يَقُولُ: تَرَكُوا دَمَ أَبيهم خَلْفَهُمْ وَلَمْ يَثْأَرُوا بِهِ وطَلَبْتُه أَنا»، «وَكَانَ أَبو عُبَيْدَةَ يَقُولُ: البَصِيرَةُ فِي هَذَا الْبَيْتِ الترْسُ أَو الدِّرْعُ» [@lisan، ج4 ص68]."
  - term: "عَتَدٌ"
    text: "يقول محققا «الأصمعيات»: «الفرس الشديد التام الخلق، السريع الوثبة، المعد للجرى» [@asmaiyyat، ص141، الحاشية]."
  - term: "وَأَى"
    text: "يقول محققا «الأصمعيات»: «الطويل من الخيل، وقيل الصلب» [@asmaiyyat، ص141، الحاشية]."
