explained: false
first: "أَحْذَيْتُ رُمْحِي عَائِطًا مَمْكُورَةً"
second: "كَوْمَاءَ أَطْرَافُ الْعِضَاهِ لَهَا حُلَى"
vocabulary:
  - term: "أَحْذَيْتُ"
    text: "ينقل محققا «الأصمعيات» عن الشنقيطية: «أى جعلته لها حذيا، أى عطية» [@asmaiyyat، ص143، الحاشية]، أي أعطيت الناقة رمحي فطعنتها."
  - term: "عَائِطًا"
    text: "يقول محققا «الأصمعيات»: «من الإبل هى البكرة التى أدركت اللقاح ولم تلقح» [@asmaiyyat، ص143، الحاشية]."
  - term: "مَمْكُورَةً ... كَوْمَاءَ"
    text: "يقول محققا «الأصمعيات»: «الممكورة: المدمجة الخلق. الكوماء: الضخمة السنام» [@asmaiyyat، ص143، الحاشية]."
  - term: "الْعِضَاهِ"
    text: "يقول محققا «الأصمعيات»: «شجر عظام» [@asmaiyyat، ص143، الحاشية]. ويقولان: «يريد أنه طعن هذه الناقة برمحه ليطعمها الضيفان»."
