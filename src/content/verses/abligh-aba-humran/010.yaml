explained: false
first: "وَإِذَا هُوَ اسْتَدْبَرْتَهُ فَتَسُوقُهُ"
second: "رِجْلٌ قَمُوصُ الْوَقْعِ عَارِيَةُ النَّسَا"
vocabulary:
  - term: "قَمُوصُ الْوَقْعِ"
    text: "يقول محققا «الأصمعيات»: «من قماص الفرس، بتثليث القاف، يقال «قمص الفرس» أى استن، وهو أن يرفع يديه ويطرحهما معا ويعجن برجليه» [@asmaiyyat، ص141، الحاشية]."
  - term: "عَارِيَةُ النَّسَا"
    text: "قليلة اللحم على النَّسا، وهو عِرق يمتد في الفخذ، وذلك من صفات الفرس الكريم."
