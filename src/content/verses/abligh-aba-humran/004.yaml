explained: false
first: "لَكِنْ قَعِيدَةُ بَيْتِنَا مَجْفُوَّةٌ"
second: "بَادٍ جَنَاجِنُ صَدْرِهَا وَلَهَا غِنَى"
vocabulary:
  - term: "قَعِيدَةُ بَيْتِنَا"
    text: "امرأة الشاعر: «وقَعِيدَةُ الرَّجُلِ وقَعِيدَةُ بيِته: امرأَتُه» [@lisan، ج3 ص360]."
  - term: "مَجْفُوَّةٌ"
    text: "مُهمَلة لا يُحسَن إليها في الطعام. ويقول البَكْريّ: «يقول نؤثر هذه الفرس الوثابة أو الجرشع على قعيدة بيتنا فهي هزيلة باد جناجن صدرها على غناها» [@simt، ج1 ص95]."
  - term: "جَنَاجِنُ صَدْرِهَا"
    text: "يقول محققا «الأصمعيات»: «الجناجن: عظام الصدر» [@asmaiyyat، ص141، الحاشية]."
