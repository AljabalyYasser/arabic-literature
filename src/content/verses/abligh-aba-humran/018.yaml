explained: false
first: "لَا يَشْتَكُونَ الْمَوْتَ غَيْرَ تَغَمْغُمٍ"
second: "حَكَّ الْجِمَالِ جُنُوبَهُنَّ مِنَ الشَّذَى"
vocabulary:
  - term: "تَغَمْغُمٍ"
    text: "يقول محققا «الأصمعيات»: «أصوات الأبطال فى الوغى عند القتال» [@asmaiyyat، ص142، الحاشية]."
  - term: "الشَّذَى"
    text: "يقول محققا «الأصمعيات»: «ذباب أزرق عظيم يقع على الدواب فيؤذيها» [@asmaiyyat، ص142، الحاشية]. وينقلان عن الشنقيطية: «يستشفون بالموت كما تستشفى الإبل بالحك مما يؤذيها»."
