explained: false
first: "أَبْلِغْ أَبَا حُمْرَانَ أَنَّ عَشِيرَتِي"
second: "نَاجَوْا وَلِلْقَوْمِ الْمُنَاجِينَ التَّوَى"
vocabulary:
  - term: "أَبَا حُمْرَانَ"
    text: "أبو حُمْران كنية أبي الشاعر، فاسمه «مرثد بن أبي حمران» [@amidi، ص57]، ويقول البَكْريّ إن الشاعر نفسه «يكنى أبا حمران» [@simt، ج1 ص94]."
  - term: "نَاجَوْا"
    text: "يقول محققا «الأصمعيات»: «من المناجاة والمسارة» [@asmaiyyat، ص140، الحاشية]. ويقول البَكْريّ: «أراد أنهم أخذوا دية أبيهم» [@simt، ج1 ص95]، أي تهامسوا في قبول الدية."
  - term: "التَّوَى"
    text: "يقول محققا «الأصمعيات»: «بفتح التاء المثناة: الهلاك» [@asmaiyyat، ص140، الحاشية]."
