first: "كَلَّفْتُ نَفْسِي حَدَّهَا وَمِرَاسَهَا"
second: "وَعَلِمْتُ أَنَّ الْقَوْمَ لَيْسَ لَهُمْ غِنَى"
vocabulary:
  - term: "حَدَّهَا ... مِرَاسَهَا"
    text: "يقول محققا «الأصمعيات»: «حدها: شدتها وصعوبتها. مراسها: شدة علاجها» [@asmaiyyat، ص143، الحاشية]."
  - term: "غِنَى"
    text: "غَناء وكفاية."
