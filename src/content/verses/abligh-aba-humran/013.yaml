explained: false
first: "وَيَبِتْنَ بِالثَّغْرِ الْمَخُوفِ طَلَائِعًا"
second: "وَيُثِبْنَ لِلصُّعْلُوكِ جَمَّةَ ذِي الْغِنَى"
vocabulary:
  - term: "بِالثَّغْرِ"
    text: "الموضع المخوف من حدود الأرض."
  - term: "طَلَائِعًا"
    text: "يتقدمن القوم يستطلعن العدو."
  - term: "يُثِبْنَ"
    text: "يقول محققا «الأصمعيات»: «يعطين، من الإثابة» [@asmaiyyat، ص142، الحاشية]."
  - term: "جَمَّةَ ذِي الْغِنَى"
    text: "يقول محققا «الأصمعيات»: «الجمة: أصلها معظم الماء» [@asmaiyyat، ص142، الحاشية]. أي يُغنمن الفقير معظم مال الغني."
