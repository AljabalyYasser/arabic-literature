first: "وَإِذَا هُوَ اسْتَعْرَضْتَهُ مُتَمَطِّرًا"
second: "فَتَقُولُ هَذَا مِثْلُ سِرْحَانِ الْغَضَا"
vocabulary:
  - term: "مُتَمَطِّرًا"
    text: "يقول محققا «الأصمعيات»: «مسرعا، تمطرت الخيل: ذهبت مسرعة» [@asmaiyyat، ص142، الحاشية]."
  - term: "سِرْحَانِ الْغَضَا"
    text: "يقول محققا «الأصمعيات»: «السرحان: الذئب. الغضا: شجر، وذئبه أخبث الذئاب» [@asmaiyyat، ص142، الحاشية]."
