explained: false
first: "مَسَحُوا لِحَاهُمْ ثُمَّ قَالُوا سَالِمُوا"
second: "يَا لَيْتَنِي فِي الْقَوْمِ إِذْ مَسَحُوا اللِّحَى"
vocabulary:
  - term: "مَسَحُوا لِحَاهُمْ"
    text: "ينقل محققا «الأصمعيات» عن الشنقيطية، وهي نسخة الشِّنْقِيطيّ من الكتاب: «قال أبو سعيد: لا يمسح الإنسان لحيته إلا وهو رخى البال. يقول: ياليتنى كنت فيهم حتى لا أرضى بما صنعوا»، ويقولان: «وأبو سعيد هو الأصمعى» [@asmaiyyat، ص142، الحاشية]. ورخيّ البال: مطمئن قد سكن خوفه. ويذكران أن مسح اللحى علامة الصلح [@asmaiyyat، ص142، الحاشية]."
