explained: false
first: "نَهْدُ الْمَرَاكِلِ مُدْمَجٌ أَرْسَاغُهُ"
second: "عَبْلُ الْمَعَاقِمِ مَا يُبَالِي مَا أَتَى"
vocabulary:
  - term: "نَهْدُ الْمَرَاكِلِ"
    text: "يقول محققا «الأصمعيات»: «المراكل: جمع مركل، بفتح الميم والكاف، وهو حيث يركل الراكب الدابة برجله يحركها للركض. والنهد: التام الجسيم» [@asmaiyyat، ص141، الحاشية]."
  - term: "مُدْمَجٌ أَرْسَاغُهُ"
    text: "مُحكَمة مفاصل قوائمه فوق الحوافر."
  - term: "عَبْلُ الْمَعَاقِمِ"
    text: "يقول محققا «الأصمعيات»: «المعاقم: المفاصل. والعبل: الممتلئ» [@asmaiyyat، ص141، الحاشية]."
