explained: false
first: "وَمُرَأَّسٍ أَقْصَدْتُ وَسْطَ جُمُوعِهِ"
second: "وَعِشَارِ رَاعٍ قَدْ أَخَذْتُ فَمَا تُرَى"
vocabulary:
  - term: "مُرَأَّسٍ"
    text: "يقول محققا «الأصمعيات»: «الرئيس» [@asmaiyyat، ص143، الحاشية]."
  - term: "أَقْصَدْتُ"
    text: "ينقل محققا «الأصمعيات» قول الأَصْمَعِيّ: «الإقصاد: القتل على كل حال» [@asmaiyyat، ص143، الحاشية]."
  - term: "عِشَارِ"
    text: "يقول محققا «الأصمعيات»: «جمع عشراء، وهى الناقة مضى عليها من لقحها عشرة أشهر» [@asmaiyyat، ص143، الحاشية]."
