explained: false
first: "ظَلَّتْ سَنَابِكُهَا عَلَى جُثْمَانِهِ"
second: "يَلْعَبْنَ دُحْرُوجَ الْوَلِيدِ وَقَدْ قَضَى"
vocabulary:
  - term: "سَنَابِكُهَا"
    text: "يقول محققا «الأصمعيات»: «يريد سنابك الخيل ولم يجر لها ذكرا» [@asmaiyyat، ص143، الحاشية]. والسنبك طرف الحافر."
  - term: "جُثْمَانِهِ"
    text: "جسده."
  - term: "دُحْرُوجَ الْوَلِيدِ"
    text: "ينقل محققا «الأصمعيات» عن الشنقيطية: «الدحروج: شىء يدحرجونه» [@asmaiyyat، ص143، الحاشية]، أي كرة الصبي."
  - term: "قَضَى"
    text: "مات."
