first: "وَمِنَ اللَّيَالِي لَيْلَةٌ مَزْؤُودَةٌ"
second: "غَبْرَاءُ لَيْسَ لِمَنْ تَجَشَّمَهَا هُدَى"
vocabulary:
  - term: "مَزْؤُودَةٌ"
    text: "يقول محققا «الأصمعيات»: «مزؤود فيها، يقال «رجل مزؤود» أى مذعور إذا فزع» [@asmaiyyat، ص143، الحاشية]."
  - term: "غَبْرَاءُ"
    text: "مظلمة يملؤها الغبار."
  - term: "تَجَشَّمَهَا"
    text: "يقول محققا «الأصمعيات»: «ركب أعظمها» [@asmaiyyat، ص143، الحاشية]."
