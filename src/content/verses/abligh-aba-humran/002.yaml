first: "بَاعُوا جَوَادَهُمُ لِتَسْمَنَ أُمُّهُمْ"
second: "وَلِكَيْ يَعُودَ عَلَى فِرَاشِهِمُ فَتَى"
meaning: "باع إخوة الشاعر فرس أبيهم بعد مقتله، وأنفقوا ثمنه ولبن الإبل على أمهم حتى تسمن، لكي يرغب فيها رجل فيتزوجها، فيعود إلى فراشهم، أي فراش البيت الذي كان لأبيهم، رجلٌ يضاجع أمهم. ويقول البَكْريّ: «أراد أنهم أخذوا دية أبيهم فآثروا أمّهم باللبن وعيالهم على خيلهم، فإذا سمنت أمّهم زوّجوها» [@simt، ج1 ص95]. فالهجاء أنهم قدّموا زواج أمهم على الثأر لأبيهم: باعوا الفرس، وهو عُدّة الثأر، واشتروا به لأمهم زوجًا."
vocabulary:
  - term: "جَوَادَهُمُ"
    text: "فرسهم الجيد السريع."
  - term: "لِتَسْمَنَ"
    text: "لتصير سمينة، والسِّمَن في المرأة عندهم مما يُرغب فيه."
  - term: "فِرَاشِهِمُ"
    text: "الفراش موضع النوم، وتسمّى به الزوجة: «يُقَالُ لامرأَة الرَّجُلِ: هِيَ فِراشُه وإِزارُه ولِحافُه»، و«المرأَة تُسَمَّى فِراشاً لأَن الرَّجُلَ يَفْتَرِشُها» [@lisan، ج6 ص327]. فالعودة إلى الفراش هنا الدخول على المرأة والجماع."
  - term: "فَتَى"
    text: "رجل شابّ."
context: "البيت الأول يقول إن قومه «ناجوا» أي تهامسوا في قبول دية الأب، وهذا البيت والذي بعده ما فعلوه بالدية وبفرس الأب. ثم يقابل ذلك بامرأته هو: يؤثرون أمهم باللبن، وهو يؤثر فرسه على امرأته حتى تبدو عظام صدرها (4–5). وهذان البيتان من الجانب الماجن في القصيدة، فهما هجاء للإخوة بشهوة أمهم. والبَكْريّ يروي البيت مع ما حوله [@simt، ج1 ص94–95]، ويقول محققا «الأصمعيات» إن الشاعر «فى هذه القصيدة يهجو إخوته لأبيه ويرميهم بأنهم آثروا تزويج أمهم بعد تسمينها» [@asmaiyyat، ص140، الحاشية]."
syntax:
  - "«بَاعُوا جَوَادَهُمُ»: «باعوا» فعل ماض، والواو فاعل، و«جوادَ» مفعول به منصوب، والهاء مضاف إليه، والميم علامة الجمع، وضُمّت لوصلها بما بعدها."
  - "«لِتَسْمَنَ أُمُّهُمْ»: اللام لام التعليل، و«تسمنَ» مضارع منصوب بـ«أنْ» مضمرة بعد اللام، و«أمُّهم» فاعل. والمصدر المؤول من «أن تسمن» مجرور باللام، متعلق بـ«باعوا»."
  - "«وَلِكَيْ يَعُودَ عَلَى فِرَاشِهِمُ فَتَى»: الواو عاطفة، واللام للتعليل، و«كي» حرف مصدري ونصب، و«يعودَ» مضارع منصوب بها، و«على فراشهم» جار ومجرور متعلق بـ«يعود»، و«فتى» فاعل مؤخر مرفوع بضمة مقدّرة على الألف المحذوفة لالتقاء الساكنين."
morphology:
  - "«جَواد» صفة على «فَعال» من «جاد يجود»، ويوصف بها الفرس الكريم السابق."
  - "«تَسْمَن» مضارع «سَمِنَ» على «فَعِلَ يَفْعَلُ»."
  - "«فِراش» على «فِعال» بمعنى المفعول، أي المفروش."
  - "«فَتًى» أصله «فَتَيٌ»، تحركت الياء وانفتح ما قبلها فقُلبت ألفًا، ثم حُذفت الألف لالتقائها ساكنة مع التنوين."
rhetoric:
  thesis: "هجاء بالأم: الإخوة باعوا آلة الثأر ليشتروا بها لأمهم زوجًا."
  devices:
    - title: "المقابلة في «بَاعُوا جَوَادَهُمُ لِتَسْمَنَ أُمُّهُمْ»"
      text: "جعل الفرس، وهو عُدّة الحرب والثأر، ثمنًا لسِمَن أمهم، فوزن عندهم شهوة الأم بالفرس فرجحت الشهوة. وعلى هذا المعنى البَكْريّ: «فآثروا أمّهم باللبن وعيالهم على خيلهم» [@simt، ج1 ص95]. وفي آخر القصيدة يقول هو: «أَنَّ الحُصُونَ الخَيْلُ لَا مَدَرُ القُرَى» (6)، فالقصيدة كلها جواب هذا البيت."
    - title: "الكناية في «يَعُودَ عَلَى فِرَاشِهِمُ فَتَى»"
      text: "لم يقل: تتزوج أمهم، ولا: يجامعها رجل، بل ذكر رجلًا يرجع إلى فراش البيت، والفراش في كلامهم المرأة والنكاح [@lisan، ج6 ص327]. وهي الكناية عند عبد القاهر الجُرْجانيّ: أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الإضافة في «فِرَاشِهِمُ»"
      text: "أضاف الفراش إلى الإخوة لا إلى الأم، فجعل الفضيحة فضيحتهم: الرجل يدخل فراشهم هم، أي بيتهم وحرمتهم. وفي «يعود» أن الفراش كان فيه رجل، وهو أبوهم، ثم يعود إليه رجل غيره. وهذه قراءتنا."
  connection: "ثم يصف ذلك الرجل حين يخلو بأمهم: «عِلْجٌ إِذَا مَا بَزَّ عَنْهَا ثَوْبَهَا»، فالبيتان متصلان."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الألف المقصورة"
  scansion: "بَاعُوجَوَا / دَهُمُولِتَسْ / مَنَأُمْمُهُمْ = مُتْفاعلن / متَفاعلن / متَفاعلن — وَلِكَيْ يَعُو / دَعَلَى فِرَا / شِهِمُو فَتَى = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر فصارت «مُتْفاعلن». وأُشبعت ضمة الميم في «جوادَهُمُ» و«فراشِهِمُ» فنُطقتا «جوادَهُمُو» و«فراشِهِمُو»."
