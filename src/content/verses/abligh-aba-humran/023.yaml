first: "فَنَهَضْتُ فِي الْبَرْكِ الْهُجُودِ وَفِي يَدِي"
second: "لَدْنُ الْمَهَزَّةِ ذُو كُعُوبٍ كَالنَّوَى"
vocabulary:
