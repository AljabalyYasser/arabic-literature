explained: false
first: "تُقْفَى بِعِيشَةِ أَهْلِهَا وَثَّابَةً"
second: "أَوْ جُرْشُعًا عَبْلَ الْمَحَازِمِ وَالشَّوَى"
vocabulary:
  - term: "تُقْفَى"
    text: "يقول محققا «الأصمعيات»: «تفضل وتؤثر» [@asmaiyyat، ص141، الحاشية]. والقَفِيّة عند البَكْريّ: «ما يؤثر به الضيف وذو الكرامة» [@simt، ج1 ص95]."
  - term: "بِعِيشَةِ أَهْلِهَا"
    text: "بالطعام الذي يعيش به أهلها، أي باللبن."
  - term: "وَثَّابَةً"
    text: "فرسًا كثيرة الوثب في عَدْوها."
  - term: "جُرْشُعًا"
    text: "يقول محققا «الأصمعيات»: «الغليظ المنتفخ الجنبين» [@asmaiyyat، ص141، الحاشية]."
  - term: "عَبْلَ الْمَحَازِمِ وَالشَّوَى"
    text: "يقول محققا «الأصمعيات»: «العبل: الممتلئ. المحازم: جمع محزم، وهو موضع الحزام. الشوى: الأطراف والقوائم» [@asmaiyyat، ص141، الحاشية]."
