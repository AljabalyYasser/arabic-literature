first: "عِلْجٌ إِذَا مَا بَزَّ عَنْهَا ثَوْبَهَا"
second: "وَتَخَامَصَتْ قَالَتْ لَهُ مَاذَا تَرَى"
meaning: "والرجل الذي يعود إلى فراشهم عِلْج، أي رجل غليظ شديد. إذا نزع عن أمهم ثوبها فصارت عارية أمامه، شدّت بطنها إلى الداخل لتبدو ضامرة البطن نحيلة الخصر، ثم سألته: ماذا ترى؟ أي كيف ترى جسدي؟ فهي امرأة عارية تعرض جسدها على رجل في الفراش وتطلب إعجابه قبل الجماع. ويقول البَكْريّ: «وتخامصت أدخلت يديه إلى بطنها لتريه أنها خميص» [@simt، ج1 ص95]، أي أخذت يديه فوضعتهما على بطنها ليلمس ضموره. ويقول محققا «الأصمعيات»: «تخامصت: تجافت عن الفراش ليظهر خمصها وضمورها» [@asmaiyyat، ص140، الحاشية]، أي رفعت بطنها عن الفراش وهي مستلقية. فهي على القولين تتجمّل له بجسدها العاري. والهجاء أن الأم التي سمّنها أبناؤها بثمن فرس أبيهم صارت تتزيّن لرجل غليظ، وأبناؤها راضون."
vocabulary:
  - term: "عِلْجٌ"
    text: "في اللسان: «العِلْج: الرَّجُلُ الشَّدِيدُ الْغَلِيظُ»، و«العِلْج: الرَّجُلُ مِنْ كفَّار الْعَجَمِ» [@lisan، ج2 ص326]. والمعنى الأول هو الذي يذكره محققا «الأصمعيات» [@asmaiyyat، ص140، الحاشية]، وفي الكلمة على المعنيين تحقير."
  - term: "بَزَّ"
    text: "نزع وسلب: «وبَزَّ الشيءَ يَبُزُّ بَزًّا: انْتَزَعَهُ» [@lisan، ج5 ص312]."
  - term: "تَخَامَصَتْ"
    text: "من الخَمَص، وهو ضمور البطن: «والتَّخامُصُ: التَّجَافِي عَنِ الشَّيْءِ» [@lisan، ج7 ص30]. أي جافت بطنها، فشدّته إلى الداخل أو رفعته عن الفراش، لتُري الرجل ضمورها."
  - term: "مَاذَا تَرَى"
    text: "كيف ترى جسدي؟ وما رأيك فيه؟"
context: "تمام البيت السابق: «وَلِكَيْ يَعُودَ عَلَى فِرَاشِهِمُ فَتَى / عِلْجٌ»، فهو يصف الفتى ثم ما يجري بينه وبين الأم. وهو أصرح بيت في القصيدة، ومن جانبها الماجن، ثم ينقلب الشاعر بعده إلى امرأته المجفوّة التي يؤثر عليها فرسه (4–5)، فتقابل الصورتان: أمّ تُسمَّن للرجال، وزوجة تجوع للخيل."
syntax:
  - "«عِلْجٌ»: نعت لـ«فتى» في آخر البيت السابق مرفوع، أو خبر لمبتدأ محذوف تقديره «هو». فالبيت متعلق بما قبله لا يتم معناه وحده، وهو التضمين، وتعريفه عند ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
  - "«إِذَا مَا بَزَّ عَنْهَا ثَوْبَهَا»: «إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط، و«ما» زائدة، و«بزّ» فعل الشرط، وفاعله ضمير العلج، و«عنها» متعلق بـ«بزّ»، و«ثوبَها» مفعول به."
  - "«وَتَخَامَصَتْ»: الواو عاطفة، والفعل معطوف على «بزّ»، وفاعله ضمير الأم."
  - "«قَالَتْ لَهُ مَاذَا تَرَى»: جملة «قالت» جواب الشرط لا محل لها. و«ماذا» اسم استفهام في محل نصب مفعول به مقدّم لـ«ترى»، أو «ما» اسم استفهام مبتدأ و«ذا» اسم موصول خبره. وجملة «ماذا ترى» في محل نصب مقول القول."
morphology:
  - "«عِلْج» على «فِعْل»، وجمعه «أَعْلاج» و«عُلُوج» [@lisan، ج2 ص326]."
  - "«بَزَّ» فعل ماض مضعّف على «فَعَلَ»، مضارعه «يَبُزُّ»."
  - "«تَخامَصَ» على «تَفاعَلَ» من «خَمَص»، وهو هنا لإظهار الصفة وتكلّفها: أظهرت الخَمَص وتكلّفته."
  - "«تَرَى» مضارع «رأى»، حُذفت همزته في المضارع تخفيفًا، وأصله «تَرْأَى»."
rhetoric:
  thesis: "مشهد امرأة عارية تتعرّض لرجل غليظ، يُحكى في أشدّ ألفاظه حسيّةً ليكون هجاءً لأبنائها."
  devices:
    - title: "الحوار في «قَالَتْ لَهُ مَاذَا تَرَى»"
      text: "نقل كلامها بلفظه، فأحضر المشهد كأن السامع يراه ويسمعه: لا يقول إنها تتزين له، بل يُسمعنا سؤالها. وهذه قراءتنا."
    - title: "الكناية في «وَتَخَامَصَتْ»"
      text: "لم يقل إنها تشتهيه أو تتعرض له، بل ذكر فعلها بجسدها: تضمر بطنها لتبدو جميلة. وهي الكناية عند عبد القاهر الجُرْجانيّ: أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "التقابل بين «عِلْجٌ» و«تَخَامَصَتْ»"
      text: "غِلظة الرجل في أول البيت، وتكلّف المرأة الرقّة والضمور في آخره؛ فهي تتجمّل لمن لا يستحق، وهذا موضع السخرية. وهذه قراءتنا."
  connection: "ثم يقابل أمهم بامرأته: «لَكِنْ قَعِيدَةُ بَيْتِنَا مَجْفُوَّةٌ / بَادٍ جَنَاجِنُ صَدْرِهَا وَلَهَا غِنَى»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الألف المقصورة"
  scansion: "عِلْجُنْ إِذَا / مَابَزْزَعَنْ / هَاثَوْبَهَا = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — وَتَخَامَصَتْ / قَالَتْ لَهُو / مَاذَا تَرَى = متَفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، تفعيلات الصدر الثلاث وتفعيلتي العجز الأخيرتين، فصارت «مُتْفاعلن». وأُشبعت ضمة الهاء في «لهُ» فنُطقت «لهو»."
variants:
  - reading: "عِلْجٌ إِذَا مَا ابْتَزَّ عَنْهَا ثَوْبَهَا"
    status: "رواية البَكْريّ"
    note: "[@simt، ج1 ص94]. و«ابتزّ» استلب، وفي اللسان: «وابْتَزَزْتُ الشيءَ: اسْتَلَبْتُه» [@lisan، ج5 ص312]؛ والمعنى واحد."
