    text: "يقول محققا «الأصمعيات»: «تجشم الردى: ركوبه على كره ومشقة» [@asmaiyyat، ص141، الحاشية]."
  - term: "مَدَرُ الْقُرَى"
    text: "يقول محققا «الأصمعيات»: «المدر: الطين اليابس. يريد بمدر القرى الحصون المبنية» [@asmaiyyat، ص141، الحاشية]."
