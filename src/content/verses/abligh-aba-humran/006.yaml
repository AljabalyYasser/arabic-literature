first: "وَلَقَدْ عَلِمْتُ عَلَى تَجَشُّمِيَ الرَّدَى"
second: "أَنَّ الْحُصُونَ الْخَيْلُ لَا مَدَرُ الْقُرَى"
vocabulary:
