explained: false
first: "بَاتَتْ كِلَابُ الْحَيِّ تَسْنَحُ بَيْنَنَا"
second: "يَأْكُلْنَ دَعْلَجَةً وَيَشْبَعُ مَنْ عَفَا"
vocabulary:
  - term: "تَسْنَحُ"
    text: "يقول محققا «الأصمعيات»: «تعرض» [@asmaiyyat، ص143، الحاشية]."
  - term: "دَعْلَجَةً"
    text: "ينقل محققا «الأصمعيات» عن الشنقيطية: «الدعلج: المتردد»، وعن اللسان: «الدعلجة التردد فى الذهاب والمجىء» و«الدعلجة: الأكل بنهمة» [@asmaiyyat، ص143، الحاشية]."
  - term: "مَنْ عَفَا"
    text: "يقول محققا «الأصمعيات»: «من أتى من الأضياف طالبا المعروف» [@asmaiyyat، ص143، الحاشية]."
