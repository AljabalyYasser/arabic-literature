explained: false
first: "يَخْرُجْنَ مِنْ خَلَلِ الْغُبَارِ عَوَابِسًا"
second: "كَأَصَابِعِ الْمَقْرُورِ أَقْعَى فَاصْطَلَى"
vocabulary:
  - term: "عَوَابِسًا"
    text: "يقول محققا «الأصمعيات»: «الكريهات المنظر لما هن فيه من الحرب والجهد» [@asmaiyyat، ص142، الحاشية]."
  - term: "الْمَقْرُورِ"
    text: "يقول محققا «الأصمعيات»: «الذى أصابه القر وهو البرد» [@asmaiyyat، ص142، الحاشية]."
  - term: "أَقْعَى فَاصْطَلَى"
    text: "جلس على أليتيه وقد نصب ساقيه، فاستدفأ بالنار؛ فخرجت أصابعه نحو النار متقبضة."
