explained: false
first: "يَا رُبَّ عَرْجَلَةٍ أَصَابُوا خَلَّةً"
second: "دَأَبُوا وَحَارَدَ لَيْلُهُمْ حَتَّى بَكَى"
vocabulary:
  - term: "عَرْجَلَةٍ ... حَارَدَ"
    text: "ينقل محققا «الأصمعيات» عن الشنقيطية: «عرجلة: رجالة، وجمعها عراجل. وحارد: قل» [@asmaiyyat، ص142، الحاشية]. والرَّجّالة: المشاة."
  - term: "خَلَّةً"
    text: "يقول محققا «الأصمعيات»: «الحاجة» [@asmaiyyat، ص142، الحاشية]."
  - term: "دَأَبُوا"
    text: "جدّوا في السير."
