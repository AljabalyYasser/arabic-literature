explained: false
first: "لَوْ كَانَ لِلدَّهْرِ مَالٌ عِنْدَ مُتْلِدِهِ"
second: "لَكَانَ لِلدَّهْرِ صَخْرٌ مَالَ قُنْيَانِ"
vocabulary:
  - term: "مُتْلِدِهِ"
    text: "الذي يُتلده، أي يحبسه، والتلاد المال العتيق؛ يقول: لو كان الدهر يقتني مالًا لاقتنى صخرًا [@sukkari-hudhaliyyin، ص284]."
  - term: "قُنْيَانِ"
    text: "إمساك، ويقتنيه: يتخذ منه قِنية [@sukkari-hudhaliyyin، ص284]."
sources:
