explained: false
first: "رَبَّاءُ مَرْقَبَةٍ مَنَّاعُ مَغْلَبَةٍ"
second: "رَكَّابُ سَلْهَبَةٍ قَطَّاعُ أَقْرَانِ"
vocabulary:
  - term: "رَبَّاءُ مَرْقَبَةٍ"
    text: "المرقبة موضع يُرتقب فيه، وهو يربأ فيها لأصحابه، ينظر لهم ويحفظ [@sukkari-hudhaliyyin، ص285]."
  - term: "مَنَّاعُ مَغْلَبَةٍ"
    text: "يمنع أن يُغلب [@sukkari-hudhaliyyin، ص285]."
  - term: "سَلْهَبَةٍ"
    text: "الفرس الطويلة [@sukkari-hudhaliyyin، ص285]."
  - term: "قَطَّاعُ أَقْرَانِ"
    text: "لا يثبت على ما لا ينبغي عليه الثبات، يصل ويقطع [@sukkari-hudhaliyyin، ص285]."
