explained: false
first: "حَامِي الْحَقِيقَةِ نَسَّالُ الْوَدِيقَةِ مِعْـ"
second: "ـتَاقُ الْوَسِيقَةِ جَلْدٌ غَيْرُ ثُنْيَانِ"
vocabulary:
  - term: "حَامِي الْحَقِيقَةِ"
    text: "يحمي ما يحقّ عليه أن يحميه [@sukkari-hudhaliyyin، ص284–285]."
  - term: "نَسَّالُ الْوَدِيقَةِ"
    text: "يعدو في الوديقة، وهي شدة الحر [@sukkari-hudhaliyyin، ص284–285]."
  - term: "مِعْتَاقُ الْوَسِيقَةِ"
    text: "الوسيقة الطريدة، إذا طرد طريدة أنجاها من أن تُدرك [@sukkari-hudhaliyyin، ص284–285]."
  - term: "ثُنْيَانِ"
    text: "الضعيف، والثنيان دون السيد [@sukkari-hudhaliyyin، ص284–285]."
sources:
  - source: "sukkari-hudhaliyyin"
    loc: "ص284–285"
