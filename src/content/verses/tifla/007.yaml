explained: false
first: وَكُلَيْبٍ سُمِّ الْفَوَارِسِ إِذْ حُمْـ
second: ـمَ رَمَاهُ الْكُمَاةُ بِالْإِيفَاقِ
vocabulary:
- term: كُلَيْبٍ
  text: كُلَيْب وائِل، أخو المهلهل، «الذي هاجت بمقتله حرب بَكْر وتَغْلِب» [@ibn-qutayba، ج1 ص288].
- term: سُمِّ الْفَوَارِسِ
  text: يقتل الفرسان كما يقتل السمّ.
- term: الْكُمَاةُ
  text: الشجعان المتسلّحون، الواحد كَمِيّ.
- term: بِالْإِيفَاقِ
  text: بتهيئة السهام للرمي؛ «أوفق الرامي إيفاقا إذا جعل الفوق في الوتر» [@lisan، ج10 ص383].
