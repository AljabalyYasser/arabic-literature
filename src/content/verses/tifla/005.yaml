first: بَعْدَ عَمْرٍو وَعَامِرٍ وَحُيَيٍّ
second: وَرَبِيعِ الصَّدُوفِ وَابْنَيْ عَنَاقِ
vocabulary:
- term: عَمْرٍو وَعَامِرٍ وَحُيَيٍّ
  text: من قتلى تَغْلِب في حربها مع بَكْر. وفي خبر رواه أبو الفرج أن القتلى المعدودين «ثمانية نفر من تَغْلِب وأربعة من بَكْر عددهم مُهَلْهِل في شعريه» [@aghani، ج5 ص57].
- term: رَبِيعِ الصَّدُوفِ وَابْنَيْ عَنَاقِ
  text: 'من قتلى تَغْلِب أيضًا؛ وقال راوي الخبر بعد إيراد الأبيات: «فهؤلاء ثمانية من تَغْلِب» [@aghani، ج5 ص60].'
