explained: false
first: طَفْلَةٌ مَا ابْنَةُ الْمُحَلِّلِ بَيْضَاـ
second: ـءُ لَعُوبٌ لَذِيذَةٌ فِي الْعِنَاقِ
vocabulary:
- term: طَفْلَةٌ
  text: ناعمة؛ «وجارية طفلة إذا كانت رقيقة البشرة ناعمة» [@lisan، ج11 ص403].
- term: الْمُحَلِّلِ
  text: المحلِّل بن ثعلبة، خال المهلهل من بني يَشْكُر؛ دفعه إليه آسرُه عَمْرو بن مالك، فسقاه خمرًا فغنّى بهذه الأبيات [@aghani، ج5 ص56].
- term: لَعُوبٌ
  text: «حسنة الدل» [@lisan، ج1 ص740].
