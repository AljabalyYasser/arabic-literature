first: "إِنَّ تَحْتَ الْأَحْجَارِ حَدًّا وَلِينًا"
second: "وَخَصِيمًا أَلَدَّ ذَا مِعْلَاقِ"
meaning: "إن تحت حجارة القبر رجلًا يجمع الحِدّة واللين، وخصمًا شديد الخصومة، إذا تعلّق بخصمه لم يفلته."
vocabulary:
  - term: "الْأَحْجَارِ"
    text: "حجارة القبر."
  - term: "حَدًّا وَلِينًا"
    text: "حِدّةً وبأسًا، ولينًا."
  - term: "أَلَدَّ"
    text: "الشديد الخصومة. قال المُبَرِّد: «فأصله الشديد الخصومة، يقال: خصم ألد، أي لا ينثني عن خصمه» [@kamil، ج1 ص36]."
  - term: "ذَا مِعْلَاقِ"
    text: "قال المُبَرِّد: «فإنما يريد أنه إذا علق خصمًا لم يتخلص منه» [@kamil، ج1 ص36]."
syntax:
  - "«إِنَّ تَحْتَ الْأَحْجَارِ حَدًّا»: «تَحْتَ» ظرف في موضع خبر «إنّ» المقدم، و«حَدًّا» اسمها المؤخر، و«لِينًا» معطوف عليه."
  - "«وَخَصِيمًا» معطوف على «حَدًّا»، و«أَلَدَّ» صفة له، و«ذَا مِعْلَاقِ» صفة ثانية."
  - "لم يذكر كُلَيْبًا باسمه في البيت: قدّم المكان «تحت الأحجار»، وأخّر صاحبه، ووصفه بالصفات وحدها."
morphology:
  - "«أَلَدّ» على «أَفْعَل»، وجمعه «لُدّ»، ومنه قوله تعالى: «وَتُنْذِرَ بِهِ قَوْمًا لُدًّا» [@kamil، ج1 ص36]."
  - "«مِعْلَاق» على «مِفْعال» من «علق»، ويروى «مِغْلاق» من «أغلق» [@kamil، ج1 ص36]."
rhetoric:
  thesis: "يرثي كُلَيْبًا دون أن يسميه: رجل تحت الحجارة يجمع الحِدّة واللين، ولا يفلت منه خصم."
  devices:
    - title: "الطباق بين «حدًّا» و«لينًا»"
      text: "جمع في الميت الصفتين المتضادتين: حدة على من عاداه، ولين لمن سالمه. فالرجل الكامل عنده من يعرف متى يشتد ومتى يلين."
    - title: "«تحت الأحجار»"
      text: "لم يقل «في القبر»، بل ذكر الحجارة التي تُركم عليه؛ فصار القبر ثقلًا حاضرًا فوق الرجل، وصارت الصفات الحية كلها «تحت» هذا الثقل."
    - title: "تقديم الظرف"
      text: "قدّم «تحت الأحجار» على اسم «إنّ»، فبدأ البيت بالقبر قبل صاحبه، ثم كشف ما تحته صفة بعد صفة."
  connection: "ثم يشبهه بحية في جحرها لا ينفع الملدوغَ منها رُقْية راقٍ."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ القاف المكسورة"
  scansion: "إِنْنَتَحْتَلْ / أَحْجَارِحَدْ / دَنْوَلِينَا = فاعلاتن / مستفعلن / فاعلاتن — وَخَصِيمَنْ / أَلَدْدَذَا / مِعْلَاقِي = فعلاتن / متفعلن / مفعولن"
  note: "دخل التشعيث الضرب، وهو حذف العين من «فاعلاتن»، فصارت «فالاتن»، وتنقل إلى «مفعولن»؛ ويحدث التشعيث في الضرب [@atiq، ص98–99]."
context: "من أبيات يعدّ فيها قتلى تَغْلِب، وآخرهم كُلَيْب: «وكليبٍ سُمّ الفوارس»، ثم هذا البيت وبيت الحية بعده [@aghani، ج5 ص59–60]. واستشهد المُبَرِّد بالبيت على معنى «الألد» [@kamil، ج1 ص36]. ويذكر شوقي ضيف أن المُهَلْهِل كان يغني في هذه القصيدة، ويستدل بذلك على أن «الشعر الجاهلي ارتبط بالغناء عند أقدم شعرائه» [@deif، ج1 ص190]."
