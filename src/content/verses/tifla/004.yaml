- term: سُقُوا بِكَأْسِ حَلَاقِ
  text: 'ماتوا جميعًا؛ «يعني أنهم استؤصلوا بالموت، وحلاق: اسم للمنية لأنه يستأصل الأحياء كما يستأصل الحلق الشعر» [@maydani، ج1 ص342].'
