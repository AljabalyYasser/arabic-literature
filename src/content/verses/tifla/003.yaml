first: "ضَرَبَتْ نَحْرَهَا إِلَيَّ وَقَالَتْ"
second: "يَا عَدِيًّا لَقَدْ وَقَتْكَ الْأَوَاقِي"
meaning: "ضربت صدرها حين أقبلت عليّ، وقالت: يا عَدِيّ، لقد حمتك الواقيات من الموت فنجوت."
vocabulary:
  - term: "نَحْرَهَا"
    text: "أعلى صدرها."
  - term: "عَدِيًّا"
    text: "اسم الشاعر في قول من يقول إن اسم المُهَلْهِل عَدِيّ."
  - term: "وَقَتْكَ"
    text: "حمتك. و«وقاه: صانه» [@lisan، ج15 ص401]."
  - term: "الْأَوَاقِي"
    text: "جمع واقية، وهي ما يقي الإنسان ويحميه [@lisan، ج15 ص401]."
syntax:
  - "«ضَرَبَتْ نَحْرَهَا إِلَيَّ»: الفاعل ضمير يعود على ابنة المحلل في مطلع القصيدة، و«نَحْرَهَا» مفعول به، و«إِلَيَّ» متعلق بمحذوف: ضربت نحرها مقبلةً إليّ."
  - "«يَا عَدِيًّا»: منادى علم مفرد، وحقه البناء على الضم «يا عديُّ»، ونُوّن ونُصب لضرورة الشعر."
  - "«لَقَدْ وَقَتْكَ الْأَوَاقِي»: اللام واقعة في جواب قسم مقدّر، و«قد» للتحقيق، و«الْأَوَاقِي» فاعل مؤخر."
morphology:
  - "«الْأَوَاقِي» جمع «واقية» على «فواعل»، وأصله «وَوَاقِي»: اجتمعت واوان في أول الكلمة، فقُلبت الأولى همزة. قال ابن مَنْظُور: «إنما أراد الواو في جمع واقية، فهمز الواو الأولى» [@lisan، ج15 ص401]."
  - "«وَقَتْكَ» ماضي «وقى يقي»، حُذفت ألفه لالتقاء الساكنين حين اتصلت به تاء التأنيث الساكنة: وقى + تْ = وَقَتْ."
rhetoric:
  thesis: "بيت يرد فيه اسم عَدِيّ على لسان امرأة تفرح بنجاته. ولهذا صار شاهدًا في مسألتين معًا: اسم المُهَلْهِل، ونسبة القصيدة إليه."
  devices:
    - title: "كلام المرأة بلفظها"
      text: "ينقل كلامها كما قالته: «يا عديًّا لقد وقتك الأواقي». فتدخل القصيدة لحظة حية: امرأة تضرب صدرها، والشاعر في القيد."
    - title: "الحركة بدل الوصف"
      text: "«ضربت نحرها» حركة واحدة تغني عن وصف طويل لفزعها وفرحها معًا."
    - title: "شاهد على الاسم، وموضع للشك"
      text: "احتج البغدادي بهذا البيت على أن اسم المُهَلْهِل عَدِيّ: «ويدل له أنه ذكر اسمه في شعره» [@khizana، ج2 ص164]. لكن في حاشية اللسان نقلًا عن «التكملة» أن البيت ليس للمهلهل، «وإنما هو لأخيه عدي يرثي مهلهلًا» [@lisan، ج15 ص401، الحاشية]. وينقل المَرْزُبانيّ عن سلمة بن عاصم أن عَدِيًّا أخا المُهَلْهِل قال القصيدة «لما مات أخوه مُهَلْهِل» [@marzubani، ص248]. فالبيت الذي يُحتج به على اسمه هو نفسه موضع الشك في نسبة القصيدة إليه."
  connection: "ثم يقول إنه لا يرجو شيئًا في العيش بعد ندمائه الذين سُقوا كأس الموت، ويعدّهم واحدًا واحدًا."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ القاف المكسورة"
  scansion: "ضَرَبَتْنَحْ / رَهَا إِلَيْ / يَوَقَالَتْ = فعلاتن / متفعلن / فعلاتن — يَاعَدِيْيَنْ / لَقَدْ وَقَتْ / كَلْأَوَاقِي = فاعلاتن / متفعلن / فاعلاتن"
  note: "دخل الخَبْن «فاعلاتن» في أول الصدر وآخره فصارت «فعلاتن»، ودخل «مستفع لن» في الشطرين فصارت «متفع لن» [@atiq، ص98]."
context: "في «الأغاني» أن المُهَلْهِل أُسر في آخر الحرب، فطلبه خاله المحلل بن ثعلبة من آسره ليكون عنده، فسقاه خمرًا، «فلما طابت نفسه تغنى» بهذه القصيدة حتى فرغ منها [@aghani، ج5 ص56]. فابنة المحلل التي يتغزل بها في مطلعها ابنة خاله."
