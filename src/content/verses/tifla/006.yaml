first: وَامْرِئِ الْقَيْسِ مَيِّتٍ يَوْمَ أَوْدَى
second: ثُمَّ خَلَّى عَلَيَّ ذَاتَ الْعَرَاقِي
vocabulary:
- term: امْرِئِ الْقَيْسِ
  text: من قتلى تَغْلِب الثمانية المعدودين في هذه الأبيات [@aghani، ج5 ص60].
- term: أَوْدَى
  text: هلك.
- term: ذَاتَ الْعَرَاقِي
  text: الداهية؛ «سميت بذلك لأن ذات العراقي هي الدلو والدلو من أسماء الداهية» [@lisan، ج10 ص249].
