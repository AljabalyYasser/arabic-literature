explained: false
first: حَيَّةٌ فِي الْوِجَارِ أَرْبَدُ لَا تَنْـ
second: ـفَعُ مِنْهُ السَّلِيمَ نَفْثَةُ رَاقِ
vocabulary:
- term: الْوِجَارِ
  text: «سرب الضبع ونحوه إذا حفر فأمعن» [@lisan، ج5 ص280].
- term: أَرْبَدُ
  text: 'في لونه غبرة؛ «الربدة: الغبرة؛ وقيل: لون إلى الغبرة» [@lisan، ج3 ص170].'
- term: السَّلِيمَ
  text: '«اللديغ»، وقيل: سُمّي بذلك «على التفاؤل له» بالسلامة [@lisan، ج12 ص292].'
- term: نَفْثَةُ رَاقِ
  text: ما ينفثه الراقي من ريقه حين يرقي.
