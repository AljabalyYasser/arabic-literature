explained: false
first: خُدَارِيَّةٌ سَفْعَاءُ لَبَّدَ رِيشَهَا
second: مِنَ الطَّلِّ يَوْمٌ ذُو أَهَاضِيبَ مَاطِرُ
vocabulary:
- term: خُدَارِيَّةٌ
  text: '«التي يضرب لونها إلى السواد، وهي صفة للعقاب» [@mufaddaliyyat، ص165، الحاشية].'
- term: سَفْعَاءُ
  text: 'من السُّفْعة، «وهي سواد يضرب إلى حمرة» [@mufaddaliyyat، ص165، الحاشية].'
- term: لَبَّدَ رِيشَهَا
  text: بلّله المطر فلصق بعضه ببعض.
- term: أَهَاضِيبَ
  text: '«جمع أهضوبة، وهي المطرة العظيمة» [@mufaddaliyyat، ص165، الحاشية].'
