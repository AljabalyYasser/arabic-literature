explained: false
first: فَإِنْ أَسْتَطِعْ لَا تَلْتَبِسْ بِي مُقَاعِسٌ
second: وَلَا يَرَنِي مَبْدَاهُمُ وَالْمَحَاضِرُ
vocabulary:
- term: لَا تَلْتَبِسْ بِي
  text: 'لا تختلط بي، «والمراد لا يدركوني» [@mufaddaliyyat، ص166، الحاشية].'
- term: مَبْدَاهُمُ وَالْمَحَاضِرُ
  text: 'أهل باديتهم وأهل حاضرتهم: «من بدا منهم في البادية»، و«من نزل الحاضرة» [@mufaddaliyyat، ص166، الحاشية].'
