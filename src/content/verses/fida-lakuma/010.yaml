first: يُذَكِّرُنِي بِالرِّحْمِ بَيْنِي وَبَيْنَهُ
second: وَقَدْ كَانَ فِي نَهْدٍ وَجَرْمٍ تَدَابُرُ
vocabulary:
- term: الرِّحْمِ
  text: 'القرابة؛ «هو الرحم بفتح فكسر» [@mufaddaliyyat، ص166، الحاشية].'
- term: تَدَابُرُ
  text: '«تقاطع» [@mufaddaliyyat، ص166، الحاشية]. وفي «الأغاني» أن نَهْدًا «قتلت أخا وعلة الجرمي» [@aghani-dk، ج22 ص219].'
