first: كَأَنَّا وَقَدْ حَالَتْ حُذُنَّةُ دُونَنَا
second: نَعَامٌ تَلَاهُ فَارِسٌ مُتَوَاتِرُ
vocabulary:
- term: حُذُنَّةُ
  text: '«أرض لبني عامر بن صعصعة» [@mufaddaliyyat، ص166، الحاشية].'
- term: تَلَاهُ فَارِسٌ مُتَوَاتِرُ
  text: 'تبعه فارس متتابع العَدْو؛ «شبهوا أنفسهم حين هربوا بنعام يخاف فارسا يتبعه» [@mufaddaliyyat، ص166، الحاشية].'
