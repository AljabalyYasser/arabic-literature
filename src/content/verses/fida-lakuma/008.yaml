explained: false
first: وَلَا تَكُ لِي حَدَّادَةٌ مُضَرِيَّةٌ
second: إِذَا مَا غَدَتْ قُوتَ الْعِيَالِ تُبَادِرُ
vocabulary:
- term: حَدَّادَةٌ
  text: 'سجّانة؛ «الحداد: البواب والسجان» [@mufaddaliyyat، ص166، الحاشية]. يخشى أن يُؤسر فتحبسه امرأة من مُضَر.'
- term: قُوتَ الْعِيَالِ تُبَادِرُ
  text: '«أي إذا غدت فإنما همها قوت عيالها، فكيف يكون حالي إذا كان من أسرني هذه حاله من الضيق» [@mufaddaliyyat، ص166، الحاشية].'
