explained: false
first: فِدًى لَكُمَا رِجْلَيَّ أُمِّي وَخَالَتِي
second: غَدَاةَ الْكُلَابِ إِذْ تُحَزُّ الدَّوَابِرُ
vocabulary:
- term: رِجْلَيَّ
  text: يخاطب رجليه اللتين نجا عليهما، ويفديهما بأمه وخالته.
- term: الْكُلَابِ
  text: '«هو يوم الكلاب الثاني بين تميم واليمن» [@mufaddaliyyat، ص165، الحاشية].'
- term: تُحَزُّ الدَّوَابِرُ
  text: 'تُقطع الأعقاب؛ قال أبو عُبَيْدة: «أمر قيس بن عاصم أن يتبعوا المنهزمة ويقطعوا عرقوب من لحقوا ولا يشتغلوا بقتلهم عن اتّباعهم فجزّوا دوابرهم» [@iqd، ج6 ص82].'
