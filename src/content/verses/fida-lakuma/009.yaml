explained: false
first: 'يَقُولُ لِيَ النَّهْدِيُّ: إِنَّكَ مُرْدِفِي'
second: وَكَيْفَ رِدَافُ الْفَلِّ، أُمُّكَ عَابِرُ
vocabulary:
- term: النَّهْدِيُّ
  text: '«رجل من بني نهد، يقال له سليط بن قتب» [@mufaddaliyyat، ص166، الحاشية].'
- term: مُرْدِفِي
  text: 'تحملني خلفك على فرسك؛ والرِّداف «أن يركب شخص آخر خلفه» [@mufaddaliyyat، ص166، الحاشية].'
- term: الْفَلِّ
  text: '«المهزوم» [@mufaddaliyyat، ص166، الحاشية].'
- term: أُمُّكَ عَابِرُ
  text: 'دعاء عليه؛ «العابر: العبرى، أي الباكية الحزينة» [@mufaddaliyyat، ص166، الحاشية].'
