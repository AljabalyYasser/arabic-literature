explained: false
first: فَمَا نُطْفَةٌ بِالطَّوْدِ أَوْ بِضَرِيَّةٍ
second: بَقِيَّةُ سَيْلٍ أَحْرَزَتْهَا الوَقَائِعُ
vocabulary:
- term: نُطْفَةٌ
  text: '«النطفة: الماء الصافي قل أو كثر» [@aghani-dk، ج14 ص155، الحاشية].'
- term: بِالطَّوْدِ أَوْ بِضَرِيَّةٍ
  text: '«والطود: الجبل. وضرية: بئر» [@aghani-dk، ج14 ص155، الحاشية].'
- term: الوَقَائِعُ
  text: «والوقائع جمع وقيعة، وهي النقرة في الجبل يستنقع فيها الماء» [@aghani-dk، ج14 ص155، الحاشية].
