explained: false
first: سَعَى بَيْنَهُمْ واشٍ بِأَفْلاقِ بِرْمَةٍ
second: لِيَفْجَعَ بِالأَظْعانِ مَنْ هُوَ جازِعُ
vocabulary:
- term: واشٍ
  text: نمّام يفسد بين المحبين.
- term: بِأَفْلاقِ بِرْمَةٍ
  text: '«برمة: عرض من أعراض المدينة قرب «بلاكث» بين خيبر ووادي القرى، وهي عيون ونخل لقريش. وأفلاق جمع فلق كسبب، وهو المطمئن من الأرض بين ربوتين» [@aghani-dk، ج14 ص156، الحاشية].'
- term: بِالأَظْعانِ
  text: 'بالنساء الراحلات في هوادجهن؛ والظعينة عند المحققين: «المرأة ما دامت في الهودج» [@aghani-dk، ج14 ص155، الحاشية].'
