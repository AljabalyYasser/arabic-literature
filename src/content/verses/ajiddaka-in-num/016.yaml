explained: false
first: يُطِيفُ بِها حَرّانُ صادٍ وَلا يَرَى
second: إِلَيْها سَبِيلًا غَيْرَ أَنْ سَيُطالِعُ
vocabulary:
- term: يُطِيفُ بِها
  text: '«أطاف به: ألم به وقاربه» [@aghani-dk، ج14 ص155، الحاشية].'
- term: حَرّانُ صادٍ
  text: '«حران صاد: عطشان» [@aghani-dk، ج14 ص155، الحاشية].'
- term: سَيُطالِعُ
  text: '«طالعه: اطلع عليه أي أشرف» [@aghani-dk، ج14 ص155، الحاشية]، فهو ينظر إلى الماء ولا يصل إليه.'
