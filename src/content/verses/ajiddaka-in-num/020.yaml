first: بَكَتْ مِنْ حَدِيثٍ بَثَّهُ وَأَشَاعَهُ
second: وَرَصَّفَهُ وَاشٍ مِنَ القَوْمِ رَاصِعُ
vocabulary:
- term: بَثَّهُ … وَرَصَّفَهُ
  text: '«بث الخبر: نشره، ورصف الشيء كقتل: ضم بعضه إلى بعض ونظمه» [@aghani-dk، ج14 ص156، الحاشية].'
- term: رَاصِعُ
  text: يعقد الكلام بعضه ببعض ويلفّقه.
