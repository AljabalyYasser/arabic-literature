first: وَما خِلْتُ بَيْنَ الحَيِّ حَتَّى رَأَيْتُهُمْ
second: بِبَيْنُونَةَ السُّفْلَى وَهَبَّتْ سَوافِعُ
vocabulary:
- term: خِلْتُ
  text: ظننت.
- term: بَيْنَ الحَيِّ
  text: 'فراقهم: «البين: الفراق» [@aghani-dk، ج14 ص157، الحاشية].'
- term: بِبَيْنُونَةَ
  text: '«وبينونة: موضع بين عمان والبحرين» [@aghani-dk، ج14 ص157، الحاشية].'
- term: سَوافِعُ
  text: '«السوافع: لوافح السموم» [@aghani-dk، ج14 ص157، الحاشية]، وهي الرياح الحارّة.'
