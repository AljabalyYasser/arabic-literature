first: فَقُلْتُ لِأَصْحَابِي اصْطَلُوا النَّارَ إِنَّهَا
second: قَرِيبٌ فَقَالُوا بَلْ مَكَانُكَ نَافِعُ
vocabulary:
- term: اصْطَلُوا النَّارَ
  text: 'استدفئوا بها؛ قال المحققون: «يريد جدوا في السير لنصطلي النار إنها قريب» [@aghani-dk، ج14 ص155، الحاشية].'
- term: بَلْ مَكَانُكَ نَافِعُ
  text: بل الزم مكانك، فهو أنفع لك.
