first: وَقَدْ يَلْتَقِي بَعْدَ الشَّتَاتِ أُولُو النَّوَى
second: وَيَسْتَرْجِعُ الحَيَّ السَّحَابُ اللَّوَامِعُ
vocabulary:
- term: الشَّتَاتِ
  text: التفرّق.
- term: وَيَسْتَرْجِعُ الحَيَّ
  text: «يسترجع الحي، أي يرجعهم ويردهم» [@aghani-dk، ج14 ص154، الحاشية].
- term: اللَّوَامِعُ
  text: التي يلمع برقها، فيعود إليها القوم طلبًا للمرعى.
