explained: false
first: فَيَا لَكَ مِنْ حَادٍ حَبَوْتَ مُقَيَّدًا
second: وَأَنْحَى عَلَى عِرْنِينِ أَنْفِكَ جَادِعُ
vocabulary:
- term: حَادٍ
  text: سائق الإبل.
- term: حَبَوْتَ مُقَيَّدًا
  text: 'سرت بطيئًا كأنك تحبو في قيد. وفي حاشية المحققين: «إنك تسير سيرا بطيئا كحبو الصبي مقيدا» [@aghani-dk، ج14 ص155، الحاشية]، ويرون في البيت تحريفًا في الأصول.'
- term: عِرْنِينِ أَنْفِكَ
  text: أعلى الأنف. ودعاء العرب بجدع الأنف دعاء بالذل.
