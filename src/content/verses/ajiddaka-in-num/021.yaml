explained: false
first: بَكَتْ عَيْنُ مَنْ أَبْكاكِ لا يَعْرِفُ البُكا
second: وَلا تَتَخالَجْكِ الأُمُورُ النَّوازِعُ
vocabulary:
- term: بَكَتْ عَيْنُ مَنْ أَبْكاكِ
  text: 'دعاء على الواشي: أبكى الله عين من أبكاك.'
- term: تَتَخالَجْكِ
  text: '«تخالجته الهموم: نازعته» [@aghani-dk، ج14 ص143، الحاشية].'
- term: النَّوازِعُ
  text: «التي تنزع النفوس من صدورها» [@aghani-dk، ج14 ص143، الحاشية].
