explained: false
first: وَما إِنْ خَذُولٌ نازَعَتْ حَبْلَ حابِلٍ
second: لِتَنْجُوَ إِلّا اسْتَسْلَمَتْ وَهْيَ ظالِعُ
vocabulary:
- term: خَذُولٌ
  text: '«الخذول من الظباء والبقر: التي تخذل صواحباتها وتتخلف عن القطيع وتنفرد مع ولدها» [@aghani-dk، ج14 ص154، الحاشية].'
- term: حَبْلَ حابِلٍ
  text: حبالة صائد نصبها لها.
- term: ظالِعُ
  text: 'عرجاء؛ «ظلع كمنع: غمز في مشيه» [@aghani-dk، ج14 ص154، الحاشية].'
