first: أَجِدَّكَ إِنْ نُعْمٌ نَأَتْ أَنْتَ جازِعُ
second: قَدِ اقْتَرَبَتْ لَوْ أَنَّ ذَلِكَ نافِعُ
vocabulary:
- term: أَجِدَّكَ
  text: أحقًّا؟ استفهام فيه تعجب.
- term: نُعْمٌ
  text: 'صاحبته، وهي أم مالك أخت قَبِيصة بن ذُؤَيْب: «واسمها نعم بنت ذؤيب» [@aghani-dk، ج14 ص154].'
- term: نَأَتْ
  text: بعُدت.
- term: جازِعُ
  text: حزين قليل الصبر.
