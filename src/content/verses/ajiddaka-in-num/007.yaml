first: فَقَالَتْ لِقَاءٌ بَعْدَ حَوْلٍ وَحِجَّةٍ
second: وَشَحْطُ النَّوَى إِلَّا لِذِي العَهْدِ قَاطِعُ
vocabulary:
- term: حَوْلٍ
  text: عام.
- term: وَحِجَّةٍ
  text: '«الحجة: السنة» [@aghani-dk، ج14 ص154، الحاشية]، فاللقاء بعد عامين.'
- term: وَشَحْطُ النَّوَى
  text: '«والشحط: البعد» [@aghani-dk، ج14 ص154، الحاشية]، و«النوى: البعد» [@aghani-dk، ج14 ص154، الحاشية].'
