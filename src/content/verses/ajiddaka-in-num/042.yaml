first: فَقُلْتُ لَهَا تَاللّهِ يَدْرِي مُسَافِرٌ
second: إِذَا أَضْمَرَتْهُ الأَرْضُ مَا اللّهُ صَانِعُ
vocabulary:
- term: تَاللّهِ يَدْرِي
  text: والله لا يدري، وحُذفت «لا» من جواب القسم.
- term: أَضْمَرَتْهُ الأَرْضُ
  text: غيّبته في بُعدها.
sources:
