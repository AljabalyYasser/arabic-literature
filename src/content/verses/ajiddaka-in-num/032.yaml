first: فَما زِلْتُ تَحْتَ السِّتْرِ حَتَّى كَأَنَّنِي
second: مِنَ الحَرِّ ذُو طِمْرَيْنِ فِي البَحْرِ كارِعُ
vocabulary:
- term: طِمْرَيْنِ
  text: 'ثوبين باليين: «الطمر: الثوب الخلق» [@aghani-dk، ج14 ص157، الحاشية].'
- term: كارِعُ
  text: «وكل خائض ماء كارع، شرب أو لم يشرب» [@aghani-dk، ج14 ص157، الحاشية]، يريد أن العرق غمره.
