first: يُرِيحُ عَلَيَّ اللَّيْلُ أَضْيَافَ مَاجِدٍ
second: كَرِيمٍ وَمَالِي سَارِحًا مَالُ مُقْتِرِ
meaning: يرد عليّ الليل ضيوفًا كضيوف رجل ماجد كريم، فإبلي تعود إليّ مساءً فينزل بها الأضياف ويأكلون، وإذا خرجت في الصباح إلى المرعى رأيتَ مالي قليلًا كمال الفقير، لأنني أنفقته.
vocabulary:
- term: يُرِيحُ
  text: '«يرد» [@asmaiyyat، ص47، الحاشية]؛ من أراح الإبلَ: ردّها إلى مراحها مساءً.'
- term: مَاجِدٍ
  text: «يريد نفسه» [@asmaiyyat، ص47، الحاشية].
- term: مَالِي
  text: «إبلى» [@asmaiyyat، ص47، الحاشية].
- term: سَارِحًا
  text: خارجًا إلى المرعى في الصباح.
- term: مُقْتِرِ
  text: فقير قليل المال.
context: 'آخر القصيدة، وفيه جواب أخير للّائمة: المال الذي تخاف عليه لا يبقى عنده، بل يذهب في الأضياف. وقال ابن السِّكِّيت: «يقول: إذا راحت إبلي جاء فيها الأضياف والأيتام والكُلول فتعشو، ثم تغدو إلى الرعي فلا تُتبَع فتُرى قِلّتُها» [@diwan-urwa، ص50]. والكُلول: الضعفاء الذين يعولهم.'
syntax:
- «يُرِيحُ» فعل مضارع، و«اللَّيْلُ» فاعله، و«أَضْيَافَ» مفعول به، و«عَلَيَّ» متعلق بالفعل.
- «مَاجِدٍ كَرِيمٍ» مضاف إليه ونعته.
- '«وَمَالِي سَارِحًا مَالُ مُقْتِرِ» جملة اسمية حالية: «مالي» مبتدأ، و«سارحًا» حال، و«مال مقتر» خبر.'
morphology:
- «يُرِيح» مضارع «أراح» على «أَفْعَلَ».
- '«سَارِح» اسم فاعل من «سَرَحَت الإبلُ»: خرجت إلى المرعى غدوة.'
- '«مُقْتِر» اسم فاعل من «أقتر»: افتقر.'
rhetoric:
  thesis: 'يختم عروة بصورة يومه: في المساء أضياف ماجد، وفي الصباح مال فقير. فهو غني بما يعطي، فقير بما يبقى عنده.'
  devices:
  - title: المقابلة بين «يُرِيحُ» و«سَارِحًا»، وبين «مَاجِدٍ كَرِيمٍ» و«مُقْتِرِ»
    text: 'الإراحة رجوع الإبل مساءً، والسروح خروجها صباحًا؛ والماجد الكريم يقابل المقتر الفقير. فيرسم البيت يومًا كاملًا: كرم في المساء وقلة في الصباح، وكلاهما من سبب واحد.'
  - title: إسناد الإراحة إلى «اللَّيْلُ»
    text: الذي يرد الإبل هو الراعي، فأسند الفعل إلى الليل لأنه وقت رجوعها. فكأن الليل نفسه يسوق إليه الضيوف، أي إن ضيافته عادة لا تنقطع كما لا ينقطع الليل.
  - title: الكناية في «وَمَالِي سَارِحًا مَالُ مُقْتِرِ»
    text: لم يقل إنه ينفق ماله كله، بل ذكر أن إبله في المرعى قليلة كإبل الفقير، فدلّ بذلك على كثرة ما ينحر ويعطي. والكناية عند عبد القاهر الجُرْجانيّ أن يذكر المتكلم «معنى هو تاليه وردفه في الوجود» [@dalail، ص66].
prosody:
  meter: البحر الطويل
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: يُرِيحُ / عَلَيْيَلْلَيْ / لُ أَضْيَا / فَ مَاجِدِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — كَرِيمِنْ / وَمَالِي سَا / رِحَنْ مَا / لُ مُقْتِرِي = فعولن / مفاعيلن / فعولن / مفاعلن
  note: في أول الصدر «فعولُ» مقبوضة.
variants:
- reading: زيادة بيتين بعده
  status: في «منتهى الطلب» كما يذكر محقق الديوان
  note: 'يذكر المحقق أن صاحب منتهى الطلب زاد بعده بيتين: «سلي الساغب المعتر يا أم مالك»، و«أأبسط وجهي إنه أول القرى» [@diwan-urwa، ص50، الحاشية]. وهما في الحماسة قطعة مستقلة.'
