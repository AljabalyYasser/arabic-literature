first: ذَرِينِي أُطَوِّفْ فِي البِلَادِ لَعَلَّنِي
second: أُخَلِّيكِ أَوْ أُغْنِيكِ عَنْ سُوءِ مَحْضَرِ
vocabulary:
- term: أُطَوِّفْ
  text: أُكثر الطواف والتنقل.
- term: أُخَلِّيكِ
  text: '«التخلية: الطلاق، كنى بها عن قتله، أي أقتل عنك فأفارقك فتخلى للأزواج» [@asmaiyyat، ص44، الحاشية].'
- term: سُوءِ مَحْضَرِ
  text: «أى أصيب حاجتى فأغنيك عن أن تحضرى محضرا سيئا، يعنى المسألة» [@asmaiyyat، ص44، الحاشية]، أي سؤال الناس.
