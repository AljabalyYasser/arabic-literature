explained: false
first: مُطِلًّا عَلَى أَعْدَائِهِ يَزْجُرُونَهُ
second: بِسَاحَتِهِمْ زَجْرَ المَنِيحِ المُشَهَّرِ
vocabulary:
- term: مُطِلًّا عَلَى أَعْدَائِهِ
  text: «مشرفا عليهم، يغزوهم أبدا، فهو بذلك عال عليهم» [@asmaiyyat، ص46، الحاشية].
- term: يَزْجُرُونَهُ
  text: «يصيحون به كما يزجر القدح إذا ضرب» [@asmaiyyat، ص46، الحاشية].
- term: المَنِيحِ
  text: '«المنيح ههنا: قدح مستعار سريع الخروج والفوز، يستعار فيضرب ثم يرد إلى صاحبه، قاله ابن السكيت» [@asmaiyyat، ص46، الحاشية].'
- term: المُشَهَّرِ
  text: «المشهور» [@asmaiyyat، ص46، الحاشية].
