first: أَحَادِيثُ تَبْقَى وَالفَتَى غَيْرُ خَالِدٍ
second: إِذَا هُوَ أَمْسَى هَامَةً تَحْتَ صُبَّرِ
meaning: أريد أن أشتري بمالي ومخاطرتي أحاديثَ حسنة تبقى بعدي، فالإنسان لا يعيش أبدًا؛ فإذا مات وصار هامةً تحت حجارة القبر لم يبق منه إلا ما يتحدث به الناس عنه.
vocabulary:
- term: أَحَادِيثُ
  text: ما يتحدث به الناس من ذكر الرجل وأفعاله.
- term: هَامَةً
  text: '«كانت العرب تزعم أن روح القتيل الذى لم يدرك بثأره تصير هامة فتصيح عند قبره تقول: اسقونى اسقونى، فإذا أدرك بثأره طارت» [@asmaiyyat، ص44، الحاشية]. وفي شرح ابن السِّكِّيت: «يريد أن الفتى يموت فتخرج منه هامةٌ تعلو كلَّ نَشْزٍ، وهذا شيء كانت تقوله الجاهلية» [@diwan-urwa، ص42]. والنَّشْز: المرتفع من الأرض.'
- term: صُبَّرِ
  text: '«الصبر: القبر» [@asmaiyyat، ص44، الحاشية].'
context: 'يجيب عن سؤال البيت السابق: ماذا يشتري؟ يشتري الذكر الباقي. وهذا البيت غاية القصيدة كلها، فكل ما يأتي من وصف الصعلوكين شرح لهذه الأحاديث: أيّ الرجلين يُتحدَّث عنه بخير.'
syntax:
- '«أَحَادِيثُ» بالرفع في رواية الأصمعيات. ويقول المحققان: «أحاديث: بالرفع استئناف، وبالنصب مفعول لمشترى فى البيت قبله» [@asmaiyyat، ص44، الحاشية]. فالرفع على أنه خبر لمبتدأ محذوف تقديره: هي أحاديث. والنصب رواية ابن السِّكِّيت، وقال: «نصب (أحاديثَ) على قوله: مشترٍ أحاديثَ» [@diwan-urwa، ص42].'
- «تَبْقَى» جملة فعلية نعت لـ«أحاديث».
- «وَالفَتَى غَيْرُ خَالِدٍ» جملة اسمية حالية، أو اعتراض يعلّل طلبه.
- «إِذَا هُوَ أَمْسَى» ظرف شرطي، و«هو» فاعل لفعل محذوف يفسّره «أمسى»، و«هَامَةً» خبر «أمسى»، و«تَحْتَ صُبَّرِ» ظرف متعلق بمحذوف نعت لهامة.
morphology:
- «أَحَادِيث» جمع «أُحْدُوثة»، وهي ما يُتحدَّث به.
- '«خَالِد» اسم فاعل من «خَلَدَ»: دام وبقي.'
- «صُبَّر» على «فُعَّل».
rhetoric:
  thesis: 'يضع عروة الموت والذكر في بيت واحد: الفتى يفنى، والحديث عنه يبقى. فالمخاطرة بالنفس عنده شراء: يدفع الحياة ويأخذ الذكر.'
  devices:
  - title: المقابلة بين «تَبْقَى» و«غَيْرُ خَالِدٍ»
    text: 'المقابلة: أن يؤتى بمعنيين أو أكثر ثم بما يقابلهما. فالأحاديث «تبقى» والفتى «غير خالد»؛ وبهذا التقابل يصير الذكر عوضًا عن الحياة، وتصير المخاطرة صفقة رابحة.'
  - title: الاستعارة في الشراء
    text: 'إذا قرأنا «أحاديثَ» بالنصب، فهي ما «يشتريه» الشاعر في البيت السابق: جعل اكتساب الذكر شراءً، والمال والنفس ثمنًا. والاستعارة عند عبد القاهر الجُرْجانيّ أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]؛ وهنا استُعير لفظ الشراء لاكتساب المجد.'
  - title: '«هَامَةً تَحْتَ صُبَّرِ»: معتقد جاهلي في صورة'
    text: 'يذكر الهامة، وهي في معتقدهم طائر يخرج من رأس الميت، فيرسم الموت صورةً يعرفها السامع: طائر يصيح فوق قبر. فلا يقول «إذا مات»، بل يُري المرأة ما يصير إليه الرجل.'
  connection: 'يكمل في البيت التالي صورة الهامة: تصيح فتجيبها الحجارة بالصدى.'
prosody:
  meter: البحر الطويل
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: أَحَادِي / ثُ تَبْقَى وَلْ / فَتَى غَيْ / رُ خَالِدِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — إِذَا هُ / وَ أَمْسَى هَا / مَتَنْ تَحْ / تَ صُبْبَرِي = فعولُ / مفاعيلن / فعولن / مفاعلن
  note: في أول العجز «فعولُ» مقبوضة، أي سقط خامسها الساكن.
variants:
- reading: أَحَادِيثَ تَبْقَى وَالفَتَى غَيْرُ خَالِدٍ / إِذَا هُوَ أَمْسَى هَامَةً فَوْقَ صَيِّرِ
  status: رواية ابن السِّكِّيت في الديوان
  note: 'بنصب «أحاديث»، و«فوق صَيِّر». وقال ابن السِّكِّيت: «والصَّيِّرُ: حجارةٌ تُجعَلُ كالحظيرة زَرْبًا للغنم»، «فضربه مثلًا للقبر لأنه حجارةٌ» [@diwan-urwa، ص42]. ويقول محققا الأصمعيات إن «فوق صير» في الديوان ومنتهى الطلب واللسان «وهى أجود» [@asmaiyyat، ص44، الحاشية].'
