first: سَيُفْزِعُ بَعْدَ اليَأْسِ مَنْ لَا يَخَافُنَا
second: كَوَاسِعُ فِي أُخْرَى السَّوَامِ المُنَفَّرِ
vocabulary:
- term: كَوَاسِعُ
  text: «خيل تطرد إبلا تكسعها فى آثارها» [@asmaiyyat، ص46، الحاشية].
- term: السَّوَامِ المُنَفَّرِ
  text: '«السوام: الإبل السائمة... المنفر: المذعور» [@asmaiyyat، ص46، الحاشية]. والسائمة: التي ترعى.'
