explained: false
first: وَمُسْتَثْبِتٌ فِي مَالِكَ العَامَ إِنَّنِي
second: أَرَاكَ عَلَى أَقْتَادِ صَرْمَاءَ مُذْكِرِ
vocabulary:
- term: مُسْتَثْبِتٌ فِي مَالِكَ
  text: 'مقيم فيه لا تغزو؛ والكلام لها: «هل أنت مستثبت هذا العام فى مالك» [@asmaiyyat، ص44، الحاشية].'
- term: أَقْتَادِ
  text: «جمع قتد، وهو خشب الرحل» [@asmaiyyat، ص44، الحاشية].
- term: صَرْمَاءَ مُذْكِرِ
  text: 'الصرماء: «القليلة اللبن»، والمذكر: قال ابن السِّكِّيت: «التى تلد الذكور، وهو أفظع ما يكون من نتاج العرب وأبغضه إليهم». «وجعل من هذه الناقة مثلا للداهية» [@asmaiyyat، ص44، الحاشية].'
