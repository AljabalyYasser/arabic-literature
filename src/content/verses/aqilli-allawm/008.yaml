explained: false
first: تَقُولُ لَكَ الوَيْلَاتُ هَلْ أَنْتَ تَارِكٌ
second: ضُبُوءًا بِرَجْلٍ تَارَةً وَبِمِنْسَرِ
vocabulary:
- term: لَكَ الوَيْلَاتُ
  text: دعاء بالهلاك، تقوله المرأة لائمة.
- term: ضُبُوءًا
  text: '«الضبوء، بالهمز: اللصوق بالأرض والاستتار ليختل الصيد» [@asmaiyyat، ص44، الحاشية]، أي يغافله.'
- term: بِرَجْلٍ
  text: '«الرجل، بفتح الراء وسكون الجيم: الرجالة» [@asmaiyyat، ص44، الحاشية]، أي المشاة.'
- term: مِنْسَرِ
  text: «الجماعة من الخيل بين الثلاثين إلى الأربعين» [@asmaiyyat، ص44، الحاشية].
