  status: رواية ابن السِّكِّيت في الديوان
  note: «بنت» مكان «ابنة»، و«وإن» مكان «فإن» [@diwan-urwa، ص41].
- reading: أَقِلِّي عَلَيَّ اللَّوْمَ يَا ابْنَةَ مَالِكٍ / وَنَامِي وَإِنْ لَمْ تَشْتَهِي ذَاكِ فَاسْهَرِي
  status: رواية الأخفش في حاشية الكامل
  note: أنشده أبو الحسن الأخفش ليبيّن أن الشاعر يخاطب امرأة [@kamil، ج1 ص111].
