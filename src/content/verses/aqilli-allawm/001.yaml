first: أَقِلِّي عَلَيَّ اللَّوْمَ يَا ابْنَةَ مُنْذِرٍ
second: وَنَامِي فَإِنْ لَمْ تَشْتَهِي النَّوْمَ فَاسْهَرِي
meaning: 'يخاطب امرأته: يا ابنة مُنْذِر، خففي من لومك لي، ونامي ودعيني؛ فإن لم يأتك النوم فاسهري كما شئت، فلن يردّني سهرك ولا لومك عما عزمت عليه من الغزو.'
vocabulary:
- term: أَقِلِّي
  text: خففي وقلّلي؛ أمر من «أَقَلَّ».
- term: اللَّوْمَ
  text: العَذْل والعتاب.
- term: ابْنَةَ مُنْذِرٍ
  text: «امرأته، وهى سلمى، التى سباها من كنانة وأعتقها وأولدها أولاده» [@asmaiyyat، ص43، الحاشية].
- term: فَاسْهَرِي
  text: فابقي ساهرة لا تنامين.
context: 'مطلع القصيدة وإطارها كله: امرأة تلوم وزوج يرد. ويلخص المحققان خبرها: «توجه بالخطاب فى هذه القصيدة إلى امرأته سلمى، وهى ابنة منذر، وكانت تلومه على الخطار بنفسه، وإدمانه الغزوات والغارات فى أحياء العرب، فرد عليها قولها بأنه إنما يبغى بذلك المجد وجمع المال لها ليكفيها بعد موته» [@asmaiyyat، ص43، الحاشية]. وفي رواية ابن السِّكِّيت قبلها: «وقال عروة وكانت امرأته نهته عن الغزو» [@diwan-urwa، ص41].'
syntax:
- «أَقِلِّي» فعل أمر مبني على حذف النون، وياء المخاطبة فاعل، و«اللَّوْمَ» مفعول به، و«عَلَيَّ» متعلق به.
- «يَا ابْنَةَ مُنْذِرٍ» نداء، والمنادى مضاف منصوب، وتسقط همزة «ابنة» في النطق فتتصل بألف «يا».
- '«فَإِنْ لَمْ تَشْتَهِي النَّوْمَ فَاسْهَرِي» جملة شرطية: «تَشْتَهِي» مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون، فالياء الباقية ياء المخاطبة، وهي الفاعل. والجواب «فاسهري» مقترن بالفاء لأنه طلب.'
morphology:
- «أَقِلِّي» من «أَقَلَّ» على «أَفْعَلَ»، وأصله «أَقْلِلِي» فأدغم المثلان.
- «اللَّوْم» مصدر «لامَ يلُوم» على «فَعْل».
- '«اسْهَرِي» أمر من «سَهِرَ يَسْهَرُ»، وهمزته همزة وصل تسقط في الدرج: «فَاسْهَرِي».'
rhetoric:
  thesis: يفتتح عروة قصيدته بأمرين متقابلين، «نامي» و«اسهري»، فيترك لامرأته أن تختار ما شاءت، لأن اختيارها لا يغيّر اختياره. فالبيت كله رفض للوم في هدوء، لا في غضب.
  devices:
  - title: '«نَامِي ... فَاسْهَرِي»: الأمر للتسوية'
    text: 'ليس الأمر هنا طلبًا حقيقيًا، فهو لا يريد منها نومًا ولا سهرًا، بل يسوّي بينهما: نامي أو اسهري، سواء عندي. وهذا الأمر الذي يُراد به التسوية يُظهر استغناءه عن رضاها في هذا الأمر وحده، مع بقاء الخطاب لطيفًا. وهي قراءتنا.'
  - title: الطباق بين «نَامِي» و«اسْهَرِي»
    text: 'الطباق: الجمع بين لفظين متضادين. والنوم والسهر هنا هما حالا المرأة القلقة: إن نامت فقد كفّت عن اللوم، وإن سهرت فسهرها قلق عليه. فيجمع الضدّين ليقول إنه يعرف قلقها كله، ولا يرجع.'
  - title: التصريع
    text: 'التصريع: أن يتفق آخر الصدر وآخر العجز في الروي والوزن في مطلع القصيدة. فـ«مُنْذِرِ» و«فَاسْهَرِي» تنتهيان بالراء المكسورة، فيعلن المطلع رويّ القصيدة من أول بيت.'
  connection: 'بعد أن طلب منها ترك اللوم، يطلب في البيت التالي أن تدعه ونفسه: «ذَرِينِي وَنَفْسِي أُمَّ حَسَّانَ».'
prosody:
  meter: البحر الطويل
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: أَقِلْلِي / عَلَيْيَلْلَوْ / مَيَبْنَ / ةَ مُنْذِرِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — وَنَامِي / فَإِنْ لَمْ تَشْ / تَهِنْنَوْ / مَ فَسْهَرِي = فعولن / مفاعيلن / فعولن / مفاعلن
  note: 'في الصدر «فعولُ» بدل «فعولن»: سقط الحرف الخامس الساكن، وهذا هو القَبْض، وهو كثير في الطويل. و«مفاعلن» في آخر الشطرين لازمة في هذا الضرب من الطويل.'
variants:
