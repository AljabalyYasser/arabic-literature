explained: false
first: يُنَاقِلْنَ بِالشُّمْطِ الكِرَامِ أُولِي النُّهَى
second: نِقَابَ الحِجَازِ فِي السَّرِيحِ المُسَيَّرِ
vocabulary:
- term: يُنَاقِلْنَ
  text: '«المناقلة: حسن نقل القوائم فى سرعة السير» [@asmaiyyat، ص47، الحاشية]. والضمير للخيل.'
- term: الشُّمْطِ
  text: «جمع أشمط، وهو الذى خالط سواد شعره بياض. أراد بهم الفرسان ذوى السن والتجربة» [@asmaiyyat، ص47، الحاشية].
- term: نِقَابَ الحِجَازِ
  text: '«النقاب: جمع نقب، وهو الطريق الضيق فى الجبل» [@asmaiyyat، ص47، الحاشية].'
- term: السَّرِيحِ المُسَيَّرِ
  text: '«السريح: السيور تشد بها النعال... عنى بالسريح المسير نعال الخيل» [@asmaiyyat، ص47، الحاشية].'
