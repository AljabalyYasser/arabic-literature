first: يَعُدُّ الغِنَى مِنْ دَهْرِهِ كُلَّ لَيْلَةٍ
second: أَصَابَ قِرَاهَا مِنْ صَدِيقٍ مُيَسِّرِ
meaning: هذا الصعلوك الخامل يعد من عمره غنًى كل ليلة أصاب فيها عشاءه ضيفًا عند صديق كثرت ألبان غنمه؛ فغناه شبع ليلة، ولا يبالي بمن وراءه.
vocabulary:
- term: الغِنَى
  text: الثراء وكثرة المال.
- term: قِرَاهَا
  text: 'القِرى: طعام الضيف. والضمير لليلة، أي ما قُدّم له فيها.'
- term: مُيَسِّرِ
  text: '«الميسر، بكسر السين المشددة: الذى سهلت ولادة إبله وغنمه ولم يعطب منها شىء» [@asmaiyyat، ص45، الحاشية]. وقال ابن السِّكِّيت: «والمُيَسِّرُ: الذي قد أقبل خيرُ شائه، يُقال: قد يسّرت شاءُ بني فلان» [@diwan-urwa، ص46].'
context: 'يكمل صورة الصعلوك المذموم: همّته شبع ليلة. وقال ابن السِّكِّيت في معناه: «يقول: إذا ملأ بطنه عدّه غنى ولم يبال ما وراءه من عياله وقرابته» [@diwan-urwa، ص46]. وهذا عكس عروة الذي يغزو لمن وراءه.'
syntax:
- '«يَعُدُّ» فعل ينصب مفعولين: «كُلَّ لَيْلَةٍ» المفعول الأول، و«الغِنَى» المفعول الثاني، وقد قُدّم. والتقدير: يعدّ كلَّ ليلةٍ غنًى.'
- «مِنْ دَهْرِهِ» متعلق بـ«يعد»، أي من عمره وأيامه.
- «أَصَابَ قِرَاهَا» جملة فعلية نعت لـ«ليلة»، والفاعل ضمير الصعلوك.
- «مِنْ صَدِيقٍ مُيَسِّرِ» متعلق بـ«أصاب».
morphology:
- «يَعُدُّ» مضارع «عَدَّ» المضعّف.
- '«قِرى» مصدر «قَرَى الضيفَ يَقْرِيه»: أطعمه.'
- «مُيَسِّر» اسم فاعل من «يَسَّرَ» على «فَعَّلَ».
rhetoric:
  thesis: يسخر عروة من صعلوك يسمّي عشاء ليلة «غنى». فالبيت كله مفارقة بين كلمة كبيرة ومعنى صغير.
  devices:
  - title: المفارقة في «يَعُدُّ الغِنَى ... كُلَّ لَيْلَةٍ»
    text: 'الغنى في العرف مال كثير يدوم، وهذا الصعلوك يجعله عشاء ليلة واحدة عند غيره. فالبيت يضع الكلمة في غير موضعها ليفضح صاحبها: غناه قِرى ضيف، ومن ماله لا شيء.'
  - title: تقديم «الغِنَى»
    text: 'قدّم المفعول الثاني «الغنى» على الأول «كل ليلة»، فوقع أول ما يُسمع بعد الفعل، وهو موضع السخرية. وعبد القاهر الجُرْجانيّ ينقل عن سيبويه في التقديم أنهم «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]: والذي يعني الشاعر هنا هو ما يسميه هذا الصعلوك غنى.'
  connection: 'يأتي بعده بيت في كسله: «قليل التماس المال إلا لنفسه».'
prosody:
  meter: البحر الطويل
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: يَعُدْدُلْ / غِنَى مِنْ دَهْ / رِهِي كُلْ / لَ لَيْلَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — أَصَابَ / قِرَاهَا مِنْ / صَدِيقِنْ / مُيَسْسِرِي = فعولُ / مفاعيلن / فعولن / مفاعلن
  note: تُشبَع كسرة الهاء في «دَهْرِهِ» فتُنطق «دَهْرِهِي». وفي أول العجز «فعولُ» مقبوضة.
variants:
- reading: يَعُدُّ الغِنَى مِنْ نَفْسِهِ كُلَّ لَيْلَةٍ
  status: رواية الحماسة والجمهرة
  note: «من نفسه» مكان «من دهره» [@tabrizi-hamasa، ج1 ص160] [@jamhara، ص453].
