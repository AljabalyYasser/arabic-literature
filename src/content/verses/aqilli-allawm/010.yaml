explained: false
first: فَجُوعٍ بِهَا لِلصَّالِحِينَ مَزِلَّةٍ
second: مَخُوفٍ رَدَاهَا أَنْ تُصِيبَكَ فَاحْذَرِ
vocabulary:
- term: فَجُوعٍ
  text: «تفجع الناس، وهو من صفة الصرماء» [@asmaiyyat، ص45، الحاشية].
- term: لِلصَّالِحِينَ
  text: 'في شرح ابن السِّكِّيت: «الصالحون عند العرب ذوو المعروف لا ذوو الدين» [@asmaiyyat، ص45، الحاشية].'
- term: مَزِلَّةٍ
  text: «تزل بأهلها» [@asmaiyyat، ص45، الحاشية].
- term: رَدَاهَا
  text: هلاكها.
