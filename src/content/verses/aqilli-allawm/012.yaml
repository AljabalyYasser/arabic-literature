explained: false
first: وَمُسْتَهْنِئٍ زَيْدٌ أَبُوهُ فَلَا أَرَى
second: لَهُ مَدْفَعًا فَاقْنَيْ حَيَاءَكِ وَاصْبِرِي
vocabulary:
- term: مُسْتَهْنِئٍ
  text: «طالب الهنء، بكسر الهاء، وهو العطاء» [@asmaiyyat، ص45، الحاشية].
- term: زَيْدٌ أَبُوهُ
  text: «يعنى رجلا من قومه يجمعه وإياه زيد، وهو جد عروة» [@asmaiyyat، ص45، الحاشية].
- term: فَاقْنَيْ حَيَاءَكِ
  text: «احفظيه وأمسكيه عليك» [@asmaiyyat، ص45، الحاشية].
