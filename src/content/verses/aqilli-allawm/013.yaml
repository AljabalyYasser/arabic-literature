first: لَحَى اللَّهُ صُعْلُوكًا إِذَا جَنَّ لَيْلُهُ
second: مَضَى فِي المُشَاشِ آلِفًا كُلَّ مَجْزَرِ
meaning: قبّح الله فقيرًا خاملًا إذا أظلم عليه الليل مضى إلى مواضع نحر الإبل يتتبع العظام اللينة يمضغها، قد ألِف المجازر ولزمها، لا همّ له إلا ما يملأ بطنه.
vocabulary:
- term: لَحَى اللَّهُ
  text: «قبحه ولعنه» [@asmaiyyat، ص45، الحاشية].
- term: صُعْلُوكًا
  text: '«الصعلوك: الفقير» [@asmaiyyat، ص45، الحاشية]. وفي اللسان: «وصعاليك العرب: ذؤبانها» [@lisan، ج10 ص456].'
- term: جَنَّ لَيْلُهُ
  text: أظلم وستر.
- term: المُشَاشِ
  text: «رؤوس العظام اللينة التى يمكن مضغها» [@asmaiyyat، ص45، الحاشية].
- term: مَجْزَرِ
  text: «موضع الجزر» [@asmaiyyat، ص45، الحاشية]، أي حيث تُنحر الإبل وتُقطَّع.
context: 'أشهر بيت لعروة، ويُروى أنه لُقّب «عروة الصعاليك» به: قال ابن قُتَيْبة: «وكان يلقّب عروة الصّعاليك لقوله» [@ibn-qutayba، ج2 ص665]، وذكره أبو الفَرَج قولًا ثانيًا في لقبه [@aghani-dk، ج3 ص73]. وبه يبدأ وصف الصعلوك المذموم، الذي سيقابله بعد خمسة أبيات بالصعلوك المحمود.'
syntax:
- «لَحَى اللَّهُ صُعْلُوكًا» جملة خبرية في لفظها، دعائية في معناها.
- «إِذَا جَنَّ لَيْلُهُ» ظرف شرطي، وجوابه «مَضَى فِي المُشَاشِ»، والجملة الشرطية كلها نعت لـ«صُعلوكًا».
- «آلِفًا» حال من فاعل «مضى»، وهو اسم فاعل عمل عمل فعله فنصب «كُلَّ مَجْزَرِ» مفعولًا به.
- 'وعلى رواية «مُصَافِي المُشَاشِ» في الخزانة: «ومصافي المشاش صفة لصعلوك والإضافة لفظية وسكن الياء من مصافي ضرورة» [@khizana، ج10 ص14]. والإضافة اللفظية: إضافة اسم الفاعل إلى معموله، فلا تعرّفه.'
morphology:
- «صُعْلُوك» على «فُعْلُول».
- '«مَجْزَر» اسم مكان من «جَزَرَ». ويقول المحققان: «وهو بفتح الزاى قياسا، وكسرها سماعا» [@asmaiyyat، ص45، الحاشية].'
- '«آلِف» اسم فاعل من «أَلِفَ الشيءَ»: أنس به ولزمه.'
rhetoric:
  thesis: يبدأ الشاعر الموازنة بالدعاء على صعلوك لا يطلب من الدنيا إلا عظمًا يمضغه. فالفقر عنده ليس عيبًا، والعيب أن يرضى الفقير بفقره ويعيش على فضلات الناس.
  devices:
  - title: الدعاء في «لَحَى اللَّهُ»
    text: 'صيغة خبرية يراد بها الدعاء: لا يخبر أن الله لحاه، بل يدعو عليه. وبهذا يبدأ الوصف بالحكم قبل الصورة، فيعرف السامع موقفه من أول كلمة.'
  - title: الكناية في «مَضَى فِي المُشَاشِ آلِفًا كُلَّ مَجْزَرِ»
    text: 'لم يقل إنه شَرِه خامل يعيش على فضلات غيره، بل ذكر ما يلزم ذلك: يمضي في الليل إلى المجازر يتتبع العظام. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66].'
  - title: '«إِذَا جَنَّ لَيْلُهُ»: الليل وقت الهمة'
    text: 'الليل عند الصعاليك وقت الغارة والسُّرى. فإذا جاء الليل خرج هذا الصعلوك، لا إلى غارة، بل إلى المجازر. ففي ذكر الليل سخرية: يخرج في وقت الأبطال إلى عمل الكلاب.'
  connection: 'يكمل في البيت التالي صفة هذا الصعلوك: يعد الغنى عشاء ليلة.'
prosody:
  meter: البحر الطويل
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: لَحَلْلَا / هُ صُعْلُوكَنْ / إِذَا جَنْ / نَ لَيْلُهُو = فعولن / مفاعيلن / فعولن / مفاعلن — مَضَى فِلْ / مُشَاشِ آ / لِفَنْ كُلْ / لَ مَجْزَرِي = فعولن / مفاعلن / فعولن / مفاعلن
  note: 'في العجز «مفاعلن» مكان «مفاعيلن» في الجزء الثاني: سقط الحرف الخامس الساكن (القبض).'
variants:
- reading: لَحَى اللَّهُ صُعْلُوكًا إِذَا جَنَّ لَيْلُهُ / مُصَافِي المُشَاشِ آلِفًا كُلَّ مَجْزَرِ
  status: رواية ابن السِّكِّيت في الديوان، والأغاني، والحماسة، والكامل، والشعر والشعراء، والجمهرة
  note: 'قال ابن السِّكِّيت: «قوله: مُصافي المُشاش، أي: مُخالًّا له، مُؤثِرًا للأكل»، «فهو الدهرَ في موضع مأكل» [@diwan-urwa، ص46]. ويقول محققو الأغاني إن «مضى في المشاش» في بعض نسخها «وهو تحريف» [@aghani-dk، ج3 ص73، الحاشية]. وانظر [@ibn-qutayba، ج2 ص665] و[@tabrizi-hamasa، ج1 ص159] و[@kamil، ج1 ص111] و[@jamhara، ص453].'
