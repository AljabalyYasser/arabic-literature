first: يَنَامُ عِشَاءً ثُمَّ يُصْبِحُ قَاعِدًا
second: يَحُتُّ الحَصَى عَنْ جَنْبِهِ المُتَعَفِّرِ
vocabulary:
- term: يُصْبِحُ قَاعِدًا
  text: '«يقول: ليس بصاحب إدلاج ولا غزو. قاله ابن السكيت» [@asmaiyyat، ص46، الحاشية]. والإدلاج: السير بالليل.'
- term: يَحُتُّ
  text: يفرك ويُسقط.
- term: المُتَعَفِّرِ
  text: المترّب، لأنه نام على الأرض بلا فراش.
