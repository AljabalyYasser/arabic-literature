first: فَإِنْ فَازَ سَهْمٌ لِلْمَنِيَّةِ لَمْ أَكُنْ
second: جَزُوعًا وَهَلْ عَنْ ذَاكَ مِنْ مُتَأَخَّرِ
vocabulary:
- term: فَازَ سَهْمٌ
  text: '«جعل من سهام الميسر مثلا له فى مقارعته الموت. وفوز السهم: خروجه أولا» [@asmaiyyat، ص44، الحاشية]. والميسر: قمار كانوا يضربون فيه بالسهام على جزور.'
- term: مُتَأَخَّرِ
  text: تأخّر ومهرب.
