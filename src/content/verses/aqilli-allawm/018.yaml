first: وَلِلَّهِ صُعْلُوكٌ صَفِيحَةُ وَجْهِهِ
second: كَضَوْءِ شِهَابِ القَابِسِ المُتَنَوِّرِ
meaning: 'ولكنّ صعلوكًا آخر لله درّه: وجهه مشرق كضوء الشعلة التي يحملها من يقتبس النار فتضيء ما حولها.'
vocabulary:
- term: وَلِلَّهِ
  text: 'كلمة تعجب ومدح، كقولهم: لله درّه.'
- term: صَفِيحَةُ وَجْهِهِ
  text: «بشرة جلده» [@asmaiyyat، ص46، الحاشية].
- term: شِهَابِ
  text: «شعلة من نار ساطعة» [@asmaiyyat، ص46، الحاشية].
- term: القَابِسِ
  text: «الذى يقبس النار، أى يأخذها» [@asmaiyyat، ص46، الحاشية].
- term: المُتَنَوِّرِ
  text: «المضىء، وهو من صفة الشهاب» [@asmaiyyat، ص46، الحاشية].
context: 'البيت المفصل في القصيدة: هنا ينقلب الوصف من الصعلوك المذموم إلى الصعلوك المحمود. فبعد «لحى الله صعلوكًا» يأتي «ولله صعلوك»، وما بعده أوصاف هذا الثاني حتى البيت 21. وقال ابن السِّكِّيت في روايته «ولكنّ صعلوكًا»: «يريد: ولكنّ صعلوكًا هكذا وجهُهُ لا لحاه الله» [@diwan-urwa، ص47].'
syntax:
- «لِلَّهِ» جار ومجرور خبر مقدم، و«صُعْلُوكٌ» مبتدأ مؤخر. وجاز الابتداء بالنكرة لأنها موصوفة بالجملة بعدها، والتركيب للتعجب والمدح.
- '«صَفِيحَةُ وَجْهِهِ كَضَوْءِ شِهَابِ القَابِسِ» جملة اسمية نعت لـ«صعلوك»: «صفيحة» مبتدأ، و«كضوء» خبره.'
- «المُتَنَوِّرِ» نعت لـ«شهاب» أو لـ«القابس»؛ والمحققان يجعلانه «من صفة الشهاب» [@asmaiyyat، ص46، الحاشية].
- 'وعلى رواية «ولكنْ صعلوكًا» ينقل البغدادي عن المرزوقي أن «إن يلق المنية» في البيت 21 «خبر قوله: ولكن صعلوكا»، وأن الشاعر «لما تراخى الخبر عن المخبر عنه» أعاده باسم الإشارة «فذلك» [@khizana، ج10 ص12].'
morphology:
- '«صَفِيحة» على «فَعِيلة»: عرض الشيء وظاهره.'
- '«القَابِس» اسم فاعل من «قَبَسَ النارَ»: أخذ منها شعلة.'
- «المُتَنَوِّر» اسم فاعل من «تَنَوَّرَ» على «تَفَعَّلَ».
rhetoric:
  thesis: 'بكلمتين، «لحى الله» ثم «ولله»، يقسم عروة الصعاليك قسمين، ويضع وجه الصعلوك الحر في مقابل بطن الصعلوك الخامل: ذاك يطلب العظم في الظلام، وهذا وجهه نور في الظلام.'
  devices:
  - title: المقابلة بين البيت 13 وهذا البيت
    text: «لَحَى اللَّهُ صُعْلُوكًا» دعاء عليه، و«وَلِلَّهِ صُعْلُوكٌ» مدح له. وبهذا التقابل في أول البيتين تنقسم القصيدة قسمين واضحين، فيعرف السامع من أول كلمة أي الرجلين يُوصف.
  - title: التشبيه في «صَفِيحَةُ وَجْهِهِ كَضَوْءِ شِهَابِ القَابِسِ»
    text: 'شبّه إشراق وجهه بضوء الشعلة. والشبه في ظاهره بيّن، هو الضوء، ولكن المراد ما وراءه: عزة النفس وانبساطها، فلا يتخشع لفقره. وعبد القاهر الجُرْجانيّ يقسم الشبه قسمين: «أحدهما أن يكون من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل، والآخر أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]. وهذا من الثاني: ضوء الوجه هنا كرامة لا لون.'
  - title: النور في مقابل الليل
    text: الصعلوك الأول يخرج «إذا جن ليله» إلى المجازر، وهذا وجهه «شهاب» يضيء. فالصورتان تتقابلان في الضوء والظلمة، وهي قراءتنا.
  connection: 'يصف في البيت التالي فعله: «مطلًّا على أعدائه يزجرونه».'
