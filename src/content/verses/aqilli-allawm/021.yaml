first: فَذَلِكِ إِنْ يَلْقَ المَنِيَّةَ يَلْقَهَا
second: حَمِيدًا وَإِنْ يَسْتَغْنِ يَوْمًا فَأَجْدِرِ
meaning: ذلك الصعلوك، يا امرأة، إن لقي الموت لقيه محمودًا لأنه أعذر في الطلب، وإن استغنى يومًا فما أحقّه بالغنى، لأنه ينفقه فيما يُحمد.
vocabulary:
- term: فَذَلِكِ
  text: إشارة إلى الصعلوك المحمود، والكاف حرف خطاب للمرأة.
- term: المَنِيَّةَ
  text: الموت.
- term: حَمِيدًا
  text: محمودًا.
- term: فَأَجْدِرِ
  text: 'قال ابن السِّكِّيت: «فأجدِر، أي: أخلِق» [@diwan-urwa، ص48]، أي: ما أجدره وما أحقّه.'
context: 'خاتمة الموازنة بين الصعلوكين، وجواب لوم المرأة: الصعلوك الحر لا يخسر في الطريقين. وقال ابن السِّكِّيت في معناه: إنه «عذر نفسه في الطلب، وإن بقي فاستغنى أنفق ماله فيما تبقى محامده له في حياته وبعد موته» [@diwan-urwa، ص48–49]. فيعود إلى البيت الثالث: الأحاديث التي تبقى.'
syntax:
- '«فَذَلِكِ» مبتدأ، والجملة الشرطية بعده خبره، كما يقول البغدادي في بيت على مثاله: «فذلك مبتدأ والجملة الشرطية خبره» [@khizana، ج10 ص12]. والكاف حرف خطاب، كُسرت لأن الشاعر يخاطب امرأة: قال أبو الحسن الأخفش: «كذا أنشده، " فذلك" لأنه لم يرو أول الشعر، والصواب كسر الكاف، لأنه يخاطب امرأة» [@kamil، ج1 ص111].'
- «يَلْقَهَا» جواب الشرط مجزوم، و«حَمِيدًا» حال.
- '«فَأَجْدِرِ» صيغة تعجب «أَفْعِلْ به» حُذف منها المتعجَّب منه، وكُسرت للقافية. قال البغدادي: «وقد استشهد به شراح الألفية وغيرهم على أن أجدر صيغة تعجب حذف منه المتعجب منه حذفا غير قياسي»، والتقدير: «وأجدر به أي: بالاستغناء» [@khizana، ج10 ص13].'
morphology:
- '«أَجْدِرْ» على «أَفْعِلْ»، صيغة التعجب من «جَدُرَ»: صار جديرًا.'
- «يَسْتَغْنِ» مضارع «استغنى» على «استفعل»، مجزوم بحذف الياء.
- '«المَنِيَّة» على «فَعِيلة» من «مَنَى»: قدّر، فهي الموت المقدَّر.'
rhetoric:
  thesis: 'يجمع البيت الصعلوك المحمود في كلمة «ذلك»، ثم يعطيه الحسنيين: موت محمود أو غنى مستحق. فما تخافه المرأة، الموت، يصير عنده إحدى الخاتمتين الحسنتين.'
  devices:
  - title: الإشارة بـ«ذَلِكِ»
    text: بعد أبيات من الوصف يجمع الصعلوك كله في اسم إشارة للبعيد، فيرفعه ويعظّمه، ويجعله نموذجًا يُشار إليه. وهي قراءتنا.
  - title: المقابلة بين «يَلْقَ المَنِيَّةَ» و«يَسْتَغْنِ»
    text: 'شرطان متقابلان، وجوابهما كلاهما محمود. فلا يترك للّائمة حجة: إن مات فبحمد، وإن عاش فبغنى.'
  - title: الحذف في «فَأَجْدِرِ»
    text: 'حذف ما يتعجب منه، فلم يقل: فأجدر به بالغنى. وعبد القاهر الجُرْجانيّ يقول في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]؛ فالكلمة الواحدة في آخر البيت تحمل التعجب كله، ويتمّها السامع.'
  connection: 'بعد أن فرغ من الموازنة يعود إلى نفسه: «أتهلك معتم وزيد ولم أقم».'
prosody:
  meter: البحر الطويل
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: فَذَالِ / كِ إِنْ يَلْقَلْ / مَنِيْيَ / ةَ يَلْقَهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — حَمِيدَنْ / وَإِنْ يَسْتَغْ / نِ يَوْمَنْ / فَأَجْدِرِي = فعولن / مفاعيلن / فعولن / مفاعلن
  note: في الصدر «فعولُ» مقبوضة مرتين.
