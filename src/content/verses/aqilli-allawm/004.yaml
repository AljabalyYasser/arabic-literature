explained: false
first: تُجَاوِبُ أَحْجَارَ الكِنَاسِ وَتَشْتَكِي
second: إِلَى كُلِّ مَعْرُوفٍ تَرَاهُ وَمُنْكَرِ
vocabulary:
- term: تُجَاوِبُ
  text: 'الضمير للهامة في البيت السابق: تصيح فيرد عليها الصدى.'
- term: أَحْجَارَ الكِنَاسِ
  text: '«الكناس: موضع. يريد أن الهامة إذا صوتت أجابتها أحجار الكناس بالصدى» [@asmaiyyat، ص44، الحاشية].'
- term: إِلَى كُلِّ مَعْرُوفٍ تَرَاهُ وَمُنْكَرِ
  text: 'أي: «تصوت في كل حال، إذا رأت من تعرف ومن تنكر» [@asmaiyyat، ص44، الحاشية].'
