first: أَبَى الخَفْضَ مَنْ يَغْشَاكِ مِنْ ذِي قَرَابَةٍ
second: وَمِنْ كُلِّ سَوْدَاءِ المَعَاصِمِ تَعْتَرِي
vocabulary:
- term: الخَفْضَ
  text: «الدعة ولين العيش» [@asmaiyyat، ص45، الحاشية].
- term: سَوْدَاءِ المَعَاصِمِ
  text: 'قال ابن السِّكِّيت: «يريد أنها جهدت من الجدب والجهد والهزال فلم تلبس قفازين على يديها ولم تصن نفسها، أو من شدة الجوع والبرد وحضور النيران للاصطلاء» [@asmaiyyat، ص45، الحاشية]. والمعاصم: مواضع السوار من اليد.'
- term: تَعْتَرِي
  text: تأتي طالبة المعروف.
