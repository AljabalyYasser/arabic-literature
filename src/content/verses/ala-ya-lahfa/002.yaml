first: "وَقَاهُمْ جَدُّهُمْ بِبَنِي أَبِيهِمْ"
second: "وَبِالْأَشْقَيْنَ مَا كَانَ الْعِقَابُ"
meaning: "حماهم حظهم بإخوتهم بني كِنانة، فوقع القتل على من كان أشقى حظًّا منهم. «ببني أبيهم: يريد بني كِنانة الذين حاربهم يحسبهم بني أَسَد، ثم كفّ عنهم حين تبين خطأه، وأَسَد وكِنانة أخوان، هما ابنا خُزَيْمة» [@ibn-qutayba، ج1 ص113، الحاشية]."
vocabulary:
  - term: "جَدُّهُمْ"
    text: "الجَدّ بفتح الجيم: الحظ [@ibn-qutayba، ج1 ص113، الحاشية]."
  - term: "بَنِي أَبِيهِمْ"
    text: "بنو كِنانة، إخوة بني أَسَد [@aghani، ج9 ص109]."
  - term: "الْأَشْقَيْنَ"
    text: "الأكثر شقاء، وهم هنا بنو كِنانة الذين نزل بهم ما لم يكن لهم."
syntax:
  - "«وَقَاهُمْ» فعل ماض، و«هم» مفعول به، و«جَدُّهُمْ» فاعل. و«بِبَنِي» جار ومجرور متعلق بـ«وقى»، والباء للاستعانة، أي: جعلهم وقاية لهم. و«بني» مجرور بالياء لأنه ملحق بجمع المذكر السالم، و«أَبِيهِمْ» مضاف إليه مجرور بالياء لأنه من الأسماء الخمسة."
  - "«وَبِالْأَشْقَيْنَ» جار ومجرور متعلق بمحذوف خبر «كان» مقدم، و«مَا» زائدة للتوكيد، و«الْعِقَابُ» اسم «كان» مؤخر. والتقدير: وكان العقاب بالأشقين."
morphology:
  - "«الْأَشْقَيْنَ» جمع «الأشقى» جمع مذكر سالمًا. و«الأشقى» اسم تفضيل من «شَقِيَ» على «أفعل»، آخره ألف مقصورة، فلما جُمع حُذفت الألف وبقيت الفتحة قبل الياء دليلًا عليها، فقيل «الأشقَيْن»."
  - "«الْعِقَاب» مصدر «عاقب» على «فِعال»."
rhetoric:
  thesis: "بيت يلخّص خطأ الثأر في حكمة عامة: قد ينجو المطلوب بحظه، ويدفع الثمن غيره. ولذلك صار مثلًا."
  devices:
    - title: "الكناية"
      text: "لم يسمّ بني كِنانة، بل قال «بني أبيهم»، فذكر قرابتهم من بني أَسَد. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. وفي هذه الكناية ما ليس في الاسم: أن الذين قتلهم إخوة الذين طلبهم، فكأن بني أَسَد احتموا بإخوتهم."
    - title: "تقديم الجار والمجرور"
      text: "قدّم «بالأشقين» على «كان العقاب»، لأن المهم عنده من نزل به العقاب، لا العقاب نفسه. ويقول عبد القاهر في تقديم الكلمة، ناقلًا عن سِيبَوَيْه: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "المقابلة"
      text: "في الصدر «وقاهم»، وفي العَجُز «العقاب»: فريق وقاه حظه، وفريق نزل به العقاب."
    - title: "مثل سائر"
      text: "قال ابن قُتَيْبة: «ومما يُتمثّل به من شعره قوله: وقاهم جدهم ببني أبيهم...» [@ibn-qutayba، ج1 ص113]. فهو يصلح لكل من نجا بحظه ووقع البلاء على غيره."
  connection: "يذكر في هذا البيت الذين نجوا بحظهم، ثم يخصّ في البيت الثالث واحدًا منهم بالذكر: عِلْباء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "وَقَاهُمْ جَدْ / دُهُمْ بِبَنِي / أَبِيهِمْ = مفاعلْتن / مفاعلتن / فعولن — وَبِلْ أَشْقَيْ / نَ مَا كَانَلْ / عِقَابُو = مفاعلْتن / مفاعلْتن / فعولن"
  note: "دخل العَصَب، وهو تسكين الخامس، فتصير «مفاعلَتن» «مفاعلْتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والأوليين من العَجُز. والعَرُوض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها القَطْف، وهو تسكين الخامس وحذف السبب الخفيف من آخرها، فصارت «مفاعلْ» ثم «فعولن» [@atiq، ص54]."
context: "قلب المقطوعة، وهو البيت الذي سار منها. وفي خبره أن امرأ القَيْس وضع السلاح في كِنانة وهو ينادي بثأر أبيه، فخرجت إليه عجوز منهم فقالت: «أبيت اللعن، لسنا لك بثأر، نحن من كِنانة، فدونك ثأرك فاطلبهم، فإن القوم قد ساروا بالأمس» [@aghani، ج9 ص108–109]. و«أبيت اللعن» تحية الملوك في الجاهلية، أي: أبيتَ أن تأتي ما تُلعن عليه."
