first: "أَلَا يَا لَهْفَ هِنْدٍ مِنْ أُنَاسٍ"
second: "هُمُ كَانُوا الشِّفَاءَ فَلَمْ يُصَابُوا"
meaning: "يا لحسرة هند على قوم كانوا سيشفون نفسه لو أصابهم، لأنهم قتلة أبيه [@ibn-qutayba، ج1 ص117، الحاشية]؛ ولكن خيله لم تنلهم."
vocabulary:
  - term: "لَهْفَ"
    text: "اللهف: الحسرة على ما فات."
  - term: "هِنْدٍ"
    text: "لا تقول المصادر من هي. وفي أهله هندان: أخته هند بنت حُجْر، التي استجار لها أبوها قبل مقتله [@aghani، ج9 ص102]، وابنته هند بنت امرئ القَيْس [@aghani، ج9 ص112]. وفي رجز له في الثأر نفسه: «يا لهف هند إذ خطئن كاهلا» [@aghani، ج9 ص106]. وفي رواية ابن قُتَيْبة «يا لهف نفسي» [@ibn-qutayba، ج1 ص117]."
  - term: "الشِّفَاءَ"
    text: "«أراد بالشفاء أنهم كانوا شفاء نفسه لو أصابهم، إذ هم قتلة أبيه» [@ibn-qutayba، ج1 ص117، الحاشية]."
  - term: "يُصَابُوا"
    text: "تنلهم خيله بقتل."
syntax:
  - "«أَلَا» حرف استفتاح يُنبَّه به السامع. و«يَا» حرف نداء، و«لَهْفَ» منادى منصوب لأنه مضاف، و«هِنْدٍ» مضاف إليه. وهو نداء لما لا يعقل، كأنه يدعو الحسرة أن تحضر."
  - "«مِنْ أُنَاسٍ» جار ومجرور متعلق بـ«لَهْفَ»، لأنه مصدر فيه معنى الفعل. وفي رواية الديوان والأغاني «إِثْرَ قَوْمٍ»، و«إثر» ظرف."
  - "«هُمُ» مبتدأ، وجملة «كَانُوا الشِّفَاءَ» خبره، والجملة كلها في محل جر نعت لـ«أُنَاسٍ»."
  - "«فَلَمْ يُصَابُوا» فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه حذف النون، والواو نائب فاعل."
morphology:
  - "«أُنَاس» اسم جمع لا واحد له من لفظه."
  - "«يُصَابُوا» مضارع «أُصيب» المبني للمجهول، وماضيه «أصاب» على «أفعل»، وأصل عينه واو من «صوب»."
rhetoric:
  thesis: "يفتتح بالحسرة قبل أن يقول ما حدث: فالسامع يعرف أولًا أن شيئًا فاته، ثم يعرف ما هو."
  devices:
    - title: "نداء الحسرة"
      text: "نادى «اللهف» وهو لا يسمع ولا يجيب، والغرض إظهار الحسرة لا طلب الإقبال. وبدأ بـ«ألا» ليستوقف السامع قبل الخبر."
    - title: "تشبيه بليغ"
      text: "قال «هم كانوا الشفاء» ولم يقل: كانوا كالشفاء. فالثأر من قتلة أبيه هو الدواء الذي يبرئ نفسه من غيظها، فجعلهم الدواء نفسه. وفي ذلك الإشارة إلى ما في نفسه من علّة لا يبرئها إلا دمهم."
    - title: "المفارقة"
      text: "اجتمع في الشطر الثاني الشفاء المرجوّ والحرمان منه: «كانوا الشفاء» ثم «فلم يُصابوا»، والفاء تسرع بالخيبة بعد الرجاء."
  connection: "يقول إنهم لم يُصابوا، ثم يفسّر في البيت التالي كيف نجوا: وقاهم حظهم بإخوتهم."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "أَلَا يَا لَهْ / فَ هِنْدِنْ مِنْ / أُنَاسِنْ = مفاعلْتن / مفاعلْتن / فعولن — هُمُو كَانُشْ / شِفَاءَ فَلَمْ / يُصَابُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. ودخل الحشوَ العَصَب، وهو تسكين الخامس، فتصير «مفاعلَتن» «مفاعلْتن» [@atiq، ص54]، في التفعيلتين الأوليين من الصدر، والأولى من العَجُز. والعَرُوض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها القَطْف، وهو تسكين الخامس وحذف السبب الخفيف من آخرها، فصارت «مفاعلْ» ثم «فعولن» [@atiq، ص54]. وتُشبع ضمة الميم في «هُمُ» فتُنطق «هُمُو»."
context: "مطلع المقطوعة. قالها بعد أن أغار على بني كِنانة يظنهم بني أَسَد، فتبين خطأه، وكان بنو أَسَد قد رحلوا بليل [@aghani، ج9 ص108–109]. فالأبيات حسرة على ثأر أخطأ."
variants:
  - reading: "أَلَا يَا لَهْفَ نَفْسِي إِثْرَ قَوْمٍ"
    status: "رواية ابن قُتَيْبة"
    note: "فالحسرة فيها حسرة الشاعر نفسه [@ibn-qutayba، ج1 ص117]."
  - reading: "أَلَا يَا لَهْفَ هِنْدٍ إِثْرَ قَوْمٍ"
    status: "رواية الديوان والأغاني"
    note: "«إثر قوم» مكان «من أناس» [@diwan-imru-al-qais، ص83] [@aghani، ج9 ص109]."
