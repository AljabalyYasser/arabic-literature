first: "وَأَفْلَتَهُنَّ عِلْبَاءٌ جَرِيضًا"
second: "وَلَوْ أَدْرَكْنَهُ صَفِرَ الْوِطَابُ"
meaning: "وأفلت عِلْباء من الخيل التي طلبته وقد كاد يموت فزعًا، ولو أدركته لقُتل. قال ابن قُتَيْبة: «يريد أفلتهن مجهودًا يكاد يقضي» [@ibn-qutayba، ج1 ص117، الحاشية]."
vocabulary:
  - term: "أَفْلَتَهُنَّ"
    text: "نجا منهن، والضمير للخيل التي كانت تطلبه [@diwan-imru-al-qais، ص83]."
  - term: "عِلْبَاءٌ"
    text: "عِلْباء بن الحارِث الأَسَدِيّ. هو في إحدى روايتي ابن قُتَيْبة قاتل حُجْر أبي امرئ القَيْس [@ibn-qutayba، ج1 ص116–117]، وهو الذي أنذر بني أَسَد فرحلوا بليل [@aghani، ج9 ص108]."
  - term: "جَرِيضًا"
    text: "«الغاصّ بريقه من الفزع» [@diwan-imru-al-qais، ص83]. و«الجَرَض والجريض: غُصص الموت» [@ibn-qutayba، ج1 ص117، الحاشية]."
  - term: "صَفِرَ"
    text: "خلا [@ibn-qutayba، ج1 ص117، الحاشية]."
  - term: "الْوِطَابُ"
    text: "جمع وَطْب، «وهو سقاء اللبن» [@ibn-qutayba، ج1 ص117، الحاشية]."
syntax:
  - "«أَفْلَتَهُنَّ» فعل ماض، و«هنّ» مفعول به، و«عِلْبَاءٌ» فاعل مؤخر، و«جَرِيضًا» حال منه."
  - "«وَلَوْ» حرف شرط غير جازم. و«أَدْرَكْنَهُ» فعل ماض مبني على السكون لاتصاله بنون النسوة، والنون فاعل، والهاء مفعول به، والجملة فعل الشرط."
  - "«صَفِرَ الْوِطَابُ» فعل وفاعل، والجملة جواب «لو». وحُذفت منها اللام التي تكثر في جواب «لو»، والأصل: لصَفِرَ."
morphology:
  - "«عِلْبَاء» على «فِعْلاء»، وهمزته ليست للتأنيث، ولذلك نُوّن. والوزن يشهد بالتنوين، فبغيره ينكسر البيت."
  - "«جَرِيض» صفة على «فعيل»."
  - "«الْوِطَاب» جمع «وَطْب» على «فِعال»."
  - "أسند الفعل إلى نون النسوة وهو يريد الخيل، لأن جمع غير العاقل يعامل معاملة جمع المؤنث."
rhetoric:
  thesis: "يختم بصورة الرجل الذي فاته أكثر من غيره: قاتل أبيه ينجو بآخر نَفَس. ولا يصرّح بما كان سيحلّ به لو أُدرك، بل يكني عنه بالوطاب الفارغ."
  devices:
    - title: "الكناية عن الهلاك"
      text: "أراد: لو أدركته لقُتل، فقال «صفر الوطاب»، وهو معنى يتبع القتل ويلزمه، على ما يقول عبد القاهر في الكناية: «يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. وقد اختلفوا في وجه الكناية. سُئل يونس عن «صفر الوطاب» فقال: «سألنا رؤبة عنه فقال: لو أدركوه قتلوه وساقوا إبله، فصفرت وطابه من اللبن». وقال غيره: «إنه كان يُقتل فيكون جسمه صفرًا من دمه، كما يكون الوطاب صفرًا من اللبن» [@aghani، ج9 ص109]. فالوطاب على قول رؤبة وطاب علباء نفسه، وعلى القول الآخر جسده."
    - title: "صورة النجاة"
      text: "لم يقل: أفلت علباء ناجيًا، بل قال «جريضًا»، أي غاصًّا بريقه من الفزع. فنجاته نجاة بشقّ النفس، وكأن الشاعر يعزّي نفسه بأن عدوه ذاق طعم الموت وإن لم يمت."
  connection: "آخر المقطوعة. وبعدها في الخبر أنه أدرك بني أَسَد ظهرًا، فقاتلهم حتى كثر فيهم القتل، فلما أصبح قالت له بَكْر وتَغْلِب: «قد أصبت ثأرك»، فقال: «والله ما فعلت»، فانصرفوا عنه [@aghani، ج9 ص109]."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "وَأَفْلَتَهُنْ / نَ عِلْبَاءُنْ / جَرِيضَنْ = مفاعلتن / مفاعلْتن / فعولن — وَلَوْ أَدْرَكْ / نَهُو صَفِرَلْ / وِطَابُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "دخل العَصَب، وهو تسكين الخامس، فتصير «مفاعلَتن» «مفاعلْتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والأولى من العَجُز. والعَرُوض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها القَطْف، وهو تسكين الخامس وحذف السبب الخفيف من آخرها، فصارت «مفاعلْ» ثم «فعولن» [@atiq، ص54]. وتُشبع ضمة الهاء في «أدركنهُ» فتُنطق «أدركنهُو»."
context: "في روايات مقتل حُجْر الأربع عند أبي الفَرَج يكون عِلْباء بن الحارِث قاتله بيده أو صاحب الرأي في قتله، وكان حُجْر قد قتل أباه [@aghani، ج9 ص100–104]؛ وفي رواية ابن قُتَيْبة الثانية هو قاتله [@ibn-qutayba، ج1 ص116–117]. فالرجل الذي أفلت من خيل امرئ القَيْس هو طلبته الأولى. وبهذا يفهم القارئ لماذا ختم المقطوعة باسمه."
