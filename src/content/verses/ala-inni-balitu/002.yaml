explained: false
first: "فَإِنْ أَوْدَى الشَّبَابُ فَلَمْ أُضِعْهُ"
second: "وَلَمْ أَتْكَلْ عَلَى أَنِّي غُذِيتُ"
vocabulary:
  - term: "أَوْدَى"
    text: "ذهب وولّى، كما يفسّرها المحققان [@asmaiyyat، ص83، الحاشية]."
  - term: "أَتْكَلْ"
    text: "أتّكل، أي أعتمد، خُففت تاؤه كما يقول المحققان [@asmaiyyat، ص83، الحاشية]."
  - term: "غُذِيتُ"
    text: "رُبّيت في نعمة."
