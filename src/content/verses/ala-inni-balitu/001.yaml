explained: false
first: "أَلَا إِنِّي بَلِيتُ وَقَدْ بَقِيتُ"
second: "وَإِنِّي لَنْ أَعُودَ كَمَا غَنِيتُ"
vocabulary:
  - term: "بَلِيتُ"
    text: "هرمت وأخلقت كالثوب البالي. ويقول المحققان إنه يريد أنه صار شيخًا فانيًا لن يعود إلى شبابه [@asmaiyyat، ص83، الحاشية]."
  - term: "غَنِيتُ"
    text: "كنت وأقمت."
