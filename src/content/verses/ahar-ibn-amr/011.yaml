first: وَإِذْ هِيَ تَمْشِي كَمَشْيِ النَّزِيـ
second: ـفِ يَصْرَعُهُ بِالْكَثِيبِ الْبُهُرْ
vocabulary:
- term: النَّزِيفِ
  text: 'السكران؛ قال أبو عَمْرو: «النزيف السكران» [@lisan، ج9 ص327].'
- term: الْبُهُرْ
  text: '«والبهر بالضم: تتابع النفس من الإعياء» [@lisan، ج4 ص82].'
- term: الْكَثِيبِ
  text: التلّ من الرمل.
