first: لَهَا حَافِرٌ مِثْلُ قَعْبِ الْوَلِيـ
second: ـدِ رُكِّبَ فِيهِ وَظِيفٌ عَجِرْ
vocabulary:
- term: قَعْبِ الْوَلِيدِ
  text: قدح الصبي، شبّه به الحافر في استدارته.
- term: وَظِيفٌ
  text: ما فوق الحافر من الساق.
- term: عَجِرْ
  text: '«ووظيف عجر وعجر، بكسر الجيم وضمها: صلب شديد» [@lisan، ج4 ص543].'
