explained: false
first: وَقَدْ رَابَنِي قَوْلُهَا يَا هَنَاـ
second: ـهُ وَيْحَكَ أَلْحَقْتَ شَرًّا بِشَرّْ
vocabulary:
- term: رَابَنِي
  text: «أوقعني في الريبة» [@khizana، ج1 ص375].
- term: يَا هَنَاهُ
  text: «أي يا رجل، ولا يستعمل إلا في النداء» [@lisan، ج13 ص438].
- term: أَلْحَقْتَ شَرًّا بِشَرّْ
  text: «أي كنت متهما فلما صرت إلينا ألحقت تهمة بعد تهمة» [@khizana، ج1 ص375].
