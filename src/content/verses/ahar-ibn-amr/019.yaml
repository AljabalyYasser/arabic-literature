first: "وَقَدْ رَابَنِي قَوْلُهَا يَا هَنَاـ"
second: "ـهُ وَيْحَكَ أَلْحَقْتَ شَرًّا بِشَرّْ"
meaning: "وأقلقني قولها لي: يا رجل، ويحك، زدتَ تهمةً على تهمة. أي كان الناس يتهموننا من قبل بأن بيننا علاقة، فلما جئتني وفعلت ما فعلت زدتَ على تلك التهمة تهمة أخرى. قال البَغْداديّ: «ورابني أوقعني فِي الرِّيبَة»، و«وَقَوله ألحقت شرا بشر أَي كنت مُتَّهمًا فَلَمَّا صرت إِلَيْنَا ألحقت تُهْمَة بعد تُهْمَة» [@khizana، ج1 ص375]. والشرّ هنا الفضيحة وتهمة الزنا، لا الأذى."
vocabulary:
  - term: "رَابَنِي"
    text: "«أوقعني فِي الرِّيبَة» [@khizana، ج1 ص375]، أي أقلقني وأخافني."
  - term: "يَا هَنَاهُ"
    text: "يا رجل، نداء فيه جفاء: «فَمَعْنَى يَا هَناه يَا رجل وَلَا يسْتَعْمل إِلَّا فِي النداء عِنْد الْجفَاء والغلظة» [@khizana، ج1 ص375]. وفي اللسان: «وَقَوْلُهُمْ: يَا هَناه أَي يَا رَجُلُ، وَلَا يُسْتَعْمَلُ إِلَّا فِي النِّدَاءِ»، وأنشد البيت [@lisan، ج13 ص438]."
  - term: "وَيْحَكَ"
    text: "كلمة ترحّم وتوجّع تقال لمن وقع في أمر يُخاف عليه منه."
  - term: "أَلْحَقْتَ شَرًّا بِشَرّْ"
    text: "«أَي كنت مُتَّهمًا فَلَمَّا صرت إِلَيْنَا ألحقت تُهْمَة بعد تُهْمَة» [@khizana، ج1 ص375]."
syntax:
  - "«وَقَدْ رَابَنِي قَوْلُهَا»: «قد» للتحقيق، و«رابني» فعل ماض والنون للوقاية والياء مفعول به، و«قولُها» فاعل."
  - "«يَا هَنَاهُ وَيْحَكَ أَلْحَقْتَ شَرًّا بِشَرّْ»: مقول القول، في محل نصب. و«يا» حرف نداء، و«هَنَاهُ» منادى مبني على الضم في محل نصب. و«ويحَك» مفعول مطلق لفعل محذوف، أو منصوب على المصدر."
  - "«أَلْحَقْتَ شَرًّا بِشَرّْ»: فعل وفاعل، و«شرًّا» مفعول به، و«بِشَرّْ» متعلق بـ«ألحقت»، وسُكّن آخره للقافية."
morphology:
  - "«رَابَ» أجوف يائي من «الرَّيْب»، ماضيه «رابَ يَرِيبُ»، قُلبت الياء ألفًا."
  - "«هَنَاه» من «هَن»، وهي كلمة يُكنى بها عن الشيء والشخص، زيدت فيها الألف والهاء في النداء. يقول البَغْداديّ: «وهناه كلمة يكنى بهَا عَن النكرات كَمَا يكنى بفلان عَن الْأَعْلَام» [@khizana، ج1 ص375]."
  - "«أَلْحَقَ» على «أَفْعَلَ» من «لَحِقَ»، والهمزة فيه للتعدية."
rhetoric:
  thesis: "يختم المغامرة بصوتها هي: لا شكر ولا شوق، بل خوف من الفضيحة. فهو يجعل المرأة تلومه بعد أن نال منها ما أراد، وفي لومها اعتراف بما جرى."
  devices:
    - title: "الحوار"
      text: "نقل كلامها بلفظه: «يَا هَنَاهُ وَيْحَكَ أَلْحَقْتَ شَرًّا بِشَرّْ»، فصار البيت مشهدًا يُسمع فيه صوتان. ومثله في «ألا عم صباحًا»: «فقالت سباك الله إنك فاضحي»، وفي المعلقة: «فقالت لك الويلات إنك مرجلي»."
    - title: "الكناية في «شَرًّا بِشَرّْ»"
      text: "لم تقل: زدت التهمة بالزنا، بل قالت «شرًّا بشرّ». فالشرّ الأول تهمة الناس، والشرّ الثاني فعلهما الليلة. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "التدوير"
      text: "انقسمت كلمة «هَنَاهُ» بين الشطرين: «هَنَا» آخر الصدر، و«هُ» أول العجز. والتدوير أن تشترك كلمة واحدة بين الصدر والعجز، وهو هنا يجعل النداء ممتدًا لا ينقطع عند نهاية الشطر."
  connection: "ثم ينتقل إلى الصيد: «وقد أغتدي ومعي القانصان»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الراء الساكنة"
  scansion: "وَقَدْ رَا / بَنِي قَوْ / لُهَا يَا / هَنَا = فعولن / فعولن / فعولن / فعَلْ — هُ وَيْحَ / كَ أَلْحَقْ / تَ شَرْرَنْ / بِشَرْرْ = فعولُ / فعولن / فعولن / فعولْ"
  note: "دخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الأولى من العجز. والعروض محذوفة «فعَلْ» [@atiq، ص121]، والضرب مقصور «فعولْ»، والقصر «بحذف الحرف الأخير وتسكين ما قبله» [@atiq، ص122]."
context: "آخر أبيات المغامرة مع هِرّ (11–19)، وبعده يبدأ الصيد. وقد أنشده البَغْداديّ مع سابقه بعد شاهده «فثوبٌ نسيت وثوبٌ أجرّ»، وقال إن الضمائر المؤنثة في الأبيات راجعة إلى هِرّ، وإنها كانت زوج أبيه [@khizana، ج1 ص375]. فالتهمة التي تخافها، على قوله، تهمة الابن بامرأة أبيه."
