first: كَأَنَّ الْمُدَامَ وَصَوْبَ الْغَمَامِ
second: وَرِيحَ الْخُزَامَى وَنَشْرَ الْقُطُرْ
vocabulary:
- term: الْمُدَامَ
  text: الخمر.
- term: صَوْبَ الْغَمَامِ
  text: 'المطر، و«صوب الغمام: الذي يمزج به الخمر» [@lisan، ج5 ص107].'
- term: الْخُزَامَى
  text: نبت طيب الريح.
- term: نَشْرَ الْقُطُرْ
  text: '«ونشر القطر: وهو رائحة العود» [@lisan، ج5 ص107].'
