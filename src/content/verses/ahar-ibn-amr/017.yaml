explained: false
first: "فَلَمَّا دَنَوْتُ تَسَدَّيْتُهَا"
second: "فَثَوْبًا نَسِيتُ وَثَوْبًا أَجُرّْ"
vocabulary:
  - term: "تَسَدَّيْتُهَا"
    text: "علوتها، قال ابن الأَنْبارِيّ في شرح المفضليات كما ينقل البَغْداديّ: «يقال تسديته إذا تخطيت إليه وقيل علوته» [@khizana، ج1 ص374]. وفي اللسان: «وتسدّى الرجل جاريته إذا علاها»، وأنشد البيت برواية «فثوبًا لبستُ» [@lisan، ج14 ص377]."
  - term: "فَثَوْبًا نَسِيتُ وَثَوْبًا أَجُرّْ"
    text: "نسي ثوبًا وجرّ آخر. نقل البَغْداديّ عن ابن هشام: «وإنما نسي ثوبه لشغل قلبه»، «وإنما جر الآخر ليعفي الأثر على القافة» [@khizana، ج1 ص373]، أي ليمحو أثر قدميه فلا يتبعه من يعرفون الآثار."
