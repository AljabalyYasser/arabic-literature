first: "فَلَمَّا دَنَوْتُ تَسَدَّيْتُهَا"
second: "فَثَوْبًا نَسِيتُ وَثَوْبًا أَجُرّْ"
meaning: "فلما اقتربتُ منها علوتُها، أي ركبتُها فجامعتها، ثم خرجت مسرعًا فنسيت ثوبًا عندها، وجررت ثوبًا آخر خلفي أمحو به آثار قدميّ. وفي اللسان: «وتَسَدَّى الرَّجُلُ جاريِتَه إِذَا عَلَاهَا»، وأنشد البيت [@lisan، ج14 ص377]. ونقل البَغْداديّ عن ابن الأَنْبارِيّ في شرح المفضليات: «يقال تسديته إذا تخطيت إليه وقيل علوته»، وعن ابن هشام في الثوبين: «وإنما نسي ثوبه لشغل قلبه»، «وإنما جر الآخر ليعفي الأثر على القافة» [@khizana، ج1 ص373–374]، والقافة الذين يتتبعون الآثار. فالبيت يقول صراحة إنه جامعها، ثم يصف خروجه مرتبكًا خائفًا."
vocabulary:
  - term: "دَنَوْتُ"
    text: "اقتربت منها."
  - term: "تَسَدَّيْتُهَا"
    text: "علوتها، والمراد الجماع: «وتَسَدَّى الرَّجُلُ جاريِتَه إِذَا عَلَاهَا» [@lisan، ج14 ص377]. وفيه قول آخر نقله البَغْداديّ عن ابن الأَنْبارِيّ: «يقال تسديته إذا تخطيت إليه» [@khizana، ج1 ص374]، أي تخطيت إليها من حولها."
  - term: "فَثَوْبًا نَسِيتُ"
    text: "نسيت ثوبًا عندها، «لشغل قلبه» كما يقول ابن هشام [@khizana، ج1 ص373]."
  - term: "وَثَوْبًا أَجُرّْ"
    text: "أجرّ ثوبًا آخر على الأرض «ليعفي الأثر على القافة» [@khizana، ج1 ص373]، أي ليمحو أثر قدميه فلا يعرفه من يتتبع الآثار."
syntax:
  - "«فَلَمَّا دَنَوْتُ»: «لمّا» ظرف بمعنى «حين» متضمن معنى الشرط، و«دنوتُ» فعل الشرط، و«تَسَدَّيْتُهَا» جوابه، والهاء مفعول به."
  - "«فَثَوْبًا نَسِيتُ وَثَوْبًا أَجُرّْ»: «ثوبًا» مفعول به مقدم لـ«نسيت»، و«ثوبًا» الثاني مفعول به مقدم لـ«أجرّ»، والجملتان معطوفتان على الجواب. وتقديم المفعول هنا للتقسيم: ثوب لهذا وثوب لذاك."
  - "ورواه النحاة بالرفع: «فثوبٌ نسيتُ وثوبٌ أجرّ»، شاهدًا على حذف الضمير العائد من الخبر، أي: فثوبٌ نسيته وثوبٌ أجرّه. ونقل البَغْداديّ عن ابن عقيل: «وَجَاز الِابْتِدَاء بِثَوْب وَهُوَ نكرَة لِأَنَّهُ قصد بِهِ التنويع» [@khizana، ج1 ص373]، والتنويع ذكر الشيء أنواعًا."
morphology:
  - "«تَسَدَّى» على «تَفَعَّلَ» من «سدا»، ناقص واوي، وأصل معناه العلوّ والأخذ من فوق: «وتَسَدَّى فُلَانٌ فُلَانًا إِذَا أَخذه مِنْ فَوْقِه» [@lisan، ج14 ص377]."
  - "«دَنَوْتُ» من «دَنَا يَدْنُو» ناقص واوي، و«أَجُرّ» مضارع «جَرَّ» المضعف."
rhetoric:
  thesis: "ذروة المغامرة في القصيدة: الدنوّ، ثم الجماع في كلمة واحدة، ثم الخروج. ولا يطيل في الفعل نفسه، بل في أثره: ثوب منسيّ وثوب مجرور. فالقارئ يفهم ما جرى من ارتباك الخارج."
  devices:
    - title: "الإيجاز في «تَسَدَّيْتُهَا»"
      text: "جمع الجماع كله في فعل واحد بعد «دنوت»، ثم انتقل مباشرة إلى ما بعده. والإيجاز أن يؤدّى المعنى الكثير بلفظ قليل، وهو هنا يجعل الفعل خاطفًا كالزيارة نفسها."
    - title: "التقسيم في «فَثَوْبًا ... وَثَوْبًا»"
      text: "قسّم الثوبين: ثوب نسيه، وثوب جرّه. والأول دليل على شغل القلب، والثاني دليل على الحذر، فاجتمع في صورة واحدة الولع والخوف. وقد فسّرهما ابن هشام كذلك فيما ينقله البَغْداديّ [@khizana، ج1 ص373]."
    - title: "الكناية في جرّ الثوب"
      text: "«وَثَوْبًا أَجُرّْ» لم يقل فيه إنه خاف أن يُتتبَّع، بل ذكر جرّ الثوب، وهو ما يفعله الخائف ليمحو أثره، فدلّ به على خوفه. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. ومثله في المعلقة: «فَقُمْتُ بِهَا أَمْشِي تَجُرُّ وَرَاءَنَا ... عَلَى إِثْرِنَا أَذْيَالَ مِرْطٍ مُرَحَّلِ»."
  connection: "ثم يقول إن أحدًا لم يرهما: «وَلَمْ يَرَنَا كَالِئٌ كَاشِحٌ»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الراء الساكنة"
  scansion: "فَلَمْمَا / دَنَوْتُ / تَسَدْدَيْ / تُهَا = فعولن / فعولُ / فعولن / فعَلْ — فَثَوْبَنْ / نَسِيتُ / وَثَوْبَنْ / أَجُرْرْ = فعولن / فعولُ / فعولن / فعولْ"
  note: "دخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الثانية من الشطرين. والعروض محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]. والضرب مقصور «فعولْ»، والقصر «بحذف الحرف الأخير وتسكين ما قبله» [@atiq، ص122]، وهو ضرب القصيدة كلها، لأن رويّها راء ساكنة."
context: "صاحبة الأبيات 7–19 امرأة اسمها هِرّ، ويقول البَغْداديّ: «وهذه الضمائر المؤنثة راجعة إلى هر ... وهي التي كان يشبب بها في أشعاره وكانت زوجة والده فلذلك كان طرده وهم بقتله من أجلها» [@khizana، ج1 ص375]. فالمغامرة على قوله مع امرأة أبيه، وهو خبر نذكره منسوبًا إلى البَغْداديّ. والقصيدة نفسها مختلف في نسبتها: أثبتها لامرئ القَيْس أبو عَمْرو الشَّيْبانيّ والمُفَضَّل، ورواها الأَصْمَعِيّ لرَبِيعة بن جُعْشُم [@khizana، ج1 ص374]. والبيت من شواهد النحاة على حذف العائد، أنشده البَغْداديّ شاهدًا على ذلك [@khizana، ج1 ص373]."
variants:
  - reading: "فَأَقْبَلْتُ زَحْفًا عَلَى الرُّكْبَتَيْنِ / فَثَوْبٌ نَسِيتُ وَثَوْبٌ أَجُرّْ"
    status: "رواية النحاة، وهي عند البَغْداديّ شاهد سيبويه"
    note: "صدر آخر، والثوبان بالرفع [@khizana، ج1 ص373]. ويقول ابن هشام فيما ينقله البَغْداديّ إنه جرّ الثوب ليعفّي الأثر «وَلِهَذَا زحف على الرُّكْبَتَيْنِ» [@khizana، ج1 ص373]، أي مشى على ركبتيه لئلا تظهر آثار قدميه."
  - reading: "فَلَمَّا دَنَوْتُ تَسَدَّيْتُهَا / فَثَوْبًا لَبِسْتُ وَثَوْبًا أَجُرّْ"
    status: "رواية اللسان"
    note: "«لبستُ» مكان «نسيتُ» [@lisan، ج14 ص377]، فيلبس ثوبًا ويجرّ الآخر، ولا نسيان في الصورة."
