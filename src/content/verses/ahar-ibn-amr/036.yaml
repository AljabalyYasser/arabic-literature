first: لَهَا مِنْخَرٌ كَوِجَارِ السِّبَاعِ
second: فَمِنْهُ تُرِيحُ إِذَا تَنْبَهِرْ
vocabulary:
- term: كَوِجَارِ السِّبَاعِ
  text: '«والوجار والوجار: سرب الضبع» [@lisan، ج5 ص280]، أي جحر السبع؛ «وإنما أراد سعة المنخر». ويروى «كوجار الضباع» [@diwan-imru-al-qais، ص165].'
- term: تُرِيحُ
  text: تتنفّس.
- term: تَنْبَهِرْ
  text: ينقطع نفَسها من العَدْو.
