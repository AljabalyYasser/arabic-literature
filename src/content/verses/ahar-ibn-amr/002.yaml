first: فَلَا وَأَبِيكِ ابْنَةَ الْعَامِرِـ
second: ـيِّ لَا يَدَّعِي الْقَوْمُ أَنِّي أَفِرّْ
vocabulary:
- term: ابْنَةَ الْعَامِرِيِّ
  text: 'فاطمة؛ قال ابن قُتَيْبة: «منهن فاطمة بنت العبيد بن ثعلبة بن عامر العذرية، وهي التي يقول لها: أفاطم مهلا بعض هذا التدلل» [@ibn-qutayba، ج1 ص122].'
- term: أَفِرّْ
  text: أفرّ، أي أهرب.
