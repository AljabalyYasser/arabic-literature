first: بَرَهْرَهَةٌ رُودَةٌ رَخْصَةٌ
second: كَخُرْعُوبَةِ الْبَانَةِ الْمُنْفَطِرْ
vocabulary:
- term: بَرَهْرَهَةٌ
  text: «هي الرقيقة الجلد كأن الماء يجري فيها من النعمة» [@lisan، ج13 ص476].
- term: رُودَةٌ رَخْصَةٌ
  text: شابة ناعمة، لينة البدن.
- term: كَخُرْعُوبَةِ الْبَانَةِ
  text: 'كغصن البان؛ «والغصن الخرعوب: المنثني» [@lisan، ج1 ص351].'
- term: الْمُنْفَطِرْ
  text: الذي تفطّر عن ورقه الجديد.
