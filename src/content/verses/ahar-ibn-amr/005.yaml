first: تَرُوحُ مِنَ الْحَيِّ أَمْ تَبْتَكِرْ
second: وَمَاذَا عَلَيْكَ بِأَنْ تَنْتَظِرْ
vocabulary:
- term: تَرُوحُ
  text: ترحل في الرَّواح، أي آخر النهار؛ يخاطب نفسه.
- term: تَبْتَكِرْ
  text: ترحل في البُكرة، أي أول النهار.
