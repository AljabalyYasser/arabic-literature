first: إِذَا رَكِبُوا الْخَيْلَ وَاسْتَلْأَمُوا
second: تَحَرَّقَتِ الْأَرْضُ وَالْيَوْمُ قَرّْ
vocabulary:
- term: اسْتَلْأَمُوا
  text: لبسوا اللأمة، وهي الدرع.
- term: قَرّْ
  text: 'بارد؛ قال ابن الأعرابي: «يوم قر ولا أقول قار»، وأنشد: «تحرقت الأرض واليوم قر» [@lisan، ج5 ص83].'
