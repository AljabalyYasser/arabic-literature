first: لَهَا عَجُزٌ كَصَفَاةِ الْمَسِيـ
second: ـلِ أَبْرَزَ عَنْهَا جُحَافٌ مُضِرّْ
vocabulary:
- term: كَصَفَاةِ الْمَسِيلِ
  text: كالصخرة الملساء في مجرى السيل.
- term: جُحَافٌ
  text: «وسيل جحاف، بالضم، يذهب بكل شيء ويجحفه أي يقشره» [@lisan، ج9 ص21].
- term: مُضِرّْ
  text: 'مقارب؛ «ويقال: مر الشيء مضرا ومجحفا أي مقاربا» [@lisan، ج9 ص21].'
