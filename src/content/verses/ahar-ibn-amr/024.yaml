first: فَكَرَّ إِلَيْهِ بِمِبْرَاتِهِ
second: كَمَا خَلَّ ظَهْرَ اللِّسَانِ الْمُجِرّْ
vocabulary:
- term: بِمِبْرَاتِهِ
  text: بقرنه؛ «أي كر الثور على الكلب بمبراته أي بقرنه فشق بطن الكلب كما شق المجر لسان الفصيل لئلا يرتضع» [@lisan، ج4 ص129].
- term: خَلَّ
  text: شقّ.
