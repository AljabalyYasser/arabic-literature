explained: false
first: أَحَارِ بْنَ عَمْرٍو كَأَنِّي خَمِرْ
second: وَيَعْدُو عَلَى الْمَرْءِ مَا يَأْتَمِرْ
vocabulary:
- term: أَحَارِ
  text: 'يا حارِث، فرخّم الاسم؛ قال البغدادي: «والهمزة للنداء وحار مرخم حارث» [@khizana، ج1 ص374].'
- term: خَمِرْ
  text: «الذي قد خالطه داء أو حب» [@lisan، ج4 ص29].
- term: مَا يَأْتَمِرْ
  text: «أي ما تأمره به نفسه فيرى أنه رشد فربما كان هلاكه في ذلك» [@lisan، ج4 ص30].
