explained: false
first: وَسَالِفَةٌ كَسَحُوقِ اللِّيَاـ
second: ـنِ أَضْرَمَ فِيهَا الْغَوِيُّ السُّعُرْ
vocabulary:
- term: سَالِفَةٌ
  text: صفحة العنق.
- term: كَسَحُوقِ
  text: «إذا طالت النخلة مع انجراد فهي سحوق» [@lisan، ج10 ص154].
- term: اللِّيَانِ
  text: النخل، واحدتها لِينة، «والجمع لين ولون وليان» [@lisan، ج13 ص393].
- term: السُّعُرْ
  text: النار.
