explained: false
first: وَسَالِفَةٌ كَسَحُوقِ اللُّبَاـ
second: ـنِ أَضْرَمَ فِيهِ الْغَوِيُّ السُّعُرْ
vocabulary:
- term: سَالِفَةٌ
  text: صفحة العنق.
- term: كَسَحُوقِ
  text: '«والسحوق: الطويلة» [@diwan-imru-al-qais، ص165]، وأصله في النخل: «إذا طالت النخلة مع انجراد فهي سحوق» [@lisan، ج10 ص154].'
- term: اللُّبَانِ
  text: 'شجر الكُنْدُر، «واللبان: شجرة اللبان» [@diwan-imru-al-qais، ص165]. وفي روايات أخرى «اللِّيان»، أي النخل، واحدتها لِينة، «والجمع لين ولون وليان» [@lisan، ج13 ص393].'
- term: السُّعُرْ
  text: النار.
