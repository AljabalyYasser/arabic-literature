explained: false
first: وَقَدْ أَغْتَدِي وَمَعِي الْقَانِصَانِ
second: وَكُلٌّ بِمَرْبَأَةٍ مُقْتَفِرْ
vocabulary:
- term: أَغْتَدِي
  text: أخرج غُدوة، أي في أول الصبح.
- term: الْقَانِصَانِ
  text: الصائدان.
- term: بِمَرْبَأَةٍ
  text: بموضع مرتفع يرقب منه؛ «ومربأة البازي، الموضع الذي يشرف عليه» [@lisan، ج1 ص82].
- term: مُقْتَفِرْ
  text: 'متتبّع الأثر؛ «واقتفره اقتفارا وتقفره، كله: اقتفاه وتتبعه» [@lisan، ج5 ص111].'
