first: "وَلَمْ يَرَنَا كَالِئٌ كَاشِحٌ"
second: "وَلَمْ يُفْشَ مِنَّا لَدَى الْبَيْتِ سِرّْ"
meaning: "ولم يرنا ونحن معًا حارسٌ ولا عدوٌّ يتربص بنا، ولم يُكشف لأحد عند البيت شيء مما جرى بيننا. فالبيت تتمة البيت السابق: جامعها وخرج، ولم يعلم بذلك أحد. قال البَغْداديّ: «والكالئ بِالْهَمْز الحارس والرقيب والكاشح الْمُبْغض» [@khizana، ج1 ص375]. والسرّ هنا ما فعلاه في الخلوة."
vocabulary:
  - term: "كَالِئٌ"
    text: "حارس رقيب: «والكالئ بِالْهَمْز الحارس والرقيب» [@khizana، ج1 ص375]."
  - term: "كَاشِحٌ"
    text: "عدوّ يخفي عداوته: «وَالْكَاشِحُ: الَّذِي يُضْمِرُ لَكَ الْعَدَاوَةَ»، قال ابن سِيدَه: «وَالْكَاشِحُ الْعَدُوُّ الباطنُ الْعَدَاوَةِ كأَنه يَطْوِيهَا فِي كَشْحه» [@lisan، ج2 ص572]، والكَشْح الخاصرة."
  - term: "يُفْشَ"
    text: "يُظهَر ويُذاع بين الناس."
  - term: "لَدَى الْبَيْتِ"
    text: "عند بيتها، حيث أهلها."
syntax:
  - "«وَلَمْ يَرَنَا»: «لم» حرف نفي وجزم، و«يرَ» مضارع مجزوم بحذف حرف العلة، و«نا» مفعول به، و«كَالِئٌ» فاعل، و«كَاشِحٌ» نعت له أو معطوف عليه بلا حرف عطف."
  - "«وَلَمْ يُفْشَ»: مضارع مبني للمجهول مجزوم بحذف الألف، و«سِرّْ» نائب فاعل مؤخر، وسكونه للقافية المقيدة. و«مِنَّا» و«لَدَى الْبَيْتِ» متعلقان بـ«يُفشَ»."
morphology:
  - "«كَالِئ» اسم فاعل من «كَلَأَ» مهموز اللام، بمعنى حرس وحفظ."
  - "«كَاشِح» اسم فاعل من «كَشَحَ»، مأخوذ من الكَشْح، وهو الخصر."
  - "«يُفْشَ» مضارع «أُفْشِيَ» المبني للمجهول من «أَفْشَى» على «أَفْعَلَ»، ناقص واوي من «فَشَا يَفْشُو»."
rhetoric:
  thesis: "بعد الجماع والخروج المرتبك، يطمئن السامع: لم يرهما أحد، ولم يُفشَ السرّ. فهو فخر بالحذق في التخفي، كما فخر في البيت السابق بالجرأة."
  devices:
    - title: "التكرار بـ«لم»"
      text: "«وَلَمْ يَرَنَا»، «وَلَمْ يُفْشَ»: نفيان متتابعان، الأول للرؤية والثاني للخبر. فلم يُر الفعل، ولم يُروَ بعد ذلك. والتكرار هنا يستوفي طرق الانكشاف كلها. وهذه قراءتنا."
    - title: "الكناية في «سِرّْ»"
      text: "سمّى ما جرى بينهما «سرًّا»، ولم يذكره. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. والسرّ الذي يُخشى إفشاؤه هنا هو الجماع نفسه."
  connection: "ثم يذكر أن قولها هو الذي أوقعه في الريبة: «وَقَدْ رَابَنِي قَوْلُهَا يَا هَنَاهُ»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ الراء الساكنة"
  scansion: "وَلَمْ يَ / رَنَا كَا / لِئُنْ كَا / شِحُنْ = فعولُ / فعولن / فعولن / فعَلْ — وَلَمْ يُفْ / شَ مِنْنَا / لَدَلْ بَيْ / تِ سِرْرْ = فعولن / فعولن / فعولن / فعولْ"
  note: "دخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الأولى من الصدر. والعروض محذوفة «فعَلْ» [@atiq، ص121]، والضرب مقصور «فعولْ»، والقصر «بحذف الحرف الأخير وتسكين ما قبله» [@atiq، ص122]."
context: "يأتي بعد البيت الصريح «فَلَمَّا دَنَوْتُ تَسَدَّيْتُهَا» (17)، وقبل قولها له «أَلْحَقْتَ شَرًّا بِشَرّْ» (19). وقد أنشد البَغْداديّ هذا البيت وتاليه بعد شاهده، وشرح ألفاظهما [@khizana، ج1 ص375]."
