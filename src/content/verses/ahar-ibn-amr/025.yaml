explained: false
first: فَظَلَّ يُرَنِّحُ فِي غَيْطَلٍ
second: كَمَا يَسْتَدِيرُ الْحِمَارُ النَّعِرْ
vocabulary:
- term: يُرَنِّحُ
  text: يدور ويتمايل من ألم الطعنة.
- term: غَيْطَلٍ
  text: «والغيطل والغيطلة الشجر الكثير الملتف» [@lisan، ج11 ص497].
- term: الْحِمَارُ النَّعِرْ
  text: الحمار الذي «دخلت النعرة في أنفه» [@lisan، ج5 ص221]، والنُّعَرة ذبابة.
