first: لَهَا ذَنَبٌ مِثْلُ ذَيْلِ الْعَرُوسِ
second: تَسُدُّ بِهِ فَرْجَهَا مِنْ دُبُرْ
vocabulary:
- term: مِثْلُ ذَيْلِ الْعَرُوسِ
  text: 'قال ابن رَشِيق: «أراد طوله؛ لأن العروس تجر ذيلها إما من الحياء وإما من الخيلاء» [@ibn-rashiq، ج2 ص56].'
- term: فَرْجَهَا
  text: ما بين رجليها.
