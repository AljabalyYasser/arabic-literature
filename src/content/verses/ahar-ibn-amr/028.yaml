explained: false
first: لَهَا ثُنَنٌ كَخَوَافِي الْعُقَاـ
second: ـبِ سُودٌ يَفِئْنَ إِذَا تَزْبَئِرّْ
vocabulary:
- term: ثُنَنٌ
  text: «وهي شعرات مدلاة مشرفات من خلف» الرسغ [@lisan، ج13 ص84].
- term: كَخَوَافِي الْعُقَابِ
  text: الريش الصغار في جناحه.
- term: يَفِئْنَ
  text: «يرجعن بعد ازبئرارها إلى مواضعهن» [@diwan-imru-al-qais، ص163]. ويروى «يفين» بلا همز «من الوفاء» [@diwan-imru-al-qais، ص163]، أي يكثرن [@lisan، ج13 ص84].
- term: تَزْبَئِرّْ
  text: ينتفش شعرها.
