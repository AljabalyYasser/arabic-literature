first: لَهَا ثُنَنٌ كَخَوَافِي الْعُقَاـ
second: ـبِ سُودٌ يَفِينَ إِذَا تَزْبَئِرّْ
vocabulary:
- term: ثُنَنٌ
  text: «وهي شعرات مدلاة مشرفات من خلف» الرسغ [@lisan، ج13 ص84].
- term: كَخَوَافِي الْعُقَابِ
  text: الريش الصغار في جناحه.
- term: يَفِينَ
  text: «غير مهموز، أي يكثرن» [@lisan، ج13 ص84].
- term: تَزْبَئِرّْ
  text: ينتفش شعرها.
