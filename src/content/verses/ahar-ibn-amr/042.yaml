first: لَهَا وَثَبَاتٌ كَوَثْبِ الظِّبَاءِ
second: فَوَادٍ خِطَاءٌ وَوَادٍ مَطِرْ
vocabulary:
- term: خِطَاءٌ
  text: جمع خَطْوة؛ «وخطاء مثل ركوة وركاء» [@lisan، ج14 ص231].
- term: مَطِرْ
  text: «وأراد واديا تخطو، وواديا تمطر فيه العدو»، أي تسرع فيه كالمطر [@diwan-imru-al-qais، ص167]. ويروى «مُطِر» بالبناء للمجهول [@diwan-imru-al-qais، ص425].
