explained: false
first: لَهَا مَتْنَتَانِ خَظَاتَا كَمَا
second: أَكَبَّ عَلَى سَاعِدَيْهِ النَّمِرْ
vocabulary:
- term: مَتْنَتَانِ
  text: «والمتنتان جنبتا الظهر» [@lisan، ج13 ص398].
- term: خَظَاتَا
  text: مكتنزتا اللحم؛ «أراد خظتا فمد فتحة الظاء بألف» [@lisan، ج13 ص218].
- term: أَكَبَّ عَلَى سَاعِدَيْهِ النَّمِرْ
  text: كالنمر إذا انحنى على ذراعيه، فبرز ظهره.
