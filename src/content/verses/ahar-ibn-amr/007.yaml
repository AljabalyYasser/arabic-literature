explained: false
first: وَفِيمَنْ أَقَامَ مِنَ الْحَيِّ هِرّْ
second: أَمِ الظَّاعِنُونَ بِهَا فِي الشُّطُرْ
vocabulary:
- term: هِرّْ
  text: 'صاحبته؛ قال البغدادي: «وكنيتها أم الحويرث وهي التي كان يشبب بها في أشعاره» [@khizana، ج1 ص375].'
- term: الظَّاعِنُونَ
  text: الراحلون.
- term: الشُّطُرْ
  text: 'البُعداء؛ «وحي شطير: بعيد، والجمع شطر» [@lisan، ج4 ص408].'
