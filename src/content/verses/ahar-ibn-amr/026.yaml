first: وَأَرْكَبُ فِي الرَّوْعِ خَيْفَانَةً
second: كَسَا وَجْهَهَا سَعَفٌ مُنْتَشِرْ
vocabulary:
- term: الرَّوْعِ
  text: الفزع، أي الحرب.
- term: خَيْفَانَةً
  text: 'فرسًا خفيفة كالجرادة؛ قال أبو نصر: «العرب تشبه الخيل بالخيفان» [@lisan، ج9 ص102].'
- term: سَعَفٌ
  text: «وشبه امرؤ القيس ناصية الفرس بسعف النخل» [@lisan، ج9 ص151].
