first: فَأَنْشَبَ أَظْفَارَهُ فِي النَّسَا
second: فَقُلْتُ هُبِلْتَ أَلَا تَنْتَصِرْ
vocabulary:
- term: أَنْشَبَ
  text: أعلق.
- term: النَّسَا
  text: عرق في الفخذ والساق. والكلب هنا يعلق بالثور الوحشي، كما في البيت التالي.
- term: هُبِلْتَ
  text: 'ثكلتك أمك؛ «هبلته أمه: ثكلته» [@lisan، ج11 ص686].'
