first: وَعَيْنٌ لَهَا حَدْرَةٌ بَدْرَةٌ
second: وَشُقَّتْ مَآقِيهِمَا مِنْ أُخُرْ
vocabulary:
- term: حَدْرَةٌ بَدْرَةٌ
  text: '«وعين حدرة بدرة: عظيمة؛ وقيل: حادة النظر» [@lisan، ج4 ص173].'
- term: مِنْ أُخُرْ
  text: من مؤخّرها؛ «وشق ثوبه أخرا ومن أخر أي من خلف» [@lisan، ج4 ص15].
