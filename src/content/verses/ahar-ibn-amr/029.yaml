first: وَسَاقَانِ كَعْبَاهُمَا أَصْمَعَاـ
second: ـنِ لَحْمُ حَمَاتَيْهِمَا مُنْبَتِرْ
vocabulary:
- term: أَصْمَعَانِ
  text: «أراد بالأصمع الضامر الذي ليس بمنتفخ» [@lisan، ج8 ص207].
- term: حَمَاتَيْهِمَا مُنْبَتِرْ
  text: 'الحماة: عضلة الساق، «والعرب تستحب انبتارها وتزيمها أي ضمورها واكتنازها» [@lisan، ج8 ص207].'
