first: "قَرِّبَا مَرْبِطَ النَّعَامَةِ مِنِّي"
second: "لَقِحَتْ حَرْبُ وَائِلٍ عَنْ حِيَالِ"
meaning: "يا صاحبيّ، قرّبا مني فرسي النَّعامة، فقد هاجت حرب وائِل من جديد بعد أن كانت ساكنة. والنعامة فرس الحارِث، وبها عُرف: «فارس النعامة» [@maydani، ج1 ص376]."
vocabulary:
  - term: "مَرْبِطَ"
    text: "الموضع الذي تُربط فيه الدابة، وأراد الفرس المربوطة فيه."
  - term: "النَّعَامَة"
    text: "اسم فرس الحارِث [@maydani، ج1 ص376]."
  - term: "لَقِحَتْ"
    text: "حملت. يقال: لقحت الناقة، إذا حملت."
  - term: "حِيَال"
    text: "أن لا تحمل الناقة. يقال: ناقة حائل."
  - term: "وَائِل"
    text: "أبو بَكْر وتَغْلِب، فحرب وائِل حرب الأخوين."
syntax:
  - "«قَرِّبَا»: فعل أمر مبني على حذف النون، وألف الاثنين فاعل. وخطاب الاثنين عادة في الشعر."
  - "«مَرْبِطَ»: مفعول به، و«النَّعَامَةِ» مضاف إليه، و«مِنِّي» متعلق بـ«قرّبا»."
  - "«لَقِحَتْ حَرْبُ وَائِلٍ»: فعل وفاعل ومضاف إليه. والجملة استئنافية تعلّل الأمر: قرّبا فرسي لأن الحرب قامت."
  - "«عَنْ حِيَالِ»: متعلق بـ«لقحت»، و«عن» للمجاوزة: لقحت بعد حِيال."
morphology:
  - "«مَرْبِط»: اسم مكان من «رَبَطَ يربِط» على «مَفْعِل»."
  - "«قَرِّبَا»: من «قرّب» على «فَعَّل»، والتضعيف للتعدية."
  - "«حِيَال»: مصدر «حالت الناقة»، أجوف."
rhetoric:
  thesis: "الحكيم الذي اعتزل الحرب يطلب فرسه: البيت كله انتقال من السكون إلى القتال."
  devices:
    - title: "ذكر المكان وإرادة ما فيه"
      text: "أمر بتقريب «المربط» وهو يريد الفرس المربوطة فيه، كما قال المُهَلْهِل: «واستبّ بعدك يا كُلَيْب المجلس»، يريد أهل المجلس. وهذا عند عبد القاهر ليس استعارة، بل «نقل اللفظ عن الشيء إلى الشيء بسبب اختصاص وضرب من الملابسة بينهما» [@asrar، ص400–401]. ويسميه البلاغيون بعده المجاز المرسل."
    - title: "الاستعارة"
      text: "«لقحت حرب وائِل عن حيال»: شبّه الحرب بناقة حائل حملت بعد أن كانت لا تحمل؛ فالحرب التي ظُن أنها سكنت ستلد شرورًا جديدة. والاستعارة عند عبد القاهر ما كان «نقله نقل التشبيه للمبالغة» [@asrar، ص401]."
    - title: "من البيئة"
      text: "الشاعر وسامعوه أهل إبل، يعرفون الناقة الحائل واللاقح. فالصورة تُفهم دون شرح."
  connection: "ثم يقول: «لا بُجَيْرٌ أغنى قتيلًا ولا رهطُ / كُلَيْبٍ تزاجروا عن ضلال»؛ أي: لم يُغنِ قتل بُجَيْر شيئًا، ولم يرتدع أهل كُلَيْب."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "قَرْرِبَا مَرْ / بِطَنْنَعَا / مَةِ مِنْنِي = فاعلاتن / متفع لن / فعِلاتن — لَقِحَتْ حَرْ / بُ وَائِلِنْ / عَنْ حِيَالِي = فعِلاتن / متفع لن / فاعلاتن"
  note: "وزن الخفيف: فاعلاتن مستفع لن فاعلاتن. ودخل الخَبْنُ «مستفع لن» في الشطرين فصارت «متفع لن»، ودخل «فاعلاتن» في آخر الصدر وأول العَجُز فصارت «فعِلاتن» [@atiq، ص98]."
context: "قالها حين بلغه أن المُهَلْهِل قتل بُجَيْرًا وقال: «بُؤْ بشِسْع نعل كُلَيْب» [@aghani، ج5 ص52–53]. وفي «مجمع الأمثال» بيت آخر بالصدر نفسه: «قَرِّبَا مَرْبِطَ النَّعَامَةِ مِنِّي / إِنَّ بَيْعَ الْكَرِيمِ بِالشِّسْعِ غَالِي» [@maydani، ج1 ص376]؛ أي: إن الكريم لا يُباع بشِسْع نعل."
