first: "لَمْ أَكُنْ مِنْ جُنَاتِهَا عَلِمَ اللَّـ"
second: "ـهُ وَإِنِّي بِحَرِّهَا الْيَوْمَ صَالِ"
meaning: "لم أكن ممن جنى هذه الحرب وأشعلها، يعلم الله ذلك، لكني اليوم أصلى نارها وأقاسي حرّها."
vocabulary:
  - term: "جُنَاتِهَا"
    text: "الذين جنوها، أي أوقعوها. واحدهم جانٍ."
  - term: "صَالِ"
    text: "من «صَلِيَ النار» إذا قاسى حرّها."
syntax:
  - "«لَمْ أَكُنْ»: «لم» حرف نفي وجزم، و«أكن» مضارع ناقص مجزوم، واسمه ضمير مستتر تقديره «أنا». و«مِنْ جُنَاتِهَا» متعلق بمحذوف خبرها."
  - "«عَلِمَ اللَّهُ»: جملة معترضة تفيد التوكيد، كأنه يُقسم."
  - "«وَإِنِّي»: الواو عاطفة، و«إنّ» والياء اسمها. و«بِحَرِّهَا» متعلق بـ«صالٍ»، و«الْيَوْمَ» ظرف زمان متعلق به أيضًا."
  - "«صَالِ»: خبر «إنّ» مرفوع بضمة مقدرة على الياء المحذوفة، لأنه اسم منقوص."
morphology:
  - "«جُنَاة» جمع «جانٍ» على «فُعَلة»، كقاضٍ وقُضاة، وأصله «جُنَيَة»، قُلبت الياء ألفًا."
  - "«صَالٍ» اسم فاعل من «صَلِيَ»، منقوص، حُذفت ياؤه مع التنوين."
  - "«حَرّ» مصدر «حَرّ يحِرّ»، مضعّف."
rhetoric:
  thesis: "بيت الرجل الذي يُجرّ إلى حرب لم يُردها: يتبرأ من إشعالها، ويعترف بأنه صار وقودها."
  devices:
    - title: "المقابلة"
      text: "بين «لم أكن من جناتها» و«إني بحرها اليوم صالٍ»: ماضٍ بريء، وحاضر مُكره. و«اليوم» تحدد لحظة التحول."
    - title: "الاعتراض"
      text: "«علم الله» اعترضت الكلام قبل أن يتم، فأكدت البراءة في موضعها."
    - title: "الاستعارة"
      text: "جعل للحرب حرًّا يُصلى كالنار، فصارت الحرب نارًا يحترق بها من لم يوقدها."
  connection: "وبهذه الأبيات دخل الحارِث الحرب، فكان له يوم قِضَة [@aghani، ج5 ص54]."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "لَمْ أَكُنْ مِنْ / جُنَاتِهَا / عَلِمَلْلَا = فاعلاتن / متفع لن / فعِلاتن — هُ وَإِنْنِي / بِحَرْرِهَلْ / يَوْمَ صَالِي = فعِلاتن / متفع لن / فاعلاتن"
  note: "البيت مدوّر، أي انقسمت كلمة «الله» بين شطريه. ودخل الخَبْنُ «مستفع لن» في الشطرين، و«فاعلاتن» في آخر الصدر وأول العَجُز [@atiq، ص98]."
context: "قال رواة «الأغاني»: «ولم يصحح عامر ولا مِسْمَع غير هذه الثلاثة الأبيات» [@aghani، ج5 ص53]، وعامر ومِسْمَع من رواة هذه الأخبار في «الأغاني»."
variants:
  - reading: "وَإِنِّي بِشَرِّهَا الْيَوْمَ صَالِ"
    status: "رواية المَيْدانيّ"
    note: "وذكر أنه يُروى «بحرّها» [@maydani، ج1 ص376]."
