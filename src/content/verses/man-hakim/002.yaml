first: "أَوْدَى بِسَادَتِنَا وَقَدْ"
second: "تَرَكُوا لَنَا حَلَقًا وَجُرْدَا"
vocabulary:
- term: "أَوْدَى"
  text: "أهلك."
- term: "حَلَقًا"
  text: "الدروع؛ «والدروع تسمى حلقة» [@lisan، ج10 ص64]."
- term: "جُرْدَا"
  text: "الخيل القصيرة الشعر، جمع أجرد: «وفرس أجرد: قصير الشعر... وذلك من علامات العتق والكرم» [@lisan، ج3 ص116]، أي من علامات الأصالة."
