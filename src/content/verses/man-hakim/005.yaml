explained: false
first: "فَضَعِي قِنَاعَكِ إِنَّ رَيْـ"
second: "ـبَ الدَّهْرِ قَدْ أَفْنَى مَعَدَّا"
vocabulary:
- term: "فَضَعِي قِنَاعَكِ"
  text: "يخاطب امرأته: ألقي غطاء رأسك، أي لا تتستري بالحزن ولا تجزعي؛ فالمصيبة عامة."
- term: "رَيْبَ الدَّهْرِ"
  text: "حوادثه."
- term: "مَعَدَّا"
  text: "مَعَدّ بن عدنان، أبو قبائل العرب العدنانية؛ أي أفنى القبائل كلها."
sources:
- source: aghani-dk
  loc: ج11 ص50
