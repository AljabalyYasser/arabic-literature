  text: "جمع زَبابة، وهي «فأرة صماء يشبه بها الجاهل» [@khizana، ج5 ص113]. يقول: جمعوا المال والولد وهم جهّال لا يسمعون، كالفأر الأصم الذي لا يسمع الرعد."
