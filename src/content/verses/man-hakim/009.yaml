first: "وَالْعَيْشُ خَيْرٌ فِي ظِلَا"
second: "لِ النُّوكِ مِمَّنْ عَاشَ كَدَّا"
vocabulary:
- term: "فِي ظِلَالِ النُّوكِ"
  text: "مع الحمق."
- term: "كَدَّا"
  text: "في تعب وشدة. يريد: العيش الناعم مع الحمق خير من العيش الشاق مع العقل، كما فسره قُدامة [@naqd-al-shir، ص85]."
