explained: false
first: "مَهْلًا أَبَيْتَ اللَّعْنَ مَهْـ"
second: "ـلًا إِنَّ فِيمَا قُلْتَ آمَهْ"
vocabulary:
  - term: "أَبَيْتَ اللَّعْنَ"
    text: "تحية الملوك في الجاهلية: أبيت أن تأتي ما تُلعن عليه."
  - term: "آمَهْ"
    text: "«والآمةُ: الْعَيْبُ؛ قَالَ عَبِيد: مَهْلًا، أَبيتَ اللَّعْنَ مَهْلًا» [@lisan، ج12 ص38]."
