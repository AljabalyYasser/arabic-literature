explained: false
first: "تَطْرِيبُ عَانٍ أَوْ صِيَا"
second: "حُ مُحَرَّقٍ وَزُقَاءُ هَامَهْ"
vocabulary:
  - term: "تَطْرِيبُ عَانٍ"
    text: "ترجيع الأسير صوته بالأنين، والعاني: الأسير."
  - term: "صِيَاحُ مُحَرَّقٍ"
    text: "صياح من أُحرق بالنار."
  - term: "زُقَاءُ هَامَهْ"
    text: "صياحها، «زَقا الدِّيكُ والطائرُ ... والهامةُ ونحوُها ... صاحَ» [@lisan، ج14 ص357]. والهامة طائر كانوا يزعمون أنه يخرج من رأس القتيل فيصيح حتى يُثأر له."
