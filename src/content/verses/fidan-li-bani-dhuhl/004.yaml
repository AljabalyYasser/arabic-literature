first: أَتَتْهُمْ مِنَ البَطْحَاءِ يَبْرُقُ بَيْضُهَا
second: وَقَدْ رُفِعَتْ رَايَاتُهَا فَاسْتَقَلَّتِ
vocabulary:
- term: البَطْحَاءِ
  text: موضع، وهو عند المحقق من المواضع التي قرب الكوفة حيث جرت المعركة [@diwan-asha، ص295].
- term: بَيْضُهَا
  text: خُوَذ الحديد، جمع بَيْضة.
- term: فَاسْتَقَلَّتِ
  text: فارتفعت.
