explained: false
first: كَفَوْا إِذْ أَتَى الهَامَرْزُ تَخْفِقُ فَوْقَهُ
second: كَظِلِّ العُقَابِ إِذْ هَوَتْ فَتَدَلَّتِ
vocabulary:
- term: كَفَوْا
  text: كفوا قومهم ما أهمّهم.
- term: تَخْفِقُ فَوْقَهُ كَظِلِّ العُقَابِ
  text: 'تضطرب فوقه راية سوداء كظل العُقاب، وهي طائر من الجوارح. يقول المحقق: «كظل العقاب صفة لموصوف محذوف أى رايه كظل العقاب» [@diwan-asha، ص295].'
- term: فَتَدَلَّتِ
  text: فتعلّقت نازلة.
sources:
