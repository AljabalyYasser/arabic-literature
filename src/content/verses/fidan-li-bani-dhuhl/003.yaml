first: فَلِلَّهِ عَيْنَا مَنْ رَأَى مِنْ عِصَابَةٍ
second: أَشَدَّ عَلَى أَيْدِي السُّعَاةِ مِنَ الَّتِي
vocabulary:
- term: فَلِلَّهِ عَيْنَا مَنْ رَأَى
  text: 'تعجّب: ما أعجب ما رأت عينا من رأى!'
- term: عِصَابَةٍ
  text: جماعة، يعني بني ذهل.
- term: السُّعَاةِ
  text: 'يقول المحقق: «السعاة الذين يسعون للحرب ويهيجونها، وهم الفرس» [@diwan-asha، ص295].'
