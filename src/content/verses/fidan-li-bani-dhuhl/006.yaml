explained: false
first: وَقَدْ شَمَّرَتْ بِالنَّاسِ شَمْطَاءُ لَاقِحٌ
second: عَوَانٌ شَدِيدٌ هَمْزُهَا فَأَضَلَّتِ
vocabulary:
- term: شَمَّرَتْ
  text: جدّت واشتدت.
- term: شَمْطَاءُ
  text: التي خالط بياضُ شعرها سواده، يجعل الحرب عجوزًا.
- term: لَاقِحٌ
  text: '«وحَرْب لاقحٌ: مَثَّلَ بالأُنثى الْحَامِلِ» [@lisan، ج2 ص583]، وأنشد صاحب اللسان البيت.'
- term: عَوَانٌ
  text: حرب قوتل فيها مرة بعد مرة.
- term: هَمْزُهَا
  text: ضغطها وعصرها.
- term: فَأَضَلَّتِ
  text: 'فدفنت من دفنت: «وأَضْلَلْت المَيِّتَ دَفَنْته» [@lisan، ج11 ص391].'
