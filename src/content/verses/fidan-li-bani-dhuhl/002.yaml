first: هُمُو ضَرَبُوا بِالحِنْوِ حِنْوِ قُرَاقِرٍ
second: مُقَدِّمَةَ الهَامَرْزِ حَتَّى تَوَلَّتِ
vocabulary:
- term: بِالحِنْوِ
  text: 'الحِنْو: منعطف الوادي.'
- term: قُرَاقِرٍ
  text: '«وقُراقِرُ: خَلْفَ الْبَصْرَةِ وَدُونَ الْكُوفَةِ قَرِيبٌ مِنْ ذِي قَارٍ» [@lisan، ج5 ص90].'
- term: مُقَدِّمَةَ
  text: «مُقَدِّمة الْجَيْشِ، بِكَسْرِ الدَّالِ، أَوله الَّذِينَ يَتَقَدَّمُونَ الْجَيْشِ» [@lisan، ج12 ص468].
- term: الهَامَرْزِ
  text: '«والهامُرْزُ: رَجُلٌ مِنَ الْعَجَمِ، وَهُوَ قَائِدٌ مِنْ قُوَّاد كِسْرى» [@lisan، ج5 ص90].'
