explained: false
first: وَأَفْلَتَهُمْ قَيْسٌ فَقُلْتُ لَعَلَّهُ
second: يَبِلُّ لَئِنْ كَانَتْ بِهِ النَّعْلُ زَلَّتِ
vocabulary:
- term: وَأَفْلَتَهُمْ قَيْسٌ
  text: نجا منهم، وهو عند المحقق قيس بن مسعود [@diwan-asha، ص297].
- term: يَبِلُّ
  text: 'يبرأ ويسلم، يقال بَلَّ من مرضه وأَبَلَّ: «والبَلِيلة: الصِّحَّة مِنْ أَبَلَّ مِنْ مَرَضه أَي صَحَّ» [@lisan، ج11 ص630].'
- term: كَانَتْ بِهِ النَّعْلُ زَلَّتِ
  text: أخطأ وعثر.
