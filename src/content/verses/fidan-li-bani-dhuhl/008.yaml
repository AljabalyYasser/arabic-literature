explained: false
first: وَأَحْمَوْا حِمَى مَا يَمْنَعُونَ فَأَصْبَحَتْ
second: لَنَا ظُعُنٌ كَانَتْ وُقُوفًا فَحَلَّتِ
vocabulary:
- term: وَأَحْمَوْا حِمَى مَا يَمْنَعُونَ
  text: 'منعوا ما يمنعونه من حِمًى، والحِمى: الموضع الممنوع.'
- term: ظُعُنٌ
  text: النساء في الهوادج، جمع ظعينة.
- term: وُقُوفًا فَحَلَّتِ
  text: كانت واقفة على الإبل فنزلت. ويرى المحقق أنه يشير إلى حَنْظَلة بن ثَعْلَبة حين قطع وُضُن الهوادج، وهي أحزمتها، حتى لا تهرب النساء فينهزم الرجال [@diwan-asha، ص295].
