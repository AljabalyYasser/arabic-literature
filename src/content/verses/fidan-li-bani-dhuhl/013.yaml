first: عَلَى كُلِّ مَحْبُوكِ السَّرَاةِ كَأَنَّهُ
second: عُقَابٌ هَوَتْ مِنْ مَرْقَبٍ إِذْ تَعَلَّتِ
vocabulary:
- term: مَحْبُوكِ السَّرَاةِ
  text: 'فرس مُحكم الظهر، والسَّراة: الظهر. «إِنه لمَحْبُوك الْمَتْنِ والعَجُز إِذا كَانَ فِيهِ اسْتِوَاءٌ مَعَ ارْتِفَاعٍ» [@lisan، ج10 ص408]، وأنشد صاحب اللسان البيت.'
- term: مَرْقَبٍ
  text: موضع مرتفع يُرقب منه.
- term: تَعَلَّتِ
  text: ارتفعت.
