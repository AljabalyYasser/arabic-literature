explained: false
first: وَلَمْ يَبْقَ إِلَّا ذَاتُ رَيْعٍ مُفَاضَةٌ
second: وَأَسْهَلَ مِنْهُمْ عُصْبَةٌ فَأَطَلَّتِ
vocabulary:
- term: ذَاتُ رَيْعٍ
  text: 'درع طويلة الكمين: «ورَيْعُ الدِّرْع: فَضْلُ كُمَّيْها عَلَى أَطراف الأَنامل» [@lisan، ج8 ص138].'
- term: مُفَاضَةٌ
  text: 'واسعة سابغة: «دِرْعٌ مُفاضةٌ وَهِيَ السابِغةُ» [@lisan، ج6 ص336].'
- term: وَأَسْهَلَ
  text: نزل إلى السهل.
- term: فَأَطَلَّتِ
  text: يقول المحقق إنها «من قولهم أطل عليه بالأذى اذا لم يزل له مؤذيا» [@diwan-asha، ص297].
