explained: false
first: فِدًى لِبَنِي ذُهْلِ بْنِ شَيْبَانَ نَاقَتِي
second: وَرَاكِبُهَا يَوْمَ اللِّقَاءِ وَقَلَّتِ
vocabulary:
- term: وَرَاكِبُهَا
  text: يعني نفسه.
- term: وَقَلَّتِ
  text: 'قلّت الفدية لهم: «وَالضَّمِيرُ فِي قَلَّتِ يَعُودُ عَلَى الْفِدْيَةِ أَي قَلَّ لَهُمْ أَن أَفديهم بِنَفْسِي وَنَاقَتِي» [@lisan، ج5 ص90]. ويجعلها المحقق من «قلّ الشىء» بمعنى علا [@diwan-asha، ص295].'
