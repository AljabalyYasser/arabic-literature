first: لَعَمْرُكَ مَا شَفَّ الفَتَى مِثْلُ هَمِّهِ
second: إِذَا حَاجَةٌ بَيْنَ الحَيَازِيمِ جَلَّتِ
vocabulary:
- term: شَفَّ
  text: «وشَفَّهُ الهمُّ أَي هَزَلَه وأَضْمَرَه حَتَّى رَقَّ» [@lisan، ج9 ص179].
- term: الحَيَازِيمِ
  text: 'الصدور: «والحَزيمُ والحَيْزُومُ وسط الصدر» [@lisan، ج12 ص132].'
- term: جَلَّتِ
  text: عظُمت.
