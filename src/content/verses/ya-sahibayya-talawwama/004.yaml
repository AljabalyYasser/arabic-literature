explained: false
first: "لِلَّهِ دَرُّكُمَا وَدَرُّ أَبِيكُمَا"
second: "إِنْ أَفْلَتَ الْغُفَلِيُّ حَتَّى يُقْتَلَا"
vocabulary:
  - term: "لِلَّهِ دَرُّكُمَا"
    text: "«فُسِّر على أن المعنى: لله خيرُكما»، و«مراد المرقّش بهذا الكلام التحضيض والبعث والاستعطاف في الدعاء لهما» [@tabrizi-ikhtiyarat، ج2 ص989]: يستحثّ أخويه على الثأر."
  - term: "الْغُفَلِيُّ"
    text: "أجير المرقّش، رجل من غُفَيْلة «كان عسيفًا لمرقّش» [@aghani-dk، ج6 ص130]، أي أجيرًا، وهو الذي تركه في الكهف."
  - term: "حَتَّى يُقْتَلَا"
    text: "«إلى أن يُقتل» [@tabrizi-ikhtiyarat، ج2 ص989]."
