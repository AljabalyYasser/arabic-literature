explained: false
first: "ذَهَبَ السِّبَاعُ بِأَنْفِهِ فَتَرَكْنَهُ"
second: "أَعْثَى عَلَيْهِ بِالْجِبَالِ وَجَيْئَلَا"
vocabulary:
  - term: "أَعْثَى"
    text: "«هو من الضِّباع: الذَّكَر العظيم»، والأعثى أيضًا: الكثير الشعر [@tabrizi-ikhtiyarat، ج2 ص990]."
  - term: "وَجَيْئَلَا"
    text: "«الجَيْئَل: الضَّبُع»، «وانتصب \"جيئلا\" على أنه مفعول معه، يريد: اجتمع عليه أعثى مع جيئل فأكلاه» [@tabrizi-ikhtiyarat، ج2 ص990]."
