explained: false
first: "وَكَأَنَّمَا تَرِدُ السِّبَاعُ بِشِلْوِهِ"
second: "إِذْ غَابَ جَمْعُ بَنِي ضُبَيْعَةَ مَنْهَلَا"
vocabulary:
  - term: "شِلْوِهِ"
    text: "«بقايا لحمه وعظامه». والمعنى: «كأنما ترد السباع منهلًا، بورودها شِلْوَه» [@tabrizi-ikhtiyarat، ج2 ص990]، والمنهل: الماء الذي تَرِده."
  - term: "بَنِي ضُبَيْعَةَ"
    text: "قوم المرقّش، فهو «عمرو بن سعد بن مالك بن ضُبَيْعة» [@tabrizi-ikhtiyarat، ج2 ص986]."
