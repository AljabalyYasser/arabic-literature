explained: false
first: "فَلَعَلَّ بُطْأَكُمَا يُفَرِّطُ سَيِّئًا"
second: "أَوْ يَسْبِقُ الْإِسْرَاعُ سَيْبًا مُقْبِلَا"
vocabulary:
  - term: "يُفَرِّطُ"
    text: "«يقدّم. مأخوذ من الفارط، وهو المتقدّم قبل الماشية، يُصلح الدِّلاء والأرشية» [@tabrizi-ikhtiyarat، ج2 ص988]. ويقول الشارح في معنى البيت: «لعل انتظاركما يقدّم عنكما مكروهًا، ولعل سيبًا مقبلًا يكون بعد عجلتكما. فانتظاركما أوفق» [@tabrizi-ikhtiyarat، ج2 ص988]."
  - term: "سَيْبًا"
    text: "«والسَّيْب: العطاء» [@lisan، ج4 ص529]، أي: الخير."
