explained: false
first: "يَا رَاكِبًا إِمَّا عَرَضْتَ فَبَلِّغَنْ"
second: "أَنَسَ بْنَ سَعْدٍ إِنْ لَقِيتَ وَحَرْمَلَا"
vocabulary:
  - term: "عَرَضْتَ"
    text: "«عَرَضَ الرجلُ إذا أتى العَرُوض، وهي مكة والمدينة وما حولهما» [@lisan، ج7 ص173]."
  - term: "أَنَسَ بْنَ سَعْدٍ ... وَحَرْمَلَا"
    text: "أنس وحرملة: «أخوا مرقّش». وقوله «وحرملا»: «أراد: حرملة، فرخّم في غير النداء» [@tabrizi-ikhtiyarat، ج2 ص988]، أي حذف آخر الاسم، والترخيم يكون في النداء غالبًا."
