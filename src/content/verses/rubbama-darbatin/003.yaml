explained: false
first: "رَفَعُوا رَايَةَ الضِّرَابِ وَآلَوْا"
second: "لَيَذُودُنَّ سَامِرَ المَلْحَاءِ"
vocabulary:
  - term: "الضِّرابِ"
    text: "يقول محققا «الأصمعيات»: «المجالدة. وإنما رفعوا الراية وأعلوها تأكيداً للضرب وتشديداً» [@asmaiyyat، ص152، الحاشية]، أي القتال بالسيوف."
  - term: "آلَوْا"
    text: "«أقسموا» [@asmaiyyat، ص152، الحاشية]."
  - term: "لَيَذُودُنَّ"
    text: "«يذود: يطرد» [@asmaiyyat، ص152، الحاشية]، والنون للتوكيد في جواب القسم."
  - term: "سامِرَ"
    text: "يقول محققا «الأصمعيات»: «اسم جمع بمعنى السمار، وهم القوم يتحدثون ليلا» [@asmaiyyat، ص152، الحاشية]."
  - term: "المَلْحاءِ"
    text: "يقول المحققان إنها موضع في كتب البلدان والخزانة، «وفى اللسان أن الملحاء كتيبة كانت لآل المنذر، ونحن نرجح أنها هى المرادة فى البيت» [@asmaiyyat، ص152، الحاشية]. فيكون المعنى: ليطردنّ جند ملوك الحيرة."
