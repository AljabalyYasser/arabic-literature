first: "فَصَبَرْنَ النُّفُوسَ لِلطَّعْنِ حَتَّى"
second: "جَرَتِ الخَيْلُ بَيْنَنَا فِي الدِّمَاءِ"
vocabulary:
  - term: "فَصَبَرْنَ النُّفُوسَ"
    text: "حبسن النفوس على الطعن فلم تفرّ، وفي اللسان: «صَبَرَه عَنِ الشَّيْءِ يَصْبِرُه صَبْراً حَبَسَه» [@lisan، ج4 ص438]. وفي رواية البغدادي: «فصبرنا النُّفُوس» [@khizana، ج9 ص583]."
