explained: false
first: "رُبَّمَا ضَرْبَةٍ بِسَيْفٍ صَقِيلٍ"
second: "دُونَ بُصْرَى وَطَعْنَةٍ نَجْلَاءِ"
vocabulary:
  - term: "صَقِيلٍ"
    text: "يقول البغدادي: «صقيل بِمَعْنى مصقول أَي: مجلو» [@khizana، ج9 ص583]."
  - term: "بُصْرَى"
    text: "يقول محققا «الأصمعيات»: «من أعمال دمشق، وهى قصبة كورة حوران» [@asmaiyyat، ص152، الحاشية]، والقصبة: المدينة الكبرى في الناحية."
  - term: "نَجْلاءِ"
    text: "يقول البغدادي: «والنجلاء: الواسعة الْبَيِّنَة الاتساع من قَوْلهم: عين نجلاء أَي: وَاسِعَة» [@khizana، ج9 ص583]."
