explained: false
first: "وَغَمُوسٍ تَضِلُّ فِيهَا يَدُ الآ"
second: "سِي وَيَعْيَا طَبِيبُهَا بِالدَّوَاءِ"
vocabulary:
  - term: "غَمُوسٍ"
    text: "طعنة. يقول محققا «الأصمعيات»: «الغموس: الطعنة النجلاء الواسعة» [@asmaiyyat، ص152، الحاشية]، ويقول البغدادي: «يُقَال: طعنة غموس: نَافِذَة» [@khizana، ج9 ص584]."
  - term: "الآسِي"
    text: "يقول محققا «الأصمعيات»: «الذى يأسو الجروح ويداويها» [@asmaiyyat، ص152، الحاشية]. وكُتبت الكلمة بين الشطرين لأن الشطر الأول ينتهي في وسطها."
  - term: "يَعْيا"
    text: "يقول محققا «الأصمعيات»: «يعيا بالدواء: يعجز عنه» [@asmaiyyat، ص152، الحاشية]."
