explained: false
first: "لَيْسَ مَنْ مَاتَ فَاسْتَرَاحَ بِمَيْتٍ"
second: "إِنَّمَا المَيْتُ مَيِّتُ الأَحْيَاءِ"
vocabulary:
  - term: "بِمَيْتٍ"
    text: "يقول البغدادي: «الْمَيِّت بِسُكُون الْيَاء: مخفف ميت بتشديدها. وَفرق بَعضهم بِأَن الأول من وَقع عَلَيْهِ الْمَوْت وَالثَّانِي هُوَ الْحَيّ الَّذِي سيموت» [@khizana، ج9 ص584]. فعلى هذا الفرق يكون «مَيِّتُ الأحياء» حيًّا يمشي، وهو في حكم الميت."
