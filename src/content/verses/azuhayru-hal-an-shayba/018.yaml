explained: false
first: "وَمُبَرَّأً مِنْ كُلِّ غُبَّرِ حَيْضَةٍ"
second: "وَفَسَادِ مُرْضِعَةٍ وَدَاءٍ مُغْيِلِ"
vocabulary:
  - term: "غُبَّرِ حَيْضَةٍ"
    text: "الغُبَّر البقية، والحيضة المرة من الحيض [@sukkari-hudhaliyyin، ص1073]. أي لم تحمل به أمه وفي رحمها بقية من دم حيضها."
  - term: "مُغْيِلِ"
    text: "يقول الشارح: لم تحمل عليه أمه فتسقيه الغَيْل، وليس به داء شديد قد أعضل [@sukkari-hudhaliyyin، ص1073]. والغيل في «لسان العرب»: «أن يجامع الرجل المرأة وهي مرضع» [@lisan، ج11 ص511]. فالرضيع يشرب لبن أمٍّ يجامعها زوجها أو حبلت وهي ترضعه، وكانوا يرونه يضعف الولد."
