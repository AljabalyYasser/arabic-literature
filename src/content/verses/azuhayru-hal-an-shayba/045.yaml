first: "وَجَلِيلَةِ الْأَنْسَابِ لَيْسَ كَمِثْلِهَا"
second: "مِمَّنْ تَمَتَّعُ قَدْ أَتَتْهَا أَرْسُلِي"
meaning: "ورُبّ امرأة شريفة النسب، ليس مثلها في النساء المنعّمات، قد أرسلت إليها رسلي. أي بعث إليها من يحمل رسائله ويطلب لقاءها سرًّا، وهي امرأة محروسة لها من يحفظها، كما يقول في البيت التالي. يقول الشرح المطبوع مع القصيدة: «و«التمتيع»، حسن الغذاء والتنعيم، يريد امرأة سرية الأنساب ليس مثلها» [@sukkari-hudhaliyyin، ص1079]. والبيت أول خبر زيارة ليلية لامرأة يصل إليها خفية، وهو من الغزل الحسي الصريح في القصيدة، يفخر فيه بأنه نال امرأة لا تُنال."
vocabulary:
  - term: "جَلِيلَةِ الْأَنْسَابِ"
    text: "شريفة النسب، وفي الشرح: «سرية الأنساب» [@sukkari-hudhaliyyin، ص1079]."
  - term: "تَمَتَّعُ"
    text: "تُنعَّم، و«التمتيع»: «حسن الغذاء والتنعيم» [@sukkari-hudhaliyyin، ص1079]."
  - term: "أَرْسُلِي"
    text: "جمع رسول، أي من بعثهم إليها بالرسائل."
context: "بعد صفة سهامه (42–44) ينتقل في الأبيات 45–47 إلى زيارة ليلية لامرأة شريفة محروسة، ثم يختم القصيدة بالبيت 48. ولا يذكر الشرح من هي، ولا يذكر خبرًا للزيارة. والأبيات غزل حسي صريح، فنشرحها شرحًا تامًّا."
syntax:
  - "«وَجَلِيلَةِ الْأَنْسَابِ»: الواو واو رُبّ، و«جليلةِ» اسم مجرور لفظًا بـ«رب» المحذوفة، و«الأنساب» مضاف إليه."
  - "«لَيْسَ كَمِثْلِهَا مِمَّنْ تَمَتَّعُ»: «ليس» فعل ماض ناقص، واسمه محذوف يدل عليه «ممن تمتع»، أي ليس أحدٌ ممن تتمتع مثلَها، والكاف زائدة للتوكيد، و«مثلها» في موضع خبر ليس. والجملة في محل جر صفة لجليلة."
  - "«مِمَّنْ تَمَتَّعُ»: «من» حرف جر، و«مَن» اسم موصول، و«تمتّعُ» فعل مضارع أصله «تتمتّع» حُذفت إحدى التاءين، وفاعله ضمير، والجملة صلة."
  - "«قَدْ أَتَتْهَا أَرْسُلِي»: «قد» حرف تحقيق، و«أتتها» فعل ومفعول، و«أرسلي» فاعل مرفوع بضمة مقدرة لاشتغال المحل بكسرة الياء، والياء مضاف إليه. والجملة هي الخبر الذي تفتتحه «رب»."
morphology:
  - "«أَرْسُل» جمع «رسول» على «أَفْعُل»."
  - "«تَمَتَّعُ» من «تمتّع» على «تفعّل»، وأصل المضارع «تَتَمَتَّعُ»، فحُذفت إحدى التاءين تخفيفًا."
  - "«جَلِيلَة» صفة مشبهة على «فعيلة» من «جلّ»."
rhetoric:
  thesis: "يفتتح خبر مغامرة ليلية بامرأة شريفة منعّمة، فيجعل شرفها وتمنّعها جزءًا من فخره."
  devices:
    - title: "«رُبّ» المحذوفة في «وَجَلِيلَةِ»"
      text: "الواو التي تنوب عن «رب» تجعل المرأة واحدة من مغامراته، كما جعل الغارات والمراقب قبلها. وهذه قراءتنا."
    - title: "الكناية في «قَدْ أَتَتْهَا أَرْسُلِي»"
      text: "لم يقل إنه راودها، بل ذكر رسله التي أتتها، وهي تلزم المراودة وطلب اللقاء. والكناية عند عبد القاهر: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
  connection: "ثم يصف كيف وصل إليها: «سَاهَرْتُ عَنْهَا الْكَالِئَيْنِ كِلَاهُمَا»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، والقافية مطلقة بالياء"
  scansion: "وَجَلِيلَتِلْ / أَنْسَابِ لَيْ / سَ كَمِثْلِهَا = مُتَفاعلن / مُتْفاعلن / مُتَفاعلن — مِمْمَنْ تَمَتْ / تَعُ قَدْ أَتَتْ / هَا أَرْسُلِي = مُتْفاعلن / مُتَفاعلن / مُتْفاعلن"
  note: "وزن الكامل التام «متفاعلن متفاعلن متفاعلن» [@atiq، ص59]. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، الثانية من الصدر، والأولى والثالثة من العجز."
