first: "وَمَعَابِلًا صُلْعَ الظُّبَاتِ كَأَنَّهَا"
second: "جَمْرٌ بِمَسْهَكَةٍ تُشَبُّ لِمُصْطَلِي"
vocabulary:
  - term: "مَعَابِلًا"
    text: "سهام عراض النصال [@sukkari-hudhaliyyin، ص1078–1079]."
  - term: "صُلْعَ الظُّبَاتِ"
    text: "تبرق، ليس عليها صدأ [@sukkari-hudhaliyyin، ص1078–1079]."
  - term: "مَسْهَكَةٍ"
    text: "موضع شديد الريح [@sukkari-hudhaliyyin، ص1078–1079]."
  - term: "تُشَبُّ"
    text: "تُوقد [@sukkari-hudhaliyyin، ص1078–1079]."
