first: "وَضَعَ النَّعَامَاتِ الرِّجَالُ بِرَيْدِهَا"
second: "مِنْ بَيْنِ شَعْشَاعٍ وَبَيْنِ مُظَلَّلِ"
vocabulary:
  - term: "النَّعَامَاتِ"
    text: "النعامة خشبتان تُنصبان ويُلقى عليهما ثُمام يستظل بها الربيئة [@sukkari-hudhaliyyin، ص1077]."
  - term: "رَيْدِهَا"
    text: "الرَّيد حرف ناتئ من الجبل [@sukkari-hudhaliyyin، ص1232]."
