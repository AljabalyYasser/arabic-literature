first: "فَدَخَلْتُ بَيْتًا غَيْرَ بَيْتِ سَنَاخَةٍ"
second: "وَازْدَرْتُ مُزْدَارَ الْكَرِيمِ الْمُعْوِلِ"
meaning: "فدخلت عليها بيتًا طيب الريح، لا رائحة كريهة فيه، وزرتها زيارة الرجل الكريم الواثق من ترحيبها به. يقول الشرح المطبوع مع القصيدة: «يقول: دخلت بيتا ليس بيت دباغ ولا سمان، ولا بيت صاحب ودك، ولا بيت قذر، أي بيتا طيب الريح»، و«المعول» عنده «المدل عليه» [@sukkari-hudhaliyyin، ص1080]، أي الذي يدخل دخول من يعرف أنه مرغوب فيه. والبيت خاتمة خبر الزيارة: بعد أن نام الحارسان دخل خدرها، ولم يدخل متسللًا خائفًا بل مدلًّا، وهي ترضاه. ولا يصف ما جرى بينهما، ويكتفي بأنه دخل وزار، والمقصود اللقاء الذي سعى إليه برسله وسهره."
vocabulary:
  - term: "سَنَاخَةٍ"
    text: "الريح المنتنة، وفي «لسان العرب»: «بَيْتٌ لَهُ سَنْخَةٌ وسنَاخة» [@lisan، ج3 ص27]. والشرح يفسّر «بيت سناخة» ببيت الدبّاغ والسمّان وصاحب الودك [@sukkari-hudhaliyyin، ص1080]."
  - term: "ازْدَرْتُ مُزْدَارَ"
    text: "زرت زيارة، من «زار»."
  - term: "الْمُعْوِلِ"
    text: "«المدل عليه»، ويقال: «عوّلت عليه»، أي أدللت عليه [@sukkari-hudhaliyyin، ص1080]."
context: "آخر أبيات الزيارة (45–47)، وبعده البيت 48 الذي يختم القصيدة: «وَإِذَا مَضَى شَيْءٌ كَأَنْ لَمْ يُفْعَلِ». والأبيات غزل حسي صريح، فنشرحها شرحًا تامًّا."
syntax:
  - "«فَدَخَلْتُ بَيْتًا»: الفاء عاطفة، و«دخلت» فعل وفاعل، و«بيتًا» منصوب على التوسع بإسقاط حرف الجر، أي دخلت في بيت."
  - "«غَيْرَ بَيْتِ سَنَاخَةٍ»: «غيرَ» صفة لبيتًا منصوبة، و«بيت» مضاف إليه، و«سناخة» مضاف إليه."
  - "«وَازْدَرْتُ مُزْدَارَ الْكَرِيمِ الْمُعْوِلِ»: الواو عاطفة، و«ازدرت» فعل وفاعل، و«مزدارَ» مفعول مطلق مبيّن للنوع، و«الكريم» مضاف إليه، و«المعول» صفة للكريم."
morphology:
  - "«ازْدَرْتُ» على «افتعلت» من «زار»، قُلبت تاء الافتعال دالًا بعد الزاي، فصار «ازدار»، وحُذفت الألف حين سكن آخر الفعل لاتصاله بتاء الفاعل."
  - "«مُزْدَار» مصدر ميمي من «ازدار» على وزن اسم المفعول."
  - "«سَنَاخَة» مصدر على «فَعالة» من «سَنِخ»."
rhetoric:
  thesis: "يختم خبر الزيارة بدخوله بيت المرأة الطيب دخول الواثق المرغوب فيه."
  devices:
    - title: "النفي في «غَيْرَ بَيْتِ سَنَاخَةٍ»"
      text: "أثبت طيب البيت بنفي النتن عنه، فجعل القارئ يتصور الضد. ويفسّره الشرح بالإثبات: «أي بيتا طيب الريح» [@sukkari-hudhaliyyin، ص1080]."
    - title: "المفعول المطلق في «وَازْدَرْتُ مُزْدَارَ الْكَرِيمِ»"
      text: "أعاد مادة الفعل في المصدر، ثم أضافه إلى «الكريم المعول»، فصار نوع الزيارة هو المقصود: زيارة كريم مدلّ لا لصّ متسلل. وهذه قراءتنا."
  connection: "ثم يختم القصيدة كلها: «فَإِذَا وَذَلِكَ لَيْسَ إِلَّا حِينَهُ / وَإِذَا مَضَى شَيْءٌ كَأَنْ لَمْ يُفْعَلِ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، والقافية مطلقة بالياء"
  scansion: "فَدَخَلْتُ بَيْ / تَنْ غَيْرَ بَيْ / تِ سَنَاخَتِنْ = مُتَفاعلن / مُتْفاعلن / مُتَفاعلن — وَزْدَرْتُ مُزْ / دَارَلْكَرِيـ / ـمِلْمُعْوِلِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "وزن الكامل التام «متفاعلن متفاعلن متفاعلن» [@atiq، ص59]. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، الثانية من الصدر، وتفعيلات العجز كلها."
