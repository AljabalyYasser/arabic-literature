first: "سَاهَرْتُ عَنْهَا الْكَالِئَيْنِ كِلَاهُمَا"
second: "حَتَّى الْتَفَتُّ إِلَى السِّمَاكِ الْأَعْزَلِ"
meaning: "سهرتُ أرقب حارسيها الاثنين، أنتظر أن يناما، حتى طال الليل والتفتّ إلى نجم السماك الأعزل، فلما ناما سرت إليها. يقول الشرح المطبوع مع القصيدة: «أي ترقبتهما حتى نوّما، ثم سرت إليها» [@sukkari-hudhaliyyin، ص1079]، ويقول صاحب «لسان العرب»: «أَراد سَهِرْتُ مَعَهُمَا حَتَّى نَامَا» [@lisan، ج4 ص383]. فهو يتسلل إلى امرأة محروسة، ينتظر غفلة من يحرسها ليدخل عليها."
vocabulary:
  - term: "الْكَالِئَيْنِ"
    text: "مثنى كالئ، وهو الحارس الذي يكلأ، أي يحفظ، والمراد من يحرس المرأة. والشرح يفسر «ساهرت عنها الكالئين» بقوله: «ترقبتهما حتى نوّما» [@sukkari-hudhaliyyin، ص1079]."
  - term: "السِّمَاكِ الْأَعْزَلِ"
    text: "نجم، والتفاته إليه كناية عن طول سهره ومضيّ الليل."
context: "البيت الثاني من أبيات الزيارة (45–47). قبله «وَجَلِيلَةِ الْأَنْسَابِ ... قَدْ أَتَتْهَا أَرْسُلِي»، وبعده دخوله بيتها. والأبيات غزل حسي صريح، فنشرحها شرحًا تامًّا."
syntax:
  - "«سَاهَرْتُ عَنْهَا الْكَالِئَيْنِ»: «ساهرت» فعل وفاعل، و«عنها» جار ومجرور متعلق به، أي من أجلها، و«الكالئين» مفعول به منصوب بالياء لأنه مثنى."
  - "«كِلَاهُمَا»: توكيد للكالئين، وجاء بالألف وهو توكيد لمنصوب، وحقه في اللغة المشهورة «كليهما»، والقافية لا تضطره إليه، فلعله على لغة من يلزم «كلا» الألف في كل حال."
  - "«حَتَّى الْتَفَتُّ إِلَى السِّمَاكِ الْأَعْزَلِ»: «حتى» حرف غاية، و«التفتّ» فعل وفاعل، و«إلى السماك» متعلق به، و«الأعزل» صفة للسماك."
morphology:
  - "«سَاهَرْتُ» على «فاعلتُ» من السهر، وفيه معنى المشاركة: سهر معهما، كما يفسره صاحب اللسان [@lisan، ج4 ص383]."
  - "«الكالِئ» اسم فاعل من «كلأ» على «فاعل»."
  - "«الْتَفَتُّ» على «افتعلتُ» من «لفت»، أُدغمت تاء الفعل في تاء الفاعل."
rhetoric:
  thesis: "يصف صبره في مراقبة حارسيها حتى غلبهما النوم وبقي هو ساهرًا."
  devices:
    - title: "المفاعلة في «سَاهَرْتُ»"
      text: "لم يقل «سهرت»، بل «ساهرت»، فجعل السهر سباقًا بينه وبين الحارسين: من يغلبه النوم أولًا. وهذا معنى قول صاحب اللسان «سهرت معهما حتى ناما» [@lisan، ج4 ص383]."
    - title: "الكناية في «حَتَّى الْتَفَتُّ إِلَى السِّمَاكِ»"
      text: "لم يذكر طول الانتظار، بل ذكر ما يلزمه: نجمًا يطلع والليل يمضي. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يدخل عليها: «فَدَخَلْتُ بَيْتًا غَيْرَ بَيْتِ سَنَاخَةٍ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، والقافية مطلقة بالياء"
  scansion: "سَاهَرْتُ عَنْ / هَلْكَالِئَيْ / نِ كِلَاهُمَا = مُتْفاعلن / مُتْفاعلن / مُتَفاعلن — حَتْتَلْتَفَتْ / تُ إِلَسْسِمَا / كِلْأَعْزَلِي = مُتْفاعلن / مُتَفاعلن / مُتْفاعلن"
  note: "وزن الكامل التام «متفاعلن متفاعلن متفاعلن» [@atiq، ص59]. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، الأولى والثانية من الصدر، والأولى والثالثة من العجز. وهمزة الوصل في «الْتَفَتُّ» و«الْأَعْزَلِ» تسقط في النطق."
variants:
  - reading: "فَسَهِرْتُ عَنْهَا الْكَالِئَيْنِ فَلَمْ أَنَمْ / حَتَّى الْتَفَتُّ إِلَى السِّمَاكِ الْأَعْزَلِ"
    status: "رواية «لسان العرب»"
    note: "[@lisan، ج4 ص383]. ويذكرها المحقق في حاشية الشرح [@sukkari-hudhaliyyin، ص1079، الحاشية]."
