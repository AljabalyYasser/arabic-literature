first: "مُتَكَوِّرِينَ عَلَى الْمَعَارِي بَيْنَهُمْ"
second: "ضَرْبٌ كَتَعْطَاطِ الْمَزَادِ الْأَنْجَلِ"
vocabulary:
  - term: "الْمَعَارِي"
    text: "يقول الشارح: السوءات [@sukkari-hudhaliyyin، ص1076]. أي العورات: سقط القتلى منكبّين على عوراتهم. وفي «لسان العرب» أن معاري المرأة ما لا بد لها من إظهاره: الوجه واليدان والرجلان [@lisan، ج15 ص47]."
  - term: "الْأَنْجَلِ"
    text: "الواسع [@sukkari-hudhaliyyin، ص1076]."
