first: "حَمَلَتْ بِهِ فِي لَيْلَةٍ مَزْؤُودَةٍ"
second: "كَرْهًا وَعَقْدُ نِطَاقِهَا لَمْ يُحْلَلِ"
meaning: "حبلت به أمه في ليلة فزع، وهي مُكرهة، وعقدة نطاقها لم تُحلّ. أي إن الرجل جامعها غصبًا وعلى عجل، وهي خائفة، ولم يترك لها أن تحلّ إزارها، فحملت بالفتى من ذلك الجماع. يقول الشرح المطبوع مع القصيدة: «يقول: أُكرهت فلم تحلّ نطاقها»، ويروي عن الأصمعي عن عيسى بن عمر أنه أنشد البيت جبر بن حبيب، «فقال: قاتله الله، يغشمها قبل أن تحلّ نطاقها!» [@sukkari-hudhaliyyin، ص1073]. ويغشمها: يأخذها ظلمًا وقهرًا، كما يفسّر الشرح «المغشم» في البيت 14 بأنه «الذي يغشم الناس ويظلمهم» [@sukkari-hudhaliyyin، ص1072]. و«قاتله الله» هنا كلمة تعجّب من جرأة الوصف، لا دعاء. والبيت يقول صراحةً ما كنى عنه البيت السابق: الحمل كان ثمرة إكراه."
vocabulary:
  - term: "مَزْؤُودَةٍ"
    text: "فزعة، والزؤد الفزع. وفي الشرح المطبوع مع القصيدة أن أبا عبيدة كان ينصبها، والأصمعي يجرّها، «يجعل الزؤد لليلة» [@sukkari-hudhaliyyin، ص1073]."
  - term: "كَرْهًا"
    text: "مُكرهةً على غير رضا منها. يقول الشرح: «أُكرهت فلم تحلّ نطاقها» [@sukkari-hudhaliyyin، ص1073]."
  - term: "نِطَاقِهَا"
    text: "«إزار تحتبك به المرأة في وسطها وترسل أعلاه على أسفله تقيمه مقام السراويل» [@khizana، ج8 ص193]."
context: "يكمل البيت 15: هناك «مِمَّا حَمَلْنَ بِهِ وَهُنَّ عَوَاقِدٌ / حُبُكَ الثِّيَابِ»، بالجمع والكناية، وهنا يعود إلى أم الفتى وحدها ويصرّح: «كَرْهًا». ويرويه أبو تمام في أبيات الفتى بعد البيت 18 [@tabrizi-hamasa، ج1 ص20]. ويقول الأعلم، فيما ينقله البغدادي، إن العرب كانت تفعل ذلك: «ويعجلها حل نطاقها ويقع عليها فيغلب ماؤه على مائها فينزع الوليد إليه في الشبه» [@khizana، ج8 ص193]. والبيت صريح في الجماع بالإكراه، فنشرحه شرحًا تامًّا."
syntax:
  - "«حَمَلَتْ بِهِ»: «حملت» فعل ماض، والتاء للتأنيث، وفاعله ضمير الأم، و«به» متعلق بحملت، وعُدّي بالباء لأنه بمعنى «حبلت» كما يقول ابن الشجري [@khizana، ج8 ص198]."
  - "«فِي لَيْلَةٍ مَزْؤُودَةٍ»: جار ومجرور متعلق بحملت، و«مزؤودةٍ» صفة لليلة مجرورة على رواية الأصمعي. وعلى رواية أبي عبيدة «مزؤودةً» حال منصوبة من فاعل «حملت»، أي حملت به وهي فزعة [@sukkari-hudhaliyyin، ص1073]."
  - "«كَرْهًا»: مصدر في موضع الحال، أي مُكرهة."
  - "«وَعَقْدُ نِطَاقِهَا لَمْ يُحْلَلِ»: الواو حالية، و«عقدُ» مبتدأ، و«نطاقها» مضاف إليه، وجملة «لم يُحلَل» في محل رفع خبر، والجملة الاسمية في محل نصب حال."
morphology:
  - "«مَزْؤُودَة» اسم مفعول على «مفعولة» من «زَأَد»، أي أُفزعت."
  - "«كَرْه» مصدر «كَرِه» على «فَعْل»."
  - "«يُحْلَل» مضارع مبني للمجهول من «حَلّ»، فُكّ إدغامه لأنه مجزوم بـ«لم»، وكُسرت لامه الأخيرة للقافية."
rhetoric:
  thesis: "يصرّح بما كنى عنه في البيت السابق: الحمل بالفتى كان إكراهًا في ليلة فزع."
  devices:
    - title: "المجاز في «لَيْلَةٍ مَزْؤُودَةٍ»"
      text: "على رواية الجر جعل الفزع لليلة، والفزع للأم، كما يقول الشرح عن الأصمعي: «يجعل الزؤد لليلة» [@sukkari-hudhaliyyin، ص1073]. فصارت الليلة كلها خائفة. وعلى رواية النصب يعود الفزع إلى الأم صريحًا."
    - title: "الإيجاز في «كَرْهًا»"
      text: "كلمة واحدة في أول العجز تحمل الإكراه كله، ثم يأتي «وَعَقْدُ نِطَاقِهَا لَمْ يُحْلَلِ» شاهدًا عليه. وهذه قراءتنا."
    - title: "التكرار في «حَمَلَتْ بِهِ»"
      text: "يعيد لفظ البيت السابق «حَمَلْنَ بِهِ» بالمفرد، فينتقل من النساء عامة إلى أم هذا الفتى."
  connection: "ثم يصف ما جاء به هذا الحمل: «فَأَتَتْ بِهِ حُوشَ الْجَنَانِ مُبَطَّنًا»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، والقافية مطلقة بالياء"
  scansion: "حَمَلَتْ بِهِي / فِي لَيْلَتِنْ / مَزْؤُودَتِنْ = مُتَفاعلن / مُتْفاعلن / مُتْفاعلن — كَرْهَنْ وَعَقْ / دُ نِطَاقِهَا / لَمْ يُحْلَلِي = مُتْفاعلن / مُتَفاعلن / مُتْفاعلن"
  note: "وزن الكامل التام «متفاعلن متفاعلن متفاعلن» [@atiq، ص59]. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، الثانية والثالثة من الصدر، والأولى والثالثة من العجز، فصارت «مُتْفاعلن»."
