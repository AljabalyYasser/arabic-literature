first: "مِمَّا حَمَلْنَ بِهِ وَهُنَّ عَوَاقِدٌ"
second: "حُبُكَ الثِّيَابِ فَشَبَّ غَيْرَ مُثَقَّلِ"
meaning: "هذا الفتى من الذين حملت بهم أمهاتهم وهنّ ما زلن مشدودات الثياب، لم يحللن ما يشددن به ثيابهن على أوساطهن. أي إن الرجل واقع المرأة كرهًا وعلى عجل، وهي فزعة لم تتهيأ للجماع ولم تخلع ثيابها، فحبلت بالفتى في تلك الحال، فنشأ خفيفًا حادًّا لا ثقل فيه. يقول الشرح المطبوع مع القصيدة: «يقول: حملت به أمه وهي فزعة»، وكانوا يقولون إن المرأة إذا حملت وهي فزعة فولدت غلامًا «جاءت به لا يطاق» [@sukkari-hudhaliyyin، ص1072]. ويقول الأعلم الشنتمري، فيما ينقله البغدادي: «وصف رجلا شهم الفؤاد ماضيا في الرجال فذكر أنه ممن حملت به النساء مكرهاتٍ فغلب عليه شبه الآباء وخرج مذكراً»، ويفسّر عادتهم: «ويعجلها حل نطاقها ويقع عليها فيغلب ماؤه على مائها فينزع الوليد إليه في الشبه» [@khizana، ج8 ص193]. فهو يمدح الفتى بأصل حمله: كان الحمل به ثمرة إكراه وفزع، وكانوا يرون ذلك يُخرج الولد شديدًا يشبه أباه."
vocabulary:
  - term: "عَوَاقِدٌ"
    text: "جمع عاقدة، أي معقودات الثياب، وفي «خزانة الأدب»: «وَهُوَ جمع عاقدة» [@khizana، ج8 ص192]."
  - term: "حُبُكَ الثِّيَابِ"
    text: "في الشرح المطبوع مع القصيدة: «الحبك»، كل ما حُزم به شيء فهو «حِباك» [@sukkari-hudhaliyyin، ص1072]. وعند الأعلم: «وحبك النطاق: مشده واحدها حباك وهو من حبكت الشيء إذا شددته وأحكمته» [@khizana، ج8 ص193]، أي ما تُشدّ به الثياب على الوسط."
  - term: "النِّطَاقِ (في الرواية الأخرى)"
    text: "«إزار تحتبك به المرأة في وسطها وترسل أعلاه على أسفله تقيمه مقام السراويل» [@khizana، ج8 ص193]."
  - term: "مُثَقَّلِ"
    text: "الثقيل البطيء، يقول: نشأ خفيفًا لا ثقل فيه."
context: "البيت من أبيات الفتى (14–25) التي اختار أبو تمام منها أبياتًا في أوائل «الحماسة» [@tabrizi-hamasa، ج1 ص19–20]. قبله: «وَلَقَدْ سَرَيْتُ عَلَى الظَّلَامِ بِمِغْشَمٍ / جَلْدٍ مِنَ الْفِتْيَانِ غَيْرِ مُهَبَّلِ»، فهذا البيت صفة لذلك الفتى. ويروي التِّبْرِيزِيّ، فيما ينقله البغدادي، أن الفتى هو تأبط شرًّا ربيب أبي كبير [@khizana، ج8 ص194]، والخبر في حكاية [أبو كبير وربيبه](/stories/abu-kabir-wa-rabibuh/). وهو من شواهد سيبويه في إعمال جمع اسم الفاعل [@khizana، ج8 ص192–193]. والبيت صريح في الجماع، فنشرحه شرحًا تامًّا."
syntax:
  - "«مِمَّا حَمَلْنَ بِهِ»: «من» حرف جر، و«ما» اسم موصول بمعنى «مَن» في محل جر، والجار والمجرور متعلق بمحذوف صفة لـ«مِغْشَم» في البيت السابق. و«حملن» فعل ماض، ونون النسوة فاعل، والجملة صلة الموصول. و«به» متعلق بحملن. يقول ابن الشجري، فيما ينقله البغدادي: «عدى حمل في البيت بالباء وحقه أن يصل إلى المفعول بنفسه كما جاء في التنزيل: حملته أمه كرها. ولكنه عدى بالباء لأنه في معنى حبلت» [@khizana، ج8 ص198]."
  - "«وَهُنَّ عَوَاقِدٌ»: الواو حالية، و«هن» مبتدأ، و«عواقد» خبر، والجملة في محل نصب حال من نون النسوة."
  - "«حُبُكَ الثِّيَابِ»: مفعول به لـ«عواقد»، وهذا موضع الشاهد. يقول الأعلم: «الشاهد في نصب حبك النطاق بعواقد لأنه جمع عاقدة وعاقدة تعمل عمل الفعل المضارع لأنها في معناه فجرى جمعها في العمل مجراها. ونون عواقد للضرورة» [@khizana، ج8 ص193]."
  - "«فَشَبَّ غَيْرَ مُثَقَّلِ»: الفاء عاطفة، و«شبّ» فعل ماض فاعله ضمير الفتى، و«غيرَ» حال منصوبة، و«مثقّل» مضاف إليه."
morphology:
  - "«عَوَاقِد» جمع «عاقدة» على «فواعل»، وهي صيغة منتهى الجموع الممنوعة من الصرف، ونُوّنت للضرورة كما يقول الأعلم [@khizana، ج8 ص193]."
  - "«حُبُك» جمع «حِباك» على «فُعُل»."
  - "«مُثَقَّل» اسم مفعول من «ثقّل» على «مُفَعَّل»."
  - "«حَمَلْنَ» فعل ماض ثلاثي مجرد أسند إلى نون النسوة فسكن آخره."
rhetoric:
  thesis: "يردّ شدة الفتى إلى ساعة الحمل به: أمه أُكرهت وهي مشدودة الثياب، فخرج حادًّا خفيفًا."
  devices:
    - title: "الكناية في «وَهُنَّ عَوَاقِدٌ حُبُكَ الثِّيَابِ»"
      text: "لم يقل إنهن أُكرهن على الجماع، بل ذكر ما يلزم الإكراه والعجلة: ثيابهن ما زالت معقودة. وهي الكناية عند عبد القاهر الجُرْجانيّ: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "السببية في «فَشَبَّ»"
      text: "الفاء تجعل نشأة الفتى خفيفًا نتيجة لتلك الحال، فالبيت كله مقدمة ونتيجة: كيف حُمل به، فكيف شبّ. وهذه قراءتنا."
  connection: "ثم يصرّح في البيت التالي بما كنى عنه: «حَمَلَتْ بِهِ فِي لَيْلَةٍ مَزْؤُودَةٍ / كَرْهًا»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، والقافية مطلقة بالياء"
  scansion: "مِمْمَا حَمَلْ / نَ بِهِي وَهُنْ / نَ عَوَاقِدُنْ = مُتْفاعلن / مُتَفاعلن / مُتَفاعلن — حُبُكَثْثِيَا / بِ فَشَبْبَ غَيْ / رَ مُثَقْقَلِي = مُتَفاعلن / مُتَفاعلن / مُتَفاعلن"
  note: "وزن الكامل التام «متفاعلن متفاعلن متفاعلن» في كل شطر [@atiq، ص59]، والعَرُوض صحيحة والضرب صحيح «متفاعلن» [@atiq، ص60]. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر فصارت «مُتْفاعلن»."
