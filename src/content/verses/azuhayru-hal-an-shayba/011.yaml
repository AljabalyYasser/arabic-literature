explained: false
first: "سُجَرَاءَ نَفْسِي غَيْرَ جَمْعِ أُشَابَةٍ"
second: "حُشُدًا وَلَا هُلْكِ الْمَفَارِشِ عُزَّلِ"
vocabulary:
  - term: "سُجَرَاءَ"
    text: "جمع سَجير، وسجير الرجل صفيّه وخاصّته [@sukkari-hudhaliyyin، ص1071]."
  - term: "هُلْكِ الْمَفَارِشِ"
    text: "الهُلْك جمع هَلُوك، وهي عند الشارح المرأة التي تتساقط على زوجها وتتغنّج في الفراش، والمفارش الفُرُش. يقول: ليست أمهاتهم أمهات سوء [@sukkari-hudhaliyyin، ص1071]. فهو يمدح أصحابه بأن أمهاتهم لم يكنّ متهالكات على الرجال في الفراش، أي إنهم أبناء نساء عفيفات."
sources:
