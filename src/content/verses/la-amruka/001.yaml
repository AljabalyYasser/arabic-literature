first: لَعَمْرُكَ مَا قَلْبِي إِلَى أَهْلِهِ بِحُرّ
second: وَلَا مُقْصِرٍ يَوْمًا فَيَأْتِيَنِي بِقُرّ
vocabulary:
- term: بِحُرّ
  text: 'بكريم؛ قال الأزهري: «بِحُرٍّ: بكريم لأنه لا يصبر ولا يكفّ عن هواه» [@lisan، ج4 ص182].'
- term: مُقْصِرٍ
  text: كافٍّ عن هواه.
- term: بِقُرّ
  text: «أي بمستقرّه» [@lisan، ج5 ص86].
