explained: false
first: لَعَمْرُكَ مَا سَعْدٌ بِخُلَّةِ آثِمٍ
second: وَلَا نَأْنَإٍ يَوْمَ الْحِفَاظِ وَلَا حَصِرْ
vocabulary:
- term: سَعْدٌ
  text: سعد بن الضِّباب الإيادي، سيّد إياد، لجأ إليه الشاعر «فأجاره» [@ibn-qutayba، ج1 ص118].
- term: بِخُلَّةِ آثِمٍ
  text: أي «ما سعد مُخالٌّ رجلًا آثمًا»، ويجوز أن تكون الخُلّة الصداقة [@lisan، ج11 ص218].
- term: نَأْنَإٍ
  text: «عاجز جبان ضعيف» [@lisan، ج1 ص161].
