first: وَتَعْرِفُ فِيهِ مِنْ أَبِيهِ شَمَائِلًا
second: وَمِنْ خَالِهِ وَمِنْ يَزِيدَ وَمِنْ حُجُرْ
vocabulary:
- term: شَمَائِلًا
  text: أخلاقًا وطباعًا.
- term: حُجُرْ
  text: حُجر أبو الشاعر؛ وكان ابن الكَلْبِيّ يذكر «أن أمّ سعد كانت عند حُجْر أبي امرئ القَيْس» [@ibn-qutayba، ج1 ص118].
