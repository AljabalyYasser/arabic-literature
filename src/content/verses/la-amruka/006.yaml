first: هُمَا نَعْجَتَانِ مِنْ نِعَاجِ تَبَالَةٍ
second: لَدَى جُؤْذَرَيْنِ أَوْ كَبَعْضِ دُمَى هَكِرْ
vocabulary:
- term: نَعْجَتَانِ
  text: بقرتان من بقر الوحش.
- term: تَبَالَةٍ
  text: موضع.
- term: جُؤْذَرَيْنِ
  text: ولدَي بقرة الوحش.
- term: دُمَى هَكِرْ
  text: 'الدُّمى: الصور والتماثيل، وهَكِر: «موضع أو دير»، قال الأزهري: «أُراه روميًّا» [@lisan، ج5 ص266].'
