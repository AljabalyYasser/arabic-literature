first: يُفَاكِهُنَا سَعْدٌ وَيَغْدُو لِجَمْعِنَا
second: بِمَثْنَى الزِّقَاقِ الْمُتْرَعَاتِ وَبِالْجُزُرْ
vocabulary:
- term: يُفَاكِهُنَا
  text: يمازحنا ويؤانسنا بالحديث.
- term: مَثْنَى الزِّقَاقِ
  text: 'أوعية الخمر اثنين اثنين، والزِّقّ: وعاء من جلد.'
- term: الْمُتْرَعَاتِ
  text: المملوءة.
- term: الْجُزُرْ
  text: جمع جَزور، وهي الناقة تُنحر.
