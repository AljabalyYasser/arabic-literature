first: "وَصِنْوَيَّ لَا أَنْسَى مُعَاوِيَةَ الَّذِي"
second: "لَهُ مِنْ سَرَاةِ الْحَرَّتَيْنِ وُفُودُهَا"
vocabulary:
- term: "وَصِنْوَيَّ"
  text: "أخويّ. في لسان العرب: «والصِّنْوُ: الأَخ الشَّقِيقُ والعمُّ والابنُ» [@lisan، ج14 ص470]."
- term: "سَرَاةِ"
  text: "جمع سَرِيّ، و«السَّريُّ الشَّرِيفُ النَّفِيسُ مِنَ النَّاسِ» [@lisan، ج13 ص328]."
