explained: false
first: "ذَهَبَ الَّذِينَ يُعَاشُ فِي أَكْنَافِهِمْ"
second: "وَبَقِيتُ فِي خَلْفٍ كَجِلْدِ الْأَجْرَبِ"
vocabulary:
  - term: "أَكْنَافِهِمْ"
    text: "جوانبهم، أي في ظلهم وحماهم؛ وفي شرح الطوسي لقصيدة أخرى: «وأكناف: جوانب» [@diwan-labid، ص168]."
  - term: "خَلْفٍ"
    text: "في شرح الطوسي: «والخلف: النسل، وقالوا: الخلف: البقية»، و«أبو عبد الله: خلف صدق وخلف سوء» [@diwan-labid، ص153]."
  - term: "كَجِلْدِ الْأَجْرَبِ"
    text: "«يشينون من صحبوا كما يشين الجرب الجلد» [@diwan-labid، ص153]."
