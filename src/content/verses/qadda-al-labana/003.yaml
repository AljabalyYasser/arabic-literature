explained: false
first: "يَتَأَكَّلُونَ مَغَالَةً وَخِيَانَةً"
second: "وَيُعَابُ قَائِلُهُمْ وَإِنْ لَمْ يَشْغَبِ"
vocabulary:
  - term: "يَتَأَكَّلُونَ"
    text: "«أى يأكل بعضهم بعضاً» [@diwan-labid، ص154]."
  - term: "مَغَالَةً"
    text: "«المغالة: الفحش»، ويقال: «مغل فلان بفلان عند فلان: إذا وقع فيه» [@diwan-labid، ص154]."
  - term: "يَشْغَبِ"
    text: "يهيج الشر؛ «الشَّغْبُ، بِسُكُونِ الْغَيْنِ: تَهْيِيجُ الشَّرِّ والفِتْنَةِ والخِصام» [@lisan، ج1 ص504]."
