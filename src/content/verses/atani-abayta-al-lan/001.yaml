first: "أَتَانِي أَبَيْتَ اللَّعْنَ أَنَّكَ لُمْتَنِي"
second: "وَتِلْكَ الَّتِي أَهْتَمُّ مِنْهَا وَأَنْصَبُ"
meaning: "بلغني، أيها الملك، أنك لمتني، وهذا اللوم هو الذي يشغل همّي ويُتعبني. قال الأَعْلَم في العجز إنه «جعلتني ذا همٍّ وذا نَصَب، أي عناء ومشقة» [@diwan-nabigha، ص72]."
vocabulary:
  - term: "أَبَيْتَ اللَّعْنَ"
    text: "«أي أبيتَ أن تأتي أمرًا تُلعن عليه» [@diwan-nabigha، ص72]. وهي تحية ملوك الحِيرة، ينقل البَغْداديّ عن ابن الأَنْبارِيّ: «وكانت هذه تحية لخم وجذام وكانت منازلهم الحيرة وما يليها. وتحية ملوك غسان: يا خير الفتيان» [@khizana، ج2 ص459–460]."
  - term: "أَهْتَمُّ"
    text: "أغتمّ ويشغلني الهمّ."
  - term: "وَأَنْصَبُ"
    text: "أتعب، من النَّصَب، وهو عند الأَعْلَم «عناء ومشقة» [@diwan-nabigha، ص72]."
context: "مطلع القصيدة في رواية الأَصْمَعِيّ التي شرحها الأَعْلَم، وفي رأسها: «وقال أيضًا يمدح النعمان ويعتذر إليه» [@diwan-nabigha، ص72]. فهي تبدأ بالاعتذار بلا نسيب. أما في رواية ابن السِّكِّيت فتبدأ القصيدة بنسيب أوله «أَرَسْمًا جَدِيدًا مِنْ سُعَادَ تَجَنَّبُ»، ويقع هذا البيت في آخرها، كما يقول المحقق: «والبيت الأول في آخر القصيدة في ابن السكيت» [@diwan-nabigha، ص241]. وصدر البيت هو صدر بيت في العينية: [«أَتَانِي أَبَيْتَ اللَّعْنَ أَنَّكَ لُمْتَنِي / وَتِلْكَ الَّتِي تَسْتَكُّ مِنْهَا الْمَسَامِعُ»](/texts/afa-dhu-husa/14/). ويقدّمه شَوْقي ضَيْف بقوله: «ومن رائع اعتذاراته إليه قوله» [@deif، ج1 ص291]."
syntax:
  - "«أَتَانِي» فعل ماض والياء مفعوله، والفاعل المصدر المؤوّل من «أنّك لمتني»، أي: أتاني لومُك."
  - "«أَبَيْتَ اللَّعْنَ» جملة دعائية معترضة بين الفعل وفاعله، و«اللعنَ» مفعول «أبيت»."
  - "«وَتِلْكَ الَّتِي ...»: «تلك» مبتدأ، و«التي» خبره، وجملة «أهتمّ منها» صلة، و«وأنصبُ» معطوف على «أهتمّ»."
morphology:
  - "«أَهْتَمّ» مضارع «اهتمّ» على «افتعل» من «همم»، أصله «أَهْتَمِمُ»، فأُدغمت الميم في الميم."
  - "«أَنْصَب» مضارع «نَصِبَ يَنْصَبُ» على «فَعِلَ يَفْعَلُ» إذا تعب، ومصدره «النَّصَب»."
  - "«لُمْتَنِي» من «لام يلوم»، حُذفت الواو لالتقاء الساكنين حين اتصل الفعل بضمير الرفع، وبقيت الضمة على اللام دليلًا عليها."
rhetoric:
  thesis: "يبدأ القصيدة بالغرض مباشرة: خبر اللوم أولًا، ثم أثره في نفسه. فالمطلع نفسه شكوى، وليس فيه دار ولا صاحبة."
  devices:
    - title: "الابتداء بالغرض"
      text: "المطلع عند ابن رَشِيق أول ما يقرع السمع: «فإن الشعر قفل أوله مفتاحه، وينبغي للشاعر أن يجود ابتداء شعره؛ فإنه أول ما يقرع السمع» [@ibn-rashiq، ج1 ص218]. والنابِغة في رواية الأَعْلَم يفتح القصيدة بموضوعها، فيعرف الملك من البيت الأول ما يريده الشاعر."
    - title: "الاعتراض في «أَبَيْتَ اللَّعْنَ»"
      text: "الاعتراض جملة تدخل في أثناء الكلام لا يتوقف عليها معناه. وضع تحية الملك بين «أتاني» وفاعله، فقدّم الأدب على الشكوى، ولم يواجه الملك بخبر اللوم قبل أن يحييه."
    - title: "الإشارة في «وَتِلْكَ»"
      text: "أشار إلى اللوم باسم الإشارة للبعيد، فجعله شيئًا ثقيلًا ماثلًا أمامه، ثم وصفه بأثره لا بلفظه: همّ ونصب. وفي العينية جعل أثره أن «تَسْتَكُّ مِنْهَا الْمَسَامِعُ»، وهنا جعله في النفس والجسد."
  connection: "ثم يصف ليلته بعد هذا الخبر: كأن العائدات فرشن له شوكًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "أَتَانِي / أَبَيْتَلْ لَعْ / نَ أَنْنَ / كَ لُمْتَنِي = فعولن / مفاعيلن / فعولُ / مفاعلن — وَتِلْكَلْ / لَتِي أَهْ تَمْ / مُ مِنْهَا / وَأَنْصَبُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر فصارت «فعولُ» [@atiq، ص29]. والعروض والضرب مقبوضان «مفاعلن» على ما يلزم في الطويل [@atiq، ص29–30]، وتُشبَع ضمة الرويّ: «وَأَنْصَبُو»."
