first: "لَئِنْ كُنْتَ قَدْ بُلِّغْتَ عَنِّي خِيَانَةً"
second: "لَمُبْلِغُكَ الْوَاشِي أَغَشُّ وَأَكْذَبُ"
vocabulary:
  - term: "بُلِّغْتَ عَنِّي خِيَانَةً"
    text: "قال الأَعْلَم: «أي لئن بُلّغت عنّي أنّي أختان ودّك وأكفر نعمتك؛ فالذي بلّغك ذلك، ووشى به إليك أغشّ وأكذب» [@diwan-nabigha، ص72]."
  - term: "الْوَاشِي"
    text: "«النمّام الذي يزيّن كذبه عندك، وأصله من الوَشْي» [@diwan-nabigha، ص72]، وهو النقش والتزيين."
  - term: "أَغَشُّ وَأَكْذَبُ"
    text: "«أي ذو غشّ وذو كذب» [@diwan-nabigha، ص72]."
