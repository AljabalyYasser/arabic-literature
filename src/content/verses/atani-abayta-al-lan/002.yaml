explained: false
first: "فَبِتُّ كَأَنَّ الْعَائِدَاتِ فَرَشْنَنِي"
second: "هَرَاسًا بِهِ يُعْلَى فِرَاشِي وَيُقْشَبُ"
vocabulary:
  - term: "الْعَائِدَاتِ"
    text: "«وهنّ الزائرات في المرض؛ لأنه جعل نفسه كالسقيم لشدّة ما به من قِبَل النعمان» [@diwan-nabigha، ص72]."
  - term: "فَرَشْنَنِي"
    text: "فرشن لي فراشًا. قال الأَعْلَم: «أي كأني لمّا اتّصل بي عنك مضطجعٌ على فراش قد عُولي بالشوك؛ فأنا أتململ عليه وأتقلّب» [@diwan-nabigha، ص72]."
  - term: "هَرَاسًا"
    text: "«والهَراس: الشوك، واحدتها هراسة» [@diwan-nabigha، ص72]."
  - term: "يُعْلَى"
    text: "يُرفع ويُزاد."
  - term: "وَيُقْشَبُ"
    text: "«يُجدَّد ويُتعاهد بالشوك، ويكون معناه أيضًا يُخالط» [@diwan-nabigha، ص72]."
sources:
  - source: "diwan-nabigha"
    loc: "ص72"
    url: "https://archive.org/details/3409pdf_202001/page/n71/mode/1up"
