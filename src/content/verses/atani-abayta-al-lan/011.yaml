first: "وَلَسْتَ بِمُسْتَبْقٍ أَخًا لَا تَلُمُّهُ"
second: "عَلَى شَعَثٍ أَيُّ الرِّجَالِ الْمُهَذَّبُ"
meaning: "لن يبقى لك أخ إن لم تحتمل ما فيه من خلل وتصلحه، فأيّ الرجال يخلو من عيب؟ قال الأَعْلَم: «يقول للنعمان: إن لم تصبر للأخ والصديق على فسادٍ يكون منه لم تُبْقِ لنفسك أخًا؛ إذ لا يخلو الإنسان من أن تكون فيه خصلةٌ غير مرضية» [@diwan-nabigha، ص74]."
vocabulary:
  - term: "بِمُسْتَبْقٍ"
    text: "بمحافظ على مودّته. وفي اللسان: «واسْتَبْقَيْتُ فُلَانًا: فِي مَعْنَى الْعَفْوِ عَنْ زَلَلِهِ واسْتِبْقاء مودَّته؛ قَالَ النَّابِغَةُ»، ثم أنشد البيت [@lisan، ج14 ص81]."
  - term: "تَلُمُّهُ"
    text: "«أي لا تصلح من أمره وتجمعه» [@diwan-nabigha، ص74]. ويقال كما يقول الأَعْلَم: «لمّ الله شعثك، أي جمع الله ما تفرّق من أمرك وتشتّت» [@diwan-nabigha، ص74]."
  - term: "شَعَثٍ"
    text: "«والشَّعَث: الفساد والتفرّق» [@diwan-nabigha، ص74]."
  - term: "الْمُهَذَّبُ"
    text: "«المنقّى من العيوب المخلَص» [@diwan-nabigha، ص74]."
context: "بعد المدح يعود إلى طلب العفو، ولكن بحكمة عامة يقبلها الملك قبل غيره. وهو من أكثر أبيات النابِغة دورانًا. ويروي ابن سَلّام أن عُمَر بن الخَطّاب سأل عن قائله: «قالوا النابغة قال هو أشعرهم وبنو سعد بن زيد مناة تدعى هذا البيت لرجل من بنى مالك بن سعد يقال له شقة أنشدناه له» [@ibn-sallam، ج1 ص56]، فهو يذكر من ينسبه إلى غير النابِغة، ولا يرجّح. والخلاف في بيت واحد لا ينزل درجة القصيدة. وقال ابن قُتَيْبة: «ومن جيّد شعره قوله»، وأنشده، ثم شرحه: «يقول: من لم تصلحه وتقوّمه من الناس فلست بمستبقيه ولا راغب فيه» [@ibn-qutayba، ج1 ص170]. وصار عجزه مثلًا: «أيُّ الرِّجَالِ المُهَذَّبُ، أول من قاله النابغةُ» [@maydani، ج1 ص23]."
syntax:
  - "«وَلَسْتَ»: «ليس» فعل ناقص، والتاء اسمها، و«بِمُسْتَبْقٍ» خبرها، مجرور لفظًا بالباء الزائدة، و«أَخًا» مفعول به لـ«مستبق» لأنه اسم فاعل يعمل عمل فعله."
  - "«لَا تَلُمُّهُ» جملة صفة لـ«أخًا»، و«لا» نافية، و«عَلَى شَعَثٍ» متعلق بـ«تلمّه»، أي على ما فيه من شعث."
  - "«أَيُّ الرِّجَالِ الْمُهَذَّبُ»: «أيّ» اسم استفهام مبتدأ مضاف إلى «الرجال»، و«المهذّب» خبره، والاستفهام بمعنى النفي: ليس في الرجال مهذّب كامل."
morphology:
  - "«مُسْتَبْق» اسم فاعل من «استبقى» على «استفعل»، اسم منقوص حُذفت ياؤه لالتقائها ساكنة مع التنوين."
  - "«تَلُمّ» مضارع «لَمَّ يَلُمُّ» المضعّف، مرفوع لأن «لا» نافية لا ناهية."
  - "«الْمُهَذَّب» اسم مفعول من «هذّب» على «فعّل»، و«شَعَث» مصدر «شَعِثَ يَشْعَثُ»."
rhetoric:
  thesis: "ينتقل من الدفاع عن نفسه إلى قاعدة في الإخاء: لا يخلو أحد من عيب، فمن طلب الكمال في أصحابه بقي وحده. فيضع الملك أمام خيارين: أن يعفو، أو أن يخسر الناس جميعًا."
  devices:
    - title: "إرسال المثل وتمام الشطرين"
      text: "كل شطر من البيت كلام تامّ يصلح وحده مثلًا. وفي «المُوَشَّح»: «وخير الأبيات عندهم ما كفى بعضه دون بعض، مثل قول النابغة»، ثم أنشده وقال: «فلو تمثّل إنسان ببعضه لكفاه» [@muwashshah، ص330]. ويحكي ابن رَشِيق عن حمّاد الراوية أنه قال في النابِغة: «بل لو تمثلت بربع بيت من شعره اكتفيت به، وهو قوله أي الرجال المهذب؟»، ثم يعترض ابن رَشِيق: «ولا أعرف كيف يحمل حماد هذا ربع بيت وفيه زيادة سببين وهما أربعة أحرف؟ إلا أن يريد التقريب» [@ibn-rashiq، ج1 ص282]، أي إن العبارة أطول من ربع البيت."
    - title: "الاستفهام الإنكاري في «أَيُّ الرِّجَالِ الْمُهَذَّبُ»"
      text: "سؤال جوابه معروف: لا أحد. وهو أبلغ من أن يقول: ليس في الرجال مهذّب، لأنه يدعو الملك إلى أن يبحث بنفسه فلا يجد. وجعله الأَعْلَم مثلًا ضربه الشاعر لما قبله، وقال: «وإنما ألزمه أن يعفو عنه ويغفر له ما وُشي به عنده» [@diwan-nabigha، ص74]."
    - title: "الاستعارة في «تَلُمُّهُ عَلَى شَعَثٍ»"
      text: "الشعث في الأصل تفرّق الشعر واغبراره، واللمّ جمعه وإصلاحه، فنقلهما إلى أخلاق الصديق وزلّاته. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
  connection: "ثم يختم: إن كنتُ مظلومًا فأنا عبد ظلمه سيّده، وإن رضيت فمثلك يرضى."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "وَلَسْ تَ / بِمُسْتَبْ قِنْ / أَخَنْ لَا / تَلُمْمُهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — عَلَى شَ / عَثِنْ أَيْ يُرْ / رِجَالِلْ / مُهَذْذَبُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى في الشطرين، فصارت «فعولُ» [@atiq، ص29]. وتُشبَع ضمة الهاء في «تَلُمُّهُ» في آخر الصدر."
