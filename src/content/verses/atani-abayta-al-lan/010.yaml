first: "بِأَنَّكَ شَمْسٌ وَالْمُلُوكُ كَوَاكِبُ"
second: "إِذَا طَلَعَتْ لَمْ يَبْدُ مِنْهُنَّ كَوْكَبُ"
meaning: "أعطاك الله منزلة هي أنك شمس وسائر الملوك نجوم، فإذا طلعت الشمس لم يظهر منها نجم. قال الأَعْلَم: «يعني أن منزلته من الملوك كمنزلة الشمس من الكواكب، فإذا ذُكِر ونُشِرت مآثره لم يُذكر غيره معه؛ كما أن الشمس إذا طلعت لم يُرَ معها كوكب» [@diwan-nabigha، ص74]."
vocabulary:
  - term: "كَوَاكِبُ"
    text: "النجوم، والواحد كوكب."
  - term: "لَمْ يَبْدُ"
    text: "لم يظهر."
context: "أشهر أبيات القصيدة، يأتي بعد قوله «أَلَمْ تَرَ أَنَّ اللَّهَ أَعْطَاكَ سُورَةً / تَرَى كُلَّ مَلْكٍ دُونَهَا يَتَذَبْذَبُ»، فالباء في «بِأَنَّكَ» تربطه به. ويروي ابن قُتَيْبة عن ابن الكَلْبِيّ أن حسّان بن ثابت كان عند النُّعْمان حين دخل عليه النابِغة، «فأنشده كلمته التى يقول فيها» هذا البيت، «فدفع إليه مائة ناقة من الإبل السود، فيها رعاؤها»، فقال حسّان: «فما حسدت أحدا حسدى النابغة» [@ibn-qutayba، ج1 ص163]. والخبر راجح، وهو خبر أدبي: راويه حسّان في طرقه كلها، ويُختلف فيما أُنشد يومئذ. وجعله العَسْكَريّ مع البيت السابق مثالًا لما تُمدح به الملوك: «وإنما تمدح الملوك بمثل قول الشاعر» [@sinaatayn، ص75]."
syntax:
  - "على رواية الأَعْلَم «بِأَنَّكَ»: الباء متعلقة بـ«أعطاك» في البيت السابق، والمصدر المؤوّل بيان للسورة، أي: أعطاك منزلة هي كونك شمسًا. فالبيت متعلق بما قبله في المعنى والإعراب، وهذا تقديرنا."
  - "وعلى رواية «فَإِنَّكَ» (انظر الروايات) يستقلّ البيت، والفاء للتعليل: إنما يتذبذب الملوك دونك لأنك شمس وهم كواكب."
  - "«شَمْسٌ» خبر «أنّ»، و«وَالْمُلُوكُ كَوَاكِبُ» جملة من مبتدأ وخبر في موضع الحال. و«إِذَا طَلَعَتْ» ظرف شرطي، والضمير للشمس، وجوابه «لَمْ يَبْدُ مِنْهُنَّ كَوْكَبُ»، و«كوكبُ» فاعل «يبدُ» المجزوم بحذف الواو."
morphology:
  - "«يَبْدُ» أصله «يَبْدُو» من «بدا يبدو»، حُذفت الواو للجزم."
  - "«كَوَاكِب» جمع «كوكب» على «فَوَاعِل»، ممنوع من الصرف لأنه على صيغة منتهى الجموع، فلا يُنوَّن."
  - "«طَلَعَتْ» على «فَعَلَتْ»، والتاء للتأنيث لأن الفاعل ضمير الشمس."
rhetoric:
  thesis: "يرفع الملك فوق الملوك جميعًا بصورة لا يجادل فيها أحد: النجوم لا تغيب حين تطلع الشمس، لكنها لا تُرى. فالملوك موجودون، غير أن نوره يمحو ظهورهم. وهو بهذا يصالح بين مدحه للغساسنة ومدحه للنعمان: كلهم ملوك، والنعمان شمسهم."
  devices:
    - title: "التمثيل"
      text: "الشبه ليس في الضوء وحده، بل في هيئة مركّبة: حضور واحد يمحو ظهور الكثيرين. ويذكر عبد القاهر الجُرْجانيّ هذا البيت والبيت «فإنك كالليل» مثالين لمعنى ممثَّل يحتاج إلى قدر من التأمل، فيقول: «وإنما أردت القدر الذي يحتاج إليه في نحو قوله»، ثم يعدّ أبياتًا منها هذا البيت [@asrar، ص140]، ويقول قبل ذلك إن المعنى إذا أتاك ممثَّلًا «في الأكثر ينجلي لك بعد أن يُحْوِجك إلى غير طلبه بالفكرة وتحريك الخاطرِ له» [@asrar، ص139]."
    - title: "التشبيه البليغ في «شَمْسٌ» و«كَوَاكِبُ»"
      text: "حذف أداة التشبيه فجعل الملك شمسًا، وجعل الملوك كواكب، وهذا عند عبد القاهر الجُرْجانيّ مما تجري فيه «اسم المشبه به خبرًا على المشبَّه» [@dalail، ص68]. ويعدّه العَسْكَريّ من تشبيه المعنى: «ومنها تشبيهه به معنى، كقول النابغة» [@sinaatayn، ص248]، أي إن الشبه في منزلة لا في صورة تُرى."
    - title: "الإيجاز في «لَمْ يَبْدُ مِنْهُنَّ كَوْكَبُ»"
      text: "لم يقل إن الملوك صغار أو ضعاف، بل قال إنهم لا يظهرون، فلم يهن أحدًا منهم. ويرى شَوْقي ضَيْف أنها «صورة باهرة لا شك أنها تركت أثرا بليغا فى نفس النعمان» [@deif، ج1 ص292]."
  connection: "ثم يطلب العفو بحكمة عامة: لن يبقى لك أخ إن لم تحتمل ما فيه من عيب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "بِأَنْ نَ / كَ شَمْسُنْ وَلْ / مُلُو كُ / كَوَاكِبُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — إِذَا طَ / لَعَتْ لَمْ يَبْ / دُ مِنْهُنْ / نَ كَوْكَبُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر، والأولى في العجز، فصارت «فعولُ» [@atiq، ص29]. وتُشبَع ضمة «كَوَاكِبُ» في آخر الصدر، والعروض «مفاعلن» على ما يلزم في الطويل."
variants:
  - reading: "فَإِنَّكَ شَمْسٌ وَالْمُلُوكُ كَوَاكِبُ"
    status: "رواية ابن قُتَيْبة وابن رَشِيق، وبها يورده الأَعْلَم في شرحه"
    note: "في متن الديوان «بأنك»، وفي شرح الأَعْلَم تحته «فإنك» [@diwan-nabigha، ص74]. وبالفاء هو عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص163] وابن رَشِيق [@ibn-rashiq، ج2 ص178] وعبد القاهر [@asrar، ص140]، وعند شَوْقي ضَيْف «وإنّك» [@deif، ج1 ص291]. أما العَسْكَريّ فيرويه بالباء كما في الديوان، بعد البيت السابق [@sinaatayn، ص75]."
