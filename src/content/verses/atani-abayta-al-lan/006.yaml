first: "مُلُوكٌ وَإِخْوَانٌ إِذَا مَا أَتَيْتُهُمْ"
second: "أُحَكَّمُ فِي أَمْوَالِهِمْ وَأُقَرَّبُ"
meaning: "في ذلك الجانب ملوك هم لي إخوان، إذا جئتهم جعلوني أحكم في أموالهم بما أشاء، وأدنوا منزلتي منهم. قال الأَعْلَم: ««ملوك وإخوان»، يعني الغسّانيين، وكان قد حلّ بهم حين فرّ من النعمان فأكرموه وقرّبوا منزلته» [@diwan-nabigha، ص73]."
vocabulary:
  - term: "مُلُوكٌ وَإِخْوَانٌ"
    text: "«يعني الغسّانيين» [@diwan-nabigha، ص73]، ملوك غَسّان في الشام."
  - term: "أُحَكَّمُ فِي أَمْوَالِهِمْ"
    text: "يُجعل لي الحكم فيها، فآخذ منها ما أريد."
  - term: "وَأُقَرَّبُ"
    text: "أُدنى منهم منزلةً."
context: "يسمّي هنا أهل الجانب الذي ذكره في البيت السابق، ولكن بصفتهم لا باسمهم. وبهذا البيت والذي يليه تتم الحجة التي سمّاها ابن قُتَيْبة قياسًا [@ibn-qutayba، ج1 ص170]. ويشرحها شَوْقي ضَيْف بقوله: «وكل ما هناك أنه ألم بديار الغساسنة، فأكرموه وحكموه فى أموالهم، فوجب عليه أن يشكر لهم يدهم وصنيعهم» [@deif، ج1 ص292]."
syntax:
  - "«مُلُوكٌ» خبر لمبتدأ محذوف تقديره: هم ملوك، والجملة تفسير لما في «جانب» من البيت السابق. و«إِخْوَانٌ» معطوف على «ملوك»."
  - "«إِذَا مَا أَتَيْتُهُمْ»: «إذا» ظرف شرطي، و«ما» زائدة للتوكيد، و«أتيتهم» فعل الشرط، وجوابه «أُحَكَّمُ»."
  - "«أُحَكَّمُ» و«أُقَرَّبُ» مضارعان مبنيان للمجهول، ونائب الفاعل فيهما ضمير المتكلم، و«فِي أَمْوَالِهِمْ» متعلق بـ«أحكّم»."
morphology:
  - "«أُحَكَّم» مضارع «حَكَّمَ» على «فَعَّلَ» مبنيًّا للمجهول، أي يُجعل حاكمًا."
  - "«أُقَرَّب» مضارع «قَرَّبَ» على «فَعَّلَ» مبنيًّا للمجهول."
  - "«مُلُوك» جمع «مَلِك» على «فُعُول»، و«إِخْوَان» جمع «أخ» على «فِعْلان»."
rhetoric:
  thesis: "يرسم إكرام الغساسنة بفعلين مبنيين للمجهول، فلا يظهر هو طالبًا، بل يُحكَّم ويُقرَّب. ثم يجمع لهم صفتين متباعدتين: هم ملوك في منزلتهم، وإخوان في معاملتهم."
  devices:
    - title: "الجمع بين «مُلُوكٌ» و«إِخْوَانٌ»"
      text: "الملك يفرض البعد، والأخوّة تقتضي القرب، فجمع الصفتين ليقول إن القوم أكرموه إكرام الملوك، وعاملوه معاملة الأهل. وفي ذلك تعريض لطيف بما لقيه من وعيد النُّعْمان."
    - title: "البناء للمجهول في «أُحَكَّمُ» و«أُقَرَّبُ»"
      text: "لم يقل: يحكّمونني ويقرّبونني، بل بنى الفعلين للمجهول، فجعل العناية بما وقع له لا بمن أوقعه. وبذلك لا يُكثر من ذكر خصوم النُّعْمان في قصيدة يعتذر فيها إليه."
    - title: "الكناية في «أُحَكَّمُ فِي أَمْوَالِهِمْ»"
      text: "لم يقل إنهم كرماء، بل ذكر ما يلزم من كرمهم: أن يجعلوا أموالهم في يده كأنها ماله. والكناية عند عبد القاهر الجُرْجانيّ أن يذكر المتكلم معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
  connection: "ثم يقيس حاله على قوم اصطنعهم النُّعْمان فشكروه، ولم يرهم مذنبين."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "مُلُوكُنْ / وَإِخْوَانُنْ / إِذَا مَا / أَتَيْتُهُمْ = فعولن / مفاعيلن / فعولن / مفاعلن — أُحَكْ كَ / مُ فِي أَمْ وَا / لِهِمْ وَ / أُقَرْرَبُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في العجز، فصارتا «فعولُ» [@atiq، ص29]. والصدر سالم من الزحاف."
