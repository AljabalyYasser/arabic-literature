explained: false
first: "فَإِنْ أَكُ مَظْلُومًا فَعَبْدٌ ظَلَمْتَهُ"
second: "وَإِنْ تَكُ ذَا عُتْبَى فَمِثْلُكَ يُعْتِبُ"
vocabulary:
  - term: "فَعَبْدٌ ظَلَمْتَهُ"
    text: "«أي إن ظلمتني وأنا محتمل لذلك، كما يحتمل العبدُ ظلمَ سيّده» [@diwan-nabigha، ص74]."
  - term: "ذَا عُتْبَى"
    text: "«أي ذا رضًا ورجوع إلى ما أُحبّ من عفوك» [@diwan-nabigha، ص74]."
  - term: "يُعْتِبُ"
    text: "يرضى ويرجع إلى ما يُحَبّ. قال الأَعْلَم: «يقال: عتب الرجل إذا سخط، والاسم منه العتب والعتاب. وأعتب إذا رضي، والاسم العُتْبى والمصدر الإعتاب» [@diwan-nabigha، ص74]."
sources:
