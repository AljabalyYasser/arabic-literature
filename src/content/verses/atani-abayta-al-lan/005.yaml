first: "وَلَكِنَّنِي كُنْتُ امْرَأً لِيَ جَانِبٌ"
second: "مِنَ الْأَرْضِ فِيهِ مُسْتَرَادٌ وَمَذْهَبُ"
meaning: "لم أخنك، ولكني كنت رجلًا له في الأرض ناحية واسعة يذهب فيها ويجيء ويتمكّن. قال الأَعْلَم: ««لي جانب من الأرض»، أي متّسع وتمكُّن؛ وإنما يصف نهوضه إلى الغسّانيين وتمكّنه فيهم» [@diwan-nabigha، ص73]."
vocabulary:
  - term: "جَانِبٌ"
    text: "«أي متّسع وتمكُّن» [@diwan-nabigha، ص73]."
  - term: "مُسْتَرَادٌ"
    text: "«والمستراد: الإقبال والإدبار» [@diwan-nabigha، ص73]، أي موضع يُذهب فيه ويُجاء."
  - term: "وَمَذْهَبُ"
    text: "«والمذهب: موضع الذهاب» [@diwan-nabigha، ص73]."
context: "بعد القسم وردّ الوشاية (3–4) يبدأ الحجة في ثلاثة أبيات (5–7): كان له مكان عند ملوك آخرين أكرموه، فشكرهم، كما يشكر النعمانَ من أكرمهم. وهذه الأبيات هي التي قال فيها ابن قُتَيْبة: «قالوا: وقايس في شعره فأحسن، قال للنعمان حين فارقه» [@ibn-qutayba، ج1 ص170]. ويقدّمها ابن رَشِيق بقوله إنه «يقول فيها معتذرا من مدح آل جفنة ومحتجا بإحسانهم إليه» [@ibn-rashiq، ج2 ص178]، وآل جَفْنة ملوك غَسّان."
syntax:
  - "«وَلَكِنَّنِي»: «لكنّ» حرف استدراك، والياء اسمها، والنون الثانية نون الوقاية، وجملة «كنتُ امرأً» خبرها."
  - "«لِيَ جَانِبٌ» جملة صفة لـ«امرأً»: «لي» خبر مقدّم، و«جانبٌ» مبتدأ مؤخّر."
  - "«مِنَ الْأَرْضِ» صفة لجانب، و«فِيهِ مُسْتَرَادٌ وَمَذْهَبُ» جملة صفة ثانية له، و«مستراد» مبتدأ مؤخّر خبره «فيه»."
morphology:
  - "«مُسْتَرَاد» مصدر ميمي على «مُسْتَفْعَل» من «استراد»، من «راد يرود» إذا ذهب وجاء، أصله «مُسْتَرْوَد»، نُقلت فتحة الواو إلى الراء ثم قُلبت ألفًا."
  - "«مَذْهَب» على «مَفْعَل» من «ذهب»، يكون مصدرًا ميميًّا واسم مكان."
  - "«لَكِنَّنِي» تُكتب بلا ألف وتُنطق «لَاكِنَّنِي»."
rhetoric:
  thesis: "لا ينكر ذهابه إلى الغساسنة، بل يجعله حجة له: لم يكن رجلًا مقطوعًا يستجدي، بل كانت له في الأرض ناحية تتسع له. وهو لا يسمّيهم بعد، فيمهّد للحجة قبل أن يذكر أصحابها."
  devices:
    - title: "الاستدراك في «وَلَكِنَّنِي»"
      text: "نفى في البيت 4 أن يكون خائنًا، ثم استدرك هنا بما وقع فعلًا: نعم ذهب، لكن ذهابه ليس خيانة. فالاستدراك يقبل بعض الخبر ويردّ تفسيره."
    - title: "الكناية في «لِيَ جَانِبٌ مِنَ الْأَرْضِ»"
      text: "لم يذكر الغساسنة، بل قال إن له ناحية واسعة من الأرض، ويريد ما لقيه عندهم من الأمن والإكرام. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]. وبه فسّره الأَعْلَم: «وإنما يصف بهذا سعة حاله وتمكّنها» [@diwan-nabigha، ص73]."
    - title: "الجمع بين «مُسْتَرَادٌ» و«مَذْهَبُ»"
      text: "المستراد عند الأَعْلَم الإقبال والإدبار، والمذهب موضع الذهاب، فجمعهما ليدل على حرية الحركة: يذهب ويجيء كما يشاء، لا يحبسه خوف."
  connection: "ثم يسمّي أهل ذلك الجانب: ملوك وإخوان يحكّمونه في أموالهم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "وَلَاكِنْ / نَنِي كُنْتُمْ / رَأَنْ لِ / يَ جَانِبُنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — مِنَلْ أَرْ / ضِ فِيهِي مُسْ / تَرَادُنْ / وَمَذْهَبُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر فصارت «فعولُ» [@atiq، ص29]. وتسقط همزة الوصل في «امْرَأً» فتتصل تاء «كُنْتُ» بالميم، وتُشبَع كسرة الهاء في «فِيهِ» فتصير «فِيهِي»."
variants:
  - reading: "مِنَ الْأَرْضِ فِيهِ مُسْتَمَازٌ وَمَذْهَبُ"
    status: "رواية ابن قُتَيْبة"
    note: "[@ibn-qutayba، ج1 ص170]. ويفسّرها محققه أحمد شاكر: «اسماز عن الشىء: تباعد منه وانفصل» [@ibn-qutayba، ج1 ص170]، فالمستماز موضع يُبتعد إليه."
  - reading: "مِنَ الْأَرْضِ فِيهِ مُسْتَرَادٌ وَمَهْرَبُ"
    status: "رواية ابن رَشِيق"
    note: "[@ibn-rashiq، ج2 ص178]."
