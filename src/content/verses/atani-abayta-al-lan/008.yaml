explained: false
first: "فَلَا تَتْرُكَنِّي بِالْوَعِيدِ كَأَنَّنِي"
second: "إِلَى النَّاسِ مَطْلِيٌّ بِهِ الْقَارُ أَجْرَبُ"
vocabulary:
  - term: "فَلَا تَتْرُكَنِّي بِالْوَعِيدِ"
    text: "قال الأَعْلَم: «أي لا تدعني كأني بعيرٌ أجرب قد طُلي بالقار، وهو القَطِران، يتحاماه الناس ويطردونه عن إبلهم؛ لئلا يُعديها بجربه» [@diwan-nabigha، ص73]."
  - term: "إِلَى النَّاسِ"
    text: "أي في الناس، وبه فسّره الأَعْلَم [@diwan-nabigha، ص73]. وفي اللسان أن «إلى» تكون «بِمَعْنَى فِي كَقَوْلِ النَّابِغَةِ» ثم أنشد البيت [@lisan، ج15 ص435]."
  - term: "مَطْلِيٌّ بِهِ الْقَارُ"
    text: "أي مطليّ بالقار، فقلب الكلام، كما يقول الأَعْلَم [@diwan-nabigha، ص73]. والقار: القطران تُطلى به الإبل الجربى."
