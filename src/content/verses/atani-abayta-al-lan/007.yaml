first: "كَفِعْلِكَ فِي قَوْمٍ أَرَاكَ اصْطَنَعْتَهُمْ"
second: "فَلَمْ تَرَهُمْ فِي شُكْرِ ذَلِكَ أَذْنَبُوا"
meaning: "صنعوا بي كما تصنع أنت بقوم اصطنعتهم وأحسنت إليهم، ثم لم تعدّهم مذنبين حين شكروا لك ذلك؛ فلا تعدّني مذنبًا حين شكرت للغساسنة صنيعهم. قال الأَعْلَم: «أي فعل بي الغسّانيون ما أوجب لهم مَدحي وثنائي، كما فعلتَ أنت في قوم اصطنعتهم وأحسنت إليهم، فينبغي ألّا تراني مذنبًا في شكر ذلك للغسّانيين لاصطناعهم إليّ، كما لا ترى من اصطنعته فيشكرك مذنبًا في شكره لك» [@diwan-nabigha، ص73]."
vocabulary:
  - term: "اصْطَنَعْتَهُمْ"
    text: "أحسنت إليهم واتخذتهم صنائع لك، أي رجالًا ربّاهم معروفك."
  - term: "أَذْنَبُوا"
    text: "ارتكبوا ذنبًا."
context: "هذا البيت تمام الحجة التي بدأت في البيت 5، وهو الذي قصده ابن قُتَيْبة بقوله: «قالوا: وقايس في شعره فأحسن» [@ibn-qutayba، ج1 ص170]. والقياس هنا أن يحمل الشاعر حاله على حال يقرّها الملك، فإذا لم يلم أولئك لم يكن له أن يلومه. ويرى شَوْقي ضَيْف أنه «بذلك يقيم الحجة على النعمان، فليس هناك كفران لنعمته عليه ولا جحود لولائه» [@deif، ج1 ص292]."
syntax:
  - "«كَفِعْلِكَ» جار ومجرور متعلق بمحذوف، أي: صنعوا بي صنيعًا كفعلك، فهو صفة لمصدر محذوف مفهوم من «أُحكَّم وأُقرَّب» في البيت السابق، و«فِي قَوْمٍ» متعلق بـ«فعلك»."
  - "«أَرَاكَ اصْطَنَعْتَهُمْ» جملة صفة لقوم، و«أرى» هنا بمعنى أعلم، والكاف مفعولها الأول، وجملة «اصطنعتهم» في موضع المفعول الثاني."
  - "«فَلَمْ تَرَهُمْ ... أَذْنَبُوا»: «ترهم» مضارع مجزوم بحذف الألف، والهاء مفعوله الأول، وجملة «أذنبوا» مفعوله الثاني، و«فِي شُكْرِ ذَلِكَ» متعلق بـ«أذنبوا»."
morphology:
  - "«اصْطَنَعْتَ» على «افْتَعَلَ» من «صنع»، أُبدلت تاء الافتعال طاء لمجاورة الصاد: «اصْتَنَعَ» ← «اصْطَنَعَ»."
  - "«تَرَهُمْ» أصله «تَرَى»، حُذفت ألفه للجزم بـ«لم»."
  - "«أَذْنَبُوا» على «أَفْعَلَ» من «الذَّنْب»."
rhetoric:
  thesis: "يقلب الحجة على الملك: ما يحمده النُّعْمان من صنائعه، وهو الشكر لمن أحسن، لا يصح أن يذمّه في الشاعر. فالقياس يجعل الملك حكمًا على نفسه."
  devices:
    - title: "القياس"
      text: "يحمل حاله على حال قوم يعرفهم الملك، ويقرّ هو بأنهم غير مذنبين. وفي معنى هذا القياس قراءتان: فالأَعْلَم يجعله في الشكر، أي إن الشكر للمحسن ليس ذنبًا [@diwan-nabigha، ص73]. وابن قُتَيْبة يجعله في الانتقال من ملك إلى ملك: «يقول: اجعلني كقوم صاروا إليك وكانوا مع غيرك، فاصطنعتهم وأحسنت إليهم، ولم ترهم مذنبين إذ فارقوا من كانوا معه، يقول: فأنا مثلهم، صرت عنك إلى غيرك» [@ibn-qutayba، ج1 ص170]."
    - title: "الاحتجاج مع الملوك"
      text: "يرى ابن رَشِيق أن المعتذر لا ينبغي أن يحتجّ: «فإن إتيان المعتذر من باب الاحتجاج وإقامة الدليل خطأ، لا سيما مع الملوك وذوي السلطان» [@ibn-rashiq، ج2 ص176]. ومع ذلك يعدّ هذه القصيدة من أجلّ ما قيل في الاعتذار، ويقول إنه قالها «معتذرا من مدح آل جفنة ومحتجا بإحسانهم إليه» [@ibn-rashiq، ج2 ص178]. فالنابِغة احتجّ، لكنه لفّ حجته في أدب: لم يقل إن الملك ظلمه، بل سأله أن يحكم بما يحكم به في غيره."
    - title: "الإشارة في «فِي شُكْرِ ذَلِكَ»"
      text: "اسم الإشارة يجمع كل ما سبق من الاصطناع والإحسان في كلمة واحدة، فلا يحتاج إلى إعادته."
  connection: "ثم يطلب ألا يتركه الملك بالوعيد كالبعير الأجرب الذي يتحاماه الناس."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "كَفِعْ لِ / كَ فِي قَوْ مِنْ / أَرَاكَصْ / طَنَعْتَهُمْ = فعولُ / مفاعيلن / فعولن / مفاعلن — فَلَمْ تَ / رَهُمْ فِي شُكْ / رِ ذَالِ / كَ أَذْنَبُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر، والأولى والثالثة في العجز، فصارت «فعولُ» [@atiq، ص29]. وتسقط همزة الوصل في «اصْطَنَعْتَهُمْ» فتتصل كاف «أَرَاكَ» بالصاد."
