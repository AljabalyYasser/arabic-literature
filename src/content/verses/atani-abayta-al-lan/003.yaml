first: "حَلَفْتُ فَلَمْ أَتْرُكْ لِنَفْسِكَ رِيبَةً"
second: "وَلَيْسَ وَرَاءَ اللَّهِ لِلْمَرْءِ مَذْهَبُ"
meaning: "حلفتُ لك بالله يمينًا لم تُبقِ في نفسك شكًّا، وليس بعد اليمين بالله شيء يلجأ إليه المرء ليُصدَّق. قال الأَعْلَم: «أي ليس بعد اليمين بالله – عزّ وجلّ – للمرء مذهب، فينبغي لك أن تصدّقه وتقبل اعتذاري» [@diwan-nabigha، ص72]."
vocabulary:
  - term: "رِيبَةً"
    text: "«الرِّيبة: الشكّ» [@diwan-nabigha، ص72]."
  - term: "وَرَاءَ اللَّهِ"
    text: "بعد اليمين بالله، وبه فسّره الأَعْلَم [@diwan-nabigha، ص72]. وفي حديث يرويه صاحب اللسان: «لَيْسَ وراءَ اللهِ مَرْمىً أَي مَقْصِدٌ تُرْمى إِلَيْهِ الآمالُ» [@lisan، ج14 ص336]."
  - term: "مَذْهَبُ"
    text: "موضع يُذهب إليه، أي مطلب ومخرج."
context: "بعد أن وصف ليلته في البيت 2 يقسم على براءته، ويأتي المقسَم عليه في البيت 4: «لَئِنْ كُنْتَ قَدْ بُلِّغْتَ عَنِّي خِيَانَةً / لَمُبْلِغُكَ الْوَاشِي أَغَشُّ وَأَكْذَبُ». وهو من أشهر أبيات النابِغة. يردّ ابن سَلّام خبرًا يروى عن الشَّعْبيّ في أن عُمَر سأل عن بيت آخر يُنسب إلى النابِغة، ثم يقول: «فإنه قد ذكر لي أن عمر بن الخطاب سأل عن بيت النابغة»، وينشد هذا البيت، ثم يقول: «وحرى أن يكون هذا البيت أو البيت الأول» [@ibn-sallam، ج1 ص60]، يعني البيت 11 «وَلَسْتَ بِمُسْتَبْقٍ» الذي ذكره قبل. وفي رواية ابن قُتَيْبة عن الشَّعْبيّ أن عُمَر سأل وفد غَطَفان عن قائل ثلاثة أبيات هذا أحدها، ثم «قال: هذا أشعر شعرائكم» [@ibn-qutayba، ج1 ص157]. وصدر البيت هو صدر بيت في العينية: [«حَلَفْتُ فَلَمْ أَتْرُكْ لِنَفْسِكَ رِيبَةً / وَهَلْ يَأْثَمَنْ ذُو إِمَّةٍ وَهْوَ طَائِعُ»](/texts/afa-dhu-husa/21/)."
syntax:
  - "«حَلَفْتُ» فعل وفاعل، والمقسَم عليه في البيت التالي: «لَئِنْ كُنْتَ قَدْ بُلِّغْتَ عَنِّي خِيَانَةً لَمُبْلِغُكَ الْوَاشِي أَغَشُّ وَأَكْذَبُ»، فاللام في «لئن» موطّئة للقسم، واللام في «لَمُبلغك» واقعة في جوابه."
  - "«فَلَمْ أَتْرُكْ لِنَفْسِكَ رِيبَةً» معطوفة بالفاء، و«ريبةً» مفعول به."
  - "«وَلَيْسَ وَرَاءَ اللَّهِ لِلْمَرْءِ مَذْهَبُ»: «ليس» فعل ناقص، و«مذهبُ» اسمها مؤخر، و«للمرء» خبرها مقدّم، و«وراءَ» ظرف متعلق بالخبر. والجملة حالية أو مستأنفة."
morphology:
  - "«رِيبَة» على «فِعْلة» من «راب يريب»."
  - "«مَذْهَب» اسم مكان على «مَفْعَل» من «ذهب»."
  - "«وَرَاء» ظرف مكان معرب منصوب، وهو هنا مجاز عن الرتبة لا عن المكان."
rhetoric:
  thesis: "يجعل اليمين بالله نهاية كل حجة: ليس فوقها شيء يُحلف به ولا مرجع يُلجأ إليه، فإن لم تُقبل فلا سبيل إلى غيرها. والعجز حكمة تامة تنفصل عن البيت وتُروى وحدها."
  devices:
    - title: "إرسال المثل في «وَلَيْسَ وَرَاءَ اللَّهِ لِلْمَرْءِ مَذْهَبُ»"
      text: "العجز كلام تامّ يصلح أن يُتمثّل به في غير موضعه. ويحكي ابن رَشِيق عن الحاتمي أن حمّادًا الراوية سئل بأي شيء فُضّل النابِغة، فقال: «إن النابغة إن تمثلت ببيت من شعره اكتفيت به»، وأنشد هذا البيت، ثم قال: «بل لو تمثلت بنصف بيت من شعره اكتفيت به، وهو قوله ليس وراء الله للمرء مذهب» [@ibn-rashiq، ج1 ص282]. وانظر مفهوم [المثل](/concepts/al-mathal/)."
    - title: "المجاز في «وَرَاءَ اللَّهِ»"
      text: "«وراء» في الأصل للمكان، وجعلها هنا للرتبة: لا شيء أعلى من الله يُحتكم إليه. وبهذا صار القسم بالله آخر الأدلة، والشكّ بعده لا وجه له."
    - title: "تتمة الصدر المشترك"
      text: "الصدر نفسه في العينية ختمه بحجة من خُلُق الحالف: «وَهَلْ يَأْثَمَنْ ذُو إِمَّةٍ وَهْوَ طَائِعُ»، وهنا ختمه بحجة من عظمة المحلوف به. فاليمين واحدة، والدليل عليها مختلف."
  connection: "ثم يأتي بالمقسَم عليه: لئن بُلّغت عني خيانة فالذي بلّغك أغشّ وأكذب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "حَلَفْ تُ / فَلَمْ أَتْ رُكْ / لِنَفْ سِ / كَ رِيبَتَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَلَيْ سَ / وَرَاءَلْ لَا / هِ لِلْمَرْ / ءِ مَذْهَبُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر، والأولى في العجز، فصارت «فعولُ» [@atiq، ص29]. ويُنطق لفظ الجلالة بمدّ اللام «اللَّاه»."
variants:
