first: "أَرَوَاحٌ مُوَدِّعٌ أَمْ بُكُورُ"
second: "لَكَ فَاعْمِدْ لِأَيِّ حَالٍ تَصِيرُ"
meaning: "يسأل نفسه: أترحل عن الدنيا في المساء مودِّعًا أم في الصباح؟ أي ساعة كان رحيلك، فاقصد الحال التي ستصير إليها بعده، واعمل لها. وبهذا يشرحه أبو الفَرَج: «يريد: أرواحٌ تودّعك فيه أم بكورٌ؟ أيّهما تريد؟ فاعمد للذي تصير إليه من أمر آخرتك» [@aghani-dk، ج2 ص152]."
vocabulary:
  - term: "رَوَاحٌ"
    text: "السير في آخر النهار، وهو ضد الغُدُوّ."
  - term: "مُوَدِّعٌ"
    text: "يودِّع من يتركهم، أي رحيل لا عودة بعده."
  - term: "بُكُورُ"
    text: "الخروج في أول النهار."
  - term: "فَاعْمِدْ"
    text: "فاقصِدْ."
context: "مطلع القصيدة، وهو أول ما يذكره ابن سَلّام وابن قُتَيْبة حين يعدّان غرر عَدِيّ [@ibn-sallam، ج1 ص140] [@ibn-qutayba، ج1 ص219]. وفي رواية ابن الكَلْبِيّ عند الطَّبَرِيّ أن عَدِيًّا قالها في حبس النُّعْمان، «يذكره فيها الموت» [@tabari، ج2 ص198]. فالمطلع يبدأ بالموت قبل أن يذكر ملكًا واحدًا: الشاعر يعظ نفسه أولًا، ثم يعظ الملك الذي حبسه."
syntax:
  - "«أَرَوَاحٌ» الهمزة للاستفهام، و«رواحٌ» مبتدأ، وجاز الابتداء بالنكرة لأنها في سياق الاستفهام وموصوفة بـ«مُوَدِّعٌ»."
  - "«أَمْ» متصلة معادِلة للهمزة، و«بُكُورُ» معطوف على «رواح»، و«لَكَ» متعلق بمحذوف خبر عن المتعاطفين: أرواحٌ لك أم بكور؟"
  - "«فَاعْمِدْ» فعل أمر، والفاعل ضمير المخاطب، و«لِأَيِّ حَالٍ» جار ومجرور متعلق به، وجملة «تَصِيرُ» صفة لـ«حال»، والعائد محذوف تقديره: تصير إليها."
morphology:
  - "«رَوَاح» مصدر «راح يروح» على «فَعَال»، و«بُكُور» مصدر «بكَر يبكُر» على «فُعُول»."
  - "«مُوَدِّع» اسم فاعل من «ودَّع» على «مُفَعِّل»، والتضعيف للتكثير والتوكيد."
  - "«اعْمِدْ» أمر من «عَمَدَ يَعْمِدُ»، وهمزته همزة وصل تسقط في الدرج: «فَاعْمِدْ»."
rhetoric:
  thesis: "لا يسأل الشاعر: أترحل أم لا؟ فالرحيل عنده واقع، وإنما يسأل عن ساعته، ثم يصرف السؤال كله إلى المصير. فالبيت يقطع الطريق على الأمل في البقاء قبل أن يبدأ الكلام."
  devices:
    - title: "الكناية في «رَوَاحٌ مُوَدِّعٌ»"
      text: "الرحيل الذي يودِّع صاحبه فيه الناس هو الموت. لم يسمّه، بل ذكر ما يلازمه: سفر بلا رجعة. وهذه الكناية عند عبد القاهر الجُرْجانيّ: أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "الطباق بين «رَوَاحٌ» و«بُكُورُ»"
      text: "الطباق: الجمع بين ضدين. والمساء والصباح طرفا اليوم، فكأنه يقول: في أي ساعة من ساعاتك يأتي الرحيل؟ والجواب المضمر: في أيها شاء، فلا أمان في ساعة."
    - title: "الالتفات إلى النفس في «لَكَ فَاعْمِدْ»"
      text: "يخاطب نفسه كأنها رجل آخر، وهي عادة الشعراء في الوعظ: يبدأ الواعظ بنفسه، فيصير خطابه للملك بعد ذلك أقل جفاء. وهي قراءتنا."
    - title: "التصريع"
      text: "اتفاق آخر الشطرين في الرويّ: «بُكُورُ» و«تَصِيرُ»، فيعلن المطلع رويّ القصيدة."
  connection: "بعد أن وعظ نفسه، يلتفت إلى من يشمت به ويعيّره بالحبس: «أَيُّهَا الشَّامِتُ الْمُعَيِّرُ بِالدَّهْرِ»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الراء المضمومة، والقافية مطلقة موصولة بالواو"
  scansion: "أَرَوَاحُنْ / مُوَدْدِعُنْ / أَمْ بُكُورُو = فَعِلاتن / مُتَفْعِلُن / فاعلاتن — لَكَ فَعْمِدْ / لِأَيْيِ حَا / لِنْ تَصِيرُو = فَعِلاتن / مُتَفْعِلُن / فاعلاتن"
  note: "في التفعيلة الأولى من الشطرين «فَعِلاتن» بدل «فاعلاتن»، وفي الثانية «مُتَفْعِلُن» بدل «مستفعلن»: سقط الثاني الساكن، وهذا هو الخَبْن، وهو كثير في الخفيف."
