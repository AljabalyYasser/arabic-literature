explained: false
first: "مَنْ رَأَيْتَ الْمَنُونَ خَلَّدْنَ أَمْ مَنْ"
second: "ذَا عَلَيْهِ مِنْ أَنْ يُضَامَ خَفِيرُ"
vocabulary:
  - term: "الْمَنُونَ"
    text: "الموت، وجمع الضمير بعده «خلّدن» لأنه أراد المنايا. قال صاحب اللسان: «وَجَعَلَهُ عَدِيُّ بْنُ زَيْدٍ جَمْعًا»، وأنشد البيت: «مَنْ رَأَيْتَ الْمَنُونَ عَزَّيْنَ» [@lisan، ج13 ص415]."
  - term: "يُضَامَ"
    text: "يُظلم ويُقهر."
  - term: "خَفِيرُ"
    text: "مُجير يحميه."
