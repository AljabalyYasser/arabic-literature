first: "وَأَخُو الْحَضْرِ إِذْ بَنَاهُ وَإِذْ دِجْـ"
second: "ـلَةُ تُجْبَى إِلَيْهِ وَالْخَابُورُ"
meaning: "وأين صاحب الحضر، حين بنى حصنه، وحين كان خراج ما على دجلة والخابور من الأرض يُحمل إليه؟ ذهب هو أيضًا. والحضر حصن في أرض الجزيرة، والخابور نهر كبير فيها يصبّ في الفرات."
vocabulary:
  - term: "أَخُو الْحَضْرِ"
    text: "صاحب الحضر وملكه، وهو عند ابن الكَلْبِيّ الضَّيْزَن [@tabari، ج2 ص50]."
  - term: "تُجْبَى"
    text: "يُجمع خراجها ويُحمل."
  - term: "الْخَابُورُ"
    text: "يقول محققو «الأغاني»: «اسم لنهر كبير بين رأس عين والفرات من أرض الجزيرة» [@aghani-dk، ج2 ص139، الحاشية]."
context: "بعد ملوك فارس والروم يأتي بملك من العرب، قريب من الحِيرة وأهلها. يروي الطَّبَرِيّ عن ابن الكَلْبِيّ أن سابور حاصر الضَّيْزَن في حصنه «أربع سنين، لا يقدر على هدمه ولا على الوصول إلى الضيزن» [@tabari، ج2 ص48]، ثم دلّته ابنة الضَّيْزَن على طريق الحصن ففتحه وقتل أباها، ثم يقول: «وإياه عنى عدي بن زيد بقوله»، وينشد البيت وبيتين بعده [@tabari، ج2 ص50]. والخبر أسطوري الملامح، وفيه طلسم يهدم السور، لكنه يفسّر لماذا اختار عَدِيّ هذا الملك: حصن لم يُفتح بالقوة، وفتحه الدهر."
syntax:
  - "«وَأَخُو الْحَضْرِ» معطوف على «كسرى» في قوله قبله: «أين كسرى»، فالتقدير: وأين أخو الحضر؟ و«أخو» مرفوع بالواو لأنه من الأسماء الخمسة، و«الحضر» مضاف إليه."
  - "«إِذْ بَنَاهُ» «إذ» ظرف لما مضى من الزمان، و«بناه» فعل وفاعل ومفعول، والجملة في محل جر بإضافة «إذ» إليها."
  - "«وَإِذْ دِجْلَةُ تُجْبَى إِلَيْهِ» «دجلةُ» مبتدأ ممنوع من الصرف للعلمية والتأنيث، وجملة «تُجبى» خبره، و«الْخَابُورُ» معطوف على «دجلة»."
morphology:
  - "«تُجْبَى» مضارع «جَبَى» مبنيًّا للمجهول، وأصل الجباية جمع الخراج."
  - "«بَنَاهُ» من «بَنَى يَبْنِي»، ناقص يائي، وتُشبَع هاؤه في الوزن: «بَنَاهُو»."
rhetoric:
  thesis: "البيت قائمة ملك في سطر: حصن مبني، ونهران يُحمل خراجهما إليه. وما يسكت عنه البيت هو الخاتمة: هذا كله زال. فيترك للقارئ أن يقرأ «أين» المحذوفة في أوله."
  devices:
    - title: "الحذف في «وَأَخُو الْحَضْرِ»"
      text: "حذف «أين» لأنها ذُكرت في البيتين قبله، فصار البيت كأنه سؤال مكرر لا يُنطق. وعبد القاهر الجُرْجانيّ يقول في هذا الباب: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "المجاز في «دِجْلَةُ تُجْبَى إِلَيْهِ وَالْخَابُورُ»"
      text: "النهر لا يُجبى، وإنما يُجبى خراج الأرض التي يسقيها. فذكر النهرين وأراد ما يرتبط بهما من زرع ومال، فصار الملك كأنه يملك الماء نفسه. وهي قراءتنا."
    - title: "«أَخُو الْحَضْرِ»"
      text: "الأخ هنا الملازم للشيء وصاحبه، كما يقال: أخو الحرب. فكأن الملك والحصن قرينان، وكان المنتظر أن يبقى الحصن ببقائه، فهلك وخرب الحصن معًا."
  connection: "يتمّ صورة الحصن في البيت التالي: «شَادَهُ مَرْمَرًا وَجَلَّلَهُ كِلْسًا»، ثم يجعل الطير تسكن أعاليه."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "وَأَخُلْحَضْ / رِإِذْ بَنَا / هُو وَإِذْ دِجْ = فَعِلاتن / مُتَفْعِلُن / فاعلاتن — لَةُ تُجْبَى / إِلَيْهِ وَلْ / خَابُورُو = فَعِلاتن / مُتَفْعِلُن / مفعولن"
  note: "الخَبْن في أكثر التفاعيل، والتشعيث في الضرب: «مفعولن» مكان «فاعلاتن». وتمتد «دِجْلَة» بين الشطرين."
