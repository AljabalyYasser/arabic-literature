explained: false
first: "أَمْ لَدَيْكَ الْعَهْدُ الْوَثِيقُ مِنَ الْأَيْـ"
second: "ـيَامِ أَمْ أَنْتَ جَاهِلٌ مَغْرُورُ"
vocabulary:
  - term: "الْعَهْدُ الْوَثِيقُ"
    text: "الميثاق المحكم، أي: أأعطتك الأيام عهدًا ألا تصيبك؟"
  - term: "مَغْرُورُ"
    text: "مخدوع بسلامته. وفي رواية ابن سَلّام و«الأغاني»: «بَلْ أَنْتَ جَاهِلٌ مَغْرُورُ» [@ibn-sallam، ج1 ص141] [@aghani-dk، ج2 ص138]."
