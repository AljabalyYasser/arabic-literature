explained: false
first: "شَادَهُ مَرْمَرًا وَجَلَّلَهُ كِلْـ"
second: "ـسًا فَلِلطَّيْرِ فِي ذُرَاهُ وُكُورُ"
vocabulary:
  - term: "شَادَهُ"
    text: "رفع بناءه وأحكمه."
  - term: "مَرْمَرًا"
    text: "رخامًا."
  - term: "جَلَّلَهُ كِلْسًا"
    text: "غطّاه بالكلس، وهو عند محققي «الأغاني»: «الصاروج وهي النورة وأخلاطها» [@aghani-dk، ج2 ص139، الحاشية]."
  - term: "ذُرَاهُ"
    text: "أعاليه."
  - term: "وُكُورُ"
    text: "أعشاش، جمع وَكْر: صار الحصن خاليًا تسكنه الطير."
sources:
