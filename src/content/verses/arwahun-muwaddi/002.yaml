first: "أَيُّهَا الشَّامِتُ الْمُعَيِّرُ بِالدَّهْـ"
second: "ـرِ أَأَنْتَ الْمُبَرَّأُ الْمَوْفُورُ"
meaning: "يا من يشمت بي ويعيّرني بما صنع الدهر بي من حبس ومحنة: أأنت بريء من نوائب الدهر، سالم لم ينقصك منها شيء، حتى تعيّرني بها؟ و«الموفور» عند أبي الفَرَج: «الذي لم تُصبه نوائبُ الدهر» [@aghani-dk، ج2 ص152]."
vocabulary:
  - term: "الشَّامِتُ"
    text: "الذي يفرح بمصيبة غيره."
  - term: "الْمُعَيِّرُ"
    text: "الذي يجعل المصيبة عيبًا ينسبه إلى صاحبها."
  - term: "بِالدَّهْرِ"
    text: "بما جرّه الدهر عليّ من نوائبه."
  - term: "الْمُبَرَّأُ"
    text: "المعافى السالم."
  - term: "الْمَوْفُورُ"
    text: "«الذي لم تُصبه نوائبُ الدهر» [@aghani-dk، ج2 ص152]."
context: "بيت القصيدة الذي حُفظ وتُمُثّل به. سمع ابن سَلّام يونس بن حبيب يتمثل به وبالبيت الذي بعده، ثم يقول: «لو تمنيت أن أقول شعرًا ما تمنيت إلا هذه» [@ibn-sallam، ج1 ص141]. وبه يبدأ ابن قُتَيْبة ما يختاره منها، ويقول: «وفيها يقول» [@ibn-qutayba، ج1 ص219]، وبه يبدأ المَرْزُبانيّ «القصيدة المشهورة» [@marzubani، ص249]. وفي القصيدة هو مفتاح العظة: من يشمت بالسجين يُسأل أولًا عن نفسه، ثم تأتي الملوك شاهدًا على الجواب."
syntax:
  - "«أَيُّهَا» منادى بحرف نداء محذوف، و«أيّ» نكرة مقصودة مبنية على الضم في محل نصب، و«ها» للتنبيه."
  - "«الشَّامِتُ» نعت لـ«أيّ» مرفوع على لفظه، و«الْمُعَيِّرُ» نعت ثانٍ، و«بِالدَّهْرِ» متعلق بـ«المعيّر»."
  - "«أَأَنْتَ» الهمزة للاستفهام الإنكاري، و«أنت» مبتدأ، و«الْمُبَرَّأُ» خبره، و«الْمَوْفُورُ» خبر ثانٍ."
morphology:
  - "«الشَّامِت» اسم فاعل من «شَمِتَ يَشْمَتُ» على «فاعِل»."
  - "«الْمُعَيِّر» اسم فاعل من «عَيَّرَ» على «مُفَعِّل»، و«الْمُبَرَّأ» اسم مفعول من «بَرَّأَ» على «مُفَعَّل»."
  - "«الْمَوْفُور» اسم مفعول من «وَفَرَ» على «مَفْعُول»: الشيء التامّ الذي لم يُنقص منه."
rhetoric:
  thesis: "يقلب الشاعر موقفه: كان السجين هو المعيَّر، فصار هو السائل. والسؤال لا يحتاج إلى جواب، لأن جوابه معروف: لا أحد بريء من الدهر. فالشماتة نفسها جهل."
  devices:
    - title: "الاستفهام الإنكاري في «أَأَنْتَ الْمُبَرَّأُ الْمَوْفُورُ»"
      text: "لا يطلب جوابًا، بل ينفي: لست مبرّأً ولا موفورًا. وصيغة السؤال أقوى من النفي الصريح، لأنها تُلجئ الشامت إلى أن يجيب نفسه بنفسه."
    - title: "الاستعارة في «الْمَوْفُورُ»"
      text: "الموفور في الأصل المال التام الذي لم يُنقص منه، فاستعاره للإنسان الذي لم تنقصه النوائب، كأن الدهر يأخذ من الناس كما يؤخذ من المال. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "المجاز في «الْمُعَيِّرُ بِالدَّهْرِ»"
      text: "لا يعيّره بالدهر نفسه، بل بما فعله الدهر به. فنسب الحادثة إلى الزمن الذي وقعت فيه، كما تنسب العرب المصائب إلى الدهر. وهي قراءتنا."
  connection: "يتمّ السؤال في البيت التالي: «أَمْ لَدَيْكَ الْعَهْدُ الْوَثِيقُ مِنَ الْأَيَّامِ»، ثم يأتي بالشاهد: الملوك الذين لم يخلّدهم الموت."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "أَيْيُهَشْشَا / مِتُلْمُعَيْ / يِرُبِدْدَهْ = فاعلاتن / مُتَفْعِلُن / فَعِلاتن — رِأَأَنْتَلْ / مُبَرْرَأُلْ / مَوْفُورُو = فَعِلاتن / مُتَفْعِلُن / مفعولن"
  note: "في التفعيلة الأخيرة من العجز «مفعولن» مكان «فاعلاتن»: سقط أول الوتد، وهذا هو التشعيث، وهو جائز في ضرب الخفيف. وتمتد الكلمة «بِالدَّهْرِ» بين الشطرين، فهو بيت مُدْمَج."
