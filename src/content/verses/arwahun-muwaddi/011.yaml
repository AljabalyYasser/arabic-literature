explained: false
first: "فَارْعَوَى قَلْبُهُ فَقَالَ وَمَا غِبْـ"
second: "ـطَةُ حَيٍّ إِلَى الْمَمَاتِ يَصِيرُ"
vocabulary:
  - term: "ارْعَوَى"
    text: "رجع وكفّ عمّا كان فيه، و«ارْعَوَى فُلَانٌ عَنِ الْجَهْلِ ... وَهُوَ نُزُوعُه وحُسْنُ رُجوعه» [@lisan، ج14 ص328]."
  - term: "غِبْطَةُ"
    text: "ما يُغبط عليه المرء ويُتمنّى مثله، و«الغِبْطةُ: حُسْنُ الحالِ» [@lisan، ج7 ص358]."
sources:
