first: "وَتَبَيَّنْ رَبَّ الْخَوَرْنَقِ إِذْ أَشْـ"
second: "ـرَفَ يَوْمًا وَلِلْهُدَى تَفْكِيرُ"
meaning: "وتأمّل خبر صاحب الخَوَرْنَق حين أشرف من قصره يومًا على ما يملك، فتفكّر، والتفكير طريق إلى الهدى. والخَوَرْنَق قصر بظاهر الحِيرة."
vocabulary:
  - term: "تَبَيَّنْ"
    text: "تأمّلْ وتثبّتْ حتى يتضح لك أمره."
  - term: "رَبَّ الْخَوَرْنَقِ"
    text: "صاحب الخَوَرْنَق، وهو في خبر ابن الكَلْبِيّ ملك من ملوك الحِيرة جلس يومًا «في مجلسه من الخورنق، فأشرف منه على النجف» [@tabari، ج2 ص67]."
  - term: "أَشْرَفَ"
    text: "نظر من مكان عالٍ."
context: "يروي الطَّبَرِيّ عن هشام بن الكَلْبِيّ أن هذا الملك أشرف من الخَوَرْنَق في يوم من أيام الربيع، فأعجبه ما رأى من الخضرة والأنهار، فسأل صاحبه: هل رأيت مثل هذا؟ فقال: «لا، لو كان يدوم!»، ثم دلّه على ما يدوم، «فترك ملكه من ليلته ولبس المسوح، وخرج مستخفيا هاربا لا يعلم به»، «وفي ذلك يقول عدي بن زيد العبادي»، وينشد هذا البيت وأربعة بعده [@tabari، ج2 ص67–68]. فالبيت بداية حكاية في خمسة أبيات تختم القصيدة: ملك واحد فهم ما لم يفهمه الشامت."
syntax:
  - "«وَتَبَيَّنْ» فعل أمر، والفاعل ضمير المخاطب، و«رَبَّ» مفعول به، و«الْخَوَرْنَقِ» مضاف إليه."
  - "«إِذْ أَشْرَفَ يَوْمًا» «إذ» ظرف لما مضى متعلق بـ«تبيّن»، أي: تبيّن حاله حين أشرف، والجملة بعدها في محل جر بالإضافة، و«يومًا» ظرف زمان."
  - "«وَلِلْهُدَى تَفْكِيرُ» جملة معترضة: «تفكيرُ» مبتدأ مؤخر، و«للهدى» جار ومجرور متعلق بمحذوف خبر مقدم."
morphology:
  - "«تَبَيَّنْ» أمر من «تَبَيَّنَ» على «تَفَعَّل»، وهو طلب التثبت والتأمل."
  - "«أَشْرَفَ» على «أَفْعَل» من الشَّرَف، وهو المكان العالي."
  - "«تَفْكِير» مصدر «فَكَّرَ» على «تَفْعِيل»."
rhetoric:
  thesis: "بعد ملوك هلكوا وهم لا يدرون، يأتي بملك نظر ففهم. والجملة الصغيرة «وللهدى تفكير» هي حكمة القصيدة كلها، وضعها في وسط الحكاية قبل أن تكتمل."
  devices:
    - title: "التقديم في «وَلِلْهُدَى تَفْكِيرُ»"
      text: "قدّم «للهدى» على «تفكير» وحقه التأخير، فصار الهدى أول ما يسمعه القارئ، والتفكير وسيلته. وعبد القاهر الجُرْجانيّ يقول في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "الاعتراض"
      text: "وضع جملة «وللهدى تفكير» بين «إذ أشرف يومًا» وبين ما رآه في البيت التالي، فقطع الحكاية بحكمتها قبل أن تنتهي. فالقارئ يعرف النتيجة قبل أن يعرف ما رأى الملك."
    - title: "الإيجاز في «إِذْ أَشْرَفَ يَوْمًا»"
      text: "حكاية ملك وقصر ونظرة اختُصرت في ثلاث كلمات، لأن السامعين في الحِيرة يعرفون الخبر. وهي قراءتنا."
  connection: "يصف في البيت التالي ما رآه الملك فأعجبه: «سَرَّهُ حَالُهُ وَكَثْرَةُ مَا يَمْلِكُ وَالْبَحْرُ مُعْرِضًا وَالسَّدِيرُ»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "وَتَبَيْيَنْ / رَبْبَلْخَوَرْ / نَقِ إِذْ أَشْ = فَعِلاتن / مستفعلن / فَعِلاتن — رَفَ يَوْمَنْ / وَلِلْهُدَى / تَفْكِيرُو = فَعِلاتن / مُتَفْعِلُن / مفعولن"
  note: "الخَبْن في «فَعِلاتن» و«مُتَفْعِلُن»، والتشعيث في الضرب. وتمتد «أَشْرَفَ» بين الشطرين."
