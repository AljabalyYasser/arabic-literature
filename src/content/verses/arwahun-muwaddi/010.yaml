explained: false
first: "سَرَّهُ حَالُهُ وَكَثْرَةُ مَا يَمْـ"
second: "ـلِكُ وَالْبَحْرُ مُعْرِضًا وَالسَّدِيرُ"
vocabulary:
  - term: "حَالُهُ"
    text: "وفي «الأغاني»: «سَرَّهُ مَالُهُ» [@aghani-dk، ج2 ص139]."
  - term: "الْبَحْرُ"
    text: "يريد الفرات، وكان الخورنق مشرفًا عليه «مما يلي المشرق» [@tabari، ج2 ص67]."
  - term: "مُعْرِضًا"
    text: "متسعًا ظاهرًا. ويقول محققو «الأغاني»: «مُعرِض بمعنى متسع» [@aghani-dk، ج2 ص139، الحاشية]."
  - term: "السَّدِيرُ"
    text: "يقول محقق «الشعر والشعراء»: «السدير: نهر، وقيل قصر» [@ibn-qutayba، ج1 ص220، الحاشية]."
