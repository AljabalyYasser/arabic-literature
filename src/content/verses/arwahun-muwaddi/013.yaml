first: "ثُمَّ أَضْحَوْا كَأَنَّهُمْ وَرَقٌ جَفْـ"
second: "ـفَ فَأَلْوَتْ بِهِ الصَّبَا وَالدَّبُورُ"
meaning: "ثم صار هؤلاء الملوك، بعد ملكهم ونعمتهم، كورق يبس على شجره، فذهبت به ريح الصَّبا وريح الدَّبُور كل مذهب، فلم يبق منه شيء. ويقول محققو «الأغاني»: «ألوت به أي ذهبت به» [@aghani-dk، ج2 ص139، الحاشية]."
vocabulary:
  - term: "أَضْحَوْا"
    text: "صاروا."
  - term: "جَفَّ"
    text: "يبس."
  - term: "أَلْوَتْ بِهِ"
    text: "ذهبت به."
  - term: "الصَّبَا وَالدَّبُورُ"
    text: "ريحان متقابلتان: الصَّبا تهب من المشرق، والدَّبُور تهب من المغرب."
context: "خاتمة القصيدة عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص220]، وعند أبي الفَرَج في خبر خالد بن صَفْوان [@aghani-dk، ج2 ص139]، وبها يختم الطَّبَرِيّ أبيات صاحب الخَوَرْنَق [@tabari، ج2 ص68]، والمَرْزُبانيّ «القصيدة المشهورة» [@marzubani، ص250]. فهي الصورة التي تجمع ملوك القصيدة كلهم: كسرى وسابور وملوك الروم وصاحب الحضر وصاحب الخَوَرْنَق، يصيرون شيئًا واحدًا."
syntax:
  - "«ثُمَّ» حرف عطف يفيد الترتيب مع التراخي، و«أَضْحَوْا» فعل ماض ناقص بمعنى «صاروا»، وواو الجماعة اسمه."
  - "«كَأَنَّهُمْ وَرَقٌ» «كأنّ» حرف تشبيه، والضمير اسمها، و«ورقٌ» خبرها، وجملة «جَفَّ» صفة لـ«ورق»، وجملة «كأنهم...» في محل نصب خبر «أضحى»."
  - "«فَأَلْوَتْ بِهِ الصَّبَا» الفاء عاطفة، و«ألوت» فعل ماض والتاء للتأنيث، و«به» متعلق به، والضمير يعود على الورق، و«الصَّبا» فاعل، و«الدَّبُورُ» معطوف عليه."
morphology:
  - "«أَضْحَوْا» من «أَضْحَى» على «أَفْعَل»، وأصله «أَضْحَيُوا»، فحذفت الياء لالتقاء الساكنين بعد قلبها ألفًا، وبقي الفتح قبل الواو."
  - "«جَفَّ» ماض مضعّف، أصله «جَفِفَ» فأُدغم المثلان."
  - "«أَلْوَتْ» من «أَلْوَى» على «أَفْعَل»، و«الدَّبُور» على «فَعُول»."
rhetoric:
  thesis: "يختم الشاعر القصيدة بصورة لا بحكمة: لا يقول إن الملك يزول، بل يُري القارئ ورقًا يابسًا تتقاذفه ريحان. فالحكمة التي قالها في «وللهدى تفكير» تصير هنا مشهدًا يُرى."
  devices:
    - title: "التمثيل في «كَأَنَّهُمْ وَرَقٌ جَفَّ فَأَلْوَتْ بِهِ الصَّبَا وَالدَّبُورُ»"
      text: "لا يشبّه الملوك بالورق في صفة واحدة، بل يشبّه هيئة كاملة بهيئة: ملك كان أخضر نضرًا، ثم يبس، ثم تفرق في كل جهة. وهذا التشبيه المركب هو التمثيل عند عبد القاهر الجُرْجانيّ، الذي يقول: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. وفيه حركة الريح بالورق، ويقول عبد القاهر: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "الطباق بين «الصَّبَا» و«الدَّبُورُ»"
      text: "ريحان من جهتين متقابلتين، فلم يذهب الورق في جهة واحدة يمكن تتبعها، بل تفرق في كل جهة. وهذا أبلغ في الفناء من ذكر ريح واحدة."
    - title: "«ثُمَّ أَضْحَوْا»"
      text: "«ثمّ» تدل على مهلة بين النعمة والفناء، و«أضحى» في أصلها: دخل في الضحى، فكأنهم أصبحوا ذات يوم فإذا هم ورق يابس. وهي قراءتنا."
  connection: "آخر القصيدة في رواية ابن قُتَيْبة."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "ثُمْمَ أَضْحَوْ / كَأَنْنَهُمْ / وَرَقُنْ جَفْ = فاعلاتن / مُتَفْعِلُن / فَعِلاتن — فَ فَأَلْوَتْ / بِهِصْصَبَا / وَدْدَبُورُو = فَعِلاتن / مُتَفْعِلُن / فاعلاتن"
  note: "الخَبْن في «مُتَفْعِلُن» و«فَعِلاتن». وتمتد «جَفَّ» بين الشطرين: الفاء الأولى آخر الصدر، والثانية أول العجز."
