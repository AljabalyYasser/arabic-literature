first: "يُلَاقُونَ مِنْهَا فَرْطَ حَدٍّ وَجُرْأَةٍ"
second: "إِذَا لَمْ تُقَوِّمْ دَرْأَهُنَّ الْمَسَاحِلُ"
vocabulary:
  - term: "دَرْأَهُنَّ"
    text: "جموحهن، وأصله العِوَج: «والدَّرْءُ، بِالْفَتْحِ: العَوَجُ فِي الْقَنَاةِ والعَصا وَنَحْوِهَا مِمَّا تَصْلُبُ وتَصْعُبُ إِقامتُه» [@lisan، ج1 ص75]."
  - term: "الْمَسَاحِلُ"
    text: "حدائد اللجام: «واللِّجامُ حَدائِدُ قَدْ يَشْتَبك بعضُها فِي بَعْضٍ، مِنْهَا العِضَادَتانِ والمِسْحَلُ» [@lisan، ج1 ص685]."
