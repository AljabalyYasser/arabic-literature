first: "فَيَوْمًا عُنَاةٌ فِي الْحَدِيدِ يَفُكُّهُمْ"
second: "وَيَوْمًا جِيَادٌ مُلْجَمَاتٌ قَوَافِلُ"
vocabulary:
  - term: "عُنَاةٌ"
    text: "أسرى، جمع عانٍ: «والعَانِي الأَسِيرُ» [@lisan، ج15 ص101]."
  - term: "قَوَافِلُ"
    text: "راجعة، من القُفول وهو الرجوع؛ وفي اللسان: «واشتقَّ اسمُ القافِلة مِنْ ذَلِكَ لأَنهم يَقْفُلون» [@lisan، ج11 ص560]."
