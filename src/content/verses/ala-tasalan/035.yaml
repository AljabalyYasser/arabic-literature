explained: false
first: "إِذَا مَا اجْتَلَاهَا مَأْزِقٌ وَتَزَايَلَتْ"
second: "وَأَحْكَمَ أَضْغَانَ الْقَتِيرِ الْغَلَائِلُ"
vocabulary:
  - term: "مَأْزِقٌ"
    text: "«والمَأْزِق: الْمَوْضِعُ الضيِّق الَّذِي يَقْتَتِلُونَ فِيهِ» [@lisan، ج10 ص5]."
  - term: "الْقَتِيرِ"
    text: "«والقَتِيرُ رؤوس الْمَسَامِيرِ فِي الدِّرْعِ» [@lisan، ج5 ص72]."
  - term: "أَضْغَانَ"
    text: "يقول المحقق: «ما تزايل من المسامير ولم يلتئم» [@diwan-labid، ص263]."
  - term: "الْغَلَائِلُ"
    text: "«وغَلائل الدُّروع: مَسَامِيرُهَا المُدخَلة فِيهَا، الْوَاحِدُ غَلِيل؛ قَالَ لَبِيدٌ» بعجز هذا البيت [@lisan، ج11 ص502]."
