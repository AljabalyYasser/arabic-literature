explained: false
first: "تَرُوحُ إِذَا رَاحَ الشَّرُوبُ كَأَنَّهَا"
second: "ظِبَاءُ شَقِيقٍ لَيْسَ فِيهِنَّ عَاطِلُ"
vocabulary:
  - term: "الشَّرُوبُ"
    text: "«ورَجلٌ شارِبٌ، وشَرُوبٌ وشَرّابٌ وشِرِّيبٌ: مُولَع بالشَّرابِ» [@lisan، ج1 ص488]."
  - term: "شَقِيقٍ"
    text: "يقول المحقق: «اسم مكان، وهو موضع بديار بني سليم» [@diwan-labid، ص264]."
  - term: "عَاطِلُ"
    text: "«العَاطِل مِنَ النِّسَاءِ الَّتِي لَيْسَ فِي عُنُقها حَليٌ» [@lisan، ج11 ص454]."
