explained: false
first: "تُسَاقُ وَأَطْفَالُ الْمُصِيفِ كَأَنَّهَا"
second: "حَوَانٍ عَلَى أَطْلَائِهِنَّ مَطَافِلُ"
vocabulary:
  - term: "الْمُصِيفِ"
    text: "«وأَصافَتِ الناقةُ، وَهِيَ مُصِيفٌ ومِصْيافٌ: نُتِجَتْ فِي الصَّيْف» [@lisan، ج9 ص201]."
  - term: "حَوَانٍ"
    text: "عاطفات. وفي اللسان في هذا البيت: «أَي كأَنَّها إِبل عَطَفت عَلَى وَلَدِهَا» [@lisan، ج14 ص203]."
  - term: "أَطْلَائِهِنَّ"
    text: "«الْجَوْهَرِيُّ: الطَّلا الْوَلَدُ مِنْ ذواتِ الظِّلْفِ والخُفِّ» [@lisan، ج15 ص12]."
  - term: "مَطَافِلُ"
    text: "«والمُطْفِل: ذَاتُ الطِّفْل مِنَ الإِنسان وَالْوَحْشُ مَعَهَا طِفْلُها» [@lisan، ج11 ص402]."
