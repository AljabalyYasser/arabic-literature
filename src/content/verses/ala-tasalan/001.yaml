  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "أَلَا تَسْ / أَلَانِلْ مَرْ / ءَ مَاذَا / يُحَاوِلُو = فعولن / مفاعيلن / فعولن / مفاعلن — أَنَحْبُنْ / فَيُقْضَى أَمْ / ضَلَالُنْ / وَبَاطِلُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "عروض الطويل «تأتي مقبوضة دائمًا» [@atiq، ص29]، أي «مفاعلن» بحذف الخامس الساكن، وضرب القصيدة مقبوض مثلها، فيلزم في سائر أبياتها [@atiq، ص28]."
