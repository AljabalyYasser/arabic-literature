first: "أَلَا تَسْأَلَانِ الْمَرْءَ مَاذَا يُحَاوِلُ"
second: "أَنَحْبٌ فَيُقْضَى أَمْ ضَلَالٌ وَبَاطِلُ"
meaning: "سَلا يا صاحبيّ هذا الإنسان الساعي في الدنيا: ما الذي يطلبه بكل هذا الجهد؟ أهو نذر أوجبه على نفسه فلا بد أن يقضيه، أم هو ضلال وباطل؟ وفي الخزانة: «يَقُول اسألوا هَذَا الْحَرِيص على الدُّنْيَا عَن هَذَا الَّذِي هُوَ فِيهِ أهوَ نذرٌ نَذره على نَفسه فَرَأى أَنه لابد من فعله أم هُوَ ضلال وباطل» [@khizana، ج6 ص149]. والجواب مضمر في السؤال: هو باطل، والقصيدة كلها تفصيل لذلك."
vocabulary:
  - term: "يُحَاوِلُ"
    text: "يطلب ويدبّر. في الخزانة: «والمحاولة: اسْتِعْمَال الْحِيلَة وَهِي الحذق فِي تَدْبِير الْأُمُور» [@khizana، ج6 ص149]، وفي اللسان: «والاحْتِيالُ والمُحَاوَلَة: مُطَالَبَتُكَ الشيءَ بالحِيَل»، واستشهد بالبيت [@lisan، ج11 ص187]."
  - term: "نَحْبٌ"
    text: "النذر هنا. في الخزانة أن للنحب معاني، و«المُرَاد هُنَا النّذر وَهُوَ مَا ينذره الْإِنْسَان على نَفسه وَيُوجب عَلَيْهَا فعله على كل حَال» [@khizana، ج6 ص149]."
  - term: "الْمَرْءَ"
    text: "الإنسان الساعي في الدنيا عامة. ويذكر البغدادي أن اللام فيه للعهد أو للجنس، وأن ابن المستوفي قال: «يَعْنِي بِالْمَرْءِ نَفسه وَالنَّاس فِيهِ سَوَاء» [@khizana، ج6 ص149]."
context: "مطلع القصيدة، وفيه سؤالها الأكبر: ما قيمة سعي الإنسان؟ وعليه تُبنى الأبيات بعده: حبائل الموت، والعمل الذي لا ينقطع، والآباء الذين لم يبق منهم أحد، ثم الحكم الجامع في البيت التاسع. وهو عند البغدادي «أول قصيدة للبيد» [@khizana، ج6 ص150]، وفي بعض الروايات يتقدمه البيت التاسع [@khizana، ج2 ص255]. وهو من شواهد النحويين في «ماذا»، عند سيبويه ومن بعده [@khizana، ج6 ص146]."
syntax:
  - "«أَلَا» حرف استفتاح وتنبيه [@khizana، ج6 ص148]، و«تَسْأَلَانِ» مضارع مرفوع بثبوت النون، والألف فاعل، و«الْمَرْءَ» مفعول به أول."
  - "«مَاذَا»: «ذا» عند سيبويه اسم موصول بمعنى الذي، وبيّنه الأعلم وابن السيرافي: «ما» استفهام مبتدأ، و«ذا» خبره، و«يُحَاوِلُ» صلته، أي: ما الذي يحاوله؟ ودليلهما رفع «نحبٌ» بعده، ولو كانت «ماذا» كلمة واحدة منصوبة بـ«يحاول» لوجب «أنحبًا ... أم ضلالًا» [@khizana، ج6 ص146]. وفي المسألة أقوال أخرى، منها أن «ذا» زائدة [@khizana، ج6 ص146–147].وجملة «مَاذَا يُحَاوِلُ» في موضع المفعول الثاني لـ«تسألان»، عُلّق عنها العمل بالاستفهام [@khizana، ج6 ص149]."
  - "«أَنَحْبٌ»: الهمزة للاستفهام، و«نَحْبٌ» بدل من «ما»، أو خبر لمبتدأ محذوف تقديره: أهو نحب [@khizana، ج6 ص148]. و«أَمْ» متصلة تعادل الهمزة، و«ضَلَالٌ» معطوف على «نحب»، و«بَاطِلُ» معطوف على «ضلال»."
  - "«فَيُقْضَى»: روي مبنيًّا للمفعول ومبنيًّا للفاعل «فيَقضي»، والجملة خبر لمبتدأ محذوف: هو يُقضى، أي النحب، أو هو يَقضي، أي المرء، والفاء للاستئناف [@khizana، ج6 ص149]."
morphology:
  - "«تَسْأَلَانِ» مضارع «سَأَلَ» المهموز العين، مسند إلى ألف الاثنين؛ والخطاب لصاحبين، وقيل لواحد على عادة العرب، والظاهر عند البغدادي أنه لاثنين [@khizana، ج6 ص148–149]."
  - "«يُحَاوِلُ» مضارع «حاوَلَ» على «فاعَلَ» من الحَوْل، ومنه الحيلة، و«الْحِيلَة أَصْلهَا حولة» قلبت الواو ياء لانكسار ما قبلها [@khizana، ج6 ص149]."
  - "«نَحْب» مصدر على «فَعْل»، و«ضَلَال» مصدر «ضَلَّ» على «فَعَال»، و«بَاطِل» اسم فاعل من «بَطَلَ»."
rhetoric:
  thesis: "سؤال يعرف السائل جوابه، يفتتح به القصيدة ليجعل السامع شريكًا في الحكم على سعي الإنسان."
  devices:
    - title: "الاستفهام وتقديم الاسم"
      text: "«أَنَحْبٌ فَيُقْضَى أَمْ ضَلَالٌ»: بدأ بعد الهمزة بالاسم لا بالفعل، فالسعي ثابت لا شك فيه، والسؤال عن حقيقته: أنذرٌ هو أم ضلال؟ وهذا ما يقرره عبد القاهر الجُرْجانيّ في الاستفهام بالهمزة: إذا بدأت بالفعل «كان الشكُّ في الفِعل نَفْسِه»، وإذا بدأت بالاسم «كان الشكُّ في الفاعِل مَنْ هوَ» [@dalail، ص111]. والسؤال هنا ليس طلبًا لعلم، بل تنبيه على أن الجواب الثاني هو الصحيح."
    - title: "المقابلة بين الطرفين"
      text: "«نَحْبٌ فَيُقْضَى» و«ضَلَالٌ وَبَاطِلُ»: طرف له غاية تُبلغ، وطرف لا غاية له. وجعل الطرف الثاني كلمتين متعاطفتين، فثقلت كفته في اللفظ كما ثقلت في المعنى."
    - title: "الخطاب للاثنين"
      text: "«تَسْأَلَانِ»: يخاطب صاحبين على عادة الشعراء، فيجعل الحكمة حوارًا لا وعظًا مباشرًا."
  connection: "ثم يصف ما ينتظر هذا الساعي: حبائل الموت منصوبة في طريقه، فإن أخطأته أفناه الهرم."
