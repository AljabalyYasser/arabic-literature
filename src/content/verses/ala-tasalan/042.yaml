explained: false
first: "تَظَلُّ رَوَايَاهُمْ تَبَرَّضْنَ مَنْعِجًا"
second: "وَلَوْ وَرَدَتْهُ وَهْوَ رَيَّانُ سَائِلُ"
vocabulary:
  - term: "رَوَايَاهُمْ"
    text: "إبل الماء: «والرَّاوِيَةُ المَزادة فِيهَا الْمَاءُ، وَيُسَمَّى الْبَعِيرُ رَاوِيَة عَلَى تَسْمِيَةِ الشَّيْءِ بِاسْمِ غَيْرِهِ لِقُرْبِهِ مِنْهُ» [@lisan، ج14 ص346]."
  - term: "تَبَرَّضْنَ"
    text: "أخذن ماءه قليلًا قليلًا لكثرتهن، من البَرْض: «الْجَوْهَرِيُّ: البَرْضُ الْقَلِيلُ» [@lisan، ج7 ص117]."
  - term: "مَنْعِجًا"
    text: "موضع [@lisan، ج2 ص381]."
