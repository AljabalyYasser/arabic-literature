first: "وَكُلُّ أُنَاسٍ سَوْفَ تَدْخُلُ بَيْنَهُمْ"
second: "دُوَيْهِيَةٌ تَصْفَرُّ مِنْهَا الْأَنَامِلُ"
meaning: "وكل قوم ستدخل عليهم لا محالة داهية تصفرّ منها أطراف الأصابع، وهي الموت. وفي الخزانة أنه «أَرَادَ بهَا الْمَوْت وَلَا داهية أعظم مِنْهَا»، والدليل على ذلك «تصفر مِنْهَا الأنامل»، لأن صفرة الأظفار «لَا تكون إِلَّا بِالْمَوْتِ» [@khizana، ج6 ص159]."
vocabulary:
  - term: "دُوَيْهِيَةٌ"
    text: "تصغير داهية، «والداهية: مُصِيبَة الدَّهْر» [@khizana، ج6 ص160]."
  - term: "الْأَنَامِلُ"
    text: "أطراف الأصابع، والمراد هنا الأظفار. وقال الطُّوسِيّ: «إِذا مَاتَ الرجل أَو قتل اصْفَرَّتْ أنامله واسودت أظافره» [@khizana، ج6 ص159]."
  - term: "سَوْفَ"
    text: "«وسوف: هُنَا للتحقيق والتأكيد» [@khizana، ج6 ص161]، لا للتسويف."
context: "بعد الحكم العام «كُلُّ شَيْءٍ مَا خَلَا اللَّهَ بَاطِلُ» يسمّي ما يُبطل الأشياء، لكنه يسمّيه بعلامته لا باسمه. ويرى شوقي ضيف أنه يستمد هنا من مثل قوله تعالى «كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ» [@deif، ج2 ص94]. والبيت من أشهر شواهد النحويين: يستشهد به الكوفيون على مجيء التصغير للتعظيم، وينشده ابن هشام في أربعة مواضع من مغني اللبيب [@khizana، ج6 ص160]."
syntax:
  - "«كُلُّ» مبتدأ، و«أُنَاسٍ» مضاف إليه، وجملة «سَوْفَ تَدْخُلُ ...» خبره."
  - "«بَيْنَهُمْ» ظرف متعلق بـ«تدخل»، و«دُوَيْهِيَةٌ» فاعل «تدخل»، وجملة «تَصْفَرُّ مِنْهَا الْأَنَامِلُ» في موضع رفع صفة لها، و«مِنْهَا» متعلق بـ«تصفرّ»، و«الْأَنَامِلُ» فاعل."
morphology:
  - "«دُوَيْهِيَة» تصغير «داهِيَة» على «فُوَيْعِلة»، والألف الزائدة بعد الحرف الأول تقلب واوًا في التصغير."
  - "«تَصْفَرُّ» مضارع «اصْفَرَّ» على «افْعَلَّ»، وهو بناء الألوان والعيوب."
  - "«الأنامِل» جمع «أُنْمُلة»، و«أُناس» اسم جمع."
rhetoric:
  thesis: "الموت يُذكر ولا يُسمّى: يصغّره اللفظ ويعظّمه المعنى، ويُعرف بأثره في الجسد."
  devices:
    - title: "التصغير للتعظيم"
      text: "«دُوَيْهِيَةٌ»: صغّر الداهية وهي أعظم الدواهي. وللعلماء فيه ثلاثة أقوال يرويها البغدادي: أنه تصغير تعظيم «من بَاب الْكِنَايَة يكنى بالصغر عَن بُلُوغ الْغَايَة فِي الْعظم لِأَن الشَّيْء إِذا جَاوز حَده جانس ضِدّه»؛ وأنه على قدر استهانة الناس بها، أي «يجيئهم مَا يحتقرونه مَعَ أَنه عَظِيم فِي نَفسه» [@khizana، ج6 ص159]؛ وأن «أَصْغَر الْأَشْيَاء قد يفْسد الْأُمُور العظائم» [@khizana، ج6 ص160]. وعلى الأقوال كلها يقوم البيت على المفارقة بين صغر اللفظ وهول المعنى."
    - title: "الكناية"
      text: "«تَصْفَرُّ مِنْهَا الْأَنَامِلُ»: لم يقل «الموت»، بل ذكر ما يلزمه في الجسد، وهي الكناية عند عبد القاهر الجُرْجانيّ: أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. وصفرة الأنامل ردف الموت، فدلّت عليه أبلغ من اسمه."
    - title: "العموم"
      text: "«وَكُلُّ أُنَاسٍ»: يكرر «كل» بعد البيت السابق، فيمتد الحكم من «كل شيء» و«كل نعيم» إلى كل قوم، ثم إلى «كل امرئ» في البيت التالي."
  connection: "ثم ينتقل من الموت إلى ما بعده: كل امرئ سيعلم عمله إذا كُشفت الحسنات والسيئات عند الله."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَكُلْلُ / أُنَاسِنْ سَوْ / فَ تَدْخُ / لُ بَيْنَهُمْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — دُوَيْهِ / يَتُنْ تَصْفَرْ / رُ مِنْهَلْ / أَنَامِلُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ «فعولن» الأولى والثالثة في الصدر، والأولى في العجز، فصارت «فعولُ» [@atiq، ص29]."
variants:
  - reading: "تَصْفَرُّ مِنْهُ الْأَنَامِلُ"
    status: "رواية الخزانة في سياق القصيدة"
    note: "بتذكير الضمير [@khizana، ج2 ص253]."
  - reading: "خُوَيْخِيَةٌ تَصْفَرُّ مِنْهَا الْأَنَامِلُ"
    status: "رواية ابن دُرَيْد، ورواها الطوسي عن أبي عمرو"
    note: "قال ابن دريد: «الخويخية: الداهية»، وهي تصغير الخَوْخة أي الباب الصغير [@khizana، ج6 ص160]، وقال الطوسي في تفسيرها: «ينفتح عَلَيْهِم بابٌ يدْخل مِنْهُ الشَّرّ» [@khizana، ج6 ص161]."
  - reading: "سَوْفَ تَدْخُلُ بَيْتَهُمْ"
    status: "رواية يذكرها المحقق"
    note: "[@diwan-labid، ص257]."
