explained: false
first: "فَلَا قَصَبُ الْبَطْحَاءِ نَهْنَهَ وِرْدَهُمْ"
second: "بِرِيٍّ وَلَا الْعَادِيُّ مِنْهُ الْعُدَامِلُ"
vocabulary:
  - term: "قَصَبُ الْبَطْحَاءِ"
    text: "«وَقَالَ الأَصمعي: قَصَبُ البَطْحاءِ مِياهٌ تَجْرِي إِلى عُيونِ الرَّكايا» [@lisan، ج1 ص676]."
  - term: "نَهْنَهَ"
    text: "كفّ: «النَّهْنَهَةُ: الكَفُّ» [@lisan، ج13 ص550]."
  - term: "الْعَادِيُّ"
    text: "القديم، نسبة إلى عاد؛ ومنه قولهم في البئر الحديثة: «حُفِرت فِي الإِسلام حَدِيثةً وَلَيْسَتْ بعادِيَّةٍ» [@lisan، ج1 ص29]."
  - term: "الْعُدَامِلُ"
    text: "«العُدْمُلُ والعُدْمُلِيُّ والعُدامِلُ والعُدامِليُّ: كلُّ مُسِنٍّ قديمٍ» [@lisan، ج11 ص437]."
