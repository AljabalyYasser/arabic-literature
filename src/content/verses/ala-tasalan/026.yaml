explained: false
first: "وَأَسْرَعَ فِيهَا قَبْلَ ذَلِكَ حِقْبَةً"
second: "رُكَاحٌ فَجَنْبَا نُقْدَةٍ فَالْمَغَاسِلُ"
vocabulary:
  - term: "حِقْبَةً"
    text: "«والحِقْبةُ مِنَ الدَّهر: مُدَّةٌ لَا وَقْتَ لَهَا» [@lisan، ج1 ص326]."
  - term: "رُكَاحٌ"
    text: "موضع؛ يقول المحقق: «موضع تلقاء نقدة من أرض اليمامة» [@diwan-labid، ص261]."
  - term: "نُقْدَةٍ"
    text: "«ونُقْدَةُ، بِالضَّمِّ: اسْمُ مَوْضِعٍ» [@lisan، ج3 ص427]."
  - term: "الْمَغَاسِلُ"
    text: "«والمَغَاسِلُ: مَوَاضِعُ مَعْرُوفَةٌ، وَقِيلَ: هِيَ أَوْدِية قِبَل الْيَمَامَةِ» [@lisan، ج11 ص496]."
