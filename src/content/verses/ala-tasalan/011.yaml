first: "وَكُلُّ امْرِئٍ يَوْمًا سَيَعْلَمُ سَعْيَهُ"
second: "إِذَا كُشِّفَتْ عِنْدَ الْإِلَٰهِ الْمَحَاصِلُ"
meaning: "وكل إنسان سيعرف يومًا حقيقة عمله، حين تُكشف عند الله حصيلة ما قدّم من حسنات وسيئات. وفي الخزانة: «سَعْيه: عمله. والحصائل: الْحَسَنَات والسيئات الَّتِي بقيت لَهُ عِنْد الله تَعَالَى» [@khizana، ج2 ص258]."
vocabulary:
  - term: "سَعْيَهُ"
    text: "عمله [@khizana، ج2 ص258]."
  - term: "الْمَحَاصِلُ"
    text: "ما يبقى للإنسان من عمله. وفي اللسان: «الحاصِل مِنْ كُلِّ شَيْءٍ: مَا بَقِي وثَبَتَ وذَهَب مَا سِوَاهُ، يَكُونُ مِنَ الحِساب والأَعمال وَنَحْوِهَا»، و«حَاصِلُ الشيءِ ومَحْصُولُه: بَقِيَّتُه» [@lisan، ج11 ص153]."
  - term: "كُشِّفَتْ"
    text: "أُظهرت وبُيّنت."
context: "ثالث أبيات الحكمة، وبه يختم الجواب عن سؤال المطلع: الساعي الذي لا يدري «ماذا يحاول» سيعلم سعيه يوم يُحاسب. وهو البيت الذي ارتاب فيه ابن قُتَيْبة: «وهذا البيت الآخر يدلّ على أنه قيل فى الإسلام، وهو شبيه بقول الله تبارك وتعالى وَحُصِّلَ ما فِي الصُّدُورِ أو كان لبيد قبل إسلامه يؤمن بالبعث والحساب، ولعلّ البيت منحول» [@ibn-qutayba، ج1 ص272]. فابن قتيبة يضع احتمالين لا حكمًا: أن البيت قيل في الإسلام، أو أن لبيدًا كان يؤمن بالبعث قبل إسلامه، ثم يختم بـ«لعلّ». ويقول المحقق أحمد شاكر في حاشيته: «أما انتحال البيت فلا دليل عليه»، ويذكر أن ابن عبد البر استدل به على أن القصيدة قيلت بعد إسلامه، وأن ابن حجر ردّ ذلك بخبر عثمان بن مظعون الذي سمعها بمكة، ويرجّح هو «دلالة البيت على أنه كان يؤمن بالبعث مثل غيره من عقلاء الجاهلية» [@ibn-qutayba، ج1 ص272]، وهذا رأي المحقق. أما شوقي ضيف فيجعله دليلًا على إسلامية القصيدة، فلبيد عنده استمدّه «مباشرة» من الآية نفسها [@deif، ج2 ص94]."
syntax:
  - "«كُلُّ» مبتدأ، و«امْرِئٍ» مضاف إليه، و«يَوْمًا» ظرف زمان متعلق بـ«سيعلم»، وجملة «سَيَعْلَمُ سَعْيَهُ» خبر المبتدأ، و«سَعْيَهُ» مفعول به."
  - "«إِذَا» ظرف لما يستقبل من الزمان، متعلق بـ«سيعلم»، وجملة «كُشِّفَتْ ... الْمَحَاصِلُ» في محل جر بإضافة «إذا» إليها، و«الْمَحَاصِلُ» نائب فاعل، و«عِنْدَ الْإِلَهِ» ظرف متعلق بـ«كُشّفت»."
morphology:
  - "«كُشِّفَتْ» ماضٍ مبني للمجهول على «فُعِّلَ»، والتضعيف للتكثير: تُكشف المحاصل كلها واحدًا واحدًا."
  - "«الْمَحَاصِل» جمع «مَحْصَل» أو «مَحْصُول»، من «حَصَلَ» إذا بقي وثبت، و«الحَصَائِل» في الرواية الأخرى جمع «حَصِيلة» [@lisan، ج11 ص153]."
  - "«سَعْي» مصدر «سَعَى»، و«الإِلَه» على «فِعَال» بمعنى مفعول، أي المعبود."
rhetoric:
  thesis: "يوم الحساب في لغة الجاهلي: لا يذكر الجنة والنار، بل علمَ المرء بعمله وكشفَ حصيلته."
  devices:
    - title: "المعنى القرآني"
      text: "«إِذَا كُشِّفَتْ عِنْدَ الْإِلَهِ الْمَحَاصِلُ»: يقرّبه ابن قتيبة من قوله تعالى «وَحُصِّلَ مَا فِي الصُّدُورِ» [@ibn-qutayba، ج1 ص272]، وفي رواية اللسان «إِذَا حُصِّلَتْ ... الْحَصَائِلُ» [@lisan، ج11 ص153] يزداد القرب في اللفظ نفسه. وعلى هذا القرب يقوم الخلاف كله في زمن البيت."
    - title: "التنكير"
      text: "«يَوْمًا»: لم يسمّ اليوم ولم يعرّفه، فبقي مبهمًا معلومًا معًا: كل امرئ يعرف أنه آتٍ ولا يعرف متى."
    - title: "رد العجز إلى الصدر في القصيدة"
      text: "«سَيَعْلَمُ سَعْيَهُ»: يعود إلى سؤال المطلع «مَاذَا يُحَاوِلُ»؛ فالذي لم يعرف في حياته ما يطلب، سيعلم عمله حين لا ينفعه العلم. وبهذا تنغلق دائرة الحكمة قبل الانتقال إلى النعمان."
  connection: "ثم يأتي بالشاهد الحي على هذه الحكمة: النعمان الذي كان له الملك، فليبكه ندماؤه وقينته والسائلات."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَكُلْلُمْ / رِئِنْ يَوْمَنْ / سَيَعْلَ / مُ سَعْيَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — إِذَا كُشْ / شِفَتْ عِنْدَلْ / إِلَاهِلْ / مَحَاصِلُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ «فعولن» الثالثة في الصدر فصارت «فعولُ» [@atiq، ص29]. وأُشبعت ضمة الهاء في «سَعْيَهُ» فصارت واوًا."
