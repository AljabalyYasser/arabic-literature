explained: false
first: "وَمَا كَادَ غُلَّانُ الشُّرَيْفِ يَسَعْنَهُمْ"
second: "بِحَلَّةِ يَوْمٍ وَالشُّرُوجُ الْقَوَابِلُ"
vocabulary:
  - term: "غُلَّانُ الشُّرَيْفِ"
    text: "يقول المحقق: الغُلّان «جمع غالّ وهو الوادي المطمئن الشجر»، و«الشريف صغره هنا وهو الشرف: ماء لبني كلاب» [@diwan-labid، ص265]."
  - term: "الشُّرُوجُ"
    text: "«والشَّرْج، بِالتَّسْكِينِ: مَسِيل الْمَاءِ مِنَ الحِرارِ إِلى السُّهولة، وَالْجَمْعُ أَشْراج وشِرَاج وشُرُوج» [@lisan، ج2 ص306]."
