explained: false
first: "وَمَا نَسَجَتْ أَسْرَادُ دَاوُدَ وَابْنِهِ"
second: "مُضَاعَفَةً مِنْ نَسْجِهِ إِذْ يُقَابِلُ"
vocabulary:
  - term: "أَسْرَادُ"
    text: "جمع سَرْد، والسرد في اللغة: «تَقْدِمَةُ شَيْءٍ إِلى شَيْءٍ تأْتي بِهِ متَّسقاً بعضُه فِي أَثر بَعْضٍ مُتَتَابِعًا» [@lisan، ج3 ص211]، ومنه نسج الدروع حلقة في حلقة."
  - term: "مُضَاعَفَةً"
    text: "درعًا نُسجت حلقتين حلقتين."
