explained: false
first: "لَهَا حَجَلٌ قَدْ قَرَّعَتْ مِنْ رُءُوسِهِ"
second: "لَهَا فَوْقَهُ مِمَّا تَحَلَّبُ وَاشِلُ"
vocabulary:
  - term: "حَجَلٌ"
    text: "صغار الإبل؛ في اللسان عن هذا البيت: «سَمَّى الإِفالَ حَجلًا تَشْبِيهًا بِهَا لِصِغَرِهَا» [@lisan، ج8 ص263]."
  - term: "قَرَّعَتْ"
    text: "«وقَرَّعَتِ الحَلُوبةُ رأْسَ فَصِيلها إِذا كانت كثيرة اللَّبَنِ، فإِذا رَضِعَ الفصيلُ خِلْفاً قَطَرَ اللبَنُ مِنَ الخِلفِ الآخرِ عَلَى رأْسه فَقَرَعَ رأْسَه» [@lisan، ج8 ص263]، أي ذهب شعره."
  - term: "وَاشِلُ"
    text: "قاطر: «الوَشَل، بِالتَّحْرِيكِ: الماءُ الْقَلِيلُ يَتَحَلَّب مِنْ جَبَلٍ أَو صخْرة يقطُر مِنْهُ قَلِيلًا قَلِيلًا» [@lisan، ج11 ص725]."
