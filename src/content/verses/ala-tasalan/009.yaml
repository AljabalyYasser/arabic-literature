first: "أَلَا كُلُّ شَيْءٍ مَا خَلَا اللَّهَ بَاطِلُ"
second: "وَكُلُّ نَعِيمٍ لَا مَحَالَةَ زَائِلُ"
meaning: "كل شيء غير الله ذاهب فانٍ، وكل نعيم يزول لا بد. والباطل هنا عند البغدادي «الذَّاهِب الزائل وَمَعْنَاهُ: الْهَالِك الفاني أَي: الْقَابِل للهلاك والفناء»، وينقل عن العيني: «الْمَعْنى: كل شَيْء سوى الله تَعَالَى زائلٌ فَائت مضمحل لَيْسَ لَهُ دوَام» [@khizana، ج2 ص258]."
vocabulary:
  - term: "بَاطِلُ"
    text: "ذاهب فانٍ، لا نقيض الحق. في الخزانة: «وَقَالَ بَعضهم: الْبَاطِل فِي الأَصْل ضد الْحق وَالْمرَاد بِهِ هُنَا الْهَالِك» [@khizana، ج2 ص258]."
  - term: "مَا خَلَا"
    text: "ما عدا، أداة استثناء."
  - term: "لَا مَحَالَةَ"
    text: "لا بدّ. في الخزانة: «والمحالة بِفَتْح الْمِيم: الْحِيلَة قَالَ الْجَوْهَرِي: قَوْلهم لَا محَالة أَي: لابد» [@khizana، ج2 ص258]، وفي اللسان: «يُقَالُ: الْمَوْتُ آتٍ لَا مَحالة» [@lisan، ج11 ص186]."
context: "قلب القصيدة وأسير أبياتها. بعد أن سأل عن سعي المرء وذكّره بالموت والآباء الذاهبين، يجمع الجواب في حكم واحد، ثم يفصّله في النعمان وملوك غسان. وقد جعله بعض الرواة أول القصيدة [@khizana، ج2 ص255]، ويبدأ به ابن قُتَيْبة مختاره منها [@ibn-qutayba، ج1 ص271]. وعلى شطره الأول ثناء النبي صلى الله عليه وسلم: «أشعر كلمة تكلمت بها العرب كلمة لبيد: ألا كل شيء ما خلا الله باطلُ»، يرويه ابن الأنباري بإسناده إلى أبي هُرَيْرة [@ibn-al-anbari، ص510]، وفي الخزانة أن في الصحيحين «أصدق كلمة قالها شاعر» [@khizana، ج2 ص255]. وعليه خبر عثمان بن مظعون بمكة: صدّق لبيدًا في الشطر الأول، وكذّبه في الثاني لأن «نعيم الجنة لا يزول» [@khizana، ج2 ص255] [@muwashshah، ص85]. ويرى إحسان عباس أن لبيدًا فيه «توصل إلى التأليه على نحو يشبه التوحيد» [@diwan-labid، المقدمة ص24]، ويرى شوقي ضيف أنه يستمد فيه من مثل قوله تعالى «كُلُّ مَنْ عَلَيْهَا فَانٍ» [@deif، ج2 ص94]."
syntax:
  - "«أَلَا» حرف استفتاح وتنبيه، و«كُلُّ» مبتدأ، و«شَيْءٍ» مضاف إليه، و«بَاطِلُ» خبره."
  - "«مَا خَلَا اللَّهَ»: «ما» مصدرية، و«خلا» فعل ماض جامد للاستثناء، وفاعله ضمير مستتر، و«اللَّهَ» مفعول به منصوب، ولذلك نُصب لفظ الجلالة ولم يُجرّ."
  - "«وَكُلُّ نَعِيمٍ ... زَائِلُ» جملة اسمية معطوفة على الأولى، و«لَا مَحَالَةَ» اعتراض بينهما: «لا» نافية للجنس، و«محالة» اسمها مبني على الفتح، والخبر محذوف، أي: لا محالة من ذلك."
morphology:
  - "«بَاطِل» اسم فاعل من «بَطَلَ»، و«زَائِل» اسم فاعل من «زالَ» الأجوف، قلبت عينه همزة في اسم الفاعل."
  - "«مَحَالَة» على «مَفْعَلة» من الحَوْل، وهي الحيلة [@khizana، ج2 ص258]، و«نَعِيم» على «فَعِيل»."
rhetoric:
  thesis: "حكمة تامة في شطرين، كل شطر جملة مستقلة، فصار البيت مثلًا يُروى بلا قصيدته."
  devices:
    - title: "الاستثناء"
      text: "«مَا خَلَا اللَّهَ»: الاستثناء هو الذي جعل الشطر الأول شهادة لا مجرد شكوى من الفناء: كل شيء يزول إلا واحدًا. ولهذا عدّه النبي صلى الله عليه وسلم «أصدق كلمة قالها شاعر» [@khizana، ج2 ص255]."
    - title: "الموازنة بين الشطرين"
      text: "«كُلُّ شَيْءٍ ... بَاطِلُ» و«كُلُّ نَعِيمٍ ... زَائِلُ»: صيغة واحدة تتكرر، والخبر في آخر كل شطر، فينتقل الحكم من العموم المطلق «كل شيء» إلى ما يتعلق به الإنسان أشدّ التعلق «كل نعيم»."
    - title: "العموم وقرينة السياق"
      text: "«وَكُلُّ نَعِيمٍ»: هنا موضع الخلاف في خبر عثمان بن مظعون، فقد حمل الكلام على العموم فدخل فيه نعيم الجنة. ويجيب العيني بأن لبيدًا قد يكون أراد «مَا سوى الْجنَّة من نعيم الدُّنْيَا لِأَنَّهُ كَانَ فِي صدد ذمّ الدُّنْيَا»، وأن عثمان كذّبه «لكَونه حمل الْكَلَام على الْعُمُوم» [@khizana، ج2 ص257]. فالسياق، وهو ذمّ الدنيا والملوك الذاهبين، يخصّ العموم."
  connection: "ثم يسمّي ما يدخل على الناس فيُبطل نعيمهم: الموت، داهية تصفرّ منها الأنامل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "أَلَا كُلْ / لُ شَيْئِنْ مَا / خَلَلْلَا / هَ بَاطِلُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَكُلْلُ / نَعِيمِنْ لَا / مَحَالَ / ةَ زَائِلُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ «فعولن» الأولى والثالثة في العجز فصارتا «فعولُ» [@atiq، ص29]."
