explained: false
first: "وَيَوْمًا مِنَ الدُّهْمِ الرِّغَابِ كَأَنَّهَا"
second: "أَشَاءٌ دَنَا قِنْوَانُهُ أَوْ مَجَادِلُ"
vocabulary:
  - term: "الرِّغَابِ"
    text: "الكثيرة: «وإِبِلٌ رِغابٌ: كَثِيرَةٌ؛ قَالَ لَبِيدٌ» بهذا البيت [@lisan، ج1 ص424]. والدُّهْم: السود."
  - term: "أَشَاءٌ"
    text: "«والأَشَاءُ، بِالْفَتْحِ وَالْمَدِّ: صِغار النَّخْل، وَقِيلَ: النَّخْلُ عامَّةً» [@lisan، ج14 ص37]."
  - term: "قِنْوَانُهُ"
    text: "عذوقه، جمع قِنْو."
  - term: "مَجَادِلُ"
    text: "قصور، جمع مِجْدَل: «والقَصْرُ: المِجْدَلُ وَهُوَ الفَدَنُ الضخمُ» [@lisan، ج5 ص102]."
