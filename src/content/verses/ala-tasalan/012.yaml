first: "لِيَبْكِ عَلَى النُّعْمَانِ شَرْبٌ وَقَيْنَةٌ"
second: "وَمُخْتَبِطَاتٌ كَالسَّعَالِي أَرَامِلُ"
meaning: "فليبك النعمانَ ندماؤه الذين كانوا يشربون معه، وقينته، والنساء الفقيرات اللواتي كنّ يقصدنه يطلبن معروفه، وقد صرن من الجوع وسوء الحال كالغيلان. وفي الخزانة: «الشّرْب: جمع شَارِب يُرِيد أَصْحَابه الَّذين كَانَ يشاربهم»، و«السعالي: الغيلان شبه السائلات بهَا فِي سوء حالهن وقبحهن» [@khizana، ج2 ص259]."
vocabulary:
  - term: "شَرْبٌ"
    text: "الندامى على الشراب [@khizana، ج2 ص259]."
  - term: "قَيْنَةٌ"
    text: "«القَيْنةُ: الأَمة المُغنّية» [@lisan، ج13 ص351]."
  - term: "مُخْتَبِطَاتٌ"
    text: "السائلات المعروف [@khizana، ج2 ص259]. وفي اللسان: «والمُخْتَبِطُ: الَّذِي يَسْأَلُك بِلَا وسِيلة وَلَا قَرابةٍ وَلَا مَعْرِفَةٍ» [@lisan، ج7 ص282]."
  - term: "السَّعَالِي"
    text: "الغيلان، جمع سِعْلاة [@khizana، ج2 ص259]."
  - term: "أَرَامِلُ"
    text: "«المحاويج الجياع من أرمل الْقَوْم: إِذا نفذ زادهم وجاعوا» [@khizana، ج2 ص259]. وفي اللسان: «وأَرْمَلَ القومُ: نَفِد زادُهم» [@lisan، ج11 ص296]."
context: "أول بيت يُذكر فيه النعمان، وبه تنتقل القصيدة من الحكمة إلى شاهدها. يقول البغدادي: «ثمَّ شرع بعد هَذَا فِي تقلب الدَّهْر بأَهْله وَبَدَأَ بِذكر النُّعْمَان وَمَا كَانَ فِيهِ من سَعَة الْملك ونعيم الدُّنْيَا ثمَّ ذكر مُلُوك الشَّام آل غَسَّان» [@khizana، ج2 ص259]. وعلى هذا البيت وأمثاله يقوم القول بأنها مرثية للنعمان. وفي شرح الديوان تنبيه على أن مدح الندامى هنا من عادة الرثاء: «وهذا موطن رثاء وإلا فإن النعمان كان مشهوراً بالعربدة على ندماه» [@diwan-labid، ص257]."
syntax:
  - "«لِيَبْكِ»: اللام لام الأمر، و«يَبْكِ» مضارع مجزوم بها وعلامة جزمه حذف الياء، و«عَلَى النُّعْمَانِ» متعلق به، و«شَرْبٌ» فاعله، و«قَيْنَةٌ» و«مُخْتَبِطَاتٌ» معطوفان عليه."
  - "«كَالسَّعَالِي» جار ومجرور متعلق بمحذوف صفة لـ«مختبطات»، و«أَرَامِلُ» صفة ثانية مرفوعة بالضمة بلا تنوين لأنها ممنوعة من الصرف."
morphology:
  - "«شَرْب» على «فَعْل»، وهو جمع شارب كصَحْب جمع صاحب، و«قَيْنَة» على «فَعْلة»."
  - "«مُخْتَبِطات» جمع «مُخْتَبِطة»، اسم فاعل من «اخْتَبَطَ» على «افْتَعَلَ» من الخَبْط."
  - "«السَّعَالِي» جمع «سِعْلاة» على «فَعالِي»، و«أَرَامِل» جمع «أَرْمَلة» على «أَفاعِل»، وكلاهما على صيغة منتهى الجموع."
rhetoric:
  thesis: "رثاء الملك بمن فقده: يبكيه أهل لذّته وأهل حاجته، فيجتمع في البيت مجلسه وجوده."
  devices:
    - title: "الأمر للندب"
      text: "«لِيَبْكِ عَلَى النُّعْمَانِ»: صيغة أمر معروفة في الرثاء، لا يطلب بها البكاء حقيقة، بل يعدّد بها من خسر بموته، فيكون العدّ نفسه مديحًا."
    - title: "المقابلة"
      text: "«شَرْبٌ وَقَيْنَةٌ» و«مُخْتَبِطَاتٌ ... أَرَامِلُ»: في الشطر الأول أهل اللهو والنعيم، وفي الثاني الجائعات السائلات. وجمع الفريقين يجعل النعمان ملكًا تامًّا: ينعم ويُنعم."
    - title: "التشبيه"
      text: "«كَالسَّعَالِي»: شبّه السائلات بالغيلان «فِي سوء حالهن وقبحهن» [@khizana، ج2 ص259]، والشبه ظاهر في الهيئة لا يحتاج إلى تأوّل، وهو الضرب الأول من ضربي التشبيه عند عبد القاهر الجُرْجانيّ: «أن يكون من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]. والصورة قاسية عمدًا: قسوة الجوع بعد موت من كان يطعم."
  connection: "ثم يذكر سعة ملكه: كان له ظاهر معدّ، وأسلمت إليه القبائل ما يطلب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لِيَبْكِ / عَلَنْنُعْمَا / نِ شَرْبُنْ / وَقَيْنَتُنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — وَمُخْتَ / بِطَاتُنْ كَسْ / سَعَالِي / أَرَامِلُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ «فعولن» الأولى في الشطرين فصارت «فعولُ» [@atiq، ص29]."
