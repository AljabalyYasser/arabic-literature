explained: false
first: "لَهُ الْمُلْكُ فِي ضَاحِي مَعَدٍّ وَأَسْلَمَتْ"
second: "إِلَيْهِ الْعِبَادُ كُلُّهَا مَا يُحَاوِلُ"
vocabulary:
  - term: "ضَاحِي مَعَدٍّ"
    text: "ظاهر أرضهم وما برز منها؛ وفي اللسان: «وضاحِيةُ كلِّ شَيْءٍ: مَا بَرَزَ مِنْهُ» [@lisan، ج14 ص477]. ويقول المحقق: «أي ظاهر معد، لا في معد نفسها» [@diwan-labid، ص257]."
  - term: "الْعِبَادُ"
    text: "يرى المحقق أنها هنا «القبائل المشهورة بهذا الاسم لا جميع العباد» [@diwan-labid، ص257]، وهم عرب الحِيرة."
