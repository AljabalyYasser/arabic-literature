explained: false
first: "بِأَشْهَبَ مِنْ أَبْكَارِ مُزْنِ سَحَابَةٍ"
second: "وَأَرْيِ دَبُورٍ شَارَهُ النَّحْلَ عَاسِلُ"
vocabulary:
  - term: "بِأَشْهَبَ"
    text: "بماء أبيض. في اللسان عن ابن بَرِّيّ في هذا البيت: «يَصِفُ خَمْرًا مُزِجَتْ بِمَاءٍ أَبيض، وَهُوَ الأَشهب» [@lisan، ج4 ص274]."
  - term: "مُزْنِ"
    text: "«وَالْمُزْنُ: السَّحَابُ الأَبيض، الْوَاحِدَةُ مُزْنَةٌ» [@lisan، ج4 ص274]."
  - term: "أَرْيِ دَبُورٍ"
    text: "عسل النحل: «والأَرْيُ: الْعَسَلُ» [@lisan، ج4 ص274]، و«والدَّبْرُ، بِالْفَتْحِ: النَّحْلُ وَالزَّنَابِيرُ» [@lisan، ج4 ص274]."
  - term: "شَارَهُ النَّحْلَ عَاسِلُ"
    text: "«وشارَهُ: جَنَاهُ، وَالنَّحْلَ مَنْصُوبٌ بإِسقاط مِنْ أَي جَنَاهُ مِنَ النَّحْلِ عَاسِلُ» [@lisan، ج4 ص274]، والعاسل: جاني العسل."
