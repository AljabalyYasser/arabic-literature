first: "أَرَى النَّاسَ لَا يَدْرُونَ مَا قَدْرُ أَمْرِهِمْ"
second: "بَلَى كُلُّ ذِي لُبٍّ إِلَى اللَّهِ وَاسِلُ"
vocabulary:
  - term: "وَاسِلُ"
    text: "متوسّل راغب. في الخزانة: «الواسل: الطَّالِب الَّذِي يطْلب من قَوْلك. أَنْت وسيلتي إِلَى فلَان»، «والواسل: هُوَ الرَّاغِب إِلَى الله» [@khizana، ج2 ص254]."
