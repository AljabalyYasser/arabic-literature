explained: false
first: "غَدَاةَ غَدَوْا مِنْهَا وَآزَرَ سَرْبَهُمْ"
second: "مَوَاكِبُ تُحْدَى بِالْغَبِيطِ وَجَامِلُ"
vocabulary:
  - term: "آزَرَ"
    text: "أعان وقوّى، كما في تفسير «فَآزَرَهُ»: «أَي فأَعانَه» [@lisan، ج1 ص100]."
  - term: "سَرْبَهُمْ"
    text: "«السَّرْبُ: المالُ الرَّاعي؛ أَعْني بِالْمَالِ الإِبِلَ» [@lisan، ج1 ص462]."
  - term: "بِالْغَبِيطِ"
    text: "«والغَبِيطُ: الرَّحْلُ، وَهُوَ لِلنِّسَاءِ يُشَدُّ عَلَيْهِ الهوْدَج» [@lisan، ج7 ص360]. ويرى المحقق أنه «اسم واد» [@diwan-labid، ص261]."
  - term: "جَامِلُ"
    text: "«الجامِل قَطِيع مِنِ الإِبل مَعَهَا رُعْيانها وأَربابها» [@lisan، ج11 ص124]."
