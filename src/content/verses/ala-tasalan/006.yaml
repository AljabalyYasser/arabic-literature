explained: false
first: "فَإِنْ أَنْتَ لَمْ تَصْدُقْكَ نَفْسُكَ فَانْتَسِبْ"
second: "لَعَلَّكَ تَهْدِيكَ الْقُرُونُ الْأَوَائِلُ"
vocabulary:
  - term: "فَانْتَسِبْ"
    text: "اذكر آباءك واحدًا واحدًا: «قل أَيْن فلَان ابْن فلَان» [@khizana، ج2 ص253]، فلن تجد منهم أحدًا باقيًا [@khizana، ج2 ص254]."
  - term: "الْقُرُونُ"
    text: "الأجيال: «والْقُرُون: جمع قرن وَهُوَ أهل زمَان وَاحِد» [@khizana، ج2 ص254]."
