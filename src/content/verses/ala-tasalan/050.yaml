first: "رَعَى خَرَزَاتِ الْمُلْكِ عِشْرِينَ حِجَّةً"
second: "وَعِشْرِينَ حَتَّى فَادَ وَالشَّيْبُ شَامِلُ"
vocabulary:
  - term: "خَرَزَاتِ الْمُلْكِ"
    text: "«وخَرَزاتُ المَلِك: جواهرُ تاجِهِ. وَيُقَالُ: كَانَ المَلِك إِذا مَلَك عَامًا زِيدَتْ فِي تَاجِهِ خَرَزَة لِيُعْلَمَ عَدَدُ سِني مُلْكِه؛ قَالَ لَبِيدٌ يَذْكُرُ الْحَرْثَ بْنُ أَبي شَمِر الغَسَّاني» [@lisan، ج5 ص345]."
  - term: "فَادَ"
    text: "مات: «وفادَ يَفُودُ فَوْداً: مَاتَ» [@lisan، ج3 ص340]."
