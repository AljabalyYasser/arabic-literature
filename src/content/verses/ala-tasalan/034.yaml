explained: false
first: "وَكَانَتْ تُرَاثًا مِنْهُمَا لِمُحَرِّقٍ"
second: "طَحُونٌ كَأَنَّ الْبَيْضَ فِيهَا الْأَعَابِلُ"
vocabulary:
  - term: "لِمُحَرِّقٍ"
    text: "«ومُحَرِّق أَيضاً: لقب الحرث بْنِ عَمْرٍو ملِك الشَّامِ» من آل جَفْنة، وهو قبل ذلك لقب عمرو بن هند [@lisan، ج10 ص42]."
  - term: "طَحُونٌ"
    text: "«الطَّحُون الْكَتِيبَةُ تَطْحَنُ مَا لَقِيَتْ» [@lisan، ج13 ص265]."
  - term: "الْبَيْضَ"
    text: "الخُوَذ، جمع بَيْضة."
  - term: "الْأَعَابِلُ"
    text: "«الأَصمعي: الأَعْبَل والعَبْلاء حِجَارَةٌ بِيضٌ» [@lisan، ج11 ص420]."
