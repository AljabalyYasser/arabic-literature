explained: false
first: "عَلَى الصَّرْصَرَانِيَّاتِ فِي كُلِّ رِحْلَةٍ"
second: "وُسُوقٌ عِدَالٌ لَيْسَ فِيهِنَّ مَائِلُ"
vocabulary:
  - term: "الصَّرْصَرَانِيَّاتِ"
    text: "«والصَّرْصَرانِيَّة مِنَ الإِبل: الَّتِي بَيْنَ البَخاتيِّ والعِراب، وَقِيلَ: هِيَ الفَوالِجُ» [@lisan، ج4 ص455]."
  - term: "وُسُوقٌ"
    text: "أحمال، جمع وَسْق: «الوَسْقُ والوِسْقُ: مِكْيَلَة مَعْلُومَةٌ، وَقِيلَ: هُوَ حِمْلُ بَعِيرٍ» [@lisan، ج10 ص378]."
  - term: "عِدَالٌ"
    text: "متعادلة، من العِدْل: «والعِدْل: نِصْف الحِمْل يَكُونُ عَلَى أَحد جَنْبَيِ الْبَعِيرِ» [@lisan، ج11 ص432]."
