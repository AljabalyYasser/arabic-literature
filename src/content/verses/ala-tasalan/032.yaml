explained: false
first: "حَقَائِبُهُمْ رَاحٌ عَتِيقٌ وَدَرْمَكٌ"
second: "وَرَيْطٌ وَفَاثُورِيَّةٌ وَسَلَاسِلُ"
vocabulary:
  - term: "دَرْمَكٌ"
    text: "«والدَّرْمَكُ: دَقِيقُ الحُوَّارَى» [@lisan، ج10 ص423]، أي الدقيق الأبيض الخالص."
  - term: "رَيْطٌ"
    text: "«الرَّيْطةُ: المُلاءَةُ إِذا كَانَتْ قِطْعةً وَاحِدَةً وَلَمْ تَكُنْ لِفْقَيْنِ» [@lisan، ج7 ص307]."
  - term: "فَاثُورِيَّةٌ"
    text: "«الْفَاثُورِيَّةُ هُنَا أَخْوِنة وجَاماتٌ» [@lisan، ج5 ص45]."
  - term: "وَسَلَاسِلُ"
    text: "يرويها صاحب اللسان «وسُلاسِلُ» بالضم، وهو الشراب السهل «لعُذوبته وَصَفَائِهِ»، ويقول: «وَشَاهِدُ السُّلاسِل قَوْلُ لَبِيدٌ» بهذا البيت [@lisan، ج11 ص343]."
