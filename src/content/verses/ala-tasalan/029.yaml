explained: false
first: "وَيَوْمَ أَجَازَتْ قُلَّةَ الْحَزْنِ مِنْهُمُ"
second: "مَوَاكِبُ تَعْلُو ذَا حُسًى وَقَنَابِلُ"
vocabulary:
  - term: "قُلَّةَ الْحَزْنِ"
    text: "«وقُلَّة كُلِّ شَيْءٍ: رأْسه» [@lisan، ج11 ص565]، و«والحَزْنُ: بلادٌ للعَربِ. قَالَ ابْنُ سِيدَهْ: والحَزْنُ مَا غلُظَ مِنَ الأَرض» [@lisan، ج13 ص112]."
  - term: "ذَا حُسًى"
    text: "يقول المحقق: «موضع بالعالية في أرض غطفان» [@diwan-labid، ص262]."
  - term: "قَنَابِلُ"
    text: "«القَنْبَلة والقَنْبل: طَائِفَةٌ مِنَ النَّاسِ وَمِنَ الْخَيْلِ» [@lisan، ج11 ص569]."
