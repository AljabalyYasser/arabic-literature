first: "إِذَا الْمَرْءُ أَسْرَى لَيْلَةً ظَنَّ أَنَّهُ"
second: "قَضَى عَمَلًا وَالْمَرْءُ مَا عَاشَ عَامِلُ"
vocabulary:
  - term: "أَسْرَى"
    text: "سار ليلًا، «وسرى وَأسرى بِمَعْنى». ويقول البغدادي في معنى البيت: «إِذا سهر الْمَرْء لَيْلَة فِي عمل ظن أَنه قد فرغ مِنْهُ وَهُوَ مَا عَاشَ يعرض لَهُ مثل ذَلِك» [@khizana، ج2 ص253]."
