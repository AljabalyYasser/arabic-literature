explained: false
first: "فَإِنَّ امْرَأً يَرْجُو الْفَلَاحَ وَقَدْ رَأَى"
second: "سَوَامًا وَحَيًّا بِالْأُفَاقَةِ جَاهِلُ"
vocabulary:
  - term: "الْفَلَاحَ"
    text: "البقاء: «عَنِ ابْنِ السِّكِّيتِ: الفَلَح والفَلاح الْبَقَاءُ» [@lisan، ج2 ص547]."
  - term: "سَوَامًا"
    text: "«والسَّوَامُ والسائمةُ بِمَعْنًى: وَهُوَ الْمَالُ الرَّاعِي» [@lisan، ج12 ص311]."
  - term: "بِالْأُفَاقَةِ"
    text: "موضع، «ذَكَرَهُ لَبِيَدٌ» [@lisan، ج10 ص7]، وكانت فيه إبل النعمان وحيّه."
