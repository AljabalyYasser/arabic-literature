explained: false
first: "يُجَاوِبْنَ بُحًّا قَدْ أُعِيدَتْ وَأَسْمَحَتْ"
second: "إِذَا احْتَثَّ بِالشِّرْعِ الدِّقَاقِ الْأَنَامِلُ"
vocabulary:
  - term: "بُحًّا ... بِالشِّرْعِ"
    text: "يقول المحقق: البُحّ «جمع أبح وهو صفة للعود»، والشِّرْع «جمع شرعة وهو الوتر الدقيق» [@diwan-labid، ص264]."
  - term: "أَسْمَحَتْ"
    text: "انقادت: «وَيُقَالُ: أَسْمَحَتْ نَفْسُه إِذا انْقَادَتْ» [@lisan، ج2 ص489]."
