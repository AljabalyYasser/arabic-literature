first: "كَأَرْكَانِ سَلْمَى إِذْ بَدَتْ وَكَأَنَّهَا"
second: "ذُرَى أَجَأٍ إِذْ لَاحَ فِيهَا مُوَاسِلُ"
vocabulary:
  - term: "سَلْمَى ... أَجَأٍ"
    text: "جبلا طيّئ: «أَجَأ عَلَى فَعَلٍ بِالتَّحْرِيكِ: جبلٌ لطيِءٍ يذكَّر ويؤَنَّث. وَهُنَالِكَ ثلاثةُ أَجبُل: أَجَأ وسَلْمَى والعَوْجَاءُ» [@lisan، ج1 ص23]."
