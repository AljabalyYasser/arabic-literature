explained: false
first: "إِذَا وَضَعُوا أَلْبَادَهَا عَنْ مُتُونِهَا"
second: "وَقَدْ نَضَحَتْ أَعْطَافُهَا وَالْكَوَاهِلُ"
vocabulary:
  - term: "أَلْبَادَهَا"
    text: "ما تحت سروجها: «واللِّبْدُ مِنَ البُسُط: مَعْرُوفٌ، وَكَذَلِكَ لِبْدُ السَّرْجِ» [@lisan، ج3 ص386]."
  - term: "نَضَحَتْ"
    text: "رشحت بالعرق."
  - term: "الْكَوَاهِلُ"
    text: "«والكاهِلُ مَا بَيْنَ الكَتِفَيْنِ» [@lisan، ج1 ص208]."
