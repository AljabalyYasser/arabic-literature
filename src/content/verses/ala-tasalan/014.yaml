first: "إِذَا مَسَّ أَسْآرَ الطُّيُورِ صَفَتْ لَهُ"
second: "مُشَعْشَعَةٌ مِمَّا تُعَتِّقُ بَابِلُ"
vocabulary:
  - term: "أَسْآرَ"
    text: "بقايا: «السُّؤْرُ بَقِيَّة الشَّيْءِ، وَجَمْعُهُ أَسآرٌ» [@lisan، ج4 ص339]. ويرى المحقق أنها بقايا الصيد: «أي إذا أكل الصيد شرب الخمر التي هذه صفتها» [@diwan-labid، ص258]."
  - term: "مُشَعْشَعَةٌ"
    text: "خمر ممزوجة: «وشَعْشَعَ الشَّرابَ شَعْشَعَةً: مزَجَه بِالْمَاءِ، وَقِيلَ: المُشَعْشَعة الخَمْرُ الَّتِي أُرِقَّ مَزْجُها» [@lisan، ج8 ص182]."
