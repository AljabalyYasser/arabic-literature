first: "فَإِنْ لَمْ تَجِدْ مِنْ دُونِ عَدْنَانَ بَاقِيًا"
second: "وَدُونَ مَعَدٍّ فَلْتَزَعْكَ الْعَوَاذِلُ"
meaning: "فإن عددت آباءك فلم تجد منهم أحدًا باقيًا بينك وبين عدنان، ولا بينك وبين معدّ، فلتكفّك حوادث الدهر عن الطمع في البقاء. وفي شرح الطُّوسِيّ كما ينقله البغدادي: «يَقُول: لم يبْق لَك أبٌ حَيّ إِلَى عدنان فَكف عَن الطمع فِي الْحَيَاة»، ومعنى البيت مع الذي قبله «أَن غَايَة الْإِنْسَان الْمَوْت فَيَنْبَغِي لَهُ أَن يتعظ» [@khizana، ج2 ص254]."
vocabulary:
  - term: "فَلْتَزَعْكَ"
    text: "فلتكفّك. قال الطوسي: «وزعه يزعه بِالْفَتْح ويزعه بِالْكَسْرِ وزعاً ووزوعاً: إِذا كَفه» [@khizana، ج2 ص254]. وفي اللسان: «وزَعَه وَبِهِ يَزَعُ ويَزِعُ وزْعاً: كفَّه» [@lisan، ج8 ص390]."
  - term: "عَدْنَانَ"
    text: "الجد الأعلى للعرب العدنانية، «لِأَن مُضر بن نزار بن معد بن عدنان» [@khizana، ج2 ص254]، فمعدّ ابنه، ولبيد من مضر."
  - term: "الْعَوَاذِلُ"
    text: "اللوائم، وهي عند البغدادي «حوادث الدَّهْر وزواجره»، وقال الطوسي: «العواذل: النِّسَاء» [@khizana، ج2 ص254]."
context: "خاتمة الحجة التي بدأت بالبيت السادس: «فإن أنت لم تصدقك نفسك فانتسب»، أي اذكر آباءك واحدًا واحدًا، فإن لم تجد منهم حيًّا إلى عدنان فاعلم أنك صائر إلى ما صاروا إليه. وهو من شواهد سيبويه في العطف على المحل [@khizana، ج2 ص252]، ومن الأبيات السبعة التي يستجيدها ابن قُتَيْبة [@ibn-qutayba، ج1 ص271]."
syntax:
  - "«فَإِنْ لَمْ تَجِدْ»: «إن» شرطية، و«تجد» مجزوم بـ«لم»، و«مِنْ دُونِ عَدْنَانَ» جار ومجرور متعلق بـ«تجد»، و«بَاقِيًا» مفعوله."
  - "«وَدُونَ مَعَدٍّ»: «دون» منصوب معطوف على محل الجار والمجرور «من دون»، وبه استشهد سيبويه، «وَكَأَنَّهُ قَالَ: فَإِن لم تَجِد دون عدنان والداً وَدون معد» [@khizana، ج2 ص252]. ويشترط ابن هشام لهذا العطف «إِمْكَان ظُهُور ذَلِك الْمحل فِي الفصيح»، وهو ممكن هنا لأنك تقول: لم تجد دون عدنان [@khizana، ج2 ص252]."
  - "«فَلْتَزَعْكَ»: الفاء رابطة لجواب الشرط، واللام لام الأمر، و«تَزَعْ» مضارع مجزوم بها، والكاف مفعول به، و«الْعَوَاذِلُ» فاعل."
morphology:
  - "«تَزَعْ» مضارع «وَزَعَ» المثال الواوي، تحذف فاؤه في المضارع كـ«وَعَدَ يَعِدُ»، ويقال فيه «يَزَع» بالفتح و«يَزِع» بالكسر [@khizana، ج2 ص254]، والفتح هنا لحرف الحلق."
  - "«عَدْنَان» ممنوع من الصرف للعلمية وزيادة الألف والنون، فجُرّ بالفتحة، و«مَعَدّ» مصروف."
  - "«الْعَوَاذِل» جمع «عاذِلة» على «فواعِل»."
rhetoric:
  thesis: "حجة من النسب على الموت: الأب الذي لا تجده حيًّا دليل على أنك لن تبقى."
  devices:
    - title: "الاحتجاج بالأنساب"
      text: "«مِنْ دُونِ عَدْنَانَ بَاقِيًا وَدُونَ مَعَدٍّ»: لا يقول إن الناس يموتون، بل يجعل السامع يعدّ آباءه بنفسه، فيصل إلى الحكم بلا واعظ. ونسب العربي أعزّ ما يحفظ، فجعله لبيد شاهدًا على الفناء لا على الفخر."
    - title: "التكرار"
      text: "«دُونِ عَدْنَانَ ... وَدُونَ مَعَدٍّ»: كرر «دون» ونزل من الجد الأعلى إلى ابنه، فكأنه يقرّب المسافة: لا حيّ قبل عدنان، ولا حيّ قبل معدّ أيضًا."
    - title: "المجاز في الإسناد"
      text: "«فَلْتَزَعْكَ الْعَوَاذِلُ»: إن كانت العواذل حوادث الدهر فقد أسند إليها اللوم والكفّ، وهما من فعل الناس، و«إسْنَاد العذل إِلَيْهَا مجَاز» كما يقول البغدادي [@khizana، ج2 ص254]. وعلى قول الطوسي هي النساء اللوائم على الحقيقة."
  connection: "ثم ينتقل من المرء الواحد إلى الناس جميعًا: لا يدرون قدر أمرهم، والعاقل منهم يتوسل إلى الله."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "فَإِنْ لَمْ / تَجِدْ مِنْ دُو / نِ عَدْنَا / نَ بَاقِيَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَدُونَ / مَعَدْدِنْ فَلْ / تَزَعْكَلْ / عَوَاذِلُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ «فعولن» الأولى في العجز فصارت «فعولُ» [@atiq، ص29]."
variants:
  - reading: "فَإِنْ لَمْ تَجِدْ مِنْ دُونِ عَدْنَانَ وَالِدًا"
    status: "رواية سيبويه وابن قُتَيْبة وأكثر المراجع"
    note: "بها يستشهد سيبويه [@khizana، ج2 ص252]، وهي عند ابن قتيبة [@ibn-qutayba، ج1 ص271]، ويقول المحقق: «وروى في أكثر المراجع: من دون عدنان والداً» [@diwan-labid، ص256]."
