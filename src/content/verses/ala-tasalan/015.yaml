first: "عَتِيقُ سُلَافَاتٍ سَبَتْهَا سَفِينَةٌ"
second: "تَكُرُّ عَلَيْهَا بِالْمِزَاجِ النَّيَاطِلُ"
vocabulary:
  - term: "سُلَافَاتٍ"
    text: "«وَيُسَمَّى الْخَمْرُ سُلافاً. وسُلافةُ كلِّ شَيْءٍ عصرْتَه: أَوَّلُه» [@lisan، ج9 ص160]."
  - term: "سَبَتْهَا"
    text: "حملتها من بلد بعيد: «وسَبَى الخَمْرَ يَسْبِيها سَبْياً وسِباءً واسْتَبَاها: حَمَلَها مِنْ بَلَدٍ إِلَى بَلَدٍ» [@lisan، ج14 ص368]."
  - term: "النَّيَاطِلُ"
    text: "«وَالنَّيَاطِلُ: مَكَايِيلُ الْخَمْرِ» [@lisan، ج4 ص274]، تعود عليها بالماء تمزجها به."
