explained: false
first: "عَلَى مَا تُرِيهِ الْخَمْرُ إِذْ جَاشَ بَحْرُهُ"
second: "وَأَوْشَمَ جُودٌ مِنْ نَدَاهُ وَوَابِلُ"
vocabulary:
  - term: "جَاشَ بَحْرُهُ"
    text: "فاض كرمه، من قولهم: «وجاشَ الْبَحْرُ جَيشاً: هاجَ فَلَمْ يُسْتَطع رُكوبُه» [@lisan، ج6 ص277]."
  - term: "أَوْشَمَ"
    text: "بدا أوله: «وأَوْشَمَ البرْق: لمَعَ لَمْعاً خَفِيفًا؛ قَالَ أَبو زَيْدٍ: هُوَ أَوَّلُ الْبَرْقِ حِينَ يَبرُقُ» [@lisan، ج12 ص639]."
  - term: "جُودٌ ... وَوَابِلُ"
    text: "مطر غزير: «وَجَادَ الْمَطَرُ جَوْداً: وبَلَ فَهُوَ جَائِدٌ» [@lisan، ج3 ص137]، و«الوَبْلُ والوابِلُ: الْمَطَرُ الشَّدِيدُ الضَّخْم القطْرِ» [@lisan، ج11 ص720]."
