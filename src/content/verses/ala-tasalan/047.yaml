explained: false
first: "كَأَنْ لَمْ يَكُنْ بِالشِّرْعِ مِنْهُمْ طَلَائِعٌ"
second: "فَلَمْ تَرْعَ سَحًّا فِي الرَّبِيعِ الْقَنَابِلُ"
vocabulary:
  - term: "بِالشِّرْعِ"
    text: "موضع، كما يقول المحقق [@diwan-labid، ص266]."
  - term: "سَحًّا"
    text: "يقول المحقق: «متتابعاً، أي لم ترع رعياً سحاً، ولست واثقاً منها، ولعلها «شيحاً»» [@diwan-labid، ص266]."
  - term: "الْقَنَابِلُ"
    text: "جماعات الخيل: «القَنْبَلة والقَنْبل: طَائِفَةٌ مِنَ النَّاسِ وَمِنَ الْخَيْلِ» [@lisan، ج11 ص569]."
