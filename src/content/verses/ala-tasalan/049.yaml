first: "وَغَسَّانُ ذَلَّتْ يَوْمَ جِلَّقَ ذِلَّةً"
second: "بِسَيِّدِهَا وَالْأَرْيَحِيُّ الْمُنَازِلُ"
vocabulary:
  - term: "جِلَّقَ"
    text: "«جِلَّق وجِلِّق: مَوْضِعٌ؛ يُصْرَفُ وَلَا يُصْرَفُ» [@lisan، ج10 ص36]، وهو بالشام."
  - term: "الْأَرْيَحِيُّ"
    text: "«والأَرْيَحِيُّ: الرَّجُلُ الْوَاسِعُ الخُلُق النَّشِيطُ إِلى الْمَعْرُوفِ» [@lisan، ج2 ص460]."
