explained: false
first: "أَوَتْ لِلشِّيَاحِ وَاهْتَدَى لِصَلِيلِهَا"
second: "كَتَائِبُ خُضْرٌ لَيْسَ فِيهِنَّ نَاكِلُ"
vocabulary:
  - term: "الشِّيَاحِ"
    text: "«والشِّياحُ: الحِذارُ والجِدُّ فِي كُلِّ شَيْءٍ» [@lisan، ج2 ص501]."
  - term: "خُضْرٌ"
    text: "سود من الحديد؛ يقول المحقق: «وصفها بالخضرة للبسها الحديد» [@diwan-labid، ص263]."
  - term: "نَاكِلُ"
    text: "جبان: «يُقَالُ: نَكَلَ عَنِ الْعَدُوِّ وَعَنِ الْيَمِينِ يَنْكُلُ، بِالضَّمِّ، أَي جَبُنَ» [@lisan، ج11 ص677]."
