first: "عَلَيْهِنَّ وِلْدَانُ الرِّهَانِ كَأَنَّهَا"
second: "سَعَالٍ وَعِقْبَانٌ عَلَيْهَا الرَّحَائِلُ"
vocabulary:
  - term: "وِلْدَانُ الرِّهَانِ"
    text: "الغلمان الذين يركبون الخيل في السباق. وفي اللسان: «وَقَالَ لَبِيدٌ يَصِفُ الخَيل: عَلَيْهِنَّ وِلْدانُ الرِّجالِ» [@lisan، ج11 ص336]."
  - term: "سَعَالٍ"
    text: "«والسِّعْلاةُ والسِّعْلا: الغُولُ، وَقِيلَ: هِيَ سَاحِرَةُ الجِنِّ» [@lisan، ج11 ص336]."
  - term: "الرَّحَائِلُ"
    text: "جمع رِحالة: «وَهُوَ أَكبر مِنَ السَّرْج ويُغَشَّى بِالْجُلُودِ وَيَكُونُ لِلْخَيْلِ» [@lisan، ج11 ص276]."
