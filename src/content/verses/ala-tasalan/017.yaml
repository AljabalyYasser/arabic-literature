explained: false
first: "تَكُرُّ عَلَيْهِ لَا يُصَرَّدُ شُرْبُهُ"
second: "إِذَا مَا انْتَشَى لَمْ تَحْتَضِرْهُ الْعَوَاذِلُ"
vocabulary:
  - term: "لَا يُصَرَّدُ"
    text: "لا يُقلَّل: «والتَّصريدُ: سَقْيٌ دُونَ الرَّيِّ» [@lisan، ج3 ص249]."
  - term: "لَمْ تَحْتَضِرْهُ الْعَوَاذِلُ"
    text: "لم يحضره اللوّام. ويقول المحقق في العواذل: «يلومونه على أنه أفاض في السخاء حتى خرج عن الحد المعقول» [@diwan-labid، ص259]."
