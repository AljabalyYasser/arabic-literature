explained: false
first: "حَبَائِلُهُ مَبْثُوثَةٌ بِسَبِيلِهِ"
second: "وَيَفْنَى إِذَا مَا أَخْطَأَتْهُ الْحَبَائِلُ"
vocabulary:
  - term: "حَبَائِلُهُ"
    text: "حبائل الموت، أي أسبابه. في الخزانة: «الحبائل: جمع حبالة وَهِي الشّرك وَالضَّمِير للْمَوْت وَأَرَادَ بحبائله: الْأَحْدَاث الَّتِي هِيَ سَبَب الْمَوْت» [@khizana، ج2 ص253]."
  - term: "مَبْثُوثَةٌ"
    text: "«منصوبةٌ على طرقه» [@khizana، ج2 ص253]."
  - term: "وَيَفْنَى"
    text: "«ويفنى: يهرم» [@khizana، ج2 ص253]: فإن أخطأته أسباب الموت أدركه الهرم."
