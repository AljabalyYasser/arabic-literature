explained: false
first: "بِذِي حُسُمٍ قَدْ عُرِّيَتْ وَيَزِينُهَا"
second: "دِمَاثُ فُلَيْجٍ رَهْوُهَا فَالْمَحَافِلُ"
vocabulary:
  - term: "بِذِي حُسُمٍ"
    text: "موضع: «وَقَالَ ثَعْلَبٌ: حِسْمَى وحُسُمٌ وَذُو حُسُمٍ وحُسَمٌ وحاسِمٌ مَوَاضِعُ بِالْبَادِيَةِ» [@lisan، ج12 ص135]."
  - term: "دِمَاثُ"
    text: "«والدَّمْثُ: السُّهول مِنَ الأَرض، وَالْجَمْعُ أَدْماث ودِماثٌ» [@lisan، ج2 ص149]. وفُلَيْج موضع."
  - term: "رَهْوُهَا فَالْمَحَافِلُ"
    text: "يقول المحقق إن الرهو «حفير يجمع فيه الماء» [@diwan-labid، ص261]. والمحافل: مجتمعات الماء، «ومَحْفِل الْمَاءِ: مُجْتَمَعُه» [@lisan، ج11 ص157]."
