first: "وَبِيضٍ تَرَبَّتْهَا الْهَوَادِجُ حِقْبَةً"
second: "سَرَائِرُهَا وَالْمُسْمِعَاتُ الرَّوَافِلُ"
vocabulary:
  - term: "سَرَائِرُهَا"
    text: "يقول المحقق: «جمع سرارة وهي أكرم شيء في الوادي وهي هنا بمعنى أواسط الهوادج، أي أنهن مصونات فيهن» [@diwan-labid، ص264]."
  - term: "الْمُسْمِعَاتُ"
    text: "«والمُسْمِعةُ: المُغَنِّيةُ» [@lisan، ج8 ص165]."
  - term: "الرَّوَافِلُ"
    text: "اللواتي يجررن ذيولهن: «الرَّفْل جَرُّ الذَّيْلِ ورَكْضُه بالرِّجْل» [@lisan، ج11 ص291]."
