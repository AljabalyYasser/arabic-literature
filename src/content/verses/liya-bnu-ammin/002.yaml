explained: false
first: "أَزْرَى بِنَا أَنَّنَا شَالَتْ نَعَامَتُنَا"
second: "فَخَالَنِي دُونَهُ وَخِلْتُهُ دُونِي"
vocabulary:
  - term: "أَزْرَى بِنَا"
    text: "في حاشية المحققين: «أزرى به: قصر به، وزرى عليه: عابه» [@mufaddaliyyat، ص160، الحاشية]. أي أضرّ بنا وحطّ من شأننا."
  - term: "شَالَتْ نَعَامَتُنَا"
    text: "في حاشية المحققين: «شالت نعامتنا: تفرق أمرنا واختلفنا» [@mufaddaliyyat، ص160، الحاشية]."
  - term: "فَخَالَنِي دُونَهُ"
    text: "ظنّني أدنى منه منزلة، وظننته أدنى مني."
