explained: false
first: "عَفٌّ يَؤُوسٌ إِذَا مَا خِفْتُ مِنْ بَلَدٍ"
second: "هُونًا فَلَسْتُ بِوَقَّافٍ عَلَى الْهُونِ"
vocabulary:
  - term: "يَؤُوسٌ"
    text: "في حاشية المحققين: «يؤوس: يقول: لست بذي طمع، أيئس مما في يدي غيري فلا تتبعه نفسي» [@mufaddaliyyat، ص160، الحاشية]."
  - term: "هُونًا ... الْهُونِ"
    text: "الهون: الهوان والذل. يقول: إذا خفت في بلد ذلًّا رحلت عنه ولم أقم عليه."
