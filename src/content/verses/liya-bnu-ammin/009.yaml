explained: false
first: "عَنِّي إِلَيْكَ فَمَا أُمِّي بِرَاعِيَةٍ"
second: "تَرْعَى الْمَخَاضَ وَمَا رَأْيِي بِمَغْبُونِ"
vocabulary:
  - term: "عَنِّي إِلَيْكَ"
    text: "كلمة زجر، أي ابتعد عني."
  - term: "بِرَاعِيَةٍ ... تَرْعَى الْمَخَاضَ"
    text: "في حاشية المحققين: «أي لست ابن أمة، ويقال إنه تعريض به، لأنه كان ابن أمة» [@mufaddaliyyat، ص160، الحاشية]. والمخاض: الحوامل من النوق."
  - term: "بِمَغْبُونِ"
    text: "في حاشية المحققين: «المغبون: المنتقص» [@mufaddaliyyat، ص160، الحاشية]."
