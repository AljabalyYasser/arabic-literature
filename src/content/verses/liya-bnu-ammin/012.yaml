first: "وَأَنْتُمُ مَعْشَرٌ زَيْدٌ عَلَى مِائَةٍ"
second: "فَأَجْمِعُوا أَمْرَكُمْ كُلًّا فَكِيدُونِي"
vocabulary:
  - term: "زَيْدٌ"
    text: "في حاشية المحققين: «زيد، بفتح الزاي وكسرها: زيادة» [@mufaddaliyyat، ص161، الحاشية]. أي أنتم أكثر من مئة."
  - term: "فَأَجْمِعُوا أَمْرَكُمْ"
    text: "اعزموا عليه واتفقوا."
