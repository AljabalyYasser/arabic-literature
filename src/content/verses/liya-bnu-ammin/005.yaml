first: "وَلَا تَقُوتُ عِيَالِي يَوْمَ مَسْغَبَةٍ"
second: "وَلَا بِنَفْسِكَ فِي الْعَزَّاءِ تَكْفِينِي"
vocabulary:
  - term: "تَقُوتُ"
    text: "تطعم وتعول."
  - term: "مَسْغَبَةٍ"
    text: "في حاشية المحققين: «المسغبة: المجاعة» [@mufaddaliyyat، ص160، الحاشية]."
  - term: "الْعَزَّاءِ"
    text: "في حاشية المحققين: «العزاء: الضيق والشدة» [@mufaddaliyyat، ص160، الحاشية]. أي لا تقوم مقامي بنفسك في الحرب."
