    text: "في اللسان: «الشِّيمةُ: الخُلُقُ. والشِّيمةُ: الطَّبِيعَةُ» [@lisan، ج12 ص329]."
  - term: "تَخَالَقَ"
    text: "تكلّف أخلاقًا ليست من طبعه."
