first: "لَا يُخْرِجُ الْكَرْهُ مِنِّي غَيْرَ مَأْبِيَةٍ"
second: "وَلَا أَلِينُ لِمَنْ لَا يَبْتَغِي لِينِي"
vocabulary:
  - term: "الْكَرْهُ ... مَأْبِيَةٍ"
    text: "في حاشية المحققين: «الكره: الإكراه. المأبية: الإباء» [@mufaddaliyyat، ص161، الحاشية]. أي إذا أُكرهت لم يزدني الإكراه إلا امتناعًا."
