first: "قَدْ كُنْتُ أُوتِيكُمُ نُصْحِي وَأَمْنَحُكُمْ"
second: "وُدِّي عَلَى مُثْبَتٍ فِي الصَّدْرِ مَكْنُونِ"
vocabulary:
