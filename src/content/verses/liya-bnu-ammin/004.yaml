explained: false
first: "لَاهِ ابْنُ عَمِّكَ لَا أَفْضَلْتَ فِي حَسَبٍ"
second: "عَنِّي وَلَا أَنْتَ دَيَّانِي فَتَخْزُونِي"
vocabulary:
  - term: "لَاهِ ابْنُ عَمِّكَ"
    text: "في حاشية المحققين: «لاه ابن عمك: أراد: لله ابن عمك، فحذف اللام الخافضة اكتفاء بالتي تليها» [@mufaddaliyyat، ص160، الحاشية]. وهي كلمة تعجّب، كأنه يقول: لله درّ ابن عمك."
  - term: "لَا أَفْضَلْتَ فِي حَسَبٍ"
    text: "أي لم تزد عليّ في الحسب، وهو الشرف الموروث."
  - term: "دَيَّانِي فَتَخْزُونِي"
    text: "في حاشية المحققين: «الديان: القائم بالأمر القاهر. خزاه يخزوه: إذا ساسه ودبر أمره» [@mufaddaliyyat، ص160، الحاشية]."
