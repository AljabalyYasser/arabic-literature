explained: false
first: "يَا عَمْرُو إِنْ لَا تَدَعْ شَتْمِي وَمَنْقَصَتِي"
second: "أَضْرِبْكَ حَيْثُ تَقُولُ الْهَامَةُ اسْقُونِي"
vocabulary:
  - term: "وَمَنْقَصَتِي"
    text: "عيبي وانتقاصي."
  - term: "الْهَامَةُ اسْقُونِي"
    text: "في حاشية المحققين: «الهامة: الرأس، قال الأصمعي: العرب تقول العطش في الرأس. وقال غيره: يقال إن الرجل إذا قتل فلم يدرك بثأره خرجت هامة من قبره فلا تزال تصيح اسقوني اسقوني، حتى يقتل قاتله» [@mufaddaliyyat، ص160، الحاشية]. فهو يتوعّده بضربة في رأسه تقتله."
