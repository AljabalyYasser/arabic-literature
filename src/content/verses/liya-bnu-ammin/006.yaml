first: "إِنِّي لَعَمْرُكَ مَا بَابِي بِذِي غَلَقٍ"
second: "عَنِ الصَّدِيقِ وَلَا خَيْرِي بِمَمْنُونِ"
vocabulary:
  - term: "غَلَقٍ"
    text: "ما يُغلق به الباب، أي بابي مفتوح للصديق."
  - term: "بِمَمْنُونِ"
    text: "في حاشية المحققين: «الممنون: المقطوع ههنا، أي: لا أقطع عنه فضلي» [@mufaddaliyyat، ص160، الحاشية]."
