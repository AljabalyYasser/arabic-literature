first: "ضَيِّقُ الصَّدْرِ بِالْخِيَانَةِ لَا يَنْـ"
second: "ـقُصُ فَقْرِي أَمَانَتِي مَا بَقِيتُ"
vocabulary:
  - term: "ضَيِّقُ الصَّدْرِ بِالْخِيَانَةِ"
    text: "لا يطيقها ولا يحتملها."
  - term: "لَا يَنْقُصُ فَقْرِي أَمَانَتِي"
    text: "لا يحملني الفقر على أن أخون ما ائتُمنت عليه."
