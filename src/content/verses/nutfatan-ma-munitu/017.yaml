first: "بَلْ لِكُلٍّ مِنْ رِزْقِهِ مَا قَضَى اللَّـ"
second: "ـهُ وَإِنْ حَكَّ أَنْفَهُ الْمُسْتَمِيتُ"
vocabulary:
  - term: "حَكَّ أَنْفَهُ"
    text: "كناية عن الغضب والإلحاح في الطلب."
  - term: "الْمُسْتَمِيتُ"
    text: "الذي يطلب الشيء طلب من لا يبالي بالموت."
