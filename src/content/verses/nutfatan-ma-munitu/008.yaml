explained: false
first: "لَيْتَ شِعْرِي وَأَشْعُرَنَّ إِذَا مَا"
second: "قِيلَ إِقْرَأْ عُنْوَانَهَا وَقَرِيتُ"
vocabulary:
  - term: "لَيْتَ شِعْرِي"
    text: "«ليتنى أشعر، أى أعلم» كما يقول المحققان [@asmaiyyat، ص86، الحاشية]."
  - term: "إِقْرَأْ"
    text: "اقرأ، «قطع همزة الوصل للشعر» [@asmaiyyat، ص86، الحاشية]."
  - term: "عُنْوَانَهَا"
    text: "عنوان صحيفته، يعني كتاب أعماله يوم الحساب."
  - term: "وَقَرِيتُ"
    text: "«قرأت بإبدال الهمزة ياء» [@asmaiyyat، ص86، الحاشية]."
