explained: false
first: "أَلَا قَاتَلَ اللَّهُ الطُّلُولَ الْبَوَالِيَا"
second: "وَقَاتَلَ ذِكْرَاكَ السِّنِينَ الْخَوَالِيَا"
vocabulary:
- term: "قَاتَلَ اللَّهُ"
  text: "دعاء يُراد به التعجب: «وقوله: قاتل الله تعجب»، والمعنى: «قاتلها الله ما أجلبها للأحزان وأبعثها للشوق» [@diwan-antara، ص224]."
- term: "الطُّلُولَ الْبَوَالِيَا"
  text: "آثار الديار التي بليت، جمع طَلَل، «والطَّلل: مَا شَخَص مِنْ آثَارِ الدِّيَارِ» [@lisan، ج11 ص406]."
- term: "ذِكْرَاكَ السِّنِينَ الْخَوَالِيَا"
  text: "«أي قاتل الله تذكرك ما كنت فيه من النعمة والسرور في السنين الخالية» [@diwan-antara، ص224]."
