explained: false
first: "فَمَا وَجَدُونَا بِالْفَرُوقِ أُشَابَةً"
second: "وَلَا كُشُفًا وَلَا دُعِينَا مَوَالِيَا"
vocabulary:
- term: "أُشَابَةً"
  text: "«والاشابة الأخلاط، أي لم يختلط بنا غيرنا» [@diwan-antara، ص227]."
- term: "كُشُفًا"
  text: "«أي لا ينكشف عند اللقاء أي ينهزم» [@diwan-antara، ص227]."
- term: "مَوَالِيَا"
  text: "«والموالي هنا الحلفاء»، أي لا حاجة بهم إلى محالفة غيرهم [@diwan-antara، ص227]."
sources:
- source: "diwan-antara"
  loc: "ص227"
