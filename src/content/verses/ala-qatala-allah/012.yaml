first: "وَأَنَّا نَقُودُ الْخَيْلَ حَتَّى رُؤُوسُهَا"
second: "رُؤُوسُ نِسَاءٍ لَا يَجِدْنَ فَوَالِيَا"
vocabulary:
- term: "لَا يَجِدْنَ فَوَالِيَا"
  text: "لا يجدن من يفلي رؤوسهن. قال الأَعْلَم: «شعثت رؤوس خيلنا، وتغيرت نواصيها لطول الغزو»، فصارت كرؤوس نساء «لا يفلين ولا يمتشطن» [@diwan-antara، ص227]."
