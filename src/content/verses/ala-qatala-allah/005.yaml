explained: false
first: "عَوَالِيَ زُرْقًا مِنْ رِمَاحِ رُدَيْنَةٍ"
second: "هَرِيرَ الْكِلَابِ يَتَّقِينَ الْأَفَاعِيَا"
vocabulary:
- term: "زُرْقًا"
  text: "«الزرق المصقولة الصافية» [@diwan-antara، ص225]."
- term: "رُدَيْنَةٍ"
  text: "«وردينة امرأة تنسب إليها» الرماح، «ويقال: هي جزيرة بالبحرين ترفأ إليها السفن» [@diwan-antara، ص225]."
- term: "هَرِيرَ الْكِلَابِ"
  text: "«أراد حتى تهروا العواليا هرير الكلاب، وهريرها صوتها، وإنما تصوت إذا كرهت شيئا» [@diwan-antara، ص225]."
- term: "يَتَّقِينَ الْأَفَاعِيَا"
  text: "«ضرب هذا مثلا، أي، نحن لهم كالأفاعي يتقوننا فيهرون كما تهر الكلاب خوفا من الأفاعي» [@diwan-antara، ص225]."
sources:
