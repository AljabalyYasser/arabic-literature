explained: false
first: "أَبَيْنَا أَبَيْنَا أَنْ تَضِبَّ لِثَاتُكُمْ"
second: "عَلَى مُرْشِفَاتٍ كَالظِّبَاءِ عَوَاطِيَا"
vocabulary:
- term: "تَضِبَّ لِثَاتُكُمْ"
  text: "تسيل أفواهكم شهوة: «وأبينا أن تسيل لثاتكم من شدة الحرص وغلبة الشهوة»، والمعنى: «أي منعنا نساءنا منكم» [@diwan-antara، ص226]."
- term: "مُرْشِفَاتٍ"
  text: "«يعني نساء طوالا، وأصل المرشفات الظباء تمد أعناقها وتنظر» [@diwan-antara، ص226]."
- term: "عَوَاطِيَا"
  text: "«والعواطي من الظباء هي التي تقوم على أرجلها وتعطو بأيديها» ثمر الشجر، أي تتناوله [@diwan-antara، ص226]."
sources:
