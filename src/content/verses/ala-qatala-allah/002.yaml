explained: false
first: "وَقَوْلَكَ لِلشَّيْءِ الَّذِي لَا تَنَالُهُ"
second: "إِذَا مَا هُوَ احْلَوْلَى أَلَا لَيْتَ ذَا لِيَا"
vocabulary:
- term: "احْلَوْلَى"
  text: "حلا وطاب، «من قولك: حلا الشيء بعيني إذا سررت به. وفي قوله: احلولى معنى المبالغة والكثرة» [@diwan-antara، ص224]."
- term: "أَلَا لَيْتَ ذَا لِيَا"
  text: "ليت هذا الشيء لي. والمعنى: «وقاتل قولك للشيء تحبه ولا تناله: ليت ذا ليا» [@diwan-antara، ص224]."
sources:
