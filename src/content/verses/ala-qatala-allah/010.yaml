first: "وَقُلْتُ لَهُمْ رُدُّوا الْمُغِيرَةَ عَنْ هَوًى"
second: "سَوَابِغَهَا وَأَقْبِلُوهَا النَّوَاصِيَا"
vocabulary:
- term: "الْمُغِيرَةَ ... سَوَابِغَهَا"
  text: "«أي ردوا الخيل التي تريد الغارة، وسوابغها ما سبق منها وتقدم» [@diwan-antara، ص227]."
- term: "أَقْبِلُوهَا النَّوَاصِيَا"
  text: "«أي اجعلوا نواصي خيلكم مقابلة نواصي خيلهم، والناصية الشعر الذي بين الأذنين» [@diwan-antara، ص227]."
