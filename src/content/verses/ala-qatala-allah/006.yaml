explained: false
first: "تَفَادَيْتُمُ أَسْتَاهَ نِيبٍ تَجَمَّعَتْ"
second: "عَلَى رِمَّةٍ مِنَ الْعِظَامِ تَفَادِيَا"
vocabulary:
- term: "تَفَادَيْتُمُ"
  text: "«أي جعل بعضكم يتقي الرماح ببعض» [@diwan-antara، ص225]."
- term: "أَسْتَاهَ نِيبٍ"
  text: "أعجاز النوق المسنّة، والنِّيب «جمع ناب وهي الناقة» المسنّة، يشبّههم بها في الجبن، كما يقول الأَعْلَم: «أنتم من الجبن كذلك» [@diwan-antara، ص225]."
- term: "رِمَّةٍ"
  text: "«والرمة العظام البالية»، والإبل تجتمع عليها، «فيضرب بها المثل في طلب ما لا يعود بطائل» [@diwan-antara، ص225]."
sources:
