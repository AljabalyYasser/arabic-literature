first: "تَعَالَوْا إِلَى مَا تَعْلَمُونَ فَإِنَّنِي"
second: "أَرَى الدَّهْرَ لَا يُنْجِي مِنَ الْمَوْتِ نَاجِيَا"
vocabulary:
- term: "مَا تَعْلَمُونَ"
  text: "«يريد ما تعلمون منا من شدة الحرب» [@diwan-antara، ص227]، ويقول: «هذا حثا على الإقدام، أي لا نبالي بالموت، إذ لا بد منه» [@diwan-antara، ص228]."
