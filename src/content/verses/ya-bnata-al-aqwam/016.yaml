first: "إِنَّنِي قَاتِلَةٌ مَقْتُولَةٌ"
second: "وَلَعَلَّ اللَّهَ أَنْ يَرْتَاحَ لِي"
vocabulary:
  - term: "قَاتِلَةٌ مَقْتُولَةٌ"
    text: "قاتلة لأن القاتل أخوها، ومقتولة لأن القتيل زوجها."
  - term: "يَرْتَاحَ لِي"
    text: "يرحمني ويفرّج عني."
