first: "إِنَّنِي قَاتِلَةٌ مَقْتُولَةٌ"
second: "وَلَعَلَّ اللَّهَ أَنْ يَرْتَاحَ لِي"
meaning: "أنا القاتلة، لأن القاتل أخي، وأنا المقتولة، لأن القتيل زوجي. ولعل الله يرحمني ويكشف ما بي."
vocabulary:
  - term: "قَاتِلَةٌ مَقْتُولَةٌ"
    text: "قاتلة لأن القاتل أخوها جَسّاس، ومقتولة لأن القتيل زوجها كُلَيْب."
  - term: "يَرْتَاحَ لِي"
    text: "يرحمني ويفرّج عني، كأن رحمته تنزل عليها راحةً بعد الشدة."
context: "خاتمة القصيدة في رواية «الأغاني» [@aghani، ج5 ص69]، بعد أن قالت إن إدراك الثأر لا يشفيها، فإن أدركه قوم زوجها قُتل أخوها. فتجمع حالها كلها في شطر: هي في الفريقين معًا، ولا تخرج من الحرب سالمة أيًّا كان الغالب. ويرويها ابن رَشِيق في باب الرثاء في وسط القصيدة، بعد بيت «تحمل العين قذى العين»، وقبل «يا قتيلًا قوّض الدهر به»، وبلفظ «فلعل الله» [@ibn-rashiq، ج2 ص154]، ويقول قبل أن يرويها: «ما أشجى لفظها، وأظهر الفجيعة فيه!» [@ibn-rashiq، ج2 ص153]. ونسبة القصيدة إلى جَلِيلة «منسوب»، لأن خبرها وشعرها من رواية الشَّرْقِيّ بن القُطامِيّ وحده [@aghani، ج5 ص67]."
syntax:
  - "«إِنَّنِي»: «إنّ» حرف توكيد، والنون الثانية نون الوقاية، والياء اسمها، و«قَاتِلَةٌ» خبرها، و«مَقْتُولَةٌ» خبر ثانٍ بلا عاطف."
  - "«وَلَعَلَّ اللَّهَ»: الواو عاطفة، و«لعلّ» حرف ترجٍّ، ولفظ الجلالة اسمها."
  - "«أَنْ يَرْتَاحَ لِي»: «أن» والفعل في تأويل مصدر خبر «لعلّ». ودخول «أن» على خبر «لعلّ» قليل، حملًا لها على «عسى» التي يكثر في خبرها «أن»."
morphology:
  - "«قاتلة» اسم فاعل، و«مقتولة» اسم مفعول من الفعل نفسه «قتل»، فالكلمتان من مادة واحدة، والفرق بينهما في الصيغة وحدها."
  - "«يَرْتَاح» مضارع «ارتاح» على «افتعل» من «الرَّوْح»، أصله «ارْتَوَح» قُلبت الواو ألفًا."
rhetoric:
  thesis: "بيت يحمل القصيدة كلها في شطر: امرأة هي القاتل والقتيل معًا."
  devices:
    - title: "الطباق في «قاتلة مقتولة»"
      text: "جمعت الضدّين في كلمتين متتاليتين بلا عاطف: اسم الفاعل واسم المفعول من «قتل». والطباق الجمع بين معنيين متقابلين. والمعنيان هنا لا يجتمعان في شخص واحد إلا في حالها هي: أخوها قتل زوجها."
    - title: "المجاز في نسبة القتل إليها"
      text: "لم تقتل ولم تُقتل، لكنها نسبت إلى نفسها فعل أخيها وموت زوجها، لأنها تحمل الاثنين. وهذا من المجاز الذي يجعله عبد القاهر في الإسناد لا في اللفظ: «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]. فالكلمتان «قاتلة» و«مقتولة» على معناهما، والتجوز في جعلهما خبرًا عنها."
    - title: "الانتقال إلى الرجاء"
      text: "بعد صدر لا مخرج فيه، يأتي العجز بالترجّي: «وَلَعَلَّ اللَّهَ». فالقصيدة التي بدأت بالردّ على اللائمة تنتهي بالالتجاء إلى الله، لأن الناس لا يملكون لها شيئًا."
  connection: "آخر القصيدة في رواية «الأغاني»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام المكسورة، يتبعها وصل بالياء"
  scansion: "إِنْنَنِي قَا / تِلَتُنْ مَقْ / تُولَتُنْ = فاعلاتن / فعِلاتن / فاعلن — وَلَعَلْلَلْ / لَاهَ أَنْ يَرْ / تَاحَ لِي = فعِلاتن / فاعلاتن / فاعلن"
  note: "عروض الرمل وضربه محذوفان «فاعلن» [@atiq، ص80]. ودخل الخبن «فاعلاتن» الثانية في الصدر والأولى في العجز فصارت «فعِلاتن»، والخبن حذف الثاني الساكن [@atiq، ص79–80]."
