explained: false
first: "وَرَمَانِي قَتْلُهُ مِنْ كَثَبٍ"
second: "رَمْيَةَ المُصْمِي بِهِ المُسْتَأْصِلِ"
vocabulary:
  - term: "مِنْ كَثَبٍ"
    text: "من قُرب."
  - term: "المُصْمِي"
    text: "الذي يقتل رميته في مكانها: «وأصميت الصيد إذا رميته فقتلته وأنت تراه» [@lisan، ج14 ص469]."
  - term: "المُسْتَأْصِلِ"
    text: "الذي يقتلع الشيء من أصله."
