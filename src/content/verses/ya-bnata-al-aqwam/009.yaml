explained: false
first: "هَدَمَ البَيْتَ الَّذِي اسْتَحْدَثْتُهُ"
second: "وَانْثَنَى فِي هَدْمِ بَيْتِي الأَوَّلِ"
vocabulary:
  - term: "اسْتَحْدَثْتُهُ"
    text: "اتخذته حديثًا، تعني بيت زوجيتها؛ «الحديث: نقيض القديم» [@lisan، ج2 ص131]."
  - term: "انْثَنَى"
    text: "انعطف، أي عاد؛ «وانثنى أي انعطف» [@lisan، ج14 ص116]."
  - term: "بَيْتِي الأَوَّلِ"
    text: "بيت أبيها وقومها."
