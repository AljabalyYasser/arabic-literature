first: "يَا نِسَائِي دُونَكُنَّ اليَوْمَ قَدْ"
second: "خَصَّنِي الدَّهْرُ بِرُزْءٍ مُعْضِلِ"
vocabulary:
  - term: "دُونَكُنَّ"
    text: "اسم فعل بمعنى: خذن، أي انظرن إلى حالي."
  - term: "رُزْءٍ"
    text: "مصيبة."
  - term: "مُعْضِلِ"
    text: "شديد لا مخرج منه."
