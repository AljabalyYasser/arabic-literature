first: "يَا قَتِيلًا قَوَّضَ الدَّهْرُ بِهِ"
second: "سَقْفَ بَيْتَيَّ جَمِيعًا مِنْ عَلِ"
vocabulary:
  - term: "قَوَّضَ"
    text: "«قوض البناء: نقضه من غير هدم» [@lisan، ج7 ص224]."
  - term: "بَيْتَيَّ"
    text: "مثنى بيت مضاف إلى المتكلمة: بيت زوجها وبيت أبيها."
  - term: "مِنْ عَلِ"
    text: "من فوق."
