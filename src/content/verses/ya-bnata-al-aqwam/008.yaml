first: "يَا قَتِيلًا قَوَّضَ الدَّهْرُ بِهِ"
second: "سَقْفَ بَيْتَيَّ جَمِيعًا مِنْ عَلِ"
meaning: "يا أيها القتيل الذي هدم الدهر بمقتله سقف بيتيّ معًا من فوق: بيت زوجي، وبيت أبي وقومي."
vocabulary:
  - term: "قَوَّضَ"
    text: "«قوض البناء: نقضه من غير هدم» [@lisan، ج7 ص224]، أي فكّه وأسقطه."
  - term: "بِهِ"
    text: "بسببه، أي بقتله."
  - term: "بَيْتَيَّ"
    text: "مثنى بيت مضاف إلى المتكلمة: بيت زوجها كُلَيْب، وبيت أبيها مُرّة وأخيها جَسّاس، كما تفسّره في البيت التالي."
  - term: "مِنْ عَلِ"
    text: "من فوق، وهي «من علِ» في قول امرئ القَيْس: «كجلمود صخر حطّه السيل من علِ»."
context: "أول المقطع الذي ترثي فيه زوجها بعد أن ردّت على أخته اللائمة، ويفسّره البيت التالي: «هدم البيت الذي استحدثته / وانثنى في هدم بيتي الأول» [@aghani، ج5 ص68]. فقتل كُلَيْب هدم بيت زوجيتها في الحال، وسيهدم بيت قومها بالثأر الذي لا بد منه. وعند ابن رَشِيق يأتي هذا البيت بعد «إنني قاتلة مقتولة» مباشرة، بعد أن ذكرها في باب الرثاء وقال: «ما أشجى لفظها، وأظهر الفجيعة فيه!» [@ibn-rashiq، ج2 ص153–154]."
syntax:
  - "«يَا» حرف نداء، و«قَتِيلًا» منادى منصوب، لأنه نكرة موصوفة بالجملة بعدها، فهو شبيه بالمضاف."
  - "«قَوَّضَ الدَّهْرُ» فعل وفاعل، و«بِهِ» متعلق بـ«قوّض»، والباء للسببية، و«سَقْفَ» مفعول به، و«بيتيَّ» مضاف إليه، والجملة صفة لـ«قتيلًا»."
  - "«بَيْتَيَّ» مثنى مجرور بالياء، حُذفت نونه للإضافة، وأُدغمت ياؤه في ياء المتكلمة المفتوحة."
  - "«جَمِيعًا» حال من «بيتيّ»، أي معًا. و«مِنْ عَلِ» جار ومجرور متعلق بـ«قوّض»."
morphology:
  - "«قَوَّضَ» على «فعّل»، والتضعيف للتكثير: نقضه شيئًا بعد شيء."
  - "«قَتِيل» على «فَعِيل» بمعنى «مفعول»، أي مقتول."
  - "«عَلِ» ظرف بمعنى «فوق»، يُستعمل مع «مِن»، وفيه لغات: من علُ، ومن علوُ، ومن عالٍ [@zawzani، ص64]."
rhetoric:
  thesis: "صورة تجمع فاجعة جَلِيلة كلها: قتيل واحد يهدم بيتين."
  devices:
    - title: "الاستعارة في «سقف بيتيّ»"
      text: "البيت هنا الأسرة، وسقفه ما يحميها ويظلّها. فجعلت قتل كُلَيْب هدمًا للسقف من فوق، فلا يبقى لساكني البيت ما يسترهم. وهي الاستعارة التي يقول فيها عبد القاهر: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "إسناد الهدم إلى الدهر"
      text: "القاتل أخوها جَسّاس، لكنها قالت «قَوَّضَ الدَّهْرُ»، فأسندت الفعل إلى الزمان. وهذا ما يسمّيه عبد القاهر المجاز الحكمي: «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]، أي في إسناد الفعل إلى غير فاعله. وفي هذا الإسناد تتجنب أن تسمّي أخاها قاتلًا في هذا البيت، وهذه قراءتنا."
    - title: "التثنية في «بيتيّ»"
      text: "كلمة واحدة تحمل حالها كلها: امرأة لها بيتان، والقتيل هدمهما «جميعًا». ثم تفصّل ذلك في البيت التالي، فيكون هذا البيت إجمالًا وما بعده تفصيلًا."
  connection: "ثم تفصّل البيتين: «هدم البيت الذي استحدثته / وانثنى في هدم بيتي الأول»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام المكسورة، يتبعها وصل بالياء"
  scansion: "يَا قَتِيلَنْ / قَوْوَضَدْدَهْ / رُ بِهِي = فاعلاتن / فاعلاتن / فعِلن — سَقْفَ بَيْتَيْ / يَ جَمِيعَنْ / مِنْ عَلِي = فاعلاتن / فعِلاتن / فاعلن"
  note: "وزن الرمل «فاعلاتن فاعلاتن فاعلن» في كل شطر، وعَرُوضه وضربه محذوفان: «فاعلن» [@atiq، ص80]. ودخل الخبن العروض فصارت «فعِلن»، وهو جائز فيها [@atiq، ص80]، ودخل «فاعلاتن» الثانية في العجز فصارت «فعِلاتن». وتُشبع كسرة هاء «بِهِ» فتُنطق «بِهِي»."
