first: "إِنْ تَكُنْ أُخْتُ امْرِئٍ لِيمَتْ عَلَى"
second: "شَفَقٍ مِنْهَا عَلَيْهِ فَافْعَلِي"
vocabulary:
  - term: "لِيمَتْ"
    text: "لامها الناس."
  - term: "شَفَقٍ"
    text: "إشفاق وحنوّ. تقول: إن كانت الأخت تُلام على حنوّها على أخيها فلوميني."
