explained: false
first: "تَحْمِلُ العَيْنُ قَذَى العَيْنِ كَمَا"
second: "تَحْمِلُ الأُمُّ أَذَى مَا تَفْتَلِي"
vocabulary:
  - term: "قَذَى"
    text: "ما يقع في العين فيؤذيها."
  - term: "تَفْتَلِي"
    text: "من فَلْي الرأس، وهو تنقيته من القمل: «وفليت رأسه من القمل» [@lisan، ج15 ص163]. فالأم تحتمل أذى الصغير الذي تفلي رأسه وتقوم عليه، وجَلِيلة تحتمل أذى أخيها كذلك."
