explained: false
first: "لَوْ بِعَيْنٍ فُقِئَتْ عَيْنِي سِوَى"
second: "أُخْتِهَا فَانْفَقَأَتْ لَمْ أَحْفِلِ"
vocabulary:
  - term: "فُقِئَتْ"
    text: "شُقّت فسال ماؤها."
  - term: "لَمْ أَحْفِلِ"
    text: "لم أبالِ. تقول: لو أصاب عيني غيرُ أختها لهان الأمر، فالمصيبة أن القاتل أخي والقتيل زوجي."
sources:
