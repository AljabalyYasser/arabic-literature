first: "يَشْتَفِي المُدْرِكُ بِالثَّأْرِ وَفِي"
second: "دَرَكِي ثَأْرِيَ ثُكْلُ المُثْكِلِ"
vocabulary:
  - term: "المُدْرِكُ بِالثَّأْرِ"
    text: "الذي ينال ثأره."
  - term: "ثُكْلُ المُثْكِلِ"
    text: "الثُّكْل: فقد الحبيب. أي إن أُخذ بثأر زوجي فقدتُ أخي، فإدراك ثأري ثكل جديد."
