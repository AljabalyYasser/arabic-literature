explained: false
first: "أَحَامِيَكُمْ وَرَافِدَكُمْ تَرَكْتُمْ"
second: "لَدَى غَبْرَاءَ مُنْهَدِمٍ رَجَاهَا"
vocabulary:
- term: "وَرَافِدَكُمْ"
  text: "مُعطيكم، من الرِّفد: «والرِّفْدُ: الصِّلَةُ» [@lisan، ج3 ص181]."
- term: "غَبْرَاءَ"
  text: "الأرض، يعني القبر: «وَالْغَبْرَاءُ: الأَرض» [@lisan، ج4 ص245]."
- term: "رَجَاهَا"
  text: "في الشرح: «الرَّجا: جانب البئر، وجانب القبر» [@diwan-khansa، ص283]."
