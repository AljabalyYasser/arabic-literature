first: "فَتَى الْفِتْيَانِ مَا بَلَغُوا مَدَاهُ"
second: "وَلَا يُكْدِي إِذَا بَلَغَتْ كُدَاهَا"
vocabulary:
- term: "وَلَا يُكْدِي"
  text: "في الشرح: «قال أبو عمرو: ولا يمنع من سأله إذا منعوا» [@diwan-khansa، ص280]."
- term: "كُدَاهَا"
  text: "في الشرح: «وكُداها: أقصى ما عندها» [@diwan-khansa، ص281]."
