first: "فَمَنْ لِلضَّيْفِ إِنْ هَبَّتْ شَمَالٌ"
second: "مُزَعْزِعَةٌ تُنَاوِحُهَا صَبَاهَا"
vocabulary:
- term: "مُزَعْزِعَةٌ"
  text: "في الشرح: «المُزعزعة: المحرّكة لأطناب البيوت» [@diwan-khansa، ص282]."
- term: "تُنَاوِحُهَا"
  text: "في الشرح: «تناوحها: تقابلها وتواجهها» [@diwan-khansa، ص282]."
- term: "صَبَاهَا"
  text: "في الشرح: «قالوا: الصّبا أبرد ريح عندنا، والشمال مثلها» [@diwan-khansa، ص282]."
