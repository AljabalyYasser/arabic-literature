first: "عَلَى رَجُلٍ كَرِيمِ الْخِيمِ أَضْحَى"
second: "بِبَطْنِ حَفِيرَةٍ صَخِبٍ صَدَاهَا"
vocabulary:
- term: "الْخِيمِ"
  text: "الطبع والخُلُق."
- term: "حَفِيرَةٍ"
  text: "القبر."
- term: "صَدَاهَا"
  text: "في لسان العرب: «الصَّدَى: طائِرٌ يَصِيحُ فِي هامَةِ المَقْتُولِ إِذَا لَمْ يُثْأَرْ بِهِ، وَقِيلَ: هُوَ طائِرٌ يَخْرُجُ مِنْ رَأْسِهِ إِذَا بَلِيَ» [@lisan، ج14 ص454]."
