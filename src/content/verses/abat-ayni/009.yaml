first: "هُنَالِكَ إِنْ نَزَلْتَ بِبَيْتِ صَخْرٍ"
second: "قَرَى الْأَضْيَافَ شَحْمًا مِنْ ذُرَاهَا"
vocabulary:
- term: "قَرَى"
  text: "أطعم ضيفه."
- term: "ذُرَاهَا"
  text: "أسنمتها. في لسان العرب: «وذِرْوَةُ كلِّ شَيءٍ وذُرْوَتُه: أَعْلاهُ، والجَمْع الذُّرَى بِالضَّمِّ. وذِرْوة السَّنامِ والرأْسِ: أَشْرَفُهُما» [@lisan، ج14 ص284]."
