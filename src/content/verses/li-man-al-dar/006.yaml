first: "قَدْ دَنَا الْفِصْحُ فَالْوَلَائِدُ يَنْظِمْـ"
second: "ـنَ قُعُودًا أَكِلَّةَ الْمَرْجَانِ"
vocabulary:
  - term: "أَكِلَّةَ الْمَرْجَانِ"
    text: "جمع إكليل: «والإِكْلِيل: شِبْهُ عِصابة مزيَّنة بِالْجَوَاهِرِ». ويروي ابن منظور البيت عن ابن جني برواية «سِراعاً»، ويقول محققه: «البيت لحسَّان بن ثابت من قصيدة في مدح الغساسنة» [@lisan، ج11 ص595]."
