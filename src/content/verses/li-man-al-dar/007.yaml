explained: false
first: "يَجْتَنِينَ الْجَادِيَّ فِي نُقَبِ الرَّيْـ"
second: "ـطِ عَلَيْهَا مَجَاسِدُ الْكَتَّانِ"
vocabulary:
  - term: "الْجَادِيَّ"
    text: "الزعفران: «يُقَالُ لِلزَّعْفَرَانِ الرَّيْهُقانُ والجاديُّ والجِساد» [@lisan، ج3 ص121]."
  - term: "نُقَبِ"
    text: "جمع نُقْبة: «الْجَوْهَرِيُّ: النُّقْبة ثَوْبٌ كالإِزار» [@lisan، ج1 ص768]."
  - term: "مَجَاسِدُ"
    text: "ثياب مصبوغة: «وَالثَّوْبُ المُجَسَّد، وَهُوَ الْمُشَبَّعُ عُصْفُرًا أَو زَعْفَرَانًا» [@lisan، ج3 ص121]."
