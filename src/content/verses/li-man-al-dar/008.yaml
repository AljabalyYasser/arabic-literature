first: "لَا يُعَلَّلْنَ بِالْمَغَافِرِ وَالصَّمْـ"
second: "ـغِ وَلَا نَقْفِ حَنْظَلِ الشَّرْيَانِ"
vocabulary:
  - term: "الْمَغَافِرِ"
    text: "«المَغافِيرُ: صَمْغٌ يسِيل مِنْ شَجَرِ الْعُرْفُطِ حُلو» [@lisan، ج7 ص350]."
  - term: "الشَّرْيَانِ"
    text: "«والشَّرْيانُ والشِّرْيانُ، بِفَتْحِ الشِّينِ وَكَسْرِهَا: شجرٌ مِنْ عِضاه الْجِبَالِ يُعْمَلُ مِنْهُ القِسِيُّ» [@lisan، ج14 ص431]."
