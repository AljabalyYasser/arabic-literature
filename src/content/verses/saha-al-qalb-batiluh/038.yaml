explained: false
first: "دَفَعْتَ بِمَعْرُوفٍ مِنَ الْقَوْلِ صَائِبٍ"
second: "إِذَا مَا أَضَلَّ النَّاطِقِينَ مَفَاصِلُهْ"
vocabulary:
  - term: "دَفَعْتَ بِمَعْرُوفٍ"
    text: "«يريد: وربّ خصم دفعت بقول معروف» [@diwan-zuhayr، ص59]."
  - term: "أَضَلَّ النَّاطِقِينَ مَفَاصِلُهْ"
    text: "«أي: إذا لم يصب أحد مفصل هذا القول أصبته أنت، ودفعت به خصمك» … «ويقال للرجل، إذا أصاب حقيقة القول: طبّق المفصل. وهو مثل، وأصله أنّ الجزّار الحاذق إذا أراد القطع أصاب المفصل» [@diwan-zuhayr، ص59]."
