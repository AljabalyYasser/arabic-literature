explained: false
first: "صَحَا الْقَلْبُ عَنْ سَلْمَى وَأَقْصَرَ بَاطِلُهْ"
second: "وَعُرِّيَ أَفْرَاسُ الصِّبَا وَرَوَاحِلُهْ"
vocabulary:
  - term: "أَقْصَرَ بَاطِلُهْ"
    text: "كفّ عنه لهوه. يقول الأعلم: «صحا قلبه عن حبّ سلمى، وكفّ «باطله» أي: صباه ولهوه» [@diwan-zuhayr، ص45]."
  - term: "وَعُرِّيَ أَفْرَاسُ الصِّبَا وَرَوَاحِلُهْ"
    text: "«هذا مثل ضربه، أي: ترك الصبا وركوب الباطل. وتقدير لفظه: وعُرّي أفراس ورواحل، كنت أركبها في الصبا، وطلب اللهو» [@diwan-zuhayr، ص46]. والرواحل: الإبل، «مفردها: راحلة» كما يقول المحقق [@diwan-zuhayr، ص45]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص45–46"
    url: "https://archive.org/details/3917pdf/page/n45/mode/1up"
status: "review"
