explained: false
first: "يُهَدُّ لَهُ مَا دُونَ رَمْلَةِ عَالِجٍ"
second: "وَمَنْ أَهْلُهُ بِالْغَوْرِ زَالَتْ زَلَازِلُهْ"
vocabulary:
  - term: "يُهَدُّ لَهُ"
    text: "«أي: يكسر ويزلزل، من أجل هذا الجيش، لشدّته وكثرته، ما دون رملة عالج من الأرضين. و«عالج»: اسم رمل معروف» [@diwan-zuhayr، ص61]."
  - term: "بِالْغَوْرِ"
    text: "«ما سفل من أرض العرب. ومكّة وتهامة من الغور» [@diwan-zuhayr، ص62]."
  - term: "زَالَتْ زَلَازِلُهْ"
    text: "فيها عند الأعلم وجهان: «يجوز أن يكون إخبارًا عن الممدوح، والمعنى: أنه إذا حلّ الحليفان حوله زالت زلازله، أي: أمن واعتزّ»، «ويحتمل أن يكون راجعًا على «من»، والتقدير: ومن أهله بالغور زالت به الزلازل، أي: أخذته زلزلة، من رعب ذلك الجيش» [@diwan-zuhayr، ص62]."
sources:
