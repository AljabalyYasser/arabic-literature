first: "وَقُلْتُ تَعَلَّمْ أَنَّ لِلصَّيْدِ غِرَّةً"
second: "وَإِلَّا تُضَيِّعْهَا فَإِنَّكَ قَاتِلُهْ"
vocabulary:
  - term: "تَعَلَّمْ"
    text: "«أي: اعلم. ولا يصرّف منها فعل في غير الأمر» [@diwan-zuhayr، ص53]."
  - term: "غِرَّةً"
    text: "«الغفلة، وأن يؤتى من حيث لا يشعر» [@diwan-zuhayr، ص53]."
