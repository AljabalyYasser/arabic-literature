explained: false
first: "وَأَهْلِ خِبَاءٍ صَالِحٍ ذَاتُ بَيْنِهِمْ"
second: "قَدِ احْتَرَبُوا فِي عَاجِلٍ أَنَا آجِلُهْ"
vocabulary:
  - term: "وَأَهْلِ خِبَاءٍ"
    text: "الواو واو رُبَّ: «وَقَوْلُهُ وأَهل مَخْفُوضٌ بِوَاوِ رُبَّ» [@lisan، ج11 ص12]، أي: ورُبّ أهل بيت."
  - term: "صَالِحٍ ذَاتُ بَيْنِهِمْ"
    text: "ما بينهم من الصلة صالح، أي متصالحون متوادّون، و«ذات البين» الحال التي تكون بين القوم."
  - term: "احْتَرَبُوا"
    text: "تحاربوا وقاتل بعضهم بعضًا."
  - term: "فِي عَاجِلٍ أَنَا آجِلُهْ"
    text: "في شرّ عاجل أنا جانيه ومهيّجه: «وعاجل شرٍّ «أجَلَه» عليهم، أي: جناه وأحدثه» [@diwan-zuhayr، ص62]. وفي اللسان: «وأَجَلَ عَلَيْهِمْ شَرّاً يَأْجُلُه ويَأْجِلُهُ أَجْلًا: جَناه وهَيَّجه»، ثم أنشد البيت وقال: «أَي أَنا جَانِيَهُ» [@lisan، ج11 ص12]."
