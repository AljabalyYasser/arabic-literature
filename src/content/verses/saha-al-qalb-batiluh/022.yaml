first: "وَقُلْتُ لَهُ سَدِّدْ وَأَبْصِرْ طَرِيقَهُ"
second: "وَمَا هُوَ فِيهِ عَنْ وَصَاتِيَ شَاغِلُهْ"
vocabulary:
  - term: "سَدِّدْ"
    text: "«أي: قوّم صدر الفرس، وخذ به على القصد» [@diwan-zuhayr، ص53]."
  - term: "وَمَا هُوَ فِيهِ عَنْ وَصَاتِيَ شَاغِلُهْ"
    text: "«يقول: شغله ما هو فيه، من علاج الفرس ونشاطه، عن وصيّتي» [@diwan-zuhayr، ص53]."
