explained: false
first: "أَخِي ثِقَةٍ لَا تُتْلِفُ الْخَمْرُ مَالَهُ"
second: "وَلَكِنَّهُ قَدْ يُهْلِكُ الْمَالَ نَائِلُهْ"
vocabulary:
  - term: "أَخِي ثِقَةٍ"
    text: "«أي: يوثق بما عنده من الخير، لما علم من جوده وكرمه» [@diwan-zuhayr، ص57]."
  - term: "نَائِلُهْ"
    text: "«العطاء. يقول: لا يتلف ماله في شرب الخمر، ولكنه يتلفه بالعطاء» [@diwan-zuhayr، ص57]."
sources:
