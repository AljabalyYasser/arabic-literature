explained: false
first: "فَتَبَّعَ آثَارَ الشِّيَاهِ وَلِيدُنَا"
second: "كَشُؤْبُوبِ غَيْثٍ يَحْفِشُ الْأُكْمَ وَابِلُهْ"
vocabulary:
  - term: "كَشُؤْبُوبِ غَيْثٍ"
    text: "«و«الشؤبوب»: الدفعة من المطر. شبّه انصباب الفرس، وحفيف جريه، بالشؤبوب وصوته» [@diwan-zuhayr، ص54]."
  - term: "يَحْفِشُ الْأُكْمَ"
    text: "«يكثر سيل الأكم حتّى يستخرج ما فيها» … «و«الأكم»: جمع أكمة» [@diwan-zuhayr، ص54]، والأكمة: التلّ."
  - term: "وَابِلُهْ"
    text: "«أغزر المطر وأعظمه قطرًا» [@diwan-zuhayr، ص54]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص53–54"
    url: "https://archive.org/details/3917pdf/page/n53/mode/1up"
status: "review"
