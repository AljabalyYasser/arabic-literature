first: "نَظَرْتُ إِلَيْهِ نَظْرَةً فَرَأَيْتُهُ"
second: "عَلَى كُلِّ حَالٍ مَرَّةً هُوَ حَامِلُهْ"
vocabulary:
  - term: "عَلَى كُلِّ حَالٍ مَرَّةً هُوَ حَامِلُهْ"
    text: "«يقول: نظرت إلى الفرس فرأيته، والغلام يحمله من السير على كلّ حال ممّا أحبّ أو كره. ويجوز أن يريد: نظرت إلى الغلام، والفرس يحمله مرّة على الطمع، ومرّة على اليأس، ومرّة على الهلاك» [@diwan-zuhayr، ص54]."
