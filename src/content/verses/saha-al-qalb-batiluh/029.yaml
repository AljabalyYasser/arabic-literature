explained: false
first: "بِذِي مَيْعَةٍ لَا مَوْضِعُ الرُّمْحِ مُسْلِمٌ"
second: "لِبُطْءٍ وَلَا مَا خَلْفَ ذَلِكَ خَاذِلُهْ"
vocabulary:
  - term: "مَيْعَةٍ"
    text: "«الدفعة من السير» [@diwan-zuhayr، ص56]."
  - term: "لَا مَوْضِعُ الرُّمْحِ مُسْلِمٌ"
    text: "موضع الرمح مقدّم الفرس، «يعني: أنّ مقدّمه لا يسلم مؤخّره، أي: لا يخذله، ولكن يؤيّده، ويعينه. وكذلك مؤخّره لا يخذل مقدّمه» [@diwan-zuhayr، ص56]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص55–56"
    url: "https://archive.org/details/3917pdf/page/n55/mode/1up"
