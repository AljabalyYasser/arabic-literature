    text: "«كثرة الكلام وخطؤه» [@diwan-zuhayr، ص60]."
  - term: "فَمَا يُلْمِمْ بِهِ"
    text: "«أي: ما حضره من الكلام — وإن كان خطأ — فهو قائله لسفهه، وقلّة تحصيله» [@diwan-zuhayr، ص60]."
