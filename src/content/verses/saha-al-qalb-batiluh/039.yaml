first: "وَذِي خَطَلٍ فِي الْقَوْلِ يَحْسِبُ أَنَّهُ"
second: "مُصِيبٌ فَمَا يُلْمِمْ بِهِ فَهْوَ قَائِلُهْ"
vocabulary:
