explained: false
first: "فَقَالَ شِيَاهٌ رَاتِعَاتٌ بِقَفْرَةٍ"
second: "بِمُسْتَأْسِدِ الْقُرْيَانِ حُوٍّ مَسَائِلُهْ"
vocabulary:
  - term: "شِيَاهٌ"
    text: "قال الأعلم: «والشياه ههنا: الحمير»، ويقول المحقق: «كذا، والصواب «الأتن»» [@diwan-zuhayr، ص50]، أي إناث حمر الوحش."
  - term: "بِمُسْتَأْسِدِ الْقُرْيَانِ"
    text: "«و«المستأسد»: ما طال من النبت وقوي. و«القريان»: مجاري الماء إلى الرياض، واحدها قريّ» [@diwan-zuhayr، ص50]."
  - term: "حُوٍّ مَسَائِلُهْ"
    text: "«و«الحوّ»: ذات النبات الشديد الخضرة. و«المسائل»: حيث يسيل الماء إلى الرياض» [@diwan-zuhayr، ص50]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص50"
    url: "https://archive.org/details/3917pdf/page/n50/mode/1up"
