explained: false
first: "فَبِتْنَا عُرَاةً عِنْدَ رَأْسِ جَوَادِنَا"
second: "يُزَاوِلُنَا عَنْ نَفْسِهِ وَنُزَاوِلُهْ"
vocabulary:
  - term: "عُرَاةً"
    text: "«يصف أنهم تجرّدوا للفرس، في أزرهم، لصعوبته ونشاطه. وقيل: معنى «عراة» من العرواء، وهي الرعدة عند الحرص» [@diwan-zuhayr، ص52]."
  - term: "يُزَاوِلُنَا ... وَنُزَاوِلُهْ"
    text: "«أي: يعالج مدافعتنا، ونعالج إلجامه وركوبه» [@diwan-zuhayr، ص52]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص51–52"
    url: "https://archive.org/details/3917pdf/page/n51/mode/1up"
status: "review"
