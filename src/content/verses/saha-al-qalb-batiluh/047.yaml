explained: false
first: "فَأَقْبَلْتُ فِي السَّاعِينَ أَسْأَلُ عَنْهُمُ"
second: "سُؤَالَكَ بِالشَّيْءِ الَّذِي أَنْتَ جَاهِلُهْ"
vocabulary:
  - term: "فِي السَّاعِينَ"
    text: "مع الساعين بالشر بين القوم، يقول الأَعْلَم: «جعل يسأل عن السّاعين بالشرّ، المهيِّجين له بين القوم» [@diwan-zuhayr، ص62]."
  - term: "سُؤَالَكَ بِالشَّيْءِ الَّذِي أَنْتَ جَاهِلُهْ"
    text: "يسأل عن الفتنة وهو صاحبها، متظاهرًا بالجهل: «كما يسأل الإنسان عمّا جهله» [@diwan-zuhayr، ص62]."
sources:
