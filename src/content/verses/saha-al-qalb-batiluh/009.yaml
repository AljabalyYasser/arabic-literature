explained: false
first: "هَبَطْتُ بِمَمْسُودِ النَّوَاشِرِ سَابِحٍ"
second: "مُمَرٍّ أَسِيلِ الْخَدِّ نَهْدٍ مَرَاكِلُهْ"
vocabulary:
  - term: "بِمَمْسُودِ النَّوَاشِرِ"
    text: "«أي: شديد. يقال: امسد حبلك، أي: اشدد فتله» … «والنواشر: جمع ناشرة، وهي عصب في الذراع» [@diwan-zuhayr، ص48]."
  - term: "سَابِحٍ"
    text: "«السريع» كما يقول المحقق [@diwan-zuhayr، ص48]."
  - term: "مُمَرٍّ"
    text: "«الشديد الفتل الوثيق الخلق» [@diwan-zuhayr، ص48]."
  - term: "أَسِيلِ الْخَدِّ"
    text: "«أي: طويل الخدّ سهله» [@diwan-zuhayr، ص48–49]."
  - term: "نَهْدٍ مَرَاكِلُهْ"
    text: "«و«النهد»: الضخم. و«المراكل»: جمع مركل، وهو حيث يركله الفارس بعقبيه. وصفه بعظم الجوف» [@diwan-zuhayr، ص49]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص48–49"
    url: "https://archive.org/details/3917pdf/page/n48/mode/1up"
status: "review"
