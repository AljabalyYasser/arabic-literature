explained: false
first: "وَنَضْرِبُهُ حَتَّى اطْمَأَنَّ قَذَالُهُ"
second: "وَلَمْ يَطْمَئِنَّ قَلْبُهُ وَخَصَائِلُهْ"
vocabulary:
  - term: "قَذَالُهُ"
    text: "«معقد عذاره في رأسه» [@diwan-zuhayr، ص52]."
  - term: "خَصَائِلُهْ"
    text: "«جمع خصيلة، وهي كلّ لحمة في عصبة. يقول: أمكننا من رأسه فألجمناه، وهو مع ذلك حديد القلب، مضطرب اللحم، لنشاطه» [@diwan-zuhayr، ص52]."
sources:
