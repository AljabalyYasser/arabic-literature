explained: false
first: "أَبَى الضَّيْمَ وَالنُّعْمَانُ يَحْرِقُ نَابُهُ"
second: "عَلَيْهِ فَأَفْضَى وَالسُّيُوفُ مَعَاقِلُهْ"
vocabulary:
  - term: "يَحْرِقُ نَابُهُ"
    text: "«أي: يصرف من الغيظ. ويروى: «يَحْرِقُ نَابَهُ» بالنصب. والمعنى: يصرف بنابه» [@diwan-zuhayr، ص61]. ويصرف: «يصوّت» كما يقول المحقق [@diwan-zuhayr، ص61]."
  - term: "فَأَفْضَى وَالسُّيُوفُ مَعَاقِلُهْ"
    text: "«صار في فضاء من الأرض، لعزّته، وامتنع بالسيوف، فأقامها مقام المعاقل التي يتحصّن بها» [@diwan-zuhayr، ص61]."
  - term: "النُّعْمَانُ"
    text: "«و«النعمان» هذا هو النعمان بن الحارث الغسانيّ» [@diwan-zuhayr، ص61]، ويقول المحقق: «كذا، وقيل: هو عمرو بن هند ملك الحيرة» [@diwan-zuhayr، ص61]."
sources:
