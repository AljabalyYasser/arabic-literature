first: "يُثِرْنَ الْحَصَى فِي وَجْهِهِ وَهْوَ لَاحِقٌ"
second: "سِرَاعٌ تَوَالِيهِ صِيَابٌ أَوَائِلُهْ"
vocabulary:
  - term: "يُثِرْنَ الْحَصَى"
    text: "«يعني: الشياه. أي: قد لحق الفرس بهنّ، فيثرن الحصى في وجهه، لشدّة عدوهنّ» [@diwan-zuhayr، ص54]."
  - term: "سِرَاعٌ تَوَالِيهِ صِيَابٌ أَوَائِلُهْ"
    text: "التوالي: «رجليه وعجزه، لأنها تلي مقدّمه»، و«صياب أوائله» «يقول: مقدّمه قاصد يصوب، ومؤخّره مؤيّد له لا يخذله. وأوائله: يداه وصدره» [@diwan-zuhayr، ص54]."
sources:
