explained: false
first: "يُفَدِّينَهُ طَوْرًا وَطَوْرًا يَلُمْنَهُ"
second: "وَأَعْيَا فَمَا يَدْرِينَ أَيْنَ مَخَاتِلُهْ"
vocabulary:
  - term: "يُفَدِّينَهُ"
    text: "«أي: يقلن له: فديناك بأنفسنا وآبائنا وأمّهاتنا، ليستنزلنه بذلك، حتّى يقبل عذلهنّ» [@diwan-zuhayr، ص57]."
  - term: "مَخَاتِلُهْ"
    text: "«يعني: الأمر الذي يختلنه فيه. يقول: قد أعياهنّ، فما يدرين كيف يخدعنه ويختلنه» [@diwan-zuhayr، ص57]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص56–57"
    url: "https://archive.org/details/3917pdf/page/n56/mode/1up"
status: "review"
