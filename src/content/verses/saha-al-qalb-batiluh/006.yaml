first: "فَرَقْدٌ فَصَارَاتٌ فَأَكْنَافُ مَنْعِجٍ"
second: "فَشَرْقِيُّ سَلْمَى حَوْضُهُ فَأَجَاوِلُهْ"
vocabulary:
  - term: "فَرَقْدٌ فَصَارَاتٌ فَأَكْنَافُ مَنْعِجٍ"
    text: "مواضع: «و«رقد»: اسم واد. ويقال: هو جبل. و«صارات»: جبال. واحدها صارة. و«منعج»: موضع. و«أكنافه»: نواحيه» [@diwan-zuhayr، ص47]."
  - term: "سَلْمَى ... فَأَجَاوِلُهْ"
    text: "«و«سلمى»: جبل. و«أجاوله»: جوانب منه يُجال فيها» [@diwan-zuhayr، ص47]."
