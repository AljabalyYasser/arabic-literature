explained: false
first: "فَرُحْنَا بِهِ يَنْضُو الْجِيَادَ عَشِيَّةً"
second: "مُخَضَّبَةً أَرْسَاغُهُ وَعَوَامِلُهْ"
vocabulary:
  - term: "يَنْضُو الْجِيَادَ"
    text: "«أي: ينسلخ منها ويتقدّمها» [@diwan-zuhayr، ص55]."
  - term: "مُخَضَّبَةً أَرْسَاغُهُ"
    text: "«يعني: أنّ الغلام لمّا طعن العير ثار الدم إلى قوائم الفرس، فخضّبها» [@diwan-zuhayr، ص55]."
  - term: "عَوَامِلُهْ"
    text: "«قوائمه، لأنها تحمله» [@diwan-zuhayr، ص55]."
sources:
