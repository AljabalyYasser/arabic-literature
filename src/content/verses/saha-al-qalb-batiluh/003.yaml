explained: false
first: "وَقَالَ الْعَذَارَى إِنَّمَا أَنْتَ عَمُّنَا"
second: "وَكَانَ الشَّبَابُ كَالْخَلِيطِ نُزَايِلُهْ"
vocabulary:
  - term: "إِنَّمَا أَنْتَ عَمُّنَا"
    text: "«يصف أنه كبر، فدعته العذارى عمًّا، بعد أن كُنّ يدعونه أخًا» [@diwan-zuhayr، ص46]."
  - term: "كَالْخَلِيطِ نُزَايِلُهْ"
    text: "«جعل الشباب، حين ولّى وفارق، بمنزلة الخليط المفارق. والخليط: الصاحب المخالط. و«المزايلة»: المفارقة» [@diwan-zuhayr، ص46]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص46"
    url: "https://archive.org/details/3917pdf/page/n46/mode/1up"
