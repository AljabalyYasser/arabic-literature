explained: false
first: "وَقَدْ خَرَّمَ الطُّرَّادُ عَنْهُ جِحَاشَهُ"
second: "فَلَمْ يَبْقَ إِلَّا نَفْسُهُ وَحَلَائِلُهْ"
vocabulary:
  - term: "خَرَّمَ الطُّرَّادُ عَنْهُ جِحَاشَهُ"
    text: "«أي: أخذوا جحاشه واحدًا واحدًا، لأنهم كانوا يطاردونه، فيدع جحاشه، فيأخذونها» … «و«الطرّاد»: الصيّادون» [@diwan-zuhayr، ص51]. والجحاش: أولاد الحمار."
  - term: "حَلَائِلُهْ"
    text: "«جمع حليلة. وهي زوج الرجل» … «واستعارها للأتن» [@diwan-zuhayr، ص51]."
sources:
