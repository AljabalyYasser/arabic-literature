explained: false
first: "وَغَيْثٍ مِنَ الْوَسْمِيِّ حُوٍّ تِلَاعُهُ"
second: "أَجَابَتْ رَوَابِيهِ النِّجَا وَهَوَاطِلُهْ"
vocabulary:
  - term: "وَغَيْثٍ مِنَ الْوَسْمِيِّ"
    text: "«أراد: نبتًا من غيث الوسميّ، فسمّى النبت غيثًا لأنه عنه يكون. و«الوسميّ»: أوّل المطر» [@diwan-zuhayr، ص48]."
  - term: "حُوٍّ تِلَاعُهُ"
    text: "«و«الحوّ»: الشديدة الخضرة، التي تضرب إلى السواد لريّها. و«التلاع»: مجاري الماء من أعلى الأرض إلى بطن الوادي» [@diwan-zuhayr، ص48]."
  - term: "رَوَابِيهِ النِّجَا"
    text: "«و«الروابي»: ما ارتفع من الأرض» و«النجا»: «جمع نجوة. وهي المرتفع من الأرض، الذي تظنّ أنه نجاؤك من السيل» [@diwan-zuhayr، ص48]."
  - term: "هَوَاطِلُهْ"
    text: "«جمع هاطلة. وهي سحابة يدوم ماؤها في لين». والمعنى عنده: «أجابت روابيه النجاء بالنبت، وأجابت هواطله بالمطر» [@diwan-zuhayr، ص48]."
sources:
