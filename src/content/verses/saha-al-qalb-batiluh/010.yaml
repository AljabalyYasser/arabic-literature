explained: false
first: "تَمِيمٍ فَلَوْنَاهُ فَأُكْمِلَ صُنْعُهُ"
second: "فَتَمَّ وَعَزَّتْهُ يَدَاهُ وَكَاهِلُهْ"
vocabulary:
  - term: "تَمِيمٍ فَلَوْنَاهُ"
    text: "«أي: تامّ الخلق كامله. ومعنى فلوناه: فطمناه» [@diwan-zuhayr، ص49]."
  - term: "وَعَزَّتْهُ يَدَاهُ وَكَاهِلُهْ"
    text: "«أي: غلبت يداه وكاهله سائر أعضائه، وكانت أعظم شيء فيه وأشدّ» … «و«الكاهل»: مجتمع الكتفين في أصل العنق» [@diwan-zuhayr، ص49]."
sources:
