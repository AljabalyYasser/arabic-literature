first: "فَأَصْبَحْتُ مَا يَعْرِفْنَ إِلَّا خَلِيقَتِي"
second: "وَإِلَّا سَوَادَ الرَّأْسِ وَالشَّيْبُ شَامِلُهْ"
vocabulary:
  - term: "خَلِيقَتِي"
    text: "خُلُقي. يقول الأعلم: «ذهب شبابي وتغيّر منظري، فلا يعرفن منّي إلّا خلقي، وسواد رأسي وقد شمله الشيب، أي: صار فيه أجمع» [@diwan-zuhayr، ص46–47]."
