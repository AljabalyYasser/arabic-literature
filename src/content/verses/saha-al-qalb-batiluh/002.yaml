explained: false
first: "وَأَقْصَرْتُ عَمَّا تَعْلَمِينَ وَسُدِّدَتْ"
second: "عَلَيَّ سِوَى قَصْدِ السَّبِيلِ مَعَادِلُهْ"
vocabulary:
  - term: "وَأَقْصَرْتُ عَمَّا تَعْلَمِينَ"
    text: "«أي: كففت عمّا عهدتِني عليه، من الصبا والباطل» [@diwan-zuhayr، ص46]."
  - term: "مَعَادِلُهْ"
    text: "«جمع معدِل. وهو كلّ ما عُدل فيه عن القصد. يعني: أنّ معادله التي كان يعدل فيها عن قصد السبيل سُدّدت عليه» [@diwan-zuhayr، ص46]."
  - term: "سِوَى"
    text: "«بمعنى: عن، وهي متعلّقة بـ«المعادل»» [@diwan-zuhayr، ص46]."
sources:
