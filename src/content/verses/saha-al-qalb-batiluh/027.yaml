explained: false
first: "فَرَدَّ عَلَيْنَا الْعَيْرَ مِنْ دُونِ إِلْفِهِ"
second: "عَلَى رُغْمِهِ يَدْمَى نَسَاهُ وَفَائِلُهْ"
vocabulary:
  - term: "الْعَيْرَ"
    text: "«العير: حمار الوحش» كما يقول المحقق [@diwan-zuhayr، ص55]."
  - term: "مِنْ دُونِ إِلْفِهِ"
    text: "«يقول: قطع الوليد — أو الفرس — العير من ألّافه، فردّه علينا. و«إلفه»: أتانه، لأنها تألفه ويألفها» [@diwan-zuhayr، ص55]."
  - term: "نَسَاهُ وَفَائِلُهْ"
    text: "«عرقان. وإنما خصّهما ليخبر بحذق الوليد بالطعن، وإصابة المقتل» [@diwan-zuhayr، ص55]."
sources:
