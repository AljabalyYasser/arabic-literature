explained: false
first: "فَوَادِي الْبَدِيِّ فَالطَّوِيُّ فَثَادِقٌ"
second: "فَوَادِي الْقَنَانِ جِزْعُهُ فَأَفَاكِلُهْ"
vocabulary:
  - term: "الْبَدِيِّ فَالطَّوِيُّ فَثَادِقٌ"
    text: "«مواضع. و«القنان»: جبل لبني أسد» [@diwan-zuhayr، ص48]."
  - term: "جِزْعُهُ فَأَفَاكِلُهْ"
    text: "«و«جزع» الوادي: منعطفه. وقيل: جانبه. و«أفاكله»: نواحيه. يصف أنّ منازل أحبّته كانت بهذه المواضع، ثم خلت منهم، فتغيّرت رسومها بعدهم» [@diwan-zuhayr، ص48]."
sources:
