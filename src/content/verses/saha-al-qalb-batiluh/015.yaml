explained: false
first: "ثَلَاثٌ كَأَقْوَاسِ السَّرَاءِ وَمِسْحَلٌ"
second: "قَدِ اخْضَرَّ مِنْ لَسِّ الْغَمِيرِ جَحَافِلُهْ"
vocabulary:
  - term: "كَأَقْوَاسِ السَّرَاءِ"
    text: "«السراء» «شجر تتّخذ منه القسيّ. وشبّه الأتن بالأقواس، لأنهنّ اجتزأن برعي الرطب عن شرب الماء، فطواهنّ وأضمرهنّ» [@diwan-zuhayr، ص51]."
  - term: "مِسْحَلٌ"
    text: "«الحمار الوحشيّ» كما يقول المحقق [@diwan-zuhayr، ص50]، وهو عند الأعلم «من السحيل، وهو صوت الحمار» [@diwan-zuhayr، ص51]."
  - term: "لَسِّ الْغَمِيرِ"
    text: "«و«اللسّ»: الأخذ بمقدّم الفم. و«الغمير»: نبت أخضر قد غمره نبت آخر أطول منه» [@diwan-zuhayr، ص51]."
  - term: "جَحَافِلُهْ"
    text: "«جمع جحفلة، وهي الشفة» كما يقول المحقق [@diwan-zuhayr، ص50]."
sources:
