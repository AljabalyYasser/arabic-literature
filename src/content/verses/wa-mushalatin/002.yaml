explained: false
first: "عَلَيْهَا الْكُمَاةُ وَالْحَدِيدُ فَمِنْهُمُ"
second: "مَصِيدٌ لِأَطْرَافِ الْعَوَالِي وَصَائِدُ"
vocabulary:
  - term: "الْكُمَاةُ"
    text: "جمع كَمِيّ، وهو الفارس الشجاع المستتر في سلاحه."
  - term: "الْعَوَالِي"
    text: "في حاشية المحققين: «العوالي: أعالي الرماح» [@mufaddaliyyat، ص325، الحاشية].."
  - term: "مَصِيدٌ ... وَصَائِدُ"
    text: "في حاشية المحققين: «والمعنى: فمنهم مأسور وآخر آسر» [@mufaddaliyyat، ص325، الحاشية]."
