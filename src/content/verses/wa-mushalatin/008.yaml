explained: false
first: "وَقِرْنٍ تَرَكْتُ الطَّيْرَ تَحْجُلُ حَوْلَهُ"
second: "عَلَيْهِ نَجِيعٌ مِنْ دَمِ الْجَوْفِ جَاسِدُ"
vocabulary:
  - term: "وَقِرْنٍ"
    text: "في حاشية المحققين: «القرن: الكفء في الشجاعة» [@mufaddaliyyat، ص326، الحاشية]."
  - term: "تَحْجُلُ"
    text: "تمشي حوله مشي المقيّد تقفز قفزًا، تريد أكله. وفي اللسان: «والحَجْل: مَشْيُ المُقَيَّد» [@lisan، ج11 ص144]."
  - term: "نَجِيعٌ ... جَاسِدُ"
    text: "في حاشية المحققين: «النجيع: الشديد الحمرة. الجاسد: اللازق» [@mufaddaliyyat، ص326، الحاشية]. أي دم قانٍ يبس عليه."
