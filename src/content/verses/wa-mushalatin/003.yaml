explained: false
first: "شَمَاطِيطُ تَهْوِي لِلسَّوَامِ كَأَنَّهَا"
second: "إِذَا هَبَطَتْ غُوطًا كِلَابٌ طَوَارِدُ"
vocabulary:
  - term: "شَمَاطِيطُ"
    text: "في حاشية المحققين: «شماطيط: متقطعة» [@mufaddaliyyat، ص325، الحاشية]. أي جماعات متفرقة من الخيل."
  - term: "تَهْوِي لِلسَّوَامِ"
    text: "في حاشية المحققين: «السوام: الإبل الراعية، كالسائمة. أراد أن الكتيبة تسرع للغنائم» [@mufaddaliyyat، ص325، الحاشية]."
  - term: "غُوطًا"
    text: "في حاشية المحققين: «الغوط: جمع غائط، وهو الواسع المطمئن من الأرض» [@mufaddaliyyat، ص325، الحاشية]."
  - term: "طَوَارِدُ"
    text: "في حاشية المحققين: «طوارد: قوانص» [@mufaddaliyyat، ص325، الحاشية]. أي كلاب صيد تطارد الوحش."
