explained: false
first: "وَطَارِقِ لَيْلٍ كُنْتُ حَمَّ مَبِيتِهِ"
second: "إِذَا قَلَّ فِي الْحَيِّ الْجَمِيعِ الرَّوَافِدُ"
vocabulary:
  - term: "وَطَارِقِ لَيْلٍ"
    text: "الطارق: الذي يأتي ليلًا، وأراد الضيف."
  - term: "حَمَّ مَبِيتِهِ"
    text: "في حاشية المحققين: «حم مبيته: قصد مبيته، والحم القصد» [@mufaddaliyyat، ص326، الحاشية]. أي كنت الذي يقصده ليبيت عنده."
  - term: "الْحَيِّ الْجَمِيعِ"
    text: "في حاشية المحققين: «الحي الجميع: الكثير» [@mufaddaliyyat، ص326، الحاشية]."
  - term: "الرَّوَافِدُ"
    text: "في حاشية المحققين: «الروافد: جمع رافد، والرفد المعونة» [@mufaddaliyyat، ص326، الحاشية]. أي إذا قلّ من يعين ويقري في زمن الشدة."
