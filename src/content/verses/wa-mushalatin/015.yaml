first: "وَمَنْ يَتَبَلَّغْ بِالْحَدِيثِ فَإِنَّهُ"
second: "عَلَى كُلِّ قَوْلٍ قِيلَ رَاعٍ وَشَاهِدُ"
vocabulary:
  - term: "يَتَبَلَّغْ بِالْحَدِيثِ"
    text: "في حاشية المحققين: «يقول: من كان يتبلغ في الناس بشرفه الحديث فإن الناس يعرفون قديم شرفي ويفصلون بين باطل الفخر وحقه» [@mufaddaliyyat، ص326، الحاشية]. ويتبلّغ: يكتفي ويقنع."
