explained: false
first: "حَشَاهُ السِّنَانُ ثُمَّ خَرَّ لِأَنْفِهِ"
second: "كَمَا قَطَّرَ الْكَعْبَ الْمُؤَرِّبَ نَاهِدُ"
vocabulary:
  - term: "حَشَاهُ السِّنَانُ"
    text: "في حاشية المحققين: «حشاه السنان: دخل في أحشائه» [@mufaddaliyyat، ص326، الحاشية]. والسنان: نصل الرمح."
  - term: "خَرَّ لِأَنْفِهِ"
    text: "سقط على وجهه."
  - term: "قَطَّرَ"
    text: "في حاشية المحققين: «قطره: رماه على قطريه، أي ناحيتيه» [@mufaddaliyyat، ص326، الحاشية]."
  - term: "الْكَعْبَ الْمُؤَرِّبَ"
    text: "في حاشية المحققين: «الكعب: عظم يلعب به. المؤرب من الكعاب: بكسر الراء كما ضبط في الأصول: المحرف، أي الحاد الأطراف، وهذا الحرف لم يذكر في المعاجم» [@mufaddaliyyat، ص326، الحاشية]."
  - term: "نَاهِدُ"
    text: "في حاشية المحققين: «الناهد: الصبي المرتفع. يريد أنه طعنه فرمى به على رأسه كما يرمي الصبي الكعب» [@mufaddaliyyat، ص326، الحاشية]."
