first: "وَذِي تِرَةٍ أَوْجَعْتُهُ وَسَبَقْتُهُ"
second: "فَقَصَّرَ عَنِّي سَعْيُهُ وَهْوَ جَاهِدُ"
vocabulary:
  - term: "تِرَةٍ"
    text: "في حاشية المحققين: «الترة: الثأر» [@mufaddaliyyat، ص325، الحاشية]. فذو الترة صاحب ثأر عنده."
  - term: "جَاهِدُ"
    text: "مجتهد يبذل وُسْعه."
