explained: false
first: "وَقَدْ عَلِمَ الْأَقْوَامُ أَنَّ أُرُومَتِي"
second: "يَفَاعٌ إِذَا عُدَّ الرَّوَابِي الْمَوَاجِدُ"
vocabulary:
  - term: "أُرُومَتِي"
    text: "في حاشية المحققين: «الأرومة: الأصل» [@mufaddaliyyat، ص326، الحاشية]."
  - term: "يَفَاعٌ"
    text: "في حاشية المحققين: «اليفاع: المرتفع» [@mufaddaliyyat، ص326، الحاشية]."
  - term: "الرَّوَابِي الْمَوَاجِدُ"
    text: "الروابي جمع رابية، وهي ما ارتفع من الأرض، ضربها مثلًا للأنساب الشريفة. في حاشية المحققين: «المواجد: العظيمة» [@mufaddaliyyat، ص326، الحاشية]."
