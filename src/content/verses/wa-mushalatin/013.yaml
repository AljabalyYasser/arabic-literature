explained: false
first: "وَإِنْ يَكُ مَجْدٌ فِي تَمِيمٍ فَإِنَّهُ"
second: "نَمَانِي الْيَفَاعُ نَهْشَلٌ وَعُطَارِدُ"
vocabulary:
  - term: "نَمَانِي"
    text: "في حاشية المحققين: «نماني: رفعني» [@mufaddaliyyat، ص326، الحاشية]."
  - term: "الْيَفَاعُ"
    text: "المرتفع، كما في البيت السابع، أي الأصل العالي."
  - term: "نَهْشَلٌ وَعُطَارِدُ"
    text: "بطنان من تميم، ونَهْشَل جدّ الشاعر، فهو ضَمْرة بن ضَمْرة بن جابر بن قَطَن بن نَهْشَل بن دارِم، كما في حاشية المحققين [@mufaddaliyyat، ص324، الحاشية]."
