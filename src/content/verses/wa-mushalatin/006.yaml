explained: false
first: "يَرَانِي إِذَا لَاقَيْتُهُ ذَا مَهَابَةٍ"
second: "وَيَقْصُرُ عَنِّي الطَّرْفَ وَالْوَجْهُ كَامِدُ"
vocabulary:
  - term: "وَيَقْصُرُ عَنِّي الطَّرْفَ"
    text: "في حاشية المحققين: «أي يهابني، ولا يملأ عينه من النظر إلي، استعظامًا لي وفرقًا مني» [@mufaddaliyyat، ص325، الحاشية]. والطرف: العين."
  - term: "كَامِدُ"
    text: "في حاشية المحققين: «كامد: أسود» [@mufaddaliyyat، ص325، الحاشية]. أي متغيّر من الغيظ."
