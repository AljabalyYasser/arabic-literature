explained: false
first: "وَمَا جَمَعَا مِنْ آلِ سَعْدٍ وَمَالِكٍ"
second: "وَبَعْضُ زِنَادِ الْقَوْمِ غَلْثٌ وَكَاسِدُ"
vocabulary:
  - term: "آلِ سَعْدٍ وَمَالِكٍ"
    text: "بطون من تميم ينتسب إليها نَهْشَل وعُطارِد، يقول: رفعني ما جمعاه من مجد هذه البطون."
  - term: "زِنَادِ"
    text: "في حاشية المحققين: «الزناد: جمع زند، وهو الذي يقدح به النار» [@mufaddaliyyat، ص326، الحاشية]."
  - term: "غَلْثٌ وَكَاسِدُ"
    text: "في حاشية المحققين: «الغلث، بسكون اللام: صفة من قولهم «غلث الزند» من باب «فرح» لم يور نارًا، وهذه الصفة لم تذكر في المعاجم. الكاسد: من قولهم «كسدت السلعة» بارت، المراد أن بعض القوم ضئيل النسب» [@mufaddaliyyat، ص326، الحاشية]."
