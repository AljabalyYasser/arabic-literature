explained: false
first: "وَمُشْعَلَةٍ كَالطَّيْرِ نَهْنَهْتُ وِرْدَهَا"
second: "إِذَا مَا الْجَبَانُ يَدَّعِي وَهْوَ عَانِدُ"
vocabulary:
  - term: "وَمُشْعَلَةٍ كَالطَّيْرِ"
    text: "في حاشية المحققين: «المشعلة: بفتح العين: الكتيبة تشعل للحرب، شبهها بالنار المشعلة، وجعلها كالطير لسرعتها، وإنما تسرع للثقة بشدة البأس، أو جعلها كالطير في كثرتها» [@mufaddaliyyat، ص325، الحاشية]. والكتيبة: الجماعة من الفرسان."
  - term: "نَهْنَهْتُ وِرْدَهَا"
    text: "في حاشية المحققين: «نهنهت: كففت. الورد: القطيع من الجيش والطير» [@mufaddaliyyat، ص325، الحاشية]. أي رددت أول من أقبل منها."
  - term: "يَدَّعِي"
    text: "في حاشية المحققين: «يدعي: ينتسب» [@mufaddaliyyat، ص325، الحاشية]. أي يصيح باسم قبيلته في الحرب، والجبان يفعل ذلك وهو يتنحّى عن القتال."
  - term: "عَانِدُ"
    text: "في حاشية المحققين: «العاند: المنحرف» [@mufaddaliyyat، ص325، الحاشية]. أي المائل عن وجه العدو."
