first: "أُذِيقُ الصَّدِيقَ رَأْفَتِي وَإِحَاطَتِي"
second: "وَقَدْ يَشْتَكِي مِنِّي الْعُدَاةُ الْأَبَاعِدُ"
vocabulary:
  - term: "رَأْفَتِي وَإِحَاطَتِي"
    text: "رحمتي وحمايتي، أي يجد مني الصديق الرفق والرعاية."
  - term: "الْعُدَاةُ الْأَبَاعِدُ"
    text: "الأعداء الغرباء، والعُداة جمع عادٍ."
