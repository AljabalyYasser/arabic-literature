first: "قَدْ كَانَ فِي آلِ كَهْفٍ إِنْ هُمُ احْتَرَبُوا"
second: "وَالْجَاشِرِيَّةِ مَا تَسْعَى وَتَنْتَضِلُ"
meaning: "إن نشبت الحرب بين هؤلاء القوم، فقد كان في آل كهف وفي الجاشِرِيّة من يسعى لهم ويدافع عنهم، فلا حاجة بك إلى أن تدخل بينهم. قال التِّبْرِيزِيّ: «وآل كهف: من بني سعد بن مالك ابن ضبيعة»، وقال: «يقول: قد كان لهم من يسعى لهم فما دُخُولك بينهم ولست منهم؟» [@tabrizi-ashr، ص304]."
vocabulary:
  - term: "آلِ كَهْفٍ"
    text: "«من بني سعد بن مالك ابن ضبيعة» [@tabrizi-ashr، ص304]، وهم رهط الأَعْشَى الأدنون."
  - term: "احْتَرَبُوا"
    text: "تحاربوا، أي قاتل بعضهم بعضًا."
  - term: "الْجَاشِرِيَّةِ"
    text: "قال التِّبْرِيزِيّ: «والجاشرية: امرأة من إياد، وقيل: هي بنت كعب بن مامة» [@tabrizi-ashr، ص304]، والمراد قومها. وفي اللسان عن الجوهري: «وأما الجاشرية التي في شعر الأعشى فهي قبيلة من قبائل العرب» [@lisan، ج4 ص139]."
  - term: "تَنْتَضِلُ"
    text: "ترمي وتدافع. في اللسان: «انْتَضَل الْقَوْمُ وتَنَاضَلُوا أَي رَمَوْا للسَّبْق»، و«ونَاضَلْت عَنْهُ نِضَالًا: دافَعْت» [@lisan، ج11 ص665]."
syntax:
  - "«كَانَ» فعل ناقص، و«فِي آلِ كَهْفٍ» جار ومجرور متعلق بمحذوف خبر مقدم، و«مَا» اسم موصول بمعنى «مَن» في محل رفع اسم «كان» مؤخر، وجملة «تَسْعَى» صلته. وأُنّث الفعل «تَسْعَى» حملًا على معنى الجماعة. و«وَالْجَاشِرِيَّةِ» معطوف على «آلِ كَهْفٍ»."
  - "«إِنْ هُمُ احْتَرَبُوا» جملة شرطية معترضة بين المعطوف والمعطوف عليه، وجوابها محذوف يدل عليه الكلام. و«هُمُ» فاعل لفعل محذوف يفسّره «احْتَرَبُوا»، لأن أداة الشرط لا يليها إلا فعل، والتقدير: إن احتربوا هم احتربوا."
  - "«وَتَنْتَضِلُ» معطوف على «تَسْعَى»."
morphology:
  - "«احْتَرَبُوا» على «افْتَعَلُوا» من «حَرَب»، والافتعال هنا للمشاركة، كـ«اقتتلوا»."
  - "«الْجَاشِرِيَّة» نسبة بالياء المشددة وتاء التأنيث، و«تَنْتَضِل» على «تَفْتَعِل» من «نَضَل»."
rhetoric:
  thesis: "آخر الرسالة إلى يَزِيد: قوم الأَعْشَى وحلفاؤهم يكفون أنفسهم، فدخوله بينهم فضول لا حاجة إليه. وبهذا يعود الشاعر إلى أصل الخلاف: يزيد يتدخل في أمر بين حيين ليس منهما."
  devices:
    - title: "التعريض"
      text: "لم يقل ليزيد: لا شأن لك بنا، بل قال إن في القوم من يسعى ويناضل، وترك السامع يستنتج أن يزيد دخيل. والتعريض أن يُفهم المعنى من عُرض الكلام وجانبه، لا من لفظه الصريح. وقد صرّح التِّبْرِيزِيّ بالمعنى المقصود: «فما دُخُولك بينهم ولست منهم؟» [@tabrizi-ashr، ص304]."
    - title: "الإبهام بالموصول"
      text: "قال «مَا تَسْعَى وَتَنْتَضِلُ» ولم يسمّ أحدًا، فالموصول المبهم يتسع لكل من يدافع عن القوم، وهذا أهيب من التسمية."
  connection: "ثم يبدأ القسم: يحلف بمن تُساق إليه الإبل والبقر، ويأتي جواب القسم في البيت الذي يليه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "قَدْ كَانَ فِي / آلِ كَهْ / فِنْ إِنْ هُمُحْ / تَرَبُو = مستفعلن / فاعلن / مستفعلن / فعِلن — وَلْجَاشِرِيْ / يَةِ مَا / تَسْعَى وَتَنْ / تَضِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]. وتُحرّك ميم «هُمُ» بالضم لتلتقي بهمزة الوصل في «احْتَرَبُوا»."
context: "آخر مقطع الرسالة (44–54) في ترتيب التِّبْرِيزِيّ، وهو في الديوان البيت 53، قبل «سائل بني أسد» [@diwan-asha، ص97]. ويلخصه محقق الديوان: «وإن فى قومنا وأحلافنا من بنى كهف (من بنى سعد بن مالك بن ضبيعة بن بكر) والجاشرية (من إياد) لمن يغنى فى القتال، ويصبر على النضال» [@diwan-asha، ص98]. وفي نسخة الشاملة من التِّبْرِيزِيّ «أن هم احتربوا» و«أن قعدوا هم»، وهو خطأ طبع صوابه «إن» الشرطية، كما يدل عليه شرحه."
variants:
  - reading: "قَدْ كَانَ فِي آلِ كَهْفٍ إِنْ هُمُ قَعَدُوا"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "قال: «ويروى (إن هُمُ قعدوا)»، وشرح الشطر عليها: إن قعدوا عن طلب ثأرهم «فقد كان فيهم من يسعى وينتضل لهم» [@tabrizi-ashr، ص304]."
  - reading: "قَدْ كَانَ فِي أَهْلِ كَهْفٍ إِنْ هُمُ قَعَدُوا / وَالْجَاشِرِيَّةِ مَنْ يَسْعَى وَيَنْتَضِلُ"
    status: "رواية الديوان"
    note: "[@diwan-asha، ص97]. ويقول محققه: «قعدوا عن القتال» [@diwan-asha، ص97]."
