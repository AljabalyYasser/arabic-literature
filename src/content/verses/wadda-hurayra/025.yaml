first: "وَقَدْ غَدَوْتُ إِلَى الْحَانُوتِ يَتْبَعُنِي"
second: "شَاوٍ مِشَلٌّ شَلُولٌ شُلْشُلٌ شَوِلُ"
meaning: "وكثيرًا ما بكّرتُ إلى بيت الخمّار يتبعني غلامٌ يشوي اللحم، سريع في سوقه وعمله، خفيف الحركة. ويلخصه البَغْداديّ: «يقول: بكرت إلى بيت الخمار ومعي غلام شواء طباخ خفيف في الخدمة» [@khizana، ج8 ص392]."
vocabulary:
  - term: "غَدَوْتُ"
    text: "ذهبت أول النهار. قال البَغْداديّ: «وغدوت: ذهبت غدوة وهي ما بين صلاة الصبح وطلوع الشمس» [@khizana، ج8 ص391]."
  - term: "الْحَانُوتِ"
    text: "«والحانوت: بيت الخمَّار، ويذكر ويؤنث» [@tabrizi-ashr، ص296]. وفي اللسان: «وقد غلب على حانوت الخمار» [@lisan، ج2 ص26]."
  - term: "شَاوٍ"
    text: "قال أبو عُبَيْدة: «الشاوي: الذي يشوي اللحم» [@aghani-dk، ج9 ص154]."
  - term: "مِشَلٌّ"
    text: "قال التِّبْرِيزِيّ: «والمشل: الجيد السَّوق للإبل، وهو الخفيف» [@tabrizi-ashr، ص296]. وقال أبو عُبَيْدة: «ومشل: سواق سريع يسوق به» [@aghani-dk، ج9 ص154]."
  - term: "شَلُولٌ"
    text: "مثل المِشَلّ، قال التِّبْرِيزِيّ: «وكذلك الشّلُولُ» [@tabrizi-ashr، ص296]."
  - term: "شُلْشُلٌ"
    text: "قال التِّبْرِيزِيّ: «والشُّلشُل مثل القلقل وهو المتحرك» [@tabrizi-ashr، ص296]. وقال أبو عُبَيْدة: «وشلشل: خفيف» [@aghani-dk، ج9 ص154]."
  - term: "شَوِلُ"
    text: "نقل البَغْداديّ عن التِّبْرِيزِيّ: «الشول هو الذي يحمل الشيء يقال: شلت به وأشلته» [@khizana، ج8 ص392]. وقال أبو عُبَيْدة: «وشول: طيب الريح» [@aghani-dk، ج9 ص154]."
syntax:
  - "«قَدْ» مع الماضي للتحقيق، و«إِلَى الْحَانُوتِ» متعلق بـ«غَدَوْتُ». قال البَغْداديّ: «وجملة: يتبعني حالٌ من التاء في غدوت» [@khizana، ج8 ص391]."
  - "«شَاوٍ» فاعل «يَتْبَعُنِي»، اسم منقوص حُذفت ياؤه للتنوين. و«مِشَلٌّ» و«شَلُولٌ» و«شُلْشُلٌ» و«شَوِلُ» صفات له متتابعة بلا عطف."
morphology:
  - "«شَاوٍ» اسم فاعل من «شَوَى يَشْوِي»."
  - "«مِشَلّ» على «مِفْعَل» من «شَلَّ» إذا طرد وساق، وهو بناء يدل على الكثرة والاعتياد. و«شَلُول» على «فَعُول» من صيغ المبالغة."
  - "«شُلْشُل» على «فُعْلُل» بتكرار الشين واللام، وفي التكرار معنى الحركة المتكررة. و«شَوِل» صفة على «فَعِل». وروى أبو عُبَيْدة «شُوَل» على «فُعَل»، قال التِّبْرِيزِيّ: «ومن روى شُولُ فهو بمعناه إلا إنه للتكثير» [@tabrizi-ashr، ص296]."
rhetoric:
  thesis: "يبدأ مجلس الخمر، وهو أطول ما في الرد. ويرى شوقي ضَيْف أن الأَعْشَى في الخمر «أكبر شاعر تغنى بها في الجاهلية» [@deif، ج1 ص338]، ويستشهد بهذه الأبيات (25–32) كلها، ويقول: «وهو يصف في الأبيات يوما من أيام لهوه غدا فيه إلى خمار مع رفيق ناشط خفيف الحركة طيب النفس» [@deif، ج1 ص356]."
  devices:
    - title: "تتابع الصفات وما عيب به"
      text: "قال ابن قُتَيْبة: «ويعاب الأعشى بقوله»، ثم أنشد البيت وقال: «وهذه الألفاظ الأربعة في معنى واحد» [@ibn-qutayba، ج1 ص256]، أي إن الصفات «مِشَلٌّ شَلُولٌ شُلْشُلٌ شَوِلُ» تكرار بلا فائدة. لكن الشرّاح فرّقوا بينها كما في المفردات: السوق، والخفة، والحمل، وطيب الريح."
    - title: "حكاية الحركة بالأصوات"
      text: "في «شَاوٍ مِشَلٌّ شَلُولٌ شُلْشُلٌ شَوِلُ» تتكرر الشين خمس مرات واللام ست مرات، والكلمات قصيرة متلاحقة، فيسمع القارئ خفة الغلام وتنقّله في الإيقاع نفسه. وقد قارنه البَغْداديّ ببيت للمتنبي يكرر «القلاقل»، فقال: «ويشبه هذا البيت قول أبي الطيب المتنبي» [@khizana، ج8 ص392]."
  connection: "ثم يذكر من يرافقه في الحانوت: فتية كسيوف الهند."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَقَدْ غَدَوْ / تُ إِلَلْ / حَانُوتِ يَتْ / بَعُنِي = متفعلن / فعِلن / مستفعلن / فعِلن — شَاوِنْ مِشَلْ / لُنْ شَلُو / لُنْ شُلْشُلُنْ / شَوِلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية منه فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "أول أبيات الخمر (25–32). ويرى شوقي ضَيْف أن الخمر عند الأَعْشَى غير ما عند غيره من الجاهليين: «أما عند الأعشى فإننا نجدها في فاتحة كثير من قصائده تالية لبعض غزله، ونحس كأنها لذته من الدنيا» [@deif، ج1 ص355]. وفي نسخة الشاملة للتِّبْرِيزِيّ «شِوَلُ» بكسر الشين، وهو خطأ في الطبع، والصواب «شَوِلُ» كما في الديوان [@diwan-asha، ص95] واللسان [@lisan، ج2 ص26]."
variants:
  - reading: "شَاوٍ مِشَلٌّ شَلُولٌ شُلْشُلٌ شَمِلُ"
    status: "رواية أخرى"
    note: "ذكرها التِّبْرِيزِيّ، وقال: «والشمل: الطيب النفس والرائحة» [@tabrizi-ashr، ص297]."
  - reading: "شَاوٍ مِشَلٌّ شَلُولٌ شُلْشُلٌ شُوَلُ"
    status: "رواية أبي عُبَيْدة"
    note: "قال التِّبْرِيزِيّ: «وروى أبو عبيدة (شول) على وزن فُعل» [@tabrizi-ashr، ص296]."
  - reading: "شَاوٍ نَشُولٌ مِشَلٌّ شُلْشُلٌ شَوِلُ"
    status: "رواية «الأغاني»"
    note: "[@aghani-dk، ج9 ص153]. والنَّشُول: الذي يُخرج اللحم من القدر، قال التِّبْرِيزِيّ: «والنشول: الذي ينشل اللحم من القدر برفق» [@tabrizi-ashr، ص297]."
