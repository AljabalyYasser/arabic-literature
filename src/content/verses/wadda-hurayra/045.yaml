first: "أَلَسْتَ مُنْتَهِيًا عَنْ نَحْتِ أَثْلَتِنَا"
second: "وَلَسْتَ ضَائِرَهَا مَا أَطَّتِ الْإِبِلُ"
meaning: "ألستَ كافًّا عن الطعن في أصلنا وشرفنا، وأنت لن تضرّه أبدًا، ما دامت الإبل تحنّ وتئنّ؟ قال التِّبْرِيزِيّ: «أَثلتنا: أصلنا وعزُّنا، كما تقول (مجدٌ مُؤثل) قديم له أصل» [@tabrizi-ashr، ص302]."
vocabulary:
  - term: "مُنْتَهِيًا"
    text: "كافًّا ممتنعًا."
  - term: "نَحْتِ"
    text: "النحت: بري الخشب وقشره بالحديد. وفي اللسان أن العرب تقول: فلان ينحت أثلتنا، «إِذا قَالَ فِي حَسَبه قَبِيحًا» [@lisan، ج11 ص9]."
  - term: "أَثْلَتِنَا"
    text: "الأَثْلة: شجرة صلبة الخشب، وأثلة الشيء: أصله. «أثلة كل شيء: أصله» [@lisan، ج11 ص9]."
  - term: "ضَائِرَهَا"
    text: "ضارَّها، من ضاره يضيره إذا ضرّه."
  - term: "أَطَّتِ"
    text: "صوّتت. في اللسان: «وأَطَّت الإِبلُ تَئِطُّ أَطِيطاً: أَنَّتْ تَعَباً أَو حَنيناً أَو رَزَمةً» [@lisan، ج7 ص256]، والرَّزَمة: حنين الناقة إلى ولدها."
syntax:
  - "«أَلَسْتَ» الهمزة للاستفهام، دخلت على «ليس»، والتاء اسمها، و«مُنْتَهِيًا» خبرها. و«عَنْ نَحْتِ» متعلق بـ«مُنْتَهِيًا»."
  - "الواو في «وَلَسْتَ» حالية، والجملة حال من ضمير المخاطب: ألستَ منتهيًا والحال أنك لن تضرّها؟ و«ضَائِرَهَا» خبر «لست»، والضمير للأثلة."
  - "«مَا أَطَّتِ الْإِبِلُ» «ما» مصدرية ظرفية، والتقدير: مدةَ أطيط الإبل، أي أبدًا."
morphology:
  - "«مُنْتَهِي» اسم فاعل من «انْتَهَى» على «افْتَعَلَ» من «نَهَى»."
  - "«ضَائِر» اسم فاعل من «ضار يضير» الأجوف اليائي، قُلبت عينه همزة لوقوعها بعد ألف «فاعل»، كـ«بائع»."
  - "«أَطَّتْ» ماضٍ مضعّف من «أَطَّ يَئِطُّ»، ومصدره الأطيط."
rhetoric:
  thesis: "أول الرسالة توبيخ في صيغة سؤال: كفّ عن الطعن فينا، فطعنك لا يضرّنا. فهو يجمع اللوم والاستخفاف معًا."
  devices:
    - title: "الاستعارة"
      text: "في «نَحْتِ أَثْلَتِنَا» شبّه شرف قومه بشجرة الأثل الراسخة، وشبّه الطعن فيه بنحت خشبها، ثم حذف المشبه وأبقى المشبه به. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وقد صارت العبارة مثلًا يقال لمن يذمّ حسب غيره، كما في اللسان [@lisan، ج11 ص9]."
    - title: "الكناية عن الأبد"
      text: "«مَا أَطَّتِ الْإِبِلُ» كناية عن الدوام، لأن الإبل لا تكفّ عن الأطيط. وفي اللسان: «وَفِي الْمَثَلِ: لَا آتِيكَ مَا أَطَّت الإِبلُ» [@lisan، ج7 ص256]. فاستعمل الشاعر لفظ المثل ليقول: لن تضرّها أبدًا."
    - title: "الاستفهام التقريري"
      text: "«أَلَسْتَ مُنْتَهِيًا» استفهام داخل على نفي، فهو يحمل المخاطب على الإقرار: بلى ينبغي أن تنتهي. وجاءت الحال «وَلَسْتَ ضَائِرَهَا» بعده، فصار السؤال احتقارًا لسعيه: تتعب في نحت ما لا ينحت."
  connection: "ثم يضرب ليزيد مثلًا يصوّر هذا السعي الخائب: الوعل ينطح الصخرة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "أَلَسْتَ مُنْ / تَهِيَنْ / عَنْ نَحْتِ أَثْ / لَتِنَا = متفعلن / فعِلن / مستفعلن / فعِلن — وَلَسْتَ ضَا / ئِرَهَا / مَا أَطْطَتِلْ / إِبِلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى فصارت «متفعلن»، و«فاعلن» الأولى فصارت «فعِلن»، في الشطرين [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 46 في الديوان، بلفظه [@diwan-asha، ص97]، ويلخصه محققه: «أما آن لك أن تنتهى عن نحت أثلتنا، وأن تعلم أنك لست ضائرها أبد الدهر؟» [@diwan-asha، ص96]. وأنشده المُبَرِّد بين البيت السابق والبيت التالي [@kamil، ج2 ص198]، وأنشده ابن منظور في مادتين: «أطط» [@lisan، ج7 ص256] و«أثل» [@lisan، ج11 ص9]."
