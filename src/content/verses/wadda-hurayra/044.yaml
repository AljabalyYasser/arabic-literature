first: "أَبْلِغْ يَزِيدَ بَنِي شَيْبَانَ مَأْلُكَةً"
second: "أَبَا ثُبَيْتٍ أَمَا تَنْفَكُّ تَأْتَكِلُ"
meaning: "أوصِلْ إلى يَزِيد، يزيدِ بني شَيْبان، رسالةً مني: يا أبا ثُبَيْت، ألا تزال تحترق غيظًا وتسعى بالشر بيننا؟ قال التِّبْرِيزِيّ: «المأْلُكَة والمأْلَكَة: الرسالة، والايتكال: الفساد والسعي بالشر» [@tabrizi-ashr، ص301]، ثم قال: «تأتكل: تحتكُّ من الغيظ» [@tabrizi-ashr، ص302]."
vocabulary:
  - term: "أَبْلِغْ"
    text: "أوصِلْ، والخطاب لرسول غير معيّن."
  - term: "مَأْلُكَةً"
    text: "رسالة. قال أبو عُبَيْدة: «مألكة: رسالة، والجمع مآلك» [@aghani-dk، ج9 ص154]. وفي اللسان: «والأَلوك والمَأْلَكة والمَأْلُكة: الرِّسَالَةُ لأَنها تُؤْلَك فِي الْفَمِ» [@lisan، ج10 ص392]، أي تُلاك وتُردَّد في الفم."
  - term: "أَبَا ثُبَيْتٍ"
    text: "كنية يَزِيد بن مُسْهِر، وثُبَيْت تصغير ثابت. وفي «الأغاني» أن الأَعْشَى قال القصيدة «ليزيد بن مسهر أبى ثابت الشيبانى» [@aghani-dk، ج9 ص154]."
  - term: "مَا تَنْفَكُّ"
    text: "ما تزال. «ما تنفك: ما تزال» [@aghani-dk، ج9 ص154]."
  - term: "تَأْتَكِلُ"
    text: "فيها أقوال: قال أبو عُبَيْدة: «وتأتكل: تحرّق» [@aghani-dk، ج9 ص154]. وذكر التِّبْرِيزِيّ أنها الفساد والسعي بالشر، أو أن تحتكّ من الغيظ [@tabrizi-ashr، ص301–302]. وفي اللسان: «والنار إذا اشتد التهابها كأنها يأكل بعضها بعضا، يقال: ائتكلت النار» [@lisan، ج11 ص22]، ونقل عن أبي نصر: «معناه تأكل لحومنا وتغتابنا، وهو تفتعل من الأكل» [@lisan، ج11 ص23]."
syntax:
  - "«أَبْلِغْ» فعل أمر، فاعله ضمير المخاطب، و«يَزِيدَ» مفعول أول، و«مَأْلُكَةً» مفعول ثانٍ. و«بَنِي شَيْبَانَ» مضاف إليه: أضاف العلم إلى قبيلته ليميّزه، أي يزيد الذي هو من بني شيبان."
  - "«أَبَا ثُبَيْتٍ» منادى بحرف نداء محذوف، منصوب بالألف لأنه من الأسماء الخمسة، ومضاف. والجملة بعده نص الرسالة."
  - "«أَمَا» الهمزة للاستفهام دخلت على «ما» النافية، والاستفهام للتوبيخ. و«تَنْفَكُّ» فعل ناقص من أخوات «كان»، واسمه ضمير المخاطب، وجملة «تَأْتَكِلُ» خبره. والنفي مع «انفكّ» يفيد الاستمرار، كـ«ما زال»."
morphology:
  - "«مَأْلُكَة» على «مَفْعُلَة» من «أَلَك»، وفيها «مَأْلَكة» بفتح اللام [@tabrizi-ashr، ص301]."
  - "«ثُبَيْت» تصغير «ثابت» على «فُعَيْل» بعد حذف الألف الزائدة، ويسمى تصغير الترخيم. وقد أورد المَرْزُبانيّ هذا البيت في «المُوَشَّح» مع أمثلة لما صغّره الشعراء، تحت قوله: «وقد صغّر الشاعر» [@muwashshah، ص129]."
  - "«تَأْتَكِل» على «تَفْتَعِل» من «أكل»، كما قال أبو نصر. وفي اللسان قول آخر عن يعقوب: «إنما أراد تأتلك من الألوك؛ حكاه يعقوب في المقلوب» [@lisan، ج10 ص392]، أي إن أصلها «تأتلك» من الرسالة، ثم قُدّمت الكاف على اللام."
rhetoric:
  thesis: "هنا يبلغ الشاعر غرضه الذي قال القصيدة من أجله. يروي أبو عُبَيْدة أن رجلًا من قوم الأَعْشَى قتل رجلًا من بني هَمّام من شَيْبان، فقال يَزِيد بن مُسْهِر لقوم القتيل: «اقتلوا به سيدا من بني سعد بن مالك بن ضبيعة»، فقال الأَعْشَى هذه القصيدة [@aghani-dk، ج9 ص154–155]. فكل ما سبق من غزل ولهو ورحلة ومطر كان تمهيدًا لهذه الرسالة."
  devices:
    - title: "الانتقال المفاجئ"
      text: "لم يمهّد للانتقال من ديار هُرَيْرَة إلى يَزِيد، بل قطع الكلام وبدأ بفعل أمر: «أَبْلِغْ». ويقول محقق الديوان إنه بعد أن أرضى نفسه من صاحبته وشبابه «اتجه فجأة إلى صاحب له يتخيله» [@diwan-asha، ص96]. وبين المقطعين خيط خفي: ذكر التِّبْرِيزِيّ أن دُرْنَى التي كان يشرب فيها في البيت 39 «كان فيها أبو ثُبيت الذي ذكره» [@tabrizi-ashr، ص300]."
    - title: "الرسالة بلسان رسول"
      text: "لم يخاطب يَزِيد مباشرة، بل كلّف رسولًا متخيَّلًا أن يحمل إليه «مَأْلُكَةً». وفي ذلك ترفّع: كأنه لا يرى يزيد أهلًا لأن يخاطبه وجهًا لوجه. وهي قراءتنا."
    - title: "النداء بالكنية المصغّرة"
      text: "ناداه بـ«أَبَا ثُبَيْتٍ»، وكنيته أبو ثابت، فصغّر الاسم. والتصغير قد يأتي للتحقير، وهو يناسب مقام العتاب والوعيد هنا، وقد يأتي للتحبيب، ولم نجد من القدماء من نصّ على غرضه في هذا البيت."
    - title: "الاستفهام للتوبيخ"
      text: "في «أَمَا تَنْفَكُّ تَأْتَكِلُ» لم يسأل ليعلم، بل ليلوم: ما زلتَ على هذه الحال ولا تكفّ عنها. ويقول المُبَرِّد عن هذه القصيدة وعن قصيدة الأَعْشَى الأخرى «هريرة ودعها» إنه «يعاتب فيهما يزيد بن مسهر الشيباني» [@kamil، ج2 ص198]."
  connection: "ثم يفصّل الرسالة: ألستَ منتهيًا عن النيل من أصلنا؟"
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "أَبْلِغْ يَزِي / دَ بَنِي / شَيْبَانَ مَأْ / لُكَتَنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — أَبَا ثُبَيْ / تِنْ أَمَا / تَنْفَكْكُ تَأْ / تَكِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من الصدر فصارت «فعِلن»، و«مستفعلن» الأولى من العَجُز فصارت «متفعلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]. ولا يستقيم الوزن بـ«أبا ثابت»، فالتصغير هنا يوافق الوزن أيضًا."
context: "أول مقطع الرسالة إلى يَزِيد بن مُسْهِر (44–54)، وهو البيت 45 في الديوان [@diwan-asha، ص97]. وهو من الأبيات التي غُنّيت، ولحُنَيْن الحِيرِيّ فيه لحن [@aghani-dk، ج9 ص153]. وأنشده المُبَرِّد مع البيتين بعده [@kamil، ج2 ص198]."
