first: "غَرَّاءُ فَرْعَاءُ مَصْقُولٌ عَوَارِضُهَا"
second: "تَمْشِي الْهُوَيْنَى كَمَا يَمْشِي الْوَجِي الْوَحِلُ"
meaning: "هي بيضاء واسعة الجبين، طويلة الشعر، نقية الأسنان لامعتها، تمشي على مهل كما يمشي من يشتكي قدمه وهو يخوض في الطين. قال التِّبْرِيزِيّ: «(تمشى الهوينا) على رسلها»، وقال في الوجي: «وهو مع ذلك وحل؛ فهو أشد عليه» [@tabrizi-ashr، ص289]."
vocabulary:
  - term: "غَرَّاءُ"
    text: "قال الأَصْمَعِيّ: «الغراء البيضاء الواسعة الجبين» [@tabrizi-ashr، ص288]. وسأل الأَصْمَعِيّ أعرابية: «ما الغراء؟ قالت: التي بين حاجبيها بلج وفي جبهتها اتساع» [@aghani-dk، ج9 ص154]. والبَلَج: أن يتباعد الحاجبان فلا يلتقيا."
  - term: "فَرْعَاءُ"
    text: "«الطويلة الفرع أي الشعر» [@tabrizi-ashr، ص289]. وقال أبو عُبَيْدة: «الفرعاء: الكثيرة الشعر» [@aghani-dk، ج9 ص154]."
  - term: "مَصْقُولٌ عَوَارِضُهَا"
    text: "«أي نقية العوارض»، و«قال أبو عمرو الشيباني: العوارض الرباعيات والأنياب» [@tabrizi-ashr، ص289]. وفي اللسان: «والعَوارِضُ: الثَّنايا سُميت عَوارِضَ لأَنها فِي عُرْضِ الفَم»، و«قِيلَ: عارِضُ الفَمِ مَا يَبْدُو مِنْهُ عِنْدَ الضَّحِكِ» [@lisan، ج7 ص180]. والمصقول: المجلوّ اللامع."
  - term: "الْهُوَيْنَى"
    text: "المشي على مهل. قال أبو عُبَيْدة: «والهوينى تصغير الهونى، والهونى: مؤنث الأهون» [@aghani-dk، ج9 ص154]."
  - term: "الْوَجِي"
    text: "«الذي يشتكي حافره ولم يحف» [@tabrizi-ashr، ص289]، والوَجَى أن يرقّ باطن القدم أو الحافر من كثرة المشي. ويقول محققو دار الكتب: هو «أن يجد ألما في رجليه عند المشي» [@aghani-dk، ج9 ص112]."
  - term: "الْوَحِلُ"
    text: "قال أبو عُبَيْدة: «الذي قد وقع في الوحل» [@aghani-dk، ج9 ص154]، والوحل: الطين الرقيق."
syntax:
  - "قال التِّبْرِيزِيّ: «وغراء: مرفوع لأنه خبر مبتدأ، ويجوز نصبه بمعنى أعنى» [@tabrizi-ashr، ص289]، أي: هي غرّاء، أو: أعني غرّاءَ. و«فَرْعَاءُ» و«مَصْقُولٌ» خبران بعده."
  - "«عَوَارِضُهَا» نائب فاعل لاسم المفعول «مَصْقُولٌ»، وهو ما يسميه التِّبْرِيزِيّ «اسم ما لم يسم فاعله». وجاء «مصقول» مفردًا مذكرًا وهو للعوارض، كما قرئ «لَا يَحِلُّ لَكَ النِّسَاءُ» بالياء [@tabrizi-ashr، ص289]؛ فالوصف إذا رفع اسمًا ظاهرًا بعده لزم الإفراد."
  - "«الْهُوَيْنَى» «في موضع نصب على المصدر» [@tabrizi-ashr، ص289]، أي: تمشي المشية الهوينى. و«كَمَا»: الكاف للتشبيه، و«ما» مصدرية، والتقدير: كمشي الوجي. و«الْوَجِي» فاعل «يمشي»، و«الْوَحِلُ» صفته."
morphology:
  - "«غَرَّاءُ» و«فَرْعَاءُ» على «فَعْلاء»، مؤنث «أغرّ» و«أفرع»، وكلاهما ممنوع من الصرف لألف التأنيث الممدودة."
  - "«مَصْقُولٌ» اسم مفعول من «صَقَل يصقُل»، على «مَفْعول»."
  - "«الْوَجِي» و«الْوَحِلُ» صفتان على «فَعِل»، من «وَجِيَ» إذا رقّت قدمه، و«وَحِلَ» إذا وقع في الوحل."
rhetoric:
  thesis: "صورة في شطرين: صدر يرسمها ساكنة بثلاث صفات متتابعة، وعجز يرسمها متحركة. وجعل الشَّعْبِيّ هذا البيت «أغزل» بيت للأعشى [@aghani-dk، ج9 ص112]."
  devices:
    - title: "تتابع الصفات"
      text: "في «غَرَّاءُ فَرْعَاءُ مَصْقُولٌ عَوَارِضُهَا» ثلاث صفات بلا حرف عطف، وكل واحدة لموضع من وجهها: الجبين، ثم الشعر، ثم الأسنان. فيأتي الوصف سريعًا كأن العين تنتقل من موضع إلى موضع."
    - title: "التشبيه"
      text: "في «تَمْشِي الْهُوَيْنَى كَمَا يَمْشِي الْوَجِي الْوَحِلُ» شبّه بطء مشيتها بمشي من اجتمع عليه أمران: وجع القدم والطين، فهو «أشد عليه» كما يقول التِّبْرِيزِيّ [@tabrizi-ashr، ص289]. والوجه بينهما البطء والتمهل لا الألم، وبطء مشي المرأة عندهم من علامات النعمة والامتلاء."
  connection: "ثم يعود إلى مشيتها فيشبهها بمرّ السحابة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "غَرْرَاءُ فَرْ / عَاءُ مَصْ / قُولُنْ عَوَا / رِضُهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — تَمْشِلْ هُوَيْ / نَى كَمَا / يَمْشِلْ وَجِلْ / وَحِلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "جاء الحشو تامًّا في الشطرين: «مستفعلن فاعلن مستفعلن». والعروض والضرب مخبونان «فعِلن»، والخَبْن حذف الثاني الساكن، وهي صورة البسيط التام المشهورة [@atiq، ص46، ص48]."
context: "يبدأ وصف هُرَيْرَة بعد سؤال المطلع، فكأن صورتها هي الجواب: من كانت هذه صفتها لا يطاق وداعها. والبيت من الأبيات التي غُنّيت من القصيدة [@aghani-dk، ج9 ص152]."
variants:
  - reading: "تَمْشِي الْهُوَيْنَى كَمَنْ يَمْشِي الْوَجِي الْوَحِلُ"
    status: "نسخة الشاملة للتِّبْرِيزِيّ"
    note: "لا يستقيم بها الإعراب، لأن «الوجي الوحل» يبقى بلا عامل، فهي خطأ في الطبع. والصواب «كَمَا يَمْشِي» كما في الديوان [@diwan-asha، ص91] و«الأغاني» [@aghani-dk، ج9 ص112] واللسان [@lisan، ج7 ص180]."
