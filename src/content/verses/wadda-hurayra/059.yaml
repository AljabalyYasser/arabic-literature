first: "حَتَّى يَظَلَّ عَمِيدُ الْقَوْمِ مُرْتَفِقًا"
second: "يَدْفَعُ بِالرَّاحِ عَنْهُ نِسْوَةٌ عُجُلُ"
meaning: "...حتى يبقى سيّد القوم صريعًا متكئًا على مرفقه لا يقدر على النهوض، تدفع عنه بأكفّها نساءٌ ثكالى. قال التِّبْرِيزِيّ إن النساء يدفعن عنه «بأكفهن لئلا يُقتل؛ لأن من يدفع عنه من الرجال قد قُتل، وقيل: المعنى يدفعن لئلا يُوطأ بعد القتل» [@tabrizi-ashr، ص306]."
vocabulary:
  - term: "عَمِيدُ الْقَوْمِ"
    text: "سيدهم. في اللسان: «وعَمِيدُ الْقَوْمِ وعَمُودُهم: سَيِّدُهُمْ» [@lisan، ج3 ص305]."
  - term: "مُرْتَفِقًا"
    text: "متكئًا على مِرفقه، وهي هيئة الجريح الذي لا يستطيع القيام. وفي رواية الديوان «مُتَّكِئًا» [@diwan-asha، ص97]."
  - term: "بِالرَّاحِ"
    text: "بالأكف. ويقول محقق الديوان: «الراح جمع راحة وهى بطن اليد» [@diwan-asha، ص97]."
  - term: "عُجُلُ"
    text: "ثكالى. «العُجُل: جمع عجول، وهي الثكلى» [@tabrizi-ashr، ص305]. وفي اللسان: «والعَجُول مِنَ النِّسَاءِ والإِبل: الوالِه الَّتِي فَقَدَتْ وَلَدَها الثَّكْلَى لعَجَلتِها فِي جَيْئَتِها وذَهَابها جَزَعاً» [@lisan، ج11 ص427]."
syntax:
  - "«حَتَّى» حرف غاية، و«يَظَلَّ» مضارع ناقص منصوب بـ«أن» مضمرة بعدها، و«عَمِيدُ» اسمه، و«مُرْتَفِقًا» خبره. والغاية متعلقة بالطعن في البيت السابق: يطعنونهم حتى يصير سيدهم إلى هذه الحال."
  - "جملة «يَدْفَعُ بِالرَّاحِ عَنْهُ نِسْوَةٌ» حال ثانية من «عَمِيدُ»: «نِسْوَةٌ» فاعل مؤخر، و«عُجُلُ» صفة له. وذُكّر الفعل «يَدْفَعُ» لأن الفاعل جمع تكسير، فيجوز تذكير فعله وتأنيثه."
morphology:
  - "«مُرْتَفِق» اسم فاعل من «ارْتَفَقَ» على «افْتَعَلَ» من المِرْفَق، أي اتكأ عليه."
  - "«الرَّاح» جمع «راحة»، وهو من الجمع الذي يُفرق بينه وبين واحده بالتاء."
  - "«عُجُل» جمع «عَجُول» على «فُعُل»، كـ«صُبُر» جمع «صَبُور»، و«نِسْوَة» جمع قلة لامرأة من غير لفظها."
rhetoric:
  thesis: "صورة حرب تُرى في لحظة واحدة: السيد صريع، ورجاله قُتلوا حوله، ولم يبق من يحميه إلا النساء. فالوعيد هنا مشهد لا خبر."
  devices:
    - title: "الكناية"
      text: "«يَدْفَعُ بِالرَّاحِ عَنْهُ نِسْوَةٌ عُجُلُ» كناية عن مقتل رجال الحي جميعًا: لم يقل «قُتل رجاله»، بل ذكر ما يلزم عن ذلك، وهو أن النساء صرن يدفعن عنه، كما فسّره التِّبْرِيزِيّ: «لأن من يدفع عنه من الرجال قد قُتل» [@tabrizi-ashr، ص306]."
    - title: "المفارقة"
      text: "«عَمِيدُ الْقَوْمِ» الذي يعتمد عليه قومه صار يعتمد على مرفقه، ومن كان يحمي النساء صار النساء يحمينه بأكفهن. وهي قراءتنا."
    - title: "اختيار «عُجُل»"
      text: "وصف النساء بالعُجُل، أي الثكالى اللواتي يجئن ويذهبن جزعًا، فجمع في كلمة واحدة الثكل والاضطراب."
  connection: "ثم يذكر ما أصاب هذا السيد: سيف هندي أو رمح خطّي."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "حَتْتَى يَظَلْ / لَ عَمِي / دُلْقَوْمِ مُرْ / تَفِقَنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — يَدْفَعُ بِرْ / رَاحِ عَنْ / هُ نِسْوَتُنْ / عُجُلُو = مستعلن / فاعلن / متفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من الصدر فصارت «فعِلن»، و«مستفعلن» الثانية من العَجُز فصارت «متفعلن» [@atiq، ص46]. ودخل الطَّيُّ، وهو حذف الرابع الساكن، «مستفعلن» الأولى من العَجُز فصارت «مستعلن» [@atiq، ص47]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 58 في الديوان [@diwan-asha، ص97]. ويلخص محققه البيتين: «ويخر فيه عميد القوم صريع السيوف والرماح، قد اتكأ على مرفقه خائر القوى، وقد هلك من حوله الرجال، يدفع عنه النسوة بأيديهن» [@diwan-asha، ص98]."
