first: "حَتَّى تَحَمَّلَ مِنْهُ الْمَاءَ تَكْلِفَةً"
second: "رَوْضُ الْقَطَا فَكَثِيبُ الْغَيْنَةِ السَّهِلُ"
meaning: "حتى حمل رَوْضُ القَطَا ماءه على مشقة، لكثرته، ثم حمله كثيب الغَيْنة الليّن. قال التِّبْرِيزِيّ: «يقول: تحمل روض القطا ما لا يطيق إلا على مشقة لكثرته»، وقال: «وتكلفة: في موضع الحال» [@tabrizi-ashr، ص301]."
vocabulary:
  - term: "تَحَمَّلَ"
    text: "حمل الشيء على مشقة."
  - term: "تَكْلِفَةً"
    text: "تكلُّفًا ومشقة. ويقول محقق الديوان: «تكلفة أي تكلف ذلك لما ضاق به الموضع الآخر» [@diwan-asha، ص95]."
  - term: "رَوْضُ الْقَطَا"
    text: "موضع، والروض جمع روضة، والقطا طائر."
  - term: "كَثِيبُ"
    text: "التل من الرمل."
  - term: "الْغَيْنَةِ"
    text: "قال التِّبْرِيزِيّ: «الأرض الشجراء» [@tabrizi-ashr، ص301]. وفي اللسان: «والغَيْنة الشَّجْراءُ: مِثْلُ الغَيْضة الْخَضْرَاءِ» [@lisan، ج13 ص316]، والغيضة: الأجمة الكثيفة الشجر."
  - term: "السَّهِلُ"
    text: "الليّن من الأرض، خلاف الحَزْن."
syntax:
  - "«حَتَّى» حرف ابتداء وغاية، ومعطوفة في المعنى على «حَتَّى» في البيت السابق. و«تَحَمَّلَ» فعل ماضٍ، و«رَوْضُ الْقَطَا» فاعله مؤخر، و«الْمَاءَ» مفعول به مقدم على الفاعل، و«مِنْهُ» متعلق بـ«تَحَمَّلَ»، والضمير للعارض."
  - "«تَكْلِفَةً» مصدر في موضع الحال، كما قال التِّبْرِيزِيّ، أي متكلّفًا."
  - "«فَكَثِيبُ» معطوف على «رَوْضُ»، و«السَّهِلُ» صفة لـ«كَثِيبُ»."
morphology:
  - "«تَحَمَّلَ» على «تَفَعَّلَ» الدال على التكلف، أي حمله بجهد."
  - "«تَكْلِفَة» مصدر «كَلَّفَ» على «تَفْعِلَة»، كـ«تَكْرِمة» من «كَرَّم»."
  - "«السَّهِل» صفة على «فَعِل»، ويقال «سَهْل» بالسكون."
rhetoric:
  thesis: "ذروة وصف المطر: الأرض لا تكاد تطيق ما يحمله إليها السحاب، والروض يحمل الماء كما يحمل الإنسان ما يثقل عليه."
  devices:
    - title: "تشخيص الروض"
      text: "في «تَحَمَّلَ ... الْمَاءَ تَكْلِفَةً رَوْضُ الْقَطَا» جعل الروض كائنًا يتكلف حمل ما يفوق طاقته. وهذه كناية عن غزارة المطر. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]: فلم يقل «كثر الماء»، بل ذكر ما يتبع كثرته، وهو عجز الأرض عن حمله."
    - title: "تقديم المفعول"
      text: "قدّم «الْمَاءَ» على الفاعل «رَوْضُ الْقَطَا»، فوقع الماء في وسط الصدر، وتأخر حامله إلى أول العجز، كأن الماء سبق الأرض."
    - title: "تكرار «حتى»"
      text: "«حَتَّى تَدَافَعَ» في البيت السابق، و«حَتَّى تَحَمَّلَ» هنا: غايتان متتاليتان، كل منهما أبعد من الأخرى."
  connection: "ثم يأتي ما كان كل ذلك المطر من أجله: ديار هُرَيْرَة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "حَتْتَى تَحَمْ / مَلَ مِنْ / هُلْمَاءَ تَكْ / لِفَتَنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — رَوْضُلْ قَطَا / فَكَثِي / بُلْغَيْنَةِسْ / سَهِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 29 في الديوان، بلفظه [@diwan-asha، ص95]. ويلخص محققه المقطع بأن الماء «انصب إلى الرياض وإلى الوديان ذات الأشجار» [@diwan-asha، ص96]، وهما روض القطا والغينة في هذا البيت."
