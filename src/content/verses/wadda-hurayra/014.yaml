first: "يَوْمًا بِأَطْيَبَ مِنْهَا نَشْرَ رَائِحَةٍ"
second: "وَلَا بِأَحْسَنَ مِنْهَا إِذْ دَنَا الْأُصُلُ"
meaning: "...ليست تلك الروضة يومًا أطيب منها رائحة، ولا أحسن منها منظرًا حين يقترب المساء. وخصّ وقت الأصيل لأن الروضة فيه أجمل ما تكون، قال التِّبْرِيزِيّ: «وإنما خص هذا الوقت لأن النبت يكون فيه أحسن ما يكون؛ لتباعد الشمس والفيء عنه» [@tabrizi-ashr، ص293]."
vocabulary:
  - term: "نَشْرَ"
    text: "«النشر: الرائحة الطيبة» [@tabrizi-ashr، ص293]."
  - term: "الْأُصُلُ"
    text: "«والأصل: جمع أصيل، والأصيل: من العصر إلى العشاء» [@tabrizi-ashr، ص293]."
syntax:
  - "«يَوْمًا» ظرف زمان. و«بِأَطْيَبَ» خبر «مَا» في البيت 12، والباء زائدة لتوكيد النفي، و«أَطْيَبَ» مجرور لفظًا بالفتحة لأنه ممنوع من الصرف، منصوب محلًّا على أنه خبر «ما»."
  - "«نَشْرَ رَائِحَةٍ» تمييز. قال التِّبْرِيزِيّ: «ونشر: منصوب على البيان وإن كان مضافا؛ لأن المضاف إلى النكرة نكرة» [@tabrizi-ashr، ص293]. والبيان عنده التمييز. ويقول إنه لا يجوز جرّه بالإضافة إلى «أطيب»، لأن ذلك يجعل المعنى أنها هي أطيب الروائح، والمراد أن رائحتها أطيب."
  - "«وَلَا بِأَحْسَنَ مِنْهَا» معطوف على «بِأَطْيَبَ»، و«لا» زائدة لتأكيد النفي. و«إِذْ دَنَا الْأُصُلُ» ظرف متعلق بـ«أَحْسَنَ»."
morphology:
  - "«أَطْيَب» و«أَحْسَن» اسما تفضيل على «أَفْعَل»، ممنوعان من الصرف للوصفية ووزن الفعل."
  - "«أُصُل» جمع «أَصِيل» على «فُعُل»، كـ«سُبُل» جمع «سبيل». و«نَشْر» مصدر سُمّيت به الرائحة."
rhetoric:
  thesis: "هنا يتم الكلام: بعد بيتين في جمال الروضة يأتي الخبر، فإذا كل ذلك الجمال دون هُرَيْرَة رائحةً ومنظرًا. ويقول شوقي ضَيْف: «ثم قال إن هذه الروضة على حسنها وشذاها العطر ليست أطيب من صاحبته شذى» [@deif، ج1 ص365]."
  devices:
    - title: "إتمام التضمين"
      text: "يأتي في «بِأَطْيَبَ» الخبر الذي علّق عليه السامع منذ البيت 12. وهذا ما أجازه ابن رَشِيق حين قال عن الأبيات التي تحول بين بيتي التضمين: «ولا يضره ذلك إذا أجاد» [@ibn-rashiq، ج1 ص172]. وقد أجاد هنا: فالانتظار يجعل الخبر أوقع."
    - title: "تفضيلان لحاستين"
      text: "قسم التفضيل قسمين: «بِأَطْيَبَ مِنْهَا نَشْرَ رَائِحَةٍ» للشم، و«وَلَا بِأَحْسَنَ مِنْهَا» للبصر. فيعود إلى الرائحة التي بدأ بها في البيت 11، ويضيف إليها المنظر."
    - title: "اختيار الوقت"
      text: "في «إِذْ دَنَا الْأُصُلُ» اختار أجمل ساعات الروضة، كما شرح التِّبْرِيزِيّ، فالمقارنة بأحسن روضة في أحسن ساعاتها."
  connection: "ثم يترك الوصف إلى قصة حبه: سلسلة لا يلتقي فيها محب ومحبوب."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "يَوْمَنْ بِأَطْ / يَبَ مِنْ / هَا نَشْرَ رَا / ئِحَتِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — وَلَا بِأَحْ / سَنَ مِنْ / هَا إِذْ دَنَلْ / أُصُلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "آخر الأبيات الثلاثة التي جعلها ابن قُتَيْبة «أحسن ما قيل في الرياض» [@ibn-qutayba، ج1 ص258]. وبها يُختم وصف هُرَيْرَة الذي بدأ في البيت الثاني."
