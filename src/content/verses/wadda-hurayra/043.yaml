first: "يَسْقِي دِيَارًا لَهَا قَدْ أَصْبَحَتْ غَرَضًا"
second: "زُورًا تَجَانَفُ عَنْهَا الْقَوْدُ وَالرَّسَلُ"
meaning: "هذا السحاب يسقي ديارًا لهُرَيْرَة صارت هدفًا للأمطار، بعيدة منعزلة عن الناس، تميل عنها الخيل والإبل فلا تقربها. قال التِّبْرِيزِيّ: «قوله (غرضا) أي غرضا للأمطار ... وزورا: ازورت عن الناس، والقود: الخيل»، ثم قال: «يريد انهم أعزاء لا يغزون؛ فقد تجانف عنها الخيل والإبل» [@tabrizi-ashr، ص301]."
vocabulary:
  - term: "غَرَضًا"
    text: "هدفًا. «أي غرضا للأمطار» [@tabrizi-ashr، ص301]، أي تقصدها الأمطار كما يُقصد الهدف بالرمي."
  - term: "زُورًا"
    text: "مائلة بعيدة. «وزورا: ازورت عن الناس» [@tabrizi-ashr، ص301]."
  - term: "تَجَانَفُ"
    text: "تميل. في اللسان: «وتجانَفَ لإِثمٍ أَي مَالَ» [@lisan، ج9 ص33]. ويقول محقق الديوان: «تجانف عدل وانحرف» [@diwan-asha، ص95]."
  - term: "الْقَوْدُ"
    text: "«والقود: الخيل» [@tabrizi-ashr، ص301]، سميت بذلك لأنها تُقاد."
  - term: "الرَّسَلُ"
    text: "الإبل، أو القطيع منها. في اللسان: «والرَّسَل: قَطِيع بَعْدَ قَطِيع» [@lisan، ج11 ص281]."
syntax:
  - "«يَسْقِي» فعل مضارع، وفاعله ضمير يعود على العارض في البيت 36، فالجملة تتمة وصفه. و«دِيَارًا» مفعول به، و«لَهَا» متعلق بمحذوف صفة لـ«دِيَارًا»، والضمير لهُرَيْرَة."
  - "جملة «قَدْ أَصْبَحَتْ غَرَضًا» صفة ثانية لـ«دِيَارًا»: «أَصْبَحَتْ» فعل ناقص، واسمها ضمير الديار، و«غَرَضًا» خبرها."
  - "«زُورًا» خبر ثانٍ لـ«أَصْبَحَتْ»، أو حال. وجملة «تَجَانَفُ عَنْهَا الْقَوْدُ وَالرَّسَلُ» صفة لـ«زُورًا» أو حال من الديار."
morphology:
  - "«تَجَانَفُ» أصله «تَتَجَانَفُ» على «تَتَفَاعَلُ»، حُذفت إحدى التاءين تخفيفًا، كما في «تَنَزَّلُ» بمعنى «تتنزّل»."
  - "«زُور» جمع «زَوْراء» أو «أَزْوَر» على «فُعْل»، وهو المائل، كـ«حُمْر» جمع «أحمر» و«حمراء»."
  - "«الْقَوْد» مصدر «قاد يقود» سُمّيت به الخيل، و«الرَّسَل» على «فَعَل»."
rhetoric:
  thesis: "هنا يصل المطر إلى غايته: ديار هُرَيْرَة. فالسحاب الذي تتبّعه الشاعر من موضع إلى موضع كان يمضي إليها، وتعود الحبيبة في آخر مقطع السحاب بعد أن غابت منذ البيت 21."
  devices:
    - title: "السقيا"
      text: "جعل المطر الذي تتبّعه ثمانية أبيات يسقي ديارها، فصار وصف السحاب كله طريقًا إليها وحنينًا. ولم يذكر هُرَيْرَة باسمها، بل بضمير واحد في «لَهَا»، فكفى الضمير بعد أن ملأ اسمها أول القصيدة. وهي قراءتنا."
    - title: "قراءتان لعزلة الديار"
      text: "«تَجَانَفُ عَنْهَا الْقَوْدُ وَالرَّسَلُ» يقرؤها التِّبْرِيزِيّ مدحًا: أهلها «أعزاء لا يغزون» [@tabrizi-ashr، ص301]، فالخيل الغازية تتجنبها. ويقرؤها محقق الديوان وحشة: الديار «أصبحت بعيدة لا تقصدها الخيل ولا الركبان» [@diwan-asha، ص96]. فإن صح الأول فهو ثناء على قومها، وإن صح الثاني فهو أثر رحيلها."
    - title: "الخيل والإبل"
      text: "ختم المقطع بـ«الْقَوْدُ وَالرَّسَلُ»، فذكر الخيل والإبل معًا، أي الغزاة والرعاة، فلا يقرب الديار أحد."
  connection: "وبعد هذا البيت ينقطع الحديث عن هُرَيْرَة والسحاب، ويلتفت الشاعر فجأة إلى رسالة يبعث بها إلى يَزِيد بن مُسْهِر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "يَسْقِي دِيَا / رَنْ لَهَا / قَدْ أَصْبَحَتْ / غَرَضَنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — زُورَنْ تَجَا / نَفُ عَنْ / هَلْقَوْدُ وَرْ / رَسَلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "آخر مقطع السحاب (36–43)، وهو البيت 30 في الديوان [@diwan-asha، ص95]. ويلخص محقق الديوان ما بعده بقوله: «فإذا أرضى الشاعر نفسه من صاحبته ومن شبابه وذكرياته على ما أراد، اتجه فجأة إلى صاحب له يتخيله، طالبًا إليه أن يبلغ يزيد بن مسهر الشيبانى رسالة منه» [@diwan-asha، ص96]."
variants:
  - reading: "يَسْقِي دِيَارًا لَهَا قَدْ أَصْبَحَتْ عُزُبًا"
    status: "رواية ذكرها التِّبْرِيزِيّ، وهي رواية الديوان"
    note: "قال التِّبْرِيزِيّ: «ويروى (عزبا) أي عوازب» [@tabrizi-ashr، ص301]، أي بعيدة. وكذلك في الديوان [@diwan-asha، ص95]، ويقول محققه: «عزبا اي بعيدة، والعازب الكلأ المبعد» [@diwan-asha، ص95]."
  - reading: "يَسْقِي رِيَاضًا لَهَا قَدْ أَصْبَحَتْ غَرَضًا / زَوْرًا تَجَانَفُ عَنْهَا الْقَوْدُ وَالرَّسَلُ"
    status: "رواية لسان العرب"
    note: "[@lisan، ج11 ص281]."
