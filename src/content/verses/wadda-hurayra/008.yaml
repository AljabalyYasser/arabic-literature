first: "صِفْرُ الْوِشَاحِ وَمِلْءُ الدِّرْعِ بَهْكَنَةٌ"
second: "إِذَا تَأَتَّى يَكَادُ الْخَصْرُ يَنْخَزِلُ"
meaning: "هي دقيقة الخصر فوشاحها لا يملؤه خصرها، ممتلئة الجسم يملأ قميصها، تامّة الخلق؛ إذا ترفّقت في قيامها كاد خصرها ينقطع لدقته. قال التِّبْرِيزِيّ: «صِفرُ الوشاح: يعني إنها خميصة البطن دقيقة الخصر؛ فوشاحها يقلق عنها لذلك، فهي تملأ الدرع لأنها ضخمة» [@tabrizi-ashr، ص290]."
vocabulary:
  - term: "صِفْرُ"
    text: "خالٍ."
  - term: "الْوِشَاحِ"
    text: "حلي تشدّه المرأة على جسدها. وفي اللسان: «والوشاح: كله حلي النساء، كرسان من لؤلؤ وجوهر منظومان مخالف بينهما معطوف أحدهما على الآخر، تتوشح المرأة به» [@lisan، ج2 ص632]. والكِرْس: القلادة ذات الطبقات."
  - term: "الدِّرْعِ"
    text: "قميص المرأة، لا درع الحرب. ويفسره محقق الديوان: «والدرع القميص» [@diwan-asha، ص91]."
  - term: "بَهْكَنَةٌ"
    text: "قال التِّبْرِيزِيّ: «والبهكنة: الكبيرة الخلق» [@tabrizi-ashr، ص290]. وفي اللسان: «ابن الأعرابي: البهكنة الجارية الخفيفة الروح الطيبة الرائحة المليحة الحلوة» [@lisan، ج13 ص60]."
  - term: "تَأَتَّى"
    text: "قال التِّبْرِيزِيّ في معناها: «ترفق، من قولك (هو يتأتى للأمر) وقيل: تأتي تهيأ للقيام» [@tabrizi-ashr، ص291]."
  - term: "يَنْخَزِلُ"
    text: "قال التِّبْرِيزِيّ: «و (ينخزل) يتثنى، وقيل: ينقطع» [@tabrizi-ashr، ص291]. وفي اللسان: «وقول الشاعر: يكاد الخصر ينخزل معناه ينقطع لضمره» [@lisan، ج11 ص204]، والضُّمْر: الدقة والهزال."
syntax:
  - "«صِفْرُ الْوِشَاحِ» خبر لمبتدأ محذوف تقديره: هي، و«مِلْءُ الدِّرْعِ» و«بَهْكَنَةٌ» خبران بعده."
  - "«إِذَا» ظرف شرطي، وجملة «تَأَتَّى» في محل جر بالإضافة، وجوابه «يَكَادُ الْخَصْرُ يَنْخَزِلُ»: «الْخَصْرُ» اسم «يكاد»، وجملة «يَنْخَزِلُ» خبرها."
morphology:
  - "«تَأَتَّى» فعل مضارع للمؤنثة الغائبة، قال التِّبْرِيزِيّ: «والأصل تتأتى، فحذف إحدى التاءين» [@tabrizi-ashr، ص291]، استثقالًا لاجتماع تاءين في أول الكلمة."
  - "«يَنْخَزِلُ» مضارع «انْخَزَلَ» على «انفعل» الذي يدل على المطاوعة: خَزَلَه فانخزل، أي قطعه فانقطع."
  - "«صِفْر» يستوي فيه المذكر والمؤنث والواحد والجمع، و«مِلْء» اسم لما يملأ الشيء."
rhetoric:
  thesis: "بيت قائم على الجمع بين نقيضين في جسد واحد: خصر دقيق وجسم ممتلئ. وهو المثال الذي يعود إليه الشعراء في وصف المرأة."
  devices:
    - title: "المقابلة"
      text: "قابل بين «صِفْرُ الْوِشَاحِ» و«مِلْءُ الدِّرْعِ»: خلاءٌ وامتلاء. والمقابلة أن يُؤتى بمعنيين ثم بما يقابلهما. وكلاهما مضاف إلى ثوب أو حلي، فلم يصف الجسد مباشرة، بل وصف ما يحيط به."
    - title: "الكناية"
      text: "«صِفْرُ الْوِشَاحِ» كناية عن دقة الخصر، و«مِلْءُ الدِّرْعِ» كناية عن امتلاء الجسم، كما شرحهما التِّبْرِيزِيّ. وهي كناية بالمعنى الذي حدده عبد القاهر الجُرْجانيّ: أن يُترك اللفظ الموضوع للمعنى ويُجاء إلى ما هو «تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المبالغة"
      text: "في «يَكَادُ الْخَصْرُ يَنْخَزِلُ» بالغ في دقة الخصر حتى كاد ينقطع إذا تحركت، واحترز بـ«يَكَادُ» فلم يجعله ينقطع فعلًا."
  connection: "ثم يصرّح في البيت التاسع: «نِعْمَ الضجيعُ غداةَ الدَّجنِ يصرعُها»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "صِفْرُلْ وِشَا / حِ وَمِلْ / ءُدْدِرْعِ بَهْ / كَنَتُنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — إِذَا تَأَتْ / تَى يَكَا / دُلْخَصْرُ يَنْ / خَزِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية من الصدر فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "آخر الأبيات الأولى في جسدها قبل أن يصرّح في البيت التاسع «نِعْمَ الضَّجِيعُ». ويصفها محقق الديوان في تلخيصه: «يجفو وشاحها عن خصرها فلا يمسه لدقته، وتملأ أردافها القميص حتى يضيق بها» [@diwan-asha، ص92]."
