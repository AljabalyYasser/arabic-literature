first: "إِنَّا نُقَاتِلُهُمْ حَتَّى نُقَتِّلَهُمْ"
second: "عِنْدَ اللِّقَاءِ وَإِنْ جَارُوا وَإِنْ جَهِلُوا"
meaning: "إنا نقاتل أعداءنا حتى نُكثر فيهم القتل عند اللقاء، وإن جاروا علينا وتجاوزوا الحدّ في الحرب. فهذا جواب «كَيْفَ نَفْتَعِلُ» في البيت السابق. ويلخصه محقق الديوان بروايته: «كنا إذا قاتلناهم قتّلناهم تقتيلا، وكانوا هم الجانين على أنفسهم بما جاروا وبما سفهوا علينا واجترأوا» [@diwan-asha، ص98]."
vocabulary:
  - term: "نُقَتِّلَهُمْ"
    text: "نُكثر فيهم القتل."
  - term: "جَارُوا"
    text: "ظلموا وتجاوزوا الحق."
  - term: "جَهِلُوا"
    text: "سفهوا واشتدّوا، والجهل هنا ضد الحِلم لا ضد العلم."
syntax:
  - "«إِنَّا» بكسر الهمزة على الاستئناف. قال التِّبْرِيزِيّ: «ويروى (أنّا) بفتح الهمزة على البدل من قوله (فقد علموا أن سوف) والكسر أجود على الابتداء والقطع مما قبله» [@tabrizi-ashr، ص304]. وجملة «نُقَاتِلُهُمْ» خبر «إنّ»."
  - "«حَتَّى نُقَتِّلَهُمْ» «حتى» حرف غاية، و«نُقَتِّلَ» منصوب بـ«أن» مضمرة بعدها، أي إلى أن نقتّلهم. و«عِنْدَ اللِّقَاءِ» ظرف متعلق بـ«نُقَاتِلُهُمْ»."
  - "«وَإِنْ جَارُوا وَإِنْ جَهِلُوا» الواو حالية، و«إن» شرطية جوابها محذوف يدل عليه ما قبله، أي: وإن جاروا قاتلناهم. والمعنى: نقاتلهم على كل حال."
morphology:
  - "«نُقَاتِل» مضارع «قَاتَلَ» على «فَاعَلَ» الدال على المشاركة، و«نُقَتِّل» مضارع «قَتَّلَ» على «فَعَّلَ» الدال على التكثير."
  - "«جَارُوا» ماضٍ أجوف من «جار يجور»، أصله «جَوَرُوا» قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها."
rhetoric:
  thesis: "يجيب الشاعر عن سؤاله: هكذا نفعل في الحرب. ويختصر بأس قومه في فعلين من جذر واحد، يبدأ أحدهما بالمقاتلة وينتهي الآخر بالإبادة."
  devices:
    - title: "الجناس"
      text: "الجناس أن تتشابه الكلمتان في اللفظ وتختلفا في المعنى. وفي «نُقَاتِلُهُمْ ... نُقَتِّلَهُمْ» جناس اشتقاق: الكلمتان من جذر «قتل»، لكن الأولى على «فاعَل» للمشاركة، فالقتال بين فريقين، والثانية على «فعَّل» للكثرة، فالقتل يقع على فريق واحد. فبين أول الصدر وآخره تتحول المعركة من تكافؤ إلى غلبة."
    - title: "الإطلاق"
      text: "«وَإِنْ جَارُوا وَإِنْ جَهِلُوا» يجعل قتالهم حكمًا لا يتغير بحال العدو: ظالمًا كان أو سفيهًا. والتكرار في «وَإِنْ ... وَإِنْ» يؤكد هذا الإطلاق."
  connection: "ثم يختم الرسالة بأن لقومه من يدفع عنهم، فلا حاجة بيزيد إلى التدخل."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "إِنْنَا نُقَا / تِلُهُمْ / حَتْتَى نُقَتْ / تِلَهُمْ = مستفعلن / فعِلن / مستفعلن / فعِلن — عِنْدَلْلِقَا / ءِ وَإِنْ / جَارُو وَإِنْ / جَهِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 56 في الديوان، وعجزه فيه «وَهُمْ جَارُوا وَهُمْ جَهِلُوا» [@diwan-asha، ص97]، وبهذه الرواية أنشده شوقي ضَيْف مع البيتين قبله [@deif، ج1 ص352]."
variants:
  - reading: "عِنْدَ اللِّقَاءِ وَهُمْ جَارُوا وَهُمْ جَهِلُوا"
    status: "رواية ذكرها التِّبْرِيزِيّ، وهي رواية الديوان"
    note: "قال التِّبْرِيزِيّ: «ويروى (وهم جاروا وهم جهلوا)» [@tabrizi-ashr، ص304]. وكذلك في الديوان [@diwan-asha، ص97]. وعلى هذه الرواية يكون الجور والسفه منهم فعلًا، فالقتال جزاء لما بدأوا به."
  - reading: "أَنَّا نُقَاتِلُهُمْ حَتَّى نُقَتِّلَهُمْ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "بفتح الهمزة، على البدل من «أَنْ سَوْفَ» في البيت 51، والكسر عنده أجود [@tabrizi-ashr، ص304]."
  - reading: "إِنَّا نُقَاتِلُهُمْ ثُمَّتْ نُقَتِّلُهُمْ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "قال: «فمن روى (ثمت نقتِّلهم) أنَّث ثم لأنها كلمة، وجعل تأنيثها بمنزلة التأنيث الذي يلحق الأفعال» [@tabrizi-ashr، ص304]، أي ألحق بها تاء التأنيث الساكنة كما تلحق الفعل في «قامتْ». ويذكر رواية أخرى «ثمة نغلبهم»."
