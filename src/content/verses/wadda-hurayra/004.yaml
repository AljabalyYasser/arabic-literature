first: "تَسْمَعُ لِلْحَلْيِ وَسْوَاسًا إِذَا انْصَرَفَتْ"
second: "كَمَا اسْتَعَانَ بِرِيحٍ عِشْرِقٌ زَجِلُ"
meaning: "إذا انصرفت سمعتَ لحليها صوتًا خفيًّا، كصوت نبات العِشْرِق اليابس إذا مرّت به الريح فحرّكت حبّه. قال التِّبْرِيزِيّ: «وإنما المعنى كعشرق ضربته الريح» [@tabrizi-ashr، ص289]."
vocabulary:
  - term: "لِلْحَلْيِ"
    text: "ما تتزين به المرأة. قال التِّبْرِيزِيّ: «الحلي: واحد يؤدي عن جماعة» [@tabrizi-ashr، ص289]، أي لفظه مفرد ومعناه الجمع."
  - term: "وَسْوَاسًا"
    text: "«والوسواس: جرس الحلي» [@tabrizi-ashr، ص289]، والجرس: الصوت الخفي. وفي اللسان: «ويقال لهمس الصائد والكلاب وأصوات الحلي: وسواس» [@lisan، ج6 ص255]."
  - term: "انْصَرَفَتْ"
    text: "قال التِّبْرِيزِيّ: «يريد إذا انقلبت إلى فراشها» [@tabrizi-ashr، ص289]."
  - term: "عِشْرِقٌ"
    text: "نبت. قال الأَصْمَعِيّ: «العشرق: شُجيرة مقدار ذراع لها أكمام فيها حب صغار» [@tabrizi-ashr، ص290]، إذا جفّت ومرّت بها الريح تحرّك الحب. وقال أبو عُبَيْدة: «والعشرق: نبت يبس فتحركه الريح؛ شبه صوت حليها بصوته» [@aghani-dk، ج9 ص154]."
  - term: "زَجِلُ"
    text: "مصوِّت. قال أبو عُبَيْدة: «الزجل: المصوت من العشرق» [@aghani-dk، ج9 ص154]. وفي اللسان: «ونبت زجل: صوتت فيه الريح» [@lisan، ج11 ص302]."
syntax:
  - "«تَسْمَعُ» فعل مضارع، وفاعله ضمير المخاطب، وهو خطاب لكل سامع لا لشخص بعينه. و«وَسْوَاسًا» مفعول به، و«لِلْحَلْيِ» متعلق بمحذوف حال منه تقدّم عليه، أي وسواسًا كائنًا للحلي."
  - "«إِذَا انْصَرَفَتْ» ظرف لما يستقبل من الزمان متعلق بـ«تَسْمَعُ»، وجملة «انْصَرَفَتْ» في محل جر بإضافة «إذا» إليها."
  - "«كَمَا»: الكاف حرف تشبيه، و«ما» مصدرية، والتقدير: كاستعانة العشرق بالريح، وهو صفة لمصدر محذوف. و«عِشْرِقٌ» فاعل «اسْتَعَانَ»، و«زَجِلُ» صفته."
morphology:
  - "«وَسْوَاس» على «فَعْلال» من «وَسْوَسَ»، وهو من الرباعي المضاعف الذي يكرر مقطعه، فيحكي لفظُه الصوتَ المتكرر الخفي."
  - "«اسْتَعَانَ» على «استفعل» الذي يدل على الطلب: طلب العون. وأصله «استعْوَن»، نُقلت حركة الواو إلى العين ثم قُلبت ألفًا."
  - "«عِشْرِق» اسم رباعي مجرد على «فِعْلِل»، و«زَجِل» صفة على «فَعِل» من «زَجِلَ»."
rhetoric:
  thesis: "بعد أن رآها تمشي، يسمعها وهي تنصرف: لا يصف الحلي بلونه أو ثمنه، بل بصوته الخفي، فتبقى حاضرة بعد أن تغيب عن العين."
  devices:
    - title: "الاستعارة في الفعل"
      text: "في «اسْتَعَانَ بِرِيحٍ» جعل العشرق كأنه يطلب عون الريح ليصوّت، وإنما الريح تضربه فيصوّت. والتِّبْرِيزِيّ يسمي هذا «مجاز» [@tabrizi-ashr، ص289]. والاستعارة عند عبد القاهر الجُرْجانيّ تقع في الفعل كما تقع في الاسم: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]."
    - title: "التشبيه بالمسموع"
      text: "شبّه في «كَمَا اسْتَعَانَ بِرِيحٍ عِشْرِقٌ زَجِلُ» صوت الحلي بصوت حب العشرق اليابس، كما فهمه الأَصْمَعِيّ وأبو عُبَيْدة. ووجه الشبه صوت دقيق متقطع، لا رنين فيه."
    - title: "حكاية الصوت بالحروف"
      text: "في «وَسْوَاسًا» تتكرر السين، وتتكرر بعدها في «انْصَرَفَتْ» و«اسْتَعَانَ»، فيسمع القارئ همس الحلي في حروف البيت نفسه."
  connection: "ثم ينتقل من صورتها إلى خلقها مع جيرانها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "تَسْمَعُ لِلْ / حَلْيِ وَسْ / وَاسَنْ إِذَنْ / صَرَفَتْ = مفتعلن / فاعلن / مستفعلن / فعِلن — كَمَسْتَعَا / نَ بِرِي / حِنْ عِشْرِقُنْ / زَجِلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الطَّيُّ، وهو حذف الرابع الساكن، «مستفعلن» الأولى من الصدر فصارت «مستعلن»، وتُكتب أيضًا مفتعلن [@atiq، ص47]. ودخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من العجز فصارت «متفعلن»، و«فاعلن» الثانية منه فصارت «فعِلن» [@atiq، ص46]."
context: "من الأبيات التي غُنّيت من القصيدة، ويذكر صاحب «الأغاني» لحن ابن سُرَيْج فيه [@aghani-dk، ج9 ص153]. وفي نسخة الشاملة للتِّبْرِيزِيّ «عِشْرِقُ» بلا تنوين، ولا يستقيم بها الوزن، فهي خطأ في الطبع، والصواب «عِشْرِقٌ» كما في اللسان [@lisan، ج10 ص252]."
