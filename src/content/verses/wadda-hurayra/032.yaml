first: "مِنْ كُلِّ ذَلِكَ يَوْمٌ قَدْ لَهَوْتُ بِهِ"
second: "وَفِي التَّجَارِبِ طُولُ اللَّهْوِ وَالْغَزَلُ"
meaning: "ما من شيء مما ذكرتُ إلا كان لي معه يوم لهوت فيه، وقد عرفتُ في تجاربي اللهو الطويل والغزل. قال التِّبْرِيزِيّ: «يقول: لهوت في تجاربي وغازلت» [@tabrizi-ashr، ص299]."
vocabulary:
  - term: "لَهَوْتُ"
    text: "تلهّيتُ وتمتّعتُ."
  - term: "التَّجَارِبِ"
    text: "جمع تجربة، وهي ما خبره الإنسان بنفسه."
  - term: "الْغَزَلُ"
    text: "حديث النساء ومغازلتهن."
syntax:
  - "«مِنْ كُلِّ ذَلِكَ» خبر مقدم، و«يَوْمٌ» مبتدأ مؤخر، وجملة «قَدْ لَهَوْتُ بِهِ» صفة لـ«يَوْمٌ». ويُروى «يَوْمًا» بالنصب على الظرف كما قال التِّبْرِيزِيّ، فيتعلق «مِنْ كُلِّ ذَلِكَ» بـ«لَهَوْتُ»."
  - "«وَفِي التَّجَارِبِ» خبر مقدم، و«طُولُ» مبتدأ مؤخر، و«اللَّهْوِ» مضاف إليه، و«الْغَزَلُ» معطوف على «طُولُ»."
morphology:
  - "«تَجَارِب» جمع «تَجْرِبة» على «تَفاعِل»، و«لَهَوْتُ» من «لَهَا يَلْهُو» الناقص الواوي."
  - "«ذَلِكَ» اسم إشارة للبعيد، والكاف فيه للخطاب مفتوحة هنا لأنه لا يخاطب هُرَيْرَة في هذا البيت، بخلاف «كَذَلِكِ» في البيت 22."
rhetoric:
  thesis: "خاتمة الرد على هُرَيْرَة: يجمع كل ما ذكر في «كُلِّ ذَلِكَ»، ثم يخرج منه بحكمة. ويقول شوقي ضَيْف: «ويختم أبياته بأنه تمتّع بكل ذلك» [@deif، ج1 ص356]."
  devices:
    - title: "الإجمال بعد التفصيل"
      text: "فصّل في الأبيات 23–31 المغامرة والحانوت والفتية والخمر والساقي والعود والقيان، ثم جمعها كلها في «مِنْ كُلِّ ذَلِكَ». فاسم الإشارة يضم المجلس كله في كلمة."
    - title: "التذييل"
      text: "العجز «وَفِي التَّجَارِبِ طُولُ اللَّهْوِ وَالْغَزَلُ» جملة عامة تأتي بعد الكلام فتؤكد معناه، وهذا ما يسمى التذييل. فيصير ما رواه من أيامه تجربةً يعتدّ بها، لا مجرد ذكريات."
    - title: "الرد على هُرَيْرَة"
      text: "بدأ الرد في البيت 22 بقوله «إِمَّا تَرَيْنَا حُفَاةً»، وانتهى هنا: من رأته اليوم أعشى حافيًا عرف من اللهو والغزل ما لا تعرفه."
  connection: "وبه ينتهي النصف الأول من القصيدة. ثم ينتقل فجأة إلى بلدة موحشة كظهر الترس، يقطعها على ناقته."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "مِنْ كُلْلِ ذَا / لِكَ يَوْ / مُنْ قَدْ لَهَوْ / تُ بِهِي = مستفعلن / فعِلن / مستفعلن / فعِلن — وَفِتْتَجَا / رِبِ طُو / لُلْلَهْوِ وَلْ / غَزَلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "آخر أبيات الخمر التي يستشهد بها شوقي ضَيْف على وصف الأَعْشَى لمجالس الشراب [@deif، ج1 ص356]. وهو في الديوان البيت 43، قبل «وَالسَّاحِبَاتُ» [@diwan-asha، ص95]."
