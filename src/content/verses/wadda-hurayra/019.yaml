first: "صَدَّتْ هُرَيْرَةُ عَنَّا مَا تُكَلِّمُنَا"
second: "جَهْلًا بِأُمِّ خُلَيْدٍ حَبْلَ مَنْ تَصِلُ"
meaning: "أعرضت عنا هُرَيْرَة لا تكلمنا، وما أجهلها! فإن لم تصلنا نحن فحبلَ من تصل؟ قال التِّبْرِيزِيّ: «(حبل من تصل) استفهام، وفيه من التعجب، أي حبل من تصل إذا لم تصلنا ونحن نودُّها» [@tabrizi-ashr، ص295]."
vocabulary:
  - term: "صَدَّتْ"
    text: "أعرضت."
  - term: "أُمِّ خُلَيْدٍ"
    text: "كنية هُرَيْرَة. قال التِّبْرِيزِيّ: «روى أبو عبيدة (صدَّت خليدة عنَّا) قال: هي هريرة، وهي أم خُليد» [@tabrizi-ashr، ص294]. وفي خبر أبي عُبَيْدة أنها ولدت خُلَيْدًا لقيس بن حسان [@tabrizi-ashr، ص288]."
  - term: "حَبْلَ"
    text: "الحبل هنا الوصل والمودة."
syntax:
  - "«صَدَّتْ هُرَيْرَةُ» فعل وفاعل، و«عَنَّا» متعلق بـ«صَدَّتْ»، وجملة «مَا تُكَلِّمُنَا» في موضع الحال، و«ما» نافية."
  - "«جَهْلًا» مصدر منصوب. وأقرب ما يُحمل عليه أنه مفعول لأجله: صدّت جهلًا، والباء في «بِأُمِّ خُلَيْدٍ» بمعنى «في»: جهلًا كائنًا في أم خليد. فهو يكرر ذكرها بكنيتها ليعجب من جهلها."
  - "«حَبْلَ مَنْ تَصِلُ»: «حَبْلَ» مفعول به مقدم لـ«تَصِلُ»، و«مَنْ» اسم استفهام مضاف إليه. وتقدّم المفعول لأن اسم الاستفهام له الصدارة، فتقدّم معه ما أضيف إليه."
morphology:
  - "«خُلَيْد» تصغير «خالد» على «فُعَيْل»، و«أُمّ خُلَيْد» كنية."
  - "«صَدَّتْ» ماضٍ من «صَدَّ يَصُدُّ» المضعف، و«تُكَلِّم» مضارع «كَلَّمَ» على «فعّل»."
  - "«تَصِلُ» مضارع «وَصَلَ» حُذفت واوه، لأن المثال الواوي المكسور العين في المضارع تُحذف فاؤه فيه."
rhetoric:
  thesis: "يعود من السلسلة إلى هُرَيْرَة، فإذا هي التي بدأت الصدّ. ويتحول الوداع الذي في المطلع إلى عتاب."
  devices:
    - title: "الاستفهام التعجبي"
      text: "في «حَبْلَ مَنْ تَصِلُ» لا يسأل عن أحد، بل يتعجب: لا أحد أحق بوصلها منه. وهذا ما قاله التِّبْرِيزِيّ: «استفهام، وفيه من التعجب» [@tabrizi-ashr، ص295]."
    - title: "تنويع التسمية"
      text: "ذكرها باسمها «هُرَيْرَةُ» في الصدر، ثم بكنيتها «أُمِّ خُلَيْدٍ» في العجز. والكنية تذكّر بأنها أم، ففي الانتقال من الاسم إلى الكنية بُعد واحترام، كأنه يعاتبها من مسافة."
    - title: "استعارة الحبل للمودة"
      text: "في «حَبْلَ» جعل المودة حبلًا يوصل ويقطع. والاستعارة عند عبد القاهر الجُرْجانيّ أن تترك التصريح بالتشبيه و«تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
  connection: "ثم يذكر سبب صدّها: رأته أعشى أضرّ به الدهر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "صَدْدَتْ هُرَيْ / رَةُ عَنْ / نَا مَا تُكَلْ / لِمُنَا = مستفعلن / فعِلن / مستفعلن / فعِلن — جَهْلَنْ بِأُمْ / مِ خُلَيْ / دِنْ حَبْلَ مَنْ / تَصِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يبدأ به مقطع «صدودها» (19–21). وهو في الديوان البيت التاسع، يلي صفة جسدها مباشرة [@diwan-asha، ص91]. وقد استشهد التِّبْرِيزِيّ بعجزه في أول القصيدة حين نقل خبر هُرَيْرَة عن أبي عُبَيْدة [@tabrizi-ashr، ص288]."
variants:
  - reading: "صَدَّتْ خُلَيْدَةُ عَنَّا مَا تُكَلِّمُنَا"
    status: "رواية أبي عُبَيْدة"
    note: "[@tabrizi-ashr، ص294]. وخُلَيْدة عنده هي هُرَيْرَة. وفي «الأغاني» خبر آخر يجعل هُرَيْرَة وخُلَيْدة أختين، نذكره في التعريف بالقصيدة."
