first: "قَالُوا نِمَارٌ فَبَطْنُ الْخَالِ جَادَهُمَا"
second: "فَالْعَسْجَدِيَّةُ فَالْأَبْلَاءُ فَالرِّجَلُ"
meaning: "فأجاب الشاربون: مطره على نِمار ثم بطن الخال، قد جادهما، ثم يمضي إلى العَسْجَدِيّة، فالأَبْلاء، فالرِّجَل. قال التِّبْرِيزِيّ: «وهذه كلها مواضع، والرِّجل: مسايل الماء، واحدها رجلة» [@tabrizi-ashr، ص300]."
vocabulary:
  - term: "نِمَارٌ"
    text: "موضع. ويقول محقق الديوان: «نمار جبل لبني سليم» [@diwan-asha، ص93]."
  - term: "بَطْنُ الْخَالِ"
    text: "موضع. ويقول محقق الديوان: «بطن الخال موضع وجبل» [@diwan-asha، ص93]."
  - term: "جَادَهُمَا"
    text: "أصابهما بالجَوْد، وهو المطر الغزير. ويقول محقق الديوان: «جادهما مطر عليهما العارض» [@diwan-asha، ص93]."
  - term: "الْعَسْجَدِيَّةُ"
    text: "موضع، ولم يزد التِّبْرِيزِيّ على قوله في أسماء البيت: «وهذه كلها مواضع» [@tabrizi-ashr، ص300]."
  - term: "الْأَبْلَاءُ"
    text: "موضع، ويروى «الأبواء» [@tabrizi-ashr، ص300]."
  - term: "الرِّجَلُ"
    text: "«مسايل الماء، واحدها رجلة» [@tabrizi-ashr، ص300]. ويجعله محقق الديوان اسم موضع: «الرجل موضع باليمامة» [@diwan-asha، ص93]."
syntax:
  - "«نِمَارٌ» خبر لمبتدأ محذوف تقديره: مَصابُه نِمارٌ، أي موضع مطره. و«فَبَطْنُ الْخَالِ» معطوف عليه بالفاء. وجملة «جَادَهُمَا» استئنافية تبيّن أن المطر قد أصابهما، وفاعلها ضمير يعود على العارض."
  - "«فَالْعَسْجَدِيَّةُ فَالْأَبْلَاءُ فَالرِّجَلُ» معطوفات على «نِمَارٌ» بالفاء."
  - "جملة «نِمَارٌ ... فَالرِّجَلُ» كلها مقول القول في محل نصب."
morphology:
  - "«جَادَ» ماضٍ أجوف من «جاد يجود»، أصله «جَوَدَ» قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها، والضمير «هُمَا» مفعول به."
  - "«الْعَسْجَدِيَّة» اسم موضع منسوب بالياء المشددة إلى «عَسْجَد»، و«الرِّجَل» جمع «رِجْلة» على «فِعَل»، كـ«سِدْرة وسِدَر»."
rhetoric:
  thesis: "جواب الشاربين لا يحدد موضعًا واحدًا، بل يرسم مسار المطر من مكان إلى مكان، فيتحول البيت إلى خريطة."
  devices:
    - title: "العطف بالفاء"
      text: "تتابعت الفاء خمس مرات: «فَبَطْنُ ... فَالْعَسْجَدِيَّةُ فَالْأَبْلَاءُ فَالرِّجَلُ». والفاء تدل على الترتيب والتعقيب، فكأن السامع يرى السحاب يتنقل من موضع إلى الذي يليه بلا مهلة. وهي قراءتنا."
    - title: "أسماء المواضع"
      text: "يقول شوقي ضَيْف إن الأَعْشَى في وصف الصحراء «يجرى على عادة الجاهليين، فيصور الأودية وما يجرى فيها من ظلام أو سموم أو مياه أمطار» [@deif، ج1 ص353]. وهنا تصير أسماء المواضع طريقًا يمضي فيه السحاب نحو ديار هُرَيْرَة، كما سيصرّح في البيت 43."
    - title: "سكارى يقدّرون"
      text: "بعد أن سخر في البيت السابق من قدرة الشارب الثمل على الشَّيْم، جاء جوابهم مفصّلًا دقيقًا، فكأن السكارى أعلم بالمطر مما ظن. وهي قراءتنا."
  connection: "ويستمر عدّ المواضع في البيت التالي حتى يفيض الماء."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "قَالُو نِمَا / رُنْ فَبَطْ / نُلْخَالِ جَا / دَهُمَا = مستفعلن / فاعلن / مستفعلن / فعِلن — فَلْعَسْجَدِيْ / يَةُ فَلْ / أَبْلَاءُ فَرْ / رِجَلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 27 في الديوان [@diwan-asha، ص93]. ويصف محقق الديوان الشاربين بأنهم «لا يزالون فى حدس وتخمين، كل يذكر الأرض التى يتوقع أن هذا العارض سيصيبها بمائه» [@diwan-asha، ص96]."
