first: "لَا تَنْتَهُونَ وَلَنْ يَنْهَى ذَوِي شَطَطٍ"
second: "كَالطَّعْنِ يَهْلِكُ فِيهِ الزَّيْتُ وَالْفُتُلُ"
meaning: "لا تكفّون عن عدوانكم، ولن يردع أهل الجور شيءٌ مثلُ طعنةٍ واسعة غائرة يغيب فيها الزيت والفتائل التي يُداوى بها الجرح. قال التِّبْرِيزِيّ: «المعنى لا ينهى أصحاب الجور مثل طعن جائف يغيب فيه الزيت والفتل» [@tabrizi-ashr، ص305]، والجائف: الذي يبلغ الجوف."
vocabulary:
  - term: "شَطَطٍ"
    text: "جور وتجاوز للحد. «الشطط: الجور، والفعل منه أشط» [@tabrizi-ashr، ص305]."
  - term: "يَهْلِكُ فِيهِ"
    text: "يضيع ويغيب. «ويهلك فيه الزيت: أي يذهب فيه لسعته» [@tabrizi-ashr، ص305]."
  - term: "الْفُتُلُ"
    text: "جمع فتيلة، وهي ما يُفتل من خِرَق أو قطن ويُدسّ في الجرح مع الزيت ليُداوى."
syntax:
  - "«لَا تَنْتَهُونَ» جملة خبرية منفية، والخطاب لبني شيبان، وفيها معنى اللوم: أنتم لا تكفّون."
  - "«وَلَنْ يَنْهَى» مضارع منصوب بـ«لن»، و«ذَوِي» مفعول به منصوب بالياء لأنه من الملحق بجمع المذكر السالم، و«شَطَطٍ» مضاف إليه."
  - "«كَالطَّعْنِ» الكاف هنا اسم بمعنى «مثل»، وهي فاعل «يَنْهَى»، و«الطَّعْنِ» مضاف إليه. نقل البَغْداديّ عن ابن السَّرّاج: «فالكاف هي الفاعلة» [@khizana، ج9 ص454]، وقال في موضع آخر إنها «اسم بمعنى مثل» [@khizana، ج10 ص170]. وجملة «يَهْلِكُ فِيهِ الزَّيْتُ» صفة لـ«الطَّعْنِ»، لأن «ال» فيه للجنس."
morphology:
  - "«تَنْتَهُونَ» مضارع «انْتَهَى» على «افْتَعَلَ»، أصله «تَنْتَهِيُونَ» حُذفت الياء ونُقلت ضمتها إلى ما قبلها."
  - "«الْفُتُل» جمع «فَتِيلة» على «فُعُل»، كـ«صُحُف» جمع «صحيفة». و«شَطَط» مصدر على «فَعَل»."
rhetoric:
  thesis: "انتقل الخطاب من يَزِيد وحده إلى بني شيبان جميعًا: «لَا تَنْتَهُونَ». والحكمة في العجز تقرّر أن الجائر لا يردعه الكلام، بل الطعنة الغائرة."
  devices:
    - title: "الكناية"
      text: "«كَالطَّعْنِ يَهْلِكُ فِيهِ الزَّيْتُ وَالْفُتُلُ» كناية عن الطعنة الواسعة العميقة: لم يقل «طعنة نافذة»، بل ذكر ما يلزم عنها، وهو أن الجرح يبتلع ما يوضع فيه من دواء. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "الجناس"
      text: "الجناس أن تتشابه الكلمتان في اللفظ وتختلفا في المعنى، ومنه أن تكونا من جذر واحد بصيغتين. و«تَنْتَهُونَ» و«يَنْهَى» من جذر واحد: الانتهاء فعلهم، والنهي فعل غيرهم. فإذا لم ينتهوا من أنفسهم نهاهم الطعن."
    - title: "الحكمة"
      text: "«وَلَنْ يَنْهَى ذَوِي شَطَطٍ كَالطَّعْنِ» حكم عام يصلح مثلًا، جاء بعد خطاب خاص، فصار الوعيد قاعدة لا تهديدًا عابرًا."
  connection: "ثم يصوّر أثر هذا الطعن: سيد القوم صريعًا والنساء يدفعن عنه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَا تَنْتَهُو / نَ وَلَنْ / يَنْهَى ذَوِي / شَطَطِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — كَطْطَعْنِ يَهْ / لِكُ فِي / هِزْزَيْتُ وَلْ / فُتُلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 61 في الديوان، وأوله فيه «هَلْ تَنْتَهُونَ» [@diwan-asha، ص99]. ويقول محققه: «يذهب فيه الزيت والفتل لأن الطعنة غائرة» [@diwan-asha، ص99]. وهو شاهد عند النحويين على أن الكاف تأتي اسمًا [@khizana، ج9 ص453–454]، وفي اللسان: «فَلَوْ حَمَلْتَهُ عَلَى إِقَامَةِ الصِّفَةِ مَوْضِعَ الْمَوْصُوفِ لَكَانَ أَقبح» [@lisan، ج14 ص272]، أي إن تقدير «شيء كالطعن» ضعيف، والكاف نفسها هي الفاعل."
variants:
  - reading: "أَتَنْتَهُونَ وَلَنْ يَنْهَى ذَوِي شَطَطٍ"
    status: "رواية ذكرها التِّبْرِيزِيّ، وبها أنشده اللسان والخزانة"
    note: "قال التِّبْرِيزِيّ: «ويروى (أتنتهون) و (هل تنتهون)» [@tabrizi-ashr، ص305]. وكذلك في اللسان [@lisan، ج14 ص272] والخزانة [@khizana، ج10 ص170]. وعليها يكون الكلام استفهامًا فيه إنكار."
  - reading: "هَلْ تَنْتَهُونَ وَلَا يَنْهَى ذَوِي شَطَطٍ / كَالطَّعْنِ يَذْهَبُ فِيهِ الزَّيْتُ وَالْفُتُلُ"
    status: "رواية الديوان"
    note: "[@diwan-asha، ص99]. و«يَذْهَبُ فِيهِ» رواية اللسان أيضًا [@lisan، ج14 ص272]."
