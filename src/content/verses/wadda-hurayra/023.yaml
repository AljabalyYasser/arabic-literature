first: "وَقَدْ أُخَالِسُ رَبَّ الْبَيْتِ غَفْلَتَهُ"
second: "وَقَدْ يُحَاذِرُ مِنِّي ثُمَّ مَا يَئِلُ"
meaning: "وكثيرًا ما اغتنمتُ غفلة صاحب البيت عن أهله، وهو يحترس مني، ثم لا ينجو من كيدي. قال التِّبْرِيزِيّ: «ويئل: ينجو» [@tabrizi-ashr، ص296]. والأهل هنا الزوجة، فالمعنى بلغة اليوم: كنت أخلو بزوجات الرجال فأجامعهن وأزواجهن غافلون، يحترسون مني ثم لا يمنعونني. وعلى هذا المعنى جعله ابن سَلّام من شواهده على أن الأَعْشَى ممن «يتعهر»، أي يحدّث بفجوره [@ibn-sallam، ج1 ص41، ص43]."
vocabulary:
  - term: "أُخَالِسُ"
    text: "أختلس وأسرق في خفية. ويفسره محقق الديوان: «خلس الشيء سرقه وأخذه خفية» [@diwan-asha، ص95]."
  - term: "رَبَّ الْبَيْتِ"
    text: "صاحبه، ويريد الزوج."
  - term: "يُحَاذِرُ"
    text: "يحترس ويتّقي."
  - term: "يَئِلُ"
    text: "ينجو [@tabrizi-ashr، ص296]، وماضيه «وَأَلَ»."
syntax:
  - "«قَدْ» مع المضارع هنا للتكثير: كثيرًا ما أخالس. و«رَبَّ الْبَيْتِ» مفعول به."
  - "قال التِّبْرِيزِيّ: «وقوله (غفلته) بدل من قوله: ربَّ البيت بدل الاشتمال» [@tabrizi-ashr، ص296]. وبدل الاشتمال أن يُبدل من الشيء ما يتصل به ويشتمل عليه، كقولك: أعجبني زيدٌ علمُه. فالمختلَس في الحقيقة غفلة الرجل لا الرجل."
  - "«وَقَدْ يُحَاذِرُ مِنِّي» معطوفة على ما قبلها، و«ثُمَّ مَا يَئِلُ» معطوفة عليها، و«ما» نافية."
morphology:
  - "«أُخَالِس» مضارع «خالَسَ» على «فاعَل» الذي يدل على المشاركة: هو يرقب غفلة الزوج، والزوج يرقبه."
  - "«يَئِلُ» مضارع «وَأَلَ»، وهو مثال واوي حُذفت فاؤه في المضارع، كما حُذفت في أفعال يذكرها اللسان: «نحو يعد ويزن ويهب ويضع ويئل» [@lisan، ج3 ص462]."
  - "«يُحَاذِر» مضارع «حاذَرَ» على «فاعَل»، و«غَفْلَة» على «فَعْلة» للمرة من «غَفَلَ»."
rhetoric:
  thesis: "أول ما يذكره من أيام قوته: مغامراته مع المتزوجات. ويذكرها تلميحًا لا تصريحًا. وقد عدّه ابن سَلّام، فيما ينقله شوقي ضَيْف، من الشعراء الذين قال فيهم: «ومنهم من كان يتعهّر ولا يبقى على نفسه ولا يتستر، منهم امرؤ القيس ومنهم الأعشى» [@deif، ج1 ص338]، ويتعهّر: يتحدث عن فجوره."
  devices:
    - title: "الكناية"
      text: "«أُخَالِسُ رَبَّ الْبَيْتِ غَفْلَتَهُ» كناية عن الوصول إلى زوجته، فلم يذكر المرأة أصلًا، بل ذكر الزوج وغفلته. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. وبهذا التلميح يختلف البيت عن البيت التاسع الصريح."
    - title: "الحذر الذي لا ينفع"
      text: "في «وَقَدْ يُحَاذِرُ مِنِّي ثُمَّ مَا يَئِلُ» جعل الزوج يقظًا محترسًا، ثم جعل احتراسه بلا جدوى. و«ثُمَّ» تفصل بين الحذر والفشل، فكأن الزوج يطيل الحذر ثم يُغلب."
  connection: "ثم يذكر أنه كان يقود الصبا فيتبعه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَقَدْ أُخَا / لِسُ رَبْ / بَلْبَيْتِ غَفْ / لَتَهُو = متفعلن / فعِلن / مستفعلن / فعِلن — وَقَدْ يُحَا / ذِرُ مِنْ / نِي ثُمْمَ مَا / يَئِلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية فيهما فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يصف شوقي ضَيْف هذا الجانب من غزل الأَعْشَى بأنه «يتحدث عن مغامراته ووصوله إلى محبوباته من المتزوجات»، ويقول في أبيات له من قصيدة أخرى: «فهو يخالس الزوج ويخاتله، حتى يظفر ببغيته» [@deif، ج1 ص361]. وفي نسخة الشاملة للتِّبْرِيزِيّ «وَقَدٍْ» بحركتين، وهو خطأ في الطبع."
variants:
  - reading: "وَقَدْ أُرَاقِبُ رَبَّ الْبَيْتِ غَفْلَتَهُ"
    status: "رواية أخرى"
    note: "قال التِّبْرِيزِيّ: «ويروى (وقد أراقب)» [@tabrizi-ashr، ص296]."
  - reading: "فَقَدْ أُخَالِسُ رَبَّ الْبَيْتِ غَفْلَتَهُ"
    status: "رواية الديوان"
    note: "[@diwan-asha، ص95]. وبالفاء يصير البيت جوابًا مباشرًا عن «إِمَّا تَرَيْنَا» في البيت 22."
