first: "وَمُسْتَجِيبٍ تَخَالُ الصَّنْجَ يُسْمِعُهُ"
second: "إِذَا تُرَجِّعُ فِيهِ الْقَيْنَةُ الْفُضُلُ"
meaning: "وعود يجاوب الصنج، تحسب الصنج يناديه فيجيبه، إذا ردّدت فيه القينة صوتها وهي في ثوب البيت. قال التِّبْرِيزِيّ: «المُستجيب: العُود، أي إنه يُجيب الصنج، وقال أبو عمرو: يعني بالمستجيب العُود، شبه صوته بصوت الصنج فكأن الصنج دعاه فأجابه» [@tabrizi-ashr، ص298]."
vocabulary:
  - term: "مُسْتَجِيبٍ"
    text: "العود، سمّاه بفعله: يجيب الصنج [@tabrizi-ashr، ص298]."
  - term: "الصَّنْجَ"
    text: "آلة طرب. وفي اللسان: «فأما الصنج ذو الأوتار فدخيل معرب، تختص به العجم وقد تكلمت به العرب» [@lisan، ج2 ص311]. ويقول محقق الديوان إنه «دوائر صغار من النحاس يصفق بأحدها على الأخرى» [@diwan-asha، ص95]."
  - term: "تُرَجِّعُ"
    text: "تردّد صوتها في الغناء."
  - term: "الْقَيْنَةُ"
    text: "«والقينة عند العرب: الأمة مغنية كانت أو غير مغنية» [@tabrizi-ashr، ص298]."
  - term: "الْفُضُلُ"
    text: "«والفُضُل: التي في ثياب فضلتها أي مباذلها» [@tabrizi-ashr، ص298]، أي في ثياب البيت الخفيفة. وفي اللسان: «وكذلك الأنثى فضل» [@lisan، ج11 ص526]."
syntax:
  - "«وَمُسْتَجِيبٍ» مجرور. ويحتمل أن تكون الواو واو «رُبّ»، أي: وربّ مستجيبٍ، أو أن يكون معطوفًا على «فِتْيَةٍ» في البيت 26: غدوتُ في فتية وفي مستجيب. وهو صفة لموصوف محذوف تقديره: عُودٍ."
  - "«تَخَالُ» من أفعال الظن تنصب مفعولين: «الصَّنْجَ» مفعولها الأول، وجملة «يُسْمِعُهُ» في موضع المفعول الثاني. والجملة كلها صفة لـ«مُسْتَجِيبٍ»."
  - "«إِذَا» ظرف، وجملة «تُرَجِّعُ» في محل جر بالإضافة، و«الْقَيْنَةُ» فاعل، و«الْفُضُلُ» صفتها، و«فِيهِ» متعلق بـ«تُرَجِّعُ»."
morphology:
  - "«مُسْتَجِيب» اسم فاعل من «اسْتَجَابَ» على «استفعل»، وأصل عينه واو من «الجواب»."
  - "«تُرَجِّع» مضارع «رَجَّعَ» على «فعّل» للتكثير: ترديد بعد ترديد."
  - "«فُضُل» صفة على «فُعُل» يستوي فيها المذكر والمؤنث كما في اللسان، و«صَنْج» اسم معرب."
rhetoric:
  thesis: "البيت الذي يُفسَّر به لقب الأَعْشَى. قال ابن قُتَيْبة: «ويسمّى صنّاجة العرب لأنه أوّل من ذكر الصّنج في شعره»، ثم أنشد هذا البيت [@ibn-qutayba، ج1 ص250–251]. ويرى محقق كتابه أنه سُمّي «صناجة العرب» لجودة شعره، ويقول: «وهذا أقرب مما قال ابن قتيبة» [@ibn-qutayba، ج1 ص251]."
  devices:
    - title: "التشخيص بالاسم"
      text: "سمّى العود «مُسْتَجِيبٍ» فجعله كائنًا يجيب من يدعوه، وجعل الصنج يناديه. فالآلتان تتحاوران في المجلس. ويرى شوقي ضَيْف في قوله «تَخَالُ الصَّنْجَ يُسْمِعُهُ» كناية: «وجعل الصنج يسمعه كناية بذلك عن اتساق ألحانهما» [@deif، ج1 ص356]."
    - title: "ذكر الصفة دون الموصوف"
      text: "لم يذكر العود، بل صفته «مُسْتَجِيبٍ»، فاحتاج الشرّاح إلى التفسير. وفي حذف الاسم والاكتفاء بالصفة دعوة للسامع أن يتخيل الآلة من فعلها."
  connection: "ثم يختم صورة المجلس بالقيان الساحبات ذيولهن."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَمُسْتَجِي / بِنْ تَخَا / لُصْصَنْجَ يُسْ / مِعُهُو = متفعلن / فاعلن / مستفعلن / فعِلن — إِذَا تُرَجْ / جِعُ فِي / هِلْقَيْنَةُلْ / فُضُلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يجمع البيت آلتين: العود العربي والصنج الذي يقول اللسان إنه مما تختص به العجم، فيدل على مجالس تأثرت بالحيرة وفارس. ويقول ابن قُتَيْبة بعده: «وكان الأعشى يفد على ملوك فارس، ولذلك كثرت الفارسيّة في شعره» [@ibn-qutayba، ج1 ص251]."
variants:
  - reading: "وَمُسْتَجِيبٍ لِصَوْتِ الصَّنْجِ تَسْمَعُهُ"
    status: "رواية ابن قُتَيْبة"
    note: "وقال بعده: «شبّه العود بالصّنج» [@ibn-qutayba، ج1 ص251]."
  - reading: "وَمُسْتَجِيبًا تَخَالُ الصَّنْجَ يَسْمَعُهُ"
    status: "رواية اللسان"
    note: "بالنصب، و«يَسْمَعُهُ» بفتح الياء [@lisan، ج2 ص311]. وفي موضع آخر من اللسان: «إِذَا تُرَدِّدُ فِيهِ الْقَيْنَةُ الْفُضُلُ» [@lisan، ج11 ص526]."
