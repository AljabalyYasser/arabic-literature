first: "عُلِّقْتُهَا عَرَضًا وَعُلِّقَتْ رَجُلًا"
second: "غَيْرِي وَعُلِّقَ أُخْرَى غَيْرَهَا الرَّجُلُ"
meaning: "أحببتُها مصادفةً من غير أن أقصد، وأحبّت هي رجلًا غيري، وأحبّ ذلك الرجلُ امرأة أخرى غيرها. وفي اللسان: «وقولهم: علقتها عرضا إذا هوي امرأة أي اعترضت فرآها بغتة من غير أن قصد لرؤيتها فعلقها من غير قصد» [@lisan، ج7 ص185]."
vocabulary:
  - term: "عُلِّقْتُهَا"
    text: "أحببتها. قال أبو عُبَيْدة: «وعلقتها: أحببتها» [@aghani-dk، ج9 ص154]."
  - term: "عَرَضًا"
    text: "من غير قصد. قال أبو عُبَيْدة: «وعرضا: على غير موعد» [@aghani-dk، ج9 ص154]. وقال التِّبْرِيزِيّ: «يقال: عرض له أمر، إذا أتاه على غير تعمُّد» [@tabrizi-ashr، ص293]."
syntax:
  - "«عُلِّقْتُهَا» فعل ماض مبني للمجهول، والتاء نائب الفاعل، والضمير «ها» مفعول به ثانٍ: كأن الهوى علّقه بها."
  - "قال التِّبْرِيزِيّ: «وعرضا: منصوب على البيان، كقولك: مات هزلا، وقتلته عمدا» [@tabrizi-ashr، ص293]، أي إنه مصدر يبين كيف وقع الحب."
  - "«وَعُلِّقَتْ رَجُلًا»: نائب الفاعل ضمير هُرَيْرَة، و«رَجُلًا» مفعول به، و«غَيْرِي» صفته."
  - "«وَعُلِّقَ أُخْرَى غَيْرَهَا الرَّجُلُ»: «أُخْرَى» مفعول به مقدم، و«غَيْرَهَا» صفته، و«الرَّجُلُ» نائب فاعل مؤخر. و«ال» فيه للعهد: هو الرجل نفسه الذي ذكره نكرة قبلُ."
morphology:
  - "«عُلِّقَ» ماضٍ مبني للمجهول من «عَلَّقَ» على «فعّل». وبناؤه للمجهول ثلاث مرات يجعل الحب شيئًا وقع على أصحابه، لا فعلًا اختاروه."
  - "«عَرَض» مصدر «عَرَضَ يَعْرِضُ» إذا ظهر فجأة. و«أُخْرَى» مؤنث «آخَر» على «فُعْلَى»."
rhetoric:
  thesis: "بيت يلخص مأساة كاملة: كل محب يحب من لا يحبه. ويقول شوقي ضَيْف: «ولا يلبث أن يورد علينا هذا البيت الغريب»، ثم يقول: «وهو يصور فيه شقاءه بحبها، فهو يحبها، وهى تعرض عنه، وتحب رجلا آخر، والرجل يعرض عنها ويحب فتاة أو امرأة ثانية» [@deif، ج1 ص362]."
  devices:
    - title: "البناء للمجهول"
      text: "في «عُلِّقْتُهَا ... وَعُلِّقَتْ ... وَعُلِّقَ» لم يقل «أحببت» و«أحبّت»، بل جعل الحب يقع على كل واحد منهم من خارجه. فلا أحد في السلسلة اختار من يحب."
    - title: "التكرار الدائري"
      text: "تكررت «عُلِّقَ» ثلاث مرات و«غَيْر» مرتين، وانتقل الضمير من المتكلم إليها إلى الرجل. فالبيت يدور كما تدور السلسلة التي يصفها: كل حلقة تسلّم إلى غيرها."
    - title: "التنكير ثم التعريف"
      text: "ذكره أولًا نكرة «رَجُلًا»، ثم معرفة «الرَّجُلُ» في القافية: هو رجل لا يعنيه اسمه، يكفي أنه ليس هو."
  connection: "ثم يمد السلسلة: فتاة تحب ذلك الرجل، وابن عم يهلك بحبها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "عُلْلِقْتُهَا / عَرَضَنْ / وَعُلْلِقَتْ / رَجُلَنْ = مستفعلن / فعِلن / متفعلن / فعِلن — غَيْرِي وَعُلْ / لِقَ أُخْ / رَى غَيْرَهَرْ / رَجُلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الثالثة من الصدر فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "أول أبيات «سلسلة الحب» (15–18). ومما غُنّي من القصيدة، ويذكر صاحب «الأغاني» للغَرِيض لحنًا فيه [@aghani-dk، ج9 ص153]. واستشهد به اللسان، ونقل عن ابن السِّكِّيت أن معناه: «كانت عرضا من الأعراض اعترضني من غير أن أطلبه» [@lisan، ج7 ص185]."
