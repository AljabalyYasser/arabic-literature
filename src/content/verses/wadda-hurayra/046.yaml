first: "كَنَاطِحٍ صَخْرَةً يَوْمًا لِيَفْلِقَهَا"
second: "فَلَمْ يَضِرْهَا وَأَوْهَى قَرْنَهُ الْوَعِلُ"
meaning: "أنت في سعيك إلى النيل منا كوعلٍ نطح صخرة ليشقّها، فلم يضرّها شيئًا، وأضعف قرنه هو. قال التِّبْرِيزِيّ: «المعنى: أنك تكلف نفسك ما لا تصل إليه ويرجع ضرره عليك» [@tabrizi-ashr، ص302]."
vocabulary:
  - term: "نَاطِحٍ"
    text: "الذي يضرب بقرنه."
  - term: "يَفْلِقَهَا"
    text: "يشقّها."
  - term: "يَضِرْهَا"
    text: "يضرّها، من ضاره يضيره."
  - term: "أَوْهَى"
    text: "أضعف. في اللسان: «وأَوْهاه: أَضْعَفه» [@lisan، ج15 ص417]."
  - term: "الْوَعِلُ"
    text: "تيس الجبل. قال أبو عُبَيْدة: «والوعل: التيس الجبلي، والجمع أوعال» [@aghani-dk، ج9 ص154]. وقال التِّبْرِيزِيّ: «والوعل: الأيل، والأنثى أروية» [@tabrizi-ashr، ص302]."
syntax:
  - "«كَنَاطِحٍ» الكاف حرف تشبيه، والجار والمجرور متعلق بمحذوف خبر لمبتدأ محذوف تقديره: أنت كناطحٍ. و«صَخْرَةً» مفعول به لاسم الفاعل «نَاطِحٍ»، و«يَوْمًا» ظرف."
  - "«لِيَفْلِقَهَا» اللام للتعليل، و«يَفْلِقَ» منصوب بـ«أن» مضمرة بعدها."
  - "«فَلَمْ يَضِرْهَا» مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت الياء لالتقاء الساكنين. و«وَأَوْهَى قَرْنَهُ الْوَعِلُ»: «الْوَعِلُ» فاعل «أَوْهَى» مؤخر، و«قَرْنَهُ» مفعول به مقدم. والضمير في «قَرْنَهُ» يعود على «الْوَعِلُ» وهو متأخر في اللفظ، وجاز ذلك لأن رتبة الفاعل التقديم. و«الْوَعِلُ» هو الناطح نفسه، فبه يُفسَّر «نَاطِحٍ»."
morphology:
  - "«نَاطِح» اسم فاعل من «نَطَحَ»، عمل عمل فعله فنصب «صَخْرَةً»."
  - "«يَضِرْ» مضارع «ضار يضير» الأجوف اليائي، أصله «يَضِيرْ» حُذفت الياء لالتقاء الساكنين بعد الجزم."
  - "«أَوْهَى» ماضٍ على «أَفْعَلَ» من «وَهَى» إذا ضعف، والهمزة للتعدية."
rhetoric:
  thesis: "أشهر أبيات الرسالة، وقد صار مثلًا لمن يعادي من لا يقدر عليه فيرجع الضرر عليه. ويقف الصورة على مفارقة: الصخرة سالمة، والقرن هو الذي انكسر."
  devices:
    - title: "التمثيل"
      text: "شبّه حال يَزِيد في سعيه إلى هدم شرف بني قيس بحال وعل ينطح صخرة فيضعف قرنه ولا يضرها. والشبه هنا ليس في لون ولا شكل، بل في صورة منتزعة من أمور عدة: سعيٌ، وغايةٌ لا تُنال، وضررٌ يرتدّ على الساعي. وهذا ما يسميه عبد القاهر الجُرْجانيّ تمثيلًا، وهو عنده أخص من التشبيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. ويرى أن المعنى إذا جاء في صورة تمثيل «وإن كان وعظاً، كان أشْفَى للصدر، وأدعى إلى الفكر، وأبلغ في التنبيه والزَّجر» [@asrar، ص116]، وهذا البيت زجر ليزيد."
    - title: "الإيغال"
      text: "الإيغال عند أبي هلال العَسْكَرِيّ «أن يستوفى معنى الكلام قبل البلوغ إلى مقطعه؛ ثم يأتى بالمقطع فيزيد معنى آخر يزيد به وضوحا وشرحا وتوكيدا وحسنا» [@sinaatayn، ص380]. وروى هو وابن رَشِيق عن الأَصْمَعِيّ أنه سُئل عن أشعر الناس فقال: الذي «ينقضي كلامه قبل القافية، فإذا احتاج إليها أفاد بها معنى»، ومثّل بهذا البيت. ويختلف النقلان في موضع تمام الكلام: ففي رواية العَسْكَرِيّ تمّ الكلام عند «فَلَمْ يَضِرْهَا»، ثم «فلما احتاج إلى القافية قال: وأوهى قرنه الوعل؛ فزاد معنى» [@sinaatayn، ص380]. وفي رواية ابن رَشِيق: «فقد تم المثل بقوله: وأوهى قرنه، فلما احتاج إلى القافية قال»: الوعل [@ibn-rashiq، ج2 ص57]."
    - title: "لماذا الوعل؟"
      text: "سأل التَّوَّزِيّ الأَصْمَعِيّ: «وكيف صار الوعل مفضلا على كل ما ينطح؟ قال: لأنه ينحط من قنة الجبل على قرنه فلا يضيره» [@ibn-rashiq، ج2 ص57]، والقُنّة: أعلى الجبل. فالقافية «الْوَعِلُ» تزيد المعنى: إذا كان قرن الوعل الذي يسقط عليه من رؤوس الجبال لا يسلم من هذه الصخرة، فما ظنك بغيره؟"
  connection: "ثم يكشف عن طريقة يَزِيد في عداوته: يغري القوم ثم يعتزل."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "كَنَاطِحِنْ / صَخْرَتَنْ / يَوْمَنْ لِيَفْ / لِقَهَا = متفعلن / فاعلن / مستفعلن / فعِلن — فَلَمْ يَضِرْ / هَا وَأَوْ / هَى قَرْنَهُلْ / وَعِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 49 في الديوان، وقبله فيه البيت «لَأَعْرِفَنَّكَ إِنْ جَدَّ النَّفِيرُ بِنَا» الذي ليس عند التِّبْرِيزِيّ، فيصير الوعل فيه صورة ليزيد حين تشتعل الحرب [@diwan-asha، ص97]. وأنشده المُبَرِّد بعد البيتين السابقين [@kamil، ج2 ص198]. وغُنّي، ولابن مُحْرِز فيه لحن [@aghani-dk، ج9 ص153]."
