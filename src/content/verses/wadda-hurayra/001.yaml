first: "وَدِّعْ هُرَيْرَةَ إِنَّ الرَّكْبَ مُرْتَحِلُ"
second: "وَهَلْ تُطِيقُ وَدَاعًا أَيُّهَا الرَّجُلُ"
meaning: "يأمر نفسه أن يودّع هُرَيْرَة لأن الركب على وشك الرحيل، ثم يرجع على نفسه فيسألها: وهل تقدر على الوداع أيها الرجل؟ قال التِّبْرِيزِيّ في قوله «وهل تطيق وداعًا»: «أي إنك تفزع أن ودَّعتها» [@tabrizi-ashr، ص288]، أي إن الوداع وحده يفزعه."
vocabulary:
  - term: "وَدِّعْ"
    text: "فعل أمر من التوديع، وهو أن يحيّي المسافرُ صاحبه عند الفراق."
  - term: "هُرَيْرَةَ"
    text: "اسم صاحبته. قال أبو عُبَيْدة: «هريرة قينة كانت لرجل من آل عمرو بن مرثد، أهداها إلى قيس بن حسان بن ثعلبة بن عمرو بن مرثد، فولدت له خُليدا» [@tabrizi-ashr، ص288]. والقينة: الأمة. وفي «الأغاني» روايتان أخريان نذكرهما في التعريف بالقصيدة."
  - term: "الرَّكْبَ"
    text: "القوم المسافرون على الإبل. قال التِّبْرِيزِيّ: «والركب لا يستعمل إلا للإبل» [@tabrizi-ashr، ص288]."
  - term: "مُرْتَحِلُ"
    text: "راحل، من الارتحال وهو شدّ الرحال على الإبل للسفر."
  - term: "تُطِيقُ"
    text: "تقدر عليه وتحتمله، من الطاقة."
syntax:
  - "«وَدِّعْ» فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت، يخاطب به نفسه. و«هُرَيْرَةَ» مفعول به منصوب بالفتحة، وهو ممنوع من الصرف للعلمية والتأنيث."
  - "«إِنَّ الرَّكْبَ مُرْتَحِلُ» جملة مستأنفة فيها معنى التعليل: ودّعها لأن الركب راحل. و«الرَّكْبَ» اسم «إنّ»، و«مُرْتَحِلُ» خبرها."
  - "«وَهَلْ تُطِيقُ» استفهام معناه النفي: لا تطيق. و«وَدَاعًا» مفعول به منصوب."
  - "«أَيُّهَا الرَّجُلُ»: «أيّ» منادى بحرف نداء محذوف، مبني على الضم، و«ها» للتنبيه، و«الرَّجُلُ» صفة لـ«أيّ» مرفوعة."
morphology:
  - "«وَدِّعْ» أمر من «ودَّع» على «فعَّل»، ومصدره التوديع، والاسم الوداع."
  - "«مُرْتَحِلُ» اسم فاعل من «ارتحل» على «افتعل»، من الرحيل."
  - "«هُرَيْرَةَ» على صيغة التصغير «فُعَيْلة»، كأنه تصغير «هِرّة»."
rhetoric:
  thesis: "مطلع يدخل في الموضوع بلا وقوف على الأطلال: وداع حاضر لا ذكرى ديار، ثم سؤال يكشف ضعف القائل. ويرى شوقي ضَيْف أنه «يأمر قلبه أن يودعها قبل الرحيل، وسرعان ما يرجع إلى نفسه ينكر ما ظنه فيها من الصبر على الوداع»، وأن هذه «صبابة لا نعرفها عند الجاهليين» [@deif، ج1 ص361]."
  devices:
    - title: "مخاطبة النفس"
      text: "في «وَدِّعْ» و«أَيُّهَا الرَّجُلُ» يخاطب الشاعر نفسه كأنها رجل آخر يأمره وينهاه؛ فيصير الصراع بين العزم والضعف حوارًا بين اثنين."
    - title: "الاستفهام بمعنى النفي"
      text: "«وَهَلْ تُطِيقُ وَدَاعًا» سؤال لا ينتظر جوابًا، معناه: لا تطيق. وهو أبلغ من النفي الصريح، لأنه يجعل السامع يجيب بنفسه."
    - title: "التصريع"
      text: "ختم الصدر بـ«مُرْتَحِلُ» على قافية العجز «الرَّجُلُ». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. والعروض آخر تفعيلة في الصدر، والضرب آخر تفعيلة في العجز، وبه يعلم السامع من البيت الأول قافية القصيدة."
  connection: "ثم يصفها كأنها أمامه: غراء فرعاء تمشي الهوينى."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَدْدِعْ هُرَيْ / رَةَ إِنْ / نَرْرَكْبَ مُرْ / تَحِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن — وَهَلْ تُطِي / قُ وَدَا / عَنْ أَيْيُهَرْ / رَجُلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان «فعِلن»، وهي صورة البسيط التام المشهورة [@atiq، ص48]. والبيت مصرّع."
context: "مطلع القصيدة، وهو من أشهر مطالع الشعر العربي. وكان أول خمسة أصوات غنّاها مَعْبَد وقال إنها «أشد من فتح المدائن التي فتحها قتيبة» [@kamil، ج2 ص197]، وهو أول أبيات صوتها في «الأغاني» [@aghani-dk، ج9 ص152]. وفي الديوان عنوانها: «وقال ليزيد بن مسهر - أبي ثابت - الشيباني. (قال أبو عبيدة: قرأتها على أبي عمرو بن العلاء)» [@diwan-asha، ص91]. وفي نسخة الشاملة للتِّبْرِيزِيّ «أن الركب مُرُتَحِلُ»، وهما خطآن في الطبع صوابهما «إِنَّ» و«مُرْتَحِلُ» كما في الديوان."
