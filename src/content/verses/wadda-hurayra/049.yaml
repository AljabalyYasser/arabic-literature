first: "تُلْزِمُ أَرْمَاحَ ذِي الْجَدَّيْنِ سَوْرَتَنَا"
second: "عِنْدَ اللِّقَاءِ فَتُرْدِيهِمْ وَتَعْتَزِلُ"
meaning: "تجعل رماح آل ذي الجدّين تلقى سَوْرة غضبنا عند القتال، فتوقعهم في الهلاك، وتتنحّى أنت. قال التِّبْرِيزِيّ: «والسورة: الغضب» [@tabrizi-ashr، ص303]."
vocabulary:
  - term: "تُلْزِمُ"
    text: "تجعل الشيء لازمًا للشيء لا يفارقه، أي توقع رماحهم في مواجهة غضبنا."
  - term: "ذِي الْجَدَّيْنِ"
    text: "لقب. قال التِّبْرِيزِيّ: «وذو الجدين: قيس بن مسعود»، وذكر أن اللقب جاء من أن جدّه أسر أسيرًا له فداء كثير، فقال رجل: إنه لذو جدّ في الأسر، «فقال آخر: إنه لذو جدين؛ فصار يُعرف بهذا» [@tabrizi-ashr، ص303]. والجَدّ: الحظ. ويقول محقق الديوان: «ذو الجدين قيس بن مسعود من أشراف العرب» [@diwan-asha، ص97]."
  - term: "سَوْرَتَنَا"
    text: "حدّة غضبنا. «والسورة: الغضب» [@tabrizi-ashr، ص303]."
syntax:
  - "جملة «تُلْزِمُ» استئناف يعود إلى وصف فعل يَزِيد. و«تُلْزِمُ» تتعدى إلى مفعولين: «أَرْمَاحَ» مفعول أول، و«سَوْرَتَنَا» مفعول ثانٍ، أي تجعل سورتنا لازمة لرماحهم."
  - "«عِنْدَ اللِّقَاءِ» ظرف متعلق بـ«تُرْدِيهِمْ». و«فَتُرْدِيهِمْ» معطوف على «تُلْزِمُ» بالفاء، والضمير «هم» مفعول به يعود على أصحاب الرماح. و«وَتَعْتَزِلُ» معطوف."
morphology:
  - "«تُلْزِم» مضارع «أَلْزَمَ» على «أَفْعَلَ»، والهمزة للتعدية: لزم الشيءَ، وألزمه غيرَه."
  - "«الْجَدَّيْنِ» مثنى «جَدّ» مجرور بالياء، و«سَوْرَة» على «فَعْلَة» من «سار يسور» إذا وثب."
rhetoric:
  thesis: "يعيد الشاعر صورة البيت 47 ويسمّي الضحية هذه المرة: آل ذي الجدّين، أشراف شَيْبان، هم الذين يدفعهم يَزِيد إلى غضب بني قيس ثم يتركهم."
  devices:
    - title: "التكرار"
      text: "عجز هذا البيت «عِنْدَ اللِّقَاءِ فَتُرْدِيهِمْ وَتَعْتَزِلُ» يكاد يكون عجز البيت 47 «عِنْدَ اللِّقَاءِ فَتُرْدِي ثُمَّ تَعْتَزِلُ». فالتهمة نفسها تُعاد بلفظها، كأن الشاعر لا يرى في يَزِيد إلا هذا الفعل. وهي قراءتنا."
    - title: "الغضب مكان السلاح"
      text: "في «تُلْزِمُ أَرْمَاحَ ... سَوْرَتَنَا» جعل في مقابل رماحهم غضب قومه لا رماحهم. فصار الغضب نفسه سلاحًا يلقاه العدو، وهذا أبلغ في وصف بأسهم."
  connection: "ثم ينهاه أن يقعد بعد أن يشعل الحرب ويتعوّذ من شرها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "تُلْزِمُ أَرْ / مَاحَ ذِلْ / جَدْدَيْنِ سَوْ / رَتَنَا = مستعلن / فاعلن / مستفعلن / فعِلن — عِنْدَلْلِقَا / ءِ فَتُرْ / دِيهِمْ وَتَعْ / تَزِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الطَّيُّ، وهو حذف الرابع الساكن، «مستفعلن» الأولى من الصدر فصارت «مستعلن» [@atiq، ص47]، ودخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 51 في الديوان، بلفظه [@diwan-asha، ص97]. ويلخص محققه الأبيات 49–52 فيه بقوله: «تثير رهط مسعود وتغريهم بنا. وما أظنك تغضب لهم أو تخوض معهم قتالا إن طلبت منك المساعدة. فأنت تلقيهم طعاما لغضبنا الهائج، فتوردهم المهالك ثم تعتزل» [@diwan-asha، ص96]."
variants:
  - reading: "تُلْحِمُ أَبْنَاءَ ذِي الْجَدَّيْنِ إِنْ غَضِبُوا / أَرْمَاحَنَا ثُمَّ تَلْقَاهُمْ وَتَعْتَزِلُ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "قال: «تلحم: أي تجعلهم لُحمة، أي تطعمهم إياها» [@tabrizi-ashr، ص303]، أي تجعل أبناء ذي الجدين طعامًا لرماحنا. وفي نسخة الشاملة «أن غضبوا»، وهو خطأ طبع صوابه «إن» كما يقتضي الوزن والمعنى."
  - reading: "تُلْزِمُ أَرْمَاحَ ذِي الْجَدَّيْنِ شَوْكَتَنَا"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "قال: «ويروى (شوكتنا) وهو السلاح» [@tabrizi-ashr، ص303]."
