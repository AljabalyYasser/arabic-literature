first: "كَلَّا زَعَمْتُمْ بِأَنَّا لَا نُقَاتِلُكُمْ"
second: "إِنَّا لِأَمْثَالِكُمْ يَا قَوْمَنَا قُتُلُ"
meaning: "ليس الأمر كما زعمتم من أنا لا نقاتلكم، فإنا لأمثالكم، يا قومنا، كثيرو القتل. قال التِّبْرِيزِيّ: «كلاَّ: ردع وزجر، وقد يكون رداً لكلام، وفيه معنى الردع أيضا، وقُتُل: جمع قَتُول» [@tabrizi-ashr، ص306]."
vocabulary:
  - term: "كَلَّا"
    text: "كلمة ردع ونفي لما قبلها. «ردع وزجر، وقد يكون رداً لكلام» [@tabrizi-ashr، ص306]."
  - term: "زَعَمْتُمْ"
    text: "قلتم قولًا لا يصح، والزعم يقال غالبًا فيما يُشكّ فيه."
  - term: "قُتُلُ"
    text: "«جمع قَتُول» [@tabrizi-ashr، ص306]، والقَتُول: الكثير القتل."
syntax:
  - "«كَلَّا» حرف ردع ونفي. وجملة «زَعَمْتُمْ» استئناف، و«بِأَنَّا لَا نُقَاتِلُكُمْ» الباء زائدة، و«أنّ» واسمها وخبرها في تأويل مصدر سدّ مسدّ مفعولي «زعم»."
  - "«إِنَّا» حرف توكيد واسمه، و«قُتُلُ» خبره، واللام في «لِأَمْثَالِكُمْ» لام التقوية دخلت على معمول اسم المبالغة لما تقدّم عليه، والجار والمجرور متعلق بـ«قُتُلُ». و«يَا قَوْمَنَا» نداء معترض بين الخبر ومعموله."
morphology:
  - "«قُتُل» جمع «قَتُول» على «فُعُل»، و«قَتُول» صيغة مبالغة على «فَعُول»، كـ«صَبُور»."
  - "«أَمْثَال» جمع «مِثْل» على «أَفْعَال»، و«نُقَاتِل» مضارع «قَاتَلَ» على «فَاعَلَ»."
rhetoric:
  thesis: "يرد الشاعر على زعم بني شيبان أن قومه لا يجرؤون على قتالهم، ويناديهم «يَا قَوْمَنَا»، فهم أبناء عمومته من بَكْر، والوعيد يقع بين أقارب. ويقول شوقي ضَيْف إن الأَعْشَى كثيرًا ما يضمّن هجاءه لمن يختلف معهم من قبيلته الكبرى بكر «فخرا مدويا» [@deif، ج1 ص352]."
  devices:
    - title: "«كلا» بين قولين"
      text: "في اللسان أن أبا حاتم السِّجِسْتانِيّ جعل «كلا» تأتي «بِمَعْنَى أَلا الَّتِي لِلتَّنْبِيهِ»، وأنشد هذا البيت شاهدًا، ثم ردّ عليه ابن الأَنْباريّ فقال: «وَهَذَا غَلَطٌ»، ومعناها في البيت عنده: «لَا، لَيْسَ الأَمر عَلَى مَا تَقُولُونَ» [@lisan، ج15 ص231]. وقول ابن الأنباري يوافق قول التِّبْرِيزِيّ إنها ردع وردّ لكلام."
    - title: "صدى المثل"
      text: "في اللسان: «وَمِنْهُ الْمَثَلُ كلَّا زَعَمْتَ العِيرُ لَا تُقاتلُ» [@lisan، ج15 ص231]، والعِير: القافلة. فصدر البيت «كَلَّا زَعَمْتُمْ بِأَنَّا لَا نُقَاتِلُكُمْ» يكاد يكون لفظ المثل، كأن الشاعر يقول لهم: ظننتمونا قافلة لا تقاتل."
    - title: "النداء بالقرابة"
      text: "«يَا قَوْمَنَا» في وسط الوعيد يذكّرهم بالرحم، فيجمع بين التهديد والعتاب: نحن قومكم، ومع ذلك سنقتل أمثالكم إن اعتديتم. وهي قراءتنا."
    - title: "صيغة المبالغة"
      text: "صيغة المبالغة صيغة تدل على كثرة الفعل. وقد اختار «قُتُلُ» جمع «قَتُول»، ولم يقل «قاتلون»، فالقتل عادة فيهم لا فعل عارض."
  connection: "ثم يذكّرهم بيوم بعينه انهزموا فيه أمام قومه: يوم العين."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "كَلْلَا زَعَمْ / تُمْ بِأَنْ / نَا لَا نُقَا / تِلُكُمْ = مستفعلن / فاعلن / مستفعلن / فعِلن — إِنْنَا لِأَمْ / ثَالِكُمْ / يَا قَوْمَنَا / قُتُلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "سلم الحشو من الزحاف، والحشو ما سوى العَرُوض والضَّرْب من التفعيلات. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» كما يلتزم البسيط التام [@atiq، ص48]، والخَبْن حذف الثاني الساكن [@atiq، ص46]."
context: "البيت 57 في الديوان، بلفظه [@diwan-asha، ص97]. ويلخصه محققه: «تزعمون أننا لسنا لكم بأكفاء، وأننا لا ننهض لقتالكم. بل إننا لقتال أمثالكم أنداد» [@diwan-asha، ص98]."
