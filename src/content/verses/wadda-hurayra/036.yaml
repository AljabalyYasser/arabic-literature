first: "بَلْ هَلْ تَرَى عَارِضًا قَدْ بِتُّ أَرْمُقُهُ"
second: "كَأَنَّمَا الْبَرْقُ فِي حَافَاتِهِ شُعَلُ"
meaning: "بل هل ترى سحابًا معترضًا في الأفق بتُّ الليل كله أنظر إليه، يلمع البرق في نواحيه كأنه شُعَل من نار؟ قال التِّبْرِيزِيّ: «والعارض: السحابة تكون ناحية السماء، وقيل: السحاب المعترض» [@tabrizi-ashr، ص300]."
vocabulary:
  - term: "عَارِضًا"
    text: "«السحابة تكون ناحية السماء، وقيل: السحاب المعترض» [@tabrizi-ashr، ص300]، أي الذي يعترض في الأفق."
  - term: "بِتُّ"
    text: "قضيت الليل."
  - term: "أَرْمُقُهُ"
    text: "أُتبعه بصري وأديم النظر إليه."
  - term: "حَافَاتِهِ"
    text: "نواحيه وأطرافه."
  - term: "شُعَلُ"
    text: "جمع شُعْلة، وهي ما اشتعل من النار."
syntax:
  - "«بَلْ» حرف إضراب، والإضراب هنا انتقالي: لا يُبطل ما قبله، بل ينتقل من حديث إلى حديث."
  - "«هَلْ تَرَى» استفهام يخاطب به سامعًا غير معيّن، والمراد التنبيه والتعجيب لا السؤال. و«عَارِضًا» مفعول به، وجملة «قَدْ بِتُّ أَرْمُقُهُ» صفة له، وجملة «أَرْمُقُهُ» في محل نصب خبر «بِتُّ»."
  - "«كَأَنَّمَا» «كأنّ» كفّتها «ما» عن العمل، فرُفع بعدها المبتدأ «الْبَرْقُ»، وخبره «شُعَلُ»، و«فِي حَافَاتِهِ» متعلق بمحذوف حال من البرق. والجملة صفة ثانية لـ«عَارِضًا»."
morphology:
  - "«عَارِض» اسم فاعل من «عَرَض»، صار اسمًا للسحاب المعترض في الأفق."
  - "«بِتُّ» ماضٍ ناقص من «بات يبيت»، حُذفت عينه (الياء) لالتقاء الساكنين، وأُدغمت لامه في تاء الفاعل."
  - "«حَافَات» جمع «حافَة» جمعَ مؤنث سالمًا، و«شُعَل» جمع «شُعْلة» على «فُعَل»."
rhetoric:
  thesis: "يبدأ مقطع السحاب (36–43): سحاب يرقبه الشاعر ليلًا، ثم يتتبع مسيره حتى يسقي ديار هُرَيْرَة. فالقصيدة التي بدأت بوداعها تعود إليها هنا من طريق المطر."
  devices:
    - title: "التشبيه"
      text: "في «كَأَنَّمَا الْبَرْقُ فِي حَافَاتِهِ شُعَلُ» شبّه وميض البرق في أطراف السحاب بشُعَل النار. وهو تشبيه حسي، من الضرب الذي يقول فيه عبد القاهر الجُرْجانيّ إنه «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]، أي يُدرك وجه الشبه فيه بالعين: اللمعان والحمرة والتقطع."
    - title: "الإضراب الانتقالي"
      text: "بدأ بـ«بَلْ» ليقطع حديث الفلاة وينتقل إلى السحاب من غير تمهيد، كما يفعل الجاهليون حين ينتقلون من مقطع إلى مقطع."
    - title: "تكرار «حافات»"
      text: "قال في الفلاة «لِلْجِنِّ بِاللَّيْلِ فِي حَافَاتِهَا زَجَلُ» (33)، وقال هنا «كَأَنَّمَا الْبَرْقُ فِي حَافَاتِهِ شُعَلُ». فالمشهدان ليليان، وفي أطراف كل منهما شيء يُسمع أو يُرى: زجل الجن في الأول، وشُعَل البرق في الثاني. وهي قراءتنا."
  connection: "ثم يصف هيئة هذا السحاب: مؤخره ووسطه وامتلاءه بالماء."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "بَلْ هَلْ تَرَى / عَارِضَنْ / قَدْ بِتُّ أَرْ / مُقُهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — كَأَنْنَمَلْ / بَرْقُ فِي / حَافَاتِهِي / شُعَلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من العَجُز فصارت «متفعلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» كما يلتزم البسيط التام [@atiq، ص48]."
context: "في الديوان يأتي مقطع السحاب قبل مقطع الفلاة، بعد البيت «قالت هريرة لما جئت زائرها» مباشرة، وهذا البيت فيه البيت 22 [@diwan-asha، ص93]. أما ترتيب التِّبْرِيزِيّ فيجعل السحاب بعد الفلاة، فيأتي المطر بعد العطش."
