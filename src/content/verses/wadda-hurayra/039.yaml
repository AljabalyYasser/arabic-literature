first: "فَقُلْتُ لِلشَّرْبِ فِي دُرْنَى وَقَدْ ثَمِلُوا"
second: "شِيمُوا وَكَيْفَ يَشِيمُ الشَّارِبُ الثَّمِلُ"
meaning: "فقلت لرفاقي الشاربين في دُرْنَى، وقد سكروا: انظروا إلى البرق وقدّروا أين يقع مطره. ثم يسخر من طلبه: وكيف يقدّر السكرانُ مساقط المطر؟ قال التِّبْرِيزِيّ: «وشيموا: انظروا إلى البرق وقدَّروا أين صوبه، والثمل: السكران» [@tabrizi-ashr، ص300]، والصَّوْب: نزول المطر."
vocabulary:
  - term: "الشَّرْبِ"
    text: "الجماعة يشربون معًا، وهو اسم جمع لشارب."
  - term: "دُرْنَى"
    text: "موضع. قال التِّبْرِيزِيّ: «دُرنا: كانت بابا من أبواب فارس، وهي دون الحيرة بمراحل، وكان فيها أبو ثُبيت الذي ذكره، وقيل: دُرنا باليمامة» [@tabrizi-ashr، ص300]. وأبو ثُبَيْت هو يَزِيد بن مُسْهِر الذي يخاطبه في البيت 44."
  - term: "ثَمِلُوا"
    text: "سكروا. «والثمل: السكران» [@tabrizi-ashr، ص300]."
  - term: "شِيمُوا"
    text: "من شام البرق يشيمه. في اللسان: «وشِمْتُ البَرْقَ إِذَا نَظَرْت إِلَى سَحَابَتِهِ أَيْنَ تُمْطِرُ» [@lisan، ج12 ص330]."
syntax:
  - "«لِلشَّرْبِ» متعلق بـ«قُلْتُ»، و«فِي دُرْنَى» متعلق بمحذوف حال من «الشَّرْبِ». والواو في «وَقَدْ ثَمِلُوا» حالية، والجملة حال من «الشَّرْبِ»."
  - "«شِيمُوا» فعل أمر، والجملة مقول القول في محل نصب. ومفعوله محذوف يدل عليه ما سبق: شيموا برقه."
  - "«وَكَيْفَ يَشِيمُ الشَّارِبُ الثَّمِلُ» استفهام: «كَيْفَ» اسم استفهام في محل نصب حال، و«الشَّارِبُ» فاعل، و«الثَّمِلُ» صفة له."
morphology:
  - "«شِيمُوا» أمر من «شام يشيم» الأجوف اليائي، حُذفت عينه في الأمر المسند إلى المفرد (شِمْ) وعادت مع واو الجماعة لتحرك ما بعدها."
  - "«ثَمِل» صفة مشبهة على «فَعِل» من «ثَمِلَ»، كـ«فَرِح»."
  - "«دُرْنَى» اسم موضع على «فُعْلَى»، ممنوع من الصرف لألف التأنيث المقصورة."
rhetoric:
  thesis: "يجمع البيت الجد والهزل: الشاعر جادّ في مراقبة السحاب، لكنه يطلب العون ممن لا يقدر عليه، ثم يضحك من طلبه في العجز نفسه."
  devices:
    - title: "الاستفهام للتعجب"
      text: "«وَكَيْفَ يَشِيمُ الشَّارِبُ الثَّمِلُ» ليس سؤالًا ينتظر جوابًا، بل تعجب يتضمن النفي: السكران لا يقدر أن يشيم. فيسخر الشاعر من رفاقه ومن نفسه."
    - title: "تكرار الجذر"
      text: "أمر في أول العجز بـ«شِيمُوا»، ثم أعاد الجذر في «يَشِيمُ»، فقابل بين الأمر وعجز المأمور عنه. وكذلك قابل بين «ثَمِلُوا» في الصدر و«الثَّمِلُ» في القافية."
  connection: "ثم يأتي جواب الشاربين: يعدّدون المواضع التي سيصيبها المطر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "فَقُلْتُ لِشْ / شَرْبِ فِي / دُرْنَى وَقَدْ / ثَمِلُو = متفعلن / فاعلن / مستفعلن / فعِلن — شِيمُو وَكَيْ / فَ يَشِي / مُشْشَارِبُثْ / ثَمِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 25 في الديوان، وبعده فيه بيت ليس عند التِّبْرِيزِيّ، هو مفعول «شِيمُوا»: «بَرْقًا يُضِيءُ عَلَى الْأَجْزَاعِ مَسْقَطُهُ / وَبِالْخَبِيَّةِ مِنْهُ عَارِضٌ هَطِلُ» [@diwan-asha، ص93]. وفي متن التِّبْرِيزِيّ يبقى المفعول محذوفًا. وهو من الأبيات التي غُنّيت، وجاء في «الأغاني» أوّلها: «أقول للركب في دُرْنى»، ولابن سُرَيْج فيه لحن [@aghani-dk، ج9 ص153]."
variants:
  - reading: "أَقُولُ لِلرَّكْبِ فِي دُرْنَى وَقَدْ ثَمِلُوا"
    status: "رواية الأغاني"
    note: "[@aghani-dk، ج9 ص153]. ويقول محققو «الأغاني» في حاشيتهم: «درنى: موضع بنواحي اليمامة، وقيل: بنواحي العراق» [@aghani-dk، ج9 ص153]."
