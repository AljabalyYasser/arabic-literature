first: "نَازَعْتُهُمْ قُضُبَ الرَّيْحَانِ مُتَّكِئًا"
second: "وَقَهْوَةً مُزَّةً رَاوُوقُهَا خَضِلُ"
meaning: "تجاذبتُ معهم أغصان الريحان وأنا متكئ، وتداولنا خمرًا فيها لذعة حموضة، إناؤها لا يجفّ لكثرة ما يُصبّ منه. وللقدماء في الريحان قولان، قال التِّبْرِيزِيّ: «أي نازعتهم حُسن الأحاديث وظريفها، وهذا قول الأصمعي، وقال غيره: يعني الريحان، أي يُحيى بعضهم بعضا» [@tabrizi-ashr، ص297]."
vocabulary:
  - term: "نَازَعْتُهُمْ"
    text: "تجاذبت معهم وتداولنا، يأخذ كل واحد من صاحبه."
  - term: "قُضُبَ الرَّيْحَانِ"
    text: "أغصانه. قال شوقي ضَيْف: «قضب: جمع قضيب وهو الغصن» [@deif، ج1 ص356]."
  - term: "قَهْوَةً"
    text: "خمرًا، و«القهوة: الخمر» كما يقول شوقي ضَيْف [@deif، ج1 ص356]."
  - term: "مُزَّةً"
    text: "«والمُزة والمُزاء: التي فيها مزازة» [@tabrizi-ashr، ص297]. وفي اللسان عن الجوهري: «المزة الخمر التي فيها طعم حموضة» [@lisan، ج5 ص410]."
  - term: "رَاوُوقُهَا"
    text: "قال التِّبْرِيزِيّ: «والمعروف أن الراووق من الكرابيس يُروَّق فيه الخمر» [@tabrizi-ashr، ص297]، أي إنه مِصفاة من قماش القطن تُصفّى بها الخمر. ويقول محققو «الأغاني»: «والمعروف أن الراووق المصفاة التي تروق وتصفى فيها الخمر» [@aghani-dk، ج9 ص112]."
  - term: "خَضِلُ"
    text: "«والخضل: الدائم الندى» [@tabrizi-ashr، ص297]."
syntax:
  - "«نَازَعْتُهُمْ» فعل وفاعل ومفعول، و«قُضُبَ» مفعول به ثانٍ، و«مُتَّكِئًا» حال من التاء."
  - "«وَقَهْوَةً» معطوف على «قُضُبَ»، و«مُزَّةً» صفتها، وجملة «رَاوُوقُهَا خَضِلُ» صفة ثانية: «رَاوُوقُهَا» مبتدأ، و«خَضِلُ» خبره."
morphology:
  - "«نَازَعَ» على «فاعَل» الذي يدل على المشاركة: كلٌّ ينازع صاحبه ويناوله."
  - "«مُتَّكِئ» اسم فاعل من «اتَّكَأَ» على «افتعل»، وأصله «اوْتَكَأَ» من «وكأ»، قُلبت الواو تاء وأُدغمت في تاء الافتعال."
  - "«قُضُب» جمع «قضيب» على «فُعُل»، و«رَاوُوق» اسم على «فاعُول»."
rhetoric:
  thesis: "صورة المجلس في أهدأ لحظاته: اتكاء، وريحان، وخمر لا تنقطع. وسُئل حَمّاد الرّاوِيَة عن أشعر العرب فقال: «الذي يقول: نازعتهم قضب الريحان متكئا» [@aghani-dk، ج9 ص112]."
  devices:
    - title: "الاستعارة عند الأَصْمَعِيّ"
      text: "إذا أُخذ تفسير الأَصْمَعِيّ كانت «قُضُبَ الرَّيْحَانِ» استعارة لحسن الحديث وظريفه: كلام طيب يتناوله الجلساء كما يتناولون الريحان. وعلى القول الآخر هو الريحان نفسه يحيّي به بعضهم بعضًا. والاستعارة عند عبد القاهر الجُرْجانيّ أن تترك التصريح بالتشبيه و«تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الكناية"
      text: "«رَاوُوقُهَا خَضِلُ» كناية عن دوام الشرب، فالمصفاة لا تجف لأن الخمر لا تنقطع عنها. وهذا ما يقوله شوقي ضَيْف: «خضل: ندى، كنى بذلك عن اتصال شربهم» [@deif، ج1 ص356]."
  connection: "ثم يصف دوام شربهم: لا يفيقون إلا ليقولوا: هات."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "نَازَعْتُهُمْ / قُضُبَرْ / رَيْحَانِ مُتْ / تَكِئَنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — وَقَهْوَتَنْ / مُزْزَتَنْ / رَاوُوقُهَا / خَضِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية من الصدر فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "من أبيات الخمر التي يستشهد بها شوقي ضَيْف على أن الأَعْشَى يجسّم في وصفها «بيئتها ومجالسها وما ينثر فيها من الورود والرياحين» [@deif، ج1 ص355]. وفي نسخة الشاملة للتِّبْرِيزِيّ «مُتًّكِئاً» بتنوين على التاء، وهو خطأ في الطبع."
variants:
  - reading: "نَازَعْتُهُمْ قُضُبَ الرَّيْحَانِ مُرْتَفِقًا"
    status: "رواية أخرى"
    note: "قال التِّبْرِيزِيّ: «ويروى (مُرتفقا) وهو بمعنى متكئ» [@tabrizi-ashr، ص297]، والمرتفق: المتكئ على مرفقه."
