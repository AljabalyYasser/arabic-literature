first: "لَا أَعْرِفَنَّكَ إِنْ جَدَّتْ عَدَاوَتُنَا"
second: "وَالْتُمِسَ النَّصْرُ مِنْكُمْ عَوْضُ تَحْتَمِلُ"
meaning: "لا أرينّك، إذا اشتدت العداوة بيننا وطُلبت منكم النصرة، ترحل عن قومك وتخذلهم أبد الدهر. قال التِّبْرِيزِيّ: «عوضُ: اسم للدهر»، وقال: «وتحتمل: أي تذهب وتخلى قومك» [@tabrizi-ashr، ص302–303]."
vocabulary:
  - term: "لَا أَعْرِفَنَّكَ"
    text: "أسلوب في التهديد، معناه: لا تكن على هذه الحال فأراك عليها."
  - term: "جَدَّتْ"
    text: "اشتدت وصارت جدًّا لا هزلًا."
  - term: "عَوْضُ"
    text: "الدهر، أي أبدًا. «عوضُ: اسم للدهر، ويروى عوضَ - بفتح الضاد - مثل حيثُ وحيث» [@tabrizi-ashr، ص302]. وفي اللسان: «وَيُقَالُ: عاهَدَه أَن لَا يُفارِقَه عَوْضُ أَي أَبداً» [@lisan، ج7 ص193]."
  - term: "تَحْتَمِلُ"
    text: "ترحل، من احتمل القوم إذا ارتحلوا. «وتحتمل: أي تذهب وتخلى قومك» [@tabrizi-ashr، ص303]."
syntax:
  - "«لَا» ناهية، و«أَعْرِفَنَّ» مضارع مبني على الفتح لاتصاله بنون التوكيد الثقيلة في محل جزم، والكاف مفعول به. والنهي في اللفظ للمتكلم، والمراد نهي المخاطب: لا تفعل ما يجعلني أعرفك عليه."
  - "«إِنْ جَدَّتْ عَدَاوَتُنَا» شرط جوابه محذوف يدل عليه ما قبله، و«وَالْتُمِسَ النَّصْرُ» معطوف على فعل الشرط، و«النَّصْرُ» نائب فاعل، و«مِنْكُمْ» متعلق بـ«الْتُمِسَ»."
  - "«عَوْضُ» ظرف زمان مبني على الضم في محل نصب، متعلق بـ«تَحْتَمِلُ». وجملة «تَحْتَمِلُ» في محل نصب حال من الكاف في «أَعْرِفَنَّكَ»، أي: لا أعرفنّك محتملًا."
morphology:
  - "«الْتُمِسَ» ماضٍ مبني للمجهول من «الْتَمَسَ» على «افْتَعَلَ» من «لَمَس»، أي طُلب."
  - "«تَحْتَمِل» على «تَفْتَعِل» من «حَمَل»: احتمل القوم إذا حملوا متاعهم ورحلوا."
  - "«عَوْضُ» ظرف مبني يلازم الدهر المستقبل غالبًا، ويُبنى على الضم أو الفتح كما ذكر التِّبْرِيزِيّ."
rhetoric:
  thesis: "يتوقع الشاعر ما سيفعله يَزِيد إذا اشتعلت الحرب: يفرّ ويترك قومه. فالتهديد هنا تعيير بالجبن قبل وقوعه."
  devices:
    - title: "النهي الموجّه إلى النفس"
      text: "في «لَا أَعْرِفَنَّكَ» جعل النهي في اللفظ لنفسه، وهو في المعنى للمخاطب. وهذا أوقع من أن يقول «لا تفعل»، لأنه يضع يزيد تحت عين الشاعر: سأراك إن فعلت، وسيعرف الناس ذلك."
    - title: "التوكيد"
      text: "أكّد الفعل بنون التوكيد في «أَعْرِفَنَّكَ»، وختم البيت بـ«عَوْضُ»: أبدًا. فالخذلان الذي يتوقعه ليس فرارًا في يوم، بل وصمة تلازمه."
  connection: "ثم يصف كيف يجرّ يزيد غيره إلى الحرب ويعتزلها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَا أَعْرِفَنْ / نَكَ إِنْ / جَدْدَتْ عَدَا / وَتُنَا = مستفعلن / فعِلن / مستفعلن / فعِلن — وَلْتُمِسَنْ / نَصْرُ مِنْ / كُمْ عَوْضُ تَحْ / تَمِلُو = مستعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من الصدر فصارت «فعِلن» [@atiq، ص46]، ودخل الطَّيُّ، وهو حذف الرابع الساكن، «مستفعلن» الأولى من العَجُز فصارت «مستعلن» [@atiq، ص47]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 50 في الديوان، وأوله فيه «لَأَعْرِفَنَّكَ» [@diwan-asha، ص97]. وفي الديوان قبل «كناطح صخرة» بيت آخر يبدأ باللفظ نفسه، ليس عند التِّبْرِيزِيّ: «لَأَعْرِفَنَّكَ إِنْ جَدَّ النَّفِيرُ بِنَا» [@diwan-asha، ص97]. ويبدو أن التِّبْرِيزِيّ يشرح شيئًا من ذلك البيت هنا، فهو يفسّر بعد «عوض» قولهم «احتمل القوم» بأنهم أُغضبوا، ثم يقول: «ويروى (واحتملوا) أي ذهبوا من الحمية أو الغيظ» [@tabrizi-ashr، ص303]، وفي آخر ذلك البيت في الديوان «وَاحْتَمَلُوا»."
variants:
  - reading: "لَأَعْرِفَنَّكَ إِنْ جَدَّتْ عَدَاوَتُنَا"
    status: "رواية الديوان"
    note: "[@diwan-asha، ص97]. واللام فيها لام القسم، فيصير الكلام وعيدًا مؤكدًا بدل النهي."
  - reading: "وَالْتُمِسَ النَّصْرُ مِنْكُمْ عَوْضُ تُحْتَمَلُ"
    status: "ضبط الديوان، وضبط نسخة الشاملة من التِّبْرِيزِيّ"
    note: "بالبناء للمجهول، ويفسره محقق الديوان بقوله: «احتمل الرجل (على البناء للمجهول) استفز وغضب» [@diwan-asha، ص97]، أي تُستفزّ وتغضب. وأثبتنا «تَحْتَمِلُ» بالبناء للمعلوم لأنه الوجه الذي يشرحه التِّبْرِيزِيّ."
  - reading: "وَالْتُمِسَ النَّصْرُ مِنْكُمْ عَوْضَ تَحْتَمِلُ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "بفتح الضاد [@tabrizi-ashr، ص302]."
