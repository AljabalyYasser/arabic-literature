first: "قَالُوا الطِّرَادَ فَقُلْنَا تِلْكَ عَادَتُنَا"
second: "أَوْ تَنْزِلُونَ فَإِنَّا مَعْشَرٌ نُزُلُ"
meaning: "قال أعداؤنا: نريد الطِّراد، أي القتال بالرماح على ظهور الخيل، فقلنا: تلك عادتنا، وإن نزلتم عن الخيل لتقاتلوا بالسيوف فنحن قوم ننزل للقتال. قال التِّبْرِيزِيّ: «فتلك عادتُنا، وإن نزلتم تجالدون بالسيوف نزلنا» [@tabrizi-ashr، ص307]، والمجالدة: المضاربة بالسيوف."
vocabulary:
  - term: "الطِّرَادَ"
    text: "المطاردة على الخيل بالرماح. في اللسان: «والمُطارَدَة فِي الْقِتَالِ: أَن يَطْرُدَ بعضُهم بَعْضًا» [@lisan، ج3 ص268]."
  - term: "مَعْشَرٌ"
    text: "جماعة، قوم."
  - term: "نُزُلُ"
    text: "جمع نَزُول، أي كثيرو النزول عن الخيل للمجالدة. ويقول شوقي ضَيْف في روايته: «يريد بالنزول التضارب بالسيوف» [@deif، ج1 ص353]."
syntax:
  - "«الطِّرَادَ» مفعول به لفعل محذوف تقديره: نريد الطِّراد، والجملة مقول القول. و«تِلْكَ عَادَتُنَا» مبتدأ وخبر، والجملة مقول «قُلْنَا»."
  - "«أَوْ تَنْزِلُونَ» «أو» للتخيير بين حالين، و«تَنْزِلُونَ» مضارع مرفوع، والتقدير: أو إن تنزلوا. والفاء في «فَإِنَّا» رابطة لما في الكلام من معنى الشرط، و«مَعْشَرٌ» خبر «إنّ»، و«نُزُلُ» صفة له."
  - "وعلى رواية سِيبَوَيْه «إِنْ تَرْكَبُوا فَرُكُوبُ الْخَيْلِ عَادَتُنَا» يُشكل رفع «تَنْزِلُونَ» وهو معطوف على فعل الشرط المجزوم، فحمله الخليل على المعنى، وحمله يونس على القطع: «أرفعه على الابتداء، كأنه قال: أو أنتم نازلون» [@sibawayh، ج3 ص51]. أما على رواية «قَالُوا الطِّرَادَ» فيقول البَغْداديّ: «وعليه لا شاهد فيه» [@khizana، ج8 ص553]، أي لا إشكال في الرفع."
morphology:
  - "«الطِّرَاد» مصدر «طَارَدَ» على «فِعَال»، والمفاعلة تدل على المشاركة: كل فريق يطرد الآخر."
  - "«نُزُل» جمع «نَزُول» على «فُعُل»، كـ«قُتُل» جمع «قَتُول» في البيت 61."
  - "«مَعْشَر» على «مَفْعَل» من «عَشَر»، ويقال للجماعة يكون أمرهم واحدًا."
rhetoric:
  thesis: "هو البيت الذي قال فيه الشَّعْبِيّ: «وأما أشجع بيت فقوله»، وأنشده [@aghani-dk، ج9 ص112]. ويفسّر شوقي ضَيْف هذا الحكم فيقول إن «بعض القدماء» جعلوه أشجع بيت «لما صور فيه الأعشى قومه بأنهم يحسنون الطعان فرسانا كما يحسنون الضراب راجلين» [@deif، ج1 ص353]. فالخصم يختار طريقة القتال، وقوم الأَعْشَى يقبلون كل اختيار."
  devices:
    - title: "الحذف"
      text: "«قَالُوا الطِّرَادَ»: حذف الفعل الناصب، فجاء طلب الأعداء كلمة واحدة، كأنها صيحة في ساحة الحرب. ويقول عبد القاهر الجُرْجانيّ في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "الإيجاز في الجواب"
      text: "«فَقُلْنَا تِلْكَ عَادَتُنَا»: لم يصف شجاعتهم، بل جعل ما يخشاه غيرهم عادة عندهم، والعادة ما يتكرر بلا تكلّف. ويقول شوقي ضَيْف إن الشاعر نوّه «بأن تلك سجية لهم درج عليها شيوخهم وشبابهم» [@deif، ج1 ص353]."
    - title: "المقابلة"
      text: "المقابلة أن يؤتى بمعنيين ثم بما يقابلهما. وقد قابل بين الطِّراد على الخيل في الصدر والنزول عنها في العجز، فاستوفى وجهي القتال كليهما: الفروسية والمجالدة."
  connection: "ثم يختم القصيدة بإحكام قومه للطعن: يصيبون الصيد في مقتله، ويهلك البطل على رماحهم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "قَالُطْطِرَا / دَ فَقُلْ / نَا تِلْكَ عَا / دَتُنَا = مستفعلن / فعِلن / مستفعلن / فعِلن — أَوْ تَنْزِلُو / نَ فَإِنْ / نَا مَعْشَرُنْ / نُزُلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "تسقط همزة الوصل في «الطِّرَادَ» ويُقصر حرف المد قبلها: «قَالُطْطِرَا». ودخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "في ترتيب التِّبْرِيزِيّ يأتي هذا البيت قبل الأخير، وهو في الديوان آخر القصيدة، البيت 66، وفيه «قَالُوا الرُّكُوبَ» [@diwan-asha، ص99]. وغُنّي بلفظ «إن تركبوا»، ولابن مُحْرِز ولحُنَيْن الحِيرِيّ فيه لحنان [@aghani-dk، ج9 ص153]. وقد أنشده الشَّعْبِيّ بلفظ «قالوا الطراد» كما في متن التِّبْرِيزِيّ [@aghani-dk، ج9 ص112]، وذكر البَغْداديّ أن التِّبْرِيزِيّ «لم يذكر ... في شرح القصيدة غير هذه الرواية» [@khizana، ج8 ص553]."
variants:
  - reading: "إِنْ تَرْكَبُوا فَرُكُوبُ الْخَيْلِ عَادَتُنَا"
    status: "رواية سِيبَوَيْه والأغاني"
    note: "استشهد به سِيبَوَيْه، وسأل عنه الخليل [@sibawayh، ج3 ص51]، وبه غُنّي في «الأغاني» [@aghani-dk، ج9 ص153]. ونقل البَغْداديّ قول الأعلم: «والأول اصح فى المعنى والنظم» [@khizana، ج8 ص552]، يعني مذهب الخليل في رفع «تنزلون»."
  - reading: "قَالُوا الرُّكُوبَ فَقُلْنَا تِلْكَ عَادَتُنَا"
    status: "رواية الديوان"
    note: "[@diwan-asha، ص99]. وبها أنشده شوقي ضَيْف [@deif، ج1 ص353]."
