first: "إِنِّي لَعَمْرُ الَّذِي حَطَّتْ مَنَاسِمُهَا"
second: "تَخْدِي وَسِيقَ إِلَيْهِ الْبَاقِرُ الْغُيُلُ"
meaning: "إني، أقسم ببقاء الذي تسرع الإبل إلى بيته معتمدة على أطراف أخفافها، وتُساق إليه جماعات البقر الكثيرة هديًا... والكلام لا يتم هنا: فجواب القسم، وهو خبر «إنّي»، في البيت التالي: «لَنَقْتُلَنْ مِثْلَهُ مِنْكُمْ». ويشرح البَغْداديّ المقسم به فيقول: «يريد: إني أقسم بالله الذي تسرع الإبل إلى بيته ويساق إليه الهدي» [@khizana، ج9 ص455]، والهَدْي: ما يُساق إلى الحرم من الأنعام ليُنحر."
vocabulary:
  - term: "لَعَمْرُ"
    text: "قسم بالبقاء والحياة. قال البَغْداديّ: «ومعنى لعمر الله: أحلف ببقاء الله ودوامه» [@khizana، ج9 ص455]."
  - term: "حَطَّتْ"
    text: "اعتمدت في سيرها وأسرعت. قال التِّبْرِيزِيّ: «حطت، قيل: معناه أسرعت»، ونقل عن الأَصْمَعِيّ: «وإنما يقال حطت إذا اعتمدت في زمامها» [@tabrizi-ashr، ص304]."
  - term: "مَنَاسِمُهَا"
    text: "«والمناسم: أطراف أخفاقها» [@tabrizi-ashr، ص304]، والخُفّ للبعير كالحافر للفرس. والضمير للإبل، قال البَغْداديّ: «والضمير المؤنث ضمير الإبل وإن لم يجر لها ذكر لأن المناسم تدل عليها» [@khizana، ج9 ص455]."
  - term: "تَخْدِي"
    text: "«تسير سيرا شديدا فيه اضطراب لشدته» [@tabrizi-ashr، ص304]. وفي اللسان: «خَدَى البعيرُ وَالْفَرَسُ يَخْدِي خَدْياً وخَدَياناً، فَهُوَ خادٍ: أَسرع وزجَّ بِقَوائِمِه» [@lisan، ج14 ص224]."
  - term: "الْبَاقِرُ"
    text: "«والباقر: البقر» [@tabrizi-ashr، ص304]، وهو عند البَغْداديّ «اسم جمع معناه جماعة البقر» [@khizana، ج9 ص455]."
  - term: "الْغُيُلُ"
    text: "الكثيرة. «والغُيُل: جمع غيل، وهو الكثير» [@tabrizi-ashr، ص304]. وفي اللسان: «وإِبل غُيُل: كَثِيرَةٌ، وَكَذَلِكَ الْبَقَرُ» [@lisan، ج11 ص513]."
syntax:
  - "«إِنِّي» حرف توكيد، والياء اسمه، وخبره جملة القسم وجوابه. قال البَغْداديّ: «والبيت الذي بعده جواب القسم والقسم وجوابه خبر إني» [@khizana، ج9 ص455]."
  - "«لَعَمْرُ» اللام للابتداء والتوكيد، و«عَمْرُ» مبتدأ خبره محذوف وجوبًا تقديره: قسمي. قال البَغْداديّ: «وعمر مضاف إلى الذي بتقدير موصوف أي: لعمر الله الذي» [@khizana، ج9 ص455]."
  - "جملة «حَطَّتْ مَنَاسِمُهَا» صلة الموصول، والعائد محذوف تقديره: إليه، أي إلى بيته، يدل عليه «إِلَيْهِ» في العجز. وجملة «تَخْدِي» حال من «مَنَاسِمُهَا». و«وَسِيقَ» معطوف على «حَطَّتْ»، و«الْبَاقِرُ» نائب فاعل، و«الْغُيُلُ» صفة له [@khizana، ج9 ص455]."
morphology:
  - "«عَمْر» بفتح العين لغة في «العُمُر»، ولا يُستعمل في القسم إلا مفتوحًا."
  - "«مَنَاسِم» جمع «مَنْسِم» على «مَفَاعِل»، وهو عند البَغْداديّ «كمجلس» [@khizana، ج9 ص455]."
  - "«سِيقَ» ماضٍ مبني للمجهول من «ساق يسوق»، أصله «سُوِقَ» نُقلت كسرة الواو إلى السين فقُلبت ياءً. و«الْغُيُل» على «فُعُل»، جمع «غَيْل» أو «غَيُول»."
rhetoric:
  thesis: "يبدأ مقطع القسم والوعيد (55–64). وهو أكثر أبيات القصيدة اختلافًا في الرواية، قال ابن قُتَيْبة: «ولم تختلف الرواة فى ألفاظ بيت اختلافها فى بيت له» [@ibn-qutayba، ج1 ص257]، ثم أنشد هذا البيت. ويقسم الشاعر بأعظم ما يُقسم به: إله البيت الذي تحجّ إليه العرب، فيأتي الوعيد بعده بثقل اليمين."
  devices:
    - title: "التضمين"
      text: "التضمين في تعريف ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]، أي ألا يتم معنى البيت إلا بالبيت الذي بعده. وهنا بدأ بـ«إِنِّي» ثم اعترض بالقسم، فلم يأت خبر «إنّ» إلا في البيت التالي. ويقول ابن رَشِيق: «وكلما كانت اللفظة المتعلقة بالبيت الثاني بعيدة من القافية كان أسهل عيباً من التضمين» [@ibn-rashiq، ج1 ص171]، واللفظة المعلقة هنا «إِنِّي» في أول البيت، أبعد ما تكون عن القافية. فهو من أخف التضمين عنده، وهو البناء الذي رأيناه في أبيات الروضة (12–14)."
    - title: "المجاز العقلي"
      text: "في «حَطَّتْ مَنَاسِمُهَا تَخْدِي» أسند الإسراع إلى أطراف الأخفاف، والمسرع هو الإبل. قال البَغْداديّ: «وإسناد الخدي إلى المناسم مجاز عقلي وفي الحقيقة إنما هو للإبل» [@khizana، ج9 ص455]. والمجاز العقلي أن يُسند الفعل إلى غير فاعله الحقيقي لملابسة بينهما. فكأن العين لا ترى من الإبل المسرعة إلا مناسمها تضرب الأرض."
    - title: "الكناية عن المقسم به"
      text: "لم يسمّ المقسم به، بل وصفه بما يُعرف به: «الَّذِي حَطَّتْ مَنَاسِمُهَا ... وَسِيقَ إِلَيْهِ الْبَاقِرُ». والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]. ويختلف الشرّاح في المقصود: هو الله عند البَغْداديّ [@khizana، ج9 ص455]، وهو عند محقق الديوان البيت الحرام: «إنى أقسم بالبيت الحرام الذى تهوى إليه الإبل من كل صوب، وبما يساق إليه من قرابين البقر الكثير» [@diwan-asha، ص98]."
  connection: "ويأتي جواب القسم في البيت التالي: لئن قتلتم منا سيدًا لنقتلنّ مثله منكم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "إِنْنِي لَعَمْ / رُلْلَذِي / حَطْطَتْ مَنَا / سِمُهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — تَخْدِي وَسِي / قَ إِلَيْ / هِلْبَاقِرُلْ / غُيُلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "في ترتيب التِّبْرِيزِيّ يأتي القسم بعد الرسالة، وهو في الديوان البيت 62، وقبله فيه أبيات الوعيد [@diwan-asha، ص99]. ومتن التِّبْرِيزِيّ رواية أبي عَمْرو الشَّيْبانِيّ، قال: «هذه رواية أبي عمرو» [@tabrizi-ashr، ص304]. ويعيب البَغْداديّ التِّبْرِيزِيّ بأنه «لم يأت في شرح هذا البيت بشيء مع أنه اختلفت الرواة فيه وخطأ العلماء بعضهم بعضا فيه» [@khizana، ج9 ص455]، ثم ينقل عن علي بن حمزة البَصْرِيّ في «التنبيهات على أغلاط الرواة» ما دار بين العلماء فيه. ويتصل البيت بمناسبة القصيدة: يقول محقق الديوان إن الأَعْشَى «يشير إلى ما كان من إغراء يزيد لهذا البيت من شيبان، ونهيهم أن يقتلوا ضبيعا بزاهر» [@diwan-asha، ص98]."
variants:
  - reading: "إِنِّي لَعَمْرُ الَّذِي خَطَّتْ مَنَاسِمُهَا"
    status: "رواية الأَصْمَعِيّ، وهي رواية الديوان"
    note: "قال الأَصْمَعِيّ: «لا معنى لحطت هاهنا ... وقال: الرواية (خطت) أي سفت التراب يمناسمها» [@tabrizi-ashr، ص304]، أي شقّت التراب. وبها رواه الديوان [@diwan-asha، ص99] واللسان [@lisan، ج11 ص513]. ونقل البَغْداديّ عن علي بن حمزة البَصْرِيّ: «وأصاب أبو عبيدة في حطت لأنه وجه صحيح وأخطأ الأصمعي»، و«لما لم يعرفه الأصمعي رده» [@khizana، ج9 ص457]، أي إن الأَصْمَعِيّ ردّ رواية الحاء لأنه لم يعرف معناها."
  - reading: "إِنِّي لَعَمْرُ الَّذِي حَطَّتْ مَنَاسِمُهَا / لَهُ وَسِيقَ إِلَيْهِ الْبَاقِرُ الْعَثَلُ"
    status: "رواية أبي عُبَيْدة"
    note: "قال التِّبْرِيزِيّ: «وروى أبو عبيدة: له وسِيقَ إليه البَاقِرُ العَثَلُ»، والعَثَل: «الجماعة، يقال: عَثَل له من ماله، أي أكثر» [@tabrizi-ashr، ص304–305]. ونقل البَغْداديّ أن أبا عَمْرو الشَّيْبانِيّ أرسل إلى أبي عُبَيْدة: «صحفت إنما هو الغيل» [@khizana، ج9 ص456]، والتصحيف: الخطأ في قراءة الكلمة لتشابه حروفها في الخط. وحكم علي بن حمزة: «وقد أصاب أبو عمرو في الغيل وصحف أبو عبيدة» [@khizana، ج9 ص457]."
  - reading: "إِنِّي لَعَمْرُ الَّذِي حَطَّتْ مَنَاسِمُهَا / تُحْدَى وَسِيقَ إِلَيْهَا الْبَاقِرُ الْعَثَلُ"
    status: "رواية ابن قُتَيْبة"
    note: "هكذا أنشده، ثم قال: «وروى بعضهم «تحدى» ، وبعضهم «تخدى»» [@ibn-qutayba، ج1 ص257]. وتُحْدَى: يُغنّى لها الحُداء لتسرع."
  - reading: "تَخْدِي وَجَدَّ عَلَيْهَا النَّافِرُ الْعَجِلُ"
    status: "رواية ذكرها ابن قُتَيْبة"
    note: "قال: «ورواه آخر «وجدّ عليها النّافر العجل» يريد النّفّار من منى» [@ibn-qutayba، ج1 ص258]، أي الحجاج حين ينفرون من مِنى. ونقل البَغْداديّ عن ابن قُتَيْبة «أن الأصمعي كان يروي: وجد عليها النافر العجل» [@khizana، ج9 ص456]."
