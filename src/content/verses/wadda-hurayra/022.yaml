first: "إِمَّا تَرَيْنَا حُفَاةً لَا نِعَالَ لَنَا"
second: "إِنَّا كَذَلِكِ مَا نَحْفَى وَنَنْتَعِلُ"
meaning: "إن تَرَيْنا اليوم حفاةً لا نعال لنا، فتلك حالنا: نحفى مرة وننتعل مرة. وللتِّبْرِيزِيّ في معناه ثلاثة أقوال: «أي أن ترينا نتبذل مرة ونتنَّعم أخرى فكذلك سبيلُنا» [@tabrizi-ashr، ص295]، وقيل المعنى أن «ترينا نستغني مرة ونفتقر مرة، وقيل: المعنى أن ترينا نميل إلى النساء مرة ونتركهن أخرى» [@tabrizi-ashr، ص296]."
vocabulary:
  - term: "حُفَاةً"
    text: "جمع حافٍ، وهو الذي يمشي بلا نعل."
  - term: "نَنْتَعِلُ"
    text: "نلبس النعال."
syntax:
  - "«إِمَّا» أصلها «إِنْ» الشرطية و«ما» الزائدة أُدغمتا. و«تَرَيْنَا» فعل الشرط مجزوم بحذف النون، والياء ضمير المخاطبة فاعل، و«نا» مفعول به."
  - "«حُفَاةً» حال من «نا»، وجملة «لَا نِعَالَ لَنَا» حال ثانية: «لا» نافية للجنس، و«نِعَالَ» اسمها مبني على الفتح، و«لَنَا» خبرها."
  - "«إِنَّا كَذَلِكِ» جواب الشرط، وحُذفت منه الفاء. قال التِّبْرِيزِيّ: «وحذف الفاء لعلم السامع، والتقدير: فإنا كذلك نحفى وننتعل، و (ما) زائدة للتوكيد» [@tabrizi-ashr، ص296]."
morphology:
  - "«كَذَلِكِ» بكسر الكاف الأخيرة، لأنها كاف الخطاب في اسم الإشارة، وهي تتبع المخاطَب، والمخاطَب هنا امرأة: هُرَيْرَة، كما في «تَرَيْنَا»."
  - "«حُفَاة» جمع «حافٍ» على «فُعَلة»، كـ«قُضاة» جمع «قاضٍ»."
  - "«نَنْتَعِلُ» مضارع «انْتَعَلَ» على «افتعل» من «النعل»، و«نَحْفَى» مضارع «حَفِيَ» إذا مشى بلا نعل."
rhetoric:
  thesis: "بداية ردّه عليها: لا ينكر ما رأته، بل يجعله طورًا من أطوار الحياة يأتي بعده غيره. ومن هنا ينطلق إلى أيام قوته وشبابه."
  devices:
    - title: "الكناية"
      text: "«مَا نَحْفَى وَنَنْتَعِلُ» كناية عن تقلب الأحوال، ولذلك احتملت عند التِّبْرِيزِيّ ثلاثة معانٍ: البؤس والنعمة، والفقر والغنى، والإعراض عن النساء والإقبال عليهن. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الطباق"
      text: "جمع بين الضدين «نَحْفَى» و«نَنْتَعِلُ»، فاختصر في كلمتين حياة كاملة تتقلب بين حالين."
    - title: "ضمير الجماعة"
      text: "في «تَرَيْنَا ... لَنَا ... إِنَّا» تحوّل من المفرد «رَجُلًا أَعْشَى» في البيت 20 إلى الجمع، فلم يعد يتكلم عن رجل ضعيف وحده، بل عن جماعة لها سبيلها في الحياة."
  connection: "ثم يذكر ما كان منه أيام قوته: يخالس الأزواج غفلتهم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "إِمْمَا تَرَيْ / نَا حُفَا / تَنْ لَا نِعَا / لَ لَنَا = مستفعلن / فاعلن / مستفعلن / فعِلن — إِنْنَا كَذَا / لِكِ مَا / نَحْفَى وَنَنْ / تَعِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية من العجز فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "أول مقطع الرد (22–32): صباه والحانوت والقيان. وهو في الديوان البيت 34، بعد وصف السحاب [@diwan-asha، ص95]، أما التِّبْرِيزِيّ فيجعله جوابًا مباشرًا عن قول هُرَيْرَة."
