first: "تُغْرِي بِنَا رَهْطَ مَسْعُودٍ وَإِخْوَتِهِ"
second: "عِنْدَ اللِّقَاءِ فَتُرْدِي ثُمَّ تَعْتَزِلُ"
meaning: "تُغري بنا رهطَ مسعود وإخوته وتهيّجهم علينا، فإذا التقى الفريقان في القتال أوقعتَ القوم في الهلاك، ثم اعتزلت الحرب ونجوت بنفسك. قال التِّبْرِيزِيّ: «أي تضرب بيننا وبينهم، كأنه قال: تلصق بيننا وبينهم العداوة من الغراء، وتُردى: تهلك» [@tabrizi-ashr، ص302]."
vocabulary:
  - term: "تُغْرِي"
    text: "تحرّض وتهيّج. وفسّره التِّبْرِيزِيّ بأنه من الغِراء الذي يُلصق به، أي تلصق العداوة بيننا وبينهم [@tabrizi-ashr، ص302]."
  - term: "رَهْطَ"
    text: "الرهط: قوم الرجل وقبيلته الأدنون."
  - term: "اللِّقَاءِ"
    text: "القتال. ويقول محقق الديوان: «اللقاء القتال» [@diwan-asha، ص97]."
  - term: "تُرْدِي"
    text: "تُهلك. «وتُردى: تهلك» [@tabrizi-ashr، ص302]."
  - term: "تَعْتَزِلُ"
    text: "تتنحّى جانبًا."
syntax:
  - "جملة «تُغْرِي» استئناف يبيّن ما يفعله يَزِيد، أو حال من ضمير المخاطب في البيت 45. و«بِنَا» متعلق بـ«تُغْرِي»، و«رَهْطَ» مفعول به، و«وَإِخْوَتِهِ» معطوف على «مَسْعُودٍ»."
  - "«عِنْدَ اللِّقَاءِ» ظرف متعلق بـ«تُرْدِي». و«فَتُرْدِي» معطوف على «تُغْرِي» بالفاء التي تفيد التعقيب، ومفعوله محذوف: فتُردي القوم. و«ثُمَّ تَعْتَزِلُ» معطوف بـ«ثم» التي تفيد الترتيب مع التراخي."
morphology:
  - "«تُغْرِي» مضارع «أَغْرَى» على «أَفْعَلَ»، و«تُرْدِي» مضارع «أَرْدَى» على «أَفْعَلَ» من الرَّدَى، وهو الهلاك."
  - "«تَعْتَزِل» على «تَفْتَعِل» من «عَزَل»، والافتعال هنا للمطاوعة: عزل نفسه فاعتزل."
rhetoric:
  thesis: "يرسم الشاعر صورة المحرّض الجبان: يشعل العداوة بين الحيين، فإذا التقيا تركهما يتقاتلان وانسحب. فالبيت اتهام ليزيد بأنه يدفع غيره إلى الموت ولا يشهده."
  devices:
    - title: "ترتيب الأفعال"
      text: "ثلاثة أفعال تروي القصة كلها: «تُغْرِي» ثم «فَتُرْدِي» ثم «تَعْتَزِلُ». وجاءت الفاء بين الإغراء والإرداء لأن الهلاك يعقب الإغراء بلا مهلة، وجاءت «ثُمَّ» قبل الاعتزال لأنه يأتي بعد أن يقع ما وقع. وهي قراءتنا."
    - title: "حذف المفعول"
      text: "لم يذكر من «تُرْدِي»: أهم قومه أم قومنا؟ فحذف المفعول ليعمّ الفريقين. ويقول عبد القاهر الجُرْجانيّ في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
  connection: "ثم يحذّره: لا أعرفنّك تفرّ حين تشتد العداوة ويُطلب منكم النصر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "تُغْرِي بِنَا / رَهْطَ مَسْ / عُودِنْ وَإِخْ / وَتِهِي = مستفعلن / فاعلن / مستفعلن / فعِلن — عِنْدَلْلِقَا / ءِ فَتُرْ / دِي ثُمْمَ تَعْ / تَزِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 47 في الديوان، بلفظه [@diwan-asha، ص97]، ويلخصه محققه: «فإذا التقوا فى القتال، وتردّوا فى الهلاك، اعتزلت كأنك لم تفعل شيئًا ولم تأت إثمًا» [@diwan-asha، ص96]. ولم نجد في الشروح التي رجعنا إليها من يسمّي مسعودًا هذا، والأقرب أنه من آل قيس بن مسعود الذي يسميه في البيت 49 «ذا الجدين». وسيعود عجز هذا البيت تقريبًا بلفظه في البيت 49: «عِنْدَ اللِّقَاءِ فَتُرْدِيهِمْ وَتَعْتَزِلُ»."
