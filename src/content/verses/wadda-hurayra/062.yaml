first: "نَحْنُ الْفَوَارِسُ يَوْمَ الْعَيْنِ ضَاحِيَةً"
second: "جَنْبَيْ فُطَيْمَةَ لَا مِيلٌ وَلَا عُزُلُ"
meaning: "نحن الفرسان الذين ثبتوا يوم العَيْن في وضح النهار إلى جانبي فُطَيْمة، لا نميل على السروج ولا نخلو من السلاح. ويروي أبو عُبَيْدة أن يَزِيد بن مُسْهِر أراد أن يأخذ ابني امرأة من بني سعد بن قيس، اسمها فُطَيْمة، رهينة، «فنادت قومها، فحضر الناس للحرب، فاشتملت فطيمة على ابنيها بثوبها، وفكّ قومها عنها وعنهما»، ثم قال: «فانهزمت بنو شيبان» [@aghani-dk، ج9 ص155]."
vocabulary:
  - term: "يَوْمَ الْعَيْنِ"
    text: "يوم كان بين بني قيس بن ثعلبة وبني شيبان. وفي «الأغاني» أن الأَعْشَى حذّر يزيد «أن تلقى شيبانُ منهم مثل ما لقوا يوم العين عين مُحَلِّم بهجر» [@aghani-dk، ج9 ص155]، وهَجَر: من أرض البحرين."
  - term: "ضَاحِيَةً"
    text: "علانية في وضح النهار. «ضاحية: علانية» [@tabrizi-ashr، ص306]."
  - term: "فُطَيْمَةَ"
    text: "امرأة. في رواية أبي عُبَيْدة هي «فُطيمة بنت شُرَحْبيل بن عَوْسَجة بن ثعلبة بن سعد بن قيس» [@aghani-dk، ج9 ص155]. وقال التِّبْرِيزِيّ: «قال أبو عمرو وابن حبيب: فُطيمة هي فاطمة بنت حبيب بن ثعلبة» [@tabrizi-ashr، ص306]. ويجعلها شوقي ضَيْف موضعًا: «يوم العين: يوم كان بين بنى قيس بن ثعلبة وشيبان بجنب موضع فى البحرين يسمى فطيمة» [@deif، ج1 ص353]."
  - term: "مِيلٌ"
    text: "«والميل: جمع أميل، وهو الذي لا يثبت في الحرب» [@tabrizi-ashr، ص306]، أي يميل على سرج فرسه."
  - term: "عُزُلُ"
    text: "جمع أعزل. «و (الأعزل) قيل: هو الذي لا رُمْحَ معه، وقال أبو عبيدة: هو الذي لا سلاح معه، وإن كان معه عصا لم يقل له أعزل» [@tabrizi-ashr، ص307]."
syntax:
  - "«نَحْنُ» مبتدأ، و«الْفَوَارِسُ» خبره. و«يَوْمَ الْعَيْنِ» ظرف زمان متعلق بمعنى الفروسية في «الْفَوَارِسُ»، أي الذين فرسوا يوم العين."
  - "«ضَاحِيَةً» حال أو ظرف بمعنى: علانية. و«جَنْبَيْ» ظرف مكان منصوب بالياء لأنه مثنى، حُذفت نونه للإضافة إلى «فُطَيْمَةَ»، وهي ممنوعة من الصرف للعلمية والتأنيث."
  - "«لَا مِيلٌ وَلَا عُزُلُ» خبر لمبتدأ محذوف تقديره: لا نحن ميلٌ ولا عزل، و«لا» المكررة نافية غير عاملة."
morphology:
  - "«الْفَوَارِس» جمع «فارس» على «فَوَاعِل»، وهو من الجموع النادرة لوصف مذكر عاقل."
  - "«مِيل» جمع «أَمْيَل» على «فُعْل»، كُسرت فاؤه لتسلم الياء، قال التِّبْرِيزِيّ: «والأصل فيه أن يكون على فُعْل، مثل أَبيض وبِيض» [@tabrizi-ashr، ص306]."
  - "«عُزُل» قال فيه التِّبْرِيزِيّ وجهين: «يجوز أن يكون جمع أعزل، ثم اضطر فضم الزاي لأن قبلها ضمة، ويجوز أن يكون بني الاسم على فعيل، ثم جمعه على فُعُل كما تقول: رَغِيف ورُغُف» [@tabrizi-ashr، ص306]."
rhetoric:
  thesis: "يحتج الشاعر على زعم بني شيبان بيوم معروف انهزموا فيه أمام قومه، وكان يزيد بن مسهر طرفًا فيه. فالبيت ذاكرة يضعها الشاعر أمام خصمه: ما زعمتموه من عجزنا يكذّبه يوم العين."
  devices:
    - title: "التعريف للحصر"
      text: "«نَحْنُ الْفَوَارِسُ»: عرّف الخبر، فكأنه يقول: نحن الفرسان حقًّا يوم العين، لا غيرنا."
    - title: "نفي الضعف"
      text: "«لَا مِيلٌ وَلَا عُزُلُ» نفى عيبين يُعاب بهما الفارس: الضعف في الثبات، والخلو من السلاح. ومدح الشيء بنفي ضده من طرق الفخر الموجزة."
    - title: "«جنبي فطيمة»"
      text: "على رواية أبي عُبَيْدة تصير «جَنْبَيْ فُطَيْمَةَ» صورة حيّة: امرأة تشتمل على ابنيها بثوبها، والفرسان حولها من الجانبين يحمونها، فيلتقي في البيت الفخر بالشجاعة والفخر بحماية الحرمة."
  connection: "ثم يختم بعادة قومه في القتال: إن أرادوا الطراد طاردناهم، وإن نزلوا نزلنا."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "نَحْنُلْ فَوَا / رِسُ يَوْ / مَلْعَيْنِ ضَا / حِيَتَنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — جَنْبَيْ فُطَيْ / مَةَ لَا / مِيلُنْ وَلَا / عُزُلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]. والوزن واحد في روايتي «العَيْن» و«الحِنْو»."
context: "أثبتنا «يَوْمَ الْعَيْنِ» وفي متن التِّبْرِيزِيّ «يَوْمَ الْحِنْوِ» [@tabrizi-ashr، ص306]، لثلاثة أسباب: أن خبر أبي عُبَيْدة الذي يفسر البيت يرويه «يوم العين»، ويفسر به «جنبي فطيمة» [@aghani-dk، ج9 ص155]؛ وأن التِّبْرِيزِيّ نفسه لم يشرح «الحنو»، وإنما شرح «ضاحية» و«فطيمة» و«ميل» و«عزل» [@tabrizi-ashr، ص306–307]؛ وأنها رواية الديوان [@diwan-asha، ص99] وشوقي ضَيْف [@deif، ج1 ص353]. ويخطّئ محقق الديوان رواية «الحنو» برأي له، يقول: من رواها «فهو مخطىء، لأن يوم الحنو هو يوم ذى قار»، ويوم ذي قار أبلى فيه بنو شيبان، قوم يزيد، أحسن البلاء، فلا يُعقل أن يفخر عليهم الأعشى به [@diwan-asha، ص99]. وفي «الأغاني» رواية أخرى يرويها أبو عُبَيْدة عن قتادة، وفيها «أن فطيمة من بني سعد بن قيس كانت عند رجل من بني شيبان» [@aghani-dk، ج9 ص155]. وعلى نحو هذه الرواية يقصّ محقق الديوان الخبر: كانت لزوجها امرأة أخرى من قومه، «فتعايرتا، فعمدت السيارية فحلقت ذوائب فطيمة، فاهتاج الحيان واقتتلوا» [@diwan-asha، ص99]."
variants:
  - reading: "نَحْنُ الْفَوَارِسُ يَوْمَ الْحِنْوِ ضَاحِيَةً"
    status: "متن التِّبْرِيزِيّ ولسان العرب"
    note: "[@tabrizi-ashr، ص306]. وفي اللسان: «والحِنْوُ: مَوْضِعٌ؛ قَالَ الأَعشى»، وأنشد البيت بهذه الرواية [@lisan، ج14 ص206]. وانظر سبب عدولنا عنها في سياق البيت."
