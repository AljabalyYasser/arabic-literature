first: "لَا تَقْعُدَنَّ وَقَدْ أَكَّلْتَهَا حَطَبًا"
second: "تَعُوذُ مِنْ شَرِّهَا يَوْمًا وَتَبْتَهِلُ"
meaning: "لا تقعد بعيدًا عن الحرب بعد أن أوقدتها وأطعمتها الحطب، ثم تتعوّذ من شرّها وتدعو الله أن يقيك منها. قال التِّبْرِيزِيّ: «أأَكلتها: أجَّجْتها، وتبتهل: تدعو إلى الله سبحانه وتعالى» [@tabrizi-ashr، ص303]."
vocabulary:
  - term: "أَكَّلْتَهَا"
    text: "أطعمتَها، والضمير للحرب. «أجَّجْتها» [@tabrizi-ashr، ص303]. وفي اللسان: «وأَكَلَتِ النارُ الحَطَبَ، وآكَلْتُها أَي أَطْعَمْتُها» [@lisan، ج11 ص20]."
  - term: "تَعُوذُ"
    text: "تلجأ وتستجير."
  - term: "تَبْتَهِلُ"
    text: "تتضرّع في الدعاء. «تدعو إلى الله سبحانه وتعالى» [@tabrizi-ashr، ص303]. وفي اللسان: «والابْتِهَال: التضرُّع» [@lisan، ج11 ص72]."
syntax:
  - "«لَا» ناهية، و«تَقْعُدَنَّ» مضارع مبني على الفتح لاتصاله بنون التوكيد الثقيلة في محل جزم."
  - "الواو في «وَقَدْ أَكَّلْتَهَا» حالية، والجملة حال من فاعل «تَقْعُدَنَّ». و«أَكَّلْتَ» تتعدى إلى مفعولين: الضمير «ها» مفعول أول، و«حَطَبًا» مفعول ثانٍ. والضمير يعود على الحرب، ولم يجر لها ذكر صريح، لأن السياق يدل عليها."
  - "جملة «تَعُوذُ مِنْ شَرِّهَا» حال ثانية من فاعل «تَقْعُدَنَّ»، و«يَوْمًا» ظرف، و«وَتَبْتَهِلُ» معطوف على «تَعُوذُ»."
morphology:
  - "«أَكَّلْتَ» على «فَعَّلْتَ» من «أَكَل»، والتضعيف للتعدية مع التكثير: جعلتها تأكل كثيرًا."
  - "«تَبْتَهِل» على «تَفْتَعِل» من «بَهَل»، و«تَعُوذ» مضارع «عاذ» الأجوف الواوي."
rhetoric:
  thesis: "يكشف الشاعر تناقض يَزِيد: هو الذي أشعل الحرب، ثم يقف بعيدًا يتعوّذ منها كأنها جاءت من غيره."
  devices:
    - title: "الاستعارة"
      text: "في «أَكَّلْتَهَا حَطَبًا» شبّه الحرب بالنار، ثم حذف النار وأبقى من لوازمها الحطب والأكل. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. فلم يقل إن الحرب كالنار، بل جعل يزيد يطعمها الحطب."
    - title: "السخرية"
      text: "صورة الرجل الذي يوقد النار ثم يقعد يتعوذ منها ويبتهل إلى الله أن يقيه شرها صورة ساخرة: الشاعر يحمّله فعله، ويسخر من تضرّعه. وهي قراءتنا."
    - title: "إضمار الحرب"
      text: "لم يذكر الحرب باسمها في البيت كله، بل بضمير في «أَكَّلْتَهَا» و«شَرِّهَا»، فكأنها حاضرة لا تحتاج إلى تسمية."
  connection: "ثم يدعوه إلى أن يسأل القبائل عن بأس قومه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَا تَقْعُدَنْ / نَ وَقَدْ / أَكْكَلْتَهَا / حَطَبَنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — تَعُوذُ مِنْ / شَرْرِهَا / يَوْمَنْ وَتَبْ / تَهِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من الصدر فصارت «فعِلن»، و«مستفعلن» الأولى من العَجُز فصارت «متفعلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 52 في الديوان، بلفظه [@diwan-asha، ص97]. ويلخصه محققه: «أجّجت نار الفتنة وأمددتها بالحطب لتزيد فى التهابها، ثم تقعد بعيدًا عنها مستعيذًا من شرها، مبتهلا إلى الله أن لا ينالك أذاها» [@diwan-asha، ص96]."
