first: "أَصَابَهُ هِنْدُوَانِيٌّ فَأَقْصَدَهُ"
second: "أَوْ ذَابِلٌ مِنْ رِمَاحِ الْخَطِّ مُعْتَدِلُ"
meaning: "أصاب ذلك السيدَ سيفٌ هنديّ فقتله في مكانه، أو رمحٌ لدنٌ مستقيم من رماح الخطّ. ويلخصه محقق الديوان: عميد القوم «صريع السيوف والرماح» [@diwan-asha، ص98]."
vocabulary:
  - term: "هِنْدُوَانِيٌّ"
    text: "سيف منسوب إلى الهند. في اللسان: «وَسَيْفٌ هِنْدُوانيٌّ، بِكَسْرِ الْهَاءِ، وإِن شِئْتَ ضَمَمْتَهَا إِتباعاً لِلدَّالِ» [@lisan، ج3 ص438]."
  - term: "أَقْصَدَهُ"
    text: "قتله مكانه. في اللسان: «وأَقصَد السهمُ أَي أَصاب فَقَتَلَ مكانَه» [@lisan، ج3 ص356]."
  - term: "ذَابِلٌ"
    text: "رمح دقيق ليّن لا يابس."
  - term: "الْخَطِّ"
    text: "موضع تُنسب إليه الرماح. في اللسان: «والخَطُّ سِيفُ البَحْرَينِ وعُمانَ»، «وَقِيلَ: الخَطُّ مَرْفَأُ السفُن بِالْبَحْرَيْنِ تُنْسب إِليه الرِّمَاحُ» [@lisan، ج7 ص290]، والسِّيف: ساحل البحر."
syntax:
  - "جملة «أَصَابَهُ هِنْدُوَانِيٌّ» استئناف يبيّن سبب صرعة العميد في البيت السابق. والهاء مفعول به، و«هِنْدُوَانِيٌّ» فاعل، والموصوف محذوف: سيفٌ هندوانيّ. و«فَأَقْصَدَهُ» معطوف بالفاء الدالة على التعقيب."
  - "«أَوْ ذَابِلٌ» معطوف على «هِنْدُوَانِيٌّ»، و«أو» للتقسيم. و«مِنْ رِمَاحِ الْخَطِّ» متعلق بمحذوف صفة لـ«ذَابِلٌ»، و«مُعْتَدِلُ» صفة ثانية."
morphology:
  - "«هِنْدُوَانِيّ» اسم منسوب إلى الهند، زيدت فيه الواو والألف والنون على غير قياس."
  - "«أَقْصَدَ» على «أَفْعَلَ» من «قَصَد»، و«ذَابِل» اسم فاعل من «ذَبَل»، و«مُعْتَدِل» اسم فاعل من «اعْتَدَلَ» على «افْتَعَلَ»."
rhetoric:
  thesis: "يكمل صورة العميد الصريع بأداة صرعه: سيف أو رمح. وكلاهما من أجود ما عرفته العرب، فالقاتل فارس مسلّح بأكرم السلاح."
  devices:
    - title: "حذف الموصوف"
      text: "قال «هِنْدُوَانِيٌّ» و«ذَابِلٌ» ولم يذكر السيف والرمح، فاكتفى بالصفة لأنها لا تكون إلا لهما. وهذا من الحذف الذي يقول فيه عبد القاهر الجُرْجانيّ: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "التقسيم"
      text: "التقسيم أن يستوفي المتكلم أقسام الشيء. وفي «أَصَابَهُ هِنْدُوَانِيٌّ ... أَوْ ذَابِلٌ» قسّم أسباب الموت بين السيف والرمح، فلا نجاة له من أحدهما، وكأن الشاعر لا يعنيه بأيهما مات."
    - title: "الفاء في «فأقصده»"
      text: "جعل القتل يعقب الإصابة بلا مهلة: «أَصَابَهُ ... فَأَقْصَدَهُ»، فالضربة لا تحتاج إلى ثانية."
  connection: "ثم يردّ على زعم بني شيبان أن قومه لا يقاتلونهم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "أَصَابَهُو / هِنْدُوَا / نِيْيُنْ فَأَقْ / صَدَهُو = متفعلن / فاعلن / مستفعلن / فعِلن — أَوْ ذَابِلُنْ / مِنْ رِمَا / حِلْخَطْطِ مُعْ / تَدِلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "تُشبع ضمة الهاء في «أَصَابَهُ» فتُنطق «أَصَابَهُو». ودخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 59 في الديوان، بلفظه [@diwan-asha، ص97]، ويقول محققه: «هندوانى سيف منسوب الى الهند. أقصده أصابه فلم يخطئه. الخط بلد فى البحرين تجلب منها الرماح» [@diwan-asha، ص97]. ولم يشرحه التِّبْرِيزِيّ بشيء [@tabrizi-ashr، ص306]، وأنشده البَغْداديّ في أبيات القسم [@khizana، ج9 ص454]."
