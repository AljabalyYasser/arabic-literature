first: "قَالَتْ هُرَيْرَةُ لَمَّا جِئْتُ زَائِرَهَا"
second: "وَيْلِي عَلَيْكَ وَوَيْلِي مِنْكَ يَا رَجُلُ"
meaning: "قالت هُرَيْرَة حين جئتها زائرًا: الويل لي خوفًا عليك، والويل لي خوفًا منك يا رجل. ويفهمه شوقي ضَيْف إشفاقًا منها: «فقد بالغ في وصف ارتياعها وخوفها على نفسها وعليه، حتى إنها لتتفجع وتتوجع إشفاقا وضعفا» [@deif، ج1 ص362]. ويفهمه محقق الديوان صدًّا، فيلخصه على لسان الشاعر: «فلقيتني لقاء خشنا جافيا، إذ جئتك زائرا» [@diwan-asha، ص94]."
vocabulary:
  - term: "زَائِرَهَا"
    text: "قاصدًا إليها في بيتها."
  - term: "وَيْلِي"
    text: "كلمة تقال عند الخوف والمصيبة. وفي اللسان: «ويل: كلمة مثل ويح إلا أنها كلمة عذاب» [@lisan، ج11 ص737]."
syntax:
  - "«لَمَّا» ظرف بمعنى «حين»، وجملة «جِئْتُ» في محل جر بإضافته إليها، وجوابها «قَالَتْ» المتقدم."
  - "قال التِّبْرِيزِيّ: «زائرها: منصوب على الحال، يقدَّر فيه الانفصال، كأنه قال: زائرا لها» [@tabrizi-ashr، ص295]، أي إن إضافته إلى الضمير لا تجعله معرفة، فيصح أن يكون حالًا، والحال لا تكون إلا نكرة."
  - "«وَيْلِي عَلَيْكَ»: «وَيْلِي» مبتدأ، و«عَلَيْكَ» خبره، ومثله «وَوَيْلِي مِنْكَ». والجملتان مقول القول."
  - "«يَا رَجُلُ» قال فيه التِّبْرِيزِيّ: «بمعنى يا أيها الرجل، ويجوز في غير هذا الشعر النصب على إنه نكرة، إلا أن الرفع أجود» [@tabrizi-ashr، ص295]، أي إنه نكرة مقصودة مبنية على الضم."
morphology:
  - "«زَائِر» اسم فاعل من «زارَ يزور» الأجوف الواوي، قُلبت عينه همزة في اسم الفاعل."
  - "«وَيْل» مصدر لا فعل له من لفظه، يضاف إلى الضمير فيقال: ويلي، وويلك، وويله."
rhetoric:
  thesis: "هو البيت الذي قال فيه الشَّعْبِيّ إن الأَعْشَى «أخنث الناس في بيت» [@aghani-dk، ج9 ص112]، ويريد بالأخنث الأرقّ والألين حتى يشبه كلام النساء. فالبيت كله كلام هُرَيْرَة بلفظها."
  devices:
    - title: "حكاية القول"
      text: "ترك الشاعر هُرَيْرَة تتكلم بصوتها في العجز كله: «وَيْلِي عَلَيْكَ وَوَيْلِي مِنْكَ يَا رَجُلُ». فيسمع القارئ امرأة تتفجع، لا شاعرًا يصفها."
    - title: "التكرار مع اختلاف الحرف"
      text: "كرر «وَيْلِي» وغيّر الحرف بعدها: «عَلَيْكَ» ثم «مِنْكَ». فالأولى خوف عليه، والثانية خوف منه. وبحرفين صغيرين جمع شعورين متناقضين في امرأة واحدة."
    - title: "النداء بالنكرة"
      text: "في «يَا رَجُلُ» تناديه كما تنادي غريبًا لا تعرف اسمه. وفي ذلك صدى للمطلع: «أَيُّهَا الرَّجُلُ»، فالقصيدة تبدأ بمخاطبته نفسه بـ«الرجل»، وهنا تخاطبه هُرَيْرَة بـ«رجل»."
  connection: "ثم يردّ عليها: إن رأيتنا حفاة فهكذا حالنا."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "قَالَتْ هُرَيْ / رَةُ لَمْ / مَا جِئْتُ زَا / ئِرَهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — وَيْلِي عَلَيْ / كَ وَوَيْ / لِي مِنْكَ يَا / رَجُلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "آخر مقطع الصدّ. ومن الأبيات التي غُنّيت، فللغَرِيض فيه لحن، ولمحمد بن حسن بن مُصْعَب [@aghani-dk، ج9 ص153]. ويختم به شوقي ضَيْف حديثه عن غزل الأَعْشَى، ويرى أنه يمتاز «بأنه حسى مادى ومن ناحية أخرى برقته المفرطة» [@deif، ج1 ص362]."
