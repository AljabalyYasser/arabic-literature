first: "وَبَلْدَةٍ مِثْلِ ظَهْرِ التُّرْسِ مُوحِشَةٍ"
second: "لِلْجِنِّ بِاللَّيْلِ فِي حَافَاتِهَا زَجَلُ"
meaning: "ورُبَّ أرضٍ واسعة مستوية جرداء كظهر التُّرْس، خالية من الناس، تُسمع في نواحيها بالليل أصواتٌ مختلطة يُظن أنها أصوات الجن. والجملة لا تتم هنا: فهي تتم في البيت 35 بقوله «جاوزتُها»، أي: رُبَّ فلاةٍ هذه صفتها قطعتُها."
vocabulary:
  - term: "بَلْدَةٍ"
    text: "الأرض الواسعة، والمراد الفلاة. في لسان العرب: «وكل بلد واسع: بلدة، قال الأعشى يذكر الفلاة» ثم أنشد هذا البيت [@lisan، ج3 ص96]."
  - term: "التُّرْسِ"
    text: "«التُّرْس من السلاح: المتوقّى بها» [@lisan، ج6 ص32]، أي الذي يتقي به المقاتل الضرب والطعن."
  - term: "مُوحِشَةٍ"
    text: "خالية من أهلها. «وأوحش المكان من أهله وتوحّش: خلا وذهب عنه الناس» [@lisan، ج6 ص368]."
  - term: "حَافَاتِهَا"
    text: "نواحيها، جمع حافة. «وحافة كل شيء: ناحيته» [@lisan، ج9 ص60]."
  - term: "زَجَلُ"
    text: "صوت عالٍ مختلط. «والزَّجَل، بالتحريك: اللعب والجلبة ورفع الصوت» [@lisan، ج11 ص302]."
syntax:
  - "الواو في «وَبَلْدَةٍ» واو رُبَّ: تُحذف رُبَّ بعدها ويبقى عملها، فجُرّ «بلدةٍ» بها. و«بلدة» مجرورة لفظًا مرفوعة محلًّا بالابتداء، وخبرها جملة «جاوزتُها» في البيت 35."
  - "«مِثْلِ ظَهْرِ التُّرْسِ» نعت لـ«بلدةٍ»، و«مِثْل» لا تتعرف بالإضافة فجاز أن تكون نعتًا للنكرة. و«مُوحِشَةٍ» نعت ثانٍ."
  - "«لِلْجِنِّ ... زَجَلُ» جملة اسمية نعت ثالث لـ«بلدة»: «زَجَلُ» مبتدأ مؤخر، و«لِلْجِنِّ» خبر مقدم، و«بِاللَّيْلِ» و«فِي حَافَاتِهَا» متعلقان بالخبر."
morphology:
  - "«بَلْدَة» على «فَعْلَة» من «بَلَد»، وكلاهما للأرض الواسعة كما في اللسان [@lisan، ج3 ص96]."
  - "«مُوحِشَة» اسم فاعل من «أَوْحَشَ» على «أَفْعَلَ»: أوحش المكانُ إذا خلا من الناس [@lisan، ج6 ص368]."
  - "«حَافَات» جمع «حافَة» جمعَ مؤنث سالمًا، وألفها منقلبة عن ياء، ويُجمع أيضًا على «حِيَف» [@lisan، ج9 ص60]."
rhetoric:
  thesis: "انتهى حديث اللهو بالبيت 32، فانتقل الشاعر إلى صورة الرجل الصبور على السفر: فلاة جرداء لا يقطعها إلا الخبير، يبدأ بها ثلاثة أبيات لا تتم جملتها إلا في آخرها."
  devices:
    - title: "التشبيه"
      text: "في «مِثْلِ ظَهْرِ التُّرْسِ» شبّه الفلاة بظهر التُّرْس. وهو تشبيه حسي يُدرك بالعين، من الضرب الذي يقول فيه عبد القاهر الجُرْجانيّ إنه «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]، أي لا يحتاج إلى إعمال فكر. واختلف المحدثون في وجه الشبه: يقول محقق الديوان إنه شبّهها به «في انبساطها وإقفارها لأنها لا شيء فوق ظهرها» [@diwan-asha، ص95]، ويرى شوقي ضَيْف أنه شبّهها به «لبيان أنها غليظة وصعبة على من ينفذ فيها» [@deif، ج1 ص353]."
    - title: "عزيف الجن"
      text: "في «لِلْجِنِّ بِاللَّيْلِ فِي حَافَاتِهَا زَجَلُ» جعل أصوات الفلاة بالليل أصوات جن. وهي صورة يطرقها الجاهليون في وصف الصحراء، ويقول شوقي ضَيْف إن الأعشى يصوّر فيها «وحشتها وعزيف الجن ليلا بها» [@deif، ج1 ص353]. فالخطر في الفلاة مسموع لا مرئي، والوحشة فيها مضاعفة بالليل."
    - title: "واو رُبَّ"
      text: "بدأ بـ«وَبَلْدَةٍ» نكرةً بعد واو رُبَّ، فلم يقل أي فلاة، بل جعلها واحدة من فلوات كثيرة قطعها. وفي هذا فخر: ما يصفه عادة عنده لا حادثة واحدة."
  connection: "ثم يزيد في صفتها: لا يجرؤ على ركوبها في القيظ إلا الخبير."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَبَلْدَتِنْ / مِثْلِ ظَهْ / رِتْتُرْسِ مُو / حِشَتِنْ = متفعلن / فاعلن / مستفعلن / فعِلن — لِلْجِنْنِ بِلْ / لَيْلِ فِي / حَافَاتِهَا / زَجَلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن»، كما يلتزم البسيط التام [@atiq، ص46–48]."
context: "أول مقطع الفلاة والناقة (33–35) في ترتيب التِّبْرِيزِيّ، وفيه يخرج الشاعر من ذكر اللهو إلى ذكر الصبر على السفر. وفي الديوان تأتي الأبيات الثلاثة نفسها بعد مقطع السحاب، وقبل أبيات اللهو والحانوت (31–33 فيه) [@diwan-asha، ص95]. ويرى شوقي ضَيْف أن الأعشى يجري في وصف الصحراء وناقته «على عادة الجاهليين»، وأنه يفخر في هذه الأبيات «بتحمله لمشقات السفر» [@deif، ج1 ص353]."
variants:
  - reading: "لِلْجِنِّ بِاللَّيْلِ فِي حَافَاتِهَا شُعَلُ"
    status: "رواية لسان العرب"
    note: "[@lisan، ج3 ص96]. و«شُعَلُ» قافية البيت 36 عند التِّبْرِيزِيّ، فبهذه الرواية تتكرر القافية بعد ثلاثة أبيات."
