first: "يَكَادُ يَصْرَعُهَا لَوْلَا تَشَدُّدُهَا"
second: "إِذَا تَقُومُ إِلَى جَارَاتِهَا الْكَسَلُ"
meaning: "إذا قامت لتزور جاراتها كاد الكسل يُسقطها لولا أنها تتماسك وتتكلف الشدة. قال التِّبْرِيزِيّ: «يقول: لولا إنها تشددت إذا قامت لسقطت» [@tabrizi-ashr، ص290]."
vocabulary:
  - term: "يَصْرَعُهَا"
    text: "يطرحها على الأرض، من الصَّرْع."
  - term: "تَشَدُّدُهَا"
    text: "تكلّفها الشدة والتماسك."
  - term: "الْكَسَلُ"
    text: "التثاقل عن الحركة."
syntax:
  - "«يَكَادُ» فعل من أفعال المقاربة، واسمه «الْكَسَلُ» مؤخَّر إلى آخر البيت، وجملة «يَصْرَعُهَا» خبره."
  - "قال التِّبْرِيزِيّ: «و (إذا) في موضع نصب، والعامل فيه (يصرعها)» [@tabrizi-ashr، ص290]، أي إن «إذا» ظرف متعلق بـ«يَصْرَعُهَا»."
  - "«لَوْلَا» حرف امتناع لوجود، و«تَشَدُّدُهَا» مبتدأ خبره محذوف وجوبًا تقديره: موجود. وجوابها محذوف يدل عليه ما قبلها، أي: لولا تشددها لصرعها."
morphology:
  - "«تَشَدُّد» مصدر «تَشَدَّدَ» على «تفعّل»، وهو بناء يدل على التكلف: تحمل نفسها على الشدة وليست من طبعها."
  - "«جَارَات» جمع مؤنث سالم لـ«جارة»، و«الْكَسَل» مصدر «كَسِلَ يَكْسَلُ»."
rhetoric:
  thesis: "الكسل هنا مديح لا ذم: هي مترفة ممتلئة لم تعتد العمل، فقيامها نفسه جهد. ويلخص محقق الديوان ذلك بأنها «كانت كريمة العنصر مترفة، لم تتعود الكد والكدح» [@diwan-asha، ص90]."
  devices:
    - title: "المجاز العقلي"
      text: "في «يَكَادُ يَصْرَعُهَا ... الْكَسَلُ» أسند الصرع إلى الكسل، والكسل لا يصرع أحدًا، فجعله كالمصارع القوي الذي يكاد يطرحها أرضًا. والمجاز العقلي أن يُسند الفعل إلى غير فاعله الحقيقي لصلة بينهما."
    - title: "تأخير الفاعل"
      text: "أخّر «الْكَسَلُ» إلى القافية، وجعل بينه وبين فعله «لَوْلَا تَشَدُّدُهَا» و«إِذَا تَقُومُ إِلَى جَارَاتِهَا». فيبقى السامع يسأل: ما الذي يكاد يصرعها؟ حتى تأتي الكلمة الأخيرة، وهي أهون مما توقّع."
  connection: "ثم يصفها إذا لاعبت صاحبةً لها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "يَكَادُ يَصْ / رَعُهَا / لَوْلَا تَشَدْ / دُدُهَا = متفعلن / فعِلن / مستفعلن / فعِلن — إِذَا تَقُو / مُ إِلَى / جَارَاتِهَلْ / كَسَلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية فيهما فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يجمع البيت بين الجوار والجسد: فهي تقوم إلى جاراتها كما خرجت من بيت جارتها في البيت 3، ويظهر في قيامها ما وصفه من امتلاء: صفر الوشاح ملء الدرع في البيت 8."
