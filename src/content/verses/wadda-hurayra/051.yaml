first: "سَائِلْ بَنِي أَسَدٍ عَنَّا فَقَدْ عَلِمُوا"
second: "أَنْ سَوْفَ يَأْتِيكَ مِنْ أَنْبَائِنَا شَكَلُ"
meaning: "سَلْ بني أسد عنا، فقد عرفوا بالتجربة أنه سيأتيك من أخبارنا خبرٌ بعد خبر. قال التِّبْرِيزِيّ: «شكل: أي أزواج، خبر ثم خبر، وشكل: اختلاف» [@tabrizi-ashr، ص303]، أي أخبار متتابعة متنوعة من وقائعنا."
vocabulary:
  - term: "سَائِلْ"
    text: "اسأل."
  - term: "أَنْبَائِنَا"
    text: "أخبارنا، جمع نبأ."
  - term: "شَكَلُ"
    text: "«أي أزواج، خبر ثم خبر، وشكل: اختلاف» [@tabrizi-ashr، ص303]. ويقول شوقي ضَيْف: «شكل: أزواج مختلفة يريد خبرا من بعد خبر» [@deif، ج1 ص352]."
syntax:
  - "«سَائِلْ» فعل أمر، و«بَنِي» مفعول به منصوب بالياء لأنه ملحق بجمع المذكر السالم، و«عَنَّا» متعلق بـ«سَائِلْ». والفاء في «فَقَدْ عَلِمُوا» للتعليل."
  - "«أَنْ» مخففة من الثقيلة، واسمها ضمير الشأن محذوف، وجملة «سَوْفَ يَأْتِيكَ ... شَكَلُ» خبرها، والمصدر المؤول سدّ مسدّ مفعولي «عَلِمُوا». قال التِّبْرِيزِيّ: «و (أنْ) هذه التي تعمل في الأسماء خُففت، و (سوف) عوض، والمعنى إنه سوف يأتيك، ولا يجوز إلا هذا مع سوف والسين» [@tabrizi-ashr، ص303]، أي إن «سوف» فصلت بين «أن» المخففة والفعل، فعوّضت عن تخفيفها."
  - "«شَكَلُ» فاعل «يَأْتِيكَ» مؤخر، و«مِنْ أَنْبَائِنَا» متعلق بمحذوف حال منه، وكان صفة له فلما تقدم صار حالًا."
morphology:
  - "«سَائِلْ» أمر من «سَاءَلَ» على «فَاعَلَ»، والمفاعلة هنا للمبالغة في السؤال."
  - "«أَنْبَاء» جمع «نَبَأ» على «أَفْعَال»، و«شَكَل» على «فَعَل»."
  - "«أَنْ» المخففة أصلها «أَنَّ»، فإذا خُففت ووليها فعل فُصل بينهما بـ«سوف» أو السين أو «قد» أو النفي."
rhetoric:
  thesis: "ينتقل الشاعر من لوم يَزِيد إلى الفخر: لا يحدّثه عن بأس قومه بنفسه، بل يحيله إلى شهود من القبائل التي جرّبتهم. ويقول شوقي ضَيْف إن الأَعْشَى كثيرًا ما يضمّن هجاءه لمن يختلف معهم من قبيلته الكبرى بكر «فخرا مدويا»، ويمثّل بهذه الأبيات التي يتوعد فيها يَزِيد «ومفتخرا بشجاعة قبيلته وما أثخنت فى القبائل من جراح» [@deif، ج1 ص352]."
  devices:
    - title: "الاستشهاد بالخصوم"
      text: "قال «سَائِلْ بَنِي أَسَدٍ عَنَّا»، فجعل الشاهد على بأس قومه من حاربوهم. وشهادة الخصم أقوى من دعوى صاحبها."
    - title: "الوعيد المضمر"
      text: "«سَوْفَ يَأْتِيكَ مِنْ أَنْبَائِنَا شَكَلُ» خبر في لفظه، ووعيد في معناه: ما أصاب بني أسد سيأتيك خبره، وقد يكون الخبر عنك. و«سَوْفَ» تمدّ الوعيد في المستقبل."
  connection: "ثم يزيد في عدد الشهود: قُشَيْر وعبد الله وربيعة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "سَائِلْ بَنِي / أَسَدِنْ / عَنْنَا فَقَدْ / عَلِمُو = مستفعلن / فعِلن / مستفعلن / فعِلن — أَنْ سَوْفَ يَأْ / تِيكَ مِنْ / أَنْبَائِنَا / شَكَلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من الصدر فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 54 في الديوان، بلفظه [@diwan-asha، ص97]. ويقول محققه إن الأَعْشَى هنا «يعدد القبائل التى عادوها من قبل فقهروها، منهم أسد (بن ربيعة)» [@diwan-asha، ص96]، فيجعل بني أسد من ربيعة، ولم نجد عند التِّبْرِيزِيّ ما يحدّدهم."
variants:
  - reading: "أَنْ سَوْفَ يَأْتِيكَ مِنْ أَيَّامِنَا شَكَلُ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "قال: «ويروى (من أيامنا شكل) أي من أيامنا المتقدمات وما فيها من الحروب» [@tabrizi-ashr، ص303]، والأيام هنا الوقائع."
