first: "لَهُ رِدَافٌ وَجَوْزٌ مُفْأَمٌ عَمِلٌ"
second: "مُنَطَّقٌ بِسِجَالِ الْمَاءِ مُتَّصِلُ"
meaning: "لهذا السحاب مؤخِّرٌ من سحاب آخر يتبعه، ووسطٌ عظيم واسع، دائم البرق، تحيط به دِلاء الماء إحاطة المنطقة بالخصر، متصلٌ لا فُرَج فيه. وفسّر التِّبْرِيزِيّ ألفاظه كلها: «رداف: أي سحاب قد ردفه من خلفه، وجوز كل شيء: وسطه، والمُفأم: العظيم الواسع، وعمل: دائم البرق، ومُنطق: أي قد أحاط به فصار بمنزلة المنطقة، وقوله (متصل) أي ليس فيه خلل» [@tabrizi-ashr، ص300]."
vocabulary:
  - term: "رِدَافٌ"
    text: "«سحاب قد ردفه من خلفه» [@tabrizi-ashr، ص300]، أي تبعه. وأصل الرِّدْف: الراكب خلف الراكب."
  - term: "جَوْزٌ"
    text: "«وجوز كل شيء: وسطه» [@tabrizi-ashr، ص300]."
  - term: "مُفْأَمٌ"
    text: "«العظيم الواسع» [@tabrizi-ashr، ص300]. وفي اللسان: «أفأمت الرحل والقتب إذا وسّعته وزدت فيه» [@lisan، ج12 ص447]."
  - term: "عَمِلٌ"
    text: "«دائم البرق» [@tabrizi-ashr، ص300]. وفي اللسان: «وعَمِلَ البَرْقُ عَمَلًا، فَهُوَ عَمِلٌ: دامَ» [@lisan، ج11 ص477]."
  - term: "مُنَطَّقٌ"
    text: "محاط به كما تحيط المِنْطَقة بالوسط، والمنطقة: ما يُشدّ على الخصر."
  - term: "سِجَالِ"
    text: "جمع سَجْل، وهو الدلو الملأى ماءً."
syntax:
  - "«لَهُ رِدَافٌ» جملة اسمية: «رِدَافٌ» مبتدأ مؤخر، و«لَهُ» خبر مقدم، والضمير يعود على «عَارِضًا» في البيت السابق. و«جَوْزٌ» معطوف على «رِدَافٌ»، و«مُفْأَمٌ» و«عَمِلٌ» صفتان لـ«جَوْزٌ»."
  - "«مُنَطَّقٌ» و«مُتَّصِلُ» خبران لمبتدأ محذوف تقديره: هو منطَّق، أي العارض. و«بِسِجَالِ الْمَاءِ» متعلق بـ«مُنَطَّقٌ»."
morphology:
  - "«مُفْأَم» اسم مفعول من «أَفْأَمَ» على «أَفْعَلَ»، و«مُنَطَّق» اسم مفعول من «نَطَّقَ» على «فَعَّلَ»، و«مُتَّصِل» اسم فاعل من «اتَّصَلَ» على «افْتَعَلَ»، أصله «مُوْتَصِل» قُلبت الواو تاءً وأُدغمت في تاء الافتعال."
  - "«عَمِل» صفة على «فَعِل» تدل على الملازمة، كـ«فَرِح»."
  - "«سِجَال» جمع «سَجْل» على «فِعَال»، كـ«كِلاب» جمع «كَلْب»."
rhetoric:
  thesis: "يصف السحاب كأنه جسد: له ردف ووسط ومنطقة. فالبيت كله صورة واحدة لجسم عظيم ممتلئ ماءً."
  devices:
    - title: "الاستعارة"
      text: "في «مُنَطَّقٌ بِسِجَالِ الْمَاءِ» جعل للسحاب منطقة من دلاء الماء. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. فقد شبّه ما يحيط بالسحاب من الماء بالمنطقة، ولم يذكر التشبيه، بل أعار السحاب صفة «مُنَطَّق»."
    - title: "تشخيص السحاب"
      text: "«رِدَافٌ» و«جَوْزٌ» و«مُنَطَّقٌ» ألفاظ تُقال للأجسام: الرِّدف لما خلف الراكب، والجوز للوسط، والمنطقة للخصر. فصار السحاب كائنًا ضخمًا يتهادى، وهي قراءتنا."
    - title: "تتابع الصفات"
      text: "سرد الصفات بلا رابط: «مُفْأَمٌ عَمِلٌ ... مُنَطَّقٌ ... مُتَّصِلُ»، فتتراكم في البيت كما يتراكم السحاب."
  connection: "ثم يقول إنه لم يشغله عن مراقبة هذا السحاب شيء."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَهُو رِدَا / فُنْ وَجَوْ / زُنْ مُفْأَمُنْ / عَمِلُنْ = متفعلن / فاعلن / مستفعلن / فعِلن — مُنَطْطَقُنْ / بِسِجَا / لِلْمَاءِ مُتْ / تَصِلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "تُشبع ضمة الهاء في «لَهُ» فتُنطق «لَهُو». ودخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 23 في الديوان، بلفظه [@diwan-asha، ص93]. ويفسر محقق الديوان «مفأم» بقوله: «ممتلىء بالماء»، و«السجال» بأنها «جمع سجل (بفتح السين) وهو الدلو» [@diwan-asha، ص93]."
