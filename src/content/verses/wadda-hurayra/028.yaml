first: "لَا يَسْتَفِيقُونَ مِنْهَا وَهْيَ رَاهِنَةٌ"
second: "إِلَّا بِهَاتِ وَإِنْ عَلُّوا وَإِنْ نَهِلُوا"
meaning: "لا يفيقون من الخمر وهي حاضرة عندهم دائمًا، إلا بمقدار ما يقولون للساقي: هات، سواء شربوا الشربة الأولى أو الثانية. قال التِّبْرِيزِيّ: «لا يستفيقون: أي شربهم دائم ليس لهم وقت معلوم يشربون فيه»، وقال: «وقوله (إلا بهات) أي بقولهم هات، أي إذا أبطأ عليهم الساقي قالوا: هات» [@tabrizi-ashr، ص298]."
vocabulary:
  - term: "رَاهِنَةٌ"
    text: "«والراهنة: الدائمة، وقيل: المُعدة» [@tabrizi-ashr، ص298]. وفي اللسان: «وراهنة في البيت: دائمة ثابتة» [@lisan، ج13 ص190]."
  - term: "عَلُّوا"
    text: "شربوا الشربة الثانية. قال شوقي ضَيْف: «علوا: من العلل وهو الشرب بعد الشرب تباعا» [@deif، ج1 ص356]."
  - term: "نَهِلُوا"
    text: "شربوا الشربة الأولى. «نهلوا: من النهل، وهو أول الشرب» [@deif، ج1 ص356]."
syntax:
  - "«لَا يَسْتَفِيقُونَ» فعل مضارع منفي، والواو فاعل، و«مِنْهَا» متعلق به، وجملة «وَهْيَ رَاهِنَةٌ» حال."
  - "«إِلَّا بِهَاتِ» استثناء مفرغ: لا يستفيقون إلا بقول «هات». و«هاتِ» كلمة محكية بلفظها، في موضع جر بالباء."
  - "«وَإِنْ عَلُّوا وَإِنْ نَهِلُوا»: «إنْ» شرطية حُذف جوابها لدلالة ما قبله عليه، والتقدير: وإن علّوا وإن نهلوا لا يستفيقون إلا بهات."
morphology:
  - "«يَسْتَفِيقُونَ» مضارع «اسْتَفَاقَ» على «استفعل» من «أفاق»، وأصل العين واو قُلبت ياء."
  - "«هاتِ» فعل أمر جامد لا ماضي له، ومعناه: أعطِ."
  - "«عَلُّوا» من «عَلَّ يَعِلُّ» المضعف، و«نَهِلُوا» من «نَهِلَ يَنْهَلُ»، و«رَاهِنَة» اسم فاعل من «رَهَنَ» إذا دام وثبت."
rhetoric:
  thesis: "لا يُسمع في مجلسهم إلا كلمة واحدة: هات. ويصفهم شوقي ضَيْف: «وهم لا يسأمون من تعاطيها ولا يفيقون من شربها إلا ليقولوا للساقى: هات، ويكررون هذه اللفظة مهما شربوا» [@deif، ج1 ص356]."
  devices:
    - title: "حكاية الكلمة"
      text: "في «إِلَّا بِهَاتِ» أدخل الكلمة نفسها التي يقولونها في البيت، فيسمع القارئ صوت المجلس. ولم يقل: إلا بطلب الخمر."
    - title: "القصر بالنفي والاستثناء"
      text: "«لَا يَسْتَفِيقُونَ ... إِلَّا بِهَاتِ» قصرٌ: نفى عنهم الإفاقة كلها ثم استثنى منها لحظة واحدة، فجعلها أقصر ما يكون."
    - title: "الطباق"
      text: "جمع بين «عَلُّوا» و«نَهِلُوا»: الشربة الثانية والأولى، فالحكم يشمل الشرب كله من أوله."
  connection: "ثم يصف الساقي الذي يطوف بها عليهم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَا يَسْتَفِي / قُونَ مِنْ / هَا وَهْيَ رَا / هِنَتُنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — إِلْلَا بِهَا / تِ وَإِنْ / عَلْلُو وَإِنْ / نَهِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية من العجز فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]. وسكّن الهاء في «وَهْيَ» كما تُسكّن بعد الواو، ليستقيم الوزن."
context: "استشهد به اللسان على «راهنة» بمعنى الدائمة، ونقل عن أبي عَمْرو أنه أنشده «للأعشى يصف قوما يشربون خمرا لا تنقطع» [@lisan، ج13 ص190]. وفي نسخة الشاملة للتِّبْرِيزِيّ «وَإِنَ عَلُّوا» بالفتح، وهو خطأ في الطبع."
variants:
