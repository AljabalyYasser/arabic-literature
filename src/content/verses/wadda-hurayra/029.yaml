first: "يَسْعَى بِهَا ذُو زُجَاجَاتٍ لَهُ نَطَفٌ"
second: "مُقَلِّصٌ أَسْفَلَ السِّرْبَالِ مُعْتَمِلُ"
meaning: "يطوف بالخمر عليهم ساقٍ معه زجاجات، في أذنيه أقراط، قد شمّر أسفل قميصه، دائب على العمل نشيط. ويصفه شوقي ضَيْف: «ويصف الساقى بأنه غلام أو شاب حدث، كان يعلق في أذنه قرطا ويلبس قميصا قصيرا، وقد طبع على العمل بجد ونشاط» [@deif، ج1 ص356]."
vocabulary:
  - term: "يَسْعَى بِهَا"
    text: "يطوف بالخمر ويديرها."
  - term: "نَطَفٌ"
    text: "أقراط. قال التِّبْرِيزِيّ: «النطف: القرطة، وقيل: اللؤلؤ العظام» [@tabrizi-ashr، ص298]. وفي اللسان: «والنطفة، بالتحريك: القرط. وغلام منطف: مقرط» [@lisan، ج9 ص335]."
  - term: "مُقَلِّصٌ"
    text: "«ومُقلص: مشمر» [@tabrizi-ashr، ص298]، أي رافع ثوبه."
  - term: "السِّرْبَالِ"
    text: "«والسربال: القميص» [@tabrizi-ashr، ص298]."
  - term: "مُعْتَمِلُ"
    text: "«ومعتمل: دائب نشيط» [@tabrizi-ashr، ص298]."
syntax:
  - "«يَسْعَى» فعل مضارع، و«بِهَا» متعلق به، و«ذُو» فاعل مرفوع بالواو، و«زُجَاجَاتٍ» مضاف إليه، وجملة «لَهُ نَطَفٌ» صفة لـ«ذُو»."
  - "«مُقَلِّصٌ» صفة ثانية لـ«ذُو»، وهو اسم فاعل عمل عمل فعله فنصب «أَسْفَلَ» مفعولًا به. قال التِّبْرِيزِيّ: «ويجوز نصب مقلص على الحال من المضمر الذي في له، والرفع أجود» [@tabrizi-ashr، ص298]."
  - "«مُعْتَمِلُ» صفة ثالثة."
morphology:
  - "«مُقَلِّص» اسم فاعل من «قَلَّصَ» على «فعّل»، و«مُعْتَمِل» اسم فاعل من «اعْتَمَلَ» على «افتعل»، وفي زيادة التاء معنى الاجتهاد في العمل."
  - "«نَطَف» جمع «نَطَفَة» على «فَعَل»، و«زُجَاجَات» جمع «زُجاجة» جمعًا مؤنثًا سالمًا."
rhetoric:
  thesis: "بعد الشاربين والخمر، صورة الساقي: غلام مقرَّط مشمّر نشيط. والأقراط في أذن الغلام من علامات الترف الحضري في مجالس الخمر."
  devices:
    - title: "التعريف بالصفة"
      text: "لم يسمّه الساقي، بل «ذُو زُجَاجَاتٍ»: عرّفه بما يحمل. وفهم شوقي ضَيْف ذلك فقال: «ذو زجاجات: يريد الساق» [@deif، ج1 ص356]."
    - title: "الكناية"
      text: "«مُقَلِّصٌ أَسْفَلَ السِّرْبَالِ» كناية عن الخفة والاستعداد للخدمة: من شمّر ثوبه تهيأ للعمل والسعي. والكناية عند عبد القاهر الجُرْجانيّ أن يُجاء إلى معنى «هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يصف العود والقينة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "يَسْعَى بِهَا / ذُو زُجَا / جَاتِنْ لَهُو / نَطَفُنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — مُقَلْلِصُنْ / أَسْفَلَسْ / سِرْبَالِ مُعْ / تَمِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من العجز فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يذكر التِّبْرِيزِيّ للنطف معنى ثالثًا: «وقيل: نَطَف: تُبَان، بلغة اليمن، جلد أحمر» [@tabrizi-ashr، ص298]، والتُّبّان: سراويل قصيرة. وفي الديوان «نُطَفٌ» بضم النون [@diwan-asha، ص95]، أما «نَطَفٌ» بفتحتين فهو الذي في اللسان [@lisan، ج9 ص335]."
