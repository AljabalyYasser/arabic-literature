first: "وَالسَّاحِبَاتِ ذُيُولَ الرَّيْطِ آوِنَةً"
second: "وَالرَّافِلَاتِ عَلَى أَعْجَازِهَا الْعِجَلُ"
meaning: "وفي المجلس نساء يجررن ذيول ثيابهن الرقيقة حينًا، ويتبخترن في ثيابهن، وأعجازهن ممتلئة كأنها قِرَب. وللقدماء في العجز قولان: قال التِّبْرِيزِيّ إن أبا عُبَيْدة ذهب إلى «إنه شبَّه أعجازهن لضخمها بالعجل، وهي جمع عجلة، وهي مزادة كالإداوة وقال الأصمعي: أراد إنهن يخدمنه معهن العجل فيهن الخمر» [@tabrizi-ashr، ص299]."
vocabulary:
  - term: "السَّاحِبَاتِ"
    text: "الجارّات ذيولَ ثيابهن على الأرض."
  - term: "الرَّيْطِ"
    text: "جمع رَيْطة، وهي الملاءة الرقيقة. وفي اللسان: «والريطة: ملاءة ليست بملفقة» [@lisan، ج8 ص101]، أي قطعة واحدة لا قطعتان مخيطتان."
  - term: "آوِنَةً"
    text: "أحيانًا. قال التِّبْرِيزِيّ: «آونة: جمع أوان» [@tabrizi-ashr، ص298]."
  - term: "الرَّافِلَاتِ"
    text: "«والرافلات: النساء اللواتي يرفلن ثيابهن، أي يجررنها» [@tabrizi-ashr، ص298]."
  - term: "الْعِجَلُ"
    text: "جمع عِجْلة، وهي القربة أو المزادة الصغيرة. وفي اللسان: «والعجلة: المزادة، وقيل قربة الماء، والجمع عجل مثل قربة وقرب»، ونقل عن ثعلب: «شبه أعجازهن بالعجل المملوءة» [@lisan، ج11 ص429]."
syntax:
  - "قال التِّبْرِيزِيّ: «والساحبات: في موضع نصب على إضمار فعل، لأن قبله فعلا، فلذلك اختير النصب فيه، ويكون الرفع بمعنى: وعندنا الساحبات» [@tabrizi-ashr، ص299]. فـ«السَّاحِبَاتِ» منصوبة بالكسرة لأنها جمع مؤنث سالم، والتقدير: وأرى الساحبات، أو: ونازعت الساحبات."
  - "«ذُيُولَ» مفعول به لاسم الفاعل «السَّاحِبَاتِ»، و«آوِنَةً» ظرف زمان، و«وَالرَّافِلَاتِ» معطوف على «السَّاحِبَاتِ»."
  - "«عَلَى أَعْجَازِهَا الْعِجَلُ» جملة اسمية: «الْعِجَلُ» مبتدأ مؤخر، و«عَلَى أَعْجَازِهَا» خبر مقدم، والجملة حال من «الرَّافِلَاتِ»."
morphology:
  - "«السَّاحِبَات» و«الرَّافِلَات» جمعا مؤنث سالمان لاسمي الفاعل «ساحبة» و«رافلة»."
  - "«آوِنَة» جمع «أَوَان» على «أَفْعِلة»، و«عِجَل» جمع «عِجْلة» على «فِعَل»، و«أَعْجَاز» جمع «عَجُز» على «أَفْعال»."
rhetoric:
  thesis: "آخر عناصر المجلس: القيان المترفات. ويصفهن شوقي ضَيْف: «ومن ورائها نساء ترفل في ثياب الخز والحرير، وقد علت أعجازهن كأنها قرب ممتلئة، فهي تهتز وترتجّ» [@deif، ج1 ص356]."
  devices:
    - title: "الحذف"
      text: "نصب «وَالسَّاحِبَاتِ» بفعل محذوف لم يذكره، فبدأ البيت بالنساء أنفسهن. ويقول عبد القاهر الجُرْجانيّ في الحذف الذي يقطع الكلام ويستأنفه: «وكما يضمرون المبتدأ فيرفعون، قد يضمرون الفعل فينصبون» [@dalail، ص147]، وهما الوجهان اللذان ذكرهما التِّبْرِيزِيّ في هذه الكلمة."
    - title: "تشبيه أو حقيقة"
      text: "على قول أبي عُبَيْدة وثعلب في «عَلَى أَعْجَازِهَا الْعِجَلُ» تشبيه حُذفت أداته: أعجازهن قِرَب ممتلئة. وعلى قول الأَصْمَعِيّ لا تشبيه، بل يحملن قِرَب الخمر على ظهورهن ليخدمن الشاربين. والقول الأول أقرب إلى سياق الوصف، فقد وصف هُرَيْرَة بالامتلاء في أول القصيدة."
  connection: "ثم يجمع المجلس كله في بيت: من كل ذلك يوم قد لهوت به."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَسْسَاحِبَا / تِ ذُيُو / لَرْرَيْطِ آ / وِنَتَنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — وَرْرَافِلَا / تِ عَلَى / أَعْجَازِهَلْ / عِجَلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "في الديوان يأتي هذا البيت بعد «مِنْ كُلِّ ذَلِكَ يَوْمٌ»، وفيه «وَالسَّاحِبَاتُ ... وَالرَّافِلَاتُ» بالرفع [@diwan-asha، ص95]، وهو الوجه الآخر الذي ذكره التِّبْرِيزِيّ."
variants:
  - reading: "وَالسَّاحِبَاتِ ذُيُولَ الْخَزِّ آوِنَةً"
    status: "رواية أخرى، وهي رواية الديوان واللسان"
    note: "قال التِّبْرِيزِيّ: «ويروى (ذُيُول الخز)» [@tabrizi-ashr، ص298]، وهي في الديوان [@diwan-asha، ص95] واللسان [@lisan، ج11 ص429]. والخزّ: ثياب من صوف وحرير."
