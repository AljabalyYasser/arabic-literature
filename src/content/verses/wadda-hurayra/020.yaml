first: "أَأَنْ رَأَتْ رَجُلًا أَعْشَى أَضَرَّ بِهِ"
second: "رَيْبُ الْمَنُونِ وَدَهْرٌ مُفْنِدٌ خَبِلُ"
meaning: "أَمِن أجل أنها رأت رجلًا ضعيف البصر، أضرّت به حوادث الدهر ودهرٌ مفسد، صدّت عني؟ قال التِّبْرِيزِيّ: «والمعنى أَمن أن رأت رجُلا، ثم حذف من» [@tabrizi-ashr، ص295]."
vocabulary:
  - term: "أَعْشَى"
    text: "ضعيف البصر. قال الأَصْمَعِيّ: «الأعشى الذي لا يُبْصِر بالليل، والأجهر: الذي لا يبصر بالنهار» [@tabrizi-ashr، ص295]."
  - term: "رَيْبُ الْمَنُونِ"
    text: "حوادث الدهر. قال التِّبْرِيزِيّ: «والمنُون: المنية، سميت منُونا لأنها تنقص الأشياء» [@tabrizi-ashr، ص295]."
  - term: "مُفْنِدٌ"
    text: "«والمُفند: من الفند، وهو الفساد» [@tabrizi-ashr، ص295]."
  - term: "خَبِلُ"
    text: "«وخبل: من الخبال، وهو الفساد» [@tabrizi-ashr، ص295]."
syntax:
  - "الهمزة الأولى للاستفهام، و«أَنْ» مصدرية، والمصدر المؤول منصوب بنزع الخافض، كما قال التِّبْرِيزِيّ: «أن في موضع نصب، والمعنى أَمن أن رأت رجُلا، ثم حذف من» [@tabrizi-ashr، ص295]. والتقدير: أَمِنْ رؤيتها رجلًا أعشى صدّت؟"
  - "«رَجُلًا» مفعول به، و«أَعْشَى» صفته ممنوعة من الصرف، وجملة «أَضَرَّ بِهِ رَيْبُ الْمَنُونِ» صفة ثانية، و«رَيْبُ» فاعل «أَضَرَّ»."
  - "«وَدَهْرٌ» معطوف على «رَيْبُ»، و«مُفْنِدٌ» و«خَبِلُ» صفتان له."
morphology:
  - "في «أَأَنْ» همزتان: همزة الاستفهام وهمزة «أنْ». قال التِّبْرِيزِيّ: «ولك أن تحقق الهمزتين (أأن) ولك أن تخفف الثانية»، ثم ردّ على من يسكّنها: «وهذا خطأ، لأن النون ساكنة، فلو كانت الهمزة ساكنة لالتقى ساكنان» [@tabrizi-ashr، ص295]."
  - "«أَعْشَى» صفة على «أَفْعَل»، ومؤنثها «عَشْواء»، وهي ممنوعة من الصرف. ومنها لقب الشاعر."
  - "«مُفْنِد» اسم فاعل من «أَفْنَدَ» على «أفعل»، و«خَبِل» صفة على «فَعِل»."
rhetoric:
  thesis: "البيت الذي يفسر لقب الشاعر: رأته هُرَيْرَة أعشى قد أضرّ به الدهر، فصدّت. وهو يسألها مستنكرًا: أهذا سبب يكفي؟ ويقول ابن قُتَيْبة عنه: «وكان أعمى، ويكنى أبا بصير» [@ibn-qutayba، ج1 ص250]، أما هو هنا فيصف نفسه بالعشى لا بالعمى."
  devices:
    - title: "الاستفهام الإنكاري"
      text: "«أَأَنْ رَأَتْ رَجُلًا أَعْشَى» سؤال لا يطلب جوابًا، بل ينكر أن يكون ضعف البصر سببًا للصدّ. فالسؤال هنا عتاب."
    - title: "الحديث عن النفس بضمير الغائب"
      text: "لم يقل «رأتني»، بل «رَأَتْ رَجُلًا أَعْشَى»، فرأى نفسه بعينها: رجلًا غريبًا لا تعرفه. والتنكير يزيد هذا البعد."
    - title: "إسناد الضرر إلى الدهر"
      text: "في «أَضَرَّ بِهِ رَيْبُ الْمَنُونِ وَدَهْرٌ» نسب ما أصابه إلى الدهر، فلم يجعله ذنبًا له، بل حادثًا وقع عليه."
  connection: "ثم يروي ما قالته له حين زارها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "أَأَنْ رَأَتْ / رَجُلَنْ / أَعْشَى أَضَرْ / رَ بِهِي = متفعلن / فعِلن / مستفعلن / فعِلن — رَيْبُلْ مَنُو / نِ وَدَهْ / رُنْ مُفْنِدُنْ / خَبِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "قلب مقطع الصدّ: فيه سببه. وهو في الديوان البيت العاشر [@diwan-asha، ص91]. وفي نسخة الشاملة للتِّبْرِيزِيّ «أَضَرَّبِهِ» متصلة، وهو خطأ في الطبع."
