first: "كَأَنَّ مِشْيَتَهَا مِنْ بَيْتِ جَارَتِهَا"
second: "مَرُّ السَّحَابَةِ لَا رَيْثٌ وَلَا عَجَلُ"
meaning: "كأن مشيتها حين تخرج من بيت جارتها مرورُ السحابة في السماء: لا بطيئة ولا مسرعة. قال التِّبْرِيزِيّ: «(مرَّ السحابة) أي تهاديها كمر السحابة، وهذا مما توصف به النساء» [@tabrizi-ashr، ص289]."
vocabulary:
  - term: "مِشْيَتَهَا"
    text: "هيئة مشيها. قال التِّبْرِيزِيّ: «المشية: الحالة» [@tabrizi-ashr، ص289]."
  - term: "مَرُّ السَّحَابَةِ"
    text: "مرورها في السماء. وفسّره التِّبْرِيزِيّ بالتهادي [@tabrizi-ashr، ص289]، والتهادي: المشي الهادئ المتمايل."
  - term: "رَيْثٌ"
    text: "«والرَّيث: البُطء» [@tabrizi-ashr، ص289]."
  - term: "عَجَلُ"
    text: "«والعجل: العجلة» [@tabrizi-ashr، ص289]."
syntax:
  - "«كَأَنَّ» حرف تشبيه ينصب الاسم ويرفع الخبر، و«مِشْيَتَهَا» اسمها، و«مَرُّ السَّحَابَةِ» خبرها مرفوع."
  - "«مِنْ بَيْتِ جَارَتِهَا» متعلق بالمصدر «مِشْيَة»، أي مشيتها خارجةً من بيت جارتها."
  - "«لَا رَيْثٌ وَلَا عَجَلُ» جملة في موضع الحال من «مَرُّ السَّحَابَةِ». و«لا» فيها نافية لم تعمل لأنها تكررت، و«رَيْثٌ» خبر لمبتدأ محذوف تقديره: لا هو ريثٌ ولا عجلٌ."
morphology:
  - "«مِشْيَة» بكسر الميم على «فِعْلة»، وهو بناء الهيئة: الطريقة التي تمشي بها، ولذلك فسّرها التِّبْرِيزِيّ بـ«الحالة». أما «مَشْيَة» بالفتح فللمرة الواحدة."
  - "«رَيْث» مصدر «راث يَرِيث» إذا أبطأ، و«عَجَل» مصدر «عَجِلَ يَعْجَلُ»."
  - "«جَارَة» مؤنث «جار»، وتُجمع على «جارات» كما في البيت 6."
rhetoric:
  thesis: "يكمل صورة المشي التي بدأها في البيت السابق، ويصلح ما قد يوهمه ذلك التشبيه: فالوَجِي الوَحِل بطيء متألم، والسحابة بطيئة بلا ألم، تمضي في اعتدال لا يُرى فيه جهد."
  devices:
    - title: "التشبيه في الحركة"
      text: "في «كَأَنَّ مِشْيَتَهَا ... مَرُّ السَّحَابَةِ» شبّه هيئة مشيها بهيئة سحابة تعبر السماء: حركة متصلة هادئة لا تُرى خطواتها. ويعدّ عبد القاهر الجُرْجانيّ هذا الضرب من أدق التشبيه: «اعلم أن مما يزداد به التشبيه دقة وسحرًا أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "تحديد وجه الشبه بالنفي"
      text: "السحابة قد تسرع مع الريح وقد تقف، فأتبع التشبيه بقوله «لَا رَيْثٌ وَلَا عَجَلُ» ليحدد أي مرور يريد: الوسط بين البطء والعجلة. فالنفي المزدوج هنا يرسم الصورة بما ليس فيها."
  connection: "ثم ينتقل من البصر إلى السمع: صوت حليها إذا انصرفت."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "كَأَنْنَ مِشْ / يَتَهَا / مِنْ بَيْتِ جَا / رَتِهَا = متفعلن / فعِلن / مستفعلن / فعِلن — مَرْرُسْسَحَا / بَةِ لَا / رَيْثُنْ وَلَا / عَجَلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب مخبونان «فعِلن» كسائر القصيدة [@atiq، ص48]."
context: "ثالث أبيات صورة هُرَيْرَة. وذكرُ «بَيْتِ جَارَتِهَا» يفتح الحديث عن جاراتها في البيتين التاليين: فهي امرأة يزورها جاراتها وتزورهن، محبوبة بينهن."
