first: "لَمْ يُلْهِنِي اللَّهْوُ عَنْهُ حِينَ أَرْقُبُهُ"
second: "وَلَا اللَّذَاذَةُ مِنْ كَأْسٍ وَلَا شُغُلُ"
meaning: "لم يصرفني عن هذا السحاب، وأنا أرقبه، ما كنت فيه من لهو، ولا لذة الخمر، ولا أي شاغل آخر. ويلخصه محقق الديوان بقوله: «ولم يصرفني عنه ما كنت فيه من لهو» [@diwan-asha، ص96]."
vocabulary:
  - term: "يُلْهِنِي"
    text: "يشغلني ويصرفني."
  - term: "أَرْقُبُهُ"
    text: "أنتظره وأتابعه بعيني."
  - term: "اللَّذَاذَةُ"
    text: "اللذة."
  - term: "شُغُلُ"
    text: "ما يَشغل الإنسان من أمر."
syntax:
  - "«لَمْ يُلْهِنِي» مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الياء)، والنون للوقاية، والياء مفعول به. و«اللَّهْوُ» فاعل، و«عَنْهُ» متعلق بـ«يُلْهِنِي»."
  - "«حِينَ» ظرف زمان متعلق بـ«يُلْهِنِي»، مضاف إلى جملة «أَرْقُبُهُ»."
  - "«وَلَا اللَّذَاذَةُ» معطوفة على «اللَّهْوُ»، و«لا» زائدة لتوكيد النفي. و«مِنْ كَأْسٍ» متعلق بـ«اللَّذَاذَةُ». و«وَلَا شُغُلُ» معطوف كذلك."
morphology:
  - "«يُلْهِي» مضارع «أَلْهَى» على «أَفْعَلَ»: جعله يلهو عن الشيء، أي يغفل عنه."
  - "«لَذَاذَة» مصدر «لَذَّ» على «فَعَالَة»، و«شُغُل» مصدر «شَغَلَ» على «فُعُل»، ويقال «شُغْل» بالسكون."
rhetoric:
  thesis: "يجعل السحاب أقوى من اللهو الذي ملأ نصف القصيدة الأول: الرجل الذي غدا إلى الحانوت مع الفتية (25–32) يترك كأسه ويرقب السماء."
  devices:
    - title: "الجناس"
      text: "في «يُلْهِنِي اللَّهْوُ» جمع بين كلمتين من جذر واحد. ويسمى جناس الاشتقاق، وهو أن تتفق الكلمتان في أصل الحروف وتختلفا في الصيغة."
    - title: "النفي المتتابع"
      text: "نفى ثلاثة شواغل: «اللَّهْوُ» ثم «اللَّذَاذَةُ مِنْ كَأْسٍ» ثم «شُغُلُ»، وجاء الثالث نكرة عامة، فلم يبق شاغل إلا نفاه."
    - title: "الربط بأيام اللهو"
      text: "ذكر «اللَّهْوُ» و«كَأْسٍ» يردّ السامع إلى مقطع الحانوت قبل الفلاة، فالسحاب يُرقب من مجلس الشرب نفسه، كما يصرّح به البيت التالي. وهي قراءتنا."
  connection: "ثم يخاطب رفاقه الشاربين ويطلب منهم أن يقدّروا أين يمطر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَمْ يُلْهِنِلْ / لَهْوُ عَنْ / هُ حِينَ أَرْ / قُبُهُو = مستفعلن / فاعلن / متفعلن / فعِلن — وَلَلْلَذَا / ذَةُ مِنْ / كَأْسِنْ وَلَا / شُغُلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الثانية من الصدر و«مستفعلن» الأولى من العَجُز فصارتا «متفعلن»، و«فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 24 في الديوان [@diwan-asha، ص93]. وهو حلقة بين مشهدين: السحاب الذي يُرى، ومجلس الشرب الذي يُرى منه."
