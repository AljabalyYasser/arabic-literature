first: "لَئِنْ قَتَلْتُمْ عَمِيدًا لَمْ يَكُنْ صَدَدًا"
second: "لَنَقْتُلَنْ مِثْلَهُ مِنْكُمْ فَنَمْتَثِلُ"
meaning: "...لئن قتلتم منا سيدًا ليس كفئًا لقتيلكم، لنقتلنّ سيدًا مثله منكم، ونتخيّر الأفضل فالأفضل. وبهذا يتم القسم الذي بدأ في البيت السابق. قال التِّبْرِيزِيّ: «الصَّدَد: المقارب، فنمتثل: أي نقتل الأمثل فالأمثل، وأماثل القوم: خيارهم» [@tabrizi-ashr، ص305]."
vocabulary:
  - term: "عَمِيدًا"
    text: "سيدًا يعتمد عليه قومه. في اللسان: «والعَمِيدُ: سَيِّدُ الْقَوْمِ» [@lisan، ج3 ص305]."
  - term: "صَدَدًا"
    text: "مقاربًا مكافئًا. «الصَّدَد: المقارب» [@tabrizi-ashr، ص305]. ويقول محقق الديوان: «صدد الشيء المقابل له أو القريب منه» [@diwan-asha، ص99]."
  - term: "نَمْتَثِلُ"
    text: "نختار الأمثل. «أي نقتل الأمثل فالأمثل، وأماثل القوم: خيارهم» [@tabrizi-ashr، ص305]."
syntax:
  - "«لَئِنْ» اللام موطّئة للقسم، أي مؤذنة بأن الجواب بعدها جواب قسم، و«إنْ» شرطية. و«قَتَلْتُمْ» فعل الشرط، و«عَمِيدًا» مفعول به، وجملة «لَمْ يَكُنْ صَدَدًا» صفة له."
  - "«لَنَقْتُلَنْ» جواب القسم الذي في البيت السابق، وجواب الشرط محذوف دلّ عليه جواب القسم، لأن القسم تقدّم. قال البَغْداديّ في البيت السابق: «والبيت الذي بعده جواب القسم والقسم وجوابه خبر إني» [@khizana، ج9 ص455]."
  - "«مِثْلَهُ» مفعول به، و«مِنْكُمْ» متعلق بمحذوف حال. و«فَنَمْتَثِلُ» مضارع مرفوع معطوف على «نَقْتُلَنْ» في المعنى، أو خبر لمبتدأ محذوف: فنحن نمتثل."
morphology:
  - "«لَنَقْتُلَنْ» مضارع مؤكد بنون التوكيد الخفيفة، وهي نون ساكنة تقوم مقام الثقيلة."
  - "«نَمْتَثِل» على «نَفْتَعِل» من «مَثُل»، والافتعال هنا للاختيار: نأخذ الأمثل."
  - "«عَمِيد» صفة على «فَعِيل» بمعنى «مَفْعُول»، أي معتمَد عليه."
rhetoric:
  thesis: "هذا جواب القسم، وهو جواب مباشر عن كلمة يَزِيد التي قيلت القصيدة من أجلها. فقد قال يزيد لقوم القتيل: «اقتلوا به سيدا من بني سعد بن مالك بن ضبيعة» [@aghani-dk، ج9 ص155]، فيردّ عليه الأَعْشَى: إن قتلتم سيدًا منا ليس كفئًا لقتيلكم قتلنا مثله منكم، بل خيركم."
  devices:
    - title: "التضمين"
      text: "يتم هنا ما عُلّق في البيت السابق: «إِنِّي لَعَمْرُ الَّذِي ...» لا خبر له إلا «لَنَقْتُلَنْ». وهو التضمين الذي عرّفه ابن رَشِيق بأن «تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]. وطول القسم بينهما يجعل الجواب أشدّ وقعًا."
    - title: "المقابلة"
      text: "المقابلة أن يؤتى بمعنى ثم بما يقابله. وقد قابل بين «قَتَلْتُمْ عَمِيدًا» في الصدر و«لَنَقْتُلَنْ مِثْلَهُ» في العجز، فالجزاء من جنس الفعل. ثم زاد عليه بـ«فَنَمْتَثِلُ»: لا نكتفي بالمثل، بل نختار أفضلكم."
    - title: "التوكيدات المتراكبة"
      text: "اجتمع في البيتين: «إنّ»، والقسم «لَعَمْرُ»، واللام الموطّئة في «لَئِنْ»، ولام الجواب ونون التوكيد في «لَنَقْتُلَنْ». فكل أداة توكيد تُغلق باب الشك في أن الوعيد سيُنفّذ."
  connection: "ثم يزيد الوعيد: إن ابتُليت بنا بعد معركة لم تجدنا نتبرأ من دماء قومك."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَئِنْ قَتَلْ / تُمْ عَمِي / دَنْ لَمْ يَكُنْ / صَدَدَا = متفعلن / فاعلن / مستفعلن / فعِلن — لَنَقْتُلَنْ / مِثْلَهُو / مِنْكُمْ فَنَمْ / تَثِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]. وتُشبع ضمة الهاء في «مِثْلَهُ» فتُنطق «مِثْلَهُو»."
context: "البيت 63 في الديوان، بلفظه [@diwan-asha، ص99]. ويلخص محققه البيتين: «لئن قتلتم منا سيدًا لم يكن مقاربا لقتيلكم، لنقتلن به منكم أفضل سيد فيكم» [@diwan-asha، ص98]. وأنشده البَغْداديّ مع القسم قبله والأبيات بعده [@khizana، ج9 ص454]."
