first: "مَا رَوْضَةٌ مِنْ رِيَاضِ الْحَزْنِ مُعْشِبَةٌ"
second: "خَضْرَاءُ جَادَ عَلَيْهَا مُسْبِلٌ هَطِلُ"
meaning: "ليست روضةٌ من رياض الأرض المرتفعة، كثيرةُ العشب خضراء، أصابها مطر غزير متتابع... والكلام لا يتم هنا: فخبر «مَا رَوْضَةٌ» يأتي في البيت 14: «بِأَطْيَبَ مِنْهَا». وخصّ رياض الحَزْن لأنها كما قال التِّبْرِيزِيّ «أحسن من رياض الخفوض» [@tabrizi-ashr، ص292]، أي من رياض الأرض المنخفضة."
vocabulary:
  - term: "رَوْضَةٌ"
    text: "أرض ذات عشب وزهر."
  - term: "الْحَزْنِ"
    text: "ما غلظ من الأرض وارتفع. وفي اللسان عن أبي زياد الكِلابيّ: «أحسن ما تكون الروضة على المكان فيه غلظ وارتفاع؛ وأنشد قول الأعشى: ما روضة من رياض الحزن معشبة» [@lisan، ج8 ص33]."
  - term: "مُعْشِبَةٌ"
    text: "كثيرة العشب."
  - term: "جَادَ عَلَيْهَا"
    text: "أصابها بالجَوْد، وهو المطر الغزير."
  - term: "مُسْبِلٌ هَطِلُ"
    text: "مطر مُسْبِل: نازل مسترسل، وهَطِل: متتابع. ويفسرهما شوقي ضَيْف معًا: «مسبل هطل: كثير الأمطار» [@deif، ج1 ص365]."
syntax:
  - "«مَا» نافية تعمل عمل «ليس»، و«رَوْضَةٌ» اسمها. وخبرها لا يأتي في هذا البيت ولا في الذي يليه، بل في البيت 14: «بِأَطْيَبَ مِنْهَا»، والباء فيه زائدة."
  - "«مِنْ رِيَاضِ الْحَزْنِ» صفة لـ«رَوْضَةٌ»، و«مُعْشِبَةٌ» و«خَضْرَاءُ» صفتان بعدها، وجملة «جَادَ عَلَيْهَا مُسْبِلٌ هَطِلُ» صفة رابعة."
  - "«مُسْبِلٌ» فاعل «جَادَ»، وهو صفة لموصوف محذوف تقديره: مطرٌ مُسبل، و«هَطِلُ» صفة ثانية."
morphology:
  - "«مُعْشِبَة» اسم فاعل من «أَعْشَبَ» على «أفعل» الذي يدل على الصيرورة: صارت ذات عشب."
  - "«خَضْرَاء» على «فَعْلاء» مؤنث «أخضر»، ممنوعة من الصرف لألف التأنيث الممدودة."
  - "«مُسْبِل» اسم فاعل من «أَسْبَلَ»، و«هَطِل» صفة على «فَعِل» من «هَطِلَ»."
rhetoric:
  thesis: "أشهر أبيات القصيدة بعد مطلعها. يبدأ مقارنة بين هُرَيْرَة والروضة، لكنه يطيل وصف الروضة حتى تكاد تُنسى المقارنة، ثم يردّها إليها في آخر الأبيات الثلاثة. وقال ابن قُتَيْبة: «وأحسن ما قيل في الرياض قوله» [@ibn-qutayba، ج1 ص258]، ثم أنشد الأبيات الثلاثة."
  devices:
    - title: "التضمين"
      text: "التضمين في تعريف ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]، أي ألا يتم معنى البيت إلا بالبيت الذي بعده. وهو عنده عيب في الأصل، لكنه يقول: «وربما حالت بين بيتي التضمين أبيات كثيرة بقدر ما يتسع الكلام وينبسط الشاعر في المعاني، ولا يضره ذلك إذا أجاد» [@ibn-rashiq، ج1 ص172]. وهذا ما في «مَا رَوْضَةٌ»: مبتدأ في البيت 12، وبيت كامل من الوصف بينهما، والخبر في البيت 14."
    - title: "التضمين عند شوقي ضيف"
      text: "يجعل شوقي ضَيْف التضمين علامة على أن أسلوب الأَعْشَى «ينفك قليلا عن صورة الأسلوب الجاهلي»، فهو لا يتم المعنى في البيت الواحد كما يفعل غيره [@deif، ج1 ص364]. ويربط بذلك صيغة التفضيل التي اشتهر بها، «وذلك أنه حين يبتغى تفضيل شئ على شئ يجعل المفضل عليه مبتدأ منفيّا بها، ثم يسترسل في وصفه، حتى إذا استوفى ما أراد من هذا الوصف جاء بخبر المبتدأ»، ويمثّل بهذه الأبيات نفسها [@deif، ج1 ص365]."
    - title: "تفضيل بالنفي"
      text: "لم يقل إنها أطيب من الروضة، بل نفى أن تكون الروضة أطيب منها. فيبدأ بـ«مَا» النافية، ويختار أجمل الرياض: رياض الحزن، معشبة، خضراء، ممطورة. وكلما زاد في جمال الروضة زاد جمال من لا تبلغها الروضة."
  connection: "ويظل الكلام معلقًا: فالبيت التالي يزيد الروضة وصفًا، ولا يأتي الخبر إلا في البيت 14."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "مَا رَوْضَتُنْ / مِنْ رِيَا / ضِلْحَزْنِ مُعْ / شِبَتُنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — خَضْرَاءُ جَا / دَ عَلَيْ / هَا مُسْبِلُنْ / هَطِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية من العجز فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "أول الأبيات الثلاثة (12–14) التي هي جملة واحدة. وهي في الديوان 14–16 [@diwan-asha، ص93]. ويفسر شوقي ضَيْف تفضيل رياض الحزن بقوله: «وعندهم رياض الحزن أجود وأنضر من رياض المنخفضات» [@deif، ج1 ص365]."
