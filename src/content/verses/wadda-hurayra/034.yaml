first: "لَا يَتَنَمَّى لَهَا بِالْقَيْظِ يَرْكَبُهَا"
second: "إِلَّا الَّذِينَ لَهُمْ فِيمَا أَتَوْا مَهَلُ"
meaning: "لا يطمح إلى ركوب هذه الفلاة في شدة الحر إلا رجال لهم في ما يُقدمون عليه خبرة سابقة وعُدّة. قال التِّبْرِيزِيّ: «أي لا يسمو إلى ركوبها إلا الذين لهم فيما أوتوا مهل وعُدة، يصف شدتها» [@tabrizi-ashr، ص299]."
vocabulary:
  - term: "يَتَنَمَّى"
    text: "يسمو ويطمح. «لا يتنمى لها: أي لا يسمو إلى ركوبها» [@tabrizi-ashr، ص299]. وفي اللسان عن أبي سعيد في هذا البيت: «لا يعتمد عليها» [@lisan، ج15 ص343]."
  - term: "الْقَيْظِ"
    text: "«القيظ: صميم الصيف» [@lisan، ج7 ص456]، أي أشده حرًّا."
  - term: "مَهَلُ"
    text: "«والمهل: التقدم في الأمر والهداية قبل ركوبها» [@tabrizi-ashr، ص299]. وفي اللسان عن أبي سعيد في قول الأعشى هذا: «أراد المعرفة المتقدمة بالموضع» [@lisan، ج11 ص634]، أي أنهم عرفوا الطريق قبل أن يسلكوه."
syntax:
  - "«لَا يَتَنَمَّى» فعل مضارع منفي، وفاعله «الَّذِينَ» بعد «إِلَّا»: استثناء مفرّغ، لأن الفعل قبله لم يُذكر له فاعل، فعمل فيما بعد «إلا»."
  - "جملة «يَرْكَبُهَا» في موضع نصب على الحال من «الذين» متقدمة عليه، أو هي بيان لقوله «يتنمّى لها»: أي لا يسمو إليها راكبًا. و«بِالْقَيْظِ» الباء فيه بمعنى «في» الظرفية، متعلقة بـ«يركبها»."
  - "«لَهُمْ ... مَهَلُ» جملة اسمية صلة الموصول: «مَهَلُ» مبتدأ مؤخر، و«لَهُمْ» خبر مقدم، و«فِيمَا أَتَوْا» متعلق بـ«مَهَل»، و«ما» موصولة، والعائد محذوف: فيما أتوه."
morphology:
  - "«يَتَنَمَّى» مضارع «تَنَمَّى» على «تَفَعَّلَ» من «نَمَى» إذا ارتفع، والألف المقصورة في آخره منقلبة عن ياء."
  - "«مَهَل» مصدر على «فَعَل» بالتحريك، من التقدم؛ ومنه في اللسان: «فلان ذو مهل أي ذو تقدم في الخير» [@lisan، ج11 ص634]."
  - "«أَتَوْا» ماضٍ مسند إلى واو الجماعة من «أتى»، حُذفت لامه (الياء) لالتقاء الساكنين، وبقيت الفتحة قبل الواو دليلًا عليها."
rhetoric:
  thesis: "يمدح الشاعر نفسه من غير أن يذكرها: الفلاة لا يركبها في القيظ إلا الخبراء، وهو قد قطعها كما سيقول في البيت التالي."
  devices:
    - title: "القصر"
      text: "في «لَا يَتَنَمَّى ... إِلَّا الَّذِينَ» حصر ركوبها في فئة واحدة بالنفي والاستثناء. والقصر عند عبد القاهر الجُرْجانيّ يفيد «اختصاص» الشيء بالحكم ونفيه «عمن عداه» [@dalail، ص337]: فغير الخبراء لا يجرؤ عليها أصلًا."
    - title: "الكناية"
      text: "«الَّذِينَ لَهُمْ فِيمَا أَتَوْا مَهَلُ» كناية عن الخبراء بالطريق والماء. والكناية عند عبد القاهر أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]. فلم يقل «الأدلّاء»، بل ذكر ما يلزمهم: سبق المعرفة والعُدّة."
    - title: "الزمن الأقسى"
      text: "خصّ «الْقَيْظِ» بالذكر: فالفلاة في الشتاء قد يقطعها غير الخبير، أما في صميم الصيف فهي مهلكة. فكلما اشتدت الصورة عظم فخره بقطعها."
  connection: "ثم يأتي بخبر «وبلدةٍ» الذي انتظره السامع منذ بيتين: «جاوزتُها»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَا يَتَنَمْ / مَى لَهَا / بِلْقَيْظِ يَرْ / كَبُهَا = مستعلن / فاعلن / مستفعلن / فعِلن — إِلْلَلْلَذِي / نَ لَهُمْ / فِيمَا أَتَوْ / مَهَلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الطَّيُّ، وهو حذف الرابع الساكن [@atiq، ص47]، «مستفعلن» الأولى من الصدر فصارت «مستعلن»؛ ودخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص46–48]."
context: "البيت الثاني من مقطع الفلاة. يصف الأرض بالوعورة والخطر قبل أن يذكر أنه قطعها، فيكون الإخبار بالقطع في البيت التالي أوقع. ويقول شوقي ضَيْف إنها أرض «لا يركبها في حمارّة القيظ واشتعال الرمال إلا من تعود الصبر واحتمال المكاره» [@deif، ج1 ص353]."
variants:
  - reading: "لَا يَتَنَمَّى لَهَا فِي الْقَيْظِ يَهْبِطُهَا"
    status: "رواية لسان العرب"
    note: "[@lisan، ج15 ص343]."
  - reading: "إِلَّا الَّذِينَ لَهُمْ فِيمَا أَتَوْا نَتَلُ"
    status: "رواية لسان العرب"
    note: "والنَّتَل فيها بيض النعام يُملأ ماءً ويُدفن: «زعموا أن العرب كانوا يملؤون بيض النعام ماء في الشتاء ويدفنونها في الفلوات البعيدة من الماء، فإذا سلكوها في القيظ استثاروا البيض وشربوا ما فيها من الماء» [@lisan، ج11 ص645]."
