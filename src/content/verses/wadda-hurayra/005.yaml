first: "لَيْسَتْ كَمَنْ يَكْرَهُ الْجِيرَانُ طَلْعَتَهَا"
second: "وَلَا تَرَاهَا لِسِرِّ الْجَارِ تَخْتَتِلُ"
meaning: "ليست من النساء اللواتي يكره الجيران أن يروا وجهها لسوء عشرتها، ولا تراها تتسمّع خفيةً لتعرف أسرار جارها. قال التِّبْرِيزِيّ: «تختتل وتختل واحد، أي لا تفعل ذلك لتسمع السر» [@tabrizi-ashr، ص290]."
vocabulary:
  - term: "طَلْعَتَهَا"
    text: "وجهها حين تطلع عليهم، أي رؤيتها."
  - term: "تَخْتَتِلُ"
    text: "تتسمّع خفيةً. وفي اللسان: «ويقال للرجل إذا تسمع لسر قوم: قد اختتل؛ ومنه قول الأعشى: ولا تراها لسر الجار تختتل» [@lisan، ج11 ص200]."
syntax:
  - "«لَيْسَتْ» فعل ناقص، واسمه ضمير مستتر يعود على هُرَيْرَة، و«كَمَنْ» في موضع خبره: الكاف للتشبيه، و«مَنْ» اسم موصول مجرور بها."
  - "جملة «يَكْرَهُ الْجِيرَانُ طَلْعَتَهَا» صلة الموصول: «الْجِيرَانُ» فاعل، و«طَلْعَتَهَا» مفعول به. والضمير في «طَلْعَتَهَا» يعود على «مَنْ»، وأنّثه لأنه أراد بها امرأة، فحمله على المعنى لا على لفظ «مَنْ» المذكر."
  - "«وَلَا تَرَاهَا» معطوفة على ما قبلها، و«تَرَى» هنا بصرية تنصب مفعولًا واحدًا هو الضمير «ها»، وجملة «تَخْتَتِلُ» في موضع الحال منه. و«لِسِرِّ الْجَارِ» متعلق بـ«تَخْتَتِلُ»."
morphology:
  - "«تَخْتَتِلُ» مضارع «اخْتَتَلَ» على «افتعل» من «خَتَلَ». والتِّبْرِيزِيّ يجعل المزيد والمجرد بمعنى واحد [@tabrizi-ashr، ص290]، وفي زيادة التاء معنى التكلف والتعمد."
  - "«جِيرَان» جمع «جار» على «فِعْلان»، و«طَلْعَة» على «فَعْلة» من «طَلَعَ»."
rhetoric:
  thesis: "ينتقل من الجمال إلى الخلق: هي محبوبة عند جيرانها، لا تؤذيهم ولا تتجسس عليهم. فالصورة لا تكتمل بالجسد وحده."
  devices:
    - title: "المدح بنفي العيب"
      text: "لا يقول إنها كريمة العشرة، بل ينفي عنها عيبين معروفين في النساء: «لَيْسَتْ كَمَنْ يَكْرَهُ الْجِيرَانُ طَلْعَتَهَا» و«وَلَا تَرَاهَا لِسِرِّ الْجَارِ تَخْتَتِلُ». فيستحضر صورة الجارة المكروهة المتجسسة ليخرجها منها."
    - title: "الجار إطارًا للصورة"
      text: "تكرر ذكر الجوار في ثلاثة أبيات متتالية: «بَيْتِ جَارَتِهَا» في البيت 3، و«الْجِيرَانُ» و«الْجَارِ» هنا، و«جَارَاتِهَا» في البيت 6. فحياتها كلها بين بيوت الجيران، وهي فيها محبوبة مترفة."
  connection: "ثم يعود إلى جسدها: كسلها حين تقوم إلى جاراتها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَيْسَتْ كَمَنْ / يَكْرَهُلْ / جِيرَانُ طَلْ / عَتَهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — وَلَا تَرَا / هَا لِسِرْ / رِلْجَارِ تَخْ / تَتِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من العجز فصارت «متفعلن» [@atiq، ص46]. وجاء الحشو في الشطرين على «فاعلن» تامة، والعروض والضرب مخبونان «فعِلن» [@atiq، ص48]."
context: "يجعل محقق الديوان هذا البيت وما بعده في وصف خلقها، ويلخصه بأنها «لم تكن تؤذي أحدا، ولم تكن تزج بنفسها فيما لا يعنيها من شئون الناس» [@diwan-asha، ص90]."
