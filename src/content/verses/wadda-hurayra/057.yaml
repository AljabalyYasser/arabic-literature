first: "لَئِنْ مُنِيتَ بِنَا عَنْ غِبِّ مَعْرَكَةٍ"
second: "لَا تُلْفِنَا عَنْ دِمَاءِ الْقَوْمِ نَنْتَفِلُ"
meaning: "وإن ابتُليتَ بلقائنا عقب معركة، لا تجدنا نتبرأ من دماء قومك التي سفكناها ولا نجحدها. قال التِّبْرِيزِيّ: «مُنيت: ابتليت، والانتفال: الجُحُود، أي لم ننتفل من قتلنا من قومك ولم نجحد» [@tabrizi-ashr، ص305]."
vocabulary:
  - term: "مُنِيتَ"
    text: "ابتُليت. «منيت: ابتليت» [@tabrizi-ashr، ص305]."
  - term: "غِبِّ"
    text: "عاقبة الشيء وما بعده. قال البَغْداديّ: «والغب بالكسر والمغبة بالفتح: العاقبة» [@khizana، ج11 ص336]."
  - term: "تُلْفِنَا"
    text: "تجدنا."
  - term: "نَنْتَفِلُ"
    text: "نتبرأ ونجحد. في اللسان: «وانْتَفَلَ مِنَ الشَّيْءِ: انْتَفى وتبرَّأَ مِنْهُ» [@lisan، ج11 ص672]."
syntax:
  - "«لَئِنْ» اللام موطّئة للقسم، أي مؤذنة بأن قبلها قسمًا وأن الجواب بعدها جواب له، و«إنْ» شرطية، و«مُنِيتَ» فعل الشرط مبني للمجهول، والتاء نائب فاعل. و«بِنَا» متعلق به. قال البَغْداديّ: «وقوله: عن غب معركة عن: هنا بمعنى بعد» [@khizana، ج11 ص336]."
  - "«لَا تُلْفِنَا» جواب الشرط مجزوم، وعلامة جزمه حذف الياء. والقياس بعد اللام الموطّئة أن يكون الجواب للقسم مرفوعًا: «لا تُلفينا»، كما في البيت السابق «لَنَقْتُلَنْ». قال البَغْداديّ: «على أنه يجوز بقلة في الشعر أن يكون الجواب للشرط مع تأخره عن القسم فإن لام لئن موطئة للقسم وقوله: لا تلفنا جواب الشرط دون القسم بدليل الجزم» [@khizana، ج11 ص327]، ونقل أن ابن هشام جعل اللام هنا زائدة لا موطّئة [@khizana، ج11 ص327]."
  - "«تُلْفِي» بمعنى «تجد»، تنصب مفعولين: الضمير «نا» مفعول أول، وجملة «نَنْتَفِلُ» مفعول ثانٍ. قال البَغْداديّ: «وجملة ننتفل: هي المفعول الثاني» [@khizana، ج11 ص336]. و«عَنْ دِمَاءِ الْقَوْمِ» متعلق بـ«نَنْتَفِلُ»."
morphology:
  - "«مُنِيتَ» ماضٍ مبني للمجهول من «مَنَى» إذا قدّر، ومنه المنيّة."
  - "«تُلْفِ» مضارع «أَلْفَى» مجزوم بحذف لامه (الياء)."
  - "«نَنْتَفِل» على «نَفْتَعِل» من «نَفَل»، قيل هو إبدال من «انتفى»، ففي اللسان عن أبي عُبَيْد: «انْتَفلْت مِنَ الشَّيْءِ وانْتَفَيْت مِنْهُ بِمَعْنًى وَاحِدٍ كأَنه إِبدال مِنْهُ» [@lisan، ج11 ص672]."
rhetoric:
  thesis: "يتمّم الشاعر الوعيد بالفخر: قومه لا يتعبون من القتال، فمن لقيهم بعد معركة وجدهم مستعدين لأخرى، ولا ينكرون ما سفكوا من دم، بل يعترفون به."
  devices:
    - title: "الفخر بالاعتراف"
      text: "«لَا تُلْفِنَا عَنْ دِمَاءِ الْقَوْمِ نَنْتَفِلُ»: من يقتل ثم يجحد يخاف الثأر، ومن يقتل ثم يعترف لا يخافه. فنفي الانتفال إعلان بأنهم مستعدون لكل ما يترتب على القتل."
    - title: "اختيار «غِبّ معركة»"
      text: "خصّ لقاءهم «عَنْ غِبِّ مَعْرَكَةٍ»، أي في الوقت الذي يكون فيه المقاتل متعبًا. ويقول محقق الديوان: «وقال عن غب معركة، لأن المعقول المألوف» أن يستريح المقاتل بعدها، «ولكن هؤلاء لا يملون القتال» [@diwan-asha، ص99]."
    - title: "تكرار «لئن»"
      text: "بدأ البيت السابق بـ«لَئِنْ» وبدأ هذا بها، فصار الوعيد شرطين متتاليين: إن قتلتم... وإن لقيتنا... فكل احتمال له جواب. وجاء جواب الأول للقسم وجواب الثاني للشرط كما ذكر النحويون."
  connection: "ثم يلتفت إلى بني شيبان جميعًا: لا تنتهون، ولا يردع الظالم إلا الطعن."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "لَئِنْ مُنِي / تَ بِنَا / عَنْ غِبْبِ مَعْ / رَكَتِنْ = متفعلن / فعِلن / مستفعلن / فعِلن — لَا تُلْفِنَا / عَنْ دِمَا / ءِلْقَوْمِ نَنْ / تَفِلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» و«فاعلن» الأوليين من الصدر فصارتا «متفعلن» و«فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]. والوزن يشهد للجزم: «لَا تُلْفِنَا» تُقرأ «مستفعلن»، ولو قيل «لا تُلفينا» لانكسر."
context: "البيت 64 في الديوان، وفيه «لَمْ تُلْفِنَا مِنْ دِمَاءِ الْقَوْمِ» [@diwan-asha، ص99]، وبهذه الرواية أنشده شوقي ضَيْف في فخر الأَعْشَى بقومه [@deif، ج1 ص352]. وبه تكتمل الجملة التي بدأت بالقسم في البيت 55: قسم، ثم شرطان، كل منهما في بيت."
variants:
  - reading: "لَئِنْ مُنِيتَ بِنَا عَنْ غِبِّ مَعْرَكَةٍ / لَمْ تُلْفِنَا مِنْ دِمَاءِ الْقَوْمِ نَنْتَفِلُ"
    status: "رواية الديوان"
    note: "[@diwan-asha، ص99]. وعليها يزول الإشكال النحوي، لأن «لم» تجزم الفعل."
  - reading: "لَئِنْ مُنِيتَ بِنَا عَنْ جِدِّ مَعْرَكَةٍ"
    status: "رواية لسان العرب"
    note: "[@lisan، ج11 ص672]. وذكرها البَغْداديّ: «وروى أيضا: عن جد معركة بكسر الجيم بمعنى الشدة والمجاهدة فيها» [@khizana، ج11 ص336]."
  - reading: "وَإِنْ مُنِيتَ بِنَا عَنْ غِبِّ مَعْرَكَةٍ"
    status: "رواية الخزانة في موضع"
    note: "هكذا أنشده البَغْداديّ مع أبيات القسم [@khizana، ج9 ص454]، وعليها يكون الجزم في «لا تُلفنا» على القياس."
