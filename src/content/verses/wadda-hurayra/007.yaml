first: "إِذَا تُلَاعِبُ قِرْنًا سَاعَةً فَتَرَتْ"
second: "وَارْتَجَّ مِنْهَا ذَنُوبُ الْمَتْنِ وَالْكَفَلُ"
meaning: "إذا لاعبت صاحبةً لها ساعةً أعيت وفترت، واهتزّ لحم ظهرها وعجيزتها لامتلائه. وهذا البيت مما رواه أبو عُبَيْدة، كما يقول التِّبْرِيزِيّ قبل أن يورده: «وروى أبو عبيدة» [@tabrizi-ashr، ص290]."
vocabulary:
  - term: "قِرْنًا"
    text: "نظيرًا يُلاعَب. ويفسره محقق الديوان بقوله: «قرنا صاحبا» [@diwan-asha، ص91]."
  - term: "فَتَرَتْ"
    text: "ضعفت وسكنت بعد حركة."
  - term: "ارْتَجَّ"
    text: "اضطرب واهتزّ."
  - term: "ذَنُوبُ الْمَتْنِ"
    text: "قال التِّبْرِيزِيّ: «ذنوب المتن: العجيزة» [@tabrizi-ashr، ص290]. وفي اللسان: «والذنوب: لحم المتن، وقيل: هو منقطع المتن، وأوله، وأسفله؛ وقيل: الألية والمآكم» [@lisan، ج1 ص392]. والمتن: الظهر، والمآكم: لحم أعلى الوركين."
  - term: "الْكَفَلُ"
    text: "العَجُز، أي مؤخرة الجسم."
syntax:
  - "«إِذَا» ظرف لما يستقبل من الزمان فيه معنى الشرط، وجملة «تُلَاعِبُ قِرْنًا» في محل جر بإضافته إليها، و«قِرْنًا» مفعول به، و«سَاعَةً» ظرف زمان."
  - "«فَتَرَتْ» جواب «إذا»، و«ارْتَجَّ» معطوف عليه، و«ذَنُوبُ» فاعل «ارتجّ»، و«الْكَفَلُ» معطوف على «ذَنُوبُ». و«مِنْهَا» متعلق بـ«ارتجّ»."
morphology:
  - "«تُلَاعِبُ» مضارع «لاعَبَ» على «فاعَل» الذي يدل على المشاركة: لعب بين اثنين."
  - "«ارْتَجَّ» على «افتعل» من «رَجَّ»، وأصله «ارْتَجَجَ» فأُدغم المثلان."
  - "«ذَنُوب» على «فَعُول»، و«قِرْن» على «فِعْل»."
rhetoric:
  thesis: "يكمل صورة الامتلاء والترف: حركة قليلة تُتعبها، وجسدها يرتجّ إذا تحركت. وهي من صفات الجمال في ذوق الجاهليين."
  devices:
    - title: "الكناية"
      text: "«وَارْتَجَّ مِنْهَا ذَنُوبُ الْمَتْنِ وَالْكَفَلُ» كناية عن امتلاء الجسم ونعمته، فلم يقل إنها ممتلئة، بل ذكر ما يلزم الامتلاء. وهذا ما يسميه عبد القاهر الجُرْجانيّ كناية، إذ المتكلم يريد معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المقابلة بين الحركة والفتور"
      text: "بدأ البيت بالحركة «تُلَاعِبُ» وأتبعها مباشرة بنقيضها «فَتَرَتْ»، وجعل بينهما «سَاعَةً» فقط: فاللعب قصير، والفتور سريع."
  connection: "ثم يجمع الدقة والامتلاء في بيت واحد: صفر الوشاح ملء الدرع."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "إِذَا تُلَا / عِبُ قِرْ / نَنْ سَاعَتَنْ / فَتَرَتْ = متفعلن / فعِلن / مستفعلن / فعِلن — وَرْتَجْجَ مِنْ / هَا ذَنُو / بُلْمَتْنِ وَلْ / كَفَلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية منه فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "هو في الديوان البيت السابع أيضًا [@diwan-asha، ص91]. وفي اللسان صدره «وارتجّ» كرواية التِّبْرِيزِيّ [@lisan، ج1 ص392]."
variants:
  - reading: "إِذَا تُعَالِجُ قِرْنًا سَاعَةً فَتَرَتْ ... وَاهْتَزَّ مِنْهَا ذَنُوبُ الْمَتْنِ وَالْكَفَلُ"
    status: "رواية الديوان"
    note: "[@diwan-asha، ص91]. و«تعالج»: تزاول وتغالب."
