first: "فَالسَّفْحُ يَجْرِي فَخِنْزِيرٌ فَبُرْقَتُهُ"
second: "حَتَّى تَدَافَعَ مِنْهُ الرَّبْوُ فَالْحُبَلُ"
meaning: "ثم يسيل الماء في السَّفْح، ثم في خِنْزِير وبُرْقته، حتى يدفع بعضُ المرتفعات ماءه إلى بعض، من الرَّبْو إلى الحُبَل. قال التِّبْرِيزِيّ: «والربو: ما نشز من الأرض، والحُبل: جبل، أو بلد» [@tabrizi-ashr، ص301]."
vocabulary:
  - term: "السَّفْحُ"
    text: "أسفل الجبل حيث يسيل الماء، ويجعله محقق الديوان اسم موضع: «السفح وخنزير موضعان» [@diwan-asha، ص93]."
  - term: "خِنْزِيرٌ"
    text: "موضع. في اللسان: «وخِنْزِيرٌ: اسْمُ مَوْضِعٍ؛ قَالَ الأَعشى يصف الغيث»، ثم أنشد البيت [@lisan، ج4 ص260–261]."
  - term: "بُرْقَتُهُ"
    text: "البُرْقة: أرض غليظة مختلطة بحجارة ورمل، والضمير لخنزير. ويقول محقق الديوان: «البرقة أرض ذات حجارة ورمل وطين» [@diwan-asha، ص93]."
  - term: "تَدَافَعَ"
    text: "دفع بعضه بعضًا."
  - term: "الرَّبْوُ"
    text: "«ما نشز من الأرض» [@tabrizi-ashr، ص301]، أي ما ارتفع منها."
  - term: "الْحُبَلُ"
    text: "«جبل، أو بلد» [@tabrizi-ashr، ص301]."
syntax:
  - "«فَالسَّفْحُ» معطوف على «نِمَارٌ» وما بعدها في البيت السابق، فهو من تمام كلام الشاربين. وجملة «يَجْرِي» حال من «السَّفْحُ»، أي جاريًا بالسيل. و«فَخِنْزِيرٌ فَبُرْقَتُهُ» معطوفان، والضمير في «بُرْقَتُهُ» لخنزير."
  - "«حَتَّى» حرف ابتداء وغاية، وما بعدها جملة فعلية: «تَدَافَعَ» فعل ماضٍ، و«الرَّبْوُ» فاعله، و«فَالْحُبَلُ» معطوف عليه. و«مِنْهُ» متعلق بـ«تَدَافَعَ»، والضمير للمطر أو للعارض."
morphology:
  - "«تَدَافَعَ» على «تَفَاعَلَ» الدال على المشاركة: كل موضع يدفع الماء إلى الذي يليه."
  - "«بُرْقَة» على «فُعْلَة»، و«الرَّبْو» مصدر «رَبَا» إذا ارتفع، سُمّي به المكان المرتفع."
  - "«خِنْزِير» علم لموضع على «فِعْلِيل»، وهو مصروف لأنه علم مذكر ليس فيه ما يمنعه من الصرف."
rhetoric:
  thesis: "يبلغ المطر غايته: لم يعد ماءً يقع على موضع، بل سيلًا يجري من مكان إلى مكان ويتدافع بين المرتفعات."
  devices:
    - title: "المجاز العقلي"
      text: "في «فَالسَّفْحُ يَجْرِي» أسند الجريان إلى السفح، والجاري في الحقيقة هو الماء فيه. وهذا ما يسمى المجاز العقلي: أن يُسند الفعل إلى غير فاعله الحقيقي لعلاقة بينهما، وهنا علاقة المكان. فكأن الأرض نفسها صارت تجري."
    - title: "تشخيص المواضع"
      text: "في «تَدَافَعَ مِنْهُ الرَّبْوُ فَالْحُبَلُ» جعل المرتفعات تتدافع الماء كما يتدافع الناس، فكل منها يدفعه إلى الآخر لكثرته. وهي قراءتنا."
    - title: "«حتى» للغاية"
      text: "أدخل «حَتَّى» على الصورة الأخيرة، فبلغ بالمطر أقصاه، ثم يعيدها في البيت التالي «حَتَّى تَحَمَّلَ»، فتتصاعد المبالغة درجة بعد درجة."
  connection: "ثم يزيد في كثرة الماء: الروض يحمله بمشقة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "فَسْسَفْحُ يَجْ / رِي فَخِنْ / زِيرُنْ فَبُرْ / قَتُهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — حَتْتَى تَدَا / فَعَ مِنْ / هُرْرَبْوُ فَلْ / حُبَلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 28 في الديوان، وفيه «فَالْجَبَلُ» [@diwan-asha، ص93]. ويلخص محققه هذه الأبيات بقوله: «وكأن فجاج الأرض قد ضاقت بالماء حتى عم الربا والجبال، وانصب إلى الرياض وإلى الوديان ذات الأشجار» [@diwan-asha، ص96]."
