first: "وَعُلِّقَتْهُ فَتَاةٌ مَا يُحَاوِلُهَا"
second: "وَمِنْ بَنِي عَمِّهَا مَيْتٌ بِهَا وَهِلُ"
meaning: "وأحبّته فتاةٌ لا يريدها هو ولا يطلبها، وفي بني عمها رجلٌ يكاد يموت بحبها وقد ذهب عقله. قال التِّبْرِيزِيّ: «ما يُحاولها: ما يريدها ولا يطلبها»، وقال: «والوهل: الذاهب العقل، كلما ذكر غيرها رجع إلى ذكرها لفتنته بها» [@tabrizi-ashr، ص293–294]."
vocabulary:
  - term: "يُحَاوِلُهَا"
    text: "يريدها ويطلبها [@tabrizi-ashr، ص293]. وعلى رواية ابن حبيب معناه: «ما يقدر عليها ولا يصل إليها» [@tabrizi-ashr، ص294]."
  - term: "مَيْتٌ"
    text: "قال التِّبْرِيزِيّ: «ومعنى (ومن بني عمها ميت) أي رجل ميت» [@tabrizi-ashr، ص294]، أي قتله حبها."
  - term: "وَهِلُ"
    text: "«والوهل: الذاهب العقل» [@tabrizi-ashr، ص294]."
syntax:
  - "«وَعُلِّقَتْهُ» فعل ماض مبني للمجهول، و«فَتَاةٌ» نائب الفاعل، والهاء مفعول به ثانٍ يعود على من أحبته الفتاة."
  - "جملة «مَا يُحَاوِلُهَا» صفة لـ«فَتَاةٌ»، و«ما» نافية، وفاعل «يحاول» ضمير يعود على صاحب الهاء في «عُلِّقَتْهُ»."
  - "«وَمِنْ بَنِي عَمِّهَا» خبر مقدم، و«مَيْتٌ» مبتدأ مؤخر، وهو صفة لموصوف محذوف كما قدّره التِّبْرِيزِيّ: رجلٌ ميت. و«بِهَا» متعلق بـ«مَيْتٌ»، و«وَهِلُ» صفة ثانية."
morphology:
  - "«مَيْت» مخفف «مَيِّت» بحذف الياء الثانية، وهما بمعنى. وعلى رواية ابن حبيب جاء مشددًا «مَيِّتٌ»."
  - "«يُحَاوِل» مضارع «حاوَلَ» على «فاعَل»، من الحَوْل والحيلة: يطلب الشيء ويحتال له."
  - "«وَهِل» صفة على «فَعِل» من «وَهِلَ»."
rhetoric:
  thesis: "السلسلة تطول وتتفرع: حلقة جديدة، وفيها محب جديد لا يُبادَل، حتى يبلغ الحب الموت والجنون."
  devices:
    - title: "المبالغة بالموت"
      text: "في «مَيْتٌ بِهَا» جعل العاشق ميتًا، وهو حيّ يهذي بها، فبلغ في وصف وجده أقصاه. ثم أتبعه بـ«وَهِلُ» ليبيّن أي موت يريد: ذهاب العقل."
    - title: "النفي في «مَا يُحَاوِلُهَا»"
      text: "على تفسير التِّبْرِيزِيّ الأول هو لا يريدها، وعلى رواية ابن حبيب هو لا يقدر عليها. والفرق كبير: الأول إعراض، والثاني عجز. وعلى الوجهين لا تلتقي الحلقتان."
  connection: "ثم يصل السلسلة به هو: فتاة صغيرة تحبه ولا يلائمها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَعُلْلِقَتْ / هُ فَتَا / تُنْ مَا يُحَا / وِلُهَا = متفعلن / فعِلن / مستفعلن / فعِلن — وَمِنْ بَنِي / عَمْمِهَا / مَيْتُنْ بِهَا / وَهِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية من الصدر فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "لا يقول البيت صراحةً من الذي أحبته الفتاة. والأقرب أنه الرجل المذكور في البيت 15. ويفهم محقق الديوان أن الفتاة هُرَيْرَة نفسها، فيلخص: «فهي تتعلق برجل لا يأبه لها، وفي بني عمها من قتله حبها وأذهل عقله» [@diwan-asha، ص92]."
variants:
  - reading: "وَعُلِّقَتْهُ فَتَاةٌ مَا يُحَاوِلُهَا ... مِنْ أَهْلِهَا مَيِّتٌ يَهْذِي بِهَا وَهِلُ"
    status: "رواية ابن حبيب، وهي رواية الديوان"
    note: "رواها ابن حَبِيب كما ينقل التِّبْرِيزِيّ [@tabrizi-ashr، ص293–294]، وهي في الديوان [@diwan-asha، ص93]."
  - reading: "وَمِنْ بَنِي عَمِّهَا مَيْتٌ بِهَا خَبِلُ"
    status: "رواية أخرى"
    note: "قال التِّبْرِيزِيّ: «ويروى (خبل)» [@tabrizi-ashr، ص293]. والخَبِل: الفاسد العقل."
