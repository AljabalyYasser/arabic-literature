first: "إِذَا تَقُومُ يَضُوعُ الْمِسْكُ أَصْوِرَةً"
second: "وَالزَّنْبَقُ الْوَرْدُ مِنْ أَرْدَانِهَا شَمِلُ"
meaning: "إذا قامت فاح منها المسك مرة بعد مرة، وانتشرت من أكمامها رائحة الزنبق المائل إلى الحمرة. قال التِّبْرِيزِيّ: «ويضوع: تذهب ريحه كذا وكذا» [@tabrizi-ashr، ص292]، أي تنتشر في كل جهة."
vocabulary:
  - term: "يَضُوعُ"
    text: "يفوح وينتشر [@tabrizi-ashr، ص292]."
  - term: "أَصْوِرَةً"
    text: "قال الأَصْمَعِيّ: «أصورة تارات» [@tabrizi-ashr، ص292]، أي مرة بعد مرة. وفي اللسان معنى آخر: «والصوار والصوار: القليل من المسك، وقيل: القطعة منه، والجمع أصورة، فارسي. وأصورة المسك: نافقاته» [@lisan، ج4 ص476]، والنافقة: وعاء المسك في الظبي."
  - term: "الزَّنْبَقُ الْوَرْدُ"
    text: "الزنبق نبات طيب الرائحة، والوَرْد هنا صفة بمعنى الأحمر. قال أبو عُبَيْدة: «أجود الزنبق ما كان يضرب إلى الحمرة؛ فلذلك قال (والزنبق الورد)» [@tabrizi-ashr، ص292]."
  - term: "أَرْدَانِهَا"
    text: "«وأردان: جمع رَدْن ورُدْن، وهي أطراف الأكمام» [@tabrizi-ashr، ص292]."
  - term: "شَمِلُ"
    text: "«وشمل: أي طيبُها يشمل» [@tabrizi-ashr، ص292]، أي يعمّ ما حولها."
syntax:
  - "«إِذَا» ظرف شرطي، وجملة «تَقُومُ» في محل جر بالإضافة، وجوابه «يَضُوعُ الْمِسْكُ»: «الْمِسْكُ» فاعل."
  - "«أَصْوِرَةً» منصوب على الظرف إذا كان بمعنى التارات كما فسّره الأَصْمَعِيّ، أي يضوع تاراتٍ. وإذا كان بمعنى قطع المسك كما في اللسان فهو حال: يضوع قطعًا."
  - "«وَالزَّنْبَقُ» مبتدأ، و«الْوَرْدُ» صفته، و«شَمِلُ» خبره، و«مِنْ أَرْدَانِهَا» متعلق بـ«شَمِلُ». والجملة معطوفة على جملة الجواب."
morphology:
  - "«يَضُوعُ» مضارع «ضاع يضوع» من الأجوف الواوي."
  - "«أَصْوِرَة» جمع «صُوار» على «أَفْعِلة»، و«أَرْدَان» جمع «رُدْن» على «أَفْعال»."
  - "«شَمِل» صفة على «فَعِل» بمعنى «شامل». قال التِّبْرِيزِيّ: «فهو شملٌ وشامل» [@tabrizi-ashr، ص292]."
rhetoric:
  thesis: "بعد البصر في الأبيات الأولى، والسمع في البيت الرابع، يأتي الشمّ: فالصورة تكتمل بالحواس كلها. والرائحة هنا من علامات الترف، فالمسك والزنبق طيب الأغنياء."
  devices:
    - title: "الحركة سببًا للرائحة"
      text: "ربط الطيب بالقيام في «إِذَا تَقُومُ يَضُوعُ الْمِسْكُ»: فكل حركة منها تنشر رائحة. والفعل المضارع «يَضُوعُ» يدل على أن ذلك يتجدد كلما قامت."
    - title: "الكناية"
      text: "في «مِنْ أَرْدَانِهَا شَمِلُ» لم يقل إنها تتطيب، بل جعل الطيب يفوح من أطراف أكمامها، فدلّ على كثرته وعلى ترفها معًا."
  connection: "ثم يقيس هذه الرائحة بأطيب روضة، في جملة تمتد ثلاثة أبيات."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "إِذَا تَقُو / مُ يَضُو / عُلْمِسْكُ أَصْ / وِرَتَنْ = متفعلن / فعِلن / مستفعلن / فعِلن — وَزْزَنْبَقُلْ / وَرْدُ مِنْ / أَرْدَانِهَا / شَمِلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية منه فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "هذا البيت جسر بين صورة هُرَيْرَة والروضة: فالرائحة التي يذكرها هنا هي التي سيقيسها في البيت 14 بنشر الروضة. وفي نسخة الشاملة للتِّبْرِيزِيّ «الزَّنْبِقُ» بالكسر، والذي في اللسان «الزَّنْبَقُ» بالفتح [@lisan، ج4 ص476]، والوزن واحد."
variants:
