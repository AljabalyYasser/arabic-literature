first: "وَاسْأَلْ قُشَيْرًا وَعَبْدَ اللَّهِ كُلَّهُمُ"
second: "وَاسْأَلْ رَبِيعَةَ عَنَّا كَيْفَ نَفْتَعِلُ"
meaning: "واسأل قُشَيْرًا وبني عبد الله جميعًا، واسأل ربيعة: كيف نصنع في الحرب؟ ويلخصه محقق الديوان: «يقول له: سل هؤلاء، بل سائل ربيعة جميعًا، يخبروك كيف وجدوا بلاءنا فى القتال» [@diwan-asha، ص98]."
vocabulary:
  - term: "قُشَيْرًا"
    text: "قبيلة. ويقول محقق الديوان: «قشير بن كعب بن ربيعة» [@diwan-asha، ص97]."
  - term: "عَبْدَ اللَّهِ"
    text: "قبيلة، ولم يحدّدها التِّبْرِيزِيّ ولا محقق الديوان."
  - term: "رَبِيعَةَ"
    text: "قبيلة كبيرة، ويفهمها محقق الديوان على العموم: «بل سائل ربيعة جميعًا» [@diwan-asha، ص98]."
  - term: "نَفْتَعِلُ"
    text: "نفعل ونصنع. ويقول شوقي ضَيْف: «نفتعل هنا: نفعل العظائم» [@deif، ج1 ص352]."
syntax:
  - "«وَاسْأَلْ» فعل أمر معطوف على «سَائِلْ» في البيت السابق، و«قُشَيْرًا» مفعول به، و«وَعَبْدَ اللَّهِ» معطوف عليه، و«كُلَّهُمُ» توكيد معنوي منصوب. وحُرّكت ميم الجمع بالضم وأُشبعت في آخر الصدر لإقامة الوزن: «كُلَّهُمُو»."
  - "«وَاسْأَلْ رَبِيعَةَ» جملة معطوفة، و«رَبِيعَةَ» ممنوع من الصرف للعلمية والتأنيث. و«عَنَّا» متعلق بـ«اسْأَلْ»."
  - "«كَيْفَ» اسم استفهام في محل نصب حال، وجملة «كَيْفَ نَفْتَعِلُ» في محل نصب مفعول ثانٍ لـ«اسْأَلْ»، علّق الاستفهامُ الفعلَ عن العمل في لفظها."
morphology:
  - "«اسْأَلْ» أمر من «سَأَلَ»، وهمزته همزة وصل، وفي الوصل تسقط فتُنطق «وَسْأَلْ»."
  - "«قُشَيْر» على «فُعَيْل»، صيغة تصغير صارت علمًا."
  - "«نَفْتَعِل» مضارع «افْتَعَلَ» من «فَعَل»، والافتعال يدل على الاجتهاد في الفعل والتكلّف له."
rhetoric:
  thesis: "تتسع دائرة الشهود: بعد بني أسد قُشَيْر وعبد الله، ثم ربيعة. فالشاعر لا يكتفي بشاهد واحد، بل يحيل يَزِيد إلى القبائل كلها، وكلها تعرف بأس قومه."
  devices:
    - title: "تكرار فعل السؤال"
      text: "كرّر «وَاسْأَلْ» في أول الصدر وأول العجز بعد «سَائِلْ» في البيت السابق، فتوالت ثلاثة أوامر بالسؤال. والتكرار يوحي بكثرة الشهود وثقة الشاعر بما سيقولون."
    - title: "الإبهام في «كيف نفتعل»"
      text: "لم يذكر ما يفعلونه، بل ترك «كَيْفَ نَفْتَعِلُ» مبهمًا، فيذهب السامع في تصوّره كل مذهب. والبيت التالي يجيب عن هذا السؤال."
  connection: "ثم يأتي جواب السؤال على لسان الشاعر: إنا نقاتلهم حتى نقتّلهم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَسْأَلْ قُشَيْ / رَنْ وَعَبْ / دَلْلَاهِ كُلْ / لَهُمُو = مستفعلن / فاعلن / مستفعلن / فعِلن — وَسْأَلْ رَبِي / عَةَ عَنْ / نَا كَيْفَ نَفْ / تَعِلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من العَجُز فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "البيت 55 في الديوان، بلفظه [@diwan-asha، ص97]. ولم يشرحه التِّبْرِيزِيّ بشيء [@tabrizi-ashr، ص303]."
