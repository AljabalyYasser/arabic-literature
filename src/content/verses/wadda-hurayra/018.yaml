first: "فَكُلُّنَا مُغْرَمٌ يَهْذِي بِصَاحِبِهِ"
second: "نَاءٍ وَدَانٍ وَمَحْبُولٌ وَمُحْتَبِلُ"
meaning: "فكلنا مولع بمن يحب يهذي بذكره: منا البعيد ومنا القريب، ومنا من وقع في الحبالة ومنا من نصبها. قال أبو عُبَيْدة: «محبول ومحتبل - بكسر الباء - أي مصيد وصائد»، وقال الأَصْمَعِيّ: «أي كُلنا مُوثق عند صاحبه» [@tabrizi-ashr، ص294]."
vocabulary:
  - term: "مُغْرَمٌ"
    text: "«المُغرم: المُولع، والغرام: الهلاك، ومنه: (إِنَّ عَذَابَهَا كَانَ غَرَاماً)» [@tabrizi-ashr، ص294]."
  - term: "يَهْذِي"
    text: "يتكلم بما لا يعقل من شدة الوجد."
  - term: "نَاءٍ"
    text: "«والنائي: البعيد» [@tabrizi-ashr، ص294]."
  - term: "مَحْبُولٌ"
    text: "الواقع في الحبالة، وهي شرك الصيد. وفي اللسان: «وقيل: المحبول الذي نصبت له الحبالة وإن لم يقع فيها» [@lisan، ج11 ص136]."
  - term: "مُحْتَبِلُ"
    text: "الصائد بالحبالة. ويفسره محقق الديوان: «واحتبل الرجل الصيد أخذه بالحبالة فالصائد محتبل (على البناء للفاعل)» [@diwan-asha، ص93]."
syntax:
  - "«كُلُّنَا» مبتدأ، و«مُغْرَمٌ» خبره، وجملة «يَهْذِي بِصَاحِبِهِ» خبر ثانٍ أو صفة لـ«مُغْرَمٌ»."
  - "«نَاءٍ وَدَانٍ وَمَحْبُولٌ وَمُحْتَبِلُ» بدل تفصيل من «كُلُّنَا»: يفصّل الجماعة أقسامًا. و«نَاءٍ» و«دَانٍ» اسمان منقوصان حُذفت ياؤهما لأنهما منونان في حال الرفع."
morphology:
  - "«مُغْرَم» اسم مفعول من «أُغْرِمَ»، فالحب أصابه ولم يختره، كما في «عُلِّقَ» في الأبيات السابقة."
  - "«مَحْبُول» اسم مفعول من «حَبَلَ» الثلاثي، و«مُحْتَبِل» اسم فاعل من «احْتَبَلَ» على «افتعل»: كلمتان من أصل واحد، إحداهما لمن يقع في الحبالة والأخرى لمن ينصبها."
  - "«نَاءٍ» اسم فاعل من «نَأَى»، و«دَانٍ» من «دَنَا»."
rhetoric:
  thesis: "خلاصة السلسلة في حكم عام يبدأ بـ«فَكُلُّنَا». ثم يقسم العشاق أربعة أقسام في أربع كلمات."
  devices:
    - title: "التقسيم والطباق"
      text: "في «نَاءٍ وَدَانٍ وَمَحْبُولٌ وَمُحْتَبِلُ» زوجان من الأضداد: البعيد والقريب، والمصيد والصائد. والطباق الجمع بين الضدين. وكل واحد في السلسلة صائد لمن يحبه ومصيد لمن يحبه معًا."
    - title: "استعارة الصيد"
      text: "جعل الحب صيدًا: حبالة ومحبولًا ومحتبلًا. قال الأَصْمَعِيّ: «وإنما هو من الحبالة وهو الشَّرك الذي يُصطاد به» [@tabrizi-ashr، ص294]. وهي استعارة بالمعنى الذي حدده عبد القاهر الجُرْجانيّ: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
  connection: "ثم يعود من السلسلة إلى هُرَيْرَة: صدّت عنه لا تكلمه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "فَكُلْلُنَا / مُغْرَمُنْ / يَهْذِي بِصَا / حِبِهِي = متفعلن / فاعلن / مستفعلن / فعِلن — نَاءِنْ وَدَا / نِنْ وَمَحْ / بُولُنْ وَمُحْ / تَبِلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن» [@atiq، ص46]. وجاء الحشو في العجز تامًّا، والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "آخر أبيات «سلسلة الحب». وفي متن التِّبْرِيزِيّ «وَمَخْبُولٌ وَمُخْتَبَلُ» بالخاء، لكنه ينقل عن الأَصْمَعِيّ: «من رواه بالخاء معجمة فقد أخطأ»، ويرويه الأَصْمَعِيّ وأبو عُبَيْدة بالحاء [@tabrizi-ashr، ص294]، وكذلك هو في الديوان [@diwan-asha، ص93]. فأثبتنا رواية الحاء."
variants:
  - reading: "نَاءٍ وَدَانٍ وَمَخْبُولٌ وَمُخْتَبَلُ"
    status: "متن التِّبْرِيزِيّ"
    note: "بالخاء: المخبول المجنون، والمختبَل الذي أُذهب عقله. وخطّأها الأَصْمَعِيّ كما سبق [@tabrizi-ashr، ص294]."
  - reading: "نَاءٍ وَدَانٍ وَمَحْبُولٌ وَمُحْتَبَلُ"
    status: "رواية اللسان"
    note: "بفتح الباء، وفسّره: «والمحتبل: الذي أخذ فيها» [@lisan، ج11 ص136]، فيكون الاثنان مصيدين: من نُصبت له الحبالة ومن وقع فيها."
  - reading: "فَكُلُّنَا هَائِمٌ يَهْذِي بِصَاحِبِهِ"
    status: "رواية أخرى"
    note: "قال التِّبْرِيزِيّ: «ويروى (فكلُّنا هائم)» [@tabrizi-ashr، ص294]. والهائم: الذاهب على وجهه من العشق."
