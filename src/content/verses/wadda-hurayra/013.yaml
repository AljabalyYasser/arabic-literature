first: "يُضَاحِكُ الشَّمْسَ مِنْهَا كَوْكَبٌ شَرِقٌ"
second: "مُؤَزَّرٌ بِعَمِيمِ النَّبْتِ مُكْتَهِلُ"
meaning: "يدور زهرها الريّان مع الشمس كأنه يضاحكها، وقد أحاط به نبت كثيف تام كأنه إزار عليه. قال التِّبْرِيزِيّ: «قوله (يضاحك الشمس) أي يدور معها حيثما دارت، وكوكب كل شيء: معظمه، والمراد هنا الزهر» [@tabrizi-ashr، ص292]."
vocabulary:
  - term: "كَوْكَبٌ"
    text: "الزَّهر، كما قال التِّبْرِيزِيّ. وفي اللسان: «الكوكب، معروف، من كواكب السماء، ويشبه به النور، فيسمى كوكبا؛ قال الأعشى» [@lisan، ج1 ص720]، والنَّوْر: الزهر."
  - term: "شَرِقٌ"
    text: "«والشرق: الريَّان الممتلئ ماء» [@tabrizi-ashr، ص292]. وفي اللسان: «ونبت شرق أي ريان» [@lisan، ج10 ص178]."
  - term: "مُؤَزَّرٌ"
    text: "«ومؤزَّر: مُفعَّل من الإزار» [@tabrizi-ashr، ص292]، أي جُعل له إزار. وفي اللسان: «وأزّر النبت الأرض: غطاها» [@lisan، ج4 ص18]."
  - term: "عَمِيمِ النَّبْتِ"
    text: "النبت الكثيف التام. ويفسره شوقي ضَيْف: «عميم النبت: ما اجتمع منه وتكاثر» [@deif، ج1 ص365]."
  - term: "مُكْتَهِلُ"
    text: "«ومكتهل: قد انتهى في التمام» [@tabrizi-ashr، ص292]، مأخوذ من اكتهال الرجل، أي بلوغه سن الكهولة."
syntax:
  - "«يُضَاحِكُ» فعل مضارع، و«الشَّمْسَ» مفعول به مقدم، و«كَوْكَبٌ» فاعل مؤخر، و«مِنْهَا» متعلق بمحذوف حال من «كَوْكَبٌ»، أي كوكبٌ كائنٌ من الروضة."
  - "«شَرِقٌ» و«مُؤَزَّرٌ» و«مُكْتَهِلُ» صفات لـ«كَوْكَبٌ»، و«بِعَمِيمِ النَّبْتِ» متعلق بـ«مُؤَزَّرٌ»."
  - "والجملة كلها صفة أخرى لـ«رَوْضَةٌ» في البيت 12، وما زال خبر «مَا» لم يأتِ."
morphology:
  - "«يُضَاحِكُ» مضارع «ضاحَكَ» على «فاعَل» الذي يدل على المشاركة: ضحكٌ متبادل بين الزهر والشمس."
  - "«مُؤَزَّر» اسم مفعول من «أَزَّرَ» على «فعّل»، و«مُكْتَهِل» اسم فاعل من «اكْتَهَلَ» على «افتعل»."
  - "«عَمِيم» صفة على «فَعِيل» من «عَمَّ»، و«شَرِق» صفة على «فَعِل» من «شَرِقَ»."
rhetoric:
  thesis: "بيت تحيا فيه الروضة: زهر يضاحك الشمس، ونبت يلبس إزارًا، وتمام كتمام الكهل. فكل وصف فيه مستعار من الإنسان."
  devices:
    - title: "الاستعارة في «يُضَاحِكُ»"
      text: "جعل الزهر يضاحك الشمس، والمعنى عند التِّبْرِيزِيّ أنه يدور معها، فاستعار لدورانه معها ضحكَ صاحبٍ لصاحبه. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وفي الضحك معنى انفتاح الزهر وبريقه أيضًا."
    - title: "الاستعارة في «مُؤَزَّرٌ» و«مُكْتَهِلُ»"
      text: "جعل النبت الكثيف حول الزهر إزارًا يلبسه، وجعل تمام نموّه اكتهالًا. فالزهر رجل في تمام عمره، يلبس إزاره ويضاحك الشمس."
    - title: "الكوكب للزهر"
      text: "في «كَوْكَبٌ» سمّى الزهر باسم نجم السماء، وهي تسمية جرت في كلامهم كما يذكر اللسان. فتلتقي في البيت الشمس والكوكب: سماء على الأرض."
  connection: "ثم يأتي الخبر الذي انتظره السامع منذ البيت 12."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "يُضَاحِكُشْ / شَمْسَ مِنْ / هَا كَوْكَبُنْ / شَرِقُنْ = متفعلن / فاعلن / مستفعلن / فعِلن — مُؤَزْزَرُنْ / بِعَمِي / مِنْنَبْتِ مُكْ / تَهِلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "البيت الأوسط من الأبيات الثلاثة، وهو الذي يجعل الكلام معلقًا بين الاسم والخبر؛ فهو مثال ما قاله ابن رَشِيق: «وربما حالت بين بيتي التضمين أبيات كثيرة» [@ibn-rashiq، ج1 ص172]. واستشهد به اللسان في ثلاثة مواضع، للكوكب والشرق والتأزير."
