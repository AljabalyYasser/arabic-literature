first: "هِرْكَوْلَةٌ فُنُقٌ دُرْمٌ مَرَافِقُهَا"
second: "كَأَنَّ أَخْمَصَهَا بِالشَّوْكِ مُنْتَعِلُ"
meaning: "هي ضخمة الوركين حسنة الخلق، فتيّة منعّمة، لا يظهر لمرفقيها عظم لامتلائهما، وتمشي متقاربة الخطو كأن باطن قدمها يطأ على شوك. قال التِّبْرِيزِيّ في العجز: «معناه إنها متقاربة الخطو، وقيل: لأنها ضخمة فكأنها تطأ على شوك لثقل المشي عليها» [@tabrizi-ashr، ص291]."
vocabulary:
  - term: "هِرْكَوْلَةٌ"
    text: "«الهركولة: الضخمة الوركين الحسنة الخلق، وقيل: الحسنة المشي» [@tabrizi-ashr، ص291]."
  - term: "فُنُقٌ"
    text: "«والفنق: الفتية من النساء والإبل الحسنة الخلق» [@tabrizi-ashr، ص291]. وفي اللسان: «وجارية فنق ومفناق: جسيمة حسنة فتية منعمة» [@lisan، ج10 ص312]."
  - term: "دُرْمٌ"
    text: "قال التِّبْرِيزِيّ: «وواحد الدُّرم أدرم، والمؤنثة درماء، أي ليس لمرفقيها حجم» [@tabrizi-ashr، ص291]، والحجم هنا: نتوء العظم، أي غطّى اللحمُ عظم المرفق."
  - term: "أَخْمَصَهَا"
    text: "«والأخمص: باطن القدم» [@tabrizi-ashr، ص291]، وهو ما لا يمس الأرض منها."
  - term: "مُنْتَعِلُ"
    text: "لابس النعل."
syntax:
  - "«هِرْكَوْلَةٌ» خبر لمبتدأ محذوف تقديره: هي، و«فُنُقٌ» خبر ثانٍ."
  - "«دُرْمٌ مَرَافِقُهَا»: «دُرْمٌ» خبر ثالث، وهو صفة رفعت «مَرَافِقُهَا» على أنه فاعل لها، كما تقول: هي حسنٌ وجهُها. وجمع «دُرْم» لأن فاعله جمع."
  - "«كَأَنَّ أَخْمَصَهَا»: «أَخْمَصَهَا» اسم «كأنّ»، و«مُنْتَعِلُ» خبرها، و«بِالشَّوْكِ» متعلق بـ«مُنْتَعِلُ» مقدَّم عليه."
morphology:
  - "«هِرْكَوْلَة» اسم رباعي زيدت فيه الواو، على «فِعْلَوْلة»، ويوصف به."
  - "«دُرْم» جمع «أَدْرَم» و«دَرْماء» على «فُعْل»، كـ«حُمْر» جمع «أحمر» و«حمراء». و«مَرَافِق» جمع «مِرْفَق»، وجاء به جمعًا وهو يريد المرفقين، قال التِّبْرِيزِيّ: «وجمع فقال (مرافق) لأن التثنية جمع» [@tabrizi-ashr، ص291]، أي إن الاثنين أول الجمع عندهم."
  - "«مُنْتَعِل» اسم فاعل من «انْتَعَلَ» على «افتعل»."
rhetoric:
  thesis: "صفات متتابعة للامتلاء والنعمة، ثم صورة غريبة للمشي: قدم تمشي كأنها تتقي الشوك."
  devices:
    - title: "تتابع الصفات"
      text: "صدر البيت أربع كلمات كلها صفات بلا عطف: «هِرْكَوْلَةٌ فُنُقٌ دُرْمٌ مَرَافِقُهَا»، تنتقل من الوركين إلى الشباب إلى المرفقين، كما فعل في البيت الثاني «غَرَّاءُ فَرْعَاءُ»."
    - title: "تشبيه يحتاج إلى تأويل"
      text: "في «كَأَنَّ أَخْمَصَهَا بِالشَّوْكِ مُنْتَعِلُ» لا يظهر وجه الشبه من أول نظرة، ولذلك ذكر له التِّبْرِيزِيّ تفسيرين: تقارب الخطو، أو ثقل المشي على الضخمة. وهذا ما يسميه عبد القاهر الجُرْجانيّ تشبيهًا «لا يتمّ لكَ إلا بتأوُّل» [@asrar، ص92]، أي يحتاج القارئ إلى خطوة من التفكير ليستخرج وجه الشبه."
    - title: "قلب المألوف"
      text: "النعل تحمي القدم من الشوك، وهو هنا يجعل الشوك نفسه نعلًا في «بِالشَّوْكِ مُنْتَعِلُ»، فتأتي الصورة مفاجئة."
  connection: "ثم ينتقل من الجسد إلى الرائحة: يضوع المسك منها إذا قامت."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "هِرْكَوْلَتُنْ / فُنُقُنْ / دُرْمُنْ مَرَا / فِقُهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — كَأَنْنَ أَخْ / مَصَهَا / بِشْشَوْكِ مُنْ / تَعِلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يأتي بعد البيت التاسع «نِعْمَ الضجيعُ»، ويعود إلى وصف الجسد الذي بدأه في الثامن: صفر الوشاح ملء الدرع. وهو في الديوان البيت الثاني عشر [@diwan-asha، ص91]."
