first: "جَاوَزْتُهَا بِطَلِيحٍ جَسْرَةٍ سُرُحٍ"
second: "فِي مِرْفَقَيْهَا إِذَا اسْتَعْرَضْتَهَا فَتَلُ"
meaning: "...قطعتُ تلك الفلاة على ناقة أنضتها الأسفار، لكنها مع ذلك ماضية سهلة السير، إذا نظرتَ إليها من جانبها رأيت مرفقيها متباعدين عن جنبيها. وبهذا يتم الكلام الذي بدأ في البيت 33: رُبَّ فلاةٍ تلك صفتها جاوزتُها. قال التِّبْرِيزِيّ: «والفتلُ: تباعد مرفقيها عن جنبيها» [@tabrizi-ashr، ص299]، وهي صفة تُمدح بها الناقة، لأن مرفقيها لا يحتكّان بجنبيها فلا يعوقان سيرها."
vocabulary:
  - term: "جَاوَزْتُهَا"
    text: "قطعتُها وخلّفتُها ورائي."
  - term: "طَلِيحٍ"
    text: "«الطليح: المُعيية» [@tabrizi-ashr، ص299]، أي التي أتعبها السير. وفي اللسان: «ويقال: ناقة طليح أسفار إذا جهدها السير وهزلها» [@lisan، ج2 ص531]."
  - term: "جَسْرَةٍ"
    text: "الماضية الجريئة على السير. في اللسان: «وجمل جسر وناقة جسرة ومتجاسرة: ماضية» [@lisan، ج4 ص136]."
  - term: "سُرُحٍ"
    text: "«والسُّرُح: السَّهلة السير» [@tabrizi-ashr، ص299]. وفي اللسان: «وناقةٌ سُرُحٌ ومُنْسَرِحة فِي سَيْرِهَا أَي سَرِيعَةٌ» [@lisan، ج2 ص479]."
  - term: "اسْتَعْرَضْتَهَا"
    text: "نظرتَ إليها من عُرْضها، أي من جانبها."
  - term: "فَتَلُ"
    text: "«تباعد مرفقيها عن جنبيها» [@tabrizi-ashr، ص299]."
syntax:
  - "جملة «جَاوَزْتُهَا» في محل رفع خبر للمبتدأ «بَلْدَةٍ» في البيت 33، وهو المجرور لفظًا بواو رُبَّ. والضمير «ها» يعود على البلدة، وهو الرابط بين المبتدأ وخبره."
  - "«بِطَلِيحٍ» متعلق بـ«جَاوَزْتُهَا»، والباء للاستعانة، أي جاوزتها راكبًا ناقة طليحًا. والموصوف محذوف: بناقةٍ طليح. و«جَسْرَةٍ» و«سُرُحٍ» صفتان لها."
  - "«فِي مِرْفَقَيْهَا ... فَتَلُ» جملة اسمية صفة رابعة: «فَتَلُ» مبتدأ مؤخر، و«فِي مِرْفَقَيْهَا» خبر مقدم. و«إِذَا اسْتَعْرَضْتَهَا» ظرف لما يُستقبل من الزمان، متعلق بمعنى الاستقرار في الخبر، وجوابه محذوف يدل عليه ما قبله."
morphology:
  - "«طَلِيح» على «فَعِيل» بمعنى «مَفْعُول»: أطلحها السير فهي طليح. وفي اللسان: «أطلحته أنا وطلّحته: حسرته» [@lisan، ج2 ص531]. وفعيل بمعنى مفعول يستوي فيه المذكر والمؤنث، فلذلك قال «طَلِيحٍ» ولم يقل طليحة."
  - "«سُرُح» صفة على «فُعُل»، و«جَسْرَة» على «فَعْلَة» من «جَسَر» إذا مضى وأقدم."
  - "«اسْتَعْرَضْتَ» على «اسْتَفْعَلْتَ» من «عَرَض»، أي طلبتَ عُرْضها لتنظر إليه. و«مِرْفَقَيْ» مثنى «مِرْفَق» حُذفت نونه للإضافة."
rhetoric:
  thesis: "بهذا البيت تكتمل صورة الرحلة: فلاة مهلكة (33)، لا يركبها إلا الخبير (34)، وقد قطعها الشاعر على ناقة متعبة لا تزال قوية. ويقول شوقي ضَيْف إنه في هذه الأبيات «يفخر بتحمله لمشقات السفر»، وإنه يقطع هذه الأرض «بناقة نضو أسفار ضامرة موثّقة الخلق صلبة قوية» [@deif، ج1 ص353]."
  devices:
    - title: "التضمين"
      text: "التضمين في تعريف ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]، أي ألا يتم معنى البيت إلا بما بعده. وهنا بدأ بـ«وَبَلْدَةٍ» في البيت 33، ووصفها بيتين، ثم جاء الخبر «جَاوَزْتُهَا» في أول هذا البيت. وهو ما أجازه ابن رَشِيق حين قال: «وربما حالت بين بيتي التضمين أبيات كثيرة بقدر ما يتسع الكلام وينبسط الشاعر في المعاني، ولا يضره ذلك إذا أجاد» [@ibn-rashiq، ج1 ص172]. وهو البناء نفسه الذي رأيناه في أبيات الروضة (12–14)."
    - title: "الخبر في صدر البيت"
      text: "وضع «جَاوَزْتُهَا» في أول البيت، فجاء الفعل الذي انتظره السامع بيتين دفعة واحدة، كأنه يقول بعد كل ذلك التهويل: ومع هذا قطعتُها."
    - title: "الجمع بين الإعياء والقوة"
      text: "وصف الناقة بـ«طَلِيحٍ» ثم بـ«جَسْرَةٍ سُرُحٍ»: أتعبتها الأسفار ولا تزال ماضية سهلة السير. فالإعياء دليل على كثرة ما قطعت، والقوة دليل على أصالتها. وهي قراءتنا."
    - title: "الالتفات إلى المخاطب"
      text: "في «إِذَا اسْتَعْرَضْتَهَا» انتقل من الحديث عن نفسه («جَاوَزْتُهَا») إلى مخاطبة السامع، كأنه يدعوه إلى أن ينظر إلى الناقة بعينه."
  connection: "ثم ينتقل من الفلاة إلى مشهد آخر: سحاب بات يرقبه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "جَاوَزْتُهَا / بِطَلِي / حِنْ جَسْرَتِنْ / سُرُحِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — فِي مِرْفَقَيْ / هَا إِذَسْ / تَعْرَضْتَهَا / فَتَلُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الأولى من الصدر فصارت «فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» كما يلتزم البسيط التام [@atiq، ص48]."
context: "آخر مقطع الفلاة والناقة (33–35)، وهو في الديوان البيت 33 [@diwan-asha، ص95]. ويلاحظ شوقي ضَيْف أن الأَعْشَى «لا يطيل فى وصف أعضاء الناقة صنيع طرفة، بل يقتضب الحديث عنها غالبا» [@deif، ج1 ص353–354]، وهذا ما نراه هنا: بيت واحد للناقة بعد بيتين للفلاة."
