first: "وَعُلِّقَتْنِي أُخَيْرَى مَا تُلَائِمُنِي"
second: "فَاجْتَمَعَ الْحُبُّ حُبٌّ كُلُّهُ تَبِلُ"
meaning: "وأحبّتني فتاة أخرى لا توافقني ولا أحبها، فاجتمع الحب كله، وكله حبٌّ مُهلك. قال التِّبْرِيزِيّ: «علقتني: معناه أحبَّتني، أي أحبتني ولم أحبها، والتي أحبها لا أصل إليها» [@tabrizi-ashr، ص294]."
vocabulary:
  - term: "أُخَيْرَى"
    text: "تصغير «أُخْرَى»، كما في اللسان [@lisan، ج4 ص14]."
  - term: "تُلَائِمُنِي"
    text: "«وتلائمني: توافقني» [@tabrizi-ashr، ص294]."
  - term: "تَبِلُ"
    text: "مُهلِك كأنه يطلب ثأرًا. قال التِّبْرِيزِيّ: «وتبل: كأنه أصيب بتبل، أي بذحل» [@tabrizi-ashr، ص294]. والتَّبْل والذَّحْل: الثأر والعداوة. ويقول محقق الديوان إن التبل كالوهل: «ذهاب العقل» [@diwan-asha، ص93]."
syntax:
  - "«وَعُلِّقَتْنِي» فعل ماض مبني للمجهول، والياء مفعول به ثانٍ، و«أُخَيْرَى» نائب الفاعل مرفوع بضمة مقدرة. وجملة «مَا تُلَائِمُنِي» صفة لها."
  - "«فَاجْتَمَعَ الْحُبُّ»: «الْحُبُّ» فاعل. وفي «حُبٌّ» ثلاثة أوجه ذكرها التِّبْرِيزِيّ: «وحب: مرفوع بدل من الحب، ويجوز أن يكون مرفوعا بمعنى كله حب تبل، ويجوز نصبه في الحال، كما تقول: جاء زيد رجلا صالحا» [@tabrizi-ashr، ص294]."
  - "«كُلُّهُ تَبِلُ» جملة اسمية: «كُلُّهُ» مبتدأ، و«تَبِلُ» خبره، والجملة صفة لـ«حُبٌّ»."
morphology:
  - "«أُخَيْرَى» تصغير «أُخْرَى» على «فُعَيْلَى». والتصغير هنا للتهوين: فتاة صغيرة الشأن عنده، لا يلتفت إليها."
  - "«تُلَائِم» مضارع «لاءَمَ» على «فاعَل»، و«تَبِل» صفة على «فَعِل»."
  - "«اجْتَمَعَ» على «افتعل» من «جَمَعَ»، وهو للمطاوعة: جمعه فاجتمع."
rhetoric:
  thesis: "آخر حلقة في السلسلة، وفيها المفارقة: هو نفسه محبوب لا يحب، فالصدّ الذي يشكوه من هُرَيْرَة يصنعه هو بغيره."
  devices:
    - title: "التصغير"
      text: "في «أُخَيْرَى» صغّر «أخرى» فجعل الفتاة التي تحبه صغيرة الشأن، كأنه يفعل بها ما تفعله هُرَيْرَة به."
    - title: "التكرار"
      text: "في «فَاجْتَمَعَ الْحُبُّ حُبٌّ» ذكر الحب معرفةً ثم نكرة: الأول الحب كله في هذه السلسلة، والثاني يصف نوعه: حب «كُلُّهُ تَبِلُ». فالتكرار ينقل الكلام من الجمع إلى الحكم."
  connection: "ثم يجمع السلسلة في حكم عام: فكلنا مغرم يهذي بصاحبه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَعُلْلِقَتْ / نِي أُخَيْ / رَى مَا تُلَا / ئِمُنِي = متفعلن / فاعلن / مستفعلن / فعِلن — فَجْتَمَعَلْ / حُبْبُ حُبْ / بُنْ كُلْلُهُو / تَبِلُو = مفتعلن / فاعلن / مستفعلن / فعِلن"
  note: "في أول العجز دخل الطَّيُّ، وهو حذف الرابع الساكن، «مستفعلن» فصارت «مستعلن»، وتُكتب مفتعلن [@atiq، ص47]. ودخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى من الصدر فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يختم الحلقات الثلاث: هو يحب هُرَيْرَة، وهي تحب رجلًا، والرجل تحبه فتاة، وهو تحبه أخرى. ويتخيل محقق الديوان في تلخيصه الأَعْشَى يضحك من هذه «المصادفات، التي ألفت بين هذه المجموعة من أصحاب الحب الفاشل» [@diwan-asha، ص92]."
variants:
