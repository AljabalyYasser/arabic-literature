    note: "بالنصب على الحال [@diwan-asha، ص93]، وهو الوجه الذي أجازه التِّبْرِيزِيّ."
  - reading: "فَاجْتَمَعَ الْحُبُّ حُبِّي كُلُّهُ تَبِلُ"
    status: "رواية أخرى"
    note: "قال التِّبْرِيزِيّ: «ويروى (فاجتمع الحب حبي كله تبل)» [@tabrizi-ashr، ص294]."
  - reading: "فَاجْتَمَعَ الْحُبُّ حُبٌّ كُلُّهُ خَبَلُ"
    status: "رواية اللسان"
    note: "[@lisan، ج4 ص14]. والخَبَل: الجنون وفساد العقل."
