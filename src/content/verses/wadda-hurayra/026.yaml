first: "فِي فِتْيَةٍ كَسُيُوفِ الْهِنْدِ قَدْ عَلِمُوا"
second: "أَنْ لَيْسَ يَدْفَعُ عَنْ ذِي الْحِيلَةِ الْحِيَلُ"
meaning: "غدوت إلى الحانوت مع فتيان كسيوف الهند في مضائهم وإشراقهم، قد عرفوا أن الحيلة لا تدفع عن صاحبها ما قُدّر عليه من الموت، فهم يبادرون إلى اللذات. قال التِّبْرِيزِيّ: «يقول: هم في صرامتهم كالسيوف» [@tabrizi-ashr، ص297]."
vocabulary:
  - term: "فِتْيَةٍ"
    text: "جمع فتى، وهو الشاب. قال التِّبْرِيزِيّ: «ويقال في جمع فتى: فتية، وفُتو، وفُتِى، وفِتِى، وفتيان» [@tabrizi-ashr، ص297]."
  - term: "كَسُيُوفِ الْهِنْدِ"
    text: "السيوف المصنوعة في الهند، وكانت أجود السيوف عندهم. قال البَغْداديّ: «وخصها بالهند لحسن صقالتها» [@khizana، ج8 ص392]، والصقالة: الجلاء واللمعان."
  - term: "الْحِيلَةِ"
    text: "الحذق وحسن التدبير للخلاص من الأمر."
syntax:
  - "قال البَغْداديّ: «وقوله: في فتية إلخ متعلق بغدوت في البيت المتقدم. وفي بمعنى مع» [@khizana، ج8 ص392]. و«كَسُيُوفِ الْهِنْدِ» صفة لـ«فِتْيَةٍ»، وجملة «قَدْ عَلِمُوا» صفة ثانية."
  - "«أَنْ» مخففة من الثقيلة، واسمها ضمير الشأن محذوف، وجملة «لَيْسَ يَدْفَعُ ... الْحِيَلُ» خبرها. ونقل البَغْداديّ عن السِّيرافيّ أن التقدير: «أنه ليس يدفع» [@khizana، ج8 ص391]. والجملة كلها سدّت مسدّ مفعولي «عَلِمُوا»."
  - "«لَيْسَ» فعل ناقص، واسمها ضمير الشأن، و«الْحِيَلُ» فاعل «يَدْفَعُ» مؤخر، والجملة الفعلية خبر «ليس». و«عَنْ ذِي الْحِيلَةِ» متعلق بـ«يَدْفَعُ»."
morphology:
  - "«فِتْيَة» جمع «فَتًى» على «فِعْلة»، وهو من جموع القلة."
  - "«الْحِيلَة» على «فِعْلة» من «حال يحول»، قُلبت واوها ياءً لسكونها بعد كسرة، وجمعها «حِيَل» على «فِعَل»."
  - "«أَنْ» المخففة أصلها «أَنَّ»، فلما خُففت لم يظهر اسمها، وقُدّر ضمير الشأن، وهو ضمير يُراد به القصة أو الأمر."
rhetoric:
  thesis: "يعطي اللهو حجة: الموت لا تدفعه حيلة، فالعاقل من يأخذ نصيبه من اللذة قبل أن يفوته. وهي الحجة التي جعلها طَرَفَة في معلقته جوابًا للائمه."
  devices:
    - title: "التشبيه"
      text: "في «فِتْيَةٍ كَسُيُوفِ الْهِنْدِ» شبّه الفتيان بالسيوف. قال البَغْداديّ: «يريد أنهم كالسيوف في المضاء والعزم أو في صباحة الوجه تبرق كالسيوف» [@khizana، ج8 ص392]، فيحتمل وجه الشبه المضاء والإشراق معًا."
    - title: "الحكمة في آخر البيت"
      text: "جعل العجز حكمًا عامًا: «أَنْ لَيْسَ يَدْفَعُ عَنْ ذِي الْحِيلَةِ الْحِيَلُ». وكرر الجذر نفسه في «الْحِيلَةِ» و«الْحِيَلُ»: صاحب الحيلة لا تنفعه الحيل، فتنقلب الكلمة على صاحبها."
  connection: "ثم يصف ما يتداولونه في المجلس: الريحان والخمر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "فِي فِتْيَتِنْ / كَسُيُو / فِلْهِنْدِ قَدْ / عَلِمُو = مستفعلن / فعِلن / مستفعلن / فعِلن — أَنْ لَيْسَ يَدْ / فَعُ عَنْ / ذِلْحِيلَةِلْ / حِيَلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية في الشطرين فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "في متن التِّبْرِيزِيّ عجز آخر: «أَنْ هَالِكٌ كُلُّ مَنْ يَحْفَى وَيَنْتَعِلُ»، وذكر العجز الذي أثبتناه رواية أخرى [@tabrizi-ashr، ص297]. والذي أثبتناه رواية الديوان [@diwan-asha، ص95] و«الأغاني» [@aghani-dk، ج9 ص153]، ونقل البَغْداديّ عن السِّيرافيّ أن في كتاب أبي بكر مَبْرَمان: «هذا المصراع معمول أي: مصنوع والثابت المروي: أن ليس يدفع عن ذي الحيلة الحيل» [@khizana، ج8 ص391]. ويصف شوقي ضَيْف هؤلاء بأنهم «فتية كسيوف الهند مضاء وقوة ورونقا» [@deif، ج1 ص356]."
variants:
  - reading: "أَنْ هَالِكٌ كُلُّ مَنْ يَحْفَى وَيَنْتَعِلُ"
    status: "متن التِّبْرِيزِيّ، وبه استشهد سِيبَوَيْه"
    note: "استشهد به سِيبَوَيْه على «أن» المخففة: «فإن هذا على إضمار الهاء» [@sibawayh، ج2 ص137]. ويرى ابن المُسْتَوْفِي أنه من صنع النحويين: «ولا شك أن النحويين غيروه ليقع الاسم بعد أن المخففة مرفوعا» [@khizana، ج8 ص391]. ومعناه عند البَغْداديّ أن الموت يعم الفقير الحافي والغني المنتعل [@khizana، ج8 ص393]. وفيه تكرار لقافية البيت 22 «مَا نَحْفَى وَنَنْتَعِلُ» بلفظها تقريبًا."
  - reading: "أَنْ لَيْسَ يَدْفَعُ عَنْ ذِي الْحِيلَةِ الْأَجَلُ"
    status: "رواية أخرى"
    note: "ذكرها التِّبْرِيزِيّ بعد الرواية السابقة: «و (الأجل)» [@tabrizi-ashr، ص297]، أي إن الحيلة لا تدفع الموت."
