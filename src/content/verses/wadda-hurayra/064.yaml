first: "قَدْ نَخْضِبُ الْعَيْرَ فِي مَكْنُونِ فَائِلِهِ"
second: "وَقَدْ يَشِيطُ عَلَى أَرْمَاحِنَا الْبَطَلُ"
meaning: "كثيرًا ما نطعن حمار الوحش في موضع دمه المستور من فخذه فنخضبه بدمه، وكثيرًا ما يهلك البطل على رماحنا. فرماحهم تصيب المقتل، في الصيد وفي الحرب. قال التِّبْرِيزِيّ: «الفائل: عرق يجري من الجوف إلى الفخذ، ومكنون الفائل: الدم»، و«ويشيط: يهلك» [@tabrizi-ashr، ص307]."
vocabulary:
  - term: "نَخْضِبُ"
    text: "نصبغ، والمراد: نصبغه بدمه."
  - term: "الْعَيْرَ"
    text: "حمار الوحش. ويقول محقق الديوان: «العير حمار الوحش» [@diwan-asha، ص99]."
  - term: "مَكْنُونِ فَائِلِهِ"
    text: "المكنون: المستور، والفائل: عرق في الفخذ. وذكر التِّبْرِيزِيّ أقوالًا: «وقال أبو عمرو: المكنون خُربة في الفخذ، والفائل: لحم الخُربة، والخُرْبة والخرابة: دائرة في الفخذ لا عظم عليها، وقال أبو عبيدة: الفائل عِرْق في الفخذ ليس حواليه عظم» [@tabrizi-ashr، ص307]."
  - term: "يَشِيطُ"
    text: "يهلك. «ويشيط: يهلك، وقيل: يرتفع، وأصله في كل شيء الظهور» [@tabrizi-ashr، ص307]. وفي اللسان: «وشاطَ الرجلُ يَشيطُ: هلَك» [@lisan، ج7 ص338]."
syntax:
  - "«قَدْ» حرف تحقيق، ودخل على المضارع هنا لإفادة التكثير، لأن المقام فخر. و«نَخْضِبُ» مضارع، و«الْعَيْرَ» مفعول به، و«فِي مَكْنُونِ» متعلق بـ«نَخْضِبُ»، أي نطعنه في ذلك الموضع فنخضبه."
  - "«وَقَدْ يَشِيطُ» معطوف على الجملة الأولى، و«الْبَطَلُ» فاعل «يَشِيطُ» مؤخر، و«عَلَى أَرْمَاحِنَا» متعلق به."
morphology:
  - "«يَشِيطُ» مضارع «شاط» الأجوف اليائي، و«فَائِل» على «فاعِل»، قُلبت عينه همزة لوقوعها بعد ألف."
  - "«مَكْنُون» اسم مفعول من «كَنَّ» إذا ستر، و«أَرْمَاح» جمع «رُمْح» على «أَفْعَال»."
rhetoric:
  thesis: "خاتمة القصيدة في ترتيب التِّبْرِيزِيّ: بعد القسم والوعيد والتذكير بيوم العين، يختم بصورة الطعنة المحكمة، فتنتهي الرسالة إلى يَزِيد بحدّ الرمح."
  devices:
    - title: "قراءتان للعير"
      text: "يقرأ محقق الديوان «الْعَيْرَ» على حقيقته: حمار الوحش يُصاد، ويجعل البيت فخرًا بحذق الطعن: «والفارس الحاذق يتعمد الطعن فى الخربة، وهى نقرة فى الورك لا عظم فيها تنفذ الى الجوف» [@diwan-asha، ص99]. ويوافقه ما في اللسان: «وَذَلِكَ أَن الْفَارِسَ إِذا حَذَق الطَّعْنَ قَصَدَ الخُرْبةَ لأَنه لَيْسَ دُونَ الجَوف عَظْمٌ، ومَكْنون فائِله دمُه الَّذِي قَدْ كُنَّ فِيهِ» [@lisan، ج11 ص536]. ويرى شوقي ضَيْف أنه استعارة للفارس من الأعداء: «العير: حمار الوحش استعاره الفارس لأن العير يتقدم الأتن» [@deif، ج1 ص353]، والأُتُن: إناث الحمر. فعلى الأول يكون الصدر صيدًا والعجز حربًا، وعلى الثاني يكون البيت كله حربًا."
    - title: "تكرار «قد»"
      text: "بدأ الصدر بـ«قَدْ نَخْضِبُ» والعجز بـ«وَقَدْ يَشِيطُ»، فصار البيت قسمين متوازيين، كل منهما خبر عن عادة لقومه."
    - title: "الكناية"
      text: "«نَخْضِبُ الْعَيْرَ فِي مَكْنُونِ فَائِلِهِ» كناية عن إصابة المقتل: لم يقل «نقتله»، بل ذكر موضع الطعنة ولون الدم. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "قَدْ نَخْضِبُلْ / عَيْرَ فِي / مَكْنُونِ فَا / ئِلِهِي = مستفعلن / فاعلن / مستفعلن / فعِلن — وَقَدْ يَشِي / طُ عَلَى / أَرْمَاحِنَلْ / بَطَلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» و«فاعلن» الأوليين من العَجُز فصارتا «متفعلن» و«فعِلن» [@atiq، ص46]. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، مخبونان «فعِلن» [@atiq، ص48]."
context: "آخر القصيدة عند التِّبْرِيزِيّ، وهو في الديوان البيت 60، وفيه «مِنْ مَكْنُونِ فَائِلِهِ» [@diwan-asha، ص99]. ويقول محقق الديوان: «ومن روى (قد نطعن العير فى مكنون) فقد أخطأ، اذ كيف يطعن فى الدم» [@diwan-asha، ص99]. وأنشده ابن منظور شاهدًا على «الفائل» [@lisan، ج11 ص535]."
variants:
  - reading: "قَدْ نَخْضِبُ الْعَيْرَ مِنْ مَكْنُونِ فَائِلِهِ"
    status: "رواية الديوان ولسان العرب في مادة فيل"
    note: "هي رواية الديوان [@diwan-asha، ص99] واللسان [@lisan، ج11 ص535]. وبها أنشده شوقي ضَيْف [@deif، ج1 ص353]. وعليها يكون الخضاب بالدم الخارج من الفائل."
