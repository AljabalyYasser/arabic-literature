first: "وَقَدْ أَقُودُ الصِّبَا يَوْمًا فَيَتْبَعُنِي"
second: "وَقَدْ يُصَاحِبُنِي ذُو الشِّرَّةِ الْغَزِلُ"
meaning: "وكثيرًا ما كنت أقود اللهو والصبوة فيتبعني، ويصحبني صاحب النشاط المحب للغزل. قال التِّبْرِيزِيّ: «الغزل: الذي يحبُّ الغزل» [@tabrizi-ashr، ص296]."
vocabulary:
  - term: "الصِّبَا"
    text: "الميل إلى اللهو والنساء."
  - term: "الشِّرَّةِ"
    text: "النشاط والحدّة. وفي اللسان: «وشرة الشباب: حرصه ونشاطه» [@lisan، ج4 ص401]."
  - term: "الْغَزِلُ"
    text: "المحب للغزل، أي لحديث النساء ومغازلتهن [@tabrizi-ashr، ص296]."
syntax:
  - "«قَدْ» مع المضارع للتكثير، و«الصِّبَا» مفعول به لـ«أَقُودُ» منصوب بفتحة مقدرة، و«يَوْمًا» ظرف زمان."
  - "«فَيَتْبَعُنِي» معطوف على «أَقُودُ» بالفاء التي تدل على التعقيب: يتبعه الصبا حالما يقوده."
  - "«ذُو» فاعل «يُصَاحِبُنِي» مرفوع بالواو لأنه من الأسماء الخمسة، و«الشِّرَّةِ» مضاف إليه، و«الْغَزِلُ» صفة لـ«ذُو»."
morphology:
  - "«الصِّبَا» مصدر «صَبَا يَصْبُو» إذا مال إلى اللهو، وهو مقصور."
  - "«الشِّرَّة» على «فِعْلة» من «شَرَّ»، و«الْغَزِل» صفة على «فَعِل» من «غَزِلَ»."
  - "«يُصَاحِب» مضارع «صاحَبَ» على «فاعَل» للمشاركة."
rhetoric:
  thesis: "لم يكن تابعًا للهو، بل كان قائده. فهذا ردّه على من رأته أعشى ضعيفًا: كان في شبابه إمام الصبا."
  devices:
    - title: "الاستعارة"
      text: "في «أَقُودُ الصِّبَا ... فَيَتْبَعُنِي» جعل الصبا كائنًا يُقاد كما تُقاد الدابة أو الرجل، فيتبع قائده. والاستعارة عند عبد القاهر الجُرْجانيّ أن تُترك المقارنة الصريحة و«تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "تكرار «وَقَدْ»"
      text: "بدأ بها البيت 23، وتكررت مرتين في هذا البيت، وتعود في أول البيت 25. فتأتي الذكريات متتابعة على إيقاع واحد، كل واحدة تفتحها «وَقَدْ»."
  connection: "ثم يأتي بأشهر صور اللهو عنده: الغدوّ إلى الحانوت."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "وَقَدْ أَقُو / دُصْصِبَا / يَوْمَنْ فَيَتْ / بَعُنِي = متفعلن / فاعلن / مستفعلن / فعِلن — وَقَدْ يُصَا / حِبُنِي / ذُشْشِرْرَةِلْ / غَزِلُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يصل بين مغامرة البيت 23 ومجلس الشرب الذي يبدأ في البيت 25. وفي نسخة الشاملة للتِّبْرِيزِيّ «يُصَاحِبْنِي» بالسكون، وهو خطأ في الطبع، والصواب «يُصَاحِبُنِي» كما في الديوان [@diwan-asha، ص95]."
variants:
