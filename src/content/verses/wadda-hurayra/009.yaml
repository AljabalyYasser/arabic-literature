first: "نِعْمَ الضَّجِيعُ غَدَاةَ الدَّجْنِ يَصْرَعُهَا"
second: "لِلَذَّةِ الْمَرْءِ لَا جَافٍ وَلَا تَفِلُ"
meaning: "هي نِعْمَ الضجيعةُ في صباح يوم غائم، حين يصرعها مضاجعها على الفراش للذة الرجل: ليست غليظة جافية، ولا كريهة الرائحة. قال التِّبْرِيزِيّ: «الدجن: إلباس الغيم السماء، وقيل: معنى (للذة المرء) كناية عن الوطء»، ثم: «وقوله (لا جاف) أي لا غليظ، والتفل: المنتن الرائحة، وقيل: هو الذي لا يتطيب» [@tabrizi-ashr، ص291]. والوطء: الجماع. أما محقق الديوان فيقرأ البيت أمنيةً لا خبرًا: «فيود لو أنه خلا بها، فصرعها في غداة يوم غائم مطير، وأشبع نهمه وأرضى لذته بجسمها الريان» [@diwan-asha، ص92]."
vocabulary:
  - term: "الضَّجِيعُ"
    text: "المضاجع في الفراش، ويقال للرجل والمرأة: «والضجيع: المضاجع، والأنثى مضاجع وضجيعة» [@lisan، ج8 ص219]."
  - term: "غَدَاةَ"
    text: "أول النهار."
  - term: "الدَّجْنِ"
    text: "«الدجن: إلباس الغيم السماء» [@tabrizi-ashr، ص291]، وفي اللسان: «الدجن: ظل الغيم في اليوم المطير» [@lisan، ج13 ص147]."
  - term: "يَصْرَعُهَا"
    text: "يطرحها ويضجعها."
  - term: "جَافٍ"
    text: "«أي لا غليظ» [@tabrizi-ashr، ص291]."
  - term: "تَفِلُ"
    text: "«المنتن الرائحة، وقيل: هو الذي لا يتطيب» [@tabrizi-ashr، ص291]، وفي اللسان: «رجل تفل أي غير متطيب» [@lisan، ج11 ص77]."
syntax:
  - "«نِعْمَ الضَّجِيعُ»: «نِعْمَ» فعل ماضٍ جامد للمدح، و«الضَّجِيعُ» فاعله، والمخصوص بالمدح محذوف تقديره «هي»، يعود على هُرَيْرَة."
  - "«غَدَاةَ الدَّجْنِ»: ظرف زمان منصوب مضاف، متعلق بـ«يصرعها»."
  - "«يَصْرَعُهَا»: جملة في موضع الحال، والهاء لهُرَيْرَة، وفاعل «يصرع» ضمير مستتر يعود على مضاجعها المفهوم من «الضجيع». وعلى رواية «تَصْرَعُهُ» التي يذكرها التِّبْرِيزِيّ [@tabrizi-ashr، ص291] تكون هي الفاعلة، والهاء للضجيع."
  - "«لِلَذَّةِ الْمَرْءِ»: جار ومجرور متعلق بـ«يصرعها»، واللام للتعليل."
  - "«لَا جَافٍ وَلَا تَفِلُ»: خبر لمبتدأ محذوف، أي: هي لا جافٍ ولا تفِلٌ، وجاءت الصفتان مذكرتين حملًا على لفظ «الضجيع». و«لا» نافية غير عاملة، ويلزم تكرارها إذا دخلت على الخبر أو الصفة. و«جافٍ» اسم منقوص مرفوع بضمة مقدّرة على الياء المحذوفة."
morphology:
  - "«الضَّجِيع» على «فَعِيل» بمعنى «مُفاعِل»."
  - "«جَافٍ» اسم فاعل من «جَفَا يَجْفُو»، ناقص واوي، حُذفت لامه مع التنوين."
  - "«تَفِل» صفة مشبهة على «فَعِل»، من «تَفِلَ» إذا ترك الطيب: «والتفل: ترك الطيب» [@lisan، ج11 ص77]."
  - "«لَذَّة» على «فَعْلة» من «لَذَّ»."
rhetoric:
  thesis: "في هذا البيت ينتقل وصف هُرَيْرَة من جسدها كما يُرى إلى جسدها في الخلوة: يمدحها بأنها نعم الضجيع، ويذكر يوم الغيم واللذة، ثم ينفي عنها صفتين تُكرهان في المرأة."
  devices:
    - title: "الكناية"
      text: "«يَصْرَعُهَا لِلَذَّةِ الْمَرْءِ» لم يسمّ فيه الفعل، بل ذكر ما قبله، الصرع، وغايته، اللذة، فدلّ بهما عليه، ولذلك قال التِّبْرِيزِيّ إن «للذة المرء» «كناية عن الوطء» [@tabrizi-ashr، ص291]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "حذف المخصوص بالمدح"
      text: "قال «نِعْمَ الضَّجِيعُ» ولم يقل «هي»؛ فالسامع يعرف من يعني، والحذف يجعل الحكم كأنه حكم عام عليها. وهذا من الحذف الذي قال فيه عبد القاهر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "اختيار الوقت"
      text: "«غَدَاةَ الدَّجْنِ»: يوم الغيم والمطر يوم يلزم فيه الناس بيوتهم، فهو عندهم يوم اللهو، كما قال طَرَفة في معلقته (59): «وَتَقْصِيرُ يَوْمِ الدَّجْنِ وَالدَّجْنُ مُعْجِبٌ / بِبَهْكَنَةٍ تَحْتَ الْخِبَاءِ الْمُعَمَّدِ». وهذه الصلة بين البيتين قراءتنا."
    - title: "الاحتراس بالنفي"
      text: "بعد المدح جاء «لَا جَافٍ وَلَا تَفِلُ» ينفي ما يفسد الخلوة: الغلظ ورائحة الجسد. ومثله عند امرئ القَيْس في «ألا عم صباحًا»: «تميل عليه هونة غير مجبال»، أي غير غليظة، وفي رواية اللسان «غير متفال»، أي غير منتنة. والاحتراس أن يُزاد في الكلام ما يدفع عنه وهمًا لا يريده المتكلم."
  connection: "ثم يعود إلى صفة جسمها في البيت العاشر: «هركولة فنق درم مرافقها»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "نِعْمَضْ ضَجِي / عُ غَدَا / ةَدْدَجْنِ يَصْ / رَعُهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — لِلَذْذَتِلْ / مَرْءِ لَا / جَافِنْ وَلَا / تَفِلُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «فاعلن» الثانية من الصدر فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن» [@atiq، ص46]. والعروض والضرب «فعِلن» [@atiq، ص48]."
context: "يأتي بعد صورتها المتقابلة «صفر الوشاح وملء الدرع» (8)، وهو في الديوان البيت الحادي عشر [@diwan-asha، ص91]. وتليه أبيات تكمل صفة جسمها ثم رائحتها، فالبيت في وسط الوصف لا في آخره. وشرح محقق الديوان ألفاظه: «الدجن اليوم الغائم أو الممطر. جاف غلظ غير رقيق. تفل منتن غير متطيب» [@diwan-asha، ص91]. وهُرَيْرَة في روايتي خبرها قينة، أي جارية مغنية [@tabrizi-ashr، ص288] [@aghani-dk، ج9 ص113]. ويرى شوقي ضَيْف أن غزل الأَعْشَى يمتاز «من ناحية بأنه حسى مادى» ومن ناحية أخرى برقته المفرطة [@deif، ج1 ص362]، ويذكر أن ابن سَلّام قرنه بامرئ القَيْس فيمن «كان يتعهر ولا يبقى على نفسه ولا يتستر» [@deif، ج1 ص338]."
