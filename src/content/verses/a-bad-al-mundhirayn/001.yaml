explained: false
first: "أَبَعْدَ الْمُنْذِرَيْنِ أَرَى سَوَامًا"
second: "تَرَوَّحُ بِالْخَوَرْنَقِ وَالسَّدِيرِ"
vocabulary:
  - term: "سَوَامًا"
    text: "«والسوام والسائمة: الإبل الراعية» [@lisan، ج12 ص311]."
  - term: "تَرَوَّحُ"
    text: "تعود في المساء؛ ورواح الإبل «أن تأوي بعد غروب الشمس إلى مراحها» [@lisan، ج2 ص464]."
  - term: "الْخَوَرْنَقِ"
    text: "«اسم قصر بالعراق، فارسي معرب، بناه النعمان الأكبر» [@lisan، ج10 ص79]."
  - term: "السَّدِيرِ"
    text: "قصر آخر؛ «والسدير: بناء»، «وقال الأصمعي: السدير فارسية كان أصله سادل أي قبة في ثلاث قباب متداخلة» [@lisan، ج4 ص355]."
