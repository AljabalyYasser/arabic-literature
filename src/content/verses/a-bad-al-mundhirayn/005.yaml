first: "وَكُنَّا لَا يُرَامُ لَنَا حَرِيمٌ"
second: "فَنَحْنُ كَضَرَّةِ الضَّرْعِ الْفَخُورِ"
vocabulary:
  - term: "كَضَرَّةِ الضَّرْعِ الْفَخُورِ"
    text: "«وضرة الضرع: لحمها» [@lisan، ج4 ص487]، والفَخُور من الإبل: «العظيمة الضرع القليلة اللبن» [@lisan، ج5 ص49]. أي صرنا ضرعًا كبيرًا لا لبن فيه: هيبة بلا نفع."
