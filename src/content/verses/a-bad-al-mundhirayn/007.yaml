explained: false
first: "كَذَاكَ الدَّهْرُ دَوْلَتُهُ سِجَالٌ"
second: "فَيَوْمٌ مِنْ مَسَاةٍ أَوْ سُرُورِ"
vocabulary:
  - term: "سِجَالٌ"
    text: "مرة لك ومرة عليك؛ وفي قولهم «الحرب بيننا سجال»: «معناه أنا ندال عليه مرة ويدال علينا أخرى» [@lisan، ج11 ص325]."
  - term: "مَسَاةٍ"
    text: "مَساءة، أي ما يسوء، خُففت همزتها، وهي كذلك «مساة» في «المعمرين» [@muammarun، ص48]."
