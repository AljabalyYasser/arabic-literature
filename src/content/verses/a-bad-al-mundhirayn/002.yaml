explained: false
first: "وَبَعْدَ فَوَارِسِ النُّعْمَانِ أَرْعَى"
second: "قَلُوصًا بَيْنَ مُرَّةَ وَالْحَفِيرِ"
vocabulary:
  - term: "قَلُوصًا"
    text: "«القلوص أول ما يركب من إناث الإبل إلى أن تثني» [@lisan، ج7 ص81]."
  - term: "مُرَّةَ وَالْحَفِيرِ"
    text: "موضعان. والحَفِير عند ياقوت «موضع بين مكة والمدينة» [@yaqut-buldan، ج2 ص276]، وهو اسم لمواضع أخرى كثيرة يعدّها، منها «أول منزل من البصرة لمن يريد مكة» [@yaqut-buldan، ج2 ص277]، ولا يذكر بيت ابن بُقَيْلة في شيء منها، ولم نجد عنده «مُرّة» اسمًا لموضع، فلا نعرف أيّ حفير أراد. والمعنى أنه صار يرعى ناقة صغيرة بين موضعين، بعد أن كان في جوار الملوك."
