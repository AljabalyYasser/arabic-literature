explained: false
first: أُقَسِّمُ جِسْمِي فِي جُسُومٍ كَثِيرَةٍ
second: وَأَحْسُو قَرَاحَ المَاءِ وَالمَاءُ بَارِدُ
vocabulary:
- term: أُقَسِّمُ جِسْمِي
  text: 'قال ابن السِّكِّيت: «جسمُهُ هاهنا: طعامه، يقول: أقسّم ما أريد أن أطعمه في محاويج قومي ومن يلزمني حقه والضيفان» [@diwan-urwa، ص69].'
- term: قَرَاحَ المَاءِ وَالمَاءُ بَارِدُ
  text: '«والماء القراح: الذي لا يخلطه لبن ولا غيره، وقوله: والماء بارد، أي: في الشتاء فذاك أشد» [@diwan-urwa، ص69].'
- term: أَحْسُو
  text: 'أشرب شيئًا بعد شيء، «حسا الماء: شربه شيئا بعد شئ» [@deif، ج1 ص384].'
