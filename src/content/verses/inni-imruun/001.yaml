first: إِنِّي امْرُؤٌ عَافِي إِنَائِيَ شِرْكَةٌ
second: وَأَنْتَ امْرُؤٌ عَافِي إِنَائِكَ وَاحِدُ
vocabulary:
- term: عَافِي إِنَائِيَ شِرْكَةٌ
  text: 'العافي: طالب المعروف. قال ابن السِّكِّيت: «عافي إنائي، أي: يأتيني من يشركني فيه، يقول: أملأ إنائي لبنًا حتى يفيض ويكثر، فإن طرقني إنسان وجد ذلك مهيأ له»، «وأنت امرؤ عافي إنائك واحد، أي: تستأثر لنفسك وحدك دون أضيافك» [@diwan-urwa، ص68].'
