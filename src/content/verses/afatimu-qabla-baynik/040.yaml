explained: false
first: "فَرُحْتُ بِهَا تُعَارِضُ مُسْبَطِرًّا"
second: "عَلَى صَحْصَاحِهِ وَعَلَى الْمُتُونِ"
vocabulary:
  - term: "مُسْبَطِرًّا"
    text: "الطريق الممتد [@mufaddaliyyat، ص292، الحاشية]."
  - term: "تُعَارِضُ"
    text: "تأخذ في عرضه، أي تسير بإزائه [@mufaddaliyyat، ص292، الحاشية]."
  - term: "صَحْصَاحِهِ"
    text: "ما استوى من الأرض [@mufaddaliyyat، ص292، الحاشية]."
  - term: "الْمُتُونِ"
    text: "جمع متن، وهو ما صلب من الأرض وغلظ [@mufaddaliyyat، ص292، الحاشية]."
