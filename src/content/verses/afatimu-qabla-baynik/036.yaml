first: "تَقُولُ إِذَا دَرَأْتُ لَهَا وَضِينِي"
second: "أَهَذَا دِينُهُ أَبَدًا وَدِينِي"
meaning: "إذا بسطتُ لها حزام رحلها لأشدّه عليها قالت: أهذه عادته معي أبدًا، وهذه عادتي؟ والناقة لا تتكلم، وإنما هذا ما تقوله لو قدرت: «يريد: لو قدرت لقالت: أهذا ديني ودينه أبدًا؟» [@tabrizi-ikhtiyarat، ج3 ص1263]."
vocabulary:
  - term: "دَرَأْتُ"
    text: "«ودَرَأْتُ وضِينَ البعيرِ إِذَا بَسَطْتَه عَلَى الأَرضِ ثُمَّ أَبْرَكْته عَلَيْهِ لِتَشُدَّه بِهِ» [@lisan، ج1 ص75]. وفي شرح التبريزي: «ومعنى \"درأتُ\": دفعتُ، وأزلتُ الشيءَ عن موضعه» [@tabrizi-ikhtiyarat، ج3 ص1263]."
  - term: "وَضِينِي"
    text: "الوضين للرَّحْل بمنزلة الحزام للسرج، كما في حاشية المحققين [@mufaddaliyyat، ص290، الحاشية]."
  - term: "دِينُهُ"
    text: "عادته. «والدِّينُ: الْعَادَةُ والشأْن، تَقُولُ الْعَرَبُ: مَا زالَ ذَلِكَ دِيني ودَيْدَني أَي عَادَتِي» [@lisan، ج13 ص169]، وأنشد البيت."
context: "به تبدأ شكوى الناقة، وتتمّ في البيت التالي: «أكلَّ الدهر حلٌّ وارتحالٌ؟». وقد قال في البيت 35 إنها تتأوّه «آهة الرجل الحزين» إذا قام يرحلها بليل، فهذا تأوّهها مفسَّرًا بالكلام. وهو من الأبيات التي اختارها ابن سلّام [@ibn-sallam، ج1 ص273]، ووقف عنده المرزباني في «الموشّح»."
syntax:
  - "«تقولُ» فعل مضارع، وفاعله ضمير الناقة. و«إذا درأتُ لها وضيني» ظرف لما يُستقبل متضمن معنى الشرط، وجوابه محذوف دلّ عليه «تقول» المتقدم."
  - "«أهذا دينُه أبدًا وديني» جملة في محل نصب مقول القول، «وهذه الجملة حكاية لكلامها، لو حصل» [@tabrizi-ikhtiyarat، ج3 ص1263]."
  - "الهمزة للاستفهام، و«هذا» مبتدأ، و«دينُه» خبره، و«أبدًا» ظرف زمان متعلق بمعنى الكلام، و«وديني» معطوف على «دينه»."
morphology:
  - "«دَرَأْتُ» من «دَرَأَ يَدْرَأُ»، مهموز اللام، وأصله الدفع."
  - "«الوَضِين» على «فَعِيل»، وجمعه «وُضُن»."
  - "«الدِّين» على «فِعْل»، وجمعه في اللسان «أديان»."
rhetoric:
  thesis: "الناقة تتكلم: يجعل الشاعر تعبها شكوى بلسانها، فيرى السامع رحلاته المتصلة بعين من يحمله فيها."
  devices:
    - title: "المجاز: إنطاق الناقة"
      text: "في «تَقُولُ» جعل الناقة قائلة وهي لا تقول. يقول المرزباني: «ومن الحكايات الغلقة والإشارات البعيدة قول المثقب فى صفة ناقته»، ثم يقول: «فهذه الحكاية عن ناقته من المجاز المباعد للحقيقة، وإنما أراد الشاعر أن الناقة لو تكلمت لأعربت عن شكواها بمثل هذا القول»، ويقابله ببيت عنترة في فرسه: «لو كان يدرى ما المحاورة اشتكى»، ويجعل بيت عنترة «الذى يقارب الحقيقة» [@muwashshah، ص121]. فعنترة شرط الشكوى بأن يعرف الفرس الكلام، والمثقّب أنطق ناقته بلا شرط."
    - title: "الاستفهام"
      text: "«أَهَذَا دِينُهُ» استفهام معناه الشكوى والإنكار: لا تسأل عن عادته، بل تنكر أن تكون الرحلة دائمة."
    - title: "الإشارة"
      text: "قال التبريزي: «وأشار بقوله \"أهذا\" إلى ما استمرّت به عادته معها» [@tabrizi-ikhtiyarat، ج3 ص1263]. فاسم الإشارة القريب يجعل التعب كله حاضرًا أمام العين."
  connection: "وتمضي شكواها في البيت التالي: «أكلَّ الدهر حلٌّ وارتحالٌ؟ أما يُبقي عليّ وما يقيني؟»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون المكسورة، يليها وصلٌ بالياء، وقبلها مدّ بالياء أو بالواو هو الرِّدْف"
  scansion: "تَقُولُ إِذَا / دَرَأْتُ لَهَا / وَضِينِي = مفاعَلَتن / مفاعَلَتن / فعولن — أَهَاذَا دِي / نُهُو أَبَدَنْ / وَدِينِي = مفاعَلْتن / مفاعَلَتن / فعولن"
  note: "دخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، أولَ العجز، وأُشبعت ضمة الهاء في «دينُهُ» فصارت «دينُهُو». الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر، و«فعولن» في آخر الشطر أصلها «مفاعلتن» دخلها القَطْف، «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]."
variants:
