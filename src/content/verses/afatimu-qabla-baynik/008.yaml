explained: false
first: "يُشَبَّهْنَ السَّفِينَ وَهُنَّ بُخْتٌ"
second: "عُرَاضَاتُ الْأَبَاهِرِ وَالشُّؤُونِ"
vocabulary:
  - term: "بُخْتٌ"
    text: "إبل طوال الأعناق [@mufaddaliyyat، ص288، الحاشية]."
  - term: "عُرَاضَاتُ الْأَبَاهِرِ"
    text: "عريضات الظهور، والأبهر في الأصل عرق في الظهر [@mufaddaliyyat، ص288، الحاشية]."
  - term: "الشُّؤُونِ"
    text: "جمع شأن، وهي شُعَب عظام الرأس التي تجري منها الدموع إلى العينين [@mufaddaliyyat، ص288، الحاشية]."
