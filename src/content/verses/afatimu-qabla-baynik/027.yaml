explained: false
first: "كَأَنَّ نَفِيَّ مَا تَنْفِي يَدَاهَا"
second: "قِذَافُ غَرِيبَةٍ بِيَدَيْ مُعِينِ"
vocabulary:
  - term: "نَفِيَّ مَا تَنْفِي يَدَاهَا"
    text: "ما تطرده يداها من الحصى في سيرها."
  - term: "قِذَافُ غَرِيبَةٍ"
    text: "شبّه ما تنفي يداها من الحصى بحجارة يُرمى بها ناقة غريبة أتت حوضًا غير حوضها لتشرب منه [@mufaddaliyyat، ص291، الحاشية]."
  - term: "مُعِينِ"
    text: "الأجير، أو المستعان به. وينقل المحققان أن الأصمعي سئل عن المعين بمعنى الأجير فقال إنه لا يعرفه، ولعلها لغة أهل البحرين [@mufaddaliyyat، ص291، الحاشية]."
