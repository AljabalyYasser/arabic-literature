explained: false
first: "فَأَبْقَى بَاطِلِي وَالْجِدُّ مِنْهَا"
second: "كَدُكَّانِ الدَّرَابِنَةِ الْمَطِينِ"
vocabulary:
  - term: "بَاطِلِي"
    text: "ركوبي إياها في طلب اللهو والغزل [@mufaddaliyyat، ص292، الحاشية]."
  - term: "وَالْجِدُّ مِنْهَا"
    text: "انكماشها في السير [@mufaddaliyyat، ص292، الحاشية]."
  - term: "كَدُكَّانِ الدَّرَابِنَةِ الْمَطِينِ"
    text: "الدكّان الدكّة المبنية للجلوس، والدرابنة البوّابون، واحدهم دَرْبان، فارسي معرّب، والمطين المطليّ بالطين. يريد أنها وإن أتعبها بقيت ضخمة قوية [@mufaddaliyyat، ص292، الحاشية]."
