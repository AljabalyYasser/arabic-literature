explained: false
first: "بِتَلْهِيَةٍ أَرِيشُ بِهَا سِهَامِي"
second: "تَبُذُّ الْمُرْشِقَاتِ مِنَ الْقَطِينِ"
vocabulary:
  - term: "بِتَلْهِيَةٍ"
    text: "تَفْعِلة من اللهو، وأراد محبوبته، وأنه يتغنّى بذكر محاسنها [@mufaddaliyyat، ص289، الحاشية]."
  - term: "أَرِيشُ بِهَا سِهَامِي"
    text: "راش السهم: ألزق عليه الريش [@mufaddaliyyat، ص289، الحاشية]."
  - term: "تَبُذُّ"
    text: "تسبق وتغلب [@mufaddaliyyat، ص289، الحاشية]."
  - term: "الْمُرْشِقَاتِ"
    text: "اللواتي يمددن أعناقهن ويستشرفن للنظر [@mufaddaliyyat، ص289، الحاشية]."
  - term: "الْقَطِينِ"
    text: "الخدم والجيران والأتباع [@mufaddaliyyat، ص289، الحاشية]."
