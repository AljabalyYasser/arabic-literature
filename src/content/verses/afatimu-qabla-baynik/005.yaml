explained: false
first: "لِمَنْ ظُعُنٌ تُطَالِعُ مِنْ ضُبَيْبٍ"
second: "فَمَا خَرَجَتْ مِنَ الْوَادِي لِحِينِ"
vocabulary:
  - term: "ظُعُنٌ"
    text: "جمع ظعينة، وهي المرأة في الهودج [@mufaddaliyyat، ص288، الحاشية]."
  - term: "ضُبَيْبٍ"
    text: "موضع، ويروى بالضاد المعجمة وبالصاد المهملة [@mufaddaliyyat، ص288، الحاشية]."
  - term: "لِحِينِ"
    text: "بعد حين وإبطاء [@mufaddaliyyat، ص288، الحاشية]."
