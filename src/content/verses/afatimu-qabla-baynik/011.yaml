first: "ظَهَرْنَ بِكِلَّةٍ وَسَدَلْنَ أُخْرَى"
second: "وَثَقَّبْنَ الْوَصَاوِصَ لِلْعُيُونِ"
meaning: "أظهرت النساء على هوادجهن سترًا رقيقًا، وأرخين سترًا آخر، وثقبن في براقعهن ثقوبًا صغيرة على قدر العيون ينظرن منها. وفي شرح التبريزي: «أي: أظهرن كِلّةً على هوادجهنّ. و\"سدلن\" أي: أرسلن» [@tabrizi-ikhtiyarat، ج3 ص1250]."
vocabulary:
  - term: "بِكِلَّةٍ"
    text: "«والكِلَّة: السِّتر الرَّقِيقُ» [@lisan، ج11 ص595]."
  - term: "سَدَلْنَ"
    text: "أرخين وأرسلن."
  - term: "الْوَصَاوِصَ"
    text: "«والوَصْواصُ: البُرْقُعُ الصَّغِيرُ» [@lisan، ج7 ص105]، وفي موضع آخر من اللسان أن الوصاوص «جَمْعُ وَصْوَصٍ، وَهُوَ ثَقْبٌ فِي السِّتْر وَغَيْرِهِ عَلَى مِقْدار العَيْن، يُنْظَر مِنْهُ» [@lisan، ج1 ص240]."
context: "من وصف الظعائن (5–18). وبهذا البيت لُقّب الشاعر، يقول ابن سَلّام: «وَإِنَّمَا سمى المثقب لبيت قَالَه» [@ibn-sallam، ج1 ص271]، وفي اللسان: «والمُثَقِّبُ، بِكَسْرِ الْقَافِ: لَقَبُ شَاعِرٍ مِنْ عَبْدِ القَيْسِ مَعْرُوفٌ، سُمي بِهِ لِقَوْلِهِ» [@lisan، ج1 ص240]، ثم ينشدان البيت."
syntax:
  - "«ظهرنَ» فعل ماض، ونون النسوة فاعل، والضمير للظعائن. و«بكِلّةٍ» متعلق به، والباء للتعدية، أي: أظهرن كِلّة."
  - "«وسدلنَ أُخرى» معطوف على «ظهرن»، و«أخرى» مفعول به، وهي صفة لموصوف محذوف، أي: كِلّةً أخرى."
  - "«وثقّبنَ الوصاوصَ» معطوف، و«الوصاوص» مفعول به، و«للعيون» متعلق بـ«ثقّبن»، واللام للتعليل."
morphology:
  - "«ثَقَّبَ» على «فعّل» للتكثير، من «ثَقَبَ»، و«المُثقِّب» اسم فاعله، ومنه لقب الشاعر. وهو بكسر القاف لا غير، كما في حاشية المحققين [@mufaddaliyyat، ص289، الحاشية] وفي اللسان."
  - "«الوَصاوِص» جمع «وَصْواص» على «فَعالِل»."
  - "«الكِلّة» على «فِعْلة»، وجمعها كِلَل."
rhetoric:
  thesis: "النساء في الهوادج من وراء الستور: يظهر منهن ما يخترن، ويبقى الباقي مستورًا، والعيون تنظر من ثقوب صغيرة."
  devices:
    - title: "الكناية"
      text: "في «وَثَقَّبْنَ الْوَصَاوِصَ» وجهان في شرح التبريزي: قال ابن الأنباري: «ومراده: أنهنّ حديثات الأسنان، فبراقعهنّ صغار»، ونقل المرزوقي عن الأصمعي أن الشوابّ الحسان يوسّعن ثقوب براقعهن لتظهر محاجرهن، «فإذا كبِرن ضيّقن الوصاوص»، ثم قال: «وإنما أراد المثقّب بقوله \"وثقّبن الوصاوص\": عفّتهنّ، والمبالغة في صيانتهنّ» [@tabrizi-ikhtiyarat، ج3 ص1250–1251]. فهي كناية عن الصِّبا على القول الأول، وعن العفة على الثاني. والكناية عند عبد القاهر الجُرْجانيّ «أن يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة» [@dalail، ص66]، بل يذكر ما يلزم عنه."
    - title: "الطباق"
      text: "بين «ظَهَرْنَ» و«سَدَلْنَ»: إظهار وإرخاء في شطر واحد، فالنساء بين البدوّ والاستتار."
  connection: "ثم يصفهن في البيت التالي «على الظِّلام مُطلَّبات»: يُطلبن وإن ظلمن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون المكسورة، يليها وصلٌ بالياء، وقبلها مدّ بالياء أو بالواو هو الرِّدْف"
  scansion: "ظَهَرْنَ بِكِلْ / لَتِنْ وَسَدَلْ / نَ أُخْرَى = مفاعَلَتن / مفاعَلَتن / فعولن — وَثَقْقَبْنَلْ / وَصَاوِصَ لِلْ / عُيُونِي = مفاعَلْتن / مفاعَلَتن / فعولن"
  note: "دخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، أولَ العجز فصارت «مفاعَلْتن». الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر، و«فعولن» في آخر الشطر أصلها «مفاعلتن» دخلها القَطْف، «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]."
variants:
  - reading: "ظَهَرْنَ بِكِلَّةٍ وَسَدَلْنَ رَقْمًا"
    status: "رواية التبريزي واللسان"
    note: "[@tabrizi-ikhtiyarat، ج3 ص1250]؛ [@lisan، ج1 ص240]. و«الرَّقْم» عند التبريزي «من ثياب اليمن تُلبَسه الهوادج» [@tabrizi-ikhtiyarat، ج3 ص1250]، ويذكر محققه أن ابن الأنباري يرويه «وسدلن أخرى» [@tabrizi-ikhtiyarat، ج3 ص1250، الحاشية]، كنشرة «المفضليات»."
  - reading: "رَدَدْنَ تَحِيَّةً وَكَنَنَّ أُخْرَى"
    status: "رواية ابن سلّام وابن قتيبة"
    note: "[@ibn-sallam، ج1 ص271]؛ [@ibn-qutayba، ج1 ص383]. ويقول أحمد شاكر: «هو من المفضلية ٧٦ ولكن بصدر آخر» [@ibn-qutayba، ج1 ص383، الحاشية]."
  - reading: "أَرَيْنَ مَحَاسِنًا وَكَنَنَّ أُخْرَى"
    status: "رواية في اللسان"
    note: "يذكرها اللسان رواية في صدر البيت [@lisan، ج7 ص105]. وهي في نشرة «المفضليات» صدر بيت مستقل (13)، ويقول المحققان إن ابن الأنباري ذكره رواية أخرى للبيت 11، وإنهما رأيا أن يكون بيتًا قبل البيت 14 [@mufaddaliyyat، ص289، الحاشية]."
