explained: false
first: "فَلَا تَعِدِي مَوَاعِدَ كَاذِبَاتٍ"
second: "تَمُرُّ بِهَا رِيَاحُ الصَّيْفِ دُونِي"
vocabulary:
  - term: "رِيَاحُ الصَّيْفِ"
    text: "«إنما خصّ \"رياح الصيف\" دون سائر الأزمنة، لأنّ الخير يقلّ فيها، ويكثر غبارها، ولا تجلب مطرًا» [@tabrizi-ikhtiyarat، ج3 ص1247]."
  - term: "دُونِي"
    text: "لا تصل إليّ: تذروها الرياح قبل أن أنال منها شيئًا."
