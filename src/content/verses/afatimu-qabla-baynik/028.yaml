explained: false
first: "تَسُدُّ بِدَائِمِ الْخَطَرَانِ جَثْلٍ"
second: "خَوَايَةَ فَرْجِ مِقْلَاتٍ دَهِينِ"
vocabulary:
  - term: "بِدَائِمِ الْخَطَرَانِ جَثْلٍ"
    text: "يعني ذنبها: الخطَران حركته، والجثل الكثير الشعر [@mufaddaliyyat، ص291، الحاشية]."
  - term: "خَوَايَةَ فَرْجِ"
    text: "الخَواية الفُرجة [@mufaddaliyyat، ص291، الحاشية]، والفَرْج قُبُل الناقة، وهو فتحة رحمها ومخرج بولها: يقول إن ذنبها الكثيف يغطّيه."
  - term: "مِقْلَاتٍ دَهِينِ"
    text: "المقلات التي لا يبقى لها ولد، والدهين القليلة اللبن [@mufaddaliyyat، ص291، الحاشية]. فهي لا تحمل ولا تُرضع، فتبقى قوية على السفر."
