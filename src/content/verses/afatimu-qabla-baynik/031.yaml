first: "كَأَنَّ مُنَاخَهَا مُلْقَى لِجَامٍ"
second: "عَلَى مَعْزَائِهَا وَعَلَى الْوَجِينِ"
vocabulary:
  - term: "مُلْقَى لِجَامٍ"
    text: "شبّه مواقع ثفناتها بموقع لجام إذا أُلقي على الأرض [@mufaddaliyyat، ص291، الحاشية]."
  - term: "مَعْزَائِهَا"
    text: "المَعْزاء الموضع الكثير الحصى [@mufaddaliyyat، ص291، الحاشية]."
  - term: "الْوَجِينِ"
    text: "ما غلظ من الأرض وارتفع [@mufaddaliyyat، ص291، الحاشية]."
