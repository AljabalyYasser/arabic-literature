first: "أَفَاطِمُ قَبْلَ بَيْنِكِ مَتِّعِينِي"
second: "وَمَنْعُكِ مَا سَأَلْتُ كَأَنْ تَبِينِي"
meaning: "يا فاطمة، أعطيني قبل أن تفارقيني شيئًا أستمتع به، فإن منعكِ ما أسألكِ مثلُ فراقكِ. قال التبريزي: «أنّ منعكِ إيّاي ما سألتُ كبينكِ، أي: كمفارقتكِ» [@tabrizi-ikhtiyarat، ج3 ص1246]."
vocabulary:
  - term: "أَفَاطِمُ"
    text: "يا فاطمة: الهمزة للنداء، و«فاطمُ» ترخيم «فاطمة»، حُذفت التاء من آخر الاسم المنادى."
  - term: "بَيْنِكِ"
    text: "فراقك. «يقال: بانَ يَبِينُ بَيْنًا وبَيْنونةً. وبانُوني: فارقوني» [@tabrizi-ikhtiyarat، ج3 ص1246]."
  - term: "مَتِّعِينِي"
    text: "أعطيني ما أستمتع به. وينقل أحمد شاكر عن شرح ابن الأَنْبارِيّ: «متعينى من حديث أو عدة» [@ibn-qutayba، ج1 ص383، الحاشية]، أي بحديث أو وعد."
  - term: "كَأَنْ تَبِينِي"
    text: "مثل أن تفارقيني، أي مثل فراقك، «و\"أن\" مع الفعل بمنزلة المصدر. كأنه قال: كبَيْنونة» [@tabrizi-ikhtiyarat، ج3 ص1246]."
context: "مطلع القصيدة، وبه عُرفت. وهي القصيدة التي يروي ابن قُتَيْبة أن أبا عمرو بن العلاء كان يستجيدها ويقول: «لو كان الشعر مثلها لوجب على الناس أن يتعلّموه» [@ibn-qutayba، ج1 ص383]، ثم يروي مطلعها. وبه يبدأ ابن سَلّام أيضًا ما اختاره منها [@ibn-sallam، ج1 ص272]. ولا وقوف فيه على الأطلال: امرأة توشك أن ترحل، ورجل يطلب منها متاعًا قبل الفراق."
syntax:
  - "«أفاطمُ»: الهمزة حرف نداء للقريب، و«فاطمُ» منادى مرخّم مبني على الضم في محل نصب، على لغة من لا ينتظر المحذوف فيجعل ما بقي اسمًا تامًّا. ويرويه التبريزي بالفتح «أفاطمَ» [@tabrizi-ikhtiyarat، ج3 ص1246]، على لغة من ينتظر المحذوف فيُبقي الحرف على حركته."
  - "«قبلَ بينكِ» ظرف متعلق بـ«متّعيني»، قُدّم للاهتمام. و«متّعيني» فعل أمر مبني على حذف النون، والياء فاعل، والنون للوقاية، والياء الأخيرة مفعول به."
  - "«ومنعُكِ ما سألتُ كأنْ تبيني»: الواو استئنافية، و«منعُكِ» مبتدأ مضاف إلى فاعله، و«ما» اسم موصول مفعوله، والعائد محذوف، أي ما سألتُكِه. و«كأنْ تبيني»: الكاف حرف جر، و«أنْ» مصدرية ناصبة، و«تبيني» مضارع منصوب بحذف النون، والمصدر المؤول مجرور بالكاف، والجار والمجرور خبر المبتدأ. والتقدير: منعُكِ ما سألتُ كبَيْنِكِ."
morphology:
  - "«مَتِّعِيني» من «متّع» على «فعّل»، والتضعيف للتعدية: متّعه بالشيء أعطاه ما يتمتّع به."
  - "«البَيْن» و«البَيْنونة» مصدران لـ«بان يبين»، و«تَبِيني» مضارعه، وهو أجوف يائي."
  - "«فاطمُ» ترخيم «فاطمة»، وترخيم المنادى المختوم بتاء التأنيث جائز وإن لم يكن علمًا زائدًا على ثلاثة أحرف."
rhetoric:
  thesis: "مطلع يجعل المنع فراقًا قبل الفراق: إن لم تعطه شيئًا قبل الرحيل فكأنها رحلت وهي حاضرة."
  devices:
    - title: "التشبيه"
      text: "في «كَأَنْ تَبِينِي» شبّه المنع بالبَيْن، فجعل الحرمان، وهو لا يُرى، في منزلة الفراق الذي يُرى. والمشبَّه به هو ما يخافه في الشطر الأول، فعاد آخر البيت على أوله."
    - title: "رجوع آخر البيت على أوله"
      text: "يبدأ البيت بالبين في «قَبْلَ بَيْنِكِ» وينتهي به في «تَبِينِي»، فالفراق يحيط بالطلب من طرفيه. وهذا قراءتنا."
    - title: "النداء بالهمزة والترخيم"
      text: "في «أَفَاطِمُ» نادى بالهمزة، وهي لنداء القريب، وحذف آخر الاسم، وفي ذلك قرب ودالّة على المخاطَبة."
  connection: "ثم ينهاها في البيت الثاني عن مواعيد كاذبة «تمرّ بها رياح الصيف»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون المكسورة، يليها وصلٌ بالياء، وقبلها مدّ بالياء أو بالواو هو الرِّدْف"
  scansion: "أَفَاطِمُ قَبْ / لَ بَيْنِكِ مَتْ / تِعِينِي = مفاعَلَتن / مفاعَلَتن / فعولن — وَمَنْعُكِ مَا / سَأَلْتُ كَأَنْ / تَبِينِي = مفاعَلَتن / مفاعَلَتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر، و«فعولن» في آخر الشطر أصلها «مفاعلتن» دخلها القَطْف، «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وحشو البيت سالم."
variants:
  - reading: "أَفَاطِمَ قَبْلَ بَيْنِكِ مَتِّعِينِي"
    status: "رواية التبريزي"
    note: "بفتح الميم [@tabrizi-ikhtiyarat، ج3 ص1246]، ويذكر محققه أن ابن الأنباري يرويه «أفاطمُ» بالضم [@tabrizi-ikhtiyarat، ج3 ص1246، الحاشية]، وهو ضبط نشرة «المفضليات»."
  - reading: "وَمَنْعُكِ مَا سَأَلْتُكِ أَنْ تَبِينِي"
    status: "رواية ابن سلّام وابن قتيبة"
    note: "«ومنعك ما سألتك أن تبينى» [@ibn-sallam، ج1 ص272]؛ [@ibn-qutayba، ج1 ص383]. ويقول أحمد شاكر إنها توافق رواية الطوسي في شرح ابن الأنباري، وينقل تفسيرها: «لم تمنعينى ما سألتك إلا لتصرمينى» [@ibn-qutayba، ج1 ص383، الحاشية]. فالمنع على هذه الرواية علّته الفراق، وعلى رواية «كأن» هو الفراق نفسه."
