first: "فَإِنِّي لَوْ تُخَالِفُنِي شِمَالِي"
second: "خِلَافَكِ مَا وَصَلْتُ بِهَا يَمِينِي"
meaning: "لو أن يدي اليسرى خالفتني كما تخالفينني ما وصلتها بيدي اليمنى، بل فصلتها عنها. وفي شرح التبريزي: «أي: لو خالفتني شمالي كمخالفتك قطعتُها، وأفردتُ يميني منها» [@tabrizi-ikhtiyarat، ج3 ص1247]. فهو يقطع من يخالفه ولو كان أقرب الأشياء إليه."
vocabulary:
  - term: "خِلَافَكِ"
    text: "مثل مخالفتك، كما في حاشية محققَي «المفضليات» [@mufaddaliyyat، ص288، الحاشية]."
  - term: "شِمَالِي، يَمِينِي"
    text: "يدي اليسرى، ويدي اليمنى."
context: "يعلّل في هذا البيت والذي بعده نهيه عن المواعيد الكاذبة: هو، كما يقول محققا «المفضليات» في عرض القصيدة، صادق العزم على أن يجازي القطيعة بمثلها [@mufaddaliyyat، ص287، الحاشية]. ورواه ابن سلّام [@ibn-sallam، ج1 ص273]، ورواه ابن قتيبة في موضعين: في أبيات القصيدة [@ibn-qutayba، ج1 ص383]، وفي ما أخذه الشعراء من النابغة [@ibn-qutayba، ج1 ص158–159]."
syntax:
  - "«فإنّي»: الفاء تعليلية، و«إنّ» واسمها الياء، وخبرها جملة «لو تخالفني... ما وصلتُ»."
  - "«لو» حرف امتناع لامتناع، و«تخالفُني» مضارع وقع بعد «لو» فصُرف إلى المضي، و«شمالي» فاعله مؤخر، والنون للوقاية والياء مفعول به."
  - "«خلافَكِ» مفعول مطلق نائب عن مصدر محذوف مشبَّه به، أي: مخالفةً مثلَ خلافِكِ."
  - "«ما وصلتُ» جواب «لو» منفيّ بـ«ما»، وجاء بلا لام، وهو الكثير في جوابها المنفي. و«بها» متعلق بـ«وصلتُ»، والضمير للشمال، و«يميني» مفعول به."
morphology:
  - "«خِلاف» مصدر «خالَفَ» على «فِعال»، كقِتال من قاتَل، و«المخالفة» مصدره الآخر."
  - "«تُخالِفُني» مضارع «خالَفَ» على «فاعَلَ»، وهو للمشاركة."
  - "«الشِّمال» و«اليمين» بمعنى اليدين مؤنثتان، ولذلك عاد الضمير على الشمال مؤنثًا في «بها»."
rhetoric:
  thesis: "حكمة القطيعة في صورة من الجسد: أقرب الأشياء إلى المرء يده، ولو خالفته لفصلها عنه."
  devices:
    - title: "الفرض والمبالغة"
      text: "في «لَوْ تُخَالِفُنِي شِمَالِي» فرضٌ لا يقع جعله مقياسًا: إذا كان يفصل يده عنه لو خالفته، فكيف بمن هو أبعد منها؟ وهذا قراءتنا."
    - title: "الطباق"
      text: "بين «شِمَالِي» و«يَمِينِي»، وبين المخالفة في «تُخَالِفُنِي» والوصل في «وَصَلْتُ»."
    - title: "الأخذ"
      text: "يروي ابن قتيبة للنابغة: «فَلَوْ كَفِّي الْيَمِينُ بَغَتْكَ خَوْنًا ... لَأَفْرَدْتُ الْيَمِينَ مِنَ الشِّمَالِ»، ثم يقول: «أخذه المثقّب العبدىّ فقال» [@ibn-qutayba، ج1 ص158–159]، وتبعه البغدادي: «أَخذه المثقب الْعَبْدي» [@khizana، ج2 ص138]. ويردّ محققا «المفضليات» ذلك بأن المثقّب أقدم من النابغة [@mufaddaliyyat، ص288، الحاشية]، وابن قتيبة نفسه يقول في المثقّب: «وهو قديم جاهلىّ، (كان) فى زمن عمرو بن هند» [@ibn-qutayba، ج1 ص384]. فإن صحّ تقدّمه كان النابغة هو الآخذ."
  connection: "ثم يتمّ الصورة في البيت الرابع: «إذًا لقطعتُها، ولقلتُ: بِيني»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون المكسورة، يليها وصلٌ بالياء، وقبلها مدّ بالياء أو بالواو هو الرِّدْف"
  scansion: "فَإِنْنِي لَوْ / تُخَالِفُنِي / شِمَالِي = مفاعَلْتن / مفاعَلَتن / فعولن — خِلَافَكِ مَا / وَصَلْتُ بِهَا / يَمِينِي = مفاعَلَتن / مفاعَلَتن / فعولن"
  note: "دخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الصدر فصارت «مفاعَلْتن». الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر، و«فعولن» في آخر الشطر أصلها «مفاعلتن» دخلها القَطْف، «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]."
variants:
  - reading: "لَمَا أَتْبَعْتُهَا أَبَدًا يَمِينِي"
    status: "رواية التبريزي"
    note: "هذا عجز البيت في متن شرحه، ويذكر بعده رواية أخرى: «فَإِنِّي لَوْ تُعَادِينِي شِمَالِي ... خِلَافَكِ مَا وَصَلْتُ بِهَا يَمِينِي» [@tabrizi-ikhtiyarat، ج3 ص1247]."
  - reading: "عِنَادَكِ مَا وَصَلْتُ بِهَا يَمِينِي"
    status: "رواية ابن سلّام وابن قتيبة"
    note: "«عنادك» مكان «خلافك» عند ابن سلّام [@ibn-sallam، ج1 ص273]، وعند ابن قتيبة «لو تعاندنى شمالى ... عنادك» [@ibn-qutayba، ج1 ص383]."
  - reading: "وَلَوْ أَنِّي تُخَالِفُنِي شِمَالِي ... بِنَصْرٍ لَمْ تُصَاحِبْهَا يَمِينِي"
    status: "رواية ابن قتيبة في أخبار النابغة"
    note: "يرويه بهذا اللفظ بعد بيت النابغة [@ibn-qutayba، ج1 ص159]."
