first: "كَسَاهَا تَامِكًا قَرِدًا عَلَيْهَا"
second: "سَوَادِيُّ الرَّضِيحِ مَعَ اللَّجِينِ"
vocabulary:
  - term: "تَامِكًا قَرِدًا"
    text: "سنامًا مشرفًا طويلًا متلبّدًا [@mufaddaliyyat، ص290، الحاشية]."
  - term: "سَوَادِيُّ الرَّضِيحِ"
    text: "نوًى مدقوق من سواد العراق، يعني العلف الذي نمّى سنامها [@mufaddaliyyat، ص290، الحاشية]."
  - term: "اللَّجِينِ"
    text: "ما تلجّن، أي تلزّج، من ورق أو علف [@mufaddaliyyat، ص290، الحاشية]."
