explained: false
first: "وَهُنَّ عَلَى الرَّجَائِزِ وَاكِنَاتٌ"
second: "قَوَاتِلُ كُلِّ أَشْجَعَ مُسْتَكِينِ"
vocabulary:
  - term: "الرَّجَائِزِ"
    text: "مراكب النساء، واحدتها رِجازة [@mufaddaliyyat، ص288، الحاشية]."
  - term: "وَاكِنَاتٌ"
    text: "مطمئنات [@mufaddaliyyat، ص288، الحاشية]."
  - term: "أَشْجَعَ مُسْتَكِينِ"
    text: "الأشجع في حاشية المحققين الطويل، والمعنى: يقتلن كل رجل طويل، ولكنه يستكين لهن، أي يخضع [@mufaddaliyyat، ص288، الحاشية]."
