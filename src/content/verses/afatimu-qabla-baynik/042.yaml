explained: false
first: "فَإِمَّا أَنْ تَكُونَ أَخِي بِحَقٍّ"
second: "فَأَعْرِفَ مِنْكَ غَثِّي أَوْ سَمِينِي"
vocabulary:
  - term: "غَثِّي أَوْ سَمِينِي"
    text: "الغثّ الهزيل والسمين ضدّه، والمعنى: فأعرف نصحك من غشّك [@mufaddaliyyat، ص292، الحاشية]."
  - term: "فَإِمَّا"
    text: "«إمّا» للتفصيل، وجاء مقابلها في البيت التالي «وإلّا»، وهو شاهد عند البغدادي على أن «إمّا» الثانية قد تخلفها «إلّا» [@khizana، ج11 ص80]."
