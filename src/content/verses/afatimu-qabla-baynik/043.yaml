first: "وَإِلَّا فَاطَّرِحْنِي وَاتَّخِذْنِي"
second: "عَدُوًّا أَتَّقِيكَ وَتَتَّقِينِي"
vocabulary:
  - term: "فَاطَّرِحْنِي"
    text: "اتركني وانبذني. وفي شرح التبريزي: «يقول: إن لم تكن الأخوّة على ما بيّنتُ فانفُضْ ممّا بيني وبينك يدك، واتّخذني عدوًّا لك، احترزُ منك، وتحترز أنت منّي» [@tabrizi-ikhtiyarat، ج3 ص1267]."
