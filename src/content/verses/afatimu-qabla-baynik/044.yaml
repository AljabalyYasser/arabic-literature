first: "وَمَا أَدْرِي إِذَا يَمَّمْتُ أَمْرًا"
second: "أُرِيدُ الْخَيْرَ أَيُّهُمَا يَلِينِي"
meaning: "إذا قصدتُ أمرًا أطلب فيه الخير لم أدرِ أيّ الأمرين يأتيني: الخير الذي أطلبه، أم الشر الذي يطلبني. ولم يذكر الشر في هذا البيت، وإنما ذكره في البيت التالي."
vocabulary:
  - term: "يَمَّمْتُ"
    text: "قصدت. «ويَمَّمْتُه: قَصَدْته» [@lisan، ج12 ص22]."
  - term: "يَلِينِي"
    text: "يأتيني ويقع بي، من الوَلْي، وهو القرب."
context: "البيت قبل الأخير، وهو مع البيت 45 خاتمة القصيدة، بعد أن خيّر عمرو بن هند بين أخوّة صادقة وعداوة صريحة (41–43). ويرى محققا «المفضليات» أنه عبّر في البيتين تعبيرًا صادقًا عن جهل المرء بما يخبّئه له القدر من الخير والشر [@mufaddaliyyat، ص287، الحاشية]. ورواهما ابن قتيبة مع مطلعها [@ibn-qutayba، ج1 ص384]."
syntax:
  - "«وما أدري»: الواو استئنافية، و«ما» نافية، و«أدري» مضارع فاعله ضمير المتكلم، عُلّق عن العمل بالاستفهام «أيُّهما يليني»، فالجملة في محل نصب سدّت مسدّ مفعوله."
  - "«إذا يمّمتُ أمرًا» ظرف شرطي، وجوابه محذوف دلّ عليه «ما أدري»."
  - "«أريدُ الخيرَ» جملة حالية من فاعل «يمّمت»."
  - "«أيُّهما يليني»: «أيُّ» اسم استفهام مبتدأ، و«هما» مضاف إليه، وجملة «يليني» خبره. وثنّى الضمير ولم يذكر قبله إلا «الخير». قال التبريزي: «اكتفى بذكر أحد الأمرين، وهو الخير، اعتمادًا على ما يجيء بعده» [@tabrizi-ikhtiyarat، ج3 ص1267]، وقال البغدادي: «فَاكْتفى بِذكر أَحدهمَا لِأَن مَا بعده يبينهما» [@khizana، ج6 ص37]."
morphology:
  - "«يَمَّمْتُ» على «فعّل» من «اليَمّ» بمعنى القصد، ومنه «التيمّم»."
  - "«يَلِيني» من «وَلِيَ يَلِي»، وهو لفيف مفروق: حُذفت فاؤه في المضارع، وآخره ياء."
  - "«أيُّهما»: «أيّ» تُضاف إلى المثنى فتسأل عن واحد من اثنين."
rhetoric:
  thesis: "خاتمة حِكْمية بعد الخطاب الصريح للملك: الرجل الذي يعرف ما يريد من صاحبه لا يعرف ما يريده به القدر."
  devices:
    - title: "الحذف والاكتفاء"
      text: "في «أَيُّهُمَا» ضمير لاثنين لم يُذكر منهما إلا «الخير»، وأُخّر الثاني إلى البيت التالي. وعبد القاهر الجرجاني يقول في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]. والحذف هنا يترك السامع معلّقًا كما كان الشاعر معلّقًا، لا يعرف الثاني حتى يسمع البيت الأخير. وهذا قراءتنا."
    - title: "التضمين"
      text: "تعلّق معنى البيت بما بعده، وهو التضمين عند ابن رشيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
    - title: "المقابلة"
      text: "بين البيتين: «الْخَيْرُ الَّذِي أَنَا أَبْتَغِيهِ» و«الشَّرُّ الَّذِي هُوَ يَبْتَغِينِي»، فالإنسان يطلب الخير، والشر يطلب الإنسان."
  connection: "ثم يفسّر الضمير في البيت الأخير: «أألخيرُ الذي أنا أبتغيه، أم الشرُّ الذي هو يبتغيني؟»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون المكسورة، يليها وصلٌ بالياء، وقبلها مدّ بالياء أو بالواو هو الرِّدْف"
  scansion: "وَمَا أَدْرِي / إِذَا يَمْمَمْ / تُ أَمْرَنْ = مفاعَلْتن / مفاعَلْتن / فعولن — أُرِيدُلْ خَيْ / رَ أَيْيُهُمَا / يَلِينِي = مفاعَلْتن / مفاعَلَتن / فعولن"
  note: "دخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر والأولى من العجز. الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر، و«فعولن» في آخر الشطر أصلها «مفاعلتن» دخلها القَطْف، «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]."
variants:
  - reading: "فَمَا أَدْرِي إِذَا يَمَّمْتُ أَرْضًا"
    status: "رواية ابن قتيبة والمرزوقي"
    note: "عند ابن قتيبة «فما أدرى إذا يممت أرضا» [@ibn-qutayba، ج1 ص384]، ويذكر محقق التبريزي أنها رواية المرزوقي [@tabrizi-ikhtiyarat، ج3 ص1267، الحاشية]."
  - reading: "وَمَا أَدْرِي إِذَا يَمَّمْتُ وَجْهًا"
    status: "رواية التبريزي"
    note: "[@tabrizi-ikhtiyarat، ج3 ص1267]، وعند البغدادي «فما أدري إذا يممت وجها» [@khizana، ج6 ص37]."
