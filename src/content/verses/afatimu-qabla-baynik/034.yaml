explained: false
first: "غَدَتْ قَوْدَاءَ مُنْشَقًّا نَسَاهَا"
second: "تَجَاسَرُ بِالنُّخَاعِ وَبِالْوَتِينِ"
vocabulary:
  - term: "قَوْدَاءَ"
    text: "طويلة العنق [@mufaddaliyyat، ص291، الحاشية]."
  - term: "مُنْشَقًّا نَسَاهَا"
    text: "إذا سمنت انفلقت اللحمتان اللتان في الفخذين فظهر بينهما عرق النَّسا [@mufaddaliyyat، ص291، الحاشية]."
  - term: "تَجَاسَرُ"
    text: "تمضي [@mufaddaliyyat، ص291، الحاشية]."
  - term: "بِالنُّخَاعِ وَبِالْوَتِينِ"
    text: "النُّخاع الخيط الأبيض في فقار الظهر، والوتين عرق في القلب [@mufaddaliyyat، ص291، الحاشية]: تمضي بنفسها كلها."
