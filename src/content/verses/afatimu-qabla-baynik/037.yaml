first: "أَكُلَّ الدَّهْرِ حَلٌّ وَارْتِحَالٌ"
second: "أَمَا يُبْقِي عَلَيَّ وَمَا يَقِينِي"
vocabulary:
  - term: "حَلٌّ وَارْتِحَالٌ"
    text: "نزول ورحيل."
  - term: "يُبْقِي عَلَيَّ"
    text: "يرفق بي ويرحمني."
  - term: "يَقِينِي"
    text: "يحفظني ويصونني. والبيت من تمام شكوى الناقة، ويرويه المرزباني معه [@muwashshah، ص121]."
