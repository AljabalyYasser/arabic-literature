explained: false
first: "إِلَى عَمْرٍو وَمِنْ عَمْرٍو أَتَتْنِي"
second: "أَخِي النَّجَدَاتِ وَالْحِلْمِ الرَّصِينِ"
vocabulary:
  - term: "عَمْرٍو"
    text: "عمرو بن هند الملك، كما يقول المحققان، وينقلان عن الأصمعي أنه يراه غير الملك، لأنه لم يكن ليخاطبه بمثل هذا الكلام، ثم يردّان قوله [@mufaddaliyyat، ص292، الحاشية]. والتبريزي يقول إنه «يمدح عمرو بن المنذر، وهو عمرو بن هند» [@tabrizi-ikhtiyarat، ج3 ص1246]."
  - term: "النَّجَدَاتِ"
    text: "جمع نَجْدة، وهي الشجاعة والإغاثة في الشدة."
  - term: "الرَّصِينِ"
    text: "المحكم الثابت."
