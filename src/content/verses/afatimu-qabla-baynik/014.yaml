first: "وَمِنْ ذَهَبٍ يَلُوحُ عَلَى تَرِيبٍ"
second: "كَلَوْنِ الْعَاجِ لَيْسَ بِذِي غُضُونِ"
vocabulary:
  - term: "تَرِيبٍ"
    text: "عظام الصدر موضع القلادة، ويقول المحققان إن هذا الجمع لم يُذكر في المعاجم، والمعروف «ترائب» [@mufaddaliyyat، ص289، الحاشية]."
  - term: "غُضُونِ"
    text: "تثنّي الجلد [@mufaddaliyyat، ص289، الحاشية]."
