explained: false
first: "أَأَلْخَيْرُ الَّذِي أَنَا أَبْتَغِيهِ"
second: "أَمِ الشَّرُّ الَّذِي هُوَ يَبْتَغِينِي"
vocabulary:
  - term: "أَأَلْخَيْرُ"
    text: "همزة الاستفهام دخلت على «الخير»، وهمزة «ال» تُسهَّل بعدها أو تُمدّ."
  - term: "أَبْتَغِيهِ، يَبْتَغِينِي"
    text: "أطلبه، ويطلبني: هذا البيت يفسّر الضمير في «أيّهما» من البيت السابق [@tabrizi-ikhtiyarat، ج3 ص1267]."
