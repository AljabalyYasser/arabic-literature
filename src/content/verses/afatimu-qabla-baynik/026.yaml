first: "تَصُكُّ الْحَالِبَيْنِ بِمُشْفَتِرٍّ"
second: "لَهُ صَوْتٌ أَبَحُّ مِنَ الرَّنِينِ"
vocabulary:
  - term: "الْحَالِبَيْنِ"
    text: "عرقان يكتنفان السُّرّة [@mufaddaliyyat، ص290، الحاشية]."
  - term: "بِمُشْفَتِرٍّ"
    text: "المتفرّق، يعني الحصى: تقذف بالحصى في سيرها فتضرب به حالبيها [@mufaddaliyyat، ص290، الحاشية]."
  - term: "أَبَحُّ"
    text: "فيه بُحّة، وهي غلظ في الصوت [@mufaddaliyyat، ص290، الحاشية]."
