explained: false
first: "كَأَنَّ مَوَاقِعَ الثَّفِنَاتِ مِنْهَا"
second: "مُعَرَّسُ بَاكِرَاتِ الْوِرْدِ جُونِ"
vocabulary:
  - term: "الثَّفِنَاتِ"
    text: "ما يمسّ الأرض من قوائمها إذا بركت."
  - term: "مُعَرَّسُ"
    text: "مكان التعريس، وهو النزول آخر الليل [@mufaddaliyyat، ص290، الحاشية]."
  - term: "بَاكِرَاتِ الْوِرْدِ جُونِ"
    text: "القطا السود يبكّرن بالورود إلى الماء: شبّه آثار ثفناتها بمواضع قطا فحصن الأرض، ومعرّس القطا خفيّ [@mufaddaliyyat، ص290، الحاشية]. ويعدّه ابن قتيبة مما «سبق إليه فأخذ منه» [@ibn-qutayba، ج1 ص384]."
