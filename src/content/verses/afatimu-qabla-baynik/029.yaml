explained: false
first: "وَتَسْمَعُ لِلذُّبَابِ إِذَا تَغَنَّى"
second: "كَتَغْرِيدِ الْحَمَامِ عَلَى الْوُكُونِ"
vocabulary:
  - term: "لِلذُّبَابِ"
    text: "ينقل المحققان عن الأصمعي أنه أراد بالذباب هنا حدّ نابها إذا صرفت بأنيابها، وأنه قد يكون الذباب نفسه تسمع صوته في الرياض إذا كانت في خصب [@mufaddaliyyat، ص291، الحاشية]."
  - term: "الْوُكُونِ"
    text: "جمع وَكْن، وهو عشّ الطائر [@mufaddaliyyat، ص291، الحاشية]."
