explained: false
first: "يَجُذُّ تَنَفُّسُ الصُّعَدَاءِ مِنْهَا"
second: "قُوَى النِّسْعِ الْمُحَرَّمِ ذِي الْمُتُونِ"
vocabulary:
  - term: "يَجُذُّ"
    text: "يقطع [@mufaddaliyyat، ص290، الحاشية]."
  - term: "الصُّعَدَاءِ"
    text: "النفَس المردود إلى الجوف [@mufaddaliyyat، ص290، الحاشية]."
  - term: "قُوَى النِّسْعِ"
    text: "النِّسع سير يُضفر من الجلد، وقواه طاقاته التي ضُفر منها [@mufaddaliyyat، ص290، الحاشية]."
  - term: "الْمُحَرَّمِ ذِي الْمُتُونِ"
    text: "المحرّم الذي دُبغ ولم يُليَّن، وذو المتون ذو القوى. يقول: إذا زفرت فامتلأ جوفها قطعت النسع بنفَسها [@mufaddaliyyat، ص290، الحاشية]."
