explained: false
first: "إِذَا مَا أَفَدْنَا صِرْمَةً بَعْدَ هَجْمَةٍ"
second: "تَكُونُ عَلَيْهَا كَابْنِ أُمِّكَ أَسْوَدَا"
vocabulary:
  - term: "صِرْمَةً بَعْدَ هَجْمَةٍ"
    text: "قطيعًا قليلًا من الإبل بعد قطيع كثير، يقول محقق «الحماسة»: «والصرمة من العشرة إلى الأربعين من الإبل والهجمة من الأربعين إلى ما زادت» [@tabrizi-hamasa، ج2 ص342]."
  - term: "كَابْنِ أُمِّكَ أَسْوَدَا"
    text: "مثل أخيك الأسود بن يعفر، أي «تعود عليها سالكا طريق أخيك الأسود بن يعفر في بذل المال» [@tabrizi-hamasa، ج2 ص342]."
sources:
