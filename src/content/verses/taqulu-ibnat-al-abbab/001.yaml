explained: false
first: "تَقُولُ ابْنَةُ الْعَبَّابِ رُهْمُ حَرَبْتَنَا"
second: "حُطَائِطُ لَمْ تَتْرُكْ لِنَفْسِكَ مَقْعَدَا"
vocabulary:
  - term: "ابْنَةُ الْعَبَّابِ رُهْمُ"
    text: "أمه، يقول محقق «الحماسة»: «ابنة العباب هي أم الشاعر ورهم اسمها» [@tabrizi-hamasa، ج2 ص342]."
  - term: "حَرَبْتَنَا"
    text: "«سلبتنا مالنا الذي نعيش به وتركتنا فقراء» كما يقول محقق «الحماسة» [@tabrizi-hamasa، ج2 ص342]."
  - term: "لَمْ تَتْرُكْ لِنَفْسِكَ مَقْعَدَا"
    text: "لم تُبق لنفسك شيئًا تقيم عليه، و«تقول العرب ما ترك لك مقاما ولا مقعدا أي لم يبق لك ما يمكنك الإقامة فيه والقعود به» [@tabrizi-hamasa، ج2 ص342]."
sources:
