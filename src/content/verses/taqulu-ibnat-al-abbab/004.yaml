explained: false
first: "أَرِينِي جَوَادًا مَاتَ هُزْلًا لَعَلَّنِي"
second: "أَرَى مَا تَرَيْنَ أَوْ بَخِيلًا مُخَلَّدَا"
vocabulary:
  - term: "أَرِينِي"
    text: "دلّيني، «أريني جوادا أي دليني عليه وعرفيني مكانه» كما يقول محقق «الحماسة» [@tabrizi-hamasa، ج2 ص343]."
  - term: "هُزْلًا"
    text: "هزالًا وفقرًا، و«الهزل هنا الهزال والضعف» [@tabrizi-hamasa، ج2 ص343]."
  - term: "لَعَلَّنِي"
    text: "لعلّي أرى. ويُروى «لَأَنَّنِي» بمعناها، فـ«أنّ» تأتي بمعنى «لعلّ»، ويُنشد البيت في «اللسان» شاهدًا على ذلك [@lisan، ج13 ص34]. ويرويه القالي عن ابن السِّكِّيت عن أبي الصقر بلفظ آخر، ويقول: «يريد لعلني» [@qali، ج2 ص79]."
