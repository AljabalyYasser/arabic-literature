explained: false
first: "فَتَذَكَّرَتْ ثَقَلًا رَثِيدًا بَعْدَمَا"
second: "أَلْقَتْ ذُكَاءُ يَمِينَهَا فِي كَافِرِ"
vocabulary:
  - term: "ثَقَلًا رَثِيدًا"
    text: "الثَّقَل المتاع وكل شيء مصون، وأراد بيضها، والرثيد المنضود بعضه فوق بعض [@mufaddaliyyat، ص130، الحاشية]."
  - term: "ذُكَاءُ"
    text: "«اسم للشمس، اشتُقّ من: ذكت النار، إذا التهبت» [@tabrizi-ikhtiyarat، ج1 ص620]."
  - term: "أَلْقَتْ يَمِينَهَا فِي كَافِرِ"
    text: "الكافر الليل، لأنه يغطي بظلمته كل شيء، و«الكَفْرُ، بالفتح: التغطية» [@lisan، ج5 ص147]. والمعنى أن الشمس «تهيّأت للمغيب، كما تقول: وضع فلان يده في إنفاق ماله، إذا ابتدأ فيه» [@tabrizi-ikhtiyarat، ج1 ص620]."
