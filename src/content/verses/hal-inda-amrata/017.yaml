explained: false
first: "بَاكَرْتُهُمْ بِسِبَاءِ جَوْنٍ ذَارِعٍ"
second: "قَبْلَ الصَّبَاحِ وَقَبْلَ لَغْوِ الطَّائِرِ"
vocabulary:
  - term: "بِسِبَاءِ"
    text: "السِّباء اشتراء الخمر [@mufaddaliyyat، ص130، الحاشية]."
  - term: "جَوْنٍ ذَارِعٍ"
    text: "الجَوْن الأسود، وأراد زِقّ الخمر، والذارع الكثير الأخذ من الماء ونحوه [@mufaddaliyyat، ص130، الحاشية]."
  - term: "لَغْوِ الطَّائِرِ"
    text: "صياح الطير في أول الصبح."
