first: "فَتَرَوَّحَا أُصُلًا بِشَدٍّ مُهْذِبٍ"
second: "ثَرٍّ كَشُؤْبُوبِ الْعَشِيِّ الْمَاطِرِ"
vocabulary:
  - term: "فَتَرَوَّحَا"
    text: "راح الظليم والنعامة إلى بيضهما في آخر النهار."
  - term: "أُصُلًا"
    text: "العشيّ [@mufaddaliyyat، ص130، الحاشية]."
  - term: "بِشَدٍّ مُهْذِبٍ ثَرٍّ"
    text: "بجري سريع شديد [@mufaddaliyyat، ص130، الحاشية]."
  - term: "كَشُؤْبُوبِ"
    text: "الشؤبوب الدفعة من المطر [@mufaddaliyyat، ص130، الحاشية]."
