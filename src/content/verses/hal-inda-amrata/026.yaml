first: "بِمَقَالَةٍ مِنْ حَازِمٍ ذِي مِرَّةٍ"
second: "يَدَأُ الْعَدُوَّ زَئِيرُهُ لِلزَّائِرِ"
vocabulary:
  - term: "ذِي مِرَّةٍ"
    text: "المِرّة القوة وشدة العقل [@mufaddaliyyat، ص131، الحاشية]."
  - term: "يَدَأُ الْعَدُوَّ"
    text: "في حاشية المحققين: يدعه، أُبدلت العين همزة [@mufaddaliyyat، ص131، الحاشية]."
  - term: "زَئِيرُهُ لِلزَّائِرِ"
    text: "يحسبه عدوه أسدًا فيتجنّبه خوفًا منه [@mufaddaliyyat، ص131، الحاشية]."
