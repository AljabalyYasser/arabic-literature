explained: false
first: "وَكَأَنَّ عَيْبَتَهَا وَفَضْلَ فِتَانِهَا"
second: "فَنَنَانِ مِنْ كَنَفَيْ ظَلِيمٍ نَافِرِ"
vocabulary:
  - term: "عَيْبَتَهَا"
    text: "العيبة وعاء من جلد يكون فيه المتاع [@mufaddaliyyat، ص129، الحاشية]."
  - term: "فِتَانِهَا"
    text: "غشاء للرَّحْل من جلد [@mufaddaliyyat، ص129، الحاشية]."
  - term: "فَنَنَانِ مِنْ كَنَفَيْ ظَلِيمٍ"
    text: "الفنن الغصن، وكنفا الظليم جانباه، وأراد جناحيه، والظليم ذكر النعام: شبّه ما على جانبي ناقته من العيبة والفتان بجناحي ظليم نافر يسرع فيحرّكهما [@mufaddaliyyat، ص129، الحاشية]."
