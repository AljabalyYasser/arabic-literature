explained: false
first: "فَقَصَرْتُ يَوْمَهُمُ بِرَنَّةِ شَارِفٍ"
second: "وَسَمَاعِ مُدْجِنَةٍ وَجَدْوَى جَازِرِ"
vocabulary:
  - term: "فَقَصَرْتُ يَوْمَهُمُ"
    text: "قصّرت عليهم يومهم باللهو، فمرّ سريعًا."
  - term: "بِرَنَّةِ شَارِفٍ"
    text: "الشارف الناقة المسنّة، ورنّتها صوتها عند النحر [@mufaddaliyyat، ص130، الحاشية]."
  - term: "وَسَمَاعِ مُدْجِنَةٍ"
    text: "سماع قينة تغنّي في يوم الدَّجْن، وهو تكاثف الغيم، والسماع فيه أطيب [@mufaddaliyyat، ص130، الحاشية]."
  - term: "وَجَدْوَى جَازِرِ"
    text: "الجدوى العطية، وأراد ما يُتحفهم به الجازر من أطايب اللحم [@mufaddaliyyat، ص130، الحاشية]."
