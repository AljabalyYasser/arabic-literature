first: "وَمُغِيرَةٍ سَوْمَ الْجَرَادِ وَزَعْتُهَا"
second: "قَبْلَ الصَّبَاحِ بِشَيِّئَانٍ ضَامِرِ"
vocabulary:
  - term: "وَمُغِيرَةٍ"
    text: "قوم يُغيرون [@mufaddaliyyat، ص131، الحاشية]."
  - term: "سَوْمَ الْجَرَادِ"
    text: "مضيّ الجراد، يصف كثرتهم واندفاعهم [@mufaddaliyyat، ص131، الحاشية]."
  - term: "وَزَعْتُهَا"
    text: "كففتها ورددتها [@mufaddaliyyat، ص131، الحاشية]."
  - term: "بِشَيِّئَانٍ"
    text: "الشديد النظر الكثير الاستشراف، وأراد به الفرس [@mufaddaliyyat، ص131، الحاشية]."
