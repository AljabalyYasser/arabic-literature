explained: false
first: "وَجْنَاءَ مُجْفَرَةِ الضُّلُوعِ رَجِيلَةٍ"
second: "وَلَقَى الْهَوَاجِرِ ذَاتِ خَلْقٍ حَادِرِ"
vocabulary:
  - term: "وَجْنَاءَ"
    text: "الصلبة [@mufaddaliyyat، ص129، الحاشية]."
  - term: "مُجْفَرَةِ الضُّلُوعِ"
    text: "عظيمة الجُفْرة، وهي الوسط، وذلك مستحبّ في خلقها [@mufaddaliyyat، ص129، الحاشية]."
  - term: "رَجِيلَةٍ"
    text: "قوية على المشي [@mufaddaliyyat، ص129، الحاشية]."
  - term: "وَلَقَى الْهَوَاجِرِ"
    text: "الوَلَقى السريعة، من الوَلْق وهو المرّ السريع، وأضافها إلى الهواجر لأن سير الهاجرة أشدّ السير [@mufaddaliyyat، ص129، الحاشية]."
  - term: "حَادِرِ"
    text: "ممتلئ [@mufaddaliyyat، ص129، الحاشية]."
