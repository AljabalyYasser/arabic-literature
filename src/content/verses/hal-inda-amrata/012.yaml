explained: false
first: "طَرِفَتْ مَرَاوِدُهَا وَغَرَّدَ سَقْبُهَا"
second: "بِالْآءِ وَالْحَدَجِ الرِّوَاءِ الْحَادِرِ"
vocabulary:
  - term: "طَرِفَتْ مَرَاوِدُهَا"
    text: "«\"طرفت\": تباعدت»، «و\"مراودها\": مواضعها التي ترود فيها» [@tabrizi-ikhtiyarat، ج1 ص619]، أي بعُدت مراعيها عن بيضها."
  - term: "سَقْبُهَا"
    text: "السَّقْب في الأصل ولد الناقة، و«\"سقبها\": رألها» [@tabrizi-ikhtiyarat، ج1 ص619]، والرأل ولد النعامة."
  - term: "بِالْآءِ وَالْحَدَجِ"
    text: "«و\"الآء\": ثمر السَّرْح»، «و\"الحدج\": الحنظل» [@tabrizi-ikhtiyarat، ج1 ص619]."
  - term: "الرِّوَاءِ الْحَادِرِ"
    text: "الرِّواء جمع ريّان، والحادر الغليظ [@mufaddaliyyat، ص130، الحاشية]."
