first: "وَأَرَى الْغَوَانِيَ لَا يَدُومُ وِصَالُهَا"
second: "أَبَدًا عَلَى عُسْرٍ وَلَا لِمُيَاسِرِ"
vocabulary:
  - term: "الْغَوَانِيَ"
    text: "جمع غانية، وهي المرأة الجميلة المستغنية بجمالها."
  - term: "لِمُيَاسِرِ"
    text: "لموسر، أي لا تدوم مودّتهن للفقير ولا للغني."
