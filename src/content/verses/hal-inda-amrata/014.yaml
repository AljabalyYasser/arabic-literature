explained: false
first: "فَبَنَتْ عَلَيْهِ مَعَ الظَّلَامِ خِبَاءَهَا"
second: "كَالْأَحْمَسِيَّةِ فِي النَّصِيفِ الْحَاسِرِ"
vocabulary:
  - term: "فَبَنَتْ عَلَيْهِ خِبَاءَهَا"
    text: "جثمت على البيض، فشبّه جناحيها بالخِباء، وهو البيت من الصوف أو الوبر [@mufaddaliyyat، ص130، الحاشية]."
  - term: "كَالْأَحْمَسِيَّةِ"
    text: "المرأة من الحُمْس، وهم في حاشية المحققين قريش وخزاعة وبنو عامر وكنانة [@mufaddaliyyat، ص130، الحاشية]."
  - term: "النَّصِيفِ الْحَاسِرِ"
    text: "النصيف القناع، والحاسر التي تكشف رأسها ووجهها إدلالًا بحسنها [@mufaddaliyyat، ص130، الحاشية]."
