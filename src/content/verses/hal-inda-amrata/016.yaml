explained: false
first: "حَسَنِي الْفُكَاهَةِ لَا تُذَمُّ لِحَامُهُمْ"
second: "سَبِطِي الْأَكُفِّ وَفِي الْحُرُوبِ مَسَاعِرِ"
vocabulary:
  - term: "لَا تُذَمُّ لِحَامُهُمْ"
    text: "اللِّحام جمع لحم: لا يُذمّ قِراهم، فهو حاضر طيّب [@mufaddaliyyat، ص130، الحاشية]."
  - term: "سَبِطِي الْأَكُفِّ"
    text: "السبط المسترسل، والمراد أنهم كرام [@mufaddaliyyat، ص130، الحاشية]."
  - term: "مَسَاعِرِ"
    text: "جمع مِسْعَر، وهو الذي يوقد الحرب كأنه يسعّرها [@mufaddaliyyat، ص130، الحاشية]."
