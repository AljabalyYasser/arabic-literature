explained: false
first: "هَلْ عِنْدَ عَمْرَةَ مِنْ بَتَاتِ مُسَافِرِ"
second: "ذِي حَاجَةٍ مُتَرَوِّحٍ أَوْ بَاكِرِ"
vocabulary:
  - term: "بَتَاتِ مُسَافِرِ"
    text: "«و\"البَتات\": الزاد»، «يقال: قد تبتّت الرجل لسفره، إذا اشترى ما يصلحه» [@tabrizi-ikhtiyarat، ج1 ص613]. وأراد في حاشية المحققين: هل عندها ما تودّعه به عند رحلته [@mufaddaliyyat، ص128، الحاشية]."
  - term: "مُتَرَوِّحٍ أَوْ بَاكِرِ"
    text: "راحل في الرواح، وهو آخر النهار، أو في البُكرة، وهي أوله."
