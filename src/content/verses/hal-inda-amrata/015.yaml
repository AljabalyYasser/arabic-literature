explained: false
first: "أَسُمَيَّ مَا يُدْرِيكِ أَنْ رُبَ فِتْيَةٍ"
second: "بِيضِ الْوُجُوهِ ذَوِي نَدًى وَمَآثِرِ"
vocabulary:
  - term: "أَسُمَيَّ"
    text: "يا سُمَيّة، مرخّمًا، وفي بعض الروايات «أعمير» [@mufaddaliyyat، ص130، الحاشية]."
  - term: "رُبَ"
    text: "«رُبَّ» خُفّفت باؤها [@mufaddaliyyat، ص130، الحاشية]."
  - term: "نَدًى وَمَآثِرِ"
    text: "الندى الكرم، والمآثر المكارم التي تُؤثر وتُروى."
