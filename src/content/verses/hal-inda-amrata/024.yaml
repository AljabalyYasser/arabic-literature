explained: false
first: "وَلَرُبَّ خَصْمٍ جَاهِدِينَ ذَوِي شَذًا"
second: "تَقْذِي صُدُورُهُمُ بِهِتْرٍ هَاتِرِ"
vocabulary:
  - term: "خَصْمٍ"
    text: "يقال للواحد والجمع، ولذلك وصفه بالجمع [@mufaddaliyyat، ص131، الحاشية]."
  - term: "ذَوِي شَذًا"
    text: "الشذا الأذى [@mufaddaliyyat، ص131، الحاشية]."
  - term: "تَقْذِي صُدُورُهُمُ"
    text: "تقذف بالقذى، أي تفيض بالحقد [@mufaddaliyyat، ص131، الحاشية]."
  - term: "بِهِتْرٍ هَاتِرِ"
    text: "الكلام القبيح [@mufaddaliyyat، ص131، الحاشية]."
