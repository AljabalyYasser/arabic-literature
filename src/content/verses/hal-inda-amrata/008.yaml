explained: false
first: "تُضْحِي إِذَا دَقَّ الْمَطِيُّ كَأَنَّهَا"
second: "فَدَنُ ابْنِ حَيَّةَ شَادَهُ بِالْآجُرِ"
vocabulary:
  - term: "دَقَّ الْمَطِيُّ"
    text: "ضمرت الإبل لطول السفر [@mufaddaliyyat، ص129، الحاشية]."
  - term: "فَدَنُ"
    text: "القصر [@mufaddaliyyat، ص129، الحاشية]."
  - term: "شَادَهُ"
    text: "بناه بالشِّيد، وهو الجِصّ، أو رفع بناءه [@mufaddaliyyat، ص129، الحاشية]."
  - term: "بِالْآجُرِ"
    text: "الآجُرّ: الطين المشويّ يُبنى به، وخُفّفت راؤه للقافية."
