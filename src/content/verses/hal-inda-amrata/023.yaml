explained: false
first: "قَدْ بِتُّ أُلْعِبُهَا وَأَقْصُرُ هَمَّهَا"
second: "حَتَّى بَدَا وَضَحُ الصَّبَاحِ الْجَاشِرِ"
vocabulary:
  - term: "أُلْعِبُهَا"
    text: "أحملها على اللعب [@mufaddaliyyat، ص131، الحاشية]، أي بات معها ليلته يلاعبها ويلهو بها."
  - term: "وَأَقْصُرُ هَمَّهَا"
    text: "أحبس همّها عليه، فلا تشتغل بغيره حتى الصبح."
  - term: "وَضَحُ الصَّبَاحِ الْجَاشِرِ"
    text: "الوضح البياض، والجاشر من الجَشْر، وهو تباشير الصبح عند إقباله [@mufaddaliyyat، ص131، الحاشية]."
