explained: false
first: "بِمُلْتَئِمَاتٍ كَالْخَذَارِيفِ قُوبِلَتْ"
second: "إِلَى جَوْشَنٍ خَاظِي الطَّرِيقَةِ مُسْنَدِ"
vocabulary:
  - term: "بِمُلْتَئِمَاتٍ"
    text: "«يعني: قوائم يشبه بعضها بعضًا» [@diwan-zuhayr، ص186]."
  - term: "الْخَذَارِيفِ"
    text: "التي يلعب بها الصبيان، شبّه القوائم بها «في خفّتها وسرعتها» [@diwan-zuhayr، ص186]."
  - term: "جَوْشَنٍ خَاظِي الطَّرِيقَةِ مُسْنَدِ"
    text: "الجوشن: الصدر، والخاظي: الكثير اللحم المتراكب، والطريقة: اللحمة على أعلى الصدر، والمسند: الذي في مقدّمه ارتفاع [@diwan-zuhayr، ص186]."
sources:
