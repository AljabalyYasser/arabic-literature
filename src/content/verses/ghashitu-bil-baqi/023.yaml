explained: false
first: "تَبُذُّ الْأُلَى يَأْتِينَهَا مِنْ وَرَائِهَا"
second: "وَإِنْ تَتَقَدَّمْهَا السَّوَابِقُ تَصْطَدِ"
vocabulary:
  - term: "تَبُذُّ"
    text: "تسبق الكلاب التي تأتيها من ورائها وتغلبها [@diwan-zuhayr، ص185]."
  - term: "تَصْطَدِ"
    text: "«أي: تصيب بقرنيها ما تقدّمها من الكلاب» [@diwan-zuhayr، ص185]."
