first: "إِذَا ابْتَدَرَتْ قَيْسُ بْنُ عَيْلَانَ غَايَةً"
second: "مِنَ الْمَجْدِ مَنْ يَسْبِقْ إِلَيْهَا يُسَوَّدِ"
meaning: "إذا تسابقت قبائل قيس عيلان إلى غاية من غايات المجد، يكون من يسبق إليها سيّدًا. والجواب في البيت التالي: سبقتَ أنت إليها."
vocabulary:
  - term: "ابْتَدَرَتْ"
    text: "تسابقت. يقول الأعلم: «إذا تسابقت لإدراك غاية من المجد» [@diwan-zuhayr، ص189]."
  - term: "قَيْسُ بْنُ عَيْلَانَ"
    text: "القبيلة الكبرى، وهي عند الأعلم «قبيلة» [@diwan-zuhayr، ص189]."
  - term: "غَايَةً"
    text: "ما يُنتهى إليه في السباق. ويقول محقق الشرح المنسوب إلى ثَعْلَب: «والغاية: راية تكون في الموضع الذي يتسابق إليه، يأخذها أول السابقين» [@sharh-thalab-zuhayr، ص169]."
  - term: "يُسَوَّدِ"
    text: "يُجعل سيّدًا."
context: "أول ثلاثة أبيات أنشدها عمر بن الخطاب لابن عباس حين طلب منه شعر «شاعر الشعراء»، وعلّل تقديمه زهيرًا: «لأنه لا يتّبع حوشيّ الكلام، ولا يعاظل من المنطق، ولا يقول إلا ما يعرف، ولا يمتدح الرجل إلا بما يكون فيه. أليس الذي يقول» وأنشد هذا البيت والبيتين بعده والبيت 42 [@aghani-dk، ج10 ص290–291]. وبهذا البيت يبدأ ابن قُتَيْبة شواهده بعد قول عمر [@ibn-qutayba، ج1 ص138]. وفي القصيدة ينقل البيت المدح من الصفات المفردة (30–35) إلى صورة السباق، فتمتد في ثلاثة أبيات."
syntax:
  - "«إِذَا ابْتَدَرَتْ»: «إذا» ظرف شرط، وجملة «ابتدرت قيس» في موضع جر بإضافة «إذا» إليها، وأُنّث الفعل لأن قيسًا قبيلة. و«ابْنُ» صفة لـ«قيس»، و«غَايَةً» مفعول به."
  - "«مِنَ الْمَجْدِ» متعلق بمحذوف صفة لـ«غاية». و«مَنْ يَسْبِقْ إِلَيْهَا يُسَوَّدِ» جملة شرطية صفة ثانية لـ«غاية»: «من» اسم شرط مبتدأ، و«يسبقْ» فعل الشرط مجزوم، و«يُسوّدِ» جوابه مجزوم وكُسر للقافية."
  - "جواب «إذا» ليس في هذا البيت، بل في الذي بعده: «سبقتَ إليها»."
morphology:
  - "«ابْتَدَرَ» على «افْتَعَلَ» من «بدر»، وفيه معنى المشاركة: بادر بعضهم بعضًا."
  - "«يُسَوَّد» مضارع مبني للمجهول من «سوّد» على «فعّل»: جعله سيدًا."
  - "«عَيْلَان» على «فَعْلان»، ممنوع من الصرف للعلمية وزيادة الألف والنون."
rhetoric:
  thesis: "المجد سباق علني بين القبائل، والسيادة جائزة السابق."
  devices:
    - title: "الاستعارة في «ابْتَدَرَتْ ... غَايَةً»"
      text: "جعل طلب المجد سباقًا إلى غاية، ولم يصرح بالتشبيه، فهي استعارة: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. وقد بنى زهير المدح على الصورة نفسها في قصيدته الأخرى في هرم: «يطلب شأو امرأين»."
    - title: "التضمين"
      text: "لا يتم البيت بنفسه: «إذا ابتدرت» شرط جوابه في البيت التالي «سبقتَ إليها». والتضمين أن يتعلق البيت بما بعده فلا يتم معناه إلا به، فيبقى السامع معلقًا عند «يُسوَّد» حتى يسمع من السابق."
    - title: "العموم قبل الخصوص"
      text: "«قَيْسُ بْنُ عَيْلَانَ»: ذكر القبيلة الكبرى كلها متسابقة، ولم يذكر هرمًا، فإذا جاء الجواب «سبقتَ» كان سبقه سبقًا على قيس جميعًا."
  connection: "ثم يأتي الجواب: سبقت إليها كل طلق مبرّز."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِذَبْتَ / دَرَتْ قَيْسُبْ / نُعَيْلَا / نَغَايَتَنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — مِنَلْمَجْ / دِمَنْ يَسْبِقْ / إِلَيْهَا / يُسَوْوَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الأولى في الصدر [@atiq، ص29]. وتسقط همزة الوصل في «ابتدرت» و«ابن» في النطق."
