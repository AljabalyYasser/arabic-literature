first: "تُبَادِرُ أَغْوَالَ الْعَشِيِّ وَتَتَّقِي"
second: "عُلَالَةَ مَلْوِيٍّ مِنَ الْقِدِّ مُحْصَدِ"
vocabulary:
  - term: "أَغْوَالَ الْعَشِيِّ"
    text: "جمع غول، وهو ما اغتال الإنسان وأهلكه. أي: تبادر براكبها ما يخاف أن يغوله حتى تلحقه بالمنزل الذي يبيت فيه [@diwan-zuhayr، ص181]."
  - term: "عُلَالَةَ مَلْوِيٍّ مِنَ الْقِدِّ مُحْصَدِ"
    text: "يريد سوطًا مفتولًا من القِدّ، وهو ما قُدّ من الجلد، والمحصد: «الشديد الفتل» [@diwan-zuhayr، ص181]."
sources:
