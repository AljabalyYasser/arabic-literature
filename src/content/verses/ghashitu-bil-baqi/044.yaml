first: "تَزَوَّدْ إِلَى يَوْمِ الْمَمَاتِ فَإِنَّهُ"
second: "وَلَوْ كَرِهَتْهُ النَّفْسُ آخِرُ مَوْعِدِ"
meaning: "خذ من المكارم زادًا ليوم موتك، فالموت آخر موعد يلقاه المرء، وإن كرهته نفسه."
vocabulary:
  - term: "تَزَوَّدْ"
    text: "اتخذ زادًا، والزاد ما يحمله المسافر. والمراد عند الأعلم المكارم والمحامد: «فأورث بعض مكارمك ومحامدك بنيك، وتزوّد بعضها لما بعد موتك» [@diwan-zuhayr، ص191]."
  - term: "آخِرُ مَوْعِدِ"
    text: "الموت. يقول الأعلم: «فإنّ الموت موعد لا بدّ منه، وإن كرهته النفس. فينبغي أن تتزوّد له» [@diwan-zuhayr، ص191]."
context: "خاتمة القصيدة. يبدأ بفعل الأمر الذي ختم به البيت السابق «وتزوّدِ»، فيصل البيتين. ويستشهد به شوقي ضيف على أن «التفكير فى الحياة والموت يكثر عند زهير» [@deif، ج1 ص325–326]. وهو آخر القصيدة في الروايتين، وفي الشرح المنسوب إلى ثَعْلَب رقمه 46 [@sharh-thalab-zuhayr، ص170]."
syntax:
  - "«تَزَوَّدْ»: فعل أمر مبني على السكون، وفاعله ضمير المخاطب هرم. و«إِلَى يَوْمِ الْمَمَاتِ» متعلق به."
  - "«فَإِنَّهُ»: الفاء للتعليل، والهاء اسم «إنّ» تعود على يوم الممات، و«آخِرُ مَوْعِدِ» خبرها."
  - "«وَلَوْ كَرِهَتْهُ النَّفْسُ»: جملة معترضة بين اسم «إنّ» وخبرها، و«لو» فيها وصلية لا جواب لها."
morphology:
  - "«تَزَوَّدْ» أمر من «تزوّد» على «تفعّل» من «الزاد»: اتخذه لنفسه."
  - "«الْمَمَات» مصدر ميمي من «مات» على «مَفْعَل»، و«مَوْعِد» مصدر ميمي أو اسم زمان من «وعد» على «مَفْعِل»."
rhetoric:
  thesis: "الحكمة خاتمة المدح: الموت موعد لا يُخلف، وخير ما يُعدّ له ما يبقى من الحمد."
  devices:
    - title: "الاستعارة في «تَزَوَّدْ»"
      text: "الزاد ما يحمله المسافر، فجعل الموت سفرًا والمكارم زادًا له، ولم يصرح بالتشبيه، فهي استعارة: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "«آخِرُ مَوْعِدِ»"
      text: "سمّى الموت موعدًا، والموعد يُضرب ويُنتظر ولا يُخلف، ثم وصفه بأنه «آخر»: بعده لا موعد. فجمع لفظان يقين الموت ونهايته."
    - title: "الاعتراض"
      text: "«وَلَوْ كَرِهَتْهُ النَّفْسُ»: اعترض بين اسم «إنّ» وخبرها بما يقرّ بكراهة النفس للموت، ثم أتم الحكم كأن الكراهة لا تغيّر شيئًا. والاعتراض: جملة تدخل بين متلازمين لفائدة."
    - title: "وصل البيتين بالتكرار"
      text: "«وَتَزَوَّدِ» آخر البيت السابق، و«تَزَوَّدْ» أول هذا البيت: كرر الأمر فوصل البيتين، وصارت الكلمة التي ختم بها المدح أولَ الخاتمة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "تَزَوْوَدْ / إِلَى يَوْمِلْ / مَمَاتِ / فَإِنْنَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — وَلَوْكَ / رِهَتْهُنْنَفْ / سُآخِ / رُمَوْعِدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "أُشبعت ضمة الهاء في «فَإِنَّهُ». ودخل القبض «فعولن» الثانية في الصدر والأولى والثانية في العجز [@atiq، ص29]."
