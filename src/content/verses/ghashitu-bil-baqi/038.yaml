first: "كَفَضْلِ جَوَادِ الْخَيْلِ يَسْبِقُ عَفْوُهُ الـ"
second: "ـسِّرَاعَ وَإِنْ يَجْهَدْنَ يَجْهَدْ وَيَبْعُدِ"
meaning: "فضلك على أهل الكرم كفضل الفرس الجواد على الخيل السريعة: يسبقها وهو يجري عفوًا بلا جهد، فإذا اجتهدت هي اجتهد هو فبعُد عنها."
vocabulary:
  - term: "عَفْوُهُ"
    text: "عند الأعلم: «ما جاء منه عفوًا، دون أن يجهد نفسه» [@diwan-zuhayr، ص189]."
  - term: "السِّرَاعَ"
    text: "الخيل السريعة، جمع سريع."
  - term: "يَجْهَدْنَ يَجْهَدْ"
    text: "«أي: إن حملن أنفسهنّ على الجهد، لبعد الغاية، جهد هو نفسه، وبعُد عنهنّ» [@diwan-zuhayr، ص189]. وفي الشرح المنسوب إلى ثَعْلَب: «ويجهدن: للخيل. ويجهد: للفرس» [@sharh-thalab-zuhayr، ص169]."
context: "ثالث الأبيات التي أنشدها عمر في خبر ابن عباس، وبعده عنده بيت الحمد «ولو كان حمد يخلد الناس لم تمت» [@aghani-dk، ج10 ص291]. ويتم صورة السباق التي بدأت في البيت 36: قال البيت السابق إنه سبق، وهذا يقول كيف سبق."
syntax:
  - "«كَفَضْلِ جَوَادِ الْخَيْلِ»: الجار والمجرور خبر لمبتدأ محذوف، وتقديره عند الأعلم: «فضلك على أهل الكرم والفضل كفضل الجواد من الخيل على السراع منها» [@diwan-zuhayr، ص189]."
  - "جملة «يَسْبِقُ عَفْوُهُ السِّرَاعَ» حال من «جواد الخيل»، و«عفوه» فاعل، و«السراع» مفعول به."
  - "«وَإِنْ يَجْهَدْنَ يَجْهَدْ وَيَبْعُدِ»: «إن» شرطية، و«يجهدن» فعل الشرط مبني على السكون لاتصاله بنون النسوة، والنون فاعل يعود على «السراع»، و«يجهدْ» جوابه مجزوم، و«يبعدِ» معطوف عليه مجزوم وكُسر للقافية."
morphology:
  - "«السِّرَاع» جمع «سريع» على «فِعال»، و«جَوَاد» على «فَعَال»."
  - "«يَجْهَدْنَ» مضارع «جَهَدَ» على «فَعَلَ يَفْعَلُ»، لأن عينه حرف حلق، والنون نون النسوة."
  - "«يَبْعُدِ» مضارع «بَعُدَ» على «فَعُلَ يَفْعُلُ»."
rhetoric:
  thesis: "الفضل الحق أن يغلب عفوُك جهدَ غيرك، ثم تبقى لك فضلة إذا جدّوا."
  devices:
    - title: "التمثيل"
      text: "«كَفَضْلِ جَوَادِ الْخَيْلِ»: ليس تشبيه صفة بصفة، بل تشبيه حال بحال: سبق بلا عناء، ثم زيادة السبق كلما اشتد الجهد. وهذا ما يسميه عبد القاهر تمثيلًا، ويقول: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. ووجه الشبه هيئة تُنتزع من أمور عدة: العفو، والسرعة، والجهد، والبعد."
    - title: "المقابلة بين «عَفْوُهُ» و«يَجْهَدْنَ»"
      text: "قابل عفو الجواد بجهد السراع، ثم ردّ الجهد عليه في «يَجْهَدْ»: فإذا تساويا في الجهد ظهر الفرق كله «ويبعد». فالبيت يقيس الفضل في حالين: الراحة والشدة."
    - title: "التدوير"
      text: "«عَفْوُهُ الـ / ـسِّرَاعَ»: انقسمت كلمة «السراع» بين الشطرين، والتدوير أن يشترك الشطران في كلمة واحدة. فاتصل الصدر بالعجز، كأن الجواد لا يقف عند حد الشطر."
  connection: "ثم ينتقل من السبق إلى العفة: تقي نقي لا يكثّر غنيمة بظلم قريب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَفَضْلِ / جَوَادِلْخَيْ / لِيَسْبِ / قُعَفْوُهُسْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — سِرَاعَ / وَإِنْ يَجْهَدْ / نَيَجْهَدْ / وَيَبْعُدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "البيت مدوّر: لام «السراع» في آخر الصدر تُدغم في السين، فيبدأ العجز بالسين المشددة. وتتصل ضمة الهاء في «عفوهُ» بالسين المشددة فيصير المقطع «هُسْ». ودخل القبض «فعولن» مرتين في الصدر ومرة في العجز [@atiq، ص29]."
variants:
  - reading: "وَإِنْ يَجْهَدْنَ يَجْهَدْ وَيُبْعِدِ"
    status: "رواية الشرح المنسوب إلى ثعلب"
    note: "وفيه أن «ويُبعد» معناه يسبق بعيدًا، وأنه يروى «ويَبْعُدِ» كما عند الأعلم، ويروى «كَسَبْقِ جَوَادِ الْخَيْلِ» [@sharh-thalab-zuhayr، ص169]."
  - reading: "كَفِعْلِ جَوَادٍ يَسْبِقُ الْخَيْلَ عَفْوُهُ الـ ... ـسِّرَاعَ وَإِنْ يَجْهَدْ وَيَجْهَدْنَ يَبْعُدِ"
    status: "رواية الأغاني"
    note: "في خبر عمر [@aghani-dk، ج10 ص291]."
