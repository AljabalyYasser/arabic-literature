first: "فَلَوْ كَانَ حَمْدٌ يُخْلِدُ النَّاسَ لَمْ تَمُتْ"
second: "وَلَكِنَّ حَمْدَ النَّاسِ لَيْسَ بِمُخْلِدِ"
meaning: "لو كان الحمد يُبقي أصحابه أحياء لما متَّ أبدًا، فقد جمعتَ منه ما لم يجمعه غيرك، ولكن حمد الناس لا يُخلد أحدًا."
vocabulary:
  - term: "حَمْدٌ"
    text: "الثناء، وهو عند الأَعْلَم «الفعل المحمود» [@diwan-zuhayr، ص191]."
  - term: "يُخْلِدُ"
    text: "يجعله خالدًا باقيًا. يقول الأعلم: «لو أنّ الفعل المحمود يُخلد صاحبه لخلّدك ولم تمت، ولكنّه لا يُخلد» [@diwan-zuhayr، ص191]."
context: "يلتقي فيه المدح والحكمة: يبدأ بهرم «لم تمت» وينتهي بحكم عام في الناس. وبه عرّف عُمَر بن الخَطّاب زهيرًا في خبر آخر: سأل «هل تروي لشاعر الشعراء؟»، فلما قيل له: ومن هو؟ قال: «الذي يقول» وأنشده، فلما قيل: ذاك زهير، قال: «فذاك شاعر الشعراء» [@aghani-dk، ج10 ص289]. وهو عند ابن قُتَيْبة مع البيتين 36–37 شاهد على قول عمر [@ibn-qutayba، ج1 ص138]، وعند شَوْقِي ضَيْف من الحكم التي ينثرها زهير في شعره [@deif، ج1 ص326]."
syntax:
  - "«فَلَوْ كَانَ حَمْدٌ يُخْلِدُ النَّاسَ»: «لو» حرف امتناع لامتناع، و«كان» ناقصة، و«حمد» اسمها، وجملة «يخلد الناس» خبرها. وجواب «لو» «لم تمت»، وجاء منفيًّا بـ«لم» بلا لام."
  - "«وَلَكِنَّ حَمْدَ النَّاسِ لَيْسَ بِمُخْلِدِ»: «لكنّ» حرف استدراك، و«حمد الناس» اسمها، وجملة «ليس بمخلد» خبرها، والباء زائدة في خبر «ليس»."
morphology:
  - "«يُخْلِدُ» مضارع «أَخْلَدَ» على «أَفْعَلَ»، والهمزة للتعدية: خَلَد هو، وأخلده غيره. و«مُخْلِد» اسم فاعله."
  - "«حَمْد» مصدر على «فَعْل»، جاء نكرة في الصدر ومعرّفًا بالإضافة في العجز."
rhetoric:
  thesis: "أعلى المدح أن يُنفى عن الممدوح الموت فرضًا، ثم يُرَدّ إلى سنّة الناس."
  devices:
    - title: "«لو» واحتياط المبالغة"
      text: "«فَلَوْ كَانَ حَمْدٌ يُخْلِدُ النَّاسَ لَمْ تَمُتْ»: الحكم بأنه لا يموت معلّق على شرط ممتنع، فيبلغ المدح أقصاه ولا يقع في الكذب. وهي الطريقة التي يرى شوقي ضيف أن زهيرًا يقدّم فيها «لو» ونحوها «حتى لا يتجاوز القصد» [@deif، ج1 ص313]."
    - title: "الاستدراك"
      text: "«وَلَكِنَّ حَمْدَ النَّاسِ لَيْسَ بِمُخْلِدِ»: يرفع ما أوهمه الشرط، فيعود الكلام من الممدوح إلى الناس جميعًا. ثم يستدرك على الاستدراك في البيت التالي: «ولكنّ منه باقيات وراثة»."
    - title: "التنكير والتعريف"
      text: "«حَمْدٌ» نكرة في الصدر، أي حمد ما ولو عظم، و«حَمْدَ النَّاسِ» معرّف بالإضافة في العجز، أي الحمد كله. فانتقل من الفرض في رجل واحد إلى الحكم العام."
  connection: "ثم يستدرك: في الحمد بقية تورث وزاد يُتزوّد."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَلَوْكَا / نَحَمْدُنْ يُخْ / لِدُنْنَا / سَلَمْتَمُتْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَلَاكِنْ / نَحَمْدَنْنَا / سِلَيْسَ / بِمُخْلِدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» الثانية في العجز [@atiq، ص29]. وتكتب «لكنّ» بلا ألف وتنطق «لاكنّ»."
variants:
  - reading: "وَلَوْ أَنَّ حَمْدًا يُخْلِدُ النَّاسَ أُخْلِدُوا"
    status: "رواية الأغاني"
    note: "في خبر عمر وشاعر الشعراء [@aghani-dk، ج10 ص289]. وفي خبر ابن عَبّاس عنده: «ولو كان حمد يخلد الناس لم تمت» [@aghani-dk، ج10 ص291]."
  - reading: "وَلَكِنَّ حَمْدَ الْمَرْءِ لَيْسَ بِمُخْلِدِ"
    status: "رواية ابن قتيبة"
    note: "[@ibn-qutayba، ج1 ص138]. ويقول محقق الشرح المنسوب إلى ثَعْلَب إن «حمد المرء» و«يخلد المرء» في نسختين منه [@sharh-thalab-zuhayr، ص170]."
  - reading: "فَلَوْ كَانَ حَمْدٌ يُخْلِدُ النَّاسَ لَمْ يَمُتْ"
    status: "رواية الشرح المنسوب إلى ثعلب"
    note: "[@sharh-thalab-zuhayr، ص170]."
