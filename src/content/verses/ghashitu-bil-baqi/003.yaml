explained: false
first: "وَغَيْرُ ثَلَاثٍ كَالْحَمَامِ خَوَالِدٍ"
second: "وَهَابٍ مُحِيلٍ هَامِدٍ مُتَلَبِّدِ"
vocabulary:
  - term: "ثَلَاثٍ كَالْحَمَامِ"
    text: "يعني الأثافي، وهي حجارة القدر، شبّهها بالحمام «لأنها سود تضرب إلى الغبرة» [@diwan-zuhayr، ص178]."
  - term: "خَوَالِدٍ"
    text: "«الباقية المقيمة» [@diwan-zuhayr، ص178]."
  - term: "وَهَابٍ"
    text: "رماد «عليه هبوة أي: غبرة» [@diwan-zuhayr، ص178]."
  - term: "مُحِيلٍ هَامِدٍ مُتَلَبِّدِ"
    text: "المحيل: الذي أتى عليه حول، والهامد: المتغير، من همدت النار إذا طفئت، والمتلبد: الذي تردّدت عليه الأمطار حتى لصق بعضه ببعض [@diwan-zuhayr، ص178]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص177–178"
    url: "https://archive.org/details/3917pdf/page/n177/mode/1up"
status: "review"
