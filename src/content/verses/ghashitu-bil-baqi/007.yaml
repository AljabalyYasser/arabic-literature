explained: false
first: "تَرِدْهُ وَلَمَّا يُخْرِجِ السَّوْطُ شَأْوَهَا"
second: "مَرُوحًا جَنُوحَ اللَّيْلِ نَاجِيَةَ الْغَدِ"
vocabulary:
  - term: "لَمَّا يُخْرِجِ السَّوْطُ شَأْوَهَا"
    text: "«أي: لم يستخرج كلّ عفوها، وما تسمح به نفسها» [@diwan-zuhayr، ص179]."
  - term: "مَرُوحًا جَنُوحَ اللَّيْلِ"
    text: "المروح: التي تمرح في سيرها، والجنوح: التي تميل في سيرها من النشاط [@diwan-zuhayr، ص179]."
  - term: "نَاجِيَةَ الْغَدِ"
    text: "سريعة من الغد: تسير ليلها ثم تنجو في الغد «ولم يكسرها سراها» [@diwan-zuhayr، ص179]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص179"
    url: "https://archive.org/details/3917pdf/page/n179/mode/1up"
