first: "أَجَارَتَنَا إِنَّ الْمَزَارَ قَرِيبُ"
second: "وَإِنِّي مُقِيمٌ مَا أَقَامَ عَسِيبُ"
meaning: "يا جارتنا، إن قبركِ الذي أزوره قريب مني، وإني باقٍ هنا ما بقي جبل عَسِيب؛ أي لن أبرح هذا المكان. وفي الديوان أنه قالها «عند موته» [@diwan-imru-al-qais، ص357]."
vocabulary:
  - term: "أَجَارَتَنَا"
    text: "يخاطب صاحبة القبر، وكانت «من بنات ملوك الروم هلكت بأَنْقِرَة» [@ibn-qutayba، ج1 ص121]؛ فصارت جارته في الغربة."
  - term: "الْمَزَارَ"
    text: "موضع الزيارة، وهو هنا قبرها."
  - term: "عَسِيبُ"
    text: "جبل [@ibn-qutayba، ج1 ص121]؛ وفي رواية ابن الكَلْبِيّ أن القبر كان في سفحه [@deif، ج1 ص240]."
syntax:
  - "الهمزة حرف نداء للقريب، و«جارةَ» منادى مضاف منصوب، و«نا» مضاف إليه."
  - "«إِنَّ الْمَزَارَ قَرِيبُ» «الْمَزَارَ» اسم «إِنَّ»، و«قَرِيبُ» خبرها."
  - "«مَا أَقَامَ عَسِيبُ» «مَا» مصدرية ظرفية، أي: مدة إقامة عسيب، و«عَسِيبُ» فاعل «أَقَامَ»."
morphology:
  - "«جارة» مؤنث «جار»."
  - "«مَزَار» مصدر ميمي أو اسم مكان من «زار يزور» على «مَفْعَل»، أصله «مَزْوَر»، نُقلت فتحة الواو إلى الزاي فقُلبت ألفًا."
  - "«مُقِيمٌ» اسم فاعل من «أَقَامَ» الأجوف، أصله «مُقْوِم»، نُقلت كسرة الواو إلى القاف فقُلبت ياء."
rhetoric:
  thesis: "غريب يحتضر يخاطب غريبة ميتة. يبدأ بقرب قبرها منه، ثم يعلن أنه باقٍ هنا إلى الأبد، أي أنه سيُدفن حيث هي."
  devices:
    - title: "النداء بأداة القريب"
      text: "نادى صاحبة القبر بالهمزة، وهي لنداء القريب، كأنها حاضرة تسمعه."
    - title: "الكناية"
      text: "«مُقِيمٌ مَا أَقَامَ عَسِيبُ» كناية عن الموت والدفن في ذلك المكان؛ فالجبل لا يبرح مكانه، وهو كذلك."
    - title: "التَّصْرِيع بالنقص"
      text: "جعل العَرُوض «قَرِيبُ» على «فعولن» لتوافق الضرب «عَسِيبُ». وليس هذا من أعاريض الطويل المعروفة، وإنما قُبل في المطلع للمشاكلة بين العَرُوض والضرب [@ahda-sabil، ص84]."
  connection: "ثم يقول: «أَجَارَتَنَا إِنَّا غَرِيبَانِ هَا هُنَا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "أَجَارَ / تَنَا إِنْنَلْ / مَزَارَ / قَرِيبُو = فعولُ / مفاعيلن / فعولُ / فعولن — وَإِنْنِي / مُقِيمُنْ مَا / أَقَامَ / عَسِيبُو = فعولن / مفاعيلن / فعولُ / فعولن"
  note: "الضرب «فعولن» محذوف، وهو أحد ضروب الطويل الثلاثة [@atiq، ص30–31]. أما العَرُوض فحقها «مفاعلن»، لكنها جاءت «فعولن» في المطلع لتوافق الضرب، وبهذا البيت نفسه يمثّل محمود مصطفى للتصريع بالنقص [@ahda-sabil، ص84]."
context: "تقول الرواية إنه مات بعد ذلك، فدُفن إلى جنب المرأة [@deif، ج1 ص240]. والقطعة في الديوان بيتان، في زيادات نسخة أبي سهل [@diwan-imru-al-qais، ص357]، وكذلك هي عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص121]."
variants:
  - reading: "أَجَارَتَنَا إِنَّ الْخُطُوبَ تَنُوبُ"
    status: "نشرة دار المعرفة"
    note: "وبها كان نصنا قبل نقله إلى طبعة أبي الفضل إبراهيم، وفيها القطعة خمسة أبيات. والخطوب: المصائب، وتنوب: تنزل. ورواية الديوان «إن المزار قريب» رواية ابن قُتَيْبة [@ibn-qutayba، ج1 ص121] وشوقي ضيف [@deif، ج1 ص240]."
