first: "أَجَارَتَنَا إِنَّ الْخُطُوبَ تَنُوبُ"
second: "وَإِنِّي مُقِيمٌ مَا أَقَامَ عَسِيبُ"
meaning: "يا جارتنا، إن المصائب تنزل بالناس وتتعاقب عليهم، وإني باقٍ هنا ما بقي جبل عَسِيب؛ أي لن أبرح هذا المكان. قالها حين رأى قبر امرأة في سفح عسيب [@diwan-imru-al-qais، ص83]."
vocabulary:
  - term: "أَجَارَتَنَا"
    text: "يخاطب صاحبة القبر، وكانت «من بنات ملوك الروم هلكت بأَنْقِرَة» [@ibn-qutayba، ج1 ص121]؛ فصارت جارته في الغربة."
  - term: "الْخُطُوبَ"
    text: "جمع خَطْب، وهو الأمر العظيم."
  - term: "تَنُوبُ"
    text: "تنزل وتعرض، من «ناب الأمرُ» إذا نزل."
  - term: "عَسِيبُ"
    text: "جبل [@ibn-qutayba، ج1 ص121]؛ وفي رواية ابن الكَلْبِيّ أن القبر كان في سفحه [@deif، ج1 ص240]."
syntax:
  - "الهمزة حرف نداء للقريب، و«جارةَ» منادى مضاف منصوب، و«نا» مضاف إليه."
  - "«إِنَّ الْخُطُوبَ تَنُوبُ» «الْخُطُوبَ» اسم «إِنَّ»، وجملة «تَنُوبُ» خبرها."
  - "«مَا أَقَامَ عَسِيبُ» «مَا» مصدرية ظرفية، أي: مدة إقامة عسيب، و«عَسِيبُ» فاعل «أَقَامَ»."
morphology:
  - "«جارة» مؤنث «جار»."
  - "«تَنُوبُ» مضارع «ناب ينوب»، أجوف واوي."
  - "«مُقِيمٌ» اسم فاعل من «أَقَامَ» الأجوف، أصله «مُقْوِم»، نُقلت كسرة الواو إلى القاف فقُلبت ياء."
rhetoric:
  thesis: "غريب يحتضر يخاطب غريبة ميتة. يبدأ بحقيقة عامة عن المصائب، ثم يعلن أنه باقٍ هنا إلى الأبد، أي أنه سيُدفن حيث هي."
  devices:
    - title: "النداء بأداة القريب"
      text: "نادى صاحبة القبر بالهمزة، وهي لنداء القريب، كأنها حاضرة تسمعه."
    - title: "الكناية"
      text: "«مُقِيمٌ مَا أَقَامَ عَسِيبُ» كناية عن الموت والدفن في ذلك المكان؛ فالجبل لا يبرح مكانه، وهو كذلك."
    - title: "التَّصْرِيع بالنقص"
      text: "جعل العَرُوض «تَنُوبُ» على «فعولن» لتوافق الضرب «عَسِيبُ». وليس هذا من أعاريض الطويل المعروفة، وإنما قُبل في المطلع للمشاكلة بين العَرُوض والضرب [@ahda-sabil، ص84]."
  connection: "ثم يقول: «أَجَارَتَنَا إِنَّا غَرِيبَانِ هَا هُنَا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "أَجَارَ / تَنَا إِنْنَلْ / خُطُوبَ / تَنُوبُو = فعولُ / مفاعيلن / فعولُ / فعولن — وَإِنْنِي / مُقِيمُنْ مَا / أَقَامَ / عَسِيبُو = فعولن / مفاعيلن / فعولُ / فعولن"
  note: "الضرب «فعولن» محذوف، وهو أحد ضروب الطويل الثلاثة [@atiq، ص30–31]. أما العَرُوض فحقها «مفاعلن»، لكنها جاءت «فعولن» في المطلع لتوافق الضرب، وبهذا البيت نفسه يمثّل محمود مصطفى للتصريع بالنقص [@ahda-sabil، ص84]."
context: "تقول الرواية إنه مات بعد ذلك، فدُفن إلى جنب المرأة [@deif، ج1 ص240]. والقطعة في الديوان خمسة أبيات [@diwan-imru-al-qais، ص83]."
variants:
  - reading: "أَجَارَتَنَا إِنَّ الْمَزَارَ قَرِيبُ"
    status: "رواية ابن قُتَيْبة"
    note: "كذا يرويه ابن قُتَيْبة [@ibn-qutayba، ج1 ص121] وشوقي ضيف [@deif، ج1 ص240]. والمزار: موضع الزيارة، أي أن قبرها قريب منه."
