first: "أَجَارَتَنَا إِنَّا غَرِيبَانِ هَا هُنَا"
second: "وَكُلُّ غَرِيبٍ لِلْغَرِيبِ نَسِيبُ"
meaning: "يا جارتنا، نحن غريبان في هذا المكان، وكل غريب قريبٌ للغريب؛ تجمعهما الغربة كما يجمع النسبُ الأقارب."
vocabulary:
  - term: "هَا هُنَا"
    text: "في هذا المكان."
  - term: "نَسِيبُ"
    text: "قريب يجمعه به نسب."
syntax:
  - "«إِنَّا غَرِيبَانِ» «إِنَّ» واسمها «نا»، و«غَرِيبَانِ» خبرها مرفوع بالألف لأنه مثنى."
  - "«هَا هُنَا» «هَا» للتنبيه، و«هُنَا» اسم إشارة للمكان مبني في محل نصب على الظرفية، متعلق بـ«غَرِيبَانِ»."
  - "«وَكُلُّ غَرِيبٍ لِلْغَرِيبِ نَسِيبُ» جملة اسمية: «كلُّ» مبتدأ، و«نَسِيبُ» خبره، و«لِلْغَرِيبِ» متعلق بـ«نَسِيبُ»."
morphology:
  - "«غَرِيبٍ» صفة مشبهة على «فعيل» من «غَرُب»."
  - "«نَسِيبُ» فعيل من النسب، بمعنى المناسب القريب."
  - "«غَرِيبَانِ» مثنى «غَرِيبٍ»."
rhetoric:
  thesis: "البيت الذي بقي من القصة كلها. يجعل الغربة نسبًا يصل بين الحي والميت، وبين ابن ملوك كِنْدة وبنت ملوك الروم."
  devices:
    - title: "الحكمة الجارية مثلًا"
      text: "ختم البيت بحكمة عامة: «وَكُلُّ غَرِيبٍ لِلْغَرِيبِ نَسِيبُ»، فسار عجزه مثلًا، وعدّه المُبَرِّد من الأعجاز التي «تغني في التمثيل عن صدورها» [@mubarrad-ajaz، ص165]."
    - title: "التكرار"
      text: "كرّر لفظ الغريب ثلاث مرات في البيت: «غَرِيبَانِ»، «غَرِيبٍ»، «لِلْغَرِيبِ»، فصارت الكلمة محور البيت."
    - title: "التشبيه الضمني"
      text: "جعل الغربة نسبًا دون أداة تشبيه: الغريبان قريبان كما يكون ذوو النسب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة"
  scansion: "أَجَارَ / تَنَا إِنْنَا / غَرِيبَا / نِ هَا هُنَا = فعولُ / مفاعيلن / فعولن / مفاعلن — وَكُلْلُ / غَرِيبِنْ لِلْ / غَرِيبِ / نَسِيبُو = فعولُ / مفاعيلن / فعولُ / فعولن"
  note: "العَرُوض هنا «مفاعلن» مقبوضة كما هي في سائر الطويل؛ فالتَّصْرِيع لا يكون إلا في المطلع [@ahda-sabil، ص84]. ولا يستقيم الوزن إلا بمدّ «هَا» في «هَا هُنَا»، وإن كُتبت في الديوان «هَهُنا»."
context: "وبعده في الديوان: «فَإِنْ تَصِلِينَا فَالْقَرَابَةُ بَيْنَنَا / وَإِنْ تَصْرِمِينَا فَالْغَرِيبُ غَرِيبُ» [@diwan-imru-al-qais، ص83]."
