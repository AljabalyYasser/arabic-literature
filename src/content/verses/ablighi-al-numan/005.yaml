explained: false
first: "أَجْلَ نُعْمَى رَبَّهَا أَوَّلُكُمْ"
second: "وَدُنُوِّي كَانَ مِنْكُمْ وَاصْطِهَارِي"
vocabulary:
  - term: "أَجْلَ"
    text: "من أجل؛ ويقول المحققون: «كلمة تستعمل للتعليل» [@aghani-dk، ج2 ص114، الحاشية]."
  - term: "رَبَّهَا"
    text: "ربّاها ونمّاها."
  - term: "اصْطِهَارِي"
    text: "مصاهرتي إياكم، ويقول المحققون إن الظاهر «أن الشاعر يريد المصاهرة» [@aghani-dk، ج2 ص114، الحاشية]."
