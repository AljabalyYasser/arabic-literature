first: "أَبْلِغِ النُّعْمَانَ عَنِّي مَأْلُكًا"
second: "أَنَّهُ قَدْ طَالَ حَبْسِي وَانْتِظَارِي"
meaning: "يا من يحمل رسالتي، أبلغ النُّعْمان عني رسالة: أن حبسي قد طال، وطال انتظاري لعفوه."
vocabulary:
  - term: "أَبْلِغِ"
    text: "أوصِلْ."
  - term: "مَأْلُكًا"
    text: "رسالة. قال البغدادي: «والمألك: بِسُكُون الْهمزَة وَضم اللَّام: الرسَالَة» [@khizana، ج8 ص513]."
  - term: "انْتِظَارِي"
    text: "ترقّبي لعفوه وإطلاقي."
context: "مطلع القصيدة كما يقول البغدادي: «وَهُوَ أول القصيدة» [@khizana، ج8 ص513]. ويرويها أبو الفَرَج في قصائد الحبس ويقول: «وقال له أيضا – وهى قصيدة طويلة –» [@aghani-dk، ج2 ص114]، ويقول ابن قُتَيْبة إن عَدِيًّا «قال فى الحبس أشعارا وبعث بها إليه»، ومنها هذا البيت والذي بعده [@ibn-qutayba، ج1 ص223]. فالبيت رسالة سجين إلى الملك الذي سجنه، وما بعده يقول لماذا لا يملك إلا الرسالة."
syntax:
  - "«أَبْلِغِ» فعل أمر، وكُسر آخره لالتقاء الساكنين، والفاعل ضمير المخاطب، و«النُّعْمَانَ» مفعول به أول، و«عَنِّي» متعلق بـ«أبلغ»، و«مَأْلُكًا» مفعول به ثانٍ."
  - "«أَنَّهُ قَدْ طَالَ حَبْسِي» «أنّ» واسمها ضمير الشأن، وجملة «قد طال حبسي» خبرها، والمصدر المؤول بدل من «مألكًا»: هذه هي الرسالة."
  - "«وَانْتِظَارِي» معطوف على «حبسي» مرفوع بضمة مقدرة."
morphology:
  - "«أَبْلِغْ» أمر من «أَبْلَغَ» على «أَفْعَل»، وهمزته همزة قطع."
  - "«مَأْلُك» على «مَفْعُل» من «أَلَكَ»، أي أرسل، ويذكر البغدادي عن الزجاج أن «مألك جمع مألكة» [@khizana، ج8 ص513]."
  - "«انْتِظَار» مصدر «انْتَظَرَ» على «افْتِعال»."
rhetoric:
  thesis: "لا يمدح ولا يستعطف في المطلع، بل يخبر بخبر واحد: طال الحبس. وفي هذا الخبر المقتضب عتاب أبلغ من الشكوى: الملك يعرف من هو المحبوس، ويعرف لماذا طال انتظاره."
  devices:
    - title: "الخطاب للرسول في «أَبْلِغْ»"
      text: "يخاطب رسولًا لا يسميه، وهي عادة الشعراء في الرسائل: «أبلغ فلانًا». وبها يكلّم الملك دون أن يواجهه، فيبقى الكلام بين الأدب والعتاب."
    - title: "الجمع في «حَبْسِي وَانْتِظَارِي»"
      text: "جمع عذابين: عذاب الجسد في الحبس، وعذاب النفس في الانتظار، وجعل الطول لهما معًا. وهي قراءتنا."
  connection: "يأتي في البيت التالي بالمثل الذي يشرح حاله: «لَوْ بِغَيْرِ الْمَاءِ حَلْقِي شَرِقٌ»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ الراء المكسورة، والقافية مطلقة موصولة بالياء"
  scansion: "أَبْلِغِنْنُعْ / مَانَ عَنْنِي / مَأْلُكَا = فاعلاتن / فاعلاتن / فاعلن — أَنْنَهُو قَدْ / طَالَ حَبْسِي / وَنْتِظَارِي = فاعلاتن / فاعلاتن / فاعلاتن"
  note: "العروض «فاعلن» محذوفة: سقط من «فاعلاتن» سببها الأخير، والضرب «فاعلاتن» تام، وهذا ضرب من ضروب الرمل. وتُشبع ضمة الهاء في «أَنَّهُ»."
