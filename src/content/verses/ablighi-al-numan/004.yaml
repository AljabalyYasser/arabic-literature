first: "قَاعِدًا يَكْرُبُ نَفْسِي بَثُّهَا"
second: "وَحَرَامًا كَانَ سِجْنِي وَاحْتِصَارِي"
vocabulary:
  - term: "يَكْرُبُ نَفْسِي بَثُّهَا"
    text: "يشتدّ عليها حزنها، ويقول المحققون: «يكرب نفسى بثها: يشتد عليها حزنها» [@aghani-dk، ج2 ص114، الحاشية]."
  - term: "احْتِصَارِي"
    text: "حبسي والتضييق عليّ؛ ويقول المحققون إن الظاهر من سياق الشعر «أن المراد الحصر بمعنى الحبس» [@aghani-dk، ج2 ص114، الحاشية]."
