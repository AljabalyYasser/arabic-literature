first: "لَوْ بِغَيْرِ الْمَاءِ حَلْقِي شَرِقٌ"
second: "كُنْتُ كَالْغَصَّانِ بِالْمَاءِ اعْتِصَارِي"
meaning: "لو غصصت بشيء غير الماء لَلَجأت إلى الماء أبتلع به ما غصصت به، فأما وقد غصصت بالماء نفسه فلا ملجأ لي. يريد: لو ظلمني غيرك لَلَجأت إليك، فأما وأنت الظالم فإلى من ألجأ؟ وينقل البغدادي عن أبي عبيد: «وَالْمعْنَى: لَو شَرقَتْ بِغَيْر المَاء أسغت شَرْقي بِالْمَاءِ فَإِذا غصصت بِالْمَاءِ فَبِمَ أسيغه» [@khizana، ج8 ص512]."
vocabulary:
  - term: "شَرِقٌ"
    text: "غاصّ. قال البغدادي: «وشرق فلانٌ بريقه أَو بِالْمَاءِ: إِذا غص بِهِ وَلم يقدر على بلعه» [@khizana، ج8 ص510]."
  - term: "الْغَصَّانِ"
    text: "من وقف الطعام في حلقه فلم يقدر على بلعه."
  - term: "اعْتِصَارِي"
    text: "لجوئي، وفي اللسان: «والاعْتِصَارُ: الِالْتِجَاءُ»، و«الاعْتِصار: أَن يَغَصَّ الإِنسان بِالطَّعَامِ فَيَعْتَصِر بِالْمَاءِ، وَهُوَ أَن يَشْرَبَهُ قَلِيلًا قَلِيلًا» [@lisan، ج4 ص580]."
context: "أشهر ما قاله عَدِيّ في حبسه، وقد صار مثلًا. قال الأَصْمَعِيّ: «هذا من أشرف أمثال العرب. يقول: إن كل من شرق بالماء لا مستغاث له»، وقال ابن عبد رَبِّه: «وأول من سبق إلى هذا المعنى عديّ بن زيد في قوله للنعمان بن المنذر» [@iqd، ج3 ص39] [@iqd، ج1 ص32]. ويقول المَرْزُبانيّ: «ينشد هذا البيت فيمن تستغيث به وتلجأ به» [@marzubani، ص249]، ويقول البغدادي: «وَقد صَار الْبَيْت مثلا للتأذي مِمَّن يُرْجَى إحسانه» [@khizana، ج8 ص512]. ويرويه الجاحِظ والعسكري والمَيْدانيّ [@hayawan، ج5 ص76] [@askari-amthal، ج2 ص203] [@maydani، ج2 ص186]. وفي القصيدة هو تفسير الرسالة في البيت الأول: لماذا لا يستغيث بأحد إلا بالنعمان نفسه."
syntax:
  - "«لَوْ» حرف شرط غير جازم، وحقها أن يليها فعل، وجاءت بعدها جملة اسمية «حَلْقِي شَرِقٌ». يقول البغدادي إن البيت شاهد «على أنّ الْجُمْلَة الاسمية بعد لَو وضعت مَوضِع الْجُمْلَة الفعلية شذوذاً» [@khizana، ج8 ص508]، ويذكر فيه ثلاثة أقوال: أنها وقعت موقع الفعلية، أو أن بعد «لو» «كان» الشأنية محذوفة، أو قول أبي علي الفارسي إن «حلقي» فاعل لفعل محذوف يفسره «شرق»، أي: لو شرق حلقي هو شرق [@khizana، ج8 ص508–509]."
  - "«بِغَيْرِ الْمَاءِ» متعلق بـ«شَرِق»، و«كُنْتُ» جواب «لو»، والتاء اسم «كان»."
  - "«بِالْمَاءِ اعْتِصَارِي» جملة اسمية: «اعتصاري» مبتدأ مؤخر، و«بالماء» خبر مقدم، والجملة خبر «كنت». و«كالغصّان» عند أبي علي «فِي مَوضِع حَال وَالْعَامِل فِيهِ كنت»، وعند العيني خبر «كنت» [@khizana، ج8 ص510]."
morphology:
  - "«شَرِق» صفة مشبهة على «فَعِل» من «شَرِقَ يَشْرَقُ»، و«الْغَصَّان» صفة على «فَعْلان» من «غَصَّ»."
  - "«اعْتِصَار» مصدر «اعْتَصَرَ» على «افْتِعال»، وأصله من العَصَر والعُصْرة، وهما الملجأ، كما ينقل البغدادي عن أبي القاسم علي بن حمزة: «وتحقيقه أَن الاعتصار مَعْنَاهُ: الالتجاء» [@khizana، ج8 ص511]."
rhetoric:
  thesis: "يجعل حاله كلها في صورة واحدة يعرفها كل الناس: الماء الذي يُنجي من الغصة صار هو الغصة. فلا يحتاج إلى أن يسمّي النُّعْمان ولا أن يتهمه، فالصورة تقول ذلك وحدها."
  devices:
    - title: "التمثيل في البيت كله"
      text: "لا يشبّه شيئًا بشيء، بل يشبّه حالًا بحال: حال من يظلمه ملجؤه بحال من يغصّ بالماء الذي يُستغاث به من الغصة. وهذا التشبيه المركب هو التمثيل عند عبد القاهر الجُرْجانيّ، الذي يقول: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. ولأن الصورة عامة لا تخص عَدِيًّا، صار البيت مثلًا يُضرب لكل من يؤذيه من يرجو إحسانه."
    - title: "الحذف"
      text: "لم يذكر المشبَّه: لم يقل «وأنت الماء» ولا «ظلمتني»، بل ترك الصورة تدل عليه. وعبد القاهر الجُرْجانيّ يقول في هذا الباب: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "المقابلة بين «بِغَيْرِ الْمَاءِ» و«بِالْمَاءِ»"
      text: "في أول البيت «بغير الماء» وفي آخره «بالماء»، فيقوم البيت كله على هذا الفرق الصغير: الدواء نفسه هو الداء."
  connection: "يتبعه بسؤال عن الواشي الذي سعى به: «لَيْتَ شِعْرِي عَنْ دَخِيلٍ يَفْتَرِي»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "لَوْ بِغَيْرِلْ / مَاءِ حَلْقِي / شَرِقُنْ = فاعلاتن / فاعلاتن / فَعِلُن — كُنْتُ كَلْغَصْ / صَانِ بِلْمَا / ءِعْتِصَارِي = فاعلاتن / فاعلاتن / فاعلاتن"
  note: "في العروض «فَعِلُن» مكان «فاعلن»: سقط الثاني الساكن منها، وهذا هو الخَبْن. وتسقط همزة الوصل في «اعْتِصَارِي» فيتصل بما قبله."
