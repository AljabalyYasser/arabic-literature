explained: false
first: "فَرَّتْ بَنُو أَسَدٍ خُرُو"
second: "دَ الطَّيْرِ عَنْ أَرْبَابِهَا"
vocabulary:
  - term: "خُرُودَ الطَّيْرِ"
    text: "يقول محققو «الأغاني»: «والخرود: التنحي» [@aghani-dk، ج11 ص146، الحاشية]، أي تنحّوا كما تنفر الطير. تعيّرهم بالفرار يوم جَبَلة."
  - term: "أَرْبَابِهَا"
    text: "سادتها، أي تركوا من كانوا معه في المعركة."
