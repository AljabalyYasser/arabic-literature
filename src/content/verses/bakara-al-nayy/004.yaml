explained: false
first: "لَمْ يَحْفِلُوا نَسَبًا وَلَمْ"
second: "يَلْوُوا لِفَيْءِ عُقَابِهَا"
vocabulary:
  - term: "لَمْ يَحْفِلُوا"
    text: "لم يبالوا."
  - term: "يَلْوُوا"
    text: "يعطفوا ويرجعوا."
  - term: "فَيْءِ"
    text: "ظلّ."
  - term: "عُقَابِهَا"
    text: "في اللسان: «والعقاب: الراية» [@lisan، ج1 ص621]، ويقول محققو «الأغاني»: «ولعل المراد بالعقاب هنا: الراية» [@aghani-dk، ج11 ص146، الحاشية]. أي لم يرجعوا ليقاتلوا تحت رايتهم."
