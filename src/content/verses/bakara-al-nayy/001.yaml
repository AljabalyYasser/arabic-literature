explained: false
first: "بَكَرَ النَّعِيُّ بِخَيْرِ خِنْ"
second: "دِفَ كَهْلِهَا وَشَبَابِهَا"
vocabulary:
  - term: "بَكَرَ"
    text: "جاء في البُكرة، أول النهار."
  - term: "النَّعِيُّ"
    text: "خبر الموت."
  - term: "خِنْدِفَ"
    text: "«امرأة إلياس بن مضر بن نزار واسمها ليلى، نسب ولد إلياس إليها وهي أمهم» [@lisan، ج9 ص98]. فخير خندف: خير أبنائها شيوخًا وشبانًا، تعني أباها."
