explained: false
first: "بِسَبِيلِ ثَغْرٍ لَا يُسَرِّحُ أَهْلُهُ"
second: "سَقِمٍ يُشَارُ لِقَاؤُهُ بِالْإِصْبَعِ"
vocabulary:
  - term: "ثَغْرٍ"
    text: "موضع المخافة، ومنه يأتي العدو [@mufaddaliyyat، ص46، الحاشية]."
  - term: "سَقِمٍ"
    text: "مخوف، ويروى بفتح القاف وكسرها [@mufaddaliyyat، ص46، الحاشية]."
  - term: "يُشَارُ لِقَاؤُهُ بِالْإِصْبَعِ"
    text: "يُشار إليه عند لقائه ويقال: هذا مخوف فاحذروه، كما نقل المحققان عن ابن الأَنْبارِيّ [@mufaddaliyyat، ص46، الحاشية]."
