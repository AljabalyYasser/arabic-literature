first: "وَإِذَا تُنَازِعُكَ الْحَدِيثَ رَأَيْتَهَا"
second: "حَسَنًا تَبَسُّمُهَا لَذِيذَ الْمَكْرَعِ"
vocabulary:
  - term: "تُنَازِعُكَ الْحَدِيثَ"
    text: "تحادثك وتجاذبك الكلام [@mufaddaliyyat، ص44، الحاشية]."
  - term: "الْمَكْرَعِ"
    text: "ما يُرتشف من ريقها. ويقول المحققان إنه قال «لذيذ» بلفظ المذكر وهو صفة لها، رعايةً للمضاف إليه [@mufaddaliyyat، ص44، الحاشية]."
