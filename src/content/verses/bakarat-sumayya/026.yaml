explained: false
first: "وَتَقِي إِذَا مَسَّتْ مَنَاسِمُهَا الْحَصَى"
second: "وَجَعًا وَإِنْ تُزْجَرْ بِهِ تَتَرَفَّعِ"
vocabulary:
  - term: "وَتَقِي"
    text: "من الوَقْي، وهو الحَفا: يشتكي خفّها من غلظ الأرض [@mufaddaliyyat، ص47، الحاشية]."
  - term: "مَنَاسِمُهَا"
    text: "أخفافها، واحدها مَنْسِم [@mufaddaliyyat، ص47، الحاشية]."
  - term: "تُزْجَرْ بِهِ تَتَرَفَّعِ"
    text: "إذا زُجرت بقولهم «دعدع» ارتفعت في سيرها وأسرعت [@mufaddaliyyat، ص47، الحاشية]."
