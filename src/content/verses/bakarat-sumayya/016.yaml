explained: false
first: "فَسُمَيَّ مَا يُدْرِيكِ أَنْ رُبَ فِتْيَةٍ"
second: "بَاكَرْتُ لَذَّتَهُمْ بِأَدْكَنَ مُتْرَعِ"
vocabulary:
  - term: "فَسُمَيَّ"
    text: "يا سُمَيّة، حذف حرف النداء ورخّم الاسم [@mufaddaliyyat، ص46، الحاشية]."
  - term: "رُبَ"
    text: "«رُبَّ» خُفّفت باؤها [@mufaddaliyyat، ص46، الحاشية]."
  - term: "بِأَدْكَنَ مُتْرَعِ"
    text: "الأدكن ما لونه إلى السواد، يعني زِقّ الخمر، والمترع المملوء [@mufaddaliyyat، ص46، الحاشية]."
