explained: false
first: "أَوْدَى السِّفَارُ بِرِمِّهَا فَتَخَالُهَا"
second: "هِيمًا مُقَطَّعَةً حِبَالُ الْأَذْرُعِ"
vocabulary:
  - term: "أَوْدَى السِّفَارُ بِرِمِّهَا"
    text: "ذهب السفر بمخّ عظامها، أي بلحومها وشحومها [@mufaddaliyyat، ص47، الحاشية]."
  - term: "هِيمًا"
    text: "جمع هيماء، من الهُيام، وهو داء يأخذ الإبل تشرب فلا تروى [@mufaddaliyyat، ص47، الحاشية]."
  - term: "مُقَطَّعَةً حِبَالُ الْأَذْرُعِ"
    text: "كأنها مقطّعة العروق، ما تقدر على المشي [@mufaddaliyyat، ص47، الحاشية]."
