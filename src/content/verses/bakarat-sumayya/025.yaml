explained: false
first: "وَمَطِيَّةٍ حَمَّلْتُ رَحْلَ مَطِيَّةٍ"
second: "حَرَجٍ تُنَمُّ مِنَ الْعِثَارِ بِدَعْدَعِ"
vocabulary:
  - term: "حَمَّلْتُ رَحْلَ مَطِيَّةٍ"
    text: "إذا أنهك مطيته حمل رحلها على أخرى [@mufaddaliyyat، ص47، الحاشية]."
  - term: "حَرَجٍ"
    text: "الناقة الضامرة، أو الطويلة الجسيمة [@mufaddaliyyat، ص47، الحاشية]."
  - term: "تُنَمُّ مِنَ الْعِثَارِ بِدَعْدَعِ"
    text: "تُحَثّ إذا عثرت بقولهم «دَعْدَعْ»، وهي كلمة يُدعى بها للعاثر ليقوم. وينقل المحققان عن الأصمعي أن الإبل في الجاهلية كانت إذا عثرت قيل لها «دعدع»، فلما جاء الإسلام كرهوا ذلك فقالوا: اللهم ارفع وانفع [@mufaddaliyyat، ص47، الحاشية]."
