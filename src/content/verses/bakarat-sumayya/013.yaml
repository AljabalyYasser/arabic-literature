explained: false
first: "وَنُقِيمُ فِي دَارِ الْحِفَاظِ بُيُوتَنَا"
second: "زَمَنًا وَيَظْعَنُ غَيْرُنَا لِلْأَمْرُعِ"
vocabulary:
  - term: "دَارِ الْحِفَاظِ"
    text: "الدار التي لا يقيم فيها إلا من حافظ على حسبه وصبر على ما لا يُصبر عليه، كما في حاشية المحققين [@mufaddaliyyat، ص45، الحاشية]."
  - term: "يَظْعَنُ"
    text: "يرحل [@mufaddaliyyat، ص45، الحاشية]."
  - term: "لِلْأَمْرُعِ"
    text: "جمع مَرْع، وهو الكلأ والخصب، ويروى «للأمرَع» بفتح الراء: الموضع الأكثر خصبًا [@mufaddaliyyat، ص45، الحاشية]."
