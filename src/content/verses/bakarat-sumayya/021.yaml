explained: false
first: "وَلَدَيَّ أَشْعَثُ بَاسِطٌ لِيَمِينِهِ"
second: "قَسَمًا لَقَدْ أَنْضَجْتَ لَمْ يَتَوَرَّعِ"
vocabulary:
  - term: "أَشْعَثُ"
    text: "المحتاج المضرور، وأصله من شَعَث الرأس [@mufaddaliyyat، ص46، الحاشية]."
  - term: "بَاسِطٌ لِيَمِينِهِ قَسَمًا"
    text: "يحلف من شدة الجوع ليُطعَم: قد أنضجتَ، ولم ينضج اللحم بعد [@mufaddaliyyat، ص46، الحاشية]. و«لم يتورّع» أي لم يتحرّج من الحلف."
