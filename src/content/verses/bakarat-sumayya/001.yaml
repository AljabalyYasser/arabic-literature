explained: false
first: "بَكَرَتْ سُمَيَّةُ بُكْرَةً فَتَمَتَّعِ"
second: "وَغَدَتْ غُدُوَّ مُفَارِقٍ لَمْ يَرْبَعِ"
vocabulary:
  - term: "فَتَمَتَّعِ"
    text: "يخاطب نفسه. وفي حاشية المحققين: اعتزمت سمية الرحيل مبكرة، وغدت مفارقة، فأصِبْ متعة من وداع [@mufaddaliyyat، ص43، الحاشية]."
  - term: "لَمْ يَرْبَعِ"
    text: "لم يُقِم. وفي اللسان: «ورَبَعَ بِالْمَكَانِ رَبْعاً: أَقام» [@lisan، ج8 ص102]."
