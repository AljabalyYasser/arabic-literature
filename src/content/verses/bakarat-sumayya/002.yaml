first: "وَتَزَوَّدَتْ عَيْنِي غَدَاةَ لَقِيتُهَا"
second: "بِلِوَى الْبُنَيْنَةِ نَظْرَةً لَمْ تُقْلِعِ"
vocabulary:
  - term: "بِلِوَى الْبُنَيْنَةِ"
    text: "اللِّوى منعطف الرمل، والبُنَيْنة موضع، كما في حاشية المحققين [@mufaddaliyyat، ص44، الحاشية]."
  - term: "لَمْ تُقْلِعِ"
    text: "لم تكفّ، أي نظرة لم ينقطع أثرها [@mufaddaliyyat، ص44، الحاشية]."
