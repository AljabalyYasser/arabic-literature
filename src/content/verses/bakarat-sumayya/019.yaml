explained: false
first: "بَكَرُوا عَلَيَّ بِسُحْرَةٍ فَصَبَحْتُهُمْ"
second: "مِنْ عَاتِقٍ كَدَمِ الْغَزَالِ مُشَعْشَعِ"
vocabulary:
  - term: "بِسُحْرَةٍ"
    text: "بالسَّحَر، وهو الوقت قبل الفجر [@mufaddaliyyat، ص46، الحاشية]."
  - term: "فَصَبَحْتُهُمْ"
    text: "سقيتهم الصَّبوح، وهو شرب الغداة [@mufaddaliyyat، ص46، الحاشية]."
  - term: "عَاتِقٍ"
    text: "الخمر العتيقة القديمة [@mufaddaliyyat، ص46، الحاشية]."
  - term: "مُشَعْشَعِ"
    text: "الممزوج بالماء، لا كثيرًا ولا قليلًا [@mufaddaliyyat، ص46، الحاشية]."
