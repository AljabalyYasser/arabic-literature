explained: false
first: "عَرَّسْتُهُ وَوِسَادُ رَأْسِي سَاعِدٌ"
second: "خَاظِي الْبَضِيعِ عُرُوقُهُ لَمْ تَدْسَعِ"
vocabulary:
  - term: "خَاظِي الْبَضِيعِ"
    text: "«وَيُقَالُ ساعِدٌ خاظِي البَضِيعِ أَي مُمْتلِئُ اللحمِ» [@lisan، ج8 ص13]."
  - term: "عُرُوقُهُ لَمْ تَدْسَعِ"
    text: "«أَي عُروقُ ساعِده غيرُ مُمْتَلِئَةٍ مِنَ الدَّم لأَن ذَلِكَ إِنما يَكُونُ لِلشُّيُوخِ» [@lisan، ج8 ص13]، فهو شاب. وتوسّد ذراعه لأن المكان مخيف لا يُطمأن فيه."
