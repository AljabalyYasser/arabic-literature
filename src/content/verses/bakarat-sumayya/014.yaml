explained: false
first: "وَمَحَلِّ مَجْدٍ لَا يُسَرِّحُ أَهْلُهُ"
second: "يَوْمَ الْإِقَامَةِ وَالْحُلُولِ لِمَرْتَعِ"
vocabulary:
  - term: "مَجْدٍ"
    text: "في حاشية المحققين: من قولهم مجدت الإبل إذا أكلت نصف الشبع، يعني أرضًا قليلة المرعى [@mufaddaliyyat، ص45، الحاشية]."
  - term: "لَا يُسَرِّحُ أَهْلُهُ لِمَرْتَعِ"
    text: "لا يرسلون إبلهم ولا يرحلون إلى المرتع، وهو مكان الرعي في الخصب: إذا أجدبوا لم يتركوا عشائرهم في طلب الخصب [@mufaddaliyyat، ص45، الحاشية]."
