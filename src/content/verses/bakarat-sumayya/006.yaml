explained: false
first: "بِغَرِيضِ سَارِيَةٍ أَدَرَّتْهُ الصَّبَا"
second: "مِنْ مَاءِ أَسْجَرَ طَيِّبِ الْمُسْتَنْقَعِ"
vocabulary:
  - term: "بِغَرِيضِ سَارِيَةٍ"
    text: "يشبّه ريقها بماء المطر. «وَالْغَرِيضُ: الْمَاءُ الطَّرِيُّ وَقْتَ نُزُولِهِ مِنَ السَّحَابِ» [@lisan، ج4 ص281]، والسارية السحابة تسري بالليل."
  - term: "أَدَرَّتْهُ الصَّبَا"
    text: "الصَّبا ريح تهبّ من المشرق، وأدرّته: استخرجته من السحاب كما يستخرج الحالب اللبن [@mufaddaliyyat، ص44، الحاشية]."
  - term: "أَسْجَرَ"
    text: "الماء الأسجر في حاشية المحققين الذي فيه كدرة لم يصفُ كل الصفو، يتغير بما يخالطه من التراب إذا صار إلى الأرض [@mufaddaliyyat، ص44، الحاشية]. ويرويه اللسان في موضع «أسحر» بالحاء، ويفسّره: «وأَسحرُ: غديرٌ حُرُّ الطِّين» [@lisan، ج4 ص281]."
  - term: "الْمُسْتَنْقَعِ"
    text: "الموضع الذي يستنقع فيه الماء، وكلما طاب الموضع طاب ماؤه [@mufaddaliyyat، ص44، الحاشية]."
