explained: false
first: "ظَلَمَ الْبِطَاحَ لَهُ انْهِلَالُ حَرِيصَةٍ"
second: "فَصَفَا النِّطَافُ لَهُ بُعَيْدَ الْمُقْلَعِ"
vocabulary:
  - term: "ظَلَمَ الْبِطَاحَ"
    text: "البِطاح بطون الأودية فيها حصى صغار. وظلمها لأن المطر جاءها في غير وقته: «يَعْنِي مَطَرتْ فِي غَيْرِ وَقْتِ مَطَرِها فَلِذَلِكَ ظَلَم» [@lisan، ج7 ص11]."
  - term: "حَرِيصَةٍ"
    text: "«والحَريصةُ والحارِصةُ السحابةُ التي تَحْرِصُ وَجْهَ الأَرض بقَشْرِه وتُؤَثِّرُ فِيهِ بِمَطَرِهَا مِنْ شِدَّةِ وَقعها» [@lisan، ج7 ص11]. وانهلالها: انصباب مطرها."
  - term: "النِّطَافُ"
    text: "المياه، واحدتها نُطْفة [@mufaddaliyyat، ص44، الحاشية]."
  - term: "الْمُقْلَعِ"
    text: "الإقلاع، أي كفّ المطر، وهو «مَصْدَرٌ بِمَعْنَى الإِقْلاعِ» [@lisan، ج12 ص376]."
