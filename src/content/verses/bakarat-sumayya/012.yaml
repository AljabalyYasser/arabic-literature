first: "وَنَخُوضُ غَمْرَةَ كُلِّ يَوْمِ كَرِيهَةٍ"
second: "تُرْدِي النُّفُوسَ وَغُنْمُهَا لِلْأَشْجَعِ"
vocabulary:
  - term: "غَمْرَةَ"
    text: "شدّة الحرب وزحمتها."
