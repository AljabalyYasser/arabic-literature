explained: false
first: "وَمَتَاعِ ذِعْلِبَةٍ تَخُبُّ بِرَاكِبٍ"
second: "مَاضٍ بِشِيعَتِهِ وَغَيْرِ مُشَيَّعِ"
vocabulary:
  - term: "ذِعْلِبَةٍ"
    text: "الناقة السريعة [@mufaddaliyyat، ص48، الحاشية]."
  - term: "تَخُبُّ"
    text: "من الخَبَب، وهو ضرب من العَدْو [@mufaddaliyyat، ص48، الحاشية]."
  - term: "وَغَيْرِ مُشَيَّعِ"
    text: "ماضٍ مع أصحابه وحده، لا يحتاج إلى من يشجّعه. «والمُشَيَّعُ: الشُّجاعُ»، سُمّي بذلك «لأَنَّ قَلْبَه لَا يَخْذُلُه فكأَنَّه يُشَيِّعُه» [@lisan، ج8 ص189]."
