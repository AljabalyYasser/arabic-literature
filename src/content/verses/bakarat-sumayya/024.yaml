first: "تَخِدُ الْفَيَافِيَ بِالرِّحَالِ وَكُلُّهَا"
second: "يَعْدُو بِمُنْخَرِقِ الْقَمِيصِ سَمَيْدَعِ"
vocabulary:
  - term: "تَخِدُ"
    text: "من الوَخْد، وهو أن يرمي البعير بقوائمه كمشي النعام [@mufaddaliyyat، ص47، الحاشية]."
  - term: "الْفَيَافِيَ"
    text: "القفار [@mufaddaliyyat، ص47، الحاشية]."
  - term: "بِمُنْخَرِقِ الْقَمِيصِ سَمَيْدَعِ"
    text: "السميدع الجميل الشجاع، وجعل قميصه ممزقًا لطول معاناته السفر [@mufaddaliyyat، ص47، الحاشية]."
