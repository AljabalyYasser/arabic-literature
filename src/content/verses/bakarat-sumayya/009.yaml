explained: false
first: "أَسُمَيَّ وَيْحَكِ هَلْ سَمِعْتِ بِغَدْرَةٍ"
second: "رُفِعَ اللِّوَاءُ لَنَا بِهَا فِي مَجْمَعِ"
vocabulary:
  - term: "أَسُمَيَّ"
    text: "يا سُمَيّة، رخّم الاسم فحذف آخره [@mufaddaliyyat، ص45، الحاشية]."
  - term: "رُفِعَ اللِّوَاءُ"
    text: "يذكر المحققان أنهم كانوا في الجاهلية إذا غدر الرجل رفعوا له لواء بسوق عُكاظ ليعرفه الناس [@mufaddaliyyat، ص45، الحاشية]. فهو يقول: لم يُشهَّر أحد منا بغدر قط."
