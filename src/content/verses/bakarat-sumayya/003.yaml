explained: false
first: "وَتَصَدَّفَتْ حَتَّى اسْتَبَتْكَ بِوَاضِحٍ"
second: "صَلْتٍ كَمُنْتَصِبِ الْغَزَالِ الْأَتْلَعِ"
vocabulary:
  - term: "تَصَدَّفَتْ"
    text: "أعرضت وانحرفت، فبدا جانب وجهها [@mufaddaliyyat، ص44، الحاشية]."
  - term: "اسْتَبَتْكَ"
    text: "غلبتك وجعلتك سبيًا لها [@mufaddaliyyat، ص44، الحاشية]."
  - term: "بِوَاضِحٍ صَلْتٍ"
    text: "في حاشية المحققين: الواضح الناصع الخالص، يعني عنقها، والصلت المشرق الجميل [@mufaddaliyyat، ص44، الحاشية]."
  - term: "الْأَتْلَعِ"
    text: "الطويل العنق، شبّه عنقها بجيد الغزال إذا انتصب [@mufaddaliyyat، ص44، الحاشية]."
