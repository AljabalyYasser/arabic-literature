first: "إِنَّا نَعِفُّ فَلَا نُرِيبُ حَلِيفَنَا"
second: "وَنَكُفُّ شُحَّ نُفُوسِنَا فِي الْمَطْمَعِ"
vocabulary:
  - term: "لَا نُرِيبُ حَلِيفَنَا"
    text: "لا نغدر به ولا تأتيه منا ريبة [@mufaddaliyyat، ص45، الحاشية]."
  - term: "وَنَكُفُّ شُحَّ نُفُوسِنَا"
    text: "نمنع أنفسنا من البخل إذا طمع الطامع في معروفنا [@mufaddaliyyat، ص45، الحاشية]."
