explained: false
first: "فَيَوْمًا تُوَافِينَا بِوَجْهٍ مُقَسَّمٍ"
second: "كَأَنْ ظَبْيَةٍ تَعْطُو إِلَى نَاضِرِ السَّلَمْ"
vocabulary:
  - term: "مُقَسَّمٍ"
    text: "جميل كله، كأن كل موضع منه أخذ قسمًا من الجمال، من القَسام وهو الحسن، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص157]."
  - term: "تَعْطُو"
    text: "تتناول بفمها أغصان الشجر."
  - term: "السَّلَمْ"
    text: "ضرب من شجر البادية له شوك [@asmaiyyat، ص157]."
sources:
