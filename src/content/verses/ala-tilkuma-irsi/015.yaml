explained: false
first: "وَقَالَ صِحَابِي إِنَّكَ الْيَوْمَ كَائِنٌ"
second: "عَلَيْنَا كَمَا عَفََّى قُدَارٌ عَلَى إِرَمْ"
vocabulary:
  - term: "قُدَارٌ"
    text: "قُدار بن سالف، عاقر ناقة صالح، فأهلك الله قومه بجريرته، كما يقول المحققان [@asmaiyyat، ص159]."
  - term: "إِرَمْ"
    text: "قوم عاد. ويقول المحققان إن الشاعر أخطأ فجعل قُدارًا في عاد وهو من ثمود، كما أخطأ زهير حين قال: كأحمر عاد [@asmaiyyat، ص159]. وقول أصحابه هذا سار مثلًا [@maydani، ج2 ص144]."
