first: "يُمَشِّي كَأَنْ لَا حَيَّ بِالْجِزْعِ غَيْرُهُ"
second: "وَيَعْلُو جَرَاثِيمَ الْمَخَارِمِ وَالْأَكَمْ"
vocabulary:
  - term: "الْجِزْعِ"
    text: "منعطف الوادي وجانبه [@asmaiyyat، ص158]."
  - term: "جَرَاثِيمَ الْمَخَارِمِ"
    text: "الجراثيم: الأماكن المرتفعة من تراب أو طين، والمخارم: الطرق في الجبال [@asmaiyyat، ص158]. يصف الكبش يمشي متبخترًا كأنه وحده في الوادي."
