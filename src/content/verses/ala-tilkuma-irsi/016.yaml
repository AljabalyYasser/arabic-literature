explained: false
first: "وَقِدْرٍ يُهَاهِي بِالْكِلَابِ قُتَارُهَا"
second: "إِذَا خَفَّ أَيْسَارُ الْمَسَامِيحِ وَاللُّحُمْ"
vocabulary:
  - term: "يُهَاهِي بِالْكِلَابِ"
    text: "يدعوها، والهاهاة: زجر الكلب ودعاؤه [@asmaiyyat، ص159]."
  - term: "قُتَارُهَا"
    text: "ريح القِدر والشواء [@asmaiyyat، ص159]."
  - term: "أَيْسَارُ الْمَسَامِيحِ"
    text: "الأيسار: جمع يَسَر، وهو الذي يضرب بقداح الميسر، والمساميح: الأسخياء. وخفّ: نشط [@asmaiyyat، ص159]."
  - term: "اللُّحُمْ"
    text: "الذين يكثر عندهم اللحم أو يشتهونه [@asmaiyyat، ص159]."
sources:
