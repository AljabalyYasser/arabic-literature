explained: false
first: "فَوَاللهِ مَا أَدْرِي وَإِنِّي لَصَادِقٌ"
second: "أَمِنْ خَمَرٍ يَأْتِي الطِّلَالَ أَمِ اتَّخَمْ"
vocabulary:
  - term: "خَمَرٍ"
    text: "ما خالط العقل من السُّكر [@asmaiyyat، ص158]."
  - term: "الطِّلَالَ"
    text: "جمع طَلّ، وهو المطر الصغار القطر [@asmaiyyat، ص158]."
  - term: "اتَّخَمْ"
    text: "أصابته التُّخَمة من كثرة الأكل. يسخر من مشية الكبش: لا يدري أسكران هو أم متخم."
sources:
