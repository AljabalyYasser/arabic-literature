explained: false
first: "مَوَارِيثُ آبَائِي وَكَانَتْ تَرِيكَةً"
second: "لِآلِ قُدَارٍ صَاحِبِ الْفِطْرِ فِي الْحُطَمْ"
vocabulary:
  - term: "تَرِيكَةً"
    text: "تَرِكة وميراثًا، ويقول المحققان إنها بهذا المعنى ليست في المعاجم [@asmaiyyat، ص160]."
  - term: "الْحُطَمْ"
    text: "الأمر العظيم، فيما ينقل المحققان عن نسخة الشنقيطي [@asmaiyyat، ص160]. يقول: هذه الجرأة إرث من آبائي، كجرأة قُدار حين عقر الناقة."
sources:
