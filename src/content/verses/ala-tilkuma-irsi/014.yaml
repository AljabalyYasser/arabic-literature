first: "وَزَنْدَيْ عَفَارٍ فِي السِّلَاحِ وَقَادِحٍ"
second: "إِذَا شِئْتُ أَوْرَى قَبْلَ أَنْ يَبْلُغَ السَّأَمْ"
vocabulary:
  - term: "زَنْدَيْ عَفَارٍ"
    text: "الزَّند والزَّندة خشبتان يُقدح بهما النار، والعَفار شجر تُتخذ منه الزناد، وهو من أسرع الشجر نارًا [@asmaiyyat، ص159]."
  - term: "أَوْرَى"
    text: "أخرج النار."
  - term: "السَّأَمْ"
    text: "الملل."
