explained: false
first: "بَصُرْتُ بِهِ يَوْمًا وَقَدْ كَادَ صُحْبَتِي"
second: "مِنَ الْجُوعِ أَنْ لَا يَبْلُغُوا الرَّجْمَ مِ الْوَحَمْ"
vocabulary:
  - term: "صُحْبَتِي"
    text: "أصحابي."
  - term: "مِ الْوَحَمْ"
    text: "يريد: من الوَحَم، والوحم أصله شهوة الحبلى لما تأكله، ثم قيل لكل من أفرطت شهوته لشيء [@asmaiyyat، ص158]. يقول: كاد أصحابي يهلكون من الجوع والشهوة إلى اللحم."
