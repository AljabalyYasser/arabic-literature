first: "أَلَا تِلْكُمَا عِرْسِي تَصُدُّ بِوَجْهِهَا"
second: "وَتَزْعُمُ فِي جَارَاتِهَا أَنَّ مَنْ ظَلَمْ"
vocabulary:
  - term: "عِرْسِي"
    text: "امرأتي."
  - term: "أَنَّ مَنْ ظَلَمْ"
    text: "تقول لجاراتها إن الذي ظلمها هو «أبونا» في البيت التالي، تعني زوجها الشاعر، فالكلام متصل بما بعده."
