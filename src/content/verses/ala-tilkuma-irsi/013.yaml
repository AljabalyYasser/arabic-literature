explained: false
first: "بِذِي حَطَبٍ جَزْلٍ وَسَهْلٍ لِفَائِدٍ"
second: "وَمِبْرَاةِ غَزَّاءٍ يُقَالُ لَهَا هُذَمْ"
vocabulary:
  - term: "جَزْلٍ"
    text: "غليظ قوي [@asmaiyyat، ص158]."
  - term: "لِفَائِدٍ"
    text: "لمن يشوي اللحم، من فأد اللحم إذا شواه [@asmaiyyat، ص158]."
  - term: "مِبْرَاةِ غَزََّاءٍ"
    text: "سكين رجل كثير الغزو، والمِبراة: السكين يُبرى بها [@asmaiyyat، ص159]."
  - term: "هُذَمْ"
    text: "قاطعة، من الهَذْم وهو القطع، ويقول المحققان إن هذه الصيغة ليست في المعاجم [@asmaiyyat، ص159]."
