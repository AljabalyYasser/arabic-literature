explained: false
first: "لَتَجْتَنِبَنْكِ الْعِيسُ خُنْسًا عُكُومُهَا"
second: "وَذُو مِرَّةٍ فِي الْعُسْرِ وَالْيُسْرِ وَالْعَدَمْ"
vocabulary:
  - term: "الْعِيسُ"
    text: "الإبل البيض يخالط بياضها شيء من الشقرة [@asmaiyyat، ص158]."
  - term: "خُنْسًا عُكُومُهَا"
    text: "العُكوم: الأحمال التي فيها الطعام والمتاع، والخُنْس: المكتنزة الممتلئة، شبّهها بالأنف الأخنس في اكتنازه وانحنائه، كما يفسّرها المحققان [@asmaiyyat، ص158]. يتوعدها بأن يتركها ويرحل عنها بماله."
  - term: "ذُو مِرَّةٍ"
    text: "ذو عقل وقوة، والمِرّة: القوة، ويعني نفسه [@asmaiyyat، ص158]."
sources:
