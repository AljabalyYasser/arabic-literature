first: "لَهُ أَلْيَةٌ كَأَنَّهَا شَطُّ نَاقَةٍ"
second: "أَبَحُّ إِذَا مَا مُسَّ أَبْهَرُهُ نَحَمْ"
vocabulary:
  - term: "أَلْيَةٌ"
    text: "ذَنَب الكبش السمين."
  - term: "شَطُّ نَاقَةٍ"
    text: "شطر سنامها [@asmaiyyat، ص160]."
  - term: "أَبْهَرُهُ"
    text: "الأبهر عرق إذا انقطع مات صاحبه [@asmaiyyat، ص160]."
  - term: "نَحَمْ"
    text: "أخرج صوتًا من جوفه، من النحيم [@asmaiyyat، ص160]."
