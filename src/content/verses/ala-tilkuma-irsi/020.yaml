explained: false
first: "لَبِسْتُ ثِيَابَ الْمَقْتِ إِنْ آبَ سَالِمًا"
second: "وَلَمَّا أُفِتْهُ أَوْ أُجَرَّ إِلَى الرَّجَمْ"
vocabulary:
  - term: "ثِيَابَ الْمَقْتِ"
    text: "البغض والازدراء، كأنه يلبسه، إذا لم يمض فيما عزم عليه [@asmaiyyat، ص159]."
  - term: "أُفِتْهُ"
    text: "أهلكه، فيما ينقل المحققان عن نسخة الشنقيطي، ويقولان إنها بهذا المعنى ليست في المعاجم [@asmaiyyat، ص159]."
  - term: "الرَّجَمْ"
    text: "القبر [@asmaiyyat، ص159]."
sources:
