explained: false
first: "رُمْحٌ لَنَا كَانَ لَمْ يُفْلَلْ تَنُوءُ بِهِ"
second: "تُوفَى بِهِ الْحَرْبُ وَالْعَزَّاءُ وَالْجُلَلُ"
vocabulary:
  - term: "تُوفَى بِهِ"
    text: "رجع إلى الرجل فقال: كان سلاحًا لنا تُعلى به، أي تُقهر به الحرب [@sukkari-hudhaliyyin، ص1285]."
  - term: "الْعَزَّاءُ"
    text: "الشدة [@sukkari-hudhaliyyin، ص1285]."
  - term: "الْجُلَلُ"
    text: "جمع جُلّى، وهي العظيم من الأمر [@sukkari-hudhaliyyin، ص1285]."
sources:
