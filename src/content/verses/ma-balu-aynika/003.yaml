explained: false
first: "تَبْكِي عَلَى رَجُلٍ لَمْ تَبْلَ جِدَّتُهُ"
second: "خَلَّى عَلَيْكَ فِجَاجًا بَيْنَهَا سُبُلُ"
vocabulary:
  - term: "لَمْ تَبْلَ جِدَّتُهُ"
    text: "لم يُستمتع به، مات شابًّا [@sukkari-hudhaliyyin، ص1281]."
  - term: "فِجَاجًا بَيْنَهَا سُبُلُ"
    text: "كان يسدّ عنك كل مسدّ من المكروه، فلما مات خلّى عليك فجاجًا بينها سبل يُسلك عليها إليك من الشر [@sukkari-hudhaliyyin، ص1281]."
sources:
