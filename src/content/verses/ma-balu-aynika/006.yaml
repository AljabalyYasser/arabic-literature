first: "السَّالِكُ الثُّغْرَةَ الْيَقْظَانَ كَالِئُهَا"
second: "مَشْيَ الْهَلُوكِ عَلَيْهَا الْخَيْعَلُ الْفُضُلُ"
meaning: "هو الذي يسلك موضع الخوف الذي يحرسه عدوّ يقظ، فيمشي فيه مطمئنًا متمايلًا، كما تمشي المرأة المتهالكة اللعوب، وليس عليها إلا درع مفتوح الجانب لا إزار تحته. والصورة صريحة: المرأة التي يشبّه بها مشية ابنه امرأة متغنجة متكسرة في مشيتها، ثوبها الوحيد مخيط من جانب ومفتوح من الآخر، فيبدو جسدها من شقّه، وليس تحته ما يستر عورتها. يقول الشرح المطبوع مع القصيدة: «و«الهلوك»، التي تهالك، وهي الفنجة المتكسرة، تهالك وتغزل وتساقط. و«الخيعل»، درع يخاط أحد شقيه ويترك الآخر. و«الفضل»، التي ليس في درعها إزار، بمنزلة لحاف» [@sukkari-hudhaliyyin، ص1282]. وموضع الشبه المشية لا الفجور: أثيلة يدخل الثغر بلا خوف ولا استعداد، متمايلًا مسترخيًا، كأنه في أمان، كما تتمايل تلك المرأة غير مكترثة بمن يراها."
vocabulary:
  - term: "الثُّغْرَةَ"
    text: "«و«الثغر» واحد، وهو موضع المخافة ومكان الخوف» [@sukkari-hudhaliyyin، ص1281]."
  - term: "كَالِئُهَا"
    text: "حارسها، من «كلأ» إذا حرس."
  - term: "الْهَلُوكِ"
    text: "«التي تهالك، وهي الفنجة المتكسرة، تهالك وتغزل وتساقط» [@sukkari-hudhaliyyin، ص1282]، أي المرأة المتغنجة التي تتمايل وتتكسر في مشيتها وتتساقط على الرجال."
  - term: "الْخَيْعَلُ"
    text: "«درع يخاط أحد شقيه ويترك الآخر» [@sukkari-hudhaliyyin، ص1282]."
  - term: "الْفُضُلُ"
    text: "«التي ليس في درعها إزار، بمنزلة لحاف» [@sukkari-hudhaliyyin، ص1282]، أي المرأة في ثوب واحد بلا شيء تحته."
context: "من صفات أثيلة في مرثية أبيه (5–11)، ويرويه ابن قُتَيْبة في الأبيات التي ينشدها منها [@ibn-qutayba، ج2 ص648]. قبله: «وَيْلُمِّهِ رَجُلًا تَأْبَى بِهِ غَبَنًا»، وبعده: «التَّارِكُ الْقِرْنَ مُصْفَرًّا أَنَامِلُهُ». والتشبيه بالمرأة المتهالكة في ثوب بلا إزار صورة حسية صريحة، فنشرح البيت شرحًا تامًّا."
syntax:
  - "«السَّالِكُ الثُّغْرَةَ»: «السالكُ» خبر لمبتدأ محذوف تقديره: هو السالك، و«الثغرةَ» مفعول به لاسم الفاعل."
  - "«الْيَقْظَانَ كَالِئُهَا»: «اليقظانَ» نعت سببي للثغرة منصوب، و«كالئها» فاعل لليقظان مرفوع، والضمير مضاف إليه يعود على الثغرة. أي الثغرة التي حارسها يقظان."
  - "«مَشْيَ الْهَلُوكِ»: «مشيَ» مفعول مطلق مبيّن للنوع، عامله «السالك»، و«الهلوك» مضاف إليه."
  - "«عَلَيْهَا الْخَيْعَلُ الْفُضُلُ»: «عليها» جار ومجرور خبر مقدم، و«الخيعلُ» مبتدأ مؤخر، والجملة في محل نصب حال من الهلوك. و«الفضلُ» صفة للمرأة في المعنى، لكنها رُفعت إتباعًا للخيعل المجاور لها، يقول الشرح: «و«الفضل»، امرأة، ولكنه على الجوار، على حد قوله: «جحر ضب خرب»» [@sukkari-hudhaliyyin، ص1282]."
morphology:
  - "«الهَلُوك» صفة على «فَعُول» للمبالغة، من «تهالك»."
  - "«الخَيْعَل» اسم على «فَيْعَل»."
  - "«الفُضُل» صفة على «فُعُل»."
  - "«اليَقْظَان» صفة مشبهة على «فَعْلان»."
  - "«كالِئ» اسم فاعل من «كلأ» على «فاعل»."
rhetoric:
  thesis: "يرسم جرأة ابنه: يمشي في موضع الخطر مسترخيًا متمايلًا كما تمشي امرأة لعوب لا تبالي."
  devices:
    - title: "التشبيه في «مَشْيَ الْهَلُوكِ»"
      text: "شبّه مشية بمشية، أي حركة بحركة، وهو عند عبد القاهر من أدق التشبيه: «اعلم أن مما يزداد به التشبيه دقة وسحرًا أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]. فلم يقل إنه شجاع، بل أرانا هيئة مشيه."
    - title: "المفارقة بين «الثُّغْرَةَ الْيَقْظَانَ» و«مَشْيَ الْهَلُوكِ»"
      text: "الصدر كله خطر: ثغرة وحارس يقظ، والعجز كله استرخاء وغنج. وبهذا التضاد تظهر الجرأة: يمشي في أخطر المواضع مشية من هو في بيته. وهذه قراءتنا."
  connection: "ثم يصف ما يفعله بأقرانه: «التَّارِكُ الْقِرْنَ مُصْفَرًّا أَنَامِلُهُ / كَأَنَّهُ مِنْ عُقَارٍ قَهْوَةٍ ثَمِلُ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، والقافية مطلقة بالواو"
  scansion: "أَسْسَالِكُثْ / ثُغْرَةَلْ / يَقْظَانَ كَا / لِئُهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — مَشْيَلْهَلُو / كِ عَلَيْ / هَلْخَيْعَلُلْ / فُضُلُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "وزن البسيط التام «مستفعلن فاعلن مستفعلن فعِلن»، والعروض مخبونة «فعِلن» والضرب مثلها [@atiq، ص48]. ودخل الخَبْن، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من العجز فصارت «فعِلن». وهمزة الوصل في «الثغرة» و«اليقظان» و«الهلوك» و«الخيعل» تسقط في النطق."
