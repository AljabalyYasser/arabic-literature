explained: false
first: "لَا تَفْتَأُ الدَّهْرَ مِنْ سَحٍّ بِأَرْبَعَةٍ"
second: "كَأَنَّ إِنْسَانَهَا بِالصَّابِ مُكْتَحِلُ"
vocabulary:
  - term: "لَا تَفْتَأُ"
    text: "لا تنفكّ الدهر تبكي [@sukkari-hudhaliyyin، ص1280–1281]."
  - term: "الصَّابِ"
    text: "شجرة إذا ذُبحت يخرج منها لبن، إذا أصاب شيئًا أحرقه، وإذا أصاب العين سُلقت وانهملت [@sukkari-hudhaliyyin، ص1280–1281]."
