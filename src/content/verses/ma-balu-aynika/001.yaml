explained: false
first: "مَا بَالُ عَيْنِكَ تَبْكِي دَمْعُهَا خَضِلُ"
second: "كَمَا وَهَى سَرِبُ الْأَخْرَاتِ مُنْبَزِلُ"
vocabulary:
  - term: "سَرِبُ"
    text: "السائل [@sukkari-hudhaliyyin، ص1280]."
  - term: "الْأَخْرَاتِ"
    text: "جمع خُرْت، وهو الثقب، يعني خروق القربة [@sukkari-hudhaliyyin، ص1280]."
  - term: "خَضِلُ"
    text: "مبتلّ؛ يقول الشارح: مبتلّة تبلّ كل شيء من كثرة دموعها [@sukkari-hudhaliyyin، ص1280]."
