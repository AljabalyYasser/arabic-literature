explained: false
first: "وَلَا السِّمَاكَانِ إِنْ يَسْتَعْلِ بَيْنَهُمَا"
second: "يَطِرْ بِخُطَّةِ يَوْمٍ شَرُّهُ أَصِلُ"
vocabulary:
  - term: "السِّمَاكَانِ"
    text: "نجمان؛ يقول: لا يحرزه السماكان أيضًا من حتفه، إن صار بينهما أتاه الموت [@sukkari-hudhaliyyin، ص1283]."
  - term: "يَطِرْ بِخُطَّةِ"
    text: "يقال: طار فلان بخير ذلك الأمر، أي صار ذلك له [@sukkari-hudhaliyyin، ص1283]."
  - term: "أَصِلُ"
    text: "الشديد الاستئصال [@sukkari-hudhaliyyin، ص1283]."
sources:
