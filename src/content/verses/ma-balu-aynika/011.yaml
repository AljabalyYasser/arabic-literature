explained: false
first: "حُلْوٌ وَمُرٌّ كَعَطْفِ الْقِدْحِ مِرَّتُهُ"
second: "بِكُلِّ إِنْيٍ حَذَاهُ اللَّيْلُ يَنْتَعِلُ"
vocabulary:
  - term: "كَعَطْفِ الْقِدْحِ"
    text: "يريد طويًّا كما يُطوى القدح [@sukkari-hudhaliyyin، ص1283]."
  - term: "مِرَّتُهُ"
    text: "فتلته [@sukkari-hudhaliyyin، ص1283]."
  - term: "يَنْتَعِلُ"
    text: "يسري في كل ساعة من الليل من هدايته [@sukkari-hudhaliyyin، ص1283]."
  - term: "إِنْيٍ"
    text: "واحد الآناء، وهي الساعات [@sukkari-hudhaliyyin، ص1283]."
