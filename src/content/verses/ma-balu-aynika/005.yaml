explained: false
first: "وَيْلُمِّهِ رَجُلًا تَأْبَى بِهِ غَبَنًا"
second: "إِذَا تَجَرَّدَ لَا خَالٌ وَلَا بَخَلُ"
vocabulary:
  - term: "وَيْلُمِّهِ رَجُلًا"
    text: "كلمة يُتعجب بها، ولا يُراد بها الدعاء عليه [@sukkari-hudhaliyyin، ص1281]."
  - term: "لَا خَالٌ"
    text: "لا مخيلة فيه، أي لا خيلاء [@sukkari-hudhaliyyin، ص1281]."
  - term: "وَلَا بَخَلُ"
    text: "لا بخل [@sukkari-hudhaliyyin، ص1281]."
