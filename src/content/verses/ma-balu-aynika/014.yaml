first: "وَلَا نَعَامٌ بِجَوٍّ يَسْتَرِيدُ بِهِ"
second: "وَلَا حِمَارٌ وَلَا ظَبْيٌ وَلَا وَعِلُ"
vocabulary:
  - term: "يَسْتَرِيدُ بِهِ"
    text: "يرود به، يجيء ويذهب، أي يجول فيه [@sukkari-hudhaliyyin، ص1283–1284]."
  - term: "جَوٍّ"
    text: "وادٍ، وكل بطن وادٍ داخل الأرض فهو جوّ [@sukkari-hudhaliyyin، ص1283–1284]."
