first: "أَتَتْنَا قُرَيْشٌ حَافِلِينَ بِجَمْعِهِمْ"
second: "عَلَيْهِمْ مِنَ الرَّحْمَنِ وَاقٍ وَنَاصِرُ"
vocabulary:
