explained: false
first: "وَمَا زَالَ ذَاكَ الدَّأْبُ حَتَّى تَخَاذَلَتْ"
second: "هَوَازِنُ وَارْفَضَّتْ سُلَيْمٌ وَعَامِرُ"
vocabulary:
  - term: "الدَّأْبُ"
    text: "الشأن والعادة، أي ذلك القتال المتصل."
  - term: "تَخَاذَلَتْ"
    text: "خذل بعضها بعضًا، فلم ينصر أحد أحدًا."
  - term: "وَارْفَضَّتْ"
    text: "تفرّقت."
  - term: "سُلَيْمٌ وَعَامِرُ"
    text: "بنو سُلَيْم وبنو عامر بن صعصعة، من قيس عيلان، وهم قوم خِداش ومن معهم."
sources:
  - source: "aghani-dk"
    loc: "ج22 ص70"
    url: "https://archive.org/details/aghani2014/22/page/n72/mode/1up"
status: "review"
