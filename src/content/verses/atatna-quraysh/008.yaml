first: "وَكَانَتْ قُرَيْشٌ يَفْلِقُ الصَّخْرَ حَدُّهَا"
second: "إِذَا أَوْهَنَ النَّاسَ الْجُدُودُ الْعَوَاثِرُ"
meaning: "وكانت قريش ذات بأس يشقّ الصخر، حين تخذل الحظوظُ العاثرة الناسَ فتضعفهم. أي إذا ضعف الناس لسوء حظهم ثبتت قريش وغلبت."
vocabulary:
  - term: "يَفْلِقُ"
    text: "يشقّ. «الفلق: الشق، والفلق مصدر فلقه يفلقه فلقا شقه» [@lisan، ج10 ص309]."
  - term: "حَدُّهَا"
    text: "بأسها وشدّتها، وأصل الحدّ طرف السيف القاطع."
  - term: "أَوْهَنَ"
    text: "أضعف، من الوهن، و«الوهن: الضعف في العمل والأمر» [@lisan، ج13 ص453]."
  - term: "الْجُدُودُ"
    text: "الحظوظ، جمع جَدّ، و«الجد: الحظ والرزق» [@lisan، ج3 ص107]."
  - term: "الْعَوَاثِرُ"
    text: "التي تعثر بأصحابها، أي الحظوظ السيئة."
context: "خاتمة الأبيات، بعد أن وصف تخاذل هوازن وتفرّق سُلَيْم وعامر. فالشاعر المهزوم لا يختم بعذر لقومه، بل بشهادة لخصمه. وفي الأيام التي كانت لقومه يفخر خِداش بغلبتهم قريشًا، كقصيدته في يوم شَمْطة التي يسميها ابن سَلّام «المنصفة» [@ibn-sallam، ج1 ص145]، وهنا يعطي قريشًا حقها في يوم كان لها."
syntax:
  - "«وَكَانَتْ قُرَيْشٌ» فعل ماض ناقص واسمه. وجملة «يَفْلِقُ الصَّخْرَ حَدُّهَا» في محل نصب خبر «كان»: «يفلق» مضارع، و«الصخرَ» مفعول به مقدم، و«حدُّها» فاعل مؤخر."
  - "«إِذَا» ظرف لما يُستقبل من الزمان فيه معنى الشرط، وجوابه محذوف يدل عليه ما قبله، والتقدير: إذا أوهن الناسَ الجدودُ فلقت قريش الصخر."
  - "«أَوْهَنَ النَّاسَ الْجُدُودُ»: فعل، ومفعول به مقدم «الناسَ»، وفاعل مؤخر «الجدودُ»، و«العواثرُ» صفة له."
morphology:
  - "«يَفْلِق» مضارع «فلق» من باب «ضرب يضرب»."
  - "«أَوْهَن» على «أفعل» من «وهن»، والهمزة فيه للتعدية: وهن الرجل، وأوهنه غيره."
  - "«الجُدود» جمع «جَدّ» على «فُعُول»، و«العواثر» جمع «عاثر» على «فواعل»، وهو جمع لغير العاقل."
rhetoric:
  thesis: "شهادة المهزوم لخصمه: قوة قريش تظهر حين يضعف الناس، لا حين يقوون."
  devices:
    - title: "الاستعارة في «يفلق الصخر حدها»"
      text: "جعل لقريش «حدًّا» كحدّ السيف، ثم جعل هذا الحدّ يشق الصخر. فالصخر صورة لكل شدة صلبة، والقبيلة سيف يقطعها. وهي استعارة على ما يقول عبد القاهر: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الاستعارة في «الجدود العواثر»"
      text: "الحظ لا يمشي فيعثر، لكنه جعل الحظوظ كالماشي الذي يكبو فيُسقط صاحبه. والعرب تقول عثر جدّه إذا ساء حظه."
    - title: "التقديم في «أوهن الناس الجدود»"
      text: "قدّم المفعول «النَّاسَ» على الفاعل «الْجُدُودُ»، لأن الكلام عن الناس وضعفهم في مقابلة قريش وقوتها. يقول عبد القاهر في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "المقابلة بين الصدر والعجز"
      text: "الصدر قوة: قريش تفلق الصخر، والعجز ضعف: الناس يوهنهم الحظ. فالصورتان متقابلتان، والتقابل يزيد قريشًا قوة."
  connection: "آخر الأبيات."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "وَكَانَتْ / قُرَيْشُنْ يَفْ / لِقُصْصَخْ / رَ حَدْدُهَا = فعولن / مفاعيلن / فعولن / مفاعلن — إِذَا أَوْ / هَنَنْنَاسَلْ / جُدُودُلْ / عَوَاثِرُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاءت التفعيلات تامة إلا العروض والضرب، وهما مقبوضتان «مفاعلن»، والقبض حذف الخامس الساكن [@atiq، ص29]."
