explained: false
first: "أُتِيحَتْ لَنَا بَكْرٌ وَحَوْلَ لِوَائِهَا"
second: "كَتَائِبُ يَخْشَاهَا الْعَزِيزُ الْمُكَاثِرُ"
vocabulary:
  - term: "بَكْرٌ"
    text: "بنو بكر بن عبد مناة من كنانة، حلفاء قريش في الفِجار."
  - term: "كَتَائِبُ"
    text: "جماعات الجيش، واحدتها كتيبة."
  - term: "الْمُكَاثِرُ"
    text: "الذي يغالب غيره بكثرة عدده."
sources:
