    text: "من أول النهار."
  - term: "عَمَايَةُ يَوْمٍ"
    text: "ظلمة يوم شديد يعمى فيه الأمر."
  - term: "مُتَظَاهِرُ"
    text: "«شره متظاهر: هجومه قوي» في حاشية محققي «الأغاني» [@aghani-dk، ج22 ص70، الحاشية]، أي يتلو بعضه بعضًا."
