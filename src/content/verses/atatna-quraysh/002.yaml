explained: false
first: "فَلَمَّا دَنَوْنَا لِلْقِبَابِ وَأَهْلِهَا"
second: "أُتِيحَ لَنَا رَيْبٌ مَعَ اللَّيْلِ نَاجِرُ"
vocabulary:
  - term: "لِلْقِبَابِ"
    text: "الخيام المستديرة، أي منازل القوم."
  - term: "أُتِيحَ لَنَا"
    text: "قُدِّر لنا ولقيناه."
  - term: "رَيْبٌ"
    text: "حادث من حوادث الدهر."
  - term: "نَاجِرُ"
    text: "«شديد الحرارة» كما في حاشية محققي «الأغاني» [@aghani-dk، ج22 ص70، الحاشية]."
