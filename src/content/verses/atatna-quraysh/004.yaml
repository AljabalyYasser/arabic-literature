explained: false
first: "جَثَتْ دُونَهُمْ بَكْرٌ فَلَمْ تَسْتَطِعْهُمُ"
second: "كَأَنَّهُمُ بِالْمَشْرَفِيَّةِ سَامِرُ"
vocabulary:
  - term: "جَثَتْ"
    text: "«جلس على ركبتيه للخصومة ونحوها» [@lisan، ج14 ص131]، وهي جلسة الثابت في القتال لا يريد الفرار."
  - term: "دُونَهُمْ"
    text: "أمام قريش، تحميها."
  - term: "بِالْمَشْرَفِيَّةِ"
    text: "بالسيوف، منسوبة إلى مشارف الشام."
  - term: "سَامِرُ"
    text: "القوم يسهرون بالليل يتحدثون. ولعله يريد أنهم مقيمون بسيوفهم في مكانهم كما يقيم السُّمّار في مجلسهم."
