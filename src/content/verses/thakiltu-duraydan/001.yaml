explained: false
first: ثَكِلْتِ دُرَيْدًا إِنْ أَتَتْ لَكِ شَتْوَةٌ
second: سِوَى هَذِهِ حَتَّى تَدُورَ الدَّوَائِرُ
vocabulary:
- term: ثَكِلْتِ دُرَيْدًا
  text: فقدتِه؛ يخاطب أمه، وكانت حضّته بشعر لها على الطلب بثأر أخيه عبد الله [@ibn-qutayba، ج2 ص740].
- term: شَتْوَةٌ
  text: شتاء، أي عام.
- term: تَدُورَ الدَّوَائِرُ
  text: تنزل الدواهي بأعدائنا؛ «ودارت عليه الدوائر أي نزلت به الدواهي» [@lisan، ج4 ص297].
sources:
