first: "تَأْوِي لَهُ قُلُصُ النَّعَامِ كَمَا أَوَتْ"
second: "حِزَقٌ يَمَانِيَةٌ لِأَعْجَمَ طِمْطِمِ"
meaning: "تجتمع إلى هذا الظليم صغار النعام، كما تجتمع جماعات الإبل اليمانية إلى راعٍ أعجمي لا يُفهم كلامه. قال ابن الأَنْبارِيّ: «معناه تأوي إليه، أي ينقنق لهن فيأوين اليه، كما أوت هذه الحزق اليمانية لراع أعجم لا يفهم كلامه» [@ibn-al-anbari، ص320]. والنَّقْنَقة: صوت الظليم."
vocabulary:
  - term: "تَأْوِي لَهُ"
    text: "«معناه تأوي إليه» [@ibn-al-anbari، ص320]، أي تنضمّ إليه. وقال الزَّوْزَنِيّ في التعدية باللام: «وإنما وصلها باللام لأنه أراد: تأوي إليه قلص له» [@zawzani، ص252]."
  - term: "قُلُصُ النَّعَامِ"
    text: "«و (القلص) : أولاد النعام حين يدففن ويلحقن ولم يبلغن المسان، واحدتها قلوص» [@ibn-al-anbari، ص320]، أي حين يقوين على العدو. وفي لسان العرب: «حَكَى ابْنُ خَالَوِيهْ عَنِ الأَزدي أَن القَلُوص وَلَدُ النَّعَامِ حَفَّانُها ورِئَالُها» [@lisan، ج7 ص81]."
  - term: "حِزَقٌ"
    text: "«و (الحزق) : الجماعات» [@ibn-al-anbari، ص320]، وهي هنا جماعات الإبل."
  - term: "لِأَعْجَمَ طِمْطِمِ"
    text: "«يقال أعجم طمطم وأعجم طمطماني، إذا كان لا يفهم الكلام» [@ibn-al-anbari، ص320]. وفي لسان العرب: «والطِّمْطِمُ والطِّمْطِميُّ والطُّماطِم والطُّمْطُمانيُّ: هُوَ الأَعجَم الذي لا يُفْصِح» [@lisan، ج12 ص371]. وعند الزَّوْزَنِيّ: «وأراد بالأعجم الحبشي» [@zawzani، ص252]."
syntax:
  - "«والقلص ترتفع بتأوى، والكاف منصوبة به» [@ibn-al-anbari، ص321]، أي أن «قُلُصُ» فاعل، و«كَمَا أَوَتْ» في موضع المفعول المطلق: تأوي له أُوِيًّا مثلَ أُوِيّ الحزق، و«ما» مصدرية."
  - "«لِأَعْجَمَ» مجرور باللام وعلامة جرّه الفتحة لأنه ممنوع من الصرف، صفة على وزن «أَفْعَل»، و«طِمْطِمِ» صفة له."
morphology:
  - "«قُلُص» جمع «قَلُوص» على وزن «فُعُل»، و«حِزَق» جمع «حِزْقَة» على وزن «فِعَل»."
  - "«يَمَانِيَة» نسبة إلى اليمن، والألف فيها عوض من إحدى ياءي النسب، فتُخفف الياء: يمانية لا يمانيّة."
rhetoric:
  thesis: "مشهد بمشهد: ظليم أسود حوله صغار النعام، كراعٍ حبشي حوله إبل سود لا تفهم لغته. وكل جزء من المشهد الأول يقابله جزء من الثاني."
  devices:
    - title: "التشبيه المركب في «كَمَا أَوَتْ حِزَقٌ يَمَانِيَةٌ لِأَعْجَمَ طِمْطِمِ»"
      text: "ليس الشبه بين شيء وشيء، بل بين هيئة وهيئة. ويفصّل الزَّوْزَنِيّ أجزاءها: «شبه الظليم في سواده بهذا الراعي الحبشي، وقلص النعام بإبل يمانية لأن السواد في إبل اليمانيين أكثر، وشبه أُوِيَّها إليه بأُوِيِّ الإبل إلى راعيها ووصفه بالعِيِّ والعجمة لأن الظليم لا نطق له» [@zawzani، ص252]. ويقول عبد القاهر الجُرْجانيّ في التشبيه المركب: «وذلك أن المقصودَ من التشبيه أن يُرِيَك الهيئةَ التي تملأ النواظر عَجباً» [@asrar، ص193]."
    - title: "العُجمة في «لِأَعْجَمَ طِمْطِمِ»"
      text: "الظليم ينقنق، وصغاره تجيبه وهي لا تفهم إلا الصوت. فاختار لصورته راعيًا لا يُفهم كلامه، وكرر المعنى بلفظين «أَعْجَمَ» و«طِمْطِمِ» ليثبت أن ما يجمع القطيع صوت لا كلام."
  connection: "ثم يصف هيئة الظليم وهن يتبعنه: «يَتْبَعْنَ قُلَّةَ رَأْسِهِ وَكَأَنَّهُ» [@ibn-al-anbari، ص321]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "تَأْوِي لَهُو / قُلُصُنْ نَعَا / مِ كَمَا أَوَتْ = مُتْفاعلن / متَفاعلن / متَفاعلن — حِزَقُنْ يَمَا / نِيَتُنْ لِأَعْ / جَمَ طِمْطِمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار أولى الصدر وحدها، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]، وجاء العجز تامًّا. وتُشبع ضمة الهاء في «لَهُ» فتُنطق «لَهُو»، وبها تتم التفعيلة الأولى."
context: "من أبيات الظليم (24–27): بعد أن شبّه ناقته به، يصفه أبًا لقطيع من النعام. وقد جعل الأَعْلَم الشَّنْتَمَرِيّ المشبَّه به قومًا لا إبلًا (انظر الروايات)."
variants:
  - reading: "تَبْرِي لَهُ حُولُ النَّعَامِ كَمَا انْبَرَتْ"
    status: "رواية أخرى"
    note: "«ويروى: (تبرى له حول النعام كما انبرت) . والحول: التي لا بيض لها»، «ومن رواه (تبرى) أراد تعرض له» [@ibn-al-anbari، ص320]."
  - reading: "يَأْوِي إِلَى حِزَقِ النَّعَامِ كَمَا أَوَتْ"
    status: "رواية الأَعْلَم"
    note: "فالظليم هو الذي يأوي إلى جماعات النعام [@diwan-antara، ص200]. وفي شرحه أن الحزق اليمانية ناس لا إبل: «شبه النعام حول هذا الظليم بقوم من اليمن حول رجل من العجم يسمعون كلامه ولا يفهمونه وخص أهل اليمن لقربهم من العجم (يعني الحبش) وملابستهم لهم» [@diwan-antara، ص200–201]."
