first: "يَا شَاةَ مَا قَنَصٍ لِمَنْ حَلَّتْ لَهُ"
second: "حَرُمَتْ عَلَيَّ وَلَيْتَهَا لَمْ تَحْرُمِ"
meaning: "يا لها من صيد ثمين لمن يحلّ له أن يناله! لكنها حُرّمت عليّ، وليتها لم تُحرَّم. قال الزَّوْزَنِيّ: «والمعنى: هي حسناء جميلة مَقْنَع لمن كَلِفَ بِهَا وشغف بحبها، ولكنها حرمت عليّ وليتها لم تحرم عليّ» [@zawzani، ص261]."
vocabulary:
  - term: "شَاةَ"
    text: "«كناية عن المرأة. والعرب أيضا تكنى عن المرأة بالنعجة» [@ibn-al-anbari، ص353]. ويقول ابن رَشِيق: «والعرب تجعل المهاة شاة؛ لأنها عندهم ضائنة الظباء، ولذلك يسمونها نعجة» [@ibn-rashiq، ج1 ص312]، والمهاة: بقرة الوحش."
  - term: "قَنَصٍ"
    text: "«والقنيص والقنص: الصيد؛ والقانص والقنيص: الصياد» [@ibn-al-anbari، ص353]."
  - term: "حَلَّتْ لَهُ"
    text: "«أي لمن قدر عليها» [@ibn-al-anbari، ص353]."
context: "أول مقطع «يا شاة ما قنص» (59–62): يقطع حديث القتال فجأة، ويعود إلى الغزل في امرأة ممنوعة منه. واختلفوا فيها: فقال ابن الأَنْبارِيّ: «معناه هي من قوم أعداء له»، و«يقال: إنه أراد امرأة أبيه، وهي سُمية» التي يقول فيها: «أَمِنْ سُمَيَّةَ دَمْعُ الْعَيْنِ تَذْرِيفُ» [@ibn-al-anbari، ص353]. وقال الأثرم: «معناه هي في جواري فقد حرمت عليّ»، «وأنكر أبو جعفر قول الأثرم وقال: العرب لا تشبب بجاراتها» [@ibn-al-anbari، ص353]. وعند ابن رَشِيق: «وإنما ذكر امرأة أبيه، وكان يهواها، وقيل: بل كانت جاريته؛ فلذلك حرمها على نفسه» [@ibn-rashiq، ج1 ص312]. والبيت عند الأَعْلَم 64 [@diwan-antara، ص213]، وعند الزَّوْزَنِيّ 57 [@zawzani، ص261]."
syntax:
  - "«والشاة منصوبة على النداء، وما صلة للكلام. ويجوز أن تكون ما خفضا بإضافة الشاة اليها، وقنص مختفض على الاتباع لما» [@ibn-al-anbari، ص353]: فـ«مَا» إما زائدة و«قَنَصٍ» مضاف إليه، وإما نكرة بمعنى شيء و«قَنَصٍ» نعت لها."
  - "«واللام صلة قنص، وحلت له صلة من»، «والهاء والألف اسم ليت، والخبر ما عاد من تحرم» [@ibn-al-anbari، ص354]."
  - "ويقول البغدادي: «وفي زيادة ما وتنكير قنص ما يدل على أنها صيد عظيم يغتبط بها من يحوزها» [@khizana، ج6 ص131]."
morphology:
  - "قَنَص مصدر قَنَصَ، أُريد به المفعول: المَصيد [@khizana، ج6 ص131]."
  - "حَرُمَتْ على وزن فَعُلَ، وهو بناء يدل على الصفة الثابتة."
rhetoric:
  thesis: "يتمنى ما لا يملك: امرأة تحلّ لغيره وتحرم عليه. فالفارس الذي يقتل من يشاء يقف أمام حرمة لا يتجاوزها."
  devices:
    - title: "الاستعارة في «يَا شَاةَ»"
      text: "سمّى المرأة شاة، ولم يذكرها. يقول البغدادي: «النعجة استعيرت للمرأة كما استعار عنترة للشاة» [@khizana، ج6 ص131]. وهذه الاستعارة على حدّ عبد القاهر الجُرْجانيّ: «وتجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]."
    - title: "الطباق في «حَلَّتْ... حَرُمَتْ»"
      text: "جمع الحلال والحرام في بيت واحد، فصارت المرأة حلالًا لغيره حرامًا عليه، وهذا ما يجعل التمني في آخره مؤلمًا [@ibn-al-anbari، ص353]."
    - title: "التمني في «وَلَيْتَهَا لَمْ تَحْرُمِ»"
      text: "يقول البغدادي في «حرمت عليّ»: فيها «الدّلَالَة على التحزن التَّام على فَوَات تِلْكَ الْغَنِيمَة» [@khizana، ج6 ص131]."
  connection: "ثم يقصّ: بعث جاريته تتعرّف أخبارها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يَا شَاةَ مَا / قَنَصِنْ لِمَنْ / حَلْلَتْ لَهُو = مُتْفاعلن / متَفاعلن / مُتْفاعلن — حَرُمَتْ عَلَيْ / يَ وَلَيْتَهَا / لَمْ تَحْرُمِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، الأولى والثالثة من الصدر، والأخيرة من العَجُز."
variants:
  - reading: "يَا شَاةَ مِنْ قَنَصٍ لِمَنْ حَلَّتْ لَهُ"
    status: "رواية الكسائي"
    note: "«وقال الفراء: أنشدني الكسائي بيت عنترة: (يا شاة من قنصٍ لمن حلَّت له). قال: وزعم الكسائي إنه إنما أراد يا شاة قنص، وجعل من حشوا في الكلام»، «وأنكر الفراء هذا وقال: إنما أراد يا شاة من مقتنص، لأن من لا تكون حشوا ولا تلغى» [@ibn-al-anbari، ص353]. ويقول البغدادي إن رواية «ما» هي «رِوَايَة شرَّاح المعلقات وَلم يرو أحد مِنْهُم الرِّوَايَة الأولى» [@khizana، ج6 ص130]."
  - reading: "حَرُمَتْ عَلَيْهِ وَلَيْتَهَا لَمْ تَحْرُمِ"
    status: "رواية يذكرها ابن الأَنْبارِيّ"
    note: "«ويروى: (حرمت عليه)» [@ibn-al-anbari، ص353]."
