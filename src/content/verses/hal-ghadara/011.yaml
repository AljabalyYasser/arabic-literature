first: "مَا رَاعَنِي إِلَّا حَمُولَةُ أَهْلِهَا"
second: "وَسْطَ الدِّيَارِ تَسَفُّ حَبَّ الْخِمْخِمِ"
meaning: "ما أفزعني إلا أن رأيت إبل أهلها التي يُحمل عليها في وسط الديار تأكل حب الخِمْخِم. وللشُّرّاح في سبب الفزع قولان. عند ابن الأَنْبارِيّ: «فيقول: لم يبق شيء إلا الرحيل إذا صارت تأكل حب الخمخم. وذلك انهم كانوا مجتمعين في ربيع أقاموا كله حتى ذهب ويبس البقل فارتحلوا وتفرقوا» [@ibn-al-anbari، ص304]. وعند الأَعْلَم الشَّنْتَمَرِيّ: «وإنما راعه كون الحمولة وسط الدار لأنها كانت غادية في المرعى، فلما أرادوا الرحيل ردوها إلى الديار ليتحملوا عليها فراعه ذلك» [@diwan-antara، ص193]."
vocabulary:
  - term: "رَاعَنِي"
    text: "«أفزعني. يقال: راعني الشيء يروعني روعا، وارتعت له ارتياعا» [@ibn-al-anbari، ص304]."
  - term: "حَمُولَةُ"
    text: "«الإبل التي أطاقت أن يحمل عليها» [@ibn-al-anbari، ص304]. وقال الأَعْلَم: «والحمولة الإبل يحمل عليها المتاع. والحمولة بضم الحاء المتاع نفسه» [@diwan-antara، ص193]."
  - term: "وَسْطَ"
    text: "قال الزَّوْزَنِيّ: «وسْطَ بتسكين السين، لا يكون إلا ظرفًا، والوسَط، بفتح السين، اسم لما بين طرفي الشيء» [@zawzani، ص247]."
  - term: "تَسَفُّ"
    text: "تأكل الحب يابسًا، قال ابن الأَنْبارِيّ: «يقال: سففت الدواء أسفه، واستففته استفافا، إذا اقتمحته» [@ibn-al-anbari، ص304]."
  - term: "الْخِمْخِمِ"
    text: "«واحدتها خمخمة، وهو آخر ما يبس من النبت» [@ibn-al-anbari، ص304]. وقال أبو عَمْرو الشَّيْبانيّ: «الخمخم: بقلة لها حب أسود إذا أكلته الغنم قلت ألبانها وتغيرت، وإنما يصف أنها تأكل هذا لأنها لم تجد غيره» [@tabrizi-ashr، ص182]. وفي لسان العرب: «والخِمْخِمُ، بِالْكَسْرِ: نَبَاتٌ تُعْلَفُ حَبَّه الإِبلُ» [@lisan، ج12 ص191]."
syntax:
  - "«مَا ... إِلَّا» نفي واستثناء للحصر، و«حَمُولَةُ» فاعل «رَاعَنِي». قال ابن الأَنْبارِيّ: «والحمولة يرتفع براعني، ووسط الركاب صلة تسف، وتسف حال للحمولة، والحب منصوب بتسف» [@ibn-al-anbari، ص305]."
  - "«وَسْطَ» ظرف مكان منصوب، متعلق بـ«تَسَفُّ»."
morphology:
  - "«حَمُولَة» على وزن «فَعُولَة» بمعنى «مفعولة»، أي ما يُحمل عليه، وهي هنا للإبل."
  - "«تَسَفُّ» مضارع «سَفَّ» المضاعف، ومنه الاستفاف."
rhetoric:
  thesis: "تفصيل صغير يعلن حدثًا كبيرًا: إبل تأكل حبًّا يابسًا، أو تُرَدّ من المرعى إلى البيوت، فيعرف الشاعر أن الرحيل قد حان."
  devices:
    - title: "القصر في «مَا رَاعَنِي إِلَّا»"
      text: "القصر أن يُخصّ شيء بحكم دون غيره، ومن طرقه النفي والاستثناء. فلم يفزعه شيء غير هذا المنظر، أي أنه لم يكن يتوقع الرحيل حتى رآه."
    - title: "الكناية في «تَسَفُّ حَبَّ الْخِمْخِمِ»"
      text: "لم يقل: انقضى الربيع وحان الرحيل، بل ذكر ما يدل عليه: الإبل لا تجد إلا آخر ما يبس من النبت. قال الزَّوْزَنِيّ: «أي ما أنذرني بارتحالها إلا انقضاء مدة الانتجاع والكلأ، فإذا انقضت مدة الانتجاع علمت أنها ترتحل إلى ديار حيّها» [@zawzani، ص248]. والانتجاع: طلب الكلأ في مواضعه."
  connection: "ثم يصف هذه الحمولة: «فِيهَا اثْنَتَانِ وَأَرْبَعُونَ حَلُوبَةً» [@ibn-al-anbari، ص305]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "مَا رَاعَنِي / إِلْلَا حَمُو / لَةُ أَهْلِهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن — وَسْطَدْ دِيَا / رِ تَسَفْفُ حَبْ / بَلْخِمْخِمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار الأوليين من الصدر، والأولى والثالثة من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُدغم لام التعريف في الدال من «الدِّيَارِ» فتُنطق «وَسْطَدْدِيَارِ»."
context: "أول بيتي الظعائن (11–12)، والظعائن: الإبل التي عليها هوادج النساء ساعة الرحيل. وفيه اللحظة التي عرف فيها الرحيل بعد أن قال في البيت 10 إن الأمر دُبّر بليل."
variants:
  - reading: "وَسْطَ الدِّيَارِ تَسَفُّ حَبَّ الْحِمْحِمِ"
    status: "رواية أبي جَعْفَر وابن الأَعْرابِيّ"
    note: "«وروى أبو جعفر: (حب الحمحم) بالحاء غير معجمة، وقال: هو آخر ما يبس من النبت، وهو الذي راعه لأنه يبس في أول الهيج» [@ibn-al-anbari، ص304]، والهَيْج: يُبس النبت. ويرويها التِّبْرِيزِيّ عن ابن الأَعْرابِيّ [@tabrizi-ashr، ص182]. وفي لسان العرب عن أبي حنيفة: «الحِمْحِم والخِمْخِم وَاحِدٌ» [@lisan، ج12 ص161]."
  - reading: "وَسْطَ الرِّكَابِ تَسَفُّ حَبَّ الْخِمْخِمِ"
    status: "رواية أخرى"
    note: "في إعراب ابن الأَنْبارِيّ «ووسط الركاب صلة تسف» [@ibn-al-anbari، ص305]، ويقول قبله «ويروى: (وسط الديار)» [@ibn-al-anbari، ص304]، فكأن روايته «وَسْطَ الرِّكَابِ»، والمطبوع من شرحه وسائر الشروح على «الدِّيَارِ»."
