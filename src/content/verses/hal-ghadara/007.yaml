first: "عُلِّقْتُهَا عَرَضًا وَأَقْتُلُ قَوْمَهَا"
second: "زَعَمًا لَعَمْرُ أَبِيكَ لَيْسَ بِمَزْعَمِ"
meaning: "أحبها فجأة من غير أن يقصد، وهو يقاتل قومها، فكيف يجتمع الأمران؟ قال ابن الأَنْبارِيّ: «معناه علقتها وأنا أقتل قومها فكيف أحبها وأنا أقتلهم، أم كيف أقتلهم وأنا أحبها»، ثم رجع إلى نفسه فقال إن هذا «فعل ليس بمثل فعلي» [@ibn-al-anbari، ص301]. وعلى تفسير الزَّوْزَنِيّ للزَّعَم بالطمع: «أطمع في حبك طمعًا لا موضع له؛ لأنه لا يمكنني الظفر بوصالك مع ما بين الحيين من القتال والمعاداة» [@zawzani، ص247]."
vocabulary:
  - term: "عُلِّقْتُهَا"
    text: "«معناه أحببتها. يقال: بفلان علق من فلانة وعلاقى، أي حب قد نشب بقلبه وعلق به» [@ibn-al-anbari، ص300]."
  - term: "عَرَضًا"
    text: "«معناه كانت عرضا من الأعراض اعترضني من غير أن أطلبه» [@ibn-al-anbari، ص300]، أي فجأة، وعند الزَّوْزَنِيّ: «أي فجأة من غير قصد له» [@zawzani، ص246]."
  - term: "زَعَمًا ... بِمَزْعَمِ"
    text: "فيه قولان. عند ابن الأَنْبارِيّ «الزعم. الكلام. ويقال: هذا أمر فيه مزاعم أي فيه منازعة» [@ibn-al-anbari، ص301]. وعند أبي عَمْرو الشَّيْبانيّ هو الطمع: «يقال (زَعِمَ يَزْعَم زَعَما) إذا طمع» [@tabrizi-ashr، ص181]، وبه فسّر الزَّوْزَنِيّ: «الزَّعم: الطمع. والمزعم: المطمع» [@zawzani، ص247]. وفي لسان العرب: «والزَّعَمُ، بِالتَّحْرِيكِ: الطَّمَعُ» [@lisan، ج12 ص267]."
  - term: "لَعَمْرُ أَبِيكَ"
    text: "قسم بحياة أبي المخاطب، قال الزَّوْزَنِيّ: «العَمْر والعُمْر، بفتح العين وضمها: الحياة والبقاء، ولا يستعمل في القسم إلا بفتح العين» [@zawzani، ص247]."
syntax:
  - "جملة «وَأَقْتُلُ قَوْمَهَا» حال، والتقدير: عُلّقتها وأنا أقتل قومها."
  - "«عَرَضًا» منصوب، «والعرض منصوب على المصدر. والزعم أيضا. واسم ليس مضمر فيها من ذكر الزعم، وبمزعم خبرها» [@ibn-al-anbari، ص301]. وعند التِّبْرِيزِيّ «ونصب (عرضا) على البيان» [@tabrizi-ashr، ص181]، أي على التمييز. ويقدّر الزَّوْزَنِيّ: «أزعم زعمًا ليس بمزعم أقسم بحياة أبيك أنه كذلك» [@zawzani، ص247]."
  - "«لَعَمْرُ أَبِيكَ» اللام لام الابتداء، و«عَمْرُ» مبتدأ خبره محذوف، أي: لعمر أبيك قسمي، والجملة معترضة بين «زَعَمًا» وصفته «لَيْسَ بِمَزْعَمِ»."
morphology:
  - "«عُلِّقْتُ» ماض مبني للمجهول من «عَلَّقَ» على «فَعَّلَ»، قال الزَّوْزَنِيّ: «التعليق هنا: التفعيل من العَلَق والعلاقة وهما العشق والهوى» [@zawzani، ص246]."
  - "«مَزْعَم» على وزن «مَفْعَل» من «زَعِمَ»، مصدر ميمي أو اسم موضع، أي موضع للطمع."
rhetoric:
  thesis: "قلب البيت مفارقة: يحب امرأة ويقتل أهلها. ثم يحكم على هذا الحب بنفسه: زعم لا يصدق، أو طمع لا مطمع فيه."
  devices:
    - title: "المقابلة بين «عُلِّقْتُهَا» و«أَقْتُلُ قَوْمَهَا»"
      text: "المقابلة أن يُجمع في الكلام بين معنيين متضادين. فالحب والقتل في صدر واحد، والواو تجمعهما في وقت واحد. ويستشهد ابن الأَنْبارِيّ لهذا المعنى بقول آخر: «أبى القلب إلاّ حبَّهُ حارثيةً ... تُجاوِر أعدائي وأعداؤها معي» [@ibn-al-anbari، ص301]."
    - title: "الجناس في «زَعَمًا ... بِمَزْعَمِ»"
      text: "الجناس أن تتفق كلمتان في حروفهما أو في أصلهما وتختلفا في المعنى أو الصيغة. و«زَعَمًا» و«مَزْعَم» من أصل واحد: زعمٌ ينفي عن نفسه أن يكون موضعًا للزعم. وعلى تفسير الأَعْلَم الشَّنْتَمَرِيّ: «وضرب الزعم مثلا، والزعم إنما هو في الكلام دون الفعل، وإنما يريد أن حبه لها ليس له ظاهر يوجبه لقتله قومها فكأنه ليس بحب» [@diwan-antara، ص187]."
    - title: "القسم في «لَعَمْرُ أَبِيكَ»"
      text: "أقسم في وسط الحكم على نفسه، فاشتد الحكم. والخطاب فيه لنفسه عند ابن الأَنْبارِيّ: «ثم رجع مخاطبا لنفسه» [@ibn-al-anbari، ص301]."
  connection: "ثم يؤكد لها مكانها من قلبه رغم ذلك: «وَلَقَدْ نَزَلْتِ فَلَا تَظُنِّي غَيْرَهُ» [@ibn-al-anbari، ص301]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "عُلْلِقْتُهَا / عَرَضَنْ وَأَقْ / تُلُ قَوْمَهَا = مُتْفاعلن / متَفاعلن / متَفاعلن — زَعَمَنْ لَعَمْ / رُ أَبِيكَ لَيْ / سَ بِمَزْعَمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار الأولى من الصدر وحدها، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. ومن روى «زَعْمًا» بسكون العين صارت أولى العجز «زَعْمَنْ لَعَمْ» مُضمَرة «مُتْفاعلن»، والوزن مستقيم على الروايتين."
context: "أول أبيات عَبْلة وقومها (7–10)، وفيه المفارقة التي يقوم عليها النسيب كله: حبيبته من قوم يحاربهم. ولا يسمي البيت القومين، ويقول الأَعْلَم إن قومها «أعداء له فلا سبيل إليها» [@diwan-antara، ص187]."
variants:
  - reading: "زَعْمًا وَرَبِّ الْبَيْتِ لَيْسَ بِمَزْعَمِ"
    status: "رواية الأَعْلَم ولسان العرب"
    note: "هي رواية الأَعْلَم [@diwan-antara، ص187]، وينشده لسان العرب كذلك في مادة «زعم» [@lisan، ج12 ص267]."
  - reading: "زَعْمًا لَعَمْرُ أَبِيكَ لَيْسَ بِمَزْعَمِ"
    status: "رواية أخرى"
    note: "بسكون العين، هي رواية الزَّوْزَنِيّ [@zawzani، ص246]، وفي لسان العرب أن الفعل «زَعِمَ يَزْعَمُ زَعَماً وزَعْماً: طَمِعَ» [@lisan، ج12 ص267]، فالوجهان في المصدر."
