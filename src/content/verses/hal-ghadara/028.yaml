first: "شَرِبَتْ بِمَاءِ الدُّحْرُضَيْنِ فَأَصْبَحَتْ"
second: "زَوْرَاءَ تَنْفِرُ عَنْ حِيَاضِ الدَّيْلَمِ"
meaning: "شربت الناقة من ماء الدُّحْرُضَيْن فارتوت، فأصبحت مائلة تنفر عن حياض الأعداء. قال ابن الأَنْبارِيّ: «ومعنى البيت: شربت بماء الدحرضين فهي به آمنة ريا تنفر عن حياض الديلم، أي مياه الديلم» [@ibn-al-anbari، ص324]. وقال الأَعْلَم الشَّنْتَمَرِيّ: «يقول: هذه الناقة تجانف عن حياض أعدائها ولا تشرب منها» [@diwan-antara، ص202]."
vocabulary:
  - term: "الدُّحْرُضَيْنِ"
    text: "«ماءان يقال لأحدهما دحرض، وللآخر وسيع، فلما جمعهما غلب أحد الاسمين» [@ibn-al-anbari، ص324]. وفي لسان العرب: «الدُّحْرُضان: مَوْضِعَانِ أَحدهما دُحْرُضٌ وَالْآخِرُ وسِيعٌ» [@lisan، ج7 ص149]."
  - term: "زَوْرَاءَ"
    text: "مائلة، «وقوله (زوراء) : تجانف عن الحياض أي تمايل» [@ibn-al-anbari، ص325]."
  - term: "حِيَاضِ الدَّيْلَمِ"
    text: "اختلفوا فيه. «والديلم عند الأصمعي: الأعداء وإن كانوا غرباء» [@ibn-al-anbari، ص324]. وحكى أبو العَبّاس عن أبي مُحَلِّم: «حياض الديلم مياه معروفة للأعراب، وحكى ذلك عنهم وقال: غلط الأصمعي في قوله: الديلم الأعداء»، وقيل غير ذلك: «الديلم: الداهية. وقال بعضهم: قرى النمل. وقيل: الديلم ماء من مياه بني سعد» [@ibn-al-anbari، ص325]. وفي لسان العرب: «وَفِي التَّهْذِيبِ: الدَّيْلَمُ مَاءَةٌ لِبَنِي عَبْسٍ» [@lisan، ج12 ص205]."
syntax:
  - "الباء في «بِمَاءِ» عند ابن الأَنْبارِيّ بمعنى «من»: «أراد: من ماء الدحرضين، فالباء بمعنى من» [@ibn-al-anbari، ص324]. وعند الزَّوْزَنِيّ هي زائدة عند البصريين، «والكوفيون يجعلونها بمعنى من» [@zawzani، ص253]."
  - "«واسم أصبحت مضمر فيه من ذكر الناقة. وزوراء خبر أصبحت، وتنفر موضعه في التأويل نصب على الاتباع لزوراء» [@ibn-al-anbari، ص325]، أي أن جملة «تَنْفِرُ» خبر ثانٍ أو صفة لـ«زَوْرَاءَ»."
morphology:
  - "«الدُّحْرُضَيْن» مثنى على التغليب: سُمّي الماءان باسم أحدهما. ويستشهد له ابن الأَنْبارِيّ بقول الفَرَزْدَق «لنا قَمَراها»: «أراد: لنا شمسها وقمرها، فغلب القمر على الشمس فقال قمراها» [@ibn-al-anbari، ص324]."
  - "«زَوْرَاء» مؤنث «أَزْوَر» على وزن «فَعْلاء»، من الزَّوَر وهو الميل."
rhetoric:
  thesis: "ناقة رويّت من ماء قومها، فلا تقترب من ماء العدو. وفي ذلك أن صاحبها يمرّ بأرض الأعداء ولا يخافهم."
  devices:
    - title: "التغليب في «الدُّحْرُضَيْنِ»"
      text: "التغليب: أن يُجمع شيئان باسم أحدهما. فالماءان دُحْرُض ووَسِيع، وثنّاهما باسم الأول، كما يقال: القمران للشمس والقمر."
    - title: "الدَّيْلَم مثلًا للأعداء"
      text: "على تفسير الأَصْمَعِيّ سمّى الأعداء «الدَّيْلَم»، وهم أمة من العجم، كما يقال للأعداء: «كأنهم الترك والديلم. يريد أن عدواتهم كعداوة أولئك» [@ibn-al-anbari، ص324]. وقال الأَعْلَم: «والديلم ضرب من الترك ضربهم مثلا لأعدائه» [@diwan-antara، ص202]."
    - title: "نسبة فعل الراكب إلى الناقة"
      text: "يقول أبو جَعْفَر إن المعنى: «أي أني أمر بحياض الديلم، وهم الأعداء، فأجيزها إياها ولا ألتفت إلى الأعداء. فجعل الخبر لها والمعنى له» [@ibn-al-anbari، ص325]. فالنفور في الظاهر للناقة، والجرأة في الحقيقة للفارس."
  connection: "ثم يصف نشاطها في السير: «وَكَأَنَّمَا تَنْأَى بِجَانِبِ دَفِّهَا» [@ibn-al-anbari، ص325]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "شَرِبَتْ بِمَا / ءِدْ دُحْرُضَيْ / نِ فَأَصْبَحَتْ = متَفاعلن / مُتْفاعلن / متَفاعلن — زَوْرَاءَ تَنْ / فِرُ عَنْ حِيَا / ضِدْدَيْلَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار ثانية الصدر، والأولى والثالثة من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُدغم لام التعريف في الدال من «الدُّحْرُضَيْنِ» و«الدَّيْلَمِ»."
context: "أول أبيات الناقة بعد الشرب (28–34): يعود فيه إلى الناقة بعد الظليم، قال الزَّوْزَنِيّ: «ثم رجع إلى وصف ناقته» [@zawzani، ص253]. ومن هنا إلى البيت 34 يصفها في سيرها وبروكها وعرقها."
