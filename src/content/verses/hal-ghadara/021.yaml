first: "وَحَشِيَّتِي سَرْجٌ عَلَى عَبْلِ الشَّوَى"
second: "نَهْدٍ مَرَاكِلُهُ نَبِيلِ الْمَحْزِمِ"
meaning: "فراشي سرج على فرس غليظ القوائم، ضخم الجنبين، عظيم موضع الحزام. قال الزَّوْزَنِيّ: «يريد أنه يستوطئ سرج الفرس كما يستوطئ غيره الحشية، ويلازم ركوب الخيل لزوم غيره الجلوس على الحشية والاضطجاع عليها» [@zawzani، ص251]."
vocabulary:
  - term: "حَشِيَّتِي"
    text: "«(حشيته) : فراشه» [@ibn-al-anbari، ص316]."
  - term: "عَبْلِ الشَّوَى"
    text: "«معناه على فرس غليظ القوائم والعظام، كثير العصب»، «و (الشوى) : القوائم» [@ibn-al-anbari، ص316]. والشوى في غير هذا الموضع جمع «شواة، وهي جلدة الرأس» [@ibn-al-anbari، ص316]."
  - term: "نَهْدٍ"
    text: "«و (النهد) : المجفر الجنبين الغليظ»، أي الممتلئ الجنبين، وقال أبو جَعْفَر: «النهد: المشرف الصدر والمقدم» [@ibn-al-anbari، ص317]."
  - term: "مَرَاكِلُهُ"
    text: "موضع عقبي الفارس من جنبي الفرس، قال الأَعْلَم الشَّنْتَمَرِيّ: «والمراكل حيث يركل الفارس بعقبيه والمعنى أنه ضخم الجوف» [@diwan-antara، ص199]. وفي لسان العرب: «والمَرْكَلانِ مِنَ الدَّابَّةِ: هُمَا مَوْضِعَا القُصْرَيَيْن مِنَ الْجَنْبَيْنِ» [@lisan، ج11 ص294]."
  - term: "نَبِيلِ الْمَحْزِمِ"
    text: "«وقوله: نبيل المحزم أي هو ضخم الوسط منتفخه، والمحزم موضع الحزام من جوفه» [@diwan-antara، ص199]. وقال الزَّوْزَنِيّ: «النبيل: السمين» [@zawzani، ص251]."
syntax:
  - "«وَحَشِيَّتِي سَرْجٌ» مبتدأ وخبر، وعند ابن الأَنْبارِيّ على مذهب الكوفيين: «والحشية مرفوعة بسرج، وسرج بها»، أي يرفع كل منهما الآخر [@ibn-al-anbari، ص317]. و«عَلَى عَبْلِ الشَّوَى» متعلق بمحذوف صفة لـ«سَرْجٌ»."
  - "«والنهد نعت لعبل، والمراكل مرتفعة بمعنى نهد، ونبيل المحزم نعت لعبل» [@ibn-al-anbari، ص317]. أي أن «مَرَاكِلُهُ» فاعل للصفة «نَهْدٍ»، والموصوف كله محذوف: على فرسٍ عَبْلِ الشَّوى."
morphology:
  - "«مَرَاكِل» جمع «مَرْكَل» على وزن «مَفاعِل»، قال الزَّوْزَنِيّ: «المراكل: جمع المركل وهو موضع الركل، والركل: الضرب بالرجل» [@zawzani، ص251]."
  - "«الْمَحْزِم» اسم مكان على وزن «مَفْعِل» من الحَزْم، أي موضع الحزام. و«عَبْل» صفة على «فَعْل»: «ويقال: رجل عبل وامرأة عبلة؛ وقد عبل عبالة، إذا غلظ» [@ibn-al-anbari، ص316]."
rhetoric:
  thesis: "يتم المقابلة: إن كانت لها حشية فحشيته سرج. ثم يصف الفرس بما يُحمد في الخيل، فيصير الشكوى فخرًا."
  devices:
    - title: "التشبيه البليغ في «وَحَشِيَّتِي سَرْجٌ»"
      text: "التشبيه البليغ: ما حُذفت منه أداة التشبيه ووجه الشبه. فجعل السرج نفسه حشية، ولم يقل: كأن السرج حشيتي. وهو يرد على البيت السابق بالكلمة نفسها: لها «حَشِيَّة»، وله «حَشِيَّتِي»."
    - title: "حذف الموصوف وتتابع الصفات"
      text: "لم يذكر الفرس، بل صفاته: «عَبْلِ الشَّوَى نَهْدٍ مَرَاكِلُهُ نَبِيلِ الْمَحْزِمِ». قال الزَّوْزَنِيّ: «ثم وصف الفرس بأوصاف يحمدونها وهي: غلظ القوائم وانتفاخ الجنبين وسمنهما» [@zawzani، ص251]."
  connection: "ثم يترك الفرس إلى الناقة التي تبلغه دارها: «هَلْ تُبْلِغَنِّي دَارَهَا شَدَنِيَّةٌ» [@ibn-al-anbari، ص317]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَحَشِيْيَتِي / سَرْجُنْ عَلَى / عَبْلِشْ شَوَى = متَفاعلن / مُتْفاعلن / مُتْفاعلن — نَهْدِنْ مَرَا / كِلُهُو نَبِي / لِلْمَحْزِمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار الثانية والثالثة من الصدر، والأولى والثالثة من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُشبع ضمة الهاء في «مَرَاكِلُهُ» فتُنطق «مَرَاكِلُهُو»."
context: "ثاني بيتي عَبْلة المنعّمة والفارس، وفيه أول وصف للفرس في القصيدة. ويروي ابن الأَنْبارِيّ في كلمة «الشوى» خبرًا: أنشد أبو الخَطّاب الأَخْفَش بيتًا فيه «شواته» فخطّأه أبو عَمْرو بن العلاء، ثم قدم أعرابي فقال: اقشعرت شواتي، «فعلمنا أن أبا عمرو وأبا الخطاب أصابا جميعا» [@ibn-al-anbari، ص317]."
