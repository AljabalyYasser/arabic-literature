first: "كَيْفَ الْمَزَارُ وَقَدْ تَرَبَّعَ أَهْلُهَا"
second: "بِعُنَيْزَتَيْنِ وَأَهْلُنَا بِالْغَيْلَمِ"
meaning: "كيف أزورها وأهلها ينزلون الربيع في عُنَيْزَتَيْن، وأهلنا في الغَيْلَم؟ قال الزَّوْزَنِيّ: «كيف يمكنني أن أزورها وقد أقام أهلها زمن الربيع بهذين الموضعين وأهلنا بهذا الموضع وبينهما مسافة بعيدة ومشقة مديدة؟» [@zawzani، ص247]."
vocabulary:
  - term: "الْمَزَارُ"
    text: "«مكان الزيارة. ويقال زرته مزارا وزورا» [@ibn-al-anbari، ص302]، وعند الزَّوْزَنِيّ: «المزار في البيت: مصدر كالزيارة» [@zawzani، ص247]."
  - term: "تَرَبَّعَ"
    text: "«معناه نزلوا في الربيع» [@ibn-al-anbari، ص303]، قال الأَعْلَم الشَّنْتَمَرِيّ: «وتربع من الربيع بمنزلة تصيف من الصيف» [@diwan-antara، ص188]."
  - term: "عُنَيْزَتَيْنِ"
    text: "«وعنيزتان أيضا: موضع» [@ibn-al-anbari، ص303]، وعند أبي الفَرَج: «أكمة سوداء بين البصرة ومكة» [@aghani-dk، ج9 ص222]."
  - term: "الْغَيْلَمِ"
    text: "«والغيلم: موضع» [@ibn-al-anbari، ص303]، وفي لسان العرب: «والغَيْلَمُ: موضعٌ فِي شِعْرِ عَنترة» [@lisan، ج12 ص441]. ويقول الأَعْلَم: «والغيلم موضع، وهو أيضا البئر الغزيرة الماء وهو بالعين غير معجمة» [@diwan-antara، ص188]، أي أن البئر الغزيرة «العَيْلَم» بالعين."
syntax:
  - "«والمزار رفع بكيف، والأهل رفع بتربع، والأهل الآخرون يرتفعون على معنى وحل أهلنا بالغيلم» [@ibn-al-anbari، ص303]. وعند التِّبْرِيزِيّ: «والمزار: مرفوع بالابتداء على مذهب سيبويه، وبالاستقرار على مذهب غيره» [@tabrizi-ashr، ص181–182]، أي أن «كَيْفَ» خبر مقدم."
  - "وجملة «وَقَدْ تَرَبَّعَ أَهْلُهَا» حال، وجملة «وَأَهْلُنَا بِالْغَيْلَمِ» معطوفة عليها أو حال ثانية."
morphology:
  - "«تَرَبَّعَ» على وزن «تَفَعَّلَ» من الربيع، كما يقال: تَصَيَّفَ من الصيف."
  - "«الْمَزَار» على وزن «مَفْعَل» من «زار يزور»، وأصله «مَزْوَر»، نُقلت حركة الواو إلى الزاي فقُلبت ألفًا."
  - "«عُنَيْزَتَيْنِ» مثنى «عُنَيْزَة» بلفظ التصغير، وهو مجرور بالياء."
rhetoric:
  thesis: "سؤال لا ينتظر جوابًا: المسافة نفسها هي الجواب. وحين تجتمع القبائل في الربيع يتفرق الحيّان."
  devices:
    - title: "الاستفهام في «كَيْفَ الْمَزَارُ»"
      text: "استفهام يراد به الاستبعاد والتحسر لا طلب الجواب، كما يصوغه التِّبْرِيزِيّ: «كيف أزورها وقد بعدت عنى بعد قربها وإمكان زيارتها؟» [@tabrizi-ashr، ص181]."
    - title: "المقابلة بين «أَهْلُهَا» و«أَهْلُنَا»"
      text: "يعيد بناء البيت 4: أهلها في موضع، وأهله في موضع آخر، وبين الكلمتين في العجز الواو وحدها، كأن البعد كله في حرف."
  connection: "ثم يخاطبها: إن كنت عزمت على الفراق فقد سبق الأمر بليل: «إِنْ كُنْتِ أَزْمَعْتِ الْفِرَاقَ فَإِنَّمَا» [@ibn-al-anbari، ص303]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "كَيْفَلْ مَزَا / رُ وَقَدْ تَرَبْ / بَعَ أَهْلُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن — بِعُنَيْزَتَيْ / نِ وَأَهْلُنَا / بِلْغَيْلَمِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار أولى الصدر وآخر العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُدغم الباء المشددة في «تَرَبَّعَ» فتُكتب في التقطيع باءين، إحداهما آخر التفعيلة الثانية والأخرى أول الثالثة."
context: "يعود إلى بُعد الديار بعد أن أكد لها حبه (البيت 8)، فيجمع الحب والمسافة: هي في القلب، وأهلها بعيدون. وفي البيتين التاليين يتحول البعد إلى رحيل."
variants:
  - reading: "شَطَّ الْمَزَارُ إِذَا تَرَبَّعَ أَهْلُنَا ... حَضَنًا وَأَهْلُكِ سَاكِنٌ بِالْغَيْلَمِ"
    status: "رواية أخرى"
    note: "يذكرها ابن الأَنْبارِيّ، و«وحضن: جبل بنجد» [@ibn-al-anbari، ص302–303]. وفيها يخاطبها في العجز «وَأَهْلُكِ» بدل الحديث عنها غائبة."
