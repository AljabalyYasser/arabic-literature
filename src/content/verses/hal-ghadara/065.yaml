first: "فِي حَوْمَةِ الْمَوْتِ الَّتِي لَا يَتَّقِي"
second: "غَمَرَاتِهَا الْأَبْطَالُ غَيْرَ تَغَمْغُمِ"
meaning: "في معظم المعركة حيث يدور الموت، لا يملك الأبطال أمام شدائدها إلا أصواتًا مختلطة لا تُفهم. وعلى رواية «لا تشتكي» يقول الزَّوْزَنِيّ: «يقول: ولقد حفظت وصية عمي في حومة الحرب التي لا تشكوها الأبطال إلا بجلبة وصياح» [@zawzani، ص262]."
vocabulary:
  - term: "حَوْمَةِ"
    text: "«حومة كل شيء. معظمه» [@ibn-al-anbari، ص356]. وعند الزَّوْزَنِيّ: «وهي حيث تحوم الحرب أي تدور» [@zawzani، ص262]."
  - term: "غَمَرَاتِهَا"
    text: "«شدائدها» [@ibn-al-anbari، ص356]، و«التي تغمر أصحابها، أي تغلب قلوبهم وعقولهم» [@zawzani، ص262]."
  - term: "تَغَمْغُمِ"
    text: "«صوت تسمعه ولا تفهمه» [@ibn-al-anbari، ص357]. وفي اللسان أن الغمغمة والتغمغم الكلام الذي لا يُبين، «وَقِيلَ هُمَا أَصوات الثِّيرَانِ عِنْدَ الذُّعْر وأَصوات الأَبطال» [@lisan، ج12 ص444]."
context: "يحدد موضع الوفاء بالوصية (63–66): وسط المعركة. وانفرد متن ابن الأَنْبارِيّ بـ«لا يتقي»، ودليله على أنها روايته لا خطأ في النسخة أن إعرابه يقول: «والأبطال رفع بيتقي، والغمرات نصب بيتقي» [@ibn-al-anbari، ص357]. أما الأَعْلَم [@diwan-antara، ص215] والزَّوْزَنِيّ [@zawzani، ص262] والتِّبْرِيزِيّ [@tabrizi-ashr، ص209] فيروونه «لا تشتكي». والبيت عند الأَعْلَم 70، وفي حاشية المحقق أن نسخة «خ» أسقطت هذا البيت والذي بعده [@diwan-antara، ص215]. وهو عند الزَّوْزَنِيّ 63 [@zawzani، ص262]."
syntax:
  - "«وفي حومة الموت من صلة تقلص. ويجوز أن يكون من صلة حفظت، والتي نعت للحومة» [@ibn-al-anbari، ص357]: أي متعلق بـ«تَقْلِصُ» أو بـ«حَفِظْتُ» في البيت السابق."
  - "«والأبطال رفع بيتقي، والغمرات نصب بيتقي، واختفضت التاء لأنها غير أصلية، وغير نصب على المصدر» [@ibn-al-anbari، ص357]: أي نُصب جمع المؤنث السالم بالكسرة."
  - "ويجعل التِّبْرِيزِيّ «غَيْرَ» استثناء منقطعًا: «و (غير) منصوب على إنه استثناء ليس من الأول، وسيبويه يمثل مثل هذا بلكن، فكأنه قال: لكنهم يتغمغمون» [@tabrizi-ashr، ص209]. والاستثناء المنقطع أن يكون المستثنى من غير جنس ما قبله: فالتغمغم ليس اتقاء ولا شكوى."
morphology:
  - "تَغَمْغُم مصدر تَغَمْغَمَ على وزن تَفَعْلُل، من الرباعي المضعّف غَمْغَمَ، وتكرار المقطع فيه يحاكي الصوت."
  - "يَتَّقِي مضارع اتَّقَى على وزن افتعل، وأصله يَوْتَقِي، قُلبت الواو تاء وأُدغمت."
rhetoric:
  thesis: "يرسم الحرب بالصوت: لا كلام فيها، بل غمغمة. فالأبطال أنفسهم يعجزون عن القول، ويبقى هو حافظًا للوصية."
  devices:
    - title: "الاستعارة في «حَوْمَةِ الْمَوْتِ» و«غَمَرَاتِهَا»"
      text: "جعل للموت حومة، أي موضعًا يدور فيه، وجعل لهذه الحومة غمرات كغمرات الماء. يقول الأَعْلَم: «والغمرات الشدائد، كأنها تغمر من حلت به» [@diwan-antara، ص215]. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "الاستثناء المنقطع في «غَيْرَ تَغَمْغُمِ»"
      text: "نفى عن الأبطال الاتقاء ثم استثنى الغمغمة، فدلّ على أنهم لا يملكون شيئًا. ويقول الأَعْلَم في المعنى: «والمعنى أن الأبطال لا يشكو بعضها إلى بعض إلا بكلام خفي مختلط، لما هم فيه من الشدة والهول» [@diwan-antara، ص215]."
  connection: "ثم يقول ما كان منه في تلك الحومة: جعلوه بينهم وبين الأسنة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فِي حَوْمَتِلْ / مَوْتِلْ لَتِي / لَا يَتْتَقِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — غَمَرَاتِهَلْ / أَبْطَالُ غَيْ / رَ تَغَمْغُمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، تفعيلات الصدر كلها، والوسطى من العَجُز."
