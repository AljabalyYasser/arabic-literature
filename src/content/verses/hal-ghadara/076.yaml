first: "الشَّاتِمَيْ عِرْضِي وَلَمْ أَشْتُمْهُمَا"
second: "وَالنَّاذِرَيْنِ إِذَا لَقِيتُهُمَا دَمِي"
meaning: "هما اللذان يشتمان عرضي ولم أشتمهما، ويقولان: لئن لقيناه لنقتلنّه. قال ابن الأَنْبارِيّ: «معناه والقائلين والله لئن لقيناه لنقتلنه» [@ibn-al-anbari، ص364]."
vocabulary:
  - term: "عِرْضِي"
    text: "عند الأَعْلَم: «العرض: نفس الرجل، و (العرض) الحسب» [@diwan-antara، ص222]."
  - term: "النَّاذِرَيْنِ"
    text: "الموجبَين على أنفسهما. «ويقال: نذرت الندر انذره وأنذره؛ إذا أوجبته على نفسك، وأنذرت دم فلان؛ إذا أبحته» [@tabrizi-ashr، ص215]."
context: "ثاني أبيات ابنَي ضَمْضَم (75–77): يصفهما بما يفعلان. وانفرد متن ابن الأَنْبارِيّ هنا بـ«إذا لقيتهما»، وعند الأَعْلَم [@diwan-antara، ص222] والزَّوْزَنِيّ [@zawzani، ص265] وابن قُتَيْبَة [@ibn-qutayba، ج1 ص246] «إذا لم ألقهما»، وفي متن التِّبْرِيزِيّ «إذا لم القهما» ثم يقول: «ويروى (إذا لقيتهما دمي)» [@tabrizi-ashr، ص214]. والبيت عند الأَعْلَم 84، وعند الزَّوْزَنِيّ 74."
syntax:
  - "«وموضع الشاتمين والناذرين خفض على النعت لابني ضمضم، وموضع عرضي خفض بإضافة الشاتم إليه» [@ibn-al-anbari، ص364]. «ويجوز أن يكون موضع الشاتمي والناذرين نصبا على الذم، ويجوز أن يكون رفعا على الذم، بإضمار هما الشاتما» [@ibn-al-anbari، ص365]. والنصب على الذم أن يُقطع النعت عن منعوته بفعل محذوف تقديره أذمّ."
  - "ويجيز ابن الأَنْبارِيّ في «عِرْضِي» النصب أيضًا: «ويجوز أن يكون في موضع نصب بالشاتمي، ومعناه الشاتمين، إلا أن النون حذفت» [@ibn-al-anbari، ص364]، كقراءة من قرأ ﴿وَالْمُقِيمِي الصَّلَاةَ﴾ بالنصب."
  - "و«دَمِي» مفعول «النَّاذِرَيْنِ»، و«إِذَا لَقِيتُهُمَا» ظرف معترض بينهما. «وإنما قال إذا لقيتهما ولم يقل إذا لقياني، وهو أبين في الكلام، لأن ما لقيك فقد لقيته وما لقيته فقد لقيك» [@ibn-al-anbari، ص364]."
morphology:
  - "الشَّاتِمَيْ مثنى الشاتم، حُذفت نونه للإضافة، «والنون تحذف في مثل هذا كثير للتخفيف» [@tabrizi-ashr، ص215]."
  - "أَشْتُمْهُمَا مضارع شَتَمَ مجزوم بـ«لم»، ويقال يَشْتُم ويَشْتِم."
rhetoric:
  thesis: "يضع خصميه في موضع الضعف: يشتمان ولا يُشتمان، ويتوعدان ولا يفعلان. فالبيت يجعل وعيدهما كلامًا فقط."
  devices:
    - title: "المقابلة في «الشَّاتِمَيْ عِرْضِي وَلَمْ أَشْتُمْهُمَا»"
      text: "قابل شتمهما بترك شتمهما: فهو أعلى من أن يردّ بالكلام، ورده بالفعل كما في البيت التالي [@ibn-al-anbari، ص364]."
    - title: "السخرية على رواية «إذا لم ألقهما»"
      text: "على هذه الرواية يتوعدانه في غيابه فقط. يقول الأَعْلَم: «أي يقولان ذلك في الخلاء، فإذا لقيتهما أمسكا عن ذلك هيبة لي وجبنًا مني» [@diwan-antara، ص222]، ويقول الزَّوْزَنِيّ: «يريد أنهما يتواعدنه حال غيبته فأما في حال الحضور فلا يتجاسران عليه» [@zawzani، ص265]."
  connection: "ثم يأتي بالرد الذي يغني عن الشتم: قتل أباهما."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَشْشَاتِمَيْ / عِرْضِي وَلَمْ / أَشْتُمْهُمَا = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — وَنْنَاذِرَيْ / نِ إِذَا لَقِي / تُهُمَا دَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، تفعيلات الصدر كلها، والأولى من العَجُز. وتُنطق همزة الوصل في أول الصدر لأنه ابتداء."
variants:
  - reading: "وَالنَّاذِرَيْنِ إِذَا لَمَ اْلقَهُمَا دَمِي"
    status: "رواية الأَعْلَم والزَّوْزَنِيّ وابن قُتَيْبَة، ومتن التِّبْرِيزِيّ"
    note: "أي إذا لم أَلْقَهما، فنُقلت حركة الهمزة إلى الميم. [@diwan-antara، ص222] [@zawzani، ص265] [@tabrizi-ashr، ص214]."
