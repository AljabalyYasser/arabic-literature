first: "سَبَقَتْ يَدَايَ لَهُ بِعَاجِلِ طَعْنَةٍ"
second: "وَرَشَاشِ نَافِذَةٍ كَلَوْنِ الْعَنْدَمِ"
meaning: "سبقته يداي بطعنة عاجلة، ورشّ دمٍ من طعنة نافذة لونه أحمر كالعندم. قال الزَّوْزَنِيّ: «يقول: طعنته طعنة في عجلة ترش دمًا من طعنة نافذة تحكي لون العندم» [@zawzani، ص257]."
vocabulary:
  - term: "سَبَقَتْ يَدَايَ"
    text: "«أي عجلت إليه بالطعنة» [@ibn-al-anbari، ص342]، فطعنته قبل أن يطعنني."
  - term: "رَشَاشِ"
    text: "«ما تطاير وتفرق من الدم» [@ibn-al-anbari، ص342]."
  - term: "نَافِذَةٍ"
    text: "«التي نفذت إلى الجانب الآخر. ويقال: النافذة: التي نفذت إلى الجوف» [@ibn-al-anbari، ص342]."
  - term: "الْعَنْدَمِ"
    text: "«صبغ أحمر، يقال إنه البقم» [@ibn-al-anbari، ص342]. وعند الزَّوْزَنِيّ: «العندم: دم الأخوين، وقيل: بل هو البقم»، «وقيل شقائق النعمان» [@zawzani، ص257]. والبَقَّم: شجر يُصبغ بخشبه أحمر."
context: "يتم قصة حليل الغانية (42–43): البيت السابق آخر المشهد، وهذا أوله، الطعنة التي جدّلته. والبيت عند الأَعْلَم 48 بلفظ آخر [@diwan-antara، ص207]، وعند الزَّوْزَنِيّ 42 [@zawzani، ص257]. وفي متن ابن الأَنْبارِيّ يتكرر صدره تقريبًا في البيت 49: «جَادَتْ يَدَايَ لَهُ بِعَاجِلِ طَعْنَةٍ» [@ibn-al-anbari، ص346]."
syntax:
  - "«يَدَايَ» فاعل «سَبَقَتْ» مرفوع بالألف لأنه مثنى، و«لَهُ» و«بِعَاجِلِ» متعلقان بالفعل. و«عَاجِل» صفة قُدّمت وأضيفت إلى موصوفها، كما يقول الزَّوْزَنِيّ في البيت المشابه: «قدم الصفة على الموصوف ثم أضافها إليه، تقديره: بطعنة عاجلة» [@zawzani، ص258]."
  - "«وَرَشَاشِ» معطوف على «عَاجِلِ» مجرور مثله. «والكاف في قوله (كلون العندم) في موضع جر لأنها نعت لرشاش» [@tabrizi-ashr، ص199]، «ويجوز أن تكون الكاف ... في موضع رفع على إضمار مبتدا، ويكون التقدير: لونه كلون العندم» [@tabrizi-ashr، ص199]."
morphology:
  - "رَشَاش على وزن فَعَال، من رَشَّ يَرُشّ، وهو اسم لما يتطاير؛ «والرشاش، بالكسر: جمع رش» [@ibn-al-anbari، ص342]."
  - "نَافِذَة اسم فاعل مؤنث من نَفَذَ، صفة لموصوف محذوف: طعنة نافذة."
rhetoric:
  thesis: "صورة سرعة وحذق: يداه تسبقان، والطعنة تنفذ، والدم يرشّ أحمر. فاللون هنا آخر ما تقع عليه العين."
  devices:
    - title: "الكناية في «سَبَقَتْ يَدَايَ لَهُ»"
      text: "سبق اليدين كناية عن الحذق والسرعة: طعن قبل أن يُطعن. ويقول أبو جعفر في مثله: «معناه سبقته بالطعن، كنت أحذق به منه» [@ibn-al-anbari، ص346]."
    - title: "التشبيه في «كَلَوْنِ الْعَنْدَمِ»"
      text: "شبّه لون الدم بلون صبغ أحمر معروف. وهو تشبيه في اللون، من الضرب الذي يكون عند عبد القاهر الجُرْجانيّ «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "حذف الموصوف في «نَافِذَةٍ»"
      text: "ذكر الصفة وترك الموصوف، أي الطعنة، لأن السياق يدل عليه، فجاء الكلام أسرع كالطعنة نفسها."
  connection: "ثم يلتفت إلى عَبْلَة فيسألها: لِمَ لا تسألين الفرسان عني؟"
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "سَبَقَتْ يَدَا / يَ لَهُو بِعَا / جِلِ طَعْنَتِنْ = متَفاعلن / متَفاعلن / متَفاعلن — وَرَشَاشِ نَا / فِذَتِنْ كَلَوْ / نِلْ عَنْدَمِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأخيرة من العَجُز. وتُشبع ضمة الهاء في له فتُنطق لهو ليستقيم الوزن."
variants:
  - reading: "سَبَقَتْ يَدَايَ لَهُ بِعَاجِلِ ضَرْبَةٍ"
    status: "متن التِّبْرِيزِيّ"
    note: "[@tabrizi-ashr، ص199]."
  - reading: "عَجِلَتْ يَدَايَ لَهُ بِمَارِنِ طَعْنَةٍ"
    status: "رواية الأَعْلَم"
    note: "قال: «المارن الرمح اللين عند الهز»، «وأضاف المارن إلى الطعنة لالتباسه بها» [@diwan-antara، ص207–208]. وفي حاشية المحقق أن في نسخة «ف»: «سبقت يداي له بمارن صعدة» [@diwan-antara، ص207]، والصَّعْدة: القناة المستقيمة."
