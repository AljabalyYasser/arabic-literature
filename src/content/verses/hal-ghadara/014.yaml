first: "وَكَأَنَّ فَارَةَ تَاجِرٍ بِقَسِيمَةٍ"
second: "سَبَقَتْ عَوَارِضَهَا إِلَيْكَ مِنَ الْفَمِ"
meaning: "كأن وعاء مسك عند عطار سبقت ريحُه إليك أسنانَها حين تدنو منها، فريح فمها يصلك قبل أن تقبّلها. قال الزَّوْزَنِيّ: «شبه طيب نكهتها بطيب ريح المسك، أي تسبق نكهتها الطيبة عوارضها إذا رمت تقبيلها» [@zawzani، ص249]. وقال الأَعْلَم الشَّنْتَمَرِيّ: «يقول: إذا أهويت إليها لتقبلها انتشرت من فمها رائحة طيبة» [@diwan-antara، ص196]."
vocabulary:
  - term: "فَارَةَ تَاجِرٍ"
    text: "«معناه كان فأرة مسك. و (التاجر) هاهنا: العطار» [@ibn-al-anbari، ص308]. قال الأَعْلَم: «الفارة للمسك وهي نافجته، سميت بذلك لفورها إذا فتقت» [@diwan-antara، ص195]، والنافجة: الوعاء الذي يجتمع فيه المسك."
  - term: "قَسِيمَةٍ"
    text: "فيها أقوال يجمعها ابن الأَنْبارِيّ: قال يَعْقُوب: «بقسيمة، معناه بامرأة جميلة»، وقال أبو جَعْفَر: «بقسيمة، معناه بسوق فيها العطارون»، وقال الرُّسْتُمِيّ: «القسيمة عندي الساعة التي تكون قسما بين الليل والنهار، وفي تلك الساعة تغير الأفواه» [@ibn-al-anbari، ص310]. وعند الأَعْلَم: «والقسيمة الجونة التي فيها الطيب، والقسيمة أيضا المرأة الحسناء» [@diwan-antara، ص195]، والجُونة: سُلّة العطار. وفي لسان العرب: «فَقِيلَ: هِيَ طُلُوعُ الْفَجْرِ، وَقِيلَ: هُوَ وَقْتُ تَغَير الأَفواه» [@lisan، ج12 ص482]."
  - term: "عَوَارِضَهَا"
    text: "الأسنان التي في جانبي الفم، «ويقال: العوارض: ما خلف الضواحك من الأسنان»، وقال أبو جَعْفَر: «العوارض هي الضواحك، وأراد الأسنان كلها لم يرد العوارض وحدها» [@ibn-al-anbari، ص310]. وقال الأَصْمَعِيّ: «العوارض منابت الأضراس» [@tabrizi-ashr، ص184]."
syntax:
  - "«والفارة اسم كأن، وخبر كأن ما عاد من سبقت، والعوارض مفعول بها» [@ibn-al-anbari، ص311]، أي أن جملة «سَبَقَتْ» خبر «كأنّ»."
  - "و«بِقَسِيمَةٍ» عند التِّبْرِيزِيّ «تبيين وليس بخبر كأن» [@tabrizi-ashr، ص184]، أي متعلق بمحذوف يبيّن موضع الفأرة أو صاحبتها."
morphology:
  - "«فَارَة» عند الزَّوْزَنِيّ من الفوران: «والأصل فائرة فخففت فقيل فارة» [@zawzani، ص248]."
  - "«عَوَارِض» جمع «عارض» على «فَواعِل»، قال التِّبْرِيزِيّ: «وهذا الجمع الذي على فواعل لا يكاد يجيء إلا جمع فاعلة نحو ضاربة وضوارب، إلا أنهم ربما جمعوا فاعلا على فواعل» [@tabrizi-ashr، ص184]."
  - "«قَسِيمَة» على «فَعِيلَة» من القَسامة، قال الزَّوْزَنِيّ: «القسامة: الحسن والصباحة، والفعل قَسُم يَقْسُمُ، والنعت قسيم» [@zawzani، ص249]."
rhetoric:
  thesis: "ريح فمها يسبق قبلتها. فهو يصف الطيب بالحركة: شيء يجري إليك قبل أن تصل."
  devices:
    - title: "التشبيه في «وَكَأَنَّ فَارَةَ تَاجِرٍ»"
      text: "شبّه ريح فمها بريح المسك، ووجه الشبه مما يُدرك بالحسّ، وهو عند عبد القاهر الجُرْجانيّ من الضرب الذي «بَيّنٌ لا يجري فيه التأوُّل» [@asrar، ص92]. وخصّ فأرة التاجر، قال التِّبْرِيزِيّ: «إنما خص فأرة التاجر لأنه لا يتربص بالمسك إذ كان يتغير فمسكه أجود» [@tabrizi-ashr، ص184]، أي أن العطار يبيع مسكه طريًّا فلا يفسد."
    - title: "السبق في «سَبَقَتْ عَوَارِضَهَا إِلَيْكَ»"
      text: "جعل الريح تسابق الأسنان، فتصل قبلها. قال أبو جَعْفَر: «معناه صارت إليك رائحتها قبل أن تقبلها فكيف إذا قبَّلتها» [@ibn-al-anbari، ص310]. فالبيت يقف عند الريح ويترك ما بعدها للسامع."
  connection: "ثم يعطف على الفأرة تشبيهًا ثانيًا: «أَوْ رَوْضَةً أُنُفًا تَضَمَّنَ نَبْتَهَا» [@ibn-al-anbari، ص311]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَكَأَنْنَ فَا / رَةَ تَاجِرِنْ / بِقَسِيمَتِنْ = متَفاعلن / متَفاعلن / متَفاعلن — سَبَقَتْ عَوَا / رِضَهَا إِلَيْ / كَ مِنَلْ فَمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "جاءت التفعيلات الست تامة «متَفاعلن» بلا إضمار، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. فتوالت المتحركات في البيت كله، وهو أخفّ أبيات هذا المقطع إيقاعًا."
context: "من أبيات الثغر والروضة (13–19): بعد الثغر يصف ريح الفم، فيبدأ بالمسك ثم ينتقل إلى الروضة في البيت التالي. وفي رواية الأَعْلَم بيت قبله: «وَكَأَنَّمَا نَظَرَتْ بِعَيْنَيْ شَادِنٍ ... رَشَأٍ مِنَ الْغِزْلَانِ لَيْسَ بِتَوْأَمِ» [@diwan-antara، ص195]."
variants:
  - reading: "وَكَأَنَّ رَيَّا فَارَةٍ هِنْدِيَّةٍ"
    status: "رواية أخرى"
    note: "«ويروى: (وكأن ريا فارة هندية) . يقول: كأن فارة مسك أتتك ريحها من فم هذه المرأة» [@ibn-al-anbari، ص309]. والرَّيّا: «الريح الطيبة» [@ibn-al-anbari، ص309]."
