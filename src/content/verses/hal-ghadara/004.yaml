first: "وَتَحُلُّ عَبْلَةُ بِالْجِوَاءِ وَأَهْلُنَا"
second: "بِالْحَزْنِ فَالصَّمَّانِ فَالْمُتَثَلَّمِ"
meaning: "عَبْلة تنزل بالجِواء، وأهله ينزلون بعيدًا عنها في الحَزْن والصَّمّان والمُتَثَلَّم. قال الزَّوْزَنِيّ: «وهي نازلة بهذا الموضع وأهلنا نازلون بهذه المواضع» [@zawzani، ص246]. فالبيت يقيس المسافة بين الحيّين بأسماء الأماكن."
vocabulary:
  - term: "تَحُلُّ"
    text: "تنزل، قال التِّبْرِيزِيّ: «حل يحل فهو حال، إذا نزل» [@tabrizi-ashr، ص178]."
  - term: "الْحَزْنِ"
    text: "عند الأَعْلَم الشَّنْتَمَرِيّ: «الحزن ما غلظ من الأرض وهو ها هنا موضع بعينه، وهو حزن تميم» [@diwan-antara، ص186]. وقال أبو جَعْفَر: «الجواء بنجد، والحزن لبني يربوع، والصمان لبني تميم» [@ibn-al-anbari، ص298]."
  - term: "الصَّمَّانِ"
    text: "قال التِّبْرِيزِيّ: «والصَّوَّان والصَّمَّان: موضع، ويقال: جبل، والصَّمان والصوان في الأصل: الحجارة» [@tabrizi-ashr، ص178]. وعند الأَعْلَم: «والصمان جبل تميم» [@diwan-antara، ص186]."
  - term: "الْمُتَثَلَّمِ"
    text: "«ومتثلم مكان» [@tabrizi-ashr، ص178]، وينشد لسان العرب هذا العجز في مادة «ثلم» [@lisan، ج12 ص78]."
syntax:
  - "«عَبْلَةُ» فاعل «تَحُلُّ»، و«بِالْجِوَاءِ» متعلق به."
  - "وفي «وَأَهْلُنَا» يقدّر ابن الأَنْبارِيّ فعلًا محذوفًا: «والأهل يرتفعون بفعل مضمر، والباء الثانية صلته، والتقدير: ويحل أهلنا بالحزن» [@ibn-al-anbari، ص298]. ويجوز أن تكون «وَأَهْلُنَا بِالْحَزْنِ» جملة اسمية: مبتدأ وخبر، والواو للحال، أي: تنزل عَبْلة بالجِواء والحال أن أهلنا بالحَزْن."
  - "«فَالصَّمَّانِ فَالْمُتَثَلَّمِ» معطوفان على «الْحَزْنِ» بالفاء."
morphology:
  - "«تَحُلُّ» مضارع «حَلَّ» المضاعف، وله في العربية معانٍ يفرّق التِّبْرِيزِيّ بينها: «وحل يحل إذا وجب فهو حال، وحل من إحرامه يحل فهو حلال، ولا يقال حال» [@tabrizi-ashr، ص178]. فالذي في البيت من الأول: حلّ يَحُلّ إذا نزل."
  - "«الْمُتَثَلَّم» على وزن «مُتَفَعَّل» من «تَثَلَّمَ»، وفي لسان العرب: «وَقَدِ انْثَلَم الْحَائِطُ وتَثَلَّم» [@lisan، ج12 ص78]، كأن الموضع سُمّي بثُلْمة فيه."
rhetoric:
  thesis: "بيت جغرافيا الفراق: هي في مكان واحد، وأهله في أماكن متتابعة. ولا يقول إن المسافة بعيدة، بل يعدّ الأماكن فيُفهم البعد من عدّها."
  devices:
    - title: "المقابلة بين «عَبْلَةُ» و«أَهْلُنَا»"
      text: "وضع في الصدر عَبْلة في مكانها، ثم أهله في العجز في أماكنهم. والعطف بالفاء في «فَالصَّمَّانِ فَالْمُتَثَلَّمِ» يمرّ على الأماكن واحدًا بعد واحد، كأنه يقطع الطريق بينها وبينه بالأسماء."
    - title: "الحذف في «وَأَهْلُنَا بِالْحَزْنِ»"
      text: "لم يُعِد الفعل مع أهله، وتقديره عند ابن الأَنْبارِيّ «ويحل أهلنا بالحزن» [@ibn-al-anbari، ص298]. وفي الحذف يقول عبد القاهر الجُرْجانيّ: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]. وهنا يقع الثقل على الأماكن، لأن الفعل معروف من الصدر."
  connection: "ثم يحيّي الطلل الذي خلا بعد رحيلها: «حُيِّيتَ مِنْ طَلَلٍ تَقَادَمَ عَهْدُهُ» [@ibn-al-anbari، ص298]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَتَحُلْلُ عَبْ / لَةُ بِلْجِوَا / ءِ وَأَهْلُنَا = متَفاعلن / متَفاعلن / متَفاعلن — بِلْحَزْنِ فَصْ / صَمْمَانِ فَلْ / مُتَثَلْلَمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار التفعيلتين الأوليين من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُدغم لام التعريف في الصاد من «الصَّمَّانِ» فتُنطق صادًا مشددة: «فَصْصَمْمَانِ»."
context: "يبيّن ما بين الحيّين بعد أن وقف في دارها: هي نازلة بالجِواء، وأهله بعيدون عنها. وهذا البعد سيعود في البيت 6، حين تحلّ بأرض أعدائه، وفي البيت 9 «كَيْفَ الْمَزَارُ»."
