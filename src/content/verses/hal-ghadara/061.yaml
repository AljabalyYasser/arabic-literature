first: "قَالَتْ رَأَيْتُ مِنَ الْأَعَادِي غِرَّةً"
second: "وَالشَّاةُ مُمْكِنَةٌ لِمَنْ هُوَ مُرْتَمِ"
meaning: "قالت الجارية: رأيت أهلها الأعداء غافلين، والصيد ممكن لمن أراد أن يرميه. قال الزَّوْزَنِيّ: «يريد أن زيارتها ممكن لطالبها لغفلة الرقباء والقرناء عنها» [@zawzani، ص261]."
vocabulary:
  - term: "غِرَّةً"
    text: "«معناه إمكان واغترار وغفلة» [@ibn-al-anbari، ص354]."
  - term: "الْأَعَادِي"
    text: "الأعداء، وهم قوم المرأة. «الأعادي: جمع الجمع، يقال في جمع عدُوّ: عُداة، وعُدى، وأعداء ويجمع أعداء على أعاد وأعادي» [@tabrizi-ashr، ص208]."
  - term: "مُرْتَمِ"
    text: "«معناه لمن أراد أن ينظر ويلتمس. وقال أبو جعفر: معناه لمن أراد أن يصطادها ويأخذها» [@ibn-al-anbari، ص354]."
context: "جواب الجارية في القصة (59–62). ويقرنه ابن رَشِيق بالبيت 59 في الدلالة على المرأة الممنوعة: «وكذلك قوله: والشاة ممكنة لمن هو مرتمي» [@ibn-rashiq، ج1 ص312]. والبيت عند الأَعْلَم 66 [@diwan-antara، ص214]، وعند الزَّوْزَنِيّ 59 [@zawzani، ص261]."
syntax:
  - "«والغرة نصب برأيت، والأعادي: جمع أعداء، والأعداء: جمع عدو»، «والشاة رفع بممكنة، والواو واو الحال، كأنه قال: في حال إمكان الرمي» [@ibn-al-anbari، ص354]: فـ«الشَّاةُ» مبتدأ و«مُمْكِنَةٌ» خبره، والجملة حال."
  - "و«مِنَ الْأَعَادِي» متعلق بـ«غِرَّةً» أو حال منها، و«هُوَ مُرْتَمِ» صلة «مَن» [@ibn-al-anbari، ص354]."
morphology:
  - "مُرْتَمٍ اسم فاعل من ارْتَمَى على وزن افتعل، منقوص حُذفت ياؤه، وردّته القافية بالكسر. ويقول الأَعْلَم: «هو مفتعل من الرمي» [@diwan-antara، ص214]."
  - "الأَعَادِي جمع الجمع على وزن أَفَاعِل، مفرده عَدُوّ."
rhetoric:
  thesis: "تعود استعارة الصيد: الأعداء نائمون، والشاة في متناول الرامي. فخبر الجارية يكمل صورة البيت 59."
  devices:
    - title: "ترشيح الاستعارة في «وَالشَّاةُ مُمْكِنَةٌ لِمَنْ هُوَ مُرْتَمِ»"
      text: "الترشيح أن يُذكر مع الاستعارة ما يلائم المستعار منه. فالشاة صيد، فذكر معها الرامي والإمكان. ويقول الأَعْلَم: «وهذا مثل، وإنما المعنى أن هذه المرأة ممكنة لمن رامها» [@diwan-antara، ص214]."
    - title: "الكلام على لسان الجارية"
      text: "جعل الخبر في فمها «قَالَتْ رَأَيْتُ»، فصار المشهد حوارًا قصيرًا بعد أمر البيت السابق [@ibn-al-anbari، ص354]."
  connection: "ثم يرسم المرأة في التفاتة: عنق ظبية صغيرة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "قَالَتْ رَأَيْ / تُ مِنَلْ أَعَا / دِي غِرْرَتَنْ = مُتْفاعلن / متَفاعلن / مُتْفاعلن — وَشْشَاةُ مُمْ / كِنَتُنْ لِمَنْ / هُوَ مُرْتَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، الأولى والثالثة من الصدر، والأولى من العَجُز."
