first: "عَهْدِي بِهِ مَدَّ النَّهَارِ كَأَنَّمَا"
second: "خُضِبَ الْبَنَانُ وَرَأْسُهُ بِالْعِظْلِمِ"
meaning: "آخر ما رأيته في أول النهار، وقد جفّ دمه عليه، كأن أصابعه ورأسه مخضوبة بالعِظْلِم. قال الزَّوْزَنِيّ: «يقول: رأيته طول النهار وامتداده بعد قتلي إياه وجفاف الدم عليه كأنّ بنانه ورأسه مخضوبان بهذا النبت» [@zawzani، ص260]."
vocabulary:
  - term: "عَهْدِي بِهِ"
    text: "لقائي به ورؤيتي له. «العهد: اللقاء، يقال: عهدته أعهده عهدًا إذا لقيته» [@zawzani، ص260]."
  - term: "مَدَّ النَّهَارِ"
    text: "«أوله، أي حين امتد النهار. يقال: أتيته مد النهار، وشد النهار، ووجه النهار، وشباب النهار، أي أوله» [@ibn-al-anbari، ص351]. وعند الزَّوْزَنِيّ: «مد النهار: طوله» [@zawzani، ص260]."
  - term: "الْبَنَانُ"
    text: "الأصابع، «واحدته بنانة» [@ibn-al-anbari، ص348]."
  - term: "الْعِظْلِمِ"
    text: "«الوسمة» [@ibn-al-anbari، ص351]، وهي نبت يُخضب به. وفي اللسان: «العِظْلِمُ: عُصارةُ بعضِ الشجرِ»، «والعِظْلِمُ: صِبْغٌ أَحمرُ، وَقِيلَ: هُوَ الوَسْمَةُ» [@lisan، ج12 ص412]."
context: "صورة القتيل بعد المعركة، وبها يختم مشهد حامي الحقيقة قبل بيت «بطل» الذي يعود إلى وصفه. والبيت عند الزَّوْزَنِيّ يسبق «فطعنته»، ورقمه عنده 54 [@zawzani، ص260]. وعند الأَعْلَم 63 بلفظ «اللَّبَان» [@diwan-antara، ص213]."
syntax:
  - "«ومد النهار منصوب على الوقت، وخبر عهدي ما عاد من الهاء» [@ibn-al-anbari، ص351]: أي «عَهْدِي» مبتدأ، وخبره الجملة بعده. وعند التِّبْرِيزِيّ: «وعهدي: في موضع رفع بالابتداء، والخبر في الاستقرار»، كقولك: «القتال اليوم» [@tabrizi-ashr، ص206]."
  - "«والتقدير: كأنما خضب بنانه ورأسه، فأقام الألف واللام في البنان مقام الهاء، كما قال الله عز وجل: (ونَهَىَ النَّفْسَ عن الهوى)، أي عن هواها» [@ibn-al-anbari، ص351]."
  - "و«مَا» في «كَأَنَّمَا» كافّة، كفّت «كأنّ» عن العمل فوليها الفعل «خُضِبَ» [@ibn-al-anbari، ص351]."
morphology:
  - "خُضِبَ ماضٍ مبني للمجهول من خَضَبَ."
  - "العِظْلِم على وزن فِعْلِل، رباعي مجرد."
rhetoric:
  thesis: "مشهد ساكن بعد مشهد حركة: القتيل ممدد، والدم جاف عليه أسود كالخضاب. فالبيت يُري الموت بلون الزينة."
  devices:
    - title: "التشبيه في «كَأَنَّمَا خُضِبَ الْبَنَانُ وَرَأْسُهُ بِالْعِظْلِمِ»"
      text: "شبّه الدم الجاف بالخضاب، وفسّره الأَعْلَم: «وإنما شبه الدم به لما انعقد، وضرب إلى السواد» [@diwan-antara، ص213]. فوجه الشبه اللون، وهو من التشبيه الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» عند عبد القاهر الجُرْجانيّ [@asrar، ص90]."
    - title: "المفارقة بين الخضاب والدم"
      text: "الخضاب زينة الأحياء، والدم هنا علامة الموت. فاختار للقتيل صورة الزينة، وهي سخرية خفية من خصم كان يُعرف بالترف والكرم."
  connection: "ثم يرجع إلى صفة القتيل وهو حيّ: طويل، شريف، قويّ."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "عَهْدِي بِهِي / مَدْدَنْ نَهَا / رِ كَأَنْنَمَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن — خُضِبَلْ بَنَا / نُ وَرَأْسُهُو / بِلْ عِظْلَمِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، والأخيرة من العَجُز."
variants:
  - reading: "عَهْدِي بِهِ شَدَّ النَّهَارِ كَأَنَّمَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي متن الأَعْلَم"
    note: "«ويروى: (شدَّ النهار) أي ارتفاعه» [@ibn-al-anbari، ص351] [@diwan-antara، ص213]."
  - reading: "خُضِبَ اللَّبَانُ وَرَأْسُهُ بِالْعِظْلِمِ"
    status: "رواية الأَعْلَم"
    note: "قال: «واللبان الصدر» [@diwan-antara، ص213]."
