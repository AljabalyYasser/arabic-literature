first: "سَحًّا وَتَسْكَابًا فَكُلَّ عَشِيَّةٍ"
second: "يَجْرِي عَلَيْهَا الْمَاءُ لَمْ يَتَصَرَّمِ"
meaning: "صبّت عليها السحائب ماءها صبًّا متتابعًا، فهو يجري على الروضة كل عشية لا ينقطع. قال الزَّوْزَنِيّ: «أصابها المطر الجود صبًّا وسكبًا فكل عشية يجري عليها ماء السحاب ولم ينقطع عنها» [@zawzani، ص250]."
vocabulary:
  - term: "سَحًّا"
    text: "«والسح: الصب. يقال: سحت السماء تسح سحا، إذا صبت المطر» [@ibn-al-anbari، ص313]. وعند الأَعْلَم الشَّنْتَمَرِيّ: «السح الصب الشديد والتسكاب مثله» [@diwan-antara، ص197]."
  - term: "تَسْكَابًا"
    text: "«و (التسكاب) والسكب والسح: الصب» [@ibn-al-anbari، ص313]."
  - term: "عَشِيَّةٍ"
    text: "آخر النهار. وخصّه لأسباب يذكرها الشُّرّاح: قال ابن الأَنْبارِيّ: «وإنما خص العشي لأن الزهر والنبات إلى الماء بالعشي أحوج؛ لأن الشمس قد أذهبت نداه وجففت أرضه» [@ibn-al-anbari، ص314]. وقال الأَعْلَم: «وخص مطر العشي لأنه أغزر وقيل خصه لأنه أراد الصيف وأكثر مطره بالعشي، والصيف هو الذي تدعوه العامة الربيع» [@diwan-antara، ص197]، ويروي التِّبْرِيزِيّ القول الأخير عن ابن الأَعْرابِيّ [@tabrizi-ashr، ص186]."
  - term: "لَمْ يَتَصَرَّمِ"
    text: "«معناه لم ينقطع. والصرم: القطيعة» [@ibn-al-anbari، ص314]."
syntax:
  - "«سَحًّا» مفعول مطلق، والعامل فيه «جَادَتْ» في البيت السابق: «معناه: جادت عليه كل بكر سحا وتسكابا» [@ibn-al-anbari، ص313]. قال التِّبْرِيزِيّ: «وسحًّا: منصوب على المصدر؛ لأن قوله (جادت عليه) يدل على سح؛ فصار مثل قول العرب: (هو يدعه تركا)» [@tabrizi-ashr، ص186]، أي مصدر من غير لفظ الفعل."
  - "«والسح منصوب على المصدر، والتسكاب نسق عليه، وكل عشية منصوبة على الوقت، والناصب لها يجري، والماء رفع بيجري» [@ibn-al-anbari، ص314]. وجملة «لَمْ يَتَصَرَّمِ» حال من «الْمَاءُ»."
morphology:
  - "«تَسْكَاب» مصدر على وزن «تَفْعال» بفتح التاء، قال ابن الأَنْبارِيّ: «وكل ما كان من المصادر على هذا المثال فهو مفتوح الأول، نحو التطواف، والتمشاء، والترداد، والتأكال، الا حرفا جاء نادرا وهو التبيان. وما كان على هذا المثال من الأسماء فهو مكسور، نحو التمساح» [@ibn-al-anbari، ص313]."
  - "«يَتَصَرَّم» مضارع «تَصَرَّمَ» على وزن «تَفَعَّلَ»، من الصَّرْم وهو القطع، ومنه صِرام النخل."
rhetoric:
  thesis: "مطر لا ينقطع. ويكرر الشاعر معنى الدوام بثلاثة ألفاظ، فيدوم الكلام كما يدوم الماء."
  devices:
    - title: "الترادف في «سَحًّا وَتَسْكَابًا»"
      text: "اللفظان بمعنى واحد، قال ابن الأَنْبارِيّ: «وإنما جمع بين التسكاب والسح وكلاهما واحد لاختلاف لفظهما. والعرب تفعل ذلك اتساعا وتوكيدا» [@ibn-al-anbari، ص313]. وهو كجمعه «أَقْوَى وَأَقْفَرَ» في البيت 5."
    - title: "الإطناب في معنى الدوام"
      text: "الإطناب: أداء المعنى بلفظ زائد عليه لفائدة. فالدوام في «سَحًّا وَتَسْكَابًا»، ثم في «فَكُلَّ عَشِيَّةٍ»، ثم في «لَمْ يَتَصَرَّمِ». والفائدة أن الروضة لا يصيبها جفاف، فهي أطيب ريحًا، والريح هي المقصود من الوصف كله."
  connection: "ثم يدخل الذباب هذه الروضة: «وَخَلَا الذُّبَابُ بِهَا فَلَيْسَ بِبَارِحٍ» [@ibn-al-anbari، ص314]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "سَحْحَنْ وَتَسْ / كَابَنْ فَكُلْ / لَ عَشِيْيَتِنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — يَجْرِي عَلَيْ / هَلْ مَاءُ لَمْ / يَتَصَرْرَمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار الأوليين من الشطرين، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]، فتساوى الشطران في الوزن. وتُقصر ألف «عَلَيْهَا» لالتقائها بلام «الْمَاءُ» الساكنة، فتُنطق «عَلَيْهَلْمَاءُ»."
context: "من أبيات الروضة (15–19): يتم وصف المطر الذي بدأه في البيت 16، ثم ينتقل إلى ساكن الروضة الوحيد: الذباب."
variants:
  - reading: "سَحًّا وَسَاحِيَةً فَكُلَّ عَشِيَّةٍ"
    status: "رواية يَعْقُوب"
    note: "«وقال يعقوب: ويروى: (سحا وساحية) ، فالساحية: التي تقشر وجه الأرض» [@ibn-al-anbari، ص314]، أي المطرة الشديدة تجرف وجه الأرض."
