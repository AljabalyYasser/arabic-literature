first: "هَلَّا سَأَلْتِ الْخَيْلَ يَا ابْنَةَ مَالِكٍ"
second: "إِنْ كُنْتِ جَاهِلَةً بِمَا لَمْ تَعْلَمِي"
meaning: "هلّا سألتِ الفرسان عني يا ابنة مالك، إن كنتِ لا تعرفين ما لم تشهديه من أمري. قال الزَّوْزَنِيّ: «يقول: هل سألت الفرسان عن حالي في قتالي إن كنت جاهلة بها؟» [@zawzani، ص257]."
vocabulary:
  - term: "هَلَّا"
    text: "حرف تحضيض وتوبيخ. قال الفرّاء: «هلا، ولولا، ولوما، إذا دخلت على ماض كانت توبيخا ولم يكن لها جواب» [@ibn-al-anbari، ص342]."
  - term: "الْخَيْلَ"
    text: "الفرسان. «وقوله (سألت الخيل) معناه ركاب الخيل» [@ibn-al-anbari، ص342]."
  - term: "ابْنَةَ مَالِكٍ"
    text: "صاحبته عَبْلَة التي نادى دارها في البيت الثاني، ينسبها هنا إلى أبيها مالك، وفي البيت 6 ينسبها إلى مَخْرَم."
context: "أول مقطع جديد (44–47): بعد أن روى قتلاه يطلب من عَبْلَة أن تسأل الفرسان، فهم الشهود على ما يقول. وفي نسخة من ديوان الأَعْلَم يزيد صاحب «منتهى الطلب» بعده بيتًا، بحسب حاشية المحقق [@diwan-antara، ص207]. والبيت عند الأَعْلَم 49 [@diwan-antara، ص207]، وعند الزَّوْزَنِيّ 43 [@zawzani، ص257]."
syntax:
  - "«هَلَّا» حرف تحضيض، دخل على الماضي «سَأَلْتِ» فصار توبيخًا لا جواب له [@ibn-al-anbari، ص342]. و«الْخَيْلَ» مفعول به، والمعنى: أصحاب الخيل، «فحذف الركاب وأقام الخيل مقامهم» [@ibn-al-anbari، ص343]."
  - "«والتاء اسم الكون، وجاهلة خبر الكون، وتعلمي صلة ما، والهاء المضمرة تعود على ما: والتقدير فيه: بما لم تعلميه، وعلامة الجزم في تعلمي سقوط النون» [@ibn-al-anbari، ص343]. وجواب الشرط «إِنْ كُنْتِ» محذوف دلّ عليه ما قبله."
  - "والباء في «بِمَا» بمعنى «عن» عند التِّبْرِيزِيّ: «وقوله (بما لم تعلمي) يريد عما لم تعلمي، والباء بمعنى عن» [@tabrizi-ashr، ص200]، ويوافقه الأَعْلَم: «والباء تأتي بعد السؤال بمعنى عن كثيرًا» [@diwan-antara، ص208]."
morphology:
  - "ابْنَة همزتها همزة وصل، فتسقط في النطق بعد «يَا»: يَبْنَةَ، وبها كتبها الزَّوْزَنِيّ «يَابْنَةَ» [@zawzani، ص257]."
  - "جَاهِلَة اسم فاعل مؤنث من جَهِلَ على وزن فاعِلة."
rhetoric:
  thesis: "يحتكم إلى الشهود: لا يطلب من عَبْلَة أن تصدقه، بل أن تسأل من رآه. فيصير الفخر شهادة الفرسان لا دعوى الشاعر."
  devices:
    - title: "المجاز بالحذف في «سَأَلْتِ الْخَيْلَ»"
      text: "سمّى الفرسان باسم خيلهم. ويحتج ابن الأَنْبارِيّ بقول العرب: «(يا خيل الله اركبي)، على معنى: يا أصحاب خيل الله اركبوا، فحذف الأصحاب وصرف الفعل إلى الخيل» [@ibn-al-anbari، ص343]."
    - title: "التقديم والتأخير"
      text: "يسأل التِّبْرِيزِيّ: ما فائدة قوله «إن كنت جاهلة بما لم تعلمي»؟ «وليس أحد إلا وهو يجهل ما لم يعلمه؟ فالجواب في هذا أن في البيت تقديما وتأخيرا، والمعنى هلا سألت الخيل بما لم تعلمي إن كنت جاهلة يا ابنة مالك» [@tabrizi-ashr، ص199–200]."
    - title: "النداء"
      text: "نادى «يَا ابْنَةَ مَالِكٍ» في وسط السؤال، فجعل الخطاب حاضرًا، وذكّرها بنسبها وهو يذكّرها بقدره [@ibn-al-anbari، ص342]."
  connection: "ثم يصف ما ستسمعه لو سألت: كان على ظهر فرسه لا يفارقه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "هَلْلَا سَأَلْ / تِلْ خَيْلَ يَبْ / نَةَ مَالِكِنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — إِنْ كُنْتِ جَا / هِلَتَنْ بِمَا / لَمْ تَعْلَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، والأولى والثالثة من العَجُز. وتسقط ألف يا في النطق لالتقائها بساكن همزة الوصل."
