first: "فَإِذَا شَرِبْتُ فَإِنَّنِي مُسْتَهْلِكٌ"
second: "مَالِي وَعِرْضِي وَافِرٌ لَمْ يُكْلَمِ"
meaning: "فإذا شربت أنفقت مالي حتى أفنيه، وشرفي تامّ لم يمسّه عيب. قال ابن الأَنْبارِيّ: «يقول: إذا شربت أنفقت مالي وأهلكته في السخاء» [@ibn-al-anbari، ص339]. وقال الزَّوْزَنِيّ: «يفتخر بأن سكره يحمله على محامد الأخلاق ويكفه عن المثالب» [@zawzani، ص256]."
vocabulary:
  - term: "مُسْتَهْلِكٌ"
    text: "مُفْنٍ. قال أبو جعفر: «معناه وهبت وأعطيت وأكلت وشربت» [@ibn-al-anbari، ص339]. وعند الأَعْلَم: «أي يهلكه بالعطاء» [@diwan-antara، ص206]."
  - term: "عِرْضِي"
    text: "«العرض موضع المدح والذم من الرجل» [@ibn-al-anbari، ص339]. وقال الأَعْلَم: «والعرض هنا الحسب» [@diwan-antara، ص206]."
  - term: "وَافِرٌ"
    text: "«التام. يقال وفر الشيء يفر وفورا ووفرا» [@ibn-al-anbari، ص339]."
  - term: "يُكْلَمِ"
    text: "يُجرح، «والكلم الجرح» [@diwan-antara، ص206]."
context: "هذا البيت والذي بعده عُرفا عند النقاد القدماء، وقارنوهما ببيت طَرَفَة «أَسَدُ غِيلٍ فَإِذَا مَا شَرِبُوا ... وَهَبُوا كُلَّ أَمُونٍ وَطِمِرّْ». يروي المَرْزُبانيّ عن المبرِّد: «قد عاب الناس قول طرفة»، «فقيل: إنما يهبون عند الآفة التي تدخل على عقولهم؛ وفضّلوا قول عنترة بن شداد العبسي» [@muwashshah، ص64]. وعند ابن قُتَيْبَة أن طَرَفَة «ذكر أنّهم يعطون إذا سكروا، ولم يشرط لهم ذلك فى صحوهم»، ثم أنشد بيتي عَنْتَرَة شاهدًا على من شرط ذلك [@ibn-qutayba، ج1 ص190–191]. وقال الزَّوْزَنِيّ: «وهذان البيتان قد حكم الرواة بتقدمهما في بابهما» [@zawzani، ص256]. والبيت عند الأَعْلَم 45 [@diwan-antara، ص206]، وعند الزَّوْزَنِيّ 39 [@zawzani، ص256]."
syntax:
  - "«والفاء الأولى تصل ما بعدها بما قبلها، والفاء الثانية جواب إذا، والنون والياء اسم إن، ومستهلك خبرها، ومالي منصوب بمستهلك» [@ibn-al-anbari، ص339]: فاسم الفاعل عمل عمل فعله."
  - "«وعرضي مرتفع بوافر، والواو التي في العرض واو الحال، كما تقول: أنا ضارب زيدا وعبد الله قاعد» [@ibn-al-anbari، ص339]: فجملة «وَعِرْضِي وَافِرٌ» حال، وجملة «لَمْ يُكْلَمِ» صفة أو حال ثانية."
morphology:
  - "مُسْتَهْلِك اسم فاعل من اسْتَهْلَكَ على وزن استفعل، والسين والتاء فيه للمبالغة في الإهلاك."
  - "يُكْلَم مضارع كَلَمَه إذا جرحه، مبني للمجهول، ومنه الكَلْم: الجرح."
rhetoric:
  thesis: "يفصل بين ماله وعرضه: الخمر تأخذ المال ولا تأخذ الشرف. فالسكر عنده يزيد الجود ولا يُنقص الخلق."
  devices:
    - title: "الاستعارة في «لَمْ يُكْلَمِ»"
      text: "جعل للعرض جسدًا يُجرح، و«ضرب الكلم مثلًا» [@diwan-antara، ص206]. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]: أعطى العرض، وهو معنى، ما يكون للبدن من الجراح."
    - title: "المقابلة بين المال والعرض"
      text: "المال «مُسْتَهْلَك» والعرض «وافر»: الأول ناقص والثاني تامّ. وأراد أبو جعفر هذا حين قال: «أحب أن يعلمها إنه سخي كريم في الحالين جميعا: في صحوه وسكره، وأن الخمر لا تحل منه شيئا كان ممنوعا» [@ibn-al-anbari، ص339]."
  connection: "ثم يكمل القسمة: وإذا صحا بقي على جوده."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَإِذَا شَرِبْ / تُ فَإِنْنَنِي / مُسْتَهْلِكُنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — مَالِي وَعِرْ / ضِي وَافِرُنْ / لَمْ يُكْلَمِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الثالثة من الصدر وتفعيلات العَجُز كلها."
