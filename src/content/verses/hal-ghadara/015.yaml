first: "أَوْ رَوْضَةً أُنُفًا تَضَمَّنَ نَبْتَهَا"
second: "غَيْثٌ قَلِيلُ الدِّمْنِ لَيْسَ بِمَعْلَمِ"
meaning: "أو كأن ريح فمها ريح روضة لم يرعها أحد، أنبتها مطر في موضع لا بَعَر فيه ولا يعرفه الناس. قال ابن الأَنْبارِيّ: «معناه: كأن ريحها المسك أو ريح روضة» [@ibn-al-anbari، ص311]. وقال الزَّوْزَنِيّ: «طيب نكهتها كطيب ريح فارة المسك أو كطيب ريح روضة ناضرة لم ترع، ولم يصبها سرجين ينقص طيب ريحها، ولا وطئتها الدواب فينقص نضرتها وطيب ريحها» [@zawzani، ص249]."
vocabulary:
  - term: "رَوْضَةً"
    text: "الأرض المنخفضة يجتمع فيها الماء «فيكثر نبته. ولا يقال في الشجر روضة. والروضة في النبت، والحديقة في الشجر» [@ibn-al-anbari، ص311]."
  - term: "أُنُفًا"
    text: "«معناه لم يرعها أحد فهو أطيب لريحها» [@ibn-al-anbari، ص311]. قال الزَّوْزَنِيّ: «روضة أُنُف: لم ترع بعد، وكأس أنف استؤنف الشرب بها» [@zawzani، ص249]."
  - term: "غَيْثٌ"
    text: "«والغيث هاهنا: المطر والماء» [@ibn-al-anbari، ص311]."
  - term: "قَلِيلُ الدِّمْنِ"
    text: "الدِّمْن: «السرجين والبعر. فأراد أن هذه الروضة في مكان حر الطين خال» [@ibn-al-anbari، ص311]، والسِّرْجين: الزِّبْل. وفسّره أبو جَعْفَر بقلة البقاء: «قليل اللبث لم يدمن عليها، والمعنى: أصابها مطر خفيف لم يكثر، فهو أحسن لها وأطيب لرائحتها» [@ibn-al-anbari، ص311]."
  - term: "لَيْسَ بِمَعْلَمِ"
    text: "«معناه ليس بمكان معروف، إنما هي فياف، فهو أطيب لرياضها» [@ibn-al-anbari، ص312]. وعند الأَعْلَم الشَّنْتَمَرِيّ: «أي ليس بمشهور موضعها فهو أحسن لنبتها وأتم له، وأبعد لها من أن توطأ وتدمن» [@diwan-antara، ص196]."
syntax:
  - "«رَوْضَةً» منصوبة بالعطف على «فَارَةَ» اسم «كأنّ» في البيت السابق: «والروضة منسوقة على قوله: وكأن فارة تاجر بقسيمة» [@ibn-al-anbari، ص312]. ويجيز التِّبْرِيزِيّ رفعها «على العطف على المضمر الذي في سبقت» [@tabrizi-ashr، ص185]."
  - "«وتضمن نبتها غيث كلام مستأنف، والغيث رفع بتضمن، والنبت منصوب به، وقليل الدمن نعت الغيث، واسم ليس مضمر فيها من ذكر الغيث، ويجوز أن يكون في ليس ذكر النبت» [@ibn-al-anbari، ص312]. أي أن الذي «لَيْسَ بِمَعْلَمِ» الغيثُ أو النبتُ."
morphology:
  - "«أُنُف» صفة على وزن «فُعُل»، من الاستئناف، «وأصله كله من الاستئناف والائتناف وهما بمعنى» [@zawzani، ص249]."
  - "«مَعْلَم» على وزن «مَفْعَل»: الموضع المعروف بعلامة، قال التِّبْرِيزِيّ: «والمعلم والعلم والعلامة واحد» [@tabrizi-ashr، ص185]."
rhetoric:
  thesis: "تشبيه ثانٍ بعد المسك: من طيب يُشترى إلى طيب لم تمسّه يد. وكل صفة في البيت تنفي عن الروضة شيئًا يفسدها."
  devices:
    - title: "تعدد المشبه به في «أَوْ رَوْضَةً»"
      text: "شبّه ريح فمها بشيئين: فأرة المسك، ثم الروضة، وعطف الثاني على الأول بـ«أو». وحذف المضاف، فالتقدير عند ابن الأَنْبارِيّ «أو ريح روضة» [@ibn-al-anbari، ص311]."
    - title: "الوصف بالنفي في «قَلِيلُ الدِّمْنِ لَيْسَ بِمَعْلَمِ»"
      text: "لا يقول ما في الروضة، بل ما ليس فيها: لم تُرعَ، ولا بَعَر فيها، ولا يعرف الناس موضعها. قال التِّبْرِيزِيّ: «والمعنى أن هذه الروضة ليست في موضع معروف فيقصدها الناس للرعي فيؤثروا فيها ويوسخوها» [@tabrizi-ashr، ص185]. فالطيب هنا هو الصفاء من كل أثر."
  connection: "ثم يصف المطر الذي سقاها: «جَادَتْ عَلَيْهِ كُلُّ بِكْرٍ ثَرَّةٍ» [@ibn-al-anbari، ص312]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَوْ رَوْضَتَنْ / أُنُفَنْ تَضَمْ / مَنَ نَبْتَهَا = مُتْفاعلن / متَفاعلن / متَفاعلن — غَيْثُنْ قَلِي / لُدْدِمْنِ لَيْ / سَ بِمَعْلَمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار أولى الصدر، والأوليين من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُدغم لام التعريف في الدال من «الدِّمْنِ» فتُنطق «لُدْدِمْنِ»."
context: "أول أبيات الروضة (15–19)، وقد بدأت تشبيهًا لريح فمها ثم صارت وصفًا قائمًا بنفسه. وفسّر الزَّوْزَنِيّ ذلك في آخرها: «لما شبه طيب نكهة هذه المرأة بطيب نسيم الروضة بالغ في وصف الروضة وأمعن في نعتها ليكون ريحها أطيب» [@zawzani، ص250]. وفي رواية الأَعْلَم بعده تشبيه ثالث بالخمر، بين قوسين: «أَوْ عَاتِقًا مِنْ أَذْرِعَاتَ مُعَتَّقًا ... مِمَّا تُعَتِّقُهُ مُلُوكُ الْأَعْجَمِ» [@diwan-antara، ص196]."
