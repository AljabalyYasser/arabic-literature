first: "فَتَرَكْتُهُ جَزَرَ السِّبَاعِ يَنُشْنَهُ"
second: "مَا بَيْنَ قُلَّةِ رَأْسِهِ وَالْمِعْصَمِ"
meaning: "فتركته طعامًا للسباع، تتناوله ما بين أعلى رأسه ومعصمه. قال الزَّوْزَنِيّ: «يقول: فصيرته طعمة للسباع كما يكون الجزر طعمة للناس» [@zawzani، ص259]."
vocabulary:
  - term: "جَزَرَ"
    text: "«جمع جزرة. والجزرة: الشاة والناقة تذبح وتنحر. فيقول: صار للسباع جزرة. ضربه مثلا» [@ibn-al-anbari، ص347]."
  - term: "يَنُشْنَهُ"
    text: "«أي يتناولنه بالأكل» [@ibn-al-anbari، ص347]. يقال: «نشت الشيء أنوشه نوشا، إذا تناولته» [@ibn-al-anbari، ص348]."
  - term: "قُلَّةِ رَأْسِهِ"
    text: "«أعلى رأسه، فكذلك قلة الجبل: أعلاه» [@ibn-al-anbari، ص348]."
  - term: "الْمِعْصَمِ"
    text: "«موضع السوار» [@ibn-al-anbari، ص348] من الذراع."
context: "آخر مشهد المدجّج (48–52): بدأ بخصم تكره الأبطال نزاله، وانتهى به لحمًا للسباع. ويستشهد البغدادي بالبيت على تعدّي «ترك» إلى مفعولين، ويرويه «غادرته جزر السباع» ثم يقول: «والمشهور في روايته: وتركته جزر السباع» [@khizana، ج9 ص165]. والبيت عند الأَعْلَم 57 [@diwan-antara، ص210]، وعند الزَّوْزَنِيّ 50 [@zawzani، ص259]."
syntax:
  - "«وجزر السباع نصب بتركته، وما في موضع نصب بينشنه، أي فيما بين» [@ibn-al-anbari، ص349]. و«تَرَكْتُهُ» هنا بمعنى صيّرته، فنصب مفعولين: «وترك في الأصل يتعدى إلى مفعول واحد لأنه بمعنى طرح وخلى ثم ضمن معنى صار» [@khizana، ج9 ص165]."
  - "وجملة «يَنُشْنَهُ» حال من الهاء في «تَرَكْتُهُ»، أو من «السِّبَاعِ» [@ibn-al-anbari، ص347]."
morphology:
  - "يَنُشْنَ مضارع ناشَ يَنُوشُ، اتصلت به نون النسوة فسكنت الشين وحُذفت الواو لالتقاء الساكنين. ومنه في القرآن ﴿وَأَنَّى لَهُمُ التَّنَاوُشُ مِنْ مَكَانٍ بَعِيدٍ﴾ [@ibn-al-anbari، ص348]."
  - "جَزَر جمع جَزَرة على وزن فَعَل، كشَجَرة وشَجَر."
rhetoric:
  thesis: "يختم القتال بمصير القتيل: لم يُدفن، بل تقاسمته السباع. وهي صورة يكررها في خاتمة القصيدة في أبي ابنَي ضَمْضَم (77)."
  devices:
    - title: "التشبيه البليغ في «جَزَرَ السِّبَاعِ»"
      text: "جعل القتيل جَزَرًا، أي ذبيحة، ولم يذكر أداة التشبيه، «ضربه مثلا» [@ibn-al-anbari، ص347]. وهذا عند عبد القاهر الجُرْجانيّ من الضرب الذي «تجري اسم المشبه به خبرًا على المشبَّه» [@dalail، ص68]، لأن المشبه، الضمير في تركته، مذكور."
    - title: "التحديد في «مَا بَيْنَ قُلَّةِ رَأْسِهِ وَالْمِعْصَمِ»"
      text: "ذكر طرفي الجسد ليدل على أن السباع لم تترك منه شيئًا. ويرى الأَعْلَم أن القافية حكمت اللفظ: «وكان الوجه أن يقول: ما بين قلة رأسه والقدم، فلم تمكنه القافية، ويحتمل أن يستعير المعصم لما فوق القدم من الساق لتقاربهما في الخلقة» [@diwan-antara، ص211]."
  connection: "ثم ينتقل إلى خصم آخر، يصف درعه وكرمه قبل أن يقتله."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَتَرَكْتُهُو / جَزَرَسْ سِبَا / عِ يَنُشْنَهُو = متَفاعلن / متَفاعلن / متَفاعلن — مَا بَيْنَ قُلْ / لَةِ رَأْسِهِي / وَلْ مِعْصَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى والثالثة من العَجُز. وتُشبع الهاء في تركته وينشنه ورأسه."
variants:
  - reading: "فَتَرَكْتُهُ جَزَرَ السِّبَاعِ يَعُدْنَهُ"
    status: "رواية يذكرها ابن الأَنْبارِيّ"
    note: "«أي يأتينه» [@ibn-al-anbari، ص348]."
  - reading: "يَقْضِمْنَ حُسْنَ بَنَانِهِ وَالْمِعْصَمِ"
    status: "عَجُز في متن الزَّوْزَنِيّ، ويذكره ابن الأَنْبارِيّ والتِّبْرِيزِيّ"
    note: "«فيقضمن معناه يأكلن» [@ibn-al-anbari، ص348]، و«القضم: الأكل بمقدم الأسنان» [@zawzani، ص259] [@tabrizi-ashr، ص203]."
  - reading: "غَادَرْتُهُ جَزَرَ السِّبَاعِ يَنُشْنَهُ"
    status: "رواية البغدادي في الشاهد"
    note: "[@khizana، ج9 ص165]."
