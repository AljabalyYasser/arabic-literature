first: "وَكَأَنَّمَا أَقِصُ الْإِكَامَ عَشِيَّةً"
second: "بِقَرِيبِ بَيْنِ الْمَنْسِمَيْنِ مُصَلَّمِ"
meaning: "وكأنني في آخر النهار أكسر التلال بظليم متقارب ظفري الخفّ، لا أذن له. قال ابن الأَنْبارِيّ: «أي كأنما أكسر الإكام بظليم قريب بين المنسمين» [@ibn-al-anbari، ص319]. وقال الزَّوْزَنِيّ: «شبهها في سرعة سيرها بعد سرى ليلة ووصل سير يوم به بسرعة سير الظليم» [@zawzani، ص252]. والظليم: ذكر النعام."
vocabulary:
  - term: "أَقِصُ"
    text: "«معناه أكسر» [@ibn-al-anbari، ص319]."
  - term: "عَشِيَّةً"
    text: "آخر النهار، وخصّه لأنه وقت التعب، قال الأَعْلَم الشَّنْتَمَرِيّ: «وقال عشية لأنه وقت إعيائها وفتورها» [@diwan-antara، ص200]."
  - term: "بِقَرِيبِ بَيْنِ الْمَنْسِمَيْنِ"
    text: "«ومنسماه: ظفراه المقدمان في خفه» [@ibn-al-anbari، ص319]، فإذا تباعد ما بينهما «قيل منسم أفرق» [@ibn-al-anbari، ص320]، وهو هنا «ليس بأفرق» [@ibn-al-anbari، ص319]. قال أبو جَعْفَر: «إنما قال بقريب بين المنسمين لأنه إذا كان كذلك كان أصلب لخفه» [@ibn-al-anbari، ص320]."
  - term: "مُصَلَّمِ"
    text: "«والصلم: قطع كل شيء من أصله. والظليم مصلم، لأنه ليست له إذن ظاهرة» [@ibn-al-anbari، ص319]. وعند الزَّوْزَنِيّ: «والصلم الاستئصال، كأن أذنه استؤصلت» [@zawzani، ص252]."
syntax:
  - "«وكأنما حرف واحد، والإكام منصوبة بأقص، وعشية منصوب على الوقت، والباء صلة أقص» [@ibn-al-anbari، ص320]. أي أن «كأنّما» كافة لا عمل لها، و«عَشِيَّةً» ظرف زمان."
  - "و«بِقَرِيبِ» صفة لموصوف محذوف هو الظليم، و«بَيْنِ» اسم مجرور بالإضافة بمعنى المسافة، و«مُصَلَّمِ» صفة ثانية. وأنكر النَّحّاس قراءتها ظرفًا «بَيْنَ» على معنى «ما بين»، فقال: «وهذا القول خطأ؛ لأنه إذا أضمر (ما) وهي بمعنى الذي حذف الموصول وجاء بالصلة» [@tabrizi-ashr، ص190]."
morphology:
  - "«أَقِصُ» مضارع «وَقَصَ»، حُذفت فاؤه الواو كما في «وَعَدَ يَعِدُ»."
  - "«الْمَنْسِمَيْن» مثنى «مَنْسِم» على وزن «مَفْعِل»، و«مُصَلَّم» اسم مفعول من «صَلَّمَ» على «فَعَّلَ»."
rhetoric:
  thesis: "في آخر النهار، حين تتعب الإبل، ما زالت ناقته كأنها ظليم. ويقول «أَقِصُ» بلسانه هو، كأن الراكب والناقة شيء واحد."
  devices:
    - title: "التشبيه في «وَكَأَنَّمَا أَقِصُ ... بِقَرِيبِ»"
      text: "شبّه نفسه على الناقة برجل يركب ظليمًا، فالتشبيه بالظليم في السرعة والصلابة، قال الأَعْلَم: «شبه ناقته بالظليم لسرعتها ولأنه لا يحفى» [@diwan-antara، ص200]، أي لا يرقّ خفّه من السير."
    - title: "حذف الموصوف"
      text: "لم يقل «بظليم»، بل ذكر صفتين لا تكونان إلا له: تقارب ظفري الخف، وقطع الأذن. فيعرف السامع الظليم من صفاته، وهذا أبلغ من تسميته."
    - title: "الإسناد إلى الراكب في «أَقِصُ»"
      text: "الناقة هي التي تكسر التلال بخفّها، لكنه نسب الكسر إلى نفسه. وهذه قراءتنا: كأن قوة الناقة صارت قوته، وهو تمهيد لانتقال القصيدة من الناقة إلى الفخر بالنفس."
  connection: "ثم يصف هذا الظليم وصغار النعام حوله: «تَأْوِي لَهُ قُلُصُ النَّعَامِ كَمَا أَوَتْ» [@ibn-al-anbari، ص320]. قال الزَّوْزَنِيّ: «ولما شبهها في سرعة السير بالظليم أخذ في وصفه» [@zawzani، ص252]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَكَأَنْنَمَا / أَقِصُلْ إِكَا / مَ عَشِيْيَتَنْ = متَفاعلن / متَفاعلن / متَفاعلن — بِقَرِيبِ بَيْ / نِلْمَنْسِمَيْ / نِ مُصَلْلَمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار الثانية من العجز وحدها، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتسقط همزة الوصل في «الْإِكَامَ»، فتُنطق «أَقِصُلْإِكَامَ»."
context: "من أبيات الناقة والظليم (22–27): هنا يبدأ التشبيه بالظليم، ويستمر وصفه إلى البيت 27، ثم يعود إلى الناقة في البيت 28."
variants:
  - reading: "وَكَأَنَّمَا أَقْرُو الْحُزُونَ عَشِيَّةً"
    status: "رواية الأَصْمَعِيّ"
    note: "«وروى الأصمعي: (وكأنما أقرو الحزون) ، أي أتبع شيئا بعد شيء» [@ibn-al-anbari، ص320]، والحُزُون: ما غلظ من الأرض."
  - reading: "وَكَأَنَّمَا تَطِسُ الْإِكَامَ عَشِيَّةً"
    status: "رواية الزَّوْزَنِيّ"
    note: "يرويه الزَّوْزَنِيّ بإسناد الكسر إلى الناقة، ويشرحه: «كأنما تكسر الإكام لشدة وطئها عشية» [@zawzani، ص252]."
