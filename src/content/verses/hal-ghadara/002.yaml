first: "يَا دَارَ عَبْلَةَ بِالْجِوَاءِ تَكَلَّمِي"
second: "وَعِمِي صَبَاحًا دَارَ عَبْلَةَ وَاسْلَمِي"
meaning: "ينادي دار صاحبته بالجِواء أن تتكلم فتخبره عن أهلها، ثم يدع السؤال إلى التحية. قال الزَّوْزَنِيّ: «يا دار حبيبتي بهذا الموضع تكلمي وأخبريني عن أهلك ما فعلوا، ثم أضرب عن استخباره إلى تحيتها فقال: طاب عيشك في صباحك وسلمت يا دار حبيبتي» [@zawzani، ص245]."
vocabulary:
  - term: "عَبْلَةَ"
    text: "اسم صاحبته، قال الزَّوْزَنِيّ: «عبلة: اسم عشيقته» [@zawzani، ص245]. وتسميها القصيدة أيضًا «ابنة مَخْرَم» (البيت 6) و«ابنة مالك» (البيت 44)."
  - term: "الْجِوَاءِ"
    text: "قال التِّبْرِيزِيّ: «الجواء: بلد يسميه أهل نجد جواء عدنة، والجواء أيضا: جمع جو، وهو البطن من الأرض الواسع في انخفاض» [@tabrizi-ashr، ص177]. وعند الأَعْلَم: «هو جمع جو وهو المطمئن من الأرض المتسع، ويقال: هو موضع بعينه» [@diwan-antara، ص184]."
  - term: "تَكَلَّمِي"
    text: "«معناه اخبري عن أهلك وسكانك» [@ibn-al-anbari، ص296]."
  - term: "عِمِي صَبَاحًا"
    text: "تحية، قال ابن الأَنْبارِيّ: «أراد: انعمي واسلمي في الصباح من الآفات» [@ibn-al-anbari، ص296]. وقال الأَعْلَم: «يريد انعمي وهي تحية أهل الجاهلية» [@diwan-antara، ص184]."
  - term: "اسْلَمِي"
    text: "«دعاء لها بالسلامة من الدروس» [@diwan-antara، ص184]، أي من أن تمّحي آثارها."
syntax:
  - "«دَارَ عَبْلَةَ» منادى منصوب لأنه مضاف، و«عَبْلَةَ» مجرورة بالإضافة وعلامة جرّها الفتحة، قال ابن الأَنْبارِيّ: «ونصبت لأنها لا تجرى للتعريف والتأنيث» [@ibn-al-anbari، ص297]، أي لا تُصرف لأنها علم مؤنث."
  - "و«بِالْجِوَاءِ» متعلق بالدار، وجاز ذلك وهي مضافة إلى معرفة «لأن تأويلها يا دارا لعبلة بالجواء» [@ibn-al-anbari، ص297]."
  - "«عِمِي» فعل أمر، «عمى جزم على الأمر، علامة الجزم فيه سقوط النون والصباح منصوب على الوقت» [@ibn-al-anbari، ص297]، أي على الظرفية. و«دَارَ عَبْلَةَ» الثانية منادى حُذف منه حرف النداء."
morphology:
  - "في أصل «عِمِي» خلاف قديم. روى ابن الأَنْبارِيّ: «وقال أبو عمرو بن العلاء: عمى، من قولهم: عمت السماء تعمى. وهذا عندنا خطأ»، لأنه لو كان كذلك لكان الأمر «اعمي»، «وقالوا: الصحيح عندنا أن يكون عمى من وعمت تعم، على مثال وعدت تعد» [@ibn-al-anbari، ص297]. فهو من «وَعَمَ يَعِمُ»، حُذفت واوه كما تُحذف من «وَعَدَ يَعِدُ»، فبقي الأمر «عِمْ»، وللمؤنث «عِمِي»."
  - "وفي لسان العرب أن أبا عَمْرو بن العلاء سُئل عن البيت «فَقَالَ: هُوَ كَمَا يَعْمِي المطرُ ويَعْمي البحرُ بزَبَدِه»، وأن الأَزْهَرِيّ ردّه: «وَالَّذِي سَمِعْنَاهُ وحَفِظْناه فِي تَفْسِيرِ عِمْ صَباحاً أَن مَعْنَاهُ انْعِمْ صَباحاً» [@lisan، ج12 ص641]. وقال الفَرّاء: «عم وأنعم واحد» [@tabrizi-ashr، ص178]."
  - "«تَكَلَّمِي» أمر للمؤنث من «تَكَلَّمَ» على وزن «تَفَعَّلَ»."
rhetoric:
  thesis: "يخاطب الدار كما يخاطب الإنسان: يطلب منها الكلام، ثم يحيّيها ويدعو لها. وفي ذلك أنها عنده أهلها، فلا يفصل بين المكان ومن سكنه."
  devices:
    - title: "خطاب الدار في «تَكَلَّمِي»"
      text: "طلب الكلام من دار لا تتكلم، فجعلها كالإنسان. وهذا من سنن الشعراء في الوقوف على الديار، ويستشهد له ابن الأَنْبارِيّ بقول جرير: «يا دارُ لا تستعجمي يا دار ... وأخبرِي ما فعل الأحرارُ» [@ibn-al-anbari، ص296]. وعبد القاهر الجُرْجانيّ يجعل من الاستعارة ضربًا تُعطى فيه الأشياء ما ليس لها، كقول لَبِيد «إذْ أَصْبَحتْ بيدِ الشَّمال زِمامُها» [@dalail، ص67]: فهنا يُعطي الدار لسانًا ولا يذكره."
    - title: "الانتقال من السؤال إلى التحية"
      text: "سألها فلم تجب، فانتقل إلى التحية والدعاء «وَعِمِي صَبَاحًا ... وَاسْلَمِي». ويقول الأَعْلَم إن «عمي صباحا» «تحية أهل الجاهلية» [@diwan-antara، ص184]. ويروي التِّبْرِيزِيّ أن أبا ذَرّ حيّا بها النبي صلى الله عليه وسلم فقال له: «(إن الله قد أبْدَلَنِي منها ما هو خير منها)» ثم قال: «السلام» [@tabrizi-ashr، ص178]."
    - title: "تكرار «دَارَ عَبْلَةَ»"
      text: "ذكر «دَارَ عَبْلَةَ» في الصدر والعجز، وكان يكفيه الضمير. فالاسم يتردد على لسانه كما يتردد النداء على لسان من لا يُجاب. وهذه قراءتنا للتكرار."
  connection: "ثم يخبر أنه حبس ناقته في الدار: «فَوَقَفْتُ فِيهَا نَاقَتِي وَكَأَنَّهَا» [@ibn-al-anbari، ص297]. وفي رواية الأَعْلَم بينهما بيت: «دَارٌ لِآنِسَةٍ غَضِيضٍ طَرْفُهَا» [@diwan-antara، ص184]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يَا دَارَ عَبْ / لَةَ بِلْجِوَا / ءِ تَكَلْلَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن — وَعِمِي صَبَا / حَنْ دَارَ عَبْ / لَةَ وَسْلَمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار الأولى من الصدر والثانية من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]، فصارت «متَفاعلن» «مُتْفاعلن». وتسقط همزة الوصل في «بِالْجِوَاءِ» و«وَاسْلَمِي» في النطق. والبيت مصرَّع كالمطلع، والتصريع «ما كانت عروض البيت فيه تابعة لضربه» [@ibn-rashiq، ج1 ص173]، فاتفقت «تَكَلَّمِي» و«وَاسْلَمِي» في القافية."
context: "أول ذكر لعَبْلة في القصيدة، وهو عند من ردّ البيت الأول أول القصيدة: «وأول القصيدة عندهما يا دار عبلة» [@aghani-dk، ج9 ص222]، أي عند الأَصْمَعِيّ وابن الأَعْرابِيّ. وبه يذكر ابن سَلّام القصيدة: «يا دار عبلة بالجواء تكلمى» [@ibn-sallam، ج1 ص152]. وهو في رواية الأَعْلَم البيت الرابع [@diwan-antara، ص183]."
