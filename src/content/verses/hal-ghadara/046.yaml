first: "طَوْرًا يُجَرَّدُ لِلطِّعَانِ وَتَارَةً"
second: "يَأْوِي إِلَى حَصِدِ الْقِسِيِّ عَرَمْرَمِ"
meaning: "مرة يُفرد فرسي للطعان فيتقدم، ومرة يرجع إلى جيش كثير ملتفّ القسيّ. قال الأَعْلَم: «يقول: مرة يطاعن على هذا الفرس ومرة يأوي إلى جيش كثير ملتف ذي قسي كثيرة، يصف أن لهم منعة وعزة» [@diwan-antara، ص208]."
vocabulary:
  - term: "طَوْرًا"
    text: "«معناه مرة؛ وجمعه أطوار. وقال قوم: الطور: الحال» [@ibn-al-anbari، ص343]."
  - term: "يُجَرَّدُ"
    text: "«معناه يبرز له ويجد فيه؛ وهو مأخوذ من قولك: تجرد فلان لذلك الأمر، أي جد فيه وبرز له» [@ibn-al-anbari، ص344]. وقال أبو جعفر: «والتجريد: الا يكون مع الخيل راجل. يقال: خرجوا في خيل جريدة، أي ليس فيها راجل» [@ibn-al-anbari، ص344]."
  - term: "حَصِدِ"
    text: "الكثيف الملتف. «معناه إلى جيش كثير القسي. يقال غيضة حصدة وحصداء، إذا كانت كثيرة النبت ملتفة الشجر» [@ibn-al-anbari، ص344]."
  - term: "الْقِسِيِّ"
    text: "جمع قَوْس."
  - term: "عَرَمْرَمِ"
    text: "«معناه شديد» [@ibn-al-anbari، ص344]، «وقال أبو عبيدة: العرمرم: الكثير» [@ibn-al-anbari، ص344]. ويقول الأَعْلَم: «واشتقاقه من العرامة» [@diwan-antara، ص209]، والعَرامة: الشراسة."
context: "يتم وصف الفرس في البيت السابق: حاله في القتال بين التقدم والرجوع. وأبو جعفر يجعل البيت وصفًا لحال القوم كلهم: «معناه إذا أغير علينا جردنا الخيل للطعان، ونغزو إذا غزونا في جيش، فلسنا نخلو من أحد هذين» [@ibn-al-anbari، ص344]. والبيت عند الأَعْلَم 51 [@diwan-antara، ص208]، وعند الزَّوْزَنِيّ 45 [@zawzani، ص258]."
syntax:
  - "«ونصب طورا بيجرد، واسم ما لم يسم فاعله مضمر في يجرد، واللام صلة يجرد، وتارة منصوب بيأوى، والى صلة يأوى، وعرمرم نعت لحصد القسي» [@ibn-al-anbari، ص344]: أي «طَوْرًا» و«تَارَةً» ظرفان، ونائب الفاعل ضمير الفرس."
  - "و«حَصِدِ الْقِسِيِّ» صفة لموصوف محذوف، أي جيش حصد القسي، كما فسّره ابن الأَنْبارِيّ «إلى جيش كثير القسي» [@ibn-al-anbari، ص344]."
morphology:
  - "يُجَرَّد مضارع جَرَّدَ على وزن فَعَّل، مبني للمجهول."
  - "عَرَمْرَم على وزن فَعَلْعَل، بتكرير العين واللام، وهو بناء يدل على الكثرة والشدة."
  - "القِسِيّ جمع قَوْس، وأصله قُوُوس، ثم قُلبت الكلمة فصارت قُسُوّ، ثم أُعلّت إلى قِسِيّ."
rhetoric:
  thesis: "يرسم حياة الحرب في حركتين: خروج إلى الطعان، ورجوع إلى جيش منيع. فلا يُعرف في حال ثالثة."
  devices:
    - title: "التقسيم في «طَوْرًا... وَتَارَةً»"
      text: "التقسيم أن يذكر المتكلم أقسام الشيء فيستوفيها. فقسم حال فرسه قسمين لا ثالث لهما، وهذا ما قاله أبو جعفر: «فلسنا نخلو من أحد هذين» [@ibn-al-anbari، ص344]."
    - title: "الاستعارة في «حَصِدِ الْقِسِيِّ»"
      text: "الحَصِد صفة الشجر الملتف، فاستعارها للجيش الكثير القسيّ؛ ويقول الأَعْلَم: «وضرب الحصد مثلًا»، «وإنما أراد كثرة القسي والتفافها» [@diwan-antara، ص209]. وهي استعارة على حدّ عبد القاهر الجُرْجانيّ: «وتجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]."
  connection: "ثم يأتي بما يخبر به الشهود: يغشى الحرب ويعفّ عن الغنيمة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "طَوْرَنْ يُجَرْ / رَدُ لِطْطِعَا / نِ وَتَارَتَنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — يَأْوِي إِلَى / حَصِدِلْ قِسِيْ / يِ عَرَمْرَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من كل شطر."
