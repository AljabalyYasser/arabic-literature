  - reading: "كَمَشْتُ بِالرُّمْحِ الطَّوِيلِ ثِيَابَهُ"
    status: "رواية الأَعْلَم"
    note: "قال: «كمشت بالرمح أي رفعت ثيابه لما طعنته، ووصف الرمح بالطول ليخبر عن كمال خلقه وفضل قوته» [@diwan-antara، ص210]."
  - reading: "فَشَكَكْتُ بِالرُّمْحِ الطَّوِيلِ ثِيَابَهُ"
    status: "في شاهد ابن الأَنْبارِيّ في شرح امرئ القيس، وعند البغدادي"
    note: "[@ibn-al-anbari، ص46] [@khizana، ج9 ص165]."
  - reading: "فَشَكَكْتُ بِالرُّمْحِ الطَّوِيلِ إِهَابَهُ"
    status: "رواية يذكرها التِّبْرِيزِيّ"
    note: "[@tabrizi-ashr، ص203]. والإهاب: الجلد."
