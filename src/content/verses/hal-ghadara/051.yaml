first: "فَشَكَكْتُ بِالرُّمْحِ الْأَصَمِّ ثِيَابَهُ"
second: "لَيْسَ الْكَرِيمُ عَلَى الْقَنَا بِمُحَرَّمِ"
meaning: "فانتظمتُ برمحي الصلب ثيابه، أي نفذ الرمح فيه، والكريم لا يحميه كرمه من الرماح. قال الزَّوْزَنِيّ: «يقول: فانتظمت برمحي الصلب ثيابه، أي طعنته طعنة أنفذت الرمح في جسمه وثيابه كلها» [@zawzani، ص259]."
vocabulary:
  - term: "شَكَكْتُ"
    text: "«معناه انتظمت. يقال: شككته أشكه شَكَّا، إذا انتظمته» [@ibn-al-anbari، ص347]. وفي اللسان: «وشككته بالرمح إذا خزقته وانتظمته» [@lisan، ج10 ص452]."
  - term: "الْأَصَمِّ"
    text: "الصلب [@zawzani، ص259]."
  - term: "ثِيَابَهُ"
    text: "قلبه. «وقال الطوسي: قوله ثيابه، معناه قلبه. قال الله عز وجل: (وثيابَكَ فطَهِّرْ). أراد: وقلبك فطهر» [@ibn-al-anbari، ص347]."
  - term: "الْقَنَا"
    text: "الرماح، جمع قناة."
context: "ثالث أبيات المدجّج (48–52)، وهو أشهرها. وقد احتج به ابن الأَنْبارِيّ نفسه في شرح معلقة امرئ القَيْس على أن الثياب كناية عن القلب، فأنشده هناك «فَشَكَكْتُ بِالرُّمْحِ الطَّوِيلِ ثِيَابَهُ»، وقال: «أراد: فشككت بالرمح قلبه» [@ibn-al-anbari، ص46]، أما في متن المعلقة عنده فهو «الأصم» [@ibn-al-anbari، ص347]. وبـ«الأصم» يرويه الزَّوْزَنِيّ [@zawzani، ص259] والتِّبْرِيزِيّ [@tabrizi-ashr، ص202]، ويستشهد به اللسان [@lisan، ج10 ص452]. وهو عند الأَعْلَم 56 [@diwan-antara، ص210]، وعند الزَّوْزَنِيّ 49 لأنه لا يروي البيت 50 [@zawzani، ص259]."
syntax:
  - "«والباء صلة شككت، والثياب منصوبة بشككت، والكريم اسم ليس، وبمحرم خبر ليس» [@ibn-al-anbari، ص347]: والباء في «بِمُحَرَّمِ» زائدة لتوكيد النفي، و«عَلَى الْقَنَا» متعلق بـ«مُحَرَّم»."
  - "والفاء في «فَشَكَكْتُ» عاطفة تفيد التعقيب: الطعنة في البيت 49، ثم نفاذ الرمح [@ibn-al-anbari، ص347]."
morphology:
  - "شَكَكْتُ فعل مضعّف فُكّ إدغامه لاتصاله بضمير الرفع المتحرك. «ويقال: شاكٌّ في السلاح وشاكٍ في السِّلاح، إذا كان سلاحُه ذا شوكه. وأصل شاكٍ شائك فقُلب» [@ibn-al-anbari، ص347]."
  - "مُحَرَّم اسم مفعول من حَرَّمَ على وزن فَعَّل."
rhetoric:
  thesis: "يرفع خصمه وهو يقتله: سمّاه «الكريم»، وجعل موته بالرمح موت الكرام. فالبيت فخر بالقاتل والمقتول معًا."
  devices:
    - title: "الكناية في «ثِيَابَهُ»"
      text: "الثياب عند الطُّوسيّ والأصمعي كناية عن القلب [@ibn-al-anbari، ص347]، وفي حاشية المحقق على ديوان الأَعْلَم أن نسخة «ف» تنقل: «وقال الأصمعي في تفسيره: الثياب هنا القلب» [@diwan-antara، ص210]. والكناية عند عبد القاهر الجُرْجانيّ أن يترك المتكلم اللفظ الموضوع للمعنى «ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. وعند يعقوب البيت على ظاهره: «طعنته طعنة شمرت ثيابه وضمتها إلى صدره» [@ibn-al-anbari، ص347]."
    - title: "التذييل في «لَيْسَ الْكَرِيمُ عَلَى الْقَنَا بِمُحَرَّمِ»"
      text: "التذييل أن يُتبع المعنى بجملة عامة تؤكده وتجري مجرى المثل. وفي معناها قولان: «معناه لم يمنعه من أن يقتل بالقناة كرمه» [@ibn-al-anbari، ص347]، وقال أبو جعفر: «معناه ليس بمحرم على القتل، أي منيته القتل ليس يموت على فراشه» [@ibn-al-anbari، ص347]. ويجمعهما الزَّوْزَنِيّ: «يريد أن الرماح مولعة بالكرام لحرصهم على الإقدام، وقيل: بل معناه أن كرمه لا يخلصه من القتل المقدر له» [@zawzani، ص259]."
  connection: "ثم يصف ما صار إليه القتيل: لحمًا للسباع."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَشَكَكْتُ بِرْ / رُمْحِلْ أَصَمْ / مِ ثِيَابَهُو = متَفاعلن / مُتْفاعلن / متَفاعلن — لَيْسَلْ كَرِي / مُ عَلَلْ قَنَا / بِمُحَرْرَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الثانية من الصدر، والأولى من العَجُز."
