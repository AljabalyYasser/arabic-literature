first: "فِيهَا اثْنَتَانِ وَأَرْبَعُونَ حَلُوبَةً"
second: "سُودًا كَخَافِيَةِ الْغُرَابِ الْأَسْحَمِ"
meaning: "في إبل أهلها اثنتان وأربعون ناقة حلوبًا، سود كريش جناح الغراب الأسود. قال الأَعْلَم الشَّنْتَمَرِيّ: «وإنما ذكر أن في إبلهم هذا العدد من الحلوبة السود ليخبر عن كثرتهم وكثرة إبلهم، لأنه إذا شرط أن فيها هذا العدد من هذا الصنف على غرابته وقلته، فغيره من أصناف الإبل أكثر من أن يحصى عدده» [@diwan-antara، ص194]."
vocabulary:
  - term: "حَلُوبَةً"
    text: "الناقة التي تُحلب، قال الأَعْلَم: «ويقال ناقة حلوبة (وإبل حلوبة) للتي تحلب» [@diwan-antara، ص194]. وفي لسان العرب: «والحَلوبُ والحَلوبةُ سواءٌ؛ وَقِيلَ: الحلوبُ الاسمُ، والحَلُوبةُ الصِّفَةُ؛ وَقِيلَ: الْوَاحِدَةُ وَالْجَمَاعَةُ» [@lisan، ج1 ص328]."
  - term: "سُودًا"
    text: "اختار السود للحلب، قال ابن الأَنْبارِيّ: «ما كان للحلب فالسواد فيه أبهى وأملأ للفناء. وهم يستحبون الحمر والصهب للركوب» [@ibn-al-anbari، ص306]."
  - term: "خَافِيَةِ الْغُرَابِ"
    text: "«والخوافي: الريش دون الريشات العشر من مقدم الجناح» [@ibn-al-anbari، ص306]. وعند الأَعْلَم: «وهي أواخر الريش من الجناح مما يلي الظهر، سميت بذلك لخفائها» [@diwan-antara، ص194]."
  - term: "الْأَسْحَمِ"
    text: "«والأسحم: الأسود» [@ibn-al-anbari، ص306]."
syntax:
  - "«اثْنَتَانِ» مبتدأ مؤخر وخبره «فِيهَا»، أو هو عند الكوفيين مرفوع بالظرف: «والاثنتان يرتفعان بفيها، والأربعون نسقٌ عليهما» [@ibn-al-anbari، ص306]. و«حَلُوبَةً» تمييز للعدد."
  - "وفي «سُودًا» خلاف: هو عند ابن الأَنْبارِيّ «نعت للحلوبة»، وأجاز ذلك وهي مفردة «لأن سُوداً في تقطيع الواحد، وهو على مثال قُفل وبُرد وخُرج» [@ibn-al-anbari، ص306]، أي أن لفظه لفظ المفرد. ويخالفه الأَعْلَم: «سودا حال من قوله: اثنتان وأربعون، وهو حال من نكرة ويجوز رفعه على النعت ولا يكون نعتا للحلوبة لأنها مفردة» [@diwan-antara، ص194]. ويجعله التِّبْرِيزِيّ نعتًا للحلوبة «لأنها في موضع الجماعة» [@tabrizi-ashr، ص183]."
  - "«كَخَافِيَةِ» الكاف «في موضع نصب على النعت لحلوبة» [@ibn-al-anbari، ص306]، أي: سودًا مثلَ خافية الغراب."
morphology:
  - "«حَلُوبَة» على وزن «فَعُولَة» بمعنى مفعولة، قال الزَّوْزَنِيّ: «وفعول إذا كان بمعنى المفعول جاز أن تلحقه تاء التأنيث عندهم» [@zawzani، ص248]."
  - "«اثْنَتَانِ» مؤنث «اثنان»، «ويقال اثنتان وثنتان» [@ibn-al-anbari، ص305]. و«سُود» جمع «أَسْوَد» و«سَوْداء» على وزن «فُعْل»."
rhetoric:
  thesis: "عدد دقيق ولون حاد: اثنتان وأربعون، سود كجناح الغراب. والعدد الدقيق يجعل الصورة كأنها شهادة عيان."
  devices:
    - title: "التشبيه في «كَخَافِيَةِ الْغُرَابِ»"
      text: "شبّه سواد النوق بسواد ريش الغراب، وخصّ الخوافي، قال الأَعْلَم: «وإنما خص الخوافي لأنها أسبط وأشد بريقا وألين» [@diwan-antara، ص194]. وهو تشبيه في اللون، يجعله عبد القاهر الجُرْجانيّ من الضرب البيّن الذي لا يحتاج إلى تأوّل: «وكالتشبيه من جهة اللّون، كتشبيه الخدود بالورد» [@asrar، ص90]."
    - title: "الكناية عن الغنى"
      text: "لم يقل إن قومها أغنياء، بل عدّ الحلوب السود. قال الزَّوْزَنِيّ: «ذكر سوادها دون سائر الألوان لأنها أنفس الإبل وأعزها عندهم، وصف رهط عشيقته بالغنى والتموّل» [@zawzani، ص248]."
  connection: "ثم يرجع إلى عَبْلة نفسها: «إِذْ تَسْتَبِيكَ بِذِي غُرُوبٍ وَاضِحٍ»، و«إذ» عند ابن الأَنْبارِيّ متعلقة بـ«راعني» [@ibn-al-anbari، ص308]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فِيهَثْ نَتَا / نِ وَأَرْبَعُو / نَ حَلُوبَتَنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — سُودَنْ كَخَا / فِيَةِلْ غُرَا / بِلْأَسْحَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار أولى الصدر، والأولى والثالثة من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتسقط همزة الوصل في «اثْنَتَانِ»، فتلتقي ألف «فِيهَا» بالثاء الساكنة فتُقصر: «فِيهَثْ نَتَا»."
context: "ثاني بيتي الظعائن: يصف الحمولة التي راعته في البيت 11. وبه يختم مشهد الرحيل ويعود إلى صاحبته."
variants:
  - reading: "فِيهَا اثْنَتَانِ وَأَرْبَعُونَ خَلِيَّةً"
    status: "رواية يَعْقُوب"
    note: "«وقال يعقوب: يروى (خلية)» [@ibn-al-anbari، ص305]. والخَلِيّة عنده ناقة تُعطف مع غيرها على ولد واحد فتدرّ عليه، ثم يتخلى بها الراعي لنفسه، يحلبها هو وأهل البيت [@ibn-al-anbari، ص305]."
  - reading: "سُودٌ كَخَافِيَةِ الْغُرَابِ الْأَسْحَمِ"
    status: "رواية أخرى"
    note: "بالرفع، «ويروى (سود) على أن يكون نعتا لقوله (اثنتان وأربعون)» [@tabrizi-ashr، ص183]. ويجيزه ابن الأَنْبارِيّ في العربية على النعت للعدد [@ibn-al-anbari، ص306]."
