first: "أَبْقَى لَهَا طُولُ السِّفَارِ مُقَرْمَدًا"
second: "سَنَدًا وَمِثْلَ دَعَائِمِ الْمُتَخَيَّمِ"
meaning: "ترك لها طول السفر سنامًا مرتفعًا متماسكًا كأنه بناء من آجرّ، وقوائم كأعمدة الخيمة. قال ابن الأَنْبارِيّ: «فيقول: أبقى طول السفر لها بعد أن سوفر عليها سناما طويلا» [@ibn-al-anbari، ص329]. وقال الأَعْلَم الشَّنْتَمَرِيّ: «يقول: أبقى منها طول السفر وجهده مثل البنيان المحكم لشدة خلقها» [@diwan-antara، ص203]."
vocabulary:
  - term: "طُولُ السِّفَارِ"
    text: "طول المسافرة عليها. والسِّفار مصدر «سافَرَ»."
  - term: "مُقَرْمَدًا"
    text: "سنامًا متماسكًا، «وأصل المقرمد المبني بالآجر»، وقال أبو جَعْفَر: «المقرمد: الأملس المطلي» [@ibn-al-anbari، ص329]. وعند الأَعْلَم: «المقرمد المبني بالقرمد وهو الجص الذي عمل بالقراميد وهو الآجر» [@diwan-antara، ص203]، والآجُرّ: الطين المطبوخ يُبنى به."
  - term: "سَنَدًا"
    text: "«أراد عاليا. ويقال: ناقة سناد، إذا كانت مشرفة» [@ibn-al-anbari، ص329]."
  - term: "دَعَائِمِ الْمُتَخَيَّمِ"
    text: "«وقوله (ومثل دعائم) معناه أن قوائمها قوية صلاب طويلة بعد الجهد والسفر. و (المتخيم) : الشيء الذي يتخذ خيمة» [@ibn-al-anbari، ص330]. وعند الأَعْلَم: «والمتخيم الذي نصب خيمة. والدعائم خشب الخيمة» [@diwan-antara، ص203]."
syntax:
  - "«طُولُ» فاعل «أَبْقَى»، «ولها صلة أبقى، ومقرمداً منصوب بأبقى، وسنداً من نعت المقرمد، ومثل نسق على المقرمد، وهي مضافة إلى الدعائم» [@ibn-al-anbari، ص330]. أي أن «مُقَرْمَدًا» مفعول به لموصوف محذوف هو السنام، و«مِثْلَ» معطوف عليه، والتقدير: أبقى سنامًا مقرمدًا وقوائمَ مثلَ دعائم المتخيَّم."
morphology:
  - "«مُقَرْمَد» اسم مفعول من الرباعي «قَرْمَدَ»، أي بُني بالقَرْمَد."
  - "«السِّفَار» مصدر «سافَرَ» على وزن «فِعال». و«الْمُتَخَيَّم» على وزن «مُتَفَعَّل» من «تَخَيَّمَ»، قال التِّبْرِيزِيّ: «والمتخيم: صاحب الخيمة، والمُتَخَيَّم - بفتح الياء -: الذي يُتخذ خيمة» [@tabrizi-ashr، ص193]."
rhetoric:
  thesis: "السفر يُضمر الإبل عادة، وهذه الناقة أبقى منها السفر سنامًا كالبناء وقوائم كالأعمدة. فالبيت يقلب المتوقع."
  devices:
    - title: "الاستعارة في «مُقَرْمَدًا»"
      text: "وصف السنام بلفظ البناء: المقرمد في أصله بناء بالآجر، فجعل السنام بنيانًا محكمًا لا يتهدم. ولم يذكر السنام، بل ذكر صفته المستعارة، فيفهم السامع الموصوف من الصفة."
    - title: "التشبيه في «وَمِثْلَ دَعَائِمِ الْمُتَخَيَّمِ»"
      text: "شبّه القوائم بأعمدة الخيمة في الطول والصلابة، وهو تشبيه في الهيئة يُرى بالعين."
    - title: "المفارقة في «أَبْقَى ... طُولُ السِّفَارِ»"
      text: "جعل طول السفر فاعلًا للإبقاء، وهو في العادة فاعل للإفناء. ويذكر يَعْقُوب أن هذا «ضد قول الراعي»، والراعي يقول إنه أطعم ذروة ناقته للسفر [@ibn-al-anbari، ص329]، أي أن السفر أكل سنامها."
  connection: "ثم يصفها باركة عند الماء: «بَرَكَتْ عَلَى مَاءِ الرِّدَاعِ كَأَنَّمَا» [@ibn-al-anbari، ص330]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَبْقَى لَهَا / طُولُسْ سِفَا / رِ مُقَرْمَدَنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — سَنَدَنْ وَمِثْ / لَ دَعَائِمِلْ / مُتَخَيْيَمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار الأوليين من الصدر، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]، وجاء العجز تامًّا. وتُدغم لام التعريف في السين من «السِّفَارِ»."
context: "من أبيات الناقة بعد الشرب (28–34). وفي رواية هذا البيت خلاف قديم ينقله ابن الأَنْبارِيّ: «قال الرستمي: لم يرو هذا البيت أحد إلا الأصمعي. وقال أبو جعفر: لم يرو هذا البيت الأصمعي ولا غيره» [@ibn-al-anbari، ص328]. وهو في رواية الأَعْلَم [@diwan-antara، ص203] وعند التِّبْرِيزِيّ [@tabrizi-ashr، ص193] وفي الجمهرة [@jamhara، ص359]، وليس عند الزَّوْزَنِيّ. فقول أبي جَعْفَر إن أحدًا لم يروه يخالفه وجوده في هذه الشروح، ونبقيه في النص على رواية ابن الأَنْبارِيّ."
variants:
  - reading: "أَبْقَى لَهَا طُولُ السِّفَارِ مُمَرَّدًا"
    status: "رواية أخرى"
    note: "«ويروى: (طول السفار ممردا) ، أي سناما طويلا. يقال لكل شيء طويل مشرف: ممرد» [@ibn-al-anbari، ص329]."
