first: "ذُلُلٌ رِكَابِي حَيْثُ شِئْتُ مُشَايِعِي"
second: "لُبِّي وَأَحْفِزُهُ بِأَمْرٍ مُبْرَمِ"
meaning: "إبلي مطيعة تذهب بي حيث شئت، وعقلي معي لا يفارقني، أدفعه برأي محكم. قال الزَّوْزَنِيّ: «يقول: تذلّ إبلي لي حيث وجهتها من البلاد ويعاونني على أفعالي عقلي، وأمضي ما يقتضيه عقلي بأمر محكم» [@zawzani، ص264]."
vocabulary:
  - term: "ذُلُلٌ"
    text: "جمع ذَلول، و«الذلول من الإبل وغيرها: الذي هو ضد الصعب؛ والجمع ذلل» [@ibn-al-anbari، ص362]."
  - term: "رِكَابِي"
    text: "«و (الركاب): الإبل» [@ibn-al-anbari، ص362]."
  - term: "مُشَايِعِي"
    text: "معيني ومصاحبي. «وقوله (مشايعي لبي). يقول: عقلي لا يعزب عني» [@ibn-al-anbari، ص362]. وعند الزَّوْزَنِيّ: «المشايعة: المعاونة، أخذت من الشياع وهو دقائق الحطب لمعاونته النار على الإيقاد في الحطب الجزل» [@zawzani، ص264]."
  - term: "أَحْفِزُهُ"
    text: "«معناه أدفعه وأقويه» [@ibn-al-anbari، ص363]."
  - term: "مُبْرَمِ"
    text: "محكم. «أي برأي ليس بمتنقض وضعيف. واصله من الفتل المبرم، وهو أن تفتل الطاقتين حتى تصيروا طاقة واحدة» [@ibn-al-anbari، ص363]."
context: "آخر مقطع الكرّة (67–74)، وآخر بيت في فخره بنفسه قبل ذكر ابنَي ضَمْضَم. وهو عند الأَعْلَم 79 بلفظ «ذُلُلٌ جِمَالِي» [@diwan-antara، ص219]، وعند الزَّوْزَنِيّ 72 [@zawzani، ص264]، وعند التِّبْرِيزِيّ في موضعه [@tabrizi-ashr، ص214]. وبعده عند الأَعْلَم البيتان 78–79، ثم بيت زائد، ثم 75–77 [@diwan-antara، ص220–221]."
syntax:
  - "«وركابي مرتفعة بذلل، وذلل بها، ولبى رفع بمشايعي. واحفزه فعل مستأنف، والباء صلة أحفزه» [@ibn-al-anbari، ص363]: أي «ذُلُلٌ» خبر مقدم و«رِكَابِي» مبتدأ مؤخر، و«لُبِّي» فاعل لاسم الفاعل «مُشَايِعِي»."
  - "ويجيز التِّبْرِيزِيّ وجوهًا: «و (ركابي) في موضع رفع بالابتداء يُنوى به التقديم، وذُلُل خبره، وإن شئت كان ذلل رفعا بالابتداء، وركابي خبره» [@tabrizi-ashr، ص214]."
  - "والضمير في «أَحْفِزُهُ» يعود على اللبّ. وقال أبو جعفر: «أراد وأحفز الأمر المبرم بعقلي، أي أنفذ الأمر المبرم بعقلي» [@ibn-al-anbari، ص363]."
morphology:
  - "ذُلُل جمع ذَلُول على وزن فُعُل، كصَبُور وصُبُر."
  - "مُبْرَم اسم مفعول من أَبْرَمَ الرباعي، ومُشَايِع اسم فاعل من شايَعَ على وزن فاعَل."
rhetoric:
  thesis: "يختم فخره بالحرية: يرحل حيث يشاء، ويقرر بعقله. فبعد أن كان عبدًا يُدعى إلى الكرّ، صار هو من يوجّه إبله ورأيه."
  devices:
    - title: "الاستعارة في «مُشَايِعِي لُبِّي»"
      text: "جعل العقل رفيقًا يشايعه، أي يتبعه ويعينه، وأصل المشايعة عند الزَّوْزَنِيّ من الحطب الدقيق يعين النار [@zawzani، ص264]. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "الاستعارة في «بِأَمْرٍ مُبْرَمِ»"
      text: "الإبرام فتل الحبل، فاستعاره للرأي المحكم: «واصله من الفتل المبرم» [@ibn-al-anbari، ص363]."
    - title: "الكناية في «ذُلُلٌ رِكَابِي»"
      text: "ذلّ الإبل كناية عن كثرة الأسفار: «يقول: هي معتادة للرحيل قد فارقت الافها وأوطانها مرة بعد مرة، فاللفظ للركاب والمعنى له، أي لا أبالي فراق من تعرض لفراقي» [@ibn-al-anbari، ص362]."
  connection: "ثم يذكر خصمين لم ينلهما بعد: ابنا ضَمْضَم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "ذُلُلُنْ رِكَا / بِي حَيْثُ شِئْ / تُ مُشَايِعِي = متَفاعلن / مُتْفاعلن / متَفاعلن — لُبْبِي وَأَحْ / فِزُهُو بِأَمْ / رِنْ مُبْرَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الوسطى من الصدر، والأولى والثالثة من العَجُز."
