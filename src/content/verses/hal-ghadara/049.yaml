first: "جَادَتْ يَدَايَ لَهُ بِعَاجِلِ طَعْنَةٍ"
second: "بِمُثَقَّفٍ صَدْقِ الْكُعُوبِ مُقَوَّمِ"
meaning: "عاجلته يداي بطعنة سريعة، برمح مقوَّم صلب الكعوب. قال الزَّوْزَنِيّ: «يقول: جادت يدي له بطعنة عاجلة برمح مُقَوَّم صلب الكعوب» [@zawzani، ص258]. وقال أبو جعفر: «معناه سبقته بالطعن، كنت أحذق به منه» [@ibn-al-anbari، ص346]."
vocabulary:
  - term: "مُثَقَّفٍ"
    text: "«المصلح المقوم» [@ibn-al-anbari، ص346]، يعني الرمح. وعند الأَعْلَم: «المثقف الرمح المقوم بالثقاف» [@diwan-antara، ص210]، والثِّقاف: أداة تُقوَّم بها الرماح."
  - term: "صَدْقِ"
    text: "«الصلب» [@ibn-al-anbari، ص346]."
  - term: "الْكُعُوبِ"
    text: "«عقد الأنابيب» [@ibn-al-anbari، ص346]، «وما بين كل أنبوبتين كعب» [@tabrizi-ashr، ص202]."
  - term: "مُقَوَّمِ"
    text: "«الذي قد قُوِّمَ وسُوِّىَ» [@tabrizi-ashr، ص202]."
context: "جواب رُبّ في البيت السابق، وثاني أبيات المدجّج (48–52). وفي متن ابن الأَنْبارِيّ يقارب صدرُه صدرَ البيت 43 «سَبَقَتْ يَدَايَ لَهُ بِعَاجِلِ طَعْنَةٍ» [@ibn-al-anbari، ص342]، والزَّوْزَنِيّ يرويه «جادت له كفي» [@zawzani، ص258]، فلا يتكرر اللفظ عنده. وبعد هذا البيت يروي الأصمعي وحده البيت 50. والبيت عند الأَعْلَم 54 [@diwan-antara، ص210]، وعند الزَّوْزَنِيّ 48 [@zawzani، ص258]."
syntax:
  - "«ويداي رفع بجادت، والباء صلة جادت، والعاجل خفض بالباء، والباء الثانية صلة عاجل، ومثقف خفض بالباء: وصدق الكعوب نعته: ومقوم نعت لصدق الكعوب» [@ibn-al-anbari، ص346]."
  - "«قوله: بعاجل طعنة، قدم الصفة على الموصوف ثم أضافها إليه، تقديره: بطعنة عاجلة» [@zawzani، ص258]. و«صَدْقِ الْكُعُوبِ» إضافة الصفة إلى فاعلها في المعنى، أي صلبة كعوبه [@ibn-al-anbari، ص346]."
morphology:
  - "مُثَقَّف ومُقَوَّم اسما مفعول على وزن مُفَعَّل، من ثَقَّفَ وقَوَّمَ، والتضعيف فيهما للتكثير والإتقان."
  - "الكُعُوب جمع كَعْب على وزن فُعُول."
rhetoric:
  thesis: "الطعنة هنا جود: يداه تجودان على خصمه بالطعن كما يجود الكريم بالمال. فالفارس يعطي في الحرب كما يعطي في السلم."
  devices:
    - title: "الاستعارة في «جَادَتْ يَدَايَ»"
      text: "الجود عطاء، فاستعاره للطعن، وهي استعارة في الفعل؛ وعبد القاهر الجُرْجانيّ يقول: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]. وفي الاستعارة سخرية خفية: يجود على خصمه بما يكره."
    - title: "حذف الموصوف في «بِمُثَقَّفٍ»"
      text: "لم يذكر الرمح، وذكر صفاته الثلاث: مثقّف، صلب الكعوب، مقوّم. فالصفات تغني عن الاسم وتمدح السلاح قبل أن تسمّيه [@ibn-al-anbari، ص346]."
  connection: "ثم يصف الطعنة: واسعة، يسيل دمها فيهدي صوته الذئاب ليلًا."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "جَادَتْ يَدَا / يَ لَهُو بِعَا / جِلِ طَعْنَتِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — بِمُثَقْقَفِنْ / صَدْقِلْ كُعُو / بِ مُقَوْوَمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من الصدر، والثانية من العَجُز."
