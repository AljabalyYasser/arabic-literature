first: "وَالْخَيْلُ تَقْتَحِمُ الْخَبَارَ عَوَابِسًا"
second: "مِنْ بَيْنِ شَيْظَمَةٍ وَأَجْرَدَ شَيْظَمِ"
meaning: "والخيل تندفع في الأرض اللينة الصعبة عابسة من الجهد، بين فرس طويلة وحصان قصير الشعر طويل. قال الزَّوْزَنِيّ: «يقول: والخيل تسير وتجري في الأرض اللينة»، «وقد عبست وجوهها لما نالها من الإعياء» [@zawzani، ص264]."
vocabulary:
  - term: "تَقْتَحِمُ"
    text: "«الاقتحام: الدخول في الشيء بسرعة» [@ibn-al-anbari، ص362]."
  - term: "الْخَبَارَ"
    text: "«الارض اللينة ذات الجحرة والجرفة، والركض يشتد فيها» [@ibn-al-anbari، ص362]. وعند الأَعْلَم: «والخبار ما لان من الأرض وكانت فيه حجارة، وذلك من أشد ما يكون على الخيل» [@diwan-antara، ص218]."
  - term: "عَوَابِسًا"
    text: "«الكوالح من الجهد» [@ibn-al-anbari، ص362]."
  - term: "شَيْظَمَةٍ"
    text: "الطويلة. «و (الشيظم): الطويل» [@ibn-al-anbari، ص362]."
  - term: "أَجْرَدَ"
    text: "«القصير الشعرة» [@ibn-al-anbari، ص362]. ويقول الأَعْلَم: «والأجرد القليل الشعر الأملس، وبذلك توصف العتاق وطول الشعر في الخيل هجنة» [@diwan-antara، ص219]. والعِتاق: كرائم الخيل."
context: "صورة عامة للخيل في الكرّة (67–74)، بعد صورة فرسه وحده. وعند الأَعْلَم 77 [@diwan-antara، ص218]، وعند الزَّوْزَنِيّ 71 [@zawzani، ص264]، ويأتي بعده عند الأَعْلَم والتِّبْرِيزِيّ البيت 70 «ولقد شفى نفسي» [@tabrizi-ashr، ص213]."
syntax:
  - "«والخيل ترتفع بما عاد من تقتحم، وعوابسا نصب على الحال، ومن معناها التفسير» [@ibn-al-anbari، ص362]: فالواو للحال أو للاستئناف، و«مِنْ بَيْنِ» بيان للخيل."
  - "«والاجرد موضعه خفض بالنسق على شيظمة، الا إنه نصب لأنه لا يجري. والشيظم نعت الاجرد» [@ibn-al-anbari، ص362]: أي مُنع من الصرف فجُرّ بالفتحة."
morphology:
  - "عَوَابِس جمع عابِس على وزن فَوَاعِل، وصُرف هنا للضرورة فنُوّن."
  - "أَجْرَد صفة على وزن أَفْعَل، مؤنثه جَرْداء، ولذلك مُنع من الصرف."
rhetoric:
  thesis: "يوسّع العدسة: بعد الفرس الجريح، الخيل كلها تشق الأرض الصعبة. فالحرب جهد يظهر على وجوه الخيل نفسها."
  devices:
    - title: "التشخيص في «عَوَابِسًا»"
      text: "العبوس من صفات الوجوه الإنسانية، فجعله للخيل، و«العوابس الكوالح الوجوه لما ذاقت من شدة» الحرب عند الأَعْلَم [@diwan-antara، ص218]."
    - title: "الاستيعاب في «مِنْ بَيْنِ شَيْظَمَةٍ وَأَجْرَدَ شَيْظَمِ»"
      text: "ذكر الأنثى والذكر ليشمل الخيل كلها، ويقول الزَّوْزَنِيّ: «وهي لا تخلو من فرس طويل أو طويلة، أي كلها طويلة» [@zawzani، ص264]."
  connection: "ثم يختم المقطع بنفسه: إبله ذليلة حيث يشاء، وعقله صاحبه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَلْخَيْلُ تَقْ / تَحِمُلْ خَبَا / رَ عَوَابِسَنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — مِنْ بَيْنِ شَيْ / ظَمَتِنْ وَأَجْ / رَدَ شَيْظَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من كل شطر."
variants:
  - reading: "مَا بَيْنَ شَيْظَمَةٍ وَأَجْرَدَ شَيْظَمِ"
    status: "رواية الأَعْلَم"
    note: "وفي حاشية المحقق أن نسخة «ع» أثبتت «من» وفوقها «ما» [@diwan-antara، ص218]."
