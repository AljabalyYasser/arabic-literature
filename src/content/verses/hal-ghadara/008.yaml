first: "وَلَقَدْ نَزَلْتِ فَلَا تَظُنِّي غَيْرَهُ"
second: "مِنِّي بِمَنْزِلَةِ الْمُحَبِّ الْمُكْرَمِ"
meaning: "يقول لها: لقد نزلتِ من قلبي منزلة المحبوب المكرَّم، فلا تظني غير ذلك. قال الزَّوْزَنِيّ: «وقد نزلت من قلبي منزلة من يحب ويكرم فتيقّني هذا واعلميه قطعًا ولا تظني غيره» [@zawzani، ص247]."
vocabulary:
  - term: "نَزَلْتِ ... بِمَنْزِلَةِ"
    text: "حللتِ مني محلَّ. وعند الأَعْلَم الشَّنْتَمَرِيّ: «أنت عندي بمنزلة المحب المكرم فلا تظني غير ذلك» [@diwan-antara، ص188]."
  - term: "غَيْرَهُ"
    text: "«معناه غير ذلك، أي غير نزولك في قلبي» [@ibn-al-anbari، ص301]."
  - term: "الْمُحَبِّ"
    text: "المحبوب، «يقال رجل محب ومحبوب» [@ibn-al-anbari، ص301]. قال التِّبْرِيزِيّ: «والمُحب جاء على أحب وأحببت، والكثير في كلام العرب محبوب» [@tabrizi-ashr، ص181]."
syntax:
  - "«واللام في لقد لام اليمين، وتظني مجزوم بلا على النهى، علامة الجزم فيه سقوط النون، وغيره منصوب بالظن، وهو كاف من الاسم والخبر، ومن والباء صلتان لنزلت» [@ibn-al-anbari، ص302]. أي أن «ظنّ» يأخذ مفعولين، وكفى هنا «غَيْرَهُ» عنهما، و«مِنِّي» و«بِمَنْزِلَةِ» متعلقان بـ«نَزَلْتِ»."
  - "وجملة «فَلَا تَظُنِّي غَيْرَهُ» معترضة بين الفعل «نَزَلْتِ» وما يتعلق به. وفي تعلق الباء وجه آخر عند التِّبْرِيزِيّ: «الباء في قوله (بمنزلة) متعلقة بمصدر محذوف؛ لأنه لما قال (نزلت) دل على النزول» [@tabrizi-ashr، ص181]."
morphology:
  - "«الْمُحَبّ» اسم مفعول من «أَحَبَّ» على القياس. قال ابن الأَنْبارِيّ: «فمن قال محب أخرجه على القياس وقال: هو مبنى على أحب يحب فهو محب. ومن قال محبوب بناه على لغة الذين يقولون حببت الرجل أحبه» [@ibn-al-anbari، ص301]، ثم قال: «وقال البصريون: لا يقال حببت الرجل» [@ibn-al-anbari، ص302]. وقال الأَعْلَم: «وأجرى المحب على أصله من أحببت، والمستعمل في الكلام محبوب» [@diwan-antara، ص188]."
  - "«تَظُنِّي» أصله «تَظُنِّينَ»، حُذفت النون لدخول «لا» الناهية."
rhetoric:
  thesis: "بعد مفارقة الحب والقتال يطمئنها: الحرب لا تغيّر مكانها من قلبه."
  devices:
    - title: "التوكيد في «وَلَقَدْ»"
      text: "اللام لام القسم، و«قد» مع الماضي للتحقيق، فاجتمع على الخبر مؤكدان. وهو يحتاج إليهما لأن البيت السابق قد يوهمها أن حبه ليس حبًّا."
    - title: "الاعتراض في «فَلَا تَظُنِّي غَيْرَهُ»"
      text: "الاعتراض: جملة تدخل بين أجزاء الكلام لغرض. فقطع الكلام قبل تمامه ليردّ ظنها قبل أن يتم الخبر، ثم أكمل «مِنِّي بِمَنْزِلَةِ الْمُحَبِّ»."
    - title: "الجناس في «نَزَلْتِ» و«بِمَنْزِلَةِ»"
      text: "كلمتان من أصل واحد، فالنزول الحقيقي في المكان صار نزولًا في القلب. والجناس: اتفاق كلمتين في الأصل أو الحروف مع اختلاف المعنى أو الصيغة."
  connection: "ثم يعود إلى البعد الذي يحول بينهما: «كَيْفَ الْمَزَارُ وَقَدْ تَرَبَّعَ أَهْلُهَا» [@ibn-al-anbari، ص302]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَلَقَدْ نَزَلْ / تِ فَلَا تَظُنْ / نِي غَيْرَهُو = متَفاعلن / متَفاعلن / مُتْفاعلن — مِنْنِي بِمَنْ / زِلَةِلْ مُحَبْ / بِلْمُكْرَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار آخر الصدر، والأولى والثالثة من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُشبع ضمة الهاء في «غَيْرَهُ» فتُنطق «غَيْرَهُو»، وتُدغم نون «تَظُنِّي» المشددة فتُكتب في التقطيع نونين."
context: "يجيب عن المفارقة التي في البيت 7: يقاتل قومها، لكنها عنده بمنزلة المحبوب. وهو خطاب مباشر لها بعد أن تحدث عنها غائبة."
