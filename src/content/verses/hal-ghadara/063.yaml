first: "نُبِّئْتُ عَمْرًا غَيْرَ شَاكِرِ نِعْمَتِي"
second: "وَالْكُفْرُ مَخْبَثَةٌ لِنَفْسِ الْمُنْعِمِ"
meaning: "أُخبرت أن عمرًا لا يشكر نعمتي عليه، وكفران النعمة يُفسد نفس من أنعم. قال ابن الأَنْبارِيّ: «فيقول: إذا كفره خبث ذلك نفس المنعم الذي له عليه نعمة» [@ibn-al-anbari، ص355]. وقال الزَّوْزَنِيّ: «وكفران النعمة ينفّر نفسَ المنعم عن الإنعام» [@zawzani، ص262]."
vocabulary:
  - term: "نُبِّئْتُ"
    text: "أُخبرت، و«التنبئة والتنبيء: مثل الإنباء» [@zawzani، ص262]."
  - term: "الْكُفْرُ"
    text: "كفران النعمة وجحدها."
  - term: "مَخْبَثَةٌ"
    text: "ما يُخبث النفس ويفسدها. «ويقال: طعام مطيبة للنفس، ومخبثة لها؛ وشراب مبولة» [@ibn-al-anbari، ص355]."
  - term: "الْمُنْعِمِ"
    text: "صاحب النعمة. «قوله: (لنفس المنعم): عليه» [@ibn-al-anbari، ص355]، أي المنعم عليه بالشكر."
context: "أول مقطع عمرو ووصاة العم (63–66). ولا يسمّي الشراح عمرًا هذا: لم نجد عند ابن الأَنْبارِيّ والزَّوْزَنِيّ والتِّبْرِيزِيّ والأَعْلَم من يعيّنه [@ibn-al-anbari، ص355]. والانتقال إليه من الغزل مفاجئ، وهو انتقال يكثر في القصيدة الجاهلية. والبيت عند الأَعْلَم 68 [@diwan-antara، ص214]، وعند الزَّوْزَنِيّ 61 [@zawzani، ص262]."
syntax:
  - "«وعمرا اسم نبئت، وغير شاكر خبر نبئت، والكفر رفع بمخبثة، والنفس خفض باللام وهي مضافة إلى المنعم» [@ibn-al-anbari، ص355]."
  - "ويعدّ الزَّوْزَنِيّ «نُبِّئْتُ» من الأفعال التي تنصب ثلاثة مفاعيل: «فالتاء في نبئت هو المفعول الأول قد أقيم مقام الفاعل وأسند الفعل إليه، وعمرًا هو المفعول الثاني، وغير هو المفعول الثالث» [@zawzani، ص262]."
morphology:
  - "نُبِّئْتُ ماضٍ مبني للمجهول من نَبَّأَ على وزن فَعَّل. «وإنما تعددت الخمسة التي هي غير أعلمت وأريت إلى ثلاثة مفاعيل لتضمنها معنى أعلمت» [@zawzani، ص262]."
  - "مَخْبَثَة على وزن مَفْعَلة، وهو بناء يدل على السبب الذي يكثر منه الشيء، كمَطْيَبة ومَبْوَلة [@ibn-al-anbari، ص355]."
rhetoric:
  thesis: "يجمع الخبر والحكمة: خبر عن رجل جحد نعمته، ثم حكم عام على كل جحود. فيتسع البيت من حادثة خاصة إلى قاعدة."
  devices:
    - title: "التذييل في «وَالْكُفْرُ مَخْبَثَةٌ لِنَفْسِ الْمُنْعِمِ»"
      text: "أتبع الخبر بجملة عامة تجري مجرى المثل، فصار عتابه لعمرو حكمًا على الناس. وفي معناها قولان عند الأَعْلَم: «من أنعمت عليه نعمة فلم ينشرها ولا شكرها، فإن ذلك مخبثة لنفس المنعم عليه، ويروى المنعم بفتح العين أي من كفر النعمة فذلك مخبثة لنفسه» [@diwan-antara، ص215]."
    - title: "بناء الفعل للمجهول في «نُبِّئْتُ»"
      text: "لم يذكر من أخبره، فبقي الخبر بلا راوٍ معيّن، وانصرف الاهتمام إلى عمرو وجحوده [@ibn-al-anbari، ص355]."
  connection: "ثم يذكّر بما صنعه يوم حفظ وصية عمّه في شدة الحرب، وكأن ذلك هو النعمة التي جُحدت."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "نُبْبِئْتُ عَمْ / رَنْ غَيْرَ شَا / كِرِ نِعْمَتِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن — وَلْكُفْرُ مَخْ / بَثَتُنْ لِنَفْ / سِلْ مُنْعِمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، والأولى والثالثة من العَجُز."
