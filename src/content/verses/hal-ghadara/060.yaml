first: "فَبَعَثْتُ جَارِيَتِي فَقُلْتُ لَهَا اذْهَبِي"
second: "فَتَحَسَّسِي أَخْبَارَهَا لِي وَاعْلَمِي"
meaning: "فأرسلت جاريتي وقلت لها: اذهبي فتعرّفي أخبارها من أجلي، واعرفي حقيقتها. قال الزَّوْزَنِيّ: «يقول: فبعثت جاريتي لتتعرف أحوالها لي» [@zawzani، ص261]."
vocabulary:
  - term: "جَارِيَتِي"
    text: "أَمَتي."
  - term: "فَتَحَسَّسِي"
    text: "تطلّبي الخبر وتعرّفيه. وعند الأَعْلَم: «أي نقي عنها واعلمي حقيقتها، ويروى فتجسسي بالجيم وهو في معناه» [@diwan-antara، ص214]."
context: "ينتقل الغزل في هذا المقطع (59–62) من التمني إلى القصة: رسول، وخبر، وصورة. وهو بيت خبري لا يتوقف عنده الشراح إلا في الإعراب. والبيت عند الأَعْلَم 65 [@diwan-antara، ص213]، وعند الزَّوْزَنِيّ 58 [@zawzani، ص261]."
syntax:
  - "«الفاء تصل ما بعدها بما قبلها، وقلت نسق على بعثت، والجارية نصب ببعثت، وعلامة الجزم في اذهبي سقوط النون، وكذلك تحسسي واعلمي، والأخبار نصب بالتحسس» [@ibn-al-anbari، ص354]. والكوفيون يسمّون فعل الأمر مجزومًا، والبصريون يجعلونه مبنيًّا على حذف النون."
  - "و«لِي» متعلق بـ«تَحَسَّسِي»، أي من أجلي. ويذكر التِّبْرِيزِيّ في يائها وجهين: «الياء في قوله (لي) تسكن وتفتح» [@tabrizi-ashr، ص207]."
morphology:
  - "تَحَسَّسِي أمر من تَحَسَّسَ على وزن تفعّل، وفيه معنى التكلف والتدرج في طلب الخبر."
  - "اذْهَبِي أوله همزة وصل، تسقط في الدرج فتُنطق لَهَذْهَبِي."
rhetoric:
  thesis: "بيت كله حركة: بعث، وقول، وأمر بالذهاب، وأمر بالتحسس، وأمر بالعلم. فتتابع الأفعال يدل على لهفة المرسِل."
  devices:
    - title: "تتابع الأوامر"
      text: "ثلاثة أوامر متصلة بالفاء والواو: اذهبي، فتحسسي، واعلمي [@ibn-al-anbari، ص354]. والأمر الأخير يطلب اليقين بعد الخبر، فالشاعر لا يكتفي بأن يُخبر، بل يريد أن تتحقق الجارية."
    - title: "الإيجاز في القصة"
      text: "لم يذكر من هي المرأة ولا أين هي، فقد كفاه الضمير في أخبارها بعد البيت 59. وهذا الإيجاز يترك السامع يتبع الجارية إلى حيث ذهبت."
  connection: "ثم يأتي جواب الجارية: الأعداء غافلون، والصيد ممكن."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَبَعَثْتُ جَا / رِيَتِي فَقُلْ / تُ لَهَذْ هَبِي = متَفاعلن / متَفاعلن / متَفاعلن — فَتَحَسْسَسِي / أَخْبَارَهَا / لِي وَعْلَمِي = متَفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأخيرتين من العَجُز."
variants:
  - reading: "فَتَجَسَّسِي أَخْبَارَهَا لِي وَاعْلَمِي"
    status: "متن الزَّوْزَنِيّ والتِّبْرِيزِيّ، وفي نسخ من ديوان الأَعْلَم"
    note: "[@zawzani، ص261] [@tabrizi-ashr، ص207]. وفي حاشية المحقق أن في نسخ «ب، س، أ» من الديوان «فتجسسي وهي رواية ثانية» [@diwan-antara، ص213]."
