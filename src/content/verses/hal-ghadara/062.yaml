first: "وَكَأَنَّهَا الْتَفَتَتْ بِجِيدِ جَدَايَةٍ"
second: "رَشَإٍ مِنَ الْغِزْلَانِ حُرٍّ أَرْثَمِ"
meaning: "وكأنها حين التفتت التفتت بعنق ظبي صغير، كريم، على أنفه بياض. قال ابن الأَنْبارِيّ: «يقول: فكأن جيدها الذي التفتت به جيد جداية، وهي من الظباء بمنزلة الجدي من الغنم أتت عليه خمسة أشهر أو ستة» [@ibn-al-anbari، ص355]."
vocabulary:
  - term: "جِيدِ"
    text: "«العنق، وجمعه أجياد» [@ibn-al-anbari، ص355]."
  - term: "جَدَايَةٍ"
    text: "ولد الظبية، «الْجِداية والْجَداية: ولد الظبية، الجمع الجدايا» [@zawzani، ص261]. وعند الأَعْلَم: «والجداية تقع على الذكر والأنثى» [@diwan-antara، ص214]."
  - term: "رَشَإٍ"
    text: "«الرشأ: الذي قوي من أولاد الظباء» [@zawzani، ص261]."
  - term: "حُرٍّ"
    text: "«الحسن العتيق» [@ibn-al-anbari، ص355]. وعند الزَّوْزَنِيّ: «الْحُرُّ من كل شيء: خالصه وجيِّده» [@zawzani، ص261]."
  - term: "أَرْثَمِ"
    text: "«الذي على أنفه بياض» [@ibn-al-anbari، ص355]. وعند التِّبْرِيزِيّ: «والأرثم: الذي في شفته العليا بياض أو سواد، فإن كان في السفلى فهو ألمظ ولمظاء» [@tabrizi-ashr، ص208]."
context: "آخر مقطع «يا شاة ما قنص» (59–62): بعد خبر الجارية يرسم المرأة كما رآها، أو كما تخيلها. والبيت عند الأَعْلَم 67 [@diwan-antara، ص214]، وعند الزَّوْزَنِيّ 60 [@zawzani، ص261]. وبعده ينقطع الغزل، ويعود إلى الحرب."
syntax:
  - "«والجيد خفض بالباء، وهو مضاف إلى الجداية، والرشأ والحر والأرثم نعوت» للجداية [@ibn-al-anbari، ص355]. وجاءت النعوت مذكرة لأن الجداية تقع على الذكر والأنثى [@diwan-antara، ص214]."
  - "و«الْتَفَتَتْ» خبر «كأنّ»، والضمير في «كَأَنَّهَا» للمرأة، والباء في «بِجِيدِ» للاستعانة [@ibn-al-anbari، ص355]."
morphology:
  - "الْتَفَتَتْ ماضي الْتَفَتَ على وزن افتعل، وهمزته همزة وصل تسقط في الدرج."
  - "أَرْثَم صفة على وزن أَفْعَل، مؤنثه رَثْماء، وهو ممنوع من الصرف لكنه جُرّ بالكسرة للقافية."
rhetoric:
  thesis: "يختم الغزل بحركة واحدة: التفاتة. فلا يصف وجهها ولا عينيها، بل العنق وهي تلتفت."
  devices:
    - title: "التشبيه في «كَأَنَّهَا الْتَفَتَتْ بِجِيدِ جَدَايَةٍ»"
      text: "شبّه عنقها حين تلتفت بعنق ظبي صغير، يقول الأَعْلَم: «شبه عنقها بعنق الجداية» [@diwan-antara، ص214]. والتشبيه هنا في هيئة حركة لا في شكل ساكن، وهذا عند عبد القاهر الجُرْجانيّ مما «يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "تتابع النعوت"
      text: "أتبع الجداية بثلاثة نعوت: رشأ، حرّ، أرثم [@ibn-al-anbari، ص355]. فكل نعت يضيق الصورة: ظبي صغير، ثم كريم، ثم بعلامة في أنفه، حتى تصير صورة ظبي بعينه."
  connection: "ثم يقطع الغزل فجأة، ويذكر رجلًا اسمه عمرو كفر نعمته."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَكَأَنْنَهَلْ / تَفَتَتْ بِجِي / دِ جَدَايَتِنْ = متَفاعلن / متَفاعلن / متَفاعلن — رَشَإِنْ مِنَلْ / غِزْلَانِ حُرْ / رِنْ أَرْثَمِي = متَفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأخيرتين من العَجُز."
