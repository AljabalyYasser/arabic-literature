first: "حَالَتْ رِمَاحُ ابْنَيْ بَغِيضٍ دُونَكُمْ"
second: "وَزَوَتْ جَوَانِي الْحَرْبِ مَنْ لَمْ يُجْرِمِ"
meaning: "حالت بيني وبينكم رماح عبس وذبيان في حربهم، وجمعت جنايات الحرب حتى من لم يجنِ ذنبًا. قال ابن الأَنْبارِيّ: «(ابنا بغيض): عبس وذبيان، يعني قتالهم في حرب داحس والغبراء» [@ibn-al-anbari، ص365]."
vocabulary:
  - term: "ابْنَيْ بَغِيضٍ"
    text: "عَبْس وذُبْيان، «يعني قتالهم في حرب داحس والغبراء» [@ibn-al-anbari، ص365]."
  - term: "زَوَتْ"
    text: "«ومعنى زوته: حازته إلى ناحية لا يقدر أن ينفرد من قومه، مخافة أن يقتل» [@ibn-al-anbari، ص365]. وعند الأَعْلَم: «أي قبضت ومنعت» [@diwan-antara، ص220]."
  - term: "جَوَانِي الْحَرْبِ"
    text: "جناياتها. وعند الأَعْلَم: «وجواني الحرب ما تجنيها وتبعثها» [@diwan-antara، ص221]."
  - term: "يُجْرِمِ"
    text: "يجنِ جرمًا. وعند الأَعْلَم: «يريد من لم يجنها، ولم يجترم بتهييجها» [@diwan-antara، ص221]."
context: "آخر المعلقة عند ابن الأَنْبارِيّ: «تمت القصيدة وهي تسعة وسبعون بيتا» [@ibn-al-anbari، ص366]. وهو ثاني البيتين اللذين يرويهما الأصمعي وحده، وقال أبو جعفر فيهما: «لا أعرفهما ولم أقرأهما على أحد البتة» [@ibn-al-anbari، ص366]. وعند الأَعْلَم رقمه 81، وبعده عنده بيت «ولقد كررت المهر» ثم أبيات ابنَي ضَمْضَم [@diwan-antara، ص220–221]. وفي حاشية المحقق أن صاحب «منتهى الطلب» زاد بعده «يا عبل لو أبصرتني» [@diwan-antara، ص220]، وهو من الزيادات التي لا نعرضها في النص. وبالبيت تعود القصيدة إلى الحرب التي شهدها عَنْتَرَة، حرب داحس والغبراء."
syntax:
  - "«رِمَاحُ» فاعل «حَالَتْ»، و«دُونَكُمْ» ظرف متعلق به [@ibn-al-anbari، ص365]."
  - "«والجواني رفع بزوت، ومن منصوبة به، والأصل في جوان جواني، فاستثقلت الضمة في الياء فأسقطت، وأسقطت الياء لسكونها وسكون اللام» [@ibn-al-anbari، ص366]: أي تُكتب الياء وتسقط في النطق قبل لام «الحرب»."
morphology:
  - "جَوَانِي جمع جانِية على وزن فَوَاعِل، من جنى يجني: الجناية والذنب."
  - "زَوَتْ ماضي زَوَى يَزْوِي، «وأصل الانزواء والتقبض والاجتماع»، ومنه في الحديث: «(زويت لي الأرض فأريتُ مشارقها ومغاربها)، أي جُمعت» [@ibn-al-anbari، ص365]."
rhetoric:
  thesis: "يختم بحكمة الحرب: لا تفرّق بين المذنب والبريء. فالحرب التي حرمته من عَبْلَة جمعت إليها حتى من لم يُشعلها."
  devices:
    - title: "المجاز في «حَالَتْ رِمَاحُ ابْنَيْ بَغِيضٍ»"
      text: "أسند الحيلولة إلى الرماح، والحائل في الحقيقة الحرب ومن يحملها. وسمّى القبيلتين بأبيهما بَغِيض، فجعل الحرب بين أخوين [@ibn-al-anbari، ص365]."
    - title: "الاستعارة في «زَوَتْ جَوَانِي الْحَرْبِ مَنْ لَمْ يُجْرِمِ»"
      text: "جعل لجنايات الحرب يدًا تقبض الناس وتجمعهم، و«من لا جرم له زوته جريرة من أجرم» [@ibn-al-anbari، ص365]. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "التذييل"
      text: "الشطر الثاني حكم عام يصلح أن يُتمثل به في كل حرب، فهو تذييل يختم القصيدة بحكمة بعد الفخر."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "حَالَتْ رِمَا / حُبْنَيْ بَغِيْ / ضِنْ دُونَكُمْ = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — وَزَوَتْ جَوَا / نِلْ حَرْبِ مَنْ / لَمْ يُجْرِمِي = متَفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، خمس تفعيلات، وسلمت الأولى من العَجُز. وتسقط همزة الوصل في ابني فتتصل بما قبلها: رماحُبْنَيْ."
