first: "صَعْلٍ يَعُودُ بِذِي الْعُشَيْرَةِ بَيْضَهُ"
second: "كَالْعَبْدِ ذِي الْفَرْوِ الطَّوِيلِ الْأَصْلَمِ"
meaning: "هو ظليم صغير الرأس دقيق العنق، يتعهّد بيضه في ذي العُشَيْرة، كأنه عبد أسود عليه فرو طويل، مقطوع الأذنين. قال الأَعْلَم الشَّنْتَمَرِيّ: «يقول: له بهذا الموضع بيض فهو يعودها أي يأتيها ويتكرر عليها» [@diwan-antara، ص201]، ثم قال: «وإنما جعل له بيضا يعزب عنها ثم يتذكرها فيسرح إليها فكأنه شبه ناقته به في سرعة سيرها» [@diwan-antara، ص202]."
vocabulary:
  - term: "صَعْلٍ"
    text: "«الصغير الرأس الدقيق العنق» [@ibn-al-anbari، ص322]."
  - term: "يَعُودُ ... بَيْضَهُ"
    text: "«معناه يأتي ويرجع إلى بيضه» [@ibn-al-anbari، ص322]، وعند الزَّوْزَنِيّ: «يعود: يتعهد» [@zawzani، ص252]."
  - term: "بِذِي الْعُشَيْرَةِ"
    text: "«و (ذو العشيرة) : موضع» [@ibn-al-anbari، ص323]. وفي لسان العرب: «وَذُو العُشَيْرة: مَوْضِعٌ بالصَّمّان مَعْرُوفٌ يُنْسَبُ إِلى عُشَرةٍ نَابِتَةٍ فِيهِ» [@lisan، ج4 ص575]، والعُشَرة: شجرة."
  - term: "الْفَرْوِ"
    text: "جلد بصوفه أو وبره يُلبس، وكانوا يلبسونه والصوف إلى الخارج كما يذكر الأَعْلَم [@diwan-antara، ص202]."
  - term: "الْأَصْلَمِ"
    text: "«و (الأصلم) : المقطوع الأذنين. والظلمان كلها صلم، أي لا آذان لها» [@ibn-al-anbari، ص323]."
syntax:
  - "البيت متصل بالبيت 24: «وصعل مخفوض على النعت لقريب بين المنسمين، والكاف موضعها خفض على النعت لصعل، والطويل والأصلم نعتان للعبد» [@ibn-al-anbari، ص323]. أي أن «صَعْلٍ» صفة أخرى للظليم المحذوف في قوله «بِقَرِيبِ بَيْنِ الْمَنْسِمَيْنِ»، وبين الصفتين بيتان."
  - "جملة «يَعُودُ ... بَيْضَهُ» صفة ثانية، و«بَيْضَهُ» مفعول به، و«بِذِي الْعُشَيْرَةِ» متعلق بـ«يَعُودُ»."
morphology:
  - "«صَعْل» صفة على وزن «فَعْل»، و«الْأَصْلَم» صفة على وزن «أَفْعَل» من الصَّلَم وهو القطع."
  - "«الْعُشَيْرَة» على وزن التصغير «فُعَيْلَة»، من «عُشَرة»."
rhetoric:
  thesis: "آخر صورة للظليم: يعود مسرعًا إلى بيضه، أسود بريش منفوش، كعبد في فرو طويل. والسرعة هي ما يريده للناقة."
  devices:
    - title: "التشبيه في «كَالْعَبْدِ ذِي الْفَرْوِ الطَّوِيلِ الْأَصْلَمِ»"
      text: "كل صفة في المشبه به تقابل صفة في الظليم، يفصّلها الزَّوْزَنِيّ: «شبه الظليم بعبد» «لأنه لا أذن للنعام، وشرط الفرو الطويل» [@zawzani، ص252] «ليشبه جناحيه، وشرط العبد لسواد الظليم، وعبيد العرب السودان» [@zawzani، ص253]. وقال الأَعْلَم: «وإنما جعل العبد أصلم لأن الظليم أصلم فوصف العبد بذلك لما شبه الظليم به» [@diwan-antara، ص202]."
    - title: "دلالة «يَعُودُ ... بَيْضَهُ»"
      text: "الظليم العائد إلى بيضه أسرع ما يكون، لأنه يخاف عليها. فالبيض في البيت ليس تفصيلًا زائدًا، بل علة للسرعة، كما يقول الأَعْلَم: «فكأنه شبه ناقته به في سرعة سيرها» [@diwan-antara، ص202]."
    - title: "العبد في شعر عنترة"
      text: "قائل البيت ابن أمة سوداء، وقد ذكر ابن قُتَيْبة أنه «كان لأمة سوداء يقال لها زبيبة» وأن أباه استعبده ثم ادّعاه [@ibn-qutayba، ج1 ص243]. والشُّرّاح لا يقفون عند ذلك، ويفسّرون العبد بلون الظليم وحده. ونلاحظ أن الشاعر يجعل العبد صورة لشيء سريع قوي، وهذه قراءتنا."
  connection: "ثم يرجع إلى ناقته: «شَرِبَتْ بِمَاءِ الدُّحْرُضَيْنِ فَأَصْبَحَتْ» [@ibn-al-anbari، ص324]. قال الزَّوْزَنِيّ: «ثم رجع إلى وصف ناقته» [@zawzani، ص253]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "صَعْلِنْ يَعُو / دُ بِذِلْ عُشَيْ / رَةِ بَيْضَهُو = مُتْفاعلن / متَفاعلن / متَفاعلن — كَلْعَبْدِ ذِلْ / فَرْوِطْ طَوِي / لِلْأَصْلَمِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار أولى الصدر والتفعيلات الثلاث من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُقصر ياء «ذِي» لالتقائها بلام التعريف الساكنة: «ذِلْعُشَيْرَةِ» و«ذِلْفَرْوِ»."
context: "آخر أبيات الظليم (24–27). وفيه خبر يرويه ابن الأَنْبارِيّ عن ابن الأَعْرابِيّ: أعرابي أضلّ إبله فخرج يطلبها، فقيل له: ماذا رأيت حين خرجت؟ فذكر كلبًا وشاة، ثم قال: رأيت نعامة، فقيل له: «ارجع فإن ذودك في أهلك. فرجع فأصاب ذوده»، ثم قال: «ويقال: إنه استدل بهذا البيت» [@ibn-al-anbari، ص323]. أي أن صاحب الفأل فهم من البيت أن النعام يعود إلى بيته، فبشّره بعودة إبله. والخبر من الأخبار الأدبية التي تُروى حول الشعر."
