first: "وَمَسَكِّ سَابِغَةٍ هَتَكْتُ فُرُوجَهَا"
second: "بِالسَّيْفِ عَنْ حَامِي الْحَقِيقَةِ مُعْلِمِ"
meaning: "ورُبّ درع واسعة محكمة المسامير شققتُ فتحاتها بالسيف عن رجل يحمي ما يجب عليه حمايته، قد شهر نفسه بعلامة في الحرب. قال الزَّوْزَنِيّ: «يريد أنه هتك مثل هذه الدرع مثل هذا الشجاع فكيف الظن بغيره» [@zawzani، ص259]."
vocabulary:
  - term: "مَسَكِّ"
    text: "«و (مسكها): سمرها» [@ibn-al-anbari، ص349]، أي مسامير حلقها. ولعله من السَّكّ، وفي اللسان: «والسَّكِّيّ: المسمار» [@lisan، ج10 ص440]."
  - term: "سَابِغَةٍ"
    text: "«الدرع الفاضلة الواسعة التامة» [@ibn-al-anbari، ص349]."
  - term: "هَتَكْتُ"
    text: "«معناه قطعت وخرقت» [@ibn-al-anbari، ص349]."
  - term: "فُرُوجَهَا"
    text: "عند الأَعْلَم: «فروج الدرع وهي جيبها وكماها، واحدها فرج» [@diwan-antara، ص211]."
  - term: "حَامِي الْحَقِيقَةِ"
    text: "«معناه يحمي ما يحق عليه أن يمنعه» [@ibn-al-anbari، ص349]."
  - term: "مُعْلِمِ"
    text: "«معناه قد اعلم نفسه، أي هو معروف» [@ibn-al-anbari، ص349]. وعند الأَعْلَم: «الذي قد شهر نفسه بعلامة إدلالًا بشجاعته وإعلامًا بمكانه» [@diwan-antara، ص211]."
context: "أول مقطع حامي الحقيقة (53–58)، وهو خصم ثانٍ أكرم من الأول: يصفه بدرعه، ثم بجوده، ثم بطوله وشرفه، وبين ذلك قتله. والبيت عند الأَعْلَم 58 [@diwan-antara، ص211]، وعند الزَّوْزَنِيّ 51 [@zawzani، ص259]، وعند التِّبْرِيزِيّ في موضعه [@tabrizi-ashr، ص203]. ويختلفون في جواب رُبّ: فمن جعل المِشَكّ الدرع جعل الجواب «هتكت»، ومن جعله الرجل جعل الجواب في البيت 55 «لما رآني قد نزلت أريده» [@tabrizi-ashr، ص203–204]."
syntax:
  - "«والمسك مخفوض بإضمار رب، وهتكت فروجها صلة سابغة، والباء وعن صلتان لهتكت، والحامي خفض بعن، والمعلم نعت لحامى الحقيقة» [@ibn-al-anbari، ص349]."
  - "وإضافة «مَسَكِّ» إلى «سَابِغَةٍ» إضافة الجزء إلى كله. أما على رواية «مِشَكّ» بمعنى الدرع فيعرض التِّبْرِيزِيّ مسألة إضافة الشيء إلى نفسه: «فالجواب أن الكوفيين يجيزون إضافة الشيء إلى نفسه... وهذا عند البصريين لا يجوز» [@tabrizi-ashr، ص203–204]."
morphology:
  - "مَسَكّ على وزن مَفْعَل من السَّكّ، اسم لموضع التسمير."
  - "سَابِغَة اسم فاعل مؤنث من سَبَغَ إذا تمّ واتسع، صار اسمًا للدرع الواسعة."
  - "مُعْلِم اسم فاعل من أَعْلَمَ الرباعي: جعل لنفسه علامة. ويُروى بالفتح «مُعْلَم»، و«المعلَم، بفتح اللام: الذي يشار إليه ويدل عليه بأنه فارس الكتيبة» [@zawzani، ص259]."
rhetoric:
  thesis: "يقدّم الخصم بدرعه قبل شخصه: درع تامة محكمة، ومع ذلك شقّها بسيفه. ثم يجعله حاميًا معلَمًا، فيرتفع النصر بقدر المهزوم."
  devices:
    - title: "الكناية في «حَامِي الْحَقِيقَةِ»"
      text: "الحقيقة ما يجب على الرجل أن يحميه من أهل وحرمة، فقوله «حامي الحقيقة» كناية عن الشرف والنجدة [@ibn-al-anbari، ص349]. والكناية عند عبد القاهر الجُرْجانيّ أن يذكر المتكلم «معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]: فالحماية تتبع النجدة."
    - title: "الكناية في «مُعْلِمِ»"
      text: "الفارس الذي يضع لنفسه علامة في الحرب يدعو الأبطال إليه، فالعلامة كناية عن الجرأة، وهي عند الأَعْلَم «إدلالًا بشجاعته» [@diwan-antara، ص211]."
  connection: "ثم يمضي في صفة هذا الحامي: سريع اليد بالقداح، يشتري الخمر كلها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَسَكْكِ سَا / بِغَتِنْ هَتَكْ / تُ فُرُوجَهَا = متَفاعلن / متَفاعلن / متَفاعلن — بِسْسَيْفِ عَنْ / حَامِلْ حَقِي / قَةِ مُعْلِمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من العَجُز."
variants:
  - reading: "وَمِشَكِّ سَابِغَةٍ هَتَكْتُ فُرُوجَهَا"
    status: "رواية الأصمعي، وهي رواية الأَعْلَم والزَّوْزَنِيّ"
    note: "«وروى الأصمعي: (ومشك سابغة). قال: ومشكها: حيث يجمع جيبها بسير»؛ «كانت العرب تجعل سيرا في جيب الدرع يجمع جيبها، فإذا أراد أحدهم الفرار جذب السير فقطعه واتسع الجيب فألقاها عنه وهو يركض» [@ibn-al-anbari، ص349]. وقال أبو جعفر: «مشكها: نسجها» [@ibn-al-anbari، ص349]. وعند الأَعْلَم: «والمشك التي شك بعضها في بعض. والشك مسامير الدرع» [@diwan-antara، ص211]، وعند الزَّوْزَنِيّ: «المشكّ: الدرع التي قد شُكَّ بعضها إلى بعض، وقيل: مساميرها» [@zawzani، ص259]."
