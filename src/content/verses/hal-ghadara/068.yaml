first: "يَدْعُونَ عَنْتَرَ وَالرِّمَاحُ كَأَنَّهَا"
second: "أَشْطَانُ بِئْرٍ فِي لَبَانِ الْأَدْهَمِ"
meaning: "ينادونني: يا عنتر، والرماح في صدر فرسي الأدهم كأنها حبال بئر. قال الزَّوْزَنِيّ: «يقول: كانوا يدعونني في حال إصابة رماح الأعداء صدر فرسي ودخولها فيه، ثم شبهها في طولها بالحبال التي يستقى بها من الآبار» [@zawzani، ص263]."
vocabulary:
  - term: "عَنْتَرَ"
    text: "عنترة، حُذفت التاء في النداء. وعند الأَعْلَم: «أي ينادونني يا عنتر، ويأمرونني بالتقدم» [@diwan-antara، ص217]."
  - term: "أَشْطَانُ"
    text: "حبال البئر، «الشطن: الحبل الذي يستقى به، والجمع الأشطان» [@zawzani، ص263]."
  - term: "لَبَانِ"
    text: "الصدر، «مجرى اللبب» [@ibn-al-anbari، ص359]، واللَّبَب: ما يُشدّ على صدر الفرس."
  - term: "الْأَدْهَمِ"
    text: "الأسود، «والأدهم: فرسه» [@tabrizi-ashr، ص211]."
context: "أشهر أبيات مقطع الكرّة (67–74)، وفيه يسمّي نفسه وفرسه. والقوم الذين يدعونه أصحابه، يستغيثون به حين تشتد الرماح. وفي حاشية محقق الأَعْلَم أن نسخة «ب» تنقل عن أبي بكر، أي البَطَلْيَوْسيّ، قوله بعد هذا البيت: «وبعد هذه الأبيات أبيات لم تقع في الروايات، يعظم بها شأن نفسه ويهول بها على أعدائه»، ثم أربعة أبيات تبدأ كلها بـ«يدعون عنتر» [@diwan-antara، ص216]، وهي شاهد على ما زيد على المعلقة بعد الرواة الأوائل. والبيت عند الأَعْلَم 73 [@diwan-antara، ص216]، وعند الزَّوْزَنِيّ 66 [@zawzani، ص263]."
syntax:
  - "«والرماح رفع بما عاد من الهاء، والهاء والألف اسم كأن، وخبرها أشطان، والواو في الرماح واو الحال» [@ibn-al-anbari، ص359]: فجملة «وَالرِّمَاحُ كَأَنَّهَا أَشْطَانُ» حال من فاعل «يَدْعُونَ» أو من مفعوله."
  - "و«عَنْتَرَ» منادى مرخّم بلا حرف نداء، أو محكيّ قولهم «يا عنتر». ويجيز التِّبْرِيزِيّ أن يكون «منصوبا بيدعون» إذا كان اسمه «عنترًا» بلا تاء [@tabrizi-ashr، ص211]."
morphology:
  - "«وعنتر فيه وجهان: فتح الراء وضمها. من فتحها قال: أراد الترخيم يا عنترة ثم أسقط التاء وترك الراء على فتحها؛ لأنه يطالب التاء. ومن قال عنتر ضم الراء لأنه منادى مفرد» [@ibn-al-anbari، ص360]. والترخيم: حذف آخر الاسم في النداء تخفيفًا."
  - "أَشْطَان جمع شَطَن على وزن أَفْعَال، وأَدْهَم صفة على وزن أَفْعَل من الدُّهْمة وهي السواد."
rhetoric:
  thesis: "صوتان في مشهد واحد: نداء القوم باسمه، والرماح الطويلة مغروسة في صدر فرسه. فالاسم والجرح يجتمعان، ومنهما يولد الفخر."
  devices:
    - title: "التشبيه التمثيلي في «وَالرِّمَاحُ كَأَنَّهَا أَشْطَانُ بِئْرٍ»"
      text: "شبّه الرماح المشرعة إلى صدر الفرس بحبال تتدلى في بئر. «معناه: كأن الرماح حين أشرعت إليه في طولها حبال» [@ibn-al-anbari، ص359]. ويفصّل التِّبْرِيزِيّ الهيئة: «يريد أن الرماح في صدر هذا الفرس بمنزلة حبال البئر من الدلاء؛ لأن البئر إذا كانت كثيرة الجرفة اضطربت الدلو فيها، فيجعل لها حبلان لئلا تضطرب» [@tabrizi-ashr، ص211]. فالشبه في هيئة مركّبة: حبال كثيرة ممدودة نحو موضع واحد. وهذا عند عبد القاهر الجُرْجانيّ تمثيل، والتمثيل عنده أخصّ من التشبيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "تسمية النفس"
      text: "يذكر اسمه على ألسنة أصحابه، فيكون الفخر شهادة القوم لا قوله هو. وهو أول ما يظهر اسمه في القصيدة [@ibn-al-anbari، ص359]."
  connection: "ثم يصف كيف ظل يرمي الأعداء بفرسه حتى اكتسى بالدم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يَدْعُونَ عَنْ / تَرَ وَرْرِمَا / حُ كَأَنْنَهَا = مُتْفاعلن / متَفاعلن / متَفاعلن — أَشْطَانُ بِئْ / رِنْ فِي لَبَا / نِلْ أَدْهَمِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من الصدر وتفعيلات العَجُز كلها."
