first: "بِرَحِيبَةِ الْفَرْغَيْنِ يَهْدِي جَرْسُهَا"
second: "بِاللَّيْلِ مُعْتَسَّ الذِّئَابِ الضُّرَّمِ"
meaning: "بطعنة واسعة المخرجَين، يهدي صوتُ سيلان دمها الذئابَ الجائعة التي تطوف بالليل تطلب فريسة. قال ابن الأَنْبارِيّ: «فيقول: حس سيلان دم هذه الطعنة يدل السباع إذا سمعن خرير الدم منها، فيأتينه فيأكلن منه» [@ibn-al-anbari، ص346]."
vocabulary:
  - term: "رَحِيبَةِ"
    text: "«الواسعة؛ يقال مكان رحب ورحيب، أي واسع» [@ibn-al-anbari، ص346]."
  - term: "الْفَرْغَيْنِ"
    text: "«وما بين كل عرقوتين من الدلو فهو فرغ، ومدفع الماء إلى الأودية فرغ» [@ibn-al-anbari، ص346]. والعَرْقُوَتان: الخشبتان المعترضتان على فم الدلو، والفَرْغ: مصبّ الماء منها."
  - term: "جَرْسُهَا"
    text: "«و (الجرس) والجرس: الصوت، وهو حس الشيء وصوته» [@ibn-al-anbari، ص346]."
  - term: "مُعْتَسَّ"
    text: "«المبتغى الطالب. يقال: خرج يعتس، أي يطلب فريسته يأكلها» [@ibn-al-anbari، ص346]. وعند الأَعْلَم: «والمعتس الطالب بالليل ومنه قيل للحرس: العسس» [@diwan-antara، ص210]."
  - term: "الضُّرَّمِ"
    text: "«الجياع» [@ibn-al-anbari، ص346]."
context: "بيت انفرد به الأصمعي. قال ابن الأَنْبارِيّ: «وروى الأصمعي بعد هذا البيت بيتا لا نعلم أحدا رواه غيره» [@ibn-al-anbari، ص346]، ومثله عند التِّبْرِيزِيّ: «وروى الأصمعي - ولم يروه غيره - هذا البيت» [@tabrizi-ashr، ص202]. ولذلك هو في ديوان الأَعْلَم، وهو من رواية الأصمعي، رقمه 55 [@diwan-antara، ص210]، وليس في متن الزَّوْزَنِيّ، فيأتي بعد البيت 49 عنده مباشرة «فشككت» [@zawzani، ص259]. ونثبته لأنه في متن ابن الأَنْبارِيّ الذي نعتمده، وعدّته عنده تسعة وسبعون بيتًا."
syntax:
  - "«والباء صلة لجادت، والرحيبة خفض بالباء، والفرغان مخفوضان بإضافة رحيبة إليهما» [@ibn-al-anbari، ص346]: أي «بِرَحِيبَةِ» بدل من «بِعَاجِلِ طَعْنَةٍ» في البيت السابق، والموصوف محذوف، أي بطعنة رحيبة."
  - "«والجَرْس رفع بيَهدِى، ومعتسَّ الذئاب منصوب بيهدي، والضرَّم نعت الذئاب» [@ibn-al-anbari، ص347]. و«بِاللَّيْلِ» ظرف متعلق بـ«يَهْدِي»."
morphology:
  - "«يقال: لقيت فلانا ضرما، ولا يقال هو ضارم. وضرم جمع ولم يتكلم بضارم» [@ibn-al-anbari، ص346]: فهو جمع على وزن فُعَّل لم يُسمع مفرده."
  - "مُعْتَسّ اسم فاعل من اعْتَسَّ على وزن افتعل، من العَسّ: الطواف بالليل."
rhetoric:
  thesis: "يجعل الطعنة دليلًا للذئاب: من شدة اتساعها يُسمع خرير دمها في الليل، فتأتي الذئاب الجائعة. فيصل بين ساحة القتال وما يجري فيها بعد أن ينصرف الناس."
  devices:
    - title: "الاستعارة في «الْفَرْغَيْنِ»"
      text: "استعار للطعنة مخرجي الماء من الدلو. «فضرب هذا مثلا لمخرج دم هذه الطعنة، فجعله مثل مصب الدلو» [@ibn-al-anbari، ص346]، ويقول الأَعْلَم: «فاستعارهما للطعنة» [@diwan-antara، ص210]. وهي عند عبد القاهر الجُرْجانيّ أن «تجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]."
    - title: "إسناد الهداية إلى الصوت في «يَهْدِي جَرْسُهَا»"
      text: "جعل الصوت هو الهادي، والهادي في الحقيقة الذئب نفسه يتبع الصوت. فأسند الفعل إلى سببه، وهذا من المجاز في الإسناد."
  connection: "ثم يعود إلى طعنته: انتظم بها ثيابه، والكريم لا يُحرَّم على الرماح."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "بِرَحِيبَتِلْ / فَرْغَيْنِ يَهْ / دِي جَرْسُهَا = متَفاعلن / مُتْفاعلن / مُتْفاعلن — بِلْلَيْلِ مُعْ / تَسْسَذْ ذِئَا / بِضْ ضُرْرَمِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، خمس تفعيلات، ولم تسلم إلا الأولى من الصدر."
