first: "إِنْ كُنْتِ أَزْمَعْتِ الْفِرَاقَ فَإِنَّمَا"
second: "زُمَّتْ رِكَابُكُمُ بِلَيْلٍ مُظْلِمِ"
meaning: "إن كنتِ عزمتِ على الفراق، فقد دُبّر الأمر قبل أن أعلم، كأن إبلكم شُدّت أزمّتها في ليل مظلم. قال ابن الأَنْبارِيّ: «يقول: أن كنت قد عزمت على الفراق فقد كان ذاك في نفسك قبل» [@ibn-al-anbari، ص303]. وقال الأَعْلَم الشَّنْتَمَرِيّ: «يعني أنهم فاجؤوه بالرحيل ولم يعلم به (قبل) فذلك أشد عليه وأبعث لجزعه» [@diwan-antara، ص188، ص193]."
vocabulary:
  - term: "أَزْمَعْتِ"
    text: "«معناه عزمت على الفراق. ويقال: أزمع على كذا وكذا، وأجمع عليه، وعزم عليه، إذا أراد أن يفعله» [@ibn-al-anbari، ص303]. وعند الزَّوْزَنِيّ: «الإزماع: توطين النفس على الشيء» [@zawzani، ص247]."
  - term: "زُمَّتْ"
    text: "«أي شدت وخطمت بالأزمة» [@diwan-antara، ص188]، والزِّمام: الحبل الذي تُقاد به الناقة. وهو عند ابن الأَنْبارِيّ مَثَل: «وقوله (زمت) مثل، يريد أمرا فرغ منه بليل» [@ibn-al-anbari، ص303]."
  - term: "رِكَابُكُمُ"
    text: "«الركاب: الإبل» [@ibn-al-anbari، ص303]. قال الزَّوْزَنِيّ: «الركاب: الإبل، لا واحد لها من لفظها، وقال الفراء: واحدها ركوب مثل قلوص وقلاص» [@zawzani، ص247]."
syntax:
  - "«إِنْ» شرطية، و«كُنْتِ» فعل الشرط، «والتاء اسم الكون، والخبر ما عاد من التاء في أزمعت» [@ibn-al-anbari، ص303]، أي أن جملة «أَزْمَعْتِ الْفِرَاقَ» خبر «كان». و«فَإِنَّمَا زُمَّتْ» جواب الشرط، والفاء رابطة."
  - "«الْفِرَاقَ» منصوب بنزع الخافض، قال ابن الأَنْبارِيّ: «والمعنى أزمعت على الفراق، فلما أسقط الصفة نصب الفراق بالفعل» [@ibn-al-anbari، ص304]. والصفة في اصطلاح الكوفيين حرف الجر."
  - "«والركاب اسم ما لم يسم فاعله، والباء صلة زمت» [@ibn-al-anbari، ص304]، أي نائب فاعل، و«بِلَيْلٍ» متعلق بالفعل."
morphology:
  - "«أَزْمَعَ» على وزن «أَفْعَلَ»، و«زُمَّتْ» ماض مبني للمجهول من «زَمَّ» المضاعف."
  - "«رِكَاب» اسم جمع لا واحد له من لفظه عند الزَّوْزَنِيّ، وله عند الفَرّاء واحد هو «رَكُوب» [@zawzani، ص247]."
rhetoric:
  thesis: "الفراق قرار اتُّخذ في السر، والشاعر آخر من يعلم. والليل المظلم هو ستر هذا القرار."
  devices:
    - title: "الكناية في «زُمَّتْ رِكَابُكُمُ بِلَيْلٍ»"
      text: "ذكر شدّ الأزمة ليلًا وأراد أن الرحيل دُبّر قبل أن يظهر. ويقول ابن الأَنْبارِيّ إنهم يقولون «للأمر الذي أحكمه أهله قبل أن يظهروه: (هذا أمر أسرى عليه بليل)» [@ibn-al-anbari، ص303]. والكناية عند عبد القاهر الجُرْجانيّ «أن يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود»، «فيومئ به إليهِ» [@dalail، ص66]. فشدّ الأزمة يتلو العزم على الرحيل ويدلّ عليه."
    - title: "الليل المظلم"
      text: "في «بِلَيْلٍ مُظْلِمِ» يقول التِّبْرِيزِيّ إنه قصد الليل «لأنه وقت تصفو فيه الأذهان، ولا يشتغل القلب بمعاش ولا غيره» [@tabrizi-ashr، ص182]، أي وقت التدبير. ويستشهد الأَعْلَم بقول عَلْقَمة: «لم أدر بالبين حتى أزمعوا ظعنا ... كل الجمال قبيل الصبح مزموم» [@diwan-antara، ص193]."
    - title: "التجانس بين «أَزْمَعْتِ» و«زُمَّتْ»"
      text: "تتكرر الزاي والميم في الكلمتين، فيُسمع في العجز صدى الصدر: العزم في القلب، والزمام على الإبل. وهذه قراءتنا."
  connection: "ثم يصف اللحظة التي فاجأته: «مَا رَاعَنِي إِلَّا حَمُولَةُ أَهْلِهَا» [@ibn-al-anbari، ص304]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "إِنْ كُنْتِ أَزْ / مَعْتِلْ فِرَا / قَ فَإِنْنَمَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن — زُمْمَتْ رِكَا / بُكُمُ بِلَيْ / لِنْ مُظْلِمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار الأوليين من الصدر، والأولى والثالثة من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وحُرّكت ميم الجمع في «رِكَابُكُمُ» بالضم، وبها تمّت التفعيلة الثانية من العجز «بُكُمُ بِلَيْ»."
context: "آخر أبيات عَبْلة وقومها، وفيه الانتقال إلى الظعائن: عرف بالرحيل بعد أن دُبّر. وفي البيتين التاليين يرى الإبل في وسط الديار."
