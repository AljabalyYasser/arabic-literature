first: "وَلَقَدْ حَفِظْتُ وَصَاةَ عَمِّي بِالضُّحَى"
second: "إِذْ تَقْلِصُ الشَّفَتَانِ عَنْ وَضَحِ الْفَمِ"
meaning: "ولقد حفظت وصية عمي في وقت الضحى، ساعة تنقبض الشفاه عن بياض الأسنان من شدة الحرب. قال الزَّوْزَنِيّ: «يقول: ولقد حفظت وصيّة عمي إياي» في أشد أحوال الحرب، «وهي حالة تقلص الشفاه عن الأسنان من شدة كلوح الأبطال والكماة» [@zawzani، ص262]."
vocabulary:
  - term: "وَصَاةَ"
    text: "«الوصاة والوصية شيء واحد» [@zawzani، ص262]."
  - term: "الضُّحَى"
    text: "ارتفاع النهار، «(الضُّحى) مؤنثة؛ والضَّحاء، بالمد والفتح مذكر» [@ibn-al-anbari، ص356]."
  - term: "تَقْلِصُ"
    text: "تنقبض وترتفع. «إذا فزع الرجل تقلصت شفتاه» [@ibn-al-anbari، ص356]. وعند التِّبْرِيزِيّ: «ومعنى (تقلص) ترتفع، وفي الحرب ترتفع الشفة من الإنسان حتى يُرى كأنه يتبسم» [@tabrizi-ashr، ص209]."
  - term: "وَضَحِ الْفَمِ"
    text: "«أي عن بياض الأسنان» [@ibn-al-anbari، ص356]. «والوضح: اللبن، سمى وضحا لبياضه» [@ibn-al-anbari، ص356]."
context: "يصل ذكر عمرو بما فعله الشاعر في الحرب (63–66)، فكأنه يذكّر بالنعمة التي جحدها عمرو. ولا يذكر الشراح ما كانت وصية العم، ولا من هو العم. والبيت عند الأَعْلَم 69 [@diwan-antara، ص215]، وعند الزَّوْزَنِيّ 62 [@zawzani، ص262]."
syntax:
  - "«واللام في لقد لام اليمين، وإذ وقت لما مضى، والشفتان رفع بتقلص، وعن صلة تقلص، والوضح مضاف إلى الفم» [@ibn-al-anbari، ص356]."
  - "و«بِالضُّحَى» ظرف، والباء فيه بمعنى «في»: «و (بالضحى) أي وقت الضحى» [@tabrizi-ashr، ص209]."
morphology:
  - "وَصَاة اسم من أَوْصَى ووَصَّى، على وزن فَعَال، مثل الوصية."
  - "تَقْلِصُ مضارع قَلَصَ يَقْلِصُ، و«القُلوص: التشنج والقِصر» [@zawzani، ص262]."
rhetoric:
  thesis: "يجعل وفاءه بوصية عمه في أصعب ساعة: حين يكشف الخوف أسنان الرجال. فالوفاء عنده يُمتحن في الحرب لا في السلم."
  devices:
    - title: "الكناية في «تَقْلِصُ الشَّفَتَانِ عَنْ وَضَحِ الْفَمِ»"
      text: "انكشاف الأسنان كناية عن الفزع وشدة الحرب، ويقول الأَعْلَم: «يعني (عند) شدة الحرب، إذا فزع الإنسان فتقلصت شفتاه عن أسنانه» [@diwan-antara، ص215]. والكناية عند عبد القاهر الجُرْجانيّ أن يذكر المتكلم «معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]: فلم يقل اشتدت الحرب، بل ذكر ما يتبع شدتها على الوجوه."
    - title: "صدى البيت 55"
      text: "الصورة نفسها تقريبًا في خصمه الذي «أبدى نواجذه لغير تبسم» [@ibn-al-anbari، ص350]. فالحرب تكشف أسنان الرجال، والفرق أن الشاعر هنا ثابت يحفظ الوصية."
  connection: "ثم يحدد مكان ذلك: في حومة الموت حيث لا يتكلم الأبطال إلا غمغمة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَلَقَدْ حَفِظْ / تُ وَصَاةَ عَمْ / مِي بِضْضُحَى = متَفاعلن / متَفاعلن / مُتْفاعلن — إِذْ تَقْلِصُشْ / شَفَتَانِ عَنْ / وَضَحِلْ فَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأخيرة من الصدر، والأولى من العَجُز."
