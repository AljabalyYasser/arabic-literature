first: "فَوَقَفْتُ فِيهَا نَاقَتِي وَكَأَنَّهَا"
second: "فَدَنٌ لِأَقْضِيَ حَاجَةَ الْمُتَلَوِّمِ"
meaning: "حبس ناقته في الدار، وهي في ضخامتها كأنها قصر، ليقضي فيها حاجة من أطال الانتظار. قال الأَعْلَم الشَّنْتَمَرِيّ: «أي حبست على هذه الدار ناقتي لأقضي حاجتي من البكاء فيها، والسؤال عن أهلها» [@diwan-antara، ص185]."
vocabulary:
  - term: "وَقَفْتُ ... نَاقَتِي"
    text: "حبستها، فالفعل هنا متعدٍّ. قال الزَّوْزَنِيّ: «حبست ناقتي في دار حبيبتي» [@zawzani، ص246]."
  - term: "فَدَنٌ"
    text: "«الفدن: القصر» [@ibn-al-anbari، ص297]، «والجمع الأفدان» [@zawzani، ص246]."
  - term: "الْمُتَلَوِّمِ"
    text: "«المتمكث»، ثم قال ابن الأَنْبارِيّ: «وعنى بالمتلوم نفسه» [@ibn-al-anbari، ص297]. وعند الأَعْلَم: «والمتلوم المنتظر المتمكث، يقال: تلوم علي ساعة أي انتظرني وتربص علي» [@diwan-antara، ص185]."
syntax:
  - "الضمير في «فِيهَا» للدار، وفي «كَأَنَّهَا» للناقة: «والهاء التي في كأنها تعود على الناقة» [@ibn-al-anbari، ص297]. وجملة «وَكَأَنَّهَا فَدَنٌ» حال من الناقة."
  - "«أَقْضِيَ» منصوب، «وأقضى في قول الكوفيين منصوب بلام كي، وهو في قول البصريين منصوب بإضمار أن، كأنه قال: لأن أقضي» [@ibn-al-anbari، ص297]. واللام عند التِّبْرِيزِيّ «متعلقة بقوله فوقفت فيها» [@tabrizi-ashr، ص178]."
morphology:
  - "«الْمُتَلَوِّم» اسم فاعل من «تَلَوَّمَ» على «تَفَعَّلَ»، وهو التمكث: «ويقول الرجل لصاحبه: تلوم عليَّ، أي تحبس وتمكث» [@ibn-al-anbari، ص297]."
  - "«فَدَنٌ» اسم مفرد، وجمعه «أَفْدان» على «أَفْعال»."
rhetoric:
  thesis: "ناقة ضخمة واقفة في دار خالية كأنها قصر، وصاحبها يطيل المكث لحاجة لا يسمّيها. فالبيت يجمع بين ثبات الناقة وقلق صاحبها."
  devices:
    - title: "التشبيه في «وَكَأَنَّهَا فَدَنٌ»"
      text: "شبّه الناقة بالقصر، قال الأَعْلَم: «شبه ناقته في ضخمها وكمال خلقها بالفدن وهو القصر» [@diwan-antara، ص185]. ووجه الشبه هنا مما يُرى بالعين، وهو عند عبد القاهر الجُرْجانيّ من التشبيه الذي «بَيّنٌ لا يجري فيه التأوُّل» [@asrar، ص92]، أي لا يحتاج القارئ في فهمه إلى تفكير."
    - title: "الحديث عن النفس بلفظ الغائب في «الْمُتَلَوِّمِ»"
      text: "لم يقل: لأقضي حاجتي، بل «حَاجَةَ الْمُتَلَوِّمِ»، و«عنى بالمتلوم نفسه» [@ibn-al-anbari، ص297]. فكأنه ينظر إلى نفسه من الخارج: رجل طال وقوفه. والحاجة لا يسمّيها، ويفسرها الزَّوْزَنِيّ: «لأقضي حاجة المتمكث بجزعي من فراقها وبكائي على أيام وصالها» [@zawzani، ص246]."
  connection: "ثم يذكر أين تنزل عَبْلة وأين ينزل أهله: «وَتَحُلُّ عَبْلَةُ بِالْجِوَاءِ وَأَهْلُنَا» [@ibn-al-anbari، ص298]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَوَقَفْتُ فِي / هَا نَاقَتِي / وَكَأَنْنَهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — فَدَنُنْ لِأَقْ / ضِيَ حَاجَةَلْ / مُتَلَوْوِمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر وحدها، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وجاء العجز تامًّا كله، وتنوين «فَدَنٌ» يُنطق نونًا ساكنة: «فَدَنُنْ»."
context: "بعد أن حيّا الدار يخبر بما صنع فيها: وقف ناقته. وهذا أول ذكر للناقة، ويعود إليها في البيت 22 ليصفها طويلًا. وفي رواية الأَعْلَم بيت قريب منه في الموضع نفسه: «وَلَقَدْ حَبَسْتُ بِهَا طَوِيلًا نَاقَتِي ... أَشْكُو إِلَى سُفْعٍ رَوَاكِدَ جُثَّمِ»، وفي شرحه: «حبست ناقتي في هذه الدار، أبكي لفراق أهلها وأشكو إلى رسومها» [@diwan-antara، ص183]. والسُّفْع الرواكد: حجارة القدر السود."
