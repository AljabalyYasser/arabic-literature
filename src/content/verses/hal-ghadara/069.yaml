first: "مَا زِلْتُ أَرْمِيهِمْ بِغُرَّةِ وَجْهِهِ"
second: "وَلَبَانِهِ حَتَّى تَسَرْبَلَ بِالدَّمِ"
meaning: "ظللت أرمي الأعداء بوجه فرسي وصدره، حتى صار الدم عليه كالقميص. قال الأَعْلَم: «أي ما زلت أقاتلهم وأكر عليهم بصدر الفرس حتى تسربل بالدم، أي صار له سربالًا» [@diwan-antara، ص218]."
vocabulary:
  - term: "غُرَّةِ وَجْهِهِ"
    text: "الغرّة: البياض في جبهة الفرس، ويريد بها مقدّم وجهه."
  - term: "تَسَرْبَلَ"
    text: "«معناه صار له سربال من الدم. والسربال: القميص» [@ibn-al-anbari، ص359]."
context: "يكمل صورة الأدهم في الكرّة (67–74): من الرماح في صدره إلى الدم على جسده. والبيت عند الأَعْلَم 74 بلفظ «بثغرة نحره» [@diwan-antara، ص217]، وعند الزَّوْزَنِيّ 67 بالرواية نفسها [@zawzani، ص263]. وبعده عند الزَّوْزَنِيّ والأَعْلَم والتِّبْرِيزِيّ يأتي البيت 71، ويتأخر البيت 70 «ولقد شفى نفسي»."
syntax:
  - "«والتاء اسم زلت، والخبر ما عاد من أرمى، والباء صلة أرمى» [@ibn-al-anbari، ص359]: أي جملة «أَرْمِيهِمْ» خبر ما زال."
  - "و«حَتَّى» غائية، والفعل بعدها ماضٍ: انتهى الرمي بأن تسربل الفرس بالدم. والباء في «بِغُرَّةِ» للآلة [@ibn-al-anbari، ص359]."
morphology:
  - "تَسَرْبَلَ على وزن تَفَعْلَلَ من الرباعي سَرْبَلَ، أي لبس السربال؛ واشتقه الشاعر من الاسم."
  - "مَا زِلْتُ من زال يزال، فعل ناقص يدل على الاستمرار إذا سبقه نفي."
rhetoric:
  thesis: "الفرس سلاح يُرمى به: يقدّمه الفارس في وجوه الأعداء حتى يُلبسه الدم. فالفخر بالفرس فخر بفارسه."
  devices:
    - title: "الاستعارة في «أَرْمِيهِمْ بِغُرَّةِ وَجْهِهِ»"
      text: "جعل الفرس كالسهم يُرمى به، والرمي في الأصل للسهام والحجارة. وهي استعارة في الفعل، و«كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» عند عبد القاهر الجُرْجانيّ [@asrar، ص44]."
    - title: "الاستعارة في «تَسَرْبَلَ بِالدَّمِ»"
      text: "جعل الدم قميصًا يكسو الفرس، وهذا معنى قول ابن الأَنْبارِيّ: «صار له سربال من الدم» [@ibn-al-anbari، ص359]. ويقول الزَّوْزَنِيّ: «أي عَمَّ جسده عموم السربال جسد لابسه» [@zawzani، ص263]."
  connection: "ثم يأتي البيت الذي يقول فيه إن نداء الفوارس شفى نفسه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "مَا زِلْتُ أَرْ / مِيهِمْ بِغُرْ / رَةِ وَجْهِهِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن — وَلَبَانِهِي / حَتْتَى تَسَرْ / بَلَ بِدْدَمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، والوسطى من العَجُز. وتُشبع كسرة الهاء في وجهه ولبانه."
variants:
  - reading: "مَا زِلْتُ أَرْمِيهِمْ بِثُغْرَةِ نَحْرِهِ"
    status: "رواية ثابت، وهي متن الأَعْلَم والزَّوْزَنِيّ"
    note: "«ورواه ثابت: (ما زلت أرميهم بثغرة نحره)، قال: ثغرة النحر: الهزمة التي بين الترقوتين» [@ibn-al-anbari، ص359]. وعند الأَعْلَم: «ثغرة النحر النقرة في أسفل الحلق» [@diwan-antara، ص218]. وفي حاشية المحقق أن نسخة «ف» تنسب رواية «بغرة وجهه» إلى أبي عبيدة [@diwan-antara، ص217]."
