first: "إِذْ لَا أَزَالُ عَلَى رِحَالَةِ سَابِحٍ"
second: "نَهْدٍ تَعَاوَرُهُ الْكُمَاةُ مُكَلَّمِ"
meaning: "حين كنت لا أفارق سرج فرس سريع ضخم، يتداوله الأبطال بالطعن واحدًا بعد واحد حتى كثرت جراحه. قال الزَّوْزَنِيّ: «يقول: هلا سألت الفرسان عن حالي إذا لم أزل على سرج فرس سابح تناوب الأبطال في جرحه، أي جرحه كلّ منهم» [@zawzani، ص258]."
vocabulary:
  - term: "رِحَالَةِ"
    text: "«سرج كان يعمل من جلود الشاء بأصوافها، يتخذ للجري الشديد» [@ibn-al-anbari، ص343]."
  - term: "سَابِحٍ"
    text: "«الذي يدحو بيديه دحوا ولا يتلقف» [@ibn-al-anbari، ص343]، أي يمدّ يديه في الجري. وعند الأَعْلَم: «والسابح الذاهب في سيره كأنه يسبح» [@diwan-antara، ص208]."
  - term: "نَهْدٍ"
    text: "«الغليظ» [@ibn-al-anbari، ص343]، وعند الأَعْلَم: «والنهد الضخم» [@diwan-antara، ص208]."
  - term: "تَعَاوَرُهُ"
    text: "«أي يطعنه ذا مرة وذا مرة» [@ibn-al-anbari، ص343]."
  - term: "الْكُمَاةُ"
    text: "«جمع كمى، وهو الشجاع، سمى كميا لأنه يقمع عدوه» [@ibn-al-anbari، ص343]. «وقال أبو عبيدة: الكمى: التام السلاح» [@ibn-al-anbari، ص343]."
  - term: "مُكَلَّمِ"
    text: "«معناه مجرح، معناه قد جرح ثم جرح» [@ibn-al-anbari، ص343]."
context: "يفصّل ما تسمعه عَبْلَة لو سألت الفرسان: هو دائمًا على فرسه، وفرسه دائمًا في الطعن. وفي هذا البيت يظهر الفرس أول مرة في الفخر، ويعود في 68–72 شريكًا في القتال. والبيت عند الأَعْلَم 50 [@diwan-antara، ص208]، وعند الزَّوْزَنِيّ 44 [@zawzani، ص257]."
syntax:
  - "«وإذ صلة لسألت» [@ibn-al-anbari، ص343]: ظرف متعلق بـ«سَأَلْتِ» في البيت السابق. و«لَا أَزَالُ» فعل ناقص منفي، واسمه ضمير المتكلم، وخبره «عَلَى رِحَالَةِ»."
  - "«والكماة يرتفعون بفعلهم، والمكلم نعت السابح» [@ibn-al-anbari، ص343]: فجملة «تَعَاوَرُهُ الْكُمَاةُ» صفة ثانية، و«نَهْدٍ» صفة أولى."
morphology:
  - "«والأصل في تعاوره تتعاوره، فاستثقلوا الجمع بين حرفين متجانسين متحركين، فحذفوا أحدهما» [@ibn-al-anbari، ص343]. ووزنه تفاعل، وهو بناء المشاركة والتناوب."
  - "مُكَلَّم اسم مفعول من كَلَّمَ على وزن فَعَّل، والتضعيف فيه للتكثير: جُرح مرة بعد مرة."
  - "الكُمَاة جمع كَمِيّ على وزن فُعَلة، كقاضٍ وقُضاة."
rhetoric:
  thesis: "يجعل جراح الفرس شاهدًا على ثبات فارسه: فرس يتداوله الأبطال طعنًا، وفارسه لا ينزل عنه."
  devices:
    - title: "الاستعارة في «سَابِحٍ»"
      text: "جعل جري الفرس سباحة، لأنه يمدّ يديه كما يمدّهما السابح؛ ولذلك قال الأَعْلَم: «كأنه يسبح» [@diwan-antara، ص208]. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تُريدَ تشبيهَ الشيءِ بالشيءِ، فَتَدعَ أنْ تُفْصحَ بالتشبيهِ وتُظْهرَه، وتجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]. ثم حذف الموصوف، فصار السابح اسمًا للفرس."
    - title: "الكناية في «لَا أَزَالُ عَلَى رِحَالَةِ»"
      text: "ملازمة السرج كناية عن دوام الغزو والحرب."
  connection: "ثم يقسم أحوال فرسه في الحرب: مرة يتقدم للطعان، ومرة يرجع إلى الجيش."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "إِذْ لَا أَزَا / لُ عَلَى رِحَا / لَةِ سَابِحِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — نَهْدِنْ تَعَا / وَرُهُلْ كُمَا / ةُ مُكَلْلَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من كل شطر."
variants:
  - reading: "نَقِذٍ تَعَاوَرُهُ الْكُمَاةُ مُكَلَّمِ"
    status: "رواية يذكرها ابن الأَنْبارِيّ"
    note: "«ويروى: (نقذ تعاوره الكماة)، أي تنقذ من خيل قوم آخرين» [@ibn-al-anbari، ص343]، أي فرس غُنم من قوم آخرين."
