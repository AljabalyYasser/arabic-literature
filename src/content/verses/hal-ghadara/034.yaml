first: "يَنْبَاعُ مِنْ ذِفْرَى غَضُوبٍ جَسْرَةٍ"
second: "زَيَّافَةٍ مِثْلِ الْفَنِيقِ الْمُكْدَمِ"
meaning: "ذلك العرق يسيل من خلف أذن ناقة سريعة الغضب، طويلة جريئة، مسرعة في مشيها، كأنها فحل غليظ. قال الأَعْلَم الشَّنْتَمَرِيّ: «وقوله ينباع من ذفرى غضوب أي يسيل من ذفرى هذه الناقة» [@diwan-antara، ص205]. وقال الزَّوْزَنِيّ: «ينبع هذا العرق من خلف أذن ناقة غضوب موثقة الخلق شديدة التبختر» في سيرها [@zawzani، ص254]، «مثل فحل من الإبل قد كدمته الفحول» [@zawzani، ص255]."
vocabulary:
  - term: "يَنْبَاعُ"
    text: "يسيل. وفي أصله قولان. «قال أكثر أهل اللغة: ينباع معناه ينبع على مثال يفعل، من نبع الماء ينبع، فزاد الألف على الاتباع لفتحة الباء» [@ibn-al-anbari، ص332]. وقال أبو جَعْفَر: «هو ينفعل من باع يبوع، إذا مر مرا لينا فيه تلو»، «وأنكر أن يكون الأصل فيه ينبع» [@ibn-al-anbari، ص334]. وفي لسان العرب عنه: «يَنْباعُ يَنْفَعِلُ مِنْ بَاعَ يَبُوعُ إِذا جَرَى جَرْياً ليِّناً وتثَنَّى وتلَوَّى» [@lisan، ج8 ص23]."
  - term: "ذِفْرَى"
    text: "«و (الذفرى) ، والذفريان: الحيدان المشرفان وراء الأذنين، وهما عن يمين النقرة وشمالها. وأول شيء يعرق من البعير الذفريان» [@ibn-al-anbari، ص333]."
  - term: "غَضُوبٍ"
    text: "«و (الغضوب) والغضبى واحد، وهي المتزغمة» [@ibn-al-anbari، ص333]، أي الغاضبة النشيطة، قال التِّبْرِيزِيّ: «وغضوب للتكثير، كما يقال ظلوم وغشوم» [@tabrizi-ashr، ص195]."
  - term: "جَسْرَةٍ"
    text: "«و (الجسرة) : الطويلة» [@ibn-al-anbari، ص333]، «ويقال الجسر: الجسور التي لا يهولها شيء» [@ibn-al-anbari، ص334]."
  - term: "زَيَّافَةٍ"
    text: "«تزيف في مشيها: تسرع»، وقال أبو جَعْفَر: «الزيف والزيفان: أن تجمع قطريها من النشاط وتثب» [@ibn-al-anbari، ص334]."
  - term: "الْفَنِيقِ الْمُكْدَمِ"
    text: "«و (الفنيق) : الفحل الذي ودع من الركوب والحمل عليه. و (المكدم) : الغليظ، أراد أنها مذكرة» [@ibn-al-anbari، ص334]، أي أنها في خَلقها كالذكر. وفي لسان العرب: «وفَنِيقٌ مُكْدَمٌ أَيْ فَحْلٌ غَلِيظٌ، وَقِيلَ: صُلْب» [@lisan، ج12 ص510]."
syntax:
  - "فاعل «يَنْبَاعُ» ضمير يعود على ما شبّه به العرق في البيت السابق، أي الرُّبّ أو الكحيل، والمعنى للعرق، ولذلك قال الزَّوْزَنِيّ: «ينبع هذا العرق» [@zawzani، ص254]."
  - "«والغضوب مخفوضة لإضافة ذفرى إليها، والجسرة نعتها، وكذلك الزيافة ومثل، والفنيق مختفض بإضافة مثل إليه، والمكدم نعته» [@ibn-al-anbari، ص334]."
morphology:
  - "«يَنْبَاع» على القول الأول «يَنْبَعُ» أُشبعت فتحة بائه فتولدت منها ألف، قال الزَّوْزَنِيّ: «أراد ينبع فأشبع الفتحة لإقامة الوزن فتولدت من إشباعها ألف» [@zawzani، ص254]، ومثله عند ابن الأَنْبارِيّ قول الشاعر «فأنظور»: «أراد: فأنظر، فوصل الضمة بالواو» [@ibn-al-anbari، ص333]. وعلى القول الثاني هو «يَنْفَعِل» من «باع يبوع»، ولا إشباع فيه."
  - "«غَضُوب» صيغة مبالغة على «فَعُول»، و«زَيَّافَة» على «فَعّالَة»، و«الْمُكْدَم» اسم مفعول من «أَكْدَمَ»."
rhetoric:
  thesis: "آخر صورة للناقة: عرق يسيل من خلف أذنها، وصفات تتتابع كلها قوة: غضوب، جسرة، زيافة، كالفحل. ثم يترك الناقة إلى نفسه."
  devices:
    - title: "الإشباع في «يَنْبَاعُ»"
      text: "على قول أكثر أهل اللغة هو من الضرورة الشعرية، والضرورة: ما يجوز للشاعر من مخالفة القياس لإقامة الوزن. وفي لسان العرب: «فإِنما أَراد ينْبَع فأَشْبع فَتْحَةَ الْبَاءِ لِلضَّرُورَةِ فنشأَت بَعْدَهَا أَلف» [@lisan، ج8 ص345]. وعلى قول أبي جَعْفَر ليس ضرورة، بل لفظ يصوّر حركة: «إنما أراد السيلان وتلويه على رقبتها كتلوي الحية» [@ibn-al-anbari، ص334]."
    - title: "التشبيه في «مِثْلِ الْفَنِيقِ الْمُكْدَمِ»"
      text: "شبّه الناقة بالفحل، قال الزَّوْزَنِيّ: «شبهها بالفحل في تبخترها ووثاقة خلقها وضخمها» [@zawzani، ص255]. والناقة المذكَّرة عندهم أقوى على السفر."
    - title: "تتابع الصفات"
      text: "أربع صفات متوالية بلا عاطف: «غَضُوبٍ جَسْرَةٍ زَيَّافَةٍ مِثْلِ الْفَنِيقِ» [@ibn-al-anbari، ص332]، وكلها في القوة والنشاط، فيختم وصف الناقة بأشد ما فيها."
  connection: "ثم يلتفت إلى عَبْلة ويبدأ الفخر: «إِنْ تُغْدِفِي دُونِي الْقِنَاعَ فَإِنَّنِي» [@ibn-al-anbari، ص335]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يَنْبَاعُ مِنْ / ذِفْرَى غَضُو / بِنْ جَسْرَتِنْ = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — زَيْيَافَتِنْ / مِثْلِلْ فَنِي / قِلْمُكْدَمِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلات الست كلها، فصارت كلها «مُتْفاعلن»، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. فتوالت المقاطع الطويلة في بيت يصف ثقل الناقة وقوتها. والألف في «يَنْبَاعُ» داخلة في الوزن، فإن حُذفت انكسر."
context: "آخر أبيات الناقة (22–34)، وآخر المرحلة الثانية من القصيدة في المسار. وبعده يبدأ البيت 35 «إِنْ تُغْدِفِي دُونِي الْقِنَاعَ» خطابًا لعَبْلة عن نفسه، فيصير الشعر فخرًا إلى آخر القصيدة."
variants:
  - reading: "يَنْبَاعُ مِنْ ذِفْرَى غَضُوبٍ حُرَّةٍ ... زَيَّافَةٍ مِثْلِ الْفَنِيقِ الْمُقْرَمِ"
    status: "رواية الأَعْلَم"
    note: "هي رواية الأَعْلَم الشَّنْتَمَرِيّ [@diwan-antara، ص204]، وفي شرحه: «والحرة الكريمة»، «والمقرم الذي نحي عن الركوب واتخذ فحلا لكرمه» [@diwan-antara، ص205]. وينشده لسان العرب «الْفَنِيقِ الْمُقْرَمِ» في مادة «نبع» [@lisan، ج8 ص345]."
