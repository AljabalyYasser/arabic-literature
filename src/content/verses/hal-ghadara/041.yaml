first: "وَإِذَا صَحَوْتُ فَمَا أُقَصِّرُ عَنْ نَدًى"
second: "وَكَمَا عَلِمْتِ شَمَائِلِي وَتَكَرُّمِي"
meaning: "وإذا أفقت من سكري لم أقصّر في العطاء، وأخلاقي وكرمي كما عرفتِ. قال الزَّوْزَنِيّ: «أي يفارقني السكر ولا يفارقني الجود، ثم قال: وأخلاقي وتكرمي كما علمت أيتها الحبيبة» [@zawzani، ص256]."
vocabulary:
  - term: "صَحَوْتُ"
    text: "«ذهب سكرى. يقال: صحا السكران من سكره» [@ibn-al-anbari، ص339]."
  - term: "نَدًى"
    text: "العطاء. «ويقال: فلان أندى كفا من فلان، أي أسخى منه» [@ibn-al-anbari، ص340]. وعند الأَعْلَم: «والندى العطية» [@diwan-antara، ص207]."
  - term: "شَمَائِلِي"
    text: "«الأخلاق، واحدها شمال» [@ibn-al-anbari، ص340]."
context: "ثاني البيتين اللذين قرنهما النقاد (40–41). يقول التِّبْرِيزِيّ: «وجمع في هذين البيتين إنه يسخو على السكر والصحو» [@tabrizi-ashr، ص198]. وقد أوردهما ابن قُتَيْبَة مرة أخرى في ترجمة عَنْتَرَة بعد بيتي الذباب [@ibn-qutayba، ج1 ص246]. وبهما يختم الشاعر الحديث عن خلقه، ثم ينتقل إلى أفعاله في الحرب. والبيت عند الأَعْلَم 46 [@diwan-antara، ص207]، وعند الزَّوْزَنِيّ 40 [@zawzani، ص256]."
syntax:
  - "«والواو عطفت ما بعدها على ما قبلها، والفاء جواب إذا، وما جحد لا موضع لها» [@ibn-al-anbari، ص340]: أي «ما» نافية."
  - "«وقوله، وكما علمت شمائلي) معناه كعلمك شمائلي، أي ومثل علمك، فالكاف هاهنا بمعنى مثل» [@ibn-al-anbari، ص340]. فـ«شَمَائِلِي» مبتدأ مؤخر، و«كَمَا عَلِمْتِ» خبره المقدّم، و«ما» مصدرية: «وعلمت صلة ما، ولا عائد لها لأنها بمعنى المصدر» [@ibn-al-anbari، ص340]."
  - "«والتكرم نسق على الشمائل» [@ibn-al-anbari، ص340]."
morphology:
  - "أُقَصِّرُ مضارع قَصَّرَ على وزن فَعَّل، أي كفّ ونقص."
  - "تَكَرُّم مصدر تَكَرَّمَ على وزن تفعُّل، وفيه معنى التكلف والمداومة."
  - "نَدًى اسم مقصور، والتنوين فيه تنوين تمكين."
rhetoric:
  thesis: "يتم القسمة: سكران يجود، وصاحٍ يجود. فالجود فيه طبع لا يصنعه الشراب."
  devices:
    - title: "المقابلة بين «شَرِبْتُ» و«صَحَوْتُ»"
      text: "بنى البيتين على حالين متقابلين، الشرب والصحو، وجعل الجود في كليهما. وهذا ما رآه بعض النقاد فضيلة، فنقل المَرْزُبانيّ: «وإنما الجيد بيتا عنترة هذان؛ فخبّر أنّ جوده باق؛ لأنه لا يبلغ من الشراب ما يثلم عرضه» [@muwashshah، ص65]."
    - title: "الاحتراس"
      text: "الاحتراس أن يأتي الشاعر بما يدفع عن كلامه عيبًا قد يُظن فيه. فلو اقتصر على البيت الأول لظُنّ أن كرمه أثر من آثار الخمر، فاحترس بالثاني. وبهذا يفضّله المَرْزُبانيّ على طَرَفَة: «وقول عنترة أحسن؛ لأنه احترس من عيب الإعطاء على السكر وأن السكر زائد في سخائه» [@muwashshah، ص65]."
    - title: "ما أُخذ عليه"
      text: "لم يرض بعضهم بأن يقول المعنى في بيتين: «ثم قالوا: هو حسن جميل، إلا أنه أتى به في بيتين؛ هلّا قال كما قال امرؤ القيس» [@muwashshah، ص65]، ويريدون بيته «سَمَاحَةَ ذَا وَبِرَّ ذَا وَوَفَاءَ ذَا ... وَنَائِلَ ذَا إِذَا صَحَا وَإِذَا سَكِرْ» [@muwashshah، ص65]. ويروي ابن قُتَيْبَة في الموضع نفسه: «قالوا: والجيّد قول زهير» [@ibn-qutayba، ج1 ص191]، وهو «أخو ثقة لا تتلف الخمر ماله ... ولكنّه قد يتلف المال نائله» [@ibn-qutayba، ج1 ص191]: فالخمر لا تذهب بمال الممدوح، وإنما يذهب به عطاؤه."
  connection: "ثم يدع المجلس ويصف فعله في الحرب: زوج امرأة جميلة تركه صريعًا."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَإِذَا صَحَوْ / تُ فَمَا أُقَصْ / صِرُ عَنْ نَدَنْ = متَفاعلن / متَفاعلن / متَفاعلن — وَكَمَا عَلِمْ / تِ شَمَائِلِي / وَتَكَرْرُمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "جاء البيت كله تامًّا على الأصل، «متفاعلن» ست مرات بلا إضمار [@atiq، ص59]، فكثرت فيه الحركات المتوالية."
