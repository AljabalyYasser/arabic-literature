    note: "[@zawzani، ص264]. وفي حاشية محقق الأَعْلَم عن نسخة «ف»: «وروى أبو عبيدة: ولقد شفى نفسي وأذهب غمها» [@diwan-antara، ص219]."
  - reading: "قِيلُ الْفَوَارِسِ وَيْكَ عَنْتَرَ قَدِّمِ"
    status: "رواية الأَعْلَم"
    note: "قال: «قدم أي قدم الفرس، ويروى أقدم أي تقدم» [@diwan-antara، ص219]."
