first: "وَلَقَدْ شَفَى نَفْسِي وَأَبْرَأَ سُقْمَهَا"
second: "قِيلُ الْفَوَارِسِ وَيْكَ عَنْتَرَ أَقْدِمِ"
meaning: "ولقد شفى نفسي وأذهب مرضها قولُ الفرسان لي: ويحك يا عنترة، تقدّم. قال الزَّوْزَنِيّ: «يريد أن تعويل أصحابه عليه والتجاءهم إليه شفى نفسه ونفى غمه» [@zawzani، ص264]."
vocabulary:
  - term: "سُقْمَهَا"
    text: "مرضها. «يقال سُقم وسَقم، وعُدم وعَدم، وبُخْل وبَخَل» [@ibn-al-anbari، ص359]."
  - term: "قِيلُ"
    text: "القول."
  - term: "وَيْكَ"
    text: "كلمة تنبيه وزجر. قال ابن الأَنْبارِيّ: معناه ويلك، «فأسقط اللام» [@ibn-al-anbari، ص359]. وعند الأَعْلَم: «أراد ويلك، وقيل معنى وي تنبيه والكاف للخطاب» [@diwan-antara، ص219]."
  - term: "أَقْدِمِ"
    text: "تقدّم واحمل على العدو. «ومعنى (شفي نفسي) أي اشتفيت حيث قالوا لي أقدم فأقدمت» [@ibn-al-anbari، ص360]."
context: "ذروة مقطع الكرّة (67–74): ما كان يبحث عنه الفارس ليس الغنيمة بل هذا النداء. ويربطه أبو جعفر بخبر إلحاقه بنسب أبيه: «أصل هذا الفرح إنه أقر به أبوه، فلما قالوا (ويك عنتر أقدم)، والذي قال له أقدم أبوه»، فقال عَنْتَرَة: «(العبد لا يحسن الكر، إلا الحلب والصر)»، «فلما تخوف أن يذهب الحرم قال: أي بني أما ترى؟ قال: الآن نعم»، «فركب فرسه عريانا وأخذ قناته فرد الظعن وقتل من قتل» [@ibn-al-anbari، ص360]. وفي خبر ابن قُتَيْبَة أنه قاتل يومئذ «فادّعاه أبوه بعد ذلك، وألحق به نسبه» [@ibn-qutayba، ج1 ص244]. والخبر يُروى بصور مختلفة، وهو في أصله تفسير للبيت. ويأتي البيت عند الأَعْلَم والتِّبْرِيزِيّ بعد البيت 73 «والخيل تقتحم الخبار»، ورقمه عند الأَعْلَم 78 [@diwan-antara، ص219] [@tabrizi-ashr، ص213]، وعند الزَّوْزَنِيّ 70 بعد البيت 72 [@zawzani، ص264]."
syntax:
  - "«والقيل مرتفع بشفى. وأبرأ نسق على شفى» [@ibn-al-anbari، ص360]: فـ«قِيلُ» فاعل مؤخر، و«نَفْسِي» مفعول مقدم."
  - "«وموضع اقدم جزم على الامر، والياء صلة لكسر الميم، كما قال امرؤ القيس: ألاّ أيها الليل الطويلُ ألاَ انجلِي» [@ibn-al-anbari، ص360]: أي كُسرت الميم وأُشبعت للقافية."
  - "وجملة «وَيْكَ عَنْتَرَ أَقْدِمِ» مقول القول، في موضع جرّ بإضافة «قِيلُ» إليها [@ibn-al-anbari، ص360]."
morphology:
  - "«وعنتر فيه وجهان: فتح الراء وضمها» [@ibn-al-anbari، ص360]، وهو منادى مرخّم حُذف منه حرف النداء."
  - "أَقْدِمْ أمر من أَقْدَمَ الرباعي، فهمزته همزة قطع مفتوحة."
  - "ويرى التِّبْرِيزِيّ في «ويك» غير ما يراه ابن الأَنْبارِيّ: «والأحسن في هذا ما روى سيبويه عن الخليل، وهو أن وَيْ منفصلة، وهي كلمة يقولها المتندم إذا تنبه على ما كان منه» [@tabrizi-ashr، ص213]."
rhetoric:
  thesis: "شفاء الفارس كلمة من أصحابه: أن يُدعى باسمه ويُستنجد به. فالبيت يكشف ما وراء الفخر كله: حاجة إلى الاعتراف."
  devices:
    - title: "الاستعارة في «شَفَى نَفْسِي وَأَبْرَأَ سُقْمَهَا»"
      text: "جعل للنفس سقمًا يُشفى، وجعل الشافي قولًا. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]. والسقم الذي يُشفى هنا، على تفسير أبي جعفر، ما كان يجده من إنكار نسبه [@ibn-al-anbari، ص360]."
    - title: "الحكاية في «وَيْكَ عَنْتَرَ أَقْدِمِ»"
      text: "نقل كلامهم بلفظه، فدخل صوت الفرسان في البيت. وفسّر أبو جعفر تخصيصه بالنداء: «كنت أكثرهم، فلذلك خصوني بالدعاء» [@ibn-al-anbari، ص359]، وفي التِّبْرِيزِيّ «أكبرهم» [@tabrizi-ashr، ص213]."
  connection: "ثم يعود إلى الفرس: مال من وقع الرماح، وشكا إليه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَلَقَدْ شَفَى / نَفْسِي وَأَبْ / رَأَ سُقْمَهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — قِيلُلْ فَوَا / رِسِ وَيْكَ عَنْ / تَرَ أَقْدِمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الوسطى من الصدر، والأولى من العَجُز."
variants:
