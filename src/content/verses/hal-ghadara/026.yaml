first: "يَتْبَعْنَ قُلَّةَ رَأْسِهِ وَكَأَنَّهُ"
second: "حَرَجٌ عَلَى نَعْشٍ لَهُنَّ مُخَيَّمِ"
meaning: "تتبع صغار النعام أعلى رأس الظليم، وهو في طوله وإشرافه كأنه مركب نساء مرفوع على سرير، ضُربت عليه خيمة. قال ابن الأَنْبارِيّ: «يقول: إنها قد اتخذت عنقه ورأسه خيالا يتبعنه»، «فيقول: كأن الظليم حرج قد خيم لهن عليه» [@ibn-al-anbari، ص321]. وقال الزَّوْزَنِيّ: «أي جعلته نصب أعينها لا تنحرف عنه، ثم شبه خلقه بمركب من مراكب النساء جعل كالخيمة فوق مكان مرتفع» [@zawzani، ص252]."
vocabulary:
  - term: "قُلَّةَ رَأْسِهِ"
    text: "«وقلة كل شيء: أعلاه» [@ibn-al-anbari، ص321]."
  - term: "حَرَجٌ"
    text: "«والحرج: مركب من مراكب النساء، قال: وأصله النعش ثم صاروا يشبهون به المركب» [@ibn-al-anbari، ص321]. ويرويه المُفَضَّل باللفظ نفسه ويفسره بالخيال: «والحرج: الخيال» [@ibn-al-anbari، ص322]، والخيال هنا: شخص منصوب يُرى من بعيد فيُتّبع."
  - term: "نَعْشٍ"
    text: "سرير يُحمل عليه، ومنه سرير الميت، وفي لسان العرب: «حَتَّى سُمِّي سريرُ الْمَيِّتَ نَعْشاً» [@lisan، ج6 ص355]."
  - term: "مُخَيَّمِ"
    text: "«معناه جعل له خيمة» [@ibn-al-anbari، ص321]، وعند الزَّوْزَنِيّ: «المخيم: المجعول خيمة» [@zawzani، ص252]."
syntax:
  - "«وفي يتبعن ضمير النعام، والقلة منصوبة به، والهاء اسم كأن، وحرج خبرها، ومخيم نعت للنعش، وعلى صلة حرج، ولهن صلة مخيم» [@ibn-al-anbari، ص322]."
  - "وفي ظاهر البيت تكرار، لأن الحرج نفسه نعش. ويفسره ابن الأَنْبارِيّ بأن الأصل: كأنه حرج خُيّم لهن عليه، «ثم أظهر الهاء التي في عليه فقال نعش، لأن الحرج هو النعش، والنعش هو الحرج» [@ibn-al-anbari، ص321]؛ أي وضع الاسم الظاهر موضع الضمير."
morphology:
  - "«يَتْبَعْنَ» مضارع «تَبِعَ» مسند إلى نون النسوة، «يقال تبعته وأتبعته بمعنى واحد» [@ibn-al-anbari، ص321]."
  - "«مُخَيَّم» اسم مفعول من «خَيَّمَ» على «فَعَّلَ»، أي جُعل كالخيمة."
rhetoric:
  thesis: "الظليم من بعيد هيكل مرتفع يتبعه صغاره، كهودج على سرير. والصورة كلها عن الطول والإشراف: لذلك تتبعه العيون."
  devices:
    - title: "التشبيه المركب في «وَكَأَنَّهُ حَرَجٌ عَلَى نَعْشٍ ... مُخَيَّمِ»"
      text: "لم يشبّه الظليم بشيء واحد، بل بهيئة: مركب فوق سرير فوقه خيمة. وفصّلها أبو جَعْفَر: «جعل جسمه كالنعش، ورأسه وعنقه كالخيال» [@ibn-al-anbari، ص322]. ويقول عبد القاهر الجُرْجانيّ إن من التشبيه المركب ما «إذا فضضتَ تركيبَهُ وجدت أحد طرفيه يخرُج عن أن يصلح تشبيهاً» [@asrar، ص193]؛ وكذلك هنا: لو قلت إن الظليم خيمة وحدها لم يكن شيئًا، وإنما يصح الشبه بالهيئة كلها."
    - title: "«يَتْبَعْنَ قُلَّةَ رَأْسِهِ»"
      text: "لم يقل: يتبعن الظليم، بل أعلى رأسه، لأنه أول ما يُرى منه. وفي لسان العرب عن أبي العَبّاس ثَعْلَب: «إِنما وَصَفَ الرِّئالَ أَنها تَتْبَعُ النعامةَ فَتَطْمَحُ بأَبصارها قُلَّة رأْسِها» [@lisan، ج6 ص355]. والرِّئال: صغار النعام."
  connection: "ثم يصف الظليم نفسه، ويعود به إلى بيضه: «صَعْلٍ يَعُودُ بِذِي الْعُشَيْرَةِ بَيْضَهُ» [@ibn-al-anbari، ص322]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يَتْبَعْنَ قُلْ / لَةَ رَأْسِهِي / وَكَأَنْنَهُو = مُتْفاعلن / متَفاعلن / متَفاعلن — حَرَجُنْ عَلَى / نَعْشِنْ لَهُنْ / نَ مُخَيْيَمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار أولى الصدر وثانية العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُشبع الهاء في «رَأْسِهِ» و«كَأَنَّهُ»."
context: "من أبيات الظليم (24–27): بعد صورة القطيع حوله، يصف هيئته وهو يمشي أمامه."
variants:
  - reading: "وَكَأَنَّهُ زَوْجٌ عَلَى حَرَجٍ لَهُنَّ مُخَيَّمِ"
    status: "رواية الأَصْمَعِيّ والأَعْلَم"
    note: "«وروى الأصمعي: (كأنه زوج على حرج لهن)»، «و (الزوج) : النمط»، أي الثوب يُلقى على الهودج [@ibn-al-anbari، ص322]. وهي رواية الأَعْلَم الشَّنْتَمَرِيّ [@diwan-antara، ص200]، وفي شرحه: «والزوج النمط والحرج عيدان الهودج ويقال: هو سرير الموتى» [@diwan-antara، ص201]."
  - reading: "حِدْجٌ عَلَى نَعْشٍ لَهُنَّ مُخَيَّمِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«الحدج: مركب من مراكب النساء» [@zawzani، ص252]."
  - reading: "حَرَجٌ عَلَى نَعْشٍ لَهُنَّ مُخَيِّمِ"
    status: "رواية ثَعْلَب"
    note: "بكسر الياء، ففي لسان العرب عن أبي العَبّاس: «وَالرِّوَايَةُ مخيِّم، بِكَسْرِ الْيَاءِ؛ وَرَوَاهُ الباهِليّ: وكأَنه زَوْجٌ عَلَى نَعْشٍ لَهُنَّ مخيَّم» [@lisan، ج6 ص355]."
