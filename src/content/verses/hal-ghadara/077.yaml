first: "إِنْ يَفْعَلَا فَلَقَدْ تَرَكْتُ أَبَاهُمَا"
second: "جَزَرَ السِّبَاعِ وَكُلِّ نَسْرٍ قَشْعَمِ"
meaning: "إن يشتماني وينذرا دمي، فقد تركت أباهما طعامًا للسباع ولكل نسر هرم. قال الزَّوْزَنِيّ: «يقول: إن يشتماني لم أستغرب منهما ذلك؛ فإني قتلت أباهما وصيرته جزَر السباع وكل نسرٍ مُسِنٍّ» [@zawzani، ص265]."
vocabulary:
  - term: "جَزَرَ السِّبَاعِ"
    text: "«معناه هو مقتول لها تأكله» [@ibn-al-anbari، ص365]."
  - term: "قَشْعَمِ"
    text: "«الكبير من النسور» [@ibn-al-anbari، ص365]. ويقول الأَعْلَم: «والقشعم المسن. ومنه قيل للحرب إذا طالت أم قشعم» [@diwan-antara، ص222]."
context: "آخر أبيات ابنَي ضَمْضَم (75–77)، وبه تنتهي القصيدة عند الزَّوْزَنِيّ [@zawzani، ص265] والتِّبْرِيزِيّ [@tabrizi-ashr، ص215] والأَعْلَم [@diwan-antara، ص222]. ويبدو أن رواية أبي عمرو تنتهي عنده أيضًا، فبعده يقول ابن الأَنْبارِيّ: «وقال أبو محمد الرستمي: روى هذا البيت الذي فسرناه الأصمعي ولم يروه أبو عمرو» [@ibn-al-anbari، ص365]، ثم يأتي البيتان 78–79. وفي البيت يعود إلى صورة البيت 52: القتيل «جزر السباع». والبيت عند الأَعْلَم 85، وعند الزَّوْزَنِيّ 75، وأنشده ابن قُتَيْبَة مع البيتين قبله [@ibn-qutayba، ج1 ص246]."
syntax:
  - "«والفاء جواب إن، والأب اسم تركت، وجزر السباع خبره، وكل نسق على السباع» [@ibn-al-anbari، ص365]: أي «تَرَكْتُ» بمعنى صيّرت، نصب مفعولين، وسمّاهما ابن الأَنْبارِيّ اسمًا وخبرًا."
  - "و«يَفْعَلَا» فعل الشرط مجزوم بحذف النون، ومفعوله محذوف دلّ عليه البيت السابق، أي إن يفعلا الشتم والنذر [@ibn-al-anbari، ص365]."
morphology:
  - "يَفْعَلَا مضارع مسند إلى ألف الاثنين، مجزوم بحذف النون."
  - "قَشْعَم على وزن فَعْلَل، رباعي مجرد."
rhetoric:
  thesis: "يردّ على الكلام بالفعل: هما يشتمان وينذران، وهو قد قتل أباهما. فالبيت يختم الوعيد بحقيقة لا تُنكر."
  devices:
    - title: "التشبيه البليغ في «جَزَرَ السِّبَاعِ»"
      text: "جعل الأب جَزَرًا، أي ذبيحة، بلا أداة تشبيه، وهو من الضرب الذي «تجري اسم المشبه به خبرًا على المشبَّه» عند عبد القاهر الجُرْجانيّ [@dalail، ص68]."
    - title: "الإيجاز بالحذف في «إِنْ يَفْعَلَا»"
      text: "لم يكرر الشتم والنذر، بل اكتفى بـ«يفعلا»، فأوجز في ذكر فعلهما وأطال في ذكر فعله. وفسّره الأَعْلَم: «أي أن يشتما عرضي فلقد بلغت منهما الذي أردت بقتل أبيهما» [@diwan-antara، ص222]."
    - title: "التتميم في «وَكُلِّ نَسْرٍ قَشْعَمِ»"
      text: "لم يكتف بالسباع، فأضاف النسور الهرمة، فصار القتيل مشاعًا لسباع الأرض وطير السماء [@ibn-al-anbari، ص365]."
  connection: "ثم يلتفت في البيتين اللذين يرويهما الأصمعي وحده إلى عَبْلَة: يعتذر عن زيارتها بالحرب."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "إِنْ يَفْعَلَا / فَلَقَدْ تَرَكْ / تُ أَبَاهُمَا = مُتْفاعلن / متَفاعلن / متَفاعلن — جَزَرَسْ سِبَا / عِ وَكُلْلِ نَسْ / رِنْ قَشْعَمِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من الصدر، والأخيرة من العَجُز."
variants:
  - reading: "جَزَرًا لِخَامِعَةٍ وَنَسْرٍ قَشْعَمِ"
    status: "رواية الأَعْلَم"
    note: "قال: «والخامعة الضبع لأنها تخمع، ولذلك يقال: الضبع العرجاء» [@diwan-antara، ص222]، وتخمع: تعرج."
  - reading: "إِنْ يَعْقِرَا مُهْرِي فَإِنَّ أَبَاهُمَا ... جَزَرٌ لِخَامِعَةٍ وَنَسْرٍ قَشْعَمِ"
    status: "في نسخة «ف» من ديوان الأَعْلَم، بحسب حاشية المحقق"
    note: "[@diwan-antara، ص222]."
