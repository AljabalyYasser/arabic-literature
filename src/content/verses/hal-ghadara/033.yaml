first: "وَكَأَنَّ رُبًّا أَوْ كُحَيْلًا مُعْقَدًا"
second: "حَشَّ الْوَقُودُ بِهِ جَوَانِبَ قُمْقُمِ"
meaning: "كأن عرقها رُبٌّ أو قطران غليظ أُغلي في قِدر من نحاس، فأحاطت النار بجوانبها فهو يترشح منها. قال ابن الأَنْبارِيّ: «شبه العرق بالرب أو القطران، والقطران أسود. وعرق الإبل أول ما يخرج أسود، فإذا يبس اصفر» [@ibn-al-anbari، ص331]. وقال الزَّوْزَنِيّ: «شبه العرق السائل من رأسها وعنقها برُبٍّ أو قطران جعل في قمقم أوقدت عليه النار، فهو يترشح به عند الغليان» [@zawzani، ص254]."
vocabulary:
  - term: "رُبًّا"
    text: "«والرُّبُّ: الطِّلاءُ الخاثِر؛ وَقِيلَ: هُوَ دبْسُ كُلِّ ثَمَرَة» [@lisan، ج1 ص405]، أي عصير مطبوخ حتى يغلظ."
  - term: "كُحَيْلًا"
    text: "قال أبو جَعْفَر: «الكحيل: رديء القطران يضرب إلى الحمرة وليس بخالص السواد، ثم يسود إذا أعقد»، وقال غيره: «الكحيل: هناء يهنأ به الإبل من الجرب شبيه بالنفط» [@ibn-al-anbari، ص331]. وفي لسان العرب: «والكُحَيْل، مَبْنِيٌّ عَلَى التَّصْغِيرِ: الَّذِي تُطْلَى بِهِ الإِبل للجرَب» [@lisan، ج11 ص586]. والهِناء: القطران تُطلى به الإبل الجربى."
  - term: "مُعْقَدًا"
    text: "«الذي قد أوقد تحته حتى انعقد وغلظ» [@ibn-al-anbari، ص331]."
  - term: "حَشَّ"
    text: "أوقد، «حشّ النّار يحشها حشًا: أوقدها» [@zawzani، ص254]. وفي لسان العرب: «ويَحُشُّ النَّارَ إِذا ضَمَّ الْحَطَبَ عَلَيْهَا وأَوقَدَها» [@lisan، ج6 ص285]."
  - term: "الْوَقُودُ"
    text: "«الوقود بفتح الواو: الحطب؛ وبضم الواو: الاتقاد» [@ibn-al-anbari، ص331]."
  - term: "قُمْقُمِ"
    text: "إناء يُغلى فيه، وشبّه به رأسها، قال الزَّوْزَنِيّ: «وشبّه رأسها بالقمقم في الصلابة» [@zawzani، ص254]."
syntax:
  - "«والرب اسم كأن، والكحيل نسق عليه، ومعقدا نعت لكحيل، وخبر كأن ما عاد من الهاء في به، والجوانب منصوبة بحش» [@ibn-al-anbari، ص332]. أي أن خبر «كأنّ» جملة «حَشَّ الْوَقُودُ بِهِ جَوَانِبَ قُمْقُمِ»، والرابط الضمير في «بِهِ»."
  - "«وقوله (به) الباء حال، معناه وهو في القمقم» [@ibn-al-anbari، ص332]، أي أن الجار والمجرور في موضع الحال: أوقد جوانب القمقم والرُّبّ فيه. ويجيز التِّبْرِيزِيّ وجهًا آخر: «ويجوز أن يكون حش بمعنى احتش، أي اتقد»، «ويكون جوانب منصوبة على الظرف» [@tabrizi-ashr، ص194]."
morphology:
  - "«كُحَيْل» بلفظ التصغير، وهو عند لسان العرب «لَا يُسْتَعْمَلُ إِلَّا مصغَّراً» [@lisan، ج11 ص586]."
  - "«مُعْقَد» اسم مفعول من «أَعْقَدَ»، قال ابن الأَنْبارِيّ: «يقال: أعقدت العسل والدواء، بألف؛ وعقدت الحبل والعهد، بغير ألف» [@ibn-al-anbari، ص331]."
  - "«الْوَقُود» بالفتح اسم لما يوقد به، على وزن «فَعُول»، وبالضم مصدر."
rhetoric:
  thesis: "عرق الناقة أسود غليظ يتحدر من رأسها، فيراه الشاعر قطرانًا يغلي في قدر على النار. والصورة كلها حرارة وكثافة: علامة جهد عظيم."
  devices:
    - title: "التشبيه المركب"
      text: "لم يشبّه العرق بالقطران وحده، بل بهيئة: قطران يُغلى في قمقم فيترشح من جوانبه، والرأس هو القمقم. ويفصّل الزَّوْزَنِيّ الطرفين: العرق قطران، و«شبّه رأسها بالقمقم في الصلابة» [@zawzani، ص254]. والشبه فيه في هيئة متحركة، وهو ما يقول فيه عبد القاهر الجُرْجانيّ: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "التخيير في «رُبًّا أَوْ كُحَيْلًا»"
      text: "ذكر مشبهًا به ثم آخر بـ«أَوْ»، كأنه يبحث عن اللفظ الأدق للون العرق وغلظه. وقال ابن الأَنْبارِيّ في اللون: «وعرق الإبل أول ما يخرج أسود، فإذا يبس اصفر» [@ibn-al-anbari، ص331]."
    - title: "تأخير المشبه"
      text: "لم يذكر العرق في هذا البيت، وإنما يظهر في البيت التالي «يَنْبَاعُ مِنْ ذِفْرَى». فيبدأ بالصورة، ثم يقول ما هي، وهذا يشدّ السامع إلى البيت التالي."
  connection: "ثم يذكر موضع العرق من الناقة: «يَنْبَاعُ مِنْ ذِفْرَى غَضُوبٍ جَسْرَةٍ» [@ibn-al-anbari، ص332]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَكَأَنْنَ رُبْ / بَنْ أَوْ كُحَيْ / لَنْ مُعْقَدَنْ = متَفاعلن / مُتْفاعلن / مُتْفاعلن — حَشْشَلْ وَقُو / دُ بِهِي جَوَا / نِبَ قُمْقُمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار الثانية والثالثة من الصدر، والأولى من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُشبع كسرة الهاء في «بِهِ» فتُنطق «بِهِي»."
context: "من أبيات الناقة بعد الشرب (28–34): بعد البروك يصف عرقها، وهو علامة الجهد والسير الطويل. وهذا البيت والذي بعده بيتا العرق."
variants:
  - reading: "حَشَّ الْقِيَانُ بِهِ جَوَانِبَ قُمْقُمِ"
    status: "رواية أخرى"
    note: "«ويروى: (حش القيان به) . يقال للأمة قينة» [@ibn-al-anbari، ص332]. وهي رواية الأَعْلَم الشَّنْتَمَرِيّ، وفي شرحه: «ومعنى حش أوقد. والقيان الإماء» [@diwan-antara، ص204]."
  - reading: "حَشَّ الْوُقُودُ بِهِ جَوَانِبَ قُمْقُمِ"
    status: "اختيار أبي جَعْفَر"
    note: "بضم الواو، قال أبو جَعْفَر: «(حش الوقود) معناه اتقاد النار، وهو أجود وأحسن من الحطب» [@ibn-al-anbari، ص332]."
