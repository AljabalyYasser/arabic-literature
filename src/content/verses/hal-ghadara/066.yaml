first: "إِذْ يَتَّقُونَ بِيَ الْأَسِنَّةَ لَمْ أَخِمْ"
second: "عَنْهَا وَلَكِنِّي تَضَايَقَ مُقْدَمِي"
meaning: "حين جعلني أصحابي بينهم وبين أسنّة الأعداء، لم أجبن عنها، ولكن ضاق عليّ موضع الإقدام. قال الزَّوْزَنِيّ: «يقول: حين جعلني أصحابي حاجزًا بينهم وبين أسنة أعدائهم، أي قدموني وجعلوني في نحور أعدائهم، لم أجبن عن أسنتهم ولم أتأخر، ولكن قد تضايق موضع إقدامي، فتعذر التقدم فتأخرت لذلك» [@zawzani، ص263]."
vocabulary:
  - term: "يَتَّقُونَ بِيَ"
    text: "«معناه يجعلونني بينهم وبينها. يقال اتقاه بحقه، وتقاه بحقه، أي جعله بينه وبينه» [@ibn-al-anbari، ص357]."
  - term: "الْأَسِنَّةَ"
    text: "«جمع سنان. وهو الذي يطعن به» [@ibn-al-anbari، ص357]، أي نصل الرمح."
  - term: "أَخِمْ"
    text: "«معناه لم أنكل ولم أضعف. يقال خام يخيم، إذا ضعف وجبن» [@ibn-al-anbari، ص357]."
  - term: "مُقْدَمِي"
    text: "إقدامي أو موضع إقدامي. «معناه ضاق المكان الذي اقدم فيه، فصرت في مضيق من الأرض لا أستطيع أن أقدم فرسي فيه» [@ibn-al-anbari، ص357]."
context: "آخر مقطع عمرو ووصاة العم (63–66). وبعد هذا البيت يروي التِّبْرِيزِيّ ثلاثة أبيات يقول إنها «يقع في بعض الروايات»، أولها «لَمَّا سَمِعْتُ نِدَاءَ مُرَّةَ قَدْ عَلَا ... وَابْنَيْ رَبِيعَةَ فِي الْغُبَارِ الْأَقْتَمِ» [@tabrizi-ashr، ص210]، وليست عند ابن الأَنْبارِيّ ولا الأَعْلَم ولا الزَّوْزَنِيّ. وفي حاشية محقق الأَعْلَم أنها في نسخة «ف» وفي «منتهى الطلب» [@diwan-antara، ص216]. والبيت عند الأَعْلَم 71 [@diwan-antara، ص215]، وعند الزَّوْزَنِيّ 64 [@zawzani، ص262]."
syntax:
  - "«وإذ وقت للماضي، وأخم جزم بلم، علامة الجزم فيه سكون الميم، والياء سقطت لسكونها وسكون الميم» [@ibn-al-anbari، ص358]: فأصله أَخِيمُ، فلما جُزم حُذفت الياء لالتقاء الساكنين."
  - "«والياء اسم لكن، والخبر ما عاد من الياء في مقدمي، وموضع مقدمي رفع بتضايق» [@ibn-al-anbari، ص358]: أي جملة «تَضَايَقَ مُقْدَمِي» خبر «لكنّ»، و«مُقْدَمِي» فاعل «تَضَايَقَ»."
morphology:
  - "«والمقدم بمعنى الإقدام، كما تقول: الحمد لله ممسانا ومصبحنا، أي في إمسائنا وإصباحنا» [@ibn-al-anbari، ص358]: فهو مصدر ميمي من أَقْدَمَ. «ولا يجوز جري المقدِم بكسر الدال، لأن المقدِم لا يكون مصدرا» [@ibn-al-anbari، ص357]."
  - "تَضَايَقَ على وزن تفاعل بمعنى ضاق، «والعرب تقول للشيء معناه فعل: قد تفاعل»، «وكقولك: تطاول الليل، أي طال» [@ibn-al-anbari، ص357–358]."
rhetoric:
  thesis: "يجعل نفسه ترسًا لقومه، ثم يدفع عن نفسه ظنّ التأخر: لم يتأخر جبنًا، بل لأن الأرض ضاقت عن إقدامه."
  devices:
    - title: "الكناية في «يَتَّقُونَ بِيَ الْأَسِنَّةَ»"
      text: "جعلوه بينهم وبين الرماح، وهو كناية عن أنه أشجعهم وموضع ثقتهم. يقول الأَعْلَم: «أي يقدمونني للموت ويجعلونني بينهم وبين الرماح» [@diwan-antara، ص215]."
    - title: "الاستدراك في «وَلَكِنِّي تَضَايَقَ مُقْدَمِي»"
      text: "الاستدراك بـ«لكنّ» يدفع ما قد يُتوهم: فلو قيل إنه وقف، فالوقوف من ضيق المكان لا من الخوف [@ibn-al-anbari، ص357]. وهو احتراس يحفظ صورة الفارس بعد أن نفى عنه الجبن صراحة بقوله لم أخم."
  connection: "ثم يقصّ كرّته حين أقبل الأعداء يحرّض بعضهم بعضًا."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "إِذْ يَتْتَقُو / نَ بِيَلْ أَسِنْ / نَةَ لَمْ أَخِمْ = مُتْفاعلن / متَفاعلن / متَفاعلن — عَنْهَا وَلَا / كِنْنِي تَضَا / يَقَ مُقْدَمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من الصدر، والأوليين من العَجُز. وتُنطق لكنّي بمدّ اللام."
variants:
  - reading: "عَنْهَا وَلَوْ أَنِّي تَضَايَقَ مُقْدَمِي"
    status: "رواية الأَعْلَم"
    note: "قال: «لم أخم أي لم أجبن عنها، ولو تضايق (مقدمي أي) موضع أقدامي» [@diwan-antara، ص215]."
