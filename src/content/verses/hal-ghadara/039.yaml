first: "بِزُجَاجَةٍ صَفْرَاءَ ذَاتِ أَسِرَّةٍ"
second: "قُرِنَتْ بِأَزْهَرَ فِي الشِّمَالِ مُفَدَّمِ"
meaning: "شربتها في كأس من زجاج صفراء ذات خطوط، جُعلت إلى جانب إبريق أبيض في يد الساقي اليسرى، وعلى فم الإبريق خرقة. قال الزَّوْزَنِيّ: «يقول: شربتها بزجاجة صفراء عليها خطوط قرنتها بإبريق أبيض مسدود الرأس بالفدام لأصب الخمر من الإبريق في الزجاجة» [@zawzani، ص256]."
vocabulary:
  - term: "أَسِرَّةٍ"
    text: "خطوط. «قوله (ذات أسرة) معناه ذات طرائق وخطوط وتكسر. ويقال للخطوط التي في باطن الكف أسرة» [@ibn-al-anbari، ص338]."
  - term: "بِأَزْهَرَ"
    text: "«معناه جعلت مع إبريق أزهر، وهو الأبيض، يعنى إبريق فضة أو رصاص» [@ibn-al-anbari، ص338]."
  - term: "الشِّمَالِ"
    text: "اليد اليسرى، «يعني في شمال الساقي» [@diwan-antara، ص206]."
  - term: "مُفَدَّمِ"
    text: "«معناه مشدود فمه بخرقة» [@ibn-al-anbari، ص338]. وقال أبو جعفر: «معناه عليه الفدام يصفى به، كما تشرب الملوك» [@ibn-al-anbari، ص339]. والفِدام: الخرقة على فم الإبريق تُصفّى بها الخمر."
context: "يكمل مجلس الشراب: بعد الوقت والثمن، الآنية. وفي هذه التفاصيل ما يدل على أنه يشرب شرب الملوك، فقد قال أبو جعفر في الفدام: «كما تشرب الملوك» [@ibn-al-anbari، ص339]. وهو عند الأَعْلَم 44 [@diwan-antara، ص206]، وعند الزَّوْزَنِيّ 38 [@zawzani، ص256]."
syntax:
  - "«والباء في الزجاجة صلت للشراب، وصفراء نعت الزجاجة، وذات نعت الزجاجة أيضا» [@ibn-al-anbari، ص339]: أي «بِزُجَاجَةٍ» متعلق بـ«شَرِبْتُ» في البيت السابق. والباء هنا بمعنى «في» عند الأَعْلَم: «قوله: بزجاجة أي في زجاجة» [@diwan-antara، ص206]."
  - "«والباء الثانية صلة قرنت، وأزهر مختفض بالباء إلا إنه نصب لأنه لا يجري، ومفدم نعته، وفي صلة قرنت» [@ibn-al-anbari، ص339]: «لا يجري» في اصطلاح الكوفيين: ممنوع من الصرف."
  - "وجملة «قُرِنَتْ بِأَزْهَرَ» صفة رابعة للزجاجة [@ibn-al-anbari، ص339]."
morphology:
  - "«وواحد الأسرة سر وسرر. ويقال في الجمع القليل أسرة وأسرار... ويقال في الجمع الكثير أسارير» [@ibn-al-anbari، ص338]."
  - "أَزْهَر صفة على وزن أَفْعَل، ومؤنثه زَهْراء، ولذلك مُنع من الصرف فجُرّ بالفتحة. وصَفْرَاء على وزن فَعْلاء، ممنوعة من الصرف أيضًا."
  - "مُفَدَّم اسم مفعول من فَدَّمَ على وزن فَعَّل."
rhetoric:
  thesis: "صورة ملونة: زجاجة صفراء، وإبريق أبيض، وخطوط في الكأس، وخرقة على فم الإبريق. فالشاعر يرى المجلس بعين من يعرف أدوات الترف."
  devices:
    - title: "المجاز في «صَفْرَاءَ»"
      text: "الزجاجة لا لون لها، وإنما الصفرة للخمر فيها. يقول الأَعْلَم: «وجعل الزجاجة صفراء لصفرة الخمر» [@diwan-antara، ص206]. وينقل التِّبْرِيزِيّ القولين: «وقال ابن الأعرابي: يجوز أن يكون للخمر والزجاجة» [@tabrizi-ashr، ص197]. فوصف الإناء بلون ما فيه."
    - title: "الطباق في الألوان"
      text: "الصفرة في الزجاجة يقابلها البياض في «بِأَزْهَرَ»، وهو «الأبيض» [@ibn-al-anbari، ص338]. والطباق الجمع بين الشيء وضده، وهو هنا طباق في اللون يرسم المشهد."
  connection: "ثم يأتي بالبيتين اللذين يقصد إليهما من وصف الشراب: سكره وصحوه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "بِزُجَاجَتِنْ / صَفْرَاءَ ذَا / تِ أَسِرْرَتِنْ = متَفاعلن / مُتْفاعلن / متَفاعلن — قُرِنَتْ بِأَزْ / هَرَ فِشْشِمَا / لِ مُفَدْدَمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الثانية من الصدر وحدها، وجاء العَجُز تامًّا على الأصل."
