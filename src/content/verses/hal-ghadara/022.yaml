first: "هَلْ تُبْلِغَنِّي دَارَهَا شَدَنِيَّةٌ"
second: "لُعِنَتْ بِمَحْرُومِ الشَّرَابِ مُصَرَّمِ"
meaning: "هل تبلغني دارها ناقة من نوق شَدَن، دُعي عليها أن يجفّ ضرعها، فلا لبن فيه؟ قال الزَّوْزَنِيّ: «وإنما شرط هذا لتكون أقوى وأسمن وأصبر على معاناة شدائد الأسفار لأن كثرة الحمل والولادة تكسبها ضعفًا وهزالًا» [@zawzani، ص251]."
vocabulary:
  - term: "شَدَنِيَّةٌ"
    text: "«ناقة نسبت إلى أرض أو حي باليمن» [@ibn-al-anbari، ص317]. وعند الأَعْلَم الشَّنْتَمَرِيّ: «شدنية هي ناقة منسوبة إلى فحل يقال له شدن ويقال إلى موضع باليمن» [@diwan-antara، ص199]."
  - term: "لُعِنَتْ"
    text: "«دعى عليها في ضرعها لا تلقح ولا تحمل فهو أشد لها» [@ibn-al-anbari، ص317]. وقال خالِد بن كُلْثُوم: «لُعنت: نحيت عن الإبل لما عُلم إنها معقومة، فجعلت للركوب الذي لا يصلح له إلا مثلها» [@ibn-al-anbari، ص318]. وفي لسان العرب عن ابن الأَعْرابِيّ: «سُبَّتْ بِذَلِكَ فَقِيلَ أَخزاها اللَّهُ فَمَا لَهَا دَرٌّ وَلَا بِهَا لَبَنٌ» [@lisan، ج13 ص389]."
  - term: "بِمَحْرُومِ الشَّرَابِ"
    text: "«معناه لعنت في محروم الشراب، والمعنى لا شراب فيها، أي لا لبن بها» [@ibn-al-anbari، ص317]، قال الزَّوْزَنِيّ: «أراد بالشراب اللبن» [@zawzani، ص251]."
  - term: "مُصَرَّمِ"
    text: "المقطوع اللبن، قال أبو جَعْفَر: «المصرم: الذي يكوى رأس خلفه حتى ينقطع لبنه» [@ibn-al-anbari، ص318]، والخِلْف: حَلَمة الضرع. وفي لسان العرب: «وَقِيلَ: نَاقَةٌ مُصَرَّمةٌ وَهِيَ الَّتِي صَرَمَها الصِّرارُ فوَقَّذَها، وَرُبَّمَا صُرِمَتْ عَمْداً لتَسْمَنَ» [@lisan، ج12 ص338]، والصِّرار: خيط يُشدّ على الضرع."
syntax:
  - "«والشدنية مرتفعة بتبلغني، والدار منصوبة به، والنون دخلت في تبلغني من أجل الاستفهام، كما تقول: هل يقومن عبد الله؟ فتدخل النون مع هل لتوكيد المستقبل» [@ibn-al-anbari، ص318]."
  - "«واسم ما لم يسم فاعله مضمر في لعنت، أي لعنت الشدنية. والمصرم نعت لمحروم الشراب» [@ibn-al-anbari، ص318]. وجملة «لُعِنَتْ» صفة لـ«شَدَنِيَّةٌ». ويجيز التِّبْرِيزِيّ أن تكون «لعنت» دعاء، «ويجوز أن يكون غير دعاء، ويكون خبرا» [@tabrizi-ashr، ص189]."
morphology:
  - "«تُبْلِغَنِّي» مضارع «أَبْلَغَ» مؤكد بنون التوكيد الثقيلة، وبعدها ياء المتكلم، فاجتمعت النونات وأُدغمت."
  - "«شَدَنِيَّة» اسم منسوب إلى «شَدَن» بياء النسب المشددة. و«مُصَرَّم» اسم مفعول من «صَرَّمَ» على «فَعَّلَ»، والتضعيف للمبالغة في القطع."
rhetoric:
  thesis: "سؤال يحمل شوقًا: هل من ناقة تبلغني دارها؟ ثم يصف الناقة بعيب هو عندهم مدح: ضرع جاف، فقوتها كلها للسير."
  devices:
    - title: "الاستفهام في «هَلْ تُبْلِغَنِّي»"
      text: "استفهام يراد به التمني والشوق، لا طلب الجواب. ونون التوكيد فيه تقوّي الرجاء."
    - title: "الكناية في «لُعِنَتْ بِمَحْرُومِ الشَّرَابِ»"
      text: "ذكر الدعاء على ضرعها وأراد قوتها وصبرها، لأن الناقة التي لا تحمل ولا ترضع أقوى على السفر. وتفسيره عند الأَعْلَم أنها «سبت بضرعها كما يقال: لعنه الله ما أدهاه وما أشعره»، فهو دعاء «على طريق التعجب من قوتها» [@diwan-antara، ص199]. والكناية عند عبد القاهر الجُرْجانيّ أن يأتي المتكلم إلى معنى هو «تاليهِ ورِدْفُه في الوجود»، أي تابعه [@dalail، ص66]؛ والقوة تتبع جفاف الضرع."
    - title: "اللعن في معرض المدح"
      text: "«لُعِنَتْ» لفظ ذمّ يُراد به المدح، كما يقول العرب للشيء يعجبهم: قاتله الله. وهذا يفسّر لماذا اختار الشاعر لفظًا قاسيًا لناقة يرجو أن تبلغه حبيبته."
  connection: "ثم يصف سيرها: «خَطَّارَةٌ غِبَّ السُّرَى زَيَّافَةٌ» [@ibn-al-anbari، ص318]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "هَلْ تُبْلِغَنْ / نِي دَارَهَا / شَدَنِيْيَتُنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — لُعِنَتْ بِمَحْ / رُومِشْ شَرَا / بِ مُصَرْرَمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار الأوليين من الصدر، والثانية من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُدغم لام التعريف في الشين من «الشَّرَابِ» فتُنطق «رُومِشْشَرَابِ»."
context: "أول أبيات الناقة والظليم (22–27)، وهي الرحلة التي يقطعها الشاعر إلى صاحبته. والسؤال فيه إطار للوصف كله: الناقة التي يصفها إلى البيت 34 هي جواب «هَلْ تُبْلِغَنِّي». وقد ذكر ناقته أول مرة في البيت 3 واقفة في الدار، وهي هنا سائرة إلى الدار الجديدة."
variants:
  - reading: "لُعِنَتْ لِمَحْرُومِ الشَّرَابِ مُصَرَّمِ"
    status: "رواية أبي عَدْنان عن الأَصْمَعِيّ"
    note: "في لسان العرب: «وَرَوَاهُ أَبو عَدْنَانَ عَنِ الأَصمعي: لُعِنَتْ لِمَحْرُومِ الشَّرَابِ، وَقَالَ: يُرِيدُ بِقَوْلِهِ لِمَحْرُومِ الشَّرَابِ أَي قُذِفَت بِضَرْعٍ لَا لَبَنَ فِيهِ مُصَرَّم» [@lisan، ج13 ص389]."
