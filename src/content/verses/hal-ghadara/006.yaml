first: "حَلَّتْ بِأَرْضِ الزَّائِرِينَ فَأَصْبَحَتْ"
second: "عَسِرًا عَلَيَّ طِلَابُكِ ابْنَةَ مَخْرَمِ"
meaning: "نزلت صاحبته بأرض أعدائه، فصار طلبها عسيرًا عليه. قال الزَّوْزَنِيّ: «نزلت الحبيبة بأرض أعدائي فعسر عليّ طلبها» [@zawzani، ص246]. ثم يلتفت إليها فيخاطبها: يا ابنة مَخْرَم."
vocabulary:
  - term: "الزَّائِرِينَ"
    text: "«الأعداء يزئرون عليه من أجلها، وأصله من زئير الأسد» [@ibn-al-anbari، ص299]. وفي لسان العرب: «وَيُقَالُ لِلْعَدُوِّ: زائِرٌ، وَهُمُ الزائرُون» [@lisan، ج4 ص336]."
  - term: "عَسِرًا"
    text: "«والعسر الممتنع المتعذر» [@diwan-antara، ص187]."
  - term: "طِلَابُكِ"
    text: "«أي مطالبتي لك ومرامي إياك» [@diwan-antara، ص187]."
  - term: "ابْنَةَ مَخْرَمِ"
    text: "عَبْلة، نسبها إلى أبيها أو جدّها. قال التِّبْرِيزِيّ: «ومخرم: اسم رجل، وقيل: اسمه مخرمة، ثم رخم في غير النداء» [@tabrizi-ashr، ص180]."
syntax:
  - "في «أَصْبَحَتْ» ضمير عَبْلة، «ولفظ عسر خبر أصبحت، والطلاب مرتفع بمعنى عسر» [@ibn-al-anbari، ص300]، أي فاعل للصفة «عَسِرًا». ويجيز التِّبْرِيزِيّ وجهًا آخر: «ويجوز أن يكون عسر رفعا على إنه خبر الابتداء» [@tabrizi-ashr، ص180]."
  - "«ابْنَةَ مَخْرَمِ» منادى حُذف منه حرف النداء، «ونصب (ابنة مخرم) على إنه نداء مضاف» [@tabrizi-ashr، ص180]."
morphology:
  - "«الزَّائِرِينَ» جمع «زائر»، اسم فاعل من «زَأَرَ» إذا صاح صياح الأسد، وسُهّلت همزته في النطق."
  - "«مَخْرَم» عند التِّبْرِيزِيّ مرخَّم «مَخْرَمَة»، والترخيم حذف آخر الاسم، وأكثر ما يكون في النداء، ويجيء في الشعر في غيره."
  - "«طِلَاب» مصدر «طالَبَ» على وزن «فِعال»."
rhetoric:
  thesis: "الحب هنا في أرض العدو: صاحبته نزلت حيث لا يستطيع أن يأتي. وهذا أول ما يُظهر الحرب في القصيدة، قبل أن يقول صراحة إنه يقتل قومها."
  devices:
    - title: "الاستعارة في «الزَّائِرِينَ»"
      text: "سمّى الأعداء «الزائرين» من زئير الأسد، قال الزَّوْزَنِيّ: «جعلهم يزأرون زئير الأسد، شبه توعدهم وتهددهم بزئير الأسد» [@zawzani، ص246]. فلم يذكر الأسد، وأعطى أعداءه صوته، فصاروا أُسودًا تحرس صاحبته."
    - title: "الالتفات في «طِلَابُكِ»"
      text: "تحدث عنها غائبة في الصدر «حَلَّتْ»، ثم خاطبها في العجز «طِلَابُكِ». وسأل ابن الأَنْبارِيّ عن ذلك وأجاب: «العرب ترجع من الغيبة إلى الخطاب، ومن الخطاب إلى الغيبة» [@ibn-al-anbari، ص300]. وقال الأَعْلَم: «وخاطبها بقوله طلابك بعد أن أخبر عنها في صدر البيت، وهذا في الكلام والشعر كثير» [@diwan-antara، ص187]."
  connection: "ثم يكشف المفارقة كلها: «عُلِّقْتُهَا عَرَضًا وَأَقْتُلُ قَوْمَهَا» [@ibn-al-anbari، ص300]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "حَلْلَتْ بِأَرْ / ضِزْزَائِرِي / نَ فَأَصْبَحَتْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — عَسِرَنْ عَلَيْ / يَ طِلَابُكِبْ / نَةَ مَخْرَمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلتين الأوليين من الصدر، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]، وجاء العجز تامًّا. وتسقط همزة الوصل في «ابْنَةَ» فتتصل بما قبلها: «طِلَابُكِبْنَةَ»."
context: "آخر أبيات الدار. بعد التحية والخلاء يذكر أين صاحبته الآن: في أرض الأعداء. ومن هنا يدخل في قصة حبه، فيذكر في البيت 7 أنه يقاتل قومها."
variants:
  - reading: "شَطَّتْ مَزَارَ الْعَاشِقِينَ فَأَصْبَحَتْ"
    status: "رواية أبي عُبَيْدة والأَعْلَم"
    note: "يذكرها ابن الأَنْبارِيّ: «يعنى شطت عبلة مزار العاشقين. أي بعدت من مزارهم» [@ibn-al-anbari، ص299]، وينسبها التِّبْرِيزِيّ إلى أبي عُبَيْدة [@tabrizi-ashr، ص179]. وهي رواية الأَعْلَم [@diwan-antara، ص186]، وشرحه: «شطت مزار العاشقين أي بعدت بموضع زيارتهم أي صارت بحيث لا تزار لبعد دارها» [@diwan-antara، ص187]."
