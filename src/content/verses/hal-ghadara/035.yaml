first: "إِنْ تُغْدِفِي دُونِي الْقِنَاعَ فَإِنَّنِي"
second: "طَبٌّ بِأَخْذِ الْفَارِسِ الْمُسْتَلْئِمِ"
meaning: "إن تستري وجهك عني بقناعك، فإني حاذق بأخذ الفرسان الدارعين. قال ابن الأَنْبارِيّ: «معناه: أن نبت عينك عني فأغدفت دوني قناعك فإني حاذق بقتل الفرسان وأخذ الأقران» [@ibn-al-anbari، ص335]. وقال الزَّوْزَنِيّ: «أي لا ينبغي لك أن تزهدي فِيّ مع نجدتي وبأسي وشدة مراسي» [@zawzani، ص255]."
vocabulary:
  - term: "تُغْدِفِي"
    text: "«والإغداف: إرخاء القناع على الوجه والتستر. يقال: أغدف سترك، أي أرخه» [@ibn-al-anbari، ص335]."
  - term: "الْقِنَاعَ"
    text: "ما تغطي به المرأة رأسها ووجهها."
  - term: "طَبٌّ"
    text: "حاذق. «يقال رجل طب وطبيب، إذا كان حاذقا بالأمور» [@ibn-al-anbari، ص335]. وعند الأَعْلَم: «والطب الرفيق بالشيء العالم بمحاولته» [@diwan-antara، ص205]."
  - term: "الْمُسْتَلْئِمِ"
    text: "«اللابس اللأمة... واللأمة: الدرع» [@ibn-al-anbari، ص335]. ويقول الأَعْلَم: «ويقال: اللأمة السلاح كله» [@diwan-antara، ص205]."
context: "أول المرحلة الثانية من المعلقة: انتهى وصف الناقة في البيت 34، وهنا يلتفت إلى عَبْلَة فيخاطبها عن نفسه، ومن هذا البيت يصير الشعر فخرًا إلى آخر القصيدة. والأبيات 35–41 مقطع واحد: يطلب منها أن تعرف قدره، ويعدّد أخلاقه في الحرب والسلم والشرب. والبيت عند الأَعْلَم رقمه 40 [@diwan-antara، ص205]، وعند الزَّوْزَنِيّ 34 لأنه لا يروي البيت 31 [@zawzani، ص255]، وهو عند التِّبْرِيزِيّ في موضعه [@tabrizi-ashr، ص195]."
syntax:
  - "«وتغدفي مجزوم بإن علامة الجزم فيه سقوط النون، والفاء جواب الجزاء» [@ibn-al-anbari، ص335]: «إِنْ» حرف شرط، و«تُغْدِفِي» فعل الشرط، والياء فاعله، و«الْقِنَاعَ» مفعوله، و«دُونِي» ظرف."
  - "ياء المتكلم في «فَإِنَّنِي» اسم إنّ، «وطب خبر إن، والباء صلة طب، والأخذ مضاف إلى الفارس، والمستلم نعته» [@ibn-al-anbari، ص336]. وجملة «فَإِنَّنِي طَبٌّ» في موضع جواب الشرط [@ibn-al-anbari، ص335]."
morphology:
  - "«تُغْدِفِي» مضارع أَغْدَفَ الرباعي، ولذلك ضُمّ حرف المضارعة [@ibn-al-anbari، ص335]."
  - "«طَبٌّ» صفة على «فَعْل»، ومعها «طبيب» على «فعيل»؛ ومنه المثل الذي يرويه ابن الأَنْبارِيّ: «اعمل في حاجتي عمل من طب لمن حب»، «أي من حذق لمن أحب» [@ibn-al-anbari، ص335]."
  - "«الْمُسْتَلْئِمِ» اسم فاعل من اسْتَلْأَمَ على وزن استفعل: لبس اللأمة، وهي الدرع [@ibn-al-anbari، ص335]."
rhetoric:
  thesis: "يجيب الحجاب بالفروسية: إن أعرضتِ عني فاعرفي من تُعرضين عنه. فكأنه يقول: من يأخذ الفارس المدرّع لا يُستغنى عنه."
  devices:
    - title: "الكناية في «تُغْدِفِي دُونِي الْقِنَاعَ»"
      text: "إرخاء القناع كناية عن الإعراض والتستر منه، فهو عند ابن الأَنْبارِيّ أن «نبت عينك عني» [@ibn-al-anbari، ص335]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]: فلم يقل: إن أعرضتِ، بل ذكر الفعل الذي يتبع الإعراض."
    - title: "جواب الشرط بغير ما يُنتظر"
      text: "يُنتظر بعد «إن تغدفي» شكوى أو عتاب، فجاء الجواب «فإنني طب بأخذ الفارس». ويفسّر أبو جعفر هذه الصلة: «معناه أن تستري مني فإني أنا الحامي مثلك أن تسبى، فلم تسترين عن مثلي؟ يرغبها في نفسه» [@ibn-al-anbari، ص335]."
  connection: "ثم يطلب منها أن تثني عليه بما تعرف من خلقه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "إِنْ تُغْدِفِي / دُونِلْ قِنَا / عَ فَإِنْنَنِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن — طَبْبُنْ بِأَخْ / ذِلْ فَارِسِلْ / مُسْتَلْئِمِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "وزن الكامل «متَفاعلن» ست مرات، ويدخله كثيرًا الإضمار، وهو تسكين الثاني المتحرك، فتصير «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]. ودخل الإضمار هنا خمس تفعيلات من ست، فثقل البيت بالمقاطع الطويلة."
variants:
  - reading: "أَنْ تُغْدِفِي دُونِي الْقِنَاعَ"
    status: "في متن التِّبْرِيزِيّ"
    note: "بفتح الهمزة في المطبوع [@tabrizi-ashr، ص195]، وتفسيره كتفسير ابن الأَنْبارِيّ: «أن نبت عينك عنى فأغدفت دوني قناعك». والشرط بـ«إنْ» المكسورة أوفق لجزم الفعل."
