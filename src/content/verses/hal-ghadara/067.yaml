first: "لَمَّا رَأَيْتُ الْقَوْمَ أَقْبَلَ جَمْعُهُمْ"
second: "يَتَذَامَرُونَ كَرَرْتُ غَيْرَ مُذَمَّمِ"
meaning: "لما رأيت جمع الأعداء مقبلًا، يحرّض بعضهم بعضًا على القتال، كررت عليهم كرّة لا يُذمّ صاحبها. قال الزَّوْزَنِيّ: «يقول: لما رأيت جمع الأعداء قد أقبلوا نحونا يحض بعضهم بعضًا على قتالنا عطفت عليهم لقتالهم غير مذمم، أي محمود القتال غير مذمومه» [@zawzani، ص263]."
vocabulary:
  - term: "يَتَذَامَرُونَ"
    text: "«معناه يحرض بعضهم بعضا ويزجر بعضهم بعضا. يقال: ذمره يذمره ذمرا، إذا حضه» [@ibn-al-anbari، ص358]. وعند الأَعْلَم: «وأصل الذمر الصياح» [@diwan-antara، ص217]."
  - term: "كَرَرْتُ"
    text: "عطفت عليهم بعد انصراف، والكَرّ: الرجوع إلى القتال."
  - term: "مُذَمَّمِ"
    text: "المذموم مرة بعد مرة. وعند الأَعْلَم: «أي لم أقصر في كري فأذم وأشتم» [@diwan-antara، ص217]."
context: "أول مقطع الكرّة والأدهم (67–74)، وهو ذروة الفخر في القصيدة: كرّة الفارس، ونداء القوم باسمه، وفرسه يشكو الجراح. والبيت عند الأَعْلَم 72، وفي حاشية المحقق أن في إحدى النسخ «الخيل» مكان «القوم» [@diwan-antara، ص216]. وعند الزَّوْزَنِيّ 65 [@zawzani، ص263]. وعند التِّبْرِيزِيّ يأتي بعد الأبيات الثلاثة الزائدة التي فيها نداء مُرَّة وابنَي رَبِيعة [@tabrizi-ashr، ص210–211]."
syntax:
  - "«ولما وقت فيها طرف من الجزاء، والجمع يرتفعون بأقبل، ويتذامرون موضعه رفع في اللفظ بالياء وموضعه في التأويل نصب على الحال؛ والتقدير: أقبل جمعهم متذامرين» [@ibn-al-anbari، ص358]."
  - "«وكررت جواب لما، وغير مذمم نصب على الحال»، «وأقبل جمعهم حال للقوم، معناه: قد اقبل جمعهم» [@ibn-al-anbari، ص358]. ويقول التِّبْرِيزِيّ: «(قد) هاهنا محذوفة، أي قد أقبل جمعهم» [@tabrizi-ashr، ص211]."
morphology:
  - "يَتَذَامَرُونَ مضارع تَذَامَرَ على وزن تفاعل، وهو للمشاركة: كل واحد يحرّض الآخر. «التذامر تفاعل من الذمر وهو الحض على القتال» [@zawzani، ص263]."
  - "مُذَمَّم اسم مفعول من ذَمَّمَ على وزن فَعَّل، والتضعيف للتكثير."
rhetoric:
  thesis: "يقابل جمعًا كثيرًا يشجع بعضه بعضًا بفرد واحد يكرّ عليهم. فالكثرة عندهم تحتاج إلى التحريض، والشجاعة عنده لا تحتاج."
  devices:
    - title: "المقابلة بين «جَمْعُهُمْ يَتَذَامَرُونَ» و«كَرَرْتُ»"
      text: "الجمع في جانب، والمفرد في جانب. فهم يحتاجون إلى تحريض متبادل، وهو يكرّ وحده بلا محرّض [@ibn-al-anbari، ص358]."
    - title: "المدح بالنفي في «غَيْرَ مُذَمَّمِ»"
      text: "نفى الذم ليثبت الحمد: «أي محمود القتال غير مذمومه» [@zawzani، ص263]. والنفي هنا أقوى من الإثبات، لأنه يدفع كل ما يمكن أن يُعاب في الكرّة."
  connection: "ثم يأتي أشهر أبيات المقطع: القوم يدعونه باسمه، والرماح في صدر فرسه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "لَمْمَا رَأَيْ / تُلْ قَوْمَ أَقْ / بَلَ جَمْعُهُمْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — يَتَذَامَرُو / نَ كَرَرْتُ غَيْ / رَ مُذَمْمَمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، وجاء العَجُز تامًّا."
