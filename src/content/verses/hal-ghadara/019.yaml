first: "هَزِجًا يَحُكُّ ذِرَاعَهُ بِذِرَاعِهِ"
second: "قَدْحَ الْمُكِبِّ عَلَى الزِّنَادِ الْأَجْذَمِ"
meaning: "يغني الذباب بصوت سريع متتابع، ويحك إحدى ذراعيه بالأخرى، كأنه رجل مقطوع اليدين منكبّ على عودي الزند يقدح النار بذراعيه. قال الأَعْلَم الشَّنْتَمَرِيّ: «ومعنى البيت أنه شبه الذباب حين وقع في هذه الروضة فحك إحدى ذراعيه بالأخرى برجل مقطوع الكفين يوري زنادا فهو يمده بين ذراعيه إذ لم يكن له كفان يمره بينهما» [@diwan-antara، ص198]."
vocabulary:
  - term: "هَزِجًا"
    text: "«فالهزج: السريع المتدارك صوته» [@ibn-al-anbari، ص315]، قال التِّبْرِيزِيّ: «والهزج: خفة وتدارك» [@tabrizi-ashr، ص187]."
  - term: "يَحُكُّ ذِرَاعَهُ بِذِرَاعِهِ"
    text: "«أي يمر إحداهما على الأخرى» [@tabrizi-ashr، ص187]."
  - term: "قَدْحَ"
    text: "القدح: إخراج النار من الزند بالحكّ. وفي لسان العرب: «وَكُلُّ ذُباب أَقْدَحُ، وَلَا تَرَاهُ إِلا وكأَنه يَقْدَحُ بِيدَيْهِ» [@lisan، ج2 ص555]."
  - term: "الْمُكِبِّ"
    text: "«المكب: المقبل على الشيء» [@zawzani، ص250]، أي المنحني عليه."
  - term: "الزِّنَادِ"
    text: "عودان يُحكّ أحدهما بالآخر فتخرج النار، قال الأَعْلَم: «وأراد بالزناد الزند وهو العود الأعلى والزندة العود السفلى» [@diwan-antara، ص198]."
  - term: "الْأَجْذَمِ"
    text: "«والأجذم: المقطوع اليد» [@ibn-al-anbari، ص315]."
syntax:
  - "«والهزج منصوب بالرد على الغرد، والذراع منصوب بيحك، والقدح منصوب على المصدر» [@ibn-al-anbari، ص315]، أي أن «هَزِجًا» حال ثانية بعد «غَرِدًا» في البيت السابق، و«قَدْحَ» مفعول مطلق مبيّن للنوع. وجملة «يَحُكُّ» عند التِّبْرِيزِيّ «في موضع نصب على الحال» [@tabrizi-ashr، ص187]."
  - "وفي «الْأَجْذَمِ» قولان: «والأجذم نعت للمكب في قول قوم، ونعت للزناد في قول قوم آخرين. وعلى الزناد صلة المكب، أي قدح الذي أكب على الزناد» [@ibn-al-anbari، ص315]. فعلى الأول هو الرجل المقطوع اليد، وعلى الثاني الزند القصير، «فهو أشد لإكبابه عليه» [@ibn-al-anbari، ص315]."
morphology:
  - "«هَزِج» صفة على وزن «فَعِل». ويُروى بفتح الزاي مصدرًا، قال التِّبْرِيزِيّ: «وكسر الزاي أجود» [@tabrizi-ashr، ص187]."
  - "«الْمُكِبّ» اسم فاعل من «أَكَبَّ» على «أَفْعَلَ»، و«الْأَجْذَم» صفة على «أَفْعَل» من الجَذَم وهو القطع، و«الزِّنَاد» جمع «زَنْد»."
rhetoric:
  thesis: "أدق صورة في القصيدة: حركة صغيرة تراها العين في ذباب واقف، يجعلها الشاعر رجلًا بلا يدين يحاول أن يوقد نارًا."
  devices:
    - title: "التشبيه في هيئة الحركة: «قَدْحَ الْمُكِبِّ عَلَى الزِّنَادِ الْأَجْذَمِ»"
      text: "ليس الشبه في شكل الذباب ولا في لونه، بل في حركة: ذراعان تتحركان على شيء واحد بلا كفّين. ويقول عبد القاهر الجُرْجانيّ: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات»، ويمثل بقول الشاعر في الشمس «كالمرآةِ في كفِّ الأشل»، ويقول: «ولا يتحصل هذا الشبهُ إلا بأن تكون المرآة في يد الأشَلِّ» [@asrar، ص180]. وهنا مثله: لا يتحصل الشبه إلا بأن يكون القادح أجذم، لأن الذباب لا كفّ له، فهو يمرّ بالذراع على الذراع."
    - title: "تمام الصورة بين البيتين"
      text: "في البيت 18 صوت الذباب «كَفِعْلِ الشَّارِبِ»، وفي هذا البيت حركته «قَدْحَ الْمُكِبِّ». فالصورة صوت وحركة معًا، وقال الزَّوْزَنِيّ: «يصوّت الذباب حال حكِّه إحدى ذراعيه بالأخرى مثل قدح رجل ناقص اليد النار من الزندين» [@zawzani، ص250]."
    - title: "معنى لم يُسبق إليه"
      text: "يقول الأَعْلَم: «ويقال: إنه لم يقل في معنى هذا مثله» [@diwan-antara، ص198]. وينقل البَغْدادِيّ: «وَهَذَا من عَجِيب التَّشْبِيه يُقَال إِنَّه لم يقل أحد فِي مَعْنَاهُ مثله» [@khizana، ج1 ص127]، وأن أرباب الأدب عدّوه «من التشبيهات العقم وهي التي لم يسبق إليها ولا يقدر أحد عليها مشتق من الريح العقيم وهي التي لا تلقح شجرة ولا تنتج ثمرة» [@khizana، ج1 ص128]. أي أنها صورة لا تلد صورًا مثلها، فمن قلّدها قصّر عنها."
  connection: "ثم يترك الروضة ويعود إلى صاحبته: «تُمْسِي وَتُصْبِحُ فَوْقَ ظَهْرِ حَشِيَّةٍ» [@ibn-al-anbari، ص316]. قال الزَّوْزَنِيّ: «بالغ في وصف الروضة وأمعن في نعتها ليكون ريحها أطيب ثم عاد إلى النسيب» [@zawzani، ص250]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "هَزِجَنْ يَحُكْ / كُ ذِرَاعَهُو / بِذِرَاعِهِي = متَفاعلن / متَفاعلن / متَفاعلن — قَدْحَلْ مُكِبْ / بِ عَلَزْ زِنَا / دِلْأَجْذَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار الأولى والثالثة من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُشبع الهاء في «ذِرَاعَهُ» و«بِذِرَاعِهِ». وسقطت «بِذِرَاعِهِ» من الصدر في نسخة المكتبة الشاملة لشرح ابن الأَنْبارِيّ، فينكسر الوزن، وهي في شرحه نفسه: «وقوله (يحك ذراعه بذراعه)» [@ibn-al-anbari، ص315]، وفي التِّبْرِيزِيّ والزَّوْزَنِيّ، فأثبتناها."
context: "ثاني بيتي الذباب وآخر أبيات الروضة. وفي كتاب الحيوان للجاحظ شرح له: «فوصف الذّباب إذا كان واقعا ثمّ حكّ إحدى يديه بالأخرى، فشبّهه عند ذلك برجل مقطوع اليدين، يقدح بعودين. ومتى سقط الذّباب فهو يفعل ذلك» [@hayawan، ج3 ص150]. وأحكام القدماء في البيتين معًا مذكورة في البيت 18."
variants:
  - reading: "غَرِدًا يَسُنُّ ذِرَاعَهُ بِذِرَاعِهِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«وروى الأصمعي: (غردا يسن ذراعه بذراعه)» [@ibn-al-anbari، ص315]. وهي رواية الأَعْلَم، وفي شرحه: «وقوله: يسن أي يحدد ومنه سن السكين إذا أحدها» [@diwan-antara، ص198]."
  - reading: "فِعْلَ الْمُكِبِّ عَلَى الزِّنَادِ الْأَجْذَمِ"
    status: "رواية أخرى"
    note: "بها ينشده ابن قُتَيْبة [@ibn-qutayba، ج1 ص246]، والجاحِظ [@hayawan، ج3 ص65]، والأَعْلَم [@diwan-antara، ص198]، والبَغْدادِيّ [@khizana، ج1 ص127]."
