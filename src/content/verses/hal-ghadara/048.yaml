first: "وَمُدَجَّجٍ كَرِهَ الْكُمَاةُ نِزَالَهُ"
second: "لَا مُمْعِنٍ هَرَبًا وَلَا مُسْتَسْلِمِ"
meaning: "ورُبّ فارس تامّ السلاح، يكره الأبطال منازلته، لا يبعد في الفرار، ولا يُلقي سلاحه مستسلمًا. قال الزَّوْزَنِيّ: «يقول: ورب رجل تام السلاح كانت الأبطال تكره نزاله وقتاله لفرط بأسه وصدق مراسه» [@zawzani، ص258]."
vocabulary:
  - term: "مُدَجَّجٍ"
    text: "«الذي قد توارى بالسلاح، بكسر الجيم وفتحها» [@ibn-al-anbari، ص345]."
  - term: "نِزَالَهُ"
    text: "«معناه منازلته، وهو مصدر نازلته منازلة ونزالا» [@ibn-al-anbari، ص345]."
  - term: "مُمْعِنٍ هَرَبًا"
    text: "«معناه لا يمعن هربا فيذهب ويبعد، ولا هو مستسلم فيؤسر، ولكنه يقاتل» [@ibn-al-anbari، ص345]."
  - term: "مُسْتَسْلِمِ"
    text: "المنقاد الذي يُلقي بيده. وعند الأَعْلَم: «أي لم يلق بيده ولم يستسلم للموت» [@diwan-antara، ص209]."
context: "أول مقطع المدجّج (48–52)، وهو أطول مشاهد القتال في القصيدة: خصم كامل السلاح، ثم الطعنة، ثم مصيره. وقد أورد البغدادي الأبيات 48 و49 و51 متتابعة [@khizana، ج9 ص165]. والبيت عند الأَعْلَم 53 [@diwan-antara، ص209]، وعند الزَّوْزَنِيّ 47 [@zawzani، ص258]."
syntax:
  - "«والمدجج خفض بإضمار رب، وكره الكماة نزاله صلة المدجج» [@ibn-al-anbari، ص345]: الواو واو رُبّ، وجملة «كَرِهَ الْكُمَاةُ نِزَالَهُ» صفة له. وجواب رُبّ في البيت التالي: «والبيت جواب ربّ المضمر بعد الواو في: ومدجَّج» [@zawzani، ص258]."
  - "«وممعن ومستسلم مخفوضان على النعت لمدجج، ولا في معنى غير، كأنه قال غير ممعن هربا» [@ibn-al-anbari، ص345]. و«هَرَبًا» عند التِّبْرِيزِيّ «منصوب على المصدر؛ لأن معنى لا ممعن لا هارب، فصار مثل (لا يدعه تركا)» [@tabrizi-ashr، ص202]."
morphology:
  - "«وقد جاءت أحرف في لفظ الفاعل والمفعول هذا أحدها، ومنها قولهم: مخيَّس ومخيِّس، ورجل ملفَج وملفِج للفقير، وعبد مكاتَب ومكاتِب» [@ibn-al-anbari، ص345]: أي يقال مُدَجَّج ومُدَجِّج بمعنى واحد."
  - "مُمْعِن اسم فاعل من أَمْعَنَ الرباعي، ومُسْتَسْلِم اسم فاعل من اسْتَسْلَمَ على وزن استفعل."
rhetoric:
  thesis: "يمدح خصمه ليعظم انتصاره عليه. وهذا ما يقوله الأَعْلَم: «وإنما وصفه بالحزم في الحرب وأراد أنه وإن كان بهذه المنزلة وكان ممن تكره منازلته فإني لم أجبن عنه ولا هبته ولكني أقدمت عليه» [@diwan-antara، ص209]."
  devices:
    - title: "النفي المزدوج في «لَا مُمْعِنٍ هَرَبًا وَلَا مُسْتَسْلِمِ»"
      text: "نفى عن خصمه طرفي الضعف: الفرار البعيد، والاستسلام. فلم يبق له إلا القتال. ويحتج أبو جعفر بقول قيس بن الخَطِيم: «إِذَا مَا فَرَرْنَا كَانَ أَسْوَا فِرَارِنَا ... صُدُودَ الْخُدُودِ وَازْوِرَارَ الْمَنَاكِبِ» [@ibn-al-anbari، ص345]، أي إن انحرف فإنما ينحرف ليكرّ."
    - title: "الإيجاز بالحذف في «وَمُدَجَّجٍ»"
      text: "حذف الموصوف ورُبّ معًا، فبدأ بصفة الخصم الأولى، السلاح، قبل أن يذكر من هو."
  connection: "ثم يأتي جواب رُبّ: جادت يداه له بطعنة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمُدَجْجَجِنْ / كَرِهَلْ كُمَا / ةُ نِزَالَهُو = متَفاعلن / متَفاعلن / متَفاعلن — لَا مُمْعِنِنْ / هَرَبَنْ وَلَا / مُسْتَسْلِمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى والثالثة من العَجُز."
