first: "وَلَقَدْ خَشِيتُ بِأَنْ أَمُوتَ وَلَمْ تَكُنْ"
second: "لِلْحَرْبِ دَائِرَةٌ عَلَى ابْنَيْ ضَمْضَمِ"
meaning: "ولقد خفت أن أموت قبل أن تدور الحرب بالسوء على ابنَي ضَمْضَم. قال الزَّوْزَنِيّ: «يقول: ولقد أخاف أن أموت ولم تدر الحرب على ابني ضمضم بما يكرهانه، وهما حصين وهرم ابنا ضمضم» [@zawzani، ص265]."
vocabulary:
  - term: "دَائِرَةٌ"
    text: "«الدائرة: اسم للحادثة، سميت بها لأنها تدور من خير إلى شر ومن شر إلى خير ثم استعملت في المكروهة دون المحبوبة» [@zawzani، ص264]."
  - term: "ابْنَيْ ضَمْضَمِ"
    text: "«ابنا ضمضم: هرم وحصين ابنا ضمضم الذي قتله ورد بن حابس العبسي، وكان عنترة قتل أباهما ضمضما، فكانا يتواعدانه» [@ibn-al-anbari، ص363]. وعند ابن السِّكِّيت: «هما هرم وحُصين ابنا ضمضم المُريان» [@tabrizi-ashr، ص214]، أي من بني مُرّة من ذُبْيان."
context: "أول مقطع ابنَي ضَمْضَم (75–77)، وبه ترجع القصيدة إلى حرب داحس والغبراء. والخبر عن أبي عُبَيْدة عند ابن قُتَيْبَة: «وهو قتل ضمضما المرّىّ، أبا حصين بن ضمضم» [@ibn-qutayba، ج1 ص245] «وهرم بن ضمضم، فى حرب داحس والغبراء، وفى ذلك يقول» ثم أنشد الأبيات الثلاثة [@ibn-qutayba، ج1 ص246]. وأنشد ابن الأَنْبارِيّ هذا البيت في شرح معلقة زُهَيْر، في خبر قتل وَرْد بن حابِس العبسي هَرِمًا قبل الصلح، وأن أخاه حُصَيْنًا لم يدخل في الصلح وحلف ليقتلنّ رجلًا من عَبْس، فقتل رجلًا نزل به [@ibn-al-anbari، ص236]، وهو حُصَيْن الذي يذكره زُهَيْر في معلقته. وفي المطبوع هناك «هرم بن ضمضم المزني»، والصواب المُرّيّ كما عند ابن قُتَيْبَة وابن السِّكِّيت. ويسمّي الأَعْلَم الابنين حُصَيْنًا ومُرّة، في زيادة من إحدى النسخ: «وابنا ضمضم: حصين ومرة، وهما من ذبيان من بني مرة» [@diwan-antara، ص221]. فجوهر الخبر متفق عليه، والخلاف في اسم أحد الابنين. والبيت عند الأَعْلَم 83، وقبله عنده بيت ليس عند غيره: «وَلَقَدْ كَرَرْتُ الْمُهْرَ يَدْمَى نَحْرُهُ ... حَتَّى اتَّقَتْنِي الْخَيْلُ بِابْنَيْ حِذْيَمِ» [@diwan-antara، ص221]. وهو عند الزَّوْزَنِيّ 73 [@zawzani، ص264]."
syntax:
  - "«واللام في (لقد) لام اليمين، والباء موضعها نصب بخشيت، وهي مؤكدة للكلام؛ لأن سقوطها لا يخل بالمعنى. ألا ترى إنك لو قلت: (ولقد خشيت أن أموت) كان سائغا حسنا» [@ibn-al-anbari، ص363]: أي الباء زائدة، والمصدر المؤول مفعول «خَشِيتُ»."
  - "«والدائرة رفع بتكن، واللام خبر الكون، وعلى صلة دائرة، والواو في قوله: (ولم تكن) واو الحال» [@ibn-al-anbari، ص363]: أي «لِلْحَرْبِ» خبر «تكن» مقدم، و«دَائِرَةٌ» اسمها."
morphology:
  - "دَائِرَة اسم فاعل مؤنث من دار يدور، صار اسمًا للحادثة."
  - "ابْنَيْ مثنى ابن، حُذفت نونه للإضافة، وهمزته همزة وصل تسقط في النطق: عَلَبْنَيْ."
rhetoric:
  thesis: "خوف الفارس الوحيد ألا يدرك ثأره: لا يخاف الموت، بل يخاف أن يموت قبل أن ينال من عدويه."
  devices:
    - title: "الاستعارة في «لِلْحَرْبِ دَائِرَةٌ»"
      text: "جعل للحرب دائرة تدور على من تشاء، والدائرة في أصلها ما يحيط بالشيء. ويحتج التِّبْرِيزِيّ بقوله تعالى ﴿وَيَتَرَبَّصُ بِكُمُ الدَّوَائِرَ﴾، «يعني الموت أو القتل» [@tabrizi-ashr، ص214]."
    - title: "قلب المتوقع"
      text: "المنتظر من المتوعَّد أن يخاف من وعيده، فجعل نفسه هو الخائف، لكن خوفه أن يفوته قتلهما. فانقلب الوعيد عليهما."
  connection: "ثم يصفهما: يشتمانه ولم يشتمهما، وينذران دمه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَلَقَدْ خَشِي / تُ بِأَنْ أَمُو / تَ وَلَمْ تَكُنْ = متَفاعلن / متَفاعلن / متَفاعلن — لِلْحَرْبِ دَا / ئِرَتُنْ عَلَبْ / نَيْ ضَمْضَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى والثالثة من العَجُز."
