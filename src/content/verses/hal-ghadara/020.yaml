first: "تُمْسِي وَتُصْبِحُ فَوْقَ ظَهْرِ حَشِيَّةٍ"
second: "وَأَبِيتُ فَوْقَ سَرَاةِ أَدْهَمَ مُلْجَمِ"
meaning: "هي تمسي وتصبح على فراش وثير، وأنا أبيت على ظهر فرس أسود مُلجَم. قال ابن الأَنْبارِيّ: «أراد: تمسى عبلة وتصبح هكذا، أي هي منعمة موطأ لها الفرش والحشايا، وأبيت أنا على ظهر فرسي» [@ibn-al-anbari، ص316]. وقال أبو جَعْفَر: «معنى البيت اني تغيرني الخطوب والحروب والسمائم وهي لا تتغير؛ لأنها في كن ونعمة» [@ibn-al-anbari، ص316]."
vocabulary:
  - term: "حَشِيَّةٍ"
    text: "«الحشية من الثياب: ما حشي بقطن أو صوف أو غيرهما، والجمع الحشايا» [@zawzani، ص251]، أي الفراش المحشوّ."
  - term: "سَرَاةِ"
    text: "«وسراته: أعلاه. وسراة النهار: أوله» [@ibn-al-anbari، ص316]. وعند الأَعْلَم الشَّنْتَمَرِيّ: «والسراة الظهر. وسراة كل شيء أعلاه» [@diwan-antara، ص198]."
  - term: "أَدْهَمَ"
    text: "«و (الأدهم) : الأسود» [@ibn-al-anbari، ص316]، أي فرس أسود."
  - term: "مُلْجَمِ"
    text: "عليه لجامه، أي مهيّأ للركوب، قال الأَعْلَم: «وأبيت أنا على ظهر فرس ملجم معد للغارة في الصباح» [@diwan-antara، ص198]."
syntax:
  - "«واسم تمسى وتصبح مضمر فيهما من ذكر عبلة، والخبر فوق ظهر حشية» [@ibn-al-anbari، ص316]، فهما هنا فعلان ناقصان، وشبه الجملة «فَوْقَ ظَهْرِ حَشِيَّةٍ» خبرهما."
  - "«وأدهم موضعه خفض إلا إنه لا يجرى، للزيادة التي في أوله وهي الألف. وملجم نعت الأدهم» [@ibn-al-anbari، ص316]. أي أن «أَدْهَمَ» مجرور بالإضافة وعلامة جرّه الفتحة لأنه ممنوع من الصرف، لأنه صفة على وزن «أَفْعَل»."
  - "و«أَبِيتُ» فعل تام هنا بمعنى أقضي الليل، و«فَوْقَ» ظرف متعلق به."
morphology:
  - "«حَشِيَّة» على وزن «فَعِيلَة» بمعنى «مفعولة»، أي محشوّة، وجمعها «حَشايا»."
  - "«مُلْجَم» اسم مفعول من «أَلْجَمَ» على «أَفْعَلَ». و«أَدْهَم» صفة على «أَفْعَل» من الدُّهْمة، وهي السواد."
rhetoric:
  thesis: "بين الحشية والسرج حياتان: حياة امرأة منعّمة، وحياة فارس لا يفارق فرسه. والبيت شكوى عاشق، وهو في الوقت نفسه أول الفخر."
  devices:
    - title: "المقابلة بين الصدر والعجز"
      text: "«تُمْسِي وَتُصْبِحُ فَوْقَ ظَهْرِ حَشِيَّةٍ» في مقابل «وَأَبِيتُ فَوْقَ سَرَاةِ أَدْهَمَ». فالفعل يقابل الفعل، و«فَوْقَ» تتكرر، والحشية تقابل ظهر الفرس. قال الزَّوْزَنِيّ: «يقول: هي تتنعم وأنا أقاسي شدائد الأسفار والحروب» [@zawzani، ص250]."
    - title: "الكناية في «فَوْقَ ظَهْرِ حَشِيَّةٍ»"
      text: "لم يقل إنها منعّمة مخدومة، بل ذكر ما يلزم النعمة: لا تفارق فراشها. ويمثل عبد القاهر الجُرْجانيّ للكناية بقولهم في المرأة: «نَؤومُ الضُّحى»، «والمرادُ أنها مُتْرفةٌ مخَدْومة» [@dalail، ص66]. وكذلك هنا، وكذلك في العجز: المبيت على الفرس الملجم كناية عن حياة الغارات."
    - title: "الطباق في «تُمْسِي وَتُصْبِحُ»"
      text: "الطباق: الجمع بين الشيء وضده. والمساء والصباح يجمعان اليوم كله، فهي على فراشها في كل وقت."
  connection: "ثم يفسّر مبيته على الفرس: «وَحَشِيَّتِي سَرْجٌ عَلَى عَبْلِ الشَّوَى» [@ibn-al-anbari، ص316]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "تُمْسِي وَتُصْ / بِحُ فَوْقَ ظَهْ / رِ حَشِيْيَتِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — وَأَبِيتُ فَوْ / قَ سَرَاةِ أَدْ / هَمَ مُلْجَمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار أولى الصدر وحدها، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]، وجاء العجز تامًّا."
context: "أول بيتي عَبْلة المنعّمة والفارس (20–21). يعود فيه إلى صاحبته بعد الروضة، قال الأَعْلَم: «وقوله: تمسي وتصبح رجع إلى وصف المرأة» [@diwan-antara، ص198]. وفيه يظهر الفرس لأول مرة، وسيعود الأدهم في أبيات الكرّة (67–74)."
variants:
  - reading: "وَأَبِيتُ فَوْقَ سَرَاةِ أَجْرَدَ مُلْجَمِ"
    status: "رواية أخرى"
    note: "«ويروى: (أجرد ملجم) ، والأجرد: القصير الشعر من الخيل؛ وطول الشعر هجنة» [@ibn-al-anbari، ص316]، والهُجْنة: العيب، فقِصَر الشعر من صفات الخيل الكريمة."
  - reading: "تُمْسِي وَتُصْبِحُ فَوْقَ ظَهْرِ فِرَاشِهَا ... وَأَبِيتُ فَوْقَ سَرَاةِ أَجْرَدَ صِلْدِمِ"
    status: "رواية أخرى"
    note: "يذكر التِّبْرِيزِيّ الروايتين: «ويروى (فوق ظهر فراشها) ويروى (فوق سراة أجرد صلدم) وهو الشديد» [@tabrizi-ashr، ص188]."
