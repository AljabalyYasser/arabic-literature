first: "جَادَتْ عَلَيْهِ كُلُّ بِكْرٍ ثَرَّةٍ"
second: "فَتَرَكْنَ كُلَّ حَدِيقَةٍ كَالدِّرْهَمِ"
meaning: "أمطرت على ذلك الموضع كل سحابة من أول المطر غزيرة، فتركت كل حديقة فيه ممتلئة بالماء مستديرة لامعة كالدرهم. قال الزَّوْزَنِيّ: «مطرت على هذه الروضة كل سحابة سابقة المطر لا برد معها، أو كل مطر يدوم أيامًا ويكثر ماؤه حتى تركت كل حفرة كالدرهم، لاستدارتها بالماء وبياض مائها وصفائه» [@zawzani، ص250]."
vocabulary:
  - term: "جَادَتْ"
    text: "«أصابته بالجود، أي بالمطر الجود»، «والجود من المطر: الذي يروى كل شيء ويرضى أهله» [@ibn-al-anbari، ص312]."
  - term: "عَلَيْهِ"
    text: "«معناه على المكان» [@ibn-al-anbari، ص312]، أي موضع الروضة."
  - term: "بِكْرٍ"
    text: "«معناه أنها من أول المطر. والباكورة: أول الفاكهة» [@ibn-al-anbari، ص312]. وعند الزَّوْزَنِيّ: «البَكر من السحاب: السابق مطره» [@zawzani، ص249]."
  - term: "ثَرَّةٍ"
    text: "«كثيرة المطر دائمته. والثرارة: سعة الشخب. يقال ناقة ثرة وشاة ثرة، إذا كانتا واسعتي الإحليل» [@ibn-al-anbari، ص312]، والشَّخْب: ما يخرج من الضرع من اللبن."
  - term: "حَدِيقَةٍ"
    text: "قال يَعْقُوب: كل «روضة مستديرة فيها نبت فهي حديقة» [@ibn-al-anbari، ص312–313]. وفي لسان العرب: «وَقِيلَ: الحَدِيقةُ كُلُّ أَرض ذَاتِ شَجَرٍ مُثمر وَنَخْلٍ» [@lisan، ج10 ص39]."
  - term: "كَالدِّرْهَمِ"
    text: "«معناه إنها امتلأت كلها فكأن استدارتها بالماء استدارة الدرهم، وليس إنها كقدر الدرهم في السعة» [@ibn-al-anbari، ص313]."
syntax:
  - "«وكل رفع بفعلها. وثرة نعت للبكر. ويجوز رفع ثرة على النعت لكل. وما في تركن يعود على كل بكر، لأن كلا في معنى جمع» [@ibn-al-anbari، ص313]. أي أن نون النسوة في «تَرَكْنَ» تعود على السحائب، حملًا على معنى «كُلُّ» لا على لفظه."
  - "والضمير في «عَلَيْهِ» مذكر وهو للموضع لا للروضة، قال التِّبْرِيزِيّ: «والهاء في (عليه) ضمير الموضع» [@tabrizi-ashr، ص186]. و«كُلَّ حَدِيقَةٍ» مفعول به، و«كَالدِّرْهَمِ» في موضع المفعول الثاني لـ«تَرَكَ»."
morphology:
  - "«ثَرَّة» صفة من «ثَرَّ» المضاعف، ومنه «الثَّرارة»، والثَّرْثار بمعناه."
  - "«حَدِيقَة» على وزن «فَعِيلَة»، وجمعها «حَدائق»."
rhetoric:
  thesis: "مطر يملأ كل منخفض حتى يصير كل موضع منه قطعة فضة مستديرة. وهو يمهّد لصورة الذباب: روضة مخصبة لا يزاحمه فيها أحد."
  devices:
    - title: "لغة الإبل في «بِكْرٍ ثَرَّةٍ»"
      text: "البِكر من الإبل أول ما تلد، والثَّرّة الواسعة الضرع، كما يقول ابن الأَنْبارِيّ في الثرة: «يقال ناقة ثرة وشاة ثرة» [@ibn-al-anbari، ص312]. فوصف السحابة بما توصف به الناقة الحلوب، كأن المطر لبن تدرّه السماء على الروضة. وهذه قراءتنا للفظين."
    - title: "التشبيه في «كَالدِّرْهَمِ»"
      text: "ليس الشبه في الحجم بل في الاستدارة واللمعان. قال ابن الأَنْبارِيّ: «والعرب تشبه الشيء بالشيء ولا تريد به كل ذلك الشيء، إنما تشبهه ببعضه» [@ibn-al-anbari، ص313]. وهذا ما يجعله عبد القاهر الجُرْجانيّ من التشبيه البيّن: «تشبيهُ الشيّ بالشيء من جهة الصُّورة والشكل، نحو أن يشبَّه الشيء إذا استدار بالكرة في وجه، وبالحلقة في وجه آخر» [@asrar، ص90]. ويذكر التِّبْرِيزِيّ وجهين: البياض، والاستدارة وهو «قول الأصمعي» [@tabrizi-ashr، ص186]."
  connection: "ثم يصف دوام هذا المطر: «سَحًّا وَتَسْكَابًا فَكُلَّ عَشِيَّةٍ» [@ibn-al-anbari، ص313]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "جَادَتْ عَلَيْ / هِي كُلْلُ بِكْ / رِنْ ثَرْرَتِنْ = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — فَتَرَكْنَ كُلْ / لَ حَدِيقَتِنْ / كَدْدِرْهَمِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلات الثلاث من الصدر وآخر العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُشبع كسرة الهاء في «عَلَيْهِ» فتُنطق «عَلَيْهِي»، وبها تتم التفعيلة الثانية."
context: "من أبيات الروضة (15–19): بعد أن وصف الروضة بما ليس فيها، يصف المطر الذي أنبتها. وقال أبو جَعْفَر في الجمع بين هذا المطر الغزير و«غيث قليل الدمن» في البيت السابق: إنها جادت عليه «حتى أنبتته وبلغت به، ثم جلاه بعد ذلك هذا الغيث القليل الدمن، أي اللبث، فحسن وطاب ريحه» [@ibn-al-anbari، ص312]."
variants:
  - reading: "جَادَتْ عَلَيْهِ كُلُّ عَيْنٍ ثَرَّةٍ ... فَتَرَكْنَ كُلَّ قَرَارَةٍ كَالدِّرْهَمِ"
    status: "رواية أخرى"
    note: "يذكرها ابن الأَنْبارِيّ، «والعين: مطر أيام لا يقلع، خمسة أو ستة أو نحو ذلك» [@ibn-al-anbari، ص312]، «و (القرارة) : مستقر الماء في بطن الوادي» [@ibn-al-anbari، ص313]. وعند الأَعْلَم «جَادَتْ عَلَيْهَا كُلُّ عَيْنٍ ثَرَّةٍ ... فَتَرَكْنَ كُلَّ حَدِيقَةٍ» [@diwan-antara، ص196]."
  - reading: "جَادَتْ عَلَيْهِ كُلُّ بِكْرٍ حُرَّةٍ ... فَتَرَكْنَ كُلَّ قَرَارَةٍ كَالدِّرْهَمِ"
    status: "رواية الزَّوْزَنِيّ والتِّبْرِيزِيّ"
    note: "وفسّر الزَّوْزَنِيّ الحُرّة: «الحُرَّة: الخالصة من البرد والريح» [@zawzani، ص249]، والتِّبْرِيزِيّ: «والحُرَّة: البيضاء، وقيل: الخالصة» [@tabrizi-ashr، ص186]. وبها يورده قُدامة بن جعفر [@naqd-al-shir، ص66] وأبو هلال العَسْكَرِيّ [@sinaatayn، ص282]، وينشده لسان العرب «بِكْرٍ حُرَّةٍ» مع «حديقة» [@lisan، ج10 ص39]."
