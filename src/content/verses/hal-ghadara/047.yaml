first: "يُخْبِرْكِ مَنْ شَهِدَ الْوَقِيعَةَ أَنَّنِي"
second: "أَغْشَى الْوَغَى وَأَعِفُّ عِنْدَ الْمَغْنَمِ"
meaning: "إن تسألي يخبرك من حضر الحرب أني أدخل القتال، فإذا جاءت الغنيمة كففت عنها. قال ابن الأَنْبارِيّ: «فيقول: آتى الحرب ولى فيها غناء، فإذا كانت الغنيمة كففت وعففت» [@ibn-al-anbari، ص345]."
vocabulary:
  - term: "الْوَقِيعَةَ"
    text: "الحرب. «الوقيعة والوقعة سواء» [@ibn-al-anbari، ص344]."
  - term: "أَغْشَى"
    text: "آتي وأدخل."
  - term: "الْوَغَى"
    text: "«والوغى والوعي والوحي: الصوت في الحرب» [@ibn-al-anbari، ص344]. وقال الزَّوْزَنِيّ: «الوغى: أصوات أهل الحرب ثم استعير للحرب» [@zawzani، ص258]."
  - term: "أَعِفُّ"
    text: "أكفّ. قال أبو جعفر: «معناه لا تشره نفسي إلى الغنيمة، ولكني أهب نصيبي للناس» [@ibn-al-anbari، ص345]."
context: "جواب سؤاله في البيت 44، وبه يتم المقطع (44–47). ومعناه قريب مما يُروى عن عَنْتَرَة في الخبر الذي قيلت فيه المعلقة، حين ردّ على من عيّره: «وإنى لأحتضر البأس، وأوفى المغنم، وأعفّ عن المسألة» [@ibn-qutayba، ج1 ص244]. وجعله المبرِّد مثلًا لـ«ألفاظ العرب البينة القربية المفهمة، الحسنة الوصف، الجميلة الرصف» [@kamil، ج1 ص27]. والبيت عند الأَعْلَم 52 [@diwan-antara، ص209]، وعند الزَّوْزَنِيّ 46 [@zawzani، ص258]."
syntax:
  - "«ويخبرك موضعه جزم على جواب الجزاء المقدر، كأنه قال: هلا سألت الخيل، أن تسألي يخبرك» [@ibn-al-anbari، ص345]. ويقول الزَّوْزَنِيّ: «يخبرك: مجزوم لأنه جواب هلا سألت» [@zawzani، ص258]."
  - "«وموضع أن نصب بيخبرك، وخبر أن ما عاد من أغشى، وأغشى مرتفع بالألف، وأعف نسق عليه» [@ibn-al-anbari، ص345]: أي المصدر المؤول من «أَنَّنِي أَغْشَى» مفعول ثانٍ لـ«يُخْبِرْكِ»."
morphology:
  - "يُخْبِر مضارع أَخْبَرَ الرباعي، مجزوم بالسكون. وأَعِفُّ مضارع عَفَّ المضعّف؛ «يقال: عف يعف عفافا وعفة وعفافة» [@ibn-al-anbari، ص345]."
  - "المَغْنَم مصدر ميمي من غَنِمَ، أو اسم مكان: موضع الغنيمة؛ «المغنم والغُنْمُ والغنيمة واحد» [@zawzani، ص258]."
rhetoric:
  thesis: "بيت يجمع خلقين قلّما يجتمعان: الإقدام عند الخطر، والكفّ عند الربح. فالحرب عنده للشرف لا للغنيمة."
  devices:
    - title: "المقابلة في «أَغْشَى الْوَغَى وَأَعِفُّ عِنْدَ الْمَغْنَمِ»"
      text: "قابل الإقدام بالكفّ، والوغى بالمغنم: يتقدم حيث يتأخر الناس، ويتأخر حيث يتقدمون. وفسّره الأَعْلَم: «إذا غنمت شيئًا تركته لأصحابي، ويقال: معنى أعف لا أستأثر بشيء من الغنيمة دون أصحابي» [@diwan-antara، ص209]."
    - title: "المجاز في «الْوَغَى»"
      text: "الوغى في الأصل الصوت، ثم سُميت به الحرب لأن الصوت يكون فيها: «ثم استعير للحرب» [@zawzani، ص258]. وتسمية الشيء بما يلازمه مجاز علاقته الملازمة."
    - title: "الاحتكام إلى الشاهد"
      text: "لم يقل «إنني أغشى الوغى»، بل جعل غيره يقولها: «يخبرك من شهد الوقيعة»، فصار فخره شهادة حاضر لا دعوى غائب [@ibn-al-anbari، ص344]."
  connection: "ثم يأتي بمثال: فارس مدجّج تهابه الأبطال."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يُخْبِرْكِ مَنْ / شَهِدَلْ وَقِي / عَةَ أَنْنَنِي = مُتْفاعلن / متَفاعلن / متَفاعلن — أَغْشَلْ وَغَى / وَأَعِفْفُ عِنْ / دَلْ مَغْنَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز."
