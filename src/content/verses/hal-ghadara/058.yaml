first: "بَطَلٍ كَأَنَّ ثِيَابَهُ فِي سَرْحَةٍ"
second: "يُحْذَى نِعَالَ السِّبْتِ لَيْسَ بِتَوْأَمِ"
meaning: "شجاع طويل، كأن ثيابه معلقة على شجرة عالية، ينتعل نعال السِّبت، ولم يزاحمه في بطن أمه توأم. قال ابن الأَنْبارِيّ: «يقول: هو طويل من الرجال تام، فكأن ثيابه التي هي عليه، إنما هي على سرحة من طوله» [@ibn-al-anbari، ص352]."
vocabulary:
  - term: "بَطَلٍ"
    text: "الشجاع، وعند الأَعْلَم: «البطل الشجاع الذي تبطل عنده شجاعة غيره» [@diwan-antara، ص212]."
  - term: "سَرْحَةٍ"
    text: "«الشجرة الطويلة؛ وجمعها سرح» [@ibn-al-anbari، ص352]."
  - term: "يُحْذَى"
    text: "يُلبَس الحذاء، أي يُجعل له نعل [@zawzani، ص260]."
  - term: "السِّبْتِ"
    text: "«جلود البقر إذا دبغت بالقرظ، فإن لم تدبغ بالقرظ فليست بسبت» [@ibn-al-anbari، ص352]. والقَرَظ: ورق شجر يُدبغ به."
  - term: "تَوْأَمِ"
    text: "«يقال: هو توأم، إذا ولد معه آخر» [@ibn-al-anbari، ص352]."
context: "آخر صفات حامي الحقيقة (53–58). والبيت عند ابن الأَنْبارِيّ يأتي بعد القتل، وإعرابه عنده يردّه إلى البيت 53: «وبطل مخفوض لأنه نعت لحامي الحقيقة» [@ibn-al-anbari، ص352]. أما الأَعْلَم فيضعه بعد البيت 54 «ربذ يداه» مباشرة، ورقمه عنده 60 [@diwan-antara، ص212]، فتتصل الصفات قبل مشهد القتل، ويوافقه البغدادي حين يذكر أن قبله «ومشك سابغة» [@khizana، ج9 ص485]. وهو عند الزَّوْزَنِيّ 56 [@zawzani، ص260]. ويستشهد به المبرِّد على أن «العرب تمدح بالطول، وتضع من القصر» [@kamil، ج1 ص79]."
syntax:
  - "«وبطل مخفوض لأنه نعت لحامي الحقيقة، والثياب اسم كأن، وفي سرحة خبر كأن» [@ibn-al-anbari، ص352]. ويذكر التِّبْرِيزِيّ رفعه: «ويروى (بطل) أي هو بطل» [@tabrizi-ashr، ص206]."
  - "«ومعنى قوله (في سرحة)، أي على سرحة، فأقام (في) مقام (على)» [@ibn-al-anbari، ص352]. وينقل البغدادي رأيًا آخر: «والأولى أن تكون على بابها لأن ثيابه إذا كانت عليها فقد صار السرحة موضعا لها» [@khizana، ج9 ص485]."
  - "«ويحذى مرفوع بالياء وموضعه في التأويل خفض لأنه نعت لبطل»، «واسم ما لم يسم فاعله مضمر في يحذى، والنعال خبر ما لم يسم فاعله» [@ibn-al-anbari، ص352]: أي «نِعَالَ» مفعول ثانٍ."
morphology:
  - "يُحْذَى مضارع حَذَاه نعلًا، مبني للمجهول، ويتعدى إلى مفعولين."
  - "«والجميع توائم وتؤام»، «وقد أتأمت المرأة فهي متئم، إذا ولدت اثنين في بطن» [@ibn-al-anbari، ص352]."
rhetoric:
  thesis: "يمدح خصمه بثلاث: الطول، والشرف، والقوة. والعرب، كما يقول المبرِّد، «تمدح بالطول» [@kamil، ج1 ص79]، فقتل هذا الرجل فخر لقاتله."
  devices:
    - title: "التشبيه في «كَأَنَّ ثِيَابَهُ فِي سَرْحَةٍ»"
      text: "شبّه جسده في طوله بالشجرة العالية، فثيابه عليه كأنها على سرحة [@ibn-al-anbari، ص352]. ويرى أبو هلال العسكري أن بيتًا في المعنى نفسه، «أشمّ طوال السّاعدين كأنّما ... يلاث نجاذا سيفه بلواء» [@sinaatayn، ص202]، «أحسن لفظا وسبكا من قول عنترة» [@sinaatayn، ص203]."
    - title: "الكناية في «يُحْذَى نِعَالَ السِّبْتِ»"
      text: "النعل المدبوغة كناية عن الشرف. فعند ابن الأَنْبارِيّ: «معناه ليس براعي إبل فيلبس الجلد الفطير» [@ibn-al-anbari، ص352]، وعند الأَعْلَم: «أي هو شريف ينتعل بما ينتعل به الملوك» [@diwan-antara، ص212]."
    - title: "الكناية في «لَيْسَ بِتَوْأَمِ»"
      text: "نفي التوأمة كناية عن القوة: «لم يزحمه آخر في الرحم فيخرج ضاويا ضعيفا» [@ibn-al-anbari، ص352]، أي نحيفًا. ويقول الزَّوْزَنِيّ: «بالغ في وصفه بالشدة والقوة بامتداد قامته وعظم أعضائه وتمام غذائه عند إرضاعه إذ كان فذًّا غير توأم» [@zawzani، ص261]."
  connection: "ثم يدع القتال فجأة، وينادي امرأة يشبّهها بصيد محرّم عليه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "بَطَلِنْ كَأَنْ / نَ ثِيَابَهُو / فِي سَرْحَتِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — يُحْذَى نِعَا / لَسْ سِبْتِ لَيْ / سَ بِتَوْأَمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأخيرة من الصدر، والأوليين من العَجُز."
