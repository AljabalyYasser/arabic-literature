first: "وَكَأَنَّمَا تَنْأَى بِجَانِبِ دَفِّهَا الْـ"
second: "ـوَحْشِيِّ مِنْ هَزِجِ الْعَشِيِّ مُؤَوَّمِ"
meaning: "تميل الناقة بجنبها الأيمن مبتعدة، كأن هرًّا قبيح الرأس يصيح في العشيّ قد عُلّق تحت جنبها. قال ابن الأَنْبارِيّ: «يقول: بها من الحدة والنشاط ما كأن هرا بها تحت دفها ينهشها» [@ibn-al-anbari، ص325]، ثم قال: «فأراد إنها أنشط ما تكون في الوقت الذي يفتر فيه الإبل، فكأنها من نشاطها يخدشها هر تحت جنبها» [@ibn-al-anbari، ص326]."
vocabulary:
  - term: "تَنْأَى"
    text: "«تبعد» [@ibn-al-anbari، ص325]."
  - term: "دَفِّهَا"
    text: "«و (الدف) : الجنب» [@ibn-al-anbari، ص325]."
  - term: "الْوَحْشِيِّ"
    text: "«والوحشي من البهائم: الجانب الأيمن. والإنسي: الجانب الأيسر؛ لأنها تؤتى في الركوب والحلب والمعالجة منه» [@ibn-al-anbari، ص325]. وفيه خلاف، فقد «روى أبو عبيدة عن الأصمعي أن الوحشي الجانب الذي يركب منها الراكب ويحتلب منها الحالب» [@ibn-al-anbari، ص326]. وفي لسان العرب: «التَّهْذِيبُ: الإِنْسِيُّ مِنَ الدَّوَابِّ هُوَ الْجَانِبُ الأَيسر الَّذِي مِنْهُ يُرْكَبُ ويُحْتَلَبُ» [@lisan، ج6 ص14]."
  - term: "هَزِجِ الْعَشِيِّ"
    text: "الهرّ الذي يصيح في العشيّ، «وإنما جعله هزج العشي لأنه إذا هزج هزجت الناقة لهزجه. وجعله بالعشي لأنه ساعة الفتور والإعياء» [@ibn-al-anbari، ص326]. وقال أبو جَعْفَر: «لأن السنانير أكثر صياحها بالعشيات وبالليل» [@ibn-al-anbari، ص327]. وفي لسان العرب عن ابن الأَعْرابِيّ: «هَزِجٌ كَثِيرُ العُواء بِاللَّيْلِ، وَوَضَعَ العَشِيَّ مَوْضِعَ اللَّيْلِ لِقُرْبِهِ مِنْهُ» [@lisan، ج2 ص391]."
  - term: "مُؤَوَّمِ"
    text: "«و (المؤوم) : العظيم القبيح من الرءوس» [@ibn-al-anbari، ص326]. وقال أبو جَعْفَر: «مفعل من الآمة؛ والآمة: العيب؛ فيقول: هو مشوه الخلق» [@ibn-al-anbari، ص327]."
syntax:
  - "«وكأنما حرف واحد لا موضع لها من الإعراب. والباء صلة تنأى، ومؤوم نعت الهزج، والجانب مضاف إلى الدف، والوحشي نعت الدف» [@ibn-al-anbari، ص327]."
  - "و«مِنْ» متعلقة بـ«تَنْأَى»، وفي الكلام حذف عند الزَّوْزَنِيّ: «قوله: من هزج العشي، أي من خوف هزج العشي، فحذف المضاف، والباء في قوله بجانب دفها للتعدية» [@zawzani، ص253]. و«هَزِجِ الْعَشِيِّ» صفة لموصوف لم يُذكر، يبيّنه في البيت التالي: «هِرٍّ»."
morphology:
  - "«تَنْأَى» مضارع «نَأَى» على «فَعَلَ يَفْعَلُ» لأن عينه حرف حلق."
  - "«مُؤَوَّم» على وزن «مُفَعَّل» من الأَوْم، وهو عند أبي جَعْفَر «مثل معوم، مفعل من الآمة» [@ibn-al-anbari، ص327]."
rhetoric:
  thesis: "ناقة لا تمشي مستقيمة من النشاط، تتنحّى بجنبها كأن شيئًا يخدشه. وهو نشاط في آخر النهار حين تفتر الإبل."
  devices:
    - title: "الصورة المتخيلة في «مِنْ هَزِجِ الْعَشِيِّ»"
      text: "لا هرّ هناك، وإنما يتخيله الشاعر ليصوّر حركتها. وهي صورة يتداولها الشعراء في وصف الإبل، يستشهد لها ابن الأَنْبارِيّ بقول الشَّمّاخ «كأنّ ابنَ آوى مُوثَق تحت نحرها» وبقول الأعشى «كأنَّ بغرزها هراًّ»، ويقول: «ومثل هذا كثير» [@ibn-al-anbari، ص326]."
    - title: "تفسير آخر: السوط"
      text: "قال أبو جَعْفَر: «المعنى في خصه الوحشي أن السوط بيمينه، فهي تميل على ميامنها وهو الوحشي، مخافة السوط» [@ibn-al-anbari، ص327]. فالميل على هذا ليس نشاطًا خالصًا، بل حذر من يد الراكب."
    - title: "التدوير"
      text: "التدوير: أن تنقسم كلمة بين الصدر والعجز. ففي «الْـوَحْشِيِّ» بقيت أداة التعريف آخر الصدر، وجاءت الكلمة أول العجز، فلا يقف القارئ بين الشطرين. ولا مدوَّر غيره في أبيات المعلقة عند ابن الأَنْبارِيّ."
  connection: "ثم يسمّي هذا الصائح: «هِرٍّ جَنِيبٍ كُلَّمَا عَطَفَتْ لَهُ»، قال ابن الأَنْبارِيّ: «بيَّن ما الهزج فرد عليه (هر جنيب)» [@ibn-al-anbari، ص327]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَكَأَنْنَمَا / تَنْأَى بِجَا / نِبِ دَفْفِهَلْ = متَفاعلن / مُتْفاعلن / متَفاعلن — وَحْشِيْيِ مِنْ / هَزِجِلْ عَشِيْ / يِ مُؤَوْوَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "البيت مدوَّر، فلام التعريف من «الْوَحْشِيِّ» آخر العَرُوض، وتُقصر ألف «دَفِّهَا» قبلها لالتقاء الساكنين: «دَفْفِهَلْ». ودخل الإضمار ثانية الصدر وأولى العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "من أبيات الناقة بعد الشرب (28–34). وهو والبيت التالي بيتا الهرّ، يصفان نشاطها وهي تسير."
variants:
  - reading: "وَكَأَنَّمَا يَنْأَى بِجَانِبِ دَفِّهَا الْـ ... ـوَحْشِيِّ بَعْدَ مَخِيلَةٍ وَتَزَغُّمِ"
    status: "رواية الأَعْلَم"
    note: "هي رواية الأَعْلَم الشَّنْتَمَرِيّ [@diwan-antara، ص202]، و«ينأى» فيها بالياء، والفاعل الهرّ في البيت التالي. وفي شرحه: «والمخيلة الاختيال والتزغم النشاط»، و«وينأى ذلك الهر بجانبها الوحشي أي يعدل به ويبعده» [@diwan-antara، ص203]."
  - reading: "وَكَأَنَّمَا يَنْأَى بِجَانِبِ دَفِّهَا الْـ ... ـوَحْشِيِّ مِنْ هَزِجِ الْعَشِيِّ مُؤَوَّمِ"
    status: "رواية أخرى"
    note: "يذكر التِّبْرِيزِيّ الروايتين، فمن روى بالتاء جعل الفعل للناقة وجرّ «هرّ» في البيت التالي بدلًا، «ومن روى بالياء رفع الهر بينأي» [@tabrizi-ashr، ص193]. وفي لسان العرب «مُؤَوِّمِ» بكسر الواو [@lisan، ج2 ص391]."
