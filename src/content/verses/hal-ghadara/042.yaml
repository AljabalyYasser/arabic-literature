first: "وَحَلِيلِ غَانِيَةٍ تَرَكْتُ مُجَدَّلًا"
second: "تَمْكُو فَرِيصَتُهُ كَشِدْقِ الْأَعْلَمِ"
meaning: "ورُبّ زوج امرأة جميلة تركته صريعًا على الأرض، تصفر الطعنة في فريصته، واسعةً كشدق البعير المشقوق الشفة. قال الزَّوْزَنِيّ: «يقول: ورُبَّ زوج امرأة بارعة الجمال مستغنية بجمالها عن التزين قتلته وألقيته على الأرض» [@zawzani، ص257]."
vocabulary:
  - term: "حَلِيلِ"
    text: "زوج. «يقال: فلان حليل فلانة، وفلانة حليل فلان» [@ibn-al-anbari، ص340]."
  - term: "غَانِيَةٍ"
    text: "«وأصل الغانية ذات الزوج، أي المستغنية بزوجها، ثم قيل للشابة غانية، ذات زوج كانت أو غير ذات زوج» [@ibn-al-anbari، ص340]. «وقال آخرون: الغواني: اللواتي استغنين بجمالهن عن الزينة» [@ibn-al-anbari، ص341]."
  - term: "مُجَدَّلًا"
    text: "«معناه مصروعا، وأصله إنه لصق بالجدالة، وهي الأرض» [@ibn-al-anbari، ص341]."
  - term: "تَمْكُو"
    text: "«معناه تصفر فريصته. والمكاء: الصفير» [@ibn-al-anbari، ص341]."
  - term: "فَرِيصَتُهُ"
    text: "«المضغة التي في مرجع الكتف، ترعد من الدابة إذا فزع» [@ibn-al-anbari، ص341]."
  - term: "الْأَعْلَمِ"
    text: "البعير. «وكل بعير أعلم؛ لأن مشفره الأعلى مشقوق» [@ibn-al-anbari، ص341]. والشِّدْق: جانب الفم."
context: "يبدأ به الفخر بالقتال، وهو مع البيت الذي بعده مقطع قصير في قتيل واحد (42–43). وفي تفسير «تمكو» روى الأصمعي: «قلت لمنتجع بن نبهان: ما تمكو فريصته؟ فشبك بين أصابعه ثم وضعها على فمه ونفخ» [@ibn-al-anbari، ص341]. وفي كلام ابن الأَنْبارِيّ على «الأعلم» يورد بيتًا فيه لقب عَنْتَرَة: «وَعَنْتَرَةُ الْفَلْحَاءُ جَاءَ مُلَأَّمًا ... كَأَنَّكَ فِنْدٌ مِنْ عَمَايَةَ أَسْوَدُ» [@ibn-al-anbari، ص342]، والأفلح المشقوق الشفة السفلى. والبيت عند الأَعْلَم 47 [@diwan-antara، ص207]، وعند الزَّوْزَنِيّ 41 [@zawzani، ص256]."
syntax:
  - "«والحليل خفض بإضمار رب، وتركت صلة الحليل، والهاء المضمرة تعود على الحليل ومجدلا منصوب بتركت» [@ibn-al-anbari، ص342]: الواو واو رُبّ، و«حَلِيلِ» مجرور بـ«رُبّ» المحذوفة، والضمير المحذوف بعد «تَرَكْتُ» تقديره: تركته."
  - "«وتمكو موضعه نصب في التأويل على الحال، والتأويل: ماكية فريصته. والفريصة رفع بتمكو، والكاف في موضع النصب على المصدر» [@ibn-al-anbari، ص342]: أي تمكو مكاءً مثل شدق الأعلم."
morphology:
  - "حَلِيل على وزن فَعِيل؛ «فهو على هذا القول فعيل بمعنى مفاعل، مثل شريب وأكيل ونديم بمعنى مشارب ومؤاكل ومنادم» [@zawzani، ص256]، لأن الزوجين يحلّان منزلًا واحدًا."
  - "مُجَدَّل اسم مفعول من جَدَّلَه على وزن فَعَّل: ألقاه على الجَدالة."
  - "تَمْكُو مضارع مَكَا يَمْكُو مُكاءً، ومنه في القرآن ﴿وَمَا كَانَ صَلَاتُهُمْ عِنْدَ الْبَيْتِ إِلَّا مُكَاءً وَتَصْدِيَةً﴾، «أراد بالمكاء الصفير، وبالتصدية التصفيق» [@ibn-al-anbari، ص341]."
rhetoric:
  thesis: "أول قتيل يفخر به هو زوج امرأة جميلة: فهو يقتل من يُحسد على ما عنده، ويطعنه في مقتل لا يخطئه."
  devices:
    - title: "الإيجاز بالحذف في «وَحَلِيلِ غَانِيَةٍ»"
      text: "بدأ بواو رُبّ وحذف رُبّ نفسها، فدخل في القصة من غير تمهيد. وهي طريقة الجاهليين في افتتاح الأوصاف والأخبار."
    - title: "التشبيه في «كَشِدْقِ الْأَعْلَمِ»"
      text: "اختلفوا في وجه الشبه. فعند ابن الأَنْبارِيّ: «يريد سعة الطعنة، أي كأن هذه الطعنة في سعتها شدق الأعلم» [@ibn-al-anbari، ص341]. وعند الأَعْلَم الشبه في الصوت: «شبه صوت الطعنة عند خروج الدم منها بصوت شدق البعير إذا هدر» [@diwan-antara، ص207]. ويجمع الزَّوْزَنِيّ القولين: «قال أكثرهم: شبه سعة الطعن بسعة شدق الأعلم، وقال بعضهم: بل شبه صوت انصباب الدم بصوت خروج النفس من شدق الأعلم» [@zawzani، ص257]. وعلى القولين هو عند عبد القاهر الجُرْجانيّ من التشبيه الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]: صورة أو صوت يُدرك بالحس."
    - title: "الكناية في «تَمْكُو فَرِيصَتُهُ»"
      text: "صفير الطعنة يعني أنها نفذت إلى موضع القلب. «وإنما خص الفريصة لأنها إذا طعنت هجمت الطعنة على القلب فمات الرجل. فأخبر عن حذقه بالطعن» [@ibn-al-anbari، ص341]."
  connection: "ثم يصف الطعنة نفسها: عاجلة، نافذة، دمها كالعندم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَحَلِيلِ غَا / نِيَتِنْ تَرَكْ / تُ مُجَدْدَلَا = متَفاعلن / متَفاعلن / متَفاعلن — تَمْكُو فَرِي / صَتُهُو كَشِدْ / قِلْ أَعْلَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى والثالثة من العَجُز. وتُشبع ضمة الهاء في فريصته فتُنطق فريصتهو."
variants:
  - reading: "الْأَعْلَمِ: الرجل المشقوق الشفة العليا"
    status: "تفسير ردّه ابن الأَنْبارِيّ"
    note: "«وليس قول من قال: الأعلم: الرجل، بشيء؛ لأن العلم إنما يكون في الشفة، فشدق الأعلم والصحيح سواء» [@ibn-al-anbari، ص341]. وقال أبو جعفر: «لأن كل بعير أعلم، فهو أشهر، وليس كل إنسان أعلم» [@ibn-al-anbari، ص342]."
