first: "فَإِذَا ظُلِمْتُ فَإِنَّ ظُلْمِي بَاسِلٌ"
second: "مُرٌّ مَذَاقَتُهُ كَطَعْمِ الْعَلْقَمِ"
meaning: "فإذا ظلمني أحد، كان ظلمي له في المقابل كريهًا مرًّا كطعم الحنظل. قال ابن الأَنْبارِيّ: «معناه: أن ظلمني ظالم فظلمي إياه باسل لديه كريه عنده» [@ibn-al-anbari، ص336]. وقال الزَّوْزَنِيّ: «أي من ظلمني عاقبته عقابًا بالغًا يكرهه كما يكره طعم العلقم من ذاقه» [@zawzani، ص255]."
vocabulary:
  - term: "بَاسِلٌ"
    text: "كريه. «ويقال رجل باسل وبسيل، إذا كرهت مرآة ومنظره» [@ibn-al-anbari، ص336]. وعند الأَعْلَم: «الباسل الشديد ويقال: هو الكريه المنظر» [@diwan-antara، ص205]."
  - term: "مَذَاقَتُهُ"
    text: "«معناه ذوقه» [@ibn-al-anbari، ص337]."
  - term: "الْعَلْقَمِ"
    text: "«الشديد المرارة» [@ibn-al-anbari، ص337]. وعند الأَعْلَم: «الحنظل الأصفر الذي فيه خطوط وهو أشد بمرارته» [@diwan-antara، ص205]."
context: "يتم به وصف خلقه مع الناس (36–37): سهل لمن لم يظلمه، مرّ على من ظلمه. وهو عند الأَعْلَم 42 [@diwan-antara، ص205]، وعند الزَّوْزَنِيّ 36 [@zawzani، ص255]."
syntax:
  - "«وإذا وقت فيها طرف من الجزاء، وظلمي اسم إن، وباسل خبر إن، ومر نعت باسل» [@ibn-al-anbari، ص337]. و«ظُلِمْتُ» فعل ماض مبني للمجهول، والتاء نائب فاعل."
  - "«والمذاقة رفع بالكاف، والتقدير: مذاقته مثل طعم العلقم. ويجوز أن ترفع المذاقة بمعنى المرارة وتجعل الكاف نعتا للباسل» [@ibn-al-anbari، ص337]: أي «مَذَاقَتُهُ» فاعل لـ«مُرٌّ» لأنه صفة تعمل عمل الفعل، و«كَطَعْمِ» صفة أخرى."
morphology:
  - "«بَاسِل» اسم فاعل من «بَسُلَ بسالة»، ويقال: «وتبسل تبسلا» [@ibn-al-anbari، ص336]."
  - "مَذَاقَة مصدر ميمي من ذاق، على وزن مَفْعَلة."
  - "«مُرّ» صفة مشبهة؛ «ويقال: قد مر الشيء مرارة، وأمر يمر إمرارا» [@ibn-al-anbari، ص337]."
rhetoric:
  thesis: "يجعل لظلمه طعمًا يذوقه الظالم: من ظلمه أكل علقمًا. فالبيت تهديد يكمل وعد البيت قبله."
  devices:
    - title: "الاستعارة في «ظُلْمِي بَاسِلٌ مُرٌّ مَذَاقَتُهُ»"
      text: "جعل للظلم مذاقًا مرًّا، والظلم معنى لا يُذاق. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]: أعطى الظلم صفة الطعام، ثم صرّح بالتشبيه في قوله كطعم العلقم فأكّد الصورة."
    - title: "المشاكلة في «ظُلِمْتُ... ظُلْمِي»"
      text: "سمّى جزاءه للظالم ظُلمًا، وهو في الحقيقة انتصاف. والمشاكلة أن يُذكر الشيء بلفظ غيره لوقوعه في صحبته: فلما ذكر ظلم غيره له، سمّى ردّه باسمه."
    - title: "المقابلة بين البيتين"
      text: "قوله سمح مخالطتي في البيت السابق يقابله ظلمي باسل هنا، وقوله إذا لم أظلم يقابله فإذا ظلمت. والمقابلة أن تؤتى بمعنيين أو أكثر ثم بما يقابلها على الترتيب."
  connection: "ثم ينتقل من خلقه مع الناس إلى مجلس شرابه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَإِذَا ظُلِمْ / تُ فَإِنْنَ ظُلْ / مِي بَاسِلُنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — مُرْرُنْ مَذَا / قَتُهُو كَطَعْ / مِلْ عَلْقَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار [@atiq، ص59] التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز. وتُشبع ضمة الهاء في مذاقته فتُنطق مذاقتهو ليستقيم الوزن."
