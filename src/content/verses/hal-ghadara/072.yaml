first: "لَوْ كَانَ يَدْرِي مَا الْمُحَاوَرَةُ اشْتَكَى"
second: "أَوْ كَانَ لَوْ عَلِمَ الْكَلَامَ مُكَلِّمِي"
meaning: "لو كان الفرس يعرف المخاطبة لاشتكى، ولو عرف الكلام لكلّمني. قال الزَّوْزَنِيّ: «يقول: لو كان يعلم الخطاب لاشتكى إلَيّ مما يقاسيه ويعانيه، وكلمني لو كان يعلم الكلام، يريد أنه لو قدر على الكلام لشكا إلَيّ مما أصابه من الجراح» [@zawzani، ص264]."
vocabulary:
  - term: "الْمُحَاوَرَةُ"
    text: "المراجعة في الكلام. عند الأَعْلَم: «المحاورة المجاوبة، وأصلها من حار يحور إذا رجع، وحقيقتها مراجعة الكلام بالخطاب والجواب» [@diwan-antara، ص218]."
context: "يتم به البيت السابق، وهما معًا صورة الفرس الذي يشكو ولا يتكلم (71–72). وقد رأى أهل العلم بالشعر أن عَنْتَرَة وقف بالفرس عند حدّ ما يقدر عليه، ففي المُوَشَّح: «رأيت أهل العلم بالشعر يستحسنون قول عنترة العبسى فيما أخبر به عن شكيّة فرسه إليه التعب لدوام الحرب»، «فلم يخرج الفرس عن التحمحم إلى الكلام»، «فوضع عنترة ما أراده فى موضعه»، ثم عاب على ابن هَرْمة أنه جعل الكلب يكلّم الضيف وهو أعجم [@muwashshah، ص285]. والبيت عند الأَعْلَم 76 بلفظ آخر [@diwan-antara، ص218]، وعند الزَّوْزَنِيّ 69 [@zawzani، ص263]."
syntax:
  - "«اسم كان مضمر فيها، والخبر ما عاد من يدري، والمحاورة رفع بما وما بها، واشتكى» جواب لو [@ibn-al-anbari، ص361–362]: أي «مَا» استفهامية مبتدأ و«الْمُحَاوَرَةُ» خبرها، والجملة مفعول «يَدْرِي» علّق عنها الاستفهام."
  - "«واسم كان الثانية مضمر فيها، ومكلمي خبرها، والنصب لا يتبين فيه؛ لأن الياء لا يكون الذي قبلها إلا مكسورا» [@ibn-al-anbari، ص362]. و«لَوْ عَلِمَ الْكَلَامَ» شرط معترض بين «كان» وخبرها."
  - "وعلى رواية «وَلَكَانَ» يقول التِّبْرِيزِيّ: «وقوله (ولكان) فجاء باللام، فإنما هو محول على المعنى، والتقدير: لو كان يدرى ما المحاورة لاشتكى ولكان؛ لأنه يقال: لو قام زيد لقمت، ولو قام زيد قمت، بمعنى واحد» [@tabrizi-ashr، ص212]."
morphology:
  - "المُحَاوَرَة مصدر حاوَرَ على وزن مُفاعَلة، وهو بناء المشاركة: كلام يتردد بين اثنين."
  - "مُكَلِّم اسم فاعل من كَلَّمَ على وزن فَعَّل، أُضيف إلى ياء المتكلم."
rhetoric:
  thesis: "يقف بالفرس عند حدّه: يشكو بالدمع والحمحمة، ولا ينطق. فالشاعر يتمنى له الكلام ولا يدّعيه له."
  devices:
    - title: "الشرط الممتنع في «لَوْ كَانَ يَدْرِي... اشْتَكَى»"
      text: "«لو» تدل على امتناع الجواب لامتناع الشرط: فالفرس لا يدري المحاورة، فلم يشتكِ بالكلام. وبهذا الشرط يبقى التشخيص في البيت السابق قريبًا من الحقيقة، وهو ما يقصده أبو هلال حين يقول: «والذى يقارب الصواب قول عنترة» [@sinaatayn، ص115]."
    - title: "التكرار في «لَوْ... لَوْ»"
      text: "كرر الشرط مرتين، مرة للمحاورة ومرة للكلام، فاشتد التمني وطال الحزن على الفرس [@ibn-al-anbari، ص361–362]."
  connection: "ثم يصف الخيل كلها وهي تقتحم الأرض الصعبة عابسة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "لَوْ كَانَ يَدْ / رِي مَلْ مُحَا / وَرَتُشْ تَكَى = مُتْفاعلن / مُتْفاعلن / متَفاعلن — أَوْ كَانَ لَوْ / عَلِمَلْ كَلَا / مَ مُكَلْلِمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، والأولى من العَجُز. وتسقط ألف ما في النطق قبل لام التعريف، وهمزة الوصل في اشتكى."
