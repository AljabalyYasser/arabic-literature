first: "بَرَكَتْ عَلَى مَاءِ الرِّدَاعِ كَأَنَّمَا"
second: "بَرَكَتْ عَلَى قَصَبٍ أَجَشَّ مُهَضَّمِ"
meaning: "بركت الناقة عند ماء الرِّداع، فسُمع لها صوت كأنها بركت على قصب مزامير غليظ الصوت. قال ابن الأَنْبارِيّ: «يقول: كأنما بركت على زمر. والمعنى إنها بركت فحنت، فشبه صوت حنينها بصوت المزامير، أي كأن حنينها مزامير» [@ibn-al-anbari، ص330]. وللشُّرّاح في مصدر الصوت أقوال أخرى نذكرها في البلاغة."
vocabulary:
  - term: "الرِّدَاعِ"
    text: "«والرداع: مكان» [@tabrizi-ashr، ص193]، وفي لسان العرب: «والرِّداع، بِالْكَسْرِ: مَوْضِعٌ أَو اسْمُ مَاءٍ» [@lisan، ج8 ص123]."
  - term: "قَصَبٍ"
    text: "قصب المزامير، قال أبو عُبَيْدة: «إنما أراد القصب المخرق الذي يزمر به الزامر» [@ibn-al-anbari، ص330]."
  - term: "أَجَشَّ"
    text: "«و (الأجش) : الذي فيه بحوحة»، وقال أبو جَعْفَر: «الجشة: غلظ حسب، ولو كان أبح لم يسمع صوته» [@ibn-al-anbari، ص330]."
  - term: "مُهَضَّمِ"
    text: "«و (المهضم) : الذي قد غمز حتى انفضح، وهو النرمناي. والنرمناي: ضرب من آلات الزمر» [@ibn-al-anbari، ص330]. وعند الزَّوْزَنِيّ: «مهضم أي مكسَّر» [@zawzani، ص254]."
syntax:
  - "«وبركت فاعله مضمر فيه من ذكر الناقة، وعلى صلة بركت، وكأنما حرف واحد لا موضع لها، وعلى الثانية صلة الفعل الثاني» [@ibn-al-anbari، ص331]."
  - "«وأجش موضعه خفض على النعت للقصب ونصب في اللفظ لأنه لا يجري» [@ibn-al-anbari، ص331]، أي أن «أَجَشَّ» مجرور بالفتحة لأنه ممنوع من الصرف، و«مُهَضَّمِ» صفة ثانية."
morphology:
  - "«أَجَشّ» صفة على وزن «أَفْعَل» من الجَشّة، وهو مضاعف، وممنوع من الصرف للوصفية ووزن الفعل."
  - "«مُهَضَّم» اسم مفعول من «هَضَّمَ» على «فَعَّلَ»، «وإنما قيل له مهضم لأنه يكسر ويضم طرفه» [@ibn-al-anbari، ص330]."
rhetoric:
  thesis: "صوت يخرج من الناقة الباركة، يسمعه الشاعر كأنه نفخ في مزامير. والشُّرّاح يختلفون في مصدره، والبيت يحتمل ذلك."
  devices:
    - title: "التشبيه السمعي في «كَأَنَّمَا بَرَكَتْ عَلَى قَصَبٍ»"
      text: "المشبه صوت، والمشبه به صوت. ولمصدر الصوت أربعة أقوال. الأول: حنينها، وهو قول أبي عُبَيْدة وأبي جَعْفَر. والثاني لابن الأَعْرابِيّ: «أراد إنها بركت على موضع قد نضب ماؤه وجف أعلاه وصار له قشر رقيق، فإذا بركت عليه سمعت له صوتا، لأنه ينكسر تحتها»، «وكان أبو جعفر يقول بالقول الأول وينكر الثاني» [@ibn-al-anbari، ص330]. والثالث للأَعْلَم الشَّنْتَمَرِيّ: «والذي عندي في هذا أنها لطول ظمئها واحتياجها إلى الماء لما أمكنها جعلت (تشربه بشهوة) وتجرعه وتمصه فيسمع لذلك صوت كصوت المزامير» [@diwan-antara، ص204]. والرابع للزَّوْزَنِيّ: «شبه أنينها من كلالها بصوت القصب المكسر عند بروكها عليه» [@zawzani، ص254]. ورجّح التِّبْرِيزِيّ الأول: «والوجه الأول أجود؛ لأن القصب الأجش معروف إنه من قصب الزمر» [@tabrizi-ashr، ص194]."
    - title: "تكرار «بَرَكَتْ»"
      text: "الفعل نفسه في الصدر والعجز: بروك حقيقي على الماء، وبروك متخيَّل على القصب. فالتكرار يضع الواقع والخيال في قالب واحد، ثم يترك الفرق بينهما للسامع. وهذه قراءتنا."
  connection: "ثم يصف عرقها: «وَكَأَنَّ رُبًّا أَوْ كُحَيْلًا مُعْقَدًا» [@ibn-al-anbari، ص331]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "بَرَكَتْ عَلَى / مَاءِرْ رِدَا / عِ كَأَنْنَمَا = متَفاعلن / مُتْفاعلن / متَفاعلن — بَرَكَتْ عَلَى / قَصَبِنْ أَجَشْ / شَ مُهَضْضَمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار ثانية الصدر وحدها، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتنقسم الشين المشددة في «أَجَشَّ» بين التفعيلتين الثانية والثالثة من العجز."
context: "من أبيات الناقة بعد الشرب (28–34): بعد السير والنشاط، يصفها باركة عند الماء. وفي لسان العرب ينشد البيت شاهدًا على المزامير المهضّمة، ومثله قول لَبِيد في الحمار: «شبَّه مخارجَ صوتِ حَلْقهِ بمُهَضَّماتِ المَزامير» [@lisan، ج12 ص615]."
variants:
