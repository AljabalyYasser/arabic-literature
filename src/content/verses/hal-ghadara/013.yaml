first: "إِذْ تَسْتَبِيكَ بِذِي غُرُوبٍ وَاضِحٍ"
second: "عَذْبٍ مُقَبَّلُهُ لَذِيذِ الْمَطْعَمِ"
meaning: "راعه الرحيل حين كانت تأسر قلبه بثغر حادّ الأسنان أبيض، عذب موضع التقبيل، لذيذ الطعم. قال الزَّوْزَنِيّ: «إنما كان فزعك من ارتحالها حين تستبيك بثغر ذي حدة واضح عذب موضع التقبيل منه ولذ مطعمه»، ثم قال: «وتحرير المعنى: تستبيك بذي أشر يستعذب تقبيله ويستلذ طعم ريقه» [@zawzani، ص248]."
vocabulary:
  - term: "تَسْتَبِيكَ"
    text: "«تذهب بعقلك» [@ibn-al-anbari، ص307]، وعند الزَّوْزَنِيّ: «الاستباء والسبي واحد» [@zawzani، ص248]، فهو من سبي الأسرى في الحرب."
  - term: "بِذِي غُرُوبٍ"
    text: "«معناه: بثغر ذي غروب. وغروب الأسنان: حدها، واحدها غرب» [@ibn-al-anbari، ص307]. وفي لسان العرب: «وغُروبُ الأَسنانِ: مَناقِعُ ريقِها؛ وَقِيلَ: أَطرافُها وحِدَّتُها وماؤُها» [@lisan، ج1 ص643]. وأراد الزَّوْزَنِيّ بالغروب «الأشر التي تكون في أسنان الشواب» [@zawzani، ص248]، والأُشُر: تحزيز دقيق في أطراف الأسنان يكون في الشباب."
  - term: "وَاضِحٍ"
    text: "«معناه أبيض. والوضح: البياض» [@ibn-al-anbari، ص307]."
  - term: "عَذْبٍ"
    text: "«معناه بارد» [@ibn-al-anbari، ص308]، وعند التِّبْرِيزِيّ: «ويريد بالعذب أن رائحته طيبة» [@tabrizi-ashr، ص183–184]."
  - term: "مُقَبَّلُهُ ... الْمَطْعَمِ"
    text: "«المقبل: موضع التقبل ... المطعم: الطعم» [@zawzani، ص248]، و«لذيذ المطعم» عند ابن الأَنْبارِيّ: «والمعنى لذيذ الذوق» [@ibn-al-anbari، ص308]."
syntax:
  - "«وإذ من صلة راعني. وفاعل تستبيك مضمر فيه من ذكر عبلة، والباء صلة تستبيك، وواضح وعذب نعتان لذي، والمقبل رفع بمعنى عذب، ولذيذ نعت لذي ايضا، وهو مضاف إلى المطعم» [@ibn-al-anbari، ص308]. أي أن «إِذْ» ظرف متعلق بـ«رَاعَنِي» في البيت 11، و«مُقَبَّلُهُ» فاعل للصفة «عَذْبٍ»."
  - "ويجعل التِّبْرِيزِيّ «إذ» متعلقة بـ«عُلّقتها» في البيت 7: «والمعنى عُلِّقتها إذ تستبيك، وإن شئت كان بمعنى اذكر» [@tabrizi-ashr، ص184]."
morphology:
  - "«تَسْتَبِي» مضارع «اسْتَبَى» على وزن «افْتَعَلَ» من «سَبَى»، وأصوله س ب ي، والتاء تاء الافتعال؛ والاستباء والسبي بمعنى واحد عند الزَّوْزَنِيّ."
  - "«مُقَبَّل» على وزن «مُفَعَّل» من «قَبَّلَ»، اسم للموضع الذي يُقبَّل. و«الْمَطْعَم» على وزن «مَفْعَل» مصدر ميمي بمعنى الطعم."
rhetoric:
  thesis: "من الإبل الراحلة يعود إلى فم صاحبته. والفارس الذي يسبي في الحرب صار هو المسبيّ."
  devices:
    - title: "الاستعارة في «تَسْتَبِيكَ»"
      text: "السبي أخذ الأسرى في الغارات، فاستعاره لذهاب العقل بالحب. وهو في شعر فارس يقاتل قوم صاحبته (البيت 7) أوقع: يسبي قومها في الحرب، وتسبيه هي بثغرها."
    - title: "حذف الموصوف في «بِذِي غُرُوبٍ»"
      text: "لم يذكر الثغر، بل صفته: ذو غروب، واضح، عذب، لذيذ. وتقديره عند ابن الأَنْبارِيّ «بثغر ذي غروب» [@ibn-al-anbari، ص307]. فتتابعت الصفات على موصوف غائب، كأن العين ترى الصفات قبل أن تسمّي الشيء."
    - title: "خطاب النفس في «تَسْتَبِيكَ»"
      text: "لم يقل: تستبيني، بل خاطب نفسه، كما فعل في المطلع «أَمْ هَلْ عَرَفْتَ»."
  connection: "ثم يصف ريح فمها: «وَكَأَنَّ فَارَةَ تَاجِرٍ بِقَسِيمَةٍ» [@ibn-al-anbari، ص308]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "إِذْ تَسْتَبِي / كَ بِذِي غُرُو / بِنْ وَاضِحِنْ = مُتْفاعلن / متَفاعلن / مُتْفاعلن — عَذْبِنْ مُقَبْ / بَلُهُو لَذِي / ذِلْمَطْعَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار الأولى والثالثة من الشطرين، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُشبع ضمة الهاء في «مُقَبَّلُهُ» فتُنطق «مُقَبَّلُهُو»، وبها تتم التفعيلة الثانية من العجز."
context: "أول أبيات الثغر والروضة (13–19): ينتقل من مشهد الرحيل إلى جمال صاحبته، ويبدأ بالفم ثم ريحه، ثم يشبّه الريح بروضة يطيل في وصفها."
variants:
  - reading: "إِذْ تَتَّقِيكَ بِذِي غُرُوبٍ وَاضِحٍ"
    status: "رواية أخرى"
    note: "«ويروى: (إذ تتقيك بذي غروب)»، أي تريك ثغرها «كانها تضحك في وجهك» [@ibn-al-anbari، ص307]."
  - reading: "إِذْ تَسْتَبِيكَ بِأَصْلَتِيٍّ نَاعِمٍ"
    status: "رواية الأَعْلَم"
    note: "هي رواية الأَعْلَم الشَّنْتَمَرِيّ، وشرحها: «والأصلتي: الثغر البراق والناعم الشديد البياض الكثير البريق» [@diwan-antara، ص194–195]."
