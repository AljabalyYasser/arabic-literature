first: "فَطَعَنْتُهُ بِالرُّمْحِ ثُمَّ عَلَوْتُهُ"
second: "بِمُهَنَّدٍ صَافِي الْحَدِيدَةِ مِخْذَمِ"
meaning: "فطعنته برمحي، ثم علوته بسيف هندي صافي الحديد سريع القطع. قال الزَّوْزَنِيّ: «يقول: طعنته برمحي حين ألقيته من ظهر فرسه ثم علوته مع سيف مهند صافي الحديد سريع القطع» [@zawzani، ص260]."
vocabulary:
  - term: "عَلَوْتُهُ"
    text: "ضربته من فوق، وهو صريع."
  - term: "مُهَنَّدٍ"
    text: "«المعمول بالهند. قال يعقوب: سمعت أبا عمرو الشيباني يقول: التهنيد: شحذ السيف» [@ibn-al-anbari، ص351]."
  - term: "صَافِي الْحَدِيدَةِ"
    text: "عند الأَعْلَم: «مجلو صقيل» [@diwan-antara، ص213]."
  - term: "مِخْذَمِ"
    text: "«الذي ينتسف القطعة، أي يرمى بها» [@ibn-al-anbari، ص351]، وعند الأَعْلَم: «والمخذم القاطع» [@diwan-antara، ص213]."
context: "يتم مشهد قتل حامي الحقيقة. وترتيبه عند الزَّوْزَنِيّ بعد «عهدي به مد النهار» لا قبله، فرقمه عنده 55 [@zawzani، ص260]، وعند ابن الأَنْبارِيّ والأَعْلَم والتِّبْرِيزِيّ يأتي القتل قبل صورة القتيل. وهو عند الأَعْلَم 62 [@diwan-antara، ص213]."
syntax:
  - "الفاء في «فَطَعَنْتُهُ» للتعقيب، و«ثُمَّ» للترتيب مع المهلة: الطعن أولًا، ثم الضرب بالسيف [@ibn-al-anbari، ص351]."
  - "«وصافي الحديدة نعت للمهند؛ لأن صافي الحديدة نكرة في التأويل، إذ كانت الألف واللام تحسنان فيه، فيقال الصافي الحديدة» [@ibn-al-anbari، ص351]: أي إضافة «صافي» إلى «الحديدة» لا تعرّفه، فصح أن يوصف به النكرة. و«مِخْذَمِ» نعت ثانٍ."
morphology:
  - "مُهَنَّد اسم مفعول من هَنَّدَ على وزن فَعَّل. وعلى قول أبي عمرو الشيباني فهو من التهنيد بمعنى الشحذ، لا نسبة إلى الهند [@ibn-al-anbari، ص351]."
  - "«والمِخذم: مفعل من الخذم وهو القطع» [@tabrizi-ashr، ص205]، وهو من أبنية الآلة والمبالغة."
rhetoric:
  thesis: "بيت الفعل الخالص: طعنة، ثم ضربة. لا وصف للخصم هنا، بل للسلاح وحده."
  devices:
    - title: "الترتيب بـ«ثُمَّ»"
      text: "رتّب القتل مرحلتين، الرمح ثم السيف، فبدا كأنه يقصّه خطوة خطوة، وهذا يناسب قوله في البيت السابق «قد نزلت أريده» [@ibn-al-anbari، ص350]: نزل ليقتله بيده."
    - title: "حذف الموصوف في «بِمُهَنَّدٍ»"
      text: "ذكر صفة السيف وترك اسمه، ثم أتبعها بصفتين: صفاء الحديد وسرعة القطع، فصار السيف موصوفًا بأصله وجوهره وفعله [@ibn-al-anbari، ص351]."
  connection: "ثم يصف القتيل بعد ساعات: كأن رأسه وبنانه مخضوبة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَطَعَنْتُهُو / بِرْرُمْحِ ثُمْ / مَ عَلَوْتُهُو = متَفاعلن / مُتْفاعلن / متَفاعلن — بِمُهَنْنَدِنْ / صَافِلْ حَدِي / دَةِ مِخْذَمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الوسطى من كل شطر."
variants:
