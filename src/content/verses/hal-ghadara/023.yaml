first: "خَطَّارَةٌ غِبَّ السُّرَى زَيَّافَةٌ"
second: "تَطِسُ الْإِكَامَ بِذَاتِ خُفٍّ مِيثَمِ"
meaning: "هي تخطر بذنبها نشاطًا بعد أن سارت الليل كله، مسرعة في مشيها، تدق التلال بخفّ شديد الوطء. قال ابن الأَنْبارِيّ: «تخطر بعدما أسرت ليلها ثم أصبحت، لأن السير لا يكسرها» [@ibn-al-anbari، ص318]. وقال الأَعْلَم الشَّنْتَمَرِيّ: «يقول: هي خطارة بعد السرى فكيف بها إذا لم تسر» [@diwan-antara، ص199]."
vocabulary:
  - term: "خَطَّارَةٌ"
    text: "«يعنى تخطر بذنبها تحركه وترفعه تضرب به حاذيها» [@ibn-al-anbari، ص318]، والحاذان عند التِّبْرِيزِيّ «حافتا الأليتين، وإنما تفعل ذلك لنشاطها» [@tabrizi-ashr، ص189–190]. وفي لسان العرب: «يُقَالُ: خَطَرَ البعيرُ بِذَنَبِهِ يَخْطِرُ إِذا رَفَعَهُ وحَطَّهُ» [@lisan، ج4 ص250]."
  - term: "غِبَّ السُّرَى"
    text: "«وغب كل شيء: بعده»، «و (السرى) : سير الليل» [@ibn-al-anbari، ص319]."
  - term: "زَيَّافَةٌ"
    text: "«معناه تزيف في سيرها، أي تسرع» [@ibn-al-anbari، ص319]، وعند الزَّوْزَنِيّ: «الزيَف: التبختر» [@zawzani، ص251]."
  - term: "تَطِسُ"
    text: "تضرب بشدة، «و (الوطس) ، والوطث، واللثم: الضرب الشديد بالخف» [@ibn-al-anbari، ص319]."
  - term: "الْإِكَامَ"
    text: "«جمع أكمة، وهي كل رابية مرتفعة عن وجه الأرض» [@ibn-al-anbari، ص319]."
  - term: "بِذَاتِ خُفٍّ مِيثَمِ"
    text: "«معناه بقوائم ذات أخفاف أو بوظيف ذات خف» [@ibn-al-anbari، ص319]، والوظيف: ما بين الرسغ والركبة. والميثم عند الأَعْلَم «الشديد الوطء يقال: وثم الأرض يثمها إذا وطئها وطئًا شديدًا» [@diwan-antara، ص200]، وفي لسان العرب: «وخُفٌّ مِيثَمٌ: شديدُ الوطءِ، وكأَنه يَثِمُ الأَرضَ أَي يَدُقُّها» [@lisan، ج12 ص629]."
syntax:
  - "«والخطارة والزيافة نعتان لشدنية، وغب السرى منصوب على مذهب الصفة» [@ibn-al-anbari، ص319]، أي أن «خَطَّارَةٌ» و«زَيَّافَةٌ» صفتان لـ«شَدَنِيَّةٌ» في البيت السابق، و«غِبَّ» ظرف، والصفة في اصطلاح الكوفيين الظرف وحرف الجر."
  - "«وتطس موضعه رفع بالتاء، ومعناه أيضا الرفع على النعت لخطارة، كأنه قال: واطسة الإكام، والباء صلة تطس» [@ibn-al-anbari، ص319]. أي أن جملة «تَطِسُ» صفة ثالثة، و«بِذَاتِ» متعلق بها، و«مِيثَمِ» صفة لـ«خُفٍّ»."
morphology:
  - "«خَطَّارَة» و«زَيَّافَة» صيغتا مبالغة على وزن «فَعّالَة»، تدلان على كثرة الفعل."
  - "«تَطِسُ» مضارع «وَطَسَ»، حُذفت واوه كما تُحذف من «وَعَدَ يَعِدُ». و«مِيثَم» على وزن «مِفْعَل» من «وَثَمَ»، وأصله «مِوْثَم» قُلبت الواو ياء لسكونها بعد كسرة، وهو عند الزَّوْزَنِيّ «للمبالغة كأنه آلة الوثم» [@zawzani، ص251]."
rhetoric:
  thesis: "ناقة لا يتعبها السفر: بعد ليل كامل من السير ما زالت تخطر بذنبها وتدق التلال."
  devices:
    - title: "صيغ المبالغة"
      text: "«خَطَّارَةٌ» و«زَيَّافَةٌ» و«مِيثَمِ» كلها تدل على الكثرة والشدة، فاجتمع في البيت ثلاث صيغ لقوة واحدة. وقال الزَّوْزَنِيّ في الميثم: «كما يقال: رجل مِسعر حرب» [@zawzani، ص251]، أي كأن الخف أداة للدق كما أن الرجل أداة لإيقاد الحرب."
    - title: "دلالة «غِبَّ السُّرَى»"
      text: "اختار أصعب أوقاتها: بعد سير الليل. فإذا كانت نشيطة حينئذ ففي غيره أنشط، وهذا معنى قول الأَعْلَم: «فكيف بها إذا لم تسر» [@diwan-antara، ص199]."
  connection: "ثم يشبّه سيرها بعدو الظليم: «وَكَأَنَّمَا أَقِصُ الْإِكَامَ عَشِيَّةً» [@ibn-al-anbari، ص319]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "خَطْطَارَتُنْ / غِبْبَسْ سُرَى / زَيْيَافَتُنْ = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — تَطِسُلْ إِكَا / مَ بِذَاتِ خُفْ / فِنْ مِيثَمِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلات الثلاث من الصدر، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]؛ فتوالت المقاطع الطويلة في صدر يصف ثقل الوطء. ودخل الإضمار آخر العجز أيضًا."
context: "من أبيات الناقة (22–27): بعد أن سأل هل تبلغه دارها، يصف سيرها. ومنه ينتقل إلى تشبيهها بالظليم في البيت التالي."
variants:
  - reading: "تَقِصُ الْإِكَامَ بِذَاتِ خُفٍّ مِيثَمِ"
    status: "رواية أخرى"
    note: "«ويروى: (تقص الإكام) أي تدقها. يقال: وقصه يقصه وقصا، إذا كسره» [@ibn-al-anbari، ص319]. وعند الأَعْلَم: «تَقِصُ الْإِكَامَ بِكُلِّ خُفٍّ مِيثَمِ» [@diwan-antara، ص199]."
  - reading: "تَطِسُ الْإِكَامَ بِوَقْعِ خُفٍّ مِيثَمِ"
    status: "رواية أخرى"
    note: "«ويروى: (بوقع خف)» [@ibn-al-anbari، ص319]. ويروي الزَّوْزَنِيّ «بِوَخْدِ خُفٍّ»، و«الوخد والوخدان: السير السريع» [@zawzani، ص251]."
  - reading: "خَطَّارَةٌ غِبَّ السُّرَى مَوَّارَةٌ"
    status: "رواية أخرى"
    note: "«ومن روى (موَّارة) بدل زيافة فانه أراد السُّرعة» [@tabrizi-ashr، ص190]، وبها ينشده لسان العرب [@lisan، ج6 ص256]."
