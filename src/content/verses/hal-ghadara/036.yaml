first: "أَثْنِي عَلَيَّ بِمَا عَلِمْتِ فَإِنَّنِي"
second: "سَمْحٌ مُخَالَطَتِي إِذَا لَمْ أُظْلَمِ"
meaning: "اذكريني بالخير بما تعرفين من أمري، فأنا سهل المعاشرة ما لم يظلمني أحد. قال ابن الأَنْبارِيّ: «يقول: أنا سهل مخالطتي إذا لم أظلم» [@ibn-al-anbari، ص336]. وفسّره الأَعْلَم: «أي أحتمل الأمور وإن شقت علي، ما لم أنل بظلم وذل» [@diwan-antara، ص205]."
vocabulary:
  - term: "أَثْنِي"
    text: "من الثناء، و«الثناء في المدح لا غير، والنثا مقصور يكون في الخير والشر» [@ibn-al-anbari، ص336]."
  - term: "سَمْحٌ"
    text: "سهل. «يقال: سمح سماحة، إذا سهل» [@ibn-al-anbari، ص336]."
  - term: "مُخَالَطَتِي"
    text: "معاشرتي. وفي رواية الأَعْلَم «مُخَالَقَتِي»، قال: «وحقيقة المخالقة أن يظهر خلقا مثل ما يظهر له» [@diwan-antara، ص205]."
  - term: "أُظْلَمِ"
    text: "«وأصل الظلم وضع الشيء في غير موضعه» [@ibn-al-anbari، ص336]."
context: "يصل البيت بما قبله: أعرضت عنه، فيطلب منها الثناء. وقد سأل أبو جعفر عن هذه الصلة وأجاب: «إذا رآك الناس قد كرهتني وأغدفت دوني القناع توهموا أنك استقللتني واسترذلتني، وأنا مستحق لخلاف ما صنعت، فأثنى عليّ بما علمت» [@ibn-al-anbari، ص336]. وهو عند الأَعْلَم 41 [@diwan-antara، ص205]، وعند الزَّوْزَنِيّ 35 [@zawzani، ص255]."
syntax:
  - "«وموضع أثنى جزم على الأمر» [@ibn-al-anbari، ص336]: فعل أمر للمؤنثة، مبني على حذف النون، والياء فاعله. و«بِمَا عَلِمْتِ» متعلق به، و«ما» موصولة أو مصدرية."
  - "«والنون والياء اسم إن، وخبرها ما عاد من الياء في مخالطتي، وسمح مرتفع بالمخالطة، والمخالطة مرتفعة به» [@ibn-al-anbari، ص336]: أي «سَمْحٌ مُخَالَطَتِي» جملة هي خبر «إنّ». ويعربها التِّبْرِيزِيّ وجهًا آخر: «مخالقتي» فاعل لـ«سهل» [@tabrizi-ashr، ص196]."
  - "«وإذا منصوبة على الوقت» [@ibn-al-anbari، ص336]، وجوابها محذوف دلّ عليه ما قبله."
morphology:
  - "أَثْنِي أمر من أَثْنَى يُثْنِي الرباعي، فهمزته همزة قطع مفتوحة."
  - "مُخَالَطَة مصدر خالَطَ على وزن مُفاعَلة، وهو بناء المشاركة؛ ومُخَالَقَة مثله من الخُلُق. ويقول الأَعْلَم: «وحقيقة المخالقة أن يظهر خلقا مثل ما يظهر له» [@diwan-antara، ص205]."
  - "أُظْلَمِ مضارع مبني للمجهول مجزوم بـ«لم»، وكُسرت الميم لأجل القافية."
rhetoric:
  thesis: "يقدّم سماحته ويشترط لها شرطًا: هو سهل ما لم يُظلم. فالشرط يُعدّ للبيت التالي، الذي يصف ما يكون إذا ظُلم."
  devices:
    - title: "الاحتراس في «إِذَا لَمْ أُظْلَمِ»"
      text: "الاحتراس أن يأتي المتكلم بقيد يدفع عن كلامه فهمًا لا يريده. فلو قال: إنني سمح، وسكت، لظُنّ أن سماحته ضعف. فقيّدها بقوله «إِذَا لَمْ أُظْلَمِ»، فصارت حلمًا من قادر. وهو المعنى الذي يشرحه الأَعْلَم: «أي أحتمل الأمور وإن شقت علي، ما لم أنل بظلم وذل» [@diwan-antara، ص205]."
    - title: "تقديم الخبر النكرة"
      text: "قدّم سمح على مخالطتي، فوقع الوصف أولًا في السمع، ثم ذكر الشيء الموصوف."
  connection: "ثم يصف ظلمه إذا ظُلم، فيكمل الصورة: سهل لمن سالمه، مرّ على من ظلمه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَثْنِي عَلَيْ / يَ بِمَا عَلِمْ / تِ فَإِنْنَنِي = مُتْفاعلن / متَفاعلن / متَفاعلن — سَمْحُنْ مُخَا / لَطَتِي إِذَا / لَمْ أُظْلَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز."
