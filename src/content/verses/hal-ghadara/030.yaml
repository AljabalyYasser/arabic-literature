first: "هِرٍّ جَنِيبٍ كُلَّمَا عَطَفَتْ لَهُ"
second: "غَضْبَى اتَّقَاهَا بِالْيَدَيْنِ وَبِالْفَمِ"
meaning: "ذلك الصائح هرّ مربوط إلى جنبها، كلما التفتت إليه غاضبة لتعضّه تلقّاها بيديه وفمه. قال ابن الأَنْبارِيّ: «يقول: إذا عطفت إليه غضبى لتعضه تلقاها بيده وبفمه» [@ibn-al-anbari، ص327]. وقال الزَّوْزَنِيّ: «يقول: كلما أمالت رأسها إليه زادها خدشًا وعضًا» [@zawzani، ص254]."
vocabulary:
  - term: "هِرٍّ"
    text: "«و (الهر) : السنور» [@ibn-al-anbari، ص327]، «يقال هي الهر والهرة، والقط، والسنور والسنورة، والضيون، بمعنى واحد» [@ibn-al-anbari، ص328]."
  - term: "جَنِيبٍ"
    text: "«و (الجنيب) : المجنوب؛ كأنه جنب إلى هذه الناقة» [@ibn-al-anbari، ص327]، وعند الزَّوْزَنِيّ: «جنيب أي مجنوب إليها أي مقود» [@zawzani، ص253]، والمجنوب: المقود إلى جنب غيره."
  - term: "عَطَفَتْ لَهُ"
    text: "مالت برأسها إليه."
  - term: "اتَّقَاهَا"
    text: "تلقّاها، «ويقال: اتقاه بحقه يتقيه، وتقاه يتقيه، إذا تلقاه به وجعله بينه وبينه» [@ibn-al-anbari، ص327]. وعند الزَّوْزَنِيّ: «اتّقاها أي استقبلها» [@zawzani، ص253]."
syntax:
  - "«هِرٍّ» مجرور على أنه نعت أو بدل من «هَزِجِ الْعَشِيِّ» في البيت السابق: «وهر من نعت هزج العشي، وغضبى موضعه نصب على الحال مما في عطفت، واتقاها جواب كلما، والباء صلة اتقاها» [@ibn-al-anbari، ص328]. وعند الزَّوْزَنِيّ: «هِرّ: بدل من هزج العشي» [@zawzani، ص253]."
  - "«كُلَّمَا» ظرف يفيد التكرار، وجوابه «اتَّقَاهَا»."
morphology:
  - "«جَنِيب» على وزن «فَعِيل» بمعنى «مفعول»."
  - "«اتَّقَى» على وزن «افْتَعَلَ» من «وَقَى»، قُلبت الواو تاء وأُدغمت في تاء الافتعال. و«غَضْبَى» مؤنث «غَضْبان» على وزن «فَعْلَى»."
rhetoric:
  thesis: "معركة صغيرة متخيلة: الناقة تلتفت غاضبة، والهرّ يردّ بيديه وفمه. فيتحول نشاط الناقة إلى مشهد قتال، في قصيدة فارس."
  devices:
    - title: "الإيضاح بعد الإبهام"
      text: "قال في البيت السابق «هَزِجِ الْعَشِيِّ» ولم يسمّه، ثم فسّره هنا «هِرٍّ جَنِيبٍ»، فـ«بيَّن ما الهزج» [@ibn-al-anbari، ص327]. والإيضاح بعد الإبهام يشوّق السامع ثم يقرّ المعنى في نفسه."
    - title: "المشهد المتحرك في «كُلَّمَا عَطَفَتْ ... اتَّقَاهَا»"
      text: "«كُلَّمَا» تجعل الفعل متكررًا: تلتفت فيرد، ثم تلتفت فيرد. ويستشهد ابن الأَنْبارِيّ لمثله بقول الشَّمّاخ: «كأنّ ابنَ آوى مُوثَقٌ تحت غَرزها ... إذا هو لم يَكدِمْ بنابَيه ظَفَّرا»، «أي إذا لم يجرح بنابيه خدش بظفره» [@ibn-al-anbari، ص327]. وفسّره أبو جَعْفَر بالسوط: «معناه إنها تفعل هذا اتقاء السوط، من حدة نفسها» [@ibn-al-anbari، ص328]."
  connection: "ثم يصف ما أبقاه السفر من جسمها: «أَبْقَى لَهَا طُولُ السِّفَارِ مُقَرْمَدًا» [@ibn-al-anbari، ص328]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "هِرْرِنْ جَنِي / بِنْ كُلْلَمَا / عَطَفَتْ لَهُو = مُتْفاعلن / مُتْفاعلن / متَفاعلن — غَضْبَتْ تَقَا / هَا بِلْيَدَيْ / نِ وَبِلْفَمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار الأوليين من الشطرين، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتسقط همزة الوصل في «اتَّقَاهَا»، فتُقصر ألف «غَضْبَى» قبل التاء الساكنة: «غَضْبَتْتَقَاهَا»."
context: "ثاني بيتي الهرّ (29–30)، ومن أبيات الناقة بعد الشرب. وبه يتم وصف نشاطها في السير، ثم ينتقل إلى قوة بدنها."
variants:
  - reading: "هِرٌّ جَنِيبٌ كُلَّمَا عَطَفَتْ لَهُ"
    status: "رواية الأَعْلَم"
    note: "بالرفع، وهي رواية الأَعْلَم الشَّنْتَمَرِيّ [@diwan-antara، ص202]، والهرّ فيها فاعل «ينأى» في البيت السابق كما يذكر التِّبْرِيزِيّ [@tabrizi-ashr، ص193]."
  - reading: "غَضْبَى تَقَاهَا بِالْيَدَيْنِ وَبِالْفَمِ"
    status: "رواية أخرى"
    note: "«ويروى (تقاها) بالتخفيف، يقال: اتقاه يتَّقيه، وتقاه يتقيه» [@tabrizi-ashr، ص193]."
