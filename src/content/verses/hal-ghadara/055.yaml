first: "لَمَّا رَآنِي قَدْ نَزَلْتُ أُرِيدُهُ"
second: "أَبْدَى نَوَاجِذَهُ لِغَيْرِ تَبَسُّمِ"
meaning: "لما رآني نزلت عن فرسي أقصده، كشّر عن أضراسه، لا ضاحكًا بل عابسًا. قال ابن الأَنْبارِيّ: «يقول: ليس إبداؤه نواجذه للضحك، إنما ذاك لكراهة منه وخشية من الموت» [@ibn-al-anbari، ص350]."
vocabulary:
  - term: "نَزَلْتُ"
    text: "نزلت عن فرسي للمنازلة، كما فسّره الزَّوْزَنِيّ: «لَمّا رآني هذا الرجل نزلت عن فرسي أريد قتله كشر عن أسنانه غير متبسم» [@zawzani، ص260]."
  - term: "أَبْدَى نَوَاجِذَهُ"
    text: "«معناه كلح في وجهي فبدت أضراسه. والناجذ: آخر الأضراس» [@ibn-al-anbari، ص350]."
context: "قلب مقطع حامي الحقيقة (53–58): بعد صفاته يأتي اللقاء. ويرى التِّبْرِيزِيّ أن هذا البيت يكون جواب رُبّ في البيت 53 إذا جُعل «المِشَكّ» الرجل لا الدرع [@tabrizi-ashr، ص203–204]. وفي ترتيب الأَعْلَم يأتي بعد البيت 58 «بطل كأن ثيابه»، فتتصل صفات الحامي كلها قبل اللقاء، ورقمه عنده 61 [@diwan-antara، ص212]. وهو عند الزَّوْزَنِيّ 53 [@zawzani، ص260]."
syntax:
  - "«وفاعل رآني مضمر فيه من ذكر حامي الحقيقة، وأريده موضعه رفع في اللفظ بالألف، وموضعه نصب في التأويل على الحال، كأنه قال: قد نزلت مريدا له. وأبدى جواب لما» [@ibn-al-anbari، ص350]."
  - "و«لَمَّا» ظرف بمعنى حين، فيه معنى الشرط. وجملة «قَدْ نَزَلْتُ» في موضع المفعول الثاني لـ«رَأَى» إن كانت علمية، أو حال إن كانت بصرية [@ibn-al-anbari، ص350]."
morphology:
  - "نَوَاجِذ جمع ناجِذ على وزن فَوَاعِل."
  - "تَبَسُّم مصدر تَبَسَّمَ على وزن تفعُّل."
  - "رَآنِي ماضي رأى، اتصلت به نون الوقاية وياء المتكلم."
rhetoric:
  thesis: "لحظة واحدة يقرأ فيها خوف الخصم على وجهه: أسنان بادية، لكنها ليست ابتسامة. فالفارس الكريم الذي وُصف في الأبيات السابقة يعبس أمام الموت."
  devices:
    - title: "الاحتراس في «لِغَيْرِ تَبَسُّمِ»"
      text: "إبداء النواجذ يكون في الضحك الشديد، فلو اقتصر عليه لظُنّ أن الخصم يستخف به. فاحترس بقوله «لغير تبسم». ويقول الأَعْلَم: «أي لم يكن إبداؤه لنواجذه من أجل التبسم وإنما كان كلوحًا» [@diwan-antara، ص212]."
    - title: "تعدد التأويل"
      text: "اختلفوا في سبب الكلوح: فعند ابن الأَنْبارِيّ «لكراهة منه وخشية من الموت» [@ibn-al-anbari، ص350]، وعند أبي جعفر: «معناه استبسل للموت» [@ibn-al-anbari، ص351]، وعند الأَعْلَم: «أي كلح غيظًا علي وموجدة، ويقال: بل كلح كراهية للطعن» [@diwan-antara، ص212]. فالصورة واحدة، والمعنى بين الخوف والغيظ والاستبسال."
  connection: "ثم يأتي القتل: طعنة بالرمح، ثم ضربة بالسيف."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "لَمْمَا رَآ / نِي قَدْ نَزَلْ / تُ أُرِيدُهُو = مُتْفاعلن / مُتْفاعلن / متَفاعلن — أَبْدَى نَوَا / جِذَهُو لِغَيْ / رِ تَبَسْسُمِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، والأولى من العَجُز."
