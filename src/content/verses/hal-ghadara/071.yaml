first: "وَازْوَرَّ مِنْ وَقْعِ الْقَنَا بِلَبَانِهِ"
second: "وَشَكَا إِلَيَّ بِعَبْرَةٍ وَتَحَمْحُمِ"
meaning: "ومال الفرس من وقع الرماح في صدره، وشكا إليّ بدمعة وصوت متقطع. قال الزَّوْزَنِيّ: «يقول: فمال فرسي مما أصابت رماح الأعداء صدره ووقوعها به وشكا إلي بعبرته وحمحمته، أي نظر إلي وحمحم لأرقَّ له» [@zawzani، ص263]."
vocabulary:
  - term: "ازْوَرَّ"
    text: "«معناه تمايل، وهو مأخوذ من الزور، والزور: الميل» [@ibn-al-anbari، ص361]. وعند الأَعْلَم: «أي أعرض الفرس لما رأى الرماح تقع بنحره» [@diwan-antara، ص218]."
  - term: "عَبْرَةٍ"
    text: "«الدمعة، وجمعها عبر» [@ibn-al-anbari، ص361]. وقال أبو جعفر: «العبرة تنزل الدمعة، وهي ارتفاع الغم من الصدر حتى يخنق فيكاد يقتل» [@ibn-al-anbari، ص361]."
  - term: "تَحَمْحُمِ"
    text: "عند الأَعْلَم: «والتحمحم الصوت الخفي، فإن اشتد فهو الصهيل» [@diwan-antara، ص218]. وفي اللسان: «وَقِيلَ: الحَمْحَمة والتَّحَمْحُم عَرُّ الْفَرَسِ حِينَ يُقَصِّر فِي الصَّهيل وَيَسْتَعِينُ بنفَسه» [@lisan، ج12 ص161]."
context: "يعود من النداء إلى الفرس في مقطع الكرّة (67–74). وهذا البيت والذي بعده من أكثر أبيات المعلقة دورانًا في كتب النقد. فأبو هلال العسكري يعيب على المثقِّب العبدي أن جعل ناقته تتكلم، ثم يقول: «والذي يقارب الصواب قول عنترة» [@sinaatayn، ص114–115]، وفي المُوَشَّح مثله: «والذى يقارب الحقيقة قول عنترة فى وصف فرسه» [@muwashshah، ص121]. والبيت عند الأَعْلَم 75 [@diwan-antara، ص217]، وعند الزَّوْزَنِيّ 68 [@zawzani، ص263]، وعندهما وعند التِّبْرِيزِيّ يأتي قبل البيت 70."
syntax:
  - "الواو عاطفة، و«مِنْ وَقْعِ» متعلق بـ«ازْوَرَّ» للتعليل، و«بِلَبَانِهِ» متعلق بـ«وَقْعِ». و«تَحَمْحُمِ» معطوف على «عَبْرَةٍ» [@ibn-al-anbari، ص361]."
morphology:
  - "ازْوَرَّ على وزن افْعَلَّ، وهو بناء الألوان والعيوب والميل. «يقال: ازور يزورّ، وتزاور يتزاور، وازوار يزوار، وازَّاور يزَّاور» [@ibn-al-anbari، ص361]."
  - "تَحَمْحُم مصدر تَحَمْحَمَ على وزن تَفَعْلُل، من الرباعي المضعّف، وتكرار المقطع يحاكي الصوت."
rhetoric:
  thesis: "الفرس شريك في الحرب يشعر ويتألم. لكنه لا يتكلم، وإنما يشكو بما يملك: دمعة وحمحمة."
  devices:
    - title: "التشخيص في «وَشَكَا إِلَيَّ»"
      text: "أعطى الفرس شكوى الإنسان، فـ«(وشكا إليَّ بعبرة) مثل، معناه فعَل فعِل مستعبر، أي لو كان ممن يتكلم لشكا بلسانه» [@ibn-al-anbari، ص361]. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]. لكنه جعل أداة الشكوى مما يملكه الفرس حقًّا، الدمعة والتحمحم، فبقيت الصورة قريبة من الحقيقة، وهذا ما مدحه النقاد."
  connection: "ثم يتم المعنى بشرط: لو عرف الفرس الكلام لكلّمه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَزْوَرْرَ مِنْ / وَقْعِلْ قَنَا / بِلَبَانِهِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن — وَشَكَا إِلَيْ / يَ بِعَبْرَتِنْ / وَتَحَمْحُمِي = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، وجاء العَجُز تامًّا."
