first: "وَخَلَا الذُّبَابُ بِهَا فَلَيْسَ بِبَارِحٍ"
second: "غَرِدًا كَفِعْلِ الشَّارِبِ الْمُتَرَنِّمِ"
meaning: "خلت الروضة للذباب، لا يزاحمه فيها شيء، فهو لا يفارقها، يغني كما يغني الشارب حين يترنم. قال ابن الأَنْبارِيّ: «معناه: قد خلا هذا المكان له، فليس فيه شيء يزاحمه ولا يفزعه، فهو يصوت في رياضه» [@ibn-al-anbari، ص314]. وقال الزَّوْزَنِيّ: «ويصوتن تصويت شارب الخمر حين رجع صوته بالغناء، شبه أصواتها بالغناء» [@zawzani، ص250]."
vocabulary:
  - term: "خَلَا الذُّبَابُ بِهَا"
    text: "انفرد بها، «والذباب بمعنى الجمع» [@ibn-al-anbari، ص314]. قال التِّبْرِيزِيّ: «والذباب واحد يؤدي عن جماعة» [@tabrizi-ashr، ص187]."
  - term: "بَارِحٍ"
    text: "«معناه بزائل. يقال ما برحت قائما، أي ما زلت» [@ibn-al-anbari، ص314]."
  - term: "غَرِدًا"
    text: "«والتغريد: التطريب» [@ibn-al-anbari، ص315]، وعند الأَعْلَم الشَّنْتَمَرِيّ: «الغرد الذي يمد في صوته ويطرب» [@diwan-antara، ص198]."
  - term: "الْمُتَرَنِّمِ"
    text: "«والمترنم: الذي يطرب قليلاً قليلا لا يرفع صوته» [@ibn-al-anbari، ص315]. وعند الزَّوْزَنِيّ: «الترنم: ترديد الصوت بضرب من التلحين» [@zawzani، ص250]."
syntax:
  - "«الذُّبَابُ» فاعل «خَلَا»، و«بِهَا» متعلق به. «واسم ليس مضمر فيها من ذكر الذباب، وببارح خبر ليس واسم بارح مضمر فيه، وغردا خبره» [@ibn-al-anbari، ص315]. أي أن «بارح» يعمل عمل «برح» الناقصة، وقال الفَرّاء: «ما برح وما زال وما فتئ بمنزلة ما كان، يرفعن الأسماء وينصبن الأخبار» [@ibn-al-anbari، ص315]."
  - "ويجعل التِّبْرِيزِيّ «غَرِدًا» حالًا: «وغَرِداً: منصوب على الحال، والمعنى وخلا الذباب بها غَرِداً»، و«الكاف في قوله: (كفعل الشارب) في موضع نصب؛ لأنها نعت لمصدر محذوف، والمعنى: يفعل مثل فعل الشارب» [@tabrizi-ashr، ص186–187]."
morphology:
  - "«غَرِد» صفة على وزن «فَعِل»، «يقال: غرد الحادي في حدائه يغرد تغريدا، فهو مغرد، وغريد، وغرِد، وغرْد، إذا طرب في حدائه» [@ibn-al-anbari، ص315]."
  - "«الذُّبَاب» مفرد، وجمعه عند التِّبْرِيزِيّ «أذبة في أقل العدد، وذِبَّان في الكثرة» [@tabrizi-ashr، ص187]. و«بارِح» اسم فاعل من «بَرِحَ» على «فاعِل»."
rhetoric:
  thesis: "الروضة كلها للذباب: لا إنسان فيها ولا راعٍ ولا ماشية. والصوت الوحيد فيها طنين يشبه غناء رجل سكران يترنم لنفسه."
  devices:
    - title: "التشبيه في «كَفِعْلِ الشَّارِبِ الْمُتَرَنِّمِ»"
      text: "شبّه طنين الذباب بترنّم الشارب، قال الأَعْلَم: «شبه غناء الذباب بغناء الشارب» [@diwan-antara، ص197]. ووجه الشبه صوت خافت متصل يتردد، لا يرتفع ولا ينقطع."
    - title: "الخلوة في «وَخَلَا»"
      text: "بدأ بالفعل «خَلَا»: الروضة خالية إلا من الذباب. وهذا يتم ما قاله في البيت 15: روضة لم تُرعَ، وليست بمعلم. فالذباب علامة على أن أحدًا لم يصل إليها."
    - title: "الأخذ والقلب"
      text: "الأخذ: أن يأخذ شاعر معنى شاعر قبله. ويرى ابن رَشِيق أن أبا مِحْجَن الثَّقَفِيّ أخذ هذا البيت فقلبه، إذ قال في قينة: «وترفع الصوت أحياناً وتخفضه ... كما يطن ذباب الروضة الغرد»، ثم قال: «فأي قينة تحب أن تشبه بالذباب؟ وقد سرق بيت عنترة وقلبه فأفسده» [@ibn-rashiq، ج1 ص302]. فعنترة شبّه الذباب بالمغني فرفعه، وأبو محجن شبّه المغنية بالذباب فحطّها."
  connection: "ثم يتم الصورة في البيت التالي بحركة الذباب: «هَزِجًا يَحُكُّ ذِرَاعَهُ بِذِرَاعِهِ» [@ibn-al-anbari، ص315]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَخَلَذْ ذُبَا / بُ بِهَا فَلَيْ / سَ بِبَارِحِنْ = متَفاعلن / متَفاعلن / متَفاعلن — غَرِدَنْ كَفِعْ / لِشْشَارِبِلْ / مُتَرَنْنِمِي = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "جاء الصدر تامًّا، ودخل الإضمار التفعيلة الثانية من العجز وحدها، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وتُقصر ألف «خَلَا» لالتقائها بلام التعريف المدغمة في الذال: «وَخَلَذْذُبَابُ»."
context: "أول بيتي الذباب (18–19)، وهما أشهر ما في القصيدة عند النقاد القدماء. قال ابن قُتَيْبة: «وممّا سبق إليه ولم ينازع فيه قوله»، وأنشدهما ثم قال: «وهذا من أحسن التشبيه» [@ibn-qutayba، ج1 ص246]. وقال الجاحِظ (ت 255هـ): «وهذا المعنى قد غلب عليه بشّار، كما غلب عنترة على قوله»، وأنشدهما، ثم قال: «فلو أنّ امرأ القيس عرض في هذا المعنى لعنترة لافتضح» [@hayawan، ج3 ص65]، وقال في موضع آخر: «ولم أسمع في هذا المعنى بشعر أرضاه غير شعر عنترة» [@hayawan، ج3 ص150]. ويذكر شوقي ضَيْف أن الجاحظ «كان يعجب إعجابا شديدا بوصف عنترة لبعض الرياض وتصويره للذباب» [@deif، ج1 ص229]."
variants:
  - reading: "فَتَرَى الذُّبَابَ بِهَا يُغَنِّي وَحْدَهُ ... هَزِجًا كَفِعْلِ الشَّارِبِ الْمُتَرَنِّمِ"
    status: "رواية أبي عُبَيْدة والأَصْمَعِيّ"
    note: "«وروى أبو عبيدة والأصمعي: (وترى الذباب بها يغني وحده هزجاً)» [@ibn-al-anbari، ص315]. وهي رواية الأَعْلَم بالفاء «فترى» [@diwan-antara، ص197]، وبها ينشده الجاحِظ [@hayawan، ج3 ص65]. وفي شرح الأَعْلَم: «يصف أنها روضة كثيرة العشب مخصبة متكملة النبت والذباب يألفها ويغني بها» [@diwan-antara، ص197]."
