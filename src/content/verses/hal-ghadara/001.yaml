first: "هَلْ غَادَرَ الشُّعَرَاءُ مِنْ مُتَرَدَّمِ"
second: "أَمْ هَلْ عَرَفْتَ الدَّارَ بَعْدَ تَوَهُّمِ"
meaning: "هل ترك الشعراء قبلي موضعًا من الشعر لم يُصلحوه؟ ثم يدع هذا السؤال ويسأل نفسه: أم هل عرفت دار الحبيبة بعد أن أنكرتها لتغيّرها؟ قال الأَعْلَم الشَّنْتَمَرِيّ: «وإنما يريد أنه مر بالديار وقد خلت من أهلها، ودرست رسومها فلم يعرفها إلا بعد إنكاره لها وتثبته فيها» [@diwan-antara، ص183]."
vocabulary:
  - term: "غَادَرَ"
    text: "ترك؛ ومنه الغدير: «وإنما سمى الغدير غديرا لأن السيل غادره، أي تركه» [@ibn-al-anbari، ص295]."
  - term: "مُتَرَدَّمِ"
    text: "قال الأَصْمَعِيّ: «يقال ردم ثوبك، أي رقعه. ويقال ثوب مردم، أي مرقع» [@ibn-al-anbari، ص295]. فالمتردَّم الموضع الذي يُرقَع، وفي لسان العرب: «والمُتَرَدَّمُ: الْمَوْضِعُ الَّذِي يُرَقَّعُ» [@lisan، ج12 ص236]. وعند الأَعْلَم هو من قولهم: «ردمت الشيء إذا أصلحته وقويت ما وهى منه» [@diwan-antara، ص182]. ويذكر أبو الفَرَج الأَصْفَهانيّ معنى آخر: «والمتردَّم: المتعطَّف، وهو مصدر»، من قولهم: تردّمت الناقة على ولدها إذا تعطّفت عليه [@aghani-dk، ج9 ص222]."
  - term: "تَوَهُّمِ"
    text: "عند ابن الأَنْبارِيّ: «لم أعرفها إلا توهما إنها هي الدار التي كنت أعهد» [@ibn-al-anbari، ص295]. وعند الأَعْلَم هو الإنكار: «يقال: توهمت الشيء إذا أنكرته فتثبت منه وطلبت حقيقته» [@diwan-antara، ص183]. ويجمع التِّبْرِيزِيّ القولين: «والتوهم هنا: الإنكار، ويحتمل أن يكون بمعنى الظن» [@tabrizi-ashr، ص177]."
syntax:
  - "«هَلْ» حرف استفهام، و«الشُّعَرَاءُ» فاعل «غَادَرَ»، و«مُتَرَدَّمِ» مجرور لفظًا بـ«مِنْ» ومنصوب محلًّا لأنه المفعول، والتقدير عند ابن الأَنْبارِيّ: «هل غادر الشعراء متردما» [@ibn-al-anbari، ص296]."
  - "و«مِنْ» هذه لا تدخل على المفعول إلا بعد النفي وما يشبهه، قال ابن الأَنْبارِيّ: «لا يجوز أكرمت من رجل وكسبت من مال» [@ibn-al-anbari، ص296]؛ والاستفهام هنا في معنى النفي، فجاز دخولها."
  - "«أَمْ» تجمع حرفي استفهام، قال التِّبْرِيزِيّ: «إنما دخلت أم على هل وهما حرفا استفهام لأن هل ضعُفت في حروف الاستفهام فأدخلت عليها أم» [@tabrizi-ashr، ص177]. ويجعلها الزَّوْزَنِيّ بمعنى «بل»، ويجيز أن تكون «هل» الثانية بمعنى «قد» [@zawzani، ص245]."
morphology:
  - "«مُتَرَدَّم» اسم مفعول من «تَرَدَّمَ» على وزن «مُتَفَعَّل»، وهو عند الزَّوْزَنِيّ «الموضع الذي يسترقع ويستصلح لما اعتراه من الوهن والوهي» [@zawzani، ص245]."
  - "«الشُّعَرَاء» جمع «شاعر» على «فُعَلاء»، وهو في الأصل جمع «فَعِيل». قال التِّبْرِيزِيّ: «إلا أن فعيلا إنما يقع لمن قد كمل ما هو فيه، فلما كان شاعر إنما يقال لمن قد عرف بالشعر شُبِّه بفعيل» [@tabrizi-ashr، ص177]. وسُمّي الشاعر شاعرًا لفطنته، من قولهم: «ما شعرت بهذا الأمر، أي فطنت له» [@ibn-al-anbari، ص295]."
  - "«تَوَهُّم» مصدر «تَوَهَّمَ» على وزن «تَفَعُّل»."
rhetoric:
  thesis: "يفتح عَنْتَرَة معلقته بسؤال عن الشعر نفسه: هل بقي معنى لم يقله الشعراء قبلي؟ ثم يقف على الدار كما وقفوا. فهو يعرف أن الوقوف على الديار طريق قديم سبقه إليه الشعراء، ومع ذلك يسير فيه."
  devices:
    - title: "الاستفهام بمعنى النفي"
      text: "«هَلْ غَادَرَ الشُّعَرَاءُ» معناه: لم يترك الشعراء شيئًا. قال الزَّوْزَنِيّ: «وهذا استفهام يتضمن معنى الإنكار، أي لم يترك الشعراء شيئًا يصاغ فيه شعر إلا وقد صاغه فيه، وتحرير المعنى: لم يترك الأول للآخر شيئًا» [@zawzani، ص245]."
    - title: "صورة الثوب المرقوع في «مُتَرَدَّم»"
      text: "كلمة «مُتَرَدَّم» من قولهم: ردمتُ الثوب إذا رقعته، فكأن الشعر ثوب، وكل معنى فيه موضع رقعه شاعر قبل عَنْتَرَة، وهو يسأل: هل بقي في هذا الثوب موضع لم يُرقع؟ قال الأَصْمَعِيّ: «وإنما هذا مثل. يقول: هل تركوا مقالا لقائل، أي فنا من الشعر لم يسلكوه» [@ibn-al-anbari، ص295]. وهذه استعارة على ما حدّها عبد القاهر الجُرْجانيّ: «أن تُريدَ تشبيهَ الشيءِ بالشيءِ، فَتَدعَ أنْ تُفْصحَ بالتشبيهِ وتُظْهرَه، وتجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ» [@dalail، ص67]؛ فذكر الثوب المرقوع وأراد الشعر."
    - title: "الإضراب وخطاب النفس"
      text: "في «أَمْ هَلْ عَرَفْتَ» ترك الحديث عن الشعراء إلى خطاب نفسه، قال الأَعْلَم: «أضرب عما كان فيه ثم استأنف السؤال» [@diwan-antara، ص182]. والإضراب: الانصراف عن كلام إلى غيره. فكأنه يوقظ نفسه من التأمل في الشعر إلى الدار الماثلة أمامه."
  connection: "ثم ينادي الدار باسم صاحبتها: «يَا دَارَ عَبْلَةَ بِالْجِوَاءِ تَكَلَّمِي» [@ibn-al-anbari، ص296]. وفي رواية الأَعْلَم بينهما بيتان، أولهما «أَعْيَاكَ رَسْمُ الدَّارِ لَمْ يَتَكَلَّمِ ... حَتَّى تَكَلَّمَ كَالْأَصَمِّ الْأَعْجَمِ» [@diwan-antara، ص182]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "هَلْ غَادَرَشْ / شُعَرَاءُ مِنْ / مُتَرَدْدَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن — أَمْ هَلْ عَرَفْ / تَدْدَارَ بَعْ / دَ تَوَهْهُمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "وزن الكامل «متَفاعلن» ست مرات، ويدخله كثيرًا الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، فتصير «متَفاعلن» «مُتْفاعلن». وقد دخل ثلاث تفعيلات في هذا البيت. والبيت مصرَّع، والتصريع «ما كانت عروض البيت فيه تابعة لضربه» [@ibn-rashiq، ج1 ص173]: والعَرُوض آخر تفعيلة في الصدر، والضَّرْب آخر تفعيلة في العَجُز، فخُتم الصدر هنا بقافية العجز: «مُتَرَدَّمِ» و«تَوَهُّمِ»."
context: "مطلع المعلقة، وهو بيت مختلف فيه. يروي ابن الأَنْبارِيّ: «قال يعقوب: سمعت أبا عمرو يقول: لم اكن أروى هذا البيت لعنترة حتى سمعت أبا حزام العكلي ينشده له» [@ibn-al-anbari، ص294]. وأبو عَمْرو هو الشَّيْبانيّ، كما يسمّيه أبو الفَرَج في خبر أتمّ: يدفع البيتَ «أكثرُ الرواة»، «وممن يدفعه الأصمعيّ وابن الأعرابيّ. وأول القصيدة عندهما يا دار عبلة» [@aghani-dk، ج9 ص222]. ويوافقه أن ابن سَلّام يذكر القصيدة بمطلع «يا دار عبلة بالجواء تكلمى» [@ibn-sallam، ج1 ص152]. وأبو حِزام العُكْلِيّ الذي سمعه منه أبو عَمْرو أعرابي يذكره قُدامة بن جعفر فيمن يتكلّف الغريب، «وكان في زمن المهدي» [@naqd-al-shir، ص65]. لكن البيت أول القصيدة عند الأَعْلَم [@diwan-antara، ص182]، وعند ابن الأَنْبارِيّ والزَّوْزَنِيّ والتِّبْرِيزِيّ، وبه يسمّي ابن قُتَيْبة القصيدة [@ibn-qutayba، ج1 ص245]. ولم نجد ما يحسم الخلاف، فنُبقي البيت في موضعه وننبّه عليه."
variants:
  - reading: "هَلْ غَادَرَ الشُّعَرَاءُ مِنْ مُتَرَنَّمِ"
    status: "رواية أخرى"
    note: "قال التِّبْرِيزِيّ: «ويروى من (مترنم) والترنم: صوت خفي ترجعه بينك وبين نفسك» [@tabrizi-ashr، ص177]. ويذكر محقق ديوان عَنْتَرَة أن البَطَلْيَوْسِيّ رواها ونسبها إلى أبي عُبَيْدة [@diwan-antara، ص182]. ويذكر الزَّوْزَنِيّ «التردم» بمعنى الترنم وجهًا ثانيًا في تفسير البيت [@zawzani، ص245]."
  - reading: "أَمْ هَلْ عَرَفْتَ الرَّبْعَ بَعْدَ تَوَهُّمِ"
    status: "رواية أخرى"
    note: "يذكرها التِّبْرِيزِيّ، والرَّبْع: «المنزل في الربيع، ثم كثر استعمالهم إياه حتى قيل (ربع) وإن لم يكن في الربيع» [@tabrizi-ashr، ص177]."
