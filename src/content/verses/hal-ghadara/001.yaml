first: "هَلْ غَادَرَ الشُّعَرَاءُ مِنْ مُتَرَدَّمِ"
second: "أَمْ هَلْ عَرَفْتَ الدَّارَ بَعْدَ تَوَهُّمِ"
meaning: "هل ترك الشعراء قبلي شيئًا لم يقولوا فيه؟ ثم يلتفت إلى نفسه: أم هل عرفت دار الحبيبة بعد أن كدت لا تعرفها لتغيرها [@ibn-al-anbari، ص295]؟"
vocabulary:
  - term: "غَادَرَ"
    text: "ترك؛ ومنه سُمّي الغدير غديرًا، لأن السيل غادره [@ibn-al-anbari، ص294–295]."
  - term: "مُتَرَدَّمِ"
    text: "من «ردَمتُ الثوب» إذا رقعته؛ يقول: هل ترك الشعراء شيئًا يُرقَع [@ibn-al-anbari، ص295]. ويأتي «التردّم» أيضًا بمعنى الترنّم [@zawzani، ص245]."
  - term: "تَوَهُّمِ"
    text: "ظنّ من غير يقين؛ أي: لم أعرفها إلا توهّمًا أنها الدار التي كنت أعهد [@ibn-al-anbari، ص295]."
syntax:
  - "«هَلْ» حرف استفهام، و«الشُّعَرَاءُ» فاعل «غَادَرَ»، و«مِنْ مُتَرَدَّمِ» مفعول به مجرور بـ«مِنْ» الزائدة، والتقدير: هل غادر الشعراء متردَّمًا [@ibn-al-anbari، ص296]."
  - "و«مِنْ» الزائدة لا تدخل على المفعول إلا بعد النفي وما يشبهه من الاستفهام؛ فلا يقال: أكرمت من رجل [@ibn-al-anbari، ص296]."
  - "«أَمْ» في العَجُز قد تكون بمعنى «بل»: بل هل عرفت الدار؟ ويجوز أن تكون «هَلْ» الثانية بمعنى «قد» [@zawzani، ص245]."
morphology:
  - "«مُتَرَدَّمِ» اسم مفعول من «تردّم» على وزن «مُتَفَعَّل»: الموضع الذي يُسترقع ويُستصلح [@zawzani، ص245]."
  - "«الشُّعَرَاءُ» جمع «شاعر»؛ وسُمّي الشاعر شاعرًا لفطنته، من قولهم: شعرت بالأمر إذا فطنت له [@ibn-al-anbari، ص295]."
  - "«تَوَهُّمِ» مصدر «تَوَهُّمِ» على وزن «تفعُّل»."
rhetoric:
  thesis: "يفتح عَنْتَرَة معلقته بسؤال عن الشعر نفسه: هل بقي شيء لم يقله الشعراء؟ ثم يدخل في الطريق نفسه، فيقف على الدار. فالبيت يعترف بقِدم التقليد ويسير فيه معًا."
  devices:
    - title: "الاستفهام بمعنى النفي"
      text: "«هَلْ غَادَرَ الشُّعَرَاءُ» معناه: لم يترك الشعراء شيئًا يُصاغ فيه شعر إلا صاغوه؛ «وتحرير المعنى: لم يترك الأول للآخر شيئًا» [@zawzani، ص245]."
    - title: "صورة الثوب المرقوع في «مُتَرَدَّم»"
      text: "كلمة «مُتَرَدَّم» من قولهم: ردمتُ الثوب، إذا رقعته [@ibn-al-anbari، ص295]؛ فالمتردَّم هو الموضع الذي يُرقع. فكأن الشعر ثوب، وكل معنى فيه موضع رقعه شاعر قبل عَنْتَرَة، وهو يسأل: هل بقي في هذا الثوب موضع لم يُرقع؟ أي: هل بقي معنى لم يُقل؟ قال ابن الأَنْبارِيّ: «وإنما هذا مثل. يقول: هل تركوا مقالًا لقائل» [@ibn-al-anbari، ص295]."
    - title: "خطاب النفس"
      text: "انتقل من الحديث عن الشعراء إلى خطاب نفسه «أَمْ هَلْ عَرَفْتَ»، فكأنه يوقظ نفسه من التأمل إلى الدار الماثلة أمامه."
  connection: "ثم ينادي الدار باسم حبيبته: «يَا دَارَ عَبْلَةَ بِالْجِوَاءِ تَكَلَّمِي» [@ibn-al-anbari، ص296]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "هَلْ غَادَرَشْ / شُعَرَاءُ مِنْ / مُتَرَدْدَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن — أَمْ هَلْ عَرَفْ / تَدْدَارَ بَعْ / دَ تَوَهْهُمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "وزن الكامل «متَفاعلن» ست مرات، ويدخله كثيرًا الإضمار، وهو تسكين الثاني المتحرك، فتصير «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]. وقد دخل ثلاث تفعيلات في هذا البيت."
context: "مطلع معلقة عَنْتَرَة. ويروي ابن الأَنْبارِيّ أنها أول ما قال من الشعر الطويل، وكان قبلها لا يقول إلا البيت والبيتين في الحرب [@ibn-al-anbari، ص294]. وقال أبو عَمْرو بن العلاء: «لم أكن أروي هذا البيت لعَنْتَرَة حتى سمعت أبا حِزام العُكْلِيّ ينشده له» [@ibn-al-anbari، ص294]."
