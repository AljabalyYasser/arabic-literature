first: "حُيِّيتَ مِنْ طَلَلٍ تَقَادَمَ عَهْدُهُ"
second: "أَقْوَى وَأَقْفَرَ بَعْدَ أُمِّ الْهَيْثَمِ"
meaning: "يحيّي الطلل الذي طال عهده بأهله، ثم يخبر أنه خلا بعد رحيل صاحبته أمّ الهَيْثَم. قال الزَّوْزَنِيّ: «ثم أخبر أنه قدم عهده بأهله وقد خلا عن السكان بعد ارتحال حبيبته عنه» [@zawzani، ص246]. والتحية في الظاهر للطلل، وهي عند ابن الأَنْبارِيّ «في المعنى لمن كان يسكنه من أهله» [@ibn-al-anbari، ص299]."
vocabulary:
  - term: "حُيِّيتَ"
    text: "«دعاء له بالتحية. والتحية: السلام» [@ibn-al-anbari، ص298]. وعند الأَعْلَم الشَّنْتَمَرِيّ: «حييت من طلل أي أحياك الله» [@diwan-antara، ص186]."
  - term: "طَلَلٍ"
    text: "«ما شخص من آثار الدار من أثفية أو نؤى»، والرسم: «ما كان له أثر ولا شخص له» [@ibn-al-anbari، ص299]. فالطلل ما ارتفع من بقايا الدار كحجارة القدر، والنُّؤْي: الحاجز يُحفر حول البيت ليرد عنه الماء."
  - term: "تَقَادَمَ عَهْدُهُ"
    text: "«معناه قدم عهده بسكانه الذين نزلوه» [@ibn-al-anbari، ص299]."
  - term: "أَقْوَى"
    text: "«معناه خلا. يقال منزل قواء، إذا كان خاليا» [@ibn-al-anbari، ص299]."
  - term: "أَقْفَرَ"
    text: "«معناه كمعنى أقوى» [@ibn-al-anbari، ص299]، أي خلا."
  - term: "أُمِّ الْهَيْثَمِ"
    text: "«أم الهيثم: كنية عبلة» [@zawzani، ص246]."
syntax:
  - "«حُيِّيتَ» فعل ماض مبني للمجهول، والتاء نائب فاعل، «والتاء موضعها رفع لأنها اسم ما لم يسم فاعله» [@ibn-al-anbari، ص299]. و«مِنْ طَلَلٍ» عند ابن الأَنْبارِيّ تفسير، أي تمييز: «ومن دخلت على المفسر» [@ibn-al-anbari، ص299]."
  - "وجملة «تَقَادَمَ عَهْدُهُ» صفة لـ«طَلَلٍ»، «وأقوى خبر مستأنف، وأقفر نسق عليه» [@ibn-al-anbari، ص299]، أي جملة جديدة يُخبر بها عن الطلل، و«أَقْفَرَ» معطوف على «أَقْوَى». و«بَعْدَ» ظرف متعلق بـ«أَقْوَى» أو بـ«أَقْفَرَ»."
morphology:
  - "«حُيِّيتَ» ماض مبني للمجهول من «حَيّا» على وزن «فَعَّلَ»، ومنه التحية."
  - "«أَقْوَى» و«أَقْفَرَ» على وزن «أَفْعَلَ»، والهمزة فيهما للصيرورة: صار قَواءً وقَفْرًا. ومن الأول قولهم: «أقوى الرجل، إذا ذهب زاده» [@ibn-al-anbari، ص299]."
rhetoric:
  thesis: "تحية لطلل لا يرد، ثم خبر عن خلائه بلفظين. فالشاعر يعرف أن الدار خالية، ومع ذلك يحيّيها."
  devices:
    - title: "الترادف في «أَقْوَى وَأَقْفَرَ»"
      text: "اللفظان بمعنى واحد، قال ابن الأَنْبارِيّ: «فلما اختلفت اللفظتان نسق إحداهما على الأخرى» [@ibn-al-anbari، ص299]، وقال الزَّوْزَنِيّ: «جمع بينهما لضرب من التأكيد» [@zawzani، ص246]، وفي لسان العرب: «إِلا أَن اللَّفْظَيْنِ أَوْكَدُ فِي الْخَلْوَةِ» [@lisan، ج8 ص176]. ويذكر التِّبْرِيزِيّ رأيًا آخر لأبي العَبّاس المُبَرِّد: «وزعم أبو العباس إنه لا يجوز أن يتكرر شيء إلا وفيه فائدة» [@tabrizi-ashr، ص179]."
    - title: "الالتفات بين «حُيِّيتَ» و«أَقْوَى»"
      text: "الالتفات: أن ينتقل المتكلم من الخطاب إلى الغيبة أو من الغيبة إلى الخطاب. خاطب الطلل في الصدر «حُيِّيتَ»، ثم تحدث عنه غائبًا في العجز «أَقْوَى وَأَقْفَرَ». فكأنه حيّاه، فلما لم يجب صار يخبر عنه."
    - title: "تحية الطلل وإرادة أهله"
      text: "«حُيِّيتَ مِنْ طَلَلٍ» دعاء في ظاهره للحجارة والآثار، وفي معناه لأهلها، كما يقول ابن الأَنْبارِيّ: «يقال: الدعاء في الظاهر للطلل، وفي المعنى لمن كان يسكنه من أهله» [@ibn-al-anbari، ص299]."
  connection: "ثم يذكر أين ذهبت: «حَلَّتْ بِأَرْضِ الزَّائِرِينَ فَأَصْبَحَتْ» [@ibn-al-anbari، ص299]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "حُيْيِيتَ مِنْ / طَلَلِنْ تَقَا / دَمَ عَهْدُهُو = مُتْفاعلن / متَفاعلن / متَفاعلن — أَقْوَى وَأَقْ / فَرَ بَعْدَ أُمْ / مِلْهَيْثَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار الأولى من الصدر، والأولى والثالثة من العجز، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. والضرب، أي آخر تفعيلة في البيت، جاء مُضمَرًا «مُتْفاعلن»، وهو جائز في الكامل. وتُشبع ضمة الهاء في «عَهْدُهُ» آخر الصدر فتُنطق «عَهْدُهُو»."
context: "يعود إلى الدار بعد أن ذكر بُعد الحيّين، فيحيّي طللها. وفيه أول كنية لصاحبته، «أم الهيثم»، بعد اسمها «عبلة» في البيتين 2 و4."
