first: "إِنِّي عَدَانِي أَنْ أَزُورَكِ فَاعْلَمِي"
second: "مَا قَدْ عَلِمْتِ وَبَعْضُ مَا لَمْ تَعْلَمِي"
meaning: "اعلمي أنه شغلني عن زيارتك ما تعرفين من أمري، وبعض ما لا تعرفين. قال الأَعْلَم: «قوله: عداني أي منعني وصرفني من زيارتك ما علمت من أمر الحروب وغير ذلك مما لم تعلميه» [@diwan-antara، ص220]."
vocabulary:
  - term: "عَدَانِي"
    text: "«معناه شغلني» [@ibn-al-anbari، ص365]."
context: "أول بيتي الخاتمة (78–79)، وهما من رواية الأصمعي وحده. قال ابن الأَنْبارِيّ: «وقال أبو محمد الرستمي: روى هذا البيت الذي فسرناه الأصمعي ولم يروه أبو عمرو» [@ibn-al-anbari، ص365]، وبعد البيت التالي: «وقال الرستمي: قرئ هذا البيت والذي قبله على الأصمعي. وقال أبو جعفر: لا أعرفهما ولم أقرأهما على أحد البتة» [@ibn-al-anbari، ص366]. ولذلك ليسا عند الزَّوْزَنِيّ ولا التِّبْرِيزِيّ، وهما عند الأَعْلَم، وروايته عن الأصمعي، برقم 80 و81، قبل أبيات ابنَي ضَمْضَم لا بعدها [@diwan-antara، ص220]. وبهما ترجع القصيدة في آخرها إلى عَبْلَة التي خاطبها في 35 و44."
syntax:
  - "«وما مرتفعة بعداني، وبعض نسق على ما» [@ibn-al-anbari، ص365]: أي «مَا قَدْ عَلِمْتِ» فاعل «عَدَانِي» مؤخر، و«بَعْضُ» معطوف عليه مرفوع."
  - "و«أَنْ أَزُورَكِ» مصدر مؤول منصوب على نزع الخافض، أي عن زيارتك. وجملة «فَاعْلَمِي» معترضة بين الفعل وفاعله، للتنبيه [@ibn-al-anbari، ص365]."
morphology:
  - "عَدَانِي ماضي عدا يعدو، اتصلت به نون الوقاية وياء المتكلم، ومعناه صرفه وجاوز به."
  - "فَاعْلَمِي أمر من عَلِمَ للمؤنثة، وهمزته همزة وصل تسقط في الدرج."
rhetoric:
  thesis: "يختم الفخر بالاعتذار: الفارس الذي ملأ القصيدة بالحروب يعتذر لمحبوبته بها. فالحرب التي صنعت مجده هي التي حرمته من زيارتها."
  devices:
    - title: "الإبهام في «مَا قَدْ عَلِمْتِ وَبَعْضُ مَا لَمْ تَعْلَمِي»"
      text: "لم يسمّ ما شغله، بل قسمه قسمين: ما تعرفه، وبعض ما لا تعرفه. فالإبهام يكبّر الشاغل في نفس السامع، ويجعل الحرب أعظم من أن تُوصف. ويفصّل البيت التالي ما أبهمه هنا."
    - title: "الاعتراض في «فَاعْلَمِي»"
      text: "أدخل الأمر بالعلم بين الفعل وفاعله، فجعل الاعتذار خطابًا مباشرًا يطلب انتباهها [@ibn-al-anbari، ص365]."
  connection: "ثم يسمّي الشاغل: حرب عبس وذبيان."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "إِنْنِي عَدَا / نِي أَنْ أَزُو / رَكِ فَعْلَمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن — مَا قَدْ عَلِمْ / تِ وَبَعْضُ مَا / لَمْ تَعْلَمِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلتين الأوليين من الصدر، والأولى والثالثة من العَجُز."
