first: "وَلَقَدْ شَرِبْتُ مِنَ الْمُدَامَةِ بَعْدَمَا"
second: "رَكَدَ الْهَوَاجِرُ بِالْمَشُوفِ الْمُعْلَمِ"
meaning: "ولقد شربت الخمر بعد أن سكن حرّ الظهيرة، واشتريتها بدينار مجلوّ منقوش. قال ابن الأَنْبارِيّ: «فيقول: شربت من الخمر بعد ركود الهواجر، أي حين ركدت الشمس ووقفت وقام كل شيء على ظله» [@ibn-al-anbari، ص337]. وقال الزَّوْزَنِيّ: «يريد أنه اشترى الخمر فشربها، والعرب تفتخر بشرب الخمر والقمار، لأنها من دلائل الجود عندها» [@zawzani، ص255]."
vocabulary:
  - term: "الْمُدَامَةِ"
    text: "الخمر، «وإنما سميت المدامة لأنها أديمت في الدن، أي أطيل مكثها» [@ibn-al-anbari، ص337]. والدَّنّ: وعاء الخمر الكبير."
  - term: "رَكَدَ"
    text: "سكن. «يقال: ركد، إذا سكن» [@ibn-al-anbari، ص337]."
  - term: "الْهَوَاجِرُ"
    text: "«جمع الهاجرة وهي أشد الأوقات حرًّا» [@zawzani، ص255]، أي نصف النهار."
  - term: "الْمَشُوفِ"
    text: "«معناه بالدينار المشوف. أي المجلو» [@ibn-al-anbari، ص337]."
  - term: "الْمُعْلَمِ"
    text: "«الذي فيه كتاب، يعنى الدنانير» [@ibn-al-anbari، ص338]، أي عليه نقش. وعند الأَعْلَم: «والمعلم الذي عليه علامة» [@diwan-antara، ص206]. وفسّر ابن الأعرابي اللفظين تفسيرًا آخر: «عنى بالمشوف المعلم بعيرا مطليا بالقطران. فأراد إنه شرب خمرا ببعير» [@ibn-al-anbari، ص338]. ويقول التِّبْرِيزِيّ بعد أن ذكر الأقوال: «والمعروف ما قال الأصمعي» [@tabrizi-ashr، ص197]، أي الدينار."
context: "أول ثلاثة أبيات في مجلس شرابه (38–40)، يمهّد بها لما يريد: أن الخمر تُذهب ماله ولا تمسّ عرضه. والشرب في الشعر الجاهلي باب من أبواب الفخر بالكرم، كما يقول الزَّوْزَنِيّ [@zawzani، ص255]. ويفسّر أبو جعفر اختيار وقت الهاجرة: «إنما خص ركود الهواجر لأنه أراد كنت منعما، وهذا الوقت وقت النعمة في شدة الحر» [@ibn-al-anbari، ص337]. أما الأَعْلَم فيرى في البيت وقتًا آخر: «وإنما يريد (شربه) بالعشي» [@diwan-antara، ص206]. والبيت عند الأَعْلَم 43 [@diwan-antara، ص205]، وعند الزَّوْزَنِيّ 37 [@zawzani، ص255]."
syntax:
  - "«واللام في لقد جواب اليمين» [@ibn-al-anbari، ص337]: جواب قسم مقدّر، و«قد» للتحقيق."
  - "«ومن وبعد والباء صلات لشربت، والهواجر ترتفع بركد» [@ibn-al-anbari، ص338]: أي هي متعلقة بالفعل، و«الْهَوَاجِرُ» فاعل «رَكَدَ»، و«ما» في «بَعْدَمَا» مصدرية: بعد ركود الهواجر."
  - "و«مِنَ» في «مِنَ الْمُدَامَةِ» للتبعيض: شرب بعضها. والباء في «بِالْمَشُوفِ» باء الثمن، أي اشتراها به. «والباء في (بالمشوف) تتعلق بشربت، وكذلك مِنْ» [@tabrizi-ashr، ص197]."
morphology:
  - "المُدامة على وزن مُفَاعَلة من أَدَامَ، «ومنه يقال: أدم قدرك، أي اكسر غليانها بتحريك أو بماء» [@ibn-al-anbari، ص337]."
  - "«والمشوف: أصله مشووف، ثم ألقيت حركة الواو على الشين، فبقيت الواو ساكنة وبعدها واو ساكنة، فحذفت الواو لالتقاء الساكنين، والمحذوفة عند سيبويه الثانية؛ لأنها زائدة، وعند الأخفش الأولى» [@tabrizi-ashr، ص197]. وهو من شاف الشيءَ إذا جلاه."
  - "الهَوَاجِر جمع هاجِرة على وزن فَوَاعِل."
rhetoric:
  thesis: "يبدأ الفخر بالشرب من الوقت والثمن: يشرب في ساعة الراحة، ويدفع ذهبًا مجلوًّا. فالشرب هنا علامة يسار وكرم، لا لهو."
  devices:
    - title: "حذف الموصوف في «بِالْمَشُوفِ الْمُعْلَمِ»"
      text: "ذكر الصفتين وحذف الموصوف، وهو الدينار: «قوله: بالمشوف، أي بالدينار، فحذف الموصوف» [@zawzani، ص256]. وفي الحذف يقول عبد القاهر الجُرْجانيّ: «فإنك ترى به ترك الذكر، أفصح من الذكر، والصمت عن الإفادة، أزيد للإفادة» [@dalail، ص146]. فالصفة المحذوف موصوفها تجعل السامع يرى بريق الذهب قبل أن يعرف أنه دينار."
    - title: "الكناية في «رَكَدَ الْهَوَاجِرُ»"
      text: "سكون الهاجرة كناية عن نصف النهار، حين «ركدت الشمس ووقفت وقام كل شيء على ظله» [@ibn-al-anbari، ص337]. والساعة التي يأوي فيها الناس إلى الظل يجعلها هو ساعة شرابه، وهذا ما يسميه أبو جعفر وقت النعمة."
  connection: "ثم يصف آنية الشراب: زجاجة صفراء، وإبريقًا أبيض."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَلَقَدْ شَرِبْ / تُ مِنَلْ مُدَا / مَةِ بَعْدَمَا = متَفاعلن / متَفاعلن / متَفاعلن — رَكَدَلْ هَوَا / جِرُ بِلْمَشُو / فِلْ مُعْلَمِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "جاء الصدر تامًّا على الأصل، ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأخيرة من العَجُز وحدها. فتوالي الحركات في هذا البيت أكثر من سابقه."
