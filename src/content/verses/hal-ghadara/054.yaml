first: "رَبِذٍ يَدَاهُ بِالْقِدَاحِ إِذَا شَتَا"
second: "هَتَّاكِ غَايَاتِ التِّجَارِ مُلَوَّمِ"
meaning: "سريع اليدين في ضرب قداح الميسر إذا اشتد الشتاء، يشتري خمر الخمّارين كلها حتى يُنزلوا راياتهم، ويُلام كثيرًا على إنفاقه. قال الزَّوْزَنِيّ: «هتكت الدرع عن رجل سريع اليد خفيفها في إجالة القداح في الميسر في برد الشتاء»، «وعن رجل يهتك رايات الخمارين، أي كان يشتري جميع ما عندهم من الخمر حتى يقلعوا راياتهم لنفاد خمرهم، ملوم على إمعانه في الجود وإسرافه في البذل» [@zawzani، ص260]."
vocabulary:
  - term: "رَبِذٍ"
    text: "«السريع الضرب بالقداح» [@ibn-al-anbari، ص350]."
  - term: "الْقِدَاحِ"
    text: "«والقداح سهام الميسر» [@diwan-antara، ص211]، والمَيْسِر: قمار كانوا يقتسمون فيه لحم جزور بالسهام، ويطعمونه الفقراء."
  - term: "شَتَا"
    text: "دخل في الشتاء. «قال يعقوب: إنما يضربون بالقداح في شدة الزمان وكلب البرد» [@ibn-al-anbari، ص350]."
  - term: "غَايَاتِ"
    text: "«الغاية: الراية راية الخمارين» [@ibn-al-anbari، ص350]."
  - term: "التِّجَارِ"
    text: "الخمّارون، «وأراد بالتجار تجار الخمر» [@diwan-antara، ص211]."
  - term: "مُلَوَّمِ"
    text: "«معناه معذّل يلام على إنفاق ماله في الفتوة» [@ibn-al-anbari، ص350]."
context: "يمضي في صفة حامي الحقيقة (53–58): بعد الدرع، الكرم. ويقول ابن الأَنْبارِيّ في الميسر: «وهذا كان مدحا عند العرب في الجاهلية» [@ibn-al-anbari، ص350]، لأن الميسر في الشتاء طعام للفقراء. ويفسّر أبو جعفر الرايات: «كان أصحاب الخمر إذا نزلوا رفعوا راية ليُعرفوا بها. والراية هي الغاية، فلا يقلعونها حتى تشتري خمرهم جمعاء» [@ibn-al-anbari، ص350]. والبيت عند الأَعْلَم 59 [@diwan-antara، ص211]، وعند الزَّوْزَنِيّ 52 [@zawzani، ص259]."
syntax:
  - "«وربذ وهتاك وملوم نعوت لحامي الحقيقة، واليدان مرتفعان بمعنى ربذ» [@ibn-al-anbari، ص350]: أي «يَدَاهُ» فاعل للصفة المشبهة «رَبِذٍ»."
  - "ويسأل التِّبْرِيزِيّ لِمَ لم يقل «رَبِذة» واليد مؤنثة: «لأنه أضمر في ربذ، ثم جعل قوله (يداه) بدلا من المضمر، كما تقول: ضربت زيدا يده، ومذهب الفراء في هذا إنه يجوز أن يذكَّر المؤنث في الشعر إذا لم تكن فيه علامة التأنيث» [@tabrizi-ashr، ص204]."
  - "و«إِذَا شَتَا» ظرف متعلق بـ«رَبِذٍ»، وجوابه محذوف دلّ عليه ما قبله [@ibn-al-anbari، ص350]."
morphology:
  - "هَتَّاك صيغة مبالغة على وزن فَعَّال من هَتَكَ، أي كثير الهتك."
  - "مُلَوَّم اسم مفعول من لَوَّمَ على وزن فَعَّل، والتضعيف للتكثير: لِيم مرة بعد مرة. «يقال: ألام الرجل، إذا أتى بما يلام عليه» [@ibn-al-anbari، ص350]."
  - "رَبِذ صفة مشبهة على وزن فَعِل، «والربذ المصدر» [@ibn-al-anbari، ص350]."
rhetoric:
  thesis: "يمدح القتيل بكرم الجاهلية كله: الميسر في الشتاء، وشراء الخمر حتى تنفد، واللوم على الإنفاق. فكلما عظم كرم الخصم، عظم من قتله."
  devices:
    - title: "الكناية في «هَتَّاكِ غَايَاتِ التِّجَارِ»"
      text: "هتك الرايات كناية عن شراء كل ما عند الخمّار، «فيقلعون راياتهم ويذهبون، فذلك هتكه» [@ibn-al-anbari، ص350]. وعند الأَعْلَم وجه آخر: «وقيل: المعنى أنه يعطيهم غاياتهم في السوم بها» [@diwan-antara، ص212]، أي يدفع أعلى ما يطلبون من ثمن."
    - title: "المدح بما يشبه الذم في «مُلَوَّمِ»"
      text: "اللوم في ظاهره ذم، لكنه هنا لوم على الإنفاق، فهو مدح بالجود. والأَعْلَم يفسره: «الذي يكثر لومه على فساد ماله» [@diwan-antara، ص212]."
  connection: "ثم يأتي مشهد اللقاء: نزل إليه، فكشّر عن أنيابه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "رَبِذِنْ يَدَا / هُو بِلْقِدَا / حِ إِذَا شَتَا = متَفاعلن / مُتْفاعلن / متَفاعلن — هَتْتَاكِ غَا / يَاتِتْ تِجَا / رِ مُلَوْوَمِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الثانية من الصدر، والأوليين من العَجُز. وتُشبع ضمة الهاء في يداه بعد الألف فتُنطق يداهو، ولا يستقيم الوزن إلا بذلك."
