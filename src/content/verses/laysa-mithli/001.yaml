second: ـبَائِهِمْ قُتِّلُوا وَيَنْسَى الْقِتَالَا
vocabulary:
- term: يَنْسَى الْقِتَالَا
  text: 'يتركه ويتخلّف عنه. وأورد المبرّد البيت في معنى: «لا تتخلّف عن القتال وتسأل عن أخبار القوم، ولكن كن فيهم» [@kamil، ج2 ص99].'
