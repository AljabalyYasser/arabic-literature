explained: false
first: لَمْ أَرِمْ عَرْصَةَ الْكَتِيبَةِ حَتَّى انْـ
second: ـتَعَلَ الْوَرْدُ مِنْ دِمَاءٍ نِعَالَا
vocabulary:
- term: لَمْ أَرِمْ
  text: لم أبرح، من «رام يَريم إذا برح» [@lisan، ج12 ص259].
- term: عَرْصَةَ الْكَتِيبَةِ
  text: ساحة الجيش في القتال.
- term: الْوَرْدُ
  text: فرسه، ويقال للفرس «وَرْد» إذا كان لونه «بين الكُمَيت والأشقر» [@lisan، ج3 ص456].
- term: نِعَالَا
  text: صار له الدم كالنعال، أي خاض فيه حتى غطّى حوافره.
