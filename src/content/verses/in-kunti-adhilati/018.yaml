first: "مَا شَفَّ جِسْمِي غَيْرُ حُبْـ"
second: "ـبِكِ فَاهْدَئِي عَنِّي وَسِيرِي"
meaning: "فأجبتها: ما أنحل جسمي إلا حبك، فاسكني عن سؤالي ودعيني. يقول محقق «الحماسة»: «فَكَانَ من جوابي لَهَا أَنه مَا غير حالتي وأضعف جسمي إِلَّا مَا داخلني من حبك وغرامك»، و«فاهدئي عني أَي الزمي السّكُون» [@tabrizi-hamasa، ج1 ص205]. فما ظنّته حرارة أو مرضًا هو عنده أثر حبها: الحب أنحله، والقرب منها أشعل جسده."
vocabulary:
  - term: "شَفَّ"
    text: "أنحل وأضعف؛ «وشَفَّ جِسمُه يَشِفُّ شُفُوفاً أَي نَحَلَ» [@lisan، ج9 ص180]. ويفسّره أحمد شاكر محقق «الشعر والشعراء»: «شفه: هزله وأضمره حتى رق» [@ibn-qutayba، ج1 ص392، الحاشية]."
  - term: "فَاهْدَئِي عَنِّي"
    text: "اسكني وكُفّي عن سؤالي؛ «الهَدْأَةُ والهُدُوءُ: السُّكُونُ» [@lisan، ج1 ص180]."
  - term: "وَسِيرِي"
    text: "وامضي في شأنك، ولا تشغلي نفسك بي."
syntax:
  - "«مَا» نافية، و«شَفَّ» فعل ماض، و«جِسْمِي» مفعول به مقدم منصوب بفتحة مقدرة، و«غَيْرُ» فاعل مؤخر مرفوع، وهو مضاف، و«حُبِّكِ» مضاف إليه. وهو استثناء مفرّغ بـ«غير» بعد النفي: ما شفّ جسمي شيء غير حبك."
  - "«فَاهْدَئِي» الفاء عاطفة تفيد التفريع على ما قبلها، و«اهدئي» فعل أمر مبني على حذف النون، والياء فاعل، و«عَنِّي» متعلق به. و«وَسِيرِي» معطوف عليه."
morphology:
  - "«شَفَّ يَشِفُّ» مضعّف، ومصدره «شُفُوف» [@lisan، ج9 ص180]."
  - "«اهْدَئِي» أمر من «هَدَأَ يَهْدَأُ» المهموز اللام، بهمزة وصل في أوله تسقط في درج الكلام: «فَاهْدَئِي»."
  - "«حُبّ» مصدر، و«جِسْم» على «فِعْل»."
rhetoric:
  thesis: "جواب العاشق: الحب مرضه الوحيد. وبهذا الجواب يتحول المشهد من خلوة جسد إلى اعتراف حب، ويمهّد للبيت التالي: «وأحبها وتحبني»."
  devices:
    - title: "القصر"
      text: "«مَا شَفَّ جِسْمِي غَيْرُ حُبِّكِ»: نفي ثم استثناء بـ«غير»، فقصر سبب نحوله على حبها، لا سبب له غيره. ويقول عبد القاهر الجُرْجانيّ في النفي والاستثناء: «فإن الاختصاص يقع حينئذ في الذي يلي» أداة الاستثناء [@dalail، ص344]. والذي يلي «غير» هنا «حُبِّكِ»، فهو المخصوص بالفعل."
    - title: "تقديم المفعول"
      text: "قدّم «جِسْمِي» على الفاعل «غَيْرُ حُبِّكِ»، فأخّر الفاعل إلى آخر الكلام ليقع عليه الاختصاص، ويختم الشطر بكلمة «حُبِّكِ»."
    - title: "الأمر بعد الاعتراف"
      text: "«فَاهْدَئِي عَنِّي وَسِيرِي»: بعد أن قال لها إن حبها هو علته، يأمرها بأن تسكن وتمضي، كأنه يقول: لا تسألي عن شيء أنتِ سببه. وفي الأمر دلال لا طرد. وهذه قراءتنا."
  connection: "ثم يختم المقطع: «وأحبها وتحبني ويحب ناقتها بعيري»."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "مَا شَفْفَ جِسْ / مِي غَيْرُ حُبْ = مُتْفاعلن / مُتْفاعلن — بِكِ فَاهْدَئِي / عَنْنِي وَسِيرِي = متَفاعلن / مُتْفاعلاتن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، تفعيلتي الصدر والضربَ المرفّل [@atiq، ص61]. وتنقسم «حُبِّكِ» بين الشطرين: «حُبْـ» آخر الصدر، و«ـبِكِ» أول العَجُز."
context: "البيت السادس من مقطع الخدر، وهو جواب البيت السابق. ويرويه ابن قُتَيْبة وأبو تَمّام كالأصمعيات [@ibn-qutayba، ج1 ص392] [@tabrizi-hamasa، ج1 ص205]."
variants:
  - reading: "مَا مَسَّ جِسْمِي غَيْرُ حُبْـ / ـبِكِ فَاهْدَئِي عَنِّي وَسِيرِي"
    status: "رواية أبي عَمْرو الشَّيْبانيّ في «الأغاني»"
    note: "[@aghani-dk، ج21 ص4]. وفي القصيدة التي يرويها أبو الفَرَج بعد ذلك «مَا شَفَّ» كالأصمعيات [@aghani-dk، ج21 ص7]."
