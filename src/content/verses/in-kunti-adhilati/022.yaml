first: "وَإِذَا صَحَوْتُ فَإِنَّنِي"
second: "رَبُّ الشُّوَيْهَةِ وَالْبَعِيرِ"
meaning: "وإذا ذهب عني السكر عدت إلى حقيقتي: صاحب شاة صغيرة وبعير، أي رجل قليل المال. يقول محقق «الحماسة»: «وَإِذا ذهب عني السكر فَأَنا عَائِد إِلَى حالتي قبل السكر لَا أملك إِلَّا الشَّاة وَالْبَعِير» [@tabrizi-hamasa، ج1 ص205–206]. فالبيت يكمل البيت السابق ويهدمه في آن: ملك الخورنق كان نشوة، والشويهة هي الحقيقة."
vocabulary:
  - term: "صَحَوْتُ"
    text: "ذهب عني السكر؛ قال ابن الأَنْبارِيّ في «صحوت» من معلقة عنترة: «ذهب سكرى. يقال: صحا السكران من سكره» [@ibn-al-anbari، ص339]."
  - term: "الشُّوَيْهَةِ"
    text: "الشاة الصغيرة، تصغير «شاة»؛ قال صاحب اللسان: «وأَصل الشَّاةِ شاهَةٌ لأَن تَصْغِيرَهَا شُوَيْهة» [@lisan، ج13 ص510]."
  - term: "الْبَعِيرِ"
    text: "الجمل [@lisan، ج4 ص71]."
syntax:
  - "«وَإِذَا صَحَوْتُ»: الواو عاطفة على البيت السابق، و«إذا» ظرف متضمن معنى الشرط، وجملة «صحوت» في محل جر بإضافته إليها."
  - "«فَإِنَّنِي رَبُّ الشُّوَيْهَةِ»: الفاء رابطة للجواب، و«إنّ» واسمها، و«رَبُّ» خبرها، و«الشُّوَيْهَةِ» مضاف إليه، و«الْبَعِيرِ» معطوف عليه."
  - "البيت مبني على تركيب البيت السابق كلمة بكلمة: «إذا» وفعل، ثم «فإنني رب»، ثم مضاف إليه ومعطوف."
morphology:
  - "«صَحَوْتُ» من «صَحَا يَصْحُو» الناقص الواوي، والواو فيه ظاهرة لأنها ساكنة بعد فتح."
  - "«الشُّوَيْهَة» تصغير «شاة» على «فُعَيْلة»، وفيها رجعت الهاء الأصلية التي سقطت من «شاة»؛ وبهذا التصغير استدل أهل اللغة على أن أصل الشاة «شاهة» [@lisan، ج13 ص510]."
  - "«البَعِير» على «فَعِيل»، ويقع على الذكر، وقد يقع على الأنثى [@lisan، ج4 ص71]."
rhetoric:
  thesis: "البيت الذي يقلب سابقه: نشوة الملك تتبدد، ويبقى رجل بشويهة وبعير. وسخرية الشاعر من نفسه هي ما يجعل البيتين معًا أظرف صورة للسكر في الشعر الجاهلي."
  devices:
    - title: "المقابلة"
      text: "قابل بين البيتين: «انْتَشَيْتُ» و«صَحَوْتُ»، و«الْخَوَرْنَقِ وَالسَّدِيرِ» و«الشُّوَيْهَةِ وَالْبَعِيرِ». والمقابلة عند ابن رَشِيق «مواجهة اللفظ بما يستحقه في الحكم»، و«أصلها ترتيب الكلام على ما يجب؛ فيعطي أول الكلام ما يليق به أولاً، وآخره ما يليق به آخراً، ويأتي في الموافق بما يوافقه، وفي المخالف بما يخالفه» [@ibn-rashiq، ج2 ص15]. وقد وفّى المُنَخَّل بهذا: قصر ونهر في مقابل شاة وبعير، اثنان باثنين، في البناء نفسه."
    - title: "التصغير"
      text: "«الشُّوَيْهَةِ» لا «الشاة»: التصغير يزيد القلة قلة، فلا يملك شاة بل شويهة. وبه تتم السخرية: كلما عظّم نفسه في السكر صغّرها في الصحو. وهذه قراءتنا."
    - title: "بين المُنَخَّل وعنترة"
      text: "لعنترة في معلقته بيتان على المثال نفسه: «فَإِذَا شَرِبْتُ فَإِنَّنِي مُسْتَهْلِكٌ مَالِي» و«وَإِذَا صَحَوْتُ فَمَا أُقَصِّرُ عَنْ نَدًى»، وفيهما يقول ابن الأَنْبارِيّ: «أحب أن يعلمها إنه سخي كريم في الحالين جميعا» [@ibn-al-anbari، ص339]. فعنترة يجعل السكر والصحو سواء في الكرم، والمُنَخَّل يجعلهما ضدين في الحال. الأول فخر، والثاني ضحك من النفس. وهذه قراءتنا."
  connection: "ثم يعود إلى الخمر: «ولقد شربت من المدامة بالقليل وبالكثير»، ويختم بنداء هند."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "وَإِذَا صَحَوْ / تُ فَإِنْنَنِي = متَفاعلن / متَفاعلن — رَبْبُشْ شُوَيْ / هَةِ وَلْبَعِيرِي = مُتْفاعلن / متَفاعلاتن"
  note: "وزنه وزن البيت السابق تفعيلةً بتفعيلة: الصدر تامّ، ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، أول العَجُز. والضرب مرفّل «متَفاعلاتن» [@atiq، ص61]."
context: "ثاني بيتي السكر والصحو، ولا يختلف لفظه في المصادر: في الأصمعيات [@asmaiyyat، ص61]، والحماسة [@tabrizi-hamasa، ج1 ص205]، والشعر والشعراء [@ibn-qutayba، ج1 ص393]، والبيان والتبيين [@bayan، ج3 ص226]، ومعجم الشعراء [@marzubani، ص387]، والأغاني [@aghani-dk، ج21 ص4، ص7]. ويلخّص محققا «الأصمعيات» هذا الموضع من القصيدة بأنه يصف فيه حاليه في الصحو والسكر [@asmaiyyat، ص58]."
