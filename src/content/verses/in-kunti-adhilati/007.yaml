explained: false
first: "وَاسْتَلْأَمُوا وَتَلَبَّبُوا"
second: "إِنَّ التَّلَبُّبَ لِلْمُغِيرِ"
vocabulary:
  - term: "اسْتَلْأَمُوا"
    text: "لبسوا الدروع: «اسْتَلْأَمَ الرجلُ لبِس اللأْمة»، و«اللَّأْم جَمْعُ لَأْمَة وَهِيَ الدِّرْعُ» [@lisan، ج12 ص532]."
  - term: "تَلَبَّبُوا"
    text: "تحزّموا وتهيؤوا للقتال: «قيل للذي لبس السلاح وتشمر للقتال: متلبب؛ ومنه قول المتنخل»، وأنشد صاحب اللسان هذا البيت [@lisan، ج1 ص734]."
  - term: "الْمُغِيرِ"
    text: "الذي يغير على العدو."
