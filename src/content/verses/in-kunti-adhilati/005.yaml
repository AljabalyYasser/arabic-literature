explained: false
first: "وَفَوَارِسٍ كَأُوَارِ حَرْ"
second: "رِ النَّارِ أَحْلَاسِ الذُّكُورِ"
vocabulary:
  - term: "كَأُوَارِ"
    text: "كلهيب؛ والأُوار شدة الحر، ومنه «أُوار الشَّمْسِ، وَهُوَ شِدَّةُ حَرِّهَا» [@lisan، ج4 ص35]."
  - term: "أَحْلَاسِ الذُّكُورِ"
    text: "ملازمين لظهور فحول الخيل؛ يقال: «فُلَانٌ مِنْ أَحْلاسِ الخيلِ أَي هُوَ فِي الفُروسية وَلُزُومِ ظَهْرِ الْخَيْلِ كالحِلْسِ اللَّازِمِ لِظَهْرِ الْفَرَسِ» [@lisan، ج6 ص55]. والحِلْس: كساء يوضع على ظهر الدابة."
