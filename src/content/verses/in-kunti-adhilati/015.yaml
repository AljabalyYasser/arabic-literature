first: "فَدَفَعْتُهَا فَتَدَافَعَتْ"
second: "مَشْيَ الْقَطَاةِ إِلَى الْغَدِيرِ"
meaning: "دفعتها فانساقت أمامي تمشي مشي القطاة إلى الماء: خفيفة سريعة. يقول محقق «الحماسة»: «دافعتها فتدافعت أَي مشت مشي القطاة فِي خفتها وسرعتها إِذا قصدت الغدير» [@tabrizi-hamasa، ج1 ص204]. ولا يقول البيت إلى أين دفعها، والأقرب في سياق الخلوة أنه دفعها إلى فراشها في الخدر، فانقادت له ولم تمتنع، ومضت حيث دفعها خفيفة مسرعة؛ أي أنها رضيت بما أراد منها. وهذه قراءتنا."
vocabulary:
  - term: "فَتَدَافَعَتْ"
    text: "انساقت مندفعة في مشيها."
  - term: "الْقَطَاةِ"
    text: "واحدة القطا، وهو ضرب من الطير."
  - term: "الْغَدِيرِ"
    text: "«الْقِطْعَةُ مِنَ الْمَاءِ يُغادِرُها السَّيْلُ أَي يَتْرُكُهَا» [@lisan، ج5 ص9]."
syntax:
  - "«فَدَفَعْتُهَا»: الفاء عاطفة على ما قبله، و«دفعتُ» فعل وفاعل، والهاء مفعول به. و«فَتَدَافَعَتْ» معطوف بالفاء التي تفيد الترتيب والتعقيب: لم تتمهل بعد الدفع."
  - "«مَشْيَ الْقَطَاةِ» مفعول مطلق مبيّن للنوع، وعامله «تدافعت»، وهو من غير لفظه: كأنه قال: تدافعت تدافعًا مثل مشي القطاة. و«الْقَطَاةِ» مضاف إليه."
  - "«إِلَى الْغَدِيرِ» متعلق بالمصدر «مَشْيَ»."
morphology:
  - "«دَفَعْتُ» على «فَعَلَ»، و«تَدَافَعَتْ» على «تَفَاعَلَ» من المادة نفسها، وهو هنا لمطاوعة الدفع: دفعها فاندفعت. وعلى رواية «دَافَعْتُهَا» يكون «تفاعل» مطاوع «فاعَلَ» على القياس: دافعته فتدافع."
  - "«مَشْي» مصدر «مَشَى يَمْشِي»."
  - "«الْغَدِير» على «فَعِيل» بمعنى «مُفَاعَل»: ماء غادره السيل، أي تركه [@lisan، ج5 ص9]."
rhetoric:
  thesis: "لا يصف جسدها هنا بل حركتها، والحركة عنده أدلّ على الحال من الصورة الساكنة: فتاة تنساق لدفعه بخفة طائر يقصد الماء وهو عطشان. وهذا البيت هو الذي وقف عنده ابن رَشِيق من القصيدة."
  devices:
    - title: "التشبيه بغير أداة"
      text: "لم يقل «تدافعت كالقطاة»، بل جاء بالمشبه به مصدرًا: «مَشْيَ الْقَطَاةِ». يذكر ابن رَشِيق التشبيه الذي يأتي بغير أداة، كقول امرئ القَيْس «سمو حباب الماء حالا على حال»، ثم يقول: «وأبدع من هذا عندهم وأغرب قول المنخل اليشكري: دافعتها فتدافعت ... مشي القطاة إلى الغدير»، ويعلّل ذلك: «وإنما براعته عندهم لما لم يكن قبله فعل من لفظه» [@ibn-rashiq، ج1 ص294]. يريد أن امرأ القَيْس قال «سموت ... سمو»، فالمصدر من لفظ الفعل، أما المُنَخَّل فقال «تدافعت ... مشي»، فدلّ المصدر وحده على أن تدافعها كان مشيًا، وعلى أنه يشبه مشي القطاة."
    - title: "تشبيه الهيئة"
      text: "«مَشْيَ الْقَطَاةِ إِلَى الْغَدِيرِ» تشبيه لهيئة حركة لا لشكل جسم. ويجعل عبد القاهر الجُرْجانيّ لهذا بابًا في «هيئة الحركة»، ويرى أن ما كان في الحركة من اختلاف كان أبعد في التشبيه وألطف: «وكلما كان التفاوُتُ في الجهاتُ التي تتحرك أبعاضُ الجسم إليها أشدَّ، كان التركيب في هيئة المتحرِّك أكثر» [@asrar، ص182]. وفي «إِلَى الْغَدِيرِ» قيد يزيد الصورة: قطاة تقصد الماء أسرع ما تكون وأشد ما تكون رغبة."
    - title: "تجانس الفعلين"
      text: "«فَدَفَعْتُهَا فَتَدَافَعَتْ»: فعلان من مادة واحدة متعاقبان بالفاء، الأول منه والثاني منها. فالبيت يحكي فعلًا وجوابه في كلمتين، كأن الحركة انتقلت منه إليها بلا فاصل. وهذه قراءتنا."
  connection: "ثم يقبّلها فتتنفس كظبي انقطع نفسه من العدو."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "فَدَفَعْ تُهَا / فَتَدَا فَعَتْ = متَفاعلن / متَفاعلن — مَشْيَلْ قَطَا / ةِ إِلَلْ غَدِيرِي = مُتْفاعلن / متَفاعلاتن"
  note: "الصدر تامّ التفعيلتين، والعروض صحيحة. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من العَجُز. والضرب مرفّل «متَفاعلاتن» [@atiq، ص61]. وعلى رواية «دَافَعْتُهَا» تصير التفعيلة الأولى «مُتْفاعلن» بالإضمار، ويبقى الوزن مستقيمًا."
context: "البيت الثالث من مقطع الخدر. ويرويه أبو الفَرَج «دافعتها» في خبر المتجردة [@aghani-dk، ج21 ص3]، و«فدفعتها» في القصيدة التي منها الغناء [@aghani-dk، ج21 ص7]. وهو عند ابن رَشِيق من أبدع التشبيه بغير أداة [@ibn-rashiq، ج1 ص294]."
