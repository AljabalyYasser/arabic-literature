    text: "أسرعت: «وتَكَمَّش أَي أَسرع» [@lisan، ج6 ص343]."
  - term: "وَإِذَا الرِّيَاحُ تَكَمَّشَتْ"
    text: "يريد ريح الشتاء وأيام القحط، ويرى محقق «الحماسة» أن هبوب الرياح على البيت هنا «كِنَايَة عَن الجدب» [@tabrizi-hamasa، ج1 ص204]."
