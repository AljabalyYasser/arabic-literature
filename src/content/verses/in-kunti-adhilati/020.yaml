first: "يَا رُبَّ يَوْمٍ لِلْمُنَخْـ"
second: "ـخَلِ قَدْ لَهَا فِيهِ قَصِيرِ"
vocabulary:
  - term: "لَهَا"
    text: "لعب وطرب؛ «اللَّهْو: مَا لَهَوْت بِهِ ولَعِبْتَ بِهِ وشغَلَك مِنْ هَوًى وطَربٍ وَنَحْوِهُمَا» [@lisan، ج15 ص258]."
  - term: "قَصِيرِ"
    text: "يريد أن يوم اللهو يمضي سريعًا لطيبه."
