first: "شَدُّوا دَوَابِرَ بَيْضِهِمْ"
second: "فِي كُلِّ مُحْكَمَةِ الْقَتِيرِ"
vocabulary:
  - term: "دَوَابِرَ بَيْضِهِمْ"
    text: "مؤخّر خُوَذهم؛ «ودابِرُ الشَّيْءِ: آخِرُهُ» [@lisan، ج4 ص268]، والبَيْض جمع بَيْضة، وهي خوذة الحديد. ويقول محقق «الحماسة» إنهم «ربطوا أَوَاخِر بيضات الْحَدِيد من جَانب الْخلف بالدروع خوفًا من سُقُوطهَا عِنْد جري الْخَيل» [@tabrizi-hamasa، ج1 ص203]."
  - term: "مُحْكَمَةِ الْقَتِيرِ"
    text: "درع محكمة المسامير؛ «والقَتِيرُ: مَسامِيرُ الدِّرْعِ» [@lisan، ج1 ص216]."
