first: "وَلَقَدْ دَخَلْتُ عَلَى الْفَتَا"
second: "ةِ الْخِدْرَ فِي الْيَوْمِ الْمَطِيرِ"
meaning: "ولقد دخلت على الفتاة في خدرها، أي في الموضع المستور الذي تُصان فيه من البيت، في يوم مطر. واليوم الماطر يحبس الناس في بيوتهم ويصرفهم عن الرعي والصيد، فهو يوم خلوة وأنس. يقول محقق «الحماسة»: «وخص الْيَوْم الماطر لِأَنَّهُ يَوْم المؤانسة وفراغ البال وَلَا يصلح للصَّيْد» [@tabrizi-hamasa، ج1 ص204]."
vocabulary:
  - term: "الْفَتَاةِ"
    text: "الشابة."
  - term: "الْخِدْرَ"
    text: "«الخِدْرُ: سِتْرٌ يُمَدُّ لِلْجَارِيَةِ فِي نَاحِيَةِ الْبَيْتِ ثُمَّ صَارَ كلُّ مَا وَارَاكَ مِنْ بَيْتِ وَنَحْوِهِ خِدْراً» [@lisan، ج4 ص230]."
  - term: "الْمَطِيرِ"
    text: "الماطر: «وَيَوْمٌ مَطِيرٌ: ماطِر» [@lisan، ج5 ص179]."
syntax:
  - "«وَلَقَدْ»: الواو استئنافية، واللام واقعة في جواب قسم محذوف، و«قد» حرف تحقيق. فالجملة خبر مؤكَّد بالقسم المقدَّر وباللام وبـ«قد»."
  - "«دَخَلْتُ» فعل وفاعل، و«الْخِدْرَ» منصوب به، كما يقال: دخلتُ البيتَ. قال ابن الأَنْبارِيّ في نظيره من معلقة امرئ القَيْس «ويوم دخلت الخدر خدر عنيزة»: «والخدر منصوب بدخلت» [@ibn-al-anbari، ص36]. و«عَلَى الْفَتَاةِ» متعلق بـ«دخلت»: دخلت الخدر عليها."
  - "«فِي الْيَوْمِ» متعلق بـ«دخلت»، و«الْمَطِيرِ» نعت لـ«اليوم» مجرور."
morphology:
  - "«الْفَتَاة» مؤنث «الفتى»، وألفها منقلبة عن ياء."
  - "«الْخِدْر» على «فِعْل»، وجمعه «خُدُورٌ وأَخْدارٌ» [@lisan، ج4 ص230]."
  - "«مَطِير» على «فَعِيل» بمعنى «فاعِل»: يوم ماطر."
rhetoric:
  thesis: "بعد الفرسان والغارة يدخل الخدر: الفتوة عنده حرب ولهو معًا. ويبدأ المقطع بخبر مؤكد، كأنه يحكي مغامرة يعرف أن السامع يستكثرها. وهذا أول الجانب الماجن في القصيدة، يحكيه على الرواية لا على الوصف الصريح."
  devices:
    - title: "التوكيد بالقسم المحذوف"
      text: "«وَلَقَدْ دَخَلْتُ»: اللام في جواب قسم لم يُذكر، ومعها «قد». فالشاعر يقسم على خبر مغامرته، ويجعلها حقيقة لا دعوى. وهي الصيغة نفسها التي يفتح بها البيت 23 «وَلَقَدْ شَرِبْتُ»، فالخدر والكأس عنده من باب واحد."
    - title: "اختيار الزمن"
      text: "«فِي الْيَوْمِ الْمَطِيرِ» قيد صغير يرسم المشهد كله: مطر في الخارج يحبس الناس ويحجب الطريق، ودفء في الخدر. وهو ما فهمه محقق «الحماسة» حين جعله «يَوْم المؤانسة وفراغ البال» [@tabrizi-hamasa، ج1 ص204]."
    - title: "بين خدرين"
      text: "«الْخِدْرَ» عند امرئ القَيْس في «ويوم دخلت الخدر خدر عنيزة» هودج على ظهر بعير، قال ابن الأَنْبارِيّ في شرحه: «والهودج، هو الخدر» [@ibn-al-anbari، ص37]. أما خدر المُنَخَّل فستر في ناحية البيت، والزمن يوم مطر في الحي. فالكلمة واحدة والمشهد مختلف: هناك مغامرة في الطريق، وهنا خلوة في البيت. وهذه قراءتنا."
  connection: "ثم يصف الفتاة: كاعب حسناء ترفل في الحرير."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "وَلَقَدْ دَخَلْ / تُ عَلَلْ فَتَا = متَفاعلن / متَفاعلن — تِلْ خِدْرَ فِلْ / يَوْمِلْ مَطِيرِي = مُتْفاعلن / مُتْفاعلاتن"
  note: "الصدر تامّ التفعيلتين «متَفاعلن متَفاعلن»، والعروض صحيحة [@atiq، ص61]. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، تفعيلتي العَجُز، فصار الضرب المرفّل «مُتْفاعلاتن». وتنقسم كلمة «الفتاة» بين الشطرين، فآخر الصدر «الْفَتَا» وأول العَجُز «ةِ»."
context: "أول مقطع الخدر (13–19)، وأشهر ما في القصيدة. يرويه أبو الفَرَج في خبر المتجردة عن أبي عَمْرو الشَّيْبانيّ [@aghani-dk، ج21 ص3]، ويبدأ به ابن قُتَيْبة ما ينشده منها بعد أن يذكر أنه كان يُتّهم بالمتجردة امرأة النُّعْمان [@ibn-qutayba، ج1 ص392]."
