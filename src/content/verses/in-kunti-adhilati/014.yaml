explained: false
first: "الْكَاعِبِ الْحَسْنَاءِ تَرْ"
second: "فُلُ فِي الدِّمَقْسِ وَفِي الْحَرِيرِ"
vocabulary:
  - term: "الْكَاعِبِ"
    text: "الفتاة الناهد: «وكَعَبَتِ الجاريةُ ... كُعُوباً ... وكَعَّبَت: نَهَدَ ثَدْيُها» [@lisan، ج1 ص719]."
  - term: "تَرْفُلُ"
    text: "تتبختر جارّةً ثوبها، كما في البيت 11."
  - term: "الدِّمَقْسِ"
    text: "الحرير: «الدِمَقْسُ والدِمْقاسُ والمِدَقْسُ: الإِبْرَيْسَم وَقِيلَ القَزُّ» [@lisan، ج6 ص88]."
