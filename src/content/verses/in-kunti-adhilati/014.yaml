first: "الْكَاعِبِ الْحَسْنَاءِ تَرْ"
second: "فُلُ فِي الدِّمَقْسِ وَفِي الْحَرِيرِ"
meaning: "الفتاة التي دخل عليها شابة في أول نضجها، قد نهد ثدياها، أي برزا واستدارا، حسناء الوجه، تمشي متبخترة تجرّ ثيابًا من الحرير الأبيض وغيره. يقول محقق «الحماسة»: «الكاعب البادي ثديها للنهود وترفل تختال والدمقس الْحَرِير الْأَبْيَض وَالْمعْنَى دخلت على الفتاة الجامعة للمحاسن وَهِي تختال فِي لِبَاس الْحَرِير الْأَبْيَض وَغير الْأَبْيَض» [@tabrizi-hamasa، ج1 ص204]. فالبيت يصف جسدها وزينتها قبل أن يحكي ما جرى بينهما."
vocabulary:
  - term: "الْكَاعِبِ"
    text: "الفتاة التي برز ثدياها: «وكَعَبَتِ الجاريةُ ... كُعُوباً ... وكَعَّبَت: نَهَدَ ثَدْيُها» [@lisan، ج1 ص719]. ونَهَد الثدي: ارتفع وبرز."
  - term: "تَرْفُلُ"
    text: "تمشي متبخترة تجرّ ثوبها: «ورَفَلَ فِي ثِيَابِهِ يَرْفُلُ إِذا أَطالها وَجَرَّهَا مُتَبَخْتِرًا» [@lisan، ج11 ص292]."
  - term: "الدِّمَقْسِ"
    text: "الحرير: «الدِمَقْسُ والدِمْقاسُ والمِدَقْسُ: الإِبْرَيْسَم وَقِيلَ القَزُّ» [@lisan، ج6 ص88]. ويفسّره محقق «الحماسة» بالحرير الأبيض [@tabrizi-hamasa، ج1 ص204]."
syntax:
  - "«الْكَاعِبِ» بدل من «الْفَتَاةِ» في البيت السابق مجرور مثلها، ويجوز أن يكون نعتًا لها. و«الْحَسْنَاءِ» نعت ثانٍ مجرور."
  - "«تَرْفُلُ» مضارع مرفوع، وفاعله ضمير يعود على الكاعب، والجملة في محل نصب حال منها."
  - "«فِي الدِّمَقْسِ» متعلق بـ«ترفل»، و«وَفِي الْحَرِيرِ» معطوف عليه. وتنقسم «تَرْفُلُ» بين الشطرين."
morphology:
  - "«كَاعِب» اسم فاعل من «كَعَبَتْ»، ولم تلحقه التاء لأنه وصف خاص بالمرأة لا يشاركها فيه الرجل؛ وجمعه «كَواعِبُ» [@lisan، ج1 ص719]."
  - "«حَسْنَاء» على «فَعْلاء»، صفة للمرأة الجميلة."
  - "«تَرْفُلُ» مضارع «رَفَلَ يَرْفُلُ»، ومصدره «رَفْلًا ورَفَلاناً» [@lisan، ج11 ص292]."
rhetoric:
  thesis: "صورة الفتاة في خدرها، الجسد والزينة معًا: «الكاعب» تقول سنّها وجسدها، و«الحسناء» جمالها، و«ترفل في الدمقس» ترفها ونعمة أهلها. وبعد هذه الصورة يبدأ الفعل."
  devices:
    - title: "الوصف بالكلمة الواحدة"
      text: "«الْكَاعِبِ» كلمة واحدة تسمّي جسدها من أوضح ما فيه: الثديين الناهدين. فلم يحتج إلى وصف مفصّل، لأن الكلمة عند السامع العربي صورة كاملة لفتاة في أول شبابها. وهذه قراءتنا."
    - title: "الكناية"
      text: "«تَرْفُلُ فِي الدِّمَقْسِ وَفِي الْحَرِيرِ» كناية عن الترف وعلوّ المنزلة: لا تجرّ الحرير إلا امرأة مخدومة في بيت غني. وهو من جنس ما يمثّل به عبد القاهر الجُرْجانيّ للكناية في المرأة، كقولهم «نؤوم الضحى»: «والمرادُ أنها مُتْرفةٌ مخَدْومة» [@dalail، ص66]."
    - title: "التكرار"
      text: "«فِي الدِّمَقْسِ وَفِي الْحَرِيرِ»: كرّر حرف الجر، والدمقس حرير أيضًا، فكأنه يقول: حرير فوق حرير. فالتكرار يكثّر الثياب ويضاعف الترف."
  connection: "ثم يدفعها فتمشي أمامه مشي القطاة."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "الْكَاعِبِلْ / حَسْنَاءِ تَرْ = مُتْفاعلن / مُتْفاعلن — فُلُ فِدْدِمَقْ / سِ وَفِلْ حَرِيرِي = متَفاعلن / متَفاعلاتن"
  note: "تُنطق همزة الوصل في «الْكَاعِبِ» لأنها في أول البيت. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، تفعيلتي الصدر. والضرب مرفّل «متَفاعلاتن» [@atiq، ص61]."
context: "البيت الثاني من مقطع الخدر، وهو في كل رواياته: الأصمعيات [@asmaiyyat، ص60]، والحماسة [@tabrizi-hamasa، ج1 ص204]، وابن قُتَيْبة [@ibn-qutayba، ج1 ص392]، والأغاني [@aghani-dk، ج21 ص3، ص7]."
variants:
  - reading: "الْكَاعِبِ الْخَنْسَاءِ تَرْ / فُلُ فِي الدِّمَقْسِ وَفِي الْحَرِيرِ"
    status: "رواية «الأغاني»"
    note: "[@aghani-dk، ج21 ص3، ص7]. ويقول محققو «الأغاني»: «الخنس بالتحريك: تأخر الأنف عن الوجه مع ارتفاع قليل في الأرنبة»، أي قِصَر الأنف وارتفاع طرفه [@aghani-dk، ج21 ص3]."
