first: "فَإِذَا انْتَشَيْتُ فَإِنَّنِي"
second: "رَبُّ الْخَوَرْنَقِ وَالسَّدِيرِ"
meaning: "فإذا سكرت فأنا عند نفسي صاحب الخَوَرْنَق والسَّدِير، أي ملك الحِيرة. يقول محقق «الحماسة»: «فَإِذا سكرت وأخذتني النشوة رَأَيْت نَفسِي كالملك النُّعْمَان الَّذِي بنى الخورنق وَملك نهر الْحيرَة وَمَا وَالَاهُ» [@tabrizi-hamasa، ج1 ص205]. والخمر هنا لا تجعله كريمًا فحسب، بل تجعله ملكًا ساعة، ثم يأتي البيت التالي بالصحو."
vocabulary:
  - term: "انْتَشَيْتُ"
    text: "سكرت: «ونشِيَ الرَّجُلُ مِنَ الشَّرَابِ ... وتَنَشَّى وانْتَشَى كُلُّهُ: سَكِرَ، فَهُوَ نَشْوَان» [@lisan، ج15 ص325]."
  - term: "رَبُّ"
    text: "صاحب ومالك."
  - term: "الْخَوَرْنَقِ"
    text: "«اسم قصر بالعراق، فارسي معرب، بناه النعمان الأكبر الذي يقال له الأعور» [@lisan، ج10 ص79]."
  - term: "السَّدِيرِ"
    text: "نهر بالحيرة، وقيل بناء: «التَّهْذِيبِ: السدِيرُ نَهَر بالحِيرة»، وفيه أيضًا: «والسَّديرُ: بِناءٌ» [@lisan، ج4 ص355]."
syntax:
  - "«فَإِذَا»: الفاء عاطفة، و«إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط، وجملة «انْتَشَيْتُ» في محل جر بإضافة «إذا» إليها."
  - "«فَإِنَّنِي»: الفاء رابطة لجواب «إذا» لأن الجواب جملة اسمية، و«إنّ» حرف توكيد، والنون الثانية للوقاية، والياء اسمها. و«رَبُّ» خبرها مرفوع."
  - "«الْخَوَرْنَقِ» مضاف إليه، و«السَّدِيرِ» معطوف عليه مجرور."
morphology:
  - "«انْتَشَى» على «افْتَعَلَ» من «نَشِيَ»، ومنه «النَّشْوَة» و«النَّشْوَان» [@lisan، ج15 ص325]."
  - "«الخَوَرْنَق» اسم معرّب من الفارسية [@lisan، ج10 ص79]، وهو على خمسة أحرف أصول وزوائد على غير أبنية العرب المألوفة."
  - "«السَّدِير» على «فَعِيل»، ويذكر صاحب اللسان أنه معرّب من الفارسية [@lisan، ج4 ص355]."
rhetoric:
  thesis: "أشهر بيت في القصيدة، وأقرب ما في الشعر الجاهلي إلى الضحك من النفس: الشارب يرى نفسه ملكًا، والشاعر يعرف أنه وهم، فيضع البيت ومقابله متجاورين ليضحك السامع معه."
  devices:
    - title: "الكناية"
      text: "«رَبُّ الْخَوَرْنَقِ وَالسَّدِيرِ» كناية عن الملك: لم يقل «فإنني ملك»، بل ذكر قصر ملوك الحِيرة ونهرها، وهما ما يلزم الملك. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود… فيومئ به إليهِ» [@dalail، ص66]. وفي الكناية هنا زيادة: فالملك الذي يتخيّله ليس ملكًا مجردًا، بل هو ملك الحِيرة الذي يقول ابن الأعرابي إن المُنَخَّل «كان من ندمائه لا يفارقه» [@aghani-dk، ج21 ص4]. فهو يتخيّل نفسه في مكان الرجل الذي ينادمه."
    - title: "«إذا» في الشرط"
      text: "قال «فَإِذَا انْتَشَيْتُ» ولم يقل «فإن انتشيت». و«إذا» في الغالب لما يُقطع بوقوعه، و«إنْ» لما يُشكّ فيه. فكأن سكره أمر مفروغ منه يتكرر، لا احتمال. وهذه قراءتنا."
  connection: "ثم يقابله بالصحو: «وإذا صحوت فإنني رب الشويهة والبعير»."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "فَإِذَنْ تَشَيْ / تُ فَإِنْنَنِي = متَفاعلن / متَفاعلن — رَبْبُلْ خَوَرْ / نَقِ وَسْسَدِيرِي = مُتْفاعلن / متَفاعلاتن"
  note: "تسقط همزة الوصل في «انْتَشَيْتُ» في درج الكلام فتصير «فَإِذَنْتَشَيْ». ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من العَجُز. والضرب مرفّل «متَفاعلاتن» [@atiq، ص61]."
context: "أول بيتي السكر والصحو، وهما ما يُحفظ من القصيدة. يوردهما الجاحظ مع أبيات الكأس منها في أشعار الشاربين [@bayan، ج3 ص226]، والمَرْزُبانيّ فيما يختاره من «قصيدته المشهورة» [@marzubani، ص387]. وترتيبهما في الأصمعيات قبل البيت 23 «ولقد شربت من المدامة»، وفي الحماسة وابن قُتَيْبة والأغاني بعده [@tabrizi-hamasa، ج1 ص205] [@ibn-qutayba، ج1 ص393] [@aghani-dk، ج21 ص4]."
variants:
  - reading: "فَإِذَا سَكِرْتُ فَإِنَّنِي"
    status: "رواية «الأغاني» وابن قُتَيْبة والجاحظ"
    note: "[@aghani-dk، ج21 ص4، ص7] [@ibn-qutayba، ج1 ص393] [@bayan، ج3 ص226]. ورواية الأصمعيات «فَإِذَا انْتَشَيْتُ» هي رواية أبي تَمّام والمَرْزُبانيّ [@tabrizi-hamasa، ج1 ص205] [@marzubani، ص387]."
  - reading: "رَبُّ الْخَوَرْنَقِ وَالسَّرِيرِ"
    status: "في خبر المتجردة من «الأغاني»"
    note: "[@aghani-dk، ج21 ص4]، أي سرير الملك. وفي القصيدة التي يرويها أبو الفَرَج بعد ذلك «والسدير» كسائر الروايات [@aghani-dk، ج21 ص7]."
