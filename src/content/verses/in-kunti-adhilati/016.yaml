first: "وَلَثِمْتُهَا فَتَنَفَّسَتْ"
second: "كَتَنَفُّسِ الظَّبْيِ الْبَهِيرِ"
meaning: "وقبّلتها على فمها، فتلاحقت أنفاسها وعلت، كما تتلاحق أنفاس الظبي الذي انقطع نَفَسه من شدة العدو. واللَّثْم هنا التقبيل، وفي اللسان: «فإِذا أَراد التَّقْبِيلَ قُلْتُ: لَثِمْتُ أَلْثَمُ»، ثم أنشد: «فلَثِمْتُ فَاهَا آخِذاً بِقُرونِها» [@lisan، ج12 ص533]. ويقول محقق «الحماسة»: «لما قبلت فاها وخدها تنفست الصعداء لمكاني مِنْهَا واتحاد قلبِي بقلبها» [@tabrizi-hamasa، ج1 ص205]. ونقرأ تنفّسها المتلاحق بعد القبلة علامةً على شهوتها واستجابتها له، لا على الحزن ولا على الإعياء؛ فالتشبيه بالظبي المبهور يصف نَفَسًا سريعًا متقطعًا، لا تنهدًا طويلًا. وهذه قراءتنا."
vocabulary:
  - term: "لَثِمْتُهَا"
    text: "قبّلتها؛ وأصل الكلمة من الفم: اللِّثام ما يُشدّ على الفم، و«إِذا أَراد التَّقْبِيلَ قُلْتُ: لَثِمْتُ أَلْثَمُ» [@lisan، ج12 ص533]."
  - term: "تَنَفَّسَتْ"
    text: "أخرجت نَفَسها بقوة ودفعات متتابعة."
  - term: "الْبَهِيرِ"
    text: "المنقطع النَّفَس من العدو: «والبُهْرُ: انْقِطَاعُ النَّفَسِ مِنَ الإِعياء؛ وَقَدِ انْبَهَرَ وبُهِرَ فَهُوَ بَهِيرٌ» [@lisan، ج4 ص82]."
syntax:
  - "«وَلَثِمْتُهَا» الواو عاطفة على «فدفعتها»، و«لثمت» فعل وفاعل، والهاء مفعول به."
  - "«فَتَنَفَّسَتْ» الفاء للتعقيب: تنفّست عقب القبلة بلا مهلة، والفاعل ضمير يعود على الفتاة."
  - "«كَتَنَفُّسِ» الكاف حرف تشبيه وجر، والجار والمجرور في موضع نصب صفة لمفعول مطلق محذوف: تنفّست تنفّسًا كتنفّس الظبي. و«الظَّبْيِ» مضاف إليه، و«الْبَهِيرِ» نعت له."
morphology:
  - "«لَثِمْتُ» من «لَثِمَ يَلْثَمُ» بكسر العين في الماضي إذا أُريد التقبيل، أما «لَثَمَتْ تَلْثِمُ» بالفتح فمن اللِّثام، وهو ستر الفم والأنف [@lisan، ج12 ص533]."
  - "«تَنَفَّسَ» على «تَفَعَّلَ» من النَّفَس، و«تَنَفُّس» مصدره على «تَفَعُّل»."
  - "«بَهِير» على «فَعِيل» بمعنى «مفعول»: مبهور، من «بُهِرَ» المبني للمجهول [@lisan، ج4 ص82]."
rhetoric:
  thesis: "قمة مشهد الخدر: القبلة وجوابها. لا يصف الشاعر هنا جسدها بل أثر القبلة فيها، فيكفي النَّفَس المتلاحق ليقول ما جرى في جسدها من شهوة."
  devices:
    - title: "التشبيه"
      text: "«كَتَنَفُّسِ الظَّبْيِ الْبَهِيرِ»: شبّه هيئة تنفّسها بهيئة تنفّس ظبي أعياه العدو: أنفاس قصيرة سريعة متتابعة. والظبي في الشعر صورة المرأة الحسناء، فالمشبه به يجمع الجمال والانبهار معًا. وهو تشبيه حركة لا شكل، من الباب الذي يسمّيه عبد القاهر الجُرْجانيّ «هيئة الحركة» [@asrar، ص182]."
    - title: "الفعل ومصدره"
      text: "«فَتَنَفَّسَتْ ... كَتَنَفُّسِ»: جاء المصدر في التشبيه من لفظ الفعل، كقول امرئ القَيْس «سموت إليها ... سمو حباب الماء». وهذا خلاف ما في البيت 15 «فتدافعت ... مشي القطاة»، الذي جعله ابن رَشِيق أبدع لأن المصدر فيه من غير لفظ فعله [@ibn-rashiq، ج1 ص294]."
    - title: "الإيجاز"
      text: "حكى القبلة في كلمة «لَثِمْتُهَا»، وجوابها في كلمة «فَتَنَفَّسَتْ»، ثم صرف بقية البيت إلى التشبيه. فالفعل نفسه موجز، والصورة هي التي تطول. وهذه قراءتنا."
  connection: "ثم تدنو منه وتسأله عن الحرارة التي في جسده."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "وَلَثِمْ تُهَا / فَتَنَفْ فَسَتْ = متَفاعلن / متَفاعلن — كَتَنَفْ فُسِظْ / ظَبْيِلْ بَهِيرِي = متَفاعلن / مُتْفاعلاتن"
  note: "الصدر تامّ التفعيلتين. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، الضربَ المرفّل فصار «مُتْفاعلاتن» [@atiq، ص61]."
context: "البيت الرابع من مقطع الخدر، وفيه أكثر رواياته اختلافًا: فابن قُتَيْبة يرويه بلفظ آخر، وأبو تَمّام يغيّر قافيته، وصاحب اللسان يروي له قافية ثالثة."
variants:
  - reading: "وَعَطَفْتُهَا فَتَعَطَّفَتْ / كَتَعَطُّفِ الظَّبْيِ الْغَرِيرِ"
    status: "رواية ابن قُتَيْبة"
    note: "[@ibn-qutayba، ج1 ص392]، أي أمالها إليه فمالت، كما يميل الظبي الصغير. ويذكر محققا «الأصمعيات» أنها رواية الطبعة الأوربية منها [@asmaiyyat، ص60]."
  - reading: "كَتَنَفُّسِ الظَّبْيِ الْغَرِيرِ"
    status: "رواية «الحماسة»"
    note: "[@tabrizi-hamasa، ج1 ص204]. ويقول محققها: «الغرير ولد الظبي وَهُوَ الصَّغِير» [@tabrizi-hamasa، ج1 ص204]."
  - reading: "فَلَثِمْتُهَا فَتَنَفَّسَتْ / كَتَنَفُّسِ الظَّبْيِ الْعَقِيرْ"
    status: "رواية ينقلها صاحب اللسان"
    note: "«وظَبْيٌ عَقِيرٌ: دَهِشٌ؛ وَرَوَى بَعْضُهُمْ بَيْتَ المُنَخَّل الْيَشْكُرِيِّ» [@lisan، ج4 ص598]."
