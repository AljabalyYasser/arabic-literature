first: "أَلْفَيْتِنِي هَشَّ النَّدَى"
second: "بِشَرِيجِ قِدْحِي أَوْ شَجِيرِي"
vocabulary:
  - term: "أَلْفَيْتِنِي"
    text: "وجدتِني."
  - term: "هَشَّ النَّدَى"
    text: "خفيفًا إلى العطاء، مسرورًا به؛ «والنَّدَى: السَّخاء وَالْكَرَمُ» [@lisan، ج15 ص315]."
  - term: "بِشَرِيجِ قِدْحِي أَوْ شَجِيرِي"
    text: "القِدْح: سهم الميسر، والمَيْسِر قمار العرب بالقداح. «الشَّرِيج قِدْحه الَّذِي هُوَ لَهُ. والشَّجِير: الْغَرِيبُ. يَقُولُ: أَلْفَيْتَني أَضرب بقِدْحَيَّ فِي المَيْسِر: أَحدُهما لِي، وَالْآخَرُ مُسْتَعار» [@lisan، ج2 ص308]."
