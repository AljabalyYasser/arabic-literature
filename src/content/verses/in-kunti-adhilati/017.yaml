first: "فَدَنَتْ وَقَالَتْ يَا مُنَخْـ"
second: "ـخَلُ مَا بِجِسْمِكَ مِنْ حَرُورِ"
meaning: "فاقتربت منه حتى التصق جسدها بجسده، وقالت: يا مُنَخَّل، ما هذه الحرارة التي في جسمك؟ فقد أحسّت جسده حارًّا كالمحموم، وهي حرارة الشهوة والوجد. وهذه قراءتنا. ويقول محقق «الحماسة»: «فدنت أَي قربت والحرور حر الشَّمْس مَعْنَاهُ أَنَّهَا رأتني على غير مَا عهدته مني فَقَالَت تتعجب مَا بجسمك من حرور» [@tabrizi-hamasa، ج1 ص205]."
vocabulary:
  - term: "فَدَنَتْ"
    text: "اقتربت منه."
  - term: "يَا مُنَخَّلُ"
    text: "تناديه باسمه، والمُنَخَّل اسم الشاعر."
  - term: "حَرُورِ"
    text: "حرارة؛ وأصل الحَرُور: «الرِّيحُ الحارَّة بِاللَّيْلِ وَقَدْ تَكُونُ بِالنَّهَارِ» [@lisan، ج4 ص177]، واستعارها لحرارة الجسد."
syntax:
  - "«فَدَنَتْ» الفاء عاطفة للتعقيب، و«دنت» فعل ماض والتاء للتأنيث، والفاعل ضمير الفتاة. و«وَقَالَتْ» معطوف عليه."
  - "«يَا مُنَخَّلُ» «يا» حرف نداء، و«مُنَخَّلُ» منادى مفرد علم مبني على الضم في محل نصب. وتنقسم الكلمة بين الشطرين."
  - "«مَا بِجِسْمِكَ مِنْ حَرُورِ»: «ما» اسم استفهام في محل رفع مبتدأ، و«بِجِسْمِكَ» جار ومجرور متعلق بمحذوف خبر، و«مِنْ حَرُورِ» بيان لـ«ما»، و«مِن» بيانية. والجملة مقول القول في محل نصب."
morphology:
  - "«دَنَتْ» من «دَنَا يَدْنُو» الناقص الواوي، وحُذفت لامه لالتقاء الساكنين حين اتصلت بتاء التأنيث."
  - "«حَرُور» على «فَعُول» من الحرّ."
  - "«مُنَخَّل» على «مُفَعَّل»، صيغة اسم المفعول من الفعل المضعّف «نَخَّلَ»."
rhetoric:
  thesis: "بعد القبلة يأتي الكلام، وأول كلام في المشهد على لسانها: سؤال عن حرارة جسده. فالسؤال يقول ما جرى دون أن يصفه: اقتربت منه حتى أحست حرارة جسده. ثم يأتي جوابه في البيت التالي."
  devices:
    - title: "الحوار"
      text: "ينتقل المشهد من السرد إلى الحوار في «وَقَالَتْ»، فالبيتان 17–18 سؤال وجواب. والحوار في مشهد الخلوة من سنن الغزل الجاهلي، كقول امرئ القَيْس في خدر عنيزة: «فقالت لك الويلات إنك مرجلي» [@ibn-al-anbari، ص36]."
    - title: "الاستفهام للتعجب"
      text: "«مَا بِجِسْمِكَ مِنْ حَرُورِ»: لا تسأل لتعرف، بل تتعجب، كما فهمه محقق «الحماسة» حين قال: «فَقَالَت تتعجب» [@tabrizi-hamasa، ج1 ص205]. والتعجب نفسه إقرار بما أحسّت."
    - title: "اسمه على لسانها"
      text: "«يَا مُنَخَّلُ»: يضع الشاعر اسمه على لسان صاحبته، كما يضعه في البيت 20 «يا رُبّ يوم للمُنَخَّل». فالقصيدة تحكي مغامرة صاحبها باسمه، وهذا من الفخر باللهو. وهذه قراءتنا."
  connection: "فيجيبها: ما أنحل جسمي إلا حبك."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "فَدَنَتْ وَقَا / لَتْ يَا مُنَخْ = متَفاعلن / مُتْفاعلن — خَلُ مَا بِجِسْ / مِكَ مِنْ حَرُورِي = متَفاعلن / متَفاعلاتن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر، وهي العروض. والضرب مرفّل «متَفاعلاتن» [@atiq، ص61]. وتنقسم «مُنَخَّلُ» بين الشطرين: «مُنَخْـ» آخر الصدر، و«ـخَلُ» أول العَجُز."
context: "البيت الخامس من مقطع الخدر. وتختلف رواياته في الفعل الأول وفي القافية: فعلى رواية «فُتُور» تسأله عن ضعف جسده وانكساره لا عن حرارته، وجوابه في البيت التالي «ما شفّ جسمي» أي ما أنحله، أوفق بهذه الرواية. وهذه قراءتنا."
variants:
  - reading: "فَتَرَتْ وَقَالَتْ يَا مُنَخْـ / ـخَلُ مَا بِجِسْمِكَ مِنْ فُتُورِ"
    status: "رواية ابن قُتَيْبة"
    note: "[@ibn-qutayba، ج1 ص392]. فَتَرَتْ: لانت وسكنت، والفُتُور: الضعف والانكسار."
  - reading: "وَرَنَتْ وَقَالَتْ يَا مُنَخْـ / ـخَلُ هَلْ بِجِسْمِكَ مِنْ فُتُورِ"
    status: "رواية أبي عَمْرو الشَّيْبانيّ في «الأغاني»"
    note: "[@aghani-dk، ج21 ص3]. رَنَتْ: أدامت النظر إليه. وفي القصيدة التي يرويها أبو الفَرَج بعد ذلك «فَدَنَتْ ... مِنْ حَرُورِ» كالأصمعيات [@aghani-dk، ج21 ص7]."
