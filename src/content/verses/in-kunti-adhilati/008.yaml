first: "وَعَلَى الْجِيَادِ الْمُضْمَرَا"
second: "تِ فَوَارِسٌ مِثْلُ الصُّقُورِ"
vocabulary:
  - term: "الْجِيَادِ"
    text: "الخيل الكرام، واحدها جواد."
  - term: "الْمُضْمَرَاتِ"
    text: "الخيل التي هُيّئت للسباق والغارة بتقليل علفها بعد السِّمَن حتى تشتد: «وضَمَّرْتُ الخيلَ: عَلفْتها القُوتَ بَعْدَ السِّمَنِ» [@lisan، ج4 ص491]."
