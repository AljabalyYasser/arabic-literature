first: "وَأُحِبُّهَا وَتُحِبُّنِي"
second: "وَيُحِبُّ نَاقَتَهَا بَعِيرِي"
meaning: "أحبها وتحبني، بل إن بعيري يحب ناقتها. يريد أن الحب بينهما تامّ متبادل، حتى سرى منهما إلى راحلتيهما. يقول محقق «الحماسة»: «هَذِه جملَة يُرِيد بهَا توكيد الْمحبَّة وَطول الألفة بَينهمَا» [@tabrizi-hamasa، ج1 ص205]. وفي البيت مزاح خفيف: فالعاشق الذي كان يحكي خلوته جادًّا يختم المقطع بضحكة."
vocabulary:
  - term: "نَاقَتَهَا"
    text: "«النّاقةُ: الأُنثى مِنَ الإِبل» [@lisan، ج10 ص362]."
  - term: "بَعِيرِي"
    text: "جملي: «البَعيرُ: الجَمَل البازِلُ، وَقِيلَ: الجَذَعُ، وَقَدْ يَكُونُ للأُنثى» [@lisan، ج4 ص71]. وهو هنا الذكر، في مقابل الناقة."
syntax:
  - "«وَأُحِبُّهَا»: الواو عاطفة، و«أحبُّ» مضارع مرفوع، وفاعله ضمير مستتر تقديره «أنا»، والهاء مفعول به. و«وَتُحِبُّنِي» معطوفة عليها، والنون للوقاية، والياء مفعول به."
  - "«وَيُحِبُّ نَاقَتَهَا بَعِيرِي»: «ناقتَها» مفعول به مقدَّم، و«بَعِيرِي» فاعل مؤخَّر مرفوع بضمة مقدّرة على ما قبل ياء المتكلم."
  - "الجمل الثلاث متعاطفة بالواو، وهي خبرية لا شرط فيها ولا قيد: تقرير حال قائمة."
morphology:
  - "«أُحِبُّ» و«تُحِبُّ» و«يُحِبُّ» مضارع «أَحَبَّ» الرباعي المضعّف، وحرف المضارعة فيه مضموم لأن ماضيه رباعي."
  - "«بَعِير» على «فَعِيل»، وجمعه «أَبْعِرَةٌ فِي الْجَمْعِ الأَقل، وأَباعِرُ وأَباعيرُ وبُعْرانٌ» [@lisan، ج4 ص71]."
  - "«نَاقَة» جمعها «نُوق» و«أَيْنُق»."
rhetoric:
  thesis: "بيت قائم على التكرار والتدرّج: حب منه، ثم حب منها، ثم حب يتعدّاهما إلى ما يركبان. وهو أشهر بيت في القصيدة، وأكثرها خلافًا في روايته."
  devices:
    - title: "التكرار"
      text: "«أُحِبُّهَا ... تُحِبُّنِي ... يُحِبُّ»: ثلاثة أفعال من مادة واحدة في بيت قصير، فلا تكاد تسمع فيه غير الحب. والتكرار هنا يحاكي المعنى: حب يتسع دائرة بعد دائرة."
    - title: "المبالغة"
      text: "في «وَيُحِبُّ نَاقَتَهَا بَعِيرِي» جعل الحب يتجاوز العاشقين إلى راحلتيهما، فكأن الألفة بينهما فاضت على كل ما يخصّهما. وهي مبالغة ظريفة يقصد بها الضحك أكثر من الإقناع. وهذه قراءتنا."
    - title: "تقديم المفعول"
      text: "قال «يُحِبُّ نَاقَتَهَا بَعِيرِي» ولم يقل «يحب بعيري ناقتها»، فقدّم ناقتها كما قدّمها هي في أول البيت «أُحِبُّهَا». وفي التقديم ينقل عبد القاهر الجُرْجانيّ عن سِيبَوَيْه: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]. فهي المقدَّمة في الشطرين، وبتأخير «بَعِيرِي» وقعت الكلمة في القافية."
  connection: "ثم يخرج من الخدر إلى أيام لهوه: «يا رُبّ يوم للمُنَخَّل قد لها فيه»."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "وَأُحِبْ بُهَا / وَتُحِبْ بُنِي = متَفاعلن / متَفاعلن — وَيُحِبْ بُنَا / قَتَهَا بَعِيرِي = متَفاعلن / متَفاعلاتن"
  note: "جاء البيت بلا إضمار، فتفعيلاته كلها «متَفاعلن» على الأصل [@atiq، ص59]، والضرب مرفّل «متَفاعلاتن» [@atiq، ص61]. وتوالي المقاطع القصيرة فيه يعطيه خفة تلائم مزاحه."
context: "آخر مقطع الخدر. يقول أبو الفَرَج بعد أن يورد القصيدة: «ومن الناس من يزيد في هذه القصيدة»، ثم ينشد البيت ويقول: «ولم أجده في رواية صحيحة» [@aghani-dk، ج21 ص7]. لكنه في الأصمعيات من رواية الأَصْمَعِيّ عن أبي عَمْرو بن العلاء [@asmaiyyat، ص60]، وفي «الحماسة» [@tabrizi-hamasa، ج1 ص205]، وعند ابن قُتَيْبة [@ibn-qutayba، ج1 ص393]، ويرويه أبو الفَرَج نفسه في خبر المتجردة عن أبي عَمْرو الشَّيْبانيّ [@aghani-dk، ج21 ص4]. ويقول أحمد شاكر محقق «الشعر والشعراء»: «ومن عجب أنه ذكره فيها فى موضعين آخرين، ولم يعقب على إثباته!» [@ibn-qutayba، ج1 ص393، الحاشية]. فنثبته في القصيدة، وننسب قول أبي الفَرَج إليه."
