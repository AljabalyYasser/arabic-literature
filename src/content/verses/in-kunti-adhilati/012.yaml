explained: false
first: "يَعْكُفْنَ مِثْلَ أَسَاوِدِ الـ"
second: "ـتَّنُّومِ لَمْ تُعْكَفْ لِزُورِ"
vocabulary:
  - term: "يَعْكُفْنَ"
    text: "يضفرن شعورهن. يقول محقق «الحماسة»: «عكفت الْمَرْأَة شعرهَا إِذا ألزمت بعضه بَعْضًا وَجَعَلته ضفائر» [@tabrizi-hamasa، ج1 ص206]، ويذكر محققا «الأصمعيات» أن هذا الفعل لم يرد في المعاجم بهذا المعنى [@asmaiyyat، ص60]."
  - term: "أَسَاوِدِ التَّنُّومِ"
    text: "حيّات سود ملتفة على شجر التَّنُّوم، شبّه بها الضفائر؛ «والأَسْوَدُ: العظيمُ مِنَ الحيَّات وَفِيهِ سوادٌ، وَالْجَمْعُ أَسْوَدات وأَساوِدُ» [@lisan، ج3 ص226]، و«التَّنُّوم شَجَرٌ لَهُ حَمْل صِغار» [@lisan، ج12 ص71]."
  - term: "لَمْ تُعْكَفْ لِزُورِ"
    text: "لم تُضفر لباطل؛ «والزُّور: الْكَذِبُ وَالْبَاطِلُ» [@lisan، ج4 ص336]. ويفسّره محققا «الأصمعيات» بأنهن عفيفات لا يتزيّنّ لريبة [@asmaiyyat، ص60]."
