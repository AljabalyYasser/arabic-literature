explained: false
first: "يَخْرُجْنَ مِنْ خَلَلِ الْغُبَا"
second: "رِ يَجِفْنَ بِالنَّعَمِ الْكَثِيرِ"
vocabulary:
  - term: "خَلَلِ الْغُبَارِ"
    text: "فُرَجه وما بين أطرافه."
  - term: "يَجِفْنَ"
    text: "يسرعن: «وَجَفَ البعيرُ وَالْفَرَسُ يَجِف وَجْفاً ووَجِيفاً: أَسْرعَ» [@lisan، ج9 ص352]."
  - term: "النَّعَمِ"
    text: "الإبل التي غنموها؛ قال ابن سِيدَه: «النَّعَم الإبل وَالشَّاءُ» [@lisan، ج12 ص585]."
