first: "إِنْ كُنْتِ عَاذِلَتِي فَسِيرِي"
second: "نَحْوَ الْعِرَاقِ وَلَا تَحُورِي"
meaning: "إن كنتِ تلومينني فامضي نحو العراق ولا ترجعي إليّ. ويقول محقق «الحماسة» في معناه: «إن كنت تعذليني فاذهبي عني فلست لي بصاحبة» [@tabrizi-hamasa، ج1 ص202]. وينقل محققا «الأصمعيات» عن أبي العلاء تفسيرًا آخر: إن كنتِ تلومينني لقلة مالي وتحبين أن أستغني، فسيري نحو العراق فإني أستغني فيه، لأن النُّعْمان بن المُنْذِر كان يكرمه ويقرّبه، وداره بالحِيرة، والحيرة من العراق [@asmaiyyat، ص58–59]. فعلى الأول هو طرد للعاذلة، وعلى الثاني جواب لها: الغنى عند الملك إن كان المال ما تريدين."
vocabulary:
  - term: "عَاذِلَتِي"
    text: "لائمتي، من العَذْل: «العَذْلُ: اللَّومُ» [@lisan، ج11 ص437]."
  - term: "تَحُورِي"
    text: "ترجعي: «الحَوْرُ: الرُّجُوعُ عَنِ الشَّيْءِ وإِلى الشَّيْءِ» [@lisan، ج4 ص217]."
  - term: "الْعِرَاقِ"
    text: "يريد بلاد الحِيرة، دار النُّعْمان بن المُنْذِر، على تفسير أبي العلاء الذي ينقله محققا «الأصمعيات» [@asmaiyyat، ص59]."
syntax:
  - "«إِنْ» حرف شرط جازم، و«كُنْتِ» فعل الشرط في محل جزم، والتاء اسم «كان»، و«عَاذِلَتِي» خبرها منصوب بفتحة مقدرة على ما قبل ياء المتكلم."
  - "«فَسِيرِي» الفاء رابطة لجواب الشرط، لأن الجواب طلب لا يصلح أن يكون شرطًا. و«سِيرِي» فعل أمر مبني على حذف النون، والياء فاعل."
  - "«نَحْوَ» ظرف مكان منصوب متعلق بـ«سيري»، و«الْعِرَاقِ» مضاف إليه. و«وَلَا تَحُورِي» «لا» ناهية، والفعل مجزوم بحذف النون، والجملة معطوفة على «سيري»."
morphology:
  - "«عَاذِلَة» اسم فاعل مؤنث من «عَذَلَ يَعْذِلُ»، وجمعها «عَوَاذِل»."
  - "«تَحُورِي» مضارع «حَارَ يَحُورُ» الأجوف الواوي، ومن مصادره «حَوْراً ومَحاراً ومَحارَةً وحُؤُوراً» [@lisan، ج4 ص217]."
  - "«سِيرِي» أمر من «سَارَ يَسِيرُ» الأجوف اليائي: يقال للرجل «سِرْ» بحذف الياء لالتقاء الساكنين، فإذا خوطبت به المرأة عادت الياء لتحرك الراء: «سِيرِي»."
rhetoric:
  thesis: "يبدأ بالعاذلة، وهي من أعراف القصيدة الجاهلية: امرأة تلوم الشاعر على إنفاقه أو لهوه، فيجيبها بما هو عليه. لكنه لا يجادلها كما يجادل طَرَفَة لائمه، بل يصرفها من أول بيت. فالقصيدة كلها جواب رجل لا يبالي باللوم."
  devices:
    - title: "الأمر والنهي في جواب الشرط"
      text: "في «فَسِيرِي ... وَلَا تَحُورِي» أمر بالذهاب ونهي عن الرجوع، فلا يترك لها طريقًا إلا البعد. والشرط «إِنْ كُنْتِ عَاذِلَتِي» يجعل اللوم نفسه سبب الطرد: من تلومه لا مكان لها عنده."
    - title: "الكناية"
      text: "«نَحْوَ الْعِرَاقِ» على تفسير أبي العلاء كناية عن الغنى: لم يقل اذهبي حيث المال، بل ذكر البلد الذي فيه الملك الذي يعطيه. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود… فيومئ به إليهِ، ويجعلهُ دليلاً عليه» [@dalail، ص66]."
    - title: "التصريع"
      text: "ختم الصدر بـ«فَسِيرِي» على قافية العَجُز «تَحُورِي». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. والعَرُوض آخر تفعيلة في الصدر، والضَّرْب آخر تفعيلة في العَجُز."
  connection: "ثم يقول لها: لا تسألي عن مالي، وانظري إلى حسبي وكرمي."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "إِنْ كُنْ تِ عَا / ذِلَتِي فَسِيرِي = مُتْفاعلن / متَفاعلاتن — نَحْوَلْ عِرَا / قِ وَلَا تَحُورِي = مُتْفاعلن / متَفاعلاتن"
  note: "مجزوء الكامل «ما حذف ثلثه وبقي على أربع تفعيلات» [@atiq، ص60]: «متَفاعلن متَفاعلن» في كل شطر. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الشطرين فصارت «مُتْفاعلن». والضرب مرفّل، والمرفّل ما «زيد عليه سبب خفيف فتصير متفاعلن متفاعلاتن» [@atiq، ص61]. والبيت مصرّع، فجاءت عروضه مرفّلة على مثال ضربه."
context: "مطلع القصيدة، وعليه بُنيت: عاذلة تلوم، وشاعر يرد عليها بكرمه وفرسان قومه ولهوه. وهو أول ما يرويه أبو تَمّام منها [@tabrizi-hamasa، ج1 ص202]، وأول ما يرويه أبو الفَرَج من القصيدة التي «منها الغناء» [@aghani-dk، ج21 ص5]. وقد قرأها الأَصْمَعِيّ على أبي عَمْرو بن العلاء [@asmaiyyat، ص58]."
