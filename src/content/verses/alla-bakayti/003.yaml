    text: "اللاتي يجدن حرقة الحزن [@ibn-hisham، ج2 ص30، الحاشية]."
  - term: "مُسْتَكِينَاتٍ"
    text: "خاضعات [@ibn-hisham، ج2 ص30، الحاشية]."
  - term: "يَرُحْنَ مَعَ الرَّوَائِحْ"
    text: "يمضين في الرواح، آخر النهار، مع الذاهبات."
