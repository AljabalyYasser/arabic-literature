explained: false
first: "وَلَقَدْ عَنَانِي صَوْتُهُمْ"
second: "مِنْ بَيْنِ مُسْتَسْقٍ وَصَائِحْ"
vocabulary:
  - term: "عَنَانِي"
    text: "«أحزننى وشق على» [@ibn-hisham، ج2 ص32، الحاشية]."
  - term: "مُسْتَسْقٍ"
    text: "طالب للسقيا. يقول محققو السيرة في الهامة إنها «طَائِر تزْعم الْعَرَب أَنه يخرج من رَأس الْقَتِيل إِذا قتل فَيَصِيح: اسقوني اسقوني، فَلَا يزَال يَصِيح كَذَلِك حتّى يُؤْخَذ بثأره» [@ibn-hisham، ج2 ص29، الحاشية]."
