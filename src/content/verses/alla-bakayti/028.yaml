first: "بِالْمُقْرَبَاتِ الْمُبْعَدَا"
second: "تِ الطَّامِحَاتِ مَعَ الطَّوَامِحْ"
vocabulary:
  - term: "الْمُقْرَبَاتِ"
    text: "«الْخَيل الَّتِي تقرب من الْبيُوت لكرمها» [@ibn-hisham، ج2 ص32، الحاشية]."
  - term: "الْمُبْعَدَاتِ"
    text: "«الَّتِي تبعد فِي جريها أَو فِي مَسَافَة غزوها» [@ibn-hisham، ج2 ص32، الحاشية]."
  - term: "الطَّامِحَاتِ"
    text: "«الَّتِي ترفع رءوسها» [@ibn-hisham، ج2 ص32، الحاشية]."
