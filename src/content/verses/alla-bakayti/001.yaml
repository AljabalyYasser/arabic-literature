first: "أَلَّا بَكَيْتِ عَلَى الْكِرَا"
second: "مِ بَنِي الْكِرَامِ أُولِي الْمَمَادِحْ"
meaning: "هلّا بكيتِ على الكرام أبناء الكرام، أصحاب الخصال التي يُمدحون بها؟ والخطاب لمؤنث لا يسمّيه، كعادة الرثاء في خطاب العين أو النفس أو المرأة، يلومها على أنها لم تبكهم بعد."
vocabulary:
  - term: "أَلَّا"
    text: "حرف تحضيض بمعنى «هلّا»، وبها يرويه ابن سَلّام: «هَلَّا بَكَيْتِ عَلَى الْكِرَامِ» [@ibn-sallam، ج1 ص263]."
  - term: "الْكِرَامِ"
    text: "السادة الأجواد، يريد قتلى قريش ببدر."
  - term: "أُولِي الْمَمَادِحْ"
    text: "أصحاب ما يُمدح به من الخصال، و«المَقابِحُ: مَا يُسْتَقْبَح مِنَ الأَخلاق، والمَمادِحُ: مَا يُسْتَحْسَنُ منها» [@lisan، ج2 ص553]."
context: "مطلع القصيدة في رواية ابن إسحاق [@ibn-hisham، ج2 ص30]، وهو ثاني بيتين يرويهما ابن سَلّام بعد «ماذا ببدر» [@ibn-sallam، ج1 ص263]. يبدأ الرثاء بلوم: من لم يبك هؤلاء فقد قصّر. ثم تأتي الحمائم والنائحات في الأبيات 2–4 قدوةً للباكية."
syntax:
  - "«أَلَّا» حرف تحضيض مبني لا عمل له، ويدخل على الماضي فيفيد اللوم على ما فات."
  - "«بَكَيْتِ» فعل ماض، والتاء المكسورة فاعل، وهي لمؤنثة مخاطبة."
  - "«عَلَى الْكِرَامِ» جار ومجرور متعلق بـ«بكيت»، و«بَنِي» نعت لـ«الكرام» مجرور بالياء لأنه ملحق بجمع المذكر السالم، و«الكرامِ» مضاف إليه."
  - "«أُولِي» نعت ثانٍ مجرور بالياء لأنه ملحق بجمع المذكر السالم، و«الممادح» مضاف إليه، وسُكّن للوقف."
morphology:
  - "«الكِرام» جمع «كريم» على «فِعال»."
  - "«المَمادِح» جمع «مَمْدَحة» على «مَفاعِل»، و«مَمْدَحة» اسم على «مَفْعَلة» من «مدح»."
  - "«أُولُو» و«أُولِي» اسم جمع بمعنى «أصحاب» لا مفرد له من لفظه، وتُكتب واوه ولا تُنطق."
rhetoric:
  thesis: "رثاء يبدأ بالعتاب: الشاعر لا يبكي أولًا، بل يلوم من لم يبك، فيجعل البكاء واجبًا لا عاطفة، وحقًّا للموتى على الأحياء."
  devices:
    - title: "التحضيض في «أَلَّا بَكَيْتِ»"
      text: "طلب فيه لوم: يدخل حرف التحضيض على الماضي، فيلوم على ما لم يُفعل. فالبكاء الذي لم يكن صار تقصيرًا يُحاسب عليه."
    - title: "التكرار في «الْكِرَامِ بَنِي الْكِرَامِ»"
      text: "يكرر الكلمة ليجعل الكرم نسبًا يتوارثه الأبناء عن الآباء، لا صفة فرد، فيعظم المصاب: لم يُقتل كرام فحسب، بل انقطع بيت من الكرم."
    - title: "الحذف في «بَكَيْتِ»"
      text: "لا يذكر المخاطَبة، فيبقى الخطاب مفتوحًا للعين أو للنفس أو لكل من يسمع. وهي قراءتنا."
  connection: "بعده التشبيه بالحمام: «كَبُكَا الْحَمَامِ عَلَى فُرُوعِ الْأَيْكِ»، فيعلّم الباكيةَ كيف تبكي."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الحاء الساكنة، وقبلها ألف التأسيس، والقافية مقيّدة"
  scansion: "أَلْلَابَكَيْ / تِعَلَلْكِرَا = مُتْفاعِلُن / مُتَفاعِلُن — مِبَنِلْكِرَا / مِأُلِلْمَمَادِحْ = مُتَفاعِلُن / مُتَفاعِلانْ"
  note: "التفعيلة الأولى مُضْمَرة «مُتْفاعِلُن» بتسكين ثانيها، وهو كثير في الكامل. والضرب «مُتَفاعِلانْ» بزيادة ساكن، وهو التذييل، وعليه القصيدة كلها. وتنقسم «الكرام» بين الشطرين، فالبيت مدوّر. وواو «أُولِي» لا تُنطق."
