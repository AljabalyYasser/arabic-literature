first: "مَاذَا بِبَدْرٍ فَالْعَقَنْـ"
second: "ـقَلِ مِنْ مَرَازِبَةٍ جَحَاجِحْ"
meaning: "ما أعظم من صُرع ببدر والعقنقل من سادة ورؤساء كرام! سؤال لا يطلب جوابًا، بل يتفجع على كثرة من سقط هناك من رؤوس قريش."
vocabulary:
  - term: "بَدْرٍ"
    text: "موضع الماء الذي التقى فيه المسلمون وقريش سنة 2هـ."
  - term: "الْعَقَنْقَلِ"
    text: "«الْكَثِيب من الرمل المنعقد» [@ibn-hisham، ج2 ص30، الحاشية]، ويقول محققو «الأغاني»: «كثيب رمل ببدر» [@aghani-dk، ج4 ص122، الحاشية]."
  - term: "مَرَازِبَةٍ"
    text: "«الرؤساء، الْوَاحِد: مرزبان، وَهِي كلمة أَعْجَمِيَّة» [@ibn-hisham، ج2 ص30، الحاشية]، وأصلها فارسي، والمرزبان عند الفرس الفارس المقدَّم على القوم دون الملك، كما يقول محققو «الأغاني» [@aghani-dk، ج4 ص122، الحاشية]."
  - term: "جَحَاجِحْ"
    text: "«السَّادة، واحدهم: جحجاح» [@ibn-hisham، ج2 ص30، الحاشية]."
context: "بيت القصيدة الذي عُرفت به: به يبدأ ابن سَلّام روايته: «وناح أميّة على قتلى بدر فقال» [@ibn-sallam، ج1 ص263]، وإياه وحده يروي أبو الفَرَج حين يذكر أنه «كان يرثى من قُتل من قريش فى وقعة بدر» [@aghani-dk، ج4 ص122]، وبه يسمّي الزُّهْري القصيدة في خبر النهي عن روايتها [@khizana، ج3 ص401]. وفي رواية ابن إسحاق يأتي بعد خمسة أبيات في البكاء، فيسمّي فيه أول مرة المكان والقتلى."
syntax:
  - "«مَاذَا» «ما» اسم استفهام مبني في محل رفع مبتدأ، و«ذا» اسم موصول خبره، أو «ماذا» كلمة واحدة مبتدأ. والاستفهام خرج إلى التعجب والتفجع."
  - "«بِبَدْرٍ» جار ومجرور متعلق بمحذوف صلة «ذا»، أي: ما الذي ببدر، و«فالعقنقل» معطوف على «بدر» بالفاء."
  - "«مِنْ مَرَازِبَةٍ» جار ومجرور بيان لـ«ما»، و«جحاجحْ» نعت لـ«مرازبة» مجرور، وسُكّن للوقف."
morphology:
  - "«مَرازِبة» جمع «مَرْزُبان» على «فَعالِلة»، والتاء فيه تلحق جموع الأعجمي المعرّب."
  - "«جَحاجِح» جمع «جَحْجاح» على «فَعالِل»، وهو ممنوع من الصرف لأنه على صيغة منتهى الجموع."
  - "«العَقَنْقَل» على «فَعَنْلَل»، بنون زائدة."
rhetoric:
  thesis: "الشاعر لا يعدّ القتلى ولا يسمّيهم، بل يسأل: ماذا هناك؟ فيترك السؤال يتسع لكل ما فقدته قريش، ويجعل المكان نفسه قبرًا للسادة."
  devices:
    - title: "الاستفهام التعجبي في «مَاذَا بِبَدْرٍ»"
      text: "لا يسأل عمّا في بدر، بل يتعجب من عظمه ويتفجع: كأن الموضع حوى من السادة ما لا يُحصى."
    - title: "ذكر المكان في «بِبَدْرٍ فَالْعَقَنْقَلِ»"
      text: "يسمّي موضعين متجاورين ويعطف بالفاء، ثم يمضي في البيت التالي إلى مواضع أخرى: «فَمَدَافِعِ الْبَرْقَيْنِ فَالْحَنَّانِ». فيصير ذكر الأمكنة نوعًا من النواح: كل موضع يُذكر شاهد على مصرع."
    - title: "الكلمة المعرّبة «مَرَازِبَةٍ»"
      text: "يصف سادة قريش بلقب رؤساء الفرس، وهي كلمة أعجمية كما يقول محققو السيرة [@ibn-hisham، ج2 ص30، الحاشية]. وهو من لغة أهل القرى، لا من لغة البادية، ويقول ابن قُتَيْبة إن أمية كان «يأتى بألفاظ كثيرة لا تعرفها العرب» [@ibn-qutayba، ج1 ص450]. والصلة بين القولين قراءتنا."
  connection: "يكمل البيت التالي قائمة الأماكن: «فَمَدَافِعِ الْبَرْقَيْنِ فَالْـحَنَّانِ مِنْ طَرَفِ الْأَوَاشِحْ»."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الحاء الساكنة، وقبلها ألف التأسيس، والقافية مقيّدة"
  scansion: "مَاذَابِبَدْ / رِنْفَلْعَقَنْ = مُتْفاعِلُن / مُتْفاعِلُن — قَلِمِنْمَرَا / زِبَتِنْجَحَاجِحْ = مُتَفاعِلُن / مُتَفاعِلانْ"
  note: "التفعيلتان في الصدر مُضْمَرتان «مُتْفاعِلُن». والضرب مُذيَّل. وتنقسم «العقنقل» بين الشطرين، فالبيت مدوّر."
