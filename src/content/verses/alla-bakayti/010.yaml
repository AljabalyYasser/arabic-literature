first: "أَنْ قَدْ تَغَيَّرَ بَطْنُ مَكْـ"
second: "ـكَةَ فَهْيَ مُوحِشَةُ الْأَبَاطِحْ"
meaning: "ألا ترون ما أرى، وقد ظهر لكل ناظر: أن وادي مكة قد تغيّر بعدهم، فأباطحه خالية موحشة بعد أن كانت عامرة بهم. والكلام متصل بالبيت السابق: «أَلَا تَرَوْنَ لِمَا أَرَى / وَلَقَدْ أَبَانَ لِكُلِّ لَامِحْ»."
vocabulary:
  - term: "بَطْنُ مَكَّةَ"
    text: "وسطها وواديها."
  - term: "مُوحِشَةُ"
    text: "خالية من أهلها وأنيسها."
  - term: "الْأَبَاطِحْ"
    text: "جمع أبطح، و«الأَبْطَحُ مَسِيل واسِع فِيهِ دُقاقُ الحَصى» [@lisan، ج2 ص413]."
context: "بعد ذكر القتلى في بدر ينقل الشاعر عينه إلى مكة: لم يعد المصاب في ساحة المعركة، بل في المدينة التي فقدت سادتها. وهو ختام المقطع الثاني، وبعده يعود إلى وصف القتلى واحدًا واحدًا في صفاتهم: «مِنْ كُلِّ بِطْرِيقٍ لِبِطْرِيقٍ»."
syntax:
  - "«أَنْ» مخففة من الثقيلة، واسمها ضمير الشأن محذوف، وجملة «قد تغيّر بطنُ مكة» خبرها، والمصدر المؤول فاعل «أبان» في البيت السابق، أي: ظهر لكل لامح تغيّرُ بطن مكة."
  - "«قَدْ» حرف تحقيق، و«تغيّر» فعل ماض، و«بطنُ» فاعل، و«مكةَ» مضاف إليه مجرور بالفتحة لأنه ممنوع من الصرف."
  - "«فَهْيَ مُوحِشَةُ الْأَبَاطِحْ» الفاء عاطفة أو سببية، و«هي» مبتدأ، و«موحشةُ» خبره، و«الأباطح» مضاف إليه، فهي إضافة الصفة إلى فاعلها في المعنى: أباطحها موحشة."
morphology:
  - "«تَغَيَّرَ» على «تَفَعَّلَ» من «غير»."
  - "«مُوحِشة» اسم فاعل من «أَوْحَشَ» على «مُفْعِلة»."
  - "«الأَباطِح» جمع «أَبْطَح» على «أَفاعِل»."
  - "«فَهْيَ» بتسكين الهاء بعد الفاء، وهو كثير في الشعر وغيره."
rhetoric:
  thesis: "الرثاء ينتقل من الموتى إلى المكان الذي تركوه: الشاعر لا يقول إن مكة حزينة، بل يقول إنها تغيّرت، فيصير غياب السادة شيئًا تراه العين."
  devices:
    - title: "المجاز في «تَغَيَّرَ بَطْنُ مَكَّةَ»"
      text: "لم يتغير الوادي نفسه، بل تغيّر بفقد أهله، فأسند التغيّر إلى المكان والمراد من كان فيه. وهي قراءتنا."
    - title: "الإضافة في «مُوحِشَةُ الْأَبَاطِحْ»"
      text: "يضيف الصفة إلى الأباطح، فيعمّ الوحشة كل مسيل في مكة، ويجعلها صفة ثابتة للمدينة كلها."
    - title: "التضمين بين البيتين 9 و10"
      text: "لا يتم البيت 9 بنفسه، لأن «أبان» يطلب فاعله في البيت 10. وهو التضمين عند العروضيين: «ألا يستقل البيت بمعناه، بل يكون المعنى مجزءًا بين بيتين» [@atiq، ص166]. فيمتد السؤال «ألا ترون؟» حتى يقع جوابه في صورة مكة الخالية."
  connection: "بعده يرجع إلى القتلى: «مِنْ كُلِّ بِطْرِيقٍ لِبِطْرِيقٍ نَقِيِّ اللَّوْنِ وَاضِحْ»، أي الذين أوحشت مكة بفقدهم."
prosody:
  meter: "مجزوء الكامل"
  rhyme: "الرَّوِيّ الحاء الساكنة، وقبلها ألف التأسيس، والقافية مقيّدة"
  scansion: "أَنْقَدْتَغَيْ / يَرَبَطْنُمَكْ = مُتْفاعِلُن / مُتَفاعِلُن — كَةَفَهْيَمُو / حِشَتُلْأَبَاطِحْ = مُتَفاعِلُن / مُتَفاعِلانْ"
  note: "الأولى مُضْمَرة «مُتْفاعِلُن»، والضرب مُذيَّل «مُتَفاعِلانْ». وتنقسم «مكة» بين الشطرين، فالبيت مدوّر."
