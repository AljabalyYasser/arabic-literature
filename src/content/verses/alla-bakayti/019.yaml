    text: "«الْإِبِل الْحَوَامِل» [@ibn-hisham، ج2 ص31، الحاشية]. وأنشد ابن هشام: «إِلَى الْمِئِينَ مِنَ الدَّوَاقِحْ» [@ibn-hisham، ج2 ص32]."
