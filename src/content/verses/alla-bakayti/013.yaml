first: "مِنَ السَّرَاطِمَةِ الْخَلَا"
second: "جِمَةِ الْمَلَاوِثَةِ الْمَنَاجِحْ"
vocabulary:
  - term: "السَّرَاطِمَةِ"
    text: "«جمع سرطم، وَهُوَ الْوَاسِع الْحلق» [@ibn-hisham، ج2 ص31، الحاشية]. و«السَّرْطَمُ: الطويل» في اللسان [@lisan، ج12 ص286]."
  - term: "الْخَلَاجِمَةِ"
    text: "«جمع خلجم، وَهُوَ الضخم الطَّوِيل» [@ibn-hisham، ج2 ص31، الحاشية]."
  - term: "الْمَلَاوِثَةِ"
    text: "جمع ملواث، «وَهُوَ السَّيِّد» [@ibn-hisham، ج2 ص31، الحاشية]."
  - term: "الْمَنَاجِحْ"
    text: "«الَّذين ينجحون فِي سَعْيهمْ» [@ibn-hisham، ج2 ص31، الحاشية]."
