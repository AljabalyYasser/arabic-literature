first: "مُرْدًا عَلَى جُرْدٍ إِلَى"
second: "أُسْدٍ مُكَالِبَةٍ كَوَالِحْ"
vocabulary:
  - term: "مُرْدًا"
    text: "شبانًا لم تنبت لحاهم."
  - term: "جُرْدٍ"
    text: "«الْخَيل الْعتاق» [@ibn-hisham، ج2 ص32، الحاشية]."
  - term: "مُكَالِبَةٍ كَوَالِحْ"
    text: "«الَّذين بهم شبه الْكَلْب، وَهُوَ السعار، يعْنى حدتهم فِي الْحَرْب. والكوالح: العوابس» [@ibn-hisham، ج2 ص32، الحاشية]."
sources:
