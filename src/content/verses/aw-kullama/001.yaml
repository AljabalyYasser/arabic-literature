explained: false
first: أَوَكُلَّمَا وَرَدَتْ عُكَاظَ قَبِيلَةٌ
second: بَعَثُوا إِلَيَّ رَسُولَهُمْ يَتَوَسَّمُ
vocabulary:
- term: عُكَاظَ
  text: موضع قرب الطائف كانت تقام به سوق العرب، يقيمون فيها شهر شوال [@asmaiyyat، ص127، الحاشية].
- term: رَسُولَهُمْ
  text: 'ويروى «عريفهم» [@bayan، ج3 ص69] [@iqd، ج6 ص65]، أي عارفهم: «والعريف والعارف بمعنى مثل عليم وعالم» [@lisan، ج9 ص236].'
- term: يَتَوَسَّمُ
  text: «يتفرس ويطلب الوسم وهو العلامة» [@asmaiyyat، ص127، الحاشية].
