explained: false
first: حَوْلِي فَوَارِسُ مِنْ أُسَيِّدَ شِجْعَةٌ
second: وَإِذَا غَضِبْتُ فَحَوْلَ بَيْتِيَ خَضَّمُ
vocabulary:
- term: أُسَيِّدَ
  text: بنو أُسَيِّد بن عَمْرو بن تميم، و«أسيّد» «تصغير أسود في لغة بني تميم» [@asmaiyyat، ص128، الحاشية].
- term: شِجْعَةٌ
  text: شجعان، اسم جمع للشجاع [@lisan، ج8 ص173].
- term: خَضَّمُ
  text: «لقب لبني العنبر بن عَمْرو بن تميم» [@asmaiyyat، ص128، الحاشية]، قوم الشاعر؛ «يزعمون أنهم إنما سموا بذلك لكثرة الخضم، وهو المضغ بالأضراس» [@lisan، ج12 ص184].
