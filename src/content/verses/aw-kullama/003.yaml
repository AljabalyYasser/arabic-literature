explained: false
first: تَحْتِي الْأَغَرُّ وَفَوْقَ جِلْدِي نَثْرَةٌ
second: زَغْفٌ تَرُدُّ السَّيْفَ وَهْوَ مُثَلَّمُ
vocabulary:
- term: الْأَغَرُّ
  text: 'فرسه [@asmaiyyat، ص128، الحاشية]، والأغرّ في الأصل: الأبيض الجبهة.'
- term: نَثْرَةٌ
  text: '«الدرع السلسة الملبس، وقيل: هي الدرع الواسعة» [@lisan، ج5 ص193].'
- term: زَغْفٌ
  text: 'درع «المحكمة، وقيل: الواسعة الطويلة ... وقيل: الدرع اللينة» [@lisan، ج9 ص135].'
- term: مُثَلَّمُ
  text: قد تكسّر حدّه.
