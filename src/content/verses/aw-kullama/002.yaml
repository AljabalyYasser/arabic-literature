explained: false
first: فَتَوَسَّمُونِي إِنَّنِي أَنَا ذَاكُمُ
second: شَاكٌ سِلَاحِي فِي الْحَوَادِثِ مُعْلِمُ
vocabulary:
- term: فَتَوَسَّمُونِي
  text: تأمّلوني لتعرفوني؛ «يأمرهم أن يتوسموه» [@asmaiyyat، ص128، الحاشية].
- term: شَاكٌ سِلَاحِي
  text: '«تام السلاح أو حاده» [@asmaiyyat، ص128، الحاشية]؛ ويقال: «شاكي السلاح وشاك السلاح، برفع الكاف» [@lisan، ج10 ص454].'
- term: مُعْلِمُ
  text: «الذي شهر نفسه في الحرب بعلامة يعرف بها» [@asmaiyyat، ص128، الحاشية].
