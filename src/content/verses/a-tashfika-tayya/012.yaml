explained: false
first: "وَزَوْرًا تَرَى فِي مِرْفَقَيْهِ تَجَانُفًا"
second: "نَبِيلًا كَبَيْتِ الصَّيْدَلَانِيِّ دَامِكَا"
vocabulary:
  - term: "زَوْرًا"
    text: "«الزَّوْرُ: الصَّدْرُ، وَقِيلَ: وَسَطُ الصَّدْرِ» [@lisan، ج4 ص333]."
  - term: "تَجَانُفًا"
    text: "ميلًا وتباعدًا، من «وتجانَفَ لإِثمٍ أَي مَالَ» [@lisan، ج9 ص33]."
  - term: "الصَّيْدَلَانِيِّ ... دَامِكَا"
    text: "في اللسان «الصَّيْدَنَانِيِّ» بالنون: «وَرَوَاهُ ابْنُ حَبِيبٍ: كَبَيْتِ الصَّيْدَنَانِيِّ، وَالصَّيْدَنَانِيُّ الملِك، ودامِكاً مُرْتَفَعًا» [@lisan، ج10 ص430]، فشبّه صدر ناقته في ارتفاعه ببيت الملك. وفيه عن ابن السِّكِّيت: «أَراد بالصَّيدَنانِيّ الثَّعْلَبَ» [@lisan، ج13 ص246]."
