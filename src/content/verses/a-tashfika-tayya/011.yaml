explained: false
first: "لَهَا فَخِذَانِ تَحْفِزَانِ مَحَالَةً"
second: "وَصُلْبًا كَبُنْيَانِ الصَّفَا مُتَلَاحِكَا"
vocabulary:
  - term: "تَحْفِزَانِ"
    text: "تدفعان: «الحَفْزُ: حَثُّك الشَّيْءَ مِنْ خَلْفِهِ» [@lisan، ج5 ص337]، وفيه هذا البيت برواية «يَحْفِزانِ»."
  - term: "مَحَالَةً"
    text: "فقارة من فقار الظهر: «والمَحالة: الفَقارة» [@lisan، ج11 ص620]."
  - term: "مُتَلَاحِكَا"
    text: "متداخلًا متماسكًا: «واللَّحْكُ: مُداخلة الشَّيْءِ فِي الشَّيْءِ» [@lisan، ج10 ص483]."
