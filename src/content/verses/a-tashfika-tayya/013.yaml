explained: false
first: "وَرَأْسًا دَقِيقَ الخَطْمِ صُلْبًا مُذَكَّرًا"
second: "وَدَأْيًا كَأَعْنَاقِ الضِّبَاعِ وَحَارِكَا"
vocabulary:
  - term: "الخَطْمِ"
    text: "«والخَطْمُ مِنْ كُلِّ دَابَّةٍ: مُقَدَّمُ أَنفها وَفَمِهَا» [@lisan، ج12 ص186]."
  - term: "مُذَكَّرًا"
    text: "تشبه الفحل في ضخامته: «وَنَاقَةٌ مُذَكَّرَةٌ: مُتَشَبِّهَةٌ بالجَمَلِ فِي الخَلْقِ» [@lisan، ج4 ص309]."
  - term: "دَأْيًا"
    text: "«الدَّأْيُ والدُّئِيُّ والدِّئِيُّ: فِقَر الكاهِلِ والظَّهْرِ» [@lisan، ج14 ص247]."
  - term: "الضِّبَاعِ"
    text: "جمع ضَبْع: «الضَّبْعُ، بِسُكُونِ الْبَاءِ: وسَطُ العَضُدِ بِلَحْمِهِ» [@lisan، ج8 ص216]."
  - term: "حَارِكَا"
    text: "«والحارِكُ: أَعلى الْكَاهِلِ» [@lisan، ج10 ص410]، والكاهل ما بين الكتفين."
