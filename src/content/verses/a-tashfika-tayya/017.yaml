first: "فَلَمَّا أَتَتْ آطَامَ جَوٍّ وَأَهْلَهُ"
second: "أُنِيخَتْ وَأَلْقَتْ رَحْلَهَا بِفِنَائِكَا"
vocabulary:
  - term: "آطَامَ"
    text: "جمع أُطُم: «الأُطُم: حِصْنٌ مَبْنِيٌّ بِحِجَارَةٍ» [@lisan، ج12 ص19]، وفيه هذا البيت."
  - term: "جَوٍّ"
    text: "«وجوٌّ: اسْمُ الْيَمَامَةِ» [@lisan، ج14 ص159]، وهي بلد هَوْذة."
