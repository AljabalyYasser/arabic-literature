explained: false
first: "يَقُولُونَ فِي الإِكْفَاءِ أَكْبَرُ هَمِّهِ"
second: "أَلَا رُبَّ مِنْهُمْ مَنْ يَعِيشُ بِمَالِكَا"
vocabulary:
  - term: "الإِكْفَاءِ"
    text: "الجَور والميل عن العدل: «وأَكْفَأَ فِي سَيره: جارَ عَنِ القَصْدِ» [@lisan، ج1 ص142]. يقول: يتهمه حسّاده بأن همّه الجور على الناس. وعند شوقي ضَيْف «فى الأكفاء»، وقال: «يريد بالشطر الأول أن ممدوحه يتهم بأنه يظلم أكفاءه» [@deif، ج1 ص350]."
