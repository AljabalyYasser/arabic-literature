explained: false
first: "بِأَدْمَاءَ حُرْجُوجٍ بَرَيْتُ سَنَامَهَا"
second: "بِسَيْرِي عَلَيْهَا بَعْدَ مَا كَانَ تَامِكَا"
vocabulary:
  - term: "أَدْمَاءَ"
    text: "ناقة بيضاء: «والأُدْمة فِي الإِبِلِ الْبَيَاضُ»، كما ينقل اللسان عن الجوهري [@lisan، ج12 ص12]."
  - term: "حُرْجُوجٍ"
    text: "«والحَرَجُ والحُرْجُوجُ: النَّاقَةُ الْجَسِيمَةُ الطَّوِيلَةُ عَلَى وَجْهِ الأَرض» [@lisan، ج2 ص235]."
  - term: "بَرَيْتُ سَنَامَهَا"
    text: "أهزلتها حتى ذهب سنامها: «وبَرَاه السفَر يَبْرِيهِ بَرْياً: هَزَلَهُ» [@lisan، ج14 ص71]، وفيه هذا البيت."
  - term: "تَامِكَا"
    text: "«التامِكُ السَّنَامُ مَا كَانَ، وَقِيلَ: هُوَ السَّنَامُ الْمُرْتَفِعُ» [@lisan، ج10 ص407]."
