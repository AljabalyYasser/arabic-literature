first: "وَفِي كُلِّ عَامٍ أَنْتَ جَاشِمُ غَزْوَةٍ"
second: "تَشُدُّ لِأَقْصَاهَا عَزِيمَ عَزَائِكَا"
vocabulary:
  - term: "جَاشِمُ"
    text: "متكلّف: «جَشِمَ الأَمْرَ، بِالْكَسْرِ، يَجْشَمُه جَشْماً وجَشامةً وتَجَشَّمَه: تَكَلَّفَه عَلَى مَشَقَّةٍ» [@lisan، ج12 ص100]."
  - term: "عَزِيمَ عَزَائِكَا"
    text: "أشدّ صبرك: «العَزَاءُ: الصَّبْرُ» [@lisan، ج15 ص52]."
