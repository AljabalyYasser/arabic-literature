explained: false
first: "وَيَهْمَاءَ قَفْرٍ تَحْرَجُ العَيْنُ وَسْطَهَا"
second: "وَتَلْقَى بِهَا بَيْضَ النَّعَامِ تَرَائِكَا"
vocabulary:
  - term: "يَهْمَاءَ"
    text: "«اليَهْمَاءُ: مفازةٌ لَا مَاءَ فِيهَا وَلَا يُسْمع فِيهَا صوتٌ» [@lisan، ج12 ص648]."
  - term: "تَحْرَجُ العَيْنُ"
    text: "تحار فيها العين: «وحَرِجَتْ عينُه تحْرَجُ حَرَجاً أَي حَارَتْ» [@lisan، ج2 ص234]."
  - term: "تَرَائِكَا"
    text: "جمع تريكة: «والتَّرِيكةُ بَيْضَةُ النَّعَامَةِ الَّتِي يَتْرُكُهَا» [@lisan، ج10 ص405]."
