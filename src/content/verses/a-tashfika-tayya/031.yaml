first: "مُوَرِّثَةٍ مَالًا وَفِي الحَمْدِ رِفْعَةً"
second: "لِمَا ضَاعَ فِيهَا مِنْ قُرُوءِ نِسَائِكَا"
vocabulary:
  - term: "قُرُوءِ نِسَائِكَا"
    text: "أطهارهن. قال صاحب اللسان: «وحَقَّقَ هَذَا اللفظَ، مِنْ كَلَامِ الْعَرَبِ، قولُ الأَعشى»، ثم أنشد العجز، وقال: «فالقُرُوءُ هُنَا الأَطْهارُ لَا الحِيَضُ» [@lisan، ج1 ص131]. يقول: تطول غزواته فيغيب عن نسائه."
