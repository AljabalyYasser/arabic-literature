explained: false
first: "وَخَرْقٍ مَخُوفٍ قَدْ قَطَعْتُ بِجَسْرَةٍ"
second: "إِذَا الجِبْسُ أَعْيَى أَنْ يَرُومَ المَسَالِكَا"
vocabulary:
  - term: "خَرْقٍ"
    text: "«والخَرْقُ: الأَرض الْبَعِيدَةُ» [@lisan، ج10 ص74]."
  - term: "جَسْرَةٍ"
    text: "ناقة ماضية جريئة: «وجَمَلٌ جَسْرٌ وَنَاقَةٌ جَسْرَة ومُتَجاسِرَة» [@lisan، ج4 ص136]."
  - term: "الجِبْسُ"
    text: "«الجِبْسُ: الجَبانُ الفَدْمُ» [@lisan، ج6 ص34]، والفَدْم: العييّ الثقيل."
