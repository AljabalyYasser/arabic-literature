explained: false
first: "وَأَقْصَرْتَ عَنْ ذِكْرِ البَطَالَةِ وَالصِّبَى"
second: "وَكَانَتْ سَفَاهًا ضِلَّةً مِنْ ضَلَالِكَا"
vocabulary:
  - term: "أَقْصَرْتَ"
    text: "كففت وانتهيت: «قَصَرَ عَنِ الأَمر يَقْصُر قُصُوراً وأَقْصَر وقَصَّرَ وتَقَاصَر، كُلُّهُ: انْتَهَى» [@lisan، ج5 ص98]."
  - term: "البَطَالَةِ"
    text: "«والتَّبَطُّل: فِعْلُ البَطَالة وَهُوَ اتِّبَاعُ اللَّهْوِ والجَهالة» [@lisan، ج11 ص56]."
  - term: "سَفَاهًا"
    text: "«السَّفَهُ والسَّفاهُ والسَّفاهة: خِفَّةُ الحِلْم» [@lisan، ج13 ص497]، أي طيش."
