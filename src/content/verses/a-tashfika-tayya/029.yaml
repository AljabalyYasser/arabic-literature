first: "وَلَمْ يَسْعَ فِي العَلْيَاءِ سَعْيَكَ مَاجِدٌ"
second: "وَلَا ذُو إِنًى فِي الحَيِّ مِثْلَ قَرَائِكَا"
vocabulary:
