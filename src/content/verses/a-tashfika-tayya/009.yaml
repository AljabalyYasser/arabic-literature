first: "قَطَعْتُ إِذَا مَا اللَّيْلُ كَانَتْ نُجُومُهُ"
second: "بَوَانِيَ فِي جَوِّ السَّمَاءِ سَوَامِكَا"
vocabulary:
  - term: "بَوَانِيَ"
    text: "ثابتة لا تبرح، من قولهم: «أَلقى عَصاه وأَلقى بَوانِيَه» [@lisan، ج13 ص61] إذا أقام."
  - term: "سَوَامِكَا"
    text: "مرتفعة: «والسَّامِكُ: الْعَالِي الْمُرْتَفِعُ» [@lisan، ج10 ص444]."
