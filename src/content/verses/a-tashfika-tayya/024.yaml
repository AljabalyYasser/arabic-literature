first: "بُحُورٌ تَقُوتُ النَّاسَ فِي كُلِّ لَزْبَةٍ"
second: "أَبُوكَ وَأَعْمَامٌ هُمُ هَؤُلَائِكَا"
vocabulary:
  - term: "لَزْبَةٍ"
    text: "«واللَّزْبةُ: الشِّدَّةُ» [@lisan، ج1 ص738]، أي في كل سنة قحط."
  - term: "هَؤُلَائِكَا"
    text: "«هؤلاء» وصلت بها كاف الخطاب، أي: هم أولئك."
