first: "بَكَى صَاحِبِي لَمَّا رَأَى الدَّرْبَ دُونَهُ"
second: "وَأَيْقَنَ أَنَّا لَاحِقَانِ بِقَيْصَرَا"
meaning: "بكى رفيقي حين رأى الطريق أمامه، وأيقن أننا ذاهبان إلى قيصر ملك الروم. قالها لعَمْرو بن قَمِيئة «حين استصحبه في مسيره إلى قيصر ملك الروم ليستعديه على بني أَسَد» [@sharrab، ج1 ص480]."
vocabulary:
  - term: "صَاحِبِي"
    text: "عَمْرو بن قَمِيئة، من بني قيس بن ثعلبة، وكان من خدم أبيه [@ibn-qutayba، ج1 ص119]."
  - term: "الدَّرْبَ"
    text: "الطريق [@diwan-imru-al-qais، ص96]، يريد الطريق إلى بلاد الروم."
  - term: "قَيْصَرَا"
    text: "لقب ملك الروم."
syntax:
  - "«لَمَّا» ظرف بمعنى «حين» فيه معنى الشرط، وجملة «رَأَى» في محل جر بالإضافة، وقد تقدّم جوابها في المعنى: «بَكَى»."
  - "«دُونَهُ» ظرف متعلق بمحذوف حال من «الدَّرْبَ»، أي: كائنًا أمامه."
  - "«أَنَّا لَاحِقَانِ» «أنّ» واسمها وخبرها، سدّت مسدّ مفعول «أيقن». و«بِقَيْصَرَا» متعلق بـ«لَاحِقَانِ»، و«قيصر» ممنوع من الصرف للعلمية والعجمة فجُرّ بالفتحة، والألف للإطلاق."
morphology:
  - "«لَاحِقَانِ» مثنى «لاحق»، اسم فاعل من «لحِق»."
  - "«أيقن» على «أفعل» من اليقين."
  - "«الدَّرْبَ» يُجمع على «دُروب»."
rhetoric:
  thesis: "مشهد إنساني نادر في الشعر الجاهلي: رفيق يبكي خوفًا على طريق الغربة، والشاعر يرى بكاءه ثم يرد عليه في البيت التالي."
  devices:
    - title: "التصوير بالمشهد"
      text: "لم يقل: خاف صاحبي، بل صوّر بكاءه ساعة رأى الطريق، فجعلنا نرى الخوف."
    - title: "التوكيد"
      text: "«وَأَيْقَنَ أَنَّا لَاحِقَانِ»؛ فالخوف عنده يقين لا ظن، وهذا يمهّد لقوة الجواب."
  connection: "فيجيبه في البيت التالي: «فَقُلْتُ لَهُ لَا تَبْكِ عَيْنُكَ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المفتوحة، وبعدها ألف الإطلاق"
  scansion: "بَكَى صَا / حِبِي لَمْمَا / رَأَدْ دَرْ / بَ دُونَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَأَيْقَ / نَ أَنْنَا لَا / حِقَانِ / بِقَيْصَرَا = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "تسقط ألف «رَأَى» في النطق لالتقاء الساكنين: «رَأَدْ دَرْ». والضرب مقبوض «مفاعلن» كالعَرُوض [@atiq، ص30]. وجاءت «فعولن» مقبوضة مرتين في العَجُز، وكلاهما جائز في حشو الطويل [@atiq، ص29]."
context: "البيت الرابع والثلاثون من قصيدة يصف فيها رحلته إلى قيصر [@diwan-imru-al-qais، ص93–96]. وشوقي ضيف يردّ القصيدة كلها، لأن «كل ما يتصل بهذه الرحلة مما وضعه ابن الكَلْبِيّ وأضرابه» [@deif، ج1 ص245]."
