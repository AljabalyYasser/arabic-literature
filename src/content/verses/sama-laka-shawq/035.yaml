first: "فَقُلْتُ لَهُ لَا تَبْكِ عَيْنُكَ إِنَّمَا"
second: "نُحَاوِلُ مُلْكًا أَوْ نَمُوتَ فَنُعْذَرَا"
meaning: "قلت له: لا تبكِ، فإنما نحن نطلب ملكًا، إلا أن نموت دونه فيعذرنا الناس. قال سِيبَوَيْه: «والمعنى على إلا أن نموت فنعذرا» [@sibawayh، ج3 ص47]."
vocabulary:
  - term: "نُحَاوِلُ"
    text: "نطلب ونسعى."
  - term: "فَنُعْذَرَا"
    text: "فيقبل الناس عذرنا. ويروى «فنُعذِر» بكسر الذال، أي: نبلغ العذر [@khizana، ج8 ص545]."
syntax:
  - "«لَا تَبْكِ» «لَا» ناهية، والفعل مجزوم بحذف الياء، و«عَيْنُكَ» فاعله؛ أسند البكاء إلى العين، والنهي في المعنى للصاحب."
  - "«إِنَّمَا» كافّة ومكفوفة تفيد الحصر: ما نفعل إلا طلب الملك."
  - "«أَوْ نَمُوتَ» منصوب بـ«أن» مضمرة بعد «أَوْ» التي بمعنى «إلا أن». ولو رُفع لكان «عربيًّا جائزًا على وجهين»: عطفًا على «نُحَاوِلُ»، أو استئنافًا بمعنى «أو نحن ممن يموت» [@sibawayh، ج3 ص47]."
  - "«فَنُعْذَرَا» منصوب بالعطف على «نَمُوتَ»، والألف للإطلاق [@khizana، ج8 ص544–545]."
morphology:
  - "«نُحَاوِلُ» مضارع «حاول» على «فاعَل»."
  - "«نُعذَر» مضارع «عذَر» مبني للمجهول، ويروى «نُعذِر» من «أعذر» إذا أتى بعذر [@khizana، ج8 ص545]."
  - "«تَبْكِ» حُذفت ياؤه للجزم."
rhetoric:
  thesis: "جواب الشاعر على بكاء صاحبه: ليس في الطريق إلا غايتان، ملك يُستردّ أو موت يُعذر به صاحبه."
  devices:
    - title: "القصر"
      text: "حصر سعيهما بـ«إِنَّمَا» في طلب الملك، فلا مكان للخوف ولا للرجوع. واختار «إنما» دون «ما… إلا». ويقول عبد القاهر الجُرْجانيّ: «موضوع إنما على أن تجيء لخبر لا يجهله المخاطب ولا يدفع صحته»، كقولهم: «إنما يعجل من يخشى الفوت» [@dalail، ص330]. فعمرو بن قَمِيئة يعرف أنهما خرجا يطلبان ملكًا، وامرؤ القَيْس لا يخبره بجديد، بل يذكّره بما يعرفه ليبني عليه: فلماذا البكاء إذن؟"
    - title: "«أَوْ» بمعنى «إلا أن»"
      text: "ليس المعنى أنهما مخيّران بين الملك والموت، بل أنهما يطلبان الملك حتى يموتا دونه: «وإنما أراد أنه يحاول طلب الملك إلا أن يموت فيعذره الناس» [@sharrab، ج1 ص480]. وقال صاحب «التكميل»: «ويحتمل أن يكون أو هنا للغاية، أي: نحاول الملك إلى أن نموت» [@khizana، ج8 ص544]."
    - title: "المقابلة"
      text: "قابل بين غايتين: «مُلْكًا» و«نَمُوتَ»، الحياة العزيزة أو الموت المعذور."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المفتوحة، وبعدها ألف الإطلاق"
  scansion: "فَقُلْتُ / لَهُو لَا تَبْ / كِ عَيْنُ / كَ إِنْنَمَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — نُحَاوِ / لُ مُلْكَنْ أَوْ / نَمُوتَ / فَنُعْذَرَا = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "أُشبعت ضمة الهاء في «لَهُ» فصارت واوًا في النطق «لَهُو». وجاءت «فعولن» مقبوضة أربع مرات، وكلاهما جائز في حشو الطويل [@atiq، ص29]."
context: "استشهد به سِيبَوَيْه على نصب الفعل بعد «أَوْ» [@sibawayh، ج3 ص47]. ووصف البَغْداديّ القصيدة بأنها «مشتملة على جمل من يواقيت الفصاحة وجواهر البلاغة» [@khizana، ج8 ص545]."
