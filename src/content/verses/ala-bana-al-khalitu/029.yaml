explained: false
first: "وَأَصْعَدَتِ الرِّبَابُ فَلَيْسَ مِنْهَا"
second: "بِصَارَاتٍ وَلَا بِالحُبْسِ نَارُ"
vocabulary:
  - term: "أَصْعَدَتِ"
    text: "ارتفعت هاربة إلى نجد [@tabrizi-ikhtiyarat، ج3 ص1426]."
  - term: "الرِّبَابُ"
    text: "قال الأصمعي: سُمّوا ربابًا لأنهم تجمّعوا فقالوا: نكون كالرِّبابة، وهي الجلدة التي تُجمع فيها القداح [@tabrizi-ikhtiyarat، ج3 ص1426]."
  - term: "فَلَيْسَ مِنْهَا ... نَارُ"
    text: "يقول: أصعدوا فليس منهم نار توقد بهذه الأماكن [@tabrizi-ikhtiyarat، ج3 ص1427]."
