first: "مُهَارِشَةِ العِنَانِ كَأَنَّ فِيهَا"
second: "جَرَادَةَ هَبْوَةٍ فِيهَا اصْفِرَارُ"
vocabulary:
  - term: "مُهَارِشَةِ العِنَانِ"
    text: "مجاذبة له لشدة حرصها على الجري [@tabrizi-ikhtiyarat، ج3 ص1435]."
  - term: "جَرَادَةَ هَبْوَةٍ"
    text: "أراد الذكر من الجراد، وهو الأصفر لأنه أخف، والهَبْوة: الغبرة [@tabrizi-ikhtiyarat، ج3 ص1435]."
