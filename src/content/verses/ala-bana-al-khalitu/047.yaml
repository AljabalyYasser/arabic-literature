explained: false
first: "تَرَاهَا مِنْ يَبِيسِ المَاءِ شُهْبًا"
second: "مُخَالِطَ دِرَّةٍ مِنْهَا غِرَارُ"
vocabulary:
  - term: "يَبِيسِ المَاءِ"
    text: "العرق، وعرق الخيل أبيض، فجعلها «شُهبًا» لما يبس عليها [@tabrizi-ikhtiyarat، ج3 ص1436]."
  - term: "دِرَّةٍ ... غِرَارُ"
    text: "الدِّرّة: انفتاقها بالعرق، والغِرار: القليل، والمعنى أنه لا يجمد عرقها فينقطع ولا يغزر فتنتقص قواها [@tabrizi-ikhtiyarat، ج3 ص1436–1437]."
