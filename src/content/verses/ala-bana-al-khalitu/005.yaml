first: "فَلَأْيًا مَا قَصَرْتُ الطَّرْفَ عَنْهُمْ"
second: "بِقَانِيَةٍ وَقَدْ تَلَعَ النَّهَارُ"
vocabulary:
  - term: "فَلَأْيًا"
    text: "أي بعد بطء [@tabrizi-ikhtiyarat، ج3 ص1416]."
  - term: "بِقَانِيَةٍ"
    text: "«قانية» لبني سُلَيم، وقال ابن الأعرابي: يعني نفسه، قانيةً للحياء، أي لما تولّوا استحييت أن أتبعهم [@tabrizi-ikhtiyarat، ج3 ص1416–1417]."
  - term: "تَلَعَ"
    text: "ارتفع [@tabrizi-ikhtiyarat، ج3 ص1416]."
