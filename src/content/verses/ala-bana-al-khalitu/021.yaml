first: "فَأَعْصِي عَاذِلِي وَأُصِيبُ لَهْوًا"
second: "وَأُوذِي فِي الزِّيَارَةِ مَنْ يَغَارُ"
meaning: "كنت في تلك الليالي أعصي من يلومني، وأنال لذّتي من النساء، وأزور المرأة فأوذي بزيارتي زوجها أو وليّها الذي يغار عليها."
vocabulary:
  - term: "عَاذِلِي"
    text: "لائمي، والعَذْل: اللوم."
  - term: "لَهْوًا"
    text: "ما يُتلهّى به ويُلتذّ، وأكثر ما يريد به الشعراء هنا اللهو بالنساء."
  - term: "الزِّيَارَةِ"
    text: "زيارة النساء في بيوتهن، وهي في الغزل الجاهلي زيارة سرية بالليل."
  - term: "مَنْ يَغَارُ"
    text: "الغيور، وهو الزوج أو الأب أو الأخ الذي يحمي المرأة ويغار عليها من الرجال."
context: "يتذكر بِشْر شبابه بعد أن رحلت الظعائن. قال في البيت 20: «ليالي لا أطاوع من نهاني، ويضفو فوق كعبيّ الإزار»، أي كان يجرّ إزاره خيلاء. ويقول التِّبْرِيزِيّ إن «ليالي» يجوز أن تنتصب بفعل مضمر، كأنه قال: أذكر ليالي هذه صفتها، وتمامه هذا البيت [@tabrizi-ikhtiyarat، ج3 ص1423]. ويذكر محقق الشرح أن البيتين 20 و21 ليسا في «الاختيارين» [@tabrizi-ikhtiyarat، ج3 ص1423]. وبعدهما ينتقل الشاعر من اللهو إلى الحرب: «ولما أن رأينا الناس صاروا أعادي»."
syntax:
  - "الفاء في «فأعصي» تفريع على ما قبلها، والجملة تفصيل لـ«ليالي» في البيت السابق: ليالي أفعل فيها كذا."
  - "«أعصي» مضارع مرفوع بضمة مقدرة على الياء، والفاعل ضمير مستتر، و«عاذلي» مفعول به منصوب بفتحة مقدرة، مضاف إلى ياء المتكلم."
  - "«وأصيبُ لهوًا» معطوفة، و«لهوًا» مفعول به."
  - "«وأوذي» معطوفة، و«في الزيارة» متعلق بـ«أوذي»، و«مَن» موصولة مفعول به، وجملة «يغار» صلتها."
  - "الأفعال كلها مضارعة، وهي تحكي حالًا ماضية متكررة: كان ذلك عادته في تلك الليالي."
morphology:
  - "«أعصي» مضارع «عصى يعصي» ناقص يائي."
  - "«عاذل» اسم فاعل من «عذل يعذل»."
  - "«أوذي» مضارع «آذى» على «أفعل»، من الأذى، وأصله «أُؤْذي» قُلبت الهمزة الثانية واوًا لسكونها بعد ضمّ."
  - "«يغار» مضارع «غار يغار» أجوف يائي من باب «فعِل يفعَل»، والغَيْرة مصدره."
rhetoric:
  thesis: "غزل صريح بالمغامرة: الشاعر يفخر بأنه كان يعصي اللائمين، ويطلب لذته، ويزور النساء المحروسات على رغم من يغار عليهن. والفخر هنا بالجرأة، لا بالحب."
  devices:
    - title: "الكناية"
      text: "«وأوذي في الزيارة من يغار» كناية عن أنه كان يصل إلى نساء لهن أزواج أو أولياء يحرسونهن، فيدخل عليهن رغم أنوفهم. لم يذكر المرأة ولا ما كان بينهما، وذكر غيظ الرجل الغيور، فدلّ بأثر الزيارة على الزيارة نفسها. وهذه قراءتنا."
    - title: "التقسيم"
      text: "ثلاثة أفعال في بيت واحد، لثلاثة أطراف: العاذل يُعصى، واللهو يُصاب، والغيور يُؤذى. فالشاعر في كل جملة يغلب أحدًا."
    - title: "موضع الغزل في القصيدة"
      text: "البيت في قصيدة فخر بالقبيلة والحرب، والغزل فيها ذكرى شباب، يأتي بين رحيل الظعائن والحرب. فالفتى الذي كان يعصي عاذله ويغلب الغيور هو نفسه الذي يذكر بعدها حروب قومه."
  connection: "ثم يقول: «ولما أن رأينا الناس صاروا أعادي ليس بينهم ائتمار»، فيترك اللهو إلى الحرب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المضمومة، مردوفة بالألف"
  scansion: "فَأَعْصِي عَا / ذِلِي وَأُصِي / بُلَهْوَنْ = مفاعلْتن / مفاعلتن / فعولن — وَأُوذِي فِزْ / زِيَارَتِمَنْ / يَغَارُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن»، والعصب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، في أول الشطرين."
