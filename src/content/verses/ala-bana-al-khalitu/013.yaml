first: "ثَقَالٌ كُلَّمَا رَامَتْ قِيَامًا"
second: "وَفِيهَا حِينَ تَنْدَفِعُ انْبِهَارُ"
vocabulary:
  - term: "ثَقَالٌ"
    text: "العظيمة العجيزة، اللفّاء الفخذين، المكورة الساقين، ولا تكون ثقالًا حتى توصف بهذه كلها [@tabrizi-ikhtiyarat، ج3 ص1420]."
  - term: "انْبِهَارُ"
    text: "انقطاع النفس [@tabrizi-ikhtiyarat، ج3 ص1420]."
