explained: false
first: "كَأَنَّ ظِبَاءَ أُسْنُمَةٍ عَلَيْهَا"
second: "كَوَانِسَ قَالِصًا عَنْهَا المَغَارُ"
vocabulary:
  - term: "كَوَانِسَ"
    text: "شبّه النساء بالظباء التي صغرت عنها كُنُسها فبعض أجسادها خارج، أي هؤلاء النساء جسام عظام صغرت عنهن هوادجهن [@tabrizi-ikhtiyarat، ج3 ص1417–1418]."
  - term: "المَغَارُ"
    text: "جمع مغارة، و«قالصًا»: مرتفعًا [@tabrizi-ikhtiyarat، ج3 ص1418]."
  - term: "أُسْنُمَةٍ"
    text: "قال الأصمعي: أكمة قريبة من فَلْج [@tabrizi-ikhtiyarat، ج3 ص1418]."
