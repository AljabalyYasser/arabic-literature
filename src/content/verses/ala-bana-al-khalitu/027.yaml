first: "وَخَذَّلَ قَوْمَهُ عَمْرُو بْنُ عَمْرٍو"
second: "كَجَادِعِ أَنْفِهِ وَبِهِ انْتِصَارُ"
vocabulary:
  - term: "عَمْرُو بْنُ عَمْرٍو"
    text: "ابن عُدُس بن زيد بن عبد الله بن دارم، من تميم [@tabrizi-ikhtiyarat، ج3 ص1426]."
  - term: "كَجَادِعِ أَنْفِهِ"
    text: "نهاهم عن الحرب وبهم قوة، فكان كمن جدع أنفه من غير أن يُقهر [@tabrizi-ikhtiyarat، ج3 ص1426]."
