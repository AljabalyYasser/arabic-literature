first: "كَأَنَّ سَرَاتَهُ وَالخَيْلُ شُعْثٌ"
second: "غَدَاةَ وَجِيفِهَا مَسَدٌ مُغَارُ"
vocabulary:
  - term: "سَرَاتَهُ"
    text: "أعلى ظهره [@tabrizi-ikhtiyarat، ج3 ص1440]."
  - term: "مَسَدٌ مُغَارُ"
    text: "حبل محكم الفتل، شبّه ظهره في اندماجه به [@tabrizi-ikhtiyarat، ج3 ص1440]."
  - term: "وَجِيفِهَا"
    text: "سيرها السريع."
