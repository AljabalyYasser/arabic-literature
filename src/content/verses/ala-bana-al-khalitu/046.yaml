first: "نَسُوفٍ لِلْحِزَامِ بِمِرْفَقَيْهَا"
second: "يَسُدُّ خَوَاءَ طُبْيَيْهَا الغُبَارُ"
vocabulary:
  - term: "نَسُوفٍ لِلْحِزَامِ بِمِرْفَقَيْهَا"
    text: "تنسف الحزام وتقطعه بمرفقيها لأنهما يموران من سرعة الجري [@tabrizi-ikhtiyarat، ج3 ص1436]."
  - term: "خَوَاءَ طُبْيَيْهَا"
    text: "الخواء: ما انفرج منها، والأطباء لذوات الحافر كالأخلاف لذوات الخف، أي يملأ ما بين قوائمها غبارها، كناية عن شدة العدو [@tabrizi-ikhtiyarat، ج3 ص1436]."
