first: "وَخِنْذِيذٍ تَرَى الغُرْمُولَ مِنْهُ"
second: "كَطَيِّ الزِّقِّ عَلَّقَهُ التِّجَارُ"
meaning: "ومن خيلنا فحل ضخم، ترى ذكره من شدة التعب والجري مسترخيًا مطويًّا، كأنه زقّ خمر فارغ مطويّ علّقه التجار."
vocabulary:
  - term: "خِنْذِيذٍ"
    text: "الفحل من الخيل، وهو من الأضداد: «والخنْذيذُ: الْفَحْلُ؛ قَالَ بِشْرٌ: وخِنْذيذٍ تَرَى الغُرْمُولَ مِنْهُ ... كَطَيِّ الزِّقِّ عَلَّقهُ التِّجارُ، وَالْخِنْذِيذُ: الخصيُّ أَيضاً، وَهُوَ مِنَ الأَضداد» [@lisan، ج3 ص489]. ويذكر التِّبْرِيزِيّ عن ابن الأعرابي أن الخنذيذ الضخم الشديد [@tabrizi-ikhtiyarat، ج3 ص1438]."
  - term: "الغُرْمُولَ"
    text: "الذكر: «الغُرْمُولُ: الذَّكَرُ الضَّخْمُ الرِّخْوُ، وَقَدْ قِيلَ: الذَّكَرُ مُطْلَقًا» [@lisan، ج11 ص491]. وفي شرح التِّبْرِيزِيّ: وعاء الذكر [@tabrizi-ikhtiyarat، ج3 ص1438]."
  - term: "الزِّقِّ"
    text: "القربة من جلد يُحمل فيها الخمر أو الزيت."
  - term: "التِّجَارُ"
    text: "جمع تاجر، وتجّار الخمر خاصة، يعلّقون الزقاق بعد أن تفرغ."
context: "في آخر القصيدة يفخر بِشْر بأن قومه استباحوا «سنام الأرض» حين قحط المطر (42)، ويصف الخيل التي استباحوه بها: الفرس المتقدمة التي تقطع حزامها بمرفقيها (43–48)، ثم هذا الفحل، ثم سعة منخره (50). ويقول التِّبْرِيزِيّ إن الشاعر أراد أن غرموله قد استرخى وطُوي من أثر الكلال والإعياء، فطيّه كطيّ زقّ خالٍ معلّق، وإن الكلام على حذف المضاف، كأنه قال: ترى طيّ الغرمول كطيّ الزق [@tabrizi-ikhtiyarat، ج3 ص1438]."
syntax:
  - "«وخنذيذٍ» مجرور، والأقرب أنه معطوف على «مُسْنَفةٍ» في البيت 43: «بكل قياد مسنفة عنود»، والباء فيه متعلقة بـ«استبحنا» في البيت 42 كما يقول التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1434]، فالمعنى: استبحنا خير الأرض بكل فرس مسنفة وبكل فحل. ويجوز أن تكون الواو واو رُبّ: ورُبّ فحلٍ."
  - "«ترى» فعل مضارع، و«الغرمولَ» مفعول به أول، و«منه» جار ومجرور في موضع الحال، و«كطيّ الزق» في موضع المفعول الثاني إن جُعلت «ترى» علمية، أو حال إن جُعلت بصرية."
  - "جملة «علّقه التجار» نعت لـ«الزق»، لأن «الزق» معرّف بأل الجنسية فهو في معنى النكرة."
morphology:
  - "«خِنْذيذ» على «فِعْليل»، ويقول ابن سِيدَه فيما ينقله اللسان إنه «كأَنه بُنِيَ مِنْ خَنَذَ وَقَدْ أُمِيتَ فِعْلُه» [@lisan، ج3 ص489]."
  - "«غُرْمول» على «فُعْلول»، رباعي مزيد بالواو."
  - "«عَلَّقه» ماض على «فعّل»، والتضعيف للتعدية والتكثير."
  - "«التِّجار» جمع «تاجر» على «فِعال»، ويُجمع أيضًا على «تُجّار»."
rhetoric:
  thesis: "وصف صريح لعضو الفحل، يُراد به الدلالة على شدة ما لقيت الخيل من الجري والحرب: الفحل الضخم قد أعياه الكلال حتى استرخى أكثر ما فيه فحولة."
  devices:
    - title: "التشبيه"
      text: "شبّه الغرمول المسترخي المطويّ بالزقّ الفارغ المعلّق. ووجه الشبه الاسترخاء والتثنّي بعد الامتلاء: الزق كان ملآن ثم فرغ، والفحل كان قويًّا ثم أعياه الجهد."
    - title: "الدلالة بالأثر"
      text: "لم يقل إن الخيل تعبت من طول الغارة، بل أرى السامع أثر التعب في أخص أعضاء الفحل. فالصورة الجسدية الصريحة هي الحجة على شدة الحرب. وهذه قراءتنا."
    - title: "اللفظ الصريح"
      text: "استعمل الشاعر لفظ «الغرمول» بلا كناية، كما يستعمل الجاهليون أسماء الأعضاء في وصف الخيل والإبل. ولم يتحرج الشُّرّاح من شرحه، فاستشهد به صاحب اللسان على معنى «الخنذيذ» [@lisan، ج3 ص489]."
  connection: "ثم يصف حفيف منخره إذا كتم الخيلُ الربوَ بكِير الحداد المستعار."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المضمومة، مردوفة بالألف"
  scansion: "وَخِنْذِيذِنْ / تَرَلْ غُرْمُو / لَمِنْهُو = مفاعلْتن / مفاعلْتن / فعولن — كَطَيْيِزْزِقْ / قِعَلْلَقَهُتْ / تِجَارُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن»، والعصب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، في التفعيلتين الأوليين من الصدر وأولى العجز. وتُشبع ضمة الهاء في «منهُ» فتصير «منهو» لتمام «فعولن»."
