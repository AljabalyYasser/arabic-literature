explained: false
first: "أُرَاقِبُ فِي السَّمَاءِ بَنَاتِ نَعْشٍ"
second: "وَقَدْ دَارَتْ كَمَا عُطِفَ الصُّوَارُ"
vocabulary:
  - term: "بَنَاتِ نَعْشٍ"
    text: "نجوم في الشمال لا تغيب، تدور حتى يذهب الصبح بضوئها [@tabrizi-ikhtiyarat، ج3 ص1421]."
  - term: "الصُّوَارُ"
    text: "جماعة البقر، و«عُطف» أنه رأى شيئًا ففزع منه فراغ عنه [@tabrizi-ikhtiyarat، ج3 ص1421]."
