first: "كَأَنَّ حَفِيفَ مِنْخَرِهِ إِذَا مَا"
second: "كَتَمْنَ الرَّبْوَ كِيرٌ مُسْتَعَارُ"
vocabulary:
  - term: "حَفِيفَ مِنْخَرِهِ"
    text: "وصفه بسعة المنخر، والرَّبْو: البُهر، شبّه حفيف منخره بكِير حدّاد مستعجل [@tabrizi-ikhtiyarat، ج3 ص1439]."
  - term: "مُسْتَعَارُ"
    text: "جعله مستعارًا تنبيهًا على أنه مستحثّ مطالب بردّه، فهو يُنفخ بأشدّ النفخ [@tabrizi-ikhtiyarat، ج3 ص1439]."
