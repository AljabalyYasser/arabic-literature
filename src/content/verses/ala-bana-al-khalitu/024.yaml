first: "وَشَبَّتْ طَيِّئُ الجَبَلَيْنِ حَرْبًا"
second: "تَهِرُّ لِشَجْوِهَا مِنْهَا صُحَارُ"
vocabulary:
  - term: "طَيِّئُ الجَبَلَيْنِ"
    text: "طيئ صاحبة أجأ وسلمى."
  - term: "تَهِرُّ"
    text: "تصوّت وتكرّه [@tabrizi-ikhtiyarat، ج3 ص1424]."
  - term: "صُحَارُ"
    text: "قال أبو عمرو: صُحار منزل الأمراء بعُمان، وأراد البعد، أي يفزع من هذه الحرب البعيد منها [@tabrizi-ikhtiyarat، ج3 ص1424]."
