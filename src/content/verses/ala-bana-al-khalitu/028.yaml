    text: "يعرضون المصالحة [@tabrizi-ikhtiyarat، ج3 ص1427]."
  - term: "سَلَعٌ وَقَارُ"
    text: "ضربان من الشجر المرّ، وقال الأصمعي: ما فيها لهم سَلَع، أي مرعى خبيث الطعم [@tabrizi-ikhtiyarat، ج3 ص1427]."
