first: "غَذَاهَا قَارِصٌ يَجْرِي عَلَيْهَا"
second: "وَمَحْضٌ حِينَ تُبْتَعَثُ العِشَارُ"
vocabulary:
  - term: "قَارِصٌ"
    text: "من اللبن: الذي قد أخذ فيه الطعم [@tabrizi-ikhtiyarat، ج3 ص1419]."
  - term: "مَحْضٌ"
    text: "اللبن حين حُلب وذهبت رغوته [@tabrizi-ikhtiyarat، ج3 ص1419]."
  - term: "العِشَارُ"
    text: "جمع عُشَراء، الناقة أتى عليها عشرة أشهر من حملها [@tabrizi-ikhtiyarat، ج3 ص1419–1420]."
