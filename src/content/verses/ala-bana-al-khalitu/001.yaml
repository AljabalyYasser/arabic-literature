first: "أَلَا بَانَ الخَلِيطُ وَلَمْ يُزَارُوا"
second: "وَقَلْبُكَ فِي الظَّعَائِنِ مُسْتَعَارُ"
meaning: "ألا إن الجيران الذين خالطناهم قد رحلوا ولم نزرهم قبل رحيلهم، وقلبك ذاهب مع نسائهم في الهوادج، كأنه عارية عندهن لا تملكه."
vocabulary:
  - term: "بَانَ"
    text: "فارق وبعُد، والبَيْن: الفراق."
  - term: "الخَلِيطُ"
    text: "القوم المخالطون في الدار والمرعى. ويقول التِّبْرِيزِيّ إنه يكون واحدًا وجمعًا، وأراد به هنا الجنس، ولذلك قال «لم يزاروا» بضمير الجمع [@tabrizi-ikhtiyarat، ج3 ص1415]."
  - term: "الظَّعَائِنِ"
    text: "جمع ظعينة، وهي المرأة في الهودج على البعير الراحل."
  - term: "مُسْتَعَارُ"
    text: "كأنه عارية: أُخذ منك فهو عند غيرك. ويذكر محقق شرح التِّبْرِيزِيّ أن في الأصل «مستطار»، أي طائر ذاهب، ثم استدرك التِّبْرِيزِيّ «مستعار» [@tabrizi-ikhtiyarat، ج3 ص1414]."
context: "مطلع القصيدة 98، وهي في الفخر بقومه بني أسد، وفي خيلهم وحروبهم. يبدأها بالرحيل، ثم يصف الظعائن ومسيرهن إلى مياه نخل، ثم يذكر أيامه مع النساء (19–21)، ثم ينتقل إلى قومه حين صار الناس أعداء، ويختم بصفة الخيل وبحكمة «ولا ينجي من الغمرات». ويقول محقق الشرح إن ابن الأَنْبارِيّ لم يرو ستة من أبياتها، وإن «الاختيارين» والديوان يخالفانها في أبيات [@tabrizi-ikhtiyarat، ج3 ص1414]."
syntax:
  - "«ألا» حرف استفتاح وتنبيه، و«بان» فعل ماض، و«الخليطُ» فاعل."
  - "«ولم يُزاروا» جملة حالية أو معطوفة، و«لم» حرف جزم، و«يُزاروا» مضارع مبني للمجهول مجزوم بحذف النون، والواو نائب فاعل يعود على الخليط بمعنى الجمع."
  - "الواو في «وقلبُك» واو الحال، و«قلبُك» مبتدأ، و«مستعارُ» خبره، و«في الظعائن» متعلق بـ«مستعار»."
morphology:
  - "«الخليط» على «فعيل» بمعنى «مفاعِل»، أي المخالط."
  - "«يُزاروا» مضارع مبني للمجهول من «زار يزور» أجوف واوي، أصله «يُزْوَرون»، نُقلت فتحة الواو إلى الزاي فقُلبت الواو ألفًا، وحُذفت النون للجزم."
  - "«الظعائن» جمع «ظعينة» على «فعائل»، من ظعن: سار وارتحل."
  - "«مستعار» اسم مفعول من «استعار» على «استفعل»، من العارية."
rhetoric:
  thesis: "مطلع بالرحيل: الجيران مضوا دون وداع، وقلب الشاعر مضى معهم دون إذن. فالفراق مزدوج: فراق الناس، وفراق القلب لصاحبه."
  devices:
    - title: "الاستعارة في «مستعار»"
      text: "جعل القلب عارية عند الظعائن: هو له في الأصل، لكنه في يد غيره الآن. والعارية تُردّ، ففي اللفظ أمل خفيّ بالرجوع. ورواية «مستطار» تجعل القلب طائرًا ذاهبًا بلا رجعة. وهذه قراءتنا."
    - title: "الالتفات"
      text: "يبدأ بالخبر العام «بان الخليط»، ثم يلتفت إلى المخاطب «وقلبك»، وهو يخاطب نفسه. وهذا من عادة المطالع الجاهلية: الشاعر يحادث نفسه بضمير المخاطب."
    - title: "التصريع"
      text: "ختم الصدر بـ«يُزاروا» على قافية العجز «مستعارُ»."
  connection: "ثم يصف الحداة يقصدون بالظعائن مياه نخل، مائلين عن أبانين."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المضمومة، مردوفة بالألف، فهي رائية"
  scansion: "أَلَا بَانَلْ / خَلِيطُوَلَمْ / يُزَارُو = مفاعلْتن / مفاعلتن / فعولن — وَقَلْبُكَفِظْ / ظَعَائِنِمُسْ / تَعَارُو = مفاعلتن / مفاعلتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن»، والعروض والضرب «فعولن» بالقطف [@atiq، ص54]، والعصب في أول الصدر. والبيت مصرّع."
