first: "وَجَدْنَا فِي كِتَابِ بَنِي تَمِيمٍ"
second: "أَحَقُّ الخَيْلِ بِالرَّكْضِ المُعَارُ"
meaning: "وجدنا مكتوبًا في كتاب بني تميم: أولى الخيل بأن يُركض ويُجهد هو الفرس المُعار، لأن راكبه لا يشفق عليه."
vocabulary:
  - term: "كِتَابِ بَنِي تَمِيمٍ"
    text: "حكمة مأثورة عندهم، كأنها مكتوبة في كتاب. وتميم أعداء بني أسد في يوم النسار."
  - term: "الرَّكْضِ"
    text: "حثّ الفرس على العدو، وأصله ضرب جنبيه بالرجل."
  - term: "المُعَارُ"
    text: "اختلفوا فيه: «المُعَار من العارية، والمعنى لا شَفَقَة لك على العارية، لآنها ليست لك»، وقال آخرون: «المُعَار المُسَمَّنُ»، وكان أبو سعيد الضرير يرويه «المُغار» أي المضمّر، وقال أبو عبيدة: «مَنْ جعل المعار من العارية فقد أخطأ» [@maydani، ج1 ص203–204]. وفي شرح التِّبْرِيزِيّ: يعني السمين، كأنه أُعير سِمَنًا [@tabrizi-ikhtiyarat، ج3 ص1439]."
context: "عجز هذا البيت من أمثال العرب، أورده المَيْدانيّ: «أحَقُّ الخَيْلِ بالرَّكْضِ المُعَارُ»، واحتج من قال إنه من العارية بالبيت الذي قبله «كأن حفيف منخره ... كير مستعار»، لأن الكِير إذا كان عارية «كان أشدَّ لكده» [@maydani، ج1 ص203]. لكن نسبة البيت إلى بِشْر مختلف فيها، فقد احتجّ بعضهم «بأن أبا عُبَيدة كان يَزْعُم» أن البيت ليس لبِشْر، «وإنما هو للطِّرِمَّاح» [@maydani، ج1 ص203–204]. ويذكر محقق شرح التِّبْرِيزِيّ أن البيت لم يُرو في المَرْزُوقِيّ و«الاختيارين» والديوان، وأن ابن الأَنْبارِيّ نقل قول أبي عبيدة إنه للطرماح [@tabrizi-ikhtiyarat، ج3 ص1439]."
syntax:
  - "«وجدنا» فعل وفاعل، و«في كتاب» متعلق به، و«بني تميم» مضاف إليه مجرور بالياء لأنه ملحق بجمع المذكر السالم."
  - "جملة «أحقُّ الخيل بالركض المعارُ» في محل نصب مفعول به لـ«وجدنا»، على الحكاية، أي وجدنا هذا القول."
  - "«أحقُّ» خبر مقدم، مضاف إلى «الخيل»، و«بالركض» متعلق بـ«أحق»، و«المعارُ» مبتدأ مؤخر. ويجوز أن يكون «أحقُّ» مبتدأ و«المعارُ» خبره."
morphology:
  - "«أحقّ» اسم تفضيل على «أفعل» من حقّ يحِقّ."
  - "«المُعار» اسم مفعول من «أعار» على «أفعل»، أجوف، وأصله «مُعْيَر» أو «مُعْوَر» على اختلافهم في أصله: من العارية، أو من «عار الفرس يعير» إذا انفلت، أو من «أعار الفرس» إذا سمّنه."
  - "«الركض» مصدر «ركض يركض»."
rhetoric:
  thesis: "بيت جرى نصفه مثلًا: من لا يملك الشيء لا يبالي بإتعابه. وفي نسبة الحكمة إلى «كتاب بني تميم» سخرية خفية بالعدو أو استشهاد بحكمته، على اختلاف القراءة."
  devices:
    - title: "التضمين بالمثل"
      text: "جاء العجز تامّ المعنى، يصلح أن يُقال في غير موضعه، ولذلك أخذه المَيْدانيّ مثلًا. وانظر مفهوم [المثل](/concepts/al-mathal/)."
    - title: "الإسناد إلى كتاب"
      text: "لم يقل «نقول» بل «وجدنا في كتاب بني تميم»، فجعل الحكمة مأثورة مكتوبة، أقدم من الشاعر. والعرب لم تكن أمة كتاب، فالكتاب هنا كناية عن الحكمة الثابتة المتوارثة. وهذه قراءتنا."
    - title: "الاختلاف في المعنى"
      text: "إذا كان المعار من العارية، فالبيت حكمة في قلة الشفقة على ما ليس لك. وإذا كان المسمّن، فالمعنى أن الفرس الذي سُمّن أقدر على الجري فهو أحق بالركض. والقراءتان قائمتان عند الشُّرّاح [@maydani، ج1 ص203–204]."
  connection: "ثم يرجع إلى صفة الفرس الأول: «يضمّر بالأصائل فهو نهد، أقبّ مقلّص فيه اقورار»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المضمومة، مردوفة بالألف"
  scansion: "وَجَدْنَا فِي / كِتَابِ بَنِي / تَمِيمِنْ = مفاعلْتن / مفاعلتن / فعولن — أَحَقْقُلْ خَيْ / لِبِرْرَكْضِلْ / مُعَارُو = مفاعلْتن / مفاعلْتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن»، والعصب «تسكين الحرف الخامس» [@atiq، ص54] في أول الصدر وفي تفعيلتي العجز الأوليين."
