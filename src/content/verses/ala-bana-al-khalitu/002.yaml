first: "تَؤُمُّ بِهَا الحُدَاةُ مِيَاهَ نَخْلٍ"
second: "وَفِيهَا عَنْ أَبَانَيْنِ ازْوِرَارُ"
vocabulary:
  - term: "تَؤُمُّ"
    text: "تقصد."
  - term: "نَخْلٍ"
    text: "موضع بنجد."
  - term: "أَبَانَيْنِ"
    text: "جبلان، أبان الأسود وأبان الأحمر، وهو معرفة وإن كان مثنى [@tabrizi-ikhtiyarat، ج3 ص1416]."
  - term: "ازْوِرَارُ"
    text: "ميل وانحراف."
