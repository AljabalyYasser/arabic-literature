first: "كَأَنِّي بَيْنَ خَافِيَتَيْ عُقَابٍ"
second: "تُقَلِّبُنِي إِذَا ابْتَلَّ العِذَارُ"
vocabulary:
  - term: "خَافِيَتَيْ عُقَابٍ"
    text: "الخوافي: ريشات صغار تحت القوادم في جناح الطائر."
  - term: "العِذَارُ"
    text: "ما سال على خدّ الفرس من اللجام، وابتلاله بالعرق."
