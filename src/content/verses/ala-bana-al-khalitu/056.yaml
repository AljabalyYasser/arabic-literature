first: "وَلَا يُنْجِي مِنَ الغَمَرَاتِ إِلَّا"
second: "بَرَاكَاءُ القِتَالِ أَوِ الفِرَارُ"
meaning: "لا يخلّص المرء من شدائد الحرب إلا أحد أمرين: أن يثبت في القتال ويصبر عليه، أو أن يفرّ."
vocabulary:
  - term: "الغَمَرَاتِ"
    text: "الشدائد [@tabrizi-ikhtiyarat، ج3 ص1442]، جمع غَمْرة، وأصلها الماء الكثير يغمر من يقع فيه."
  - term: "بَرَاكَاءُ"
    text: "«والبَراكاءُ: الثَّبات فِي الْحَرْبِ والجِدّ، وَأَصْلُهُ مِنَ البُروك» [@lisan، ج10 ص398]، أي أن يبرك المقاتل في موضعه كما يبرك البعير فلا يتحول. ويرويها ابن الأَنْبارِيّ والديوان «بُراكاء» بالضم [@tabrizi-ikhtiyarat، ج3 ص1442]."
context: "آخر بيت في القصيدة. بعد أن وصف الخيل وقال إنه محتاج إلى فرسه «إذا ما القوم ولوا أو أغاروا» (55)، يختم بهذه الحكمة. ويقول المَرْزُوقِيّ فيما ينقله التِّبْرِيزِيّ: «وهذه تجري مجرى الأمثال» [@tabrizi-ikhtiyarat، ج3 ص1442]. واستشهد به صاحب اللسان على معنى البراكاء [@lisan، ج10 ص398]، ويستشهد به شُرّاح الخنساء في معنى بيتها «تهين النفوس وهون النفوس» في [ألا ما لعينك](/texts/ala-ma-li-aynik/)."
syntax:
  - "«لا» نافية، و«يُنجي» مضارع مرفوع بضمة مقدرة، و«من الغمرات» متعلق به."
  - "«إلّا» أداة حصر، والاستثناء مفرّغ، و«براكاءُ» فاعل «يُنجي» مرفوع، مضاف إلى «القتال»."
  - "«أو الفرارُ» «أو» حرف عطف للتخيير والتقسيم، و«الفرارُ» معطوف على «براكاءُ» مرفوع."
  - "الحصر بـ«لا ... إلا» يقصر النجاة على هذين الطريقين دون غيرهما."
morphology:
  - "«يُنجي» مضارع «أنجى» على «أفعل»، من نجا، والهمزة للتعدية."
  - "«الغمرات» جمع «غَمْرة» على «فَعَلات»، بفتح العين إتباعًا لفاء الاسم."
  - "«براكاء» مصدر على «فَعالاء»، وهو بناء قليل، من «برك»، ويقول التِّبْرِيزِيّ إنه «فعالاء» من البروك، وهو الثبات [@tabrizi-ikhtiyarat، ج3 ص1442]."
  - "«الفرار» مصدر «فرّ يفرّ» على «فِعال»."
rhetoric:
  thesis: "خاتمة القصيدة بحكمة الفارس المجرّب: في الحرب لا ينجي التردد ولا الوقوف بين بين، فإما أن تثبت حتى تنجلي، وإما أن تنجو بالفرار. وصدق الحكمة أنها لا تستحي من ذكر الفرار."
  devices:
    - title: "القصر"
      text: "النفي والاستثناء «لا يُنجي ... إلا» يحصر طرق النجاة في اثنين، فيصير البيت قاعدة عامة تصلح لكل شدة، لا للحرب وحدها. ولهذا جرى مجرى الأمثال."
    - title: "التقسيم"
      text: "قسّم النجاة إلى ضدّين: الثبات «براكاء القتال» والهرب «الفرار». والجمع بين الضدين في حكم واحد هو ما يمنح البيت قوته: كلاهما ينجي، والهلاك في ما بينهما. وهذه قراءتنا."
    - title: "الاستعارة في «الغمرات»"
      text: "الغمرة الماء الذي يغمر الإنسان فيغرقه، فجعل شدائد الحرب ماءً يُغرق من دخله، والنجاة منه خروج من الغرق."
    - title: "الاستعارة في «براكاء»"
      text: "البروك للإبل، فشبّه ثبات المقاتل في موضعه ببروك البعير الذي لا يقوم. والصورة من حياة البادية، تجعل الشجاعة صلابة جسدية لا حماسة."
  connection: "به تنتهي القصيدة."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المضمومة، مردوفة بالألف"
  scansion: "وَلَا يُنْجِي / مِنَلْ غَمَرَا / تِإِلْلَا = مفاعلْتن / مفاعلتن / فعولن — بَرَاكَاءُلْ / قِتَالِأَوِلْ / فِرَارُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن»، والعصب «تسكين الحرف الخامس» [@atiq، ص54] في أول الشطرين."
