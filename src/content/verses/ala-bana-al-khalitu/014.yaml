first: "فَبِتُّ مُسَهَّدًا أَرِقًا كَأَنِّي"
second: "تَمَشَّتْ فِي مَفَاصِلِيَ العُقَارُ"
vocabulary:
  - term: "مُسَهَّدًا أَرِقًا"
    text: "المسهَّد: الممنوع النوم، والأرِق: الذي لا يكاد ينام [@tabrizi-ikhtiyarat، ج3 ص1420]."
  - term: "العُقَارُ"
    text: "الخمر، قال الأصمعي: من عاقرت الدنّ إذا لازمته، ويقال: هي التي بقي منها في عُقر الدن شيء [@tabrizi-ikhtiyarat، ج3 ص1421]."
