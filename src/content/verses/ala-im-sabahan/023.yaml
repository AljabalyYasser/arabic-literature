first: "حَلَفْتُ لَهَا بِاللَّهِ حَلْفَةَ فَاجِرٍ"
second: "لَنَامُوا فَمَا إِنْ مِنْ حَدِيثٍ وَلَا صَالِي"
meaning: "وحلفت لها بالله يمينًا كاذبة إنهم قد ناموا، فلم يبق أحد يتحدث، ولا أحد يصطلي عند النار. فهو يكذب عليها ليطمئنها، فتسلم له نفسها. والفاجر هنا الكاذب: «وفَجَر إِذا كَذَبَ، وأَصله الْمَيْلُ» [@lisan، ج5 ص47]، والصالي «المصطلي بالنار» [@suyuti-mughni، ج1 ص343]. فالشاعر يعترف بأنه حلف كاذبًا، ولا يخجل من ذلك، لأن غايته الوصول إليها."
vocabulary:
  - term: "حَلْفَةَ فَاجِرٍ"
    text: "يمين رجل كاذب: «وفَجَر إِذا كَذَبَ» [@lisan، ج5 ص47]. وفي اللسان أن «حَلْفة» الواحدة من الحَلِف، وأنشد البيت [@lisan، ج9 ص53]."
  - term: "لَنَامُوا"
    text: "لقد ناموا، والضمير للسُّمّار والناس الذين ذكرتهم في البيت 21."
  - term: "صَالِي"
    text: "«المصطلي بالنار» [@suyuti-mughni، ج1 ص343]، أي المستدفئ بها."
syntax:
  - "«حَلْفَةَ فَاجِرٍ»: مفعول مطلق مبيّن للنوع، منصوب، مضاف إلى «فاجر»."
  - "«لَنَامُوا»: جواب القسم، واللام واقعة في جوابه، والفعل ماض متصرف مثبت جاء بغير «قد»، والأكثر في مثله: لقد ناموا."
  - "«فَمَا إِنْ مِنْ حَدِيثٍ وَلَا صَالِي»: «ما» نافية، و«إنْ» زائدة لتوكيد النفي، و«من» زائدة، و«حديثٍ» مبتدأ مجرور لفظًا مرفوع محلًّا، وخبره محذوف، أي: فما حديثٌ هناك. و«وَلَا صَالِي» معطوف عليه."
morphology:
  - "«حَلْفَة» على «فَعْلة» للمرة من «حَلَفَ»."
  - "«فَاجِر» اسم فاعل من «فَجَرَ»، وأصل الفجور الميل عن الحق، كما في اللسان [@lisan، ج5 ص47]."
  - "«صَالٍ» اسم فاعل من «صَلِيَ» ناقص يائي، وثبتت ياؤه هنا للقافية، فهو «صالي»."
rhetoric:
  thesis: "بعد القسم الصادق على البقاء (22) يأتي القسم الكاذب على نوم الناس. فيمينان في بيتين: واحدة يتحدّى بها، وواحدة يخدع بها. والشاعر يسمّي الثانية «حَلْفَةَ فَاجِرٍ» بنفسه، فيفاخر بكذبه."
  devices:
    - title: "الاعتراف بالكذب"
      text: "«حَلْفَةَ فَاجِرٍ» وصف لليمين من قائلها، فهو يخبر السامع بأنه كذب عليها، وهي لا تعلم. والسامع يرى ما لا تراه المرأة، وهذا يجعل البيت ساخرًا من خوفها. وهذه قراءتنا."
    - title: "النفي المؤكَّد"
      text: "«فَمَا إِنْ مِنْ حَدِيثٍ»: ثلاثة حروف تؤكد النفي: «ما» و«إنْ» الزائدة و«من» الزائدة. فهو يبالغ في النفي لأنه كاذب، والكاذب يكثر التوكيد."
    - title: "الكناية في «وَلَا صَالِي»"
      text: "ذكر الذي يصطلي بالنار، ومن يصطلي ليلًا يكون ساهرًا، فنفيه نفي للسهر كله. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يلين الحديث: «فَلَمَّا تَنَازَعْنَا الْحَدِيثَ وَأَسْمَحَتْ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "حَلَفْتُ / لَهَا بِلْلَا / هِ حَلْفَ / ةَ فَاجِرِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — لَنَامُو / فَمَا إِنْ مِنْ / حَدِيثِنْ / وَلَا صَالِي = فعولن / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة من الصدر [@atiq، ص29]. و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "من الأبيات 20–26 التي أوردها ابن قُتَيْبة شاهدًا على «تصريحه بالزنا والدّبيب إلى حرم الناس» [@ibn-qutayba، ج1 ص135–136]، وفي روايته «وما إن من حديث» بالواو. وفي حاشية محققه أحمد شاكر: «الصالى: المستدفئ بالنار» [@ibn-qutayba، ج1 ص136، الحاشية]. وفي رواية السُّيُوطيّ يأتي هذا البيت بعد البيتين 24–25 [@suyuti-mughni، ج1 ص341]."
