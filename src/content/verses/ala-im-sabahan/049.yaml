explained: false
first: كَأَنِّي بِفَتْخَاءِ الْجَنَاحَيْنِ لَقْوَةٍ
second: صَيُودٍ مِنَ الْعِقْبَانِ طَأْطَأْتُ شِمْلَالِي
vocabulary:
- term: فَتْخَاءِ الْجَنَاحَيْنِ
  text: «لينة الجناحين» [@suyuti-mughni، ج1 ص343].
- term: لَقْوَةٍ
  text: العُقاب [@suyuti-mughni، ج1 ص343].
- term: طَأْطَأْتُ
  text: «حرّكت واحتثثت» [@lisan، ج11 ص371].
- term: شِمْلَالِي
  text: 'يدي الشمال عند أبي عَمْرو، «والشِّمال والشِّمْلال واحد» [@lisan، ج11 ص371]؛ وقيل: فرسي السريعة، من «ناقة شملال» أي سريعة [@suyuti-mughni، ج1 ص343].'
