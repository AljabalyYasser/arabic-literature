first: وَلَيْسَ بِذِي رُمْحٍ فَيَطْعَنَنِي بِهِ
second: وَلَيْسَ بِذِي سَيْفٍ وَلَيْسَ بِنَبَّالِ
vocabulary:
- term: بِذِي رُمْحٍ
  text: «أي بفارس» [@suyuti-mughni، ج1 ص343].
- term: نَبَّالِ
  text: '«الرامي بالنبل»، وقال الرِّياشيّ: النبّال «هو الذي يعمل النبل أو يبيعها، والذي يرمي بها يقال له نابل» [@suyuti-mughni، ج1 ص343].'
