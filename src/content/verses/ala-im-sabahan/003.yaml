first: وَهَلْ يَعِمَنْ مَنْ كَانَ أَحْدَثُ عَهْدِهِ
second: ثَلَاثِينَ شَهْرًا فِي ثَلَاثَةِ أَحْوَالِ
vocabulary:
- term: أَحْدَثُ عَهْدِهِ
  text: 'أقرب عهده بالنعيم: «كيف ينعم من كان أقرب عهده بالرفاهية ثلاثين شهرًا» [@khizana، ج1 ص62].'
- term: أَحْوَالِ
  text: 'جمع حَوْل، وهو السنة؛ وجعلها ابن السِّيد جمع حال: اختلاف الرياح على الطلل، وملازمة الأمطار له، والقِدَم [@khizana، ج1 ص62].'
