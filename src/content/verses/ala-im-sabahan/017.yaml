explained: false
first: لَطِيفَةُ طَيِّ الْكَشْحِ غَيْرُ مُفَاضَةٍ
second: إِذَا انْفَتَلَتْ مُرْتَجَّةً غَيْرَ مِتْفَالِ
vocabulary:
- term: طَيِّ الْكَشْحِ
  text: 'الكشح: «ما بين الخاصرة إلى الضلع الخلف»، وطيّه: جَدْله، أي هي ضامرة الخصر [@khizana، ج1 ص67].'
- term: مُفَاضَةٍ
  text: «الضخمة البطن» [@khizana، ج1 ص67].
- term: مُرْتَجَّةً
  text: يرتجّ كفلها ويضطرب لعظمه إذا انصرفت [@khizana، ج1 ص67].
- term: مِتْفَالِ
  text: التي لا تتطيّب فتتغيّر ريحها [@lisan، ج11 ص77].
