first: "لَطِيفَةُ طَيِّ الْكَشْحِ غَيْرُ مُفَاضَةٍ"
second: "إِذَا انْفَتَلَتْ مُرْتَجَّةً غَيْرَ مِتْفَالِ"
meaning: "يتمّ صفة صاحبته العارية في الفراش: نحيلة الخصر، ليست ضخمة البطن، إذا تقلّبت على جنبها ارتجّت عجيزتها لعظمها، وهي طيبة الرائحة لا تفوح منها رائحة كريهة. قال البَغْداديّ: «يُرِيد أَنَّهَا مجدولة الكشح جدلا لطيفا فَإِن هيف الكشح والخصر ممدوح والمفاضة من النِّسَاء الضخمة الْبَطن وَهَذَا ذمّ فِيهِنَّ»، وفي «مرتجة»: «أَرَادَ عظم كفلها»، ثم: «وصفهَا بِثَلَاثَة أُمُور بهضم الخصر وضخامة الكفل وَالطّيب» [@khizana، ج1 ص67]. والكَفَل العجيزة، والكشح الخاصرة."
vocabulary:
  - term: "طَيِّ الْكَشْحِ"
    text: "الكشح «مَا بَين الخاصرة إِلَى الضلع الْخلف وطي الكشح هُنَا جدلها وفتلها» [@khizana، ج1 ص67]، أي هي ضامرة الخصر كأنه مفتول."
  - term: "مُفَاضَةٍ"
    text: "«الضخمة الْبَطن» [@khizana، ج1 ص67]."
  - term: "انْفَتَلَتْ"
    text: "انصرفت وتقلّبت: «وانفتلت انصرفت» [@khizana، ج1 ص67]."
  - term: "مُرْتَجَّةً"
    text: "مضطربة الكفل: «ومرتجة من الارتجاج وَهُوَ التحرك وَالِاضْطِرَاب أَرَادَ عظم كفلها» [@khizana، ج1 ص67]."
  - term: "مِتْفَالِ"
    text: "التي لا تتطيّب فتتغيّر رائحتها: «وَامْرَأَة متفال إِذا كَانَت كَذَلِك» [@khizana، ج1 ص67]، أي تاركة للطيب."
syntax:
  - "«لَطِيفَةُ طَيِّ الْكَشْحِ»: خبر لمبتدأ محذوف، أي: هي لطيفةُ طيِّ الكشح، والجملة صفة أخرى للمرأة المجرورة بـ«رُبّ» في البيت 14. و«غَيْرُ مُفَاضَةٍ» خبر ثانٍ."
  - "«إِذَا انْفَتَلَتْ مُرْتَجَّةً»: «مرتجةً» خبر لـ«تكون» محذوفة كما قال البَغْداديّ: «وَهِي خبر تكون محذوفة» [@khizana، ج1 ص67]، والتقدير: إذا انفتلت تكون مرتجةً. و«غَيْرَ مِتْفَالِ» خبر ثانٍ أو حال."
morphology:
  - "«مُفَاضَة» اسم مفعول من «أَفاضَ» على «أَفْعَلَ»، من الفيض، كما يقول البَغْداديّ: «وهما من الْفَيْض» [@khizana، ج1 ص67]."
  - "«انْفَتَلَ» على «انْفَعَلَ» للمطاوعة من «فَتَلَ»، و«مُرْتَجّ» اسم فاعل من «ارْتَجَّ» على «افْتَعَلَ»."
  - "«مِتْفَال» على «مِفْعال» من «تَفِلَ» إذا ترك الطيب، وهو من أبنية المبالغة."
rhetoric:
  thesis: "آخر صفات المرأة في الخلوة (14–17): خصر نحيل، وعجيزة ضخمة ترتجّ، وريح طيبة. وهي الصفات الثلاث التي عدّها البَغْداديّ، وفيها ما يُرى وما يُلمس وما يُشمّ."
  devices:
    - title: "إثبات الصفة ونفي ضدّها"
      text: "«لَطِيفَةُ طَيِّ الْكَشْحِ غَيْرُ مُفَاضَةٍ»: أثبت لطف الخصر ثم نفى ضخامة البطن، و«مُرْتَجَّةً غَيْرَ مِتْفَالِ»: أثبت امتلاء الكفل ثم نفى الرائحة الكريهة. فكل إثبات يتبعه نفي ما يُخشى معه، وهذا من الاحتراس، وهو أن يُزاد في الكلام ما يدفع عنه وهمًا لا يريده المتكلم."
    - title: "الطباق بين الخصر والكفل"
      text: "خصر نحيل في الصدر، وكفل عظيم في العجز. والطباق الجمع بين الضدين، وهو هنا بين الدقة والضخامة في جسد واحد، وهو ما كانوا يستحسنونه في المرأة. وهذه قراءتنا."
  connection: "ثم يبدأ قصة زيارته لها ليلًا: «تَنَوَّرْتُهَا مِنْ أَذْرِعَاتَ وَأَهْلُهَا بِيَثْرِبَ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "لَطِيفَ / ةُ طَيْيِلْ كَشْ / حِ غَيْرُ / مُفَاضَتِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — إِذَنْ فَ / تَلَتْ مُرْتَجْ / جَتَنْ غَيْ / رَ مِتْفَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة من الصدر والأولى من العجز [@atiq، ص29]. و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]. وسقطت همزة الوصل في «انْفَتَلَتْ» في الدَّرْج، فاتصلت ألف «إذا» بالنون الساكنة وحُذفت لالتقاء الساكنين."
context: "يأتي عند البَغْداديّ قبل «إِذَا مَا الضَّجِيعُ ابْتَزَّهَا مِنْ ثِيَابِهَا»، لا بعده كما في نسخة العمل [@khizana، ج1 ص67]، فهو عنده صفة لها قبل التجريد. وعلى ترتيبنا يأتي بعد «كَحِقْفِ النَّقَا يَمْشِي الْوَلِيدَانِ فَوْقَهُ»، فيكمل صفة جسدها في الفراش. وأخذنا «غَيْرَ مِتْفَالِ» من رواية البَغْداديّ، ونسخة العمل «غير مثقال»، ونراها خطأ في الطبع."
variants:
  - reading: "لَطِيفَةُ طَيِّ الْكَشْحِ غَيْرُ مُفَاضَةٍ / إِذَا انْفَتَلَتْ مُرْتَجَّةً غَيْرَ مِثْقَالِ"
    status: "نسخة العمل"
    note: "[@diwan-imru-al-qais، ص136]، ونراها خطأ في الطبع، لأن «مثقال» لا تُعرف صفة للمرأة، والبَغْداديّ يشرح «متفال» [@khizana، ج1 ص67]."
