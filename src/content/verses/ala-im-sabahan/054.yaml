first: "وَمَا الْمَرْءُ مَا دَامَتْ حُشَاشَةُ نَفْسِهِ"
second: "بِمُدْرِكِ أَطْرَافِ الْخُطُوبِ وَلَا آلِي"
meaning: "ليس الإنسان، ما دامت فيه بقية من روح، ببالغٍ غايات الأمور، ولا هو مقصّر في طلبها. فهو يسعى أبدًا، ولا يبلغ كل ما يسعى إليه."
vocabulary:
  - term: "حُشَاشَةُ نَفْسِهِ"
    text: "بقية روحه ورمقها الأخير."
  - term: "أَطْرَافِ الْخُطُوبِ"
    text: "الخطوب: الأمور العظيمة، وأطرافها: غاياتها ونهاياتها."
  - term: "آلِي"
    text: "المقصّر، من «ألا يألو» إذا قصّر [@maydani، ج2 ص236]؛ أو المتوقف عما يطلبه [@diwan-imru-al-qais، ص140]."
syntax:
  - "«مَا» نافية تعمل عمل «ليس» عند الحجازيين، و«الْمَرْءُ» اسمها، و«بِمُدْرِكِ» خبرها، والباء زائدة لتوكيد النفي."
  - "«مَا دَامَتْ» «مَا» مصدرية ظرفية، و«دام» هنا تامة بمعنى بقي، و«حُشَاشَةُ» فاعلها؛ أي: مدة بقاء حشاشة نفسه."
  - "«وَلَا آلِي» معطوف على «مدرك»، و«لا» زائدة لتوكيد النفي. وأصله «آلٍ» اسم منقوص، وثبتت ياؤه في القافية."
morphology:
  - "«آلٍ» اسم فاعل من «ألا يألو»، وبه استشهد الفرّاء على أن «ائتليت» «افتعلت من ألوت إذا قصّرت» [@maydani، ج2 ص236]."
  - "«حُشَاشَةُ» على وزن «فُعالة»، وهو وزن يكثر فيما يبقى من الشيء، كالنُّخالة والقُلامة."
  - "«مُدْرِك» اسم فاعل من «أدرك»."
rhetoric:
  thesis: "خاتمة القصيدة حكمة عامة تنقل الكلام من «أنا» إلى «الْمَرْءُ»: السعي لا ينتهي ما دامت الروح، والغاية لا تُدرك كلها."
  devices:
    - title: "الحكمة الخاتمة"
      text: "ختم فخره بالمجد ببيت حكمة يجري مجرى المثل، فخرج من حاله الخاصة إلى حال الناس."
    - title: "الكناية"
      text: "«مَا دَامَتْ حُشَاشَةُ نَفْسِهِ» كناية عن مدة الحياة كلها إلى آخر رمق."
    - title: "نفيان متقابلان"
      text: "نفى عن المرء الإدراك التام، ونفى عنه التقصير معًا؛ فلا هو يبلغ كل شيء، ولا هو يكفّ عن الطلب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَمَلْ مَرْ / ءُ مَا دَامَتْ / حُشَاشَ / ةُ نَفْسِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — بِمُدْرِ / كِ أَطْرَافِلْ / خُطُوبِ / وَلَا آلِي = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "أُشبعت كسرة الهاء في «نَفْسِهِ» فصارت ياء في النطق. وجاءت «فعولن» مقبوضة ثلاث مرات، وكلاهما جائز في حشو الطويل [@atiq، ص29]."
context: "آخر القصيدة في طبعتنا [@diwan-imru-al-qais، ص140]."
