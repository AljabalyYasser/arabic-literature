first: "وَمِثْلِكِ بَيْضَاءِ الْعَوَارِضِ طَفْلَةٍ"
second: "لَعُوبٍ تُنَسِّينِي إِذَا قُمْتُ سِرْبَالِي"
meaning: "يقول لبسباسة: ورُبّ امرأة مثلكِ، بيضاء الخدين، ناعمة البدن، حسنة الدلال، كنت إذا قمت من فراشها نسيت قميصي عندها، لشدة ما شغلتني. فالبيت يفهم منه أنه كان يخلع ثيابه معها، ثم يقوم عنها ذاهلًا. قال البَغْداديّ: «الْوَاو وَاو رب وَهُوَ خطاب لبسباسة»، و«والطفلة بِفَتْح الطَّاء الناعمة الْبدن»، و«واللعوب الْحَسَنَة الدل»، و«والسربال الْقَمِيص» [@khizana، ج1 ص67]. ونقل البَغْداديّ عن ابن هشام في بيت آخر لامرئ القَيْس: «وَإِنَّمَا نسي ثَوْبه لشغل قلبه كَمَا قَالَ»، وأنشد هذا العجز [@khizana، ج1 ص373]."
vocabulary:
  - term: "الْعَوَارِضِ"
    text: "جمع عارضة، وهي صفحة الخد: «الْعَارِض والعارضة صفحة الخد» [@khizana، ج1 ص67]."
  - term: "طَفْلَةٍ"
    text: "«الناعمة الْبدن» [@khizana، ج1 ص67]."
  - term: "لَعُوبٍ"
    text: "«الْحَسَنَة الدل» [@khizana، ج1 ص67]، والدَّلال تغنّج المرأة وتمنّعها المتكلَّف."
  - term: "سِرْبَالِي"
    text: "قميصي: «والسربال الْقَمِيص» [@khizana، ج1 ص67]."
syntax:
  - "«وَمِثْلِكِ»: الواو واو رُبَّ، كما قال البَغْداديّ، و«مثلِكِ» مجرور لفظًا بـ«رُبّ» المحذوفة، مرفوع محلًّا على الابتداء، والكاف المكسورة لبسباسة. و«بيضاءِ» و«طفلةٍ» و«لعوبٍ» نعوت له."
  - "«تُنَسِّينِي إِذَا قُمْتُ سِرْبَالِي»: الجملة نعت رابع أو خبر المبتدأ، و«تُنسّي» يتعدى إلى مفعولين: الياء الأول، و«سربالي» الثاني. و«إِذَا قُمْتُ» ظرف متعلق بـ«تنسّيني» معترض بين المفعولين."
morphology:
  - "«تُنَسِّي» مضارع «نَسَّى» المضعف على «فَعَّلَ» من «نَسِيَ»، والتضعيف للتعدية: جعلني أنسى."
  - "«لَعُوب» على «فَعُول» من صيغ المبالغة، و«طَفْلَة» على «فَعْلة»."
  - "«سِرْبَال» على «فِعْلال»، وجمعه سرابيل."
rhetoric:
  thesis: "أول صفة لامرأة من صواحبه يرد بها على بسباسة، وأولها كلمة «ومثلكِ»: فهو يقيسها على بسباسة نفسها، كأنه يقول لها: نساء مثلكِ كنّ يذهلنني. ثم يصفها في الخلوة في الأبيات الثلاثة التالية."
  devices:
    - title: "الكناية في «تُنَسِّينِي ... سِرْبَالِي»"
      text: "لم يقل إنه خلع ثيابه وجامعها، بل ذكر ما يتبع ذلك: قام ونسي قميصه. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. والمراد معنيان: أنه كان عاريًا معها، وأنها شغلت قلبه حتى نسي ثوبه، وهذا الثاني ما قاله ابن هشام [@khizana، ج1 ص373]."
    - title: "التعريض ببسباسة"
      text: "«وَمِثْلِكِ» تعريض، أي كلام يُفهم منه غير ظاهره: فهو يصف امرأة أخرى، ويوحي لبسباسة أنها ليست أعزّ منها، وأن أمثالها لم يكنّ يرين فيه شيخًا. وهذه قراءتنا."
  connection: "ثم يصفها حين يجرّدها مضاجعها: «إِذَا مَا الضَّجِيعُ ابْتَزَّهَا مِنْ ثِيَابِهَا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَمِثْلِ / كِ بَيْضَاءِلْ / عَوَارِ / ضِ طَفْلَتِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — لَعُوبِنْ / تُنَسْسِينِي / إِذَا قُمْ / تُ سِرْبَالِي = فعولن / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة من الصدر [@atiq، ص29]. و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، فهي «مفاعلن». والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "أول الأبيات 14–17 في صفة امرأة في الخلوة، وقد شرحها البَغْداديّ بيتًا بيتًا وهو يشرح شاهده «تَنَوَّرْتُهَا مِنْ أَذْرِعَاتَ» [@khizana، ج1 ص66–68]. ويروي الجوهري فيما ينقله البَغْداديّ عن أبي عُبَيْدة «لعوب تناساني إِذا قُمْت سربالي»، «قَالَ وَمَعْنَاهُ تنسيني» [@khizana، ج1 ص67]."
variants:
  - reading: "وَمِثْلِكِ بَيْضَاءِ الْعَوَارِضِ طَفْلَةٍ / لَعُوبٍ تَنَاسَانِي إِذَا قُمْتُ سِرْبَالِي"
    status: "رواية أبي عُبَيْدة فيما ينقله البَغْداديّ عن الجوهري"
    note: "«تناساني» مكان «تنسّيني»، «قَالَ وَمَعْنَاهُ تنسيني» [@khizana، ج1 ص67]."
