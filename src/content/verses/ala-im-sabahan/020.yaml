first: "سَمَوْتُ إِلَيْهَا بَعْدَمَا نَامَ أَهْلُهَا"
second: "سُمُوَّ حَبَابِ الْمَاءِ حَالًا عَلَى حَالِ"
meaning: "نهضت إليها ليلًا بعد أن نام أهلها، أمضي إليها في رفق وخفاء شيئًا بعد شيء، كما تعلو فقاقيع الماء طبقة بعد طبقة. قال البَغْداديّ: «والسمو: العلو وأراد به النهوض. يقول: جئت إليها ليلا بعد ما نام أهلها» [@khizana، ج10 ص44]. والمقصود زيارة ليلية لامرأة ذات زوج في بيت أهلها، يتسلل إليها ليضاجعها، أي ليجامعها، كما تقول الأبيات التالية، وفي آخرها: «فأصبحت معشوقا، وأصبح بعلها ... عليه القتام سيّئ الظّنّ والبال» [@ibn-qutayba، ج1 ص136]. وهذا ما سمّاه ابن قُتَيْبة «تصريحه بالزنا والدّبيب إلى حرم الناس» [@ibn-qutayba، ج1 ص135]: والدبيب المشي الخفي، وحُرَم الناس نساؤهم."
vocabulary:
  - term: "سَمَوْتُ"
    text: "نهضتُ [@suyuti-mughni، ج1 ص343]."
  - term: "حَبَابِ الْمَاءِ"
    text: "«الطرائق التي في الماء كأنها الوشي» [@suyuti-mughni، ج1 ص343]."
  - term: "حَالًا عَلَى حَالِ"
    text: "شيئًا بعد شيء، في رفق."
syntax:
  - "«سَمَوْتُ» فعل وفاعل، و«إِلَيْهَا» متعلق به. و«بَعْدَمَا» ظرف زمان مضاف، و«ما» مصدرية، و«نَامَ أَهْلُهَا» صلتها، والتقدير: بعد نوم أهلها."
  - "«سُمُوَّ حَبَابِ الْمَاءِ» مفعول مطلق مبيّن للنوع منصوب، وهو من لفظ الفعل «سموت»، و«حباب» مضاف إليه، و«الماء» مضاف إليه. وفيه تشبيه محذوف الأداة، قال ابن رَشِيق: «يريد كسمو حباب الماء» [@ibn-rashiq، ج1 ص294]."
  - "«حَالًا» منصوب على الحال، وهو اسم جامد مؤوّل بمشتق: متدرّجًا، و«عَلَى حَالِ» متعلق بمحذوف صفة له. ويجوز أن يكون حالًا من «حباب الماء» أو من فاعل «سموت»، والمعنى واحد."
morphology:
  - "«سَمَوْتُ» من «سَمَا يَسْمُو» الناقص الواوي، والواو فيه ظاهرة لأنها ساكنة بعد فتح."
  - "«سُمُوّ» مصدر على «فُعُول»، أصله «سُمُووٌ» فأُدغمت الواوان."
  - "«حَبَاب» بفتح الحاء وتخفيف الباء [@suyuti-mughni، ج1 ص343]، وفي «خزانة الأدب»: «والحباب بالفتح: النفاخات التي تعلو الماء» [@khizana، ج10 ص44]."
rhetoric:
  thesis: "أول مشهد الزيارة الليلية، وأشهر بيت في القصيدة. لا يصف الشاعر المرأة ولا الخلوة، بل يصف مشيته إليها: بطيئة، خفية، متدرّجة. فالتصريح في القصة لا في اللفظ، ولهذا جعله القدماء شاهدًا على «التعهّر» مع أنه لا كلمة فاحشة فيه."
  devices:
    - title: "التشبيه بغير أداة"
      text: "«سُمُوَّ حَبَابِ الْمَاءِ»: لم يقل «كسمو حباب الماء»، بل جاء بالمشبه به مصدرًا بعد فعله. قال ابن رَشِيق: «ومنهم من يأتي بالتشبيه الواحد بغير كاف كقول امرئ القيس»، وأنشد البيت، ثم قال: «يريد كسمو حباب الماء» [@ibn-rashiq، ج1 ص294]. وقال العَسْكَرِيّ بعد أن أنشده: «فحذف حرف التشبيه» [@sinaatayn، ص249]. ويجعل ابن رَشِيق بعده قول المُنَخَّل «دافعتها فتدافعت ... مشي القطاة إلى الغدير» أبدع منه، لأن المصدر فيه من غير لفظ الفعل [@ibn-rashiq، ج1 ص294]."
    - title: "تشبيه الهيئة"
      text: "لم يشبّه نفسه بالحباب في شكله ولا لونه، بل في هيئة حركته: الحباب يعلو الماء رويدًا لا يُسمع له صوت، ويتتابع طبقة بعد طبقة. ويفرد عبد القاهر الجُرْجانيّ هذا الضرب، ويقول: «وأمَّا هيئةُ الحركة مجرَّدةً من كل وصف يكون في الجسم» [@asrar، ص182]، ثم يفصّل أنواعها. فالتشبيه هنا تشبيه حركة بحركة، وبه يصير التسلل خفيفًا لا يوقظ نائمًا."
    - title: "الكناية"
      text: "«بَعْدَمَا نَامَ أَهْلُهَا»: لم يقل إنه جاءها خفية ولا إن الزيارة محرّمة، لكن انتظاره نوم أهلها يدل على ذلك كله. فهو قيد زمني يكشف حقيقة المشهد. والكناية عند عبد القاهر أن يريد المتكلم إثبات معنى «فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود… فيومئ به إليهِ» [@dalail، ص66]."
  connection: "ثم تقول له المرأة: «سباك الله إنك فاضحي»، ألست ترى السُّمّار والناس حولي؟"
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "سَمَوْتُ / إِلَيْهَا بَعْ / دَمَا نَا / مَ أَهْلُهَا = فعولُ / مفاعيلن / فعولن / مفاعلن — سُمُوْوَ / حَبَابِلْ مَا / ءِ حَالَنْ / عَلَى حَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من الصدر والعَجُز [@atiq، ص29]. والعَرُوض مقبوضة «مفاعلن» والضرب صحيح «مفاعيلن» [@atiq، ص29–30]."
context: "ثالث شواهد ابن سَلّام على أن امرأ القَيْس ممن «ينعى على نفسه ويتعهر» [@ibn-sallam، ج1 ص41–42]، ويرويه عنه المَرْزُبانيّ بإسناده [@muwashshah، ص150]، وينقله ابن قُتَيْبة عن الجُمَحِيّ، أي ابن سَلّام [@ibn-qutayba، ج1 ص111]. ثم يورده ابن قُتَيْبة في موضع آخر أول سبعة أبيات من القصيدة شاهدًا على قوله: «ويعاب عليه تصريحه بالزنا والدّبيب إلى حرم الناس. والشعراء تتوقّى ذلك فى الشعر وإن فعلته» [@ibn-qutayba، ج1 ص135–136]. وفي اللسان أن شَمِرًا أنشد عجزه في «الحباب»، وفيه عن الأَصْمَعِيّ: «حَبابُ الْمَاءِ الطَّرائقُ الَّتِي فِي الْمَاءِ، كأَنَّها الوَشْيُ» [@lisan، ج1 ص295]."
