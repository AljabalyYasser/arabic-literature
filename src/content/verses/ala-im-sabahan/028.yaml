first: أَيَقْتُلُنِي وَالْمَشْرَفِيُّ مُضَاجِعِي
second: وَمَسْنُونَةٌ زُرْقٌ كَأَنْيَابِ أَغْوَالِ
vocabulary:
- term: الْمَشْرَفِيُّ
  text: «السيف المنسوب إلى مشارف الشام، وهي قرى للعرب تدنو من الروم» [@suyuti-mughni، ج1 ص343].
- term: مَسْنُونَةٌ زُرْقٌ
  text: 'نصال «محدّدة بالمِسَنّ، وأراد بها المشاقص» [@suyuti-mughni، ج1 ص343]، وزُرق: صافية لامعة.'
- term: أَغْوَالِ
  text: «الشياطين، وأراد به التهويل» [@suyuti-mughni، ج1 ص343].
