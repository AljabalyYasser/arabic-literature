first: "فَأَصْبَحْتُ مَعْشُوقًا وَأَصْبَحَ بَعْلُهَا"
second: "عَلَيْهِ الْقَتَامُ سَيِّئَ الظَّنِّ وَالْبَالِ"
meaning: "فلما طلع الصباح صرتُ أنا الذي تعشقه المرأة، وصار زوجها كئيب الوجه كأن عليه غبارًا، يسيء الظن بها وبما جرى، مضطرب البال. أي إن الليلة انتهت بجماع امرأة الرجل، وبقي الزوج يشكّ ولا يملك دليلًا. والبَعْل الزوج، والقَتام الغبار، وفي حاشية أحمد شاكر محقق كتاب ابن قُتَيْبة: «القتام: الغبار، يريد أن وجهه تغبر واسود من الخزى» [@ibn-qutayba، ج1 ص136، الحاشية]. فالبيت خاتمة مشهد الزنا كله: العاشق منتصر، والزوج مخزيّ."
vocabulary:
  - term: "مَعْشُوقًا"
    text: "محبوبًا تعشقه المرأة."
  - term: "بَعْلُهَا"
    text: "زوجها."
  - term: "الْقَتَامُ"
    text: "الغبار، والمراد سواد الوجه وكآبته من الخزي، كما يقول محقق ابن قُتَيْبة [@ibn-qutayba، ج1 ص136، الحاشية]."
  - term: "الْبَالِ"
    text: "الحال والخاطر، وسيئ البال: مضطرب النفس مهموم."
syntax:
  - "«فَأَصْبَحْتُ مَعْشُوقًا»: «أصبح» فعل ناقص، والتاء اسمه، و«معشوقًا» خبره. و«وَأَصْبَحَ بَعْلُهَا» مثلها، و«بعلُها» اسم «أصبح»."
  - "«عَلَيْهِ الْقَتَامُ»: جملة من خبر مقدم ومبتدأ مؤخر، في محل نصب خبر «أصبح». و«سَيِّئَ الظَّنِّ» خبر ثانٍ، أو حال، مضاف إلى «الظنّ» إضافة لفظية، و«والبالِ» معطوف على «الظنّ»."
morphology:
  - "«مَعْشُوق» اسم مفعول من «عَشِقَ»."
  - "«سَيِّئ» صفة مشبهة على «فَيْعِل» من «ساءَ يسُوءُ»، أصلها «سَيْوِئ» قُلبت الواو ياء وأُدغمت الياء في الياء."
  - "«قَتَام» على «فَعال»، من «قَتَمَ»."
rhetoric:
  thesis: "آخر أبيات المغامرة التي أوردها ابن قُتَيْبة (20–26): صباحان متقابلان، صباح العاشق وصباح الزوج. وهو البيت الذي يكشف أن المرأة متزوجة، فيصير ما قبله كله زنا بامرأة رجل حاضر."
  devices:
    - title: "المقابلة"
      text: "«فَأَصْبَحْتُ مَعْشُوقًا» يقابله «وَأَصْبَحَ بَعْلُهَا عَلَيْهِ الْقَتَامُ»: الفعل نفسه، والحال متضادة. والمقابلة أن يؤتى بمعنيين ثم بما يقابلهما، وهي هنا تجعل فرح العاشق وخزي الزوج في نَفَس واحد."
    - title: "الاستعارة في «عَلَيْهِ الْقَتَامُ»"
      text: "جعل على الزوج غبارًا، والمراد كآبة وجهه وسواده من الخزي، فاستعار الغبار لما يعلو الوجه من الهم. والاستعارة عند عبد القاهر الجُرْجانيّ أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الشماتة"
      text: "لا يكتفي بالظفر بالمرأة، بل يصف الزوج بعده، فيضيف إلى اللذة لذة الغلبة على رجل. وهذا ما سمّاه ابن قُتَيْبة «الدّبيب إلى حرم الناس» [@ibn-qutayba، ج1 ص135]."
  connection: "ثم يصف الزوج وغضبه: «يَغِطُّ غَطِيطَ الْبَكْرِ شُدَّ خِنَاقُهُ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَأَصْبَحْ / تُ مَعْشُوقَنْ / وَأَصْبَ / حَ بَعْلُهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — عَلَيْهِلْ / قَتَامُ سَيْ / يِئَظْظَنْ / نِ وَلْبَالِي = فعولن / مفاعلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر [@atiq، ص29]، ودخل «مفاعيلن» الأولى من العجز فصارت «مفاعلن». و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "آخر الأبيات 20–26 التي أوردها ابن قُتَيْبة بعد قوله: «ويعاب عليه تصريحه بالزنا والدّبيب إلى حرم الناس. والشعراء تتوقّى ذلك فى الشعر وإن فعلته» [@ibn-qutayba، ج1 ص135–136]. وبعده خمسة أبيات في الزوج يغطّ من الغيظ ويريد قتله، فيسخر منه الشاعر (27–31). ويرى شوقي ضَيْف أن امرأ القَيْس «هو الذى سبق إلى هذا الغزل الفاحش الصريح» [@deif، ج1 ص252]."
variants:
  - reading: "وَأَصْبَحْتُ مَعْشُوقًا وَأَصْبَحَ زَوْجُهَا / عَلَيْهِ الْقَتَامُ كَاسِفَ الظَّنِّ وَالْبَالِ"
    status: "رواية السُّيُوطيّ"
    note: "«زوجها» مكان «بعلها»، و«كاسف» مكان «سيّئ» [@suyuti-mughni، ج1 ص341]، والكاسف العابس المتغيّر الوجه."
