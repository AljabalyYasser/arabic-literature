explained: false
first: أَيَقْتُلُنِي وَقَدْ شَغَفْتُ فُؤَادَهَا
second: كَمَا شَغَفَ الْمَهْنُوءَةَ الرَّجُلُ الطَّالِي
vocabulary:
- term: شَغَفْتُ فُؤَادَهَا
  text: «بلغ حبي منها شِغاف قلبها»، وهو غلافه [@lisan، ج5 ص105].
- term: الْمَهْنُوءَةَ
  text: 'الناقة المطليّة بالهِناء، وهو القطران؛ والمعنى: «كما بلغ القطران شِغاف الناقة المهنوءة» [@lisan، ج5 ص105].'
- term: الطَّالِي
  text: الذي يطليها بالقطران.
