explained: false
first: وَصُمٌّ صِلَابٌ مَا يَقِينَ مِنَ الْوَجَى
second: كَأَنَّ مَكَانَ الرِّدْفِ مِنْهُ عَلَى رَالِ
vocabulary:
- term: صُمٌّ صِلَابٌ
  text: حوافر صلبة.
- term: الْوَجَى
  text: الحفا [@diwan-imru-al-qais، ص138].
- term: مَكَانَ الرِّدْفِ
  text: موضع الرديف خلف الفارس، وهو القطاة؛ «يصفه بإشراف القطاة» [@lisan، ج15 ص190].
- term: رَالِ
  text: الرَّأْل، وهو ولد النعام؛ «أراد على رَأْل» فخفّف الهمزة [@lisan، ج11 ص262].
