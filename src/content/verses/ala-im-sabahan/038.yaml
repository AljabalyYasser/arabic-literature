first: "وَلَمْ أَسْبَإِ الزِّقَّ الرَّوِيَّ وَلَمْ أَقُلْ"
second: "لِخَيْلِيَ كُرِّي كَرَّةً بَعْدَ إِجْفَالِ"
meaning: "ولم أشترِ زقّ الخمر الممتلئ لأشربه، ولم أقل لخيلي حين انهزمت: ارجعي إلى العدو كرّة أخرى."
vocabulary:
  - term: "أَسْبَإِ"
    text: "أشتري الخمر لشربها [@diwan-imru-al-qais، ص138]. و«السِّباء بالكسر والمد: اشتراء الخمر للشرب لا للبيع» [@khizana، ج2 ص202]."
  - term: "الزِّقَّ"
    text: "وعاء من جلد تُحفظ فيه الخمر [@diwan-imru-al-qais، ص138]."
  - term: "الرَّوِيَّ"
    text: "المملوء [@deif، ج1 ص258]."
  - term: "كُرِّي"
    text: "ارجعي إلى القتال."
  - term: "إِجْفَالِ"
    text: "«الانهزام في سرعة» [@deif، ج1 ص258]."
syntax:
  - "«وَلَمْ أَسْبَإِ» فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين. و«الزِّقَّ» مفعول به، و«الرَّوِيَّ» نعت له."
  - "«وَلَمْ أَقُلْ» فعل مضارع مجزوم بالسكون، وحُذفت واوه لالتقاء الساكنين. و«لِخَيْلِيَ» جار ومجرور متعلق بـ«أقل»."
  - "جملة «كُرِّي كَرَّةً بَعْدَ إِجْفَالِ» في محل نصب مقول القول. و«كُرِّي» فعل أمر مبني على حذف النون، والياء فاعل. و«كَرَّةً» مفعول مطلق مبيّن للعدد. و«بَعْدَ» ظرف زمان متعلق بـ«كُرِّي»، و«إِجْفَالِ» مضاف إليه."
morphology:
  - "«أَسْبَأ» مضارع «سَبَأ» مهموز اللام، ومصدره «السِّباء» [@khizana، ج2 ص202]."
  - "«كَرَّة» اسم مرة من «كرّ» على «فَعْلة»."
  - "«إِجْفَال» مصدر «أجفل» على «إفعال»."
  - "«الرَّوِيّ» صفة على «فعيل»."
rhetoric:
  thesis: "يكمل ذكر ما ضاع: الخمر، ثم الشجاعة. فيجمع صورتي الفتى: فتى اللهو وفتى الحرب."
  devices:
    - title: "ترتيب المعاني"
      text: "ولهذين البيتين قصة في مجلس سيف الدولة. أنشدهما رجل بغدادي يُعرف بالمنتخب، لا يكاد يسلم منه شاعر، فقال: «قد خالف فيهما وأفسد»، ولو قال: «كأني لم أركب جوادًا، ولم أقل / لخيلي كري كرة بعد إجفال // ولم أسبإ الزق الرَّوِيّ للذة / ولم أتبطن كاعبًا ذات خلخال» لكان قد جمع بين الشيء وشكله: الجواد والكرّ في بيت، والنساء والخمر في بيت [@ibn-rashiq، ج1 ص258–259]. وردّ ابن رَشِيق هذا الرأي: «قول امرئ القَيْس أصوب، ومعناه أعزّ وأغرب»، لأن الزق «لا يُسبأ إلا للذة»، فلو قال «ولم أسبإ الزق الرَّوِيّ للذة» لكان ذكر اللذة «حشوًا لا فائدة فيه». والشاعر «وصف نفسه بالفتوة والشجاعة بعد أن وصفها بالتملك والرفاهة» [@ibn-rashiq، ج1 ص259]. فالبيت الأول لترف الملوك، والثاني لكرم الفتى وشجاعته."
    - title: "نظم الكلام على ترتيب المعاني"
      text: "وهذا ما يقوله عبد القاهر الجُرْجانيّ في النظم: إنك في نظم الكلم «تقتفي في نظمها آثار المعاني، وترتبها على حسب ترتب المعاني في النفس»، حتى يكون لوضع كل كلمة «حيث وُضع علة تقتضي كونه هناك، وحتى لو وُضع في مكان غيره لم يصلح» [@dalail، ص49]. فالمنتخب نظر إلى تشابه الأشياء، وامرؤ القَيْس رتّب المعاني: الترف أولًا، ثم الفتوة."
    - title: "نداء الخيل"
      text: "يخاطب خيله كما يخاطب الفرسان: «كُرّي». فالخيل هنا فرسانه، والأمر أمر قائد يردّ جيشه بعد هزيمة."
  connection: "ويتصل عدّ الفروسية في البيت التالي: «ولم أشهد الخيل المغيرة بالضحى» على فرس ضخم القوائم [@diwan-imru-al-qais، ص138]، ثم يصف فرسه ويخرج إلى الصيد."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَلَمْ أَسْ / بَإِزْ زِقْقَرْ / رَوِيْيَ / وَلَمْ أَقُلْ = فعولن / مفاعيلن / فعولُ / مفاعلن — لِخَيْلِ / يَ كُرْرِي كَرْ / رَتَنْ بَعْ / دَ إِجْفَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]. ويستقيم الوزن بفتح الياء في «لخيليَ»، كما ضبطها الديوان [@diwan-imru-al-qais، ص138]. والعَرُوض مقبوضة «مفاعلن» والضرب صحيح «مفاعيلن» [@atiq، ص29–30]."
context: "يستشهد به شوقي ضيف مع البيت قبله على أنه «كأنه كان يحس ما ينتظره» [@deif، ج1 ص258]. وقد أخذه عبد يغوث الحارثي فقال في أسره: «كأني لم أركب جوادًا ولم أقل / لخيلي كرّي نفّسي عن رجاليا // ولم أسبإ الزق الرَّوِيّ ولم أقل / لأيسار صدق أعظموا ضوء ناريا» [@khizana، ج2 ص202]."
