first: "إِذَا مَا الضَّجِيعُ ابْتَزَّهَا مِنْ ثِيَابِهَا"
second: "تَمِيلُ عَلَيْهِ هُونَةً غَيْرَ مِجْبَالِ"
meaning: "إذا جرّدها مضاجعها من ثيابها مالت عليه لينة متمهّلة، لا غليظة الخلق ولا جافية. وهي المرأة التي ذكرها في البيت السابق «ومثلكِ بيضاء العوارض طفلة»، يصفها الآن في الخلوة. وفي شرح البَغْداديّ: «ابتزها نزع بزها أي ثيابها وأراد مطلق النزع والسلب»، و«الهونة بالفتح والضم المتئدة» [@khizana، ج1 ص68]، أي المتمهّلة الهادئة. والمعنى بلغة اليوم: إذا عرّاها الرجل الذي ينام معها من ثيابها مالت عليه بجسدها العاري لينةً مطاوعة، تسلم نفسها له ليجامعها، ولا تتمنّع ولا تجفو."
vocabulary:
  - term: "الضَّجِيعُ"
    text: "المضاجع، أي الذي ينام معها: «والضجيع: المضاجع»، و«ضاجع الرجل جاريته إذا نام معها في شعار واحد» [@lisan، ج8 ص219]، والشِّعار: الثوب الذي يلي الجسد."
  - term: "ابْتَزَّهَا"
    text: "جرّدها: «ويقال: ابتزّ الرجل جاريته من ثيابها إذا جرّدها؛ ومنه قول امرئ القيس» [@lisan، ج5 ص312]."
  - term: "هُونَةً"
    text: "«والهونة بالفتح والضم المتئدة والهون السكينة والوقار» [@khizana، ج1 ص68]. وفي اللسان: «هونة ضعيفة من خلقتها لا تكون غليظة كأنها رجل» [@lisan، ج13 ص439]."
  - term: "مِجْبَالِ"
    text: "«وامرأة مجبال أي غليظة الخلق» [@lisan، ج11 ص99]، وعن الأَصْمَعِيّ: «معناه هي الغليظة» [@khizana، ج1 ص68]."
syntax:
  - "«إِذَا»: ظرف شرطي، و«مَا» زائدة للتوكيد، و«الضَّجِيعُ» فاعل لفعل محذوف يفسّره «ابْتَزَّهَا»، والتقدير: إذا ابتزّها الضجيعُ ابتزّها. و«مِنْ ثِيَابِهَا» متعلق بـ«ابتزّ»."
  - "«تَمِيلُ عَلَيْهِ»: جواب «إذا»، والضمير في «عليه» للضجيع."
  - "«هُونَةً»: حال من فاعل «تميل»، و«غَيْرَ مِجْبَالِ» نعت لها أو حال ثانية."
  - "والبيت متصل بالبيت 14 «ومثلكِ بيضاء العوارض طفلة»، وفيه «الواو واو رب وهو خطاب لبسباسة» [@khizana، ج1 ص67]، فالأبيات 14–17 كلها صفات لتلك المرأة المجرورة بـ«رُبّ» المضمرة."
morphology:
  - "«ابْتَزَّ» على «افْتَعَلَ» من «بَزّ»، والبَزّ هنا الثياب، كما يُفهم من قول البَغْداديّ «نزع بزها أي ثيابها» [@khizana، ج1 ص68]."
  - "«الضَّجِيع» على «فَعِيل» بمعنى «مُفاعِل»: المضاجِع، والأنثى ضجيعة [@lisan، ج8 ص219]."
  - "«مِجْبَال» على «مِفْعال»، وهو من أبنية المبالغة، من الجَبْل: الغِلَظ."
  - "«هُونَة» من «الهَوْن»: «والهون السكينة والوقار» [@khizana، ج1 ص68]."
rhetoric:
  thesis: "يتابع الرد على بسباسة التي زعمت أنه كبر: يصف امرأة من صواحبه في خلوتها، تُجرَّد من ثيابها فتميل على مضاجعها لينة لا جفاء فيها. فالبيت فخر بقدرته على النساء، مصوغ في صورة امرأة."
  devices:
    - title: "الإخبار عن النفس بلفظ الغائب"
      text: "بدأ بالمتكلم في البيت السابق «تنسّيني إذا قمت سربالي»، ثم جعل الفعل هنا لـ«الضَّجِيعُ». فصار وصفًا لطبعها مع من يضاجعها، لا خبرًا عن ليلة واحدة، وبقي المتكلم وراء اللفظ. وهذه قراءتنا."
    - title: "إثبات الصفة ونفي ضدّها"
      text: "«هُونَةً غَيْرَ مِجْبَالِ»: أثبت اللين، ثم نفى الغلظ، فاجتمع في وصفها الإيجاب والسلب على معنى واحد. ولأن «الهونة» قد تُفهم ضعفًا في الخلقة كما في اللسان، جاء النفي ليحدد المراد: لين بلا جفاء."
    - title: "الكناية"
      text: "«تَمِيلُ عَلَيْهِ» ميل الجسد، والمراد ما يتبعه من الجماع. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]، وهو هنا الميل الذي يسبق الجماع ويدل عليه."
  connection: "ثم يصف عجيزتها في البيت التالي: «كحقف النقا يمشي الوليدان فوقه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "إِذَا مَضْ / ضَجِيعُبْ تَزْ / زَهَا مِنْ / ثِيَابِهَا = فعولن / مفاعيلن / فعولن / مفاعلن — تَمِيلُ / عَلَيْهِي هُو / نَتَنْ غَيْ / رَ مِجْبَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من العَجُز [@atiq، ص29]. وأُشبعت كسرة الهاء في «عليهِ» فنُطقت «عليهي»، فجاءت «مفاعيلن» تامة؛ ولو لم تُشبع لدخلها القبض فصارت «مفاعلن». والضرب صحيح «مفاعيلن»، وهو أحد ضروب الطويل الثلاثة [@atiq، ص30]."
context: "من الأبيات التي يرد بها على بسباسة: بعد «ومثلكِ بيضاء العوارض طفلة» (14) يصفها في الخلوة في هذا البيت وتاليه، ثم يعود إلى قوامها في البيت 17. وقد شرح البَغْداديّ الأبيات بيتًا بيتًا وهو يشرح شاهده «تنوّرتها من أذرعات» [@khizana، ج1 ص67–68]. وهي من القصيدة التي قال فيها ابن قُتَيْبة: «ويعاب عليه تصريحه بالزنا والدّبيب إلى حرم الناس. والشعراء تتوقّى ذلك فى الشعر وإن فعلته» [@ibn-qutayba، ج1 ص135]. ويرى شوقي ضَيْف أن امرأ القَيْس «هو الذى سبق إلى هذا الغزل الفاحش الصريح، وتبعه الشعراء من بعده وإن لم يبلغوا مبلغه من الفحش والصراحة» [@deif، ج1 ص252]."
variants:
  - reading: "تَمِيلُ عَلَيْهِ هُونَةً غَيْرَ مِعْطَالِ"
    status: "رواية البَغْداديّ"
    note: "وقال بعدها: «ويروي مجبال» [@khizana، ج1 ص68]. والمِعْطال التي تخلو من الحلي عادةً: «فإذا كان ذلك عادتها فهي معطال» [@lisan، ج11 ص454]. وبها أنشده صاحب اللسان في موضع، وفسّر «هونة» بأنها «ضعيفة من خلقتها»، ثم قال: «وروى غيره: هَوْنة أي مطاوعة» [@lisan، ج13 ص439]."
  - reading: "تَمِيلُ عَلَيْهِ هَوْنَةً غَيْرَ مِتْفَالِ"
    status: "رواية اللسان"
    note: "[@lisan، ج5 ص312] [@lisan، ج11 ص77]. والمِتْفال التي لا تتطيّب، فتصير الصفة في رائحتها لا في خلقتها."
