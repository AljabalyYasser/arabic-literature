first: تَحَامَاهُ أَطْرَافُ الرِّمَاحِ تَحَامِيًا
second: وَجَادَ عَلَيْهِ كُلُّ أَسْحَمَ هَطَّالِ
vocabulary:
- term: تَحَامَاهُ
  text: تجنّبه.
- term: جَادَ
  text: أمطر مطرًا غزيرًا.
- term: أَسْحَمَ
  text: الأسود من السحاب، «وهو أغزر ما يكون من الغيم» [@suyuti-mughni، ج1 ص342].
- term: هَطَّالِ
  text: «سيّال دائم» [@suyuti-mughni، ج1 ص342].
