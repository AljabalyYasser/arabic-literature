explained: false
first: كَأَنَّ الصُّوَارَ إِذْ تَجَهَّدَ عَدْوُهُ
second: عَلَى جَمَزَى خَيْلٌ تَجُولُ بِأَجْلَالِ
vocabulary:
- term: الصُّوَارَ
  text: القطيع من بقر الوحش.
- term: تَجَهَّدَ عَدْوُهُ
  text: اشتدّ عدوه وبلغ جهده.
- term: جَمَزَى
  text: عدو سريع وثّاب؛ «الناقة تعدو الجَمَزَى، وكذلك الفرس» [@lisan، ج5 ص323].
- term: أَجْلَالِ
  text: جمع جُلّ، وهو ما تُلبَسه الدابة لتُصان به.
