  - reading: "وَرُضْتُ فَذَلَّتُ صَعْبَةً أَيَّ إِذْلَالِ"
    status: "في نسخة العمل"
    note: "بضم التاء في «فذلّتُ» [@diwan-imru-al-qais، ص137]، ونراه خطأ في الطبع، فالفعل للمرأة. وهو في اللسان وعند ابن قُتَيْبة وشوقي ضَيْف «فذلّتْ» [@lisan، ج7 ص164] [@ibn-qutayba، ج1 ص136] [@deif، ج1 ص252]."
