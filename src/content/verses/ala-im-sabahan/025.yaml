first: "وَصِرْنَا إِلَى الْحُسْنَى وَرَقَّ كَلَامُنَا"
second: "وَرُضْتُ فَذَلَّتْ صَعْبَةً أَيَّ إِذْلَالِ"
meaning: "وانتهينا إلى ما نحب، ولان حديثنا بعد الشدة، وروّضتها كما يُروَّض المهر الصعب فانقادت أتمّ انقياد. وفي اللسان: «وراض الدابة يروضها روضا ورياضة: وطأها وذللها أو علمها السير؛ قال امرؤ القيس: ورضت فذلت صعبة أي إذلال»، ثم: «دل بقوله أي إذلال أن معنى قوله رضت ذللت لأنه أقام الإذلال مقام الرياضة» [@lisan، ج7 ص164]. فالمرأة في البيت كالدابة الصعبة تُذلَّل، و«الحسنى» كناية عما صارا إليه من الوصال. والمعنى الصريح أنه جامعها: «صرنا إلى الحسنى» أي إلى ما جاء من أجله، و«رضت فذلّت» أي غلب امتناعها حتى أسلمت له نفسها كما يسلم المهر ظهره لراكبه."
vocabulary:
  - term: "صِرْنَا إِلَى الْحُسْنَى"
    text: "انتهينا إلى الحال الحسنى، أي الوصال."
  - term: "رَقَّ كَلَامُنَا"
    text: "لان بعد الشدة والخوف."
  - term: "رُضْتُ"
    text: "ذلّلتُ، من رياضة الدابة: «وراض الدابة يروضها روضا ورياضة: وطأها وذللها أو علمها السير» [@lisan، ج7 ص164]."
  - term: "صَعْبَةً"
    text: "غير منقادة، كالدابة التي لم تُرَض."
  - term: "أَيَّ إِذْلَالِ"
    text: "إذلالًا تامًّا."
syntax:
  - "«وَصِرْنَا إِلَى الْحُسْنَى»: «صار» هنا تامة بمعنى انتقل، و«إِلَى الْحُسْنَى» متعلق بها، و«الحسنى» صفة لموصوف محذوف: الحال الحسنى."
  - "«وَرَقَّ كَلَامُنَا»: فعل وفاعل، والجملة معطوفة."
  - "«وَرُضْتُ فَذَلَّتْ»: الفاء للتعقيب والسببية. و«صَعْبَةً» مفعول به لـ«رضتُ» فُصل بينه وبين فعله بـ«فذلّت»، والتقدير: ورضتُ صعبةً فذلّت؛ ويجوز أن يكون حالًا من فاعل «ذلّت»، أي ذلّت وقد كانت صعبة."
  - "«أَيَّ إِذْلَالِ»: مفعول مطلق مبيّن للنوع، و«أيّ» مضافة إلى «إذلال». والمصدر ليس من لفظ «رُضْت» ولا من لفظ «ذلّت»، وهذا ما لاحظه صاحب اللسان: «أقام الإذلال مقام الرياضة» [@lisan، ج7 ص164]، أي إن «أيّ إذلال» مصدر لـ«رضت» في المعنى."
morphology:
  - "«رُضْتُ» ماضٍ من «رَاضَ يَرُوضُ»، أجوف واوي، ضُمّت فاؤه وحُذفت عينه حين أسند إلى تاء الفاعل."
  - "«إِذْلَال» مصدر «أَذَلَّ» على «إِفْعال»."
  - "«الْحُسْنَى» على «فُعْلَى»، مؤنث «الأحسن»."
  - "«صَعْبَة» صفة مشبهة من «صَعُبَ»."
rhetoric:
  thesis: "يختم المشهد بثلاث جمل متتابعة: صرنا إلى الحسنى، ورقّ الكلام، وذلّت. والصورة الأخيرة من رياضة الخيل: المرأة صعبة كالمهر الذي لم يُركب، وهو الرائض الذي يذلّلها."
  devices:
    - title: "الاستعارة"
      text: "في «وَرُضْتُ ... صَعْبَةً» استعار رياضة الدابة لاستمالة المرأة، فجعلها مهرًا صعبًا وجعل نفسه رائضه. وهي استعارة بالمعنى الذي حدّه عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره» [@dalail، ص67]. والصورة تتصل بالبيت السابق: هناك جذبها كما يُجذب الغصن، وهنا ذلّلها كما تُذلَّل الدابة."
    - title: "الكناية"
      text: "«صِرْنَا إِلَى الْحُسْنَى» لم يسمّ فيه ما صارا إليه، وهو الجماع، بل وصفه بأنه الحال الحسنى. وهي الكناية التي يجيء فيها المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المبالغة"
      text: "«أَيَّ إِذْلَالِ»: «أيّ» المضافة إلى المصدر تدل على بلوغ الصفة غايتها، فكأنه يقول: إذلالًا لا مزيد عليه."
  connection: "ثم ينتقل إلى الزوج: «فأصبحت معشوقًا وأصبح بعلها»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَصِرْنَا / إِلَلْحُسْنَى / وَرَقْقَ / كَلَامُنَا = فعولن / مفاعيلن / فعولُ / مفاعلن — وَرُضْتُ / فَذَلْلَتْ صَعْ / بَتَنْ أَيْ / يَ إِذْلَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر والأولى من العَجُز [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "خاتمة المغامرة قبل أن يظهر الزوج في البيت التالي «فأصبحت معشوقًا وأصبح بعلها». وهو مع سابقه من الأبيات التي أوردها ابن قُتَيْبة شاهدًا على «تصريحه بالزنا والدّبيب إلى حرم الناس» [@ibn-qutayba، ج1 ص135–136]. ويشرح شوقي ضَيْف لفظيه في حاشيته: «رضت: أذللت، وذلت: لانت» [@deif، ج1 ص252، الحاشية]. وفي رواية السُّيُوطيّ «فصرنا» بالفاء، ويقدّم هذا البيت وسابقه على «حلفت لها بالله» [@suyuti-mughni، ج1 ص341]."
variants:
