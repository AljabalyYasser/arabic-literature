first: "وَلَكِنَّمَا أَسْعَى لِمَجْدٍ مُؤَثَّلٍ"
second: "وَقَدْ يُدْرِكُ الْمَجْدَ الْمُؤَثَّلَ أَمْثَالِي"
meaning: "لكني أسعى لمجد أصيل قديم، وقد يبلغ هذا المجدَ من كان مثلي [@suyuti-mughni، ج1 ص344]."
vocabulary:
  - term: "مُؤَثَّلٍ"
    text: "قديم [@suyuti-mughni، ج1 ص344]، أصيل شريف [@diwan-imru-al-qais، ص139]."
  - term: "أَمْثَالِي"
    text: "من كان مثلي في نسبه وهمّته."
syntax:
  - "«لكنّ» حرف استدراك، كفّتها «مَا» عن العمل فدخلت على الفعل «أَسْعَى»."
  - "«لِمَجْدٍ» متعلق بـ«أَسْعَى»، و«مُؤَثَّلٍ» نعت له."
  - "«قد» مع المضارع هنا للتقليل: قد يبلغه أمثاله، لا كلهم."
  - "«الْمَجْدَ» مفعول به مقدم، و«الْمُؤَثَّلَ» نعت له، و«أَمْثَالِي» فاعل مؤخر مرفوع بضمة مقدرة على ما قبل ياء المتكلم."
morphology:
  - "«مُؤَثَّلٍ» اسم مفعول من «أثَّل» المضعّف، يقال: أثّل الشيءَ إذا أصّله وثبّته."
  - "«أمثال» جمع «مِثْل» على «أفعال»."
  - "«مَجْد» مصدر «مَجَدَ»."
rhetoric:
  thesis: "هذا جواب الشرط الممتنع في البيت السابق: لا يطلب العيش بل المجد. ثم يختم بحكمة متواضعة في ظاهرها، واثقة في باطنها: «وَقَدْ يُدْرِكُ الْمَجْدَ الْمُؤَثَّلَ أَمْثَالِي»."
  devices:
    - title: "الاستدراك"
      text: "«وَلَكِنَّمَا» تنقض ما افترضه في البيت السابق، وتثبت نقيضه."
    - title: "ردّ العَجُز على الصدر"
      text: "ذكر «مجد مؤثل» في الصدر، ثم أعاده في العَجُز «الْمَجْدَ الْمُؤَثَّلَ»، فربط شطري البيت بلفظ واحد."
    - title: "تقديم المفعول"
      text: "في «وَقَدْ يُدْرِكُ الْمَجْدَ الْمُؤَثَّلَ أَمْثَالِي» قدّم المفعول «الْمَجْدَ الْمُؤَثَّلَ» على الفاعل «أَمْثَالِي»، لأنه موضع عنايته. يقول عبد القاهر الجُرْجانيّ، ناقلًا عن سِيبَوَيْه: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "التعريض"
      text: "«أَمْثَالِي» يعني بها نفسه، فهو ابن ملوك، والمجد المؤثل ملك آبائه؛ فالمطلوب عنده الملك، كما يقول سِيبَوَيْه [@sibawayh، ج1 ص79]."
  connection: "ثم يختم القصيدة بحكمة عامة: «وَمَا الْمَرْءُ مَا دَامَتْ حُشَاشَةُ نَفْسِهِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَلَاكِنْ / نَمَا أَسْعَى / لِمَجْدِنْ / مُؤَثْثَلِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَقَدْ يُدْ / رِكُلْ مَجْدَلْ / مُؤَثْثَ / لَ أَمْثَالِي = فعولن / مفاعيلن / فعولُ / مفاعيلن"
  note: "«لكنّ» تُكتب بلا ألف وتُنطق بها «لاكنّ»، والتقطيع بالمنطوق. وجاءت «فعولن» مقبوضة مرة في العَجُز، وكلاهما جائز في حشو الطويل [@atiq، ص29]."
context: "يستشهد النحاة بالبيتين معًا في باب «لو»، لأن «لو» تدل على أن الفعل لم يقع، فيصح أن يعقبها الاستدراك [@suyuti-mughni، ج2 ص642]."
