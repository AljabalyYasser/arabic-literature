explained: false
first: وَمَاذَا عَلَيْهِ أَنْ ذَكَرْتُ أَوَانِسًا
second: كَغِزْلَانِ رَمْلٍ فِي مَحَارِيبِ أَقْيَالِ
vocabulary:
- term: أَوَانِسًا
  text: جمع آنسة، وهي «المرأة التي تأنس بحديثك» [@khizana، ج1 ص65].
- term: مَحَارِيبِ
  text: جمع مِحراب، وهو «صدر البيت، وأكرم موضع فيه»، وهو أيضًا الغرفة [@lisan، ج1 ص305].
- term: أَقْيَالِ
  text: 'جمع قَيْل، وهو «الملك من ملوك حِمْيَر»، وقيل: هو دون الملك الأعلى [@lisan، ج11 ص575].'
