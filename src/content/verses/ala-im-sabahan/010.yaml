first: "وَيَا رُبَّ يَوْمٍ قَدْ لَهَوْتُ وَلَيْلَةٍ"
second: "بِآنِسَةٍ كَأَنَّهَا خَطُّ تِمْثَالِ"
meaning: "يرد على بَسْباسة التي زعمت أنه كبر وأن أمثاله لا يحسنون اللهو: كم من يوم وكم من ليلة لهوت فيهما بامرأة أنيسة، كأنها في حسن خلقتها صورة منقوشة. واللهو هنا كناية عن الجماع. قال البَغْداديّ في شرح البيت الذي قبله: «واللهو مصدر لهوت بالشيء إذا لعبت به قال في الصحاح وقد يكنى باللهو عن الجماع» [@khizana، ج1 ص64]، وأنشد صاحب اللسان عجز ذلك البيت «كَبِرْتُ وَأَنْ لَا يُحْسِنُ اللَّهْوَ أَمْثَالِي» ثم قال: «وَقَدْ يُكَنَّى باللَّهْوِ عَنِ الْجِمَاعِ» [@lisan، ج15 ص259]. ويدل على هذا المعنى البيت التالي، فهو يضع المرأة في الفراش مع ضجيعها. فالمعنى بلغة اليوم: كم من يوم وليلة قضيتهما أستمتع بامرأة جميلة، أضاجعها وأجامعها، فكيف تزعم بسباسة أني كبرت عن النساء؟ وفسّر السُّيُوطيّ «الآنسة» بأنها «ذات أنس من غير ريبة» [@suyuti-mughni، ج1 ص342]، أي تؤنس بحديثها ولا يُظن بها سوء. لكن الشاعر لا يذكر حديثها، بل يذكر لهوه بها، فلهوه بها أكثر من المحادثة. وهذه قراءتنا."
vocabulary:
  - term: "رُبَّ"
    text: "حرف يدل هنا على الكثرة: كم من يوم. وقد استشهد به ابن هِشام في «مُغْني اللَّبِيب»، كما يقول البَغْداديّ، «على ورود رب للتكثير» [@khizana، ج1 ص65]."
  - term: "لَهَوْتُ"
    text: "لعبت وتمتعت، و«قد يكنى باللهو عن الجماع» [@khizana، ج1 ص64]، وهو المراد هنا."
  - term: "بِآنِسَةٍ"
    text: "«الآنسة المرأة التي تأنس بحديثك» [@khizana، ج1 ص65]، وعند السُّيُوطيّ: «ذات أنس من غير ريبة» [@suyuti-mughni، ج1 ص342]."
  - term: "خَطُّ تِمْثَالِ"
    text: "صورة منقوشة أو مرسومة: «والتمثال: الصورة. وخطها: نقشها» [@suyuti-mughni، ج1 ص342]. وعند البَغْداديّ: «والخط الكتابة ... والتمثال الصورة» [@khizana، ج1 ص65]."
syntax:
  - "«وَيَا رُبَّ»: الواو عاطفة على ما قبلها، و«يا» حرف تنبيه، و«رُبَّ» حرف جر، و«يَوْمٍ» مجرور بها، و«وَلَيْلَةٍ» معطوف عليه مجرور."
  - "«قَدْ لَهَوْتُ»: قال البَغْداديّ: «وجملة قد لهوت صفة يوم والعائد محذوف أي فيه وصفة ليلة مع العائد محذوف أي لهوت فيها ولا يجوز أن يكون الوصف لهما» [@khizana، ج1 ص65]. أي: يومٍ لهوت فيه، وليلةٍ لهوت فيها، فلكل منهما صفة مقدّرة."
  - "«بِآنِسَةٍ»: جار ومجرور متعلق بـ«لهوت»، و«آنسة» صفة لموصوف محذوف، أي بامرأة آنسة."
  - "«كَأَنَّهَا خَطُّ تِمْثَالِ»: «كأنّ» حرف تشبيه ونصب، والهاء اسمها، و«خَطُّ» خبرها مرفوع، وهو مضاف و«تِمْثَالِ» مضاف إليه. والجملة في محل جر صفة ثانية للمرأة."
morphology:
  - "«لَهَوْتُ» ماضٍ من «لَهَا يَلْهُو»، ناقص واوي، ومصدره «اللَّهْو» [@khizana، ج1 ص64]."
  - "«آنِسَة» اسم فاعل مؤنث من «أَنِسَ يَأْنَسُ»، والأُنس ضد الوحشة."
  - "«تِمْثَال» بكسر التاء اسم للصورة: «والتِّمْثَالُ: الصورةُ» [@lisan، ج11 ص613]، أما بفتحها فمصدر: «وأَما التَّمْثال، بِفَتْحِ التَّاءِ، فَهُوَ مَصْدَرُ مَثَّلْت تَمْثِيلًا وتَمْثَالًا» [@lisan، ج11 ص614]."
  - "«خَطّ» مصدر «خَطَّ يَخُطُّ»، مضعّف، وأُريد به المخطوط، أي الصورة المنقوشة."
rhetoric:
  thesis: "بعد «كَذَبْتِ» في البيت 9 يأتي الدليل: ذكريات أيام وليالٍ قضاها مع النساء. فالشاعر لا يرد على من قالت إنه كبر بقوة حاضرة، بل بماضٍ يعدّده."
  devices:
    - title: "«رُبَّ» للتكثير"
      text: "«وَيَا رُبَّ يَوْمٍ ... وَلَيْلَةٍ»: لم يذكر يومًا واحدًا، بل جعلها أيامًا وليالي كثيرة، فالفخر بالكثرة. وعلى هذا المعنى استشهد به ابن هِشام، كما ينقل البَغْداديّ [@khizana، ج1 ص65]."
    - title: "الكناية في «لَهَوْتُ»"
      text: "لم يسمّ الجماع، بل قال «لهوت»، وهو لفظ يدل على اللعب، ثم دلّ عليه بالمرأة والفراش في البيت التالي. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "التشبيه في «كَأَنَّهَا خَطُّ تِمْثَالِ»"
      text: "شبّهها بصورة منقوشة، والشبه في الهيئة: استواء الخلقة ودقة القسمات، كأن رسّامًا خطّها. وهو تشبيه يُدرك بالعين، من الضرب الذي يكون عند عبد القاهر الجُرْجانيّ «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]. ولم يقل «تمثال» بل «خطّ تمثال»، فجعل الحسن في الخطوط نفسها. وهذه قراءتنا."
    - title: "الجمع بين اليوم والليلة"
      text: "«يَوْمٍ ... وَلَيْلَةٍ»: جعل اللهو في النهار والليل معًا، فلا وقت يخلو منه. وهذه قراءتنا."
  connection: "ثم يصف المرأة نفسها في الفراش ليلًا: «يُضِيءُ الْفِرَاشَ وَجْهُهَا لِضَجِيعِهَا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَيَا رُبْ / بَ يَوْمِنْ قَدْ / لَهَوْتُ / وَلَيْلَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — بِآنِ / سَتِنْ كَأَنْ / نَهَا خَطْ / طُ تِمْثَالِي = فعولُ / مفاعلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر والأولى من العَجُز [@atiq، ص29]. والعروض مقبوضة «مفاعلن» كما هي في الطويل دائمًا [@atiq، ص29]. ودخل القبض أيضًا «مفاعيلن» الثانية من العجز فصارت «مفاعلن» في «سَتِنْ كَأَنْ»، وهو جائز في حشو الطويل: «كما يجوز في مفاعيلن في غير العروض والضرب القبض أيضًا مفاعلن» [@ahda-sabil، ص28]. والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "يأتي بعد «كَذَبْتِ لَقَدْ أُصْبِي عَلَى الْمَرْءِ عِرْسَهُ» (9)، وهو أول الذكريات التي يكذّب بها بسباسة، ويصل إلى البيت التالي الذي يصف فيه المرأة في الفراش. وفي رواية البَغْداديّ يأتي البيت بعد «أَلَا زَعَمَتْ بَسْبَاسَةُ» (8) مباشرة، ويبدأ بـ«بَلَى»، وهو «حرف إيجاب يختص بالنفي ويفيد إثباته»، فأثبت به ما نفته بسباسة [@khizana، ج1 ص64]. ويذكره السُّيُوطيّ في شواهد «رُبَّ» من «مُغْني اللَّبِيب» [@suyuti-mughni، ج1 ص393]. وهو من الجانب الماجن في القصيدة الذي يعدّد فيه الشاعر صواحبه (9–17)."
variants:
  - reading: "بَلَى رُبَّ يَوْمٍ قَدْ لَهَوْتُ وَلَيْلَةٍ"
    status: "رواية البَغْداديّ"
    note: "[@khizana، ج1 ص64]. وفيها يأتي البيت جوابًا مباشرًا لزعم بسباسة في البيت 8، فـ«بلى» تثبت ما نفته: بل أحسن اللهو."
  - reading: "فَيَا رُبَّ يَوْمٍ قَدْ لَهَوْتُ وَلَيْلَةٍ"
    status: "رواية ابن هِشام في «مُغْني اللَّبِيب»، كما يقول البَغْداديّ، وبها يرويه السُّيُوطيّ"
    note: "قال البَغْداديّ: «ورواه ابن هشام في مغني اللبيب فيارب يوم» [@khizana، ج1 ص64]. وانظر [@suyuti-mughni، ج1 ص341، ص393]."
