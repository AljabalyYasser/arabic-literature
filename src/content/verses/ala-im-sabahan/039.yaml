explained: false
first: وَلَمْ أَشْهَدِ الْخَيْلَ الْمُغِيرَةَ بِالضُّحَى
second: عَلَى هَيْكَلٍ عَبْلِ الْجُزَارَةِ جَوَّالِ
vocabulary:
- term: الْمُغِيرَةَ
  text: التي تُغير على العدو.
- term: هَيْكَلٍ
  text: '«الفرس الطويل علوًّا وعدوًا»، وقيل: الضخم [@lisan، ج11 ص700].'
- term: عَبْلِ الْجُزَارَةِ
  text: غليظ القوائم؛ «إذا قالوا في الفرس ضخم الجزارة فإنما يريدون غلظ يديه ورجليه وكثرة عصبهما» [@lisan، ج4 ص135].
- term: جَوَّالِ
  text: كثير الجولان.
