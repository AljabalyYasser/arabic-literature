explained: false
first: فَقَالَتْ سَبَاكَ اللَّهُ إِنَّكَ فَاضِحِي
second: أَلَسْتَ تَرَى السُّمَّارَ وَالنَّاسَ أَحْوَالِي
vocabulary:
- term: سَبَاكَ اللَّهُ
  text: '«أبعدك وأذهبك إلى غربة. وقيل: لعنك» [@suyuti-mughni، ج1 ص343].'
- term: السُّمَّارَ
  text: الذين يسهرون ليلًا يتحدثون.
- term: أَحْوَالِي
  text: حولي؛ جعل «كل جزء من الجِرْم المحيط بها حَوْلًا»، مبالغةً في أنه لا مكان حولها إلا مشغول بالسُّمّار [@lisan، ج11 ص187].
