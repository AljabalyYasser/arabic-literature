first: "فَقَالَتْ سَبَاكَ اللَّهُ إِنَّكَ فَاضِحِي"
second: "أَلَسْتَ تَرَى السُّمَّارَ وَالنَّاسَ أَحْوَالِي"
meaning: "فلما وصل إليها في خبائها ليلًا قالت له: أبعدك الله، إنك ستفضحني، ألا ترى الساهرين والناس من حولي في كل جانب؟ أي إن رآك أحد عندي عرفوا أني أخون زوجي. والسُّمّار الذين يسهرون ليلًا يتحدثون. وفي «سَبَاكَ اللَّهُ» قال السُّيُوطيّ: «أبعدك وأذهبك الى غربة. وقيل: لعنك. وقال أبو حاتم: معناه سلط عليك من يسبيك» [@suyuti-mughni، ج1 ص343]. وفي «أحوالي» قال صاحب اللسان إنه «جَعَل كُلَّ جُزْءٍ مِنَ الجِرْم المُحِيط بِهَا حَوْلًا، ذَهَب إِلى المُبالغة بِذَلِكَ أَي أَنه لَا مَكان حَوْلَها إِلا وَهُوَ مَشْغُولٌ بالسُّمَّار» [@lisan، ج11 ص187]."
vocabulary:
  - term: "سَبَاكَ اللَّهُ"
    text: "«أبعدك وأذهبك الى غربة. وقيل: لعنك» [@suyuti-mughni، ج1 ص343]، وهو دعاء عليه في صورة العتاب."
  - term: "فَاضِحِي"
    text: "كاشف ستري ومظهر عيبي للناس."
  - term: "السُّمَّارَ"
    text: "الساهرون ليلًا للحديث، جمع سامر."
  - term: "أَحْوَالِي"
    text: "حولي، جمع حَوْل، جعل كل جهة حولها «حَوْلًا» مبالغةً [@lisan، ج11 ص187]."
syntax:
  - "«فَقَالَتْ»: الفاء عاطفة، وما بعد «قالت» مقول القول في محل نصب."
  - "«سَبَاكَ اللَّهُ»: فعل ماض لفظًا معناه الدعاء، والكاف مفعول به، ولفظ الجلالة فاعل. و«إِنَّكَ فَاضِحِي»: «إنّ» واسمها، و«فاضحي» خبرها، مضاف إلى ياء المتكلم."
  - "«أَلَسْتَ تَرَى»: الهمزة للاستفهام الإنكاري التقريري، و«ليس» واسمها التاء، وجملة «ترى» خبرها. و«السُّمَّارَ» مفعول به، و«النَّاسَ» معطوف عليه، و«أَحْوَالِي» ظرف مكان منصوب بفتحة مقدرة، مضاف إلى ياء المتكلم."
morphology:
  - "«سَبَى» ناقص يائي، و«فَاضِح» اسم فاعل من «فَضَحَ»."
  - "«سُمَّار» جمع «سامِر» على «فُعَّال»، و«أَحْوَال» جمع «حَوْل» على «أَفْعال»، وهو جمع قليل الاستعمال في الظرف، ولذلك علّله صاحب اللسان بالمبالغة [@lisan، ج11 ص187]."
rhetoric:
  thesis: "أول كلام المرأة في المغامرة، وفيه خوفها كله: الفضيحة. فالشاعر لا يجعلها راغبة من أول الأمر، بل خائفة تدفعه، ليكون انقيادها بعد ذلك انتصارًا له."
  devices:
    - title: "الحوار"
      text: "يقطع السرد ويُسمع صوتها: «سَبَاكَ اللَّهُ إِنَّكَ فَاضِحِي». فيصير البيت مشهدًا لا خبرًا، ومثله في المعلقة: «فَقَالَتْ لَكَ الْوَيْلَاتُ إِنَّكَ مُرْجِلِي». وهذه قراءتنا."
    - title: "المبالغة في «أَحْوَالِي»"
      text: "جمع «حَوْل» ولم يقل «حولي»، فجعل حولها جهات كثيرة كلها مملوءة بالناس. وقد قال صاحب اللسان إنه «ذَهَب إِلى المُبالغة بِذَلِكَ»، «فَذَلِكَ أَذْهَبُ فِي تَعَذُّرِها عَلَيْهِ» [@lisan، ج11 ص187]، أي أبلغ في بيان صعوبة الوصول إليها."
    - title: "الاستفهام التقريري"
      text: "«أَلَسْتَ تَرَى» استفهام لا تريد به السؤال، بل أن يقرّ بما يرى: الناس حولها. والاستفهام التقريري أن يُسأل المخاطب عن أمر يعرفه ليعترف به."
  connection: "فيجيبها بقسم: «فَقُلْتُ يَمِينُ اللَّهِ أَبْرَحُ قَاعِدًا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَقَالَتْ / سَبَاكَلْلَا / هُ إِنْنَ / كَ فَاضِحِي = فعولن / مفاعيلن / فعولُ / مفاعلن — أَلَسْتَ / تَرَسْسُمْمَا / رَ وَنْنَا / سَ أَحْوَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر والأولى من العجز [@atiq، ص29]. و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "يأتي بعد «سَمَوْتُ إِلَيْهَا بَعْدَمَا نَامَ أَهْلُهَا» (20)، وهو من الأبيات 20–26 التي أوردها ابن قُتَيْبة بعد قوله: «ويعاب عليه تصريحه بالزنا والدّبيب إلى حرم الناس. والشعراء تتوقّى ذلك فى الشعر وإن فعلته» [@ibn-qutayba، ج1 ص135–136]. فالمرأة متزوجة، كما يظهر من البيت 26، وخوفها خوف الزانية من أن تُكشف."
