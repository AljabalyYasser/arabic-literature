first: "سِبَاطِ الْبَنَانِ وَالْعَرَانِينِ وَالْقَنَا"
second: "لِطَافِ الْخُصُورِ فِي تَمَامٍ وَإِكْمَالِ"
meaning: "يصف العذارى اللواتي دخل بيتهن في البيت السابق: أصابعهن طويلة ممتدة، وأنوفهن مستقيمة مرتفعة، وقاماتهن طويلة معتدلة، وخصورهن نحيلة، وأجسادهن مع ذلك تامّة مكتملة. أنشد صاحب اللسان البيت وقال: «أَراد بالقَنا القاماتِ»، ونقل قبله: «والقَناةُ عِنْدَ الْعَرَبِ القامةُ» [@lisan، ج15 ص204]. والسَّبْط في اللسان «الممتدُّ الَّذِي لَيْسَ فِيهِ تَعَقُّدٌ وَلَا نُتوء»، و«يُقَالُ لِلرَّجُلِ الطويلِ الأَصابعِ: إِنه لسَبْطُ الأَصابع» [@lisan، ج7 ص309]. ولم نجد للبيت شرحًا عند شرّاح القصيدة في مصادرنا، فبيان «فِي تَمَامٍ وَإِكْمَالِ» قراءتنا: نحول خصورهن ليس هزالًا، فهن ممتلئات الصدور والأرداف، وهذا ما يمدحونه في المرأة: خصر نحيل وعجيزة ضخمة، كما قال البَغْداديّ في صاحبة البيت 17 «لَطِيفَةُ طَيِّ الْكَشْحِ غَيْرُ مُفَاضَةٍ»: «وصفها بثلاثة أمور بهضم الخصر وضخامة الكفل والطيب» [@khizana، ج1 ص67]، والكَفَل العجيزة. فالمعنى بلغة اليوم: فتيات طويلات ممشوقات، دقيقات الأصابع والأنوف، نحيلات الخصور، ممتلئات الصدور والأرداف، كاملات الأنوثة."
vocabulary:
  - term: "سِبَاطِ"
    text: "جمع سَبْط، وهو «الممتدُّ الَّذِي لَيْسَ فِيهِ تَعَقُّدٌ وَلَا نُتوء» [@lisan، ج7 ص309]."
  - term: "الْبَنَانِ"
    text: "«الأَصابع: وَقِيلَ: أَطرافها» [@lisan، ج13 ص59]."
  - term: "الْعَرَانِينِ"
    text: "جمع عِرْنين، و«عِرْنينُ الأَنف: تَحْتَ مُجْتَمَع الْحَاجِبَيْنِ، وَهُوَ أَول الأَنف حَيْثُ يَكُونُ فِيهِ الشَّمَمُ»، وقيل: «والعِرْنينُ الأَنف كُلُّهُ» [@lisan، ج13 ص282]. والشَّمَم ارتفاع قصبة الأنف واستواؤها، وهو مدح."
  - term: "الْقَنَا"
    text: "القامات: «أَراد بالقَنا القاماتِ» [@lisan، ج15 ص204]. والقناة في الأصل الرمح، فسُمّيت القامة بها لطولها واستقامتها."
  - term: "لِطَافِ الْخُصُورِ"
    text: "نحيلات الأوساط، و«الخَصْرُ: وَسَطُ الإِنسان، وَجَمْعُهُ خُصُورٌ» [@lisan، ج4 ص240]."
  - term: "فِي تَمَامٍ وَإِكْمَالِ"
    text: "في تمام الخِلقة وكمال الجسد."
syntax:
  - "«سِبَاطِ الْبَنَانِ»: نعت لـ«عَذَارَى» في البيت السابق مجرور مثله، وهو مضاف و«البنانِ» مضاف إليه. والإضافة لفظية، لأن «سِباط» صفة مشبهة أضيفت إلى ما هو فاعلها في المعنى، والتقدير: سَبُطَت بنانُهن."
  - "«وَالْعَرَانِينِ وَالْقَنَا»: معطوفان على «البنان» مجروران، و«القنا» مجرور بكسرة مقدرة على الألف. فالصفة «سِباط» واقعة على الثلاثة: بنان سباط، وعرانين سباط، وقنًا سباط."
  - "«لِطَافِ الْخُصُورِ»: نعت ثانٍ لـ«عذارى» مجرور، مضاف إلى «الخصور» إضافة لفظية كذلك."
  - "«فِي تَمَامٍ وَإِكْمَالِ»: جار ومجرور متعلق بمحذوف نعت ثالث لـ«عذارى»، و«إكمالِ» معطوف على «تمامٍ» مجرور."
morphology:
  - "«سِبَاط» جمع «سَبْط» على «فِعال»، وفي اللسان: «مِنْ قَوْمٍ سِباطٍ إِذا كَانَ حَسَنَ القَدِّ وَالِاسْتِوَاءِ» [@lisan، ج7 ص309]."
  - "«عَرَانِين» جمع «عِرْنِين» على «فَعالِين»، و«الْقَنَا» جمع «قَناة»."
  - "«لِطَاف» جمع «لَطِيف» على «فِعال»، و«خُصُور» جمع «خَصْر» على «فُعُول» [@lisan، ج4 ص240]."
  - "«تَمَام» مصدر «تَمَّ» المضعّف على «فَعال»، و«إِكْمَال» مصدر «أَكْمَلَ» على «إِفْعال»."
rhetoric:
  thesis: "بعد أن ذكر بيت العذارى وسيدتهن الممتلئة المكسال (33)، يصف العذارى أنفسهن: طول واستقامة في الأصابع والأنوف والقامات، ونحول في الخصر، وامتلاء في سائر الجسد. فسيدتهن بدينة لا تبرح مجلسها، وهن ممشوقات."
  devices:
    - title: "صفة واحدة لثلاثة أعضاء في «سِبَاطِ الْبَنَانِ وَالْعَرَانِينِ وَالْقَنَا»"
      text: "جمع الأصابع والأنوف والقامات تحت صفة واحدة هي الامتداد بلا عُقَد، فرأى في أجسادهن من الإصبع إلى القامة خطًّا واحدًا مستويًا. وهذه قراءتنا."
    - title: "الاستعارة في «الْقَنَا»"
      text: "سمّى القامات قنًا، والقناة الرمح، فاستعار اسم الرمح للقامة لطولها واستقامتها. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وقد شاع هذا حتى قال صاحب اللسان: «والقَناةُ عِنْدَ الْعَرَبِ القامةُ» [@lisan، ج15 ص204]."
    - title: "التتميم في «فِي تَمَامٍ وَإِكْمَالِ»"
      text: "لو وقف عند «لِطَافِ الْخُصُورِ» لجاز أن يُظن أن نحولهن هزال، فأتمّ المعنى بأنهن في تمام وكمال. وهذا ما يسميه ابن رَشِيق التتميم: «أن يحاول الشاعر معنى، فلا يدع شيئاً يتم به حسنه إلا أورده وأتى به: إما مبالغة، وإما احتياطاً واحتراساً من التقصير» [@ibn-rashiq، ج2 ص50]. والاحتراس هنا أن يدفع الشاعر عن كلامه فهمًا لا يريده. وتطبيقه على البيت قراءتنا."
  connection: "ثم يصف فتنتهن: «نَوَاعِمَ يُتْبِعْنَ الْهَوَى سُبُلَ الرَّدَى / يَقُلْنَ لِأَهْلِ الْحِلْمِ ضُلٌّ بِتَضْلَالِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "سِبَاطِلْ / بَنَانِ وَلْ / عَرَانِي / نِ وَلْقَنَا = فعولن / مفاعلن / فعولن / مفاعلن — لِطَافِلْ / خُصُورِ فِي / تَمَامِنْ / وَإِكْمَالِي = فعولن / مفاعلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «مفاعيلن» الأولى من الصدر ومن العجز، فصارت «مفاعلن» في «بَنَانِ وَلْ» و«خُصُورِ فِي»، وهو جائز في حشو الطويل: «كما يجوز في مفاعيلن في غير العروض والضرب القبض أيضًا مفاعلن» [@ahda-sabil، ص28]. والعروض مقبوضة «مفاعلن» كما هي في الطويل دائمًا [@atiq، ص29]، والضرب صحيح «مفاعيلن» [@atiq، ص30]. وتسقط همزة الوصل في «الْعَرَانِينِ» و«الْقَنَا» في درج الكلام، وأُشبعت كسرة اللام في القافية «إكمالِ» فنُطقت «إكمالي»."
context: "ثاني الأبيات الثلاثة في بيت العذارى (33–35): دخل البيت في يوم مطر (33)، ثم يصف أجساد العذارى في هذا البيت، ثم فتنتهن (35)، ثم ينقلب في البيت 36 «صَرَفْتُ الْهَوَى عَنْهُنَّ مِنْ خَشْيَةِ الرَّدَى». وقد أنشده صاحب اللسان كاملًا شاهدًا على أن القنا القامات [@lisan، ج15 ص204]. ويعود فيه إلى ما وصف به صاحبة الخلوة في البيت 17: نحول الخصر مع امتلاء الجسد."
