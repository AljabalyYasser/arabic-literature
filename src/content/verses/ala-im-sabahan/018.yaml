explained: false
first: تَنَوَّرْتُهَا مِنْ أَذْرِعَاتَ وَأَهْلُهَا
second: بِيَثْرِبَ أَدْنَى دَارِهَا نَظَرٌ عَالِي
vocabulary:
- term: تَنَوَّرْتُهَا
  text: نظرتُ إلى نارها من بعيد، «وإنما أراد بقلبه لا بعينه» [@suyuti-mughni، ج1 ص342].
- term: أَذْرِعَاتَ
  text: «بلدة بالشام» [@suyuti-mughni، ج1 ص342].
- term: يَثْرِبَ
  text: المدينة المنورة.
- term: أَدْنَى دَارِهَا نَظَرٌ عَالِي
  text: '«كيف أراها وأدنى دارها نظر مرتفع. وقيل معناه: أقرب دارها منا بعيد» [@suyuti-mughni، ج1 ص343].'
