first: "فَلَمَّا تَنَازَعْنَا الْحَدِيثَ وَأَسْمَحَتْ"
second: "هَصَرْتُ بِغُصْنٍ ذِي شَمَارِيخَ مَيَّالِ"
meaning: "فلما تبادلنا الحديث ولانت بعد امتناعها، جذبتُ إليّ غصنًا مائلًا كثير العذوق، يريد جسدها وشعرها. قال صاحب اللسان بعد إنشاد البيت: «قوله: تنازعنا الحديث أي حدثتني وحدثتها. وأسمحت: انقادت وتسهلت بعد صعوبتها. وهصرت: جذبت؛ وأراد بالغصن جسمها وقدها في تثنيه ولينه كتثني الغصن، وشبه شعرها بشماريخ النخل في كثرته والتفافه» [@lisan، ج5 ص265]. فبعد الحوار الذي خافت فيه الفضيحة وحلف هو ألا يبرح، صار الأمر إلى العناق."
vocabulary:
  - term: "تَنَازَعْنَا الْحَدِيثَ"
    text: "«أي حدثتني وحدثتها» [@lisan، ج5 ص265]."
  - term: "أَسْمَحَتْ"
    text: "«انقادت وتسهلت بعد صعوبتها» [@lisan، ج5 ص265]، وعن الأَصْمَعِيّ: «أسمحت أسهلت وانقادت» [@lisan، ج2 ص489]."
  - term: "هَصَرْتُ"
    text: "«جذبت» [@lisan، ج5 ص265]، والهَصْر: «أن تأخذ برأس شيء ثم تكسره إليك من غير بينونة» [@lisan، ج5 ص265]، أي تثنيه ولا تقطعه."
  - term: "شَمَارِيخَ"
    text: "«الشمراخ والشمروخ: العثكال الذي عليه البسر، وأصله في العذق وقد يكون في العنب» [@lisan، ج3 ص31]. والعِثْكال والعِذْق: العنقود من التمر، والبُسْر: التمر قبل أن يُرطب."
  - term: "مَيَّالِ"
    text: "كثير الميل، يتثنّى."
syntax:
  - "«فَلَمَّا»: ظرف بمعنى «حين» يقتضي جوابًا، وجوابه «هَصَرْتُ» في العَجُز."
  - "«تَنَازَعْنَا الْحَدِيثَ»: فعل وفاعل ومفعول به، و«وَأَسْمَحَتْ» معطوف عليه، وفاعله ضمير المرأة."
  - "«بِغُصْنٍ»: قال السُّيُوطيّ: «وهصرت بغصن: ثنيت غصنا، والباء زائدة» [@suyuti-mughni، ج1 ص343]. وفي اللسان عن الجَوْهَرِيّ: «هصرت الغصن وبالغصن إذا أخذت برأسه فأملته إليك» [@lisan، ج5 ص264]، فالفعل يتعدى بنفسه وبالباء."
  - "«ذِي شَمَارِيخَ»: نعت لـ«غصن»، و«شَمَارِيخَ» ممنوع من الصرف لأنه على صيغة منتهى الجموع، فجُرّ بالفتحة. و«مَيَّالِ» نعت ثانٍ."
morphology:
  - "«تَنَازَعْنَا» على «تَفَاعَلْنَا»، وهو بناء المشاركة: كل منهما يأخذ من الحديث ويعطي."
  - "«أَسْمَحَتْ» على «أَفْعَلَتْ»، وفي اللسان: «ويقال: أسمحت نفسه إذا انقادت» [@lisan، ج2 ص489]."
  - "«مَيَّال» على «فَعَّال»، من أبنية المبالغة."
  - "«شَمَارِيخ» جمع «شِمْراخ» على «فَعالِيل»."
rhetoric:
  thesis: "ذروة المغامرة: بعد خوفها من الفضيحة ويمينه ألا يبرح، يلين الحديث وتنقاد، فيمدّ يده إليها. ويقول ذلك بصورة من النخل: غصن مائل كثير العذوق."
  devices:
    - title: "الاستعارة"
      text: "في «بِغُصْنٍ ذِي شَمَارِيخَ» لم يقل: جذبتها وكأنها غصن، بل جعلها الغصن نفسه، وجعل شعرها شماريخه، كما فسّره صاحب اللسان. وتشبيه «القَدّ اللطيف بالغصن» عند عبد القاهر الجُرْجانيّ من التشبيه البيّن الذي يكون «من جهة الهيئة» [@asrar، ص90]، فلما ترك امرؤ القَيْس أداة التشبيه وأجرى اسم الغصن عليها صار استعارة، وهي عند عبد القاهر «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "ترشيح الاستعارة"
      text: "اختار للغصن فعلًا من معجمه: «هَصَرْتُ»، والهصر في أصله ثني الغصن إليك. فالفعل والمفعول كلاهما من صورة الشجرة، والمراد العناق. وهذا ما يسميه البلاغيون الترشيح: أن تُذكر مع الاستعارة صفة تلائم المستعار منه فتقوّيها."
    - title: "التدرّج"
      text: "في البيت ثلاث مراحل: «تَنَازَعْنَا الْحَدِيثَ»، ثم «وَأَسْمَحَتْ»، ثم «هَصَرْتُ». حديث، فانقياد، فعناق. وهذا التدرّج يجعل البيت حكاية قصيرة لا وصفًا، وهي قراءتنا."
  connection: "ثم يكمل في البيت التالي: «وصرنا إلى الحسنى ورقّ كلامنا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَلَمْمَا / تَنَازَعْنَلْ / حَدِيثَ / وَأَسْمَحَتْ = فعولن / مفاعيلن / فعولُ / مفاعلن — هَصَرْتُ / بِغُصْنِنْ ذِي / شَمَارِي / خَ مَيْيَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر والأولى من العَجُز [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "يأتي بعد الحوار والقسم (21–23): تقول «سباك الله إنك فاضحي»، فيقسم أنه لا يبرح، ثم يحلف لها «حلفة فاجر» أن الحي قد ناموا. وهو من الأبيات التي أوردها ابن قُتَيْبة بعد قوله: «ويعاب عليه تصريحه بالزنا والدّبيب إلى حرم الناس. والشعراء تتوقّى ذلك فى الشعر وإن فعلته» [@ibn-qutayba، ج1 ص135–136]، والدبيب إلى حرم الناس: التسلل ليلًا إلى نسائهم. وأنشده شوقي ضَيْف مع المقطع كله، ثم قال: «وكأن امرأ القيس هو الذى سبق إلى هذا الغزل الفاحش الصريح» [@deif، ج1 ص252]. وفي رواية السُّيُوطيّ يأتي هذا البيت وتاليه قبل «حلفت لها بالله حلفة فاجر» [@suyuti-mughni، ج1 ص341]."
