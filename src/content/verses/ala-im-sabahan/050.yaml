first: تَخَطَّفُ خِزَّانَ الشَّرَبَّةِ بِالضُّحَى
second: وَقَدْ جَحَرَتْ مِنْهَا ثَعَالِبُ أَوْرَالِ
vocabulary:
- term: خِزَّانَ
  text: 'جمع خُزَز، وهو «ولد الأرنب، وقيل: هو الذكر من الأرانب» [@lisan، ج5 ص345].'
- term: الشَّرَبَّةِ
  text: موضع [@lisan، ج1 ص493].
- term: جَحَرَتْ
  text: «توارت» [@suyuti-mughni، ج1 ص343]، أي دخلت جحورها.
- term: أَوْرَالِ
  text: «موضع» [@suyuti-mughni، ج1 ص343].
