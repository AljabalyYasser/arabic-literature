explained: false
first: لَيَالِيَ سَلْمَى إِذْ تُرِيكَ مُنَصَّبًا
second: وَجِيدًا كَجِيدِ الرِّئْمِ لَيْسَ بِمِعْطَالِ
vocabulary:
- term: مُنَصَّبًا
  text: أراد ثغرها المستوي المتّسق؛ ومن روى «مُقَصَّبًا» أراد شعرها المجعول ذوائب [@khizana، ج1 ص64].
- term: جِيدًا
  text: عنقًا.
- term: الرِّئْمِ
  text: الظبي.
- term: مِعْطَالِ
  text: «المرأة التي خلا جيدها من القلائد» [@khizana، ج1 ص64].
