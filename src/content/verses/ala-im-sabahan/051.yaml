first: "كَأَنَّ قُلُوبَ الطَّيْرِ رَطْبًا وَيَابِسًا"
second: "لَدَى وَكْرِهَا الْعُنَّابُ وَالْحَشَفُ الْبَالِي"
meaning: "يصف العُقاب التي شبّه بها فرسه في البيتين قبله: تكثر من صيد الطير وتحمل قلوبها إلى فراخها، فيجتمع عند وكرها منها الطريّ واليابس [@sharrab، ج2 ص291]. فالطريّ منها يشبه العُنّاب، واليابس يشبه الحشف البالي."
vocabulary:
  - term: "وَكْرِهَا"
    text: "الوكر: عش الطائر، والضمير للعُقاب."
  - term: "الْعُنَّابُ"
    text: "ثمر شجر شائك، أحمر صغير في حجم النَّبْق."
  - term: "الْحَشَفُ"
    text: "أردأ التمر [@suyuti-mughni، ج1 ص344]، وهو ما يبس منه ولم يَطِب [@diwan-imru-al-qais، ص139]."
  - term: "الْبَالِي"
    text: "العتيق [@suyuti-mughni، ج1 ص344]."
syntax:
  - "«كَأَنَّ» حرف تشبيه ونصب، و«قُلُوبَ الطَّيْرِ» اسمها، و«الْعُنَّابُ» خبرها، و«الحشفُ» معطوف عليه، و«الْبَالِي» نعت للحشف."
  - "«رَطْبًا وَيَابِسًا» حالان من «قُلُوبَ الطَّيْرِ»، وعاملهما «كَأَنَّ» لما فيها من معنى الفعل، أي: أُشبِّه [@sharrab، ج2 ص291]. ولأن العامل حرف لا فعل، وجب أن تتأخر الحالان عنه [@suyuti-mughni، ج1 ص344]."
  - "«لَدَى وَكْرِهَا» ظرف متعلق بمحذوف حال، أي: كائنةً عند وكرها."
morphology:
  - "«رَطْب» صفة مشبهة، و«يابس» اسم فاعل من «يَبِسَ»."
  - "«الْعُنَّابُ» على وزن «فُعّال»، والواحدة «عُنّابة»."
  - "«قُلُوبَ» جمع «قلب» على «فُعول»، و«الطَّيْرِ» اسم جمع."
rhetoric:
  thesis: "بيت واحد فيه تشبيهان: القلوب الطرية بالعُنّاب، واليابسة بالحشف. ولأجل هذا الاقتصاد عدّه المُبَرِّد أحسن ما جاء في التشبيه."
  devices:
    - title: "تشبيه شيئين بشيئين"
      text: "قال المُبَرِّد: «فأحسن ما جاء، بإجماع الرواة، ما مرّ لامرئ القَيْس في كلام مختصر، أي بيت واحد، من تشبيه شيء في حالتين مختلفتين بشيئين مختلفين» [@kamil، ج3 ص25]. وكان التشبيه قبله شيئًا بشيء في البيت، «فشبّه شيئين بشيئين في بيت واحد، واتبعه الشعراء في ذلك» [@ibn-rashiq، ج1 ص290]."
    - title: "اللفّ والنشر المرتب"
      text: "ذكر المشبهين أولًا، ثم المشبه بهما على ترتيبهما: فالعُنّاب راجع إلى الرطب، والحشف إلى اليابس [@suyuti-mughni، ج1 ص344]. قال ابن رَشِيق: «قابل الرطب أولًا بالعناب مقدمًا، وقابل اليابس ثانيًا بالحشف تاليًا» [@ibn-rashiq، ج2 ص19]."
    - title: "الإيجاز"
      text: "اعترض معترض: هلّا فصّل فقال: كأنه رطبًا العُنّاب، وكأنه يابسًا الحشف؟ فأجاب المُبَرِّد: «العربي الفصيح الفطن اللقن يرمي بالقول مفهومًا، ويرى ما بعد ذلك من التكرير عِيًّا» [@kamil، ج3 ص25]."
  connection: "وتحدّى البيت من جاء بعده. حُكي عن بشّار بن بُرْد أنه قال: «ما قرّ بي القرار مذ سمعت قول امرئ القَيْس... حتى صنعت: كَأَنَّ مُثَارَ النَّقْعِ فَوْقَ رُؤُوسِنَا / وَأَسْيَافَنَا لَيْلٌ تَهَاوَى كَوَاكِبُهُ» [@ibn-rashiq، ج1 ص291]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنَ / قُلُوبَطْ طَيْ / رِ رَطْبَنْ / وَيَابِسَنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — لَدَى وَكْ / رِهَلْ عُنْنَا / بُ وَلْ حَ / شَفُلْ بَالِي = فعولن / مفاعيلن / فعولُ / مفاعيلن"
  note: "العَرُوض مقبوضة «مفاعلن» كما تلزم في الطويل، والضرب صحيح «مفاعيلن» كضرب المطلع [@atiq، ص29–30]. وجاءت «فعولن» مقبوضة مرتين، وكلاهما جائز في حشو الطويل [@atiq، ص29]."
context: "قبله يشبّه فرسه في سرعته بعُقاب «فَتْخاء الجناحين» تخطف الأرانب بالضحى [@diwan-imru-al-qais، ص139]، ثم يلتفت إلى وكرها. وعدّه ابن قُتَيْبة مما «يُستجاد من تشبيهه» [@ibn-qutayba، ج1 ص111]."
