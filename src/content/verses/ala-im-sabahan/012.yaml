first: "كَأَنَّ عَلَى لَبَّاتِهَا جَمْرَ مُصْطَلٍ"
second: "أَصَابَ غَضًى جَزْلًا وَكُفَّ بِأَجْذَالِ"
meaning: "كأن على أعلى صدرها، حيث تستقر القلادة، جمرًا أوقده رجل يستدفئ بالنار، وجد حطب الغَضَى الغليظ فأوقده، وأحاط ناره بأصول الحطب الكبيرة فبقيت متقدة. فسّر البَغْداديّ اللَّبّة فقال: «اللبة المنحر وموضع القلادة من الصدر والمراد هنا هو الثاني»، والغضى: «شجر خشبه من أصلب الخشب ولهذا يكون في فحمه صلابة»، ثم قال في «كُفّ» إنه أراد أنه جعل حول الجمر أجذالًا، «وهي أصول الحطب العظام» [@khizana، ج1 ص65–66]. وفي المراد بالجمر قولان. يرى شوقي ضَيْف أنه الحَلْي على صدرها: «يستعير للحلىّ على نحر صاحبته وتوهجه صورة الجمر» [@deif، ج1 ص264]، أي إن قلادتها من ذهب وحجارة حمر تتوهج على صدرها كأنها جمر. ويرى البَغْداديّ أنه يريد حرارة جسدها، فقال في هذا البيت والذي بعده: «بالغ في سخونة هذه المرأة في الشتاء حيث وصف الحلي الذي على لباتها بما ذكر في البيتين وهذا مدح في النساء كما إذا بردت في الصيف» [@khizana، ج1 ص66]، أي إن المرأة تُمدح بأن يكون جسدها دافئًا في الشتاء باردًا في الصيف. والمعنى بلغة اليوم، وهو قراءتنا تجمع القولين: هي نائمة إلى جنب صاحبها في الفراش في ليلة شتاء (11)، وعلى صدرها قلادتها تتوهج كالجمر، وجسدها حارّ يستدفئ به مضاجعها كما يستدفئ الرجل بجمر ناره."
vocabulary:
  - term: "لَبَّاتِهَا"
    text: "جمع لَبّة: «اللبة المنحر وموضع القلادة من الصدر والمراد هنا هو الثاني» [@khizana، ج1 ص65]. وفي اللسان: «واللَّبَّةُ: وَسَطُ الصَّدْر والمَنْحَر» [@lisan، ج1 ص733]. فهي أعلى الصدر تحت العنق، حيث تقع القلادة."
  - term: "مُصْطَلٍ"
    text: "المستدفئ بالنار: «والمصطلي اسم فاعل من اصطلى بالنار» [@khizana، ج1 ص65]."
  - term: "غَضًى"
    text: "«شجر خشبه من أصلب الخشب ولهذا يكون في فحمه صلابة» [@khizana، ج1 ص65]، فجمره يبقى طويلًا."
  - term: "جَزْلًا"
    text: "«والجزل الغليظ» [@khizana، ج1 ص65]. وفي اللسان: «الجَزْل: الحَطَب الْيَابِسُ، وَقِيلَ الغَلِيظ» [@lisan، ج11 ص109]."
  - term: "وَكُفَّ"
    text: "أُحيط. قال البَغْداديّ: «وكف بالبناء للمفعول من كففت الثوب أي خطت حاشيته» [@khizana، ج1 ص65]، أي جُعل للجمر حاشية من الحطب تحيط به كما تحيط الخياطة بطرف الثوب. ويفسرها شوقي ضَيْف بمعنى «مُدّ»، أي أُمدّت النار بالحطب [@deif، ج1 ص264]."
  - term: "بِأَجْذَالِ"
    text: "جمع جِذْل، و«هي أصول الحطب العظام جمع جذل بكسر الجيم وسكون الذال المعجمة» [@khizana، ج1 ص66]. وفي اللسان عن الجوهري: «الجِذْل وَاحِدُ الأَجْذال وَهِيَ أُصول الحَطَب الْعِظَامِ» [@lisan، ج11 ص106]."
syntax:
  - "«كَأَنَّ عَلَى لَبَّاتِهَا جَمْرَ مُصْطَلٍ»: «كأنّ» حرف تشبيه ونصب، و«على لبّاتها» جار ومجرور في محل رفع خبر «كأنّ» مقدم، و«جمرَ» اسمها مؤخر منصوب، وهو مضاف و«مُصْطَلٍ» مضاف إليه مجرور بكسرة مقدرة على الياء المحذوفة، لأنه اسم منقوص منوّن."
  - "«أَصَابَ غَضًى جَزْلًا»: قال البَغْداديّ: «وجملة أصاب غضى صفة لمصطل»، و«وأصاب وجد» [@khizana، ج1 ص65]. و«غضًى» مفعول به منصوب بفتحة مقدرة على الألف، و«جزلًا» نعت له."
  - "«وَكُفَّ بِأَجْذَالِ»: فعل ماض مبني للمجهول، ونائب الفاعل ضمير يعود على الجمر، و«بأجذالِ» جار ومجرور متعلق به، والجملة معطوفة على «أصاب»، فهي صفة ثانية في المعنى: جمرُ مصطلٍ وجد غضًى وأحاط ناره بالأجذال."
morphology:
  - "«لَبَّات» جمع «لَبَّة» جمع مؤنث سالمًا، وللمرأة لبّة واحدة، وقد جمعوها كما قال اللِّحْيانيّ: «إِنها لَحَسنةُ اللَّبَّاتِ؛ كأَنهم جَعَلوا كلَّ جُزْءٍ مِنْهَا لَبَّةً، ثُمَّ جَمَعُوا عَلَى هَذَا» [@lisan، ج1 ص733]."
  - "«مُصْطَلٍ» اسم فاعل من «اصْطَلَى» على «افْتَعَلَ»، من «صَلِيَ بالنار» ناقص يائي، وأصله «مُصْتَلِيٌ»: قُلبت تاء الافتعال طاءً لأنها وقعت بعد الصاد، واستُثقلت الضمة على الياء فحُذفت، ثم حُذفت الياء لالتقاء الساكنين، فهو منقوص."
  - "«أَجْذَال» جمع «جِذْل» على «أَفْعال»، وفي اللسان: «وَالْجَمْعُ أَجذال وجِذال وجُذُول وجُذُولة» [@lisan، ج11 ص106]."
  - "«كُفَّ» ماضي «كَفَّ» المضعّف، مبني للمجهول على «فُعِلَ»، وأُدغمت عينه في لامه."
  - "«جَزْل» على «فَعْل»، صفة مشبهة، و«غَضًى» اسم مقصور منوّن تُقدّر عليه الحركات."
rhetoric:
  thesis: "بعد أن أضاء وجهها الفراش (11) ينزل إلى صدرها: ما عليه يتوهج كالجمر. فالضوء في البيت السابق، والحرارة في هذا البيت، ثم الريح التي تذكي الجمر في البيت 13."
  devices:
    - title: "التشبيه المركّب في «جَمْرَ مُصْطَلٍ أَصَابَ غَضًى جَزْلًا وَكُفَّ بِأَجْذَالِ»"
      text: "لم يشبّه ما على صدرها بجمر مطلق، بل بجمر رجل يستدفئ، اختار له أصلب الحطب، وأحاطه بالأجذال، ثم أتمّ الصورة في البيت التالي بريحين تهبّان عليه. فكل قيد يزيد الجمر توهجًا ودوامًا، والمقصود الصورة كلها لا الجمر وحده. وهذا ما يسميه عبد القاهر الجُرْجانيّ التشبيه المركّب، والمقصود منه عنده «أن يُرِيَك الهيئةَ التي تملأ النواظر عَجباً» [@asrar، ص193]. وتطبيقه على البيت قراءتنا."
    - title: "تشبيه لا استعارة في «كَأَنَّ»"
      text: "يقول شوقي ضَيْف إن الشاعر «يستعير للحلىّ» صورة الجمر، ويعدّ البيت من أمثلة الاستعارة القليلة في شعره [@deif، ج1 ص264]. لكن الشاعر صرّح بأداة التشبيه «كأنّ»، والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]، فهو في اصطلاحه تشبيه. وإنما يقترب من الاستعارة لأنه لم يسمّ الحلي، فجعل الجمر نفسه «على لبّاتها». وهذه قراءتنا."
    - title: "المبالغة في الحرارة"
      text: "قال البَغْداديّ: «بالغ في سخونة هذه المرأة في الشتاء»، واستشهد بقول الأعشى في مثل هذا المدح: «وَتَسْخُنُ لَيْلَةَ لَا يَسْتَطِيعُ / نُبَاحًا بِهَا الْكَلْبُ إِلَّا هَرِيرَا // وَتَبْرُدُ بَرْدَ رِدَاءِ الْعَرُوسِ / بِالصَّيْفِ رَقْرَقْتَ فِيهِ الْعَبِيرَا» [@khizana، ج1 ص66]. أي إنها دافئة في ليلة من البرد الشديد لا يقدر فيها الكلب على النباح فيكتفي بالهرير، وهو صوت دون النباح، وباردة في الصيف كرداء العروس الذي رُشّ عليه الطيب. فحرارة الجمر في بيت امرئ القَيْس مدح لجسدها لا ذمّ."
  connection: "ثم يتمّ صورة الجمر بالريح التي تذكيه: «وَهَبَّتْ لَهُ رِيحٌ بِمُخْتَلَفِ الصُّوَى / صَبًا وَشَمَالٌ فِي مَنَازِلِ قُفَّالِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْ نَ / عَلَى لَبْبَا / تِهَا جَمْ / رَ مُصْطَلِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — أَصَا بَ / غَضَنْ جَزْلَنْ / وَكُفْ فَ / بِأَجْذَالِي = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]. والعروض مقبوضة «مفاعلن» كما هي في الطويل دائمًا [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]، وأُشبعت كسرة اللام في القافية «بأجذالِ» فنُطقت «بأجذالي»."
context: "ثالث أبيات الذكرى التي بدأها بقوله «وَيَا رُبَّ يَوْمٍ قَدْ لَهَوْتُ وَلَيْلَةٍ» (10): في البيت 11 يضيء وجهها الفراش لضجيعها، وفي هذا البيت يتوهج ما على صدرها، ثم تهب الريح على الجمر في البيت 13. وقد شرحه البَغْداديّ مع الذي بعده، وجعلهما معًا في سخونتها [@khizana، ج1 ص65–66]، واستشهد به شوقي ضَيْف على الاستعارة في شعر امرئ القَيْس، وقال إنها قليلة، «ولكنها على كل حال مبثوثة فيها» [@deif، ج1 ص264]. وهو من الأبيات التي يكذّب بها بسباسة (9–17)، وهي جانب القصيدة الماجن."
variants:
  - reading: "أَصَابَ غَضًى جَزْلًا وَكُفَّ بِأَجْزَالِ"
    status: "نسخة العمل، ونراه خطأ في الطبع"
    note: "والرواية التي أثبتناها «بأجذال» بالذال رواية البَغْداديّ، وقد ضبطها فقال: «جمع جذل بكسر الجيم وسكون الذال المعجمة» [@khizana، ج1 ص66]، وبها أنشده شوقي ضَيْف [@deif، ج1 ص264]. و«بأجزال» بالزاي تكرار لـ«جزلًا» قبلها، ولا تفسرها حاشية نسخة العمل [@diwan-imru-al-qais، ص136]."
