first: "يُضِيءُ الْفِرَاشَ وَجْهُهَا لِضَجِيعِهَا"
second: "كَمِصْبَاحِ زَيْتٍ فِي قَنَادِيلِ ذُبَّالِ"
meaning: "وجه هذه المرأة يضيء الفراش للرجل الذي ينام معها، كما يضيء مصباح يُوقد بالزيت في قناديل لها فتائل. قال البَغْداديّ: «الفراش مفعول مقدم ووجهها الفاعل والمصباح السراج والذبال بضم الذال وتشديد الموحدة جمع ذبالة وهي الفتيلة» [@khizana، ج1 ص65]. والضجيع هو المضاجع، و«ضاجع الرجل جاريته إذا نام معها في شعار واحد، وهو ضجيعها وهي ضجيعته» [@lisan، ج8 ص219]، والشِّعار الثوب الذي يلي الجسد. ولم يقف الشرّاح عند الضجيع، فبيانه قراءتنا: الضجيع هنا هو الشاعر نفسه، يذكر ليلة من الليالي التي قال في البيت السابق إنه لها فيها بها، فهي معه في فراش واحد تحت غطاء واحد. فالمعنى بلغة اليوم: في الليل، وهي نائمة معي في الفراش، يشرق وجهها حتى يضيء الفراش حولي كأنه قنديل."
vocabulary:
  - term: "الْفِرَاشَ"
    text: "ما يُبسط للنوم، والمراد مضجعها الذي تنام فيه مع صاحبها."
  - term: "لِضَجِيعِهَا"
    text: "للذي ينام معها: «والضجيع: المضاجع»، و«ضاجع الرجل جاريته إذا نام معها في شعار واحد» [@lisan، ج8 ص219]."
  - term: "كَمِصْبَاحِ"
    text: "«والمصباح السراج» [@khizana، ج1 ص65]، أي المِسْرجة التي يُوقد فيها الزيت."
  - term: "قَنَادِيلِ"
    text: "جمع قِنْديل، وهو وعاء من زجاج يوضع فيه السراج. وفي اللسان أن الذُّبال هو «الذُّبال الَّذِي يُوضَعُ فِي مِشكاة الزُّجاجة الَّتِي يُسْتَصْبَح بِهَا» [@lisan، ج11 ص256]."
  - term: "ذُبَّالِ"
    text: "«جمع ذبالة، وهي الفتيلة» [@suyuti-mughni، ج1 ص342]. وفي اللسان: «يُقَالُ للفَتِيلة الَّتِي يُصْبَح بِهَا السِّرَاجُ ذُبَالَة وذبَّالة، وَجَمْعُهَا ذُبال وذُبَّال» [@lisan، ج11 ص256]."
syntax:
  - "«يُضِيءُ الْفِرَاشَ وَجْهُهَا»: «يضيء» فعل متعدٍّ هنا بمعنى يُنير، و«الفراشَ» مفعول به مقدم، و«وجهُها» فاعل مؤخر: «الفراش مفعول مقدم ووجهها الفاعل» [@khizana، ج1 ص65]."
  - "«لِضَجِيعِهَا»: جار ومجرور متعلق بـ«يضيء»."
  - "«كَمِصْبَاحِ زَيْتٍ»: الكاف حرف تشبيه، والجار والمجرور متعلق بمحذوف صفة لمصدر محذوف، والتقدير: يضيئه إضاءةً كإضاءة مصباح زيت."
  - "«فِي قَنَادِيلِ ذُبَّالِ»: متعلق بمحذوف صفة لـ«مصباح». وفيه قولان: قال السُّيُوطيّ: «والمعنى: في ذبال قناديل» [@suyuti-mughni، ج1 ص342]، أي إن الإضافة مقلوبة، والأصل فتائل في قناديل. وقال البَغْداديّ: «وفي بمعنى مع» [@khizana، ج1 ص65]، أي مصباح زيت مع قناديل."
morphology:
  - "«يُضِيء» مضارع «أَضَاءَ» على «أَفْعَلَ»، أجوف واوي من «الضَّوْء»."
  - "«ضَجِيع» على «فَعِيل» بمعنى «مُفاعِل»، أي المضاجِع [@lisan، ج8 ص219]."
  - "«مِصْبَاح» على «مِفْعال»، من أوزان اسم الآلة، من «الصُّبْح»."
  - "«قَنَادِيل» جمع «قِنْدِيل» على «فَعالِيل»، و«ذُبَّال» جمع «ذُبَّالة» [@lisan، ج11 ص256]."
rhetoric:
  thesis: "ينقل المشهد من الأيام والليالي إلى الفراش في الليل: المرأة التي لها بها في البيت السابق نائمة إلى جنب ضجيعها، ووجهها يضيء ظلام المضجع."
  devices:
    - title: "التشبيه في «كَمِصْبَاحِ زَيْتٍ»"
      text: "شبّه إشراق وجهها في الظلام بضوء مصباح الزيت. ووجه الشبه، وهو النور، يُرى بالعين، فهو من الضرب الذي يكون عند عبد القاهر الجُرْجانيّ «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]. وخصّ مصباح الزيت في القنديل، فلم يشبهها بنار تلتهب، بل بنور ساكن محفوظ في زجاجه يملأ المكان. وهذه قراءتنا."
    - title: "التقديم في «يُضِيءُ الْفِرَاشَ وَجْهُهَا»"
      text: "قدّم المفعول «الفراش» على الفاعل «وجهها»، فأول ما يسمعه السامع الفراش، أي موضع الخلوة. ويردّ عبد القاهر الجُرْجانيّ التقديم إلى العناية، ناقلًا قول سِيبَوَيْه: «كأنَّهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أَعْنى» [@dalail، ص107]. والمهم هنا أنها في الفراش. وهذه قراءتنا."
    - title: "الإخبار عن النفس بلفظ الغائب"
      text: "«لِضَجِيعِهَا»: لم يقل «يضيء لي الفراش»، بل جعل الضوء لضجيعها، فبقي هو وراء اللفظ، كما سيفعل في البيت 15 «إِذَا مَا الضَّجِيعُ ابْتَزَّهَا مِنْ ثِيَابِهَا». وهذه قراءتنا."
    - title: "صورة تتكرر عنده"
      text: "شبّه امرؤ القَيْس صاحبته في معلقته بالسراج أيضًا: «تُضِيءُ الظَّلَامَ بِالْعِشَاءِ كَأَنَّهَا / مَنَارَةُ مُمْسَى رَاهِبٍ مُتَبَتِّلِ»، وقال ابن الأَنْبارِيّ في شرحه: «وإذا برزت في الظلام استنار وجهها وظهر جمالها حتى يغلب الظلمة» [@ibn-al-anbari، ص67]. وفي رواية «قناديل آبال»، أي الرهبان، يقترب البيتان أكثر، فالسراج في الموضعين سراج راهب."
  connection: "ثم يصف ما على صدرها من حلي يتوهج كالجمر: «كَأَنَّ عَلَى لَبَّاتِهَا جَمْرَ مُصْطَلٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "يُضِي ءُلْ / فِرَاشَ وَجْ / هُهَا لِ / ضَجِيعِهَا = فعولن / مفاعلن / فعولُ / مفاعلن — كَمِصْ بَا / حِ زَيْتِنْ فِي / قَنَادِي / لِ ذُبْبَالِي = فعولن / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر [@atiq، ص29]، ودخل «مفاعيلن» الثانية منه فصارت «مفاعلن» في «فِرَاشَ وَجْ»، وهو جائز في حشو الطويل: «كما يجوز في مفاعيلن في غير العروض والضرب القبض أيضًا مفاعلن» [@ahda-sabil، ص28]. والعروض مقبوضة كما هي دائمًا [@atiq، ص29]. وجاء العجز تامًّا بلا زحاف، والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "ثاني الأبيات في الذكرى التي بدأها بقوله «وَيَا رُبَّ يَوْمٍ قَدْ لَهَوْتُ وَلَيْلَةٍ» (10): هناك ذكر اللهو، وهنا يضع المرأة في الفراش مع ضجيعها، ثم يصف حليها في البيت 12. وقد أنشد صاحب اللسان عجزه شاهدًا على «ذُبَّال» [@lisan، ج11 ص256]، وشرحه البَغْداديّ والسُّيُوطيّ مع أبيات القصيدة [@khizana، ج1 ص65] [@suyuti-mughni، ج1 ص342]. وهو من الأبيات التي يكذّب بها بَسْباسة (9–17)، وهي جانب القصيدة الماجن."
variants:
  - reading: "كَمِصْبَاحِ زَيْتٍ فِي قَنَادِيلِ آبَالِ"
    status: "رواية يذكرها البَغْداديّ"
    note: "قال: «ويروى في قناديل آبال جمع أبيل كشريف وأشراف وهو الراهب» [@khizana، ج1 ص65]. أي في قناديل الرهبان، وهي التي تبقى موقدة في الصوامع طوال الليل."
