first: وَهَلْ يَعِمَنْ إِلَّا سَعِيدٌ مُخَلَّدٌ
second: قَلِيلُ الْهُمُومِ مَا يَبِيتُ بِأَوْجَالِ
vocabulary:
- term: مُخَلَّدٌ
  text: '«الطويل العمر الرخيّ البال» عند العسكري، وقيل: الذي لم يَشِب [@khizana، ج1 ص61].'
- term: أَوْجَالِ
  text: جمع وَجَل، وهو الخوف [@suyuti-mughni، ج1 ص342].
