first: وَتَحْسِبُ سَلْمَى لَا تَزَالُ تَرَى طَلًا
second: مِنَ الْوَحْشِ أَوْ بَيْضًا بِمَيْثَاءَ مِحْلَالِ
vocabulary:
- term: طَلًا
  text: ولد الظبية [@khizana، ج1 ص63].
- term: بَيْضًا
  text: بيض النعام، وأراد «البياض والملاسة والنعومة» [@khizana، ج1 ص63].
- term: مَيْثَاءَ
  text: «الأرض السهلة» [@khizana، ج1 ص63].
- term: مِحْلَالِ
  text: يُكثر القوم النزول فيها [@khizana، ج1 ص63].
