first: "فَلَوْ أَنَّ مَا أَسْعَى لِأَدْنَى مَعِيشَةٍ"
second: "كَفَانِي وَلَمْ أَطْلُبْ قَلِيلٌ مِنَ الْمَالِ"
meaning: "لو كان سعيي لأدنى ما يُعاش به، لكفاني قليل من المال، ولم أطلب ما أطلبه. والمطلوب عنده الملك، كما فهم سِيبَوَيْه [@sibawayh، ج1 ص79]. لكنه لا يسعى لأدنى معيشة، كما يقول في البيت التالي."
vocabulary:
  - term: "أَسْعَى"
    text: "أعمل وأجتهد في الطلب."
  - term: "أَدْنَى مَعِيشَةٍ"
    text: "أقل ما يُعاش به وأقربه منالًا."
syntax:
  - "«لو» حرف امتناع لامتناع. و«مَا» مصدرية، و«أَنَّ» وما بعدها في تأويل مصدر فاعل لفعل محذوف، تقديره: لو ثبت أن سعيي لأدنى معيشة. و«لِأَدْنَى مَعِيشَةٍ» متعلق بمحذوف خبر «أَنَّ» [@sharrab، ج2 ص213]."
  - "«كَفَانِي» جواب «لو»، و«قَلِيلٌ» فاعله. وتقدّم فعلان هما «كَفَانِي» و«لم أطلب» على اسم واحد، لكن البيت ليس من باب التنازع؛ لأن شرط التنازع أن يصح توجه الفعلين إلى الاسم مع بقاء المعنى صحيحًا، وليس الأمر هنا كذلك [@sharrab، ج2 ص213]."
  - "قال سِيبَوَيْه: «فإنما رفع لأنه لم يجعل القليل مطلوبًا، وإنما كان المطلوب عنده الملك، وجعل القليل كافيًا، ولو لم يرد ونصب فسد المعنى» [@sibawayh، ج1 ص79]. فمفعول «أَطْلُبْ» محذوف، وهو الملك."
morphology:
  - "«أدنى» اسم تفضيل على «أفعل» من «دنا يدنو»، وآخره ألف مقصورة."
  - "«مَعِيشَةٍ» مصدر ميمي من «عاش يعيش» على «مَفْعِلة»."
  - "«أَسْعَى» مضارع «سعى»، معتل الآخر بالألف."
rhetoric:
  thesis: "البيت شرط يُنقض في البيت الذي بعده: لو كنت أطلب العيش لكفاني القليل. فهو يفترض أمرًا ممتنعًا ليعلن بعده ما يطلبه حقًّا."
  devices:
    - title: "الامتناع بـ«لو»"
      text: "«لو» تدل على أن سعيه لأدنى معيشة لم يقع، ولذلك جاء الاستدراك بعده: «وَلَكِنَّمَا أَسْعَى لِمَجْدٍ مُؤَثَّلٍ»."
    - title: "النحو يكشف المعنى"
      text: "رفع «قَلِيلٌ» يجعله كافيًا لا مطلوبًا؛ ولو نُصب لصار المعنى أنه يطلب القليل، وهو نقيض ما أراد [@sibawayh، ج1 ص79]."
    - title: "الفخر"
      text: "عدّ السُّيُوطيّ هذا البيت «أفخر ما قيل» [@suyuti-mughni، ج1 ص267]."
  connection: "ويأتي الاستدراك في البيت التالي: «وَلَكِنَّمَا أَسْعَى لِمَجْدٍ مُؤَثَّلٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَلَوْ أَنْ / نَ مَا أَسْعَى / لِأَدْنَى / مَعِيشَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — كَفَانِي / وَلَمْ أَطْلُبْ / قَلِيلُنْ / مِنَلْ مَالِي = فعولن / مفاعيلن / فعولن / مفاعيلن"
  note: "جاءت تفعيلات الحَشْو كلها تامة، والعَرُوض مقبوضة «مفاعلن» كما تلزم في الطويل [@atiq، ص29]."
context: "من أشهر أبياته، ويستشهد به النحاة منذ سِيبَوَيْه [@sibawayh، ج1 ص79]."
variants:
  - reading: "وَلَوْ أَنَّمَا أَسْعَى لِأَدْنَى مَعِيشَةٍ"
    status: "رواية مغني اللبيب"
    note: "كذا أنشده السُّيُوطيّ في شواهد «لو» [@suyuti-mughni، ج2 ص642]، و«مَا» فيه كافّة لا مصدرية."
