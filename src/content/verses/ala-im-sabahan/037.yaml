first: "كَأَنِّيَ لَمْ أَرْكَبْ جَوَادًا لِلَذَّةٍ"
second: "وَلَمْ أَتَبَطَّنْ كَاعِبًا ذَاتَ خَلْخَالِ"
meaning: "كأني ما ركبت فرسًا كريمًا للصيد واللهو، ولا غشيت فتاة ناهدًا تلبس الخلخال. يتحسر على لذات مضت، حتى صارت كأنها لم تكن."
vocabulary:
  - term: "جَوَادًا"
    text: "الفرس السريع الكريم."
  - term: "لِلَذَّةٍ"
    text: "«اللذة التي ذكرها إنما هي الصيد، هكذا قال العلماء» [@ibn-rashiq، ج1 ص259]."
  - term: "أَتَبَطَّنْ"
    text: "أغشى، وهو ما سمّاه ابن رَشِيق «غشيانه النساء» [@ibn-rashiq، ج1 ص259]."
  - term: "كَاعِبًا"
    text: "التي نهد ثديها [@diwan-imru-al-qais، ص138]."
  - term: "خَلْخَالِ"
    text: "حلية تلبسها المرأة في ساقها، وهي من علامات الترف."
syntax:
  - "«كَأَنِّيَ» حرف تشبيه ونصب، والياء اسمه، وجملة «لَمْ أَرْكَبْ» في محل رفع خبره."
  - "«جَوَادًا» مفعول به. و«لِلَذَّةٍ» جار ومجرور متعلق بـ«أركب»، واللام للتعليل."
  - "«وَلَمْ أَتَبَطَّنْ» معطوفة على «لم أركب». و«كَاعِبًا» مفعول به، و«ذَاتَ» نعت له منصوب، و«خَلْخَالِ» مضاف إليه."
morphology:
  - "«أَتَبَطَّنْ» مضارع «تبطّن» على «تفعّل»، من البطن."
  - "«كَاعِب» اسم فاعل من «كعب»، ولم تلحقه التاء لأنه وصف خاص بالمرأة."
  - "«خَلْخَال» على «فَعْلال»."
rhetoric:
  thesis: "يعدّ لذات الشباب بصيغة النفي بعد «كأنّ»: فهو لم ينسها، لكنها بعدت حتى صارت كأنها لم تكن. ويرى شوقي ضيف في هذا البيت وتاليه إحساسًا بما كان ينتظره بعد مقتل أبيه [@deif، ج1 ص258]."
  devices:
    - title: "«كأنّ» للتحسر"
      text: "لم يقل: قد ذهبت أيام الصيد والنساء، بل قال: «كأني لم أركب». فالتشبيه هنا تشبيه حاله اليوم بحال من لم يعرف هذه اللذات قط، وفيه من الحسرة أكثر مما في الخبر الصريح."
    - title: "الجمع بين معنيين"
      text: "جمع في البيت الصيد والنساء. قال ابن رَشِيق: «فجمع في البيت معنيين، ولو نظمه على ما قال المعترض لنقص فائدة عظيمة، وفضيلة شريفة تدل على السلطان» [@ibn-rashiq، ج1 ص259]. يريد أن الصيد والنساء معًا حياة الملوك وأبنائهم، فهما معًا صورة لترف ابن الملك."
    - title: "الكناية"
      text: "قال «ذات خلخال» ولم يقل: غنية مترفة. فالخلخال يدل على ترفها كما يدل «نؤوم الضحى» عند عبد القاهر على أن المرأة «مترفة مخدومة، لها من يكفيها أمرها» [@dalail، ص66]."
  connection: "يكمل البيت التالي عدّ اللذات: الخمر والحرب. والبيتان عند النقاد وحدة واحدة، تجادلوا في ترتيبها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْ نِ / يَ لَمْ أَرْكَبْ / جَوَادَنْ / لِلَذْذَتِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — وَلَمْ أَ / تَبَطْطَنْ كَا / عِبَنْ ذَا / تَ خَلْخَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر والعَجُز [@atiq، ص29]. ولا يستقيم الوزن إلا بفتح الياء في «كأنّيَ»، كما ضبطها الديوان [@diwan-imru-al-qais، ص138]. والعَرُوض مقبوضة «مفاعلن» والضرب صحيح «مفاعيلن» [@atiq، ص29–30]."
context: "قبله يذكر أنه صرف الهوى عن النساء «من خشية الردى» [@diwan-imru-al-qais، ص138]. ثم يأتي هذا البيت وتاليه، فيتحول الفخر بالشباب إلى حسرة عليه. ويقول شوقي ضيف إنه «كتب لامرئ القَيْس أن لا تجري حياته على هذه الوتيرة من الفراغ»، فقد قُتل أبوه، «وكأنه كان يحس ما ينتظره» حين قال هذين البيتين [@deif، ج1 ص258]."
