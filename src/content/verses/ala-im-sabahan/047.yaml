first: فَجَالَ الصُّوَارُ وَاتَّقَيْنَ بِقَرْهَبٍ
second: طَوِيلِ الْقَرَا وَالرَّوْقِ أَخْنَسَ ذَيَّالِ
vocabulary:
- term: قَرْهَبٍ
  text: «المسنّ الضخم» من الثيران [@lisan، ج1 ص671].
- term: الْقَرَا وَالرَّوْقِ
  text: 'القرا: الظهر، والرَّوْق: القرن.'
- term: أَخْنَسَ
  text: قصير الأنف متأخره.
- term: ذَيَّالِ
  text: طويل الذنب [@lisan، ج11 ص260].
