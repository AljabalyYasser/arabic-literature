first: "فَقُلْتُ يَمِينُ اللَّهِ أَبْرَحُ قَاعِدًا"
second: "وَلَوْ قَطَّعُوا رَأْسِي لَدَيْكِ وَأَوْصَالِي"
meaning: "فأجبتها: أحلف بالله لا أبرح جالسًا عندكِ، ولو قطّع أهلك رأسي وأعضائي هنا بين يديكِ. فهو يرفض أن يخرج قبل أن ينال منها ما جاء له، ويجعل الموت أهون عليه من الانصراف. قال السُّيُوطيّ: «ويمين الله: مبتدأ وخبره محذوف، أي على وأبرح على حذف لا، أي لا أبرح»، و«وأوصال: جمع وصل، وهي المفاصل» [@suyuti-mughni، ج1 ص343]."
vocabulary:
  - term: "يَمِينُ اللَّهِ"
    text: "قسمٌ بالله، أي: يمين الله عليّ."
  - term: "أَبْرَحُ قَاعِدًا"
    text: "أي لا أبرح، أي لا أزال قاعدًا، «على حذف لا» [@suyuti-mughni، ج1 ص343]."
  - term: "أَوْصَالِي"
    text: "مفاصلي وأعضائي: «وأوصال: جمع وصل، وهي المفاصل» [@suyuti-mughni، ج1 ص343]."
syntax:
  - "«يَمِينُ اللَّهِ»: مبتدأ، وخبره محذوف، كما قال السُّيُوطيّ: «أي على» [@suyuti-mughni، ج1 ص343]، أي: يمينُ الله عليّ."
  - "«أَبْرَحُ قَاعِدًا»: جواب القسم، وفيه «لا» النافية محذوفة: لا أبرح. و«أبرح» هنا فعل ناقص بمعنى «أزال»، واسمه ضمير المتكلم، و«قاعدًا» خبره. وحذف «لا» في جواب القسم إذا كان الفعل مضارعًا جائز، لأن المثبت لا يأتي في جواب القسم بغير لام ونون."
  - "«وَلَوْ قَطَّعُوا»: الواو حالية، و«لو» حرف شرط بمعنى «إنْ» هنا، وجوابه محذوف يدل عليه ما قبله. و«رأسي» مفعول به، و«أوصالي» معطوف عليه، و«لديكِ» ظرف متعلق بـ«قطّعوا»."
morphology:
  - "«قَطَّعُوا» على «فَعَّلَ» من «قَطَعَ»، والتضعيف للتكثير: قطّعوني قطعًا كثيرة."
  - "«أَوْصَال» جمع «وُصْل» على «أَفْعال»."
  - "«أَبْرَحُ» مضارع «بَرِحَ» الناقص، وهو من أخوات «كان» إذا سبقه نفي."
rhetoric:
  thesis: "جوابه على خوفها: لا خوف عنده، ولا خروج. فهي تخاف الفضيحة، وهو يقابل خوفها بالاستهانة بالموت. وبهذه الجرأة يغلبها في البيتين 24–25."
  devices:
    - title: "الحذف في جواب القسم"
      text: "قال «أَبْرَحُ» وأراد «لا أبرح»، فحذف أداة النفي، والقسم يدل عليها. وقد أورده ابن هشام شاهدًا على ذلك كما يذكر السُّيُوطيّ [@suyuti-mughni، ج1 ص343]. والحذف عند عبد القاهر الجُرْجانيّ مما «ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "المبالغة"
      text: "«وَلَوْ قَطَّعُوا رَأْسِي لَدَيْكِ وَأَوْصَالِي»: لا يكفيه القتل، بل التقطيع، ولا في مكان آخر، بل عندها. فالمبالغة تجعل القسم دعوى حب وجرأة معًا. وهذه قراءتنا."
  connection: "ثم يزيد بيمين أخرى كاذبة: «حَلَفْتُ لَهَا بِاللَّهِ حَلْفَةَ فَاجِرٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَقُلْتُ / يَمِينُلْلَا / هِ أَبْرَ / حُ قَاعِدَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَلَوْ قَطْ / طَعُوا رَأْسِي / لَدَيْ كِ / وَأَوْصَالِي = فعولن / مفاعيلن / فعولُ / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة من الصدر والثالثة من العجز [@atiq، ص29]. و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "من الأبيات 20–26 التي أوردها ابن قُتَيْبة شاهدًا على «تصريحه بالزنا والدّبيب إلى حرم الناس» [@ibn-qutayba، ج1 ص135–136]. والبيت من شواهد النحاة على حذف «لا» في جواب القسم، أورده ابن هشام في «التوضيح» كما يقول السُّيُوطيّ: «وقد أورده المصنف في التوضيح شاهدا لذلك» [@suyuti-mughni، ج1 ص343]."
