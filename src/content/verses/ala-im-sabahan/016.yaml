first: "كَحِقْفِ النَّقَا يَمْشِي الْوَلِيدَانِ فَوْقَهُ"
second: "بِمَا احْتَسَبَا مِنْ لِينِ مَسٍّ وَتَسْهَالِ"
meaning: "عجيزتها ككثيب الرمل المعوجّ، يمشي فوقه صبيّان فيكتفيان بما يجدان فيه من لين ولا يؤذيهما. قال البَغْداديّ على روايته «كدعص النقا»: «أراد تشبيه عجزها بالدعص لعظمه حتى أن ولدين يمكنهما أن يلعبا فوقه من غير ضرر عليهما للينه وسهولته» [@khizana، ج1 ص68]. والدِّعْص: الكومة من الرمل. فالبيت تتمة صورتها في الخلوة: امرأة لينة، عظيمة العجيزة، يغري لينها باللمس. والمعنى بلغة اليوم: عجيزتها العارية في الفراش كبيرة طرية، يجد مضاجعها في لمسها من اللين ما يجده الصبيان في الرمل الذي يمشيان عليه."
vocabulary:
  - term: "حِقْفِ"
    text: "«الحقف من الرمل: المعوج» [@lisan، ج9 ص52]."
  - term: "النَّقَا"
    text: "«والنقا الكثيب من الرمل» [@khizana، ج1 ص68]."
  - term: "الْوَلِيدَانِ"
    text: "«والوليدان الصبيان» [@khizana، ج1 ص68]."
  - term: "احْتَسَبَا"
    text: "اكتفيا، وفي شرح البَغْداديّ: «واحتسب اكتفى» [@khizana، ج1 ص68]."
  - term: "تَسْهَالِ"
    text: "«والتسهال السهولة» [@khizana، ج1 ص68]."
syntax:
  - "«كَحِقْفِ النَّقَا»: الكاف للتشبيه، والجار والمجرور في موضع نصب صفة لـ«هونةً» في البيت السابق أو حال بعد حال، والمشبَّه محذوف، وهو عجيزتها كما فسّره البَغْداديّ."
  - "«يَمْشِي الْوَلِيدَانِ فَوْقَهُ»: جملة في موضع الحال من «حقف النقا»، و«فَوْقَهُ» ظرف متعلق بـ«يمشي»."
  - "«بِمَا احْتَسَبَا»: الباء متعلقة بـ«يمشي»، و«ما» موصولة، وجملة «احتسبا» صلتها، و«مِنْ لِينِ مَسٍّ وَتَسْهَالِ» بيان لـ«ما»: يمشيان مكتفيَين بما وجدا من لين."
morphology:
  - "«حِقْف» جمعه «أحقاف وحقوف وحقاف وحقفة» [@lisan، ج9 ص52]."
  - "«احْتَسَبَا» ماضٍ على «افْتَعَلَ» من «حَسَبَ»، والألف ضمير المثنى."
  - "«تَسْهَال» مصدر على «تَفْعال» بفتح التاء، وهو بناء يفيد الكثرة."
  - "«الْوَلِيدَان» مثنى «وَلِيد» على «فَعِيل» بمعنى مفعول: المولود الصغير."
rhetoric:
  thesis: "يشبّه عجيزتها بكثيب الرمل، وهو من مألوف التشبيه عندهم، ثم يزيد في المشبه به صورة صبيين يمشيان عليه، فيجعل اللين شيئًا يُرى."
  devices:
    - title: "التشبيه"
      text: "«كَحِقْفِ النَّقَا» تشبيه من جهة الصورة: العِظَم والاستدارة واللين. وهو عند عبد القاهر الجُرْجانيّ من التشبيه الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل»، كتشبيه الشيء بغيره «من جهة الصُّورة والشكل» [@asrar، ص90]."
    - title: "الزيادة في المشبه به"
      text: "لو اقتصر على «كَحِقْفِ النَّقَا» لكان تشبيهًا معروفًا. لكنه أضاف «يَمْشِي الْوَلِيدَانِ فَوْقَهُ»، فجعل لين الرمل مشهدًا: صبيان يلعبان عليه ولا يؤذيهما، كما شرح البَغْداديّ. فاللين في المشبه به هو المقصود، والمشهد يجعله محسوسًا. وهذه قراءتنا."
    - title: "حذف المشبه"
      text: "لم يذكر العجيزة، بل ترك السامع يفهمها من سياق البيت السابق، وهو موضع تكون فيه الإشارة أبلغ من التسمية. قال عبد القاهر في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
  connection: "ثم يعود إلى قوامها: «لطيفة طي الكشح غير مفاضة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَحِقْ فِنْ / نَقَا يَمْشِلْ / وَلِيدَا / نِ فَوْقَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — بِمَحْ تَ / سَبَا مِنْ لِي / نِ مَسْسِنْ / وَتَسْهَالِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من العَجُز [@atiq، ص29]. والضرب صحيح «مفاعيلن» [@atiq، ص30]. وتسقط همزة الوصل في «احتسبا» في درج الكلام."
context: "البيت الثاني من صفة المرأة في الخلوة بعد «إذا ما الضجيع ابتزها». وقد شرحه البَغْداديّ ضمن شرح القصيدة في «خزانة الأدب»، ورواه «كدعص النقا» [@khizana، ج1 ص68]. وهو من القسم الذي يذكر فيه الشاعر لهوه ردًّا على بسباسة، وفيه يقول ابن قُتَيْبة إن الشعراء تتوقى التصريح بالفواحش «وإن فعلته» [@ibn-qutayba، ج1 ص135]، أي إن عيب امرئ القَيْس عنده أنه قال ما يفعله غيره ويكتمه."
variants:
