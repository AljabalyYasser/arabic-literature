first: "كَذَبْتِ لَقَدْ أُصْبِي عَلَى الْمَرْءِ عِرْسَهُ"
second: "وَأَمْنَعُ عِرْسِي أَنْ يُزَنَّ بِهَا الْخَالِي"
meaning: "يرد على بسباسة التي زعمت أنه كبر ولم يعد يحسن اللهو: كذبتِ، فإني ما زلت أُغوي زوجة الرجل فتميل إليّ وزوجها حيّ معها، ولا يطمع أحد في زوجتي، ولا يُتَّهم بها رجل عَزَب. قال البَغْداديّ: «صرح بتكذيب بسباسة حيث زعمت أنه لا يلهو بالنساء فقال إني أشوق النساء إلي مع وجود أزواجهن ولا أدع أحدا يتهم بامرأتي لأنها لا تميل إلى أحد مع وجودي لأني محبب عند النساء» [@khizana، ج1 ص66]. فالبيت بلغة اليوم: أنا أوقع زوجات الرجال في حبي فيملن إليّ وأزواجهن معهن، أي أغويهن بالوصال الحرام، أما زوجتي فلا تخونني مع أحد."
vocabulary:
  - term: "أُصْبِي"
    text: "أُشوّق إليّ وأجعلها تصبو: «وأصبي مضارع أصبيت الْمَرْأَة بِمَعْنى شوقتها وجعلتها ذَات صبوة وَهِي الشوق» [@khizana، ج1 ص66]."
  - term: "عِرْسَهُ"
    text: "زوجته: «والعرس بِالْكَسْرِ الزَّوْجَة» [@khizana، ج1 ص66]."
  - term: "يُزَنَّ"
    text: "يُتَّهم، من قولهم: أزنّه بالأمر إذا اتهمه به، لا من الزنا: «ويزن يتهم بِالْبِنَاءِ للْمَفْعُول يُقَال أزننته بِشَيْء اتهمته بِهِ» [@khizana، ج1 ص66]. والتهمة هنا تهمة الفاحشة."
  - term: "الْخَالِي"
    text: "العَزَب: «قَالَ الْأَصْمَعِي هُوَ من الرِّجَال الَّذِي لَا زَوْجَة لَهُ» [@khizana، ج1 ص66]."
syntax:
  - "«كَذَبْتِ»: فعل وفاعل، والتاء المكسورة لبسباسة. و«لَقَدْ»: اللام واقعة في جواب قسم محذوف، و«قد» للتحقيق، والتقدير: والله لقد أُصبي."
  - "«أُصْبِي عَلَى الْمَرْءِ عِرْسَهُ»: «عِرسَه» مفعول به، و«عَلَى الْمَرْءِ» متعلق بـ«أُصبي»، و«على» هنا للاستعلاء والمخالفة: أُصبيها رغمًا عليه، وهو حاضر."
  - "«أَنْ يُزَنَّ بِهَا الْخَالِي»: المصدر المؤول في محل نصب على نزع الخافض، أي: أمنعها من أن يُزنّ بها، و«الخالي» نائب فاعل، و«بها» متعلق بـ«يُزنّ»."
morphology:
  - "«أُصْبِي» مضارع «أَصْبَى» على «أَفْعَلَ» من «صَبَا يَصْبُو»، والهمزة للتعدية: جعلها تصبو."
  - "«يُزَنّ» مضارع «أُزِنَّ» المبني للمجهول من «أَزَنَّ» على «أَفْعَلَ»، من الأصل «زنن»."
  - "«الْخَالِي» اسم فاعل من «خَلَا يَخْلُو»، أي خلا من الزوجة."
rhetoric:
  thesis: "أول الرد على بسباسة، وفيه دعوى كبيرة: الشاعر يغوي نساء غيره، ولا يغوي أحد نساءه. وهذا هو المعنى الذي عاب به ابن قُتَيْبة امرأ القَيْس: «ويعاب عليه تصريحه بالزنا والدّبيب إلى حرم الناس» [@ibn-qutayba، ج1 ص135]، والدبيب إلى حرم الناس التسلل إلى نسائهم."
  devices:
    - title: "المقابلة"
      text: "«أُصْبِي ... عِرْسَهُ» في الصدر يقابله «وَأَمْنَعُ عِرْسِي» في العجز: عرس غيره مباحة له، وعرسه ممنوعة على غيره. والمقابلة أن يؤتى بمعنيين ثم بما يقابلهما على الترتيب."
    - title: "التوكيد بالقسم المحذوف"
      text: "«لَقَدْ» لام القسم مع «قد»، والقسم محذوف، فالبيت يمين على صدق دعواه في وجه التكذيب. والحذف هنا مما قال فيه عبد القاهر الجُرْجانيّ: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "«عَلَى الْمَرْءِ»"
      text: "لم يقل: أُصبي عرس المرء، بل «عَلَى الْمَرْءِ عِرْسَهُ»، فجعل الزوج حاضرًا مغلوبًا. فالإغواء يقع على الزوج كما يقع على المرأة، وفيه من الإذلال للزوج أكثر مما فيه من الحب. وهذه قراءتنا."
  connection: "ثم يذكر يومًا وليلة لها بامرأة: «وَيَا رُبَّ يَوْمٍ قَدْ لَهَوْتُ وَلَيْلَةٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَذَبْتِ / لَقَدْ أُصْبِي / عَلَلْ مَرْ / ءِ عِرْسَهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — وَأَمْنَ / عُ عِرْسِي أَنْ / يُزَنْنَ / بِهَلْ خَالِي = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من الصدر، والأولى والثالثة من العجز [@atiq، ص29]. و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، فهي هنا «مفاعلن»، وأُشبعت ضمة الهاء في «عرسَهُ» فنُطقت «عرسهو». والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "يأتي بعد قوله «أَلَا زَعَمَتْ بَسْبَاسَةُ الْيَوْمَ أَنَّنِي ... كَبِرْتُ وَأَنْ لَا يُحْسِنُ اللَّهْوَ أَمْثَالِي» (8)، وهو أول الأبيات التي يكذّبها بها (9–17). وقد شرحه البَغْداديّ مع أبيات القصيدة وهو يشرح شاهده «تَنَوَّرْتُهَا مِنْ أَذْرِعَاتَ» [@khizana، ج1 ص66]. ويرى شوقي ضَيْف أن امرأ القَيْس «هو الذى سبق إلى هذا الغزل الفاحش الصريح» [@deif، ج1 ص252]."
