first: "وَبَيْتِ عَذَارَى يَوْمَ دَجْنٍ وَلَجْتُهُ"
second: "يَطُفْنَ بِجَمَّاءِ الْمَرَافِقِ مِكْسَالِ"
meaning: "ورُبّ بيت فيه فتيات أبكار دخلته في يوم غائم ممطر، وهن يدرن حول امرأة ممتلئة الجسم، غطّى اللحم عظام مرفقيها، بطيئة الحركة لا تكاد تبرح مجلسها. ولم نجد للبيت شرحًا عند شرّاح القصيدة في مصادرنا، وإنما أنشد صاحب اللسان عجزه وقال قبله: «ومَرَةٌ جَمَّاءُ العِظام: كَثِيرَةُ اللَّحْمِ عَلَيْهَا» [@lisan، ج12 ص108]، وقال في المِكْسال: «الَّتِي لَا تَكَادُ تبرَح مجلسَها، وَهُوَ مدحٌ لَهَا مِثْلُ نَؤوم الضُّحَى» [@lisan، ج11 ص587]. فالمعنى بلغة اليوم، وهو قراءتنا: يفخر بأنه دخل خباء الفتيات اللواتي لم يتزوجن، وهو موضع لا يدخله الرجال الغرباء، في يوم مطر يلزم فيه الناس بيوتهم ويطيب فيه اللهو، فوجدهن حول سيدتهن البدينة المترفة التي تُخدم ولا تخدم. والبيت يذكر الدخول ولا يذكر ما كان بعده، لكنه في قصيدة يفخر فيها بإغواء النساء (9)، وبالتسلل إلى امرأة متزوجة (20–26)، فهو من الباب الذي عابه ابن قُتَيْبة على امرئ القَيْس: «تصريحه بالزنا والدّبيب إلى حرم الناس» [@ibn-qutayba، ج1 ص135]، والدبيب إلى حرم الناس التسلل إلى نسائهم."
vocabulary:
  - term: "وَبَيْتِ"
    text: "الخباء الذي يسكنه أهله من الشَّعَر أو الوبر، وهو هنا خباء الفتيات."
  - term: "عَذَارَى"
    text: "جمع عذراء، وهي البكر التي لم تتزوج."
  - term: "دَجْنٍ"
    text: "«الدَّجْنُ: ظلُّ الْغَيْمِ فِي الْيَوْمِ المَطير» [@lisan، ج13 ص147]، أي يوم غائم ممطر."
  - term: "وَلَجْتُهُ"
    text: "دخلته."
  - term: "يَطُفْنَ"
    text: "يدرن حول الشيء، من الطواف."
  - term: "بِجَمَّاءِ الْمَرَافِقِ"
    text: "بامرأة كثيرة اللحم على مرفقيها فلا تظهر عظامهما. في اللسان: «وجَمَّ العظمُ، فَهُوَ أَجَمُّ: كَثُرَ لَحْمُهُ. ومَرَةٌ جَمَّاءُ العِظام: كَثِيرَةُ اللَّحْمِ عَلَيْهَا»، ثم أنشد عجز البيت [@lisan، ج12 ص108]. والمرافق جمع مِرْفَق، وهو موصل الذراع بالعضد."
  - term: "مِكْسَالِ"
    text: "«والمِكْسَال والكَسُول: الَّتِي لَا تَكَادُ تبرَح مجلسَها، وَهُوَ مدحٌ لَهَا مِثْلُ نَؤوم الضُّحَى» [@lisan، ج11 ص587]، أي إنها مخدومة لا تحتاج إلى أن تقوم بعمل."
syntax:
  - "«وَبَيْتِ»: الواو واو رُبّ، و«بيتِ» مجرور بـ«رُبّ» المحذوفة، وهو مضاف و«عَذَارَى» مضاف إليه مجرور، وعلامة جره الفتحة المقدّرة على الألف لأنه ممنوع من الصرف."
  - "«يَوْمَ دَجْنٍ»: ظرف زمان منصوب متعلق بـ«ولجته»، وهو مضاف و«دجنٍ» مضاف إليه."
  - "«وَلَجْتُهُ»: فعل وفاعل، والهاء مفعول به تعود على البيت، والجملة في محل جر صفة لـ«بيت»."
  - "«يَطُفْنَ»: فعل مضارع مبني على السكون لاتصاله بنون النسوة، والنون فاعل، والجملة في محل نصب حال من «عذارى»."
  - "«بِجَمَّاءِ الْمَرَافِقِ»: جار ومجرور متعلق بـ«يطفن»، و«جمّاء» صفة لموصوف محذوف، أي بامرأة جمّاء. وهي ممنوعة من الصرف لأنها مختومة بألف التأنيث الممدودة، وجُرّت بالكسرة لأنها مضافة إلى «المرافق». و«مِكْسَالِ» صفة ثانية للموصوف المحذوف مجرورة."
morphology:
  - "«عَذَارَى» جمع «عَذْراء» على «فَعالَى»."
  - "«جَمَّاء» على «فَعْلاء»، مؤنث «أَجَمّ»، من «جَمَّ العظمُ» إذا كثر لحمه [@lisan، ج12 ص108]."
  - "«مِكْسَال» على «مِفْعال»، من أبنية المبالغة، وهو من صيغ مؤنث «كَسْلان»: «والأُنثى كَسِلَة وكَسْلَى وكَسْلانة وكَسُول ومِكْسَال» [@lisan، ج11 ص587]."
  - "«وَلَجْتُ» ماضي «وَلَجَ يَلِجُ»، مثال واوي، تُحذف واوه في المضارع."
  - "«مَرَافِق» جمع «مِرْفَق» على «مَفاعِل»."
rhetoric:
  thesis: "بعد أن سأل في البيت 32 «وَمَاذَا عَلَيْهِ أَنْ ذَكَرْتُ أَوَانِسًا»، يذكر منهن ذكرى: بيت فتيات دخله في يوم مطر. ويصفهن في البيتين التاليين، ثم يقول في البيت 36 إنه صرف الهوى عنهن."
  devices:
    - title: "«يَوْمَ دَجْنٍ»"
      text: "يوم الغيم والمطر يلزم فيه الناس البيوت، وهو عندهم يوم لهو. فقد قال طَرَفَة في معلقته «وَتَقْصِيرُ يَوْمِ الدَّجْنِ»، وشرحه ابن الأَنْبارِيّ: «معناه أقصره باللهو، ويوم اللهو قصير، وليلة اللهو والسرور قصيران» [@ibn-al-anbari، ص196]. فذكرُ يوم الدجن هنا يومئ إلى ما جاء الشاعر من أجله. وهذه قراءتنا."
    - title: "الكناية في «جَمَّاءِ الْمَرَافِقِ مِكْسَالِ»"
      text: "لم يقل إنها سمينة مترفة، بل ذكر ما يلزم السِّمَن، وهو مرفق غاب عظمه في اللحم، وما يلزم الترف، وهو امرأة لا تبرح مجلسها لأن غيرها يخدمها. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. والكسل في المرأة مدح، كما يقول صاحب اللسان، «مِثْلُ نَؤوم الضُّحَى» [@lisan، ج11 ص587]."
    - title: "الطواف"
      text: "«يَطُفْنَ»: جعل الفتيات يدرن حول سيدتهن كما يُطاف حول شيء معظَّم. وفي معلقته يشبّه بقر الوحش بـ«عذارى دوار»، ودَوار «حجر كان أهل الجاهلية ينصبونه ويطوفون حوله» [@zawzani، ص70]. فالطواف عنده صورة للعذارى. وهذه قراءتنا."
  connection: "ثم يصف العذارى أنفسهن: «سِبَاطِ الْبَنَانِ وَالْعَرَانِينِ وَالْقَنَا / لِطَافِ الْخُصُورِ فِي تَمَامٍ وَإِكْمَالِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَبَيْ تِ / عَذَارَى يَوْ / مَ دَجْنِنْ / وَلَجْتُهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — يَطُفْ نَ / بِجَمْمَاءِلْ / مَرَا فِ / قِ مِكْسَالِي = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]. والعروض مقبوضة «مفاعلن» كما هي في الطويل دائمًا [@atiq، ص29]، وأُشبعت ضمة الهاء فيها، في «ولجتهُ»، فنُطقت «ولجتهو». والضرب صحيح «مفاعيلن» [@atiq، ص30]."
context: "من الأبيات التي يعود فيها إلى النساء بعد المغامرة الليلية (18–31): يسأل في البيت 32 ما الذي يضير زوج صاحبته إن ذكر نساءً «كَغِزْلَانِ رَمْلٍ فِي مَحَارِيبِ أَقْيَالِ»، ثم يذكر هذا البيت، ويصف العذارى في البيتين 34–35، ثم ينقلب في البيت 36 «صَرَفْتُ الْهَوَى عَنْهُنَّ مِنْ خَشْيَةِ الرَّدَى». وأنشد صاحب اللسان عجزه شاهدًا على «جمّاء العظام» [@lisan، ج12 ص108]."
variants:
  - reading: "يَطُفْنَ بِحَبَّاءِ الْمَرَافِقِ مِكْسَالِ"
    status: "نسخة العمل، ونراه خطأ في الطبع"
    note: "وحاشيتها نفسها تفسر الكلمة بمعنى «جمّاء»: «جباء المرافق: غائبة العظام لسمنها» [@diwan-imru-al-qais، ص138]. والرواية التي أثبتناها رواية اللسان [@lisan، ج12 ص108]."
