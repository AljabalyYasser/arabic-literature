explained: false
first: بِعِجْلِزَةٍ قَدْ أَتْرَزَ الْجَرْيُ لَحْمَهَا
second: كُمَيْتٍ كَأَنَّهَا هِرَاوَةُ مِنْوَالِ
vocabulary:
- term: عِجْلِزَةٍ
  text: «الفرس الشديدة الخلق» [@lisan، ج5 ص373].
- term: أَتْرَزَ
  text: 'صلّب وأيبس؛ «وأترز الجري لحم الدابة: صلّبه» [@lisan، ج5 ص314].'
- term: كُمَيْتٍ
  text: فرس لونها بين السواد والحمرة.
- term: هِرَاوَةُ مِنْوَالِ
  text: 'الهراوة: العصا؛ والمِنْوال كالنَّوْل، وهو «خشبة الحائك التي يلفّ عليها الثوب» [@lisan، ج11 ص684].'
