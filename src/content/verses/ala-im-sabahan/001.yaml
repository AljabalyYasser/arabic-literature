first: "أَلَا عِمْ صَبَاحًا أَيُّهَا الطَّلَلُ الْبَالِي"
second: "وَهَلْ يَعِمَنْ مَنْ كَانَ فِي الْعُصُرِ الْخَالِي"
meaning: "يحيّي الطلل الدارس تحية الصباح، ثم يستدرك: وكيف ينعم من مضى زمانه وخلا؟ فالسؤال إنكار، أي لا ينعم [@suyuti-mughni، ج1 ص342]."
vocabulary:
  - term: "عِمْ صَبَاحًا"
    text: "تحية الجاهلية، أصلها «انْعَمْ صباحًا»، حُذفت منها الألف والنون تخفيفًا. ويقولون في العشي: «عِمْ مساءً»، وفي الليل: «عِمْ ظلامًا» [@suyuti-mughni، ج1 ص342]."
  - term: "الطَّلَلُ"
    text: "ما شخص من آثار الديار [@diwan-imru-al-qais، ص135]."
  - term: "الْبَالِي"
    text: "القديم الدارس، من «بَلِيَ الثوبُ» إذا رثّ."
  - term: "الْعُصُرِ"
    text: "بضمتين، بمعنى العَصْر، وهو الدهر والزمان [@suyuti-mughni، ج1 ص342]."
  - term: "الْخَالِي"
    text: "الماضي [@sharrab، ج2 ص386]."
syntax:
  - "«أَلَا» حرف استفتاح وتنبيه، و«عِمْ» فعل أمر خرج إلى الدعاء، و«صَبَاحًا» ظرف، أي: انعم في صباحك، ويجوز أن يكون تمييزًا [@suyuti-mughni، ج1 ص342]."
  - "«أَيُّهَا الطَّلَلُ» منادى حُذف منه حرف النداء: «أيّ» مبني على الضم في محل نصب، و«ها» للتنبيه، و«الطَّلَلُ» نعت لـ«أيّ» مرفوع على لفظه، و«الْبَالِي» نعت للطلل."
  - "«وَهَلْ يَعِمَنْ» استفهام إنكاري، والفعل مؤكد بنون التوكيد الخفيفة بعد الاستفهام، و«مَنْ» فاعله، وقد استعملها في غير العاقل [@suyuti-mughni، ج1 ص342]. وجملة «كَانَ فِي الْعُصُرِ الْخَالِي» صلة «مَنْ»."
morphology:
  - "«عِمْ» من «انْعَمْ»، ويجوز فيه فتح العين وكسرها. وقيل هو من «وَعِمَ يَعِمُ» على مثال «وَعَدَ يَعِدُ» [@suyuti-mughni، ج1 ص342]؛ فحُذفت الواو في الأمر والمضارع كما تُحذف من «عِدْ» و«يَعِدُ»."
  - "«يَعِمَنْ» مضارع مبني على الفتح لاتصاله بنون التوكيد [@sharrab، ج2 ص386]."
  - "«الْبَالِي» اسم فاعل من «بَلِيَ يَبْلَى»، وياؤه أصلية."
rhetoric:
  thesis: "يحيّي الطلل كما يحيّي الأحياء، ثم ينقض التحية بسؤال: كيف ينعم ما خلا زمانه؟ فالمطلع يجمع الوفاء للمكان واليأس منه معًا."
  devices:
    - title: "التشخيص"
      text: "خاطب الطلل وحيّاه بتحية الصباح التي يحيّي بها الناس، كأنه حيّ يسمع ويرد."
    - title: "الاستفهام الإنكاري"
      text: "«وَهَلْ يَعِمَنْ» استفهام إنكار، أي: لا ينعم [@suyuti-mughni، ج1 ص342]. ويكرر السؤال نفسه في مطلع البيتين التاليين، فيصير لازمة تتردد."
    - title: "التَّصْرِيع"
      text: "وافق بين آخر الصدر «الْبَالِي» وآخر العَجُز «الْخَالِي» في الوزن والقافية، كما يُصنع في المطالع."
  connection: "ثم يكرر السؤال: «وَهَلْ يَعِمَنْ إِلَّا سَعِيدٌ مُخَلَّدٌ / قَلِيلُ الْهُمُومِ مَا يَبِيتُ بِأَوْجَالِ» [@diwan-imru-al-qais، ص135]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَلَا عِمْ / صَبَاحَنْ أَيْ / يُهَطْ طَ / لَلُلْ بَالِي = فعولن / مفاعيلن / فعولُ / مفاعيلن — وَهَلْ يَ / عِمَنْ مَنْ كَا / نَ فِلْ عُ / صُرِلْ خَالِي = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "الضرب «مفاعيلن» صحيح، وهو أحد ضروب الطويل الثلاثة [@atiq، ص30]. أما العَرُوض فحقها في الطويل أن تأتي مقبوضة «مفاعلن»، لكنها جاءت «مفاعيلن» لتوافق الضرب، وهذا هو التَّصْرِيع، ولا يكون إلا في مطلع القصيدة [@ahda-sabil، ص84]. وجاءت «فعولن» مقبوضة «فعولُ» ثلاث مرات، وكلاهما جائز في حشو الطويل [@atiq، ص29]."
context: "مطلع القصيدة الثانية في ديوانه، وهي عند شوقي ضيف أوثق شعره بعد المعلقة [@deif، ج1 ص245]."
variants:
  - reading: "أَلَا انْعَمْ صَبَاحًا أَيُّهَا الطَّلَلُ الْبَالِي"
    status: "رواية ابن قُتَيْبة"
    note: "بالأصل الذي اختُصرت منه «عِمْ» [@ibn-qutayba، ج1 ص109]، والوزن لا يتغير."
