explained: false
first: يَغِطُّ غَطِيطَ الْبَكْرِ شُدَّ خِنَاقُهُ
second: لِيَقْتُلَنِي وَالْمَرْءُ لَيْسَ بِقَتَّالِ
vocabulary:
- term: يَغِطُّ غَطِيطَ الْبَكْرِ
  text: «يُرى له غطيط من الغيظ، كما يُرى للبكر إذا خُنق فشُدّت الأنشوطة في عنقه» [@suyuti-mughni، ج1 ص343].
- term: الْبَكْرِ
  text: «الفتيّ من الإبل» [@suyuti-mughni، ج1 ص343].
- term: خِنَاقُهُ
  text: الحبل الذي يُخنق به.
- term: لَيْسَ بِقَتَّالِ
  text: «أي ليس بصاحب قتل» [@suyuti-mughni، ج1 ص343].
