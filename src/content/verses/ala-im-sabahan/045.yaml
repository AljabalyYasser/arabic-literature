first: ذَعَرْتُ بِهَا سِرْبًا نَقِيًّا جُلُودُهُ
second: وَأَكْرُعُهُ وَشْيُ الْبُرُودِ مِنَ الْخَالِ
vocabulary:
- term: ذَعَرْتُ
  text: أفزعتُ.
- term: سِرْبًا
  text: قطيعًا من بقر الوحش.
- term: أَكْرُعُهُ
  text: جمع كُراع، وهو مستدقّ الساق.
- term: الْخَالِ
  text: «نوع من البرود» [@lisan، ج11 ص226].
