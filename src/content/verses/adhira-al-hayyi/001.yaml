first: "عَذِيرَ الْحَيِّ مِنْ عَدْوَا"
second: "نَ كَانُوا حَيَّةَ الْأَرْضِ"
vocabulary:
  - term: "عَذِيرَ الْحَيِّ"
    text: "في حاشية محققي «الأصمعيات»: «العذير: العذر أو العاذر، يقول: هات عذرًا لحي عدوان، أو هات من يعذرهم فيما فعل بعضهم ببعض من التباعد والتباغض والقتل، بعد ما كانوا حية الأرض التي يحذرها كل أحد» [@asmaiyyat، ص72، الحاشية]."
  - term: "حَيَّةَ الْأَرْضِ"
    text: "في حاشية محققي «الأصمعيات»: «يقال «فلان حية الوادي» إذا كان شديد الشكيمة حاميًا لحوزته. وأراد: كانوا حيات الأرض، فوضع الواحد موضع الجمع» [@asmaiyyat، ص72، الحاشية]."
