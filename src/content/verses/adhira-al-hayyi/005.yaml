first: "وَمِنْهُمْ حَامِلُ النَّاسِ"
second: "عَلَى السُّنَّةِ وَالْفَرْضِ"
vocabulary:
  - term: "السُّنَّةِ وَالْفَرْضِ"
    text: "السنّة الطريقة المتّبعة، والفرض ما فُرض على الناس من حق. أي منهم من كان يقود الناس إلى عاداتهم المرعيّة وحقوقهم."
