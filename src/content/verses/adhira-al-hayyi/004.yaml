first: "وَمِنْهُمْ حَكَمٌ يَقْضِي"
second: "وَلَا يُنْقَضُ مَا يَقْضِي"
vocabulary:
  - term: "حَكَمٌ"
    text: "الذي يحكم بين الناس فيما يتنازعون فيه. ويقول أبو حاتم السِّجِسْتانيّ بعد هذا البيت: «يعني عامر بن الظَّرب» [@muammarun، ص58]، وهو [عامر بن الظَّرِب العَدْوانيّ](/people/groups/1/hukama/#amir-ibn-al-zarib)، حكم العرب."
