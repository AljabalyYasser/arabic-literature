first: "نُوَلِّيهَا الْمَلَامَةَ إِنْ أَلَمْنَا"
second: "إِذَا مَا كَانَ مَغْثٌ أَوْ لِحَاءُ"
meaning: "إذا أتينا بما نُلام عليه، من ضرب باليد أو شتم باللسان، صرفنا اللوم إلى الخمر واعتذرنا بالسُّكر."
vocabulary:
  - term: "نُوَلِّيهَا الْمَلَامَةَ"
    text: "«نصرف اللوم إِلَيْهَا» [@ibn-hisham، ج2 ص422]."
  - term: "أَلَمْنَا"
    text: "«إِن فعلنَا مَا نستحق عَلَيْهِ اللوم. يُقَال: ألام الرجل فَهُوَ مليم» [@ibn-hisham، ج2 ص422]."
  - term: "مَغْثٌ"
    text: "«المغث: المماغثة باليد» [@kamil، ج1 ص106]، و«الضَّرْب بِالْيَدِ» [@ibn-hisham، ج2 ص422]."
  - term: "لِحَاءُ"
    text: "«واللحاء: الملاحاة باللسان» [@kamil، ج1 ص106]، أي السِّباب."
syntax:
  - "«نُوَلِّيهَا الْمَلَامَةَ» فعل يتعدى إلى مفعولين: الضمير «ها» العائد على الخمر، و«الْمَلَامَةَ»."
  - "«إِنْ أَلَمْنَا» شرط حُذف جوابه لدلالة ما قبله عليه."
  - "«إِذَا مَا كَانَ مَغْثٌ» «كان» تامة بمعنى وقع وحدث، و«مَغْثٌ» فاعلها، و«مَا» زائدة بعد «إذا»."
morphology:
  - "«أَلَمْنَا» ماضٍ من «أَلامَ» على وزن «أفعل»، معناه أتى بما يُلام عليه، وأصله «أَلْوَمْنَا»."
  - "«الْمَلَامَةُ» مصدر ميمي من «لام»."
  - "«لِحَاءٌ» مصدر «لاحى» على وزن «فِعَال»، والمفاعلة فيه تدل على المشاركة: شتم متبادل."
rhetoric:
  thesis: "يعترف بأن الشرب يجرّ إلى الخصام، ويجعل الخمر عذرًا يُلقى عليه اللوم."
  devices:
    - title: "المقابلة بين اليد واللسان"
      text: "«مَغْثٌ أَوْ لِحَاءُ»: الأول ضرب باليد والثاني ملاحاة باللسان، فجمع الشجار كله في كلمتين. ويقول المُبَرِّد في معناه إن المسيء يعتذر بأن يقول: «كنت سكران، فيعذر» [@kamil، ج1 ص106]."
    - title: "تحويل اللوم"
      text: "«نُوَلِّيهَا الْمَلَامَةَ»: جعل الملامة شيئًا يُدار ويوجَّه إلى جهة غير جهته، كأنها سهم يحوّلونه عن أنفسهم إلى الخمر."
  connection: "ثم يقول ما تصنع بهم الخمر: تجعلهم ملوكًا وأسودًا. والبيتان معًا مما عابه النقاد."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "نُوَلْلِيهَلْ / مَلَامَةَ إِنْ / أَلَمْنَا = مفاعلْتن / مفاعلَتن / فعولن — إِذَا مَا كَا / نَ مَغْثُنْ أَوْ / لِحَاءُو = مفاعلْتن / مفاعلْتن / فعولن"
context: "هذا البيت والتالي يرويهما المَرْزُبانيّ عن الصُّولِيّ فيما عيب على الشعراء، ويقول إن حسّان تبع فيهما طَرَفة، «وهو أعيب من الأول» [@muwashshah، ص65]."
