first: "عَفَتْ ذَاتُ الْأَصَابِعِ فَالْجِوَاءُ"
second: "إِلَى عَذْرَاءَ مَنْزِلُهَا خَلَاءُ"
meaning: "درست منازل الحبيبة وتغيّرت عند ذات الأصابع والجِواء إلى عَذْراء، فهي خالية لا أحد فيها. وهذه، كما يقول محققو السيرة، مواضع بالشام: «ذَات الْأَصَابِع والجواء: موضعان بِالشَّام، وبالجواء كَانَ منزل الْحَارِث ابْن أَبى شمر الغساني، وَكَانَ حسان كثيرا مَا يفد على مُلُوك غَسَّان بِالشَّام يمدحهم، فَلذَلِك يذكر هَذِه الْمنَازل» [@ibn-hisham، ج2 ص421]. فالمطلع يبدأ من أرض الغَساسِنة التي عرفها حسّان شابًّا."
vocabulary:
  - term: "عَفَتْ"
    text: "«عفت: تَغَيَّرت ودرست»، كما في حاشية محققي السيرة [@ibn-hisham، ج2 ص421]، ويقول البغدادي: «عفت: بِمَعْنى: درست» [@khizana، ج9 ص233]."
  - term: "ذَاتُ الْأَصَابِعِ"
    text: "«مَوضِع بِالشَّام» [@khizana، ج9 ص233]."
  - term: "الْجِوَاءُ"
    text: "موضع بالشام أيضًا، «والجواء بِكَسْر الْجِيم كَذَلِك» [@khizana، ج9 ص233]. وأصل الكلمة جمع الجَوّ، وهو ما اتسع من الأرض: «قَالَ الأَزهري: الجِوَاءُ جَمْعُ الجَوِّ» [@lisan، ج14 ص157]."
  - term: "عَذْرَاءَ"
    text: "«قَالَ السكرِي فِي شرح ديوانه: قَرْيَة على بريد من دمشق» [@khizana، ج9 ص233]. والبَرِيد: مسافة نحو اثني عشر ميلًا."
  - term: "خَلَاءُ"
    text: "خالٍ لا أحد فيه، وهو مصدر وُصف به المكان."
syntax:
  - "«ذَاتُ» فاعل «عَفَتْ»، و«الْجِوَاءُ» معطوف عليه بالفاء التي تفيد الترتيب في المكان: موضعًا بعد موضع."
  - "«إِلَى عَذْرَاءَ» جار ومجرور متعلق بمحذوف يدل عليه السياق، والتقدير: عفت هذه المواضع ممتدة إلى عذراء. و«عَذْرَاءَ» ممنوعة من الصرف لأنها علم مؤنث بالألف الممدودة."
  - "«مَنْزِلُهَا خَلَاءُ» جملة اسمية: «مَنْزِلُهَا» مبتدأ، و«خَلَاءُ» خبره. والجملة استئناف يلخّص الخبر، أو حال من المواضع."
morphology:
  - "«عَفَتْ» ماضٍ من «عفا يعفو»، أصله «عَفَوَتْ»، قُلبت الواو ألفًا ثم حُذفت لالتقاء الساكنين."
  - "«الْأَصَابِعِ» جمع إصبع، و«ذَات» هنا بمعنى صاحبة، تدخل على أسماء المواضع."
  - "«خَلَاءُ» مصدر «خلا يخلو» على وزن «فَعَال»، وُصف به المنزل مبالغة، كما يقال: رجل عَدْل."
rhetoric:
  thesis: "مطلع طللي على سنّة القصيدة القديمة، لكنه طلل في أرض الغَساسِنة لا في البادية، فيحمل معه ذكرى شباب حسّان في بلاط جَفْنة."
  devices:
    - title: "تعداد المواضع"
      text: "«ذَاتُ الْأَصَابِعِ فَالْجِوَاءُ إِلَى عَذْرَاءَ»: ثلاثة أسماء متتالية، والفاء و«إلى» ترسمان طريقًا على الأرض، فيتسع الخراب بقدر ما تتسع الخريطة."
    - title: "التصريع"
      text: "اتفقت «الْجِوَاءُ» في آخر الصدر و«خَلَاءُ» في آخر العجز في الوزن والرويّ. والتصريع «ما كانت عروض البيت فيه تابعة لضربه» [@ibn-rashiq، ج1 ص173]، أي أن نهاية الصدر تتبع نهاية العجز، وهو من علامات المطلع."
    - title: "الإيجاز في «مَنْزِلُهَا خَلَاءُ»"
      text: "جملة من كلمتين تختم البيت وتلخّصه: بعد ثلاثة أسماء للمواضع لا يبقى إلا الفراغ."
  connection: "ثم يسمّي أهل هذه الديار: بني الحَسْحاس، ويذكر ما عفّاها: الرياح والمطر."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "عَفَتْ ذَاتُلْ / أَصَابِعِ فَلْ / جِوَاءُو = مفاعلْتن / مفاعلَتن / فعولن — إِلَى عَذْرَا / ءَ مَنْزِلُهَا / خَلَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "البحر الوافر: «مفاعلتن مفاعلتن فعولن» في كل شطر [@atiq، ص54]. وأول كل شطر هنا «مفاعلْتن» دخلها العَصْب، وهو تسكين الخامس، أي اللام [@atiq، ص54]. و«فعولن» في آخر الشطرين أصلها «مفاعلتن» دخلها القَطْف. والقصيدة همزية، والرِّدْف حرف مدّ يسبق الرويّ، وهو هنا الألف قبل الهمزة."
context: "مطلع الهمزية، وهي قصيدة حسّان في هجاء أبي سفيان بن الحارث قبيل فتح مكة. يقول ابن هشام في آخرها: «قَالَهَا حَسَّانُ يَوْمَ الْفَتْحِ» [@ibn-hisham، ج2 ص424]، وفي طبعة فستنفلد للسيرة كما ينقل عرفات: «قالها حسان قبل يوم الفتح»، ويقول عرفات: «سقطت كلمة قبل من طبعة الحلبي» [@diwan-hassan، ص19]. وعنوانها في مخطوطة «طا» من الديوان: «وقال حسان بن ثابت يهجو أبا سفيان ابن الحرث قبل فتح مكة» [@diwan-hassan، ص19]. وتبدأ بأطلال في الشام، لأن صدرها، كما يُروى، قيل في الجاهلية."
