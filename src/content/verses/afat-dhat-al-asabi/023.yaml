first: "هَجَوْتَ مُحَمَّدًا وَأَجَبْتُ عَنْهُ"
second: "وَعِنْدَ اللَّهِ فِي ذَاكَ الْجَزَاءُ"
meaning: "هجوتَ محمدًا فأجبتُ عنه وردَدْتُ هجاءك، وعند الله جزاء ذلك."
vocabulary:
  - term: "الْجَزَاءُ"
    text: "الثواب أو العقاب على الفعل."
syntax:
  - "«هَجَوْتَ» بفتح التاء خطاب لأبي سفيان، و«أَجَبْتُ» بضمها للمتكلم، فيلتقي في الصدر فاعلان."
  - "«وَعِنْدَ اللَّهِ فِي ذَاكَ الْجَزَاءُ» جملة اسمية: «الْجَزَاءُ» مبتدأ مؤخر، و«عِنْدَ اللَّهِ» خبر مقدم، و«فِي ذَاكَ» متعلق بالجزاء. و«ذاك» إشارة إلى الهجاء والإجابة معًا."
morphology:
  - "«هَجَوْتَ» من «هجا يهجو» الناقص الواوي."
  - "«أَجَبْتُ» من «أجاب» على وزن «أفعل»، وأصله «أَجْوَبْتُ»."
rhetoric:
  thesis: "بيت المناقضة كلها في صدر واحد: فعلك وفعلي."
  devices:
    - title: "المقابلة بين ضميرين"
      text: "«هَجَوْتَ ... وَأَجَبْتُ»: تاء مفتوحة ثم تاء مضمومة، فعلان متقابلان، والحكم بينهما مؤجّل إلى «عِنْدَ اللَّهِ»."
    - title: "تقديم الخبر"
      text: "«وَعِنْدَ اللَّهِ فِي ذَاكَ الْجَزَاءُ»: قدّم «عِنْدَ اللَّهِ» فجعل الجزاء مقصورًا عليه، لا عند الناس."
  connection: "ثم ينكر عليه أن يهجو من ليس له بكفء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "هَجَوْتَ مُحَمْ / مَدَنْ وَأَجَبْ / تُ عَنْهُو = مفاعلَتن / مفاعلَتن / فعولن — وَعِنْدَلْ لَا / هِ فِي ذَاكَلْ / جَزَاءُو = مفاعلْتن / مفاعلْتن / فعولن"
context: "يروي أبو الفَرَج بإسناد إلى سِماك بن حرب أن حسّان أتى أبا بكر ليعرف أنساب قريش، فقال له: «كُفَّ عن فلانة واذكُرْ فلانة»، فقال هذا البيت والبيتين 27 و24 [@aghani-dk، ج4 ص139]. ويروي البغدادي عن اللَّخْمِيّ عن ابن دُرَيْد بإسناده أن النبي صلى الله عليه وسلم قال له لما انتهى إلى هذا البيت: «جزاؤك على الله الْجنَّة يَا حسان» [@khizana، ج9 ص236]. والبيت أول ما في رواية عائشة عند مسلم [@muslim، ج4 ص1936، رقم 2490]."
