first: "وَقَالَ اللَّهُ قَدْ أَرْسَلْتُ عَبْدًا"
second: "يَقُولُ الْحَقَّ إِنْ نَفَعَ الْبَلَاءُ"
meaning: "وقال الله: قد أرسلت عبدًا يقول الحق، إن كان الاختبار ينفع، أي إن انتفع الناس بما امتُحنوا به."
vocabulary:
  - term: "عَبْدًا"
    text: "يريد النبي صلى الله عليه وسلم."
  - term: "الْبَلَاءُ"
    text: "«الاختبار» [@ibn-hisham، ج2 ص423]."
syntax:
  - "«وَقَالَ اللَّهُ» وجملة «قَدْ أَرْسَلْتُ عَبْدًا» مقول القول."
  - "«يَقُولُ الْحَقَّ» صفة لـ«عَبْدًا»."
  - "«إِنْ نَفَعَ الْبَلَاءُ» شرط حُذف جوابه، أي: إن نفع البلاء فقد بيّنه لكم."
morphology:
  - "«أَرْسَلْتُ» ماضٍ على وزن «أفعل» من «رسل»."
  - "«الْبَلَاءُ» مصدر «بلا يبلو» بمعنى اختبر."
rhetoric:
  thesis: "يجعل الرسالة كلامًا على لسان الله، فيصير الشعر رسولًا للرسالة."
  devices:
    - title: "الحكاية"
      text: "«وَقَالَ اللَّهُ»: يحكي القول ولا يخبر عنه، فيأتي الكلام بضمير المتكلم «أَرْسَلْتُ». وهذا البيت والبيت 18 يبدآن بالعبارة نفسها، فيقوم بينهما توازٍ."
    - title: "الاحتراس"
      text: "«إِنْ نَفَعَ الْبَلَاءُ»: يضيف الشرط ليقول إن العيب في السامعين لا في الرسالة. والاحتراس: أن يزيد المتكلم ما يدفع به سوء الفهم."
  connection: "ثم يذكر شهادته وتصديق قومه، وإباء قريش."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "وَقَالَلْ لَا / هُ قَدْ أَرْسَلْ / تُ عَبْدَنْ = مفاعلْتن / مفاعلْتن / فعولن — يَقُولُلْ حَقْ / قَ إِنْ نَفَعَلْ / بَلَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "الأبيات 15–20 تقول ما للأنصار في الرسالة. وترتيبها في الديوان والخزانة غير ترتيب السيرة [@diwan-hassan، ص18] [@khizana، ج9 ص232]."
