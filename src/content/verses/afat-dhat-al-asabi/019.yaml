first: "لَنَا فِي كُلِّ يَوْمٍ مِنْ مَعَدٍّ"
second: "سِبَابٌ أَوْ قِتَالٌ أَوْ هِجَاءُ"
meaning: "لنا كل يوم مع قبائل مَعَدّ شأن: سباب، أو قتال، أو هجاء."
vocabulary:
  - term: "مَعَدٍّ"
    text: "أبو العرب العدنانية، ويريد قبائلها، ومنها قريش."
  - term: "سِبَابٌ"
    text: "المشاتمة."
syntax:
  - "«لَنَا» خبر مقدم، و«سِبَابٌ» مبتدأ مؤخر، و«فِي كُلِّ يَوْمٍ» و«مِنْ مَعَدٍّ» متعلقان بالخبر."
  - "«أَوْ» للتقسيم: يوم سباب ويوم قتال ويوم هجاء."
morphology:
  - "«سِبَاب» و«قِتَال» مصدران على وزن «فِعَال» من «سابّ» و«قاتل»، وكلاهما يدل على المشاركة."
  - "«هِجَاء» مصدر «هاجى» أو «هجا»."
rhetoric:
  thesis: "حياة الأنصار كلها مواجهة: باللسان أو بالسيف."
  devices:
    - title: "التقسيم الثلاثي"
      text: "«سِبَابٌ أَوْ قِتَالٌ أَوْ هِجَاءُ»: ثلاث كلمات على وزن واحد، يتوسطها القتال بين لونين من الكلام. فالشعر عنده سلاح كالسيف، وهذا ما يقوله صراحة في البيت التالي."
  connection: "ثم يقول كيف يردّون: بالقوافي وبالضرب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "لَنَا فِي كُلْ / لِ يَوْمِنْ مِنْ / مَعَدْدِنْ = مفاعلْتن / مفاعلْتن / فعولن — سِبَابُنْ أَوْ / قِتَالُنْ أَوْ / هِجَاءُو = مفاعلْتن / مفاعلْتن / فعولن"
  note: "الحشو في الشطرين معصوب كله."
context: "يقول ابن سيرين فيما يرويه أبو الفَرَج إن الأنصار الثلاثة كانوا يهجون قريشًا، «فكان حسّان وكعب يعارضانهم بمثل قولهم بالوقائع والأيام والمآثر ويعيّرانهم بالمثالب، وكان عبد الله بن رواحة يعيّرهم بالكفر» [@aghani-dk، ج4 ص138]. فهذا البيت يصف تلك المعارضة."
variants:
