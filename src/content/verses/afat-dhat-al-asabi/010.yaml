first: "عَدِمْنَا خَيْلَنَا إِنْ لَمْ تَرَوْهَا"
second: "تُثِيرُ النَّقْعَ مَوْعِدُهَا كَدَاءُ"
meaning: "فقدنا خيلنا إن لم تروها تثير الغبار، وموعدها ثنيّة كَداء بأعلى مكة. يدعو على نفسه وقومه بفقد الخيل إن لم يأتوا مكة غازين."
vocabulary:
  - term: "عَدِمْنَا"
    text: "فقدنا، والفعل هنا دعاء على النفس."
  - term: "النَّقْعَ"
    text: "«النَّقْع: الْغُبَار» [@ibn-hisham، ج2 ص422]."
  - term: "كَدَاءُ"
    text: "«ثنية بِأَعْلَى مَكَّة» [@ibn-hisham، ج2 ص422]، وفي الخزانة: «الثَّنية الَّتِي فِي أَصْلهَا مَقْبرَة مَكَّة وَمِنْهَا دخل الزبير يَوْمئِذٍ» [@khizana، ج9 ص235]. وفي اللسان: «ابْنُ الأَنباري: كَدَاء، مَمْدُودٌ، جَبَلٌ بِمَكَّةَ» [@lisan، ج15 ص217]. والثَّنِيّة: الطريق في الجبل."
syntax:
  - "«عَدِمْنَا خَيْلَنَا» جملة دعائية بلفظ الماضي، وهي جواب شرط مقدم في المعنى: إن لم تروها عدمناها."
  - "«إِنْ لَمْ تَرَوْهَا» شرط، وجوابه محذوف دل عليه ما قبله."
  - "«تُثِيرُ النَّقْعَ» جملة حالية من الضمير «ها» في «تَرَوْهَا»، لأن الرؤية بصرية."
  - "«مَوْعِدُهَا كَدَاءُ» جملة اسمية حال ثانية، أو استئناف."
morphology:
  - "«عَدِمْنَا» من «عَدِم يَعْدَم» على وزن «فَعِل»."
  - "«تَرَوْهَا» مضارع «رأى» مجزوم بـ«لم»، وعلامة جزمه حذف النون، وأصله «تَرْأَيُونَها»."
  - "«مَوْعِدٌ» اسم مكان من «وعد» على وزن «مَفْعِل»."
rhetoric:
  thesis: "يبدأ القسم الإسلامي من القصيدة بقسم على هيئة الدعاء: هذا وعيد قريش بالفتح."
  devices:
    - title: "الدعاء على النفس"
      text: "«عَدِمْنَا خَيْلَنَا»: يجعل فقد الخيل، وهي أعز ما يملك الفارس، ثمنًا لصدق الوعيد. فهو يمين بصيغة الدعاء."
    - title: "الكناية بالغبار"
      text: "«تُثِيرُ النَّقْعَ»: لا يقول إنها تغزو، بل يصف الغبار الذي تثيره، فيدل على كثرتها وسرعتها. والكناية عند عبد القاهر أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود»، «فيومئ به إليه» [@dalail، ج1 ص66]."
    - title: "تسمية المكان"
      text: "«مَوْعِدُهَا كَدَاءُ»: يحدّد موضع الدخول باسمه، فيصير الوعيد خطة لا تهديدًا عامًّا."
  connection: "ثم يصف هذه الخيل وهي تنازع أعنتها والرماح على أكتافها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "عَدِمْنَا خَيْ / لَنَا إِنْ لَمْ / تَرَوْهَا = مفاعلْتن / مفاعلْتن / فعولن — تُثِيرُنْ نَقْ / عَ مَوْعِدُهَا / كَدَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "بهذا البيت يبدأ ما قاله حسّان في الإسلام، على قول العدوي في مخطوطة «طا» [@diwan-hassan، ص19]. وفي رواية عائشة عند مسلم: «ثَكِلْتُ بُنَيَّتِي إِنْ لَمْ تَرَوْهَا * تُثِيرُ النَّقْعَ مِنْ كَنَفَيْ كَدَاءِ» [@muslim، ج4 ص1937، رقم 2490]، ويقول محقق صحيح مسلم: «وعلى هذه الرواية، في هذا البيت إقواء مخالف لباقيها» [@muslim، ج4 ص1937–1938]، والإقواء: اختلاف حركة الروي بين أبيات القصيدة."
variants:
  - reading: "ثَكِلْتُ بُنَيَّتِي إِنْ لَمْ تَرَوْهَا ... تُثِيرُ النَّقْعَ مِنْ كَنَفَيْ كَدَاءِ"
    status: "رواية أخرى"
    note: "رواية عائشة في صحيح مسلم [@muslim، ج4 ص1937–1938]. ويذكر المحقق أن في بعض النسخ «غايتها كداء» وفي بعضها «موعدها كداء» [@muslim، ج4 ص1937–1938]."
