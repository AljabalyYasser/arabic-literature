first: "أَلَا أَبْلِغْ أَبَا سُفْيَانَ عَنِّي"
second: "مُغَلْغَلَةً فَقَدْ بَرِحَ الْخَفَاءُ"
meaning: "ألا أبلغ أبا سفيان رسالة مني تُحمل إليه من بلد إلى بلد، فقد ظهر الأمر ولم يعد خافيًا."
vocabulary:
  - term: "أَبَا سُفْيَانَ"
    text: "«هُوَ الْمُغيرَة بن الْحَارِث بن عبد الْمطلب ابْن عَم النَّبِي، وَكَانَ هجا النَّبِي قبل أَن يسلم» [@ibn-hisham، ج2 ص423]. وليس أبا سفيان بن حرب."
  - term: "مُغَلْغَلَةً"
    text: "«رِسَالَة ترسل من بلد إِلَى بلد» [@ibn-hisham، ج2 ص423]، وفي الخزانة: «الرسَالَة الذاهبة إِلَى كل بلد من تغلغل إِذا ذهب» [@khizana، ج9 ص236]."
  - term: "بَرِحَ الْخَفَاءُ"
    text: "ظهر ما كان خفيًّا، و«برح» هنا بمعنى زال وانكشف."
syntax:
  - "«أَلَا» حرف استفتاح وتنبيه، و«أَبْلِغْ» أمر، و«أَبَا سُفْيَانَ» مفعوله الأول."
  - "«مُغَلْغَلَةً» مفعول ثانٍ، صفة لموصوف محذوف أي رسالة مغلغلة."
  - "«فَقَدْ بَرِحَ الْخَفَاءُ» جملة تعليلية."
morphology:
  - "«مُغَلْغَلَة» اسم مفعول من «غلغل» الرباعي المضعّف، بمعنى أُدخلت وأُوصلت."
  - "«الْخَفَاء» مصدر «خفي» على وزن «فَعَال»."
rhetoric:
  thesis: "بداية الهجاء: صيغة الرسالة المعروفة في الشعر القديم."
  devices:
    - title: "صيغة الإبلاغ"
      text: "«أَلَا أَبْلِغْ»: خطاب لرسول متخيَّل، ومنه يبدأ كثير من الهجاء والوعيد في الشعر القديم، فلا يكلّم المهجوّ وجهًا لوجه، بل يرسل إليه."
    - title: "المثل في «بَرِحَ الْخَفَاءُ»"
      text: "عبارة جارية تقال حين ينكشف المستور، وضعها في العجز لتقول إن عداوة أبي سفيان لم تعد خافية."
  connection: "ثم مضمون الرسالة: سيوفنا تركتك عبدًا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "أَلَا أَبْلِغْ / أَبَا سُفْيَا / نَ عَنْنِي = مفاعلْتن / مفاعلْتن / فعولن — مُغَلْغَلَتَنْ / فَقَدْ بَرِحَلْ / خَفَاءُو = مفاعلَتن / مفاعلَتن / فعولن"
context: "يبدأ هنا القسم الخامس: هجاء أبي سفيان بن الحارث (21–27). وكان ابن عم النبي صلى الله عليه وسلم، وهجاه قبل إسلامه، وحسّان يرد عليه. ويروي ابن سَلّام المناقضة بينهما في «دعوا فلجات الشام» [@ibn-sallam، ج1 ص247–249]."
variants:
  - reading: "أَلَا أَبْلِغْ أَبَا سُفْيَانَ عَنِّي ... فَأَنْتَ مُجَوَّفٌ نَخِبٌ هَوَاءُ"
    status: "رواية الديوان"
    note: "يذكرها محققو السيرة ويشرحونها: «والمجوف: الْخَالِي الْجوف، يُرِيد بِهِ الجبان. وَكَذَلِكَ النخب والهواء» [@ibn-hisham، ج2 ص423]، وهي في الديوان [@diwan-hassan، ص18] واللسان [@lisan، ج9 ص35]، ويقول البغدادي: «وروى غير ابْن هِشَام مصراعه الثَّانِي كَذَا» [@khizana، ج9 ص236]."
