first: "وَنَشْرَبُهَا فَتَتْرُكُنَا مُلُوكًا"
second: "وَأُسْدًا مَا يُنَهْنِهُنَا اللِّقَاءُ"
meaning: "ونشرب الخمر فتجعلنا كالملوك في الجود والعزة، وكالأسود في الشجاعة، لا يردّنا لقاء الأعداء ولا يكفّنا."
vocabulary:
  - term: "أُسْدًا"
    text: "جمع أسد."
  - term: "يُنَهْنِهُنَا"
    text: "«يزجرنا ويردنا» [@ibn-hisham، ج2 ص422]، و«النَّهْنَهَةُ: الكَفُّ» [@lisan، ج13 ص550]."
  - term: "اللِّقَاءُ"
    text: "لقاء العدو في الحرب."
syntax:
  - "«فَتَتْرُكُنَا مُلُوكًا»: «ترك» هنا بمعنى صيّر، تنصب مفعولين: الضمير «نا» و«مُلُوكًا»، و«أُسْدًا» معطوف على «مُلُوكًا»."
  - "«مَا يُنَهْنِهُنَا اللِّقَاءُ» جملة صفة لـ«أُسْدًا»، و«اللِّقَاءُ» فاعل مؤخر."
morphology:
  - "«يُنَهْنِهُ» فعل رباعي مضعّف على وزن «فَعْلَل»، قيل أصله من النهي، وفي اللسان: «كأَن أَصله مِنَ النَّهْي» [@lisan، ج13 ص550]."
  - "«أُسْد» جمع «أسد» على وزن «فُعْل»."
rhetoric:
  thesis: "البيت الذي يُختم به القسم الجاهلي من القصيدة، وهو فخر بأثر الخمر في الشاربين."
  devices:
    - title: "التشبيه البليغ"
      text: "«فَتَتْرُكُنَا مُلُوكًا وَأُسْدًا»: لم يذكر أداة التشبيه ولا وجه الشبه، فجعلهم ملوكًا وأسودًا. ويفرّق عبد القاهر بين هذا والاستعارة: إذا قلت «رأيت أسدًا» فقد «ادعيت في إنسان أنه أسد، وجعلته إياه» [@dalail، ج1 ص67]، أما هنا فالمشبه مذكور في «نا»، فهو تشبيه لا استعارة."
    - title: "ما عابه النقاد"
      text: "يرى الصُّولِيّ فيما يرويه المَرْزُبانيّ أن طَرَفة قال «أسد غيل فإذا ما شربوا» فجعل لقومه «الشجاعة قبل الشرب، وحسان قال: نشرب فنشجع ونهب كأنّا ملوك إذا شربنا؛ فلهذا كان قول طرفة أجود» [@muwashshah، ص65]. فالعيب أن الشجاعة والجود هنا من أثر السكر."
  connection: "بعد هذا البيت ينتقل إلى الخيل والوعيد، وعند هذا الموضع يقول العدوي إن الجزء الجاهلي من القصيدة ينتهي."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "وَنَشْرَبُهَا / فَتَتْرُكُنَا / مُلُوكَنْ = مفاعلَتن / مفاعلَتن / فعولن — وَأُسْدَنْ مَا / يُنَهْنِهُنَلْ / لِقَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "في مخطوطة «طا» من الديوان، بعد هذا البيت، وهو العاشر في ترقيم الديوان: «قال العدوي: قال حسان القصيدة إلى هذا الموضع في الجاهلية ثم وصلها بعد هذا القول في الإسلام» [@diwan-hassan، ص19]. وفي البيت نفسه خبر يرويه البغدادي بصيغة «يُروى»: أن حسّان مرّ بفتية يشربون الخمر في الإسلام فنهاهم، فقالوا إن هذا البيت زيّنها لهم، فقال: «وَالله لقد قلتهَا فِي الْجَاهِلِيَّة وَمَا شربتها مُنْذُ أسلمت» [@khizana، ج9 ص234–235]. والخبر منسوب، وهو مبني على البيت ليفسّره."
variants:
