first: "بِأَنَّ سُيُوفَنَا تَرَكَتْكَ عَبْدًا"
second: "وَعَبْدُ الدَّارِ سَادَتُهَا الْإِمَاءُ"
meaning: "بأن سيوفنا جعلتك ذليلًا كالعبد، وصار سادة بني عبد الدار كالإماء في الذلة."
vocabulary:
  - term: "عَبْدُ الدَّارِ"
    text: "بنو عبد الدار بن قُصَيّ، من بطون قريش، وكانوا أصحاب اللواء."
  - term: "الْإِمَاءُ"
    text: "جمع أَمَة، وهي الجارية المملوكة."
syntax:
  - "«بِأَنَّ سُيُوفَنَا» جار ومجرور متعلق بـ«أَبْلِغْ» في البيت السابق، أي أبلغه بأن... وهذا تضمين بين البيتين."
  - "«تَرَكَتْكَ عَبْدًا» «ترك» بمعنى صيّر، تنصب مفعولين."
  - "«وَعَبْدُ الدَّارِ سَادَتُهَا الْإِمَاءُ» جملة اسمية: «عَبْدُ الدَّارِ» مبتدأ أول، و«سَادَتُهَا» مبتدأ ثانٍ، و«الْإِمَاءُ» خبره، والجملة خبر الأول."
morphology:
  - "«سَادَة» جمع «سيّد» على وزن «فَعَلَة»، وأصلها «سَوَدَة»."
  - "«الْإِمَاء» جمع «أَمَة» على وزن «فِعَال»."
rhetoric:
  thesis: "الهجاء بالذلة بعد القتال، وهو البيت الذي أخرجه عرفات من النص."
  devices:
    - title: "التشبيه البليغ"
      text: "«تَرَكَتْكَ عَبْدًا» و«سَادَتُهَا الْإِمَاءُ»: يجعل المهجوّ عبدًا والسادة إماءً بلا أداة تشبيه. ويقول محققو السيرة: «يُرِيد أَن سيوف الْأَنْصَار جعلت أَبَا سُفْيَان كَالْعَبْدِ الذَّلِيل يَوْم فتح مَكَّة، وَأَن سادة بنى عبد الدَّار صَارُوا كالإماء» [@ibn-hisham، ج2 ص423]."
    - title: "التجنيس في «عَبْدًا» و«عَبْدُ الدَّارِ»"
      text: "لفظ «عبد» مرتين: الأولى صفة ذل، والثانية جزء من اسم القبيلة. فيلعب الشاعر على الاسم: بنو عبد الدار صاروا عبيدًا حقًّا."
  connection: "ثم يخاطب أبا سفيان مباشرة: هجوت محمدًا فأجبت عنه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "بِأَنْنَ سُيُو / فَنَا تَرَكَتْ / كَ عَبْدَنْ = مفاعلَتن / مفاعلَتن / فعولن — وَعَبْدُدْ دَا / رِ سَادَتُهَلْ / إِمَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "هذا البيت في رواية ابن إسحاق، وليس في أقدم مخطوطات الديوان. يقول عرفات إنه ورد «في المطبوعة وفي السيرة إلخ ... لكن لم يرد في أقدم المخطوطات ط و طا ولا في ص ولم أجده في أي مصدر آخر ولذلك أخرجته من نص القصيدة ولأنه لا يتّفق مع السياق» [@diwan-hassan، ص19–20]. ونحن نبقيه لأنّا نقرأ رواية ابن إسحاق، ونذكر حكم عرفات. وهو في الخزانة على رواية السيرة [@khizana، ج9 ص232]."
variants:
  - reading: "(ليس في الديوان)"
    status: "أخرجه المحقق"
    note: "أخرجه عرفات من نص الديوان، وهو في نشرة هرشفلد، «المطبوعة» عنده، وفي مخطوطتي «ل» و«با» المتأخرتين [@diwan-hassan، ص19–20]."
