first: "يُنَازِعْنَ الْأَعِنَّةَ مُصْغِيَاتٍ"
second: "عَلَى أَكْتَافِهَا الْأَسَلُ الظِّمَاءُ"
meaning: "خيل تجاذب أعنّتها في عدوها، مائلة برؤوسها نحو الطعن، وعلى أكتافها الرماح العطشى إلى الدماء."
vocabulary:
  - term: "يُنَازِعْنَ الْأَعِنَّةَ"
    text: "«الأعنة: جمع عنان، وَهُوَ اللجام» [@ibn-hisham، ج2 ص422]، والمنازعة: المجاذبة، فهي تجذب لُجُمها من أيدي فرسانها."
  - term: "مُصْغِيَاتٍ"
    text: "«الموائل المنحرفات لِلطَّعْنِ» [@ibn-hisham، ج2 ص422]، ومنه في اللسان: «وأَصْغَى الإِناءَ: أَماله» [@lisan، ج14 ص461]."
  - term: "الْأَسَلُ"
    text: "«الرماح» [@ibn-hisham، ج2 ص422]."
  - term: "الظِّمَاءُ"
    text: "«العطاش» [@ibn-hisham، ج2 ص422]. ويذكر محقق صحيح مسلم قولين: «والظماء الرقاق. فكأنها لقلة مائها عطاش. وقيل المراد بالظماء العطاش لدماء الأعداء» [@muslim، ج4 ص1937–1938]."
syntax:
  - "«يُنَازِعْنَ» فعل مضارع، ونون النسوة فاعل يعود على الخيل، و«الْأَعِنَّةَ» مفعوله."
  - "«مُصْغِيَاتٍ» حال من نون النسوة، منصوبة بالكسرة لأنها جمع مؤنث سالم."
  - "«عَلَى أَكْتَافِهَا الْأَسَلُ الظِّمَاءُ» جملة اسمية حالية: «الْأَسَلُ» مبتدأ مؤخر، و«عَلَى أَكْتَافِهَا» خبر مقدم، و«الظِّمَاءُ» صفة للأسل."
morphology:
  - "«مُصْغِيَاتٌ» جمع «مُصْغِيَة»، اسم فاعل من «أصغى» على وزن «أفعل»."
  - "«الظِّمَاءُ» جمع «ظمآن» على وزن «فِعَال»."
  - "«الْأَعِنَّةُ» جمع «عِنان» على وزن «أفعلة»."
rhetoric:
  thesis: "صورة الخيل في الهجوم، كل جزء منها حركة."
  devices:
    - title: "المنازعة"
      text: "«يُنَازِعْنَ الْأَعِنَّةَ»: الخيل تشدّ لجمها كأنها تخاصم فرسانها، لنشاطها وقوة رؤوسها. وفي رواية «يبارين الأسنة» يقول البغدادي: «مباراتها الأسنة: أَن يضجع الرجل رمحه فَكَانَ الْفرس يرْكض ليسبق السنان» [@khizana، ج9 ص235]."
    - title: "استعارة العطش للرماح"
      text: "في «الْأَسَلُ الظِّمَاءُ» جعل الرماح تعطش كما يعطش الحي، والدم ما يرويها. فالمستعار منه الإنسان أو الحيوان العطشان، وقد طواه وأبقى صفته."
  connection: "ثم يتم الصورة بالخيل والنساء يلطمن وجوهها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "يُنَازِعْنَلْ / أَعِنْنَةَ مُصْ / غِيَاتِنْ = مفاعلْتن / مفاعلَتن / فعولن — عَلَى أَكْتَا / فِهَلْ أَسَلُظْ / ظِمَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "من وصف الخيل يوم الفتح المتوعَّد به."
variants:
  - reading: "يُبَارِينَ الْأَسِنَّةَ مُصْغِيَاتٍ"
    status: "رواية الديوان"
    note: "هكذا في الديوان [@diwan-hassan، ص17] والخزانة [@khizana، ج9 ص232]، ويقول البغدادي: «وَرِوَايَة ابْن هِشَام: ينازعن الأعنة مصغيات» [@khizana، ج9 ص235]. ويذكر محققو السيرة «يبارين الأسنة» و«مصعدات» روايتين [@ibn-hisham، ج2 ص422]."
  - reading: "يُبَارِينَ الْأَعِنَّةَ مُصْعِدَاتٍ"
    status: "رواية مسلم"
    note: "[@muslim، ج4 ص1937–1938]."
