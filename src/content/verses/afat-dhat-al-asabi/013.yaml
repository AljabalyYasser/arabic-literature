first: "فَإِمَّا تُعْرِضُوا عَنَّا اعْتَمَرْنَا"
second: "وَكَانَ الْفَتْحُ وَانْكَشَفَ الْغِطَاءُ"
meaning: "فإن تُعرضوا عنا وتخلّوا لنا الطريق اعتمرنا، وكان الفتح وانكشف الغطاء عن الأمر."
vocabulary:
  - term: "اعْتَمَرْنَا"
    text: "«أدينا مَنَاسِك الْعمرَة، وَهِي زِيَارَة بَيت الله الْحَرَام» [@ibn-hisham، ج2 ص423]."
  - term: "الْغِطَاءُ"
    text: "الستر، وانكشافه ظهور ما كان خافيًا."
syntax:
  - "«فَإِمَّا» أصلها «إنْ» الشرطية و«ما» الزائدة أُدغمت فيها، و«تُعْرِضُوا» فعل الشرط مجزوم بحذف النون، و«اعْتَمَرْنَا» جوابه."
  - "«وَكَانَ الْفَتْحُ» «كان» تامة بمعنى حصل، و«الْفَتْحُ» فاعلها، والجملة معطوفة على الجواب."
morphology:
  - "«تُعْرِضُوا» مضارع «أعرض» على وزن «أفعل»."
  - "«اعْتَمَرْنَا» من «اعتمر» على وزن «افتعل»."
  - "«انْكَشَفَ» على وزن «انفعل» مطاوع «كشف»."
rhetoric:
  thesis: "شطر الوعيد الأول: الطريق السلمي، وهو العمرة."
  devices:
    - title: "التقسيم"
      text: "«فَإِمَّا تُعْرِضُوا ... وَإِلَّا فَاصْبِرُوا»: يقسم أمرهم بين خيارين في بيتين متتاليين، والسامع ينتظر الشطر الثاني منذ «فإما»."
    - title: "الاستعارة في «وَانْكَشَفَ الْغِطَاءُ»"
      text: "جعل الأمر الخفي شيئًا مغطّى ينكشف عنه غطاؤه، فطوى ذكر الأمر وأبقى غطاءه. والاستعارة عند عبد القاهر «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ج1 ص67]."
  connection: "ثم الخيار الثاني: الجلاد."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "فَإِمْمَا تُعْ / رِضُوا عَنْنَعْ / تَمَرْنَا = مفاعلْتن / مفاعلْتن / فعولن — وَكَانَلْ فَتْ / حُ وَنْكَشَفَلْ / غِطَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "همزة الوصل في «اعْتَمَرْنَا» تسقط في الدَّرْج، فتتصل النون بالعين: «عَنْنَعْ»."
context: "هذا البيت دليل عرفات وغيره على أن القصيدة قيلت قبل الفتح، فهو وعيد بما سيكون. ويقول محقق صحيح مسلم ناقلًا عن الأُبّيّ: «ظاهر هذا، كما قال ابن هشام، أنه كان قبل الفتح في عمرة الحديبية، حين صد عن البيت» [@muslim، ج4 ص1937–1938]."
