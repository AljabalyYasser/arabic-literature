first: "لِشَعْثَاءَ الَّتِي قَدْ تَيَّمَتْهُ"
second: "فَلَيْسَ لِقَلْبِهِ مِنْهَا شِفَاءُ"
meaning: "ذلك الطيف لشَعْثاء التي ذلّلت قلبه بالحب، فلا يجد قلبه منها شفاء."
vocabulary:
  - term: "شَعْثَاءَ"
    text: "اسم امرأة يختلف الرواة فيها: «قيل هِيَ بنت سَلام بن مشْكم الْيَهُودِيّ، كَمَا فِي السهيليّ، وَقيل هِيَ امْرَأَة من خُزَاعَة، كَمَا فِي نَوَادِر ابْن الْأَعرَابِي، وَقيل غير ذَلِك»، كما يجمع محققو السيرة [@ibn-hisham، ج2 ص422]."
  - term: "تَيَّمَتْهُ"
    text: "«وتيَّمَه الحبُّ إِذا اسْتولى عَلَيْهِ» [@lisan، ج12 ص75]."
syntax:
  - "«لِشَعْثَاءَ» جار ومجرور متعلق بـ«طَيْفٍ» في البيت السابق، أي طيف لشعثاء. فالبيت متصل بما قبله في المعنى، وهذا هو التضمين المعنوي."
  - "«الَّتِي» صفة لشعثاء، وجملة «قَدْ تَيَّمَتْهُ» صلتها."
  - "«فَلَيْسَ لِقَلْبِهِ مِنْهَا شِفَاءُ»: «شِفَاءُ» اسم ليس مؤخر، و«لِقَلْبِهِ» خبرها مقدم."
morphology:
  - "«شَعْثَاءَ» على وزن «فعلاء»، ممنوعة من الصرف، وأصلها صفة من الشَّعَث وهو تفرّق الشعر."
  - "«تَيَّمَتْ» على وزن «فعّل» من التَّيْم وهو التعبيد، فالمتيَّم المعبَّد للحب."
rhetoric:
  thesis: "يسمّي الحبيبة، ويصف حاله منها بلغة المرض والشفاء."
  devices:
    - title: "الالتفات من المتكلم إلى الغائب"
      text: "كان يقول «يُؤَرِّقُنِي»، ثم قال «تَيَّمَتْهُ» و«لِقَلْبِهِ»: تحدّث عن نفسه كأنه رجل آخر يراه من بعيد. والالتفات: الانتقال من التكلم أو الخطاب إلى الغيبة أو العكس."
    - title: "استعارة المرض للحب"
      text: "في «شِفَاءُ» جعل الحب داءً لا يبرأ منه، فطوى ذكر المرض وأبقى لازمه، وهو الشفاء الذي لا يكون."
  connection: "ثم يصف ريقها بخمر ممزوجة بعسل وماء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "لِشَعْثَاءَلْ / لَتِي قَدْ تَيْ / يَمَتْهُو = مفاعلْتن / مفاعلْتن / فعولن — فَلَيْسَ لِقَلْ / بِهِي مِنْهَا / شِفَاءُو = مفاعلَتن / مفاعلْتن / فعولن"
  note: "الهاء في «تَيَّمَتْهُ» و«لِقَلْبِهِ» تُشبع حركتها فتصير «هُو» و«هِي»."
context: "في هذه الصاحبة تقول بعض الأخبار إنها يهودية، وبعضها إنها من خُزاعة. ولا يقطع أحد بشيء، فنقرؤها اسمًا للحبيبة في نسيب جاهلي."
