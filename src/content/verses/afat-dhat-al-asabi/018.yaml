first: "وَقَالَ اللَّهُ قَدْ سَيَّرْتُ جُنْدًا"
second: "هُمُ الْأَنْصَارُ عُرْضَتُهَا اللِّقَاءُ"
meaning: "وقال الله: قد سيّرت جندًا هم الأنصار، همّتهم وعادتهم لقاء العدو، فهم أقوياء عليه."
vocabulary:
  - term: "سَيَّرْتُ"
    text: "بعثت وأرسلت."
  - term: "عُرْضَتُهَا اللِّقَاءُ"
    text: "«عَادَتهَا أَن تتعرض للقاء، فَهِيَ قَوِيَّة عَلَيْهِ» [@ibn-hisham، ج2 ص423]، وفي اللسان: «والعُرْضةُ: الهِمَّةُ» ويستشهد بالبيت [@lisan، ج7 ص187]."
syntax:
  - "«قَدْ سَيَّرْتُ جُنْدًا» مقول القول، و«هُمُ الْأَنْصَارُ» صفة لـ«جُنْدًا»."
  - "«عُرْضَتُهَا اللِّقَاءُ» جملة اسمية صفة ثانية، والضمير «ها» يعود على الجند بتأنيث الجماعة."
morphology:
  - "«سَيَّرْتُ» على وزن «فعّل» من «سار»، والتضعيف للتعدية."
  - "«عُرْضَة» على وزن «فُعْلَة»، بمعنى ما يُعرَض للشيء ويُقصد إليه."
rhetoric:
  thesis: "قلب البيت ونواته: الأنصار جند الله، فالقبيلة صارت جيش الرسالة."
  devices:
    - title: "التوازي"
      text: "«وَقَالَ اللَّهُ قَدْ أَرْسَلْتُ عَبْدًا» و«وَقَالَ اللَّهُ قَدْ سَيَّرْتُ جُنْدًا»: صدر بصدر، وفعل بفعل، ومفعول بمفعول. فالعبد والجند متقابلان: الرسول ومن ينصره."
    - title: "التأنيث في «عُرْضَتُهَا»"
      text: "يؤنث الضمير للجند، فيجعلهم كتيبة واحدة لا أفرادًا."
  connection: "ثم يصف يوم الأنصار مع مَعَدّ: سباب أو قتال أو هجاء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "وَقَالَلْ لَا / هُ قَدْ سَيْيَرْ / تُ جُنْدَنْ = مفاعلْتن / مفاعلْتن / فعولن — هُمُلْ أَنْصَا / رُ عُرْضَتُهَلْ / لِقَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "في هذا البيت يفخر حسّان بقومه بلغة الإسلام، والأنصار اسم أطلقه الإسلام على الأوس والخزرج."
