first: "أَتَهْجُوهُ وَلَسْتَ لَهُ بِكُفْءٍ"
second: "فَشَرُّكُمَا لِخَيْرِكُمَا الْفِدَاءُ"
meaning: "أتهجوه ولستَ له بنظير؟ فليكن الشرير منكما فداء للخيّر. ويريد: أنت الفداء، وهو الخيّر."
vocabulary:
  - term: "كُفْءٍ"
    text: "المثيل والنظير. ويرويه ابن قُتَيْبة «بِنِدّ» [@ibn-qutayba، ج1 ص298]، وفي اللسان أن النِّدّ من «هُوَ مستقِلٌّ مِنْ ذَلِكَ بِمِثْلِ مَا تستَقِلُّ بِهِ» [@lisan، ج3 ص420]."
  - term: "الْفِدَاءُ"
    text: "ما يُفدى به الشيء ويُبذل دونه."
syntax:
  - "«أَتَهْجُوهُ» الهمزة للاستفهام الإنكاري، و«وَلَسْتَ لَهُ بِكُفْءٍ» جملة حالية، والباء في «بِكُفْءٍ» زائدة في خبر ليس."
  - "«فَشَرُّكُمَا لِخَيْرِكُمَا الْفِدَاءُ»: «شَرُّكُمَا» مبتدأ، و«الْفِدَاءُ» خبره، و«لِخَيْرِكُمَا» متعلق بالفداء. والجملة دعاء بلفظ الخبر."
morphology:
  - "«شَرّ» و«خَيْر» اسما تفضيل حُذفت همزتهما، والأصل «أشرّ» و«أخير»."
  - "«كُفْء» على وزن «فُعْل»، وتُروى «كُفُؤ» و«كِفْء»."
rhetoric:
  thesis: "بيت الحكم: يُقال مثلًا في كل نزاع بين خيّر وشرّير."
  devices:
    - title: "التعريض"
      text: "«فَشَرُّكُمَا لِخَيْرِكُمَا الْفِدَاءُ»: لا يقول «أنت الشر»، بل يقسّم الحكم بينهما ويترك السامع يعرف أيهما الشر. وهذا أوجع من التصريح. وينقل البغدادي عن السُّهَيْليّ أن «فِي ظَاهر هَذَا اللَّفْظ شناعة لِأَن الْمَعْرُوف أَن لَا يُقَال: هُوَ شرهما إِلَّا وَفِي كليهمَا شَرّ»، ثم يدفعها بقول سِيبَوَيْه: «تَقول: مَرَرْت بِرَجُل شَرّ مِنْك إِذا نقص عَن أَن يكون مثله» [@khizana، ج9 ص237]. فالتفضيل هنا لا يُثبت في الخيّر شرًّا."
    - title: "المثل السائر"
      text: "صار عجز البيت مثلًا. يقول ابن قُتَيْبة: «والناس يقولون: فشرّكما لخيركما الفداء وهو عجز بيت لحسّان» [@ibn-qutayba، ج1 ص298]."
  connection: "ثم يعدّد صفات المهجوّ عليه، فيجعل الهجاء مدحًا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "أَتَهْجُوهُو / وَلَسْتَ لَهُو / بِكُفْئِنْ = مفاعلْتن / مفاعلَتن / فعولن — فَشَرْرُكُمَا / لِخَيْرِكُمَلْ / فِدَاءُو = مفاعلَتن / مفاعلَتن / فعولن"
context: "من أشهر أبيات القصيدة، وفي رواية سِماك بن حرب عند أبي الفَرَج [@aghani-dk، ج4 ص139]."
