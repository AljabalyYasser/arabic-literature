first: "فَإِنَّ أَبِي وَوَالِدَهُ وَعِرْضِي"
second: "لِعِرْضِ مُحَمَّدٍ مِنْكُمْ وِقَاءُ"
meaning: "فإن أبي وجدّي وعِرضي وقاية لعِرض محمد منكم: أجعلهم دونه، يُشتمون فلا يُشتم هو."
vocabulary:
  - term: "وَالِدَهُ"
    text: "والد أبيه، أي جده."
  - term: "عِرْضِي"
    text: "«وعِرْضُ الرجلِ حَسَبُه، وَقِيلَ نفْسه، وَقِيلَ خَلِيقَته الْمَحْمُودَةُ، وَقِيلَ مَا يُمْدح بِهِ ويُذَمُّ» [@lisan، ج7 ص170]."
  - term: "وِقَاءُ"
    text: "«هو ما وقيت به الشيء»، من شرح محقق صحيح مسلم [@muslim، ج4 ص1938]."
syntax:
  - "«أَبِي» اسم «إنّ»، و«وَالِدَهُ» و«عِرْضِي» معطوفان عليه."
  - "«وِقَاءُ» خبر «إنّ»، و«لِعِرْضِ مُحَمَّدٍ» و«مِنْكُمْ» متعلقان به."
morphology:
  - "«وِقَاء» على وزن «فِعَال»، اسم لما يُتّقى به، من «وقى»."
  - "«عِرْض» بكسر العين، على وزن «فِعْل»."
rhetoric:
  thesis: "بيت الفداء: يفدي الشاعر النبي بأعز ما عند العربي، أي نسبه وشرفه."
  devices:
    - title: "العطف الذي أثار النحاة"
      text: "«فَإِنَّ أَبِي وَوَالِدَهُ وَعِرْضِي»: عطف العِرض على الآباء. يقول محقق صحيح مسلم: «هذا مما احتج به ابن قتيبة لمذهبه أن عرض الإنسان هو نفسه لا أسلافه. لأنه ذكر عرضه وأسلافه بالعطف» [@muslim، ج4 ص1938]. وفي اللسان أنه أراد «فإِنّ أَبي وَوَالِدَهُ وَآبَائِي وأَسلافي فأَتى بالعُموم بَعْد» الخصوص [@lisan، ج7 ص171]."
    - title: "استعارة الوقاء"
      text: "جعل الأعراض دروعًا تقي عِرض النبي من الشتم، فالهجاء سهام والأعراض تتلقاها."
  connection: "ثم يختم بالفخر بلسانه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "فَإِنْنَ أَبِي / وَوَالِدَهُو / وَعِرْضِي = مفاعلَتن / مفاعلَتن / فعولن — لِعِرْضِ مُحَمْ / مَدِنْ مِنْكُمْ / وِقَاءُو = مفاعلَتن / مفاعلْتن / فعولن"
context: "يروي البغدادي عن ابن دُرَيْد أن النبي صلى الله عليه وسلم قال لحسّان لما بلغ هذا البيت: «وقاك الله يَا حسان حر النَّار» [@khizana، ج9 ص236]. وهو في رواية سِماك بن حرب عند أبي الفَرَج [@aghani-dk، ج4 ص139]، وفي رواية عائشة عند مسلم [@muslim، ج4 ص1936]."
