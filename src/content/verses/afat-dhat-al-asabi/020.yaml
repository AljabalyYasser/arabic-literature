first: "فَنُحْكِمُ بِالْقَوَافِي مَنْ هَجَانَا"
second: "وَنَضْرِبُ حِينَ تَخْتَلِطُ الدِّمَاءُ"
meaning: "فنكفّ بقصائدنا من هجانا ونردعه، ونضرب بالسيوف حين تختلط الدماء في المعركة."
vocabulary:
  - term: "نُحْكِمُ"
    text: "«نمنعه ونكفه، وَمِنْه سمى القَاضِي حَاكما، لِأَنَّهُ يمْنَع النَّاس من الظُّلم» [@ibn-hisham، ج2 ص423]، وفي الخزانة: «أحكمه: كَفه وَمنعه» [@khizana، ج9 ص236]."
  - term: "الْقَوَافِي"
    text: "القصائد، سُمّيت بآخر ما فيها. ويستشهد ابن منظور بالبيت على تسمية الكلمة التي فيها القافية قافية، ثم القصيدة [@lisan، ج15 ص196]."
syntax:
  - "«فَنُحْكِمُ» الفاء عاطفة أو سببية، و«مَنْ» اسم موصول مفعول به، وجملة «هَجَانَا» صلته."
  - "«بِالْقَوَافِي» متعلق بـ«نُحْكِمُ»، والباء للاستعانة."
  - "«حِينَ تَخْتَلِطُ الدِّمَاءُ» ظرف مضاف إلى الجملة، متعلق بـ«نَضْرِبُ»."
morphology:
  - "«نُحْكِمُ» مضارع «أحكم» على وزن «أفعل»، وأصل معناه المنع، ومنه حَكَمة اللجام التي تمنع الفرس."
  - "«تَخْتَلِطُ» على وزن «تفتعل» من «خلط»."
rhetoric:
  thesis: "بيت يجمع سلاحَي الأنصار: القافية والسيف، وفيه تعريف حسّان لوظيفته."
  devices:
    - title: "المقابلة"
      text: "صدر للسان: «فَنُحْكِمُ بِالْقَوَافِي»، وعجز لليد: «وَنَضْرِبُ». فالهجاء معركة كالقتال."
    - title: "المجاز المرسل في «الْقَوَافِي»"
      text: "أطلق الجزء، وهو القافية، وأراد الكل، وهو القصيدة."
    - title: "الكناية في «تَخْتَلِطُ الدِّمَاءُ»"
      text: "لا يذكر شدة القتال، بل لازمها: دماء الفريقين تختلط. وهي كناية بالمعنى الذي يحدّه عبد القاهر: معنى «هو تاليه وردفه في الوجود» [@dalail، ج1 ص66]."
  connection: "ثم يلتفت إلى أبي سفيان بن الحارث برسالة."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "فَنُحْكِمُ بِلْ / قَوَافِي مَنْ / هَجَانَا = مفاعلَتن / مفاعلْتن / فعولن — وَنَضْرِبُ حِي / نَ تَخْتَلِطُدْ / دِمَاءُو = مفاعلَتن / مفاعلَتن / فعولن"
context: "آخر قسم الرسالة والأنصار (15–20). والبيت مما يُحتج به في معنى «أحكم» بمعنى منع وكفّ."
