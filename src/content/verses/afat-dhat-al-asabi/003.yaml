first: "وَكَانَتْ لَا يَزَالُ بِهَا أَنِيسٌ"
second: "خِلَالَ مُرُوجِهَا نَعَمٌ وَشَاءُ"
meaning: "وكانت هذه الديار عامرة لا يفارقها الناس، وبين مروجها الإبل والغنم ترعى."
vocabulary:
  - term: "أَنِيسٌ"
    text: "ناس يُؤنس بهم، أي سكان."
  - term: "مُرُوجِهَا"
    text: "جمع مَرْج، وهو الأرض الواسعة فيها نبت كثير ترعاه الدواب."
  - term: "نَعَمٌ"
    text: "«قَالَ السُّهيْلي: النعم: الْإِبِل فَإِذا قيل: الْأَنْعَام دخل فِيهَا الْبَقر وَالْغنم» [@khizana، ج9 ص234]."
  - term: "شَاءُ"
    text: "الغنم، اسم جمع. ويقول البغدادي: «وَالشَّاء والشوي: اسْم للْجَمِيع» [@khizana، ج9 ص234]."
syntax:
  - "«كَانَتْ» ناقصة، واسمها ضمير الديار، وجملة «لَا يَزَالُ بِهَا أَنِيسٌ» خبرها."
  - "«لَا يَزَالُ» فعل ناقص يفيد الاستمرار، واسمه «أَنِيسٌ»، و«بِهَا» خبره مقدمًا."
  - "في العجز يقول البغدادي: «خلال ظرف بِمَعْنى بَين خبر مقدم. وَنعم: مُبْتَدأ مُؤخر» [@khizana، ج9 ص234]."
morphology:
  - "«أَنِيسٌ» على وزن «فعيل» من «أنس»، يقع على الواحد والجماعة."
  - "«شَاءُ» اسم جمع لا واحد له من لفظه بالمعنى نفسه، و«الشَّاة فَلَيْسَتْ من لفظ الشَّاء لَام الْفِعْل مِنْهَا تَاء» كما يقول البغدادي [@khizana، ج9 ص234]، ويريد أن أصل «شاة» شَوْهة، وفي «شاء» تُقلب الواو همزة."
rhetoric:
  thesis: "بيت المقابلة الصامتة: الخلاء في البيتين السابقين، والعمران هنا."
  devices:
    - title: "الطباق بين الزمنين"
      text: "«وَكَانَتْ لَا يَزَالُ بِهَا أَنِيسٌ» بعد «مَنْزِلُهَا خَلَاءُ» و«قَفْرٌ»: الماضي العامر في مقابل الحاضر الخالي، والفعل «كانت» وحده يحمل الحسرة."
    - title: "الحياة في صورة القطيع"
      text: "«نَعَمٌ وَشَاءُ» بين المروج: لا يذكر الناس أنفسهم، بل ماشيتهم، فهي علامة الغنى والإقامة."
  connection: "ثم يقطع حديث الديار فجأة بـ«فدع هذا»، وينتقل إلى خيال الحبيبة."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "وَكَانَتْ لَا / يَزَالُ بِهَا / أَنِيسُنْ = مفاعلْتن / مفاعلَتن / فعولن — خِلَالَ مُرُو / جِهَا نَعَمُنْ / وَشَاءُو = مفاعلَتن / مفاعلَتن / فعولن"
context: "آخر أبيات الطلل الثلاثة (1–3)."
