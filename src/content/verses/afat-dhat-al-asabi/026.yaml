first: "أَمَنْ يَهْجُو رَسُولَ اللَّهِ مِنْكُمْ"
second: "وَيَمْدَحُهُ وَيَنْصُرُهُ سَوَاءُ"
meaning: "أفمن يهجو رسول الله منكم ومن يمدحه وينصره سواء؟ لا يستويان."
vocabulary:
  - term: "سَوَاءُ"
    text: "متساويان، لا فضل لأحدهما على الآخر."
  - term: "يَنْصُرُهُ"
    text: "يعينه ويدفع عنه."
syntax:
  - "«أَمَنْ» الهمزة للاستفهام الإنكاري، و«مَنْ» موصول مبتدأ، وجملة «يَهْجُو» صلته، و«مِنْكُمْ» متعلق بحال."
  - "«وَيَمْدَحُهُ وَيَنْصُرُهُ» معطوفتان على الصلة، والتقدير: ومن يمدحه وينصره، فحُذف الموصول."
  - "«سَوَاءُ» خبر المبتدأ، وهو يُخبر به عن الاثنين فأكثر."
morphology:
  - "«سَوَاء» مصدر بمعنى الاستواء، يوصف به ويُخبر به عن المفرد والمثنى والجمع بلفظ واحد."
rhetoric:
  thesis: "سؤال لا ينتظر جوابًا: الفريقان لا يستويان."
  devices:
    - title: "الاستفهام الإنكاري"
      text: "«أَمَنْ يَهْجُو ... سَوَاءُ»: يسأل ليحمل السامع على الإنكار. والجواب، وهو «لا»، لا يقوله الشاعر، فيقوله السامع في نفسه."
    - title: "حذف الموصول"
      text: "«وَيَمْدَحُهُ وَيَنْصُرُهُ»: الكلام على فريقين، لكنه لم يكرر «مَنْ»، فجمعهما في جملة واحدة ليقوم التقابل داخلها."
  connection: "ثم يقول ما سيبذله هو في هذا النصر: أباه وجده وعرضه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "أَمَنْ يَهْجُو / رَسُولَلْ لَا / هِ مِنْكُمْ = مفاعلْتن / مفاعلْتن / فعولن — وَيَمْدَحُهُو / وَيَنْصُرُهُو / سَوَاءُو = مفاعلَتن / مفاعلَتن / فعولن"
context: "في رواية مسلم «فَمَنْ يَهْجُو رَسُولَ الله منك» [@muslim، ج4 ص1938]، وفي الديوان «فمن» [@diwan-hassan، ص18]."
