first: "هَجَوْتَ مُبَارَكًا بَرًّا حَنِيفًا"
second: "أَمِينَ اللَّهِ شِيمَتُهُ الْوَفَاءُ"
meaning: "هجوتَ رجلًا مباركًا، كثير البرّ، مائلًا عن الباطل إلى الحق، أمينَ الله، خُلقه الوفاء."
vocabulary:
  - term: "بَرًّا"
    text: "«فالبر الواسع الخير والنفع»، من شرح محقق صحيح مسلم [@muslim، ج4 ص1938]."
  - term: "حَنِيفًا"
    text: "«الحنيف: الْمُسلم، وسمى حَنِيفا، لِأَنَّهُ مَال عَن الْبَاطِل إِلَى الْحق» [@ibn-hisham، ج2 ص424]. وأصل الحَنَف الميل."
  - term: "شِيمَتُهُ"
    text: "«طَبِيعَته» [@ibn-hisham، ج2 ص424]، وفي اللسان: «الشِّيمةُ: الخُلُقُ» [@lisan، ج12 ص329]."
syntax:
  - "«مُبَارَكًا» مفعول به لـ«هَجَوْتَ»، و«بَرًّا» و«حَنِيفًا» صفتان له."
  - "«أَمِينَ اللَّهِ» صفة رابعة أو بدل."
  - "«شِيمَتُهُ الْوَفَاءُ» جملة اسمية صفة أخيرة."
morphology:
  - "«مُبَارَك» اسم مفعول من «بارك» على وزن «فاعل»."
  - "«حَنِيف» على وزن «فعيل» من «حنف»."
  - "«أَمِين» على وزن «فعيل» بمعنى مفعول، أي مؤتمن."
rhetoric:
  thesis: "يقلب الهجاء: يعيد على المهجوّ صفات من هجاه، فيصير البيت مدحًا للنبي وهجاء لأبي سفيان معًا."
  devices:
    - title: "تتابع الصفات"
      text: "«مُبَارَكًا بَرًّا حَنِيفًا أَمِينَ اللَّهِ»: أربع صفات بلا عاطف، وتكرار «هَجَوْتَ» من البيت 23 يجعل كل صفة تهمة على الهاجي: هجوت هذا كله؟"
    - title: "التكرار"
      text: "«هَجَوْتَ» في أول البيت 23 وأول هذا البيت: يعيد الفعل نفسه ليزيد الإنكار."
  connection: "ثم يسأل: أيستوي من يهجوه ومن يمدحه؟"
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "هَجَوْتَ مُبَا / رَكَنْ بَرْرَنْ / حَنِيفَنْ = مفاعلَتن / مفاعلْتن / فعولن — أَمِينَلْ لَا / هِ شِيمَتُهُلْ / وَفَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "يقول عرفات إن هذا البيت «زيادة من السيرة» [@diwan-hassan، ص20]، أي أنه ليس في مخطوطات رواية ابن حبيب. وله مع ذلك شاهد مستقل: هو في رواية عائشة عند مسلم بلفظ آخر [@muslim، ج4 ص1936]."
variants:
  - reading: "هَجَوْتَ مُحَمَّدًا بَرًّا تَقِيًّا ... رَسُولَ اللَّهِ شِيمَتُهُ الْوَفَاءُ"
    status: "رواية مسلم"
    note: "ويقول المحقق: «وفي كثير من النسخ: حنيفا، بدل تقيا» [@muslim، ج4 ص1938]."
