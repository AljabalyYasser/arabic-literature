first: "كَأَنَّ خَبِيئَةً مِنْ بَيْتِ رَأْسٍ"
second: "يَكُونُ مِزَاجَهَا عَسَلٌ وَمَاءُ"
meaning: "كأن خمرًا مصونة جيء بها من بيت رأس، ممزوجة بعسل وماء، [في فمها]. يشبّه طعم ريقها بالخمر الممزوجة. وخبر «كأنّ» غير مذكور في رواية السيرة، فقدّره السُّهَيْليّ: «كأن في فيها» [@khizana، ج9 ص227]."
vocabulary:
  - term: "خَبِيئَةً"
    text: "«الخبيئة: الْخمر المخبوءة المصونة المضنون بهَا» [@ibn-hisham، ج2 ص422]. وتُروى «سبيئة»، وهي «الْخمر الَّتِي تسبأ أَي: تشترى» [@khizana، ج9 ص228]، وفي اللسان: «وَمِنْهُ سُمِّيَتِ الْخَمْرُ سَبِيئةً» [@lisan، ج1 ص93]."
  - term: "بَيْتِ رَأْسٍ"
    text: "«مَوضِع بالأردن مَشْهُور بِالْخمرِ الجيدة» [@ibn-hisham، ج2 ص422]. وينقل البغدادي أنه «اسْم قَرْيَة بِالشَّام من نَاحيَة الْأُرْدُن كَانَت الْخُمُور تبَاع فِيهَا»، ثم: «وَقيل: الرَّأْس هُنَا بِمَعْنى الرئيس أَي: من بَيت رَئِيس» [@khizana، ج9 ص229–230]. ويقول المُبَرِّد: «يعني موضعا» [@kamil، ج1 ص106]."
  - term: "مِزَاجَهَا"
    text: "ما تُمزج به، أي يُخلط بها."
syntax:
  - "«كَأَنَّ» حرف تشبيه ناسخ، و«خَبِيئَةً» اسمها، و«مِنْ بَيْتِ رَأْسٍ» متعلق بصفة لها."
  - "خبر «كأنّ» محذوف في رواية السيرة. قال السُّهَيْليّ: «خبر كَأَن فِي هَذَا الْبَيْت مَحْذُوف تَقْدِيره: كَأَن فِي فِيهَا» [@khizana، ج9 ص227]. وعلى رواية الديوان خبرها في البيت التالي «على أنيابها»، يقول البغدادي: «وَخبر كَأَن الْمُشَدّدَة فِي بَيت يَلِيهِ» [@khizana، ج9 ص227]."
  - "وفي العجز وجوه: رواية سِيبَوَيْه «بِنصب مزاجها على أَنه خبر مقدم وَرفع عسل على أَنه اسْم مُؤخر» [@khizana، ج9 ص226]، أي أن اسم «يكون» نكرة «عَسَلٌ» وخبرها معرفة «مِزَاجَهَا»، وهو خلاف الأصل، يقول فيه سِيبَوَيْه: «وقد يجوز في الشعر وفي ضعْفٍ من الكلام» [@sibawayh، ج1 ص48]. وفي رواية أخرى يُرفع الجميع على أن اسم «يكون» ضمير الشأن، والجملة «مزاجُها عسلٌ» خبرها [@khizana، ج9 ص225]."
  - "و«مَاءُ» معطوف على «عَسَلٌ»."
morphology:
  - "«خَبِيئَةٌ» «فعيلة» بمعنى مفعولة من «خبأ»، أي مخبوءة. ومثلها «سبيئة»: «فعيلة بِمَعْنى مفعولة» [@khizana، ج9 ص228]."
  - "«مِزَاجٌ» على وزن «فِعَال»، اسم لما يُمزج به."
rhetoric:
  thesis: "تشبيه الريق بالخمر الممزوجة، وهو من مألوف النسيب الجاهلي، أخذه حسّان، كما يرى البغدادي، من امرئ القيس."
  devices:
    - title: "تشبيه بلا وجه مذكور"
      text: "«كَأَنَّ خَبِيئَةً»: المشبّه، وهو ريقها، لم يُذكر في رواية السيرة، والسامع يفهمه من البيت السابق عن شعثاء. فالتشبيه هنا محذوف أحد طرفيه، والقرينة السياق."
    - title: "الحذف"
      text: "حذف خبر «كأنّ»، وهو المكان الذي فيه الخمر: فمها. ويقول عبد القاهر في الحذف: «هو باب دقيق المسلك، لطيف المأخذ، عجيب الأمر، شبيه بالسحر، فإنك ترى به ترك الذكر، أفصح من الذكر» [@dalail، ج1 ص146]. فالسامع هنا يتمّ الصورة بنفسه."
    - title: "تخصيص العسل والماء"
      text: "«عَسَلٌ وَمَاءُ»: يقول اللَّخْمِيّ كما ينقل البغدادي: «وَخص الْعَسَل وَالْمَاء لِأَن الْعَسَل أحلى مَا يخالطها وَأَنه يذهب بمرارتها وَأما المَاء فيبردها ويلينها» [@khizana، ج9 ص230]. فالخمر الممزوجة أعذب من الصرف."
    - title: "الأخذ من امرئ القيس"
      text: "يرى البغدادي أن «بَيت حسان مَعَ مَا بعده مَأْخُوذ من قَول امْرِئ الْقَيْس» في وصف المدام وصوب الغمام على أنياب صاحبته [@khizana، ج9 ص230]."
  connection: "ثم يترك ريق شعثاء ويمضي في الخمر نفسها: هي أطيب الأشربة."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "كَأَنْنَ خَبِي / ئَتَنْ مِنْ بَيْ / تِ رَأْسِنْ = مفاعلَتن / مفاعلْتن / فعولن — يَكُونُ مِزَا / جَهَا عَسَلُنْ / وَمَاءُو = مفاعلَتن / مفاعلَتن / فعولن"
context: "البيت شاهد مشهور عند النحاة، أورده سِيبَوَيْه في باب «كان» [@sibawayh، ج1 ص49]، وشرحه البغدادي في الشاهد الثاني والثلاثين بعد السبعمئة من «خزانة الأدب» [@khizana، ج9 ص224]."
variants:
  - reading: "كَأَنَّ سَبِيئَةً مِنْ بَيْتِ رَأْسٍ"
    status: "رواية أخرى"
    note: "رواية سِيبَوَيْه [@sibawayh، ج1 ص49] والمُبَرِّد [@kamil، ج1 ص106]. وفي الخزانة «وروى: كَأَن سلافة» أيضًا [@khizana، ج9 ص229]."
  - reading: "عَلَى أَنْيَابِهَا أَوْ طَعْمُ غَضٍّ ... مِنَ التُّفَّاحِ هَصَّرَهُ اجْتِنَاءُ"
    status: "بيت زائد، منسوب"
    note: "بعد هذا البيت في الديوان [@diwan-hassan، ص17]، وفيه خبر «كأنّ». يقول البغدادي: «وَالْبَيْت الثَّانِي ثَابت فِي ديوَان حسان وَهُوَ عِنْدِي نُسْخَة قديمَة تَارِيخ كِتَابَته سنة أَربع وَثَلَاثِينَ وثلثمائة»، ثم ينقل قول السُّهَيْليّ فيه: «وَهُوَ مَصْنُوع لَا يشبه شعر حسان وَلَا لَفظه» [@khizana، ج9 ص227–228]. وليس في رواية ابن إسحاق."
