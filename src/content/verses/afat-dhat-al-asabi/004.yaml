first: "فَدَعْ هَذَا وَلَكِنْ مَنْ لِطَيْفٍ"
second: "يُؤَرِّقُنِي إِذَا ذَهَبَ الْعِشَاءُ"
meaning: "فاترك ذكر الديار. ولكن من يُعينني على خيال الحبيبة الذي يزورني في النوم، ثم يذهب فيتركني ساهرًا بعد أن يمضي أول الليل؟"
vocabulary:
  - term: "طَيْفٍ"
    text: "«الطيف: خيال المحبوبة يلم فِي النّوم» [@ibn-hisham، ج2 ص422]، وفي اللسان: «والطَّيْفُ والطِّيفُ: الخَيالُ نفسُه» [@lisan، ج9 ص228]."
  - term: "يُؤَرِّقُنِي"
    text: "«يسهرني» [@ibn-hisham، ج2 ص422]."
  - term: "الْعِشَاءُ"
    text: "أول الليل بعد المغرب."
syntax:
  - "«فَدَعْ هَذَا» أمر، و«هذا» إشارة إلى حديث الديار كله."
  - "«مَنْ لِطَيْفٍ» استفهام: «مَنْ» مبتدأ، و«لِطَيْفٍ» خبره، أي: من يتكفّل بطيف؟ ومثله في الكلام: من لي بكذا، أي من يعينني عليه."
  - "«يُؤَرِّقُنِي» صفة لـ«طَيْفٍ»، و«إِذَا ذَهَبَ الْعِشَاءُ» ظرف متعلق بها."
morphology:
  - "«دَعْ» أمر من «وَدَعَ»، لا يُستعمل ماضيه إلا قليلًا، ويُستغنى عنه بـ«ترك»."
  - "«يُؤَرِّقُ» مضارع «أرّق» المضعّف، من الأَرَق وهو السهر."
rhetoric:
  thesis: "بيت التخلّص من الطلل إلى النسيب، يقطع به حديثًا ويفتح آخر."
  devices:
    - title: "الاستدراك بعد الإضراب"
      text: "«فَدَعْ هَذَا وَلَكِنْ»: يأمر نفسه أن تترك الديار، ثم يستدرك بما هو أشد: الطيف. وهي صيغة معروفة في الانتقال بين أقسام القصيدة."
    - title: "الاستفهام في «مَنْ لِطَيْفٍ»"
      text: "لا يسأل عن شخص بعينه، بل يشكو: لا أحد يردّ عنه هذا الخيال."
    - title: "مفارقة الطيف المؤرّق"
      text: "الطيف يأتي في النوم، فكيف يسهره؟ يجيب البغدادي: «أَن الَّذِي يؤرقه لوعة يجدهَا عِنْد زَوَاله» [@khizana، ج9 ص234]. فالأرق بعد الطيف لا معه."
  connection: "ثم يسمّي صاحبة الطيف: شَعْثاء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "فَدَعْ هَاذَا / وَلَاكِنْ مَنْ / لِطَيْفِنْ = مفاعلْتن / مفاعلْتن / فعولن — يُؤَرْرِقُنِي / إِذَا ذَهَبَلْ / عِشَاءُو = مفاعلَتن / مفاعلَتن / فعولن"
  note: "في «هَذَا» و«لَكِنْ» ألف تُنطق ولا تُكتب، فهما في الوزن «هاذا» و«لاكنْ»."
context: "أول القسم الثاني: الطيف وشَعْثاء والخمر (4–9)."
