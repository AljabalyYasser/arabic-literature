first: "تَظَلُّ جِيَادُنَا مُتَمَطِّرَاتٍ"
second: "يُلَطِّمُهُنَّ بِالْخُمُرِ النِّسَاءُ"
meaning: "تظل خيلنا الكريمة تتسابق مسرعة، والنساء يضربن وجوهها بخُمُرهن ليرددنها. وفي رواية الخليل: يمسحن عنها الغبار بخُمُرهن."
vocabulary:
  - term: "جِيَادُنَا"
    text: "جمع جواد، وهو الفرس الكريم السريع."
  - term: "مُتَمَطِّرَاتٍ"
    text: "«قيل مَعْنَاهُ المصوبات بالمطر. وَيُقَال: المتمطرات: الَّتِي يسْبق بَعْضهَا بَعْضًا» [@ibn-hisham، ج2 ص423]. وفي اللسان: «يُقَالُ: تَمَطَّرَ بِهِ فَرَسُه إِذا جَرَى وأَسرعَ» [@lisan، ج5 ص180]. وفي الخزانة: «المتمطرات: الْخَوَارِج من جُمْهُور الْخَيل» [@khizana، ج9 ص235]."
  - term: "يُلَطِّمُهُنَّ"
    text: "«تضرب النِّسَاء وجوههن لتردهن» [@ibn-hisham، ج2 ص423]."
  - term: "الْخُمُرِ"
    text: "«جمع خمار، وَهُوَ مَا تغطى بِهِ الْمَرْأَة رَأسهَا ووجهها» [@ibn-hisham، ج2 ص423]."
syntax:
  - "«تَظَلُّ» فعل ناقص، و«جِيَادُنَا» اسمها، و«مُتَمَطِّرَاتٍ» خبرها."
  - "«يُلَطِّمُهُنَّ بِالْخُمُرِ النِّسَاءُ» جملة حالية، و«النِّسَاءُ» فاعل مؤخر، وتقدّم المفعول «هُنَّ» لأنه ضمير متصل."
  - "تذكير الفعل «يُلَطِّمُ» مع فاعل مؤنث «النساء» جائز، لأنه جمع تكسير."
morphology:
  - "«مُتَمَطِّرَاتٌ» اسم فاعل من «تمطّر» على وزن «تفعّل»."
  - "«يُلَطِّمُ» مضارع «لطّم» المضعّف للتكثير: لطم بعد لطم."
  - "«الْخُمُرُ» جمع «خِمار» على وزن «فُعُل»."
rhetoric:
  thesis: "مشهد من الفتح قبل أن يقع: الخيل تجري والنساء يواجهنها."
  devices:
    - title: "المشهد الحي"
      text: "«تَظَلُّ ... يُلَطِّمُهُنَّ»: الفعلان مضارعان، و«ظلّ» تدل على الاستمرار طول النهار، فالصورة تتحرك أمام السامع."
    - title: "روايتان ومعنيان"
      text: "«يُلَطِّمُهُنَّ»: النساء يضربن وجوه الخيل ليرددنها. وينقل محققو السيرة عن ابن دُرَيْد أن «الْخَلِيل رَحمَه الله يرْوى بَيت حسان: (يطلمهن بِالْخمرِ) وينكر: (يلطمهن) ويجعله بِمَعْنى ينفض النِّسَاء بِخُمُرِهِنَّ مَا عليهنّ من غُبَار» [@ibn-hisham، ج2 ص423]. وفي اللسان: «وطَلَّمَ العَرَقَ عَنْ جَبينه: مسحَه» [@lisan، ج12 ص369]. فعلى الأولى نساء العدو يدفعن الخيل، وعلى الثانية نساء القوم يكرمن خيلهم."
  connection: "ثم يخاطب قريشًا: إن أعرضتم دخلنا معتمرين، وإلا فالحرب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "تَظَلْلُ جِيَا / دُنَا مُتَمَطْ / طِرَاتِنْ = مفاعلَتن / مفاعلَتن / فعولن — يُلَطْطِمُهُنْ / نَ بِلْخُمُرِنْ / نِسَاءُو = مفاعلَتن / مفاعلَتن / فعولن"
context: "يروي ابن هشام بعد القصيدة: «وَبَلَغَنِي عَنْ الزُّهْرِيِّ أَنَّهُ قَالَ: لَمَّا رَأَى رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ النِّسَاءَ يَلْطِمْنَ الْخَيْلَ بِالْخُمُرِ تَبَسَّمَ إلَى أَبِي بَكْرٍ» [@ibn-hisham، ج2 ص424]. فالخبر يجعل البيت وعيدًا تحقّق يوم الفتح."
