first: "شَهِدْتُ بِهِ فَقُومُوا صَدِّقُوهُ"
second: "فَقُلْتُمْ لَا نَقُومُ وَلَا نَشَاءُ"
meaning: "شهدت بصدق هذا العبد فقلت لكم: قوموا صدّقوه، فقلتم: لا نقوم ولا نريد."
vocabulary:
  - term: "نَشَاءُ"
    text: "نريد."
syntax:
  - "«شَهِدْتُ بِهِ» الضمير في «بِهِ» يعود على العبد أو على الحق."
  - "«فَقُومُوا صَدِّقُوهُ» أمران متتاليان بلا عاطف، والثاني بيان للأول."
  - "«فَقُلْتُمْ لَا نَقُومُ وَلَا نَشَاءُ» مقول القول، ومفعول «نَشَاءُ» محذوف، أي لا نشاء ذلك."
morphology:
  - "«صَدِّقُوهُ» أمر من «صدّق» المضعّف."
  - "«نَشَاءُ» مضارع «شاء»، أصله «نَشْيَأُ»."
rhetoric:
  thesis: "حوار قصير بين الشاعر وقريش، في بيت واحد."
  devices:
    - title: "الحوار"
      text: "«فَقُومُوا صَدِّقُوهُ ... فَقُلْتُمْ لَا نَقُومُ»: نصف البيت دعوة ونصفه رفض، ويعيد الرافضون لفظ «قوموا» نفسه منفيًّا، فيبدو رفضهم عنادًا."
    - title: "إيجاز الحذف"
      text: "«وَلَا نَشَاءُ»: حذف المفعول ليعمّ الرفض كل شيء."
  connection: "ثم يعود إلى «وقال الله»: هذه المرة عن الأنصار."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "شَهِدْتُ بِهِي / فَقُومُو صَدْ / دِقُوهُو = مفاعلَتن / مفاعلْتن / فعولن — فَقُلْتُمْ لَا / نَقُومُ وَلَا / نَشَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "يقول محققو السيرة إن «رِوَايَة الدِّيوَان: (وقومي)» [@ibn-hisham، ج2 ص423]، وعليها يكون الكلام خبرًا: شهدت وقومي صدّقوه."
variants:
  - reading: "شَهِدْتُ بِهِ وَقَوْمِي صَدَّقُوهُ ... فَقُلْتُمْ مَا نُجِيبُ وَمَا نَشَاءُ"
    status: "رواية الديوان"
    note: "[@diwan-hassan، ص18] [@khizana، ج9 ص232]."
