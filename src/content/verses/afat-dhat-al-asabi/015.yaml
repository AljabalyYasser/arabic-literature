first: "وَجِبْرِيلٌ رَسُولُ اللَّهِ فِينَا"
second: "وَرُوحُ الْقُدْسِ لَيْسَ لَهُ كِفَاءُ"
meaning: "وجبريل رسول الله معنا، وروح القدس لا مِثل له ولا نظير. والبيت فخر بأن جبريل في صفّ الأنصار."
vocabulary:
  - term: "رُوحُ الْقُدْسِ"
    text: "يريد جبريل نفسه، وقد عطفه عليه في البيت."
  - term: "كِفَاءُ"
    text: "«مثل» [@ibn-hisham، ج2 ص423]، وفي صحيح مسلم: «ليس له مماثل ولا مقاوم» من شرح المحقق [@muslim، ج4 ص1937–1938]."
syntax:
  - "«وَجِبْرِيلٌ رَسُولُ اللَّهِ فِينَا» جملة اسمية: «جِبْرِيلٌ» مبتدأ، و«فِينَا» خبره، و«رَسُولُ اللَّهِ» بدل من جبريل أو صفة."
  - "«وَرُوحُ الْقُدْسِ لَيْسَ لَهُ كِفَاءُ»: «رُوحُ الْقُدْسِ» مبتدأ، وجملة «لَيْسَ لَهُ كِفَاءُ» خبره."
morphology:
  - "«جِبْرِيلٌ» اسم أعجمي، وصرفُه هنا للضرورة: نُوّن ليستقيم الوزن، كما في رواية مسلم «وَجِبْرِيلٌ» [@muslim، ج4 ص1937–1938]."
  - "«كِفَاء» مصدر «كافأ» على وزن «فِعَال»، يوصف به بمعنى المكافئ."
  - "«الْقُدْس» بسكون الدال تخفيف «القُدُس»."
rhetoric:
  thesis: "فخر جديد على الشعر العربي: الحليف هنا من الملائكة، لا من القبائل."
  devices:
    - title: "التكرار بالترادف"
      text: "«جِبْرِيلٌ» ثم «رُوحُ الْقُدْسِ»: يذكره باسمه ثم بلقبه، فيجعل للعجز كله صفة واحدة: لا نظير له."
    - title: "نقل الفخر من القبيلة إلى الرسالة"
      text: "«فِينَا»: الضمير للأنصار. كان الفخر الجاهلي بالآباء والأحلاف، وهنا يفخر حسّان بأن قومه موضع الوحي."
  connection: "ثم يقول ما قال الله: أرسلت عبدًا، ويسّرت جندًا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "وَجِبْرِيلُنْ / رَسُولُلْ لَا / هِ فِينَا = مفاعلْتن / مفاعلْتن / فعولن — وَرُوحُلْ قُدْ / سِ لَيْسَ لَهُو / كِفَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "صُرف «جبريل» في الوزن، ولولا التنوين ما استقام الصدر."
context: "يقتبس شوقي ضَيْف هذا البيت مثالًا لاختلاط المعاني الجاهلية بالإسلامية في الجزء الثاني من القصيدة، برواية «وجبريل أمين الله فينا» [@deif، ج2 ص82]. وهذا البيت في السيرة بعد البيت 14، وموضعه في الديوان والخزانة بعد «شهدت به»، أي بعد البيت 17 [@diwan-hassan، ص18] [@khizana، ج9 ص232]."
