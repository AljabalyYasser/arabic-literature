first: "إِذَا مَا الْأَشْرِبَاتُ ذُكِرْنَ يَوْمًا"
second: "فَهُنَّ لِطَيِّبِ الرَّاحِ الْفِدَاءُ"
meaning: "إذا ذُكرت الأشربة يومًا فكلها فداء لهذه الخمر الطيبة، أي لا يدانيها شراب."
vocabulary:
  - term: "الْأَشْرِبَاتُ"
    text: "«جمع الْأَشْرِبَة: والأشربة: جمع شراب. يُرِيد أَن الْأَشْرِبَة غير رَاح بَيت رَأس لَا تدانيها فِي اللَّذَّة» [@ibn-hisham، ج2 ص422]."
  - term: "الرَّاحِ"
    text: "الخمر."
  - term: "الْفِدَاءُ"
    text: "ما يُفدى به الشيء ويُقدَّم عنه."
syntax:
  - "«إِذَا» ظرف شرطي، و«ذُكِرْنَ» فعل الشرط مبني للمجهول، ونون النسوة ضمير «الْأَشْرِبَاتُ» نائب الفاعل، و«الْأَشْرِبَاتُ» مرفوع بفعل محذوف يفسّره المذكور، و«مَا» زائدة."
  - "«فَهُنَّ لِطَيِّبِ الرَّاحِ الْفِدَاءُ» جواب الشرط: «هُنَّ» مبتدأ، و«الْفِدَاءُ» خبره، و«لِطَيِّبِ الرَّاحِ» متعلق به."
  - "«طَيِّبِ الرَّاحِ» من إضافة الصفة إلى الموصوف، أي: للراح الطيبة."
morphology:
  - "«الْأَشْرِبَاتُ» جمع الجمع: شراب ثم أشربة ثم أشربات، كما يقول محققو السيرة [@ibn-hisham، ج2 ص422]."
  - "«الْفِدَاءُ» مصدر «فدى» على وزن «فِعَال»."
rhetoric:
  thesis: "تفضيل خمره على كل شراب بلغة الفداء، وهي لغة تقال للكرام من الناس."
  devices:
    - title: "التشخيص في «الْفِدَاءُ»"
      text: "جعل الأشربة أشخاصًا تفدي غيرها بأنفسها، كما يقال: نفسي فداؤك. فالفداء يكون بين الأحياء، ونقله إلى الأشربة."
    - title: "جمع الجمع"
      text: "اختار «الْأَشْرِبَاتُ» ولم يقل «الأشربة»: كأنه يجمع أنواع الشراب كلها وأصنافها، ثم يجعلها جميعًا دون خمره."
  connection: "ثم يذكر ما تفعله الخمر بالشاربين: يعتذرون بها إذا أساؤوا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "إِذَا مَلْأَشْ / رِبَاتُ ذُكِرْ / نَ يَوْمَنْ = مفاعلْتن / مفاعلَتن / فعولن — فَهُنْنَ لِطَيْ / يِبِرْ رَاحِلْ / فِدَاءُو = مفاعلَتن / مفاعلْتن / فعولن"
context: "يرويه المُبَرِّد في «الكامل» في باب ما قيل في الشراب [@kamil، ج1 ص106]."
