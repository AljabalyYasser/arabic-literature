first: "لِسَانِي صَارِمٌ لَا عَيْبَ فِيهِ"
second: "وَبَحْرِي لَا تُكَدِّرُهُ الدِّلَاءُ"
meaning: "لساني سيف قاطع لا عيب فيه، وبحري، وهو شعري، لا تكدّره الدلاء مهما أخذت منه."
vocabulary:
  - term: "صَارِمٌ"
    text: "«والصارمُ: السَّيْفُ الْقَاطِعُ» [@lisan، ج12 ص335]."
  - term: "تُكَدِّرُهُ"
    text: "تجعله كَدِرًا، و«الكَدَرُ: نَقِيضُ الصَّفَاءِ» [@lisan، ج5 ص134]."
  - term: "الدِّلَاءُ"
    text: "جمع دَلْو، وهو إناء يُستقى به الماء من البئر."
syntax:
  - "«لِسَانِي صَارِمٌ» مبتدأ وخبر، وجملة «لَا عَيْبَ فِيهِ» صفة لـ«صَارِمٌ»، و«لا» نافية للجنس."
  - "«وَبَحْرِي لَا تُكَدِّرُهُ الدِّلَاءُ»: «بَحْرِي» مبتدأ، والجملة الفعلية خبره، و«الدِّلَاءُ» فاعل مؤخر."
morphology:
  - "«صَارِم» اسم فاعل من «صرم» بمعنى قطع."
  - "«تُكَدِّرُ» مضارع «كدّر» المضعّف للتعدية."
  - "«الدِّلَاء» جمع «دلو» على وزن «فِعَال»."
rhetoric:
  thesis: "خاتمة الفخر بالشاعرية: لسان كالسيف وقريحة كالبحر."
  devices:
    - title: "التشبيه البليغ في «لِسَانِي صَارِمٌ»"
      text: "جعل لسانه سيفًا بلا أداة، والطرفان مذكوران، فهو تشبيه لا استعارة على حدّ عبد القاهر."
    - title: "الاستعارة في «وَبَحْرِي»"
      text: "أراد شعره أو قريحته، فسمّاها بحرًا ولم يذكرها. وهذه الاستعارة كما يحدّها عبد القاهر: «تجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ج1 ص67]. ثم رشّحها بما يناسب البحر: «لَا تُكَدِّرُهُ الدِّلَاءُ»، فالمستقون منه، أي من يأخذون من شعره أو يعارضونه، لا ينقصونه ولا يعكّرونه."
    - title: "المقابلة بين الصدر والعجز"
      text: "الصدر قوة، والعجز سعة وصفاء: يقطع بلسانه ويعطي من بحره."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "لِسَانِي صَا / رِمُنْ لَا عَيْ / بَ فِيهِي = مفاعلْتن / مفاعلْتن / فعولن — وَبَحْرِي لَا / تُكَدْدِرُهُدْ / دِلَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
context: "آخر القصيدة في رواية ابن إسحاق. وبعده في الديوان ثلاثة أبيات ليست في السيرة، يقول فيها عرفات: «فالأبيات 28، 29، 30 ليست في السيرة»، وينقل عن الروض أنها مما «زاد الشيباني في روايته» [@diwan-hassan، ص19]. وبعد البيت يقول ابن هشام: «وَيُرْوَى: «لِسَانِي صَارِمٌ لَا عَتْبَ فِيهِ»» [@ibn-hisham، ج2 ص424]."
variants:
