first: "وَإِلَّا فَاصْبِرُوا لِجِلَادِ يَوْمٍ"
second: "يُعِينُ اللَّهُ فِيهِ مَنْ يَشَاءُ"
meaning: "وإن لم تُعرضوا فاصبروا لقتال يوم بالسيوف، يعين الله فيه من يشاء."
vocabulary:
  - term: "جِلَادِ"
    text: "«الْقِتَال بِالسُّيُوفِ» [@ibn-hisham، ج2 ص423]."
syntax:
  - "«وَإِلَّا» أصلها «إنْ» الشرطية و«لا» النافية، وفعل الشرط محذوف، أي: وإن لا تعرضوا."
  - "«فَاصْبِرُوا» جواب الشرط مقترن بالفاء لأنه طلب."
  - "«يُعِينُ اللَّهُ فِيهِ مَنْ يَشَاءُ» صفة لـ«يَوْمٍ»، و«مَنْ» اسم موصول مفعول به."
morphology:
  - "«جِلَاد» مصدر «جالد» على وزن «فِعَال»، والمفاعلة تدل على المشاركة: ضرب متبادل."
  - "«يُعِينُ» مضارع «أعان»، أصله «يُعْوِنُ»، نُقلت كسرة الواو إلى العين فقُلبت ياء."
rhetoric:
  thesis: "الشطر الثاني من التقسيم: الحرب."
  devices:
    - title: "إضافة الجلاد إلى اليوم"
      text: "«لِجِلَادِ يَوْمٍ»: نكّر اليوم فعظّمه، كأنه يوم لا يُعرف مثله."
    - title: "إسناد النصر إلى المشيئة"
      text: "«يُعِينُ اللَّهُ فِيهِ مَنْ يَشَاءُ»: يختم الوعيد بعبارة تشبه لغة القرآن في الإيجاز، ولا يقول صراحة إن النصر لهم، فيترك الحكم ليوم القتال."
  connection: "ثم يذكر من معهم: جبريل وروح القدس."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "وَإِلْلَا فَصْ / بِرُو لِجِلَا / دِ يَوْمِنْ = مفاعلْتن / مفاعلَتن / فعولن — يُعِينُلْ لَا / هُ فِيهِي مَنْ / يَشَاءُو = مفاعلْتن / مفاعلْتن / فعولن"
  note: "الهاء في «فِيهِ» تُشبع فتصير «فِيهِي»."
context: "يقابل البيت السابق."
variants:
  - reading: "يُعِزُّ اللَّهُ فِيهِ مَنْ يَشَاءُ"
    status: "رواية أخرى"
    note: "يذكرها محققو السيرة [@ibn-hisham، ج2 ص423]، وهي رواية مسلم مع «لِضِرَابِ يَوْمٍ» [@muslim، ج4 ص1938]."
