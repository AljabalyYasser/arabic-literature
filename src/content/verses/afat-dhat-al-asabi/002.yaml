first: "دِيَارٌ مِنْ بَنِي الْحَسْحَاسِ قَفْرٌ"
second: "تُعَفِّيهَا الرَّوَامِسُ وَالسَّمَاءُ"
meaning: "هي ديار بني الحَسْحاس، قفر لا ساكن فيها، تمحو آثارَها الرياحُ التي تدفنها بالتراب، والمطرُ الذي يجرفها."
vocabulary:
  - term: "بَنِي الْحَسْحَاسِ"
    text: "يختلف فيهم الشرّاح: «قَالَ السكرِي: الحسحاس بن مَالك بن عدي بن النجار»، أي أنهم من رهط حسّان، و«قَالَ السُّهيْلي: بَنو الحسحاس حب من بني أَسد» [@khizana، ج9 ص233]، وفي الكلمة «حب» تصحيف «حيّ». ويزيد محققو السيرة: «وأصل الحسحاس الرجل الْجواد، وَلَعَلَّه مُرَاد هُنَا» [@ibn-hisham، ج2 ص422]."
  - term: "قَفْرٌ"
    text: "خالية لا نبات فيها ولا أنيس."
  - term: "تُعَفِّيهَا"
    text: "تمحوها وتُذهب آثارها، من «عفا» المتقدم."
  - term: "الرَّوَامِسُ"
    text: "«قَالَ السكرِي: والروامس: الرِّيَاح الَّتِي ترمس الْآثَار وتغطيها» [@khizana، ج9 ص233]، والرَّمْس: الدفن."
  - term: "السَّمَاءُ"
    text: "المطر هنا: «وَقَالَ السُّهيْلي: يَعْنِي بالسماء الْمَطَر» [@khizana، ج9 ص233]."
syntax:
  - "«دِيَارٌ» خبر لمبتدأ محذوف، أي: هي ديار. و«مِنْ بَنِي الْحَسْحَاسِ» صفة لها، و«قَفْرٌ» صفة ثانية."
  - "«تُعَفِّيهَا الرَّوَامِسُ» جملة فعلية في محل رفع صفة ثالثة، و«السَّمَاءُ» معطوفة على «الرَّوَامِسُ»."
morphology:
  - "«تُعَفِّي» مضارع «عفّى» المضعّف، والتضعيف للتكثير والتعدية: يعفّيها مرة بعد مرة."
  - "«الرَّوَامِسُ» جمع «رامسة»، اسم فاعل من «رمس»، على وزن «فواعل»."
  - "«قَفْرٌ» يوصف به المفرد والجمع، فوُصفت به الديار وهي جمع."
rhetoric:
  thesis: "يسمّي أهل الديار، ثم يجعل لعفائها فاعلين معروفين في الطلل: الريح والمطر."
  devices:
    - title: "إسناد المحو إلى الريح والمطر"
      text: "في «تُعَفِّيهَا الرَّوَامِسُ وَالسَّمَاءُ» جعل الريح والمطر فاعلين يمحوان، وهما يعملان معًا: الريح تدفن والمطر يجرف."
    - title: "المجاز في «السَّمَاءُ»"
      text: "أطلق اسم السماء وأراد المطر الذي ينزل منها. وينقل البغدادي عن السُّهَيْليّ أن السماء «لفظ مُشْتَرك يَقع على الْمَطَر وعَلى السَّمَاء الَّتِي هِيَ السّقف» [@khizana، ج9 ص233]، فهو عنده اسم للمطر حقيقة لا مجازًا."
  connection: "ثم يتذكر ما كانت عليه هذه الديار قبل أن تقفر."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف، وبعدها واو تنشأ من إشباع الضمة: «ـاءُو»"
  scansion: "دِيَارُنْ مِنْ / بَنِلْ حَسْحَا / سِ قَفْرُنْ = مفاعلْتن / مفاعلْتن / فعولن — تُعَفْفِيهَرْ / رَوَامِسُ وَسْ / سَمَاءُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "الحشو في الصدر معصوب كله."
context: "البيت الثاني من الطلل. وفي ترقيم الديوان يطابق ترقيم السيرة إلى البيت السادس [@diwan-hassan، ص17]."
