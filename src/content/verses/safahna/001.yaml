first: صَفَحْنَا عَنْ بَنِي ذُهْلٍ
second: وَقُلْنَا الْقَوْمُ إِخْوَانُ
vocabulary:
- term: صَفَحْنَا
  text: 'عفونا؛ قال البغدادي: «الصفح: العفو، وحقيقته أعرضنا عنهم وأوليناهم صفحة عنقنا» [@khizana، ج3 ص432].'
- term: بَنِي ذُهْلٍ
  text: 'قبيلة من رَبِيعة؛ «ذُهلان كلاهما من رَبِيعة: أحدهما ذهل بن شيبان بن ثعلبة بن عكابة، والآخر ذهل بن ثعلبة بن عكابة» [@lisan، ج11 ص260].'
