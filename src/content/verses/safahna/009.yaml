first: وَفِي الشَّرِّ نَجَاةٌ حِيـ
second: ـنَ لَا يُنْجِيكَ إِحْسَانُ
vocabulary:
- term: فِي الشَّرِّ نَجَاةٌ
  text: 'قال البغدادي: «أراد في دفع الشر، ويجوز أن يريد وفي عمل الشر نجاة، كأنه يريد: وفي الإساءة مخلص إذا لم يخلّصك الإحسان» [@khizana، ج3 ص434].'
