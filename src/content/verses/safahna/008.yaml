first: وَبَعْضُ الْحِلْمِ عِنْدَ الْجَهْـ
second: ـلِ لِلذِّلَّةِ إِذْعَانُ
vocabulary:
- term: الْجَهْلِ
  text: "السفه، وهو ضد الحلم؛ «السفه والسفاه والسفاهة: خفة الحلم، وقيل: نقيض الحلم» [@lisan، ج13 ص497]."
- term: إِذْعَانُ
  text: "انقياد، وفي حاشية محقق شرح الحماسة للتبريزي: «الإذعان الانقياد» [@tabrizi-hamasa، ج1 ص7، الحاشية]."
