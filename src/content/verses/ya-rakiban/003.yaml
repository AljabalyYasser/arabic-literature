first: قَتَلْتُ بِعَبْدِ اللَّهِ خَيْرَ لِدَاتِهِ
second: ذُؤَابَ بْنَ أَسْمَاءَ بْنِ زَيْدِ بْنِ قَارِبِ
vocabulary:
- term: لِدَاتِهِ
  text: أترابه، ممن وُلدوا معه في زمن واحد.
- term: ذُؤَابَ بْنَ أَسْمَاءَ
  text: قاتل عبد الله بن الصِّمَّة، أسره دُرَيْد وبعث به إلى أمه لتقتله بعبد الله [@ibn-qutayba، ج2 ص739].
