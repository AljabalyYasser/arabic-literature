first: رَدَسْنَاهُمُ بِالْخَيْلِ حَتَّى تَمَلَّأَتْ
second: عَوَافِي الضِّبَاعِ وَالذِّئَابِ السَّوَاغِبِ
vocabulary:
- term: رَدَسْنَاهُمُ
  text: صدمناهم ورميناهم بها؛ و«ردس الشيء... دكّه بشيء صلب» [@lisan، ج6 ص96].
- term: تَمَلَّأَتْ
  text: امتلأت وشبعت.
- term: عَوَافِي
  text: 'طالبات الرزق؛ «والعافية: طلاب الرزق من الإنس والدواب والطير» [@lisan، ج15 ص74].'
- term: السَّوَاغِبِ
  text: الجائعة.
