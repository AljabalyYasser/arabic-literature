explained: false
first: إِذَا أَحْزَنُوا تَغْشَى الْجِبَالَ رِجَالُنَا
second: كَمَا اسْتَوْفَزَتْ فُدْرُ الْوُعُولِ الْقَرَاهِبِ
vocabulary:
- term: أَحْزَنُوا
  text: صاروا إلى الحَزْن، وهو ما غلظ من الأرض، خلاف السهل.
- term: اسْتَوْفَزَتْ
  text: 'تهيّأت للوثوب؛ والمستوفز: الذي «قد استقلّ على رجليه ولمّا يستوِ قائمًا وقد تهيّأ للأفز والوثوب» [@lisan، ج5 ص430].'
- term: فُدْرُ الْوُعُولِ
  text: 'جمع فادر، وهو «الوعل العاقل في الجبل»، وقيل: الشاب التام، وقيل: المسنّ [@lisan، ج5 ص50].'
- term: الْقَرَاهِبِ
  text: 'المسانّ الضخام؛ «القرهب من الثيران: المسن الضخم» [@lisan، ج1 ص671].'
