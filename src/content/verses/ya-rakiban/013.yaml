first: فَلَيْتَ قُبُورًا بِالْمَخَاضَةِ أَخْبَرَتْ
second: فَتُخْبِرُ عَنَّا الْخُضْرَ خُضْرَ مُحَارِبِ
vocabulary:
- term: الْمَخَاضَةِ
  text: 'موضع؛ والمخاضة: الموضع الذي يُعبَر فيه الماء خوضًا.'
- term: الْخُضْرَ
  text: قبيلة، «سُمّوا بذلك لخضرة ألوانهم» [@lisan، ج4 ص244]، وهم من محارب.
