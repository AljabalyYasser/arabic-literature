explained: false
first: تَكُرُّ عَلَيْهِمْ رَجْلَتِي وَفَوَارِسِي
second: وَأُكْرِهُ فِيهِمْ صَعْدَتِي غَيْرَ نَاكِبِ
vocabulary:
- term: رَجْلَتِي
  text: رجّالتي، أي المقاتلون على أرجلهم؛ و«الرَّجْلة الرجّالة» عند أبي عَمْرو [@lisan، ج11 ص269].
- term: صَعْدَتِي
  text: 'قناتي؛ و«الصعدة: القناة، وقيل: القناة المستوية تنبت كذلك لا تحتاج إلى التثقيف» [@lisan، ج3 ص255].'
- term: غَيْرَ نَاكِبِ
  text: 'غير عادل عنهم؛ من «نكب عن الشيء وعن الطريق»: عدل [@lisan، ج1 ص770].'
