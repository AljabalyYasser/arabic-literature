first: يَا رَاكِبًا إِمَّا عَرَضْتَ فَبَلِّغَنْ
second: أَبَا غَالِبٍ أَنْ قَدْ ثَأَرْنَا بِغَالِبِ
vocabulary:
- term: عَرَضْتَ
  text: أتيت العَروض، «وهي مكة والمدينة وما حولهما، وقيل واليمن أيضا» [@ibn-qutayba، ج1 ص338، الحاشية].
- term: ثَأَرْنَا بِغَالِبِ
  text: أخذنا بثأره.
