first: وَإِنْ تُسْهِلُوا لِلْخَيْلِ تُسْهِلْ عَلَيْكُمُ
second: بِطَعْنٍ كَإِيزَاغِ الْمَخَاضِ الضَّوَارِبِ
vocabulary:
- term: تُسْهِلُوا
  text: تنزلوا السهل؛ «أسهل يسهل إذا صار إلى السهل من الأرض، وهو ضد الحزن» [@lisan، ج11 ص349].
- term: إِيزَاغِ الْمَخَاضِ
  text: 'قال أبو عبيد: «كإيزاغ المخاض يعني قذفها بأبوالها، وذلك إذا كانت حوامل، شبّه خروج الدم برمي المخاض أبوالها» [@lisan، ج4 ص87].'
- term: الضَّوَارِبِ
  text: «ضربت المخاض إذا شالت بأذنابها، ثم ضربت بها فروجها ومشت، فهي ضوارب» [@lisan، ج1 ص545].
