explained: false
first: وَثَعْلَبَةَ الْخُنْثَى تَرَكْنَا شَرِيدَهُمْ
second: تَعِلَّةَ لَاهٍ فِي الْبِلَادِ وَلَاعِبِ
vocabulary:
- term: ثَعْلَبَةَ الْخُنْثَى
  text: 'بنو ثعلبة بن سعد بن ذبيان [@khizana، ج7 ص30]، نعتهم بالخنثى تحقيرًا؛ و«الخنثى: الذي لا يخلص لذكر ولا أنثى» [@lisan، ج2 ص145].'
- term: شَرِيدَهُمْ
  text: من فرّ منهم مطرودًا.
- term: تَعِلَّةَ لَاهٍ
  text: ما يتلهّى به اللاهي؛ «وتعلّل به أي تلهّى به» [@lisan، ج11 ص469].
