first: "أَمَاوِيَّ قَدْ طَالَ التَّجَنُّبُ وَالْهَجْرُ"
second: "وَقَدْ عَذَرَتْنِي فِي طِلَابِكُمُ الْعُذْرُ"
meaning: "يا ماويّة، لقد طال إعراضك عني وهجرك، وقد بلغتُ في طلبك ما يُعذر به الطالب، فلا لوم عليّ."
vocabulary:
  - term: "أَمَاوِيَّ"
    text: "يا ماويّة، و«ماويّ منادى مرخّم ماويّة وهي زوجة حاتم» [@khizana، ج4 ص211]. والترخيم: حذف آخر الاسم في النداء."
  - term: "التَّجَنُّبُ"
    text: "الابتعاد والإعراض."
  - term: "عَذَرَتْنِي"
    text: "رفعت عني اللوم، يقال: «عذرته فيما صنع ...: رفعت عنه اللوم فهو معذور أي: غير ملوم» [@khizana، ج4 ص213]."
  - term: "الْعُذْرُ"
    text: "جمع «عَذِير»، وعَذِير الرجل: «مَا يَرُومُ وَمَا يُحاوِلُ مِمَّا يُعْذَرُ عَلَيْهِ إِذا فَعَلَه»، «وَجَمْعُهُ عُذُرٌ مِثْلُ سَرِيرٍ وسُرُرٍ، وإِنما خُفِّفَ فَقِيلَ عُذْر»، ثم أنشد البيت [@lisan، ج4 ص548]. فالمعنى: ما حاولته في طلبك أقام عذري."
context: "مطلع القصيدة. أنشدها حاتم، في رواية أبي الفَرَج، بعد أن أنشد النَّبِيتيّ والنابِغة، حين قالت ماويّة: «يا أخا طيّئ أنشدنى» [@aghani-dk، ج17 ص384]. يبدأ بالعتاب لا بالفخر، ثم ينتقل في البيت التالي إلى المال، وهو موضوع القصيدة كلها."
syntax:
  - "«أماويَّ» الهمزة حرف نداء، و«ماويَّ» منادى مرخّم، حُذفت تاؤه وبقيت الياء على فتحتها، على لغة من ينتظر المحذوف، أي ينطق الاسم كأن آخره باقٍ."
  - "«قد» حرف تحقيق، و«طال» فعل ماض، و«التجنبُ» فاعل، و«الهجرُ» معطوف عليه."
  - "«وقد عذرتْني» الواو عاطفة، و«قد» حرف تحقيق، و«عذرت» فعل ماض والتاء للتأنيث، والنون للوقاية، والياء مفعول به. و«في طلابكم» جار ومجرور متعلق بـ«عذرت»، و«كم» مضاف إليه. و«العُذْرُ» فاعل مؤخر، وأُنّث له الفعل لأنه جمع تكسير."
morphology:
  - "«التجنُّب» مصدر «تجنّب» على «تفعُّل»، وفيه معنى التكلّف: يتعمّد الابتعاد."
  - "«طِلاب» مصدر «طالَب» على «فِعال»، بمعنى الطلب."
  - "«العُذْر» جمع «عَذِير» على «فُعُل»، خُفّف بتسكين عينه فصار «فُعْل» [@lisan، ج4 ص548]."
rhetoric:
  thesis: "يفتتح الرجل الكريم دفاعه بالعتاب: لم يقصّر في طلب ماويّة، فإن طال هجرها فالذنب ليس ذنبه."
  devices:
    - title: "النداء المرخّم في «أماويَّ»"
      text: "في «أماويّ» نادى المرأة باسمها محذوف الآخر، والترخيم يكون في نداء القريب المألوف. ثم كرّر هذا النداء في رأس سبعة أبيات من القصيدة، فصار لازمة تشدّ أقسامها، وصار الكلام كله جدالًا موجّهًا إلى امرأة واحدة. وهذه قراءتنا."
    - title: "الإسناد المجازي في «عذرتني العُذْرُ»"
      text: "في «عذرتني ... العُذْرُ» جعل محاولاته هي التي تعذره، والعاذر في الحقيقة هو الناس أو هي. وهذا ما يسمّيه عبد القاهر الجُرْجانيّ مجازًا في الإسناد، وهو «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]: الكلمة على معناها، والمجاز في نسبة الفعل إليها. ويجانس بين «عذرتني» و«العذر» من أصل واحد."
    - title: "التصريع"
      text: "ختم الصدر بـ«الهجرُ» على قافية العجز «العذرُ». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]، فجاءت العروض هنا تامة «مفاعيلن» كالضرب."
  connection: "ثم يقول لها ما تعرفه العرب عن المال: يغدو ويروح، ولا يبقى منه إلا ذكر صاحبه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها حرف ساكن"
  scansion: "أَمَاوِيْ / يَ قَدْ طَالَتْ / تَجَنْنُ / بُ وَلْهَجْرُو = فعولن / مفاعيلن / فعولُ / مفاعيلن — وَقَدْ عَ / ذَرَتْنِي فِي / طِلَابِ / كُمُلْ عُذْرُو = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "الضرب صحيح «مفاعيلن» [@atiq، ص30]. وعروض الطويل «تأتي مقبوضة دائمًا» [@atiq، ص29]، لكنها هنا «مفاعيلن» تامة لأن البيت مصرّع. ودخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر، والأولى والثالثة في العجز، فصارت «فعولُ». وتُمدّ ضمة الراء في آخر الشطرين فتُنطق «رُو»."
variants:
