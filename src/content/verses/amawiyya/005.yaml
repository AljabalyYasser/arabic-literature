first: "أَمَاوِيَّ مَا يُغْنِي الثَّرَاءُ عَنِ الْفَتَى"
second: "إِذَا حَشْرَجَتْ يَوْمًا وَضَاقَ بِهَا الصَّدْرُ"
meaning: "يا ماويّة، لا ينفع المالُ الكثير صاحبَه يوم تتردّد نفسه في صدره عند الموت ويضيق بها صدره."
vocabulary:
  - term: "يُغْنِي ... عَنِ الْفَتَى"
    text: "ينفعه ويدفع عنه."
  - term: "الثَّرَاءُ"
    text: "«الثراء: الكثرة في المال، وفي عدد القوم أيضا» [@aghani-dk، ج17 ص362]."
  - term: "حَشْرَجَتْ"
    text: "من الحشرجة، و«الحشرجة ...: الغرغرة عند الموت وتردّد النفس» [@khizana، ج4 ص213]. والفاعل النفس، لم يذكرها."
context: "يبدأ به المقطع الثاني من القصيدة: بعد أن قال إن المال يذهب ويبقى ذكره (2)، يأتي بالحجة الأقوى، وهي الموت. وبعده يصف الدفن (6–7) ثم الصدى في القفر (8). وهو من الأبيات السبعة التي يرويها ابن قُتَيْبة [@ibn-qutayba، ج1 ص240]."
syntax:
  - "«ما» نافية، و«يغني» فعل مضارع مرفوع بضمة مقدرة على الياء، و«الثراءُ» فاعل، و«عن الفتى» جار ومجرور متعلق بـ«يغني»."
  - "«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط، و«حشرجت» فعل ماض والتاء للتأنيث، وفاعله ضمير مستتر يعود على النفس المفهومة من السياق، والجملة في محل جر بإضافة «إذا» إليها. وجواب الشرط محذوف دلّ عليه ما قبله، أي: إذا حشرجت فما يغني الثراء عنه."
  - "«يومًا» ظرف زمان منصوب متعلق بـ«حشرجت». «وضاق» الواو عاطفة، و«ضاق» فعل ماض، و«بها» جار ومجرور متعلق به، والضمير للنفس، و«الصدرُ» فاعل."
morphology:
  - "«حشرج» فعل رباعي مجرد على «فَعْلَل»، يحكي صوت النفس المتردد في الحلق."
  - "«الثراء» مصدر «ثَرِيَ» أو «أثرى»، ممدود، وهمزته منقلبة عن واو أو ياء."
rhetoric:
  thesis: "يصل بماويّة إلى اللحظة التي يتساوى فيها البخيل والكريم، ليقول إن المال الذي تخاف عليه لن يصحب صاحبه."
  devices:
    - title: "الحذف في «حشرجت» و«بها»"
      text: "في «حشرجت» و«ضاق بها» لم يذكر النفس، وجعل الفعل والضمير يدلّان عليها. ويقول البَغْداديّ إن صاحب «الكشّاف» أورد البيت عند قوله تعالى «كلا إذا بلغت التراقي» «على إضمار النفس قبل الذكر لدلالة الكلام عليه كما أضمرها الشاعر في حشرجت» [@khizana، ج4 ص213]. وفي هذا الحذف يقول عبد القاهر: «فإنك ترى به ترك الذكر أفصح من الذكر» [@dalail، ص146]: الموقف معروف، فتسمية النفس تُضعفه."
    - title: "الكناية في «ضاق بها الصدر»"
      text: "في «ضاق بها الصدر» لم يقل «مات»، بل ذكر ما يسبق الموت، وهو ضيق النفس في الصدر. وهي الكناية عند عبد القاهر: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "النفي في «ما يغني»"
      text: "بنى البيت على النفي «ما يغني الثراء»، ولم يقل إن الثراء لا ينفع إلا في الحياة، فترك السامع يتمّ المعنى: ما دام لا ينفع عند الموت فليُنفَق قبله. وهذه قراءتنا."
  connection: "ثم يصوّر ما بعد الحشرجة: أحبابه يدلّونه في قبره ويرجعون مسرعين."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها حرف ساكن"
  scansion: "أَمَاوِيْ / يَ مَا يُغْنِثْ / ثَرَاءُ / عَنِلْفَتَى = فعولن / مفاعيلن / فعولُ / مفاعلن — إِذَا حَشْ / رَجَتْ يَوْمَنْ / وَضَاقَ / بِهَصْصَدْرُو = فعولن / مفاعيلن / فعولُ / مفاعيلن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب صحيح «مفاعيلن» [@atiq، ص30]. ودخل القبض «فعولن» الثالثة في الشطرين فصارت «فعولُ»."
