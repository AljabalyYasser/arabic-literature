first: "تَرَيْ أَنَّ مَا أَنْفَقْتُ لَمْ يَكُ ضَرَّنِي"
second: "وَأَنَّ يَدِي مِمَّا بَخِلْتُ بِهِ صِفْرُ"
vocabulary:
  - term: "تَرَيْ"
    text: "جواب الشرط في البيت قبله، مجزوم بحذف النون، والخطاب لماويّة: إن صرتُ صدى في القفر رأيتِ."
  - term: "صِفْرُ"
    text: "خالية، و«الصِّفْر: الخالي» [@aghani-dk، ج17 ص362]."
