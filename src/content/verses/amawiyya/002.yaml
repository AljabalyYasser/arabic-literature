first: "أَمَاوِيَّ إِنَّ الْمَالَ غَادٍ وَرَائِحٌ"
second: "وَيَبْقَى مِنَ الْمَالِ الْأَحَادِيثُ وَالذِّكْرُ"
meaning: "يا ماويّة، المال لا يقيم عند أحد: يأتي صاحبه ويذهب عنه كما يغدو الراحل ويروح، ولا يبقى منه بعد أن يذهب إلا ما يتحدث به الناس عن صاحبه وما يذكرونه به."
vocabulary:
  - term: "غَادٍ"
    text: "ذاهب في الغداة، وهي أول النهار."
  - term: "رَائِحٌ"
    text: "راجع في الرواح، وهو آخر النهار. والغادي والرائح معًا: الذي لا يستقرّ."
  - term: "الْأَحَادِيثُ"
    text: "ما يتحدث به الناس عن الرجل بعده."
  - term: "الذِّكْرُ"
    text: "الصيت وحسن الثناء."
context: "أشهر أبيات القصيدة، وأولها في «الصوت» الذي غنّاه إسحاق المَوْصِليّ [@aghani-dk، ج17 ص362]، وأول ما يرويه ابن قُتَيْبة منها [@ibn-qutayba، ج1 ص239]، ويستشهد به صاحب «اللسان» [@lisan، ج4 ص548]. فيه جواب حاتم كله عن لوم ماويّة: ما دام المال ذاهبًا لا محالة، فالرابح من صرفه فيما يبقى، وهو الذكر. وعلى هذا المعنى تقوم الأبيات بعده."
syntax:
  - "«إنّ» حرف توكيد ونصب، و«المالَ» اسمها، و«غادٍ» خبرها، مرفوع بضمة مقدرة على الياء المحذوفة، و«رائحٌ» معطوف عليه."
  - "«ويبقى» الواو عاطفة، و«يبقى» فعل مضارع، و«من المال» جار ومجرور متعلق به، و«الأحاديثُ» فاعل، و«الذكرُ» معطوف عليه. وقدّم الجار والمجرور على الفاعل."
morphology:
  - "«غادٍ» و«رائح» اسما فاعل من «غدا» و«راح». وأصل «غادٍ» «غادِوٌ»، قُلبت الواو ياء لانكسار ما قبلها، ثم حُذفت لالتقائها ساكنة بالتنوين."
  - "«الأحاديث» جمع «حديث» على غير قياس، كأنه جمع «أُحدوثة»."
rhetoric:
  thesis: "يجعل الحكمة العامة في المال حجةً للكريم: ما دام المال لا يبقى، فالبخل به خسارة مرتين."
  devices:
    - title: "الاستعارة في «غادٍ ورائح»"
      text: "في «غادٍ ورائح» جعل المال مسافرًا يخرج أول النهار ويرجع آخره، ولم يذكر المسافر، بل أعار المالَ صفته. وهي الاستعارة عند عبد القاهر: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. وفي الصورة أن المال لا يستقرّ عند أحد، يُصبح عند قوم ويُمسي عند آخرين."
    - title: "الطباق بين «غادٍ» و«رائح»"
      text: "جمع في الصدر بين الغدوّ والرواح، وهما وقتان متقابلان، فدلّ بهما على الحركة الدائمة. ثم قابلهما في العجز بـ«يبقى»، فصار البيت كله قائمًا على ما يذهب وما يبقى. وهذه قراءتنا."
    - title: "التقديم في «ويبقى من المال الأحاديثُ»"
      text: "في «ويبقى من المال الأحاديثُ والذكرُ» قدّم «من المال» على الفاعل، فبدأ بالمال الذي كان موضوع الصدر، وأخّر ما يبقى منه إلى آخر البيت، فصار «الذكر» آخر ما يسمعه السامع. وفي التقديم يقول عبد القاهر: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
  connection: "ثم يبيّن كيف يصير المال ذكرًا: لا يردّ سائلًا بحجة كاذبة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها حرف ساكن"
  scansion: "أَمَاوِيْ / يَ إِنْنَلْمَا / لَ غَادِنْ / وَرَائِحُنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَيَبْقَى / مِنَلْمَالِلْ / أَحَادِي / ثُ وَذْذِكْرُو = فعولن / مفاعيلن / فعولن / مفاعيلن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب صحيح «مفاعيلن» [@atiq، ص30]، ولا زحاف في الحشو."
