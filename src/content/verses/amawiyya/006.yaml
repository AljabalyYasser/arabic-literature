explained: false
first: "إِذَا أَنَا دَلَّانِي الَّذِينَ أُحِبُّهُمْ"
second: "بِمَلْحُودَةٍ زَلْجٍ جَوَانِبُهَا غُبْرُ"
vocabulary:
  - term: "دَلَّانِي"
    text: "أنزلوني، كما يُدلّى الدلو في البئر."
  - term: "بِمَلْحُودَةٍ"
    text: "في حفرة ذات لحد، و«اللَّحْد واللُّحْد: الشَّقُّ الَّذِي يَكُونُ فِي جَانِبِ الْقَبْرِ موضِع الْمَيِّتِ» [@lisan، ج3 ص388]."
  - term: "زَلْجٍ"
    text: "زلقة، و«الزلج، محركة: الزلق، ويسكن. والزلج: المزلة تزل فيها الأقدام لندوته أو ملاسته» [@aghani-dk، ج17 ص385]."
  - term: "غُبْرُ"
    text: "مغبرّة بالتراب."
