first: "أَمَاوِيَّ إِنِّي رُبَّ وَاحِدِ أُمِّهِ"
second: "أَخَذْتُ فَلَا قَتْلٌ عَلَيْهِ وَلَا أَسْرُ"
meaning: "يا ماويّة، كم من رجل لا أخ له، وحيدٍ عند أمه، وقع في يدي، فلم أقتله ولم أُبقه أسيرًا، بل خلّيت سبيله."
vocabulary:
  - term: "وَاحِدِ أُمِّهِ"
    text: "الابن الذي ليس لأمه ولد غيره، فقتله يُثكلها ولا يبقى لها أحد."
  - term: "أَخَذْتُ"
    text: "أسرت. وفي بعض النسخ والديوان «أَجَرْتُ» كما يقول محققو «الأغاني» [@aghani-dk، ج17 ص385]، و«أجرت ... بِمَعْنى أمّنته مِمَّا يخَاف» [@khizana، ج4 ص212]."
  - term: "فَلَا قَتْلٌ عَلَيْهِ وَلَا أَسْرُ"
    text: "فلم يُقتل ولم يبق في الأسر."
context: "يبدأ به المقطع الذي يقول فيه ما يصنع بماله وبقوته. وهو يروي فيه خُلُقًا يرويه الأخباريون عنه: يقول ابن قُتَيْبة: «وكان أقسم بالله لا يقتل واحد أمّه» [@ibn-qutayba، ج1 ص235]، ويقول أبو الفَرَج عن ابن الأعرابي: «وكان يقسم بالله ألّا يقتل واحد أمّه» [@aghani-dk، ج17 ص366]. والبيت شاهد عند النحاة، يحتجّ به هشام على أن «واحد أمّه» نكرة [@khizana، ج4 ص211]."
syntax:
  - "«إنّي» حرف توكيد ونصب، والياء اسمها، وخبرها جملة «أخذت» وما تعلق بها، وبينهما «ربّ واحد أمّه»."
  - "«ربّ» حرف جر شبيه بالزائد يفيد هنا التكثير، و«واحدِ» مجرور لفظًا بـ«ربّ»، في محل نصب مفعول به مقدم لـ«أخذت». قال البَغْداديّ: «وربّ هنا لإنشاء التكثير والعامل في محلّ مجرورها أجرت» [@khizana، ج4 ص211–212]. و«أمّه» مضاف إليه، والهاء مضاف إليه."
  - "«فلا قتلٌ عليه ولا أسرُ» الفاء عاطفة، و«لا» نافية مهملة لتكرارها، و«قتلٌ» مبتدأ، و«عليه» جار ومجرور متعلق بمحذوف خبر، و«ولا أسرُ» معطوف."
morphology:
  - "«واحد» اسم فاعل من «وَحَد»، وإضافته إلى «أمّه» لفظية لا تعرّفه، ولذلك دخلت عليه «ربّ» التي لا تدخل إلا على النكرة. يقول البَغْداديّ عن عبد القاهر: «وإذا جعل نكرة فعلى أنه يوصف به نكرة محذوفة كما في البيت كأنّه قال إنسانٌ واحد أمّه» [@khizana، ج4 ص211]."
  - "«أَسْر» مصدر «أسَر»، و«قَتْل» مصدر «قتَل»، كلاهما على «فَعْل»."
rhetoric:
  thesis: "يقرن حاتم الجود بالمال بالجود بالنفس: القوة التي تقدر على القتل تختار العفو، والعفو عن وحيد أمه أبلغ."
  devices:
    - title: "التكثير بـ«ربّ»"
      text: "في «ربّ واحد أمّه» لم يذكر عددًا، بل جاء بـ«ربّ» التي هي عند البَغْداديّ «لإنشاء التكثير» [@khizana، ج4 ص211–212]، فجعل العفو عادة متكررة لا حادثة واحدة."
    - title: "الكناية في «واحد أمّه»"
      text: "في «واحد أمّه» لم يقل «رجلًا لا أخ له»، بل ذكر أمه، فاستحضر صورة الأم التي ستثكل ولدها الوحيد. وهي الكناية عند عبد القاهر: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "التقديم في «ربّ واحد أمّه أخذت»"
      text: "قدّم المأسور «ربّ واحد أمّه» على الفعل «أخذت»، فبدأ بالضعيف الذي في يده قبل أن يذكر نفسه، وصار الفعل في آخر الشطر. وفي التقديم يقول عبد القاهر: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
  connection: "ثم يقول إن الناس يعرفون أنه لو أراد الثراء لكان له، فهو يترك المال عن قدرة لا عن عجز."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها حرف ساكن"
  scansion: "أَمَاوِيْ / يَ إِنْنِي رُبْ / بَ وَاحِ / دِ أُمْمِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — أَخَذْتُ / فَلَا قَتْلُنْ / عَلَيْهِ / وَلَا أَسْرُو = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب صحيح «مفاعيلن» [@atiq، ص30]. ودخل القبض «فعولن» الثالثة في الصدر، والأولى والثالثة في العجز. وتُشبع كسرة الهاء في «أمّهِ» فتُنطق «هِي»."
variants:
  - reading: "أَجَرْتُ فَلَا قَتْلٌ عَلَيْهِ وَلَا أَسْرُ"
    status: "رواية الديوان ونسخة من الأغاني"
    note: "كما يقول محققو «الأغاني» [@aghani-dk، ج17 ص385]، وهي رواية البيت حين يستشهد به البَغْداديّ، ثم يقول: «وروى بدله: أخذت» [@khizana، ج4 ص212]."
