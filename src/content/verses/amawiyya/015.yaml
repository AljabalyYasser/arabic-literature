explained: false
first: "غَنِينَا زَمَانًا بِالتَّصَعْلُكِ وَالْغِنَى"
second: "وَكُلًّا سَقَانَاهُ بِكَأْسَيْهِمَا الْعَصْرُ"
vocabulary:
  - term: "غَنِينَا"
    text: "عشنا، يقال: «غَنِي كفرح: عاش وغنى بالمكان: أقام به» [@khizana، ج4 ص214]."
  - term: "بِالتَّصَعْلُكِ"
    text: "بالفقر، و«الصُّعْلُوك: الْفَقِيرُ الَّذِي لَا مَالَ لَهُ» [@lisan، ج10 ص455]."
  - term: "الْعَصْرُ"
    text: "الدهر. وفي «الخزانة» «الدَّهْرُ» [@khizana، ج4 ص213]."
