first: "وَقَدْ عَلِمَ الْأَقْوَامُ لَوْ أَنَّ حَاتِمًا"
second: "أَرَادَ ثَرَاءَ الْمَالِ كَانَ لَهُ وَفْرُ"
vocabulary:
