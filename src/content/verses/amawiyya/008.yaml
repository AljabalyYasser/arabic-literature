first: "أَمَاوِيَّ إِنْ يُصْبِحْ صَدَايَ بِقَفْرَةٍ"
second: "مِنَ الْأَرْضِ لَا مَاءٌ لَدَيَّ وَلَا خَمْرُ"
meaning: "يا ماويّة، إذا صرتُ بعد موتي صدى في أرض خالية، لا ماء عندي ولا خمر، عرفتِ أن ما أنفقته لم يضرّني، وأن ما بخلت به لم يبق لي منه شيء."
vocabulary:
  - term: "صَدَايَ"
    text: "الصدى عند المُبَرِّد على وجوه، «أحدها ... ما يبقى من الميت في قبره، والصدى: الذكر من البوم» [@kamil، ج1 ص293]. ويقول أبو الفَرَج: «كان أهل الجاهلية يذكرون أن طائرا يخرج من جسم الإنسان أو من رأسه، فإذا قتل أقبل يصوّت على قبره، حتى يدرك بثأره» [@aghani-dk، ج17 ص362]."
  - term: "بِقَفْرَةٍ"
    text: "بأرض خالية لا أحد فيها."
  - term: "لَا مَاءٌ لَدَيَّ وَلَا خَمْرُ"
    text: "لا شراب عندي، فلا ينفعني ما بخلت به ولا ما ادّخرته."
context: "خاتمة مقطع الموت، ومعناه يتمّ بالبيت بعده: «تَرَيْ أَنَّ مَا أَنْفَقْتُ لَمْ يَكُ ضَرَّنِي». وهما معًا في «الصوت» الذي غنّاه إسحاق [@aghani-dk، ج17 ص362]، وهما اللذان أنشدهما المُبَرِّد وقال: «وهذا الشعر نظير قول حاتم الطائي» [@kamil، ج1 ص295]، بعد أن أنشد أبيات النَّمِر بن تَوْلَب «أعاذل إن يصبح صداي بقفرة» وقدّم لها بقوله: «ومما يستحسن في وصف الجود والحث على المبادرة به، وتعريف حد العاقبة فيه» [@kamil، ج1 ص292]."
syntax:
  - "«إنْ» حرف شرط جازم، و«يصبحْ» فعل الشرط مجزوم، وهو من أخوات «كان»، و«صدايَ» اسمها، مرفوع بضمة مقدرة على الألف، والياء مضاف إليه. و«بقفرة» جار ومجرور في محل نصب خبر «يصبح»."
  - "«من الأرض» جار ومجرور في محل جر نعت لـ«قفرة». و«لا» نافية مهملة لتكرارها، و«ماءٌ» مبتدأ، و«لديّ» ظرف متعلق بمحذوف خبر، و«ولا خمرُ» معطوف."
  - "وجواب الشرط في البيت بعده «تَرَيْ»، مجزوم بحذف النون، فالمعنى متصل بين البيتين، وهو ما يسمّيه النقاد التضمين."
morphology:
  - "«صدى» اسم مقصور، ألفه منقلبة عن ياء، أُضيف إلى ياء المتكلم فبقيت ألفه وفُتحت الياء: «صدايَ»."
  - "«قَفْرة» اسم على «فَعْلة» من القَفْر، وهو الخلاء."
rhetoric:
  thesis: "يضع ماويّة أمام قبره في الصحراء: هناك يظهر حساب المال الصحيح، فما أنفقه بقي له ذكرًا، وما بخل به ذهب إلى غيره."
  devices:
    - title: "الكناية في «إن يصبح صداي بقفرة»"
      text: "في «إن يصبح صداي بقفرة» لم يقل «إذا متّ»، بل ذكر الصدى الذي يبقى بعد الموت في قبر منقطع. وهي الكناية عند عبد القاهر: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. وفي اختيار الصدى إشارة إلى عطشه، فالصدى عند المُبَرِّد أيضًا «مصدر الصدي، وهو العطشان» [@kamil، ج1 ص294]."
    - title: "المقابلة بين «لا ماء» و«لا خمر»"
      text: "في «لا ماءٌ لديّ ولا خمرُ» جمع الحاجة والمتعة: لا ما يحيا به ولا ما يتلذذ به. فالميت لا يملك شيئًا، ومال البخيل ليس معه. وهذه قراءتنا."
    - title: "التضمين بين البيتين"
      text: "علّق جواب الشرط بالبيت التالي «ترَيْ أنّ ما أنفقت»، فلا يتمّ المعنى إلا به، وهو ما يسمّيه النقاد التضمين، أي أن يحتاج البيت إلى ما بعده. فوقف السامع عند صورة القبر الخالي، ثم جاءه الحكم في البيت الثاني. وهذه قراءتنا."
  connection: "ثم يأتي الجواب: ستعرفين أن الإنفاق لم يضرّني وأن البخل لم ينفعني."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها حرف ساكن"
  scansion: "أَمَاوِيْ / يَ إِنْ يُصْبِحْ / صَدَايَ / بِقَفْرَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — مِنَلْأَرْ / ضِ لَا مَاءُنْ / لَدَيْيَ / وَلَا خَمْرُو = فعولن / مفاعيلن / فعولُ / مفاعيلن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب صحيح «مفاعيلن» [@atiq، ص30]. ودخل القبض «فعولن» الثالثة في الشطرين فصارت «فعولُ»."
