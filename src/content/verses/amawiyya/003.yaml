first: "أَمَاوِيَّ إِنِّي لَا أَقُولُ لِسَائِلٍ"
second: "إِذَا جَاءَ يَوْمًا: حَلَّ فِي مَالِنَا النَّذْرُ"
vocabulary:
  - term: "حَلَّ فِي مَالِنَا النَّذْرُ"
    text: "أي جعلنا مالنا نذرًا فلا نعطي منه، يتعلّل به البخيل. وفي الديوان «النَّزْرُ» كما يقول محققو «الأغاني» [@aghani-dk، ج17 ص385]، وهي رواية «الخزانة»: «حلّ في مالنا النزر أي: القلّة» [@khizana، ج4 ص213]."
