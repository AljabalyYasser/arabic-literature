first: "بِعَيْنَيَّ عَنْ جَارَاتِ قَوْمِيَ غَفْلَةٌ"
second: "وَفِي السَّمْعِ مِنِّي عَنْ حَدِيثِهِمُ وَقْرُ"
meaning: "في عينيّ غفلة عن نساء جيراني من قومي، فلا أتتبّعهن بنظري، وفي أذني ثقلٌ عن حديثهن، فلا أتسمّع إليه."
vocabulary:
  - term: "جَارَاتِ قَوْمِي"
    text: "نساء الجيران من قومه."
  - term: "غَفْلَةٌ"
    text: "سهو وانصراف، يريد أنه لا يلتفت إليهن."
  - term: "وَقْرُ"
    text: "ثِقَل في الأذن يمنع السمع."
context: "آخر بيت في القصيدة، وهو والبيت قبله في عفّة حاتم عن نساء جيرانه: لا يضرّ جاره ألّا يكون بين بيتيهما ستر (17)، لأن عينه وأذنه مصروفتان عن حرمته. فتنتهي القصيدة التي بدأت بالمال بخلق آخر من أخلاق الكرم، هو حفظ الجار. ويقول محققو «الأغاني» في البيت 17: «البيت ليس في ديوانه، وكذا ما بعده» [@aghani-dk، ج17 ص386]، ويرويهما البَغْداديّ في آخر القصيدة [@khizana، ج4 ص213]."
syntax:
  - "«بعينيّ» جار ومجرور متعلق بمحذوف خبر مقدم، و«عينيّ» مثنى مجرور بالياء، أُضيف إلى ياء المتكلم فأُدغمت الياءان. و«عن جارات» جار ومجرور متعلق بـ«غفلة»، و«قومي» مضاف إليه، و«غفلةٌ» مبتدأ مؤخر."
  - "«وفي السمع» الواو عاطفة، و«في السمع» جار ومجرور متعلق بمحذوف خبر مقدم، و«مني» جار ومجرور متعلق بمحذوف حال، و«عن حديثهم» متعلق بـ«وقر»، و«وقرُ» مبتدأ مؤخر."
morphology:
  - "«جارات» جمع «جارة» جمع مؤنث سالمًا، و«غَفْلة» اسم مرة من «غفَل»."
  - "«وَقْر» مصدر «وُقِرَت الأذن» على «فَعْل»، وهو الثقل."
rhetoric:
  thesis: "يجعل العفّة جزءًا من الجود: الكريم يعطي جاره الأمان على حرمته كما يعطيه المال."
  devices:
    - title: "التقديم في «بعينيّ ... غفلة» و«في السمع ... وقر»"
      text: "قدّم الخبر «بعينيّ» و«في السمع» على المبتدأ، فبدأ كل شطر بالجارحة التي يُخشى منها على الجار، ثم ذكر ما فيها من غفلة أو ثقل. وفي التقديم يقول عبد القاهر: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "الاستعارة في «غفلة» و«وقر»"
      text: "في «بعينيّ غفلة» و«في السمع وقر» جعل امتناعه عن النظر والاستماع كأنه عجز في العين والأذن، وهو في الحقيقة امتناع باختياره. فأعار الخُلق اسم العاهة، وهي الاستعارة عند عبد القاهر: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "المقابلة بين الشطرين"
      text: "قابل العين بالسمع، و«جارات قومي» بـ«حديثهم»، و«غفلة» بـ«وقر»، فجاء الشطران على ترتيب واحد. وهذه قراءتنا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها حرف ساكن"
  scansion: "بِعَيْنَيْ / يَ عَنْ جَارَا / تِ قَوْمِي / يَ غَفْلَتُنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَفِسْسَمْ / عِ مِنْنِي عَنْ / حَدِيثِ / هِمُو وَقْرُو = فعولن / مفاعيلن / فعولُ / مفاعيلن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب صحيح «مفاعيلن» [@atiq، ص30]. ودخل القبض «فعولن» الثالثة في العجز. وتُشبع ضمة الميم في «حديثهمُ» فتُنطق «مُو»، وتُفتح ياء «قوميَ» ليستقيم الوزن."
