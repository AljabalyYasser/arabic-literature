explained: false
first: "فَمَا زَادَنَا بَغْيًا عَلَى ذِي قَرَابَةٍ"
second: "غِنَانَا وَلَا أَزْرَى بِأَحْسَابِنَا الْفَقْرُ"
vocabulary:
  - term: "بَغْيًا"
    text: "تعدّيًا وتكبّرًا. وفي «الخزانة» «بَأْوًا»، و«البأو ... الكبر والفخر» [@khizana، ج4 ص214]."
  - term: "أَزْرَى بِأَحْسَابِنَا"
    text: "حطّ منها، و«أَزْرَى بِهِ، بالأَلف، إِزْرَاءً: قَصَّرَ بِهِ وحَقَّرَه وهَوَّنه» [@lisan، ج14 ص356]."
