first: "أَمَاوِيَّ إِمَّا مَانِعٌ فَمُبَيِّنٌ"
second: "وَإِمَّا عَطَاءٌ لَا يُنَهْنِهُهُ الزَّجْرُ"
vocabulary:
  - term: "فَمُبَيِّنٌ"
    text: "يصرّح بالمنع ولا يتعلّل."
  - term: "يُنَهْنِهُهُ"
    text: "يكفّه، «ونهنهه: كفّه ومنعه» [@khizana، ج4 ص213]."
  - term: "الزَّجْرُ"
    text: "اللوم والنهي."
