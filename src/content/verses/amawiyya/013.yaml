explained: false
first: "يُفَكُّ بِهِ الْعَانِي وَيُؤْكَلُ طَيِّبًا"
second: "وَمَا إِنْ تُعَرِّيهِ الْقِدَاحُ وَلَا الْخَمْرُ"
vocabulary:
  - term: "الْعَانِي"
    text: "«الأسير» [@khizana، ج4 ص214]."
  - term: "تُعَرِّيهِ"
    text: "تجرّده وتفنيه، و«يعرّيه أي: يفنيه» [@khizana، ج4 ص214]."
  - term: "الْقِدَاحُ"
    text: "«قداح الميسر» [@khizana، ج4 ص214]، وهي السهام التي يقامرون بها على الجزور. وفي رواية «ولا القَمْرُ»، أي المقامرة [@khizana، ج4 ص214]."
