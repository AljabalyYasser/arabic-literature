first: "بِكُلِّ قَرَارَةٍ مِنْ حَيْثُ جَالَتْ"
second: "رَكِيَّةُ سُنْبُكٍ فِيهَا انْثِلَامُ"
vocabulary:
  - term: "قَرَارَةٍ"
    text: "ما اطمأن من الأرض [@tabrizi-ikhtiyarat، ج3 ص1408]."
  - term: "رَكِيَّةُ سُنْبُكٍ"
    text: "يعني حيث أثّرت الخيل في الأرض بسنابكها [@tabrizi-ikhtiyarat، ج3 ص1408]، والرَّكِيّة: البئر، والسُّنْبُك: طرف الحافر."
