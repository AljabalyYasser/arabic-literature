first: "ذَعَرْتُ ظِبَاءَهَا مُتَغَوِّرَاتٍ"
second: "إِذَا ادَّرَعَتْ لَوَامِعَهَا الإِكَامُ"
vocabulary:
  - term: "مُتَغَوِّرَاتٍ"
    text: "في نصف النهار، يقال: غوّروا، إذا قالوا نصف النهار [@tabrizi-ikhtiyarat، ج3 ص1398]."
  - term: "لَوَامِعَهَا"
    text: "اللوامع: ما يلمع من السراب [@tabrizi-ikhtiyarat، ج3 ص1398]."
  - term: "الإِكَامُ"
    text: "الجبال الصغار [@tabrizi-ikhtiyarat، ج3 ص1398]."
