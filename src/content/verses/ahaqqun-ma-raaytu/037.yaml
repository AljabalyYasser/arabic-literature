first: "أَثَافِيَ مِنْ خُزَيْمَةَ رَاسِيَاتٍ"
second: "لَنَا حِلُّ المَنَاقِبِ وَالحَرَامُ"
vocabulary:
  - term: "أَثَافِيَ"
    text: "يقول: نحن ثلاث قبائل كالأثافي، يعني قريشًا وأسدًا وكنانة، فالعزّ يستوي بنا استواء القدر على الأثافي [@tabrizi-ikhtiyarat، ج3 ص1412]."
  - term: "المَنَاقِبِ"
    text: "الطرق في الجبال، يريد: لنا الحِلّ والحرم [@tabrizi-ikhtiyarat، ج3 ص1412–1413]."
