explained: false
first: "بِذِعْلِبَةٍ بَرَاهَا النَّصُّ حَتَّى"
second: "بَلَغْتُ نُضَارَهَا وَفَنَى السَّنَامُ"
vocabulary:
  - term: "بِذِعْلِبَةٍ"
    text: "الذِّعلبة: الناقة السريعة [@tabrizi-ikhtiyarat، ج3 ص1398]."
  - term: "النَّصُّ"
    text: "شدة السير [@tabrizi-ikhtiyarat، ج3 ص1398]."
  - term: "نُضَارَهَا"
    text: "النُّضار: الخالص، أي سرت عليها حتى ذهب لحمها وقوتها إلى أن صارت تمشي بكرمها [@tabrizi-ikhtiyarat، ج3 ص1398–1399]."
  - term: "فَنَى"
    text: "بمعنى فَنِيَ، لغة طائية [@tabrizi-ikhtiyarat، ج3 ص1399]."
