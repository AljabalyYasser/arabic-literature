explained: false
first: "وَصَاحِبُهَا غَضِيضُ الطَّرْفِ أَحْوَى"
second: "يَضُوعُ فُؤَادَهَا مِنْهُ بُغَامُ"
vocabulary:
  - term: "غَضِيضُ الطَّرْفِ أَحْوَى"
    text: "غزال مغضوض العين لصغره، في لونه حُوّة، وهي إلى السواد [@tabrizi-ikhtiyarat، ج3 ص1397]."
  - term: "يَضُوعُ"
    text: "يُفزع ويحرّك، أي كلما صاح تحرّكت أمه وقلقت إشفاقًا عليه [@tabrizi-ikhtiyarat، ج3 ص1397]."
  - term: "بُغَامُ"
    text: "صوت الظبي."
