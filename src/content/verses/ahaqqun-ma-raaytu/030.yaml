first: "إِذَا خَرَجَتْ أَوَائِلُهُنَّ شُعْثًا"
second: "مُجَلِّحَةً نَوَاصِيهَا قِيَامُ"
vocabulary:
  - term: "مُجَلِّحَةً"
    text: "يقال: جلّح إذا حمل على العدو، والتجليح: التصميم في الأمر والذهاب فيه [@tabrizi-ikhtiyarat، ج3 ص1408]."
  - term: "شُعْثًا"
    text: "من الشَّعَث، وهو تنفّش الشعر، يريد أنهم لاشتغالهم لا يتفرغون لتفقّد الخيل [@tabrizi-ikhtiyarat، ج3 ص1408–1409]."
