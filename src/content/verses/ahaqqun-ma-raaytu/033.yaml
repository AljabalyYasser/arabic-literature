first: "أَلَمْ تَرَ أَنَّ طُولَ الدَّهْرِ يُسْلِي"
second: "وَيُنْسِي مِثْلَ مَا نُسِيَتْ جُذَامُ"
meaning: "اعلم أن طول الزمان يُسلي المرء عمن فارقه ويُنسيه إياه، كما نُسيت جذام بعد أن فارقتنا."
vocabulary:
  - term: "أَلَمْ تَرَ"
    text: "معناه: اعلم، وليس سؤالًا عن رؤية العين، ويستشهد التِّبْرِيزِيّ بقوله تعالى ﴿ألم تر كيف فعل ربك﴾، والنبي لم يدرك من ذلك شيئًا [@tabrizi-ikhtiyarat، ج3 ص1410–1411]."
  - term: "يُسْلِي"
    text: "يذهب بالحزن والشوق، من السلوّ."
  - term: "جُذَامُ"
    text: "قبيلة، كان بنو أسد يعدّونها منهم ثم فارقتهم إلى الشام. «وقال أبو عبيدة: جُذام أكبر من أسد بن خزيمة وأقدم، وادّعاء بني أسد إياهم باطل. وقال الأخفش: جُذام: ابن أسد» [@tabrizi-ikhtiyarat، ج3 ص1411]."
context: "بعد وصف الغارة يلتفت بِشْر إلى قوم فارقوا بني أسد. ويقول المَرْزُوقِيّ، فيما ينقله التِّبْرِيزِيّ، إن الكلام تقريع لمن انتقل عنهم، وإظهار للغنى عنهم، وإن سبيلهم سبيل جذام في مفارقتها [@tabrizi-ikhtiyarat، ج3 ص1411]. وهذا البيت والذي بعده بيتا الإقواء المشهوران: آخر هذا «جذامُ» مرفوع، وآخر الذي بعده «الشآمِي» مجرور."
syntax:
  - "الهمزة في «ألم» للاستفهام التقريري، و«لم» حرف جزم، و«ترَ» مضارع مجزوم بحذف الألف."
  - "«أنّ طولَ الدهر يسلي» «أنّ» واسمها «طولَ» وخبرها جملة «يسلي»، والمصدر المؤول سدّ مسدّ مفعولي «ترى»."
  - "«وينسي» معطوف على «يسلي»، و«مثلَ» نعت لمصدر محذوف، أي يُنسي إنساءً مثل ما نُسيت جذام، و«ما» مصدرية."
  - "«نُسيت» فعل ماض مبني للمجهول، و«جذامُ» نائب فاعل مرفوع، وهو ممنوع من الصرف للعلمية والتأنيث، فرفعه بالضمة بلا تنوين."
morphology:
  - "«يُسلي» مضارع «أسلى» على «أفعل»، من سلا يسلو، والهمزة للتعدية."
  - "«يُنسي» مضارع «أنسى» على «أفعل»، من نسي، والهمزة للتعدية."
  - "«جُذام» علَم على قبيلة، على «فُعال»، وأصله من الجَذْم، وهو القطع."
rhetoric:
  thesis: "حكمة عامة يبني عليها هجاء خاصًّا: الدهر يُنسي، وجذام شاهد على ذلك، والذين فارقوا بني أسد سيُنسون مثلها."
  devices:
    - title: "التمثيل بالتاريخ"
      text: "لم يقل إن المفارقين سيُنسون، بل ضرب لهم مثلًا بجذام التي نُسيت. فالحكمة تأتي ومعها شاهدها من أخبار القبيلة."
    - title: "الاستفهام التقريري"
      text: "«ألم تر» يجعل السامع شريكًا في الحكم، كأنه يعرفه من قبل، فلا يحتاج الشاعر إلى برهان."
    - title: "الإقواء"
      text: "روى أبو عَمْرو بن العَلاء: «فحلان من الشعراء كانا يقويان، النابغة وبشر بن أبى خازم»، وأن أخاه سوادة قال له: «إنّك تقوى»، فسأله: «وما الإقواء؟»، فأنشده هذا البيت والذي بعده، «فلم يعد للإقواء» [@ibn-qutayba، ج1 ص262]. والإقواء اختلاف حركة الرويّ بين الرفع والجر. وانظر مفهوم [القافية](/concepts/al-qafiya/)، وخبر النابِغة في [إقواء النابغة في يثرب](/stories/iqwa-yathrib/)."
  connection: "ثم يقول: «وكانوا قومنا فبغوا علينا، فسقناهم إلى البلد الشآمي»، وفيه الجر الذي خالف به الرفع هنا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المضمومة، مردوفة بالألف"
  scansion: "أَلَمْ تَرَ أَنْ / نَطُولَدْدَهْ / رِيُسْلِي = مفاعلتن / مفاعلْتن / فعولن — وَيُنْسِي مِثْ / لَمَا نُسِيَتْ / جُذَامُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن»، والعصب «تسكين الحرف الخامس» [@atiq، ص54] في التفعيلة الثانية من الصدر والأولى من العجز. والرويّ هنا ميم مضمومة، كسائر القصيدة."
