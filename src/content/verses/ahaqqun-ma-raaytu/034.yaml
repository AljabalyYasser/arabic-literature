first: "وَكَانُوا قَوْمَنَا فَبَغَوْا عَلَيْنَا"
second: "فَسُقْنَاهُمْ إِلَى البَلَدِ الشَّآمِي"
meaning: "كانوا من قومنا، فظلمونا وتعدّوا علينا، فطردناهم حتى ألجأناهم إلى بلاد الشام."
vocabulary:
  - term: "بَغَوْا"
    text: "ظلموا وتعدّوا، والبغي: الظلم ومجاوزة الحد."
  - term: "فَسُقْنَاهُمْ"
    text: "طردناهم أمامنا كما تُساق الإبل."
  - term: "البَلَدِ الشَّآمِي"
    text: "الشام، والشآمي: المنسوب إلى الشام، وفيه لغة بالمدّ «شآم»."
context: "يتمّ ما بدأه في البيت السابق عن جذام: كانت من قوم بني أسد، فلما بغت ساقوها إلى الشام. وهذا هو البيت الذي أقوى فيه بِشْر. في رواية الأَصْمَعِيّ التي ينقلها التِّبْرِيزِيّ عن ابن الأَنْبارِيّ: «قال الأصمعي: لما قال بشر هذا البيت قال له سوادة ابن أخيه: قد أقويت. فلم يعد» [@tabrizi-ikhtiyarat، ج3 ص1411]. وفي رواية ابن قُتَيْبة أن سوادة أخوه [@ibn-qutayba، ج1 ص262]، وفي رواية أبي عُبَيْدة عند المَرْزُبانيّ أن أخاه «سمير» هو الذي قال له: «أكفأت وأسأت» [@muwashshah، ص67]."
syntax:
  - "«كانوا» فعل ماض ناقص، والواو اسمها، و«قومَنا» خبرها منصوب."
  - "الفاء في «فبغوا» للترتيب والتعقيب، و«علينا» متعلق بـ«بغوا»."
  - "الفاء في «فسقناهم» للسببية: البغي سبب السَّوق، و«هم» مفعول به، و«إلى البلد» متعلق بـ«سقنا»."
  - "«الشآمي» نعت لـ«البلد» مجرور، وهنا موضع الإقواء: القصيدة رويّها ميم مضمومة «جذامُ، نيامُ»، وهذه ميم مكسورة."
morphology:
  - "«بغَوا» ماض من «بغى يبغي» ناقص يائي، اتصلت به واو الجماعة فحُذفت لامه وبقيت الفتحة قبل الواو."
  - "«سُقنا» ماض من «ساق يسوق» أجوف واوي، اتصل به ضمير رفع متحرك فحُذفت عينه وضُمّت فاؤه دلالة على الواو."
  - "«الشآمي» اسم منسوب إلى الشام بياء النسب، وفيه لغات: شاميّ، وشآمٍ بحذف ياء النسب وتعويض الألف."
rhetoric:
  thesis: "فخر بالقوة على الأقارب: البغي من القريب لا يُحتمل، وجزاؤه الطرد إلى أبعد البلاد."
  devices:
    - title: "الترتيب بالفاء"
      text: "ثلاث جمل تربطها الفاء: كانوا قومنا، فبغوا، فسقناهم. القصة كلها في بيت واحد، والفاء تجعل كل خطوة نتيجة لما قبلها."
    - title: "الاستعارة في «سقناهم»"
      text: "السَّوق للإبل والماشية، فجعل القوم المطرودين كالإبل تُساق، وفي ذلك احتقار لهم."
    - title: "الإقواء"
      text: "الإقواء: أن يختلف إعراب الرويّ في القصيدة، كأن يكون مرفوعًا في بيت ومجرورًا في آخر. وبِشْر عند أبي عَمْرو بن العَلاء ثاني فحلين كانا يقويان، والأول النابِغة [@ibn-qutayba، ج1 ص262]. وفي رواية المَرْزُبانيّ أن بِشْرًا لما نُبّه قال: «قد تبّينت خطى، ولست بعائد» [@muwashshah، ص67]. ويدل الخبر، فيما نرى، على أن الشاعر لم يكن يسمع الإقواء عيبًا حتى يُنبَّه عليه. وانظر [إقواء النابغة في يثرب](/stories/iqwa-yathrib/)."
  connection: "ثم يفخر بموقع بني أسد: «وكنا دونهم حصنًا حصينًا، لنا الرأس المقدّم والسنام»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ هنا ميم مكسورة «الشآمي»، والقصيدة رويّها ميم مضمومة، فهذا هو الإقواء"
  scansion: "وَكَانُوا قَوْ / مَنَا فَبَغَوْ / عَلَيْنَا = مفاعلْتن / مفاعلتن / فعولن — فَسُقْنَاهُمْ / إِلَلْ بَلَدِشْ / شَآمِي = مفاعلْتن / مفاعلتن / فعولن"
  note: "الوزن مستقيم على الوافر «مفاعلتن مفاعلتن فعولن»، والعصب «تسكين الحرف الخامس» [@atiq، ص54] في أول الشطرين. والعيب في القافية لا في الوزن: الضمة الممدودة في «جذامُو» و«نيامُو» صارت هنا كسرة ممدودة «شآمِي». ويقول المَرْزُبانيّ: «وآخر الأول منهما: «نسيت جذام» ، فرفع؛ ثم قال: «إلى البلد الشآمى» فخفض» [@muwashshah، ص68]."
variants:
