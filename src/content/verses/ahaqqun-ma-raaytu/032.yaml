first: "يُبَارِينَ الأَسِنَّةَ مُصْغِيَاتٍ"
second: "كَمَا يَتَفَارَطُ الثَّمَدَ الحَمَامُ"
meaning: "تسابق خيلُنا أسنّةَ الرماح، مائلةً رؤوسها من شدة العدو، كما يتسابق الحمام إلى الماء القليل، كل واحدة تريد أن تسبق إليه."
vocabulary:
  - term: "يُبَارِينَ"
    text: "يعارضن ويسابقن، أي تباري الخيل الأسنة بخدودها، ويقال: تعارض ظل الرماح [@tabrizi-ikhtiyarat، ج3 ص1410]."
  - term: "مُصْغِيَاتٍ"
    text: "المُصغي: المميل رأسه، «وذلك إذا اشتد عدوه» [@tabrizi-ikhtiyarat، ج3 ص1410]."
  - term: "يَتَفَارَطُ"
    text: "يتوارد شيئًا بعد شيء، وقيل: التفارط التسابق [@tabrizi-ikhtiyarat، ج3 ص1410]، من الفَرَط، وهو الذي يتقدم القوم إلى الماء."
  - term: "الثَّمَدَ"
    text: "الماء القليل [@tabrizi-ikhtiyarat، ج3 ص1410]."
context: "في وسط القصيدة يصف بِشْر غارة قومه: الخيل تخرج من العجاج كما تخرج السهام من الغرض (28)، ثم «بأحقيها الملاء محزمات» (31)، ثم هذا البيت. وقال فيه الأَصْمَعِيّ: «هذا أبلغ ما قيل في سرعة الفرس» [@tabrizi-ikhtiyarat، ج3 ص1410]. وبعده يقطع الوصف ويلتفت إلى بني أسد الذين فارقوا قومهم، وفيه بيتا الإقواء."
syntax:
  - "«يبارين» فعل مضارع، والنون فاعل يعود على الخيل، و«الأسنةَ» مفعول به."
  - "«مصغياتٍ» حال من نون النسوة منصوبة بالكسرة لأنها جمع مؤنث سالم [@tabrizi-ikhtiyarat، ج3 ص1410]."
  - "«كما» الكاف حرف تشبيه، و«ما» مصدرية، والمصدر المؤول من «ما يتفارط» في محل جر، أي كتفارط الحمام."
  - "«الثمدَ» مفعول به مقدم، و«الحمامُ» فاعل «يتفارط» مؤخر."
morphology:
  - "«يبارين» مضارع «بارى» على «فاعَل»، من البَرْي، والمباراة: المسابقة والمعارضة."
  - "«مُصغِيات» جمع «مُصغِية» اسم فاعل من «أصغى» على «أفعل»، أي أمال."
  - "«يتفارط» مضارع «تفارط» على «تفاعل»، وهو للمشاركة: كل واحد يحاول أن يكون الفَرَط."
rhetoric:
  thesis: "السرعة مصوّرة بصورتين: خيل تسابق الأسنة التي يحملها فرسانها، وحمام عطاش يتسابق إلى ماء قليل. والمعنى المشترك هو التدافع والتسابق، لا السرعة المجردة."
  devices:
    - title: "التشبيه التمثيلي"
      text: "شبّه هيئة الخيل تتسابق مائلة الرؤوس بهيئة الحمام يتسابق إلى الثَّمَد. والماء القليل يجعل التسابق أشد، لأن المتأخر لا يجد شيئًا. ويقول التِّبْرِيزِيّ إنه شبّه تسابقًا بتسابق، لأن «يبارين» دلّ على تسابق الخيل [@tabrizi-ikhtiyarat، ج3 ص1410]."
    - title: "مباراة الأسنة"
      text: "الأسنة يحملها الفرسان على الخيل، فكيف تسابقها؟ المعنى أن الخيل تمد أعناقها حتى تكاد تسبق الرماح التي فوقها. فالمبالغة في الفعل نفسه. وهذه قراءتنا."
    - title: "الحال المصوّرة"
      text: "«مصغيات» تعطي هيئة الرأس المائل، وهو تفصيل يراه من شهد الخيل في شدة العدو، وبه صار البيت صورة لا خبرًا."
  connection: "ثم يلتفت فجأة: «ألم تر أن طول الدهر يسلي، وينسي مثل ما نسيت جذام»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المضمومة، مردوفة بالألف"
  scansion: "يُبَارِينَلْ / أَسِنْنَةَ مُصْ / غِيَاتِنْ = مفاعلْتن / مفاعلتن / فعولن — كَمَا يَتَفَا / رَطُثْثَمَدَلْ / حَمَامُو = مفاعلتن / مفاعلتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن»، دخل أول الصدر العصب «تسكين الحرف الخامس» [@atiq، ص54]، وجاء العجز تامّ التفعيلتين على الأصل."
variants:
  - reading: "يُبَادِرْنَ الأَسِنَّةَ مُصْغِيَاتٍ"
    status: "رواية «الاختيارين»"
    note: "وفي الديوان «ينازعن»، وفي المَرْزُوقِيّ والديوان «الأعنّة»، كما يذكر محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1410]."
