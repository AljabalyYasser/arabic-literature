explained: false
first: "أَبَحْنَاهُ بِحَيٍّ ذِي حِلَالٍ"
second: "إِذَا مَا رِيعَ سَرْبُهُمُ أَقَامُوا"
vocabulary:
  - term: "حِلَالٍ"
    text: "جماعات الناس وجماعات بيوتهم، الواحدة حِلّة [@tabrizi-ikhtiyarat، ج3 ص1404]."
  - term: "رِيعَ سَرْبُهُمُ"
    text: "رِيع: أُفزع، والسَّرْب: المال الراعي، وصفهم بحسن الثبات والدفاع [@tabrizi-ikhtiyarat، ج3 ص1404]."
