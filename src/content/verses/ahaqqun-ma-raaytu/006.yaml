explained: false
first: "وَأَبْلَجَ مُشْرِقِ الخَدَّيْنِ فَخْمٍ"
second: "يُسَنُّ عَلَى مَرَاغِمِهِ القَسَامُ"
vocabulary:
  - term: "أَبْلَجَ"
    text: "معطوف على «بذي غروب»، أي: وبوجه أبيض الخدين فخم ريّان من الماء [@tabrizi-ikhtiyarat، ج3 ص1396]."
  - term: "يُسَنُّ"
    text: "يُصبّ، أي يُصبّ عليه ماء الحسن صبًّا [@tabrizi-ikhtiyarat، ج3 ص1396]."
  - term: "مَرَاغِمِهِ"
    text: "المَراغِم: الأنف وما حوله [@tabrizi-ikhtiyarat، ج3 ص1396]."
  - term: "القَسَامُ"
    text: "الحُسْن [@tabrizi-ikhtiyarat، ج3 ص1396]."
