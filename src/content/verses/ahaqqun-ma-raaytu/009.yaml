explained: false
first: "وَخَرْقٍ تَعْزِفُ الجِنَّانُ فِيهِ"
second: "فَيَافِيهِ تَحِنُّ بِهَا السَّهَامُ"
vocabulary:
  - term: "خَرْقٍ"
    text: "الأرض الواسعة تنخرق فيها الريح [@tabrizi-ikhtiyarat، ج3 ص1397]."
  - term: "تَعْزِفُ"
    text: "تصوّت [@tabrizi-ikhtiyarat، ج3 ص1397]."
  - term: "السَّهَامُ"
    text: "شيء أبيض يسقط من السماء إذا حميت الشمس وانتصف النهار، وقالوا: ريح حارّة شديدة [@tabrizi-ikhtiyarat، ج3 ص1398]."
