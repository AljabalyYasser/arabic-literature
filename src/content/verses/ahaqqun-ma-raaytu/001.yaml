first: "أَحَقٌّ مَا رَأَيْتُ أَمِ احْتِلَامُ"
second: "أَمِ الأَهْوَالُ إِذْ صَحْبِي نِيَامُ"
meaning: "أحقيقة ما رأيته من خيالها، أم هو حلم رأيته في النوم؟ بل هي أهوال الشوق عرضت لي وأصحابي نائمون."
vocabulary:
  - term: "احْتِلَامُ"
    text: "رؤيا النوم. «يقال: حلم واحتلم، وهو حالم ومحتلم، وإن كان الاحتلام اشتهر في الإنسان بما يوجب غُسلًا» [@tabrizi-ikhtiyarat، ج3 ص1393–1394]."
  - term: "الأَهْوَالُ"
    text: "جمع هَوْل، وهو الأمر المفزع، ويريد بها هنا أهوال الهوى والتشوق [@tabrizi-ikhtiyarat، ج3 ص1394]."
  - term: "صَحْبِي"
    text: "رفاقي في السفر، جمع صاحب."
context: "مطلع القصيدة التي رفعت بِشْرًا إلى الفحول: «قال أبو عمرو بن العلاء: ليس للعرب قصيدة على هذا الروي أجود منها، وهي التي ألحقت بشرًا بالفحول» [@tabrizi-ikhtiyarat، ج3 ص1393]. يبدأها بخيال المرأة يطرقه ليلًا في سفره، ثم يذكر إدام التي رحلت، ثم يصف حرب قومه وخيلهم، وينتهي بالفخر ببني أسد. وفيها بيتا الإقواء المشهوران (33–34)."
syntax:
  - "الهمزة في «أحقٌّ» للاستفهام، و«حقٌّ» خبر مقدم، و«ما رأيتُ» مبتدأ مؤخر، و«ما» موصولة، و«رأيت» صلتها والعائد محذوف، أي ما رأيته."
  - "«أمِ احتلامُ» «أم» المتصلة، عديلة الهمزة، و«احتلامٌ» معطوف على «حقٌّ»، وكُسرت ميمها لالتقاء الساكنين."
  - "«أمِ الأهوالُ» «أم» المنقطعة بمعنى «بل»، يقول التِّبْرِيزِيّ: «وقوله «أم الأهوال» هذه «أم» المنقطعة، والأولى هي التي تكون عديلة الألف. فكأنه استأنف فقال: بل أهوال الهوى والتشوّق عرضك لما رأيت ورفقاؤك نائمون» [@tabrizi-ikhtiyarat، ج3 ص1394]."
  - "«إذ» ظرف لما مضى، و«صحبي نيامُ» جملة اسمية في محل جر بإضافة «إذ» إليها."
morphology:
  - "«احتلام» مصدر «احتلم» على «افتعل» من الحُلُم، وهو الرؤيا."
  - "«أهوال» جمع «هَوْل» على «أفعال»، جمع قلة."
  - "«نيام» جمع «نائم» على «فِعال»، وأصلها «نِوام»، قُلبت الواو ياء لانكسار ما قبلها."
rhetoric:
  thesis: "مطلع بالشك: لا يبدأ بالطلل ولا بالرحيل، بل بسؤال الشاعر نفسه عن حقيقة ما رأى. فالقصيدة تبدأ من داخل رأسه، في ليل السفر."
  devices:
    - title: "الاستفهام"
      text: "يقول التِّبْرِيزِيّ: «راجع نفسه بعد ما تراءى له نفس محبوبه فقال: أحقّ ما رأيته أم احتلمت فتصورت باطلًا؟» [@tabrizi-ikhtiyarat، ج3 ص1393]. فالاستفهام ليس طلبًا للجواب، بل حيرة يُدخل بها السامع في حاله."
    - title: "الإضراب"
      text: "بعد أن ردّد بين الحق والحلم، أضرب عنهما بـ«أم» المنقطعة إلى جواب ثالث: الأهوال. فلا هو حق ولا حلم، بل شوق يصنع الصور. وهذه قراءتنا لقول التِّبْرِيزِيّ «فكأنه استأنف»."
    - title: "الحال الكاشفة"
      text: "«إذ صحبي نيام» تفصيل صغير يصنع المشهد: الرفاق نائمون، والشاعر وحده يقظ يرى. وبهذا يعرف السامع أن الرؤيا خاصة به، لا يشهدها أحد."
  connection: "ثم يقول: «ألا ظعنت لنيتها إدام، وكل وصال غانية رمام»، فيكشف أن الخيال خيال امرأة رحلت."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المضمومة، مردوفة بالألف، فهي ميمية"
  scansion: "أَحَقْقُنْ مَا / رَأَيْتُ أَمِحْ / تِلَامُو = مفاعلْتن / مفاعلتن / فعولن — أَمِلْ أَهْوَا / لُإِذْ صَحْبِي / نِيَامُو = مفاعلْتن / مفاعلْتن / فعولن"
  note: "الوافر «مفاعلتن مفاعلتن فعولن»، والعروض والضرب «فعولن» لأن أصلهما «مفاعلتن» دخلها القطف، «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل الحشو العصب، وهو «تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، فصارت «مفاعلْتن». والبيت مصرّع."
