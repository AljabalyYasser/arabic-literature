explained: false
first: "تَعَرُّضَ جَأْبَةِ المِدْرَى خَذُولٍ"
second: "بِصَاحَةَ فِي أَسِرَّتِهَا السَّلَامُ"
vocabulary:
  - term: "جَأْبَةِ المِدْرَى"
    text: "ظبية غليظة القرن، قال الأصمعي: الظبية جأبة المِدْرى ما دام قرنها أملس، وهو أول ما يطلع غليظ، فإذا طال دقّ [@tabrizi-ikhtiyarat، ج3 ص1396–1397]."
  - term: "خَذُولٍ"
    text: "التي تخلّفت عن قطيعها [@tabrizi-ikhtiyarat، ج3 ص1397]."
  - term: "أَسِرَّتِهَا"
    text: "الأَسِرّة: بطون الأودية [@tabrizi-ikhtiyarat، ج3 ص1397]."
  - term: "السَّلَامُ"
    text: "شجر، واحدتها سَلَمة [@tabrizi-ikhtiyarat، ج3 ص1397]."
