first: "تَغَالَى نَبْتُهُ وَاعْتَمَّ حَتَّى"
second: "كَأَنَّ مَنَابِتَ العَلَجَانِ شَامُ"
vocabulary:
  - term: "العَلَجَانِ"
    text: "نبت يرقّ منبته [@tabrizi-ikhtiyarat، ج3 ص1404]."
  - term: "شَامُ"
    text: "جمع شامة، يقول: التفّ نبته حتى اسودت الأرض به واخضرّت، فصارت منابت العلجان على رقّتها كأنها مواضع سُوّدت بالنار والرماد [@tabrizi-ikhtiyarat، ج3 ص1404]."
