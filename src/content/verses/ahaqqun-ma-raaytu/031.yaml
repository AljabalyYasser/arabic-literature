first: "بِأَحْقِيهَا المُلَاءُ مُحَزَّمَاتٌ"
second: "كَأَنَّ جِذَاعَهَا أُصُلًا جِلَامُ"
vocabulary:
  - term: "بِأَحْقِيهَا المُلَاءُ"
    text: "الأحقي: جمع حَقْو، وهو معقد الإزار، والمُلاء: الأُزُر، جُعلت حُزُمًا لها لأنها ألقت أولادها [@tabrizi-ikhtiyarat، ج3 ص1409]."
  - term: "أُصُلًا"
    text: "عشيًّا، جمع أصيل [@tabrizi-ikhtiyarat، ج3 ص1409]."
  - term: "جِلَامُ"
    text: "الجِداء، شبّه أولادها بها لضمرها، وقيل: التيوس [@tabrizi-ikhtiyarat، ج3 ص1409]."
