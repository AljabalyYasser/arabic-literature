first: "كَأَخْنَسَ نَاشِطٍ بَاتَتْ عَلَيْهِ"
second: "بِحَرْبَةَ لَيْلَةٌ فِيهَا جَهَامُ"
vocabulary:
  - term: "كَأَخْنَسَ نَاشِطٍ"
    text: "الأخنس: الثور الوحشي، والناشط: الذي يخرج من بلد إلى بلد [@tabrizi-ikhtiyarat، ج3 ص1399]."
  - term: "الجَهَامُ"
    text: "سحاب قد هراق ماءه. شبّه ناقته في أسفارها بثور أصابه البرد والمطر فبادر إلى مقرّه [@tabrizi-ikhtiyarat، ج3 ص1399]."
