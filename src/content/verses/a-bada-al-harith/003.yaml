explained: false
first: وَيَمْنَحُهَا بَنُو شَمَجَى بْنِ جَرْمٍ
second: مَعِيزَهُمُ حَنَانَكَ ذَا الْحَنَانِ
vocabulary:
- term: يَمْنَحُهَا
  text: «يعطيها منحة، وهي الشاة أو الناقة يعطيها الرجل جاره أو قريبه ينتفع بلبنها وصوفها ثم يردها إذا استغنى عنها» [@diwan-imru-al-qais، ص143].
- term: مَعِيزَهُمُ
  text: مِعزاهم.
- term: حَنَانَكَ ذَا الْحَنَانِ
  text: 'رحمتَك يا ذا الرحمة، قاله «على طريق الترحم والتعجب من تغير الدهر» [@diwan-imru-al-qais، ص143]. وروى الأَصْمَعِيّ «ويَمْنَحُها أي يعطيها» فجعله دعاءً لهم، وروى ابن الأعرابي «ويمنعها» وفسّر: «رحمتك يا رحمن فأغنني عنهم» [@lisan، ج13 ص130].'
