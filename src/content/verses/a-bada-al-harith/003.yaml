first: وَيَمْنَعُهَا بَنُو شَمَجَى بْنِ جَرْمٍ
second: مَعِيزَهُمُ حَنَانَكَ ذَا الْحَنَانِ
vocabulary:
- term: مَعِيزَهُمُ
  text: مِعزاهم.
- term: حَنَانَكَ ذَا الْحَنَانِ
  text: 'رحمتَك يا ذا الرحمة؛ فسّره ابن الأعرابي: «رحمتك يا رحمن فأغنني عنهم»، ورواه الأَصْمَعِيّ «ويَمْنَحُها أي يعطيها» فجعله دعاءً لهم [@lisan، ج13 ص130].'
