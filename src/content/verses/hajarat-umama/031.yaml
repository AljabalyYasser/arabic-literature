explained: false
first: "خِزْيُ الْحَيَاةِ وَحَرْبُ الصَّدِيقِ"
second: "وَكُلٌّ أَرَاهُ طَعَامًا وَبِيلَا"
vocabulary:
  - term: "خِزْيُ الْحَيَاةِ"
    text: "ما يلحقهم من العار إذا خذلوا حلفاءهم الحُرَقة [@mufaddaliyyat، ص59، الحاشية]."
  - term: "حَرْبُ الصَّدِيقِ"
    text: "إذا نصروا حلفاءهم فحاربوا غطفان، والصديق يكون واحدًا وجمعًا [@mufaddaliyyat، ص59، الحاشية]."
  - term: "وَكُلٌّ"
    text: "مرفوعة بالابتداء، أو منصوبة مفعولًا مقدّمًا لـ«أراه» [@mufaddaliyyat، ص59، الحاشية]."
  - term: "وَبِيلَا"
    text: "الطعام الوبيل: غير المستمرأ [@mufaddaliyyat، ص59، الحاشية]، أي الذي لا يُهضم ولا يُستساغ."
