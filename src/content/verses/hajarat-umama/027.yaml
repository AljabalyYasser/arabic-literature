explained: false
first: "يَدَا عَائِمٍ خَرَّ فِي غَمْرَةٍ"
second: "قَدَ ادْرَكَهُ الْمَوْتُ إِلَّا قَلِيلَا"
vocabulary:
  - term: "يَدَا عَائِمٍ"
    text: "خبر «كأنّ» في البيت قبله، والشطر الثاني من ذلك البيت جملة معترضة. والعائم: السابح [@mufaddaliyyat، ص59، الحاشية]."
  - term: "غَمْرَةٍ"
    text: "معظم الماء. يريد: كأن يدي ناقته في وقت كلال غيرها من الإبل يدا سابح كاد يغرق، فهو أشد لتحريكه يديه مخافة على نفسه [@mufaddaliyyat، ص59، الحاشية]."
  - term: "قَدَ ادْرَكَهُ"
    text: "أي: قد أدركه، نُقلت حركة الهمزة إلى الدال ليستقيم الوزن."
