explained: false
first: "كَأَنَّ النَّوَى لَمْ تَكُنْ أَصْقَبَتْ"
second: "وَلَمْ تَأْتِ قَوْمَ أَدِيمٍ حُلُولَا"
vocabulary:
  - term: "النَّوَى"
    text: "البعد [@mufaddaliyyat، ص56، الحاشية]."
  - term: "أَصْقَبَتْ"
    text: "دنت وقاربت [@mufaddaliyyat، ص56، الحاشية]."
  - term: "قَوْمَ أَدِيمٍ"
    text: "الأديم: الجلد. أضافه إلى القوم بمعنى أنهم أشراف ملوك لهم قباب الأدم، ولا تكون إلا للملوك والأشراف [@mufaddaliyyat، ص56، الحاشية]."
  - term: "حُلُولَا"
    text: "حالّين مقيمين. يعني أن الزمن يفرّق بين الناس [@mufaddaliyyat، ص56، الحاشية]."
