explained: false
first: "كَأَنَّ يَدَيْهَا إِذَا أَرْقَلَتْ"
second: "وَقَدْ جُرْنَ ثُمَّ اهْتَدَيْنَ السَّبِيلَا"
vocabulary:
  - term: "أَرْقَلَتْ"
    text: "من الإرقال، وهو أن تعدو تنفض رأسها مرحًا [@mufaddaliyyat، ص58، الحاشية]."
  - term: "جُرْنَ ثُمَّ اهْتَدَيْنَ"
    text: "يعني الإبل سواها: عدلن عن محجّة الطريق يمنة ويسرة في وقت نشاطهن، فلما تعبن اهتدين الطريق ولزمنه إعياءً وكلالًا [@mufaddaliyyat، ص58، الحاشية]."
