explained: false
first: "وَحَادِرَةٍ كَنَفَيْهَا الْمَسِيـ"
second: "ـحُ تُنْضِحُ أَوْبَرَ شَثًّا غَلِيلَا"
vocabulary:
  - term: "وَحَادِرَةٍ"
    text: "الضخمة، وأراد أذنها، أي: لها حادرة، أو: ورُبّ حادرة [@mufaddaliyyat، ص57، الحاشية]."
  - term: "كَنَفَيْهَا"
    text: "ناحيتيها [@mufaddaliyyat، ص57، الحاشية]."
  - term: "الْمَسِيحُ"
    text: "العرق، أي على جانبي أذنيها العرق [@mufaddaliyyat، ص57، الحاشية]."
  - term: "أَوْبَرَ"
    text: "ذا الوبر، ويريد به عُثْنونها، وهو الشعر تحت حنكها [@mufaddaliyyat، ص57، الحاشية]."
  - term: "شَثًّا غَلِيلَا"
    text: "الشَّثّ: الكثير المتراكب، والغليل: الذي انغلّ بعضه في بعض وتداخل. فأذناها تسيل العرق على عثنونها [@mufaddaliyyat، ص57، الحاشية]."
