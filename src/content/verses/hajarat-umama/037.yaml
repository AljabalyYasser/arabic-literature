explained: false
first: "كَثَوْبِ ابْنِ بَيْضٍ وَقَاهُمْ بِهِ"
second: "فَسَدَّ عَلَى السَّالِكِينَ السَّبِيلَا"
vocabulary:
  - term: "كَثَوْبِ ابْنِ بَيْضٍ"
    text: "ينقل المحققان عن الأصمعي أن ابن بيض رجل نحر بعيره على ثنية فسدّها، فلم يقدر أحد على جوازها، فضُرب به المثل فقيل: سدّ ابن بيض السبيل، وأنه أراد أن يقول: كبعير ابن بيض، فلم يستقم له الوزن، فقال: كثوب [@mufaddaliyyat، ص60، الحاشية]."
  - term: "وَقَاهُمْ بِهِ"
    text: "حماهم به."
