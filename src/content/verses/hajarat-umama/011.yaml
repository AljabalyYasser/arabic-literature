explained: false
first: "مُدَاخَلَةَ الْخَلْقِ مَضْبُورَةً"
second: "إِذَا أَخَذَ الْحَاقِفَاتُ الْمَقِيلَا"
vocabulary:
  - term: "مُدَاخَلَةَ الْخَلْقِ"
    text: "محكمة البنية، قد أخذ بعضها بعضًا [@mufaddaliyyat، ص56، الحاشية]."
  - term: "مَضْبُورَةً"
    text: "المجموع بعض خلقها إلى بعض [@mufaddaliyyat، ص56، الحاشية]."
  - term: "الْحَاقِفَاتُ"
    text: "الظباء تكون في الأحقاف، والحِقْف ما اعوجّ من الرمل [@mufaddaliyyat، ص56، الحاشية]."
  - term: "الْمَقِيلَا"
    text: "حيث يقِلن أنصاف النهار من شدة الحر، وهو وقت إعياء الإبل. يقول: هي نشيطة وقت كلال الإبل، لم يكسرها السير [@mufaddaliyyat، ص56، الحاشية]."
