explained: false
first: "تَطَرَّدُ أَطْرَافَ عَامٍ خَصِيبٍ"
second: "وَلَمْ يُشْلِ عَبْدٌ إِلَيْهَا فَصِيلَا"
vocabulary:
  - term: "تَطَرَّدُ"
    text: "ترعى حيث شاءت لا تُمنع، لعزّ صاحبها [@mufaddaliyyat، ص57، الحاشية]."
  - term: "أَطْرَافَ عَامٍ خَصِيبٍ"
    text: "أطراف شجره ونبته [@mufaddaliyyat، ص57، الحاشية]."
  - term: "لَمْ يُشْلِ"
    text: "لم يَدْعُ [@mufaddaliyyat، ص57، الحاشية]."
  - term: "فَصِيلَا"
    text: "ولد الناقة. يريد أنها لم تلد، فهو أصلب لها [@mufaddaliyyat، ص57، الحاشية]."
