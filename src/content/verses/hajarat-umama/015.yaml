first: "بِعَيْنٍ كَعَيْنِ مُفِيضِ الْقِدَاحِ"
second: "إِذَا مَا أَرَاغَ يُرِيدُ الْحَوِيلَا"
vocabulary:
  - term: "مُفِيضِ الْقِدَاحِ"
    text: "الذي يقلّب قداح المَيْسِر ويدفعها لينظر الرابح، ومن أمثالهم في شدة الحذر «نظر بعين مفيض»، يريد أنها حديدة النظر يقظة [@mufaddaliyyat، ص57، الحاشية]."
  - term: "أَرَاغَ"
    text: "حاول والتمس [@mufaddaliyyat، ص57، الحاشية]."
  - term: "الْحَوِيلَا"
    text: "الاحتيال [@mufaddaliyyat، ص57، الحاشية]."
