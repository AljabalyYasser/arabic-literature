explained: false
first: "فَمَرَّتْ عَلَى كُشُبٍ غُدْوَةً"
second: "وَحَاذَتْ بِجَنْبِ أَرِيكٍ أَصِيلَا"
vocabulary:
  - term: "كُشُبٍ ... أَرِيكٍ"
    text: "جبلان بالبادية بينهما نأي من الأرض، ويقال: كَشِب. فوصف سرعتها، وأنها سارت في يوم ما يُسار في أيام [@mufaddaliyyat، ص57، الحاشية]."
  - term: "غُدْوَةً ... أَصِيلَا"
    text: "أول النهار وآخره."
