explained: false
first: "وَإِنْ أَدْبَرَتْ قُلْتَ مَشْحُونَةٌ"
second: "أَطَاعَ لَهَا الرِّيحُ قِلْعًا جَفُولَا"
vocabulary:
  - term: "مَشْحُونَةٌ"
    text: "المملوءة. شبّهها بسفينة مملوءة لأنه أقوم لسيرها [@mufaddaliyyat، ص58، الحاشية]."
  - term: "أَطَاعَ لَهَا الرِّيحُ"
    text: "بمعنى: جعله يطيع، ويقول المحققان: «ولم نجد هذا المعنى لهذا الحرف في المعاجم، والسياق يدل عليه» [@mufaddaliyyat، ص58، الحاشية]."
  - term: "قِلْعًا"
    text: "الشراع [@mufaddaliyyat، ص58، الحاشية]."
  - term: "جَفُولَا"
    text: "التي تنجفل، أي تسرع [@mufaddaliyyat، ص58، الحاشية]."
