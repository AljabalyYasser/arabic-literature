first: "وَحُمِّلْتَ مِنْهَا عَلَى نَأْيِهَا"
second: "خَيَالًا يُوَافِي وَنَيْلًا قَلِيلَا"
vocabulary:
  - term: "خَيَالًا يُوَافِي"
    text: "طيفها يأتيه في النوم. يقول المحققان: حُمّلت مع بعدها عنك أن ترى خيالها فيزيدك شوقًا [@mufaddaliyyat، ص56، الحاشية]."
  - term: "نَيْلًا"
    text: "عطاءً، أي لم تنله منها إلا القليل."
