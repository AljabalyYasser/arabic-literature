explained: false
first: "وَعُوجًا تَنَاطَحْنَ تَحْتَ الْمَطَا"
second: "وَتَهْدِي بِهِنَّ مُشَاشًا كُهُولَا"
vocabulary:
  - term: "وَعُوجًا"
    text: "يريد الأضلاع [@mufaddaliyyat، ص58، الحاشية]."
  - term: "تَنَاطَحْنَ"
    text: "التقين ودخل بعضهن في بعض [@mufaddaliyyat، ص58، الحاشية]."
  - term: "الْمَطَا"
    text: "الظهر [@mufaddaliyyat، ص58، الحاشية]."
  - term: "تَهْدِي"
    text: "تدلّ وتبين [@mufaddaliyyat، ص58، الحاشية]."
  - term: "مُشَاشًا كُهُولَا"
    text: "المُشاش: رؤوس العظام، والكهول: الضخام الطوال. يريد أن أضلاعها قوية متداخلة تدل على أن عظامها غليظة [@mufaddaliyyat، ص58، الحاشية]."
