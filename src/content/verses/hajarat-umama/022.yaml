first: "وَإِنْ أَعْرَضَتْ رَاءَ فِيهَا الْبَصِيـ"
second: "ـرُ مَا لَا يُكَلِّفُهُ أَنْ يَفِيلَا"
vocabulary:
  - term: "رَاءَ"
    text: "رأى، على القلب [@mufaddaliyyat، ص58، الحاشية]."
  - term: "يَفِيلَا"
    text: "يخطئ رأيه. أي: إذا رأيت هذه الناقة من جانبها لم يخطئ البصير في نجابتها [@mufaddaliyyat، ص58، الحاشية]."
