explained: false
first: "لَهَا قَرِدٌ تَامِكٌ نَيُّهُ"
second: "تَزِلُّ الْوَلِيَّةُ عَنْهُ زَلِيلَا"
vocabulary:
  - term: "قَرِدٌ"
    text: "من التقرّد، وهو التجمّع، وعنى به السنام، يريد أنه مكتنز [@mufaddaliyyat، ص57، الحاشية]."
  - term: "تَامِكٌ"
    text: "المرتفع العالي [@mufaddaliyyat، ص57، الحاشية]."
  - term: "نَيُّهُ"
    text: "النِّيّ: الشحم [@mufaddaliyyat، ص57، الحاشية]."
  - term: "الْوَلِيَّةُ"
    text: "حِلْس يكون تحت الرحل يقي الظهر، وإنما تزلّ عنه لملاسة سنامها [@mufaddaliyyat، ص57، الحاشية]."
