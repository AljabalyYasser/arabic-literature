explained: false
first: "فَبَادَرَتَاهَا بِمُسْتَعْجِلٍ"
second: "مِنَ الدَّمْعِ يَنْضَحُ خَدًّا أَسِيلَا"
vocabulary:
  - term: "فَبَادَرَتَاهَا"
    text: "يعني عينيها، أضمرهما ولم يجرِ لهما ذكر [@mufaddaliyyat، ص56، الحاشية]: سبقتها عيناها بدمع مستعجل."
  - term: "يَنْضَحُ"
    text: "يبلّ ويرشّ."
  - term: "خَدًّا أَسِيلَا"
    text: "الخد الأسيل: السهل اللين الدقيق المستوي [@mufaddaliyyat، ص56، الحاشية]."
