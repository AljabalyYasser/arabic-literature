explained: false
first: "وَمِنْ نَسْجِ دَاوُودَ مَوْضُونَةً"
second: "تَرَى لِلْقَوَاضِبِ فِيهَا صَلِيلَا"
vocabulary:
  - term: "نَسْجِ دَاوُودَ"
    text: "يريد الدروع [@mufaddaliyyat، ص59، الحاشية]."
  - term: "مَوْضُونَةً"
    text: "التي نُسجت حلقتين حلقتين مضاعفة [@mufaddaliyyat، ص59، الحاشية]."
  - term: "الْقَوَاضِبِ"
    text: "السيوف القاطعة [@mufaddaliyyat، ص59، الحاشية]."
  - term: "تَرَى ... صَلِيلَا"
    text: "الصليل: الصوت على الشيء اليابس. وعبّر عن السماع بالرؤية توكيدًا للمعنى، إذ الرؤية أوثق من السمع [@mufaddaliyyat، ص59، الحاشية]."
