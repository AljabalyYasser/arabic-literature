explained: false
first: "تَوَقَّرُ شَازِرَةً طَرْفَهَا"
second: "إِذَا مَا ثَنَيْتَ إِلَيْهَا الْجَدِيلَا"
vocabulary:
  - term: "تَوَقَّرُ"
    text: "تنظر بوقار ورزانة [@mufaddaliyyat، ص57، الحاشية]."
  - term: "شَازِرَةً"
    text: "الشَّزْر: النظر بمؤخر العين على غير استواء [@mufaddaliyyat، ص57، الحاشية]."
  - term: "الْجَدِيلَا"
    text: "الزمام. يقول: هي مؤدّبة، إذا ثنيت إليها الزمام لم تنفر [@mufaddaliyyat، ص57، الحاشية]."
