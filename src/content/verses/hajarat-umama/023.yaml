explained: false
first: "يَدًا سُرُحًا مَائِرًا ضَبْعُهَا"
second: "تَسُومُ وَتَقْدُمُ رِجْلًا زَجُولَا"
vocabulary:
  - term: "يَدًا"
    text: "بدل من مفعول «راء» في البيت قبله [@mufaddaliyyat، ص58، الحاشية]."
  - term: "سُرُحًا"
    text: "منسرحة سهلة [@mufaddaliyyat، ص58، الحاشية]."
  - term: "مَائِرًا ضَبْعُهَا"
    text: "الضَّبْع: العضد، ومَوْره: اختلاجه واضطرابه من سرعة السير [@mufaddaliyyat، ص58، الحاشية]."
  - term: "تَسُومُ"
    text: "تمرّ مرًّا سهلًا [@mufaddaliyyat، ص58، الحاشية]."
  - term: "زَجُولَا"
    text: "من الزَّجْل، وهو الدفع. يريد أن يدها تسرع وتتقدم رجلها، ورجلها تدفع نفسها لتلحق اليد [@mufaddaliyyat، ص58، الحاشية]."
