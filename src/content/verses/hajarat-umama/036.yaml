explained: false
first: "فَإِنَّكُمُ وَعَطَاءَ الرِّهَانِ"
second: "إِذَا جَرَّتِ الْحَرْبُ جُلًّا جَلِيلَا"
vocabulary:
  - term: "عَطَاءَ الرِّهَانِ"
    text: "يقول: أعطيتم منكم رهنًا وقد اشتد الأمر. وكان الحُصَيْن بن الحُمام المُرّيّ رهن ابنه في تلك الحرب [@mufaddaliyyat، ص60، الحاشية]."
  - term: "جُلًّا"
    text: "العظيم، كالجليل. وهو في المعاجم بفتح الجيم وكسرها، وضُبط في أصول الكتاب بالضم، كما يقول المحققان [@mufaddaliyyat، ص60، الحاشية]."
