first: "وَشُبِّهَ الهَيْدَبُ العَبَامُ مِنَ الْـ"
second: "ـأَقْوَامِ سَقْبًا مُلَبَّسًا فَرَعَا"
vocabulary:
  - term: "الهَيْدَبُ العَبَامُ"
    text: "«الهَيْدَبُ مِنَ الرِّجَالِ الْجَافِي الثقيلُ، الْكَثِيرُ الشَّعَر» [@lisan، ج1 ص782]، و«العَبَامُ ...: الغليظُ الخِلْقةِ فِي حُمْقٍ، وَقِيلَ: هُوَ العَيِيُّ الأَحْمَقُ؛ قَالَ أَوْسُ بنُ حجَر يذْكُرُ أَزْمةً فِي سَنَةٍ شَدِيدَةِ البَرْد» [@lisan، ج12 ص380]."
  - term: "سَقْبًا"
    text: "ولد الناقة الذكر."
  - term: "مُلَبَّسًا فَرَعَا"
    text: "«والفَرَعُ: أَن يُسْلَخَ جِلْدُ الفَصِيلِ فيُلْبَسَه آخَرُ وتَعْطِفَ عَلَيْهِ نَاقَةٌ سِوَى أُمه فَتَدِرَّ عَلَيْهِ»، وفي البيت: «أَراد مُجَلَّلًا جِلْدَ فَرَعٍ» [@lisan، ج8 ص249]. أي التفّ الرجل الثقيل في ثيابه من البرد فصار كفصيل أُلبس جلد غيره. وفي القالي واللسان: «مُجَلَّلًا» [@qali، ج1 ص58]."
