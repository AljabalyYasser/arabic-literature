explained: false
first: "وَالحَافِظَ النَّاسَ فِي تَحُوطَ إِذَا"
second: "لَمْ يُرْسِلُوا خَلْفَ عَائِذٍ رُبَعَا"
vocabulary:
  - term: "تَحُوطَ"
    text: "قال المُبَرِّد: «وتحوط وقحوط: اسمان للسنة الجدبة» [@kamil، ج4 ص33]. وفي اللسان: «تَحُوطُ اسْمُ القَحْطِ ... جُعِلَ اسْمًا مَعْرِفَةً لِلسَّنَةِ، وَلَا يُجْرَى» [@lisan، ج7 ص266]، أي لا يُنوَّن."
  - term: "لَمْ يُرْسِلُوا خَلْفَ عَائِذٍ رُبَعَا"
    text: "قال المُبَرِّد: «فالعائذ الحديثة النتاج، والربع: الذي ينتج في الربيع، ومن شأنهم في سنة الجدب أن ينحروا الفصال، لئلا ترضع فتضر بالأمهات» [@kamil، ج4 ص33]. أي في سنة يذبحون فيها صغار الإبل ليبقى لبن أمهاتها لهم. وفي موضع آخر من «الكامل» وفي اللسان: «تَحْتَ عَائِذٍ» [@kamil، ج3 ص50]."
