first: "وَذَاتُ هِدْمٍ عَارٍ نَوَاشِرُهَا"
second: "تُصْمِتُ بِالمَاءِ تَوْلَبًا جَدِعَا"
meaning: "ولتبكِه أيضًا المرأة الفقيرة التي تلبس ثوبًا باليًا، عاريةُ عروق ذراعيها من الهزال وقلة الثياب، تُسكت طفلها الجائع السيئ الغذاء بالماء، لأنها لا تجد ما تطعمه. كان فَضَالة يطعمها، فمن لها بعده؟"
vocabulary:
  - term: "ذَاتُ هِدْمٍ"
    text: "قال المُبَرِّد: «يعني امرأة ضعيفة، والهدم: الكساء الخلق الرث» [@kamil، ج4 ص34]."
  - term: "عَارٍ نَوَاشِرُهَا"
    text: "«النواشر: عروق الساعد» [@kamil، ج4 ص34]. وفي اللسان: «وَالنَّوَاشِرُ: عروقُ ظهر الْكَفِّ، وَقِيلَ: هِيَ عروقُ ظَاهِرِ الذِّرَاعِ» [@lisan، ج6 ص307]. أي ظهرت عروق ذراعيها من الهزال، ولا ثوب يسترهما."
  - term: "تُصْمِتُ"
    text: "تُسكت؛ من «أَصْمَتَ»."
  - term: "تَوْلَبًا"
    text: "«التَوْلَبُ: ولَدُ الأَتانِ مِنَ الوَحْشِ إِذَا اسْتَكْمَل الحَوْلَ ... وَقَدْ يُسْتَعارُ للإِنسانِ. قَالَ أَوْسُ بْنُ حَجَر يصف صَبِيًّا» [@lisan، ج1 ص232]. والأتان أنثى الحمار."
  - term: "جَدِعَا"
    text: "«والجدع: السيئ الغذاء» [@kamil، ج4 ص34]. وفي اللسان: «وجَدِعَ الغلامُ يَجْدَعُ جَدَعاً، فَهُوَ جَدِعٌ: سَاءَ غِذاؤه» [@lisan، ج8 ص42]."
context: "آخر القصيدة في رواية المُبَرِّد. وهو معطوف على فاعل «لِيَبْكِكَ» في البيت قبله، كما يقول ابن بَرِّيّ في اللسان: «صَوَابُهُ وذاتُ، بِالرَّفْعِ، لأَنه مَعْطُوفٌ عَلَى فَاعِلٍ قَبْلَهُ» [@lisan، ج12 ص604]. فبعد الندماء والفتيان والطامعين، يختم الشاعر بأضعف من كان يعيش في ظل الميت: أمّ فقيرة وطفل جائع. وبهذه الصورة يعود إلى سنة الجدب التي وصفها في وسط القصيدة."
syntax:
  - "«وَذَاتُ هِدْمٍ»: «ذاتُ» معطوف بالواو على «الشَّرْبُ» فاعل «لِيَبْكِكَ» في البيت السابق، مرفوع، وهو مضاف و«هدمٍ» مضاف إليه."
  - "«عَارٍ نَوَاشِرُهَا»: «عارٍ» نعت لـ«ذاتُ»، وهو اسم منقوص، و«نواشرُها» فاعل له لأنه اسم فاعل يعمل عمل فعله. والتقدير: وذات هدم عَرِيَتْ نواشرُها. ولم يؤنث «عارٍ» لأن فاعله جمع تكسير."
  - "«تُصْمِتُ بِالمَاءِ تَوْلَبًا جَدِعَا»: الجملة نعت ثانٍ، أو حال. «تولبًا» مفعول به، و«جدعًا» نعته، والألف للإطلاق، و«بالماء» متعلق بـ«تُصمت»."
morphology:
  - "«هِدْم» على «فِعْل» بمعنى المفعول، أي الثوب المهدوم البالي، وجمعه أهدام."
  - "«عارٍ» اسم فاعل من «عَرِيَ يَعْرَى» على «فاعِل»، حُذفت ياؤه في التنوين."
  - "«تُصْمِتُ» مضارع «أَصْمَتَ» على «أَفْعَلَ»، والهمزة للتعدية: صَمَتَ الصبيُّ وأَصْمَتَتْه أمه."
  - "«تَوْلَب» على «فَوْعَل»، والتاء أصلية والواو زائدة، كما في اللسان: «وَإِنَّمَا قُضِيَ عَلَى تَائِهِ أَنها أَصْلٌ وواوِه بِالزِّيَادَةِ، لأَن فَوْعَلًا فِي الْكَلَامِ أَكثر مِنْ تَفْعَلُ» [@lisan، ج1 ص232]."
  - "«جَدِع» صفة على «فَعِل» من «جَدِعَ يَجْدَعُ»."
rhetoric:
  thesis: "خاتمة تختصر سنة الجدب في صورة واحدة: أمّ لا تملك إلا الماء تسكت به جوع طفلها. فالمرثية تنتهي بمن فقد الميت، لا بالميت نفسه."
  devices:
    - title: "«تَوْلَبًا»: استعارة عابها النقاد"
      text: "سمّى الطفل «تولبًا»، وهو في أصل اللغة ولد الأتان. يروي المَرْزُبانيّ: «عاب قوم على أوس بن حجر قوله ... لأنه أفحش الاستعارة بأن سمّى الصبىّ تولبا؛ وهو ولد الحمار»، ويقولون إن كل ما جرى هذا المجرى من الاستعارة «قبيح لا عذر فيه» [@muwashshah، ص74]. ويروي ابن رَشِيق أن قُدامة أنشد البيت في المعاظلة، «لأنه قد أساء الاستعارة عنده؛ لجعله الطفل تولبا، وهو ولد الحمار» [@ibn-rashiq، ج2 ص264]. وعبد القاهر يفرّق بين استعارة لا تفيد إلا نقل اسم عضو أو مخلوق من جنس إلى جنس، كالمَرْسِن، وهو أنف الدابة، يُستعمل للإنسان، فإن «اختصاص المَرْسِن بغير الآدمي لا يفيد أكثر مما يفيد الأنف في الآدمي» [@asrar، ص34]، وبين ما ظاهره ذلك وفيه تشبيه مقصود، كقولهم «غليظ المشافر» في الذمّ [@asrar، ص36]. فإن كان «التولب» عند أوس مجرد اسم للصغير فهو من النوع الأول الذي لا فائدة فيه، وهو ما عابه النقاد. وإن أراد أن الطفل صار في جوعه وهزاله كجحش صغير مهمل فهو من النوع الثاني، وفيه تشبيه يزيد الصورة بؤسًا. وهذا تأويل منا، ولا نجد ناقدًا قديمًا قال به."
    - title: "«تُصْمِتُ بِالمَاءِ»: الكناية عن الجوع"
      text: "لا يقول إن الطفل جائع، بل يقول إن أمه تسكته بالماء؛ والماء لا يُسكت إلا جائعًا لا تجد أمه ما تطعمه. فهي كناية عن الجوع والفقر معًا، تلزم من الصورة ولا تُذكر."
    - title: "التقابل بين أول البيتين"
      text: "في البيت السابق يبكيه «الشَّرْبُ والمُدَامَةُ والفِتْيانُ»، أي الندماء والخمر وأهل اللهو، وفي هذا البيت تبكيه امرأة فقيرة. فالميت كان كريمًا على الطرفين: على أهل الرخاء في مجالسه، وعلى أهل البؤس في سنة الجدب. وهي قراءتنا."
prosody:
  meter: "البحر المنسرح"
  rhyme: "الرَّوِيّ العين المفتوحة تتبعها ألف الإطلاق"
  scansion: "وَذَاتُهِدْ / مِنْعَارِنَ / وَاشِرُهَا = متفعلن / مفعولاتُ / مستعلن — تُصْمِتُبِلْ / مَاءِتَوْلَ / بَنْجَدِعَا = مستعلن / مفعلاتُ / مستعلن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى في الصدر فصارت «متفعلن»، وجاءت «مفعولات» في الصدر تامة، وهو جائز: «وقد تأتي تامة بدون زحاف مفعولات» [@atiq، ص92]. ودخل الطيّ «مستفعلن» الأولى في العجز، و«مفعولات» فيه."
variants:
  - reading: "وَذَاتُ هِدْمٍ عَارٍ نَوَاشِرُهَا / تُصْمِتُ بِالمَاءِ تَوْلَبًا جَذَعَا"
    status: "رواية المُفَضَّل، ردّها الأَصْمَعِيّ"
    note: "يروي الأزهري، كما في اللسان، أن سليمان بن علي الهاشمي جمع بالبصرة بين المُفَضَّل الضَّبِّيّ والأَصْمَعِيّ، فأنشد المُفَضَّل البيت وقال آخره: «جَذَعا»، فقال له الأَصْمَعِيّ: «إِنما هُوَ تَوْلَبًا جَذَعا» يمتحنه، فلم يفطن المُفَضَّل وقال: «وَكَذَلِكَ أَنشدته»، فقال الأَصْمَعِيّ: «أَخطأْت إِنما هُوَ: تَوْلباً جَدِعا»، فرفع المُفَضَّل صوته بـ«جذعا»، فقال له الأَصْمَعِيّ: «لَوْ نفَخْت فِي الشَّبُّور مَا نَفَعَكَ، تَكَلَّمْ كَلَامَ النَّمْلِ وأَصبْ». فحكّما غلامًا من بني أسد حافظًا للشعر، «فصدَّق الأَصمعي» [@lisan، ج8 ص42–43]. والشبُّور البوق، والجَذَع الصغير من الدواب، والجَدِع بالدال السيئ الغذاء."
