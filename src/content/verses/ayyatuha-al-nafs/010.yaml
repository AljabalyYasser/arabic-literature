first: "لِيَبْكِكَ الشَّرْبُ وَالمُدَامَةُ وَالْـ"
second: "ـفِتْيَانُ طُرًّا وَطَامِعٌ طَمِعَا"
vocabulary:
  - term: "الشَّرْبُ"
    text: "الجماعة يشربون معًا، أي ندماؤه."
  - term: "المُدَامَةُ"
    text: "الخمر."
  - term: "طُرًّا"
    text: "جميعًا."
  - term: "وَطَامِعٌ طَمِعَا"
    text: "ومن كان يطمع في عطائه. والبيت قبل «وذات هدم» في روايته، كما يقول ابن بَرِّيّ [@lisan، ج12 ص604]."
