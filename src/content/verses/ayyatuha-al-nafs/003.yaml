explained: false
first: "أَوْدَى فَمَا تَنْفَعُ الإِشَاحَةُ مِنْ"
second: "شَيْءٍ لِمَنْ قَدْ يُحَاوِلُ البِدَعَا"
vocabulary:
  - term: "أَوْدَى"
    text: "هلك. وهو خبر «إنّ» في البيت السابق، والبيت عند محقق «الكامل» «من زيادات ر»، أي من إحدى نسخه [@kamil، ج4 ص32، الحاشية]."
  - term: "الإِشَاحَةُ"
    text: "«ابْنُ الأَعرابي: والإِشاحةُ الحَذَرُ» [@lisan، ج2 ص500]."
  - term: "يُحَاوِلُ البِدَعَا"
    text: "«والإِشاحةُ: الحَذَر وَالْخَوْفُ لِمَنْ حَاوَلَ أَن يَدْفَعَ الْمَوْتَ، ومحاوَلَتُه دَفْعَه بِدْعةٌ» [@lisan، ج2 ص500]. أي لا ينفع الحذر من حاول أمرًا لا يكون، وهو دفع الموت. وفي «الأغاني»: «أَوْدَى وَهَلْ تَنْفَعُ الإِشَاحَةُ» [@aghani-dk، ج11 ص74]."
