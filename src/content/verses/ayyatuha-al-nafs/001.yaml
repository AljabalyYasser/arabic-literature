first: "أَيَّتُهَا النَّفْسُ أَجْمِلِي جَزَعَا"
second: "إِنَّ الَّذِي تَحْذَرِينَ قَدْ وَقَعَا"
meaning: "يا نفسُ، اجعلي جزعك جميلًا معتدلًا، أي اصبري ولا تفرطي في الحزن؛ فالذي كنت تخافين وقوعه، وهو موت فَضَالة، قد وقع، فلم يبق للخوف معنى، وبقي الصبر."
vocabulary:
  - term: "أَجْمِلِي"
    text: "أحسني واعتدلي؛ أمر من «أَجْمَلَ»، أي اجعلي جزعك جميلًا لا إفراط فيه."
  - term: "جَزَعَا"
    text: "«والجَزَعُ نَقِيضُ الصَّبْرِ» [@lisan، ج8 ص47]."
  - term: "تَحْذَرِينَ"
    text: "تخافين وتتّقين. وفي رواية «الأغاني» و«عيون الأخبار»: «تَكْرَهِينَ»."
context: "مطلع القصيدة، وهو أشهر ما فيها. يقول الأَصْمَعِيّ فيما يرويه ابن قُتَيْبة: «ولم أسمع قطّ ابتداء مرثية أحسن من ابتداء مرثيته» [@ibn-qutayba، ج1 ص202]، ويرويه ابن عبد ربّه: «لم يبتدىء أحد بمرثية بأحسن من ابتداء أوس بن حجر» [@iqd، ج3 ص221]. ويذكره ابن رَشِيق أول ما «اختير» للقدماء في الرثاء [@ibn-rashiq، ج1 ص219]. وحسنه أنه يدخل في الموت من أول كلمة دون أن يسمّيه، ويبدأ بالصبر قبل البكاء."
syntax:
  - "«أَيَّتُهَا»: منادى بأداة نداء محذوفة، أي «يا أيتها»، وهو «أيّ» مبني على الضم في محل نصب، والتاء للتأنيث لأن النفس مؤنثة، و«ها» للتنبيه. و«النَّفْسُ» نعت لـ«أيّ» مرفوع على لفظه."
  - "«أَجْمِلِي جَزَعَا»: فعل أمر مبني على حذف النون، وياء المخاطبة فاعل، و«جَزَعًا» تمييز منصوب، أي أجملي من جهة الجزع. ويجوز أن يكون مفعولًا به على تضمين «أجملي» معنى «اجعلي جميلًا». والألف في آخره للإطلاق."
  - "«إِنَّ الَّذِي تَحْذَرِينَ قَدْ وَقَعَا»: «الذي» اسم «إنّ»، وجملة «تحذرين» صلته، والعائد محذوف تقديره «تحذرينه». وجملة «قد وقعا» خبر «إنّ»، والألف للإطلاق. والجملة كلها تعليل للأمر قبلها."
morphology:
  - "«أَجْمِلِي» أمر من «أَجْمَلَ» على «أَفْعَلَ»، من الجمال."
  - "«جَزَعٌ» مصدر «جَزِعَ يَجْزَعُ» على «فَعَلٍ»، وهو قياس مصدر «فَعِلَ» اللازم."
  - "«تَحْذَرِينَ» مضارع «حَذِرَ يَحْذَرُ» على «فَعِلَ يَفْعَلُ»، مسند إلى ياء المخاطبة."
rhetoric:
  thesis: "رثاء يبدأ من داخل الشاعر: لا يقول «مات فضالة»، بل يخاطب نفسه الخائفة، ويخبرها أن ما كانت تخافه قد وقع، فينتقل بها من الخوف إلى الصبر في بيت واحد."
  devices:
    - title: "«أَيَّتُهَا النَّفْسُ»: خطاب النفس"
      text: "يجعل الشاعر نفسه شخصًا آخر يخاطبه ويأمره. وهذا ما يسميه البلاغيون التجريد: أن ينتزع المتكلم من نفسه شخصًا يخاطبه. فيصير الحزن حوارًا بين الشاعر ونفسه، ويصير الصبر أمرًا يصدره على نفسه، لا موعظة من غيره. وهي قراءتنا."
    - title: "«الَّذِي تَحْذَرِينَ»: كناية عن الموت"
      text: "لا يذكر الموت ولا اسم الميت، بل يشير إليه بما كانت النفس تحذره. والكناية عند عبد القاهر «أن يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود» [@dalail، ج1 ص66]. والخوف تالٍ للموت في نفس المحبّ، فدلّ به عليه. ويزيد الإبهامُ الفاجعةَ: كأن الشاعر لا يطيق أن يسمّي ما وقع."
    - title: "«أَجْمِلِي جَزَعَا»: جمع الجمال والجزع"
      text: "لم يقل «اصبري» ولا «لا تجزعي»، بل جعل الجزع نفسه موصوفًا بالجمال. فهو يأذن بالحزن، ويطلب أن يكون حزنًا كريمًا لا إفراط فيه. وبين أمر الصدر وخبر العجز تعليل: أجملي لأن ما تحذرين قد وقع، والحذر لا ينفع بعد الوقوع. وهي قراءتنا."
    - title: "التصريع"
      text: "«جَزَعَا» و«وَقَعَا»: اتفق آخر الصدر وآخر العجز في الوزن والرويّ، وهو التصريع، ويكون في المطالع غالبًا."
  connection: "ثم يسمّي ما وقع دون أن يسمّي صاحبه: «إِنَّ الَّذِي جَمَّعَ السَّمَاحَةَ وَالنَّجْدَةَ وَالحَزْمَ وَالقُوَى جُمَعَا»، ثم يخبر بموته في البيت الثالث: «أَوْدَى»."
prosody:
  meter: "البحر المنسرح"
  rhyme: "الرَّوِيّ العين المفتوحة تتبعها ألف الإطلاق"
  scansion: "أَيْيَتُهَنْ / نَفْسُأَجْمِ / لِيجَزَعَا = مستعلن / مفعلاتُ / مستعلن — إِنْنَلْلَذِي / تَحْذَرِينَ / قَدْوَقَعَا = مستفعلن / مفعلاتُ / مستعلن"
  note: "دخل الطيُّ، وهو حذف الرابع الساكن، «مستفعلن» الأولى في الصدر فصارت «مستعلن»، ودخل «مفعولات» في الشطرين فصارت «مفعلات». والطيّ في العروض والضرب لازم: «عروض المنسرح وضربه مستفعلن لا يستعملان صحيحين بل يدخلهما الطي» [@atiq، ص93]."
