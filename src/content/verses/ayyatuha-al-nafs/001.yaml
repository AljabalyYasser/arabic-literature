    note: "«تكرهين» مكان «تحذرين» [@aghani-dk، ج11 ص74] [@uyun-al-akhbar، ج2 ص208]. ورواية «تحذرين» عند المُبَرِّد وابن قُتَيْبة في «الشعر والشعراء» وابن عبد ربّه وابن رَشِيق."
