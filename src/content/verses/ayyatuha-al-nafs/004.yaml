first: "الأَلْمَعِيَّ الَّذِي يَظُنُّ بِكَ الـ"
second: "ـظَّنَّ كَأَنْ قَدْ رَأَى وَقَدْ سَمِعَا"
meaning: "أعني الذكيَّ الحادَّ الفطنة، الذي إذا ظنّ بك ظنًّا أصاب، حتى كأنه رأى ما ظنّه بعينه وسمعه بأذنه، فظنه عنده كاليقين."
vocabulary:
  - term: "الأَلْمَعِيَّ"
    text: "«الدَّاهي الَّذِي يَتَظَنَّنُ الأُمُور فَلَا يُخْطِئُ، وَقِيلَ: هُوَ الذَّكِيُّ المُتَوَقِّدُ الحدِيدُ اللسانِ والقَلْبِ» [@lisan، ج8 ص327]. وقال المُبَرِّد: «الحديد اللسان والقلب، وقد أبانه بقوله: الذي يظن بك الظن كأن قد رأى وقد سمعا» [@kamil، ج4 ص33]."
  - term: "يَظُنُّ بِكَ الظَّنَّ"
    text: "يحدس أمرك ويقدّره فيصيب."
context: "بعد أن أخبر بموته في البيت الثالث يأخذ في صفاته، وأولها العقل والفراسة. وصار البيت شاهدًا على الذكاء وصدق الظن: يذكره الجاحظ أول «باب في صدق الظنّ وجودة الفراسة» [@hayawan، ج3 ص27]، ويقول في موضع آخر: «ويمدحون بإصابة الظن ويذمون بخطئه. قال أوس بن حجر»، ثم ينشده [@bayan، ج3 ص288]. ويقول صاحب اللسان إن أوسًا «فَسَّرَهُ» أي فسّر معنى الألمعيّ بهذا البيت [@lisan، ج1 ص324]."
syntax:
  - "«الأَلْمَعِيَّ»: منصوب على المدح بفعل محذوف تقديره «أعني» أو «أمدح». وفي اللسان: «نَصَبَ الأَلمعِيَّ بِفِعْلٍ مُتَقَدِّمٍ» [@lisan، ج8 ص327]. ويُروى مرفوعًا «الأَلْمَعِيُّ» [@lisan، ج1 ص324] على أنه خبر لمبتدأ محذوف، أي: هو الألمعيّ. وكلاهما من قطع النعت عن منعوته للمدح."
  - "«الَّذِي يَظُنُّ بِكَ الظَّنَّ»: «الذي» نعت لـ«الألمعيّ»، وجملة «يظن» صلته، و«الظنَّ» مفعول مطلق، و«بك» متعلق بـ«يظنّ»."
  - "«كَأَنْ قَدْ رَأَى»: «كأنْ» مخففة من «كأنّ» واسمها ضمير شأن محذوف، وجملة «قد رأى» خبرها. وجملة «وقد سمعا» معطوفة عليها، والألف للإطلاق. والجملة كلها حال من فاعل «يظنّ»."
morphology:
  - "«الأَلْمَعِيّ» على «أَفْعَلِيّ»، والهمزة فيه زائدة، من «لَمَعَ»؛ وفي اللسان أنه «مأْخوذ مِنَ اللَّمْعِ، وَهُوَ الإِشارةُ الْخَفِيَّةُ وَالنَّظَرُ الخفِيُّ» [@lisan، ج8 ص327]."
  - "«الظَّنّ» مصدر «ظَنَّ يَظُنُّ» على «فَعْل»، و«يَظُنُّ» مضارع مضعّف أُدغم فيه المثلان."
rhetoric:
  thesis: "يمدح الميت بذكاء يسبق الخبر: ظنه يقوم مقام الرؤية والسماع. والبيت مبنيّ على كلمة غريبة في صدره يشرحها عجزه، فهو مدح وتعريف معًا."
  devices:
    - title: "الإيضاح بعد الإبهام في «الأَلْمَعِيَّ الَّذِي ...»"
      text: "يبدأ بكلمة غريبة «الألمعيّ»، ثم يفسرها بصلة الموصول. يقول المُبَرِّد: «وقد أبانه بقوله: الذي يظن بك الظن كأن قد رأى وقد سمعا» [@kamil، ج4 ص33]. فالسامع يتشوّق إلى معنى الكلمة، ثم يأتيه المعنى صورةً لا تعريفًا."
    - title: "«كَأَنْ قَدْ رَأَى وَقَدْ سَمِعَا»: التشبيه"
      text: "شبّه ظنّه بالعلم الذي يأتي من الحواس: كأنه رأى بعينه وسمع بأذنه. والمشبّه حال الظانّ، والمشبّه به حال الرائي السامع، ووجه الشبه الإصابة واليقين. وتكرار «قد» مع الفعلين يؤكد التحقق في كل منهما. وهي قراءتنا."
    - title: "قطع النعت للمدح"
      text: "نصب «الألمعيّ» وهو صفة للميت المذكور قبله، فقطعه عن إعراب ما قبله ليجعله مدحًا مستقلًّا، كأنه يقول: أمدح الألمعيّ. والقطع يُخرج الصفة من مجرد التعريف إلى الثناء."
  connection: "ثم يزيد في صفاته: «المُخْلِفَ المُتْلِفَ المُرَزَّأَ»."
prosody:
  meter: "البحر المنسرح"
  rhyme: "الرَّوِيّ العين المفتوحة تتبعها ألف الإطلاق"
  scansion: "أَلْأَلْمَعِيْ / يَلْلَذِييَ / ظُنْنُبِكَظْ = مستفعلن / مفعلاتُ / مستعلن — ظَنْنَكَأَنْ / قَدْرَأَىوَ / قَدْسَمِعَا = مستعلن / مفعلاتُ / مستعلن"
  note: "دخل الطيّ، وهو حذف الرابع الساكن، «مفعولات» في الشطرين فصارت «مفعلات»، وهو الأحسن فيها كما يقول العروضيون: «والأحسن في هذه التفعيلة أن تستعمل مطوية مفعلات» [@atiq، ص92]. ودخل «مستفعلن» الأولى في العجز فصارت «مستعلن». والكلمة «الظنّ» موزعة بين الشطرين، ولامها في الصدر وظاؤها المشددة في العجز، وهذا هو التدوير."
