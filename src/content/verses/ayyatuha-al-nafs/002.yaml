first: "إِنَّ الَّذِي جَمَّعَ السَّمَاحَةَ وَالـ"
second: "ـنَّجْدَةَ وَالحَزْمَ وَالقُوَى جُمَعَا"
vocabulary:
  - term: "السَّمَاحَةَ"
    text: "الجود والكرم."
  - term: "النَّجْدَةَ"
    text: "الشجاعة وإغاثة من يستغيث."
  - term: "وَالقُوَى جُمَعَا"
    text: "والقوى كلها؛ «جُمَع» توكيد بمعنى «جميعًا»، والألف للإطلاق."
