first: "المُخْلِفَ المُتْلِفَ المُرَزَّأَ لَمْ"
second: "يُمْتَعْ بِضَعْفٍ وَلَمْ يَمُتْ طَبِعَا"
meaning: "وأعني الذي يُتلف ماله في الكرم ثم يُخلف مكانه بشجاعته وغزوه، والذي يصيب الناسُ ماله بالسؤال فيعطيهم. لم يعمّر حتى يضعف ويُقعده الكبر، ولم يمت وفي خلقه دنس أو عيب."
vocabulary:
  - term: "المُخْلِفَ المُتْلِفَ"
    text: "قال المُبَرِّد: «أراد أنه يتلف ماله كرماً ويخلفه نجدة»، أي يعوّضه بالشجاعة [@kamil، ج4 ص33]."
  - term: "المُرَزَّأَ"
    text: "«الذي تناله الرزيئات في ماله لما يعطي ويسأل» [@kamil، ج4 ص33]، أي يكثر الناس سؤاله فيصيبون من ماله."
  - term: "لَمْ يُمْتَعْ بِضَعْفٍ"
    text: "قال المُبَرِّد: «والإمتاع: الإقامة، فيقول: لم يقم وهو ضعيف» [@kamil، ج4 ص33]، أي لم يطل عمره حتى يضعف."
  - term: "طَبِعَا"
    text: "«والطبع: أسوأ الطمع، وأصله أن القلب يعتاد الخلة الدنيئة فتركبه»، وأصله في السيف يركبه الصدأ [@kamil، ج4 ص33]. والطَّبِع: الدنِس الخُلق."
context: "يتمّ صفات الميت بعد «الألمعيّ»: الكرم الذي لا يبقي مالًا، والشجاعة التي تعوّضه، ثم موتٌ في تمام القوة والشرف. وهو في رواية «الأغاني» البيت الثالث، قبل «أودى» [@aghani-dk، ج11 ص74]، وبه تتمّ صفات «الذي» قبل الخبر عن موته."
syntax:
  - "«المُخْلِفَ المُتْلِفَ المُرَزَّأَ»: منصوبة على المدح كـ«الألمعيّ» قبلها، أي: أعني المخلف المتلف المرزأ. وتعدّد الصفات بلا عاطف لأنها لموصوف واحد. وفي رواية «الأغاني» تأتي قبل «أودى»، فتكون نعوتًا لـ«الذي» اسم «إنّ» في البيت الثاني."
  - "«لَمْ يُمْتَعْ بِضَعْفٍ»: «لم» حرف جزم، و«يُمْتَعْ» مضارع مجزوم مبني للمجهول، ونائب فاعله ضمير الميت، و«بضعف» متعلق به. والجملة حال من الموصوف، أو صفة على المعنى."
  - "«وَلَمْ يَمُتْ طَبِعَا»: «يَمُتْ» مضارع مجزوم بـ«لم» وحذفت عينه لالتقاء الساكنين، و«طبعًا» حال منصوبة، والألف للإطلاق."
morphology:
  - "«المُخْلِف» اسم فاعل من «أَخْلَفَ» على «مُفْعِل»، و«المُتْلِف» اسم فاعل من «أَتْلَفَ» على «مُفْعِل»: وزنان متوازيان من مادتين متقابلتين."
  - "«المُرَزَّأ» اسم مفعول من «رَزَّأَ» المضعّف على «مُفَعَّل»، والتضعيف للتكثير: كثرت رزايا ماله."
  - "«يُمْتَعْ» مضارع «أُمْتِعَ» المبني للمجهول، من «أَمْتَعَ» على «أَفْعَلَ»."
  - "«طَبِع» صفة على «فَعِل» من «طَبِعَ يَطْبَعُ طَبَعًا»، إذا ركبه الدنس."
rhetoric:
  thesis: "بيت يعدّد الفضائل في صدره، وينفي النقائص في عجزه: كرم يُتلف المال، وشجاعة تُخلفه، وموت لا ضعف قبله ولا عار معه."
  devices:
    - title: "الطباق بين «المُخْلِفَ» و«المُتْلِفَ»"
      text: "الطباق: الجمع بين معنيين متضادين. فالإتلاف ذهاب المال والإخلاف عودته، ويجمعهما الشاعر في رجل واحد: يُفني المال بكرمه ويعيده بسيفه. واتفق اللفظان في الوزن وتقاربا في الحروف، فاجتمع فيهما الطباق والجناس الناقص."
    - title: "تتابع الصفات بلا عطف"
      text: "«المخلف المتلف المرزأ»: ثلاث صفات متتابعة بلا واو، كأنها صفة واحدة ذات وجوه. وترك العطف يجعلها متلازمة في الميت لا تنفك إحداها عن الأخرى. وهي قراءتنا."
    - title: "«لَمْ يُمْتَعْ بِضَعْفٍ وَلَمْ يَمُتْ طَبِعَا»: المدح بالنفي"
      text: "يمدح بنفي نقيصتين: لم يعش حتى يذل بالضعف، ولم يمت وفي خلقه دنس. والطَّبَع في أصله صدأ يعلو السيف، فإذا قيل للرجل «طَبِع» فهو مستعار من صدأ السيف لدنس الخلق، كما يقول المُبَرِّد: «وهذا مثل وأصله في السيف وما أشبه» [@kamil، ج4 ص33]. فكأنه يقول: مات سيفًا لم يعلُه صدأ."
  connection: "ثم يذكر أعظم صنائعه: قيامه بالناس في سنة الجدب، «وَالحَافِظَ النَّاسَ فِي تَحُوطَ»."
prosody:
  meter: "البحر المنسرح"
  rhyme: "الرَّوِيّ العين المفتوحة تتبعها ألف الإطلاق"
  scansion: "أَلْمُخْلِفَلْ / مُتْلِفَلْمُ / رَزْزَأَلَمْ = مستفعلن / مفعلاتُ / مستعلن — يُمْتَعْبِضَعْ / فِنْوَلَمْيَ / مُتْطَبِعَا = مستفعلن / مفعلاتُ / مستعلن"
  note: "دخل الطيّ «مفعولات» في الشطرين فصارت «مفعلات»، وهو الأحسن فيها [@atiq، ص92]، والعروض والضرب مطويان «مستعلن» كسائر القصيدة [@atiq، ص93]."
