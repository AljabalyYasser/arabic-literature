explained: false
first: "وَعَزَّتِ الشَّمْأَلُ الرِّيَاحَ وَقَدْ"
second: "أَمْسَى كَمِيعُ الفَتَاةِ مُلْتَفِعَا"
vocabulary:
  - term: "وَعَزَّتِ الشَّمْأَلُ الرِّيَاحَ"
    text: "غلبت ريحُ الشمال الرياحَ. قال المُبَرِّد: «يقول: غلبتها، وتلك علامة الجدب … وذهاب الأمطار» [@kamil، ج4 ص33–34]."
  - term: "كَمِيعُ الفَتَاةِ"
    text: "«فالكميع الضجيع» [@kamil، ج4 ص34]، أي زوجها الذي يضاجعها."
  - term: "مُلْتَفِعَا"
    text: "«يقال: تلفع في مطرفه وفي كسائه، إذا تلفف وتزمل فيه، فيقول: من شدة الصر يلتفع به دون ضجيعه» [@kamil، ج4 ص34]. والصِّرّ: البرد الشديد."
