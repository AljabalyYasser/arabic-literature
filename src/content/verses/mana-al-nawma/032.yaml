first: "غَيْرَ مَا طَيَّرَتْ بِأَوْبَارِهَا الْفَقْـ"
second: "ـرَةُ فِي حَيْثُ يَسْتَهِلُّ الْغَمَامُ"
vocabulary:
  - term: "الْفَقْرَةُ"
    text: "يقول محققا «الأصمعيات»: «نبت» [@asmaiyyat، ص188، الحاشية]. ويقولان: «يريد أنها سمنت من رعى هذا النبت فطارت عنها أوبارها»."
  - term: "يَسْتَهِلُّ الْغَمَامُ"
    text: "ينصبّ مطر السحاب."
