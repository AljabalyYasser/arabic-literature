explained: false
first: "سَمِنَتْ فَاسْتَحَشَّ أَكْرُعُهَا لَا النْـ"
second: "ـنِيُّ نِيٌّ وَلَا السَّنَامُ سَنَامُ"
vocabulary:
  - term: "فَاسْتَحَشَّ أَكْرُعُهَا"
    text: "دقّت قوائمها في العين من كثرة لحمها. وفي اللسان: «وأَحَشَّ الشحمُ العظمَ فاستحشَّ: أَدَقَّه فاستدقَّ»، ثم: «وقيل: ليس ذلك لأَن العظام تدق بالشحم ولكن إِذا سمنت دقت عند ذلك فيما يرى» [@lisan، ج6 ص284]."
  - term: "النِّيُّ"
    text: "يقول محققا «الأصمعيات»: «الشحم» [@asmaiyyat، ص188، الحاشية]."
