explained: false
first: "وَأَتَانِي تَقْحِيمُ كَعْبٍ لِيَ الْمَنْـ"
second: "ـطِقَ إِنَّ النَّكِيثَةَ الْإِقْحَامُ"
vocabulary:
  - term: "تَقْحِيمُ"
    text: "يقول محققا «الأصمعيات»: «أن يجعله يقحم، أى يدخل فى الأمر فجأة بغير روية» [@asmaiyyat، ص186، الحاشية]."
  - term: "كَعْبٍ"
    text: "يقول محققا «الأصمعيات»: «هو ابن مامة الإيادى» [@asmaiyyat، ص186، الحاشية]، ويجعله ابن قُتَيْبة كذلك [@ibn-qutayba، ج1 ص231]."
  - term: "النَّكِيثَةَ"
    text: "يقول محققا «الأصمعيات»: «الخطة الصعبة» [@asmaiyyat، ص186، الحاشية]."
