explained: false
first: "لَجِبٌ تُسْمَعُ الصَّوَاهِلُ فِيهِ"
second: "وَحَنِينُ اللِّقَاحِ وَالْإِرْزَامُ"
vocabulary:
  - term: "لَجِبٌ"
    text: "يقول محققا «الأصمعيات»: «يريد عسكرا لجبا، وهو العرمرم ذو اللجب والكثرة، واللجب: الصوت والصياح» [@asmaiyyat، ص189، الحاشية]."
  - term: "اللِّقَاحِ"
    text: "يقول محققا «الأصمعيات»: «جمع لقحة، وهى ذوات الألبان من الإبل» [@asmaiyyat، ص189، الحاشية]."
  - term: "الْإِرْزَامُ"
    text: "يقول محققا «الأصمعيات»: «صوت تخرجه الناقة من حلقها لا تفتح به فاها» [@asmaiyyat، ص189، الحاشية]."
