explained: false
first: "مَنْ يَنَمْ لَيْلُهُ فَقَدْ أُعْمِلُ اللَّيْـ"
second: "ـلَ وَذُو الْبَثِّ سَاهِرٌ مُسْتَهَامُ"
vocabulary:
  - term: "أُعْمِلُ اللَّيْلَ"
    text: "يقول محققا «الأصمعيات»: «أحث المطى وأسوقها فى الليل» [@asmaiyyat، ص185، الحاشية]."
  - term: "الْبَثِّ"
    text: "يقول محققا «الأصمعيات»: «الحزن والغم» [@asmaiyyat، ص185، الحاشية]."
  - term: "مُسْتَهَامُ"
    text: "يقول محققا «الأصمعيات»: «ذاهب اللب» [@asmaiyyat، ص185، الحاشية]."
  - term: "مَنْ يَنَمْ لَيْلُهُ"
    text: "من نام ليلُه، أي من قضى ليله نائمًا، كما يقال: ليلٌ نائم."
