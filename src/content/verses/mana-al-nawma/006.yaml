explained: false
first: "يَكْتَبِينَ الْيَنْجُوجَ فِي كُبَّةِ الْمَشْـ"
second: "ـتَى وَبُلْهٌ أَحْلَامُهُنَّ وِسَامُ"
vocabulary:
  - term: "يَكْتَبِينَ"
    text: "يقول محققا «الأصمعيات»: «يتبخرن بالكباء، بكسر الكاف وتخفيف الباء، وهو العود» [@asmaiyyat، ص186، الحاشية]."
  - term: "الْيَنْجُوجَ"
    text: "يقول محققا «الأصمعيات»: «العود» [@asmaiyyat، ص186، الحاشية]."
  - term: "كُبَّةِ الْمَشْتَى"
    text: "يقول محققا «الأصمعيات»: «شدة الشتاء ومعظمه» [@asmaiyyat، ص186، الحاشية]."
  - term: "بُلْهٌ أَحْلَامُهُنَّ"
    text: "يقول محققا «الأصمعيات»: «غافلات عن الخنا والخب» [@asmaiyyat، ص186، الحاشية]."
  - term: "وِسَامُ"
    text: "يقول محققا «الأصمعيات»: «جمع وسيمة، وهى الثابتة الحسن، كأنها قد وسمت» [@asmaiyyat، ص186، الحاشية]."
