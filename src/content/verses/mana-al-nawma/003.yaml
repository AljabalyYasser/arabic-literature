explained: false
first: "هَلْ تَرَى مِنْ ظَعَائِنٍ بَاكِرَاتٍ"
second: "كَالْعَدَوْلِيِّ سَيْرُهُنَّ انْقِحَامُ"
vocabulary:
  - term: "ظَعَائِنٍ"
    text: "يقول محققا «الأصمعيات»: «الإبل عليها هوادج النساء» [@asmaiyyat، ص186، الحاشية]."
  - term: "كَالْعَدَوْلِيِّ"
    text: "يقول محققا «الأصمعيات»: «السفين المنسوب إلى «عدولى» وهى قرية بالبحرين تنسب إليها السفن» [@asmaiyyat، ص186، الحاشية]."
  - term: "انْقِحَامُ"
    text: "يقول محققا «الأصمعيات»: «أن يقتحم منزلا بعد منزل يطويه» [@asmaiyyat، ص186، الحاشية]."
