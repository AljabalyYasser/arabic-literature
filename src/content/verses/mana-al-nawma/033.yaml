explained: false
first: "فَهْيَ مَا إِنْ تُبِينُ مِنْ سَلَفٍ أَرْـ"
second: "ـعَنَ طَوْدٍ لِسِرْبِهِ قُدَّامُ"
vocabulary:
  - term: "سَلَفٍ"
    text: "يقول محققا «الأصمعيات»: «المتقدم، أراد به هنا المتقدم من الجبل» [@asmaiyyat، ص189، الحاشية]."
  - term: "أَرْعَنَ"
    text: "يقول محققا «الأصمعيات»: «الجبل الذى له رعن، بسكون العين، وهو الأنف العظيم من الجبل تراه متقدما» [@asmaiyyat، ص189، الحاشية]."
  - term: "طَوْدٍ"
    text: "جبل عظيم."
  - term: "لِسِرْبِهِ"
    text: "يقول محققا «الأصمعيات»: «السرب، بكسر السين وفتحها: الطريق» [@asmaiyyat، ص189، الحاشية]. ويقولان: «يريد أن هذه الإبل لعظمها تستر الجبل»."
