explained: false
first: "مُكْفَهِرٌّ عَلَى حَوَاجِبِهِ يَغْـ"
second: "ـرَقُ فِي جَمْعِهِ الْخَمِيسُ اللُّهَامُ"
vocabulary:
  - term: "مُكْفَهِرٌّ"
    text: "يقول محققا «الأصمعيات»: «يضرب لونه إلى الغبرة» [@asmaiyyat، ص189، الحاشية]."
  - term: "حَوَاجِبِهِ"
    text: "يقول محققا «الأصمعيات»: «نواحيه وحروفه» [@asmaiyyat، ص189، الحاشية]."
  - term: "الْخَمِيسُ اللُّهَامُ"
    text: "يقول محققا «الأصمعيات»: «الخميس: الجيش. اللهام: الجيش الكثير، كأنه يلتهم كل شىء» [@asmaiyyat، ص189، الحاشية]."
