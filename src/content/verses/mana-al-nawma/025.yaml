explained: false
first: "إِبِلِي الْإِبْلُ لَا يُحَوِّزُهَا الرَّاـ"
second: "ـعُونَ مَجُّ النَّدَى عَلَيْهَا الْمُدَامُ"
vocabulary:
  - term: "لَا يُحَوِّزُهَا"
    text: "يقول محققا «الأصمعيات»: «لا يجمعها، وفى الشنقيطية «أى لكثرتها تبقى فى البرية»» [@asmaiyyat، ص188، الحاشية]. والشنقيطية نسخة الشِّنْقِيطيّ من «الأصمعيات»."
  - term: "مَجُّ النَّدَى"
    text: "يقول محققا «الأصمعيات»: «ما يمجه، يريد ماءه» [@asmaiyyat، ص188، الحاشية]."
  - term: "الْمُدَامُ"
    text: "ينقل محققا «الأصمعيات» عن الشنقيطية: «الذى يدوم» [@asmaiyyat، ص188، الحاشية]."
