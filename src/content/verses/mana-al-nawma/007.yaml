first: "وَيَصُنَّ الْوُجُوهَ فِي الْمَيْسَنَانِيْـ"
second: "ـيِ كَمَا صَانَ قَرْنَ شَمْسٍ غَمَامُ"
vocabulary:
  - term: "الْمَيْسَنَانِيِّ"
    text: "يقول محققا «الأصمعيات»: «ضرب من الثياب، نسبة على غير قياس إلى «ميسان» وهى كورة بين البصرة وواسط» [@asmaiyyat، ص186، الحاشية]."
  - term: "قَرْنَ شَمْسٍ"
    text: "أول ما يطلع منها."
