first: "فِي نِظَامٍ مَا كُنْتُ فِيهِ فَلَا يَحْـ"
second: "ـزُنْكَ شَيْءٌ لِكُلِّ حَسْنَاءَ ذَامُ"
vocabulary:
  - term: "فِي نِظَامٍ مَا كُنْتُ فِيهِ"
    text: "ينقل محققا «الأصمعيات» عن العَيْني: «يعنى رمانى بأمر ما كنت فى جنسه، يقال: فلان فى ذلك النظام، أى فى تلك الطريقة» [@asmaiyyat، ص186–187، الحاشية]."
  - term: "ذَامُ"
    text: "يقول محققا «الأصمعيات»: «عيب» [@asmaiyyat، ص187، الحاشية]."
