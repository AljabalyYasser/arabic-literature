first: "وَشَبَابٌ كَأَنَّهُمْ أُسْدُ غِيلٍ"
second: "خَالَطَتْ فَرْطَ حَدِّهِمْ أَحْلَامُ"
vocabulary:
  - term: "غِيلٍ"
    text: "يقول محققا «الأصمعيات»: «الأجمة، وهى الشجر الكثير الملتف» [@asmaiyyat، ص187، الحاشية]."
  - term: "فَرْطَ حَدِّهِمْ"
    text: "يقول محققا «الأصمعيات»: «الحد: الحدة والغضب، وفرطها: غلبتها وإسرافها» [@asmaiyyat، ص187، الحاشية]."
