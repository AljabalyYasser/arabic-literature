explained: false
first: "نَخَلَاتٌ مِنْ نَخْلِ بَيْسَانَ أَيْنَعْـ"
second: "ـنَ جَمِيعًا وَنَبْتُهُنَّ تُؤَامُ"
vocabulary:
  - term: "بَيْسَانَ"
    text: "يقول محققا «الأصمعيات»: «موضع بالأردن» [@asmaiyyat، ص186، الحاشية]. ويروي ياقوت عن الزُّبَيْر أن بَيْسان «أيضا موضع معروف بأرض اليمامة»، ثم يقول: «والذي أراه أن هذا الموضع هو الموصوف بكثرة النخل»، لأن من وصفها بكثرة النخل احتجّ ببيت أبي دُؤاد هذا، و«لم تكن الشام منازل إياد» [@yaqut-buldan، ج1 ص527]."
  - term: "أَيْنَعْنَ"
    text: "نضج ثمرهن."
  - term: "تُؤَامُ"
    text: "يقول محققا «الأصمعيات»: «جمع توأم، وهو من الجمع العزيز» [@asmaiyyat، ص186، الحاشية]. ويقولان: «شبه الظعائن بالنخل»."
