explained: false
first: "سُلِّطَ الدَّهْرُ وَالْمَنُونُ عَلَيْهِمْ"
second: "فَلَهُمْ فِي صَدَى الْمَقَابِرِ هَامُ"
vocabulary:
  - term: "الْمَنُونُ"
    text: "الموت."
  - term: "صَدَى ... هَامُ"
    text: "يقول محققا «الأصمعيات»: «الهام: جمع هامة، وكانوا يزعمون أن عظام الميت، وقيل روحه، تصير هامة فتطير، ويسمونه الصدى، فنفاه الإسلام ونهاهم عنه» [@asmaiyyat، ص187، الحاشية]."
