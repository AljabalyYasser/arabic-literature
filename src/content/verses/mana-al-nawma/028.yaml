first: "فَإِذَا أَقْبَلَتْ تَقُولُ إِكَامٌ"
second: "مُشْرِفَاتٌ فَوْقَ الْإِكَامِ إِكَامُ"
meaning: "إذا أقبلت إبله نحوك حسبتها من ضخامتها إِكامًا، أي تلالًا، عالية مرتفعة، فوق كل تلّة منها تلّة أخرى: الظهر تلّ، والسنام فوقه تلّ. و«تقول» هنا بمعنى تظنّ وتحسب: ما يقوله الرائي حين يراها. ويروي ابن قُتَيْبة هذا البيت في الأبيات التي «يستجاد» فيها «قوله فى صفة إبله» [@ibn-qutayba، ج1 ص232–233]."
vocabulary:
  - term: "إِكَامٌ"
    text: "جمع أَكَمَة، وهي التلّ. وفي اللسان: «الأَكَمَةُ تَلٌّ مِنَ القُفِّ وَهُوَ حَجر واحد»، و«جَمْعُ الأَكَمِ إِكامٌ مِثْلُ جَبَلٍ وجِبالٍ» [@lisan، ج12 ص20]. والقُفّ: ما ارتفع من الأرض وغلظ."
  - term: "مُشْرِفَاتٌ"
    text: "عاليات مرتفعات، من أشرف المكانُ إذا علا."
  - term: "أَقْبَلَتْ"
    text: "جاءت نحوك بوجوهها، وضدّه أدبرت وأعرضت."
context: "من صفة الإبل (25–32). وهو أول ثلاثة أبيات يصفها فيها من ثلاث جهات: مقبلةً كالإِكام (28)، ومُعرضةً كالقصور (29)، وفي بطن الوادي كالنخل قد حان قطاف ثمره (30). وقبلها أنها سمنت حتى دقّت قوائمها في العين (27)، وبعدها أنها كالبيض في الصيانة والملاسة (31). فصفة الإبل كلها صفة غنى، وهي جواب البيت الخامس عشر: المال عنده موفور، والفقر فقد الرجال."
syntax:
  - "«فَإِذَا أَقْبَلَتْ»: الفاء استئنافية، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط، و«أقبلت» فعل الشرط، وفاعله ضمير مستتر يعود على الإبل."
  - "«تَقُولُ إِكَامٌ»: جملة «تقول» جواب الشرط لا محل لها، وفاعلها ضمير المخاطب، والخطاب لكل من يراها. و«إكامٌ» خبر لمبتدأ محذوف تقديره «هي»، والجملة الاسمية في محل نصب مقول القول. ولم تعمل «تقول» عمل «تظنّ» فتنصب «إكامًا»، بل حُكي ما يقوله الرائي كما ينطقه."
  - "«مُشْرِفَاتٌ»: نعت لـ«إكام» مرفوع."
  - "«فَوْقَ الْإِكَامِ إِكَامُ»: «فوقَ» ظرف منصوب متعلق بمحذوف خبر مقدّم، و«الإكامِ» مضاف إليه، و«إكامُ» مبتدأ مؤخر، والجملة في محل رفع نعت ثان لـ«إكام» الأولى."
morphology:
  - "«إِكَام» جمع «أَكَم» على «فِعال»، و«أَكَم» جمع «أَكَمَة»، فهو جمع الجمع، كما في اللسان: «جَمْعُ الأَكَمِ إِكامٌ» [@lisan، ج12 ص20]."
  - "«مُشْرِفات» جمع «مُشْرِفة»، اسم فاعل من «أَشْرَفَ» على «أَفْعَلَ»."
  - "«أَقْبَلَتْ» ماض على «أَفْعَلَ»، والتاء للتأنيث لأن الفاعل ضمير الإبل، والإبل مؤنثة."
rhetoric:
  thesis: "تشبيه الإبل بالتلال في الحجم والارتفاع، ثم مضاعفة الصورة: تلّ فوق تلّ، أي سنام فوق ظهر."
  devices:
    - title: "التشبيه المحذوف الأداة في «تَقُولُ إِكَامٌ»"
      text: "لم يقل «كأنها إكام»، بل نقل ما ينطق به الرائي إذا رآها: «إكامٌ»، فحذف الأداة ووجه الشبه، وجعل المشبَّه به خبرًا عن الإبل، حتى كأن الرائي يخطئ فيحسبها تلالًا. والشبه في الشكل والحجم والارتفاع، فهو عند عبد القاهر الجُرْجانيّ من الضرب الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "التكرار في «إِكَامٌ ... الْإِكَامِ إِكَامُ»"
      text: "ذكر الكلمة ثلاث مرات في بيت واحد، فصارت الصورة طبقات: إكام، فوقها إكام. والتكرار هنا يرسم تراكب السنام على الظهر، وكثرة الإبل بعضها وراء بعض. وهذه قراءتنا."
    - title: "التقسيم بين هذا البيت وما بعده"
      text: "«فَإِذَا أَقْبَلَتْ ... وَإِذَا أَعْرَضَتْ ... وَإِذَا مَا فَجِئْتَهَا»: يقسم أحوال الرؤية ويعطي كل حال صورة: الإكام، ثم القصور، ثم النخل. وهذه قراءتنا."
  connection: "ثم يصفها من جنبها: «وَإِذَا أَعْرَضَتْ تَقُولُ قُصُورٌ / مِنْ سَمَاهِيجَ فَوْقَهَا آطَامُ»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَإِذَاأَقْ / بَلَتْ تَقُو / لُإِكَامُنْ = فعلاتن / متفعلن / فعلاتن — مُشْرِفَاتُنْ / فَوْقَلْإِكَا / مِإِكَامُو = فاعلاتن / مستفعلن / فعلاتن"
  note: "دخل الخَبْن، وهو حذف الثاني الساكن، تفعيلات الصدر الثلاث، فصارت «فعلاتن / متفع لن / فعلاتن»، ودخل الضربَ فصار «فعلاتن» [@atiq، ص98]. وأُشبعت ضمة الميم في القافية «إكامُ» فنُطقت «إكامو»."
variants:
  - reading: "مُشْرِفَاتٌ بَيْنَ الْإِكَامِ إِكَامُ"
    status: "رواية ابن قُتَيْبة"
    note: "[@ibn-qutayba، ج1 ص233]. والمعنى على روايته أنها تلال بين التلال، فالصورة صورة كثرة لا صورة ارتفاع."
