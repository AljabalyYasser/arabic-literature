first: "مَنَعَ النَّوْمَ مَاوِيَ التَّهْمَامُ"
second: "وَجَدِيرٌ بِالْهَمِّ مَنْ لَا يَنَامُ"
meaning: "يخاطب امرأة اسمها ماويّة: منعني الهمُّ الكثير المتردّد من النوم. ثم يقول قولًا عامًّا: إن الذي لا ينام حقيق بأن يكون مهمومًا، أي إن السهر نفسه علامة الهمّ. ويقول محققا «الأصمعيات» في القصيدة كلها: «بث همه وما يعانى فى ليله، ثم تخيل ظعائن الحبيبة وصواحباتها» [@asmaiyyat، ص185، الحاشية]. ولا يسمّي الشاعر هنا سبب همّه، ثم يكشفه في البيت الخامس عشر: فقدُ رجال قومه."
vocabulary:
  - term: "مَاوِيَ"
    text: "يقول محققا «الأصمعيات»: «أراد: يا ماوية» [@asmaiyyat، ص185، الحاشية]. وماويّة اسم امرأة."
  - term: "التَّهْمَامُ"
    text: "يقول محققا «الأصمعيات»: «الهم، وهو «تفعال» منه، بناء موضوع للتكثير» [@asmaiyyat، ص185، الحاشية]، أي الهمّ الكثير المتكرر."
  - term: "جَدِيرٌ"
    text: "حقيق وخليق."
context: "مطلع القصيدة. يبدأ بليلة السهر، ومنها يخرج إلى ما يعرض له في ليله: ظعائن الحبيبة (3–10)، ثم عتاب ابن عمه كعب (11–14)، ثم رثاء رجال قومه (15–24). فالهمّ الذي في المطلع يجمع القصيدة كلها. وابن قُتَيْبة لا يروي المطلع، ويبدأ من عتاب كعب [@ibn-qutayba، ج1 ص231]."
syntax:
  - "«مَنَعَ النَّوْمَ ... التَّهْمَامُ»: «منع» فعل ماض، و«النومَ» مفعول به مقدّم، و«التهمامُ» فاعل مؤخّر مرفوع. والمفعول الآخر محذوف يدل عليه المقام، أي: منعني النومَ."
  - "«مَاوِيَ»: منادى مرخّم بحذف حرف النداء، أصله «يا ماويّةُ»، فحُذفت التاء للترخيم، وبقيت الياء مفتوحة على حالها قبل الحذف، على لغة من ينتظر المحذوف. وجملة النداء معترضة بين الفاعل والمفعول."
  - "«وَجَدِيرٌ بِالْهَمِّ مَنْ لَا يَنَامُ»: الواو استئنافية، و«جديرٌ» خبر مقدّم، و«بالهمّ» جار ومجرور متعلق بـ«جدير»، و«مَنْ» اسم موصول في محل رفع مبتدأ مؤخّر، وجملة «لا ينام» صلة الموصول لا محل لها."
morphology:
  - "«التَّهْمَام» مصدر على «تَفْعال» بفتح التاء من «همّ»، وهو بناء يدل على الكثرة والتكرار، ومثله التَّذْكار والتَّرْداد. وعلى هذا يفسّره محققا «الأصمعيات»: «بناء موضوع للتكثير» [@asmaiyyat، ص185، الحاشية]."
  - "«جَدِير» صفة مشبهة على «فَعِيل» من «جَدُرَ»."
  - "«يَنَام» مضارع «نامَ»، أصله «يَنْوَمُ»، نُقلت فتحة الواو إلى النون الساكنة قبلها، ثم قُلبت الواو ألفًا."
rhetoric:
  thesis: "مطلع يجمع الخبر والحكمة: الشطر الأول خبر عن حاله، والثاني حكم عام يصدق عليه وعلى كل ساهر."
  devices:
    - title: "التقديم والتأخير في «مَنَعَ النَّوْمَ ... التَّهْمَامُ»"
      text: "قدّم المفعول «النوم» وأخّر الفاعل «التهمام» إلى آخر الشطر، فبدأ بما فقده، وختم الشطر بسببه. وفي التقديم يقول عبد القاهر الجُرْجانيّ: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]، والنوم المفقود هو ما يشغل الساهر."
    - title: "ردّ العجز على الصدر في «النَّوْمَ ... يَنَامُ»"
      text: "جاءت كلمة القافية «ينام» من مادة كلمة في وسط الصدر «النوم»، فعاد آخر البيت على أوله. وهو عند أبي هلال العَسْكَرِيّ من ردّ الأعجاز على الصدور، في قسم «ما يكون فى حشو الكلام فى فاصلته» [@sinaatayn، ص386]، أي ما تتكرر فيه كلمة من داخل البيت في قافيته."
    - title: "الحكمة في الشطر الثاني"
      text: "«وَجَدِيرٌ بِالْهَمِّ مَنْ لَا يَنَامُ» قول عام يصلح أن يُتمثّل به وحده، وهو يقلب الشطر الأول: هناك الهمّ يمنع النوم، وهنا فقد النوم دليل على الهمّ. وهذه قراءتنا."
    - title: "التصريع"
      text: "«التَّهْمَامُ ... يَنَامُ»: جعل آخر الصدر على قافية آخر البيت، كما يُصنع في المطالع. والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]."
  connection: "ثم يفصّل حال الساهر: «مَنْ يَنَمْ لَيْلُهُ فَقَدْ أُعْمِلُ اللَّيْـ / ـلَ»، أي من نام في ليله فأنا أقطع الليل سائرًا."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الميم المضمومة، والبيت مصرّع"
  scansion: "مَنَعَنْنَوْ / مَمَاوِيَتْ / تَهْمَامُو = فعلاتن / متفعلن / فالاتن — وَجَدِيرُنْ / بِلْهَمْمِمَنْ / لَايَنَامُو = فعلاتن / مستفعلن / فاعلاتن"
  note: "وزن الخفيف «فاعلاتن مستفع لن فاعلاتن» في كل شطر. ودخل الخَبْن، وهو حذف الثاني الساكن، «فاعلاتن» الأولى في الشطرين فصارت «فعلاتن»، و«مستفع لن» في الصدر فصارت «متفع لن» [@atiq، ص98]. ودخل العروضَ التشعيثُ، وهو «حذف العين من فاعلاتن» [@atiq، ص98]، فصارت «فالاتن»، وأكثر ما يكون في «تفعيلة الضرب» [@atiq، ص99]. وأُشبعت ضمة الميم في «التهمامُ» و«ينامُ» فنُطقتا «التهمامو» و«ينامو»."
