first: "وَهْيَ كَالْبَيْضِ فِي الْأَدَاحِيِّ مَا يُوـ"
second: "ـهَبُ مِنْهَا لِمُسْتَتِمٍّ عِصَامُ"
vocabulary:
  - term: "الْأَدَاحِيِّ"
    text: "يقول محققا «الأصمعيات»: «جمع أدحى، وهو الموضع الذى تبيض فيه النعامة» [@asmaiyyat، ص188، الحاشية]."
  - term: "لِمُسْتَتِمٍّ ... عِصَامُ"
    text: "في اللسان: «والمستتم فى شعر أَبي دواد: هو الذي يطلب الصوف والوبر ليتم به نسج كسائه»، و«العصام: خيط القربة» [@lisan، ج12 ص68–69]. والمعنى عنده: «أي هذه الإبل كالبيض في الصيانة، وقيل في الملاسة، لا يوهب منها لمستتم أَي لا يوجد فيها ما يوهب لأَنها قد سمنت وأَلقت أَوبارها» [@lisan، ج12 ص69]."
