first: "لَا أَعُدُّ الْإِقْتَارَ عُدْمًا وَلَكِنْ"
second: "فَقْدُ مَنْ قَدْ رُزِئْتُهُ الْإِعْدَامُ"
meaning: "لا أعدّ قلة المال فقرًا، وإنما الفقر الحقّ أن أفقد من فقدتُ من رجال قومي. فالمال يذهب ويعود، والرجال إذا ماتوا لا يُعوَّضون. ثم يقول في البيتين التاليين من هم: رجال من الأقارب ماتوا، من حُذاقة، رؤوس عظام، فيهم الأناة مع الموافق، والشدة حين تراد الشدة."
vocabulary:
  - term: "الْإِقْتَارَ"
    text: "يقول محققا «الأصمعيات»: «قلة المال وضيق العيش» [@asmaiyyat، ص187، الحاشية]."
  - term: "عُدْمًا ... الْإِعْدَامُ"
    text: "يقول محققا «الأصمعيات»: «العدم والإعدام: الفقر» [@asmaiyyat، ص187، الحاشية]."
  - term: "رُزِئْتُهُ"
    text: "أُصبتُ به، أي فقدتُه. والرَّزِيّة: المصيبة."
context: "أول مقطع الرثاء (15–24)، وبه ينتقل من عتاب كعب إلى بكاء رجال قومه. وهو البيت الذي جعل به الحطيئة صاحبه أشعر الناس: كان عند سعيد بن العاص ليلة، فتذاكروا الشعراء، «فقالوا: فمن أشعر الناس؟ فقال الذى يقول»، ثم أنشده، «والشعر لأبى دواد الإيادى» [@aghani-dk، ج16 ص378–379]. ويرويه ابن قُتَيْبة: «وقيل للحطيئة من أشعر الناس؟ فقال: الذى يقول» [@ibn-qutayba، ج1 ص232]. ويجعله البغدادي من مرثية في كعب بن مامة: «ورثاه أبو داود بقصيدة منها» [@khizana، ج9 ص590]، ويقول محققا «الأصمعيات»: «وقد أخطأ صاحب الخزانة فى زعمه أن هذه القصيدة رثاء له فى كعب» [@asmaiyyat، ص185، الحاشية]، لأن القصيدة تعاتب كعبًا حيًّا (11–14) ثم ترثي رجالًا من حُذاقة."
syntax:
  - "«لَا أَعُدُّ الْإِقْتَارَ عُدْمًا»: «لا» نافية، و«أعدُّ» مضارع مرفوع، وفاعله ضمير مستتر تقديره «أنا»، و«الإقتارَ» مفعول به أول، و«عُدْمًا» مفعول به ثان، لأن «عدّ» هنا بمعنى ظنّ واعتقد. وفي هذا خلاف ينقله البغدادي عن ابن هشام: «اختلف فى تعدى عد. بمعنى اعتقد إلى مفعولين فمنعه قوم»، وزعموا في هذا البيت «أن عدماً حال»، ويقول ابن هشام: «وليس المعنى عليه» [@khizana، ج3 ص56–57]، أي إن الشاعر لا يريد: لا أعدّه في حال كونه فقرًا، بل يريد: لا أحسبه فقرًا."
  - "«وَلَكِنْ فَقْدُ مَنْ قَدْ رُزِئْتُهُ الْإِعْدَامُ»: «لكنْ» حرف استدراك مخفف لا عمل له، و«فقدُ» مبتدأ مرفوع مضاف، و«مَنْ» اسم موصول في محل جر بالإضافة، وجملة «قد رُزئتُه» صلته، و«الإعدامُ» خبر المبتدأ مرفوع."
  - "«رُزِئْتُهُ»: فعل ماض مبني للمجهول، والتاء ضمير المتكلم نائب فاعل، والهاء مفعول به ثان، وهي العائد على «مَن». يقال: رُزئ فلانٌ ولدَه، أي أصيب بفقده."
morphology:
  - "«الإِقْتار» مصدر «أَقْتَرَ» على «إِفْعال»، أي ضاق رزقه."
  - "«عُدْم» و«إِعْدام» من مادة واحدة (ع د م): الأول اسم على «فُعْل»، والثاني مصدر «أَعْدَمَ» على «إِفْعال»، أي صار ذا عُدْم."
  - "«رُزِئْتُ» ماض مبني للمجهول من «رَزَأَ»، وهو مهموز اللام، فظهرت الهمزة على الياء لانكسارها."
rhetoric:
  thesis: "حكمة تبدّل معنى الفقر: الفقر عنده ليس قلة المال، بل فقد الرجال. وبهذا المعنى المقلوب قدّمه الحطيئة."
  devices:
    - title: "النفي ثم الاستدراك في «لَا أَعُدُّ ... وَلَكِنْ»"
      text: "ينفي المعنى المعروف للفقر أولًا، ثم يثبت مكانه معنى آخر بـ«لكن»، فيقع المعنى الثاني في نفس السامع بعد أن أُبطل الأول. وهذه قراءتنا."
    - title: "قصر جنس المعنى في «فَقْدُ مَنْ قَدْ رُزِئْتُهُ الْإِعْدَامُ»"
      text: "جاء الخبر «الإعدامُ» معرّفًا بأل الجنس، فكأنه يقول: الفقر كله هو هذا، وما سواه ليس فقرًا. وهو الوجه الذي يقول فيه عبد القاهر الجُرْجانيّ: «أن تَقْصُرَ جنْسَ المعنَى على المُخْبَر عنه لقَصْدِك المبالغةَ»، فـ«تُخْرجُ الكلامَ في صورةٍ تُوهم أنَّ الجُودَ أو الشجاعةَ لم تُوجَدْ إلا فيه» [@dalail، ص179]."
    - title: "الجناس في «عُدْمًا ... الْإِعْدَامُ»"
      text: "كلمتان من مادة واحدة، الأولى في الصدر والثانية قافية البيت، فيعود آخر البيت على أوله بالمعنى نفسه بعد أن نُقل من المال إلى الرجال. ويقرب منهما في اللفظ «أَعُدُّ» في أول البيت. وهذه قراءتنا."
  connection: "ثم يبيّن من هم: «مِنْ رِجَالٍ مِنَ الْأَقَارِبِ فَادُوا / مِنْ حُذَاقٍ هُمُ الرُّؤُوسُ الْعِظَامُ»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "لَاأَعُدْدَلْ / إِقْتَارَعُدْ / مَنْوَلَاكِنْ = فاعلاتن / مستفعلن / فاعلاتن — فَقْدُمَنْقَدْ / رُزِئْتُهُلْ / إِعْدَامُو = فاعلاتن / متفعلن / فالاتن"
  note: "الصدر تامّ التفعيلات. ودخل الخَبْن، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن» [@atiq، ص98]، ودخل الضربَ التشعيثُ، وهو «حذف العين من فاعلاتن» [@atiq، ص98]، فصار «فالاتن». وأُشبعت ضمة الميم في القافية «الإعدامُ» فنُطقت «الإعدامو»."
