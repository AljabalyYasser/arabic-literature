explained: false
first: "وَتَدَلَّتْ عَلَى مَنَاهِلِ بُرْدٍ"
second: "وَفُلَيْجٌ مِنْ دُونِهَا وَسَنَامُ"
vocabulary:
  - term: "بُرْدٍ ... فُلَيْجٌ ... سَنَامُ"
    text: "يقول محققا «الأصمعيات»: «مواضع» [@asmaiyyat، ص186، الحاشية]. وعند ياقوت: «برد: قبيلة من إياد» [@yaqut-buldan، ج1 ص527]، فمناهل بُرْد مياه قبيلة من قوم الشاعر، و«فليج: واد يصبّ في فلج بين البصرة وضرية، وعليه يسلك من يريد اليمامة. وسنام: جبل لبني دارم بين البصرة واليمامة»، ويستدل بهما على أن إِيادًا كانت «بأطراف العراق» [@yaqut-buldan، ج1 ص528]."
