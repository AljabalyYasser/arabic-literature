explained: false
first: "وَاكِنَاتٍ يَقْضَمْنَ مِنْ قُضُبِ الضِّرْ"
second: "مِ وَيُشْفَى بِدَلِّهِنَّ الْهُيَامُ"
vocabulary:
  - term: "وَاكِنَاتٍ"
    text: "يقول محققا «الأصمعيات»: «جالسات مطمئنات» [@asmaiyyat، ص186، الحاشية]."
  - term: "يَقْضَمْنَ"
    text: "يقول محققا «الأصمعيات»: «من القضم، وهو الأكل بأطراف الأسنان والأضراس» [@asmaiyyat، ص186، الحاشية]."
  - term: "قُضُبِ الضِّرْمِ"
    text: "القُضُب جمع قضيب، والضِّرْم «شجر طيب الريح»، ويقول محققا «الأصمعيات»: «أراد بذلك السواك» [@asmaiyyat، ص186، الحاشية]."
  - term: "بِدَلِّهِنَّ"
    text: "الدَّلّ: تدلُّل المرأة وغنجها."
