explained: false
first: "بِعُرًى دُونَهَا وَتُقْرَنُ بِالْقَيْـ"
second: "ـظِ وَقَدْ دَلَّهَ الرِّبَاعَ الْبُغَامُ"
vocabulary:
  - term: "دَلَّهَ"
    text: "يقول محققا «الأصمعيات»: «أذهب فؤادها» [@asmaiyyat، ص189، الحاشية]."
  - term: "الرِّبَاعَ"
    text: "يقول محققا «الأصمعيات»: «جمع ربع، بضم الراء وفتح الباء، وهو الفصيل ينتج فى الربيع» [@asmaiyyat، ص189، الحاشية]."
  - term: "الْبُغَامُ"
    text: "يقول محققا «الأصمعيات»: «أن تقطع الناقة الحنين ولا تمده» [@asmaiyyat، ص189، الحاشية]."
