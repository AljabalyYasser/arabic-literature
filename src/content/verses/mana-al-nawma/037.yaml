first: "قَدْ تَصَعْلَكْنَ فِي الرَّبِيعِ وَقَدْ قَرْـ"
second: "ـرَعَ جِلْدَ الْفَرَائِضِ الْأَقْدَامُ"
meaning: "هذه الخيل ضمرت ودقّت في الربيع، وهو زمن يسمن فيه المال، وتساقط عنها شعرها، لأنها لا تُترك للمرعى بل تُركب للصيد والغارة؛ وقد أزالت أقدام الفرسان الشعر عن جلدها في الموضع الذي تقع عليه أقدامهم. قال الأَصْمَعِيّ: «تَصَعْلَكْن دَقَقْن وَطَارَ عِفاؤها عَنْهَا، وَالْفَرِيضَةُ مَوْضِعُ قَدَمِ الْفَارِسِ» [@lisan، ج10 ص456]. والعِفاء: الشعر والوبر. ويروي صاحب اللسان بعده قول شَمِر: «تَصَعْلَكَتِ الإِبل إِذَا دَقَّت قَوَائِمُهَا مِنَ السِّمن» [@lisan، ج10 ص456]، فعلى قوله تكون الخيل قد سمنت في الربيع حتى دقّت قوائمها في العين، كما قال في الإبل «سمنت فاستحش أكرعها» (27). وتفسير الأَصْمَعِيّ أقرب، لأن الشطر الثاني في أثر الركوب."
vocabulary:
  - term: "تَصَعْلَكْنَ"
    text: "دَقَقْن وتساقط شعرهن، كما يقول الأَصْمَعِيّ [@lisan، ج10 ص456]. والفعل من «الصُّعْلوك»، وهو الفقير."
  - term: "قَرَّعَ"
    text: "يقول محققا «الأصمعيات»: «التقريع: قص الشعر وإزالته» [@asmaiyyat، ص189، الحاشية]."
  - term: "الْفَرَائِضِ"
    text: "جمع فريضة، وهي «موضع قدم الفارس» [@lisan، ج10 ص456]، أي موضع ضرب الفارس جنب فرسه برجله."
context: "من آخر القصيدة (33–40)، حيث ينتقل من الإبل إلى الخيل والجيش. وقبله بيت ضمرها: «قَدْ بَرَاهُنَّ غِرَّةُ الصَّيْدِ وَالْإِعْـ / ـدَاءُ حَتَّى كَأَنَّهُنَّ جِلَامُ» (36)، أي أنحلها الصيد والعَدْو حتى صارت كالجِداء. وبعده قيامها على أطراف حوافرها وقد أفزعها الإسراج والإلجام (38). وهذا البيت من صنعة رجل «كان على خيل المنذر بن ماء السماء» [@aghani-dk، ج16 ص377]: لا يصف الفرس من بعيد، بل يصف أثر الركوب في جلده."
syntax:
  - "«قَدْ تَصَعْلَكْنَ»: «قد» حرف تحقيق، و«تصعلكن» فعل ماض مبني على السكون لاتصاله بنون النسوة، والنون فاعل، وتعود على الخيل."
  - "«فِي الرَّبِيعِ»: جار ومجرور متعلق بـ«تصعلكن»."
  - "«وَقَدْ قَرَّعَ جِلْدَ الْفَرَائِضِ الْأَقْدَامُ»: الواو حالية، و«قد» حرف تحقيق، و«قرّع» فعل ماض، و«جلدَ» مفعول به مقدّم، و«الفرائضِ» مضاف إليه، و«الأقدامُ» فاعل مؤخر مرفوع. والجملة في محل نصب حال من الخيل."
morphology:
  - "«تَصَعْلَكَ» على «تَفَعْلَلَ»، مطاوع الرباعي «صَعْلَكَ»، ومن مادته «الصُّعْلُوك»، وفي اللسان: «والتَّصَعْلُكُ: الْفَقْرُ» [@lisan، ج10 ص456]."
  - "«قَرَّعَ» على «فَعَّلَ»، والتضعيف للتكثير: أزالت الأقدام الشعر مرة بعد مرة."
  - "«الفَرائِض» جمع «فَرِيضة» على «فَعائِل»، و«الأَقْدام» جمع «قَدَم» على «أَفْعال»."
rhetoric:
  thesis: "صورة خيل مركوبة أبدًا: ضمرت في الزمن الذي تسمن فيه غيرها، وفي جنوبها أثر أقدام فرسانها."
  devices:
    - title: "الاستعارة في «تَصَعْلَكْنَ»"
      text: "الصعلوك الفقير الذي لا مال له، فجعل الخيل كأنها صارت صعاليك: نحيلة متجرّدة من شعرها، كما يتجرد الفقير من ماله. والاستعارة هنا في الفعل، وهي عند عبد القاهر الجُرْجانيّ «لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]. وهذه قراءتنا للفعل، والأَصْمَعِيّ يفسّره بالمعنى الحسّي وحده."
    - title: "المقابلة بين «تَصَعْلَكْنَ» و«الرَّبِيعِ»"
      text: "الربيع زمن الخصب والسِّمَن، والخيل فيه ضامرة؛ فالصورة تقول إنها لا تُترك للمرعى، بل تُركب دائمًا. وهذه قراءتنا."
    - title: "الكناية في «قَرَّعَ جِلْدَ الْفَرَائِضِ الْأَقْدَامُ»"
      text: "لم يقل إنها تُركب كثيرًا، بل ذكر أثر ذلك: أقدام الفرسان أزالت الشعر عن موضعها من جنوبها. وهي الكناية عند عبد القاهر: أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يصفها قائمة تنتظر الغارة: «جَاذِيَاتٌ عَلَى السَّنَابِكِ قَدْ أَفْـ / ـزَعَهُنَّ الْإِسْرَاجُ وَالْإِلْجَامُ»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "قَدْتَصَعْلَكْ / نَفِرْرَبِي / عِوَقَدْقَرْ = فاعلاتن / متفعلن / فعلاتن — رَعَجِلْدَلْ / فَرَائِضِلْ / أَقْدَامُو = فعلاتن / متفعلن / فالاتن"
  note: "دخل الخَبْن، وهو حذف الثاني الساكن، «مستفع لن» في الشطرين فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98]. ودخل الضربَ التشعيثُ، وهو «حذف العين من فاعلاتن» [@atiq، ص98]، فصار «فالاتن». والبيت مدوّر: انقسمت «قرّع» بين الشطرين، فالراء الأولى آخر الصدر والثانية أول العجز."
variants:
  - reading: "وَقَدْ قَرَّعَ جِلْدَ الْفَرَائِصِ الْأَقْدَامُ"
    status: "رواية الشنقيطية والطبعة الأوروبية، فيما يقول محققا «الأصمعيات»"
    note: "[@asmaiyyat، ص189، الحاشية]. والفريصة لحمة بين الجنب والكتف. وصحّحها المحققان «الفرائض» بالضاد، على ما في اللسان وشرح القاموس ونسخة أشار إليها ناشر الأوروبية."
