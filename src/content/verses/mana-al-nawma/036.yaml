first: "قَدْ بَرَاهُنَّ غِرَّةُ الصَّيْدِ وَالْإِعْـ"
second: "ـدَاءُ حَتَّى كَأَنَّهُنَّ جِلَامُ"
vocabulary:
  - term: "بَرَاهُنَّ"
    text: "أنحلهن."
  - term: "الْإِعْدَاءُ"
    text: "يقول محققا «الأصمعيات»: «حملها على الجرى والعدو» [@asmaiyyat، ص189، الحاشية]."
  - term: "جِلَامُ"
    text: "يقول محققا «الأصمعيات»: «جمع جلم، وهو الجدى، شبهها بها لضمرها» [@asmaiyyat، ص189، الحاشية]."
