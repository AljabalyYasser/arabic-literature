explained: false
first: "وَتَدَلَّتْ بِهَا الْمَغَارِضُ فَوْقَ الْـ"
second: "ـأَرْضِ مَا إِنْ تُقِلُّهُنَّ الْعِظَامُ"
vocabulary:
  - term: "الْمَغَارِضُ"
    text: "يقول محققا «الأصمعيات»: «جمع مغرض، بفتح الميم وكسر الراء، وهو جانب البطن أسفل الأضلاع» [@asmaiyyat، ص188، الحاشية]. ويقولان: «عنى أنها سمينة عظيمات البطون»."
  - term: "تُقِلُّهُنَّ"
    text: "يقول محققا «الأصمعيات»: «تحملهن» [@asmaiyyat، ص188، الحاشية]."
