first: "أَلَا مَنْ لِعَيْنٍ لَا تَجِفُّ دُمُوعُهَا"
second: "إِذَا قُلْتُ تَرْقَا تَسْتَهِلُّ فَتُخْضِلُ"
meaning: "من يُعين عينًا لا تجفّ دموعها؟ كلما قلتُ: الآن تسكن، انهمرت من جديد فبلّت ما تحتها. وفي الشرح المنسوب إلى ثَعْلَب: «ترقا: تحبس، تستهلّ: تصبّ؛ أي تسرع بالدموع» [@diwan-khansa، ص319]."
vocabulary:
  - term: "تَرْقَا"
    text: "تسكن ويجفّ دمعها، والأصل «تَرْقَأُ» بالهمز. في لسان العرب: «رَقَأَتِ الدَّمْعَةُ تَرْقَأُ رقْأً ورُقُوءًا: جَفَّتْ وانْقَطَعَتْ» [@lisan، ج1 ص88]."
  - term: "تَسْتَهِلُّ"
    text: "تنصبّ بقوة. وفي الشرح أصل الكلمة: «يقال: استهلّت السماء: إذا ارتفع صوت مطرها»، و«ومنه استهلال المولود: إذا رفع صوته بالبكاء حين يقع من بطن أمّه» [@diwan-khansa، ص319]."
  - term: "فَتُخْضِلُ"
    text: "فتبلّ. في لسان العرب: «وأَخْضَلَ الثوبَ دمعُه: بَلَّه» [@lisan، ج11 ص208]."
context: "يكمل المطلع: في البيت الأول سألت عينها لماذا تبكي، وهنا تصف هذا البكاء الذي لا يتوقف. والصورة نفسها في مطلع «ألا ما لعينك»: «وَقَدْ أَخْضَلَ الدَّمْعُ سِرْبَالَهَا»، بالفعل نفسه «أخضل»."
syntax:
  - "«أَلَا» حرف استفتاح. و«مَنْ» اسم استفهام مبتدأ، و«لِعَيْنٍ» جار ومجرور خبره. وجملة «لَا تَجِفُّ دُمُوعُهَا» صفة لـ«عَيْنٍ»."
  - "«إِذَا» ظرف لما يُستقبل فيه معنى الشرط، وجملة «قُلْتُ» في محل جر بإضافة «إذا» إليها، و«تَرْقَا» جملة مقول القول. و«تَسْتَهِلُّ» جواب «إذا»."
  - "«فَتُخْضِلُ» معطوف بالفاء على «تَسْتَهِلُّ»، والفاء للترتيب والتعقيب: تنصبّ ثم تبلّ. ومفعول «تُخْضِلُ» محذوف، أي تُخضل الخدّين أو الثوب."
morphology:
  - "«تَرْقَا» خُففت همزتها فصارت ألفًا، وهو تخفيف شائع في الشعر، وأصلها «تَرْقَأُ» من «رَقَأَ» [@lisan، ج1 ص88]."
  - "«تَسْتَهِلُّ» على «تَسْتَفْعِلُ» من الجذر (هـ ل ل)، وفي لسان العرب: «هَلَّ السحابُ بِالْمَطَرِ وهَلَّ المطرُ هَلًّا وانْهَلَّ بِالْمَطَرِ انْهِلالًا واسْتَهَلَّ: وَهُوَ شدَّة انْصِبَابِهِ» [@lisan، ج11 ص701]."
  - "«تُخْضِلُ» مضارع «أَخْضَلَ» على «أَفْعَلَ»، والهمزة فيه للتعدية."
rhetoric:
  thesis: "عين تخيّب كل ظن بأنها ستكفّ: البكاء فيها أقوى من إرادة صاحبتها."
  devices:
    - title: "الاستفهام"
      text: "«أَلَا مَنْ لِعَيْنٍ» استغاثة في صورة سؤال: من يتكفّل بهذه العين؟ والمعنى أنه لا أحد، فالسؤال للتحسر لا للاستفهام."
    - title: "الاستعارة"
      text: "«تَسْتَهِلُّ» كلمة السحاب حين ينصبّ مطره بصوت، فصارت العين سحابة. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وفي الكلمة أيضًا معنى صراخ المولود كما في الشرح، فالعين تبكي بصوت."
    - title: "تتابع الأفعال"
      text: "«تَرْقَا ... تَسْتَهِلُّ فَتُخْضِلُ» ثلاثة أفعال مضارعة متتابعة: سكونٌ مظنون، ثم انهمار، ثم بلل. فالمضارع يجعل الحال تتكرر أمام السامع."
  connection: "ثم تقول على من تبكي: على ماجد ضخم الدسيعة بارع."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "أَلَا مَنْ / لِعَيْنِنْ لَا / تَجِفْفُ / دُمُوعُهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — إِذَا قُلْ / تُ تَرْقَا تَسْ / تَهِلْلُ / فَتُخْضِلُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ «فعولن» الثانية في الشطرين فصارت «فعولُ»، والعروض مقبوضة «مفاعلن» كعادة الطويل [@atiq، ص29]، والضرب مقبوض مثلها."
variants:
  - reading: "إِذَا قُلْتُ أَفْثَتْ تَسْتَهِلُّ فَتَحْفِلُ"
    status: "رواية يعقوب بن السِّكِّيت"
    note: "في الشرح: «يعقوب: «إذا قلت أفثت»»، وفسّره: «أي صارت إلى الانكسار»، و«تحفل: تكثر دمعًا» [@diwan-khansa، ص319]. ويذكر المحقق أن «فتحفل» في إحدى نسختي برلين [@diwan-khansa، ص318]."
