explained: false
first: "بِأَفْضَلَ سَيْبًا مِنْ يَدَيْكَ وَنِعْمَةً"
second: "تَعُمُّ بِهَا بَلْ سَيْبُ كَفَّيْكَ أَجْزَلُ"
vocabulary:
- term: "سَيْبًا"
  text: "في الشرح عن يعقوب: «السَّيب: العطاء، وأجزل: أعظم وأكثر» [@diwan-khansa، ص321]."
- term: "تَعُمُّ بِهَا"
  text: "في الشرح: «تعمّ بها: تعطي الكلّ؛ من يسأل ومن لا يسأل» [@diwan-khansa، ص321]."
