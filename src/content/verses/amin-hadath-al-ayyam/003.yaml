explained: false
first: "عَلَى مَاجِدٍ ضَخْمِ الدَّسِيعَةِ بَارِعٍ"
second: "لَهُ سَوْرَةٌ فِي قَوْمِهِ لَا تُحَوَّلُ"
vocabulary:
- term: "مَاجِدٍ"
  text: "في الشرح المنسوب إلى ثَعْلَب: «الماجد: الشريف» [@diwan-khansa، ص319]."
- term: "ضَخْمِ الدَّسِيعَةِ"
  text: "في الشرح: «يقال: فلان ضخم الدسيعة: إذا كان ضخم الخلُق والخطر، وأصله من دسع البعير بجرّته» [@diwan-khansa، ص320]."
- term: "بَارِعٍ"
  text: "في الشرح: «والبارع: السخيّ يبرع على غيره بالعطاء وبكلّ شيء» [@diwan-khansa، ص319]."
- term: "سَوْرَةٌ"
  text: "في الشرح: «أي سورة مكرمةٍ ورفعة قد سارت فيهم لا تحوّل إلى غيره» [@diwan-khansa، ص319]."
sources:
- source: "diwan-khansa"
  loc: "ص319–320"
  url: "https://archive.org/details/3318pdf_202001/page/n318/mode/1up"
status: "review"
