explained: false
first: "هِزَبْرٌ هَرِيتُ الشِّدْقِ رِئْبَالُ غَابَةٍ"
second: "مَخُوفُ اللِّقَاءِ جَائِبُ الْعَيْنِ أَنْجَلُ"
vocabulary:
- term: "هِزَبْرٌ هَرِيتُ الشِّدْقِ"
  text: "في الشرح عن يعقوب: «الهزبر: من نعت الأسد؛ وهو الغليظ الشديد، والهريت: الواسع شقّ الشدق» [@diwan-khansa، ص323]."
- term: "رِئْبَالُ غَابَةٍ"
  text: "في الشرح: «الرئبال: الأسد، والغابة: الأجمة» [@diwan-khansa، ص323]."
- term: "جَائِبُ الْعَيْنِ أَنْجَلُ"
  text: "واسع العين. في الشرح: «جائب: واسع»، و«أنجل: واسع» [@diwan-khansa، ص323]."
sources:
