explained: false
first: "وَمَا الْغَيْثُ فِي جَعْدِ الثَّرَى دَمِثِ الرُّبَا"
second: "تَبَعَّقَ فِيهِ الْوَابِلُ الْمُتَهَلِّلُ"
vocabulary:
- term: "جَعْدِ الثَّرَى"
  text: "في الشرح: «جعد الثرى: قد تقبّض من كثرة نداه» [@diwan-khansa، ص321]."
- term: "دَمِثِ الرُّبَا"
  text: "في الشرح: «دمث: سهل، والرّبا: جمع رُبوة وربوة؛ وهما ما ارتفع من الأرض على ما حوله» [@diwan-khansa، ص321]."
- term: "تَبَعَّقَ"
  text: "في الشرح: «تبعّق فيه: حلّ فيه، وتفجّر به» [@diwan-khansa، ص320]."
- term: "الْوَابِلُ"
  text: "في الشرح: «والوابل: الضخم القطر، الشديد الوقع» [@diwan-khansa، ص321]."
- term: "الْمُتَهَلِّلُ"
  text: "في الشرح: «المتهلّل: المستهلّ» [@diwan-khansa، ص321]."
sources:
- source: "diwan-khansa"
  loc: "ص320–321"
  url: "https://archive.org/details/3318pdf_202001/page/n319/mode/1up"
status: "review"
