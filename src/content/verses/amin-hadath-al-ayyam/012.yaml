first: "أَخُو الْجُودِ مَعْرُوفًا لَهُ الْجُودُ وَالنَّدَى"
second: "حَلِيفَانِ مَا قَامَتْ تِعَارُ وَيَذْبُلُ"
meaning: "هو أخو الجود، معروفٌ به، والجود والكرم حليفان له لا يفارقانه ما بقي الجبلان تِعار ويَذْبُل قائمين، أي أبدًا."
vocabulary:
  - term: "النَّدَى"
    text: "السخاء والعطاء."
  - term: "تِعَارُ"
    text: "جبل. في الشرح المنسوب إلى ثَعْلَب: «تِعار: جبل بأرض بني سليم ... وتعار غير منوّن»، وفيه أيضًا: «تِعار: جبل بطرف الحرّة؛ حرّة بني سليم» [@diwan-khansa، ص324]."
  - term: "وَيَذْبُلُ"
    text: "جبل. في الشرح: «ويذبل: جبل حذاء نخل لغطفان»، وفيه: «ويذبل: جبل أهله -اليوم- قشير، وكان قبلهم لبني مُليل من باهلة» [@diwan-khansa، ص324]."
context: "قبل الخاتمة: بعد ثلاثة أبيات تشبّهه بالأسد (9–11)، تعود إلى الجود الذي بدأت به المديح (3–7)، فتجعله صفة دائمة دوام الجبال. وتِعار في شعرها رمز للبقاء: في رثائها معاوية تقول «بَلِينَا وَمَا تَبْلَى تِعَارٌ» [@diwan-khansa، ص61]."
syntax:
  - "«أَخُو الْجُودِ» خبر لمبتدأ محذوف تقديره «هو»، و«الْجُودِ» مضاف إليه. و«مَعْرُوفًا» حال من «أخو الجود». وفي رواية يعقوب «معروفٌ» بالرفع [@diwan-khansa، ص324]، فيكون خبرًا ثانيًا."
  - "«لَهُ الْجُودُ وَالنَّدَى حَلِيفَانِ» جملة مستأنفة: «الْجُودُ» مبتدأ، و«وَالنَّدَى» معطوف عليه، و«حَلِيفَانِ» خبر في أول العجز، و«لَهُ» متعلق بـ«حليفان». فالجملة ممتدة من الصدر إلى العجز."
  - "«مَا قَامَتْ» «ما» مصدرية ظرفية، أي مدة قيام تِعار ويذبل. و«تِعَارُ» فاعل ممنوع من الصرف، كما ينص الشرح «وتعار غير منوّن» [@diwan-khansa، ص324]، و«وَيَذْبُلُ» معطوف عليه ممنوع من الصرف للعلمية ووزن الفعل."
morphology:
  - "«حَلِيف» على «فَعِيل» بمعنى «مُفاعِل»، أي المُحالِف الذي عقد معه حلفًا، وثُنّي لأن له اسمين: الجود والندى."
  - "«مَعْرُوف» اسم مفعول من «عَرَفَ». و«يَذْبُل» اسم علم على صورة الفعل المضارع، ولذلك مُنع من الصرف."
rhetoric:
  thesis: "تجعل الكرم حليفًا لأخيها لا ينقض حلفه، وتؤبّد ذلك بالجبال."
  devices:
    - title: "الاستعارة"
      text: "«الْجُودُ وَالنَّدَى حَلِيفَانِ» جعلت الجود والندى رجلين عقدا حلفًا معه، كما تتحالف القبائل. والحلف عند العرب عهد لا يُنقض، فاستعارته للخُلُق تجعله ثابتًا فيه."
    - title: "الكناية عن التأبيد"
      text: "«مَا قَامَتْ تِعَارُ وَيَذْبُلُ» لم تقل «أبدًا»، بل ذكرت ما يلزم عنه: بقاء الجبال. والكناية عند عبد القاهر الجُرْجانيّ أن يترك المتكلم اللفظ الموضوع للمعنى «ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]. والمفارقة أن صخرًا مات، والكرم الذي حالفه باقٍ ببقاء الجبال، أي باقٍ في ذكره."
    - title: "التكرار"
      text: "«أَخُو الْجُودِ ... لَهُ الْجُودُ» تكررت الكلمة في الصدر مرتين، فالبيت كله يدور عليها."
  connection: "ثم الخاتمة: صعب لمن خاشنه، سهل لمن لاينه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "أَخُلْ جُو / دِ مَعْرُوفَنْ / لَهُلْ جُو / دُ وَنْنَدَى = فعولن / مفاعيلن / فعولن / مفاعلن — حَلِيفَا / نِ مَا قَامَتْ / تِعَارُ / وَيَذْبُلُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "العروض مقبوضة «مفاعلن» كعادة الطويل [@atiq، ص29]، ودخل القبضُ «فعولن» الثانية في العجز فصارت «فعولُ»."
