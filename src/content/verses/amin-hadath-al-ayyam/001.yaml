first: "أَمِنْ حَدَثِ الْأَيَّامِ عَيْنُكِ تَهْمُلُ"
second: "وَتَبْكِي عَلَى صَخْرٍ وَفِي الدَّهْرِ مَذْهَلُ"
meaning: "أمِن مصيبة من مصائب الأيام تسيل عينكِ وتبكي على صخر، والدهرُ فيه نسيان؟ تسأل نفسها كيف لا تنسى، والأيام تُنسي كل شيء. وفي الشرح المنسوب إلى ثَعْلَب: «مَذْهَلٌ؛ أي مَنْسىً، أي أن الدهر أنسى صخرًا» [@diwan-khansa، ص318]."
vocabulary:
  - term: "حَدَثِ الْأَيَّامِ"
    text: "نازلة من نوازل الدهر، والمقصود موت صخر."
  - term: "تَهْمُلُ"
    text: "تسيل بالدمع. في الشرح: «تَهْمُلُ: تَصُبُّ دمعَها» [@diwan-khansa، ص318]. وفي لسان العرب: «هَمَلَتْ عينُه تَهْمُلُ وتَهْمِلُ هَمْلًا وهُمُولًا وهَمَلاناً. وانْهَمَلَتْ: فَاضَتْ وَسَالَتْ» [@lisan، ج11 ص710]."
  - term: "مَذْهَلُ"
    text: "نسيان وسلوّ، من ذَهَلَ عن الشيء إذا نسيه. في الشرح: «يقال: ذَهَلْتُ عن كذا وكذا، وذَهِلْتُ لغة» [@diwan-khansa، ص318]."
context: "مطلع القصيدة التي يعدّها ابن سَلّام كلمتها الأخرى في صخر: «وَقَالَت فى صَخْر الْكَلِمَة الْأُخْرَى (أَمن حدث الْأَيَّام عَيْنك تهمل ... وتبكى على صَخْر وفى الدَّهْر مذهل)» [@ibn-sallam، ج1 ص210]. فهي ثالثة الكلمات التي يسمّيها لها، بعد القصيدة الأم وبعد «ألا ما لعينك». وتبدأ كما تبدأ القصيدتان: بسؤال الشاعرة عن عينها."
syntax:
  - "الهمزة للاستفهام، و«مِنْ حَدَثِ» جار ومجرور متعلق بـ«تَهْمُلُ»، و«مِنْ» للسبب. و«عَيْنُكِ» مبتدأ، وجملة «تَهْمُلُ» خبره، وقُدّم الجار والمجرور على المبتدأ لأنه موضع السؤال: أمن هذا تبكين؟"
  - "«وَتَبْكِي» معطوف على «تَهْمُلُ». و«وَفِي الدَّهْرِ مَذْهَلُ» الواو للحال، و«مَذْهَلُ» مبتدأ مؤخر، و«فِي الدَّهْرِ» خبر مقدم. وحُذف التنوين من «مذهلٌ» لأنه في القافية، فتُشبع ضمته واوًا."
morphology:
  - "«مَذْهَل» على «مَفْعَل»، مصدر ميمي من «ذَهَلَ»، بمعنى الذهول والنسيان، وفسّره الشرح بـ«مَنْسىً» على الوزن نفسه [@diwan-khansa، ص318]. وفي رواية ابن السِّكِّيت «مُذْهِل» اسم فاعل من «أَذْهَلَ»، أي شيء يُذهل وينسي، كما يذكر المحقق [@diwan-khansa، ص318]."
  - "«تَهْمُلُ» بضم الميم في النشرة، ويقال «تَهْمِلُ» بكسرها، والوجهان في لسان العرب [@lisan، ج11 ص710]."
rhetoric:
  thesis: "تسأل عينها لماذا لا تنسى والدهر يُنسي، فيصير البكاء عنادًا للزمن نفسه."
  devices:
    - title: "الاستفهام"
      text: "«أَمِنْ حَدَثِ الْأَيَّامِ عَيْنُكِ تَهْمُلُ» سؤال فيه تعجّب ولوم: كأنها تقول إن موت صخر ليس حدثًا من أحداث الأيام العادية التي تُنسى. والجواب الذي تعرفه أن عينها لا تنسى."
    - title: "تجريد المخاطَب"
      text: "«عَيْنُكِ» خطاب لامرأة هي الشاعرة نفسها، كما في مطلع القصيدة الأم «قَذًى بِعَيْنِكِ»، و«أَلَا مَا لِعَيْنِكِ». فالخنساء في مطالع كلماتها الثلاث تقف خارج نفسها وتسأل عينها."
    - title: "المقابلة"
      text: "«تَهْمُلُ ... وَتَبْكِي» في جانب، و«مَذْهَلُ» في جانب: العين تبكي، والدهر يُنسي. فالبيت قائم على تعارض بين حال الشاعرة وطبيعة الزمن."
  connection: "ثم تشكو هذه العين التي لا يجفّ دمعها، كلما قالت سيقف سال من جديد."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، فهي لامية"
  scansion: "أَمِنْ حَ / دَثِلْ أَيْيَا / مِ عَيْنُ / كِ تَهْمُلُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَتَبْكِي / عَلَى صَخْرِنْ / وَفِدْ دَهْ / رِ مَذْهَلُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "وزن الطويل في كل شطر «فعولن مفاعيلن فعولن مفاعلن»، و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، أي آخر تفعيلة في الصدر «مفاعلن». والقبض: حذف الخامس الساكن. ودخل القبضُ «فعولن» الأولى والثانية من الصدر فصارتا «فعولُ». وتُشبع ضمة اللام في آخر البيت فتصير واوًا."
variants:
  - reading: "أَمِنْ حَدَثِ الْأَيَّامِ عَيْنُكِ تَهْمِلُ / تُبَكِّي عَلَى صَخْرٍ وَلِلدَّهْرِ مُذْهِلُ"
    status: "رواية ابن السِّكِّيت"
    note: "يذكر المحقق أنها في إحدى نسختي برلين من روايته، وأن «مُذْهِل» رواية ابن السِّكِّيت، وأن في حاشية نسخة دار الكتب بخط العاصمي: «أي في الدهر ما يذهلك ويُنسِّيك» [@diwan-khansa، ص318]."
