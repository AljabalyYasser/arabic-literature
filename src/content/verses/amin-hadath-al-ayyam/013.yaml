first: "بَعِيدٌ إِذَا خَاشَنْتَهُ مُتَوَعِّرٌ"
second: "قَرِيبٌ إِذَا سَاهَلْتَهُ مُتَسَهِّلُ"
meaning: "هو بعيد المنال صعب إذا عاملتَه بالخشونة، وقريب سهل إذا لاينتَه. وفي الشرح المنسوب إلى ثَعْلَب: «أي: بعيد من الضعف، متوعّر: صعب منيع» [@diwan-khansa، ص324]."
vocabulary:
  - term: "خَاشَنْتَهُ"
    text: "عاملته بالخشونة. في لسان العرب: «وخاشَنْتُه: خِلَافُ لايَنْته» [@lisan، ج13 ص141]."
  - term: "مُتَوَعِّرٌ"
    text: "صعب كالأرض الوعرة. في الشرح: «متوعّر: صعب منيع» [@diwan-khansa، ص324]."
  - term: "سَاهَلْتَهُ"
    text: "لاينته وعاملته بالسهولة."
context: "خاتمة القصيدة، تجمع ما سبق: الشدة التي شبّهته فيها بالأسد (9–11)، واللين الذي وصفت به جوده (3–7). ويذكر المحقق أن هذا البيت ليس في نسخ رواية ابن السِّكِّيت الثلاث [@diwan-khansa، ص324]، فهو من زيادة رواية ثَعْلَب."
syntax:
  - "«بَعِيدٌ» خبر لمبتدأ محذوف تقديره «هو». و«إِذَا خَاشَنْتَهُ» ظرف فيه معنى الشرط، وجوابه محذوف يدل عليه ما قبله، أي إذا خاشنته فهو بعيد. و«مُتَوَعِّرٌ» خبر ثانٍ."
  - "«قَرِيبٌ إِذَا سَاهَلْتَهُ مُتَسَهِّلُ» على الترتيب نفسه، فالشطران متوازيان في الإعراب كلمةً كلمة."
morphology:
  - "«خَاشَنَ» و«سَاهَلَ» على «فَاعَلَ»، وهو وزن المشاركة: الخشونة واللين يأتيان من الطرفين، فهو يعاملك بما تعامله به."
  - "«مُتَوَعِّر» و«مُتَسَهِّل» اسما فاعل من «تَوَعَّرَ» و«تَسَهَّلَ» على «تَفَعَّلَ»، وفيه معنى التكلف والتدرّج: يصير وعرًا ويصير سهلًا بحسب من يلقاه."
rhetoric:
  thesis: "بيت مبني على التقابل: لكل حال من أحوال الناس معه حال منه تقابلها."
  devices:
    - title: "المقابلة"
      text: "«بَعِيدٌ» يقابل «قَرِيبٌ»، و«خَاشَنْتَهُ» يقابل «سَاهَلْتَهُ»، و«مُتَوَعِّرٌ» يقابل «مُتَسَهِّلُ». ثلاثة أضداد في كل شطر، وقال ابن رَشِيق: «فإذا جاوز الطباق ضدين كان مقابلة» [@ibn-rashiq، ج2 ص15]، والطباق الجمع بين الضدين."
    - title: "الاستعارة"
      text: "«مُتَوَعِّرٌ» و«مُتَسَهِّلُ» من وصف الأرض: الوعرة التي يصعب السير فيها، والسهلة. فصار الرجل أرضًا، يجد فيها كل سالك ما يستحقه."
    - title: "الموازنة"
      text: "الشطران على وزن واحد في ألفاظهما: «فَعِيلٌ إذا فاعَلْتَه مُتَفَعِّل». فالبناء نفسه يُري التوازن الذي في خُلُق الممدوح."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "بَعِيدُنْ / إِذَا خَاشَنْ / تَهُو مُ / تَوَعْعِرُنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — قَرِيبُنْ / إِذَا سَاهَلْ / تَهُو مُ / تَسَهْهِلُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "تُشبع ضمة الهاء في «خَاشَنْتَهُ» و«سَاهَلْتَهُ» فتُنطق «تَهُو»، ودخل القبضُ «فعولن» الثانية في الشطرين، والعروض والضرب مقبوضان «مفاعلن» [@atiq، ص29]."
