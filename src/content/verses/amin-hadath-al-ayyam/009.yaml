explained: false
first: "مِنَ الْقَوْمِ مَغْشِيُّ الرِّوَاقِ كَأَنَّهُ"
second: "إِذَا سِيمَ ضَيْمًا خَادِرٌ مُتَبَسِّلُ"
vocabulary:
- term: "مَغْشِيُّ الرِّوَاقِ"
  text: "في الشرح: «أي تغشى الضيفانُ رِواقه. والرِّواق والرَّوق: مقدّم البيت» [@diwan-khansa، ص322]."
- term: "سِيمَ ضَيْمًا"
  text: "أُريد على الظلم."
- term: "خَادِرٌ"
  text: "في الشرح: «والخادر: المخدِر؛ الذي اتّخذ الأجمة خدرًا» [@diwan-khansa، ص322]، يعني الأسد في عرينه."
- term: "مُتَبَسِّلُ"
  text: "في الشرح: «متبسّل: كريه المرآة» [@diwan-khansa، ص322]."
sources:
- source: "diwan-khansa"
  loc: "ص322"
