explained: false
first: "إِذَا أَلْحَمَ الوَاشُونَ لِلشَّرِّ بَيْنَنَا"
second: "تَبَلَّغَ رَسُّ الحُبِّ غَيْرُ المُكَذَّبِ"
vocabulary:
  - term: "أَلْحَمَ"
    text: "أدخل، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص86]."
  - term: "الواشُونَ"
    text: "«الذين يمشون بالنميمة ويزيّنون الكذب» [@diwan-alqama، ص86]."
  - term: "رَسُّ الحُبِّ"
    text: "«الثابت الراسخ» منه [@diwan-alqama، ص86]."
  - term: "المُكَذَّبِ"
    text: "«الزائل المنقطع» [@diwan-alqama، ص86]."
