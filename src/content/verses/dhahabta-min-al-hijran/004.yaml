explained: false
first: "مَحَالٌ كَأَجْوَازِ الجَرَادِ وَلُؤْلُؤٌ"
second: "مِنَ القَلَقِيِّ وَالكَبِيسِ المُلَوَّبِ"
vocabulary:
  - term: "مَحالٌ كَأَجْوازِ الجَرادِ"
    text: "«المحال: الشَّذْر من الذهب، وهو مثل صدور الجراد، يُحشى مسكًا» [@diwan-alqama، ص85]."
  - term: "القَلَقِيِّ"
    text: "«جنس من اللؤلؤ مدحرج لا يستقرّ» [@diwan-alqama، ص85]."
  - term: "الكَبِيسِ المُلَوَّبِ"
    text: "الكبيس «ما حُشي وطُلي بالمَلاب، وهو ضرب من الطيب» [@diwan-alqama، ص85]."
