explained: false
first: "وَسُمْرٌ يُفَلِّقْنَ الظِّرَابَ كَأَنَّهَا"
second: "حِجَارَةُ غَيْلٍ وَارِسَاتٌ بِطُحْلُبِ"
vocabulary:
  - term: "سُمْرٌ"
    text: "«يعني حوافره، وإذا كانت سمرًا كان أصلب لها» [@diwan-alqama، ص101]."
  - term: "الظِّرابَ"
    text: "«ما نتأ من الحجارة وما صغر من الجبال» [@diwan-alqama، ص101]."
  - term: "غَيْلٍ"
    text: "«الماء الجاري»، وأضاف الحجارة إليه «لأن الحجر إذا كان في الماء كان أصلب له» [@diwan-alqama، ص101]."
  - term: "وارِساتٌ"
    text: "«المصفرّات» [@diwan-alqama، ص101]."
