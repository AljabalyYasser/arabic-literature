first: "فَظَلَّ لِثِيرانِ الصَّرِيمِ غَماغِمٌ"
second: "يُداعِسُهُنَّ بِالنَّضِيِّ المُعَلَّبِ"
vocabulary:
  - term: "الصَّرِيمِ"
    text: "الرمل المنقطع من معظم الرمل، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص106]."
  - term: "غَماغِمٌ"
    text: "«الأصوات» [@diwan-alqama، ص106]."
  - term: "يُداعِسُهُنَّ"
    text: "من «الدَّعْس: الطعن» [@diwan-alqama، ص106]."
  - term: "النَّضِيِّ"
    text: "«القناة الطويلة» [@diwan-alqama، ص106]."
  - term: "المُعَلَّبِ"
    text: "«المشدود بالعِلباء، وهي عصبة في العنق» [@diwan-alqama، ص107]."
