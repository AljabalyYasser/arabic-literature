explained: false
first: "فَعِشْنَا بِهَا مِنَ الشَّبَابِ مُلَاوَةً"
second: "فَأَنْجَحَ آيَاتُ الرَّسُولِ المُخَبِّبِ"
vocabulary:
  - term: "مُلاوَةً"
    text: "«الدهر الطويل» [@diwan-alqama، ص90]."
  - term: "فَأَنْجَحَ آياتُ الرَّسُولِ"
    text: "يقول: كان رسول عدوّه لا يُطاع فيما يريد من هجرها له، «ثم أُطيع بعد ذلك وأُجيب» [@diwan-alqama، ص90]؛ والآيات: «العلامات، وأراد بها ما كان ينمّ به ويجعله علامة لصدقه فيما يشي به» [@diwan-alqama، ص91]."
  - term: "المُخَبِّبِ"
    text: "«الذي يعلّمها الخِبّ، والمكر» [@diwan-alqama، ص91]."
