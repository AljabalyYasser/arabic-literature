explained: false
first: "وَمَا أَنْتَ أَمْ مَا ذِكْرُهَا رَبَعِيَّةً"
second: "تَحُلُّ بِإِيرٍ أَوْ بِأَكْنَافِ شُرْبُبِ"
vocabulary:
  - term: "وما أَنْتَ أَمْ ما ذِكْرُها"
    text: "«يوبّخ نفسه ويُنكر عليها تتبّع هذه المرأة مع بُعد دارها» [@diwan-alqama، ص86]."
  - term: "رَبَعِيَّةً"
    text: "من ربيعة بن مالك من تَمِيم، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص86]."
  - term: "إِيرٍ ... شُرْبُبِ"
    text: "«موضعان» [@diwan-alqama، ص86]، والأكناف: النواحي."
