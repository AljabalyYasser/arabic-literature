first: "بِمُجْفَرَةِ الجَنْبَيْنِ حَرْفٍ شِمِلَّةٍ"
second: "كَهَمِّكَ مِرْقالٍ عَلَى الأَيْنِ ذِعْلِبِ"
vocabulary:
  - term: "مُجْفَرَةِ الجَنْبَيْنِ"
    text: "ناقة «منتفخة» الجنبين «واسعة» [@diwan-alqama، ص91]."
  - term: "حَرْفٍ"
    text: "«الضامرة، وقيل هي العظيمة الخلق كحرف الجبل» [@diwan-alqama، ص91]."
  - term: "شِمِلَّةٍ"
    text: "«السريعة الخفيفة» [@diwan-alqama، ص92]."
  - term: "كَهَمِّكَ"
    text: "«أي كما تشتهي وتريد» [@diwan-alqama، ص92]."
  - term: "مِرْقالٍ"
    text: "من «الإرقال: سير فوق العنق» [@diwan-alqama، ص92]."
  - term: "الأَيْنِ"
    text: "«الإعياء» [@diwan-alqama، ص92]."
  - term: "ذِعْلِبِ"
    text: "«الخفيفة السريعة» [@diwan-alqama، ص92]."
