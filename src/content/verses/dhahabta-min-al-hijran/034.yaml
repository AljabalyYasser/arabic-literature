    note: "قال: «في رواية «أدبار»» [@diwan-alqama، ص103]، والأعلم يشرح بها أيضًا: «وأتبع أدبارهن بجري صادق» [@diwan-alqama، ص104]."
  - reading: "فَأَدْرَكَهُنَّ ثانِيًا مِنْ عِنانِهِ / يَمُرُّ كَمَرِّ الرّائِحِ المُتَحَلِّبِ"
    status: "رواية خبر أم جندب"
    note: "يذكرها الأعلم [@diwan-alqama، ص105]، وهي عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص212] والمَرْزُبانِيّ [@muwashshah، ص24] في خبر التحاكم. ثاني العنان: لم يرخه ولم يستحثّ فرسه."
  - reading: "فَأَقْبَلَ يَهْوِي ثانِيًا مِنْ عِنانِهِ"
