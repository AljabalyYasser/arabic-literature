first: "فَأَتْبَعَ آثَارَ الشِّيَاهِ بِصَادِقٍ"
second: "حَثِيثٍ كَغَيْثِ الرَّائِحِ المُتَحَلِّبِ"
meaning: "فانطلق الفرس في آثار بقر الوحش بجري شديد لا يفتر، سريع متتابع، كأنه مطر سحابة تأتي عشيًّا فتنصبّ متتابعة."
vocabulary:
  - term: "فَأَتْبَعَ آثارَ الشِّياهِ"
    text: "«أي سار الفرس في آثار البقر» [@diwan-alqama، ص104]، والشياه هنا بقر الوحش كما في البيت 32."
  - term: "بِصادِقٍ"
    text: "«بجري صادق، أي شديد لا يفتر فيه» [@diwan-alqama، ص104]."
  - term: "حَثِيثٍ"
    text: "«السريع» [@diwan-alqama، ص104]."
  - term: "الرّائِحِ"
    text: "«وأراد بالرائح سحابا أو عارضا يروح، أي يأتي عشيا» [@diwan-alqama، ص104]."
  - term: "المُتَحَلِّبِ"
    text: "«المتساقط المتتابع» [@diwan-alqama، ص104]."
context: "بيت الطرد في قلب وصف الصيد: رأوا البقر ترعى، ثم خرجت عليهم كالجمان المنظوم، فأطلق الفرس في آثارها. وهو البيت الذي يدور عليه خبر [«أم جندب تحكم بين شاعرين»](/stories/umm-jundab/)، لكن الخبر يرويه بلفظ آخر: «فأدركهن ثانيا من عنانه / يمر كمر الرائح المتحلب» [@ibn-qutayba، ج1 ص212]، وهي رواية يذكرها الأعلم بعد شرحه: «ويروى» [@diwan-alqama، ص105]. وعلى تلك الرواية فضّلته أم جندب لأنه، كما يقول ابن قُتَيْبة في الخبر، «فأدرك طريدته وهو ثان من عنان فرسه، لم يضربه بسوط، ولا مراه بساق، ولا زجره» [@ibn-qutayba، ج1 ص213]. أما رواية الأصمعي التي شرحها الأعلم فليس فيها العنان المثنيّ."
syntax:
  - "«فأتبع» الفاء عاطفة، و«أتبع» فعل ماض فاعله ضمير الفرس، و«آثار» مفعول به، و«الشياه» مضاف إليه."
  - "«بصادق» جار ومجرور متعلق بـ«أتبع»، وهو نعت لموصوف محذوف تقديره: بجري صادق، كما يقدّره الأعلم [@diwan-alqama، ص104]. و«حثيث» نعت ثان للموصوف المحذوف."
  - "«كغيث» جار ومجرور نعت ثالث للموصوف المحذوف، و«الرائح» مضاف إليه، وهو نعت لموصوف محذوف كذلك: غيث السحاب الرائح. و«المتحلّب» نعت لـ«الرائح»."
morphology:
  - "«أتبع» على «أفعل» من تبع، يتعدّى إلى مفعول: أتبعه إياه، أي جعله يتبعه."
  - "«الشياه» جمع «شاة» على «فِعال»، وأصل الشاة «شَوْهة»."
  - "«حثيث» صفة مشبهة على «فعيل» من حثّ، بمعنى فاعل."
  - "«الرائح» اسم فاعل من «راح» الأجوف الواوي، وقُلبت عينه همزة. و«المتحلّب» اسم فاعل من «تحلّب» على «تفعّل»، وفيه معنى التتابع شيئًا بعد شيء."
rhetoric:
  thesis: "الفرس في عدوه مطر عشية: لا يفتر، ولا ينقطع، ولا يحتاج إلى من يستحثّه."
  devices:
    - title: "التشبيه في «كغيث الرائح المتحلب»"
      text: "شبّه جري الفرس بمطر السحاب الذي يأتي عشيًّا، والوجه السرعة والتتابع وكثرة الوقع. قال الأعلم: «وشبهه في سرعته وخفته بمطر العشي، وخصه لأن المطر أغزر ما يكون بالعشي» [@diwan-alqama، ص104]. فاختيار «الرائح» لم يكن للوزن، بل لأنه أغزر المطر."
    - title: "حذف الموصوف في «بصادق حثيث»"
      text: "لم يذكر الجري، وذكر صفتيه: صادق حثيث، فصارت الصفة هي الشيء نفسه، وانصرف الذهن إلى الجري من غير أن يُسمّى. وفي هذا الحذف يقول عبد القاهر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "الاستعارة في «صادق»"
      text: "وصف الجري بالصدق، والصدق من صفات الكلام، فجعل الفرس كأنه وعد بالإدراك فوفى ولم يكذب، ويفسّره الأعلم بأنه «شديد لا يفتر فيه» [@diwan-alqama، ص104]. والاستعارة عند عبد القاهر أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وهذه قراءتنا."
  connection: "ثم يصف شدة وقع حوافره: الفأر يخرج من جحره ظانًّا أن مطرًا غزيرًا نزل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة، مطلقة بلا ردف"
  scansion: "فَأَتْبَ / عَآثَارَشْ / شِيَاهِ / بِصَادِقِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — حَثِيثِنْ / كَغَيْثِرْرَا / ئِحِلْمُ / تَحَلْلِبِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب مقبوض «مفاعلن» كسائر القصيدة [@atiq، ص30]. والقبض حذف الخامس الساكن، ودخل «فعولن» الأولى والثالثة في الصدر و«فعولن» الثالثة في العجز فصارت «فعولُ»."
