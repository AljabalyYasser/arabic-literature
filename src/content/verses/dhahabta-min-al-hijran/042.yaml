first: "كَأَنَّ عُيُونَ الوَحْشِ حَوْلَ خِبَائِنَا"
second: "وَأَرْحُلِنَا الجَزْعُ الَّذِي لَمْ يُثَقَّبِ"
meaning: "صرعى الصيد ملقاة حول خيمتنا ورحالنا، وعيونها المفتوحة بسوادها وبياضها كأنها خرز الجَزْع الذي لم يُثقب بعد."
vocabulary:
  - term: "الوَحْشِ"
    text: "ما صادوه من البقر والظباء في الأبيات السابقة."
  - term: "خِبائِنا"
    text: "الخيمة، وقد قال قبل: «فخبّوا علينا»، أي «ضربوا علينا خباء» [@diwan-alqama، ص108]."
  - term: "أَرْحُلِنا"
    text: "جمع رَحْل، وهو ما يوضع على ظهر البعير للركوب، ويريد متاعهم."
  - term: "الجَزْعُ"
    text: "«وهو الخرز، لما فيه من البياض والسواد» [@diwan-alqama، ص109]."
  - term: "لَمْ يُثَقَّبِ"
    text: "لم يُنظم في سلك، فهو صافٍ تامّ، «لأن ذلك أتم لحسنه وأوقع في تشبيه العيون به» [@diwan-alqama، ص109]."
context: "من ختام الصيد: نُصب الخباء، وشُوي اللحم، وتكدّست الطرائد حول الرحال. والبيت يُروى لامرئ القيس أيضًا: يذكره ابن قُتَيْبة في ترجمته فيما «يستجاد من تشبيهه» برواية «حول قبابنا» [@ibn-qutayba، ج1 ص111]، ويقول المُبَرِّد: «ومن تمثيل امرئ القيس العجيب قوله»، ثم ينشده [@kamil، ج3 ص25]. وهو في رواية الأصمعي لعلقمة، وشرحه الأعلم هنا [@diwan-alqama، ص109]، وهو من الأبيات التي يقول فيها ابن أبي شنب: «نسبت إلى امرئ القيس وعلقمة معا» [@diwan-alqama، ص83]."
syntax:
  - "«كأنّ» حرف تشبيه ونصب، و«عيونَ» اسمها، و«الوحش» مضاف إليه، و«حولَ» ظرف مكان متعلق بمحذوف حال من «عيون»، و«خبائنا» مضاف إليه، و«وأرحلنا» معطوف على «خبائنا»."
  - "«الجزعُ» خبر «كأنّ» مرفوع، و«الذي» اسم موصول نعت له، وجملة «لم يُثقَّب» صلته."
morphology:
  - "«عيون» جمع «عين» على «فُعول»، و«أرحُل» جمع «رَحْل» على «أفعُل» جمع قلّة."
  - "«خِباء» على «فِعال»، من خبى الخباء، يقال «خبيت الخباء وأخبيته» [@diwan-alqama، ص108]."
  - "«يُثقَّب» مضارع مبني للمجهول من «ثقّب» على «فعّل»، والتضعيف للتكثير."
rhetoric:
  thesis: "صورة واحدة تحمل الصيد كله: كثرة الطرائد حتى أحاطت بالخباء، وجمال عيونها حتى بعد الموت."
  devices:
    - title: "التشبيه في «كأن عيون الوحش... الجزع»"
      text: "شبّه عيون الطرائد بخرز الجزع، والوجه اجتماع السواد والبياض في كليهما، كما يقول الأعلم [@diwan-alqama، ص109]. والمشبّه كثير متناثر حول الخباء، والمشبّه به خرز منثور غير منظوم، فوقع الشبه في الهيئة والتفرّق معًا. ولهذا يجعله المُبَرِّد «تمثيلا» [@kamil، ج3 ص25]."
    - title: "الاحتراس في «الذي لم يثقب»"
      text: "لو اكتفى بالجزع لجاز أن يتخيّل السامع خرزًا مثقوبًا، والثقب عيب في صفاء الخرزة لا يكون في العين. فقيّده بأنه لم يُثقّب، وهو ما يقوله الأعلم: «وجعله غير مثقب لأن ذلك أتم لحسنه وأوقع في تشبيه العيون به» [@diwan-alqama، ص109]. ويقول محقق الكامل في حاشيته مثل ذلك: «لأن ذلك أصفى له وأتم لحسنه» [@kamil، ج3 ص25]."
    - title: "الكناية عن كثرة الصيد في «حول خبائنا وأرحلنا»"
      text: "لم يقل: صدنا كثيرًا، بل جعل العيون تحيط بالخباء والرحال، فدلّ مكانها على كثرتها. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يروحون كأنهم تجّار عائدون من جُواثا، يحملون الصيد بين عِدْل ومُحقَب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة، مطلقة بلا ردف"
  scansion: "كَأَنْنَ / عُيُونَلْوَحْ / شِحَوْلَ / خِبَائِنَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَأَرْحُ / لِنَلْجَزْعُلْ / لَذِي لَمْ / يُثَقْقَبِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "العروض مقبوضة «مفاعلن» [@atiq، ص29]، والضرب مقبوض «مفاعلن» كسائر القصيدة [@atiq، ص30]. والقبض حذف الخامس الساكن، ودخل «فعولن» الأولى والثالثة في الصدر و«فعولن» الأولى في العجز فصارت «فعولُ»."
