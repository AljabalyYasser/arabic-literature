explained: false
first: "فَبَيْنَا تَمَارِينَا وَعَقْدُ عِذَارِهِ"
second: "خَرَجْنَ عَلَيْنَا كَالجُمَانِ المُثَقَّبِ"
vocabulary:
  - term: "تَمارِينا"
    text: "«يماري بعضنا بعضًا في أمر الوحش» [@diwan-alqama، ص104]."
  - term: "عَقْدُ عِذارِهِ"
    text: "إلجامه، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص104]."
  - term: "الجُمانِ"
    text: "«حبّ يُصنع من فضة على هيئة الدرّ» [@diwan-alqama، ص104]."
  - term: "المُثَقَّبِ"
    text: "«أراد أن يخبر أنه منظوم فدلّ على ذلك بذكره التثقيب» [@diwan-alqama، ص104]."
