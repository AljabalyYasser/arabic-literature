explained: false
first: "فَعَادَى عِدَاءً بَيْنَ ثَوْرٍ وَنَعْجَةٍ"
second: "وَتَيْسٍ شَبُوبٍ كَالهَشِيمَةِ قَرْهَبِ"
vocabulary:
  - term: "عادَى عِداءً"
    text: "«تابع هذا الفرس ووالى في صيده» [@diwan-alqama، ص108]."
  - term: "تَيْسٍ"
    text: "«الذكر من الظباء» [@diwan-alqama، ص108]."
  - term: "شَبُوبٍ"
    text: "الشابّ من الثيران، وقيل المسنّ، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص108]."
  - term: "الهَشِيمَةِ قَرْهَبِ"
    text: "الهشيمة «الشجرة البالية، شبّهه بها لقدمه وصلابته»، والقرهب «المسنّ» [@diwan-alqama، ص108]."
