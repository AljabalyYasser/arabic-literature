explained: false
first: "قَطاةٌ كَكُرْدُوسِ المَحالَةِ أَشْرَفَتْ"
second: "إِلَى سَنَدٍ مِثْلِ الغَبِيطِ المُذَأَّبِ"
vocabulary:
  - term: "قَطاةٌ"
    text: "«موضع الرِّدف من مؤخّره» [@diwan-alqama، ص99]."
  - term: "كُرْدُوسِ المَحالَةِ"
    text: "«عظم مَحال البعير، والمَحال الفَقار» [@diwan-alqama، ص99]."
  - term: "سَنَدٍ مِثْلِ الغَبِيطِ"
    text: "الكاهل، والغبيط «مركب من مراكب النساء» [@diwan-alqama، ص99]، «شبّه الكاهل به في إشرافه وسعة أسفله» [@diwan-alqama، ص100]."
  - term: "المُذَأَّبِ"
    text: "«الموسَّع» [@diwan-alqama، ص100]."
