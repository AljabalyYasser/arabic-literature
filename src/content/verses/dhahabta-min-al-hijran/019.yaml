first: "وَقَدْ أَغْتَدِي وَالطَّيْرُ فِي وُكُنَاتِهَا"
second: "وَمَاءُ النَّدَى يَجْرِي عَلَى كُلِّ مِذْنَبِ"
meaning: "وكثيرًا ما أخرج إلى الصيد مبكرًا، والطير لم تبرح أعشاشها بعد، والندى ما زال يسيل في مجاري الماء إلى الرياض."
vocabulary:
  - term: "أَغْتَدِي"
    text: "أغدو، أي أخرج في أول النهار."
  - term: "وُكُناتِها"
    text: "«الوكنات جمع وكنة، وهي موضع الطائر» [@diwan-alqama، ص95]."
  - term: "النَّدَى"
    text: "ما يسقط على الأرض والنبات من رطوبة الليل."
  - term: "مِذْنَبِ"
    text: "«مسيل الماء إلى الرياض» [@diwan-alqama، ص95]."
context: "أول وصف الفرس والصيد (19–45)، بعد وصف الناقة. وصدر البيت هو صدر بيت امرئ القيس في معلقته: «وقد أغتدي والطير في وكناتها / بمنجرد قيد الأوابد هيكل» [@ibn-al-anbari، ص82]، و[البيت عندنا هنا](/texts/qifa-nabki/53/). ويشترك البيت التالي معه أيضًا في «بمنجرد قيد الأوابد». ولهذا ينبّه ابن أبي شنب في أول القصيدة: «في هذه القصيدة أبيات أو أشطار نسبت إلى امرئ القيس وعلقمة معا» [@diwan-alqama، ص83]. ولا ندري أيّ الشاعرين أخذ من الآخر، والقصيدتان على رويّين مختلفين: لامية امرئ القيس وبائية عَلْقَمة."
syntax:
  - "«وقد أغتدي» الواو استئنافية، و«قد» حرف تحقيق دخل على المضارع فأفاد التكثير، و«أغتدي» فعل مضارع فاعله ضمير المتكلم."
  - "«والطير في وكناتها» الواو حالية، و«الطير» مبتدأ، و«في وكناتها» جار ومجرور خبره، والجملة في محل نصب حال."
  - "«وماء الندى يجري» الواو حالية كذلك، و«ماء» مبتدأ، و«الندى» مضاف إليه، وجملة «يجري» خبره، و«على كل مذنب» متعلق بـ«يجري». والجملتان حالان متعاقبتان."
morphology:
  - "«أغتدي» على «أفتعل» من «غدا»، بمعنى أغدو."
  - "«وُكُنات» جمع «وُكْنة» جمع مؤنث سالمًا، وحُرّكت العين بالضم إتباعًا لفاء الكلمة."
  - "«مِذْنَب» على «مِفْعَل»، وهو وزن اسم الآلة، سُمّي به المسيل كأنه ذَنَب الوادي الذي يجري إلى الروضة."
rhetoric:
  thesis: "مطلع الطرد: الوقت قبل أن يستيقظ الطير، والأرض رطبة بالندى، فالفرس سابق حتى للطير."
  devices:
    - title: "الكناية عن التبكير في «والطير في وكناتها»"
      text: "لم يقل: أخرج قبل الفجر، بل ذكر ما يلزم من ذلك: الطير لم تخرج من أوكارها. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. وزاد على امرئ القيس حالًا ثانية من الأرض: الندى يجري في المذانب، فتمّ له الوقت من السماء والأرض معًا."
    - title: "المبالغة في «يجري»"
      text: "جعل الندى يجري كما يجري الماء في المسيل، والندى في الحقيقة قطرات، فبالغ في كثرته حتى سال. وهذه قراءتنا."
  connection: "ثم يذكر الفرس الذي يغتدي به: منجرد قيد الأوابد أضمره طراد الهوادي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة، مطلقة بلا ردف"
  scansion: "وَقَدْأَغْ / تَدِي وَطْطَيْ / رُفِي وُ / كُنَاتِهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — وَمَاءُنْ / نَدَى يَجْرِي / عَلَى كُلْ / لِمِذْنَبِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "العروض مقبوضة «مفاعلن» لأن عروض الطويل «تأتي مقبوضة دائمًا» [@atiq، ص29]، والضرب مقبوض «مفاعلن» كسائر القصيدة [@atiq، ص30]. والقبض حذف الخامس الساكن، ودخل «فعولن» الثالثة في الصدر فصارت «فعولُ»."
