first: "لَيَالِيَ لَا تَبْلَى نَصِيحَةُ بَيْنِنَا"
second: "لَيَالِيَ حَلُّوا بِالسِّتَارِ فَغُرَّبِ"
vocabulary:
  - term: "لا تَبْلَى نَصِيحَةُ بَيْنِنا"
    text: "زمن كان حيّها وحيّه متجاورين، «فكنّا نجدّد النصائح ونقرّب الوسائل» [@diwan-alqama، ص83]، والنصيحة هنا الودّ الخالص."
  - term: "السِّتارِ فَغُرَّبِ"
    text: "«موضعان» [@diwan-alqama، ص83]."
