explained: false
first: "كَأَنَّ بِحَاذَيْهَا إِذَا مَا تَشَذَّرَتْ"
second: "عَثَاكِيلَ قِنْوٍ مِنْ سُمَيْحَةَ مُرْطِبِ"
vocabulary:
  - term: "حاذَيْها"
    text: "«ما استقبلك من الفخذين إذا استدبرت الدابة» [@diwan-alqama، ص93]."
  - term: "تَشَذَّرَتْ"
    text: "«تصعّبت وتلوّت وضربت بذنبها نشاطًا» [@diwan-alqama، ص93]."
  - term: "عَثاكِيلَ قِنْوٍ"
    text: "العثاكيل جمع عِثكال «وهو القِنو»، أي العِذق؛ «وشبّه ذنب الناقة في كثرة فروعه وغزارة شعره بعناقيد النخل المرطبة» [@diwan-alqama، ص94]."
  - term: "سُمَيْحَةَ"
    text: "«اسم بئر»، أراد نخلها [@diwan-alqama، ص94]."
