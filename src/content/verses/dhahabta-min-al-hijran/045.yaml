first: "وراحَ يُبارِي فِي الجِنابِ قَلُوصَنا"
second: "عَزِيزًا عَلَيْنا كالحُبابِ المُسَيَّبِ"
vocabulary:
  - term: "يُبارِي فِي الجِنابِ قَلُوصَنا"
    text: "يُقاد إلى جنب الناقة فيعارضها في السير «على أنه قد جهد نهاره بمطاردة الصيد» [@diwan-alqama، ص111]، والقلوص الناقة الشابة."
  - term: "الحُبابِ"
    text: "«الحيّة، شبّه الفرس بها في ضُمره ولين معاطفه» [@diwan-alqama، ص111]."
