explained: false
first: "مُمَرٍّ كَعَقْدِ الأَنْدَرِيِّ يَزِينُهُ"
second: "مَعَ العِتْقِ خَلْقٌ مُفْعَمٌ غَيْرُ جَانِبِ"
vocabulary:
  - term: "مُمَرٍّ"
    text: "«الشديد الفتل، يعني أنه صُلب اللحم شديد الأسر» [@diwan-alqama، ص97]."
  - term: "الأَنْدَرِيِّ"
    text: "«حبل مضفور من جلود، منسوب إلى قرية بالشام» [@diwan-alqama، ص98]."
  - term: "العِتْقِ"
    text: "«الكرم» [@diwan-alqama، ص98]."
  - term: "مُفْعَمٌ غَيْرُ جانِبِ"
    text: "المفعم «الممتلئ التامّ»، والجانب «القصير» [@diwan-alqama، ص98]."
