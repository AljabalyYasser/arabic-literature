explained: false
first: "كُمَيْتٍ كَلَوْنِ الأُرْجُوانِ نَشَرْتَهُ"
second: "لِبَيْعِ الرِّداءِ فِي الصِّوانِ المُكَعَّبِ"
vocabulary:
  - term: "كُمَيْتٍ"
    text: "لونه بين السواد والحمرة، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص96]."
  - term: "الأُرْجُوانِ"
    text: "«صبغ أحمر مشبع، وأراد به هنا ثوبًا» [@diwan-alqama، ص97]."
  - term: "الصِّوانِ"
    text: "«التخت» [@diwan-alqama، ص97]."
  - term: "المُكَعَّبِ"
    text: "«ضرب من الوشي»؛ «شبّه الفرس بأرجوان نُشر ليباع عليه رداء وشي فازداد حسنًا» [@diwan-alqama، ص97]."
