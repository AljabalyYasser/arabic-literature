explained: false
first: "رَأَيْنا شِياهًا يَرْتَعِينَ خَمِيلَةً"
second: "كَمَشْيِ العَذارَى فِي المُلاءِ المُهَدَّبِ"
vocabulary:
  - term: "شِياهًا"
    text: "«يعني بقرًا من الوحش» [@diwan-alqama، ص103]."
  - term: "خَمِيلَةً"
    text: "«رملة فيها شجر» [@diwan-alqama، ص103]."
  - term: "المُلاءِ المُهَدَّبِ"
    text: "الملاحف ذات الهُدب، «شبّه البقر بالعذارى... لحسن مشيتهنّ وسبوغ أذيالهنّ» [@diwan-alqama، ص103]."
