first: "إِذا أَنْفَدُوا زادًا فَإِنَّ عِنانَهُ"
second: "وأَكْرُعَهُ مُسْتَعْمَلًا خَيْرُ مَكْسَبِ"
vocabulary:
  - term: "أَكْرُعَهُ"
    text: "قوائمه."
  - term: "خَيْرُ مَكْسَبِ"
    text: "«إذا أنفد القوم زادهم فاستعملوا هذا الفرس في الصيد كان ذلك من خير ما اكتسبوا به لكثرة ما يصيد لهم» [@diwan-alqama، ص103]."
