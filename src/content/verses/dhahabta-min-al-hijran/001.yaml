first: "ذَهَبْتَ مِنَ الهِجْرَانِ فِي غَيْرِ مَذْهَبِ"
second: "وَلَمْ يَكُ حَقًّا كُلُّ هَذَا التَّجَنُّبِ"
meaning: "يخاطب الشاعر نفسه: لقد مضيتَ في احتمال هجرها مذهبًا لا وجه له، فهي لم تهجرك لريبة رأتها منك، بل دلالًا، ولم يكن كل هذا الإعراض عنك حقًّا لأنك لم تأتِ ما يوجبه."
vocabulary:
  - term: "الهِجْرانِ"
    text: "الهجر والقطيعة، وهو هنا «هجران هذه المرأة لك» [@diwan-alqama، ص83]."
  - term: "فِي غَيْرِ مَذْهَبِ"
    text: "في غير وجه يجب؛ «أي لم تهجرك لريبة رابتك بها، لكن إدلالا وتجنبا» [@diwan-alqama، ص83]."
  - term: "التَّجَنُّبِ"
    text: "الإعراض والتباعد، و«لم يك تجنبها حقا إذ لم تأت إليها ما يوجب التجنب» [@diwan-alqama، ص83]."
context: "مطلع الرائعة الثالثة من روائع عَلْقَمة، وهي التي يقرنها الرواة بقصيدة امرئ القيس «خليليّ مرّا بي على أمّ جندب» على الوزن والرويّ نفسيهما. ويروي ابن قُتَيْبة المطلع في خبر التحاكم إلى أمّ جندب [@ibn-qutayba، ج1 ص212]، والخبر في [«أم جندب تحكم بين شاعرين»](/stories/umm-jundab/). والقصيدة عند محققه أحمد شاكر «معروفة لعلقمة»، وينقل عن الأنباري عن أحمد بن عبيد: «كان ابن الجصاص وحماد يرويان ذهبت من الهجران لامرئ القيس، ورواها المفضل لعلقمة» [@ibn-qutayba، ج1 ص212]. ويبدأ النسيب هنا بلوم النفس، ثم يتذكر زمن الجوار (2–12)."
syntax:
  - "«ذهبتَ» فعل وفاعل، و«من الهجران» جار ومجرور متعلق به، و«من» للتعليل أو لابتداء الغاية: ذهبتَ بسبب الهجران. و«في غير مذهب» جار ومجرور متعلق بـ«ذهبت»، و«مذهب» مضاف إليه."
  - "«ولم يكُ» الواو عاطفة، و«يكُ» مضارع ناقص مجزوم بـ«لم» وعلامة جزمه السكون على النون المحذوفة تخفيفًا. و«حقًّا» خبر «يكن» مقدّم، و«كلُّ» اسمها مؤخّر، و«هذا» مضاف إليه، و«التجنّب» بدل من اسم الإشارة أو عطف بيان."
morphology:
  - "«الهِجْران» مصدر «هجر» على «فِعْلان»."
  - "«مَذْهَب» على «مَفْعَل» من ذهب، مصدر ميمي أو اسم مكان: الوجه والطريق."
  - "«يَكُ» أصله «يكونُ»، جُزم فصار «يكنْ» ثم حُذفت النون تخفيفًا لكثرة الاستعمال."
  - "«التجنّب» مصدر «تجنّب» على «تفعّل»، وفيه معنى التكلّف: كأنها تتكلّف الإعراض."
rhetoric:
  thesis: "مطلع يبدأ بالعتاب لا بالوقوف على الدار: الشاعر يلوم نفسه على تصديق هجر لا سبب له."
  devices:
    - title: "التجريد في «ذهبتَ»"
      text: "يخاطب نفسه بضمير المخاطب، فيجعل منها شخصًا آخر يلومه، وهو ما يفهمه الأعلم: «يقول لنفسه» [@diwan-alqama، ص83]. وبهذا صار الحزن عتابًا، والشاعر قاضيًا على نفسه."
    - title: "الجناس الاشتقاقي في «ذهبتَ... مذهب»"
      text: "جمع الفعل «ذهبت» ومصدره الميمي «مذهب» في شطر واحد، فصار الوجه الذي ذهب فيه هو نفسه ما يُنكره: ذهاب في غير مذهب. وهذه قراءتنا."
    - title: "التصريع"
      text: "ختم الصدر بـ«مذهب» على قافية العجز «التجنّب». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. والعروض والضرب هنا كلاهما «مفاعلن»."
  connection: "ثم يتذكر الليالي التي كانت فيها النصيحة بينهما لا تبلى، حين كانت ديارهم بالستار فغُرَّب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة، مطلقة بلا ردف"
  scansion: "ذَهَبْتَ / مِنَلْهِجْرَا / نِفِي غَيْ / رِمَذْهَبِي = فعولُ / مفاعيلن / فعولن / مفاعلن — وَلَمْ يَ / كُحَقْقَنْ كُلْ / لُهَاذَتْ / تَجَنْنُبِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "عروض الطويل «تأتي مقبوضة دائمًا» [@atiq، ص29]، والضرب في هذه القصيدة مقبوض «مفاعلن» مثلها، أي «بحذف الخامس الساكن لتصير مفاعيلن مفاعلن» [@atiq، ص30]. ودخل القبض «فعولن» الأولى في الشطرين فصارت «فعولُ». وتُشبَع كسرة الباء في آخر الشطرين فتُنطق «بِي»."
variants:
  - reading: "ذَهَبْتَ مِنَ الهِجْرانِ فِي كُلِّ مَذْهَبِ"
    status: "رواية ابن سلّام وابن قتيبة وابن رشيق"
    note: "[@ibn-sallam، ج1 ص139] و[@ibn-qutayba، ج1 ص212] و[@ibn-rashiq، ج1 ص103]. ويذكر ابن رَشِيق الروايتين: «ذهبت من الهجران في كل مذهب ويروي في غير مذهب» [@ibn-rashiq، ج1 ص103]، ويذكر ابن أبي شنب في حاشيته أن «في كل مذهب» رواية العمدة والمزهر [@diwan-alqama، ص83]. والمعنى عليها: ذهبتَ في احتمال هجرها كل مذهب. ورواية الأغاني «في غير مذهب» كالديوان [@aghani-dk، ج21 ص202]."
