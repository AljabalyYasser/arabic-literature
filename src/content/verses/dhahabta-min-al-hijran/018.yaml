explained: false
first: "تَذُبُّ بِهِ طَوْرًا وطَوْرًا تُمِرُّهُ"
second: "كَذَبِّ البَشِيرِ بِالرِّداءِ المُهَدَّبِ"
vocabulary:
  - term: "تَذُبُّ بِهِ ... تُمِرُّهُ"
    text: "تحرّكه حينًا وتفتله حينًا، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص94]."
  - term: "كَذَبِّ البَشِيرِ"
    text: "«لأن البشير يلمع للقوم بالرداء إذا جاء مبشّرًا ليُعلم أنه أتى بخبر خير» [@diwan-alqama، ص94]."
  - term: "المُهَدَّبِ"
    text: "«ذو الهُدْب» [@diwan-alqama، ص94]."
