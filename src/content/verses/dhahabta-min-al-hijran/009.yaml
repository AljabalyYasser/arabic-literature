explained: false
first: "وَقَالَتْ مَتَى يُبْخَلْ عَلَيْكَ وَيُعْتَلَلْ"
second: "يَسُؤْكَ وَإِنْ يُكْشَفْ غَرَامُكَ تَدْرَبِ"
vocabulary:
  - term: "يُعْتَلَلْ"
    text: "يُتعلَّل عليك بالأعذار."
  - term: "غَرامُكَ"
    text: "«عذابه بها» [@diwan-alqama، ص88]."
  - term: "تَدْرَبِ"
    text: "من «الدُّربة: العادة»، أي: «إن صرنا إلى ما تريد من الوصال اعتدت ودربت، وإن هجرناك واعتللنا عليك شكوت ذلك» [@diwan-alqama، ص88]."
