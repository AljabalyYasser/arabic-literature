first: "أَطَعْتَ الوُشَاةَ وَالمُشَاةَ بِصُرْمِهَا"
second: "فَقَدْ أَنْهَجَتْ حِبَالُهَا لِلتَّقَضُّبِ"
vocabulary:
  - term: "بِصُرْمِها"
    text: "«أي في صرمها» [@diwan-alqama، ص87]، والصَّرْم: القطيعة."
  - term: "أَنْهَجَتْ حِبالُها"
    text: "«خلقت أسباب المودّة بيني وبينها» [@diwan-alqama، ص87]."
  - term: "التَّقَضُّبِ"
    text: "«التقطّع» [@diwan-alqama، ص87]."
