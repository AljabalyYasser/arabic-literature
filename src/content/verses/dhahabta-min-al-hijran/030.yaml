explained: false
first: "أَخا ثِقَةٍ لا يَلْعَنُ الحَيُّ شَخْصَهُ"
second: "صَبُورًا عَلَى العِلّاتِ غَيْرَ مُسَبَّبِ"
vocabulary:
  - term: "أَخا ثِقَةٍ"
    text: "«أي يوثق بجريه وكرمه» [@diwan-alqama، ص102]."
  - term: "لا يَلْعَنُ الحَيُّ شَخْصَهُ"
    text: "«أي لا يسبّونه ولا يدعون عليه، ولكن يفدّونه» [@diwan-alqama، ص102]."
  - term: "العِلّاتِ"
    text: "«ما به من علّة وتعب» [@diwan-alqama، ص102]."
