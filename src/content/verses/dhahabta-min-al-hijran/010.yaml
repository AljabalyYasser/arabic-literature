explained: false
first: "فَقُلْتُ لَهَا فِيئِي فَمَا يَسْتَفِزُّنِي"
second: "ذَوَاتُ العُيُونِ وَالبَنَانِ المُخَضَّبِ"
vocabulary:
  - term: "فِيئِي"
    text: "«ارجعي إلى أهلك فلا حاجة لنا إليك» [@diwan-alqama، ص89]."
  - term: "يَسْتَفِزُّنِي"
    text: "«يستخفّني ويحملني على الطرب والشوق» [@diwan-alqama، ص89]."
  - term: "البَنانِ المُخَضَّبِ"
    text: "أطراف الأصابع المصبوغة بالحنّاء."
