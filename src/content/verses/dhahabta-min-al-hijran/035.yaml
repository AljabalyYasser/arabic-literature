explained: false
first: "تَرَى الفارَ عَنْ مُسْتَرْغِبِ القَدْرِ لائِحًا"
second: "عَلَى جَدَدِ الصَّحْراءِ مِنْ شَدٍّ مُلْهِبِ"
vocabulary:
  - term: "الفارَ"
    text: "الفأر."
  - term: "مُسْتَرْغِبِ القَدْرِ"
    text: "«خطو مسترغب، وهو الواسع البعيد، والقدر قدر الخطو» [@diwan-alqama، ص105]."
  - term: "لائِحًا"
    text: "«بيّنًا ظاهرًا» [@diwan-alqama، ص105]."
  - term: "جَدَدِ الصَّحْراءِ"
    text: "الجدد «ما غلظ من الأرض وصلب»؛ يقول: «ظنّ الفأر خفيف جريه وشدة وقعه بالأرض مطرًا غزيرًا فخرج عن جِحَرته» [@diwan-alqama، ص105]."
  - term: "شَدٍّ مُلْهِبِ"
    text: "جري فرس شديد يثير الغبار، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص105]."
sources:
