explained: false
first: "فَهَاوٍ عَلَى حُرِّ الجَبِينِ وَمُتَّقٍ"
second: "بِمِدْرَاتِهِ كَأَنَّهَا ذَلْقُ مِشْعَبِ"
vocabulary:
  - term: "فَهاوٍ ... ومُتَّقٍ"
    text: "«منها ما هوى على حرّ وجهه، ومنها ما هوى على قرنيه متّقيًا بهما الأرض» [@diwan-alqama، ص107]."
  - term: "مِدْراتِهِ"
    text: "«القرن» [@diwan-alqama، ص107]."
  - term: "ذَلْقُ مِشْعَبِ"
    text: "الذلق «الحدّ والطرف»، والمشعب «الإشفى» [@diwan-alqama، ص107]."
