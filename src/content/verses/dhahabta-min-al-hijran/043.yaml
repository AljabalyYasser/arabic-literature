explained: false
first: "وَرُحْنَا كَأَنَّا مِنْ جُوَاثَا عَشِيَّةً"
second: "نُعَالِي النِّعَاجَ بَيْنَ عِدْلٍ وَمُحْقَبِ"
vocabulary:
  - term: "جُواثا"
    text: "«قرية بالبحرين كثيرة التمر»؛ يقول: «كأنّا تجّار قد اشتروا تمرًا من جواثا لكثرة ما معنا من الصيد» [@diwan-alqama، ص109]."
  - term: "نُعالِي النِّعاجَ"
    text: "نرفعها ونحملها، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص110]."
  - term: "عِدْلٍ ومُحْقَبِ"
    text: "العِدل نصف الحِمل، والمحقب ما جُعل في الحقيبة وراء الراكب، كما يقول ابن أبي شَنَب في حاشيته [@diwan-alqama، ص110]."
