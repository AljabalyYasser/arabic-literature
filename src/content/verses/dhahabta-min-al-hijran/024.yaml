first: "لَهُ حُرَّتَانِ تَعْرِفُ العِتْقَ فِيهِمَا"
second: "كَسَامِعَتَيْ مَذْعُورَةٍ وَسْطَ رَبْرَبِ"
vocabulary:
  - term: "حُرَّتانِ"
    text: "«أذنيه، جعلهما حرّتين للطافتهما وانتصابهما وعتقهما» [@diwan-alqama، ص98]."
  - term: "مَذْعُورَةٍ"
    text: "«المفزَّعة، يعني بقرة ذُعرت فنصبت أذنيها» [@diwan-alqama، ص98]."
  - term: "رَبْرَبِ"
    text: "«جماعة بقر الوحش» [@diwan-alqama، ص98]."
