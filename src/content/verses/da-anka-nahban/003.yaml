first: تَلَعَّبَ بَاعِثٌ بِذِمَّةِ خَالِدٍ
second: وَأَوْدَى عِصَامٌ فِي الْخُطُوبِ الْأَوَائِلِ
vocabulary:
- term: بَاعِثٌ
  text: باعث بن حُوَيص الطائي، الذي أغار على إبل الشاعر [@khizana، ج11 ص178].
- term: خَالِدٍ
  text: خالد بن سَدوس النبهاني الطائي، الذي نزل عليه الشاعر [@khizana، ج11 ص178].
- term: أَوْدَى
  text: هلك.
