first: وَأَعْجَبَنِي مَشْيُ الْحُزُقَّةِ خَالِدٍ
second: كَمَشْيِ أَتَانٍ حُلِّئَتْ بِالْمَنَاهِلِ
vocabulary:
- term: الْحُزُقَّةِ
  text: «القصير العظيم البطن» [@khizana، ج11 ص185].
- term: أَتَانٍ
  text: أنثى الحمار.
- term: حُلِّئَتْ
  text: طُردت عن الماء ومُنعت أن ترده [@khizana، ج11 ص185].
- term: الْمَنَاهِلِ
  text: موارد الماء.
