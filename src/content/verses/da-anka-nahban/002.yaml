first: كَأَنَّ دِثَارًا حَلَّقَتْ بِلَبُونِهِ
second: عُقَابُ تَنُوفَى لَا عُقَابُ الْقَوَاعِلِ
vocabulary:
- term: دِثَارًا
  text: «راعي امرئ القَيْس» [@khizana، ج11 ص180].
- term: لَبُونِهِ
  text: إبله ذوات اللبن.
- term: تَنُوفَى
  text: '«جبل مشرف»، وقال الأَصْمَعِيّ: «موضع ببلاد طيئ» [@khizana، ج11 ص180].'
- term: الْقَوَاعِلِ
  text: «جبال صغار» [@khizana، ج11 ص181].
