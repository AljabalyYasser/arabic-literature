first: دَعْ عَنْكَ نَهْبًا صِيحَ فِي حَجَرَاتِهِ
second: وَلَكِنْ حَدِيثًا مَا حَدِيثُ الرَّوَاحِلِ
vocabulary:
- term: نَهْبًا
  text: «المال المنهوب» [@maydani، ج1 ص267].
- term: حَجَرَاتِهِ
  text: «النواحي» [@maydani، ج1 ص267].
- term: الرَّوَاحِلِ
  text: رواحل الشاعر التي أعطاها جارَه خالدًا ليطلب عليها إبله المنهوبة، فذهبت هي أيضًا [@khizana، ج11 ص178].
