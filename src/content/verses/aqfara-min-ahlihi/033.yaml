first: "أَوْ شَبَبٌ يَرْتَعِي الرُّخَامَى"
second: "تَلُفُّهُ شَمْأَلٌ هَبُوبُ"
vocabulary:
  - term: "شَبَبٌ"
    text: "«الذي قد تم شبابه وسنه» [@tabrizi-ashr، ص331]، يريد ثورًا وحشيًّا."
  - term: "الرُّخَامَى"
    text: "نبت [@tabrizi-ashr، ص331]."
  - term: "تَلُفُّهُ شَمْأَلٌ هَبُوبُ"
    text: "تأتيه ريح الشمال الهابّة من كل وجه، «ولفها: إتيانها إياه من كل وجه» [@tabrizi-ashr، ص331]."
