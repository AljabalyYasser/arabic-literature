vocabulary:
  - term: "فَرَاكِسٌ فَثُعَالِبَاتٌ"
    text: "«راكس وثعالبات: موضعان» [@tabrizi-ashr، ص324]، ويروى «فثُعَيْلِبات»."
  - term: "فَذَاتُ فِرْقَيْنِ"
    text: "موضع، وكذلك سائر ما في البيتين من الأسماء: منازل قوم الشاعر من بني أسد."
  - term: "القَلِيبُ"
    text: "البئر [@tabrizi-ashr، ص324]."
