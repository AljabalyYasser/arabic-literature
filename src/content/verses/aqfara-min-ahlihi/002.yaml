explained: false
first: "فَرَاكِسٌ فَثُعَالِبَاتٌ"
second: "فَذَاتُ فِرْقَيْنِ فَالقَلِيبُ"
vocabulary:
  - term: "فَرَاكِسٌ فَثُعَالِبَاتٌ"
    text: "«راكس وثعالبات: موضعان» [@tabrizi-ashr، ص324]، ويروى «فثُعَيْلِبات»."
  - term: "فَذَاتُ فِرْقَيْنِ"
    text: "موضع، وفي لسان العرب: «وذاتُ فِرقَيْن الَّتِي فِي شِعْرِ عَبيد بْنِ الأَبرص: هَضْبة بَيْنَ الْبَصْرَةِ وَالْكُوفَةِ» [@lisan، ج10 ص307]. وكذلك سائر ما في البيتين من الأسماء: منازل قوم الشاعر من بني أسد."
  - term: "القَلِيبُ"
    text: "البئر [@tabrizi-ashr، ص324]."
