explained: false
first: "عَيْرَانَةٌ مُؤْجَدٌ فَقَارُهَا"
second: "كَأَنَّ حَارِكَهَا كَثِيبُ"
vocabulary:
  - term: "عَيْرَانَةٌ"
    text: "ناقة تشبه العَيْر، وهو حمار الوحش، في صلابتها ونشاطها."
  - term: "مُؤْجَدٌ فَقَارُهَا"
    text: "«قال أبو عمرو: المؤجد: التي يكون عظم فقارها واحدا»، و«الفقار: خرز الظهر» [@tabrizi-ashr، ص330]."
  - term: "حَارِكَهَا"
    text: "منسجها، وهو أعلى الكاهل، «وصف حاركها بالإشراف والملاسة» [@tabrizi-ashr، ص330]."
