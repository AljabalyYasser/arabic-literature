first: "أَقْفَرَ مِنْ أَهْلِهِ مَلْحُوبُ"
second: "فَالقُطَبِيَّاتُ فَالذَّنُوبُ"
meaning: "خلا ملحوب من أهله، وخلت بعده القطبيات، ثم الذنوب: منازل قومه واحدًا بعد واحد، لم يبق فيها أحد."
vocabulary:
  - term: "أَقْفَرَ"
    text: "خلا وصار قفرًا لا ساكن فيه."
  - term: "مَلْحُوبُ"
    text: "موضع. يقول شوقي ضيف: «وملحوب والقطبيات والذنوب: أسماء مواضع» [@deif، ج1 ص184، الحاشية]."
  - term: "القُطَبِيَّاتُ"
    text: "في لسان العرب أن القُطَبِيّة ماء بعينه، «إِنما أَراد القُطَبِيَّة هَذَا الماءَ، فَجَمَعَهُ بِمَا حَوْلَه» [@lisan، ج1 ص683]."
  - term: "الذَّنُوبُ"
    text: "موضع أيضًا، كما يقول شوقي ضيف [@deif، ج1 ص184، الحاشية]. ولفظه في اللغة الدلو الملأى ماءً، لكنه هنا اسم مكان."
context: "مطلع القصيدة التي عُرف بها عَبِيد. يقول ابن سَلّام إن عَبِيدًا «قديم عظيم الذكر عظيم الشهرة وشعره مضطرب ذاهب لا أعرف له إلا قوله»، ثم ينشد هذا البيت ويقول: «ولا أدرى ما بعد ذلك» [@ibn-sallam، ج1 ص138–139]. فهو أثبت ما بقي له. ويقول ابن قُتَيْبة: «وأجود شعره قصيدته التى يقول فيها»: «أقفر من أهّلها ملحوب»، «وهى إحدى السّبع» [@ibn-qutayba، ج1 ص260]. وفي خبر مقتله أن الملك طلب منه أن ينشده هذه القصيدة، فقال مكانها: «أقفر من أهله عبيد، فاليوم لا يبدي ولا يعيد» [@ibn-qutayba، ج1 ص260]، والخبر في [عبيد يوم البؤس](/stories/abid-yawm-al-bus/)."
syntax:
  - "«أقفر» فعل ماض، و«ملحوب» فاعله مؤخّر، و«من أهله» جار ومجرور متعلق بـ«أقفر»، قُدّم على الفاعل، والضمير في «أهله» يعود على ملحوب المتأخر لفظًا المتقدم رتبة."
  - "«فالقطبيات» معطوف على «ملحوب» بالفاء، و«فالذنوب» معطوف عليه كذلك، أي أقفرت القطبيات والذنوب."
  - "الفاء هنا للترتيب في المكان، كأنه يعدّ المنازل على طريقه واحدًا بعد واحد، كما يفعل امرؤ القَيْس في «بين الدخول فحومل»."
morphology:
  - "«أقفر» على «أفعل» من القَفْر، وهو الأرض الخالية. والهمزة فيه للصيرورة: صار قفرًا."
  - "«ملحوب» على «مفعول»، علَم على موضع."
  - "«القطبيات» جمع مؤنث سالم للقُطَبيّة، جمعها الشاعر «بما حوله» كما يقول صاحب اللسان، وهو جمع يُطلق على المكان وما يجاوره."
rhetoric:
  thesis: "مطلع على الأطلال بلا وقوف ولا بكاء: يذكر المنازل خالية ويعدّها، والإقفار هو الفكرة التي تحمل القصيدة كلها، من خلوّ الديار إلى خلوّ العمر."
  devices:
    - title: "التصريع"
      text: "ختم الصدر بـ«ملحوبُ» على قافية العجز «الذنوبُ». وهو من عادة المطالع."
    - title: "تعداد الأماكن"
      text: "ثلاثة أسماء في بيت، وتليها ستة في البيتين التاليين: راكس وثعالبات وذات فرقين والقليب وعردة وقفا حبر. كثرة الأسماء تجعل الخلاء أوسع: ليس منزلًا واحدًا خلا، بل بلاد كاملة. وهذه قراءتنا."
    - title: "الإسناد إلى المكان"
      text: "جعل الفعل للمكان «أقفر ملحوب»، لا للقوم «رحل أهله»: فالمكان هو الذي فقد، والشاعر يشهد فقده. ومن هذا البيت أخذ عَبِيد عبارته في يوم مقتله حين جعل نفسه هو الذي أقفر: «أقفر من أهله عبيد»."
  connection: "ثم يتمّ عدّ المنازل في البيتين التاليين، ويقول إن الوحوش حلّت مكان أهلها."
prosody:
  meter: "مخلع البسيط"
  rhyme: "الرَّوِيّ الباء المضمومة، وقبلها واو أو ياء ردف"
  scansion: "أَقْفَرَ مِنْ / أَهْلِهِي / مَلْحُوبُو = مستعلن / فاعلن / مفعولن — فَلْقُطَبِيْ / يَاتُفَذْ / ذَنُوبُو = مستعلن / فاعلن / فعولن"
  note: "مخلّع البسيط عند عَتيق: «مستفعلن فاعلن فعولن ... مستفعلن فاعلن فعولن» [@atiq، ص50]، ويدخل الحشو الطيّ فتصير «مستفعلن» «مستعلن». والعجز هنا مستقيم على الوزن، أما آخر الصدر «مَلْحُوبُو» فـ«مفعولن» لا «فعولن». وهذا الاضطراب في القصيدة كلها، يقول شَوْقي ضَيْف: «فهى من مخلّع البسيط، وقلما يخلو بيت منها من حذف فى بعض تفاعيله أو زيادة على نحو ما نرى فى الشطر الأول من هذا المطلع» [@deif، ج1 ص184]. وقال صاحب اللسان إنها من «الشِّعْرِ الَّذِي كَسَّرَ بعضَه» [@lisan، ج1 ص683]، ونقل عن ابن سِيدَه: «الرَّمَل مِنَ الشِّعْر كُلُّ شِعْرٍ مَهْزُولٍ غَيْرِ مؤتَلِف الْبِنَاءِ»، ومثّل بهذا البيت [@lisan، ج11 ص296]."
variants:
  - reading: "أَقْفَرَ مِنْ أَهْلِهَا مَلْحُوبُ"
    status: "رواية ابن قُتَيْبة"
    note: "[@ibn-qutayba، ج1 ص260]. ويقول محققه شاكر: «والرواية هنا «من أهلها» شاذة» [@ibn-qutayba، ج1 ص260، الحاشية]."
