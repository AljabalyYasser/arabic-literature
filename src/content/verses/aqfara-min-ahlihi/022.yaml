first: "لَا يَعِظُ النَّاسُ مَنْ لَا يَعِظِ الدْـ"
second: "ـدَهْرُ وَلَا يَنْفَعُ التَّلْبِيبُ"
vocabulary:
  - term: "لَا يَعِظُ النَّاسُ مَنْ لَا يَعِظِ الدَّهْرُ"
    text: "«من لم يتَّعظ بالدهر فإن الناس لا يقدرون على عظته» [@tabrizi-ashr، ص328]."
  - term: "التَّلْبِيبُ"
    text: "«تكلف اللُّب من غير طباع ولا غريزة» [@tabrizi-ashr، ص328]."
