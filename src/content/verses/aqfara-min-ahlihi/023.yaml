first: "إِلَّا سَجِيَّاتُ مَا القُلُوبِ"
second: "وَكَمْ يَصِيرَنَّ شَانِئًا حَبِيبُ"
vocabulary:
  - term: "سَجِيَّاتُ مَا القُلُوبِ"
    text: "«ما» صلة، والمعنى: «لا ينفع التلبيب الا سجيات القلوب» [@tabrizi-ashr، ص328]، أي العقل الذي في الطبع."
  - term: "شَانِئًا"
    text: "«الشانئ: المبغض» [@tabrizi-ashr، ص328]، فكم من حبيب يصير عدوًّا."
