first: "فَدَبَّ مِنْ رَأْيِهَا دَبِيبًا"
second: "وَالعَيْنُ حِمْلَاقُهَا مَقْلُوبُ"
vocabulary:
  - term: "فَدَبَّ"
    text: "«يعني الثعلب لما رآها» [@tabrizi-ashr، ص333]."
  - term: "حِمْلَاقُهَا مَقْلُوبُ"
    text: "«من الفزع انقلب حملاق عينه»، والحملاق: «جفن العين» في قول [@tabrizi-ashr، ص333]، و«بياض العين ما خلا السواد» في قول آخر [@tabrizi-ashr، ص334]."
