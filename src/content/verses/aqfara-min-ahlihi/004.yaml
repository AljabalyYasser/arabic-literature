explained: false
first: "وَبُدِّلَتْ مِنْ أَهْلِهَا وُحُوشًا"
second: "وَغَيَّرَتْ حَالَهَا الخُطُوبُ"
vocabulary:
  - term: "وُحُوشًا"
    text: "بدّلت الديار بأهلها الوحش، فصارت مرعى لها."
  - term: "الخُطُوبُ"
    text: "الأمور العظيمة، وهي هنا حوادث الدهر. وفي لسان العرب: «جَلَّ الخَطْبُ أَي عَظُم الأَمرُ والشأْن» [@lisan، ج1 ص360]."
