first: "كَأَنَّهَا مِنْ حَمِيرِ عَانَاتٍ"
second: "جَوْنٌ بِصَفْحَتِهِ نُدُوبُ"
vocabulary:
  - term: "عَانَاتٍ"
    text: "جمع عانة: «والعانة: القطيع من حمر الوحش» [@lisan، ج13 ص300]."
  - term: "جَوْنٌ"
    text: "«الجون: يكون أبيض وأسود» [@tabrizi-ashr، ص330]."
  - term: "بِصَفْحَتِهِ نُدُوبُ"
    text: "«صفحته: جنبه»، و«ندوب: آثار العض» [@tabrizi-ashr، ص330]، عضّته الحمر في صراعها."
