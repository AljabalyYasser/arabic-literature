first: "مَنْ يَسْأَلِ النَّاسَ يَحْرِمُوهُ"
second: "وَسَائِلُ اللَّهِ لَا يَخِيبُ"
meaning: "من يطلب حاجته من الناس يمنعوه، ومن يطلبها من الله لا يرجع خائبًا."
vocabulary:
  - term: "يَحْرِمُوهُ"
    text: "يمنعوه ما سأل، من الحِرمان."
  - term: "يَخِيبُ"
    text: "يرجع بلا شيء، والخيبة: ألّا ينال المرء ما طلب."
context: "في وسط أبيات الحكمة، بعد قوله «وكل ذي غيبة يؤوب» وسؤاله «أعاقر مثل ذات رحم». ويرويه ابن قُتَيْبة فيما اختار من القصيدة [@ibn-qutayba، ج1 ص261]. وقال التِّبْرِيزِيّ: «قال ابن الأعرابي: هذا البيت ليزيد بن ضبة الثقفي» [@tabrizi-ashr، ص327]، فنسبته إلى عَبِيد مختلف فيها، ويرويه الناس له."
syntax:
  - "«من» اسم شرط جازم مبتدأ، و«يسألِ» فعل الشرط مجزوم، وكُسرت لامه لالتقاء الساكنين مع لام «الناس»، و«الناسَ» مفعول به."
  - "«يحرموه» جواب الشرط مجزوم بحذف النون، والواو فاعل، والهاء مفعول به، وجملة الشرط وجوابه خبر «مَن»."
  - "«وسائلُ الله» مبتدأ مضاف إلى لفظ الجلالة، وهو من إضافة اسم الفاعل إلى مفعوله، وجملة «لا يخيب» خبره."
  - "الشطر الأول شرط وجزاء، والثاني خبر ثابت: الحرمان من الناس معلّق بالسؤال، أما عطاء الله فحكم لا شرط فيه."
morphology:
  - "«يسأل» مضارع «سأل» مهموز العين."
  - "«يحرموه» مضارع «حرَم يحرِم» من باب ضرب، والحِرْمان مصدره."
  - "«سائل» اسم فاعل من «سأل»، و«يخيب» مضارع «خاب يخيب» أجوف يائي."
rhetoric:
  thesis: "مقابلة بين سؤالين: سؤال الناس يعود بالحرمان، وسؤال الله لا يعود بالخيبة. وهي من أبيات القصيدة التي يحفظها الناس."
  devices:
    - title: "المقابلة"
      text: "«من يسأل الناس» يقابل «سائل الله»، و«يحرموه» يقابل «لا يخيب». والمقابلة تضع الطريقين جنبًا إلى جنب فيختار السامع."
    - title: "اختلاف البناء بين الشطرين"
      text: "جاء الشطر الأول شرطًا «من يسأل... يحرموه»، والثاني اسمًا ثابتًا «وسائل الله لا يخيب». فالأول حال تتكرر كلما سأل المرء، والثاني صفة دائمة لسائل الله. وهذه قراءتنا."
    - title: "نفي الضد"
      text: "لم يقل «يُعطى» بل قال «لا يخيب»، فنفى الخيبة، وهي أخصّ من العطاء: قد يُعطى السائل غير ما طلب، ولكنه لا يرجع صفر اليدين."
  connection: "ثم يقول: «بالله يدرك كل خير»، ويصف الله بأنه لا شريك له، «علّام ما أخفت القلوب»."
prosody:
  meter: "مخلع البسيط"
  rhyme: "الرَّوِيّ الباء المضمومة، مردوفة بالياء"
  scansion: "مَنْ يَسْأَلِنْ / نَاسَيَحْ / رِمُوهُو = مستفعلن / فاعلن / فعولن — وَسَائِلُلْ / لَاهِلَا / يَخِيبُو = متفعلن / فاعلن / فعولن"
  note: "البيت مستقيم على وزن مخلّع البسيط «مستفعلن فاعلن فعولن» [@atiq، ص50]، وفي أول العجز الخبن «متفعلن». وتُشبع ضمة الهاء في «يحرموه» فتصير «هو» لتمام «فعولن»."
