first: "فَعَرْدَةٌ فَقَفَا حِبِرٍّ"
second: "لَيْسَ بِهَا مِنْهُمُ عَرِيبُ"
vocabulary:
  - term: "فَعَرْدَةٌ فَقَفَا حِبِرٍّ"
    text: "موضعان، ويروى «ففَرْدة» و«فقفا عِبِر» [@tabrizi-ashr، ص324]. وفي لسان العرب: «وحِبِرٌّ: مَوْضِعٌ مَعْرُوفٌ فِي الْبَادِيَةِ. وأَنشد شَمِرٌ عَجُزَ بَيْتٍ: فَقَفا حِبِرّ» [@lisan، ج4 ص162]."
  - term: "عَرِيبُ"
    text: "«أحد، لا يستعمل إلا في النفي» [@tabrizi-ashr، ص324]."
