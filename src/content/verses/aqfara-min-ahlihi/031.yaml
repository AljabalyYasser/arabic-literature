first: "أَخْلَفَ مَا بَازِلًا سَدِيسُهَا"
second: "لَا حِقَّةٌ هِيَ وَلَا نَيُوبُ"
vocabulary:
  - term: "أَخْلَفَ مَا بَازِلًا سَدِيسُهَا"
    text: "«ما» صلة، «يقول: سقط السَّديس وأخلف مكانه البازل»، و«أخلف: أتى عليها سنة بعد ما بزلت» [@tabrizi-ashr، ص330]، فهي في تمام قوتها."
  - term: "حِقَّةٌ"
    text: "الناقة في سنتها الرابعة، أي ليست صغيرة. قال أبو عبيد: «البعير إذا استكمل السنة الثالثة ودخل في الرابعة فهو حينئذ حق، والأنثى حقة» [@lisan، ج10 ص55]."
  - term: "نَيُوبُ"
    text: "الناقة المسنّة، أي ليست هرمة: «والنَّابُ والنَّيُوبُ: الناقةُ المُسِنَّة» [@lisan، ج1 ص776]."
