first: "وَكُلُّ ذِي غَيْبَةٍ يَؤُوبُ"
second: "وَغَائِبُ المَوْتِ لَا يَؤُوبُ"
meaning: "كل غائب يرجع يومًا إلى أهله، إلا من غاب بالموت فإنه لا يرجع أبدًا."
vocabulary:
  - term: "غَيْبَةٍ"
    text: "غياب، وهو هنا السفر والبعد عن الأهل."
  - term: "يَؤُوبُ"
    text: "يرجع، والإياب: الرجوع."
  - term: "غَائِبُ المَوْتِ"
    text: "الذي غيّبه الموت، أضاف الغائب إلى سبب غيبته."
context: "من أبيات الحكمة التي تتوسط القصيدة (14–26)، بعد أن قال: كل ذي نعمة تُسلب نعمته، وكل ذي إبل تورث إبله. وهو من الأبيات التي اختارها ابن قُتَيْبة منها [@ibn-qutayba، ج1 ص261]. ويقابله ما يُروى عن عَبِيد في يوم موته: «إِن مت مَا ضرني»، حين خيّره الملك في قتلته [@khizana، ج2 ص218]."
syntax:
  - "«كلُّ» مبتدأ مضاف إلى «ذي»، و«ذي» مضاف إلى «غيبة»، وجملة «يؤوب» خبر المبتدأ."
  - "الواو في «وغائبُ الموت» عاطفة جملة على جملة، و«غائبُ» مبتدأ مضاف إلى «الموت» إضافة سببية، وجملة «لا يؤوب» خبره، و«لا» نافية."
  - "البيت جملتان متقابلتان على بناء واحد: مبتدأ ثم «يؤوب»، ثم مبتدأ ثم «لا يؤوب»، فالفرق كله في حرف النفي."
morphology:
  - "«يؤوب» مضارع «آب يؤوب أَوْبًا وإيابًا»، أجوف واوي، والواو فيه عين الفعل مضمومة الهمزة قبلها."
  - "«غَيْبة» على «فَعْلة» من غاب يغيب، مصدر للمرة أو للحال."
  - "«غائب» اسم فاعل من غاب، أجوف يائي، قُلبت عينه همزة لوقوعها بعد ألف «فاعل»."
rhetoric:
  thesis: "حكمة في نصف سطر: الغياب كله عارض إلا غياب الموت. صارت مثلًا لأنها تُقال عند كل فقد."
  devices:
    - title: "رد العجز على الصدر"
      text: "ختم الصدر بـ«يؤوب» وأعادها في آخر العجز منفية «لا يؤوب». والتكرار هنا ليس قافية مكررة فحسب، بل هو الحجة نفسها: الكلمة التي تثبت الرجوع في الشطر الأول هي التي تنفيه في الثاني. وهذه قراءتنا."
    - title: "المقابلة"
      text: "«كل ذي غيبة» يقابل «غائب الموت»، و«يؤوب» يقابل «لا يؤوب». وبالمقابلة يخرج غائب الموت من العموم الذي بدأ به الشطر الأول."
    - title: "الإيجاز"
      text: "لم يذكر الحزن ولا البكاء، وترك السامع يعرف من نفي الإياب وحده أن الفقد بالموت لا عوض فيه."
  connection: "ثم يسأل: أتستوي العاقر والولود، والغانم والخائب؟ ويقول بعدها: «من يسأل الناس يحرموه»."
prosody:
  meter: "مخلع البسيط"
  rhyme: "الرَّوِيّ الباء المضمومة، مردوفة بالواو"
  scansion: "وَكُلْلُ ذِي / غَيْبَتِنْ / يَؤُوبُو = متفعلن / فاعلن / فعولن — وَغَائِبُلْ / مَوْتِلَا / يَؤُوبُو = متفعلن / فاعلن / فعولن"
  note: "البيت مستقيم على وزن مخلّع البسيط «مستفعلن فاعلن فعولن» [@atiq، ص50]، دخل الخبن، وهو حذف الثاني الساكن، أول الشطرين فصارت «مستفعلن» «متفعلن». والقصيدة كثيرة الخروج عن الوزن، وهذا البيت من أبياتها المستقيمة. وكلمة القافية «يؤوب» مكررة في الشطرين، وهو جائز لأن الأولى ليست قافية."
