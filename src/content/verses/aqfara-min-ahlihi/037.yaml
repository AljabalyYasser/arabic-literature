first: "كَأَنَّهَا لِقْوَةٌ طَلُوبُ"
second: "تَخِرُّ فِي وَكْرِهَا القُلُوبُ"
meaning: "كأن فرسي في سرعتها عُقاب تطلب الصيد، تتساقط في عشّها قلوب الطير التي صادتها."
vocabulary:
  - term: "لِقْوَةٌ"
    text: "«اللَّقوة: العُقاب، سميت بذلك لأنها سريعة التلقي لما تطلب» [@tabrizi-ashr، ص331]."
  - term: "طَلُوبُ"
    text: "كثيرة الطلب للصيد، على صيغة المبالغة."
  - term: "تَخِرُّ"
    text: "تسقط."
  - term: "وَكْرِهَا"
    text: "عشّها في أعلى الجبل."
  - term: "القُلُوبُ"
    text: "«يعني قلوب الطير» [@tabrizi-ashr، ص331–332]، تأكل العقاب صيدها وتترك قلوبه في وكرها."
context: "بعد أبيات الحكمة يعود عَبِيد إلى شبابه: «فذاك عصر وقد أراني تحملني نهدة سرحوب» (34)، ثم يصف فرسه، ثم يشبهها بالعقاب في هذا البيت، فيترك الفرس وتأخذ العقاب أحد عشر بيتًا في صيد ثعلب (38–48)، وبها تنتهي القصيدة. فهذا البيت باب المشهد الذي يختم به القصيدة."
syntax:
  - "«كأنّ» حرف تشبيه ونصب، والضمير «ها» اسمها يعود على الفرس «نهدة سرحوب»، و«لِقوة» خبرها، و«طلوب» نعت لها."
  - "جملة «تخرّ في وكرها القلوب» نعت ثان لـ«لقوة»، و«القلوب» فاعل «تخرّ» مؤخر، و«في وكرها» متعلق بـ«تخرّ»."
morphology:
  - "«لِقْوة» على «فِعْلة»، ويقال فيها «لَقْوة» بالفتح، وسماها التِّبْرِيزِيّ من التلقي، أي سرعة الأخذ."
  - "«طَلوب» على «فَعول» من صيغ المبالغة، من طلب."
  - "«تخِرّ» مضارع «خرّ يخِرّ» مضعّف، من باب ضرب."
  - "«القلوب» جمع قلب على «فُعول»، جمع كثرة."
rhetoric:
  thesis: "تشبيه السرعة بالعقاب، ثم ينسى الشاعر المشبَّه ويمضي في المشبَّه به حتى يصير قصة قائمة بنفسها، وهذه طريقة الجاهليين في التشبيه الممتد."
  devices:
    - title: "التشبيه"
      text: "شبّه الفرس بالعقاب في السرعة والانقضاض. والمشبه به لا يُذكر وحده بل بصفة تدل على شدته: عقاب «طلوب»، في وكرها قلوب الطير، فهي صائدة لا تُخطئ. انظر مفهوم [التشبيه](/concepts/al-tashbih/)."
    - title: "الاستطراد إلى المشبه به"
      text: "صفة «تخرّ في وكرها القلوب» لا صلة لها بالفرس، بل بالعقاب وحدها. ومنها يبدأ الشاعر يصف العقاب لذاتها: ليلتها على العلم، وصباحها البارد، والثعلب. وهذه قراءتنا."
    - title: "قلوب الطير في الوكر"
      text: "يذكر التِّبْرِيزِيّ رواية أخرى: «ويروى (تيبس في وكرها القُلُوب)» [@tabrizi-ashr، ص332]. وهي أقرب إلى صورة يعرفها القارئ من امرئ القَيْس، في وصف عقاب شبّه بها فرسه أيضًا، إذ جعل قلوب الطير الرطبة واليابسة عند وكرها كالعنّاب والحشف البالي، في [ألا عم صباحًا](/texts/ala-im-sabahan/). فالصورة كانت مشتركة بين شاعرين متعاصرين من أرض واحدة، ولا نعرف أيهما سبق."
  connection: "ثم يقول إنها باتت على علم لا تأكل شيئًا كأنها عجوز ثكلى، ثم أصبحت في غداة باردة فأبصرت ثعلبًا."
prosody:
  meter: "مخلع البسيط"
  rhyme: "الرَّوِيّ الباء المضمومة، مردوفة بالواو"
  scansion: "كَأَنْنَهَا / لِقْوَتُنْ / طَلُوبُو = متفعلن / فاعلن / فعولن — تَخِرْرُفِي / وَكْرِهَلْ / قُلُوبُو = متفعلن / فاعلن / فعولن"
  note: "البيت مستقيم على وزن مخلّع البسيط «مستفعلن فاعلن فعولن» [@atiq، ص50]، وفي أول الشطرين الخبن «متفعلن»."
