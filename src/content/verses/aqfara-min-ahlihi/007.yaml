first: "عَيْنَاكَ دَمْعُهُمَا سَرُوبُ"
second: "كَأَنَّ شَأْنَيْهِمَا شَعِيبُ"
vocabulary:
  - term: "سَرُوبُ"
    text: "سائل، من «سرب الماء يسرب» [@tabrizi-ashr، ص325]."
  - term: "شَأْنَيْهِمَا"
    text: "الشأن: مجرى الدمع [@tabrizi-ashr، ص325]."
  - term: "شَعِيبُ"
    text: "«المزادة المنشقة» [@tabrizi-ashr، ص325]، فالدمع يسيل منهما كما يسيل الماء من قربة مشقوقة."
