explained: false
first: "فَنَفَضَتْ رِيشَهَا وَوَلَّتْ"
second: "فَذَاكَ مِنْ نَهْضَةٍ قَرِيبُ"
vocabulary:
  - term: "فَنَفَضَتْ رِيشَهَا"
    text: "«نفضت الجليد عن ريشها» [@tabrizi-ashr، ص332]."
  - term: "فَذَاكَ مِنْ نَهْضَةٍ قَرِيبُ"
    text: "«النهضة: الطيران» [@tabrizi-ashr، ص332]، و«هي قريب أن تنهض إذا ما رأت صيدها» [@tabrizi-ashr، ص333]."
context: "يذكر التِّبْرِيزِيّ في نفض العقاب الجليد قولين: أنها «أنشط ما تكون في يوم الطل»، وأنها «تسرع إلى أفراخها، خوفا عليها من المطر والبرد»، ثم يقول: «وبيت عبيد يدل على خلاف هذا؛ لأنه لم يقل إنها راحت إلى أفراخها، بل وصفها بأنها أصبحت والضريب على ريشها فطارت إلى الثعلب» [@tabrizi-ashr، ص332–333]."
