first: "مُضَبَّرٌ خَلْقُهَا تَضْبِيرًا"
second: "يَنْشَقُّ عَنْ وَجْهِهَا السَّبِيبُ"
vocabulary:
  - term: "مُضَبَّرٌ"
    text: "موثق [@tabrizi-ashr، ص331]، مجتمع الخلق."
  - term: "يَنْشَقُّ عَنْ وَجْهِهَا السَّبِيبُ"
    text: "«السبيب ههنا: شعر الناصية، يقول: هي حادة البصر، فناصيتها لا تستر بصرها» [@tabrizi-ashr، ص331]."
