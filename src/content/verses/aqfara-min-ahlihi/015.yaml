first: "وَكُلُّ ذِي إِبِلٍ مَوْرُوثٌ"
second: "وَكُلُّ ذِي سَلَبٍ مَسْلُوبُ"
vocabulary:
  - term: "مَوْرُوثٌ"
    text: "يموت فيرث إبله غيره، ويروى «مُورَثُها»."
  - term: "وَكُلُّ ذِي سَلَبٍ مَسْلُوبُ"
    text: "«من كان له شيء سلبه من غيره فهو يُسلب يوما ايضا، ولم يدم ذلك له» [@tabrizi-ashr، ص326]."
