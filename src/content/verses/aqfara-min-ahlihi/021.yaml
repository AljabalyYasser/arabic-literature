first: "أَفْلِحْ بِمَا شِئْتَ فَقَدْ يُبْلَغُ بِالضْـ"
second: "ـضَعْفِ وَقَدْ يُخْدَعُ الأَرِيبُ"
meaning: "عش كما شئت، ولا تحمل همّ الحيلة: فقد ينال الضعيف بضعفه ما لا يناله القوي، وقد يُخدع العاقل الماهر عن عقله."
vocabulary:
  - term: "أَفْلِحْ"
    text: "من الفلاح، «وهو البقاء؟ أي عش كيف شئت»، ويروى «أفلج» بالجيم [@tabrizi-ashr، ص327]."
  - term: "بِالضَّعْفِ"
    text: "«فقد يدرك الضعيف بضعفه ما لا يدرك القوي» [@tabrizi-ashr، ص327]."
  - term: "الأَرِيبُ"
    text: "العاقل الماهر، و«قد يخدع الأريب العاقل عن عقله» [@tabrizi-ashr، ص327]."
context: "هذا البيت الذي جعل به الحُطَيْئة عَبِيدًا أشعر الناس: «سأل سعيد بن العاصي الحطيئة: من أشعر الناس؟ قال: الذي يقول (أفلح بما شئت. . . البيت)» [@tabrizi-ashr، ص327]. وهو في أبيات القصيدة التي يرويها ابن قُتَيْبة، وفيها «افلح» بهمزة وصل، ويقول محققه شاكر: «وفى أكثر الروايات «أفلح» من الرباعى» [@ibn-qutayba، ج1 ص261، الحاشية]."
syntax:
  - "«أفلحْ» فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت، و«بما» جار ومجرور، و«ما» موصولة أو مصدرية، و«شئت» صلتها."
  - "الفاء في «فقد» تعليلية تربط الأمر بسببه، و«قد» مع المضارع للتقليل، أي: ربما بلغ المرء بالضعف."
  - "«يُبلَغ» مضارع مبني للمجهول، ونائب الفاعل محذوف يُفهم من السياق، أي يُبلغ المطلوب، و«بالضعف» جار ومجرور متعلق به."
  - "«وقد يُخدع الأريبُ» جملة معطوفة، و«الأريبُ» نائب فاعل."
morphology:
  - "«أفلحْ» أمر من «أفلح يفلح» على «أفعل»، ومن رواه «افلحْ» جعله من الثلاثي «فلح»."
  - "«الضَّعف» مصدر ضعُف، ويقال فيه الضُّعف بالضم."
  - "«الأريب» على «فعيل» من الإرْب، وهو الدهاء والعقل."
rhetoric:
  thesis: "حكمة رجل جرّب الدهر: الأسباب لا تضمن النتائج، فقد ينجح الضعيف ويُخدع الذكي، فعش ولا تُثقل نفسك بالحيلة."
  devices:
    - title: "الطباق"
      text: "بين «الضعف» و«الأريب»: الضعيف الذي يُنتظر أن يخيب ينال، والأريب الذي يُنتظر أن ينال يُخدع. والطباق هنا يقلب المتوقع في الحالين."
    - title: "التقليل بـ«قد»"
      text: "كرر «قد» مع المضارع مرتين، وهي هنا للتقليل والاحتمال: لا يقول إن الضعيف ينجح دائمًا، بل إن ذلك يقع. وبهذا تبقى الحكمة صادقة لا مبالغة فيها."
    - title: "الأمر للإباحة"
      text: "«أفلح بما شئت» أمر لا يراد به الإلزام، بل الإذن والتخفيف، كأنه يرفع عن المخاطب همّ التدبير."
  connection: "ويليه قوله: «لا يعظ الناس من لا يعظ الدهر»، فيكمل فكرة أن التجربة وحدها تعلّم."
prosody:
  meter: "مخلع البسيط"
  rhyme: "الرَّوِيّ الباء المضمومة، مردوفة بالياء"
  scansion: "أَفْلِحْ بِمَا / شِئْتَفَقَدْ / يُبْلَغُبِضْ = مستفعلن / مستعلن / مستعلن — ضَعْفِوَقَدْ / يُخْدَعُلْ / أَرِيبُو = مستعلن / فاعلن / فعولن"
  note: "العجز مستقيم على مخلّع البسيط «مستفعلن فاعلن فعولن» [@atiq، ص50]، أما الصدر فثلاث تفعيلات رباعية: «مستفعلن مستعلن مستعلن»، فهو أطول من الوزن بمقطعين. وهذه «الزيادة» التي يقول شَوْقي ضَيْف إنها قلما يخلو منها بيت في القصيدة [@deif، ج1 ص184]. والكلمة «الضَّعف» مقسومة بين الشطرين، فلامها الشمسية آخر الصدر وبقيتها أول العجز، وهو التدوير."
