first: "بَلْ رُبَّ مَاءٍ وَرَدْتُهُ آجِنٍ"
second: "سَبِيلُهُ خَائِفٌ جَدِيبُ"
vocabulary:
  - term: "آجِنٍ"
    text: "متغير [@tabrizi-ashr، ص329]."
  - term: "خَائِفٌ"
    text: "«أراد إنه مخُوف المسلك، وقد يقوم الفاعل مقام المفعول» [@tabrizi-ashr، ص329]."
  - term: "جَدِيبُ"
    text: "لا نبت فيه، من الجدب، وفي لسان العرب: «الجَدْبُ: المَحْل نَقِيضُ الخِصْبِ» [@lisan، ج1 ص254]."
