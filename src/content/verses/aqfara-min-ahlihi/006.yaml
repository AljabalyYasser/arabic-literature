explained: false
first: "إِمَّا قَتِيلٌ وَإِمَّا هَالِكٌ"
second: "وَالشَّيْبُ شَيْنٌ لِمَنْ يَشِيبُ"
vocabulary:
  - term: "إِمَّا قَتِيلٌ وَإِمَّا هَالِكٌ"
    text: "«يريد إما أن يكون ذلك المحروب قتيلا وإما أن يكون هالكا» [@tabrizi-ashr، ص324]."
  - term: "وَالشَّيْبُ شَيْنٌ"
    text: "«إن لم يُقتل وعُمر حتى يشيب فشيبه شين له، وكانوا يستحبُّون أن يموت الرجل وفيه بقية قبل أن يفرط به الكبر» [@tabrizi-ashr، ص324]."
  - term: "شَيْنٌ"
    text: "عيب: «الشَّيْنُ: مَعْرُوفٌ خِلَافُ الزَّيْن» [@lisan، ج13 ص244]."
