first: "عَضَّ بِمَا أَبْقَى الْمَوَاسِي لَهُ"
second: "مِنْ أُمِّهِ فِي الزَّمَنِ الْغَابِرِ"
meaning: "هذا هو «مَنْطِقٌ سَائِرٌ» الذي أقسم في البيتين السابقين أن يرمي به عَلْقَمة: فليعضّ عَلْقَمةُ ما أبقته موسى الخاتنة من فرج أمه حين خُتنت قديمًا. وما تبقيه الموسى من فرج المرأة هو البَظْر، وفي اللسان: «البَظْرُ: مَا بَيْنَ الإِسْكَتَيْنِ مِنَ المرأَة، وَفِي الصِّحَاحِ: هَنَةٌ بَيْنَ الإِسْكَتَيْن لَمْ تُخْفَضْ» [@lisan، ج4 ص70]، والإسكتان شفرا الفرج، والخفض ختان المرأة. ويقول المحقق: «المواسي جمع موسى، يقطع به الشيء الزائد في العورة عند الاختتان» [@diwan-asha، ص181]. فالبيت بلغة اليوم شتيمة صريحة: عضّ بظر أمك، وهي شتيمة كانت العرب تقولها، فجعلها الأَعْشَى شعرًا يسير بين الناس."
vocabulary:
  - term: "عَضَّ"
    text: "دعاء عليه بصيغة الماضي، أي: ليعضّ. وهو من صيغ الشتم عندهم: أن يُؤمر الرجل بأن يعضّ عورة أبيه أو أمه. وفي اللسان في حديث النهي عن دعوى الجاهلية: «فأَعِضُّوه بِهَنِ أَبيه وَلَا تَكْنُوا»، «أَي قُولوا لَهُ: اعْضَضْ بأَيْرِ أَبيك ولا تكنوا عن الأَير بَالْهَنِ»، ثم أنشد هذا البيت [@lisan، ج7 ص188]. والأَيْر الذَّكَر، والهَن كناية عنه."
  - term: "الْمَوَاسِي"
    text: "جمع مُوسى، «والموسى: ما يحلق به» [@lisan، ج15 ص391]، والمراد هنا موسى الخاتنة."
  - term: "بِمَا أَبْقَى الْمَوَاسِي لَهُ مِنْ أُمِّهِ"
    text: "بما تركته الموسى من فرج أمه عند ختانها، وهو البظر: «هَنَةٌ بَيْنَ الإِسْكَتَيْن لَمْ تُخْفَضْ» [@lisan، ج4 ص70]."
  - term: "الْغَابِرِ"
    text: "الماضي: «قال الأعشى في الغابر بمعنى الماضي»، وأنشد البيت، ثم: «أراد الماضي» [@lisan، ج5 ص4]. ويقول المحقق: «الزمن الغابر الذاهب القديم» [@diwan-asha، ص181]."
syntax:
  - "«عَضَّ»: فعل ماض لفظًا، معناه الدعاء، وفاعله ضمير مستتر يعود على عَلْقَمة، و«بِمَا» جار ومجرور متعلق به، و«ما» اسم موصول."
  - "«أَبْقَى الْمَوَاسِي لَهُ»: صلة الموصول، و«المواسي» فاعل «أبقى» مرفوع بضمة مقدرة على الياء، والعائد محذوف، أي: أبقته. و«لَهُ» متعلق بـ«أبقى»، والهاء لعَلْقَمة."
  - "«مِنْ أُمِّهِ»: جار ومجرور في موضع الحال من العائد المحذوف، و«من» للتبعيض، أي: شيئًا من أمه. و«فِي الزَّمَنِ الْغَابِرِ» متعلق بـ«أبقى»."
morphology:
  - "«مَوَاسِي» جمع «مُوسَى» على «مَفاعِل». واختُلف في وزن «موسى»: هي عند الفرّاء «فُعْلى» مؤنثة، كما ينقل صاحب اللسان، وفيه أيضًا: «أَوْسَيتُ الشيءَ: حَلَقْته بالمُوسى» [@lisan، ج15 ص391]، فمن أخذها من «أَوْسَى» جعل الميم زائدة ووزنها «مُفْعَل»."
  - "«الْغَابِر» اسم فاعل من «غَبَرَ»، وهو من الأضداد: يكون للماضي وللباقي، وهو هنا الماضي كما في اللسان [@lisan، ج5 ص4]."
  - "«عَضَّ» ماضي «عَضَّ يَعَضُّ»، مضعف، أصله «عَضِضَ» أُدغمت فيه الضاد في الضاد."
rhetoric:
  thesis: "أفحش ما في القصيدة: بعد مدح عامر ولوم عَلْقَمة، ينزل الأَعْشَى إلى الشتيمة بعورة الأم، ويقول إن هذا القول سيسير. فهو هجاء يُراد به أن يُحفظ ويُتناقل، كما يحفظ الناس الأمثال."
  devices:
    - title: "الكناية عن البظر"
      text: "لم يسمّ العضو، بل قال «بِمَا أَبْقَى الْمَوَاسِي»، فدلّ عليه بأثر الختان فيه. وهذه الكناية تطابق تعريف اللغويين للبظر بأنه «هَنَةٌ بَيْنَ الإِسْكَتَيْن لَمْ تُخْفَضْ» [@lisan، ج4 ص70]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. لكنها هنا لا تستر شيئًا، بل تزيد الشتيمة قبحًا، لأنها تجعل السامع يتخيل الختان نفسه."
    - title: "الشتيمة الجاهلية في الشعر"
      text: "«عَضَّ» صيغة شتم كانت العرب تقولها نثرًا، وجاء النهي عنها في الإسلام، كما يذكر صاحب اللسان في حديث «فأَعِضُّوه بِهَنِ أَبيه» [@lisan، ج7 ص188]. فأدخل الأَعْشَى كلام المشاتمة في الشعر بلفظه تقريبًا. وهذه قراءتنا."
    - title: "تعيير الأم"
      text: "لا يهجو عَلْقَمة في نفسه، بل في أمه: يجعلها امرأة لم يُتمّ ختانها. وكانت العرب تعيّر بذلك، وفي اللسان أن قولهم «يا ابن مقطِّعة البظور» تقوله العرب «فِي مَعْرِضِ الذَّم وإِن لَمْ تَكُنْ أُمُّ مَنْ يُقَالُ لَهُ هَذَا خَاتِنَةً» [@lisan، ج4 ص70]."
  connection: "ثم يتمّ صفة ما أبقته المواسي في البيت التالي: «وكنّ قد أبقين منها أذى»."
prosody:
  meter: "البحر السريع"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "عَضْضَ بِمَا / أَبْقَلْ مَوَا / سِي لَهُو = مستعلن / مستفعلن / فاعلن — مِنْ أُمْمِهِي / فِزْ زَمَنِلْ / غَابِرِي = مستفعلن / مستعلن / فاعلن"
  note: "وزن السريع: «مستفعلن مستفعلن فاعلن» [@atiq، ص86]. ودخل الطيّ، وهو «حذف الرابع الساكن، وعلى هذا تصير مستفعلن مستعلن» [@atiq، ص87]، التفعيلة الأولى من الصدر والثانية من العجز. والعروض والضرب «فاعلن»، وهي العروض «مطوية مكسوفة» وضربها مثلها [@atiq، ص87]. وأُشبعت ضمة الهاء في «لهُ» وكسرتها في «أمِّهِ» فنُطقتا «لهو» و«أمّهي»."
context: "يأتي بعد أن أقسم الأَعْشَى في البيتين 37–38 ليأتينّ عَلْقَمة «منطق سائر مستوسق للمسمع الآثر»، أي قول سائر يتناقله الناس. والبيتان 39–40 هما ذلك القول. ويقول المحقق إن الأَعْشَى انتقل إلى عَلْقَمة في البيت 14 «فجأة» [@diwan-asha، ص176]. وأنشد صاحب اللسان البيت في موضعين: شاهدًا على الإعضاض [@lisan، ج7 ص188]، وعلى «الغابر» بمعنى الماضي [@lisan، ج5 ص4]. وأنشد في «الموسى» هجاءً على المعنى نفسه لزياد الأعجم: «فَإِنْ تَكُنِ الْمُوسَى جَرَتْ فَوْقَ بَظْرِهَا ... فَمَا خُتِنَتْ إِلَّا وَمَصَّانُ قَاعِدُ» [@lisan، ج15 ص391]، فتعيير الرجل بختان أمه باب معروف في الهجاء."
