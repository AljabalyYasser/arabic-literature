explained: false
first: "عَضَّ بِمَا أَبْقَى الْمَوَاسِي لَهُ"
second: "مِنْ أُمِّهِ فِي الزَّمَنِ الْغَابِرِ"
vocabulary:
  - term: "عَضَّ"
    text: "دعاء عليه بصيغة الماضي، وهو من صيغ الشتم عندهم: أن يقال للرجل اعضض بعورة أبيه أو أمه. وقد أنشد صاحب اللسان هذا البيت في باب الإعضاض [@lisan، ج7 ص188]."
  - term: "الْمَوَاسِي"
    text: "جمع مُوسى، «والموسى: ما يحلق به» [@lisan، ج15 ص391]. ويقول المحقق: «المواسي جمع موسى، يقطع به الشيء الزائد في العورة عند الاختتان» [@diwan-asha، ص181]، فالمراد ما بقي من فرج أمه بعد خفضها، يعيّره بأنها لم تُختن ختانًا تامًّا."
  - term: "الْغَابِرِ"
    text: "الماضي: «قال الأعشى في الغابر بمعنى الماضي»، وأنشد البيت، ثم: «أراد الماضي» [@lisan، ج5 ص4]."
