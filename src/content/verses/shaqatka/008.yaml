first: لَيْسَتْ بِسَوْدَاءَ وَلَا عِنْفِصٍ
second: تُسَارِقُ الطَّرْفَ إِلَى الدَّاعِرِ
vocabulary:
- term: عِنْفِصٍ
  text: «العِنْفِصُ، بِالْكَسْرِ، المرأَةُ الْبَذِيَّةُ القليلةُ الْحَيَاءِ» [@lisan، ج7 ص55]، وأنشد صاحب اللسان البيت.
- term: تُسَارِقُ الطَّرْفَ
  text: تنظر خِلسة.
- term: الدَّاعِرِ
  text: الفاجر الخبيث.
