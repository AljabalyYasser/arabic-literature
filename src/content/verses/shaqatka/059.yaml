explained: false
first: يَجْمَعُ خَضْرَاءَ لَهَا سَوْرَةٌ
second: تَعْصِفُ بِالدَّارِعِ وَالحَاسِرِ
vocabulary:
- term: خَضْرَاءَ
  text: 'كتيبة سوداء من كثرة الحديد. يقول المحقق: «خضراء كتيبة يعلوها الحديد فهى خضراء، والعرب تسمى الأسود أخضر احيانا» [@diwan-asha، ص183].'
- term: سَوْرَةٌ
  text: 'حِدّة: «سَوْرَةُ الخمرِ وَغَيْرِهَا وسُوَارُها: حِدَّتُها» [@lisan، ج4 ص384].'
- term: تَعْصِفُ
  text: '«والحَرب تَعْصِف بِالْقَوْمِ: تَذهَب بِهِمْ وتُهْلِكُهم» [@lisan، ج9 ص249].'
- term: بِالدَّارِعِ وَالحَاسِرِ
  text: بلابس الدرع ومن لا درع عليه.
