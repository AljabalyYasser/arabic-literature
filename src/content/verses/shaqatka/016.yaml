first: وَاللَّابِسِ الخَيْلَ بِخَيْلٍ إِذَا
second: ثَارَ غُبَارُ الكَبَّةِ الثَّائِرِ
vocabulary:
- term: وَاللَّابِسِ الخَيْلَ بِخَيْلٍ
  text: الذي يخلط خيله بخيل عدوه في القتال.
- term: الكَبَّةِ
  text: 'شدة القتال: «الكَبَّة، بِالْفَتْحِ: شِدَّة الشَّيْءِ ومُعْظَمُه» [@lisan، ج1 ص695].'
