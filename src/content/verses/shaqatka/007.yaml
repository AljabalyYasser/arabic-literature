first: يَشْفِي غَلِيلَ النَّفْسِ لَاهٍ بِهَا
second: حَوْرَاءُ تُصْبِي نَظَرَ النَّاظِرِ
vocabulary:
- term: غَلِيلَ
  text: حرارة العطش، وهي هنا حرارة الشوق.
- term: لَاهٍ بِهَا
  text: من يلهو بها.
- term: حَوْرَاءُ
  text: شديدة بياض العين في شدة سوادها.
- term: تُصْبِي
  text: تستميل.
