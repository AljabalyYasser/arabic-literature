first: إِنْ تَرْجِعِ الحُكْمَ إِلَى أَهْلِهِ
second: فَلَسْتَ بِالمُسْتِي وَلَا النَّائِرِ
vocabulary:
- term: بِالمُسْتِي وَلَا النَّائِرِ
  text: 'المستي من أَسْتى الثوب، أي أقام سَداه، وهي خيوطه الممدودة، والنائر صاحب النِّير: «والنِّيرُ: العَلَمُ، وَفِي الصِّحَاحِ: عَلَمُ الثَّوْبِ ولُحْمته أَيضاً» [@lisan، ج5 ص246]. يقول المحقق: «يريد ان يقول له لست شيئا» [@diwan-asha، ص179].'
