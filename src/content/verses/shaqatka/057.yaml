first: شَتَّانَ مَا يَوْمِي عَلَى كُورِهَا
second: وَيَوْمُ حَيَّانَ أَخِي جَابِرِ
vocabulary:
- term: شَتَّانَ مَا
  text: 'ما أبعد ما بين، وأنشد صاحب اللسان البيت وقال: «مَعْنَاهُ: تَباعَدَ الَّذِي بَيْنَهُمَا» [@lisan، ج2 ص49].'
- term: كُورِهَا
  text: 'رحلها: «الكُورُ، بِالضَّمِّ: الرَّحْلُ، وَقِيلَ: الرَّحْلُ بأَداته» [@lisan، ج5 ص154].'
