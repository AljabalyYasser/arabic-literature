explained: false
first: وَكُلِّ مِرْنَانٍ لَهُ أَزْمَلٌ
second: وَلَيِّنٍ أَكْعُبُهُ حَادِرِ
vocabulary:
- term: مِرْنَانٍ
  text: 'قوس تُصوّت إذا رُمي عنها: «وَقَوْسٌ مُرِنٌّ ومِرْنانٌ» [@lisan، ج13 ص187].'
- term: أَزْمَلٌ
  text: صوت.
- term: وَلَيِّنٍ أَكْعُبُهُ
  text: ورمح ليّن، وكعوبه عُقَد قناته.
- term: حَادِرِ
  text: غليظ.
