first: وَكُلِّ جَوْبٍ مُتْرَصٍ صُنْعُهُ
second: وَصَارِمٍ ذِي رَوْنَقٍ بَاتِرِ
vocabulary:
- term: جَوْبٍ
  text: تُرس.
- term: مُتْرَصٍ
  text: 'مُحكم: «التَّرِيصُ: المحكمُ، تَرُصَ الشيءُ تَراصةً، فَهُوَ مُتْرَصٌ وتَرِيص» [@lisan، ج7 ص10].'
- term: وَصَارِمٍ
  text: وسيف قاطع.
- term: رَوْنَقٍ
  text: بريق السيف وماؤه.
- term: بَاتِرِ
  text: قاطع.
