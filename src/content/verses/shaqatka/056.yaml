first: زَيَّافَةٍ بِالرَّحْلِ خَطَّارَةٍ
second: تُلْوِي بِشَرْخَيْ مَيْسَةٍ قَاتِرِ
vocabulary:
- term: زَيَّافَةٍ
  text: تسرع في تمايل.
- term: خَطَّارَةٍ
  text: تضرب بذنبها يمينًا وشمالًا.
- term: تُلْوِي بِشَرْخَيْ مَيْسَةٍ قَاتِرِ
  text: 'تذهب بطرفي رحل من خشب المَيْس محكم الوقوع على ظهرها. يقول المحقق: «الميسة شجرة تعمل منها الرحال» و«القاتر من الرحال والسرج هو الجيد الوقوع على الظهر» [@diwan-asha، ص183].'
