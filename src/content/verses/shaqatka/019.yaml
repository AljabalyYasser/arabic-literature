first: مَا يُجْعَلُ الجُدُّ الظَّنُونُ الَّذِي
second: جُنِّبَ صَوْبَ اللَّجِبِ الزَّاخِرِ
vocabulary:
- term: الجُدُّ
  text: 'البئر: «والجُدُّ، بِالضَّمِّ: الْبِئْرُ الَّتِي تَكُونُ فِي مَوْضِعٍ كَثِيرِ الكلإِ» [@lisan، ج3 ص110]، وأنشد صاحب اللسان البيت والذي بعده.'
- term: الظَّنُونُ
  text: التي لا يُدرى أفيها ماء أم لا.
- term: جُنِّبَ
  text: أُبعد عنه.
- term: اللَّجِبِ الزَّاخِرِ
  text: السيل الكثير الصوت والماء.
