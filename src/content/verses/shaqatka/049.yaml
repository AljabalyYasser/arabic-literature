first: المُطْعِمُو اللَّحْمَ إِذَا مَا شَتَوْا
second: وَالجَاعِلُو القُوتَ عَلَى اليَاسِرِ
vocabulary:
- term: شَتَوْا
  text: دخلوا في الشتاء، وهو عندهم زمن الجدب.
- term: اليَاسِرِ
  text: الذي يضرب بقداح المَيْسِر على الجَزُور. يقول المحقق إنهم كانوا يعيّرون من يأخذ ما غنم من اللحم إلى بيته [@diwan-asha، ص181].
