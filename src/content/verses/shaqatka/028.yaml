explained: false
first: وَلَسْتَ فِي الأَثْرَيْنَ مِنْ مَالِكٍ
second: وَلَا أَبِي بَكْرٍ ذَوِي النَّاصِرِ
vocabulary:
- term: الأَثْرَيْنَ
  text: الأكثرين مالًا.
- term: مَالِكٍ
  text: بنو مالك بن جعفر، رهط عامر، كما في شجرة النسب التي رسمها المحقق [@diwan-asha، ص174].
- term: أَبِي بَكْرٍ
  text: 'يقول المحقق: «ابو بكر هم بنو ابى بكر بن كلاب بن ربيعة بن عامر بن صعصعة» [@diwan-asha، ص179].'
