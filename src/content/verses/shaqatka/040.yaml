first: "وَكُنَّ قَدْ أَبْقَيْنَ مِنْهَا أَذًى"
second: "عِنْدَ الْمَلَاقِي وَافِيَ الشَّافِرِ"
meaning: "ويتمّ الشتيمة بصفة فرج أم عَلْقَمة: وكانت المواسي قد أبقت منها، عند مدخل فرجها، زيادة قبيحة غليظة الشفرين. والملاقي ثنايا الفرج من داخله: «والمَلاقِي أَيضاً: شُعَبُ رأْس الرَّحِم وشُعَبٌ دونَ ذَلِكَ ... وَقِيلَ: هِيَ الإِسَكُ»، والإِسَك شفرا الفرج، وبعده أنشد صاحب اللسان البيت وقال: «قَالَ الأَعشى يَذْكُرُ أُم عَلْقمةَ» [@lisan، ج15 ص255]. والشافر حرف الفرج، و«وافي» ضخم، كما يقول المحقق: «والشافر حرف الفرج. واف ضخم» [@diwan-asha، ص181]. فالمعنى بلغة اليوم: لم يُقطع من فرجها ما يُقطع في الختان، فبقي بظرها وشفراها كبيرين ناتئين عند فتحة الفرج."
vocabulary:
  - term: "وَكُنَّ"
    text: "الضمير للمواسي في البيت السابق."
  - term: "أَذًى"
    text: "شيئًا زائدًا قبيحًا يُستقذر، والأذى في الأصل كل ما يُكره."
  - term: "الْمَلَاقِي"
    text: "ثنايا الفرج: «والمَلاقِي أَيضاً: شُعَبُ رأْس الرَّحِم وشُعَبٌ دونَ ذَلِكَ، وَاحِدُهَا مَلْقًى ومَلْقَاةٌ، وَقِيلَ: هِيَ أَدنى الرَّحِمِ مِنْ مَوْضِعِ الْوَلَدِ، وَقِيلَ: هِيَ الإِسَكُ» [@lisan، ج15 ص255]. ويقول المحقق: «الملاقي شعب رأس الرحم، جمع ملقى» [@diwan-asha، ص181]."
  - term: "وَافِيَ الشَّافِرِ"
    text: "ضخم الشَّفْر، والشافران حرفا الفرج: «ويقال لناحيتي فرج المرأة: الإسكتان؛ ولطرفيهما: الشفران، الليث: الشافران من هن المرأة أيضا» [@lisan، ج4 ص419]."
syntax:
  - "«وَكُنَّ قَدْ أَبْقَيْنَ»: الواو حالية أو عاطفة، و«كُنّ» فعل ناقص، واسمه نون النسوة العائدة على «المواسي»، وجملة «قد أبقين» خبره. وجمع المواسي، وهي غير عاقلة، جمعَ النسوة، كما يجوز في جمع ما لا يعقل."
  - "«مِنْهَا»: جار ومجرور متعلق بـ«أبقين»، والهاء لأم عَلْقَمة. و«أَذًى» مفعول به منصوب بفتحة مقدرة على الألف المحذوفة لالتقاء الساكنين."
  - "«عِنْدَ الْمَلَاقِي»: ظرف مكان متعلق بـ«أبقين» أو بصفة لـ«أذى». و«وَافِيَ الشَّافِرِ» نعت لـ«أذى» منصوب، مضاف إلى «الشافر» إضافة لفظية، ويجوز أن يكون حالًا منه."
morphology:
  - "«الْمَلَاقِي» جمع «مَلْقًى» على «مَفاعِل»، من «لَقِيَ»، أي موضع التلاقي، وهو مقصور، فجمعه منقوص."
  - "«وَافٍ» اسم فاعل من «وَفَى يَفِي» إذا تمّ وكثر، مثال ناقص، و«الشَّافِر» على «فاعِل» بمعنى الشَّفْر."
  - "«أَذًى» مصدر «أَذِيَ» على «فَعَل»، مقصور منوّن."
rhetoric:
  thesis: "يكمل البيت السابق: هناك أمره بأن يعضّ ما أبقته المواسي، وهنا يصف ما أبقته. فالشتيمة صارت وصفًا تشريحيًّا لعورة الأم، وهذا أشد في الإهانة من مجرد الشتم."
  devices:
    - title: "التفصيل بعد الإجمال"
      text: "أجمل في البيت السابق «بِمَا أَبْقَى الْمَوَاسِي»، ثم فصّل هنا موضعه وصفته: «عِنْدَ الْمَلَاقِي»، «وَافِيَ الشَّافِرِ». والتفصيل بعد الإجمال يثبت الصورة في ذهن السامع، لأنه يسمعها مبهمة ثم يراها مفصّلة. وهذه قراءتنا."
    - title: "ألفاظ اللغة في موضع الشتم"
      text: "استعمل ألفاظًا هي ألفاظ وصف الفرج عند اللغويين: «الملاقي» و«الشافر». فجاء الهجاء بلغة الوصف الدقيق، لا بلغة السباب المبهم، ولذلك احتفظ به صاحب اللسان شاهدًا على معاني هذه الألفاظ [@lisan، ج15 ص255]."
  connection: "ثم ينتقل إلى الرد على وعيد عَلْقَمة: «لا تحسبنّي عنكم غافلًا»."
prosody:
  meter: "البحر السريع"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "وَكُنْنَ قَدْ / أَبْقَيْنَ مِنْ / هَا أَذَى = متفعلن / مستفعلن / فاعلن — عِنْدَلْ مَلَا / قِي وَافِيَشْ / شَافِرِي = مستفعلن / مستفعلن / فاعلن"
  note: "وزن السريع: «مستفعلن مستفعلن فاعلن» [@atiq، ص86]. ودخل الخبن، وهو «حذف الثاني الساكن، وعلى هذا تصير مستفعلن متفعلن» [@atiq، ص87]، التفعيلة الأولى من الصدر. والعروض والضرب «فاعلن»، والعروض «مطوية مكسوفة» وضربها مثلها [@atiq، ص87]."
context: "ثاني البيتين اللذين يشتم فيهما الأَعْشَى أم عَلْقَمة (39–40)، وبعدهما يعود إلى خطاب عَلْقَمة ووعيده. وهما من الهجاء الماجن الذي يقذع فيه الشاعر، وقد احتفظ صاحب اللسان بهذا البيت وحده شاهدًا على «الملاقي» [@lisan، ج15 ص255]."
variants:
