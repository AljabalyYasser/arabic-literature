explained: false
first: "وَكُنَّ قَدْ أَبْقَيْنَ مِنْهَا أَذًى"
second: "عِنْدَ الْمَلَاقِي وَافِيَ الشَّافِرِ"
vocabulary:
  - term: "وَكُنَّ"
    text: "الضمير للمواسي في البيت السابق."
  - term: "أَذًى"
    text: "شيئًا زائدًا قبيحًا."
  - term: "الْمَلَاقِي"
    text: "«والملاقي أيضا: شعب رأس الرحم وشعب دون ذلك»، وأنشد صاحب اللسان البيت وقال: «قال الأعشى يذكر أم علقمة» [@lisan، ج15 ص255]."
  - term: "وَافِيَ الشَّافِرِ"
    text: "ضخم الشافر، والشافران حرفا الفرج: «ويقال لناحيتي فرج المرأة: الإسكتان؛ ولطرفيهما: الشفران، الليث: الشافران من هن المرأة أيضا» [@lisan، ج4 ص419]. ويقول المحقق: «والشافر حرف الفرج. واف ضخم» [@diwan-asha، ص181]."
