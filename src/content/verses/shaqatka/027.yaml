first: وَلَسْتَ بِالأَكْثَرِ مِنْهُمْ حَصًى
second: وَإِنَّمَا العِزَّةُ لِلْكَاثِرِ
vocabulary:
- term: حَصًى
  text: عددًا، والحصى كناية عن كثرة العدد.
- term: لِلْكَاثِرِ
  text: '«والكاثِرُ: الكَثِير» [@lisan، ج5 ص132]، وأنشد صاحب اللسان البيت وقال: «الأَكثر هَاهُنَا بِمَعْنَى الْكَثِيرِ».'
