first: كَمْ فِيهِمُ مِنْ شَطْبَةٍ خَيْفَقٍ
second: وَسَابِحٍ ذِي مَيْعَةٍ ضَابِرِ
vocabulary:
- term: شَطْبَةٍ خَيْفَقٍ
  text: فرس طويلة سريعة.
- term: وَسَابِحٍ
  text: «وَكَذَلِكَ السَّابِحُ مِنَ الْخَيْلِ يَمُدُّ يَدَيْهِ فِي الْجَرْيِ سَبْحاً» [@lisan، ج2 ص471]، وأنشد صاحب اللسان البيت.
- term: مَيْعَةٍ
  text: نشاط وسرعة.
- term: ضَابِرِ
  text: '«ضَبَرَ الفَرَسُ يَضْبُر ضَبْراً وضَبَراناً إِذا عَدَا، وَفِي الْمُحْكَمِ: جَمَع قَوَائِمَهُ ووَثَبَ» [@lisan، ج4 ص479].'
