explained: false
first: وَاسْمَعْ فَإِنِّي طَبِنٌ عَالِمٌ
second: أَقْطَعُ مِنْ شِقْشِقَةِ الهَادِرِ
vocabulary:
- term: طَبِنٌ
  text: 'فطن: «الطَّبَنُ، بِالتَّحْرِيكِ: الفِطْنَةُ» [@lisan، ج13 ص263].'
- term: شِقْشِقَةِ الهَادِرِ
  text: «الشِّقْشِقةُ جِلْدَةٌ فِي حَلْقِ الْجَمَلِ الْعَرَبِيِّ يَنْفُخُ فِيهَا الرِّيحَ فَتَنْتَفِخُ فَيَهْدِرُ فِيهَا» [@lisan، ج10 ص185]، يريد أنه يُسكت المتشدّق.
