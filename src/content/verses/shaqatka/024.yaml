first: لَا يَرْهَبُ المُنْكِرَ مِنْكُمْ وَلَا
second: يَرْجُوكُمُ إِلَّا نَقَى الآصِرِ
vocabulary:
- term: المُنْكِرَ
  text: من ينكر حكمه.
- term: نَقَى الآصِرِ
  text: 'يقول المحقق: «النقا عظم العضد او كل عظم ذى مخ فى داخله»، والآصر عنده الكاسر [@diwan-asha، ص177]؛ أي لا يرجو منكم إلا ما يرجوه من يكسر العظم ليصيب مخه.'
