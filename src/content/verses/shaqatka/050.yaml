first: مِنْ كُلِّ كَوْمَاءَ سَحُوفٍ إِذَا
second: جَفَّتْ مِنَ اللَّحْمِ مُدَى الجَازِرِ
vocabulary:
- term: كَوْمَاءَ
  text: '«وَنَاقَةٌ كَوْمَاء: عَظيمة السَّنام طَوِيلَتُهُ» [@lisan، ج12 ص529].'
- term: سَحُوفٍ
  text: '«وَنَاقَةٌ سَحُوفٌ: كَثِيرَةُ السَّحائف. والسَّحْفةُ: الشَّحْمةُ عامَّةً» [@lisan، ج9 ص145].'
- term: مُدَى الجَازِرِ
  text: سكاكين الذابح، جمع مُدْية.
