first: عَلْقَمَ لَا لَسْتَ إِلَى عَامِرٍ
second: النَّاقِضِ الأَوْتَارَ وَالوَاتِرِ
vocabulary:
- term: عَلْقَمَ
  text: يا علقمة، حُذف آخره في النداء.
- term: إِلَى عَامِرٍ
  text: إذا قيس بك عامر.
- term: النَّاقِضِ الأَوْتَارَ وَالوَاتِرِ
  text: الذي يُدرك ثأره من خصومه، ويصيبهم بما يطلبون به ثأرًا. والأوتار جمع وِتْر، وهو الثأر.
sources:
