first: يَنُوءُونَ بِالأَيْدِي وَأَفْضَلُ زَادِهِمْ
second: بَقِيَّةُ لَحْمٍ مِنْ جَزُورٍ مُمَلَّحِ
vocabulary:
- term: يَنُوءُونَ بِالأَيْدِي
  text: 'قال ابن السِّكِّيت: «يقول: هؤلاء أصحاب الكنيف مجهودون فلا يقدرون من جهدهم أن يستقلوا حتى يعتمدوا على أيديهم» [@diwan-urwa، ص54].'
- term: جَزُورٍ مُمَلَّحِ
  text: '«ومملَّح: به أدنى شيء من شحم، والمِلْح: الشحم» [@diwan-urwa، ص54]. والجزور: البعير يُنحر.'
sources:
- source: diwan-urwa
  loc: ص54
