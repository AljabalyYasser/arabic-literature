explained: false
first: لِيَبْلُغَ عُذْرًا أَوْ يُصِيبَ رَغِيبَةً
second: وَمُبْلِغُ نَفْسٍ عُذْرَهَا مِثْلُ مُنْجِحِ
vocabulary:
- term: رَغِيبَةً
  text: الشيء المرغوب فيه، أي المال.
- term: وَمُبْلِغُ نَفْسٍ عُذْرَهَا مِثْلُ مُنْجِحِ
  text: 'قال ابن السِّكِّيت: «يقول: نخرج فنطلب، فإن أصبنا رغيبةً فذاك الذي نريد وكنا نطلب، وإن رجعنا مخفقين لم نصب شيئًا في غزوتنا فلم نقعد عن الطلب»، «فإن من فعل هذا كان قد بلغ من نفسه عذرها، وكان كأنه قد أنجح حين لم يقعد عن الطلب» [@diwan-urwa، ص53]. والمنجح: الظافر.'
sources:
- source: diwan-urwa
  loc: ص53
