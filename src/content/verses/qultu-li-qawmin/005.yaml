first: لَعَلَّكُمُ أَنْ تَصْلُحُوا بَعْدَمَا أَرَى
second: نَبَاتَ العِضَاهِ المُقْبِلِ المُتَرَوِّحِ
vocabulary:
- term: نَبَاتَ العِضَاهِ المُقْبِلِ المُتَرَوِّحِ
  text: 'قال ابن السِّكِّيت: «والعضاه: كل ما كان من شجر البر، له شوك من طلح أو سمر. والمقبل: الذي قد أقبل يبتل بعد اليبس. والمتروح: الذي إذا استقبل البرد فوجد مسه تفطر ورقه من غير مطر، فمثل أصحاب الكنيف بهذا» [@diwan-urwa، ص53].'
