explained: false
first: تَنَالُوا المُنَى أَوْ تَبْلُغُوا بِنُفُوسِكُمْ
second: إِلَى مُسْتَرَاحٍ مِنْ عَنَاءٍ مُبَرِّحِ
vocabulary:
- term: المُنَى
  text: ما تتمنّونه من الغنى.
- term: مُسْتَرَاحٍ مِنْ عَنَاءٍ مُبَرِّحِ
  text: 'قال ابن السِّكِّيت: «يريد: إلى أن تُصيبوا مستراحًا من عنائكم الذي برّح بكم» [@diwan-urwa، ص53]، أي اشتد بكم، فإما الغنى وإما الموت الذي يريح.'
