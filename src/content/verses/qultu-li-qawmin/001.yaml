explained: false
first: قُلْتُ لِقَوْمٍ فِي الكَنِيفِ تَرَوَّحُوا
second: عَشِيَّةَ قِلْنَا عِنْدَ مَاوَانَ رُزَّحِ
vocabulary:
- term: الكَنِيفِ
  text: الحظيرة من الشجر، يأوون إليها.
- term: تَرَوَّحُوا
  text: سيروا في الرواح، وهو آخر النهار.
- term: قِلْنَا
  text: 'من القيلولة: نزلنا وقت الظهيرة.'
- term: مَاوَانَ رُزَّحِ
  text: 'قال ابن السِّكِّيت: «ماوانُ: وادٍ فيه ماء فيما بين النُّقْرة والرَّبَذة، فغلب عليه الماء فسُمّي ذلك الماء: ماوان. رُزَّح: قد سقطنا من الإعياء» [@diwan-urwa، ص52].'
sources:
- source: diwan-urwa
  loc: ص52
