explained: false
first: يَا لَبَكْرٍ فَاظْعَنُوا أَوْ فَحُلُّوا
second: صَرَّحَ الشَّرُّ وَبَانَ السِّرَارُ
vocabulary:
- term: فَاظْعَنُوا
  text: فارتحلوا.
- term: فَحُلُّوا
  text: فانزلوا وأقيموا.
- term: صَرَّحَ الشَّرُّ
  text: 'ظهر خالصًا مكشوفًا، من قولهم: «صَرَّحَتِ الخمر تصريحًا: انجلى زبدها فخلصت» [@lisan، ج2 ص509].'
- term: السِّرَارُ
  text: «المُسارّة» [@lisan، ج4 ص362]، أي ما كان يُتناجى به سرًّا.
