first: "يَا لَبَكْرٍ أَنْشِرُوا لِي كُلَيْبًا"
second: "يَا لَبَكْرٍ أَيْنَ أَيْنَ الْفِرَارُ"
meaning: "يا لبَكْر! أحيوا لي كُلَيْبًا إن أردتم أن أكفّ عنكم. يا لبَكْر! إلى أين تفرّون؟ قال سِيبَوَيْه: «فاستغاث بهم ليُنشروا له كُلَيْبًا، وهذا منه وعيد وتهدد»، وفي العَجُز «استغاث بهم لهم، أي: لمَ تفرّون؟ استطالةً عليهم ووعيدًا» [@sibawayh، ج2 ص215]."
vocabulary:
  - term: "أَنْشِرُوا"
    text: "أحيُوا. يقال: أنشر الله الموتى، أي بعثهم، ومنه قوله تعالى: «ثُمَّ إِذَا شَاءَ أَنْشَرَهُ»."
  - term: "الْفِرَار"
    text: "الهرب."
syntax:
  - "«يَا لَبَكْرٍ»: «يا» حرف نداء، واللام المفتوحة لام الاستغاثة، و«بكرٍ» مجرور بها. قال سِيبَوَيْه: هذا «باب ما يكون النداء فيه مضافًا إلى المنادى بحرف الإضافة، وذلك في الاستغاثة والتعجب، وذلك الحرف اللام المفتوحة» [@sibawayh، ج2 ص215]."
  - "«أَنْشِرُوا»: فعل أمر مبني على حذف النون، والواو فاعل. و«لِي» متعلق به، و«كُلَيْبًا» مفعول به."
  - "«أَيْنَ»: اسم استفهام مبني على الفتح في محل رفع خبر مقدم، و«أين» الثانية توكيد لفظي للأولى، و«الْفِرَارُ» مبتدأ مؤخر."
morphology:
  - "«أَنْشِرُوا» من «أَنْشَرَ» على «أَفْعَلَ»، والهمزة للتعدية: نَشَرَ الميت، أي عاش، وأنشره الله."
  - "«الْفِرَار» مصدر «فرّ» على «فِعال»."
rhetoric:
  thesis: "بيت يجمع طلب المستحيل والتهديد: ما دام كُلَيْب لا يعود، فلا مهرب لبَكْر."
  devices:
    - title: "الاستغاثة للتهديد"
      text: "ظاهر الاستغاثة طلب العون، لكنه يستغيث ببَكْر ليطلب منهم ما لا يقدرون عليه، فصارت، كما قال سِيبَوَيْه، «وعيدًا وتهددًا» [@sibawayh، ج2 ص215]."
    - title: "طلب المستحيل"
      text: "هو المطلب الأول نفسه الذي حمله وفد تَغْلِب إلى مُرّة بن ذُهْل: «تحيي لنا كُلَيْبًا» [@iqd، ج6 ص72]. فالبيت يقول بلغة الشعر ما قالوه بلغة التفاوض: لا صلح."
    - title: "التكرار"
      text: "كرر «يا لبَكْر» في الشطرين، وكرر «أين». وهو من مواضع التكرار التي عدّها ابن رَشِيق: «على جهة الوعيد والتهديد» [@ibn-rashiq، ج2 ص75]."
  connection: "وفي رواية «الأغاني» يقول بعده: «يا لبَكْر فاظعنوا أو فحُلّوا / صرّح الشر وبان السِّرار»؛ أي: ارحلوا أو أقيموا، فقد ظهر الشر وانكشف المستور."
prosody:
  meter: "البحر المديد"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "يَا لَبَكْرِنْ / أَنْشِرُو / لِي كُلَيْبَا = فاعلاتن / فاعلن / فاعلاتن — يَا لَبَكْرِنْ / أَيْنَ أَيْ / نَلْ فِرَارُو = فاعلاتن / فاعلن / فاعلاتن"
  note: "المديد من البحور القليلة الاستعمال [@atiq، ص39]. وجاءت العَرُوض والضرب صحيحين «فاعلاتن»."
context: "من أبيات للمُهَلْهِل غنّاها ابن سُرَيْج وغيره من المغنين، يرويها أبو الفَرَج [@aghani، ج5 ص64]، واستشهد سِيبَوَيْه بأولها."
variants:
  - reading: "وَيَا لَبَكْرٍ أَيْنَ أَيْنَ الْفِرَارُ"
    status: "رواية سِيبَوَيْه"
    note: "بزيادة الواو في أول العَجُز [@sibawayh، ج2 ص215]، والوزن يستقيم بدونها."
