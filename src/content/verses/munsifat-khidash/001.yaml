explained: false
first: فَأَبْلِغْ إِنْ عَرَضْتَ بِنَا هِشَامًا
second: وَعَبْدَ اللَّهِ أَبْلِغْ وَالْوَلِيدَا
vocabulary:
- term: عَرَضْتَ
  text: أتيت العَروض؛ «وعرض الرجل إذا أتى العَرُوض، وهي مكة والمدينة وما حولهما» [@lisan، ج7 ص173].
- term: هِشَامًا
  text: هشام بن المغيرة [@ibn-sallam، ج1 ص147].
- term: عَبْدَ اللَّهِ
  text: عبد الله بن جُدْعان [@ibn-sallam، ج1 ص147].
- term: الْوَلِيدَا
  text: الوليد بن المغيرة، أخو هشام [@ibn-sallam، ج1 ص147].
