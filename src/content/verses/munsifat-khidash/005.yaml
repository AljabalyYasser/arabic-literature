explained: false
first: فَجَاءُوا عَارِضًا بَرِدًا وَجِئْنَا
second: كَمَا أَضْرَمْتَ فِي الْغَابِ الْوَقُودَا
vocabulary:
- term: عَارِضًا
  text: 'سحابًا؛ «والعارض: السحاب المطلّ يعترض في الأفق» [@lisan، ج7 ص174].'
- term: بَرِدًا
  text: 'ذا بَرَد؛ «وسحاب بَرِدٌ وأبرد: ذو قُرٍّ وبرد» [@lisan، ج3 ص84].'
- term: الْغَابِ
  text: الشجر الملتف.
- term: الْوَقُودَا
  text: 'الحطب؛ «والوَقود، بالفتح: الحطب، وبالضم: الاتقاد» [@lisan، ج3 ص465].'
