explained: false
first: هُمُ خَيْرُ الْمَعَاشِرِ مِنْ قُرَيْشٍ
second: وَأَوْرَاهَا إِذَا قُدِحَتْ زُنُودَا
vocabulary:
- term: الْمَعَاشِرِ
  text: الجماعات، جمع مَعْشَر.
- term: أَوْرَاهَا
  text: 'أكثرها إخراجًا للنار، أي أنجحها؛ «وقالوا: هو أوراهم زندًا؛ يضرب مثلًا لنجاحه وظفره» [@lisan، ج15 ص388].'
- term: زُنُودَا
  text: جمع زَنْد، وهو العود يُقدح به فتخرج النار.
