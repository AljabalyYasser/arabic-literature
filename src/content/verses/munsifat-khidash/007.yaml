explained: false
first: فَلَمْ أَرَ مِثْلَهُمْ هُزِمُوا وَفُلُّوا
second: وَلَا كَذِيَادِنَا عُنُقًا مَجُودَا
vocabulary:
- term: فُلُّوا
  text: كُسروا وتفرّقوا.
- term: كَذِيَادِنَا
  text: كدفعنا وطردنا؛ «ذاده عن الشيء ذَوْدًا وذِيادًا» [@lisan، ج3 ص167].
- term: عُنُقًا
  text: '«العُنُق: الجماعة الكثيرة من الناس» [@lisan، ج10 ص273].'
- term: مَجُودَا
  text: 'من «جِيد الرجل ... فهو مَجُود إذا عطش»، ويقال: «جِيد فلان إذا أشرف على الهلاك» [@lisan، ج3 ص138].'
