first: فَعَانَقْنَا الْكُمَاةَ وَعَانَقُونَا
second: عِرَاكَ النُّمْرِ وَاجَهَتِ الْأُسُودَا
vocabulary:
- term: الْكُمَاةَ
  text: "الشجعان المستترون بالسلاح، جمع كَمِيّ. وفي لسان العرب: «والكَمِيُّ: الشُّجَاعُ المُتَكَمِّي فِي سِلاحه لأَنه كَمَى نفسَه أَي ستَرها بالدِّرع والبَيْضة، وَالْجَمْعُ الكُمَاة» [@lisan، ج15 ص232]."
- term: عِرَاكَ النُّمْرِ
  text: "قتالًا كقتال النمور، والنُّمْر جمع نَمِر. وفي لسان العرب في جمع النَّمِر: «وأَكثر كَلَامِ الْعَرَبِ نُمْرٌ» [@lisan، ج5 ص234]."
