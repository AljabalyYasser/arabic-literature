explained: false
first: "مُسْتَحْقِبِي حَلَقِ الْمَاذِيِّ يَقْدُمُهُمْ"
second: "شُمُّ الْعَرَانِينِ ضَرَّابُونَ لِلْهَامِ"
vocabulary:
  - term: "مُسْتَحْقِبِي حَلَقِ الْمَاذِيِّ"
    text: "«أي حامليه في حقائبهم، والماذيّ: الدروع اللّيّنة السهلة الرقيقة» [@diwan-nabigha، ص83]."
  - term: "يَقْدُمُهُمْ"
    text: "«أي يقودهم ويسير أمامهم» [@diwan-nabigha، ص83]."
  - term: "شُمُّ الْعَرَانِينِ"
    text: "«أي أعزّة كرام؛ وضرب [شمم] الأنف مثلًا» [@diwan-nabigha، ص83]، والعرانين الأنوف، والشمم ارتفاع قصبة الأنف."
  - term: "ضَرَّابُونَ لِلْهَامِ"
    text: "«وصفهم بالجراءة والإقدام على الأقران؛ فهم يضربون هامهم بالسيوف» [@diwan-nabigha، ص83]، والهام الرؤوس."
sources:
