explained: false
first: "فَصَالِحُونَا جَمِيعًا إِنْ بَدَا لَكُمُ"
second: "وَلَا تَقُولُوا لَنَا أَمْثَالَهَا عَامِ"
vocabulary:
  - term: "وَلَا تَقُولُوا لَنَا أَمْثَالَهَا"
    text: "«أي لا تسومونا ولا تعرضوا خلاء بني أسد، ولا تعيدوا علينا مثل هذه المقالة» [@diwan-nabigha، ص82]."
  - term: "عَامِ"
    text: "«أراد عامرًا فرخّم، وهو عامر بن صَعْصَعة» [@diwan-nabigha، ص82]، والترخيم حذف آخر المنادى."
sources:
