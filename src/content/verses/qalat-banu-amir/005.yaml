first: "تَبْدُو كَوَاكِبُهُ وَالشَّمْسُ طَالِعَةٌ"
second: "لَا النُّورُ نُورٌ وَلَا الْإِظْلَامُ إِظْلَامُ"
vocabulary:
  - term: "تَبْدُو كَوَاكِبُهُ وَالشَّمْسُ طَالِعَةٌ"
    text: "«ضرب هذا مثلًا لشدّة اليوم وهوله، كما يقال: أريتُه الكواكبَ نهارًا، أي أدخلت عليه من الجَهْد والغمّ ما كان النهارُ به عندهم ليلًا» [@diwan-nabigha، ص83]."
  - term: "لَا النُّورُ نُورٌ وَلَا الْإِظْلَامُ إِظْلَامُ"
    text: "«أي ليس النور في هذا اليوم كالنور المعهود في سائر الأيام، وليس إظلامُه إظلامًا في الحقيقة؛ لأنه ليس بظلام ليل» [@diwan-nabigha، ص83]."
sources:
