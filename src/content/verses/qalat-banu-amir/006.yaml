explained: false
first: "أَوْ تَزْجُرُوا مُكْفَهِرًّا لَا كِفَاءَ لَهُ"
second: "كَاللَّيْلِ يَخْلِطُ أَصْرَامًا بِأَصْرَامِ"
vocabulary:
  - term: "مُكْفَهِرًّا"
    text: "«المكفهرّ: الجيش العظيم، وكلّ متراكبٍ مكفهرّ» [@diwan-nabigha، ص83]."
  - term: "لَا كِفَاءَ لَهُ"
    text: "«أي ليس عندكم من القوة ما تُكافئونه به وتماثلونه» [@diwan-nabigha، ص83]."
  - term: "يَخْلِطُ أَصْرَامًا بِأَصْرَامِ"
    text: "«يعني شدّة سواد الليل وتراكُب ظلمته»، «والأصرام: القِطَع والجماعات» [@diwan-nabigha، ص83]."
sources:
