explained: false
first: "قَالَتْ بَنُو عَامِرٍ خَالُوا بَنِي أَسَدٍ"
second: "يَا بُؤْسَ لِلْجَهْلِ ضَرَّارًا لِأَقْوَامِ"
vocabulary:
  - term: "خَالُوا بَنِي أَسَدٍ"
    text: "«أي فارقوهم واقطعوا حِلفَهم، يقال: خاليتُه مخالاةً وخِلاءً، إذا فارقته وتاركته» [@diwan-nabigha، ص82]."
  - term: "يَا بُؤْسَ لِلْجَهْلِ"
    text: "«وهو تعنيف منه لبني عامر»، «كأنه قال: يا بؤسًا لهم بجهلهم» [@diwan-nabigha، ص82]، والبؤس الشدة والضرّ."
  - term: "ضَرَّارًا"
    text: "«حال من الجهل» [@diwan-nabigha، ص82]، أي الجهل الذي يضرّ أصحابه."
sources:
  - source: "diwan-nabigha"
    loc: "ص82"
