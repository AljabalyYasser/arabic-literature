explained: false
first: "كَمْ غَادَرَتْ خَيْلُنَا مِنْكُمْ بِمُعْتَرَكٍ"
second: "لِلْخَامِعَاتِ أَكُفًّا بَعْدَ أَقْدَامِ"
vocabulary:
  - term: "غَادَرَتْ"
    text: "«أي كم تركت وخلّفت بمعترك القتال» [@diwan-nabigha، ص84]."
  - term: "لِلْخَامِعَاتِ"
    text: "«الضِّباع، وكلّ ظالعٍ خامع والضِّباع توصف بالعرج» [@diwan-nabigha، ص84]."
  - term: "أَكُفًّا بَعْدَ أَقْدَامِ"
    text: "«أي كم غادرت من أكُفٍّ بعد أقدامٍ منكم، يقول هذا لبني عامر؛ وإنما ذكر الخامعات لمشاهدتها مواضع الحروب بعد انقضائها، وأكلها لحومَ القتلى» [@diwan-nabigha، ص84]."
sources:
  - source: "diwan-nabigha"
    loc: "ص84"
    url: "https://archive.org/details/3409pdf_202001/page/n83/mode/1up"
