explained: false
first: "إِنِّي لَأَخْشَى عَلَيْكُمْ أَنْ يَكُونَ لَكُمْ"
second: "مِنْ أَجْلِ بَغْضَائِهِمْ يَوْمٌ كَأَيَّامِ"
vocabulary:
  - term: "بَغْضَائِهِمْ"
    text: "بغضكم لهم."
  - term: "يَوْمٌ كَأَيَّامِ"
    text: "«أخشى أن يحملكم بُغضُكم لهم على أن تبعثوا» «بيننا وبينكم حربًا شديدةً يكون لكم منها يومٌ طويل كأيامٍ في الطول. ويومُ الشرّ يُنسَب إلى الطُّول كما أن يوم الخير ينسب إلى القِصَر» [@diwan-nabigha، ص82–83]."
sources:
  - source: "diwan-nabigha"
    loc: "ص82–83"
