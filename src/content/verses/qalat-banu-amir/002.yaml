explained: false
first: "يَأْبَى الْبَلَاءُ فَلَا نَبْغِي بِهِمْ بَدَلًا"
second: "وَلَا نُرِيدُ خَلَاءً بَعْدَ إِحْكَامِ"
vocabulary:
  - term: "يَأْبَى الْبَلَاءُ"
    text: "«أي يمنع من مفارقتهم بلاؤهم عندنا، أي معرفتنا بما جرّبنا منهم» [@diwan-nabigha، ص82]."
  - term: "خَلَاءً بَعْدَ إِحْكَامِ"
    text: "«أي لا نريد مفارقتهم ونقضَ حِلفهم بعد أن أحكمنا الأمر بيننا وبينهم» [@diwan-nabigha، ص82]."
sources:
