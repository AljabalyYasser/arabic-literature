explained: false
first: لَا غَرْوَ إِلَّا جَارَتِي وَسُؤَالُهَا
second: أَلَا هَلْ لَنَا أَهْلٌ سُئِلْتِ كَذَلِكِ
vocabulary:
- term: لَا غَرْوَ
  text: 'لا عجب؛ «والغرو: العجب. ولا غرو ولا غروى أي لا عجب» [@lisan، ج15 ص123].'
- term: سُئِلْتِ كَذَلِكِ
  text: 'قال ابن قُتَيْبة: «دعا عليها بأن تغترب حتى تسأل كما سألته» [@ibn-qutayba، ج1 ص189].'
