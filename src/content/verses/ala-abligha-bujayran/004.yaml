first: "فَإِنْ أَنْتَ لَمْ تَفْعَلْ فَلَسْتُ بِآسِفٍ"
second: "وَلَا قَائِلٍ إِمَّا عَثَرْتَ لَعًا لَكَا"
vocabulary:
- term: "لَعًا لَكَ"
  text: "«كَلِمَةٌ يُدعَى بِهَا لِلْعَاثِرِ مَعْنَاهَا الِارْتِفَاعُ» [@lisan، ج15 ص250]، أي: قم من عثرتك. يقول: لن أدعو لك إن عثرت."
