explained: false
first: "سَقَاكَ بِهَا الْمَأْمُونُ كَأْسًا رَوِيَّةً"
second: "فَأَنْهَلَكَ الْمَأْمُونُ مِنْهَا وَعَلَّكَا"
vocabulary:
- term: "الْمَأْمُونُ"
  text: "النبي صلى الله عليه وسلم. قال السُّكَّريّ: «كانت قريش تسمى النبى صلى الله عليه وسلم المأمون والأمين» [@diwan-kaab، ص3]."
- term: "أَنْهَلَكَ، عَلَّكَا"
  text: "من النَّهَل والعَلَل. قال السُّكَّريّ: «والنهل: أول شربة»، «والعلل: الشرب الثانى» [@diwan-kaab، ص7]."
