explained: false
first: وَلَكِنَّنِي أَحْمِي حِمَاهَا وَأَتَّقِي
second: أَذَاهَا وَأَرْمِي مَنْ رَمَاهَا بِمَنْكِبِ
vocabulary:
- term: حِمَاهَا
  text: ما تحميه القبيلة وتمنعه من أرضها وحرمتها.
- term: أَتَّقِي أَذَاهَا
  text: أدفع عنها ما يؤذيها.
- term: بِمَنْكِبِ
  text: المنكب مجتمع رأس الكتف والعضد، يريد أنه يدفع عنها بنفسه.
sources:
- source: ibn-qutayba
  loc: ج1 ص324
