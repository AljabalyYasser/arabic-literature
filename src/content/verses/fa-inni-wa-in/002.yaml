first: فَمَا سَوَّدَتْنِي عَامِرٌ عَنْ وِرَاثَةٍ
second: أَبَى اللَّهُ أَنْ أَسْمُو بِأُمٍّ وَلَا أَبِ
vocabulary:
- term: سَوَّدَتْنِي
  text: جعلتني سيّدًا.
- term: أَبَى اللَّهُ
  text: 'كره الله؛ قال البغدادي: «أبى له معنيان: أحدهما: بمعنى كره وهو المراد هنا» [@khizana، ج8 ص344].'
- term: أَسْمُو
  text: 'أعلو؛ «والسمو: العلو» [@khizana، ج8 ص344].'
