first: "فَإِنَّكَ سَوْفَ تَحْلُمُ أَوْ تَنَاهَى"
second: "إِذَا مَا شِبْتَ أَوْ شَابَ الْغُرَابُ"
vocabulary:
  - term: "تَنَاهَى"
    text: "تنتهي عن الجهل."
  - term: "أَوْ شَابَ الْغُرَابُ"
    text: "«أي لا تحلم أبدًا، كما أن الغراب لا يشيب، وإنما هذا هُزُؤٌ منه به وذمٌّ» [@diwan-nabigha، ص110]."
