explained: false
first: "وَلَا تَذْهَبْ بِحِلْمِكَ طَامِيَاتٌ"
second: "مِنَ الْخُيَلَاءِ لَيْسَ لَهُنَّ بَابُ"
vocabulary:
  - term: "طَامِيَاتٌ"
    text: "«المرتفعات، يقال: طما الماءُ، إذا علا وارتفع» [@diwan-nabigha، ص109]."
  - term: "الْخُيَلَاءِ"
    text: "«التكبّر والبطَر» [@diwan-nabigha، ص109]."
  - term: "لَيْسَ لَهُنَّ بَابُ"
    text: "«أي لا آخر لهنّ ولا منتهى» [@diwan-nabigha، ص109]."
