explained: false
first: "فَإِنْ يَكُ عَامِرٌ قَدْ قَالَ جَهْلًا"
second: "فَإِنَّ مَظِنَّةَ الْجَهْلِ الشَّبَابُ"
vocabulary:
  - term: "عَامِرٌ"
    text: "«هو عامر بن الطفيل العامريّ» [@diwan-nabigha، ص109]."
  - term: "مَظِنَّةَ الْجَهْلِ"
    text: "موضعه الذي يُظنّ فيه، «ومظِنّة الشيء: الأمر الذي لا يكاد يطلب فيه إلا وجد به؛ وهو مشتق من الظنّ، أي حيث يظنّ أنه لا يفارقه» [@diwan-nabigha، ص109]."
  - term: "الشَّبَابُ"
    text: "«يريد أن الشباب مقرون به الجهل، ملازم له» [@diwan-nabigha، ص109]، والجهل هنا الطيش والسفه."
sources:
