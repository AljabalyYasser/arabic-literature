first: "فَمَا إِنْ كَانَ مِنْ نَسَبٍ بَعِيدٍ"
second: "وَلَكِنْ أَدْرَكُوكَ وَهُمْ غِضَابُ"
vocabulary:
  - term: "فَمَا إِنْ كَانَ مِنْ نَسَبٍ بَعِيدٍ"
    text: "«يقول: لم يكن ما لقيت منهم أنّهم لم يكونوا من عشيرتك، لكنهم كلهم من قيس عَيْلان؛ ولكنك أغضبتهم فعاقبوك» [@diwan-nabigha، ص110]، و«إنْ» زائدة بعد «ما» النافية."
