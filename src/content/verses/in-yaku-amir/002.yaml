explained: false
first: "فَكُنْ كَأَبِيكَ أَوْ كَأَبِي بَرَاءٍ"
second: "تُوَافِقْكَ الْحُكُومَةُ وَالصَّوَابُ"
vocabulary:
  - term: "كَأَبِيكَ"
    text: "أبوه الطُّفَيْل بن مالك، وعامر عند ابن قُتَيْبة «عامر بن الطّفيل بن مالك بن جعفر بن كلاب العامرىّ» [@ibn-qutayba، ج1 ص322]."
  - term: "أَبِي بَرَاءٍ"
    text: "«هو عامر بن مالك ملاعب الأسنّة، وهو عمّ عامر بن الطفيل» [@diwan-nabigha، ص109]."
  - term: "الْحُكُومَةُ"
    text: "«الحكم» [@diwan-nabigha، ص109]، أي الرأي الصائب."
