explained: false
first: "لَا زَالَ مِسْكٌ وَرَيْحَانٌ لَهُ أَرَجٌ"
second: "عَلَى صَدَاكَ بِصَافِي اللَّوْنِ سَلْسَالِ"
vocabulary:
  - term: "أَرَجٌ"
    text: "انتشار الرائحة الطيبة."
  - term: "صَدَاكَ بِصَافِي اللَّوْنِ"
    text: "يقول محققو «الأغاني»: «الصدى هنا: جثة الميت فى قبره. وبصافى اللون أى مع صافى اللون، يريد الماء. والدعاء للقبور بالسقيا معروف عند العرب» [@aghani-dk، ج11 ص73، الحاشية]."
  - term: "سَلْسَالِ"
    text: "عذب سهل في الحلق."
sources:
  - source: "aghani-dk"
    loc: "ج11 ص73"
    url: "https://archive.org/details/Al-aghani_11/page/n72/mode/1up"
status: "review"
