explained: false
first: "أَبَا دُلَيْجَةَ مَنْ تُوصِي بِأَرْمَلَةٍ"
second: "أَمْ مَنْ لِأَشْعَثَ ذِي طِمْرَيْنِ مِمْحَالِ"
vocabulary:
  - term: "أَبَا دُلَيْجَةَ"
    text: "كنية فَضَالة [@aghani-dk، ج11 ص73]."
  - term: "أَرْمَلَةٍ"
    text: "امرأة لا زوج لها ولا مال."
  - term: "أَشْعَثَ ذِي طِمْرَيْنِ مِمْحَالِ"
    text: "يقول محققو «الأغاني»: «رجل أشعث: مغبر الرأس متلبد الشعر أو منتشره لقلة تعهده بالدهن والاستحداد. والطمر: الثوب الخلق. وممحال: مجدب. يريد أنه فقير» [@aghani-dk، ج11 ص73، الحاشية]. وعند الجاحظ «طِمْلَالِ»: «والطملال: الفقير» [@bayan، ج1 ص161]."
