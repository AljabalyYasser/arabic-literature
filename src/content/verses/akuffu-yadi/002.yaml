explained: false
first: "أَبِيتُ هَضِيمَ الْكَشْحِ مُضْطَمِرَ الْحَشَا"
second: "مِنَ الْجُوعِ أَخْشَى الذَّمَّ أَنْ أَتَضَلَّعَا"
vocabulary:
  - term: "هَضِيمَ الْكَشْحِ مُضْطَمِرَ الْحَشَا"
    text: "ضامر الجنب والبطن. يقول محقق «الحماسة»: «والهضيم الضامر والكشح ما بين الخاصرة إلى الضلع والمضطمر المهزول» [@tabrizi-hamasa، ج2 ص333]."
  - term: "أَتَضَلَّعَا"
    text: "أمتلئ، و«تضلع الرجل إذا امتلأ من الزاد» كما يقول محقق «الحماسة» [@tabrizi-hamasa، ج2 ص333]."
