explained: false
first: "وَإِنَّكَ مَهْمَا تُعْطِ بَطْنَكَ سُؤْلَهُ"
second: "وَفَرْجَكَ نَالَا مُنْتَهَى الذَّمِّ أَجْمَعَا"
vocabulary:
  - term: "سُؤْلَهُ"
    text: "ما يشتهيه، يقول محقق «الحماسة»: «السؤل المسؤول وأراد به ما يشتهيه» [@tabrizi-hamasa، ج2 ص333]."
  - term: "وَفَرْجَكَ"
    text: "الفرج: العضو التناسلي، والمراد شهوة النكاح. يقول: إن أعطيت بطنك كل ما يشتهي من الطعام، وأعطيت فرجك كل ما يشتهي من النساء، بلغ بك الاثنان غاية الذمّ."
