explained: false
first: "أَكُفُّ يَدِي عَنْ أَنْ يَنَالَ الْتِمَاسُهَا"
second: "أَكُفَّ صِحَابِي حِينَ حَاجَتُنَا مَعَا"
vocabulary:
  - term: "يَنَالَ الْتِمَاسُهَا أَكُفَّ صِحَابِي"
    text: "أن تمتدّ يدي إلى ما تمتدّ إليه أيدي أصحابي. ويقول محقق «الحماسة» في معناه: «أني أقبض يدي إذا جلسنا على الطعام إيثارا لأصحابي خوفا من نفاد الزاد في حال احتياجنا كلنا إلى الطعام» [@tabrizi-hamasa، ج2 ص333]."
  - term: "حِينَ حَاجَتُنَا مَعَا"
    text: "حين نجوع جميعًا."
