first: "وَإِنِّي لَأَسْتَحْيِي رَفِيقِيَ أَنْ يَرَى"
second: "مَكَانَ يَدِي مِنْ جَانِبِ الزَّادِ أَقْرَعَا"
vocabulary:
  - term: "أَقْرَعَا"
    text: "خاليًا، يقول محقق «الحماسة»: «أراد بالأقرع الخالي من الطعام» [@tabrizi-hamasa، ج2 ص333]، أي يستحيي أن يرى رفيقه أنه أكل كل ما يليه."
