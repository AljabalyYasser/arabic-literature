first: "أَحَلْتُ عَلَيْهَا بِالْقَطِيعِ فَأَجْذَمَتْ"
second: "وَقَدْ خَبَّ آلُ الْأَمْعَزِ الْمُتَوَقِّدِ"
meaning: "أقبلت على ناقتي أضربها بالسوط فأسرعت، والسراب يضطرب فوق الأرض الكثيرة الحصى التي تتوقد من الحر. قال الزَّوْزَنِيّ: «أقبلت على الناقة أضربها بالسوط، فأسرعت في السير في حال خبب آل الأماكن التي اختلطت بتربتها بالحجارة والحصى» [@zawzani، ص104]."
vocabulary:
  - term: "أَحَلْتُ"
    text: "أقبلت. «(أحلت) معناه أقبلت عليها بالسوط. يقال: أحلت عليه ضربا، إذا أقبلت تضربه ضربا في إثر ضرب» [@ibn-al-anbari، ص184]."
  - term: "الْقَطِيعِ"
    text: "«السوط» [@ibn-al-anbari، ص184] [@zawzani، ص103]."
  - term: "أَجْذَمَتْ"
    text: "«أسرعت. يقال ناقة مجذام؛ إذا كانت سريعة» [@ibn-al-anbari، ص184]."
  - term: "خَبَّ"
    text: "«جرى واضطرب؛ وذلك عند اشتداد الحر». والخَبَب في الأصل من سير الدواب: «ويقال: قد خب البعير والفرس، والاسم منه الخبب. والخبب دون التقريب» [@ibn-al-anbari، ص184]. والتقريب عَدْوٌ أسرع منه."
  - term: "آلُ"
    text: "«السراب» عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص184]. وفرّق الزَّوْزَنِيّ بينهما: «الآل: ما يُرى شبه السراب طرفي النهار، والسراب ما كان نصف النهار» [@zawzani، ص103–104]."
  - term: "الْأَمْعَزِ الْمُتَوَقِّدِ"
    text: "قال أبو زيد: «والأمعز والمعزاء: المكان الغليظ الكثير الحصى». و«المتوقد: الذي يتوقد بالحر» [@ibn-al-anbari، ص184]."
syntax:
  - "«بِالْقَطِيعِ» متعلق بـ«أحلت»، والباء للاستعانة. والفاء في «فَأَجْذَمَتْ» للتعقيب: أسرعت عقب الضرب بلا مهلة."
  - "جملة «وَقَدْ خَبَّ» في موضع الحال. قال ابن الأَنْبارِيّ إن الواو فيها «واو الحال، والآل مرتفع بفعله، وهو مضاف إلى ما بعده» [@ibn-al-anbari، ص185]. و«مرتفع بفعله» في عبارته أي فاعل «خبّ»."
  - "«الْمُتَوَقِّدِ» نعت لـ«الأمعز» مجرور مثله."
morphology:
  - "«أَحَلْتُ» ماضي «أحال» على «أفعل» من «حال يحول». ومنه قولهم: «يُحيلون السِّجال على السجال»، «أي يصبون دلوا على إثر دلو» [@ibn-al-anbari، ص184]. والسِّجال: الدلاء."
  - "«أَجْذَمَتْ» على «أفعل»، والصفة منه للمبالغة «مِجْذام» على «مِفْعال». وأصل المادة القطع: «ويقال: جذمت الشيء: قطعته» [@ibn-al-anbari، ص184]؛ فكأن الناقة تقطع الأرض قطعًا."
  - "«الْمُتَوَقِّد» اسم فاعل من «توقّد» على «تفعّل»، وللفعل مصادر كثيرة: «توقدت النار توقدا، ووقدانا، ووقدا، وقدة» [@ibn-al-anbari، ص184]. و«الأمعز» يُجمع على «الأماعز» [@zawzani، ص104]."
rhetoric:
  thesis: "ضربة سوط واحدة في هاجرة لا يتحرك فيها شيء إلا السراب، فتسرع الناقة كأنها لا تحس بالحر."
  devices:
    - title: "الاستعارة"
      text: "الخَبَب سير البعير والفرس [@ibn-al-anbari، ص184]، فجعل للسراب خببًا كما للناقة. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]. فالأرض كلها تجري: الناقة تحت الراكب، والسراب فوق الحصى."
    - title: "الكناية عن الوقت"
      text: "لم يقل: كان ذلك في الظهيرة. ذكر السراب يضطرب والأرض تتوقد، فعرف السامع الوقت: «وذلك عند اشتداد الحر» [@ibn-al-anbari، ص184]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "فاء التعقيب"
      text: "بين «أحلت» و«فأجذمت» فاء واحدة، لا فاصل بين الضربة والإسراع. فالناقة نشيطة في أشد ساعات النهار، وهذا هو المدح."
  connection: "ثم يصفها تتبختر تحت السوط كما تتبختر جارية بين يدي سيدها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَحَلْتُ / عَلَيْهَا بِلْ / قَطِيعِ / فَأَجْذَمَتْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَقَدْ خَبْ / بَ ءَالُلْ أَمْ / عَزِلْ مُ / تَوَقْقِدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "يعود إلى الناقة بعد أول الفخر. وعلى قراءة أبي جعفر للبيت السابق يتصل هذا البيت به: القوم ينادون «من فتى يحدو بنا لننجو» [@ibn-al-anbari، ص183]، أي من يسوق الإبل بالغناء لننجو من هذه الفلاة، فيقبل الشاعر على ناقته بالسوط. فالبيتان (42–43) خاتمة لقسم الناقة، وفيهما الرحلة في أشد ساعات النهار."
