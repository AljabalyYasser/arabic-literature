first: "تَرَى جُثْوَتَيْنِ مِنْ تُرَابٍ عَلَيْهِمَا"
second: "صَفَائِحُ صُمٌّ مِنْ صَفِيحٍ مُنَضَّدِ"
meaning: "ترى قبريهما كومتين من التراب، عليهما حجارة عريضة صلبة، بين حجارة مصفوفة. قال الزَّوْزَنِيّ: «أرى قبري البخيل والجواد كومتين من التراب عليهما حجارة عراض صلاب، فيما بين قبور عليها حجارة عراض قد نضدت» [@zawzani، ص110]."
vocabulary:
  - term: "جُثْوَتَيْنِ"
    text: "مثنى جُثْوة، و«الجثوة: التراب المجموع» [@ibn-al-anbari، ص200]. «والجمع الجثى» [@zawzani، ص110]."
  - term: "صَفَائِحُ"
    text: "«صخور عراض صم صلاب» [@ibn-al-anbari، ص200]."
  - term: "صُمٌّ"
    text: "صلبة."
  - term: "مُنَضَّدِ"
    text: "«الذي نُضّد على القبر» [@ibn-al-anbari، ص200]، أي صُفّ بعضه فوق بعض."
syntax:
  - "«والجثوتان منصوبتان بترى، والصفائح ترتفع بعلى، وصم نعت الصفائح» [@ibn-al-anbari، ص200]؛ أي «صفائح» مبتدأ مؤخر وخبره «عليهما»."
  - "جملة «عليهما صفائح» صفة لـ«جثوتين»."
  - "«من تراب» و«من صفيح» للبيان."
morphology:
  - "«جُثْوة» بالضم والكسر، «والكسر أكثر» [@ibn-al-anbari، ص200]."
  - "«صفائح» جمع «صفيحة» على «فعائل»، و«الصفيح» اسم جنس لها [@ibn-al-anbari، ص200]."
  - "«مُنَضَّد» اسم مفعول من «نضّد» على «فعّل»، و«التنضيد: مبالغة النضد» [@zawzani، ص110]."
rhetoric:
  thesis: "بعد الحكم، الصورة: كومتان من تراب لا يُعرف أيهما قبر البخيل وأيهما قبر الجواد."
  devices:
    - title: "الوصف المحسوس"
      text: "لم يكتف بأن يقول إنهما سواء، بل رسم ما تراه العين في المقبرة: تراب مجموع، وحجارة عراض، وصفوف من القبور. فالحجة تصير مشهدًا."
    - title: "التكرار في الجذر"
      text: "«صفائح... من صفيح»: كرر الجذر نفسه، فثقلت الحجارة في السمع كما تثقل على القبر."
  connection: "ثم يقول: الموت يختار الكرام، ويختار أنفس مال البخيل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "تَرَى جُثْ / وَتَيْنِ مِنْ / تُرَابِنْ / عَلَيْهِمَا = فعولن / مفاعلن / فعولن / مفاعلن — صَفَائِ / حُ صُمْمُنْ مِنْ / صَفِيحِنْ / مُنَضْضَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "تكملة للبيت السابق. وليس في مختارات ابن قُتَيْبة من هذه الأبيات، لكنه في رواية ابن الأَنْبارِيّ والزَّوْزَنِيّ جميعًا [@ibn-al-anbari، ص200] [@zawzani، ص110]."
