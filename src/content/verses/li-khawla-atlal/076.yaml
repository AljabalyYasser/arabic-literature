first: "فَلَوْ كَانَ مَوْلَايَ امْرَأً هُوَ غَيْرُهُ"
second: "لَفَرَّجَ كَرْبِي أَوْ لَأَنْظَرَنِي غَدِي"
meaning: "لو كان ابن عمي رجلًا غير مالك، لكشف عني غمي، أو أمهلني على الأقل. قال الزَّوْزَنِيّ: «فلو كان ابن عمي غير مالك لفرج كربي أو لأمهلني زمانًا» [@zawzani، ص113]."
vocabulary:
  - term: "مَوْلَايَ"
    text: "«(المولى) هنا: ابن العم»، واستشهد ابن الأَنْبارِيّ بقوله تعالى: (يَومَ لا يُغْني مَولىً عن مَولىً شيئاً)، «معناه لا يغني ابن عم عن ابن عمه» [@ibn-al-anbari، ص208]."
  - term: "فَرَّجَ"
    text: "كشف: «فرَجْت الأمر وفرّجته: كشفته، والفرج انكشاف المكروه» [@zawzani، ص113]. وقال الطُّوسِيّ: «لفرج كربي، معناه أعانني على ما نزل بي من الغم» [@ibn-al-anbari، ص208]."
  - term: "كَرْبِي"
    text: "غمّي: «كربه الغم: إذا ملأ صدره، والكربة اسم منه، والجمع كرب» [@zawzani، ص113]."
  - term: "أَنْظَرَنِي غَدِي"
    text: "«معناه: تأنّ في أمري ولا تعجل عليَّ حتى أصير إلى ما تحب. ويقال أنظره غده، أي دعه حتى يرجع إليه حلمه ويحسن رأيه» [@ibn-al-anbari، ص208]."
syntax:
  - "«مولاي في موضع رفع على اسم الكون، وامرأ خبر الكون» [@ibn-al-anbari، ص207]. و«الكون» في عبارته «كان»: فـ«مولاي» اسمها، و«امرأً» خبرها."
  - "جملة «هو غيره» نعت لـ«امرأ»: «هو» مبتدأ يعود على «امرأ»، و«غيره» خبره، والهاء فيه لمالك."
  - "«لفرّج» جواب «لو»، واللام واقعة في جوابها. و«أو» للتخيير، و«لأنظرني» معطوف على الجواب، وفاعله ضمير ذلك الرجل، و«غدي» مفعوله الثاني، على قولهم: «أنظره غده» [@ibn-al-anbari، ص208]."
morphology:
  - "«أنظر» على «أفعل» غير «نظر» الثلاثي: «ويقال نظرت الرجل أنظره، إذا انتظرته؛ وأنظرته أنظره، إذا أخرته» [@ibn-al-anbari، ص208]. فالهمزة نقلت المعنى من الانتظار إلى الإمهال."
  - "«فرّج» على «فعّل» من «فرَج»، والتضعيف للمبالغة؛ والفعلان بمعنى واحد عند الزَّوْزَنِيّ [@zawzani، ص113]."
  - "«امرأً» من الأسماء التي تتبع راؤها حركة الإعراب: امرؤٌ، امرأً، امرئٍ. ولذلك جاء في هذا البيت «امرأً» منصوبًا، وفي البيت التالي «امرؤٌ» مرفوعًا."
rhetoric:
  thesis: "أمنية مستحيلة: لو كان ابن عمه غيره. فالمشكلة ليست في القرابة، بل في هذا القريب بعينه."
  devices:
    - title: "الشرط بـ«لو»"
      text: "«لو» حرف امتناع لامتناع: امتنع الفرج لامتناع أن يكون مولاه غير مالك. فالبيت يقول بطريق غير مباشر: مالك هو سبب كربي."
    - title: "التدرج في الطلب"
      text: "«لفرّج كربي أو لأنظرني غدي»: أكبر الطلب أن يكشف الغم، وأقله أن يمهله. فالشاعر ينزل بطلبه إلى الحد الأدنى، ومع ذلك لا يجده عند ابن عمه."
    - title: "الغد عطية"
      text: "جعل الغد شيئًا يُعطى: «أنظره غده، أي دعه حتى يرجع إليه حلمه ويحسن رأيه» [@ibn-al-anbari، ص208]. فالمطلوب وقت فقط، وهو أيسر ما يُطلب."
  connection: "ثم يستدرك: لكن ابن عمه يضيّق عليه كأنه يخنقه، شكره أو سأله أو افتدى نفسه منه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَلَوْ كَا / نَ مَوْلَايَمْ / رَأَنْ هُ / وَ غَيْرُهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — لَفَرْرَ / جَ كَرْبِي أَوْ / لَأَنْظَ / رَنِي غَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "يبدأ به زوج من الأبيات (76–77) قائم على «لو» ثم «لكنّ»: لو كان غيره لكان كذا، لكنه هو فكان كذا. وفي رواية أخرى يسمّي الرجل الذي يتمناه مكان ابن عمه: «فلو كان مولاي ابن أصرم مسهر» [@ibn-al-anbari، ص207]. ولا يذكر ابن الأَنْبارِيّ من هو، ويكتفي بإعراب الروايتين."
variants:
  - reading: "فَلَوْ كَانَ مَوْلَايَ ابْنُ أَصْرَمَ مُسْهِرٌ"
    status: "رواية أخرى"
    note: "«ومن روى الرواية الثانية قال: مولاي في موضع نصب على خبر الكون، وابن أصرم اسم الكون، ومسهر مترجم عن الابن» [@ibn-al-anbari، ص207]. والمترجم في عبارة الكوفيين البدل: فـ«مسهر» بدل من «ابن أصرم». وعلى هذه الرواية يتمنى رجلًا بعينه مكان ابن عمه."
