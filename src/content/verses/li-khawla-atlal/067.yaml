first: "لَعَمْرُكَ إِنَّ الْمَوْتَ مَا أَخْطَأَ الْفَتَى"
second: "لَكَالطِّوَلِ الْمُرْخَى وَثِنْيَاهُ فِي الْيَدِ"
meaning: "أقسم بحياتك: إن الموت، ما دام لم يصب الفتى بعد، كحبل طويل أُرخي لدابة ترعى، وطرفاه في يد صاحبها، يجذبها متى شاء. قال ابن الأَنْبارِيّ: «فيقول: الإنسان قد مد له في أجله، وهو آتيه لا محالة، وهو في يدي من يملك قبض روحه كما أن صاحب الفرس الذي قد طول له إذا شاء اجتذبه وثناه إليه» [@ibn-al-anbari، ص202]."
vocabulary:
  - term: "لَعَمْرُكَ"
    text: "«معناه وحياتك»، وفيه ثلاث لغات، والمختارة «لعمرك» باللام والرفع [@ibn-al-anbari، ص201]. و«لا يستعمل في القسم إلا بفتح العين» [@zawzani، ص110]."
  - term: "مَا أَخْطَأَ"
    text: "مدة إخطائه، أي ما دام يتجاوزه ولم يصبه [@zawzani، ص110]."
  - term: "الطِّوَلِ"
    text: "«حبل طويل تربط به الدابة يطول لها في الكلأ حتى ترعاه» [@ibn-al-anbari، ص202]."
  - term: "الْمُرْخَى"
    text: "المرسَل. «الإرخاء: الإرسال» [@zawzani، ص110]."
  - term: "ثِنْيَاهُ"
    text: "طرفاه: «ما انثنى على يده وعطفه إليه» [@ibn-al-anbari، ص202]."
syntax:
  - "«لعمرك» مبتدأ خبره محذوف: لعمرك قسمي، واللام لام الابتداء. وجملة «إن الموت...» جواب القسم."
  - "«وموضع ما نصب، وهي في تقدير المصدر... لعمرك إن الموت في إخطائه الفتى» [@ibn-al-anbari، ص202]؛ فـ«ما» مصدرية ظرفية: مدة إخطائه. «والكاف في موضع رفع على خبر إن» [@ibn-al-anbari، ص202]، واللام قبلها لام التوكيد المزحلقة."
  - "جملة «وثنياه في اليد» حال من «الطِّوَل»."
morphology:
  - "«الطِّوَل» على «فِعَل» من الطول، ويقال: «الفرس يرعى في طوله، أي في حبل قد طول له فيه» [@ibn-al-anbari، ص202]."
  - "«المُرْخَى» اسم مفعول من «أرخى» الرباعي."
  - "«ثِنْيا» مثنى «ثِنْي»، حُذفت نونه للإضافة، وجمع الثني «الأثناء» [@zawzani، ص110]."
rhetoric:
  thesis: "أشهر صورة للموت في المعلقة: الحياة ليست حرية، بل مسافة حبل طويل. الإنسان يرعى ويظن نفسه طليقًا، والطرف الآخر في يد الموت."
  devices:
    - title: "التمثيل"
      text: "شبّه حال الإنسان مع الموت بحال دابة أُرخي لها الحبل وطرفاه في يد صاحبها. والتمثيل عند عبد القاهر الجُرْجانيّ تشبيه لا يتم «إلا بتأوّل»، أي بإعمال الفكر، لأن الشبه فيه بين معنى وصورة لا يُدرك بالعين وحدها؛ «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص92، ص95]. والشبه هنا لا يُرى بالعين: فهو ليس في لون ولا شكل، بل في حكم يستخرجه العقل من الصورتين: أن البعد لا يعني النجاة."
    - title: "القسم والتوكيد"
      text: "بدأ بالقسم «لعمرك»، ثم «إنّ»، ثم اللام في «لكالطول». ثلاثة مؤكدات لحقيقة لا ينكرها أحد، لكن الناس يعيشون كأنهم ينكرونها."
    - title: "دقة القيد"
      text: "«ما أخطأ الفتى»: قيّد التشبيه بمدة الإخطاء. فالموت لا يشبه الحبل وهو يأخذ، بل وهو يترك. وحين يشاء «قاد الفتى لهلاكه» [@zawzani، ص110]."
  connection: "ثم يلتفت من الموت إلى الحياة وما فيها من ظلم الأقارب: ابن عمه مالك."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "لَعَمْرُ / كَ إِنْنَلْ مَوْ / تَ مَا أَخْ / طَأَلْ فَتَى = فعولُ / مفاعيلن / فعولن / مفاعلن — لَكَطْطِ / وَلِلْ مُرْخَى / وَثِنْيَا / هُ فِلْ يَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "آخر الأبيات التي اختارها ابن قُتَيْبة «من جيد شعره» [@ibn-qutayba، ج1 ص183]، وبه تختم فلسفة الموت في المعلقة. وهو المثال الذي نبني عليه أداة هذه المحطة: التمثيل."
