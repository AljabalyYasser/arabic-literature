first: "أَلَا أَيُّهَذَا اللَّائِمِي أَشْهَدُ الْوَغَى"
second: "وَأَنْ أَحْضُرَ اللَّذَّاتِ هَلْ أَنْتَ مُخْلِدِي"
meaning: "يا من يلومني على شهود الحرب وحضور اللذات: هل تستطيع أن تخلّدني إن تركتهما؟ قال الزَّوْزَنِيّ: «يقول: ألا أيها الإنسان الذي يلومني على حضور الحرب وحضور اللذات هل تخلدني إن كففت عنها؟» [@zawzani، ص107]."
vocabulary:
  - term: "اللَّائِمِي"
    text: "الذي يلومني. «يقال: لمت الرجل ألومه لوما ولائمة وملاما، إذا عذلته» [@ibn-al-anbari، ص192]."
  - term: "الْوَغَى"
    text: "«أصله صوت الأبطال في الحرب ثم جعل اسمًا للحرب» [@zawzani، ص107]."
  - term: "مُخْلِدِي"
    text: "مُبقيّ. «الخلود: البقاء... والإخلاد والتخليد الإبقاء» [@zawzani، ص107]."
syntax:
  - "«أيّهذا»: «معناه يأيهذا اللائمي» [@ibn-al-anbari، ص192]، فحرف النداء محذوف. «وموضع اللائمي رفع على الإتباع لهذا» [@ibn-al-anbari، ص193]."
  - "«أشهدُ» بالرفع على حذف «أنْ»: «لما فقد المستقبل أن رفع»، ويروى بالنصب «أشهدَ» على إضمار «أن» [@ibn-al-anbari، ص193]. واستشهد سِيبَوَيْه بالبيت على الرفع، وجعله قليلًا في الكلام، «فالفعل كأنه في موضع اسم منصوب» [@sibawayh، ج3 ص99]."
  - "«وموضع أن نصب بفقد الخافض» [@ibn-al-anbari، ص193]، أي: يلومني على أن أحضر. و«هل أنت مخلدي» استفهام جوابه منفيّ في المعنى."
morphology:
  - "«اللائم» اسم فاعل من «لام يلوم»، أصل الهمزة فيه واو؛ و«رجل لُوَمة: يلوم الناس» [@ibn-al-anbari، ص192–193]."
  - "«مُخْلِد» اسم فاعل من «أخلد» الرباعي."
  - "«الوغى» و«الوحى»: «الصوت في الحرب» [@ibn-al-anbari، ص193]."
rhetoric:
  thesis: "من الوصف إلى الجدال: يلتفت إلى لائمه بسؤال لا جواب له إلا «لا». ومن هذا السؤال تقوم فلسفة القصيدة كلها."
  devices:
    - title: "الاستفهام الإنكاري"
      text: "«هل أنت مخلدي؟» سؤال لا ينتظر جوابًا، لأن جوابه معروف. فهو إنكار في صورة سؤال: لا أحد يخلّد أحدًا."
    - title: "النداء"
      text: "نادى اللائم بـ«أيّهذا»، فجاء باسم الإشارة بعد «أيّ» كأنه يشير إليه أمامه. فالبيت يبدأ مخاطبة مباشرة، لا حديثًا عن غائب."
    - title: "الجمع بين الحرب واللذة"
      text: "الوغى واللذات أمران متباعدان، جمعهما لأنهما عنده من باب واحد: كلاهما إنفاق للحياة قبل أن تنفد."
  connection: "ثم يستنتج من سؤاله: إن كنت لا تدفع عني الموت فدعني أسبقه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَلَا أَيْ / يُهَاذَلْ لَا / ئِمِي أَشْ / هَدُلْ وَغَى = فعولن / مفاعيلن / فعولن / مفاعلن — وَأَنْ أَحْ / ضُرَلْ لَذْذَا / تِ هَلْ أَنْ / تَ مُخْلِدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "من أشهر أبيات المعلقة، وجعله ابن قُتَيْبة «من جيد شعره» [@ibn-qutayba، ج1 ص189]. وهو شاهد مشهور عند النحويين في رفع الفعل بعد حذف «أنْ» [@sibawayh، ج3 ص99–100]."
