first: "يَشُقُّ حَبَابَ الْمَاءِ حَيْزُومُهَا بِهَا"
second: "كَمَا قَسَمَ التُّرْبَ الْمُفَايِلُ بِالْيَدِ"
meaning: "يشق صدرُ السفينة أمواج الماء، كما يقسم اللاعب بيده كومة التراب في لعبة الفِيال. قال ابن الأَنْبارِيّ: «معناه يشق حيزومها حباب الماء» [@ibn-al-anbari، ص138]."
vocabulary:
  - term: "حَبَابَ"
    text: "«طرائق الماء». وقال أبو عَمْرو وابن الأعرابي: «هو أمواجه». وقال غيرهما: «النفاخات التي تراها فوق الماء» [@ibn-al-anbari، ص138]."
  - term: "حَيْزُومُهَا"
    text: "صدرها. «والحيزوم: الصدر، يقال له حيزوم وحزيم» [@ibn-al-anbari، ص138]."
  - term: "الْمُفَايِلُ"
    text: "اللاعب بالفِيال، وهي «لعبة لصبيان الأعراب... وهي تراب يكومونه، أو رمل يخبؤون فيه خبيا، ثم يشق المفايل تلك الكومة بيده فيقسمها قسمين ثم يقول: في أي الجانبين خبأت؟ فإن أصاب ظفر، وإن أخطأ قمر» [@ibn-al-anbari، ص139]. وقَمَر: غلب في الرهان."
  - term: "التُّرْبَ"
    text: "التراب، وله أسماء: «التورب، والتيرب، والتوراب، والتيراب، والترباء» [@ibn-al-anbari، ص139]."
syntax:
  - "«حَيْزُومُهَا» فاعل مؤخر، و«حَبَابَ الْمَاءِ» مفعول مقدم، والتقدير: «يشق حيزومها حباب الماء» [@ibn-al-anbari، ص138]. و«بِهَا» متعلق بـ«يَشُقُّ»."
  - "«كَمَا»: الكاف في موضع نصب، و«ما» مصدرية في موضع خفض بالكاف، «ولا عائد لها لأنها في معنى المصدر. والمفايل رفع بقسم، والترب مفعوله» [@ibn-al-anbari، ص139]. والتقدير: يشقه شقًّا مثل قَسْم المفايل التراب."
morphology:
  - "«حَيْزُوم» يُجمع على «حيازيم» و«حيازم» [@ibn-al-anbari، ص138]."
  - "«الشَّقّ» بفتح الشين المصدر، و«الشِّقّ» بكسرها الاسم ونصف الشيء [@ibn-al-anbari، ص138]."
  - "«المُفايِل» اسم فاعل من «فايَلَ يُفايِلُ مُفايلةً وفِيالًا» [@zawzani، ص90]."
rhetoric:
  thesis: "البحر وسفينته يُفهمان بلعبة يعرفها صبيان البادية. فالشاعر يرد الغريب إلى المألوف."
  devices:
    - title: "التشبيه بالهيئة"
      text: "شبّه «شق السفن الماء بشق المفايل التراب المجموع بيده» [@zawzani، ص90]: صدر يمضي في كتلة فيقسمها قسمين، والماء ينشق عن جانبي السفينة كما ينشق التراب عن جانبي اليد."
    - title: "التقريب بين البعيدين"
      text: "قال ابن رَشِيق: «وإنما حسن التشبيه أن يقرب بين البعيدين» [@ibn-rashiq، ج1 ص289]. والبحر ولعب الصبيان بالتراب بعيدان، جمعهما الشاعر في حركة يد."
    - title: "معنى سبق إليه"
      text: "جعله ابن قُتَيْبة مما «سبق إليه طَرَفَة فأخذ منه». أخذه لَبِيد فقال في ناقته: «تشق خمائل الدهنا يداه / كما لعب المقامر بالفيال»، وأخذه الطِّرِمّاح [@ibn-qutayba، ج1 ص187]."
  connection: "ثم ينتقل من الظعائن الراحلة إلى صاحبته في الحي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "يَشُقْقُ / حَبَابَلْ مَا / ءِ حَيْزُو / مُهَا بِهَا = فعولُ / مفاعيلن / فعولن / مفاعلن — كَمَا قَ / سَمَتْ تُرْبَلْ / مُفَايِ / لُ بِلْيَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "يختم التشبيه الممتد بصورة الحركة: السفينة ماضية تشق الماء. وقد جعل ابن قُتَيْبة هذا البيت أول ما يذكره مما سبق إليه طَرَفَة وأخذه الشعراء عنه [@ibn-qutayba، ج1 ص187]."
