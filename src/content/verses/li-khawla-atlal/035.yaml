first: "وَأَرْوَعُ نَبَّاضٌ أَحَذُّ مُلَمْلَمٌ"
second: "كَمِرْدَاةِ صَخْرٍ فِي صَفِيحٍ مُصَمَّدِ"
meaning: "ولها قلب ذكيّ يرتاع لأدنى شيء، كثير النبض، خفيف، مجتمع صلب، كأنه حجر تُكسر به الصخور بين حجارة عريضة محكمة. قال الزَّوْزَنِيّ: «لها قلب يرتاع لأدنى شيء لفرط ذكائه، سريع الحركة خفيف صلب مجتمع الخلق، يشبه صخرة يكسر بها الصخور في الصلابة فيما بين أضلاع تشبه حجارة عراضًا موثقة محكمة» [@zawzani، ص102]."
vocabulary:
  - term: "أَرْوَعُ"
    text: "«يعنى قلبها، وهو الحديد السريع الارتياع من القلوب، لحدته» [@ibn-al-anbari، ص179]. و«الأروع: الذي يرتاع لكل شيء لفرط ذكائه» [@zawzani، ص102]."
  - term: "نَبَّاضٌ"
    text: "«ينبض، أي يضرب من الفزع» [@ibn-al-anbari، ص179]."
  - term: "أَحَذُّ"
    text: "«الأملس الذي ليس شيء يتعلق به. وقال أبو عمرو: هو الخفيف» [@ibn-al-anbari، ص179]. وبه فسّره المُبَرِّد: «الأحذ: الخفيف» [@kamil، ج3 ص64]."
  - term: "مُلَمْلَمٌ"
    text: "«معناه مجتمع» [@ibn-al-anbari، ص179]. و«الململم: المجتمع الخلق الشديد الصلب» [@zawzani، ص102]."
  - term: "مِرْدَاةِ"
    text: "«صخرة تدق الصخور بها. يقال: رديت الحجر ورديته، إذا صككته بحجر آخر لتكسره» [@ibn-al-anbari، ص179]."
  - term: "صَفِيحٍ مُصَمَّدِ"
    text: "«والصفيح: صخر فيه عرض. و (المصمد): المشدد» [@ibn-al-anbari، ص179]. و«المصمَّد: المحكم الموثق» [@zawzani، ص102]."
syntax:
  - "«والأروع نسق على ما قبلها» [@ibn-al-anbari، ص179]، أي معطوف على الأعضاء التي عدّها قبله: ولها أتلع، وجمجمة، ووجه، وعينان، وأروع. و«أروع» صفة حُذف موصوفها، وهو القلب."
  - "«والنباض نعته، والكاف نعت له أيضا. والمصمد نعت للصفيح» [@ibn-al-anbari، ص179]."
  - "«كمرداة صخر» على معنى «من»: «معناه كمرداة من صخر، كما تقول: كمرداة حديد، وكخاتم فضة» [@ibn-al-anbari، ص179]. و«في صفيح، أي فيما بين صفيح». «والمصمّد نعت للصفيح على لفظه دون معناه» [@zawzani، ص102]: فالصفيح جمع في المعنى، ونُعت بالمفرد مراعاة للفظه."
morphology:
  - "«نبّاض» على «فعّال»، «مبالغة النابض من نبض ينبض نبضانًا» [@zawzani، ص102]."
  - "«مِرْداة» اسم آلة على «مِفْعالة» من «ردى»، أي صكّ الحجر بالحجر [@ibn-al-anbari، ص179]."
  - "«مُلَمْلَم» من «لملم» الرباعي المضعّف، و«مُصمَّد» اسم مفعول من «صمّد». و«الصفيحة: الحجر العريض، والجمع الصفائح والصفيح» [@zawzani، ص102]."
rhetoric:
  thesis: "ينتقل النحّات إلى الداخل: قلب يرتاع كقلب الوحش، ويصلب كحجر الكسر."
  devices:
    - title: "في التمثال: القلب"
      text: "بعد الأعضاء الظاهرة يصف عضوًا لا يُرى. وهذا ما قصده شوقي ضيف حين قال إن طَرَفَة «لم يترك فيها صغيرة ولا كبيرة إلا رسمها» [@deif، ج1 ص430]. ويقول في موضع آخر إن الأعشى «لا يطيل فى وصف أعضاء الناقة صنيع طرفة» [@deif، ج1 ص354]؛ فالتفصيل عنده علامة طَرَفَة الخاصة."
    - title: "جمع الضدين"
      text: "القلب «أروع» يرتاع لكل شيء، وهو مع ذلك «ململم» صلب كالمرداة. فالارتياع هنا ذكاء لا جبن: «الذي يرتاع لكل شيء لفرط ذكائه» [@zawzani، ص102]. وقال أبو جعفر: «قلب شديد ليس بمسترخ» [@ibn-al-anbari، ص179]. فالناقة يقظة كالوحش، ثابتة كالصخر."
    - title: "التشبيه"
      text: "شبّه القلب وموضعه معًا: «شبه القلب بين الأضلاع بحجر صلب بين حجارة عراض» [@zawzani، ص102]. فالأضلاع صفيح، كما كان الصدر سقفًا من صفائح في البيت 24. والتشبيه عند ابن رَشِيق «صفة الشيء بما قاربه وشاكله، ومن جهة واحدة أو جهات كثيرة لا من جميع جهاته» [@ibn-rashiq، ج1 ص286]."
  connection: "ثم يصف طاعتها لراكبها: إن شاء رفعت رأسها وأسرعت."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَأَرْوَ / عُ نَبْبَاضُنْ / أَحَذْذُ / مُلَمْلَمُنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — كَمِرْدَا / ةِ صَخْرِنْ فِي / صَفِيحِنْ / مُصَمْمَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]."
context: "آخر ما في الرأس والصدر (28–35)، وبعده يصف الناقة وهي تطيع راكبها (36–37)، ثم يعود إلى الأنف (38). وقد استشهد المُبَرِّد في «الكامل» بلفظ «أحذّ» من هذا البيت، لكنه رواه: «وأتلع نهاض أحذ ململم» [@kamil، ج3 ص64]، فجمع أول البيت 28 إلى آخر هذا الصدر."
variants:
  - reading: "وَأَتْلَعُ نَهَّاضٌ أَحَذُّ مُلَمْلَمٌ"
    status: "في «الكامل» للمُبَرِّد"
    note: "أورده شاهدًا على أن الأحذّ الخفيف [@kamil، ج3 ص64]. ولعله خلط أول البيت 28 بهذا البيت؛ ومحقق «الكامل» يثبت في الحاشية «وأروع نباض» [@kamil، ج3 ص64، حاشية المحقق]."
