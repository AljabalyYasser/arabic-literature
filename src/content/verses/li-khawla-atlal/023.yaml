first: "صُهَابِيَّةُ الْعُثْنُونِ مُوجَدَةُ الْقَرَا"
second: "بَعِيدَةُ وَخْدِ الرِّجْلِ مَوَّارَةُ الْيَدِ"
meaning: "في شعر ذقنها حمرة، وظهرها موثّق شديد، ترمي برجلها إلى الخلف رميًا بعيدًا، ويدها تذهب وتجيء في سهولة. قال الزَّوْزَنِيّ: «في عثنونها صهبة وفي ظهرها قوة وشدة، ويبعد ذميل رجليها ومور يديها في السير» [@zawzani، ص97]. والذميل: سير ليّن."
vocabulary:
  - term: "صُهَابِيَّةُ"
    text: "«التي لونها يضرب إلى الصهبة، وهي الحمرة». وقال الأصمعي: «إذا قيل صهابية العثنون فإنما يعنون اللون. وإذا قيل صهابية بغير الإضافة فإنما هي منسوبة إلى فحل يقال له صهاب» [@ibn-al-anbari، ص166]."
  - term: "الْعُثْنُونِ"
    text: "«ما تحت لحييها من الشعر» [@ibn-al-anbari، ص166]، و«شعرات تحت لحيها الأسفل» [@zawzani، ص97]. واللَّحْي: عظم الفك."
  - term: "مُوجَدَةُ"
    text: "«شديدة القرا موثقة المطا، وهو الظهر» [@ibn-al-anbari، ص166]. و«الموجدة: المقوَّاة... ومنه قولهم: بعير أجد، أي: شديد الخلق قوي» [@zawzani، ص97]."
  - term: "الْقَرَا"
    text: "«القرا: الظهر، والجمع الأقراء» [@zawzani، ص97]."
  - term: "وَخْدِ"
    text: "قال أحمد بن عبيد: «وخدها: زجها برجلها إلى خلف. أي ترمى برجلها إلى خلفها رميا واسعا، وذلك لسعة ما بين رجليها» [@ibn-al-anbari، ص166]."
  - term: "مَوَّارَةُ"
    text: "«معناه يدها ليست بكزة، ولكنها تمور، لأن جلد كتفيها ومنكبيها رهل» [@ibn-al-anbari، ص166–167]. والكزّ: اليابس المنقبض، والرَّهِل: الليّن المسترخي. و«المور: الذهاب والمجيء» [@zawzani، ص97]."
syntax:
  - "«والصهابية ترتفع بإضمار هي، والموجدة نعتها، وكذلك البعيدة والموارة» [@ibn-al-anbari، ص167]: «صهابية» خبر لمبتدأ محذوف تقديره «هي»، وما بعدها أوصاف لها."
  - "«ويجوز نصبهن على المدح» [@ibn-al-anbari، ص167]، أي بفعل محذوف تقديره «أمدح»، وهو ما يسميه النحاة القطع. وأجاز الزَّوْزَنِيّ الجر «على الصفة لعوجاء» في البيت 11، والرفع «على أنه خبر مبتدأ محذوف» [@zawzani، ص97]."
  - "الإضافة في «صهابية العثنون» و«موجدة القرا» و«بعيدة وخد الرجل» و«موارة اليد» إضافة الصفة إلى ما يتصف بها في المعنى: عثنونها صهابيّ، وقراها موجَد. وعند الأَصْمَعِيّ أن هذه الإضافة هي التي تجعل «صهابية» صفة لون لا نسبة إلى فحل [@ibn-al-anbari، ص166]."
morphology:
  - "«صُهابيّة» بياء النسب: إلى لون «الصهبة» إذا أضيفت، وإلى فحل اسمه «صهاب» إذا لم تُضف [@ibn-al-anbari، ص166]."
  - "«مُوجَدة» اسم مفعول من «أوجد» بمعنى قوّى: «والإيجاد التقوية» [@zawzani، ص97]."
  - "«موّارة» على «فعّالة»، «مبالغة المائرة، وقد مارت تمور مورًا فهي مائرة» [@zawzani، ص97]. و«الوخد» مصدر: «يقال: وخد يخد وخدا» [@ibn-al-anbari، ص166]."
rhetoric:
  thesis: "بيت من أربعة أوصاف متوازية: لون، وظهر، ورجل، ويد. والتمثال هنا يأخذ لونه وخطوه."
  devices:
    - title: "في التمثال: اللون والخطو"
      text: "بعد الهيكل يضيف اللون: صهبة في شعر الذقن، وهي عند الرُّسْتُمِيّ «نجار النجائب» [@ibn-al-anbari، ص166]، أي من أصل كرام الإبل. ثم يضيف الخطو: الرجل ترمي إلى الخلف، واليد تذهب وتجيء. يقول شوقي ضيف إن طَرَفَة يصف ناقته «وهى سائرة به فى طريق إلى غاية تصبو إليها نفسه» [@deif، ج1 ص223]."
    - title: "المقابلة"
      text: "المقابلة أن تأتي بمعنيين ثم بما يقابلهما. وهي هنا في العَجُز: «بعيدة وخد الرجل» في مقابل «موّارة اليد». ولكل قائمة ما يُمدح فيها: فالرجل تُمدح بالدفع القوي، واليد بالمور، «لأن الرجل لا تمور إلا من ضعف، واليد لا تقصر إلا من يبس عصب» [@ibn-al-anbari، ص166]."
    - title: "تتابع الأوصاف"
      text: "أربعة أوصاف بلا عاطف، كلها مضاف ومضاف إليه: «صهابية العثنون، موجدة القرا، بعيدة وخد الرجل، موارة اليد». والبناء المتكرر يجعل البيت كالقائمة التي يعدّها خبير بالإبل."
  connection: "ثم يصف يديها وعضديها: فُتلت فتلًا شديدًا، وكأن أعلاها سقف من صخر."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "صُهَابِيْ / يَتُلْ عُثْنُو / نِ مُوجَ / دَتُلْ قَرَا = فعولن / مفاعيلن / فعولُ / مفاعلن — بَعِيدَ / ةُ وَخْدِرْ رِجْ / لِ مَوْوَا / رَتُلْ يَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "بعد المرفقين والقنطرة (21–22) يعود إلى الناقة جملة: لونها وظهرها ومشيتها، ثم يمضي إلى اليدين والعضدين والكتفين (24–25). وفي البيت ألفاظ لا يعرفها إلا أهل الإبل، كالعثنون والقرا والوخد، ولذلك جمع ابن الأَنْبارِيّ في تفسيره أقوال الأَصْمَعِيّ والرُّسْتُمِيّ وأبي عمرو الشيباني وأحمد بن عبيد [@ibn-al-anbari، ص166]."
