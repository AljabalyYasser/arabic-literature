first: "وَتَقْصِيرُ يَوْمِ الدَّجْنِ وَالدَّجْنُ مُعْجِبٌ"
second: "بِبَهْكَنَةٍ تَحْتَ الْخِبَاءِ الْمُعَمَّدِ"
meaning: "والثالثة أن أقصّر يوم الغيم، ويوم الغيم يعجب النفس، بصحبة امرأة جميلة تامة الخلق تحت خباء مرفوع بالعمد. قال ابن الأَنْبارِيّ: «معناه أقصره باللهو، ويوم اللهو قصير، وليلة اللهو والسرور قصيران» [@ibn-al-anbari، ص196]."
vocabulary:
  - term: "الدَّجْنِ"
    text: "«يوم الدجن يوم ندى ورش» [@ibn-al-anbari، ص197]. وعند الزَّوْزَنِيّ: «إلباس الغيم آفاق السماء» [@zawzani، ص109]."
  - term: "مُعْجِبٌ"
    text: "«أي: يعجب الإنسان» [@zawzani، ص109]."
  - term: "بَهْكَنَةٍ"
    text: "«التامة الخلق» [@ibn-al-anbari، ص197]. و«المرأة الحسنة الخلق السمينة الناعمة» [@zawzani، ص109]."
  - term: "الْخِبَاءِ الْمُعَمَّدِ"
    text: "الخباء: بيت من صوف أو وبر. «والمعمد: المرفوع بالعمد» [@ibn-al-anbari، ص197]."
syntax:
  - "«والتقصير نسق على سبق» [@ibn-al-anbari، ص197]، فهو الخلة الثالثة."
  - "«والدجن مرتفع بمعجب» [@ibn-al-anbari، ص197] على مذهب الكوفيين؛ وهي جملة حالية معترضة: والدجن مُعجِب."
  - "«ببهكنة» متعلق بـ«تقصير»: أقصره بصحبتها. و«تحت» ظرف متعلق بمحذوف حال."
morphology:
  - "«تَقْصير» مصدر «قصّر» على «تفعيل»: جعل الشيء قصيرًا [@zawzani، ص109]."
  - "«مُعْجِب» اسم فاعل من «أعجب»."
  - "«المُعَمَّد» اسم مفعول من «عمّد» على «فعّل»، من العمود."
rhetoric:
  thesis: "يوم الغيم طويل عادة لأن الناس يلزمون بيوتهم، وهو يقصّره: فالسرور يطوي الوقت."
  devices:
    - title: "المفارقة في الزمن"
      text: "«تقصير يوم الدجن»: اليوم لا يقصر حقًّا، بل يقصر في إحساس صاحبه. «ويوم اللهو قصير» [@ibn-al-anbari، ص196]، واستشهد ابن الأَنْبارِيّ بقول أعرابي: «لئن أيامنا أمست طوالا / لقد كنا نعيش بها قصارا» [@ibn-al-anbari، ص197]، «أي طالت بالحزن وقصرت بالسرور»."
    - title: "الجملة المعترضة"
      text: "«والدجنُ معجبٌ» جملة قصيرة تقطع الكلام لتقرر أن يوم الغيم نفسه جميل. فاجتمعت له متعتان: اليوم، والصحبة."
  connection: "ثم يصف ساعديها وساقيها (60)، ويعود إلى حجته: «كريم يروي نفسه في حياته»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَتَقْصِي / رُ يَوْمِدْ دَجْ / نِ وَدْدَجْ / نُ مُعْجِبُنْ = فعولن / مفاعيلن / فعولن / مفاعلن — بِبَهْكَ / نَتِنْ تَحْتَلْ / خِبَاءِلْ / مُعَمْمَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "من الأبيات الأربعة (56–59) التي يعدّ فيها «ثلاث خلال» تجعل الحياة عنده جديرة بأن تُعاش. وقد عدّها ابن رَشِيق من «الاختراع»، وهو عنده «ما لم يسبق إليه قائله، ولا عمل أحد من الشعراء قبله نظيره أو ما يقرب منه» [@ibn-rashiq، ج1 ص262]. ويرى شوقي ضيف أنه «يجعل من خلال الفتى هذه الخصال الثلاث، وهي الخمر والفروسية أو الشجاعة في الحرب والتمتع بالنساء» [@deif، ج1 ص71]. ويقول الزَّوْزَنِيّ: «وشرط تقصير اليوم؛ لأن أوقات اللهو والطرب أقصر الأوقات» [@zawzani، ص109]."
