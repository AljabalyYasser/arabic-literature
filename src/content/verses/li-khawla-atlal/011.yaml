first: "وَإِنِّي لَأُمْضِي الْهَمَّ عِنْدَ احْتِضَارِهِ"
second: "بِعَوْجَاءَ مِرْقَالٍ تَرُوحُ وَتَغْتَدِي"
meaning: "إذا نزل بي الهمّ طردته عني برحلة على ناقة ضامرة سريعة، تسير في العشيّ وتسير في الغداة. قال ابن الأَنْبارِيّ: «يقول: إذا نزل بي هم كثير سليته عنى وأمضيته بأن أرتحل على هذه الناقة العوجاء» [@ibn-al-anbari، ص150]."
vocabulary:
  - term: "لَأُمْضِي"
    text: "لأُذهب. يقال: أمضيته «إذا أذهبته عنك» [@ibn-al-anbari، ص149]."
  - term: "احْتِضَارِهِ"
    text: "«معناه عند حلوله ونزوله بساحتي» [@ibn-al-anbari، ص150]. و«الاحتضار والحضور واحد» [@zawzani، ص93]."
  - term: "عَوْجَاءَ"
    text: "«التي قد لحق ظهرها ببطنها فاعوج شخصها»، أي من طول الأسفار، «أي إنها ذات أسفار، وقد اعتادت ذلك» [@ibn-al-anbari، ص150]. وعند الزَّوْزَنِيّ: «التي لا تستقيم في سيرها لفرط نشاطها» [@zawzani، ص93]."
  - term: "مِرْقَالٍ"
    text: "المسرعة [@ibn-al-anbari، ص150]، من الإرقال، «وهو بين السير والعدو» [@zawzani، ص93]."
  - term: "تَرُوحُ وَتَغْتَدِي"
    text: "تسير في الرَّواح، وهو العشيّ، وفي الغُدُوّ، وهو أول النهار؛ «لم يكسرها سير ليلها وعشية أمسها أن تغدو» [@ibn-al-anbari، ص150]."
syntax:
  - "«إِنّي» إنّ واسمها، وجملة «لَأُمْضِي» خبرها، واللام للتوكيد."
  - "«الهمَّ» مفعول به لـ«أُمضي». و«عِنْدَ» ظرف متعلق به."
  - "«والباء صلة أمضى، والعوجاء مخفوضة بالباء»، وهي ممنوعة من الصرف فجُرّت بالفتحة، «والمرقال نعتها، وتروح وتغتدي موضعهما نصب على الحال» [@ibn-al-anbari، ص151]."
morphology:
  - "«أُمْضِي» مضارع «أمضى» الرباعي، «وانضمت الألف من أمضى لأن الماضي على أربعة أحرف» [@ibn-al-anbari، ص151]."
  - "«مِرْقال» على «مِفْعال»، صيغة مبالغة من «أرقل» [@zawzani، ص93]."
  - "«احتضار» مصدر «احتضر» على «افتعال»، و«تغتدي» على «تفتعل» من «غدا». و«عَوْجاء» مؤنث «أعوج» على «فعلاء»، ولذلك مُنعت من الصرف."
rhetoric:
  thesis: "الناقة عنده دواء الهم. وبهذا البيت يبدأ أطول وصف للناقة في المعلقات."
  devices:
    - title: "الهم ضيف ثقيل"
      text: "جعل للهم حضورًا ونزولًا بساحته، وجعله شيئًا يُمضى به ويُذهب كما يُذهب بالمتاع. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "الطباق"
      text: "«تروح وتغتدي»: العشيّ والغداة. «يريد أنها تصل سير الليل بسير النهار، وسير النهار بسير الليل» [@zawzani، ص93]."
    - title: "صدى بيت خاله"
      text: "يُروى لخاله المتلمّس صدر قريب من هذا: «وقد أتناسى الهمّ عند احتضاره»، وهو البيت الذي قال فيه طَرَفَة صبيًّا «استنوق الجمل» [@ibn-qutayba، ج1 ص180–181]. وكان طَرَفَة يروي عن خاله المتلمّس [@deif، ج1 ص143]. فالتقاء الصدرين فيما نرى أثر رواية، لا مصادفة."
  connection: "ثم يصفها: موثّقة الخلق، تمضي على طريق واضح."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِنْنِي / لَأُمْضِلْ هَمْ / مَ عِنْدَحْ / تِضَارِهِي = فعولن / مفاعيلن / فعولن / مفاعلن — بِعَوْجَا / ءَ مِرْقَالِنْ / تَرُوحُ / وَتَغْتَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]."
context: "من هنا يبدأ قسم الناقة (11–40)، وهو أشهر ما في المعلقة. يقول شوقي ضيف: «وفيها أبدع في وصف ناقته، إذ لم يترك فيها صغيرة ولا كبيرة إلا رسمها، وكأنه يريد أن ينحت لها تمثالا» [@deif، ج1 ص430]. ويقول ابن رَشِيق: «وأما نعات الإبل فطَرَفَة في معلقته من أفضلهم» [@ibn-rashiq، ج2 ص296]. والنعّات: الوصّافون."
