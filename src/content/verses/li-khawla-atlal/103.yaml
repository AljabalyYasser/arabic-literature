first: "سَيَأْتِيكَ بِالْأَخْبَارِ مَنْ لَمْ تَبِعْ لَهُ"
second: "بَتَاتًا وَلَمْ تَضْرِبْ لَهُ وَقْتَ مَوْعِدِ"
meaning: "سيأتيك بالأخبار من لم تشترِ له متاع السفر، ولم تحدد له موعدًا يأتيك فيه. قال الزَّوْزَنِيّ: «سينقل إليك الأخبار من لم تشترِ له متاع المسافر، ولم تبين له وقتًا لنقل الأخبار إليك» [@zawzani، ص120]."
vocabulary:
  - term: "تَبِعْ"
    text: "تشترِ. «باع قد يكون بمعنى اشترى، وهو في البيت بهذا المعنى» [@zawzani، ص120]."
  - term: "بَتَاتًا"
    text: "«كساء المسافر وأداته»، والجمع أبتّة [@zawzani، ص120]."
  - term: "تَضْرِبْ"
    text: "تحدد وتبيّن، «كقوله تعالى: ضرب الله مثلا، أي بيّن وأوضح» [@zawzani، ص120]."
syntax:
  - "«من» موصولة فاعل «يأتيك»، و«لم تبع له بتاتًا» صلتها، و«بتاتًا» مفعول به."
  - "«وقتَ» مفعول به لـ«تضرب»، و«موعد» مضاف إليه."
morphology:
  - "«تَبِعْ» مضارع «باع» مجزوم بـ«لم»، حُذفت ياؤه لالتقاء الساكنين."
  - "«مَوْعِد» اسم زمان من «وعد» على «مَفْعِل»."
  - "«باع» من الأضداد: يكون بمعنى باع وبمعنى اشترى [@zawzani، ص120]."
rhetoric:
  thesis: "يفصّل البيت السابق: الرسول الذي لم ترسله لم تجهزه ولم تواعده، ومع ذلك يأتيك بالخبر."
  devices:
    - title: "التفصيل بعد الإجمال"
      text: "قال في البيت السابق «من لم تزود»، ثم فصّل هنا: لم تشترِ له متاعًا، ولم تضرب له موعدًا. فأكمل صورة الرسول المجهز ليبيّن أن الخبر يأتي بلا رسول."
    - title: "التكرار"
      text: "كرر «يأتيك بالأخبار» من البيت السابق، فصار البيتان نغمة واحدة تُختم بها القصيدة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "سَيَأْتِي / كَ بِلْأَخْبَا / رِ مَنْ لَمْ / تَبِعْ لَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — بَتَاتَنْ / وَلَمْ تَضْرِبْ / لَهُو وَقْ / تَ مَوْعِدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "آخر بيت في رواية ابن الأَنْبارِيّ، وبعده يقول: «تمت قصيدة طَرَفَة بغريبها وأخبارها، وهي مائة بيت وبيتان» [@ibn-al-anbari، ص231]. لكن ابن قُتَيْبة يورد هذا البيت بعد بيت طَرَفَة ويقول: «وقال غيره» [@ibn-qutayba، ج1 ص189]، فكأنه لا يراه منها؛ وينبّه محقق كتابه على أنه في المعلقة في جمهرة أشعار العرب وشرح التِّبْرِيزِيّ وشرح الزَّوْزَنِيّ [@ibn-qutayba، ج1 ص189، الحاشية]."
variants:
