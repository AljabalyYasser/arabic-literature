  - reading: "وَيَأْتِيكَ بِالْأَنْبَاءِ مَنْ لَمْ تَبِعْ لَهُ"
    status: "رواية ابن قُتَيْبة"
    note: "ونسبه إلى غير طَرَفَة [@ibn-qutayba، ج1 ص189]."
