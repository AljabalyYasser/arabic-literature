first: "وَكَرِّي إِذَا نَادَى الْمُضَافُ مُحَنَّبًا"
second: "كَسِيدِ الْغَضَا نَبَّهْتَهُ الْمُتَوَرِّدِ"
meaning: "والثانية أن أعطف فرسي إذا استغاث بي الخائف المذعور، فرسًا منحني القوائم يعدو كذئب الغضا إذا هيّجته وهو يطلب الماء. قال الزَّوْزَنِيّ: «جعل الخصلة الثانية إغاثته المستغيث وإعانته اللاجئ إليه» [@zawzani، ص108]."
vocabulary:
  - term: "كَرِّي"
    text: "«عطفي. يقال: كر يكر كرورا وكرا، إذا عطف ورجع» [@ibn-al-anbari، ص194]. وقال أبو جعفر: «الكر أشد القتال، لأنه إنما يكر ليحمي من انهزم» [@ibn-al-anbari، ص195]."
  - term: "الْمُضَافُ"
    text: "«الملجأ الملحق المدرك» (يعقوب والطُّوسِيّ)، وقال أبو عُبَيْدة: «الذي قد أضافته الهموم» [@ibn-al-anbari، ص195]. وعند الزَّوْزَنِيّ: «الخائف والمذعور» [@zawzani، ص108]."
  - term: "مُحَنَّبًا"
    text: "فرسًا في ذراعه انحناء يُمدح به [@ibn-al-anbari، ص195]. «المحنب: الذي في يده انحناء، والمجنّب الذي في رجله انحناء» [@zawzani، ص108]."
  - term: "سِيدِ الْغَضَا"
    text: "«السيد: الذئب. وذئب الغضا أخبث الذئاب، لأنه خمر يستخفي» [@ibn-al-anbari، ص195]. والغضا شجر."
  - term: "الْمُتَوَرِّدِ"
    text: "«الذي يطلب الورد» [@ibn-al-anbari، ص196]، أي الماء."
syntax:
  - "«وموضع الكر رفع لأنه نسق على السبق» [@ibn-al-anbari، ص196]، أي معطوف على «سبقُ العاذلات» في البيت السابق، فهو الخلة الثانية."
  - "«ومحنبا منصوب على الحال من المضاف»، هكذا عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص196]؛ وعند الزَّوْزَنِيّ مفعول به للمصدر «كرّي»: أعطف فرسًا محنّبًا [@zawzani، ص108]."
  - "«والكاف في موضع نصب على النعت لمحنب. والمتورد نعت للسيد» [@ibn-al-anbari، ص196]. وجملة «نبّهته» صفة أو حال."
morphology:
  - "«المُضاف» اسم مفعول من «أضاف» بمعنى ألجأ؛ و«المَضوفة» الأمر الذي يُشفَق منه، وأصلها «مَضْيَفة» [@ibn-al-anbari، ص195]."
  - "«مُحَنَّب» اسم مفعول من «حنّب» على «فعّل»، من الانحناء."
  - "«المتورّد» اسم فاعل من «تورّد» على «تفعّل»: طلب الورود."
rhetoric:
  thesis: "الخلة الثانية الشجاعة في نجدة المستغيث، وصورتها فرس يعدو كذئب اجتمعت له ثلاثة أسباب للسرعة."
  devices:
    - title: "التشبيه"
      text: "شبّه فرسه بذئب «اجتمع له ثلاث خلال: إحداها كونه فيما بين الغضا، وذئب الغضا أخبث الذئاب، والثانية إثارة الإنسان إياه، والثالثة وروده الماء، وهما يزيدان في شدة العدو» [@zawzani، ص108]."
    - title: "قيود ترفع القيمة"
      text: "لم يقل «كالذئب» فقط، بل ذئب الغضا، المُنبَّه، الطالب للماء. وكل قيد يزيد السرعة درجة."
  connection: "ثم الخلة الثالثة: يوم الغيم مع امرأة جميلة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَكَرْرِي / إِذَا نَادَلْ / مُضَافُ / مُحَنْنَبَنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — كَسِيدِلْ / غَضَا نَبْبَهْ / تَهُلْ مُ / تَوَرْرِدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "من الأبيات الأربعة (56–59) التي يعدّ فيها «ثلاث خلال» تجعل الحياة عنده جديرة بأن تُعاش. وقد عدّها ابن رَشِيق من «الاختراع»، وهو عنده «ما لم يسبق إليه قائله، ولا عمل أحد من الشعراء قبله نظيره أو ما يقرب منه» [@ibn-rashiq، ج1 ص262]. ويرى شوقي ضيف أنه «يجعل من خلال الفتى هذه الخصال الثلاث، وهي الخمر والفروسية أو الشجاعة في الحرب والتمتع بالنساء» [@deif، ج1 ص71]."
variants:
  - reading: "كَسِيدِ الْغَضَا فِي الطَّخْيَةِ الْمُتَوَرِّدِ"
    status: "رواية الطُّوسِيّ"
    note: "«والطخية: السحابة عليها طخاء» [@ibn-al-anbari، ص196]؛ ورواها ابن رَشِيق «كسيد الغضا ذي الطخية المتورد» [@ibn-rashiq، ج1 ص262]."
