first: "فَلَوْ شَاءَ رَبِّي كُنْتُ قَيْسَ بْنَ خَالِدٍ"
second: "وَلَوْ شَاءَ رَبِّي كُنْتُ عَمْرَو بْنَ مَرْثَدِ"
meaning: "لو شاء الله لكنت مثل قيس بن خالد، ولو شاء لكنت مثل عمرو بن مرثد، في المال والولد. قال الزَّوْزَنِيّ: «هذان سيدان من سادات العرب مذكوران بوفور المال ونجابة الأولاد، وشرف النسب وعظم الحسب. يقول: لو شاء الله بلَّغني منزلتهما وقدرهما» [@zawzani، ص114]."
vocabulary:
  - term: "قَيْسَ بْنَ خَالِدٍ"
    text: "«قيس بن خالد بن عبد الله ذي الجدين من بني شيبان» [@ibn-al-anbari، ص210]."
  - term: "عَمْرَو بْنَ مَرْثَدِ"
    text: "«ابن عم طرفة» [@ibn-al-anbari، ص210]."
  - term: "يَنُوءُ بِجَدِّهِ"
    text: "في رواية أبي عُبَيْدة: «أرى كل ذي جد ينوء بجده»، أي «أرى كل ذي حظ ينهض بحظه. يقال نؤت بالحمل أنوء به، إذا نهضت به» [@ibn-al-anbari، ص210]."
syntax:
  - "«وكنت جواب لو، وقيس بن خالد خبر الكون، وما بعد الواو نسق على ما قبلها» [@ibn-al-anbari، ص210]. و«الكون» عنده «كان»، و«النَّسَق» اسم العطف عند الكوفيين."
  - "«لو» حرف امتناع لامتناع: امتنع أن يكون مثلهما لأن الله لم يشأ. ومفعول «شاء» محذوف، تقديره: لو شاء ربي أن أكون قيس بن خالد."
  - "«ابنَ» صفة لـ«قيس» منصوبة، وتُحذف ألفه في الخط لأنه وقع بين علمين ثانيهما أبو الأول."
morphology:
  - "«شاء» ماضٍ أجوف يائي: شاء يشاء مشيئة."
  - "«ينوء» في رواية أبي عُبَيْدة مضارع «ناء» الأجوف الواوي: «نؤت بالحمل أنوء به» [@ibn-al-anbari، ص210]."
  - "«كنتُ» ماضٍ ناقص، والتاء اسمه، و«قيس» خبره."
rhetoric:
  thesis: "أمنية في شطرين متوازيين. لا يحسد السيدين، بل يرد الفرق بينه وبينهما إلى مشيئة الله."
  devices:
    - title: "حذف مفعول المشيئة"
      text: "لم يقل: لو شاء ربي أن أكون قيسًا. والحذف عند عبد القاهر الجُرْجانيّ باب «دقيق المسلك، لطيف المأخذ، عجيب الأمر، شبيه بالسحر، فإنك ترى به ترك الذكر، أفصح من الذكر» [@dalail، ص146]. ويقول عبد القاهر إن «مجيء المشيئة بعد لو وبعد حروف الجزاء هكذا موقوفة غير معداة إلى شيء، كثير شائع»، وإن «البلاغة في أن يجاء به كذلك محذوفا» [@dalail، ص164]. ومن أمثلته: «لو شئت كنت كزيد» [@dalail، ص165]، وهو بناء بيت طَرَفَة نفسه. ومعنى «موقوفة غير معداة»: بلا مفعول. فجواب «لو» يكشف المحذوف، فلا حاجة إلى ذكره."
    - title: "التكرار والتوازي"
      text: "كرر «ولو شاء ربي كنت» في الشطرين، ولم يغيّر إلا الاسم. فصار السيدان كفّتين متعادلتين."
    - title: "التعريض"
      text: "التعريض أن تقول كلامًا وتلمّح به إلى معنى لم تصرّح به. ذكر سيدين غنيين من قومه بعد أن شكا بخل ابن عمه مالك. وقد فهم عمرو بن مرثد البيت كذلك، فبعث إلى طَرَفَة وأعطاه، كما يروي أبو عُبَيْدة [@ibn-al-anbari، ص210]."
  connection: "ثم يتم الأمنية: لكنت ذا مال كثير، ولزارني بنون سادة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَلَوْ شَا / ءَ رَبْبِي كُنْ / تُ قَيْسَبْ / نَ خَالِدِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَلَوْ شَا / ءَ رَبْبِي كُنْ / تُ عَمْرَبْ / نَ مَرْثَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "للبيت قصة يرويها أبو عُبَيْدة: لما سمع عمرو بن مرثد قول طَرَفَة قال: «ابعثوا إلى طرفة». فلما أتاه قال له: «أما الولد فليس ذاك إلي فالله تعالى يعطيكم، وأما المال فمحلوفه لا تبرح حتى تكون أوسطنا مالاً!». ثم أمر بنيه السبعة فأعطاه كل واحد منهم عشرًا من الإبل، ثم أمر ثلاثة من حفدته فأعطوه عشرًا عشرًا [@ibn-al-anbari، ص210]، فتمت له مائة بعير. ومحلوفه: قسم، أي أُقسم؛ وأوسطنا مالًا: مثل أوسطنا غنى. وبهذا يلتقي البيت بخبر إبل مَعْبَد: كان أخوه قد قال له: «كأنك ترى إنها أن أخذت يردها شعرك هذا!» [@ibn-al-anbari، ص204]؛ ويقول محقق الديوان إنه بهذا العطاء «ردّ إبل أخيه وقد ردّها بشعره كما قال» [@diwan-tarafa، ص5]."
variants:
