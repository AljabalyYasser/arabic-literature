first: "أَخِي ثِقَةٍ لَا يَنْثَنِي عَنْ ضَرِيبَةٍ"
second: "إِذَا قِيلَ مَهْلًا قَالَ حَاجِزُهُ قَدِ"
meaning: "سيف يوثق به كما يوثق بالأخ، لا يرتد عمّا يُضرب به. إذا قيل لصاحبه: كُفّ، قال حاجزه: حسبي، قد فرغ. قال الزَّوْزَنِيّ: «يريد أنه ماضٍ لا ينبو عن الضرائب، فإذا ضرب به صاحبه أغنته الضربة الأولى عن غيرها» [@zawzani، ص115]. ولا ينبو: لا يرتد عن الضريبة دون أن يقطعها."
vocabulary:
  - term: "أَخِي ثِقَةٍ"
    text: "«يوثق به، أي صاحب ثقة» [@zawzani، ص115]."
  - term: "لَا يَنْثَنِي"
    text: "«معناه إذا ضرب به لم يرجع» [@ibn-al-anbari، ص214]."
  - term: "ضَرِيبَةٍ"
    text: "«المضروبة» [@ibn-al-anbari، ص214]، أي ما يُضرب بالسيف."
  - term: "مَهْلًا"
    text: "«أي كفّ» [@zawzani، ص115]."
  - term: "حَاجِزُهُ"
    text: "فيه قولان: «الذي يحجزه»، أي صاحبه الذي يكفّه؛ وقال الطُّوسِيّ: «حاجزه الهاء للسيف، و(حاجزه) هاهنا: حده» [@ibn-al-anbari، ص215]."
  - term: "قَدِ"
    text: "«معناه حسب، أي قد فرغ» [@ibn-al-anbari، ص215]."
syntax:
  - "«وأخي ثقة نعت لما تقدم قبله. ويجوز في النحو: أخا ثقة... على المدح أيضا. والرواة مجمعة على الخفض» [@ibn-al-anbari، ص215]. والنصب على المدح: بفعل محذوف تقديره «أمدح»."
  - "«ومهلا منصوب على تقدير المصدر، وهو مما يكون للواحد والاثنين والجمع والمؤنث بلفظ واحد» [@ibn-al-anbari، ص215]؛ أي مفعول مطلق لفعل محذوف: أمهِل مهلًا."
  - "«قدِ» اسم بمعنى «حسب»، وهو مقول القول. «ويقال: قدي درهم، وقدني درهم» [@ibn-al-anbari، ص215]."
morphology:
  - "«ضريبة» على «فعيلة» بمعنى «مفعولة»، وجمعها «الضرائب» [@zawzani، ص115]."
  - "«قدي» و«قدني» بمعنى «حسبي» [@zawzani، ص115]. وقال سِيبَوَيْه إن الكلام لا بد فيه من النون، «وقد اضطر الشاعر فقال قدِي، شبهه بحسبي؛ لأن المعنى واحد» [@sibawayh، ج2 ص371]."
  - "«ينثني» على «ينفعل» من «ثنى»: «الثني: الصرف... والانثناء: الانصراف» [@zawzani، ص115]."
rhetoric:
  thesis: "السيف أخ يوثق به، وله في المعركة كلمة واحدة: «قد»."
  devices:
    - title: "الاستعارة"
      text: "والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. أراد: سيف يوثق به كما يوثق بالأخ، ثم أعاره اسم الأخ. وعبارة الزَّوْزَنِيّ تكشف التشبيه: «كالأخ الذي يوثق بإخائه» [@zawzani، ص115]."
    - title: "حوار في نصف بيت"
      text: "«إذا قيل مهلًا قال حاجزه قد»: قائل لا يُسمّى يقول «مهلًا»، ويجيبه الحاجز بكلمة واحدة. فعلى قول الزَّوْزَنِيّ المجيب صاحب السيف: «حسبي فإني قد بلغت ما أردت من قتل عدوي» [@zawzani، ص115]. وعلى قول الطُّوسِيّ «حاجزه» حدّ السيف [@ibn-al-anbari، ص215]، فالسيف نفسه يجيب: فرغت. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]. فقد جعل لحدّ السيف قولًا."
    - title: "الإيجاز"
      text: "«قد» حرفان يغنيان عن جملة: حسبي، قد فرغت. وقِصر الجواب من جنس الضربة الواحدة التي لا تحتاج إلى ثانية."
  connection: "ثم يقول: إذا تسابق القوم إلى السلاح وجدتني منيعًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَخِي ثِ / قَتِنْ لَا يَنْ / ثَنِي عَنْ / ضَرِيبَتِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — إِذَا قِي / لَ مَهْلَنْ قَا / لَ حَاجِ / زُهُو قَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "البيت الثالث في السيف، وبه تتم الجملة الممتدة من البيت 83: «لأبيضَ... حسامٍ... أخي ثقةٍ». والرواة كلهم يروونه بالخفض [@ibn-al-anbari، ص215]."
variants:
  - reading: "إِذَا قِيلَ مَهْلًا قَالَ حَاجِزُهُ قَدِي"
    status: "رواية الزَّوْزَنِيّ"
    note: "بياء المتكلم [@zawzani، ص115]، والنطق في القافية واحد."
