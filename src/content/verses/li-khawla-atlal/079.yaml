first: "فَذَرْنِي وَخُلْقِي إِنَّنِي لَكَ شَاكِرٌ"
second: "وَلَوْ حَلَّ بَيْتِي نَائِيًا عِنْدَ ضَرْغَدِ"
meaning: "دعني وما طُبعت عليه، فإني شاكر لك، ولو صار بيتي بعيدًا عند ضَرْغَد. قال الزَّوْزَنِيّ: «خلّ بيني وبين خلقي وكلني إلى سجيتي، فإني شاكر لك وإن بعدت غاية البعد حتى ينزل بيتي عند هذا الجبل الذي سمي بضرغد» [@zawzani، ص114]. والسجية: الطبع."
vocabulary:
  - term: "ذَرْنِي"
    text: "دعني. «ذروه: دعوه» [@zawzani، ص117]."
  - term: "خُلْقِي"
    text: "طبعي وسجيتي [@zawzani، ص114]. ويروى «وعِرضي» [@ibn-al-anbari، ص209]."
  - term: "نَائِيًا"
    text: "بعيدًا. «ويقال: قد نأى فلان عنا وناء، إذا بعد؛ والنأي: البعد» [@ibn-al-anbari، ص209]."
  - term: "ضَرْغَدِ"
    text: "موضع. هو عند ابن الأَنْبارِيّ «حرة بأرض غطفان» [@ibn-al-anbari، ص209]، وعند الزَّوْزَنِيّ «جبل» [@zawzani، ص114]. والحَرّة: أرض حجارتها سود."
syntax:
  - "«ذَرْ» فعل أمر، والنون للوقاية، والياء مفعول به. و«خُلْقي» منصوب: مفعول معه، والواو بمعنى «مع»، أي دعني مع خلقي؛ ويجوز أن يكون معطوفًا على ياء المتكلم."
  - "«إنّني لك شاكر» جملة مستأنفة تعلّل ما قبلها، و«لك» متعلق بـ«شاكر»."
  - "«ولو حلّ...»: «لو» هنا بمعنى «حتى لو»، وجوابها محذوف يدل عليه ما قبله: ولو حلّ بيتي عند ضرغد فإني شاكر لك. و«نائيًا» حال من «بيتي»."
morphology:
  - "«ذَرْ» أمر لا ماضي له في الاستعمال: «يقال ذره ولا تذره وإنما أذره. ولا يقال وذرته» [@ibn-al-anbari، ص221]، ويُستغنى عن ماضيه بـ«ترك» [@zawzani، ص117]."
  - "«نائي» اسم فاعل من «نأى»، ويقال فيه أيضًا «ناء» بتقديم الألف [@ibn-al-anbari، ص209]."
  - "«الخُلْق» بضم الخاء: الطبع والسجية؛ و«الخَلْق» بفتحها: الصورة والهيئة."
rhetoric:
  thesis: "قرب نهاية العتاب لا يطلب من ابن عمه شيئًا، إلا أن يتركه وطبعه."
  devices:
    - title: "الأمر بالترك"
      text: "«فذرني» أمر لا يطلب فعلًا، بل يطلب الكفّ: كُفّ عن لومي. فالشاعر الذي شكا عشرة أبيات يختم بطلب واحد صغير."
    - title: "الشكر في موضع العتاب"
      text: "يأخذ الزَّوْزَنِيّ الشكر على ظاهره [@zawzani، ص114]. ونرى فيه مرارة المودِّع: شكر رجل يعرف أن الطريق قد يبعده إلى أقصى الأرض."
    - title: "المكان مقياسًا للبعد"
      text: "اختار ضرغد لأنه في أقصى ما يُتصوّر من البعد عن قومه. قال الزَّوْزَنِيّ: «وبينهم وبين ضرغد مسافة بعيدة وشقة شاقة وبينونة بليغة» [@zawzani، ص114]. والشُّقّة: المسافة الشاقة، والبينونة: الفراق."
  connection: "ثم يتمنى لو كان له مال سيدين من قومه وولدهما: قيس بن خالد وعمرو بن مرثد."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَذَرْنِي / وَخُلْقِي إِنْ / نَنِي لَ / كَ شَاكِرُنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — وَلَوْ حَلْ / لَ بَيْتِي نَا / ئِيَنْ عِنْ / دَ ضَرْغَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]."
context: "من أواخر قسم العتاب (68–81). بعد أن شكا ظلم ابن عمه مالك، وقال إن ظلم الأقارب أشد من وقع السيف، يطلب أن يُترك وشأنه. وبعده بيتان يتمنى فيهما مال السيدين وولدهما، ثم يبدأ الفخر."
