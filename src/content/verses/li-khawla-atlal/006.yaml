first: "وَفِي الْحَيِّ أَحْوَى يَنْفُضُ الْمَرْدَ شَادِنٌ"
second: "مُظَاهِرُ سِمْطَيْ لُؤْلُؤٍ وَزَبَرْجَدِ"
meaning: "وفي الحي حبيبة كأنها ظبي صغير أحوى يتناول ثمر الأراك، وقد لبست عقدين، أحدهما فوق الآخر: عقد لؤلؤ وعقد زبرجد. قال الزَّوْزَنِيّ: «شبهه بالظبي في ثلاثة أشياء: في كحل العينين، وحوة الشفتين، وحسن الجيد، ثم أخبر أنه متحلٍّ بعقدين من لؤلؤ وزبرجد» [@zawzani، ص91]."
vocabulary:
  - term: "أَحْوَى"
    text: "ظبي في مدمع عينه خطّتان من سواد [@ibn-al-anbari، ص139]. وقيل: الذي في شفتيه سمرة، والحُوّة عند الأَصْمَعِيّ «حمرة تضرب إلى السواد» [@zawzani، ص91]."
  - term: "يَنْفُضُ الْمَرْدَ"
    text: "«يعطو ليتناول ثمر الأراك فيسقط عليه النفض... والمرد: ثمر الأراك» [@ibn-al-anbari، ص139]. ويعطو: يرفع رأسه ويمد عنقه."
  - term: "شَادِنٌ"
    text: "«الذي قد تحرك وكاد يستغني عن أمه من الظباء» [@ibn-al-anbari، ص140]."
  - term: "مُظَاهِرُ"
    text: "لابس أحدهما فوق الآخر: «ويقال: ظاهر بين ثوبين وطابق، إذا لبس واحدا فوق واحد» [@ibn-al-anbari، ص140]."
  - term: "سِمْطَيْ"
    text: "مثنى سِمْط، و«السمط: الخيط من اللؤلؤ، وجمعه سموط» [@ibn-al-anbari، ص140]."
syntax:
  - "«فِي الْحَيِّ» خبر مقدم، و«أَحْوَى» مبتدأ مؤخر مرفوع بضمة مقدرة؛ وبعبارة ابن الأَنْبارِيّ: «والأحوى موضعه رفع بفي» [@ibn-al-anbari، ص140]."
  - "جملة «يَنْفُضُ الْمَرْدَ» صفة لـ«أحوى»، و«شَادِنٌ» و«مُظَاهِرُ» صفتان أخريان؛ ويجوز في العربية نصب «مظاهرَ» على الحال [@ibn-al-anbari، ص140]. وعند الزَّوْزَنِيّ «شادن» صفة لـ«أحوى» أو بدل منه [@zawzani، ص91]."
  - "«سِمْطَيْ» مضاف إليه مجرور بالياء لأنه مثنى، وحُذفت نونه للإضافة؛ و«زَبَرْجَدِ» معطوف على «لؤلؤ» [@ibn-al-anbari، ص140]."
morphology:
  - "«أَحْوَى» على «أفعل»، ومؤنثه «حوّاء»، وجمعه «حُوّ» [@zawzani، ص91]."
  - "«شادِن» اسم فاعل من «شدَن يشدُن شُدونًا» إذا قوي وتحرك، والأم «مُشْدِن» [@ibn-al-anbari، ص140]."
  - "«مُظاهِر» اسم فاعل من «ظاهَرَ»، وأصله من الظَّهْر: جعل عقدًا على ظهر عقد."
rhetoric:
  thesis: "يبدأ البيت بظبي في الأراك، ثم ينكشف في آخره أنه يصف امرأة: فالظبي لا يلبس عقدين."
  devices:
    - title: "الكناية"
      text: "قال ابن الأَنْبارِيّ: «والأحوى كناية عنها» [@ibn-al-anbari، ص139]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. ويقول ابن رَشِيق إن أهل البادية إذا تغزلوا لم يذكروا إلا النساء، «فإذا وقع مثل قول طَرَفَة: وفي الحي أحوى... فإنما هو كناية بالغزل عن المرأة» [@ibn-rashiq، ج1 ص225]."
    - title: "اللفظ للظبي والمعنى للمرأة"
      text: "بدأ بصفات الظبي، ثم جاء بما لا يكون إلا لامرأة: العقدين. قال ابن الأَنْبارِيّ: «فاللفظ على الظبي والمعنى للمرأة» [@ibn-al-anbari، ص140]."
    - title: "علامة الخصب"
      text: "الظبي يرعى ثمر الأراك، «وإنما أراد أنه في خصب» [@ibn-al-anbari، ص140]؛ فالحبيبة في نعمة ورخاء."
  connection: "ثم يمضي في صفتها ظبيةً ترعى مع القطيع، ثم يصف ثغرها ووجهها (7–10)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَفِلْ حَيْ / يِ أَحْوَى يَنْ / فُضُلْ مَرْ / دَ شَادِنُنْ = فعولن / مفاعيلن / فعولن / مفاعلن — مُظَاهِ / رُ سِمْطَيْ لُؤْ / لُئِنْ وَ / زَبَرْجَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "ينتقل من الظعائن الراحلة إلى صاحبته وهي في الحي. ويصفها في خمسة أبيات (6–10): ظبيًا، ثم ثغرًا كالأقحوان، ثم وجهًا كأن الشمس ألقت عليه رداءها. وهذا أقصر أقسام المعلقة."
