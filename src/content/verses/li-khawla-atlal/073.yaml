first: "وَإِنْ أُدْعَ فِي الْجُلَّى أَكُنْ مِنْ حُمَاتِهَا"
second: "وَإِنْ يَأْتِكَ الْأَعْدَاءُ بِالْجَهْدِ أَجْهَدِ"
meaning: "إن دُعيت في الأمر العظيم كنت من الذين يحمونه ويقومون به، وإن جاءك الأعداء بجهدهم بذلت جهدي في دفعهم. قال الزَّوْزَنِيّ: «وإن دعوتني للأمر العظيم والخطب الجسيم أكن من الذين يحمون حريمك، وإن يأتك الأعداء لقتالك أجهد في دفعهم عنك غاية الجهد» [@zawzani، ص112]."
vocabulary:
  - term: "أُدْعَ"
    text: "أُنادَ للنجدة: «وإن دعوتني للأمر العظيم» [@zawzani، ص112]."
  - term: "الْجُلَّى"
    text: "«الأمر الجليل العظيم». وقال يعقوب: «الجلى فعلى من الأجل، كما تقول: الأعظم والعظمى» [@ibn-al-anbari، ص205]."
  - term: "حُمَاتِهَا"
    text: "«الذين يقومون بها» [@ibn-al-anbari، ص206]. و«الحماة: جمع الحامي من الحماية» [@zawzani، ص112]."
  - term: "الْجَهْدِ"
    text: "الطاقة والمشقة. وفي شرح الزَّوْزَنِيّ: «أجهد في دفعهم عنك غاية الجهد» [@zawzani، ص112]."
syntax:
  - "«وأدع مجزوم بإنْ، وأكن جواب الجزاء» [@ibn-al-anbari، ص206]. و«من حماتها» خبر «أكن»."
  - "والعجز مثله: «يأتك» فعل الشرط مجزوم بحذف الياء، و«الأعداء» فاعله، و«أجهد» جوابه."
  - "«بالجهد»: قال الزَّوْزَنِيّ: «والباء في قوله بالجهد زائدة» [@zawzani، ص112]. ويجوز فيما نرى أن تكون للمصاحبة: يأتونك ومعهم جهدهم."
morphology:
  - "«أُدْعَ» مضارع مبني للمجهول من «دعا»، أصله «أُدْعَى»، حُذفت ألفه للجزم."
  - "«الجُلّى» على «فُعلى» مؤنث «الأجلّ» [@ibn-al-anbari، ص205]، «وإذا فتحت جيمها مدت فقيل الجَلاء» [@ibn-al-anbari، ص206]."
  - "«حُماة» جمع «حامٍ» على «فُعَلة»، مثل «قاضٍ» و«قُضاة»، وأصله «حُمَيَة» قُلبت ياؤه ألفًا."
rhetoric:
  thesis: "شرطان متوازيان، وجوابان حاضران: إذا دُعي كان حاميًا، وإذا هوجم ابن عمه كان مجاهدًا."
  devices:
    - title: "الالتفات"
      text: "الالتفات أن ينتقل الكلام من الغيبة إلى الخطاب أو العكس. تحدث عن ابن عمه بضمير الغائب («يلوم»، «أيأسني»)، ثم بدأ يخاطبه بالقسم «وجدك» (72)، وهنا يصرّح: «وإن يأتك الأعداء». فالشكوى صارت مواجهة."
    - title: "المقابلة بين الشطرين"
      text: "شرط في الصدر وشرط في العجز على نسق واحد. الأول عن نفسه («أُدع»)، والثاني عن ابن عمه («يأتك»). فالشاعر حاضر في الحالين: إذا دُعي، وإذا لم يُدعَ."
    - title: "الجناس"
      text: "«بالجهد أجهد»: لفظان من أصل واحد في آخر البيت، فجهد الأعداء يقابله جهد الشاعر. والجناس أن يتفق اللفظان في الحروف ويختلفا في المعنى."
  connection: "ثم يزيد: من شتم عرض ابن عمه سقاه الموت."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِنْ أُدْ / عَ فِلْ جُلْلَى / أَكُنْ مِنْ / حُمَاتِهَا = فعولن / مفاعيلن / فعولن / مفاعلن — وَإِنْ يَأْ / تِكَلْ أَعْدَا / ءُ بِلْجَهْ / دِ أَجْهَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "الثاني من أبيات النصرة (72–74). لفظه لفظ الفخر، وغرضه العتاب: هذا ما أبذله لك، وهذا ما ألقاه منك. وسبب العتاب قصة إبل مَعْبَد، أخي طَرَفَة، يذكرها في البيت 71 [@ibn-al-anbari، ص204]."
variants:
