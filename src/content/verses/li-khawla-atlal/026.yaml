first: "كَأَنَّ عُلُوبَ النِّسْعِ فِي دَأَيَاتِهَا"
second: "مَوَارِدُ مِنْ خَلْقَاءَ فِي ظَهْرِ قَرْدَدِ"
meaning: "كأن آثار السيور في ضلوع صدرها آثار طرق الواردين على صخرة ملساء في أعلى أرض صلبة. قال ابن الأَنْبارِيّ: «فيقول: العلوب في صدرها مثل آثار الموارد في الصخرة» [@ibn-al-anbari، ص170]."
vocabulary:
  - term: "عُلُوبَ"
    text: "«الآثار، واحدها علب. وكل اثر من ضرب أو حبل أو خدش فهو علب» [@ibn-al-anbari، ص169]."
  - term: "النِّسْعِ"
    text: "«وعنى بالنسع التصدير والحقب وغيرهما. يقال نسعة ونسع، وهي كل سيور مضفورة» [@ibn-al-anbari، ص170]. والتصدير والحَقَب: حبلان يُشدّ بهما الرحل على الصدر والبطن."
  - term: "دَأَيَاتِهَا"
    text: "«ضلوع صدرها» [@ibn-al-anbari، ص170]. وقد فسّر الدأي في البيت 19 بفقار العنق [@ibn-al-anbari، ص162]."
  - term: "مَوَارِدُ"
    text: "«الشرك، وهي طرق الوراد» [@ibn-al-anbari، ص170]، والشُّرُك: الطرق الصغيرة. وعند الزَّوْزَنِيّ: «جمع المورد وهو الماء الذي يورد» [@zawzani، ص99]."
  - term: "خَلْقَاءَ"
    text: "«الملساء، يعنى صخرة. وكل ما أملس فهو أخلق» [@ibn-al-anbari، ص170]."
  - term: "قَرْدَدِ"
    text: "«ارض صلبة مستوية. وظهر القردد: أعلاه» [@ibn-al-anbari، ص170]. وعند الزَّوْزَنِيّ: «الأرض الغليظة الصلبة التي فيها وهاد ونجاد» [@zawzani، ص99]، أي منخفضات ومرتفعات."
syntax:
  - "«والعلوب اسم كأن، والموارد خبر كأن» [@ibn-al-anbari، ص171]. و«في دأياتها» متعلق بمحذوف حال من «العلوب»."
  - "«من خلقاء» صفة لموصوف محذوف: «وأراد من خلقاء، أي من صخرة خلقاء، فحذف الموصوف» [@zawzani، ص99]. و«خلقاء» ممنوعة من الصرف لأنها على «فعلاء»، فجُرّت بالفتحة."
  - "«في ظهر قردد» متعلق بمحذوف صفة لـ«خلقاء»: صخرة كائنة في أعلى أرض صلبة."
morphology:
  - "«عُلُوب» جمع «عَلْب»، «وقد علبت الشيء علبًا إذا أثَّرْت فيه» [@zawzani، ص99]."
  - "«النِّسْع»: «سير كهيئة العنان تشد به الأحمال، وكذلك النسعة، والجمع الأنساع والنسوع» [@zawzani، ص99]."
  - "«خلقاء» مؤنث «أخلق»: «والأخلق الأملس» [@zawzani، ص99]. ويقال: «صخرة مخلقة، أي مملسة» [@ibn-al-anbari، ص170]."
rhetoric:
  thesis: "على جلد التمثال آثار السفر: السيور حفرت في الصدر خطوطًا كما تحفر الأقدام طرقًا في الصخر."
  devices:
    - title: "في التمثال: الجلد وآثاره"
      text: "يضيف إلى التمثال جلده، ولا يصفه أملس نظيفًا، بل عليه آثار الأنساع. فالناقة مسافرة قديمة، وجلدها يحمل تاريخها. وهذه الآثار عند أحمد بن عبيد خفيفة، أثرها «ليس بالمبالغ؛ لصلابة جلدها» [@ibn-al-anbari، ص170]. فالأثر نفسه مدح للجلد."
    - title: "التشبيه بين البعيدين"
      text: "يقول ابن رَشِيق: «وإنما حسن التشبيه أن يقرب بين البعيدين حتى تصير بينهما مناسبة واشتراك» [@ibn-rashiq، ج1 ص289]. وقد قرّب هنا بين سيور على صدر ناقة وطرق على صخرة. والمشترك خطوط بيض على سطح صلب، يصنعها التكرار: مرور السير كمرور الواردين."
    - title: "ثلاث قراءات للمشبه به"
      text: "عند ابن الأَنْبارِيّ الموارد طرق الواردين في الصخرة. وعند أحمد بن عبيد آثار الحبال على حجر البئر: «وذلك أن حبل البئر يمر على الحجر فيؤثر فيه» [@ibn-al-anbari، ص170]. وعند الزَّوْزَنِيّ نُقَر فيها ماء: «شبه آثار النسع أو الأنساع بالنقر التي فيها الماء في بياضها» [@zawzani، ص99]. والقراءات الثلاث تتفق على صلابة السطح وبياض الأثر."
  connection: "ثم يصف هذه الآثار تلتقي وتتفرق كبنائق قميص أبيض."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَأَنْنَ / عُلُوبَنْ نِسْ / عِ فِي دَ / أَيَاتِهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — مَوَارِ / دُ مِنْ خَلْقَا / ءَ فِي ظَهْ / رِ قَرْدَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "أول بيتين في آثار الأنساع (26–27). وهي صورة من حياة الرحلة: لا يصف ناقة في مرعاها، بل ناقة حملت الرحل طويلًا. وجعل الزَّوْزَنِيّ للتشبيه غاية أوسع: «وجعل جنبها صلبًا كالصخرة الملساء، وجعل خلقها في الشدة والصلابة كالأرض الغليظة» [@zawzani، ص99]."
