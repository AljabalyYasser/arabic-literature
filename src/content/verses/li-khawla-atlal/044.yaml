first: "وَلَسْتُ بِحَلَّالِ التِّلَاعِ مَخَافَةً"
second: "وَلَكِنْ مَتَى يَسْتَرْفِدِ الْقَوْمُ أَرْفِدِ"
meaning: "لا أنزل في مسايل الماء المنخفضة لأختفي بها خوفًا من الضيف أو من العدو، بل أنزل حيث يراني الناس، ومتى طلب القوم عوني أعنتهم. قال الزَّوْزَنِيّ: «أنا لا أحل التلاع مخافة حلول الأضياف بي أو غزو الأعداء إياي، ولكني أعين القوم إذا استعانوا بي إما في قِرى الأضياف، وإما في قتال الأعداء والحساد» [@zawzani، ص104]."
vocabulary:
  - term: "حَلَّالِ"
    text: "كثير الحلول والنزول، «مبالغة الحال من الحلول» [@zawzani، ص104]."
  - term: "التِّلَاعِ"
    text: "جمع تَلْعة، وهي «مجاري الماء ينصب في الوادي تستر من نزل فيها» [@ibn-al-anbari، ص186]."
  - term: "يَسْتَرْفِدِ"
    text: "يطلب الرِّفد، وهو العون. «الرفد والإرفاد: الإعانة، والاسترفاد الاستعانة» [@zawzani، ص104]."
  - term: "أَرْفِدِ"
    text: "أُعِن وأُعطِ."
syntax:
  - "«والتاء اسم ليس، والباء خبر ليس» [@ibn-al-anbari، ص186]، أي أن «بِحَلَّالِ» خبر «ليس» والباء زائدة."
  - "«والمخافة منصوبة على المصدر» [@ibn-al-anbari، ص186]، وهي في المعنى مفعول لأجله: لست أنزلها من أجل الخوف."
  - "«ويسترفد مجزوم بمتى، والدال كسرت لاجتماع الساكنين، وأرفد جواب الجزاء» [@ibn-al-anbari، ص186]."
morphology:
  - "«حَلّال» على «فعّال»، صيغة مبالغة من «حلّ» بمعنى نزل [@zawzani، ص104]."
  - "«يَسْتَرْفِد» على «يستفعل» من «رَفَد»، والسين والتاء للطلب."
  - "«التِّلاع» جمع «تَلْعة»، وتُجمع أيضًا على «تَلَعات» [@zawzani، ص104]."
rhetoric:
  thesis: "الكرم عنده ألا يختبئ: ينزل حيث يراه الضيف وابن السبيل."
  devices:
    - title: "الكناية"
      text: "نزول التلاع كناية عن البخل والجبن معًا، لأنها «تستر من نزل فيها». وفي رواية الأَصْمَعِيّ: «لا أنزلها مخافة فتواريني من الناس حتى لا يراني ابن السبيل والضيف، ولكني أنزل الفضاء» [@ibn-al-anbari، ص186]."
    - title: "النفي ثم الاستدراك"
      text: "نفى عن نفسه صفة بـ«لست»، ثم أثبت نقيضها بـ«ولكن». فالبيت نصفان: ما لا يفعله، وما يفعله."
  connection: "ثم يقول: تجدني في مجلس القوم، أو في حانات الخمر."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلَسْتُ / بِحَلْلَالِتْ / تِلَاعِ / مَخَافَتَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَلَاكِنْ / مَتَى يَسْتَرْ / فِدِلْ قَوْ / مُ أَرْفِدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]. و«لكنْ» تُكتب في التقطيع «لاكنْ» لأن ألفها تُنطق ولا تُكتب."
context: "يبدأ صورة الفتى في قومه: كريم في الحضر. وقال أبو جعفر: «أنا رجل في السفر، كريم في الحضر» [@ibn-al-anbari، ص186]؛ أي أن الأبيات قبله صورته مسافرًا، وهذا البيت وما بعده صورته مقيمًا."
variants:
