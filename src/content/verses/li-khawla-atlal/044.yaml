    status: "رواية الأَصْمَعِيّ"
    note: "[@ibn-al-anbari، ص186]."
  - reading: "وَلَسْتُ بِحَلَّالِ التِّلَاعِ بِبَيْتِهِ"
    status: "رواية الطُّوسِيّ"
    note: "«يقول: لا أضرب بيتي فأنزل في التلاع» [@ibn-al-anbari، ص186]."
