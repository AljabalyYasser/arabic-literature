first: "سَقَتْهُ إِيَاةُ الشَّمْسِ إِلَّا لِثَاتِهِ"
second: "أُسِفَّ وَلَمْ تَكْدِمْ عَلَيْهِ بِإِثْمِدِ"
meaning: "أشربت الشمس ثغرها ضوءها فهو أبيض برّاق، إلا لثاته، فقد ذُرّ عليها الإثمد فاسودّت، ولم تعضّ بأسنانها على شيء صلب يفلّها. قال ابن الأَنْبارِيّ: «معناه حسنته وبيضته وأشربته حسنا. وإياة الشمس: ضوؤها وشعاعها. فأراد أن ثغرها ابيض براق» [@ibn-al-anbari، ص146]."
vocabulary:
  - term: "إِيَاةُ الشَّمْسِ"
    text: "ضوؤها. «إياة الشمس وإياها: شعاعها» [@zawzani، ص92]."
  - term: "لِثَاتِهِ"
    text: "«اللثة: مغرز الأسنان، والجمع اللثات» [@zawzani، ص92]."
  - term: "أُسِفَّ"
    text: "ذُرّ عليه: «ومعنى أسف ذر عليه، والمعنى على اللثة» [@ibn-al-anbari، ص146]. «ونساء العرب تذر الإثمد على الشفاه واللثات فيكون ذلك أشد للمعان الأسنان» [@zawzani، ص92]."
  - term: "تَكْدِمْ"
    text: "«الكدم: العض» [@zawzani، ص92]. أي لم تعضّ «عظما فيؤثر في ثغرها ويذهب أشرها. والأشر: تحديد يكون في الأسنان» [@ibn-al-anbari، ص146]، أي رقّة في أطرافها."
  - term: "إِثْمِدِ"
    text: "«الإثمد: الكحل» [@zawzani، ص92]."
syntax:
  - "«والاياة ترتفع بفعلها، واللثات تنصب على الاستثناء» [@ibn-al-anbari، ص146]: «إياة» فاعل «سقته»، و«لثاته» مستثنى منصوب، والمستثنى منه الضمير في «سقته»: سقت الشمس الثغر كله إلا لثاته."
  - "«أُسِفّ» فعل مبني للمجهول. وتقدير ابن الأَنْبارِيّ: «أسف بإثمد ولم تكدم عليه» [@ibn-al-anbari، ص146]؛ فـ«بإثمد» متعلق بـ«أسفّ»، مع أنه جاء في آخر البيت بعد «ولم تكدم عليه». أخّره الشاعر إلى القافية، والمعنى على تقديمه."
  - "وتقدير الزَّوْزَنِيّ قريب منه: «أسف بإثمد ولم تكدم عليه بشيء» [@zawzani، ص92]، فزاد «بشيء»؛ أي أن لـ«تكدم» متعلقًا محذوفًا: لم تعضّ على شيء."
morphology:
  - "في «إياة» لغات: «ويقال: هو أياء الشمس بالمد وفتح الألف، وهو إيا الشمس بالقصر وكسر الألف. وقال الفراء: قد يكسرون ويدخلون الهاء، فيقولون: إياة الشمس» [@ibn-al-anbari، ص146]."
  - "«أُسِفّ» ماضي «أسفّ» الرباعي مبنيًّا للمجهول، و«الإسفاف: إفعال من سففت الشيء أسفه سفًّا» [@zawzani، ص92]."
  - "«لِثات» جمع «لِثة» [@zawzani، ص92]. و«تَكْدِم» مضارع «كدَم» مجزوم بـ«لم»."
rhetoric:
  thesis: "الشمس نفسها تسقي ثغرها، والاستثناء يرسم الحد بين البياض والسواد."
  devices:
    - title: "الاستعارة"
      text: "للاستعارة عند عبد القاهر الجُرْجانيّ ضربان: أن تجعل «الشيء الشيء ليس به»، كأن تسمي الرجل الشجاع أسدًا؛ أو تجعل «للشيء الشيء ليس له»، كأن تجعل للريح يدًا [@dalail، ص67]. و«سقته» من الضرب الثاني: جعل للشمس فعل الساقي، وجعل ضوءها شرابًا يُشرَبه الثغر. ولذلك فسّرها ابن الأَنْبارِيّ بـ«أشربته حسنا» [@ibn-al-anbari، ص146]، وفسّرها الزَّوْزَنِيّ: «كأن الشمس أعارته ضوءها» [@zawzani، ص92]."
    - title: "الاحتراس بالاستثناء"
      text: "لو قال «سقته إياة الشمس» وسكت لعمّ البريقُ اللثات، وهو لا يُستحب: «يستثني اللثات؛ لأنه لا يستحب بريقها» [@zawzani، ص92]. وهذا ما يسميه ابن رَشِيق الاحتراس، ويجعله ضربًا من التتميم، وهو أن يحاول الشاعر معنى «فلا يدع شيئا يتم به حسنه إلا أورده وأتى به: إما مبالغة، وإما احتياطا واحتراسا من التقصير». ويرى أن ما وقع فيه استثناء «من باب الاحتراس والاحتياط» [@ibn-rashiq، ج2 ص50]."
    - title: "الكناية"
      text: "فهم أحمد بن عبيد من «لم تكدم عليه» معنى آخر: «معناه إنها عفيفة تأكل اللحم وتترك العظم، أي ليست بشرهة» [@ibn-al-anbari، ص146]. فترك العضّ على العظم كناية عن أدبها في الطعام. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
  connection: "ثم ينتقل من الثغر إلى الوجه كله: كأن الشمس حلّت عليه رداءها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "سَقَتْهُ / إِيَاةُشْ شَمْ / سِ إِلْلَا / لِثَاتِهِي = فعولُ / مفاعيلن / فعولن / مفاعلن — أُسِفْفَ / وَلَمْ تَكْدِمْ / عَلَيْهِ / بِإِثْمِدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "من صفة الحبيبة (6–10). والشمس تحضر في هذا البيت والذي بعده. وعند أحمد بن عبيد أن الصورة من عادة الأعراب: «إذا سقطت سن أحدهم قال: يا شمس أبدليني سنا من ذهب أو فضة» [@ibn-al-anbari، ص146]. فكأن الشمس في هذا البيت هي التي وهبت الحبيبة ثغرها."
variants:
