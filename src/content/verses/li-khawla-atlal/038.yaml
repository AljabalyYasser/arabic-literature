first: "وَأَعْلَمُ مَخْرُوتٌ مِنَ الْأَنْفِ مَارِنٌ"
second: "عَتِيقٌ مَتَى تَرْجُمْ بِهِ الْأَرْضَ تَزْدَدِ"
meaning: "ولها مشفر أعلى مشقوق، وأنف مثقوب ليّن كريم، إذا أدنت رأسها من الأرض كأنها ترجمها به ازدادت سرعة. قال الزَّوْزَنِيّ: «ولها مشفر مشقوق، ومارن أنفها مثقوب، وهي عندما ترمي الأرض بأنفها ورأسها تزداد في سيرها» [@zawzani، ص102]."
vocabulary:
  - term: "أَعْلَمُ"
    text: "«المشفر. وكل الإبل علم. والعلم: شق في الشفة العليا» [@ibn-al-anbari، ص180]."
  - term: "مَخْرُوتٌ"
    text: "«المشقوق. وخرت كل شيء: ثقبه» [@ibn-al-anbari، ص181]. و«المخروت: المثقوب، والخرت الثقب» [@zawzani، ص102]."
  - term: "مَارِنٌ"
    text: "«اللين. يقال: قد مرن الجلد» [@ibn-al-anbari، ص181]. و«المارِنُ: ما لان من الأنف» [@zawzani، ص102]."
  - term: "عَتِيقٌ"
    text: "كريم. «والعتيق من كل شيء: الكريم» [@ibn-al-anbari، ص153]."
  - term: "تَرْجُمْ"
    text: "«معناه متى ترجم الأرض برأسها. يقول: إذا أومأت برأسها إلى الأرض ازدادت سيرا». وقال الطوسي: «إذا أدنت رأسها من الأرض في سيرها؛ فذلك رجمها إياه» [@ibn-al-anbari، ص181–182]."
syntax:
  - "«والأعلم يرتفع بالرد على ما قبله» [@ibn-al-anbari، ص182]، أي معطوف على الأعضاء المعدودة قبله، والرد هنا العطف."
  - "«والمخروت نعته، وكذلك المارن والعتيق» [@ibn-al-anbari، ص182]. و«من الأنف» متعلق بـ«مخروت»."
  - "«وترجم مجزوم بمتى. وتزدد جواب الجزاء» [@ibn-al-anbari، ص182]. و«الأرض» مفعول «ترجم»، و«به» متعلق به. وكُسر آخر «تزدد» للقافية."
morphology:
  - "«أعلم» صفة على «أفعل»، «وجمع الأعلم عُلم» [@ibn-al-anbari، ص180]. ويقابله «الأفلح»: «والفلح: الشق في الشفة السفلى، يقال: رجل أفلح وامرأة فلحاء» [@ibn-al-anbari، ص181]."
  - "«مخروت» اسم مفعول من «خرت»، ومن أصله «الخِرّيت»، أي الدليل: «وسمى خريتا لأنه يهتدي إلى مثل خرت الإبرة» [@ibn-al-anbari، ص181]."
  - "«تزدد» على «تفتعل» من «زاد»، وأصلها «تزتاد»، قُلبت تاء الافتعال دالًا لمجاورة الزاي، وحُذفت الألف للجزم."
rhetoric:
  thesis: "آخر عضو في التمثال: الأنف والشفة العليا. ومعه حركة جديدة: رأس يدنو من الأرض فتزداد السرعة."
  devices:
    - title: "في التمثال: الأنف، والتمثال تامّ"
      text: "بهذا البيت يكتمل التمثال من الذنب (16) إلى الأنف. وهذا ما يعنيه شوقي ضيف بقوله إن طَرَفَة «نعت جميع أعضائها وكل دقيقة فيها وجليلة. ولم يترك منها شيئا دون وصف أو بيان» [@deif، ج1 ص221]. حتى الشق في الشفة، وهو في «كل الإبل» [@ibn-al-anbari، ص180]، له مكان في الوصف."
    - title: "الاستعارة"
      text: "في «ترجم به الأرض» استعارة: جعل إدناء الرأس من الأرض رجمًا، والرجم رمي بالحجارة. وللاستعارة عند عبد القاهر الجُرْجانيّ ضربان: أن تجعل «الشيء الشيء ليس به»، كأن تسمي الرجل الشجاع أسدًا؛ أو تجعل «للشيء الشيء ليس له»، كأن تجعل للريح يدًا [@dalail، ص67]. وهذه من الضرب الأول: جعل الإيماء رجمًا. فكأن الناقة تضرب الأرض بأنفها وهي تنطلق."
    - title: "حركتان للرأس"
      text: "في البيت 36 رأس يرتفع حتى يساوي الرحل، وهنا رأس ينخفض حتى يرجم الأرض. وجمع أحمد بن عبيد الحالين: «يفعل هذا إذا أرسلها، فإذا جذب زمامها أرقلت ورفعت رأسها» [@ibn-al-anbari، ص182]. فالراكب يتحكم في السيرتين بالزمام."
  connection: "ثم يخرج من الناقة إلى نفسه: «على مثلها أمضي إذا قال صاحبي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَأَعْلَ / مُ مَخْرُوتُنْ / مِنَلْ أَنْ / فِ مَارِنُنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — عَتِيقُنْ / مَتَى تَرْجُمْ / بِهِلْ أَرْ / ضَ تَزْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر [@atiq، ص29]."
context: "آخر أبيات الأعضاء. وفي ترتيب الزَّوْزَنِيّ يأتي هذا البيت بعد القلب مباشرة، ثم بيتا المشيئة [@zawzani، ص102]، فتكتمل الأعضاء عنده قبل المشيئة. وفي ترتيب ابن الأَنْبارِيّ يأتي بعدهما [@ibn-al-anbari، ص180]، فيكون آخر ما في قسم الناقة قبل أن يعود الشاعر إلى نفسه (39)."
