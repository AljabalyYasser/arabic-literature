first: "تَلَاقَى وَأَحْيَانًا تَبِينُ كَأَنَّهَا"
second: "بَنَائِقُ غُرٌّ فِي قَمِيصٍ مُقَدَّدِ"
meaning: "تلتقي هذه الآثار أحيانًا وتتفرق أحيانًا، كأنها قِطَع بيض مشقوقة في قميص. قال ابن الأَنْبارِيّ: «يقول: فآثار النسع في جلد هذه الناقة كذلك مرة تلاقى»، «وإذا ارتفعت إلى الرحل تباينت» [@ibn-al-anbari، ص171]."
vocabulary:
  - term: "تَلَاقَى"
    text: "«معناه: هذه الشرك يكون بعضها يلي بعضا ويتصل بعضها ببعض» [@ibn-al-anbari، ص171]."
  - term: "تَبِينُ"
    text: "«أي تفرق» [@ibn-al-anbari، ص171]."
  - term: "بَنَائِقُ"
    text: "«كأنها دخاريص قميص. وواحد الدخاريص دخرصة، وواحدة البنائق بنيقة» [@ibn-al-anbari، ص171]. والدخاريص: قطع تُخاط في جانبي القميص، دقيقة الرأس واسعة الأسفل."
  - term: "غُرٌّ"
    text: "«البيض» [@ibn-al-anbari، ص171]."
  - term: "مُقَدَّدِ"
    text: "«المشقق»، و«معناه متقطع» [@ibn-al-anbari، ص171]."
syntax:
  - "فاعل «تلاقى» و«تبين» ضمير يعود على «العلوب» في البيت السابق، فهي «آثار النسع» [@ibn-al-anbari، ص171]؛ والبيت لا يتم إلا بما قبله. و«تلاقى» أصلها «تتلاقى»، حُذفت إحدى التاءين كما في «تناول» في البيت 7."
  - "«والأحيان منصوبة على الوقت بتبين» [@ibn-al-anbari، ص171]، أي ظرف زمان متعلق بـ«تبين»."
  - "«والبنائق خبر كأن، وغر نعت البنائق» [@ibn-al-anbari، ص171]، و«في قميص» صفة أخرى لها."
morphology:
  - "«أحيان» جمع «حين» [@ibn-al-anbari، ص171]."
  - "«بنائق» جمع «بنيقة»، و«دخاريص» جمع «دخرصة» [@ibn-al-anbari، ص171]."
  - "«غُرّ» جمع «أغرّ» و«غرّاء» على «فُعْل». و«مقدَّد» اسم مفعول من «قدّد» بمعنى شقّق [@ibn-al-anbari، ص171]."
rhetoric:
  thesis: "يتمّ صورة آثار الأنساع: خطوط تلتقي وتفترق، كأنها قطع بيض في قميص مشقوق."
  devices:
    - title: "الطباق"
      text: "الطباق أن تجمع في الكلام بين الشيء وضده. وهو هنا في «تلاقى» و«تبين»: فالخطوط تتصل مرة وتنفصل مرة."
    - title: "تشبيه الهيئة"
      text: "اختار البنائق لشكلها: «وخص الدخاريص لدقة رأسه وسعة أسفله. فأراد أن الآثار مما يلي الحلق دقيقة، وما علا من ذلك إلى الرحل واسع، لأن الحلق يجمع الحبال فيدق الأثر» [@ibn-al-anbari، ص171]. والحَلَق: الحلقات التي تُجمع فيها السيور. فالتشبيه يطابق الشكل والتوزيع، ثم اللون في «غُرّ»."
    - title: "في التمثال: من الحجر إلى الثوب"
      text: "في البيت السابق كانت الآثار طرقًا في صخرة، وهنا صارت قطعًا في قميص. فالجلد صلب كالصخر في بيت، ومخيط كالثوب في بيت. وهذا من إعادة الصورة الواحدة بمادتين."
  connection: "ثم يصف عنقها الطويل: كأنه سكّان سفينة في دجلة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "تَلَاقَى / وَأَحْيَانَنْ / تَبِينُ / كَأَنْنَهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — بَنَائِ / قُ غُرْرُنْ فِي / قَمِيصِنْ / مُقَدْدَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "البيت الثاني في آثار الأنساع، ولا يتم معناه إلا بالذي قبله. والزَّوْزَنِيّ يرويه بلفظه [@zawzani، ص100]، ولا يظهر شرحه عليه في النسخة التي رجعنا إليها. وبعده يبدأ وصف العنق والرأس (28–35)."
