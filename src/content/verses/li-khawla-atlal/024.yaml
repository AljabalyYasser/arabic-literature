first: "أُمِرَّتْ يَدَاهَا فَتْلَ شَزْرٍ وَأُجْنِحَتْ"
second: "لَهَا عَضُدَاهَا فِي سَقِيفٍ مُسَنَّدِ"
meaning: "فُتلت يداها فتلًا محكمًا إلى الخارج فتباعدتا عن جنبيها، ومالت عضداها تحت صدر كأنه سقف من صفائح الحجارة أُسند بعضها إلى بعض. قال الزَّوْزَنِيّ: «فتلت يداها فتلًا بعدتا به عن كركرتها، وأميلت عضداها تحت جنبين كأنهما سقف أسند بعض لبنه إلى بعض» [@zawzani، ص99]. والكِرْكِرة: «نتوء في مقدم صدرها» [@zawzani، ص99، حاشية المحقق]."
vocabulary:
  - term: "أُمِرَّتْ"
    text: "«فتلت فتلا شديدا حتى نحيت عن جنبها. والامرار: شدة الفتل. يقال: رجل ذو مرة، إذا كان ذا شدة وعقل» [@ibn-al-anbari، ص167]."
  - term: "شَزْرٍ"
    text: "«معناه على اليسار. يعنى بذلك تجافى عضديها عن جنبيها» [@ibn-al-anbari، ص167]. وقال أحمد بن عبيد: «إنما قيل شزر لأن الشزر هو الفتل إلى خارج، واليسر إلى الصدر» [@ibn-al-anbari، ص168]."
  - term: "أُجْنِحَتْ"
    text: "«أميلت حتى كأنها متكئة كما تجنح السفينة». وقال ابن الأعرابي: «رفعت في تباعد قليل» [@ibn-al-anbari، ص168]."
  - term: "عَضُدَاهَا"
    text: "«ويقال عضُد وعضْد»، و«يقال للعضدين: ابنا ملاط» [@ibn-al-anbari، ص168]."
  - term: "سَقِيفٍ"
    text: "«(السقيف) هاهنا: زورها وما فوقه. وأصل السقيف صفائح حجارة» [@ibn-al-anbari، ص168]. و«السقف والسقيف واحد» [@zawzani، ص97]."
  - term: "مُسَنَّدِ"
    text: "«يعنى مشدد خلفه» [@ibn-al-anbari، ص168]. و«المسند: الذي أسند بعضه إلى بعض» [@zawzani، ص97]."
syntax:
  - "«واليدان اسم ما لم يسم فاعله» [@ibn-al-anbari، ص168]، أي نائب فاعل لـ«أُمرّت». و«ما لم يسمّ فاعله» عبارة القدماء عن المبني للمجهول."
  - "«والفتل منصوب بأمرت، وهو مصدر» [@ibn-al-anbari، ص168]: مفعول مطلق يبيّن نوع الإمرار، أي فُتلت فتلًا على جهة الشزر."
  - "«والعضدان يرتفعان بأجنحت. وفي سقيف مثله» [@ibn-al-anbari، ص168]: «عضداها» نائب فاعل لـ«أُجنحت»، و«لها» و«في سقيف» متعلقان بالفعل."
morphology:
  - "«أُمِرّت» ماضي «أمرّ» الرباعي مبنيًّا للمجهول، و«الإمرار: إحكام الفتل» [@zawzani، ص97]. ومن أصله «ذو مِرّة» في القرآن: «معناه ذو عقل وشدة» [@ibn-al-anbari، ص167]."
  - "«الشزر» و«اليسر» اسمان لجهتي الفتل. قال الطُّوسِيّ: «واليسر هو القبيل، والشزر هو الدبير لأنك تدبر بذا عن صدرك، وتقبل بذاك إلى صدرك. وهو قول الناس: (فلان لا يعرف قبيلا من دبير)» [@ibn-al-anbari، ص167]."
  - "«أُجنِحت» من «أجنح»: «الإجناح: الإمالة، والجنوح الميل» [@zawzani، ص97]. و«مُسَنَّد» اسم مفعول من «سنّد»."
rhetoric:
  thesis: "اليدان حبل فُتل إلى الخارج، والصدر سقف من حجر. صنعتان في بيت واحد: الفتّال والبنّاء."
  devices:
    - title: "في التمثال: اليدان والعضدان"
      text: "يصل إلى القوائم الأمامية. ويعيد معنى البيتين 21–22 من جهة أخرى: هناك المرفقان بعيدان عن الجنبين، وهنا اليدان مفتولتان «حتى نحيت عن جنبها» [@ibn-al-anbari، ص167]. فالتمثال يُبنى بالتكرار: كل بيت يثبّت صفة البعد عن الجنب من زاوية جديدة."
    - title: "الاستعارة"
      text: "الاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. وفي البيت استعارتان من هذا الضرب: «الفتل» للعضل المشدود، وأصله للحبل؛ و«السقيف» للصدر، وأصله «صفائح حجارة» [@ibn-al-anbari، ص168]."
    - title: "لغة الصنعة"
      text: "«الشزر» و«اليسر» من ألفاظ فتل الحبال، وقد فصّل فيهما الطُّوسِيّ وأحمد بن عبيد: الشزر إلى الخارج، واليسر إلى الصدر [@ibn-al-anbari، ص167–168]. فالشاعر يعرف دقائق هذه الصنعة، ويختار منها الجهة التي تدل على التباعد عن الجنب."
  connection: "ثم يصف ميلها في السير وضخامة رأسها وارتفاع كتفيها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أُمِرْرَتْ / يَدَاهَا فَتْ / لَ شَزْرِنْ / وَأُجْنِحَتْ = فعولن / مفاعيلن / فعولن / مفاعلن — لَهَا عَ / ضُدَاهَا فِي / سَقِيفِنْ / مُسَنْنَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "البيت في سلسلة البناء (18–24): باب القصر، ثم القنطرة، ثم السقف هنا. وتشبيه الصدر بالسقف من جنس ما قاله شوقي ضيف عن الجاهليين: «وكانوا يشبهونها بالقصور ويشبهون قوائمها بالأعمدة» [@deif، ج1 ص214]."
