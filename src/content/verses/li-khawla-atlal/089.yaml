first: "يَقُولُ وَقَدْ تَرَّ الْوَظِيفُ وَسَاقُهَا"
second: "أَلَسْتَ تَرَى أَنْ قَدْ أَتَيْتَ بِمُؤْيِدِ"
meaning: "يقول الشيخ، وقد سقط وظيفها وساقها بضربة السيف: ألا ترى أنك جئت بداهية؟ قال الزَّوْزَنِيّ: «قال هذا الشيخ في حال عقري هذه الناقة الكريمة وسقوط وظيفها وساقها عند ضربي إياها بالسيف: ألم تر أنك أتيت بداهية شديدة بعقرك مثل هذه الناقة الكريمة النجيبة؟» [@zawzani، ص116]."
vocabulary:
  - term: "تَرَّ"
    text: "«معناه ندر» [@ibn-al-anbari، ص220]، أي سقط وانفصل. وقال ابن دُرَيْد: «ترّ العظم يترّه ترّاً إذا قطعه وكذلك كل عضو انقطع بضربة واحدة فقد ترّ ترّاً» [@khizana، ج3 ص152]."
  - term: "الْوَظِيفُ"
    text: "«العظم الذي بين الرسغ والساق، وفي اليد: ما بين الرسغ والذراع» [@ibn-al-anbari، ص220]."
  - term: "مُؤْيِدِ"
    text: "«الداهية» [@ibn-al-anbari، ص220]. قال الأعلم: «وأصلها من الأيد وهو القوة كأنها داهية ذات شدة وقوة» [@khizana، ج3 ص153]."
syntax:
  - "فاعل «يقول» ضمير الشيخ صاحب الناقة [@khizana، ج3 ص155]. وجملة «وقد ترّ الوظيف» حال. وقد أنشد البَغْداديّ البيت شاهدًا في باب الحال، لأنها حال لا صاحب لها: فهي لا تبيّن هيئة الشيخ القائل، بل تصف ما جرى للناقة [@khizana، ج3 ص151–152]. والحال: وصف يبيّن هيئة صاحبه وقت الفعل."
  - "«ألستَ ترى...» مقول القول. قال البَغْداديّ: «والخطاب في الثلاثة لطرفة والاستفهام للتوبيخ» [@khizana، ج3 ص152]، يريد التاء في «لستَ» و«ترى» و«أتيتَ»."
  - "إن جُعلت الرؤية علمية فـ«أنْ» مخففة من «أنّ»، «واسمها ضمير شأن وجملة قد أتيت خبرها» [@khizana، ج3 ص152]."
morphology:
  - "«مُؤْيِد» اسم فاعل من «آيَدَ» على «أفعل»، من الأَيْد وهو القوة. وينقل البَغْداديّ عن ابن جِنّي أنه «بزنة اسم الفاعل من الأيد»، وأن الياء صحّت فيه لأن فاء الفعل همزة قد أُعلّت، فلم يقولوا «مئيد» [@khizana، ج3 ص153]."
  - "«ترّ» يأتي لازمًا ومتعديًا، كما يقول البَغْداديّ: «ترّ ورد لازما ومتعدياً» [@khizana، ج3 ص152]. وعلى ذلك رُوي «الوظيفُ» بالرفع و«الوظيفَ» بالنصب."
  - "«ساق» تجمع على «أسوق» و«سيقان»، «ويقال: رجل أسوق وامرأة سوقاء، إذا كانا حسني الأسوق» [@ibn-al-anbari، ص220]."
rhetoric:
  thesis: "أول كلام الشيخ: يقع في لحظة الضربة نفسها، سؤالًا غاضبًا."
  devices:
    - title: "الاستفهام للتوبيخ"
      text: "«ألستَ ترى» لا ينتظر جوابًا، بل يلوم: «والاستفهام للتوبيخ» [@khizana، ج3 ص152]."
    - title: "الحال ترسم اللحظة"
      text: "«وقد ترّ الوظيف وساقها»: جعل الكلام يقع والساق تسقط. فالصورة والصوت في وقت واحد."
    - title: "الشاعر يروي لوم خصمه"
      text: "يضع اللوم في فم الشيخ ولا يردّ عليه. ونرى أن اللوم يصير فخرًا: عِظَم الداهية عند الشيخ هو مقدار الكرم عند الشاعر."
  connection: "ثم يلتفت الشيخ إلى الحاضرين يستشيرهم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "يَقُولُ / وَقَدْ تَرْرَلْ / وَظِيفُ / وَسَاقُهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — أَلَسْتَ / تَرَى أَنْ قَدْ / أَتَيْتَ / بِمُؤْيِدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر والعَجُز [@atiq، ص29]."
context: "يبدأ الحوار. المتكلم هنا الشيخ صاحب الناقة، والمخاطَب طَرَفَة؛ وفي البيت التالي يتكلم الشيخ نفسه إلى الحاضرين. وقد جعله البَغْداديّ الشاهد الرابع والثمانين بعد المائة في «خزانة الأدب»، وأنشد معه أبيات القصة كلها [@khizana، ج3 ص151، ص154]."
variants:
  - reading: "تَقُولُ وَقَدْ تَرَّ الْوَظِيفُ وَسَاقُهَا"
    status: "متن ابن الأَنْبارِيّ"
    note: "كذا بالتاء في متن ابن الأَنْبارِيّ كما وصلنا، ولا يشرح من المتكلم [@ibn-al-anbari، ص220]. وأثبتنا «يقول» كما عند الزَّوْزَنِيّ [@zawzani، ص116] والمَرْزُوقِيّ [@marzuqi-hamasa، ص893] والبَغْداديّ [@khizana، ج3 ص151]؛ لأن البيت التالي يبدأ بـ«وقال»، فالمتكلم في البيتين واحد."
  - reading: "يَقُولُ وَقَدْ تَرَّ الْوَظِيفَ وَسَاقَهَا"
    status: "رواية أخرى"
    note: "«بنصب الوظيف على أنه مفعول ترّ المتعدي بمعنى قطع وفاعله ضمير العضب في بيت قبله» [@khizana، ج3 ص152]، أي: وقد قطع السيفُ الوظيف."
