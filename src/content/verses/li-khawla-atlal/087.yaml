first: "وَبَرْكٍ هُجُودٍ قَدْ أَثَارَتْ مَخَافَتِي"
second: "نَوَادِيَهُ أَمْشِي بِعَضْبٍ مُجَرَّدِ"
meaning: "ورُبّ إبل باركة نائمة، أثار خوفُها مني أوائلَها، وأنا أمشي إليها بسيف قاطع مسلول. قال الزَّوْزَنِيّ: «يريد أنه أراد أن ينحر بعيرًا منها فنفرت منه لتعوّدها ذلك منه» [@zawzani، ص116]."
vocabulary:
  - term: "بَرْكٍ"
    text: "قال الأَصْمَعِيّ: «جماعة إبل أهل الحواء». وقال أبو عُبَيْدة: «البرك يقع على جميع ما يبرك من الجمال والنوق على الماء وبالفلاة، من حر الشمس أو الشبع» [@ibn-al-anbari، ص217]. والحِواء: بيوت الحي المجتمعة."
  - term: "هُجُودٍ"
    text: "«النِّيام» [@ibn-al-anbari، ص217]."
  - term: "مَخَافَتِي"
    text: "«معناه خوفُها إياي» [@ibn-al-anbari، ص217]."
  - term: "نَوَادِيَهُ"
    text: "«أوائله وما سبق منه» [@ibn-al-anbari، ص218]."
  - term: "مُجَرَّدِ"
    text: "«المسلول من غمده، وهو المُصلت أيضاً» [@ibn-al-anbari، ص218]."
syntax:
  - "«والبرك مخفوض بإضمار ربّ» [@ibn-al-anbari، ص218]: الواو واو «رُبّ»، أي: ورُبّ برك، فـ«رُبّ» محذوفة والجر بها."
  - "«والمخافة ترتفع بأثارت، والنوادي تنتصب بأثارت» [@ibn-al-anbari، ص218]. و«مخافتي» مصدر «مضاف إلى المفعول» [@zawzani، ص116]: الياء هي المخوف منه، «والفاعل محذوف أي: مخافتها إيَّايَ» [@khizana، ج3 ص154]."
  - "«وأمشي حال» [@ibn-al-anbari، ص218]، وصاحبها الياء في «مخافتي» [@khizana، ج3 ص154]."
morphology:
  - "«هُجود» جمع «هاجد» [@zawzani، ص116]. «ويقال: قد تهجّد الرجل، إذا سهر» [@ibn-al-anbari، ص217]؛ فالثلاثي «هجد» للنوم، و«تهجّد» للسهر."
  - "«مَخافة» مصدر «خاف»: «يقال خفت الشيء مخافة وخوفاً وخيفة» [@ibn-al-anbari، ص217]."
  - "«مُجرَّد» اسم مفعول من «جرّد» على «فعّل»."
rhetoric:
  thesis: "تبدأ القصة من عيون الإبل: تعرفه، فتفرّ منه قبل أن يصل إليها."
  devices:
    - title: "الكناية"
      text: "فزع الإبل منه كناية عن كثرة نحره للضيوف. قال ابن الأَنْبارِيّ: «أي أثار ما شذ منها خوفها مني أن أعقرها وأنحرها للأضياف» [@ibn-al-anbari، ص218]. فلم يقل إنه كريم، بل جعل الإبل تشهد بذلك."
    - title: "المشهد من جهة الإبل"
      text: "«مخافتي» مصدر أضيف إلى المفعول: الإبل هي الخائفة، وهو المخوف منه. فالشاعر يرى نفسه بعيون إبل تعرف ما يصنع."
    - title: "تخصيص النوادي"
      text: "«وإنما خص النوادي لأنه لا يُفلت من عقري ما شذّ فند» [@ibn-al-anbari، ص218]. وشذّ فندّ: انفرد فهرب. أي حتى السابقة الفارّة لا تنجو منه."
  connection: "ثم تمر به ناقة ضخمة، هي خير مال شيخ يابس."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَبَرْكِنْ / هُجُودِنْ قَدْ / أَثَارَتْ / مَخَافَتِي = فعولن / مفاعيلن / فعولن / مفاعلن — نَوَادِ / يَهُو أَمْشِي / بِعَضْبِنْ / مُجَرْرَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "تبدأ هنا قصة في ستة أبيات (87–92). يرويها الشاعر في البيتين الأولين وفي البيت الأخير، ويتكلم في الأبيات الثلاثة بينها (89–91) الشيخ صاحب الناقة، على خلاف بين الشراح فيمن يقول البيت 91. والسيف الذي أقسم ألا يفارق جنبه في الحرب (83) هو هنا في يده يمشي به إلى الإبل."
variants:
  - reading: "نَوَادِيَهَا"
    status: "رواية أخرى"
    note: "والضمير للإبل [@ibn-al-anbari، ص218]. وبها رواه البَغْداديّ [@khizana، ج3 ص154]."
  - reading: "بَوَادِيَهَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "«بواديها: أوائلها وسوابقها» [@zawzani، ص116]."
