first: "تَرَبَّعَتِ الْقُفَّيْنِ بِالشَّوْلِ تَرْتَعِي"
second: "حَدَائِقَ مَوْلِيِّ الْأَسِرَّةِ أَغْيَدِ"
meaning: "رعت هذه الناقة الربيع في القُفّين مع نوق خفّت بطونها وضروعها، ترعى رياض وادٍ أصابه المطر بعد المطر، ناعم النبات. قال الزَّوْزَنِيّ: «وصف الناقة برعيها أيام الربيع ليكون ذلك أوفر للحمها وأشد تأثيرًا في سمنها» [@zawzani، ص95]."
vocabulary:
  - term: "تَرَبَّعَتِ"
    text: "«معناه رعت الربيع» [@ibn-al-anbari، ص154]. و«التربع: رعي الربيع والإقامة بالمكان واتخاذه ربعًا» [@zawzani، ص94]."
  - term: "الْقُفَّيْنِ"
    text: "مثنى قُفّ، وهو «ما ارتفع من الأرض في غلظ وصلابة ولم يبلغ أن يكون جبلا في ارتفاعه» [@ibn-al-anbari، ص154]. وأراد بهما عند الزَّوْزَنِيّ «قفين معروفين» [@zawzani، ص95]."
  - term: "الشَّوْلِ"
    text: "«جمع شائلة، وهي التي قد أتى عليها من نتاجها ثمانية أشهر فخفت بطونها وضروعها، كما يشول الميزان، أي: يخف» [@ibn-al-anbari، ص154–155]. والنتاج: الولادة."
  - term: "مَوْلِيِّ"
    text: "الذي أصابه الوَلِيّ، وهو «مطر يقع بعد مطر قبله» [@ibn-al-anbari، ص155]. وعند الزَّوْزَنِيّ: «المطر الثاني من أمطار السنة... والأول الوسمي، سمي به لأنه يسم الأرض بالنبات» [@zawzani، ص95]."
  - term: "الْأَسِرَّةِ"
    text: "«طرائق من نبت. وقال الطوسي: الأسرة: بطون الأودية. وسرارة الوادي: وسطه وأكرم موضع فيه» [@ibn-al-anbari، ص155–156]."
  - term: "أَغْيَدِ"
    text: "«الريان المنثني من النعمة» [@ibn-al-anbari، ص156]. و«الأغيد: الناعم الخلق» [@zawzani، ص95]."
syntax:
  - "«وفاعل تربعت مضمر فيه من ذكر الناقة. والقفان ينتصبان بتربعت، والباء صلة تربعت» [@ibn-al-anbari، ص156]: الفاعل ضمير مستتر يعود على الناقة، و«القفين» مفعول به، كأنه قال: رعت ربيع القفين. و«بالشول» متعلق بالفعل."
  - "«وموضع ترتعي نصب على الحال مما في تربعت، والحدائق منصوبة بترتعي، وهي مضافة إلى مولى» [@ibn-al-anbari، ص156]: فجملة «ترتعي» حال من الضمير المستتر في «تربعت»."
  - "«والأسرة مخفوضة بإضافة مولى إليها. والاغيد نعت للمولى» [@ibn-al-anbari، ص156]. و«مولي» صفة حُذف موصوفها، والتقدير عند الزَّوْزَنِيّ: «وحدائق واد مولي الأسرّة فحذف الموصوف ثقة بدلالة الصفة عليه» [@zawzani، ص95]."
morphology:
  - "«ترتعي» على «تفتعل من الرعي» [@ibn-al-anbari، ص155]. و«الارتعاء: الرعي» [@zawzani، ص94]."
  - "في «الشَّوْل» جمعان: «الشول: النوق التي جفت ضروعها وقلّت ألبانها، الواحدة شائلة، بالتاء لا غير. وأما الشول جمع شائل، من شال البعير بذنبه إذا رفعه» [@zawzani، ص94]."
  - "«مَوْلِيّ» اسم مفعول من «وُلِيَ المكان»: «يقال: ولي المكان يولى فهو مولي إذا مطر الولي» [@zawzani، ص95]. وأصله «مَوْلُوي»، قُلبت الواو ياء وأُدغمت في الياء. و«أغيد» على «أفعل»، «وتأنيثه غيداء، والجمع الغِيد» [@zawzani، ص95]."
rhetoric:
  thesis: "قبل أن يصف أعضاءها يذكر من أين جاءتها القوة: ربيع خصيب في وادٍ سقاه المطر مرتين. فالمرعى مادة التمثال."
  devices:
    - title: "الكناية"
      text: "لم يقل إنها سمينة قوية، بل ذكر ما يلزم عنه السمن: ربيع، ومطر بعد مطر، ورياض. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. والغاية عند الزَّوْزَنِيّ أن يكون ذلك «أوفر للحمها» [@zawzani، ص95]."
    - title: "في التمثال: المادة قبل الشكل"
      text: "قيّد المرعى بثلاثة قيود: حدائق، في وادٍ «مولي»، «أغيد». فالحديقة عند الزَّوْزَنِيّ «كل روضة ارتفعت أطرافها وانخفض وسطها» [@zawzani، ص94]، والوليّ مطر ثانٍ يلحق الأول، والأغيد «الريان المنثني من النعمة» [@ibn-al-anbari، ص156]. كل قيد يزيد الخصب، والخصب يصير لحمًا وقوة في الأبيات التالية."
    - title: "صفة الحيّ للوادي"
      text: "التثنّي والنعمة من صفات الأحياء، وقد جعلهما للوادي ونباته. وهذا فيما نرى من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
  connection: "ثم يصف طاعتها لمن يدعوها، وامتناعها على الفحل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "تَرَبْبَ / عَتِلْ قُفْفَيْ / نِ بِشْشَوْ / لِ تَرْتَعِي = فعولُ / مفاعيلن / فعولن / مفاعلن — حَدَائِ / قَ مَوْلِيْيِلْ / أَسِرْرَ / ةِ أَغْيَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "يقطع صفة السير ليذكر ماضي الناقة: أين رعت، ومع أي النوق كانت. فهي في «الشول» التي خفّت ضروعها، لا في الحوامل ولا المرضعات؛ «ثم وصفها بأنها كانت في صواحب لها، وهي إذا رأت صواحبها ترعى كان ذلك أدعى إلى الرعي» [@zawzani، ص95]. فالقوة التي سيصفها عضوًا عضوًا لها أصل في هذا المرعى."
variants:
  - reading: "تَرَبَّعَتِ الْقُفَّيْنِ فِي الشَّوْلِ تَرْتَعِي"
    status: "رواية التَّوَّزِيّ والطُّوسِيّ"
    note: "«وقوله (بالشول) معناه في الشول، وكذلك رواه يعقوب. وروى التوزى والطوسي: (في الشول)» [@ibn-al-anbari، ص154]. وهي رواية الزَّوْزَنِيّ [@zawzani، ص94]."
