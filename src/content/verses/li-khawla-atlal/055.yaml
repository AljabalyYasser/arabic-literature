first: "فَإِنْ كُنْتَ لَا تَسْطِيعُ دَفْعَ مَنِيَّتِي"
second: "فَدَعْنِي أُبَادِرْهَا بِمَا مَلَكَتْ يَدِي"
meaning: "فإن كنت لا تقدر أن تدفع عني الموت، فدعني أسبقه فأنفق ما أملك قبل أن يأتي. قال الزَّوْزَنِيّ: «يريد أن الموت لا بد منه فلا معنى للبخل بالمال وترك اللذات» [@zawzani، ص108]."
vocabulary:
  - term: "تَسْطِيعُ"
    text: "تستطيع. «اسطاع يسطيع، لغة في استطاع» [@zawzani، ص108]."
  - term: "مَنِيَّتِي"
    text: "موتي."
  - term: "أُبَادِرْهَا"
    text: "أسبقها وأسارعها. «معناه: أبادر المنية بإنفاق ما ملكت يدي في لذاتي» [@ibn-al-anbari، ص193]."
syntax:
  - "«إنْ» شرطية، وجملة «فدعني» جواب الشرط، واقترنت بالفاء لأنها طلبية."
  - "«أُبادِرْها» مجزوم في جواب الطلب «دعني»، وعلامة جزمه السكون."
  - "«بما ملكت يدي»: الباء للاستعانة، و«ما» موصولة، والعائد محذوف: بما ملكته يدي."
morphology:
  - "«تَسْطِيع» من «اسطاع يسطيع»، حُذفت منه تاء «استطاع» تخفيفًا [@zawzani، ص108]."
  - "«مَنِيّة» على «فعيلة» من «مَنَى» بمعنى قدّر، فهي المقدَّرة."
  - "«أُبادِر» مضارع «بادَر» على «فاعَل»، ويدل على المسابقة بين طرفين: هو والموت."
rhetoric:
  thesis: "النتيجة التي يبنيها على سؤال البيت السابق: ما دام الموت لا يُدفع، فلتكن الحياة إنفاقًا قبل أن يأخذها."
  devices:
    - title: "الشرط حجةً"
      text: "صاغ فلسفته في صورة شرط وجواب: إن عجزت عن كذا فدعني أفعل كذا. فالبيت برهان صغير، مقدمته في الصدر ونتيجته في العَجُز."
    - title: "الاستعارة"
      text: "في «أبادرها» جعل الموت خصمًا يتسابق معه، فمن سبق فاز. وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر [@dalail، ص67]."
    - title: "الكناية"
      text: "«بما ملكت يدي» كناية عن كل ماله، فاليد هي الحيازة."
  connection: "ثم يبيّن ما يبقيه في الحياة: ثلاث خلال."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَإِنْ كُنْ / تَ لَا تَسْطِي / عُ دَفْعَ / مَنِيْيَتِي = فعولن / مفاعيلن / فعولُ / مفاعلن — فَدَعْنِي / أُبَادِرْهَا / بِمَا مَ / لَكَتْ يَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "جعله ابن قُتَيْبة مع البيت السابق «من جيد شعره» [@ibn-qutayba، ج1 ص189]. وفيه فلسفة القصيدة كلها: الموت آتٍ لا محالة، فالبخل بالحياة خسارة."
