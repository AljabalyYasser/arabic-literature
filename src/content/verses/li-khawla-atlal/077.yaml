first: "وَلَكِنَّ مَوْلَايَ امْرُؤٌ هُوَ خَانِقِي"
second: "عَلَى الشُّكْرِ وَالتَّسْآلِ أَوْ أَنَا مُفْتَدِ"
meaning: "لكن ابن عمي رجل يضيّق عليّ حتى كأنه يأخذ بحلقي، أشكره وأسأله فلا يلين، بل أفتدي نفسي منه. قال ابن الأَنْبارِيّ: «معناه يسألني أن أشكره وأفتدي منه بمالي» [@ibn-al-anbari، ص208]. وقال الزَّوْزَنِيّ: «هو لا يزال يضيّق الأمر عليّ سواء شكرته على آلائه، أو سألته بره وعطفه، أو طلبت تخليص نفسي منه» [@zawzani، ص113]. والآلاء: النعم."
vocabulary:
  - term: "خَانِقِي"
    text: "«خنقت الرجل خنقًا: عصرت حلقه» [@zawzani، ص113]."
  - term: "التَّسْآلِ"
    text: "«السؤال» [@zawzani، ص113]."
  - term: "مُفْتَدِ"
    text: "قال الأَصْمَعِيّ: «أو أنا مفتد منه». وقال أبو جعفر: «أو أنا هارب منه أفتدي نفسي منه بغيري» [@ibn-al-anbari، ص208]."
  - term: "مَوْلَايَ"
    text: "ابن عمي، كما في البيت السابق [@ibn-al-anbari، ص208]."
syntax:
  - "«لكنّ» حرف استدراك ينصب الاسم ويرفع الخبر: «مولاي» اسمها، و«امرؤ» خبرها، وجملة «هو خانقي» نعت لـ«امرؤ»."
  - "«على الشكر» في موضع الحال، أي «على حال شكري إياه وسؤالي عوارفه» كما يفسره الزَّوْزَنِيّ [@zawzani، ص113]. والعوارف: المعروف والإحسان."
  - "وفي «أو» ثلاثة أوجه عند ابن الأَنْبارِيّ: هي «على رواية العامة» بمعنى «بل»، «كأنه قال: بل أنا مفتد منه»، واستشهد بقوله تعالى: (إلى مائةِ ألف أو يزيدون)؛ وهي بمعنى «أم» في رواية أبي عُبَيْدة؛ ويقال هي «بمعنى الواو، والتقدير: وأنا مفتد». ثم قال: «وأو بمعنى أم قليل في الكلام» [@ibn-al-anbari، ص208]."
morphology:
  - "«التَّسْآل» مصدر على «تَفْعال» بفتح التاء، وهو بناء يدل على الكثرة، كـ«التَّشْراب» في البيت 51: «وتفعال من أوزان المصادر مثل التقتال بمعنى القتل» [@zawzani، ص107]."
  - "«مُفْتَدٍ» اسم فاعل من «افتدى» على «افتعل» من «فدى»، وهو اسم منقوص حُذفت ياؤه مع التنوين، وأُشبعت كسرته في القافية."
  - "«خانِق» اسم فاعل من «خنق»، أضيف إلى ياء المتكلم، وهي مفعوله في المعنى."
rhetoric:
  thesis: "ثلاثة أبواب مغلقة: الشكر لا يليّنه، والسؤال لا يعطفه، ولا يبقى إلا أن يفتدي نفسه منه."
  devices:
    - title: "الاستعارة"
      text: "لم يمدّ ابن عمه يده إلى حلقه، لكنه ضيّق عليه «حتى كأنه يأخذ عليّ متنفسي» كما يقول الزَّوْزَنِيّ [@zawzani، ص113]. فالخنق اسم لما يفعله ابن العم من التضييق. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تُريد تشبيه الشيء بالشيء، فتدع أن تُفصح بالتشبيه وتُظهره، وتجيء إلى اسم المشبه به فتُعيره المشبه وتُجريه عليه» [@dalail، ص67]."
    - title: "الاستدراك"
      text: "«ولكنّ» تكمل «فلو» في البيت السابق: هناك الأمنية، وهنا الواقع. والبيتان معًا صورة واحدة: ما كان يمكن أن يكون، وما هو كائن."
    - title: "الإضراب"
      text: "الإضراب الانتقال من معنى إلى معنى أقوى منه. وعلى قراءة «أو» بمعنى «بل» [@ibn-al-anbari، ص208] ينتقل الشاعر من الشكر والسؤال إلى ما هو أشد: الافتداء، كأن ابن عمه صار آسرًا."
  connection: "ثم يصوغ تجربته حكمة: ظلم ذوي القربى أشد على المرء من وقع السيف."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلَاكِنْ / نَ مَوْلَايَمْ / رُؤُنْ هُ / وَ خَانِقِي = فعولن / مفاعيلن / فعولُ / مفاعلن — عَلَشْ شُكْ / رِ وَتْتَسْءَا / لِ أَوْ أَ / نَ مُفْتَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]. و«لكنّ» تُكتب في التقطيع «لاكنّ» لأن ألفها تُنطق ولا تُكتب، و«أنا» تُكتب «أَنَ» لأن ألفها لا تُنطق في الوصل."
context: "ختام الشكوى المباشرة من ابن العم. وفي «أو أنا مفتد» ثلاث قراءات يرويها ابن الأَنْبارِيّ: الأَصْمَعِيّ يجعلها افتداءً منه بالمال، وأبو جعفر يجعلها هربًا «أفتدي نفسي منه بغيري»، وأبو عُبَيْدة يروي العجز «على غير ما أذنبت أو أنا معتد»، «أي معتد عليه» [@ibn-al-anbari، ص208]، فالمعنى عنده: أيخنقني بلا ذنب، أم أنا المعتدي عليه؟ وبعد هذا البيت روى الرُّسْتُميّ وغيره البيت المشهور «وظلم ذوي القربى أشد مضاضة» [@ibn-al-anbari، ص208–209]."
variants:
  - reading: "عَلَى غَيْرِ مَا أَذْنَبْتُ أَوْ أَنَا مُعْتَدِ"
    status: "رواية أبي عُبَيْدة"
    note: "«أي معتد عليه». «وفي رواية أبي عبيدة أو بمعنى أم» [@ibn-al-anbari، ص208]. فالمعنى: أيخنقني بلا ذنب، أم أنا المعتدي؟"
