first: "كَقَنْطَرَةِ الرُّومِيِّ أَقْسَمَ رَبُّهَا"
second: "لَتُكْتَنَفَنْ حَتَّى تُشَادَ بِقَرْمَدِ"
meaning: "كأنها قنطرة بناها رجل رومي، أقسم صاحبها ليحيطنّ بها البنّاؤون من كل جانب حتى تُرفع وتُبنى بالآجُرّ. قال الزَّوْزَنِيّ: «شبه الناقة في تراصف عظامها وتداخل أعضائها بقنطرة تبنى لرجل رومي قد حلف صاحبها ليحاطنّ بها حتى ترفع أو تجصص بالصاروج أو بالآجر» [@zawzani، ص97]. والآجُرّ: الطين المشويّ."
vocabulary:
  - term: "قَنْطَرَةِ"
    text: "«القنطرة: الأزج. يقول: كأن هذه الناقة أزج؛ لانتفاخ جوفها» [@ibn-al-anbari، ص164]. والأزج: البناء المعقود."
  - term: "الرُّومِيِّ"
    text: "«وإنما خص الرومي لأنه أحكم عملا» [@ibn-al-anbari، ص164]."
  - term: "رَبُّهَا"
    text: "صاحبها. والرب عند ابن الأَنْبارِيّ ثلاثة معان: المالك، والسيد، والمصلح [@ibn-al-anbari، ص164–165]."
  - term: "لَتُكْتَنَفَنْ"
    text: "«معناه تؤتى من أكنافها»، أي من نواحيها [@ibn-al-anbari، ص165]."
  - term: "تُشَادَ"
    text: "«ترفع»، ويقال: «يشاد: يجصص»، والشِّيد: الجص [@ibn-al-anbari، ص165]."
  - term: "قَرْمَدِ"
    text: "«الآجر، واحدته قرمدة، وهو أعجمي عرب، وأصله قرميدي بالرومية فأعربته العرب». وقال أحمد بن عبيد: «قرمد عربي معروف في كلامهم» [@ibn-al-anbari، ص165]."
syntax:
  - "«والكاف موضعها رفع لأنها نعت للمرفقين، والتقدير مثل قنطرة الرومي» [@ibn-al-anbari، ص166]."
  - "جملة «أَقْسَمَ رَبُّهَا» صفة لـ«قنطرة». «واللام في لتكتنفا جواب القسم، والنون دخلت للتوكيد، وهي ألف في الوقف والخط، واسم ما لم يسم فاعله مضمر في لتكتنفا» [@ibn-al-anbari، ص166]، أي نائب الفاعل ضمير يعود على القنطرة."
  - "«حَتَّى تُشَادَ»: «حتى» للغاية، والفعل بعدها منصوب."
morphology:
  - "«تُكْتَنَف» مضارع مبني للمجهول من «اكتنف» على «افتعل»، من الكَنَف، وهو الناحية [@ibn-al-anbari، ص165]."
  - "«تُشاد» مضارع «شاد» مبنيًّا للمجهول، ومنه «قصر مشيد» [@ibn-al-anbari، ص165]."
  - "«قَرْمَد» عند ابن الأَنْبارِيّ لفظ معرّب [@ibn-al-anbari، ص165]، والمعرّب لفظ أعجمي أدخلته العرب في كلامها."
rhetoric:
  thesis: "من السقّاء إلى البنّاء: يشبّه الناقة ببناء محكم بناه الروم، أهل الإتقان في عين العربي."
  devices:
    - title: "التشبيه"
      text: "شبّه الناقة «في تراصف عظامها وتداخل أعضائها» بقنطرة رومية [@zawzani، ص97]، وعند ابن الأَنْبارِيّ «لانتفاخ جوفها» [@ibn-al-anbari، ص164]."
    - title: "قصة في المشبه به"
      text: "لم يكتف بالقنطرة، بل جعل لها صاحبًا أقسم أن يتمها حتى تُرفع وتُبنى بالآجر. فالبناء لم يُترك فيه موضع ضعف، وكذلك الناقة."
    - title: "الشاعر النحّات"
      text: "يقول شوقي ضيف إن الشاعر الجاهلي «نحات لا يصنع قصيدة، وإنما يصنع تمثالا»، «وخير مثل لذلك وصف طَرَفَة لناقته في معلقته فقد نعت جميع أعضائها وكل دقيقة فيها وجليلة» [@deif، ج1 ص221]."
  connection: "ثم يمضي في صفتها: لونها، وخطوها، ويديها، وكتفيها (23–27)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَقَنْطَ / رَتِرْ رُومِيْ / يِ أَقْسَ / مَ رَبْبُهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — لَتُكْتَ / نَفَنْ حَتْتَى / تُشَادَ / بِقَرْمَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر والعَجُز [@atiq، ص29]."
context: "أشهر تشبيهات الناقة في المعلقة. والبيت متصل بما قبله في الإعراب، فالكاف فيه نعت للمرفقين [@ibn-al-anbari، ص166]. وقد عدّه شوقي ضيف مثالًا على الشاعر الذي يصنع تمثالًا لما يصفه [@deif، ج1 ص221]."
variants:
  - reading: "لَتُكْتَنَفَا حَتَّى تُشَادَ بِقَرْمَدِ"
    status: "متن ابن الأَنْبارِيّ"
    note: "كُتبت نون التوكيد الخفيفة ألفًا، «وهي ألف في الوقف والخط» [@ibn-al-anbari، ص164، ص166]. وبالنون رواية الزَّوْزَنِيّ [@zawzani، ص97]، والنطق واحد في الوصل."
