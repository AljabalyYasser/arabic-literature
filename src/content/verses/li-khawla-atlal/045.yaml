first: "وَإِنْ تَبْغِنِي فِي حَلْقَةِ الْقَوْمِ تَلْقَنِي"
second: "وَإِنْ تَقْتَنِصْنِي فِي الْحَوَانِيتِ تَصْطَدِ"
meaning: "إن طلبتني في مجلس القوم وجدتني هناك، وإن طلبتني في حانات الخمر صدتني هناك. قال الزَّوْزَنِيّ: «يريد أن يجمع بين الجد والهزل» [@zawzani، ص104]."
vocabulary:
  - term: "تَبْغِنِي"
    text: "تطلبني. «البغاء: الطلب، والفعل بغى يبغي» [@zawzani، ص104]."
  - term: "حَلْقَةِ الْقَوْمِ"
    text: "مجلسهم، حين يجلسون متحلّقين. «ويقال: هي حلقة القوم، وهي حلقة الحديد، بتسكين اللام» [@ibn-al-anbari، ص187]."
  - term: "تَقْتَنِصْنِي"
    text: "تصطدني، من القنص وهو الصيد. «الاصطياد: الاقتناص» [@zawzani، ص104]."
  - term: "الْحَوَانِيتِ"
    text: "«بيوت الخمارين» [@ibn-al-anbari، ص186]، واحدها حانوت."
syntax:
  - "«وموضع تبغني جزم بإن، وتلقني جواب الجزاء» [@ibn-al-anbari، ص187]. والشطر الثاني مثله: «تقتنصني» فعل الشرط، و«تصطد» جوابه."
  - "الياء في «تَبْغِنِي» و«تَقْتَنِصْنِي» مفعول به، والنون قبلها نون الوقاية."
  - "«تَصْطَدِ» مجزوم، وكُسر آخره للقافية."
morphology:
  - "«تَصْطَد» على «تفتعل» من «صاد»، قُلبت تاء الافتعال طاء لمجاورة الصاد: تَصْتَد ← تَصْطَد."
  - "«حَلْقة» تُجمع على «حَلَق» بفتح الحاء واللام، «وهذا من الشواذ، وقد تجمع على الْحِلَق» [@zawzani، ص104]."
  - "«حوانيت» جمع «حانوت» [@zawzani، ص104]."
rhetoric:
  thesis: "شطران متوازيان لرجل واحد: في مجلس الرأي، وفي مجلس الخمر."
  devices:
    - title: "المقابلة"
      text: "قابل بين «حلقة القوم» و«الحوانيت»، أي بين الجد والهزل [@zawzani، ص104]، وبنى الشطرين على نسق واحد: شرط ثم جواب."
    - title: "الاستعارة"
      text: "«تقتنصني» و«تصطد»: جعل من يطلبه صائدًا، وجعل نفسه صيدًا في الحانة. وهي استعارة فيها مزاح وفخر معًا."
  connection: "ثم يصف مجالسه: ندماء بيض كالنجوم، وقينة تغنيهم (46–50)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِنْ تَبْ / غِنِي فِي حَلْ / قَتِلْ قَوْ / مِ تَلْقَنِي = فعولن / مفاعيلن / فعولن / مفاعلن — وَإِنْ تَقْ / تَنِصْنِي فِلْ / حَوَانِي / تِ تَصْطَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "يرسم الفتى الذي يعرفه الجميع: رجل رأي في مجلس القوم، ورجل لهو في الحانة. والحانات عند شوقي ضيف كان يضربها تجار الخمر «في بعض الأحياء أو في بعض القرى ويضعون فوقها راية تعلن عنهم، فيأتيهم الشباب ليشربوا» [@deif، ج1 ص70]."
