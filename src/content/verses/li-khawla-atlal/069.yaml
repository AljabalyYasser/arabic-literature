first: "يَلُومُ وَمَا أَدْرِي عَلَامَ يَلُومُنِي"
second: "كَمَا لَامَنِي فِي الْحَيِّ قُرْطُ بْنُ أَعْبَدِ"
meaning: "يلومني ابن عمي، ولا أدري على أي شيء يلومني، كما لامني قرط بن أعبد في الحي ظلمًا. قال الزَّوْزَنِيّ: «يلومني مالك وما أدري ما السبب الداعي إلى لومه إياي، كما لامني هذا الرجل في القبيلة، يريد أن لومه إياه ظلم صراح كما كان لوم قُرْط إياه كذلك» [@zawzani، ص111]."
vocabulary:
  - term: "يَلُومُ"
    text: "فاعله مالك، ابن عم الشاعر المذكور في البيت السابق: «يلومني مالك» [@zawzani، ص111]."
  - term: "عَلَامَ"
    text: "«معناه على أي شيء يلومني» [@ibn-al-anbari، ص202]."
  - term: "الْحَيِّ"
    text: "القبيلة: «كما لامني هذا الرجل في القبيلة» [@zawzani، ص111]."
  - term: "قُرْطُ بْنُ أَعْبَدِ"
    text: "«رجل منهم» [@ibn-al-anbari، ص202]، أي من قوم طَرَفَة. وهو عند الزَّوْزَنِيّ «قرط بن معبد» [@zawzani، ص111]."
syntax:
  - "«يلوم» فاعله ضمير يعود على مالك. وجملة «وما أدري» حال: يلومني وأنا لا أدري. و«أدري» معلّق عن العمل بالاستفهام، أي لا ينصب مفعولًا ظاهرًا، وجملة «علام يلومني» في موضع مفعوله."
  - "وفي «علام»: «فحذف الألف من ما اكتفاء بفتحة الميم فيها؛ لأنها مع على بمنزلة الشيء الواحد». ثم قال: «وإنما يجوز حذف الألف من ما في الاستفهام خاصة إذا اتصلت بالخافض» [@ibn-al-anbari، ص203]. والخافض في عبارة الكوفيين حرف الجر."
  - "«كما لامني»: الكاف نعت لمصدر محذوف، و«ما» مصدرية: يلومني لومًا مثل لوم قرط إياي. و«قرط» فاعل «لام»."
morphology:
  - "«عَلامَ» أصلها «على ما»، حُذفت ألف «ما» الاستفهامية لأنها جُرّت بحرف [@ibn-al-anbari، ص203]. ومن العرب من يثبتها، وأنشد الفَرّاء: «على ما قام يشتمني لئيم» [@ibn-al-anbari، ص203]."
  - "«يلوم» مضارع «لام» الأجوف الواوي، ومصدره «اللَّوْم»."
  - "«أَعْبَد» علم على وزن «أفعل»، فهو ممنوع من الصرف، وحقه أن يُجرّ بالفتحة: «ابنُ أعبدَ». وجُرّ هنا بالكسرة للقافية، وصرف الممنوع جائز في الشعر."
rhetoric:
  thesis: "اللوم ثلاث مرات في بيت واحد، والسبب مجهول. فالشاعر يعرض الظلم قبل أن يعرض القصة."
  devices:
    - title: "تكرار المادة"
      text: "«يلوم... يلومني... لامني»: ثلاث صيغ من اللوم في بيت واحد. فالتكرار يُسمع القارئ ثقل اللوم الذي لا ينقطع."
    - title: "التشبيه بالمعروف"
      text: "قاس لوم مالك بلوم رجل يعرفه أهل الحي. قال الزَّوْزَنِيّ: «يريد أن لومه إياه ظلم صراح كما كان لوم قُرْط إياه كذلك» [@zawzani، ص111]. فالمشبه به قصة معروفة عند السامعين، وإن ضاعت عنا."
    - title: "نفي العلم"
      text: "«وما أدري» يثبت البراءة بلا دعوى: لا يقول «أنا بريء»، بل يقول «لا أعرف ذنبي». وسيبيّن في البيت 71 أنه لا ذنب له إلا أنه طلب إبل أخيه."
  connection: "ثم يقول: أيأسني من كل خير طلبته منه، حتى كأنما دفنّاه في قبر."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "يَلُومُ / وَمَا أَدْرِي / عَلَامَ / يَلُومُنِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — كَمَا لَا / مَنِي فِلْ حَيْ / يِ قُرْطُبْ / نُ أَعْبَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]."
context: "الثاني من قسم العتاب (68–81). والعتاب لوم يوجهه الإنسان إلى من يحب. يقول شوقي ضيف: «ومما ينحو نحو الاعتذار ما ظهر عندهم من فنون عتاب كان ينشئه بعض الشعراء ملامة لما قد يصيبه من أذى الأقارب»، ثم يقول: «ولكن عتابهم واعتذارهم قليل» [@deif، ج1 ص211]. وسبب العتاب قصة إبل مَعْبَد، أخي طَرَفَة، يذكرها في البيت 71 [@ibn-al-anbari، ص204]."
