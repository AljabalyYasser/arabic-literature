first: "وَأَيْأَسَنِي مِنْ كُلِّ خَيْرٍ طَلَبْتُهُ"
second: "كَأَنَّا وَضَعْنَاهُ إِلَى رَمْسِ مُلْحَدِ"
meaning: "وقطع رجائي في كل خير طلبته منه، حتى كأننا وضعناه في قبر ذي لحد. قال ابن الأَنْبارِيّ: «فيقول: قد يئست من خيره حتى كأنه قد مات ودفنته» [@ibn-al-anbari، ص203]."
vocabulary:
  - term: "أَيْأَسَنِي"
    text: "جعلني أيأس. «يقال: يئست من الشيء أيأس، وأيست منه آيس» [@ibn-al-anbari، ص203]. وعند الزَّوْزَنِيّ: «قنطني مالك من كل خير رجوته منه» [@zawzani، ص111]."
  - term: "رَمْسِ"
    text: "«القبر. يقال: ارمس هذا الحديث، أي ادفنه. والروامس: الرياح الدوافن» [@ibn-al-anbari، ص203]. وعند الزَّوْزَنِيّ: «الرّمس: القبر وأصله الدفن» [@zawzani، ص111]."
  - term: "مُلْحَدِ"
    text: "الميت الذي جُعل له لحد. «واللحد: ما يشق في جانب القبر... ويقال لحدته وألحدته، فهو ملحد وملحود» [@ibn-al-anbari، ص203]."
syntax:
  - "«أيأسني» فاعله ضمير مالك، والياء مفعوله. و«من كل خير» متعلق به، وجملة «طلبته» نعت لـ«خير»."
  - "«كأنّا»: «كأنّ» و«نا» اسمها، وجملة «وضعناه» خبرها."
  - "والهاء في «وضعناه» تحتمل وجهين: هي عند ابن الأَنْبارِيّ لمالك نفسه: «كأنه قد مات ودفنته» [@ibn-al-anbari، ص203]؛ وهي عند الزَّوْزَنِيّ للطلب: «حتى كأنا وضعنا ذلك الطلب إلى قبر رجل مدفون في اللحد» [@zawzani، ص111]. و«ملحد» على الوجهين مضاف إليه: قبر ميت ملحد."
morphology:
  - "«أَيْأَس» على «أفعل» من «يئس»، والهمزة للتعدية: يئستُ أنا، وأيأسني هو. وفي مضارع «يئس» لغتان: «يئس من الشيء ييأس وييئس» [@ibn-al-anbari، ص203]."
  - "«مُلْحَد» اسم مفعول من «ألحد» على «أفعل»، ويقال من الثلاثي «ملحود» [@ibn-al-anbari، ص203]."
  - "«رَمْس» مصدر سُمّي به القبر، وأصله الدفن [@zawzani، ص111]. و«اللحد» يُجمع على «لحود» [@ibn-al-anbari، ص203]."
rhetoric:
  thesis: "الأمل في ابن العم ميت مدفون. والقبر هنا صورة لليأس، لا للموت."
  devices:
    - title: "التمثيل"
      text: "شبّه يأسه من خير مالك بميت في قبر لا يُرجى رجوعه. قال الزَّوْزَنِيّ: «يريد أنه آيسه من كل خير طلبه كما أن الميت لا يرجى خيره» [@zawzani، ص111]. والتمثيل عند عبد القاهر الجُرْجانيّ تشبيه لا يتم «إلا بتأوّل»، أي بإعمال الفكر، لأن الشبه فيه بين معنى وصورة لا يُدرك بالعين وحدها؛ «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص92، ص95]."
    - title: "المبالغة"
      text: "«من كل خير»: لم يقل من خير واحد. فاليأس شامل، كما أن القبر لا يُخرج منه شيء."
    - title: "قبر الأحياء"
      text: "في أبيات الحكمة قبل قليل وصف قبر البخيل وقبر المسرف (63–64)، وهنا يعود القبر صورة لليأس من ابن العم. فالقصيدة تنتقل من قبور الموتى إلى قبر في قلب الحي."
  connection: "ثم يقول: كان ذلك بلا ذنب، إلا أنه طلب إبل أخيه معبد."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَأَيْأَ / سَنِي مِنْ كُلْ / لِ خَيْرِنْ / طَلَبْتُهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — كَأَنْنَا / وَضَعْنَاهُو / إِلَى رَمْ / سِ مُلْحَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر [@atiq، ص29]. وأُشبعت ضمة الهاء في «وضعناهُ» فصارت «وضعناهُو»."
context: "يكمل شكوى ابن العم: بعد اللوم بلا سبب (69) يأتي المنع (70). وقوله «من كل خير طلبته» يدل فيما يظهر على أنه طلب منه العون أكثر من مرة. وسبب العتاب قصة إبل مَعْبَد، أخي طَرَفَة، يذكرها في البيت 71 [@ibn-al-anbari، ص204]."
