first: "نَدَامَايَ بِيضٌ كَالنُّجُومِ وَقَيْنَةٌ"
second: "تَرُوحُ إِلَيْنَا بَيْنَ بُرْدٍ وَمُجْسَدِ"
meaning: "ندمائي بيض الوجوه مشهورون كالنجوم، ولنا جارية مغنية تأتينا بعد الظهر، عليها بُرد وثوب مصبوغ بالزعفران. قال الزَّوْزَنِيّ: «نداماي أحرار كرام تتلألأ ألوانهم وتشرق وجوههم، ومغنية تأتينا رواحًا لابسة بردًا أو ثوبًا مصبوغًا بالزعفران» [@zawzani، ص105]."
vocabulary:
  - term: "نَدَامَايَ"
    text: "أصحابي على الشراب. قال أبو عُبَيْدة: «يقال فلان نديم فلان، إذا شاربه». وقال أبو جعفر: «إنما سمي النديم نديماً لندامة جذيمة حين قتل نديميه مالكا وعقيلا»، «فوجد عليهما فقتلهما وندم، فسمى كل مشارب نديما» [@ibn-al-anbari، ص188]. وجَذيمة ملك عربي قديم، ووجد عليهما: غضب."
  - term: "بِيضٌ"
    text: "جمع أبيض. وللبياض في المدح عند الزَّوْزَنِيّ وجوه: أنهم «أحرار ولدتهم حرائر»، أو «لإشراق ألوانهم»، أو «لنقائهم من العيوب»، أو «لاشتهارهم، لأن الفَرَس الأغر مشهور فيما بين الخيل» [@zawzani، ص105]. والأغرّ: الذي في جبهته بياض."
  - term: "قَيْنَةٌ"
    text: "عند ابن الأَنْبارِيّ: «الأمة مغنية كانت أو غير مغنية» [@ibn-al-anbari، ص188]. وعند الزَّوْزَنِيّ: «الجارية المغنية، والجمع القينات والقيان» [@zawzani، ص105]."
  - term: "تَرُوحُ"
    text: "تأتي في الرَّواح، وهو «ما بين زوال الشمس إلى الليل من الوقت» [@zawzani، ص105، الحاشية]."
  - term: "مُجْسَدِ"
    text: "«الثوب المصبوغ بالزعفران حتى يكاد يقوم قياما. والجساد: الزعفران». وقال يعقوب: «المُجسد: الثوب الذي يلي الجسد، وهو الشعار» [@ibn-al-anbari، ص189]."
syntax:
  - "«والندامى يرتفعون ببيض» [@ibn-al-anbari، ص189]، على مذهب الكوفيين في ترافع المبتدأ والخبر: كل منهما يرفع الآخر. وعند البصريين «ندامايَ» مبتدأ و«بيض» خبره."
  - "«والكاف مرفوعة على النعت لبيض» [@ibn-al-anbari، ص189]: الكاف اسم بمعنى «مثل»، أي بيض مثل النجوم."
  - "«والقينة ترتفع بإضمار: ولنا قينة» [@ibn-al-anbari، ص189]، أي مبتدأ خبره محذوف. «وتروح صلة القينة»، أي صفة لها، و«بين برد ومجسد» حال: «معناه: وعليها برد ومجسد» [@ibn-al-anbari، ص189]."
morphology:
  - "«بِيض» جمع «أبيض»، «وهو فعل مثل أحمر وحمر» [@ibn-al-anbari، ص188]؛ وأصله «بُيْض» بضم الباء، فكُسرت لتسلم الياء."
  - "«نَدامى» جمع «نَدْمان» على «فَعالى»، «وجمع النديم ندام وندماء» [@zawzani، ص105]."
  - "«قَيْنة» من أصل «القَين»: «والقين: كل عامل بحديد» [@ibn-al-anbari، ص189]. و«مُجْسَد» اسم مفعول من «أجسد»، ويقال «مِجْسَد» بكسر الميم [@ibn-al-anbari، ص189] [@zawzani، ص105]."
rhetoric:
  thesis: "مجلس الشراب في بيت واحد: الرفاق مضيئون كالنجوم، والمغنية تدخل عليهم في ثيابها الملونة."
  devices:
    - title: "التشبيه بالنجوم"
      text: "قال ابن الأَنْبارِيّ: «(كالنجوم) أي هم أعلام» [@ibn-al-anbari، ص188]، أي مشهورون يُعرفون كما تُعرف النجوم. فالشبه ليس في الشكل، بل في الشهرة والرفعة. وهذا عند عبد القاهر الجُرْجانيّ من التشبيه الذي «لا يتمّ لك إلا بتأوّل» [@asrar، ص92]، أي بإعمال الفكر."
    - title: "الكناية"
      text: "البياض في مدح العرب لا يعني اللون وحده. فالزَّوْزَنِيّ يقول إنه وصفهم بالبياض «تلويحًا إلى أنهم أحرار ولدتهم حرائر» [@zawzani، ص105]، والتلويح: الإشارة من بعيد. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "مشهد ملوّن"
      text: "البياض والنجوم في الصدر، والبُرد والثوب المصبوغ بالزعفران في العجز. فالمجلس صورة ملونة: ضوء الوجوه، وصفرة الزعفران."
  connection: "ثم يصف القينة: واسعة الجيب، رفيقة بلمس الندامى، ناعمة البدن."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "نَدَامَا / يَ بِيضُنْ كَنْ / نُجُومِ / وَقَيْنَتُنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — تَرُوحُ / إِلَيْنَا بَيْ / نَ بُرْدِنْ / وَمُجْسَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "يبدأ صورة المجلس (48–50): الندامى والقينة. يقول شوقي ضيف بعد أن عدّد القيان في شعر الجاهليين: «ولطرفة في معلقته وصف طويل لإحدى هؤلاء القيان. ولعل في ذلك كله ما يدل على أن الغناء في الجاهلية تأثر بعناصر أجنبية كثيرة» [@deif، ج1 ص192]. وقبل ذلك يذكر أنهم «كانوا كذلك في الحيرة يستمعون إلى القيان وهن يضربن على الآلات الموسيقية الفارسية. وأدخلوا كثيرا من هؤلاء القيان إلى جزيرتهم» [@deif، ج1 ص191]. والحيرة عاصمة المناذرة، وقد نادم طَرَفَة ملكها عمرو بن هند [@ibn-qutayba، ج1 ص185]."
