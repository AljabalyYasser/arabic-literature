first: "إِذَا الْقَوْمُ قَالُوا مَنْ فَتًى خِلْتُ أَنَّنِي"
second: "عُنِيتُ فَلَمْ أَكْسَلْ وَلَمْ أَتَبَلَّدِ"
meaning: "إذا نادى القوم: من فتى لهذا الأمر الشديد؟ ظننت أنني المقصود بالنداء، فلم أتكاسل ولم أتردد. قال الزَّوْزَنِيّ: «إذا القوم قالوا من فتى يكفي مهمًّا أو يدفع شرًّا؟ خلت أنني المراد بقولهم فلم أكسل في كفاية المهم ودفع الشر ولم أتبلد فيهما» [@zawzani، ص103]."
vocabulary:
  - term: "فَتًى"
    text: "الشاب صاحب النجدة، يُنادى للأمر العظيم."
  - term: "خِلْتُ"
    text: "ظننت. «معناه: إذا قالوا: من فتى لأمر عظيم ظننتني عنيت بذلك الأمر» [@ibn-al-anbari، ص183]."
  - term: "عُنِيتُ"
    text: "قُصدت وأُريدت، «من قولهم: عنى يعني عنيًا بمعنى أراد... ومنه المعنى وهو المراد، والجمع المعاني» [@zawzani، ص103]."
  - term: "أَكْسَلْ"
    text: "أتثاقل عن الأمر."
  - term: "أَتَبَلَّدِ"
    text: "أتحيّر فلا أمضي. «فلم أكسل في كفاية المهم ودفع الشر ولم أتبلد فيهما» [@zawzani، ص103]."
syntax:
  - "«إِذَا» ظرف لما يُستقبل من الزمان، «فيه طرف من الجزاء» [@ibn-al-anbari، ص183]، أي معنى الشرط، وجوابه «خلت»."
  - "«مَنْ» اسم استفهام، و«فتى» خبره أو مبتدأ عنه؛ وعلى مذهب الكوفيين في ترافع المبتدأ والخبر: «وموضع من رفع بفتى، وفتى مرفوع بمن» [@ibn-al-anbari، ص183]."
  - "«أنّ» وما بعدها سدّت مسدّ مفعولي «خلت»: «وأن كافية من اسم خلت وخبره» [@ibn-al-anbari، ص183]. و«عُنِيتُ» خبر «أنّ»."
morphology:
  - "«خِلْتُ» من «خال يخال» بمعنى ظنّ، بكسر الخاء."
  - "«عُنِيتُ» ماضٍ مبني للمجهول من «عنى» بمعنى أراد، ومن هذا الأصل كلمة «المعنى» [@zawzani، ص103]."
  - "«أتبلّد» على «أتفعّل» من «البلادة»."
rhetoric:
  thesis: "لا يقول «أنا شجاع»، بل يروي ما يحدث في نفسه حين يسمع النداء: يظن أنه المقصود قبل أن يُسمّى."
  devices:
    - title: "الكناية"
      text: "«خلت أنني عُنيت» كناية عن سرعة استجابته وثقته بنفسه: كل نداء إلى الشدة يظنه موجهًا إليه. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "نفيان متتابعان"
      text: "«فلم أكسل ولم أتبلد»: نفى عن نفسه الكسل، وهو ثقل الجسد، والتبلد، وهو حيرة الرأي. فالاستجابة عنده بالبدن والعقل معًا."
  connection: "ثم يسوق ناقته في الهاجرة (42–43)، ويبدأ الفخر بمجالسه وكرمه (44–47)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِذَلْ قَوْ / مُ قَالُو مَنْ / فَتَنْ خِلْ / تُ أَنْنَنِي = فعولن / مفاعيلن / فعولن / مفاعلن — عُنِيتُ / فَلَمْ أَكْسَلْ / وَلَمْ أَ / تَبَلْلَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "أول الفخر بعد الناقة. وللبيت قراءتان: فالنداء عند ابن الأَنْبارِيّ «لأمر عظيم»، وعند أبي جعفر: «إذا قالوا: من فتى يحدو بنا لننجو» [@ibn-al-anbari، ص183]، أي يسوق الإبل بالغناء في الفلاة. وعلى القراءة الثانية يتصل البيت بما قبله: الصاحب الخائف ينادي، والشاعر يجيب."
