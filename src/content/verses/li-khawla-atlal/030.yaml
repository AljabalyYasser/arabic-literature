first: "وَوَجْهٌ كَقِرْطَاسِ الشَّآمِي وَمِشْفَرٌ"
second: "كَسِبْتِ الْيَمَانِي قَدُّهُ لَمْ يُحَرَّدِ"
meaning: "ولها وجه أبيض أملس كالقرطاس الذي يأتي من الشام، ومشفر لين طويل كنعل من جلد مدبوغ باليمن، قُطع قطعًا مستويًا لم يعوجّ. قال الزَّوْزَنِيّ: «شبه خدها في الانملاس بالقرطاس ومشفرها بالسبت في اللين واستقامة القطع» [@zawzani، ص100]."
vocabulary:
  - term: "قِرْطَاسِ"
    text: "الصحيفة يُكتب فيها. قال الطُّوسِيّ والتَّوَّزِيّ: «شبه بياض خدها ببياض القرطاس». وقال أحمد بن عبيد: «جعله كالقرطاس في نقائه وقصر شعرته» [@ibn-al-anbari، ص174]."
  - term: "الشَّآمِي"
    text: "المنسوب إلى الشام. «يقال: رجل شآم، إذا كان من أهل الشأم ويمان، إذا كان من أهل اليمن» [@ibn-al-anbari، ص174]. وأراد «كقرطاس الرجل الشآمي، فحذف الموصوف» [@zawzani، ص100]."
  - term: "مِشْفَرٌ"
    text: "«المشفر للبعير: بمنزلة الشفة للإنسان» [@zawzani، ص100]."
  - term: "سِبْتِ"
    text: "«والسبت: جلود البقر إذا دبغت بالقرظ، فإن لم تدبغ بالقرظ فليس بسبت. فأراد أن مشافرها طوال كأنها نعال السبت، وذلك مما يمدح به. خص السبت للينه» [@ibn-al-anbari، ص174]. و«القرظ: ورق السلم يدبغ به» [@zawzani، ص100، حاشية المحقق]."
  - term: "قَدُّهُ"
    text: "قطعه وهيئته. «والقد: مصدر قددته أقده قدا» [@ibn-al-anbari، ص174]. وفسّر غيره «قده لم يحرد» بأن «مثاله لم يعوج، هو مستو» [@ibn-al-anbari، ص174]."
  - term: "يُحَرَّدِ"
    text: "«والتحريد: أن يجعل بعض السير عريضا وبعضه دقيقا إذا قد» [@ibn-al-anbari، ص174]. و«التحريد: اضطراب القطع وتفاوته» [@zawzani، ص100]."
syntax:
  - "«والوجه معطوف على ما تقدم قبله. والكاف مرفوعة على النعت له» [@ibn-al-anbari، ص174]: «وجه» معطوف على «أتلع» و«جمجمة»، و«كقرطاس» صفة له."
  - "«والمشفر نسق على الوجه» [@ibn-al-anbari، ص174]، و«كسبت» صفة للمشفر."
  - "«والقد يرتفع بما عاد من يحرد» [@ibn-al-anbari، ص174]: «قدّه» مبتدأ، وخبره جملة «لم يحرّد» بما فيها من ضمير يعود عليه. والجملة كلها صفة أخرى للمشفر."
morphology:
  - "«الشآمي» و«اليماني» منسوبان. ويقال في النسبة إليهما أيضًا «شآمٍ» و«يمانٍ» [@ibn-al-anbari، ص174]، فتكون الألف عوضًا من إحدى ياءي النسب."
  - "«مِشْفَر» من الألفاظ التي خصّت بها العرب عضوًا واحدًا باسم مختلف بحسب الحيوان. قال عبد القاهر الجُرْجانيّ: «كوضعهم للعضو الواحد أساميَ كثيرةً بحسب اختلاف أجناس الحيوان، نحوَ وضع الشفة للإنسان والمشْفَر للبعير والجحفلة للفرس» [@asrar، ص30]."
  - "«يُحرَّد» مضارع مبني للمجهول من «حرّد» على «فعّل»."
rhetoric:
  thesis: "الوجه والمشفر من بضائع القوافل: قرطاس من الشام، ونعل من اليمن. كأن التمثال يُصنع من أنفس ما تحمله التجارة."
  devices:
    - title: "في التمثال: الوجه والمشفر"
      text: "بعد الجمجمة يصل إلى الوجه والشفة. والصفة في الوجه البياض والنقاء وقصر الشعر، «والشعر في الخد هجنه» [@ibn-al-anbari، ص174]، أي عيب. والصفة في المشفر الطول واللين واستواء القطع. وعند أحمد بن عبيد أن استواء المشفر علامة الشباب: «يصف إنها شابة فتية؛ وذلك أن الهرمة والهرم تميل مشافرهما» [@ibn-al-anbari، ص174]."
    - title: "تشبيهان متوازيان"
      text: "في البيت تشبيهان على نسق واحد: عضو، ثم كاف، ثم سلعة منسوبة إلى بلد: «كقرطاس الشآمي» و«كسبت اليماني». والتشبيه بالقرطاس للملاسة والبياض، وبالسبت للّين واستواء القطع [@zawzani، ص100]."
    - title: "صدى الحبيبة"
      text: "في رواية ابن الأَنْبارِيّ «ووجه»، وهي الكلمة التي بدأ بها صفة وجه الحبيبة في البيت 10: «ووجه كأن الشمس حلّت رداءها». وفي البيتين وجه نقي أبيض؛ فعلى هذه الرواية تأخذ الناقة صفة من صفات الحبيبة. لكن الطُّوسِيّ والتَّوَّزِيّ وأحمد بن عبيد رووا «وخدّ»، وقال أحمد: «ووجه خطأ في هذا البيت الذي رواه» [@ibn-al-anbari، ص174]."
  connection: "ثم يصف عينيها: كأنهما مرآتان في كهفين من صخر."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَوَجْهُنْ / كَقِرْطَاسِشْ / شَءَامِي / وَمِشْفَرُنْ = فعولن / مفاعيلن / فعولن / مفاعلن — كَسِبْتِلْ / يَمَانِي قَدْ / دُهُو لَمْ / يُحَرْرَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "من أبيات الرأس (28–35). وفيه اسما بلدين من بلاد التجارة: الشام واليمن. وفسّر الطُّوسِيّ نسبة القرطاس إلى الشام بقوله: «إنما قال الشآمي لأن الشام نحو مصر» [@ibn-al-anbari، ص174]، أي أن القرطاس يُصنع بمصر ويصل إلى العرب من ناحية الشام."
