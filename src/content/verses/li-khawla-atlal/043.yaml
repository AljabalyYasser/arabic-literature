first: "فَذَالَتْ كَمَا ذَالَتْ وَلِيدَةُ مَجْلِسٍ"
second: "تُرِي رَبَّهَا أَذْيَالَ سَحْلٍ مُمَدَّدِ"
meaning: "فتبخترت الناقة في مشيها كما تتبختر جارية في مجلس، تُري سيدها أذيال ثوبها الأبيض الطويل. قال ابن الأَنْبارِيّ: «يقول طرفة: تتبختر هذه الناقة كما تتبختر وليدة عرضت على أهل مجلس فأرخت ثوبها واهتزت بأعطافها» [@ibn-al-anbari، ص185]. والأعطاف: الجوانب."
vocabulary:
  - term: "ذَالَتْ"
    text: "«ماست في مشيتها وتبخترت». وقال يعقوب بن السِّكِّيت: «يقال: راست، وماست، وماحت، وذالت، وفادت، بمعنى واحد» [@ibn-al-anbari، ص185]."
  - term: "وَلِيدَةُ"
    text: "«الصبية والجارية، وهي في البيت بمعنى الجارية» [@zawzani، ص104]."
  - term: "رَبَّهَا"
    text: "«(الرب): المالك في هذا الموضع» [@ibn-al-anbari، ص186]، أي سيد الجارية."
  - term: "سَحْلٍ"
    text: "زعم الأَصْمَعِيّ وأبو عُبَيْدة «أن السحل الثوب الأبيض، والجمع سحول». وقال الطُّوسِيّ: «السحل الثوب الذي لم ينسج، هو ممدود في النول» [@ibn-al-anbari، ص185]. والنَّوْل: أداة النسج."
  - term: "مُمَدَّدِ"
    text: "الطويل الممدود. وفي شرح الزَّوْزَنِيّ: «فتريه ذيل ثوبها الأبيض الطويل في رقصها» [@zawzani، ص104]."
syntax:
  - "«كما ذالت»: الكاف في موضع نصب، و«ما» مصدرية، والتقدير: ذالت ذَيْلًا مثل ذَيْل الوليدة. وعبارة ابن الأَنْبارِيّ: «وموضع الكاف نصب»، «والوليدة رفع بفعلها» [@ibn-al-anbari، ص186]، أي فاعل «ذالت» الثانية."
  - "«وترى ربها صلة الوليدة، والأذيال نصب بترى» [@ibn-al-anbari، ص186]. و«الصلة» في عبارته هنا الصفة: جملة «تُري ربها» صفة لـ«وليدة». و«تُري» تنصب مفعولين: «ربَّها» و«أذيالَ»."
  - "«مُمَدَّدِ» نعت لـ«سحل» مجرور مثله."
morphology:
  - "«ذال يذيل» أجوف يائي، مثل «ماس يميس» [@ibn-al-anbari، ص185]. ومن أصله «الذَّيْل»: «الذيل: التبختر، والفعل ذال يذيل» [@zawzani، ص104]. فالفعل «ذالت» والاسم «أذيال» في البيت من مادة واحدة."
  - "«تُرِي» مضارع «أرى» على «أفعل» من الرؤية، حُذفت همزته في الاستعمال، وأصله «تُرْئي»."
  - "«مُمَدَّد» اسم مفعول من «مدّد» على «فعّل»، والتضعيف للتكثير: ثوب مُدّ طويلًا. و«أذيال» جمع «ذَيْل» على «أفعال»."
rhetoric:
  thesis: "يختم قسم الناقة بصورة من المجلس: الناقة المسرعة في الهاجرة تتبختر كجارية تعرض ثوبها، وذنبها الطويل ذيل ذلك الثوب."
  devices:
    - title: "تشبيه الحركة"
      text: "المشبه به حركة لا شكل: مشية فيها تمايل واهتزاز. وعبد القاهر الجُرْجانيّ يجعل هذا من التشبيه الظاهر الذي لا يحتاج إلى تأويل، قال: «ويدخل في الهيئة حالُ الحركات في أجسامها» [@asrar، ص90]."
    - title: "الذنب ذيل الثوب"
      text: "لم يذكر الذنب، وإنما ذكر الذيل. قال ابن الأَنْبارِيّ: «وإنما قصد طرفة إلى سبوغ ذنب ناقته وطولها» [@ibn-al-anbari، ص185]، والسبوغ: الطول والتمام. وقال الزَّوْزَنِيّ: «شبّه تبخترها في السير بتبختر الجارية في الرقص وشبّه طول ذنبها بطول ذيلها» [@zawzani، ص104]. فهما تشبيهان في صورة واحدة."
    - title: "الجناس"
      text: "بين «ذالت» و«أذيال» جناس اشتقاق، أي لفظان من أصل واحد. والجناس أن يتفق اللفظان في الحروف ويختلفا في المعنى. فالفعل التبختر، والاسم طرف الثوب [@zawzani، ص104]، فكأن التبختر نفسه جرّ الأذيال."
  connection: "ثم يبدأ الفخر بنفسه مقيمًا في قومه: لا يختبئ في التلاع، ويعين القوم إذا استعانوا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَذَالَتْ / كَمَا ذَالَتْ / وَلِيدَ / ةُ مَجْلِسِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — تُرِي رَبْ / بَهَا أَذْيَا / لَ سَحْلِنْ / مُمَدْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]."
context: "آخر أبيات الناقة، وبعده ينتقل إلى الفخر. والشارحان يختلفان في الوليدة قليلًا: هي عند ابن الأَنْبارِيّ «عرضت على أهل مجلس» [@ibn-al-anbari، ص185]، وعند الزَّوْزَنِيّ «جارية ترقص بين يدي سيدها» [@zawzani، ص104]. وهذا الوصف المسهب للناقة من عادة الشعراء بعد الغزل، كما يقول شوقي ضيف: «إذ يخرج الشعراء إلى وصف رحلاتهم في الصحراء، فيتحدثون عن قطعهم للمفاوز البعيدة، فوق إبلهم، ويأخذون في وصفها وصفا مسهبا على نحو ما هو معروف عن طرفة في وصفه لناقته بمعلقته» [@deif، ج1 ص214]. والمفاوز: الصحارى المهلكة."
