first: "وَقَالَ ذَرُوهُ إِنَّمَا نَفْعُهَا لَهُ"
second: "وَإِلَّا تَرُدُّوا قَاصِيَ الْبَرْكِ يَزْدَدِ"
meaning: "ثم قال: دعوه، فإنما نفعها له، وإن لم تردّوا ما تباعد من الإبل زاد في عقرها. قال الزَّوْزَنِيّ: «أراد أنه أمرهم بردّ ما نَدَّ لئلا أعقر غير ما عقرت» [@zawzani، ص117]. وندّ: نفر وشرد."
vocabulary:
  - term: "ذَرُوهُ"
    text: "«دعوه» [@zawzani، ص117]."
  - term: "نَفْعُهَا لَهُ"
    text: "عند الزَّوْزَنِيّ على لسان الشيخ: «إنما نفع هذه الناقة له... لأنه ولدي الذي يرثني» [@zawzani، ص117]. وعند البَغْداديّ: «ذروا طرفة فإن نفعها للشيخ فإن طرفة يخلف عليه ويزيده» [@khizana، ج3 ص156]. ويُخلف عليه: يعوّضه."
  - term: "قَاصِيَ الْبَرْكِ"
    text: "«ما تقصى منها وتنحى» [@ibn-al-anbari، ص221]، أي ما ابتعد من الإبل."
  - term: "يَزْدَدِ"
    text: "«معناه يزد في عقرها» [@ibn-al-anbari، ص221]."
syntax:
  - "«وإنما حرف واحد، والنفع مرتفع باللام» [@ibn-al-anbari، ص221]. أي «إنما» كلمة واحدة، لا «إنّ» و«ما». و«مرتفع باللام» على مذهب الكوفيين؛ وعند البصريين «نفعُها» مبتدأ و«له» خبره."
  - "«وتردوا جزم بإلا، ويزدد جواب الجزاء» [@ibn-al-anbari، ص221]. و«إلّا» هنا «إنْ» الشرطية أُدغمت في «لا» النافية، و«الجزاء» عند ابن الأَنْبارِيّ الشرط."
  - "فاعل «يزدد» على قول ابن الأَنْبارِيّ طَرَفَة: يزد في العقر [@ibn-al-anbari، ص221]. وعلى قول أبي جعفر هو «قاصي البرك»: «وإلا تردوه يذهب نفارا» [@ibn-al-anbari، ص221]."
morphology:
  - "«يزدد» وزنه عند ابن الأَنْبارِيّ «يفتعل»، وأصله «يزتيد»: أُبدلت التاء دالًا «لأنها أشبه بالزاي»، ثم جُزم الفعل فحُذفت الألف المنقلبة عن الياء، «وكسرت الدال الثانية للقافية» [@ibn-al-anbari، ص221]."
  - "«ذَرْ» و«دَعْ» «الماضي منهما غير مستعمل عند جمهور الأئمة اجتزاء بـ\"ترك\"» [@zawzani، ص117]، أي استغناءً به."
  - "«قاصي» اسم فاعل «من قصا يقصو قصوّاً: إذا بعد» [@khizana، ج3 ص156]."
rhetoric:
  thesis: "نهاية الغضب: يُترك طَرَفَة، ويلتفت القوم إلى ما بقي من الإبل."
  devices:
    - title: "القصر"
      text: "القصر تخصيص شيء بشيء، و«إنما» من أدواته. «إنما نفعها له»: لا نفع في الناقة إلا له، فلا فائدة في الخصومة."
    - title: "الضمير المحتمل"
      text: "«له» ضمير يحتمل طَرَفَة ويحتمل الشيخ، ومن هنا اختلف الشراح: هو عند الزَّوْزَنِيّ طَرَفَة [@zawzani، ص117]، وعند البَغْداديّ الشيخ [@khizana، ج3 ص156]."
    - title: "الشرط تحذيرًا"
      text: "«وإلا تردّوا... يزدد»: شرط يحمل أمرًا عمليًّا. فآخر كلمة في الحوار ليست لومًا، بل خوف على بقية الإبل من هذا الكريم."
  connection: "ثم يختم القصة بالوليمة: الإماء يشوين الجنين، والخدم يطوفون بالسنام."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَقَالَ / ذَرُوهُ إِنْ / نَمَا نَفْ / عُهَا لَهُو = فعولُ / مفاعلن / فعولن / مفاعلن — وَإِلْلَا / تَرُدْدُو قَا / صِيَلْ بَرْ / كِ يَزْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "من المتكلم؟ في رواية ابن الأَنْبارِيّ والزَّوْزَنِيّ «وقال»، فهو الشيخ يختم كلامه؛ ويقول الزَّوْزَنِيّ: «ثم استقر رأي الشيخ على أنه قال دعوا طرفة» [@zawzani، ص117]. أما البَغْداديّ فيشرحه «فقالوا: ذروه»، فالحاضرون هم الذين يجيبون الشيخ عن سؤاله في البيت السابق [@khizana، ج3 ص156]. وقال أبو جعفر: «معنى البيت: ذروه لا تلتفتوا إليه، واطلبوا قاصي البرك لا يذهب على وجهه» [@ibn-al-anbari، ص221]."
variants:
  - reading: "فَقَالُوا ذَرُوهُ إِنَّمَا نَفْعُهَا لَهُ"
    status: "رواية البَغْداديّ"
    note: "وعليها يكون المتكلم الحاضرين لا الشيخ، و«له» للشيخ [@khizana، ج3 ص156]."
  - reading: "فَقَالَ ذَرُوهَا إِنَّمَا نَفْعُهَا لَهُ"
    status: "رواية التَّوَّزِيّ والطُّوسِيّ"
    note: "[@ibn-al-anbari، ص221]. وأنشده المَرْزُوقِيّ «فقال ذروه» [@marzuqi-hamasa، ص893]."
  - reading: "وَإِلَّا تَكُفُّوا قَاصِيَ الْبَرْكِ يَزْدَدِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«الكفّ: المنع والامتناع» [@zawzani، ص117]. وبها أنشده المَرْزُوقِيّ [@marzuqi-hamasa، ص893]."
  - reading: "تَزْدَدِ"
    status: "رواية أخرى"
    note: "«أي تزد في نفارها وتذهب» [@ibn-al-anbari، ص221]."
