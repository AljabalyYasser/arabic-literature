first: "وَإِنْ شِئْتُ سَامَى وَاسِطَ الْكُورِ رَأْسُهَا"
second: "وَعَامَتْ بِضَبْعَيْهَا نَجَاءَ الْخَفَيْدَدِ"
meaning: "إن شئتُ رفعت رأسها حتى يوازي مقدّم الرحل، وأسرعت كأنها تسبح بعضديها، سرعةَ ذكر النعام. قال الزَّوْزَنِيّ: «إن شئت جعلت رأسها موازيًا لواسط رحلها في العلو من فرط نشاطها وجذبي زمامها إلَيّ، وأسرعت في سيرها حتى كأنها تسبح بعضديها إسراعًا مثل إسراع الظليم» [@zawzani، ص103]."
vocabulary:
  - term: "سَامَى"
    text: "«(سامى): عالي» [@ibn-al-anbari، ص179]. و«المساماة: المباراة في السمو وهو العلو» [@zawzani، ص103]."
  - term: "وَاسِطَ الْكُورِ"
    text: "«العود الذي بين موركة الرحل ومؤخرته. والكور: الرحل» [@ibn-al-anbari، ص180]. وموركة الرحل: الموضع الذي يضع عليه الراكب رجليه. وقال أحمد بن عبيد: «الواسط للرحل كالقربوس للسرج» [@ibn-al-anbari، ص180]، والقَرَبوس: مقدّم السرج."
  - term: "عَامَتْ"
    text: "«العوم: السباحة» [@zawzani، ص103]."
  - term: "ضَبْعَيْهَا"
    text: "«عضداها» [@ibn-al-anbari، ص180]."
  - term: "نَجَاءَ"
    text: "«السرعة» [@ibn-al-anbari، ص180]."
  - term: "الْخَفَيْدَدِ"
    text: "«الظليم. والظليم: ذكر النعام» [@ibn-al-anbari، ص180]."
syntax:
  - "«وشئت فعل ماض لو كان المستقبل في موضعه لكان مجزوما بإن. وسامى جواب الجزاء» [@ibn-al-anbari، ص180]. والجزاء في عبارة القدماء: الشرط وجوابه."
  - "«وعامت نسق عليه. ونجاء الخفيدد، منصوب على المصدر» [@ibn-al-anbari، ص180]، أي مفعول مطلق: عامت عومًا مثل نجاء الخفيدد."
  - "مفعول «شئت» محذوف، والتقدير: وإن شئت أن يسامي رأسُها واسطَ الكور سامى. وهو الحذف الذي وقف عنده عبد القاهر الجُرْجانيّ في البيت التالي، وجعله مما «يُعْلَمُ أَنْ ليس فيه لغيرِ الحذْفِ وجه» [@dalail، ص166]."
morphology:
  - "«سامى» على «فاعَل» من السموّ، وهو بناء المغالبة: «المساماة: المباراة في السمو» [@zawzani، ص103]. فالرأس يباري الرحل في الارتفاع."
  - "«الكور» جمعه «أكوار وكيران» [@ibn-al-anbari، ص180]."
  - "«عامت» من «عام يعوم عومًا» [@zawzani، ص103]. و«نَجاء» مصدر بمعنى السرعة."
rhetoric:
  thesis: "التمثال يتحرك بإرادة الراكب: رأس يرتفع، وعضدان تسبحان في الصحراء."
  devices:
    - title: "في التمثال: الحركة بالمشيئة"
      text: "بعد أن صنع التمثال عضوًا عضوًا يحرّكه الشاعر: «وإن شئت». فالرأس الذي وصفه (29–34) يرتفع حتى يساوي الرحل، والعضدان اللتان وصفهما (24) تسبحان. يقول شوقي ضيف إن طَرَفَة يصف ناقته «وهى سائرة به فى طريق إلى غاية تصبو إليها نفسه» [@deif، ج1 ص223]."
    - title: "الاستعارة"
      text: "في «عامت» استعارة: جعل سير الناقة سباحة. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. فالصحراء صارت ماء، والعضدان مجدافين. وهذا يلتقي بصورة البحر في البيت 28."
    - title: "الحذف"
      text: "حذف مفعول «شئت». والحذف عند عبد القاهر الجُرْجانيّ باب «شبيه بالسحر، فإنك ترى به ترك الذكر، أفصح من الذكر، والصمت عن الإفادة، أزيد للإفادة» [@dalail، ص146]. فالمشيئة وحدها تكفي، والناقة تفهم مراد راكبها قبل أن يقوله."
  connection: "ثم يكرر المشيئة: «وإن شئت لم ترقل وإن شئت أرقلت»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِنْ شِئْ / تُ سَامَى وَا / سِطَلْ كُو / رِ رَأْسُهَا = فعولن / مفاعيلن / فعولن / مفاعلن — وَعَامَتْ / بِضَبْعَيْهَا / نَجَاءَلْ / خَفَيْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "البيت الأول من بيتي المشيئة (36–37). وترتيبهما في رواية الزَّوْزَنِيّ معكوس: «وإن شئت لم ترقل» أولًا ثم «وإن شئت سامى»، وكلاهما عنده بعد بيت الأنف [@zawzani، ص102]. أما ابن الأَنْبارِيّ فيؤخر بيت الأنف إلى ما بعدهما [@ibn-al-anbari، ص180]."
variants:
