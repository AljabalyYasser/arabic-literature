first: "وَظُلْمُ ذَوِي الْقُرْبَى أَشَدُّ مَضَاضَةً"
second: "عَلَى الْمَرْءِ مِنْ وَقْعِ الْحُسَامِ الْمُهَنَّدِ"
meaning: "وظلم الأقارب أشد إيلامًا للمرء من ضربة السيف القاطع. قال الزَّوْزَنِيّ: «ظلم الأقارب أشد تأثيرًا في تهييج نار الحزن والغضب من وقع السيف القاطع المحدد أو المطبوع بالهند» [@zawzani، ص113]."
vocabulary:
  - term: "ذَوِي الْقُرْبَى"
    text: "أصحاب القرابة، أي الأقارب."
  - term: "مَضَاضَةً"
    text: "ألمًا وحرقة. «مضّني الأمر وأمضّني: بلغ من قلبي وأثّر في نفسي» [@zawzani، ص113]."
  - term: "الْحُسَامِ"
    text: "«القاطع» [@ibn-al-anbari، ص209]، «فعال من الحسم وهو القطع» [@zawzani، ص113]."
  - term: "الْمُهَنَّدِ"
    text: "السيف «المنسوب إلى الهند» [@ibn-al-anbari، ص209]."
syntax:
  - "«والظلم يرتفع بأشد» على مذهب الكوفيين [@ibn-al-anbari، ص209]؛ وعند البصريين «ظلم» مبتدأ و«أشد» خبره."
  - "«والمضاضة منصوبة على التفسير» [@ibn-al-anbari، ص209]، أي تمييز. و«على المرء» و«من وقع» متعلقان بـ«أشد»."
morphology:
  - "«أشدّ» اسم تفضيل على «أفعل»."
  - "«مَضاضة» مصدر «مضّ» على «فَعالة»."
  - "«المُهنَّد» اسم مفعول من «هنّد» على «فعّل»، أي صُنع في الهند."
  - "«الظُّلم» بالضم الاسم، و«الظَّلْم» بالفتح المصدر، وأصله «وضع الشيء في غير موضعه» [@ibn-al-anbari، ص209]."
rhetoric:
  thesis: "بيت صار مثلًا يُتمثل به: الجرح الذي يأتي من القريب أعمق من جرح السيف."
  devices:
    - title: "التفضيل"
      text: "لم يقل إن ظلم الأقارب شديد، بل قاسه بأشد ما يعرفه العربي من الألم: وقع السيف المهندي. فالمقياس نفسه يرفع المعنى."
    - title: "الإيجاز"
      text: "حكم عام يستغني عن سياقه، ولذلك يُتمثل به في كل ظلم يأتي من قريب."
  connection: "ثم يقول لابن عمه: فذرني وخلقي، فإني شاكر لك."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَظُلْمُ / ذَوِلْ قُرْبَى / أَشَدْدُ / مَضَاضَتَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — عَلَلْ مَرْ / ءِ مِنْ وَقْعِلْ / حُسَامِلْ / مُهَنْنَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]."
context: "أشهر أبيات قسم العتاب، لكن نسبته إلى المعلقة موضع خلاف. قال ابن الأَنْبارِيّ إن الرُّسْتُميّ وغيره رووه في هذا الموضع، ثم قال: «وقال أبو جعفر: ليس هذا البيت من قصيدة طَرَفَة، إنما هو لعدي بن زيد العبادي» [@ibn-al-anbari، ص208–209]. وهو في رواية الزَّوْزَنِيّ [@zawzani، ص113]. فنقرؤه في المعلقة لأنه في النص الذي اعتمدناه، ونذكر أن من الرواة من نسبه إلى غيره."
