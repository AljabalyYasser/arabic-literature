first: "وَقَرَّبْتُ بِالْقُرْبَى وَجَدِّكَ إِنَّهُ"
second: "مَتَى يَكُ أَمْرٌ لِلنَّكِيثَةِ أَشْهَدِ"
meaning: "وتقرّبت إليه بالقرابة التي بيننا، وأقسم بحظك إنه متى وقع أمر يحتاج إلى أقصى الجهد حضرته. قال ابن الأَنْبارِيّ: «يقول: أدللت على مالك بالقربى، أي أدللت على ابن عمي بالقرابة» [@ibn-al-anbari، ص205]. والإدلال: أن تطلب ممن تثق بمودته طلب القريب."
vocabulary:
  - term: "الْقُرْبَى"
    text: "«جمع قربة، وقيل: هو اسم من القرب والقرابة، وهو أصح القولين» [@zawzani، ص112]."
  - term: "وَجَدِّكَ"
    text: "قسم بالحظ: «وجدك مخفوض على القسم، ومعناه الحظ، أي وحظك» [@ibn-al-anbari، ص205]."
  - term: "النَّكِيثَةِ"
    text: "أقصى الجهد. «يقول: متى يجيء أمر نبلغ فيه أقصى المجهود من النفس أشهده. يقال: بلغت نكيثة البعير، إذا جهدته في السير فلم يبق من سيره شيء». وقال الطُّوسِيّ: «النكيثة: شدة النفس» [@ibn-al-anbari، ص205]."
  - term: "أَشْهَدِ"
    text: "أحضر. وعند الزَّوْزَنِيّ: «أحضره وأنصره» [@zawzani، ص112]."
syntax:
  - "«وجدِّك» مجرور بواو القسم [@ibn-al-anbari، ص205]، والقسم معترض بين «قرّبت» و«إنه»."
  - "«ويك موضعه جزم بمتى، والأصل فيه يكن، فذهبت النون لكثرة الاستعمال» [@ibn-al-anbari، ص205]. و«أشهدِ» جواب الشرط مجزوم، وكُسر للقافية."
  - "والهاء في «إنه» ضمير الشأن: «والهاء اسم إن، وجملة الكلام خبر أن، وتقدير الهاء: أن الشأن وأن الأمر» [@ibn-al-anbari، ص205]. وضمير الشأن ضمير لا يعود على اسم قبله، بل تفسّره الجملة التي بعده."
morphology:
  - "«يَكُ» أصله «يكن»، حُذفت النون تخفيفًا، «وشبهت بالياء والواو والألف» [@ibn-al-anbari، ص205]، أي بحروف العلة التي تُحذف في الجزم."
  - "«النَّكيثة» على «فعيلة»، وجمعها «نكائث»، وأنشد ابن الأَنْبارِيّ للراعي: «تُضحي إذا العيس أدركنا نكائثها» [@ibn-al-anbari، ص205]، أي إذا بلغنا بالإبل أقصى جهدها. والعيس: الإبل البيض."
  - "«قرّبت» على «فعّل»، ومفعوله محذوف، أي قرّبت نفسي [@zawzani، ص112]. و«القُربى» على «فُعلى»."
rhetoric:
  thesis: "يذكّر ابن عمه بحقّين: القرابة، ونصرته له في الشدائد. فاللوم الذي يلقاه جزاء لا يستحقه."
  devices:
    - title: "القسم المعترض"
      text: "«وجدِّك» قسم بحظ المخاطب، أي «بحظك وبختك» كما يفسره الزَّوْزَنِيّ [@zawzani، ص112]. وضعه في وسط الكلام، فأكّد به ما بعده قبل أن يقوله."
    - title: "الاستعارة"
      text: "النكيثة في الأصل أقصى ما يطيقه البعير من السير [@ibn-al-anbari، ص205]، فاستعارها للأمر الشديد الذي يبلغ بالرجال أقصى جهدهم. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تُريد تشبيه الشيء بالشيء، فتدع أن تُفصح بالتشبيه وتُظهره، وتجيء إلى اسم المشبه به فتُعيره المشبه وتُجريه عليه» [@dalail، ص67]."
    - title: "الجناس"
      text: "«قرّبت بالقربى»: لفظان من أصل واحد، والقرابة وسيلة القرب. والجناس أن يتفق اللفظان في الحروف ويختلفا في المعنى."
  connection: "ثم يفصّل: إن دُعي إلى الأمر العظيم كان من حماته، وإن أتى الأعداءُ ابنَ عمه اجتهد في دفعهم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَقَرْرَبْ / تُ بِلْقُرْبَى / وَجَدْدِ / كَ إِنْنَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — مَتَى يَ / كُ أَمْرُنْ لِنْ / نَكِيثَ / ةِ أَشْهَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "يبدأ هنا فخرًا داخل العتاب (72–74): يعدّد ما يقدّمه لابن عمه، ليظهر ظلمه له. وقد قرأ الزَّوْزَنِيّ البيت على أن الشاعر يحضر شدائد ابن عمه: «أنه متى حدث له أمر يبلغ فيه غاية الطاقة ويبذل فيه المجهود أحضره وأنصره» [@zawzani، ص112]. وسبب العتاب قصة إبل مَعْبَد، أخي طَرَفَة، يذكرها في البيت 71 [@ibn-al-anbari، ص204]."
variants:
  - reading: "وَقَرَّبْتُ بِالْقُرْبَى وَجَدِّكَ إِنَّنِي"
    status: "رواية أبي جعفر"
    note: "قال أبو جعفر: «الرواية الجيدة: (إنني متى يك أمر)». وإعرابها: «النون والياء اسم إن، وخبر أن ما عاد من أشهد، والتقدير: إنني أشهد متى يك أمر، فلما وقع خبر أن في موضع جواب الجزاء جزم وتأويله الرفع والتقديم» [@ibn-al-anbari، ص205]، أي أن «أشهد» في المعنى خبر «إنّ» مرفوع مقدّم، وجُزم لأنه وقع موقع جواب الشرط. وهي رواية الزَّوْزَنِيّ [@zawzani، ص112] والديوان [@diwan-tarafa، ص27]."
