first: "أَمُونٍ كَأَلْوَاحِ الْإِرَانِ نَسَأْتُهَا"
second: "عَلَى لَاحِبٍ كَأَنَّهُ ظَهْرُ بُرْجُدِ"
meaning: "ناقة موثّقة الخلق يؤمن عثارها، عظامها عريضة كألواح التابوت، سقتها بالعصا على طريق واضح كأنه كساء مخطط. قال الزَّوْزَنِيّ: «ثم شبه عرض عظامها بألواح التابوت، ثم ذكر سوقه إياها بالعصا، ثم شبه الطريق بالكساء المخطط؛ لأن فيه أمثال الخطوط العجيبة» [@zawzani، ص93]."
vocabulary:
  - term: "أَمُونٍ"
    text: "«الناقة الموثقة الخلق التي يؤمن عثارها وزللها» [@ibn-al-anbari، ص151]."
  - term: "الْإِرَانِ"
    text: "قال يعقوب: «تابوت كانوا يجعلون فيه سادتهم وكبراءهم»، شبّه به الناقة في سعة جنبيها [@ibn-al-anbari، ص151]. وعند الزَّوْزَنِيّ: «التابوت العظيم» [@zawzani، ص93]."
  - term: "نَسَأْتُهَا"
    text: "«زجرتها وضربتها بالمنسأة» [@ibn-al-anbari، ص151]، والمنسأة: «العصا العظيمة التي تكون مع الراعي» [@ibn-al-anbari، ص151]."
  - term: "لَاحِبٍ"
    text: "طريق. «واللاحب أيضا: الطريق المؤثر فيه؛ واللاحب: البين» [@ibn-al-anbari، ص152]."
  - term: "بُرْجُدِ"
    text: "«كساء فيه خطوط وطرائق... وهو كساء من أكسية الأعراب» [@ibn-al-anbari، ص152]."
syntax:
  - "«أَمُونٍ» مجرور، «نعت للعوجاء» في البيت السابق، «والكاف نعت للأمون» [@ibn-al-anbari، ص153]."
  - "جملة «نَسَأْتُهَا» صفة أخرى للناقة، و«عَلَى لَاحِبٍ» متعلق بها."
  - "«والهاء اسم كأن، وظهر برجد خبرها، وكأن وما بعدها صلة اللاحب» [@ibn-al-anbari، ص153]، أي صفة له."
morphology:
  - "«أَمُون» على «فَعُول» بمعنى «مفعول»، أي مأمونة، ويستوي فيه المذكر والمؤنث."
  - "«مِنْسَأة» اسم آلة من «نسأ»، «يهمز ولا يهمز» [@ibn-al-anbari، ص151]."
  - "«لاحِب» اسم فاعل من «لَحَب». يقال: «قد لحبه بالسوط، إذا أثر فيه» [@ibn-al-anbari، ص152]؛ فاللاحب طريق أثّرت فيه الأقدام."
rhetoric:
  thesis: "تشبيهان في بيت واحد: عظام الناقة كألواح التابوت، والطريق ككساء مخطط. فالناقة قوية، والطريق طويل تركت فيه القوافل خطوطها."
  devices:
    - title: "التشبيه الأول"
      text: "شبّه «عرض عظامها بألواح التابوت» [@zawzani، ص93]، وهو عند يعقوب تابوت السادة والكبراء [@ibn-al-anbari، ص151]. فالمشبه به عظيم في حجمه وفي منزلته."
    - title: "التشبيه الثاني"
      text: "شبّه الطريق بالبُرْجُد، وهو كساء مخطط، «لأن فيه أمثال الخطوط العجيبة» [@zawzani، ص93]. والخطوط آثار الأقدام والأخفاف في الطريق."
    - title: "ناقة تسير"
      text: "قال شوقي ضيف: «ارجع إلى وصف طَرَفَة لناقته فستجده يصفها وهي سائرة به في طريق إلى غاية تصبو إليها نفسه... وهو يشبه الطريق بكساء مخطط، يجد فيه جمالا» [@deif، ج1 ص223]."
  connection: "ثم يصفها في البيت التالي تباري النوق الكريمة المسرعة، وتُتبع رجلها يدها على طريق مذلّل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَمُونِنْ / كَأَلْوَاحِلْ / إِرَانِ / نَسَأْتُهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — عَلَى لَا / حِبِنْ كَأَنْ / نَهُو ظَهْ / رُ بُرْجُدِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "الحركة عند الجاهليين في وصف الحيوان من حياة الرحيل. يقول شوقي ضيف: «ومن ثم كانوا إذا وصفوا الحيوان وصفوه متحركا لا واقفا جامدا»، ثم يستشهد بهذا البيت [@deif، ج1 ص223]."
variants:
  - reading: "نَصَأْتُهَا"
    status: "رواية أخرى"
    note: "بالصاد، وهما بمعنى واحد عند يعقوب. وقال التَّوَّزِيّ: «فمعنى نصأتها قدمتها، ومعنى نسأتها أخرتها» [@ibn-al-anbari، ص151–152]. وهي رواية الزَّوْزَنِيّ [@zawzani، ص93]."
