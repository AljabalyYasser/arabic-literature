first: "عَدَوْلِيَّةٌ أَوْ مِنْ سَفِينِ ابْنِ يَامِنٍ"
second: "يَجُورُ بِهَا الْمَلَّاحُ طَوْرًا وَيَهْتَدِي"
meaning: "هذه السفن من سفن عَدَوْلَى، أو من سفن ابن يامن، يميل بها الملاح عن القصد مرة، ويمضي بها مستقيمًا مرة. قال الزَّوْزَنِيّ: «وكذلك الحداة، تارة يسوقون هذه الإبل على سمت الطريق، وتارة يميلونها عن الطريق ليختصروا المسافة» [@zawzani، ص90]. والحُداة: الذين يسوقون الإبل ويغنّون لها."
vocabulary:
  - term: "عَدَوْلِيَّةٌ"
    text: "منسوبة إلى عَدَوْلَى. قال أحمد بن عبيد: هي «جزيرة من جزائر البحر يقال لها عدولي في أسفل من أوال، وأوال أسفل من عمان». وقال غيره: هي «منسوبة إلى قوم كانوا ينزلون بهجر» [@ibn-al-anbari، ص137]. وعند الزَّوْزَنِيّ: «عدولي: قبيلة من أهل البحرين» [@zawzani، ص90]."
  - term: "ابْنِ يَامِنٍ"
    text: "«ملاح من أهل هجر» [@ibn-al-anbari، ص137]."
  - term: "يَجُورُ"
    text: "«يعدل بها ويميل» [@ibn-al-anbari، ص137]."
  - term: "طَوْرًا"
    text: "تارة، والجمع أطوار [@zawzani، ص90]."
  - term: "يَهْتَدِي"
    text: "«يمضي للقصد» [@ibn-al-anbari، ص137]."
syntax:
  - "«عَدَوْلِيَّة» تُروى بالرفع والخفض: «فمن خفضها جعلها نعتا للسفين، ومن رفع جعلها نعتا للخلايا» [@ibn-al-anbari، ص137]. وعلى الرفع هي خبر لمبتدأ محذوف: هي عدولية."
  - "«أو» للتنويع: هي من هذه السفن أو من تلك. فالشاعر لا يعنيه أيهما، بل يعنيه عظمها."
  - "«يَجُورُ» جملة مستأنفة، ويجوز أن تكون صفة؛ و«الملاح» فاعلها، و«يهتدي» معطوف على «يجور» [@ibn-al-anbari، ص137]. و«طَوْرًا» ظرف."
morphology:
  - "«عَدَوْلِيّة» منسوبة بياء النسب المشددة، والتاء للتأنيث لأنها صفة للسفن."
  - "«مَلّاح» على «فعّال»، وهو بناء يدل على الحرفة، مثل «نجّار»."
  - "«يَهْتَدِي» على «يفتعل» من «هدى»."
rhetoric:
  thesis: "يزيد التشبيه دقة: هي سفن معروفة بعظمها، وحركتها بين الميل والاستقامة هي حركة الإبل في الطريق."
  devices:
    - title: "تفصيل المشبه به"
      text: "خص سفن هذه القبيلة وهذا الرجل «لعظمها وضخمها» [@zawzani، ص90]."
    - title: "تشبيه الحركة"
      text: "«ثم شبه سوق الإبل تارة على الطريق وتارة على غير الطريق بإجراء الملاح السفينة مرة على سمت الطريق ومرة عادلًا عن ذلك السمت» [@zawzani، ص90]."
    - title: "الطباق"
      text: "الطباق أن تجمع في الكلام بين الشيء وضده. وفي العَجُز «يَجُورُ» و«يَهْتَدِي»: الجَوْر الميل عن القصد، والاهتداء المضيّ إليه."
  connection: "ثم يصف صدر السفينة يشق الماء."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "عَدَوْلِيْ / يَتُنْ أَوْ مِنْ / سَفِينِبْ / نِ يَامِنِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — يَجُورُ / بِهَلْ مَلْلَا / حُ طَوْرَنْ / وَيَهْتَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "البيت الثاني من التشبيه الممتد. وفيه أسماء من ساحل الخليج يعرفها ابن هذه الناحية: عَدَوْلَى، وأَوال، وعُمان، وهَجَر، كما يفسرها ابن الأَنْبارِيّ [@ibn-al-anbari، ص137]."
variants:
