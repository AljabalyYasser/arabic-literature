    status: "رواية أخرى"
    note: "بالخفض نعتًا لـ«سفين». قال أحمد بن عبيد: «الرواية: عدولية، بالخفض» [@ibn-al-anbari، ص137]."
  - reading: "يَجُورُ بِهِ الْمَلَّاحُ طَوْرًا وَيَهْتَدِي"
