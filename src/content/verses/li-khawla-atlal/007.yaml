first: "خَذُولٌ تُرَاعِي رَبْرَبًا بِخَمِيلَةٍ"
second: "تَنَاوَلُ أَطْرَافَ الْبَرِيرِ وَتَرْتَدِي"
meaning: "هي ظبية خذول، تخلّفت عن صواحبها وأقامت على ولدها، ترعى مع قطيع من الوحش في أرض ذات شجر، وتمد عنقها إلى ثمر الأراك فتتدلى عليها الأغصان كأنها رداء. والمراد امرأة. قال ابن الأَنْبارِيّ: «هذا على طريق التشبيه، أراد: وفي الحي امرأة تشبه الغزال في طول عنقها وحسنها، وتشبه البقر في حسن عينيها» [@ibn-al-anbari، ص141]."
vocabulary:
  - term: "خَذُولٌ"
    text: "«التي خذلت صواحبها وأقامت على ولدها، وهي الخاذل» [@ibn-al-anbari، ص141]. وعند الزَّوْزَنِيّ: «أي خذلت أولادها» [@zawzani، ص91]."
  - term: "تُرَاعِي"
    text: "«أي ترعى معه» [@zawzani، ص91]، أي ترعى مع القطيع."
  - term: "رَبْرَبًا"
    text: "«قطيع الظباء والبقر» [@ibn-al-anbari، ص141]، والمراد بالبقر هنا بقر الوحش."
  - term: "خَمِيلَةٍ"
    text: "«أرض سهلة لا حزن فيها، وهي ذات شجر»، والحَزْن: الأرض الغليظة. وقيل: «رملة منبتة، قد صار النبات بمنزلة الخمل للقطيفة» [@ibn-al-anbari، ص141]، أي أن النبت يغطي الرمل كما يغطي الوبرُ القطيفة."
  - term: "الْبَرِيرِ"
    text: "«ثمر الأراك المدرك البالغ، الواحدة بريرة» [@zawzani، ص91]."
  - term: "تَرْتَدِي"
    text: "«الارتداء والتردي: لبس الرداء» [@zawzani، ص91]. وأراد عند ابن الأَنْبارِيّ أنها «تعطو ثمر الأراك فتهدل عليها الأغصان» [@ibn-al-anbari، ص142]، فتصير لها كالرداء. وتعطو: ترفع رأسها لتتناول."
syntax:
  - "«والخذول نعت للأحوى، وتراعي ربربا صلة للخذول، والباء صلة تراعي» [@ibn-al-anbari، ص142]. فـ«خذول» صفة لـ«أحوى» في البيت السابق. و«الصلة» في عبارة ابن الأَنْبارِيّ لها هنا معنيان: جملة «تراعي» صفة لـ«خذول»، و«بخميلة» متعلق بـ«تراعي»."
  - "«تَنَاوَلُ» أصلها «تتناول»، «فاستثقل الجمع بين تاءين فحذف إحداهما». وأجاز الفرّاء حذف أيّتهما شئت، وقال هشام: المحذوفة الأولى، «وقال البصريون: المحذوفة هي الثانية، لأن الأولى علم استقبال لا يسقط» [@ibn-al-anbari، ص143]. وعلم الاستقبال: حرف المضارعة."
  - "«وترتدى موضعه رفع، لأنه نسق على تناول» [@ibn-al-anbari، ص143]. والنسق في اصطلاح الكوفيين: العطف."
morphology:
  - "«خَذُول» على «فَعُول» بمعنى «فاعل»، وهي «الخاذل» [@ibn-al-anbari، ص141]. وبناء «فعول» يستوي فيه المذكر والمؤنث، ولذلك لم تلحقه التاء."
  - "«تَرْتَدِي» على «تفتعل» من الرداء. «ويقال رداء وردية، لكل ما ترديت به» [@ibn-al-anbari، ص142]."
  - "«تَنَاوَل» على «تتفاعل» حُذفت منه إحدى التاءين، كما في قوله تعالى «تَنَزَّلُ الملائكةُ»، «فمعناه تتنزل الملائكة» [@ibn-al-anbari، ص143]."
rhetoric:
  thesis: "الظبية التي بدأ بها في البيت السابق تصير هنا مشهدًا كاملًا: أمٌّ منفردة تمد عنقها إلى الشجر. والمراد كله امرأة."
  devices:
    - title: "تشبيه طُوي فيه المشبَّه"
      text: "لم يذكر المرأة، بل ذكر الظبية وحدها. ولذلك سأل سائل: كيف قال «أحوى» ثم قال «خذول»، «والخذول نعت الأنثى؟» فأجاب ابن الأَنْبارِيّ بأن هذا «على طريق التشبيه»، «كما تقول: هي شمس هي قمر!» [@ibn-al-anbari، ص141]. فالظبية اسم للمرأة، واللفظ يتبع المعنى المقصود."
    - title: "لماذا الخذول؟"
      text: "اختار الظبية التي تخلّفت عن القطيع لسببين عند ابن الأَنْبارِيّ: «لأنها فزعة ولهة على خشفها، فهي تشرئب وتمد عنقها وترتفع وترتاع؛ ولأنها منفردة، وهو أحسن لها، ولو كانت في قطيعها لم يستبن حسنها» [@ibn-al-anbari، ص141]. والخِشْف: ولد الظبية. أما الزَّوْزَنِيّ فيعكس الصورة: هي عنده ظبية «خذلت أولادها وذهبت مع صواحبها» [@zawzani، ص91–92]. لكنهما يتفقان على الغاية: «وإنما خص تلك الحال لمدها عنقها إلى ثمر الشجرة، شبه طول عنق الحبيب وحسنه بذلك» [@zawzani، ص92]."
    - title: "صورة مألوفة بتفصيل جديد"
      text: "تشبيه المرأة بالظبية عام عند الجاهليين، لكن شوقي ضيف يفرّق بين شاعر وشاعر: «فشاعر يشبهها بها تشبيها عاديا. وشاعر يشبهها بها وهى تمد عنقها إلى شجر السّلم الناضر، يريد أن يستتم بذلك منظرا بديعا» [@deif، ج1 ص221]. وطَرَفَة من الصنف الثاني: ظبيته تمد عنقها إلى البرير، والأغصان تتدلى عليها."
  connection: "ثم يصف ثغرها إذا ابتسمت: كأنه أقحوان في رمل ندي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "خَذُولُنْ / تُرَاعِي رَبْ / رَبَنْ بِ / خَمِيلَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — تَنَاوَ / لُ أَطْرَافَلْ / بَرِيرِ / وَتَرْتَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "البيت الثاني من صفة الحبيبة (6–10)، وهو متصل بما قبله في الإعراب، فـ«خذول» نعت لـ«أحوى» [@ibn-al-anbari، ص142]. وقد جمع فيه ابن الأَنْبارِيّ صورتين من صور المرأة: الغزال في عنقه، والبقرة في عينيها [@ibn-al-anbari، ص141]. وهما مما عدّه شوقي ضيف من تشبيهات الجاهليين الحسية للمرأة، فالشاعر «يشبهها بالشمس والبدر... والبقرة والظبية والقطاة» [@deif، ج1 ص220]."
