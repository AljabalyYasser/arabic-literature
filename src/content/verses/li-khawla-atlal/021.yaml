first: "لَهَا مِرْفَقَانِ أَفْتَلَانِ كَأَنَّمَا"
second: "تَمُرُّ بِسَلْمَيْ دَالِجٍ مُتَشَدِّدِ"
meaning: "لها مرفقان بعيدان عن جنبيها، كأنها تمر بدلوين في يدي سقّاء قوي يباعدهما عن جنبيه. قال الزَّوْزَنِيّ: «شبهها بسقاء حمل دلوين إحداهما بيمناه والأخرى بيسراه فبانت يداه عن جنبيه، شبّه بعد مرفقيها عن جنبيها ببعد هاتين الدلوين عن جنبي حاملهما القوي الشديد» [@zawzani، ص97]."
vocabulary:
  - term: "مِرْفَقَانِ"
    text: "مثنى مِرْفَق، وهو موصل الذراع بالعضد. «واحد المرافق مرفق» [@ibn-al-anbari، ص163]."
  - term: "أَفْتَلَانِ"
    text: "«بانا عن الزور»، أي تباعدا عن الصدر [@ibn-al-anbari، ص163]. وللعرب في عيوب المرفق الذي يحتك بالجنب أسماء: «الماسح، والناكت، والحاز، والضاغط، والعارك»، وهذه الناقة «ليس بها» شيء منها [@ibn-al-anbari، ص163–164]."
  - term: "سَلْمَيْ"
    text: "مثنى سَلْم، و«السلم: الدلو لها عروة واحدة مثل دلو السقائين» [@ibn-al-anbari، ص164]."
  - term: "دَالِجٍ"
    text: "«الذي يدلج بالدلو إلى الحوض، أي يمشي، حتى يصبها فيه» [@ibn-al-anbari، ص164]."
  - term: "مُتَشَدِّدِ"
    text: "قوي. «وإنما قال (متشدد) لأنه أشد لتباعده» [@ibn-al-anbari، ص164]."
syntax:
  - "«مِرْفَقَانِ» مبتدأ مؤخر، و«لَهَا» خبر مقدم: «والمرفقان يرتفعان بلها» [@ibn-al-anbari، ص164]. و«أَفْتَلَانِ» صفة."
  - "«كأنما لا موضع لها من الإعراب، وما مع كأن حرف واحد» [@ibn-al-anbari، ص164]؛ فـ«ما» كفّت «كأنّ» عن العمل، فوليتها الجملة الفعلية."
  - "«والباء صلة تمر. والسلمان مضافان إلى الدالج، والنون حذفت للإضافة» [@ibn-al-anbari، ص164]."
morphology:
  - "«أَفْتَل» على «أفعل» صفة، من الفَتَل، وهو تباعد المرفقين عن الجنبين؛ ومثناه «أفتلان»."
  - "«دالِج» اسم فاعل من «دَلَج»، «والمدلج: ممشاه» [@ibn-al-anbari، ص164]."
  - "«مُتَشدِّد» اسم فاعل من «تشدّد» على «تفعّل»."
rhetoric:
  thesis: "عضو واحد، المرفق، يأخذ بيتين وتشبيهين: رجل يحمل دلوين، ثم بناء عظيم."
  devices:
    - title: "التشبيه بالهيئة"
      text: "المشبه به صورة إنسان يتحرك، لا شيء جامد: سقّاء يمشي بدلوين يباعدهما عن ثيابه [@ibn-al-anbari، ص164] [@zawzani، ص97]. والقوة في «متشدد» تفسر البعد: كلما قوي الساقي بعدت يداه عن جنبيه."
    - title: "كلمة تنفي خمسة عيوب"
      text: "للعرب خمسة أسماء لاحتكاك المرفق بالجنب [@ibn-al-anbari، ص163–164]، ونفاها طَرَفَة كلها بكلمة واحدة: «أفتلان». وهذا من دقة معرفته بالإبل."
  connection: "ثم يكمل التشبيه في البيت التالي: «كقنطرة الرومي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "لَهَا مِرْ / فَقَانِ أَفْ / تَلَانِ / كَأَنْنَمَا = فعولن / مفاعلن / فعولُ / مفاعلن — تَمُرْرُ / بِسَلْمَيْ دَا / لِجِنْ مُ / تَشَدْدِدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "في وسط قسم الناقة يصف أعضاءها واحدًا واحدًا: الذنب، والفخذين، والفقار، والمرفقين، والظهر، والعنق، والرأس، والعينين، والأذنين، والأنف (16–38)."
variants:
  - reading: "تُمَرُّ بِسَلْمَيْ دَالِجٍ مُتَشَدِّدِ"
    status: "رواية أخرى"
    note: "بالبناء للمجهول، و«معناه تفتل وتجود الفتل». «وقال الطوسي: من قال تمر فهو من المرور» [@ibn-al-anbari، ص164]."
