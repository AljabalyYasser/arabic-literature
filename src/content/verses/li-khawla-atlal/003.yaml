first: "كَأَنَّ حُدُوجَ الْمَالِكِيَّةِ غُدْوَةً"
second: "خَلَايَا سَفِينٍ بِالنَّوَاصِفِ مِنْ دَدِ"
meaning: "كأن مراكب صاحبته المالكية غداة رحيلها، وهي تمضي في رحاب الوادي، سفن عظيمة. قال الزَّوْزَنِيّ: «شبه الإبل وعليها الهوادج بالسفن العظام» [@zawzani، ص90]."
vocabulary:
  - term: "حُدُوجَ"
    text: "«مراكب النساء، واحدها حدج» [@ibn-al-anbari، ص135]."
  - term: "الْمَالِكِيَّةِ"
    text: "صاحبته، منسوبة إلى بني مالك. هي عند ابن الأَنْبارِيّ «من بني مالك بن ضبيعة بن قيس بن ثعلبة» [@ibn-al-anbari، ص135]، وهم رهط طَرَفَة نفسه؛ وعند الزَّوْزَنِيّ من «بني مالك قبيلة من كلب» [@zawzani، ص89]."
  - term: "خَلَايَا"
    text: "قال الأَصْمَعِيّ: «الخلايا السفن العظام، واحدها خلية». وقال أبو عُبَيْدة: «الخلية السفينة العظيمة معها قارب، أي زورق صغير» [@ibn-al-anbari، ص135]."
  - term: "النَّوَاصِفِ"
    text: "قال الأَصْمَعِيّ: «مواضع تتسع من الأودية كالرحاب» [@ibn-al-anbari، ص136]."
  - term: "دَدِ"
    text: "«مكان» [@ibn-al-anbari، ص136]. وقيل: هو هنا بمعنى اللهو واللعب [@zawzani، ص89]."
syntax:
  - "«والحدوج اسم كأن، والخلايا موضعها رفع على خبر كأن والإعراب لا يتبين في لفظها» [@ibn-al-anbari، ص136]."
  - "«بِالنَّوَاصِفِ» في موضع الحال: «كأن حدوج المالكية وهي بالنواصف خلايا سفين، أي وهذه حالها» [@ibn-al-anbari، ص136]."
  - "«غُدْوَةً» ظرف زمان. وحقها ألا تُنوَّن لأنها معرفة مؤنثة، «فاضطر الشعر إلى إجرائها» [@ibn-al-anbari، ص136]، أي إلى صرفها وتنوينها."
morphology:
  - "«حُدُوج» جمع «حِدْج»، ويقال له أيضًا «حِداجة»، وجمعها «حدائج» [@ibn-al-anbari، ص135] [@zawzani، ص89]."
  - "«خَلَايَا» جمع «خَلِيّة»، مثل «هَدِيّة» و«هَدايا»."
  - "«سَفِين» جمع «سفينة»، «وقد يكون السفين واحدًا» [@zawzani، ص89]. و«النَّوَاصِف» جمع «ناصفة»، «وإنما أراد ناصفة فقال نواصف» [@ibn-al-anbari، ص136]."
rhetoric:
  thesis: "الإبل بهوادجها في الوادي سفن عظيمة في البحر. صورة تأتي بالبحر إلى الصحراء."
  devices:
    - title: "التشبيه"
      text: "شبّه الإبل وعليها الهوادج بالسفن العظام [@zawzani، ص90]، في ضخامتها وارتفاعها وسيرها المتمايل. وأداة التشبيه «كأنّ»."
    - title: "صورة تمتد ثلاثة أبيات"
      text: "لا يقف التشبيه عند هذا البيت. ففي البيت التالي يسمّي السفن ويصف الملاح، وفي الذي بعده يصف صدر السفينة يشق الماء. فالمشبه به يكبر حتى يصير مشهدًا كاملًا."
    - title: "البحر في شعر ابن البحرين"
      text: "السفن التي يذكرها في البيت التالي سفن أهل هَجَر والبحرين [@ibn-al-anbari، ص137]، وطَرَفَة من هذه الناحية، وفيها قُتل وقُبر [@ibn-al-anbari، ص125–126]. فلعل البحر في صورته من بيئته."
  connection: "ثم يسمّي هذه السفن، ويصف ملاحها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَأَنْنَ / حُدُوجَلْ مَا / لِكِيْيَ / ةِ غُدْوَتَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — خَلَايَا / سَفِينِنْ بِنْ / نَوَاصِ / فِ مِنْ دَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "بعد البكاء على الأطلال يتذكر يوم الرحيل: الظعائن، أي النساء في هوادجهن على الإبل. وهذا باب يطرقه الشاعر بعد الأطلال، كما عرفنا في بناء القصيدة في «المعلقات»."
