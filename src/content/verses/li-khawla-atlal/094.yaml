first: "وَلَا تَجْعَلِينِي كَامْرِئٍ لَيْسَ هَمُّهُ"
second: "كَهَمِّي وَلَا يُغْنِي غَنَائِي وَمَشْهَدِي"
meaning: "ولا تجعليني مثل رجل ليس همّه كهمّي، ولا يكفي كما أكفي، ولا يحضر الوقائع كما أحضرها. قال ابن الأَنْبارِيّ: «معناه لا تسوى بيني وبين من لا يشبهني في شجاعتي وكرمي» [@ibn-al-anbari، ص224]."
vocabulary:
  - term: "هَمُّهُ"
    text: "«والهمّ أصله القصد، يقال: هم بكذا أي قصد له، ثم يجعل الهم والهمة اسْمًا لداعية النفس إلى العلا» [@zawzani، ص118]. وداعية النفس: ما يدفعها ويحرّكها."
  - term: "غَنَائِي"
    text: "«الغناء: الكفاية» [@zawzani، ص118]."
  - term: "مَشْهَدِي"
    text: "«المشهد في البيت بمعنى الشهود وهو الحضور» [@zawzani، ص118]، أي حضور الوقائع."
syntax:
  - "«وموضع الكاف نصب بليس» [@ibn-al-anbari، ص224]، أي «كهمّي» خبر «ليس»، و«همُّه» اسمها."
  - "«وموضع غنائي نصب والتقدير فيه: ولا يغني مثل غنائي» [@ibn-al-anbari، ص224]، فهو مفعول مطلق حُذف مضافه. و«مشهدي» مثله: «ولا يشهد الوقائع شهودًا مثل شهودي» [@zawzani، ص118]."
  - "«كامرئ» الكاف في موضع المفعول الثاني لـ«تجعليني»، وجملة «ليس همّه كهمّي» صفة لـ«امرئ»."
morphology:
  - "«الغَناء» بفتح الغين ممدود، أما بكسرها فمقصور «وكان مضادا للفقر. وربما اضطر الشاعر إلى مده» [@ibn-al-anbari، ص224]."
  - "«مَشْهَد» مصدر ميمي على «مَفْعَل» بمعنى الشهود [@zawzani، ص118]."
  - "«الهَمّ» و«الهِمّة» من «همّ بكذا» إذا قصد له [@zawzani، ص118]."
rhetoric:
  thesis: "لا يريد رثاءً عامًّا يقال في كل ميت، بل رثاءً على قدره."
  devices:
    - title: "النهي بعد الأمر"
      text: "أمرها في البيت السابق بالنعي، ثم نهاها هنا عن التسوية. قال الزَّوْزَنِيّ: «لا تعدلي بي من لا يساويني في هذه الخلال فتجعلي الثناء عليه كالثناء عليّ والبكاء عليه كالبكاء عليّ» [@zawzani، ص118]."
    - title: "نفي المماثلة"
      text: "«ليس همّه كهمّي»: لم يقل إنه أفضل من غيره، بل نفى أن يكون له مثيل. ونفي المماثلة أقوى في التفرد من إثبات التفضيل."
    - title: "ياء المتكلم"
      text: "همّي، غنائي، مشهدي: ثلاث كلمات تنتهي بياء المتكلم في شطر واحد، فالنفس في مركز البيت."
  connection: "ثم يصف ذلك الرجل: بطيء عن الجُلّى، سريع إلى الخنا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلَا تَجْ / عَلِينِي كَمْ / رِئِنْ لَيْ / سَ هَمْمُهُو = فعولن / مفاعيلن / فعولن / مفاعلن — كَهَمْمِي / وَلَا يُغْنِي / غَنَائِي / وَمَشْهَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "في نسبة البيت إلى رواية ابن الأَنْبارِيّ نظر. فهو لا يورده بيتًا مستقلًّا، بل يذكره في أثناء شرحه للبيت السابق، ويفسّره ويعربه هناك [@ibn-al-anbari، ص224]. وهو في رواية الزَّوْزَنِيّ بيت من القصيدة [@zawzani، ص118]، وفي الديوان [@diwan-tarafa، ص29]. ونلاحظ أن ابن الأَنْبارِيّ نفسه يعرب ألفاظ البيت التالي نعوتًا لـ«امرئ» الذي في هذا البيت: «والبطيء، والذلول، والملهد، نعوت لامرئٍ» [@ibn-al-anbari، ص225]؛ فالبيت التالي لا يستقيم إعرابه إلا به."
