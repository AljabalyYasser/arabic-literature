first: "بَطِيءٍ عَنِ الْجُلَّى سَرِيعٍ إِلَى الْخَنَا"
second: "ذَلُولٍ بِأَجْمَاعِ الرِّجَالِ مُلَهَّدِ"
meaning: "رجل يتأخر عن الأمر العظيم، ويسرع إلى الفحش، ذليل تدفعه الرجال بقبضات أيديهم. قال الزَّوْزَنِيّ: «ولا تجعليني كرجل يبطأ عن الأمر العظيم ويسرع إلى الفحش وكثير ما يدفعه الرجال بأجماع أكفهم فقد ذل غاية الذل» [@zawzani، ص118]."
vocabulary:
  - term: "الْجُلَّى"
    text: "«الأمر العظيم، إذا ضمت الجيم منه قصر وإذا فتحت مد فقيل الجلاء» [@ibn-al-anbari، ص224–225]."
  - term: "الْخَنَا"
    text: "«الفحش» [@zawzani، ص118]."
  - term: "ذَلُولٍ"
    text: "«ضد الصعب» [@ibn-al-anbari، ص225]."
  - term: "أَجْمَاعِ"
    text: "«جمع جُمع وجِمع، وهو قبض الرجل أصابعه وشده إياها للكز» [@ibn-al-anbari، ص225]. واللكز: الضرب بجُمع الكف."
  - term: "مُلَهَّدِ"
    text: "«والملهد والملهز واحد، وأصله الغمز». «قال الطوسي: الملهد: المدفع». وقال أبو جعفر: «ملهد: لا ينهض بحمل، إذا حمل حمالة أو أمر لا ينهض به ولم يطقه، فلهده الحمل» [@ibn-al-anbari، ص225]."
syntax:
  - "«والبطيء، والذلول، والملهد، نعوت لامرئٍ» [@ibn-al-anbari، ص225]، أي لـ«امرئ» في البيت السابق، ولذلك جُرّت؛ و«سريع» مثلها."
  - "«عن الجلّى» متعلق بـ«بطيء»، و«إلى الخنا» متعلق بـ«سريع»، و«بأجماع الرجال» متعلق بـ«ملهّد»."
morphology:
  - "«مُلهَّد» اسم مفعول من «لهّد» على «فعّل» للتكثير: «التلهيد: مبالغة اللهد وهو الدفع بجمع الكف» [@zawzani، ص118]."
  - "«أجماع» جمع «جُمْع»، وفيه عند ابن الأَنْبارِيّ ضم الجيم وكسرها [@ibn-al-anbari، ص225]، وعند الزَّوْزَنِيّ ضمها وفتحها [@zawzani، ص118]."
  - "«الجُلّى» على «فُعْلى»، مقصورة إذا ضُمّت جيمها [@ibn-al-anbari، ص224–225]."
rhetoric:
  thesis: "صورة الرجل الذي لا يريد أن يُقرن به: بطء حيث تجب السرعة، وسرعة حيث يجب البطء."
  devices:
    - title: "المقابلة"
      text: "قال ابن رَشِيق: «فإذا جاوز الطباق ضدين كان مقابلة» [@ibn-rashiq، ج2 ص15]. وفي الشطر الأول ضدان في مقابل ضدين: «بطيء» و«سريع»، و«الجلّى» و«الخنا»."
    - title: "الترصيع"
      text: "الترصيع عند أبي هلال العَسْكَرِيّ «أن يكون حشو البيت مسجوعا، وأصله من قولهم: رصّعت العقد، إذا فصّلته» [@sinaatayn، ص375]. والحشو ما بين أول البيت وقافيته، وفصّلت العقد: جعلت بين حبّاته فواصل. وقد أورد هذا البيت في أمثلته [@sinaatayn، ص376]: «بطيءٍ عن الجلّى» و«سريعٍ إلى الخنا» قطعتان على نسق واحد، كحبّتين في عقد."
    - title: "الكناية"
      text: "يدفعه الرجال بقبضاتهم: كناية عن الذل. وفي حاشية الديوان: «الملهد: المضروب بالكف وفي الأمر كناية عن الذل والمهانة» [@diwan-tarafa، ص29، الحاشية]."
  connection: "ثم يقول: لو كنت ضعيفًا لضرّتني عداوة الأعداء."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "بَطِيئِنْ / عَنِلْ جُلْلَى / سَرِيعِنْ / إِلَلْ خَنَا = فعولن / مفاعيلن / فعولن / مفاعلن — ذَلُولِنْ / بِأَجْمَاعِرْ / رِجَالِ / مُلَهْهَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]."
context: "تتمة البيت السابق. قال الزَّوْزَنِيّ: «والبيت كله من صفة من ينهى ابنة أخيه أن تعدل غيره به» [@zawzani، ص118]. وتعدل غيره به: تجعله عِدلًا له، أي مساويًا."
variants:
