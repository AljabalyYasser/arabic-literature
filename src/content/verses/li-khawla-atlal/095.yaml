  - reading: "ذَلِيلٍ بِأَجْمَاعِ الرِّجَالِ مُلَهَّدِ"
    status: "رواية التَّوَّزِيّ والطُّوسِيّ"
    note: "«روى ذلك التوزي والطوسي وغيرهما. والذليل: ضد العزيز» [@ibn-al-anbari، ص225]."
