first: "رَأَيْتُ بَنِي غَبْرَاءَ لَا يُنْكِرُونَنِي"
second: "وَلَا أَهْلُ هَذَاكَ الطِّرَافِ الْمُمَدَّدِ"
meaning: "لكن الفقراء لا ينكرونني لأني أعطيهم، والأغنياء أصحاب بيوت الأدم لا ينكرونني لأني أنادمهم. قال ابن الأَنْبارِيّ: «يقول: يعرفني الفقراء والأغنياء، أي أعطي الفقراء وأنادم الأغنياء» [@ibn-al-anbari، ص192]."
vocabulary:
  - term: "بَنِي غَبْرَاءَ"
    text: "«الصَّعالِيك، وهم المحاويج والفقراء والسؤال والأضياف» [@ibn-al-anbari، ص192]. والغبراء: الأرض، «صفة الأرض جعلت كالاسم لها» [@zawzani، ص107]؛ فهم الذين لصقوا بالأرض من الفقر."
  - term: "الطِّرَافِ"
    text: "«بيت من أدم، وأهله المياسير والأغنياء» [@ibn-al-anbari، ص192]. والأدَم: الجلد."
  - term: "الْمُمَدَّدِ"
    text: "«الذي قد مد بالأطناب» [@ibn-al-anbari، ص192]، والأطناب: حبال الخيمة. «وكنّى بتمديده من عظمه» [@zawzani، ص107]."
syntax:
  - "«وموضع بني نصب برأيت، وخبر رأيت ما عاد من ينكرونني» [@ibn-al-anbari، ص192]، أي أن «رأى» هنا قلبية تنصب مفعولين، والجملة في موضع الثاني."
  - "«ولا أهلُ» بالرفع معطوف على الواو في «ينكرونني»، ويروى بالنصب «ولا أهلَ» عطفًا على «بني غبراء» [@ibn-al-anbari، ص192]."
  - "«هذاك»: اسم إشارة، «وفي هذاك لغات: يقال هذاك الرجل قام، وذلك الرجل، وذاك الرجل» [@ibn-al-anbari، ص192]."
morphology:
  - "«غَبْراء» على «فعلاء»، مؤنث «أغبر»، ممنوعة من الصرف."
  - "«الطِّراف» جمعه «الطُّروف» [@zawzani، ص107]، و«لفظه لفظ الواحد ومعناه معنى الجمع» في البيت [@ibn-al-anbari، ص192]."
  - "«المُمَدَّد» اسم مفعول من «مدّد» على «فعّل»."
rhetoric:
  thesis: "بعد صورة البعير المعزول، يعيد لنفسه مكانًا بين الناس: إن هجره أقاربه وصله الأباعد من طرفي المجتمع."
  devices:
    - title: "المقابلة"
      text: "قابل بين أفقر الناس، «الذين لصقوا بالأرض من شدة الفقر»، وأغناهم، «الذين لهم بيوت الأدم» [@zawzani، ص107]. «فهؤلاء لطلب المعروف وهؤلاء لطلب العلا» [@zawzani، ص107]."
    - title: "الكناية"
      text: "«بني غبراء» كناية عن الفقراء، و«أهل الطراف الممدد» كناية عن الأغنياء. لم يسمّهم باسم الفقر والغنى، بل بعلامة كل منهما: الأرض، والبيت العظيم."
    - title: "الإشارة للبعيد"
      text: "«هذاك» إشارة يستعملها للقريب والبعيد؛ وفيها هنا تعظيم لذلك البيت المرفوع بالحبال."
  connection: "ثم يلتفت إلى لائمه: هل تستطيع أن تخلّدني؟"
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "رَأَيْتُ / بَنِي غَبْرَا / ءَ لَا يُنْ / كِرُونَنِي = فعولُ / مفاعيلن / فعولن / مفاعلن — وَلَا أَهْ / لُ هَاذَاكَطْ / طِرَافِلْ / مُمَدْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر [@atiq، ص29]. و«هذاك» تُكتب في التقطيع «هاذاك»."
context: "خاتمة صورة الفتى الخليع. يقول الزَّوْزَنِيّ: «إن هجرتني الأقارب وصلتني الأباعد، وهم الفقراء والأغنياء» [@zawzani، ص107]. ومن هنا ينتقل الشاعر من الوصف إلى الحجة: لماذا يعيش هكذا؟"
variants:
  - reading: "وَلَا أَهْلَ هَذَاكَ الطِّرَافِ الْمُمَدَّدِ"
    status: "رواية أخرى"
    note: "بالنصب عطفًا على «بني غبراء» [@ibn-al-anbari، ص192]."
