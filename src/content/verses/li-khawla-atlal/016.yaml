first: "كَأَنَّ جَنَاحَيْ مَضْرَحِيٍّ تَكَنَّفَا"
second: "حِفَافَيْهِ شُكَّا فِي الْعَسِيبِ بِمِسْرَدِ"
meaning: "كأن شعر ذنبها جناحا نسر أبيض أحاطا بعظم الذنب من جانبيه، وقد غُرزا فيه بالمِخْرز. قال ابن الأَنْبارِيّ: «شبه هلب ذنبها بجناحي مضرحي» [@ibn-al-anbari، ص157]. والهُلْب: شعر الذنب."
vocabulary:
  - term: "مَضْرَحِيٍّ"
    text: "نسر. «قال يعقوب: هو العتيق من النسور يضرب إلى البياض. قال الطوسي: المضرحي: النسر الأمغر. وقال ابن الأعرابي: المضرحي: النسر الأبيض» [@ibn-al-anbari، ص157]. والأمغر: الذي يضرب إلى الحمرة. وعند الزَّوْزَنِيّ: «الأبيض من النسور، وقيل: هو العظيم منها» [@zawzani، ص96]."
  - term: "تَكَنَّفَا"
    text: "«صارا من جانبيه عن يمين الذنب وشماله» [@ibn-al-anbari، ص157]. و«التكنف: الكون في كنف الشيء وهو ناحيته» [@zawzani، ص96]."
  - term: "حِفَافَيْهِ"
    text: "«(حفافاه): جانباه» [@ibn-al-anbari، ص157]."
  - term: "شُكَّا"
    text: "«غرزا وأدخلا فيهما» [@ibn-al-anbari، ص157]. و«الشك: الغرز» [@zawzani، ص96]."
  - term: "الْعَسِيبِ"
    text: "«عظم الذنب» [@ibn-al-anbari، ص157]."
  - term: "بِمِسْرَدِ"
    text: "«المسرد: المخصف، وهو الإشفى» [@ibn-al-anbari، ص157]، و«الإشفى: المثقب» [@zawzani، ص96، حاشية المحقق]. والمِخْصَف: ما تُخرز به النعل."
syntax:
  - "«والجناحان اسم كأن، وتكنفا خبر كأن» [@ibn-al-anbari، ص157]. والألف في «تكنّفا» و«شُكّا» ضمير الجناحين. وعلى هذا يعود الضمير في «حفافيه» على الذنب: الجناحان يحيطان به."
  - "وله إعراب آخر: «ويجوز أن يكون تكنفا صلة المضرحي والهاء يعود عليه، وشكا خبر كأن» [@ibn-al-anbari، ص157]. والصلة هنا الصفة: جناحا نسر يكتنفان جنبيه، أي جنبي النسر نفسه، وقد «شُكّا» في عظم الذنب."
  - "«شُكّا» ماض مبني للمجهول، والألف نائب الفاعل، و«في العسيب» و«بمسرد» متعلقان به. و«حفافيه» مثنى منصوب على الظرفية، حُذفت نونه للإضافة."
morphology:
  - "«المِسْرَد» اسم آلة على «مِفْعَل» من «سرد»، أي خرز، «والمسرد المسراد: الإشفى، والجمع المسارد والمساريد» [@zawzani، ص96]."
  - "«تكنّف» على «تفعّل» من الكَنَف، وهو الناحية [@zawzani، ص96]."
  - "«حِفاف» مفرد، «والجمع الأحفة». و«العسيب» جمعه «العُسُب» [@zawzani، ص96]."
rhetoric:
  thesis: "أول عضو في التمثال: الذنب. وصورته صورة صانع يثبّت ريش النسر في العظم بالمِخْرز."
  devices:
    - title: "التشبيه"
      text: "التشبيه عند ابن رَشِيق «صفة الشيء بما قاربه وشاكله، ومن جهة واحدة أو جهات كثيرة لا من جميع جهاته» [@ibn-rashiq، ج1 ص286]. والجهات هنا ثلاث: البياض، والكثافة، والانتشار على الجانبين. فالذنب جناحان مفتوحان «عن يمين الذنب وشماله» [@ibn-al-anbari، ص157]."
    - title: "في التمثال: الذنب"
      text: "في الشطر الثاني صنعة يدوية: الجناحان «شُكّا» في العظم «بمسرد»، أي غُرزا فيه بالمِخْرز. فكأن الشاعر يركّب التمثال قطعة قطعة. وهذا ما يقصده شوقي ضيف بقوله إن الشاعر الجاهلي «نحات لا يصنع قصيدة، وإنما يصنع تمثالا»، وإن «خير مثل لذلك وصف طرفة لناقته فى معلقته فقد نعت جميع أعضائها وكل دقيقة فيها وجليلة» [@deif، ج1 ص221]."
  connection: "ثم يصف حركة هذا الذنب: مرة على عجزها، ومرة على ضرعها اليابس."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَأَنْنَ / جَنَاحَيْ مَضْ / رَحِيْيِنْ / تَكَنْنَفَا = فعولُ / مفاعيلن / فعولن / مفاعلن — حِفَافَيْ / هِ شُكْكَا فِلْ / عَسِيبِ / بِمِسْرَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "هنا يبدأ وصف الأعضاء واحدًا واحدًا (16–38)، ويبدأ من الذنب. والبيت مما أخذه النقاد على طَرَفَة: عدّه ابن طَباطَبا العلويّ، فيما نقله المَرْزُبانيّ، من الأبيات «التى قصّر فيها أصحابها عن الغايات التى أجروا إليها»، وقال: «وإنما توصف النجائب برقّة شعر الذنب وخفّته، وجعله هذا كثيفا طويلا عريضا» [@muwashshah، ص110، ص112، ص115]. والنجائب: كرام الإبل. وتبعه أبو هلال العَسْكَرِيّ فجعله «من الخطأ» [@sinaatayn، ص93]. وعند ابن الأَنْبارِيّ ما يجيب عنهم: فالأَصْمَعِيّ يرى قصر الذنب مستحبًّا في المهاري، وهي إبل الركوب السريعة، وعيبًا «فيما يحلب»، «ويمدح في ذوات الحلب سبوغ الأذناب وكثرة هلبها». وقال غيره: «كل الفحول من الشعراء وصف الأذناب بكثرة الهلب، منهم امرؤ القيس، وطرفة بن العبد» [@ibn-al-anbari، ص157]. فالخلاف خلاف في ذوق الإبل قبل أن يكون خلافًا في الشعر."
variants:
  - reading: "حَفَافَيْهِ"
    status: "ضبط متن ابن الأَنْبارِيّ"
    note: "بفتح الحاء في المتن [@ibn-al-anbari، ص157]. وأثبتنا الكسر كما في متن الزَّوْزَنِيّ، وعنده: «الحفاف: الجانب، والجمع الأحفة» [@zawzani، ص96]."
