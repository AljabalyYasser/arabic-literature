    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص227]. وهي رواية الزَّوْزَنِيّ [@zawzani، ص118]."
  - reading: "وَلَكِنْ نَفَى الْأَعْدَاءَ عَنِّي جَرَاءَتِي"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص227]."
