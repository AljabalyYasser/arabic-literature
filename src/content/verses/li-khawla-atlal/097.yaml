first: "وَلَكِنْ نَفَى عَنِّي الْأَعَادِيَ جُرْأَتِي"
second: "عَلَيْهِمْ وَإِقْدَامِي وَصِدْقِي وَمَحْتِدِي"
meaning: "لكن الأعداء ابتعدوا عني، أبعدتهم جرأتي عليهم، وإقدامي، وصدقي، وكرم أصلي. قال ابن الأَنْبارِيّ: «فيقول: محتدى وصدقي وجرأتي نفين عني إقدام الرجال وتسرع الأعداء إلى أن يقدموا عليَّ بالمساءة» [@ibn-al-anbari، ص227]."
vocabulary:
  - term: "نَفَى"
    text: "أبعد. «يقال: نفيت الشيء أنفيه نفيا، ونفاية، إذا نحيته عنك» [@ibn-al-anbari، ص227]."
  - term: "جُرْأَتِي"
    text: "شجاعتي. «يقال: جرؤ الرجل جرأة وجراءة» [@ibn-al-anbari، ص227]."
  - term: "إِقْدَامِي"
    text: "مضيّي في الحرب، من «أقدم يقدم إقداما» [@ibn-al-anbari، ص227]."
  - term: "مَحْتِدِي"
    text: "أصلي. «المحتد: الأصل» [@zawzani، ص118]. وفي ابن الأَنْبارِيّ أسماء كثيرة للأصل: «والمحتد. والمنصب، والضئضئ... والسنخ، والنِّجار، والنُّجار، والنَّجر: الأصل» [@ibn-al-anbari، ص227]."
syntax:
  - "«والجرأة موضعها رفع بفعلها، وهو نفي. والإقدام والصدق والمحتد منسوقات على الجرأة» [@ibn-al-anbari، ص227]. أي «جرأتي» فاعل «نفى» تأخر، وما بعدها معطوف عليها؛ و«منسوقات» عند الكوفيين: معطوفات."
  - "«الأعاديَ» مفعول به تقدّم على الفاعل."
  - "«ولكنْ» حرف استدراك مخفف لا يعمل، يستدرك به على «لو» في البيت السابق."
morphology:
  - "«جُرْأة» و«جَراءة» مصدران لـ«جَرُؤ» [@ibn-al-anbari، ص227]. «والجرأة والجراءة واحد، والفعل جرؤ يجرؤ، والنعت جريء» [@zawzani، ص118]."
  - "«مَحْتِد» على «مَفْعِل»."
  - "«الأعادي» جمع «أعداء»، فهو جمع الجمع."
rhetoric:
  thesis: "جواب الشرط الممتنع: ما يحميه ليس الأصحاب، بل أربع خصال فيه."
  devices:
    - title: "الاستدراك"
      text: "افترض في البيت السابق ضعفه بـ«لو»، ثم استدرك بـ«ولكن» فأثبت قوته. والبيتان حجة واحدة، نصفها افتراض ونصفها إثبات."
    - title: "المجاز العقلي"
      text: "المجاز العقلي أن يُسند الفعل إلى غير فاعله الحقيقي لعلاقة بينهما. لم يقل: نفيت الأعداء عني، بل قال: نفتهم جرأتي. فجعل خصاله هي الفاعلة، كأنها حرّاس حوله."
    - title: "التعداد"
      text: "جرأة، وإقدام، وصدق، ومحتد: يبدأ بما يظهر في ساعة الحرب، وينتهي بالأصل الذي يقوم عليه كل ذلك."
  connection: "ثم يقسم: لا يلتبس عليّ أمري في نهاري، ولا يطول عليّ ليلي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلَاكِنْ / نَفَى عَنْنِلْ / أَعَادِ / يَ جُرْأَتِي = فعولن / مفاعيلن / فعولُ / مفاعلن — عَلَيْهِمْ / وَإِقْدَامِي / وَصِدْقِي / وَمَحْتِدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]. و«لكنْ» تُكتب في التقطيع «لاكنْ» لأن ألفها تُنطق ولا تُكتب."
context: "تمام الحجة التي بدأها في البيت السابق. وبه تنتهي الوصية لابنة أخيه (93–97): لا تسوّي بيني وبين الضعيف، فلست ضعيفًا."
variants:
