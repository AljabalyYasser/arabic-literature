first: "وَوَجْهٌ كَأَنَّ الشَّمْسَ حَلَّتْ رِدَاءَهَا"
second: "عَلَيْهِ نَقِيُّ اللَّوْنِ لَمْ يَتَخَدَّدِ"
meaning: "ولها وجه كأن الشمس ألقت عليه حسنها وبهاءها، صافي اللون، لم يتغضّن جلده ولم يسترخ لحمه. قال ابن الأَنْبارِيّ: «ومعنى (حلت رداءها عليه) ألقت حسنها وبهجتها؛ فالرداء هاهنا: الحسن والجمال» [@ibn-al-anbari، ص147]."
vocabulary:
  - term: "حَلَّتْ"
    text: "فسّرها ابن الأَنْبارِيّ بـ«ألقت» [@ibn-al-anbari، ص147]، وبـ«ألقت» رواها الزَّوْزَنِيّ [@zawzani، ص92]."
  - term: "رِدَاءَهَا"
    text: "«فالرداء هاهنا: الحسن والجمال» [@ibn-al-anbari، ص147]. وهو عند الزَّوْزَنِيّ ضياء الشمس: «كأن الشمس كسته ضياءها وجمالها» [@zawzani، ص93]."
  - term: "نَقِيُّ اللَّوْنِ"
    text: "«صافي اللون لم يخالطه اصفرار ولا شيء يشينه» [@ibn-al-anbari، ص147]."
  - term: "يَتَخَدَّدِ"
    text: "«والتخدد: اضطراب الجلد واسترخاء اللحم، وهو أن يصير فيه خدود» [@ibn-al-anbari، ص147]. و«التخدد: التشنج والتغضن» [@zawzani، ص93]. والتغضّن: التجعّد."
syntax:
  - "يُروى «ووجهٌ» بالرفع و«ووجهٍ» بالجر. «فمن رفع الوجه كان له في رفعه أربعة أوجه: أحدهن أن يرتفع بإضمار ولها وجه، ويكون قوله كأن الشمس حلت رداءها عليه صلة الوجه، ونقى اللون نعت للوجه، ولم يتخدد مستأنف» [@ibn-al-anbari، ص148]. أي: الخبر محذوف تقديره «لها»، وجملة «كأن الشمس...» صفة للوجه، وهذا معنى «الصلة» هنا."
  - "ومن جرّه فله عند ابن الأَنْبارِيّ مذهبان: أن يكون «على معنى وتبدى عن وجه» [@ibn-al-anbari، ص148]، أي على فعل مقدّر؛ أو أن يُعطف على «ألمى» في البيت 8، «لأنه لما قال: وتبسم عن ألمى، كان معنى الكلام وتبدى عن ألمى وعن وجه» [@ibn-al-anbari، ص149]. وبالعطف أخذ الزَّوْزَنِيّ: «وجر الوجه عطفًا على ألمى» [@zawzani، ص93]."
  - "وردّ ابن الأَنْبارِيّ أن يُرفع الوجه بالهاء في «عليه»: «وفي هذا الوجه قبح، لأن النكرة لا ترتفع بما يلاصقها بعدها، لأنه صلة جعل لها، والاسم لا يرتفع بصلته» [@ibn-al-anbari، ص148]. يريد أن الجملة التي تلي النكرة صفة لها، والصفة لا تكون خبرًا عن موصوفها."
morphology:
  - "«يقال وجه ووجوه، وأوجه، وأجوه بالهمز على أن الهمزة بدل من الواو المضمومة» [@ibn-al-anbari، ص146]، كما في قوله تعالى «وإذا الرسل أُقّتت»، «فمعناه وقتت، فأبدلت الهمزة من الواو» [@ibn-al-anbari، ص147]."
  - "«يتخدّد» على «يتفعّل» من الخدّ، وهو الشق: «وكل شق في الأرض فهو خد، وخط، وأخدود» [@ibn-al-anbari، ص147]. فكأن التجاعيد شقوق في الجلد."
  - "«نَقِيّ» على «فعيل» من النقاء، «ويقال نقي بيِّن النقاء» [@ibn-al-anbari، ص147]."
rhetoric:
  thesis: "من الثغر إلى الوجه كله، والشمس حاضرة في الموضعين: سقت الثغر ضوءها، وحلّت على الوجه رداءها."
  devices:
    - title: "تشبيه في داخله استعارة"
      text: "الأداة «كأنّ» تجعل البيت تشبيهًا، لكن في داخله استعارة: جعل للشمس رداءً، وجعل الرداء حسنها. قال الزَّوْزَنِيّ: «فاستعار لضياء الشمس اسم الرداء» [@zawzani، ص93]. والاستعارة عند عبد القاهر الجُرْجانيّ «أن يكون للَّفظ أصلٌ في الوضع اللغوي معروفٌ تدلُّ الشواهد على أنه اختُصَّ به حين وُضع، ثم يستعمله الشاعر أو غير الشاعر في غير ذلك الأصل، وينقله إليه نقلاً غيرَ لازمٍ، فيكون هناك كالعارِيَّة» [@asrar، ص30]. فالرداء ثوب، نُقل إلى الضوء."
    - title: "حلّت أم ألقت؟"
      text: "في متن ابن الأَنْبارِيّ «حلّت رداءها»، وفسّرها بـ«ألقت» [@ibn-al-anbari، ص147]؛ وفي متن الزَّوْزَنِيّ «ألقت» [@zawzani، ص92]؛ وروى أبو عُبَيْدة: «كأن الشمس ألقت قناعها عليه»، «وهذا مثل، يعنى حسنها» [@ibn-al-anbari، ص147]. و«حلّت» فيما نرى أدل على الحركة: كأن الشمس فكّت رداءها عن نفسها فوقع على الوجه. و«ألقت» أوضح في المعنى وأقرب إلى الفهم."
    - title: "نفيٌ يتمّ الصفة"
      text: "«لم يتخدد» نفي للتجاعيد، وهو إثبات للشباب. قال الزَّوْزَنِيّ: «وصف وجهها بكمال الضياء والنقاء والنضارة» [@zawzani، ص93]. فالضياء من الشمس، والنقاء من صفاء اللون، والنضارة من نفي التخدد."
  connection: "ثم يترك الحبيبة إلى الناقة: «وإني لأمضي الهم عند احتضاره»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَوَجْهُنْ / كَأَنْنَشْ شَمْ / سَ حَلْلَتْ / رِدَاءَهَا = فعولن / مفاعيلن / فعولن / مفاعلن — عَلَيْهِ / نَقِيْيُلْ لَوْ / نِ لَمْ يَ / تَخَدْدَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "آخر أبيات الحبيبة (6–10)، وهي أقصر أقسام المعلقة. والشمس من أشهر ما شبّهوا به المرأة، فالشاعر الجاهلي «يشبهها بالشمس والبدر» [@deif، ج1 ص220]. وأنشد ابن الأَنْبارِيّ في معنى البيت: «ووجه رداءُ الحُسنِ منه نَقاؤُه ... ويَسْطع من أبشارها لُمَعُ الفجرِ» [@ibn-al-anbari، ص147]. وبعده يخرج الشاعر إلى ناقته، وقسم الناقة أطول من قسم الحبيبة بكثير."
variants:
  - reading: "وَوَجْهٍ كَأَنَّ الشَّمْسَ أَلْقَتْ رِدَاءَهَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "بجر «وجه» عطفًا على «ألمى»، و«ألقت» مكان «حلّت» [@zawzani، ص92–93]. ووجه الجر مذكور عند ابن الأَنْبارِيّ أيضًا [@ibn-al-anbari، ص148–149]."
  - reading: "كَأَنَّ الشَّمْسَ أَلْقَتْ قِنَاعَهَا"
    status: "رواية أبي عُبَيْدة"
    note: "[@ibn-al-anbari، ص147]."
