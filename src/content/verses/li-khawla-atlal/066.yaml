first: "أَرَى الْعَيْشَ كَنْزًا نَاقِصًا كُلَّ لَيْلَةٍ"
second: "وَمَا تَنْقُصِ الْأَيَّامُ وَالدَّهْرُ يَنْفَدِ"
meaning: "أرى الحياة كنزًا ينقص كل ليلة، وما تنقصه الأيام والدهر يوشك أن ينفد. قال الزَّوْزَنِيّ: «شبه البقاء بكنز ينقص كل ليلة، وما لا يزال ينقص فإن مآله إلى النفاد... فكذلك العيش صائر إلى النفاد لا محالة» [@zawzani، ص110]."
vocabulary:
  - term: "الْعَيْشَ"
    text: "الحياة، والبقاء فيها."
  - term: "كَنْزًا"
    text: "المال المدّخر."
  - term: "يَنْفَدِ"
    text: "يفنى. «والنفاد الفناء، والفعل نفد ينفد، والإنفاد الإفناء» [@zawzani، ص110]."
syntax:
  - "«العيشَ» مفعول أول لـ«أرى»، و«كنزًا» مفعول ثانٍ، و«ناقصًا» صفته، و«كلَّ» ظرف زمان منصوب بإضافته إلى «ليلة»."
  - "«وموضع ما نصب بتنقص، والأيام مرتفعة به... ويجوز ينفد على جواب الجزاء. ويكون التقدير: وما تنقصه الأيام والدهر ينفد» [@ibn-al-anbari، ص201]. فـ«ما» شرطية، و«ينفد» جوابها، و«الدهر» مبتدأ أو معطوف."
morphology:
  - "«ناقص» اسم فاعل من «نقص» اللازم."
  - "«ينفَد» مضارع «نَفِد» بكسر العين في الماضي وفتحها في المضارع."
rhetoric:
  thesis: "أقصر عبارة عن الحياة في المعلقة: كنز ينقص كل ليلة. والكنز الذي ينقص لا بد أن ينتهي."
  devices:
    - title: "التمثيل"
      text: "شبّه البقاء، وهو معنى لا يُرى، بكنز ينقص كل ليلة، وهو صورة تُرى [@zawzani، ص110]. والتمثيل عند عبد القاهر الجُرْجانيّ تشبيه لا يتم «إلا بتأوّل»، أي بإعمال الفكر، لأن الشبه فيه بين معنى وصورة لا يُدرك بالعين وحدها؛ «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص92، ص95]. فالشبه هنا لا يُرى بالعين: لا لون ولا شكل، بل حكم يستخرجه العقل، وهو أن كل ما ينقص ينتهي."
    - title: "الحكمة"
      text: "يعدّ شوقي ضيف هذا البيت مثالًا على الحِكَم التي «تذكر في ثنايا كلامهم»، أي في أثناء القصائد [@deif، ج1 ص87]. والحكمة: قول موجز يصيب معنى عامًّا في الحياة."
  connection: "ثم يأتي بصورة ثانية للموت: الحبل المُرخى."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَرَلْ عَيْ / شَ كَنْزَنْ نَا / قِصَنْ كُلْ / لَ لَيْلَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَمَا تَنْ / قُصِلْ أَيْيَا / مُ وَدْدَهْ / رُ يَنْفَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "من الأبيات التي اختارها ابن قُتَيْبة «من جيد شعره»، وفي روايته «أرى الدهر كنزًا ناقصًا كل ليلة» [@ibn-qutayba، ج1 ص183]. ومعناه عند ابن الأَنْبارِيّ: «وما نقصاه الأيام والدهر ذهب» [@ibn-al-anbari، ص201]."
