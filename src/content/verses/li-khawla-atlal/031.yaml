first: "وَعَيْنَانِ كَالْمَاوِيَّتَيْنِ اسْتَكَنَّتَا"
second: "بِكَهْفَيْ حِجَاجَيْ صَخْرَةٍ قَلْتِ مَوْرِدِ"
meaning: "ولها عينان صافيتان كمرآتين، غائرتان في محجرين صلبين، كأنهما غاران في صخرة فيها نقرة ماء. قال الزَّوْزَنِيّ: «لها عينان تشبهان مرآتين في الصفاء والنقاء والبريق، وتشبهان ماء في القلت في الصفاء، وشبه عينيها بكهفين في غؤورهما، وحجاجيها بالصخرة في الصلابة» [@zawzani، ص100]."
vocabulary:
  - term: "الْمَاوِيَّتَيْنِ"
    text: "«المرآتان»، «شبه عينيها بالماويتين لصفائهما» [@ibn-al-anbari، ص175]."
  - term: "اسْتَكَنَّتَا"
    text: "«حلتا في كن»، أي في موضع يسترهما [@ibn-al-anbari، ص175]."
  - term: "كَهْفَيْ"
    text: "«الكهف: غار في الجبل، وهو ها هنا: غار العين الذي فيه مقلتها» [@ibn-al-anbari، ص175]."
  - term: "حِجَاجَيْ"
    text: "مثنى حِجاج، وهو «العظم المشرف على العين الذي ينبت عليه الحاجب» [@ibn-al-anbari، ص175]."
  - term: "قَلْتِ"
    text: "«نقرة في الجبل يستنقع فيها الماء، مؤنثة، وجمعها قلات» [@ibn-al-anbari، ص175]."
  - term: "مَوْرِدِ"
    text: "الماء. قال أحمد بن عبيد: «أراد يردها ماء المطر، ولو وردها الناس لكدروها» [@ibn-al-anbari، ص176]."
syntax:
  - "«والعينان يرتفعان على النسق على ما قبلها» [@ibn-al-anbari، ص176]، أي معطوفتان على الأعضاء المذكورة قبلهما: «ووجه... ومشفر... وعينان»."
  - "جملة «اسْتَكَنَّتَا» صفة لـ«عينان». «والكهفان مضافان إلى الحجاجين. والقلت نعت الصخرة» [@ibn-al-anbari، ص176]."
  - "«حِجَاجَيْ صَخْرَةٍ» أي حجاجين من صخرة، «كقولهم: باب حديد أي: باب من حديد» [@zawzani، ص100]."
morphology:
  - "«ماوِيّتَيْن» مثنى «ماوِيّة» بياء النسب."
  - "«اسْتَكَنّ» على «استفعل» من «الكِنّ»، وهو الستر؛ و«الاستكنان: طلب الكن» [@zawzani، ص100]."
  - "«حِجاج» يُجمع على «أحِجّة» [@zawzani، ص100]، و«قَلْت» على «قِلات» [@ibn-al-anbari، ص175]."
rhetoric:
  thesis: "ثلاث صور لعينين: مرآتان في صفائهما، وكهفان في غؤورهما، وماء في صخرة لم تكدّره الأيدي."
  devices:
    - title: "تشبيهات متتابعة"
      text: "المرآة للصفاء، والكهف للغؤور، والصخرة للصلابة [@zawzani، ص100]. ثلاثة وجوه للشبه في بيت واحد."
    - title: "قيد يحفظ الصورة"
      text: "لم يكتف بماء في صخرة، بل جعله «مورد» مطر لا يرده الناس، «ولو وردها الناس لكدروها» [@ibn-al-anbari، ص176]. فالقيد الأخير يحفظ صفاء التشبيه."
    - title: "الاستعارة"
      text: "في «اسْتَكَنَّتَا» جعل للعينين فعل من يلجأ إلى كِنّ فيستتر فيه. وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر [@dalail، ص67]."
  connection: "ثم يصف العينين تطردان القذى، والأذنين تسمعان الصوت الخفيّ (32–34)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَعَيْنَا / نِ كَلْمَاوِيْ / يَتَيْنِسْ / تَكَنْنَتَا = فعولن / مفاعيلن / فعولن / مفاعلن — بِكَهْفَيْ / حِجَاجَيْ صَخْ / رَتِنْ قَلْ / تِ مَوْرِدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "من صفة رأس الناقة (28–35): العنق، والجمجمة، والوجه، والعينان، والأذنان، والقلب، والأنف. وهذا البيت من أجمل ما فيها."
