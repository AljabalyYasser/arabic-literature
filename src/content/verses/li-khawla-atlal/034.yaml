first: "مُؤَلَّلَتَانِ تَعْرِفُ الْعِتْقَ فِيهِمَا"
second: "كَسَامِعَتَيْ شَاةٍ بِحَوْمَلَ مُفْرَدِ"
meaning: "أذناها محدّدتان كطرف الحربة، ترى فيهما علامة الكرم، كأنهما أذنا ثور وحشي منفرد في رملة حومل. قال الزَّوْزَنِيّ: «لها أذنان محددتان تحديد الآلة تعرف نجابتها فيهما، وهي كأذني ثور وحشي منفرد في الموضع المعين» [@zawzani، ص102]."
vocabulary:
  - term: "مُؤَلَّلَتَانِ"
    text: "«معناه محددتان كتحديد الآلة. والآلة: الحربة» [@ibn-al-anbari، ص178]. و«الدقة والحدة تحمدان في آذان الإبل» [@zawzani، ص101]."
  - term: "الْعِتْقَ"
    text: "الكرم. «يقول: إذا رأيتهما رأيت الكرم فيهما لتحديدهما وقلة وبرهما». وقال أبو جعفر: «العتق في الأذنين الا يكون في داخلهما وبر، فهو أجود لتسمعهما» [@ibn-al-anbari، ص178]."
  - term: "سَامِعَتَيْ"
    text: "«أي كأذني شاة» [@ibn-al-anbari، ص178]. و«السامعتان: الأذنان» [@zawzani، ص101]."
  - term: "شَاةٍ"
    text: "«والشاة هاهنا: الثور» [@ibn-al-anbari، ص178]، أي الثور الوحشي."
  - term: "حَوْمَلَ"
    text: "«اسم رملة» [@ibn-al-anbari، ص178]."
  - term: "مُفْرَدِ"
    text: "منفرد عن القطيع. «وجعله مفردا لأنه أشد توجسا وتفزعا، ولأنه ليس معه وحش يلهيه ويشغله» [@ibn-al-anbari، ص178]."
syntax:
  - "«ومؤللتان مرتفعتان بإضمارهما» [@ibn-al-anbari، ص178]، أي خبر لمبتدأ محذوف تقديره: هما مؤللتان. «والكاف في موضع رفع على النعت لهما» [@ibn-al-anbari، ص178]."
  - "«مُفْرَد» مذكّر وُصف به «شاة» وهي مؤنثة اللفظ، لأن المراد الثور. وقد جعل البَغْدادِيّ البيت شاهدًا على أن المؤنث في لفظه إذا كان مذكرًا في حقيقته «جاز في ضميره التذكير والتأنيث»، «وشاة هنا مؤنثة لفظا ومعناها الثور الوحشي وقد رجع إليه ضميره في وصفه وهو مفرد مذكر رعاية لجهة المعنى» [@khizana، ج7 ص436]."
  - "«وحومل: اسم رملة لا ينصرف» [@khizana، ج7 ص437]، فجُرّ بالفتحة: «بحوملَ»."
morphology:
  - "«مُؤلَّلة» اسم مفعول من «ألّل»، مأخوذ «من الآلة وهي الحربة وجمعها آل وإلال» [@zawzani، ص101]. «ويقال: أله يؤله ألا، إذا طعنه بالألة» [@ibn-al-anbari، ص178]."
  - "«شاة» تقال للذكر والأنثى. نقل البَغْدادِيّ عن ابن السِّكِّيت: «فإذا أرادت العرب إفراد واحده قالوا: شاة للذكر والأنثى»، فالتاء فيها للدلالة على الواحد، ولم يُرد بها «التأنيث المحض» [@khizana، ج7 ص436]."
  - "«سامِعة» اسم فاعل مؤنث صار اسمًا للأذن، وثُنّي هنا وحُذفت نونه للإضافة."
rhetoric:
  thesis: "شكل الأذن: حادّة كرأس الحربة، نظيفة الداخل. والمشبه به ثور وحشي وحيد، أشد الحيوان إصغاءً."
  devices:
    - title: "في التمثال: شكل الأذنين"
      text: "في البيت السابق عمل الأذنين، وهنا شكلهما: التحديد وقلة الوبر. وهذا الشكل «يمدح» في الأذنين [@ibn-al-anbari، ص178]، لأنه علامة العتق، أي الكرم. فالعين الخبيرة ترى أصل الناقة في أذنيها."
    - title: "قيد المفرد"
      text: "لم يقل «كأذني ثور»، بل «شاة بحومل مفرد»، والقيد هو الذي يصنع الصورة: «وجعله مفردا لأنه أشد توجسا وتفزعا، ولأنه ليس معه وحش يلهيه ويشغله، وإذا كان كذلك كان أشد لتسمعه وارتياعه» [@ibn-al-anbari، ص178]. وقال الزَّوْزَنِيّ: «وخص المفرد لأنه أشد فزعًا وتيقظًا واحترازًا» [@zawzani، ص102]."
    - title: "بين طَرَفَة وامرئ القيس"
      text: "روى الجاحِظ لامرئ القَيْس في صفة فرسه: «وسامعتان تعرف العتق فيهما ... كسامعتي مذعورة وسط ربرب» [@hayawan، ج1 ص180]. والشبه بين البيتين ظاهر: «تعرف العتق فيهما» بلفظها، ثم «كسامعتي». لكن طَرَفَة جعل المشبه به ثورًا مفردًا، وامرؤ القيس جعله أنثى مذعورة في قطيع؛ و«المذعورة» استعملها طَرَفَة في صفة العين قبل بيتين. فهو فيما نرى يعيد ترتيب مادة سابقه، لا ينقلها نقلًا."
  connection: "ثم يصف قلبها: ذكيّ يرتاع لكل شيء، وصلب كالصخرة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "مُؤَلْلَ / لَتَانِ تَعْ / رِفُلْ عِتْ / قَ فِيهِمَا = فعولُ / مفاعلن / فعولن / مفاعلن — كَسَامِ / عَتَيْ شَاتِنْ / بِحَوْمَ / لَ مُفْرَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "آخر ما في الأذنين (33–34). وقد أنشده البَغْدادِيّ شاهدًا نحويًّا في «خزانة الأدب» [@khizana، ج7 ص436–437]. والإعجاب بالأذن المحددة الخالية من الوبر من معرفة أهل الإبل، وقد نقله الشرّاح عن أبي جعفر وغيره [@ibn-al-anbari، ص178]."
