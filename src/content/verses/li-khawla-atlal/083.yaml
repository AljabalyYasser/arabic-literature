first: "فَآلَيْتُ لَا يَنْفَكُّ كَشْحِي بِطَانَةً"
second: "لِأَبْيَضَ عَضْبِ الشَّفْرَتَيْنِ مُهَنَّدِ"
meaning: "حلفت ألا يزال جنبي ملازمًا لسيف أبيض، قاطع الحدّين، مصنوع في الهند، كما تلازم البطانةُ ظاهرَ الثوب. قال الزَّوْزَنِيّ: «ولقد حلفت أن لا يزال كشحي لسيف قاطع رقيق الحدّين طبعته الهند بمنزلة البطانة للظهارة» [@zawzani، ص115]."
vocabulary:
  - term: "آلَيْتُ"
    text: "«معناه حلفت. والإيلاء: مصدر آليت» [@ibn-al-anbari، ص213]."
  - term: "كَشْحِي"
    text: "«الكشح: الخاصرة وما اضطمت عليه الأضالع» [@ibn-al-anbari، ص213]، أي الجنب."
  - term: "بِطَانَةً"
    text: "«نقيض الظهارة» [@zawzani، ص114]. والظهارة وجه الثوب الظاهر، والبطانة ما يليه من الداخل."
  - term: "عَضْبِ"
    text: "«السيف القاطع» [@ibn-al-anbari، ص213]."
  - term: "الشَّفْرَتَيْنِ"
    text: "«وشفرتا السيف: حداه» [@ibn-al-anbari، ص213]."
  - term: "مُهَنَّدِ"
    text: "«منسوب إلى الهند، وهي نسبة على غير قياس. وقال أبو عمرو: التهنيد: شحذ السيف» [@ibn-al-anbari، ص213]."
syntax:
  - "جملة «لا ينفكّ...» جواب القسم «آليتُ». و«لا ينفكّ» من أخوات «كان»، بمعنى لا يزال. «والبطانة منصوبة على خبر لا ينفك، وكشحي في موضع رفع لأنه هو الاسم» [@ibn-al-anbari، ص213]."
  - "«لأبيضَ» مجرور باللام، وعلامة جره الفتحة لأنه ممنوع من الصرف، صفة على «أفعل». وهو صفة حُذف موصوفها: لسيفٍ أبيض."
  - "«عضبِ الشفرتين» نعت لـ«أبيض»، وهو من إضافة الصفة إلى ما هي له في المعنى: سيف عضبةٌ شفرتاه. و«مهنّد» نعت ثانٍ."
morphology:
  - "«آلَيْتُ» على «أفعلت» من الأَلِيّة، وهي اليمين، وفيها لغات: «الألية، والأُلوة، والإلوة، والألوة» [@ibn-al-anbari، ص213]."
  - "«مُهَنَّد» اسم مفعول من «هنّد» على «فعّل». والنسب فيه «على غير قياس» [@ibn-al-anbari، ص213]، لأن القياس في النسب إلى الهند «هندي»."
  - "«ينفكّ» مضارع «انفكّ» على «انفعل»."
rhetoric:
  thesis: "يبدأ فخره بالسيف بيمين: جنبه والسيف لا يفترقان."
  devices:
    - title: "التشبيه البليغ"
      text: "التشبيه البليغ ما حُذفت منه الأداة ووجه الشبه، فصار المشبه كأنه المشبه به. قال: «كشحي بطانة»، فجعل السيف كالثوب وجنبه بطانته. وعبارة الزَّوْزَنِيّ تُظهر الأداة المحذوفة: «بمنزلة البطانة للظهارة» [@zawzani، ص115]."
    - title: "الكناية"
      text: "والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. وملازمة السيف للجنب كناية عن الاستعداد الدائم للحرب: لم يقل إنه شجاع، بل قال إن سيفه لا يفارقه."
    - title: "الصفة مكان الاسم"
      text: "«لأبيض»: سمّى السيف بلونه، ولم يذكر لفظ السيف. والبياض بريق الحديد المصقول."
  connection: "ثم يصف هذا السيف: ضربته الأولى تغني عن الثانية."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَءَالَيْ / تُ لَا يَنْفَكْ / كُ كَشْحِي / بِطَانَتَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — لِأَبْيَ / ضَ عَضْبِشْ شَفْ / رَتَيْنِ / مُهَنْنَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "أول أربعة أبيات في السيف (83–86). والأبيات الثلاثة الأولى منها جملة واحدة ممتدة: حلفت ألا يفارق جنبي سيفًا «أبيض»، «حسامًا»، «أخا ثقة»؛ فـ«حسام» في البيت التالي و«أخي ثقة» في الذي بعده مجروران تبعًا لـ«أبيض»، و«أخي ثقة نعت لما تقدم قبله» [@ibn-al-anbari، ص215]."
