first: "وَتَبْسِمُ عَنْ أَلْمَى كَأَنَّ مُنَوِّرًا"
second: "تَخَلَّلَ حُرَّ الرَّمْلِ دِعْصٌ لَهُ نَدِي"
meaning: "وتبتسم عن ثغر سمر لثاته بيض أسنانه، كأن فيه أقحوانًا تفتّح زهره في كثيب ندي من رمل خالص. قال الزَّوْزَنِيّ: «وإنما جعله نديًّا ليكون الأقحوان غضًّا ناضرًا، شبه به ثغرها وشرط لمى الشفتين ليكون أبلغ في بريق الثغر» [@zawzani، ص92]."
vocabulary:
  - term: "أَلْمَى"
    text: "«الأسمر، أي تبسم عن ثغر أسمر اللثات. وهم يمدحون سمرة اللثة، لأنها تبين بياض الأسنان» [@ibn-al-anbari، ص143]. وعند الزَّوْزَنِيّ: «الذي يضرب لون شفتيه إلى السواد» [@zawzani، ص92]."
  - term: "مُنَوِّرًا"
    text: "«الأقحوان الذي قد ظهر نوْره؛ ونَورُه ونُوّاره: زهره. والأقحوان: نبت طيب الريح» [@ibn-al-anbari، ص144]."
  - term: "تَخَلَّلَ"
    text: "«معناه توسطه ودخل فيه ونبت في وسطه» [@ibn-al-anbari، ص144]."
  - term: "حُرَّ الرَّمْلِ"
    text: "«أكرمه وأحسنه لونا» [@ibn-al-anbari، ص145]. و«حر كل شيء: خالصه» [@zawzani، ص92]."
  - term: "دِعْصٌ"
    text: "«كثيب من الرمل، وليس بكثير» [@ibn-al-anbari، ص145]. والكثيب: التل من الرمل."
  - term: "نَدِي"
    text: "رطب، «معناه في أسفله الماء» [@ibn-al-anbari، ص145]. و«الندى يكون دون الابتلال» [@zawzani، ص92]."
syntax:
  - "«عن ألمى» أي «عن ثغر ألمى، فحذف الثغر وأقام ألمى مقامه» [@ibn-al-anbari، ص143]. فالموصوف محذوف، والصفة قائمة مقامه."
  - "«والمنور اسم كأن، وخبر كأن مضمر والتقدير كأن به منورا، فحذف خبر كأن لأن الاسم نكرة وموضع الخبر معروف» [@ibn-al-anbari، ص145]. والضمير في «به» للثغر. و«منوّرًا» نفسه صفة حُذف موصوفها: «يعني أقحوانًا منورًا» [@zawzani، ص92]."
  - "جملة «تخلّل حرّ الرمل» صفة للمنوّر، فهو الذي «توسطه ودخل فيه» [@ibn-al-anbari، ص144]، و«الهاء» في «له» «للمنور» [@ibn-al-anbari، ص145]. وقدّر الزَّوْزَنِيّ الكلام: «كأن به أقحوانًا منورًا تخلل دعص له نَدٍ حر الرمل ثغرها» [@zawzani، ص92]، فجعل «الدعص» فاعلًا لـ«تخلّل»، و«ندٍ» صفة له."
morphology:
  - "«البسم والتبسم والابتسام واحد» [@zawzani، ص92]. ويقال فيه أيضًا: «افتر وانكل، كل ذلك إذا تبسم» [@ibn-al-anbari، ص143]."
  - "«ألمى» على «أفعل»، «والأنثى لمياء، والجمع لُمْي، والمصدر اللَّمَى» [@zawzani، ص92]."
  - "«مُنَوِّر» اسم فاعل من «نوّر»: «نوَّر النبت إذا خرج نوره فهو مُنوّر» [@zawzani، ص92]. و«نَدٍ» صفة منقوصة من «ندي يندى»، كُتبت ياؤها في القافية."
rhetoric:
  thesis: "بياض الأسنان بين سمرة اللثات، كزهر أبيض في رمل: صورة تقوم على تجاور اللونين."
  devices:
    - title: "التشبيه"
      text: "التشبيه عند ابن رَشِيق «صفة الشيء بما قاربه وشاكله، ومن جهة واحدة أو جهات كثيرة لا من جميع جهاته» [@ibn-rashiq، ج1 ص286]. والجهة هنا البياض: «فشبه بياض الثغر ببياض نور الأقحوان» [@ibn-al-anbari، ص144]. وهو من تشبيهاتهم المعروفة، فالشاعر الجاهلي يشبّه «أسنانها بالأقحوان» [@deif، ج1 ص221]."
    - title: "قيود تحفظ الصورة"
      text: "لم يكتف بالأقحوان، بل قيّده ثلاث مرات: تفتّح زهره، ونبت في خالص الرمل، وتحته ندى. قال الزَّوْزَنِيّ: «وشرط كون الأقحوان في دعص ند» ليكون «غضًّا ناضرًا» [@zawzani، ص92]. وقيّد الثغر أيضًا باللمى، لأن سمرة اللثة «تبين بياض الأسنان» [@ibn-al-anbari، ص143]."
    - title: "الابتسام لا الضحك"
      text: "اختار الابتسام، «وهم يمدحون الابتسام ويذمون الضحك» [@ibn-al-anbari، ص143]. فالصورة صورة حياء ووقار، يظهر فيها الثغر ولا ينفتح الفم كله."
  connection: "ثم يقول: كأن الشمس أعارت ثغرها ضوءها، إلا اللثات."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَتَبْسِ / مُ عَنْ أَلْمَى / كَأَنْنَ / مُنَوْوِرَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — تَخَلْلَ / لَ حُرْرَرْ رَمْ / لِ دِعْصُنْ / لَهُو نَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "من صفة الحبيبة (6–10): بعد العنق والعين في البيتين السابقين يصل إلى الثغر. ولأبي جعفر أحمد بن عبيد قراءة أخرى للّمى: هو ثغر «رقيق براق كأنه من بريقه ألمى، أو يخيل إلى الناظر إليه أن فيه غبرة من شدة صفائه» [@ibn-al-anbari، ص144]. فاللمى على قوله صفة للأسنان نفسها، يراها الناظر من شدة صفائها كأن عليها غبرة، لا صفة للّثة."
variants:
  - reading: "وَتَبْسِمُ عَنْ أَلْمَى يَرِفُّ مُنَوِّرٌ"
    status: "رواية الأَصْمَعِيّ"
    note: "مكان «كأن منورًا». «قوله يرف معناه يقطر من نعمته وريه» [@ibn-al-anbari، ص145]."
  - reading: "تَخَلَّلَ حُرَّ الرَّمْلِ دِعْصٍ لَهُ نَدِي"
    status: "متن الزَّوْزَنِيّ"
    note: "بجر «دعص» في المتن [@zawzani، ص92]، وتقديره في الشرح يجعله فاعلًا كما سبق."
