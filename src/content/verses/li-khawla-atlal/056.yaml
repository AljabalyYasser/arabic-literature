first: "فَلَوْلَا ثَلَاثٌ هُنَّ مِنْ عِيشَةِ الْفَتَى"
second: "وَجَدِّكَ لَمْ أَحْفِلْ مَتَى قَامَ عُوَّدِي"
meaning: "ولولا ثلاث خلال هن عندي عيش الفتى، لما باليت متى أموت، وحظّك. قال ابن الأَنْبارِيّ: «وقوله (لم أحفل): لم أعظمه مبالاة. وقوله (قام عودي) معناه متى مت» [@ibn-al-anbari، ص194]."
vocabulary:
  - term: "ثَلَاثٌ"
    text: "«معناه: فلولا ثلاث خلال. وقد بينهن في البيت الثاني» [@ibn-al-anbari، ص194]."
  - term: "وَجَدِّكَ"
    text: "قسم بحظ المخاطب. «الجد: الحظ والبخت... وقوله: وجدك قسم» [@zawzani، ص108]."
  - term: "أَحْفِلْ"
    text: "أبالي. «الحفل المبالاة» [@zawzani، ص108]."
  - term: "عُوَّدِي"
    text: "جمع عائد، من العيادة [@zawzani، ص108]: الذين يزورونه في مرضه. فإذا قاموا من عنده آيسين فقد مات [@zawzani، ص108]."
syntax:
  - "«والثلاث يرتفع بلولا» على مذهب الكوفيين، «وهن مرفوع بمن» [@ibn-al-anbari، ص194]. وعند البصريين «ثلاث» مبتدأ، وخبره محذوف وجوبًا بعد «لولا»."
  - "«وجدك، مخفوض على القسم» [@ibn-al-anbari، ص194]، والواو حرف قسم."
  - "«لم أحفل» جواب «لولا»، و«متى» اسم استفهام في موضع المفعول به للمعنى: لم أبال بوقت موتي."
morphology:
  - "«عُوَّد» جمع «عائد» على «فُعَّل»، مثل «رُكَّع» جمع «راكع»."
  - "«عِيشة» اسم من العيش على «فِعلة»، وهو بناء يدل على الهيئة: الطريقة التي يعيش بها الفتى."
  - "«أحفِل» مضارع «حفَل»، يقال: ما حفلت به، أي ما باليت."
rhetoric:
  thesis: "يجعل الحياة ثلاث خلال، لا أكثر. ويعلن قبل أن يعدّها أن الموت لا يعنيه لولاها."
  devices:
    - title: "الإجمال ثم التفصيل"
      text: "قال «ثلاث» ولم يذكرها، فشوّق السامع، ثم فصّلها في الأبيات الثلاثة التالية. «وقد بينهن في البيت الثاني» [@ibn-al-anbari، ص194]."
    - title: "الكناية"
      text: "«متى قام عوّدي» كناية عن الموت [@ibn-al-anbari، ص194]: الزوّار يقومون من عند المريض حين يموت، أو حين ييأسون منه. وقال أبو جعفر: «هم عنده فإذا قضى قاموا عنه» [@ibn-al-anbari، ص194]. والكناية عند عبد القاهر أن يومئ المتكلم إلى المعنى «بمعنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "القسم"
      text: "«وجدّك» قسم يعترض بين الشرط وجوابه، فيؤكد اللامبالاة."
  connection: "ثم يعدّ الخلال: الأولى الخمر."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَلَوْلَا / ثَلَاثُنْ هُنْ / نَ مِنْ عِي / شَتِلْ فَتَى = فعولن / مفاعيلن / فعولن / مفاعلن — وَجَدْدِ / كَ لَمْ أَحْفِلْ / مَتَى قَا / مَ عُوْوَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "من الأبيات الأربعة (56–59) التي يعدّ فيها «ثلاث خلال» تجعل الحياة عنده جديرة بأن تُعاش. وقد عدّها ابن رَشِيق من «الاختراع»، وهو عنده «ما لم يسبق إليه قائله، ولا عمل أحد من الشعراء قبله نظيره أو ما يقرب منه» [@ibn-rashiq، ج1 ص262]. ويرى شوقي ضيف أنه «يجعل من خلال الفتى هذه الخصال الثلاث، وهي الخمر والفروسية أو الشجاعة في الحرب والتمتع بالنساء» [@deif، ج1 ص71]. وقد أخذ عبد الله بن نهيك الأنصاريّ مطلعها بلفظه، فقال: «فلولا ثلاث هن من عيشة الفتى / وجدك لم أحفل متى قام رامس» [@ibn-qutayba، ج1 ص188]."
