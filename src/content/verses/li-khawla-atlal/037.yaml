first: "وَإِنْ شِئْتُ لَمْ تُرْقِلْ وَإِنْ شِئْتُ أَرْقَلَتْ"
second: "مَخَافَةَ مَلْوِيٍّ مِنَ الْقِدِّ مُحْصَدِ"
meaning: "هي طوع يدي: إن شئت أبطأت، وإن شئت أسرعت، خوفًا من سوط مفتول من الجلد محكم الفتل. قال أحمد بن عبيد: «معنى البيت: عند هذه الناقة كل ما أردت من السير» [@ibn-al-anbari، ص180]."
vocabulary:
  - term: "تُرْقِلْ"
    text: "من الإرقال، وهو «أن تنفض الناقة رأسها وترتفع عن الذميل» [@ibn-al-anbari، ص180]، أي تسرع. و«الإرقال: دون العدو وفوق السير» [@zawzani، ص102]."
  - term: "مَلْوِيٍّ"
    text: "«سوط ملوي أو نسع ملوي» [@ibn-al-anbari، ص180]. والنِّسْع: سير من جلد تُشدّ به الرحال."
  - term: "الْقِدِّ"
    text: "الجلد، ويعني السوط [@dalail، ص166، حاشية المحقق]."
  - term: "مُحْصَدِ"
    text: "«الشديد الفتل» [@ibn-al-anbari، ص180]. «والإحصاد: الإحكام والتوثيق» [@zawzani، ص102]."
syntax:
  - "«إِنْ» شرطية في الموضعين، و«لم ترقل جواب الجزاء» [@ibn-al-anbari، ص180]، وكذلك «أرقلت»."
  - "مفعول «شِئْتُ» محذوف في الموضعين، والتقدير: وإن شئت ألا ترقل لم ترقل، وإن شئت أن ترقل أرقلت [@dalail، ص166]."
  - "«مَخَافَةَ» مفعول لأجله: «والمعنى: من مخافة ملوي، فلما أسقطت الخافض نصبت ما بعده... وهو كقولك: قد أعطيتك خوفا وفرقا، أي من أجل الخوف والفرق» [@ibn-al-anbari، ص180]."
morphology:
  - "«تُرْقِل» مضارع «أرقل» الرباعي، ولذلك ضُمّ حرف المضارعة."
  - "«مَلْوِيّ» اسم مفعول من «لوى»، أصله «مَلْوُوي»، اجتمعت الواو والياء وسبقت إحداهما بالسكون، فقُلبت الواو ياء وأُدغمت."
  - "«مُحْصَد» اسم مفعول من «أحصد» الرباعي: أُحكم فتله."
rhetoric:
  thesis: "الناقة القوية مطيعة: قوتها كلها في يد صاحبها. وسرّ البيت في كلمة لم تُذكر."
  devices:
    - title: "الحذف"
      text: "حذف مفعول «شئت» مرتين. وقد وقف عبد القاهر الجُرْجانيّ عند هذا البيت، وجعله مما «يُعلم أن ليس فيه لغير الحذف وجه»، ثم قال إنك لو قلت: «وإن شئت أن لا ترقل لم ترقل»، ونحوه، «أذهب الماء والرونق، وخرجت إلى كلام غث، ولفظ رث» [@dalail، ص166–167]. وقال في الحذف عامة: «فإنك ترى به ترك الذكر أفصح من الذكر» [@dalail، ص146]."
    - title: "التكرار"
      text: "تتكرر «وإن شئت» ثلاث مرات في بيتين، فالبيت السابق يبدأ بها أيضًا: «وإن شئت سامى واسط الكور رأسها». فتكرار المشيئة يُظهر سيطرته على الناقة."
    - title: "المقابلة"
      text: "«لم ترقل» و«أرقلت»: شطران متقابلان، الإبطاء في أولهما والإسراع في ثانيهما، والناقة في الحالين تتبع مشيئته."
  connection: "ثم يختم أعضاءها في البيت التالي بمشفرها المشقوق وأنفها الكريم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِنْ شِئْ / تُ لَمْ تُرْقِلْ / وَإِنْ شِئْ / تُ أَرْقَلَتْ = فعولن / مفاعيلن / فعولن / مفاعلن — مَخَافَ / ةَ مَلْوِيْيِنْ / مِنَلْ قِدْ / دِ مُحْصَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "بعد أن وصف قوتها عضوًا عضوًا يصف طاعتها. وبهذا البيت استشهد عبد القاهر في «دلائل الإعجاز» على حذف مفعول المشيئة [@dalail، ص166]."
