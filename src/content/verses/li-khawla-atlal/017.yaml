first: "فَطَوْرًا بِهِ خَلْفَ الزَّمِيلِ وَتَارَةً"
second: "عَلَى حَشَفٍ كَالشَّنِّ ذَاوٍ مُجَدَّدِ"
meaning: "فهي تضرب بذنبها مرة خلف الرديف، ومرة على ضرع يابس متقبّض كالقربة البالية، قد ذبل وانقطع لبنه. قال ابن الأَنْبارِيّ: «معناه طورا ترفع ذنبها وتضرب به خلف الزميل - أي الرديف - ومرة تضرب به ضرعها» [@ibn-al-anbari، ص158]. والرديف: الراكب خلف الراكب."
vocabulary:
  - term: "طَوْرًا"
    text: "«الحين» [@ibn-al-anbari، ص158]، أي مرة."
  - term: "الزَّمِيلِ"
    text: "«الرَّديف» [@zawzani، ص96]. وقال الطُّوسِيّ: «لا زميل هناك، إنما أراد أنها تضربه على وركها في موضع الزميل الذي يقعد فيه» [@ibn-al-anbari، ص159]."
  - term: "حَشَفٍ"
    text: "«الأخلاف التي جف لبنها فتشنجت، الواحدة حشفة» [@zawzani، ص96]، والأخلاف: حلمات الضرع. «وإنما سماه حشفا لأنه متقبض لا لبن لها فيه» [@ibn-al-anbari، ص158]."
  - term: "الشَّنِّ"
    text: "«القربة الخلق، والإداوة الخلق» [@ibn-al-anbari، ص158]. والخَلَق: البالي، والإداوة: إناء صغير من جلد."
  - term: "ذَاوٍ"
    text: "«الذابل الذي قد أخذ في اليبس» [@ibn-al-anbari، ص158]."
  - term: "مُجَدَّدِ"
    text: "«الذاهب اللبن»، وأصله «من القطع» [@ibn-al-anbari، ص158]. و«المجدد الذي جُدّ لبنه أي قطع» [@zawzani، ص96]."
syntax:
  - "«و (الطور) منصوب بفعل مضمر، والمعنى: فطورا تضرب به خلف الزميل. وكذلك التارة تنتصب بفعل مضمر أيضا» [@ibn-al-anbari، ص159]. فالفعل «تضرب» محذوف في الشطرين، يدل عليه المعنى."
  - "الضمير في «به» للذنب: «فطورًا تضرب بالذنب» [@zawzani، ص96]. و«خلفَ» ظرف مكان."
  - "«و (الذاوي) نعت الحشف، وكذلك المجدد» [@ibn-al-anbari، ص159]، و«كالشنّ» صفة أخرى بينهما."
morphology:
  - "«ذاوٍ» اسم فاعل منقوص من «ذوى»، حُذفت ياؤه للتنوين. و«الذوي: الذبول، والفعل ذوى يذوي وذوي يذوى لغة أيضًا» [@zawzani، ص96]."
  - "«مُجَدَّد» اسم مفعول من «جدّ» بمعنى قطع. ومن أصله «ناقة جدود، وهي التي قد ذهب لبنها من غير بأس... والتي ذهب لبنها من عيب هي جداء» [@ibn-al-anbari، ص158]."
  - "«تارة» جمعها «تارات» [@ibn-al-anbari، ص158]، و«الشَّنّ» جمعه «الشنان» [@zawzani، ص96]."
rhetoric:
  thesis: "الذنب نفسه، لكن في الحركة: يضرب هنا وهناك. ومعه عضو جديد، ضرع يابس، وهو علامة قوة لا علامة ضعف."
  devices:
    - title: "في التمثال: الضرع"
      text: "يضيف إلى التمثال الضرع، ويصفه بالجفاف: متقبّض كالقربة البالية، ذابل، مقطوع اللبن. وهذا مدح لناقة الركوب، فهي لا ترضع ولا تُحلب، وقوتها كلها لها. ويتصل بما سبق: رعت مع «الشول» التي خفّت ضروعها (14)، وصدّت الفحل (15)."
    - title: "الحذف"
      text: "حذف الفعل في الشطرين، فقال «فطورًا به» ولم يقل «تضرب»، فالطور والتارة «تنتصب بفعل مضمر» [@ibn-al-anbari، ص159]. والحذف عند عبد القاهر الجُرْجانيّ باب «شبيه بالسحر، فإنك ترى به ترك الذكر، أفصح من الذكر، والصمت عن الإفادة، أزيد للإفادة» [@dalail، ص146]. وغياب الفعل يسرّع البيت، كما يسرع الذنب في ضربه."
    - title: "التشبيه ومعجم اليبس"
      text: "شبّه الضرع بالشنّ، وهو «القربة الخلق» [@ibn-al-anbari، ص158]، في يبسه وتقبّضه. وحتى الكلمة «حشف» عند الزَّوْزَنِيّ «مستعار من حشف التمر أو من الحشيف وهو الثوب الخلِق» [@zawzani، ص96]. فألفاظ الشطر الثاني كلها من معجم اليبس: حشف، شنّ، ذاوٍ، مجدّد."
  connection: "ثم يصف فخذيها: كأنهما بابا قصر عالٍ."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَطَوْرَنْ / بِهِي خَلْفَزْ / زَمِيلِ / وَتَارَتَنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — عَلَى حَ / شَفِنْ كَشْشَنْ / نِ ذَاوِنْ / مُجَدْدَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "البيت الثاني في الذنب (16–17). والطُّوسِيّ يرى أن «الزميل» لا وجود له، وإنما أراد موضعه من ورك الناقة [@ibn-al-anbari، ص159]؛ فالشاعر يسافر وحده، والناقة تضرب بذنبها حيث يقعد الرديف لو كان."
variants:
  - reading: "عَلَى حَشِفٍ"
    status: "ضبط متن ابن الأَنْبارِيّ"
    note: "بكسر الشين في المتن [@ibn-al-anbari، ص158]. وأثبتنا الفتح كما في متن الزَّوْزَنِيّ، وهو عنده جمع «حشفة» [@zawzani، ص96]."
