first: "طَحُورَانِ عُوَّارَ الْقَذَى فَتَرَاهُمَا"
second: "كَمَكْحُولَتَيْ مَذْعُورَةٍ أُمِّ فَرْقَدِ"
meaning: "وعيناها تدفعان عنهما القذى فلا يبقى فيهما شيء، فتراهما كعيني بقرة وحشية ذات ولد قد أفزعها شيء. قال الزَّوْزَنِيّ: «عيناها تطرحان وتبعدان القذى عن أنفسهما ثم شبههما بعيني بقرة وحشية لها ولد وقد أفزعها صائد أو غيره. وعين الوحشية في هذه الحالة أحسن ما تكون» [@zawzani، ص101]."
vocabulary:
  - term: "طَحُورَانِ"
    text: "دافعتان. «يعنى العينين، يقول: ترميان بعوار القذى» [@ibn-al-anbari، ص176]. و«الطرح والطحر والدحر واحد» [@zawzani، ص101]."
  - term: "عُوَّارَ"
    text: "«القطعة من الرمد. فيقول: عينها صحيحة» [@ibn-al-anbari، ص176]. و«العوار والقذى واحد، والجمع العواوير» [@zawzani، ص101]. والرمد: وجع العين."
  - term: "مَكْحُولَتَيْ"
    text: "عينَي. «أراد بالمكحولتين العينين، لا تكحل بقر الوحش ولكن العين محل الكحل على الإطلاق» [@zawzani، ص101]."
  - term: "مَذْعُورَةٍ"
    text: "مفزوعة: «يقال: قد ذعرته أذعره ذعرا، إذا أفزعته» [@ibn-al-anbari، ص176]."
  - term: "فَرْقَدِ"
    text: "«ولد البقرة» [@ibn-al-anbari، ص176]، أي بقرة الوحش."
syntax:
  - "«والطحوران نعت لما قبلهما» [@ibn-al-anbari، ص177]، أي صفة لـ«عينان» في البيت 31. «والعوار منصوب بهما» [@ibn-al-anbari، ص177]، لأن «طحور» صيغة مبالغة تعمل عمل فعلها، فـ«عوار» مفعول به."
  - "«وهو مضاف إلى القذى. والكاف في موضع نصب بالرؤية» [@ibn-al-anbari، ص177]، أي أن «كمكحولتي» منصوبة المحل بالفعل «ترى»."
  - "«وأم فرقد نعت للمذعورة» [@ibn-al-anbari، ص177]. و«مكحولتي» مثنى حُذفت نونه للإضافة."
morphology:
  - "«طَحُور» على «فَعُول»، «مبالغة الطاحر، والفعل طحر يطحر» [@zawzani، ص101]."
  - "في «عُوّار» قولان: «والعوار جمع، واحده عائر» [@ibn-al-anbari، ص176]؛ وهو عند الزَّوْزَنِيّ مفرد جمعه «العواوير» [@zawzani، ص101]."
  - "للقذى أربعة أفعال: «ويقال: قذت عينه تقذى قذيا، إذا ألقت القذى؛ وقذيت تقذى قذى، إذا صار فيها القذى؛ وأقذيتها إقذاء، إذا ألقيت فيها القذى؛ وقذيتها تقذية، إذا نزعت منها القذى» [@ibn-al-anbari، ص176]."
rhetoric:
  thesis: "يتمّ صفة العينين: صحيحتان نظيفتان، وحادّتان كعيني بقرة وحشية تخاف على ولدها."
  devices:
    - title: "في التمثال: صحة العين وحدّتها"
      text: "في البيت السابق صفاء العينين وغؤورهما، وهنا صحتهما: لا قذى فيهما ولا رمد، قال أحمد بن عبيد: «معناه عينها صحيحة لا قذى فيها» [@ibn-al-anbari، ص176]. ثم حدّتهما: فالبقرة ذات الولد «إذا كانت مطفلا كان أرشق لها وأحد لنظرها» [@ibn-al-anbari، ص177]. والمطفل: ذات الطفل."
    - title: "عين بعين"
      text: "نقل ابن رَشِيق عن قدامة أن أفضل التشبيه «ما وقع بين شيئين اشتراكهما في الصفات أكثر من انفرادهما»، ثم قال إن تشبيه «أعضاء بأعضاء هي هي بعينها» قريب، «إلا أن فضل الشاعر فيه غير كبير حينئذ» [@ibn-rashiq، ج1 ص289]. وهذا البيت من ذلك: عين ناقة بعين بقرة. لكن طَرَفَة أضاف قيدين يصنعان الفضل: البقرة «مذعورة»، وهي «أم فرقد». فالخوف على الولد يجعل العين في أشد يقظتها."
    - title: "عين الحبيبة في وجه الناقة"
      text: "تشبيه العين بعين البقرة من صفات المرأة عندهم، فالشاعر الجاهلي يشبّه «عينها بعين البقرة والغزال» [@deif، ج1 ص221]. وقد قال ابن الأَنْبارِيّ في البيت 7 إن الحبيبة «تشبه البقر في حسن عينيها» [@ibn-al-anbari، ص141]. فالناقة هنا تأخذ صفة من صفات الحبيبة."
  connection: "ثم يصف أذنيها تسمعان في سير الليل الصوت الخفي والصوت العالي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "طَحُورَا / نِ عُوْوَارَلْ / قَذَى فَ / تَرَاهُمَا = فعولن / مفاعيلن / فعولُ / مفاعلن — كَمَكْحُو / لَتَيْ مَذْعُو / رَتِنْ أُمْ / مِ فَرْقَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]."
context: "البيت الثاني في العينين (31–32). وقد فرّق أحمد بن عبيد بين الظبية والبقرة في هذه الصورة: «الإرشاق يكون للظبية ولا يكون للبقرة. ويقال: أرشقت الظبية، إذا مدت عنقها. ولا يقال: البقرة أرشقت، لأن البقر كلها وقص» [@ibn-al-anbari، ص177]. والوَقَص: قصر العنق. فالبقرة لا تمد عنقها، وإنما تحدّ نظرها، والبيت في العين لا في العنق."
