first: "لَعَمْرُكَ مَا أَمْرِي عَلَيَّ بِغُمَّةٍ"
second: "نَهَارِي وَلَا لَيْلِي عَلَيَّ بِسَرْمَدِ"
meaning: "أقسم بحياتك: لا يلتبس عليّ أمري في نهاري، ولا يطول عليّ ليلي حتى يصير دائمًا. قال ابن الأَنْبارِيّ: «معناه إذا هممت بشيء أمضيته ولم يشتبه على الوجه فيه» [@ibn-al-anbari، ص228]."
vocabulary:
  - term: "لَعَمْرُكَ"
    text: "قسم بحياة المخاطب، «معناه وحياتك» [@ibn-al-anbari، ص201]."
  - term: "غُمَّةٍ"
    text: "«الغم. والغمة أيضا: الأمر المبهم الذي لا يهتدي له» [@ibn-al-anbari، ص228]. «وأصل الغم التغطية... ومنه الغمام؛ لأنه يغم السماء أي يغطيها» [@zawzani، ص119]."
  - term: "سَرْمَدِ"
    text: "«دائم» [@ibn-al-anbari، ص228]."
syntax:
  - "«والعمر مرفوع بجواب القسم، والأمر موضعه رفع بغمة؛ ونهاري موضعه نصب على الوقت» [@ibn-al-anbari، ص228]. وعند البصريين «لعمرك» مبتدأ خبره محذوف، أي: لعمرك قسمي؛ و«ما» نافية تعمل عمل «ليس»، و«أمري» اسمها، و«بغمة» خبرها والباء زائدة."
  - "«نهاري» ظرف زمان، أي في نهاري. و«ولا ليلي» معطوف على «أمري»، و«لا» لتأكيد النفي، و«بسرمد» معطوف على «بغمة»."
morphology:
  - "«سرمد»: قال الفراء: «يقولون سرمدا سمدا... فيجعلون سمدا تابعا لسرمد كما يقولون حسن بسن» [@ibn-al-anbari، ص228]. وهذا ما يسمى الإتباع: كلمة لا معنى لها وحدها تتبع أخرى في وزنها لتقويتها."
  - "«غُمّة» على «فُعْلة» من «غمّ يغمّ» [@zawzani، ص119]."
  - "«عَمْر» لغة في «العُمْر»، «لا يستعمل في القسم إلا بفتح العين» [@zawzani، ص110]."
rhetoric:
  thesis: "يفخر بمضاء العزم: لا يلتبس عليه أمر في النهار، ولا يطول عليه ليل بالهم."
  devices:
    - title: "الطباق"
      text: "«نهاري» و«ليلي»: الوقت كله. فلا ساعة يغلبه فيها الهم."
    - title: "الاستعارة"
      text: "الغمّة في أصلها التغطية، فجعل الأمر المشتبه غطاءً يُلقى على الرأي. وعبارة الزَّوْزَنِيّ: «ما تغطي الهموم رأيي في نهاري» [@zawzani، ص119]."
    - title: "الكناية"
      text: "طول الليل كناية عن الهم، لأن المهموم لا ينام فيطول ليله. قال ابن الأَنْبارِيّ: «ليس ليلي عليَّ بالدائم غير المنقطع، إذا نزل بي هم لا أتوجه فيه، ولكن ماض في أمري» [@ibn-al-anbari، ص228]."
  connection: "ثم يذكر يومًا من أيام الحرب حبس فيه نفسه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "لَعَمْرُ / كَ مَا أَمْرِي / عَلَيْيَ / بِغُمْمَتِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — نَهَارِي / وَلَا لَيْلِي / عَلَيْيَ / بِسَرْمَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "قال الزَّوْزَنِيّ: «وتلخيص المعنى: أنه تمدح بمضاء الصريمة وذكاء العزيمة» [@zawzani، ص119]، والصريمة: «إحكام الأمر والعزيمة فيه» [@zawzani، ص119، الحاشية]. ونلاحظ أن الهمّ يعود هنا بعد غياب طويل: في أول وصف الناقة كان يُمضيه برحلة (11)، وهنا يمضيه بعزمه."
