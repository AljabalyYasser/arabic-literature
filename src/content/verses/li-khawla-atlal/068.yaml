first: "فَمَا لِي أَرَانِي وَابْنَ عَمِّيَ مَالِكًا"
second: "مَتَى أَدْنُ مِنْهُ يَنْأَ عَنِّي وَيَبْعُدِ"
meaning: "ما بالي وابن عمي مالكًا: كلما اقتربت منه ابتعد عني؟ قال ابن الأَنْبارِيّ: «معناه: إذا أردت دنوه تباعد عني» [@ibn-al-anbari، ص202]. وقال الزَّوْزَنِيّ: «يستغرب هجرانه إياه مع تقربه منه» [@zawzani، ص111]."
vocabulary:
  - term: "مَالِكًا"
    text: "ابن عم طَرَفَة، يلومه ولا يعينه كما سيقول في الأبيات التالية."
  - term: "أَدْنُ"
    text: "أقترب."
  - term: "يَنْأَ"
    text: "يبعد. «يقال: قد نأى فلان، وقد ناء فلان، إذا بعد» [@ibn-al-anbari، ص202]."
syntax:
  - "«ما» استفهامية مبتدأ، و«لي» خبرها. وجملة «أراني» حال، و«ابنَ عمي» معطوف على ياء المتكلم في «أراني»، و«مالكًا» بدل منه."
  - "«متى» اسم شرط جازم، و«أدنُ» فعل الشرط مجزوم بحذف الواو، و«ينأَ» جوابه مجزوم بحذف الألف."
  - "«ونسق يبعد على ينأ، ومعناهما واحد لما اختلف اللفظان» [@ibn-al-anbari، ص202]."
morphology:
  - "«أدْنُ» أصله «أدنو»، حُذفت الواو للجزم؛ و«ينأَ» أصله «ينأى»، حُذفت الألف للجزم."
  - "«عمّيَ»: ياء المتكلم فيه مفتوحة، وهي لغة، وبها يستقيم الوزن."
rhetoric:
  thesis: "من فلسفة الموت إلى جرح الحياة: يبدأ قسم العتاب بسؤال حائر عن ابن عم يبتعد كلما اقترب منه."
  devices:
    - title: "الاستفهام للتعجب"
      text: "«فما لي أراني...؟» ليس سؤالًا عن جواب، بل تعجب من حال غريبة."
    - title: "الطباق"
      text: "«أدنُ» و«ينأَ»: القرب والبعد في شطر واحد، كل خطوة منه يقابلها ابتعاد من ابن عمه."
    - title: "الترادف"
      text: "«ينأ عني ويبعد»: لفظان بمعنى واحد، وعطف أحدهما على الآخر جائز «لما اختلف اللفظان» [@ibn-al-anbari، ص202]. وعند الزَّوْزَنِيّ «فجمع بينهما للتأكيد وإثبات القافية» [@zawzani، ص111]."
  connection: "ثم يقول في البيت التالي: يلومني ولا أدري على أي شيء، كما لامني قُرْط بن أَعْبَد."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَمَا لِي / أَرَانِي وَبْ / نَ عَمْمِ / يَ مَالِكَنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — مَتَى أَدْ / نُ مِنْهُ يَنْ / أَ عَنْنِي / وَيَبْعُدِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "يبدأ قسم العتاب (68–81). وللقسم قصة يرويها ابن الأعرابي: كانت لطَرَفَة ولأخيه مَعْبَد إبل يرعيانها يومًا ويومًا، فأهملها طَرَفَة، فقال له معبد: «كأنك ترى أنها إن أخذت يردها شعرك هذا!»، فتركها طَرَفَة فأخذها ناس من مضر [@ibn-al-anbari، ص204]. فطلب العون من ابن عمه مالك فلم يُعِنه. ولهذا يقول بعد أبيات: «على غير ذنب قلته غير أنني / نشدت فلم أغفل حمولة معبد»."
