first: "وَأَتْلَعُ نَهَّاضٌ إِذَا صَعَّدَتْ بِهِ"
second: "كَسُكَّانِ بُوصِيٍّ بِدِجْلَةَ مُصْعِدِ"
meaning: "ولها عنق طويل مشرف، ينهض في السير، إذا رفعته في الجو كان كسكّان سفينة تصعد في دجلة. قال الزَّوْزَنِيّ: «هي طويلة العنق فإذا رفعت عنقها أشبه ذنب سفينة في دجلة تصعد» [@zawzani، ص100]."
vocabulary:
  - term: "أَتْلَعُ"
    text: "«يعنى عنقها. والاتلع: المشرف. والتلع: الطول والإشراف» [@ibn-al-anbari، ص171]."
  - term: "نَهَّاضٌ"
    text: "«ينهض في السير، إذا سارت ارتفع» [@ibn-al-anbari، ص171]."
  - term: "صَعَّدَتْ"
    text: "«معناه اشخصته في السماء» [@ibn-al-anbari، ص172]، أي رفعته."
  - term: "سُكَّانِ"
    text: "«السُّكان: ذنب السفينة» [@zawzani، ص100]، أي ما تُوجَّه به. وقال أبو جعفر: «جعله كالسكان، أراد الدقل» [@ibn-al-anbari، ص172]، والدَّقَل: سارية السفينة."
  - term: "بُوصِيٍّ"
    text: "«السفينة، وهو فارسي معرب» [@ibn-al-anbari، ص172]. و«ضرب من السفن» [@zawzani، ص100]."
  - term: "مُصْعِدِ"
    text: "السائر في النهر صُعُدًا. «ويقال: قد أصعد في الأرض، إذا ابعد فيها» [@ibn-al-anbari، ص172]."
syntax:
  - "«والاتلع يرتفع بمعنى ولها أتلع» [@ibn-al-anbari، ص172]، أي: ولها عنق أتلع؛ فحُذف الخبر «لها»، وحُذف الموصوف «عنق»."
  - "«والكاف في موضع رفع على النعت بأتلع» [@ibn-al-anbari، ص172]. و«إذا صعّدت به» شرط جوابه محذوف يدل عليه التشبيه، و«إذا صعدت به أي: بالعنق، والباء للتعدية» [@zawzani، ص100]."
  - "«والمصعد نعت للبوصي، والباء صلة مصعد» [@ibn-al-anbari، ص172]، أي أن «بدجلة» متعلق بـ«مصعد». و«دجلة» ممنوعة من الصرف للعلمية والتأنيث، فجُرّت بالفتحة."
morphology:
  - "«أتلع» صفة على «أفعل»، من «التلع» وهو «الطول والإشراف» [@ibn-al-anbari، ص171]."
  - "«نهّاض» على «فعّال»، «مبالغة الناهض» [@zawzani، ص100]."
  - "«مُصْعِد» اسم فاعل من «أصعد» الرباعي، و«صعّد» في الصدر من المضعّف. «وقد أصعد في الجبل يصعد إصعادا. وقد صعد في الدرجة والسلم يصعد صعودا» [@ibn-al-anbari، ص172]."
rhetoric:
  thesis: "العنق سكّان سفينة في دجلة: البحر الذي بدأت به المعلقة في سفن الظعائن يعود في عنق الناقة."
  devices:
    - title: "في التمثال: العنق"
      text: "بعد الكتفين يرفع العنق، ويصفه طولًا وحركة: «أتلع» للطول، و«نهّاض» للنهوض في السير. فالعنق لا يُرى ساكنًا. وقال أبو جعفر: «للناقة سيرتان، فإذا أرقلت وارتفعت في سيرها رفعت رأسها، وإذا دفت مدت عنقها، كأنها ترجم بمشفرها الأرض» [@ibn-al-anbari، ص172]. وهذا البيت في السيرة الأولى."
    - title: "التشبيه بين البعيدين"
      text: "عنق ناقة في الصحراء، وسكّان سفينة في نهر العراق. يقول ابن رَشِيق: «وإنما حسن التشبيه أن يقرب بين البعيدين حتى تصير بينهما مناسبة واشتراك» [@ibn-rashiq، ج1 ص289]. والمشترك عند الزَّوْزَنِيّ «الارتفاع والانتصاب» [@zawzani، ص100]."
    - title: "عودة البحر"
      text: "بدأت المعلقة بسفن عظيمة تشق الماء (3–5)، وهنا يعود البحر في صورة جزئية. ويذكر شوقي ضيف أنهم قد يشبّهون الناقة «بالسفن والقناطر» [@deif، ج1 ص214]. وطَرَفَة ابن ساحل، فالسفن حاضرة في خياله."
  connection: "ثم يصف جمجمتها الصلبة كالسندان."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَأَتْلَ / عُ نَهْهَاضُنْ / إِذَا صَعْ / عَدَتْ بِهِي = فعولُ / مفاعيلن / فعولن / مفاعلن — كَسُكْكَا / نِ بُوصِيْيِنْ / بِدِجْلَ / ةَ مُصْعِدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "أول أبيات الرأس (28–35): العنق، ثم الجمجمة، ثم الوجه والمشفر، ثم العينان والأذنان، ثم القلب. وقيد «مصعد» مقصود عند أبي جعفر: «أراد الدقل فلذلك قال مصعد؛ لأن السفينة إذا أصعدت انصب دقلها ومدت» [@ibn-al-anbari، ص172]، أي أن السفينة التي تسير صُعُدًا في النهر تُرفع ساريتها وتُمدّ."
variants:
  - reading: "كَسُكَّانِ نُوتِيٍّ بِدِجْلَةَ مُصْعِدِ"
    status: "رواية أبي عُبَيْدة"
    note: "والنوتيّ: «الملاح، وهم النواتي» [@ibn-al-anbari، ص172]."
