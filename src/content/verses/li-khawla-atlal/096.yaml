first: "وَلَوْ كُنْتُ وَغْلًا فِي الرِّجَالِ لَضَرَّنِي"
second: "عَدَاوَةُ ذِي الْأَصْحَابِ وَالْمُتَوَحِّدِ"
meaning: "لو كنت ضعيفًا دخيلًا في الرجال، لضرّتني عداوة من له أصحاب، وعداوة من هو وحده. قال الزَّوْزَنِيّ: «لو كنت ضعيفًا من الرجال لضرّتني معاداة ذي الأتباع والمنفرد الذي لا أتباع له، إياي، ولكنني قوي منيع لا تضرني معاداتهما إياي» [@zawzani، ص118]."
vocabulary:
  - term: "وَغْلًا"
    text: "«الضعيف من الرجال». و«الوغل: الضعيف في القوم وليس منهم» [@ibn-al-anbari، ص226]. وعند الزَّوْزَنِيّ: «أصله الضعيف يستعار للئيم» [@zawzani، ص118]. ومن أصله «الواغل: الداخل على القوم في شرابهم من غير أن يدعى» [@ibn-al-anbari، ص226]."
  - term: "ذِي الْأَصْحَابِ"
    text: "«أي عداوة من كان معه جماعة» [@ibn-al-anbari، ص226]."
  - term: "الْمُتَوَحِّدِ"
    text: "«الفرد من الرجال الذي ليس معه أحد» [@ibn-al-anbari، ص226]."
syntax:
  - "«لو» حرف امتناع لامتناع، و«كنتُ وغلًا» شرطها، و«لضرّني» جوابها، واللام فيه للتوكيد."
  - "«وإنما ذكر الفعل وقال: (لضرني عداوة)، ولم يقل ضرتني، لأنه حمله على معنى لضرني بُغض ذي الأصحاب» [@ibn-al-anbari، ص227]. فـ«عداوة» فاعل مؤنث في لفظه، وذُكّر فعله حملًا على المعنى."
  - "«والمتوحّد» معطوف على «ذي الأصحاب»."
morphology:
  - "«المتوحِّد» اسم فاعل على «متفعِّل» من الوحدة. «ويقال متوحد، ووحد، وأحد. والأصل في أحد وحد، فأبدلوا من الواو المفتوحة همزة، وهذا قليل في المفتوحة» [@ibn-al-anbari، ص226]."
  - "«عداوة» مصدر «عادى»: «يقال: عاداه معاداة وعداوة». وجمع العدو «أعداء» و«عِدًى» و«عُداة» [@ibn-al-anbari، ص226]."
  - "«وَغْل» من «وغل يغل وغولا» [@ibn-al-anbari، ص226]."
rhetoric:
  thesis: "يثبت قوته بافتراض ضعفه: لو كنت ضعيفًا لكان كذا، ولست ضعيفًا."
  devices:
    - title: "الشرط الممتنع"
      text: "«لو» تفترض ما لم يقع. فهو يتخيل نفسه ضعيفًا ليُري السامع ما كان سيحدث، ثم ينفيه في البيت التالي بـ«ولكن»."
    - title: "الطباق"
      text: "«ذي الأصحاب» و«المتوحد»: الجماعة والفرد. فالعداوة من كل جهة، ومع ذلك لا تضره."
    - title: "الاستعارة في «وغل»"
      text: "الوغل في أصله الضعيف، و«يستعار للئيم» كما يقول الزَّوْزَنِيّ [@zawzani، ص118]. ومن أصله الواغل الذي يدخل على الشاربين بلا دعوة [@ibn-al-anbari، ص226]. وشاعر الحانات يعرف هذا الدخيل، وينفي أن يكون منه."
  connection: "ثم يستدرك: ولكن جرأتي وإقدامي وصدقي وأصلي نفت عني الأعداء."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلَوْ كُنْ / تُ وَغْلَنْ فِرْ / رِجَالِ / لَضَرْرَنِي = فعولن / مفاعيلن / فعولُ / مفاعلن — عَدَاوَ / تُ ذِلْأَصْحَا / بِ وَلْمُ / تَوَحْحِدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "هذا البيت والذي بعده حجة واحدة: «لو... ولكن». يفترض في الأول ما لم يكن، ويثبت في الثاني ما كان."
