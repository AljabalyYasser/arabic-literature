first: "أَرَى قَبْرَ نَحَّامٍ بَخِيلٍ بِمَالِهِ"
second: "كَقَبْرِ غَوِيٍّ فِي الْبَطَالَةِ مُفْسِدِ"
meaning: "أرى قبر البخيل الحريص على ماله مثل قبر الضالّ المسرف في لهوه. قال ابن الأَنْبارِيّ: «فيقول: إن الشحيح بماله، وهذا الفاتك المبذر؛ يصيران إلى الموت، ولا ينفع الشحيح شحه» [@ibn-al-anbari، ص200]."
vocabulary:
  - term: "نَحَّامٍ"
    text: "«الزحار عند السؤال البخيل» [@ibn-al-anbari، ص199]، أي الذي يتنحنح ويئن إذا سُئل. وعند الزَّوْزَنِيّ: «الحريص على الجمع والمنع» [@zawzani، ص110]."
  - term: "غَوِيٍّ"
    text: "«الغاوي الضال، والغَيّ والغواية الضلالة» [@zawzani، ص110]."
  - term: "الْبَطَالَةِ"
    text: "اللهو وترك الجد."
syntax:
  - "«والقبر اسم أرى. والكاف منصوبة على خبر أرى» [@ibn-al-anbari، ص200]؛ أي «أرى» هنا بمعنى أعلم، تنصب مفعولين."
  - "«ومفسد نعت الغوي، وفي البطالة صلة مفسد» [@ibn-al-anbari، ص200]، أي متعلق به."
  - "«بخيلٍ» نعت لـ«نحّام»، و«بماله» متعلق بـ«بخيل»."
morphology:
  - "«نَحّام» على «فعّال»، صيغة مبالغة من «نحم ينحم نَحْمًا ونَحَمًا»، والنحيم «شبيه بالزحير» [@ibn-al-anbari، ص199]."
  - "«غَوِيّ» على «فعيل» من «غوى يغوي» [@zawzani، ص110]."
  - "«بطالة» مصدر على «فَعالة»."
rhetoric:
  thesis: "الموت يسوّي بين نقيضين: من أمسك ماله ومن أفسده. فالبخل لا يشتري شيئًا."
  devices:
    - title: "التشبيه"
      text: "شبّه قبر البخيل بقبر المسرف، والمراد أنهما واحد بعد الموت. «لا فرق بين البخيل والجواد بعد الوفاة فلم أبخل بأعلاقي» [@zawzani، ص110]."
    - title: "المقابلة"
      text: "قابل بين «نحّام بخيل بماله» و«غويّ في البطالة مفسد»، طرفين متضادين في الحياة، ثم جمعهما في كلمة واحدة: القبر."
  connection: "ثم يصف القبرين كومتين من التراب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَرَى قَبْ / رَ نَحْحَامِنْ / بَخِيلِنْ / بِمَالِهِي = فعولن / مفاعيلن / فعولن / مفاعلن — كَقَبْرِ / غَوِيْيِنْ فِلْ / بَطَالَ / ةِ مُفْسِدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "جعله ابن قُتَيْبة والأبيات الثلاثة بعده «من جيد شعره» [@ibn-qutayba، ج1 ص183]. وهو قلب حجة طَرَفَة: إن كان المصير واحدًا فالعاقل من أنفق."
