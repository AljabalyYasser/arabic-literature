    note: "[@ibn-al-anbari، ص224]."
  - reading: "وَشُقِّي عَلَيَّ الْجَيْبَ يَا أُمَّ مَعْبَدِ"
    status: "رواية المُرْتَضَى"
    note: "[@murtada، ج1 ص341]. ونبّه محققه على أن الرواية في شرح التبريزي «يا ابنة معبد» [@murtada، ج1 ص341، الحاشية]."
