first: "فَإِنْ مُتُّ فَانْعِينِي بِمَا أَنَا أَهْلُهُ"
second: "وَشُقِّي عَلَيَّ الْجَيْبَ يَا ابْنَةَ مَعْبَدِ"
meaning: "فإن متُّ يا ابنة أخي معبد، فأذيعي خبر موتي، واذكري من أفعالي ما أستحقه، وشقّي عليّ جيب ثوبك. قال ابن الأَنْبارِيّ: «معناه فاذكريني واذكري من أفعالي ما أنا أهله» [@ibn-al-anbari، ص223]."
vocabulary:
  - term: "انْعِينِي"
    text: "«فاذكريني واذكري من أفعالي ما أنا أهله» [@ibn-al-anbari، ص223]. وعند الزَّوْزَنِيّ: «النعي: إشاعة خبر الموت» [@zawzani، ص117]."
  - term: "أَهْلُهُ"
    text: "«أهله أي مستحقه» [@zawzani، ص117]."
  - term: "الْجَيْبَ"
    text: "«من القميص ونحوه، ما يدخل منه الرأس عند لبسه» [@zawzani، ص117، الحاشية]. «إنما خص الجيب لأن الشق من الجيب أمكن» [@ibn-al-anbari، ص224]."
  - term: "ابْنَةَ مَعْبَدِ"
    text: "ابنة أخيه: «أوصى ابنة أخيه -ومعبدٌ أخوه-» [@zawzani، ص117]."
syntax:
  - "«والفاء جواب الجزاء، وما في معنى الذي، وأنا مرفوع بالأهل، والتقدير: فانعيني بالذي أنا مستأهله» [@ibn-al-anbari، ص224]. أي الفاء واقعة في جواب الشرط، و«أنا مرفوع بالأهل» على مذهب الكوفيين؛ وعند البصريين «أنا» مبتدأ و«أهله» خبره، والجملة صلة «ما»."
  - "«فإنْ متُّ» شرط، وجوابه «فانعيني» مقترن بالفاء لأنه طلب."
  - "«يا ابنةَ معبد» منادى مضاف منصوب."
morphology:
  - "«انعِيني» فعل أمر للمخاطبة من «نعى»، وياء المخاطبة فاعل، والنون للوقاية، وياء المتكلم مفعول به."
  - "«الشقّ»: «ويقال شققت الشيء شقا. والشق: نصف الشيء. والشق أيضا: المشقة» [@ibn-al-anbari، ص224]."
  - "«جيب» جمعه «جيوب»، «وقد جبت القميص وجيبته، أي قطعت جيبه» [@ibn-al-anbari، ص224]."
rhetoric:
  thesis: "بعد تعداد مفاخره يوصي بموته، ويريد أن يبقى فخره نفسه يرويه النادبون."
  devices:
    - title: "من الفخر إلى الرثاء"
      text: "قال الزَّوْزَنِيّ: «لما فرغ من تعداد مفاخره أوصى ابنة أخيه» [@zawzani، ص117]. فالنعي الذي يطلبه هو الفخر نفسه يُعاد بعد موته: «بما أنا أهله»."
    - title: "الأمر في الوصية"
      text: "«فانعيني... وشقّي»: أمران يرسمان مأتمًا كاملًا، القول والفعل. «يوصيها بالثناء عليه والبكاء» [@zawzani، ص117]."
    - title: "النداء في القافية"
      text: "جعل النداء «يا ابنة معبد» في آخر البيت، فانتهى باسم أخيه معبد. ولعل في ذلك ما يعيدنا إلى أول العتاب، حين ضاعت إبل معبد (71)."
  connection: "ثم يقول لها: لا تسوّي بيني وبين رجل لا يهمّ همّي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَإِنْ مُتْ / تُ فَنْعِينِي / بِمَا أَ / نَ أَهْلُهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — وَشُقْقِي / عَلَيْيَلْ جَيْ / بَ يَبْنَ / تَ مَعْبَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "يبدأ الوصية (93–97). ومعبد أخو طَرَفَة [@ibn-al-anbari، ص204]، وهو صاحب الإبل التي ضاعت فكانت سبب العتاب. والوصية بالنوح عادة جاهلية معروفة: قال الشريف المُرْتَضَى: «لأنّ الجاهلية كانوا يرون البكاء عليهم والنوح فيأمرون به، ويؤكدون الوصية بفعله وهذا مشهور عنهم؛ قال طرفة بن العبد...»، ثم أنشد البيت [@murtada، ج1 ص341]."
variants:
