first: "لِخَوْلَةَ أَطْلَالٌ بِبُرْقَةِ ثَهْمَدِ"
second: "تَلُوحُ كَبَاقِي الْوَشْمِ فِي ظَاهِرِ الْيَدِ"
meaning: "لخَوْلَة آثار ديار في بُرْقَة ثَهْمَد، تلمع كما تلمع بقايا الوشم في ظاهر الكف [@zawzani، ص89]."
vocabulary:
  - term: "خَوْلَةَ"
    text: "امرأة من كلب، ذكر ذلك هِشام الكَلْبِيّ [@ibn-al-anbari، ص132]."
  - term: "أَطْلَالٌ"
    text: "جمع طلل، وهو ما شخص من آثار الدار [@ibn-al-anbari، ص132]."
  - term: "بُرْقَةِ"
    text: "رابية فيها رمل وطين، أو طين وحجارة يختلطان [@ibn-al-anbari، ص132]."
  - term: "ثَهْمَدِ"
    text: "موضع [@ibn-al-anbari، ص132]."
  - term: "تَلُوحُ"
    text: "تبرق وتلمع [@ibn-al-anbari، ص133]."
  - term: "الْوَشْمِ"
    text: "أن يُغرز الجلد بالإبرة ثم يُذرّ عليه الكحل أو النَّؤُور، فيبقى سواده ظاهرًا [@ibn-al-anbari، ص133]."
syntax:
  - "«أَطْلَالٌ» مبتدأ مؤخر، و«لِخَوْلَةَ» خبر مقدم. و«خَوْلَة» مجرورة بالفتحة لأنها ممنوعة من الصرف [@ibn-al-anbari، ص134]."
  - "«تَلُوحُ» جملة في موضع الصفة لـ«أَطْلَالٌ» أو الحال منها؛ ولابن الأنباري في إعراب البيت أربعة أوجه [@ibn-al-anbari، ص134]."
  - "«بِبُرْقَةِ ثَهْمَدِ» متعلق بـ«تَلُوحُ» أو بـ«أَطْلَالٌ»، و«كَبَاقِي الْوَشْمِ» صفة لمصدر محذوف: تلوح لوحًا كباقي الوشم."
morphology:
  - "«أَطْلَالٌ» جمع «طَلَل»، ويُجمع أيضًا على «طُلُول» [@ibn-al-anbari، ص132]."
  - "«تَلُوحُ» من «لاح يلوح» إذا لمع؛ ومنه قيل للثور الوحشي «لَيَاح» لبريقه وبياضه [@ibn-al-anbari، ص133]."
  - "«الْوَشْمِ» مصدر «وشم يشم»، والفاعلة واشمة، والمفعولة موشومة [@ibn-al-anbari، ص133]."
rhetoric:
  thesis: "يبدأ طَرَفَة كما بدأ امرؤ القَيْس: بأطلال حبيبة. لكنه يرى الأثر لامعًا لا ممحوًّا؛ فالدار عنده كالوشم، يبقى في الجلد وإن قدُم."
  devices:
    - title: "التشبيه"
      text: "شبّه لمعان آثار ديارها ووضوحها بلمعان آثار الوشم في ظاهر الكف [@zawzani، ص89]. والوشم لا يزول، فالتشبيه يوحي بأن الذكرى باقية كذلك."
    - title: "تقديم اسمها"
      text: "بدأ البيت باسمها «لِخَوْلَةَ» قبل الأطلال نفسها؛ فالمهم عنده صاحبة الديار لا الديار."
  connection: "وبيته الثاني يكاد يطابق بيت امرئ القَيْس: «وُقُوفًا بِهَا صَحْبِي عَلَيَّ مَطِيَّهُمْ ... يَقُولُونَ لَا تَهْلِكْ أَسًى وَتَجَلَّدِ» [@ibn-al-anbari، ص135]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "لِخَوْلَ / ةَ أَطْلَالُنْ / بِبُرْقَ / ةِ ثَهْمَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — تَلُوحُ / كَبَاقِلْ وَشْ / مِ فِي ظَا / هِرِلْ يَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "جاءت «فعولن» مقبوضة «فعولُ» ثلاث مرات، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "مطلع ثانية المعلقات في ترتيب ابن الأَنْبارِيّ. وطَرَفَة ممن لم يشتهر لهم إلا قصيدة واحدة طويلة، وعدّه أبو عُبَيْدة أحد ثلاثة هم أجود هؤلاء [@ibn-al-anbari، ص432]."
variants:
  - reading: "ظَلِلْتُ بِهَا أَبْكِي وَأَبْكِي إِلَى الْغَدِ"
    status: "متن ابن الأَنْبارِيّ"
    note: "هذا العَجُز في متن ابن الأَنْبارِيّ، أما «تَلُوحُ كَبَاقِي الْوَشْمِ فِي ظَاهِرِ الْيَدِ» فرواية الأَصْمَعِيّ عنده [@ibn-al-anbari، ص132–133]، وهي رواية الزَّوْزَنِيّ [@zawzani، ص89]، وبها اشتهر البيت."
