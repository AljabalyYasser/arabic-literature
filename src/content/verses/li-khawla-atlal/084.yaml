first: "حُسَامٍ إِذَا مَا قُمْتُ مُنْتَصِرًا بِهِ"
second: "كَفَى الْعَوْدَ مِنْهُ الْبَدْءُ لَيْسَ بِمِعْضَدِ"
meaning: "سيف قاطع، إذا قمت أنتصر به من عدوي أغنت ضربته الأولى عن الثانية، وليس من السيوف الرديئة التي يُقطع بها الشجر. قال ابن الأَنْبارِيّ: «يقول: كفت الضربة الأولى التي بدأ بها أن يعود ثانية» [@ibn-al-anbari، ص214]."
vocabulary:
  - term: "حُسَامٍ"
    text: "«القاطع من السيوف. ويقال للرجل الماض: إنه لحسام» [@ibn-al-anbari، ص214]."
  - term: "مُنْتَصِرًا"
    text: "فيه ثلاثة أقوال: «متابعا للضرب»، و«ناصرا»، وقال أبو جعفر: «انتصر من ظلمي» [@ibn-al-anbari، ص214]. وعند الزَّوْزَنِيّ: «الانتصار: الانتقام» [@zawzani، ص115]."
  - term: "الْعَوْدَ مِنْهُ الْبَدْءُ"
    text: "الضربة الثانية والضربة الأولى [@ibn-al-anbari، ص214]."
  - term: "مِعْضَدِ"
    text: "«الردى من السيوف التي تمتهن في قطع الشجر. وما قطع من الشجر فهو عضد» [@ibn-al-anbari، ص214]. والرَّدِيّ: الرديء، وتُمتهن: تُبتذل في الخدمة."
syntax:
  - "«حسامٍ» مجرور تبعًا لـ«أبيض» في البيت السابق."
  - "«ونصب (منتصرا) على الحال من التاء. والبدء يرتفع بكفى، واسم ليس مضمر فيها» [@ibn-al-anbari، ص214]. أي «البدءُ» فاعل «كفى»، و«العودَ» مفعول به تقدّم على فاعله، واسم «ليس» ضمير يعود على السيف، و«بمعضد» خبرها والباء زائدة."
  - "«إذا ما»: «ما» زائدة بعد «إذا» للتوكيد، و«قمتُ» فعل الشرط، وجملة «كفى...» جوابه."
morphology:
  - "«مِعْضَد» على «مِفْعَل»، وهو من أبنية اسم الآلة، من العَضْد: «والعضد قطع الشجر، والفعل عضد يعضد» [@zawzani، ص115]."
  - "«حُسام» من الحَسْم، وهو القطع: «ويقال: قد حسمته عن كذا وكذا وفطمته وقطعته بمعنى» [@ibn-al-anbari، ص214]."
  - "«منتصِر» اسم فاعل من «انتصر» على «افتعل»."
rhetoric:
  thesis: "سيف يكفي بضربة واحدة. فالمدح هنا للسيف وللذراع التي تضرب به معًا."
  devices:
    - title: "الطباق"
      text: "الطباق أن تجمع في الكلام بين الشيء وضده. وفي البيت «العود» و«البدء»: الرجوع والابتداء."
    - title: "البدء والعود"
      text: "تقول العرب في المثل: «العود أحمد»، أي إن من ابتدأ المعروف ثم عاد إليه كان أحق بالحمد [@maydani، ج2 ص34]. ونلاحظ أن سيف طَرَفَة يقلب هذه العادة في الحرب: البدء فيه يكفي، ولا حاجة إلى عود."
    - title: "المدح بنفي الضد"
      text: "«ليس بمعضد»: نفى عنه أحقر ما يُصنع بالحديد. قال الزَّوْزَنِيّ: «وليس سيفًا يقطع به الشجر، نفى ذلك؛ لأنه من أردأ السيوف» [@zawzani، ص115]."
  connection: "ثم يجعل السيف أخًا يوثق به."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "حُسَامِنْ / إِذَا مَا قُمْ / تُ مُنْتَ / صِرَنْ بِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — كَفَلْ عَوْ / دَ مِنْهُلْ بَدْ / ءُ لَيْسَ / بِمِعْضَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "البيت الثاني في السيف. وفي شرح ابن الأَنْبارِيّ أسماء كثيرة للسيف الكليل: «المعضد، والددان، والكهام، والمنثنى من السيوف: الكليل» [@ibn-al-anbari، ص214]. والكليل: الذي لا يقطع. فاختار طَرَفَة من بينها الاسم المأخوذ من قطع الشجر، وهو أدنى ما يُستعمل فيه الحديد."
