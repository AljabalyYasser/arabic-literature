first: "فَأَصْبَحْتُ ذَا مَالٍ كَثِيرٍ وَعَادَنِي"
second: "بَنُونَ كِرَامٌ سَادَةٌ لِمُسَوَّدِ"
meaning: "لو شاء الله لأصبحت صاحب مال كثير، ولكان لي بنون كرام يغشونني، سادة أبوهم سيد. قال الزَّوْزَنِيّ: «لو بلَّغني الله منزلتهما لصرت وافر المال، كريم العقب وهو الولد» [@zawzani، ص114]."
vocabulary:
  - term: "عَادَنِي"
    text: "«معناه واعتادني. وقال بعضهم: معناه آتوني وعضدوني» [@ibn-al-anbari، ص210]. واعتادني: تعوّدوا إتياني."
  - term: "بَنُونَ"
    text: "أبناء، جمع ابن."
  - term: "سَادَةٌ لِمُسَوَّدِ"
    text: "«قال يعقوب: هذا كما تقول: شريف لشريف» [@ibn-al-anbari، ص211]؛ أي سادة أبوهم سيد."
  - term: "مُسَوَّدِ"
    text: "من جعله قومه سيدًا، «يعني به نفسه» [@zawzani، ص114]."
syntax:
  - "«وموضع ذا مال نصب على خبر الإصباح. والبنون يرتفعون بفعلهم، والكرام والسادة نعتان لبنين. ويجوز نصب سادة على الحال، ولم يرو النصب أحد» [@ibn-al-anbari، ص211]. أي «ذا» خبر «أصبح»، و«بنون» فاعل «عادني»."
  - "«فأصبحتُ» معطوف على «كنتُ» في جواب «لو» في البيت السابق، فهو داخل في الأمنية: لم يصبح غنيًّا، بل كان سيصبح لو شاء الله."
  - "«لِمُسَوَّدِ» جار ومجرور متعلق بـ«سادة»: سادة منسوبون إلى أب مسوَّد."
morphology:
  - "«مُسَوَّد» اسم مفعول من «سوّد» على «فعّل»، «والتسويد مصدر سوَّدته فساد» [@zawzani، ص114]. «ويقال: ساد فلان بني فلان، واستادهم» [@ibn-al-anbari، ص211]."
  - "«سادة» جمع «سيّد» على «فَعَلة»، وأصلها «سَوَدة»، قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها."
  - "«عادني» و«اعتادني» بمعنى، ومنه العيد: «يقال: عاده عيد، إذا أتاه ما كان يعتاده من فرح أو حزن» [@ibn-al-anbari، ص211]."
rhetoric:
  thesis: "تمام الأمنية: المال في الشطر الأول، والبنون في الشطر الثاني، وهما ما عُرف به السيدان."
  devices:
    - title: "القسمة بين المال والولد"
      text: "الزَّوْزَنِيّ يصف السيدين «بوفور المال ونجابة الأولاد» [@zawzani، ص114]، والبيت يقسم الأمنية على الشطرين بهذا الترتيب نفسه."
    - title: "جناس الاشتقاق"
      text: "جناس الاشتقاق أن يجتمع في الكلام لفظان من أصل واحد. «سادة» و«مسوَّد» من «ساد»: السيادة موروثة، تنتقل من الأب إلى البنين."
    - title: "الماضي في الأمنية"
      text: "جاء بالماضي «فأصبحت» و«عادني» لشيء لم يقع. والماضي بعد «لو» يصوّر الأمنية كأنها وقعت."
  connection: "ثم يعود من الأمنية إلى ما يملكه فعلًا، نفسه: «أنا الرجل الجعد الذي تعرفونه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَأَصْبَحْ / تُ ذَا مَالِنْ / كَثِيرِنْ / وَعَادَنِي = فعولن / مفاعيلن / فعولن / مفاعلن — بَنُونَ / كِرَامُنْ سَا / دَتُنْ لِ / مُسَوْوَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "آخر أبيات العتاب (68–81). وفي خبر أبي عُبَيْدة أن عمرو بن مرثد أجاب عن الشطرين كليهما: «أما الولد فليس ذاك إلي فالله تعالى يعطيكم، وأما المال...»، ثم أعطاه هو وبنوه وحفدته. وكان الحفدة الذين أعطوا «يفخرون على سائر الأبناء الذين لم يعطوا طرفة، يقولون: جعلنا جدنا مثل بنيه» [@ibn-al-anbari، ص210]. ومن مفارقات الخبر أن أول الحفدة الثلاثة الذين أعطوه عبد عمرو بن بشر [@ibn-al-anbari، ص210]، وهو زوج أخت طَرَفَة الذي هجاه طَرَفَة بعد ذلك، فكان هجاؤه من أسباب مقتله [@ibn-qutayba، ج1 ص182–183]."
variants:
  - reading: "فَأَصْبَحْتُ ذَا مَالٍ كَثِيرٍ وَزَارَنِي"
    status: "رواية يعقوب"
    note: "[@ibn-al-anbari، ص210]. وهي رواية الزَّوْزَنِيّ [@zawzani، ص114]."
