first: "وَجَاشَتْ إِلَيْهِ النَّفْسُ خَوْفًا وَخَالَهُ"
second: "مُصَابًا وَلَوْ أَمْسَى عَلَى غَيْرِ مَرْصَدِ"
meaning: "وارتفعت نفس صاحبي إلى حلقه من الخوف فلم تستقر، وظن نفسه هالكًا، ولو أمسى في موضع لا يترصّده فيه عدو. قال ابن الأَنْبارِيّ: «(وخاله مصابا) معناه ظن أنه هالك ولو أمسى وليس يرصده عدوه» [@ibn-al-anbari، ص183]."
vocabulary:
  - term: "جَاشَتْ"
    text: "«معناه ارتفعت إليه»، «ولم تستقر، كما تجيش القدر، إذا ارتفع غليانها» [@ibn-al-anbari، ص183]. و«(إليه) معناه إلى صاحبه» [@ibn-al-anbari، ص183]."
  - term: "خَالَهُ"
    text: "«خاله: أي ظنه، والخيلولة الظن» [@zawzani، ص103]."
  - term: "مُصَابًا"
    text: "هالكًا: «ظن أنه هالك» [@ibn-al-anbari، ص183]."
  - term: "مَرْصَدِ"
    text: "«المرصد: الطريق، والجمع المراصد، وكذلك المرصاد» [@zawzani، ص103]. وهو عند ابن الأَنْبارِيّ موضع الترصّد: «ولو أمسى في موضع لا يرصد فيه» [@ibn-al-anbari، ص183]."
syntax:
  - "«والنفس يرتفع بجاشت، وإليه صلة جاشت» [@ibn-al-anbari، ص183]: «النفس» فاعل، و«إليه» متعلق بالفعل. و«خوفًا» مفعول لأجله: جاشت من أجل الخوف."
  - "«وما في خاله يرتفع به، والهاء اسم خال، ومصابا خبره» [@ibn-al-anbari، ص183]: فاعل «خال» ضمير مستتر يعود على الصاحب، والهاء مفعوله الأول، و«مصابًا» مفعوله الثاني. ويسميهما ابن الأَنْبارِيّ اسمًا وخبرًا لأن أصلهما مبتدأ وخبر. والأظهر فيما نرى أن الهاء تعود على الصاحب نفسه: ظنّ نفسه مصابًا؛ وهذا جائز في أفعال الظن خاصة."
  - "«لو» هنا للمبالغة: يظن ذلك حتى لو أمسى آمنًا. و«على» بمعنى «في»: «و (عَلَى) معناه في والتقدير ولو أمسى في موضع لا يرصد فيه» [@ibn-al-anbari، ص183]."
morphology:
  - "«جاشت» من «جاش يجيش»، وأصل الجيش الغليان: «كما تجيش القدر» [@ibn-al-anbari، ص183]."
  - "«خال» من «خال يخال» بمعنى ظنّ، ومصدره «الخيلولة» [@zawzani، ص103]."
  - "«مَرْصَد» اسم مكان من «رصد»، ومثله «المرصاد» [@zawzani، ص103]. و«مُصاب» اسم مفعول من «أصاب»."
rhetoric:
  thesis: "صورة الصاحب الخائف تكتمل: نفس تغلي كالقدر، وظنّ بالهلاك بلا سبب. وكلما اشتد خوفه ظهر ثبات الشاعر."
  devices:
    - title: "الاستعارة"
      text: "«جاشت» في الأصل للقدر إذا غلت، وقد جعلها للنفس، وبها فسّرها ابن الأَنْبارِيّ: «كما تجيش القدر، إذا ارتفع غليانها» [@ibn-al-anbari، ص183]. والاستعارة عند عبد القاهر الجُرْجانيّ أن يكون للفظ «أصلٌ في الوضع اللغوي معروفٌ»، «ثم يستعمله الشاعر أو غير الشاعر في غير ذلك الأصل» [@asrar، ص30]."
    - title: "المبالغة"
      text: "«ولو أمسى على غير مرصد»: يظن الهلاك حتى حين لا عدو ولا طريق مخوف. قال الطُّوسِيّ: «معناه على غير سبيل هلكة ولا خوف» [@ibn-al-anbari، ص183]. فالخوف في الصاحب لا في المكان، وسببه عند الزَّوْزَنِيّ «صعوبة هذه الفلوات» [@zawzani، ص103]."
    - title: "نفس تجيش ولا تستقر"
      text: "أنشد ابن الأَنْبارِيّ في معناه قول عمرو بن معد يكرب: «فجاشتْ إليّ النَّفسُ أولَ مرّةٍ ... فرُدّتْ على مكروهها فاستقرّتِ» [@ibn-al-anbari، ص183]. وقد اعترض بعضهم على عمرو: «لولا أنه جبن لما جاشت إليه النفس»، فأجاب المَرْزُوقِيّ بأن «نفس الجبان والشجاع على طريقة واحدة فيما يدهمها عند الوهلة الأولى، ثم يختلفان: فالجبان يركب نفرته، والشجاع يدفعها فيثبت» [@marzuqi-hamasa، ص117–118]. ونفس صاحب طَرَفَة جاشت «ولم تستقر» [@ibn-al-anbari، ص183]، فهو ممن يركب نفرته، والشاعر يترك الحكم على نفسه للبيت التالي."
  connection: "ثم يجيب الشاعر: «إذا القوم قالوا من فتى خلت أنني عنيت فلم أكسل ولم أتبلد»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَجَاشَتْ / إِلَيْهِنْ نَفْ / سُ خَوْفَنْ / وَخَالَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — مُصَابَنْ / وَلَوْ أَمْسَى / عَلَى غَيْ / رِ مَرْصَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "يتمّ البيت 39: هناك صاحبه يتمنى أن يفدي الشاعر ويفدي نفسه من الفلاة، ويقول، كما فسّره ابن الأَنْبارِيّ، «أنا هالكون من خوف الفلاة» [@ibn-al-anbari، ص182]؛ وهنا يظن نفسه هالكًا. وبين البيتين والبيت 41 مقابلة: خوف الصاحب هنا، وإقدام الشاعر هناك. وعلى قراءة أبي جعفر للبيت 41، «إذا قالوا: من فتى يحدو بنا لننجو» [@ibn-al-anbari، ص183]، يكون نداء القوم صدى لهذا الخوف."
