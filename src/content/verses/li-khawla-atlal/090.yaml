first: "وَقَالَ أَلَا مَاذَا تَرَوْنَ بِشَارِبٍ"
second: "شَدِيدٍ عَلَيْكُمْ بَغْيُهُ مُتَعَمِّدِ"
meaning: "ثم قال الشيخ للحاضرين: ماذا ترون أن نصنع بهذا الشارب، الذي يشتد عدوانه عليكم عن عمد؟ قال الزَّوْزَنِيّ: «يريد أنه استشار أصحابه في شأني وقال: ماذا نحتال في دفع هذا الشارب الذي يشرب الخمر ويبغي علينا بعقر كرائم أموالنا ونحرها متعمدًا قاصدًا؟» [@zawzani، ص116–117]."
vocabulary:
  - term: "أَلَا"
    text: "«افتتاح للكلام» [@ibn-al-anbari، ص221]، أي حرف يُنبَّه به السامع."
  - term: "شَارِبٍ"
    text: "شارب الخمر [@zawzani، ص116]."
  - term: "بَغْيُهُ"
    text: "ظلمه وعدوانه."
  - term: "مُتَعَمِّدِ"
    text: "قاصد، يفعل ذلك «عن تعمد وقصد» [@zawzani، ص116]."
syntax:
  - "«و(ألا) افتتاح للكلام، وموضع ماذا نصب بترون. ويجوز أن يجعل ما في موضع رفع ويكون التقدير: ما الذي ترونه بشارب» [@ibn-al-anbari، ص221]. أي «ماذا» كلمة واحدة مفعول به، أو «ما» مبتدأ و«ذا» بمعنى «الذي»."
  - "«وشديد مخفوض على النعت لشارب، والبغي يرتفع بمعنى شديد» [@ibn-al-anbari، ص221]، أي «بغيُه» فاعل للصفة «شديد». و«متعمّد» نعت آخر."
  - "«والباء في قوله بشارب صلة محذوف تقديره أن يفعل ونحوه» [@zawzani، ص117]: ماذا ترون أن يُفعل بشارب. و«صلة» هنا بمعنى متعلَّق."
morphology:
  - "«متعمِّد» اسم فاعل من «تعمّد» على «تفعّل»."
  - "«متعيِّد» في الرواية الأخرى اسم فاعل من «تعيّد» على «تفعّل»، و«المتعيد: الظلوم» [@ibn-al-anbari، ص221]."
  - "«شارب» اسم فاعل من «شرب»، ولم يُذكر مفعوله لأنه معروف: الخمر."
rhetoric:
  thesis: "الشيخ يرفع القضية إلى الجماعة، ويسمّي طَرَفَة بما عُرف به: شارب."
  devices:
    - title: "الاستفهام للاستشارة"
      text: "«ماذا ترون» سؤال يطلب رأيًا، فالشيخ «استشار أصحابه» كما يقول الزَّوْزَنِيّ [@zawzani، ص116]. وهو غير استفهام البيت السابق الذي كان توبيخًا."
    - title: "التنكير"
      text: "«بشارب»: لم يسمّه، بل نكّره. فصار الوصف تهمة تكفي عن الاسم."
    - title: "الاعتراف في لسان الخصم"
      text: "التهمة التي يرميه بها الشيخ هي ما فخر به طَرَفَة نفسه في المعلقة: «وما زال تشرابي الخمور ولذتي». فالشاعر يترك خصمه يشهد له بما يفخر به."
  connection: "ثم يستقر الرأي: دعوه، وردّوا ما تباعد من الإبل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَقَالَ / أَلَا مَاذَا / تَرَوْنَ / بِشَارِبِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — شَدِيدِنْ / عَلَيْكُمْ بَغْ / يُهُو مُ / تَعَمْمِدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "المتكلم الشيخ نفسه، لكنه يخاطب الآن الحاضرين: «فاعل قال ضمير الشيخ صاحب الناقة» [@khizana، ج3 ص155]، و«قال هذا الشيخ للحاضرين» [@zawzani، ص116]. فالحوار انتقل من توبيخ طَرَفَة إلى مشاورة القوم فيه."
variants:
  - reading: "شَدِيدٍ عَلَيْنَا بَغْيُهُ مُتَعَمِّدِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص116]. وبها أنشده المَرْزُوقِيّ [@marzuqi-hamasa، ص893] والبَغْداديّ [@khizana، ج3 ص154]."
  - reading: "شَدِيدٍ عَلَيْهَا سُخْطُهُ مُتَعَيِّدِ"
    status: "رواية أخرى"
    note: "«المتعيد: الظلوم» [@ibn-al-anbari، ص220–221]."
