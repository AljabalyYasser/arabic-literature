first: "كَرِيمٌ يُرَوِّي نَفْسَهُ فِي حَيَاتِهِ"
second: "سَتَعْلَمُ إِنْ مُتْنَا غَدًا أَيُّنَا الصَّدِي"
meaning: "أنا كريم يروي نفسه ما دام حيًّا، وستعلم أيها اللائم إن متنا غدًا أيّنا العطشان. قال الزَّوْزَنِيّ: «يريد أنه يموت ريّان وعاذله يموت عطشان» [@zawzani، ص109]."
vocabulary:
  - term: "يُرَوِّي"
    text: "يسقيها حتى تروى، من الريّ. «يقال رويت من الشراب فأنا أروى منه ريا» [@ibn-al-anbari، ص198]."
  - term: "الصَّدِي"
    text: "العطشان: «والصدى بكسر الدال: العطشان» [@ibn-al-anbari، ص199]."
  - term: "الصَّدَى"
    text: "اللفظ نفسه بفتح الدال يذكّر بمعنى آخر: كانت العرب في الجاهلية تزعم أن الميت تخرج من قبره «هامة تزقو عليه، وكانوا يسمون الصوت الصدى» [@ibn-al-anbari، ص199]. وتزقو: تصيح."
syntax:
  - "«كَرِيمٌ» خبر لمبتدأ محذوف: أنا كريم. وجملة «يُرَوِّي» صفة له."
  - "«إنْ متنا غدًا» جملة شرط معترضة، وجوابها محذوف دلّ عليه ما قبله."
  - "«أيّنا» اسم استفهام مبتدأ، و«الصَّدِي» خبره، والجملة سدّت مسدّ مفعولي «ستعلم». ويروى «صدى أيِّنا الصدى» بالإضافة [@ibn-al-anbari، ص199]."
morphology:
  - "«يُرَوِّي» مضارع «روّى» على «فعّل»، والتضعيف للتكثير: يرويها مرة بعد مرة."
  - "«صَدٍ» صفة على «فَعِل» من «صَدِيَ» إذا عطش، مثل «عَطِش»، وهو اسم منقوص تثبت ياؤه مع «ال»: «الصَّدِي». أما «الصَّدَى» بمعنى الصوت فجمعه «أصداء» [@ibn-al-anbari، ص199]."
rhetoric:
  thesis: "يرد على اللائم بصورة من المقبرة: سنموت كلانا، والفرق أنني أموت ريّان وأنت تموت عطشان."
  devices:
    - title: "التورية في «الصدي»"
      text: "«الصَّدِي» العطشان، ولفظه يذكّر السامع الجاهلي بالصدى، وهو طائر الموت الذي زعموا أنه يصيح على القبر [@ibn-al-anbari، ص199]. فالبيت يجمع العطش والقبر في كلمة واحدة. والتورية: لفظ له معنيان، قريب يتبادر وبعيد يُراد أو يُلمح."
    - title: "الوعيد بالعلم"
      text: "«ستعلم» تهديد في صورة خبر: العلم آتٍ، لكن بعد فوات الأوان."
  connection: "ثم يصف القبرين: قبر البخيل وقبر المسرف سواء."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَرِيمُنْ / يُرَوْوِي نَفْ / سَهُو فِي / حَيَاتِهِي = فعولن / مفاعيلن / فعولن / مفاعلن — سَتَعْلَ / مُ إِنْ مُتْنَا / غَدَنْ أَيْ / يُنَصْ صَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "قبله في رواية ابن الأَنْبارِيّ بيت بالمعنى نفسه: «ذريني أروّي هامتي في حياتها»، قال فيه أبو جعفر: «لا أعرف هذا البيت في قصيدة طَرَفَة» [@ibn-al-anbari، ص198]. وليس في رواية الزَّوْزَنِيّ [@zawzani، ص109]. وبهذا البيت يعود الشاعر إلى حجته بعد أن عدّ خلاله الثلاث."
variants:
  - reading: "سَتَعْلَمُ إِنْ مُتْنَا صَدَى أَيِّنَا الصَّدِي"
    status: "رواية أخرى"
    note: "بإضافة «الصدى» إلى «أيّ»، «والتقدير صدى أيّنا العطشان» [@ibn-al-anbari، ص199]."
