first: "وُقُوفًا بِهَا صَحْبِي عَلَيَّ مَطِيَّهُمْ"
second: "يَقُولُونَ لَا تَهْلِكْ أَسًى وَتَجَلَّدِ"
meaning: "وقف أصحابي بي عند هذه الأطلال على رواحلهم، يقولون: لا تقتل نفسك حزنًا، وتصبّر. قال ابن الأَنْبارِيّ: «وقوله (لا تهلك أسى) معناه لا تقتل نفسك... والأسى: الحزن. وتجلد: تصبر» [@ibn-al-anbari، ص135]."
vocabulary:
  - term: "صَحْبِي"
    text: "أصحابي. «ويقال في جمع الصاحب أصحاب وصحب وصحبان» [@ibn-al-anbari، ص135]."
  - term: "مَطِيَّهُمْ"
    text: "رواحلهم، واحدتها مطية؛ سميت بذلك لأنه يُركب مطاها، أي ظهرها [@zawzani، ص37–38]."
  - term: "أَسًى"
    text: "«الحزن» [@ibn-al-anbari، ص135]."
  - term: "تَجَلَّدِ"
    text: "«تكلّف الجلادة وهو التصبر» [@zawzani، ص89]. والجلادة: الصلابة."
syntax:
  - "إعرابه كإعراب بيت امرئ القَيْس الذي يطابقه، والزَّوْزَنِيّ يحيل في تفسيره إليه [@zawzani، ص89]: «وُقُوفًا» منصوب، و«صَحْبِي» مرفوع به لأنه بمعنى الفعل، و«مَطِيَّهُمْ» منصوب به [@ibn-al-anbari، ص24]."
  - "و«وُقُوفًا» هنا حال من فاعل «ظَلِلْتُ» في البيت الأول برواية ابن الأَنْبارِيّ: ظللت أبكي وأصحابي واقفون عليّ. و«عَلَيَّ» متعلق بـ«وقوفًا»."
  - "«لَا تَهْلِكْ» مضارع مجزوم بـ«لا» الناهية، و«أَسًى» مصدر في موضع الحال عند البصريين، أي: لا تهلك آسيًا [@ibn-al-anbari، ص25]، ويراه الزَّوْزَنِيّ مفعولًا لأجله [@zawzani، ص38]. و«تَجَلَّدِ» فعل أمر كُسر آخره للقافية."
morphology:
  - "«تَجَلَّدْ» على «تفعّل»، ومعناه هنا التكلّف: تكلّف الجلادة [@zawzani، ص89]."
  - "«صَحْب» جمع «صاحب»، مثل «رَكْب» جمع «راكب»."
  - "يقال: «هلك الرجل يهلك هَلكا وهُلكا ومهلكة» [@ibn-al-anbari، ص135]."
rhetoric:
  thesis: "بيت يكاد يكون بيت امرئ القَيْس بحروفه، لا يفترقان إلا في كلمة القافية: «وتجمّل» عند امرئ القَيْس، و«وتجلّد» عند طَرَفَة."
  devices:
    - title: "النهي ثم الأمر"
      text: "«لَا تَهْلِكْ أَسًى» نهي، و«تَجَلَّدِ» أمر. فالأصحاب لا يمنعونه الحزن، بل يطلبون منه أن يحتمله."
    - title: "بين «تجمّل» و«تجلّد»"
      text: "التجمّل عند ابن الأَنْبارِيّ أن تُظهر «للناس خلاف ما في قلبك من الحزن والوجد، لئلا يشمت العواذل والعداة بك» [@ibn-al-anbari، ص25]. والتجلّد «تكلّف الجلادة وهو التصبر» [@zawzani، ص89]. فكلمة امرئ القَيْس تنظر إلى عيون الناس، وكلمة طَرَفَة تنظر إلى صلابة النفس."
    - title: "وقع الحافر على الحافر"
      text: "يسمّي النقاد اتفاق شاعرين في لفظ واحد دون أن يسمع أحدهما الآخر «المُوارَدة». وقد ادّعاها قوم في هذين البيتين، فشكّ ابن رَشِيق: «لأن طَرَفَة في زمان عَمْرو بن هند شاب حول العشرين، وكان امرؤ القَيْس في زمان المنذر الأكبر كهلاً واسمه وشعره أشهر من الشمس». ثم قال: «إلا أنهم ذكروا أن طَرَفَة لم يثبت له البيت، حتى استحلف أنه لم يسمعه قط فحلف» [@ibn-rashiq، ج2 ص289]."
  connection: "ثم يتذكر يوم الرحيل، فيرى إبل صاحبته بهوادجها سفنًا عظيمة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وُقُوفَنْ / بِهَا صَحْبِي / عَلَيْيَ / مَطِيْيَهُمْ = فعولن / مفاعيلن / فعولُ / مفاعلن — يَقُولُو / نَ لَا تَهْلِكْ / أَسَنْ وَ / تَجَلْلَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "يكمل مشهد البكاء على الأطلال: الشاعر يبكي، وأصحابه فوقه على رواحلهم يواسونه. وقد أورد ابن سَلّام البيتين متتاليين، بيت امرئ القَيْس ثم بيت طَرَفَة، فيما يتفق فيه الشعراء [@ibn-sallam، ج1 ص59]. ويقول ابن رَشِيق إن من الناس من لا يفطن للأخذ «إلا عن مثل بيت امرئ القَيْس وطَرَفَة حين لم يختلفا إلا في القافية؛ فقال أحدهما وتحمل، وقال الآخر وتجلد» [@ibn-rashiq، ج2 ص281]."
