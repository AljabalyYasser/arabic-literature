first: "وَطَيُّ مَحَالٍ كَالْحَنِيِّ خُلُوفُهُ"
second: "وَأَجْرِنَةٌ لُزَّتْ بِدَأْيٍ مُنَضَّدِ"
meaning: "ولها فقار ظهر مطويّ متراصّ، أضلاعه التي تليه محنيّة كالقسيّ، وباطن عنقها مشدود إلى فقار منضود. قال ابن الأَنْبارِيّ: «محال ظهرها متراصف متدان بعضه من بعض، وذلك اشد لها وأقوى من أن يكون محالها متباينات» [@ibn-al-anbari، ص161]."
vocabulary:
  - term: "مَحَالٍ"
    text: "«الفقر، الواحدة محالة، وهي خرز الظهر» [@ibn-al-anbari، ص161]."
  - term: "الْحَنِيِّ"
    text: "«القسي، واحدتها حنية، والجمع حنى وحنايا» [@ibn-al-anbari، ص161]."
  - term: "خُلُوفُهُ"
    text: "«الخلوف مآخير الأضلاع، الضلع القصيرة التي تلي الخاصرة». وقال ابن الأعرابي: «أضلاعه من جانبي المحال» [@ibn-al-anbari، ص161–162]."
  - term: "أَجْرِنَةٌ"
    text: "«جمع جران، وهو باطن الحلقوم، وإنما لها جران واحد، فجمعه بما حوله» [@ibn-al-anbari، ص161]."
  - term: "لُزَّتْ"
    text: "«قرن بعضها إلى بعض فانضمت واشتدت. ومنه قيل رجل ملزز، أي مجتمع الخلق» [@ibn-al-anbari، ص161]."
  - term: "دَأْيٍ"
    text: "«و (الدأي) والدأيات: فقار العنق، وكل فقرة دأية». «وزعم الأصمعي أن في عنق البعير سبع دأيات وفي ظهره سبع» [@ibn-al-anbari، ص162]."
syntax:
  - "«والطي يرتفع بإضمار لها» [@ibn-al-anbari، ص162]، أي: ولها طيُّ محالٍ. و«طيّ» مصدر مضاف إلى «محال»، والمعنى: «لها محال مطوية» [@ibn-al-anbari، ص161]."
  - "«والخلوف يرتفع بالكاف» [@ibn-al-anbari، ص162]: الكاف اسم بمعنى «مثل» خبر مقدم، و«خلوفه» مبتدأ مؤخر، والجملة صفة لـ«طيّ محال». وقول ابن الأَنْبارِيّ «يرتفع بالكاف» على مذهب الكوفيين، يرفعون الاسم بما يجاوره."
  - "«والاجرنة نسق على الطي. ولزت صلة الأجرنة، والباء صلة لزت. والمنضد نعت الدأي» [@ibn-al-anbari، ص162]: «أجرنة» معطوفة على «طيّ»، وجملة «لُزّت» صفة لها، و«بدأي» متعلق بـ«لُزّت»."
morphology:
  - "«أَجْرِنة» على «أفعِلة» جمعًا لـ«جِران»، والناقة لها جران واحد، «فجمعه بما حوله». ومثله: «امرأة عظيمة الأوراك، وإنما لها وركان، ومزججة الحواجب» [@ibn-al-anbari، ص161–162]."
  - "«الدأي» جمع «دأية»، «ويقال للغراب: ابن دأية، لأنه يقع على الدبر الذي يكون على الدأيات» [@ibn-al-anbari، ص162]. والدَّبَر: القروح في ظهر البعير."
  - "«طَيّ» مصدر «طوى»، وأصله «طَوْي»، اجتمعت الواو والياء وسبقت الأولى بالسكون، فقُلبت الواو ياء وأُدغمت."
rhetoric:
  thesis: "من الفخذين إلى الظهر والأضلاع والعنق. والبيت كله ألفاظ ضمّ وشدّ: طيّ، ولُزّت، ومنضّد."
  devices:
    - title: "في التمثال: الهيكل"
      text: "يصف الهيكل الذي يحمل التمثال: فقار متراصّ، وأضلاع محنيّة، وعنق مشدود. والتراصّ عند ابن الأَنْبارِيّ «اشد لها وأقوى من أن يكون محالها متباينات». وروى عن أبي عمرو أن «المهرية ظهرها فقرة واحدة، وهي الاجد» [@ibn-al-anbari، ص161]، أي أن فقارها من شدة تلاصقه كأنه عظم واحد. والمهرية: إبل منسوبة إلى قبيلة مَهْرة."
    - title: "التشبيه"
      text: "التشبيه عند ابن رَشِيق «صفة الشيء بما قاربه وشاكله، ومن جهة واحدة أو جهات كثيرة لا من جميع جهاته» [@ibn-rashiq، ج1 ص286]. والجهة هنا الانحناء مع الصلابة: الأضلاع كالقسيّ. وسيعود إلى القسيّ في البيت التالي: «وأطر قسيّ»."
    - title: "مجاز الجمع"
      text: "«أجرنة» جمع، والناقة لها جران واحد. ويسمي ابن الأَنْبارِيّ هذا الجمع «بما حوله» [@ibn-al-anbari، ص161]: أطلق الجمع على العضو وما يحيط به. فالكلمة تصف منطقة كاملة من العنق لا موضعًا واحدًا."
  connection: "ثم يصف ما بين مرفقيها وجنبيها، وما تحت صلبها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَطَيْيُ / مَحَالِنْ كَلْ / حَنِيْيِ / خُلُوفُهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَأَجْرِ / نَتُنْ لُزْزَتْ / بِدَأْيِنْ / مُنَضْضَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "من الأعضاء التي تحمل الرحل والراكب: الظهر والأضلاع والعنق. وفي هذه الأبيات (16–25) يمضي الشاعر من مؤخر الناقة إلى مقدمها. والزَّوْزَنِيّ يروي البيت «وَطَيٍّ مَحالٍ» بالجر [@zawzani، ص96]، وشرحه عليه لا يظهر في النسخة التي رجعنا إليها."
variants:
