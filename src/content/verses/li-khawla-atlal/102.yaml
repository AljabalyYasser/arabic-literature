first: "سَتُبْدِي لَكَ الْأَيَّامُ مَا كُنْتَ جَاهِلًا"
second: "وَيَأْتِيكَ بِالْأَخْبَارِ مَنْ لَمْ تُزَوِّدِ"
meaning: "ستكشف لك الأيام ما كنت تجهله، ويأتيك بالأخبار من لم تبعثه ولم تُعطه زادًا. قال ابن الأَنْبارِيّ: «معناه ستظهر لك ما كنت جاهله... يأتيك بالخبر من لم تسأله عن ذلك» [@ibn-al-anbari، ص230]."
vocabulary:
  - term: "سَتُبْدِي"
    text: "ستُظهر [@ibn-al-anbari، ص230]."
  - term: "تُزَوِّدِ"
    text: "تُعطيه الزاد. فالذي يُرسل ليأتي بالخبر يُعطى زاد الطريق؛ والشاعر يقول إن الخبر يأتيك بلا رسول."
syntax:
  - "«الأيامُ» فاعل «تبدي»، و«ما» موصولة مفعول به، وجملة «كنت جاهلًا» صلة، والعائد محذوف: ما كنت جاهله [@ibn-al-anbari، ص230]."
  - "«مَنْ» موصولة فاعل «يأتيك»، وجملة «لم تزوّد» صلتها، ومفعولها محذوف: من لم تزوّده."
morphology:
  - "«تُبْدي» مضارع «أبدى» الرباعي."
  - "«تُزَوِّد» مضارع «زوّد» على «فعّل»."
rhetoric:
  thesis: "خاتمة المعلقة حكمة تصلح لكل زمان: ما تجهله اليوم تكشفه الأيام، والخبر يأتي وإن لم تطلبه."
  devices:
    - title: "المثل السائر"
      text: "قال ابن رَشِيق في باب التمثيل: «والمثل المضروب في الشعر نحو قول طَرَفَة: ستبدي لك الأيام ما كنت جاهلاً... لأن معناه ستبدي لك الأيام كما أبدت لغيرك، ويأتيك بالأخبار من لم تزود كما جرت عادة الزمان» [@ibn-rashiq، ج1 ص280]. وعجزه مثل في «مجمع الأمثال»: «يأتيك بالأخبار من لم تزود» [@maydani، ج2 ص427]."
    - title: "التشخيص"
      text: "جعل الأيام فاعلًا يُبدي ويكشف، كأنها معلّم يعلّم الإنسان ما جهله."
    - title: "الختام بالحكمة"
      text: "امرؤ القَيْس ختم معلقته بصورة السيل، «فلم يجعل لها قاعدة» [@ibn-rashiq، ج1 ص241]؛ وطَرَفَة يختم بحكمة، فيعود إلى فلسفته في الحياة والموت."
  connection: "وبيت أخير يكمله: ويأتيك بالأخبار من لم تبع له بتاتًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "سَتُبْدِي / لَكَلْ أَيْيَا / مُ مَا كُنْ / تَ جَاهِلَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَيَأْتِي / كَ بِلْأَخْبَا / رِ مَنْ لَمْ / تُزَوْوِدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "جعله ابن قُتَيْبة مما «سبق إليه» طَرَفَة [@ibn-qutayba، ج1 ص189]. وهو أشهر أبيات المعلقة جريانًا على الألسنة."
variants:
  - reading: "وَيَأْتِيكَ بِالْأَخْبَارِ مَنْ لَمْ تُزَوَّدِ"
    status: "ضبط الزَّوْزَنِيّ"
    note: "بفتح الواو، والمعنى في شرحه واحد: «وسينقل إليك الأخبار من لم تزوده» [@zawzani، ص120]."
