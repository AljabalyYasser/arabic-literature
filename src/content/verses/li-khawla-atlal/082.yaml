first: "أَنَا الرَّجُلُ الْجَعْدُ الَّذِي تَعْرِفُونَهُ"
second: "خَشَاشٌ كَرَأْسِ الْحَيَّةِ الْمُتَوَقِّدِ"
meaning: "أنا الرجل الخفيف الماضي الذي تعرفونه، أدخل في الأمور بذكاء، كأني رأس حية متوقد. قال الزَّوْزَنِيّ: «أنا دَخّال في الأمور بخفة وسرعة، شبه تيقظه وذكاء ذهنه بسرعة حركة رأس الحية وشدة توقّده» [@zawzani، ص114]."
vocabulary:
  - term: "الرَّجُلُ"
    text: "له عند ابن الأَنْبارِيّ ثلاثة معان: «ضد الأنثى. والرجل: الشديد الشجاع. والرجل: الراجل» [@ibn-al-anbari، ص212]."
  - term: "الْجَعْدُ"
    text: "«والجعد من الرجال: الخفيف». وقال أبو جعفر: «ومن روى (الجعد) أراد المجتمع الشديد» [@ibn-al-anbari، ص212]. وفي حاشية نسخة من أمالي المرتضى أن الجعد هنا «السخي الكريم، وهو من الأضداد» [@murtada، ج2 ص242، الحاشية]."
  - term: "خَشَاشٌ"
    text: "«الرجل الذي ينخش في الأمور ذكاء ومضاء» [@ibn-al-anbari، ص212]، أي يدخل فيها. وفي حاشية الزَّوْزَنِيّ: «الرجل الذكي اللطيف الرأس» [@zawzani، ص114، الحاشية]."
  - term: "كَرَأْسِ الْحَيَّةِ"
    text: "«معناه هو خفيف الروح ذكي» [@ibn-al-anbari، ص212]."
  - term: "الْمُتَوَقِّدِ"
    text: "«الذكي» [@ibn-al-anbari، ص212]، وأصله من توقّد النار."
syntax:
  - "«وأنا رفع بالرجل، والجعد نعته» [@ibn-al-anbari، ص212]. وهذا على مذهب الكوفيين، فالمبتدأ والخبر عندهم يرفع كل منهما صاحبه؛ وعند البصريين «أنا» مبتدأ و«الرجل» خبره."
  - "«وخشاش يرتفع على التكرير، كأنه قال: أنا خشاش. والكاف في موضع رفع على النعت لخشاش» [@ibn-al-anbari، ص212]. والتكرير عند الكوفيين هو البدل عند البصريين: كلمة تعيد الحديث عن الاسم نفسه، ولذلك قال: «كأنه قال: أنا خشاش»."
  - "«الذي تعرفونه» اسم موصول وصلته، صفة لـ«الرجل»، والهاء في «تعرفونه» عائد عليه."
morphology:
  - "«المتوقِّد» اسم فاعل من «توقّد» على «تفعّل». «يقال: توقدت النار توقدا، ووقدت تقد وقدانا ووقدا» [@ibn-al-anbari، ص212]."
  - "«خَشاش» يروى بالفتح والكسر. روى الأَصْمَعِيّ «خِشاش» بالكسر وقال: «كل شيء خشاش بالكسر إلا خشاش الطير» [@ibn-al-anbari، ص212]، أي أن خشاش الطير وحده بالفتح."
  - "«الحيّة»: «وقال بعض أهل اللغة: إنما سميت الحية حية لأنها تحوت، أي اجتمعت وتقبضت» [@ibn-al-anbari، ص212]."
rhetoric:
  thesis: "من الأمنية إلى الفخر. ليس له مال السيدين، لكن له نفسه، وقومه يعرفونها."
  devices:
    - title: "التشبيه"
      text: "شبّه نفسه برأس الحية المتوقد: الشبه في اليقظة وسرعة الحركة، كما يقول الزَّوْزَنِيّ: «شبه تيقظه وذكاء ذهنه بسرعة حركة رأس الحية وشدة توقّده» [@zawzani، ص114]."
    - title: "المدح بخفة اللحم"
      text: "على رواية «الضرب» يقول الزَّوْزَنِيّ: «والعرب تتمدح بخفة اللحم؛ لأن كثرته داعية إلى الكسل والثقل، وهما يمنعان من الإسراع في دفع الملمات وكشف المهمات» [@zawzani، ص114]. والملمات: المصائب."
    - title: "الاحتكام إلى معرفة القوم"
      text: "«الذي تعرفونه»: لا يعرّف نفسه بنسب ولا مال، بل بما جرّبه قومه منه. فالشاهد على فخره هم السامعون أنفسهم."
  connection: "ثم يحلف أن جنبه لن يفارق سيفًا قاطعًا (83–86)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَنَرْ رَ / جُلُلْ جَعْدُلْ / لَذِي تَعْ / رِفُونَهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — خَشَاشُنْ / كَرَأْسِلْ حَيْ / يَتِلْ مُ / تَوَقْقِدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "بهذا البيت يبدأ الفخر الأخير في المعلقة (82–101): بسيفه (83–86)، ثم بكرمه في ليلة الناقة (87–92)، ثم بوصيته لابنة أخيه (93–97)، ثم بمضائه وصبره في الحرب ولهوه بالميسر (98–101). وقد جرى البيت على الألسنة فخرًا يُنادى به: يروي ابن عبد رَبِّه أن مجنونًا بالبصرة كان يطارد الصبيان بقصبة، ثم ينادي: «أنا الرجل الضّرب الذي يعرفونني / خشاش كرأس الحيّة المتوقّد!» [@iqd، ج7 ص165]."
