first: "وَإِنْ يَقْذِفُوا بِالْقَدْعِ عِرْضَكَ أَسْقِهِمْ"
second: "بِشُرْبِ حِيَاضِ الْمَوْتِ قَبْلَ التَّنَجُّدِ"
meaning: "وإن رمى الأعداء عرضك بالكلام القبيح، سقيتهم من حياض الموت، معاجلًا لهم. و«حياض الموت» عند ابن الأَنْبارِيّ «مثل، أي أوردهم حياض المهالك» [@ibn-al-anbari، ص206]."
vocabulary:
  - term: "الْقَدْعِ"
    text: "«(القدع) والقذع: اللفظ القبيح والشتم» [@ibn-al-anbari، ص206]. وفرّق الطُّوسِيّ بين الحرفين: «فالقذع: الشتم، والقدع: الزجر والكف» [@ibn-al-anbari، ص206]."
  - term: "يَقْذِفُوا"
    text: "«يرمونه بذلك ويؤنبونه به» [@ibn-al-anbari، ص206]."
  - term: "عِرْضَكَ"
    text: "«العرض: موضع المدح والذم من الرجل» [@ibn-al-anbari، ص206]، «قاله ابن دريد، وقد يفسر بالحسب، والعرض النفس» [@zawzani، ص112]."
  - term: "حِيَاضِ"
    text: "«جمع حوض. وهذا مثل، أي أوردهم حياض المهالك» [@ibn-al-anbari، ص206]."
  - term: "التَّنَجُّدِ"
    text: "«الاجتهاد» [@ibn-al-anbari، ص206]، أي قبل أن يطول الأمر ويُحتاج فيه إلى جهد."
syntax:
  - "«يقذفوا» فعل الشرط مجزوم بحذف النون، و«عرضك» مفعوله، و«بالقدع» متعلق به. «وموضع أسقهم جزم على جواب الجزاء» [@ibn-al-anbari، ص206]، وعلامة جزمه حذف الياء."
  - "«بشرب حياض الموت»: قال الزَّوْزَنِيّ في هذه الرواية: «يريد أسقهم شرب حياض الموت، فالباء زائدة والمصدر بمعنى المفعول والإضافة بتقدير من» [@zawzani، ص113]، أي أسقيهم ما يُشرب من حياض الموت."
  - "«قبل التنجد» ظرف متعلق بـ«أسقهم»."
morphology:
  - "«أَسْقِ» مضارع «سقى» مجزوم بحذف الياء، و«هم» مفعوله."
  - "«الشُّرْب» بضم الشين مصدر «شرب»، ويقال فيه: «شَربا وشُربا وشِربا» [@ibn-al-anbari، ص206]."
  - "«التَّنَجُّد» مصدر «تنجّد» على «تفعّل». و«التهدد» في رواية ابن الأعرابي مصدر «تهدّد» على الوزن نفسه، و«التهدد والتهديد: واحد» [@zawzani، ص112]."
rhetoric:
  thesis: "الرد على الكلمة بالموت، وبلا إنذار. فالشاعر يقدّم نفسه سيفًا لابن عمه الذي يلومه."
  devices:
    - title: "الاستعارة"
      text: "جعل للموت حياضًا يُسقى منها الأعداء، والحياض للماء. «وهذا مثل، أي أوردهم حياض المهالك» [@ibn-al-anbari، ص206]. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "الكلمة والفعل"
      text: "هم يرمون بالقول، وهو يرد بالفعل. وفي رواية ابن الأعرابي «قبل التهدد»، قال أبو جعفر: «معناه لست صاحب تهدد، أنا صاحب قتل ولست بمهذار» [@ibn-al-anbari، ص206]. والمهذار: الكثير الكلام."
    - title: "السقي"
      text: "السقي في المعلقة علامة الكرم: يسقي الضيف كأسًا روية (46)، ويروّي نفسه في حياته (62). وهنا يسقي الأعداء، لكن من حياض الموت. فالفعل واحد، والكأس مختلفة."
  connection: "ثم يعود إلى ظلمه: يُهجى ويُشكى ويُطرد كأنه صاحب جرم، ولا جرم له."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِنْ يَقْ / ذِفُوا بِلْقَدْ / عِ عِرْضَ / كَ أَسْقِهِمْ = فعولن / مفاعيلن / فعولُ / مفاعلن — بِشُرْبِ / حِيَاضِلْ مَوْ / تِ قَبْلَتْ / تَنَجْجُدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "آخر أبيات النصرة (72–74) وأشدها، وبعده يعود إلى الشكوى. وفي البيت ثلاثة مواضع اختلفت فيها الرواية، أبعدها أثرًا في المعنى «قبل التهدد»: فالشاعر على هذه الرواية لا يتوعد، بل يفعل. وسبب العتاب قصة إبل مَعْبَد، أخي طَرَفَة، يذكرها في البيت 71 [@ibn-al-anbari، ص204]."
variants:
  - reading: "وَإِنْ يَقْذِفُوا بِالْقَذْعِ عِرْضَكَ أَسْقِهِمْ"
    status: "رواية الزَّوْزَنِيّ"
    note: "بالذال [@zawzani، ص112]، وهي رواية الديوان [@diwan-tarafa، ص27]. وذكر الطُّوسِيّ الروايتين، بالدال والذال [@ibn-al-anbari، ص206]."
  - reading: "بِكَأْسِ حِيَاضِ الْمَوْتِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص112]، وذكر رواية «بشرب» أيضًا [@zawzani، ص113]."
  - reading: "قَبْلَ التَّهَدُّدِ"
    status: "رواية ابن الأعرابي"
    note: "«أي أقتلهم قبل أن أتهددهم» [@ibn-al-anbari، ص206]. وهي رواية الزَّوْزَنِيّ: «يريد أنه يبيدهم قبل تهديدهم» [@zawzani، ص112–113]."
