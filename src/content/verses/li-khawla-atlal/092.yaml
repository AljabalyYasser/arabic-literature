first: "فَظَلَّ الْإِمَاءُ يَمْتَلِلْنَ حِوَارَهَا"
second: "وَيُسْعَى عَلَيْنَا بِالسَّدِيفِ الْمُسَرْهَدِ"
meaning: "فظلّت الإماء طوال النهار يشوين جنينها في الجمر، ويُطاف علينا بقطع سنامها السمين. قال الزَّوْزَنِيّ: «يريد أنهم أكلوا أطايبها وأباحوا غيرها للخدم» [@zawzani، ص117]."
vocabulary:
  - term: "الْإِمَاءُ"
    text: "«جمع أمة»، ويقال في جمعها أيضًا «إموان» [@ibn-al-anbari، ص222]."
  - term: "يَمْتَلِلْنَ"
    text: "«معناه يشتوين في الملة، وهي الرماد الحار، والجمر، وموضع النار» [@ibn-al-anbari، ص222]."
  - term: "حِوَارَهَا"
    text: "«ولد الناقة» [@ibn-al-anbari، ص223]، بضم الحاء وكسرها. «والحوار للناقة: بمنزلة الولد للإنسان يعم الذكر والأنثى» [@zawzani، ص117]."
  - term: "يُسْعَى عَلَيْنَا"
    text: "«معناه ينقل إلينا الأطعمة ويختلف بها علينا» [@ibn-al-anbari، ص223]."
  - term: "السَّدِيفِ"
    text: "«شطائب السنام، وهي قطعه» [@ibn-al-anbari، ص223]."
  - term: "الْمُسَرْهَدِ"
    text: "«الحسن الغذاء». «قال الطوسي: المسرهد: السمين» [@ibn-al-anbari، ص223]."
syntax:
  - "«والإماء اسم ظل، وخبر ظل ما في يمتللن» [@ibn-al-anbari، ص223]، أي جملة «يمتللن» خبر «ظلّ»."
  - "«يُسعى» مبني للمجهول، «والباء في السديف اسم ما لم يسم فاعله» [@ibn-al-anbari، ص223]. و«اسم ما لم يسمّ فاعله» هو ما نسميه نائب الفاعل، وهو هنا الجار والمجرور «بالسديف»."
  - "«المسرهد» نعت لـ«السديف»، و«علينا» متعلق بـ«يُسعى»."
morphology:
  - "«يمتللن» على «يفتعلن» من «المَلّة»، وظهر فيه التضعيف لاتصاله بنون النسوة. ومنه: «قد مل خبزته يملها ملا، إذا حورها ودفنها في الجمر» [@ibn-al-anbari، ص222]."
  - "«ظلّ» فيه معنى النهار: «يقال: ظللت افعل ذلك، وظللت أفعله، وظلت افعله، إذا كنت تفعله نهارا» [@ibn-al-anbari، ص222]."
  - "«مُسَرْهَد» اسم مفعول من الرباعي «سرهد»: «والفعل سرهد يسرهد سرهدة» [@zawzani، ص117]."
rhetoric:
  thesis: "خاتمة القصة وليمة. والمنحورة لم تكن ناقة عادية، بل ناقة حبلى من أنفس المال."
  devices:
    - title: "الكناية"
      text: "لم يقل إنها كانت حاملًا، بل ذكر جنينها على الجمر. قال الزَّوْزَنِيّ: «وذكر الحوار دال على أنها كانت حبلى وهي من أنفس الإبل عندهم» [@zawzani، ص117]."
    - title: "المقابلة بين الإماء والسادة"
      text: "الإماء في الشطر الأول مع الجنين، والسادة في الشطر الثاني مع السنام. قال أبو جعفر: «كانوا يأنفون أن يأكلوا الأحورة» [@ibn-al-anbari، ص223]، أي صغار الإبل. فالبيت يقسم الوليمة على طبقات الحي."
    - title: "بين معلقتين"
      text: "يقول محقق الديوان إن البيت «شبيه ببيت ورد في معلقة امرئ القيس» [@diwan-tarafa، ص29، الحاشية]، وهو: «فظلَّ العذارى يرْتَمينَ بلحمها / وشحمٍ كَهُدَّابِ الدَّمَقس الْمُفَتَّلِ» [@zawzani، ص40]. في البيتين «ظلّ» ونساء ولحم ناقة عقرها الشاعر. لكن عذارى امرئ القَيْس يتقاذفن اللحم لعبًا، وإماء طَرَفَة يشوين الجنين في الرماد."
  connection: "ثم يلتفت إلى ابنة أخيه بوصيته: إذا متُّ فانعيني بما أنا أهله."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَظَلْلَلْ / إِمَاءُ يَمْ / تَلِلْنَ / حِوَارَهَا = فعولن / مفاعلن / فعولُ / مفاعلن — وَيُسْعَى / عَلَيْنَا بِسْ / سَدِيفِلْ / مُسَرْهَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "آخر أبيات القصة، ويعود فيه الكلام إلى الشاعر: «علينا» هو وندماؤه. وقد أنشد المَرْزُوقِيّ أبيات القصة كلها وقال إن طَرَفَة «ووفى المعنى حقه» [@marzuqi-hamasa، ص893–894]. والإماء عند شوقي ضيف «كن في منزلة دانية»، ومنهن «جوار يخدمن الشريفات، وقد يرعين الإبل والأغنام» [@deif، ج1 ص72]."
