first: "أَرَى الْمَوْتَ يَعْتَامُ الْكِرَامَ وَيَصْطَفِي"
second: "عَقِيلَةَ مَالِ الْفَاحِشِ الْمُتَشَدِّدِ"
meaning: "أرى الموت يختار الكرام، ويختار كذلك أنفس ما يملكه البخيل الشحيح. قال الزَّوْزَنِيّ: «يريد أنه لا تخلص منه لواحد من الصنفين، فلا يجدي البخل على صاحبه بخير فالجود أحرى لأنه أحمد» [@zawzani، ص110]."
vocabulary:
  - term: "يَعْتَامُ"
    text: "«يختار» [@ibn-al-anbari، ص200]."
  - term: "يَصْطَفِي"
    text: "«يختار، أخذ من الصفوة من الشيء، وهي خياره» [@ibn-al-anbari، ص200]."
  - term: "عَقِيلَةَ"
    text: "«عقيلة كل شيء: خيرته وأنفسه عند أهله» [@ibn-al-anbari، ص200]."
  - term: "الْفَاحِشِ"
    text: "«البخيل» [@zawzani، ص110]."
  - term: "الْمُتَشَدِّدِ"
    text: "«البخيل الممسك» [@ibn-al-anbari، ص200]."
syntax:
  - "«والموت منصوب بأرى، وخبر أرى ما عاد من يعتام، ويصطفي نسق على يعتام» [@ibn-al-anbari، ص201]."
  - "«عقيلةَ» مفعول به لـ«يصطفي»، و«مال» مضاف إليه، و«الفاحش» مضاف إليه، و«المتشدد» نعته."
morphology:
  - "«يَعْتام» على «يفتعل» من «عام»، ويقال «اعتامه واعتماه، إذا اختاره» [@ibn-al-anbari، ص200]."
  - "«يَصْطَفي» على «يفتعل» من «صفا»، قُلبت تاء الافتعال طاء لمجاورة الصاد."
  - "«عقيلة» على «فعيلة»، وجمعها «عقائل» [@zawzani، ص110]."
rhetoric:
  thesis: "الموت عنده يختار كما يختار صاحب الذوق: يأخذ خيار الناس، ويأخذ خيار أموال البخلاء."
  devices:
    - title: "الاستعارة"
      text: "جعل للموت اختيارًا وذوقًا: «يعتام» و«يصطفي». وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» [@dalail، ص67]؛ فالموت يُصوَّر مشتريًا يتخيّر أجود البضاعة."
    - title: "قراءتان"
      text: "للزَّوْزَنِيّ في البيت قولان: أن الموت يختار الكرام بالإفناء، ويصطفي كريمة مال البخيل «بالإبقاء»؛ أو أن الموت يعم الصنفين، فيأخذ الكرام، ويأخذ كرائم أموال البخلاء [@zawzani، ص110]. وعلى القولين لا ينجو البخيل بماله."
    - title: "الطباق"
      text: "«الكرام» و«الفاحش المتشدد»: الجواد والبخيل في بيت واحد."
  connection: "ثم يضع الحكمة كلها في صورة: العيش كنز ينقص كل ليلة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَرَلْ مَوْ / تَ يَعْتَامُلْ / كِرَامَ / وَيَصْطَفِي = فعولن / مفاعيلن / فعولُ / مفاعلن — عَقِيلَ / ةَ مَالِلْ فَا / حِشِلْ مُ / تَشَدْدِدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "من الأبيات التي اختارها ابن قُتَيْبة «من جيد شعره» [@ibn-qutayba، ج1 ص183]. وفي روايته «أرى الموت يعتام الكريم» بالإفراد."
