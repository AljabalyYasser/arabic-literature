first: "كَأَنَّ كِنَاسَيْ ضَالَةٍ يَكْنُفَانِهَا"
second: "وَأَطْرَ قِسِيٍّ تَحْتَ صُلْبٍ مُؤَيَّدِ"
meaning: "كأن الفراغ الواسع بين مرفقيها وجنبيها كِناسان حفرهما الثور في أصل سدرة، يحيطان بها من الجانبين؛ وكأن أضلاعها تحت صلبها الشديد قسيّ معطوفة. قال ابن الأَنْبارِيّ: «وإنما أراد أن مرفقيها قد بانا عن إبطيها. شبه الهواء الذي بينهما بكناسي ضالة» [@ibn-al-anbari، ص162]."
vocabulary:
  - term: "كِنَاسَيْ"
    text: "مثنى كِناس، و«الكناس: أن يحتفر الثيران في اصل الشجرة كالسرب يكنها من الحر والبرد». «وإنما قال كناسي لأنه يستكن بالغداة في ظلها وبالعشي في فيئها» [@ibn-al-anbari، ص162]. والسَّرَب: الحفرة تحت الأرض."
  - term: "ضَالَةٍ"
    text: "«و (الضال): السدر البري، الواحدة ضالة» [@ibn-al-anbari، ص162]."
  - term: "يَكْنُفَانِهَا"
    text: "يحيطان بها من جانبيها: «كأن كناسي ضالة يكنفان هذه الناقة، من سعة ما بين مرفقيها وزورها» [@ibn-al-anbari، ص162]. والزَّوْر: أعلى الصدر."
  - term: "أَطْرَ"
    text: "العطف: «ويقال: قد أطره يأطره أطرا، إذا عطفه». وأراد بالقسيّ المأطورة ضلوعها: «يعنى ضلوعها. والمأطور: المعطوف» [@ibn-al-anbari، ص162]."
  - term: "مُؤَيَّدِ"
    text: "«أي المشدد. والآد والأيد: القوة». ومنه قوله تعالى: «واذكر عبدنا داود ذا الأيد»، «يريد ذا القوة» [@ibn-al-anbari، ص163]."
syntax:
  - "«وكناسي اسم كأن، وخبر كأن ما عاد من يكنفانها» [@ibn-al-anbari، ص163]، أي أن الخبر جملة «يكنفانها» بما فيها من ضمير يعود على الكناسين."
  - "«والأطر منصوب بإضمار كأن، والتقدير كأن أطر قسي تحت صلب مؤيد» [@ibn-al-anbari، ص163]. فـ«أطر» اسم «كأنّ» مقدّرة، و«تحت» ظرف في موضع الخبر."
  - "«أطرَ قسيٍّ» مصدر مضاف إلى مفعوله، والمراد به المفعول: قسيّ مأطورة، أي معطوفة [@ibn-al-anbari، ص162]."
morphology:
  - "«كِناس» جمعه «كُنُس»، «وقد كنست تكنس، إذا استظلت في كنسها من الحر» [@ibn-al-anbari، ص162]."
  - "«أَطْر» مصدر «أطَر يأطِر»، ومن أصله «الإطار»: «ويقال لعود المنخل: اطار، ولما حول الظفر: أطرة وإطارة» [@ibn-al-anbari، ص162]."
  - "«مُؤَيَّد» اسم مفعول من «أيّد»، من «الأَيْد» وهو القوة [@ibn-al-anbari، ص163]. و«يقال هو الصُّلْب والصَّلَب» [@ibn-al-anbari، ص163]."
rhetoric:
  thesis: "بيت عجيب في التمثال: يصف الفراغ. ما بين المرفق والجنب هواء، وقد جعل له صورة."
  devices:
    - title: "في التمثال: الفراغ تحت المرفقين"
      text: "النحّات يعمل في الكتلة وفي الفراغ حولها. وطَرَفَة هنا يصف الهواء الذي بين المرفقين والجنبين، فقد «شبه الهواء الذي بينهما بكناسي ضالة» [@ibn-al-anbari، ص162]. وسعة هذا الفراغ مدح، لأنها تعني أن المرفقين لا يحتكّان بالجنبين. وسيصرّح بذلك في البيت التالي: «لها مرفقان أفتلان»."
    - title: "تشبيهان من البادية"
      text: "الأول من حياة الوحش: كِناسان يحفرهما الثور؛ قال يعقوب: «يتخذ الوحش واحدا لظل الغداة، وآخر لفئ العشي» [@ibn-al-anbari، ص162]. والثاني من صنعة السلاح: قسيّ معطوفة تحت صلب شديد. فالناقة بين الطبيعة والصنعة. والتشبيه عند ابن رَشِيق «صفة الشيء بما قاربه وشاكله، ومن جهة واحدة أو جهات كثيرة لا من جميع جهاته» [@ibn-rashiq، ج1 ص286]."
    - title: "أداة واحدة لتشبيهين"
      text: "لم يكرر «كأنّ» مع «أطر قسيّ»، بل نصبه «بإضمار كأن» [@ibn-al-anbari، ص163]. فالتشبيه الثاني يأتي معطوفًا على الأول، وتقوم الأداة الأولى بالتشبيهين."
  connection: "ثم يصرّح بالمرفقين: «لها مرفقان أفتلان كأنما تمرّ بسلمي دالج متشدد»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَأَنْنَ / كِنَاسَيْ ضَا / لَتِنْ يَكْ / نُفَانِهَا = فعولُ / مفاعيلن / فعولن / مفاعلن — وَأَطْرَ / قِسِيْيِنْ تَحْ / تَ صُلْبِنْ / مُؤَيْيَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر والعَجُز [@atiq، ص29]."
context: "الأبيات 20–22 في موضع واحد من جسم الناقة: ما بين المرفقين والصدر. وفيها أكثر التشبيهات تتابعًا: كناسان، ثم قسيّ، ثم سقّاء يحمل دلوين، ثم قنطرة. يقول شوقي ضيف إن طَرَفَة «لم يترك فيها صغيرة ولا كبيرة إلا رسمها، وكأنه يريد أن ينحت لها تمثالا» [@deif، ج1 ص430]. وهذا البيت شاهد على ذلك: حتى الفراغ تحت المرفق له صورة."
