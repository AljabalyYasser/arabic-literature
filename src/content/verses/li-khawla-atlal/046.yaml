first: "مَتَى تَأْتِنِي أَصْبَحْكَ كَأْسًا رَوِيَّةً"
second: "وَإِنْ كُنْتَ عَنْهَا غَانِيًا فَاغْنَ وَازْدَدِ"
meaning: "متى جئتني سقيتك في الصباح كأسًا من الخمر تُرويك، وإن كنت مستغنيًا عنها فاستغنِ وازدد، فلا أُكرهك عليها. و«أصبحك» عند ابن الأَنْبارِيّ «من الصبوح. والصبوح: شرب الغداة» [@ibn-al-anbari، ص187]، أي شرب أول النهار."
vocabulary:
  - term: "أَصْبَحْكَ"
    text: "أسقك الصبوح. وللعرب أسماء لأوقات الشرب: «والصبوح: شرب الغداة. والغبوق: شرب العشي. والقيل: شرب نصف النهار. والفحمة: شرب الليل. والجاشرية: شرب السحر» [@ibn-al-anbari، ص187]."
  - term: "كَأْسًا"
    text: "مؤنثة. قال الفَرّاء: «الكأس: الإناء الذي فيه لبن أو ماء وخمر أو غير ذلك، وإن كان فارغا لم يقل له كأس» [@ibn-al-anbari، ص187]."
  - term: "رَوِيَّةً"
    text: "مُرْوية تُذهب العطش. «ويقال: إناء رويّ، أي مُرْوٍ» [@ibn-al-anbari، ص187]."
  - term: "غَانِيًا"
    text: "مستغنيًا، ويُروى مكانها «ذا غنى» [@ibn-al-anbari، ص187]."
syntax:
  - "«وتأتني مجزوم بمتى، وأصبحك جواب الجزاء» [@ibn-al-anbari، ص187]. و«الجزاء» في اصطلاحه الشرط. والكاف في «أصبحك» مفعول أول، و«كأسًا» مفعول ثانٍ."
  - "«وكنت موضعه جزم إلا أن الجزم لا يتبين فيه لأنه ماض، والفاء جواب الجزاء» [@ibn-al-anbari، ص187]، أي أن الفاء رابطة لجواب الشرط لأنه فعل أمر."
  - "«واغن مجزوم على الأمر، علامة الجزم فيه سقوط الألف» [@ibn-al-anbari، ص187]. وهذا مذهب الكوفيين، يرون فعل الأمر مجزومًا؛ أما البصريون فيجعلونه مبنيًّا على حذف حرف العلة."
morphology:
  - "«أَصْبَحْ» مضارع «صَبَح» الثلاثي، مجزوم بالسكون لأنه جواب الشرط. ومن أصله «الصَّبوح» على «فَعُول» [@ibn-al-anbari، ص187]."
  - "«اغْنَ» أمر من «غَنِيَ يَغْنَى»، حُذفت ألفه، و«غانٍ» اسم فاعل منه."
  - "«ازْدَدْ» أمر من «ازداد» على «افتعل» من «زاد»؛ قُلبت تاء الافتعال دالًا بعد الزاي: ازْتَدْ ← ازْدَدْ. وكُسر آخره للقافية."
rhetoric:
  thesis: "كرم بلا إلحاح: الكأس حاضرة لمن جاء، ومن استغنى عنها فله ما أراد."
  devices:
    - title: "المقابلة"
      text: "المقابلة أن تأتي بمعنيين أو أكثر ثم بما يقابلهما. فالصدر لمن يأتيه فيسقيه، والعجز لمن يستغني فيتركه. الأول كرم، والثاني أدب في الكرم."
    - title: "الأمر للإباحة"
      text: "«فاغن وازدد» أمر في لفظه، لكنه لا يطلب شيئًا: هو إذن وتخيير. فالمضيف لا يُكره ضيفه على الشراب."
    - title: "سلسلة الشرط"
      text: "البيت حلقة في سلسلة من الشرط: «وإن تبغني... تلقني» (45)، و«متى تأتني أصبحك»، ثم «وإن يلتق الحي... تلاقني» (47). فالشاعر يرسم نفسه بأجوبة الشرط: أينما طلبته وجدته، وعلى أحسن حال."
  connection: "ثم يقول: وإذا اجتمع الحي وجدتني في ذروة البيت الشريف."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "مَتَى تَأْ / تِنِي أَصْبَحْ / كَ كَأْسَنْ / رَوِيْيَتَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَإِنْ كُنْ / تَ عَنْهَا غَا / نِيَنْ فَغْ / نَ وَزْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "ليس هذا البيت في رواية الزَّوْزَنِيّ [@zawzani، ص104–105]، وهو في رواية ابن الأَنْبارِيّ وفي الديوان [@diwan-tarafa، ص24]. وسقي الندمان عند الجاهليين باب من الكرم. قال شوقي ضيف: «ويكثر في حماستهم تمدحهم بأنهم يسقون ندماءهم الخمر وأنهم يأخذون حظهم من الغناء وسماع القيان ولعب الميسر، وكأن في ذلك إعلانا عن كرمهم وبذلهم على نحو ما تقدم في غير هذا الموضع عن طرفة وفتوته» [@deif، ج1 ص206]. والحماسة هنا شعر الفخر بالشجاعة والخلق، والقيان: الجواري المغنيات، والميسر: القمار."
