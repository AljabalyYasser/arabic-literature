first: "ذَرِينِي أُرَوِّي هَامَتِي فِي حَيَاتِهَا"
second: "مَخَافَةَ شِرْبٍ فِي الْحَيَاةِ مُصَرَّدِ"
meaning: "دعيني أروِّ نفسي من الخمر ما دمت حيًّا، خوفًا من أن يكون شرابي في الحياة قليلًا مقطوعًا. و«المصرد» عند ابن الأَنْبارِيّ «المقلل» [@ibn-al-anbari، ص198]."
vocabulary:
  - term: "ذَرِينِي"
    text: "دعيني. وفي حاشية الديوان على بيت آخر من المعلقة: «ذرني: دعني» [@diwan-tarafa، ص27، الحاشية]."
  - term: "أُرَوِّي"
    text: "أسقي حتى الري. «يقال رويت من الشراب فأنا أروى منه ريا» [@ibn-al-anbari، ص198]."
  - term: "هَامَتِي"
    text: "رأسي، والمراد نفسه. وللكلمة ظل من معتقد جاهلي يذكره ابن الأَنْبارِيّ في البيت التالي: «كان أهل الجاهلية يزعمون إذا مات الميت خرجت من قبره هامة تزقو عليه» [@ibn-al-anbari، ص199]. وتزقو: تصيح."
  - term: "شِرْبٍ"
    text: "«(الشِّرب) بكسر الشين، والشرب بضمها: اسمان للمشروب. والشَّرب بفتح الشين: مصدر شربت شربا. والشَّرب أيضا بفتح الشين: جمع شارب» [@ibn-al-anbari، ص198]."
  - term: "مُصَرَّدِ"
    text: "«المقلل» [@ibn-al-anbari، ص198]."
syntax:
  - "«ذريني» فعل أمر للمؤنثة، والياء الأولى فاعله، والنون للوقاية، والياء الأخيرة مفعوله."
  - "«أُرَوِّي» مرفوع بثبوت الياء، فالجملة حال أو مستأنفة؛ ولو جُزم جوابًا للأمر لقيل «أُرَوِّ»، كما جُزم «أبادرها» في قوله «فدعني أبادرها» (55)."
  - "«مخافةَ» مفعول لأجله منصوب: أروّيها من أجل الخوف. و«في حياتها» متعلق بـ«أروّي»، والضمير للهامة. و«مصرّد» نعت لـ«شرب»."
morphology:
  - "«أُرَوِّي» مضارع «روّى» على «فعّل»، والتضعيف للتكثير. والمجرد «روِي يروى ريًّا» [@ibn-al-anbari، ص198]."
  - "«مُصَرَّد» اسم مفعول من «صرّد» على «فعّل»، أي قُلّل [@ibn-al-anbari، ص198]."
  - "«الشِّرْب» يأتي بكسر الشين وضمها وفتحها، ولكل صيغة معنى، وقد تكون كلها لغات في المصدر: «وقد يقال الشَّرب والشِّرب والشُّرب لغات معناهن واحد، يراد بكلهن المصدر» [@ibn-al-anbari، ص198]."
rhetoric:
  thesis: "البيت يقول ما يقوله البيت التالي: الري في الحياة قبل العطش في الموت. لكنه يقوله بلفظ آخر، ويخاطب امرأة."
  devices:
    - title: "الكناية"
      text: "«أروّي هامتي» كناية عن الإكثار من الشراب: ذكر الرأس والري، وأراد الخمر. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "التكرار"
      text: "«في حياتها» في الصدر، و«في الحياة» في العجز. فالكلمة تتكرر في بيت واحد، والبيت كله قائم على الخوف من قِصَر الحياة."
    - title: "تغيّر المخاطب"
      text: "«ذريني» خطاب لامرأة، هي العاذلة، أي اللائمة. أما البيت التالي فخطابه لرجل: «ستعلم إن متنا غدا». وقبله خاطب اللائم بالتذكير: «ألا أيهذا اللائمي» (54). فهذا الخطاب المؤنث يقطع السياق."
  connection: "ثم يقول المعنى نفسه في البيت التالي: كريم يروي نفسه في حياته، وستعلم إن متنا غدًا أيّنا العطشان."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "ذَرِينِي / أُرَوْوِي هَا / مَتِي فِي / حَيَاتِهَا = فعولن / مفاعيلن / فعولن / مفاعلن — مَخَافَ / ةَ شِرْبِنْ فِلْ / حَيَاةِ / مُصَرْرَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "بيت مشكوك في نسبته إلى المعلقة. رواه ابن الأَنْبارِيّ في هذا الموضع، ثم نقل عن أبي جعفر: «لا أعرف هذا البيت في قصيدة طرفة» [@ibn-al-anbari، ص198]. وليس في رواية الزَّوْزَنِيّ، فهو ينتقل من «كأن البرين» إلى «كريم يروي نفسه» [@zawzani، ص109]، وليس في الديوان [@diwan-tarafa، ص26]. وينقله شُرّاب في سياق المعلقة بعد الخلال الثلاث: «فذرني أروّي هامتي في حياتها» [@sharrab، ج1 ص57]. وفيما نرى، ثلاثة أمور تقوّي الشك: أنه يعيد معنى البيت التالي، وأن خطابه لامرأة بين أبيات خطابها لرجل، وأن أبا جعفر لم يعرفه. فنقرؤه لأنه في النص الذي اعتمدناه، مع التنبيه على أن نسبته لا تثبت."
variants:
  - reading: "فَذَرْنِي أُرَوِّي هَامَتِي فِي حَيَاتِهَا"
    status: "رواية أخرى"
    note: "بخطاب المذكر، وبه ينقله شُرّاب [@sharrab، ج1 ص57]. وعلى هذه الرواية يستقيم الخطاب مع البيت التالي."
