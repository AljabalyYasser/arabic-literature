first: "وَمَا زَالَ تَشْرَابِي الْخُمُورَ وَلَذَّتِي"
second: "وَبَيْعِي وَإِنْفَاقِي طَرِيفِي وَمُتْلَدِي"
meaning: "ما زلت أشرب الخمر وأطلب اللذة، وأبيع ما أملك وأنفق مالي الذي كسبته والذي ورثته. قال الزَّوْزَنِيّ: «لم أزل أشرب الخمر وأشتغل باللذات وبيع الأعلاق النفيسة وإتلافها» [@zawzani، ص106]. والأعلاق: النفائس."
vocabulary:
  - term: "تَشْرَابِي"
    text: "«التشراب: الشرب» [@ibn-al-anbari، ص191]."
  - term: "طَرِيفِي"
    text: "«والطارف، والطريف: ما استحدثه الرجل واكتسبه» [@ibn-al-anbari، ص191]."
  - term: "مُتْلَدِي"
    text: "التالد والتليد والمُتْلَد: «ما ورثه عن آبائه» [@ibn-al-anbari، ص191]."
syntax:
  - "«وموضع التشراب رفع بزال» [@ibn-al-anbari، ص191]، أي أنه اسم «ما زال»، و«الخمور» مفعول به للمصدر «تشراب»."
  - "«واللذة والبيع والإنفاق نسق على الشراب» [@ibn-al-anbari، ص191]، أي معطوفة عليه. و«طريفي ومتلدي» مفعولان للمصدرين «بيعي وإنفاقي»."
  - "خبر «ما زال» في البيت التالي: «إلى أن تحامتني العشيرة»، و«وإلى خبر زال» [@ibn-al-anbari، ص192]."
morphology:
  - "«تَشْراب» مصدر على «تَفْعال» بفتح التاء، يدل على الكثرة، «مثل التقتال بمعنى القتل» [@zawzani، ص106]."
  - "«مُتْلَد» و«تالِد» و«تَليد» من أصل واحد، هو القِدَم [@zawzani، ص106]."
  - "«إنفاق» مصدر «أنفق» على «إفعال»."
rhetoric:
  thesis: "يعترف ولا يعتذر: عدّد ما أتلف من ماله كأنه يعدّ مفاخر."
  devices:
    - title: "صيغة الكثرة"
      text: "اختار «تَشْرابي» على «شُرْبي»؛ و«تَفْعال» بناء يدل على كثرة الفعل وتكراره، كما يفسره الزَّوْزَنِيّ بـ«التقتال بمعنى القتل» [@zawzani، ص106]."
    - title: "الطباق"
      text: "«طريفي ومتلدي»: الجديد والقديم من المال. فالإتلاف شمل كل ما يملك، ما كسبه بيده وما ورثه من آبائه."
    - title: "تتابع المعطوفات"
      text: "التشراب، واللذة، والبيع، والإنفاق: أربعة مصادر متتابعة بالواو، كأنها سيرة حياة في سطر واحد."
  connection: "والجملة لا تتم إلا بالبيت التالي: «إلى أن تحامتني العشيرة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَمَا زَا / لَ تَشْرَابِلْ / خُمُورَ / وَلَذْذَتِي = فعولن / مفاعيلن / فعولُ / مفاعلن — وَبَيْعِي / وَإِنْفَاقِي / طَرِيفِي / وَمُتْلَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]."
context: "يستشهد شوقي ضيف بهذا البيت وما بعده على الخمر في المجتمع الجاهلي: «وكان من الشباب من يدمن عليها حتى تنفر منه قبيلته، وقد تخلعه لما يتدنى فيه من رذائل» [@deif، ج1 ص70]. والخَلْع أن تتبرأ القبيلة من الرجل فلا تحميه."
