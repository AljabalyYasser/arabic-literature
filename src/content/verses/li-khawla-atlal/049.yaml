first: "رَحِيبٌ قِطَابُ الْجَيْبِ مِنْهَا رَفِيقَةٌ"
second: "بِجَسِّ النَّدَامَى بَضَّةُ الْمُتَجَرَّدِ"
meaning: "جيب ثوبها واسع، وهي رفيقة بالندامى إذا لمسوها بأيديهم، ناعمة البشرة إذا تجردت من ثيابها. قال الزَّوْزَنِيّ: «هذه القينة واسعة الجيب لإدخال الندامى أيديهم في جيبها للمسها، ثم قال: هي رفيقة على جسّ الندامى إياها، وما يعرى من جسدها ناعم اللحم رقيق الجلد صافي اللون» [@zawzani، ص106]. والجيب فتحة الثوب عند الصدر، فالمعنى بلغة اليوم: يدخل الشاربون أيديهم من فتحة ثوبها فيلمسون صدرها وجسدها، وهي تلين لهم ولا تمتنع."
vocabulary:
  - term: "رَحِيبٌ"
    text: "«الواسع. والرحبة: المتسع. من ذلك قولهم: مرحبا وأهلا، أي لقيت سعة وأهلا» [@ibn-al-anbari، ص189]."
  - term: "قِطَابُ الْجَيْبِ"
    text: "«مجتمع الجيب. قطب، أي جمع. ومنه: جاء الناس قاطبة، أي جميعا» [@ibn-al-anbari، ص189]. وعند الزَّوْزَنِيّ: «مخرج الرأس منه» [@zawzani، ص105–106]. والجيب: فتحة الثوب عند العنق."
  - term: "جَسِّ"
    text: "اللمس: «والجس: اللمس، والفعل جس يجس جسًّا» [@zawzani، ص106]. وقال الطُّوسِيّ: «جس الندامى: أن يجسوا بأيديهم يلمسونها» [@ibn-al-anbari، ص190]."
  - term: "بَضَّةُ"
    text: "«البيضاء الرقيقة الجلد الناعمة». وقال يعقوب: «ويقال ابيض بض ولا يقال أسود بض» [@ibn-al-anbari، ص190]."
  - term: "الْمُتَجَرَّدِ"
    text: "قال يعقوب: «المتجرد: ما سترته الثياب من الجسد» [@ibn-al-anbari، ص190]. وعند الزَّوْزَنِيّ: «حيث تجرد أي تعرى» [@zawzani، ص106]."
syntax:
  - "«والقطاب يرتفع برحيب، ورحيب نعت لقينة» [@ibn-al-anbari، ص190]: «رحيبٌ» نعت لـ«قينة» في البيت السابق، و«قطابُ» فاعل للصفة «رحيب»."
  - "ولم يقل «قطاب جيبها»، لأن «الألف واللام بدل من الهاء كأنه قال: رحيب قطاب جيبها» [@ibn-al-anbari، ص190]. وهذا قول الكوفيين: أن «ال» تنوب عن الضمير."
  - "«والرفيقة نعت لها أيضا، أعني القينة، وكذلك البضة» [@ibn-al-anbari، ص190]. و«بجس» متعلق بـ«رفيقة»."
morphology:
  - "«رحيب» على «فعيل» صفة من «رحُب»: «ويقال: قد رحب المكان يرحب رحبا، إذا اتسع» [@ibn-al-anbari، ص189]."
  - "«بَضّة» صفة من «بضّ يبَضّ»: «الغضاضة والبضاضة: نعومة البدن ورقة الجلد. والفعل غضّ يغَضّ وبض يبَضّ» [@zawzani، ص106]."
  - "«المُتَجَرَّد» على صيغة اسم المفعول من «تجرّد» على «تفعّل»، والمراد به موضع التجرد من الجسد، لا الشخص المتجرد [@ibn-al-anbari، ص190] [@zawzani، ص106]."
rhetoric:
  thesis: "البيت كله لمس: جيب واسع، ويد تجس، وبشرة ناعمة. وهو أجرأ صور المجلس."
  devices:
    - title: "الكناية"
      text: "سعة الجيب ليست وصفًا للثوب. هي كناية عن تمكين الندامى من لمسها، كما يفسرها الزَّوْزَنِيّ: «واسعة الجيب لإدخال الندامى أيديهم في جيبها للمسها» [@zawzani، ص106]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "التدرج"
      text: "يبدأ من الثوب (الجيب)، ثم إلى الأيدي (الجس)، ثم إلى الجسد (المتجرد). فالوصف ينتقل من الظاهر إلى الخفي خطوة خطوة."
    - title: "صفات متتابعة"
      text: "ثلاث صفات للقينة بلا عاطف: «رحيب»، و«رفيقة»، و«بضة»، كلها نعوت لها [@ibn-al-anbari، ص190]. فالوصف يتوالى كما تتوالى نظرات الندامى."
  connection: "ثم يصفها تغني إذا طلبوا الغناء، متمهلة فاترة الطرف."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "رَحِيبُنْ / قِطَابُلْ جَيْ / بِ مِنْهَا / رَفِيقَتُنْ = فعولن / مفاعيلن / فعولن / مفاعلن — بِجَسْسِنْ / نَدَامَى بَضْ / ضَتُلْ مُ / تَجَرْرَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]."
context: "الوسط من صورة القينة (48–50). وفي شرح ابن الأَنْبارِيّ بيت للأعشى يفسر العادة التي يصفها طَرَفَة: «لجس الندامى في يد الدرع مفتق»، ثم يقول: «وذلك أن القينة كان يفتق فتق في كمها إلى الرسغ، فإذا أراد الرجل أن يلمس منها شيئا أدخل يده فلمس. ويد الدرع: كمه» [@ibn-al-anbari، ص190]. والدرع هنا قميص المرأة، والمفتق: الشق، والرسغ: مفصل الكف. فالصورة من عادة مجالس الشراب، لا من خيال طَرَفَة وحده."
variants:
  - reading: "رَحِيبُ قِطَابِ الْجَيْبِ مِنْهَا رَفِيقَةٌ"
    status: "رواية أخرى"
    note: "بخفض «قطاب». قال ابن الأَنْبارِيّ إن الرفع رواية الأَصْمَعِيّ، «ورواه غيره: (رحيب قطاب الجيب)، فأنكر أبو جعفر هذه الرواية الثانية وقال: لا أعرف إلا الرفع مع التنوين». وقال ابن الأَنْبارِيّ نفسه: «وخفض قطاب عندي خطأ، لأن الرحيب لو كان منقولا إلى القينة لقال رحيبة قطاب الجيب» [@ibn-al-anbari، ص189–190]."
