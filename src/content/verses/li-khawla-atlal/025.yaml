first: "جَنُوحٌ دُفَاقٌ عَنْدَلٌ ثُمَّ أُفْرِعَتْ"
second: "لَهَا كَتِفَاهَا فِي مُعَالًى مُصَعَّدِ"
meaning: "تميل في سيرها على أحد شقيها من نشاطها، مندفعة مسرعة، ضخمة الرأس، وقد رُفعت كتفاها في خَلق عالٍ مرتفع. قال الزَّوْزَنِيّ: «هذه الناقة شديدة الميلان عن سمت الطريق لفرط نشاطها في السير مسرعة غاية الإسراع عظيمة الرأس، وقد عليت كتفاها في خلق معالي مصعَّد» [@zawzani، ص99]."
vocabulary:
  - term: "جَنُوحٌ"
    text: "«التي تجنح في سيرها فتعتمد على أحد شقيها» [@ibn-al-anbari، ص168]. وقال أبو جعفر: «جانحة الصدر من الأرض، وهذا يستحب في الإناث» [@ibn-al-anbari، ص169]."
  - term: "دُفَاقٌ"
    text: "«المتدفقة في سيرها المسرعة. ويقال: هو يمشي الدفقي، إذا اندفق في سيره وأسرع» [@ibn-al-anbari، ص168–169]."
  - term: "عَنْدَلٌ"
    text: "«الضخمة. وقال الطوسي: هي ضخمة الرأس. ويقال للرأس إذا كان ضخما: عندل، وصندل، وقندل» [@ibn-al-anbari، ص169]."
  - term: "أُفْرِعَتْ"
    text: "«معناه أشرفت وعوليت. ويقال: إنه لمفرع الكتف، إذا كان مشرفها» [@ibn-al-anbari، ص169]. و«الإفراع: التعلية» [@zawzani، ص99]."
  - term: "مُعَالًى"
    text: "«المعالي: المرتفع إلى فوق، والمصعد مثله» [@ibn-al-anbari، ص169]."
syntax:
  - "«والجنوح يرتفع بإضمار هي، والدفاق والعندل نعتان لها» [@ibn-al-anbari، ص169]، أي أن «جنوح» خبر لمبتدأ محذوف. «ويجوز في الجنوح الرفع والجر على ما مر» [@zawzani، ص99]، يعني الجر صفةً لـ«عوجاء» كما في البيت 23."
  - "«والكتفان اسم ما لم يسم فاعله» [@ibn-al-anbari، ص169]، أي نائب فاعل لـ«أُفرعت»."
  - "«في معالًى» قال فيه أبو جعفر: «معناه مع معالي» [@ibn-al-anbari، ص169]، فـ«في» بمعنى «مع». وقدّر الزَّوْزَنِيّ موصوفًا محذوفًا: «يريد في خلق معالى أو ظهر معالى، فحذف الموصوف اجتزاء بدلالة الصفة عليه» [@zawzani، ص99]."
morphology:
  - "«جَنُوح» على «فَعُول»، «مبالغة الجانحة» [@zawzani، ص99]."
  - "«دُفاق» يُضبط بالضم والكسر: «يروى دِفاق ودُفاق، بالكسر والضم» [@ibn-al-anbari، ص169]."
  - "«مُعالًى» اسم مفعول من «عالى»، و«مُصَعَّد» اسم مفعول من «صعّد»، و«المعالاة والإعلاء والتعلية واحد، والتصعيد مثلها» [@zawzani، ص99]."
rhetoric:
  thesis: "ثلاث صفات متلاحقة للسير والرأس، ثم «ثمّ» تنقل النظر إلى الكتفين المرتفعين."
  devices:
    - title: "في التمثال: الرأس والكتفان"
      text: "يعطي الرأس حجمه أول مرة: «عندل»، أي «ضخمة الرأس» [@ibn-al-anbari، ص169]. ثم يرفع الكتفين. وسيعود إلى الرأس عضوًا عضوًا بعد قليل: العنق، والجمجمة، والوجه، والعينين، والأذنين (28–34)."
    - title: "تتابع الصفات"
      text: "«جنوح دفاق عندل» ثلاث صفات بلا عاطف، كل منها كلمة واحدة. فالبيت يبدأ بإيقاع سريع كسرعة الناقة، ثم يتمهّل مع «ثمّ» وجملتها الطويلة."
    - title: "ميلٌ محمود"
      text: "الجنوح ميل، والميل في العادة عيب. لكنه هنا من فرط النشاط: «التي تميل في أحد الشقين لنشاطها في السير» [@zawzani، ص99]. وعند أبي جعفر هو انصباب الصدر نحو الأرض، «وهذا يستحب في الإناث»، «ويستحب إشرافه في الذكور» [@ibn-al-anbari، ص169]."
  connection: "ثم يصف آثار الأنساع في صدرها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "جَنُوحُنْ / دُفَاقُنْ عَنْ / دَلُنْ ثُمْ / مَ أُفْرِعَتْ = فعولن / مفاعيلن / فعولن / مفاعلن — لَهَا كَ / تِفَاهَا فِي / مُعَالَنْ / مُصَعْعَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "من سلسلة الصفات التي تجمع الخَلق والسير (23–25). وقد اختلف الشرّاح في «الجنوح»: هو عند ابن الأَنْبارِيّ ميل في السير، ومثله عند الزَّوْزَنِيّ، وعند أبي جعفر أحمد بن عبيد انصباب الصدر نحو الأرض [@ibn-al-anbari، ص168–169] [@zawzani، ص99]. واختلفوا في ضبط «دفاق» وفي ترتيب الكلمتين الأوليين، كما في الروايات."
