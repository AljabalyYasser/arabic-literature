first: "فَمِنْهُنَّ سَبْقُ الْعَاذِلَاتِ بِشَرْبَةٍ"
second: "كُمَيْتٍ مَتَى مَا تُعْلَ بِالْمَاءِ تُزْبِدِ"
meaning: "فأولاهن أن أسبق اللائمات بشربة من خمر حمراء، إذا صُبّ عليها الماء أزبدت. قال الزَّوْزَنِيّ: «يريد أن يباكر شرب الخمر قبل انتباه العواذل» [@zawzani، ص108]."
vocabulary:
  - term: "الْعَاذِلَاتِ"
    text: "اللائمات، جمع عاذلة. وفي رواية أبي عَمْرو: «أي أغدو على شرب الخمر قبل لوم العاذلات» [@ibn-al-anbari، ص194]."
  - term: "كُمَيْتٍ"
    text: "الخمر الحمراء: «الحمراء إلى الكلفة». وقال الطُّوسِيّ: «حمرتها تضرب إلى السواد». وقال أبو جعفر: «هي من العنب الأسود» [@ibn-al-anbari، ص194]."
  - term: "تُعْلَ"
    text: "يُصبّ عليها من أعلاها."
  - term: "تُزْبِدِ"
    text: "يعلوها الزَّبَد، وهو الرغوة."
syntax:
  - "«والسبق رفع بمن. وهن تعود على ثلاث» [@ibn-al-anbari، ص194]؛ أي «منهنّ» خبر مقدم، و«سبقُ» مبتدأ مؤخر."
  - "«كُمَيْتٍ» صفة لـ«شربة» على حذف موصوف: بشربة خمر كميت."
  - "«وتعل مجزوم بمتى ما، وتزبد جواب الجزاء» [@ibn-al-anbari، ص194]. وحُذفت الألف من آخر «تُعلى» للجزم."
morphology:
  - "«كُمَيْت» على «فُعَيْل»، بناء التصغير، ولا يُستعمل مكبّرًا."
  - "«تُعْلَ» مضارع «أعلى» مبني للمجهول، مجزوم بحذف حرف العلة."
  - "«العاذلات» جمع «عاذلة» اسم فاعل من «عذل» بمعنى لام."
rhetoric:
  thesis: "الخلة الأولى ليست الخمر وحدها، بل أن يشربها قبل أن يستيقظ اللوم."
  devices:
    - title: "التجسيد"
      text: "جعل الشرب سباقًا مع العاذلات: هو يبكّر ليسبق ألسنتهن. فاللذة عنده غلبة على من يلومه، لا متعة فقط."
    - title: "الصورة اللونية"
      text: "اختار للخمر صفتين تُريان بالعين: لونها الأحمر الضارب إلى السواد، وزبدها حين يُصب عليها الماء."
  connection: "ثم الخلة الثانية: نجدة الخائف."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَمِنْهُنْ / نَ سَبْقُلْ عَا / ذِلَاتِ / بِشَرْبَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — كُمَيْتِنْ / مَتَى مَا تُعْ / لَ بِلْمَا / ءِ تُزْبِدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]."
context: "من الأبيات الأربعة (56–59) التي يعدّ فيها «ثلاث خلال» تجعل الحياة عنده جديرة بأن تُعاش. وقد عدّها ابن رَشِيق من «الاختراع»، وهو عنده «ما لم يسبق إليه قائله، ولا عمل أحد من الشعراء قبله نظيره أو ما يقرب منه» [@ibn-rashiq، ج1 ص262]. ويرى شوقي ضيف أنه «يجعل من خلال الفتى هذه الخصال الثلاث، وهي الخمر والفروسية أو الشجاعة في الحرب والتمتع بالنساء» [@deif، ج1 ص71]."
variants:
  - reading: "فَمِنْهُنَّ سَبْقِي الْعَاذِلَاتِ بِشَرْبَةٍ"
    status: "رواية أبي عَمْرو"
    note: "[@ibn-al-anbari، ص194]. وهي رواية الزَّوْزَنِيّ [@zawzani، ص108] وابن قُتَيْبة [@ibn-qutayba، ج1 ص188]."
