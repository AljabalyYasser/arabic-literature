first: "إِذَا نَحْنُ قُلْنَا أَسْمِعِينَا انْبَرَتْ لَنَا"
second: "عَلَى رِسْلِهَا مَطْرُوفَةً لَمْ تَشَدَّدِ"
meaning: "إذا قلنا لها: غنّينا، أخذت في الغناء على مهلها، فاترة الطرف، لا تتكلف ولا تُجهد صوتها. قال الزَّوْزَنِيّ: «إذا سألناها الغناء عرضت تغنينا متئدة في غنائها على ضعف نغمتها لا تشدد فيها» [@zawzani، ص106]."
vocabulary:
  - term: "أَسْمِعِينَا"
    text: "«أي غنينا» [@zawzani، ص106]."
  - term: "انْبَرَتْ"
    text: "«معناه اعترضت لنا». وقال الطُّوسِيّ: «معناه أخذت فيما يطلب منها فغنت» [@ibn-al-anbari، ص190]."
  - term: "عَلَى رِسْلِهَا"
    text: "«على تؤدتها ووقارها» [@zawzani، ص106]، أي على مهلها."
  - term: "مَطْرُوفَةً"
    text: "«فاترة الطرف، معناه ساكنة كأنها طرفت عن كل شيء تنظر إليه». وقال أبو جعفر: «معنى قوله مطروفة كأنها قد أصابت عينها طرفة من فتورها» [@ibn-al-anbari، ص190]. والطَّرْفة: ما يصيب العين فيكسر نظرها."
  - term: "تَشَدَّدِ"
    text: "تتشدد، أي تجتهد وتتكلف: «أراد لم تتشدد فحذف إحدى التاءين» [@zawzani، ص106]."
syntax:
  - "«ونحن في موضع رفع بما عاد من النون والألف في قلنا» [@ibn-al-anbari، ص191]: هذا قول الكوفيين، يرفعون الاسم بالضمير العائد عليه. وعند البصريين «نحن» ضمير منفصل فاعل لفعل محذوف يفسّره «قلنا»، لأن «إذا» يليها الفعل."
  - "«وانبرت جواب إذا. ومطروفة منصوبة على الحال من الضمير الذي في انبرت» [@ibn-al-anbari، ص191]. و«على رسلها» حال أيضًا، وجملة «لم تشدد» حال ثالثة."
  - "جملة «أَسْمِعِينَا» مقول القول: فعل أمر للمؤنثة، والياء فاعله، و«نا» مفعوله."
morphology:
  - "«تَشَدَّدِ» أصله «تتشدّد»، «فحذف إحدى التاءين استثقالًا لهما في صدر الكلمة» [@zawzani، ص106]. ومثّل له الزَّوْزَنِيّ بقوله تعالى: ﴿تَنَزَّلُ الْمَلَائِكَةُ﴾ و﴿نَارًا تَلَظَّى﴾."
  - "«انْبَرَتْ» على «انفعل» من «برى»: «البري والانبراء والتبري: الاعتراض للشيء والأخذ فيه» [@zawzani، ص106]."
  - "«مَطْرُوفَة» اسم مفعول من «طُرِفت عينُه» إذا أصابها شيء. وأنشد أبو جعفر للمُخَبَّل: «وإذا ألمّ خيالها طُرفت / عيني فماء شؤونها سجم» [@ibn-al-anbari، ص190]، أي إذا زارني طيفها أصاب عيني ما يصيبها فسال دمعها. والشؤون: مجاري الدمع، والسجم: السائل."
rhetoric:
  thesis: "غناء بلا تكلف: تستجيب في الحال، وتغني على مهلها. فجمال الغناء عنده في سهولته."
  devices:
    - title: "الطباق في المعنى"
      text: "الطباق أن تجمع في الكلام بين الشيء وضده. و«انبرت» سرعة في الاستجابة، و«على رسلها» تمهّل في الأداء. فهي لا تتأخر عن الطلب، ولا تتعجل في الغناء."
    - title: "الكناية"
      text: "«مطروفة» كناية عن فتور العين وانكسارها، كأن شيئًا أصاب طرفها، وهو عند أبي جعفر من «فتورها» [@ibn-al-anbari، ص190]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "المدح بالنفي"
      text: "«لم تشدد»: مدحها بنفي الجهد عنها. فالصوت الذي يُجهد صاحبه لا يُطرب، والذي يخرج على رسله يُطرب."
  connection: "ثم يعترف: ما زال يشرب الخمر وينفق ماله حتى تحامته العشيرة (51–52)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِذَا نَحْ / نُ قُلْنَا أَسْ / مِعِينَنْ / بَرَتْ لَنَا = فعولن / مفاعيلن / فعولن / مفاعلن — عَلَى رِسْ / لِهَا مَطْرُو / فَتَنْ لَمْ / تَشَدْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]. وتسقط ألف «أسمعينا» في النطق قبل ساكن «انبرت»، فتُكتب في التقطيع «مِعِينَنْ بَرَتْ»."
context: "آخر صورة القينة (48–50). وفي رواية الزَّوْزَنِيّ بعده بيت ليس عند ابن الأَنْبارِيّ، يصف صوتها إذا ردّدته: «إذا رجّعت في صوتها خلت صوتها / تجاوب أظآر على رُبَع ردي» [@zawzani، ص106]، وهو في الديوان أيضًا [@diwan-tarafa، ص25]. قال الزَّوْزَنِيّ في معناه: «حسبت صوتها أصوات نوق تصيح عند جؤارها على هالك» [@zawzani، ص106]. والأظآر: النوق العاطفة على الولد، والرُّبَع: ولد الناقة في أول النتاج. ومن هنا ينتقل الشاعر من المجلس إلى ثمنه: المال الذي أنفقه، والعشيرة التي تجنبته."
variants:
  - reading: "عَلَى رِسْلِهَا مَطْرُوقَةً لَمْ تَشَدَّدِ"
    status: "رواية التَّوَّزِيّ وأبي يوسف"
    note: "«فمعناه مسترخية لم تشدد: لم تجتهد». وقال أبو جعفر: «لا أعرف مطروقة بالقاف». وقال يعقوب: «يروى على وجهين بالقاف والفاء» [@ibn-al-anbari، ص191]. وهي رواية الزَّوْزَنِيّ، وفسرها: «المطروقة: التي بها ضعف» [@zawzani، ص106]."
