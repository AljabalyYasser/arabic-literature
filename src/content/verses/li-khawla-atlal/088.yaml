first: "فَمَرَّتْ كَهَاةٌ ذَاتُ خَيْفٍ جُلَالَةٌ"
second: "عَقِيلَةُ شَيْخٍ كَالْوَبِيلِ يَلَنْدَدِ"
meaning: "فمرّت بي ناقة ضخمة مسنّة، عظيمة الضرع، جليلة، هي خير مال شيخ يابس كالعصا، شديد الخصومة. قال الزَّوْزَنِيّ: «وهي كريمة مال شيخ قد يبس جلده ونحل جسمه من الكبر حتى صار كالعصا الضخمة يبسًا ونحولًا، وهو شديد الخصومة» [@zawzani، ص116]."
vocabulary:
  - term: "كَهَاةٌ"
    text: "«قال يعقوب: الكَهاة: الضّخمة المسنة» [@ibn-al-anbari، ص219]."
  - term: "خَيْفٍ"
    text: "«الخيف: جلد الضّرع». «وقال الطوسي: الخيف: جراب الضرع، وهو جلدته العُليا» [@ibn-al-anbari، ص219]."
  - term: "جُلَالَةٌ"
    text: "الجليلة العظيمة: «و(الجُلالة) والجليل: وهو الجُلال أيضاً» [@ibn-al-anbari، ص219]."
  - term: "عَقِيلَةُ"
    text: "«خير ماله؛ وكذلك عقيلة النساء: خيرتهن» [@ibn-al-anbari، ص219]."
  - term: "الْوَبِيلِ"
    text: "«العصا، ويقال هي العصا الطويلة الغليظة، أي قد يبس هذا الشيخ حتى صار مثل هذه العصا» [@ibn-al-anbari، ص219–220]."
  - term: "يَلَنْدَدِ"
    text: "«الشديد الخصومة» [@ibn-al-anbari، ص220]."
syntax:
  - "«والكهاة مرتفعة بفعلها، وذات والعقيلة نعتان لها» [@ibn-al-anbari، ص220]، أي «كهاة» فاعل «مرّت»، و«جلالة» نعت ثالث."
  - "«والكاف والألندد مخفوضان على النعت للشيخ» [@ibn-al-anbari، ص220]: «كالوبيل» في موضع جر نعتًا لـ«شيخ»، و«يلندد» نعت ثانٍ له."
morphology:
  - "«يَلَنْدَد» و«أَلَنْدَد» واحد، «يبدل الياء من الهمزة كما قالوا: الأرندج واليرندج، والأرقان واليرقان» [@ibn-al-anbari، ص220]. وأصله من اللَّدَد: «اليلندد والألندد والألدّ: الشديد الخصومة، وقد لَدَّ الرجل يَلَدُّ لددًا» [@zawzani، ص116]."
  - "من «الخَيْف» قولهم: «ناقة خيفاء، إذا كانت عظيمة الخَيف» [@ibn-al-anbari، ص219]."
  - "«جُلالة» على «فُعالة» من «جلّ»، بمعنى «جليلة»."
rhetoric:
  thesis: "بيت يعظّم الناقة ويصغّر صاحبها: أربع صفات للناقة، وصورة يابسة للشيخ."
  devices:
    - title: "تراكم الصفات"
      text: "كَهاة، ذات خيف، جُلالة، عقيلة: كلما عظمت الناقة عظم الكرم في نحرها. وسيزيد ذلك في البيت 92 حين يذكر جنينها، فالزَّوْزَنِيّ يرى أن ذكره «دال على أنها كانت حبلى وهي من أنفس الإبل عندهم» [@zawzani، ص117]."
    - title: "التشبيه"
      text: "«كالوبيل»: الشيخ عصا غليظة يابسة. وينقل البَغْداديّ أن الوبيل الحزمة من الحطب، «فعلى هذا شبّه عظامه في اليبوسة بالحطب» [@khizana، ج3 ص155]. والوجهان عند ابن الأَنْبارِيّ: العصا، والحزمة [@ibn-al-anbari، ص219–220]."
    - title: "التمهيد للحوار"
      text: "«يلندد»: شديد الخصومة. صفة تهيّئ السامع لما سيقوله الشيخ في الأبيات الثلاثة التالية."
  connection: "ثم يعقرها، فيتكلم الشيخ."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَمَرْرَتْ / كَهَاتُنْ ذَا / تُ خَيْفِنْ / جُلَالَتُنْ = فعولن / مفاعيلن / فعولن / مفاعلن — عَقِيلَ / تُ شَيْخِنْ كَلْ / وَبِيلِ / يَلَنْدَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "من الشيخ؟ للشراح أقوال. قال أبو جعفر: «الشيخ هاهنا يعني أباه، أي إنه كان يشفق عليها ويحوطها» [@ibn-al-anbari، ص219]. وقال الزَّوْزَنِيّ: «قيل: أراد به أباه... وقيل: بل أراد غيره ممن يغير هو على ماله، والقول الأول أحراهما بالصواب» [@zawzani، ص116]. وقال ابن السِّكِّيت، فيما ينقله البَغْداديّ: «هو بعض بني عم طرفة كان طرفة عقر له ناقة» [@khizana، ج3 ص155]. ويشرح المَرْزُوقِيّ عادة تقرّب القول الأخير: كان الكريم منهم إذا نحر لندمائه يتعمد «أن يفعل ذلك في غير ملكه، يستام مالك الجزور بها أغلى الأثمان فيغرمه، ويعد ذلك الغرم غنماً، والصبر على سوء خلقه وإنكاره التبسط في ملكه بغير إذنه كرماً»، ثم قال: «وقد سلك هذا المسلك طرفة فقال ووفى المعنى حقه» [@marzuqi-hamasa، ص893]. ومعنى «يستام مالك الجزور بها أغلى الأثمان»: يدع صاحب الناقة يسومها بأغلى ثمن، ثم يدفعه إليه. ويشكل على القول بأنه أبوه، في رأينا، ما يرويه ابن قُتَيْبة من أن أبا طَرَفَة «مات وطرفة صغير» [@ibn-qutayba، ج1 ص184]."
variants:
