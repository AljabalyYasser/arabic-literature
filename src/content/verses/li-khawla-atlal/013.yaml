first: "تُبَارِي عِتَاقًا نَاجِيَاتٍ وَأَتْبَعَتْ"
second: "وَظِيفًا وَظِيفًا فَوْقَ مَوْرٍ مُعَبَّدِ"
meaning: "تسابق نوقًا كريمة مسرعة، تفعل فعلها وتغالبها، وتُتبع خطو رجلها خطو يدها على طريق مذلّل وطئته الأقدام. قال الزَّوْزَنِيّ: «هي تباري إبلًا كرامًا مسرعات في السير وتتبع وظيف رجلها وظيف يدها فوق طريق مذلل بالسلوك والوطء بالأقدام والحوافر والمناسم في السير» [@zawzani، ص94]. والمناسم: أطراف أخفاف الإبل."
vocabulary:
  - term: "تُبَارِي"
    text: "«معناه: هما يتباريان في السير، إذا فعل هذا شيئا فعل هذا مثله» [@ibn-al-anbari، ص153]. و«باريت الرجل: فعلت مثل فعله مغالبًا له» [@zawzani، ص94]."
  - term: "عِتَاقًا"
    text: "«الكرام من الإبل البيض. والعتق: الكرم؛ والعتق أيضا: الحسن والجمال» [@ibn-al-anbari، ص153]."
  - term: "نَاجِيَاتٍ"
    text: "«السراع. والنجاء: السرعة» [@ibn-al-anbari، ص153]."
  - term: "وَظِيفًا"
    text: "«والوظيفان في اليدين: ما بين الرسغين إلى الركبتين... وفي الرجلين: ما بين الرسغين إلى العرقوبين» [@ibn-al-anbari، ص154]. والرسغ: المفصل الذي فوق الخف."
  - term: "مَوْرٍ"
    text: "«الطريق» [@ibn-al-anbari، ص154]."
  - term: "مُعَبَّدِ"
    text: "«الذي قد وطئ حتى ذهب نبته وأثر فيه الناس ولحبوه حتى صيرت له جادة» [@ibn-al-anbari، ص154]. والجادة: الطريق الواضح المسلوك."
syntax:
  - "«وموضع (تبارى) نصب على الحال من الهاء والالف»، أي من الضمير «ها» في «نسأتها» في البيت 12، «لو صرفته إلى فاعل لنصبته»، أي لو جعلته اسم فاعل لقلت: «مباريةً». «ويجوز أن يكون في موضع خفض على الاتباع لأمون» [@ibn-al-anbari، ص154]، أي صفة أخرى للناقة المجرورة. والخفض في اصطلاح الكوفيين: الجر."
  - "«والناجيات موضعها نصب على النعت للعتاق. واختفضت التاء لأنها غير أصلية» [@ibn-al-anbari، ص154]: يريد أن جمع المؤنث السالم يُنصب بالكسرة."
  - "«و (فوق) صلة اتبعت. و (المعبد) نعت للمور» [@ibn-al-anbari، ص154]، والصلة هنا التعلّق: الظرف متعلق بالفعل. و«وظيفًا وظيفًا» مفعولا «أتبعت»، أي جعلت وظيف رجلها يتبع وظيف يدها [@zawzani، ص94]."
morphology:
  - "«تُبارِي» مضارع «بارى» على «فاعَل»، وهو بناء المشاركة والمغالبة: «فعلت مثل فعله مغالبًا له» [@zawzani، ص94]."
  - "«ناجِيات» جمع «ناجية»، من «نجا ينجو نَجًا ونجاء أي: أسرع في السير». و«العتاق: جمع عتيق» [@zawzani، ص94]."
  - "«مُعَبَّد» اسم مفعول من «عبّد»، و«التعبيد: التذليل والتأثير» [@zawzani، ص94]. وهو عند ابن الأَنْبارِيّ من الأضداد، أي الألفاظ التي تحمل المعنى وضده: «ويقال بعير معبد، أي مذلل. وبعير معبد أي مكرم. وهذا الحرف من الأضداد» [@ibn-al-anbari، ص154]."
rhetoric:
  thesis: "يبدأ تمثال الناقة بالقوائم وهي تتحرك: ناقة تسابق كرائم الإبل، وقوائمها تتبع بعضها في نظام."
  devices:
    - title: "في التمثال: القوائم في الحركة"
      text: "قبل أن يصف الأعضاء واحدًا واحدًا يريك الناقة ماشية. يقول شوقي ضيف إن الجاهليين «كانوا إذا وصفوا الحيوان وصفوه متحركا لا واقفا جامدا» [@deif، ج1 ص223]. فأول ما يظهر من هذا التمثال خطوه."
    - title: "تكرار يحكي الخطو"
      text: "في «وظيفًا وظيفًا» يتكرر اللفظ كما يتكرر الخطو. وفسّره أحمد بن عبيد بأنها «لم يتكل يدها على رِجلها ولا رجلُها على يدها»، وأنشد للقطامي: «يمشِينَ رَهْواً فلا الأعجازُ خاذلةٌ ... ولا الصُّدور على الأعجاز تتَّكلُ» [@ibn-al-anbari، ص153–154]. والرَّهْو: السير السهل، والأعجاز: المآخير. فكل قائمة تعمل عملها ولا تعتمد على غيرها."
    - title: "المغالبة"
      text: "اختار «تباري» ولم يقل «تسير مع»، والمباراة أن تفعل مثل فعل غيرك «مغالبًا له» [@zawzani، ص94]. ومن تباريهم «عتاق ناجيات»، أي كرام سراع؛ فمن سابق الكرام كان منهم أو فوقهم."
  connection: "ثم يذكر مرعاها في الربيع، ومنه جاءها هذا اللحم وهذه القوة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "تُبَارِي / عِتَاقَنْ نَا / جِيَاتِنْ / وَأَتْبَعَتْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَظِيفَنْ / وَظِيفَنْ فَوْ / قَ مَوْرِنْ / مُعَبْبَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "من أول وصف الناقة بعد البيتين اللذين افتتح بهما (11–12)، وهو متصل بهما في الإعراب: «تباري» حال من الناقة في «نسأتها» أو صفة لـ«أمون» [@ibn-al-anbari، ص154]. وفي رواية الزَّوْزَنِيّ بيت قبله لا يرويه ابن الأَنْبارِيّ: «جَمالِيّةٍ وَجْنَاءَ تَرْدي كَأنَّها ... سَفَنّجَةٌ تَبْرِي لأزْعَرَ أَرْبَدِ»، يشبه فيه عدوها بعدو النعامة، و«السفنجة: النعامة» [@zawzani، ص93–94]."
