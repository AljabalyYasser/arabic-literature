first: "لَهَا فَخِذَانِ أُكْمِلَ النَّحْضُ فِيهِمَا"
second: "كَأَنَّهُمَا بَابَا مُنِيفٍ مُمَرَّدِ"
meaning: "لها فخذان تمّ لحمهما، كأنهما شطرا باب قصر عالٍ أملس. قال الزَّوْزَنِيّ: «لهذه الناقة فخذان أكمل لحمهما فشابها مصراعي باب قصر عالٍ مملس أو مطوّل في العرض» [@zawzani، ص96]. والمصراعان: شطرا الباب."
vocabulary:
  - term: "أُكْمِلَ"
    text: "«معناه أتم. والكمال: التمام» [@ibn-al-anbari، ص160]."
  - term: "النَّحْضُ"
    text: "«اللحم. ويقال قد نحض العظم، إذا أخذ ما عليه من اللحم» [@ibn-al-anbari، ص160]."
  - term: "مُنِيفٍ"
    text: "«مشرف. يقال: أناف الشيء ينيف إنافة، إذا علا واشرف» [@ibn-al-anbari، ص160]. وأراد «بابا قصر منيف، فحذف الموصوف» [@zawzani، ص96]."
  - term: "مُمَرَّدِ"
    text: "«هو المطول»، «ويقال الممرد: المملس» [@ibn-al-anbari، ص160–161]. ومنه قوله تعالى: «صرح ممرد من قوارير»، «فمعناه قصر مشرف مطول» [@ibn-al-anbari، ص160]."
syntax:
  - "«لها» خبر مقدم، و«فخذان» مبتدأ مؤخر؛ وبعبارة ابن الأَنْبارِيّ الكوفية: الفخذان «يرتفعان بلها» [@ibn-al-anbari، ص161]، أي أن الظرف هو الذي رفعهما."
  - "«وأكمل النحض فيهما صلة الفخذين» [@ibn-al-anbari، ص161]، أي جملة صفة لهما. و«النحض» نائب فاعل للفعل المبني للمجهول «أُكمل»."
  - "«و (هما) اسم كأن، وبابا منيف خبر كأن، وهما مضافان إلى المنيف، والممرد نعت المنيف» [@ibn-al-anbari، ص161]. وحُذفت نون «بابان» للإضافة."
morphology:
  - "في «فخذ» ثلاث لغات: «فمن قال فَخِذ أخرجه على حقه، ومن قال فَخْذ خففه فأسقط حركة الخاء، ومن قال فِخْذ ألقى كسرة الخاء على الفاء فأسقط فتحة الفاء. وكذلك يقال كَبِد وكِبْد وكَبْد» [@ibn-al-anbari، ص159]."
  - "«مُنِيف» اسم فاعل من «أناف». «وقولهم: ألف ونيف من ذلك مشتق، لأنه زيادة على العقد وعلو عليه» [@ibn-al-anbari، ص160]. والعقد: العدد التام كالعشرة والمئة."
  - "«مُمَرَّد» اسم مفعول من «مرّد»، ومن أصله «الأمرد»: «وإنما سمى الأمرد أمرد لأنه أملس الخدين» [@ibn-al-anbari، ص161]."
rhetoric:
  thesis: "الفخذان بابا قصر: من هنا يدخل البناء إلى التمثال، ولن يخرج منه حتى القنطرة والسقف."
  devices:
    - title: "في التمثال: الفخذان"
      text: "بعد الذنب يصعد إلى الفخذين. ولم يصفهما بالقوة مباشرة، بل قال «أُكمل النحض فيهما»، أي تمّ لحمهما. ثم جعلهما مصراعي باب، فالتشبيه يعطي العِظَم والاستواء والتقابل: فخذان متماثلان كشطري باب واحد. والتشبيه عند ابن رَشِيق «صفة الشيء بما قاربه وشاكله، ومن جهة واحدة أو جهات كثيرة لا من جميع جهاته» [@ibn-rashiq، ج1 ص286]."
    - title: "الناقة بناء"
      text: "يقول شوقي ضيف إن الجاهليين «كانوا يشبهونها بالقصور ويشبهون قوائمها بالأعمدة وقد يشبهونها بالسفن والقناطر» [@deif، ج1 ص214]. وفي معلقة طَرَفَة كل ذلك: ألواح التابوت (12)، وباب القصر هنا، والقنطرة (22)، والسقف (24)، وسكّان السفينة (28)."
    - title: "كلمة بمعنيين"
      text: "في «الممرّد» معنيان يصلحان معًا: المطوّل والمملّس [@ibn-al-anbari، ص160–161]، وجمعهما الزَّوْزَنِيّ في تفسيره: «مملس أو مطوّل» [@zawzani، ص96]. فالباب عالٍ أملس، وكذلك الفخذ: عظيم ممتلئ لا تجعّد فيه."
  connection: "ثم يصف فقار ظهرها وأضلاعها وأعلى عنقها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "لَهَا فَ / خِذَانِ أُكْ / مِلَنْ نَحْ / ضُ فِيهِمَا = فعولُ / مفاعلن / فعولن / مفاعلن — كَأَنْنَ / هُمَا بَابَا / مُنِيفِنْ / مُمَرْرَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر والعَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "من الأعضاء الخلفية للناقة: الذنب ثم الفخذان. وصورة البناء في وصف الإبل مألوفة عندهم؛ فقد أنشد ابن الأَنْبارِيّ في معنى «الممرّد» ما قيل في فحل سمن فارتفع سنامه: «بنَى له العُلَّفُ قصراً ماردا»، «والعلف: ثمر الطلح» [@ibn-al-anbari، ص160]. أي أن ما رعاه بنى له سنامًا كالقصر العالي."
variants:
  - reading: "لَهَا فَخِذَانِ عُولِيَ النَّحْضُ فِيهِمَا"
    status: "رواية الطُّوسِيّ"
    note: "«و (عولي) معناه ظوهر وكثر» [@ibn-al-anbari، ص160]، أي جُعل بعضه فوق بعض."
