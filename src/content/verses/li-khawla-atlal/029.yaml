first: "وَجُمْجُمَةٌ مِثْلُ الْعَلَاةِ كَأَنَّمَا"
second: "وَعَى الْمُلْتَقَى مِنْهَا إِلَى حَرْفِ مِبْرَدِ"
meaning: "ولها جمجمة صلبة كالسندان، كأن مواضع التقاء عظامها اجتمعت والتأمت إلى حدّ كحدّ المبرد. قال الزَّوْزَنِيّ: «ولها جمجمة تشبه العلاة في الصلابة فكأنما انضم طرفها إلى حد عظم يشبه المبرد في الحدة والصلابة» [@zawzani، ص100]."
vocabulary:
  - term: "الْعَلَاةِ"
    text: "«السندان التي يضرب عليها الحداد حديده. شبه جمجمتها بها في صلابتها» [@ibn-al-anbari، ص173]."
  - term: "وَعَى"
    text: "«معناه اجتمع وجبر فالتقى. يقال: قد وعى عظمه، إذا اجتمع وتماسك واجتبر» [@ibn-al-anbari، ص173]. و«الوعي: الحفظ والاجتماع والانضمام، وهو في البيت على المعنى الثاني» [@zawzani، ص100]."
  - term: "الْمُلْتَقَى"
    text: "«يعنى كل شأنين من شؤون الرأس. وشؤون الرأس: ملتقى قبائله» [@ibn-al-anbari، ص173]. وقبائل الرأس: قطع عظامه التي يتصل بعضها ببعض."
  - term: "حَرْفِ"
    text: "«الحرف: الناحية، والجمع الأحرف والحروف» [@zawzani، ص100]."
  - term: "مِبْرَدِ"
    text: "أداة الحدّاد يُبرد بها الحديد، «وخص المبرد للحزوز التي فيه» [@ibn-al-anbari، ص173]. والحزوز: الخطوط المحفورة."
syntax:
  - "«والجمجمة نسق على ما تقدم» [@ibn-al-anbari، ص173]، أي معطوفة على «أتلع» في البيت السابق: ولها أتلع... ولها جمجمة."
  - "«ومثل نعتها» [@ibn-al-anbari، ص173]. و«مثل» لا تتعرّف بإضافتها إلى المعرفة، فصحّ أن تكون نعتًا للنكرة."
  - "«وكأنما حرف واحد لا يغير شيئا من الإعراب» [@ibn-al-anbari، ص173]، لأن «ما» كفّت «كأنّ» عن العمل، فجاء بعدها فعل وفاعل: «وعى الملتقى»."
morphology:
  - "«وعى» من «وعى يعي» بمعنى اجتمع، ومنه قولهم: «لا وعى عن ذاك، أي لا تماسك» [@ibn-al-anbari، ص173]."
  - "«المُلتقى» اسم مكان على «مُفتعَل» من «التقى»، أي موضع الالتقاء. و«مِبْرَد» اسم آلة على «مِفْعَل» من «برد»."
rhetoric:
  thesis: "الرأس من دكّان حدّاد: جمجمة كالسندان، وملتقى عظامها كحدّ المبرد."
  devices:
    - title: "في التمثال: الجمجمة"
      text: "بعد العنق يصل إلى الرأس. ولا يذكر شكله، بل صلابته والتئام عظامه، «وهذا أشد للرأس» [@ibn-al-anbari، ص173]. فالتمثال هنا يكاد يكون من حديد. يقول شوقي ضيف إن طَرَفَة «لا يترك شيئا دون أن يقيده، وكأنه يصنع لها تمثالا يريد أن يحفره حفرا فى أذهان العرب الذين كانوا يعجبون بنوقهم» [@deif، ج1 ص223]."
    - title: "تشبيهان من صنعة واحدة"
      text: "العلاة والمبرد كلاهما من أدوات الحدّاد. والتشبيه عند ابن رَشِيق «صفة الشيء بما قاربه وشاكله، ومن جهة واحدة أو جهات كثيرة لا من جميع جهاته» [@ibn-rashiq، ج1 ص286]. فالجهة في العلاة الصلابة، وفي المبرد الحزوز."
    - title: "قراءتان للمبرد"
      text: "فهم ابن الأَنْبارِيّ أن ملتقى العظام ناتئ مرتفع كحرف المبرد: «يقول: قد شخصا وتسنما». وفهم أحمد بن عبيد العكس: «أراد صلابته فليس لملتقاه نتو، كأنه ملتئم كله كالتئام المبرد من تحت حزوزه. فيقول: هذه الجمجمة كأنها قطعة واحدة في التئامها» [@ibn-al-anbari، ص173]. وعلى القراءتين تبقى الصلابة."
  connection: "ثم يصف وجهها كالقرطاس، ومشفرها كالنعل اليمانية."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَجُمْجُ / مَتُنْ مِثْلُلْ / عَلَاةِ / كَأَنْنَمَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَعَلْ مُلْ / تَقَى مِنْهَا / إِلَى حَرْ / فِ مِبْرَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]."
context: "من أبيات الرأس (28–35). والتشبيه بالعلاة معروف في صفة الإبل الصلبة؛ فقد قال عديّ في ناقته: «ولقد عدّيت دوسرة ... كعلاة القين مذكارا» [@muwashshah، ص113]، والقين: الحدّاد، والدَّوْسَرة: الناقة الضخمة. والفرق عند طَرَفَة أنه لم يكتف بالعلاة للجمجمة كلها، بل نزل إلى موضع التقاء عظامها، وهذا من التفصيل الذي يميّز وصفه."
