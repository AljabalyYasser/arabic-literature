first: "إِذَا ابْتَدَرَ الْقَوْمُ السِّلَاحَ وَجَدْتَنِي"
second: "مَنِيعًا إِذَا بَلَّتْ بِقَائِمِهِ يَدِي"
meaning: "إذا تسابق القوم إلى سلاحهم وجدتني منيعًا لا أُغلب، متى أمسكت يدي بمقبض هذا السيف. قال أبو جعفر: «معنى قوله إذا ابتدر القوم السلاح، إذا فوجئوا بالغارة فدهشوا كنت منيعا» [@ibn-al-anbari، ص216]."
vocabulary:
  - term: "ابْتَدَرَ"
    text: "«معناه إذا عجلوا إليه وتبادروا» [@ibn-al-anbari، ص215]. وعند الزَّوْزَنِيّ: «استبقوه» [@zawzani، ص115]."
  - term: "السِّلَاحَ"
    text: "«يذكر ويؤنث» [@ibn-al-anbari، ص215]."
  - term: "مَنِيعًا"
    text: "«الذي لا يقهر ولا يغلب» [@zawzani، ص115]."
  - term: "بَلَّتْ"
    text: "«معناه إذا علقت بقائمه يدي وظفرت به. ويقال: بللت بكذا وكذا، إذا ظفرت به» [@ibn-al-anbari، ص216]."
  - term: "قَائِمِهِ"
    text: "«وقائم السيف: مقبضه» [@ibn-al-anbari، ص216]."
syntax:
  - "«إذا» الأولى ظرف شرط، و«ابتدر» فعله، و«القومُ» فاعله، و«السلاحَ» مفعوله، وجملة «وجدتني» جوابه. والتاء في «وجدتَني» للمخاطب."
  - "«منيعًا» مفعول ثانٍ لـ«وجد»، لأنها هنا بمعنى «علم» تنصب مفعولين، والياء المفعول الأول؛ ويجوز أن يكون حالًا إن جعلت «وجد» بمعنى «لقي»."
  - "«إذا» الثانية شرط جوابه محذوف يدل عليه ما قبله: إذا بلّت يدي بقائمه كنت منيعًا. «ويدي في موضع رفع ببلت» [@ibn-al-anbari، ص216]، أي فاعل."
morphology:
  - "«ابتدر» على «افتعل» من البِدار، وهو العجلة. «ومن ذلك سمى البدر بدرا، لأنه بادر غيبوبة الشمس فطلع قبل أن تغيب» [@ibn-al-anbari، ص215]."
  - "«بلّ» مضعّف: «بلَّ بالشيء يبلّ به بلًّا إذا ظفر به» [@zawzani، ص115]. ولحقته تاء التأنيث لأن فاعله «يد» مؤنثة."
  - "«منيع» على «فعيل» من «منع»."
rhetoric:
  thesis: "ساعة الفزع: القوم يتسابقون إلى السلاح، وهو ثابت، ويده على قائم سيفه."
  devices:
    - title: "المقابلة بين الجماعة والفرد"
      text: "القوم في البيت مذعورون يستبقون، «فوجئوا بالغارة فدهشوا» كما يقول أبو جعفر [@ibn-al-anbari، ص216]، وهو واحد منيع. فالصورة تُظهر ثباته بحركة غيره."
    - title: "شرطان في بيت واحد"
      text: "«إذا... إذا»: الشرط الأول يرسم حال القوم، والثاني يرسم يده. فمنعته معلّقة بسيفه، وبهذه الصورة يختم أبيات السيف."
  connection: "ثم ينتقل من الحرب إلى الكرم: ليلة أثار فيها إبلًا باركة بسيفه (87–92)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِذَبْ تَ / دَرَلْ قَوْمُسْ / سِلَاحَ / وَجَدْتَنِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — مَنِيعَنْ / إِذَا بَلْلَتْ / بِقَائِ / مِهِي يَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "آخر أبيات السيف (83–86). والسيف الذي حلف ألا يفارقه في الحرب يخرج معه في البيت التالي إلى الإبل، فيعقر به ناقة لضيوفه. فالسلاح نفسه يشهد للشجاعة وللكرم."
