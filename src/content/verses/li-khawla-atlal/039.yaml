first: "عَلَى مِثْلِهَا أَمْضِي إِذَا قَالَ صَاحِبِي"
second: "أَلَا لَيْتَنِي أَفْدِيكَ مِنْهَا وَأَفْتَدِي"
meaning: "على مثل هذه الناقة أمضي في أسفاري، حين يقول صاحبي من خوف الفلاة: ليتني أقدر أن أفديك منها وأفدي نفسي. قال ابن الأَنْبارِيّ: «معناه: على مثل هذه الناقة أسير وأمضى إذا قال صاحبي أنا هالكون من خوف الفلاة»، ومعنى العَجُز: «ليتني أقدر على أن أفتديك وأفتدي نفسي» [@ibn-al-anbari، ص182]."
vocabulary:
  - term: "أَمْضِي"
    text: "أسير وأنفذ [@ibn-al-anbari، ص182]."
  - term: "مِنْهَا"
    text: "من الفلاة، «فجاء بمكنيها ولم يتقدم لها ذكر، لدلالة المعنى عليها» [@ibn-al-anbari، ص182]. والمَكْنيّ عند الكوفيين: الضمير."
  - term: "أَفْدِيكَ"
    text: "أجعل نفسي فداءك، أي أخلّصك بما أبذل."
  - term: "أَفْتَدِي"
    text: "أفدي نفسي وأخلّصها."
syntax:
  - "«عَلَى» متعلق بـ«أمضي»، «وكذلك إذا» [@ibn-al-anbari، ص182]."
  - "جملة «ألا ليتني...» مقول القول. «ألا» للتنبيه، «والنون والياء اسم ليت، وخبرها ما عاد من أفديك، وأفتدي نسق على أفديك» [@ibn-al-anbari، ص182]."
  - "الضمير في «منها» يعود على الفلاة ولم تُذكر، «كما قال الله عز وجل: (حتى توارت بالحجاب). فكنى عن الشمس ولم يجر لها ذكر» [@ibn-al-anbari، ص182]."
morphology:
  - "«أَمْضِي» هنا مضارع «مضى» الثلاثي، فحرف المضارعة مفتوح. وقارنه بـ«أُمضي» في البيت 11، وهو من «أمضى» الرباعي بمعنى أُذهب."
  - "«أفتدي» على «أفتعل» من «فدى»: فدى نفسه."
rhetoric:
  thesis: "بعد ثلاثين بيتًا في الناقة يعود إلى نفسه: على مثلها يمضي، حيث يتمنى صاحبه النجاة."
  devices:
    - title: "المقابلة بين الرجلين"
      text: "هو يمضي، وصاحبه يرتعد ويتمنى الفداء. فالصاحب مرآة يرى فيها السامع شجاعة الشاعر، دون أن يمدح الشاعر نفسه صراحة."
    - title: "الإضمار قبل الذكر"
      text: "أعاد الضمير في «منها» على الفلاة ولم يذكرها، لأن المعنى يدل عليها [@ibn-al-anbari، ص182]. فالفلاة حاضرة في البيت كله وإن لم يُسمّها."
  connection: "ثم يصف خوف صاحبه، ويخرج إلى الفخر بنفسه: «إذا القوم قالوا من فتى»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "عَلَى مِثْ / لِهَا أَمْضِي / إِذَا قَا / لَ صَاحِبِي = فعولن / مفاعيلن / فعولن / مفاعلن — أَلَا لَيْ / تَنِي أَفْدِي / كَ مِنْهَا / وَأَفْتَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "آخر قسم الناقة، وجسر إلى قسم الفخر. فكل ما وُصفت به الناقة من القوة والطاعة يصير هنا صفة لراكبها: هو الذي يمضي عليها."
