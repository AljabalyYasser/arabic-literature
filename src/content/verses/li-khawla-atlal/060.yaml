first: "كَأَنَّ الْبُرِينَ وَالدَّمَالِيجَ عُلِّقَتْ"
second: "عَلَى عُشَرٍ أَوْ خِرْوَعٍ لَمْ يُخَضَّدِ"
meaning: "كأن خلاخيلها ودماليجها عُلّقت على أغصان من العُشَر أو الخِرْوَع الناعم الذي لم يُثنَ ولم يُشذَّب. قال الزَّوْزَنِيّ: «شبه ساعديها وساقيها بأحد هذين الشجرين في الامتلاء والنعمة والضخامة» [@zawzani، ص109]."
vocabulary:
  - term: "الْبُرِينَ"
    text: "«الخلاخيل، واحدها برة. وأصل البرة حلقة من صفر تكون في منخر البعير» [@ibn-al-anbari، ص197]. والصُّفْر: النحاس. وعند الزَّوْزَنِيّ هي هنا «استعارة للأسورة والخلاخيل» [@zawzani، ص109]."
  - term: "الدَّمَالِيجَ"
    text: "«الدملج والدملوج: المعضد» [@zawzani، ص109]، و«المعضد: حلي كالسوار يلبس على العضد» [@zawzani، ص109، الحاشية]."
  - term: "عُشَرٍ"
    text: "«شجر أملس مستو ضعيف العود. شبه عظامها وذراعيها به» [@ibn-al-anbari، ص197]."
  - term: "خِرْوَعٍ"
    text: "قال يعقوب: «كل نبت ناعم خروع؛ ومنه قيل امرأة خريع، إذا كانت لينة ناعمة» [@ibn-al-anbari، ص197]."
  - term: "لَمْ يُخَضَّدِ"
    text: "«لم يثن... يقال خضدت الغصن أخضده خضدا، إذا ثنيته لتكسره» [@ibn-al-anbari، ص198]. وعند الزَّوْزَنِيّ: «التخضيد: التشذيب من الأغصان والأوراق»، «وجعله غير مخضد ليكون أغلظ» [@zawzani، ص109]."
syntax:
  - "«والبرين اسم كأن» [@ibn-al-anbari، ص198]، منصوب بالياء، و«الدماليج» معطوف عليه. وخبر «كأنّ» جملة «عُلّقت»، ونائب فاعلها ضمير يعود على الحلي."
  - "«على عشر» متعلق بـ«علّقت». و«أو» للتسوية: يصح التشبيه بهذا الشجر وبذاك."
  - "«ولم يخضد صلة الخروع» [@ibn-al-anbari، ص198]، أي صفة له. والفعل مبني للمجهول مجزوم بـ«لم»، وكُسر آخره للقافية."
morphology:
  - "«البُرِين» جمع «بُرَة» بالياء والنون، و«الجمع البرا والبرات والبرون في الرفع والبرين في النصب والجر» [@zawzani، ص109]."
  - "«الدَّماليج» جمع «دُمْلوج»، و«الدمالج» جمع «دُمْلُج» [@zawzani، ص109]."
  - "«يُخَضَّد» مضارع «خضّد» على «فعّل» مبنيًّا للمجهول، والتضعيف للتكثير. والمجرد «خضَد يخضِد خضدًا» [@ibn-al-anbari، ص198]."
rhetoric:
  thesis: "لا يصف الساعد والساق مباشرة: يصف الحلي معلقة على أغصان ناعمة ممتلئة، فيرى السامع الجسد من خلال الحلي."
  devices:
    - title: "التشبيه"
      text: "شبّه الساعدين والساقين بأغصان العشر أو الخروع «في الامتلاء والنعمة والضخامة» [@zawzani، ص109]. وهو تشبيه من جهة الهيئة، كما يُشبَّه عند عبد القاهر الجُرْجانيّ «القدّ اللطيف بالغصن» [@asrar، ص90]."
    - title: "الكناية"
      text: "لم يسمّ الساعد ولا الساق. ذكر الخلاخيل والدماليج، والحلي تدل على مواضعها من الجسد. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "الاستعارة في «البرين»"
      text: "البُرة في الأصل حلقة في أنف البعير [@ibn-al-anbari، ص197]، فاستعارها للخلاخيل والأساور كما يقول الزَّوْزَنِيّ [@zawzani، ص109]. فالشاعر يأخذ كلمة من عالم الإبل ويلبسها المرأة."
  connection: "ثم يعود إلى لائمه: دعيني أروّي نفسي في حياتي (61)، فأنا كريم يروي نفسه (62)."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَأَنْنَلْ / بُرِينَ وَدْ / دَمَالِي / جَ عُلْلِقَتْ = فعولن / مفاعلن / فعولن / مفاعلن — عَلَى عُ / شَرِنْ أَوْ خِرْ / وَعِنْ لَمْ / يُخَضْضَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "يتم به وصف المرأة التي جعلها الخلة الثالثة من خلال حياته (59)، وبه تنتهي الخلال الثلاث قبل أن يعود إلى الجدال مع لائمه. ويرى شوقي ضيف أن الجاهليين «قد يصورون في تعلقهم بالمرأة ضربا من المتاع الحسي، على نحو ما يصور ذلك طرفة في معلقته وكذلك امرؤ القيس، ومرد ذلك إلى ضرب شاع عندهم من الفتوة» [@deif، ج1 ص214]."
