first: "وَإِنْ يَلْتَقِ الْحَيُّ الْجَمِيعُ تُلَاقِنِي"
second: "إِلَى ذِرْوَةِ الْبَيْتِ الْكَرِيمِ الْمُصَمَّدِ"
meaning: "وإذا اجتمع الحي بعد تفرقه وجدتني أنتسب إلى أعلى بيت في الشرف، البيت الذي يقصده الناس في حوائجهم. قال ابن الأَنْبارِيّ: «معناه إذا التقى الحي الجميع الذين كانوا متفرقين وجدتني في الشرف» [@ibn-al-anbari، ص187]."
vocabulary:
  - term: "الْحَيُّ الْجَمِيعُ"
    text: "القبيلة مجتمعة، «الذين كانوا متفرقين» [@ibn-al-anbari، ص187]. وعند الزَّوْزَنِيّ اجتمعوا «للافتخار» [@zawzani، ص105]."
  - term: "ذِرْوَةِ"
    text: "«وذروة كل شيء: أعلاه» [@ibn-al-anbari، ص187]."
  - term: "الْبَيْتِ"
    text: "بيت الشرف والنسب، لا بيت السكن: «إلى ذروة البيت الشريف أي إلى أعلى الشرف» [@zawzani، ص105]."
  - term: "الْمُصَمَّدِ"
    text: "«الذي يصمد الناس إليه من شرفه» [@ibn-al-anbari، ص187]، أي يقصدونه. «والصمد: السيد الذي يصمد إليه في النوائب والحوائج والأمور، أي يقصد فيها» [@ibn-al-anbari، ص188]."
syntax:
  - "«ويلتق مجزوم بإن، والحي رفع بفعله، وتلاقني جواب الجزاء» [@ibn-al-anbari، ص188]؛ أي أن «الحي» فاعل «يلتق»، و«تلاقني» جواب الشرط. و«الجميع» نعت لـ«الحي»."
  - "«إلى ذروة» لا يتعلق بـ«تلاقني» في المعنى. قال الزَّوْزَنِيّ: «قوله: تلاقني إلى، يريد أعتزي إلى، فحذف الفعل لدلالة الحرف عليه» [@zawzani، ص105]. والاعتزاء: الانتساب."
  - "«الكريم» و«المصمد» نعتان لـ«البيت»."
morphology:
  - "«يَلْتَقِ» مضارع «التقى» على «افتعل» من «لقي»، مجزوم بحذف الياء. و«تُلاقِني» مضارع «لاقى» على «فاعل»، مجزوم بحذف الياء أيضًا، وأصله «تُلاقيني»."
  - "«المُصَمَّد» اسم مفعول من «صمّد» على «فعّل»: «الصمد: القصد، والفعل صمد يصمد، والتصميد مبالغة الصمد» [@zawzani، ص105]."
  - "ومن هذا الأصل «الصَّمَد» في القرآن: «وقال الله تبارك وتعالى: (اللهُ الصَّمَد)، أي السيد الذي يصمد إليه في الحوائج» [@ibn-al-anbari، ص188]."
rhetoric:
  thesis: "بعد الكرم، النسب: إذا اجتمعت القبيلة للمفاخرة وجدته في أعلى بيوتها."
  devices:
    - title: "الحذف"
      text: "المعنى عند الزَّوْزَنِيّ «تلاقني أعتزي إلى»، فحُذف الفعل «لدلالة الحرف عليه» [@zawzani، ص105]. فحرف «إلى» وحده يحمل معنى الانتساب. وقال عبد القاهر الجُرْجانيّ في الحذف: «فإنك ترى به ترك الذكر، أفصح من الذكر، والصمت عن الإفادة، أزيد للإفادة» [@dalail، ص146]."
    - title: "الاستعارة"
      text: "الذروة أعلى الشيء [@ibn-al-anbari، ص187]، كذروة الجبل وذروة السنام. فجعل للشرف بيتًا له ذروة. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "صفتان متدرجتان"
      text: "«الكريم» صفة للبيت في نفسه، و«المصمد» صفة له في علاقته بالناس: يقصدونه في النوائب [@ibn-al-anbari، ص188]. فالشرف عنده ليس نسبًا فقط، بل مقصد للمحتاجين."
  connection: "ثم يصف مجلس شرابه: ندماء بيض كالنجوم، وقينة تروح عليهم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِنْ يَلْ / تَقِلْ حَيْيُلْ / جَمِيعُ / تُلَاقِنِي = فعولن / مفاعيلن / فعولُ / مفاعلن — إِلَى ذِرْ / وَتِلْ بَيْتِلْ / كَرِيمِلْ / مُصَمْمَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]."
context: "آخر أبيات الشرط التي يرسم بها نفسه (45–47): في مجلس القوم، وفي الحانوت، وفي بيته يسقي ضيفه، وفي ذروة النسب. ويقول الزَّوْزَنِيّ إن الحي اجتمع «للافتخار»، وإن الشاعر «يريد أنه أوفاهم حظًّا من الحسب وأعلاهم سهمًا من النسب» [@zawzani، ص105]. والحسب: ما يُعدّ من مآثر الآباء."
