first: "عَلَى غَيْرِ ذَنْبٍ قُلْتُهُ غَيْرَ أَنَّنِي"
second: "نَشَدْتُ فَلَمْ أُغْفِلْ حَمُولَةَ مَعْبَدِ"
meaning: "يلومني على غير ذنب قلته، إلا أنني طلبت إبل أخي معبد ولم أتركها تضيع. قال الزَّوْزَنِيّ: «يلومني على غير شيء قلته وجناية جنيتها، ولكنني طلبت إبل أخي ولم أتركها، فنقم ذلك مني وجعل يلومني» [@zawzani، ص112]."
vocabulary:
  - term: "نَشَدْتُ"
    text: "طلبت. «ويقال: نشدت الضالة، إذا طلبتها؛ وأنشدتها، إذا عرفتها» [@ibn-al-anbari، ص204]. و«النّشدان: طلب المفقود» [@zawzani، ص112]."
  - term: "أُغْفِلْ"
    text: "أترك: «الإغفال: الترك» [@zawzani، ص112]."
  - term: "حَمُولَةَ"
    text: "«الإبل التي يحمل عليها. والفرش: الإبل الصغار التي لم تبلغ أن يحمل عليها. قال الله عز وجل: (ومِن الأنعام حَمولةً وفرشاً)» [@ibn-al-anbari، ص204]."
  - term: "مَعْبَدِ"
    text: "«أخو طرفة» [@ibn-al-anbari، ص204]. قال ابن قُتَيْبة: «وكان لطرفة أخ يقال له معبد بن العبد، فطلب بديته، فأخذها من الحواثر» [@ibn-qutayba، ج1 ص186]، أي أنه أخذ دية طَرَفَة بعد قتله من أهل الربيع بن حوثرة، عامل عمرو بن هند الذي قتله."
syntax:
  - "«على غير ذنب» متعلق بـ«يلوم» في البيت 69: يلومني على غير ذنب [@zawzani، ص112]. وجملة «قلته» نعت لـ«ذنب»."
  - "«غير أنني»: «وقوله: غير أنني، استثناء منقطع تقديره ولكنني» [@zawzani، ص112]. والاستثناء المنقطع ما لم يكن المستثنى فيه من جنس المستثنى منه: فطلب الإبل ليس من جنس الذنوب."
  - "«حمولة» مفعول به لـ«نشدت» في المعنى، ويطلبه «أغفل» أيضًا. قال ابن الأَنْبارِيّ: من روى بضم الألف «أراد نشدت حمولة معبد فلم أغفل ذلك»، ومن روى بفتحها «أراد: فلم أغفل عن ذلك» [@ibn-al-anbari، ص204]."
morphology:
  - "«أُغْفِل» مضارع «أغفل» الرباعي على «أفعل»، ويُروى «أَغْفُل» بفتح الهمزة من الثلاثي «غفَل» [@ibn-al-anbari، ص204]؛ فالأول يتعدى بنفسه، والثاني يتعدى بـ«عن»."
  - "«حَمُولة» على «فَعُولة» بمعنى «مفعولة»: ما يُحمل عليه."
  - "«نَشَد» الثلاثي للطلب، و«أنشد» الرباعي للتعريف [@ibn-al-anbari، ص204]: فالهمزة الزائدة غيّرت المعنى."
rhetoric:
  thesis: "الذنب الوحيد الذي يعترف به ليس ذنبًا: أنه طلب إبل أخيه ولم يتركها تضيع."
  devices:
    - title: "الاستثناء المنقطع"
      text: "نفى الذنب، ثم استثنى ما ليس بذنب [@zawzani، ص112]. فالسامع ينتظر بعد «غير أنني» اعترافًا بجناية، فيجد وفاءً للأخ. وهذا قريب مما سمّاه البلاغيون بعدُ «تأكيد المدح بما يشبه الذم»: أن يُستثنى من صفة ذم منفية صفةُ مدح."
    - title: "الإشارة إلى قصة"
      text: "«حمولة معبد» عبارة قصيرة تحيل على قصة يعرفها السامعون: الإبل التي ضاعت، والأخ الذي عيّره [@ibn-al-anbari، ص204]. فالبيت يكتفي بالإشارة، ويترك القصة لذاكرة السامع."
  connection: "ثم يذكّر ابن عمه بالقرابة، ويقسم أنه يحضر كل أمر شديد يصيبه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "عَلَى غَيْ / رِ ذَنْبِنْ قُلْ / تُهُو غَيْ / رَ أَنْنَنِي = فعولن / مفاعيلن / فعولن / مفاعلن — نَشَدْتُ / فَلَمْ أُغْفِلْ / حَمُولَ / ةَ مَعْبَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من العَجُز [@atiq، ص29]."
context: "في هذا البيت سبب العتاب كله. يروي ابن الأعرابي أن هذه «إبل كانت له ولأخيه معبد، كانا يرعيانها يوما ويوما»، فلما تركها طَرَفَة قال له معبد: «لم لا تسرح في إبلك، كأنك ترى أنها إن أخذت يردها شعرك هذا!». فقال طَرَفَة: «فإني لا أخرج فيها أبدًا حتى تعلم أن شعري سيردها إن أخذت». «فتركها فأخذها ناس من مضر»، فاحتجّ طَرَفَة بجوار عمرو بن هند وقابوس ورجل من اليمن، وقال في ذلك شعرًا يخاطب به عمرو بن هند [@ibn-al-anbari، ص204]. والجوار: الحماية، وقابوس أخو عمرو بن هند [@ibn-qutayba، ج1 ص186]. وفي أول شرح ابن الأَنْبارِيّ رواية أخرى: عمرو بن هند نفسه بعث إلى «إبل طرفة التي كانت في جوار قابوس وعمرو بن قيس فأخذها»، حقدًا عليه لخروجه مع عمرو بن أمامة، أخي الملك لأبيه وخصمه [@ibn-al-anbari، ص118، ص121–122]. فقال طَرَفَة قصيدة أولها: «لعمرك ما كانت حمولة معبد» [@ibn-al-anbari، ص122]، أي أقسم بحياتك ما كانت إبل معبد... فالعبارة نفسها، «حمولة معبد»، في القصيدتين. وفي الروايتين يطلب الشاعر الإبل، ولا يجد عند ابن عمه عونًا."
