first: "تَرِيعُ إِلَى صَوْتِ الْمُهِيبِ وَتَتَّقِي"
second: "بِذِي خُصَلٍ رَوْعَاتِ أَكْلَفَ مُلْبَدِ"
meaning: "ترجع إذا صاح بها من يدعوها، وتدفع عن نفسها بذنبها الكثيف الشعر هجمات فحل أحمر يضرب إلى السواد، قد تلبّد وبره بما بال عليه. قال الزَّوْزَنِيّ: «هي ذكية القلب ترجع إلى راعيها وتجعل ذنبها حاجزًا بينها وبين فحل تضرب حمرته إلى السواد متلبد الوبر» [@zawzani، ص95]."
vocabulary:
  - term: "تَرِيعُ"
    text: "«معناه تعطف وترجع إلى راعيها» [@ibn-al-anbari، ص156]. و«الريع: الرجوع، والفعل راع، يريع» [@zawzani، ص95]."
  - term: "الْمُهِيبِ"
    text: "«وهو الذي يصيح بها: هوب هوب. والمهيب هاهنا: فحلها». وقال أحمد بن عبيد: «المهيب صاحبها وراعيها، والأكلف فحلها» [@ibn-al-anbari، ص156]. و«الإهابة: دعاء الإبل وغيرها» [@zawzani، ص95]."
  - term: "خُصَلٍ"
    text: "«بذنب ذي خصل مجتمعة من الشعر، واحدتها خصلة» [@ibn-al-anbari، ص156]."
  - term: "رَوْعَاتِ"
    text: "«الفزع. والرَّوع، بفتح الراء: الفزع؛ والرُّوع، بضم الراء: النفس» [@ibn-al-anbari، ص156]."
  - term: "أَكْلَفَ"
    text: "«لونه حمرة إلى السواد» [@ibn-al-anbari، ص156]."
  - term: "مُلْبَدِ"
    text: "«ضرب بذنبه على ظهره من الهياج وقد بال عليه وثلط فتلبد ذلك على ظهره» [@ibn-al-anbari، ص156]. وعند الزَّوْزَنِيّ: «ذو وبر متلبد من البول والثلط» [@zawzani، ص95]. والثلط: الروث الرقيق."
syntax:
  - "«وفاعل تريع مضمر فيه من ذكر الناقة، وإلى صلة تريع، وتتقى نسق عليه» [@ibn-al-anbari، ص156]: الفاعل ضمير مستتر يعود على الناقة، و«إلى» متعلقة بالفعل، و«تتقي» معطوف على «تريع»."
  - "«والروعات في موضع نصب بتتقي. وهي مضافة إلى الأكلف، والملبد نعت الأكلف» [@ibn-al-anbari، ص156]. و«أكلف» ممنوع من الصرف لأنه صفة على «أفعل»، فجُرّ بالفتحة."
  - "في البيت موصوفان محذوفان: «بذي خصل، أراد بذنب ذي خصل، فحذف الموصوف»، و«روعات أكلف أي: روعات فحل أكلف، فحذف الموصوف» [@zawzani، ص95]."
morphology:
  - "«المُهِيب» اسم فاعل من «أهاب»: «يقال: أهاب ناقته إذا دعاها» [@zawzani، ص95]."
  - "«رَوْعات» جمع «رَوْعة»، و«الروعة فعلة منه» [@zawzani، ص95]، أي المرّة من الرَّوع."
  - "«تتّقي» على «تفتعل» من «وقى»، قُلبت الواو تاء وأُدغمت في تاء الافتعال. و«الاتقاء: الحجز بين شيئين، يقال: اتَّقى قرنه بترسه إذا جعل حاجزًا بينه وبينه» [@zawzani، ص95]."
rhetoric:
  thesis: "بيت في طباع الناقة: تُقبل على من يدعوها، وتصدّ الفحل بذنبها. فالتمثال يُعطى خُلُقًا قبل أن يُعطى أعضاء."
  devices:
    - title: "الطباق في الحركة"
      text: "الطباق أن تجمع في الكلام بين الشيء وضده. وهو هنا في حركتين: «تريع» إقبال على الصوت، و«تتقي» صدّ عن الفحل. فهي مطيعة لمن تريد، ممتنعة على من لا تريد."
    - title: "قراءتان لصدّ الفحل"
      text: "عند ابن الأَنْبارِيّ أنها إذا أتاها الفحل «اتقته بذنبها فرفعته تريه إنها لاقح» [@ibn-al-anbari، ص156]، أي حامل. وعند الزَّوْزَنِيّ أنها «لا تمكنه من ضرابها وإذا لم يصل الفحل إلى ضرابها لم تلقح، وإذا لم تلقح كانت مجتمعة القوى وافرة اللحم قوية على السير والعدو» [@zawzani، ص95]. والقراءة الثانية فيما نرى أوفق للبيت السابق، فالناقة ترعى مع الشول التي خفّت بطونها."
    - title: "في التمثال: الذنب يظهر"
      text: "قال «بذي خصل» ولم يذكر الذنب، وقال «أكلف» ولم يذكر الفحل [@zawzani، ص95]، فالصفة وحدها تدل على صاحبها. وبهذه الصفة يدخل الذنب القصيدة، وأول عمل له أنه ترس تتقي به. والبيتان التاليان في وصفه."
  connection: "ثم يصف هذا الذنب: كأن جناحي نسر أبيض غُرزا في عظمه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "تَرِيعُ / إِلَى صَوْتِلْ / مُهِيبِ / وَتَتْتَقِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — بِذِي خُ / صَلِنْ رَوْعَا / تِ أَكْلَ / فَ مُلْبَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر والعَجُز [@atiq، ص29]."
context: "البيت الثاني في ماضي الناقة ومرعاها (14–15). وفيه تظهر معرفة طَرَفَة بطباع الإبل وأحوال رعيها وضرابها، وهي معرفة ابن بادية يعيش بين الإبل. ولهذا عدّه ابن رَشِيق من أفضل الوصّافين لها: «وأما نعات الإبل فطرفة في معلقته من أفضلهم» [@ibn-rashiq، ج2 ص296]."
