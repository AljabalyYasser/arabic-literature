first: "وَصَادِقَتَا سَمْعِ التَّوَجُّسِ لِلسُّرَى"
second: "لِهَجْسٍ خَفِيٍّ أَوْ لِصَوْتِ مُنَدِّدِ"
meaning: "ولها أذنان صادقتا السمع في سير الليل، تلتقطان الحركة الخفية وصوت من يرفع صوته. قال الزَّوْزَنِيّ: «ولها أذنان صادقتا الاستماع في حال سير الليل لا يخفى عليهما السر الخفي ولا الصوت الرفيع» [@zawzani، ص101]."
vocabulary:
  - term: "صَادِقَتَا"
    text: "«يعنى أذنيها، أي لا تكذبها إذا سمعت النبأة. وأصل الصدق الصلابة» [@ibn-al-anbari، ص177]. والنبأة: الصوت الخفي."
  - term: "التَّوَجُّسِ"
    text: "«التسمع». وقال الطوسي: «التوجس: الخوف والحذر». وقال أبو جعفر: «التوجس: التسمع بحذر شبه حديث النفس من خفائه» [@ibn-al-anbari، ص177]."
  - term: "السُّرَى"
    text: "«سير الليل؛ يقال سرى وأسرى» [@ibn-al-anbari، ص177]."
  - term: "هَجْسٍ"
    text: "«الهجس: الحركة» [@zawzani، ص101]."
  - term: "مُنَدِّدِ"
    text: "«الذي يرفع صوته» [@ibn-al-anbari، ص177]. و«التنديد: رفع الصوت» [@zawzani، ص101]."
syntax:
  - "قال ابن الأَنْبارِيّ إن الصادقتين ترتفعان «بإضمار لها، وهما مضافتان إلى السمع» [@ibn-al-anbari، ص178]، أي: ولها صادقتا سمع، فالخبر محذوف. والإضافة إضافة الصفة إلى ما يتصف بها في المعنى: أذنان صادقٌ سمعُهما."
  - "اللام في «للسرى» بمعنى «في»: «(للسرى) أي في السرى» [@ibn-al-anbari، ص177]. واللام في «لهجس» و«لصوت» متعلقة بـ«صادقتا سمع»، أي تصدقان في سماع الهجس والصوت."
  - "في «لصوت مندد» روايتان: الإضافة مع كسر الدال، أي لصوتِ رجلٍ يرفع صوته، وهي رواية المتن. وروى أبو جعفر «لصوتٍ مندَّدِ» بالتنوين وفتح الدال، «وقال: المندد نعت للصوت، وأنكر الإضافة مع كسر الدال» [@ibn-al-anbari، ص177–178]."
morphology:
  - "«صادقتا» مثنى «صادقة»، حُذفت نونه للإضافة. وأصل الكلمة في الصلابة: «ويقال: رمح صدق، إذا كان صلبا». قال أبو جعفر: «الصدق الصلب، فإذا كسر فهو ضد الكذب» [@ibn-al-anbari، ص177]."
  - "«التوجّس» مصدر «توجّس» على «تفعّل». و«السُّرى» مصدر «سرى»، ويقال «أسرى» أيضًا [@ibn-al-anbari، ص177]."
  - "«مُنَدِّد» اسم فاعل من «ندّد» على «فعّل»، و«مُنَدَّد» في رواية أبي جعفر اسم مفعول [@ibn-al-anbari، ص177–178]."
rhetoric:
  thesis: "الأذنان في الليل حارستان: تلتقطان أخفى الأصوات وأعلاها."
  devices:
    - title: "في التمثال: السمع"
      text: "بعد العينين يصف الأذنين، ويبدأ بعملهما قبل شكلهما: السمع في الليل، حين لا تنفع العين. قال أبو جعفر: «أي لا يشغلها السرى أن ترتاع للصوت تسمعه» [@ibn-al-anbari، ص177]. وسيصف شكلهما في البيت التالي."
    - title: "الاستعارة"
      text: "جعل للأذنين صدقًا، والصدق للمتكلم لا للسامع. وللاستعارة عند عبد القاهر الجُرْجانيّ ضربان: أن تجعل «الشيء الشيء ليس به»، كأن تسمي الرجل الشجاع أسدًا؛ أو تجعل «للشيء الشيء ليس له»، كأن تجعل للريح يدًا [@dalail، ص67]. و«صادقتا» من الضرب الثاني. وفسّره ابن الأَنْبارِيّ: «أي لا تكذبها إذا سمعت النبأة» [@ibn-al-anbari، ص177]، فالأذن لا تخدع صاحبتها."
    - title: "الطباق"
      text: "الطباق أن تجمع في الكلام بين الشيء وضده. وهو هنا في «هجس خفيّ» و«صوت مندّد». فالأذنان تسمعان ما بين الطرفين كله."
  connection: "ثم يصف شكل الأذنين: محدّدتان كالحربة، كأذني ثور وحشي منفرد."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَصَادِ / قَتَا سَمْعِتْ / تَوَجْجُ / سِ لِسْسُرَى = فعولُ / مفاعيلن / فعولُ / مفاعلن — لِهَجْسِنْ / خَفِيْيِنْ أَوْ / لِصَوْتِ / مُنَدْدِدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "البيت الأول في الأذنين (33–34). وقد أنشده البَغْدادِيّ مع الذي بعده في «خزانة الأدب»، وقال: «وهما من معلقة طرفة بن العبد المشهورة. وصف ناقته بعدة أبيات إلى أن وصف أذنيها» [@khizana، ج7 ص436]."
variants:
  - reading: "لِجَرْسٍ خَفِيٍّ"
    status: "رواية الطُّوسِيّ"
    note: "«والجرس: الصوت» [@ibn-al-anbari، ص177]. وبها أنشده البَغْدادِيّ [@khizana، ج7 ص436]."
  - reading: "أَوْ لِصَوْتٍ مُنَدَّدِ"
    status: "رواية أبي جعفر"
    note: "بتنوين «صوت» وفتح الدال [@ibn-al-anbari، ص177–178]. وأنشده البَغْدادِيّ «لصوتٍ» منونًا، وقال: «والمندد بفتح الدال» [@khizana، ج7 ص436]."
