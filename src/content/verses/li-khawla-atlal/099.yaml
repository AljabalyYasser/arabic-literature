first: "وَيَوْمَ حَبَسْتُ النَّفْسَ عِنْدَ عِرَاكِهِ"
second: "حِفَاظًا عَلَى عَوْرَاتِهِ وَالتَّهَدُّدِ"
meaning: "ورُبّ يوم حبست فيه نفسي عن الفرار عند اشتداد قتاله، محافظةً على ما يُخاف عليه فيه، وفي وجه تهديد الأعداء. قال ابن الأَنْبارِيّ: «معناه: ورب يوم حبست نفسي عند عراك اليوم، وهو علاجه» [@ibn-al-anbari، ص228]. وعلاج اليوم: مزاولة شدته."
vocabulary:
  - term: "عِرَاكِهِ"
    text: "«يقال اعتركت الإبل على الحوض، إذا ازدحمت عليه... وإذا ازدحم الناس في ورد أو حرب قيل: هم في عراك» [@ibn-al-anbari، ص228]. وعند الزَّوْزَنِيّ: «العراك والمعاركة: القتال، وأصلهما من العرك وهو الدلك» [@zawzani، ص119]."
  - term: "حِفَاظًا"
    text: "«معناه محافظة» [@ibn-al-anbari، ص229]. وعند الزَّوْزَنِيّ: «المحافظة على ما تجب المحافظة عليه من حماية الحوزة والذب عن الحريم ودفع الذم عن الأحساب» [@zawzani، ص119]. والحوزة: ما يملكه الرجل ويحميه."
  - term: "عَوْرَاتِهِ"
    text: "«العورة: موضع المخافة» [@ibn-al-anbari، ص229]."
  - term: "التَّهَدُّدِ"
    text: "تهديد الأعداء، «وتهدد الأعداء إياي» [@ibn-al-anbari، ص229]."
syntax:
  - "الواو واو «رُبّ»: «معناه: ورب يوم» [@ibn-al-anbari، ص228]. و«يومَ» مبني على الفتح لأنه أضيف إلى جملة فعلها ماضٍ مبني، كما قال الزَّوْزَنِيّ في «ويومَ عقرتُ» عند امرئ القَيْس: «لأنه بناه على الفتح لما أضافه إلى مبني وهو الفعل الماضي» [@zawzani، ص40]. وهو في موضع جرّ بـ«ربّ» المحذوفة."
  - "«حِفاظًا» مفعول لأجله: حبستها من أجل المحافظة. «والتهدّد» معطوف على «عوراته»."
  - "البيت لا يتم إلا بالتالي، فـ«على موطن» في أوله متعلق بـ«حبستُ» هنا [@ibn-al-anbari، ص229]."
morphology:
  - "«عِراك» مصدر «عارك» على «فِعال»، و«المعترك: المزدحم» [@ibn-al-anbari، ص228]."
  - "«حِفاظ» مصدر «حافظ» على «فِعال»، مثل «عِراك»."
  - "«التهدّد» مصدر «تهدّد» على «التفعّل»."
rhetoric:
  thesis: "من الليل إلى النهار: يوم معركة صبر فيه حين يفرّ غيره."
  devices:
    - title: "الاستعارة"
      text: "جعل لليوم عراكًا وعورات، كأنه خصم يُصارَع: «عند عراك اليوم، وهو علاجه» [@ibn-al-anbari، ص228]. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "حبس النفس"
      text: "جعل نفسه شيئًا يُحبس، كأنها تريد الفرار وهو يمسكها. وحبس النفس هنا هو الصبر: «صبرت نفسي على روعات اليوم» كما يقول ابن الأَنْبارِيّ [@ibn-al-anbari، ص229]."
    - title: "التضمين"
      text: "التضمين عند ابن رَشِيق «أن تتعلق القافية أو لفظة مما قبلها بما بعدها»، ويعدّه عيبًا، لكنه يقول: «وكلما كانت اللفظة المتعلقة بالبيت الثاني بعيدة من القافية كان أسهل عيباً» [@ibn-rashiq، ج1 ص171]. واللفظة المتعلقة هنا «حبستُ» في أول البيت، بعيدة عن القافية، فهو من أخف التضمين."
  connection: "ثم يصف موطن ذلك اليوم: موضع ترتعد فيه الفرائص."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَيَوْمَ / حَبَسْتُنْ نَفْ / سَ عِنْدَ / عِرَاكِهِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — حِفَاظَنْ / عَلَى عَوْرَا / تِهِي وَتْ / تَهَدْدُدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]."
context: "يبدأ فخره الأخير بالحرب في بيتين متصلين (99–100). وقد فسّره ابن الأَنْبارِيّ بالبيتين معًا: «فيقول: حبست نفسي في موطن يخشى الردى عنده ذو الفتوة؛ حفاظا على عوراته، وصبرا مني لنفسي على روعاته» [@ibn-al-anbari، ص229]."
variants:
  - reading: "وَيَوْمَ حَبَسْتُ النَّفْسَ عِنْدَ عِرَاكِهَا"
    status: "رواية الطُّوسِيّ"
    note: "والضمير للنفس: «عراكها اعتراك القتال والحرب» [@ibn-al-anbari، ص228–229]."
  - reading: "حِفَاظًا عَلَى رَوْعَاتِهِ وَالتَّهَدُّدِ"
    status: "رواية أخرى"
    note: "«والروعات جمع روعة، وهي الفزعة» [@ibn-al-anbari، ص229]."
