first: "وَأَصْفَرَ مَضْبُوحٍ نَظَرْتُ حِوَارَهُ"
second: "عَلَى النَّارِ وَاسْتَوْدَعْتُهُ كَفَّ مُجْمِدِ"
meaning: "ورُبّ قِدْح أصفر لوّحته النار، انتظرت ما يخرج به من فوز أو خيبة ونحن عند النار، ثم دفعته إلى يد رجل معروف بأنه لا يفوز. قال الزَّوْزَنِيّ: «ورب قدح أصفر قد قرب من النار حتى أثرت فيه، وإنما فعل ذلك ليصلب ويصفر، انتظرت مراجعته أي انتظرت فوزه أو خيبته ونحن مجتمعون على النار له، وأودعت القدح كفَّ رجل معروف بالخيبة وقلة الفوز» [@zawzani، ص120]. والقِدْح: سهم الميسر."
vocabulary:
  - term: "أَصْفَرَ"
    text: "قال أبو عمرو: «يعنى بالأصفر قدحا، وإنما صفره لأنه من نبع أو سدر» [@ibn-al-anbari، ص229]. والنَّبْع والسِّدْر: شجر تُتخذ منه القداح."
  - term: "مَضْبُوحٍ"
    text: "«ضبحته النار وضبته، إذا غيرت منه» [@ibn-al-anbari، ص230]. وعند الزَّوْزَنِيّ: «ضبحت الشيء: قربته من النار حتى أثرت فيه» [@zawzani، ص119]."
  - term: "نَظَرْتُ حِوَارَهُ"
    text: "«معناه انتظرت فوزه وخروجه. والحوار: مصدر حاورته محاورة وحوارا» [@ibn-al-anbari، ص230]."
  - term: "عَلَى النَّارِ"
    text: "«معناه عند النار، وذلك في شدة البرد» [@ibn-al-anbari، ص230]."
  - term: "مُجْمِدِ"
    text: "قال يعقوب: «المجمد، الذي يأخذ بكلتا يديه ولا يخرج من يديه شيء». وقال أبو جعفر: «يقال أجمد الرجل، إذا لم يكن عنده خير ولا فضل» [@ibn-al-anbari، ص230]. وعند الزَّوْزَنِيّ: «الذي لا يفوز» [@zawzani، ص120]."
syntax:
  - "«وأصفر مخفوض بإضمار رب، ومضبوح نعته» [@ibn-al-anbari، ص230]. و«أصفر» ممنوع من الصرف، فجُرّ بالفتحة."
  - "«على النار» شبه جملة في موضع الحال، أي: ونحن عند النار."
  - "«استودعته» فعل وفاعل، والهاء مفعول أول، و«كفَّ» مفعول ثانٍ، و«مجمدٍ» مضاف إليه."
morphology:
  - "«مُجْمِد» اسم فاعل من «أجمد» على «أفعل» [@ibn-al-anbari، ص230]، «وأصله من الجمود» [@zawzani، ص120]."
  - "«استودعته» على «استفعل»، و«استودعته وأودعته واحد» [@zawzani، ص120]."
  - "«حِوار» مصدر «حاور» على «فِعال»، «وأصله من قولهم: حار يحور إذا رجع» [@zawzani، ص120]."
rhetoric:
  thesis: "فخر بالميسر، وأجمل ما فيه عنده أن يخسر."
  devices:
    - title: "الفخر بالخسارة"
      text: "قال الزَّوْزَنِيّ: «يفتخر بالميسر وإنما افتخرت العرب به لأنه لا يركن إليه إلا سمح جواد، ثم كمل المفخرة بإيداع قدحه كف مجمد قليل الفوز» [@zawzani، ص120]. ويركن إليه: يُقبل عليه. فمن دفع قدحه إلى رجل لا يفوز فقد رضي أن يغرم، والغرم عندهم كرم."
    - title: "الاستعارة"
      text: "«نظرت حواره»: جعل للقدح محاورة، كأنه يُسأل فيجيب بالفوز أو الخيبة. والمحاورة «مراجعة الحديث» [@zawzani، ص120]. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "الصفة مكان الموصوف"
      text: "«وأصفر»: لم يذكر القدح، بل لونه. وفي حاشية الديوان: «الأصفر: صفة لموصوف محذوف هو القدح» [@diwan-tarafa، ص29، الحاشية]."
  connection: "ثم يختم المعلقة بحكمة: ستبدي لك الأيام ما كنت جاهلًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَأَصْفَ / رَ مَضْبُوحِنْ / نَظَرْتُ / حِوَارَهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — عَلَنْ نَا / رِ وَسْتَوْدَعْ / تُهُو كَفْ / فَ مُجْمِدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]."
context: "بيت في نسبته إلى المعلقة نظر. رواه أبو عمرو الشيباني وحده، قال ابن الأَنْبارِيّ: «وروى أبو عمرو الشيباني هاهنا بيتا لم يروه الأصمعي ولا ابن الأعرابي» [@ibn-al-anbari، ص229]. وهو في رواية الزَّوْزَنِيّ [@zawzani، ص119–120] وفي الديوان [@diwan-tarafa، ص29]. ويصف ابن الأَنْبارِيّ المجلس الذي يصوّره البيت: «كانوا يوقدون النار وينحرون الجزور ويضربون بالقداح، واكثر ما يفعلون ذلك بالعشي في وقت مجيء الضيف» [@ibn-al-anbari، ص230]. ويشرح شوقي ضيف الميسر: «وكانت عادتهم فيه أن يذبحوا ناقة أو بعيرا، ويقسموا ما يذبحونه عشرة أجزاء، ثم يأتوا بأحد عشر قدحا، يجرون عليها قمارهم» [@deif، ج1 ص71]، ويرى أن تمدحهم بلعب الميسر كان «إعلانا عن كرمهم وبذلهم» [@deif، ج1 ص206]."
