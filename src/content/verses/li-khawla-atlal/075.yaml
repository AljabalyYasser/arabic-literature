first: "بِلَا حَدَثٍ أَحْدَثْتُهُ وَكَمُحْدِثٍ"
second: "هِجَائِي وَقَذْفِي بِالشَّكَاةِ وَمُطْرَدِي"
meaning: "بلا جرم أحدثته، أُهجى وأُرمى بالشكوى وأُطرد، كما يُفعل بصاحب الجرم. قال الزَّوْزَنِيّ: «أجفى وأهجر وأضام من غير حدث إساءة أحدثته، ثم أهجى وأشكى وأطرد كما يهجى من أحدث إساءة وجرّ جريرة وجنى جناية» [@zawzani، ص113]."
vocabulary:
  - term: "حَدَثٍ"
    text: "الجرم. قال الأَصْمَعِيّ في معناه: «أي فعل بي ما فعل بلا حدث ولا جرم كان مني» [@ibn-al-anbari، ص207]."
  - term: "هِجَائِي"
    text: "هجاء الناس إياي، أي ذمّهم. «ويقال: فلانة تهجو زوجها، أي تذم صحبته» [@ibn-al-anbari، ص207]."
  - term: "الشَّكَاةِ"
    text: "الشكوى: «والشكاية والشكوى، والشكيّة والشكاة واحد» [@zawzani، ص113]."
  - term: "مُطْرَدِي"
    text: "«أي اطرادي. ويقال: أطردته، إذا صيرته طريدا؛ وطردته عني، إذا نحيته» [@ibn-al-anbari، ص207]."
syntax:
  - "«والحدث مخفوض بالباء» [@ibn-al-anbari، ص207]، و«لا» بين الجار والمجرور نافية، وجملة «أحدثته» نعت لـ«حدث». و«بلا حدث» حال: يُفعل بي ذلك وأنا بلا جرم."
  - "«والهجاء مرفوع بالكاف، والقذف والمطرد منسوقان على الهجاء» [@ibn-al-anbari، ص207]. والرفع بالكاف عبارة كوفية؛ والمعنى عند البصريين أن «هجائي» مبتدأ مؤخر، و«كمحدث» خبر مقدم. و«منسوقان» أي معطوفان."
  - "على رواية الكسر «كمُحدِث» اسم فاعل، قال أبو جعفر: «أراد الرجل الذي هجاني كرجل أحدث حدثا عظيما»؛ وعلى رواية الفتح «كمُحدَث» مصدر: «وهجائي كمحدَث: أمر عظيم» [@ibn-al-anbari، ص207]."
morphology:
  - "«مُطْرَد» مصدر ميمي من «أطرد» على «مُفْعَل»: «والمطرد بمعنى الإطراد» [@zawzani، ص113]. والمصدر الميمي مصدر يبدأ بميم زائدة."
  - "«مُحْدَث» بفتح الدال مصدر ميمي أيضًا: «والمحدث مصدر، يقال أحدثته إحداثا ومحدثا» [@ibn-al-anbari، ص207]. وبكسر الدال اسم فاعل: مَن أحدث الجرم."
  - "«هجائي» مصدر مضاف إلى مفعوله: الهجاء واقع عليه لا صادر منه. وكذلك «قذفي» و«مطردي»."
rhetoric:
  thesis: "البراءة والعقوبة في بيت واحد: لا جرم، ومع ذلك يعامَل معاملة المجرم."
  devices:
    - title: "الطباق"
      text: "الطباق أن تجمع في الكلام بين الشيء وضده. و«بلا حدث» و«كمحدث» متقابلان: نفى الجرم، ثم أثبت العقوبة التي لا تكون إلا للجرم."
    - title: "التتابع"
      text: "ثلاثة مصادر معطوفة: الهجاء، والقذف بالشكوى، والطرد. فالظلم يتدرج من الكلام إلى الاتهام إلى الإبعاد."
    - title: "رجوع الشكوى"
      text: "بدأ العتاب بقوله «على غير ذنب قلته» (71)، وها هو يعود إليه: «بلا حدث أحدثته». فأبيات النصرة (72–74) محاطة بنفي الذنب من جانبيها."
  connection: "ثم يتمنى: لو كان ابن عمه رجلًا غيره لفرّج كربه أو أمهله."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "بِلَا حَ / دَثِنْ أَحْدَثْ / تُهُو وَ / كَمُحْدِثِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — هِجَائِي / وَقَذْفِي بِشْ / شَكَاةِ / وَمُطْرَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "به تكتمل صورة الظلم التي بدأت باللوم (69): فالأمر تجاوز اللوم إلى الهجاء والشكوى والطرد، وكل ذلك بسبب إبل معبد كما يروي ابن الأعرابي [@ibn-al-anbari، ص204]. وقال الطُّوسِيّ في معناه: «هجيت وشكيت وكمحدث مني أتى ذلك إلي» [@ibn-al-anbari، ص207]، أي عوملت كأن الجرم جاء مني."
variants:
  - reading: "وَكَمُحْدَثٍ"
    status: "رواية الأَصْمَعِيّ"
    note: "بفتح الدال: «أي فعل بي ما فعل بلا حدث ولا جرم كان مني، وكمحدث مني أتى ذلك إلي» [@ibn-al-anbari، ص207]. وهي رواية الزَّوْزَنِيّ [@zawzani، ص113]."
