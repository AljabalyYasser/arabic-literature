first: "عَلَى مَوْطِنٍ يَخْشَى الْفَتَى عِنْدَهُ الرَّدَى"
second: "مَتَى تَعْتَرِكْ فِيهِ الْفَرَائِصُ تُرْعَدِ"
meaning: "حبستها في موضع من الحرب يخشى فيه الفتى الشجاع الهلاك، متى تتزاحم فيه الفرائص ارتعدت من الفزع. قال الزَّوْزَنِيّ: «حبست نفسي في موضع من الحرب يخشى الكريم هناك الهلاك ومتى تعترك الفرائص فيه أرعدت من فرط الفزع وهول المقام» [@zawzani، ص119]."
vocabulary:
  - term: "مَوْطِنٍ"
    text: "«الموطن: الموضع» [@zawzani، ص119]."
  - term: "الْفَتَى"
    text: "«ذو الفتوة» [@ibn-al-anbari، ص229]، وعند الزَّوْزَنِيّ «الكريم» [@zawzani، ص119]."
  - term: "الرَّدَى"
    text: "«الهلاك» [@ibn-al-anbari، ص229]."
  - term: "تَعْتَرِكْ"
    text: "«الاعتراك والتعارك واحد» [@zawzani، ص119]."
  - term: "الْفَرَائِصُ"
    text: "«جمع فريصة، وهي المضغة التي تحت الثدي مما يلي الجنب عند مرجع الكتف، وهي أول ما يرعد من الإنسان ومن كل شيء عند الفزع» [@ibn-al-anbari، ص229]. والمضغة: القطعة من اللحم."
syntax:
  - "«وعلى صلة حبست. والتقدير: حبست النفس في عراكها على موطن» [@ibn-al-anbari، ص229]. أي «على موطن» متعلق بـ«حبستُ» في البيت السابق، و«صلة» عنده بمعنى متعلَّق."
  - "«وتعترك جزم بمتى، وترعد جواب الجزاء» [@ibn-al-anbari، ص229]. و«الفرائصُ» فاعل «تعترك»، و«تُرعَدِ» مجزوم مبني للمجهول كُسر آخره للقافية."
  - "جملة «يخشى الفتى عنده الردى» صفة لـ«موطن»: «الفتى» فاعل، و«الردى» مفعول به."
morphology:
  - "«فرائص» جمع «فريصة» على «فعائل»."
  - "«تُرْعَد» مضارع مبني للمجهول من «أُرعِد»، وعبارة الزَّوْزَنِيّ: «أرعدت من فرط الفزع» [@zawzani، ص119]."
  - "«الرَّدى» مصدر «رَدِي»: «ويقال: ردِى يردى ردى ومردى» [@ibn-al-anbari، ص229]."
rhetoric:
  thesis: "يصف الخوف في أجساد الآخرين ليُظهر ثباته هو."
  devices:
    - title: "الاستعارة"
      text: "«تعترك الفرائص»: جعل لحمات الكتف تتصارع كما يتصارع الرجال، من شدة الارتعاد. وهذا من ضرب الاستعارة الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "تكرار الجذر"
      text: "«عِراكه» في البيت السابق و«تعترك» هنا من جذر واحد (ع ر ك). فالمعركة في الخارج، وفي الأجساد أيضًا."
    - title: "خوف الشجاع"
      text: "«يخشى الفتى»: لم يقل يخشى الجبان، بل الفتى الشجاع الكريم. فإذا كان الشجاع يخاف هناك، فالذي حبس نفسه أشجع منه."
  connection: "ثم بيت لم يروه إلا أبو عمرو الشيباني: قِدْح أصفر في الميسر."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "عَلَى مَوْ / طِنِنْ يَخْشَلْ / فَتَى عِنْ / دَهُرْ رَدَى = فعولن / مفاعيلن / فعولن / مفاعلن — مَتَى تَعْ / تَرِكْ فِيهِلْ / فَرَائِ / صُ تُرْعَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]."
context: "آخر بيت في الفخر عند الأَصْمَعِيّ وابن الأعرابي؛ فبعده في روايتهما خاتمة المعلقة: «ستبدي لك الأيام...». أما أبو عمرو الشيباني فروى بعده بيتًا زائدًا، كما يقول ابن الأَنْبارِيّ: «وروى أبو عمرو الشيباني هاهنا بيتا لم يروه الأصمعي ولا ابن الأعرابي» [@ibn-al-anbari، ص229]."
