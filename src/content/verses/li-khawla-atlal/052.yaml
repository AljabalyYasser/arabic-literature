first: "إِلَى أَنْ تَحَامَتْنِي الْعَشِيرَةُ كُلُّهَا"
second: "وَأُفْرِدْتُ إِفْرَادَ الْبَعِيرِ الْمُعَبَّدِ"
meaning: "حتى تجنبتني عشيرتي كلها، وعزلتني كما يُعزل البعير الأجرب المطليّ بالقطران لئلا يُعدي الإبل. قال الزَّوْزَنِيّ: «فتجنبتني عشيرتي كما يتجنب البعير المطلي بالقطران. وأفردتني لما رأت أني لا أكف عن إتلاف المال والاشتغال باللذات» [@zawzani، ص107]."
vocabulary:
  - term: "تَحَامَتْنِي"
    text: "«التحامي: التجنب والاعتزال» [@zawzani، ص107]."
  - term: "أُفْرِدْتُ"
    text: "عُزلت وحدي."
  - term: "الْمُعَبَّدِ"
    text: "«المعبد: الأجرب عبده الجرب، أي ذهب بوبره» (أبو عُبَيْدة). وقال الطُّوسِيّ: «المعبد: المهنو بالقطران، يفرد لئلا يقارب الإبل فيعديها بجربه» [@ibn-al-anbari، ص192]. والمهنوء: المطليّ بالقطران."
syntax:
  - "«إلى» حرف غاية، وهو مع ما بعده «خبر زال» في البيت السابق [@ibn-al-anbari، ص192]، و«أنْ» مصدرية."
  - "«العشيرة» فاعل «تحامت»، و«كلها» توكيد. «وأفردت نسق على تحامتني» [@ibn-al-anbari، ص192]."
  - "«والإفراد منصوب على المصدر» [@ibn-al-anbari، ص192]: مفعول مطلق مبيّن للنوع، لأنه أضيف إلى ما يبيّن نوعه."
morphology:
  - "«تَحامَتْ» على «تفاعلت» من «حمى»، وتدل على أنهم اشتركوا جميعًا في تجنبه."
  - "«أُفْرِدْتُ» ماضٍ مبني للمجهول من «أفرد»."
  - "«مُعَبَّد» اسم مفعول من «عبّد» على «فعّل»، ومنه «الطريق المعبّد» أي المذلّل [@ibn-al-anbari، ص192]."
rhetoric:
  thesis: "أقسى صورة يرسمها لنفسه: هو في قبيلته كالبعير الأجرب في الإبل، يُعزل لئلا يُعدي غيره."
  devices:
    - title: "التشبيه"
      text: "شبّه إفراد العشيرة له بإفراد البعير المعبّد، فالمشبه به معروف لكل صاحب إبل: بعير يُطلى بالقطران ويُبعد عن القطيع [@ibn-al-anbari، ص192] [@zawzani، ص107]."
    - title: "المفعول المطلق"
      text: "«أُفردتُ إفرادَ البعير»: كرر الفعل مصدرًا، ثم أضافه إلى المشبه به، فجاء التشبيه في صورة الخبر. فلم يقل «كالبعير»، بل جعل إفراده هو إفراد البعير نفسه."
  connection: "ثم يستدرك: إن أنكرته عشيرته فلم ينكره الفقراء ولا الأغنياء."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِلَى أَنْ / تَحَامَتْنِلْ / عَشِيرَ / ةُ كُلْلُهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — وَأُفْرِدْ / تُ إِفْرَادَلْ / بَعِيرِلْ / مُعَبْبَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]."
context: "يعدّ شوقي ضيف طَرَفَة مثالًا على الشاب الذي تنفر منه قبيلته لإدمانه الخمر، ويستشهد بهذين البيتين [@deif، ج1 ص70]. وفي قول أبي جعفر: «لم أقبل من عذالي فتركوني ألقي حبلي على غاربي ولم يقربني أحد» [@ibn-al-anbari، ص191]؛ أي تركوني أفعل ما أشاء."
