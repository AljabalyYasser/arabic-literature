first: "وَاحْبُ الْمُحَامِلَ بِالْجَزِيلِ وَصُرْمُهُ"
second: "بَاقٍ إِذَا ضَلَعَتْ وَزَاغَ قِوَامُهَا"
meaning: "وأعطِ صديقك الذي يحتمل لك وتحتمل له عطاءً جزيلًا، واحتفظ بقطيعته عندك لا تتعجل بها، فإن اعوجّت المودة ومال عمادها قطعتها. قال ابن الأَنْبارِيّ: «والمعنى: لا تعاجل صديقك وخلتك بقطع الذي بينك وبينه» [@ibn-al-anbari، ص538]. وقال الزَّوْزَنِيّ: «أي إن حال المجامل عن كرم العهد فأنت قادر على صرمه وقطيعته» [@zawzani، ص180]."
vocabulary:
  - term: "وَاحْبُ"
    text: "«و (احب) من الحباء، وهي العطية» [@ibn-al-anbari، ص538]. «حبوته بكذا أحبوه حباء: إذا أعطيته إياه» [@zawzani، ص180]."
  - term: "الْمُحَامِلَ"
    text: "«المحامل: المكافئ»، و«الذي يحمل لك وتحمل له» [@ibn-al-anbari، ص538]. وعند الزَّوْزَنِيّ: «الذي يتحمل أذاك كما تتحمل أذاه» [@zawzani، ص180]."
  - term: "بِالْجَزِيلِ"
    text: "بالعطاء الكثير: «ويقال: قد أجزل له العطاء، أي أكثر له» [@ibn-al-anbari، ص538]. وعند الزَّوْزَنِيّ: «بالجزيل أي الود الجزيل» [@zawzani، ص180]."
  - term: "وَصُرْمُهُ"
    text: "«والصرم: القطيعة؛ وهو الاسم، والصرم المصدر» [@ibn-al-anbari، ص538]، أي الصُّرْم بالضم اسم، والصَّرْم بالفتح مصدر."
  - term: "ضَلَعَتْ"
    text: "«اعوجت. ويقال رمح ضلع، أي معوج» [@ibn-al-anbari، ص538]."
  - term: "قِوَامُهَا"
    text: "«عمادها. يقال هذا قوام الأمر وهذا ملاكه» [@ibn-al-anbari، ص538]. وعند الزَّوْزَنِيّ: «قوام الشيء: ما يقوم به» [@zawzani، ص180]."
syntax:
  - "«وَاحْبُ» فعل أمر من «حبا يحبو»، مبني على حذف حرف العلة، و«الْمُحَامِلَ» مفعول به، و«بِالْجَزِيلِ» متعلق بالفعل."
  - "«والواو في الصرم واو الحال. معناه واحب المحامل بالجزيل وهذه حاله» [@ibn-al-anbari، ص539]: فـ«صُرْمُهُ» مبتدأ و«بَاقٍ» خبره، والجملة حال."
  - "«وفاعل ضلعت مضمر فيه من ذكر الخلة» [@ibn-al-anbari، ص539]، أي يعود على «خُلَّةٍ» في البيت السابق، وكذلك الضمير في «قِوَامُهَا» [@zawzani، ص180]. و«قِوَامُهَا» فاعل «زَاغَ»."
morphology:
  - "«مُحَامِل» اسم فاعل من «حامَل» على «فاعَل»، وهو للمشاركة: يحمل لك وتحمل له [@ibn-al-anbari، ص538]."
  - "«بَاقٍ» اسم فاعل من «بقي»، وأصله «باقِيٌ» حُذفت ياؤه لالتقاء الساكنين مع التنوين."
  - "«قِوَام» بالكسر: العماد، «والقوام بالفتح: القامة» [@ibn-al-anbari، ص538]. و«زَاغَ» من «الزيغ، وهو الميل» [@ibn-al-anbari، ص539]."
rhetoric:
  thesis: "وصية في الصداقة تجمع الكرم والحزم: أعطِ صديقك بلا حساب، ولكن لا تنسَ أن القطيعة في يدك إن تغيّر."
  devices:
    - title: "المقابلة"
      text: "المقابلة: أن يُجمع بين معنيين متقابلين في الكلام. قابل بين «وَاحْبُ ... بِالْجَزِيلِ» و«وَصُرْمُهُ بَاقٍ»: عطاء واسع، وقطيعة محفوظة. وفسّره أبو جَعْفَر بقوله: «أثبت له مودتك، ما ثبت لك فاثبت، فان زاغ قطعته»، واستشهد بقول النَّمِر بن تَوْلَب: «فَأَحْبِبْ حَبِيبَكَ حُبًّا رُوَيْدًا ... فَلَيْسَ يَعُولُكَ أَنْ تَصْرِمَا» [@ibn-al-anbari، ص538–539]، أي أحبّ حبًّا معتدلًا، فلا يشقّ عليك القطع إن احتجت إليه."
    - title: "الاستعارة"
      text: "الاستعارة: أن يُستعمل اللفظ في غير ما وُضع له لشبه بينهما. وفي «ضَلَعَتْ وَزَاغَ قِوَامُهَا» جعل المودة شيئًا قائمًا له عماد، فإذا فسدت اعوجّت ومال عمادها. والضَّلَع اعوجاج يوصف به الرمح [@ibn-al-anbari، ص538]، والقِوام عماد الأمر. وهي عند عبد القاهر الجُرْجانيّ من الاستعارة التي يُنقل فيها اللفظ «إلى شيء آخر ثابتٍ معلومٍ» [@asrar، ص44]، وهو هنا الصداقة."
  connection: "ثم يذكر الأداة التي يقطع بها حاجته: ناقة أنضتها الأسفار [@ibn-al-anbari، ص539]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَحْبُلْ مُحَا / مِلَ بِلْجَزِي / لِ وَصُرْمُهُو = مُتْفاعلن / متَفاعلن / متَفاعلن — بَاقِنْ إِذَا / ضَلَعَتْ وَزَا / غَ قِوَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "ثاني بيتي «قطع اللبانة» (20–21). يتمّ ما بدأه في البيت السابق: لا يتمسك بمن تغيّر، ولكنه لا يعجل بالقطيعة قبل أن يتغيّر."
variants:
  - reading: "وَاحْبُ الْمُجَامِلَ بِالْجَزِيلِ"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "«والمجامل بالجيم: الذي يجاملك بالمودة» [@ibn-al-anbari، ص538]، وبها روى الزَّوْزَنِيّ: «المجامل: المصانع» [@zawzani، ص180]، والديوان [@diwan-labid، ص303] والجمهرة [@jamhara، ص245]."
  - reading: "بَاقٍ إِذَا ضَلَعَتْ وَزَاغَ قَوَامُهَا"
    status: "رواية أبي الحسن الطُّوسِيّ"
    note: "بفتح القاف [@ibn-al-anbari، ص538]. وفي الديوان: «ويروى قوامها بفتح القاف أي استقامتها، وهي رواية أبي الحسن» [@diwan-labid، ص303]."
  - reading: "بَاقٍ إِذَا ظَلَعَتْ وَزَاغَ قِوَامُهَا"
    status: "رواية الزَّوْزَنِيّ والجمهرة"
    note: "بالظاء، والظَّلْع عند الزَّوْزَنِيّ غَمْزٌ في الدواب [@zawzani، ص180]، والغَمْز: عرج خفيف. وبها روت الجمهرة [@jamhara، ص245]."
  - reading: "بَاقٍ إِذَا ضَلَعَتْ وَزَالَ قِوَامُهَا"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص538]."
