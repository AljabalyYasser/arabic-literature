first: "مِنْ مَعْشَرٍ سَنَّتْ لَهُمْ آبَاؤُهُمْ"
second: "وَلِكُلِّ قَوْمٍ سُنَّةٌ وَإِمَامُهَا"
meaning: "وهؤلاء الذين وصفتهم من قوم سنّ لهم آباؤهم هذه الخصال فهم يقتدون بهم، ولكل قوم طريقة يسيرون عليها وإمام يُقتدى به فيها. قال ابن الأَنْبارِيّ: «معناه هؤلاء الذين ذكرت من معشر هذه العادة فيهم سنة» [@ibn-al-anbari، ص593]. وقال التِّبْرِيزِيّ: «ومعنى البيت إنَّا ورثنا هذه الأفعال عن آبائنا، ولم يزل هذا الشرف فينا متقدما» [@tabrizi-ashr، ص173]."
vocabulary:
  - term: "مَعْشَرٍ"
    text: "«معشر: قوم» [@zawzani، ص201]."
  - term: "سَنَّتْ"
    text: "وضعت سُنّة يُقتدى بها: «سن لهم آباؤهم سنة وعلَّموهم مثال السنة» [@ibn-al-anbari، ص593]."
  - term: "سُنَّةٌ"
    text: "«والسُّنَّة: الطريق، والأمر الواضح» [@tabrizi-ashr، ص173]."
  - term: "إِمَامُهَا"
    text: "«والإمام: المثال» [@ibn-al-anbari، ص593]. وفي اللسان: «وَيَكُونُ الإِمامُ المِثالَ»، ثم أنشد هذا الشطر [@lisan، ج12 ص26]. وعند الزَّوْزَنِيّ: «وإمام سنّة يؤتم به فيها» [@zawzani، ص200]."
syntax:
  - "«مِنْ مَعْشَرٍ» متعلق بخبر لمبتدأ محذوف، أي هؤلاء من معشر، أو هو من معشر: «يقول: هو من قوم سَنّت لهم أسلافهم» [@zawzani، ص200]."
  - "«سَنَّتْ لَهُمْ آبَاؤُهُمْ» جملة نعت لـ«مَعْشَرٍ»، و«آبَاؤُهُمْ» فاعل، ومفعول «سنّت» محذوف، أي سنّت لهم هذه الخصال. وأُنّث الفعل لأن فاعله جمع تكسير."
  - "«وَلِكُلِّ قَوْمٍ سُنَّةٌ» جملة اسمية: «لِكُلِّ» خبر مقدم، و«سُنَّةٌ» مبتدأ مؤخر. «والإمام نسق على السنة، والهاء تعود عليها» [@ibn-al-anbari، ص593]."
morphology:
  - "«سُنَّة» على «فُعْلة» من «سنّ»، و«سَنَّتْ» ماضٍ مضعّف."
  - "«إمام» على «فِعال» من «أمّ» إذا قصد، فهو ما يُقصد ويُقتدى به: «والإمام: الطريق الذي يؤتم به» [@ibn-al-anbari، ص593]."
  - "«آباء» جمع «أب» على «أفعال». و«مَعْشَر» على «مَفْعَل»."
rhetoric:
  thesis: "يردّ لبيد خصال قومه إلى آبائهم، ثم يرفع ذلك إلى حكم عام: لكل قوم سنة وإمام."
  devices:
    - title: "التذييل"
      text: "«وَلِكُلِّ قَوْمٍ سُنَّةٌ وَإِمَامُهَا»: بعد الخبر الخاص بقومه يأتي حكم عام يصدق على الناس جميعًا، فيصير الفخر قاعدة. والتذييل: أن يُعقَّب الكلام بجملة تشتمل على معناه وتؤكده، فإذا استقلت بمعنى عام يُتمثّل به سُمّي إرسال المثل. وقد أنشد صاحب اللسان هذا الشطر وحده شاهدًا على معنى الإمام [@lisan، ج12 ص26]، فكأنه يُروى مستقلًا عن بيته."
    - title: "حذف المفعول"
      text: "«سَنَّتْ لَهُمْ»: لم يذكر ما سنّوه، فالمحذوف هو كل ما سبق من الخصال، ولو ذكره لضاق. ويقول عبد القاهر الجُرْجانيّ في الحذف: «فإنك ترى به ترك الذكر، أفصح من الذكر» [@dalail، ص146]."
  connection: "ثم يصف هؤلاء القوم: لا تتدنس أعراضهم، ولا تضيع أفعالهم، لأن عقولهم تغلب أهواءهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "مِنْ مَعْشَرِنْ / سَنْنَتْ لَهُمْ / آبَاؤُهُمْ = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — وَلِكُلْلِ قَوْ / مِنْ سُنْنَتُنْ / وَإِمَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في تفعيلات الصدر الثلاث، والثانية من العَجُز."
context: "رابع أبيات الفخر بالقوم، وهو مَفْصِل المقطع: يجمع من عدّهم في الأبيات 78–80 تحت أصل واحد. وفي رواية التِّبْرِيزِيّ يأتي بعده بيت ليس عند ابن الأَنْبارِيّ: «ويروى بعده هذا البيت» [@tabrizi-ashr، ص173]، وهو «إِنْ يَفْزَعُوا تُلْقَ الْمَغَافِرُ عِنْدَهُمْ»، وتضعه الجمهرة بعد البيت 83 (انظر شرحه)."
