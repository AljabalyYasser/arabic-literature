first: "بِمَشَارِقِ الْجَبَلَيْنِ أَوْ بِمُحَجَّرٍ"
second: "فَتَضَمَّنَتْهَا فَرْدَةٌ فَرُخَامُهَا"
meaning: "نزلت نَوار في الجهة الشرقية من جبلي طيّئ، أو بمُحَجَّر، ثم احتوتها فَرْدة فرُخام. قال الزَّوْزَنِيّ: «يقول: حلّت نوار بمشارق أجأ وسلمى، أي جوانبهما التي تلي المشرق، أو حلت بمحجر فتضمنتها فردة فالأرض المتصلة بها وهي رخام» [@zawzani، ص179]."
vocabulary:
  - term: "مَشَارِقِ الْجَبَلَيْنِ"
    text: "«مشارق الجبلين أراد: شرقيهما. والجبلان: جبلا طيئ» [@ibn-al-anbari، ص535]، وهما «أجأ وسلمى» [@zawzani، ص179]."
  - term: "مُحَجَّرٍ"
    text: "«جبل آخر» [@zawzani، ص179]. وقال أبو زِياد: «محجر: جبل حوله حجر به» [@ibn-al-anbari، ص535]."
  - term: "فَتَضَمَّنَتْهَا"
    text: "«نزلت فيها» [@ibn-al-anbari، ص535]. وعند الزَّوْزَنِيّ: «تضمن الموضع فلانًا إذا حصل فيه» [@zawzani، ص179]."
  - term: "فَرْدَةٌ"
    text: "«موضع» [@ibn-al-anbari، ص535]، وعند الزَّوْزَنِيّ: «جبل منفرد عن سائر الجبال سمي بها لانفرادها عن الجبال» [@zawzani، ص179]."
  - term: "فَرُخَامُهَا"
    text: "قال أبو زِياد: «ورخامها: جبل قريب من فردة، فأضاف ذلك الجبل إلى فردة» [@ibn-al-anbari، ص535]، وعند الزَّوْزَنِيّ: «أرض متصلة لذلك أضافها إليها» [@zawzani، ص179]. وفي لسان العرب: «ورُخامٌ: مَوْضِعٌ» [@lisan، ج12 ص236]."
syntax:
  - "«والباء صلة لحلول مضمر، والهاء والألف تعود على المرية» [@ibn-al-anbari، ص535]: فـ«بِمَشَارِقِ» متعلق بفعل محذوف تقديره «حلّت»، وهو الفعل الذي ذُكر في البيت السابق. والهاء في «فَتَضَمَّنَتْهَا» لنَوار."
  - "«أَوْ» للتخيير بين الموضعين: هي هنا أو هناك. و«فَرْدَةٌ» فاعل «تَضَمَّنَتْ»، و«فَرُخَامُهَا» معطوف عليها بالفاء."
  - "الضمير في «رُخَامُهَا» يعود على «فَرْدَةٌ»: أضاف الجبل إلى فَرْدة لقربه منها [@ibn-al-anbari، ص535]."
morphology:
  - "«مَشَارِق» جمع «مَشْرِق»، وأراد به الجهة الشرقية من الجبلين، فجمعها لاتساعها."
  - "«تَضَمَّنَ» على «تفعّل»، وهو مطاوع «ضمّن»: «وضمنته فلانًا إذا حصلته فيه، مثل قولك: ضمنته القبر فتضمنه القبر» [@zawzani، ص179]."
  - "«مُحَجَّر» اسم مفعول من «حجّر» على «فعّل»، صار اسمًا لموضع. و«الْجَبَلَيْنِ» مثنى «جَبَل» معرّف بأل، وهو معهود: جبلا طيّئ."
rhetoric:
  thesis: "يتتبع الشاعر نَوار في منازلها كأنه يرسم خريطة: جبلان، ثم مُحَجَّر، ثم فَرْدة ورُخام. وكلما زادت الأسماء زاد بُعدها."
  devices:
    - title: "تعداد المواضع"
      text: "قال الزَّوْزَنِيّ: «إنما يحصي منازلها عند حلولها بفيد، وهذه الجبال قريبة منها بعيدة من الحجاز» [@zawzani، ص179]. فالأسماء ليست زينة، بل حساب لمسافة لا يقطعها."
    - title: "إسناد الاحتواء إلى المكان"
      text: "في «فَتَضَمَّنَتْهَا فَرْدَةٌ» جعل المكان هو الذي يحتوي نَوار ويضمّها، فصارت الأرض كأنها تحرسها عنه. والمثال الذي ضربه الزَّوْزَنِيّ للفعل نفسه «ضمنته القبر فتضمنه القبر» [@zawzani، ص179] يوحي بأن المكان قد ابتلعها. وهذه قراءتنا."
    - title: "التخيير بـ«أَوْ»"
      text: "«بِمَشَارِقِ الْجَبَلَيْنِ أَوْ بِمُحَجَّرٍ»: لا يعرف أين هي على اليقين، فيذكر احتمالين. والشك في مكانها جزء من بُعدها."
  connection: "ثم يذكر أين تنزل إذا اتجهت نحو اليمن: صُوائِق، ووِحاف القَهْر، وطِلْخام [@ibn-al-anbari، ص535–536]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "بِمَشَارِقِلْ / جَبَلَيْنِ أَوْ / بِمُحَجْجَرِنْ = متَفاعلن / متَفاعلن / متَفاعلن — فَتَضَمْمَنَتْ / هَا فَرْدَةُنْ / فَرُخَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "يكمل تحديد منازل نَوار الذي بدأه في البيت السابق. ويحتج أبو جَعْفَر بهذا البيت لروايته «أهل الجبال» في البيت 17: «ومن الحجة للجبال قوله (بمشارق الجبلين أو بمحجر)» [@ibn-al-anbari، ص534]، ويقول: «هذه المواضع كلها فيما بين فيد والجبلين» [@ibn-al-anbari، ص535]."
