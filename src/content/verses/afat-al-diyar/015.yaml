first: "حُفِزَتْ وَزَايَلَهَا السَّرَابُ كَأَنَّهَا"
second: "أَجْزَاعُ بِيشَةَ أَثْلُهَا وَرِضَامُهَا"
meaning: "دُفعت الظعائن في السير، وجعل السراب يكشفها ويواريها، فكأنها في ضخامتها منعطفات وادي بِيشة بشجر الأثل فيها وصخورها العظام. قال الزَّوْزَنِيّ: «فكأن الظعن منعطفات وادي بيشة أثلها وحجارتها العظام، شبهها في العظم والضخم بهما» [@zawzani، ص178]."
vocabulary:
  - term: "حُفِزَتْ"
    text: "قال أبو عَمْرو: «معنى قوله (حفزت) : دفعت واستحثت في السير» [@ibn-al-anbari، ص531]."
  - term: "وَزَايَلَهَا السَّرَابُ"
    text: "«دفعها سراب إلى سراب» [@ibn-al-anbari، ص531]، وعند الزَّوْزَنِيّ: «وفارقها قطع السراب، أي لاحت خلال قطع السراب ولمعت» [@zawzani، ص178]. والسراب: ما يُرى في الفلاة وقت الحرّ كأنه ماء."
  - term: "أَجْزَاعُ"
    text: "«معاطف أوديتها، واحدها جزع» [@ibn-al-anbari، ص532]، وعند الزَّوْزَنِيّ: «جمع جزع وهو منعطف الوادي» [@zawzani، ص178]."
  - term: "بِيشَةَ"
    text: "«واد بعينه» [@zawzani، ص178]."
  - term: "أَثْلُهَا"
    text: "الأثل: «شجر يشبه الطرفاء إلا أنه أعظم منها» [@zawzani، ص178]."
  - term: "رِضَامُهَا"
    text: "«صخور عظام يجتمع بعضها مع بعض» [@ibn-al-anbari، ص532]. وفي لسان العرب: «والرِّضام: حِجَارَةٌ تُجْمَعُ، وَاحِدُهَا رَضْمةٌ ورَضْمٌ» [@lisan، ج12 ص244]."
syntax:
  - "«حُفِزَتْ» ماضٍ مبني للمجهول، ونائب فاعله ضمير الظعائن، وجملة «وَزَايَلَهَا السَّرَابُ» معطوفة عليها، و«السَّرَابُ» فاعل."
  - "الضمير في «كَأَنَّهَا» اسم «كأنّ»، و«أَجْزَاعُ» خبرها. «والأثل والرضام يرتفعان على الإتباع للأجزاع، وبيشة لا تجرى للتعريف والتأنيث» [@ibn-al-anbari، ص532]، أي هما بدل من «أَجْزَاعُ»، و«بِيشَةَ» مجرورة بالفتحة لأنها ممنوعة من الصرف."
  - "الضمير في «أَثْلُهَا» و«رِضَامُهَا»: «والضمير الذي أضيف إليه أثل ورضام لبيشة» [@zawzani، ص178]."
morphology:
  - "«حُفِزَتْ» من «حفز يحفز» [@zawzani، ص178]، «وحفزه دفعه» [@ibn-al-anbari، ص531]."
  - "«زَايَلَ» على «فاعَلَ»، وهو من «زال» بمعنى فارق: فالسراب يفارقها ثم يعود إليها."
  - "«رِضَام» على «فِعال»، وواحده «رَضْمة»: «وفعال يكون جمعا لفَعْلة وفَعَلة جميعا، فيقال: صحْفة وصحاف، وثمَرة وثِمار» [@ibn-al-anbari، ص532]."
rhetoric:
  thesis: "آخر صور الظعائن: يراها الشاعر من بعيد، والسراب يلعب بها، فتصير قطعة من الوادي بشجره وصخره."
  devices:
    - title: "التشبيه"
      text: "في «كَأَنَّهَا أَجْزَاعُ بِيشَةَ» شبّه الظعائن بمنعطفات الوادي، و«شبه الهوادج على الإبل بشجر الأثل» [@ibn-al-anbari، ص532]. ووجه الشبه عند الزَّوْزَنِيّ «العظم والضخم» [@zawzani، ص178]. وهو شبه في الصورة يدركه البصر مباشرة، فهو عند عبد القاهر الجُرْجانيّ من التشبيه الذي «لا يجري فيه التأوُّل» [@asrar، ص92]."
    - title: "صورة المسافة"
      text: "في البيت 14 كانت النساء ظباء تُرى عيونها، وفي هذا البيت صارت الظعائن شجرًا وصخرًا. فالشاعر يبتعد عنها بصره من بيت إلى بيت، حتى لا يبقى منها إلا كتل تظهر في السراب وتختفي. وهذه قراءتنا للبيتين."
    - title: "«زَايَلَهَا السَّرَابُ»"
      text: "جعل السراب يفارق الظعائن ويعود إليها، فهي تبين حينًا وتغيب حينًا: «دفعها سراب إلى سراب» [@ibn-al-anbari، ص531]. والحركة في البيت حركة الصورة في عين الناظر، لا حركة الإبل وحدها."
  connection: "ثم يقطع وصف الظعائن بـ«بَلْ»، ويسأل نفسه: ما الذي تذكره من نَوار وقد بعدت؟ [@ibn-al-anbari، ص532–533]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "حُفِزَتْ وَزَا / يَلَهَسْ سَرَا / بُ كَأَنْنَهَا = متَفاعلن / متَفاعلن / متَفاعلن — أَجْزَاعُ بِي / شَةَ أَثْلُهَا / وَرِضَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "آخر أبيات الظعائن (12–15). بدأ المشهد بالرحيل ودخول النساء الهوادج، وينتهي بالظعائن بعيدة في السراب."
variants:
  - reading: "حُزِيَتْ وَزَيَّلَهَا السَّرَابُ كَأَنَّهَا"
    status: "رواية الأَصْمَعِيّ"
    note: "«وحزيت يهمز ولا يهمز. يريد: حزاها السراب، أي رفعها. وزيلها: فرقها» [@ibn-al-anbari، ص532]. ويذكرها محقق الديوان مهموزة «حُزِئَتْ» [@diwan-labid، ص301]."
