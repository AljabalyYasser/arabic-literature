first: "قَدْ بِتُّ سَامِرَهَا وَغَايَةِ تَاجِرٍ"
second: "وَافَيْتُ إِذْ رُفِعَتْ وَعَزَّ مُدَامُهَا"
meaning: "قد سهرتُ تلك الليلة أحادث ندمائي، ورُبّ راية خمّار أتيتها حين رُفعت، وقد غلا ثمن خمرها. قال ابن الأَنْبارِيّ: «قوله (سامرها) معناه سامرا فيها. و (غاية تاجر) أي راية تاجر يبيع الخمر فينصبها ليعلم موضعه» [@ibn-al-anbari، ص574]. وقال الزَّوْزَنِيّ: «يتمدح بكونه لسان أصحابه وبكونه جوادًا لاشترائه الخمر غالية لندمائه» [@zawzani، ص193]."
vocabulary:
  - term: "سَامِرَهَا"
    text: "«معناه سامرا فيها» [@ibn-al-anbari، ص574]، والسامر الذي يتحدث ليلًا."
  - term: "غَايَةِ"
    text: "راية الخمّار. «وإنما سميت غاية لأن أهل الجاهلية كانوا ينصبون راية للخيل تسمى الغاية، فإذا بلغها الفرس قيل: قد بلغ الغاية. فصارت مثلا» [@ibn-al-anbari، ص574]. وفي اللسان: «الغَايَةُ والرَّاية سواءٌ» [@lisan، ج15 ص143]. وعن أبي عَمْرو قول آخر: «(وغاية تاجر) معناه وغاية سومه، أي منتهى ما يستام» [@ibn-al-anbari، ص575]، أي أعلى ثمن يطلبه."
  - term: "تَاجِرٍ"
    text: "«وأراد بالتاجر الخمار» [@zawzani، ص193]."
  - term: "وَافَيْتُ"
    text: "«وافيت المكان: أتيته» [@zawzani، ص193]."
  - term: "رُفِعَتْ"
    text: "عند ابن الأَنْبارِيّ: «معناه إذ رفعت في الثمن» [@ibn-al-anbari، ص575]، وعند الزَّوْزَنِيّ رُفعت الراية: «حين رفعت ونصبت» [@zawzani، ص193]."
  - term: "عَزَّ"
    text: "«ارتفع وعلا. يقول: أشترى الخمر إذا كانت غالية عزيزة» [@ibn-al-anbari، ص575]."
  - term: "مُدَامُهَا"
    text: "«الخمر التي أديمت في مكان حتى عتقت» [@ibn-al-anbari، ص575]."
syntax:
  - "«سَامِرَهَا» حال من التاء في «بِتُّ»، والضمير لليلة في البيت السابق، وبهذه الجملة يتم خبر «كَمْ»."
  - "«وَغَايَةِ تَاجِرٍ» مجرور بـ«رُبَّ» محذوفة بعد الواو: «فمن نصب نصب بوافيت، ومن خفض أضمر رب» [@ibn-al-anbari، ص575]. وجملة «وَافَيْتُ» صفة للمجرور، أو خبر عنه."
  - "«إِذْ رُفِعَتْ» ظرف، ونائب الفاعل ضمير الغاية. و«عَزَّ مُدَامُهَا» معطوف عليه، و«مُدَامُهَا» فاعل."
morphology:
  - "«سَامِر» اسم فاعل من «سمَر» إذا تحدّث ليلًا. و«وَافَيْتُ» على «فاعلت» من «وفى»."
  - "«مُدَام» اسم مفعول من «أدام»: «وإنما سميت الخمر مداما لأنها أسكنت في دنها» [@ibn-al-anbari، ص575]، والدَّنّ وعاء الخمر. ومنه عنده «يقال أدم قدرك، أي سكَّن من غليانها» [@ibn-al-anbari، ص575]."
rhetoric:
  thesis: "الكرم في ثمن الخمر: لا يشتريها رخيصة، بل حين تعزّ. والسهر والحديث والشراء الغالي صفات رجل يُطلب في المجلس."
  devices:
    - title: "نقل الكلمة من معنى إلى معنى"
      text: "«غَايَةِ تَاجِرٍ»: الغاية في أصلها راية السباق ينتهي إليها الفرس، ثم صارت راية الخمّار، كما يقول ابن الأَنْبارِيّ «فصارت مثلا». فالخمّار ينصب رايته كما تُنصب غاية السباق، ومن يسبق إليها هو الكريم. وهذه قراءتنا في الصلة بين المعنيين."
    - title: "الإيجاز بحذف رُبّ"
      text: "«وَغَايَةِ»: حذف «رُبَّ» وأبقى عملها، فبدأ الشطر بالمجرور، وهو أسلوب كثير في شعرهم، يفيد هنا التكثير: رايات كثيرة وافاها. وهذه قراءتنا."
  connection: "ثم يصف الخمر التي يشتريها: زقّ قديم أو خابية فُضّ ختمها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "قَدْ بِتْتُ سَا / مِرَهَا وَغَا / يَةِ تَاجِرِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — وَافَيْتُ إِذْ / رُفِعَتْ وَعَزْ / زَ مُدَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأولى من العجز."
context: "الرابع من أبيات خطاب نَوار (55–62). يتم به خبر الليلة التي بدأها في البيت السابق، ثم يبدأ الخمر."
