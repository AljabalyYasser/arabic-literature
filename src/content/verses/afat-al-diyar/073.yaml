    note: "[@zawzani، ص197]، وذكرها ابن الأَنْبارِيّ: «ويروى (متشابه أجسامها)، أي بعضها يشبه بعضا» [@ibn-al-anbari، ص588]. وبها متن الديوان [@diwan-labid، ص318]."
  - reading: "بِمَغَالِقٍ مُتَشَابِهٍ أَجْرَامُهَا"
