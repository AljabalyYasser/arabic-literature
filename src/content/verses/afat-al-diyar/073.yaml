first: "وَجَزُورِ أَيْسَارٍ دَعَوْتُ لِحَتْفِهَا"
second: "بِمَغَالِقٍ مُتَشَابِهٍ أَعْلَامُهَا"
meaning: "ورُبَّ ناقةٍ يتقامر عليها أصحاب الميسر، دعوتُ إلى نحرها بقداح يشبه بعضها بعضًا في علاماتها. قال الزَّوْزَنِيّ: «ورب جزور أصحاب ميسر كانت تصلح لتقامر الأيسار عليها، دعوت ندمائي لهلاكها أي لنحرها بسهام متشابهة» [@zawzani، ص198]. والمَيْسِر لعبٌ بالقداح على جزور تُنحر وتُقسم أجزاؤها، «والميسر - وهو القمار - من هذا مأخوذ» [@ibn-al-anbari، ص588]."
vocabulary:
  - term: "جَزُورِ"
    text: "«الجزور: التي جزرت، أي نحرت» [@ibn-al-anbari، ص588]، أي الناقة تُعدّ للنحر."
  - term: "أَيْسَارٍ"
    text: "«الذين يضربون على الجزور بالقداح، واحدهم ياسر ويسر» [@ibn-al-anbari، ص588]."
  - term: "حَتْفِهَا"
    text: "موتها، و«لحتفها: أي لنحرها» [@tabrizi-ashr، ص169]."
  - term: "مَغَالِقٍ"
    text: "«القداح التي تُغلق الرهن» [@ibn-al-anbari، ص588]، و«سميت بها لأنَّ بها يغلق الخطر، من قولهم: غلق الرهن يغلق غلقًا، إذا لم يوجد له تخلص وفكاك» [@zawzani، ص197–198]. وقال الأَزْهَرِيّ في اللسان: «والمغالق من نعوت قداح الميسر التي يكون لها الفوز، وليست المغالق من أسمائها» [@lisan، ج10 ص292]. والخَطَر: ما يُتراهن عليه."
  - term: "أَعْلَامُهَا"
    text: "«العلامات، واحدها علم» [@ibn-al-anbari، ص588]، وهي ما يُعلَّم به كل قدح."
syntax:
  - "«والجزور خفض بالواو التي تخلف رب. والباء صلة دعوت، والهاء الأولى تعود على الجزور، والثانية على المغالق» [@ibn-al-anbari، ص588]. أي «جَزُورِ» مجرور بواو رُبّ، و«بِمَغَالِقٍ» متعلق بـ«دَعَوْتُ»."
  - "«لِحَتْفِهَا» اللام للتعليل أو بمعنى «إلى»، متعلقة بـ«دَعَوْتُ»."
  - "«مُتَشَابِهٍ» نعت لـ«مَغَالِقٍ» مجرور، و«أَعْلَامُهَا» فاعل لاسم الفاعل؛ وأُفرد «متشابه» لأنه رفع اسمًا ظاهرًا، كما يُفرد الفعل."
morphology:
  - "«جَزُور» على «فَعُول» بمعنى «مفعولة»، فلا تلحقه التاء وإن كان للأنثى."
  - "«مَغالِق» جمع «مِغْلَق» و«مِغْلاق» [@ibn-al-anbari، ص588]، وهما من أبنية اسم الآلة."
  - "«أَيْسار» جمع «يَسَر»، «ويقال واحد الأيسار يسير» [@ibn-al-anbari، ص588]، والفعل «يسر ييسر»."
rhetoric:
  thesis: "يبدأ مقطع الكرم: الميسر عند لبيد ليس كسبًا، بل باب لإطعام الناس."
  devices:
    - title: "الكناية"
      text: "«دَعَوْتُ لِحَتْفِهَا»: لم يقل نحرتها، بل جعل نفسه يدعو الموت إلى الجزور بالقداح. فالكناية عن النحر تجعل الحدث دعوة، والداعي هو الكريم. والكناية: أن تذكر شيئًا وتريد لازمه."
    - title: "الفخر بالميسر"
      text: "يقول الزَّوْزَنِيّ: «قال الأئمة: يفتخر بنحره إياها من صلب ماله لا من كسب قماره، والأبيات التي بعده تدلّ عليه، وإنما أراد السهام ليقرع بها بين إبله أيها ينحر للندماء» [@zawzani، ص198]. وكان من لا يدخل الميسر يسمى «برما»، وأنشد ابن الأَنْبارِيّ لمُتَمِّم بن نُوَيْرة: «وَلَا بَرَمٍ تُهْدِي النِّسَاءُ لِعِرْسِهِ ... إِذَا الْقَشْعُ مِنْ رِيحِ الشِّتَاءِ تَقَعْقَعَا» [@ibn-al-anbari، ص588]، فنفي البَرَم مدح."
    - title: "دقة الوصف"
      text: "«مُتَشَابِهٍ»: القداح لا يتميز بعضها من بعض إلا بعلاماتها، وفي الرواية الأخرى «أجسامها»، أي هي على قدر واحد، «لأن القدح لو عظم شيئا لندر في اليد» [@ibn-al-anbari، ص588]، أي لعرفته اليد فخرج بغير عدل. فالتشابه شاهد على نزاهة القسمة."
  connection: "ثم يبين أي النوق يختار: العاقر السمينة أو المطفل الغالية، ويبذل لحمها للجيران."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَجَزُورِ أَيْ / سَارِنْ دَعَوْ / تُ لِحَتْفِهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — بِمَغَالِقِنْ / مُتَشَابِهِنْ / أَعْلَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثانية من الصدر والثالثة من العَجُز."
context: "أول مقطع الميسر والقِرى (73–77)، والقِرى: إطعام الضيف. ينتقل لبيد من مجلس الملوك إلى مجلس الكرم، وكلاهما مما يفخر به سيد القوم."
variants:
  - reading: "بِمَغَالِقٍ مُتَشَابِهٍ أَجْسَامُهَا"
