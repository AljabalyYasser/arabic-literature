first: "حَتَّى إِذَا حَسَرَ الظَّلَامُ وَأَسْفَرَتْ"
second: "بَكَرَتْ تَزِلُّ عَنِ الثَّرَى أَزْلَامُهَا"
meaning: "حتى إذا انكشف الظلام ودخلت في ضوء الصبح، خرجت أول النهار وقوائمها تنزلق عن التراب المبتل. قال ابن الأَنْبارِيّ: «فيقول: أصبحت قوائمها من خفتها لا تثبت على الأرض من الطين» [@ibn-al-anbari، ص562]. وجعل الزَّوْزَنِيّ العلة كثرة المطر: «فنزلت قوائمها عن التراب الندي لكثرة المطر الذي أصابه ليلًا» [@zawzani، ص189]، و«فنزلت» في المطبوع صوابها «فزلّت»."
vocabulary:
  - term: "حَسَرَ"
    text: "«حسر الظلام: ذهب» [@ibn-al-anbari، ص562]."
  - term: "أَسْفَرَتْ"
    text: "«صارت في سفر الصبح. وسفره: بياضه وإضاءته» [@ibn-al-anbari، ص562]."
  - term: "الثَّرَى"
    text: "«التراب المبتل» [@ibn-al-anbari، ص562]."
  - term: "أَزْلَامُهَا"
    text: "«قوائمها التي كأنها قداح. وهذا مثل. والأزلام: القداح والسهام، واحدها زُلم وزَلم» [@ibn-al-anbari، ص562]."
syntax:
  - "«حَتَّى» ابتدائية، و«إِذَا» ظرف شرطي جوابه «بَكَرَتْ». و«وَأَسْفَرَتْ» معطوف على «حَسَرَ»، وفاعله ضمير البقرة على تفسير ابن الأَنْبارِيّ «صارت في سفر الصبح»."
  - "«والأزلام مرتفعة ببكرت، وتزل في موضع نصب في التأويل على الحال، والتقدير: بكرت زالة عن الثرى» [@ibn-al-anbari، ص562]. أي جعل «أَزْلَامُهَا» فاعل «بَكَرَتْ»، وجملة «تَزِلُّ» حالًا مقدّمة عليه."
morphology:
  - "«أَزْلَام» جمع «زَلَم» على «أفعال»: «وجعلها أزلامًا لاستوائها، ومنه سميت القداح أزلامًا، والتزليم التسوية» [@zawzani، ص188]."
  - "«تَزِلّ» مضارع «زلّ يزِلّ» المضعّف، أصله «تَزْلِلُ» فأُدغمت اللام في اللام."
  - "«أَسْفَرَتْ» على «أفعل» من السَّفَر وهو بياض الصبح، و«بَكَرَتْ» من البُكرة وهي أول النهار."
rhetoric:
  thesis: "يأتي الصبح بالحركة بعد سكون الليل. والقوائم التي تنزلق على الطين تمهّد لما بعدها: أيام من التردد، ثم الصيد."
  devices:
    - title: "الاستعارة"
      text: "«أَزْلَامُهَا»: سمّى القوائم أزلامًا، أي قداحًا، ولم يذكر القوائم، وقال ابن الأَنْبارِيّ: «وهذا مثل» [@ibn-al-anbari، ص562]. وهذا عند عبد القاهر الجُرْجانيّ الضرب الأول من الاستعارة: «أن تُريدَ تشبيهَ الشيءِ بالشيءِ، فَتَدعَ أنْ تُفْصحَ بالتشبيهِ وتُظْهرَه، وتجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]. فالقوائم في دقتها واستوائها قداح."
    - title: "الجناس"
      text: "«تَزِلُّ ... أَزْلَامُهَا»: لفظان متقاربان في الحروف (ز ل)، فيتردد في السمع صوت الزلل. والجناس: تشابه لفظين في الحروف. وهذه قراءتنا."
  connection: "ثم يذكر ما فعلته سبعة أيام: تتردد جزعة بين الغدران تطلب ولدها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "حَتْتَى إِذَا / حَسَرَ ظْظَلَا / مُ وَأَسْفَرَتْ = مُتْفاعلن / متَفاعلن / متَفاعلن — بَكَرَتْ تَزِلْ / لُ عَنِ ثْثَرَى / أَزْلَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والثالثة من العجز."
context: "أول أبيات الصباح والرماة والكلاب (44–52). و«حَتَّى إِذَا» تفتح هنا سلسلة من الأطوار المتتابعة، وتتكرر في البيتين 46 و49."
