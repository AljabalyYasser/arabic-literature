first: "تَرَّاكُ أَمْكِنَةٍ إِذَا لَمْ أَرْضَهَا"
second: "أَوْ يَعْتَلِقْ بَعْضَ النُّفُوسِ حِمَامُهَا"
meaning: "وأني كثير الترك للأماكن إذا لم أرضها، إلا أن يحبس نفسي الموت. قال الزَّوْزَنِيّ: «إني ترّاك أماكن إذا لم أرضها إلا أن يرتبط نفسي حمامها فلا يمكنها البراح، وأراد ببعض النفوس هنا نفسه، هذا أوجه الأقوال وأحسنها» [@zawzani، ص192]."
vocabulary:
  - term: "تَرَّاكُ"
    text: "كثير الترك، صيغة مبالغة كـ«وَصَّال» و«جَذَّام» في البيت السابق."
  - term: "يَعْتَلِقْ"
    text: "يتعلّق بها فيحبسها، ويُروى «يَرْتَبِطْ» و«يَعْتَقِي»: «ومعنى يعتقى يحتبس، وكذلك يرتبط» [@ibn-al-anbari، ص573]."
  - term: "بَعْضَ النُّفُوسِ"
    text: "نفسه: «أراد نفسه، لأن نفسه بعض أنفس الناس» [@ibn-al-anbari، ص573]."
  - term: "حِمَامُهَا"
    text: "الموت المقدّر لها، وقد مضى في البيت 51."
syntax:
  - "«وترَّاك يرتفع بوصال وجذام» [@ibn-al-anbari، ص573]، أي هو خبر ثالث لـ«أَنَّ» في البيت السابق، تابع لهما في الرفع."
  - "«إِذَا» ظرف شرطي، وجوابه محذوف يدل عليه «تَرَّاكُ». و«بَعْضَ» مفعول به مقدّم، و«حِمَامُهَا» فاعل مؤخّر."
  - "«أَوْ» بمعنى «إلا أن» في تفسير الزَّوْزَنِيّ، ولو كانت كذلك لنُصب الفعل بعدها، و«يَعْتَلِقْ» مجزوم، والوزن يقتضي السكون. وظاهر الجزم العطف على «أَرْضَهَا» المجزوم بـ«لَمْ». ويقول محقق الديوان إن جزمه «أتعب النحويين في التخريج» [@diwan-labid، ص313]."
morphology:
  - "«تَرَّاك» على «فَعَّال» صيغة مبالغة من «ترك»."
  - "«أَمْكِنَة» جمع «مكان» على «أَفْعِلة»."
  - "«أَرْضَهَا» مضارع «رضي» مجزوم بـ«لَمْ» بحذف حرف العلة، أصله «أَرْضَى»."
  - "«يَعْتَلِق» على «يفتعل» من العُلوق، أي التعلّق."
rhetoric:
  thesis: "الحرية والموت في بيت واحد: لا شيء يحبسه في أرض لا يرضاها إلا الموت. ويقول ذلك عن نفسه بلفظ يبعدها: «بعض النفوس»."
  devices:
    - title: "الكناية بالبعض عن النفس"
      text: "«بَعْضَ النُّفُوسِ»: أراد نفسه ولم يصرّح. وخالف أبو عُبَيْدة فجعلها لكل النفوس: «معناه كل النفوس، لأن الموت لا ينزل ببعض النفوس ولكنه ينزل بالنفوس كلها» [@ibn-al-anbari، ص573]. وقال الزَّوْزَنِيّ إن من جعل بعض النفوس «بمعنى كلّ النفوس فقد أخطأ؛ لأنَّ بعضًا لا يفيد العموم والاستيعاب» [@zawzani، ص193]. وبالتعبير عن النفس بـ«بعض النفوس» يذكر الشاعر موته كأنه يتحدث عن غيره."
    - title: "صيغة المبالغة"
      text: "«تَرَّاكُ»: بعد «وَصَّالُ» و«جَذَّامُهَا» في البيت السابق، تتوالى صيغ «فَعَّال» في أول الفخر، فما يصفه ليس فعلًا وقع مرة بل عادة. وهذه قراءتنا."
  connection: "ثم يضرب عن هذا الخبر إلى خطاب نَوار: «بَلْ أَنْتِ لَا تَدْرِينَ» كم ليلة طيبة قضاها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "تَرْرَاكُ أَمْ / كِنَتِنْ إِذَا / لَمْ أَرْضَهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن — أَوْ يَعْتَلِقْ / بَعْضَ نْنُفُو / سِ حِمَامُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأولى والثالثة من الصدر والأوليين من العجز."
context: "الثاني من أبيات خطاب نَوار (55–62)، يتمم صفة نفسه التي بدأها في البيت السابق."
variants:
  - reading: "أَوْ يَرْتَبِطْ بَعْضَ النُّفُوسِ حِمَامُهَا"
    status: "رواية أخرى"
    note: "«ويروى: (أو يرتبط)» [@ibn-al-anbari، ص573]، ويذكرها الديوان [@diwan-labid، ص313]."
  - reading: "أَوْ يَعْتَقِي بَعْضَ النُّفُوسِ حِمَامُهَا"
    status: "رواية أخرى"
    note: "ومعناه يحتبس [@ibn-al-anbari، ص573] [@diwan-labid، ص313]."
