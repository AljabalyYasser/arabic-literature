first: "وَكَثِيرَةٍ غُرَبَاؤُهَا مَجْهُولَةٍ"
second: "تُرْجَى نَوَافِلُهَا وَيُخْشَى ذَامُهَا"
meaning: "ورُبَّ مجلسٍ كثير الغرباء، لا يعرف بعضهم بعضًا، يرجو من حضره عطاءه وشرفه، ويخشى أن يلحقه فيه عيب. قال الزَّوْزَنِيّ: «ورب مقامة أو قبة أو دار كثرت غرباؤها وغاشيتها وجهلت، أي لا يعرف بعض الغرباء بعضًا، ترجى عطاياها ويخشى عيبها» [@zawzani، ص197]. ويقول ابن الأَنْبارِيّ في معنى ذلك: «إن فلجت خرجت بفضل، وإن فلج عليّ بقي عليّ عار» [@ibn-al-anbari، ص586]."
vocabulary:
  - term: "غُرَبَاؤُهَا"
    text: "«نُزاعها وطلاب الحوائج إليها» [@ibn-al-anbari، ص585]، والنُّزّاع: الوافدون من أماكن بعيدة."
  - term: "مَجْهُولَةٍ"
    text: "«وعنى بمجهولة الغرباء» [@ibn-al-anbari، ص585]، أي يُجهل من فيها."
  - term: "نَوَافِلُهَا"
    text: "عطاياها وفضولها، و«ترجى عطاياها» [@zawzani، ص197]. ومفردها نافلة."
  - term: "ذَامُهَا"
    text: "«عيبها» [@ibn-al-anbari، ص585]. وفي اللسان: «الذَّيْمُ والذامُ: العيب» [@lisan، ج12 ص223]."
syntax:
  - "الواو في «وَكَثِيرَةٍ» واو رُبّ، و«كثيرة» مجرورة بها، وهي صفة لموصوف محذوف. وجواب رُبّ في البيت 72: «أنكرت باطلها» [@khizana، ج9 ص516]."
  - "«والغرباء يرتفعون بمعنى الكثرة، والهاء التي مع الغرباء تعود على القبة المنزولة» [@ibn-al-anbari، ص586]؛ أي «غُرَبَاؤُهَا» فاعل للصفة «كَثِيرَةٍ»."
  - "«مَجْهُولَةٍ» صفة ثانية، و«تُرْجَى نَوَافِلُهَا» و«يُخْشَى ذَامُهَا» جملتان في موضع صفة ثالثة ورابعة."
morphology:
  - "«غُرَباء» جمع «غريب» على «فُعَلاء»، كظريف وظرفاء."
  - "في «الذام» لغات: «يقال ذممت الرجل أذمه ذما، وذمته أذيمه ذيما، وذأمته أذأمه ذأماً» [@ibn-al-anbari، ص585]."
  - "«نوافل» جمع «نافلة» على «فواعل»، والنافلة الزيادة على الواجب."
rhetoric:
  thesis: "يرتفع الفخر من ساحة الحرب إلى مجلس الملك: مكان يُكسب فيه الشرف أو يُخسر بكلمة."
  devices:
    - title: "حذف الموصوف"
      text: "لم يذكر ما هي «الكثيرة الغرباء»، فاختلف الشرّاح: قبة، أو جماعة، أو خطة، أو مرتبة [@ibn-al-anbari، ص585]، أو حرب، أو أرض [@tabrizi-ashr، ص167–168]. ويقول التِّبْرِيزِيّ: «وإنما وقع الاختلاف في المعنى لأنه أقام الصفة مقام الموصوف، فاحتمل هذه المعاني»، ويعدّ ذلك «قبيحا؛ لما يقع فيه من الإشكال» [@tabrizi-ashr، ص168]. وعلى خلاف ذلك يرى عبد القاهر الجُرْجانيّ أن الحذف قد يكون «ترك الذكر، أفصح من الذكر» [@dalail، ص146]؛ والإبهام هنا يجعل المجلس أعظم من أن يُسمّى."
    - title: "المقابلة"
      text: "«تُرْجَى نَوَافِلُهَا» و«يُخْشَى ذَامُهَا»: الرجاء والخشية، والعطاء والعيب، في شطر واحد. فالمقام خطر من الجهتين، وبهذا يعظم فوز من يخرج منه ظافرًا. والمقابلة: أن يُؤتى بمعنيين أو أكثر ثم بما يقابلها."
  connection: "ثم يصف الخصوم في هذا المجلس: غلاظ الرقاب، يتوعد بعضهم بعضًا."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَكَثِيرَتِنْ / غُرَبَاؤُهَا / مَجْهُولَتِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — تُرْجَى نَوَا / فِلُهَا وَيُخْ / شَى ذَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز."
context: "أول مقطع المقام عند الملوك (70–72). قال ابن الأَنْبارِيّ: «وقال بعض أهل اللغة: إنما عنى بقوله (وكثيرة غرباؤها) قبة النعمان. وجعلها كثيرة الغرباء لأنهم يفدون عليه من كل ناحية. قال: وهذا يحقق مناضلة النعمان الربيع بن زياد العبسي» [@ibn-al-anbari، ص586]؛ أي يشهد للخبر الذي يُروى عن منازعة لَبِيد الرَّبِيعَ بن زِياد العَبْسِيّ عند النُّعْمان. وكذلك قال الزَّوْزَنِيّ: «يفتخر بالمناظرة التي جرت بينه وبين الربيع بن زياد في مجلس النعمان بن المنذر ملك العرب، ولها قصة طويلة» [@zawzani، ص197]، وفسّره أبو الحسن الطُّوسِيّ في شرح ديوان لبيد، فيما ينقل البَغْداديّ: «يعني قبة كانت تضرب على باب الملك يقعد فيها الناس حتى يؤذن لهم»، ثم قال البغدادي إن المراد بها قبة الملك «هو الراجح الصحيح» [@khizana، ج9 ص517]. وفي الأغاني: «وكان لبيد يقول الشعر ويقول: لا تُظْهِروه، حتى قال: عَفَتِ الدِّيَارُ مَحَلُّهَا فَمُقَامُهَا، وذكر ما صنع الربيع بن زياد، وضَمْرة بن ضَمْرة، ومَن حضرهم من وجوه الناس، فقال لهم لبيد حينئذ: أظهروها» [@aghani-dk، ج15 ص367]. والخبر نفسه درجته راجح، وهو خبر أدبي: له أصل في المصادر القديمة يتفق على جوهره، وتختلف رواياته في تفصيله، ومن أقدمها رواية ابن الأَنْبارِيّ في صدر شرحه للقصيدة [@ibn-al-anbari، ص505–506]؛ ونرويه بتمامه في حياة لبيد. أما البيت فلا يسمّي النعمان ولا الربيع، والربط بينهما قول الشرّاح."
