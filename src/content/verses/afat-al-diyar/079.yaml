first: "وَمُقَسِّمٌ يُعْطِي الْعَشِيرَةَ حَقَّهَا"
second: "وَمُغَذْمِرٌ لِحُقُوقِهَا هَضَّامُهَا"
meaning: "ومنّا رجل يقسم بين الناس، فيعطي العشيرة حقها كاملًا، ويتغضّب لحقوقها إذا ضُيّعت، ويكسر من حق نفسه لها. قال الزَّوْزَنِيّ: «يريد أن السيد منا يوفر حقوق عشائره بالهضم من حقوق نفسه» [@zawzani، ص199]. وقال أبو جَعْفَر فيما نقله ابن الأَنْبارِيّ: «المعنى إنه يعطى عشيرته حقها الواجب ثم يفرق بعد نصيبه عليها فيهضمه لها» [@ibn-al-anbari، ص592]."
vocabulary:
  - term: "مُقَسِّمٌ"
    text: "«مقسم، معناه يعطى ويقسم» [@ibn-al-anbari، ص592]، وعند التِّبْرِيزِيّ: «أي ومنا مقسم يقسم بالعدل وبغيره» [@tabrizi-ashr، ص172]."
  - term: "مُغَذْمِرٌ"
    text: "اختلفوا فيه. قال ابن الأَنْبارِيّ إنه «من الغذامير، وهو أن يرمى الكلام بعضه على بعض ويستخف به» [@ibn-al-anbari، ص592]، أي يستخف بحقوقه هو ويهبها. «وقال الأصمعي: المغذمر: الذي يضرب بعض حقوق الناس ببعض، فيأخذ من هذا ويعطي هذا، وقال أبو عبيدة: هو الذي لا يُعصى ولا يُرد قوله» [@tabrizi-ashr، ص172]. وعند الزَّوْزَنِيّ: «التغذمر: والغذمرة: التغضب مع همهمة» [@zawzani، ص199]، والهمهمة: صوت يتردد في الصدر. وفي اللسان: «وَمِنْهُ قِيلَ لِلرَّئِيسِ الَّذِي يَسُوس عَشِيرَتَهُ بِمَا شَاءَ مِنْ عَدْلٍ وَظُلْمٍ: مُغَذْمِر» [@lisan، ج5 ص11]."
  - term: "هَضَّامُهَا"
    text: "كثير الكسر والنقص منها، و«يقال: أهضم له من حقك، أي اكسر له» [@ibn-al-anbari، ص592]. وفي اللسان: «وهَضَمَ لَهُ مِنْ حقِّه يَهْضِمُ هَضْماً: تركَ لَهُ مِنْهُ شَيْئًا عَنْ طِيبةِ نَفْسٍ» [@lisan، ج12 ص613]."
syntax:
  - "«وَمُقَسِّمٌ» معطوف على «لِزَازُ» في البيت السابق عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص592]، أي لم يزل منا لزاز عظيمة ومقسم؛ وعند التِّبْرِيزِيّ «أي ومنا مقسم» [@tabrizi-ashr، ص172]."
  - "«يُعْطِي الْعَشِيرَةَ حَقَّهَا» جملة نعت لـ«مُقَسِّمٌ»، و«الْعَشِيرَةَ» مفعول أول، و«حَقَّهَا» مفعول ثانٍ."
  - "«وَمُغَذْمِرٌ» معطوف كذلك، و«هَضَّامُهَا» «نعت المغذمر. واللام صلة هضام» [@ibn-al-anbari، ص592]؛ أي «لِحُقُوقِهَا» متعلق بـ«هَضَّامُهَا»، واللام تقوّي عمل اسم الفاعل. وجعلها الزَّوْزَنِيّ للتعليل: «أي لأجل حقوقها» [@zawzani، ص199]."
  - "والهاء في «هَضَّامُهَا» تحتمل وجهين عند الزَّوْزَنِيّ: «يجوز أن تكون عائدة على العشيرة»، «ويجوز أن تكون عائدة على الحقوق» [@zawzani، ص200]."
morphology:
  - "«مُقَسِّم» اسم فاعل من «قسّم» على «فعّل» للتكثير."
  - "«مُغَذْمِر» اسم فاعل من الرباعي المجرد «غذمر» على «مُفَعْلِل»، ويروى «ومغثمر» بالثاء بالمعنى نفسه [@ibn-al-anbari، ص592]."
  - "«هَضّام» على «فعّال» للمبالغة، من «هضم» إذا كسر، «ومن ثمة قيل رجل هضوم الشتاء، أي يكسر ما له في الشتاء» [@ibn-al-anbari، ص592]."
  - "«حُقُوق» جمع «حقّ» على «فُعُول»."
rhetoric:
  thesis: "صورة السيد العادل الجواد: يعطي الناس حقوقهم، ثم يعطيهم من حقه."
  devices:
    - title: "المقابلة"
      text: "«يُعْطِي الْعَشِيرَةَ حَقَّهَا» و«لِحُقُوقِهَا هَضَّامُهَا»: الأولى عدل يعطي به الواجب، والثانية فضل يكسر به من حق نفسه. ويقرنه أبو جَعْفَر بقول عنترة: «يُخْبِرْكِ مَنْ شَهِدَ الْوَقِيعَةَ أَنَّنِي ... أَغْشَى الْوَغَى وَأَعِفُّ عِنْدَ الْمَغْنَمِ» [@ibn-al-anbari، ص592]. والمقابلة: أن يُؤتى بمعنيين ثم بما يقابلهما."
    - title: "صيغ المبالغة"
      text: "«مُقَسِّمٌ» و«مُغَذْمِرٌ» و«هَضَّامُهَا»: ثلاثة أوصاف كلها للكثرة والتكرار، فهذه أفعال دائمة فيه لا مرة واحدة. وهذه قراءتنا."
    - title: "حذف الموصوف"
      text: "لم يسمّ هذا السيد، بل ذكر صفاته وحدها، فكأن كل سيد من قومه يصدق عليه الوصف."
  connection: "ثم يبيّن أن ذلك كله «فَضْلًا»: تفضّلًا لا إلزامًا، ويذكر كريمًا آخر من قومه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَمُقَسْسِمُنْ / يُعْطِلْ عَشِي / رَةَ حَقْقَهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — وَمُغَذْمِرُنْ / لِحُقُوقِهَا / هَضْضَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثانية من الصدر، والثالثة من العَجُز."
context: "ثاني أبيات الفخر بالقوم، يعدّد فيه صفات السيد الذي لا يخلو منه مجمع. والكلمة الأولى من البيت التالي، «فَضْلًا»، متعلقة بهذا البيت في المعنى."
variants:
  - reading: "يُعْطِي الْعَشِيرَةَ حَقَّهَا وَحَقِيقَهَا"
    status: "رواية الأَصْمَعِيّ"
    note: "«ورواه الأصمعي: (يعطى العشيرة حقها وحقيقها ومغذمر) . حقها: ما يحق عليه أن يحميه» [@ibn-al-anbari، ص592]؛ فالصدر عنده بلا «وَمُقَسِّمٌ»."
  - reading: "وَمُغَثْمِرٌ لِحُقُوقِهَا هَضَّامُهَا"
    status: "رواية أخرى"
    note: "بالثاء، ومعناه كمعنى المغذمر [@ibn-al-anbari، ص592]."
