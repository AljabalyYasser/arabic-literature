first: "حَتَّى إِذَا أَلْقَتْ يَدًا فِي كَافِرٍ"
second: "وَأَجَنَّ عَوْرَاتِ الثُّغُورِ ظَلَامُهَا"
meaning: "وبقيتُ على مرقبي حتى بدأت الشمس تغيب في الليل، وستر ظلامُه المواضع التي يُخاف أن يأتي العدو منها. قال الزَّوْزَنِيّ في تحرير معناه: «حتى إذا غربت الشمس وأظلم ليلها» [@zawzani، ص195]."
vocabulary:
  - term: "أَلْقَتْ يَدًا"
    text: "«بدأت في المغيب. ومن ذلك يقال: وضع فلان يده في كذا وكذا، إذا بدا فيه» [@ibn-al-anbari، ص581]. والفاعل الشمس، ولم يُذكر اسمها."
  - term: "كَافِرٍ"
    text: "«الليل؛ لتغطيته الأشياء بظلمته» [@ibn-al-anbari، ص581]. وفي اللسان: «الكَفْرُ، بالفتح: التغطية» [@lisan، ج5 ص147]."
  - term: "أَجَنَّ"
    text: "«ستر» [@ibn-al-anbari، ص581]."
  - term: "عَوْرَاتِ الثُّغُورِ"
    text: "«المواضع التي تأتي المخافة منها» [@ibn-al-anbari، ص582]. والثغر عند الزَّوْزَنِيّ «موضع المخافة والجمع الثغور، وعورته أشده مخافة» [@zawzani، ص195]."
syntax:
  - "«حَتَّى» ابتدائية تفيد الغاية، و«إِذَا» ظرف شرطي، وجوابه في أول البيت التالي: «أَسْهَلْتُ»."
  - "فاعل «أَلْقَتْ» ضمير الشمس، «أضمرها ولم يذكرها» [@ibn-al-anbari، ص581]. وحكى ابن الأَنْبارِيّ قولًا آخر أن الضمير للناقة، ثم قال: «والذي عليه أكثر أهل العلم أن الإلقاء للشمس، وإنه كنى عن غير مذكور، لبيان المعنى» [@ibn-al-anbari، ص582]."
  - "«ظَلَامُهَا» فاعل «أَجَنَّ»، و«عَوْرَاتِ» مفعوله منصوب بالكسرة. والضمير في «ظلامها» يعود عند الزَّوْزَنِيّ على العورات [@zawzani، ص195]."
morphology:
  - "«أَجَنَّ» على «أفعل» من «جنّ». قال ابن الأَنْبارِيّ: «إذا قالوا أجن لم يأتوا بعلى، وإذا قالوا جن أدخلوا على» [@ibn-al-anbari، ص581]، فيقال: أجنّه الليل، وجنّ عليه الليل."
  - "«عَوْرات» جمع «عَوْرة»، و«العورات حكمها أن تجمع بفتح الواو»، لكنها أُسكنت «كراهة أن تحرك إلى الفتح وقبلها فتحة فتصير الواو ألفا»، «ومن العرب من يفتح الواو فيقول عورة وعورات... والأولى أكثر» [@ibn-al-anbari، ص582]."
  - "«كافِر» اسم فاعل من «كَفَر» بمعنى ستر، سُمّي به الليل لأنه يستر الأشياء."
rhetoric:
  thesis: "مشهد الغروب في نصف بيت: يد تُلقى في الظلمة، ثم ظلام يستر الثغور. والحارس لا ينزل إلا حين لا يبقى ما يُرى."
  devices:
    - title: "الاستعارة: يد للشمس"
      text: "«أَلْقَتْ يَدًا»: «وليس للثريا يد وليس للشمس يد» [@ibn-al-anbari، ص581]. وهذا عند عبد القاهر الجُرْجانيّ الضرب الثاني من الاستعارة، الذي تجعل فيه «للشيء الشيء ليس له»، كما جعل لبيد للشمال يدًا في بيته الآخر [@dalail، ص67]. وليس في الشمس شيء تشير إليه فتقول هو «اليد»؛ وعبد القاهر يقول في «يد الشمال»: «وليس لك شيء من ذلك في بيت لبيد، بل ليس أكثر من أن تخيّل إلى نفسك» [@asrar، ص46]، والحكم في «يد الشمس» واحد. والاستعارة: أن تعطي الشيء اسم غيره أو صفته لشبه بينهما."
    - title: "الإضمار"
      text: "لم يذكر الشمس قط، وترك السامع يعرفها من «أَلْقَتْ يَدًا فِي كَافِرٍ». ويضعه أبو هلال العَسْكَرِيّ في «الصِّناعتين» في باب الحذف: «ومن الحذف أن تضمر غير مذكور»، ويستشهد له بهذا البيت: «يعنى الشمس تبدأ فى المغيب» [@sinaatayn، ص184–185]."
    - title: "الأخذ"
      text: "قال ابن الأَنْبارِيّ: «وأخذه لبيد من ثعلبة بن صعير، جاهلي قديم أقدم من جد لبيد» في قوله: «فَتَذَكَّرَا ثَقَلًا رَثِيدًا بَعْدَمَا ... أَلْقَتْ ذُكَاءُ يَمِينَهَا فِي كَافِرِ»، وذُكاء: الشمس [@ibn-al-anbari، ص581]. وفي اللسان: «وذكر ابن السكيت أن لبيدا سرق هذا المعنى» [@lisan، ج5 ص147]. وأخذه منه ذو الرُّمَّة: «وَأَيْدِي الثُّرَيَّا جُنَّحٌ فِي الْمَغَارِبِ» [@ibn-al-anbari، ص581]. أما ابن قُتَيْبة فأورد بيت لبيد أولًا ثم بيت ثَعْلَبة، بعد أن ذكر معنى أخذه الشعراء من لبيد [@ibn-qutayba، ج1 ص276–277]، فكأنه يجعل لبيدًا السابق؛ ويقول محققه أحمد شاكر: «وقد أخطأ ابن قتيبة هنا جدّا، فإن ثعلبة جاهلى قديم» [@ibn-qutayba، ج1 ص277]."
  connection: "وجواب «حتى إذا» في البيت التالي: نزل إلى السهل، فانتصبت فرسه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "حَتْتَى إِذَا / أَلْقَتْ يَدَنْ / فِي كَافِرِنْ = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — وَأَجَنْنَ عَوْ / رَاتِثْ ثُغُو / رِ ظَلَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في تفعيلات الصدر الثلاث، والثانية من العَجُز."
context: "ينتهي يوم الحارس بالغروب. والبيت معلّق بما بعده، فجواب «إذا» في أول البيت 66، وهو ما يسميه ابن رَشِيق التضمين: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
