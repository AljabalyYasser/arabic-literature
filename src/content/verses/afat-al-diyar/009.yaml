first: "أَوْ رَجْعُ وَاشِمَةٍ أُسِفَّ نَؤُورُهَا"
second: "كِفَفًا تَعَرَّضَ فَوْقَهُنَّ وِشَامُهَا"
meaning: "أو كأن الأطلال وقد ظهرت بعد السيل وشمٌ أعادت الواشمة نقشه، فذرّت الكحل الأسود في دوائره فبان خطّه فوقها. قال الزَّوْزَنِيّ: «فجعل إظهار السيل الأطلال كإظهار الواشمة الوشم، وجعل دروسها كدروس الوشم» [@zawzani، ص175]."
vocabulary:
  - term: "رَجْعُ وَاشِمَةٍ"
    text: "الرَّجْع: «معناه ردها النقش» [@ibn-al-anbari، ص527]، وعند الزَّوْزَنِيّ: «الترديد والتجديد» [@zawzani، ص175]. «والواشمة: التي تشم يديها تضربهما بالإبرة ثم تحشوهما النؤور» [@ibn-al-anbari، ص527]."
  - term: "أُسِفَّ"
    text: "«الإسفاف الإقماح» [@ibn-al-anbari، ص527]، أي الذرّ في الجرح، وعند الزَّوْزَنِيّ: «الإسفاف: الذَّرّ» [@zawzani، ص175]."
  - term: "نَؤُورُهَا"
    text: "النَّؤُور: «حصاة مثل الإثمد تدق فتسفه اللثة واليد فتسودهما»، «وقال بعضهم: النؤور شحم يحرق ثم يكب عليه إناء ثم يؤخذ من دخانه من الإناء» [@ibn-al-anbari، ص527]. وفي لسان العرب عن أبي منصور الأَزْهَرِيّ: «أَمَّا الْكُحْلُ فَمَا سَمِعْتُ أَن نِسَاءَ الْعَرَبِ اكْتَحَلْنَ بالنَّؤُورِ، وأَما الْوَشْمُ بِهِ فَقَدْ جَاءَ فِي أَشعارهم» [@lisan، ج5 ص244]."
  - term: "كِفَفًا"
    text: "«وواحدة الكفف الكفة، وهي كل دارة وحلقة» [@ibn-al-anbari، ص527]."
  - term: "تَعَرَّضَ ... وِشَامُهَا"
    text: "الوِشام: «جمع الوشم» [@ibn-al-anbari، ص528]. وفي «تَعَرَّضَ» قولان: «اخذ يمينا وشمالا ولم يقصد» [@ibn-al-anbari، ص527]، أي امتدّت خطوطه معترضة، وعند الزَّوْزَنِيّ: «تعرَّض وأعرض: ظهر ولاح» [@zawzani، ص175]."
syntax:
  - "«رَجْعُ» مرفوع بالعطف على «زُبُرٌ» في البيت السابق، فهو خبر ثانٍ لـ«كأنّ»: كأنها زبر أو رجعُ واشمة."
  - "«نئورها: اسم ما لم يسم فاعله. وكففًا هو المفعول الثاني بقي على انتصابه بعد إسناد الفعل إلى المفعول» [@zawzani، ص175]: فـ«أُسِفَّ» يتعدى إلى مفعولين، فلما بُني للمجهول صار أولهما «نَؤُورُهَا» نائب فاعل وبقي «كِفَفًا» منصوبًا."
  - "«وشامها: فاعل تعرض وقد أضيف إلى ضمير الواشمة» [@zawzani، ص175]، و«فَوْقَهُنَّ» ظرف، والضمير للكِفَف."
morphology:
  - "«رَجْع» مصدر «رجع» المتعدي: رجعته أرجعه رجعًا [@zawzani، ص175]."
  - "«أُسِفَّ» ماضٍ مبني للمجهول من «أسفّ» على «أفعل»، يقال: «أسففت الدواء الجرح والكحل العين» [@zawzani، ص175]."
  - "«كِفَف» جمع «كِفّة» بكسر الكاف، «وكل شيء مستدير كفة، بكسر الكاف»، «وكل مستطيل كُفة، بضمها» [@zawzani، ص175]. و«وِشَام» جمع «وَشْم» على «فِعال»."
rhetoric:
  thesis: "تشبيه ثانٍ للصورة نفسها: كما تعيد الأقلام الكتاب، تعيد الواشمة الوشم في اليد. والوشم أقرب إلى الجسد: كأن الأرض جلد امرأة عاد إليه نقشه."
  devices:
    - title: "تعدّد التشبيه للشيء الواحد"
      text: "عطف بـ«أَوْ» تشبيهًا على تشبيه: الأطلال كتب جُدّدت، أو وشم أُعيد. فالحرف «أَوْ» يجعل السامع يختار بين صورتين، وكلتاهما للظهور بعد الدروس."
    - title: "تشبيه الطلل بالوشم"
      text: "تشبيه آثار الديار بالوشم من صور الأطلال المعروفة، وقد مرّ عند طَرَفَة: «تَلُوحُ كَبَاقِي الْوَشْمِ فِي ظَاهِرِ الْيَدِ». لكن لَبِيد يختار لحظة تجديد الوشم لا بقاياه: «رَجْعُ وَاشِمَةٍ»، أي الوشم وقد أُعيد."
  connection: "ثم يقف بها يسألها، ويعرف أن الحجارة لا تجيب [@ibn-al-anbari، ص528]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَوْ رَجْعُ وَا / شِمَةِنْ أُسِفْ / فَ نَؤُورُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن — كِفَفَنْ تَعَرْ / رَضَ فَوْقَهُنْ / نَ وِشَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من الصدر، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "تمام صورة الأطلال بعد السيل، وهو آخر تشبيهات المطلع قبل أن يقف الشاعر بالديار ويسألها."
