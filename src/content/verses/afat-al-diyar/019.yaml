first: "فَصُوَائِقٌ إِنْ أَيْمَنَتْ فَمَظِنَّةٌ"
second: "مِنْهَا وِحَافُ الْقَهْرِ أَوْ طِلْخَامُهَا"
meaning: "ثم تنزل بصُوائِق، فإن اتجهت نحو اليمن فالموضع الذي يُظنّ أن تكون فيه وِحاف القَهْر أو طِلْخام. قال الزَّوْزَنِيّ: «وتلخيص المعنى: أنها إن أتت اليمن حلت بوحاف القهر أو طلخام من صوائق» [@zawzani، ص179]."
vocabulary:
  - term: "صُوَائِقٌ"
    text: "«موضع» [@ibn-al-anbari، ص535]، وعند الزَّوْزَنِيّ: «موضع معروف» [@zawzani، ص179]."
  - term: "أَيْمَنَتْ"
    text: "«أخذت نحو اليمن» [@ibn-al-anbari، ص535]. ونقل ابن الأَنْبارِيّ عن يعقوب بن السِّكِّيت: «يقال أيمن الرجل ويامن، إذا أخذ نحو اليمن؛ وأشأم، إذا أتى الشام؛ وأعرق، إذا أتى العراق؛ وأنجد، إذا أتى نجدا» [@ibn-al-anbari، ص535]."
  - term: "مَظِنَّةٌ"
    text: "«مظنّة الشيء: حيث يظن كونه فيه، وهو من الظن، بالظاء» [@zawzani، ص179]. وعند ابن الأَنْبارِيّ: «أي موضعها الذي تظن فيه وتعرف وتطلب» [@ibn-al-anbari، ص536]."
  - term: "وِحَافُ الْقَهْرِ"
    text: "«موضع» [@ibn-al-anbari، ص536]. وقال أبو جَعْفَر: «الوحاف: إكام صغار إلى جانب» القهر [@ibn-al-anbari، ص536]، «والقهر: جبل» [@ibn-al-anbari، ص537]. والإكام: التلال الصغيرة."
  - term: "طِلْخَامُهَا"
    text: "«موضع معروف أيضًا» [@zawzani، ص179]. وفي لسان العرب: «وَقَالَ الْخَلِيلُ: هُوَ بِالْخَاءِ الْمُعْجَمَةِ أرضٌ، وَقِيلَ: اسمُ وادٍ» [@lisan، ج12 ص369]."
syntax:
  - "«والصوائق نسق على فردة» [@ibn-al-anbari، ص537]: فـ«صُوَائِقٌ» معطوف على «فَرْدَةٌ» في البيت السابق، فهو فاعل ثالث لـ«تَضَمَّنَتْهَا»."
  - "«إِنْ أَيْمَنَتْ» شرط، وجوابه الجملة المقرونة بالفاء: «فَمَظِنَّةٌ مِنْهَا وِحَافُ الْقَهْرِ». «ومظنة رفع بوحاف» [@ibn-al-anbari، ص537]، أي هما مبتدأ وخبر، و«مِنْهَا» متعلق بـ«مَظِنَّةٌ»."
  - "«أَوْ طِلْخَامُهَا» معطوف على «وِحَافُ»، والضمير في «طِلْخَامُهَا» لصُوائِق، فالموضعان عند الزَّوْزَنِيّ «خاصان بالإضافة إلى صوائق» [@zawzani، ص179]، أي هما من نواحيها."
morphology:
  - "«أَيْمَنَ» على «أفعل» بمعنى أتى اليمن، وهو باب واسع في أسماء البلاد: أشأم وأعرق وأنجد [@ibn-al-anbari، ص535]."
  - "«مَظِنَّة» على «مَفْعِلة» من الظن، اسم للمكان الذي يُظن فيه الشيء: «يقال: اطلب العلوم من مظانها» [@ibn-al-anbari، ص536]."
  - "«وِحَاف» جمع، «وواحد الوحاف وحفة ووحف» [@ibn-al-anbari، ص537]."
rhetoric:
  thesis: "آخر أبيات منازل نَوار: يتبعها الشاعر بالظن حتى نحو اليمن. لا يعرف مكانها، بل يعرف مظانّها."
  devices:
    - title: "الظن مكان اليقين"
      text: "اختار «مَظِنَّةٌ»، أي الموضع الذي يُظن أن تكون فيه، ولم يقل: منزلها. فالشاعر يتتبع امرأة لا يراها، ويقيس مواضعها بالتخمين. وهذا ختام مناسب لأبيات بدأت بسؤال «مَا تَذَكَّرُ»."
    - title: "الشرط"
      text: "«إِنْ أَيْمَنَتْ» يجعل منازلها احتمالات: إن اتجهت إلى اليمن فهي هنا. وفي الأبيات 17–19 تسعة أسماء مواضع: فَيْد، والحجاز، والجبلان، ومُحَجَّر، وفَرْدة، ورُخام، وصُوائِق، ووِحاف القَهْر، وطِلْخام. وكثرتها تقول ما قاله الشاعر صريحًا في البيت 17: «فَأَيْنَ مِنْكَ مَرَامُهَا». وهذه قراءتنا."
  connection: "ثم ينصرف عن نَوار إلى نفسه: فاقطع حاجتك ممن تغيّر وصله [@ibn-al-anbari، ص537]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَصُوَائِقُنْ / إِنْ أَيْمَنَتْ / فَمَظِنْنَةُنْ = متَفاعلن / مُتْفاعلن / متَفاعلن — مِنْهَا وِحَا / فُلْ قَهْرِ أَوْ / طِلْخَامُهَا = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر، والتفعيلات الثلاث كلها في العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وجاءت «صُوَائِقٌ» منوّنة، وبالتنوين يستقيم الوزن."
context: "آخر أبيات نَوار وبُعد ديارها (16–19). بعده يقطع الشاعر الحديث عنها، ويبدأ بيتي «قطع اللبانة»."
