first: "عَلِهَتْ تَرَدَّدُ فِي نِهَاءِ صُعَائِدٍ"
second: "سَبْعًا تُؤَامًا كَامِلًا أَيَّامُهَا"
meaning: "جزعت حتى طاش عقلها، فهي تتردد بين غدران «صُعائِد» سبع ليال بأيامها كاملة، تطلب ولدها. قال الزَّوْزَنِيّ: «أي ترددت في طلب ولدها سبع ليال بأيامها، وجعل أيامها كاملة إشارة إلى أنها كانت من أيام الصيف وشهور الحر» [@zawzani، ص189]."
vocabulary:
  - term: "عَلِهَتْ"
    text: "«العله: خفة من جزع» [@ibn-al-anbari، ص563]، «ويقال العله والوله: ذهاب العقل» [@ibn-al-anbari، ص563]. وفي اللسان: «والعَلِهُ: الَّذِي يتَرَدَّدُ مُتَحَيِّرًا» [@lisan، ج13 ص518]."
  - term: "نِهَاءِ"
    text: "«جمع نِهْى ونَهْى، وهو المكان له حاجز ينهى الماء أن يفيض» [@ibn-al-anbari، ص563]، وعند الزَّوْزَنِيّ «وهما الغدير» [@zawzani، ص189]."
  - term: "صُعَائِدٍ"
    text: "موضع بعينه [@ibn-al-anbari، ص563]. وفي اللسان: «وصُعادى وصُعائدُ: مَوْضِعَانِ» [@lisan، ج3 ص256]. وضبطه الزَّوْزَنِيّ والديوان بفتح الصاد [@zawzani، ص189] [@diwan-labid، ص310]."
  - term: "تُؤَامًا"
    text: "«معناه سبع ليال بأيامهن. والتوأمان: الاثنان، والجمع توائم وتؤام» [@ibn-al-anbari، ص563]، أي كل ليلة مع يومها توأمان."
syntax:
  - "«وتردد موضعه نصب في التأويل، على معنى علهت مترددة. والأيام رفع بكامل» [@ibn-al-anbari، ص564]: أي جملة «تَرَدَّدُ» حال من فاعل «عَلِهَتْ»، و«أَيَّامُهَا» فاعل «كَامِلًا» لأنه اسم فاعل."
  - "«سَبْعًا» ظرف زمان أي سبع ليال، و«تُؤَامًا» نعت له، و«كَامِلًا» نعت ثانٍ. و«فِي نِهَاءِ» متعلق بـ«تَرَدَّدُ»."
morphology:
  - "«تَرَدَّدُ» أصله «تَتَرَدَّدُ» على «تتفعّل»، حُذفت إحدى التاءين تخفيفًا."
  - "«نِهَاء» عند أكثرهم جمع «نِهْي» على «فِعال»، وقال ابن الأَنْبارِيّ برأي آخر: «والنهاء عندى جمع أنه، كما تقول عبد وأعبد، والعباد جمع الأعبد» [@ibn-al-anbari، ص563]، فهو عنده جمع الجمع."
  - "«تُؤَام» جمع «تَوْأَم» على «فُعال» [@zawzani، ص189]."
  - "«عَلِهَتْ» على «فَعِلَت» بكسر العين، وهو بناء كثير في الانفعالات كفَرِح وجَزِع: «يقال عله الرجل يعله علها» [@ibn-al-anbari، ص563]."
rhetoric:
  thesis: "سبعة أيام بلياليها: العدد يحوّل الحزن إلى زمن يُحسب يومًا بعد يوم. والبقرة لا تغادر المكان، تأخذ فيه شقًا ثم شقًا."
  devices:
    - title: "الإطناب في الزمن"
      text: "«سَبْعًا تُؤَامًا كَامِلًا أَيَّامُهَا»: ثلاثة أوصاف لمدة واحدة؛ «سبعًا»، ثم «تُؤامًا» أي الليلة مع يومها، ثم «كاملًا أيامها». والإطناب: زيادة اللفظ على أصل المعنى لفائدة، والفائدة هنا أن يحسّ السامع طول المدة. وهذه قراءتنا."
    - title: "اختيار الكلمة"
      text: "«عَلِهَتْ»: لم يقل حزنت أو جزعت، بل اختار كلمة تجمع الجزع والحيرة وذهاب العقل، ففسّر بها الحركة التي بعدها: التردد بلا وجهة."
  connection: "ثم تيأس، ويجفّ ضرعها لا من رضاع ولا فطام، بل من الحزن."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "عَلِهَتْ تَرَدْ / دَدُ فِي نِهَا / ءِ صُعَائِدِنْ = متَفاعلن / متَفاعلن / متَفاعلن — سَبْعَنْ تُؤَا / مَنْ كَامِلَنْ / أَيْيَامُهَا = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "سلم الصدر من الزحاف، ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، تفعيلات العجز الثلاث."
context: "الثاني من أبيات الصباح والرماة والكلاب (44–52). سبعة أيام تفصل الصباح الأول عن اليأس في البيت التالي."
variants:
  - reading: "عَلِهَتْ تَلَدَّدُ فِي شَقَائِقِ عَالِجٍ ... سِتًّا بِهِ حَتَّى وَفَتْ أَيَّامُهَا"
    status: "رواية الأَصْمَعِيّ"
    note: "«ورواه الأصمعي» [@ibn-al-anbari، ص563] بهذا اللفظ، و«تلدد: تردد. يقال فلان يتلدد، إذا كان يأخذ مرة في شق ومرة في شق آخر» [@ibn-al-anbari، ص563]."
  - reading: "عَلِهَتْ تَبَلَّدُ فِي نِهَاءِ صُعَائِدٍ"
    status: "رواية اللسان"
    note: "وهي عند صاحب اللسان «وَالرِّوَايَةُ الْمَعْرُوفَةُ: عَلِهَتْ تَبَلَّدُ» [@lisan، ج13 ص477]، وبها يستشهد في «عله» [@lisan، ج13 ص518]. ويذكرها الزَّوْزَنِيّ: «ويروى تبلد، أي: تتحير وتتعمه» [@zawzani، ص189]."
  - reading: "عَلِقَتْ تَبَلَّلُ فِي نِهَاءِ صُعَائِدٍ"
    status: "رواية أخرى"
    note: "«فمعنى علقت جعلت» [@ibn-al-anbari، ص563]، «والتبليل: لزوم الأمر والدوام عليه» [@ibn-al-anbari، ص563]."
