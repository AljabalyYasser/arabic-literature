first: "فَضْلًا وَذُو كَرَمٍ يُعِينُ عَلَى النَّدَى"
second: "سَمْحٌ كَسُوبُ رَغَائِبٍ غَنَّامُهَا"
meaning: "يفعل ذلك تفضّلًا ورغبة في الفضل، لا لأنه ملزم به. ومنّا كريم يعين قومه على الجود، سهل الخلق، يكسب الأشياء النفيسة ويغنمها. قال ابن الأَنْبارِيّ: «معناه يفعل ذلك رغبة في الفضل» [@ibn-al-anbari، ص593]. وقال الزَّوْزَنِيّ: «يقول: يفعل ما سبق ذكره تفضلًا ولم يزل منا كريم يعين أصحابه على الكرم، أي يعطيهم ما يعطون، جواد يكسب رغائب المعالي ويغتنمها» [@zawzani، ص200]."
vocabulary:
  - term: "فَضْلًا"
    text: "تفضّلًا، أي زيادة على الواجب. وفي اللسان: «الفَضْل والفَضِيلة مَعْرُوفٌ: ضدُّ النَّقْص والنَّقِيصة» [@lisan، ج11 ص524]."
  - term: "النَّدَى"
    text: "«الندى: الجود» [@zawzani، ص200]."
  - term: "سَمْحٌ"
    text: "«والسمح: السهل الأخلاق» [@tabrizi-ashr، ص173]."
  - term: "رَغَائِبٍ"
    text: "«الرغائب: جمع الرغيبة وهي ما رغب فيه من علق نفيس أو خصلة شريفة أو غيرهما» [@zawzani، ص200]، والعِلْق: الشيء النفيس. وعند ابن الأَنْبارِيّ: «الكثير من المال» [@ibn-al-anbari، ص593]. وفي اللسان: «والرَّغيبةُ: الأَمرُ المَرْغوبُ فِيهِ» [@lisan، ج1 ص423]."
  - term: "غَنَّامُهَا"
    text: "«الغنّام: مبالغة الغانم» [@zawzani، ص200]، أي «يغنمها ويصيبها» [@ibn-al-anbari، ص593]."
syntax:
  - "«فَضْلًا» منصوب مفعولًا لأجله، والعامل فيه ما في البيت السابق من القسمة والهضم، أي يفعل ذلك «رغبة في الفضل» كما فسّره ابن الأَنْبارِيّ. ويجوز أن يكون مفعولًا مطلقًا، أي يتفضّل فضلًا، وهو ظاهر تفسير الزَّوْزَنِيّ بقوله «تفضلًا»."
  - "«وَذُو كَرَمٍ» فيه ثلاثة أقوال: «وذو كرم نسق على لزاز عظيمة. وقال بعضهم: معناه وفينا ذو كرم. وقال آخرون: معناه: وهو ذو كرم» [@ibn-al-anbari، ص593]."
  - "«يُعِينُ عَلَى النَّدَى» جملة نعت لـ«ذُو كَرَمٍ». و«سَمْحٌ» و«كَسُوبُ رَغَائِبٍ» و«غَنَّامُهَا» نعوت أخرى، أو أخبار لمبتدأ محذوف تقديره «هو»، والهاء في «غَنَّامُهَا» للرغائب."
morphology:
  - "«كَسُوب» على «فَعُول»، و«غَنّام» على «فعّال»، وكلاهما من صيغ المبالغة."
  - "«رَغائِب» جمع «رغيبة» على «فعائل»، وهو ممنوع من الصرف، لكنه نُوّن هنا لإقامة الوزن، كما نُوّن «رَوَاسِيًا» في البيت 71."
  - "«سَمْح» صفة مشبهة على «فَعْل». و«النَّدَى» مصدر، «والفعل ندي يندى ندىً، ورجل ند» [@zawzani، ص200]."
rhetoric:
  thesis: "يكمل صورة السيد: بعد العدل يأتي الفضل، وبعد البذل يأتي الكسب الذي يعين على البذل."
  devices:
    - title: "كلمة تفسّر ما قبلها"
      text: "«فَضْلًا»: كلمة واحدة في أول البيت تفسّر كل ما سبق، فالقسمة والهضم لم يكونا عن إلزام بل عن رغبة في الفضل. وهي متعلقة بالبيت السابق، وهو ما يسميه ابن رَشِيق التضمين: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
    - title: "الكسب للبذل"
      text: "«يُعِينُ عَلَى النَّدَى» و«كَسُوبُ رَغَائِبٍ»: يكسب ليبذل. وفسّر بعضهم الرغائب بالمحامد: «معناه يكسب الرغائب من المحامد ويغتنمها لكي يذكر بالمحامد» [@ibn-al-anbari، ص593]، وفسّرها التِّبْرِيزِيّ بالغنائم: «أي يغنمها من أعدائه» [@tabrizi-ashr، ص173]."
    - title: "تتابع الصفات"
      text: "«سَمْحٌ كَسُوبُ رَغَائِبٍ غَنَّامُهَا»: ثلاث صفات متتابعة بلا عاطف، فتتلاحق كأنها تُعدّ عدًّا. وهذه قراءتنا."
  connection: "ثم يرجع هذه الخصال كلها إلى أصل واحد: آباء سنّوها لهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَضْلَنْ وَذُو / كَرَمِنْ يُعِي / نُ عَلَنْنَدَى = مُتْفاعلن / متَفاعلن / متَفاعلن — سَمْحُنْ كَسُو / بُ رَغَائِبِنْ / غَنْنَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز. وتنوين «رَغَائِبٍ» يقيم الوزن، ولو مُنع من الصرف لاجتمعت ثلاثة متحركات قصيرة."
context: "ثالث أبيات الفخر بالقوم. والبيتان 79–80 يعدّان رجلين أو صفتين: المقسم المغذمر، وذو الكرم الكسوب."
