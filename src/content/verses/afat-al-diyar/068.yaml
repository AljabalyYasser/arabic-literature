first: "قَلِقَتْ رِحَالَتُهَا وَأَسْبَلَ نَحْرُهَا"
second: "وَابْتَلَّ مِنْ زَبَدِ الْحَمِيمِ حِزَامُهَا"
meaning: "اضطرب سرجها على ظهرها من سرعتها، وسال العرق على نحرها، وابتلّ حزامها من زبد عرقها. قال الزَّوْزَنِيّ: «اضطربت رحالتها على ظهرها من إسراعها في عدوها ومطر نحرها عرقًا وابتل حزامها من زبد عرقها» [@zawzani، ص196]."
vocabulary:
  - term: "قَلِقَتْ"
    text: "«القلق: سرعة الحركة» [@zawzani، ص196]، أي اضطربت."
  - term: "رِحَالَتُهَا"
    text: "«سرج كان يعمل من جلود الشاء بأصوافها، يتخذ للجري الشديد» [@ibn-al-anbari، ص584]. وقال بعض أهل اللغة: «الرحالة: شبيه بالسرج»، لا قَرَبُوس لها ولا مؤخِّرة [@ibn-al-anbari، ص584]، و«القَرَبُوس: حِنْوُ السَّرْج» [@lisan، ج6 ص172]، أي خشبه المحنيّ في مقدَّمه."
  - term: "أَسْبَلَ"
    text: "«سال» [@ibn-al-anbari، ص584]، وعند الزَّوْزَنِيّ «أمطر» [@zawzani، ص196]."
  - term: "الْحَمِيمِ"
    text: "«العرق. والحميم أيضا: الماء الحار في غير هذا. والحميم أيضا: القريب» [@ibn-al-anbari، ص584]."
  - term: "حِزَامُهَا"
    text: "ما يُشدّ به السرج تحت بطن الفرس، و«أكثر ما يقال الحزام للسرج» [@lisan، ج4 ص448]."
syntax:
  - "«قَلِقَتْ» جواب «إذا» في البيت السابق: «وقلقت جواب حتى إذا» [@ibn-al-anbari، ص584]. و«رِحَالَتُهَا» فاعله."
  - "«وَأَسْبَلَ نَحْرُهَا» و«وَابْتَلَّ ... حِزَامُهَا» جملتان معطوفتان على «قلقت»، داخلتان في الجواب."
  - "«مِنْ زَبَدِ الْحَمِيمِ» متعلق بـ«ابْتَلَّ»، و«مِن» للسببية أو لابتداء الغاية."
morphology:
  - "«رِحالة» على «فِعالة»، وجمعها «الرحائل» [@zawzani، ص196]."
  - "«ابْتَلَّ» على «افتعل» من «بلّ»، للمطاوعة: بلّه العرق فابتلّ."
  - "«الحَمِيم» على «فَعِيل» من «حمّ» إذا سخن، ومنه «الحميم: العرق. واستحمّ الرجل: عرق» [@lisan، ج12 ص155]."
rhetoric:
  thesis: "بيت الحصيلة: كل ما في الفرس يشهد بسرعتها، السرج والنحر والحزام."
  devices:
    - title: "تعداد الآثار"
      text: "ثلاث جمل متتابعة، لكل جزء من الفرس أثره: «قَلِقَتْ رِحَالَتُهَا»، «وَأَسْبَلَ نَحْرُهَا»، «وَابْتَلَّ ... حِزَامُهَا». فلبيد لا يصف السرعة نفسها، بل يصف علاماتها."
    - title: "الاحتراس"
      text: "قال ابن الأَنْبارِيّ: «يقول: أسرعت فقلقت رحالتها، وليس ذلك من ضمر» [@ibn-al-anbari، ص584]. فاضطراب السرج قد يُظنّ من هزال الفرس، والسياق ينفي ذلك: السرج يضطرب لأنها تعدو، لا لأنها ضامرة. والاحتراس: أن يُدفع عن الكلام ما قد يُتوهّم فيه."
    - title: "الاستعارة في «أسبل»"
      text: "«أَسْبَلَ نَحْرُهَا»: الإسبال في أصله للمطر والدمع، وفسّره الزَّوْزَنِيّ بـ«أمطر» [@zawzani، ص196]، فكأن نحر الفرس سحابة تمطر عرقًا. والاستعارة: أن تعطي الشيء اسم غيره أو صفته لشبه بينهما."
  connection: "ثم يصف عنقها في العنان وسرعتها كسرعة القطاة إلى الماء."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "قَلِقَتْ رِحَا / لَتُهَا وَأَسْ / بَلَ نَحْرُهَا = متَفاعلن / متَفاعلن / متَفاعلن — وَبْتَلْلَ مِنْ / زَبَدِلْ حَمِي / مِ حِزَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "جاءت تفعيلات الصدر الثلاث تامة «متَفاعلن». ودخل الإضمار، وهو تسكين الثاني المتحرك [@atiq، ص59]، التفعيلة الأولى من العَجُز، وسقطت فيها همزة الوصل من «ابْتَلَّ» فاتصلت الواو بالباء."
context: "ثالث أبيات العدو، ونهاية الجملة التي بدأت بـ«حتى إذا سخنت» في البيت 67."
