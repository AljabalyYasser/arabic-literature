first: "فَعَلَوْتُ مُرْتَقِبًا عَلَى ذِي هَبْوَةٍ"
second: "حَرِجٍ إِلَى أَعْلَامِهِنَّ قَتَامُهَا"
meaning: "فصعدتُ أرقب أصحابي وأحرسهم، على مكان عالٍ يثور فيه الغبار، وقد لزم غبارُه أعلام الجبال فلا يفارقها. قال الزَّوْزَنِيّ: «أي كنت ربيئة لهم على ذي هبوة، أي على جبل ذي هبوة»، وهو جبل «قريب من جبال الأعداء ومن راياتهم» [@zawzani، ص195]."
vocabulary:
  - term: "مُرْتَقِبًا"
    text: "«معناه يرقب أصحابه» [@ibn-al-anbari، ص580]، أي يحرسهم وينظر لهم."
  - term: "هَبْوَةٍ"
    text: "«الهبوة والإهباء: الغبرة وإثارة الغبار» [@ibn-al-anbari، ص580]."
  - term: "حَرِجٍ"
    text: "لازق ثابت. قال ابن الأَنْبارِيّ: «يقال حرج الموت بآل فلان، أي لصق وثبت» [@ibn-al-anbari، ص580]. وفي اللسان: «يقال للغبار الساطع المنضم إلى حائط أو سند قد حرج إليه» [@lisan، ج2 ص234]."
  - term: "أَعْلَامِهِنَّ"
    text: "الأعلام: «الجبال والرايات» [@zawzani، ص195]."
  - term: "قَتَامُهَا"
    text: "«القتام: الغبار» [@zawzani، ص195]."
syntax:
  - "الفاء في «فَعَلَوْتُ» عاطفة على «حَمَيْتُ» في البيت السابق. و«مُرْتَقِبًا» حال من تاء «عَلَوْتُ»، وتُروى بفتح القاف فتكون مفعولًا به، أي علوتُ مكان الارتقاب [@tabrizi-ashr، ص164]."
  - "«ذِي هَبْوَةٍ» صفة لموصوف محذوف، أي «على جبل ذي هبوة» [@zawzani، ص195]. و«حَرِجٍ» نعت ثانٍ له مجرور."
  - "«والقتام رفع بمعنى حرج» [@ibn-al-anbari، ص581]؛ أي «قَتَامُهَا» فاعل للصفة «حَرِجٍ»، و«إِلَى أَعْلَامِهِنَّ» متعلق بها."
morphology:
  - "«مُرْتَقِب» اسم فاعل من «ارتقب» على «افتعل»، و«مُرْتَقَب» بالفتح اسم مكان على الوزن نفسه."
  - "«هَبْوَة» على «فَعْلة» من «هبا» إذا ثار الغبار، ومنه «الإهباء» مصدر «أهبى» [@ibn-al-anbari، ص580]."
  - "«حَرِج» صفة مشبهة على «فَعِل»، ويقال فيها «الحرِج والحرَج أيضا: الشديد الضيق» [@ibn-al-anbari، ص580]."
rhetoric:
  thesis: "الفارس الذي توشّح اللجام يصعد الآن ربيئة لقومه، في مكان مخوف يغشاه الغبار."
  devices:
    - title: "الحذف"
      text: "قال «عَلَى ذِي هَبْوَةٍ» ولم يذكر الجبل، فاكتفى بصفته التي تهمّه: أنه مكان تثور فيه الغبرة، أي مكان قتال وخوف. ويقول عبد القاهر الجُرْجانيّ في الحذف: «هو باب دقيق المسلك، لطيف المأخذ، عجيب الأمر، شبيه بالسحر، فإنك ترى به ترك الذكر، أفصح من الذكر» [@dalail، ص146]."
    - title: "الغبار المتشبث"
      text: "«حَرِجٍ إِلَى أَعْلَامِهِنَّ قَتَامُهَا»: جعل الغبار ملتصقًا بالأعلام لا يفارقها، والحرج في أصله الضيق؛ فالصورة صورة غبار كثيف حتى «بلغ إلى الأعلام وهي الجبال» [@tabrizi-ashr، ص164]. فشدة الغبار دليل على شدة الموقف الذي يحرس فيه."
  connection: "ويبقى على مرقبه حتى تغيب الشمس ويستر الظلامُ مواضعَ الخوف."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَعَلَوْتُ مُرْ / تَقِبَنْ عَلَى / ذِي هَبْوَتِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — حَرِجِنْ إِلَى / أَعْلَامِهِنْ / نَ قَتَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثالثة من الصدر والثانية من العَجُز."
context: "يتبع بيت الحماية: من حمى الحيّ لا بد أن يرقب العدو من مكان عالٍ. والصورة متصلة حتى البيت 69، فالمرقب نهارًا، ثم النزول ليلًا، ثم العدو بالفرس."
variants:
  - reading: "فَعَلَوْتُ مُرْتَقِبًا عَلَى مَرْهُوبَةٍ"
    status: "رواية أخرى"
    note: "«و(مرهوبة): أرض مخوفة» [@ibn-al-anbari، ص580]، وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص164]. وعليها يعود الضمير في «قتامها» عنده إلى «مرهوبة» [@tabrizi-ashr، ص165]."
  - reading: "فَعَلَوْتُ مُرْتَقَبًا"
    status: "رواية الأَصْمَعِيّ"
    note: "بفتح القاف، «أي علوت موضعا يرتقب فيه على جبل ذي هبوة» [@ibn-al-anbari، ص580]."
  - reading: "فَعَلَوْتُ مُرْتَقِبًا إِلَى ذِي هَبْوَةٍ"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص580]."
