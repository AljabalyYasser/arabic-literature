first: "فَغَدَتْ كِلَا الْفَرْجَيْنِ تَحْسَبُ أَنَّهُ"
second: "مَوْلَى الْمَخَافَةِ خَلْفُهَا وَأَمَامُهَا"
meaning: "فغدت وهي تظن كل واحدة من الجهتين، خلفها وأمامها، أولى بالخطر من الأخرى. قال ابن الأَنْبارِيّ: «يريد: هي تحسب أن خلفها مخافة وأمامها كذلك» [@ibn-al-anbari، ص566]. وقال الزَّوْزَنِيّ: «أنها لم تقف على أن صاحب الرِزّ خلفها أم أمامها، فغدت فزعة مذعورة لا تعرف منجاها من مهلكها» [@zawzani، ص190]."
vocabulary:
  - term: "غَدَتْ"
    text: "«غدت من الغدو» [@ibn-al-anbari، ص565]، أي خرجت أول النهار."
  - term: "الْفَرْجَيْنِ"
    text: "«الواسع من الأرض. والفرج أيضا: الثَّغر. والثَّغْر: موضع المخافة» [@ibn-al-anbari، ص565]. والفرجان هنا الخلف والأمام."
  - term: "مَوْلَى"
    text: "«معناه أولى بالمخافة، وولى المخافة» [@ibn-al-anbari، ص566]. ونقل الزَّوْزَنِيّ عن ثَعْلَب: «إنّ المولى في هذا البيت بمعنى الأولى بالشيء» [@zawzani، ص190]، وعن الأَصْمَعِيّ: «أراد بالمخافة الكلاب وبمولاها صاحبها» [@zawzani، ص190]."
syntax:
  - "«كِلَا الْفَرْجَيْنِ» مبتدأ تقدّم على فعل الظن، واختُلف في رافعه: «وكلا في موضع رفع بما عاد من الهاء التي في قوله (أنه) في قول الكسائي. وقال الفراء: موضع كلا رفع بموضع تحسب» [@ibn-al-anbari، ص566]. فهو عند الكِسائِيّ مبتدأ خبره جملة «تَحْسَبُ أَنَّهُ...»، والهاء في «أَنَّهُ» تعود إليه."
  - "«ومولى المخافة مرتفع لأنه خبر أن، وخلفها وأمامها يرتفعان بالترجمة عن الفرجين، معناه هما خلفها وأمامها» [@ibn-al-anbari، ص566]، والترجمة هنا البدل والتفسير. وعند الزَّوْزَنِيّ «خلفها وأمامها خبر مبتدأ محذوف تقديره هو خلفها وأمامها» [@zawzani، ص190]."
  - "جاء الضمير في «أَنَّهُ» مفردًا و«كِلَا» للمثنى، لأنها «مفرد اللفظ وإن كان يتضمن معنى التثنية» [@zawzani، ص190]. وفي اللسان وجه آخر: «وَقَوْلُهُ: فَغَدَتْ تَمَّ الْكَلَامُ، كأَنه قَالَ: فَغَدَتْ هَذِهِ الْبَقَرَةُ، وَقَطَعَ الْكَلَامَ ثُمَّ ابتدأَ» [@lisan، ج15 ص410]."
morphology:
  - "«مَوْلَى» على «مَفْعَل» من «وَلِيَ». ويستشهد ابن الأَنْبارِيّ لمعنى الأَولى بقوله تعالى ﴿هِيَ مَوْلَاكُمْ﴾، «أراد هي أولى بكم» [@ibn-al-anbari، ص566]."
  - "«كِلَا» اسم مفرد اللفظ مثنى المعنى، يلزم الألف إذا أضيف إلى اسم ظاهر، و«الْفَرْجَيْنِ» مثنى «فَرْج» مجرور بالياء بالإضافة."
  - "«المَخَافَة» مصدر ميمي من «خاف يخاف»."
rhetoric:
  thesis: "خوف بلا جهة: لا تعرف البقرة أين الخطر، فكل جهة عندها هي الخطر. والبيت يجعل الحيرة مكانًا يحيط بها من الجانبين."
  devices:
    - title: "التفسير بعد الإبهام"
      text: "«كِلَا الْفَرْجَيْنِ ... خَلْفُهَا وَأَمَامُهَا»: ذكر الجهتين مبهمتين في أول البيت، ثم فسّرهما في آخره. والسامع ينتظر تفسير المبهم، فيقع التفسير في نفسه أوقع. وهذه قراءتنا."
    - title: "الطباق"
      text: "«خَلْفُهَا وَأَمَامُهَا»: الطباق الجمع بين ضدين، والضدان هنا جهتا الهرب كلتاهما، فلا منجى بينهما."
  connection: "ثم ييأس الرماة من أن تنالها سهامهم، فيرسلون كلابهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَغَدَتْ كِلَلْ / فَرْجَيْنِ تَحْ / سَبُ أَنْنَهُو = متَفاعلن / مُتْفاعلن / متَفاعلن — مَوْلَ لْمَخَا / فَةِ خَلْفُهَا / وَأَمَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر والأولى من العجز. وأُشبعت ضمة الهاء في «أَنَّهُ»، وسقطت ألف «كِلَا» و«مَوْلَى» في النطق لالتقاء الساكنين."
context: "الخامس من أبيات الصباح والرماة والكلاب (44–52). بعد الصوت الخفي يأتي الفزع، وبعده الصيد."
variants:
  - reading: "فَعَدَتْ كِلَا الْفَرْجَيْنِ تَحْسَبُ أَنَّهُ"
    status: "رواية أخرى"
    note: "«ويروى: (فعدت) بعين غير معجمة، على إنه فعلت من العدو» [@ibn-al-anbari، ص566]. وبها أنشده اللسان في موضع [@lisan، ج12 ص26]، ويذكرها الديوان [@diwan-labid، ص311]."
  - reading: "مَوْلَى الْمَخَافَةِ خَلْفَهَا وَأَمَامَهَا"
    status: "رواية اللسان"
    note: "بالنصب على الظرف [@lisan، ج15 ص410]. وأنشده في موضع آخر بالرفع وقال: «وَقَالَ لَبِيدٌ فَجَعله اسْمًا» [@lisan، ج12 ص26]."
