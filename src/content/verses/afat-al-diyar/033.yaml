first: "فَمَضَى وَقَدَّمَهَا وَكَانَتْ عَادَةً"
second: "مِنْهُ إِذَا هِيَ عَرَّدَتْ إِقْدَامُهَا"
meaning: "فمضى العير إلى الماء وقدّم الأتان أمامه، وكان من عادته أن يقدّمها إذا حادت عن الطريق أو تأخرت. قال ابن الأَنْبارِيّ: «معناه: مضى الحمار وقدّم الأتان لكيلا تعند عليه» [@ibn-al-anbari، ص550]، أي لكيلا تخالفه وتعدل عن طريقه."
vocabulary:
  - term: "وَقَدَّمَهَا"
    text: "جعلها أمامه. وفي لسان العرب: «وأَقْدَمَه وقَدَّمه بِمَعْنًى» [@lisan، ج12 ص467]."
  - term: "عَرَّدَتْ"
    text: "«تركت الطريق وعدلت عنه. وأصل التعريد الفرار» [@ibn-al-anbari، ص550]. وعند الزَّوْزَنِيّ: «التعريد: التأخير والجبن» [@zawzani، ص185]."
  - term: "إِقْدَامُهَا"
    text: "تقديمها: «الإقدام هنا بمعنى التقدمة» [@zawzani، ص185]."
syntax:
  - "«فَمَضَى» فاعله ضمير العير، و«وَقَدَّمَهَا» معطوف عليه. والواو في «وَكَانَتْ» واو الحال أو الاستئناف."
  - "«والإقدام اسم الكون، والعادة خبر الكون» [@ibn-al-anbari، ص551]: فـ«إِقْدَامُهَا» اسم «كان» مؤخر، و«عَادَةً» خبرها مقدم، و«مِنْهُ» متعلق بـ«عَادَةً». وجملة «إِذَا هِيَ عَرَّدَتْ» شرط معترض بين الخبر والاسم، و«هِيَ» فاعل لفعل محذوف يفسره «عَرَّدَتْ»."
  - "أُنّث «كَانَتْ» واسمها «إِقْدَامُهَا» مذكر، وللنحاة فيه قولان ذكرهما ابن الأَنْبارِيّ. قال الكِسائيّ: «إذا كان خبر كان مؤنثا واسمها مذكرا وأوليتها الخبر فمن العرب من يؤنث كان ويتوهم أن الاسم مؤنث إذا كان الخبر مؤنثا». وقال غيره: «إنما بني الشاعر كلامه وكانت عادة تقدمتها؛ لأن التقدمة مصدر قدمها، إلا إنه لما انتهى إلى القافية فلم يجد التقدمة تصلح لها فقال إقدامها» [@ibn-al-anbari، ص551]. ثم قال الفَرّاء: «وكل قد ذهب مذهبا، وقول الكسائي أشبه بمذهب العرب» [@ibn-al-anbari، ص552]."
morphology:
  - "«إِقْدَام» مصدر «أقدم» على «إفعال»، و«أقدمه» بمعنى «قدّمه» [@lisan، ج12 ص467]. أما «تَقْدِمة» فمصدر «قدّم» على «تَفْعِلة»، وهي المؤنثة التي حُمل عليها التأنيث [@zawzani، ص185]."
  - "«عَرَّدَ» على «فعّل»، «وأصل التعريد الفرار» [@ibn-al-anbari، ص550]."
  - "«عَادَة» على «فَعَلة» من «عاد يعود»، وأصلها «عَوَدة»، قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها."
rhetoric:
  thesis: "العير قائد يعرف أتانه: يقدّمها أمامه لأنه يعلم أنها تحيد إن تُركت خلفه. والبيت يصف عادة، لا مرة واحدة."
  devices:
    - title: "الحمل على المعنى"
      text: "أنّث «وَكَانَتْ» لأن «الإقدام» في معنى «التقدمة»، كما يقول الزَّوْزَنِيّ: «لذلك أنث فعلها فقال: وكانت، أي وكانت تقدمة الأتان عادة من العير» [@zawzani، ص185]. ومثله عنده قول الشاعر: «غَفَرْنَا وَكَانَتْ مِنْ سَجِيَّتِنَا الْغَفْرُ»، أي المغفرة [@zawzani، ص185]. وفي لسان العرب وجه آخر: «لأَنه فِي مَعْنَى الْعَادَةِ وَهِيَ خَبَرُ كَانَ، وَخَبَرُ كَانَ هُوَ اسْمُهَا فِي الْمَعْنَى» [@lisan، ج12 ص467]."
    - title: "لفظ من الحرب"
      text: "«عَرَّدَ» في أصله الفرار من القتال، واستشهد له ابن الأَنْبارِيّ بقول من رثى الزُّبَيْر: «غَدَرَ ابْنُ جُرْمُوزٍ بِفَارِسِ بُهْمَةٍ ... يَوْمَ اللِّقَاءِ وَكَانَ غَيْرَ مُعَرِّدِ» [@ibn-al-anbari، ص550]. فوصف الأتان بلفظ يقال في المحارب الذي يفرّ، كما وصف العير في البيت 27 بلفظ الربيئة. والحيوانان عند لَبِيد يعيشان حياة القوم في الغزو. وهذه قراءتنا."
  connection: "ثم يبلغان الماء: يتوسطان جانب النهر الصغير، ويشقّان عينًا ممتلئة كثيفة النبت [@ibn-al-anbari، ص552]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَمَضَا وَقَدْ / دَمَهَا وَكَا / نَتْ عَادَةَنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — مِنْهُو إِذَا / هِيَ عَرْرَدَتْ / إِقْدَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلةَ الثالثة من الصدر، والأولى والثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وأُشبعت ضمة الهاء في «مِنْهُ» حتى صارت واوًا، كما يقتضي الوزن."
context: "من أبيات الأتان وفحلها (25–35)، في الطريق إلى الماء. ويذكر ابن الأَنْبارِيّ عادة أخرى للفحل عند الماء نفسه: «ولا تتقدم الأتن والثيران أبدا حتى يتقدم الفحل إلى الماء فيشرب وينظر هل يرى بالماء شيئا يريبه» [@ibn-al-anbari، ص550]. فالعير يقدّم أتانه في الطريق لئلا تتأخر، ويتقدمها عند الماء ليأمن عليها، وهذا جمع منا بين القولين."
