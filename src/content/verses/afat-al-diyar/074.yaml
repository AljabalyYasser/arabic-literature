first: "أَدْعُو بِهِنَّ لِعَاقِرٍ أَوْ مُطْفِلٍ"
second: "بُذِلَتْ لِجِيرَانِ الْجَمِيعِ لِحَامُهَا"
meaning: "أدعو بتلك القداح لأقامر على ناقة عاقر لا تلد، أو ناقة معها ولدها الصغير، ثم يُبذل لحمها لجيران الحيّ كلهم. قال ابن الأَنْبارِيّ: «أدعو بهن، معناه أدعو بهذه المغالق لأيسر بها على ناقة عاقر، أي لا تلد» [@ibn-al-anbari، ص588]. وقال الزَّوْزَنِيّ: «أي: إنما أطلب القداح لأنحر مثل هاتين، وذكر العاقر لأنها أسمن وذكر المطفل لأنها أنفس» [@zawzani، ص198]."
vocabulary:
  - term: "بِهِنَّ"
    text: "الضمير للمغالق، أي قداح الميسر في البيت السابق: «أدعو بهذه المغالق» [@ibn-al-anbari، ص588]."
  - term: "عَاقِرٍ"
    text: "«العاقر: التي لا تلد» [@zawzani، ص198]. وقال بعض أهل اللغة: «العاقر: العجوز التي لا تحمل» [@ibn-al-anbari، ص589]."
  - term: "مُطْفِلٍ"
    text: "«المطفل التي معها ولدها» [@zawzani، ص198]. وفي اللسان: «والمُطْفِل: ذَاتُ الطِّفْل مِنَ الإِنسان وَالْوَحْشُ مَعَهَا طِفْلُها، وَهِيَ قَرِيبَةُ عَهْدٍ بالنَّتاج، وَكَذَلِكَ النَّاقَة» [@lisan، ج11 ص402]."
  - term: "جِيرَانِ الْجَمِيعِ"
    text: "جيران الحيّ كلهم، وفي تفسير الزَّوْزَنِيّ: «تبذل لحومها لجميع الجيران» [@zawzani، ص198]."
  - term: "لِحَامُهَا"
    text: "لحومها، «جمع لحم، يقال لحم وألحم، ولحمان، ولحام» [@ibn-al-anbari، ص589]."
syntax:
  - "«أَدْعُو» مضارع مرفوع بضمة مقدّرة على الواو، وفاعله ضمير المتكلم، و«بِهِنَّ» متعلق به، والضمير للمغالق."
  - "«لِعَاقِرٍ» متعلق بـ«أَدْعُو»، واللام على تفسير ابن الأَنْبارِيّ الأول للغاية: أدعو بها لأقامر على عاقر. وعلى تفسير من جعل العاقر العجوز التي لا تحمل: «واللام على هذا التفسير الثاني معناه من أجل. أي أدعو بهن من أجل عاقر» [@ibn-al-anbari، ص589]."
  - "«أَوْ مُطْفِلٍ» معطوف على «عَاقِرٍ». وجملة «بُذِلَتْ لِجِيرَانِ الْجَمِيعِ لِحَامُهَا» نعت لهما، و«لِحَامُهَا» نائب فاعل، والضمير فيه للناقة أيتهما كانت. و«لِجِيرَانِ» متعلق بـ«بُذِلَتْ»، و«الْجَمِيعِ» مضاف إليه."
morphology:
  - "«مُطْفِل» اسم فاعل من «أطفلت» على «أفعل»، أي صارت ذات طفل. ولم تلحقه التاء وهو وصف للأنثى: «ولم تدخل في مطفل الهاء لأنه فعل لا حظ للرجل فيه» [@ibn-al-anbari، ص589]."
  - "«لِحام» جمع «لحم» على «فِعال»، ومن جموعه أيضًا «ألحم» و«لحمان» [@ibn-al-anbari، ص589]."
  - "«بُذِلَتْ» ماضٍ مبني للمجهول من «بذل يبذل». و«عاقِر» اسم فاعل من «عقرت» إذا صارت لا تلد."
rhetoric:
  thesis: "الميسر عند لبيد طريق إلى النحر: يختار لقداحه أسمن النوق أو أغلاها، ثم يذهب لحمها كله إلى الناس."
  devices:
    - title: "التقسيم"
      text: "«لِعَاقِرٍ أَوْ مُطْفِلٍ»: ناقتان لكل منهما فضل، «والعاقر أسمن، والمطفل أغلى» [@ibn-al-anbari، ص589]. فإن اختار العاقر فلأجود اللحم، وإن اختار المطفل فلأنفس المال. والتقسيم: أن يُذكر للشيء وجوه فتُستوفى."
    - title: "من الماضي إلى المضارع"
      text: "قال في البيت السابق «دَعَوْتُ»، وقال هنا «أَدْعُو»: فالماضي حادثة واحدة يرويها، والمضارع عادة لا تنقطع. وهذه قراءتنا."
    - title: "البناء للمجهول"
      text: "«بُذِلَتْ ... لِحَامُهَا»: صرّح بنفسه في «أَدْعُو»، ثم طوى ذكر الباذل، فصار البذل حقيقة قائمة لا يحتاج أن ينسبها إلى نفسه. وهذه قراءتنا."
    - title: "العموم"
      text: "«لِجِيرَانِ الْجَمِيعِ»: لم يخصّ جيرانه هو، بل جيران الحي كله، فالكرم يتجاوز من يلزمه أمرهم."
  connection: "ثم يصف حال الضيف والجار الغريب عنده: كأنهما نزلا واديًا خصيبًا."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَدْعُو بِهِنْ / نَ لِعَاقِرِنْ / أَوْ مُطْفِلِنْ = مُتْفاعلن / متَفاعلن / مُتْفاعلن — بُذِلَتْ لِجِي / رَانِلْ جَمِي / عِ لِحَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلتين الأولى والثالثة من الصدر، والثانية من العَجُز."
context: "ثاني أبيات الميسر والقِرى (73–77)، وهو تفسير للبيت السابق: القداح التي دعا بها هناك يدعو بها ليقامر على أكرم النوق ويبذل لحمها. وعلى هذا البيت وما بعده بنى الزَّوْزَنِيّ قوله في البيت 73 إن لبيدًا ينحر من صلب ماله لا من كسب قماره، قال: «والأبيات التي بعده تدلّ عليه» [@zawzani، ص198]."
variants:
  - reading: "بُذِلَتْ لِجِيرَانِ الشِّتَاءِ لِحَامُهَا"
    status: "رواية أخرى"
    note: "يذكرها التِّبْرِيزِيّ [@tabrizi-ashr، ص170] والديوان [@diwan-labid، ص318]."
  - reading: "بُذِلَتْ لِجِيرَانِ الْعَشِيِّ لِحَامُهَا"
    status: "رواية أخرى"
    note: "قال ابن الأَنْبارِيّ: «أي لمجالسنا بالعشي؛ نتذمم أن يرجعوا ولم نعشهم» [@ibn-al-anbari، ص589]، أي نستحيي أن ينصرفوا بلا عشاء. ويذكرها التِّبْرِيزِيّ [@tabrizi-ashr، ص170] والديوان [@diwan-labid، ص318]."
