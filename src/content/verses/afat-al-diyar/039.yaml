first: "صَادَفْنَ مِنْهُ غِرَّةً فَأَصَبْنَهَا"
second: "إِنَّ الْمَنَايَا لَا تَطِيشُ سِهَامُهَا"
meaning: "وجدت الذئاب غفلة من الولد فاغتنمتها وافترسته؛ والموت لا تخطئ سهامه. قال ابن الأَنْبارِيّ: «صادفن منه، معناه من الفرير، وهو الولد. (فأصبنها) معناه فأصبن الغرة» [@ibn-al-anbari، ص557]. وفي العجز: «معناه لا تخف سهامها» [@ibn-al-anbari، ص557]، أي لا تطيش عن هدفها بل تصيبه."
vocabulary:
  - term: "صَادَفْنَ"
    text: "وجدن، والنون للذئاب: «وما في صادفن يعود على الذئاب» [@ibn-al-anbari، ص557]."
  - term: "غِرَّةً"
    text: "«الغرة: الغفلة» [@zawzani، ص187]."
  - term: "تَطِيشُ"
    text: "«وأصل الطيش الخفة، ومنه قولهم: فلان طياش» [@ibn-al-anbari، ص557]. «والطيش: أن يخف السهم. ولا يقصد إلا رزين السهام» [@ibn-al-anbari، ص557]، أي أن السهم الخفيف ينحرف، والثقيل يصيب."
  - term: "الْمَنَايَا"
    text: "جمع مَنِيّة، وهي الموت."
syntax:
  - "نون النسوة في «صَادَفْنَ» فاعل يعود على «غُبْسٌ كَوَاسِبُ» في البيت السابق. والضمير في «مِنْهُ» للفرير، وفي «أَصَبْنَهَا» للغِرّة."
  - "جملة «إِنَّ الْمَنَايَا لَا تَطِيشُ سِهَامُهَا» مستأنفة: «الْمَنَايَا» اسم «إِنَّ»، وجملة «لَا تَطِيشُ سِهَامُهَا» خبرها، والرابط الضمير في «سِهَامُهَا»: «وخبر أن ما عاد من الهاء والألف» [@ibn-al-anbari، ص557]."
morphology:
  - "«صَادَفْنَ» ماضٍ على «فاعَلَ» مسند إلى نون النسوة، ومعناه الوجدان والموافقة لا المشاركة."
  - "«غِرَّة» على «فِعْلة» من «غَرّ»."
  - "«الْمَنَايَا» جمع «مَنِيّة» على «فَعَالَى»."
  - "«تَطِيشُ» مضارع «طاش يطيش» الأجوف اليائي."
rhetoric:
  thesis: "يختم الشاعر الحكاية الأولى بحكمة عامة، فيخرج من بقرة بعينها إلى قانون يشمل كل حي: الموت لا يخطئ."
  devices:
    - title: "الاستعارة"
      text: "«الْمَنَايَا ... سِهَامُهَا»: جعل للموت سهامًا، وجعل خطأها «طيشًا». قال ابن الأَنْبارِيّ: «والمنية لا سهام لها، وإنما هذا مثل» [@ibn-al-anbari، ص557]، وقال الزَّوْزَنِيّ: «واستعار له سهامًا واستعار للأخطاء لفظ الطيش؛ لأن السهم إذا أخطأ الهدف فقد طاش عنه» [@zawzani، ص187]. والاستعارة: أن تريد تشبيه شيء بشيء فتترك لفظ التشبيه. وهذه الاستعارة من الضرب الذي يميّزه عبد القاهر الجُرْجانيّ من «رأيت أسدًا»، فيقول في الفرق بينهما: «أنكَ في الأولِ تجعلُ الشيءَ الشيءَ ليس به، وفي الثاني للشّيءِ الشيءَ ليس له» [@dalail، ص67]. فالموت لا يُجعل سهمًا، بل يُجعل له سهام ليست له، كما تُجعل للريح يد في البيت 61."
    - title: "التذييل"
      text: "«إِنَّ الْمَنَايَا لَا تَطِيشُ سِهَامُهَا»: جملة تامة المعنى تأتي بعد الخبر فتؤكده وتعمّمه، وهذا ما يسمّيه البلاغيون التذييل. ولاستقلالها سار العجز وحده: أنشده سِيبَوَيْه للبيد بصدر آخر، «وَلَقَدْ عَلِمْتُ لَتَأْتِيَنَّ مَنِيَّتِي» [@sibawayh، ج3 ص110]، وقال البَغْدادِيّ: «وَالْبَيْت نسبه سِيبَوَيْهٍ فِي كِتَابه للبيد وَالْمَوْجُود فِي معلقته إِنَّمَا هُوَ المصرع الثَّانِي» [@khizana، ج9 ص161]."
  connection: "ثم يترك الذئاب والفرير، ويعود إلى الأم وحدها في ليلة مطيرة: «بَاتَتْ وَأَسْبَلَ وَاكِفٌ مِنْ دِيمَةٍ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "صَادَفْنَ مِنْ / هُو غِرْرَتَنْ / فَأَصَبْنَهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن — إِنْنَ لْمَنَا / يَا لَا تَطِي / شُ سِهَامُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأوليين من الصدر والعجز. وأُشبعت ضمة الهاء في «مِنْهُ» حتى صارت واوًا، كما يقتضي الوزن."
context: "آخر أبيات البقرة المسبوعة (36–39). يتم به خبر الفرير، ثم تنتقل الحكاية إلى الأم في ليلتها. وقد سار عجزه مثلًا مستقلًا عن صدره، كما يدل عليه إنشاد سِيبَوَيْه له بصدر آخر."
variants:
  - reading: "صَادَفْنَ مِنْهَا غِرَّةً فَأَصَبْنَهَا"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "والضمير في «مِنْهَا» للبقرة: «صادفت الكلاب والذئاب غفلة من البقرة» [@zawzani، ص187] [@diwan-labid، ص308]. ويذكر محقق الديوان رواية «صادفن منه» [@diwan-labid، ص308]."
  - reading: "صَادَفْنَ مِنْهُ غِرَّةً فَأَصَبْنَهُ"
    status: "رواية أخرى"
    note: "«ويروى: (فأصبنه) على معنى فأصبن الولد» [@ibn-al-anbari، ص557]. وبها مع «مِنْهَا» يذكره البَغْدادِيّ [@khizana، ج9 ص161]."
  - reading: "وَلَقَدْ عَلِمْتُ لَتَأْتِيَنَّ مَنِيَّتِي ... إِنَّ الْمَنَايَا لَا تَطِيشُ سِهَامُهَا"
    status: "رواية سِيبَوَيْه"
    note: "ينشده سِيبَوَيْه للبيد شاهدًا على أن «علمت» تُعامل معاملة القسم: «كأنَّه قال: والَّله لتأتين» [@sibawayh، ج3 ص110]. ويقول البَغْدادِيّ إن الصدر ليس في المعلقة، وإنه لم «يُوجد للبيد فِي ديوانه شعر على هَذَا الْوَزْن والروي غير الْمُعَلقَة» [@khizana، ج9 ص162]."
