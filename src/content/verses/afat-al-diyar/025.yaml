first: "أَوْ مُلْمِعٌ وَسَقَتْ لِأَحْقَبَ لَاحَهُ"
second: "طَرْدُ الْفُحُولِ وَضَرْبُهَا وَكِدَامُهَا"
meaning: "أو كأن ناقتي أتانٌ ظهر حملها في ضرعها، حملت من حمار وحشي أبيض الحقوين، قد أهزله وغيّره طردُه الفحول عنها، وضربُها إياه وعضُّها. قال الزَّوْزَنِيّ: «وتلخيص المعنى: أنها تشبه في شدة سيرها هذه السحابة أو هذه الأتان التي حملت تولبًا لمثل هذا الفحل الشديد الغيرة عليها، فهو يسوقها سوقًا عنيفًا» [@zawzani، ص182]. والتَّوْلَب: الجحش."
vocabulary:
  - term: "مُلْمِعٌ"
    text: "«الأتان التي قد استبان حملها في ضرعها، وذلك إنه يشرق للبن. يقال لذوات الحافر والسباع: قد ألمعت؛ وهي أتن ملاميع» [@ibn-al-anbari، ص541]. والأتان: أنثى الحمار."
  - term: "وَسَقَتْ"
    text: "«حملت ماء الفحل» [@ibn-al-anbari، ص542]. «ويقال: أرض تسق الماء، إذا أمسكته» [@ibn-al-anbari، ص542]."
  - term: "لِأَحْقَبَ"
    text: "«والأحقب عير بموضع الحقب منه بياض» [@ibn-al-anbari، ص542]، والعَيْر: الحمار الوحشي، والحَقَب: موضع الحزام من البطن. وعند الزَّوْزَنِيّ: «العير الذي في وركيه بياض أو في خاصرتيه» [@zawzani، ص181]."
  - term: "لَاحَهُ"
    text: "«أضمره وغيره. يقال لاحه السفر يلوحه لوحا، إذا فعل به ذلك» [@ibn-al-anbari، ص542]."
  - term: "كِدَامُهَا"
    text: "«الكدام: يجوز أن يكون بمنزلة الكدم وهو العض، وأن يكون بمنزلة المكادمة» [@zawzani، ص181]، «وهي المعاضَّة» [@zawzani، ص182]."
syntax:
  - "«وملمع نسق على صهباء» [@ibn-al-anbari، ص542]: فـ«مُلْمِعٌ» معطوف على «صَهْبَاءُ» في البيت السابق، فهو خبر ثانٍ لـ«كأنّ»، وهو صفة لموصوف محذوف: أتان ملمع."
  - "جملة «وَسَقَتْ» صفة لـ«مُلْمِعٌ»، و«لِأَحْقَبَ» متعلق بها، وهو مجرور بالفتحة لأنه ممنوع من الصرف، على وزن «أفعل» صفةً. وجملة «لَاحَهُ...» صفة لـ«أَحْقَبَ»."
  - "«طَرْدُ» فاعل «لَاحَ»، وهو مصدر مضاف يحتمل وجهين ذكرهما الزَّوْزَنِيّ: «طرده الفحول وضربه إياها وعضه، أو طرد الفحول وضربها وعضها إياه» [@zawzani، ص182]، أي هو يطرد الفحول ويضربها، أو هي تطرده وتضربه."
morphology:
  - "«مُلْمِع» اسم فاعل من «ألمع» على «أفعل»، ولم تلحقه التاء لأنه وصف لا يكون إلا للأنثى، وجمعه «ملاميع» [@ibn-al-anbari، ص541]."
  - "«وَسَقَتْ» من «وسق يسق»، «ويقال ناقة واسق وإبل مواسيق، جمع على غير قياس» [@ibn-al-anbari، ص542]."
  - "«الْفُحُول» جمع «فحل»، ويُجمع أيضًا على فُحُولة وفِحال وفِحالة [@zawzani، ص181]. و«كِدَام» على «فِعال»، مصدر «كادم» أو بمعنى الكَدْم [@zawzani، ص181]."
rhetoric:
  thesis: "يعطف على السحابة تشبيهًا ثانيًا: الأتان الحامل. لكن المشبَّه به هنا لا يقف عند البيت، بل يصير حكاية تمتد أحد عشر بيتًا."
  devices:
    - title: "تعدّد التشبيه بـ«أَوْ»"
      text: "عطف بـ«أَوْ» صورة على صورة: الناقة كالسحابة، «أَوْ» كالأتان. وهي عادته في القصيدة، فقد شبّه الأطلال بالكتب ثم قال «أَوْ رَجْعُ وَاشِمَةٍ» في البيت 9."
    - title: "المشبّه به يصير حكاية"
      text: "بدأ بالأتان ليشبّه بها سرعة ناقته، ثم أقبل على الأتان نفسها: حملها، وفحلها الغيور، وما يلقيان من الشتاء إلى الصيف، ثم رحلتهما إلى الماء. ويرى شوقي ضَيْف أن في المعلقة «وصف بارع لأتن وحمارها، ثم لبقرة وحشية تعقبها الرماة بنبلهم» [@deif، ج1 ص80]، فهما وصفان متتابعان، وكلاهما يخرج من تشبيه الناقة."
    - title: "الفحل الغيور"
      text: "«لَاحَهُ طَرْدُ الْفُحُولِ»: الذي أهزل العير ليس السفر بل الغيرة، يطرد الفحول عن أتانه «قبل أن يحملن، فلما حملن ذهبت الفحالة عنهن وصار شرهن عليه» [@ibn-al-anbari، ص542]. فالعير في القصيدة يعيش كما يعيش الرجل الغيور على حرمه. وهذه قراءتنا للصورة."
  connection: "ثم يصف الفحل يسوق الأتان إلى أعالي الآكام، وقد رابه منها عصيانها وشهوتها [@ibn-al-anbari، ص542]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَوْ مُلْمِعُنْ / وَسَقَتْ لِأَحْ / قَبَ لَاحَهُو = مُتْفاعلن / متَفاعلن / متَفاعلن — طَرْدُلْ فُحُو / لِ وَضَرْبُهَا / وَكِدَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "أول أبيات الأتان وفحلها (25–35)، وهي آخر مقاطع المرحلة الأولى من القصيدة. يبدأ تشبيهًا للناقة، ثم يستقل حكايةً: الأتان وفحلها في الشتاء والربيع، ثم عطشهما في الصيف وورودهما الماء."
variants:
  - reading: "طَرْدُ الْفُحَالَةِ ضَرْبُهَا وَعِذَامُهَا"
    status: "رواية أخرى"
    note: "«قوله (عذامها) معناه معاذمتها وهي المعاضة» [@ibn-al-anbari، ص542]. وعند الزَّوْزَنِيّ: «طرد الفحولة ضربها وعذامها» [@zawzani، ص181]، ويذكرها الديوان رواية أخرى [@diwan-labid، ص304]."
  - reading: "طَرْدُ الْفُحُولِ وَزَرُّهَا وَكِدَامُهَا"
    status: "رواية أخرى"
    note: "«و (زرها) : عضه إياها» [@ibn-al-anbari، ص542] [@diwan-labid، ص304]."
