first: "تَرْقَى وَتَطْعُنُ فِي الْعِنَانِ وَتَنْتَحِي"
second: "وِرْدَ الْحَمَامَةِ إِذْ أَجَدَّ حَمَامُهَا"
meaning: "ترفع رأسها كأنها تصعد، وتمدّ عنقها في العنان، وتقصد في عدوها قصد الحمامة إلى الماء حين جدّ سربها في الطيران. قال التِّبْرِيزِيّ: «ومعنى البيت أن فرسه تُسرع كما تسرع هذه القطاة إلى شُرب الماء وهي في أثر قطا بعد الكلال والتعب» [@tabrizi-ashr، ص167]."
vocabulary:
  - term: "تَرْقَى"
    text: "«معناه تصعد» [@ibn-al-anbari، ص584]، أي ترفع رأسها في العدو."
  - term: "تَطْعُنُ فِي الْعِنَانِ"
    text: "«تعتمد فيه» [@ibn-al-anbari، ص584]. وفي اللسان: «والفرس يطعن في العنان إذا مده وتبسط في السير» [@lisan، ج13 ص267]. والعِنان: سير اللجام الذي يمسكه الفارس."
  - term: "تَنْتَحِي"
    text: "«تعتمد كأنها حمامة» [@ibn-al-anbari، ص584]، و«الانتحاء الاعتماد» [@zawzani، ص196]، أي تقصد."
  - term: "وِرْدَ الْحَمَامَةِ"
    text: "إتيانها الماء. والحمامة هنا عند التِّبْرِيزِيّ «القطاة» [@tabrizi-ashr، ص167]، وعند الزَّوْزَنِيّ «ذوات الأطواق من الطير» [@zawzani، ص196]."
  - term: "أَجَدَّ"
    text: "اجتهد وأسرع. «يقال جد في الأمر وأجد، إذا انكمش فيه» [@ibn-al-anbari، ص584–585]، والانكماش: الإسراع والجدّ."
syntax:
  - "«و(ورد الحمامة) نصب على المصدر» [@ibn-al-anbari، ص585]، وعند الزَّوْزَنِيّ «نصب على المصدر من غير لفظ الفعل وهي ترقى أو تطعن أو تنتحي» [@zawzani، ص196]؛ أي تنتحي انتحاءً مثل ورد الحمامة. وفي اللسان: «أي كورد الحمامة» [@lisan، ج13 ص267]."
  - "«إِذْ» ظرف للماضي متعلق بـ«وِرْدَ»، و«حَمَامُهَا» فاعل «أَجَدَّ»، والضمير للحمامة."
  - "الأفعال الثلاثة «تَرْقَى» و«تَطْعُنُ» و«تَنْتَحِي» معطوفة، وفاعلها ضمير الفرس، وجملتها مستأنفة تصف عدوها."
morphology:
  - "«تَنْتَحِي» على «تفتعل» من «نحا» إذا قصد، و«الانتحاء» مصدره [@zawzani، ص196]."
  - "«أَجَدَّ» على «أفعل»، وهو بمعنى «جدّ»؛ «ومصدر جد: جداًّ، ومصدر أجدَّ: إجداداً» [@ibn-al-anbari، ص585]."
  - "«والحمام يذكَّر ويؤنَّث» [@ibn-al-anbari، ص585]؛ ويقال للذكر والأنثى «حمامة»، «ولا يقال للذكر حمام؛ لئلا يشبه الجمع» [@tabrizi-ashr، ص167]."
rhetoric:
  thesis: "خاتمة وصف الفرس: صورة طائر عطشان يندفع إلى الماء في إثر سربه، فلا شيء أسرع منه ولا أشد قصدًا."
  devices:
    - title: "التشبيه"
      text: "«وِرْدَ الْحَمَامَةِ»: «شبه سرعة عدوها بسرعة طيران الحمائم» حين ألحّ عليها العطش [@zawzani، ص196]. وهو عند عبد القاهر الجُرْجانيّ من التشبيه الحسّي البيّن، لأن الهيئة تدخل فيها «حال الحركات في أجسامها، كتشبيه الذاهب على الاستقامة بالسهم السديد» [@asrar، ص90]."
    - title: "الزيادة في المشبّه به"
      text: "لم يكتف بالحمامة، بل جعلها «إِذْ أَجَدَّ حَمَامُهَا»: سربها أمامها يجدّ في الطيران، فهي تلحق به؛ فالتابع أسرع من المتبوع. ويقول التِّبْرِيزِيّ: «وبين يديها قطا قد انكمش فهي في أثره، وهو أسرع لها» [@tabrizi-ashr، ص167]."
    - title: "الجناس"
      text: "بين «الْحَمَامَةِ» و«حَمَامُهَا» جناس اشتقاق، أي تكرار مادة واحدة في كلمتين، فيُختم البيت بصدى أوله."
  connection: "وتنتهي الفروسية هنا، ثم ينتقل إلى مقامات الملوك والخصومة في مجالسهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "تَرْقَى وَتَطْ / عُنُ فِلْ عِنَا / نِ وَتَنْتَحِي = مُتْفاعلن / متَفاعلن / متَفاعلن — وِرْدَلْ حَمَا / مَةِ إِذْ أَجَدْ / دَ حَمَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر والأولى من العَجُز."
context: "آخر مقطع حماية الحيّ والفرس (63–69). بدأ بالفارس متوشحًا اللجام، وانتهى بالفرس طائرًا إلى الماء."
