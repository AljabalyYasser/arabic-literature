first: "فَبِتِلْكَ إِذْ رَقَصَ اللَّوَامِعُ بِالضُّحَى"
second: "وَاجْتَابَ أَرْدِيَةَ السَّرَابِ إِكَامُهَا"
meaning: "فعلى تلك الناقة، حين يضطرب السراب اللامع في الضحى وتلبس التلالُ أرديةً منه، أقضي حاجتي؛ والجملة تتم في البيت التالي. قال الزَّوْزَنِيّ: «فبتلك الناقة التي أشبهت البقرة والأتان أقضي حوائجي في الهواجر، ورقص لوامع السراب ولبس الإكام أرديته كناية عن احتدام الهواجر» [@zawzani، ص192]. والهواجر: أشد ساعات الحرّ في نصف النهار."
vocabulary:
  - term: "اللَّوَامِعُ"
    text: "«معناه لوامع الآل تراها كأنها تنزو» [@ibn-al-anbari، ص571]، أي تثب. ويفرّق ابن الأَنْبارِيّ بين الآل والسراب: «والآل يكون بالضحى، وهو يرفع كل شيء. والسراب يكون نصف النهار، وهو الذي يلزق بالأرض» [@ibn-al-anbari، ص571]."
  - term: "رَقَصَ"
    text: "اضطرب ارتفاعًا وانخفاضًا: «قد أرقص القوم في سيرهم، إذا ارتفعوا وانخفضوا» [@ibn-al-anbari، ص572]."
  - term: "اجْتَابَ"
    text: "«اجتاب: لبس» [@ibn-al-anbari، ص571]. وفي اللسان: «واجْتَبْتُ القَمِيصَ إِذَا لَبِسْتَه» [@lisan، ج1 ص286]."
  - term: "إِكَامُهَا"
    text: "«جمع أكمة، وهي المكان المرتفع» [@ibn-al-anbari، ص572]."
syntax:
  - "«فَبِتِلْكَ» جار ومجرور متعلق بـ«أَقْضِي» في البيت التالي: «والباء صلة أقضى» [@ibn-al-anbari، ص572]، وفي اللسان: «والباءُ فِي بِتِلْكَ مُتَعَلِّقَةٌ بِقَوْلِهِ أَقْضي فِي الْبَيْتِ الَّذِي بَعْدَهُ» [@lisan، ج1 ص286]. فالبيت لا يتم معناه إلا بما بعده، وهذا ما يسمّيه العروضيون التضمين."
  - "«إِذْ» ظرف لما مضى مضاف إلى جملة «رَقَصَ اللَّوَامِعُ»، و«بِالضُّحَى» متعلق بـ«رَقَصَ». وجملة «وَاجْتَابَ ... إِكَامُهَا» معطوفة عليها، و«إِكَامُهَا» فاعل، والضمير للأرض المفهومة من السياق."
morphology:
  - "«اجْتَاب» على «افتعل» من «جاب يجوب»، أصله «اجْتَوَبَ»، قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها."
  - "«اللَّوَامِع» جمع «لامعة» على «فواعل»، صفة لموصوف محذوف هو الآل."
  - "«أَرْدِيَة» جمع «رِداء» على «أَفْعِلة»، و«إِكَام» جمع «أَكَمة» على «فِعال» [@ibn-al-anbari، ص572]."
rhetoric:
  thesis: "عودة من الحكاية إلى الناقة، ومن الليل والمطر إلى حرّ الضحى. والصورة كلها حركة: سراب يرقص، وتلال تلبس."
  devices:
    - title: "الاستعارة"
      text: "«رَقَصَ اللَّوَامِعُ» و«اجْتَابَ أَرْدِيَةَ السَّرَابِ إِكَامُهَا»: جعل السراب يرقص، وجعل التلال تلبس السراب أردية، وقال ابن الأَنْبارِيّ: «شبه السراب بالأردية» [@ibn-al-anbari، ص571]. والاستعارة: أن تريد تشبيه شيء بشيء فتترك لفظ التشبيه وتأتي باسم المشبه به. ويورد أبو هِلال العَسْكَرِيّ هذا البيت في أمثلة الاستعارة من أشعار المتقدمين [@sinaatayn، ص282، ص284]."
    - title: "الكناية"
      text: "الصورة كلها عند الزَّوْزَنِيّ «كناية عن احتدام الهواجر» [@zawzani، ص192]: لا يقول إن الحر شديد، بل يذكر ما يُرى من أثره. والكناية: أن تذكر شيئًا وتريد لازمه."
    - title: "الإشارة الجامعة"
      text: "«فَبِتِلْكَ»: اسم إشارة واحد يجمع الحكايتين، فهي «الناقة التي أشبهت البقرة والأتان» كما يقول الزَّوْزَنِيّ. وبه يرجع السامع من الوحش إلى الراحلة دون تمهيد."
  connection: "ثم يتم الجملة: «أَقْضِي اللُّبَانَةَ»، أي على هذه الناقة أقضي حاجتي ولا أقصّر فيها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَبِتِلْكَ إِذْ / رَقَصَ لْلَوَا / مِعُ بِضْضُحَى = متَفاعلن / متَفاعلن / متَفاعلن — وَجْتَابَ أَرْ / دِيَةَ سْسَرَا / بِ إِكَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "سلم الصدر من الزحاف، ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من العجز."
context: "أول بيتي العودة إلى الناقة (53–54). كان الشاعر قد خرج من الناقة إلى الأتان في البيت 25، ثم إلى البقرة في البيت 36، وهنا يعود إليها."
