first: "فَتَقَصَّدَتْ مِنْهَا كَسَابِ فَضُرِّجَتْ"
second: "بِدَمٍ وَغُودِرَ فِي الْمَكَرِّ سُحَامُهَا"
meaning: "فقتلت البقرة من الكلاب كلبة اسمها «كَسَابِ» فتلطخت بالدم، وتُركت أخرى اسمها «سُحَام» صريعة في موضع الكرّ. قال الزَّوْزَنِيّ: «فقتلت البقرة كساب من جملة تلك الكلاب فحمّرتها بالدم وتركت سخامًا في موضع كَرّها صريعة، أي قتلت هاتين الكلبتين» [@zawzani، ص191]."
vocabulary:
  - term: "تَقَصَّدَتْ"
    text: "في معناه وجهان عند ابن الأَنْبارِيّ. الأول أن البقرة قصدت الكلبة: «قصدت البقرة التي يقال لها كساب فضرجتها بالدم، أي لطختها» [@ibn-al-anbari، ص570]. والثاني أن الكلبة قصدت البقرة: «ويقال: تقصدت معناه قصدت نحو البقرة من الكلاب كلبة يقال لها كساب» [@ibn-al-anbari، ص570]. ومن معانيه القتل: «أقصد وتقصّد: قتل» [@zawzani، ص191]، وفي اللسان: «وتَقَصَّدَ الكلبُ وَغَيْرُهُ أَي مَاتَ» [@lisan، ج3 ص356]."
  - term: "كَسَابِ"
    text: "«كساب، مبنية على الكسرة: اسم كلبة» [@zawzani، ص191]."
  - term: "ضُرِّجَتْ"
    text: "«التضريج: التحمير بالدم» [@zawzani، ص191]."
  - term: "غُودِرَ"
    text: "«معناه ترك. وسمى الغدير غديرا لأن السيل غادره» [@ibn-al-anbari، ص570]."
  - term: "الْمَكَرِّ"
    text: "«ويريد بالْمَكرّ موضع كَرّها» [@zawzani، ص191]."
  - term: "سُحَامُهَا"
    text: "اسم كلبة أخرى. وفي اللسان: «وسُحَيمٌ وسُحامٌ: مِنْ أَسماء الْكِلَابِ» [@lisan، ج12 ص282]."
syntax:
  - "«وكساب موضعها نصب بتقصدت، أي قصدت البقرة كساب. ويجوز أن تكون في موضع رفع على معنى قصدت كساب نحو البقرة فطعنتها البقرة» [@ibn-al-anbari، ص571]."
  - "«مِنْهَا» أي من الكلاب، متعلق بـ«تَقَصَّدَتْ». و«فَضُرِّجَتْ» معطوف بالفاء، ونائب فاعله ضمير «كَسَابِ». و«سُحَامُهَا» نائب فاعل «غُودِرَ»، والضمير للكلاب."
morphology:
  - "«كَسَابِ» علم مؤنث على «فَعَالِ»، مبني على الكسر عند أهل الحجاز: «وكساب مخفوضة في كل حال، لأنها بمنزلة قطام وحذام» [@ibn-al-anbari، ص571]، وعلة الكسر عنده «لأنها معدولة عن كاسبة إلى كاسب» [@ibn-al-anbari، ص571]. «وبنو تميم يجعلونها بمنزلة زينب» [@ibn-al-anbari، ص571]، أي يعربونها ويمنعونها من الصرف. وقَطَامِ وحَذَامِ علمان مؤنثان على هذا الوزن."
  - "«تَقَصَّدَ» على «تفعّل» من القصد، و«المَكَرّ» اسم مكان على «مَفْعَل» من «كرّ يكُرّ»."
  - "«غُودِرَ» ماضٍ مبني للمجهول من «غادر» على «فاعَل»، قُلبت ألفه واوًا لانضمام ما قبلها."
rhetoric:
  thesis: "تنتهي المعركة بالأسماء: الكلاب التي كانت «غُضْفًا دَوَاجِنَ» صار لها اسمان، كَساب وسُحام، كأنها قتلى وقعة يُعدّ صرعاها."
  devices:
    - title: "تسمية الصرعى"
      text: "«كَسَابِ ... سُحَامُهَا»: ذكر الكلبتين باسميهما كما يُذكر القتلى في أخبار الحروب، فارتفع الصيد إلى وقعة. واسم «كَسَابِ» من الكسب، وقد وصف القاتلات في البيت 38 بأنها «كَوَاسِبُ»؛ فالتي تكسب صارت هي الكسب. وهذه قراءتنا."
    - title: "الإمساك عن الخاتمة"
      text: "لا يقول الشاعر أنجت البقرة أم هلكت، بل يتركها في «الْمَكَرِّ» بين كلبة مضرّجة وأخرى صريعة، ثم يعود إلى ناقته. فالحكاية تنتهي على أشد لحظاتها. وهذه قراءتنا."
  connection: "ثم يقطع الحكاية ويعود إلى ناقته: «فَبِتِلْكَ»، أي بتلك الناقة التي تشبه البقرة يقضي حاجته."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَتَقَصْصَدَتْ / مِنْهَا كَسَا / بِ فَضُرْرِجَتْ = متَفاعلن / مُتْفاعلن / متَفاعلن — بِدَمِنْ وَغُو / دِرَ فِلْمَكَرْ / رِ سُحَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر، وسلم العجز."
context: "آخر أبيات الصباح والرماة والكلاب (44–52)، وبه تنتهي حكاية البقرة التي بدأت في البيت 36."
variants:
  - reading: "بِدَمٍ وَغُودِرَ فِي الْمَكَرِّ سُخَامُهَا"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "بالخاء المعجمة: «وكذلك سخام وقد روي بالحاء المهملة» [@zawzani، ص191]. ويذكر محقق الديوان أن رواية الحاء في اللسان والتاج [@diwan-labid، ص312]."
