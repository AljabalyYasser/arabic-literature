first: "وَهُمُ رَبِيعٌ لِلْمُجَاوِرِ فِيهِمُ"
second: "وَالْمُرْمِلَاتِ إِذَا تَطَاوَلَ عَامُهَا"
meaning: "وهم لمن جاورهم ربيع يحيا به، وللنساء اللواتي نفد زادهن إذا طالت عليهن السنة الجدبة. قال الزَّوْزَنِيّ: «يقول: هم لمن جاورهم ربيع لعموم نفعهم وإحيائهم إياه بجودهم كما يحيي الربيع الأرض» [@zawzani، ص201]."
vocabulary:
  - term: "رَبِيعٌ"
    text: "«معناه هم بمنزلة الربيع للجار الجنب» [@ibn-al-anbari، ص596]، والجار الجُنُب: الغريب."
  - term: "الْمُجَاوِرِ"
    text: "الجار النازل فيهم."
  - term: "الْمُرْمِلَاتِ"
    text: "«المرملات: اللواتي لا أزواد لهن. يقال: أقتر الرجل، وأرمل، وأقوى، وأنفض، إذا ذهب زاده» [@ibn-al-anbari، ص596]. وجعلهن التِّبْرِيزِيّ «اللواتي قد مات أزواجهن» [@tabrizi-ashr، ص175]. وفي اللسان عن ابن الأَنْبارِيّ: «الأَرْمَلَة الَّتِي مَاتَ عَنْهَا زوجُها؛ سُمِّيت أَرْمَلَة لِذَهَابِ زَادِهَا وفَقْدِها كاسِبَها» [@lisan، ج11 ص297]."
  - term: "تَطَاوَلَ عَامُهَا"
    text: "طالت سنتها، أي اشتدت، «لأن زمان الشدة يستطال» [@zawzani، ص201]."
syntax:
  - "«وَهُمُ رَبِيعٌ» مبتدأ وخبر، وأُخبر بالمفرد «رَبِيعٌ» عن الجمع لأنه تشبيه. و«لِلْمُجَاوِرِ» متعلق بـ«رَبِيعٌ» لما فيه من معنى النفع، و«فِيهِمُ» متعلق بـ«الْمُجَاوِرِ»."
  - "«وَالْمُرْمِلَاتِ» معطوف على «الْمُجَاوِرِ» مجرور باللام."
  - "«إِذَا تَطَاوَلَ عَامُهَا» ظرف شرطي، و«عَامُهَا» فاعل «تَطَاوَلَ»، والهاء للمرملات، أو لكل واحدة منهن؛ وفي تفسير الزَّوْزَنِيّ: «إذا تطاول عامها لسوء حالها» [@zawzani، ص201]."
morphology:
  - "«مُرْمِلات» جمع «مُرْمِلة»، اسم فاعل من «أرمل» على «أفعل»: «أرمل القوم: إذا نفدت أزوادهم» [@zawzani، ص201]."
  - "«تَطاوَلَ» على «تفاعل» للمبالغة في الطول، لا للمشاركة."
  - "«الْمُجاوِر» اسم فاعل من «جاور» على «فاعل»، و«رَبِيع» على «فَعِيل»."
rhetoric:
  thesis: "يختم وصف القوم بصورة الربيع: هم خصب الناس في الجدب."
  devices:
    - title: "التشبيه البليغ"
      text: "«وَهُمُ رَبِيعٌ»: لم يقل كالربيع، بل جعلهم الربيع نفسه، وهو عند عبد القاهر الجُرْجانيّ «تشبيه على حدّ المبالغة» [@dalail، ص68]. والشبه لا يُدرك بالعين، بل بالنظر: الربيع يحيي الأرض وهم يحيون من جاورهم، فهو من التشبيه الذي يكون فيه الشبه «محصّلاً بضرب من التأوّل» [@asrar، ص90]."
    - title: "المجاز في «تطاول عامها»"
      text: "العام لا يطول، لكن الشدة تجعله طويلًا في نفس صاحبه، كما يقول الزَّوْزَنِيّ. ويرى التِّبْرِيزِيّ في العام عدّة الأرملة: «لأن المرأة كانت إذا توفي عنها زوجها أقامت عاما» [@tabrizi-ashr، ص175]."
    - title: "المقابلة"
      text: "بين «رَبِيعٌ» و«تَطَاوَلَ عَامُهَا»: الربيع زمن قصير مخصب، والعام الجدب طويل، وقومه هم الذين يقصّرون طول الشدة. وهذه قراءتنا."
  connection: "وفي البيت الأخير يجعلهم العشيرة الكاملة التي لا يجد الحاسد ولا اللائم إليها سبيلًا."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَهُمُو رَبِي / عُنْ لِلْمُجَا / وِرِ فِيهِمُو = متَفاعلن / مُتْفاعلن / متَفاعلن — وَلْمُرْمِلَا / تِ إِذَا تَطَا / وَلَ عَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثانية من الصدر، والأولى من العَجُز. وتُشبع ضمة الميم في «وَهُمُ» و«فِيهِمُ» فتُنطقان «وَهُمُو» و«فِيهِمُو»."
context: "عاشر أبيات الفخر بالقوم. والقصيدة التي بدأت بديار سقتها الأمطار وأنبتت، تكاد تنتهي بقوم هم الربيع نفسه لمن جاورهم. وهذه قراءتنا."
