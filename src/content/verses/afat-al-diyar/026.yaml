first: "يَعْلُو بِهَا حَدَبَ الْإِكَامِ مُسَحَّجًا"
second: "قَدْ رَابَهُ عِصْيَانُهَا وَوِحَامُهَا"
meaning: "يصعد العير بأتانه ما ارتفع من التلال، وقد عضّته الحمر وخدشته، وأقلقه منها أنها تمتنع عليه وهي تشتهيه. قال الزَّوْزَنِيّ: «يقول: يعلي هذا الفحل الأتان والإكام إتعابًا لها وإبعادًا بها عن الفحول وقد شككه في أمرها عصيانها إياه في حال حملها واشتهاؤها إياه قبله» [@zawzani، ص182]."
vocabulary:
  - term: "حَدَبَ"
    text: "«الحدب: ما ارتفع من الأرض» [@ibn-al-anbari، ص542]، وعند الزَّوْزَنِيّ: «حدبها: ما احدودب منها» [@zawzani، ص182]."
  - term: "الْإِكَامِ"
    text: "جمع «أكمة، وهي أشد ارتفاعا مما حولها غليظة» [@ibn-al-anbari، ص543]، أي التلال الصغيرة."
  - term: "مُسَحَّجًا"
    text: "«معضض قد عضضته الحمير. والسحج: جرح ليس بغامض» [@ibn-al-anbari، ص543]، أي ليس بعميق. وعند الزَّوْزَنِيّ: «السحج: القشر والخدش العنيف» [@zawzani، ص182]."
  - term: "رَابَهُ"
    text: "أوقعه في الريبة، وبه فسّره الزَّوْزَنِيّ: «وقد شككه في أمرها» [@zawzani، ص182]."
  - term: "عِصْيَانُهَا"
    text: "«امتناعها عليه» [@ibn-al-anbari، ص543]."
  - term: "وِحَامُهَا"
    text: "«الوحم: الشهوة على الحمل؛ يقال امرأة وحمى، إذا اشتهت على حملها» [@ibn-al-anbari، ص543]. وفي لسان العرب عن الأَزْهَرِيّ: «وَالْمَعْنَى فِي قَوْلِهِ وِحَامُها شهوةُ الأُتُنِ للعَير» [@lisan، ج12 ص631]."
syntax:
  - "«يَعْلُو» فاعله ضمير العير، و«بِهَا» متعلق به، والباء للتعدية: يعلو بها أي يُصعدها. و«حَدَبَ» مفعول به."
  - "«مُسَحَّجًا» حال، وفي البيت رواية بالرفع: «فمن نصبه نصبه على الحال مما في يعلو. ومن رفعه رفعه بيعلو» [@ibn-al-anbari، ص543]، أي يكون «مُسَحَّجٌ» فاعل «يَعْلُو»."
  - "جملة «قَدْ رَابَهُ» حال ثانية، و«عِصْيَانُهَا» فاعل «رَابَ»، و«وِحَامُهَا» معطوف عليه."
morphology:
  - "«مُسَحَّج» اسم مفعول من «سحّج» على «فعّل»، «والتسحيج مبالغة السّحج» [@zawzani، ص182]، أي كثرة الخدش."
  - "«إِكَام» جمع «أكمة»، «ويقال أكمة وإكام، وأكم، وآكام» [@ibn-al-anbari، ص543]."
  - "«وِحَام» مصدر «وحِم يوحَم» على «فِعال»: «الوِحَام والوحم والوَحَام: اشتهاء الحبلى الشيء» [@zawzani، ص182]."
rhetoric:
  thesis: "يرسم العير غيورًا قلقًا: جسده مخدوش من معارك الفحول، وقلبه مرتاب من أتانه التي تمنعه وتشتهيه معًا."
  devices:
    - title: "الطباق في «عِصْيَانُهَا وَوِحَامُهَا»"
      text: "الطباق: الجمع بين ضدين في الكلام. وقد جمع في الأتان ضدين: الامتناع والرغبة. وقد خفي هذا على اللَّيْث فظن الكلمتين بمعنى واحد، فردّه الأَزْهَرِيّ: «يَظُنُّ أَنه لَمَّا عَطَفَ قولَه ووِحَامُها عَلَى عصيانُها أَنهما شيءٌ وَاحِدٌ»، ثم قال: «أَراد أَنها تَرْمَحُه مرَّةً وَتَسْتَعْصِي عَلَيْهِ مَعَ شَهْوَتِهَا لضِرابِه إِياها، فَقَدْ رابَه ذَلِكَ مِنْهَا حِينَ أَظهرت شَيْئَيْنِ متضادَّين» [@lisan، ج12 ص631]. فالريبة تأتي من التناقض نفسه."
    - title: "شعور إنساني في الحيوان"
      text: "«رَابَهُ» لفظ من أحوال النفس: الشك والقلق. فالعير عند لَبِيد لا يسوق أتانه بالغريزة وحدها، بل يرتاب ويحتاط. وهذه قراءتنا."
    - title: "لماذا يعلو بها؟"
      text: "في «يَعْلُو بِهَا حَدَبَ الْإِكَامِ» تعليلان قديمان: عند الزَّوْزَنِيّ يفعل ذلك «إتعابًا لها وإبعادًا بها عن الفحول» [@zawzani، ص182]، وعند أبي جَعْفَر: «يعسفها عسفا ليس يهتم إلا بطردها، لا يبالي أين سلكت. وإنما يعلو بها خوف الرامي» [@ibn-al-anbari، ص543]. فالغيرة والحذر من الصياد كلاهما يسوقه."
  connection: "ثم يحدد المكان: آكام الثَّلَبُوت، والعير فوقها كالرقيب يخاف الأعلام [@ibn-al-anbari، ص543–544]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "يَعْلُو بِهَا / حَدَبَلْ إِكَا / مِ مُسَحْحَجَنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — قَدْ رَابَهُو / عِصْيَانُهَا / وَوِحَامُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من الصدر، والأولى والثانية من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وأُشبعت ضمة الهاء في «رَابَهُ» حتى صارت واوًا، كما يقتضي الوزن."
context: "من أبيات الأتان وفحلها (25–35). بعد أن عرّف الأتان وفحلها في البيت السابق يبدأ بحكاية ما بينهما: يسوقها إلى المرتفعات بعيدًا عن الفحول والصيادين."
