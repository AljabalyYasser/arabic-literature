first: "غُلْبٍ تَشَذَّرُ بِالذُّحُولِ كَأَنَّهَا"
second: "جِنُّ الْبَدِيِّ رَوَاسِيًا أَقْدَامُهَا"
meaning: "وفي ذلك المجلس رجال غلاظ الرقاب، يتوعّد بعضهم بعضًا بسبب أحقاد قديمة، كأنهم جنّ وادي البديّ، ثابتة أقدامهم لا تتزحزح. قال الزَّوْزَنِيّ: «وهم رجال غلاظ الأعناق كالأسود... يهدد بعضهم بعضًا بسبب الأحقاد التي بينهم، ثم شبههم بجن هذا الموضع في ثباتهم في الخصام والجدال» [@zawzani، ص197]."
vocabulary:
  - term: "غُلْبٍ"
    text: "«الغلب: الغلاظ الرقاب» [@ibn-al-anbari، ص586]. وقال بعض أهل اللغة: «الأغلب: الجاسي العنق لا يلتفت من شدته. قال: وهذه صفة الأسد» [@ibn-al-anbari، ص586]."
  - term: "تَشَذَّرُ"
    text: "تتهيّأ وتتوعّد. قال ابن الأَنْبارِيّ: «معناه تقمطر وينتصب بعضهم لبعض، يصف به القوم، بمنزلة تشذر الناقة، وهو عقدها ذنبها» [@ibn-al-anbari، ص586]، وقال أبو جَعْفَر: «يوعد بعضها بعضا كتشذر الفحولة بعضها لبعض» [@ibn-al-anbari، ص586]. وفي اللسان: «وقيل: التشذر التوعد والتهدد» [@lisan، ج4 ص399]."
  - term: "الذُّحُولِ"
    text: "«الأحقاد، الواحد ذحل» [@zawzani، ص197]، وهي الثارات القديمة."
  - term: "الْبَدِيِّ"
    text: "«واد لبني عامر» [@ibn-al-anbari، ص587]. وينقل البَغْداديّ عن ابن السِّيد أنه «واد تسكنه الجن»، وعن الأَصْمَعِيّ أنه «واد لبني سعد» [@khizana، ج9 ص519]."
  - term: "رَوَاسِيًا"
    text: "«ثابتة» [@ibn-al-anbari، ص586]. «والجبل الراسي هو الثابت» [@ibn-al-anbari، ص586]."
syntax:
  - "«وغلب يختفض بالنعت لكثيرة، لأن المعنى وجماعة غلب» [@ibn-al-anbari، ص587]. ومن رواه «غُلْبٌ» بالرفع جعله «خبر لمبتدأ محذوف هو ضمير الغرباء أي: هم غلب» [@khizana، ج9 ص518]."
  - "«بِالذُّحُولِ»: الباء للسببية، وعليه استشهد به البَغْداديّ [@khizana، ج9 ص516]؛ وفسّرها ابن الأَنْبارِيّ باللام: «معناه للذحول» [@ibn-al-anbari، ص586]، وفي اللسان: «أي من أجل الذحول» [@lisan، ج15 ص443]."
  - "«وجملة: كأنها جن حال من ضمير غلب في تشذر» [@khizana، ج9 ص519]. و«رواسيا منصوب على الحال... وأقدامها رفع برواس» [@tabrizi-ashr، ص168]، أي فاعل لاسم الفاعل."
morphology:
  - "«غُلْب» جمع «أغلب»، «والأنثى غلباء» [@khizana، ج9 ص518]، على «فُعْل» جمع «أفعل فعلاء»."
  - "«وتشذر أصله تتشذر» [@khizana، ج9 ص518]، حُذفت إحدى التاءين تخفيفًا."
  - "«رَوَاسِي» جمع «راسية» على «فواعل»، وهو ممنوع من الصرف، لكنه نُوّن هنا: «وصرفه للضرورة» [@tabrizi-ashr، ص168]، أي لإقامة الوزن."
rhetoric:
  thesis: "يعظّم لبيد خصومه ليعظم انتصاره عليهم: فهم أسود في رقابهم، وجنّ في ثباتهم."
  devices:
    - title: "مدح الخصم"
      text: "قال الزَّوْزَنِيّ: «يمدح خصومه، وكلما كان الخصم أقوى وأشد كان قاهره وغالبه أقوى وأشد» [@zawzani، ص197]. فالبيت كله تمهيد للبيت التالي: «أنكرت باطلها»."
    - title: "الاستعارة"
      text: "«غُلْبٍ»: جعلهم أسودًا غلاظ الرقاب عند الطُّوسِيّ، أو إبلًا فحولًا عند ابن السِّيد، قال البَغْداديّ: «وعليهما فهو استعارة تصريحية» [@khizana، ج9 ص518]. والاستعارة التصريحية: أن يُذكر المشبَّه به ويُحذف المشبَّه. وهي عند عبد القاهر الجُرْجانيّ الضرب الذي «تجعل الشيء الشيء ليس به» [@dalail، ص67]."
    - title: "التشبيه"
      text: "«كَأَنَّهَا جِنُّ الْبَدِيِّ رَوَاسِيًا أَقْدَامُهَا»: لم يشبههم بالجن في هيئتهم، بل «في ثباتهم في الخصام والجدال» [@zawzani، ص197]؛ ووصف الجن بأنهم «رواسي» الأقدام كالجبال، فجمع الخوف والثبات في صورة واحدة."
    - title: "الإشارة"
      text: "أورد الجاحِظ البيت في «البيان والتبيين» شاهدًا على إشارة الخطباء بأيديهم: «وقال لبيد بن ربيعة في الإشارة» [@bayan، ج1 ص296]. وعلى هذا يكون «التشذّر» حركة المتفاخرين، وقيل فيه: «رفع اليد ووضعها، أي أنهم كانوا يفعلون ذلك إذا تفاخروا وتثالبوا» [@tabrizi-ashr، ص168]."
  connection: "ثم يأتي جواب «ورُبّ كثيرة غرباؤها»: أنكر باطلهم، واعترف بحقهم، فلم يفخر عليه كريم منهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "غُلْبِنْ تَشَذْ / ذَرُ بِذْذُحُو / لِ كَأَنْنَهَا = مُتْفاعلن / متَفاعلن / متَفاعلن — جِنْنُلْ بَدِيْ / يِ رَوَاسِيَنْ / أَقْدَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز. وتنوين «رَوَاسِيًا» يقيم الوزن، ولو مُنع من الصرف لنقص مقطع."
context: "ثاني أبيات المقام عند الملوك. والبيت شاهد عند البَغْداديّ على أن الباء فيه للسببية [@khizana، ج9 ص516]، وعند الجاحِظ على الإشارة في الخطابة [@bayan، ج1 ص296]."
variants:
  - reading: "غُلْبٌ تَشَذَّرُ بِالذُّحُولِ كَأَنَّهَا"
    status: "رواية التِّبْرِيزِيّ والديوان"
    note: "بالرفع [@tabrizi-ashr، ص168] [@diwan-labid، ص317]، وبها أنشده صاحب اللسان [@lisan، ج4 ص399] والبَغْداديّ [@khizana، ج9 ص516]."
  - reading: "غُلْبٍ تَشَازَرُ بِالذُّحُولِ"
    status: "رواية أخرى"
    note: "ذكرها ابن الأَنْبارِيّ [@ibn-al-anbari، ص587]، «وتشازرهم: نظر بعضهم إلى بعض بمآخير أعينهم» [@tabrizi-ashr، ص168]، أي بأطرافها، كما ينظر المغضب."
