first: "وَالْوَحْشُ سَاكِنَةٌ عَلَى أَطْلَائِهَا"
second: "عُوذًا تَأَجَّلُ بِالْفَضَاءِ بِهَامُهَا"
meaning: "والوحش مطمئنة في الديار مقيمة على صغارها، حديثات الولادة، وصغارها تجتمع قطيعًا قطيعًا في الأرض الواسعة. قال الزَّوْزَنِيّ: «فالمعنى من هذا الكلام: أنها صارت مغنى الوحوش بعد كونها مغنى الإنس» [@zawzani، ص174]. والمَغْنى: المنزل الذي يُقام فيه."
vocabulary:
  - term: "سَاكِنَةٌ"
    text: "«معناه هي في قفر آمنة لا تنفر» [@ibn-al-anbari، ص525]."
  - term: "أَطْلَائِهَا"
    text: "«الأولاد، واحدها طلا» [@ibn-al-anbari، ص525]؛ والطَّلا عند الزَّوْزَنِيّ: «ولد الوحش حين يولد إلى أن يأتي عليه شهر» [@zawzani، ص174]."
  - term: "عُوذًا"
    text: "«التي نتجت حديثا، واحدها عائذ» [@ibn-al-anbari، ص525]. «وقال الأصمعي: كان ينبغي أن يقال للولد عائذ فجعل للأم» [@ibn-al-anbari، ص526]، لأن الصغير هو الذي يعوذ بأمه."
  - term: "تَأَجَّلُ"
    text: "«تجتمع، من الإجل، وهو القطيع من الظباء، وربما استعمل في البقر»، «فأراد بتأجل: تصير آجالا» [@ibn-al-anbari، ص525–526]."
  - term: "بِهَامُهَا"
    text: "جمع بَهْمة، «وهي من أولاد الضأن خاصة، ومجرى البقرة الوحشية مجرى الضائنة في كل شيء» [@ibn-al-anbari، ص526]. والفضاء: «المتسع من الأرض» [@ibn-al-anbari، ص526]."
syntax:
  - "«الْوَحْشُ» مبتدأ، و«سَاكِنَةٌ» خبره، و«عَلَى أَطْلَائِهَا» متعلق بـ«سَاكِنَةٌ»."
  - "«وعوذا نصب على الحال» [@ibn-al-anbari، ص526]، وعند الزَّوْزَنِيّ «على الحال من العين» [@zawzani، ص174] على روايته، أي حال كونها حديثات النتاج."
  - "«بِهَامُهَا» فاعل «تَأَجَّلُ»، والجملة مستأنفة أو حال ثانية، و«بِالْفَضَاءِ» متعلق بالفعل."
morphology:
  - "«تَأَجَّلُ» مضارع أصله «تَتَأَجَّلُ» على «تتفعّل»، حُذفت إحدى التاءين تخفيفًا، ومعنى «تفعّل» هنا الصيرورة: تصير آجالًا."
  - "«عُوذ» جمع «عائذ» على «فُعْل»، قال الزَّوْزَنِيّ: «وجمع الفاعل على فُعْل قليل معول فيه على الحفظ» [@zawzani، ص174]، أي لا يُقاس عليه."
  - "«بِهَام» جمع «بَهْم»، و«بَهْم» جمع «بَهْمة» [@zawzani، ص174]، فهو جمع الجمع."
rhetoric:
  thesis: "صورة سلام في مكان الخراب: أمهات مطمئنة لا تنفر، وصغار تجتمع وترعى. الديار صارت مرعى للوحش كما كانت مرعى لإبل أهلها."
  devices:
    - title: "«سَاكِنَةٌ»"
      text: "في اللفظ معنيان: السكون ضد النفور، والسُّكنى في الدار. فالوحش ساكنة لأنها آمنة، وساكنة لأنها صارت سكان الديار مكان أهلها. والمعنى الثاني قراءتنا، وهو قريب من قول الزَّوْزَنِيّ إن الديار صارت «مغنى الوحوش بعد كونها مغنى الإنس» [@zawzani، ص174]."
    - title: "الاستعارة"
      text: "الاستعارة: أن يُستعمل اللفظ في غير ما وُضع له لشبه بينهما. وفي «بِهَامُهَا» استعار لأولاد البقر الوحشية اسم صغار الضأن. وفي لسان العرب: «وقد جعل لبيد أولاد البقر بهاما» [@lisan، ج12 ص57]. فرسم القطيع الوحشي قطيعًا من الغنم يرعى بين البيوت، والبيوت خالية."
  connection: "ثم يعود إلى الأطلال نفسها: كشفتها السيول فظهرت كأنها كتب جُدّدت [@ibn-al-anbari، ص526]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَلْوَحْشُ سَا / كِنَةُنْ عَلَا / أَطْلَائِهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن — عُوذَنْ تَأَجْ / جَلُ بِلْفَضَا / ءِ بِهَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلتين الأولى والثالثة من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "يتم صورة الوحش في الديار التي بدأت بالظباء والنعام في البيت السابق. والبقر الوحشية التي تظهر هنا مطمئنة على أولادها ستعود في البيت 36 بقرةً فقدت ولدها."
variants:
  - reading: "وَالْعِينُ سَاكِنَةٌ عَلَى أَطْلَائِهَا"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "العِين: «البقر، واحدتها عيناء. وإنما سميت عينا لضخم أعينها» [@ibn-al-anbari، ص525]. وبها روى الزَّوْزَنِيّ [@zawzani، ص174] والديوان [@diwan-labid، ص299] والجمهرة [@jamhara، ص239] ولسان العرب [@lisan، ج11 ص11]."
