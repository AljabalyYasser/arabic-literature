first: "لِمُعَفَّرٍ قَهْدٍ تَنَازَعَ شِلْوَهُ"
second: "غُبْسٌ كَوَاسِبُ لَا يُمَنُّ طَعَامُهَا"
meaning: "تطوف وتصيح من أجل ولد صغير أبيض، تجاذبت بقية جسده ذئاب غُبْر اللون، تكسب قوتها بنفسها ولا يتفضل عليها أحد بطعام. قال الزَّوْزَنِيّ: «هي تطوف وتبغم لأجل جؤذر ملقى على الأرض أبيض، قد تجاذبت أعضاءه ذئاب أو كلاب غبس» [@zawzani، ص187]. والجُؤْذَر: ولد البقرة الوحشية."
vocabulary:
  - term: "لِمُعَفَّرٍ"
    text: "فيه قولان. الأول: «المعفر: الذي يترك من الرضعة والرضعتين حتى يستمر، وذلك إذا أرادت أمه أن تفطمه؛ وهو التعفير» [@ibn-al-anbari، ص556]، أي الصغير الذي تُعوّده أمه الفطام. والثاني: «وقال الأصمعي: المعفر: الذي عفر بالتراب» [@ibn-al-anbari، ص556]. ورجّح الأَزْهَرِيّ الثاني فيما ينقل اللسان: «وَقِيلَ فِي تَفْسِيرِ المُعَفَّر فِي بَيْتِ لَبِيدٍ إِنه وَلَدُهَا الَّذِي افْتَرَسَتْه الذئابُ الغُبْسُ فعَفَّرته فِي التُّرَابِ أَي مَرَّغَتْهُ. قَالَ: وَهَذَا عِنْدِي أَشْبَه بِمَعْنَى الْبَيْتِ» [@lisan، ج4 ص585]."
  - term: "قَهْدٍ"
    text: "عند ابن الأَنْبارِيّ «ضرب من الضأن تصغر آذانهن تعلوهن حمرة» [@ibn-al-anbari، ص556]، وعند الزَّوْزَنِيّ «القهد: الأبيض» [@zawzani، ص186]. وفي اللسان: «وصَف بَقَرَةً وَحْشِيَّةً أَكلت السباعُ ولدَها فَجَعَلَهُ قَهْداً لِبَيَاضِهِ» [@lisan، ج3 ص370]."
  - term: "شِلْوَهُ"
    text: "«بقيته. وشلو كل شيء: بقيته» [@ibn-al-anbari، ص556]."
  - term: "غُبْسٌ"
    text: "من الغُبْسة، وهي «صفرة إلى سواد» [@ibn-al-anbari، ص556]."
  - term: "كَوَاسِبُ"
    text: "«ذئاب تكسب ما تأكل» [@ibn-al-anbari، ص556]."
  - term: "لَا يُمَنُّ طَعَامُهَا"
    text: "عند ابن الأَنْبارِيّ من المنّ بالعطاء: «ليس طعامها من عطاء أحد يمنه، إنما هو كسبها» [@ibn-al-anbari، ص556]. وعند الزَّوْزَنِيّ من المنّ بمعنى القطع: «لا يقطع طعامها، أي لا تفتر في الاصطياد فينقطع طعامها» [@zawzani، ص187]."
syntax:
  - "«واللام صلة يرم» [@ibn-al-anbari، ص556]، أي «لِمُعَفَّرٍ» متعلق بالفعل «يَرِمْ» في البيت السابق؛ «ويقال اللام معناها من أجل» [@ibn-al-anbari، ص556]، أي لم يبرح طوافها من أجل ولد معفَّر."
  - "«قَهْدٍ» نعت لـ«مُعَفَّرٍ»، وجملة «تَنَازَعَ شِلْوَهُ غُبْسٌ» نعت ثانٍ، و«غُبْسٌ» فاعل «تَنَازَعَ»، و«كَوَاسِبُ» نعته."
  - "«يُمَنُّ» فعل مبني للمجهول، و«طَعَامُهَا» نائب فاعله: «والطعام اسم ما لم يسم فاعله» [@ibn-al-anbari، ص556]."
morphology:
  - "«مُعَفَّر» اسم مفعول من «عفّر» المضعّف، من العَفَر وهو التراب، والتضعيف للتكثير. قال الزَّوْزَنِيّ: «العفو والتعفير: الإلقاء على العَفْر والعَفَر وهما أديم الأرض» [@zawzani، ص186]، و«العفو» في المطبوع صوابها «العفر». وأديم الأرض: وجهها."
  - "«غُبْس» جمع «أَغْبَس» و«غَبْساء» على «فُعْل»: «الغبس جمع أغبس وغبساء» [@zawzani، ص186]، كأَحْمَر وحُمْر."
  - "«كَوَاسِب» جمع «كاسبة» على «فواعل»، ممنوع من الصرف لأنه على صيغة منتهى الجموع."
  - "«تَنَازَعَ» على «تفاعل»، وهو بناء المشاركة: تتجاذبه الذئاب كل منها إلى جهته."
rhetoric:
  thesis: "يضع الشاعر أمام السامع ما لم تره الأم: الولد الأبيض ممزقًا بين ذئاب غبر. في البيت السابق الطواف والصوت، وفي هذا الجثة، فيعرف السامع ما لا تعرفه البقرة."
  devices:
    - title: "تقابل اللونين"
      text: "«قَهْدٍ» و«غُبْسٌ»: الأبيض الصغير بين ذئاب لونها بين الصفرة والسواد، فيقع البياض في وسط الكُدرة، ويزيد المشهد قسوة. وهذه قراءتنا."
    - title: "الصفة في موضع الموصوف"
      text: "قال «غُبْسٌ كَوَاسِبُ» ولم يسمّ الذئاب، فاختلف الشارحان: هي ذئاب عند ابن الأَنْبارِيّ، و«ذئاب أو كلاب» عند الزَّوْزَنِيّ [@zawzani، ص187]. وبالصفة وحدها يبقى القاتل بلا اسم، كما بقي مجهولًا للأم."
    - title: "مدح في غير موضعه"
      text: "«لَا يُمَنُّ طَعَامُهَا»: هذه صفة يُمدح بها الرجل الذي يكسب رزقه ولا يمنّ عليه أحد، فجعلها للذئاب وهي تأكل الصغير. فالعبارة تجمع الإعجاب بقوة الذئاب والفزع منها. وهذه قراءتنا."
  connection: "ثم يقول إن الذئاب أصابت غفلة، ويختم الحكاية الأولى بحكمة: «إِنَّ الْمَنَايَا لَا تَطِيشُ سِهَامُهَا»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "لِمُعَفْفَرِنْ / قَهْدِنْ تَنَا / زَعَ شِلْوَهُو = متَفاعلن / مُتْفاعلن / متَفاعلن — غُبْسُنْ كَوَا / سِبُ لَا يُمَنْ / نُ طَعَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر والأولى من العجز. وأُشبعت ضمة الهاء في «شِلْوَهُ» حتى صارت واوًا، كما يقتضي الوزن."
context: "الثالث من أبيات البقرة المسبوعة (36–39)، وهو قلب الحكاية: ما أصاب الفرير."
variants:
