first: "وَجَلَا السُّيُولُ عَنِ الطُّلُولِ كَأَنَّهَا"
second: "زُبُرٌ تُجِدُّ مُتُونَهَا أَقْلَامُهَا"
meaning: "وكشفت السيول التراب عن أطلال الديار فظهرت بعد أن غُمرت، فكأنها كتب قديمة أعادت الأقلام كتابة سطورها. قال الزَّوْزَنِيّ: «فشبه كشف السيول عن الأطلال التي غطاها التراب بتجديد الكتّاب سطور الكتاب الدارس، وظهور الأطلال بعد دروسها بظهور السطور بعد دروسها» [@zawzani، ص175]."
vocabulary:
  - term: "جَلَا"
    text: "كشف. «معناه: جلت السيول التراب عن الطلول، أي كشفت. وكل جلاء كشف. فمنه جلاء العروس» [@ibn-al-anbari، ص526]."
  - term: "الطُّلُولِ"
    text: "الطلول والأطلال: «ما شخص من آثار الديار»، أي ما ارتفع منها، «والرسم: الأثر بلا شخص» [@ibn-al-anbari، ص526]."
  - term: "زُبُرٌ"
    text: "«جمع زبور، وهو الكتاب» [@ibn-al-anbari، ص526]. «وقال الأصمعي: زبرت: كتبت؛ وذبرت: قرأت» [@ibn-al-anbari، ص526]."
  - term: "تُجِدُّ مُتُونَهَا"
    text: "«معناه يعاد عليها الكتاب» [@ibn-al-anbari، ص526] «بعد أن درست. ومتونها: ظهورها وأوساطها، فأراد كلها ولم يخص المتون» [@ibn-al-anbari، ص527]."
syntax:
  - "«السُّيُولُ» فاعل «جَلَا»، والمفعول محذوف تقديره التراب: «جلت السيول التراب عن الطلول» [@ibn-al-anbari، ص526]."
  - "اسم «كأنّ» الضمير العائد على الطلول، و«زُبُرٌ» خبرها، «وأقلام مضافة إلى ضمير زبر» [@zawzani، ص175]."
  - "جملة «تُجِدُّ مُتُونَهَا أَقْلَامُهَا» صفة لـ«زُبُرٌ»: «أَقْلَامُهَا» فاعل تأخر، و«مُتُونَهَا» مفعول به تقدّم."
morphology:
  - "«زَبُور» على «فَعُول» بمعنى «مفعول»: «والزبور فعول بمعنى المفعول بمنزلة الركوب والحلوب بمعنى المركوب والمحلوب» [@zawzani، ص175]. وفي لسان العرب: «والزَّبُورُ: الْكِتَابُ المَزبُورُ، وَالْجَمْعُ زُبُرٌ» [@lisan، ج4 ص315]."
  - "«تُجِدُّ» مضارع «أجدّ» على «أفعل»، بمعنى «جدّد»: «الإجداد والتجديد واحد» [@zawzani، ص175]."
  - "«جَلَا يَجْلُو» ناقص واوي، ومصدره الجلاء [@zawzani، ص174]."
rhetoric:
  thesis: "البيت الذي سجد له الفرزدق: السيل الذي يمحو الديار هو نفسه يكشفها، كقلم يعيد كتابة صفحة امّحت."
  devices:
    - title: "التشبيه المركّب"
      text: "يفرّق عبد القاهر الجُرْجانيّ بين تشبيه شيئين بشيئين «ضربةً واحدةً، إلاّ أن أحدهما لا يداخل الآخر في الشَّبه»، ومثاله بيت امرئ القيس «كأنَّ قُلُوبَ الطَّير رَطْباً ويابساً»، وبين التشبيه المركّب الذي يُراد به هيئة، فإذا فُرّق لم يبق منه شيء [@asrar، ص192–193]. وبيت لَبِيد من الضرب الثاني: ففي «كَأَنَّهَا زُبُرٌ تُجِدُّ مُتُونَهَا أَقْلَامُهَا» لا يشبّه الطلول بالكتب والسيول بالأقلام فحسب، بل يشبّه فعلَ السيل بالطلل بفعل القلم بالكتاب. وهذا ما رآه ابن رَشِيق حين جعله في أثر امرئ القيس ثم قال: «فشبه الطلول بالزبر والسيول بالأقلام، بل زاد فشبه جلاء هذه عن هذه» [@ibn-rashiq، ج1 ص290] «بتجديد تلك لتلك» [@ibn-rashiq، ج1 ص291]."
    - title: "المفارقة"
      text: "السيل في الأطلال يمحو عادة، وهنا يكشف ويجدّد. فالقوة التي أعفت الديار هي التي ردّت إليها صورتها، وهذا سرّ جمال الصورة في قراءتنا."
    - title: "صورة الكتابة"
      text: "يعود إلى صورة الكتابة التي بدأها في البيت الثاني «كَمَا ضَمِنَ الْوُحِيَّ سِلَامُهَا»، ويزيدها حركة: هناك كتابة ثابتة في الصخر، وهنا أقلام تكتب الآن."
  connection: "ثم يأتي بتشبيه ثانٍ للصورة نفسها: الواشمة تعيد الوشم [@ibn-al-anbari، ص527]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَجَلَسْ سُيُو / لُ عَنِطْ طُلُو / لِ كَأَنْنَهَا = متَفاعلن / متَفاعلن / متَفاعلن — زُبُرُنْ تُجِدْ / دُ مُتُونَهَا / أَقْلَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلةَ الثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "أشهر أبيات المطلع. يروي ابن الأَنْبارِيّ بإسناده إلى المُفَضَّل الضَّبِّيّ: «قدم الفرزدق الكوفة فمر بمسجد بني أقيصر، وعليه رجل ينشد» هذا البيت، «فسجد فقيل: ما هذا يا أبا فراس؟ قال: أنتم تعرفون سجدة القرآن» [@ibn-al-anbari، ص510] «وأنا أعرف سجدة الشعر!» [@ibn-al-anbari، ص511]. ويرويه أبو الفَرَج من طريق المُفَضَّل أيضًا [@aghani-dk، ج15 ص371]. والخبر ثابت عن المُفَضَّل، وهو خبر أدبي يدل على منزلة البيت عند الشعراء."
