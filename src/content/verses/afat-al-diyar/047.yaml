first: "وَتَسَمَّعَتْ رِزَّ الْأَنِيسِ فَرَاعَهَا"
second: "عَنْ ظَهْرِ غَيْبٍ وَالْأَنِيسُ سَقَامُهَا"
meaning: "وأصغت فسمعت صوتًا خفيًا من الناس لم ترهم، فأفزعها، والناس هلاكها لأنهم يصيدونها. قال ابن الأَنْبارِيّ: «أي تسمعت البقرة صوت الأنيس فأفزعها ولم تر الناس» [@ibn-al-anbari، ص565]."
vocabulary:
  - term: "رِزَّ"
    text: "«والرّز والرّكز: الصوت الخفي» [@ibn-al-anbari، ص565]."
  - term: "الْأَنِيسِ"
    text: "«الأنيس والإنس والأناس والناس واحد» [@zawzani، ص189]. وفي اللسان: «تَسَمَّعَتْ رِزَّ الأَنيسِ أَي صوتَ الصَّيَّادِينَ» [@lisan، ج1 ص655]."
  - term: "رَاعَهَا"
    text: "«راعها: أفزعها» [@zawzani، ص189]."
  - term: "عَنْ ظَهْرِ غَيْبٍ"
    text: "«معناه من وراء حجاب، أي تسمع من حيث لا ترى» [@ibn-al-anbari، ص565]. وفي اللسان: «والغَيْبُ: مَا اطْمَأَنَّ مِنَ الأَرض» [@lisan، ج1 ص655]، فالصيادون في منخفض لا تراهم منه."
  - term: "سَقَامُهَا"
    text: "«معناه هلاكها، أي يصيدها» [@ibn-al-anbari، ص565]."
syntax:
  - "«وفاعل تسمعت ضمير البقرة، وفاعل راعها ضمير الرّزّ» [@ibn-al-anbari، ص565]."
  - "«عَنْ ظَهْرِ غَيْبٍ» متعلق بـ«تَسَمَّعَتْ» وإن تأخر عن «فَرَاعَهَا». قال الزَّوْزَنِيّ: «والتقدير: فتسمعت رِزّ الأنيس عن ظهر غيب فراعها والأنيس سقامها» [@zawzani، ص189]."
  - "جملة «وَالْأَنِيسُ سَقَامُهَا» حالية: «الْأَنِيسُ» مبتدأ و«سَقَامُهَا» خبره."
morphology:
  - "«تَسَمَّعَتْ» على «تفعّلت»، وهو بناء التكلّف والتتبّع: أصغت تطلب السماع، لا سمعت عرضًا."
  - "«الأَنِيس» على «فَعِيل» بمعنى الإنس. و«رَاعَ» أجوف واوي من الرَّوْع وهو الفزع."
  - "«سَقَام» مصدر «سقِم يسقَم»: «السقام والسقم واحد» [@zawzani، ص189]."
rhetoric:
  thesis: "الخطر يصل صوتًا قبل أن يُرى. ونصف العجز حكم يقوله الشاعر نفسه: الناس داء الوحش."
  devices:
    - title: "التشبيه البليغ"
      text: "«وَالْأَنِيسُ سَقَامُهَا»: جعل الناس سقمها نفسه ولم يقل كالسقم. والتشبيه البليغ: ما حُذفت منه الأداة ووجه الشبه. وهذا عند عبد القاهر الجُرْجانيّ ليس استعارة، لأن المشبَّه مذكور، بل هو الضرب الذي «تجري اسم المشبه به خبرًا على المشبَّه» فيه، كقولك «زيد أسد» [@dalail، ص68]. وفسّره الزَّوْزَنِيّ: «لأنهم يصيدونها وينقصون منها نقص السقم من الجسد» [@zawzani، ص189]."
    - title: "التكرار والمفارقة"
      text: "«الْأَنِيسِ ... وَالْأَنِيسُ»: تكررت الكلمة في الشطرين، فهي في الأول مصدر صوت، وفي الثاني مصدر هلاك. والأنيس من الأُنس، فالذي اسمه من الأُلفة هو الداء. وهذه قراءتنا."
  connection: "ثم تغدو مذعورة لا تعرف أمِن خلفها الخطر أم من أمامها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَتَسَمْمَعَتْ / رِزْزَ لْأَنِي / سِ فَرَاعَهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — عَنْ ظَهْرِ غَيْ / بِنْ وَلْأَنِي / سُ سَقَامُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر والأوليين من العجز."
context: "الرابع من أبيات الصباح والرماة والكلاب (44–52). هنا يدخل الإنسان الحكاية أول مرة، صوتًا لا شخصًا."
