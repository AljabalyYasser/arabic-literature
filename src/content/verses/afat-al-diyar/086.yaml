first: "وَهُمُ السُّعَاةُ إِذَا الْعَشِيرَةُ أُفْظِعَتْ"
second: "وَهُمُ فَوَارِسُهَا وَهُمْ حُكَّامُهَا"
meaning: "وهم الذين يسعون في أمر العشيرة إذا نزل بها أمر فظيع، فيصلحون ويحملون الديات، وهم فرسانها في الحرب، وحكّامها في الخصومة. قال الزَّوْزَنِيّ: «يقول: إذا أصاب العشيرة أمر عظيم سعوا بدفعه وكشفه، وهم فرسان العشيرة عند قتالها وحكامها عند تخاصمها، يريد رهطه الأدنين» [@zawzani، ص201]، أي قومه الأقربين."
vocabulary:
  - term: "السُّعَاةُ"
    text: "«القائمون بأمرهم» [@ibn-al-anbari، ص595]، وعند التِّبْرِيزِيّ: «ومعناه انهم السُّعاة في صلاح الحي من الدِّيات وغيرها» [@tabrizi-ashr، ص175]."
  - term: "أُفْظِعَتْ"
    text: "«معناه حل بها أمر فظيع» [@ibn-al-anbari، ص595]. وفي اللسان: «وأُفْظِعُ الرجلُ، عَلَى مَا لَمْ يسمَّ فاعلُه، أَي نزَل بِهِ أَمْرٌ عَظِيمٌ»، ثم أنشد البيت [@lisan، ج8 ص254]."
  - term: "فَوَارِسُهَا"
    text: "فرسانها، «وهم فوارسها الذين يمنعونها» [@tabrizi-ashr، ص175]."
  - term: "حُكَّامُهَا"
    text: "«وحكامها الذين يُرجع إلى رأيهم، ويُقبل قولهم» [@tabrizi-ashr، ص175]."
syntax:
  - "«وَهُمُ السُّعَاةُ» مبتدأ وخبر، وكلاهما معرفة. و«إِذَا» ظرف متعلق بـ«السُّعَاةُ»: «وإذا صلة السعاة» [@ibn-al-anbari، ص595]."
  - "«الْعَشِيرَةُ» نائب فاعل لفعل محذوف يفسره «أُفْظِعَتْ»."
  - "«وَهُمُ فَوَارِسُهَا وَهُمْ حُكَّامُهَا» جملتان اسميتان معطوفتان على الأولى، والهاء فيهما للعشيرة."
morphology:
  - "«السُّعاة» جمع «ساعٍ» على «فُعَلة»: «السعاة: جمع الساعي» [@zawzani، ص201]، وأصله «سُعَيَة»، قُلبت الياء ألفًا لتحركها وانفتاح ما قبلها."
  - "«أُفْظِعَتْ» ماضٍ مبني للمجهول من «أفظع» على «أفعل»، أي نزل بها أمر فظيع."
  - "«فَوارِس» جمع «فارس» على «فواعل»، و«حُكّام» جمع «حاكم» على «فُعّال»."
rhetoric:
  thesis: "ثلاث وظائف للقوم في حياة العشيرة: الصلح، والحرب، والحكم، وكلها لهم."
  devices:
    - title: "التكرار"
      text: "«وَهُمُ ... وَهُمُ ... وَهُمْ»: يتكرر الضمير ثلاث مرات، فتُثبت كل وظيفة لهم إثباتًا مستقلًا، ويستمر التكرار في البيتين الأخيرين اللذين يبدآن بـ«وَهُمُ» أيضًا، فتنتهي القصيدة على إيقاع واحد."
    - title: "تعريف الخبر"
      text: "«السُّعَاةُ»، «فَوَارِسُهَا»، «حُكَّامُهَا»: أخبار معرّفة، فهي تقصر هذه الصفات عليهم، كأنه لا ساعي ولا فارس ولا حاكم غيرهم. ويذكر عبد القاهر الجُرْجانيّ من وجوه الخبر المعرّف أن تقصر المعنى على المخبر عنه «على معنى أنه لم يَحصُلْ لغيرهِ على الكَمال» [@dalail، ص182]."
    - title: "التقسيم"
      text: "استوفى أحوال العشيرة الثلاث: الشدة النازلة («السُّعَاةُ»)، والحرب («فَوَارِسُهَا»)، والخصومة («حُكَّامُهَا»). والتقسيم: أن يُذكر للشيء وجوه فتُستوفى."
  connection: "ثم يضيف وظيفة رابعة: هم ربيع لمن جاورهم وللأرامل في السنة الجدبة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَهُمُسْسُعَا / ةُ إِذَلْ عَشِي / رَةُ أُفْظِعَتْ = متَفاعلن / متَفاعلن / متَفاعلن — وَهُمُو فَوَا / رِسُهَا وَهُمْ / حُكْكَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "سلم الصدر من الزحاف. ودخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثالثة من العَجُز. وتُشبع ضمة الميم في «وَهُمُ» أول العَجُز فتُنطق «وَهُمُو»، وبها يستقيم الوزن."
context: "تاسع أبيات الفخر بالقوم. وفيه ينتقل من ضمير المتكلمين («حَقِّنَا») إلى ضمير الغائبين «هم»، كأنه يصف قومه من خارجهم شاهدًا لهم، ويريد بهم عند الزَّوْزَنِيّ رهطه الأقربين."
