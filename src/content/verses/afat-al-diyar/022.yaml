first: "بِطَلِيحِ أَسْفَارٍ تَرَكْنَ بَقِيَّةً"
second: "مِنْهَا فَأَحْنَقَ صُلْبُهَا وَسَنَامُهَا"
meaning: "اقطع حاجتك بناقة أتعبتها الأسفار، فأبقت منها بقية من لحمها وقوتها، وضمر ظهرها وسنامها. قال أبو جَعْفَر: «معنى البيت: فاقطع لبانته بناقة معتادة للسفر قد طلحها مرة بعد أخرى، وقد هانت عليها الأسفار» [@ibn-al-anbari، ص539]."
vocabulary:
  - term: "بِطَلِيحِ أَسْفَارٍ"
    text: "«معناه بناقة كالة معيية» [@ibn-al-anbari، ص539]، أي متعبة. «الطلح والطليح: المعيي» [@zawzani، ص180]."
  - term: "أَسْفَارٍ"
    text: "«جمع سفر» [@ibn-al-anbari، ص539]."
  - term: "تَرَكْنَ بَقِيَّةً"
    text: "«معناه لم تأكل الأسفار لحمها أجمع، أي لها كدنة وبقاء على طول السفر» [@ibn-al-anbari، ص539]. والكِدْنة في لسان العرب: «القُوَّة»، و«كَثْرَةُ الشَّحْمِ وَاللَّحْمِ» [@lisan، ج13 ص355]."
  - term: "فَأَحْنَقَ"
    text: "«ضمر» [@ibn-al-anbari، ص539]، أي هزل. وفي لسان العرب: «والإِحْناقُ: لزُوقُ البَطْنِ بالصُّلْب» [@lisan، ج10 ص70]."
  - term: "صُلْبُهَا"
    text: "ظهرها. «ويقال صُلُب، وصَلَب» [@ibn-al-anbari، ص539]."
syntax:
  - "في متعلَّق الباء قولان. عند ابن الأَنْبارِيّ: «والباء صلة لقوله: فاقطع لبانة من تعرض» [@ibn-al-anbari، ص539]، أي اقطع حاجتك بهذه الناقة. وعند الزَّوْزَنِيّ أنها متعلقة بقوله «وَصُرْمُهُ» في البيت السابق [@zawzani، ص180]، أي تقدر على قطيعته بركوب هذه الناقة."
  - "«بِطَلِيحِ» صفة لموصوف محذوف تقديره: بناقة طليح. و«أَسْفَارٍ» مضاف إليه، وجملة «تَرَكْنَ بَقِيَّةً» صفة لـ«أَسْفَارٍ»، والنون فيها ضمير الأسفار."
  - "«مِنْهَا» متعلق بـ«بَقِيَّةً»، وقد جاء في أول العجز. و«صُلْبُهَا» فاعل «أَحْنَقَ»، و«سَنَامُهَا» معطوف عليه."
morphology:
  - "«طَلِيح» على «فعيل» بمعنى «مفعول»: «والأصل في طليح مطلوحة، فصرفت عن مفعولة إلى فعيل، فألزمت التذكير» [@ibn-al-anbari، ص539]، أي لم تلحقه التاء وهو وصف لمؤنث، «بمنزلة الجريح والقتيل» [@zawzani، ص180]."
  - "«أَحْنَقَ» على «أفعل»، و«الإحناق: الضمر» [@zawzani، ص180]."
  - "«أَسْفَار» جمع «سَفَر» على «أفعال»، و«بَقِيَّة» على «فَعِيلة» من «بقي»."
rhetoric:
  thesis: "أول صورة للناقة: لا يصفها في قوتها وشبابها، بل بعد أن أنهكتها الأسفار. فالقوة التي بقيت فيها قوة مجرَّبة، لا تنكسر."
  devices:
    - title: "الصفة مكان الموصوف"
      text: "لم يذكر الناقة باسمها، بل قال «بِطَلِيحِ أَسْفَارٍ»، فعرّفها بأثر السفر فيها. وحذف الموصوف عند عبد القاهر الجُرْجانيّ من باب يقول فيه: «فإنكَ ترى به تَرْكَ الذِكْر، أَفْصَحَ من الذكْرِ» [@dalail، ص146]."
    - title: "إسناد الفعل إلى الأسفار"
      text: "في «تَرَكْنَ بَقِيَّةً» جعل الأسفار هي التي تأكل الناقة ثم تُبقي منها، كما فسّره ابن الأَنْبارِيّ: «لم تأكل الأسفار لحمها أجمع» [@ibn-al-anbari، ص539]. فالسفر في البيت كائن يفترس، والناقة تصمد له."
    - title: "النقص الذي يدل على القوة"
      text: "كل ما في البيت ذهاب: إعياء وضمور ولصوق البطن بالظهر. لكن البقية هي المعنى: ناقة «قد اعتادت الأسفار ومرنت عليها» [@zawzani، ص181]. وهذا يمهد للمفاجأة في البيت 24: لها نشاط في الزمام على هذه الحال."
  connection: "ثم يزيد وصف نحولها: ارتفع لحمها إلى رؤوس عظامها وتقطعت سيور نعالها [@ibn-al-anbari، ص540]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "بِطَلِيحِ أَسْ / فَارِنْ تَرَكْ / نَ بَقِيْيَةَنْ = متَفاعلن / مُتْفاعلن / متَفاعلن — مِنْهَا فَأَحْ / نَقَ صُلْبُهَا / وَسَنَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "أول أبيات الناقة (22–24). تربطه الباء بما قبله: الناقة هي الأداة التي يقطع بها حاجته ممن تغيّر، فينتقل الشاعر بها من النسيب إلى الرحلة. ومن أمثال العرب في التعب المشترك بين الراكب وناقته: «(صاحب الناقة طليحان) ، إذا كان هو والناقة معييين» [@ibn-al-anbari، ص540]."
