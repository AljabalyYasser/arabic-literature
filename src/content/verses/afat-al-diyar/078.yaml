first: "إِنَّا إِذَا الْتَقَتِ الْمَجَامِعُ لَمْ يَزَلْ"
second: "مِنَّا لِزَازُ عَظِيمَةٍ جَشَّامُهَا"
meaning: "إذا اجتمعت جماعات القبائل للمفاخرة أو لأمر عظيم، لم يزل فينا رجل يلزم الخطب العظيم ويقوم به، ويتكلف شدائده. قال الزَّوْزَنِيّ: «يقول: إذا اجتمعت جماعات القبائل فلم يزل يسودهم رجل منا يقمع الخصوم عند الجدال، ويتجشم عظائم الخصام» [@zawzani، ص199]. وقال التِّبْرِيزِيّ: «ومعنى البيت إنه إذا اجتمع الناس للفخار أو لعظيم من الأمر كان الذي يقوم بذلك ويحكمه منهم» [@tabrizi-ashr، ص172]."
vocabulary:
  - term: "الْمَجَامِعُ"
    text: "مواضع الاجتماع، والمراد أهلها: «جماعات القبائل» كما في تفسير الزَّوْزَنِيّ [@zawzani، ص199]."
  - term: "لِزَازُ"
    text: "«لزاز عظيمة، أي يلز بها وهو مطيق لها» [@ibn-al-anbari، ص591]. وأصله «الخشبة التي يُشد بها الباب» [@tabrizi-ashr، ص172]. وفي اللسان: «وَيُقَالُ: لِزُّ شَرٍّ ولَزُّ شَرٍّ ولِزازُ شَرٍّ» [@lisan، ج5 ص405]."
  - term: "عَظِيمَةٍ"
    text: "الأمر العظيم، أي الخطب الشديد."
  - term: "جَشَّامُهَا"
    text: "«والجشام: المتكلف للأمور القائم بها» [@tabrizi-ashr، ص172]. وفي اللسان: «جَشِمَ الأَمْرَ، بِالْكَسْرِ، يَجْشَمُه جَشْماً وجَشامةً وتَجَشَّمَه: تَكَلَّفَه عَلَى مَشَقَّةٍ» [@lisan، ج12 ص100]."
syntax:
  - "«إِنَّا» هي «إنّ» واسمها ضمير المتكلمين، وأصله «إنّنا» فحُذفت إحدى النونات. وخبرها جملة الشرط وجوابها."
  - "«إِذَا الْتَقَتِ الْمَجَامِعُ» ظرف شرطي، وجوابه «لَمْ يَزَلْ ...». وكُسرت تاء «الْتَقَتِ» لالتقاء الساكنين."
  - "«لِزَازُ» اسم «لم يزل» مؤخر، و«مِنَّا» خبرها مقدم. «وجشامها نعت للزاز عظيمة» [@ibn-al-anbari، ص591]، والهاء في «جَشَّامُهَا» للعظيمة."
  - "«عَظِيمَةٍ» صفة لموصوف محذوف أُقيمت مقامه، أي لزاز أمرٍ عظيم أو خطة عظيمة."
morphology:
  - "«لِزاز» على «فِعال»، اسم لما يُلزّ به الشيء، أي يُشدّ ويُقرن. قال الزَّوْزَنِيّ: «رجل لزاز الخصوم، يصلح؛ لأن يلز بهم، أي: يقرن بهم ليقهرهم» [@zawzani، ص199]."
  - "«جَشّام» على «فعّال» من صيغ المبالغة، من «تجشّم» إذا تكلّف: «وتجشمه: تكلفه» [@ibn-al-anbari، ص591]."
  - "«الْمَجامِع» جمع «مَجْمَع» على «مفاعل». و«الْتَقَتْ» على «افتعل» من «لقي»."
rhetoric:
  thesis: "أول أبيات الفخر بالقوم: لا يخلو مجمع من سيد منهم يحمل أثقل ما فيه."
  devices:
    - title: "التوكيد ودوام الزمن"
      text: "«إِنَّا ... لَمْ يَزَلْ»: يذكر التِّبْرِيزِيّ رواية «كُنَّا»، وينقل: «قال ابن كيسان: إنَّا أبلغ في المدح من كنا، يعني أن كنا إنما تدل على ما مضى فقط» [@tabrizi-ashr، ص172]. فـ«إنّا» تؤكد الخبر وتجعله حاضرًا، و«لَمْ يَزَلْ» تمدّه في الماضي، فالفخر يشمل الزمن كله."
    - title: "الاستعارة"
      text: "«لِزَازُ عَظِيمَةٍ»: اللزاز في أصله خشبة يُشدّ بها الباب، فجعل الرجل لزازًا للأمر العظيم: به يُمسك الأمر ويُضبط كما يُمسك الباب بلزازه. والاستعارة: أن تعطي الشيء اسم غيره لشبه بينهما."
    - title: "من المفرد إلى الجمع"
      text: "«إِنَّا» و«مِنَّا»: بعد أن تكلم عن نفسه في أكثر القصيدة، صار يتكلم بلسان قومه. فما خصّ به نفسه في مقام الملوك (70–72) يعمّمه هنا: لا يخلو مجمع من غالب من قومه. وهذه قراءتنا."
  connection: "ثم يعدّد صفات هذا السيد: يقسم الحقوق بالعدل، ويهضم حقه لعشيرته."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "إِنْنَا إِذَلْ / تَقَتِلْ مَجَا / مِعُ لَمْ يَزَلْ = مُتْفاعلن / متَفاعلن / متَفاعلن — مِنْنَا لِزَا / زُ عَظِيمَتِنْ / جَشْشَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز. وسقطت ألف «إِذَا» في النطق لالتقاء الساكنين."
context: "أول مقطع الفخر بالقوم (78–88)، وقد مهّد له ضمير الجماعة في «يُكَلِّلُونَ» في البيت السابق. ويرى الزَّوْزَنِيّ أن المعنى: «لا تخلو المجامع من رجال منا يتحلّى بما ذكر من قمع الخصوم وتكلّف الخصام» [@zawzani، ص199]."
variants:
  - reading: "كُنَّا إِذَا الْتَقَتِ الْمَجَامِعُ لَمْ يَزَلْ"
    status: "رواية أخرى"
    note: "يذكرها التِّبْرِيزِيّ [@tabrizi-ashr، ص172] والديوان [@diwan-labid، ص319]."
  - reading: "إِنَّا إِذَا الْتَقَتِ الْمَحَافِلُ لَمْ يَزَلْ"
    status: "رواية أخرى"
    note: "[@tabrizi-ashr، ص172] [@diwan-labid، ص319]. والمحافل: المجالس."
  - reading: "مِنَّا لِزَازُ عَظِيمَةٍ جَسَّامُهَا"
    status: "رواية الأَصْمَعِيّ"
    note: "«ورواها الأصمعي: (جسامها) بالسين غير معجمة، أي ركاب معظمها. يقال تجسم كذا وكذا، أي ركب معظمه» [@ibn-al-anbari، ص591]."
  - reading: "مِنَّا لِزَازُ عَظِيمَةٍ حَسَّامُهَا"
    status: "رواية أخرى"
    note: "«بحاء غير معجمة، أي قطاعها. يقال قد حسمت هذا الأمر، أي قطعته» [@ibn-al-anbari، ص591]."
