first: "لَا يَطْبَعُونَ وَلَا يَبُورُ فَعَالُهُمْ"
second: "إِذْ لَا تَمِيلُ مَعَ الْهَوَى أَحْلَامُهَا"
meaning: "لا تتدنّس أعراضهم بعيب، ولا يضيع ما يفعلون من الخير، لأن عقولهم لا تميل مع أهوائهم. قال ابن الأَنْبارِيّ: «يقول: فلا يهلك فعالنا في الحمد فيذهب، بل يذيع فيبقى ذكره» [@ibn-al-anbari، ص594]، وقال: «معناه أحلامهم تغلب هواهم، فليسوا ممن يميل مع الهوى أو يتكلم به» [@ibn-al-anbari، ص594]."
vocabulary:
  - term: "يَطْبَعُونَ"
    text: "«معناه لا تدنس أعراضهم. والطبع: الدنس» [@ibn-al-anbari، ص593]. وفي اللسان: «الطبَعُ الدَّنَسُ وَالْعَيْبُ، بِالتَّحْرِيكِ. وَكُلُّ شَينٍ فِي دِين أَو دُنيا، فَهُوَ طبَع» [@lisan، ج8 ص234]."
  - term: "يَبُورُ"
    text: "«معناه لا يهلك. يقال: قد بار الطعام، إذا كسد وهلك» [@ibn-al-anbari، ص594]. وفي اللسان: «الْبَوارُ: الْهَلَاكُ» [@lisan، ج4 ص86]."
  - term: "فَعَالُهُمْ"
    text: "«الفعال: فعل الواحد جميلًا كان أو قبيحًا» [@zawzani، ص200]، والمراد هنا فعلهم الحسن."
  - term: "أَحْلَامُهَا"
    text: "عقولها، جمع حِلْم، وفي تفسير الزَّوْزَنِيّ: «إذ لا تميل عقولهم مع أهوائهم» [@zawzani، ص200]."
syntax:
  - "«لَا يَطْبَعُونَ» مضارع منفي مرفوع بثبوت النون، والجملة نعت ثانٍ لـ«مَعْشَرٍ» في البيت السابق، أو مستأنفة."
  - "«وَلَا يَبُورُ فَعَالُهُمْ» جملة معطوفة، و«فَعَالُهُمْ» فاعل."
  - "«إِذْ» للتعليل، أي لأنهم لا تميل أحلامهم. و«أَحْلَامُهَا» فاعل «تَمِيلُ»، «والهاء التي في الأحلام تعود على القوم، أي أحلام جماعتها» [@ibn-al-anbari، ص594]. وأُنّث «تَمِيلُ» لأن فاعله جمع تكسير، ومن روى «يَمِيلُ» ذكّره، وكلاهما جائز."
morphology:
  - "«يَطْبَعُونَ» من «طبِع يطبَع» على «فعِل يفعَل»: «الطبع: تدنّس العرض وتلطخه، والفعل طبع يطبع» [@zawzani، ص200]."
  - "«يَبُور» أجوف واوي من «بار يبور بَوارًا»."
  - "«فَعال» بفتح الفاء اسم مفرد للفعل، وليس جمع «فِعْل»؛ وينقل الزَّوْزَنِيّ تفسيره بالمفرد عن ثعلب والمبرد وابن الأَنْبارِيّ وابن الأَعْرابِيّ [@zawzani، ص200]."
  - "«أَحْلام» جمع «حِلْم» على «أفعال»، والحلم: العقل والأناة."
rhetoric:
  thesis: "يجعل لبيد العقل سرّ نقاء قومه: الدنس والضياع يأتيان من الهوى، وهم لا يتبعون الهوى."
  devices:
    - title: "الاستعارة في «يطبعون»"
      text: "الطبع في أصله صدأ السيف، يقال طبع السيف «إذا دخله مثل الجرب من شدة الصدأ» [@ibn-al-anbari، ص594]. فالقوم كالسيوف المصقولة لا يعلوها صدأ العيب. وهذه قراءتنا للصورة."
    - title: "الاستعارة في «يبور»"
      text: "البوار في أصله كساد السلعة وهلاكها، واستشهد له ابن الأَنْبارِيّ بقوله تعالى: «يَرْجُونَ تِجَارَةً لَنْ تَبُورَ» [@ibn-al-anbari، ص594]. فكأن فعالهم بضاعة لا تكسد، يبقى ثمنها حمدًا وذكرًا."
    - title: "التعليل والمقابلة"
      text: "«إِذْ لَا تَمِيلُ مَعَ الْهَوَى أَحْلَامُهَا»: لم يكتف بنفي العيب، بل ذكر علته، فصار الفخر حجة. وقابل بين الحلم والهوى، فالأول يغلب الثاني."
  connection: "ثم يذكر ثمرة ذلك: بيت شرف بُني لهم فارتفع إليه الكبير والصغير."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "لَا يَطْبَعُو / نَ وَلَا يَبُو / رُ فَعَالُهُمْ = مُتْفاعلن / متَفاعلن / متَفاعلن — إِذْ لَا تَمِي / لُ مَعَلْ هَوَى / أَحْلَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز."
context: "خامس أبيات الفخر بالقوم. ونفيه الدنس عنهم يمهّد لما في آخر القصيدة (88) من حاسد ولائم لا يجدان إليهم سبيلًا."
