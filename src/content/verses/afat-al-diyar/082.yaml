  - reading: "لَا يَطْبَعُونَ وَلَا يَبُورُ فِعَالُهُمْ"
    status: "ضبط مطبوعة ابن الأَنْبارِيّ"
    note: "بكسر الفاء [@ibn-al-anbari، ص593]، وكذلك في الجمهرة [@jamhara، ص268]. وأخذنا بالفتح، وهو ضبط الزَّوْزَنِيّ والتِّبْرِيزِيّ والديوان [@zawzani، ص200] [@tabrizi-ashr، ص173] [@diwan-labid، ص320]، ولأن الزَّوْزَنِيّ فسّر الكلمة بالمفرد."
