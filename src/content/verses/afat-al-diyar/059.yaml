first: "أُغْلِي السِّبَاءَ بِكُلِّ أَدْكَنَ عَاتِقٍ"
second: "أَوْ جَوْنَةٍ قُدِحَتْ وَفُضَّ خِتَامُهَا"
meaning: "أشتري الخمر بالثمن الغالي، كل زقّ أغبر اللون عتيق، أو خابية سوداء فُضّ ختمها وغُرف منها. قال الزَّوْزَنِيّ: «أشتري الخمر للندماء عند غلاء السعر» [@zawzani، ص193]. والزِّقّ: وعاء من جلد، والخابية: جرّة كبيرة."
vocabulary:
  - term: "أُغْلِي"
    text: "«أغليت الشيء: اشتريته غاليًا وصيرته غاليًا ووجدته غاليًا» [@zawzani، ص193]."
  - term: "السِّبَاءَ"
    text: "«السباء: شراء الخمر» [@ibn-al-anbari، ص575]. ونقل عن أبي عُبَيْدة: «يقال سبأت الخمر، إذا اشتريتها فشربتها. ولا يقولون للذي يشتريها للبيع سبأها» [@ibn-al-anbari، ص575]."
  - term: "أَدْكَنَ"
    text: "«معناه بكل زق أدكن» [@ibn-al-anbari، ص576]، والدُّكنة لون يميل إلى السواد. وفي اللسان: «يَعْنِي زِقّاً قَدْ صَلَح وَجَادَ فِي لَوْنِهِ وَرَائِحَتِهِ لعِتْقه» [@lisan، ج13 ص157]."
  - term: "عَاتِقٍ"
    text: "«عتيق. ويقال: عاتق، معناه لم يفتحه أحد غيرنا، كالجارية العاتق» [@ibn-al-anbari، ص577]. وفي اللسان: «وَقِيلَ: هِيَ الَّتِي لَمْ يَفُضَّ أَحدٌ خِتَامَهَا كَالْجَارِيَةِ العاتِقِ» [@lisan، ج10 ص237]."
  - term: "جَوْنَةٍ"
    text: "«أو خابية سوداء» [@ibn-al-anbari، ص576]."
  - term: "قُدِحَتْ"
    text: "«معناه غرفت» [@ibn-al-anbari، ص576]، وعن ابن الأَعْرابِيّ: «قدحت، معناه بزلت» [@ibn-al-anbari، ص577]، أي ثُقبت. وفي اللسان: «وقَدَحَ خِتامَ الْخَابِيةِ قَدْحاً: فَضَّه» [@lisan، ج2 ص557]."
  - term: "خِتَامُهَا"
    text: "«معناه خاتمها» [@ibn-al-anbari، ص577]، أي الطين الذي سُدّ به فمها."
syntax:
  - "«وأغلى موضعه رفع في اللفظ ونصب في التأويل على الحال من التاء في وافيت» [@ibn-al-anbari، ص577]: أي جملة «أُغْلِي» حال من فاعل «وَافَيْتُ» في البيت السابق."
  - "«بِكُلِّ» متعلق بـ«أُغْلِي». و«أَدْكَنَ» صفة لموصوف محذوف أي زقّ، ممنوع من الصرف فجُرّ بالفتحة، و«عَاتِقٍ» نعت ثانٍ. و«جَوْنَةٍ» معطوف على «أَدْكَنَ»، وجملة «قُدِحَتْ» نعت لها."
morphology:
  - "«السِّبَاء» مصدر «سبأ» على «فِعال»: «سبأت الخمر أسبؤها سبأ وسباء: اشتريتها» [@zawzani، ص193]."
  - "«أَدْكَن» على «أَفْعَل» صفة لون، ممنوع من الصرف للوصفية ووزن الفعل. و«جَوْنَة» مؤنث «جَوْن»."
  - "«الخِتَام» على «فِعال» بمعنى الخاتم: «الخاتَم والخاتِم والخاتام والخيتام والختام واحد» [@zawzani، ص193]."
rhetoric:
  thesis: "الكرم يُقاس بالثمن وبالقِدَم: الخمر غالية، وأوعيتها عتيقة لم يفتحها أحد قبله. فهو أكرم من يشتري، وأول من يشرب."
  devices:
    - title: "التقديم والتأخير في المعنى"
      text: "«قُدِحَتْ وَفُضَّ خِتَامُهَا»: الختم يُفضّ أولًا ثم يُغرف منها، فقدّم الآخر وأخّر الأول. نقل ابن الأَنْبارِيّ عن أبي جَعْفَر: «قدحت وفض ختامها مقدم ومؤخر، معناه فض ختامها وقدحت» [@ibn-al-anbari، ص577]، وقال الزَّوْزَنِيّ: «لأنه ما لم يكسر ختامها لا يمكن اغتراف ما فيها من الخمر» [@zawzani، ص194]. والتقديم والتأخير: أن يُذكر في الكلام ما حقه التأخير قبل ما حقه التقديم."
    - title: "الكناية"
      text: "«عَاتِقٍ» و«فُضَّ خِتَامُهَا»: الزقّ الذي لم يفتحه أحد، والختم الذي يُفضّ أمامه، كلاهما كناية عن أن الخمر عتيقة لم تُمسّ، فهو أول شاربيها. والكناية: أن تذكر شيئًا وتريد لازمه."
  connection: "ثم يذكر أنه بادر صياح الديكة ليشرب في السَّحَر."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أُغْلِ سْسِبَا / ءَ بِكُلْلِ أَدْ / كَنَ عَاتِقِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — أَوْ جَوْنَتِنْ / قُدِحَتْ وَفُضْ / ضَ خِتَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأولى من العجز."
context: "الخامس من أبيات خطاب نَوار (55–62)، وهو تمام خبر الخمّار في البيت السابق."
