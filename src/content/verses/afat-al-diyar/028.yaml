first: "حَتَّى إِذَا سَلَخَا جُمَادَى سِتَّةٍ"
second: "جَزْءًا فَطَالَ صِيَامُهُ وَصِيَامُهَا"
meaning: "وبقيا كذلك حتى انقضت عليهما الأشهر الستة إلى جُمادى، يكتفيان بالرطب من النبت عن الماء، فطال إمساك العير وإمساك الأتان عن الشرب. قال الزَّوْزَنِيّ: «يقول: أقاما بالثلبوت حتى مر عليهما الشتاء ستة أشهر وجاء الربيع فاكتفيا بالرطب عن الماء وطال إمساك العير وإمساك الأتان عنه» [@zawzani، ص183]."
vocabulary:
  - term: "سَلَخَا"
    text: "«يعنى العير والأتان خرجا» [@ibn-al-anbari، ص544]. وعند الزَّوْزَنِيّ: «سلخت الشهر وغيره أسلخه سلخًا: مرّ علي، وانسلخ الشهر نفسه» [@zawzani، ص183]."
  - term: "جُمَادَى سِتَّةٍ"
    text: "جُمادى الآخرة، وهي سادسة الأشهر: «أي متمم ستة وخاتم ستة أشهر. يريد سلخا أشهرا آخرها جمادى الآخرة وأولها المحرم» [@ibn-al-anbari، ص546]. وفي لسان العرب: «هِيَ جُمَادَى الْآخِرَةِ» [@lisan، ج3 ص130]. وجُمادى عند بعض العرب اسم للشتاء: «سمي بها لجمود الماء فيه» [@zawzani، ص183]."
  - term: "جَزْءًا"
    text: "«جَزَأَ الوحش يجزَأ جَزْءًا: اكتفى بالرطب عن الماء» [@zawzani، ص183]، أي استغنى بما في النبت الأخضر من ماء."
  - term: "صِيَامُهُ وَصِيَامُهَا"
    text: "«الصيام: الإمساك في كلام العرب، ومنه الصوم المعروف؛ لأنه إمساك عن المفطرات» [@zawzani، ص183]. وعند ابن الأَنْبارِيّ: «قيام العير وقيام الأتن، لأن الصيف قد جاء وانقطعت المياه» [@ibn-al-anbari، ص546]، و«يقال (صام) إذا قام وثبت» [@ibn-al-anbari، ص545]."
syntax:
  - "«حَتَّى» حرف ابتداء، و«إِذَا» ظرف فيه معنى الشرط، وجوابه في البيت التالي: «رَجَعَا بِأَمْرِهِمَا»."
  - "في «سِتَّةٍ» روايتان. بالجر: «وستة تختفض بإضافة جمادى اليها» [@ibn-al-anbari، ص546]، أي جُمادى التي تتمّ بها الستة. وبالنصب: «جعل الستة تابعة لجمادى، أي سلخا أشهرا ستة، فاكتفى بجمادى من الأشهر» [@ibn-al-anbari، ص546]، وبها روى الزَّوْزَنِيّ: «وستة بدل من جمادى لذلك نصبها، وأراد ستة أشهر فحذف أشهرًا لدلالة الكلام عليه» [@zawzani، ص183]."
  - "«جَزْءًا» مصدر منصوب: «جزء مصدر جزأت الإبل تجزأ جزءا» [@ibn-al-anbari، ص546]. و«صِيَامُهُ» فاعل «طَالَ»، و«صِيَامُهَا» معطوف عليه، والهاء في الأول للعير وفي الثاني للأتان."
morphology:
  - "«سَلَخَ» أصله نزع الجلد، ثم قيل: سلخ الشهر إذا مضى فيه حتى آخره، «وانسلخ الشهر نفسه» [@zawzani، ص183]."
  - "«جُمَادَى» على «فُعالى»، اسم مؤنث ممنوع من الصرف لألف التأنيث المقصورة."
  - "«صِيَام» مصدر «صام يصوم» على «فِعال»، وأصله «صِوام» قُلبت الواو ياءً لانكسار ما قبلها."
rhetoric:
  thesis: "يقيس الشاعر حياة الوحش بالأشهر كما يقيس حياة الناس: ستة أشهر في المرعى، ثم عطش طويل. وفي البيت يتحول الخصب إلى صبر."
  devices:
    - title: "الاستعارة في «سَلَخَا»"
      text: "الاستعارة: أن يُستعمل اللفظ في غير ما وُضع له لشبه بينهما. والسَّلْخ في أصله نزع الجلد عن الذبيحة، فاستعاره لمرور الأشهر: كأن العير والأتان نزعا الشتاء عنهما شهرًا بعد شهر حتى بلغا آخره. والفعل مستعمل في كلام العرب للشهر [@zawzani، ص183]، وأثر الصورة باقٍ فيه."
    - title: "التكرار في «صِيَامُهُ وَصِيَامُهَا»"
      text: "كرر المصدر نفسه وغيّر الضمير، فجعل للعير صيامًا وللأتان صيامًا. ولو قال «صيامهما» لاختصر، لكنه أراد أن يقف عند كل منهما: كلاهما صابر، وكلاهما عطشان. وهذه قراءتنا."
    - title: "حساب الزمن"
      text: "كما عدّ في البيت 3 السنين بأشهر الحلّ والحرم، يعدّ هنا أشهر المرعى بأسمائها، فيصل الزمن في حياة الوحش بزمن الناس. وقد سأل القدماء عن طول هذا «الجزء»، ففي الديوان: «وقال أبو الحسن: قال قوم هذا غلط، لأن الجزء إنما يكون شهرين» [@diwan-labid، ص305]، وأبو الحسن هو الطُّوسِيّ شارح الديوان. ويذكر ابن الأَنْبارِيّ أن «أجود الربيع وأحمده شهران، إلا إنه إذا جاء الجود والخصب كان ثلاثة أشهر» [@ibn-al-anbari، ص546]."
  connection: "ثم يأتي جواب «إِذَا»: رجعا بأمرهما إلى عزم محكم، وهو عزم العير على ورود الماء [@ibn-al-anbari، ص546–547]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "حَتْتَا إِذَا / سَلَخَا جُمَا / دَا سِتْتَةِنْ = مُتْفاعلن / متَفاعلن / مُتْفاعلن — جَزْءَنْ فَطَا / لَ صِيَامُهُو / وَصِيَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلتين الأولى والثالثة من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وأُشبعت ضمة الهاء في «صِيَامُهُ» حتى صارت واوًا، كما يقتضي الوزن."
context: "من أبيات الأتان وفحلها (25–35)، وهو آخر أبيات مقامهما في المرعى. بعده يجيء الصيف، فيعزمان على الماء."
