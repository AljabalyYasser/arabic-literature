first: "وَغَدَاةِ رِيحٍ قَدْ كَشَفْتُ وَقِرَّةٍ"
second: "إِذْ أَصْبَحَتْ بِيَدِ الشَّمَالِ زِمَامُهَا"
meaning: "ورُبّ غداة ريح وبرد كشفتُ فيها الجوع عن الناس بالطعام، حين صار زمام تلك الغداة بيد ريح الشمال، أي حين غلبت عليها الشمال الباردة. قال ابن الأَنْبارِيّ: «وغداة ريح، معناه: ورب غداة ريح قد كشفت الجوع بالقرى» [@ibn-al-anbari، ص578]، والقِرى: طعام الضيف. وقال: «وإنما يصف شدة البرد والجوع. أي أطعمت إذا كان أغلب الأرواح ريح الشمال» [@ibn-al-anbari، ص578]."
vocabulary:
  - term: "غَدَاةِ"
    text: "أول النهار."
  - term: "قِرَّةٍ"
    text: "«معناه وبرد. يقال يوم قر وليلة قرة. والقر والقرة: البرد» [@ibn-al-anbari، ص578]."
  - term: "الشَّمَالِ"
    text: "الريح التي تهب من جهة الشمال، وهي عند الزَّوْزَنِيّ أبرد الرياح: «كم من غداة تهب فيها الشّمال وهي أبرد الرياح» [@zawzani، ص194]."
  - term: "زِمَامُهَا"
    text: "الزمام: المِقوَد الذي تُقاد به الناقة، والضمير للغداة. قال ابن الأَنْبارِيّ في المعنى: «يريد هي شمال» [@ibn-al-anbari، ص578]."
syntax:
  - "الواو واو «رُبَّ»، و«غَدَاةِ» مجرور بها على تقدير ابن الأَنْبارِيّ. وجملة «قَدْ كَشَفْتُ» صفة للمجرور، ومفعول «كَشَفْتُ» محذوف، وهو الجوع."
  - "«والقرة تختفض بالنسق على الريح، واسم أصبحت مضمر فيه من ذكر الغداة» [@ibn-al-anbari، ص578]، «ويجوز أن يكون فيه ضمير من الريح، ويجوز أن يكون فيه من القرة ضمير» [@ibn-al-anbari، ص578]."
  - "«والزمام مرفوع بالباء» [@ibn-al-anbari، ص578]، على مذهب من يرفع الاسم بالجار والمجرور المتقدم عليه. وعلى المشهور: «زِمَامُهَا» مبتدأ مؤخر، و«بِيَدِ الشَّمَالِ» خبر مقدّم، والجملة خبر «أَصْبَحَتْ»."
morphology:
  - "«قِرَّة» على «فِعْلة» من القُرّ وهو البرد، «ويقال شمال قَرة بفتح القاف» [@ibn-al-anbari، ص578]."
  - "«غَدَاة» على «فَعَالة»، و«زِمَام» على «فِعال» اسم لما يُزَمّ به، أي يُشدّ."
  - "«الشَّمَال» بفتح الشين اسم الريح، وبكسرها اليد اليسرى."
rhetoric:
  thesis: "بيت الكرم في البرد: يذكر يومًا قاسيًا لأنه أطعم فيه الناس. والصورة في عجزه من أشهر ما في القصيدة، وقد صارت عند البلاغيين مثالًا لضرب من الاستعارة."
  devices:
    - title: "الاستعارة: إثبات ما ليس للشيء"
      text: "«بِيَدِ الشَّمَالِ زِمَامُهَا»: جعل للريح يدًا، وللغداة زمامًا كزمام الناقة، فالريح تقود الصباح كما يقود الراعي دابته. والاستعارة: أن تريد تشبيه شيء بشيء فتترك لفظ التشبيه. يقول عبد القاهر الجُرْجانيّ في هذا البيت: «وذلك أنه جعل للشمال يداً، ومعلوم أنه ليس هناك مُشار إليه يمكن أن تُجْرَى اليد عليه» [@asrar، ص45]، أي ليس في الريح عضو يصح أن يسمى يدًا، بخلاف «أسد» للرجل الشجاع، فالرجل موجود تُجرى عليه الكلمة. ويجعله في «دَلائِل الإِعْجاز» ضربًا مستقلًا: «فقد ادَّعيْتَ أن لِلشَّمال يداً، ومَعْلومٌ أنه لا يكونُ للريحِ يد» [@dalail، ص67]."
    - title: "وجه الشبه في عمل اليد"
      text: "يبيّن عبد القاهر أين الشبه في هذه الاستعارة: «فالشبه الذي له استعرتَ اليد، ليس بوصفٍ في اليد» [@asrar، ص50]، «ولكنه صفته تُكسبها اليدُ صاحبَها، وتَحصُلُ له بها، وهي التصرف على وجه مخصوص» [@asrar، ص51]. فالريح لا تشبه اليد في شكلها، بل في أنها تصرّف الغداة وتقودها كما يصرّف صاحب اليد ما يمسكه."
    - title: "الخلاف في تفضيله"
      text: "يضعه ابن رَشِيق في أول أصناف الاستعارة: «منهم من يستعير للشيء ما ليس منه ولا إليه، كقول لبيد» [@ibn-rashiq، ج1 ص269]. ثم يقول: «وبعض المتعقبين يرى ما كان من نوع بيت ذي الرمة ناقص الاستعارة؛ إذ كان محمولاً على التشبيه، ويفضل عليه ما كان من نوع بيت لبيد» [@ibn-rashiq، ج1 ص269]، ويخالفهم: «وهذا عندي خطأ؛ لأنهم إنما يستحسنون الاستعارة القريبة» [@ibn-rashiq، ج1 ص269]. ويورده أبو هِلال العَسْكَرِيّ في أمثلة الاستعارة من أشعار المتقدمين [@sinaatayn، ص282، ص285]."
  connection: "ثم يذكر ما كفّ به البرد في تلك الغداة على ترتيب ابن الأَنْبارِيّ: صبوح من خمر صافية، وغناء مغنية."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَغَدَاةِ رِي / حِنْ قَدْ كَشَفْ / تُ وَقِرْرَتِنْ = متَفاعلن / مُتْفاعلن / متَفاعلن — إِذْ أَصْبَحَتْ / بِيَدِ شْشَمَا / لِ زِمَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر والأولى من العجز."
context: "السابع من أبيات خطاب نَوار (55–62) على ترتيب ابن الأَنْبارِيّ، وهو آخرها عند الزَّوْزَنِيّ والديوان (62) [@zawzani، ص194] [@diwan-labid، ص315]. فعلى ترتيبهما يتصل الإطعام في هذا البيت بحماية الحيّ في البيت 63، وعلى ترتيب ابن الأَنْبارِيّ يتصل بالصبوح بعده، فالباء في «بِصَبُوحِ» متعلقة بفعل هذا البيت."
variants:
  - reading: "وَغَدَاةِ رِيحٍ قَدْ وَزَعْتُ وَقِرَّةٍ"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "«ويروى: (قد وزعت) فمعناه قد كففت ورددت» [@ibn-al-anbari، ص578]. وبها رواه الزَّوْزَنِيّ [@zawzani، ص194] والديوان، وفيه أن «كشفت» في بعض الروايات [@diwan-labid، ص315]، وبها أنشده ابن رَشِيق [@ibn-rashiq، ج1 ص269]."
  - reading: "وَغَدَاةَ رِيحٍ قَدْ كَشَفْتُ وَقِرَّةٍ"
    status: "ضبط أسرار البلاغة"
    note: "كذا ضُبط في «أَسْرار البَلاغة» بنصب «غداة» [@asrar، ص45]، وتقدير ابن الأَنْبارِيّ «ورب غداة» يقتضي الجر."
