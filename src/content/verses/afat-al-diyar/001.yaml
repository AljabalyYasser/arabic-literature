first: "عَفَتِ الدِّيَارُ مَحَلُّهَا فَمُقَامُهَا"
second: "بِمِنًى تَأَبَّدَ غَوْلُهَا فَرِجَامُهَا"
meaning: "درست ديار الأحبة: ما كان منها للنزول أيامًا، وما كان للإقامة الطويلة، بالموضع المسمى مِنًى؛ وتوحّشت ديارهم عند الغَوْل والرِّجام بعد رحيل أهلها [@zawzani، ص171]."
vocabulary:
  - term: "عَفَتِ"
    text: "درست [@ibn-al-anbari، ص517]."
  - term: "مَحَلُّهَا فَمُقَامُهَا"
    text: "المحلّ: حيث يحلّ القوم من الدار، والمقام: حيث طال مكثهم فيه [@ibn-al-anbari، ص518]."
  - term: "مِنًى"
    text: "موضع قريب من طِخْفَة في بلاد غَنِيّ وكِلاب، وليس مِنًى مكة [@ibn-al-anbari، ص518]."
  - term: "تَأَبَّدَ"
    text: "توحّش [@ibn-al-anbari، ص517]."
  - term: "غَوْلُهَا فَرِجَامُهَا"
    text: "الغَوْل والرِّجام جبلان معروفان [@zawzani، ص171]؛ وقيل: الغول ماء، والرجام الهضاب [@ibn-al-anbari، ص518]."
syntax:
  - "«الدِّيَارُ» فاعل «عَفَتِ»، و«مَحَلُّهَا» مرفوع بفعل مضمر، والتقدير: عفا محلُّها فمقامُها. ولا يكون توكيدًا للديار، لأن الفاء توجب التفريق [@ibn-al-anbari، ص518]."
  - "الباء في «بِمِنًى» فيها قولان: تتعلق بـ«تَأَبَّدَ»، أو بالفعل المضمر: عفا محلها فمقامها بمِنًى [@ibn-al-anbari، ص518]."
  - "الضمير في «غَوْلُهَا» و«رجامها» يعود على الديار، والتقدير: ديار غولها وديار رجامها، فحُذف المضاف [@zawzani، ص171]."
morphology:
  - "«عفا» يكون لازمًا ومتعديًا: عفت الريح المنزل، وعفا المنزل نفسه؛ وهو في البيت لازم [@zawzani، ص171]."
  - "«تَأَبَّدَ» على وزن «تفعّل» من «أبد» إذا توحّش، ومنه «الأَوابِد» للوحوش [@ibn-al-anbari، ص517]."
  - "«مِنًى» يُذكّر ويؤنث، فمن ذكّره نوّنه «بِمِنًى» [@ibn-al-anbari، ص518]."
rhetoric:
  thesis: "يبدأ لَبِيد بالخبر الحاسم: عفت الديار. ثم يفصّل الخراب موضعًا موضعًا، كأنه يحصي ما ضاع."
  devices:
    - title: "التفصيل بعد الإجمال"
      text: "قال «عَفَتِ الدِّيَارُ» ثم فصّل: «مَحَلُّهَا فَمُقَامُهَا»، ثم «غَوْلُهَا فَرِجَامُهَا»؛ والعطف بالفاء يمرّ على الأماكن واحدًا بعد واحد."
    - title: "المحلّ والمقام"
      text: "المحلّ للنزول القصير، والمقام للإقامة الطويلة [@ibn-al-anbari، ص518]؛ فالبيت يقول: عفا كل شيء، ما قصر منه وما طال."
    - title: "اختيار «تَأَبَّدَ»"
      text: "اختار فعلًا من الأَوابِد، أي الوحوش؛ فالديار لم تخلُ فحسب، بل صارت للوحش."
  connection: "ثم يصف مدافع الرَّيّان، وقد عُرّي رسمها وبقي خَلَقًا [@ibn-al-anbari، ص519]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "عَفَتِدْ دِيَا / رُ مَحَلْلُهَا / فَمُقَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن — بِمِنَنْ تَأَبْ / بَدَ غَوْلُهَا / فَرِجَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "جاءت التفعيلات الست كلها تامة «متَفاعلن» بلا إضمار. والكامل هو «البحر الثالث الذي كثر دورانه في الشعر العربي» [@ahda-sabil، ص40]."
context: "مطلع معلقة لَبِيد، وهي السابعة والأخيرة في ترتيب ابن الأَنْبارِيّ."
variants:
  - reading: "بِمِنَى"
    status: "رواية أخرى"
    note: "بلا تنوين، لمن أنّث «مِنَى» [@ibn-al-anbari، ص518]."
