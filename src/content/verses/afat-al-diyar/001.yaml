first: "عَفَتِ الدِّيَارُ مَحَلُّهَا فَمُقَامُهَا"
second: "بِمِنًى تَأَبَّدَ غَوْلُهَا فَرِجَامُهَا"
meaning: "درست ديار الأحبة: ما كان منها للنزول أيامًا، وما كان للإقامة الطويلة، بالموضع المسمى مِنًى؛ وتوحّشت ديارهم عند الغَوْل والرِّجام بعد رحيل أهلها [@zawzani، ص171]. ومِنًى هذه في حِمَى ضَرِيّة من بلاد غَنِيّ وكِلاب، لا مِنًى مكة [@ibn-al-anbari، ص518]."
vocabulary:
  - term: "عَفَتِ"
    text: "«معناه درست» [@ibn-al-anbari، ص517]، أي امّحت آثارها."
  - term: "مَحَلُّهَا فَمُقَامُهَا"
    text: "المحلّ «حيث يحل القوم من الدار»، والمقام «حيث طال مكثهم فيه» [@ibn-al-anbari، ص518]."
  - term: "مِنًى"
    text: "«موضع قريب من طخفة بالحمى في بلاد غنى وكلاب، وليس بمنى مكة» [@ibn-al-anbari، ص518]. والحِمَى: أرض تُحمى للكلأ، وهو هنا حِمَى ضَرِيّة، وفيه الغَوْل والرِّجام أيضًا [@ibn-al-anbari، ص518]."
  - term: "تَأَبَّدَ"
    text: "«معناه توحش» [@ibn-al-anbari، ص517]."
  - term: "غَوْلُهَا فَرِجَامُهَا"
    text: "الغَوْل والرِّجام جبلان معروفان [@zawzani، ص171]؛ وقال بعض الرواة: «الغول ماء معروف، والرجام: الهضاب» [@ibn-al-anbari، ص518]. وفي لسان العرب: «والغول: ما انهبط من الأرض؛ وبه فسر قول لبيد»، «وقيل: إن غولها ورجامها في هذا البيت موضعان» [@lisan، ج11 ص509]."
syntax:
  - "«الدِّيَارُ» فاعل «عَفَتِ»، و«مَحَلُّهَا» مرفوع بفعل مضمر، والتقدير: عفا محلها فمقامها. ولا يكون توكيدًا للديار، «لأن الفاء أوجبت التفرق» [@ibn-al-anbari، ص518]: فالعطف بالفاء يفرّق بين الأماكن، والتوكيد يجمعها."
  - "الباء في «بِمِنًى» فيها قولان: قال هشام بن معاوية الضَّرِير «هي من صلة تأبد، أي تأبد بمنى»، وقال غيره: الباء صلة المضمر الذي رفع المحل، والتقدير «عفا محلها فمقامها بمنى» [@ibn-al-anbari، ص518]."
  - "الضمير في «غَوْلُهَا» و«رِجَامُهَا» يعود على الديار، والتقدير: ديار غولها وديار رجامها، فحُذف المضاف [@zawzani، ص171]."
morphology:
  - "«عفا» يكون لازمًا ومتعديًا: عفت الريح المنزل، وعفا المنزل نفسه؛ وهو في البيت لازم [@zawzani، ص171]."
  - "«تَأَبَّدَ» على وزن «تفعّل» من «أبد» إذا توحّش، يقال: «أبدت الدار تأبد أبوداً. وتأبدت تأبُّداً، إذا توحشَّت. والأوابد: الوحش؛ ومنه أوابد الشعر» [@ibn-al-anbari، ص517]."
  - "«مُقَام» بضم الميم من «أقام»، وهو هنا «يعني الإقامة» [@lisan، ج12 ص498]. و«مِنًى» «يذكر ويؤنث»: فمن ذكّره رواه «بمنًى» بالتنوين، ومن أنّثه رواه بغير تنوين [@ibn-al-anbari، ص518]."
rhetoric:
  thesis: "يبدأ لَبِيد بالخبر الحاسم: عفت الديار. ثم يفصّل الخراب موضعًا موضعًا، كأنه يحصي ما ضاع."
  devices:
    - title: "التفصيل بعد الإجمال"
      text: "قال «عَفَتِ الدِّيَارُ» ثم فصّل: «مَحَلُّهَا فَمُقَامُهَا»، ثم «غَوْلُهَا فَرِجَامُهَا»؛ والعطف بالفاء يمرّ على الأماكن واحدًا بعد واحد."
    - title: "المحلّ والمقام"
      text: "المحلّ للنزول القصير، والمقام للإقامة الطويلة [@ibn-al-anbari، ص518]؛ فالبيت يقول: عفا كل شيء، ما قصر منه وما طال."
    - title: "اختيار «تَأَبَّدَ»"
      text: "اختار فعلًا من الأَوابِد، أي الوحوش؛ فالديار لم تخلُ فحسب، بل صارت للوحش. وهذا ما سيصوّره في الأبيات 6–7: الظباء والنعام والبقر تلد وترعى في منازل الناس."
  connection: "ثم يصف مدافع الرَّيّان، وقد عُرّي رسمها وبقي خَلَقًا [@ibn-al-anbari، ص519]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة، وبعدها هاء الوصل ثم ألف الخروج: «ـامُها»"
  scansion: "عَفَتِدْ دِيَا / رُ مَحَلْلُهَا / فَمُقَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن — بِمِنَنْ تَأَبْ / بَدَ غَوْلُهَا / فَرِجَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "جاءت التفعيلات الست كلها تامة «متَفاعلن» بلا إضمار. والكامل هو «البحر الثالث الذي كثر دورانه في الشعر العربي» [@ahda-sabil، ص40]. ويضرب ابن رَشِيق هذا المطلع مثلًا لحرف الرَّوِيّ يقع قبل آخر البيت بحرف: «فالميم حرف الروي» [@ibn-rashiq، ج1 ص159]؛ والرَّوِيّ: الحرف الذي تُبنى عليه القصيدة وتُنسب إليه. ويُمثَّل به في كتاب المُوَشَّح للنَّفاذ، «وهو حركة الهاء التى للوصل» [@muwashshah، ص10]. والبيت مصرَّع، والتصريع «ما كانت عروض البيت فيه تابعة لضربه» [@ibn-rashiq، ج1 ص173]، أي أن الصدر يُختم بقافية العجز، كما تتفق هنا «فَمُقَامُهَا» و«فَرِجَامُهَا»."
context: "مطلع معلقة لَبِيد، وهي السابعة والأخيرة في ترتيب ابن الأَنْبارِيّ. وفي رواية يرويها أبو الفَرَج الأَصْفَهانيّ أن لَبِيدًا أنشد النابِغة الذُّبْيانيّ وهو فتى على باب النُّعْمان قصيدتين، ثم أنشده هذا المطلع، «فقال له النابغة: اذهب فأنت أشعر العرب» [@aghani-dk، ج15 ص378]. والخبر راجح الأصل، وهو من الأخبار الأدبية التي تُروى حول الشعر، وتفصيله في المرحلة الأولى من مسار لَبِيد."
variants:
  - reading: "بِمِنَى"
    status: "رواية أخرى"
    note: "بلا تنوين، لمن أنّث «مِنَى» [@ibn-al-anbari، ص518]. وفي الديوان «بِمِنًى» منوّنة كرواية ابن الأَنْبارِيّ [@diwan-labid، ص297]."
