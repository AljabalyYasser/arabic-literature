first: "رَفَّعْتُهَا طَرَدَ النَّعَامِ وَفَوْقَهُ"
second: "حَتَّى إِذَا سَخِنَتْ وَخَفَّ عِظَامُهَا"
meaning: "دفعتُ فرسي في السير عَدْوَ النعام وأسرع منه، حتى إذا حميت بالعرق وخفّت أعضاؤها للجري. قال ابن الأَنْبارِيّ: «معناه رفعتها في السير. وفوقه، معناه: وفوق الطَّرد. سخنت، معناه: سخن عظامها، أي عرقت فخفت للعدو» [@ibn-al-anbari، ص584]."
vocabulary:
  - term: "رَفَّعْتُهَا"
    text: "«رفعتها في السير» [@ibn-al-anbari، ص584]، و«رفّعتها: مبالغة رفعت» [@zawzani، ص196]، أي حملتها على أرفع العدو."
  - term: "طَرَدَ النَّعَامِ"
    text: "عَدْوه. قال التِّبْرِيزِيّ: «وطرد النعام: عدوه، يقال: طَرَد، وَطَرْد» [@tabrizi-ashr، ص166]. وقال بعض أهل اللغة: «الطرد: دون الحضر الشديد. يريد إنه خب بها ثم أحضر بها» [@ibn-al-anbari، ص584]؛ والخَبَب: ضرب من العدو، والإحضار: أشدّه."
  - term: "سَخِنَتْ"
    text: "عرقت وحميت. وفي اللسان: «وسخنت الدابة إذا أجريت فسخن عظامها وخفت في حضرها» [@lisan، ج13 ص207]."
  - term: "عِظَامُهَا"
    text: "«أراد بقوله (عظامها) أعضاءها» [@ibn-al-anbari، ص584]."
syntax:
  - "«والطرد منصوب على المصدر، كما تقول: أقبل زيد ركضا» [@ibn-al-anbari، ص584]، و«طرد منصوب لأن معنى رفعتها طردتها» [@tabrizi-ashr، ص166]؛ أي هو مفعول مطلق من غير لفظ فعله."
  - "«وَفَوْقَهُ» ظرف معطوف على «طَرَدَ»، والضمير فيه للطرد: «وفوق الطَّرد» [@ibn-al-anbari، ص584]."
  - "«حَتَّى إِذَا» شرط، وجوابه في أول البيت التالي: «وقلقت جواب حتى إذا» [@ibn-al-anbari، ص584]."
  - "قال «وَخَفَّ عِظَامُهَا» ولم يقل خفّت، «لأن التأنيث غير حقيقي» [@tabrizi-ashr، ص166]."
morphology:
  - "«رَفَّع» على «فعّل» للتكثير والمبالغة من «رفع» [@zawzani، ص196]."
  - "في «سخن» لغات: «ويقال سخِنَتْ وسخُنت وسخَنت... وسخِنت عين الرجل بالكسر لا غير» [@ibn-al-anbari، ص584]."
  - "«الطَّرَد والطَّرْد... بفتح الراء وتسكينها لغتان» [@zawzani، ص196]."
rhetoric:
  thesis: "الفرس التي انتصبت نخلةً تنطلق الآن، فيقيس لبيد سرعتها بأسرع ما يعرف العربي من العدو: عدو النعام، ثم يزيد عليه."
  devices:
    - title: "التشبيه بالمصدر"
      text: "«رَفَّعْتُهَا طَرَدَ النَّعَامِ»: لم يقل كالنعام، بل جعل عدوها هو عدو النعام نفسه، فالمصدر المنصوب يحمل التشبيه بلا أداة. والتشبيه: إلحاق شيء بشيء في صفة."
    - title: "الزيادة على المشبّه به"
      text: "«وَفَوْقَهُ»: كلمة واحدة ترفع الفرس فوق ما شُبّهت به، فهي أسرع من النعام. وهذا الاستدراك بعد التشبيه من أبلغ ما في البيت."
    - title: "الكناية"
      text: "«سَخِنَتْ وَخَفَّ عِظَامُهَا» كناية عن بلوغ الفرس أقصى جريها؛ فالعرق دليل الجهد، والخفة دليل الانطلاق. والكناية: أن تذكر شيئًا وتريد لازمه."
  connection: "وجواب «حتى إذا» في البيت التالي: اضطرب سرجها وسال عرقها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "رَفْفَعْتُهَا / طَرَدَنْنَعَا / مِ وَفَوْقَهُو = مُتْفاعلن / متَفاعلن / متَفاعلن — حَتْتَى إِذَا / سَخِنَتْ وَخَفْ / فَ عِظَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر والأولى من العَجُز. وأُشبعت ضمة الهاء في «وَفَوْقَهُ» في آخر الصدر فصارت «هُو»."
context: "قلب مقطع الفرس: من النزول (66) إلى العدو. والبيت معلّق بما بعده، لأن جواب «حتى إذا» في أول البيت 68، وهو ما يسميه ابن رَشِيق التضمين: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
variants:
  - reading: "رَفَّعْتُهَا طَرْدَ النَّعَامِ وَشَلَّهُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«والشَّلُّ والشَّلَلُ الطرد أيضًا» [@zawzani، ص196]. وبها متن الديوان [@diwan-labid، ص316]."
  - reading: "سَخُنَتْ"
    status: "رواية اللسان"
    note: "بضم الخاء [@lisan، ج13 ص207]."
