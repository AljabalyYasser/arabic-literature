first: "أَفَتِلْكَ أَمْ وَحْشِيَّةٌ مَسْبُوعَةٌ"
second: "خَذَلَتْ وَهَادِيَةُ الصِّوَارِ قِوَامُهَا"
meaning: "أهذه الأتان التي وصفتُها تشبه ناقتي، أم تشبهها بقرة وحشية افترس السبع ولدها، وقطيعها تتقدمه بقرة يهتدي بها؟ قال ابن الأَنْبارِيّ: «معناه: أفتلك الأتان التي تشبه ناقتي أم بقرة وحشية مسبوعة، أكل السبع ولدها فهي مذعورة» [@ibn-al-anbari، ص553]. ويختلف الشارحان فيمن خذلته البقرة. فهي عند ابن الأَنْبارِيّ خذلت القطيع: «يريد: خذلت أصحابها» [@ibn-al-anbari، ص553] «من الوحش وأقامت على ولدها ترعى قربه وتلفت إلى البقر، فإذا رأتها طابت نفسها وعلمت أن الصوار لم يفتها» [@ibn-al-anbari، ص554]. وهي عند الزَّوْزَنِيّ خذلت ولدها: «أناقتي تشبه تلك الأتان أو هذه البقرة التي خذلت ولدها وذهبت ترعى مع صواحبها وجعلت هادية الصوار قوام أمرها، فافترست السباع ولدها» [@zawzani، ص186]."
vocabulary:
  - term: "مَسْبُوعَةٌ"
    text: "التي أصاب السبعُ ولدها: «أكل السبع ولدها فهي مذعورة» [@ibn-al-anbari، ص553]."
  - term: "خَذَلَتْ"
    text: "«تأخرت عن القطيع» [@ibn-al-anbari، ص553]. وعند الزَّوْزَنِيّ: تركت ولدها وذهبت ترعى [@zawzani، ص186]."
  - term: "هَادِيَةُ"
    text: "«التي تهدى الصوار، أي تكون في أوله. والهوادي: الأوائل من كل شيء» [@ibn-al-anbari، ص554]."
  - term: "الصِّوَارِ"
    text: "«القطيع من البقر» [@ibn-al-anbari، ص554]، أي من بقر الوحش. «ويقال صُوَار وصوِار وصيار، والجمع أصورة وصيران» [@ibn-al-anbari، ص554]."
  - term: "قِوَامُهَا"
    text: "ما يقوم به أمرها: «يقال: هذا قوام الأمر وقيامه، أي به يقوم الأمر» [@ibn-al-anbari، ص554]. وفي اللسان: «وَيُقَالُ: هَذَا قِوامُ الأَمر ومِلاكُه الَّذِي يَقوم بِهِ»، ويستشهد بالبيت [@lisan، ج12 ص499]."
syntax:
  - "الهمزة للاستفهام، والفاء بعدها عاطفة. و«تِلْكَ» مبتدأ خبره محذوف: «وتلك ترتفع بإضمار: شبيهة ناقتى» [@ibn-al-anbari، ص554]، و«وَحْشِيَّةٌ» معطوفة عليها بـ«أَمْ». فالتقدير: أتلك شبيهة ناقتي أم وحشية؟ و«أَمْ» هنا المعادلة للهمزة، يُطلب بها تعيين أحد الأمرين."
  - "«مَسْبُوعَةٌ» نعت لـ«وَحْشِيَّةٌ»، وجملة «خَذَلَتْ» نعت ثانٍ."
  - "الواو في «وَهَادِيَةُ الصِّوَارِ قِوَامُهَا» واو الحال، والجملة الاسمية بعدها حال: «هَادِيَةُ» مبتدأ مضاف إلى «الصِّوَارِ»، و«قِوَامُهَا» خبره."
morphology:
  - "«مَسْبُوعَة» اسم مفعول على «مَفْعُولة»، مشتق من السَّبُع، أي التي نالها السبع في ولدها."
  - "«وَحْشِيَّة» منسوبة إلى الوحش بياء النسب، وهي صفة أُقيمت مقام موصوفها، أي بقرة وحشية."
  - "«هَادِيَة» اسم فاعل من «هدى يهدي». قال الزَّوْزَنِيّ: «الهادية: المتقدمة والمتقدم أيضًا، فتكون التاء إذن للمبالغة» [@zawzani، ص186]، أي قد يتقدم القطيعَ ثورٌ، فتكون التاء للمبالغة لا للتأنيث."
  - "«الصِّوَار» على «فِعال»، ويقال بضم الصاد أيضًا، وجمعه «الصِّيران» [@zawzani، ص186]."
rhetoric:
  thesis: "بيت الانتقال: يعرض الشاعر على السامع تشبيهين لناقته ويسأل أيهما أصدق، فيفتح بالسؤال حكاية ثانية أطول من الأولى وأحزن: أمّ فقدت ولدها."
  devices:
    - title: "الاستفهام للانتقال"
      text: "«أَفَتِلْكَ أَمْ وَحْشِيَّةٌ»: لا ينتظر الشاعر جوابًا، بل يعرض تشبيهًا ثانيًا دون أن يُبطل الأول، فالناقة تشبه هذه وتلك. والتشبيه: أن يُلحق شيء بشيء في صفة. وبهذا السؤال يبقى السامع مع الناقة وهو يسمع حكاية البقرة. وهذه قراءتنا."
    - title: "الحذف"
      text: "في «أَفَتِلْكَ» حُذف الخبر (شبيهة ناقتي) كما قدّره ابن الأَنْبارِيّ، وفي «وَحْشِيَّةٌ» حُذف الموصوف (بقرة). والسامع يعرفهما من البيت 25 الذي بدأ فيه تشبيه الناقة، فلا حاجة إلى ذكرهما، ويبقى البيت خفيفًا سريعًا."
  connection: "ثم يصف البقرة نفسها: «خَنْسَاءُ ضَيَّعَتِ الْفَرِيرَ»، فيذكر ولدها الضائع وطوافها في طلبه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَفَتِلْكَ أَمْ / وَحْشِيْيَتُنْ / مَسْبُوعَتُنْ = متَفاعلن / مُتْفاعلن / مُتْفاعلن — خَذَلَتْ وَهَا / دِيَةُ صْصِوَا / رِ قِوَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلتين الثانية والثالثة من الصدر، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "أول أبيات البقرة المسبوعة (36–39)، وبه تبدأ المرحلة الثالثة من المسار (36–88). كان الشاعر قد شبّه ناقته بالأتان وأتم حكايتها في البيت 35، فيعود بسؤال إلى ناقته، ثم يبدأ تشبيهًا ثانيًا يمتد إلى البيت 52."
variants:
