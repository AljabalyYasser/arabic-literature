first: "رُزِقَتْ مَرَابِيعَ النُّجُومِ وَصَابَهَا"
second: "وَدْقُ الرَّوَاعِدِ جَوْدُهَا وَرِهَامُهَا"
meaning: "سُقيت هذه الديار أمطار الربيع الأولى، ونزل عليها مطر السحاب الراعد، غزيرُه ولَيِّنُه. قال الزَّوْزَنِيّ: «وتحرير المعنى: أن تلك الديار ممرعة معشبة لترادف الأمطار المختلفة عليها» [@zawzani، ص173]. وممرعة: مخصبة كثيرة الكلأ."
vocabulary:
  - term: "مَرَابِيعَ النُّجُومِ"
    text: "مرابيع السحاب «أول ما يكون من مطر الربيع»، «ويقال: مرابيع النجوم هي نجوم الوسمي» [@ibn-al-anbari، ص521]. وعند الزَّوْزَنِيّ: «الأنواء الربيعية وهي المنازل التي تحلّها الشمس فصل الربيع» [@zawzani، ص172]. والأنواء: نجوم كانت العرب تنسب المطر إلى طلوعها وسقوطها."
  - term: "صَابَهَا"
    text: "«معناه نزل عليها»، «يقال صاب المطر يصوب، إذا نزل» (أبو عُبَيْدة)؛ وقيل: قصد لها، وقيل: أصابها [@ibn-al-anbari، ص521–522]."
  - term: "وَدْقُ"
    text: "«والودق من المطر: الداني من الأرض، واحدته ودقة؛ يقال: ودق يدق، إذا دنا» [@ibn-al-anbari، ص522]."
  - term: "الرَّوَاعِدِ"
    text: "«السحائب ذوات الرعد، واحدتها راعدة» [@ibn-al-anbari، ص522]."
  - term: "جَوْدُهَا وَرِهَامُهَا"
    text: "الجَوْد: «المطر التام العام، وقال ابن الأنباري: هو المطر الذي يرضي أهله»، والرِّهام: «جمعا رِهمة وهي المطرة التي فيها لين» [@zawzani، ص172]. وعند ابن الأَنْبارِيّ: «والرهم: أمطار ضعاف» [@ibn-al-anbari، ص523]."
syntax:
  - "«رُزِقَتْ» ماضٍ مبني للمجهول، ونائب فاعله ضمير الدِّمَن، و«مَرَابِيعَ» مفعوله الثاني. وفي الفعل قولان: «دعاء لها، أي رزقها الله تبارك وتعالى مرابيع السحاب» [@ibn-al-anbari، ص521]، و«قال بعض أهل اللغة: قوله (رزقت مرابيع النجوم) خبر وليس بدعاء» [@ibn-al-anbari، ص523]."
  - "«وَدْقُ» فاعل «صَابَهَا»، و«الجود والرهام تابعان للودق» [@ibn-al-anbari، ص524]، أي بدل منه، كأنه قال: صابها الودق، جودُه ورهامُه."
morphology:
  - "«مَرَابِيع» جمع «مِرْبَاع»، «بمنزلة المرباع من النوق»، وهي التي تنتج في أول النتاج [@ibn-al-anbari، ص521]؛ فالمطر المرباع أول مطر الربيع كما أن الناقة المرباع أول الإبل نتاجًا."
  - "«صَابَ يَصُوبُ» أجوف واوي، «يقال صاب المطر يصوب، إذا نزل» [@ibn-al-anbari، ص521]، ومنه الصَّيِّب: المطر."
  - "«رَوَاعِد» جمع «رَاعِدة»، و«رِهَام» جمع «رِهْمة»، ويقال في الجمع أيضًا «رِهَم» [@ibn-al-anbari، ص523]."
rhetoric:
  thesis: "الديار التي خلت من الناس لم تمت: جادها المطر بأنواعه. فبعد صورة الخراب تأتي صورة الخصب."
  devices:
    - title: "المطر رزقًا"
      text: "في «رُزِقَتْ» جعل المطر رزقًا يُعطاه المكان، وفي لسان العرب: «جعل الرزق مطرا لأن الرزق عنه يكون» [@lisan، ج10 ص115]. فسمّى السبب باسم ما يكون عنه."
    - title: "التفصيل بعد الإجمال"
      text: "ذكر «وَدْقُ الرَّوَاعِدِ» ثم فصّله: «جَوْدُهَا وَرِهَامُهَا»، أي الغزير واللين. فالديار أصابها المطر كله، كما مضت عليها السنة كلها «حلالها وحرامها» في البيت السابق."
    - title: "بين الدعاء والخبر"
      text: "إن كان «رُزِقَتْ» دعاءً فالشاعر يتمنى للديار الخصب بعد أهلها، وإن كان خبرًا فهو يصف خصبها الحاضر. وعلى الوجهين يقابل الشاعر بين الحياة التي عادت إلى المكان والناس الذين لم يعودوا."
  connection: "ثم يفصّل هذه الأمطار: سحاب الليل والغداة والعشي [@ibn-al-anbari، ص524]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "رُزِقَتْ مَرَا / بِيعَنْ نُجُو / مِ وَصَابَهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — وَدْقُرْ رَوَا / عِدِ جَوْدُهَا / وَرِهَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "أول أبيات المطر في المطلع. بعد أن وصف الشاعر عفاء الديار ومضيّ السنين عليها، يصف الأمطار التي أخصبتها، ليصل إلى صورة الوحش يسكنها في البيتين 6–7."
variants:
  - reading: "رُزِقَتْ مَرَابِيعَ السَّحَابِ"
    status: "رواية الأَصْمَعِيّ"
    note: "[@ibn-al-anbari، ص521]. ويرى محقق الديوان إحسان عَبّاس أنها «لعله من تغييرات الأصمعي لأنه كان يكره الحديث في الأنواء ويتجنبه» [@diwan-labid، ص298]، وهو رأي المحقق."
  - reading: "جَوْدُهَا فَرِهَامُهَا"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "بالفاء [@zawzani، ص172] [@diwan-labid، ص298]، وكذلك في الجمهرة [@jamhara، ص238] ولسان العرب [@lisan، ج10 ص115]."
