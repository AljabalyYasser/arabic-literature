first: "فَلَحِقْنَ وَاعْتَكَرَتْ لَهَا مَدَرِيَّةٌ"
second: "كَالسَّمْهَرِيَّةِ حَدُّهَا وَتَمَامُهَا"
meaning: "فلحقت الكلاب البقرة، فكرّت عليها البقرة بقرن يشبه الرمح الصلب في حدّته وتمام طوله. قال ابن الأَنْبارِيّ: «فلحقن، معناه فلحقت الكلاب هذه البقرة فرجعت البقرة عليهن تطعنهن» [@ibn-al-anbari، ص568]. وقال الزَّوْزَنِيّ: «أي أقبلت البقرة على الكلاب وطعنتها بهذا القرن الذي هو كالرماح» [@zawzani، ص191]."
vocabulary:
  - term: "اعْتَكَرَتْ"
    text: "«معناه رجعت. يقال فلان عكار في الحرب، أي عطاف» [@ibn-al-anbari، ص568]."
  - term: "مَدَرِيَّةٌ"
    text: "عند ابن الأَنْبارِيّ البقرة نفسها: «يعنى البقرة لها مدرى، أي قرن» [@ibn-al-anbari، ص568]، وعند الزَّوْزَنِيّ القرن: «المدرية: طرف قرنها» [@zawzani، ص191]. وفي اللسان: «والمَدَرِيَّةُ: رِماحٌ كَانَتْ تُرَكَّبُ فِيهَا القُرونُ المُحدّدةُ مكانَ الأَسِنَّة»، وفي البيت «يَعْنِي الْقُرُونَ» [@lisan، ج5 ص163]."
  - term: "السَّمْهَرِيَّةِ"
    text: "«القناة الشديدة» [@ibn-al-anbari، ص568]، «وقال بعض أهل اللغة: السمهرية: الرماح الطوال المستوية» [@ibn-al-anbari، ص569]. وعند الزَّوْزَنِيّ هي «منسوبة إلى سمهر، رجل كان بقرية تسمى خطا من قرى البحرين وكان مثقفًا» [@zawzani، ص191]، أي يقوّم الرماح، والمقصود قرية الخَطّ من البَحْرَيْن."
  - term: "تَمَامُهَا"
    text: "طولها واكتمالها: «ولها قرن يشبه الرماح في حدتها وتمام طولها» [@zawzani، ص191]."
syntax:
  - "«فَلَحِقْنَ» معطوف بالفاء على «أَرْسَلُوا»، والنون للكلاب. و«مَدَرِيَّةٌ» فاعل «اعْتَكَرَتْ» على تفسير ابن الأَنْبارِيّ، أي البقرة ذات القرن."
  - "«والكاف في موضع رفع على النعت لمدرية. وحدها وتمامها يرتفعان على الاتباع لمدرية» [@ibn-al-anbari، ص569]: أي «كَالسَّمْهَرِيَّةِ» نعت، و«حَدُّهَا وَتَمَامُهَا» تابعان لـ«مَدَرِيَّةٌ» يبيّنان وجه الشبه."
morphology:
  - "«اعْتَكَرَتْ» على «افتعلت» من «عكَر» إذا عطف ورجع: «عكر واعتكر أي عطف» [@zawzani، ص191]."
  - "«مَدَرِيَّة» منسوبة بياء النسب، والتاء للتأنيث."
  - "«السَّمْهَرِيَّة» عند الزَّوْزَنِيّ نسبة إلى «سَمْهَر» [@zawzani، ص191]، وعند ابن الأَنْبارِيّ من «اسمهرّ» إذا اشتد: «يقال اسمهر الأمر، إذا اشتد» [@ibn-al-anbari، ص568]."
rhetoric:
  thesis: "الفريسة تنقلب مقاتلة. البقرة التي كانت تهرب وتتردد تعطف على الكلاب، وسلاحها قرن كالرمح."
  devices:
    - title: "التشبيه المفصّل"
      text: "«كَالسَّمْهَرِيَّةِ حَدُّهَا وَتَمَامُهَا»: ذكر أداة التشبيه (الكاف) ووجه الشبه (الحدّ والتمام)، فالقرن كالرمح في حدّته وفي طوله. والتشبيه المفصّل: ما ذُكر فيه وجه الشبه. وقد جاء صريحًا بعد استعارات الأبيات السابقة، والمقام مقام قتال يحتاج إلى وضوح. وهذه قراءتنا."
    - title: "الصفة في موضع الموصوف"
      text: "«مَدَرِيَّةٌ»: على تفسير ابن الأَنْبارِيّ لم يقل البقرة، بل وصفها بالقرن الذي لها، فأقام الصفة مقام الموصوف، وصارت كأنها كلها سلاح."
  connection: "ثم يذكر علة كرّها: لتطرد الكلاب، وقد أيقنت أن موتها قريب إن لم تفعل."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَلَحِقْنَ وَعْ / تَكَرَتْ لَهَا / مَدَرِيْيَتُنْ = متَفاعلن / متَفاعلن / متَفاعلن — كَسْسَمْهَرِيْ / يَةِ حَدْدُهَا / وَتَمَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "سلم الصدر من الزحاف، ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من العجز."
context: "السابع من أبيات الصباح والرماة والكلاب (44–52). هنا تبلغ الحكاية ذروتها: المواجهة."
variants:
  - reading: "فَلَحِقْنَ وَاعْتَكَرَتْ لَهَا مَدْرِيَّةٌ"
    status: "ضبط ابن الأَنْبارِيّ"
    note: "كذا ضُبطت في نص ابن الأَنْبارِيّ بسكون الدال [@ibn-al-anbari، ص568]، ونضبطها بفتحها كما في الزَّوْزَنِيّ والديوان واللسان. والوزن يستقيم بالوجهين."
