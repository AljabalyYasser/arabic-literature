first: "فَتَنَازَعَا سَبِطًا يَطِيرُ ظِلَالُهُ"
second: "كَدُخَانِ مُشْعَلَةٍ يُشَبُّ ضِرَامُهَا"
meaning: "فعدا العير والأتان إلى الماء، وتجاذبا بينهما غبارًا طويلًا ممتدًّا يطير ما يُظلّ منه، كأنه دخان نار أُوقدت وأُلهب حطبها الدقيق. قال الزَّوْزَنِيّ: «وتلخيص المعنى: أنه جعل الغبار الساطع بينهما بعدوهما كثوب يتجاذبانه، ثم شبهه في كثافته وظلمته بدخان نار موقدة» [@zawzani، ص184]."
vocabulary:
  - term: "فَتَنَازَعَا"
    text: "«التنازع: مثل التجاذب» [@zawzani، ص184]. وقال أبو جَعْفَر: «عدَوَا عدواً سريعا حتى أثارا به الغبار» [@ibn-al-anbari، ص549]."
  - term: "سَبِطًا"
    text: "«أي غبارا مرتفعا طويلا» [@ibn-al-anbari، ص548]. وعند الزَّوْزَنِيّ: «السَّبْط: الممتد الطويل» [@zawzani، ص184]."
  - term: "ظِلَالُهُ"
    text: "«ما يظل منه» [@ibn-al-anbari، ص549]، أي ما يرتفع من الغبار فيُلقي ظلًّا."
  - term: "مُشْعَلَةٍ"
    text: "«نار وقد أشعلت» [@ibn-al-anbari، ص549]."
  - term: "يُشَبُّ"
    text: "«يوقد ويهيج» [@ibn-al-anbari، ص549]. «شبُّ النار وإشعالها واحد» [@zawzani، ص184]."
  - term: "ضِرَامُهَا"
    text: "«الضرام: دقائق الحطب» [@zawzani، ص184]، أي صغاره التي تشتعل بسرعة. «ويقال الضرام هو الحطب» [@ibn-al-anbari، ص549]."
syntax:
  - "«سَبِطًا» مفعول به لـ«تَنَازَعَا»، وهو صفة لموصوف محذوف: «سبطًا أي غبارًا سبطًا فحذف الموصوف» [@zawzani، ص184]."
  - "«ويطير موضعه نصب في التأويل، والهاء يعود على الغبار، والمعنى: فتنازعا غبارا طائرا ظلاله. والكاف منصوبة على النعت للسبط» [@ibn-al-anbari، ص549]: فجملة «يَطِيرُ ظِلَالُهُ» صفة، و«كَدُخَانِ» صفة ثانية."
  - "«مُشْعَلَةٍ» صفة لموصوف محذوف: «أي نار مشعلة، فحذف الموصوف» [@zawzani، ص184]. وجملة «يُشَبُّ ضِرَامُهَا» صفة لها، و«ضِرَامُهَا» نائب فاعل."
morphology:
  - "«تَنَازَعَ» على «تفاعل»، وهو للمشاركة: كل منهما يجاذب الآخر."
  - "«ضِرَام» جمع «ضَرَم»، و«ضَرَم» جمع «ضَرَمة» [@ibn-al-anbari، ص549] [@zawzani، ص184]، فهو جمع الجمع."
  - "«مُشْعَلَة» اسم مفعول من «أشعل» على «أفعل»، و«يُشَبُّ» مضارع «شبّ» مبنيًّا للمجهول."
rhetoric:
  thesis: "الجري إلى الماء يُرى في غباره: خيط طويل من الغبار بين العير والأتان، كأنه دخان نار تشتعل."
  devices:
    - title: "الاستعارة في «فَتَنَازَعَا»"
      text: "الاستعارة: أن يُستعمل اللفظ في غير ما وُضع له لشبه بينهما. والتنازع أن يجذب كل واحد الشيء إليه. فجعل الغبار الممتد بين العدّاءين شيئًا يتجاذبانه، كما قال الزَّوْزَنِيّ: «كثوب يتجاذبانه» [@zawzani، ص184]. ويقرر عبد القاهر الجُرْجانيّ أن الاستعارة تقع في الفعل كما تقع في الاسم: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]، وهي هنا في الفعل."
    - title: "التشبيه"
      text: "في «كَدُخَانِ مُشْعَلَةٍ» شبّه الغبار بدخان النار «في كثافته وظلمته» [@zawzani، ص184]. واختار نارًا في أول اشتعالها، يُشبّ دقيق حطبها، لأن هذه أكثر دخانًا. وسيزيد هذا الدخان وصفًا في البيت التالي."
    - title: "حذف الموصوف"
      text: "حذف الموصوف مرتين: «سَبِطًا» أي غبارًا، و«مُشْعَلَةٍ» أي نارًا [@zawzani، ص184]. فبقيت الصفة وحدها تحمل الصورة: الامتداد في الأول، والاشتعال في الثاني."
  connection: "ثم يصف هذه النار نفسها: أصابتها ريح الشمال، وخُلط حطبها بعرفج أخضر، فارتفع دخانها [@ibn-al-anbari، ص549–550]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَتَنَازَعَا / سَبِطَنْ يَطِي / رُ ظِلَالُهُو = متَفاعلن / متَفاعلن / متَفاعلن — كَدُخَانِ مُشْ / عَلَةِنْ يُشَبْ / بُ ضِرَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "جاءت التفعيلات الست كلها تامة «متَفاعلن»، ولم يدخلها الإضمار، وهو تسكين الثاني المتحرك. وتوالي المتحركات فيها يناسب سرعة العدو. وهذه قراءتنا."
context: "من أبيات الأتان وفحلها (25–35). هنا يبدأ العدو إلى الماء بعد العزم في البيت 29. ويذكر ابن الأَنْبارِيّ أن الرّاعي قال مثل قول لَبِيد: «كَدُخَانِ مُرْتَجِلٍ بِأَعْلَى تَلْعَةٍ ... غَرْثَانَ ضَرَّمَ عَرْفَجًا مَبْلُولَا» [@ibn-al-anbari، ص550]، والتَّلْعة: ما ارتفع من الأرض، والغَرْثان: الجائع."
variants:
  - reading: "كَدُخَانِ مُرْتَجِلٍ يُشَبُّ ضِرَامُهَا"
    status: "رواية لسان العرب"
    note: "[@lisan، ج11 ص273]. والمُرْتَجِل فيه: «الَّذِي يَقَعُ بِرِجْلٍ مِنْ جَرَاد فيَشْتَوي مِنْهَا أَو يطبخُ» [@lisan، ج11 ص273]، أي يجد قطعة من الجراد فيوقد نارًا ليشويها. ولعل هذه الرواية دخلها لفظ بيت الرّاعي، وهذا احتمال منا."
