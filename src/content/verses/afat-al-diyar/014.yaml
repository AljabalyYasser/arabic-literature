first: "زُجَلًا كَأَنَّ نِعَاجَ تُوضِحَ فَوْقَهَا"
second: "وَظِبَاءَ وَجْرَةَ عُطَّفًا أَرْآمُهَا"
meaning: "ارتحل نساء الحي جماعاتٍ، فكأنّ فوق الإبل بقرًا وحشيًّا من تُوضِح، أو ظباءً بيضًا من وَجْرة وقد عطفت أعناقها على أولادها. قال الزَّوْزَنِيّ: «وتحرير المعنى: أنه شبه النساء ببقر توضح وظباء وجرة في كحل أعينها» [@zawzani، ص178]."
vocabulary:
  - term: "زُجَلًا"
    text: "«جماعات، واحدتها زجلة» [@ibn-al-anbari، ص531]."
  - term: "نِعَاجَ"
    text: "«البقر» [@ibn-al-anbari، ص531]، وعند الزَّوْزَنِيّ: «إناث بقر الوحش، الواحدة نعجة» [@zawzani، ص177]."
  - term: "تُوضِحَ"
    text: "«موضع» [@ibn-al-anbari، ص531]."
  - term: "فَوْقَهَا"
    text: "أي «فوق الهوادج» [@ibn-al-anbari، ص531]."
  - term: "وَجْرَةَ"
    text: "«بلد» [@ibn-al-anbari، ص531]، وعند الزَّوْزَنِيّ: «موضع بعينه» [@zawzani، ص177]."
  - term: "عُطَّفًا"
    text: "«معناه ثانية الأعناق» [@ibn-al-anbari، ص531]، أي تلوي أعناقها. وهي عند الزَّوْزَنِيّ «جمع العاطف من العطف الذي هو الترحم أو من العطف الذي هو الثني» [@zawzani، ص177]."
  - term: "أَرْآمُهَا"
    text: "الأرآم: «ظباء بيض خوالص البياض، والواحد رئم، والأنثى رئمة» [@ibn-al-anbari، ص531]."
syntax:
  - "«وزجلا نصب على الحال من ظعن الحي» [@ibn-al-anbari، ص531]، أي من «ظُعْنُ الْحَيِّ» في البيت 12. وعند الزَّوْزَنِيّ: «نصب زجلًا على الحال والعامل فيها تحملوا» [@zawzani، ص178]، فهو حال من فاعل «تَحَمَّلُوا»."
  - "«نِعَاجَ» اسم «كَأَنَّ»، و«فَوْقَهَا» ظرف في موضع خبرها. و«تُوضِحَ» مضاف إليه، «وتوضح مختفض بإضافة النعاج إليه ونصب لأنه لا يجري» [@ibn-al-anbari، ص531]، أي جُرّ بالفتحة لأنه ممنوع من الصرف."
  - "«والظباء نسق على النعاج، وعطفا نصب على الحال» [@ibn-al-anbari، ص531]. و«أَرْآمُهَا» فاعل لـ«عُطَّفًا»: «ورفع أرآمها لأنها فاعل والعامل فيها الحال السادة مَسدّ الفعل» [@zawzani، ص178]، لأن الوصف يعمل عمل فعله."
morphology:
  - "«زُجَل» جمع «زُجْلة» [@zawzani، ص177]، على «فُعَل» جمعًا لـ«فُعْلة»، كما يقال غُرْفة وغُرَف."
  - "«عُطَّف» جمع «عاطف» على «فُعَّل»، كما يقال راكع ورُكَّع."
  - "«أَرْآم» جمع «رِئْم» على «أفعال» [@ibn-al-anbari، ص531]. و«وَجْرَة» ممنوعة من الصرف للعلمية والتأنيث، فجاءت مجرورة بالفتحة."
rhetoric:
  thesis: "لا يذكر لَبِيد النساء بلفظهن، بل يضع فوق الإبل بقر الوحش وظباءه. فتصير الهوادج التي وصفها في البيتين السابقين حاملةً لقطيع جميل."
  devices:
    - title: "التشبيه"
      text: "في «كَأَنَّ نِعَاجَ تُوضِحَ فَوْقَهَا» شبّه النساء ببقر الوحش، ثم عطف عليه تشبيهًا ثانيًا «وَظِبَاءَ وَجْرَةَ». ووجه الشبه عند الزَّوْزَنِيّ «حسن الأعين والمشي» [@zawzani، ص177]. وهو مما يراه البصر، ويجعل عبد القاهر الجُرْجانيّ هذا الضرب من التشبيه ما كان الشبه فيه «بَيّنٌ لا يجري فيه التأوُّل» [@asrar، ص92]، أي لا يحتاج القارئ في إدراكه إلى تفكير يستخرج به وجه الشبه."
    - title: "اختيار الحال «عُطَّفًا»"
      text: "لم يصف الظباء في كل حال، بل وهي تعطف أعناقها على أولادها. قال أبو جَعْفَر: «شبهها بالظباء والأرام التي معها أولادها، لتفزعها إلى أولادها وإرشاقها، فهو أحسن لها» [@ibn-al-anbari، ص531]. والإرشاق في لسان العرب: «والمُرْشِق مِنَ الظِّبَاءِ: الَّتِي تَمُدُّ عنقَها وَتَنْظُرُ فَهِيَ أَحسن مَا تَكُونُ» [@lisan، ج10 ص117]. ويعلّله الزَّوْزَنِيّ بأن عيون الظباء تكون أحسن ما تكون في هذه الحال «لكثرة مائها» [@zawzani، ص178]."
    - title: "حذف المشبَّه"
      text: "لم يقل: كأن النساء نعاج، بل قال: كأن النعاج «فَوْقَهَا»، فوضع الوحش مكان النساء على الإبل. وقد بدأ ذلك في البيت 12 حين جعل الهوادج كُنُسًا، والكِناس بيت الظبي، فاكتمل هنا ما أوحى به هناك. وهذه قراءتنا للبيتين."
  connection: "ثم يرى الظعائن تمضي في السراب، فتبدو كشجر الأثل وصخور وادي بِيشة [@ibn-al-anbari، ص531–532]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "زُجَلَنْ كَأَنْ / نَ نِعَاجَ تُو / ضِحَ فَوْقَهَا = متَفاعلن / متَفاعلن / متَفاعلن — وَظِبَاءَ وَجْ / رَةَ عُطْطَفَنْ / أَرْآمُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلةَ الثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "ثالث أبيات الظعائن (12–15). بعد أن وصف الهوادج وأغطيتها في البيتين 12–13 يصف من فيها، فلا يرى القارئ النساء إلا في صورة الوحش."
