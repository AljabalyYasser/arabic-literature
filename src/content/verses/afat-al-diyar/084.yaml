first: "فَاقْنَعْ بِمَا قَسَمَ الْمَلِيكُ فَإِنَّمَا"
second: "قَسَمَ الْخَلَائِقَ بَيْنَنَا عَلَّامُهَا"
meaning: "فارضَ أيها الحاسد بما قسم الله، فإن الذي قسم بين الناس طبائعهم وأقدارهم هو العليم بها. قال الزَّوْزَنِيّ: «يقول: فاقنع أيها العدو بما قسم الله تعالى فإن قسام المعايش والخلائق علّامها، يريد أن الله تعالى قسم لكل ما استحقه من كمال ونقص ورفعة وضعة» [@zawzani، ص200]."
vocabulary:
  - term: "اقْنَعْ"
    text: "ارضَ واكتفِ."
  - term: "الْمَلِيكُ"
    text: "الله، وفي اللسان: «عَنَى بِالْمَلِيكِ اللَّهَ عَزَّ وَجَلَّ» [@lisan، ج12 ص480]. و«الْمَلْك والْمَلِك، بسكون اللام وكسرها، والمليك واحد» [@zawzani، ص200]."
  - term: "الْخَلَائِقَ"
    text: "«الطبائع، واحدتها خليقة» [@ibn-al-anbari، ص595]. ونقل التِّبْرِيزِيّ عن الخليل أنها الأخلاق الحسنة [@tabrizi-ashr، ص174]."
  - term: "عَلَّامُهَا"
    text: "العليم بها، و«(العلام) هو الله تبارك وتعالى» [@ibn-al-anbari، ص595]."
syntax:
  - "الفاء في «فَاقْنَعْ» استئنافية، و«اقْنَعْ» فعل أمر مبني على السكون، وفاعله ضمير المخاطب. و«بِمَا» متعلق به، و«ما» موصولة صلتها «قَسَمَ الْمَلِيكُ»، والعائد محذوف، أي قسمه."
  - "الفاء في «فَإِنَّمَا» للتعليل، و«إنّما» أداة حصر. و«الْخَلَائِقَ» مفعول مقدّم، و«عَلَّامُهَا» فاعل مؤخر، «والهاء تعود على الخلائق» [@ibn-al-anbari، ص595]."
  - "والمخاطب لم يُسمَّ، وهو عند الزَّوْزَنِيّ العدو: «فاقنع أيها العدو» [@zawzani، ص200]."
morphology:
  - "«عَلّام» على «فعّال» للمبالغة من «علم». و«الْمَلِيك» على «فَعِيل» من «ملك»، بمعنى المَلِك."
  - "«خَلائِق» جمع «خليقة» على «فعائل»، وهمزتها منقلبة عن الياء الزائدة. ولذلك قال ابن الأَنْبارِيّ في الرواية الأخرى «المعايش»: «والمعايش لا تهمز، لأن الياء عين الفعل، ووزنها مفاعل. وإنما تهمز من هذا ما كان الياء فيه زائدة كقولهم فعيلة وفعائل» [@ibn-al-anbari، ص595]."
  - "«اقْنَعْ» أمر من «قنع يقنع» إذا رضي."
rhetoric:
  thesis: "يردّ لبيد على من يحسد قومه: الأقدار مقسومة، والقاسم أعلم بمن يستحق."
  devices:
    - title: "الالتفات"
      text: "«فَاقْنَعْ»: بعد الحديث عن قومه يلتفت فجأة إلى مخاطب لم يذكره، فيصير البيت ردًّا على خصم حاضر في الذهن. والالتفات: تحويل الكلام من التكلم أو الغيبة إلى الخطاب، أو العكس."
    - title: "القصر بـ«إنما»"
      text: "«فَإِنَّمَا قَسَمَ الْخَلَائِقَ بَيْنَنَا عَلَّامُهَا»: قصر القسمة على الله فلا يُعترض عليها. و«إنما» عند عبد القاهر الجُرْجانيّ موضوعة «على أن تجيء لخبر لا يجهله المخاطب ولا يدفع صحته، أو لا ينزل هذه المنزلة» [@dalail، ص330]. فلبيد يذكّر خصمه بأمر يعرفه ولا ينكره، ليقطع حجته."
    - title: "التكرار"
      text: "«قَسَمَ» في الصدر وفي أول العَجُز، ثم «قُسِّمَتْ» و«قَسَّامُهَا» في البيت التالي: الكلمة تتكرر بصيغ مختلفة، فتربط البيتين بفكرة القسمة. وهذه قراءتنا."
  connection: "ومن القسمة العامة إلى قسمة خاصة: الأمانة، ونصيب قومه منها أعظم الأنصبة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَقْنَعْ بِمَا / قَسَمَلْ مَلِي / كُ فَإِنْنَمَا = مُتْفاعلن / متَفاعلن / متَفاعلن — قَسَمَلْ خَلَا / ئِقَ بَيْنَنَا / عَلْلَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر، والثالثة من العَجُز."
context: "سابع أبيات الفخر على ترتيب ابن الأَنْبارِيّ، وهو 83 عند الزَّوْزَنِيّ والديوان، يأتي عندهما قبل «فَبَنَى لَنَا بَيْتًا» [@zawzani، ص200] [@diwan-labid، ص320]. وعلى ترتيبهما يكون الله القاسم في هذا البيت هو الباني في «فَبَنَى»."
