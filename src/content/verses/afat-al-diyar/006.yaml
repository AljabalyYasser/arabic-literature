first: "فَعَلَا فُرُوعُ الْأَيْهُقَانِ وَأَطْفَلَتْ"
second: "بِالْجَلْهَتَيْنِ ظِبَاؤُهَا وَنَعَامُهَا"
meaning: "فطالت أغصان الجرجير البري، وولدت الظباء وباضت النعام على جانبي الوادي. قال ابن الأَنْبارِيّ: «يقول: خلت الديار فتناتجت فيها الوحش» [@ibn-al-anbari، ص525]."
vocabulary:
  - term: "عَلَا"
    text: "«ارتفع وطال» [@ibn-al-anbari، ص525]."
  - term: "الْأَيْهُقَانِ"
    text: "«هو الجرجير» [@ibn-al-anbari، ص525]؛ وعند الزَّوْزَنِيّ: «بفتح الهاء وضمها: ضرب من النبت وهو الجرجير البري» [@zawzani، ص173]."
  - term: "أَطْفَلَتْ"
    text: "«معناه ولدت فصار معها أطفالها» [@ibn-al-anbari، ص525]."
  - term: "الْجَلْهَتَيْنِ"
    text: "مثنى جَلْهة: «جبهتا الوادي، وهو ما استقبلك من حروف الوادي» [@ibn-al-anbari، ص525]؛ وعند الزَّوْزَنِيّ: «جانبا الوادي» [@zawzani، ص173]."
syntax:
  - "في «فُرُوعُ» روايتان. بالرفع فاعلًا لـ«عَلَا»، وبالنصب «على معنى فعلا فروع الأيهقان الغيث» [@ibn-al-anbari، ص525]، أي علاها المطر. وفي لسان العرب وجه ثالث للنصب: «جعلت الألف التي في فعلا للتثنية أي الجود والرهام هما فعلا فروع الأيهقان وأنبتاها» [@lisan، ج10 ص11]، فيكون الفعل «فَعَلَا» من الفعل لا من العلوّ."
  - "«والظباء ترتفع بأطفلت. والهاء تعود على الجلهة» [@ibn-al-anbari، ص525]. و«بِالْجَلْهَتَيْنِ» متعلق بـ«أَطْفَلَتْ»."
  - "«وَنَعَامُهَا» معطوف على «ظِبَاؤُهَا» في اللفظ، والمعنى على فعل محذوف: «يريد: وأطفلت ظباؤها وباضت نعامها؛ لأن النعام تبيض ولا تلد الأطفال، ولكنه عطف النعام على الظباء في الظاهر لزوال اللبس» [@zawzani، ص173]."
morphology:
  - "«أَطْفَلَ» على «أفعل» للدلالة على الصيرورة: صارت ذات طفل، «أي صارت ذوات أطفال» [@zawzani، ص173]."
  - "«الأَيْهُقَان» على «فَيْعُلان»، والهاء تُضم وتُفتح [@zawzani، ص173]."
  - "«جَلْهَة» تُجمع على «جلاه وجلهات» [@ibn-al-anbari، ص525]."
rhetoric:
  thesis: "الديار التي أخصبها المطر صارت مهدًا للوحش: نبت يعلو، وصغار تولد. الحياة عادت إلى المكان، لكنها حياة الوحش لا الناس."
  devices:
    - title: "العطف على المعنى"
      text: "في «ظِبَاؤُهَا وَنَعَامُهَا» أسند «أَطْفَلَتْ» إلى النعام في الظاهر، والنعام لا تلد. ويستشهد الزَّوْزَنِيّ لهذا بقول الآخر: «وزججن الحواجب والعيونا»، أي وكحلن العيون، ويذكر خلاف النحاة فيه: «وزعم كثير من الأئمة النحويين البصريين والكوفيين أن هذا المذهب سائغ في كل موضع، ولوّح أبو الحسن الأخفش إلى أن المعوّل فيه على السماع» [@zawzani، ص173–174]. ويقول ابن سِيدَه في لسان العرب: «فإنه أراد وباض نعامها» [@lisan، ج11 ص402]. فاختصر الشاعر الفعلين في فعل واحد يدل على المعنى العام: صغار تخرج إلى الحياة."
    - title: "المقابلة بين الخراب والخصب"
      text: "البيت كله صورة حياة: نبت «عَلَا»، وأمهات «أَطْفَلَتْ». وهي تقابل «عَفَتِ» و«تَأَبَّدَ» في المطلع. فالعفاء لم يكن موتًا للمكان، بل انتقالًا له من الإنس إلى الوحش."
  connection: "ثم يتم الصورة: البقر الوحشية مطمئنة على أولادها في الفضاء [@ibn-al-anbari، ص525]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَعَلَا فُرُو / عُلْ أَيْهُقَا / نِ وَأَطْفَلَتْ = متَفاعلن / مُتْفاعلن / متَفاعلن — بِلْجَلْهَتَيْ / نِ ظِبَاؤُهَا / وَنَعَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "ثمرة المطر الذي وصفه في البيتين السابقين. ومن هذا البيت يبدأ وصف الوحش في الديار، وهو باب يعود إليه لَبِيد كثيرًا في القصيدة: الأتان وفحلها، ثم البقرة الوحشية."
variants:
  - reading: "فَغَلَا فُرُوعُ الْأَيْهُقَانِ"
    status: "رواية الأَصْمَعِيّ"
    note: "بالغين المعجمة، «أي ارتفع وزاد»، «والغين رواية الأصمعي» [@ibn-al-anbari، ص525]. وبها أنشده لسان العرب في «غلا» [@lisan، ج15 ص134]."
  - reading: "فَاعْتَمَّ نَوْرُ الْأَيْهُقَانِ"
    status: "رواية أخرى"
    note: "و«اعتم: ارتفع» [@ibn-al-anbari، ص525]. والنَّوْر: الزهر."
  - reading: "فَعَلَا فُرُوعَ الْأَيْهُقَانِ"
    status: "رواية أخرى"
    note: "بنصب «فُرُوعَ» [@ibn-al-anbari، ص525] [@lisan، ج10 ص11]."
