first: "أَوَلَمْ تَكُنْ تَدْرِي نَوَارُ بِأَنَّنِي"
second: "وَصَّالُ عَقْدِ حَبَائِلٍ جَذَّامُهَا"
meaning: "ألم تكن نَوار تعلم أني أصل حبال المودة لمن يستحق الوصل، وأقطعها عمّن يستحق القطع؟ قال ابن الأَنْبارِيّ: «جذام: قطاع، أي أصل في موضع المواصلة من يستحقها، وأقطع من يستحق القطيعة» [@ibn-al-anbari، ص573]."
vocabulary:
  - term: "نَوَارُ"
    text: "«امرأة من بني جعفر» [@ibn-al-anbari، ص573]، وهي التي ذكرها في البيت 16."
  - term: "حَبَائِلٍ"
    text: "«جمع الحبالة وهي مستعارة للعهد والمودة هنا» [@zawzani، ص192]."
  - term: "جَذَّامُهَا"
    text: "«جذام: قطاع» [@ibn-al-anbari، ص573]. «الجذم: القطع، والفعل جذم يجذم، والجذام مبالغة الجاذم» [@zawzani، ص192]."
  - term: "وَصَّالُ"
    text: "كثير الوصل، يصل من يستحق الصلة [@zawzani، ص192]."
syntax:
  - "الهمزة للاستفهام والواو بعدها عاطفة. و«نَوَارُ» اسم «تَكُنْ» تأخّر، وجملة «تَدْرِي» خبرها."
  - "«والباء توكيد للكلام، معناه: أو لم تكن تدري نوار أنني» [@ibn-al-anbari، ص573]، أي الباء زائدة، و«أَنَّنِي» وما بعدها في موضع مفعول «تَدْرِي»."
  - "«وَصَّالُ» خبر «أَنَّ»، و«جَذَّامُهَا» خبر ثانٍ، «والهاء التي مع جذام تعود على الحبائل» [@ibn-al-anbari، ص573]."
morphology:
  - "«وَصَّال» و«جَذَّام» على «فَعَّال»، صيغة مبالغة: كثير الوصل وكثير القطع [@zawzani، ص192]."
  - "«حَبَائِل» جمع «حِبالة» على «فَعَائِل»."
  - "«نَوَار» علم مؤنث على «فَعَال»، ممنوع من الصرف للعلمية والتأنيث، فرُفع بلا تنوين."
rhetoric:
  thesis: "يعود الشاعر إلى نَوار بعد أن غابت منذ البيت 19، فيخاطبها بسؤال يعرف جوابه. والفخر يبدأ بالعلاقات: هو الذي يقرر من يصل ومن يقطع."
  devices:
    - title: "الاستفهام التقريري"
      text: "«أَوَلَمْ تَكُنْ تَدْرِي»: لا يسألها، بل يحملها على الإقرار بما يرى أنها تعلمه، وفيه عتاب لأنها عاملته كأنها لا تعلم. والاستفهام التقريري: أن تسأل المخاطب لتحمله على الإقرار."
    - title: "الطباق"
      text: "«وَصَّالُ ... جَذَّامُهَا»: جمع بين الوصل والقطع، وهما ضدان، وكلاهما بصيغة المبالغة. والطباق: الجمع بين ضدين. وهو تطبيق لوصيته في البيتين 20–21: أن يقطع من تغيّر، ويَحبو من يستحق."
    - title: "الاستعارة"
      text: "«عَقْدِ حَبَائِلٍ»: الحبائل «مستعارة للعهد والمودة» كما يقول الزَّوْزَنِيّ، فالمودة حبل يُعقد ويُقطع، والشاعر يملك العقد والقطع."
  connection: "ثم يقول إنه يترك الأماكن التي لا يرضاها، إلا أن يحبسه الموت."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَوَلَمْ تَكُنْ / تَدْرِي نَوَا / رُ بِأَنْنَنِي = متَفاعلن / مُتْفاعلن / متَفاعلن — وَصْصَالُ عَقْ / دِ حَبَائِلِنْ / جَذْذَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر والأولى والثالثة من العجز."
context: "أول أبيات خطاب نَوار (55–62). يذكرها هنا أول مرة منذ البيت 19، فيصل الفخر الآتي بالنسيب الذي في أول القصيدة، وقال الزَّوْزَنِيّ: «ثم رجع إلى التشبيب» [@zawzani، ص192]. وهي في البيت 17 «مُرِّيَّةٌ»، أما ابن الأَنْبارِيّ فيقول هنا إنها من بني جَعْفَر."
