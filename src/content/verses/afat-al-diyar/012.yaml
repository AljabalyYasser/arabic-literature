first: "شَاقَتْكَ ظُعْنُ الْحَيِّ حِينَ تَحَمَّلُوا"
second: "فَتَكَنَّسُوا قُطُنًا تَصِرُّ خِيَامُهَا"
meaning: "هيّجت شوقك نساء الحي على إبلهن حين ارتحلوا، فدخلن الهوادج كما تدخل الظباء مكانسها، وأعواد الهوادج تَصِرّ من سرعة السير. قال الزَّوْزَنِيّ: «جعل الهوادج للنساء بمنزلة الكنس للوحش» [@zawzani، ص177]."
vocabulary:
  - term: "شَاقَتْكَ"
    text: "«معناه: اشتقت لها» [@ibn-al-anbari، ص530]، أي حملتك على الشوق."
  - term: "ظُعْنُ"
    text: "«النساء في الهوادج» [@ibn-al-anbari، ص530]. وعند الزَّوْزَنِيّ: «جمع الظعون: وهو البعير الذي عليه هودج وفيه امرأة، وقد يكون الظعن جمع ظعينة وهي المرأة الظاعنة مع زوجها» [@zawzani، ص176]. والهودج: مركب من خشب يُشدّ على ظهر البعير وتُغطّى أعواده بالثياب، تركبه المرأة."
  - term: "تَحَمَّلُوا"
    text: "ارتحلوا بأحمالهم."
  - term: "فَتَكَنَّسُوا"
    text: "أي اتخذوا الهوادج كُنُسًا، واحدها كِناس، «يريد: دخلوا في الهوادج كما تدخل الظباء في كنسها» [@ibn-al-anbari، ص530]. والكِناس: بيت الظبي في الشجر يستتر فيه."
  - term: "قُطُنًا"
    text: "فيه قولان: «جمع قطين، وهم الجماعة» [@ibn-al-anbari، ص530]، أو ثياب القُطن: «وقال أبو جعفر: معنى قوله (فتكنسوا قطنا) ثياب قطن. قال: وليس للقطين هاهنا معنى»، «والذي ذهب إليه أبو جعفر هو قول الأصمعي» [@ibn-al-anbari، ص530]. وفي لسان العرب: «أراد به ثياب القطن» [@lisan، ج13 ص344]."
  - term: "تَصِرُّ خِيَامُهَا"
    text: "«معناه تعجل بهن إبلهن فتهز الخشب فتصر»، «وقال أبو جعفر: إنما تصر خيامها لأنها جدد» [@ibn-al-anbari، ص530]. والصرير: «صوت الباب والرحل وغير ذلك» [@zawzani، ص176]."
syntax:
  - "«ظُعْنُ» فاعل «شَاقَتْكَ»، و«حِينَ» ظرف زمان متعلق بالفعل، وجملة «تَحَمَّلُوا» في محل جر بالإضافة إليه."
  - "«قُطُنًا» منصوب بـ«تَكَنَّسُوا» [@ibn-al-anbari، ص530]: «وقطنًا منصوبًا على الحال إن جعلته جمع قطين، ومفعول به إن جعلته قطنًا» [@zawzani، ص177]."
  - "«والخيام مرتفعة بتصر» [@ibn-al-anbari، ص530]، والجملة صفة لـ«قُطُنًا» أو حال، «والمضمر الذي أضيف إليه الخيام للظعن» [@zawzani، ص177]."
morphology:
  - "«الظُّعْن» بسكون العين «تخفيف الظُّعُن بضمها» [@zawzani، ص176]."
  - "«تَكَنَّسَ» على «تفعّل» من «الكِناس»، والتكنّس عند الزَّوْزَنِيّ دخول الكِناس «والاستكنان به» [@zawzani، ص176]، ففيه معنى الاتخاذ والدخول."
  - "«قُطُن» جمع «قَطِين» على «فُعُل»، كما يقال سرير وسُرُر. ويقال في القطن نفسه: «هو القُطُن، والقُطْن، والقُطُنّ» [@ibn-al-anbari، ص530]."
rhetoric:
  thesis: "من الأطلال الصامتة ينتقل إلى يوم الرحيل الحي: نساء يدخلن الهوادج، وخشب يصرّ، وشوق يتحرك في قلب الشاعر."
  devices:
    - title: "الالتفات"
      text: "الالتفات: انتقال الكلام من التكلم إلى الخطاب أو الغيبة أو العكس. قال في البيت العاشر «فَوَقَفْتُ أَسْأَلُهَا» متكلمًا، ثم قال هنا «شَاقَتْكَ» مخاطبًا نفسه، كأنه يرى نفسه من خارجها وقد غلبها الشوق."
    - title: "الاستعارة"
      text: "في «فَتَكَنَّسُوا» استعار للنساء دخول الظباء كُنُسَها، فجعل الهودج كناسًا. فالنساء ظباء قبل أن يصرّح بالتشبيه في البيت 14 «كَأَنَّ نِعَاجَ تُوضِحَ فَوْقَهَا». وقد نقل الزَّوْزَنِيّ هذا المعنى صريحًا: «جعل الهوادج للنساء بمنزلة الكنس للوحش» [@zawzani، ص177]."
    - title: "الصوت"
      text: "«تَصِرُّ خِيَامُهَا» يُسمِع القارئ صرير الخشب. والصرير يأتي من سرعة الإبل عند ابن الأَنْبارِيّ، أو من جدّة الهوادج عند أبي جَعْفَر [@ibn-al-anbari، ص530]؛ وفي الحالين يدل على حي غنيّ يرحل مسرعًا."
  connection: "ثم يصف هذه الهوادج: محفوفة بالثياب والستور [@ibn-al-anbari، ص531]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "شَاقَتْكَ ظُعْ / نُلْ حَيْيِ حِي / نَ تَحَمْمَلُو = مُتْفاعلن / مُتْفاعلن / متَفاعلن — فَتَكَنْنَسُو / قُطُنَنْ تَصِرْ / رُ خِيَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلتين الأولى والثانية من الصدر، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "أول أبيات الظعائن (12–15)، وهي المشهد الثاني من مشاهد النسيب بعد الأطلال: يتذكر الشاعر صاحبته يوم رحل الحي بها."
