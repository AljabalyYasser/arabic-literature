first: "أَسْهَلْتُ وَانْتَصَبَتْ كَجِذْعِ مُنِيفَةٍ"
second: "جَرْدَاءَ يَحْصَرُ دُونَهَا جُرَّامُهَا"
meaning: "نزلتُ من مرقبي إلى السهل، فرفعت فرسي عنقها نشاطًا كأنها جذع نخلة طويلة جرداء، تضيق صدور قاطعي ثمرها عن الصعود إليها. قال ابن الأَنْبارِيّ: «أسهلت معناه نزلت من مرقبتي إلى السهل، فنصبت عنقها من نشاطها ومرحها، ولم يكسرها وقوف يومي عليها - يعني الفرس - أي لم يضرها طول مقامها» [@ibn-al-anbari، ص583]."
vocabulary:
  - term: "أَسْهَلْتُ"
    text: "«أتى السهل من الأرض» [@zawzani، ص195]."
  - term: "مُنِيفَةٍ"
    text: "«نخلة طويلة مشرفة» [@ibn-al-anbari، ص583]."
  - term: "جَرْدَاءَ"
    text: "«انجرد كربها وليفها» [@ibn-al-anbari، ص583]، أي ملساء لا يجد صاعدها ما يتعلّق به."
  - term: "يَحْصَرُ"
    text: "«معناه تضيق صدورهم من هولها. والحصر: الضيق» [@ibn-al-anbari، ص583]. وفي اللسان أن لبيدًا يصف «نخلة طالت، فحصر صدر صارم ثمرها حين نظر إلى أعاليها» [@lisan، ج4 ص193]."
  - term: "جُرَّامُهَا"
    text: "«الجرّام: جمع الجارم وهو الذي يجرم النخل أي: يقطع حمله» [@zawzani، ص195]."
syntax:
  - "«أَسْهَلْتُ» جواب «إذا» في البيت السابق: «حتى إذا ألقت يدًا في كافر... أسهلتُ». والواو في «وَانْتَصَبَتْ» عاطفة، وفاعله ضمير الفرس."
  - "«كَجِذْعِ مُنِيفَةٍ» متعلق بمحذوف حال من فاعل «انتصبت»، و«مُنِيفَةٍ» صفة لموصوف محذوف: «كجذع نخلة منيفة» [@zawzani، ص196]. و«جَرْدَاءَ» صفة ثانية مجرورة بالفتحة لأنها ممنوعة من الصرف."
  - "«ويحصر مرفوع في اللفظ بالياء وهو مخفوض في المعنى على النعت لمنيفة» [@ibn-al-anbari، ص583]؛ أي جملة «يَحْصَرُ دُونَهَا جُرَّامُهَا» صفة ثالثة للنخلة، و«جُرَّامُهَا» فاعل «يحصر»."
morphology:
  - "«أَسْهَلَ» على «أفعل» بمعنى الدخول في الشيء: دخل السهل، كما يقال أنجد إذا أتى نجدًا."
  - "«الحصر: ضيق الصدر، والفعل حَصِرَ يحصَر» [@zawzani، ص195]، على «فعِل يفعَل»."
  - "«جُرّام» جمع «جارم» على «فُعّال»، ويقال: «الجُرام: الصُّرام. والجِرام: الصّرام» [@ibn-al-anbari، ص583]، أي يأتي مصدرًا بمعنى القطع."
rhetoric:
  thesis: "بعد يوم كامل على المرقب لم تتعب الفرس، بل انتصبت كنخلة لا يُرقى إليها."
  devices:
    - title: "التشبيه"
      text: "«انْتَصَبَتْ كَجِذْعِ مُنِيفَةٍ»: «شبه عنقها في الطول بمثل هذه النخلة» [@zawzani، ص196]. وهو عند عبد القاهر الجُرْجانيّ من التشبيه البيّن الذي لا يحتاج إلى تأوّل، لأنه «من جهة الهيئة نحو: أنه مستو منتصب مديد، كتشبيه قامة الرجل بالرمح» [@asrar، ص90]."
    - title: "تفصيل المشبّه به"
      text: "لم يكتف بالجذع، بل زاده ثلاث صفات: «مُنِيفَةٍ» ثم «جَرْدَاءَ» ثم «يَحْصَرُ دُونَهَا جُرَّامُهَا». فالنخلة لا تطول فقط، بل يعجز عنها الذين اعتادوا صعود النخل؛ وبذلك تنتقل الصورة من الطول إلى المنعة."
    - title: "الاستعارة في «جرداء»"
      text: "الجرداء عند الزَّوْزَنِيّ «القليلة السعف والليف، مستعارة من الجرداء من الخيل» [@zawzani، ص195]، والجرداء من الخيل القصيرة الشعر. فالكلمة نفسها تذكّر بالفرس الموصوفة."
  connection: "ثم يدفعها في العدو حتى تعرق وتخفّ."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَسْهَلْتُ وَنْ / تَصَبَتْ كَجِذْ / عِ مُنِيفَتِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — جَرْدَاءَ يَحْ / صَرُ دُونَهَا / جُرْرَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز. وسقطت همزة الوصل في «وَانْتَصَبَتْ» فاتصلت الواو بالنون: «تُ وَنْ»."
context: "يقول ابن الأَنْبارِيّ إن هذا «مثل قول امرئ القيس: فَلَمَّا أَجَنَّ الشَّمْسَ مِنِّي غُؤُورُهَا ... نَزَلْتُ إِلَيْهِ قَائِمًا بِالْحَضِيضِ»، «أي ثابتا» [@ibn-al-anbari، ص583]. فالشاعران ينزلان من المرقب حين يستر الليلُ الشمس."
