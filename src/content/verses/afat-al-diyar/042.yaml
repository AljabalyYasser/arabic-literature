first: "يَعْلُو طَرِيقَةَ مَتْنِهَا مُتَوَاتِرٌ"
second: "فِي لَيْلَةٍ كَفَرَ النُّجُومَ غَمَامُهَا"
meaning: "يعلو خطّ ظهرها مطر يتتابع قطرة بعد قطرة، في ليلة غطّى غمامها النجوم. قال ابن الأَنْبارِيّ: «معناه: يعلو طريقة متن هذه البقرة متواتر، أي مطر متتابع» [@ibn-al-anbari، ص560]. وقال الزَّوْزَنِيّ: «يعلو صلبها قطر متواتر في ليلة ستر غمامها نجومها» [@zawzani، ص188]."
vocabulary:
  - term: "طَرِيقَةَ مَتْنِهَا"
    text: "عن أبي عَمْرو: «طريقة المتن: ما بين الحارك إلى الكفل» [@ibn-al-anbari، ص560]، والحارك أعلى الكاهل، والكفل العجز. وقيل: «هي اللحمتان عن يمين الصلب ويساره» [@ibn-al-anbari، ص560]. وعند الزَّوْزَنِيّ: «خطّ من ذنبها إلى عنقها» [@zawzani، ص188]."
  - term: "مُتَوَاتِرٌ"
    text: "مطر متتابع بفترات: «وقال الأصمعي: المتواتر أن يجيء شيء ثم يكون هنيهة ثم يجيء شيء آخر» [@ibn-al-anbari، ص560]."
  - term: "كَفَرَ"
    text: "«معناه غطاها» [@ibn-al-anbari، ص560]. «ويقال لليل كافر؛ لأنه يستر الأشياء بظلمته» [@ibn-al-anbari، ص560]."
  - term: "غَمَامُهَا"
    text: "«والغمامة: السحابة، وجمعها غمام» [@ibn-al-anbari، ص561]."
syntax:
  - "«مُتَوَاتِرٌ» فاعل «يَعْلُو»، وهو صفة لموصوف محذوف أي مطر متواتر: «فمن رفعه رفعه بيعلو وقال: هو المطر» [@ibn-al-anbari، ص561]. و«طَرِيقَةَ» مفعول به مقدّم على الفاعل."
  - "«فِي لَيْلَةٍ» متعلق بـ«يَعْلُو»، وجملة «كَفَرَ النُّجُومَ غَمَامُهَا» نعت لـ«لَيْلَةٍ»، و«النُّجُومَ» مفعول مقدّم، و«غَمَامُهَا» فاعل مؤخر، والضمير لليلة."
morphology:
  - "«مُتَوَاتِر» اسم فاعل من «تواتر» على «تفاعل»، وهو بناء التتابع. ويستشهد ابن الأَنْبارِيّ بقوله تعالى ﴿ثُمَّ أَرْسَلْنَا رُسُلَنَا تَتْرَا﴾، ويفسّره بأنها متقطعة، بين كل رسولين برهة [@ibn-al-anbari، ص560]."
  - "«كَفَرَ» ماضٍ متعدٍّ بمعنى ستر، وهو الأصل الذي تفرعت منه معانٍ أخرى عند ابن الأَنْبارِيّ: «وسمي الكافر كافراً لأنه يغطى نعم الله سبحانه وتقدس وتوحيده» [@ibn-al-anbari، ص560]."
  - "«غَمَام» اسم جنس جمعي، واحده «غَمامة» [@ibn-al-anbari، ص561]."
rhetoric:
  thesis: "يرى الشاعر البقرة من أعلى: خطّ ظهرها يبتلّ بالقطر، والسماء فوقها مطفأة لا نجم فيها. فلا هادي في هذه الليلة ولا ملجأ."
  devices:
    - title: "الكلمة على أصلها"
      text: "«كَفَرَ النُّجُومَ»: قد يظن القارئ اليوم أن الفعل هنا مجاز، وهو في أصل اللغة التغطية، ومن هذا الأصل يذكر ابن الأَنْبارِيّ تسمية الزارع كافرًا: «لأنه إذا ألقى البذر في الأرض غطاه بالتراب» [@ibn-al-anbari، ص560]. فالغمام يدفن النجوم كما يدفن الزارع الحَبّ."
    - title: "المطر المتقطع بعد المطر الدائم"
      text: "«مُتَوَاتِرٌ»: في البيت 40 ديمة «دائمًا تسجامها»، وهنا قطر يأتي ثم ينقطع هنيهة ثم يعود. فالليل كله مطر، والبقرة تحسّ كل قطرة على ظهرها. وهذه قراءتنا."
  connection: "ثم يقول إنها مع هذا كله تضيء في أول الظلام كأنها لؤلؤة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "يَعْلُو طَرِي / قَةَ مَتْنِهَا / مُتَوَاتِرُنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — فِي لَيْلَتِنْ / كَفَرَ نْنُجُو / مَ غَمَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأولى من العجز."
context: "الثالث من أبيات الليلة الماطرة (40–43) على ترتيب ابن الأَنْبارِيّ، وهو عند الزَّوْزَنِيّ والديوان البيت 41، قبل «تَجْتَافُ أَصْلًا» [@zawzani، ص187] [@diwan-labid، ص309]. وعلى ترتيب ابن الأَنْبارِيّ يأتي ذكر الرمل المنهال قبله، فيجد رواية النصب الآتية ما يعود عليه ضميرها."
variants:
  - reading: "يَعْلُو طَرِيقَةَ مَتْنِهَا مُتَوَاتِرًا"
    status: "رواية أخرى"
    note: "«ويروى: (متواترا) بالنصب» [@ibn-al-anbari، ص561]، «ومن نصبه نصبه على الحال من الضمير الذي في يعلو، وهو من ذكر الرمل الهيام» [@ibn-al-anbari، ص561]، فيكون الذي يعلو ظهرها الرملَ المنهال. ويذكرها الديوان [@diwan-labid، ص309]."
