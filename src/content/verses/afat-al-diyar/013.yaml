first: "مِنْ كُلِّ مَحْفُوفٍ يُظِلُّ عِصِيَّهُ"
second: "زَوْجٌ عَلَيْهِ كِلَّةٌ وَقِرَامُهَا"
meaning: "كانت الظعائن في هوادج قد غُطّيت بالثياب، يظلّل أعوادَها بساط ملوّن، فوقه ستر رقيق وستر مرسل. قال الزَّوْزَنِيّ: «وتحرير المعنى: الهوادج محفوفة بالثياب فعيدانها تحت ظلال ثيابها» [@zawzani، ص177]."
vocabulary:
  - term: "مَحْفُوفٍ"
    text: "«الهودج قد حف بالثياب» [@ibn-al-anbari، ص531]، أي أحاطت به وغطّته."
  - term: "عِصِيَّهُ"
    text: "«عصى الهودج» [@ibn-al-anbari، ص531]، وعند الزَّوْزَنِيّ: «العصي هنا: عيدان الهودج» [@zawzani، ص177]."
  - term: "زَوْجٌ"
    text: "«النمط الواحد» [@ibn-al-anbari، ص531]، والنَّمَط: بساط أو ثوب ملوّن يُطرح على الهودج."
  - term: "كِلَّةٌ"
    text: "«الستر الرقيق، والجمع الكلل» [@zawzani، ص177]. وفي لسان العرب عن أبي عُبَيْد: «الكلة من الستور ما خيط فصار كالبيت» [@lisan، ج11 ص595]."
  - term: "قِرَامُهَا"
    text: "«الستر. وكل ما غطيت به شيئا فقد قرمته» [@ibn-al-anbari، ص531]. وفي لسان العرب: «وقيل: القرام ثوب من صوف غليظ جدا يفرش في الهودج» [@lisan، ج12 ص474]."
syntax:
  - "«مِنْ كُلِّ مَحْفُوفٍ» متعلق بمحذوف، والتقدير: الظعن من كل محفوف، قال الزَّوْزَنِيّ: «ثم فصل الظعن فقال: هي من كل هودج حُفَّ بالثياب» [@zawzani، ص177]."
  - "«والزوج رفع بيظل، والهاء للمحفوف» [@ibn-al-anbari، ص531]: فـ«زَوْجٌ» فاعل «يُظِلُّ» تأخر إلى أول العجز، و«عِصِيَّهُ» مفعوله تقدّم."
  - "«عَلَيْهِ كِلَّةٌ» جملة من خبر مقدم ومبتدأ مؤخر، و«قوله (عليه كلة) ، رجع إلى (الهودج)» [@ibn-al-anbari، ص531]. «والمضمر بعد القرام للعصى أو الكِلّة» [@zawzani، ص177]."
morphology:
  - "«مَحْفُوف» اسم مفعول من «حفّ»، يقال: «حفَّ الهودج وغيره بالثياب: إذا غطي بها» [@zawzani، ص177]."
  - "«قِرَام» على «فِعال»، ويقال فيه «مِقْرَم» على «مِفْعَل»، «ومثله في الوزن السنان والمسن، واللحاف والملحف» [@ibn-al-anbari، ص531]."
  - "«عِصِيّ» جمع «عصا» على «فُعُول»، أصله «عُصُوو»، قُلبت الواوان ياءين وأُدغمتا، وكُسرت العين إتباعًا؛ و«كِلَّة» تجمع على «كِلَل» [@zawzani، ص177]."
rhetoric:
  thesis: "يقف عند الهودج ويعدّ أغطيته طبقة طبقة: بساط ثم ستر رقيق ثم ستر مرسل. والتفصيل يدل على نساء مكرّمات في حيّ ثري."
  devices:
    - title: "التفصيل"
      text: "بدأ بالعام «مِنْ كُلِّ مَحْفُوفٍ»، ثم ذكر ما يحفّه «زَوْجٌ»، ثم فصّل الزوج: «كِلَّةٌ وَقِرَامُهَا». قال الزَّوْزَنِيّ: «ثم فصل الظعن فقال...، ثم فصل الزوج فقال: هو كِلة» [@zawzani، ص177]. فالعين تقترب من الهودج خطوة بعد خطوة."
    - title: "التقديم والتأخير"
      text: "قدّم المفعول «عِصِيَّهُ» وأخّر الفاعل «زَوْجٌ» إلى أول العجز، فبدأ بالأعواد ثم كساها بالثوب، على ترتيب ما تراه العين: هيكل الهودج ثم ما يغطيه."
  connection: "ثم يصف النساء في هذه الهوادج: كأنهن بقر تُوضِح وظباء وَجْرة [@ibn-al-anbari، ص531]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "مِنْ كُلْلِ مَحْ / فُوفِنْ يُظِلْ / لُ عِصِيْيَهُو = مُتْفاعلن / مُتْفاعلن / متَفاعلن — زَوْجُنْ عَلَيْ / هِي كِلْلَةُنْ / وَقِرَامُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلتين الأولى والثانية من الصدر والأولى والثانية من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وأُشبعت كسرة الهاء في «عَلَيْهِ» وضمّتها في «عِصِيَّهُ» حتى صارتا حرفي مدّ، كما يقتضي الوزن."
context: "في هذا البيت خلاف قديم. يروي ابن قُتَيْبة عن «شيخ من أصحاب اللغة»: «اجتمعت الرواة على خطإ فى بيت لبيد»، لأن الزوج هو النمط، «فكيف يظلّ النمط، وهو أسفل، العصىّ، وهى فوق؟». ثم يردّه ابن قُتَيْبة: «ولا أرى هذا إلّا غلطا منه، ولم تكن الرواة لتجتمع على هذه الرواية إلّا بأخذ عن العرب، وأراهم كانوا يلقون أيضا النمط فوق الأعواد ويلقونه» [@ibn-qutayba، ج1 ص274] «داخله، وأحسبنى قد رأيت هذا بعينه فى البادية» [@ibn-qutayba، ج1 ص275]. فالرواة متفقون على لفظ البيت، والخلاف في تأويله لا في نسبته."
variants:
  - reading: "مِنْ كُلِّ مَحْفُوفٍ يُظِلُّ عِصِيَّهُ ... زَوْجًا عَلَيْهِ كِلَّةٌ وَقِرَامُهَا"
    status: "رواية مقترحة، لم يروها أحد"
    note: "اقترحها الشيخ اللغوي الذي نقل عنه ابن قُتَيْبة: «وإنّما كان ينبغى أن يرووه»، ثم يرجع إلى المحفوف فيقول «عليه كلّة وقرامها» [@ibn-qutayba، ج1 ص274]، فيكون المحفوف هو الذي يظلّل الأعواد. وردّها ابن قُتَيْبة."
