first: "بِصَبُوحِ صَافِيَةٍ وَجَذْبِ كَرِينَةٍ"
second: "بِمُوَتَّرٍ تَأْتَالُهُ إِبْهَامُهَا"
meaning: "كففتُ في تلك الغداة البرد والجوع بشرب الصبوح من خمر صافية، وبعزف مغنية تجذب أوتار عودها وتصلحه بإبهامها. قال ابن الأَنْبارِيّ: «يريد: كففت الجوع والبرد بصبوح خمر صافية، وغناء مغنية» [@ibn-al-anbari، ص579]."
vocabulary:
  - term: "صَبُوحِ"
    text: "شرب الصباح، وفي تفسير الزَّوْزَنِيّ: «كم من صبوح من خمر صافية استمتعت باصطباحها» [@zawzani، ص194]."
  - term: "صَافِيَةٍ"
    text: "خمر صافية، صفة أُقيمت مقام موصوفها."
  - term: "كَرِينَةٍ"
    text: "«ذات الكران. والكران: البربط» [@ibn-al-anbari، ص579]، والبَرْبَط: العود. وعند الزَّوْزَنِيّ: «الكرينة: الجارية العوادة» [@zawzani، ص194]."
  - term: "مُوَتَّرٍ"
    text: "«معناه بعود موتر» [@ibn-al-anbari، ص579]، أي ذي أوتار."
  - term: "تَأْتَالُهُ"
    text: "«معناه تئوله وتصلحه وتعمله» [@ibn-al-anbari، ص579]، «قال بعضهم: تأتاله معناه تسوسه» [@ibn-al-anbari، ص579]. وعند الزَّوْزَنِيّ: «الائتيال: المعالجة» [@zawzani، ص194]. وفي اللسان: «أَي تُصْلِح هَذِهِ الكَرِينَة، وَهِيَ المُغَنِّية، أَوْتار عُودِها بِإِبْهامِها» [@lisan، ج4 ص440]."
syntax:
  - "«والباء التي في الصبوح من صلة وزعت» [@ibn-al-anbari، ص579]، أي «بِصَبُوحِ» متعلق بفعل البيت السابق، فالبيتان جملة واحدة على ترتيب ابن الأَنْبارِيّ. وفي متنه «كَشَفْتُ»، ويذكر هنا «وزعت» وهي روايته الأخرى للبيت 61."
  - "«وَجَذْبِ كَرِينَةٍ» معطوف على «صَبُوحِ»، والمصدر «جَذْب» مضاف إلى فاعله «كَرِينَةٍ». و«بِمُوَتَّرٍ» متعلق بـ«جَذْبِ»، وجملة «تَأْتَالُهُ إِبْهَامُهَا» نعت لـ«مُوَتَّرٍ»، و«إِبْهَامُهَا» فاعل."
  - "وعلى رواية الزَّوْزَنِيّ «وَصَبُوحِ» الواو واو «رُبَّ»: «وكم من صبوح خمر صافية، وجذب عوادة عودًا موترًا تعالجه إبهام العوادة» [@zawzani، ص194]."
morphology:
  - "«تَأْتَالُ» على «تَفْتَعِل» من «آل يؤول» إذا أصلح وساس: «والأصل في تأتاله تأتوله فصارت الواو ألفا لتحركها وانفتاح ما قبلها» [@ibn-al-anbari، ص579]."
  - "«كَرِينَة» على «فَعِيلة»، «والكرينة جمعها كرائن» [@ibn-al-anbari، ص579]."
  - "«مُوَتَّر» اسم مفعول من «وتّر» المضعّف. و«صَبُوح» على «فَعُول»."
rhetoric:
  thesis: "اللذة تدفع البرد: شراب صافٍ وعزف. والبيت ينتهي بإبهام المغنية، صورة صغيرة دقيقة بعد ريح الشمال العظيمة في البيت السابق."
  devices:
    - title: "التقابل بين اليدين"
      text: "على ترتيب ابن الأَنْبارِيّ تأتي بعد يد الشمال الممسكة بزمام الغداة إبهامُ المغنية الممسكة بأوتار العود: يد للبرد وأخرى للطرب، والشاعر بينهما يدفع الأولى بالثانية. وهذه قراءتنا."
    - title: "التفصيل الدال"
      text: "«تَأْتَالُهُ إِبْهَامُهَا»: لم يكتف بذكر الغناء، بل ذكر العضو الذي تصلح به الأوتار، ففي التفصيل الصغير دلالة على حذق المغنية وعلى قرب الشاعر منها حتى يرى إبهامها. وهذه قراءتنا."
  connection: "ثم ينتقل من اللهو إلى البأس: «وَلَقَدْ حَمَيْتُ الْحَيَّ تَحْمِلُ شِكَّتِي»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "بِصَبُوحِ صَا / فِيَتِنْ وَجَذْ / بِ كَرِينَتِنْ = متَفاعلن / متَفاعلن / متَفاعلن — بِمُوَتْتَرِنْ / تَأْتَالُهُو / إِبْهَامُهَا = متَفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "سلم الصدر من الزحاف، ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الثانية والثالثة من العجز. وأُشبعت ضمة الهاء في «تَأْتَالُهُ»."
context: "آخر أبيات خطاب نَوار (55–62) على ترتيب ابن الأَنْبارِيّ، وهو أولها عند الزَّوْزَنِيّ والديوان (60) [@zawzani، ص194] [@diwan-labid، ص314]. وبعده يبدأ الفخر بالبأس."
variants:
  - reading: "وَصَبُوحِ صَافِيَةٍ وَجَذْبِ كَرِينَةٍ"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "[@zawzani، ص194] [@diwan-labid، ص314]. ويذكرها ابن الأَنْبارِيّ عن «بعض الرواة» مع ترتيبهم للأبيات [@ibn-al-anbari، ص580]. ويقول محقق الديوان إن «بصبوح» رواية ابن كَيْسان [@diwan-labid، ص314]، وبها أنشده اللسان [@lisan، ج4 ص440]."
  - reading: "بِسَمَاعِ مُدْجِنَةٍ وَجَذْبِ كَرِينَةٍ"
    status: "رواية أخرى"
    note: "«ويروى: (بسماع مدجنة) ، ويروى: (بسماع صادحة)» [@ibn-al-anbari، ص579]. «و (المدجنة) : التي تسمع في يوم الدجن» [@ibn-al-anbari، ص579]، والدَّجْن: إلباس الغيم السماء، «والصادحة: المغنية» [@ibn-al-anbari، ص579]."
  - reading: "بِمُوَتَّرٍ تَأْتَالَهُ إِبْهَامُهَا"
    status: "رواية اللسان"
    note: "«وَيُرْوَى: تَأْتالَه إبْهامُها، بفتحِ اللَّامِ» [@lisan، ج1 ص137]، على أن أصله «تأتي له»."
