first: "فَبَنَى لَنَا بَيْتًا رَفِيعًا سَمْكُهُ"
second: "فَسَمَا إِلَيْهِ كَهْلُهَا وَغُلَامُهَا"
meaning: "فبنى لنا الله بيت شرف عالي السقف، فارتفع إليه كهول العشيرة وشبانها جميعًا. قال الزَّوْزَنِيّ: «يقول: بنى الله تعالى بيت شرف ومجد عالي السقف فارتفع إلى ذلك الشرف كهل العشيرة وغلامها، يريد أن كهولهم وشبانهم يسمون إلى المعالي والمكارم» [@zawzani، ص201]."
vocabulary:
  - term: "بَيْتًا"
    text: "المراد الشرف، قال التِّبْرِيزِيّ: «وقوله (بيتا) تمثيل، وإنما يعني به الشرف» [@tabrizi-ashr، ص174]."
  - term: "سَمْكُهُ"
    text: "ارتفاعه، «والسَّمْك: الارتفاع» [@tabrizi-ashr، ص174]، وفسّره ابن الأَنْبارِيّ بالشرف [@ibn-al-anbari، ص594]. وفي اللسان: «وسَمْكُ الْبَيْتِ: سَقْفُه. والسَّمْكُ: السَّقْف، وَقِيلَ: هُوَ مِنْ أَعلى الْبَيْتِ إِلَى أَسفله» [@lisan، ج10 ص444]."
  - term: "سَمَا"
    text: "«وسما، معناه ارتفع» [@ibn-al-anbari، ص594]."
  - term: "كَهْلُهَا وَغُلَامُهَا"
    text: "الكهل: من جاوز الشباب ولم يبلغ الشيخوخة، والغلام: الفتى الصغير. والمراد الكبار والصغار جميعًا."
syntax:
  - "الفاء في «فَبَنَى» عاطفة. وفاعل «بَنَى» ضمير مستتر اختلفوا في مرجعه. قال ابن الأَنْبارِيّ: «معناه: فبنى لنا هذا الفعل بيتا. يقال فاعل بنى ضمير من ذكر الله تعالى» [@ibn-al-anbari، ص594]، وعند الزَّوْزَنِيّ هو الله، وعند التِّبْرِيزِيّ الإمام في البيت 81: «ويروى (فبنى) يعني الإمام» [@tabrizi-ashr، ص174]."
  - "«بَيْتًا» مفعول به، و«رَفِيعًا» نعت له، و«سَمْكُهُ» فاعل للصفة «رَفِيعًا». «ويجوز أن يروى (رفيع سمكه) على معنى سمكه رفيع، والأولى أجود» [@tabrizi-ashr، ص174]."
  - "«فَسَمَا» معطوف بالفاء التي تفيد التعقيب والسببية، فالبناء سبب السموّ. و«كَهْلُهَا» فاعل، و«وَغُلَامُهَا» معطوف عليه، والهاء للعشيرة."
morphology:
  - "«سَمْك» مصدر «سمك يسمك» إذا رفع، ويُطلق على السقف وعلى الارتفاع."
  - "«سَمَا» ناقص واوي من «سما يسمو سُموًّا»، وأصل ألفه واو. و«بَنَى» ناقص يائي، وفي رواية «بَنَوْا» حُذفت لامه لالتقاء الساكنين."
  - "«رَفِيع» صفة مشبهة على «فَعِيل»."
rhetoric:
  thesis: "الشرف بيت عالٍ بُني لقوم لبيد، والقوم كلهم، كبارًا وصغارًا، يرتفعون إليه."
  devices:
    - title: "الكناية"
      text: "«بَيْتًا رَفِيعًا سَمْكُهُ»: لم يقل إن لهم شرفًا، بل جعل الشرف بيتًا يسكنونه. وهذا عند عبد القاهر الجُرْجانيّ من إثبات الصفة بطريق الكناية: يترك الشاعر التصريح، «ويُكَنُّونَ عن جَعْلها فيه بِجَعْلها في شيءٍ يَشْتمِلُ عليه وَيتَلبَّس به» [@dalail، ص306]، كما جعل زياد الأعجم الكرم في القبة المضروبة على ممدوحه: «إِنَّ السَّمَاحَةَ وَالْمُرُوءَةَ وَالنَّدَى ... فِي قُبَّةٍ ضُرِبَتْ عَلَى ابْنِ الْحَشْرَجِ» [@dalail، ص306]. ولبيد يصنع مثل ذلك: يضع الشرف في بيت مبنيّ لقومه."
    - title: "الطباق"
      text: "«كَهْلُهَا وَغُلَامُهَا»: جمع بين الكبير والصغير ليدل على العشيرة كلها، فلا يقعد أحد منهم عن الشرف. والطباق: الجمع بين الضدين."
    - title: "الجناس"
      text: "بين «سَمْكُهُ» و«فَسَمَا» تقارب في الحروف والمعنى: البيت مرتفع، والقوم يرتفعون إليه، فاللفظ يكرر فكرة العلوّ. وهذه قراءتنا."
  connection: "ثم يأمر من يحسدهم أن يقنع بما قسم الله."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَبَنَى لَنَا / بَيْتَنْ رَفِي / عَنْ سَمْكُهُو = متَفاعلن / مُتْفاعلن / مُتْفاعلن — فَسَمَا إِلَيْ / هِي كَهْلُهَا / وَغُلَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلتين الثانية والثالثة من الصدر، والثانية من العَجُز. وأُشبعت ضمة الهاء في «سَمْكُهُ» آخر الصدر، وكسرة الهاء في «إِلَيْهِ» فنُطقت «إِلَيْهِي»."
context: "سادس أبيات الفخر بالقوم على ترتيب ابن الأَنْبارِيّ، وهو موضع خلاف في الترتيب: يأتي عند الزَّوْزَنِيّ والديوان بعد البيتين 84–85، فهو 85 عندهما [@zawzani، ص201] [@diwan-labid، ص321]. ويقول محقق الديوان: «هذا البيت متقدم في رواية التبريزي على البيتين السابقين» [@diwan-labid، ص321]، أي أن التِّبْرِيزِيّ يوافق ابن الأَنْبارِيّ [@tabrizi-ashr، ص174]، وكذلك الجمهرة [@jamhara، ص268]. ويتغير الفاعل بالترتيب، فالزَّوْزَنِيّ يقول إذا تقدّم البيت على «فاقنع»: «كان المعنى، فبنى لنا سيدنا بيت مجد وشرف» [@zawzani، ص201]. وفي الجمهرة بعد هذا البيت بيت ليس عند ابن الأَنْبارِيّ ولا الزَّوْزَنِيّ: «إِنْ يَفْزَعُوا تُلْقَ الْمَغَافِرُ عِنْدَهُمْ ... وَالسِّنُّ تَلْمَعُ كَالْكَوَاكِبِ لَامُهَا» [@jamhara، ص268]، والمغافر: ما يلبسه المحارب على رأسه من حَلَق الدروع. ويرويه التِّبْرِيزِيّ بعد البيت 81 ويفسّره: «يريد بالسِّنِّ الأسنَّة، واللام: جمع لامة، وهي الدرع» [@tabrizi-ashr، ص173]. ولا ندخله في العدّ لأنه ليس في رواية ابن الأَنْبارِيّ."
