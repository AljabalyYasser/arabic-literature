first: "لِتَذُودَهُنَّ وَأَيْقَنَتْ إِنْ لَمْ تَذُدْ"
second: "أَنْ قَدْ أَحَمَّ مَعَ الْحُتُوفِ حِمَامُهَا"
meaning: "كرّت عليهن لتطردهن عن نفسها، وقد أيقنت أنها إن لم تطردهن فقد حان موتها مع سائر الحتوف. قال الزَّوْزَنِيّ: «عطفت البقرة وكرّت لترد وتطرد الكلاب عن نفسها، وأيقنت أنها إن لم تذدها قرب موتها من جملة حتوف الحيوان» [@zawzani، ص191]."
vocabulary:
  - term: "تَذُودَهُنَّ"
    text: "«لتطردهن وتمنعهن» [@ibn-al-anbari، ص569]."
  - term: "أَحَمَّ"
    text: "«وأحم، بحاء غير معجمة، معناه قدِّر. والحمام: القدر، واحدته حمَّة» [@ibn-al-anbari، ص569]. وفي اللسان عن الكِسائِيّ: «أَحَمَّ الأَمرُ وأَجَمَّ إِذا حَانَ وَقْتُهُ» [@lisan، ج12 ص152]. وعند الزَّوْزَنِيّ: «الإحمام والإجمام: القرب» [@zawzani، ص191]."
  - term: "الْحُتُوفِ"
    text: "«الحتف: قضاء الموت، وقد يسمى الهلاك حتفًا» [@zawzani، ص191]."
  - term: "حِمَامُهَا"
    text: "«الحمام: تقدير الموت يقال حُمَّ كذا أي قدر» [@zawzani، ص191]."
syntax:
  - "«واللام في قوله (لتذودهن) صلة لقوله (واعتكرت) ، يريد: واعتكرت لكي تحبسهن» [@ibn-al-anbari، ص570]: فهي لام التعليل متعلقة بفعل البيت السابق، والفعل بعدها منصوب بـ«أن» مضمرة."
  - "«وأن منصوبة بأيقنتْ» [@ibn-al-anbari، ص570]: أي «أَنْ قَدْ أَحَمَّ...» مخففة من الثقيلة، وهي وما بعدها في موضع مفعول «أَيْقَنَتْ». وجملة الشرط «إِنْ لَمْ تَذُدْ» معترضة بينهما، وجوابها محذوف يدل عليه المعنى."
  - "الواو في «وَأَيْقَنَتْ» واو الحال، و«حِمَامُهَا» فاعل «أَحَمَّ»، و«مَعَ الْحُتُوفِ» ظرف متعلق به."
morphology:
  - "«تَذُود» مضارع «ذاد يذود» الأجوف الواوي، و«تَذُدْ» مجزوم بـ«لَمْ» حُذفت واوه لالتقاء الساكنين."
  - "«أَحَمَّ» على «أفعل» من المضعّف «حمم»، ويقال فيه غير صيغة: «وقال أبو عبيد: أحم هذا الأمر، وحَم وحُمَّ» [@ibn-al-anbari، ص570]."
  - "«الحُتُوف» جمع «حَتْف» على «فُعُول»، و«حِمَام» على «فِعال»."
rhetoric:
  thesis: "البقرة تقاتل وهي تعرف الثمن. البيت يدخل إلى نفسها: يقين بالموت إن هي توقفت."
  devices:
    - title: "الجناس"
      text: "«أَحَمَّ ... حِمَامُهَا»: لفظان من أصل واحد (ح م م)، فالموت يحين ويُقدَّر في كلمة واحدة مكررة. والجناس: تشابه لفظين في الحروف. وهذه قراءتنا."
    - title: "تشخيص الحيوان"
      text: "«وَأَيْقَنَتْ»: أسند اليقين إلى البقرة، فجعل لها نفسًا تعقل العاقبة وتختار القتال. فهي هنا أقرب إلى فارس يعلم أنه إن لم يدافع قُتل، وهذا يمهّد لفخر الشاعر بالبأس بعد قليل. وهذه قراءتنا."
  connection: "ثم يذكر ما انتهى إليه القتال: قتلت كلبة اسمها «كَسَابِ» وتُركت أخرى صريعة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "لِتَذُودَهُنْ / نَ وَأَيْقَنَتْ / إِنْ لَمْ تَذُدْ = متَفاعلن / متَفاعلن / مُتْفاعلن — أَنْ قَدْ أَحَمْ / مَ مَعَ لْحُتُو / فِ حِمَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثالثة من الصدر والأولى من العجز."
context: "الثامن من أبيات الصباح والرماة والكلاب (44–52)."
variants:
  - reading: "أَنْ قَدْ أَجَمَّ مِنَ الْحُتُوفِ حِمَامُهَا"
    status: "رواية أخرى"
    note: "«ويروى: (أجم من الحتوف)» [@ibn-al-anbari، ص569]، و«أجمّ» بالجيم: «وكل ما كان قد حان وقوعه يقال فيه أجم» [@ibn-al-anbari، ص569]. وينقل اللسان عن ابن السِّكِّيت في رواية البيت: «وَكُلُّهُمْ يَرْوِيهِ بِالْحَاءِ» [@lisan، ج12 ص152]."
  - reading: "أَنْ قَدْ أُحِمَّ مِنَ الْحُتُوفِ حِمَامُهَا"
    status: "رواية الديوان"
    note: "ويذكر فيه جواز «أجمّ» بالجيم [@diwan-labid، ص312]."
