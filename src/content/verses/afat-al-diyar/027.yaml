first: "بِأَحِزَّةِ الثَّلَبُوتِ يَرْبَأُ فَوْقَهَا"
second: "قَفْرَ الْمَرَاقِبِ خَوْفُهَا آرَامُهَا"
meaning: "يعلو العير الأرض الغليظة في الثَّلَبُوت، ويقف فوقها رقيبًا على أتانه، والأماكن المرتفعة حوله خالية، وإنما يخاف أعلامها المنصوبة، لأن الصياد قد يستتر بها. قال الزَّوْزَنِيّ: «وتلخيص المعنى: أنهما بهذا الموضع والعير يعلو إكامه لينظر إلى أعلامها هل يرى صائدًا استتر بعلم منها يريد أن يرميها» [@zawzani، ص183]."
vocabulary:
  - term: "بِأَحِزَّةِ"
    text: "«الأحزة: جمع حزيز، وهو الغليظ المنقاد المستدق، والجمع أحزة وحزان» [@ibn-al-anbari، ص543]، أي أرض غليظة ممتدة. وفي لسان العرب: «وَفِي الْمُحْكَمِ: وَالْجَمْعُ أَحِزَّةٌ وحُزَّان وحِزَّانٌ؛ عَنْ سِيبَوَيْهِ» [@lisan، ج5 ص335]."
  - term: "الثَّلَبُوتِ"
    text: "«موضع» [@ibn-al-anbari، ص543]، وعند الزَّوْزَنِيّ: «ثلبوت: موضع بعينه» [@zawzani، ص182]."
  - term: "يَرْبَأُ"
    text: "«معناه يعلو فوق الأحزة مخافة رام أو طارد. والربيئة: الذي يعلو ويحفظ» [@ibn-al-anbari، ص544]. وعند الزَّوْزَنِيّ: «ربأت القوم وربأت لهم أربأ ربْأ: كنت ربيئة لهم» [@zawzani، ص182]. والرَّبيئة: طليعة القوم الذي يرقب لهم العدو."
  - term: "قَفْرَ الْمَرَاقِبِ"
    text: "«القفر: الخالي»، و«المراقب: جمع مرقبة وهو الموضع الذي يقوم عليه الرقيب، ويريد بالمراقب الأماكن المرتفعة» [@zawzani، ص182]."
  - term: "آرَامُهَا"
    text: "«الآرام: أعلام الطريق، الواحد إِرَم» [@zawzani، ص182]. «وأصل الآرام أعلام كانوا ينصبونها على القبور والطرق» [@ibn-al-anbari، ص544]."
syntax:
  - "«بِأَحِزَّةِ الثَّلَبُوتِ» متعلق بـ«يَعْلُو» في البيت السابق، أي يعلو بها حدب الإكام في أحزّة الثلبوت. وجملة «يَرْبَأُ فَوْقَهَا» حال من العير، والضمير في «فَوْقَهَا» للأحزّة."
  - "«قَفْرَ الْمَرَاقِبِ» منصوب على الحال، وإضافته لفظية لا تعرّفه: والمعنى كما قال الزَّوْزَنِيّ: «في موضع خالي الأماكن المرتفعة» [@zawzani، ص182]."
  - "«خَوْفُهَا آرَامُهَا» جملة من مبتدأ وخبر، والمعنى: المخوف منها أعلامها. ويقول ابن الأَنْبارِيّ في رواية أخرى للبيت إن الخوف يُرفع «بالآرام» [@ibn-al-anbari، ص544]، أي إنهما متلازمان في الإعراب: مبتدأ وخبر."
morphology:
  - "«أَحِزَّة» جمع «حَزِيز» على «أَفْعِلة»، ويُجمع أيضًا على «حُزّان» [@lisan، ج5 ص335]."
  - "«الثَّلَبُوت» على «فَعَلُوت»: «ومثاله بعير تربوت، أي ذلول» [@ibn-al-anbari، ص544]."
  - "«آرَام» جمع «إِرَم» على «أفعال»، «وواحد الآرام إرم، وإرمى، وأيرمى» [@ibn-al-anbari، ص544]. و«مَرَاقِب» جمع «مَرْقَبة» على «مَفاعل» [@zawzani، ص182]."
rhetoric:
  thesis: "العير هنا حارس: يصعد المرتفعات ويرقب الأفق، والخطر الذي يخافه مختبئ وراء علامات الطريق نفسها."
  devices:
    - title: "الاستعارة في «يَرْبَأُ»"
      text: "الاستعارة: أن يُستعمل اللفظ في غير ما وُضع له لشبه بينهما. والربيئة في كلام العرب طليعة القوم في الحرب، يعلو المرتفع ويحرسهم. فاستعار لَبِيد للعير فعل الربيئة، كما فسّره ابن الأَنْبارِيّ: «يصعد الحمار هذه الآكام كالربيئة لها، أي كالحافظ» [@ibn-al-anbari، ص544]. فالعير الذي كان غيورًا في البيت السابق صار هنا حارسًا."
    - title: "المفارقة"
      text: "المفارقة: أن يأتي الشيء على خلاف ما يُنتظر منه. فالأعلام تُنصب لتهدي المسافر، وهي هنا موضع الخوف: «إنما يخاف أعلامها، أي يخاف استتار الصيادين» [@zawzani، ص182]، و«لما يكون خلفها من صائد وغيره» [@ibn-al-anbari، ص544]. فما يطمئن به الناس يخيف الوحش."
    - title: "الخلاء المخيف"
      text: "«قَفْرَ الْمَرَاقِبِ»: المرتفعات خالية، ومع ذلك يخاف. فالخطر في البيت لا يُرى، بل يُتوقّع، وهذا يمهّد لما سيأتي في قصة البقرة الوحشية حين يظهر الصيادون. وهذه قراءتنا."
  connection: "ثم يذكر مدة مقامهما هناك: الشتاء كله، يكتفيان بالرطب عن الماء [@ibn-al-anbari، ص544]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "بِأَحِزْزَةِثْ / ثَلَبُوتِ يَرْ / بَأُ فَوْقَهَا = متَفاعلن / متَفاعلن / متَفاعلن — قَفْرَلْ مَرَا / قِبِ خَوْفُهَا / آرَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلتين الأولى والثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "من أبيات الأتان وفحلها (25–35). يحدد مكانهما في الشتاء: أرض غليظة مرتفعة في الثَّلَبُوت، والعير يحرس."
variants:
  - reading: "بِأَخِرَّةِ الثَّلَبُوتِ"
    status: "رواية الأَصْمَعِيّ عن أعرابي"
    note: "«قال خلف الأحمر: سمعت أعرابيا يرويه: (بأخرة الثلبوت) ، وكذلك رواه الأصمعي، قال: والأخرة مطمأنات في الأرض تكون كالوهدة بين الربوتين تنقاد وتجري» [@ibn-al-anbari، ص543]. والوهدة: المنخفض من الأرض."
  - reading: "طَوْرًا مَرَابِئُ خَوْفِهِ آرَامُهَا"
    status: "العجز في رواية الأَصْمَعِيّ"
    note: "«أراد مصاعد خوفه أعلامها المشرفة» [@ibn-al-anbari، ص544]."
  - reading: "قَفْرًا مَرَاقِبُ خَوْفِهَا آرَامُهَا"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص544]، «فمن رفع المراقب وخفض الخوف رفع المراقب بالآرام» [@ibn-al-anbari، ص544]، أي مراقبُ خوفها هي أعلامها."
