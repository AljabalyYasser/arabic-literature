first: "بَلْ مَا تَذَكَّرُ مِنْ نَوَارَ وَقَدْ نَأَتْ"
second: "وَتَقَطَّعَتْ أَسْبَابُهَا وَرِمَامُهَا"
meaning: "دع هذا: وما الذي تتذكره من نَوار، وقد بعدت عنك، وانقطعت الحبال التي كانت تصلك بها، قويُّها وضعيفُها؟ قال الزَّوْزَنِيّ: «قال مخاطبًا نفسه: أي شيء تتذكرين من نوار في حال بعدها وتقطع أسباب وصالها ما قوي منها وما ضعف» [@zawzani، ص178]."
vocabulary:
  - term: "نَوَارَ"
    text: "«اسم امرأة يشبب بها» [@zawzani، ص178]، أي يتغزل بها. «والنوار معناها في اللغة: النفور من الريب. يقال: نرت من ذلك الأمر أنور نورا، إذا نفرت منه» [@ibn-al-anbari، ص532]."
  - term: "نَأَتْ"
    text: "«معناه بعدت؛ ومثله ناءت» [@ibn-al-anbari، ص532]."
  - term: "أَسْبَابُهَا"
    text: "«حبالها» [@ibn-al-anbari، ص533]. وفي لسان العرب: «وَقَالَ أَبو زَيْدٍ: الأَسبابُ المنازلُ، وَقِيلَ المودّةُ؛ قَالَ الشَّاعِرُ: وتقَطَّعَتْ أَسبابُها ورِمامُها فِيهِ الْوَجْهَانِ مَعاً. الْمَوَدَّةُ، والمنازِلُ» [@lisan، ج1 ص458]."
  - term: "رِمَامُهَا"
    text: "«والرمام: الحبال الضعاف، واحدتها رمة» [@ibn-al-anbari، ص533]، وعند الزَّوْزَنِيّ: «قطعة من الحبل خَلِقَة ضعيفة» [@zawzani، ص178]."
syntax:
  - "«بَلْ» حرف إضراب، وهو هنا انتقال من كلام إلى كلام: «ثم أضرب عن صفة الديار ووصف حال احتمال الأحباب بعد تمامها، وأخذ في كلام آخر من غير إبطال لما سبق» [@zawzani، ص178]."
  - "«وما ظاهرها ظاهر الاستفهام وتأويلها تأويل التقرير، وتقديرها: بل ويحك أي شيء تذكر» [@ibn-al-anbari، ص533]. فـ«مَا» مفعول به مقدم لـ«تَذَكَّرُ»، «ويجوز أن يكون في موضع رفع بما عاد من الهاء المضمرة، ويكون التقدير: أي شيء تذكره من نوار» [@ibn-al-anbari، ص533]."
  - "«نَوَارَ» مجرورة بـ«مِنْ» وعلامة جرها الفتحة، لأنها ممنوعة من الصرف للعلمية والتأنيث. والواو في «وَقَدْ نَأَتْ» واو الحال، و«وَتَقَطَّعَتْ» معطوف على «نَأَتْ»."
morphology:
  - "«تَذَكَّرُ» مضارع أصله «تَتَذَكَّرُ»، حُذفت إحدى التاءين تخفيفًا، وبذلك فسّره الزَّوْزَنِيّ: «أي شيء تتذكرين» [@zawzani، ص178]."
  - "«نَأَتْ» ماضي «نأى ينأى» بمعنى بعد، «والنأي: البعد» [@ibn-al-anbari، ص532]."
  - "«رِمَام» جمع «رُمَّة»، «والرمة جمعها رمم ورمام» [@ibn-al-anbari، ص533]. و«أَسْبَاب» جمع «سَبَب» على «أفعال»."
rhetoric:
  thesis: "بعد أن أطال في الأطلال والظعائن يقطع الكلام فجأة، ويسمّي صاحبته أول مرة، ثم يسأل نفسه سؤالًا جوابه اليأس."
  devices:
    - title: "الإضراب"
      text: "«بَلْ» في أول البيت لا تنفي ما مضى، بل تنقل الكلام إلى غرض جديد، كما قال الزَّوْزَنِيّ: «من غير إبطال لما سبق» [@zawzani، ص178]. فينتقل الشاعر من وصف ما رآه إلى محاسبة نفسه على ما يتذكره."
    - title: "الاستفهام التقريري"
      text: "في «مَا تَذَكَّرُ» صورة سؤال، وهو عند ابن الأَنْبارِيّ «تأويل التقرير» [@ibn-al-anbari، ص533]، أي حمل المخاطَب على الإقرار بما يعرفه: لم يبق من نَوار ما يُتذكر. والمخاطَب هو الشاعر نفسه."
    - title: "الاستعارة"
      text: "الاستعارة: أن يُستعمل اللفظ في غير ما وُضع له لشبه بينهما. وفي «أَسْبَابُهَا وَرِمَامُهَا» جعل ما بينه وبين نَوار حبالًا، بعضها متين وبعضها بالٍ، وقد انقطعت كلها. وهذا الضرب يسميه عبد القاهر الجُرْجانيّ استعارة الاسم إذا نُقل «عن مسمَّاه الأصلي إلى شيء آخر ثابتٍ معلومٍ فتُجريَه عليه» [@asrar، ص44]، والشيء المعلوم هنا المودة. وقد أجاز لسان العرب في «الأسباب» معنيين: «الْمَوَدَّةُ، والمنازِلُ» [@lisan، ج1 ص458]."
  connection: "ثم يعرّف بنَوار ويحدد مكانها: مُرِّيّة تحلّ بفَيْد وتجاور أهل الحجاز [@ibn-al-anbari، ص533]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "بَلْ مَا تَذَكْ / كَرُ مِنْ نَوَا / رَ وَقَدْ نَأَتْ = مُتْفاعلن / متَفاعلن / متَفاعلن — وَتَقَطْطَعَتْ / أَسْبَابُهَا / وَرِمَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من الصدر والثانية من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "أول أبيات نَوار وبُعد ديارها (16–19). هنا يذكر اسم صاحبته أول مرة في القصيدة، بعد الأطلال والظعائن."
