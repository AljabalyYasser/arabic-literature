first: "فَمَدَافِعُ الرَّيَّانِ عُرِّيَ رَسْمُهَا"
second: "خَلَقًا كَمَا ضَمِنَ الْوُحِيَّ سِلَامُهَا"
meaning: "ومجاري الماء في وادي الرَّيّان خلت من أهلها، فبقي أثرها باليًا لا يكاد يُرى، كالكتابة المنقوشة في الصخر. قال ابن الأَنْبارِيّ: «والمعنى: آثار هذه المنازل كأنها كتاب في حجارة» [@ibn-al-anbari، ص519]."
vocabulary:
  - term: "مَدَافِعُ"
    text: "«مجارى الماء، وهي التلاع» [@ibn-al-anbari، ص519]، واحدها مَدْفَع؛ وعند الزَّوْزَنِيّ: «أماكن يندفع عنها الماء من الربى والأخياف» [@zawzani، ص171]. والتِّلاع: مسايل الماء من أعلى الأرض إلى بطن الوادي."
  - term: "الرَّيَّانِ"
    text: "«واد بالحمى» [@ibn-al-anbari، ص519]؛ وفي لسان العرب: «وريان: اسم جبل ببلاد بني عامر» [@lisan، ج14 ص351]."
  - term: "عُرِّيَ رَسْمُهَا خَلَقًا"
    text: "الرسم: الأثر الباقي من الدار لاصقًا بالأرض. «أي ارتحل عنه فعرى بعد أن أخلق لسكونهم إياه» [@ibn-al-anbari، ص519]، أي خلا وقد بلي. والخَلَق: البالي."
  - term: "الْوُحِيَّ"
    text: "«جمع وحي، وهو الكتاب» [@ibn-al-anbari، ص519]، من «وحيت أحي وحيا، إذا كتبت»."
  - term: "سِلَامُهَا"
    text: "السِّلام «الصخور، واحدتها سلمة» [@ibn-al-anbari، ص519]. وفي لسان العرب: «والسِّلامُ، بكسر السين: الحجارة الصلبة» [@lisan، ج12 ص297]."
syntax:
  - "في رفع «مَدَافِعُ» وجهان. عند ابن الأَنْبارِيّ هي مبتدأ: «والمدافع مرتفعة بما عاد من الهاء والألف في رسمها»، وجملة «عُرِّيَ رَسْمُهَا» خبرها، و«الرسم اسم ما لم يسم فاعله» [@ibn-al-anbari، ص520]، أي نائب فاعل. وعند الزَّوْزَنِيّ: «فمدافع: معطوف على قوله غولها» [@zawzani، ص172]، فتكون فاعلًا لـ«تأبّد» في البيت الأول."
  - "«وخلقا منصوب على الحال من الرسم، والكاف منصوبة بعُرى، وما معناها المصدر» [@ibn-al-anbari، ص520]: أي عُرّي تعريةً مثلَ تضمُّن الصخر الكتابة."
  - "الضمير في «سِلَامُهَا» يعود على «الوُحِيّ»: «والمضمر الذي أضيف إليه سِلام عائد إلى الوحي» [@zawzani، ص172]، والمعنى: كما تضمنت حجارةُ الكتابة الكتابةَ."
morphology:
  - "«الوُحِيّ» جمع «وَحْي»، «وزنه من الفعل فعول، وأصله وحوى، فلما اجتمعت الواو والياء والسابق ساكن أبدلوا من الواو ياء وأدغموها في الياء التي بعدها وكسروا ما قبل الياء لتصح» [@ibn-al-anbari، ص520]."
  - "«عُرِّيَ» ماضٍ مبني للمجهول من «عرّى» على «فعّل»، والتعرية «مصدر عريته فعري وتعرّى» [@zawzani، ص171]."
  - "«سِلَام» جمع «سَلِمَة» بكسر اللام [@zawzani، ص172]، على «فِعال» كما يقال ثَمَرة وثِمار."
rhetoric:
  thesis: "الأثر الباقي على الأرض كتابة قديمة في صخر: باقية لا تُمحى، ولكنها لا تكاد تُقرأ."
  devices:
    - title: "التشبيه"
      text: "في «كَمَا ضَمِنَ الْوُحِيَّ سِلَامُهَا» شبّه ما بقي من رسوم الديار بالكتابة في الحجارة. قال الزَّوْزَنِيّ: «شبه بقاء الآثار لقدم الأيام ببقاء الكتاب في الحجر» [@zawzani، ص172]. فوجه الشبه البقاء مع القِدم، لا الشكل وحده."
    - title: "لغة الثوب"
      text: "«عُرِّيَ» و«خَلَقًا» من ألفاظ الثياب: يُعرّى الجسد، ويَخلَق الثوب إذا بلي. فكأن الدار ثوب لبسه أهلها حتى أبلوه ثم نزعوه عنها ورحلوا. وهذه قراءتنا للفظين."
    - title: "صورة الكتابة"
      text: "هذه أولى صور الكتابة في المطلع، وسيعود إليها لَبِيد في البيتين 8–9: السيول تكشف الطلول كما تجدّد الأقلام الكتب، أو كما تعيد الواشمة الوشم."
  connection: "ثم يسمّي هذه الآثار «دِمَنًا» ويعدّ السنين التي مضت عليها [@ibn-al-anbari، ص520]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَمَدَافِعُرْ / رَيْيَانِ عُرْ / رِيَ رَسْمُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — خَلَقَنْ كَمَا / ضَمِنَلْ وُحِيْ / يَ سِلَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وسائر التفعيلات تامة."
context: "يمضي في تعداد المواضع التي عفت بعد مِنًى والغَوْل والرِّجام، فيصل إلى مدافع الرَّيّان، ويضيف إلى الخبر صورة: الأثر كتابة في صخر."
variants:
  - reading: "فَصَدَائِرُ الرَّيَّانِ"
    status: "رواية أخرى"
    note: "والصدائر «ما صدر من الوادي، وهو أعلاه» [@ibn-al-anbari، ص519]."
  - reading: "كَمَا ضَمِنَ الْوَحِيَّ"
    status: "رواية أخرى"
    note: "بفتح الواو، «فالوحي أصله الموحو، فصرف عن مفعول إلى فعيل» [@ibn-al-anbari، ص520]، أي المكتوب."
