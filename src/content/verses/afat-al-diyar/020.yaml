first: "فَاقْطَعْ لُبَانَةَ مَنْ تَعَرَّضَ وَصْلُهُ"
second: "وَلَشَرُّ وَاصِلِ خُلَّةٍ صَرَّامُهَا"
meaning: "فاقطع حاجتك ممن تغيّر وصله ولم يستقم لك، فإن شرّ من يصل المودة من يقطعها. قال ابن الأَنْبارِيّ: «معناه: اقطع لبانتك ممن تعرض وصله، أي لم يستقم وصله وأخذ على غير الطريق» [@ibn-al-anbari، ص537]، و«يقول: فمن فسد وصله فلا تقعدن على صلته لتحتبس عن مآربك» [@ibn-al-anbari، ص537]."
vocabulary:
  - term: "لُبَانَةَ"
    text: "«اللُّبانة: الحاجة» [@zawzani، ص179]."
  - term: "تَعَرَّضَ وَصْلُهُ"
    text: "لم يستقم وصله. يقال للرجل إذا صعد الجبل: «عرض دابتك؛ يريد؛ خذها يمنة ويسرة، فإنه أهون عليها في الصعود» [@ibn-al-anbari، ص537]. وفي لسان العرب: «وتَعَرَّضَ الشيءُ: دخَلَه فَسادٌ، وتَعَرَّضَ الحُبّ كَذَلِكَ»، «وَقِيلَ: مَنْ تَعَرَّضَ وَصْلُهُ أَي تَعَوَّجَ وزاغَ وَلَمْ يَسْتَقِم كَمَا يَتَعَرَّضُ الرَّجُلُ فِي عُرُوض الجَبل يَمِينًا وَشِمَالًا» [@lisan، ج7 ص169]."
  - term: "خُلَّةٍ"
    text: "«و (الخلة) : الصديق. والخلة: الصداقة» [@ibn-al-anbari، ص537]. وعند الزَّوْزَنِيّ: «المودة المتناهية» [@zawzani، ص179]."
  - term: "صَرَّامُهَا"
    text: "«الصرّام: القطّاع، فَعّال من الصرم وهو القطع» [@zawzani، ص180]."
syntax:
  - "«فَاقْطَعْ» فعل أمر، و«لُبَانَةَ» مفعول به، و«مَنْ» اسم موصول في موضع جر بالإضافة، وجملة «تَعَرَّضَ وَصْلُهُ» صلته. وإضافة اللبانة إلى «مَنْ» على معنى «مِنْ»: «أي لبانتك منه لأن قطع لبانته منك ليس إليك» [@zawzani، ص180]."
  - "«واللام لام اليمين، معناه: ووالله لشر واصل خُلَّة» [@ibn-al-anbari، ص537]، أي هي في جواب قسم مقدّر."
  - "«شَرُّ وَاصِلِ خُلَّةٍ» مبتدأ، و«صَرَّامُهَا» خبره، والضمير في «صَرَّامُهَا» للخُلّة."
morphology:
  - "«صَرَّام» صيغة مبالغة على «فَعّال» من «صرم يصرم» [@zawzani، ص180]، أي كثير القطع."
  - "«تَعَرَّضَ» على «تفعّل» من العُرْض، وهو الجانب: كأن الوصل أخذ في جانب الطريق ولم يمض مستقيمًا [@lisan، ج7 ص169]."
  - "«خُلَّة» على «فُعْلة»، «والخليل والْخِل والْخُلّة واحد» [@zawzani، ص179]."
rhetoric:
  thesis: "بيت التحوّل في القصيدة: ينصرف الشاعر عن نَوار إلى نفسه، ويحكم حكمًا عامًّا في الصداقة: لا تتمسك بمن تغيّر."
  devices:
    - title: "خطاب النفس"
      text: "في «فَاقْطَعْ» يخاطب الشاعر نفسه، قال الزَّوْزَنِيّ: «ثم أضرب عن ذكر نوار وأقبل على نفسه مخاطبًا إياها» [@zawzani، ص180]. فالأمر موجّه إليه، والحكم في الشطر الثاني موجّه إلى الناس جميعًا."
    - title: "الحكمة"
      text: "الشطر الثاني «وَلَشَرُّ وَاصِلِ خُلَّةٍ صَرَّامُهَا» قول عام يصلح مثلًا. وقد عدّ ابن قُتَيْبة البيت «مما يستجاد له» على رواية «ولخير»، وقال: «يقول: اقطع لبانتك ممن لم يستقم (لك) وصله، فإن أحسن الناس وصلا أحسنهم وضعا للقطيعة فى موضعها» [@ibn-qutayba، ج1 ص272]."
    - title: "مذهب في الغزل"
      text: "يضع ابن رَشِيق هذا البيت في مذهب من الغزل يقابل فيه الشاعر الهجر بالهجر ولا يتذلل: «فهو مذهب مشهور، وقد ركبه جلة الشعراء»، أولهم طَرَفَة ثم لَبِيد ثم جَرِير ثم جَمِيل، وقال: «وقال لبيد في مثل ذلك» [@ibn-rashiq، ج2 ص125]. ثم ذكر أن قُدامة يعيب هذا المذهب: «إلا أن أصل هذا المذهب عند قدامة فاسد»، «لأن الواجب عنده في التغزل أن يكون على خلاف هذا» [@ibn-rashiq، ج2 ص126]."
    - title: "الطباق"
      text: "الطباق: الجمع بين ضدين في الكلام. وفي «وَاصِلِ ... صَرَّامُهَا» جمع الوصل والقطع في شخص واحد: الذي يصل ثم يقطع."
  connection: "ثم يتمّ وصيته: أعطِ من يجاملك عطاءً جزيلًا، واحتفظ بقدرتك على قطعه إن مال [@ibn-al-anbari، ص538]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَقْطَعْ لُبَا / نَةَ مَنْ تَعَرْ / رَضَ وَصْلُهُو = مُتْفاعلن / متَفاعلن / متَفاعلن — وَلَشَرْرُ وَا / صِلِ خُلْلَةِنْ / صَرْرَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من الصدر والثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وأُشبعت ضمة الهاء في «وَصْلُهُ» آخر الصدر."
context: "أول بيتي «قطع اللبانة» (20–21). بهما يخرج الشاعر من النسيب، وهو ذكر النساء والديار في أول القصيدة، إلى وصف ناقته. ويسمي النقاد هذا الانتقال من غرض إلى غرض «التخلّص». والباء في أول البيت 22 «بِطَلِيحِ أَسْفَارٍ» متعلقة بـ«فَاقْطَعْ» عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص539]، فالناقة هي الأداة التي يقطع بها حاجته."
variants:
  - reading: "وَلَخَيْرُ وَاصِلِ خُلَّةٍ صَرَّامُهَا"
    status: "رواية أعرابي ينقلها الأَصْمَعِيّ"
    note: "«وقال الأصمعي عن خلف الأحمر: سمعت أعرابيا ينشدها: ولخير واصلِ خُلَّةٍ صَرَّامُها أي أحسن الناس وصلا إذا وصل أوضعهم للصرم في موضعه» [@ibn-al-anbari، ص537]. وبها روى ابن قُتَيْبة [@ibn-qutayba، ج1 ص272]، ويقول الزَّوْزَنِيّ: «وهذه أوجَه الروايتين وأمثلهما» [@zawzani، ص180]. ويرى محقق الديوان إحسان عَبّاس أن «رواية البيت على التضاد من التغييرات السيئة» [@diwan-labid، ص303]، أي أن الشاعر قال إحدى الكلمتين لا محالة."
