first: "مَشْمُولَةٍ غُلِثَتْ بِنَابِتِ عَرْفَجٍ"
second: "كَدُخَانِ نَارٍ سَاطِعٍ إِسْنَامُهَا"
meaning: "تلك النار أصابتها ريح الشمال، وخُلط حطبها بغضّ العرفج الأخضر، فدخانها كدخان نار ارتفع لهبها. قال الزَّوْزَنِيّ: «شبه الغبار الساطع من قوائم العير والأتان بنار أوقدت بحطب يابس تسرع فيه النار وحطب غض، وجعلها كذلك ليكون دخانها أكثف فيشبه الغبار الكثيف» [@zawzani، ص184]."
vocabulary:
  - term: "مَشْمُولَةٍ"
    text: "«أي نار قد أصابتها الشمال فهو أجدر أن تنفخها» [@ibn-al-anbari، ص549]. و«قد شمل الشيء أصابته ريح الشمال» [@zawzani، ص184]."
  - term: "غُلِثَتْ"
    text: "«معناه خلط ما أوقدت به» [@ibn-al-anbari، ص549]، «وكل خلطين غليث» [@ibn-al-anbari، ص550]. وعند الزَّوْزَنِيّ: «والفعل غلث يغلث، بالغين والعين جميعًا» [@zawzani، ص184]."
  - term: "بِنَابِتِ عَرْفَجٍ"
    text: "«أي بغضه وطريه، فهو أكثر لدخانها؛ لأنه رطب حين طلع» [@ibn-al-anbari، ص549]. «النابت: الغض» و«العرفج: ضرب من الشجر» [@zawzani، ص184]."
  - term: "سَاطِعٍ"
    text: "مرتفع منتشر، وبه فسّره الزَّوْزَنِيّ: «كدخان نار قد ارتفع أعاليها» [@zawzani، ص184]."
  - term: "إِسْنَامُهَا"
    text: "«ما ارتفع منها. ويقال أسنمها يسنمها. وإنما سمى السنام سناما لارتفاعه» [@ibn-al-anbari، ص550]. وفي لسان العرب: «وأَسْنَمتِ النارُ: عظُمَ لَهَبُها» [@lisan، ج12 ص306]."
syntax:
  - "«مَشْمُولَةٍ» مجرورة لأنها نعت لـ«مُشْعَلَةٍ» في البيت السابق: «وجرّ مشمولة، لأنه صفة لمشعلة» [@zawzani، ص184]. فالبيت كله متمم لصفة النار هناك."
  - "«غُلِثَتْ» ماضٍ مبني للمجهول، والجملة نعت ثانٍ. «والكاف مخفوضة على النعت لمشمولة، وساطع نعت للنار، والإسنام رفع بمعنى ساطع» [@ibn-al-anbari، ص550]: فـ«إِسْنَامُهَا» فاعل لاسم الفاعل «سَاطِعٍ»."
  - "جاء «سَاطِعٍ» مذكّرًا وهو نعت لـ«نَارٍ» المؤنثة، لأنه يرفع اسمًا مذكّرًا بعده هو «إِسْنَامُهَا»، فطابق فاعله في التذكير، ويسمّى النعت السببي."
morphology:
  - "«مَشْمُولَة» اسم مفعول من «شُمِل» إذا أصابته ريح الشمال [@zawzani، ص184]."
  - "«إِسْنَام» مصدر «أسنم» على «إفعال»، وأصله من السَّنام لارتفاعه [@ibn-al-anbari، ص550]. أما «أَسْنَام» بالفتح فجمع: «الأسنام: جمع سنام» [@zawzani، ص184]."
  - "«نَابِت» اسم فاعل من «نبت»، وهو هنا بمعنى الحديث الغضّ من النبت [@zawzani، ص184]."
rhetoric:
  thesis: "يكمل الشاعر صورة الدخان، فيختار لها كل ما يزيده كثافة: ريحًا تنفخ النار، وحطبًا أخضر يكثر دخانه، ولهبًا عاليًا. وكل ذلك ليقول: غبار العدو كثيف عالٍ."
  devices:
    - title: "تفصيل المشبَّه به"
      text: "لم يكتفِ في البيت السابق بقوله «كَدُخَانِ مُشْعَلَةٍ»، بل وصف تلك النار في بيت كامل: «مَشْمُولَةٍ» تنفخها الريح، و«غُلِثَتْ بِنَابِتِ عَرْفَجٍ» فيكثر دخانها. وعلّة ذلك عند الزَّوْزَنِيّ: «ليكون دخانها أكثف فيشبه الغبار الكثيف» [@zawzani، ص184]. فكل صفة في المشبَّه به تخدم وجه الشبه."
    - title: "التكرار"
      text: "أعاد لفظ «كَدُخَانِ» في البيتين، فقال الزَّوْزَنِيّ: «إلا أنه كرر قوله كدخان لتفخيم الشأن وتعظيم القصة» [@zawzani، ص184]، ومثّل له بقول الآخر: «أَرَى الْمَوْتَ لَا يَنْجُو مِنَ الْمَوْتِ هَارِبُهْ» [@zawzani، ص185]، حيث أعاد «الموت» ولم يُضمره."
  connection: "ثم يصف العير يمضي إلى الماء وقد قدّم أتانه أمامه [@ibn-al-anbari، ص550]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "مَشْمُولَةِنْ / غُلِثَتْ بِنَا / بِتِ عَرْفَجِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — كَدُخَانِ نَا / رِنْ سَاطِعِنْ / إِسْنَامُهَا = متَفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من الصدر، والثانية والثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "من أبيات الأتان وفحلها (25–35). البيت كله صفة لما في البيت السابق، فالبيتان جملة واحدة في وصف غبار العدو."
variants:
  - reading: "كَدُخَانِ نَارٍ سَاطِعٍ أَسْنَامُهَا"
    status: "رواية ابن الأَعْرابِيّ والزَّوْزَنِيّ والديوان"
    note: "بفتح الهمزة: «روى ابن الأعرابي (أسنامها) بفتح الألف، أي ارتفاع لهبها، الواحدة سنم» [@ibn-al-anbari، ص550]، وبها روى الزَّوْزَنِيّ [@zawzani، ص184] والديوان [@diwan-labid، ص306]. وفي لسان العرب: «فَمَنْ رَوَاهُ بِالْفَتْحِ أَراد أَعالِيَها، وَمَنْ رَوَاهُ بِالْكَسْرِ فَهُوَ مَصْدَرُ أَسْنَمتْ إِذا ارْتَفَعَ لَهَبُها إِسْناماً» [@lisan، ج12 ص306]."
  - reading: "مَشْمُولَةٍ عُلِيَتْ بِنَابِتِ عَرْفَجٍ"
    status: "رواية ابن الأَعْرابِيّ"
    note: "«أي ألقى فوقها» [@ibn-al-anbari، ص550]. ورفض ابن الأَعْرابِيّ رواية «غُلِثَتْ»: «لأني لا أقول خلطت النار بالوقود. وقال: هذه الرواية خطأ» [@ibn-al-anbari، ص550]. ويذكرها الزَّوْزَنِيّ أيضًا [@zawzani، ص184]."
  - reading: "مَشْمُولَةٍ عُلِثَتْ بِنَابِتِ عَرْفَجٍ"
    status: "رواية لسان العرب"
    note: "بالعين المهملة [@lisan، ج12 ص306]، وهما لغتان عند الزَّوْزَنِيّ [@zawzani، ص184]."
