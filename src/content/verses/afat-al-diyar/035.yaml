first: "مَحْفُوفَةً وَسْطَ الْيَرَاعِ يُظِلُّهَا"
second: "مِنْهُ مُصَرَّعُ غَابَةٍ وَقِيَامُهَا"
meaning: "وهذه العين قد أحاط بها القصب، فهي في وسطه، يظلّها منه ما مال وسقط من أجمته وما بقي قائمًا. قال الزَّوْزَنِيّ: «يقول: قد شَقّا عينًا قد حفت بضروب النبت والقصب، فهي وسط القصب يظلها من القصب ما صرع من غابتها وما قام منها» [@zawzani، ص185]."
vocabulary:
  - term: "مَحْفُوفَةً"
    text: "«يعني العين. عنى إنها حفت بالقصب نابتا فيها. وأصله إنه ينبت في أحفتها، أي جوانبها» [@ibn-al-anbari، ص553]."
  - term: "الْيَرَاعِ"
    text: "«القصب، واحدته يراعة» [@ibn-al-anbari، ص553]. «ويقال لكل منخوب القلب: يراعة؛ يشبه بالقصبة، أي هو لا قلب له مثل القصبة الجوفاء» [@ibn-al-anbari، ص553]، والمنخوب: الجبان."
  - term: "مُصَرَّعُ"
    text: "«الْمُصَرَّع: مبالغة المصروع» [@zawzani، ص185]، أي ما سقط ومال من القصب."
  - term: "غَابَةٍ"
    text: "«و (الغابة) : الأجمة، وجمعها غاب» [@ibn-al-anbari، ص553]. والأَجَمة: الشجر الكثيف الملتف."
  - term: "وَقِيَامُهَا"
    text: "«القيام: جمع قائم» [@zawzani، ص185]، أي ما انتصب من القصب."
syntax:
  - "«ومحفوفة تنتصب على النعت لمسجوة» [@ibn-al-anbari، ص553]، أي هي نعت لـ«مَسْجُورَةً» في البيت السابق، فالبيت كله يتمم وصف العين."
  - "«وَسْطَ» ظرف مكان متعلق بـ«مَحْفُوفَةً». وجملة «يُظِلُّهَا ... مُصَرَّعُ غَابَةٍ» نعت ثانٍ، و«مُصَرَّعُ» فاعل «يُظِلُّ»، و«وَقِيَامُهَا» معطوف عليه، والضمير فيه للغابة."
  - "«مِنْهُ» متعلق بـ«يُظِلُّهَا»، والضمير لليراع: «(يظلها منه) معناه يظل العين المسجورة من اليراع» [@ibn-al-anbari، ص553]."
morphology:
  - "«مَحْفُوفَة» اسم مفعول من «حفّ»، وهو من الحِفاف أي الجانب: «وأصله إنه ينبت في أحفتها، أي جوانبها» [@ibn-al-anbari، ص553]."
  - "«مُصَرَّع» اسم مفعول من «صرّع» على «فعّل»، والتضعيف للمبالغة [@zawzani، ص185]."
  - "«قِيَام» جمع «قائم» على «فِعال» [@zawzani، ص185]، كما يقال صائم وصِيام. و«يَرَاع» اسم جنس واحدته «يراعة» [@ibn-al-anbari، ص553]."
rhetoric:
  thesis: "آخر صورة في حكاية العير والأتان: عين ماء في ظل القصب. الماء الذي سعيا إليه شهورًا صار أمامهما، والمكان ساكن ظليل."
  devices:
    - title: "الطباق"
      text: "الطباق: الجمع بين ضدين في الكلام. وفي «مُصَرَّعُ غَابَةٍ وَقِيَامُهَا» جمع بين الساقط والقائم من القصب، فشمل الظلّ كل ما حول العين: «يريد أنها في ظل قصب بعضه مصرّع وبعضه قائم» [@zawzani، ص185]."
    - title: "ختام بلا خاتمة"
      text: "تنتهي الحكاية بالماء والظل، ولا يذكر الشاعر أنهما شربا أو أن صيادًا رماهما. وقد قال أبو جَعْفَر في البيت السابق إنهما وردا «ولم يخافا راميا ولا غيره، على كثرة ما حوله من النبت» [@ibn-al-anbari، ص553]. فالقصب الكثيف يظلّ، وقد يستر الخطر، والشاعر يترك المشهد هنا ويعود إلى ناقته. وهذه قراءتنا."
  connection: "ثم يقطع الحكاية بسؤال يعيده إلى ناقته: «أَفَتِلْكَ أَمْ وَحْشِيَّةٌ مَسْبُوعَةٌ»، أي أتلك الأتان تشبه ناقتي أم بقرة وحشية أكل السبع ولدها؟ [@ibn-al-anbari، ص553]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "مَحْفُوفَةَنْ / وَسْطَلْ يَرَا / عِ يُظِلْلُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن — مِنْهُو مُصَرْ / رَعُ غَابَةِنْ / وَقِيَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلتين الأولى والثانية من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. وأُشبعت ضمة الهاء في «مِنْهُ» حتى صارت واوًا، كما يقتضي الوزن."
context: "آخر أبيات الأتان وفحلها (25–35)، وبه تتم المرحلة الأولى من القصيدة (1–35). بعده يبدأ تشبيه ثانٍ للناقة بالبقرة الوحشية، وهو حكاية مستقلة تمتد إلى البيت 52."
variants:
  - reading: "مِنْهَا مُصَرَّعُ غَابَةٍ وَقِيَامُهَا"
    status: "رواية أخرى"
