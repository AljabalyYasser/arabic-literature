first: "فَلَهَا هِبَابٌ فِي الزِّمَامِ كَأَنَّهَا"
second: "صَهْبَاءُ رَاحَ مَعَ الْجَنُوبِ جَهَامُهَا"
meaning: "فلها على تلك الحال نشاط وهي تُقاد بزمامها، كأنها سحابة حمراء أراقت ماءها فخفّت، فمضت بها ريح الجنوب مسرعة. قال ابن الأَنْبارِيّ: «يقول: إذا صارت في هذه الحال لم تنكسر ولم يذهب نشاطها» [@ibn-al-anbari، ص541]."
vocabulary:
  - term: "هِبَابٌ"
    text: "«معناه فلها هيج ونشاط» [@ibn-al-anbari، ص541]. وفي لسان العرب: «وهَبَّتِ الناقةُ فِي سَيرِها تَهِبُّ هِباباً: أَسْرَعَتْ. والهِبابُ: النَّشاطُ، مَا كَانَ» [@lisan، ج1 ص778]."
  - term: "الزِّمَامِ"
    text: "الحبل الذي تُقاد به الناقة، وبذلك فسّره الزَّوْزَنِيّ: «نشاط في السير حال قود زمامها» [@zawzani، ص181]."
  - term: "صَهْبَاءُ"
    text: "سحابة حمراء: «يريد كأنها سحابة صهباء، فحذف الموصوف» [@zawzani، ص181]. وقال ابن الأَنْبارِيّ: «والصهباء على لون القمراء من الأتن، وهي التي يضرب لونها إلى الحمرة» [@ibn-al-anbari، ص541]."
  - term: "الْجَنُوبِ"
    text: "ريح الجنوب، وهي التي «طردته» [@ibn-al-anbari، ص541]، أي ساقت الجَهام."
  - term: "جَهَامُهَا"
    text: "«ما هراق ماءه، والواحدة جهامة» [@ibn-al-anbari، ص541]، وعند الزَّوْزَنِيّ: «السحاب الذي قد أراق ماءه» [@zawzani، ص181]."
syntax:
  - "الفاء في «فَلَهَا» واقعة في جواب «إذا» في البيت السابق [@zawzani، ص181]. و«لَهَا» خبر مقدم، و«هِبَابٌ» مبتدأ مؤخر، و«فِي الزِّمَامِ» متعلق بـ«هِبَابٌ»."
  - "«صَهْبَاءُ» خبر «كأنّ»، وهي صفة لموصوف محذوف تقديره: سحابة صهباء. «وراح وما بعده صلة الصهباء» [@ibn-al-anbari، ص541]، أي جملة «رَاحَ مَعَ الْجَنُوبِ جَهَامُهَا» صفة لها، و«جَهَامُهَا» فاعل «رَاحَ»."
  - "«مَعَ الْجَنُوبِ» ظرف متعلق بـ«رَاحَ»، والضمير في «جَهَامُهَا» يعود على الصهباء."
morphology:
  - "«هِبَاب» مصدر «هبّ يهبّ» على «فِعال» [@lisan، ج1 ص778]."
  - "«صَهْبَاء» على «فَعْلاء» مؤنث «أصهب»، وهو وزن الألوان."
  - "«جَهَام» اسم جنس، واحدته «جَهَامة» [@ibn-al-anbari، ص541]، مثل سحاب وسحابة."
rhetoric:
  thesis: "جواب الشرط المعلّق: الناقة التي أنهكها السفر ما زال فيها نشاط، بل هي في خفتها كسحابة فرغت من مائها. فالنحول نفسه صار سببًا في سرعتها."
  devices:
    - title: "التشبيه"
      text: "في «كَأَنَّهَا صَهْبَاءُ» شبّه الناقة بالسحابة، قال ابن الأَنْبارِيّ: «فشبه الناقة بالسحابة في السرعة» [@ibn-al-anbari، ص541]. ولم يختر أي سحابة، بل الصهباء التي أراقت ماءها، وعلّته عنده: «إذا اصهابت قل ماؤها، وإذا قل ماؤها خفت وسرع مرها» [@ibn-al-anbari، ص541]."
    - title: "تشبيه يحتاج إلى تأمل يسير"
      text: "وجه الشبه هنا السرعة، لكن القارئ يحتاج إلى خطوة من التفكير ليفهم لماذا اختار السحابة الفارغة: لأنها خفيفة كالناقة الضامرة. ويسمي عبد القاهر الجُرْجانيّ هذا الضرب تشبيهًا «لا يتمّ لكَ إلا بتأوُّل» [@asrar، ص92]، ويقول إن ما يحتاج إلى التأول «يتفاوت تفاوتاً شديداً، فمنه ما يقربُ مأخذُه ويسهُل الوصول إليه» [@asrar، ص93]. وتشبيه لَبِيد من هذا القريب."
    - title: "المفاجأة"
      text: "في البيت السابق وصف إعياءها وتقطّع سيورها، فلما جاء الجواب لم يكن ضعفًا بل «هِبَابٌ». فالانتقال من النحول إلى النشاط مقصود، والنحول يعلّل الخفة."
  connection: "ثم يأتي بتشبيه ثانٍ للناقة يعطفه بـ«أَوْ»: أتان حامل يسوقها فحلها [@ibn-al-anbari، ص541–542]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَلَهَا هِبَا / بُنْ فِزْ زِمَا / مِ كَأَنْنَهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — صَهْبَاءُ رَا / حَ مَعَلْ جَنُو / بِ جَهَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "آخر أبيات الناقة (22–24) وجواب الشرط في البيت 23. وبه يتم وصف الناقة نفسها، ثم يبدأ تشبيهها بالأتان الذي يمتد إلى البيت 35."
