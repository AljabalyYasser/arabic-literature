first: "دِمَنٌ تَجَرَّمَ بَعْدَ عَهْدِ أَنِيسِهَا"
second: "حِجَجٌ خَلَوْنَ حَلَالُهَا وَحَرَامُهَا"
meaning: "هي آثار ديار مضت عليها، منذ عهدها بسكانها، سنون كاملة بأشهرها الحلال والحرم. قال الزَّوْزَنِيّ: «وتحرير المعنى: قد مضت بعد ارتحالهم عنها سنون بكمالها» [@zawzani، ص172]."
vocabulary:
  - term: "دِمَنٌ"
    text: "جمع دِمْنة، «والدمنة: آثار الناس وما سودوا بالرماد وغير ذلك» [@ibn-al-anbari، ص520]: بقايا الرماد والبَعَر حول البيوت."
  - term: "تَجَرَّمَ"
    text: "«انقطع ومضى» [@ibn-al-anbari، ص520]؛ وعند الزَّوْزَنِيّ: «التجرم: التكمل والانقطاع، يقال: تجرّمت السنة وسنة مجرّمة أي مكملة» [@zawzani، ص172]."
  - term: "عَهْدِ أَنِيسِهَا"
    text: "العهد: «اللقاء» [@zawzani، ص172]. والأنيس: «أراد الذين يسكنونها» [@ibn-al-anbari، ص521]."
  - term: "حِجَجٌ"
    text: "«جمع حجة وهي السنة» [@zawzani، ص172]."
  - term: "حَلَالُهَا وَحَرَامُهَا"
    text: "الحلال: شهور الحِلّ، وهي ثمانية أشهر، والحرام: الأشهر الحُرُم، وهي أربعة: رجب وذو القَعْدة وذو الحِجّة والمحرَّم [@ibn-al-anbari، ص521]. وكان القتال والغارة محرّمين فيها عند العرب."
syntax:
  - "في «دِمَنٌ» روايتان: الرفع والنصب. «فمن رفع أراد تلك دمن أو هي دمن؛ ومن نصب نصب على القطع من الديار والمنازل المذكورة» [@ibn-al-anbari، ص521]، أي على الحال."
  - "«والحجج رفع بتجرم، وخلون صلة الحجج» [@ibn-al-anbari، ص521]: فـ«حِجَجٌ» فاعل «تَجَرَّمَ» تأخر عنه، وجملة «خَلَوْنَ» صفة لها، وجملة «تَجَرَّمَ...» كلها صفة لـ«دِمَنٌ»."
  - "«حَلَالُهَا» بدل من «حِجَجٌ» عند الزَّوْزَنِيّ، و«حَرَامُهَا» معطوف عليه [@zawzani، ص172]؛ وعند ابن الأَنْبارِيّ هما «تابعان للحجج» [@ibn-al-anbari، ص521]."
morphology:
  - "«تَجَرَّمَ» على «تفعّل» من «جرم» بمعنى القطع؛ قال الأزهري في لسان العرب: «وهذا كله من القطع كأن السنة لما مضت صارت مقطوعة من السنة المستقبلة» [@lisan، ج12 ص93]."
  - "«دِمَن» جمع «دِمْنة»، و«حِجَج» جمع «حِجّة»، وكلاهما على «فِعَل» جمعًا لـ«فِعْلة»."
  - "«خَلَوْنَ» ماضٍ من «خلا يخلو» بمعنى مضى، «ومنه الأمم الخالية» [@zawzani، ص172]، والنون نون النسوة تعود على الحجج."
rhetoric:
  thesis: "بعد أن عدّ الأماكن يعدّ الزمن: سنون كاملة مرت على آثار لم يبق منها إلا الرماد."
  devices:
    - title: "حذف المبتدأ"
      text: "بدأ البيت بالخبر «دِمَنٌ» وحذف المبتدأ: تلك دِمَن. ويجعل عبد القاهر الجُرْجانيّ هذا الحذف عادة الشعراء في هذا الموضع بعينه، فيقول بعد شواهد من الأطلال: «وهذه طريقةٌ مستمرَّةٌ لهم إذا ذكروا الديار والمنازل»، ثم يذكر الوجه الآخر: «وكما يضمرون المبتدأ فيرفعون، قد يضمرون الفعل فينصبون» [@dalail، ص147]. وفي بيت لَبِيد الروايتان معًا: «دِمَنٌ» و«دِمَنًا». والحذف يقطع الكلام ويستأنفه، فكأن الشاعر يشير إلى الآثار بعينه."
    - title: "الطباق"
      text: "الطباق: الجمع بين ضدين في الكلام. وفي «حَلَالُهَا وَحَرَامُهَا» جمع الضدين ليعبّر بهما عن السنة كلها، قال الزَّوْزَنِيّ: «والسنة لا تعدو أشهر الحرم وأشهر الحل، فعبر عن مضي السنة بمضيهما» [@zawzani، ص172]."
    - title: "زمن القبيلة"
      text: "لم يعدّ السنين بالشتاء والصيف، بل بالأشهر الحرم وأشهر الحلّ، أي بحساب الحرب والسلم. فالزمن في البيت زمن الناس الذين رحلوا، يجري على الديار وقد غابوا عنها."
  connection: "ثم يدعو لهذه الديار بالمطر، أو يخبر أنها سُقيته [@ibn-al-anbari، ص521، ص523]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "دِمَنُنْ تَجَرْ / رَمَ بَعْدَ عَهْ / دِ أَنِيسِهَا = متَفاعلن / متَفاعلن / متَفاعلن — حِجَجُنْ خَلَوْ / نَ حَلَالُهَا / وَحَرَامُهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "جاءت التفعيلات الست كلها تامة «متَفاعلن»، ولم يدخلها الإضمار، وهو تسكين الثاني المتحرك."
context: "يختم البيت وصف الديار الخالية بعدّ الزمن الذي مضى عليها، ثم ينتقل الشاعر في البيت التالي إلى المطر الذي جادها."
