first: "عَرِيَتْ وَكَانَ بِهَا الْجَمِيعُ فَأَبْكَرُوا"
second: "مِنْهَا وَغُودِرَ نُؤْيُهَا وَثُمَامُهَا"
meaning: "خلت الديار، وقد كان الحي كله مجتمعًا فيها، فرحلوا عنها بُكرة، وتُركت فيها الحواجز التي حفروها حول بيوتهم والثُّمام الذي ظلّلوها به. قال الزَّوْزَنِيّ: «أي لم يبق بمنازلهم منهم آثار إلا النؤي والثمام» [@zawzani، ص176]."
vocabulary:
  - term: "عَرِيَتْ"
    text: "«معناه خلت فلم يبق بها أحد» [@ibn-al-anbari، ص529]."
  - term: "الْجَمِيعُ"
    text: "في لسان العرب: «والجميعُ: الحيُّ المجتمِع»، وأنشد بيت لَبِيد [@lisan، ج8 ص54]."
  - term: "أَبْكَرُوا"
    text: "«غدوا منها بكرة. يقال بكر، وبَكَّر، وابتكر، وأبكر» [@ibn-al-anbari، ص529]."
  - term: "غُودِرَ"
    text: "«ترك» [@ibn-al-anbari، ص529]؛ «ومنه الغدير؛ لأنه ماء تركه السيل وخلفه» [@zawzani، ص176]."
  - term: "نُؤْيُهَا"
    text: "النُّؤْي: «حاجز يجعل حول البيت من تراب لئلا يدخل عليه الماء» [@ibn-al-anbari، ص529]."
  - term: "ثُمَامُهَا"
    text: "«شجر يلقونه على بيوتهم وعلى وطاب اللبن»، فإذا نزلوا أرضًا يستغنون فيها بشجرها عن الأبنية ظلّلوا بيوتهم به، «لأنه أبرد ظلا» [@ibn-al-anbari، ص529]. والوِطاب: أسقية اللبن."
syntax:
  - "«والواو في قوله (وكان بها الجميع) واو الحال، معناه وقد كان بها» [@ibn-al-anbari، ص529]. و«الْجَمِيعُ» اسم «كان»، و«بِهَا» خبرها مقدم."
  - "«فَأَبْكَرُوا» معطوف بالفاء على «كَانَ»، و«مِنْهَا» متعلق به، وقد جاء في أول العجز: فالجملة ممتدة من الصدر إلى العجز."
  - "«غُودِرَ» ماضٍ مبني للمجهول، و«نُؤْيُهَا» نائب فاعله، و«ثُمَامُهَا» معطوف عليه."
morphology:
  - "«أَبْكَرَ» على «أفعل» بمعنى دخل في البُكرة، وهو بمعنى «بَكَر» و«بكّر» و«ابتكر» [@zawzani، ص176]."
  - "«غُودِرَ» ماضي «غادر» على «فاعَل» مبنيًّا للمجهول، فقُلبت ألف «فاعَل» واوًا لضمّ ما قبلها: غادر ← غُودِر."
  - "«نُؤْي» يُجمع على «نُؤِيّ» و«أنآء»، «وتقلب فيقال آناء» [@zawzani، ص176]."
rhetoric:
  thesis: "الديار التي لا تجيب يجيب عنها حالها: كان الحي كله هنا، ثم رحل، ولم يبق إلا ما لا يُحمل."
  devices:
    - title: "المقابلة بين الحالين"
      text: "جمع في صدر البيت حالين متضادين: «عَرِيَتْ» الآن، «وَكَانَ بِهَا الْجَمِيعُ» من قبل. وواو الحال تضع الماضي الممتلئ إلى جانب الحاضر الخالي في جملة واحدة."
    - title: "دلالة الأثر الباقي"
      text: "اختار من آثار الحي شيئين لا يُحملان: النؤي المحفور في الأرض، والثُّمام الذي لا يُحتاج إلى حمله، قال الزَّوْزَنِيّ: «وإنما لم يحملوا الثمام؛ لأنه لا يعوزهم في محالِّهم» [@zawzani، ص176]، أي يجدونه حيث نزلوا. فما بقي هو ما لم يكن لأهله به حاجة."
  connection: "ثم يتذكر يوم الرحيل نفسه: نساء الحي يدخلن الهوادج [@ibn-al-anbari، ص529–530]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "عَرِيَتْ وَكَا / نَ بِهَلْ جَمِي / عُ فَأَبْكَرُو = متَفاعلن / متَفاعلن / متَفاعلن — مِنْهَا وَغُو / دِرَ نُؤْيُهَا / وَثُمَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]. والجملة تمتد من الصدر إلى العجز، فـ«مِنْهَا» متعلقة بـ«فَأَبْكَرُوا»."
context: "آخر أبيات الديار والأطلال. يجيب البيت عن السؤال الذي لم تُجب عنه الحجارة، ويقود إلى ذكر الظعائن يوم الرحيل."
variants:
  - reading: "عَرِيَتْ وَزَايَلَهَا الْجَمِيعُ"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص529]. وزايلها: فارقها."
  - reading: "كَانَتْ يَكُونُ بِهَا الْجَمِيعُ فَأَصْبَحُوا ... بَكَرُوا وَغُودِرَ خَيْمُهَا وَثُمَامُهَا"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص529]. والخَيْم: جمع خيمة."
  - reading: "مِنْهَا فَغُودِرَ نُؤْيُهَا وَثُمَامُهَا"
    status: "رواية لسان العرب"
    note: "بالفاء [@lisan، ج8 ص54]."
