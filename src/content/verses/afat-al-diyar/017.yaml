first: "مُرِّيَّةٌ حَلَّتْ بِفَيْدَ وَجَاوَرَتْ"
second: "أَهْلَ الْحِجَازِ فَأَيْنَ مِنْكَ مَرَامُهَا"
meaning: "هي امرأة من بني مُرّة، نزلت بفَيْد وجاورت أهل الحجاز، فأين أنت من طلبها؟ قال الزَّوْزَنِيّ: «وتلخيص المعنى أنه يقول: هي مرية تتردد بين الموضعين وبينهما وبين بلادك بعد، وكيف يتيسر لك طلبها والوصول إليها؟» [@zawzani، ص179]."
vocabulary:
  - term: "مُرِّيَّةٌ"
    text: "«منسوبة إلى بني مرة بن عوف بن سعد بن ذبيان بن بغيض» [@ibn-al-anbari، ص533]."
  - term: "فَيْدَ"
    text: "«بلد معروفة» [@zawzani، ص178]، وهي «في قرب جبلي طيئ» [@ibn-al-anbari، ص534]."
  - term: "الْحِجَازِ"
    text: "«ما بين تثليث إلى جبلي طيئ» [@ibn-al-anbari، ص533]. ويذكر ابن الأَنْبارِيّ أن «بلاد العرب خمسة أقسام: تهامة، والحجاز، ونجد، والعروض، واليمن» [@ibn-al-anbari، ص533]، ثم يحدّ كل قسم منها."
  - term: "مَرَامُهَا"
    text: "«مطلبها» [@ibn-al-anbari، ص533]."
syntax:
  - "«مُرِّيَّةٌ» خبر لمبتدأ محذوف تقديره: هي مُرِّيَّة، وبهذا التقدير لخّص الزَّوْزَنِيّ المعنى: «هي مرية» [@zawzani، ص179]. وجملة «حَلَّتْ» صفة لها، و«وَجَاوَرَتْ» معطوفة عليها."
  - "«فَيْدَ» مجرورة بالفتحة: «ولم يصرفها لاستجماعها التأنيث والتعريف، وصرفها سائغ أيضًا لأنها مصوغة على أخف أوزان الأسماء» [@zawzani، ص178]، أي لأنها ثلاثية ساكنة الوسط مثل هِنْد."
  - "«فَأَيْنَ مِنْكَ مَرَامُهَا»: «مَرَامُهَا» مبتدأ مؤخر، و«أَيْنَ» و«مِنْكَ» في موضع الخبر. ولا يتعلق «مِنْكَ» بـ«مَرَامُهَا»، «لأن صلة الاسم لا تتقدم عليه» [@ibn-al-anbari، ص534]."
morphology:
  - "«مُرِّيَّة» اسم منسوب إلى «مُرَّة» بياء النسب المشددة، والتاء للتأنيث."
  - "«مَرَام» مصدر ميمي من «رام يروم» بمعنى طلب، على «مَفْعَل»، وأصله «مَرْوَم» نُقلت حركة الواو إلى الراء ثم قُلبت ألفًا."
  - "«جَاوَرَ» على «فاعَلَ»، وهو للمشاركة: تجاورهم ويجاورونها."
rhetoric:
  thesis: "يحدد مكان نَوار ليقيس به بُعدها: هي من قبيلة غير قبيلته، وتنزل بين فَيْد والحجاز، فالسؤال في آخر البيت جوابه اليأس."
  devices:
    - title: "حذف المبتدأ"
      text: "بدأ البيت بالخبر «مُرِّيَّةٌ» وحذف المبتدأ، لأنه انتقل من السؤال في البيت السابق إلى التعريف بها. ويقول عبد القاهر الجُرْجانيّ إن من المواضع التي يكثر فيها هذا الحذف أن يقطع الشعراء الكلام الأول، «ويَستأنفون كلاماً آخرَ، وإِذا فعَلوا ذلك، أتوْا في أكثرِ الأمرِ بخبَرٍ من غَير مبتدإ» [@dalail، ص147]."
    - title: "الاستفهام الإنكاري"
      text: "«فَأَيْنَ مِنْكَ مَرَامُهَا» لا يسأل عن مكان، بل ينكر أن يكون الوصول إليها ممكنًا: «أي تعذر عليك طلبها» [@zawzani، ص179]."
    - title: "النسبة إلى قبيلة بعيدة"
      text: "لم يقل «امرأة» بل «مُرِّيَّةٌ»، أي من مُرّة بن عوف من ذُبْيان [@ibn-al-anbari، ص533]، ولَبِيد من بني عامر بن صَعْصَعة [@ibn-al-anbari، ص505]. فالنسبة نفسها تقول إن بينهما قبيلتين وديارين، قبل أن يذكر المسافة. وهذه قراءتنا."
  connection: "ثم يعدّ المواضع التي تنزلها: مشارق جبلي طيّئ، أو مُحَجَّر، أو فَرْدة ورُخامها [@ibn-al-anbari، ص535]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "مُرْرِيْيَةُنْ / حَلْلَتْ بِفَيْ / دَ وَجَاوَرَتْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — أَهْلَلْ حِجَا / زِ فَأَيْنَ مِنْ / كَ مَرَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلتين الأولى والثانية من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "في هذا البيت مسألة قديمة: كيف تنزل بفَيْد وتجاور أهل الحجاز، وبينهما مسافة بعيدة؟ أنكر أبو جَعْفَر رواية «الحجاز»، وقال: «وذلك أن فيد في قرب جبلي طيئ، ميرة أهل فيد من الجبلين، وبين فيد وبين الحجاز مسيرة ثلاثة عشر يوما، فكيف يكون أراد الحجاز؟» [@ibn-al-anbari، ص534]. وأجاب الزَّوْزَنِيّ بأنها تتنقل: «يريد أنها تحل بفيد أحيانًا وتجاور أهل الحجاز أحيانًا، وذلك في فصل الربيع وأيام الإنتاج» [@zawzani، ص179]. ويرى محقق الديوان إحسان عَبّاس أن رواية «العراق» «أصحّ بحسب هذا التحديد»، وأن بعض المفسرين زعموا أنها تتردد بين المكانين ليخرجوا «من هذا الإشكال» [@diwan-labid، ص302]."
variants:
  - reading: "وَجَاوَرَتْ أَهْلَ الْجِبَالِ"
    status: "رواية أبي جَعْفَر"
    note: "«وإنما أراد بالجبال أجأ وسلمى. قال: ومن الحجة للجبال قوله (بمشارق الجبلين أو بمحجر)» [@ibn-al-anbari، ص534]، أي البيت التالي. وأَجَأ وسَلْمَى جبلا طيّئ."
  - reading: "وَجَاوَرَتْ أَهْلَ الْعِرَاقِ"
    status: "رواية ينقلها محقق الديوان"
    note: "عن بعض نسخ معجم البَكْرِيّ، ويرجّحها المحقق [@diwan-labid، ص302]."
