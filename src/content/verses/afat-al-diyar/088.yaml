first: "وَهُمُ الْعَشِيرَةُ أَنْ يُبَطِّئَ حَاسِدٌ"
second: "أَوْ أَنْ يَلُومَ مَعَ الْعَدُوِّ لِيَامُهَا"
meaning: "وهم العشيرة التي تحمي نفسها من أن يُثبّط حاسدٌ الناسَ عن نصرتها، أو أن يلومها لائمون من أهلها مع أعدائها. قال ابن الأَنْبارِيّ: «يقول: هم العشيرة أن يبطئ حاسد عنهم، أو أن يلومهم لائم من عشيرتهم مع عدوهم» [@ibn-al-anbari، ص596]. وقال الزَّوْزَنِيّ في تحرير المعنى على روايته: «أنهم يتوافقون ويتعاضدون كراهية أن يبطئ الحساد بعضهم عن نصر بعض وميل لئامهم إلى الأعداء أو مظاهرتهم إياهم على الأقارب» [@zawzani، ص202]."
vocabulary:
  - term: "يُبَطِّئَ"
    text: "يؤخّر الناس عن نصرهم ويثبّطهم. وفي اللسان: «وبَطَّأَ فُلَانٌ بِفُلَانٍ: إِذا ثَبَّطَه عَنْ أَمرٍ عَزَمَ عَلَيْهِ» [@lisan، ج1 ص34]. وفسّر ابن الأَعْرابِيّ البيت كما في اللسان: «يَعْنِي أَن يَحُثّ الْعَدُوَّ عَلَى مَساوِيهم» [@lisan، ج1 ص34]."
  - term: "لِيَامُهَا"
    text: "لائموها، «جمع لائم، ولا يجوز همزه» [@ibn-al-anbari، ص597]."
syntax:
  - "«وَهُمُ الْعَشِيرَةُ» مبتدأ وخبر معرفة، والتعريف هنا للمدح: «وقوله (وهم العشيرة) فيه مدح، كما تقول (هو الرجل) أي هو الرجل الكامل» [@tabrizi-ashr، ص175]."
  - "«أَنْ يُبَطِّئَ حَاسِدٌ» مصدر مؤوّل اختلفوا في إعرابه. قال ابن الأَنْبارِيّ: «معناه من أن يبطئ حاسد، كما تقول: هو الحصن أن يرام، أي من أن يرام» [@ibn-al-anbari، ص596]، «وأنْ موضعها نصب في قول الفراء بحذف الخافض» [@ibn-al-anbari، ص597]. وعند الزَّوْزَنِيّ: «معناه على قول البصريين: كراهية أن يبطئ حاسد وكراهية أن يميل، وعند الكوفيين، أن لا يبطئ حاسد وأن لا يميل» [@zawzani، ص201]."
  - "«أَوْ أَنْ يَلُومَ» معطوف على «أَنْ يُبَطِّئَ»، و«لِيَامُهَا» فاعل «يَلُومَ»، و«مَعَ الْعَدُوِّ» ظرف متعلق به. والهاء في «لِيَامُهَا» للعشيرة، أي لائموها من أهلها."
morphology:
  - "«لِيام» جمع «لائم» على «فِعال»، بالياء لا بالهمز [@ibn-al-anbari، ص597]. أما «لِئام» في رواية الزَّوْزَنِيّ فجمع «لئيم» على «فِعال»، من اللؤم."
  - "«يُبَطِّئ» مضارع «بطّأ» على «فعّل» للتعدية: أبطأ به غيره."
  - "وفي «العِدى» يقول ابن الأَنْبارِيّ: «الاختيار فيه كسر العين إذا لم تكن فيه هاء، وقد تضم وليس ذلك مختارا. فإذا أدخلت الهاء ضمت العين لا غير» [@ibn-al-anbari، ص597]، فيقال: عُداة."
rhetoric:
  thesis: "خاتمة المعلقة: قوم متماسكون لا ينفذ إليهم حاسد ولا لائم، فالفخر ينتهي بالجماعة لا بالفرد."
  devices:
    - title: "الخبر المعرّف للكمال"
      text: "«وَهُمُ الْعَشِيرَةُ»: لا يخبر أنهم عشيرة كسائر العشائر، بل أنهم العشيرة التي يُعرف معناها كاملًا. وهذا الوجه يشرحه عبد القاهر الجُرْجانيّ في قولك «هو البطل المحامي»: «ولكنَّك تُريد أن تقولَ لصاحبك: هل سمعتَ بالبطل المحامي؟ وهل خصلت معنى هذه الصفةِ؟» [@dalail، ص182]، ثم تقول: فهو ذاك. وبمثله فسّر التِّبْرِيزِيّ البيت بقولهم: هو الرجل."
    - title: "الحذف"
      text: "«أَنْ يُبَطِّئَ»: حذف ما يربط المصدر بما قبله، فتعددت التقديرات: «من أن»، و«كراهية أن»، و«أن لا». والحذف يترك المعنى مفتوحًا على حماية القوم من كل ذلك. ويقول عبد القاهر في الحذف: «فإنك ترى به ترك الذكر، أفصح من الذكر» [@dalail، ص146]."
    - title: "النظير"
      text: "يقرنه ابن الأَنْبارِيّ بقول مَطْرُود بن كَعْب الخُزاعِيّ في قوم لا يصل إليهم اللوم: «أَخْلَصَهُمْ عِرْقٌ لُبَابٌ لَهُمْ ... مِنْ لَوْمِ مَنْ لَامَ بِمَنْجَاةِ» [@ibn-al-anbari، ص597]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَهُمُلْ عَشِي / رَةُ أَنْ يُبَطْ / طِئَ حَاسِدُنْ = متَفاعلن / متَفاعلن / متَفاعلن — أَوْ أَنْ يَلُو / مَ مَعَلْ عَدُوْ / وِ لِيَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "سلم الصدر من الزحاف. ودخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من العَجُز."
context: "آخر أبيات المعلقة عند ابن الأَنْبارِيّ والزَّوْزَنِيّ والديوان والجمهرة جميعًا. فالقصيدة التي بدأت بديار عفت وخلت من أهلها تنتهي بعشيرة عامرة متماسكة. وهذه قراءتنا."
variants:
  - reading: "أَوْ أَنْ يَمِيلَ مَعَ الْعَدُوِّ لِئَامُهَا"
    status: "رواية الزَّوْزَنِيّ والجمهرة والديوان"
    note: "[@zawzani، ص201] [@jamhara، ص269] [@diwan-labid، ص321]. ويقول التِّبْرِيزِيّ إنها «رواية أبي الحسن» [@tabrizi-ashr، ص175]، ولا يزيد في تعريفه."
  - reading: "أَوْ أَنْ يَلُومَ مَعَ الْعِدَى لُوَّامُهَا"
    status: "رواية أخرى"
    note: "يذكرها ابن الأَنْبارِيّ [@ibn-al-anbari، ص596]، وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص175]، وبها أنشده صاحب اللسان [@lisan، ج1 ص34]."
  - reading: "أَوْ أَنْ يَلُومَ مَعَ الْعُدَاةِ لِيَامُهَا"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص597]."
  - reading: "وَهُمُ الْعَشِيرَةُ إِنْ يُبَطِّئْ حَاسِدٌ"
    status: "رواية الديوان"
    note: "[@diwan-labid، ص321]."
  - reading: "وَهُمُ الْعَشِيرَةُ إِنْ تَبَطَّأَ حَاسِدٌ"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص597] [@tabrizi-ashr، ص176]."
  - reading: "وَهُمُ الْعَشِيرَةُ إِنْ تَنَبَّطَ حَاسِدٌ"
    status: "رواية أخرى"
    note: "«أي استخرج أخبارهم ليجد فيها عيبا فيذكرهم» [@ibn-al-anbari، ص597]."
