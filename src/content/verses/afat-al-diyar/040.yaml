first: "بَاتَتْ وَأَسْبَلَ وَاكِفٌ مِنْ دِيمَةٍ"
second: "يُرْوِي الْخَمَائِلَ دَائِمًا تَسْجَامُهَا"
meaning: "باتت البقرة بعد فقد ولدها تحت مطر يقطر من ديمة، مطر هادئ دائم يروي الرمال المنبتة، لا ينقطع صبّه. قال ابن الأَنْبارِيّ: «ومعنى البيت: باتت هذه البقرة بعد فقدها ولدها ممطورة تمطرها الديمة» [@ibn-al-anbari، ص558]."
vocabulary:
  - term: "أَسْبَلَ"
    text: "«سال واسترخى» [@ibn-al-anbari، ص557]. ونقل ابن الأَنْبارِيّ عن أبي زَيْد: «يقال أسبلت السماء إسبالا، وهو المطر، وهو بين السحاب والأرض حين يخرج من السحاب ولم يصل إلى الأرض» [@ibn-al-anbari، ص557]."
  - term: "وَاكِفٌ"
    text: "«يعني المطر يكف عنها» [@ibn-al-anbari، ص558]، أي يقطر. وقال الزَّوْزَنِيّ: «وواكف يجوز أن يكون صفة مطر ويجوز أن يكون صفة سحاب» [@zawzani، ص187]."
  - term: "دِيمَةٍ"
    text: "«مطر يدوم ويسكن ليس بالشديد» [@ibn-al-anbari، ص558]. وفي اللسان: «الديمةُ: الْمَطَرُ الَّذِي لَيْسَ فِيهِ رَعْد وَلَا بَرْقٌ» [@lisan، ج12 ص219]."
  - term: "الْخَمَائِلَ"
    text: "«جمع خميلة، وهي رملة تنبت الشجر وتعشب» [@ibn-al-anbari، ص558]."
  - term: "تَسْجَامُهَا"
    text: "«صبها» [@ibn-al-anbari، ص558]."
syntax:
  - "«بَاتَتْ» تامة بمعنى قضت ليلها، وفاعلها ضمير البقرة. والواو في «وَأَسْبَلَ» واو الحال، و«وَاكِفٌ» فاعل «أَسْبَلَ»، و«مِنْ دِيمَةٍ» نعت له."
  - "«و (يروى) صلة الديمة، ودائما نصب على الحال مما في يروى. والتسجام رفع بمعنى الديمومة» [@ibn-al-anbari، ص558]: أي جملة «يُرْوِي الْخَمَائِلَ» نعت للديمة، و«دَائِمًا» حال، و«تَسْجَامُهَا» فاعل «دَائِمًا» لأنه اسم فاعل يعمل عمل فعله."
morphology:
  - "«تَسْجَام» مصدر على «تَفْعال» بفتح التاء، وهو بناء يدل على التكرار والكثرة. قال الزَّوْزَنِيّ: «التَّسجام: في معنى السجم أو السجوم» [@zawzani، ص187]."
  - "«دِيمَة» أصلها من الواو: «وأصل ديمة دومة فقلبت الواو لانكسار ما قبلها» [@zawzani، ص187]."
  - "«أَسْبَلَ» على «أفعل»، و«وَاكِف» اسم فاعل من «وكَف يكِف» المثال الواوي، تُحذف واوه في المضارع."
  - "«الخَمَائِل» جمع «خَمِيلة» على «فَعَائِل»."
rhetoric:
  thesis: "بعد الدم في البيت السابق يأتي الماء: مطر هادئ طويل يغمر البقرة الليل كله. فالحزن هنا ليس صراخًا، بل ليل بارد لا ينتهي."
  devices:
    - title: "جناس الاشتقاق"
      text: "«دِيمَةٍ» و«دَائِمًا»: لفظان من أصل واحد (د و م)، ومعهما «تَسْجَامُهَا» بما في بنائه من التكرار. فالبيت كله يقول إن المطر لا ينقطع. والجناس: تشابه لفظين في الحروف، وجناس الاشتقاق أن يرجعا إلى أصل واحد. وهذه قراءتنا."
    - title: "المفارقة"
      text: "«يُرْوِي الْخَمَائِلَ»: المطر الذي يُنبت الرمل ويرويه هو نفسه الذي يُشقي البقرة. فما هو خير للأرض شقاء للأم الوحيدة. وهذه قراءتنا."
  connection: "ثم يصف كيف احتمت من هذا المطر بأصل شجرة منفردة في أطراف الرمل."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "بَاتَتْ وَأَسْ / بَلَ وَاكِفُنْ / مِنْ دِيمَتِنْ = مُتْفاعلن / متَفاعلن / مُتْفاعلن — يُرْوِي لْخَمَا / ئِلَ دَائِمَنْ / تَسْجَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأولى والثالثة من الصدر والعجز."
context: "أول أبيات الليلة الماطرة (40–43). تنتقل الحكاية من الفرير إلى أمه وحدها في الليل."
