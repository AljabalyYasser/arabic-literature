first: "خَنْسَاءُ ضَيَّعَتِ الْفَرِيرَ فَلَمْ يَرِمْ"
second: "عُرْضَ الشَّقَائِقِ طَوْفُهَا وَبُغَامُهَا"
meaning: "هي بقرة قصيرة الأنف أضاعت ولدها، فلم يزل طوافها وصياحها في نواحي الأرض الغليظة بين الرمال، لا يفارقانها. قال ابن الأَنْبارِيّ: «فأراد إنها تطوف وتبغم متلددة إذا فقدت ولدها» [@ibn-al-anbari، ص555]، والمتلدّد: المتحيّر يلتفت يمينًا وشمالًا. وقال الزَّوْزَنِيّ: «ضيعته حتى صادته السباع فطلبته طائفة وصائحة فيما بين الرمال» [@zawzani، ص186]."
vocabulary:
  - term: "خَنْسَاءُ"
    text: "«بقرة. والخنس: تأخر الأنف في الوجه وقصره أن يسبغ إلى الشفة» [@ibn-al-anbari، ص554]، أي أن يطول حتى يبلغ الشفة. «والبقر كلها خنس» [@ibn-al-anbari، ص555]."
  - term: "الْفَرِيرَ"
    text: "«ولد البقرة؛ وأصل الفرير الخروف، وهو من ولد الضأن» [@ibn-al-anbari، ص555]."
  - term: "يَرِمْ"
    text: "«معناه لم يبرح» [@ibn-al-anbari، ص555]."
  - term: "عُرْضَ"
    text: "«ناحية وجانب» [@ibn-al-anbari، ص555]."
  - term: "الشَّقَائِقِ"
    text: "«جمع شقيقة، وهي أرض غليظة بين رملتين» [@ibn-al-anbari، ص555]."
  - term: "بُغَامُهَا"
    text: "«صوت تختلسه اختلاسا» [@ibn-al-anbari، ص555]، أي صوت خافت متقطع. وفي اللسان أنه يُقال لأصوات بعض الوحش، «وَرُبَّمَا اسْتُعْمِل البُغامُ فِي البَقَرَة» [@lisan، ج12 ص52]."
syntax:
  - "«خَنْسَاءُ» صفة للبقرة: «وخنساء نعت الوحشية» [@ibn-al-anbari، ص555]، أي للوحشية في البيت السابق. وجملة «ضَيَّعَتِ الْفَرِيرَ» نعت آخر."
  - "«يَرِمْ» مضارع مجزوم بـ«لَمْ»، و«الطوف رفع بيرم، والبغام نسق عليه» [@ibn-al-anbari، ص555]، أي «طَوْفُهَا» فاعل و«بُغَامُهَا» معطوف عليه. و«عُرْضَ» مفعول به، لأن «رام المكان» بمعنى فارقه."
morphology:
  - "«خَنْسَاء» على «فَعْلاء» مؤنث «أَخْنَس»، وهو بناء الألوان والعيوب، ممنوع من الصرف."
  - "«يَرِمْ» من الأجوف اليائي: «الرَيم: البراح، والفعل رام يريم» [@zawzani، ص186]. أصله «يَرِيمُ»، فلما جُزم سكنت الميم فحُذفت الياء لالتقاء الساكنين."
  - "«الفَرِير» على «فَعِيل»، وجمعه «فُرار»: «ويقال فرير وفرار» [@ibn-al-anbari، ص555]، و«والجمع فُرار على غير قياس» [@zawzani، ص186]."
  - "«طَوْف» مصدر «طاف يطوف»، و«بُغَام» مصدر على «فُعال»، وهو بناء كثير في الأصوات كالخُوار والصُّراخ."
rhetoric:
  thesis: "الحركة والصوت يرسمان الفقد: لا يقول الشاعر إنها حزنت، بل يُري السامعَ طوافًا لا يبرح المكان وصوتًا مختلسًا. والشقائق أرض صلبة بين رمال، ففيها يدور الطلب ولا يخرج منها."
  devices:
    - title: "الإسناد إلى المصدر"
      text: "«فَلَمْ يَرِمْ ... طَوْفُهَا وَبُغَامُهَا»: جعل الفاعل طوافها وصوتها، لا البقرة نفسها، فكأن الطواف والبغام كائنان مقيمان في المكان لا يفارقانه. وهذه قراءتنا."
    - title: "الإيجاز"
      text: "«ضَيَّعَتِ الْفَرِيرَ»: كلمتان تحملان الحكاية كلها، وتفصيلها في البيتين التاليين. قال الزَّوْزَنِيّ: «أي خذلته حتى افترسته السباع فذلك تضييعها إياه» [@zawzani، ص186]. والإيجاز: أداء المعنى الكثير باللفظ القليل."
  connection: "ثم يذكر لماذا تطوف: ولدها الأبيض الذي تجاذبت الذئاب بقية جسده."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "خَنْسَاءُ ضَيْ / يَعَتِ لْفَرِي / رَ فَلَمْ يَرِمْ = مُتْفاعلن / متَفاعلن / متَفاعلن — عُرْضَ شْشَقَا / ئِقِ طَوْفُهَا / وَبُغَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأولى من العجز."
context: "الثاني من أبيات البقرة المسبوعة (36–39). يعيّن البقرة بصفتها (الخَنَس) وبمصابها (ضياع الفرير)، ويضعها في مكان (عُرض الشقائق)."
