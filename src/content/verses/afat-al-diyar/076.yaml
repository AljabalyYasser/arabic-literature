first: "تَأْوِي إِلَى الْأَطْنَابِ كُلُّ رَذِيَّةٍ"
second: "مِثْلِ الْبَلِيَّةِ قَالِصٍ أَهْدَامُهَا"
meaning: "وتلجأ إلى حبال بيوتنا كل امرأة هزيلة أهملها أهلها، كأنها الناقة التي تُحبس عند قبر صاحبها حتى تموت، وقد قصرت ثيابها البالية عن جسدها. قال ابن الأَنْبارِيّ: «الرذية: المرأة التي قد أرذاها أهلها، أي ألقوها» [@ibn-al-anbari، ص589]، ثم قال: «فيقول: منزلنا معان» [@ibn-al-anbari، ص589]، أي مقصود معروف، «والمعان: المعروف» [@ibn-al-anbari، ص590]. وقال الزَّوْزَنِيّ: «وتأوي إلى أطناب بيتي كل مسكينة ضعيفة قصيرة الأخلاق التي عليها» [@zawzani، ص198]."
vocabulary:
  - term: "تَأْوِي"
    text: "تلجأ وتنضمّ، كما فسّرها التِّبْرِيزِيّ [@tabrizi-ashr، ص171]."
  - term: "الْأَطْنَابِ"
    text: "«الأطناب: حبال البيت، واحدها طنب» [@zawzani، ص198]، وعند ابن الأَنْبارِيّ: «هي حبال الفسطاط» [@ibn-al-anbari، ص590]، والفُسْطاط: الخيمة الكبيرة."
  - term: "رَذِيَّةٍ"
    text: "«الرذية: الناقة التي ترذي في السفر، أي تخلف لفرط هزالها وكلالها، والجمع الرذايا، استعارها للفقيرة» [@zawzani، ص198]. وفي اللسان: «أَراد: كلُّ امرأَة أَرْذاها الجوعُ والسُّلالُ» [@lisan، ج14 ص320]، والسُّلال: داء يهزل الجسد."
  - term: "الْبَلِيَّةِ"
    text: "«ناقة الرجل تعقل عند قبره، وتطرح حقيبتها على رأسها» [@ibn-al-anbari، ص590]. «وقال أبو عمرو: البلية التي تبلى على صاحبها، أي تعقل عند قبره، فلا تعلف ولا تسقى حتى تموت» [@ibn-al-anbari، ص590]، «وإنما كانوا يفعلون ذلك لأنهم كانوا يقولون: يحشر عليها صاحبها» [@ibn-al-anbari، ص590]."
  - term: "قَالِصٍ"
    text: "مرتفع منقبض، «والقالص: المرتفع» [@tabrizi-ashr، ص171]. وقال أبو جَعْفَر: «تحسرت لأنها خلقان تقطعت» [@ibn-al-anbari، ص590]."
  - term: "أَهْدَامُهَا"
    text: "«الأهدام: الأخلاق من الثياب، واحدها هدم» [@zawzani، ص198]، والأخلاق: الثياب البالية."
syntax:
  - "«تَأْوِي» مضارع، و«كُلُّ» فاعله، و«رَذِيَّةٍ» مضاف إليه. وأنّث الفعل حملًا على المعنى، لأن كل رذية امرأة؛ وروى أبو عُبَيْدة «يأوي» بالياء، قال التِّبْرِيزِيّ: «بالياء على لفظ كل، والتاء على المعنى» [@tabrizi-ashr، ص171]."
  - "«إِلَى الْأَطْنَابِ» متعلق بـ«تَأْوِي»."
  - "جعل ابن الأَنْبارِيّ «مثل» و«قالص» نعتين للرذية، وقال: «والأهدام رفع بمعنى قالص» [@ibn-al-anbari، ص590]؛ أي «مِثْلِ» و«قَالِصٍ» مجروران نعتًا لـ«رَذِيَّةٍ»، و«أَهْدَامُهَا» فاعل لاسم الفاعل «قَالِصٍ». وعلى رواية الرفع «مِثْلُ ... قَالِصٌ» هما خبران لمبتدأ محذوف، أي هي مثل البلية، وعلى رواية «قَالِصًا» هو حال."
morphology:
  - "«رَذِيَّة» و«بَلِيَّة» على «فَعِيلة» بمعنى «مُفْعَلة»: «وبَلِيَّة: بِمَعْنَى مُبْلاةٍ أَو مُبَلَّاة، وَكَذَلِكَ الرَّذِيَّة بِمَعْنَى مُرَذَّاة، فعِيلة بِمَعْنَى مُفْعَلة» [@lisan، ج14 ص86]."
  - "«أَهْدام» جمع «هدم» على «أفعال»، «وواحد الأهدام هدم؛ وهو الهدمل» [@ibn-al-anbari، ص590]."
  - "«قالِص» اسم فاعل من «قلص» إذا ارتفع وانقبض. و«الأَطْناب» جمع «طنب» على «أفعال»."
rhetoric:
  thesis: "بيت المرأة الفقيرة: لبيد لا يصف كرمه بما يعطي، بل بمن يلجأ إليه."
  devices:
    - title: "الكناية"
      text: "«تَأْوِي إِلَى الْأَطْنَابِ»: لم يقل إنهم يطعمون الفقراء، بل جعل الفقراء يأوون إلى حبال بيوتهم، فدلّ على الكرم بأثره. وهذا عند عبد القاهر الجُرْجانيّ من الكناية التي يُذكر فيها لازم الصفة بدلًا منها، كقول الآخر «جَبَانُ الْكَلْبِ مَهْزُولُ الْفَصِيلِ»، قال: «أَرادَ أنْ يذْكُرَ نفسَه بالقرى والضيافةِ، فكنَّى عن ذلك بجُبْنِ الكَلْب وهُزالِ الفصيلِ» [@dalail، ص307]. والكناية: أن تذكر شيئًا وتريد لازمه."
    - title: "التشبيه"
      text: "«مِثْلِ الْبَلِيَّةِ»: شبّه المرأة المهملة بالناقة التي تُحبس عند القبر حتى تموت، والشبه عند الزَّوْزَنِيّ «في قلة تصرفها وعجزها عن الكسب وامتناع الرزق منها» [@zawzani، ص199]. فالمشبَّه به صورة موت بطيء، وبيت الكريم هو الذي يقطعه."
    - title: "الاستعارة"
      text: "«رَذِيَّةٍ»: الكلمة للناقة الهزيلة التي تُترك في الطريق، فنقلها إلى المرأة كما يقول الزَّوْزَنِيّ. فصار في البيت ناقتان للمرأة: الرذية المستعارة، والبلية المشبَّه بها، وكلتاهما متروكة للموت. والاستعارة: أن تعطي الشيء اسم غيره لشبه بينهما."
  connection: "ثم يصف ما يُطعم هؤلاء في الشتاء: جفانًا كالخلجان يخوض فيها الأيتام."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "تَأْوِي إِلَلْ / أَطْنَابِ كُلْ / لُ رَذِيْيَتِنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — مِثْلِلْ بَلِيْ / يَةِ قَالِصِنْ / أَهْدَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلتين الأولى والثانية من الصدر، والأولى والثالثة من العَجُز."
context: "رابع أبيات الميسر والقِرى (73–77): لا يقف عند الضيف والجار، بل ينزل إلى أضعف من يأوي إليه. والمراد بالرذية عند التِّبْرِيزِيّ «الأرامل واليتامى» [@tabrizi-ashr، ص171]."
