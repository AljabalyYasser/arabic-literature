first: "رَجَعَا بِأَمْرِهِمَا إِلَى ذِي مِرَّةٍ"
second: "حَصِدٍ وَنُجْحُ صَرِيمَةٍ إِبْرَامُهَا"
meaning: "ردّ العير والأتان أمرهما إلى رأي قوي محكم، وهو عزم العير على ورود الماء، وإنما تنجح العزيمة إذا أُحكمت. قال الزَّوْزَنِيّ: «يقول: أسند العير والأتان أمرهما إلى عزم أو رأي محكم ذي قوة وهو عزم العير على الورود أو رأيه فيه، ثم قال: وإنما يحصل المرام بإحكام العزم» [@zawzani، ص183]."
vocabulary:
  - term: "ذِي مِرَّةٍ"
    text: "«و (المرة) : الرأي. وأصل المرة إحكام الفتل، فضربه مثلا» [@ibn-al-anbari، ص546]. وعند الزَّوْزَنِيّ: «المرة: القوة، والجمع المرر، وأصلها قوة الفتل، والإمرار إحكام الفتل» [@zawzani، ص183]."
  - term: "حَصِدٍ"
    text: "«مبرم محكم. يقال وتر حصد ومحصد ومحكم، إذا كان متداني القوى شديد الفتل» [@ibn-al-anbari، ص547]. وفي لسان العرب: «والحَصَدُ: اشْتِدَادُ الْفَتْلِ وَاسْتِحْكَامُ الصِّنَاعَةِ فِي الأَوتار وَالْحِبَالِ وَالدُّرُوعِ»، و«وَرَجُلٌ مُحْصَدُ الرأْي: مُحْكَمُهُ سَدِيدُهُ، عَلَى التَّشْبِيهِ بِذَلِكَ» [@lisan، ج3 ص152]."
  - term: "نُجْحُ"
    text: "«النجح والنجاح. حصول المراد» [@zawzani، ص183]."
  - term: "صَرِيمَةٍ"
    text: "«الخصلة المقطوعة إذا قطعت وعزم عليها. وأصل الصرم القطع» [@ibn-al-anbari، ص547]. وعند الزَّوْزَنِيّ: «العزيمة التي صرمها صاحبها عن سائر عزائمه بالجد في إمضائها» [@zawzani، ص183]."
  - term: "إِبْرَامُهَا"
    text: "«و (الإبرام) : الإحكام» [@ibn-al-anbari، ص547]."
syntax:
  - "«رَجَعَا» جواب «إذا» في البيت السابق، «وما في (رجعا) يعود على الحمار والأتان» [@ibn-al-anbari، ص547]، أي ألف الاثنين."
  - "في الباء من «بِأَمْرِهِمَا» قولان: «الباء في بأمرهما زائدة إن جعلت رجعا من الرّجع، أي رجعا أمرهما أي أسنداه، وإن جعلته من الرجوع كانت الباء للتعدية» [@zawzani، ص183]."
  - "«وحصد نعت لذي، والنجح رفع بالإبرام» [@ibn-al-anbari، ص547]: فـ«حَصِدٍ» نعت لـ«ذِي مِرَّةٍ»، وجملة «وَنُجْحُ صَرِيمَةٍ إِبْرَامُهَا» مبتدأ وخبر مستأنفة. «والمعنى: رجعا بأمرهما في الورد إلى رأى ذي مرة حصد» [@ibn-al-anbari، ص547]."
morphology:
  - "«مِرَّة» على «فِعْلة» من الإمرار، وهو إحكام الفتل [@zawzani، ص183]."
  - "«حَصِد» صفة على «فَعِل»، «والفعل حصِد يحصَد، وقد أحصدت الشيء أحكمته» [@zawzani، ص183]."
  - "«صَرِيمَة» على «فَعِيلة»، وجمعها «الصرائم» [@zawzani، ص183]. و«إِبْرَام» مصدر «أبرم» على «إفعال»، وأصله في الحبل: أبرم الحبل إذا فتله فتلًا محكمًا."
rhetoric:
  thesis: "يجعل الشاعر الحيوانين يتشاوران ويعزمان، ثم يختم بحكمة في العزيمة تصلح للناس قبل الوحش."
  devices:
    - title: "استعارات من فتل الحبل"
      text: "ألفاظ البيت كلها من صناعة الحبال: «مِرَّةٍ» وأصلها «إحكام الفتل، فضربه مثلا» [@ibn-al-anbari، ص546]، و«حَصِدٍ» من الوتر الشديد الفتل، و«إِبْرَامُهَا» من إبرام الحبل. فالرأي القوي في البيت حبل محكم الفتل. ويصف لسان العرب هذا الاستعمال بأنه «عَلَى التَّشْبِيهِ بِذَلِكَ» [@lisan، ج3 ص152]."
    - title: "الحكمة"
      text: "«وَنُجْحُ صَرِيمَةٍ إِبْرَامُهَا» قول عام: لا تنجح العزيمة إلا محكمة. وفسّره ابن الأَنْبارِيّ: «يقول: فنجح صريمة أن تصرم أمرها وتحكمه فلا يلتبس؛ فإذا لم تُحكمها فليس بنجح» [@ibn-al-anbari، ص547]. وكما ختم بيت قطع اللبانة (20) بحكمة في الصداقة، يضع هنا حكمة في العزم وسط حكاية الوحش."
    - title: "الحيوان كالإنسان"
      text: "«رَجَعَا بِأَمْرِهِمَا» يصوّر العير والأتان كاثنين يتنازعان الرأي ثم يتفقان، قال ابن الأَنْبارِيّ: «معناه كان ينازعها وتنازعه ثم رجعا بأمرهما، أي صار الشأن إليه» [@ibn-al-anbari، ص546]. فالقرار في النهاية للعير."
  connection: "ثم يذكر علامات الصيف التي حملتهما على الورود: شوك يابس يصيب حوافرهما، وريح حارة [@ibn-al-anbari، ص547–548]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "رَجَعَا بِأَمْ / رِهِمَا إِلَا / ذِي مِرْرَةِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — حَصِدِنْ وَنُجْ / حُ صَرِيمَةِنْ / إِبْرَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلةَ الثالثة من الصدر والثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "من أبيات الأتان وفحلها (25–35). جواب الشرط في البيت 28: بعد الأشهر الستة في المرعى يعزمان على الماء، ومن هنا تبدأ رحلتهما إليه."
