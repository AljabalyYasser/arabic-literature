first: "وَرَمَتْ دَوَابِرَهَا السَّفَا وَتَهَيَّجَتْ"
second: "رِيحُ الْمَصَايِفِ سَوْمُهَا وَسَهَامُهَا"
meaning: "عزما على الماء وقد أصاب شوكُ البُهْمَى اليابس مآخير حوافرهما، وهبّت ريح الصيف بمرورها وحرّها. قال الزَّوْزَنِيّ: «يقول: وأصاب شوك البهمى مآخير حوافرها، وتحركت ريح الصيف مرورها وشدة حرها، يشير بهذا إلى انقضاء الربيع ومجيء الصيف واحتياجهما إلى ورود الماء» [@zawzani، ص184]."
vocabulary:
  - term: "دَوَابِرَهَا"
    text: "«الدوابر: مآخير الحوافر، واحدتها دابرة» [@ibn-al-anbari، ص547]."
  - term: "السَّفَا"
    text: "«والسفا: سفا البهمى، وهو كشوك السنبل؛ وهو يجف إذا جاء الصيف؛ واحدته سفاة. والبهمى: شجر» [@ibn-al-anbari، ص547]. وعند الزَّوْزَنِيّ: «شوك البهمى وهو ضرب من الشوك» [@zawzani، ص183]."
  - term: "وَتَهَيَّجَتْ"
    text: "«وتهيجت: هاجت» [@ibn-al-anbari، ص548]، أي تحركت واشتدت."
  - term: "الْمَصَايِفِ"
    text: "«جمع المصيف وهو الصيف» [@zawzani، ص183]."
  - term: "سَوْمُهَا"
    text: "«سومها: مرها» [@ibn-al-anbari، ص548]، و«السوم: المرور، والفعل سام يسوم» [@zawzani، ص183]."
  - term: "وَسَهَامُهَا"
    text: "«والسهام: ريح حارة» [@ibn-al-anbari، ص548]. وفي لسان العرب: «والسَّهامُ، بِالْفَتْحِ: حَرُّ السَّمُومِ»، و«والسَّهامُ: الرِّيحُ الحارَّة، وَاحِدُهَا وَجَمْعُهَا سَوَاءٌ» [@lisan، ج12 ص310]."
syntax:
  - "«والواو في ورمت واو الوقت، ومع رمى إضمار قد، تقديره: وقد رمت دوابرها، أي رجعا بأمرهما وقت رمى دوابرها السفا» [@ibn-al-anbari، ص548]. فالجملة حال من فاعل «رَجَعَا» في البيت السابق."
  - "«السَّفَا» فاعل «رَمَتْ» مؤخر، و«دَوَابِرَهَا» مفعول به مقدم. وأُنّث الفعل لأن السفا مؤنث، ويروى «وَرَمَى» بالتذكير: «وكل فعل لمؤنث متقدم عليه إذا حيل بينه وبين الاسم صلح فيه التذكير والتأنيث» [@ibn-al-anbari، ص548]، أي إذا فصل بين الفعل وفاعله المؤنث فاصل جاز تذكير الفعل وتأنيثه."
  - "«رِيحُ» فاعل «تَهَيَّجَتْ»، و«سَوْمُهَا وَسَهَامُهَا» بدل منها، يفصّل ما في الريح، وبهذا فسّره الزَّوْزَنِيّ: «وتحركت ريح الصيف مرورها وشدة حرها» [@zawzani، ص184]."
morphology:
  - "«دَوَابِر» جمع «دابرة» على «فواعل» [@ibn-al-anbari، ص547]، من الدُّبُر، وهو المؤخَّر."
  - "«مَصَايِف» جمع «مَصِيف» [@zawzani، ص183]، وهو اسم لزمان الصيف على «مَفْعِل»."
  - "«تَهَيَّجَ» على «تفعّل» من «هاج»، و«سَوْم» مصدر «سام يسوم» [@zawzani، ص183]."
rhetoric:
  thesis: "لا يقول الشاعر: جاء الصيف، بل يُرينا علاماته: شوك جفّ حتى صار يجرح الحوافر، وريح حارة. فيفهم القارئ أن الماء صار ضرورة."
  devices:
    - title: "الكناية"
      text: "يعرّف عبد القاهر الجُرْجانيّ الكناية بأن يترك المتكلم اللفظ الموضوع للمعنى، «ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]. وفي البيت كناية عن مجيء الصيف: جفاف السفا ويبسه يتبع الصيف، وريح السَّهام تتبعه. ولهذا قال الزَّوْزَنِيّ: «يشير بهذا إلى انقضاء الربيع ومجيء الصيف» [@zawzani، ص184]."
    - title: "التفصيل بعد الإجمال"
      text: "ذكر «رِيحُ الْمَصَايِفِ» ثم فصّلها: «سَوْمُهَا وَسَهَامُهَا»، أي مرورها وحرّها. وهي طريقته في مطلع القصيدة حين قال «وَدْقُ الرَّوَاعِدِ جَوْدُهَا وَرِهَامُهَا» في البيت 4."
    - title: "من المطر إلى الجفاف"
      text: "بدأت القصيدة بالمطر يُخصب الديار (4–6)، وهنا يجفّ النبت ويصير شوكًا. فدورة الفصول التي عدّها في البيت 28 تنتهي بالعطش، وهو ما يدفع الحكاية إلى الماء. وهذه قراءتنا."
  connection: "ثم يعدوان إلى الماء، يتجاذبان بينهما غبارًا ممتدًا كدخان نار [@ibn-al-anbari، ص548–549]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَرَمَتْ دَوَا / بِرَهَسْ سَفَا / وَتَهَيْيَجَتْ = متَفاعلن / متَفاعلن / متَفاعلن — رِيحُلْ مَصَا / يِفِ سَوْمُهَا / وَسَهَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "من أبيات الأتان وفحلها (25–35). يحدد الوقت الذي عزما فيه على الماء: آخر الربيع وأول الصيف."
