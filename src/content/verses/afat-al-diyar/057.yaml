first: "بَلْ أَنْتِ لَا تَدْرِينَ كَمْ مِنْ لَيْلَةٍ"
second: "طَلْقٍ لَذِيذٍ لَهْوُهَا وَنِدَامُهَا"
meaning: "بل أنتِ يا نَوار لا تعلمين كم من ليلة صافية لا حرّ فيها ولا برد، لذيذ لهوها ومنادمتها، قضيتُها. قال الزَّوْزَنِيّ: «بل أنت يا نوار لا تعلمين كم من ليلة ساكنة غير مؤذية بحر ولا برد لذيذة اللهو والندماء والمنادمة» [@zawzani، ص193]."
vocabulary:
  - term: "طَلْقٍ"
    text: "«ويقال: يوم طلق وليلة طلقٌ وطلقة، إذا لم يكن فيهما برد ولا ريح ولا مطر» [@ibn-al-anbari، ص574]."
  - term: "نِدَامُهَا"
    text: "«المنادمة. يقال نادمت الرجل منادمة ونداما» [@ibn-al-anbari، ص574]. وعند الزَّوْزَنِيّ: «الندام: جمع نديم مثل الكرام في جمع كريم، والندام أيضًا المنادمة مثل الجدال والمجادلة، والندام في البيت يحتمل الوجهين» [@zawzani، ص193]. والنديم: رفيق الشراب."
  - term: "لَهْوُهَا"
    text: "ما يُتلهّى به فيها من شراب وغناء وحديث."
syntax:
  - "«بَلْ» للإضراب: ترك الخبر عن نَوار إلى خطابها. و«أَنْتِ» مبتدأ، وجملة «لَا تَدْرِينَ» خبره."
  - "«كَمْ» خبرية للتكثير، و«مِنْ لَيْلَةٍ» تمييزها، وخبرها في البيت التالي «قَدْ بِتُّ سَامِرَهَا»، وجملتها في موضع مفعول «تَدْرِينَ»."
  - "«طَلْقٍ» نعت لـ«لَيْلَةٍ» بلفظ المذكر: «قوله (ليلة طلق) أراد طلقة، ولكنه وصفها بأمر طلق. ويقال: إنما ذكر طلقا لأنه مشبه بالمصدر، كما تقول امرأة عدل» [@ibn-al-anbari، ص574]. و«لَذِيذٍ» نعت ثانٍ، و«لَهْوُهَا» فاعله: «واللهو رفع باللذة» [@ibn-al-anbari، ص574]."
morphology:
  - "«طَلْق» على «فَعْل»، وصف يستوي فيه المذكر والمؤنث لشبهه بالمصدر [@ibn-al-anbari، ص574]."
  - "«لَذِيذ» على «فَعِيل» صفة مشبهة، و«نِدَام» على «فِعال» مصدر «نادم» أو جمع «نديم» [@zawzani، ص193]."
  - "«تَدْرِينَ» مضارع «درى يدري» مسند إلى ياء المخاطبة، مرفوع بثبوت النون."
rhetoric:
  thesis: "يُخرج الشاعر لنَوار ما لا تعرفه عنه: لياليه الصافية. والفخر هنا فخر باللذة والكرم، قبل فخر الحرب."
  devices:
    - title: "الالتفات"
      text: "«بَلْ أَنْتِ»: تحوّل من الحديث عن نَوار بضمير الغائبة في «أَوَلَمْ تَكُنْ تَدْرِي نَوَارُ» إلى خطابها. قال الزَّوْزَنِيّ: «أضرب عن الإخبار للمخاطبة» [@zawzani، ص193]. والالتفات: الانتقال من الغيبة إلى الخطاب أو العكس، وفائدته هنا أن يقرّب المرأة فيكلمها كأنها أمامه."
    - title: "كم الخبرية"
      text: "«كَمْ مِنْ لَيْلَةٍ»: لا يعدّ الليالي بل يكثّرها، فلا يذكر عددًا ولا ليلة بعينها، ويترك للسامع أن يتصور كثرتها. وهذه قراءتنا."
  connection: "ثم يقول إنه سهر تلك الليلة، وجاء إلى راية الخمّار حين غلت الخمر."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "بَلْ أَنْتِ لَا / تَدْرِينَ كَمْ / مِنْ لَيْلَتِنْ = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — طَلْقِنْ لَذِي / ذِنْ لَهْوُهَا / وَنِدَامُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، تفعيلات الصدر الثلاث والأوليين من العجز."
context: "الثالث من أبيات خطاب نَوار (55–62). تبدأ به أبيات اللهو والخمر (57–62)."
