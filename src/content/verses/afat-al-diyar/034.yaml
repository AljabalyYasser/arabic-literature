first: "فَتَوَسَّطَا عُرْضَ السَّرِيِّ وَصَدَّعَا"
second: "مَسْجُورَةً مُتَجَاوِرًا قُلَّامُهَا"
meaning: "فخاض العير والأتان جانب النهر الصغير، وشقّا عينًا ممتلئة بالماء قد تكاثف نبتها حولها. قال الزَّوْزَنِيّ: «وتحرير المعنى: أنهما قد وردا عينًا ممتلئة ماء فدخلا فيها من عرض نهرها، وقد تجاوز نبتها» [@zawzani، ص185]."
vocabulary:
  - term: "فَتَوَسَّطَا"
    text: "«ويقال معنى (توسطا) خاضا الماء» [@ibn-al-anbari، ص553]."
  - term: "عُرْضَ"
    text: "«العرض: الناحية» [@ibn-al-anbari، ص552]. وفي لسان العرب: «وعُرْضُ الشَّيْءِ: وسَطُه وناحِيتُه»، و«كُلُّ ذَلِكَ يُوصَفُ بِهِ الْوَسَطُ» [@lisan، ج7 ص176]."
  - term: "السَّرِيِّ"
    text: "«والسري هو الصغير من الأنهار بمنزلة الجدول» [@ibn-al-anbari، ص552]، و«السري: النهر الصغير، والجمع الأسرية» [@zawzani، ص185]."
  - term: "وَصَدَّعَا"
    text: "«وصدعا معناه شققا النبت الذي على الماء» [@ibn-al-anbari، ص552]. وفي لسان العرب: «وصَدَع الفَلاةَ والنهرَ يَصْدَعُهما صَدْعاً وصَدَّعَهما: شَقَّهما وقَطَعَهما، عَلَى الْمَثَلِ» [@lisan، ج8 ص194]."
  - term: "مَسْجُورَةً"
    text: "«ومسجورة: عين مملوة» [@ibn-al-anbari، ص552]. «وقال أبو عمرو الشيباني: يقال قد سجر السيل الغدير والبئر يسجرها، إذا ملأها» [@ibn-al-anbari، ص552]."
  - term: "قُلَّامُهَا"
    text: "«نبت ينبت على الأنهار، يقال هو القاقلي» [@ibn-al-anbari، ص552]. وفي لسان العرب: «والقُلَّام، بِالتَّشْدِيدِ: ضَرْبٌ مِنَ الحَمْض» [@lisan، ج12 ص491]، والحَمْض: نبت مالح ترعاه الإبل."
syntax:
  - "ألف الاثنين في «فَتَوَسَّطَا» و«صَدَّعَا» للعير والأتان. و«عُرْضَ» مفعول به لـ«تَوَسَّطَا»."
  - "«مَسْجُورَةً» مفعول به لـ«صَدَّعَا»، وهي صفة لموصوف محذوف: «أي عينًا مسجورة، فحذف الموصوف لما دلت عليه الصفة» [@zawzani، ص185]."
  - "«و (متجاورا) نعت لمسجورة، والقلاَّم مرتفع بمتجاور» [@ibn-al-anbari، ص553]: فـ«قُلَّامُهَا» فاعل لاسم الفاعل «مُتَجَاوِرًا»، وجاء النعت مذكرًا لأنه يرفع اسمًا مذكرًا."
morphology:
  - "«تَوَسَّطَ» على «تفعّل» من الوسط، و«صَدَّعَ» على «فعّل» للتكثير: «التصديع: التشقيق» [@zawzani، ص185]."
  - "«مَسْجُورَة» اسم مفعول من «سجر» إذا ملأ، «وهو حرف من الأضداد. ويكون المسجور المملو، ويكون المسجور الفارغ» [@ibn-al-anbari، ص552]. والأضداد: ألفاظ تدل على المعنى وضده."
  - "«مُتَجَاوِر» اسم فاعل من «تجاور» على «تفاعل»، و«قُلَّام» على «فُعّال»."
rhetoric:
  thesis: "تبلغ رحلة العطش غايتها: العير والأتان يدخلان الماء ويشقّان النبت الكثيف حوله. والبيت يصف عينًا لم يردها أحد قبلهما."
  devices:
    - title: "الاستعارة في «وَصَدَّعَا»"
      text: "الاستعارة: أن يُستعمل اللفظ في غير ما وُضع له لشبه بينهما. والصَّدْع شقّ الشيء الصلب، فاستعاره لدخولهما الماء والنبت، كأن العين جسم يُشقّ. ويذكر لسان العرب هذا الاستعمال في النهر والفلاة ويقول إنه «عَلَى الْمَثَلِ» [@lisan، ج8 ص194]، أي على المجاز."
    - title: "الكناية في «مُتَجَاوِرًا قُلَّامُهَا»"
      text: "الكناية: أن يُذكر شيء يلزم عن المعنى ليُدلّ به عليه. فكثرة النبت حول العين تدل على أنها لا يردها أحد: «أراد إنها لا تورد فقد عفا نبتها» [@ibn-al-anbari، ص552]، وعفا هنا بمعنى كثر. واستشهد له ابن الأَنْبارِيّ بقول الحُطَيْئة: «مَنَعْنَ مَنَابِتَ الْقُلَّامِ حَتَّى ... عَلَا الْقُلَّامُ أَفْوَاهَ الرَّكِيِّ» [@ibn-al-anbari، ص552]، والرَّكِيّ: الآبار. فالعين بعيدة عن الناس، وفي هذا أمان للوحش، وفيه أيضًا ما يستر الصياد."
  connection: "ثم يصف العين وقد حفّ بها القصب، يظلّها منه ما سقط وما قام [@ibn-al-anbari، ص553]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَتَوَسْسَطَا / عُرْضَسْ سَرِيْ / يِ وَصَدْدَعَا = متَفاعلن / مُتْفاعلن / متَفاعلن — مَسْجُورَةَنْ / مُتَجَاوِرَنْ / قُلْلَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر، والأولى والثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "من أبيات الأتان وفحلها (25–35)، وفيه يبلغان الماء بعد العدو. وقال أبو جَعْفَر: «يصف شدة عطشهما، وإنه حملها على توسط السري ولم يخافا راميا ولا غيره، على كثرة ما حوله من النبت» [@ibn-al-anbari، ص553]."
