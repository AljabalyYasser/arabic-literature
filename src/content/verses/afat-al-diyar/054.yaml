first: "أَقْضِي اللُّبَانَةَ لَا أُفَرِّطُ رِيبَةً"
second: "أَوْ أَنْ يَلُومَ بِحَاجَةٍ لُوَّامُهَا"
meaning: "على تلك الناقة أقضي حاجتي، ولا أترك أمرًا فيه ريبة حتى أحكمه، إلا أن يلومني فيها لائم. وللشارحين في «لَا أُفَرِّطُ» قولان. فعند ابن الأَنْبارِيّ: «يقول: أتثبت فلا أتقدم في الحاجة قبل أن أستثيرها، وقبل أن آتي أمرا تكون عاقبته لائمة، أي لا أتقدم على أمر أشك فيه» [@ibn-al-anbari، ص572]. وعند الزَّوْزَنِيّ أنه لا يقصّر: «أنه لا يقصر ولكن لا يمكنه الاحتراز عن لوم اللوّام إياه» [@zawzani، ص192]."
vocabulary:
  - term: "اللُّبَانَةَ"
    text: "«اللبانة: الحاجة» [@ibn-al-anbari، ص572]."
  - term: "أُفَرِّطُ"
    text: "عند ابن الأَنْبارِيّ من التقدّم: «معناه لا أدع ريبة تنفذني حتى أحكمها. والتفريط: الإنفاذ والتقديم» [@ibn-al-anbari، ص572]، وفيه قول آخر: «أمضى في الحاجة ولا أقصر فيها» [@ibn-al-anbari، ص573]. وعند الزَّوْزَنِيّ من التضييع: «التفريط التضييع وتقدمة العجز» [@zawzani، ص192]."
  - term: "رِيبَةً"
    text: "«الشك وما يريبك» [@ibn-al-anbari، ص572]."
  - term: "لُوَّامُهَا"
    text: "«واللوَّام: مبالغة اللائم، واللوّام جمع اللائم» [@zawzani، ص192]."
syntax:
  - "«أَقْضِي» يتعلق به «فَبِتِلْكَ» في البيت السابق، وجملة «لَا أُفَرِّطُ رِيبَةً» حال من فاعله. «ومن رواه (لا أفرط) أراد لأن لا أفرط، فحذف أن واكتفى بلا منها ورفع المستقبل بفقد الناصب» [@ibn-al-anbari، ص573]."
  - "«أَوْ» بمعنى «إلا» عند الزَّوْزَنِيّ: «وأو في قوله: أو أن يلوم، بمعنى إلا، ومثله قولهم: لألزمه أو يعطيني حقي» [@zawzani، ص192]، ويستشهد بقول امرئ القَيْس «نُحَاوِلُ مُلْكًا أَوْ نَمُوتَ فَنُعْذَرَا» [@zawzani، ص192]. و«أَنْ يَلُومَ» مصدر مؤول، و«لُوَّامُهَا» فاعل «يَلُومَ»، والضمير للحاجة."
morphology:
  - "«أُفَرِّط» مضارع «فرّط» على «فعّل»، من «فرَط» إذا تقدّم: «يقال: فرط الفارط في طلب الماء، إذا تقدم فيه» [@ibn-al-anbari، ص572]."
  - "«لُوَّام» على «فُعَّال»، جمع «لائم» أو صيغة مبالغة منه [@zawzani، ص192]."
  - "«اللُّبَانَة» على «فُعَالة»، و«رِيبَة» على «فِعْلة» من «راب يريب»."
rhetoric:
  thesis: "يبدأ الفخر هنا بالعزم: رجل لا يترك حاجة نصف مقضية. وهو بيت الانتقال من وصف الراحلة إلى الحديث عن النفس."
  devices:
    - title: "الاحتراس"
      text: "«أَوْ أَنْ يَلُومَ بِحَاجَةٍ لُوَّامُهَا»: بعد أن نفى عن نفسه التقصير استثنى اللوم، أي إن لامه لائم فلأن اللوم لا يُتّقى، لا لأنه قصّر. والاحتراس: أن يأتي المتكلم بما يدفع عن كلامه توهّم خلاف ما يريد. وهذه قراءتنا على تفسير الزَّوْزَنِيّ."
    - title: "الجناس"
      text: "«يَلُومَ ... لُوَّامُهَا»: الفعل وفاعله من أصل واحد، فيتردد اللوم في الشطر مرتين. وهذه قراءتنا."
  connection: "ثم يلتفت إلى نَوار: ألم تكن تعلم أني أصل من يستحق الوصل وأقطع من يستحق القطع؟"
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَقْضِ لْلُبَا / نَةَ لَا أُفَرْ / رِطُ رِيبَتَنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — أَوْ أَنْ يَلُو / مَ بِحَاجَتِنْ / لُوْوَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأولى والثالثة من العجز."
context: "ثاني بيتي العودة إلى الناقة (53–54)، وبه تنتهي أوصاف الرحلة. وفيه صدى البيت 20 «فَاقْطَعْ لُبَانَةَ مَنْ تَعَرَّضَ وَصْلُهُ»: هناك يقطع لبانته ممن تغيّر، وهنا يقضيها."
variants:
  - reading: "أَقْضِي اللُّبَانَةَ أَنْ أُفَرِّطَ رِيبَةً"
    status: "رواية أخرى"
    note: "«ويروى: (أقضى اللبانة أن أفرط ريبة) فمعناه لأن لا أفرط ريبة» [@ibn-al-anbari، ص573]. ويرويها أبو الحَسَن الطُّوسِيّ فيما نقله التِّبْرِيزِيّ، ويجيز في «ريبة» الرفع والنصب [@diwan-labid، ص313]."
