first: "فَإِذَا تَغَالَى لَحْمُهَا فَتَحَسَّرَتْ"
second: "وَتَقَطَّعَتْ بَعْدَ الْكَلَالِ خِدَامُهَا"
meaning: "فإذا ذهب لحمها وارتفع إلى رؤوس عظامها، وانحسر عنها بدنها، وتقطعت بعد الإعياء السيور التي تُشدّ بها نعالها إلى أرساغها، كان لها ما يذكره في البيت التالي. قال الزَّوْزَنِيّ: «يقول: فإذا ارتفع لحمها إلى رءوس عظامها وأعيت وعريت عن اللحم وتقطعت السيور التي تشد بها نعالها إلى أرساغها بعد إعيائها. وجواب إذا في البيت الذي بعده» [@zawzani، ص181]."
vocabulary:
  - term: "تَغَالَى"
    text: "«معناه ذهب وارتفع. وقال الأصمعي: معناه ركب رءوس العظام وذهب ما سوى ذلك» [@ibn-al-anbari، ص540]. وفي لسان العرب: «تَغَالَى لَحْمُها أَي ارْتفَع وصارَ عَلَى رُؤوس العِظام» [@lisan، ج15 ص134]."
  - term: "فَتَحَسَّرَتْ"
    text: "«معناه تحسر عنها البدن» [@ibn-al-anbari، ص540]، أي انكشف عنها لحمها. وعند الزَّوْزَنِيّ: «أي صارت حسيرًا، أي كالّة مُعيية عارية عن اللحم» [@zawzani، ص181]. ونقل لسان العرب عن الأَزْهَرِيّ: «وتَحَسُّرُ لحمِ الْبَعِيرِ أَن يَكُونَ لِلْبَعِيرِ سِمْنَةٌ حَتَّى كَثُرَ شَحْمُهُ وتَمَكَ سَنامُه، فإِذا رُكب أَياماً فَذَهَبَ رَهَلُ لحمه واشتدّ بعد ما تَزَيَّمَ مِنْهُ فِي مَوَاضِعِهِ، فَقَدْ تَحَسَّرَ» [@lisan، ج4 ص190]."
  - term: "الْكَلَالِ"
    text: "الإعياء، وبه فسّره الزَّوْزَنِيّ: «بعد إعيائها» [@zawzani، ص181]."
  - term: "خِدَامُهَا"
    text: "«جمع خدمة، وهي سيور تعقد في الأرساغ ثم تشد إليها النعال إذا رقعت بها الإبل عند الحفا» [@ibn-al-anbari، ص540]. والأرساغ: مفاصل ما بين الكفّ والساق، والحفا: رقّة القدم من كثرة المشي."
syntax:
  - "«إِذَا» ظرف لما يستقبل من الزمان فيه معنى الشرط، وجوابه في البيت التالي: «فَلَهَا هِبَابٌ» [@zawzani، ص181]."
  - "«لَحْمُهَا» فاعل «تَغَالَى». و«تحسرت، فيه ضمير الناقة. والخدام مرتفعة بتقطعت» [@ibn-al-anbari، ص540]: ففاعل «تَحَسَّرَتْ» ضمير يعود على الناقة، و«خِدَامُهَا» فاعل «تَقَطَّعَتْ»."
  - "«بَعْدَ الْكَلَالِ» ظرف متعلق بـ«تَقَطَّعَتْ»، وقد فصل بين الفعل وفاعله."
morphology:
  - "«تَغَالَى» على «تفاعل»، وفي أصله قولان: عند الزَّوْزَنِيّ «من الغلاء وهو الارتفاع، ومنه قولهم: غلا السعر يغلو غلاء، إذا ارتفع» [@zawzani، ص181]؛ وعند ابن الأَعْرابِيّ «تغالى لحمها أصله تغاول فقلب، من قولهم: غاله كذا وكذا، إذا ذهب به» [@ibn-al-anbari، ص540]."
  - "«تَحَسَّرَ» على «تفعّل» من الانحسار، وهو الانكشاف."
  - "«خِدَام» جمع «خِدْمة» عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص540]، وعند الزَّوْزَنِيّ: «جمع خدم، والخدم جمع خدمة» [@zawzani، ص181]، فهو جمع الجمع. و«الكَلَال» مصدر «كلّ يكلّ» إذا أعيا."
rhetoric:
  thesis: "يمضي الشاعر بالناقة إلى أقصى ما تبلغه من الإنهاك، ثم يعلّق الجواب، فيبقى القارئ ينتظر: ماذا يكون منها على هذه الحال؟"
  devices:
    - title: "التدرّج"
      text: "رتّب أحوال الناقة من الأخفى إلى الأظهر: ذهب لحمها «تَغَالَى»، ثم انكشف بدنها «فَتَحَسَّرَتْ»، ثم انقطع ما عليها من سيور «وَتَقَطَّعَتْ ... خِدَامُهَا». فالإعياء يبدأ في الجسد وينتهي فيما يلبسه."
    - title: "الكناية"
      text: "يعرّف عبد القاهر الجُرْجانيّ الكناية بأن «يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود»، «فيومئ به إليهِ، ويجعلهُ دليلاً عليه» [@dalail، ص66]، أي يذكر ما يلزم عن المعنى ليدل به عليه. و«وَتَقَطَّعَتْ ... خِدَامُهَا» من هذا الضرب: لا يقول إن السفر طال، بل يذكر السيور التي بليت وتقطعت، وتقطعها يتبع طول السفر وكثرة الحفا."
    - title: "تعليق الجواب"
      text: "جواب «إِذَا» لا يأتي في هذا البيت. ويسمي النقاد تعلّق البيت بما بعده «التضمين»، وهو عند ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها»، ويعدّه عيبًا يخف «كلما كانت اللفظة المتعلقة بالبيت الثاني بعيدة من القافية»، ويذكر منه بيتين لكَعْب بن زُهَيْر جوابُ «إذا» فيهما في البيت الثاني [@ibn-rashiq، ج1 ص171]. وتعليق الجواب هنا يخدم المعنى: ينتظر القارئ ضعف الناقة، فيأتيه نشاطها."
  connection: "ثم يأتي الجواب: لها مع ذلك نشاط في الزمام، كأنها سحابة خفيفة تسوقها الجنوب [@ibn-al-anbari، ص541]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَإِذَا تَغَا / لَا لَحْمُهَا / فَتَحَسْسَرَتْ = متَفاعلن / مُتْفاعلن / متَفاعلن — وَتَقَطْطَعَتْ / بَعْدَلْ كَلَا / لِ خِدَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الثانية من الصدر والثانية من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "ثاني أبيات الناقة (22–24)، وهو شرط جوابه في البيت التالي. فالبيتان 23–24 جملة واحدة."
variants:
  - reading: "فَإِذَا تَعَالَى لَحْمُهَا"
    status: "رواية أخرى"
    note: "بالعين المهملة، «على إنه تفاعل من العلو» [@ibn-al-anbari، ص540]. وفي لسان العرب: «وَرَوَاهُ ثَعْلَبٌ بِالْعَيْنِ غَيْرِ الْمُعْجَمَةِ» [@lisan، ج15 ص134]."
  - reading: "وَإِذَا تَغَالَى لَحْمُهَا وَتَحَسَّرَتْ"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "بالواو في الموضعين [@zawzani، ص181] [@diwan-labid، ص304]. وفي الجمهرة «فَإِذَا» بالفاء و«وَتَحَسَّرَتْ» بالواو [@jamhara، ص245]."
