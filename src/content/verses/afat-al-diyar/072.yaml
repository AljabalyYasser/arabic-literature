first: "أَنْكَرْتُ بَاطِلَهَا وَبُؤْتُ بِحَقِّهَا"
second: "يَوْمًا وَلَمْ يَفْخَرْ عَلَيَّ كِرَامُهَا"
meaning: "رددتُ ما ادّعوه بالباطل، واعترفت بما كان لهم من حق، فلم يغلبني بالفخر أحد من كرامهم. قال الزَّوْزَنِيّ: «أنكرت باطل دعاوى تلك الرجال الغلب وأقررت بما كان حقها منها عندي، أي في اعتقادي ولم يفخر عليّ كرامها، أي لم يغلبني بالفخر كرامها» [@zawzani، ص197]."
vocabulary:
  - term: "أَنْكَرْتُ بَاطِلَهَا"
    text: "«أنكرت فخر من فخر عليّ بالباطل» [@ibn-al-anbari، ص587]، أي رددته."
  - term: "بُؤْتُ بِحَقِّهَا"
    text: "فيه قولان عند ابن الأَنْبارِيّ: «معناه وانصرفت به»، «وقال أبو عمرو: بؤت معناه اعترفت» [@ibn-al-anbari، ص587]. وفي اللسان: «وباء بدم فلان وبحقه: أقر، وذا يكون أبدا بما عليه لا له» [@lisan، ج1 ص37]."
  - term: "يَفْخَرْ عَلَيَّ"
    text: "يعلو عليّ بالفخر. «وأصل الفخر الارتفاع والتعظيم، يقال (دار فاخرة) أي مرتفعة عظيمة» [@tabrizi-ashr، ص169]."
syntax:
  - "البيت جواب «رُبّ» المقدّرة في «وكثيرة غرباؤها» (البيت 70): «قوله: وكثيرة الواو واو رب وجوابها: أنكرت باطلها» [@khizana، ج9 ص516]. والهاء في «باطلها» و«بحقها» تعود على الخطة عند أبي عَمْرو، وعلى المرتبة عند أبي جَعْفَر [@ibn-al-anbari، ص587]."
  - "«يَوْمًا» ظرف زمان متعلق بـ«بُؤْتُ»."
  - "«ولم يفخر نسق على أنكرت، لأن المستقبل مع لم بتأويل الماضي» [@ibn-al-anbari، ص588]؛ أي المضارع المجزوم بـ«لم» معناه الماضي، فصحّ عطفه على الماضي."
  - "عُدّي «يَفْخَرْ» بـ«على»، وقياسه أن يتعدى بنفسه: «فاخرته ففخرته، أي غلبته بالفخر»، «ولكنه ألحق عليّ حملًا على معنى: ولم يتعالَ عليّ ولم يتكبر عليَّ» [@zawzani، ص197]؛ أي ضُمّن الفعل معنى فعل آخر فأخذ حرفه."
morphology:
  - "«بُؤْتُ» من «باء يبوء» أجوف واوي، و«يقال بؤت بالأمر أبوء به بواء، وأبأت على فلان حقه أبيئه إباءة» [@ibn-al-anbari، ص588]. ولما سكنت الهمزة بإسناده إلى التاء حُذفت عينه، وهي الألف المنقلبة عن الواو، لالتقاء الساكنين، وضُمّت الباء دلالة على الواو، كما في «قُلْتُ»."
  - "«بَاطِل» اسم فاعل من «بطل»، استُعمل اسمًا لما لا حقيقة له."
  - "«كِرام» جمع «كريم» على «فِعال»."
rhetoric:
  thesis: "النصر في المجلس لا يكون بإنكار كل ما عند الخصم، بل بالفصل بين باطله وحقه؛ وبهذا الإنصاف لم يعلُ عليه أحد."
  devices:
    - title: "المقابلة"
      text: "قابل بين «أَنْكَرْتُ» و«بُؤْتُ»، وبين «بَاطِلَهَا» و«بِحَقِّهَا»: إنكار للباطل واعتراف بالحق. والمقابلة: أن يُؤتى بمعنيين ثم بما يقابلهما على الترتيب."
    - title: "الإنصاف"
      text: "يرى إحسان عَبّاس، محقق الديوان، في البيت «استحكام صورة العدالة حتى حين يكون خصمًا»، ويقول: «وإذا فهمنا بؤت بمعنى اعترفت صحّ شيء من العدالة لا نتوقعه في مواقف الفخر الجاهلي» [@diwan-labid، المقدمة ص32]. وعلى المعنى الآخر، «انصرفت به»، يكون الحق حقه هو: «ورجعت بحقها، أي بحقي، لأني فخرت بحق» [@ibn-al-anbari، ص587]."
    - title: "الإيجاز في «لم يفخر عليّ»"
      text: "لم يقل غلبتهم، بل قال: لم يفخر عليّ كرامها. فاكتفى بنفي علوّهم عليه، وترك السامع يستنتج أنه هو الذي علا. ويقول التِّبْرِيزِيّ في معناه: «أي أن فخري ظاهر بيِّن» [@tabrizi-ashr، ص169]."
  connection: "وبعد مقام الملوك ينتقل إلى مقام الكرم: الميسر وجزوره."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَنْكَرْتُ بَا / طِلَهَا وَبُؤْ / تُ بِحَقْقِهَا = مُتْفاعلن / متَفاعلن / متَفاعلن — يَوْمَنْ وَلَمْ / يَفْخَرْ عَلَيْ / يَ كِرَامُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الأولى من الصدر، والأولى والثانية من العَجُز."
context: "ختام مقطع المقام عند الملوك (70–72)، وبه تتم الجملة التي بدأت في البيت 70. فإن صحّ ما قاله الشرّاح من أن المجلس قبة النعمان، فهذا البيت خلاصة ما يُروى من غلبته الرَّبِيعَ بن زِياد."
variants:
  - reading: "عِنْدِي وَلَمْ يَفْخَرْ عَلَيَّ كِرَامُهَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص197]، وذكرها ابن الأَنْبارِيّ: «ويروى: (وبؤت بحقها عندي)» [@ibn-al-anbari، ص587]. وبها متن الديوان [@diwan-labid، ص318]، وأنشده بها صاحب اللسان [@lisan، ج1 ص37] والبَغْداديّ [@khizana، ج9 ص516]. و«عندي» عند الزَّوْزَنِيّ: «أي في اعتقادي» [@zawzani، ص197]."
  - reading: "وَلَمْ تَفْخَرْ عَلَيَّ كِرَامُهَا"
    status: "رواية اللسان"
    note: "بالتاء [@lisan، ج1 ص37]."
