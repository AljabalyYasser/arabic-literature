first: "وَيُكَلِّلُونَ إِذَا الرِّيَاحُ تَنَاوَحَتْ"
second: "خُلُجًا تُمَدُّ شَوَارِعًا أَيْتَامُهَا"
meaning: "وفي الشتاء، حين تتقابل الرياح من كل جهة، يملؤون جفانًا واسعة كالخلجان، وينضدون فوقها اللحم، ويزاد فيها كلما نقصت، فيخوض فيها أيتام الحيّ يأكلون. قال الزَّوْزَنِيّ: «وتلخيص المعنى: ونبذل للمساكين والجيران جفانًا عظامًا مملوءة مرقًا مكلَّلة بكسور اللحم في كَلَب الشتاء وضنك المعيشة» [@zawzani، ص199]، والكَلَب: الشدة."
vocabulary:
  - term: "يُكَلِّلُونَ"
    text: "«التكليل: نضد اللحم بعضه على بعض فوق الجفان» [@ibn-al-anbari، ص591]، والنضد: الرصف."
  - term: "تَنَاوَحَتْ"
    text: "تقابلت، فهبّت الريح من جهة وقابلتها أخرى [@ibn-al-anbari، ص591]. وفي اللسان: «وَالرِّيَاحُ النُّكْبُ فِي الشِّتَاءِ: هِيَ المُتناوِحة، وَذَلِكَ أَنها لَا تَهُبُّ مِنْ جِهَةٍ وَاحِدَةٍ» [@lisan، ج2 ص627]."
  - term: "خُلُجًا"
    text: "«جفانا كالخلج، جمع خليج، وهي تخلج من البحر ليست بمعظمه» [@ibn-al-anbari، ص591]. وفي اللسان: «والخَلِيجُ: الجَفْنَةُ، وَالْجَمْعُ خُلُجٌ» [@lisan، ج2 ص260]."
  - term: "تُمَدُّ"
    text: "«تمد بالطعام، أي يزاد فيها» [@ibn-al-anbari، ص591]."
  - term: "شَوَارِعًا"
    text: "«يشرعون فيها يأكلون» [@ibn-al-anbari، ص591]، من قولهم: «شرع في الماء: خاضه» [@zawzani، ص199]."
syntax:
  - "الواو عاطفة، و«يُكَلِّلُونَ» مضارع مرفوع بثبوت النون، والواو فاعل، و«خُلُجًا» مفعوله: «ونصب (خلجا) بقوله يُكللون» [@tabrizi-ashr، ص171]."
  - "«إِذَا الرِّيَاحُ تَنَاوَحَتْ» ظرف شرطي، و«الرِّيَاحُ» فاعل لفعل محذوف يفسره «تَنَاوَحَتْ»، وجواب «إذا» مفهوم مما قبلها."
  - "«تُمَدُّ» مضارع مبني للمجهول، ونائب فاعله ضمير الخُلُج، وجملته نعت لـ«خُلُجًا». «وشوارعا نصب على الحال من الضمير الذي في تمد من ذكر الخلج. والأيتام رفع بمعنى شوارع» [@ibn-al-anbari، ص591]. وفي شرح التِّبْرِيزِيّ بعد قول ابن كَيْسان بالحال: «والأجود أن يكون منصوبا على إنه نعت لقوله خُلُجا» [@tabrizi-ashr، ص171]."
  - "و«شَوَارِعًا» على «فواعل» ممنوع من الصرف، فنُوّن هنا لإقامة الوزن، كما نُوّن «رَوَاسِيًا» في البيت 71."
morphology:
  - "«يُكَلِّلُونَ» من «كلّل» على «فعّل»، وكأنه من الإكليل: اللحم المنضود فوق الجفنة كالإكليل على الرأس. وهذه قراءتنا."
  - "«تَنَاوَحَ» على «تفاعل» للمشاركة: كل ريح تقابل الأخرى، ومنه سُمّيت النوائح «لأن كل واحدة تقابل صاحبتها» [@ibn-al-anbari، ص591]. وأجاز ابن كَيْسان أن يكون من «نحوت نحوه» على القلب [@tabrizi-ashr، ص171]."
  - "«خُلُج» جمع «خليج» على «فُعُل»، «وأصل الخلج الجذب والصرف» [@ibn-al-anbari، ص591]، فالخليج ماء يُجذب من البحر أو النهر."
  - "«شَوَارِع» جمع «شارعة» على «فواعل»، و«أَيْتام» جمع «يتيم» على «أفعال»."
rhetoric:
  thesis: "الشتاء زمن الجدب، وفيه يظهر الكريم: يطعم الأيتام حتى يخوضوا في الطعام خوضًا."
  devices:
    - title: "الاستعارة"
      text: "«خُلُجًا»: سمّى الجفان خلجانًا، و«شبه ما في الجفان بما في البحر» [@ibn-al-anbari، ص591]، فحذف المشبَّه وهو الجفان وأبقى المشبَّه به. وهي الاستعارة التي يقول عبد القاهر الجُرْجانيّ إنك فيها «تجعل الشيء الشيء ليس به» [@dalail، ص67]."
    - title: "ترشيح الاستعارة"
      text: "«تُمَدُّ» و«شَوَارِعًا»: بعد أن جعل الجفان خلجانًا أتبعها بما يلائم الماء: المدّ، والشروع فيه كما يشرع الوارد في النهر. والترشيح: أن يُذكر بعد الاستعارة ما يلائم المستعار منه، فتقوى الصورة. وهذه قراءتنا."
    - title: "الكناية"
      text: "«إِذَا الرِّيَاحُ تَنَاوَحَتْ» كناية عن الشتاء وشدته، وفي تفسير الزَّوْزَنِيّ: «واختلاف هبوب الرياح» [@zawzani، ص199]. وهي صورة جاهلية للشتاء، أنشد لها ابن الأَنْبارِيّ قول مُتَمِّم بن نُوَيْرة: «نِعْمَ الْقَتِيلُ إِذَا الرِّيَاحُ تَنَاوَحَتْ ... حَوْلَ الْبُيُوتِ قَتَلْتَ يَا ابْنَ الْأَزْوَرِ» [@ibn-al-anbari، ص591]."
  connection: "ومن ضمير الجماعة في «يُكَلِّلُونَ» يخرج إلى الفخر بالقوم صريحًا: «إِنَّا إِذَا الْتَقَتِ الْمَجَامِعُ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَيُكَلْلِلُو / نَ إِذَرْ رِيَا / حُ تَنَاوَحَتْ = متَفاعلن / متَفاعلن / متَفاعلن — خُلُجَنْ تُمَدْ / دُ شَوَارِعَنْ / أَيْتَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "سلم الصدر من الزحاف. ودخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثالثة من العَجُز. وتنوين «شَوَارِعًا» يقيم الوزن."
context: "آخر أبيات الميسر والقِرى (73–77). وفيه يتحول الكلام من المتكلم المفرد («دَعَوْتُ»، «أَدْعُو») إلى الجماعة («يُكَلِّلُونَ»)، فهو جسر إلى مقطع الفخر بالقوم الذي يبدأ بعده. وفي اللسان: «وَقَالَ لَبِيدٌ يَمْدَحُ قَوْمَهُ»، ثم أنشد البيت [@lisan، ج2 ص627]."
