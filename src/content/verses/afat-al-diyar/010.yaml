first: "فَوَقَفْتُ أَسْأَلُهَا وَكَيْفَ سُؤَالُنَا"
second: "صُمًّا خَوَالِدَ مَا يُبِينُ كَلَامُهَا"
meaning: "فوقفت أسأل الديار عن أهلها، ثم رجعت إلى نفسي: وما جدوى أن نسأل صخورًا صلبة باقية لا يُفهم لها كلام؟ قال الزَّوْزَنِيّ: «أي: كيف يجدي هذا السؤال على صاحبه وكيف ينتفع به السائل؟» [@zawzani، ص176]."
vocabulary:
  - term: "صُمًّا"
    text: "«الصخور» [@ibn-al-anbari، ص528]؛ وعند الزَّوْزَنِيّ: «الصم: الصِّلاب، والواحد أصم والواحدة صماء» [@zawzani، ص175]. «ويقال: الصم: الديار» [@ibn-al-anbari، ص528]."
  - term: "خَوَالِدَ"
    text: "«البواقي» [@ibn-al-anbari، ص528]، من الخلود وهو البقاء."
  - term: "مَا يُبِينُ"
    text: "«معناه ما يستبين. يقال أبان الشيء، واستبان، وبان بمعنى واحد» [@ibn-al-anbari، ص528]، أي لا يظهر."
syntax:
  - "«أَسْأَلُهَا» جملة في موضع الحال من فاعل «وَقَفْتُ»، والضمير للديار."
  - "«والسؤال رفع بكيف، والصم نصب بالسؤال» [@ibn-al-anbari، ص529]: فـ«كَيْفَ» خبر مقدم، و«سُؤَالُنَا» مبتدأ مؤخر، و«صُمًّا» مفعول به للمصدر «سُؤَال» لأنه يعمل عمل فعله."
  - "«خَوَالِدَ» صفة لـ«صُمًّا»، و«مَا» نافية، و«كَلَامُهَا» فاعل «يُبِينُ»، والجملة صفة ثانية."
morphology:
  - "«يُبِين» مضارع «أبان» على «أفعل»، وهو هنا لازم بمعنى ظهر. قال الزَّوْزَنِيّ: «وأبان قد يكون بمعنى أظهر ويكون بمعنى ظهر» [@zawzani، ص175]."
  - "«صُمّ» جمع «أصمّ» و«صمّاء» على «فُعْل»، و«خَوَالِد» جمع «خالدة» على «فواعل»."
  - "«سُؤَال» مصدر «سأل» على «فُعال»."
rhetoric:
  thesis: "الوقوف بالأطلال وسؤالها عادة الشعراء، ولَبِيد يقف ويسأل ثم يعترف في الشطر نفسه بأن السؤال لا جواب له."
  devices:
    - title: "الاستفهام الإنكاري"
      text: "«وَكَيْفَ سُؤَالُنَا» استفهام لا يطلب جوابًا بل ينكر جدوى السؤال. ويقول عبد القاهر الجُرْجانيّ في هذا الاستفهام: «فإنَّ الذي هو مَحْضُ المعنى: أَنه لِيَتَنَبَّه السامعُ حتى يَرجعَ إِلى نفسِه فيخجلَ ويرتدعَ ويعيي بالجواب» [@dalail، ص119]. والسامع هنا الشاعر نفسه: يسأل الحجارة ثم يسأل نفسه عن سؤالها."
    - title: "نفي الكلام من أصله"
      text: "«مَا يُبِينُ كَلَامُهَا» لا يعني أن للصخور كلامًا خفيًّا، بل أنها لا كلام لها أصلًا. قال ابن الأَنْبارِيّ: «وحقيقة تأويله: لا كلام لها فيُتبين»، وجعله شبيهًا بقول النابغة «مثلَ الزجاجةِ لم تُكحَل من الرمدِ»، «معناه: إنها لم ترمد فتحتاج إلى أن تكحل» [@ibn-al-anbari، ص528]."
    - title: "الوله في النسيب"
      text: "يرى الزَّوْزَنِيّ أن الشاعر «لوّح إلى أن الداعي إلى هذا السؤال فَرْطُ الكلف والشغف وغاية الوله، وهذا مستحب في النسيب والمرثية؛ لأن الهوى والمصيبة يُدلِّهان» صاحبهما [@zawzani، ص176]. والنسيب: ذكر النساء والشوق في أول القصيدة، ويُدلّهان: يحيّران."
  connection: "ثم يجيب هو نفسه عن سؤاله: عريت الديار، وارتحل أهلها بُكرة [@ibn-al-anbari، ص529]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَوَقَفْتُ أَسْ / أَلُهَا وَكَيْ / فَ سُؤَالُنَا = متَفاعلن / متَفاعلن / متَفاعلن — صُمْمَنْ خَوَا / لِدَ مَا يُبِي / نُ كَلَامُهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار التفعيلةَ الأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "بعد وصف الديار ومطرها ووحشها يقف الشاعر بها، وهو الوقوف الذي تبدأ به القصيدة الجاهلية عادة. ولَبِيد يؤخره إلى البيت العاشر، بعد أن رسم المكان كاملًا."
variants:
  - reading: "سُفْعًا خَوَالِدَ"
    status: "رواية أخرى"
    note: "«والسفعة: سواد إلى الحمرة» [@ibn-al-anbari، ص528]، يريد حجارة الأثافي السود."
  - reading: "مَا يَبِينُ كَلَامُهَا"
    status: "رواية أخرى"
    note: "بفتح الياء، من «بان يبين»، «وهما بمعنى ظهر» [@zawzani، ص176]."
