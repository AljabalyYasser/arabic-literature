first: "مِنْ كُلِّ سَارِيَةٍ وَغَادٍ مُدْجِنٍ"
second: "وَعَشِيَّةٍ مُتَجَاوِبٍ إِرْزَامُهَا"
meaning: "جادها المطر من كل سحابة تسري بالليل، ومن كل سحاب يأتي غدوة مطبقًا على السماء، ومن كل سحابة عشيّة يتجاوب رعدها. وقال الزَّوْزَنِيّ إنه «جمع لها أمطار السنة؛ لأن أمطار الشتاء أكثرها يقع ليلًا، وأمطار الربيع أكثرها يقع غداة، وأمطار الصيف أكثرها يقع عشيًّا؛ كذا زعم مفسرو هذا البيت» [@zawzani، ص173]."
vocabulary:
  - term: "سَارِيَةٍ"
    text: "«سحابة تجيء ليلا. يقال سرى بالليل وأسرى، إذا سار ليلا» [@ibn-al-anbari، ص524]."
  - term: "غَادٍ"
    text: "سحاب «يجيء بالغداة» [@ibn-al-anbari، ص524]، أي في أول النهار."
  - term: "مُدْجِنٍ"
    text: "«من الإدجان، وهو إلباس الغيم» [@ibn-al-anbari، ص524]، أي تغطيته السماء؛ وفي لسان العرب: «وأدجنت السماء: دام مطرها» [@lisan، ج13 ص147]."
  - term: "مُتَجَاوِبٍ إِرْزَامُهَا"
    text: "«الإرزام: تصويتها بالرعد. وإرزام الناقة: حنينها»، «فأراد: لرعدها رزمة، أي صوت كرزمة الناقة على ولدها، وهو حنينها» [@ibn-al-anbari، ص524]. ومتجاوب: يردّ بعضه على بعض."
syntax:
  - "«مِنْ كُلِّ سَارِيَةٍ» متعلق بالفعل «صَابَهَا» في البيت السابق: «ومِن من صلة صابها» [@ibn-al-anbari، ص524]، أي صابها الودق من كل سارية."
  - "«وَغَادٍ» و«وَعَشِيَّةٍ» معطوفان على «سَارِيَةٍ»، و«مُدْجِنٍ» صفة «غَادٍ». و«عَشِيَّةٍ» على تقدير: «وسحابة عشية تتجاوب أصواتها» [@zawzani، ص173]."
  - "«مُتَجَاوِبٍ» صفة «عَشِيَّةٍ» على المعنى، و«إِرْزَامُهَا» فاعل اسم الفاعل «مُتَجَاوِب»، لأنه يعمل عمل فعله."
morphology:
  - "«سَارِيَة» اسم فاعل مؤنث من «سرى»، و«أنث السارية على معنى السحابة» [@ibn-al-anbari، ص524]. و«غَادٍ» اسم فاعل من «غدا»، حذفت ياؤه للتنوين."
  - "«مُدْجِن» اسم فاعل من «أدجن» على «أفعل». و«مُتَجَاوِب» اسم فاعل من «تجاوب» على «تفاعل»، وهو للمشاركة: أصوات يجيب بعضها بعضًا."
  - "«إِرْزَام» مصدر «أرزم» على «إفعال»، يقال: «أرزمت الناقة، إذا حنَّت» [@ibn-al-anbari، ص524]."
rhetoric:
  thesis: "مطر الليل ومطر الغداة ومطر العشي: لم يترك الشاعر ساعة من اليوم إلا جعل فيها سحابًا على الديار."
  devices:
    - title: "الاستعارة"
      text: "الاستعارة: أن يُستعمل اللفظ في غير ما وُضع له لشبه بينهما. وفي «إِرْزَامُهَا» استعار للرعد صوت الناقة تحنّ إلى ولدها. وفي لسان العرب: «شبه رزمة الرعد برزمة الناقة» [@lisan، ج12 ص238]. فالسحاب نوق تحنّ، والديار التي فقدت أهلها يجيئها حنين من السماء."
    - title: "التقسيم"
      text: "قسّم السحاب على أوقات النهار والليل: «سَارِيَةٍ» و«غَادٍ» و«عَشِيَّةٍ». وعلى ما نقله الزَّوْزَنِيّ عن شُرّاح البيت تصير الأوقات الثلاثة فصول السنة كلها [@zawzani، ص173]، فيلتقي البيت بقوله «حِجَجٌ خَلَوْنَ» في البيت 3."
  connection: "ثم يذكر ثمرة هذا المطر: النبت يطول، والظباء والنعام تلد [@ibn-al-anbari، ص524–525]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "مِنْ كُلْلِ سَا / رِيَةِنْ وَغَا / دِنْ مُدْجِنِنْ = مُتْفاعلن / متَفاعلن / مُتْفاعلن — وَعَشِيْيَةِنْ / مُتَجَاوِبِنْ / إِرْزَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار التفعيلتين الأولى والثالثة من الصدر والثالثة من العجز، فصارت «متَفاعلن» «مُتْفاعلن»؛ والإضمار «تسكين الثاني المتحرك» [@atiq، ص59]."
context: "يفصّل البيت ما أجمله البيت السابق من المطر، وهو تمام صورة الأمطار في المطلع."
