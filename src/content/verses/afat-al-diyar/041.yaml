first: "تَجْتَافُ أَصْلًا قَالِصًا مُتَنَبِّذًا"
second: "بِعُجُوبِ أَنْقَاءٍ يَمِيلُ هَيَامُهَا"
meaning: "تدخل البقرة في جوف أصل شجرة مرتفعة الأغصان، منفردة عن غيرها، نابتة في أطراف كثبان من الرمل ينهال رملها الرخو. قال ابن الأَنْبارِيّ: «فيقول: اجتافت شجرا قالص الفرع لا يغطيها وهو متنبذ، أي متفرق، ولا يجتمع أصلاه فيكون أكثف له» [@ibn-al-anbari، ص558]. وقال الزَّوْزَنِيّ: «أنها تستتر من البرد والمطر بأغصان الشجر، ولا تقيها البرد والمطر لتقلصها وتنهال كثبان الرمل عليها مع ذلك» [@zawzani، ص188]."
vocabulary:
  - term: "تَجْتَافُ"
    text: "«تدخل فيه تستكن في جوفه» [@ibn-al-anbari، ص558]."
  - term: "أَصْلًا"
    text: "أصل شجرة. وفي اللسان: «يَصِف بَقَرَةً احْتَفَرَت كِناساً تَكْتَنُّ فِيهِ مِنَ الْمَطَرِ فِي أَصْل أَرطاةٍ» [@lisan، ج1 ص286]. والكِناس: بيت الوحش، والأَرْطاة: شجرة من شجر الرمل."
  - term: "قَالِصًا"
    text: "«أي مرتفعا قد انقلص وليس بمسترسل» [@ibn-al-anbari، ص558]. وعن أبي عَمْرو: «القالص: المتنحى من الشجر» [@ibn-al-anbari، ص559]."
  - term: "مُتَنَبِّذًا"
    text: "«المتنبذ: المتفرق، ويقال هو المتنحى، لأنه من نبذت الشيء، إذا نحيته وطرحته» [@ibn-al-anbari، ص559]."
  - term: "عُجُوبِ"
    text: "«مآخيرها، واحدها عجب؛ وعجب كل شيء: مؤخره» [@ibn-al-anbari، ص559]. وفي اللسان: «وعَجْبُ الكَثِيبِ: آخِرُه المُسْتَدِقُّ مِنْهُ، والجمعُ عُجُوب» [@lisan، ج1 ص582]."
  - term: "أَنْقَاءٍ"
    text: "«جمع نقا، وهو ما ارتفع طولا من الرمل» [@ibn-al-anbari، ص559]."
  - term: "هَيَامُهَا"
    text: "«ما انهار من الرمل ولم يتمالك» [@ibn-al-anbari، ص559]. وفي اللسان: «والهَيَام، بِالْفَتْحِ، مِنَ الرَّمْلِ: مَا كَانَ تُراباً دُقاقاً يابِساً» [@lisan، ج12 ص628]."
syntax:
  - "«وتجتاف موضعه نصب في التأويل على معنى باتت مجتافة أصلا. والباء صلة تجتاف» [@ibn-al-anbari، ص560]: أي جملة «تَجْتَافُ» حال من ضمير «بَاتَتْ» في البيت 40، و«بِعُجُوبِ» متعلق بها."
  - "«قَالِصًا» و«مُتَنَبِّذًا» نعتان لـ«أَصْلًا». وجملة «يَمِيلُ هَيَامُهَا» نعت لـ«أَنْقَاءٍ»، والضمير فيها للأنقاء."
morphology:
  - "«تَجْتَاف» على «تَفْتَعِل» من الجَوف، أصلها «تَجْتَوِف»، قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها. و«الاجتياف: الدخول في جوف الشيء» [@zawzani، ص188]."
  - "«مُتَنَبِّذ» اسم فاعل من «تنبّذ» على «تفعّل»، من النَّبْذ وهو الطرح [@ibn-al-anbari، ص559]."
  - "«أَنْقَاء» جمع «نَقًا» على «أفعال»: «والتثنية نقوان ونقيان، والجموع أنقاء» [@zawzani، ص188]. و«عُجُوب» جمع «عَجْب» على «فُعُول»."
rhetoric:
  thesis: "ملجأ لا يحمي: الشجرة مرتفعة الأغصان فلا تغطيها، منفردة فلا يكثف ظلها، والرمل حولها ينهال. فالبيت يضاعف وحدة البقرة: ابتعدت عن الشجر لتأمن، فبقيت بلا ستر."
  devices:
    - title: "صفات تنقض الملجأ"
      text: "«قَالِصًا مُتَنَبِّذًا»: صفتان تنفيان عن الشجرة ما يُطلب من الملجأ، فلا ظل كثيف ولا جوار. وقد فسّر بعضهم الانفراد بأنها اختارت البعد لتأمن: «والمعنى: إنها متنحية عن معظم الشجر، متنحية عن الطريق لتأمن» [@ibn-al-anbari، ص560]. فهي تشتري الأمن بالبرد."
    - title: "الاستعارة"
      text: "«عُجُوبِ أَنْقَاءٍ»: العَجْب في أصله أصل الذنب، فاستعاره لمؤخر الكثيب: «العجب: أصل الذَّنَب، والمجمع والعجوب فاستعاره لأصل النقا» [@zawzani، ص188]، و«والمجمع» في المطبوع صوابها «والجمع». والاستعارة: أن تريد تشبيه شيء بشيء فتترك لفظ التشبيه وتأتي باسم المشبه به. فالكثيب هنا كأنه حيوان رابض، طرفه المستدق ذنبه."
  connection: "ثم يصف المطر على ظهرها في ليلة غطّى غمامها النجوم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "تَجْتَافُ أَصْ / لَنْ قَالِصَنْ / مُتَنَبْبِذَنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — بِعُجُوبِ أَنْ / قَاءِنْ يَمِي / لُ هَيَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأوليين من الصدر والثانية من العجز."
context: "الثاني من أبيات الليلة الماطرة (40–43) على ترتيب ابن الأَنْبارِيّ. وهو عند الزَّوْزَنِيّ والديوان بعد بيت «يَعْلُو طَرِيقَةَ مَتْنِهَا»، فرقمه عندهما 42 [@zawzani، ص188] [@diwan-labid، ص309]. ويقول محقق الديوان: «هذا البيت متقدم على الذي قبله في رواية التبريزي» [@diwan-labid، ص309]، أي أن ترتيب التِّبْرِيزِيّ كترتيب ابن الأَنْبارِيّ. وعلى هذا الترتيب تحتمي البقرة أولًا ثم يعلوها المطر."
variants:
  - reading: "تَجْتَابُ أَصْلًا قَالِصًا مُتَنَبِّذًا"
    status: "رواية أخرى"
    note: "«ويروى: (تجتاب أصلا) بالباء، أي تدخل البقرة فيه» [@ibn-al-anbari، ص559]، «ويقال معنى قوله تجتاب إنها تحفر أصل الشجرة فتقطع عروقها وتفرق؛ وإنما تفعل ذلك لتوسع لنفسها» [@ibn-al-anbari، ص559]. ويذكرها الزَّوْزَنِيّ: «ويروى تجتاب، بالباء أي تلبس» [@zawzani، ص188]."
  - reading: "يَجْتَافُ آصُلَ قَالِصٍ مُتَبَدِّدٍ"
    status: "رواية الأَصْمَعِيّ"
    note: "«ورواها الاصمعي: (يجتاف آصل قالص متبدد)» [@ibn-al-anbari، ص559]، و«آصُل» جمع أصل كما يقال حَبْل وأَحْبُل [@ibn-al-anbari، ص559]."
  - reading: "يَجْتَابُ أَصْلًا قَالِصًا مُتَنَبِّذًا"
    status: "رواية اللسان"
    note: "وفيه أن الفعل للمطر: «وَمَعْنَى يَجتابُ: يَقْطَع؛ وَمَنْ رَوَى يَجْتافُ، بالفاءِ، فَمَعْنَاهُ يَدْخُلُ؛ يَصِفُ مَطَرًا» [@lisan، ج1 ص582]."
