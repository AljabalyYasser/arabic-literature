    status: "خطأ في نسخة من الصِّحاح"
    note: "ينقل اللسان عن ابن بَرِّيّ أن هذا التركيب في نسخة ابن القَطّاع من «الصِّحاح»، وأنه غلط: «قَالَ: وَهُوَ غَلَطٌ»، فصدره صدر هذا البيت، وعجزه عجز البيت 38 «لِمُعَفَّرٍ قَهْدٍ» [@lisan، ج13 ص417]."
