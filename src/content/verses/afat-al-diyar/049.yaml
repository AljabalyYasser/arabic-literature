first: "حَتَّى إِذَا يَئِسَ الرُّمَاةُ وَأَرْسَلُوا"
second: "غُضْفًا دَوَاجِنَ قَافِلًا أَعْصَامُهَا"
meaning: "حتى إذا يئس الرماة من أن تبلغها سهامهم، أرسلوا عليها كلابًا مسترخية الآذان، معوّدة الصيد، يابسة القلائد. قال ابن الأَنْبارِيّ: «ومعنى بيت لبيد: لما يئس الرماة أن تبلغها سهامهم أرسلوا غضفا، أي كلابا مسترخية الآذان» [@ibn-al-anbari، ص568]."
vocabulary:
  - term: "يَئِسَ"
    text: "على ظاهره من اليأس. وفيه قول آخر: «وقال أبو عبيدة وقطرب: يكون يئس بمعنى علم» [@ibn-al-anbari، ص566]، ونقل ابن الأَنْبارِيّ عن أبي عُبَيْد عن القاسم بن مَعْن: «وهوازن تجعل يئست بمعنى علمت» [@ibn-al-anbari، ص567]، وفي الشرح: «ويجوز أن يكون يئس في بيت لبيد بمعنى علم. يريد: حتى إذا علم الرماة انهم لا ينالونها» [@ibn-al-anbari، ص567]. «وأنكر الكسائي أن يكون يئس بمعنى علم» [@ibn-al-anbari، ص567]."
  - term: "غُضْفًا"
    text: "كلابًا «مسترخية الآذان، واحدها أغضف» [@ibn-al-anbari، ص568]."
  - term: "دَوَاجِنَ"
    text: "«المعودة للصيد» [@ibn-al-anbari، ص568]."
  - term: "قَافِلًا"
    text: "يابسًا. «والقُفول: اليُبوس» [@lisan، ج11 ص561]."
  - term: "أَعْصَامُهَا"
    text: "قلائدها: «قَالَ اللَّيْثُ: أَعْصامُ الكِلابِ عَذَباتُها الَّتِي فِي أَعناقِها» [@lisan، ج12 ص405]. وقال ابن الأَنْبارِيّ: «وإنما جعلها كأنها ربط القرب. وعصام القربة: ما شدت به» [@ibn-al-anbari، ص568]. وللزَّوْزَنِيّ فيها قولان: «أعصامها: بطونها وقيل: بل سواجيرها وهي قلائدها» [@zawzani، ص191]."
syntax:
  - "«وجواب حتى إذا (أرسلوا) ، والواو مقحمة» [@ibn-al-anbari، ص568]، أي زائدة، كما في قوله تعالى ﴿حَتَّى إِذَا جَاءُوهَا وَفُتِحَتْ أَبْوَابُهَا﴾. «وقال بعض النحويين: أرسلوا نسق على يئس، والجواب محذوف» [@ibn-al-anbari، ص568]، وتقديره عندهم: ظفروا ولحقوا."
  - "«غُضْفًا» مفعول به لـ«أَرْسَلُوا»، و«دَوَاجِنَ» نعت له، و«قَافِلًا» نعت ثانٍ، و«أَعْصَامُهَا» فاعل «قَافِلًا» لأنه اسم فاعل."
morphology:
  - "«غُضْف» جمع «أَغْضَف» و«غَضْفاء» على «فُعْل»: «يقال: كلب أغضف وكلبة غضفاء» [@zawzani، ص190]."
  - "«أَعْصَام» مختلف في مفرده: «وقال بعض النحويين: واحد الأعصام عصام، وقال: هو جمع على غير قياس. وقال غيره: واحد الأعصام عصم» [@ibn-al-anbari، ص568]. وفي اللسان أن واحدها «عِصْمة ثُمَّ جُمِعَتْ عَلَى عِصَم، ثُمَّ جُمِعَ عِصَم عَلَى أَعْصام» [@lisan، ج11 ص561]، فهو جمع الجمع."
  - "«دَوَاجِن» جمع «داجِن» على «فواعل»، ممنوع من الصرف. و«قَافِل» اسم فاعل من «قفَل يقفِل» إذا يبس [@lisan، ج11 ص561]."
rhetoric:
  thesis: "الرماة يفشلون فتأتي الكلاب. والبيت يُري السامعَ الكلاب قبل أن تعدو: آذان مسترخية، وأعناق مطوّقة بقلائد يابسة، أي كلاب قديمة في الصيد."
  devices:
    - title: "الإيجاز بالحذف"
      text: "«وَأَرْسَلُوا»: إن كانت الواو عاطفة فجواب «إذا» محذوف، كما قال بعض النحويين فيما نقله ابن الأَنْبارِيّ: «فحذف الجواب لمعرفة المخاطبين به» [@ibn-al-anbari، ص568]. وحذف الجواب يترك الصيد معلّقًا، فيعرف السامع ما سيكون قبل أن يُقال له."
    - title: "الكناية"
      text: "«قَافِلًا أَعْصَامُهَا»: يبس القلائد كناية عن طول استعمالها، أي أن الكلاب ألفت الصيد منذ زمن، وهو ما صرّح به في «دَوَاجِنَ». والكناية: أن تذكر شيئًا وتريد لازمه. وهذه قراءتنا."
  connection: "ثم تلحق الكلاب البقرة، فتكرّ عليها بقرن كالرمح."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "حَتْتَى إِذَا / يَئِسَ رْرُمَا / ةُ وَأَرْسَلُو = مُتْفاعلن / متَفاعلن / متَفاعلن — غُضْفَنْ دَوَا / جِنَ قَافِلَنْ / أَعْصَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأولى والثالثة من العجز."
context: "السادس من أبيات الصباح والرماة والكلاب (44–52). وهي ثالثة «حَتَّى إِذَا» في الحكاية (44، 46، 49)، وكل واحدة منها تنقل البقرة إلى طور أشد."
