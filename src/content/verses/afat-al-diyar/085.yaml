first: "وَإِذَا الْأَمَانَةُ قُسِّمَتْ فِي مَعْشَرٍ"
second: "أَوْفَى بِأَعْظَمِ حَقِّنَا قَسَّامُهَا"
meaning: "وإذا قُسّمت الأمانة بين القبائل، أعطانا قاسمها أعظم نصيب منها، فنحن أوفى الناس أمانة. قال الزَّوْزَنِيّ: «يقول: وإذا قسمت الأمانات بين الأقوام وفر وكمل من الأمانة أي نصيبنا الأكثر منها» [@zawzani، ص201]. والقاسم عند التِّبْرِيزِيّ هو الله: «ويريد بقوله (أوفى بأفضل حظنا قسَّامها) الله عز وجل، كأنه يصف ما فُضِّلُوا به» [@tabrizi-ashr، ص174]."
vocabulary:
  - term: "الْأَمَانَةُ"
    text: "ضد الخيانة: حفظ ما ائتُمن عليه المرء والوفاء به."
  - term: "مَعْشَرٍ"
    text: "«معشر: قوم» [@zawzani، ص201]."
  - term: "أَوْفَى"
    text: "«معناه ارتفع. ويقال معناه وفى الذي يقسم لنا وأعطانا أعظم الحظ» [@ibn-al-anbari، ص595]. وفي اللسان: «وأَوْفَى عَلَى الشَّيْءِ أَي أَشْرَفَ» [@lisan، ج15 ص399]، و«ووفَّى الكيلَ وأَوفاه: أَتَمَّه» [@lisan، ج15 ص400]."
  - term: "قَسَّامُهَا"
    text: "قاسمها، والضمير للأمانة."
syntax:
  - "«وَإِذَا» ظرف شرطي، و«الْأَمَانَةُ» نائب فاعل لفعل محذوف يفسره «قُسِّمَتْ». وجواب الشرط «أَوْفَى ... قَسَّامُهَا»."
  - "«بِأَعْظَمِ حَقِّنَا» متعلق بـ«أَوْفَى»، و«قَسَّامُهَا» فاعل «أَوْفَى». وعلى رواية الزَّوْزَنِيّ الباء زائدة: «والباء في قوله بأوفر زائدة أي: أوفى أوفر حظّنا» [@zawzani، ص201]، أي أتمّ لنا أوفر الحظ."
morphology:
  - "«قُسِّمَتْ» ماضٍ مبني للمجهول من «قسّم» على «فعّل»، وهو والمخفّف بمعنى عند الزَّوْزَنِيّ: «قسّم وقسَم. بالتشديد والتخفيف واحد» [@zawzani، ص201]."
  - "«أَوْفَى» على «أفعل» من «وفى»، و«يقال وفيت وأوفيت» [@ibn-al-anbari، ص595]."
  - "«أَعْظَم» اسم تفضيل، و«قَسّام» على «فعّال» للمبالغة، و«أَمانة» مصدر على «فَعالة»."
rhetoric:
  thesis: "الأمانة رزق يُقسم كما تُقسم الأرزاق، ونصيب قوم لبيد منها أعظم الأنصبة."
  devices:
    - title: "الاستعارة"
      text: "«الْأَمَانَةُ قُسِّمَتْ»: جعل الأمانة، وهي خُلُق، شيئًا يُقسم بين القبائل كما يُقسم المال أو لحم الجزور، فلكل قوم منه حظ. وهذه قراءتنا."
    - title: "إبهام القاسم"
      text: "«قَسَّامُهَا»: لم يسمّ القاسم، وجعله التِّبْرِيزِيّ الله. وعلى ترتيب ابن الأَنْبارِيّ يأتي البيت بعد «فَاقْنَعْ بِمَا قَسَمَ الْمَلِيكُ»، فيُفهم القاسم من البيت السابق."
    - title: "المبالغة"
      text: "«بِأَعْظَمِ حَقِّنَا»: اسم تفضيل، وفي الروايات «بأوفر» و«بأفضل» و«بأعظم حظنا»، وكلها تفضيل. فالرواة اختلفوا في اللفظ واتفقوا على المبالغة."
  connection: "ثم يعدّد ما يقوم به قومه للعشيرة: السعي في الصلح، والفروسية، والحكم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَإِذَلْ أَمَا / نَةُ قُسْسِمَتْ / فِي مَعْشَرِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — أَوْفَى بِأَعْ / ظَمِ حَقْقِنَا / قَسْسَامُهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز."
context: "ثامن أبيات الفخر بالقوم على ترتيب ابن الأَنْبارِيّ، وهو 84 عند الزَّوْزَنِيّ والديوان [@zawzani، ص201] [@diwan-labid، ص321]. ويتابع فكرة القسمة: بعد قسمة الله الخلائق بين الناس يذكر نصيب قومه من الأمانة."
variants:
  - reading: "أَوْفَى بِأَوْفَرِ حَظِّنَا قَسَّامُهَا"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "[@zawzani، ص201] [@diwan-labid، ص321]، ويذكرها ابن الأَنْبارِيّ: «ويروى: (بأوفر حظنا)» [@ibn-al-anbari، ص595]. وأوفر الحظ: «أي بأكثره» [@zawzani، ص201]."
  - reading: "أَوْفَى بِأَعْظَمِ حَظِّنَا قَسَّامُهَا"
    status: "رواية الجمهرة والتِّبْرِيزِيّ"
    note: "[@jamhara، ص268] [@tabrizi-ashr، ص174]."
  - reading: "أَوْفَى بِأَفْضَلِ حَظِّنَا قَسَّامُهَا"
    status: "رواية أخرى"
    note: "«ويروى (بأفضل حظِّنَا)» [@tabrizi-ashr، ص174]، ويذكرها الديوان [@diwan-labid، ص321]."
