first: "فَالضَّيْفُ وَالْجَارُ الْغَرِيبُ كَأَنَّمَا"
second: "هَبَطَا تَبَالَةَ مُخْصِبًا أَهْضَامُهَا"
meaning: "فالضيف النازل بي والجار الغريب عن أهله يجدان عندي من الخصب ما يجده من نزل وادي تَبالة حين تخصب أرضه المطمئنة. قال ابن الأَنْبارِيّ: «يقول: فإذا نزل بهم الضيف صادف عندهم من الخصب والفواكه والرطب ما يصادفه بتبالة إذا هبطها. وإنما يعنى نفسه، أي إذا نزلا علىّ» [@ibn-al-anbari، ص589]. وقال الزَّوْزَنِيّ: «شبه ضيفه وجاره في الخصب والسعة بنازل هذا الوادي أيام الربيع» [@zawzani، ص198]."
vocabulary:
  - term: "الْغَرِيبُ"
    text: "الذي ليس من الحي. ويروى «الجنيب» بمعناه، وهو «الغريب، وهو بمنزلة الجانب والجنب» [@ibn-al-anbari، ص589]."
  - term: "هَبَطَا"
    text: "نزلا، وفي تفسير الزَّوْزَنِيّ: «كأنهم نازلون هذا الوادي» [@zawzani، ص198]."
  - term: "تَبَالَةَ"
    text: "«واد مخصب من أودية اليمن» [@zawzani، ص198]، وعند ابن الأَنْبارِيّ: «وتبالة قريبة من الطائف، وهي مخصبة» [@ibn-al-anbari، ص589]."
  - term: "مُخْصِبًا"
    text: "كثير الخِصب، أي النبات والخير. وفي اللسان: «وأَخْصَبَ القومُ: نَالُوا الخِصْبَ، وَصَارُوا إِلَيْهِ» [@lisan، ج1 ص356]."
  - term: "أَهْضَامُهَا"
    text: "«بطون منهضمة، واحدها هضم، وفيها نخل كثير» [@ibn-al-anbari، ص589]، أي أرض مطمئنة. وفي اللسان: «وأَهْضَامُ تَبالةَ: مَا اطمأَنَّ مِنَ الأَرض بَيْنَ جِبالها» [@lisan، ج12 ص616]."
syntax:
  - "الفاء في «فَالضَّيْفُ» تربط ما بعدها بما قبلها: بعد النحر والبذل يأتي حال من يأكل. و«الضَّيْفُ» مبتدأ، و«وَالْجَارُ» معطوف عليه، و«الْغَرِيبُ» نعت للجار."
  - "«كَأَنَّمَا»: «كأنّ» كفّتها «ما» عن العمل فدخلت على الجملة الفعلية «هَبَطَا تَبَالَةَ»، والجملة خبر المبتدأ. والألف في «هَبَطَا» ضمير الاثنين: الضيف والجار."
  - "«تَبَالَةَ» مفعول به لـ«هَبَطَا»، منصوب بالفتحة بلا تنوين. «ومخصبا نصب على الحال من تبالة، والأهضام رفع بمعنى مخصب» [@ibn-al-anbari، ص589]، أي «أَهْضَامُهَا» فاعل لاسم الفاعل «مُخْصِبًا»؛ ولذلك ذُكّر «مُخْصِبًا» وتبالة مؤنثة، لأنه وصف لأهضامها في المعنى."
morphology:
  - "«تَبَالَة» علم على موضع مؤنث، فهو ممنوع من الصرف للعلمية والتأنيث."
  - "«أَهْضام» جمع «هضم» على «أفعال»، ويجمع أيضًا على «هضوم»: «الهضيم المطمئن من الأرض، والجمع الأهضام والهضوم» [@zawzani، ص198]."
  - "«مُخْصِب» اسم فاعل من «أخصب» على «أفعل». و«هَبَطَا» ماضٍ مسند إلى ألف الاثنين من «هبط يهبط»."
rhetoric:
  thesis: "يضع لبيد ضيفه في أخصب وادٍ يعرفه العرب، ليقول إن بيته لا يعرف الجدب."
  devices:
    - title: "التمثيل"
      text: "«كَأَنَّمَا هَبَطَا تَبَالَةَ مُخْصِبًا أَهْضَامُهَا»: شبّه حال الضيف عنده بحال من نزل واديًا خصيبًا، والشبه لا يُرى بالعين كاللون والشكل، بل يُدرك بالنظر: سعة وأمن وشبع. وعبد القاهر الجُرْجانيّ يقسم التشبيه ضربين: «أحدهما أن يكون من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل، والآخر أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، والثاني عنده هو التمثيل، و«التمثيل أخصّ منه، فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. والتأوّل: أن يُستخرج وجه الشبه بالنظر لا بالحس."
    - title: "الكناية"
      text: "ذكر الضيف والجار وما يلقيان، وأراد كرم نفسه، قال ابن الأَنْبارِيّ: «وإنما يعنى نفسه» [@ibn-al-anbari، ص589]. فهي كناية عن الصفة بأثرها في الناس. والكناية: أن تذكر شيئًا وتريد لازمه."
    - title: "اختيار المشبَّه به"
      text: "«تَبَالَةَ» وادٍ يُضرب به المثل في الخصب والقِرى، ومن الأمثال: «ما نزلت تبالة لتحرم الأضياف» [@ibn-al-anbari، ص589]. وخصّ الأهضام دون غيرها، قال التِّبْرِيزِيّ: «وخص ما تطامن من الأرض لأن السيل إليه أوصل فهو أخصب» [@tabrizi-ashr، ص170]."
  connection: "ومن الضيف والجار إلى أضعف الناس: المرأة الفقيرة التي تأوي إلى أطناب بيته."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "فَضْضَيْفُ وَلْ / جَارُلْ غَرِي / بُ كَأَنْنَمَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن — هَبَطَا تَبَا / لَةَ مُخْصِبَنْ / أَهْضَامُهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلتين الأولى والثانية من الصدر، والثالثة من العَجُز."
context: "ثالث أبيات الميسر والقِرى (73–77): بعد أن ذكر النحر ذكر من يأكل منه. وقرن الضيف بالجار الغريب لأن كليهما بعيد عن أهله، لا يجد مأوى إلا عند من نزل به. والقِرى: إطعام الضيف."
variants:
  - reading: "فَالضَّيْفُ وَالْجَارُ الْجَنِيبُ كَأَنَّمَا"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "[@zawzani، ص198] [@diwan-labid، ص318]. ويذكرها ابن الأَنْبارِيّ [@ibn-al-anbari، ص589] والتِّبْرِيزِيّ [@tabrizi-ashr، ص170]، وبها أنشده صاحب اللسان [@lisan، ج12 ص616]. والجنيب: الغريب."
