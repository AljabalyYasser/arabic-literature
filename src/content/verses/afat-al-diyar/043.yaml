first: "وَتُضِيءُ فِي وَجْهِ الظَّلَامِ مُنِيرَةً"
second: "كَجُمَانَةِ الْبَحْرِيِّ سُلَّ نِظَامُهَا"
meaning: "وهي مع ذلك تضيء في أول الظلام لشدة بياضها، كأنها حبة لؤلؤ انقطع سلكها فسقطت تتلألأ. قال ابن الأَنْبارِيّ: «ومعنى البيت أن هذه البقرة كلما تحركت في الليل اشرق لونها، فهي كالدرة التي انقطع سلكها فسقطت» [@ibn-al-anbari، ص562]."
vocabulary:
  - term: "وَجْهِ الظَّلَامِ"
    text: "«ووجه الظلام: أوله، وكذلك وجه النهار» [@ibn-al-anbari، ص561]."
  - term: "مُنِيرَةً"
    text: "«مضيئة» [@ibn-al-anbari، ص561]."
  - term: "جُمَانَةِ"
    text: "عند ابن الأَنْبارِيّ «خريزة تعمل من فضة» [@ibn-al-anbari، ص561]، وعن أبي عَمْرو: «أراد اللؤلؤة، فشبه البقرة بها في بياضها» [@ibn-al-anbari، ص562]. وقال الزَّوْزَنِيّ: «درة مصوغة من الفضة، ثم يستعاران للدرة، وأصله فارسي معرب» [@zawzani، ص188]."
  - term: "الْبَحْرِيِّ"
    text: "الصدف أو الغوّاص: «كدرة الصدف البحري أو الرجل البحري» [@zawzani، ص188]."
  - term: "نِظَامُهَا"
    text: "«معناه خيطها» [@ibn-al-anbari، ص561]."
syntax:
  - "«ومنيرة نصب على الحال مما في يضيء، والكاف منصوبة لمنيرة على النعت» [@ibn-al-anbari، ص562]: «مُنِيرَةً» حال من ضمير «تُضِيءُ»، و«كَجُمَانَةِ» متعلق بها."
  - "الواو في «وَتُضِيءُ» عاطفة على «تَجْتَافُ». وجملة «سُلَّ نِظَامُهَا» نعت لـ«جُمَانَةِ»، و«نِظَامُهَا» نائب فاعل."
morphology:
  - "«تُضِيءُ» و«مُنِيرَة» من «أفعل»، وهما لازمان هنا: «الإضاءة والإنارة: يتعدى فعلهما ويلزم، وهما لازمان في البيت» [@zawzani، ص188]."
  - "«جُمَانَة» واحدة «الجُمان»، اسم جنس جمعي يُفرَّق بينه وبين واحده بالتاء."
  - "«سُلَّ» ماضٍ مبني للمجهول من «سلّ» المضعّف. و«البَحْرِيّ» منسوب إلى البحر بياء النسب."
rhetoric:
  thesis: "في وسط الليل المطير يضيء جسد البقرة. والتشبيه يقلب المشهد: الظلام والمطر كانا علامة شقاء، فإذا البقرة فيهما جوهرة."
  devices:
    - title: "التشبيه المركّب"
      text: "«كَجُمَانَةِ الْبَحْرِيِّ سُلَّ نِظَامُهَا»: لا يشبّه لون البقرة بلون اللؤلؤة وحده، بل هيئة كاملة: حبة بيضاء انفلتت من خيطها فهي تلمع وهي تتحرك. قال الزَّوْزَنِيّ: «وإنما خص ما يسل نظامها إشارة إلى أنها تعدو ولا تستقر كما تتحرك وتنتقل الدرة التي سلّ نظامها» [@zawzani، ص188]. والتشبيه المركب: ما يُؤخذ فيه وجه الشبه من هيئة مجتمعة من عدة أشياء، لا من صفة واحدة."
    - title: "مأخذ اللغويين والجواب عنه"
      text: "في اللسان أن لبيدًا أخطأ في «جُمَانَةِ الْبَحْرِيِّ»، لأن الجُمان حبّ من فضة على هيئة اللؤلؤ: «وتوهَّمَه لبيدٌ لُؤلُؤَ الصدفِ البَحْرِيِّ» [@lisan، ج13 ص92]. ويجيب عن ذلك ما ينقله الديوان عن أبي الحَسَن الطُّوسِيّ فيما رواه التِّبْرِيزِيّ: «إنما خص جمانة الغواص لأنها قد تعمل من فضة» [@diwan-labid، ص310]، أي أنه نسبها إلى البحر ليبيّن أنه يريد اللؤلؤة الحقيقية لا حبّة الفضة."
  connection: "ثم يطلع الصبح فتبكّر البقرة، وقوائمها تنزلق على التراب المبتل."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَتُضِيءُ فِي / وَجْهِ ظْظَلَا / مِ مُنِيرَتَنْ = متَفاعلن / مُتْفاعلن / متَفاعلن — كَجُمَانَةِ لْ / بَحْرِيْيِ سُلْ / لَ نِظَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر والثانية من العجز."
context: "آخر أبيات الليلة الماطرة (40–43). تنتهي الليلة بصورة ضوء، ثم يبدأ الصباح ومعه الخطر."
