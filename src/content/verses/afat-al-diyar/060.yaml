first: "بَاكَرْتُ حَاجَتَهَا الدَّجَاجَ بِسُحْرَةٍ"
second: "لِأَعِلَّ مِنْهَا حِينَ هَبَّ نِيَامُهَا"
meaning: "بادرتُ صياح الديكة في السَّحَر إلى حاجتي من الخمر، لأشرب منها مرة بعد مرة حين يستيقظ النائمون. قال ابن الأَنْبارِيّ: «وقوله (باكرت حاجتها) معناه حاجتي في الخمر» [@ibn-al-anbari، ص577]، و«(حين هب نيامها) معناه حين انتبه نيامها. يعنى إنه ذهب بليل» [@ibn-al-anbari، ص578]."
vocabulary:
  - term: "بَاكَرْتُ"
    text: "بادرتُ في البُكرة، أي سبقتُ."
  - term: "الدَّجَاجَ"
    text: "«أراد الديوك. أي بادرت صياحها» [@ibn-al-anbari، ص577]. وقال الزَّوْزَنِيّ: «والدجاج اسم للجنس يعم ذكوره وإناثه» [@zawzani، ص194]. وفي اللسان: «أَنَّهُ أَراد الدِّيكَ وصَقِيعَه فِي سُحْرَةٍ» [@lisan، ج2 ص264]، والصَّقيع هنا صياح الديك."
  - term: "سُحْرَةٍ"
    text: "«والسحرة والسحر بمعنى» [@zawzani، ص194]، وهو آخر الليل قبيل الفجر."
  - term: "لِأَعِلَّ"
    text: "«لأروى نفسي. والعلل: الشرب الثاني» [@ibn-al-anbari، ص577]."
  - term: "هَبَّ"
    text: "انتبه من نومه [@ibn-al-anbari، ص578]."
syntax:
  - "«حَاجَتَهَا» مفعول به لـ«بَاكَرْتُ»، والضمير للخمر. و«الدَّجَاجَ» منصوب على الظرف: «وقال بعض أهل اللغة: نصب الدجاج على الوقت، أراد: في وقت صياح الدجاج. فأقام الدجاج مقام الصياح فنصبه» [@ibn-al-anbari، ص577]، «والناصب له باكرت» [@ibn-al-anbari، ص578]."
  - "اللام في «لِأَعِلَّ» للتعليل، والفعل منصوب بـ«أن» مضمرة. و«حِينَ» ظرف مضاف إلى جملة «هَبَّ نِيَامُهَا»، و«نِيَامُهَا» فاعل."
morphology:
  - "«بَاكَرْتُ» على «فاعلت» من البُكرة."
  - "«أَعِلّ» مضارع «علّ» المضعّف، وفي حركة عينه لغتان: «وتميم تضم المستقبل فتقول عل يعُل، وقيس تكسر فتقول علَّ يعلّ» [@ibn-al-anbari، ص577]."
  - "«نِيَام» جمع «نائم» على «فِعال». و«الدَّجَاج» اسم جنس واحده «دجاجة»، «وجمع الدجاج دُجُج» [@zawzani، ص194]."
rhetoric:
  thesis: "يشرب قبل أن يستيقظ الناس، فهو يسبق الديك نفسه. والبيت يُري لهوه مرتّبًا: شرب أول في السَّحَر، ثم شرب ثانٍ حين يهبّ النيام."
  devices:
    - title: "المجاز بالحذف"
      text: "«بَاكَرْتُ ... الدَّجَاجَ»: لم يبادر الديكة بل بادر صياحها، فحذف المضاف وأقام المضاف إليه مقامه، كما قال بعض أهل اللغة فيما نقله ابن الأَنْبارِيّ «فأقام الدجاج مقام الصياح». ويستشهد اللسان بالبيت في نظير ذلك: «فأَقام الِاسْمَ مُقام الْمَصْدَرِ كَمَا قَالَ لَبِيدٌ» [@lisan، ج9 ص141]."
    - title: "الإضافة لأدنى ملابسة"
      text: "«حَاجَتَهَا»: أضاف الحاجة إلى الخمر، وهي حاجته هو، لأن الخمر موضوعها، كما فسّرها ابن الأَنْبارِيّ «حاجتي في الخمر». والإضافة لأدنى ملابسة: أن يُضاف الشيء إلى ما بينه وبينه أدنى صلة."
  connection: "ثم يذكر غداة ريح باردة أطعم فيها الناس، وقد صار زمامها بيد ريح الشمال."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "بَاكَرْتُ حَا / جَتَهَا دْدَجَا / جَ بِسُحْرَتِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — لِأَعِلْلَ مِنْ / هَا حِينَ هَبْ / بَ نِيَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والثانية من العجز."
context: "السادس من أبيات خطاب نَوار (55–62) على ترتيب ابن الأَنْبارِيّ. وترتيب الأبيات 60–62 عند الزَّوْزَنِيّ والديوان: «وَصَبُوحِ صَافِيَةٍ» ثم «بَاكَرْتُ» ثم «وَغَدَاةِ رِيحٍ»، فهذا البيت 61 عندهما [@zawzani، ص194] [@diwan-labid، ص315]. ويذكر ابن الأَنْبارِيّ هذا الترتيب عن غيره: «وروى بعض الرواة: (وصبوح صافية) وروى بعده: (باكرت حاجتها الدجاج) وروى بعد باكرت: (وغداة ريح)» [@ibn-al-anbari، ص580]."
variants:
  - reading: "بَادَرْتُ حَاجَتَهَا الدَّجَاجَ بِسُحْرَةٍ"
    status: "رواية الديوان"
    note: "ويذكر فيه «باكرت» و«بادرت لذتها» روايتين [@diwan-labid، ص315]."
  - reading: "بَادَرْتُ لَذَّتَهَا الدَّجَاجَ بِسُحْرَةٍ"
    status: "رواية أخرى"
    note: "«ويروى: (بادرت لذتها)» [@ibn-al-anbari، ص577]."
  - reading: "لِأُعَلَّ مِنْهَا حِينَ هَبَّ نِيَامُهَا"
    status: "رواية الزَّوْزَنِيّ والديوان"
    note: "بالبناء للمجهول، أي لأُسقى: «لأسقى منها مرة بعد أخرى حين استيقظ نيام السحرة» [@zawzani، ص194] [@diwan-labid، ص315]."
  - reading: "لِأَعِلَّ مِنْهَا أَنْ يَهُبَّ نِيَامُهَا"
    status: "رواية أخرى"
    note: "«ويروى: (أن يهب)» [@ibn-al-anbari، ص577]، ويذكرها الديوان [@diwan-labid، ص315]."
