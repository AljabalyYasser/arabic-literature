first: "وَلَقَدْ حَمَيْتُ الْحَيَّ تَحْمِلُ شِكَّتِي"
second: "فُرُطٌ وِشَاحِي إِذْ غَدَوْتُ لِجَامُهَا"
meaning: "ولقد منعتُ قبيلتي من عدوها، وسلاحي على فرس سريعة تسبق الخيل، وقد جعلتُ لجامها على عاتقي كالوشاح حين خرجت في أول النهار. قال الزَّوْزَنِيّ: «يريد أنه يلقي لجام الفرس على عاتقه ويخرج منه يده حتى يصير بمنزلة الوشاح»، ليكون متهيئًا لركوبها إذا ارتفع صراخ [@zawzani، ص195]."
vocabulary:
  - term: "حَمَيْتُ الْحَيَّ"
    text: "«معناه منعتهم» [@ibn-al-anbari، ص580]. والحيّ: القبيلة، وفي تفسير الزَّوْزَنِيّ: «ولقد حميت قبيلتي» [@zawzani، ص195]."
  - term: "شِكَّتِي"
    text: "«سلاحي» [@ibn-al-anbari، ص580]."
  - term: "فُرُطٌ"
    text: "«فرس متقدمة» [@ibn-al-anbari، ص580]، وهي عند الزَّوْزَنِيّ «الفرس المتقدمة السريعة الخفيفة» [@zawzani، ص195]. وفي اللسان: «الفرس السريعة التي تتفرّط الخيل أي تتقدّمها» [@lisan، ج7 ص368]."
  - term: "وِشَاحِي"
    text: "الوشاح ما يُلقى على العاتق ويُخرج منه اليد. قال ابن الأَنْبارِيّ: «وتوشحه إياه: أن يلقيه على عاتقه ويخرج يديه منه» [@ibn-al-anbari، ص580]."
  - term: "غَدَوْتُ"
    text: "خرجت غُدوة، أي أول النهار."
syntax:
  - "اللام في «وَلَقَدْ» واقعة في جواب قسم مقدّر، و«قد» مع الماضي للتحقيق. و«الْحَيَّ» مفعول به لـ«حَمَيْتُ»."
  - "«تحمل موضعه رفع في اللفظ بالتاء، ونصب في التأويل على الحال من التاء. وفرط رفع بتحمل» [@ibn-al-anbari، ص580]؛ أي «تَحْمِلُ» مضارع مرفوع، وجملته حال من تاء «حَمَيْتُ»، و«فُرُطٌ» فاعل «تَحْمِلُ»، و«شِكَّتِي» مفعوله."
  - "«وِشَاحِي ... لِجَامُهَا» جملة اسمية: «والوشاح رفع باللجام» [@ibn-al-anbari، ص580]، فأحدهما مبتدأ والآخر خبره، والجملة حال ثانية بلا واو. و«إِذْ غَدَوْتُ» ظرف اعترض بين ركني الجملة."
morphology:
  - "«شِكَّة» على «فِعْلة»، اسم لجملة السلاح."
  - "«فُرُط» على «فُعُل» وصف للفرس، من «فَرَط» إذا تقدّم وسبق؛ ومنه «افترط إليه في هذا الأمر: تقدّم وسبق» [@lisan، ج7 ص368]."
  - "«الوشاح والإشاح بمعنى، والجمع الوُشُح» [@zawzani، ص195]: الواو المكسورة في أول الكلمة تُقلب همزة."
  - "«حَمَيْتُ» من «حمى يحمي» على «فعَل يفعِل»، وأصل الياء فيه لام الفعل."
rhetoric:
  thesis: "ينتقل لَبِيد من لهو الليالي إلى البأس، فيقدّم نفسه حارسًا لقومه لا يفارق فرسه ولا سلاحه."
  devices:
    - title: "القسم والتحقيق"
      text: "«وَلَقَدْ»: لام القسم و«قد» معًا، فالخبر يُلقى مؤكدًا كأنه شهادة يحلف عليها. وبهذا التوكيد يفتتح لبيد باب الفخر بالبأس."
    - title: "التشبيه البليغ"
      text: "«وِشَاحِي ... لِجَامُهَا»: لم يقل إن اللجام كالوشاح، بل جعل اللجام وشاحه نفسه. وهذا عند عبد القاهر الجُرْجانيّ مما يُجري فيه الشاعر اسم المشبَّه به خبرًا على المشبَّه، فهو «تشبيه على حدّ المبالغة» ولا يسمّى استعارة [@dalail، ص68]. والتشبيه: أن يُلحق شيء بشيء في صفة."
    - title: "الكناية"
      text: "توشّح اللجام كناية عن دوام الاستعداد للحرب، لأن «الفرسان كان أحدهم يتوشح اللجام ليكون ساعة يفزع قريبا منه» [@ibn-al-anbari، ص580]. والكناية: أن تذكر شيئًا وتريد لازمه."
    - title: "الصفة في موضع الموصوف"
      text: "قال «فُرُطٌ» ولم يقل فرس؛ فاكتفى بالصفة التي يفخر بها، وهي السبق، عن اسم الدابة."
  connection: "ثم يصعد مرقبًا عاليًا يحرس منه أصحابه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَلَقَدْ حَمَيْ / تُلْحَيْيَ تَحْ / مِلُ شِكْكَتِي = متَفاعلن / مُتْفاعلن / متَفاعلن — فُرُطُنْ وِشَا / حِي إِذْ غَدَوْ / تُ لِجَامُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو تسكين الثاني المتحرك، فصارت «متَفاعلن» «مُتْفاعلن» [@atiq، ص59]، في التفعيلة الثانية من الصدر والثانية من العَجُز."
context: "أول مقطع حماية الحيّ والفرس (63–69)، يأتي بعد غداة الريح والصبوح والقينة. وفي اللسان صورة المشهد كله: «أخبر أنه يخرج ربيئة أي طليعة لقومه على راحلته وقد اجتنب إليها فرسه وتوشح بلجامها»، فإن أحسّ بالعدو ألجمها وركبها [@lisan، ج2 ص633]. والربيئة: الذي يحرس القوم من مكان مرتفع."
variants:
  - reading: "وَلَقَدْ حَمَيْتُ الْخَيْلَ تَحْمِلُ شِكَّتِي"
