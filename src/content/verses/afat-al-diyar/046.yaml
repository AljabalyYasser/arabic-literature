first: "حَتَّى إِذَا يَئِسَتْ وَأَسْحَقَ حَالِقٌ"
second: "لَمْ يُبْلِهِ إِرْضَاعُهَا وَفِطَامُهَا"
meaning: "حتى إذا يئست من ولدها، وجفّ ضرعها الذي كان ممتلئًا، ولم يُبله رضاع ولا فطام بل أبلاه الحزن. قال ابن الأَنْبارِيّ: «أي لم يبله أن أرضعت وفطمت، ولكنها ثكلت فحزنت وتركت العلف فغرزت، أي انقطع لبنها» [@ibn-al-anbari، ص564]."
vocabulary:
  - term: "يَئِسَتْ"
    text: "«معناه إذا يئست من ولدها» [@ibn-al-anbari، ص564]."
  - term: "أَسْحَقَ"
    text: "«أخلق، كما يخلق الثوب» [@ibn-al-anbari، ص564]. وفي اللسان: «وأسْحَقَ الضرعُ: يَبِسَ وبَلي وَارْتَفَعَ لَبَنُهُ وَذَهَبَ مَا فِيهِ» [@lisan، ج10 ص153]."
  - term: "حَالِقٌ"
    text: "عند ابن الأَنْبارِيّ «الضرع الملآن» [@ibn-al-anbari، ص564]. وفي اللسان عن الأَزْهَرِيّ: «الْحَالِقُ مِنْ نَعْتِ الضُّروع جَاءَ بِمَعْنَيَيْنِ مُتضادَّين»، وهو في هذا البيت ضد الممتلئ: «فَالْحَالِقُ هُنَا: الضَّرْعُ الْمُرْتَفِعُ الَّذِي قلَّ لَبَنُهُ» [@lisan، ج10 ص65]."
  - term: "يُبْلِهِ"
    text: "من الإبلاء، أي لم يُخلِقه ولم يذهب به."
syntax:
  - "«حَتَّى إِذَا» كما في البيت 44. ولم يذكر الشارحان جواب «إِذَا» هنا؛ وأقرب ما يكون جوابًا «وَتَسَمَّعَتْ» في البيت التالي على زيادة الواو، كما قال ابن الأَنْبارِيّ في «وَأَرْسَلُوا» في البيت 49 [@ibn-al-anbari، ص568]. وهذه قراءتنا."
  - "«وَأَسْحَقَ حَالِقٌ» معطوف على «يَئِسَتْ»، و«حَالِقٌ» فاعل، وهو صفة لموصوف محذوف أي ضرع حالق. «ولم يبله إرضاعها وفطامها صلة حالق» [@ibn-al-anbari، ص565]، أي جملة نعت له."
morphology:
  - "«يَئِسَتْ» من «يئس ييأس» على «فَعِل يفعَل»."
  - "«أَسْحَقَ» على «أفعل» من السَّحْق وهو البِلى، ومنه الثوب السَّحْق أي الخَلَق [@ibn-al-anbari، ص564]."
  - "«يُبْلِهِ» مضارع «أبلى» مجزوم بـ«لَمْ» بحذف حرف العلة، أصله «يُبْلِيهِ»."
  - "«إِرْضَاع» مصدر «أرضع» على «إفعال»، و«فِطَام» مصدر «فطم» على «فِعال»."
rhetoric:
  thesis: "اليأس يظهر في الجسد قبل أن يُقال: الضرع الذي امتلأ للولد يجفّ. والشاعر ينفي السبب المعتاد (الرضاع والفطام) ليبقى السبب الآخر، وهو الفقد."
  devices:
    - title: "الكناية"
      text: "«وَأَسْحَقَ حَالِقٌ»: جفاف الضرع كناية عن طول الحزن وترك الرعي، كما فسّره ابن الأَنْبارِيّ في قوله «ولكنها ثكلت فحزنت وتركت العلف». والكناية: أن تذكر شيئًا وتريد لازمه."
    - title: "النفي لإثبات غيره"
      text: "«لَمْ يُبْلِهِ إِرْضَاعُهَا وَفِطَامُهَا»: ينفي أن يكون الرضاع أو الفطام قد أبلى الضرع، فيبقى في ذهن السامع السبب الذي لم يُذكر. قال الزَّوْزَنِيّ: «وإنما أبلاه فقدها إياه» [@zawzani، ص189]."
  connection: "ثم تسمع صوت الناس فتفزع، والناس داؤها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "حَتْتَى إِذَا / يَئِسَتْ وَأَسْ / حَقَ حَالِقُنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — لَمْ يُبْلِهِي / إِرْضَاعُهَا / وَفِطَامُهَا = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأوليين من العجز. وأُشبعت كسرة الهاء في «يُبْلِهِ» حتى صارت ياءً."
context: "الثالث من أبيات الصباح والرماة والكلاب (44–52). بعد سبعة أيام ينتهي الطلب باليأس، فيدخل الخطر الجديد: الصيادون."
