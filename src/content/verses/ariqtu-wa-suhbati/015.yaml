first: فَيَا لَلنَّاسِ كَيْفَ غَلَبْتُ نَفْسِي
second: عَلَى شَيْءٍ وَيَكْرَهُهُ ضَمِيرِي
meaning: يا للناس! كيف قهرتُ نفسي فحملتها على شيء كان قلبي في سرّه يكرهه، أي قبول فداء سلمى.
vocabulary:
- term: فَيَا لَلنَّاسِ
  text: 'نداء استغاثة وتعجب. قال ابن السِّكِّيت في هذه اللام: «إذا كانت استغاثة فتح اللام، وإذا كانت تعجبًا كسرها» [@diwan-urwa، ص36].'
- term: غَلَبْتُ نَفْسِي
  text: قهرتها وحملتها على ما لا تريد.
- term: ضَمِيرِي
  text: باطني وما أُضمره.
context: 'ذروة الندم. وقال ابن السِّكِّيت في معناه: «يقول: غلبتُ النفسَ على شيءٍ قد كنتُ أُضمِرُ ألّا أفعلَه ثم فعلتُه» [@diwan-urwa، ص37].'
syntax:
- «يَا» حرف نداء، و«لَلنَّاسِ» اللام المفتوحة لام الاستغاثة، و«الناس» مستغاث به مجرور بها.
- «كَيْفَ غَلَبْتُ نَفْسِي» «كيف» اسم استفهام للتعجب، و«غلبت نفسي» فعل وفاعل ومفعول.
- «عَلَى شَيْءٍ» متعلق بـ«غلبت»، و«وَيَكْرَهُهُ ضَمِيرِي» جملة حالية من «شيء»، والواو واو الحال.
morphology:
- «غَلَبْتُ» من «غَلَبَ يَغْلِبُ».
- '«ضَمِير» على «فَعِيل» بمعنى «مُفْعَل»: المُضمَر في النفس.'
rhetoric:
  thesis: 'يستنجد عروة بالناس على نفسه: هو الغالب وهو المغلوب. فالبيت اعتراف بأن الخديعة لم تكن من قوم سلمى وحدهم، بل من ضعف فيه.'
  devices:
  - title: الاستغاثة في «فَيَا لَلنَّاسِ»
    text: يستغيث بالناس كأنه يشهدهم على أمر عجيب، والأمر العجيب فعله هو. فالاستغاثة هنا تعجب من النفس أكثر منها طلب نجدة.
  - title: المفارقة في «غَلَبْتُ نَفْسِي ... وَيَكْرَهُهُ ضَمِيرِي»
    text: الإنسان يغلب غيره، وعروة غلب نفسه. وقد انقسم بين ظاهر رضي بالفداء وضمير يكرهه. وفي هذه القسمة يكمن الندم.
  - title: الاستفهام التعجبي في «كَيْفَ»
    text: 'لا يسأل عن الطريقة، بل يتعجب من وقوع الأمر نفسه: كيف حدث هذا مني؟'
  connection: 'يتمنى في البيت الأخير لو عصى من أشار عليه: «ألا يا ليتني عاصيت طلقًا وجبارًا».'
prosody:
  meter: البحر الوافر
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: فَيَا لَنْنَا / سِ كَيْفَ غَلَبْ / تُ نَفْسِي = مفاعلْتن / مفاعلتن / فعولن — عَلَى شَيْئِنْ / وَيَكْرَهُهُو / ضَمِيرِي = مفاعلْتن / مفاعلتن / فعولن
  note: في أول الشطرين «مفاعلْتن» معصوبة. وتُشبَع ضمة الهاء في «يكرهه».
