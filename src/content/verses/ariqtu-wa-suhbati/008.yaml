first: وَقَالَتْ مَا تَشَاءُ فَقُلْتُ أَلْهُو
second: إِلَى الإِصْبَاحِ آثِرَ ذِي أَثِيرِ
meaning: 'وفي الليلة الأخيرة عند بني النضير قالت لي: ما الذي تريد؟ فقلت: أريد أن أخلو بكِ وأستمتع بكِ حتى الصباح، قبل كل شيء آخر. أي أراد أن يقضي معها ليلته الأخيرة في الفراش، يضاجعها ويلاعبها، قبل أن يسلّمها لقومها.'
vocabulary:
- term: مَا تَشَاءُ
  text: ما الذي تريد؟
- term: أَلْهُو
  text: 'أتمتع بالمرأة وأخلو بها. واللهو هنا كناية عن المضاجعة، ففي اللسان: «وَقَدْ يُكَنَّى باللَّهْوِ عَنِ الْجِمَاعِ»، و«واللَّهْوُ: النِّكَاحُ، وَيُقَالُ المرأَة» [@lisan، ج15 ص259].'
- term: الإِصْبَاحِ
  text: الصباح.
- term: آثِرَ ذِي أَثِيرِ
  text: 'قال ابن السِّكِّيت: «قوله: آثر ذي أثير: مثل قولك: آثرًا ما، أي: أول كل شيء» [@diwan-urwa، ص34]، أي: أبدأ به قبل كل أمر.'
context: 'آخر لقاء بسلمى قبل الفداء. وفي رواية أبي عَمْرو الشيباني عند أبي الفَرَج أن عروة قال لقوم سلمى حين اتفقوا على الفداء: «دعوني أَلْهُ بها الليلةَ وأُفادِها غدًا» [@aghani-dk، ج3 ص76]، فالبيت صدى لهذا القول. ونشرحه شرحًا كاملًا لأنه من شعر الغزل الصريح، كما يقضي منهج الموقع في الأبيات الصريحة.'
syntax:
- «وَقَالَتْ» فعل وفاعل مستتر يعود على سلمى. وفي رواية الأغاني «وقالوا»، فيكون القائلون قومها.
- '«مَا تَشَاءُ» مقول القول: «ما» اسم استفهام مبتدأ، وجملة «تشاء» خبره، والعائد محذوف: ما تشاؤه؟'
- «فَقُلْتُ أَلْهُو» مقول القول جملة فعلية، و«إِلَى الإِصْبَاحِ» متعلق بـ«ألهو».
- «آثِرَ ذِي أَثِيرِ» منصوب على الظرفية بمعنى «أوّلَ كل شيء».
morphology:
- «أَلْهُو» مضارع «لَهَا يَلْهُو» الناقص الواوي.
- «الإِصْبَاح» مصدر «أَصْبَحَ» على «إِفْعال».
- «آثِر» اسم فاعل من «أَثَرَ»، و«أَثِير» على «فَعِيل».
rhetoric:
  thesis: 'بيت في حوار قصير: سؤال منها وجواب منه، والجواب رغبة صريحة في جسدها لليلة أخيرة. فالفراق قريب، وما يطلبه ليس كلامًا ولا وداعًا، بل ليلة معها.'
  devices:
  - title: الحوار في بيت واحد
    text: '«وَقَالَتْ ... فَقُلْتُ»: السؤال والجواب في صدر البيت، ثم يتمه العجز. فيسمع القارئ الصوتين كأنه حاضر في الخيمة.'
  - title: الكناية في «أَلْهُو إِلَى الإِصْبَاحِ»
    text: 'لم يقل: أضاجعك، بل قال: ألهو حتى الصباح، واللهو يُكنى به عن الجماع كما في اللسان. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]. وذكرُ «إلى الإصباح» يحدد الليلة كلها، فيُفهم أنها ليلة في الفراش لا حديث.'
  - title: '«آثِرَ ذِي أَثِيرِ»: المثل'
    text: عبارة سائرة معناها «أول كل شيء». فيجعل هذه الليلة مقدَّمة على كل أمر، حتى على الفداء الذي اتفقوا عليه.
  connection: 'يصف في البيت التالي المرأة التي يلهو بها: «بآنسة الحديث رضاب فيها».'
prosody:
  meter: البحر الوافر
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: وَقَالَتْ مَا / تَشَاءُ فَقُلْ / تُ أَلْهُو = مفاعلْتن / مفاعلتن / فعولن — إِلَلْ إِصْبَا / حِ آثِرَ ذِي / أَثِيرِي = مفاعلْتن / مفاعلتن / فعولن
  note: في أول الشطرين «مفاعلْتن» معصوبة. وتسقط ألف «إلى» في النطق قبل لام «الإصباح» الساكنة.
variants:
- reading: وَقَالُوا مَا تَشَاءُ فَقُلْتُ أَلْهُو
  status: رواية الأغاني
  note: '[@aghani-dk، ج3 ص77]. وفسر محققو الأغاني «آثر ذي أثير» بأنه «أول كل شىء» [@aghani-dk، ج3 ص77، الحاشية].'
