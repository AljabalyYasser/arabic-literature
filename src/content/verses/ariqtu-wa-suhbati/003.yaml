first: تَكَشُّفَ عَائِذٍ بَلْقَاءَ تَنْفِي
second: ذُكُورَ الخَيْلِ عَنْ وَلَدٍ شَغُورِ
vocabulary:
- term: تَكَشُّفَ عَائِذٍ بَلْقَاءَ
  text: 'قال ابن السِّكِّيت: «أي: يتكشف البرق كتكشُّف عائذٍ، والعائذ: الحديثة النتاج»، وتكشفها «أنها تشغر برجليها وترفع لتنحي ذكور الخيل عن ولدها فيبدو بلق بطنها، فشبه البرق في سواد الغيم ببياض هذه الفرس في سواد بطنها» [@diwan-urwa، ص33]. والبلقاء: التي فيها سواد وبياض.'
- term: شَغُورِ
  text: '«التي تشغر برجليها، والشغر: رفع الرجلين جدًا» [@diwan-urwa، ص33].'
sources:
- source: diwan-urwa
  loc: ص33
