first: أَلَا يَا لَيْتَنِي عَاصَيْتُ طَلْقًا
second: وَجَبَّارًا وَمَنْ لِي مِنْ أَمِيرِ
vocabulary:
- term: طَلْقًا وَجَبَّارًا
  text: 'قال ابن السِّكِّيت: «طلقٌ وجبّار: أخوه وابن عمه» [@diwan-urwa، ص37]، وهما اللذان أشارا عليه بقبول الفداء.'
- term: أَمِيرِ
  text: '«الأمير: هاهنا المستشار» [@diwan-urwa، ص37].'
