first: بِآنِسَةِ الحَدِيثِ رُضَابُ فِيهَا
second: بُعَيْدَ النَّوْمِ كَالعِنَبِ العَصِيرِ
meaning: ألهو بامرأة لطيفة الحديث تأنس بي ولا تنفر، ريقُ فمها عند قبلتها بعد النوم مباشرة حلو كعصير العنب. والمعنى أنه قضى الليل معها في الفراش وقبّلها حين استيقظت، فوجد فمها طيبًا مع أن الأفواه تتغير بعد النوم.
vocabulary:
- term: آنِسَةِ الحَدِيثِ
  text: 'قال ابن السِّكِّيت: «الآنسةُ: غيرُ النُّفور» [@diwan-urwa، ص35]، أي تأنس بحديث صاحبها ولا تنفر منه.'
- term: رُضَابُ
  text: '«والرُّضابُ من كل شيء: القِطَعُ، والرُّضاب: قِطَعُ الرِّيق» [@diwan-urwa، ص35]، أي ريق الفم.'
- term: فِيهَا
  text: فمها، وهو «فُو» مجرورًا بالياء ومضافًا إلى ضميرها.
- term: بُعَيْدَ النَّوْمِ
  text: بعد النوم بقليل.
- term: العِنَبِ العَصِيرِ
  text: العنب المعصور، أي عصيره.
context: 'يتم البيتُ معنى البيت السابق: «ألهو ... بآنسة»، ثم يصف قبلة الصباح. وبه تنتهي ذكرى الليلة الأخيرة، وفي البيت التالي يبدأ الندم: «أطعت الآمرين بصرم سلمى». ونشرحه شرحًا كاملًا لأنه من الغزل الصريح.'
syntax:
- '«بِآنِسَةِ» متعلق بـ«ألهو» في البيت السابق، و«الحَدِيثِ» مضاف إليه. وتعلّق أول البيت بما قبله هو ما يسميه العروضيون التضمين: ألا يتم معنى البيت إلا بالذي يليه أو الذي قبله.'
- «رُضَابُ فِيهَا» مبتدأ مضاف إلى «فيها»، و«فيها» مضاف إليه مجرور بالياء لأنه من الأسماء الخمسة («فو»)، والهاء ضمير المرأة.
- «بُعَيْدَ النَّوْمِ» ظرف متعلق بالخبر، و«كَالعِنَبِ العَصِيرِ» جار ومجرور خبر المبتدأ، والجملة نعت لـ«آنسة».
morphology:
- '«آنِسَة» اسم فاعل مؤنث من «أَنِسَ»: ألِف ولم يستوحش.'
- '«بُعَيْد» تصغير «بَعْد»، وهو تصغير يفيد القرب: بعد النوم بقليل.'
- '«العَصِير» على «فَعِيل» بمعنى «مَفْعُول»: المعصور.'
rhetoric:
  thesis: 'يذكر أدق ما يعرفه رجل عن امرأته: طعم فمها حين تستيقظ. فالتفصيل الحسي الصريح يقول إن الليلة كانت ليلة قرب كامل، ويجعل الفقد الآتي أشد.'
  devices:
  - title: التشبيه في «رُضَابُ فِيهَا ... كَالعِنَبِ العَصِيرِ»
    text: شبّه ريق فمها بعصير العنب في الحلاوة. وهو شبه بيّن يُدرك بالذوق، مما يسميه عبد القاهر الجُرْجانيّ ما يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90].
  - title: الكناية في «بُعَيْدَ النَّوْمِ»
    text: لا يعرف طعم الفم بعد النوم إلا من نام إلى جانب المرأة وقبّلها حين استيقظت. فذِكرُ هذا الوقت يقول، دون تصريح، إنه بات معها في فراش واحد. وهي الكناية التي يذكر فيها المتكلم «معنى هو تاليه وردفه في الوجود» كما يقول عبد القاهر [@dalail، ص66].
  - title: التضمين
    text: 'لا يتم البيت السابق إلا بهذا: «ألهو إلى الإصباح» ثم «بآنسة الحديث». فيمتد المعنى بين البيتين كما امتدت الليلة.'
  connection: 'بعد هذه الذكرى ينقلب الكلام إلى الندم: «أطعت الآمرين بصرم سلمى».'
prosody:
  meter: البحر الوافر
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: بِآنِسَتِلْ / حَدِيثِ رُضَا / بُ فِيهَا = مفاعلتن / مفاعلتن / فعولن — بُعَيْدَنْنَوْ / مِ كَلْعِنَبِلْ / عَصِيرِي = مفاعلْتن / مفاعلتن / فعولن
  note: «رُضَابُ» بلا تنوين لأنه مضاف إلى «فيها»؛ ولو نُوِّن لانكسر الوزن. وفي أول العجز «مفاعلْتن» معصوبة.
