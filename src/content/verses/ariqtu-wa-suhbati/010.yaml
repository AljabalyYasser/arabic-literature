explained: false
first: أَطَعْتُ الآمِرِينَ بِصُرْمِ سَلْمَى
second: فَطَارُوا فِي بِلَادِ اليَسْتَعُورِ
vocabulary:
- term: الآمِرِينَ
  text: 'قال ابن السِّكِّيت: «يريد: الذين أمروه بأخذ الفداء» [@diwan-urwa، ص35].'
- term: بِصُرْمِ سَلْمَى
  text: بقطيعتها وفراقها.
- term: فَطَارُوا فِي بِلَادِ اليَسْتَعُورِ
  text: '«واليستعور: موضع قِبَلَ حَرّة المدينة فيه عضاة من سمر وطلح»، ومعنى البيت: «أطعت الذين أمروني بأخذ الفداء مساعدة وتفرقوا عني» [@diwan-urwa، ص35]، أي تفرقوا في الأرض وتركوه بندمه.'
sources:
- source: diwan-urwa
  loc: ص35
