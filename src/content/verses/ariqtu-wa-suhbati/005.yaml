explained: false
first: إِذَا حَلَّتْ بِأَرْضِ بَنِي عَلِيٍّ
second: وَأَهْلُكَ بَيْنَ إِمَّرَةٍ وَكِيرِ
vocabulary:
- term: بَنِي عَلِيٍّ
  text: 'قال ابن السِّكِّيت: «بنو عليّ: قوم من كنانة» [@diwan-urwa، ص34].'
- term: إِمَّرَةٍ وَكِيرِ
  text: 'موضعان؛ يعرّف المحقق إمّرة بأنها منزل في طريق مكة من البصرة، وكِير بأنه «جبل في أرض غطفان» [@diwan-urwa، ص33، الحاشية]. يريد: أهلها في كنانة وأهله في غطفان، والدار بعيدة.'
