first: سَقَوْنِي النَّسْءَ ثُمَّ تَكَنَّفُونِي
second: عُدَاةَ اللَّهِ مِنْ كَذِبٍ وَزُورِ
meaning: سقاني قومها شرابًا يُذهب العقل، ثم أحاطوا بي من كل جانب حتى رضيت بالفداء، أعداءَ الله، بما صنعوا من كذب وخداع.
vocabulary:
- term: النَّسْءَ
  text: 'قال ابن السِّكِّيت: «النَّسْءُ: ما أنسأ العقلَ وألبسه. ويقال: كلُّ مُسكِرٍ نَسْءٌ، يقول: سقوني نسأً أنساني الحبَّ الذي كنتُ أجدُه» [@diwan-urwa، ص35].'
- term: تَكَنَّفُونِي
  text: أحاطوا بي من جوانبي، يضغطون عليّ.
- term: عُدَاةَ اللَّهِ
  text: أعداء الله؛ والعُداة جمع «عادٍ» بمعنى العدو.
- term: زُورِ
  text: الباطل والكذب.
context: 'أشهر أبيات القصيدة، وبه يذكرها الرواة. ففي رواية عامر بن جابر عند أبي الفَرَج: «فلما أصبح وصحا ندم فقال: سقوني الخمر ثم تكنفوني» [@aghani-dk، ج3 ص75]، وفي رواية أبي عَمْرو: «فقال عروة في ذلك: سقوني الخمر ثم تكنفوني» [@aghani-dk، ج3 ص77]. وهو قلب الخبر: الشراب ثم الفداء ثم الندم.'
syntax:
- '«سَقَوْنِي النَّسْءَ» فعل وفاعل ومفعولان: الياء المفعول الأول، و«النسء» المفعول الثاني.'
- '«ثُمَّ تَكَنَّفُونِي» معطوفة بـ«ثم» التي تفيد الترتيب مع المهلة: الشراب أولًا ثم الإحاطة.'
- '«عُدَاةَ اللَّهِ» منصوب على الذم بفعل محذوف تقديره: أذمّ. والمُبَرِّد يقول: «ومما ينصب على الذم قول النابغة الذبياني»، ثم ينشد بيت النابغة وبيت عروة هذا شاهدين على الباب [@kamil، ج3 ص31].'
- '«مِنْ كَذِبٍ وَزُورِ» متعلق بـ«تكنفوني»، و«مِن» للتعليل: فعلوا ذلك كذبًا وزورًا.'
morphology:
- «النَّسْء» مصدر «نَسَأَ».
- '«تَكَنَّفُونِي» من «تَكَنَّفَ» على «تَفَعَّلَ»، من «الكَنَف»: الجانب.'
- «عُدَاة» جمع «عادٍ» على «فُعَلَة»، كقاضٍ وقُضاة.
rhetoric:
  thesis: 'في بيت واحد قصة الخديعة كلها: شراب، ثم إحاطة، ثم شتيمة. والشاعر يلوم قومها، ولكنه في الأبيات التالية سيلوم نفسه أكثر.'
  devices:
  - title: النصب على الذم في «عُدَاةَ اللَّهِ»
    text: 'لو قال «عداةُ الله» بالرفع لكان وصفًا جاريًا على الكلام. فلما نصب قطعه عن الإعراب الأول، فصار شتيمة مستقلة كأنه قال: أذمّ عداةَ الله. وبهذا الشاهد يمثل المُبَرِّد لهذا الباب [@kamil، ج3 ص31].'
  - title: الترتيب بـ«ثُمَّ»
    text: '«سقوني ... ثم تكنفوني»: ثم تجعل الإحاطة بعد السكر، فيظهر التدبير: أسكروه أولًا، ثم ضغطوا عليه وهو لا يملك عقله.'
  connection: 'يحكي في البيت التالي ما قالوه ليغروه: «لست بعد فداء سلمى بمفنٍ ما لديك ولا فقير».'
prosody:
  meter: البحر الوافر
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: سَقَوْنِنْنَسْ / ءَ ثُمْمَ تَكَنْ / نَفُونِي = مفاعلْتن / مفاعلتن / فعولن — عُدَاتَلْلَا / هِ مِنْ كَذِبِنْ / وَزُورِي = مفاعلْتن / مفاعلتن / فعولن
  note: في أول الشطرين «مفاعلْتن» معصوبة.
variants:
- reading: سَقَوْنِي الخَمْرَ ثُمَّ تَكَنَّفُونِي
  status: رواية الأغاني والكامل
  note: '[@aghani-dk، ج3 ص75] [@kamil، ج3 ص31].'
- reading: عُدَاةُ اللَّهِ
  status: بالرفع في مصادر يذكرها محقق الديوان
  note: يذكر المحقق أن «عُداة» بالضم في الأغاني وطبعة البستاني وغيرهما [@diwan-urwa، ص35، الحاشية].
