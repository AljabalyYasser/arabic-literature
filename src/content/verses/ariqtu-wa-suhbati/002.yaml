first: إِذَا قُلْتُ اسْتَهَلَّ عَلَى قُدَيْدٍ
second: يَحُورُ رَبَابُهُ حَوْرَ الكَسِيرِ
vocabulary:
- term: اسْتَهَلَّ عَلَى قُدَيْدٍ
  text: 'قال ابن السِّكِّيت: «وقُدَيدٌ: من مكة على مرحلتين. واستهلَّ: أي صبَّ» [@diwan-urwa، ص33]، يعني المطر.'
- term: يَحُورُ رَبَابُهُ
  text: '«والرَّبابُ: السحابُ. ويَحورُ: يَرجِعُ» [@diwan-urwa، ص33].'
- term: حَوْرَ الكَسِيرِ
  text: '«الكسيرُ: يُبطِئ في المُضيّ» [@diwan-urwa، ص33]، فالسحاب يرجع بطيئًا ثقيلًا كالمكسور.'
sources:
- source: diwan-urwa
  loc: ص33
