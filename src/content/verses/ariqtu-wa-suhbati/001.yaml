first: أَرِقْتُ وَصُحْبَتِي بِمَضِيقِ عَمْقٍ
second: لِبَرْقٍ فِي تِهَامَةَ مُسْتَطِيرِ
meaning: سهرتُ لا يأتيني النوم، وأصحابي نائمون في الطريق الضيق من عَمْق، أرقب برقًا منتشرًا في الأفق من ناحية تِهامة، حيث ديار سلمى.
vocabulary:
- term: أَرِقْتُ
  text: سهرتُ وذهب عني النوم.
- term: صُحْبَتِي
  text: أصحابي.
- term: مَضِيقِ عَمْقٍ
  text: 'قال ابن السِّكِّيت: «عَمْقٌ: بلدٌ بالمدينة» [@diwan-urwa، ص32]؛ والمضيق: الطريق الضيق بين جبلين.'
- term: تِهَامَةَ
  text: الأرض المنخفضة التي تلي البحر في الحجاز.
- term: مُسْتَطِيرِ
  text: «منتشرٌ في الأُفق» [@diwan-urwa، ص32].
context: 'مطلع القصيدة: ليل وبرق وسهر. والبرق في الشعر الجاهلي يذكّر بديار الحبيبة لأنه يأتي من ناحيتها ويبشر بالمطر فيها. وفي البيت الرابع يسمّي من يذكّره بها: «سقى سلمى». فالقصيدة تبدأ حنينًا قبل أن تصير ندمًا.'
syntax:
- «أَرِقْتُ» فعل وفاعل.
- «وَصُحْبَتِي بِمَضِيقِ عَمْقٍ» جملة اسمية حالية، والواو واو الحال.
- '«لِبَرْقٍ» متعلق بـ«أرقت»، واللام للتعليل: أرقت من أجل برق.'
- «فِي تِهَامَةَ» متعلق بمحذوف نعت لبرق، و«مُسْتَطِيرِ» نعت ثانٍ.
morphology:
- «أَرِقْتُ» من «أَرِقَ يَأْرَقُ» على «فَعِلَ».
- «صُحْبة» اسم جمع لصاحب.
- '«مُسْتَطِير» اسم فاعل من «استطار» على «استفعل»: انتشر وتفرّق.'
rhetoric:
  thesis: 'يجمع المطلع المكان والزمان والحنين في بيت واحد: الشاعر في عَمْق، وقلبه في تهامة، والبرق يصل بينهما.'
  devices:
  - title: المقابلة الضمنية بين الساهر وأصحابه
    text: لم يقل إن أصحابه نيام، بل جعل جملتهم حالًا هادئة، «وصحبتي بمضيق عمق»، في مقابل أرقه هو. فيُفهم أنه وحده الساهر، وأن همّه خاص به.
  - title: البرق رسولًا
    text: البرق «في تهامة» يأتي من جهة الحبيبة، فيصير صلة بين المكانين. وبهذا يمهد لذكر سلمى دون أن يسميها في المطلع.
  connection: يصف في البيتين التاليين هذا البرق وسحابه، ثم يدعو لسلمى بالسقيا.
prosody:
  meter: البحر الوافر
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: أَرِقْتُ وَصُحْ / بَتِي بِمَضِي / قِ عَمْقِنْ = مفاعلتن / مفاعلتن / فعولن — لِبَرْقِنْ فِي / تِهَامَةَ مُسْ / تَطِيرِي = مفاعلْتن / مفاعلتن / فعولن
  note: 'الوافر: «مفاعلتن مفاعلتن فعولن» في كل شطر. وفي أول العجز «مفاعلْتن» بتسكين الخامس، وهذا هو العَصْب، وهو كثير في الوافر.'
variants:
- reading: أَرِقْتُ وَصُحْبَتِي بِمَضِيقِ عَمْقٍ / لِبَرْقٍ مِنْ تِهَامَةَ مُسْتَطِيرِ
  status: رواية الأغاني
  note: «من تهامة» مكان «في تهامة» [@aghani-dk، ج3 ص77].
