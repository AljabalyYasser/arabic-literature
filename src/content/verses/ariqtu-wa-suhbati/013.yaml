first: وَلَا وَأَبِيكَ لَوْ كَاليَوْمِ أَمْرِي
second: وَمَنْ لَكَ بِالتَّدَبُّرِ فِي الأُمُورِ
meaning: لا، وحقّ أبيك، لو كان أمري يومئذ كما هو اليوم وأنا صاحٍ عاقل؛ ولكن من يضمن لك أن تحسن النظر في عواقب الأمور قبل وقوعها؟
vocabulary:
- term: وَأَبِيكَ
  text: قسم بأبي المخاطَب، على عادة العرب.
- term: كَاليَوْمِ أَمْرِي
  text: 'قال ابن السِّكِّيت: «أي: لو كنتُ يومئذ مثلي اليوم لملكت أمري» [@diwan-urwa، ص36].'
- term: التَّدَبُّرِ
  text: النظر في أدبار الأمور، أي عواقبها.
context: 'يبدأ هنا الندم صريحًا. وهذا البيت وما بعده هي الأبيات الثلاثة التي يرويها ابن قُتَيْبة في آخر خبر الكنانية: «فذلك قوله» [@ibn-qutayba، ج2 ص667].'
syntax:
- '«لَا» نافية لكلام سابق يردّه، و«وَأَبِيكَ» قسم: الواو حرف قسم، و«أبيك» مجرور بها.'
- '«لَوْ كَاليَوْمِ أَمْرِي» شرط حُذف فعله، والتقدير: لو كان أمري كاليوم؛ فـ«أمري» اسم «كان» المحذوفة، و«كاليوم» خبرها مقدم.'
- '«وَمَنْ لَكَ بِالتَّدَبُّرِ فِي الأُمُورِ» جملة اعتراضية بين الشرط وجوابه، و«مَن» استفهام بمعنى النفي: لا أحد يضمن لك ذلك.'
- 'وجواب «لو» في البيت التالي: «إذن لملكت»، فالبيت لا يتم معناه إلا بما بعده، وهذا هو التضمين.'
morphology:
- «التَّدَبُّر» مصدر «تَدَبَّرَ» على «تَفَعُّل».
- «الأُمُور» جمع «أَمْر» على «فُعُول».
rhetoric:
  thesis: 'يتمنى عروة لو كان عقله يوم الفداء كعقله اليوم، ثم يقطع أمنيته بسؤال يعرف جوابه: من يملك أن يرى العواقب قبل أن تقع؟'
  devices:
  - title: الاعتراض في «وَمَنْ لَكَ بِالتَّدَبُّرِ فِي الأُمُورِ»
    text: 'الاعتراض: جملة تُقحم بين أجزاء الكلام لغرض. فقد بدأ الشرط «لو كاليوم أمري» ثم قطعه قبل الجواب بهذه الحسرة، فكأن الندم غلبه قبل أن يكمل الكلام.'
  - title: الاستفهام الإنكاري في «وَمَنْ لَكَ»
    text: 'لا يسأل عن شخص، بل ينفي أن يكون لأحد علم العواقب. فالسؤال اعتذار عن نفسه: لم يكن يستطيع أن يعرف.'
  - title: التضمين
    text: جواب «لو» في البيت التالي، فيمتد الشرط على بيتين، ويبقى السامع معلقًا حتى يسمع «إذن لملكت».
  connection: 'يأتي جواب الشرط في البيت التالي: «إذن لملكت عصمة أم وهب».'
prosody:
  meter: البحر الوافر
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: وَلَا وَأَبِي / كَ لَوْ كَلْيَوْ / مِ أَمْرِي = مفاعلتن / مفاعلْتن / فعولن — وَمَنْ لَكَ بِتْ / تَدَبْبُرِ فِلْ / أُمُورِي = مفاعلتن / مفاعلتن / فعولن
  note: في الصدر «مفاعلْتن» معصوبة في الجزء الثاني.
