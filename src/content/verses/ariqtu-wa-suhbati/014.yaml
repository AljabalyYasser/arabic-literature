first: إِذَنْ لَمَلَكْتُ عِصْمَةَ أُمِّ وَهْبٍ
second: عَلَى مَا كَانَ مِنْ حَسَكِ الصُّدُورِ
meaning: إذن لأمسكتُ عصمة أم وهب، أي لبقيتُ مالكًا أمرها زوجةً لي، مع كل ما في صدور قومها وصدري من الغل والعداوة.
vocabulary:
- term: عِصْمَةَ
  text: 'قال ابن السِّكِّيت: «ويُقال: عصمةُ فلانةَ بيدَيْ فلانٍ، أي مِلكُ أمرها» [@diwan-urwa، ص36]، أي عقد زواجها.'
- term: أُمِّ وَهْبٍ
  text: 'كنية سلمى: «يقال لها سلمى وتكنى أم وهب» [@aghani-dk، ج3 ص76].'
- term: حَسَكِ الصُّدُورِ
  text: '«والحَسَكُ: الغِلُّ والعداوةُ، والأصلُ: الخشونةُ تكون في الصدر، والواحدة: حَسَكة» [@diwan-urwa، ص36].'
context: 'جواب الشرط في البيت السابق. وقال ابن السِّكِّيت في معناه: «يقول: إذًا لأمسكتها فكنتُ مالكَ أمرها على ما بيني وبين قومها من العداوة» [@diwan-urwa، ص36].'
syntax:
- «إِذَنْ» حرف جواب وجزاء.
- «لَمَلَكْتُ» اللام واقعة في جواب «لو» في البيت السابق، و«ملكتُ» فعل وفاعل، و«عِصْمَةَ» مفعول به.
- '«عَلَى مَا كَانَ مِنْ حَسَكِ الصُّدُورِ» متعلق بـ«ملكت»، و«على» بمعنى «مع»: مع ما كان. و«ما» موصولة، و«من حسك» بيان لها.'
morphology:
- '«عِصْمَة» على «فِعْلَة» من «عَصَمَ»: منع وحفظ.'
- «حَسَك» اسم جنس جمعي، واحده «حَسَكة».
- «الصُّدُور» جمع «صَدْر» على «فُعُول».
rhetoric:
  thesis: 'يرى عروة الآن ما كان يستطيعه: أن يبقيها زوجة له رغم عداوة قومها. فالندم ليس على المرأة وحدها، بل على يد فتحت فأفلت ما فيها.'
  devices:
  - title: الاستعارة في «حَسَكِ الصُّدُورِ»
    text: 'الحسك نبات شائك، فاستعاره للعداوة التي في الصدور تؤذي كالشوك. وابن السِّكِّيت يذكر أن «الأصل: الخشونة تكون في الصدر» [@diwan-urwa، ص36]. وهذه استعارة كما يحدها عبد القاهر الجُرْجانيّ: أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67].'
  - title: الكناية في «مَلَكْتُ عِصْمَةَ أُمِّ وَهْبٍ»
    text: 'لم يقل: لبقيت زوجتي، بل قال: لملكت عصمتها، أي عقدها الذي يمسكها. فدلّ على الزواج بما يلزمه من الإمساك والحفظ.'
  connection: 'ينتهي الشرط هنا، ويبدأ في البيت التالي التعجب من نفسه: «فيا للناس كيف غلبت نفسي».'
prosody:
  meter: البحر الوافر
  rhyme: الرَّوِيّ الراء المكسورة
  scansion: إِذَنْ لَمَلَكْ / تُ عِصْمَةَ أُمْ / مِ وَهْبِنْ = مفاعلتن / مفاعلتن / فعولن — عَلَى مَا كَا / نَ مِنْ حَسَكِصْ / صُدُورِي = مفاعلْتن / مفاعلتن / فعولن
  note: في أول العجز «مفاعلْتن» معصوبة.
