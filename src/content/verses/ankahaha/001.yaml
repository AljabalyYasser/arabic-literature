first: أَنْكَحَهَا فَقْدُهَا الْأَرَاقِمَ فِي
second: جَنْبٍ وَكَانَ الْحِبَاءُ مِنْ أَدَمِ
vocabulary:
- term: فَقْدُهَا الْأَرَاقِمَ
  text: غيابُ قومها عنها. والأراقم «هم جُشَم ومالك والحارِث ومعاوية وثعلبة وعَمْرو، بنو بَكْر بن حبيب بن غنم ابن تَغْلِب» [@ibn-qutayba، ج1 ص290، الحاشية].
- term: جَنْبٍ
  text: 'قبيلة من مَذْحِج باليمن؛ قال المبرّد: «وجنب حيّ من أحيائهم وضيع» [@kamil، ج3 ص68].'
- term: الْحِبَاءُ مِنْ أَدَمِ
  text: 'الحِباء: المهر، والأَدَم: الجلد. قال شاكر: «يريد أنهم لم يكونوا أرباب نعم فيمهروها الإبل، وجعلهم دباغين للأدم» [@ibn-qutayba، ج1 ص290، الحاشية]. وفي «العقد»: «أي أنه ساق إليها في مهرها قبة من أدم» [@iqd، ج3 ص343].'
