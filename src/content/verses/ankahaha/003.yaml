first: أَصْبَحْتُ لَا مُنْفِسًا أَصَبْتُ وَلَا
second: أُبْتُ كَرِيمًا حُرًّا مِنَ النَّدَمِ
vocabulary:
- term: مُنْفِسًا
  text: 'شيئًا نفيسًا؛ يقال: «لفلان مُنْفِس ونفيس، أي مال كثير» [@lisan، ج6 ص239].'
- term: أُبْتُ
  text: رجعت.
- term: حُرًّا مِنَ النَّدَمِ
  text: خالصًا منه بريئًا.
