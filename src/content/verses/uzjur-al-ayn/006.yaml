first: "أَنْبَضُوا مَعْجِسَ الْقِسِيِّ وَأَبْرَقْـ"
second: "ـنَا كَمَا تُوعِدُ الْفُحُولُ الْفُحُولَا"
meaning: "أمسكوا قسيّهم من مقابضها وجذبوا أوتارها لتَرِنّ، يتهددوننا بها، وتهددناهم نحن، كما يتوعد الفحلُ من الإبل الفحلَ."
vocabulary:
  - term: "أَنْبَضُوا"
    text: "جذبوا الأوتار ثم أرسلوها لتصوّت. يقال: «وأنبض بالوتر إذا جذبه ثم أرسله ليرنّ» [@lisan، ج7 ص235]."
  - term: "مَعْجِسَ الْقِسِيِّ"
    text: "مقابض القسيّ. ومعجس القوس: «مقبضها الذي يقبضه الرامي منها» [@lisan، ج6 ص130]."
  - term: "أَبْرَقْنَا"
    text: "تهددنا وتوعدنا. «وبرق الرجل وأبرق: تهدد وأوعد»، كأنه أراه مخيلة الأذى كما يُري البرقُ مخيلة المطر [@lisan، ج10 ص14]."
  - term: "الْفُحُولُ"
    text: "ذكور الإبل."
syntax:
  - "«أَنْبَضُوا مَعْجِسَ الْقِسِيِّ»: فعل وفاعل ومفعول به. والمعنى: أمسكوا القسيّ من معاجسها وجذبوا أوتارها."
  - "«وَأَبْرَقْنَا» معطوف على «أَنْبَضُوا»، وفاعله «نا». فالصدر يجمع فعلين: فعلهم وفعلنا."
  - "«كَمَا تُوعِدُ الْفُحُولُ الْفُحُولَا»: الكاف للتشبيه، و«ما» مصدرية، والتقدير: كإيعاد الفحولِ الفحولَ. و«الْفُحُولُ» الأولى فاعل، والثانية مفعول به."
morphology:
  - "«أَنْبَضُوا» على «أَفْعَلُوا» من «نبض»."
  - "«مَعْجِس» على «مَفْعِل»، اسم للموضع الذي يُقبض عليه من القوس [@lisan، ج6 ص130]."
  - "«الْقِسِيّ» جمع «قوس»، وفيه قلب: «وقِسِيٌّ وقُسِيٌّ، كلاهما على القلب عن قُوُوس» [@lisan، ج6 ص185]."
  - "«تُوعِدُ» مضارع «أوعد»، ويكون في الشر، ومنه الوعيد."
rhetoric:
  thesis: "بيت يصف اللحظة التي تسبق القتال: الفريقان يتهددان، وكل منهما يُري الآخر قوته."
  devices:
    - title: "مواجهة في شطر واحد"
      text: "«أنبضوا ... وأبرقنا»: فعل لهم وفعل لنا في شطر واحد، فتقوم المواجهة في تركيب البيت نفسه قبل أن تقوم في الميدان."
    - title: "التشبيه بالفحول"
      text: "شبّه تهدد الفريقين بتهدد فُحُول الإبل بعضها بعضًا قبل الصدام. وهو تشبيه هيئة بهيئة: جمعان متقابلان، في كل منهما قوة تتهدد القوة التي تقابلها."
    - title: "معنى أخذه الشعراء"
      text: "عدّ ابن رَشِيق هذا البيت أصلًا لمعنى نظر إليه زُهَيْر في قوله ([إنّ الخليط](/texts/inna-al-khalit/31/)): «يطعنهم ما ارتموا حتى إذا طعنوا / ضارب حتى إذا ما ضاربوا اعتنقا»، ونظر إليه أبو ذُؤَيْب أيضًا. وسمّى هذا النوع من الأخذ «النظر والملاحظة» [@ibn-rashiq، ج2 ص287]، وهو عنده: «فإن تساوى المعنيان دون اللفظ وخفي الأخذ فذلك النظر والملاحظة» [@ibn-rashiq، ج2 ص282]. والمعنى المشترك: أن يقابل الفارس فعل عدوه بفعل أشد منه."
  connection: "ثم يصف صبرهم تحت السيوف: «وصبرنا تحت البوارق حتى / ركدت فيهم السيوف طويلا»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "أَنْبَضُومَعْ / جِسَلْقِسِيْ / يِوَأَبْرَقْ = فاعلاتن / متفعلن / فعلاتن — نَاكَمَاتُو / عِدُلْفُحُو / لُلْفُحُولَا = فاعلاتن / متفعلن / فاعلاتن"
  note: "دخل الخَبْن «فاعلاتن» في عَرُوض البيت فصارت «فعلاتن»، و«مستفع لن» في الشطرين فصارت «متفع لن» [@atiq، ص98]. وانقسمت «أَبْرَقْنَا» بين الشطرين، وكذلك يكتبها ابن رَشِيق: «وأبرق ... نا» [@ibn-rashiq، ج2 ص287]."
context: "بعد أن يصرف عينه عن الأطلال، يذكر لقاء قومه بَكْرًا. وقد لحّن مَعْبَد هذا البيت مع البيت الأول، ولحّنه ابن سُرَيْج مع البيت السابع [@aghani، ج5 ص62]."
variants:
  - reading: "انْتَضَوْا مَعْجِسَ الْقِسِيِّ"
    status: "رواية العقد"
    note: "من «انتضى السيف» إذا سلّه [@iqd، ج6 ص73]."
