first: لَمْ يُطِيقُوا أَنْ يَنْزِلُوا وَنَزَلْنَا
second: وَأَخُو الْحَرْبِ مَنْ أَطَاقَ النُّزُولَا
vocabulary:
- term: يَنْزِلُوا
  text: 'يُنازِلونا في القتال؛ «والنزال في الحرب: أن يتنازل الفريقان، وفي المحكم: أن ينزل الفريقان عن إبلهما إلى خيلهما فيتضاربوا» [@lisan، ج11 ص657].'
- term: أَخُو الْحَرْبِ
  text: صاحبها الذي يلازمها.
