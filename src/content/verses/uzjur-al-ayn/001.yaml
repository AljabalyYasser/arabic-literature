first: "ازْجُرِ الْعَيْنَ أَنْ تُبَكِّي الطُّلُولَا"
second: "أَنَّ فِي الصَّدْرِ مِنْ كُلَيْبٍ غَلِيلَا"
meaning: "امنع عينك من البكاء على الأطلال، فإن في الصدر من مقتل كُلَيْب حرارة كحرارة العطش لا تنطفئ."
vocabulary:
  - term: "ازْجُرِ"
    text: "امنعْ وانْهَ."
  - term: "تُبَكِّي"
    text: "تبكي على. «قال الأَصْمَعِيّ: بكيت الرجل وبكّيته، بالتشديد، كلاهما إذا بكيت عليه» [@lisan، ج14 ص83]."
  - term: "الطُّلُولَا"
    text: "جمع طَلَل، وهو ما بقي من آثار الديار."
  - term: "غَلِيلَا"
    text: "حرارة في الصدر. والغليل في أصله «شدة العطش وحرارته» [@lisan، ج11 ص499]."
syntax:
  - "«ازْجُرِ» فعل أمر، والخطاب لنفسه أو لصاحبه، و«الْعَيْنَ» مفعول به."
  - "«أَنْ تُبَكِّي الطُّلُولَا»: «أن» والفعل في تأويل مصدر، والتقدير: ازجرها عن بكاء الطلول، فحُذف حرف الجر، وحذفه كثير مع «أنْ»."
  - "«أَنَّ فِي الصَّدْرِ ... غَلِيلَا»: على تقدير لام التعليل: لأنّ في الصدر غليلًا. و«غَلِيلَا» اسم «أنّ» مؤخر، و«فِي الصَّدْرِ» خبرها مقدم."
  - "«مِنْ كُلَيْبٍ»: «من» للتعليل، أي من أجل كُلَيْب."
morphology:
  - "«تُبَكِّي» مضارع «بكّى» المضعّف، وهو بمعنى «بكى على» [@lisan، ج14 ص83]، والتضعيف يوحي بكثرة البكاء."
  - "«الطُّلُول» جمع «طَلَل» على «فُعُول»."
  - "«غَلِيل» على «فَعِيل» من «غلّ» إذا اشتد عطشه."
rhetoric:
  thesis: "مطلع يرد المطلع المألوف: لا بكاء على الأطلال، لأن في الصدر ما هو أحق بالبكاء."
  devices:
    - title: "ردّ الطلل"
      text: "كان الشعراء يبدؤون بالوقوف على الأطلال والبكاء عليها. والمُهَلْهِل يذكر الطلل ليصرف عينه عنه، ثم يعود إلى المعنى في البيت الخامس: «كيف يبكي الطلول من هو رهن / بطعان الأنام جيلًا فجيلا». فالثأر لكُلَيْب عنده أولى من الحنين إلى الديار. وهذه قراءتنا."
    - title: "الاستعارة في «غليلا»"
      text: "الغليل حرارة العطش، فجعل حزنه على كُلَيْب ورغبته في الثأر عطشًا في الصدر."
    - title: "العَجُز تعليل للصدر"
      text: "ازجر العين، لأن في الصدر غليلًا. فالنهي عن البكاء ليس جفافًا في القلب، بل لأن الحزن أكبر من الدموع."
  connection: "ثم يقول إن في الصدر حاجة «لن تقضّى / ما دعا في الغصون داعٍ هديلا»، أي ما دام الحمام يهدل."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "ازْجُرِلْعَيْ / نَأَنْ تُبَكْ / كِطْطُلُولَا = فاعلاتن / متفعلن / فاعلاتن — أَنْنَفِصْصَدْ / رِمِنْ كُلَيْ / بِنْ غَلِيلَا = فاعلاتن / متفعلن / فاعلاتن"
  note: "وزن الخفيف: «فاعلاتن مستفع لن فاعلاتن» في كل شطر. ودخل الخَبْن «مستفع لن» في الشطرين فصارت «متفع لن»، والخبن حذف الثاني الساكن [@atiq، ص98]. وهمزة «ازْجُرِ» همزة وصل، تُنطق في أول البيت مضمومة."
context: "مطلع القصيدة في رواية «الأغاني». وهو أكثر شعر المُهَلْهِل غناءً: يذكر أبو الفَرَج أن ابن مُحْرِز والغَرِيض ومَعْبَدًا وإبراهيم وإسحاق وغيرهم لحّنوا أبياتًا منها، وأكثر ألحانهم في البيت الأول [@aghani، ج5 ص61–63]. وفي «العقد» رواية أخرى للقصيدة مطلعها «بتّ ليلي بالأنعمين طويلًا» [@iqd، ج6 ص72]."
