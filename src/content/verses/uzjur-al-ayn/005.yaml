first: "كَيْفَ يَبْكِي الطُّلُولَ مَنْ هُوَ رَهْنٌ"
second: "بِطِعَانِ الْأَنَامِ جِيلًا فَجِيلَا"
meaning: "كيف يبكي على الأطلال رجل حبسه الثأر على طعان الناس، قومًا بعد قوم؟ لا وقت عنده للبكاء على الديار."
vocabulary:
  - term: "يَبْكِي الطُّلُولَ"
    text: "يبكي عليها، يقال بكاه وبكى عليه بمعنى. والطلول ما بقي شاخصًا من آثار الديار، واحدها طَلَل."
  - term: "رَهْنٌ"
    text: "محبوس على الشيء لازم له لا ينفكّ عنه. وأصل الرهن ما يُحبس عند المرتهن، «ثم استعملا في معنى المرهون فقيل: هو رهن بكذا ورهينة بكذا» [@lisan، ج13 ص188]."
  - term: "الْأَنَامِ"
    text: "الناس."
  - term: "جِيلًا فَجِيلَا"
    text: "أمّةً بعد أمّة، أي لا ينقطع."
context: "خاتمة المقطع الثاني من القصيدة، وهو يعود فيه إلى مطلعها: بدأ بـ«ازجر العين أن تبكي الطلولا»، وهنا يعلّل ذلك: من حبسه الثأر لا يبكي الديار. وقبله يدعو قلبه أن يقضي نذره من بني الحِصْن، وبعده يبدأ القتال: «أنبضوا معجس القسيّ وأبرقنا». وكل الأبيات الثمانية في «الأغاني» على هذا الترتيب [@aghani، ج5 ص61]. وفي «جيلًا فجيلا» ما وصف به ابن سَلّام المُهَلْهِل حين قال: «وزعمت العرب أنه كان يدّعي في شعره، ويتكثّر في قوله بأكثر من فعله» [@ibn-sallam، ج1 ص40]."
syntax:
  - "«كَيْفَ» اسم استفهام في محل نصب حال، والاستفهام للإنكار والتعجب."
  - "«يَبْكِي الطُّلُولَ» فعل مضارع ومفعول به، و«مَنْ» اسم موصول فاعل «يبكي»."
  - "«هُوَ رَهْنٌ» مبتدأ وخبر، والجملة صلة الموصول. و«بِطِعَانِ» متعلق بـ«رهن»، و«الأنامِ» مضاف إليه."
  - "«جِيلًا» حال، أي متتابعين، و«فَجِيلَا» معطوف عليه بالفاء التي تفيد الترتيب والتعقيب، والألف للإطلاق."
morphology:
  - "«رَهْن» مصدر «رهن يرهن» استُعمل بمعنى المفعول «مرهون» [@lisan، ج13 ص188]."
  - "«طِعان» مصدر «طاعن» على «فِعال»، وهو المطاعنة بين اثنين فأكثر."
  - "«الطُّلُول» جمع «طَلَل» على «فُعُول»."
rhetoric:
  thesis: "تعليل المطلع: لا بكاء على الأطلال لأن صاحب الثأر رهينة عند الحرب."
  devices:
    - title: "الاستفهام الإنكاري"
      text: "«كَيْفَ يَبْكِي» لا يسأل عن كيفية البكاء، بل ينكر أن يكون البكاء ممكنًا أصلًا لمن هذه حاله. فالسؤال نفي في صورة استفهام."
    - title: "الاستعارة في «رهن»"
      text: "جعل نفسه رهينة محبوسة عند الطعان، كما يُحبس الرهن عند المرتهن لا يخرج من يده حتى يُقضى الدين. يقول صاحب اللسان في مثل هذا: «فشبهه في لزومها له وعدم انفكاكه منها بالرهن في يد المرتهن» [@lisan، ج13 ص188]. والدين هنا دم كُلَيْب. وهي الاستعارة التي يقول فيها عبد القاهر: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "ردّ آخر المقطع على المطلع"
      text: "«يَبْكِي الطُّلُولَ» هنا تعيد «أن تبكّي الطلولا» في البيت الأول بلفظها تقريبًا، وبالقافية نفسها في المطلع «الطلولا». فالبيت يختم الكلام على البكاء ويغلقه قبل أن يبدأ القتال في البيت التالي."
    - title: "المبالغة في «جيلًا فجيلا»"
      text: "ثأر لا ينقضي بجيل واحد، بل يتوارثه الناس جيلًا بعد جيل. وهي مبالغة تشبه ما قاله ابن سَلّام في المُهَلْهِل من أنه يتكثّر في قوله [@ibn-sallam، ج1 ص40]. وهذه المقارنة قراءتنا."
  connection: "ثم يصف لحظة اللقاء: «أنبضوا معجس القسيّ وأبرقنا / كما توعد الفحول الفحولا»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "كَيْفَ يَبْكِطْ / طُلُولَ مَنْ / هُوَ رَهْنُنْ = فاعلاتن / متفعلن / فعِلاتن — بِطِعَانِلْ / أَنَامِ جِي / لَنْ فَجِيلَا = فعِلاتن / متفعلن / فاعلاتن"
  note: "دخل الخَبْن «مستفع لن» في الشطرين فصارت «متفع لن»، و«فاعلاتن» الأخيرة في الصدر والأولى في العجز فصارت «فعِلاتن». والخبن حذف الثاني الساكن [@atiq، ص98]."
