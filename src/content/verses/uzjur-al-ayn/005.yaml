first: كَيْفَ يَبْكِي الطُّلُولَ مَنْ هُوَ رَهْنٌ
second: بِطِعَانِ الْأَنَامِ جِيلًا فَجِيلَا
vocabulary:
- term: الطُّلُولَ
  text: ما بقي شاخصًا من آثار الديار، واحدها طَلَل.
- term: رَهْنٌ
  text: محبوس عليه لا يفارقه.
- term: جِيلًا فَجِيلَا
  text: أمّة بعد أمّة.
