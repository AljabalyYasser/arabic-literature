first: إِنَّ فِي الصَّدْرِ حَاجَةً لَنْ تَقَضَّى
second: مَا دَعَا فِي الْغُصُونِ دَاعٍ هَدِيلَا
vocabulary:
- term: لَنْ تَقَضَّى
  text: لن تُقضى ولن تنقضي.
- term: هَدِيلَا
  text: '«صوت الحمام»، وقيل: فرخ حمام؛ «تزعم الأعراب في الهديل أنه فرخ كان على عهد نوح... فيقولون إنه ليس من حمامة إلا وهي تبكي عليه» [@lisan، ج11 ص691]. والداعي: الحمام.'
