second: أَقْضِ حُزْنًا يَنُوبُنِي وَغَلِيلَا
vocabulary:
- term: يَنُوبُنِي
  text: يعاودني مرة بعد مرة.
- term: غَلِيلَا
  text: حرقة في الجوف؛ و«الغليل... شدة العطش وحرارته»، «وربما سميت حرارة الحزن والحب غليلا» [@lisan، ج11 ص499].
