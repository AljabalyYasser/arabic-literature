explained: false
first: تَفاقَدْتُمُ هَلْ أُنْكِرَنَّ مُغِيرَةً
second: مَعَ الصُّبْحِ يَهْدِيهِنَّ أَشْقَرُ مُغْرَبُ
vocabulary:
- term: تَفاقَدْتُمُ
  text: 'قال أبو الفَرَج: «يدعو عليهم بالتفاقد» [@aghani-dk، ج20 ص383]، أي فقد بعضُكم بعضًا.'
- term: هَلْ أُنْكِرَنَّ مُغِيرَةً
  text: أتراني أجهل خيلًا مغيرة إذا رأيتها؟
- term: أَشْقَرُ مُغْرَبُ
  text: 'فرس أشقر واسع الغرّة. و«المُغْرَبُ مِنَ الخَيل: الَّذِي تَتَّسِعُ غُرَّتُه فِي وجهِه حَتَّى تُجاوِزَ عَيْنَيْه» [@lisan، ج1 ص647]. ويفسّرها محققو «الأغاني» بقولهم: «المغرب: الذي يأتي الغرب، والذي يجري فرسه إلى أن يموت» [@aghani-dk، ج20 ص383، الحاشية].'
