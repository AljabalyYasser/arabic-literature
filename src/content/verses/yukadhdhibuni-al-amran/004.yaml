first: كَرادِيسَ فِيها الحَوْفَزانُ وَقَوْمُهُ
second: فَوارِسُ هَمّامٍ مَتَى يَدْعُ يَرْكَبُوا
vocabulary:
- term: الحَوْفَزانُ
  text: 'قال أبو الفَرَج: «يعني الحوفزان بن شريك الشيباني» [@aghani-dk، ج20 ص383]، وهو من سادة بَكْر بن وائل.'
- term: هَمّامٍ
  text: سيد من القوم، فرسانه يركبون متى دعاهم.
