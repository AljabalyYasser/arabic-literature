first: يُكَذِّبُنِي العَمْرَانِ عَمْرُو بْنُ جُنْدَبٍ
second: وَعَمْرُو بْنُ سَعْدٍ وَالمُكَذِّبُ أَكْذَبُ
vocabulary:
- term: العَمْرَانِ
  text: رجلان من سادة قومه، كلاهما اسمه عَمْرو، فثنّى الاسم، ثم سمّاهما في البيت.
- term: وَالمُكَذِّبُ أَكْذَبُ
  text: من يكذّب الصادق أحق بأن يوصف بالكذب.
sources:
