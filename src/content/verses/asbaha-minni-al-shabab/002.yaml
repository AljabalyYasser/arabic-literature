explained: false
first: "هَا أَنَا ذَا آمُلُ الْخُلُودَ وَقَدْ"
second: "أَدْرَكَ عَقْلِي وَمَوْلِدِي حُجُرَا"
vocabulary:
  - term: "حُجُرَا"
    text: "حُجْر أبو امرئ القيس، و«حجر أبى امرئ القيس» في ابن قُتَيْبة [@ibn-qutayba، ج1 ص364]، حُرّكت جيمه للوزن، وهو الذي يسأل عنه في البيت التالي: «أَبَا امْرِئِ الْقَيْسِ هَلْ سَمِعْتَ بِهِ»."
