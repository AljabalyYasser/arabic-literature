explained: false
first: "أَصْبَحَ مِنِّي الشَّبَابُ قَدْ حَسَرَا"
second: "إِنْ يَنْأَ عَنِّي فَقَدْ ثَوَى عُصُرَا"
vocabulary:
  - term: "حَسَرَا"
    text: "انكشف وذهب؛ «الحسر: كشطك الشيء عن الشيء» [@lisan، ج4 ص187]."
  - term: "ثَوَى عُصُرَا"
    text: "أقام دهرًا؛ «الثواء: طول المقام» [@lisan، ج14 ص125]، والعُصُر: الدهر، «العصر والعصر والعصر والعصر؛ الأخيرة عن اللحياني: الدهر» [@lisan، ج4 ص575]."
