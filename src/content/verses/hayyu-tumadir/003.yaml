first: مُتَبَذِّلًا تَبْدُو مَحَاسِنُهُ
second: يَضَعُ الْهِنَاءَ مَوَاضِعَ النُّقْبِ
vocabulary:
- term: مُتَبَذِّلًا
  text: 'في ثياب مهنته غير متزيّن؛ و«التبذّل: ترك التزين والتهيؤ بالهيئة الحسنة الجميلة على جهة التواضع» [@lisan، ج11 ص50].'
- term: الْهِنَاءَ
  text: ضرب من القطران تُطلى به الإبل [@ibn-qutayba، ج1 ص331، الحاشية].
- term: النُّقْبِ
  text: '«القطع المتفرقة من الجرب في جلد البعير» [@qali، ج2 ص161]؛ «وقيل: هي أول ما يبدو من الجرب» [@lisan، ج1 ص766].'
