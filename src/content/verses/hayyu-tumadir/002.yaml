first: مَا إِنْ رَأَيْتُ وَلَا سَمِعْتُ بِهِ
second: كَالْيَوْمِ طَالِيَ أَيْنُقٍ جُرْبِ
vocabulary:
- term: طَالِيَ
  text: "الذي يطلي الإبل بالقطران؛ يقال: هنأت البعير «إذا طليته بالهناء، وهو القطران» [@lisan، ج1 ص186]."
- term: أَيْنُقٍ جُرْبِ
  text: "نوق مصابة بالجرب؛ والأينق: جمع ناقة، و«الناقة: الأنثى من الإبل» [@lisan، ج10 ص362]، والجرب «بثر يعلو أبدان الناس والإبل» [@lisan، ج1 ص259]."
