explained: false
first: حَيُّوا تُمَاضِرَ وَارْبَعُوا صَحْبِي
second: وَقِفُوا فَإِنَّ وُقُوفَكُمْ حَسْبِي
vocabulary:
- term: تُمَاضِرَ
  text: 'اسم الخنساء الشاعرة: «تماضر بنت عَمْرو بن الشّريد» [@ibn-qutayba، ج1 ص331].'
- term: ارْبَعُوا
  text: قفوا وتمهّلوا؛ «وربع يربع إذا وقف وتحبّس» [@lisan، ج8 ص110].
- term: حَسْبِي
  text: كفايتي.
