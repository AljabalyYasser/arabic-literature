first: "لَذَاكَ أَهْيَبُ عِنْدِي إِذْ أُكَلِّمُهُ"
second: "وَقِيلَ إِنَّكَ مَسْبُورٌ وَمَسْئُولُ"
meaning: "لذاك الرسول أهيب عندي حين أكلمه، وقد قيل لي إنك مختبَر ومسؤول عما قلت. ويقول المحققون: «يريد أنه لما مثل بين يديه صلى الله عليه وسلم وكان قد قيل له قبل ذلك إنه باحث عنك ومسائلك عما نقل عنك حصل له من الرعب والفزع ما حصل» [@diwan-kaab، ص21]."
vocabulary:
- term: "أَهْيَبُ"
  text: "أشد هيبة."
- term: "مَسْبُورٌ"
  text: "مختبَر، من السَّبْر وهو الاختبار وقياس الجرح."
- term: "مَسْئُولُ"
  text: "مسؤول عما قلت."
context: "خاتمة مقطع المقام، وهي تهيئ لصورة الأسد في الأبيات التالية: «لذاك أهيب عندي ... من ضيغم»."
syntax:
- "«لَذَاكَ»: اللام للابتداء، و«ذاك» مبتدأ يشير إلى الرسول، و«أَهْيَبُ» خبر، و«مِنْ ضَيْغَمٍ» في البيت التالي متعلق بـ«أهيب»."
- "«إِذْ أُكَلِّمُهُ» ظرف، و«وَقِيلَ إِنَّكَ مَسْبُورٌ» جملة حالية، والجملة المحكية نائب فاعل «قيل»."
morphology:
- "«أَهْيَبُ» اسم تفضيل على «أَفْعَل» من «هاب»، ممنوع من الصرف."
- "«مَسْبُورٌ» و«مَسْئُولُ» اسما مفعول من «سَبَرَ» و«سَأَلَ»."
rhetoric:
  thesis: "يفصل الشاعر بين التفضيل وطرفه الثاني ليصل به إلى صورة جديدة: «أهيب ... من ضيغم»."
  devices:
  - title: "الفصل بين «أَهْيَبُ» و«مِنْ ضَيْغَمٍ»"
    text: "جاء المفضَّل عليه في البيت التالي، فاتصل البيتان وصار التفضيل جسرًا إلى وصف الأسد. وهذا التضمين، أي تعلّق البيت بما بعده، يكثر في هذا المقطع."
  - title: "«مَسْبُورٌ وَمَسْئُولُ»"
    text: "لفظتان متقاربتان في الوزن والجرس، تجعلان المحاسبة أشد: اختبار ثم سؤال."
  connection: "ثم يأتي بالمفضّل عليه: أسد من ضواري الأسود في غابة عَثَّر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "لَذَاكَ أَهْ / يَبُ عِنْ / دِي إِذْ أُكَلْ / لِمُهُو = متفعلن / فعِلن / مستفعلن / فعِلن — وَقِيلَ إِنْ / نَكَ مَسْ / بُورُنْ وَمَسْ / ئُولُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "البيت كله مخبون الأول: «لَذَاكَ أَهْ» متفعلن، و«وَقِيلَ إِنْ» متفعلن."
variants:
- reading: "فَلَهْوَ أَخْوَفُ عِنْدِي إِذْ أُكَلِّمُهُ"
  status: "رواية"
  note: "يذكرها المحققون [@diwan-kaab، ص21]، وهي رواية السيرة [@ibn-hisham، ج2 ص511]."
- reading: "وَقِيلَ إِنَّكَ مَنْسُوبٌ وَمَسْئُولُ"
  status: "رواية"
  note: "«ويروى: «منسوب» أي مسئول عن نسبك» [@diwan-kaab، ص21]، وهي رواية السيرة [@ibn-hisham، ج2 ص511]."
