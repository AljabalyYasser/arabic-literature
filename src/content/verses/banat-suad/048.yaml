first: "إِنَّ الرَّسُولَ لَسَيْفٌ يُسْتَضَاءُ بِهِ"
second: "مُهَنَّدٌ مِنْ سُيُوفِ اللَّهِ مَسْلُولُ"
meaning: "إن الرسول سيف يُهتدى بنوره، سيف هندي مسلول من سيوف الله. قال السُّكَّرِيّ: «الهاء التي في «به» راجعة على النبي صلى الله عليه وسلم» [@diwan-kaab، ص23]. ويقول المحققون: «المهنّد: السيف المطبوع من حديد الهند. وسيوف الهند أفضل السيوف» [@diwan-kaab، ص23]."
vocabulary:
- term: "يُسْتَضَاءُ بِهِ"
  text: "يُطلب منه الضياء، أي يُهتدى به."
- term: "مُهَنَّدٌ"
  text: "«السيف المطبوع من حديد الهند» [@diwan-kaab، ص23]."
- term: "مَسْلُولُ"
  text: "مُخرَج من غمده."
context: "قمة المديح ومخرج صورة الأسد: بعد خمسة أبيات في أسد مهيب، يصرّح بالممدوح. وهو من الأبيات العشرة عند ابن سَلّام [@ibn-sallam، ج1 ص101]، وفي رواية موسى بن عقبة عند أبي الفَرَج أن كعبًا أنشدها النبي صلى الله عليه وسلم في مسجده، «فلما بلغ إلى قوله» هذا البيت والبيتين بعده [@aghani-dk، ج17 ص88]. ويقف عنده عبد القاهر الجُرْجانيّ في سياق الخبر [@dalail، ص23]."
syntax:
- "«الرَّسُولَ» اسم «إنّ»، و«لَسَيْفٌ» خبرها، واللام المزحلقة للتوكيد."
- "جملة «يُسْتَضَاءُ بِهِ» صفة لـ«سيف»، و«بِهِ» نائب فاعل. و«مُهَنَّدٌ» صفة ثانية أو بدل، و«مِنْ سُيُوفِ اللَّهِ» صفة، و«مَسْلُولُ» صفة أخرى."
morphology:
- "«يُسْتَضَاءُ» مضارع «اسْتَضَاءَ» على «اسْتَفْعَلَ» للطلب، مبني للمجهول."
- "«مُهَنَّدٌ» اسم مفعول من «هَنَّدَ» المنحوت من «الهند»."
rhetoric:
  thesis: "يجمع للرسول النور والقوة: السيف يضيء ويقطع."
  devices:
  - title: "الاستعارة في «لَسَيْفٌ يُسْتَضَاءُ بِهِ»"
    text: "جعل الرسول سيفًا، ثم أعطى السيف صفة النور. والسيف يلمع حقيقةً، لكن «الاستضاءة» به هداية، فاجتمعت في الكلمة القوة والهدى. وهي الاستعارة التي يجعل فيها المتكلم الشيء الشيء، فـ«تجعل الشيءَ الشيءَ ليس به» كما يقول عبد القاهر الجُرْجانيّ [@dalail، ص67]."
  - title: "«مِنْ سُيُوفِ اللَّهِ»"
    text: "الإضافة إلى الله ترفع السيف من سلاح بشري إلى أداة إلهية، وتجعل قوته مأذونًا بها."
  - title: "الخروج من الصورة"
    text: "الأبيات 43–47 كلها في الأسد، ثم يأتي هذا البيت بلا أداة ربط. فالانتقال المفاجئ يجعل السامع يعيد قراءة الأسد كله صورةً للرسول."
  connection: "ثم يمدح المهاجرين الذين هاجروا معه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "إِنْنَرْ رَسُو / لَ لَسَيْ / فُنْ يُسْتَضَا / ءُ بِهِي = مستفعلن / فعِلن / مستفعلن / فعِلن — مُهَنْنَدُنْ / مِنْ سُيُو / فِلْ لَاهِ مَسْ / لُولُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "البيت تام إلا «لَ لَسَيْ» فعِلن في الصدر، و«مُهَنْنَدُنْ» متفعلن في أول العجز."
variants:
- reading: "إِنَّ الرَّسُولَ لَنُورٌ يُسْتَضَاءُ بِهِ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص512] وعند ابن قُتَيْبة [@ibn-qutayba، ج1 ص154]، ويذكرها محقق دلائل الإعجاز [@dalail، ص23]."
- reading: "وَصَارِمٌ مِنْ سُيُوفِ اللَّهِ مَسْلُولُ"
  status: "رواية"
  note: "عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص154]."
