first: "يَغْدُو فَيُلْحِمُ ضِرْغَامَيْنِ عَيْشُهُمَا"
second: "لَحْمٌ مِنَ الْقَوْمِ مَعْفُورٌ خَرَادِيلُ"
meaning: "يخرج في الغداة فيُطعم شبليه، وعيشهما لحم من الناس ملقى في التراب مقطّع قطعًا. قال السُّكَّرِيّ: «يُلحم ضرغامين: يطعمهما اللحم. ومعفور: مطروح في التراب. وخراديل: مقطّع»، «وضرغامين: شبلين شديدين» [@diwan-kaab، ص22]."
vocabulary:
- term: "يُلْحِمُ"
  text: "«يطعمهما اللحم» [@diwan-kaab، ص22]."
- term: "ضِرْغَامَيْنِ"
  text: "«شبلين شديدين» [@diwan-kaab، ص22]، والضرغام: الأسد."
- term: "مَعْفُورٌ"
  text: "«مطروح في التراب»، «والعَفَر: التراب بعينه» [@diwan-kaab، ص22]. وفي اللسان: «المَعْفورُ: المُترَّبُ المُعَفَّرُ بِالتُّرَابِ» [@lisan، ج4 ص584]."
- term: "خَرَادِيلُ"
  text: "«مقطّع، يقال: خرذله خرذلة إذا قطعه» [@diwan-kaab، ص22]. وفي اللسان: «وَلَحْمٌ خَرَادِيلُ ومُخَرْدَلٌ إِذا كَانَ مُقَطَّعاً» [@lisan، ج11 ص203]."
context: "يكمل صورة الأسد بأشد تفاصيلها: الأسد لا يأكل لنفسه فقط، بل يطعم صغاره لحم الناس."
syntax:
- "فاعل «يَغْدُو» ضمير الضيغم، و«ضِرْغَامَيْنِ» مفعول «يُلحم»."
- "«عَيْشُهُمَا» مبتدأ، و«لَحْمٌ» خبر، والجملة صفة لـ«ضرغامين». و«مِنَ الْقَوْمِ» صفة لـ«لحم»، و«مَعْفُورٌ» صفة ثانية، و«خَرَادِيلُ» صفة ثالثة أو حال."
morphology:
- "«يُلْحِمُ» مضارع «أَلْحَمَ» الرباعي. ويقول المحققون: «لحمه لحمًا من باب قطع: أطعمه اللحم. وفي الصحاح: «ولا تقل ألحمه والأصمعي يقوله»» [@diwan-kaab، ص22]."
- "«خَرَادِيلُ» جمع «خُرْدُولَة» على «فَعَالِيل»."
rhetoric:
  thesis: "صورة الافتراس في أقسى حالاتها: الأسد معلّم لصغاره أكل الناس."
  devices:
  - title: "تتابع الصفات في «لَحْمٌ مِنَ الْقَوْمِ مَعْفُورٌ خَرَادِيلُ»"
    text: "لحم، ثم من الناس، ثم في التراب، ثم مقطع. كل صفة تزيد الصورة رعبًا."
  - title: "وظيفة الرعب"
    text: "كلما اشتد رعب الأسد اشتد معنى «أهيب منه» في البيت 42، فالصورة كلها مديح غير مباشر."
  connection: "ثم يصفه مع أقرانه: إذا واثب قرنًا لم يتركه إلا مهزومًا."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "يَغْدُو فَيُلْ / حِمُ ضِرْ / غَامَيْنِ عَيْ / شُهُمَا = مستفعلن / فعِلن / مستفعلن / فعِلن — لَحْمُنْ مِنَلْ / قَوْمِ مَعْ / فُورُنْ خَرَا / دِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«يَغْدُو فَيُلْ» مستفعلن، و«حِمُ ضِرْ» فعِلن."
