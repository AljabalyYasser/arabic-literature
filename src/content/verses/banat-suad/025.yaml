first: "سُمْرُ الْعُجَايَاتِ يَتْرُكْنَ الْحَصَى زِيَمًا"
second: "لَمْ يَقِهِنَّ رُءُوسَ الْأُكْمِ تَنْعِيلُ"
meaning: "أخفافها سمر العصب، تترك الحصى متفرقًا حين تطؤه، ولا تحتاج إلى نعال تقيها رؤوس الآكام لصلابتها. قال السُّكَّرِيّ: «سُمْر: في ألوانها. والعُجايات: عصب باطن اليدين ... وزِيَمًا، أي متفرقة»، و«قوله: لم يقهنّ رءوس الأُكم تنعيل: لصلابة أخفافهنّ واستيقاحها» [@diwan-kaab، ص14–15]."
vocabulary:
- term: "الْعُجَايَاتِ"
  text: "«عصب باطن اليدين، واحدها عُجاية» [@diwan-kaab، ص14]. وفي اللسان: «هِيَ أَعصابُ قوائِمِ الإِبلِ والخَيْلِ واحدتُها عُجايةٌ» [@lisan، ج15 ص30]."
- term: "زِيَمًا"
  text: "«متفرقة، واحدته زِيمة» [@diwan-kaab، ص14]."
- term: "الْأُكْمِ"
  text: "التلال الصغيرة، والتسكين كما يقول المحققون «مخفف الأُكُم بضمتين» [@diwan-kaab، ص14]."
- term: "تَنْعِيلُ"
  text: "أن تُلبس النعال."
context: "آخر صفات السير قبل الهاجرة. والقوائم الخفيفة في البيت السابق تقابلها هنا الأخفاف الصلبة."
syntax:
- "«سُمْرُ» خبر لمبتدأ محذوف، أي هي سمرُ العجايات، وفي السيرة «سُمْرِ» بالجر صفةً لـ«يسرات»."
- "«يَتْرُكْنَ الْحَصَى زِيَمًا»: «الحصى» مفعول أول، و«زيمًا» مفعول ثانٍ أو حال، والجملة صفة."
- "«تَنْعِيلُ» فاعل «لَمْ يَقِهِنَّ»، و«رُءُوسَ الْأُكْمِ» مفعول ثانٍ."
morphology:
- "«يَقِهِنَّ» مضارع «وَقَى» مجزوم بحذف الياء، وحُذفت فاؤه الواو في المضارع."
- "«الْعُجَايَاتِ» جمع «عُجَايَة» جمع مؤنث سالمًا."
rhetoric:
  thesis: "الصلابة تُغني عن النعال."
  devices:
  - title: "الكناية في «لَمْ يَقِهِنَّ رُءُوسَ الْأُكْمِ تَنْعِيلُ»"
    text: "لا يقول إن أخفافها صلبة، بل يقول إنها لم تُنعل ومع ذلك تطأ رؤوس التلال. وقال أبو السَّمْح: «كأنه يقول: لا يحتجن أن يُنعلن لأنهنّ غلاظ» [@diwan-kaab، ص15]."
  - title: "«يَتْرُكْنَ الْحَصَى زِيَمًا»"
    text: "صورة الحصى يتطاير يمينًا وشمالًا. ويقرنها السُّكَّرِيّ بقول الفرزدق: «تنفي يداها الحصى في كل هاجرة / نفي الدراهيم تنقاد الصياريف» [@diwan-kaab، ص15]."
  connection: "ثم يدخل في وصف يوم الهاجرة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "سُمْرُلْ عُجَا / يَاتِ يَتْ / رُكْنَلْ حَصَا / زِيَمَنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — لَمْ يَقِهِنْ / نَ رُءُو / سَلْ أُكْمِ تَنْ / عِيلُو = مستعلن / فعِلن / مستفعلن / فعْلن"
  note: "«لَمْ يَقِهِنْ» في أول العجز مستعلن بالطيّ."
