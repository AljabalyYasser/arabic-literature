first: "عَيْرَانَةٌ قُذِفَتْ فِي اللَّحْمِ عَنْ عُرُضٍ"
second: "مِرْفَقُهَا عَنْ بَنَاتِ الزَّوْرِ مَفْتُولُ"
meaning: "ناقة صلبة كحمار الوحش، رُميت باللحم من جوانبها فامتلأت، ومرفقها مفتول بعيد عن أضلاع صدرها. قال السُّكَّرِيّ: «عَيْرانة: تشبه العَيْر لصلابتها. وقوله: عن عُرُض، أي رُميت باللحم في أعراضها»، «وبنات الزَّوْر: العضلتان والمِلاطان والمذبح» [@diwan-kaab، ص12]."
vocabulary:
- term: "عَيْرَانَةٌ"
  text: "«تشبه العَيْر لصلابتها» [@diwan-kaab، ص12]، والعَيْر: حمار الوحش. وفي اللسان: «هِيَ النَّاقَةُ الصُّلْبَةُ تَشْبيهاً بِعَيْر الْوَحْشِ» [@lisan، ج4 ص623]."
- term: "قُذِفَتْ"
  text: "«رُميت» [@diwan-kaab، ص12]."
- term: "عُرُضٍ"
  text: "جانب؛ «أي رُميت باللحم في أعراضها» [@diwan-kaab، ص12]."
- term: "بَنَاتِ الزَّوْرِ"
  text: "ما حول الصدر، والزَّوْر: «عظام الصدر» [@diwan-kaab، ص12]."
- term: "مَفْتُولُ"
  text: "«المدمج المحكم» كما يقول المحققون [@diwan-kaab، ص12]."
context: "من الأبيات السبعة التي يقول ابن هشام إنها «عَنْ غَيْرِ ابْنِ إسْحَاقَ» [@ibn-hisham، ج2 ص514]، وهي في رواية السُّكَّرِيّ. وفيه صفتان: امتلاء اللحم، وبُعد المرفق عن الصدر، وهو من محاسن الإبل لأنه يُبعد الاحتكاك عند السير."
syntax:
- "«عَيْرَانَةٌ» خبر لمبتدأ محذوف، وجملة «قُذِفَتْ» صفة لها، و«فِي اللَّحْمِ» و«عَنْ عُرُضٍ» متعلقان بـ«قُذِفَتْ»."
- "«مِرْفَقُهَا مَفْتُولُ»: مبتدأ وخبر، و«عَنْ بَنَاتِ الزَّوْرِ» متعلق بـ«مفتول» بتضمينه معنى المباعدة."
morphology:
- "«عَيْرَانَةٌ» من «العَيْر» بزيادة الألف والنون، وفي اللسان: «والأَلف وَالنُّونُ زَائِدَتَانِ» [@lisan، ج4 ص623]."
- "«قُذِفَتْ» ماض مبني للمجهول، ونائب الفاعل ضمير الناقة."
rhetoric:
  thesis: "جسد ممتلئ ومفاصل محكمة: القوة في الكتلة وفي البناء معًا."
  devices:
  - title: "الاستعارة في «قُذِفَتْ فِي اللَّحْمِ»"
    text: "جعل اللحم يُرمى على جسدها رميًا من كل جانب، فكأن خالقها رماه عليها. وقيل: «قُذفت باللحم يعني لم تُحلب فهي تامة الخلق» [@diwan-kaab، ص12]."
  - title: "التشبيه في «عَيْرَانَةٌ»"
    text: "الكلمة تحمل التشبيه في بنيتها: هي حمار الوحش في صلابته، دون أداة."
  connection: "ثم يصف رأسها: كأن وجهها حجر مستطيل."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "عَيْرَانَةُنْ / قُذِفَتْ / فِلْ لَحْمِ عَنْ / عُرُضِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — مِرْفَقُهَا / عَنْ بَنَا / تِزْ زَوْرِ مَفْ / تُولُو = مستعلن / فاعلن / مستفعلن / فعْلن"
  note: "«مِرْفَقُهَا» في أول العجز مستعلن بالطيّ."
variants:
- reading: "قُذِفَتْ بِالنَّحْضِ عَنْ عُرُضٍ"
  status: "رواية"
  note: "«ويروى: «قُذفت بالنَّحْض»» [@diwan-kaab، ص12]، والنحض: اللحم، وهي رواية السيرة [@ibn-hisham، ج2 ص507] واللسان [@lisan، ج7 ص236]. ويقول المحققون إن «في اللحم» كذا في الأصل، «والرواية المعروفة الباء وهي الأنسب» [@diwan-kaab، ص12]."
