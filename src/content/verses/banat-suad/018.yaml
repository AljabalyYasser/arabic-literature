first: "حَرْفٌ أَخُوهَا أَبُوهَا مِنْ مُهَجَّنَةٍ"
second: "وَعَمُّهَا خَالُهَا قَوْدَاءُ شِمْلِيلُ"
meaning: "ناقة ضامرة، أبوها هو أخوها، وعمّها هو خالها، من إبل كريمة، طويلة العنق خفيفة. قال السُّكَّرِيّ: «يقول: جمل حُمل على أمه فوضعت ناقة فصار الجمل أخاها وأباها»، و«من مهجّنة، أي من إبل كريمة»، «والشِّمليل: الخفيفة» [@diwan-kaab، ص11]."
vocabulary:
- term: "حَرْفٌ"
  text: "الناقة الضامرة الصلبة، شُبّهت بحرف الجبل."
- term: "مُهَجَّنَةٍ"
  text: "«من إبل كريمة، أُخذت من الهِجان» [@diwan-kaab، ص11]؛ والهِجان كما يقول المحققون: «البيض الكرام» [@diwan-kaab، ص11]. وفي اللسان: «أَراد بمُهَجَّنة أَنها مَمْنُوعَةٌ مِنْ فُحُولِ النَّاسِ إِلا مِنْ فُحُولِ بِلَادِهَا لعِتْقِها وَكَرَمِهَا» [@lisan، ج13 ص432]."
- term: "قَوْدَاءُ"
  text: "«طويلة العنق» [@diwan-kaab، ص11]."
- term: "شِمْلِيلُ"
  text: "«الخفيفة» [@diwan-kaab، ص11]. وفي اللسان: «الشِّمْلِيل، بِالْكَسْرِ: الخَفِيفة السَّريعة» [@lisan، ج11 ص371]."
context: "أول الأبيات السبعة التي يقول ابن هشام إنها «عَنْ غَيْرِ ابْنِ إسْحَاقَ» [@ibn-hisham، ج2 ص514]، أي لم ترد في رواية ابن إسحاق، وأثبتها ابن هشام من رواية أخرى. وهي في رواية السُّكَّرِيّ. وموضوعه نسب الناقة: كريمة الطرفين، لم يدخل في نسبها غريب."
syntax:
- "«حَرْفٌ» خبر لمبتدأ محذوف، أي هي حرفٌ."
- "«أَخُوهَا أَبُوهَا»: مبتدأ وخبر، والجملة صفة لـ«حرف»، وكذلك «عَمُّهَا خَالُهَا». و«مِنْ مُهَجَّنَةٍ» صفة أخرى."
- "«قَوْدَاءُ» و«شِمْلِيلُ» خبران لمبتدأ محذوف، أو صفتان لـ«حرف»."
morphology:
- "«قَوْدَاءُ» مؤنث «أَقْوَد» على «فَعْلَاء»، ممنوع من الصرف لألف التأنيث الممدودة."
- "«شِمْلِيلُ» على «فِعْلِيل»، من «شَمْلَلَ» إذا أسرع."
rhetoric:
  thesis: "لغز في النسب: كيف يكون الأب أخًا والعم خالًا؟ والجواب أن نسبها كله من إبل واحدة كريمة."
  devices:
  - title: "الإلغاز في «أَخُوهَا أَبُوهَا ... وَعَمُّهَا خَالُهَا»"
    text: "يحتاج السامع إلى أن يتأوّل ليفهم، وقد اختلف الشرّاح في تصوير المسألة: فعند السُّكَّرِيّ ثلاثة أجمال من ناقة، وعند أبي السَّمْح جمل ضرب ناقة ثم ضرب ابنته، وقال أبو سعيد: «وإنما أراد أنها متردّدة في الكرم» [@diwan-kaab، ص11]. ويقول المحققون: «هذا التصوير لهذه المسألة غير واضح» [@diwan-kaab، ص11]."
  - title: "المبالغة في الكرم"
    text: "المقصود أنها «كريمة الطرفين من أبيها وأمها» كما يقول المحققون [@diwan-kaab، ص11]. فالصورة تخدم معنى الأصالة، وإن غرُبت."
  connection: "ثم يصف ملاسة جلدها: القُراد يمشي عليه فيزلق."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "حَرْفُنْ أَخُو / هَا أَبُو / هَا مِنْ مُهَجْ / جَنَةِنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — وَعَمْمُهَا / خَالُهَا / قَوْدَاءُ شِمْ / لِيلُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«حَرْفُنْ أَخُو» مستفعلن، و«هَا أَبُو» فاعلن، كلتاهما تامة."
