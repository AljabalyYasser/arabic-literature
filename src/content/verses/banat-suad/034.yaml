first: "فَقُلْتُ خَلُّوا طَرِيقِي لَا أَبَا لَكُمُ"
second: "فَكُلُّ مَا قَدَّرَ الرَّحْمَنُ مَفْعُولُ"
meaning: "فقلت لهم: دعوا طريقي، لا أبا لكم، فكل ما قدّره الرحمن واقع لا محالة."
vocabulary:
- term: "خَلُّوا طَرِيقِي"
  text: "اتركوني أمضي."
- term: "لَا أَبَا لَكُمُ"
  text: "كلمة تقولها العرب في الغضب والزجر، ولا يُراد بها حقيقة النفي."
- term: "مَفْعُولُ"
  text: "واقع، كائن."
context: "رد كعب على الوشاة والأصدقاء: لا يستسلم للخوف، بل للقدر. وهو من الأبيات العشرة عند ابن سَلّام [@ibn-sallam، ج1 ص101]، وبعده البيت الذي صار مثلًا."
syntax:
- "«خَلُّوا طَرِيقِي» مقول القول، فعل أمر وفاعله واو الجماعة، و«طريقي» مفعول به."
- "«لَا أَبَا لَكُمُ»: «لا» نافية للجنس، و«أبا» اسمها مبني، واللام زائدة، و«لكم» خبرها."
- "«كُلُّ» مبتدأ، و«ما» موصولة مضاف إليه، و«قَدَّرَ الرَّحْمَنُ» صلتها، و«مَفْعُولُ» خبر."
morphology:
- "«خَلُّوا» أمر من «خَلَّى» المضعّف، وحُذفت لامه الياء لاتصاله بواو الجماعة."
- "«قَدَّرَ» ماض مضعّف العين، والتضعيف للتعدية والتكثير."
rhetoric:
  thesis: "التسليم للقدر يقطع الخوف: لا فائدة من الحذر."
  devices:
  - title: "الإطلاق في «فَكُلُّ مَا قَدَّرَ الرَّحْمَنُ مَفْعُولُ»"
    text: "يجعل حالته الخاصة حكمًا عامًّا، فيصير الشطر حكمة."
  - title: "«الرَّحْمَنُ»"
    text: "اختار من أسماء الله اسم الرحمة في موضع الخوف، فيمهد للعفو الذي يطلبه بعد قليل. وهذه قراءتنا."
  connection: "ثم يأتي بحكمة أعم: كل إنسان محمول يومًا على النعش."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "فَقُلْتُ خَلْ / لُو طَرِي / قِي لَا أَبَا / لَكُمُو = متفعلن / فاعلن / مستفعلن / فعِلن — فَكُلْلُ مَا / قَدْدَرَرْ / رَحْمَنُ مَفْ / عُولُو = متفعلن / فاعلن / مستعلن / فعْلن"
  note: "في العجز «رَحْمَنُ مَفْ» مستعلن بالطيّ."
variants:
- reading: "فَقُلْتُ خَلُّوا سَبِيلِي"
  status: "رواية"
  note: "«ويروى: «سبيلي»» كما يقول المحققون [@diwan-kaab، ص19]، وهي رواية السيرة [@ibn-hisham، ج2 ص510] وابن سَلّام [@ibn-sallam، ج1 ص101]."
- reading: "فَكُلُّ مَا وَعَدَ الرَّحْمَنُ مَفْعُولُ"
  status: "رواية"
  note: "عند ابن سَلّام [@ibn-sallam، ج1 ص101]."
