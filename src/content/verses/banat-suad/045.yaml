first: "إِذَا يُسَاوِرُ قِرْنًا لَا يَحِلُّ لَهُ"
second: "أَنْ يَتْرُكَ الْقِرْنَ إِلَّا وَهْوَ مَفْلُولُ"
meaning: "إذا واثب قِرنًا، أي كفئًا يقاتله، لم يحلّ له أن يتركه إلا وهو مكسور مهزوم."
vocabulary:
- term: "يُسَاوِرُ"
  text: "«يواثب» كما يقول المحققون [@diwan-kaab، ص22]."
- term: "قِرْنًا"
  text: "الكفء في القتال. وفي اللسان: «القِرْنُ، بِالْكَسْرِ: الكُفْء وَالنَّظِيرُ فِي الشَّجَاعَةِ وَالْحَرْبِ» [@lisan، ج13 ص337]."
- term: "مَفْلُولُ"
  text: "مهزوم مكسور الحدّ."
context: "من الأبيات السبعة التي يقول ابن هشام إنها «عَنْ غَيْرِ ابْنِ إسْحَاقَ» [@ibn-hisham، ج2 ص514]، وهي في رواية السُّكَّرِيّ. وفيه صفة الأسد مع خصمه بعد صفته مع صغاره."
syntax:
- "«إِذَا يُسَاوِرُ قِرْنًا» شرط، وجوابه «لَا يَحِلُّ لَهُ» بلا فاء، وهو جائز في الشعر."
- "«أَنْ يَتْرُكَ الْقِرْنَ» مصدر مؤول فاعل «يحلّ». و«إِلَّا وَهْوَ مَفْلُولُ» استثناء من أعم الأحوال، والجملة حال."
morphology:
- "«يُسَاوِرُ» مضارع «سَاوَرَ» على «فاعَلَ» للمشاركة."
- "«مَفْلُولُ» اسم مفعول من «فَلَّ» المضعّف."
rhetoric:
  thesis: "الأسد لا يترك معركة دون نصر."
  devices:
  - title: "الاستعارة في «لَا يَحِلُّ لَهُ»"
    text: "جعل ترك القِرن قبل هزيمته حرامًا على الأسد، كأن له شريعة لا يخالفها."
  - title: "رد العجز على الصدر في «قِرْنًا ... الْقِرْنَ»"
    text: "ذكر القِرن في الصدر نكرة، ثم أعاده في العجز معرفة، فثبتت صورة الخصم الواحد."
  connection: "ثم يصف خوف الحيوان والناس منه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "إِذَا يُسَا / وِرُ قِرْ / نَنْ لَا يَحِلْ / لُ لَهُو = متفعلن / فعِلن / مستفعلن / فعِلن — أَنْ يَتْرُكَلْ / قِرْنَ إِلْ / لَا وَهْوَ مَفْ / لُولُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«إِذَا يُسَا» متفعلن، و«وِرُ قِرْ» فعِلن، وكلتاهما مخبونة."
variants:
- reading: "إِلَّا وَهْوَ مَثْلُولُ"
  status: "رواية الأَصْمَعِيّ"
  note: "«وروى الأصمعي: «مثلول» أي مكسور، ومنه ثُلّ عرشه» [@diwan-kaab، ص22]."
- reading: "إِلَّا وَهْوَ مَجْدُولُ"
  status: "رواية"
  note: "«أي مُلقى بالجَدالة وهي الأرض» كما يقول المحققون [@diwan-kaab، ص22]، وهي في اللسان [@lisan، ج13 ص337]."
