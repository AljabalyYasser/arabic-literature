first: "كُلُّ ابْنِ أُنْثَى وَإِنْ طَالَتْ سَلَامَتُهُ"
second: "يَوْمًا عَلَى آلَةٍ حَدْبَاءَ مَحْمُولُ"
meaning: "كل ابن امرأة، وإن طالت حياته، سيُحمل يومًا على النعش. قال السُّكَّرِيّ: «الآلة: الحالة. وحدباء: معوجّة» [@diwan-kaab، ص19]. ويقول المحققون: «كان الأنسب أن يفسّر الآلة هنا بالنعش كما فسّره الجوهري وأنشد عليه هذا البيت» [@diwan-kaab، ص19]. وفي اللسان: «يُرِيدُ: عَلَى النَّعْشِ؛ وَقِيلَ: أَراد بِالْآلَةِ الحالةَ، وبالحَدْباءِ الصَعْبةَ الشَّدِيدَةَ» [@lisan، ج1 ص301]."
vocabulary:
- term: "ابْنِ أُنْثَى"
  text: "كل إنسان، لأن كل إنسان وُلد من امرأة."
- term: "آلَةٍ"
  text: "النعش، أو الحالة [@diwan-kaab، ص19] [@lisan، ج1 ص301]."
- term: "حَدْبَاءَ"
  text: "«معوجّة» [@diwan-kaab، ص19]، أي محدّبة الظهر كالنعش، أو صعبة على المعنى الثاني."
context: "الحكمة التي تجمع ما قبلها: إذا كان الموت لا مفر منه، فلا معنى للخوف من وعيد الوشاة. وهو من الأبيات العشرة عند ابن سَلّام [@ibn-sallam، ج1 ص101]، وأكثر أبيات القصيدة جريانًا مثلًا."
syntax:
- "«كُلُّ» مبتدأ، و«ابْنِ» مضاف إليه، و«أُنْثَى» مضاف إليه ثانٍ، و«مَحْمُولُ» خبر."
- "«وَإِنْ طَالَتْ سَلَامَتُهُ»: الواو حالية أو اعتراضية، و«إن» شرطية حُذف جوابها لدلالة الكلام عليه."
- "«يَوْمًا» ظرف متعلق بـ«محمول»، و«عَلَى آلَةٍ» كذلك، و«حَدْبَاءَ» صفة لـ«آلة» مجرورة بالفتحة لأنها ممنوعة من الصرف."
morphology:
- "«حَدْبَاءَ» مؤنث «أَحْدَب» على «فَعْلاء»."
- "«آلَةٍ» على «فَعَلَة»، وأصل ألفها واو من «آل يؤول»."
rhetoric:
  thesis: "حكمة عامة في الموت، صيغت بلغة تتجنب ذكر الموت صراحة."
  devices:
  - title: "الكناية في «يَوْمًا عَلَى آلَةٍ حَدْبَاءَ مَحْمُولُ»"
    text: "لم يقل «يموت»، بل ذكر ما يلزم الموت: الحمل على النعش. وهي الكناية التي يقول فيها عبد القاهر الجُرْجانيّ إن المتكلم يجيء «إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
  - title: "«ابْنِ أُنْثَى»"
    text: "كناية عن الإنسان تذكّر بضعفه وأصله، أبلغ من «كل إنسان»."
  - title: "«وَإِنْ طَالَتْ سَلَامَتُهُ»"
    text: "احتراس يسد الباب على من يظن أن طول العمر ينجي."
  connection: "ثم يصل إلى ما يهمه: الوعيد، والعفو المرجو."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "كُلْلُبْ نِ أُنْ / ثَا وَإِنْ / طَالَتْ سَلَا / مَتُهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — يَوْمَنْ عَلَا / ءَالَةِنْ / حَدْبَاءَ مَحْ / مُولُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "البيت تام التفعيلات إلا العروض والضرب: «مَتُهُو» فعِلن، و«مُولُو» فعْلن."
variants:
