first: "شُمُّ الْعَرَانِينِ أَبْطَالٌ لَبُوسُهُمُ"
second: "مِنْ نَسْجِ دَاوُدَ فِي الْهَيْجَا سَرَابِيلُ"
meaning: "مرتفعو الأنوف أبطال، لباسهم في الحرب دروع من نسج داود. قال السُّكَّرِيّ: «العرانين: الأنوف»، «والشَّمَم: حدّة في طرف الأنف مع تشمير» [@diwan-kaab، ص23]."
vocabulary:
- term: "شُمُّ"
  text: "جمع أشمّ، والشَّمَم: ارتفاع في قصبة الأنف، كناية عن العزة."
- term: "الْعَرَانِينِ"
  text: "«الأنوف، وتكون أطراف الأنوف، الواحد عِرْنين» [@diwan-kaab، ص23]."
- term: "لَبُوسُهُمُ"
  text: "ما يلبسونه."
- term: "نَسْجِ دَاوُدَ"
  text: "الدروع، لأن داود عليه السلام عُرف بصنعة الدروع."
- term: "الْهَيْجَا"
  text: "الحرب."
- term: "سَرَابِيلُ"
  text: "جمع سربال، وهو القميص، ويطلق على الدروع. وفي اللسان: «وَتُطْلَقُ السَّرَابِيلُ عَلَى الدُّرُوعِ؛ وَمِنْهُ قَوْلَ كَعْبِ بْنِ زُهَيْرٍ» [@lisan، ج11 ص335]."
context: "الصفة الإيجابية الأولى للمهاجرين: العزة والسلاح. ويرويه عبد القاهر الجُرْجانيّ في خبر كعب [@dalail، ص23]."
syntax:
- "«شُمُّ» خبر لمبتدأ محذوف، أي هم شمّ العرانين، و«أَبْطَالٌ» خبر ثانٍ."
- "«لَبُوسُهُمُ» مبتدأ، و«سَرَابِيلُ» خبره، و«مِنْ نَسْجِ دَاوُدَ» صفة لـ«سرابيل» قُدّمت فصارت حالًا، و«فِي الْهَيْجَا» ظرف."
morphology:
- "«شُمُّ» جمع «أَشَمّ» على «فُعْل»."
- "«الْهَيْجَا» تمدّ وتقصر، وقصرها هنا للوزن."
- "«دَاوُدَ» ممنوع من الصرف للعلمية والعجمة."
rhetoric:
  thesis: "صورة الفارس الكامل: وجه عزيز، ونفس شجاعة، وجسد في الحديد."
  devices:
  - title: "الكناية في «شُمُّ الْعَرَانِينِ»"
    text: "ارتفاع الأنف كناية عن العزة والأنفة، وهي كناية مشهورة في المديح."
  - title: "الكناية في «نَسْجِ دَاوُدَ»"
    text: "كنّى عن الدروع بنسبتها إلى أشهر صانعيها. والكناية بالمعنى التابع كما يقول عبد القاهر الجُرْجانيّ: «معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
  connection: "ثم يصف هذه الدروع: بيض سابغة كحلق القفعاء."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "شُمْمُلْ عَرَا / نِينِ أَبْ / طَالُنْ لَبُو / سُهُمُو = مستفعلن / فاعلن / مستفعلن / فعِلن — مِنْ نَسْجِ دَا / وُدَ فِلْ / هَيْجَا سَرَا / بِيلُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«شُمْمُلْ عَرَا» مستفعلن، و«نِينِ أَبْ» فاعلن. والعجز «مِنْ نَسْجِ دَا» مستفعلن، و«وُدَ فِلْ» فعِلن."
