first: "نَوَّاحَةٌ رِخْوَةُ الضَّبْعَيْنِ لَيْسَ لَهَا"
second: "لَمَّا نَعَى بِكْرَهَا النَّاعُونَ مَعْقُولُ"
meaning: "نوّاحة كثيرة النوح، رخوة العضدين لكثرة ما تضرب بهما، ليس لها عقل حين نعى الناعون إليها أول أولادها. قال السُّكَّرِيّ: «بِكْرها: أول ولدها. والمعقول: العقل»، و«رِخوة الضَّبْعين: يريد أنها شديدة الحركة والالتدام» [@diwan-kaab، ص18]."
vocabulary:
- term: "الضَّبْعَيْنِ"
  text: "«العضدان والواحد ضَبْع» [@diwan-kaab، ص18]."
- term: "بِكْرَهَا"
  text: "«أول ولدها» [@diwan-kaab، ص18]."
- term: "النَّاعُونَ"
  text: "الذين يُخبرون بالموت."
- term: "مَعْقُولُ"
  text: "«العقل، يقال: ما لفلان معقول» [@diwan-kaab، ص18]."
- term: "الِالْتِدَام"
  text: "من شرح السُّكَّرِيّ، ويقول المحققون: «التدم النساء: إذا ضربن وجوههن في المآتم» [@diwan-kaab، ص18]."
context: "يكمل صفة النائحة: يجعلها أشد الناس حزنًا، فيدها أسرع الأيدي حركة، فتكون يدا الناقة كذلك."
syntax:
- "«نَوَّاحَةٌ» صفة لـ«عيطل» قُطعت إلى الرفع، أي هي نوّاحة، و«رِخْوَةُ الضَّبْعَيْنِ» صفة ثانية."
- "«لَيْسَ لَهَا ... مَعْقُولُ»: «لها» خبر «ليس» مقدّم، و«معقول» اسمها مؤخر. و«لَمَّا نَعَى بِكْرَهَا النَّاعُونَ» ظرف معترض."
morphology:
- "«نَوَّاحَةٌ» صيغة مبالغة على «فَعَّالة»."
- "«مَعْقُولُ» مصدر جاء على وزن «مفعول»، ويقول محققو السيرة: «وَهُوَ من المصادر الَّتِي جَاءَت على «مفعول» كمسعور وميسور ومفتون» [@ibn-hisham، ج2 ص510]."
rhetoric:
  thesis: "الحزن الذي يُذهب العقل يجعل الجسد يتحرك بلا وعي، وهذا ما يريده لناقته: حركة لا تعرف التعب."
  devices:
  - title: "الكناية في «رِخْوَةُ الضَّبْعَيْنِ»"
    text: "كنّى بلين العضدين عن كثرة الحركة والضرب، كما قال السُّكَّرِيّ."
  - title: "المبالغة في «بِكْرَهَا»"
    text: "جعل المصاب أول الأولاد، وهو أشد على الأم. ومحققو السيرة يرون فيه أنها «لَا تحس بالإعياء والتعب، شَأْن هَذِه النَّاقة الَّتِي لَا تحس بإعياء وَلَا تَعب فِي سَيرهَا» [@ibn-hisham، ج2 ص510]."
  connection: "ثم يصف فعلها في ثيابها: تشق صدرها وتمزق درعها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "نَوْوَاحَةُنْ / رِخْوَةُضْ / ضَبْعَيْنِ لَيْ / سَ لَهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — لَمْمَا نَعَا / بِكْرَهَنْ / نَاعُونَ مَعْ / قُولُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "البيت تام التفعيلات: «نَوْوَاحَةُنْ» مستفعلن، و«رِخْوَةُضْ» فاعلن."
