first: "فِي عُصْبَةٍ مِنْ قُرَيْشٍ قَالَ قَائِلُهُمْ"
second: "بِبَطْنِ مَكَّةَ لَمَّا أَسْلَمُوا زُولُوا"
meaning: "في جماعة من قريش، قال قائلهم في بطن مكة حين أسلموا: انتقلوا. يقول المحققون: «زولوا: انتقلوا من مكة إلى المدينة، ويعني بذلك الهجرة» [@diwan-kaab، ص23]."
vocabulary:
- term: "عُصْبَةٍ"
  text: "جماعة."
- term: "بِبَطْنِ مَكَّةَ"
  text: "في وسطها."
- term: "زُولُوا"
  text: "«انتقلوا من مكة إلى المدينة» [@diwan-kaab، ص23]. وفي اللسان: «أَي انْتَقِلوا عَنْ مَكَّة مُهاجِرِين إِلى المدينةِ» [@lisan، ج11 ص315]."
context: "بداية مدح المهاجرين (49–55). ويذكر ابن إسحاق أن كعبًا «خَصَّ الْمُهَاجِرِينَ مِنْ قُرَيْشٍ» بمدحته لأن رجلًا من الأنصار وثب عليه [@ibn-hisham، ج2 ص514]. وفي رواية أبي الفَرَج عن محمد بن الضحاك عن أبيه: «عنى كعب بن زهير بقوله: * فى فتية من قريش قال قائلهم * عمر بن الخطاب رضى الله عنه» [@aghani-dk، ج17 ص91]."
syntax:
- "«فِي عُصْبَةٍ» متعلق بمحذوف حال من «الرسول» في البيت السابق، أي كائنًا في عصبة."
- "جملة «قَالَ قَائِلُهُمْ» صفة لـ«عصبة»، و«زُولُوا» مقول القول. و«لَمَّا أَسْلَمُوا» ظرف."
morphology:
- "«زُولُوا» أمر من «زَالَ يَزُولُ»، أجوف واوي، بمعنى انتقل."
- "«قَائِلُهُمْ» اسم فاعل من «قال»."
rhetoric:
  thesis: "يجعل الهجرة كلمة واحدة: «زولوا»."
  devices:
  - title: "الإيجاز في «زُولُوا»"
    text: "الهجرة كلها، بتركها الأهل والمال، في كلمة واحدة في القافية. والاسم المبهم «قائلهم» يترك القائل للتأويل، وقد فسّره الرواة بعمر."
  - title: "الجناس المكمّل في البيت التالي"
    text: "«زولوا» في آخر هذا البيت، و«زالوا فما زال» في أول التالي: اللفظ يتردد بثلاث صيغ، فتربط الكلمة البيتين."
  connection: "ثم يقول: زالوا، فما زال منهم ضعيف ولا جبان."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "فِي عُصْبَةِنْ / مِنْ قُرَيْ / شِنْ قَالَ قَا / ئِلُهُمْ = مستفعلن / فاعلن / مستفعلن / فعِلن — بِبَطْنِ مَكْ / كَةَ لَمْ / مَا أَسْلَمُو / زُولُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«بِبَطْنِ مَكْ» في أول العجز متفعلن، و«كَةَ لَمْ» فعِلن، وكلتاهما مخبونة."
variants:
- reading: "فِي فِتْيَةٍ مِنْ قُرَيْشٍ"
  status: "رواية"
  note: "«وروى: «في فتية»» كما يقول المحققون [@diwan-kaab، ص23]، وهي رواية ابن سَلّام [@ibn-sallam، ج1 ص101] وأبي الفَرَج [@aghani-dk، ج17 ص88، ص91]."
