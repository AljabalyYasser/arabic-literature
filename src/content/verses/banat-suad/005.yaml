first: "تَجْلُو الرِّيَاحُ الْقَذَى عَنْهُ وَأَفْرَطَهُ"
second: "مِنْ صَوْبِ سَارِيَةٍ بِيضٌ يَعَالِيلُ"
meaning: "الرياح تكشف القذى عن ذلك الماء فتصفّيه، وقد ملأته سيول بيض متتابعة من مطر سحابة سرت بالليل. قال السُّكَّرِيّ: «وأفرطه: ملأه. وسارية: سحابة تسري فتمطر بالليل»، «فهذه اليعاليل ملأت مواضع الماء في الأبطح، يعني سيولًا» [@diwan-kaab، ص7]."
vocabulary:
- term: "الْقَذَى"
  text: "ما يقع في الماء من عود أو تراب."
- term: "أَفْرَطَهُ"
  text: "«ملأه» [@diwan-kaab، ص7]."
- term: "صَوْبِ"
  text: "المطر ينزل."
- term: "سَارِيَةٍ"
  text: "«سحابة تسري فتمطر بالليل» [@diwan-kaab، ص7]. وفي اللسان: «السَّحَابَةُ تُمْطِر لَيْلًا، فاعِلة مِنَ السُّرى سَيرِ الليلِ» [@lisan، ج14 ص382]."
- term: "يَعَالِيلُ"
  text: "في الديوان ثلاثة أقوال: الغدران تملؤها السيول، و«مرة بعد مرة»، و«مطّردة طوال» [@diwan-kaab، ص7]. وفي اللسان: «سَحَائِبُ بَعْضُهَا فَوْقَ بَعْضٍ، الْوَاحِدُ يَعْلُولٌ» [@lisan، ج11 ص472]."
context: "آخر أبيات الثغر. يبلغ الماء نهاية الصفاء: الريح تنقيه والمطر يجدده. ثم يقطع الوصف فجأة بالتعجب من سعاد في البيت التالي."
syntax:
- "«الرِّيَاحُ» فاعل «تَجْلُو»، و«الْقَذَى» مفعول به، و«عَنْهُ» متعلق بـ«تَجْلُو»، والضمير للماء."
- "«وَأَفْرَطَهُ»: الواو حالية أو عاطفة، و«بِيضٌ» فاعل «أفرط»، و«يَعَالِيلُ» صفة لـ«بِيضٌ». و«مِنْ صَوْبِ سَارِيَةٍ» متعلق بـ«أَفْرَطَهُ»، قُدّم على الفاعل."
- "يقول السُّكَّرِيّ: «عنه: يريد عن الظَّلْم» [@diwan-kaab، ص7]، ويقول المحققون إن «الظاهر أن مرجع الضمير هو الماء البارد الصافي الذي تحدّث عنه في البيت السابق» [@diwan-kaab، ص7]. والثاني أقرب، لأن الريح والسحاب صفة الماء."
morphology:
- "«يَعَالِيلُ» جمع «يَعْلُول» على صيغة منتهى الجموع، والياء في أوله زائدة كما يقول صاحب اللسان: «وَالْيَاءُ زَائِدَةٌ» [@lisan، ج11 ص472]."
- "«سَارِيَةٍ» اسم فاعل مؤنث من «سَرَى» إذا سار ليلًا، غلب على السحابة الليلية."
rhetoric:
  thesis: "صورة متحركة: ريح تكنس الماء، ومطر يملؤه. والغاية أن الريق الذي يشبهه لا يشوبه شيء."
  devices:
  - title: "التقديم والتأخير في «وَأَفْرَطَهُ مِنْ صَوْبِ سَارِيَةٍ بِيضٌ يَعَالِيلُ»"
    text: "أخّر الفاعل «بِيضٌ يَعَالِيلُ» إلى آخر البيت، فبقي السامع ينتظر ما الذي ملأ الماء، ثم جاءت القافية بالجواب."
  - title: "«بِيضٌ»"
    text: "لون السحاب أو السيل الصافي، وهو يناسب بياض الأسنان في البيت الثالث، فيعود آخر الوصف إلى أوله."
  connection: "ثم يقطع الوصف ويلتفت إلى أخلاقها: يا ويحها لو صدقت!"
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "تَجْلُرْ رِيَا / حُلْ قَذَا / عَنْهُ وَأَفْ / رَطَهُو = مستفعلن / فاعلن / مستعلن / فعِلن — مِنْ صَوْبِ سَا / رِيَةِنْ / بِيضُنْ يَعَا / لِيلُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«عَنْهُ وَأَفْ» مستعلن، دخلها الطيّ، وهو حذف الرابع الساكن من «مستفعلن». وتُشبع هاء «عَنْهُ» أو لا تُشبع، والوزن يقبل الوجهين."
variants:
- reading: "تَنْفِي الرِّيَاحُ الْقَذَى عَنْهُ وَأَفْرَطَهُ"
  status: "رواية"
  note: "يذكرها المحققون [@diwan-kaab، ص7]، وهي رواية السيرة [@ibn-hisham، ج2 ص504] واللسان [@lisan، ج14 ص382]."
