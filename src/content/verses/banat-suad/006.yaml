first: "يَا وَيْحَهَا خُلَّةً لَوْ أَنَّهَا صَدَقَتْ"
second: "مَا وَعَدَتْ أَوْ لَوَ انَّ النُّصْحَ مَقْبُولُ"
meaning: "يا ويحها من صاحبة، ما أتمّها لو صدقت في وعدها، أو لو قبلت النصح! قال السُّكَّرِيّ: «يقول: ما أتمّها لو لم يكذب موعدها ولو قبلت نصحي لها في أمري، ولكن هذا مما ينقصها» [@diwan-kaab، ص8]."
vocabulary:
- term: "وَيْحَهَا"
  text: "كلمة ترحّم وتعجّب، تقال لمن وقع في بلية. ويرويها غير السُّكَّرِيّ «ويلُ امّها» و«أكرم بها» [@diwan-kaab، ص7]، وهي في الأخيرتين للتعجب والمدح."
- term: "خُلَّةً"
  text: "«يقال للذكر وكذلك للأنثى» [@diwan-kaab، ص8]، أي الصاحب والصاحبة."
- term: "النُّصْحَ"
  text: "ما ينصحها به، يريد: لو قبلت نصيحته في أمره."
context: "بداية مقطع الخلّة الكاذبة (6–12): يترك جمال سعاد إلى أخلاقها، فيعدّ عيوبها: إخلاف الوعد، والتلوّن، ونقض العهد. ويروي أبو الفَرَج أن كعبًا «عرّض بالأنصار فى قصيدته فى عدة مواضع»، منها مثل عرقوب في البيت 10 [@aghani-dk، ج17 ص89]."
syntax:
- "«يَا» حرف نداء أو تنبيه، و«وَيْحَهَا» مفعول مطلق لفعل محذوف، أي ألزمها الله ويحًا، والضمير لسعاد."
- "«خُلَّةً» تمييز منصوب يفسّر الضمير المبهم في «ويحها»، كقولهم: يا لها امرأة."
- "«لَوْ أَنَّهَا صَدَقَتْ»: «لو» شرطية، وجوابها محذوف، تقديره: لكانت أتمّ الخلائل. و«مَا وَعَدَتْ» مفعول «صَدَقَتْ»."
- "«أَوْ لَوَ انَّ النُّصْحَ مَقْبُولُ»: نقل حركة الهمزة من «أَنَّ» إلى واو «لو» وحذفها، و«النُّصْحَ» اسم «أنّ»، و«مَقْبُولُ» خبرها."
morphology:
- "«لَوَ انَّ» أصلها «لَوْ أَنَّ»، والتخفيف بنقل حركة الهمزة إلى الساكن قبلها لغة جائزة، ويحفظ بها الوزن."
- "«خُلَّةً» مصدر في الأصل، ثم وُصف به فاستوى فيه المذكر والمؤنث كما قال السُّكَّرِيّ."
rhetoric:
  thesis: "تعجّب يجمع المدح واللوم: هي كاملة لولا خلقها. فاللوم يأتي في صورة التمني."
  devices:
  - title: "حذف جواب «لو»"
    text: "لم يقل ما الذي كانت ستكونه لو صدقت، فترك السامع يقدّر أكمل ما يمكن. وهذا من الحذف الذي يقول فيه عبد القاهر الجُرْجانيّ: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
  - title: "«يَا وَيْحَهَا»"
    text: "نداء لا يُراد به النداء، بل التعجب والتحسّر."
  connection: "ثم يستدرك بـ«لكنّ»: هي خلّة خُلط الكذب والإخلاف بدمها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "يَا وَيْحَهَا / خُلْلَةَنْ / لَوْ أَنْنَهَا / صَدَقَتْ = مستفعلن / فاعلن / مستفعلن / فعِلن — مَا وَعَدَتْ / أَوْ لَوَنْ / نَنْ نُصْحَ مَقْ / بُولُو = مستعلن / فاعلن / مستفعلن / فعْلن"
  note: "«مَا وَعَدَتْ» في أول العجز «مُسْتَعِلُنْ» بالطيّ. ونقل حركة الهمزة في «لَوَ انْ» يجعل «أَوْ لَوَنْ» تفعيلة «فاعلن» تامة."
variants:
- reading: "يَا لَهَا خُلَّةً لَوْ أَنَّهَا صَدَقَتْ / بِوَعْدِهَا"
  status: "رواية"
  note: "رواية السيرة [@ibn-hisham، ج2 ص505]."
- reading: "وَيْلُ امِّهَا خُلَّةً"
  status: "رواية"
  note: "يذكرها المحققون [@diwan-kaab، ص7]، وعند عبد القاهر «ويلمها خُلّةً ... مَوْعودَها» [@dalail، ص23]."
- reading: "مَوْعُودَهَا"
  status: "رواية"
  note: "مكان «ما وعدت» [@diwan-kaab، ص7]."
