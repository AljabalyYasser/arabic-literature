first: "يَمْشُونَ مَشْيَ الْجِمَالِ الزُّهْرِ يَعْصِمُهُمْ"
second: "ضَرْبٌ إِذَا عَرَّدَ السُّودُ التَّنَابِيلُ"
meaning: "يمشون مشي الإبل البيض الضخمة في وقار، يحميهم ضرب السيوف حين يفرّ القصار السود. قال السُّكَّرِيّ: «يعصمهم: يمنعهم. ويقال إنه عرّض بالأنصار في هذا البيت فيما قال الذي أراد قتله عند النبي صلى الله عليه وسلم. والزُّهْر: البيض»، «وعرّد: فرّ، ويقال: عرّد: نكل وجبن» [@diwan-kaab، ص24–25]."
vocabulary:
- term: "الزُّهْرِ"
  text: "«البيض» [@diwan-kaab، ص24]."
- term: "يَعْصِمُهُمْ"
  text: "«يمنعهم» [@diwan-kaab، ص24]."
- term: "عَرَّدَ"
  text: "«فرّ»، «ويقال: عرّد: نكل وجبن» [@diwan-kaab، ص25]. وفي اللسان: «والتَّعْرِيدُ: الفِرارُ» [@lisan، ج3 ص288]."
- term: "التَّنَابِيلُ"
  text: "«جمع تِنْبال (بكسر أوله) وهو القصير» كما يقول المحققون [@diwan-kaab، ص24]. وفي اللسان: «أَي القِصَار» [@lisan، ج11 ص80]."
context: "أشهر أبيات القصيدة في أخبارها. يروي ابن إسحاق عن عاصم بن عمر بن قتادة أن كعبًا «لَمَّا قَالَ: «إذَا عَرَّدَ السُّودُ التَّنَابِيلُ»، وَإِنَّمَا يُرِيدُنَا مَعْشَرَ الْأَنْصَارِ، لِمَا كَانَ صَاحِبُنَا صَنَعَ بَهْ مَا صَنَعَ»، غضبت عليه الأنصار، فمدحهم بقصيدة أخرى [@ibn-hisham، ج2 ص514]. وفي رواية ابن سَلّام أن النبي صلى الله عليه وسلم نظر إلى من عنده من قريش «أى اسمعوا حَتَّى قَالَ» هذا البيت، «يعرض بالأنصار لغلظتهم كَانَت عَلَيْهِ» [@ibn-sallam، ج1 ص102]. ويجعله ابن رَشِيق مثالًا للتعريض [@ibn-rashiq، ج1 ص304]."
syntax:
- "«مَشْيَ الْجِمَالِ» مفعول مطلق مبيّن للنوع، و«الزُّهْرِ» صفة لـ«الجمال»."
- "«يَعْصِمُهُمْ ضَرْبٌ» جملة حالية، و«ضَرْبٌ» فاعل. و«إِذَا عَرَّدَ السُّودُ التَّنَابِيلُ» ظرف متعلق بـ«يعصمهم»، و«التنابيل» صفة لـ«السود»."
morphology:
- "«الزُّهْرِ» جمع «أَزْهَر» على «فُعْل»."
- "«التَّنَابِيلُ» جمع «تِنْبَال» على «فَعَالِيل»، والتاء فيه أصلية عند بعضهم وزائدة عند ثعلب كما في اللسان [@lisan، ج11 ص80]."
rhetoric:
  thesis: "مدح صريح للمهاجرين، وذمّ مضمر لغيرهم."
  devices:
  - title: "التعريض في «إِذَا عَرَّدَ السُّودُ التَّنَابِيلُ»"
    text: "لم يسمّ الأنصار، لكن الصفة فهمها السامعون إشارة إليهم. ويورد ابن رَشِيق البيت في باب التعريض ويقول: «فقيل: إنه عرض في هذا البيت بالأنصار، فغضبت الأنصار، وقال المهاجرون: لم تمدحنا إذ ذممتهم» [@ibn-rashiq، ج1 ص304]. والتعريض: أن يُفهم المعنى من الكلام دون أن يُصرّح به."
  - title: "التشبيه في «مَشْيَ الْجِمَالِ الزُّهْرِ»"
    text: "شبّه مشيهم بمشي الإبل البيض في الامتداد والوقار. وينقل المحققون عن ابن هشام: «يصفهم في هذا البيت بامتداد القامة وعظم الخلق وبياض البشرة والرفق في المشي وذلك دليل الوقار والسودد» [@diwan-kaab، ص24]."
  - title: "المقابلة بين «الزُّهْرِ» و«السُّودُ»"
    text: "البيض الطوال يمشون، والسود القصار يفرّون: لون مقابل لون، وقامة مقابل قامة."
  connection: "ثم يصف ثباتهم في النصر والهزيمة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "يَمْشُونَ مَشْ / يَلْ جِمَا / لِزْ زُهْرِ يَعْ / صِمُهُمْ = مستفعلن / فاعلن / مستفعلن / فعِلن — ضَرْبُنْ إِذَا / عَرْرَدَسْ / سُودُتْ تَنَا / بِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«ضَرْبُنْ إِذَا» مستفعلن، و«عَرْرَدَسْ» فاعلن."
variants:
- reading: "يَمْشُونَ مَشْيَ الْجِمَالِ الْجُرْبِ"
  status: "رواية"
  note: "«قال أبو سعيد: الجُرْب: المطليّة بالقَطِران، فأراد أن عليها الدروع فهم يشبهون الجُرْب» [@diwan-kaab، ص25]."
- reading: "يَمْشُونَ مَشْيَ الْجِمَالِ الْبُهْمِ"
  status: "رواية"
  note: "عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص154]."
