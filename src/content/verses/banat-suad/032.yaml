first: "يَسْعَى الْوُشَاةُ بِجَنْبَيْهَا وَقَوْلُهُمُ"
second: "إِنَّكَ يَا ابْنَ أَبِي سُلْمَى لَمَقْتُولُ"
meaning: "يسعى الوشاة حول سعاد، ويقولون: إنك يا ابن أبي سُلْمى مقتول. ويقول المحققون إن الضمير «راجع الى سعاد، أي إن الوشاة يسعون إليها بوعيد رسول الله صلى الله عليه وسلم إياه» [@diwan-kaab، ص19]."
vocabulary:
- term: "الْوُشَاةُ"
  text: "«الذين يشون الكذب ويزيّنونه» [@diwan-kaab، ص19]."
- term: "بِجَنْبَيْهَا"
  text: "بجانبيها، أي حولها. ويروى «جنابيها» «أي حواليها» [@diwan-kaab، ص19]."
- term: "ابْنَ أَبِي سُلْمَى"
  text: "كعب نفسه، نسبه إلى جده أبي سُلْمى، أبي زهير."
context: "أول المرحلة الثانية من القصيدة، وأول أبيات الخوف (32–35). يعود من الصحراء إلى الحاضر: الوشاة والوعيد. ويروي ابن إسحاق أن كعبًا لما أتاه كتاب بجير «أَرْجَفَ بِهِ مَنْ كَانَ فِي حَاضِرِهِ مِنْ عَدُوِّهِ، فَقَالُوا: هُوَ مَقْتُولٌ» [@ibn-hisham، ج2 ص503]، فالبيت يكاد يعيد لفظ الخبر."
syntax:
- "«الْوُشَاةُ» فاعل «يسعى»، و«بِجَنْبَيْهَا» متعلق به."
- "«وَقَوْلُهُمُ» مبتدأ، وجملة «إِنَّكَ ... لَمَقْتُولُ» خبره، وهي مقول القول. و«يَا ابْنَ أَبِي سُلْمَى» نداء معترض بين اسم «إنّ» وخبرها."
- "«لَمَقْتُولُ»: اللام المزحلقة للتوكيد دخلت على خبر «إنّ»."
morphology:
- "«الْوُشَاةُ» جمع «وَاشٍ» على «فُعَلة»، وأصلها «وُشَيَة» فقُلبت الياء ألفًا."
- "«مَقْتُولُ» اسم مفعول من «قَتَلَ»."
rhetoric:
  thesis: "البيت يقلب القصيدة: الصحراء والنسيب خلفه، وأمامه حكم بالموت يردده الناس."
  devices:
  - title: "توكيد الخبر في «إِنَّكَ ... لَمَقْتُولُ»"
    text: "«إنّ» واللام معًا: الوشاة يؤكدون الموت كأنه واقع. والنداء بين الاسم والخبر يزيد التهديد قربًا: يسمّونه ثم يحكمون عليه."
  - title: "الالتفات"
    text: "يتكلم الشاعر عن نفسه بلسان الوشاة، فيسمع السامع تهديدهم كما سمعه كعب."
  connection: "ثم يذكر أن الأصدقاء تخلّوا عنه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "يَسْعَلْ وُشَا / ةُ بِجَنْ / بَيْهَا وَقَوْ / لُهُمُو = مستفعلن / فعِلن / مستفعلن / فعِلن — إِنْنَكَ يَبْ / نَ أَبِي / سُلْمَا لَمَقْ / تُولُو = مستعلن / فعِلن / مستفعلن / فعْلن"
  note: "«إِنْنَكَ يَبْ» في أول العجز مستعلن بالطيّ، و«نَ أَبِي» فعِلن."
variants:
- reading: "وَقِيلُهُمُ"
  status: "رواية"
  note: "«ويروى: «وقيلُهم». ورواه أبو عبيدة بالنصب» [@diwan-kaab، ص19]، أي «وقيلَهم» مصدرًا «ناب مناب فعله» كما يقول المحققون [@diwan-kaab، ص19]."
- reading: "تَسْعَى الْغُوَاةُ جَنَابَيْهَا وَقَوْلُهُمُ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص510]."
