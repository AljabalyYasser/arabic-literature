first: "لَا يَفْرَحُونَ إِذَا نَالَتْ رِمَاحُهُمُ"
second: "قَوْمًا وَلَيْسُوا مَجَازِيعًا إِذَا نِيلُوا"
meaning: "لا يفرحون إذا أصابت رماحهم قومًا، ولا يجزعون إذا أُصيبوا. قال السُّكَّرِيّ: «يقول: ليس ذلك منهم بأول فعل ولا هو بمستنكر ومع ذلك فهم صُبُر إذا نُكبوا» [@diwan-kaab، ص25]."
vocabulary:
- term: "نَالَتْ"
  text: "أصابت."
- term: "مَجَازِيعًا"
  text: "جمع مِجزاع، وهو الكثير الجزع."
- term: "نِيلُوا"
  text: "أُصيبوا."
context: "صفة النفس بعد صفة الجسد والسلاح: الاعتدال في النصر والهزيمة."
syntax:
- "«لَا يَفْرَحُونَ» جملة مستأنفة، و«إِذَا نَالَتْ رِمَاحُهُمُ قَوْمًا» ظرف شرط، و«رماحهم» فاعل، و«قومًا» مفعول به."
- "«وَلَيْسُوا مَجَازِيعًا»: واو الجماعة اسم «ليس»، و«مجازيعًا» خبرها، وصُرف للضرورة. و«إِذَا نِيلُوا» ظرف."
morphology:
- "«مَجَازِيعًا» جمع «مِجْزَاع» على «مَفَاعِيل»، وحقه المنع من الصرف، ونُوّن للوزن."
- "«نِيلُوا» ماض مبني للمجهول من «نَالَ يَنَالُ»، أجوف، كُسرت فاؤه."
rhetoric:
  thesis: "المدح بالاعتدال: لا يبطرهم النصر ولا تكسرهم المصيبة."
  devices:
  - title: "الطباق بين «نَالَتْ» و«نِيلُوا»"
    text: "الفعل نفسه مبنيًا للمعلوم ثم للمجهول: يصيبون ويُصابون. فالبيت يقسم الحرب إلى حالتيها، ويجعل خلقهم واحدًا فيهما."
  - title: "المقابلة بين «لَا يَفْرَحُونَ» و«لَيْسُوا مَجَازِيعًا»"
    text: "نفي الفرح في الشطر الأول، ونفي الجزع في الثاني."
  connection: "ثم يختم بأنهم لا يُطعنون إلا في نحورهم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "لَا يَفْرَحُو / نَ إِذَا / نَالَتْ رِمَا / حُهُمُو = مستفعلن / فعِلن / مستفعلن / فعِلن — قَوْمَنْ وَلَيْ / سُو مَجَا / زِيعَنْ إِذَا / نِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«لَا يَفْرَحُو» مستفعلن، و«نَ إِذَا» فعِلن. والتنوين في «مجازيعًا» ضرورة يحفظ الوزن."
variants:
- reading: "لَيْسُوا مَفَارِيحَ إِنْ نَالَتْ رِمَاحُهُمُ"
  status: "رواية"
  note: "رواية السيرة [@ibn-hisham، ج2 ص513] كما يذكر المحققون، «والمِفراح: الكثير الفرح الذي يفرح كلما سرّه الدهر» [@diwan-kaab، ص25]."
