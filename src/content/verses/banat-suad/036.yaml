first: "أُنْبِئْتُ أَنَّ رَسُولَ اللَّهِ أَوْعَدَنِي"
second: "وَالْعَفْوُ عِنْدَ رَسُولِ اللَّهِ مَأْمُولُ"
meaning: "بلغني أن رسول الله صلى الله عليه وسلم توعّدني، والعفو عند رسول الله مرجوّ."
vocabulary:
- term: "أُنْبِئْتُ"
  text: "أُخبرت."
- term: "أَوْعَدَنِي"
  text: "توعّدني، والإيعاد في الشر، والوعد في الخير."
- term: "مَأْمُولُ"
  text: "مرجوّ."
context: "قلب الاعتذار. ينتقل من الخوف إلى الرجاء في بيت واحد: الشطر الأول وعيد، والثاني عفو. وهو من الأبيات العشرة عند ابن سَلّام [@ibn-sallam، ج1 ص101]، ويرويه ابن قُتَيْبة [@ibn-qutayba، ج1 ص153]، ويورده ابن رَشِيق بعد المطلع، ثم يقول: «فلم ينكر عليه النبي صلى الله عليه وسلم قوله، وما كان ليوعده على باطل، بل تجاوز عنه» [@ibn-rashiq، ج1 ص24]."
syntax:
- "«أُنْبِئْتُ» ماض مبني للمجهول، والتاء نائب فاعل، و«أَنَّ رَسُولَ اللَّهِ أَوْعَدَنِي» سدّ مسدّ المفعولين."
- "«وَالْعَفْوُ ... مَأْمُولُ» جملة اسمية حالية أو معطوفة، و«عِنْدَ رَسُولِ اللَّهِ» ظرف متعلق بـ«مأمول»."
morphology:
- "«أُنْبِئْتُ» من «أَنْبَأَ» الرباعي، يتعدى إلى ثلاثة مفاعيل، والأول هنا نائب الفاعل."
- "«أَوْعَدَ» رباعي بالهمزة، من الوعيد."
rhetoric:
  thesis: "بيت الاعتذار كله في شطرين: الخبر المخيف، ثم الرجاء الذي يقلبه."
  devices:
  - title: "المقابلة بين «أَوْعَدَنِي» و«الْعَفْوُ ... مَأْمُولُ»"
    text: "الوعيد في الشطر الأول والعفو في الثاني، وكلاهما «عند رسول الله». فالذي يملك العقوبة يملك العفو."
  - title: "إظهار الاسم في موضع الضمير في «عِنْدَ رَسُولِ اللَّهِ»"
    text: "كرّر «رسول الله» ولم يقل «عنده»، فجعل العفو صفة لازمة للرسالة نفسها، لا لشخص."
  - title: "صدى النابغة"
    text: "الصدر على مثال قول النابِغة في اعتذاره إلى النُّعْمان: «أُنْبِئْتُ أَنَّ أَبَا قَابُوسَ أَوْعَدَنِي»، وهو عند ابن رَشِيق في قصائد الاعتذار التي يعدّها «أجلّ ما وقع في الاعتذار من مشهورات العرب» [@ibn-rashiq، ج2 ص177]. لكن النابِغة أتبعه «ولا قرار على زأر من الأسد»، وكعب أتبعه بالعفو."
  connection: "ثم يتوسل: مهلًا، هداك الله الذي أعطاك القرآن."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "أُنْبِئْتُ أَنْ / نَ رَسُو / لَلْ لَاهِ أَوْ / عَدَنِي = مستفعلن / فعِلن / مستفعلن / فعِلن — وَالْعَفْوُ عِنْ / دَ رَسُو / لِلْ لَاهِ مَأْ / مُولُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«أَوْعَدَنِي» آخر الصدر فعِلن. وفي العجز «وَالْعَفْوُ عِنْ» مستفعلن، و«دَ رَسُو» فعِلن."
variants:
