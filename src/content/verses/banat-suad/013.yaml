first: "أَمْسَتْ سُعَادُ بِأَرْضٍ لَا يُبَلِّغُهَا"
second: "إِلَّا الْعِتَاقُ النَّجِيبَاتُ الْمَرَاسِيلُ"
meaning: "صارت سعاد في المساء بأرض بعيدة لا يوصل إليها إلا النوق الكريمة الأصول السريعة. قال السُّكَّرِيّ: «يقول: لا يبلّغني سعاد إلا مثل هذه النوق لبعدها» [@diwan-kaab، ص9]."
vocabulary:
- term: "أَمْسَتْ"
  text: "صارت، وأصلها الدخول في المساء."
- term: "الْعِتَاقُ"
  text: "الكريمة الأصل، جمع عتيق وعتيقة."
- term: "النَّجِيبَاتُ"
  text: "الكرائم من الإبل، جمع نجيبة."
- term: "الْمَرَاسِيلُ"
  text: "«الخِفاف التي تعطيك ما عندها عفوًا» [@diwan-kaab، ص9]. وفي اللسان: «المَراسِيل: جَمْعُ مِرْسَال وَهِيَ السَّرِيعَةُ السَّيْرِ» [@lisan، ج11 ص283]."
context: "مفصل القصيدة الأول: يخرج من النسيب إلى الرحلة. فبُعد سعاد هو الذي يستدعي الناقة، والناقة تملأ الأبيات حتى البيت 31."
syntax:
- "«سُعَادُ» اسم «أمست»، و«بِأَرْضٍ» خبرها، وجملة «لَا يُبَلِّغُهَا إِلَّا الْعِتَاقُ» صفة لـ«أرض»."
- "«الْعِتَاقُ» فاعل «يُبَلِّغُهَا»، والضمير المتصل مفعول به أول، والمفعول الثاني محذوف تقديره: إياي، كما في شرح السُّكَّرِيّ «لا يبلّغني سعاد»."
- "«النَّجِيبَاتُ» و«الْمَرَاسِيلُ» صفتان لـ«العتاق»."
morphology:
- "«يُبَلِّغُهَا» مضارع «بَلَّغَ» المضعّف، يتعدى إلى مفعولين."
- "«الْمَرَاسِيلُ» جمع «مِرْسَال» على «مَفَاعِيل»، ومفعال من أبنية المبالغة."
rhetoric:
  thesis: "البعد يصنع الرحلة: لم يقل «رحلتُ إليها»، بل قال إنها بأرض لا تُبلغ، فصار وصف الناقة ضرورة."
  devices:
  - title: "حسن التخلص"
    text: "خرج من الغزل إلى الناقة بجملة واحدة صفةً للأرض: «لَا يُبَلِّغُهَا إِلَّا الْعِتَاقُ». وهو الخروج الذي يُستحسن في القصيدة الطويلة لأنه لا يُشعر بالانقطاع."
  - title: "القصر بالنفي والاستثناء"
    text: "«لَا يُبَلِّغُهَا إِلَّا»: ينفي كل وسيلة غير الناقة الكريمة، فيرفع شأن الناقة قبل أن يصفها."
  connection: "ثم يكرر النفي نفسه، ويخص منها ناقة واحدة شديدة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "أَمْسَتْ سُعَا / دُ بِأَرْ / ضِنْ لَا يُبَلْ / لِغُهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — إِلْلَلْ عِتَا / قُنْ نَجِي / بَاتُلْ مَرَا / سِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "البيت تام التفعيلات إلا العروض «لِغُهَا» فعِلن مخبونة، والضرب «سِيلُو» فعْلن مقطوعة كسائر أبيات القصيدة."
