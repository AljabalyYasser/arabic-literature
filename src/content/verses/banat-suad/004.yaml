first: "شُجَّتْ بِذِي شَبَمٍ مِنْ مَاءِ مَحْنِيَةٍ"
second: "صَافٍ بِأَبْطَحَ أَضْحَى وَهْوَ مَشْمُولُ"
meaning: "مُزجت تلك الخمر بماء بارد من منعطف وادٍ، صافٍ في أرض واسعة ذات حصى، ضربته ريح الشمال في الضحى فبرد. قال السُّكَّرِيّ: «شُجّت: عوليت بالماء ومُزجت. بذي شَبَم: بماء ذي بَرْد» [@diwan-kaab، ص7]."
vocabulary:
- term: "شُجَّتْ"
  text: "«عوليت بالماء ومُزجت» [@diwan-kaab، ص7]. وفي اللسان: «أَي مُزِجَتْ وَخُلِطَتْ» [@lisan، ج2 ص304]."
- term: "شَبَمٍ"
  text: "«والشَّبَم: البَرْد» [@diwan-kaab، ص7]، وفي اللسان أنه «يُرْوَى بِكَسْرِ الْبَاءِ وَفَتْحِهَا عَلَى الِاسْمِ وَالْمَصْدَرِ» [@lisan، ج12 ص317]."
- term: "مَحْنِيَةٍ"
  text: "«ما انحنى من الوادي فيه رمل وحصى صغار» [@diwan-kaab، ص7]."
- term: "أَبْطَحَ"
  text: "«مسيل واسع فيه دقاق الحصى» كما يقول المحققون [@diwan-kaab، ص7]."
- term: "مَشْمُولُ"
  text: "«أصابته ريح الشمال فبرّدته» [@diwan-kaab، ص7]."
context: "البيت الثاني من أبيات الثغر: يطيل في الخمر ليطيل في الريق، فكل صفة للماء البارد الصافي صفة لريق سعاد."
syntax:
- "«شُجَّتْ» فعل ماض مبني للمجهول، ونائب الفاعل ضمير الراح المذكورة في البيت السابق."
- "«بِذِي شَبَمٍ» متعلق بـ«شُجَّتْ»، والموصوف محذوف، أي بماء ذي شَبَم. و«مِنْ مَاءِ مَحْنِيَةٍ» صفة له."
- "«صَافٍ» صفة ثانية لـ«ذي شَبَم»، و«بِأَبْطَحَ» متعلق بـ«صافٍ»، وجملة «أَضْحَى وَهْوَ مَشْمُولُ»: «أضحى» تامة بمعنى دخل في الضحى، والواو حالية، و«هو مشمول» جملة حال."
morphology:
- "«صَافٍ» اسم منقوص حُذفت ياؤه للتنوين، وأصله «صافي»."
- "«أَبْطَحَ» ممنوع من الصرف لوزن الفعل والوصف الأصلي، فجُرّ بالفتحة."
- "«مَشْمُولُ» اسم مفعول من «شَمَلَتْه» الريح إذا أصابته الشَّمال."
rhetoric:
  thesis: "يتتبع الماء من منبعه: منعطف وادٍ، ثم أبطح صافٍ، ثم ريح الشمال في الضحى. فكل كلمة تزيده بردًا وصفاءً."
  devices:
  - title: "الكناية في «بِذِي شَبَمٍ»"
    text: "لم يقل «بماء بارد»، بل ذكر صفته وحذف الموصوف، فدلّت الصفة عليه."
  - title: "الاستطراد في الوصف"
    text: "خرج من الريق إلى الخمر، ومن الخمر إلى الماء، ثم يخرج في البيت التالي إلى الريح والسحاب. وكل ذلك تشبيه لريق سعاد في أصله."
  connection: "ثم يصف الماء نفسه: الريح تنفي عنه القذى، والسحب ملأته."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "شُجْجَتْ بِذِي / شَبَمِنْ / مِنْ مَاءِ مَحْ / نِيَةِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — صَافِنْ بِأَبْ / طَحَ أَضْ / حَا وَهْوَ مَشْ / مُولُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«شُجْجَتْ بِذِي» مستفعلن، و«شَبَمِنْ» فعِلن، و«مِنْ مَاءِ مَحْ» مستفعلن، و«نِيَتِنْ» فعِلن. والعجز على مثاله."
