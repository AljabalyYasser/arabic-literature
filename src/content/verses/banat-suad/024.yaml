first: "تَخْدِي عَلَى يَسَرَاتٍ وَهْيَ لَاحِقَةٌ"
second: "ذَوَابِلٌ وَقْعُهُنَّ الْأَرْضَ تَحْلِيلُ"
meaning: "تسير مسرعة على قوائم خفاف ضامرة يابسة، لا تكاد تمسّ الأرض إلا قليلًا كتحلّة اليمين. قال السُّكَّرِيّ: «تحليل: مثل تحلّة اليمين» [@diwan-kaab، ص14]، ويقول المحققون: «تخدي: تسير مسرعة ... واليسرات: القوائم الخفاف. ولاحقة: ضامرة» [@diwan-kaab، ص13]."
vocabulary:
- term: "تَخْدِي"
  text: "«تسير مسرعة» كما يقول المحققون [@diwan-kaab، ص13]. وفي اللسان: «الخَدْيُ: ضَرْبٌ مِنَ السَّيْر» [@lisan، ج14 ص224]."
- term: "يَسَرَاتٍ"
  text: "«القوائم الخفاف» [@diwan-kaab، ص13]."
- term: "لَاحِقَةٌ"
  text: "«ضامرة» [@diwan-kaab، ص13]."
- term: "ذَوَابِلٌ"
  text: "يابسة لا رهَل فيها. والسُّكَّرِيّ يقول: «ليست برَهِلة، أراد أنها ضخمة» [@diwan-kaab، ص14]، ويقول المحققون: «هذا غير ظاهر، فإن المراد وصف قوائمها بالضمور والذبول ليكون ذلك أعون لها على الجري» [@diwan-kaab، ص14]."
- term: "تَحْلِيلُ"
  text: "قليل. وفي اللسان أن معناه «قَلِيلٌ كَمَا يَحْلِفُ الإِنسان عَلَى الشَّيْءِ أَن يَفْعَلَهُ فَيَفْعَلَ مِنْهُ الْيَسِيرَ يُحَلِّل بِهِ يَمِينه» [@lisan، ج11 ص168]."
context: "بداية صفة السير (24–25): القوائم، ثم الأخفاف. والبيت من أشهر شواهد «التحليل» في كتب اللغة."
syntax:
- "فاعل «تَخْدِي» ضمير الناقة، و«عَلَى يَسَرَاتٍ» متعلق به. و«وَهْيَ لَاحِقَةٌ» جملة حال، والضمير كما يقول المحققون «لليسرات» [@diwan-kaab، ص13]."
- "«ذَوَابِلٌ» خبر ثانٍ أو صفة، وصُرف للضرورة. و«وَقْعُهُنَّ» مبتدأ، و«الْأَرْضَ» مفعول للمصدر «وقع»، و«تَحْلِيلُ» خبر."
morphology:
- "«ذَوَابِلٌ» جمع «ذابل» على صيغة منتهى الجموع، وحقها المنع من الصرف، ونُوّنت لإقامة الوزن."
- "«وَهْيَ» بسكون الهاء بعد الواو، لغة جائزة في الضمير."
rhetoric:
  thesis: "السرعة تُرى في قلة الملامسة: القوائم تمسّ الأرض كما يمسّ الحالف يمينه ليتحلل منها."
  devices:
  - title: "التمثيل في «وَقْعُهُنَّ الْأَرْضَ تَحْلِيلُ»"
    text: "شبّه وقع قوائمها على الأرض بتحلّة اليمين، وهي أقل ما يُبرّ به القسم. والشبه لا يُدرك إلا بالفكر: الأمر اليسير الذي يُفعل ليُقال إنه فُعل. وهذا من التمثيل الذي هو عند عبد القاهر الجُرْجانيّ أخص من التشبيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
  - title: "تعدد الصفات للقوائم"
    text: "«يَسَرَاتٍ» ثم «لَاحِقَةٌ» ثم «ذَوَابِلٌ»: خفة، ثم ضمور، ثم يبس. والصفات الثلاث تعدّ القوائم للعدو."
  connection: "ثم يصف أخفافها: سمر العصب، تفرّق الحصى."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "تَخْدِي عَلَا / يَسَرَا / تِنْ وَهْيَ لَا / حِقَةُنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — ذَوَابِلُنْ / وَقْعُهُنْ / نَلْ أَرْضَ تَحْ / لِيلُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«ذَوَابِلُنْ» في أول العجز متفعلن مخبونة، وتنوين «ذوابل» ضرورة يحفظ الوزن."
variants:
- reading: "ذَوَابِلٍ مَسُّهُنَّ الْأَرْضَ تَحْلِيلُ"
  status: "رواية"
  note: "«ويروى: «مسّهنّ الأرض»» كما يقول المحققون [@diwan-kaab، ص13]، وهي رواية السيرة بجر «ذوابل» صفةً لـ«يسرات» [@ibn-hisham، ج2 ص508]."
- reading: "غَيْرِ فَائِرَةٍ"
  status: "رواية"
  note: "«ويروى: «غير فائرة» والفائرة: التي فيها انتشار» [@diwan-kaab، ص14]."
- reading: "وَهْيَ لَاهِيَةٌ"
  status: "رواية"
  note: "في اللسان [@lisan، ج14 ص224]، ويذكرها محققو السيرة عن النسخة (أ) [@ibn-hisham، ج2 ص508]."
