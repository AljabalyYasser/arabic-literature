first: "مِنْ كُلِّ نَضَّاخَةِ الذِّفْرَى إِذَا عَرِقَتْ"
second: "عُرْضَتُهَا طَامِسُ الْأَعْلَامِ مَجْهُولُ"
meaning: "من كل ناقة يفور عرقها من خلف أذنيها إذا عرقت، قوية على الطريق الذي امّحت معالمه وجُهل. قال السُّكَّرِيّ: «يقول: إن هذه الناقة لعُرضة للسفر قوية عليه»، و«أراد أن عُرضتها خَرْق ما توارى وبَعُد» [@diwan-kaab، ص10]."
vocabulary:
- term: "نَضَّاخَةِ"
  text: "كثيرة الفوران، من النَّضْخ، وهو كما يقول المحققون «شدة فور الماء في جيشانه وانفجاره من ينبوعه» [@diwan-kaab، ص9]. وفي اللسان: «أَراد أَن ذِفْرَى النَّاقَةِ كَثِيرُ النَّضْخِ بالعرق» [@lisan، ج3 ص62]."
- term: "الذِّفْرَى"
  text: "العظم خلف الأذن، «وهي أول ما يعرق من الناقة عند السير» كما يقول المحققون [@diwan-kaab، ص9]."
- term: "عُرْضَتُهَا"
  text: "همّتها وما تقوى عليه؛ قال السُّكَّرِيّ: «والعُرضة: الهِمّة. يقول: إنها تطيق ذلك» [@diwan-kaab، ص10]. وفي اللسان: «فُلَانٌ عُرْضةٌ لِلشَّرِّ أَي قَوِيٌّ عَلَيْهِ» [@lisan، ج7 ص178]."
- term: "طَامِسُ الْأَعْلَامِ"
  text: "«ما طمس من الأعلام» [@diwan-kaab، ص10]: طريق امّحت علاماته."
context: "أول صفة جسدية للناقة: العرق. ويرى السُّكَّرِيّ أن عرق الذفرى دليل على الجهد والسير، وأن الصحراء المجهولة هي ميدانها."
syntax:
- "«مِنْ كُلِّ نَضَّاخَةِ» صفة لـ«عُذافرة» في البيت السابق، أي هي من كل ناقة هذه صفتها."
- "«عُرْضَتُهَا طَامِسُ الْأَعْلَامِ»: مبتدأ وخبر، والجملة صفة ثانية لـ«نَضَّاخَة». و«إِذَا عَرِقَتْ» ظرف معترض."
morphology:
- "«نَضَّاخَةِ» صيغة مبالغة على «فَعَّالَة»."
- "«الذِّفْرَى» على «فِعْلَى»، وألفها للتأنيث، ويقول المحققون إن اشتقاقها «من الذَّفَر (بفتحتين) وهو الرائحة الظاهرة» [@diwan-kaab، ص9]."
rhetoric:
  thesis: "صورتان متقابلتان: جسد يفيض ماءً، وأرض بلا علامات."
  devices:
  - title: "الاستعارة في «نَضَّاخَةِ الذِّفْرَى»"
    text: "النضخ في الأصل للعيون الفوّارة، فجعل ذفرى الناقة عينًا تفور بالعرق. والكلمة نفسها في القرآن: ﴿فِيهِمَا عَيْنَانِ نَضَّاخَتَانِ﴾ (الرحمن: 66)، كما يذكر المحققون [@diwan-kaab، ص9]."
  - title: "الكناية في «عُرْضَتُهَا طَامِسُ الْأَعْلَامِ»"
    text: "لم يقل إنها تقطع الصحراء المجهولة، بل جعل الصحراء المجهولة غايتها وهمّتها."
  connection: "ثم يصف عينيها: ترى ما غاب كعيني ثور وحشي."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "مِنْ كُلْلِ نَضْ / ضَاخَةِذْ / ذِفْرَا إِذَا / عَرِقَتْ = مستفعلن / فاعلن / مستفعلن / فعِلن — عُرْضَتُهَا / طَامِسُلْ / أَعْلَامِ مَجْ / هُولُو = مستعلن / فاعلن / مستفعلن / فعْلن"
  note: "«عُرْضَتُهَا» في أول العجز مستعلن، دخلها الطيّ."
