first: "لَا تَأْخُذَنِّي بِأَقْوَالِ الْوُشَاةِ وَلَمْ"
second: "أُذْنِبْ وَلَوْ كَثُرَتْ عَنِّي الْأَقَاوِيلُ"
meaning: "لا تأخذني بما قاله الوشاة، ولم أذنب، وإن كثرت عني الأقاويل."
vocabulary:
- term: "لَا تَأْخُذَنِّي"
  text: "لا تعاقبني."
- term: "الْأَقَاوِيلُ"
  text: "جمع أقوال، والمراد الكلام الكثير المختلق."
context: "الحجة الثالثة في الاعتذار: بعد القدر والقرآن، ينفي الذنب ويحمّله الوشاة. وهذا ما يوصي به ابن رَشِيق في باب الاعتذار: أن يعيد الشاعر «النظر في الكشف عن كذب الناقل»، و«يحيل الكذب على الناقل والحاسد» [@ibn-rashiq، ج2 ص176]. ويرويه ابن قُتَيْبة [@ibn-qutayba، ج1 ص154]."
syntax:
- "«لَا تَأْخُذَنِّي»: «لا» ناهية، والفعل مبني على الفتح لاتصاله بنون التوكيد في محل جزم، والنون الثانية نون الوقاية، والياء مفعول به."
- "«وَلَمْ أُذْنِبْ» جملة حالية. و«وَلَوْ كَثُرَتْ عَنِّي الْأَقَاوِيلُ»: «لو» وصلية، والجملة في موضع الحال."
morphology:
- "«أُذْنِبْ» مضارع «أَذْنَبَ» مجزوم بـ«لم»."
- "«الْأَقَاوِيلُ» جمع «أَقْوَال»، فهو جمع الجمع."
rhetoric:
  thesis: "دفاع مختصر: ينفي الذنب في كلمتين، ولا يجادل في التفاصيل."
  devices:
  - title: "التدوير في «وَلَمْ / أُذْنِبْ»"
    text: "قُطعت الجملة بين الشطرين، فوقعت «أُذْنِبْ» في أول العجز، كأن النفي يتلكأ ثم يقع بقوة."
  - title: "«عَنِّي»"
    text: "الأقاويل «عنه» لا «فيه»: تُنقل عنه، أي تُنسب إليه. فالذنب في النقل لا في القول. وهذه قراءتنا."
  connection: "ثم يصف المقام الذي وقفه بين يدي النبي: مقام لو وقفه الفيل لارتعد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "لَا تَأْخُذَنْ / نِي بِأَقْ / وَالِلْ وُشَا / ةِ وَلَمْ = مستفعلن / فاعلن / مستفعلن / فعِلن — أُذْنِبْ وَلَوْ / كَثُرَتْ / عَنْنِلْ أَقَا / وِيلُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "البيت مدوّر: «وَلَمْ» في آخر الصدر، و«أُذْنِبْ» في أول العجز."
variants:
- reading: "وَلَوْ كَثُرَتْ فِيَّ الْأَقَاوِيلُ"
  status: "رواية"
  note: "عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص154] وفي السيرة [@ibn-hisham، ج2 ص511]."
