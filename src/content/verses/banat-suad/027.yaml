first: "كَأَنَّ أَوْبَ ذِرَاعَيْهَا وَقَدْ عَرِقَتْ"
second: "وَقَدْ تَلَفَّعَ بِالْقُورِ الْعَسَاقِيلُ"
meaning: "كأن رَجْع ذراعيها في السير، وقد عرقت، وقد غطّى السراب التلال الصغيرة... والخبر في البيت 29: ذراعا امرأة طويلة نائحة. قال السُّكَّرِيّ: «أَوْب: رَجْع. وتلفّع: تلحّف. والقُور: جمع قارة ... وقال غيره: واحد العساقيل عسقل وهو السراب» [@diwan-kaab، ص16]."
vocabulary:
- term: "أَوْبَ"
  text: "«رَجْع» [@diwan-kaab، ص16]. وفي اللسان: «والأَوْبُ: تَرْجِيعُ الأَيْدِي والقَوائِم» [@lisan، ج1 ص220]."
- term: "تَلَفَّعَ"
  text: "«تلحّف» [@diwan-kaab، ص16]، أي تغطى كما يتغطى المرء بالملحفة."
- term: "الْقُورِ"
  text: "«جمع قارة»، «والقارة: جبل يرتفع طولًا ولا يرتفع عرضًا» [@diwan-kaab، ص16]."
- term: "الْعَسَاقِيلُ"
  text: "السراب؛ «وقال الأصمعي: لا واحد للعساقيل» [@diwan-kaab، ص16]. وفي اللسان: «تَلمُّعُ السَّراب وتَرَيُّعُه، وَقِيلَ: عَسَاقِيلُ السّرابِ قِطَعُه» [@lisan، ج11 ص448]."
context: "يبدأ تشبيهًا طويلًا يمتد إلى البيت 31: ذراعا الناقة كذراعي امرأة نائحة. والمشبه به لا يأتي إلا في البيت 29."
syntax:
- "«أَوْبَ» اسم «كأنّ» مضاف إلى «ذِرَاعَيْهَا»، وخبرها «ذِرَاعَا عَيْطَلٍ» في البيت 29."
- "«وَقَدْ عَرِقَتْ» و«وَقَدْ تَلَفَّعَ بِالْقُورِ الْعَسَاقِيلُ» جملتان حاليتان، و«العساقيل» فاعل «تلفّع»."
- "في العجز قلب: يقول المحققون: «وفي البيت القلب كأنه قال: وقد تلفّع القُور بالعساقيل» [@diwan-kaab، ص16]، ويقول ابن بَرّيّ في اللسان: «وَهَذَا مِنَ الْمَقْلُوبِ لأَن القُورَ هِيَ الَّتِي تَلَفَّعَت بالعَساقيل» [@lisan، ج11 ص448]."
morphology:
- "«تَلَفَّعَ» على «تَفَعَّلَ» من «اللِّفاع» وهو الملحفة."
- "«الْعَسَاقِيلُ» على «فَعَالِيل»، ويقول المحققون إنه يقال في الواحد «عسقلة وعسقول، وظاهر أن عساقيل جمع الأخير» [@diwan-kaab، ص16]."
rhetoric:
  thesis: "البيت كله تمهيد: يرسم المشهد، ويؤخّر المشبه به ليشوّق السامع."
  devices:
  - title: "القلب في «تَلَفَّعَ بِالْقُورِ الْعَسَاقِيلُ»"
    text: "جعل السراب هو الذي يتلفّع بالتلال، والمراد أن التلال تلفّعت بالسراب. والقلب يجعل السراب كأنه يلبس التلال، فيكبر حضوره في الصورة."
  - title: "الاستعارة في «تَلَفَّعَ»"
    text: "أعار السراب أو التلال فعل المتلحّف بثوبه، فصار السراب ملحفة."
  - title: "تأخير الخبر"
    text: "«كأنّ» في أول البيت، وخبرها بعد بيتين. وبينهما يصف الحر والحادي، فيشتد الانتظار."
  connection: "ثم يصف ساعة القيلولة: الحادي يأمر القوم بالراحة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "كَأَنْنَ أَوْ / بَ ذِرَا / عَيْهَا وَقَدْ / عَرِقَتْ = متفعلن / فعِلن / مستفعلن / فعِلن — وَقَدْ تَلَفْ / فَعَ بِلْ / قُورِلْ عَسَا / قِيلُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«كَأَنْنَ أَوْ» متفعلن، و«بَ ذِرَا» فعِلن. والعجز يبدأ مثله «وَقَدْ تَلَفْ»."
variants:
- reading: "كَأَنَّ أَوْبَ ذِرَاعَيْهَا إِذَا عَرِقَتْ"
  status: "رواية"
  note: "يقول المحققون إنها «الرواية في ابن هشام ومنتهى الطلب» [@diwan-kaab، ص16]، وهي في اللسان [@lisan، ج11 ص448]."
- reading: "ترتيب البيت"
  status: "خلاف في الموضع"
  note: "في السيرة يأتي قبل «يومًا يظل به الحرباء» [@ibn-hisham، ج2 ص508]، ويقول محققو السيرة إنه في النسخة (أ) «متأخر عن البيتين التابعين له» [@ibn-hisham، ج2 ص509]."
