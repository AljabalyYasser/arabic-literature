first: "وَمَا سُعَادُ غَدَاةَ الْبَيْنِ إِذْ رَحَلُوا"
second: "إِلَّا أَغَنُّ غَضِيضُ الطَّرْفِ مَكْحُولُ"
meaning: "وما سعاد يوم الرحيل حين ارتحل قومها إلا ظبي في صوته غُنّة، فاتر الطرف، أكحل العينين خلقةً. قال السُّكَّرِيّ: «الأغنّ: الذي في صوته غُنّة ... وغضيض الطّرف: فاتر الطرف» [@diwan-kaab، ص6]."
vocabulary:
- term: "غَدَاةَ الْبَيْنِ"
  text: "صباح الفراق؛ والغداة: أول النهار، والبَيْن: الفراق."
- term: "أَغَنُّ"
  text: "«الذي في صوته غُنّة» [@diwan-kaab، ص6]، والغُنّة كما يقول المحققون: «أن يشرب الحرف صوت الخيشوم» [@diwan-kaab، ص6]. وفي اللسان: «الأَغَنُّ مِنَ الغِزْلانِ وَغَيْرِهَا: الَّذِي فِي صَوْتِهِ غُنَّة» [@lisan، ج13 ص315]. والموصوف محذوف، أي ظبي أغنّ."
- term: "غَضِيضُ الطَّرْفِ"
  text: "«فاتر الطرف» [@diwan-kaab، ص6]، أي فاتر النظر في استرخاء."
- term: "مَكْحُولُ"
  text: "كأن في عينيه كحلًا من سوادهما خلقةً."
context: "يبدأ وصف سعاد، فيجعلها ظبيًا ثم يصف ثغرها في الأبيات الثلاثة التالية. ويرى شوقي ضَيْف أنه «يلحّ فى وصف سعاد ويشبهها بالظبى ويشبه ريقها بالخمر، متأثرا فى ذلك أباه» [@deif، ج2 ص85]."
syntax:
- "«وَمَا سُعَادُ ... إِلَّا أَغَنُّ»: «ما» نافية، و«سُعَادُ» مبتدأ، و«أَغَنُّ» خبر، و«إلا» أداة حصر."
- "«غَدَاةَ» ظرف زمان متعلق بمعنى الكلام، و«الْبَيْنِ» مضاف إليه، و«إِذْ رَحَلُوا» ظرف بدل من «غداة»، والجملة بعده في محل جر بالإضافة."
- "«غَضِيضُ الطَّرْفِ» و«مَكْحُولُ» صفتان لـ«أَغَنُّ»، و«غَضِيضُ» مضاف إلى «الطَّرْفِ» إضافة لفظية."
morphology:
- "«أَغَنُّ» صفة مشبهة على «أَفْعَل»، ومؤنثها «غَنّاء»، فهو ممنوع من الصرف للوصف ووزن الفعل."
- "«غَضِيضُ» فعيل بمعنى مفعول، من غَضَّ الطرف إذا خفضه."
- "«رَحَلُوا» الضمير للقوم، أهل سعاد، ولم يُذكروا قبل؛ لأن الرحيل لا يكون إلا للحيّ كله."
rhetoric:
  thesis: "يحصر سعاد في صورة واحدة: هي ظبي، لا شيء غيره. فالنفي والاستثناء يجعلان التشبيه أقوى من التشبيه الصريح."
  devices:
  - title: "التشبيه البليغ بالقصر في «وَمَا سُعَادُ ... إِلَّا أَغَنُّ»"
    text: "حذف أداة التشبيه ووجه الشبه، وحذف الموصوف أيضًا، فلم يقل «إلا ظبي أغنّ». فبقيت الصفات وحدها تدل على الظبي."
  - title: "صفتان متقابلتان"
    text: "«أَغَنُّ» للصوت، و«غَضِيضُ الطَّرْفِ مَكْحُولُ» للعين: فجمع السمع والبصر في بيت واحد."
  connection: "ثم ينتقل من العين إلى الثغر: إذا ابتسمت كشفت عن أسنان صافية."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "وَمَا سُعَا / دُ غَدَا / ةَلْ بَيْنِ إِذْ / رَحَلُو = متفعلن / فعِلن / مستفعلن / فعِلن — إِلْلَا أَغَنْ / نُ غَضِي / ضُطْ طَرْفِ مَكْ / حُولُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "في الصدر «وَمَا سُعَا» متفعلن مخبونة، و«ةَلْ بَيْنِ إِذْ» مستفعلن تامة. والعروض والضرب على الأصل في البسيط التام: «رَحَلُو» فعِلن، و«حُولُو» فعْلن."
variants:
- reading: "وَمَا سُعَادُ غَدَاةَ الْبَيْنِ إِذْ بَرَزَتْ"
  status: "رواية"
  note: "«ويروى: «غداة البين إذ برزت»» [@diwan-kaab، ص6]."
- reading: "وَمَا سُعَادُ غَدَاةَ الْبَيْنِ إِذْ عَرَضَتْ"
  status: "رواية"
  note: "عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص153]."
