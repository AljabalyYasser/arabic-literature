first: "تَرْمِي الْغُيُوبَ بِعَيْنَيْ مُفْرَدٍ لَهَقٍ"
second: "إِذَا تَوَقَّدَتِ الْحِزَّانُ وَالْمِيلُ"
meaning: "تنظر إلى ما غاب عنها من الأرض بعيني ثور وحشي أبيض انفرد عن قطيعه، في الهاجرة حين تتوقد الأرض الغليظة وتلمع مدى البصر. قال السُّكَّرِيّ: «يقول: إن هذه الناقة لا تكسّر في الهاجرة» [@diwan-kaab، ص10]."
vocabulary:
- term: "الْغُيُوبَ"
  text: "«ما غاب عنك» [@diwan-kaab، ص10]."
- term: "مُفْرَدٍ"
  text: "«الفرد الذي خُذل عن صواحبه» [@diwan-kaab، ص10]؛ يعني الثور الوحشي المنفرد، ويقول المحققون إنه «إذ ذاك يكثر تحديقه ليلحقه ويكثر نشاطه وخفته» [@diwan-kaab، ص10]."
- term: "لَهَقٍ"
  text: "«الشديد البياض» [@diwan-kaab، ص10]. وفي اللسان: «هُوَ بِفَتْحِ الْهَاءِ وَكَسْرِهَا الأَبيض، وَالْمُفْرَدُ: الثَّوْرُ الْوَحْشِيُّ شَبَّهَهَا بِهِ» [@lisan، ج10 ص333]."
- term: "الْحِزَّانُ"
  text: "«ما غلظ من الأرض، واحدها حزيز» [@diwan-kaab، ص10]."
- term: "الْمِيلُ"
  text: "قال السُّكَّرِيّ: «والميل من الأرض: مدّ النظر» [@diwan-kaab، ص10]. وينقل المحققون عن ابن هشام: «الميل جمع ميلاء وهي العقدة الضخمة من الرمل» [@diwan-kaab، ص10]."
context: "الصفة الثانية: البصر. ويضع الشاعر ناقته في أشد أوقات النهار، لأن الجهد فيه أظهر، ويعود إلى الهاجرة نفسها في الأبيات 26–29."
syntax:
- "فاعل «تَرْمِي» ضمير الناقة، و«الْغُيُوبَ» مفعول به، و«بِعَيْنَيْ» متعلق بـ«ترمي»، وحُذفت النون من «عينين» للإضافة."
- "«لَهَقٍ» صفة لـ«مُفْرَدٍ»، و«إِذَا تَوَقَّدَتِ الْحِزَّانُ» ظرف متعلق بـ«ترمي»."
morphology:
- "«الْغُيُوبَ» جمع «غَيْب» على «فُعُول»، ويقول المحققون إنه جمع غائب «كشاهد وشهود» أو جمع غيب «كبيت وبيوت» [@diwan-kaab، ص10]."
- "«تَوَقَّدَتِ» على «تَفَعَّلَ» للمطاوعة، وكُسرت التاء لالتقاء الساكنين."
rhetoric:
  thesis: "الناقة لا تفتر حين يفتر كل شيء، وعيناها حادتان كعيني الوحش."
  devices:
  - title: "الاستعارة في «تَرْمِي الْغُيُوبَ»"
    text: "جعل النظر رميًا، كأن العين ترسل السهم إلى البعيد فتصيبه. وهذه استعارة في الفعل، يُعطى فيها النظر صفة الرمي."
  - title: "التشبيه في «بِعَيْنَيْ مُفْرَدٍ لَهَقٍ»"
    text: "لم يقل «كعيني ثور»، بل جعل لها عيني الثور نفسه، فحذف أداة التشبيه."
  - title: "الاستعارة في «تَوَقَّدَتِ الْحِزَّانُ»"
    text: "جعل الأرض الغليظة نارًا تتوقد من شدة الحر."
  connection: "ثم يصف خلقتها: ضخمة العنق، ممتلئة القوائم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "تَرْمِلْ غُيُو / بَ بِعَيْ / نَيْ مُفْرَدِنْ / لَهَقِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — إِذَا تَوَقْ / قَدَتِلْ / حِزْزَانُ وَالْ / مِيلُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«إِذَا تَوَقْ» متفعلن، و«قَدَتِلْ» فعِلن، وكلتاهما مخبونة."
variants:
- reading: "تَرْمِي النِّجَادَ بِعَيْنَيْ مُفْرَدٍ لَهَقٍ"
  status: "رواية"
  note: "«ويروى «ترمي النجاد»» كما يقول المحققون [@diwan-kaab، ص10]، وهي رواية النسخة (أ) من السيرة [@ibn-hisham، ج2 ص506]. والنِّجاد: ما ارتفع من الأرض."
