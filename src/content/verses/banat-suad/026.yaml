first: "يَوْمًا يَظَلُّ بِهِ الْحِرْبَاءُ مُصْطَخِمًا"
second: "كَأَنَّ ضَاحِيَهُ بِالنَّارِ مَمْلُولُ"
meaning: "في يوم يظلّ فيه الحرباء منتصبًا من شدة الحر، كأن ما ظهر منه للشمس قد شُوي في المَلّة، وهي الرماد الحار. قال السُّكَّرِيّ: «المُصْطَخِم: القائم من الحرّ ... وضاحيه: ما ظهر منه للشمس»، «يقول: كأن الحرباء قد شُوي بالنار من شدة حرّ الشمس وصهرها عليه» [@diwan-kaab، ص15–16]."
vocabulary:
- term: "الْحِرْبَاءُ"
  text: "دويبة «يستقبل الشمس ويدور معها كيفما دارت ويتلون ألوانا بحر الشمس» كما يقول المحققون [@diwan-kaab، ص15]."
- term: "مُصْطَخِمًا"
  text: "«القائم من الحرّ، يقال: ظلّ مصطخمًا، أي منتصبًا» [@diwan-kaab، ص15]."
- term: "ضَاحِيَهُ"
  text: "«ما ظهر منه للشمس» [@diwan-kaab، ص15]."
- term: "مَمْلُولُ"
  text: "«من المَلّة»، «ويقال: أكلت خبز مَلّة، وهذا طعام مملول» [@diwan-kaab، ص15–16]؛ والملة: الرماد الحار يُخبز فيه."
context: "بداية مقطع الهاجرة (26–29). ويقول المحققون: «هذا البيت ليس في موضعه وإنما هو بعد البيت الذي يليه لأن يومًا في هذا البيت ظرف لتلفّع أو لأوب في البيت التالي» [@diwan-kaab، ص15]. وفي السيرة يأتي بعد «كأن أوب ذراعيها» [@ibn-hisham، ج2 ص508–509]. ونُبقيه في موضعه من الديوان، ونقرؤه مع البيت التالي."
syntax:
- "«يَوْمًا» ظرف زمان متعلق بفعل في البيت التالي، على ترتيب السيرة، أو بـ«تخدي» في البيت 24 على ترتيب الديوان."
- "جملة «يَظَلُّ بِهِ الْحِرْبَاءُ مُصْطَخِمًا» صفة لـ«يومًا»، و«الحرباء» اسم «يظل»، و«مصطخمًا» خبرها."
- "«ضَاحِيَهُ» اسم «كأنّ»، و«مَمْلُولُ» خبرها، و«بِالنَّارِ» متعلق بـ«مملول»."
morphology:
- "«مُصْطَخِمًا» اسم فاعل من «اصْطَخَمَ» على «افْتَعَلَ»، قُلبت تاء الافتعال طاءً بعد الصاد."
- "«مَمْلُولُ» اسم مفعول من «مَلَّ الخبزَ» إذا وضعه في الملّة."
rhetoric:
  thesis: "يصف الحر بأثره في أصبر الحيوان على الشمس: حتى الحرباء يكاد ينشوي."
  devices:
  - title: "المبالغة بالحرباء"
    text: "الحرباء يُضرب به المثل في استقبال الشمس، فإذا جعله الحر كالخبز في الرماد فما بال غيره؟ فيصير الشاهد الأصبر دليلًا على الأشد."
  - title: "التشبيه في «كَأَنَّ ضَاحِيَهُ بِالنَّارِ مَمْلُولُ»"
    text: "شبّه ظاهر الحرباء بخبز المَلّة، والشبه في اللون والحرارة."
  connection: "ثم يصف ذراعي الناقة في هذه الساعة، والسراب قد غطّى التلال."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "يَوْمَنْ يَظَلْ / لُ بِهِلْ / حِرْبَاءُ مُصْ / طَخِمَنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — كَأَنْنَ ضَا / حِيَهُو / بِنْنَارِ مَمْ / لُولُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«كَأَنْنَ ضَا» متفعلن، و«حِيَهُو» فعِلن، وتُشبع هاء «ضاحيه»."
variants:
- reading: "مُصْطَخِدًا"
  status: "رواية"
  note: "«ويروى: «مُصْطَخِدًا» أي قد صخدته الشمس إذا اشتدت عليه» [@diwan-kaab، ص15]، وهي رواية السيرة [@ibn-hisham، ج2 ص509] واللسان [@lisan، ج3 ص245]."
- reading: "مُرْتَبِئًا"
  status: "رواية"
  note: "يذكرها المحققون [@diwan-kaab، ص15]."
- reading: "كَأَنَّ ضَاحِيَهُ بِالشَّمْسِ مَمْلُولُ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص509]."
