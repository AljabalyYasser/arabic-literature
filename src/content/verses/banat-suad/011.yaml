first: "أَرْجُو وَآمُلُ أَنْ يَعْجَلْنَ فِي أَبَدٍ"
second: "وَمَا لَهُنَّ طَوَالَ الدَّهْرِ تَعْجِيلُ"
meaning: "أرجو وآمل أن يُنجزن وعدهن ولو مرة في الدهر، وما لهن طول الدهر وفاء. قال السُّكَّرِيّ: «وقوله: طوال الدهر، أي ما بقي عمري ... وما لهن تعجيل، أي تصديق» [@diwan-kaab، ص9]."
vocabulary:
- term: "يَعْجَلْنَ"
  text: "يسرعن بالوفاء. والضمير، كما يقول البَغْداديّ ناقلًا عن شارح بغدادي، «لمواعيدها فِي الْبَيْت الَّذِي قبله» [@khizana، ج9 ص147]."
- term: "فِي أَبَدٍ"
  text: "قال الأحول: «فِي أَبَد: فِي دهر» [@khizana، ج9 ص146]."
- term: "طَوَالَ الدَّهْرِ"
  text: "«أي ما بقي عمري» [@diwan-kaab، ص9]؛ وطَوال بالفتح: طول."
- term: "تَعْجِيلُ"
  text: "«أي تصديق» [@diwan-kaab، ص9]، أي إنجاز للوعد."
context: "بعد ثلاثة أبيات في كذب وعدها يعترف بضعفه: يعرف كل ذلك ويرجو مع ذلك. ثم ينهى نفسه في البيت التالي عن الاغترار."
syntax:
- "«أَرْجُو» مع فاعله جملة مستأنفة، و«آمُلُ» معطوف عليه، و«أَنْ يَعْجَلْنَ» مصدر مؤول مفعول به للفعلين."
- "«وَمَا لَهُنَّ ... تَعْجِيلُ»: «ما» نافية، و«لهنّ» خبر مقدم، و«تعجيل» مبتدأ مؤخر، و«طَوَالَ الدَّهْرِ» ظرف."
- "وعلى الرواية الأخرى «وَمَا إِخَالُ لَدَيْنَا مِنْكِ تَنْوِيلُ» يستشهد بها النحاة على إلغاء «إخال» عن العمل مع تقدّمها، ويذكر البَغْداديّ أوجهها عن ابن هشام [@khizana، ج9 ص143]."
morphology:
- "«يَعْجَلْنَ» مضارع «عَجِلَ» من باب فَرِحَ، مسند إلى نون النسوة فبُني على السكون."
- "«آمُلُ» مضارع «أَمَلَ» على «أَفْعُلُ»، وأصله «أَأْمُلُ» فقُلبت الهمزة الثانية ألفًا."
rhetoric:
  thesis: "اعتراف بالضعف: الرجاء باقٍ مع العلم بأنه لن يتحقق."
  devices:
  - title: "عطف المترادفين في «أَرْجُو وَآمُلُ»"
    text: "ينقل البَغْداديّ أن بعضهم فرّق بينهما: الرجاء «توقع حُصُول مَطْلُوب فِي الْمُسْتَقْبل مَعَ خوف عدم وُقُوعه»، والأمل «طلب حُصُول مَا يغلب وُقُوعه فِي ظن الطَّالِب» [@khizana، ج9 ص148]. فجمع الشاعر الخوف والطمع معًا."
  - title: "المقابلة بين «فِي أَبَدٍ» و«طَوَالَ الدَّهْرِ»"
    text: "يطلب وفاءً واحدًا في الدهر كله، ثم يقرر أنه لن يكون طوال الدهر. فالرجاء والنفي يقعان على الزمن نفسه."
  connection: "ثم ينهى نفسه: لا يغرّنك ما منّت ووعدت."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "أَرْجُو وَءَا / مُلُ أَنْ / يَعْجَلْنَ فِي / أَبَدِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — وَمَا لَهُنْ / نَ طَوَا / لَدْ دَهْرِ تَعْ / جِيلُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«أَرْجُو وَءَا» مستفعلن، و«مُلُ أَنْ» فعِلن. وفي العجز «وَمَا لَهُنْ» متفعلن، و«نَ طَوَا» فعِلن، وكلتاهما مخبونة."
variants:
- reading: "أَرْجُو وَآمُلُ أَنْ تَدْنُو مَوَدَّتُهَا / وَمَا إِخَالُ لَدَيْنَا مِنْكِ تَنْوِيلُ"
  status: "رواية"
  note: "يذكرها السُّكَّرِيّ [@diwan-kaab، ص9]، وهي رواية السيرة [@ibn-hisham، ج2 ص505]، والشاهد في خزانة الأدب، ويقول البَغْداديّ إن البيت لم يرد في رواية نِفْطَوَيْه، وإن الأحول رواه برواية الديوان [@khizana، ج9 ص143، ص146]. والتَّنْوِيل: العطاء [@diwan-kaab، ص9]."
