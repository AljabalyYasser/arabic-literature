first: "لَقَدْ أَقُومُ مَقَامًا لَوْ يَقُومُ بِهِ"
second: "أَرَى وَأَسْمَعُ مَا لَوْ يَسْمَعُ الْفِيلُ"
meaning: "لقد وقفتُ موقفًا أرى فيه وأسمع ما لو رآه الفيل أو سمعه... والجواب في البيت التالي: لظلّ يرتعد. قال السُّكَّرِيّ: «ولما كان الفيل عنده ضخمًا توهّم أنه أسمع الأشياء» [@diwan-kaab، ص20]، ويقول المحققون: «أي أرى ما لو يراه الفيل لظلّ يرعد وأسمع ما لو يسمعه لظلّ يرعد» [@diwan-kaab، ص20]."
vocabulary:
- term: "أَقُومُ مَقَامًا"
  text: "أقف موقفًا. ويقول المحققون: «أقوم هنا في موضع الماضي، كأنه قال: لقد قمت مقامًا» [@diwan-kaab، ص20]."
- term: "الْفِيلُ"
  text: "الحيوان المعروف، ضرب به المثل في الضخامة والقوة. وفيه قول آخر عند السُّكَّرِيّ: «إن الفيل ها هنا: الذي لا رأي له ولا عقل، يقال: رجل فائل الرأي وفِيل الرأي» [@diwan-kaab، ص20]."
context: "بداية مقطع المقام (39–42): يصف وقفته بين يدي النبي صلى الله عليه وسلم. ويقرن السُّكَّرِيّ البيت بقول لَبِيد: «لو يقوم الفيل أو فيّاله / زلّ عن مثل مقامي وزحل» [@diwan-kaab، ص20]."
syntax:
- "«لَقَدْ»: اللام للقسم، و«قد» للتحقيق، و«مَقَامًا» مفعول مطلق أو مفعول فيه."
- "جملة «لَوْ يَقُومُ بِهِ» صفة لـ«مقامًا»، و«الفيل» فاعل «يقوم» متأخر إلى العجز، وجواب «لو» في البيت التالي «لظلّ يرعد»."
- "«أَرَى وَأَسْمَعُ مَا» معترضة، و«ما» موصولة مفعول به لـ«أسمع» تنازعه «أرى»."
morphology:
- "«مَقَامًا» مصدر ميمي أو اسم مكان من «قام»."
- "«يَسْمَعُ» و«يَقُومُ» مضارعان بعد «لو» بمعنى الماضي."
rhetoric:
  thesis: "يقيس هيبة المقام بأقوى الحيوان: لو وقف الفيل موقفه لارتعد."
  devices:
  - title: "التنازع والتعقيد"
    text: "فعلان «أرى» و«أسمع» يتنازعان مفعولًا واحدًا، وفاعل «يقوم» مؤخر إلى آخر البيت، وجواب «لو» في البيت التالي. فالجملة متداخلة طويلة، كأن الشاعر يتلعثم من الهيبة. وهذه قراءتنا."
  - title: "المبالغة بالفيل"
    text: "اختار أضخم ما يعرفه الناس ليقيس به الخوف، وقال السُّكَّرِيّ إنه توهّمه «أسمع الأشياء» لضخامته [@diwan-kaab، ص20]."
  connection: "ثم يتم الشرط: لظل يرعد إلا أن يكون له أمان من الرسول."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "لَقَدْ أَقُو / مُ مَقَا / مَنْ لَوْ يَقُو / مُ بِهِي = متفعلن / فعِلن / مستفعلن / فعِلن — أَرَا وَأَسْ / مَعُ مَا / لَوْ يَسْمَعُلْ / فِيلُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«لَقَدْ أَقُو» متفعلن، و«مُ مَقَا» فعِلن، و«أَرَا وَأَسْ» في العجز متفعلن، وكلها مخبونة."
variants:
