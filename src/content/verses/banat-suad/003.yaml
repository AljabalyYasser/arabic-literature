first: "تَجْلُو عَوَارِضَ ذِي ظَلْمٍ إِذَا ابْتَسَمَتْ"
second: "كَأَنَّهُ مُنْهَلٌ بِالرَّاحِ مَعْلُولُ"
meaning: "إذا ابتسمت كشفت عن أسنانها اللامعة، فكأن ثغرها سُقي الخمر مرة بعد مرة. قال السُّكَّرِيّ: «العوارض: الأسنان، وهي ما بين الثنيّة والضرس. والظَّلْم: ماء الأسنان» [@diwan-kaab، ص7]."
vocabulary:
- term: "تَجْلُو"
  text: "تكشف وتُظهر؛ وفي اللسان أنه يصف الثنايا وما بعدها «أَي تَكْشِفُ» [@lisan، ج7 ص180]."
- term: "عَوَارِضَ"
  text: "«الأسنان، وهي ما بين الثنيّة والضرس» [@diwan-kaab، ص7]."
- term: "ظَلْمٍ"
  text: "«ماء الأسنان» [@diwan-kaab، ص7]: بريقها وصفاؤها. ويقول المحققون: «أي الماء الذي يجري ويظهر على الأسنان من صفاء اللون لا من الريق» [@diwan-kaab، ص7]."
- term: "مُنْهَلٌ ... مَعْلُولُ"
  text: "«ومُنْهَل: قد أُنهل بالخمر، والنَّهَل: أول شربة. والمعلول: قد سُقي مرتين، والعَلَل: الشرب الثاني» [@diwan-kaab، ص7]."
- term: "الرَّاحِ"
  text: "الخمر."
context: "أول أبيات الثغر الثلاثة (3–5): الأسنان، ثم الخمر التي مُزجت بماء بارد، ثم الماء نفسه وقد ملأته السحب."
syntax:
- "فاعل «تَجْلُو» ضمير سعاد، و«عَوَارِضَ» مفعول به، وهو ممنوع من الصرف لأنه على صيغة منتهى الجموع."
- "«ذِي ظَلْمٍ» صفة لـ«عَوَارِضَ»، وأفرد «ذي» على معنى الثغر. و«إِذَا ابْتَسَمَتْ» ظرف شرط، جوابه دلّ عليه ما قبله."
- "الضمير في «كَأَنَّهُ» يعود على «ذي ظَلْم»، أي الثغر. و«مُنْهَلٌ» خبر «كأنّ»، و«مَعْلُولُ» خبر ثانٍ."
morphology:
- "«مُنْهَلٌ» اسم مفعول من الرباعي «أَنْهَلَ»، و«مَعْلُولُ» اسم مفعول من الثلاثي «عَلَّ» إذا سقى الشربة الثانية."
- "«ابْتَسَمَتْ» على «افْتَعَلَ»، وهمزتها همزة وصل تسقط في الدرج."
rhetoric:
  thesis: "يصف الثغر بلونه أولًا ثم بطعمه: لمعان الأسنان، ثم ريق كالخمر."
  devices:
  - title: "التشبيه في «كَأَنَّهُ مُنْهَلٌ بِالرَّاحِ مَعْلُولُ»"
    text: "شبّه الثغر بإناء سُقي الخمر مرتين، والوجه طيب الرائحة والطعم. والشبه يحتاج إلى قليل من التأوّل، لأن الطعم لا يُرى، وهو عند عبد القاهر الجُرْجانيّ من الضرب الذي يكون «الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]."
  - title: "الطباق الخفي في «مُنْهَلٌ ... مَعْلُولُ»"
    text: "الشربة الأولى والشربة الثانية: فكأن الخمر لم تفارق الثغر قط."
  connection: "ثم يصف الخمر نفسها: مُزجت بماء بارد من منعطف وادٍ."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "تَجْلُو عَوَا / رِضَ ذِي / ظَلْمِنْ إِذَبْ / تَسَمَتْ = مستفعلن / فعِلن / مستفعلن / فعِلن — كَأَنْنَهُو / مُنْهَلُنْ / بِرْرَاحِ مَعْ / لُولُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«تَجْلُو عَوَا» مستفعلن، و«رِضَ ذِي» فعِلن، و«ظَلْمِنْ إِذَبْ» مستفعلن. وفي العجز «كَأَنْنَهُو» متفعلن بالخبن."
