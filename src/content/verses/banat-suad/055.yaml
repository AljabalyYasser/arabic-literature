first: "لَا يَقَعُ الطَّعْنُ إِلَّا فِي نُحُورِهِمُ"
second: "مَا إِنْ لَهُمْ عَنْ حِيَاضِ الْمَوْتِ تَهْلِيلُ"
meaning: "لا يقع الطعن إلا في نحورهم، لأنهم يواجهون العدو ولا يولّونه ظهورهم، وما لهم عن حياض الموت نكوص ولا تأخر. قال السُّكَّرِيّ: «قال الأصمعي: لا يفرّون ولا ينهزمون فيقع الطعن في أدبارهم ... وإنما أراد أنهم يواجهون القتال» [@diwan-kaab، ص25]."
vocabulary:
- term: "نُحُورِهِمُ"
  text: "صدورهم، والنحر: أعلى الصدر."
- term: "حِيَاضِ الْمَوْتِ"
  text: "مواضع الموت في المعركة، شبّهها بالحياض التي تُورد."
- term: "تَهْلِيلُ"
  text: "نكوص وتأخر. قال السُّكَّرِيّ: «يقال: هلّل الرجل إذا جبن في حملته»، «وقال غيره يقال: هلّل الرجل إذا هرب» [@diwan-kaab، ص25]. وفي اللسان: «والتَّهْلِيل: الفِرارُ والنُّكوصُ» [@lisan، ج11 ص704]."
context: "خاتمة القصيدة في رواية السُّكَّرِيّ، وآخر ما يبلغه الإنشاد في رواية أبي الفَرَج: «حتى انتهى إلى قوله» هذا البيت [@aghani-dk، ج17 ص89]. وهو من الأبيات العشرة عند ابن سَلّام [@ibn-sallam، ج1 ص102]. وبعده في الديوان: «فلما سمعت الأنصار هذه القصيدة شقّ عليهم حيث لم يذكرهم مع إخوانهم من المهاجرين» [@diwan-kaab، ص25]."
syntax:
- "«لَا يَقَعُ الطَّعْنُ إِلَّا فِي نُحُورِهِمُ»: «لا» نافية، و«الطعن» فاعل، و«إلا» أداة حصر، و«في نحورهم» متعلق بـ«يقع»."
- "«مَا إِنْ لَهُمْ ... تَهْلِيلُ»: «ما» نافية، و«إنْ» زائدة لتوكيد النفي، و«لهم» خبر مقدم، و«تهليل» مبتدأ مؤخر، و«عَنْ حِيَاضِ الْمَوْتِ» متعلق بـ«تهليل»."
morphology:
- "«نُحُورِ» جمع «نَحْر» على «فُعُول»."
- "«حِيَاضِ» جمع «حَوْض» على «فِعَال»، قُلبت الواو ياءً لانكسار ما قبلها."
rhetoric:
  thesis: "خاتمة تجمع الشجاعة كلها في صورة واحدة: الجرح في الصدر لا في الظهر."
  devices:
  - title: "الكناية في «لَا يَقَعُ الطَّعْنُ إِلَّا فِي نُحُورِهِمُ»"
    text: "لم يقل إنهم لا يفرّون، بل ذكر ما يلزم من ذلك: جراحهم كلها في صدورهم. وهي الكناية التي يجيء فيها المتكلم «إلى معنى هو تاليه وردفه في الوجود» كما يقول عبد القاهر الجُرْجانيّ [@dalail، ص66]."
  - title: "الاستعارة في «حِيَاضِ الْمَوْتِ»"
    text: "جعل للموت حياضًا يردونها كما ترد الإبل الماء، فصار الموت ماءً يُطلب."
  - title: "«مَا إِنْ»"
    text: "زيادة «إن» بعد «ما» تقوّي النفي، فيختم القصيدة بنفي مؤكد."
  connection: "بهذا البيت تنتهي القصيدة في رواية السُّكَّرِيّ. ويقول الخبر إن الأنصار غضبوا، فقال كعب «من سرّه كرم الحياة» يمدحهم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "لَا يَقَعُطْ / طَعْنُ إِلْ / لَا فِي نُحُو / رِهِمُو = مستعلن / فاعلن / مستفعلن / فعِلن — مَا إِنْ لَهُمْ / عَنْ حِيَا / ضِلْ مَوْتِ تَهْ / لِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«لَا يَقَعُطْ» في أول الصدر مستعلن بالطيّ، و«طَعْنُ إِلْ» فاعلن."
variants:
- reading: "وَمَا لَهُمْ عَنْ حِيَاضِ الْمَوْتِ تَهْلِيلُ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص513] واللسان [@lisan، ج11 ص704]."
- reading: "وَمَا بِهِمْ عَنْ حِيَاضِ الْمَوْتِ تَهْلِيلُ"
  status: "رواية"
  note: "عند ابن سَلّام [@ibn-sallam، ج1 ص102] وأبي الفَرَج، ويقول أبو الفَرَج: «هكذا فى رواية عمر بن شبّة، ورواية غيره «تعليل»» [@aghani-dk، ج17 ص89]."
