first: "زَالُوا فَمَا زَالَ أَنْكَاسٌ وَلَا كُشُفٌ"
second: "عِنْدَ اللِّقَاءِ وَلَا مِيلٌ مَعَازِيلُ"
meaning: "فانتقلوا، فما انتقل منهم عند اللقاء ضعيف ولا منهزم ولا مائل عن سرجه ولا أعزل بلا سلاح. قال السُّكَّرِيّ: «الكُشُف: الذين ينهزمون ولا يثبتون. والمِيل: جمع الأميل وهو الذي لا يثبت على السرج. والنِّكْس: الضعيف» [@diwan-kaab، ص23]."
vocabulary:
- term: "أَنْكَاسٌ"
  text: "جمع نِكْس، وهو «الضعيف، وأصله أن يُنكس نصل السهم فيؤخذ سِنخه الذي كان داخلًا فيُجعل نصلًا ... فيكون ضعيفًا لا خير فيه» [@diwan-kaab، ص23]."
- term: "كُشُفٌ"
  text: "«الذين ينهزمون ولا يثبتون» [@diwan-kaab، ص23]. وفي اللسان: «والكُشُفُ: الَّذِينَ لَا يَصْدُقون القِتال» [@lisan، ج9 ص300]."
- term: "مِيلٌ"
  text: "«جمع الأميل وهو الذي لا يثبت على السرج» [@diwan-kaab، ص23]."
- term: "مَعَازِيلُ"
  text: "«جمع معزال وهو الذي لا سلاح معه أو الضعيف» كما يقول المحققون [@diwan-kaab، ص23]. وفي اللسان: «أَي لَيْس مَعَهُمْ سِلاحٌ، وَاحِدُهُمْ مِعْزالٌ» [@lisan، ج11 ص442]."
context: "أول صفات المهاجرين: نفي العيوب الحربية كلها. وهو من الأبيات العشرة عند ابن سَلّام [@ibn-sallam، ج1 ص102]."
syntax:
- "«زَالُوا» فعل وفاعل، والفاء في «فَمَا زَالَ» عاطفة، و«ما» نافية، و«زال» هنا تامة بمعنى انتقل، و«أَنْكَاسٌ» فاعلها."
- "«وَلَا كُشُفٌ» و«وَلَا مِيلٌ» معطوفان على «أنكاس»، و«مَعَازِيلُ» صفة لـ«ميل» أو معطوف بلا عاطف. و«عِنْدَ اللِّقَاءِ» ظرف."
morphology:
- "«زَالَ» الأولى والثانية تامة من «زال يزول»، بمعنى انتقل، لا الناقصة."
- "«مَعَازِيلُ» جمع «مِعْزال» على «مَفَاعِيل»، ومفعال من أبنية المبالغة."
rhetoric:
  thesis: "المدح بالنفي: يعدّد عيوب المقاتلين ثم ينفيها كلها."
  devices:
  - title: "الجناس في «زَالُوا فَمَا زَالَ»"
    text: "الفعل نفسه مثبتًا ثم منفيًا: انتقلوا من مكة، وما انتقل منهم أحد عن موضعه في الحرب. والفعل بعد «زولوا» في البيت السابق يتردد ثلاث مرات."
  - title: "تعداد المنفيات"
    text: "أربع صفات منفية: الضعف، والانهزام، والميل عن السرج، والعزلة من السلاح. وكل نفي يثبت ضده."
  connection: "ثم يثبت صفاتهم: شمّ الأنوف، أبطال في دروع داود."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "زَالُو فَمَا / زَالَ أَنْ / كَاسُنْ وَلَا / كُشُفُنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — عِنْدَلْ لِقَا / ءِ وَلَا / مِيلُنْ مَعَا / زِيلُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«عِنْدَلْ لِقَا» مستفعلن، و«ءِ وَلَا» فعِلن."
variants:
- reading: "يَوْمَ اللِّقَاءِ وَلَا سُودٌ مَعَازِيلُ"
  status: "رواية"
  note: "عند ابن سَلّام [@ibn-sallam، ج1 ص102] وابن قُتَيْبة [@ibn-qutayba، ج1 ص154]، وعند أبي الفَرَج «ولا خُورٌ معازيل» [@aghani-dk، ج17 ص88]."
