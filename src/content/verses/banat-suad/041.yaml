first: "حَتَّى وَضَعْتُ يَمِينِي لَا أُنَازِعُهُ"
second: "فِي كَفِّ ذِي نَقِمَاتٍ قِيلُهُ الْقِيلُ"
meaning: "حتى وضعت يميني في كف صاحب النقمات، الذي قوله القول الصادق النافذ، لا أنازعه. يقول المحققون: «أي وضعت يميني في يمينه وضع طاعة لا أنازعه، يعني أنه أسلم نفسه له وبايعه» [@diwan-kaab، ص21]."
vocabulary:
- term: "لَا أُنَازِعُهُ"
  text: "لا أخالفه ولا أجاذبه."
- term: "نَقِمَاتٍ"
  text: "«جمع نقمة ككلمة وكلمات» [@diwan-kaab، ص21]، أي العقوبات."
- term: "قِيلُهُ الْقِيلُ"
  text: "«أي قوله الصادق» [@diwan-kaab، ص21]، ويقول المحققون: «المعتدّ به النافذ الماضي» [@diwan-kaab، ص21]."
context: "لحظة البيعة. ويروي ابن إسحاق أن كعبًا «جَلَسَ إلَيْهِ، فَوَضَعَ يَدَهُ فِي يَدِهِ» [@ibn-hisham، ج2 ص503]، وعند ابن سَلّام أنه «بسط يده» [@ibn-sallam، ج1 ص100]. فالبيت يصف ما يرويه الخبر."
syntax:
- "«حَتَّى» ابتدائية أو غائية متعلقة بـ«أقوم» في البيت 39، و«يَمِينِي» مفعول «وضعت»."
- "جملة «لَا أُنَازِعُهُ» حال من الفاعل. و«فِي كَفِّ» متعلق بـ«وضعت»."
- "«قِيلُهُ الْقِيلُ»: مبتدأ وخبر، والجملة صفة لـ«ذي نقمات»، وتعريف الخبر يفيد الحصر."
morphology:
- "«قِيلُ» مصدر «قال» كالقول، وجمع السُّكَّرِيّ أمثاله: «والعرب تقول: قِيل وقال» [@diwan-kaab، ص21]."
- "«نَقِمَاتٍ» جمع «نَقِمَة» جمع مؤنث سالمًا."
rhetoric:
  thesis: "الخوف يتحول إلى طاعة: يد في يد، بلا منازعة."
  devices:
  - title: "الكناية في «وَضَعْتُ يَمِينِي ... فِي كَفِّ»"
    text: "وضع اليد في اليد كناية عن البيعة والتسليم. ويقول المحققون: «وكان العرب إذا تحالفوا على شيء ضرب كل منهما على يمين صاحبه» [@diwan-kaab، ص21]."
  - title: "«ذِي نَقِمَاتٍ قِيلُهُ الْقِيلُ»"
    text: "يصف الممدوح بالقدرة على العقاب وبصدق القول معًا، فالعفو منه عفو قادر، والوعد منه نافذ."
  - title: "الجناس في «قِيلُهُ الْقِيلُ»"
    text: "تكرار الكلمة نفسها مضافةً ثم معرّفة: قوله هو القول كله."
  connection: "ثم يقول إنه أهيب عنده من الأسد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "حَتْتَا وَضَعْ / تُ يَمِي / نِي لَا أُنَا / زِعُهُو = مستفعلن / فعِلن / مستفعلن / فعِلن — فِي كَفْفِ ذِي / نَقِمَا / تِنْ قِيلُهُلْ / قِيلُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "البيت تام إلا العروض «زِعُهُو» فعِلن وحشو «تُ يَمِي» و«نَقِمَا» فعِلن."
variants:
- reading: "بيت قبله في السيرة"
  status: "زيادة في نسخة من السيرة"
  note: "يذكر المحققون أنه «روي في السيرة قبل هذا البيت: ما زلت أقتطع البيداء مدّرعا / جنح الظلام وثوب الليل مسبول» [@diwan-kaab، ص21]، ويقول محققو السيرة إن النسخة (أ) زادته [@ibn-hisham، ج2 ص511]."
