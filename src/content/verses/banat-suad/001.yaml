first: "بَانَتْ سُعَادُ فَقَلْبِي الْيَوْمَ مَتْبُولُ"
second: "مُتَيَّمٌ إِثْرَهَا لَمْ يُجْزَ مَكْبُولُ"
meaning: "فارقتني سعاد، فقلبي اليوم مصاب بها كمن أصابه الثأر والعداوة، ذليل للحب يتبع أثرها، محبوس عندها كالمقيّد، لم تُثبه على حبه بشيء. قال السُّكَّرِيّ: «ومكبول: محتبس عندها»، و«لم يُجْزَ: من الجزاء. يقول: ما أثابتني» [@diwan-kaab، ص6]."
vocabulary:
- term: "بَانَتْ"
  text: "«فارقت» [@diwan-kaab، ص6]."
- term: "مَتْبُولُ"
  text: "«أصيب بتبل، أي تبلت قلبي» [@diwan-kaab، ص6]. والتَّبْل في اللسان «الذَّحْل والعَدَاوة. يُقَالُ: قَلْب مَتْبُول إِذا غَلَبَه الحُبُّ وهَيَّمه» [@lisan، ج11 ص76]؛ والذَّحْل: الثأر."
- term: "مُتَيَّمٌ"
  text: "«مضلل وهو التذلل، ذلله الحب» [@diwan-kaab، ص6]. وفي اللسان: «التَّيْمُ: أَن يَسْتَعْبده الهَوَى»، وفي قصيدة كعب «أَي مُعَبَّد مُذَلَّل» [@lisan، ج12 ص75]."
- term: "إِثْرَهَا"
  text: "في أثرها، أي يتبعها حيث ذهبت؛ وهو ظرف."
- term: "مَكْبُولُ"
  text: "«محتبس عندها. والكبل: القيد، يقال: مكبّل ومكبول بمعنى واحد» [@diwan-kaab، ص6]."
context: "مطلع القصيدة، وهو أول ما أنشده كعب بين يدي النبي صلى الله عليه وسلم في كل روايات الخبر [@ibn-hisham، ج2 ص503] [@ibn-sallam، ج1 ص100] [@aghani-dk، ج17 ص87]. يبدأ بالنسيب على عادة القصيدة الجاهلية، فلا يدخل في الاعتذار حتى يقطع الصحراء إلى صاحبته على ناقته."
syntax:
- "«بَانَتْ سُعَادُ» جملة فعلية، و«سُعَادُ» فاعل مرفوع بالضمة بلا تنوين، لأنه علم مؤنث."
- "«فَقَلْبِي الْيَوْمَ مَتْبُولُ»: الفاء للسببية، و«قَلْبِي» مبتدأ، و«الْيَوْمَ» ظرف زمان متعلق بـ«مَتْبُولُ»، و«مَتْبُولُ» خبر."
- "«مُتَيَّمٌ» و«مَكْبُولُ» خبران آخران للمبتدأ «قلبي»، و«إِثْرَهَا» ظرف متعلق بـ«مُتَيَّمٌ»، وجملة «لَمْ يُجْزَ» في موضع خبر أو حال، ونائب الفاعل ضمير القلب."
morphology:
- "«مَتْبُولُ» و«مَكْبُولُ» اسما مفعول على «مَفْعُول» من الثلاثي: تَبَلَه الحبّ، وكَبَلَه القيد."
- "«مُتَيَّمٌ» اسم مفعول من «تَيَّمَ» المضعّف العين، والتضعيف للتكثير: استعبده الحب مرة بعد مرة."
- "«يُجْزَ» مضارع «جَزَى» مبني للمجهول، مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة من آخره."
rhetoric:
  thesis: "يبدأ كعب بالفراق ثم يصف أثره في القلب بثلاث صفات متتابعة، كل واحدة منها أشد من التي قبلها: مصاب، ثم ذليل، ثم مقيّد لا يُفدى."
  devices:
  - title: "الاستعارة في «مَتْبُولُ» و«مَكْبُولُ»"
    text: "جعل الحب ثأرًا أصاب القلب، ثم جعله قيدًا يحبسه. فالقلب لا يُقيَّد ولا يُثأر منه، والشاعر يعطيه حال الأسير. وهذه الاستعارة التي يقول فيها عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
  - title: "«الْيَوْمَ»"
    text: "ظرف قصير يحدد الألم بزمن الفراق نفسه: فالبين وقع اليوم، والقلب اليوم متبول. وهو يهيئ للبيت الثاني «غَدَاةَ الْبَيْنِ»."
  - title: "التصريع"
    text: "اتفاق «مَتْبُولُ» و«مَكْبُولُ» في الوزن والقافية، فالعروض تتبع الضرب، كما في مطالع القصائد الطوال."
  connection: "ثم يصف سعاد يوم رحيلها، فيشبهها بظبي أغنّ."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "بَانَتْ سُعَا / دُ فَقَلْ / بِلْ يَوْمَ مَتْ / بُولُو = مستفعلن / فعِلن / مستفعلن / فعْلن — مُتَيْيَمُنْ / إِثْرَهَا / لَمْ يُجْزَ مَكْ / بُولُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«بَانَتْ سُعَا» مستفعلن تامة، و«دُ فَقَلْ» فعِلن مخبونة، وهي عروض البسيط التام. وفي العجز «مُتَيْيَمُنْ» متفعلن بالخبن، وهو حذف الثاني الساكن. والضرب «بُولُو» فعْلن مقطوعة. والبيت مصرّع."
variants:
- reading: "مُتَيَّمٌ إِثْرَهَا لَمْ يُفْدَ مَكْبُولُ"
  status: "رواية"
  note: "«ويروى: «لم يُفْدَ» من الفداء» [@diwan-kaab، ص6]، وهي رواية السيرة [@ibn-hisham، ج2 ص503] واللسان [@lisan، ج12 ص75]: أي لم يُفتدَ من أسره."
- reading: "مُتَيَّمٌ عِنْدَهَا لَمْ يُجْزَ مَكْبُولُ"
  status: "رواية"
  note: "عند أبي الفَرَج [@aghani-dk، ج17 ص87]، وهي رواية النسخة (أ) من السيرة كما يقول محققوها [@ibn-hisham، ج2 ص503]."
