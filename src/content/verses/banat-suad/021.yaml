first: "كَأَنَّ مَا فَاتَ عَيْنَيْهَا وَمَذْبَحَهَا"
second: "مِنْ خَطْمِهَا وَمِنَ اللَّحْيَيْنِ بِرْطِيلُ"
meaning: "كأن ما جاوز عينيها ومذبحها من أنفها ولحييها حجرٌ مستطيل؛ أي إن وجهها طويل صلب. قال السُّكَّرِيّ: «البِرطيل: واحد البراطيل وهي حجارة إلى الطول ما هي» [@diwan-kaab، ص12]."
vocabulary:
- term: "مَذْبَحَهَا"
  text: "موضع الذبح من العنق."
- term: "خَطْمِهَا"
  text: "«الأنف أو الموضع الذي يقع عليه الخطام» كما يقول المحققون [@diwan-kaab، ص12]."
- term: "اللَّحْيَيْنِ"
  text: "«العظمان اللذان تنبت عليهما اللحية من الإنسان ونظير ذلك من بقية الحيوان» [@diwan-kaab، ص12]."
- term: "بِرْطِيلُ"
  text: "«حجارة إلى الطول ما هي، وقد يكون المِعْول» [@diwan-kaab، ص12]. وفي اللسان: «البِرْطِيل حَجَر مُسْتَطِيلٌ عَظِيمٌ شُبِّهَ بِهِ رأْس النَّاقَةِ» [@lisan، ج11 ص51]."
context: "آخر صفات الخلقة قبل الذيل والضرع: الرأس. وبه يختم صورة الصلابة التي بدأت بـ«عيرانة»."
syntax:
- "«مَا» موصولة اسم «كأنّ»، و«فَاتَ عَيْنَيْهَا» صلتها، و«بِرْطِيلُ» خبر «كأنّ»."
- "«مِنْ خَطْمِهَا وَمِنَ اللَّحْيَيْنِ» بيان لـ«ما» الموصولة."
morphology:
- "«بِرْطِيلُ» على «فِعْلِيل»، وجمعه «بَرَاطِيل»."
- "«اللَّحْيَيْنِ» مثنى «لَحْي» مجرور بالياء."
rhetoric:
  thesis: "صورة الرأس بالحجر: طول وصلابة."
  devices:
  - title: "التشبيه في «كَأَنَّ مَا فَاتَ عَيْنَيْهَا ... بِرْطِيلُ»"
    text: "المشبه جزء محدد بدقة، ما بين العينين والمذبح، والمشبه به حجر مستطيل. والشبه في الشكل والصلابة يُرى بالعين، فهو من الضرب الذي لا يحتاج إلى تأوّل عند عبد القاهر الجُرْجانيّ، كتشبيه الخد بالورد، «وأنت تراها ها هنا كما تراها هناك» [@asrar، ص92]."
  - title: "الإيجاز بالموصول «مَا فَاتَ»"
    text: "لم يعدّد الأجزاء، بل حدّها بما جاوز العينين والمذبح. وقال الأَصْمَعِيّ: «الوجه كله فائت العينين إلا الجبهة» [@diwan-kaab، ص12]."
  connection: "ثم ينتقل إلى الذيل والضرع."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "كَأَنْنَ مَا / فَاتَ عَيْ / نَيْهَا وَمَذْ / بَحَهَا = متفعلن / فاعلن / مستفعلن / فعِلن — مِنْ خَطْمِهَا / وَمِنَلْ / لَحْيَيْنِ بِرْ / طِيلُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«كَأَنْنَ مَا» متفعلن مخبونة، و«فَاتَ عَيْ» فاعلن تامة."
variants:
- reading: "كَأَنَّمَا قَابَ عَيْنَيْهَا"
  status: "رواية"
  note: "يذكرها محققو السيرة، «والقاب: المقدار» [@ibn-hisham، ج2 ص508]."
