first: "لَظَلَّ يُرْعَدُ إِلَّا أَنْ يَكُونَ لَهُ"
second: "مِنَ الرَّسُولِ بِإِذْنِ اللَّهِ تَنْوِيلُ"
meaning: "...لظلّ الفيل يرتعد خوفًا، إلا أن يكون له من الرسول، بإذن الله، أمان وعفو. قال السُّكَّرِيّ: «التنويل: من النائل وهو العطاء ... والتنويل ها هنا: الأمان والعفو» [@diwan-kaab، ص20]."
vocabulary:
- term: "يُرْعَدُ"
  text: "يرتعد، أي تأخذه الرعدة من الخوف."
- term: "تَنْوِيلُ"
  text: "«من النائل وهو العطاء»، «والتنويل ها هنا: الأمان والعفو» [@diwan-kaab، ص20]."
context: "جواب الشرط في البيت السابق. ويستثني من الرعدة حالة واحدة: الأمان من الرسول. وهي الحالة التي يرجوها كعب لنفسه."
syntax:
- "«لَظَلَّ»: اللام واقعة في جواب «لو» في البيت السابق، واسم «ظلّ» ضمير الفيل، وجملة «يُرْعَدُ» خبرها."
- "«إِلَّا أَنْ يَكُونَ لَهُ ... تَنْوِيلُ»: استثناء، و«تنويل» اسم «يكون»، و«له» خبرها مقدم، و«مِنَ الرَّسُولِ» و«بِإِذْنِ اللَّهِ» متعلقان بمحذوف."
morphology:
- "«يُرْعَدُ» مضارع مبني للمجهول من «أُرْعِدَ» إذا أخذته الرِّعدة."
- "«تَنْوِيلُ» مصدر «نَوَّلَ» على «تَفْعِيل»."
rhetoric:
  thesis: "الاستثناء يحمل الرجاء كله: لا نجاة إلا بأمان الرسول."
  devices:
  - title: "الاحتراس في «بِإِذْنِ اللَّهِ»"
    text: "جعل الأمان من الرسول، ثم قيده بإذن الله، فلا يُفهم أن العطاء من غير الله."
  - title: "«تَنْوِيلُ»"
    text: "الكلمة نفسها جاءت في رواية البيت 11 «وما إخال لدينا منك تنويل» في سعاد. فالعطاء الذي يئس منه في النسيب يرجوه هنا. وهذه قراءتنا."
  connection: "ثم يصف لحظة البيعة: وضع يمينه في كف النبي."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "لَظَلْلَ يُرْ / عَدُ إِلْ / لَا أَنْ يَكُو / نَ لَهُو = متفعلن / فعِلن / مستفعلن / فعِلن — مِنَرْ رَسُو / لِ بِإِذْ / نِلْ لَاهِ تَنْ / وِيلُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«لَظَلْلَ يُرْ» متفعلن، و«عَدُ إِلْ» فعِلن، وكلتاهما مخبونة."
variants:
- reading: "لَظَلَّ تُرْعَدُ مِنْ وَجْدٍ بَوَادِرُهُ / إِنْ لَمْ يَكُنْ مِنْ رَسُولِ اللَّهِ تَنْوِيلُ"
  status: "رواية"
  note: "يذكرها المحققون [@diwan-kaab، ص20] ومحققو السيرة [@ibn-hisham، ج2 ص511]، و«البوادر: اللحم الذي بين العنق والكتف» [@ibn-hisham، ج2 ص511]."
