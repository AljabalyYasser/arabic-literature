first: "تُمِرُّ مِثْلَ عَسِيبِ النَّخْلِ ذَا خُصَلٍ"
second: "فِي غَارِزٍ لَمْ تَخَوَّنْهُ الْأَحَالِيلُ"
meaning: "تمرّ ذنبها، وهو كجريدة النخل ذات خُصَل، على ضرع قلّ لبنه، لم تنقصه مجاري اللبن، أي لم تُحلب. قال السُّكَّرِيّ: «يريد أنها لم تُنتج فتُحلب فيضرّ ذلك بقوتها. وتُمرّ: يريد تمرّ ذنبها على ضرعها» [@diwan-kaab، ص13]."
vocabulary:
- term: "عَسِيبِ النَّخْلِ"
  text: "جريدة النخل التي كُشط خوصها."
- term: "خُصَلٍ"
  text: "جمع خُصلة، وهي الشعر المجتمع."
- term: "غَارِزٍ"
  text: "«الضرع قد غرز وقلّ لبنه» كما يقول المحققون [@diwan-kaab، ص13]. وفي اللسان: «الغارِزُ: الضَّرْعُ قَدْ غَرَزَ وقَلَّ لَبَنُهُ» [@lisan، ج5 ص387]."
- term: "تَخَوَّنْهُ"
  text: "«لم تنقصه» [@diwan-kaab، ص13]."
- term: "الْأَحَالِيلُ"
  text: "«مجاري اللبن» [@diwan-kaab، ص13]، جمع إحليل."
context: "من الأبيات السبعة التي يقول ابن هشام إنها «عَنْ غَيْرِ ابْنِ إسْحَاقَ» [@ibn-hisham، ج2 ص514]، وهي في رواية السُّكَّرِيّ. ويصف الذنب والضرع: الذنب طويل كثيف، والضرع جاف لأنها لم تُنتج، فقوتها كلها للسير."
syntax:
- "مفعول «تُمِرُّ» محذوف، أي تمرّ ذنبًا، و«مِثْلَ» صفة له نابت عنه، و«ذَا خُصَلٍ» حال من «عسيب» أو صفة للمحذوف."
- "«فِي غَارِزٍ» متعلق بـ«تُمِرّ»، وجملة «لَمْ تَخَوَّنْهُ الْأَحَالِيلُ» صفة لـ«غارز»."
morphology:
- "«تَخَوَّنْهُ» أصلها «تَتَخَوَّنْهُ»، حُذفت إحدى التاءين، وهي مجزومة بـ«لم»."
- "«الْأَحَالِيلُ» جمع «إِحْلِيل» على «أَفَاعِيل»."
rhetoric:
  thesis: "صفة يخالف فيها كعب ما يستحسنه بعض العلماء في نجائب الركوب."
  devices:
  - title: "التشبيه في «مِثْلَ عَسِيبِ النَّخْلِ»"
    text: "حذف المشبه، وهو الذنب، وأبقى المشبه به، فعرفه السامع من الفعل «تمرّ». والشبه في الطول والكثافة."
  - title: "نقد الوصف"
    text: "قال أبو سعيد: «خطأ أن توصف بعظم الذنب وكثرة الهُلْب، وأفضل ما يكون منها للركوب أن تكون جدّاء قصيرة الذنب» [@diwan-kaab، ص13]. والهُلْب: شعر الذنب. ونقل السُّكَّرِيّ عن بعض العرب ما يخالفه: «إذا كانت المَهْرية كأن ذنبها أفعى فهي عتيقة» [@diwan-kaab، ص13]."
  connection: "ثم يصف أنفها وأذنيها وخديها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "تُمِرْرُ مِثْ / لَ عَسِي / بِنْ نَخْلِ ذَا / خُصَلِنْ = متفعلن / فعِلن / مستفعلن / فعِلن — فِي غَارِزِنْ / لَمْ تَخَوْ / وَنْهُلْ أَحَا / لِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«تُمِرْرُ مِثْ» متفعلن، و«لَ عَسِي» فعِلن."
variants:
- reading: "بِغَارِبٍ لَمْ تُخَوِّنْهُ الْأَحَالِيلُ"
  status: "رواية"
  note: "في اللسان [@lisan، ج11 ص170]، وفيه أيضًا «بغارز» [@lisan، ج5 ص387]."
