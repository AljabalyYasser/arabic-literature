first: "كَانَتْ مَوَاعِيدُ عُرْقُوبٍ لَهَا مَثَلًا"
second: "وَمَا مَوَاعِيدُهَا إِلَّا الْأَبَاطِيلُ"
meaning: "صارت مواعيد عرقوب مثلًا لها، فما مواعيدها إلا أباطيل. وعرقوب عند السُّكَّرِيّ «رجل من العمالقة نزل بالمدينة»، وعد صديقًا ثمر نخلة، فلما صارت بلحًا قال: دعه حتى يشقّح، فلما شقّحت قال: دعها حتى تصير رطبًا، فلما صارت رطبًا قال: دعه حتى يصير تمرًا، «فلما صار تمرًا انطلق إليه عرقوب فجدّه ليلًا. فجاء الرجل بعد أيام فلم يرَ إلا عودًا قائمًا. فذهب موعود عرقوب مثلًا» [@diwan-kaab، ص8–9]."
vocabulary:
- term: "مَوَاعِيدُ عُرْقُوبٍ"
  text: "مثل في إخلاف الوعد. وفي اللسان: «وَمِنْ أَمثالهم فِي خُلْفِ الوَعْدِ: مواعِيدُ عُرْقوب. وعُرْقُوبٌ: اسْمُ رَجُلٍ مِنَ العَمالقة» [@lisan، ج1 ص595]."
- term: "الْأَبَاطِيلُ"
  text: "جمع باطل على غير قياس، أو جمع «أُبْطُولة»: ما لا حقيقة له."
- term: "يُشَقِّحُ"
  text: "في شرح السُّكَّرِيّ: «أي يحمرّ أو يصفرّ» [@diwan-kaab، ص8]، يعني البلح حين يبدأ يتلون."
context: "المثل الثالث في مقطع الخلّة الكاذبة، وأشهر أبيات النسيب. ويروي أبو الفَرَج أن كعبًا «عرّض بالأنصار فى قصيدته فى عدة مواضع، منها قوله» هذا البيت، ثم يقول: «وعرقوب: رجل من الأوس» [@aghani-dk، ج17 ص89–90]. فإذا صح ذلك كان المثل غمزًا بأهل يثرب الذين اعترض أحدهم على كعب. وفي حاشية المحققين على الأغاني أن عرقوبًا ليس من الأوس، «وإنما هو من العماليق» [@aghani-dk، ج17 ص90]."
syntax:
- "«مَوَاعِيدُ» اسم «كَانَتْ»، و«مَثَلًا» خبرها، و«لَهَا» متعلق بـ«مثلًا»."
- "«وَمَا مَوَاعِيدُهَا إِلَّا الْأَبَاطِيلُ»: «ما» نافية، و«مواعيدها» مبتدأ، و«الأباطيل» خبر، و«إلا» أداة حصر."
morphology:
- "«مَوَاعِيدُ» جمع «مَوْعِد» أو «مِيعَاد» على «مَفَاعِيل»، وأصل الياء فيها واو."
- "«عُرْقُوبٍ» علم مصروف، على «فُعْلُول»."
rhetoric:
  thesis: "يختم صفة الإخلاف بمثل يعرفه الناس كلهم، فينقل الحكم من تجربته الخاصة إلى حكمة عامة."
  devices:
  - title: "المثل في «مَوَاعِيدُ عُرْقُوبٍ»"
    text: "يكفي ذكر الاسم ليستحضر السامع القصة كلها: النخلة، والانتظار، والعود القائم. وهذا ما يجعل المثل أوجز الكلام."
  - title: "رد العجز على الصدر في «مَوَاعِيدُ ... مَوَاعِيدُهَا»"
    text: "كرّر الكلمة في الشطرين، فصارت مواعيدها ومواعيد عرقوب شيئًا واحدًا."
  connection: "ثم يعترف بأنه مع ذلك يرجو ويأمل."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "كَانَتْ مَوَا / عِيدُ عُرْ / قُوبِنْ لَهَا / مَثَلَنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — وَمَا مَوَا / عِيدُهَا / إِلْلَلْ أَبَا / طِيلُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«وَمَا مَوَا» في أول العجز متفعلن مخبونة، و«عِيدُهَا» فاعلن تامة."
variants:
- reading: "وَمَا مَوَاعِيدُهَا إِلَّا الْأَضَالِيلُ"
  status: "رواية"
  note: "في اللسان [@lisan، ج11 ص394]."
- reading: "وَمَا مَوَاعِيدُهُ إِلَّا الْأَبَاطِيلُ"
  status: "رواية"
  note: "عند ابن قُتَيْبة، بضمير عرقوب [@ibn-qutayba، ج1 ص153]."
- reading: "ترتيب الأبيات"
  status: "خلاف في الموضع"
  note: "في السيرة يأتي «فلا يغرنّك» قبل هذا البيت، ثم هذا البيت، ثم «أرجو وآمل» [@ibn-hisham، ج2 ص505]."
