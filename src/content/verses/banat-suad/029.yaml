first: "شَدَّ النَّهَارِ ذِرَاعَا عَيْطَلٍ نَصَفٍ"
second: "قَامَتْ فَجَاوَبَهَا نُكْدٌ مَثَاكِيلُ"
meaning: "...كأن رَجْع ذراعيها في ارتفاع النهار ذراعا امرأة طويلة متوسطة السن قامت تنوح، فجاوبتها نساء ثكالى فقدن أولادهن. قال السُّكَّرِيّ: «فشبّه يدي هذه الناقة في سرعة تقليبها إياهما بيدي هذه المرأة التي مات حميمها، وجعلها نَصَفًا ليكون أقوى لها على ترجيع يديها» [@diwan-kaab، ص17]."
vocabulary:
- term: "شَدَّ النَّهَارِ"
  text: "«ارتفاع النهار» [@diwan-kaab، ص17]."
- term: "عَيْطَلٍ"
  text: "«الطويلة» [@diwan-kaab، ص17]."
- term: "نَصَفٍ"
  text: "«التي بين العجوز والشابة» [@diwan-kaab، ص17]."
- term: "نُكْدٌ"
  text: "«قليلات الأولاد» في قول، وفي قول آخر: «جمع نكداء وهي التي لا يصيبها خير» [@diwan-kaab، ص17]."
- term: "مَثَاكِيلُ"
  text: "جمع مِثْكال، وهي التي فقدت أولادها."
context: "خبر «كأنّ» المؤجَّل من البيت 27: هنا يصل التشبيه. ويرى السُّكَّرِيّ في كل صفة سببًا: النَّصَف أقوى على الحركة، والنساء المثاكيل يزدن حزنها حين يجاوبنها."
syntax:
- "«شَدَّ النَّهَارِ» ظرف زمان، يقول المحققون: «وهو ظرف، أي وقت ارتفاع النهار» [@diwan-kaab، ص17]."
- "«ذِرَاعَا» خبر «كأنّ» في البيت 27، مرفوع بالألف لأنه مثنى، وحُذفت النون للإضافة."
- "جملة «قَامَتْ» صفة لـ«عيطل»، و«نُكْدٌ» فاعل «جاوبها»، و«مثاكيل» صفته."
morphology:
- "«عَيْطَلٍ» على «فَيْعَل»، و«نَصَفٍ» على «فَعَل» يستوي فيه المذكر والمؤنث."
- "«مَثَاكِيلُ» جمع «مِثْكَال» على «مَفَاعِيل»."
rhetoric:
  thesis: "التشبيه الذي ينتظره السامع منذ بيتين: يدا الناقة يدا نائحة. وهو من أشهر صور القصيدة."
  devices:
  - title: "التشبيه المركّب"
    text: "لا يشبّه ذراعًا بذراع فحسب، بل حركة متكررة سريعة بحركة متكررة سريعة: يدا الناقة ترتفعان وتنخفضان في السير كما ترفع النائحة يديها وتخفضهما في المأتم. والشبه في الهيئة والحركة، والصورة تزيد بالتفاصيل: الطول، والسن، والقيام، والجواب."
  - title: "«فَجَاوَبَهَا نُكْدٌ مَثَاكِيلُ»"
    text: "تشبيه داخل التشبيه يكبر: نائحة واحدة ثم جوقة من النائحات. ويقول المحققون: «لأن النساء المثاكيل إذا جاوبنها كان ذلك أقوى لحزنها وأنشط في ترجيع يديها» [@diwan-kaab، ص17]."
  connection: "ثم يكمل صفة النائحة في بيتين."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "شَدْدَنْ نَهَا / رِ ذِرَا / عَا عَيْطَلِنْ / نَصَفِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — قَامَتْ فَجَا / وَبَهَا / نُكْدُنْ مَثَا / كِيلُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "البيت تام التفعيلات، إلا العروض «نَصَفِنْ» فعِلن، و«رِ ذِرَا» و«وَبَهَا» فعِلن."
variants:
- reading: "أَوْبُ يَدَيْ فَاقِدٍ شَمْطَاءَ مُعْوِلَةٍ"
  status: "رواية الأَصْمَعِيّ"
  note: "«وروى الأصمعي: * أوب يدي فاقد شمطاء معولة *»، وقال: «وإنما قال: شمطاء لأنها لا ترجو ولدًا» [@diwan-kaab، ص17–18]. وهي رواية النسخة (أ) من السيرة [@ibn-hisham، ج2 ص509]، وفي اللسان «أَوْبُ يَدَيْ ناقةٍ شَمْطاءَ، مُعْوِلةٍ، / ناحَتْ، وجاوَبَها نُكْدٌ مَثاكِيلُ» [@lisan، ج1 ص220]."
