first: "لَكِنَّهَا خُلَّةٌ قَدْ سِيطَ مِنْ دَمِهَا"
second: "فَجْعٌ وَوَلْعٌ وَإِخْلَافٌ وَتَبْدِيلُ"
meaning: "لكنها صاحبة خُلطت بدمها هذه الخصال: إيقاع المصائب بمن يحبها، والكذب، وإخلاف الوعد، وتبديل خليل بخليل. قال السُّكَّرِيّ: «سيط: خُلط ... والفجع: المصيبة. والوَلْع: الكذب» [@diwan-kaab، ص8]. وفي اللسان: «أَي كأَنَّ هَذِهِ الأَخْلاقَ قَدْ خُلِطَتْ بِدَمِهَا» [@lisan، ج7 ص326]."
vocabulary:
- term: "سِيطَ"
  text: "«خُلط. والذي يُخلط به: المِسْواط» [@diwan-kaab، ص8]."
- term: "فَجْعٌ"
  text: "«المصيبة» [@diwan-kaab، ص8]، أي أنها تفجع من يحبها."
- term: "وَلْعٌ"
  text: "«الكذب، يقال: رجل وَلوع أي كذوب» [@diwan-kaab، ص8]. وفي اللسان: «والوَلْعُ، بِالتَّسْكِينِ: الكَذِبُ» [@lisan، ج8 ص410]."
- term: "تَبْدِيلُ"
  text: "أن تستبدل صاحبًا بصاحب."
context: "يستدرك على التمني في البيت السابق: هي كاملة لولا أخلاقها، ثم يعدّ الأخلاق. والأبيات التالية تفصيل لكلمتي «إخلاف وتبديل»."
syntax:
- "«لَكِنَّهَا خُلَّةٌ»: «لكنّ» حرف استدراك، والضمير اسمها، و«خُلَّةٌ» خبرها."
- "جملة «قَدْ سِيطَ مِنْ دَمِهَا فَجْعٌ» صفة لـ«خُلَّةٌ»، و«فَجْعٌ» نائب فاعل «سِيطَ»، وما بعده معطوف عليه."
- "«مِنْ دَمِهَا»: يقول المحققون إن «من هنا بمعنى في» [@diwan-kaab، ص8]، أي خُلط في دمها."
morphology:
- "«سِيطَ» ماض مبني للمجهول من الأجوف الواوي «سَاطَ يَسُوطُ»، قُلبت الواو ياء لانكسار ما قبلها."
- "«إِخْلَافٌ» مصدر «أَخْلَفَ» على «إِفْعَال»، و«تَبْدِيلُ» مصدر «بَدَّلَ» على «تَفْعِيل»."
rhetoric:
  thesis: "يجعل العيب في الدم، فلا يُرجى زواله. ويقول المحققون إنه «صار ذلك سجية لها لا طمع لها في زواله عنها» [@diwan-kaab، ص8]."
  devices:
  - title: "الاستعارة في «سِيطَ مِنْ دَمِهَا»"
    text: "جعل الأخلاق شيئًا يُساط، أي يُخلط بالمِسواط كما يُخلط ما في القدر، ثم جعل دمها هو الذي خُلطت فيه. فالخلق صار جزءًا من جسدها."
  - title: "تعداد الصفات"
    text: "أربع كلمات معطوفة بالواو في العجز كله: «فَجْعٌ وَوَلْعٌ وَإِخْلَافٌ وَتَبْدِيلُ». وتقارب «فَجْعٌ» و«وَلْعٌ» في الوزن والجرس يجعل التعداد سريعًا كالسرد."
  connection: "ثم يفصّل «التبديل»: لا تدوم على حال، كالغول تتلون."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "لَاكِنْنَهَا / خُلْلَةُنْ / قَدْ سِيطَ مِنْ / دَمِهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — فَجْعُنْ وَوَلْ / عُنْ وَإِخْ / لَافُنْ وَتَبْ / دِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "البيت كله على الوزن التام: «لَاكِنْنَهَا» مستفعلن، وتُنطق «لكنّ» بألف بعد اللام كما تُكتب في العروض."
