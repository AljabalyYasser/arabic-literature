first: "وَقَالَ كُلُّ خَلِيلٍ كُنْتُ آمُلُهُ"
second: "لَا أُلْفِيَنَّكَ إِنِّي عَنْكَ مَشْغُولُ"
meaning: "وقال كل صديق كنت أرجو نفعه: لن أنفعك، إني مشغول عنك، فاعمل لنفسك. قال السُّكَّرِيّ: «لا ألفينّك، أي لا أكون معك في شيء. غيره: لا ألفينّك: لا أنفعك فاعمل لنفسك» [@diwan-kaab، ص19]."
vocabulary:
- term: "خَلِيلٍ"
  text: "صديق خالص المودة."
- term: "آمُلُهُ"
  text: "أرجو نفعه."
- term: "لَا أُلْفِيَنَّكَ"
  text: "«أي لا أكون معك في شيء»، أو «لا أنفعك فاعمل لنفسك» [@diwan-kaab، ص19]."
context: "الخوف الثاني: خذلان الأصدقاء. وهو من الأبيات العشرة التي يرويها ابن سَلّام بإسناده إلى سعيد بن المُسَيِّب [@ibn-sallam، ج1 ص100]."
syntax:
- "«كُلُّ خَلِيلٍ» فاعل «قال»، وجملة «كُنْتُ آمُلُهُ» صفة لـ«خليل»."
- "«لَا أُلْفِيَنَّكَ»: «لا» نافية أو ناهية، والفعل مؤكد بالنون الثقيلة، والكاف مفعول به. وجملة «إِنِّي عَنْكَ مَشْغُولُ» تعليل."
morphology:
- "«أُلْفِيَنَّكَ» مضارع «أَلْفَى» الرباعي، دخلته نون التوكيد فبُني على الفتح."
- "«آمُلُهُ» مضارع «أَمَلَ» كما في البيت 11."
rhetoric:
  thesis: "العزلة الكاملة: الوشاة يهددون، والأصدقاء يتبرؤون."
  devices:
  - title: "«كُلُّ خَلِيلٍ»"
    text: "لفظ العموم يجعل الخذلان شاملًا، فلم يبق له صديق واحد."
  - title: "المفارقة في «كُنْتُ آمُلُهُ»"
    text: "الصديق الذي كان موضع الأمل هو الذي يقطع الأمل. والكلمة نفسها «آمل» جاءت في البيت 11 في رجاء سعاد، وتعود في البيت 36 في العفو «مأمول»."
  connection: "ثم يرد عليهم بتسليم أمره إلى القدر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "وَقَالَ كُلْ / لُ خَلِي / لِنْ كُنْتُ ءَا / مُلُهُو = متفعلن / فعِلن / مستفعلن / فعِلن — لَا أُلْفِيَنْ / نَكَ إِنْ / نِي عَنْكَ مَشْ / غُولُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«وَقَالَ كُلْ» متفعلن، و«لُ خَلِي» فعِلن، وكلتاهما مخبونة."
variants:
- reading: "لَا أُلْهِيَنَّكَ إِنِّي عَنْكَ مَشْغُولُ"
  status: "رواية"
  note: "يقول المحققون: «أي لا أشغلنك عما أنت فيه بأن أسهّله عليك وأسليك» [@diwan-kaab، ص19]، وهي رواية السيرة [@ibn-hisham، ج2 ص510] واللسان: «أَي لَا أَشغَلُك عَنْ أَمرك فإِني مَشْغُول عَنْكَ» [@lisan، ج15 ص260]."
- reading: "وَقَالَ كُلُّ صَدِيقٍ كُنْتُ آمُلُهُ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص510]."
