first: "بِيضٌ سَوَابِغُ قَدْ شُكَّتْ لَهَا حَلَقٌ"
second: "كَأَنَّهَا حَلَقُ الْقَفْعَاءِ مَجْدُولُ"
meaning: "دروع بيض سابغة، أُدخل بعض حلقها في بعض وسُمّرت، كأن حلقها نَوْر القَفْعاء، وهي شجرة لها حلق كحلق الدروع، محكم مفتول. قال السُّكَّرِيّ: «بيض سوابغ: يعني الدروع أنها سابغة ضافية فضفاضة. وشُكّت: أُدخل بعض حلقها في بعض وسُمّرت، فشبّه حلقها بنَوْر القفعاء» [@diwan-kaab، ص24]."
vocabulary:
- term: "سَوَابِغُ"
  text: "طويلة واسعة، «سابغة ضافية فضفاضة» [@diwan-kaab، ص24]."
- term: "شُكَّتْ"
  text: "«أُدخل بعض حلقها في بعض وسُمّرت» [@diwan-kaab، ص24]."
- term: "الْقَفْعَاءِ"
  text: "«شجرة لها ورق وثمر مثل حلق الدروع» [@diwan-kaab، ص24]. وفي اللسان: «وَقِيلَ: هِيَ شَجَرَةٌ تَنْبُتُ فِيهَا حَلَقٌ كحَلَقِ الخَواتِيمِ إِلا أَنها لَا تَلْتَقِي» [@lisan، ج8 ص289]."
- term: "مَجْدُولُ"
  text: "«مفتول»، «والمجدول: الذي قد أُدير وفُتل» [@diwan-kaab، ص24]."
context: "يكمل صفة السرابيل في البيت السابق. ويطيل السُّكَّرِيّ في القفعاء، فينقل عن أبي الجماهر البكري والأَصْمَعِيّ وغيرهما [@diwan-kaab، ص24]."
syntax:
- "«بِيضٌ» خبر لمبتدأ محذوف، أي هي بيض، يعني السرابيل، و«سَوَابِغُ» صفة."
- "جملة «قَدْ شُكَّتْ لَهَا حَلَقٌ» صفة ثانية، و«حَلَقٌ» نائب فاعل. و«كَأَنَّهَا حَلَقُ الْقَفْعَاءِ» جملة صفة ثالثة، و«مَجْدُولُ» صفة لـ«حلق القفعاء»."
morphology:
- "«حَلَقٌ» جمع «حَلْقة»، ويقول المحققون: «الحلق بفتحتين جمع حلقة بالإسكان على غير القياس» [@diwan-kaab، ص24]."
- "«سَوَابِغُ» جمع «سابغة» على «فَوَاعِل»."
rhetoric:
  thesis: "يقرّب صنعة الحديد من صورة نبات الصحراء، فيعرف البدوي الدرع بما رآه في الرمل."
  devices:
  - title: "التشبيه في «كَأَنَّهَا حَلَقُ الْقَفْعَاءِ»"
    text: "شبّه حلق الدرع بحلق نبات القفعاء في الاستدارة والتداخل. والشبه في الشكل يُرى بالعين، فهو من التشبيه الذي لا يحتاج إلى تأوّل عند عبد القاهر الجُرْجانيّ [@asrar، ص90]."
  - title: "«بِيضٌ»"
    text: "بياض الدروع يعني جلاءها، فهي دروع مصقولة معتنى بها."
  connection: "ثم يصف مشيهم في الحرب، ويعرّض بمن يفرّ."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "بِيضُنْ سَوَا / بِغُ قَدْ / شُكْكَتْ لَهَا / حَلَقُنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — كَأَنْنَهَا / حَلَقُلْ / قَفْعَاءِ مَجْ / دُولُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«بِيضُنْ سَوَا» مستفعلن، و«بِغُ قَدْ» فعِلن. و«كَأَنْنَهَا» في أول العجز متفعلن."
variants:
- reading: "قَدْ سُكَّتْ لَهَا حَلَقٌ"
  status: "رواية"
  note: "ينقل المحققون عن ابن هشام: «ويروى: سُكّت بالسين المهملة أي ضُيّقت» [@diwan-kaab، ص24]، وفي اللسان أنه «يُرْوَى بِالسِّينِ الْمُهْمَلَةِ مِنَ السَّكَك، وَهُوَ الضِّيقُ» [@lisan، ج10 ص453]."
