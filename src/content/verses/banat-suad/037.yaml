first: "مَهْلًا هَدَاكَ الَّذِي أَعْطَاكَ نَافِلَةَ الْـ"
second: "ـقُرْآنِ فِيهَا مَوَاعِيظُ وَتَفْصِيلُ"
meaning: "تمهّل، هداك الله الذي أعطاك القرآن عطية فيها مواعظ وتفصيل. يقول المحققون: «النافلة هنا: العطية» [@diwan-kaab، ص19]."
vocabulary:
- term: "مَهْلًا"
  text: "تمهّل، رفقًا."
- term: "نَافِلَةَ"
  text: "«العطية» كما يقول المحققون [@diwan-kaab، ص19]، وأصلها الزيادة على الواجب."
- term: "مَوَاعِيظُ"
  text: "جمع موعظة، والياء للإشباع."
- term: "تَفْصِيلُ"
  text: "بيان مفصّل للأحكام والأخبار."
context: "أول خطاب مباشر للنبي صلى الله عليه وسلم في القصيدة. ويرويه ابن قُتَيْبة [@ibn-qutayba، ج1 ص154] وابن رَشِيق [@ibn-rashiq، ج1 ص24]، ويذكره شوقي ضَيْف في أبيات الاعتذار [@deif، ج2 ص86]."
syntax:
- "«مَهْلًا» مفعول مطلق لفعل محذوف، أي أمهل مهلًا."
- "«هَدَاكَ الَّذِي» جملة دعائية معترضة، و«الَّذِي» فاعل «هداك»، وجملة «أَعْطَاكَ» صلته."
- "«نَافِلَةَ الْقُرْآنِ»: يقول شاكر في حاشيته على ابن قُتَيْبة: «القرآن» مضاف إلى «نافلة»، «ويجوز نصبه مفعولا ل «أعطاك» ويكون «نافلة» إما حالا تقدمت، وإما مفعولا، و «القرآن» بدل» [@ibn-qutayba، ج1 ص154]."
- "جملة «فِيهَا مَوَاعِيظُ وَتَفْصِيلُ» صفة لـ«نافلة» أو حال من «القرآن»."
morphology:
- "«مَوَاعِيظُ» جمع «مَوْعِظَة»، والقياس «مَوَاعِظ»، وزيدت الياء لإقامة الوزن."
- "«نَافِلَةَ» اسم فاعل مؤنث من «نَفَلَ»، صار اسمًا للعطية."
rhetoric:
  thesis: "يستعطف النبي بنعمة الله عليه: من أُعطي القرآن، وفيه المواعظ، أولى بالعفو."
  devices:
  - title: "الدعاء المعترض «هَدَاكَ الَّذِي أَعْطَاكَ»"
    text: "لا يأمر النبي ولا ينهاه، بل يطلب المهل ثم يدعو له، فيصير الطلب أدبًا."
  - title: "الاحتجاج بالقرآن"
    text: "يذكّر بأن في القرآن «مواعيظ» العفو والصفح، فيجعل حجته من كتاب الممدوح نفسه. وهذه قراءتنا."
  - title: "التدوير"
    text: "انقسمت كلمة «القرآن» بين الشطرين: «نَافِلَةَ الْ / قُرْآنِ»، فلا يقف الصوت بين الصدر والعجز."
  connection: "ثم يطلب ألا يؤاخذ بكلام الوشاة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "مَهْلَنْ هَدَا / كَلْ لَذِي / أَعْطَاكَ نَا / فِلَةَلْ = مستفعلن / فاعلن / مستفعلن / فعِلن — قُرْءَانِ فِي / هَا مَوَا / عِيظُ وَتَفْ / صِيلُو = مستفعلن / فاعلن / مستعلن / فعْلن"
  note: "البيت مدوّر: أداة التعريف في آخر الصدر، والاسم في أول العجز. وفي العجز «عِيظُ وَتَفْ» مستعلن بالطيّ."
