first: "تَفْرِي اللَّبَانَ بِكَفَّيْهَا وَمِدْرَعُهَا"
second: "مُشَقَّقٌ عَنْ تَرَاقِيهَا رَعَابِيلُ"
meaning: "تشق بكفيها ما على صدرها، وقميصها مشقوق عن ترقوتيها، ممزّق قطعًا. قال السُّكَّرِيّ: «تَفْري: تشق الثياب عن اللَّبان. واللَّبان: الصدر وما حوله. شبّه ناقته بهذه التي تفري صدرها ومِدْرعها بما هلك من ولدها»، و«الرَّعابيل: المتخرّقة المتمزّقة» [@diwan-kaab، ص18]."
vocabulary:
- term: "تَفْرِي"
  text: "«تشق» [@diwan-kaab، ص18]."
- term: "اللَّبَانَ"
  text: "«الصدر وما حوله» [@diwan-kaab، ص18]."
- term: "مِدْرَعُهَا"
  text: "قميصها، والمِدْرع: ثوب من صوف."
- term: "تَرَاقِيهَا"
  text: "«وواحد التراقي ترقوة وهما ترقوتان عن يمين وشمال، فجمعهما بما حولهما» [@diwan-kaab، ص18]."
- term: "رَعَابِيلُ"
  text: "«المتخرّقة المتمزّقة» [@diwan-kaab، ص18]. وفي اللسان: «والرَّعَابِيل: الثِّيَابُ الْمُتَمَزِّقَةُ» [@lisan، ج11 ص289]."
context: "آخر أبيات المرحلة الأولى من القصيدة، ومن الأبيات السبعة التي يقول ابن هشام إنها «عَنْ غَيْرِ ابْنِ إسْحَاقَ» [@ibn-hisham، ج2 ص514]. وبها تنتهي صورة النائحة، ثم يقطع الشاعر الرحلة كلها في البيت التالي ويعود إلى خوفه."
syntax:
- "فاعل «تَفْرِي» ضمير النائحة، و«اللَّبَانَ» مفعول به، و«بِكَفَّيْهَا» متعلق بـ«تفري»."
- "«وَمِدْرَعُهَا مُشَقَّقٌ» جملة حالية، و«رَعَابِيلُ» خبر ثانٍ أو بدل من «مشقّق»، و«عَنْ تَرَاقِيهَا» متعلق بـ«مشقّق»."
morphology:
- "«مُشَقَّقٌ» اسم مفعول من «شَقَّقَ» المضعّف، والتضعيف للتكثير: شُقّ مرة بعد مرة."
- "«رَعَابِيلُ» جمع «رُعْبُولة»؛ وفي اللسان: «وَالصَّحِيحُ أَنه جَمْعُ رُعْبُولَة» [@lisan، ج11 ص289]."
rhetoric:
  thesis: "تنتهي الرحلة بصورة حزن شديد، فتمهد للخوف الذي يبدأ في البيت التالي."
  devices:
  - title: "التتميم في تفاصيل المأتم"
    text: "الشق باليدين، ثم القميص المشقوق، ثم القطع المتمزقة: ثلاث مراحل لفعل واحد، تزيد الصورة شدة."
  - title: "مناسبة الصورة لموضعها"
    text: "صورة الثكل في آخر الرحلة تسبق ذكر الموت في البيت 32 «إِنَّكَ يَا ابْنَ أَبِي سُلْمَى لَمَقْتُولُ»، فيقرب الحزن الذي في المشبه به من الخوف الذي في نفس الشاعر. وهذه قراءتنا."
  connection: "ثم يعود من الصحراء إلى حاله: الوشاة يسعون حول سعاد ويقولون إنه مقتول."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "تَفْرِلْ لَبَا / نَ بِكَفْ / فَيْهَا وَمِدْ / رَعُهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — مُشَقْقَقُنْ / عَنْ تَرَا / قِيهَا رَعَا / بِيلُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«مُشَقْقَقُنْ» في أول العجز متفعلن مخبونة."
