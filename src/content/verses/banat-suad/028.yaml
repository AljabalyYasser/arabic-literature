first: "وَقَالَ لِلْقَوْمِ حَادِيهِمْ وَقَدْ جَعَلَتْ"
second: "وُرْقُ الْجَنَادِبِ يَرْكُضْنَ الْحَصَى قِيلُوا"
meaning: "وقال حادي القوم لهم، وقد أخذت الجنادب الرمادية تضرب الحصى بأرجلها من الحر: انزلوا للقائلة. قال السُّكَّرِيّ: «وقوله: قيلوا، يريد: من القائلة» [@diwan-kaab، ص17]، و«هذا في أشدّ ما يكون من الهاجرة» [@diwan-kaab، ص16]."
vocabulary:
- term: "حَادِيهِمْ"
  text: "الذي يسوق الإبل ويغني لها لتنشط."
- term: "وُرْقُ"
  text: "جمع أورق، «وهو على لون الرماد» في أحد قولين عند السُّكَّرِيّ، وقال غيره: «الوُرْق: الطِّوال» [@diwan-kaab، ص16]. ويقول المحققون في الثاني: «لم أجد لهذا ما يؤيده وإنما الوُرقة في اللون» [@diwan-kaab، ص16]."
- term: "الْجَنَادِبِ"
  text: "ضرب من الجراد الصغير."
- term: "يَرْكُضْنَ الْحَصَى"
  text: "يضربنه بأرجلهن."
- term: "قِيلُوا"
  text: "«يريد: من القائلة» [@diwan-kaab، ص17]، أي استريحوا وقت الظهيرة."
context: "ذروة الهاجرة: الحادي الذي عمله أن يحثّ الإبل يأمر بالتوقف. ويقرن السُّكَّرِيّ البيت بقول أبي زُبَيْد الطائي: «ونفى الجندب الحصى بكراعيه» [@diwan-kaab، ص17]."
syntax:
- "«حَادِيهِمْ» فاعل «قال»، و«قِيلُوا» مقول القول، فعل أمر."
- "«وَقَدْ جَعَلَتْ وُرْقُ الْجَنَادِبِ يَرْكُضْنَ» جملة حالية، و«جعل» من أفعال الشروع، و«ورق» اسمها، وجملة «يركضن» خبرها."
morphology:
- "«قِيلُوا» أمر من «قَالَ يَقِيلُ قَيْلُولَةً» إذا نام أو استراح نصف النهار، أجوف يائي."
- "«الْجَنَادِبِ» جمع «جُنْدُب» على «فَعَالِل»."
rhetoric:
  thesis: "يقيس الحر بأثره في الحيوان مرة ثانية: الجنادب تضرب الأرض، والحادي يتوقف."
  devices:
  - title: "الكناية في «يَرْكُضْنَ الْحَصَى»"
    text: "الجنادب لا تثبت على الحصى المحمى، فتقفز وتضربه بأرجلها. فالحركة الصغيرة تدل على الحرارة الكبيرة."
  - title: "الحوار في «وَقَالَ لِلْقَوْمِ حَادِيهِمْ ... قِيلُوا»"
    text: "كلمة واحدة يقولها الحادي في القافية، فتدخل القصيدة صوتًا بشريًا بعد صور الحيوان."
  connection: "ثم يأتي المشبه به المؤجَّل: ذراعا امرأة نائحة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "وَقَالَ لِلْ / قَوْمِ حَا / دِيهِمْ وَقَدْ / جَعَلَتْ = متفعلن / فاعلن / مستفعلن / فعِلن — وُرْقُلْ جَنَا / دِبِ يَرْ / كُضْنَلْ حَصَا / قِيلُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«وَقَالَ لِلْ» متفعلن مخبونة، و«قَوْمِ حَا» فاعلن."
variants:
