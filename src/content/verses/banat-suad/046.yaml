first: "مِنْهُ تَظَلُّ حَمِيرُ الْوَحْشِ ضَامِزَةً"
second: "وَلَا تَمَشَّى بِوَادِيهِ الْأَرَاجِيلُ"
meaning: "منه تظلّ حمير الوحش ساكتة لا تصوّت من الخوف، ولا يمشي الرجّالة في واديه. قال السُّكَّرِيّ: «وضامزة: لا تصوّت خوفًا»، «والأراجيل: الرجّالة» [@diwan-kaab، ص22]."
vocabulary:
- term: "ضَامِزَةً"
  text: "«الساكتة»، «وأصل الضموز: ألا يجترّ البعير»، «والضامز هاهنا: الممسك الذي قد ضمّ فمه» [@diwan-kaab، ص22]. وفي اللسان: «أَي مُمْسِكَةً مِنْ خَوْفِهِ» [@lisan، ج5 ص366]."
- term: "تَمَشَّى"
  text: "تتمشّى، حُذفت إحدى التاءين."
- term: "الْأَرَاجِيلُ"
  text: "«الرجّالة» [@diwan-kaab، ص22]، أي المشاة."
context: "صفة هيبة الأسد في محيطه: الحيوان صامت، والناس لا يقتربون."
syntax:
- "«مِنْهُ» متعلق بـ«ضامزة» قُدّم للاهتمام، و«حَمِيرُ الْوَحْشِ» اسم «تظلّ»، و«ضَامِزَةً» خبرها."
- "«وَلَا تَمَشَّى بِوَادِيهِ الْأَرَاجِيلُ»: «الأراجيل» فاعل «تمشّى»، و«بواديه» متعلق به."
morphology:
- "«الْأَرَاجِيلُ» يقول المحققون: «جمع أرجال كأناعيم وأنعام، وأرجال جمع رجل، ورجل اسم جمع راجل كصحب وصاحب» [@diwan-kaab، ص22]."
- "«تَمَشَّى» أصلها «تَتَمَشَّى»، مضارع «تَمَشَّى» على «تَفَعَّلَ»."
rhetoric:
  thesis: "الهيبة تُقاس بالصمت والفراغ حول الأسد."
  devices:
  - title: "الكناية في «ضَامِزَةً» و«وَلَا تَمَشَّى بِوَادِيهِ الْأَرَاجِيلُ»"
    text: "لا يقول إنه مَهيب، بل يصف أثره: صمت الوحوش، وخلوّ الوادي من المارّة. ويقول المحققون: «يريد أن يصف هذا الأسد بأن الوحوش والرجال تهابه» [@diwan-kaab، ص22]."
  - title: "الجمع بين الوحش والإنس"
    text: "الشطر الأول للوحش، والثاني للناس، فلا ينجو من هيبته أحد."
  connection: "ثم يصف من يجرؤ على المرور بواديه: قتيل مأكول ثيابه ملطخة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "مِنْهُ تَظَلْ / لُ حَمِي / رُلْ وَحْشِ ضَا / مِزَةَنْ = مستعلن / فعِلن / مستفعلن / فعِلن — وَلَا تَمَشْ / شَا بِوَا / دِيهِلْ أَرَا / جِيلُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«مِنْهُ تَظَلْ» في أول الصدر مستعلن بالطيّ، و«وَلَا تَمَشْ» في أول العجز متفعلن بالخبن."
variants:
- reading: "مِنْهُ تَظَلُّ سِبَاعُ الْجَوِّ ضَامِزَةً"
  status: "رواية"
  note: "يذكرها المحققون، «والجوّ هنا: الفضاء الواسع» [@diwan-kaab، ص22]، وهي في اللسان [@lisan، ج5 ص366]، وفي السيرة «نافرة» [@ibn-hisham، ج2 ص512]."
