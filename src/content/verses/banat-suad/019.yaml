first: "يَمْشِي الْقُرَادُ عَلَيْهَا ثُمَّ يُزْلِقُهُ"
second: "مِنْهَا لَبَانٌ وَأَقْرَابٌ زَهَالِيلُ"
meaning: "يمشي القُراد على جلدها فلا يثبت، يُزلقه صدرها وخواصرها الملساء. قال السُّكَّرِيّ: «أقراب: خواصر، الواحد قُرُب. والزَّهاليل: المُلْس. واللَّبان: الصدر» [@diwan-kaab، ص12]."
vocabulary:
- term: "الْقُرَادُ"
  text: "دويبة تعلق بالإبل وتمتص دمها."
- term: "لَبَانٌ"
  text: "«الصدر» [@diwan-kaab، ص12]."
- term: "أَقْرَابٌ"
  text: "«خواصر، الواحد قُرُب» [@diwan-kaab، ص12]."
- term: "زَهَالِيلُ"
  text: "«المُلْس» [@diwan-kaab، ص12]. وفي اللسان: «والزُّهْلُول: الأَمْلَس مِنْ كُلِّ شَيْءٍ» [@lisan، ج11 ص313]."
context: "من الأبيات السبعة التي يقول ابن هشام إنها «عَنْ غَيْرِ ابْنِ إسْحَاقَ» [@ibn-hisham، ج2 ص514]، وهي في رواية السُّكَّرِيّ. ويصف فيه ملاسة جلد الناقة وامتلاءها: لا يثبت عليه شيء."
syntax:
- "«الْقُرَادُ» فاعل «يمشي»، و«عَلَيْهَا» متعلق به. و«ثُمَّ» حرف عطف للترتيب مع التراخي."
- "«لَبَانٌ» فاعل «يُزْلِقُهُ»، و«أَقْرَابٌ» معطوف عليه، و«زَهَالِيلُ» صفة للمعطوف والمعطوف عليه معًا، و«مِنْهَا» متعلق بمحذوف حال."
morphology:
- "«يُزْلِقُهُ» مضارع «أَزْلَقَ» الرباعي، والهمزة للتعدية."
- "«زَهَالِيلُ» جمع «زُهْلُول» على «فَعَالِيل»، صيغة منتهى الجموع."
rhetoric:
  thesis: "صورة صغيرة دقيقة: حشرة تمشي ثم تزلق. ومنها يفهم السامع امتلاء الجسد ونعومته دون أن يقال له."
  devices:
  - title: "الكناية في «يَمْشِي الْقُرَادُ عَلَيْهَا ثُمَّ يُزْلِقُهُ»"
    text: "كنّى بانزلاق القراد عن سِمَن الناقة وملاسة جلدها. وهذه الكناية التي يقول فيها عبد القاهر الجُرْجانيّ إن المتكلم «لا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]: فالملاسة يتبعها أن لا يثبت عليها شيء."
  - title: "«ثُمَّ»"
    text: "تجعل الزلق بعد محاولة مشي، فتعطي الصورة حركة: يمشي القراد قليلًا ثم يسقط."
  connection: "ثم يشبّهها بحمار الوحش في صلابتها، ويصف امتلاءها باللحم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "يَمْشِلْ قُرَا / دُ عَلَيْ / هَا ثُمْمَ يُزْ / لِقُهُو = مستفعلن / فعِلن / مستفعلن / فعِلن — مِنْهَا لَبَا / نُنْ وَأَقْ / رَابُنْ زَهَا / لِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«يَمْشِلْ قُرَا» مستفعلن، تسقط ياء «يمشي» في النطق لالتقاء الساكنين."
