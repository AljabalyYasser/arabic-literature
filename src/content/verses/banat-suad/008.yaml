first: "فَمَا تَدُومُ عَلَى حَالٍ تَكُونُ بِهَا"
second: "كَمَا تَلَوَّنُ فِي أَثْوَابِهَا الْغُولُ"
meaning: "فلا تثبت على حال واحدة، بل تتغير كما تتلوّن الغول في ثيابها. يقول المحققون: «الغول: السعلاة. وللعرب أمور تزعمها لا حقيقة لها منها الغول. زعموا أنها تغتالهم، وأنها تتراءى لهم في الفلوات وتتلون لهم بألوان شتى وتضلّهم عن الطريق» [@diwan-kaab، ص8]."
vocabulary:
- term: "تَلَوَّنُ"
  text: "تتلوّن، أي تتغير ألوانها؛ حُذفت إحدى التاءين."
- term: "الْغُولُ"
  text: "كائن تزعم العرب أنه يظهر في الصحراء. وفي اللسان أن الغيلان «فِي الفَلَوات تَراءَى لِلنَّاسِ، فتَغَوَّلُ تَغَوُّلًا أَي تَلَوَّنَ تَلَوُّنًا فَتُضِلُّهُمْ عَنِ الطَّرِيقِ وتُهلكهم» [@lisan، ج11 ص508]."
context: "يفصّل «التبديل» في البيت السابق بصورة: التلوّن. والبيت التالي يفصّل «الإخلاف» بصورة أخرى: الماء في الغربال."
syntax:
- "«فَمَا تَدُومُ عَلَى حَالٍ»: الفاء عاطفة أو تفريعية، و«ما» نافية، وفاعل «تدوم» ضمير سعاد، و«عَلَى حَالٍ» متعلق بـ«تدوم»، وجملة «تَكُونُ بِهَا» صفة لـ«حالٍ»."
- "«كَمَا تَلَوَّنُ»: الكاف حرف جر، و«ما» مصدرية، والمصدر المؤول في محل جر، والجار والمجرور صفة لمفعول مطلق محذوف، أي تغيّرًا كتلوّن الغول."
- "«الْغُولُ» فاعل «تَلَوَّنُ»، والتأنيث في الفعل لأن الغول مؤنثة عندهم."
morphology:
- "«تَلَوَّنُ» أصلها «تَتَلَوَّنُ» على «تَتَفَعَّلُ»، فحُذفت إحدى التاءين تخفيفًا."
- "«حَالٍ» تُذكّر وتؤنث، وأنّثها هنا بدليل «تكون بها»."
rhetoric:
  thesis: "يجعل صاحبته غولًا: لا تُعرف لها صورة ثابتة، وتُضلّ من يتبعها."
  devices:
  - title: "التمثيل في «كَمَا تَلَوَّنُ فِي أَثْوَابِهَا الْغُولُ»"
    text: "شبّه تقلّب أخلاقها بتلوّن الغول، والشبه لا يُرى في اللون بل يُدرك بالفكر: كلاهما لا يثبت على حال، وكلاهما يُهلك من يطمئن إليه. وهذا الضرب الذي يقول فيه عبد القاهر الجُرْجانيّ إن الشبه فيه يكون «محصّلاً بضرب من التأوّل» [@asrar، ص90]."
  - title: "«فِي أَثْوَابِهَا»"
    text: "جعل للغول ثيابًا تتلوّن، فقرّب الخرافة من صورة المرأة التي تتزين بثياب مختلفة."
  connection: "ثم يأتي بتشبيه ثانٍ للعهد الذي لا يُمسَك: الغربال."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "فَمَا تَدُو / مُ عَلَا / حَالِنْ تَكُو / نُ بِهَا = متفعلن / فعِلن / مستفعلن / فعِلن — كَمَا تَلَوْ / وَنُ فِي / أَثْوَابِهَلْ / غُولُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«فَمَا تَدُو» متفعلن مخبونة، و«مُ عَلَا» فعِلن. والبيت كله خالٍ من الطيّ."
variants:
