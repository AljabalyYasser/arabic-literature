first: "فَلَا يَغُرَّنْكَ مَا مَنَّتْ وَمَا وَعَدَتْ"
second: "إِنَّ الْأَمَانِيَّ وَالْأَحْلَامَ تَضْلِيلُ"
meaning: "فلا يخدعنّك ما منّتك به من الأماني وما وعدتك، فإن الأماني والأحلام تضلّل صاحبها. وفي اللسان أن الأماني هنا الأحاديث المختلَقة: «وَيُقَالُ للأَحاديث الَّتِي تُتَمَنَّى الأَمَانِيُّ، وَاحِدَتُهَا أُمْنِيّةٌ» [@lisan، ج15 ص295]."
vocabulary:
- term: "مَنَّتْ"
  text: "من «مَنَّى» إذا جعل غيره يتمنى، أي أطمعتك."
- term: "الْأَمَانِيَّ"
  text: "جمع أُمنية، وهي ما يتمناه المرء، أو الحديث المختلق [@lisan، ج15 ص295]."
- term: "تَضْلِيلُ"
  text: "إضلال، أي تذهب بصاحبها عن الطريق."
context: "خاتمة مقطع الخلّة الكاذبة: يخاطب نفسه بالنهي بعد الاعتراف. وبعده ينتقل فجأة إلى بُعد سعاد والناقة."
syntax:
- "«فَلَا يَغُرَّنْكَ»: «لا» ناهية، والفعل مضارع مبني على الفتح لاتصاله بنون التوكيد الخفيفة في محل جزم، والكاف مفعول به، و«مَا مَنَّتْ» فاعل."
- "«إِنَّ الْأَمَانِيَّ وَالْأَحْلَامَ تَضْلِيلُ»: «الأماني» اسم «إنّ»، و«الأحلام» معطوف عليه، و«تضليل» خبر، أخبر بالمصدر للمبالغة."
morphology:
- "«يَغُرَّنْكَ» دخلته نون التوكيد الخفيفة، وهي تختص بالفعل في الطلب والنهي."
- "«تَضْلِيلُ» مصدر «ضَلَّلَ» على «تَفْعِيل»."
rhetoric:
  thesis: "يخرج من حكايته إلى حكمة عامة: الأماني تُضلّ."
  devices:
  - title: "التجريد في «فَلَا يَغُرَّنْكَ»"
    text: "يخاطب نفسه كأنه رجل آخر، فيصير الناصح والمنصوح شخصين."
  - title: "الإخبار بالمصدر في «تَضْلِيلُ»"
    text: "لم يقل «مضلّة»، بل جعل الأماني نفسها تضليلًا، مبالغة."
  connection: "ثم يذكر أن سعاد صارت بأرض بعيدة لا تبلغها إلا النوق الكريمة، فيدخل في وصف الناقة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "فَلَا يَغُرْ / رَنْكَ مَا / مَنْنَتْ وَمَا / وَعَدَتْ = متفعلن / فاعلن / مستفعلن / فعِلن — إِنْنَلْ أَمَا / نِيْيَ وَالْ / أَحْلَامَ تَضْ / لِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«فَلَا يَغُرْ» متفعلن مخبونة. وفي «نِيْيَ وَالْ» من العجز تُشدد ياء «الأمانيّ» فتصير فاعلن تامة."
variants:
- reading: "ترتيب البيت"
  status: "خلاف في الموضع"
  note: "في السيرة يأتي هذا البيت بعد «وما تمسك بالعهد» وقبل «كانت مواعيد عرقوب» [@ibn-hisham، ج2 ص505]."
