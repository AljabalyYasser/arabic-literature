first: "وَمَا تَمَسَّكُ بِالْوَصْلِ الَّذِي زَعَمَتْ"
second: "إِلَّا كَمَا تُمْسِكُ الْمَاءَ الْغَرَابِيلُ"
meaning: "ولا تتمسك بالوصل الذي زعمت أنها تحفظه إلا كما تمسك الغرابيل الماء، أي لا تمسكه أبدًا."
vocabulary:
- term: "تَمَسَّكُ"
  text: "تتمسك؛ و«يقال: تمسّك بالشيء ومسك وأمسك واستمسك» كما يقول المحققون [@diwan-kaab، ص8]."
- term: "زَعَمَتْ"
  text: "قالت ولم تفِ، والزعم يكثر فيما لا يوثق به."
- term: "الْغَرَابِيلُ"
  text: "جمع غِرْبال، وهو ما يُنخل به الحَبّ، كثير الثقوب."
context: "الصورة الثانية في مقطع الخلّة: بعد الغول التي لا تثبت، الغربال الذي لا يحفظ. وبعده المثل الثالث: مواعيد عرقوب."
syntax:
- "«وَمَا تَمَسَّكُ ... إِلَّا كَمَا تُمْسِكُ»: «ما» نافية، و«إلا» أداة حصر، والكاف ومدخولها صفة لمصدر محذوف، أي ما تتمسك إلا تمسكًا كإمساك الغرابيل."
- "«الَّذِي زَعَمَتْ» صفة لـ«الوصل»، والعائد محذوف، أي زعمته."
- "«الْمَاءَ» مفعول «تُمْسِكُ» مقدّم، و«الْغَرَابِيلُ» فاعل مؤخر."
morphology:
- "«تَمَسَّكُ» أصلها «تَتَمَسَّكُ»، حُذفت إحدى التاءين كما في «تَلَوَّنُ»."
- "«الْغَرَابِيلُ» جمع «غِرْبَال» على صيغة منتهى الجموع «فَعَالِيل»."
rhetoric:
  thesis: "صورة قريبة من حياة الناس: الماء في الغربال. فلا يحتاج السامع إلى خرافة كالغول ليفهم أن وعدها لا يبقى."
  devices:
  - title: "التشبيه التمثيلي في «إِلَّا كَمَا تُمْسِكُ الْمَاءَ الْغَرَابِيلُ»"
    text: "شبّه حالها مع العهد بحال الغربال مع الماء: يتلقاه ثم يُفلته كله. والنفي والاستثناء يجعلان تمسكها مثل عدمه."
  - title: "الجناس الاشتقاقي في «تَمَسَّكُ ... تُمْسِكُ»"
    text: "الكلمتان من مادة واحدة، فيقابل تمسكها المزعوم بإمساك الغربال المستحيل."
  connection: "ثم يأتي بالمثل السائر: مواعيدها مواعيد عرقوب."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "وَمَا تَمَسْ / سَكُ بِلْ / وَصْلِلْ لَذِي / زَعَمَتْ = متفعلن / فعِلن / مستفعلن / فعِلن — إِلْلَا كَمَا / تُمْسِكُلْ / مَاءَلْ غَرَا / بِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«وَمَا تَمَسْ» متفعلن مخبونة، و«سَكُ بِلْ» فعِلن. وفي العجز «إِلْلَا كَمَا» مستفعلن تامة."
