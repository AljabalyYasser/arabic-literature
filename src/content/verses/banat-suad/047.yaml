first: "وَلَا يَزَالُ بِوَادِيهِ أَخُو ثِقَةٍ"
second: "مُطَرَّحُ الْبَزِّ وَالدِّرْسَانِ مَأْكُولُ"
meaning: "ولا يزال في واديه رجل واثق بنفسه، ملقًى قتيلًا، ثيابه وسلاحه مطروحة، والخِلَق من ثيابه ممزقة، وقد أكله الأسد. قال السُّكَّرِيّ: «الدِّرْسان: ثياب خُلْقان، والواحد دَرِيس» [@diwan-kaab، ص23]."
vocabulary:
- term: "أَخُو ثِقَةٍ"
  text: "رجل واثق بشجاعته، تجرأ على المرور."
- term: "مُطَرَّحُ"
  text: "مطروح ملقًى."
- term: "الْبَزِّ"
  text: "الثياب والسلاح."
- term: "الدِّرْسَانِ"
  text: "«ثياب خُلْقان» [@diwan-kaab، ص23]. وفي اللسان: «الدِّرْسانُ: الخُلْقانْ مِنَ الثِّيَابِ، وَاحِدُهَا دِرْسٌ. وَقَدْ يَقَعُ عَلَى السَّيْفِ وَالدِّرْعِ والمِغْفَرِ» [@lisan، ج6 ص79]."
context: "من الأبيات السبعة التي يقول ابن هشام إنها «عَنْ غَيْرِ ابْنِ إسْحَاقَ» [@ibn-hisham، ج2 ص514]، وهي في رواية السُّكَّرِيّ. وبه تنتهي صورة الأسد: من تجرأ عليه بقي في واديه أشلاء."
syntax:
- "«أَخُو ثِقَةٍ» اسم «لا يزال»، و«بِوَادِيهِ» خبرها مقدم."
- "«مُطَرَّحُ الْبَزِّ» صفة لـ«أخو ثقة»، والإضافة لفظية، و«الدِّرْسَانِ» معطوف على «البزّ»، و«مَأْكُولُ» صفة ثانية."
morphology:
- "«مُطَرَّحُ» اسم مفعول من «طَرَّحَ» المضعّف، والتضعيف للتكثير: طُرح هنا وهناك."
- "«الدِّرْسَانِ» جمع «دِرْس» على «فِعْلان»، ويقول المحققون إنه مثل «صِنْو وصِنْوان وقِنْو وقِنْوان» [@diwan-kaab، ص23]."
rhetoric:
  thesis: "المفارقة: «أخو ثقة» يصير «مأكولًا». الثقة بالنفس لا تنفع أمام هذا الأسد."
  devices:
  - title: "المقابلة بين «أَخُو ثِقَةٍ» و«مَأْكُولُ»"
    text: "الكلمة الأولى تصف ثقته، والأخيرة نهايته، والبيت كله بينهما."
  - title: "«وَلَا يَزَالُ»"
    text: "فعل الاستمرار يجعل القتلى في الوادي أمرًا دائمًا لا حادثة واحدة."
  connection: "ثم يكشف المقصود من صورة الأسد كلها: إن الرسول لسيف يُستضاء به."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "وَلَا يَزَا / لُ بِوَا / دِيهِ أَخُو / ثِقَةِنْ = متفعلن / فعِلن / مستعلن / فعِلن — مُطَرْرَحُلْ / بَزْزِ وَادْ / دِرْسَانِ مَأْ / كُولُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«دِيهِ أَخُو» مستعلن بالطيّ، و«مُطَرْرَحُلْ» في أول العجز متفعلن بالخبن."
variants:
- reading: "وَلَا يَزَالُ بِوَادِيهِ أَخُو سَفَرٍ"
  status: "رواية"
  note: "«ويروى: «أخو سفر»» [@diwan-kaab، ص23]."
- reading: "مُطَرَّحُ اللَّحْمِ وَالدِّرْسَيْنِ مَقْتُولُ"
  status: "رواية"
  note: "يذكرها السُّكَّرِيّ [@diwan-kaab، ص23]."
- reading: "مُضَرَّجُ الْبَزِّ وَالدِّرْسَانِ مَأْكُولُ"
  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص512]، والمضرّج: الملطّخ بالدم."
