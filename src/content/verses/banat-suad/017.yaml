first: "ضَخْمٌ مُقَلَّدُهَا فَعْمٌ مُقَيَّدُهَا"
second: "فِي خَلْقِهَا عَنْ بَنَاتِ الْفَحْلِ تَفْضِيلُ"
meaning: "ضخمة موضع القلادة، أي العنق، ممتلئة موضع القيد، أي القوائم، لها في خلقتها فضل على سائر النوق. قال السُّكَّرِيّ: «وفَعْمٌ مقيّدها: ممتلئٌ رسغها»، و«بنات الفحل: يعني النوق، أي لها فضل عليهن في عِظَم خَلْقها» [@diwan-kaab، ص11]."
vocabulary:
- term: "مُقَلَّدُهَا"
  text: "موضع القلادة منها، أي عنقها."
- term: "فَعْمٌ"
  text: "ممتلئ؛ وفي اللسان: «أَي مُمْتَلِئَةُ السَّاقِ» [@lisan، ج12 ص455]."
- term: "مُقَيَّدُهَا"
  text: "موضع القيد، أي «رسغها» [@diwan-kaab، ص11]."
- term: "بَنَاتِ الْفَحْلِ"
  text: "«يعني النوق» [@diwan-kaab، ص11]."
context: "الصفة الثالثة: الخلقة. وهذا البيت هو الذي عابه الأَصْمَعِيّ على كعب، وتناقل النقاد عيبه بعده."
syntax:
- "«ضَخْمٌ» خبر لمبتدأ محذوف، أي هي ضخمٌ، و«مُقَلَّدُهَا» فاعل الصفة المشبهة «ضخم»، وكذلك «فَعْمٌ مُقَيَّدُهَا»."
- "«فِي خَلْقِهَا» خبر مقدم، و«تَفْضِيلُ» مبتدأ مؤخر، و«عَنْ بَنَاتِ الْفَحْلِ» متعلق بـ«تفضيل»."
morphology:
- "«مُقَلَّدُ» و«مُقَيَّدُ» اسما مفعول من «قَلَّدَ» و«قَيَّدَ»، استُعملا اسمي مكان: موضع القلادة وموضع القيد."
- "«ضَخْمٌ» و«فَعْمٌ» صفتان مشبهتان على «فَعْل»."
rhetoric:
  thesis: "يريد القوة فيصف الضخامة، والنقاد يرون أن هذا يخالف صفة النجائب."
  devices:
  - title: "المقابلة في «ضَخْمٌ مُقَلَّدُهَا فَعْمٌ مُقَيَّدُهَا»"
    text: "شطر واحد مقسوم قسمين متوازيين: صفة ثم موضع، صفة ثم موضع، والموضعان أعلى الناقة وأسفلها. ويسمى هذا التقسيم الترصيع لاتفاق الكلمات في الوزن والتقفية."
  - title: "خطأ الوصف عند النقاد"
    text: "قال الأَصْمَعِيّ: «هذا خطأ من الصفة لأنه قال هي غليظة الرقبة، وخير النجائب ما يدقّ مذبحه» [@diwan-kaab، ص11]. وينقل ابن قُتَيْبة: «قال الأصمعى: هذا خطاء، إنما توصف النجائب بدقّة المذبح» [@ibn-qutayba، ج1 ص151]. ويجعله أبو هلال العَسْكَرِيّ «من خطأ الوصف» [@sinaatayn، ص107]، وابن رَشِيق كذلك: «لأن النجائب دقيقات المذابح» [@ibn-rashiq، ج2 ص248]. والمذبح: أعلى العنق."
  connection: "ثم يذكر نسبها الكريم: أبوها أخوها، وعمها خالها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "ضَخْمُنْ مُقَلْ / لَدُهَا / فَعْمُنْ مُقَيْ / يَدُهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — فِي خَلْقِهَا / عَنْ بَنَا / تِلْ فَحْلِ تَفْ / ضِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "البيت كله تام إلا العروض «يَدُهَا» فعِلن. وفي الصدر ترصيع بين «مُقَلْلَدُهَا» و«مُقَيْيَدُهَا»."
variants:
- reading: "بيتان بعده"
  status: "ليسا في رواية السُّكَّرِيّ"
  note: "في السيرة بعده: «غَلْبَاءُ وَجْنَاءُ عُلْكُومٌ مُذَكَّرَةٌ ... فِي دَفِّهَا سَعَةٌ قُدَّامُهَا مِيلُ» و«وَجِلْدُهَا مِنْ أُطُومٍ مَا يُؤَيِّسُهُ ... طِلْحٌ بِضَاحِيَةِ الْمَتْنَيْنِ مَهْزُولُ» [@ibn-hisham، ج2 ص507]، ويقول المحققون: «بعد هذا البيت بيتان ليسا بالأصل» [@diwan-kaab، ص10]."
