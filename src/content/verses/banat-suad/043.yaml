first: "مِنْ ضَيْغَمٍ مِنْ ضِرَاءِ الْأُسْدِ مُخْدَرُهُ"
second: "بِبَطْنِ عَثَّرَ غِيلٌ دُونَهُ غِيلُ"
meaning: "...أهيب من أسد من ضواري الأسود التي اعتادت أكل الناس، مكمنه في بطن وادي عَثَّر، في غابة دونها غابة. قال السُّكَّرِيّ: «مُخْدَره: مكانه»، «وعَثَّر: موضع قبل تَبالة. والغِيل: الغَيْضة. يقول: رسول الله أهيب عندي من الأسد» [@diwan-kaab، ص21]."
vocabulary:
- term: "ضَيْغَمٍ"
  text: "الأسد، «مشتق من الضَّغْم وهو العضّ» [@diwan-kaab، ص21]. وفي اللسان: «والضَّيْغَم والضَّيْغَمِيُّ: الأَسد مُشْتَقٌّ مِنْ ذَلِكَ» [@lisan، ج12 ص357]."
- term: "ضِرَاءِ الْأُسْدِ"
  text: "«أي مما ضَرِيَ منها بأكل الناس» [@diwan-kaab، ص22]."
- term: "مُخْدَرُهُ"
  text: "«مكانه»، «مكمنه الذي يستتر فيه» [@diwan-kaab، ص21–22]."
- term: "عَثَّرَ"
  text: "«موضع قبل تَبالة» [@diwan-kaab، ص21]، يكثر فيه الأسد."
- term: "غِيلٌ"
  text: "«الغَيْضة»، «والغِيل: الشجر الملتف» [@diwan-kaab، ص21–22]."
context: "بداية مقطع الأسد (43–47)، وهو أطول صورة في المديح قبل التصريح بالرسول في البيت 48. ويروي السُّكَّرِيّ هنا خبرًا عن أبي زُبَيْد الطائي الذي أولع بوصف الأسد: سأل عمر قومًا عن سبب ذلك، فقال رجل: «إنه والله يا أمير المؤمنين ضغمه ضغمة على شاطئ الفرات» [@diwan-kaab، ص21–22]."
syntax:
- "«مِنْ ضَيْغَمٍ» متعلق بـ«أهيب» في البيت السابق."
- "«مِنْ ضِرَاءِ الْأُسْدِ» صفة لـ«ضيغم»، و«مُخْدَرُهُ» مبتدأ، و«بِبَطْنِ عَثَّرَ» خبره، و«غِيلٌ» بدل من «مخدره» أو خبر ثانٍ، وجملة «دُونَهُ غِيلُ» صفة لـ«غيل»."
morphology:
- "«ضِرَاءِ» جمع «ضارٍ»، ويقول المحققون: «جمع ضار على غير قياس. والقياس فيه ضُراة كساعٍ وسُعاة» [@diwan-kaab، ص22]."
- "«عَثَّرَ» علم على موضع، ممنوع من الصرف للعلمية ووزن الفعل."
rhetoric:
  thesis: "يبني صورة الأسد طبقة فوق طبقة: أسد، ثم ضارٍ، ثم في مكمن، ثم في غابة وراء غابة."
  devices:
  - title: "التشبيه الضمني"
    text: "لا يشبّه النبي بالأسد صراحة، بل يجعله أهيب من الأسد. والتفضيل أبلغ من التشبيه، لأنه يجعل المشبه أقوى من المشبه به."
  - title: "التكرار في «غِيلٌ دُونَهُ غِيلُ»"
    text: "غابة وراء غابة: يكرر الكلمة ليجعل المكمن بعيدًا لا يُبلغ، فيزيد الأسد هيبة."
  connection: "ثم يصف الأسد يغدو ليطعم شبليه لحوم الناس."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "مِنْ ضَيْغَمِنْ / مِنْ ضِرَا / ءِلْ أُسْدِ مُخْ / دَرُهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — بِبَطْنِ عَثْ / ثَرَ غِي / لُنْ دُونَهُو / غِيلُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "«بِبَطْنِ عَثْ» في أول العجز متفعلن، و«ثَرَ غِي» فعِلن."
variants:
