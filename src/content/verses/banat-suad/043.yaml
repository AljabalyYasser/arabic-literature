  status: "رواية"
  note: "في السيرة [@ibn-hisham، ج2 ص512]."
- reading: "مِنْ خَادِرٍ مِنْ لُيُوثِ الْأُسْدِ مَسْكَنُهُ"
  status: "رواية"
  note: "يذكرها المحققون [@diwan-kaab، ص21]."
