first: "قَنْوَاءُ فِي حُرَّتَيْهَا لِلْبَصِيرِ بِهَا"
second: "عِتْقٌ مُبِينٌ وَفِي الْخَدَّيْنِ تَسْهِيلُ"
meaning: "في أنفها احديداب، وفي أذنيها كرم بيّن لمن يعرف الإبل، وفي خديها سهولة ولين. قال السُّكَّرِيّ: «قنواء: في أنفها كالحدب. وحُرّتاها: أذناها. والعِتق: الكرم، وعِتقهما أن تكونا مؤلّلتين» [@diwan-kaab، ص13]."
vocabulary:
- term: "قَنْوَاءُ"
  text: "«في أنفها كالحَدَب» [@diwan-kaab، ص13]."
- term: "حُرَّتَيْهَا"
  text: "«أذناها» [@diwan-kaab، ص13]. وفي اللسان: «والحُرَّتانِ: الأُذُنانِ» [@lisan، ج4 ص183]."
- term: "عِتْقٌ"
  text: "«الكرم» [@diwan-kaab، ص13]."
- term: "مُؤَلَّلَتَيْنِ"
  text: "من شرح السُّكَّرِيّ، و«المؤلّلة: المحدّدة الطرف» كما يقول المحققون [@diwan-kaab، ص13]."
- term: "تَسْهِيلُ"
  text: "سهولة ولين في الخدين."
context: "صفات الرأس الدقيقة: الأنف والأذنان والخدان. وهذه علامات الكرم التي يعرفها «البصير بها»، أي العالم بالإبل."
syntax:
- "«قَنْوَاءُ» خبر لمبتدأ محذوف. و«فِي حُرَّتَيْهَا» خبر مقدم، و«عِتْقٌ» مبتدأ مؤخر، و«مُبِينٌ» صفته، و«لِلْبَصِيرِ بِهَا» متعلق بـ«مبين»."
- "«وَفِي الْخَدَّيْنِ تَسْهِيلُ»: خبر مقدم ومبتدأ مؤخر."
morphology:
- "«قَنْوَاءُ» مؤنث «أَقْنَى» على «فَعْلاء»، ممنوع من الصرف."
- "«حُرَّتَيْهَا» مثنى «حُرَّة» مجرور بالياء، وحُذفت النون للإضافة."
rhetoric:
  thesis: "يصف الناقة بعين الخبير: لا يرى كل أحد هذا الكرم، بل «البصير بها»."
  devices:
  - title: "«لِلْبَصِيرِ بِهَا»"
    text: "قيد يجعل الشاعر نفسه من أهل المعرفة بالإبل، ويجعل الوصف شهادة خبير لا مديح عابر."
  - title: "خلاف في الصفة"
    text: "قال السُّكَّرِيّ بعد الشرح: «والقنا عيب، وكذاك هو في الفرس» [@diwan-kaab، ص13]؛ فالشارح يرى في الصفة الأولى عيبًا، والشاعر يجعلها من علامات العتق."
  connection: "ثم يصف قوائمها وسرعتها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "قَنْوَاءُ فِي / حُرْرَتَيْ / هَا لِلْبَصِي / رِ بِهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — عِتْقُنْ مُبِي / نُنْ وَفِلْ / خَدْدَيْنِ تَسْ / هِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "البيت كله تام إلا العروض «رِ بِهَا» فعِلن."
variants:
- reading: "وَجْنَاءُ فِي حُرَّتَيْهَا"
  status: "رواية"
  note: "«أي صلبة أو عظيمة الوجنتين» كما يقول المحققون [@diwan-kaab، ص13]."
