first: "وَلَنْ يُبَلِّغَهَا إِلَّا عُذَافِرَةٌ"
second: "فِيهَا عَلَى الْأَيْنِ إِرْقَالٌ وَتَبْغِيلُ"
meaning: "ولن يبلّغها إلا ناقة شديدة غليظة، لها مع الإعياء إسراع وسير واسع. قال السُّكَّرِيّ: «عُذافرة: شديدة غليظة. والأَيْن: الإعياء. والإرقال: أن تعدو وتنفض رأسها. والتبغيل: ضرب من الهَمْلَجة» [@diwan-kaab، ص9]."
vocabulary:
- term: "عُذَافِرَةٌ"
  text: "«شديدة غليظة» [@diwan-kaab، ص9]."
- term: "الْأَيْنِ"
  text: "«الإعياء» [@diwan-kaab، ص9]، أي التعب."
- term: "إِرْقَالٌ"
  text: "«أن تعدو وتنفض رأسها» [@diwan-kaab، ص9]. وفي اللسان: «والإِرْقَال: ضَرْبٌ مِنَ الخَبَب»، و«أَرْقَلَتِ الدابةُ والناقةُ إِرْقَالًا: أَسرعت» [@lisan، ج11 ص293]."
- term: "تَبْغِيلُ"
  text: "في اللسان: «هُوَ تَفْعِيل مِنَ البَغْل كأَنه شَّبَهَ سَيْرَهَا بِسَيْرِ الْبَغْلِ لشدَّته» [@lisan، ج11 ص60]. وينقل المحققون عن اللسان أنه «مشي فيه سعة»، أو «مشي فيه اختلاف واختلاط بين الهملجة والعنق» [@diwan-kaab، ص9]."
context: "ينتقل من الإبل العتاق جملةً إلى ناقة بعينها، فتبدأ الصفات: الشدة، ثم العرق، ثم البصر، ثم الخلقة."
syntax:
- "«وَلَنْ يُبَلِّغَهَا»: «لن» حرف نفي ونصب، والفعل منصوب، و«عُذَافِرَةٌ» فاعل."
- "«فِيهَا عَلَى الْأَيْنِ إِرْقَالٌ»: «فيها» خبر مقدم، و«إرقال» مبتدأ مؤخر، و«على الأين» متعلق بمحذوف حال، والجملة صفة لـ«عذافرة»."
morphology:
- "«عُذَافِرَةٌ» على «فُعَالِلَة»، رباعي مزيد بالألف، وصفة للناقة الضخمة."
- "«إِرْقَالٌ» مصدر «أَرْقَلَ» على «إِفْعَال»، و«تَبْغِيلُ» مصدر «بَغَّلَ» على «تَفْعِيل»."
rhetoric:
  thesis: "قوة لا ينقصها التعب: تُسرع وهي مُعْيِيَة."
  devices:
  - title: "«عَلَى الْأَيْنِ»"
    text: "«على» هنا بمعنى «مع»، تجعل الإسراع ثابتًا رغم الإعياء، وهذا أبلغ في وصف القوة من نفي التعب عنها."
  - title: "التشبيه المضمر في «تَبْغِيلُ»"
    text: "الكلمة مأخوذة من البغل، فيحمل المصدر وحده تشبيه سيرها بسير البغل في شدته كما يقول صاحب اللسان."
  connection: "ثم يذكر جنسها: من كل ناقة يفور عرقها من خلف أذنيها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ اللام المضمومة، وقبلها ياء أو واو مدّ (رِدْف)، وبعدها واو الإطلاق: «ـِيلُو» و«ـُولُو»"
  scansion: "وَلَنْ يُبَلْ / لِغَهَا / إِلْلَا عُذَا / فِرَةُنْ = متفعلن / فعِلن / مستفعلن / فعِلن — فِيهَا عَلَلْ / أَيْنِ إِرْ / قَالُنْ وَتَبْ / غِيلُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "«وَلَنْ يُبَلْ» متفعلن، و«لِغَهَا» فعِلن، وكلتاهما مخبونة."
