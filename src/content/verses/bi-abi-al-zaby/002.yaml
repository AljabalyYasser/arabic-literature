first: وَلَوْلَا الْمَلِكُ الْقَاعِـ
second: ـدُ قَدْ أَلْثَمَنِي فَاهُ
vocabulary:
- term: الْمَلِكُ
  text: عَمْرو بن هند، وهو جالس معه في مجلس الشراب.
- term: أَلْثَمَنِي فَاهُ
  text: أمكنني من تقبيل فمه، يعني الظبي.
