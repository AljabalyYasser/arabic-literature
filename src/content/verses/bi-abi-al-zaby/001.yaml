explained: false
first: أَلَا يَا بِأَبِي الظَّبْيِ
second: الَّذِي يَبْرُقُ شَنْفَاهُ
vocabulary:
- term: بِأَبِي
  text: أفديه بأبي.
- term: الظَّبْيِ
  text: يعني أخت عَمْرو بن هند؛ كان طَرَفَة ينادمه، «فأشرفت ذات يوم أخته، فرأى طَرَفَة ظلها في الجام الذي في يده» [@ibn-qutayba، ج1 ص185].
- term: شَنْفَاهُ
  text: 'مثنى شَنْف، وهو «الذي يلبس في أعلى الأذن، والذي في أسفلها القرط، وقيل: هما سواء» [@ibn-qutayba، ج1 ص185، حاشية المحقق].'
sources:
- source: ibn-qutayba
  loc: ج1 ص185
