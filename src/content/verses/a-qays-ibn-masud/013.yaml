explained: false
first: شَفَى النَّفْسَ قَتْلَى لَمْ تُوَسَّدْ خُدُودُهَا
second: وِسَادًا وَلَمْ تُعْضَضْ عَلَيْهَا الأَنَامِلُ
vocabulary:
- term: لَمْ تُوَسَّدْ خُدُودُهَا
  text: لم تُدفن، فالميت يُوسَّد في قبره.
- term: وَلَمْ تُعْضَضْ عَلَيْهَا الأَنَامِلُ
  text: لم يحزن عليها أحد، وعضّ أطراف الأصابع من فعل النادم والمغتاظ.
