explained: false
first: كَأَنَّكَ لَمْ تَشْهَدْ قَرَابِينَ جَمَّةً
second: تَعِيثُ ضِبَاعٌ فِيهِمُ وَعَوَاسِلُ
vocabulary:
- term: قَرَابِينَ
  text: 'جمع قُرْبان، وهو ما يُتقرَّب به من الذبائح. يقول المحقق: «يقصد القتلى فى الحروب» [@diwan-asha، ص219].'
- term: جَمَّةً
  text: كثيرة.
- term: تَعِيثُ
  text: تُفسد وتنهش.
- term: عَوَاسِلُ
  text: 'الذئاب: «وَالذِّئْبُ عاسِلٌ، وَالْجَمْعُ العُسَّل والعَوَاسِل» [@lisan، ج11 ص446].'
