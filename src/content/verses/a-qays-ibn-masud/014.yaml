first: بِعَيْنَيْكَ يَوْمَ الحِنْوِ إِذْ صَبَّحَتْهُمُ
second: كَتَائِبُ مَوْتٍ لَمْ تَعُقْهَا العَوَاذِلُ
vocabulary:
- term: يَوْمَ الحِنْوِ
  text: 'يوم ذي قار، وفيه كانت الوقعة عند حِنْو قُراقِر، و«قُراقِرُ: خَلْفَ الْبَصْرَةِ وَدُونَ الْكُوفَةِ قَرِيبٌ مِنْ ذِي قَارٍ» [@lisan، ج5 ص90].'
- term: صَبَّحَتْهُمُ
  text: أغارت عليهم في الصباح.
- term: العَوَاذِلُ
  text: اللوائم.
