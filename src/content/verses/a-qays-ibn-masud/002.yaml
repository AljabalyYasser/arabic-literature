explained: false
first: أَطَوْرَيْنِ فِي عَامٍ غَزَاةٌ وَرِحْلَةٌ
second: أَلَا لَيْتَ قَيْسًا غَرَّقَتْهُ القَوَابِلُ
vocabulary:
- term: أَطَوْرَيْنِ
  text: 'مرّتين، والطَّوْر: المرة والتارة.'
- term: غَزَاةٌ وَرِحْلَةٌ
  text: غزوة مع جيش كسرى، ثم رحلة إليه.
- term: غَرَّقَتْهُ القَوَابِلُ
  text: 'قتلته القابلة ساعة وُلد: «غَرَّقَتِ الْقَابِلَةُ الْوَلَدَ، وَذَلِكَ إِذا لَمْ تَرْفُقْ بِالْوَلَدِ حَتَّى تَدْخُلَ السّابِياءُ أَنفه فَتَقْتُلَهُ» [@lisan، ج10 ص284]، وأنشد صاحب اللسان البيت شاهدًا عليه. والقوابل جمع قابلة، وهي التي تتلقى المولود.'
