explained: false
first: فَهَانَ عَلَيْنَا أَنْ تَجِفَّ وِطَابُكُمْ
second: إِذَا حُنِيَتْ فِيهَا لَدَيْهِ الزَّوَاجِلُ
vocabulary:
- term: وِطَابُكُمْ
  text: 'أسقية لبنكم: «الوَطْبُ: سِقاءُ اللبنِ» [@lisan، ج1 ص797]. وجفافها كناية عن الهلاك، يقول المحقق: «جفت وطابه وصفرت كذلك أى مات» [@diwan-asha، ص219].'
- term: الزَّوَاجِلُ
  text: جمع زاجِل، وهو «الْعُودُ الَّذِي يَكُونُ فِي طَرَف الْحَبْلِ الَّذِي تُشَدُّ بِهِ القِرْبة» [@lisan، ج11 ص302].
