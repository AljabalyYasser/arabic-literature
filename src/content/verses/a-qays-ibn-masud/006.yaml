first: أَمِنْ جَبَلِ الأَمْرَارِ صُرَّتْ خِيَامُكُمْ
second: عَلَى نَبَإٍ أَنَّ الأَشَافِيَّ سَائِلُ
vocabulary:
- term: جَبَلِ الأَمْرَارِ
  text: 'موضع. يقول المحقق: «الأمرار جبال» [@diwan-asha، ص219].'
- term: صُرَّتْ
  text: شُدّت وجُمعت للرحيل.
- term: الأَشَافِيَّ سَائِلُ
  text: 'وادٍ سال بالمطر. يقول المحقق: «الأشافى واد فى بلاد بنى شيبان» [@diwan-asha، ص219].'
