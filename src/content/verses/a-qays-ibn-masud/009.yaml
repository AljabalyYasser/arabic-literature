first: لَقَدْ كَانَ فِي شَيْبَانَ لَوْ كُنْتَ رَاضِيًا
second: قِبَابٌ وَحَيٌّ حِلَّةٌ وَقَنَابِلُ
vocabulary:
- term: قِبَابٌ
  text: خيام ضخمة، جمع قُبّة.
- term: حِلَّةٌ
  text: «وحَيٌّ حِلَّة أَي نُزُول وَفِيهِمْ كَثْرَةٌ» [@lisan، ج11 ص164].
- term: قَنَابِلُ
  text: '«القَنْبَلة والقَنْبل: طَائِفَةٌ مِنَ النَّاسِ وَمِنَ الْخَيْلِ» [@lisan، ج11 ص569].'
