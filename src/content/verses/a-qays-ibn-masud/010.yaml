explained: false
first: وَرَجْرَاجَةٌ تُعْشِي النَّوَاظِرَ فَخْمَةٌ
second: وَجُرْدٌ عَلَى أَكْنَافِهِنَّ الرَّوَاحِلُ
vocabulary:
- term: رَجْرَاجَةٌ
  text: 'كتيبة: «وكَتِيبَةٌ رَجْراجَة: تَمَخَّضُ فِي سَيْرِهَا وَلَا تَكَادُ تَسِيرُ لِكَثْرَتِهَا» [@lisan، ج2 ص282].'
- term: تُعْشِي النَّوَاظِرَ
  text: تُضعف الأبصار ببريق حديدها.
- term: وَجُرْدٌ
  text: خيل قصيرة الشعر، جمع أجرد.
- term: عَلَى أَكْنَافِهِنَّ الرَّوَاحِلُ
  text: 'الإبل التي تُركب إلى جوانب الخيل. يقول المحقق: «كانوا يركبون الابل فى الغارات البعيدة ويجنبون الخيل فاذا قاربوا الاعداء ركبوا الخيل» [@diwan-asha، ص221].'
