first: "إِذْ قَرَّبُوا لِابْنِ سَوَّارٍ أَبَاعِرَهُمْ"
second: "لِلَّهِ دَرُّ عَطَاءٍ كَانَ ذَا غَبَنِ"
vocabulary:
  - term: "قَرَّبُوا لِابْنِ سَوَّارٍ"
    text: "«يريد: راجعت قومي فيما كانوا همّوا به، من جمع الإبل حتى امتلأت منها الرّحاب، وسوقها نحو ابن سوّار» [@tabrizi-ikhtiyarat، ج3 ص1163]."
  - term: "لِلَّهِ دَرُّ عَطَاءٍ"
    text: "قالها «على وجه التعجب والسخرية» [@tabrizi-ikhtiyarat، ج3 ص1163]."
  - term: "غَبَنِ"
    text: "«والغبن: ضعف الرأي» [@lisan، ج13 ص309]."
