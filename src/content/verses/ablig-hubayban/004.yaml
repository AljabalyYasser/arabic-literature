explained: false
first: "لَوْ أَنَّنِي كُنْتُ مِنْ عَادٍ وَمِنْ إِرَمٍ"
second: "رُبِّيتُ فِيهِمْ وَلُقْمَانٍ وَمِنْ جَدَنِ"
vocabulary:
  - term: "مِنْ عَادٍ وَمِنْ إِرَمٍ"
    text: "من الأمم البائدة، يقول التِّبْرِيزِيّ: «لو لم أكن من العرب، ولم يجمعني وإياهم نسب، بل كنت من الأمم الذين بادوا» [@tabrizi-ikhtiyarat، ج3 ص1162]."
  - term: "لُقْمَانٍ وَمِنْ جَدَنِ"
    text: "لقمان «صاحب النسور المشهور»، وجَدَن «من أقيال اليمن»، فيما يقول محقق التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1162، الحاشية]. والأقيال: الملوك."
