explained: false
first: "أَنَّى جَزَوْا عَامِرًا سُوأَى بِفِعْلِهِمُ"
second: "أَمْ كَيْفَ يَجْزُونَنِي السُّوأَى مِنَ الحَسَنِ"
vocabulary:
  - term: "أَنَّى"
    text: "«كيف، ومن أين» [@tabrizi-ikhtiyarat، ج3 ص1164]."
  - term: "عَامِرًا"
    text: "رجل كان مع الشاعر في موقفه، يقول التِّبْرِيزِيّ إنه «نظيره في إنكار ما أنكره» [@tabrizi-ikhtiyarat، ج3 ص1164]، فجُزي مثله بالإساءة."
  - term: "سُوأَى"
    text: "«كالذكرى والرجعى من المصادر» [@tabrizi-ikhtiyarat، ج3 ص1164]، أي إساءة."
