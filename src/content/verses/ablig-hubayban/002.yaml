explained: false
first: "قَدْ كُنْتُ أَسْبِقُ مَنْ جَارَوْا عَلَى مَهَلٍ"
second: "مِنْ وُلْدِ آدَمَ مَا لَمْ يَخْلَعُوا رَسَنِي"
vocabulary:
  - term: "عَلَى مَهَلٍ"
    text: "«في موضع الحال. يريد: متمهّلا» [@tabrizi-ikhtiyarat، ج3 ص1161]."
  - term: "مَا لَمْ يَخْلَعُوا رَسَنِي"
    text: "الرَّسَن: الحبل يُقاد به، يقول التِّبْرِيزِيّ: «يريد: مدة اشتمالهم عليّ»، والمعنى: «إني كنت أناضل عنهم، وأذبّ دونهم، وأسبق من جاراهم من الناس كلهم، ما لم يرغبوا عني، ويزهدوا فيّ» [@tabrizi-ikhtiyarat، ج3 ص1161]."
