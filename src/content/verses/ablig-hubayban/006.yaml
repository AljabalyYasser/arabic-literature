first: "سَأَلْتُ قَوْمِي وَقَدْ سَدَّتْ أَبَاعِرُهُمْ"
second: "مَا بَيْنَ رُحْبَةَ ذَاتِ العِيصِ وَالعَدَنِ"
vocabulary:
  - term: "أَبَاعِرُهُمْ"
    text: "إبلهم، ويقول محقق التِّبْرِيزِيّ: «والأباعر: الإبل البزل. ورحبة والعدن: موضعان» [@tabrizi-ikhtiyarat، ج3 ص1163، الحاشية]. والبُزْل: الإبل المسنّة القوية."
  - term: "العِيصِ"
    text: "«العيص: منبت خيار الشجر» [@lisan، ج7 ص59]."
