explained: false
first: "أَمْ كَيْفَ يَنْفَعُ مَا تُعْطِي العَلُوقُ بِهِ"
second: "رِئْمَانُ أَنْفٍ إِذَا مَا ضُنَّ بِاللَّبَنِ"
vocabulary:
  - term: "العَلُوقُ"
    text: "«الناقة التي ترأم ولدها، ولا تدرّ عليه» [@tabrizi-ikhtiyarat، ج3 ص1164]."
  - term: "رِئْمَانُ أَنْفٍ"
    text: "عطفها على الولد تشمّه بأنفها، و«رئمت الناقة ولدها ترأمه رأما ورأمانا: عطفت عليه ولزمته» [@lisan، ج12 ص223]. وهو بدل من «ما»، ويُروى بالرفع والنصب والجر [@tabrizi-ikhtiyarat، ج3 ص1165]."
  - term: "ضُنَّ بِاللَّبَنِ"
    text: "بُخل به. والمعنى: «ما لكم تضيّعون حقّ عامر وحقّي؟ وهل فعلكم هذا إلا كفعل العلوق؟» [@tabrizi-ikhtiyarat، ج3 ص1165]."
