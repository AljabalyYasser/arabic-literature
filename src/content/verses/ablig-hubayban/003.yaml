explained: false
first: "فَالُوا عَلَيَّ وَلَمْ أَمْلِكْ فِيَالَتَهُمْ"
second: "حَتَّى انْتَحَيْتُ عَلَى الأَرْسَاغِ وَالثُّنَنِ"
vocabulary:
  - term: "فَالُوا"
    text: "«يريد: أخطؤوا عليّ في رأيهم، ولم أملك صرفهم عن ظلمهم» [@tabrizi-ikhtiyarat، ج3 ص1161]."
  - term: "فِيَالَتَهُمْ"
    text: "ضعف رأيهم، و«فيل رأيه تفييلا أي ضعفه، فهو فيل الرأي» [@lisan، ج11 ص535]."
  - term: "الأَرْسَاغِ وَالثُّنَنِ"
    text: "«الرسغ: مفصل ما بين الكف والذراع» [@lisan، ج8 ص428]، و«الثنن: جمع ثنّة. وهو الشعر في مآخير الحوافر» [@tabrizi-ikhtiyarat، ج3 ص1161]. «وجعل الرسغ والثنة مثلا» [@tabrizi-ikhtiyarat، ج3 ص1162]، أي اعتمد على أدنى ما فيه حين ظلموه."
