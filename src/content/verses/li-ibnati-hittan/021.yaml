first: فَوَارِسُهَا مِنْ تَغْلِبَ ابْنَةِ وَائِلٍ
second: حُمَاةٌ كُمَاةٌ لَيْسَ فِيهَا أَشَائِبُ
vocabulary:
- term: تَغْلِبَ ابْنَةِ وَائِلٍ
  text: قبيلة الشاعر، تَغْلِب بن وائِل؛ «إنما يذهبون بالتأنيث إلى القبيلة، كما قالوا تميم بنت مر» [@lisan، ج1 ص652].
- term: كُمَاةٌ
  text: «جمع كمي، وهو الشجاع» [@mufaddaliyyat، ص206، الحاشية].
- term: أَشَائِبُ
  text: «الأخلاط» [@mufaddaliyyat، ص206، الحاشية].
