explained: false
first: وَنَحْنُ أُنَاسٌ لَا حِجَازَ بِأَرْضِنَا
second: مَعَ الْغَيْثِ مَا نُلْقَى وَمَنْ هُوَ غَالِبُ
vocabulary:
- term: حِجَازَ
  text: «الحاجز، أي نحن مصحرون لا نخاف أحدا فنمتنع منه» [@mufaddaliyyat، ص206، الحاشية].
- term: الْغَيْثِ
  text: المطر.
- term: مَا نُلْقَى
  text: «أي نلقى مع الغيث، كلما وقع في بلد صرنا إليه وغلبنا عليه أهله» [@mufaddaliyyat، ص206، الحاشية].
