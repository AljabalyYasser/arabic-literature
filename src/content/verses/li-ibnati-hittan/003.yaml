explained: false
first: تَظَلُّ بِهَا رُبْدُ النَّعَامِ كَأَنَّهَا
second: إِمَاءٌ تُزَجَّى بِالْعَشِيِّ حَوَاطِبُ
vocabulary:
- term: رُبْدُ
  text: «جمع أربد وربداء، والربدة سواد في بياض» [@mufaddaliyyat، ص204، الحاشية].
- term: تُزَجَّى
  text: تُساق.
- term: بِالْعَشِيِّ حَوَاطِبُ
  text: 'يحملن الحطب عائدات آخر النهار؛ قال الأَصْمَعِيّ: «إنما توصف الإماء في مثل هذا الموضع بالرواح، لا بالغدو، لأنهن يجئن بالحطب إذا رحن» [@ibn-qutayba، ج1 ص167].'
