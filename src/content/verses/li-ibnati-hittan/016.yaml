explained: false
first: وَغَارَتْ إِيَادٌ فِي السَّوَادِ وَدُونَهَا
second: بَرَازِيقُ عُجْمٌ تَبْتَغِي مَنْ تُضَارِبُ
vocabulary:
- term: غَارَتْ
  text: «دخلت» [@mufaddaliyyat، ص206، الحاشية]، أي توغلت.
- term: إِيَادٌ
  text: قبيلة من مَعَدّ، تنسب إلى إياد بن معد [@mufaddaliyyat، ص206، الحاشية].
- term: السَّوَادِ
  text: «سواد العراق، سمي سوادا لكثرة نخله» [@mufaddaliyyat، ص206، الحاشية].
- term: بَرَازِيقُ
  text: '«الجماعات ... وقيل: جماعات الخيل، وقيل: هم الفرسان»، فارسي معرّب [@lisan، ج10 ص19].'
