explained: false
first: خَلِيلَايَ هَوْجَاءُ النَّجَاءِ شِمِلَّةٌ
second: وَذُو شُطَبٍ لَا يَجْتَوِيهِ الْمُصَاحِبُ
vocabulary:
- term: هَوْجَاءُ النَّجَاءِ
  text: 'ناقته؛ الهوجاء «التي تركب رأسها في السير»، والنجاء: السرعة [@mufaddaliyyat، ص204، الحاشية].'
- term: شِمِلَّةٌ
  text: خفيفة سريعة.
- term: ذُو شُطَبٍ
  text: سيفه، «والشطب كهيئة الخطوط في السيف» [@mufaddaliyyat، ص204، الحاشية].
- term: لَا يَجْتَوِيهِ
  text: لا يكرهه ولا يستثقله.
