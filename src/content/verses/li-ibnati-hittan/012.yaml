explained: false
first: وَصَارَتْ تَمِيمٌ بَيْنَ قُفٍّ وَرَمْلَةٍ
second: لَهَا مِنْ حِبَالٍ مُنْتَأًى وَمَذَاهِبُ
vocabulary:
- term: تَمِيمٌ
  text: تميم بن مُرّ، من مُضَر [@mufaddaliyyat، ص205، الحاشية].
- term: قُفٍّ
  text: «ما خشن من الأرض واجتمع» [@mufaddaliyyat، ص205، الحاشية].
- term: حِبَالٍ
  text: حبال الرمل، «وهي معاظمها» [@mufaddaliyyat، ص205، الحاشية].
- term: مُنْتَأًى
  text: 'مُبتعَد؛ «أي: لها بعد ومذاهب عن عدوها فلا يصل إليها» [@mufaddaliyyat، ص205، الحاشية].'
