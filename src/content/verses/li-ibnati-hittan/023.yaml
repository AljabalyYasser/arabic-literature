explained: false
first: بِجَأْوَاءَ يَنْفِي وِرْدُهَا سَرَعَانَهَا
second: كَأَنَّ وَضِيحَ الْبَيْضِ فِيهَا الْكَوَاكِبُ
vocabulary:
- term: جَأْوَاءَ
  text: «الكتيبة الكثيرة الدروع المتغيرة الألوان لطول الغزو»، من الجُؤوة، «وهي حمرة تضرب إلى السواد» [@mufaddaliyyat، ص207، الحاشية].
- term: يَنْفِي وِرْدُهَا سَرَعَانَهَا
  text: من ورد الماء منها طرد المتسرعين إليه أولًا، «مخافة أن يضيق عليهم لكثرتهم» [@mufaddaliyyat، ص207، الحاشية].
- term: وَضِيحَ الْبَيْضِ
  text: «ما وضح منها، أي ظهر» [@mufaddaliyyat، ص207، الحاشية].
