explained: false
first: تَطَايَرُ عَنْ أَعْجَازِ حُوشٍ كَأَنَّهَا
second: جَهَامٌ أَرَاقَ مَاءَهُ فَهْوَ آئِبُ
vocabulary:
- term: تَطَايَرُ
  text: 'أصلها «تتطاير»: تتفرق مسرعة.'
- term: حُوشٍ
  text: '«إبل حوشية لم ترض» [@mufaddaliyyat، ص205، الحاشية]؛ و«الحوش والحوشية: إبل الجن، وقيل: هي الإبل المتوحشة» [@lisan، ج6 ص290].'
- term: جَهَامٌ
  text: «السحاب الذي هراق ماءه، وهو أسرع لسيره» [@mufaddaliyyat، ص205، الحاشية].
- term: آئِبُ
  text: راجع.
