first: هُمُ يَضْرِبُونَ الْكَبْشَ يَبْرُقُ بَيْضُهُ
second: عَلَى وَجْهِهِ مِنَ الدِّمَاءِ سَبَائِبُ
vocabulary:
- term: الْكَبْشَ
  text: '«كبش القوم: رئيسهم وسيدهم، وقيل: كبش القوم حاميتهم» [@lisan، ج6 ص338].'
- term: بَيْضُهُ
  text: «جمع بيضة، وهي قلنسوة الحديد» [@mufaddaliyyat، ص207، الحاشية].
- term: سَبَائِبُ
  text: «الطرائق، الواحدة سبيبة» [@mufaddaliyyat، ص207، الحاشية].
