explained: false
first: أَرَى كُلَّ قَوْمٍ قَارَبُوا قَيْدَ فَحْلِهِمْ
second: وَنَحْنُ خَلَعْنَا قَيْدَهُ فَهْوَ سَارِبُ
vocabulary:
- term: قَارَبُوا قَيْدَ فَحْلِهِمْ
  text: 'قال الأَصْمَعِيّ: «حبسوا فحلهم عن أن يتقدم فتتبعه إبلهم، خوفا أن يغار عليها» [@lisan، ج1 ص462].'
- term: خَلَعْنَا قَيْدَهُ
  text: 'قال الأَصْمَعِيّ: «هذا مثل»، أي «نحن أعزاء نقتري الأرض، نذهب فيها حيث شئنا» [@lisan، ج1 ص462].'
- term: سَارِبُ
  text: «الذاهب على وجهه في الأرض» [@lisan، ج1 ص462].
