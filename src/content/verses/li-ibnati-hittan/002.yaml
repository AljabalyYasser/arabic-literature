explained: false
first: ظَلِلْتُ بِهَا أُعْرَى وَأُشْعَرُ سُخْنَةً
second: كَمَا اعْتَادَ مَحْمُومًا بِخَيْبَرَ صَالِبُ
vocabulary:
- term: أُعْرَى
  text: تصيبني العُرَواء، «وهي الرعدة تكون للحمى» [@mufaddaliyyat، ص204، الحاشية].
- term: أُشْعَرُ سُخْنَةً
  text: أُلبَس الحرارة كالشِّعار، وهو «الثوب الذي يلي البدن» [@mufaddaliyyat، ص204، الحاشية].
- term: بِخَيْبَرَ
  text: «إنما خصها لأن حماها أشد الحمى» [@mufaddaliyyat، ص204، الحاشية].
- term: صَالِبُ
  text: حمى شديدة؛ «الصالب التي معها حر شديد، وليس معها برد» [@lisan، ج1 ص530].
