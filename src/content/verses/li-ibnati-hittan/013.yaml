explained: false
first: وَكَلْبٌ لَهَا خَبْتٌ فَرَمْلَةُ عَالِجٍ
second: إِلَى الْحَرَّةِ الرَّجْلَاءِ حَيْثُ تُحَارِبُ
vocabulary:
- term: كَلْبٌ
  text: كلب بن وبرة، من قُضاعة [@mufaddaliyyat، ص205، الحاشية].
- term: خَبْتٌ
  text: موضع من «منازل بني كلب» [@mufaddaliyyat، ص205، الحاشية]؛ والخبت في الأصل «ما اتسع من بطون الأرض» [@lisan، ج2 ص27].
- term: رَمْلَةُ عَالِجٍ
  text: عالج «موضع بالبادية بها رمل» [@lisan، ج2 ص327].
- term: الْحَرَّةِ الرَّجْلَاءِ
  text: 'الحرة: أرض تكسوها حجارة سود؛ «والحرة الرجلاء الصلبة الشديدة» [@lisan، ج4 ص180].'
