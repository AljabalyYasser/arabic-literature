explained: false
first: لُكَيْزٌ لَهَا الْبَحْرَانِ وَالسِّيفُ كُلُّهُ
second: وَإِنْ يَأْتِهَا بَأْسٌ مِنَ الْهِنْدِ كَارِبُ
vocabulary:
- term: لُكَيْزٌ
  text: قبيلة من عبد القيس، وهو لُكَيز بن أفصى بن عبد القيس [@mufaddaliyyat، ص205، الحاشية].
- term: الْبَحْرَانِ
  text: «البلاد المعروفة باسم «البحرين»» على ساحل الخليج [@mufaddaliyyat، ص205، الحاشية].
- term: السِّيفُ
  text: «ساحل البحر» [@lisan، ج9 ص167].
- term: كَارِبُ
  text: شديد يأخذ بالنفس؛ «فاعل من الكرب، وهو شدة الأمر» [@mufaddaliyyat، ص205، الحاشية].
