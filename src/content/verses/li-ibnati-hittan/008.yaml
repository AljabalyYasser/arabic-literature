first: لِكُلِّ أُنَاسٍ مِنْ مَعَدٍّ عِمَارَةٌ
second: عَرُوضٌ إِلَيْهَا يَلْجَؤُونَ وَجَانِبُ
vocabulary:
- term: مَعَدٍّ
  text: مَعَدّ بن عدنان، أبو قبائل العرب الشمالية.
- term: عِمَارَةٌ
  text: '«أصغر من القبيلة، وقيل: هو الحي العظيم الذي يقوم بنفسه» [@lisan، ج4 ص606].'
- term: عَرُوضٌ
  text: '«الناحية»؛ وفي اللسان: «يقول: لكل حي حرز إلا بني تَغْلِب فإن حرزهم السيوف» [@lisan، ج7 ص173].'
