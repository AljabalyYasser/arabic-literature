explained: false
first: وَبَهْرَاءُ حَيٌّ قَدْ عَلِمْنَا مَكَانَهُمْ
second: لَهُمْ شَرَكٌ حَوْلَ الرُّصَافَةِ لَاحِبُ
vocabulary:
- term: بَهْرَاءُ
  text: قبيلة من قُضاعة [@mufaddaliyyat، ص206، الحاشية].
- term: شَرَكٌ
  text: «بنيات الطريق تتشعب عنه» [@mufaddaliyyat، ص206، الحاشية].
- term: الرُّصَافَةِ
  text: موضع «ناحية حمص» [@mufaddaliyyat، ص206، الحاشية]؛ وفي اللسان أن الرصافة «غلب على موضع بغداد والشام» [@lisan، ج9 ص121].
- term: لَاحِبُ
  text: «الطريق الماضي المنقاد» [@mufaddaliyyat، ص206، الحاشية]، أي الواضح الممتد.
