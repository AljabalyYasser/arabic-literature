first: تَرَى رَائِدَاتِ الْخَيْلِ حَوْلَ بُيُوتِنَا
second: كَمِعْزَى الْحِجَازِ أَعْجَزَتْهَا الزَّرَائِبُ
vocabulary:
- term: رَائِدَاتِ
  text: «التي ترعى لا تعلف في البيوت، فهي ترود المراعي» [@mufaddaliyyat، ص206، الحاشية].
- term: أَعْجَزَتْهَا
  text: ضاقت عنها لكثرتها.
- term: الزَّرَائِبُ
  text: جمع زريبة، وهي حظيرة الغنم.
