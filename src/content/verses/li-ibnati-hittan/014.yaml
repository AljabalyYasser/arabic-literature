explained: false
first: وَغَسَّانُ حَيٌّ عِزُّهُمْ فِي سِوَاهُمُ
second: يُجَالِدُ عَنْهُمْ مِقْنَبٌ وَكَتَائِبُ
vocabulary:
- term: غَسَّانُ
  text: 'قبيلة من الأزد نزلت الشام، و«غسان: اسم ماء» سُمّوا به [@mufaddaliyyat، ص205، الحاشية].'
- term: عِزُّهُمْ فِي سِوَاهُمُ
  text: «هم ملوك، ولم يكونوا كثيرا، وكانت الروم توليهم وتقاتل عنهم، فعزهم في غيرهم» [@mufaddaliyyat، ص205، الحاشية].
- term: يُجَالِدُ
  text: يقاتل بالسيوف.
- term: مِقْنَبٌ
  text: «الجماعة من الخيل» [@mufaddaliyyat، ص205، الحاشية].
