explained: false
first: رَفِيقًا لِمَنْ أَعْيَا وَقُلِّدَ حَبْلَهُ
second: وَحَاذَرَ جَرَّاهُ الصَّدِيقُ الْأَقَارِبُ
vocabulary:
- term: أَعْيَا
  text: أتعب عاذليه وأجهدهم بشراسته [@mufaddaliyyat، ص204، الحاشية].
- term: قُلِّدَ حَبْلَهُ
  text: تُرك وشأنه يأسًا منه، «كما يفعل بالبعير إذا صعب قياده فألقي حبله على عنقه وترك يفعل ما يشاء» [@mufaddaliyyat، ص204، الحاشية].
- term: جَرَّاهُ
  text: جريرته، أي جنايته.
- term: الصَّدِيقُ
  text: الأصدقاء؛ يقع على الواحد والجمع.
