explained: false
first: وَبَكْرٌ لَهَا ظَهْرُ الْعِرَاقِ وَإِنْ تَشَأْ
second: يَحُلْ دُونَهَا مِنَ الْيَمَامَةِ حَاجِبُ
vocabulary:
- term: بَكْرٌ
  text: بَكْر بن وائِل، من رَبِيعة [@mufaddaliyyat، ص205، الحاشية].
- term: الْيَمَامَةِ
  text: بلاد في وسط الجزيرة، وهي «القرية التي قصبتها حَجْر» [@lisan، ج12 ص648]، موطن بني حنيفة من بَكْر.
- term: حَاجِبُ
  text: «مانع، أي لها باليمامة من يمنع من ضيمها، يعني بني حنيفة» [@mufaddaliyyat، ص205، الحاشية].
