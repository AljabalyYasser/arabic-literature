first: وَلَخْمٌ مُلُوكُ النَّاسِ يُجْبَى إِلَيْهُمُ
second: إِذَا قَالَ مِنْهُمْ قَائِلٌ فَهْوَ وَاجِبُ
vocabulary:
- term: لَخْمٌ
  text: قبيلة يمانية [@mufaddaliyyat، ص206، الحاشية]، منها ملوك الحيرة.
- term: يُجْبَى إِلَيْهُمُ
  text: يُحمل إليهم الخراج.
- term: وَاجِبُ
  text: نافذ لازم.
