first: "أَيُّهَا النَّاطِقُ الْمُرَقِّشُ عَنَّا"
second: "عِنْدَ عَمْرٍو وَهَلْ لِذَاكَ بَقَاءُ"
meaning: "يا من يتكلم عنا عند عَمْرو بن هند ويزيّن الكذب، هل لما تقوله بقاء؟ الملك سيعرف الحق. قال ابن الأَنْبارِيّ: «يقول: وهل للكاذب بقاء عند الملك. أي هو ينظر فيما ادعيتم فيعرف صدق ذلك من كذبه» [@ibn-al-anbari، ص453]."
vocabulary:
  - term: "الْمُرَقِّشُ"
    text: "«المزين للشيء» [@ibn-al-anbari، ص453]؛ «يقال: حبرت الكلام ورقشته، ونممته ونمنمته» [@ibn-al-anbari، ص453]."
  - term: "عَمْرٍو"
    text: "عَمْرو بن هند ملك الحِيرة؛ «وهو عمرو بن المنذر بن ماء السماء» [@ibn-al-anbari، ص487]."
syntax:
  - "«أَيُّهَا» منادى بحرف نداء محذوف، و«الناطق» نعت لـ«أيّ»، «والمرقش نعت الناطق، وعن وعند صلتان له» [@ibn-al-anbari، ص454]."
  - "«بَقَاءُ» مبتدأ مؤخر، خبره «لذاك» [@ibn-al-anbari، ص454]."
  - "«هَلْ» للاستفهام المراد به النفي: «وهذا استفهام معناه النفي، أي لا بقاء لذلك» [@zawzani، ص273]."
morphology:
  - "«الْمُرَقِّش» اسم فاعل من «رقّش» على «فعّل»، والترقيش في أصله النقش، ومنه بيت المُرَقِّش: «الدَّارُ قَفْرٌ وَالرُّسُومُ كَمَا ... رَقَّشَ فِي ظَهْرِ الْأَدِيمِ قَلَمْ»، «اراد: زيَّنَ» [@ibn-al-anbari، ص454]."
  - "«النَّاطِق» اسم فاعل من «نطق» على «فاعل»."
rhetoric:
  thesis: "يخاطب الخصم أمام القاضي: لا يرد على دعواه، بل يطعن في صدقه."
  devices:
    - title: "الاستعارة في «الْمُرَقِّشُ»"
      text: "الترقيش نقش الجلد بالقلم، كما في بيت المُرَقِّش الذي ينشده ابن الأَنْبارِيّ [@ibn-al-anbari، ص454]. فجعل تزيين الكذب نقشًا يزخرف الكلام الباطل حتى يبدو حسنًا. وهي استعارة يقول فيها عبد القاهر الجُرْجانيّ: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الاستفهام المراد به النفي في «وَهَلْ لِذَاكَ بَقَاءُ»"
      text: "لا يسأل، بل ينفي: لا بقاء للباطل. قال الزَّوْزَنِيّ: «وهذا استفهام معناه النفي» [@zawzani، ص273]. والنفي في صورة السؤال أقوى، لأنه يدع الخصم يجيب بنفسه."
    - title: "إشراك الملك في «عِنْدَ عَمْرٍو»"
      text: "يذكر الملك باسمه وهو بين يديه، فيجعله شاهدًا على الكذب. فالملك عند ابن الأَنْبارِيّ «ينظر فيما ادعيتم فيعرف صدق ذلك من كذبه» [@ibn-al-anbari، ص453]."
  connection: "ثم يقول للواشي: لا تظن أنا نجزع لإغرائك الملك بنا."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَيْيُهَنْنَا / طِقُلْ مُرَقْ / قِشُ عَنْنَا = فاعلاتن / متفع لن / فعلاتن — عِنْدَ عَمْرِنْ / وَهَلْ لِذَا / كَ بَقَاءُو = فاعلاتن / متفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وآخر العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "يلتفت من وصف تَغْلِب إلى مخاطبة متكلمها عند الملك. والمخاطب عند ابن الأَنْبارِيّ «يعنى عمرو بن كلثوم» [@ibn-al-anbari، ص453]، وعند التِّبْرِيزِيّ: «ويقال: إنه يخاطب بها عمرو بن كلثوم» [@tabrizi-ashr، ص260]. ويتكرر هذا الخطاب في البيت 65: «أيها الشانئ المبلغ عنا»."
variants:
  - reading: "أَيُّهَا النَّاطِقُ الْمُحَبِّرُ عَنَّا"
    status: "رواية أخرى"
    note: "«ويروى: (أيها الناطق المحبر عنا عند عمرو) ، وهو المزين» [@ibn-al-anbari، ص453]. «ويروى: (المخبر عنا) ، بخاء معجمة» [@ibn-al-anbari، ص454]."
  - reading: "...عِنْدَ عَمْرٍو وَمَا لَهُ إِبْقَاءُ"
    status: "رواية قُطْرُب"
    note: "«وفي رواية قطرب: (وماله إبقاء) ، معناه: ليس يبقى على أحد» [@ibn-al-anbari، ص454]."
