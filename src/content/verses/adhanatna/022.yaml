first: "لَا تَخَلْنَا عَلَى غَرَائِكَ إِنَّا"
second: "قَبْلُ مَا قَدْ وَشَى بِنَا الْأَعْدَاءُ"
meaning: "لا تظنّنا نجزع لإغرائك الملك بنا، فقد وشى بنا الأعداء من قبلك فلم يضرنا ذلك. قال ابن الأَنْبارِيّ: «أراد: لا تحسب أنا جازعون لإغرائك الملك بنا» [@ibn-al-anbari، ص454]، و«معناه طال ما نمم بنا الأعداء قبلك عند الملوك فلم يضرنا ذلك» [@ibn-al-anbari، ص455]."
vocabulary:
  - term: "لَا تَخَلْنَا"
    text: "«معناه لا تظننا» [@ibn-al-anbari، ص454]."
  - term: "غَرَائِكَ"
    text: "إغرائك، أي تحريضك الملك علينا؛ «مأخوذ من قولك: غريت بالشيء أغرى به، إذا اولعت به ولزمته» [@ibn-al-anbari، ص454]."
  - term: "وَشَى"
    text: "«ومعنى وشى نمم» [@ibn-al-anbari، ص455]، أي نقل الكلام ليفسد."
syntax:
  - "«وتخلنا جزم بلا على النهى وعلامة الجزم فيه سكون اللام، والألف سقطت لسكونها وسكون اللام» [@ibn-al-anbari، ص456]."
  - "والمفعول الثاني لـ«تخلنا» محذوف: «والمفعول الثاني لَتَخَلْنَا محذوف تقديره: لا تخلنا متخاشعين» [@zawzani، ص274]. وهو موضع الشاهد عند البغدادي: «على أن بعضهم جوز في السعة حذف أحد مفعولي باب علمت للقرينة مستدلا بهذا البيت»، «والقرينة البيت الذي بعده» [@khizana، ج1 ص324]."
  - "«وقبل ضمت على الغاية، وما صلته» [@ibn-al-anbari، ص456]؛ أي «قبلُ» مبنية على الضم لحذف المضاف إليه، و«ما» زائدة."
morphology:
  - "«تَخَلْ» مضارع «خال يخال» بمعنى ظن: «قال الفراء: هو مأخوذ من الخيال والشيء يشبه لك، ثم ذهب به مذهب الظن» [@ibn-al-anbari، ص454]."
  - "«غَرَاء» مصدر «غَرِيَ بالشيء»: «يقال غريت بالشيء أغرى به غراء» [@ibn-al-anbari، ص454]؛ وفي رواية الزَّوْزَنِيّ «الغراة: اسم بمعنى الإغراء» [@zawzani، ص274]."
  - "«الْأَعْدَاء» جمع «عدوّ» على «أفعال»."
rhetoric:
  thesis: "ثبات أمام الوشاية: الماضي دليل على المستقبل."
  devices:
    - title: "الحذف في «لَا تَخَلْنَا»"
      text: "حذف المفعول الثاني فلم يقل: لا تخلنا جازعين أو أذلاء، وترك البيت التالي يدل عليه [@khizana، ج1 ص324]. فكل صفة ذل يتصورها السامع منفية. وفي الحذف يقول عبد القاهر الجُرْجانيّ: «والصمتَ عن الإفادةِ، أَزْيَدَ للإِفادة» [@dalail، ص146]."
    - title: "الاحتجاج بالتجربة"
      text: "«إِنَّا قَبْلُ مَا قَدْ وَشَى بِنَا الْأَعْدَاءُ»: لا يرد الوشاية بالإنكار، بل بأن الوشاة قبله لم يضروا. قال الزَّوْزَنِيّ: «إن إغراءك الملك بنا لا يقدح في أمرنا كما لم يقدح إغراء غيرك فيه» [@zawzani، ص274]."
  connection: "ثم يقول: فبقينا على بغض الناس، ترفعنا حصون وعزة ثابتة."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "لَا تَخَلْنَا / عَلَى غَرَا / ئِكَ إِنْنَا = فاعلاتن / متفع لن / فعلاتن — قَبْلُ مَا قَدْ / وَشَى بِنَلْ / أَعْدَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يكمل خطاب الواشي. ويقول ابن الأَنْبارِيّ: «وإنما خاطب بهذا النعمان بن المنذر» [@ibn-al-anbari، ص454]، أما الزَّوْزَنِيّ فيقول إنه «يخاطب من يسعى بهم من بني تغلب إلى عمرو بن هند ملك العرب» [@zawzani، ص274]؛ والخطاب في البيت السابق للناطق عند عَمْرو، فقول الزَّوْزَنِيّ أقرب إلى السياق. وصار البيت شاهدًا للنحاة على حذف أحد مفعولي «خال»، كما يقول البغدادي [@khizana، ج1 ص324]."
variants:
  - reading: "لَا تَخَلْنَا عَلَى غَرَاتِكَ إِنَّا"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص274]، وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص260]."
  - reading: "...إِنَّا / طَالَمَا قَدْ وَشَى بِنَا الْأَعْدَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (طال ما قد وشى)» [@ibn-al-anbari، ص455]، وبها أنشده البغدادي [@khizana، ج1 ص324]."
