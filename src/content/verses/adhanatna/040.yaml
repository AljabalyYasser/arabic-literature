first: "فَاتْرُكُوا الْبَغْيَ وَالتَّعَدِّي وَإِمَّا"
second: "تَتَعَاشَوْا فَفِي التَّعَاشِي الدَّاءُ"
meaning: "فاتركوا الظلم والتعدي علينا، وإن تتعاموا عن الحق ففي التعامي الهلاك. قال ابن الأَنْبارِيّ: «ومعنى البيت: أن تتجاهلوا ففي ذلك الهلاك. أي اتركوا القول القبيح والتعامي عن أيامنا» [@ibn-al-anbari، ص477]."
vocabulary:
  - term: "الْبَغْيَ"
    text: "الظلم ومجاوزة الحد."
  - term: "التَّعَاشِي"
    text: "«التعامي» [@ibn-al-anbari، ص477]؛ وهو عند الزَّوْزَنِيّ «تكلف العَشَى والعَمَى ممن ليس به عشىً وعمىً» [@zawzani، ص283]. والعَشَى: ضعف البصر."
  - term: "الدَّاءُ"
    text: "الشر والهلاك؛ «أي الشر يرجع إليكم في ذلك» [@tabrizi-ashr، ص268]."
syntax:
  - "«وأما حرف جزاء، وما صلة، والفاء جواب الجزاء» [@ibn-al-anbari، ص478]؛ أي «إمّا» هي «إن» الشرطية زيدت عليها «ما»، و«تتعاشوا» فعل الشرط مجزوم بحذف النون."
  - "«والداء رفع بقوله ففي التعاشي» [@ibn-al-anbari، ص478]؛ أي مبتدأ مؤخر خبره «في التعاشي»."
  - "«والتعدي منصوب لأنه نسق على الطيخ، وأسكنت الياء، وحقها أن تفتح» [@ibn-al-anbari، ص477]، والشرح على رواية «الطيخ»."
morphology:
  - "«التَّعَاشِي» مصدر «تعاشى» على «تفاعل»، والتفاعل هنا للتكلف [@zawzani، ص283]: يُظهرون العشى وليس بهم."
  - "«التَّعَدِّي» مصدر «تعدّى» على «تفعّل»: «أصله التعدو، فلما وقعت الواو طرفا وانضم ما قبلها ردت إلى الياء» [@ibn-al-anbari، ص478]."
  - "«تَتَعَاشَوْا» مضارع مجزوم، حُذفت لامه وبقيت الفتحة قبل الواو دليلًا عليها."
rhetoric:
  thesis: "إنذار صريح بعد الحجاج: إما الكف وإما الداء."
  devices:
    - title: "الاستعارة في «التَّعَاشِي»"
      text: "جعل تجاهل الحق عمى متكلَّفًا: يرون ولا يريدون أن يروا. وفسرها التِّبْرِيزِيّ: «أي تتعاموا، ومعناه تتجاهلوا» [@tabrizi-ashr، ص268]."
    - title: "رد العجز على الصدر"
      text: "«تَتَعَاشَوْا فَفِي التَّعَاشِي»: الفعل ثم مصدره في شطر واحد، فيرتد الكلام على نفسه كما يرتد التعامي على صاحبه."
  connection: "ثم يذكّرهم بحلف ذي المَجاز."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَتْرُكُلْ بَغْ / يَ وَتْتَعَدْ / دِي وَإِمْمَا = فاعلاتن / متفع لن / فاعلاتن — تَتَعَاشَوْ / فَفِتْتَعَا / شِدْدَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "بعد أيام بَكْر ومدح المنذر يعود إلى خطاب تَغْلِب بالأمر الصريح، ويبدأ ذكر العهد (40–43). وهذا البيت والبيتان بعده يأتيان عند الزَّوْزَنِيّ في موضع آخر، بعد آخر بيت عندنا [@zawzani، ص283]."
