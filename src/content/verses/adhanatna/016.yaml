first: "أَنَّ إِخْوَانَنَا الْأَرَاقِمَ يَغْلُو"
second: "نَ عَلَيْنَا فِي قَوْلِهِمْ إِحْفَاءُ"
meaning: "أن إخواننا الأراقم يتجاوزون الحد علينا، ويُلحّون في قولهم ويستقصون. قال ابن الأَنْبارِيّ: «معناه يرتفعون علينا في القول ويظلموننا، ويُحملوننا ذنب غيرنا ويطلبون ما ليس لهم بحق» [@ibn-al-anbari، ص447]."
vocabulary:
  - term: "يَغْلُونَ"
    text: "يتجاوزون الحد؛ «وأصل الغلو في اللغة: الارتفاع والزيادة» [@ibn-al-anbari، ص447]."
  - term: "إِحْفَاءُ"
    text: "«معناه انهم حملوا علينا وألحوا في مساءتنا، وألصقوا بنا ما نكره. وهو من قولهم: أحفيت الشيء، إذا استقصيت عليه» [@ibn-al-anbari، ص447]. وفي اللسان: «والإحفاء: الاستقصاء في الكلام والمنازعة» [@lisan، ج14 ص188]."
syntax:
  - "«وموضع أن رفع على الترجمة عن الأنباء، كأنه قال: أتانا أن إخواننا الأراقم» [@ibn-al-anbari، ص448]؛ والترجمة عند الكوفيين البدل."
  - "«ويجوز أن يكون أن في موضع نصب في قول الفراء، وخفض في قول الكسائي، على معنى بأنَّ ولأنَّ» [@ibn-al-anbari، ص448]."
  - "جملة «يغلون» خبر «أنّ»، و«إحفاء» مبتدأ مؤخر خبره «في قولهم»، والجملة حال من فاعل «يغلون»."
morphology:
  - "«يَغْلُونَ» مضارع «غلا يغلو» الواوي: «ويقال غلا السعر، إذا ارتفع وزاد» [@ibn-al-anbari، ص447]."
  - "«إِحْفَاء» مصدر «أحفى» على «إفعال»: «ويقال: قد أحفى فلان في الشتم، إذا اشتد فيه وألح» [@ibn-al-anbari، ص447]."
  - "«إِخْوَان» جمع «أخ» على «فِعْلان»."
rhetoric:
  thesis: "الخصم أخ: يبدأ الشكوى بكلمة «إخواننا»، فيجعل الظلم خيانة للقرابة."
  devices:
    - title: "المفارقة في «إِخْوَانَنَا ... يَغْلُونَ عَلَيْنَا»"
      text: "جمع في جملة واحدة الأخوّة والعدوان، فيرى السامع الظلم أشد لأنه من الإخوة. ولو قال «إن تغلب يغلون علينا» لضاع هذا المعنى."
    - title: "الاستعارة في «يَغْلُونَ»"
      text: "الغلو في أصله الارتفاع، كما يغلو السعر [@ibn-al-anbari، ص447]، فجعل القول الجائر ارتفاعًا فوق الحق. وهي استعارة في الفعل، والاستعارة عند عبد القاهر الجُرْجانيّ «لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]."
  connection: "ثم يفصّل ظلمهم: يخلطون البريء بالمذنب."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَنْنَ إِخْوَا / نَنَلْ أَرَا / قِمَ يَغْلُو = فاعلاتن / متفع لن / فعلاتن — نَ عَلَيْنَا / فِي قَوْلِهِمْ / إِحْفَاءُو = فعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "تفسير «الخطب» في البيت السابق، كما يقول الزَّوْزَنِيّ [@zawzani، ص272]. والخصم أخ، فبكر وتغلب «ابني وائل» [@aghani-dk، ج11 ص42]، والحارِث يسميهم «إخواننا»؛ فيصير الظلم خيانة للقرابة قبل أن يكون ظلمًا."
variants:
  - reading: "إِنَّ إِخْوَانَنَا الْأَرَاقِمَ يَغْلُو..."
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى (إن إخواننا) بكسر إنّ»، «ومن كسرها صيرها مُبتدأة» [@tabrizi-ashr، ص257–258]. وهي رواية الزَّوْزَنِيّ [@zawzani، ص272]."
  - reading: "...نَ عَلَيْنَا فِي قِيلِهِمْ إِحْفَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (في قيلهم إحفاء) ، وهي لغة» [@ibn-al-anbari، ص448]، وبها يروي الزَّوْزَنِيّ [@zawzani، ص272]."
  - reading: "إِنَّ إِخْوَانَنَا الْأَرَاقِمَ يَعْلُو / نَ عَلَيْنَا فِي قِيلِهِمْ إِحْفَاءُ"
    status: "رواية ابن منظور"
    note: "[@lisan، ج14 ص188]، أي يعلوننا بالقول، و«أي يقعون فينا»."
