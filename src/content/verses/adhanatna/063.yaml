first: "إِذْ تَمَنَّوْنَهُمْ غُرُورًا فَسَاقَتْـ"
second: "ـهُمْ إِلَيْكُمْ أُمْنِيَّةٌ أَشْرَاءُ"
meaning: "إذ تمنيتم لقاءهم اغترارًا بأنفسكم، فساقتهم إليكم أمنية بطرة. قال ابن الأَنْبارِيّ: «يقول: تمنيتم لقاءهم أشرا، أي بطرا، فساقتهم إليكم أمنية ذات أشر، أي ذات بطر» [@ibn-al-anbari، ص490]."
vocabulary:
  - term: "تَمَنَّوْنَهُمْ"
    text: "تتمنون لقاءهم، «يعنى تمنون عمرو بن المنذر وأصحابه الذين تجمعوا له» [@ibn-al-anbari، ص490]."
  - term: "غُرُورًا"
    text: "اغترارًا، أي ظنًّا كاذبًا بالقدرة عليهم."
  - term: "أَشْرَاءُ"
    text: "«ذات أشر، أي ذات بطر» [@ibn-al-anbari، ص490]؛ وفي اللسان: «هِيَ فَعْلاءُ مِنَ الأَشَر وَلَا فِعْلَ لَهَا» [@lisan، ج4 ص21]."
syntax:
  - "«وإذ صلة هداهم، وغرورا نصب على المصدر، وتمنونهم مرفوع في اللفظ بالتاء، وإذ مضافة إليه في التأويل» [@ibn-al-anbari، ص490]: أي «إذ» ظرف متعلق بـ«هداهم» في البيت السابق، مضاف إلى جملة «تمنونهم»."
  - "«أُمْنِيَّةٌ» فاعل «ساقتهم»، و«أشراء» نعت لها."
morphology:
  - "«تَمَنَّوْنَ» مضارع «تمنّى» على «تفعّل»، أصله «تتمنَّوْن» فحُذفت إحدى التاءين تخفيفًا."
  - "«أُمْنِيَّة» على «أُفْعولة»، أصلها «أُمْنُويَة» فقُلبت الواو ياء وأُدغمت."
  - "«أَشْرَاء» على «فَعْلاء» [@lisan، ج4 ص21]."
rhetoric:
  thesis: "الأمنية هي التي ساقت الهلاك."
  devices:
    - title: "المجاز العقلي في «فَسَاقَتْهُمْ إِلَيْكُمْ أُمْنِيَّةٌ»"
      text: "أسند السَّوق إلى الأمنية، والذي ساق الجيش هو الملك؛ لكن الحارِث يجعل تمني تَغْلِب هو الذي جاء بالجيش إليها، فهي التي جنت على نفسها."
    - title: "اختيار «أَشْرَاءُ»"
      text: "لم يقل «فرحة» بل «أشراء»؛ قال التِّبْرِيزِيّ: «والأشر والبطر لا يستعملان إلا في الشر، والفرح يستعمل في الخير والشر» [@tabrizi-ashr، ص277]. فالكلمة تحكم على الأمنية قبل أن يُعرف مصيرها."
  connection: "ثم يقول: لم يأتوكم على غرة، بل رأيتموهم في ضحى النهار."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "إِذْ تَمَنْنَوْ / نَهُمْ غُرُو / رَنْ فَسَاقَتْ = فاعلاتن / متفع لن / فاعلاتن — هُمْ إِلَيْكُمْ / أُمْنِيْيَتُنْ / أَشْرَاءُو = فاعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يكشف ما قالته تَغْلِب قبل الغزوة: «من عمرو ومن معه؟ إنما معه قراضبة قد جمعوا له من كُلّ مكان لقتالنا، فليتنا قد لقيناهم فيعلم عمرو كيف نحن وهو» [@ibn-al-anbari، ص490]. فالحارِث يذكّر الملك بأن تَغْلِب احتقرته وتمنت قتاله."
