first: "مَا جَزِعْنَا تَحْتَ الْعَجَاجَةِ إِذْ وَلْـ"
second: "ـلَتْ بِأَقْفَائِهَا وَحَرَّ الصِّلَاءُ"
meaning: "ما جزعنا تحت غبار المعركة حين ولّت كتيبة الجون بأعجازها، واشتدت نار الحرب. قال ابن الأَنْبارِيّ: «يقول: لم نجزع من هذه الكتيبة الخشناء» [@ibn-al-anbari، ص499]."
vocabulary:
  - term: "الْعَجَاجَةِ"
    text: "«الغبار الذي قد أثارته الخيل بسنابكها فارتفع كأنه دخان» [@ibn-al-anbari، ص499]."
  - term: "بِأَقْفَائِهَا"
    text: "«معناه بأعجازها» [@ibn-al-anbari، ص499]؛ «والأقفاء: جمع قفا كما تقول ندى وأنداء» [@ibn-al-anbari، ص499]."
  - term: "حَرَّ"
    text: "اشتد حرّه؛ «أراد وقدت النار» [@ibn-al-anbari، ص499]."
  - term: "الصِّلَاءُ"
    text: "النار وحرّها: «الصِّلاء والصِلَى: مصدر صليت بالنار أصلى إذا نالك حرها» [@zawzani، ص282]. وفي نسخة الشاملة من ابن الأَنْبارِيّ «الصَّلاء» بالفتح، وضبطناها بالكسر كما عند الزَّوْزَنِيّ والتِّبْرِيزِيّ، وكما في البيت 8."
syntax:
  - "«والصلاء رفع بفعله وهو حر» [@ibn-al-anbari، ص499]."
  - "«إِذْ» ظرف متعلق بـ«جزعنا»، و«وَحَرَّ الصِّلَاءُ» معطوف على «ولّت»."
morphology:
  - "«أَقْفَاء» جمع «قفا» على «أفعال»: «ولا تكاد العرب تقول في جمعه أقفية، وربما قالوه» [@ibn-al-anbari، ص499]."
  - "«حَرَّ» ماضٍ مضعّف: «يقال حر اليومُ يحر حرا، وحر المملوك يحر حرارا» [@ibn-al-anbari، ص499]."
  - "«الْعَجَاجَة» على «فَعالة»، واحدة العجاج."
rhetoric:
  thesis: "الثبات: نفي الجزع في أشد المواقف."
  devices:
    - title: "الاستعارة في «وَحَرَّ الصِّلَاءُ»"
      text: "جعل الحرب نارًا يُصطلى بها، ثم جعلها تحتدم. قال التِّبْرِيزِيّ: «شبَّه شدة الحرب بوقود النار» [@tabrizi-ashr، ص286]. وفي القصيدة كلمة «الصلاء» قبل ذلك في البيت 8: «هَيْهَاتَ مِنْكَ الصِّلَاءُ»، صلاء نار هند البعيدة؛ وهنا صلاء الحرب القريبة."
    - title: "الكناية في «إِذْ وَلَّتْ بِأَقْفَائِهَا»"
      text: "التولي بالأقفاء يعني الفرار: الكتيبة تُري عدوها مؤخر أعناقها. فلم يقل «هربوا»، بل وصف هيئة الهاربين."
  connection: "ثم يختم بالقرابة: وولدنا عمرو بن أم أناس."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "مَا جَزِعْنَا / تَحْتَلْ عَجَا / جَةِ إِذْ وَلْ = فاعلاتن / مستفع لن / فعلاتن — لَتْ بِأَقْفَا / ئِهَا وَحَرْ / رَصْ صِلَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]."
context: "آخر أبيات البلاء مع الملك. وفي «إذ ولت بأقفائها» قول آخر: «معناه انبعث ما كان فيها مثل الشيء ينفتق فيخرج ما فيه» [@ibn-al-anbari، ص500]."
variants:
  - reading: "...إِذْ جَا / ءُوا جَمِيعًا وَإِذْ تَلَظَّى الصِّلَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (إذ جاءوا جميعا وإذ تلظى الصلاء)» [@ibn-al-anbari، ص499]، وهي عند التِّبْرِيزِيّ [@tabrizi-ashr، ص286]."
  - reading: "...إِذْ وَلْـ / ـلَوْا شِلَالًا وَإِذْ تَلَظَّى الصِّلَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص282]."
