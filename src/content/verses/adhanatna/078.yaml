first: "وَفَكَكْنَا غُلَّ امْرِئِ الْقَيْسِ عَنْهُ"
second: "بَعْدَ مَا طَالَ حَبْسُهُ وَالْعَنَاءُ"
meaning: "وفككنا القيد عن امرئ القيس بن المنذر بعد أن طال حبسه وعناؤه. قال ابن الأَنْبارِيّ: «يعنى بامرئ القيس ابن المنذر بن ماء السماء، وهو أخو عمرو بن هند من أبيه، وكانت غسان أسرته يوم قُتل المنذر أبوه» [@ibn-al-anbari، ص497]."
vocabulary:
  - term: "غُلَّ"
    text: "القيد يُجعل في العنق أو اليد."
  - term: "امْرِئِ الْقَيْسِ"
    text: "امرؤ القيس بن المُنْذِر، أخو عَمْرو بن هند لأبيه [@ibn-al-anbari، ص497]، لا الشاعر."
  - term: "الْعَنَاءُ"
    text: "التعب والشدة."
syntax:
  - "«وبعد صلة فككنا، وما معناه المصدر، كأنه قال: بعد طول حبسه» [@ibn-al-anbari، ص497]: أي «ما» مصدرية تؤول مع الفعل بمصدر مضاف إليه."
  - "«وَالْعَنَاءُ» معطوف على «حبسه»، مرفوع بـ«طال»."
morphology:
  - "«فَكَكْنَا» ماضي «فكّ»، فُكّ إدغامه لاتصاله بضمير رفع متحرك."
  - "«حَبْس» مصدر «حبس» على «فَعْل»، والهاء بعده مشبعة في الوزن."
  - "«الْعَنَاء» مصدر «عني» على «فَعال»، همزته منقلبة عن ياء."
rhetoric:
  thesis: "الآية الثالثة: يد بَكْر على أسرة الملك نفسها."
  devices:
    - title: "الكناية في «فَكَكْنَا غُلَّ امْرِئِ الْقَيْسِ»"
      text: "فك الغل كناية عن الإنقاذ من الأسر كله، لا عن القيد وحده. والبيت يذكّر الملك بأن أخاه حُرّر بسيوف بَكْر، وهذه أقرب الأيادي إلى قلبه."
    - title: "المبالغة في «بَعْدَ مَا طَالَ حَبْسُهُ وَالْعَنَاءُ»"
      text: "يذكر طول الحبس ليعظم الفرج: كلما طال الأسر كان الفكاك أعظم منّة."
  connection: "ثم يقول: وأقدناه رب غسان بالمنذر."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَفَكَكْنَا / غُلْلَمْ رِئِلْ / قَيْسِ عَنْهُو = فعلاتن / مستفع لن / فاعلاتن — بَعْدَ مَا طَا / لَ حَبْسُهُو / وَلْ عَنَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر فصارت «فعلاتن» [@atiq، ص98–99]."
context: "أول الآية الثالثة (78–79). والخبر عند ابن الأَنْبارِيّ: «فأغارت بكر بن وائل مع عمرو بن هند على بعض الشام فقتلوا ملكا لغسان، واستنقذوا امرأ القيس، وأخذ عمرو ميسون بنت ذلك الملك التي ذكرها الحارث» [@ibn-al-anbari، ص497]؛ فالآية الثالثة تتصل بالبيت 60."
