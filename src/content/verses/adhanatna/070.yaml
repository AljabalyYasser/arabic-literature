first: "حَوْلَ قَيْسٍ مُسْتَلْئِمِينَ بِكَبْشٍ"
second: "قَرَظِيٍّ كَأَنَّهُ عَبْلَاءُ"
meaning: "جاءوا حول قيس لابسين الدروع، معهم سيد من اليمن كأنه في منعته هضبة بيضاء. قال ابن الأَنْبارِيّ: «يقول: هؤلاء بنو الشقيقة حول قيس بن معد يكرب. (مستلئمين) ، أي قد لبسوا الدروع» [@ibn-al-anbari، ص494]."
vocabulary:
  - term: "مُسْتَلْئِمِينَ"
    text: "«الاستلئام: لبس اللأمة وهي الدرع» [@zawzani، ص280]."
  - term: "كَبْشٍ"
    text: "«السيد، مستعار له بمنزلة القرم» [@zawzani، ص280]؛ «وأراد بالكبش الرئيس» [@tabrizi-ashr، ص281]."
  - term: "قَرَظِيٍّ"
    text: "«نسبة إلى البلاد التي ينبت فيها القرظ، وهي اليمن» [@ibn-al-anbari، ص494]؛ والقَرَظ في اللسان: «شَجَرٌ يُدْبَغُ بِهِ» [@lisan، ج7 ص454]."
  - term: "عَبْلَاءُ"
    text: "«هضبة بيضاء» [@ibn-al-anbari، ص494]؛ وفي اللسان: «الأَصمعي: الأَعْبَل والعَبْلاء حِجَارَةٌ بِيضٌ» [@lisan، ج11 ص420]."
syntax:
  - "«ومستلئمين نصب على الحال مما في جاءوا، وحول صلة جاءوا» [@ibn-al-anbari، ص494]."
  - "«بِكَبْشٍ» متعلق بـ«مستلئمين»، أي متحصنين بسيد."
morphology:
  - "«مُسْتَلْئِمِين» اسم فاعل من «استلأم» على «استفعل»، من «اللأمة»."
  - "«قَرَظِيّ» اسم منسوب إلى «القرظ»."
  - "«عَبْلَاء» على «فَعْلاء»، مؤنث «أعبل»."
rhetoric:
  thesis: "تعظيم العدو قبل ذكر هزيمته."
  devices:
    - title: "الاستعارة في «كَبْشٍ»"
      text: "الكبش يتقدم القطيع ويحميه، فاستعير لسيد القوم وقائدهم، كما يقول الزَّوْزَنِيّ [@zawzani، ص280]. والصورة تجعل جيش العدو قطيعًا يتبع كبشه."
    - title: "التشبيه في «كَأَنَّهُ عَبْلَاءُ»"
      text: "شبّه السيد بهضبة بيضاء في ضخامته ولمعان سلاحه وثباته؛ قال الزَّوْزَنِيّ: «كأنه في منعته وشوكته هضبة من الهضاب» [@zawzani، ص280]. وتعظيم الخصم هنا يعظّم من ردّه."
  connection: "ثم يقول: ومعهم جماعة من أبناء العواتك لا يكفها إلا ضرب يُظهر العظم."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "حَوْلَ قَيْسِنْ / مُسْتَلْئِمِي / نَ بِكَبْشِنْ = فاعلاتن / مستفع لن / فعلاتن — قَرَظِيْيِنْ / كَأَنْنَهُو / عَبْلَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يصف جيش العدو في الآية الأولى. وفي قيس خلاف: هو عند ابن الأَنْبارِيّ قيس بن مَعْدِيكَرِب أبو الأشعث [@ibn-al-anbari، ص493]، وعند الزَّوْزَنِيّ «من ملوك حمير» [@zawzani، ص280]، و«يروى عن أبي عمرو إنه قال: لا اعرف قيسا الذي ذكره في هذا البيت» [@ibn-al-anbari، ص494]."
