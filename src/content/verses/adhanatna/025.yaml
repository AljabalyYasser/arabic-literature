first: "وَكَأَنَّ الْمَنُونَ تَرْدِي بِنَا أَرْ"
second: "عَنَ جَوْنًا يَنْجَابُ عَنْهُ الْعَمَاءُ"
meaning: "وكأن المنية حين ترمينا ترمي جبلًا عظيمًا أسود، ينشق عنه السحاب، فلا تضرنا. قال ابن الأَنْبارِيّ: «ومعنى البيت: وكأن المنون ترمى بنا جبلا فلا تضرنا ولا تؤثر فينا كما لا تضر الجبل» [@ibn-al-anbari، ص463]."
vocabulary:
  - term: "الْمَنُونَ"
    text: "«المنية. وقال الأصمعي: المنون أيضا: الدهر، لأنه يذهب بمنة كل شيء. والمنة: القوة» [@ibn-al-anbari، ص460]."
  - term: "تَرْدِي"
    text: "ترمي؛ «ردى يردى رديا ورديانا، إذا رمى» [@ibn-al-anbari، ص461]، و«رديت فلانا بحجر أرديه رديا إذا رميته» [@lisan، ج14 ص318]."
  - term: "أَرْعَنَ"
    text: "«الجبل الذي له أنف يتقدم منه. ويقال للجيش العظيم أرعن لأنه يشبه بالجبل» [@ibn-al-anbari، ص461]."
  - term: "جَوْنًا"
    text: "«الأسود؛ وهو من الأضداد يكون الأبيض ويكون الأسود» [@ibn-al-anbari، ص461]."
  - term: "يَنْجَابُ"
    text: "«ينشق عنه الغيم ويتفرق عن هذا الجبل لطوله وارتفاعه» [@ibn-al-anbari، ص462]."
  - term: "الْعَمَاءُ"
    text: "«الغيم الرقيق» [@ibn-al-anbari، ص462]."
syntax:
  - "«والمنون اسم كأن، وتردى خبره» [@ibn-al-anbari، ص463]."
  - "«وينجاب موضعه رفع، ونصب في التأويل على معنى منجابا عنه العَماء» [@ibn-al-anbari، ص463]؛ أي الجملة صفة لـ«أرعن» أو حال منه."
  - "«أَرْعَنَ» مفعول به لـ«تردي»، و«جونًا» نعت له؛ و«بنا» عند الزَّوْزَنِيّ بمعنى «تردينا» [@zawzani، ص274]."
morphology:
  - "«أَرْعَن» على «أفعل»، صفة من «الرَّعْن» وهو «أنف الجبل الشاخص البارز» [@zawzani، ص274]."
  - "«يَنْجَاب» على «ينفعل» من «جاب» إذا شقّ: «قال الله عز وجل: (الذينَ جابوا الصَّخْر بالوادِ) ، أراد شقوا الصخر» [@ibn-al-anbari، ص462]."
  - "«الْمَنُون» على «فَعُول» من المَنّ وهو القطع والإضعاف."
rhetoric:
  thesis: "قومه جبل: المنية ترمي فلا تصيب شيئًا."
  devices:
    - title: "التمثيل"
      text: "ليس الشبه في لون أو شكل، بل في هيئة كاملة: رامٍ يرمي جبلًا عاليًا فلا يؤثر فيه، والسحاب ينشق عن قمته. وعبد القاهر الجُرْجانيّ يسمي التشبيه الذي يُنتزع من هيئة كاملة تمثيلًا، ويقول: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "التجريد في «تَرْدِي بِنَا أَرْعَنَ»"
      text: "لم يقل: ترمينا وكأننا جبل، بل جعل رميهم رميًا لجبل. ويفسره التِّبْرِيزِيّ بقولهم: «لو لقيت فلانا للقيك به الأسد، أي للقيك بلقائك إياه الأسد» [@tabrizi-ashr، ص262]. فهم الجبل نفسه."
    - title: "«يَنْجَابُ عَنْهُ الْعَمَاءُ»"
      text: "تفصيل يزيد الصورة عظمة: الجبل أعلى من السحاب، والسحاب «إذا بلغته انشقت حواليه» [@tabrizi-ashr، ص262]."
  connection: "ثم يكمل صفة الجبل: مكفهر على الحوادث لا تنقصه داهية."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَكَأَنْنَلْ / مَنُونَ تَرْ / دِي بِنَا أَرْ = فعلاتن / متفع لن / فاعلاتن — عَنَ جَوْنَنْ / يَنْجَابُ عَنْ / هُلْعَمَاءُو = فعلاتن / مستفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]. وكلمة «تَرْدِي» ساقطة من متن البيت في النسخة الرقمية التي نحيل إليها، ويكسر سقوطها الوزن، وهي في شرح ابن الأَنْبارِيّ نفسه: «والمنون اسم كأن، وتردى خبره» [@ibn-al-anbari، ص463]، وفي الزَّوْزَنِيّ [@zawzani، ص274] والتِّبْرِيزِيّ [@tabrizi-ashr، ص261]."
context: "ذروة الفخر في هذا المقطع: بَكْر جبل. وفي التِّبْرِيزِيّ وجه آخر: «وقيل: أن معنى (تردى بنا أرعن) ترمينا بشدائد مثل هذا الجبل في عظمها» [@tabrizi-ashr، ص262]؛ والأول قول ابن الأَنْبارِيّ والزَّوْزَنِيّ: «يريد أن نوائب الزمان وطوارق الحدثان لا تؤثر فيهم ولا تقدح في عزهم» [@zawzani، ص275]."
variants:
  - reading: "وَكَأَنَّ الْمَنُونَ تَرْدِي بِنَا أَصْـ / ـحَمَ عُصْمٍ يَنْجَابُ عَنْهُ الْعَمَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (وكأن المنون ترمى بنا أصحم عصم) . والأصحم: الوعل الذي يعلو بياضه سواده» [@ibn-al-anbari، ص462]، و«العصم: جمع أعصم» [@ibn-al-anbari، ص462]."
  - reading: "وَكَأَنَّ الْمَنُونَ تَرْدِي بِنَا أَعْـ / ـصَمَ صُمٍّ يَنْجَابُ عَنْهُ الْعَمَاءُ"
    status: "رواية ابن منظور"
    note: "[@lisan، ج14 ص318]. وعند ابن الأَنْبارِيّ «على أعصم صم»، «معناه على أعصم جبال صم» [@ibn-al-anbari، ص463]."
