first: "أَيُّهَا الشَّانِئُ الْمُبَلِّغُ عَنَّا"
second: "عِنْدَ عَمْرٍو وَهَلْ لِذَاكَ انْتِهَاءُ"
meaning: "يا من يبغضنا ويبلّغ عنا عند عَمْرو ما لا نعرفه، هل لهذا نهاية؟ قال ابن الأَنْبارِيّ: «يقول: أنت تشنؤنا وتشي بنا عند عمرو الملك، ومبلِّغ عنا ما لا نعرفه» [@ibn-al-anbari، ص491]."
vocabulary:
  - term: "الشَّانِئُ"
    text: "المبغض؛ وفي اللسان: «الشَّنَاءَةُ مِثْلُ الشَّناعةِ: البُغْضُ» [@lisan، ج1 ص101]. وهو عند ابن الأَنْبارِيّ «عمرو بن كلثوم التغلبي» [@ibn-al-anbari، ص491]."
  - term: "الْمُبَلِّغُ"
    text: "الذي ينقل الكلام إلى الملك ويشي به."
  - term: "انْتِهَاءُ"
    text: "«هل لذاك غاية ينتهي إليها» [@ibn-al-anbari، ص491]."
syntax:
  - "«والانتهاء رفع باللام المكسورة الزائدة» [@ibn-al-anbari، ص491]: أي «انتهاء» مبتدأ مؤخر، و«لذاك» خبر مقدم."
  - "«أَيُّهَا» منادى بحرف نداء محذوف، و«الشانئ» نعت له، و«المبلّغ» نعت ثان."
  - "«هَلْ» للاستفهام الإنكاري، أي لا نهاية لوشايتك."
morphology:
  - "«الشَّانِئ» اسم فاعل من «شنئ يشنأ» على «فاعل»، ولامه همزة."
  - "«الْمُبَلِّغ» اسم فاعل من «بلّغ» على «فعّل»."
  - "«انْتِهَاء» مصدر «انتهى» على «افتعال»، همزته منقلبة عن ياء."
rhetoric:
  thesis: "التفات إلى الخصم الحاضر قبل الالتفات إلى الملك."
  devices:
    - title: "الكناية عن الموصوف في «الشَّانِئُ الْمُبَلِّغُ»"
      text: "لا يسمي عمرو بن كلثوم، بل يصفه بصفتين: يبغض ويَشي. والسامعون يعرفونه، والتسمية بالصفة أشد من التسمية بالاسم لأنها حكم عليه."
    - title: "حسن الخروج في «عِنْدَ عَمْرٍو»"
      text: "يختم خطاب الخصم باسم الملك، ثم يبدأ البيت التالي بمدحه: «مَلِكٌ مُقْسِطٌ». فالانتقال من الهجاء إلى المدح يجري على كلمة واحدة. وفي ذلك يقول ابن رَشِيق: «ولطافة الخروج إلى المديح، سبب ارتياح الممدوح» [@ibn-rashiq، ج1 ص217]."
  connection: "ثم يصف عَمْرًا: ملك مقسط وأكمل من يمشي."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَيْيُهَشْ شَا / نِئُلْ مُبَلْ / لِغُ عَنْنَا = فاعلاتن / متفع لن / فعلاتن — عِنْدَ عَمْرِنْ / وَهَلْ لِذَا / كَنْتِهَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]."
context: "يعود الحارِث إلى خطاب البيت 21: «أَيُّهَا النَّاطِقُ الْمُرَقِّشُ عَنَّا / عِنْدَ عَمْرٍو وَهَلْ لِذَاكَ بَقَاءُ» [@ibn-al-anbari، ص453]، وبه يبدأ المقطع الأخير: الملك وآيات بَكْر عنده (65–82). وبين البيتين حجج القصيدة كلها، كأن الحارِث يعود إلى خصمه بعد أن عرضها."
variants:
  - reading: "أَيُّهَا الْكَاذِبُ الْمُبَلِّغُ عَنَّا"
    status: "رواية أخرى"
    note: "«ويروى: (أيها الكاذب المبلِّغ) ، ويروى: (المخبر) ، ويروى: (المرقش) ، ويروى: (المقرّش)» [@ibn-al-anbari، ص491]."
  - reading: "أَيُّهَا النَّاطِقُ الْمُبَلِّغُ عَنَّا"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص279]."
  - reading: "عِنْدَ عَمْرٍو وَهَلْ لَهُ إِبْقَاءُ"
    status: "رواية أخرى"
    note: "«ويروى (وهل له إبقاء) أي لا يبقى عليكم لما ألقيتم اليه» [@tabrizi-ashr، ص278]."
