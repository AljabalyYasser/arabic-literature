first: "وَطِرَاقًا مِنْ خَلْفِهِنَّ طِرَاقٌ"
second: "سَاقِطَاتٌ تُلْوِي بِهَا الصَّحْرَاءُ"
meaning: "وترى خلفها نعالًا من جلد، خُصفت طبقة فوق طبقة، سقطت من أخفاف الإبل، تذهب بها الصحراء وتبليها. قال ابن الأَنْبارِيّ: «أي تبلى هذه النعال فتسقط» [@ibn-al-anbari، ص444]. وكانت الإبل تُنعل بالجلد لتحمي أخفافها."
vocabulary:
  - term: "طِرَاقًا"
    text: "«مُطارقة نعال الإبل» [@tabrizi-ashr، ص255]، أي نعال خُصفت فيها طبقة على طبقة: «يريد: طورقت مرة بعد مرة. وقد قيل: الطراق: الغبار هاهنا» [@ibn-al-anbari، ص444]. وعند الزَّوْزَنِيّ: «الطراق: يريد بها أطباق نعلها» [@zawzani، ص271]."
  - term: "سَاقِطَاتٌ"
    text: "«قد سقطت من أرجلها» [@ibn-al-anbari، ص444]."
  - term: "تُلْوِي بِهَا"
    text: "«أي تذهب بها وتُفرقها» [@tabrizi-ashr، ص256]."
syntax:
  - "«ونصب طراقا لأنه نسق على المنين، كأنه قال: وترى طراقا. والطراق الثاني رفع بمن، وساقطات نعت لطراق» [@ibn-al-anbari، ص444]."
  - "وفي الضمير في «خلفهن» قولان: يعود على الإبل، أو على الطراق؛ وقال النحّاس إن جملة «من خلفهن طراق» لا تكون نعتًا لـ«طراقا» إذا عاد الضمير على الإبل، «لأنه لم يعد عليه منها شيء» [@tabrizi-ashr، ص256]."
morphology:
  - "«طِرَاق» مصدر «طارق» على «فِعال»: «ويقال أطرقت النعل، إذا ضربت واحدة بأخرى، إطراقا، وطارقت» [@ibn-al-anbari، ص444]."
  - "«سَاقِطَات» جمع «ساقطة» بالألف والتاء، نعت لـ«طراق» «لأنه وان كان لفظه لفظ الواحد فمعناه بمعنى الجمع» [@ibn-al-anbari، ص444]."
rhetoric:
  thesis: "الأثر بدل الفعل: لا يقول إنها تعدو بشدة، بل يريك نعالها ساقطة في الطريق."
  devices:
    - title: "الكناية"
      text: "سقوط النعال من الأخفاف كناية عن شدة العدو وطول الطريق، فقد أبلاها «قطع الصحراء ووطؤها» كما يقول الزَّوْزَنِيّ [@zawzani، ص272]. وفي الكناية يقول عبد القاهر الجُرْجانيّ إن المتكلم «لا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المجاز في «تُلْوِي بِهَا الصَّحْرَاءُ»"
      text: "أسند الإتلاف إلى الصحراء، وإنما تبلى النعال بالسير فيها. فالمجاز في الإسناد، وهو ما يسميه عبد القاهر المجاز الحكمي: «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]، كما قال من قبل «تلوي بها العلياء» في البيت 6."
    - title: "التكرار في «وَطِرَاقًا ... طِرَاقٌ»"
      text: "كرر الكلمة نفسها منصوبة ثم مرفوعة، فصار التكرار صورة للطبقات المتراكبة: طراق خلفه طراق."
  connection: "ثم يقول إنه يتلهى بهذه الناقة في الهواجر حين يتحير غيره."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَطِرَاقَنْ / مِنْ خَلْفِهِنْ / نَ طِرَاقُنْ = فعلاتن / مستفع لن / فعلاتن — سَاقِطَاتُنْ / تُلْوِي بِهَصْ / صَحْرَاءُو = فاعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "آخر ما يصف به سرعة الناقة: نعالها تتساقط من شدة العدو. فالناقة في هذه الأبيات تُعرف بآثارها: غبار ونعال. ومعناه عند الزَّوْزَنِيّ: «وترى خلفهما أطباق نعلها في أماكن مختلفة قد قطعها وأبطلها قطع الصحراء ووطؤها» [@zawzani، ص272]."
variants:
  - reading: "...سَاقِطَاتٌ أَوْدَتْ بِهَا الصَّحْرَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (أودت بها الصحراء)» [@ibn-al-anbari، ص444]."
  - reading: "...سَاقِطَاتٌ أَلْوَتْ بِهَا الصَّحْرَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«ألوى بالشيء: أفناه وأبطله» [@zawzani، ص271]."
