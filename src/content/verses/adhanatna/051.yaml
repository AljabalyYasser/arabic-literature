first: "عَنَنًا بَاطِلًا وَظُلْمًا كَمَا تُعْـ"
second: "ـتَرُ عَنْ حَجْرَةِ الرَّبِيضِ الظِّبَاءُ"
meaning: "تتهموننا اعتراضًا باطلًا وظلمًا، كما كان الرجل يذبح الظباء عن غنمه في نذره. قال ابن الأَنْبارِيّ: «فقال الحارث: أنتم تأخذوننا بذنوب غيرنا كما ذبح أولئك الظباء عن غنمهم» [@ibn-al-anbari، ص484]."
vocabulary:
  - term: "عَنَنًا"
    text: "«معناه اعتراضا» [@ibn-al-anbari، ص484]؛ وفي اللسان: «وعَنَّ يَعِنُّ ويَعُنُّ عَنّاً وعُنوناً واعْتَنَّ: اعتَرَضَ وعَرَض ... وَالِاسْمُ العَنَن» [@lisan، ج13 ص290]."
  - term: "تُعْتَرُ"
    text: "تُذبح عتيرةً: «العتر: الذبح. والعتيرة: الذبيحة، وهي ذبيحة كانوا يذبحونها في رجب لآلهتهم، يسمونها الرجبية» [@ibn-al-anbari، ص484]."
  - term: "حَجْرَةِ"
    text: "«الحظيرة تتخذ للغنم» [@ibn-al-anbari، ص484]، أو الناحية؛ وفي اللسان: «والحَجرَةُ: النَّاحِيَةُ، وَمِنْهُ قَوْلُ الحرث بْنِ حلِّزَةَ»، وأنشد البيت [@lisan، ج4 ص169]."
  - term: "الرَّبِيضِ"
    text: "«جماعة الغنم» [@ibn-al-anbari، ص484]."
syntax:
  - "«عَنَنًا» مفعول مطلق لفعل محذوف، أي: تعنّون عَنَنًا، و«باطلًا» نعت له، و«ظلمًا» معطوف عليه."
  - "في «كَمَا تُعْتَرُ» يقول ابن الأَنْبارِيّ: «والكاف نصب له على النعت، وما مصدر» [@ibn-al-anbari، ص485]، أي اعتراضًا مثل عتر الظباء."
  - "«الظِّبَاءُ» نائب فاعل «تُعتر»، مؤخر إلى القافية."
morphology:
  - "«عَنَن» مصدر «عنّ يعِنّ» على «فَعَل»."
  - "«تُعْتَرُ» مضارع مبني للمجهول من «عتر يعتِر»."
  - "«الرَّبِيض» على «فَعِيل»، اسم جمع للغنم الرابضة."
rhetoric:
  thesis: "تمثيل بالشعيرة: يُذبح عن الذنب من لا ذنب له."
  devices:
    - title: "التمثيل في «كَمَا تُعْتَرُ عَنْ حَجْرَةِ الرَّبِيضِ الظِّبَاءُ»"
      text: "كان الرجل ينذر إن بلغت غنمه مئة أن يذبح عن كل عشر منها شاة في رجب، فإذا بلغت مئة «وبخل أن يذبح من غنمه شيئا، صاد الظباء وذبحها عن غنمه؛ ليوفى بها نذره» [@ibn-al-anbari، ص484]. فالظباء لا علاقة لها بالنذر، تُذبح لأن صاحب الغنم بخل؛ وكذلك تَغْلِب تأخذ بَكْرًا بذنب لا علاقة لها به. والشبه لا يُرى بالعين، بل يُحصَّل بالتأمل في القصة كلها، وهو ما يسميه عبد القاهر الجُرْجانيّ تمثيلًا: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "الإيجاز في «عَنَنًا بَاطِلًا وَظُلْمًا»"
      text: "ثلاث كلمات منصوبة بلا فعل ظاهر، تحكم على الأسئلة السابقة كلها: هي اعتراض، وهو باطل، وهو ظلم."
  connection: "ثم ينتقل من نفي الجنايات إلى ذكر من أصاب تَغْلِب حقًّا: ثمانون من تميم."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "عَنَنَنْ بَا / طِلَنْ وَظُلْ / مَنْ كَمَا تُعْ = فعلاتن / متفع لن / فاعلاتن — تَرُ عَنْ حَجْ / رَتِرْ رَبِي / ضِظْ ظِبَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "خاتمة أبيات جنايات غيرنا، وفيه الحكم على الأسئلة كلها. والعادة التي يشير إليها البيت يرويها اللسان: كان الرجل يقول في الجاهلية: «إِن بَلَغَتْ إِبلي مِائَةً عَتَرْت عَنْهَا عَتِيرةً، فإِذا بَلَغَتْ مِائَةً ضَنَّ بِالْغَنَمِ فَصَادَ ظَبْيًا فَذَبَحَهُ» [@lisan، ج4 ص537]، ويستشهد بهذا البيت. والبيت عند الزَّوْزَنِيّ قبل البيت 44 [@zawzani، ص284]."
variants:
  - reading: "عَبَثًا بَاطِلًا شُدُوخًا كَمَا تُعْـ"
    status: "رواية أخرى"
    note: "«ويروى: (عبثا باطلا شدوخا) ، أي يشدخ الناس بشدته» [@ibn-al-anbari، ص485]."
  - reading: "عَنَتًا بَاطِلًا وَظُلْمًا كَمَا يُعْـ"
    status: "رواية في اللسان"
    note: "أنشده كذلك في مادة «ربض» [@lisan، ج7 ص150]."
