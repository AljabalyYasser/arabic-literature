first: "وَفَعَلْنَا بِهِمْ كَمَا عَلِمَ اللَّـ"
second: "ـهُ وَمَا إِنْ لِلْحَائِنِينَ دِمَاءُ"
meaning: "وفعلنا بهم ما علمه الله من قتل عظيم، ولا يُطلب بدم من جاء إلى حتفه. قال ابن الأَنْبارِيّ: «معناه: قتلنا منهم قتلا عظيما شديدا قد علمه الله تبارك وتعالى» [@ibn-al-anbari، ص495]."
vocabulary:
  - term: "الْحَائِنِينَ"
    text: "الهالكين أو المتعرضين للهلاك: «من عصى فقد حان أجله؛ وذلك إنه يجيء فيخاطر بنفسه، وإذا قتل فليس له من يطلب بدمه» [@ibn-al-anbari، ص495]؛ وفي اللسان: «وَكُلُّ شَيْءٍ لَمْ يُوَفَّق للرَّشاد فَقَدْ حانَ» [@lisan، ج13 ص136]."
  - term: "دِمَاءُ"
    text: "أي ثأر يُطلب: لا دم يُقتص له."
syntax:
  - "«والكاف نصب بفعلنا، وان معناها الجحد، وهو مؤكدة لما» [@ibn-al-anbari، ص496]: أي «كما» في موضع المفعول، و«إنْ» بعد «ما» زائدة تؤكد النفي. وكُتبت في نسخة الشاملة «أن»، والصواب «إنْ» كما عند الزَّوْزَنِيّ [@zawzani، ص281]."
  - "«دِمَاءُ» مبتدأ مؤخر، و«للحائنين» خبر مقدم."
morphology:
  - "«الْحَائِنِين» جمع «حائن»، اسم فاعل من «حان يحين»، والهمزة فيه منقلبة عن ياء."
  - "«دِمَاء» جمع «دم» على «فِعال»، وأصل «دم» «دَمَيٌ»."
rhetoric:
  thesis: "ما لا يوصف يُترك لعلم الله."
  devices:
    - title: "الإبهام في «كَمَا عَلِمَ اللَّهُ»"
      text: "لا يصف القتل، بل يحيله إلى علم الله، فيصير أعظم من أن يُحصى. قال الزَّوْزَنِيّ: «وفعلنا بهم فعلًا بليغًا لا يحيط به علمًا إلا الله» [@zawzani، ص281]. وهذا من الحذف الذي يقول فيه عبد القاهر الجُرْجانيّ: «فإنكَ ترى به تَرْكَ الذِكْر، أَفْصَحَ من الذكْرِ» [@dalail، ص146]."
    - title: "الحكمة في «وَمَا إِنْ لِلْحَائِنِينَ دِمَاءُ»"
      text: "عجز يصلح مثلًا: من جاء إلى حتفه فلا ثأر له. وبه يقطع الحارِث أي مطالبة بدماء من قتلتهم بَكْر يومئذ."
  connection: "ثم ينتقل إلى الآية الثانية: ثم حُجْرًا، أعني ابن أم قطام."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَفَعَلْنَا / بِهِمْ كَمَا / عَلِمَلْ لَا = فعلاتن / متفع لن / فعلاتن — هُ وَمَا إِنْ / لِلْحَائِنِي / نَ دِمَاءُو = فعلاتن / مستفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وأول العجز وآخر العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "آخر أبيات الآية الأولى. وفي «للحائنين» قول آخر عند ابن الأَنْبارِيّ: «من قدّر الله تعالى عليه الحين فليس له بقاء» [@ibn-al-anbari، ص496]."
variants:
  - reading: "...وَمَا إِنْ لِلْحَائِنِينَ ذِمَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (لحائنين ذماء) بذال معجمة؛ فالذماء: بقية الروح» [@ibn-al-anbari، ص496]."
