first: "آنَسَتْ نَبْأَةً وَأَفْزَعَهَا الْقُنْـ"
second: "ـنَاصُ عَصْرًا وَقَدْ دَنَا الْإِمْسَاءُ"
meaning: "أحست هذه النعامة صوتًا خفيًّا، وأفزعها الصيادون عشيًّا وقد قرب المساء، فطارت تعدو مسرعة. قال ابن الأَنْبارِيّ: «يقول: فلما رأتهم طارت على وجهها فزعا» [@ibn-al-anbari، ص442]."
vocabulary:
  - term: "آنَسَتْ"
    text: "«أحسست» [@ibn-al-anbari، ص442]."
  - term: "نَبْأَةً"
    text: "«الصوت الخفي لا يدري من أين هو» [@ibn-al-anbari، ص442]."
  - term: "الْقُنَّاصُ"
    text: "«يعنى الصياد. والقنص: الصيد» [@ibn-al-anbari، ص442]؛ وهو «جمع قانص» [@zawzani، ص271]."
  - term: "عَصْرًا"
    text: "«معناه عشيا» [@ibn-al-anbari، ص442]."
syntax:
  - "«وفاعل آنست مضمر فيه من ذكر النعامة، والنبأة منصوبة به، وعصرا منصوب على الوقت، والواو في وقد واو الحال» [@ibn-al-anbari، ص443]."
  - "«والإمساء رفع بدنا، وهو مصدر أمسى» [@ibn-al-anbari، ص443]، وجملة «وقد دنا الإمساء» حال."
morphology:
  - "«آنَسَتْ» على «أَفْعَل» من الأُنس: «والإيناس: النظر وإبصارك الشيء» [@ibn-al-anbari، ص442]."
  - "«الْقُنَّاص» جمع «قانص» على «فُعّال»."
  - "«الْإِمْسَاء» مصدر «أمسى» على «إفعال»."
rhetoric:
  thesis: "ثلاثة أسباب للخوف في بيت واحد: صوت لا يُعرف مصدره، وصيادون، وليل قادم. فالنعامة تعدو أسرع ما يكون."
  devices:
    - title: "الاستطراد"
      text: "بدأ بالناقة ثم انصرف إلى النعامة المشبّه بها، فوصف خوفها وعدوها كأنها هي الموصوفة. والاستطراد: أن يخرج الشاعر من الموصوف إلى ما يتصل به ثم يعود. والمقصود في النهاية سرعة الناقة، كما يقول الزَّوْزَنِيّ [@zawzani، ص271]."
    - title: "التدرج في الوقت"
      text: "«عَصْرًا وَقَدْ دَنَا الْإِمْسَاءُ»: ذكر العشي، ثم قال إن المساء قد قرب، فالوقت يضيق والفراخ بعيدة. فالزمن نفسه يستعجل النعامة."
  connection: "ثم يعود إلى الناقة فيصف ما تثيره خلفها من غبار."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "ءَانَسَتْ نَبْ / أَتَنْ وَأَفْ / زَعَهَلْ قُنْ = فاعلاتن / متفع لن / فعلاتن — نَاصُ عَصْرَنْ / وَقَدْ دَنَلْ / إِمْسَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يكمل صورة النعامة، ويجمع لها أسباب السرعة. قال الزَّوْزَنِيّ: «لما شبه ناقته بالنعامة بسيرها بالغ في وصف النعامة بالإسراع في السير بأنها تَئُوب إلى أولادها مع إحساسها بالصيادين وقرب المساء، فإن هذه الأسباب تزيدها إسراعًا في سيرها» [@zawzani، ص271]."
variants:
