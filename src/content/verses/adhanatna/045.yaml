first: "أَمْ عَلَيْنَا جَرَّى حَنِيفَةَ أَوْ مَا"
second: "جَمَّعَتْ مِنْ مُحَارِبٍ غَبْرَاءُ"
meaning: "أم علينا جناية بني حَنِيفة، أو جناية ما جمعت الصعاليك من بني مُحارِب؟ قال ابن الأَنْبارِيّ: «معناه: هل علينا في العهود والمواثيق التي أخذتموها علينا أن تأخذونا بذنوب حنيفة وما أذنبت لصوص محارب» [@ibn-al-anbari، ص480]."
vocabulary:
  - term: "جَرَّى"
    text: "الجناية: «الجراء والْجَرَّى بالمد والقصر: الجناية» [@zawzani، ص284]."
  - term: "حَنِيفَةَ"
    text: "قبيلة، ومنها شَمِر بن عَمْرو الحَنَفِيّ الذي قتل المُنْذِر بن ماء السماء في الخبر الذي يرويه ابن الأَنْبارِيّ (انظر وظيفة البيت). وفي نسخة الشاملة «حِنيفة» بكسر الحاء، والصواب الفتح كما ضبطها التِّبْرِيزِيّ [@tabrizi-ashr، ص269]."
  - term: "غَبْرَاءُ"
    text: "«الصعاليك، وهم الفقراء» [@ibn-al-anbari، ص480]؛ «ويقال إنما قيل للفقراء بني غبراء، لأن الفقر ألصقهم بالأرض. والغبراء: الأرض» [@ibn-al-anbari، ص481]. واستشهد ابن الأَنْبارِيّ بقول طَرَفة: «رَأَيْتُ بَنِي غَبْرَاءَ لَا يُنْكِرُونَنِي» [@ibn-al-anbari، ص480]."
  - term: "مُحَارِبٍ"
    text: "قبيلة، وصعاليكها في عبارة ابن الأَنْبارِيّ «لصوص محارب» [@ibn-al-anbari، ص480]."
syntax:
  - "«وجرى رفع بعلى، وما نسق على جرى، وغبراء رفع بفعلها» [@ibn-al-anbari، ص481]: أي «جَرَّى» مبتدأ مؤخر خبره «علينا»، و«ما» اسم موصول معطوف عليه، و«غبراء» فاعل «جمّعت»."
  - "«أَمْ» تعطف هذا السؤال على السؤال السابق، و«أَوْ» تعطف «ما جمّعت» على «جَرَّى حنيفة» داخل السؤال الواحد."
  - "«مِنْ مُحَارِبٍ» بيان لـ«ما»."
morphology:
  - "«جَرَّى» مصدر مقصور على «فَعْلَى»، ويُمد كما قال الزَّوْزَنِيّ [@zawzani، ص284]."
  - "«غَبْرَاء» على «فَعْلاء»، صفة من الغُبْرة، جُعلت اسمًا للفقراء."
  - "«جَمَّعَتْ» على «فعّل» للتكثير: جمعت من هنا وهناك."
rhetoric:
  thesis: "السؤال الثاني: جناية حَنِيفة ولصوص مُحارِب ليست على بَكْر."
  devices:
    - title: "الكناية في «غَبْرَاءُ»"
      text: "سمى الفقراء باسم الأرض الغبراء، لأن الفقر ألصقهم بها كما يقول ابن الأَنْبارِيّ [@ibn-al-anbari، ص481]: فالكلمة لا تذكر الفقر، بل تذكر لازمه، وهو التراب والغبار. وهذا ما يحده عبد القاهر الجُرْجانيّ في الكناية: «لا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "التحقير في «مَا جَمَّعَتْ»"
      text: "قال «ما» ولم يقل «من»، فجعل جموع الصعاليك أشياء مجمّعة لا رجالًا؛ وفي هذا تحقير لمن تحمّل تَغْلِب بَكْرًا ذنبه."
  connection: "ثم يسأل: أم جنايا بني عتيق؟"
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَمْ عَلَيْنَا / جَرْرَى حَنِي / فَةَ أَوْ مَا = فاعلاتن / مستفع لن / فعلاتن — جَمْمَعَتْ مِنْ / مُحَارِبِنْ / غَبْرَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "في خبر حَنِيفة يروي ابن الأَنْبارِيّ أن شَمِر بن عَمْرو الحَنَفِيّ خرج مع جيش المُنْذِر بن ماء السماء حين غزا غَسّان، ثم لحق بالحارِث بن جَبَلة الغَسّانيّ، وعاد إلى المنذر برسالة صلح، فلما غفل أهل العسكر «حمل الحنفي عليه بالسيف فضرب يافوخه وسال دماغه، ومات من الضربة مكانه» [@ibn-al-anbari، ص480]. فالسؤال ثقيل في مجلس عَمْرو بن هند: قاتل أبيه في هذه الرواية حنفي، والحارِث يتبرأ من جنايته. والبيت عند الزَّوْزَنِيّ في موضع آخر، بعد البيت 54 [@zawzani، ص285]."
