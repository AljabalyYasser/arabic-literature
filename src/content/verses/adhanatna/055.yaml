first: "وَأَتَوْهُمْ يَسْتَرْجِعُونَ فَلَمْ تَرْ"
second: "جِعْ لَهُمْ شَامَةٌ وَلَا زَهْرَاءُ"
meaning: "وجاء بنو رِزاح يطلبون ما أُخذ منهم، فلم يرجع إليهم شيء، لا ناقة سوداء ولا بيضاء. قال ابن الأَنْبارِيّ: «أي رجعوا خائبين ولم يرجعوا بناقة سوداء ولا بيضاء» [@ibn-al-anbari، ص486]."
vocabulary:
  - term: "يَسْتَرْجِعُونَ"
    text: "يطلبون أن يُرد إليهم ما أُخذ."
  - term: "شَامَةٌ"
    text: "«والشامة سوداء والزهراء بيضاء» [@ibn-al-anbari، ص486]؛ وفي اللسان: «وَيُقَالُ: مَا لَهُ شامةٌ وَلَا زَهْراءُ يَعْنِي ناقةٌ سَوْدَاءَ وَلَا بَيْضَاءَ» [@lisan، ج12 ص329]."
  - term: "زَهْرَاءُ"
    text: "البيضاء، كما في الشرحين السابقين."
syntax:
  - "«والشامة رفع بيرجع، والزهراء نسق عليها» [@ibn-al-anbari، ص486]."
  - "«يَسْتَرْجِعُونَ» حال، وهي عند التِّبْرِيزِيّ «في موضع حال مُقدرة» [@tabrizi-ashr، ص275]، أي جاءوا مقدّرين أن يسترجعوا."
morphology:
  - "«يَسْتَرْجِعُونَ» مضارع «استرجع» على «استفعل»، والسين والتاء للطلب."
  - "«شَامَة» على «فَعْلة» من «شيم»، وألفها منقلبة عن ياء."
  - "«زَهْرَاء» على «فَعْلاء»، مؤنث «أزهر»."
rhetoric:
  thesis: "الخيبة التامة: لم يُرجع إليهم شيء."
  devices:
    - title: "الطباق في «شَامَةٌ وَلَا زَهْرَاءُ»"
      text: "سوداء وبيضاء: لونان متضادان يستغرقان ما بينهما، فنفيهما معًا نفي لكل شيء. وهو أبلغ من أن يقول: لم يرجع إليهم شيء، لأنه يُري السامع الإبل نفسها بألوانها."
    - title: "الجناس في «يَسْتَرْجِعُونَ فَلَمْ تَرْجِعْ»"
      text: "الطلب والمطلوب من جذر واحد في شطر واحد: طلبوا الرجوع فلم يكن رجوع؛ فاللفظ يتكرر والطلب يخيب."
  connection: "ثم يقول: ثم رجعوا منهم بداهية تقصم الظهر."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَأَتَوْهُمْ / يَسْتَرْجِعُو / نَ فَلَمْ تَرْ = فعلاتن / مستفع لن / فعلاتن — جِعْ لَهُمْ شَا / مَتُنْ وَلَا / زَهْرَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "بعد الغارة محاولة الاسترداد، وهي تخيب. ويقول الزَّوْزَنِيّ في هذه الأبيات: «هذه الأبيات كلها تعيير لهم وإبانة عن تعديهم وطلبهم المحال؛ لأن مؤاخذة الإنسان بذنب غيره ظلم صراح» [@zawzani، ص285]."
variants:
  - reading: "ثُمَّ آبُوا يَسْتَرْجِعُونَ فَلَمْ تَرْ"
    status: "رواية أخرى"
    note: "«ويروى: (ثم آبوا يسترجعون)» [@ibn-al-anbari، ص486]."
  - reading: "ثُمَّ جَاءُوا يَسْتَرْجِعُونَ فَلَمْ تَرْ"
    status: "رواية الزَّوْزَنِيّ والتِّبْرِيزِيّ"
    note: "[@zawzani، ص285] [@tabrizi-ashr، ص275]."
  - reading: "...شَامَةٌ وَلَا غَبْرَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (ولا غبراء) ، أي ما ليس بخالص البياض» [@ibn-al-anbari، ص486]."
  - reading: "وَأَتَوْنَا يَسْتَرْجِعُونَ فَلَمْ تُرْ / جَعْ لَهُمْ شَامَةٌ وَلَا زَهْرَاءُ"
    status: "رواية اللسان"
    note: "«وأتونا»، و«فلم تُرْجَعْ» رواية فيه [@lisan، ج12 ص329]."
