first: "فَجَبَهْنَاهُمُ بِضَرْبٍ كَمَا يَخْـ"
second: "ـرُجُ مِنْ خُرْبَةِ الْمَزَادِ الْمَاءُ"
meaning: "فرددناهم بضرب يخرج منه الدم كما يخرج الماء من فم المزادة. قال ابن الأَنْبارِيّ عن الأَصْمَعِيّ: «فشبه خروج الدم ونزوه من الجرح بخروج الماء من فم تلك العزلاء» [@ibn-al-anbari، ص495]."
vocabulary:
  - term: "جَبَهْنَاهُمُ"
    text: "«الجبه: أسوأ الرد» [@tabrizi-ashr، ص281]؛ وعند الزَّوْزَنِيّ: «الجبه: أعنف الردع» [@zawzani، ص281]."
  - term: "خُرْبَةِ"
    text: "«الخربة هاهنا: عزلاء المزادة، وهو مسيل الماء منها» [@ibn-al-anbari، ص495]."
  - term: "الْمَزَادِ"
    text: "«جمع مزادة. والمزادة والقربة سواء» [@ibn-al-anbari، ص495]."
syntax:
  - "«والكاف موضعها نصب ومعناها المصدر» [@ibn-al-anbari، ص495]: أي «كَمَا يَخْرُجُ» نعت لمصدر محذوف: ضربًا يخرج منه الدم خروجًا مثل خروج الماء."
  - "«الْمَاءُ» فاعل «يخرج»، مؤخر إلى القافية."
morphology:
  - "«جَبَهْنَا» ماضي «جبه» مسندًا إلى «نا»، والميم في «هُمُ» مشبعة في الوزن."
  - "«خُرْبَة» على «فُعْلة»، «تجمع خربا» [@ibn-al-anbari، ص495]."
  - "«الْمَزَاد» جمع «مزادة» على «مَفْعَلة» من «زاد»."
rhetoric:
  thesis: "الدم يتدفق كالماء: صورة الضرب من أثره."
  devices:
    - title: "التشبيه في «كَمَا يَخْرُجُ مِنْ خُرْبَةِ الْمَزَادِ الْمَاءُ»"
      text: "تشبيه حسي بالحركة: الدم يندفع من الجرح كما يندفع الماء من فم القربة. ويقول عبد القاهر الجُرْجانيّ: «اعلم أن مما يزداد به التشبيه دقة وسحرًا أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]؛ فالشبه هنا ليس في اللون، بل في هيئة الاندفاع."
    - title: "الاستعارة في «فَجَبَهْنَاهُمُ»"
      text: "الجبه من الجبهة: كأنهم ضربوهم في وجوههم وهم مقبلون، فرُدّوا من حيث جاءوا. فالفعل وحده يصف المواجهة."
  connection: "ثم يقول: وحملناهم على حزم ثهلان هاربين."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَجَبَهْنَا / هُمُو بِضَرْ / بِنْ كَمَا يَخْ = فعلاتن / متفع لن / فاعلاتن — رُجُ مِنْ خُرْ / بَتِلْ مَزَا / دِلْ مَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "ردّ بَكْر لجيش الشقيقة. وفي الروايات تبادل بين فعلي هذا البيت والبيت 77: «ويروى: (فرددناهم) والمعنيان متقاربان» [@ibn-al-anbari، ص495]، وعند الزَّوْزَنِيّ «فرددناهم» هنا و«وَجَبَهْنَاهُمُ» هناك."
variants:
  - reading: "فَرَدَدْنَاهُمُ بِطَعْنٍ كَمَا يَخْـ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (فرددناهم)» [@ibn-al-anbari، ص495]، و«بطعن» عند الزَّوْزَنِيّ [@zawzani، ص280]."
