first: "وَاعْلَمُوا أَنَّنَا وَإِيَّاكُمُ فِي"
second: "مَا اشْتَرَطْنَا يَوْمَ اخْتَلَفْنَا سَوَاءُ"
meaning: "واعلموا أن الشروط التي تعاقدنا عليها يوم اختلفنا تلزمنا وتلزمكم سواء: ما جناه أحد من العرب على فريق أُخذ به الفريق الآخر. قال ابن الأَنْبارِيّ: «كان من أشراطنا وتحالفنا إنه لا يجنى أحد من العرب اليكم جناية ولا إلى غيركم إلا كانت تلك الجناية علينا ونحن المأخوذون بها دون أصحابها، واشترطتم علينا مثل ذلك» [@ibn-al-anbari، ص479]."
vocabulary:
  - term: "اشْتَرَطْنَا"
    text: "من الشرط، وهو ما يُلزم به المتعاهدان أنفسهما؛ والمقصود شروط حلف ذي المَجاز (البيت 41)."
  - term: "اخْتَلَفْنَا"
    text: "تنازعنا ثم تعاقدنا. وفسرها الزَّوْزَنِيّ بالتعاقد: «في تلك الشرائط التي أوثقناها يوم تعاقدنا مستوون» [@zawzani، ص284]."
  - term: "سَوَاءُ"
    text: "مستوون، لا يلزم أحدَ الفريقين ما لا يلزم الآخر."
syntax:
  - "«وان كفت من اسم العلم وخبره» [@ibn-al-anbari، ص479]: أي «أنّ» واسمها وخبرها سدّت مسدّ مفعولي «اعلموا»."
  - "«إِيَّاكُمُ» ضمير منفصل معطوف على «نا» اسم «أنّ»، و«سَوَاءُ» خبر «أنّ»، و«فِي مَا اشْتَرَطْنَا» متعلق بـ«سواء»."
  - "«يَوْمَ» ظرف زمان منصوب، مضاف إلى جملة «اختلفنا»."
morphology:
  - "«اشْتَرَطْنَا» ماضي «اشترط» على «افتعل»، من «الشَّرْط»."
  - "«اخْتَلَفْنَا» على «افتعل» من «خلف»، والافتعال هنا للمشاركة: اختلف بعضنا مع بعض."
  - "«إِيَّاكُمُ» ضمير نصب منفصل، جاء منفصلًا لأنه معطوف على اسم «أنّ» بالواو، والميم مشبعة في الوزن."
rhetoric:
  thesis: "قاعدة المساواة: الشرط الذي يلزم بَكْرًا يلزم تَغْلِب."
  devices:
    - title: "التوكيد في «وَاعْلَمُوا أَنَّنَا»"
      text: "يبدأ بفعل العلم ثم بـ«أنّ» المؤكدة، فيضع القاعدة أمام الملك قبل أن يبدأ أسئلته: هذا أمر يجب أن يُعلم، لا أن يُناقش."
    - title: "المقابلة في «أَنَّنَا وَإِيَّاكُمُ ... سَوَاءُ»"
      text: "يجمع الفريقين في جملة واحدة ثم يختمها بـ«سواء» في القافية، فتقع كلمة المساواة في أقوى موضع من البيت. وبها يمهد للأسئلة التالية: إن كانت جنايات الناس تلزمنا فهي تلزمكم كذلك."
  connection: "ثم يبدأ سلسلة الأسئلة: أعلينا جناح كِنْدة؟"
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَعْلَمُو أَنْ / نَنَا وَإِيْ / يَاكُمُو فِي = فاعلاتن / متفع لن / فاعلاتن — مَشْتَرَطْنَا / يَوْمَخْتَلَفْ / نَا سَوَاءُو = فاعلاتن / مستفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن» [@atiq، ص98–99]."
context: "آخر أبيات العهد (40–43)، وفيه الشرط الذي تقوم عليه الأسئلة بعده. قال التِّبْرِيزِيّ: «إنما اشترطنا أن يكون الجنايات علينا وعليكم، فلم تلزموننا وحدنا ذلك؟» [@tabrizi-ashr، ص269]. فالحارِث لا ينكر الشرط، بل يطالب بأن يُطبق على الفريقين. وهذا البيت عند الزَّوْزَنِيّ مع الأبيات 40–42 بعد آخر بيت عندنا [@zawzani، ص283]."
variants:
