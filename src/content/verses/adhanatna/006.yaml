first: "وَبِعَيْنَيْكَ أَوْقَدَتْ هِنْدٌ النَّا"
second: "رَ أَخِيرًا تُلْوِي بِهَا الْعَلْيَاءُ"
meaning: "وبمرأى من عينيك أوقدت هند نارها آخرَ عهدك بها، والأرض العالية ترفع تلك النار وتلوّح بها لك. قال ابن الأَنْبارِيّ: «معناه وبرأي عينيك أوقدت هند النار»، و«أخبر إنه رأى نارها عند آخر عهده بها» [@ibn-al-anbari، ص437]."
vocabulary:
  - term: "وَبِعَيْنَيْكَ"
    text: "بمرأى عينيك، أي وأنت تراها؛ «يقال: هو مني بمرأى ومسمع أي حيث أراه وأسمعه» [@khizana، ج3 ص416]."
  - term: "هِنْدٌ"
    text: "«وهند ممن كان يواصل» [@ibn-al-anbari، ص437]."
  - term: "أَخِيرًا"
    text: "في آخر عهده بها [@ibn-al-anbari، ص437]."
  - term: "تُلْوِي بِهَا"
    text: "«معناه ترفعها وتضيئها له» [@ibn-al-anbari، ص437]؛ «ألوت الناقة بذنبها، إذا رفعته» [@ibn-al-anbari، ص437]."
  - term: "الْعَلْيَاءُ"
    text: "«المكان المرتفع من الأرض. وإنما يريد العالية، وهي الحجاز» [@ibn-al-anbari، ص437]."
syntax:
  - "«وَبِعَيْنَيْكَ» جار ومجرور متعلق بـ«أوقدت»، قُدّم على الفعل."
  - "«وهند ترتفع بأوقدت أيضا. وأخيرا نصب على الوقت أراد وقتا آخرا» [@ibn-al-anbari، ص437]؛ أي «أخيرًا» ظرف زمان."
  - "«وتلوى موضعه رفع في اللفظ ... والعلياء ترتفع بتلوى، والباء صلة تلوى» [@ibn-al-anbari، ص437]؛ والجملة حال من «النار»."
  - "«هِنْدٌ النَّارَ»: يُكسر تنوين «هند» في النطق لالتقاء الساكنين، فتُقرأ «هِنْدُنِ النَّارَ»."
morphology:
  - "«أَوْقَدَتْ» على «أَفْعَل» من «وَقَدت النار» إذا اشتعلت، والهمزة للتعدية."
  - "«الْعَلْيَاء» على «فَعْلاء»: «ويقال: هو من عُليا معد، بضم العين مع القصر، ومن عَلياء معد بفتح العين مع المد» [@ibn-al-anbari، ص437]."
  - "«تُلْوِي» مضارع «ألوى» على «أفعل»: «ألوى بالشيء: أشار به» [@zawzani، ص270]."
rhetoric:
  thesis: "يرى نار المحبوبة لا وجهها: النار أثرها في الليل، وهي بعيدة لا يصل إليها."
  devices:
    - title: "تقديم «وَبِعَيْنَيْكَ»"
      text: "بدأ بعينيه قبل الفعل، فالمهم أنه رآها بنفسه لا أنه سمع بها. وهذا ما يقرره عبد القاهر الجُرْجانيّ في التقديم، ناقلًا عن سِيبَوَيْه: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "المجاز في «تُلْوِي بِهَا الْعَلْيَاءُ»"
      text: "جعل الأرض المرتفعة تلوّح بالنار كما يلوّح الرجل بثوبه: «كما يلوى بالرجل بثوبه إذا رفعه يلوح به للقوم إذا بشرهم من بعيد» [@ibn-al-anbari، ص437]. والفعل على حقيقته، والمجاز في إسناده إلى العلياء، فارتفاعها هو الذي أظهر النار. وهذا ما يسميه عبد القاهر المجاز الحكمي: «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]."
    - title: "الالتفات"
      text: "تكلم عن نفسه في البيت السابق «لا أرى»، ثم خاطبها هنا «وبعينيك». والالتفات: الانتقال من التكلم إلى الخطاب أو العكس، وهو هنا خطاب للنفس [@zawzani، ص270]."
  connection: "ثم يحدد موضع النار: بين العقيق وشخصين، توقد بالعود."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَبِعَيْنَيْ / كَ أَوْقَدَتْ / هِنْدُنِنْنَا = فعلاتن / متفع لن / فاعلاتن — رَ أَخِيرَنْ / تُلْوِي بِهَلْ / عَلْيَاءُو = فعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "ينتقل من أسماء إلى هند، ومن الديار إلى النار. والنار في الصحراء علامة الحي، والشاعر يراها من بعيد. ويخاطب نفسه في «وبعينيك»، كما يقول الزَّوْزَنِيّ: «يخاطب نفسه ويقول: وإنما أوقدت هند النار بمرآك ومنظر منك» [@zawzani، ص270]."
variants:
  - reading: "وَبِعَيْنَيْكَ أَوْقَدَتْ هِنْدٌ النَّا / رَ أَصِيلًا تُلْوِي بِهَا الْعَلْيَاءُ"
    status: "رواية التِّبْرِيزِيّ"
    note: "هي متن التِّبْرِيزِيّ، وفيه «ويروى (أخيرا)» [@tabrizi-ashr، ص253]، وبها يروي البغدادي: «وأصيلا: ظرف بمعنى العشي وروي بدله أخيرا» [@khizana، ج3 ص416]."
