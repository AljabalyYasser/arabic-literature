first: "أَمْ عَلَيْنَا جَرَّى الْعِبَادِ كَمَا نِيـ"
second: "ـطَ بِجَوْزِ الْمُحَمَّلِ الْأَعْبَاءُ"
meaning: "أم علينا جناية العِباد، تعلّقونها بنا كما تُعلّق الأثقال على وسط البعير؟ قال ابن الأَنْبارِيّ: «فيقول: تريدون أن تحملوا علينا ذنوب هؤلاء» [@ibn-al-anbari، ص481]."
vocabulary:
  - term: "الْعِبَادِ"
    text: "«العباديون» [@ibn-al-anbari، ص481]، وهم قوم من أهل الحِيرة؛ يقول ابن الأَنْبارِيّ في بني مَرِينا الذين ينزلون الحِيرة: «وهم قوم من العباد» [@ibn-al-anbari، ص498]."
  - term: "نِيطَ"
    text: "«علِّق» [@ibn-al-anbari، ص481]؛ وفي اللسان: «ناطَ الشيءَ يَنُوطُه نَوْطاً: عَلَّقه» [@lisan، ج7 ص418]."
  - term: "جَوْزِ"
    text: "«الوسط، وجمعه أجواز» [@ibn-al-anbari، ص481]."
  - term: "الْمُحَمَّلِ"
    text: "«البعير» [@ibn-al-anbari، ص481]، أي الذي يُحمَّل."
  - term: "الْأَعْبَاءُ"
    text: "«جمع عبء، وهو الثقل» [@ibn-al-anbari، ص481]؛ وفي اللسان: «العِبْءُ، بالكسرِ: الحِمْل والثِّقلُ مِنْ أَي شيءٍ كَانَ» [@lisan، ج1 ص117]."
syntax:
  - "«والكاف في موضع نصب، والأعباء اسم ما لم يسم فاعله» [@ibn-al-anbari، ص481]: أي «كَمَا نِيطَ» نعت لمصدر محذوف، والتقدير: تعليقًا كما نيط، و«الأعباءُ» نائب فاعل «نيط»."
  - "«جَرَّى الْعِبَادِ» مبتدأ مؤخر خبره «علينا»، والجملة معطوفة بـ«أم» على ما قبلها."
morphology:
  - "«نِيطَ» ماض مبني للمجهول من «ناط ينوط»، أصله «نُوِطَ»، نُقلت كسرة الواو إلى النون فقُلبت الواو ياء."
  - "«الْمُحَمَّل» اسم مفعول من «حمّل» على «فعّل»، والتضعيف للتكثير."
  - "«الْأَعْبَاء» جمع «عِبْء» على «أفعال»."
rhetoric:
  thesis: "صورة الظلم: ذنب الآخرين حِمل يُعلَّق على ظهر بَكْر."
  devices:
    - title: "التمثيل في «كَمَا نِيطَ بِجَوْزِ الْمُحَمَّلِ الْأَعْبَاءُ»"
      text: "شبّه تحميلهم بَكْرًا ذنوب غيرها بتعليق الأحمال على وسط البعير: البعير لا يختار حمله، ولا ذنب له فيما يحمل، وإنما يُحمَّل. والشبه هنا في هيئة كاملة لا في صفة واحدة، فهو من التمثيل الذي يقول عبد القاهر الجُرْجانيّ إن الشبه فيه يكون «محصّلاً بضرب من التأوّل» [@asrar، ص90]، أي لا يُدرك بالنظر، بل بالتأمل في المعنى."
    - title: "المبالغة في «الْمُحَمَّلِ»"
      text: "لم يقل «البعير» بل «المحمَّل» بصيغة التكثير: الدابة التي شأنها أن تُحمَّل، فكأن بَكْرًا صارت في نظر تَغْلِب دابة لحمل الذنوب."
  connection: "ثم يسأل: أم علينا جناية قُضاعة؟"
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَمْ عَلَيْنَا / جَرْرَلْ عِبَا / دِ كَمَا نِي = فاعلاتن / مستفع لن / فعلاتن — طَ بِجَوْزِلْ / مُحَمْمَلِلْ / أَعْبَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "السؤال الرابع، وفيه أول تشبيه في السلسلة. وخبر العِباد عند ابن الأَنْبارِيّ: «أن بعض العباد، وهم العباديون، أصابوا في بني تغلب دماء فلم يدرك بنو تغلب بثأرهم منهم» [@ibn-al-anbari، ص481]. وليس هذا البيت مستقلًا عند الزَّوْزَنِيّ: فعنده «أَمْ عَلَيْنَا جَرَّى إِيَادٍ كَمَا نِيـ / ـطَ بِجَوْزِ الْمُحَمَّلِ الْأَعْبَاءُ» [@zawzani، ص284]، أي صدر البيت 50 مع عجز هذا البيت، ولذلك نقص عنده بيت."
