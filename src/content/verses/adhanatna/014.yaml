first: "أَتَلَهَّى بِهَا الْهَوَاجِرَ إِذْ كُلْـ"
second: "ـلُ ابْنِ هَمٍّ بَلِيَّةٌ عَمْيَاءُ"
meaning: "أتسلى بهذه الناقة في أشد ساعات الحر، حين يصير كل مهموم حائرًا كالناقة البليّة العمياء التي لا تهتدي. قال ابن الأَنْبارِيّ: «أي أركبها وأتعلل بوطئها وسرعتها وحسن ذهابها ونشاطها في شدة الحر، فلا أجد، مع ما أنا فيه، شدة من الحر عليّ» [@ibn-al-anbari، ص444]."
vocabulary:
  - term: "أَتَلَهَّى"
    text: "ألهو وأتعلل [@ibn-al-anbari، ص444]؛ «أتلهى: من اللهو» [@tabrizi-ashr، ص257]."
  - term: "الْهَوَاجِرَ"
    text: "«انتصاف النهار، واحدتها هاجرة» [@ibn-al-anbari، ص444]."
  - term: "ابْنِ هَمٍّ"
    text: "«يقال هذا ابنُ هم وأخو همّ، إذا لحقه ذلك» [@ibn-al-anbari، ص445]، أي صاحب الهم."
  - term: "بَلِيَّةٌ"
    text: "«ناقة الرجل إذا مات عقلت عند رأسه، أي عند القبر مما يلي الرأس، وعكس رأسها بذنبها، فتترك لا تأكل ولا تشرب حتى تموت، فهي عمياء لا تتجه» [@ibn-al-anbari، ص445]."
syntax:
  - "«وموضع (أتلهى) رفع بالألف، والباء صلة أتلهى ... والهواجر نصب بأتلهى» [@ibn-al-anbari، ص445]، أي أنها ظرف زمان."
  - "«وكل رفع بالبلية، والبلية مرتفعة به، والعمياء نعت البلية، وإذ وقت ماض» [@ibn-al-anbari، ص445]؛ أي «كل ابن هم» مبتدأ و«بليّة» خبره، يرفع كل منهما الآخر على مذهب الكوفيين، والجملة في محل جر بإضافة «إذ» إليها."
morphology:
  - "«أَتَلَهَّى» على «تفعّل» من اللهو، أصله «أتلهّو» قُلبت الواو ياء ثم ألفًا لتحركها وانفتاح ما قبلها."
  - "«الهاجرة»: قال أبو العباس: «إنما سميت الهاجرة هاجرة لبعدها من» البرد، «أخذت من قولهم: قد هجرت الرجل، إذا بعدت منه» [@ibn-al-anbari، ص445]."
  - "«بَلِيَّة» على «فعيلة» بمعنى مفعولة، من «بَلِي» إذا تُرك حتى يبلى."
rhetoric:
  thesis: "الشاعر في مقابل الناس: كلهم في الهاجرة حيارى، وهو وحده يلهو."
  devices:
    - title: "التشبيه البليغ في «كُلُّ ابْنِ هَمٍّ بَلِيَّةٌ عَمْيَاءُ»"
      text: "جعل المهموم بليّة بلا أداة تشبيه، فكأنه هو هي: «وشبهه بالبلية» [@ibn-al-anbari، ص445]. ووجه الشبه الحيرة: البليّة معقولة عند القبر لا تتجه، والمهموم لا يعرف أين يتوجه. ومعرفة هذا الشبه تحتاج إلى معرفة العادة، فهو مما يكون فيه «الشبه محصّلاً بضرب من التأوّل» عند عبد القاهر الجُرْجانيّ [@asrar، ص90]."
    - title: "الطباق بين «أَتَلَهَّى» و«ابْنِ هَمٍّ»"
      text: "اللهو في مقابل الهم، والهاجرة التي يتعب فيها الناس هي وقت لهوه. فالبيت يرسم الشاعر بضده: «إذا كان صاحب الهم لا يدري كيف يتوجه»، «لا أعيا أنا بأمري» [@ibn-al-anbari، ص445]."
  connection: "ثم يترك الناقة، ويبدأ الخبر الذي قامت له القصيدة: «وأتانا عن الأراقم أنباء»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَتَلَهْهَا / بِهَلْ هَوَا / جِرَ إِذْ كُلْ = فعلاتن / متفع لن / فعلاتن — لُبْنِ هَمْمِنْ / بَلِيْيَتُنْ / عَمْيَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "آخر أبيات الناقة، وفيه يعود الهم الذي بدأ به في البيت 9: غيره يتحير، وهو يمضي على ناقته. وفي البليّة عادة جاهلية يذكرها ابن الأَنْبارِيّ: «كانوا في الجاهلية يعقلون ناقة الرجل عند رأسه ويقولون: إذا قام من قبره للبعث ركبها» [@ibn-al-anbari، ص445]."
