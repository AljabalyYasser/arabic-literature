first: "آذَنَتْنَا بِبَيْنِهَا أَسْمَاءُ"
second: "رُبَّ ثَاوٍ يُمَلُّ مِنْهُ الثَّوَاءُ"
meaning: "أعلمتنا أسماء بعزمها على فراقنا. ثم قال: رُبّ مقيم تُمَلّ إقامته، ولكن أسماء ليست منهم؛ فمهما طالت إقامتها لم نملّها [@ibn-al-anbari، ص433] [@zawzani، ص269]."
vocabulary:
  - term: "آذَنَتْنَا"
    text: "أعلمتنا؛ ومنه في القرآن «آذنتكم على سواء» [@ibn-al-anbari، ص433]."
  - term: "البين"
    text: "الفراق؛ وهو من الأضداد، يكون الفراق ويكون الوصال [@ibn-al-anbari، ص433]."
  - term: "ثَاوٍ"
    text: "مقيم [@ibn-al-anbari، ص433]."
  - term: "الثَّوَاءُ"
    text: "الإقامة [@ibn-al-anbari، ص433]."
syntax:
  - "«أَسْمَاءُ» فاعل «آذنت» مؤخر، و«بِبَيْنِهَا» متعلق بالفعل [@ibn-al-anbari، ص434]."
  - "«رُبَّ ثَاوٍ»: «ثَاوٍ» مجرور بـ«رُبَّ»، وأصله «ثاوي»، حُذفت ياؤه لالتقاء الساكنين: الياء والتنوين [@ibn-al-anbari، ص434]."
  - "«يُمَلُّ مِنْهُ الثَّوَاءُ» جملة صفة لـ«ثَاوٍ»، و«الثَّوَاءُ» نائب فاعل [@ibn-al-anbari، ص434]."
morphology:
  - "«آذن» على وزن «أفعل» من الإذن، بمعنى أعلم [@ibn-al-anbari، ص433]."
  - "«ثوى يثوي ثواءً» إذا أقام، وأجاز أبو عُبَيْدة «أثوى» أيضًا [@ibn-al-anbari، ص434]."
  - "«يُمَلُّ» مضارع مبني للمجهول من «ملّ»."
rhetoric:
  thesis: "يبدأ الحارِث بالفراق لا بالأطلال: خبر أن أسماء راحلة. ثم يقول حكمة عامة تنقلب مدحًا لها: كل مقيم يُملّ إلا هي."
  devices:
    - title: "الحكمة في الشطر الثاني"
      text: "«رُبَّ ثَاوٍ يُمَلُّ مِنْهُ الثَّوَاءُ» جملة سائرة، ومعناها عند ابن الأَنْبارِيّ: «رب مقيم يمل منه إقامته، ولكنا لا نمل ثواء هذه المرأة» [@ibn-al-anbari، ص433]."
    - title: "المدح بالحذف"
      text: "لم يقل «ولكن أسماء لا تُملّ»، بل ترك القارئ يستخرجه؛ فالمدح أبلغ لأنه لم يُصرَّح به."
    - title: "مطلع مصرّع"
      text: "آخر الصدر «أَسْمَاءُ» يوافق آخر العَجُز «الثَّوَاءُ» في الرَّوِيّ، كما في مطلع امرئ القَيْس."
  connection: "ثم يذكر آخر عهده بها في بُرْقَة شَمّاء والخَلْصاء [@ibn-al-anbari، ص434]."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "آذَنَتْنَا / بِبَيْنِهَا / أَسْمَاءُو = فاعلاتن / متَفْعِ لُن / فالاتن — رُبْبَ ثَاوِنْ / يُمَلْلُ مِنْ / هُثْثَوَاءُو = فاعلاتن / متَفْعِ لُن / فاعلاتن"
  note: "وزن الخفيف «فاعلاتن مستفع لن فاعلاتن». دخل «مستفع لن» الخبن، وهو حذف الثاني الساكن، فصارت «متفع لن». ودخل «فاعلاتن» في آخر الصدر التشعيث، وهو حذف أول الوتد المجموع، فصارت «فالاتن»؛ وهو يكثر في الضرب ويقل في غيره [@atiq، ص98–99]."
context: "مطلع معلقة الحارِث بن حِلِّزَة. يروي الأَصْمَعِيّ أنه قالها وهو ابن خمس وثلاثين ومئة سنة [@ibn-al-anbari، ص433]، ويروي ابن قُتَيْبة أنه كان ينشدها من وراء ستر للبرص الذي كان به، فأمر الملك برفع الستر بينهما استحسانًا لها [@ibn-qutayba، ج1 ص193]."
