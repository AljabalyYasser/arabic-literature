first: "وَفَدَيْنَاهُمُ بِتِسْعَةِ أَمْلَا"
second: "كٍ نَدَامَى أَسْلَابُهُمْ أَغْلَاءُ"
meaning: "وجئنا آل المنذر بتسعة ملوك فداءً وثأرًا، أهلِ شراب ومجالسة، أسلابهم غالية. ويروي ابن الأَنْبارِيّ أن المنذر بن ماء السماء «بعث خيلا من بكر ابن وائل في طلب بني حجر آكل المرار حين قُتل حُجر، فظفرت بهم بكر بن وائل وقد كانوا دنوا من بلاد اليمن، فأتوا بهم المنذر بن ماء السماء فأمر بذبحهم وهو بالحيرة» [@ibn-al-anbari، ص498]."
vocabulary:
  - term: "فَدَيْنَاهُمُ"
    text: "من الفداء، ولم يفسره الشرّاح؛ والمعنى على قراءتنا: جعلنا الملوك التسعة فداءً لآل المنذر وثأرًا لهم. وعند الزَّوْزَنِيّ «وأتيناهم»: «وأتيناهم بتسعة من الملوك وقد أسرناهم» [@zawzani، ص282]."
  - term: "أَمْلَاكٍ"
    text: "«جمع ملك، والملك يقال في جمعه ملكون وملوك وأملاك» [@ibn-al-anbari، ص498]."
  - term: "نَدَامَى"
    text: "جمع نَدْمان، وهو النديم: «والنَّدِيمُ: المُنادِمُ، وَالْجَمْعُ نُدَماءُ، وَكَذَلِكَ النَّدْمانُ، وَالْجَمْعُ نَدامى» [@lisan، ج12 ص573]؛ أي ملوك أهل شراب ومجالسة."
  - term: "أَسْلَابُهُمْ"
    text: "«جمع السلب وهو الثياب والسلاح والفرس» [@zawzani، ص282]."
  - term: "أَغْلَاءُ"
    text: "غالية: «وكانت أسلابهم غالية الأثمان لعظم أخطارهم وجلالة أقدارهم» [@zawzani، ص282]."
syntax:
  - "«والأسلاب رفع بالأغلاء» [@ibn-al-anbari، ص498]: أي «أسلابهم أغلاء» جملة اسمية نعت لـ«أملاك»."
  - "«نَدَامَى» نعت لـ«أملاك»، و«بتسعة» متعلق بـ«فديناهم»."
morphology:
  - "«أَمْلَاك» جمع «مَلِك» على «أفعال» [@ibn-al-anbari، ص498]."
  - "«نَدَامَى» جمع «نَدْمان» على «فَعالى» [@lisan، ج12 ص573]."
  - "«أَغْلَاء» على «أفعال» من «غلا يغلو»، همزته منقلبة عن واو."
rhetoric:
  thesis: "ثمن الدم ملوك: يُفتدى الملك بالملوك."
  devices:
    - title: "المبالغة في «بِتِسْعَةِ أَمْلَاكٍ»"
      text: "العدد يقع على ملوك لا على رجال: تسعة من بيت حُجْر آكل المُرار، وكل ملك منهم بقبيلة؛ فالفداء غال كأسلابهم."
    - title: "الكناية في «أَسْلَابُهُمْ أَغْلَاءُ»"
      text: "غلاء السلب يدل على شرف صاحبه؛ قال الزَّوْزَنِيّ: «لعظم أخطارهم وجلالة أقدارهم» [@zawzani، ص282]. فالحارِث يذكر الثياب والسلاح ويريد مكانة القتلى."
  connection: "ثم يقول: ومع الجون كتيبة عنود."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَفَدَيْنَا / هُمُو بِتِسْ / عَةِ أَمْلَا = فعلاتن / متفع لن / فعلاتن — كِنْ نَدَامَى / أَسْلَابُهُمْ / أَغْلَاءُو = فاعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "بعد الآيات الثلاث يزيد الحارِث من بلاء بَكْر مع آل المنذر. وفي ملوك بني حُجْر هؤلاء يقول امرؤ القيس، فيما يروي ابن الأَنْبارِيّ: «مُلُوكٌ مِنْ بَنِي حُجْرِ بْنِ عَمْرٍو / يُسَاقُونَ الْعَشِيَّةَ يُقْتَلُونَا» [@ibn-al-anbari، ص498]."
variants:
  - reading: "...أَمْلَا / كٍ كِرَامٍ أَسْلَابُهُمْ أَغْلَاءُ"
    status: "رواية الزَّوْزَنِيّ والتِّبْرِيزِيّ"
    note: "يذكرها ابن الأَنْبارِيّ رواية [@ibn-al-anbari، ص498]، وهي متن الزَّوْزَنِيّ والتِّبْرِيزِيّ [@zawzani، ص282] [@tabrizi-ashr، ص285]."
  - reading: "وَأَتَيْنَاهُمُ بِتِسْعَةِ أَمْلَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص282]."
