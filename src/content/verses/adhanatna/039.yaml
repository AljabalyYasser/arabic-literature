first: "مَلِكٌ أَضْلَعُ الْبَرِيَّةِ لَا يُو"
second: "جَدُ فِيهَا لِمَا لَدَيْهِ كِفَاءُ"
meaning: "ملك هو أقوى الخلق على حمل الأمور الثقيلة، لا يوجد في الناس من يكافئ ما عنده. قال ابن الأَنْبارِيّ: «معناه: ليس في البرية أحد يضطلع من الأمور بمثل ما يضطلع، أي يحتمل مثل الذي يحتمل المنذر من الأمور الثقيلة» [@ibn-al-anbari، ص476]."
vocabulary:
  - term: "أَضْلَعُ"
    text: "أقوى على الحمل؛ من الاضطلاع، و«يقال رجل ضليع، إذا كان كثير اللحم عظيم الجسم» [@ibn-al-anbari، ص476]."
  - term: "الْبَرِيَّةِ"
    text: "الخلق: «فمن همزها أخذها من برأ الله تعالى الخلق، أي خلقهم» [@ibn-al-anbari، ص477]."
  - term: "كِفَاءُ"
    text: "«المثل والنظير» [@khizana، ج4 ص363]."
syntax:
  - "«والملك يرتفع بإضمار هو. وأضلع البرية نعته» [@ibn-al-anbari، ص477]؛ أي خبر لمبتدأ محذوف."
  - "وجعله البغدادي «خبر آخر لقوله هو» في البيت السابق [@khizana، ج4 ص363]."
  - "«والكفاء رفع بيوجد وهو اسم ما لم يسم فاعله» [@ibn-al-anbari، ص477]، أي نائب فاعل، و«لِمَا لَدَيْهِ» متعلق بـ«كفاء»."
morphology:
  - "«أَضْلَع» اسم تفضيل على «أفعل» من «ضَلُع» إذا قوي على الحمل."
  - "«البَرِيَّة» على «فعيلة»؛ ومن لم يهمزها فهي عنده «فعيلة من بريت أبرى»، أو من «برأ» بُنيت على ترك الهمز [@ibn-al-anbari، ص477]."
  - "«كِفاء» مصدر «كافأ» على «فِعال»: «يقال: كافأت الرجل أكافئه مكافأة وكفاء» [@ibn-al-anbari، ص476]."
rhetoric:
  thesis: "مدح بالتفرد: لا نظير للملك."
  devices:
    - title: "النفي المطلق في «لَا يُوجَدُ فِيهَا ... كِفَاءُ»"
      text: "نفى وجود المثيل في الخلق كله، فصار المدح غاية. ومعناه عند ابن الأَنْبارِيّ: «ليس في البرية أحد يكافئه ولا يستطيع أن يصنع مثل ما يصنع من الخير» [@ibn-al-anbari، ص476]."
    - title: "الاستعارة في «أَضْلَعُ»"
      text: "الضليع الضخم القوي على الحمل [@ibn-al-anbari، ص476]، فجعل الملك كأنه يحمل أثقال الناس على كتفيه. والاستعارة في صيغة التفضيل نفسها."
  connection: "ثم يعود إلى تَغْلِب: فاتركوا البغي والتعدي."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "مَلِكُنْ أَضْ / لَعُلْبَرِيْ / يَةِ لَا يُو = فعلاتن / متفع لن / فعلاتن — جَدُ فِيهَا / لِمَا لَدَيْ / هِ كِفَاءُو = فعلاتن / متفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وأول العجز وآخر العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "مدح المنذر بعد ذكر بلاء بَكْر معه. وفي البيت شاهد للنحاة: «أضلع البرية» نعت لـ«ملك» وهو نكرة، فاستدل به ابن السرّاج على أن إضافة أفعل التفضيل «لفظّية لا تفيد تعريفاً بدليل هذا البيت فإنّ أضلع البريّة وقع نعتاً لملك وهو نكرة» [@khizana، ج4 ص361]."
variants:
  - reading: "مَلِكٌ أَضْرَعَ الْبَرِيَّةَ لَا يُو..."
    status: "رواية الزَّوْزَنِيّ"
    note: "«أضرع: ذَلَّلَ وقهر» [@zawzani، ص278]؛ وذكرها البغدادي على أنه فعل ماض، «وحينئذ لا شاهد في البيت» [@khizana، ج4 ص364]."
  - reading: "مَلِكٌ أَضْلَعُ الْبَرِيَّةِ مَا يُو..."
    status: "رواية التِّبْرِيزِيّ"
    note: "[@tabrizi-ashr، ص267]."
