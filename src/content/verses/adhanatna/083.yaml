first: "وَوَلَدْنَا عَمْرَو بْنَ أُمِّ أُنَاسٍ"
second: "مِنْ قَرِيبٍ لَمَّا أَتَانَا الْحِبَاءُ"
meaning: "ونحن ولدنا عمرو بن أم أناس، جدّ الملك، من قرابة قريبة، حين جاءنا مهر أمه. قال ابن الأَنْبارِيّ: «يريد عمرو بن حجر الكندي، وكان جد الملك عمرو بن هند، وهند بنت عمرو بن حجر آكل المرار، وكانت أم عمرو بن حجر أم أناس بنت ذهل بن شيبان بن ثعلبة» [@ibn-al-anbari، ص500]."
vocabulary:
  - term: "وَلَدْنَا"
    text: "كنا أخواله، أي منا أمه: «يريد إنا أخوال هذا الملك» [@zawzani، ص283]."
  - term: "مِنْ قَرِيبٍ"
    text: "«معناه السبب بيننا وبينه قريب ليس بالمتباعد» [@ibn-al-anbari، ص500]."
  - term: "الْحِبَاءُ"
    text: "العطية، والمراد المهر: «حين أتانا حباء الملك عمرو بن حُجر لما خطب إلينا ورآنا أهلا لمصاهرته» [@tabrizi-ashr، ص287]؛ وفي اللسان: «والحِبَاءُ: مَا يَحْبُو بِهِ الرجلُ صاحَبه وَيُكْرِمُهُ بِهِ» [@lisan، ج14 ص162]."
syntax:
  - "«وابن أم أناس نعت لعمرو، وأناس خفض بإضافة الأم إليه» [@ibn-al-anbari، ص500]، «ولما نصب بالوقت» [@ibn-al-anbari، ص500]، أي «لمّا» ظرف بمعنى «حين»."
  - "«مِنْ قَرِيبٍ» متعلق بـ«ولدنا»، صفة لمحذوف: من نسب قريب."
morphology:
  - "«أُنَاس» جاء هنا منوّنًا مصروفًا. وقال الفراء فيما ينقل ابن الأَنْبارِيّ: «إذا كنيت امرأة بأم أناس وأم صبيان، وأم رجال، وأم نساء كان الغالب عليها ألا تجري» [@ibn-al-anbari، ص500]، أي ألا تنصرف، وأنشد قول بِشْر بن أبي خازِم «وَإِلَى ابْنِ أُمِّ أُنَاسَ تَعْمِدُ نَاقَتِي» [@ibn-al-anbari، ص500] بلا تنوين."
  - "«الْحِبَاء» على «فِعال» من «حبا يحبو»، همزته منقلبة عن واو."
rhetoric:
  thesis: "الخاتمة بالرحم: بَكْر أخوال الملك."
  devices:
    - title: "المجاز في «وَوَلَدْنَا»"
      text: "لم تلد بَكْر عَمْرًا، وإنما ولدته امرأة منها؛ فأسند الولادة إلى القبيلة كلها، فصار الملك كأنه ابنها."
    - title: "الكناية في «لَمَّا أَتَانَا الْحِبَاءُ»"
      text: "ذكر المهر ولم يذكر الزواج؛ قال الزَّوْزَنِيّ: «أي زوّجنا أمه من أبيه لما أتانا مهرها» [@zawzani، ص283]. والكلمة تدل على أن الملوك هم الذين خطبوا إلى بَكْر، وهذا شرف."
  connection: "ثم يختم: مثلها تخرج النصيحة للقوم."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَوَلَدْنَا / عَمْرَبْنَ أُمْ / مِ أُنَاسِنْ = فعلاتن / مستفع لن / فعلاتن — مِنْ قَرِيبِنْ / لَمْمَا أَتَا / نَلْ حِبَاءُو = فاعلاتن / مستفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]. و«أُنَاسٍ» منوّن في آخر الصدر كما يقتضي الوزن؛ وفي نسخة الشاملة «أَمِّ» بفتح الهمزة، والصواب «أُمِّ» كما عند الزَّوْزَنِيّ والتِّبْرِيزِيّ [@zawzani، ص282] [@tabrizi-ashr، ص286]."
context: "أول بيتي «القرابة» (83–84): بعد البلاء يذكّر الحارِث الملك بالنسب. وأم أناس هذه جدة الملك من قِبَل أمه: «إذ أمه بنت ذهل بن شيبان، وهي جدة أم عمرو بن المنذر» [@ibn-al-anbari، ص500]، و«عمرو بن أم أناس هذا هو جد امرئ القيس الشاعر» [@ibn-al-anbari، ص500]."
