first: "لَا يُقِيمُ الْعَزِيزُ فِي الْبَلَدِ السَّهْـ"
second: "ـلِ وَلَا يَنْفَعُ الذَّلِيلَ النَّجَاءُ"
meaning: "في تلك الأيام لم يكن العزيز يقدر أن يقيم في الأرض السهلة المكشوفة، ولم يكن الذليل ينتفع بالهرب. قال ابن الأَنْبارِيّ: «يقول: لم يكن العزيز الممتنع يقدر أن يقيم بالبلد السهل؛ لما فيه الناس من المغاورة والحيف والجهد» [@ibn-al-anbari، ص472]."
vocabulary:
  - term: "الْعَزِيزُ"
    text: "«القاهر الغالب» [@ibn-al-anbari، ص473]."
  - term: "الْبَلَدِ السَّهْلِ"
    text: "الأرض المنبسطة التي لا جبل فيها يُتحصن به."
  - term: "النَّجَاءُ"
    text: "«أي الهرب» [@ibn-al-anbari، ص472]."
syntax:
  - "«والعزيز رفع بيقيم، والنجاء رفع بينفع، والذليل نصب بوقوع الفعل عليه» [@ibn-al-anbari، ص473]."
  - "«فِي الْبَلَدِ» متعلق بـ«يقيم»، و«السهل» نعت لـ«البلد»."
morphology:
  - "«العَزِيز» و«الذَّلِيل» على «فَعِيل»، صفتان مشبهتان: «ويقال رجل ذليل بين الذل والذلة والمذلة» [@ibn-al-anbari، ص473]."
  - "«النَّجاء» بالفتح مصدر «نجا»، «ويروى (النِّجاء) بكسر النون على إنه جمع نجوة» [@ibn-al-anbari، ص473]، والنَّجْوة: المكان المرتفع."
  - "«يُقِيم» مضارع «أقام» على «أفعل»."
rhetoric:
  thesis: "حكمة في وصف الفوضى: العزة والذلة سواء حين يغيب من يحكم."
  devices:
    - title: "المقابلة"
      text: "يقابل بين «الْعَزِيزُ» و«الذَّلِيلَ»، وبين «لَا يُقِيمُ» و«لَا يَنْفَعُ»: العزيز لا يستقر، والذليل لا يهرب. فكلاهما مهدد، ولا موضع آمن بينهما."
    - title: "إرسال المثل"
      text: "البيت عام اللفظ، لا يذكر بَكْرًا ولا تَغْلِب، فيصلح أن يقال في كل زمن فوضى. وهذا ما يسميه البغدادي إرسال المثل، كما قال في عجز المطلع: «وهذا المصراع الثاني من قبيل إرسال المثل» [@khizana، ج3 ص415]."
  connection: "ثم يكمل الحكمة: ليس ينجي الهارب رأس جبل ولا حرّة صعبة."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "لَا يُقِيمُلْ / عَزِيزُ فِلْ / بَلَدِسْسَهْ = فاعلاتن / متفع لن / فعلاتن — لِ وَلَا يَنْ / فَعُذْذَلِي / لَنْنَجَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "حكمة تصف زمن الفوضى الذي غارت فيه بَكْر (32–36): لا أمان لأحد. قال الزَّوْزَنِيّ: «يريد أن الشر كان شاملًا عامًا لم يسلم منه العزيز ولا الذليل» [@zawzani، ص277]."
variants:
  - reading: "لَا يُقِيمُ الْعَزِيزُ بِالْبَلَدِ السَّهْـ..."
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص277]، وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص266]."
  - reading: "...وَلَا يَنْفَعُ الذَّلِيلَ النِّجَاءُ"
    status: "رواية أخرى"
    note: "«والرواية المعروفة: (النَّجاء) بفتح النون، ويروى (النِّجاء) بكسر النون» [@ibn-al-anbari، ص473]."
