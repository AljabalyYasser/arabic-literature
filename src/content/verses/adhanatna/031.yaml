first: "أَوْ مَنَعْتُمْ مَا تُسْأَلُونَ فَمَنْ حُدْ"
second: "دِثْتُمُوهُ لَهُ عَلَيْنَا الْعَلَاءُ"
meaning: "أو إن منعتم ما نسألكم من الإنصاف، فمن الذي حُدّثتم أنه علانا يومًا حتى تطمعوا فينا؟ قال ابن الأَنْبارِيّ: «يقول: فمن بلغكم إنه اعتلانا في قديم الدهر فتطمعوا في ذلك منا» [@ibn-al-anbari، ص470]."
vocabulary:
  - term: "مَا تُسْأَلُونَ"
    text: "«ما تسألون من النصفة فيما كان بيننا وبينكم» [@ibn-al-anbari، ص470]، والنَّصَفة: الإنصاف."
  - term: "الْعَلَاءُ"
    text: "«من العلو والرفعة» [@ibn-al-anbari، ص470]."
syntax:
  - "«وما نصب بمنعتم، وتسألون صلتها» [@ibn-al-anbari، ص470]."
  - "«ومن رفع بما عاد من الهاء في حدثتموه» [@ibn-al-anbari، ص470]، أي «من» مبتدأ."
  - "«وحدثتم وأنبئتم مشبه بظننتم، تنصب الاسم والخبر، فكأنه قال: فمن ظننتموه له علينا العلاء» [@ibn-al-anbari، ص470]؛ فجملة «له علينا العلاء» في موضع المفعول."
morphology:
  - "«حُدِّثْتُمُوهُ» ماض مبني للمجهول من «حدّث» على «فعّل»، وزيدت الواو بعد ميم الجمع لاتصاله بالضمير."
  - "«تُسْأَلُونَ» مضارع «سأل» مبني للمجهول."
  - "«العَلاء» مصدر «علا» على «فَعال»."
rhetoric:
  thesis: "التحدي بالسؤال: لا جواب، لأنه لا أحد."
  devices:
    - title: "الاستفهام الإنكاري في «فَمَنْ حُدِّثْتُمُوهُ»"
      text: "لا يسأل عن شخص، بل ينكر أن يكون قد وُجد. وهذا ما يصفه عبد القاهر الجُرْجانيّ في الاستفهام الذي يراد به التكذيب: «فهذا تكذيبٌ منه لإنسانٍ تهَدَّدَهُ بالقتل ... وإنكارٌ أن يَقْدر على ذلك ويَستطيعَه» [@dalail، ص117]. فالبيت يكذّب تَغْلِب في طمعها."
    - title: "«حُدِّثْتُمُوهُ» بالمجهول"
      text: "لم يقل «رأيتموه» بل «حُدِّثتموه»: حتى في الأخبار والروايات لا يوجد من علاهم. فنفى السماع، فانتفت الرؤية من باب أولى."
  connection: "ثم يذكّرهم بأيام الغارات: هل علمتم أيام ينتهب الناس؟"
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَوْ مَنَعْتُمْ / مَا تُسْأَلُو / نَ فَمَنْ حُدْ = فاعلاتن / مستفع لن / فعلاتن — دِثْتُمُوهُو / لَهُو عَلَيْ / نَلْ عَلَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]. وتُشبع هاء «حُدِّثْتُمُوهُ» وهاء «لَهُ» فتصيران «هُو»، وبذلك يستقيم الوزن."
context: "آخر الخيارات (27–31) وأشدها: المنع. وجوابه سؤال يتحدى: لم يعلُنا أحد قط. ويفهم الزَّوْزَنِيّ المسؤول «المهادنة والموادعة»، ويقول: «أي لا قوم أشرف منا، فلا نعجز عن مقابلتكم بمثل صنيعكم» [@zawzani، ص277]. وبعده ينتقل إلى أيام بَكْر شاهدًا على هذا العلو."
variants:
  - reading: "...لَهُ عَلَيْنَا الْغَلَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (الغلاء) بالغين معجمة وهو الارتفاع أيضا» [@ibn-al-anbari، ص470]."
