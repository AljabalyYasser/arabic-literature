first: "ثُمَّ مِلْنَا عَلَى تَمِيمٍ فَأَحْرَمْـ"
second: "ـنَا وَفِينَا بَنَاتُ مُرٍّ إِمَاءُ"
meaning: "ثم ملنا على تميم نغير، فلما بلغنا ديارهم دخلنا الأشهر الحرم فكففنا عن قتالهم، وعندنا بناتهم سبايا إماء. قال ابن الأَنْبارِيّ: «فلما صرنا إلى بلادهم أحرمنا: دخلنا في الأشهر الحرم، فكففنا عن قتالهم»، و«قد سبيناهن قبل دخول الأشهر الحرم» [@ibn-al-anbari، ص472]."
vocabulary:
  - term: "أَحْرَمْنَا"
    text: "«يقال: أحرم الرجل، إذا دخل في الشهر الحرام» [@ibn-al-anbari، ص472]. والأشهر الحرم أشهر كانت العرب تكف فيها عن القتال."
  - term: "بَنَاتُ مُرٍّ"
    text: "نساء تميم؛ «وقال ابن الأعرابي: تميم هو ابن مر» [@ibn-al-anbari، ص472]."
  - term: "إِمَاءُ"
    text: "جمع أَمَة، وهي المرأة المملوكة."
syntax:
  - "«والبنات رفع بإماء، والإماء رفع بالبنات، والواو واو حال، كأنه قال: وبنات مر إماء فينا» [@ibn-al-anbari، ص472]؛ أي «بنات مر» مبتدأ و«إماء» خبره، يرفع كل منهما الآخر على مذهب الكوفيين، والجملة حال."
  - "«فِينَا» متعلق بمحذوف حال، أي كائنات عندنا."
morphology:
  - "«أَحْرَمَ» على «أفعل» للدخول في الشيء، كأصبح وأمسى. «ويقال: أحرم الرجل الشيء، إذا جعله على نفسه حراما» [@ibn-al-anbari، ص472]."
  - "«مِلْنا» ماضي «مال يميل» الأجوف، حُذفت عينه لالتقاء الساكنين."
  - "«إِماء» جمع «أَمَة» على «فِعال»."
rhetoric:
  thesis: "القوة التي تكف: يغيرون ثم يرعون الشهر الحرام."
  devices:
    - title: "الإيجاز في «فَأَحْرَمْنَا»"
      text: "كلمة واحدة تحمل خبرًا كاملًا: دخل الشهر الحرام فتوقفت الغارة، كما يشرحها ابن الأَنْبارِيّ: «دخلنا في الأشهر الحرم، فكففنا عن قتالهم» [@ibn-al-anbari، ص472]."
    - title: "الكناية في «بَنَاتُ مُرٍّ إِمَاءُ»"
      text: "سبي نساء القبيلة كناية عن هزيمتها كلها؛ فلم يقل: هزمنا تميمًا، بل قال: بناتهم عندنا إماء. وفي الكناية يقول عبد القاهر الجُرْجانيّ إن المتكلم يجيء «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يصف تلك الأيام بحكمة: لا يقيم العزيز في السهل، ولا ينفع الذليل الهرب."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "ثُمْمَ مِلْنَا / عَلَى تَمِي / مِنْ فَأَحْرَمْ = فاعلاتن / متفع لن / فاعلاتن — نَا وَفِينَا / بَنَاتُ مُرْ / رِنْ إِمَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن» [@atiq، ص98–99]."
context: "الغارة الثانية: على تميم. وفي «أحرمنا» قولان: دخلنا الأشهر الحرم فكففنا، وهو قول ابن الأَنْبارِيّ والزَّوْزَنِيّ [@zawzani، ص277]؛ وقول ابن الأَعْرابيّ: «فأحرمنا معناه عففنا عنهم وفينا إماء لو شئنا وطئناهن» [@ibn-al-anbari، ص472]، أي كان بأيدينا سبايا من نسائهم نملكهن، ولو شئنا لجامعناهن، فامتنعنا. فالبيت على القولين فخر بالقوة وبالكف معًا."
variants:
  - reading: "...وَفِينَا بَنَاتُ قَوْمٍ إِمَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (وفينا بنات قوم إماء)» [@ibn-al-anbari، ص472]، وهي رواية الزَّوْزَنِيّ [@zawzani، ص277]."
  - reading: "ثُمَّ مِلْنَا إِلَى تَمِيمٍ ..."
    status: "رواية التِّبْرِيزِيّ"
