first: "وَحَمَلْنَاهُمُ عَلَى حَزْمِ ثَهْلَا"
second: "نَ شِلَالًا وَدُمِّيَ الْأَنْسَاءُ"
meaning: "وألجأناهم إلى حزم ثهلان مطرودين، وقد دميت عروق أفخاذهم من الجراح. قال ابن الأَنْبارِيّ: «يقول: جرحناهم فركبوا حزم ثهلان على خشونته. وقوله (شلالا) : هرابا. وقد دميت من الجراح أنساؤهم» [@ibn-al-anbari، ص495]."
vocabulary:
  - term: "حَزْمِ"
    text: "«ما غلظ من الأرض ومن الجبل وخشن» [@ibn-al-anbari، ص495]."
  - term: "ثَهْلَانَ"
    text: "«وثَهْلان: جَبَل مَعْرُوفٌ» [@lisan، ج11 ص94]."
  - term: "شِلَالًا"
    text: "«هرابا» [@ibn-al-anbari، ص495]؛ وفي اللسان: «وذهبَ القومُ شِلالًا أَي انشَلُّوا مطرودين» [@lisan، ج11 ص362]."
  - term: "الْأَنْسَاءُ"
    text: "«جمع النسا وهو عرق معروف في الفخذ» [@zawzani، ص281]."
syntax:
  - "«وثهلان موضعه خفض إلا إنه لا يجري. وشلالا نصب على المصدر، وتقدير فعله شاللت شلالا» [@ibn-al-anbari، ص495]."
  - "«وَدُمِّيَ الْأَنْسَاءُ» جملة حالية: فعل مبني للمجهول ونائب فاعله، وذُكّر الفعل لأن نائب الفاعل جمع تكسير."
morphology:
  - "«ثَهْلَان» ممنوع من الصرف للعلمية وزيادة الألف والنون."
  - "«شِلَال» مصدر «شالّ» على «فِعال» [@ibn-al-anbari، ص495]."
  - "«دُمِّيَ» ماض مبني للمجهول من «دمّى» على «فعّل»."
rhetoric:
  thesis: "المطاردة: من الدفاع إلى الهجوم."
  devices:
    - title: "الاستعارة في «حَمَلْنَاهُمُ عَلَى حَزْمِ ثَهْلَانَ»"
      text: "في معناها قولان: قال الأَصْمَعِيّ: «فشبه شدة ما أصابهم وما حملوهم عليه من القتل بشدة هذا الحزم» [@ibn-al-anbari، ص495]، فالحزم صورة للشدة؛ وقال أبو مالك: «وحملناهم على حزم ثهلان بعينه» [@ibn-al-anbari، ص495]، أي ألجأوهم إلى الجبل حقًّا. ويقرّب التِّبْرِيزِيّ القول الأول بقول الأخطل: «عَلَى يَابِسِ السِّيسَاءِ مُحْدَوْدِبِ الظَّهْرِ» [@tabrizi-ashr، ص282]."
    - title: "الكناية في «وَدُمِّيَ الْأَنْسَاءُ»"
      text: "النسا عرق في الفخذ، وتدميته تعني أن الطعن أصاب أعجازهم وهم يفرّون؛ فالجرح في هذا الموضع يدل على الهرب دون أن يذكره."
  connection: "ثم يقول: وفعلنا بهم ما علمه الله، ولا دماء للهالكين."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَحَمَلْنَا / هُمُو عَلَى / حَزْمِ ثَهْلَا = فعلاتن / متفع لن / فاعلاتن — نَ شِلَالَنْ / وَدُمْمِيَلْ / أَنْسَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "المطاردة بعد الرد. وعند الزَّوْزَنِيّ معنى قريب من قول أبي مالك: «ألجأناهم إلى التحصين بغلظ هذا الجبل والالتجاء إليه في مطاردتنا إياهم» [@zawzani، ص281]."
