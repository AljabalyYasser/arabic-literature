first: "وَاذْكُرُوا حِلْفَ ذِي الْمَجَازِ وَمَا قُدْ"
second: "دِمَ فِيهِ الْعُهُودُ وَالْكُفَلَاءُ"
meaning: "واذكروا الحلف الذي عُقد بيننا بذي المَجاز، وما قُدّم فيه من العهود والكفلاء. قال ابن الأَنْبارِيّ إن ذا المجاز «هو الموضع الذي أخذ عمرو بن هند الملك على تغلب وبكر العهود والمواثيق، وأصلح فيه بين الحيين وأخذ منهم رهنا من أبنائهم» [@ibn-al-anbari، ص478]."
vocabulary:
  - term: "حِلْفَ"
    text: "العهد على التناصر وترك القتال."
  - term: "ذِي الْمَجَازِ"
    text: "«موضع بمكة المكرمة» [@ibn-al-anbari، ص478]."
  - term: "الْكُفَلَاءُ"
    text: "«وواحد الكفلاء كفيل وكافل» [@ibn-al-anbari، ص478]؛ والكفيل: الضامن، والمقصود هنا الرهائن."
syntax:
  - "«وموضع ما نصب بالنسق على الحلف، والعهود رفع بقدم، والكفلاء نسق عليها» [@ibn-al-anbari، ص478]؛ أي «العهود» نائب فاعل «قُدّم»."
  - "«حِلْفَ ذِي الْمَجَازِ» مفعول به لـ«اذكروا»، مضاف إلى المكان."
morphology:
  - "«قُدِّمَ» ماض مبني للمجهول من «قدّم» على «فعّل»."
  - "«الكُفَلاء» جمع «كفيل» على «فُعَلاء»؛ «ويقال: كفلت الرجل وكفلته وكفلت بالرجل» [@ibn-al-anbari، ص478]."
  - "«العُهود» جمع «عهد» على «فُعول»."
rhetoric:
  thesis: "التذكير بالوثيقة: الحجة الأقوى عهد معروف وشهود."
  devices:
    - title: "الإيجاز في «حِلْفَ ذِي الْمَجَازِ»"
      text: "كلمتان تستدعيان خبرًا كاملًا يعرفه الملك والحاضرون: الصلح والرهائن؛ فلا يحتاج الشاعر إلى روايته، بل يكفيه أن يسميه."
    - title: "التقديم في «قُدِّمَ فِيهِ الْعُهُودُ»"
      text: "قدّم الجار والمجرور «فيه» على نائب الفاعل، فبقي المكان، ذو المَجاز، في بؤرة الكلام. وفي التقديم يقول عبد القاهر الجُرْجانيّ: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
  connection: "ثم يبيّن علة الحلف: الحذر من الخيانة والتعدي، وما في الصحف لا تنقضه الأهواء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَذْكُرُو حِلْ / فَ ذِلْمَجَا / زِ وَمَا قُدْ = فاعلاتن / متفع لن / فعلاتن — دِمَ فِيهِلْ / عُهُودُ وَلْ / كُفَلَاءُو = فعلاتن / متفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز وآخر العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "قلب الحجة: العهد الذي عُقد بذي المَجاز، والرهائن الذين أُخذوا فيه، هم أصل الخصومة كلها؛ فالحارِث يذكّر تَغْلِب بشروطه. وفي عدد الرهائن يقول ابن الأَنْبارِيّ هنا: «من كل حي ثمانين رجلا» [@ibn-al-anbari، ص478]، كرواية الأَصْمَعِيّ في الخبر [@aghani-dk، ج11 ص43]، لا مئة كما في رواية أبي عَمْرو الشَّيْبانيّ [@aghani-dk، ج11 ص42]."
