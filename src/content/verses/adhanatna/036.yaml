first: "لَيْسَ يُنْجِي مُوَائِلًا مِنْ حِذَارٍ"
second: "رَأْسُ طَوْدٍ وَحَرَّةٌ رَجْلَاءُ"
meaning: "لا يُنجي الهاربَ مما يحذره رأسُ جبل عالٍ ولا حرّة صعبة. فالخوف في تلك الأيام يدرك الناس حيث تحصنوا."
vocabulary:
  - term: "مُوَائِلًا"
    text: "«الهارب طلبا للنجاة. يقال: وأل الرجل يئل، إذا نجا» [@ibn-al-anbari، ص473]."
  - term: "حِذَارٍ"
    text: "«ما يخاف ويحاذر، وهو مصدر حاذر حذارا» [@ibn-al-anbari، ص473]."
  - term: "طَوْدٍ"
    text: "«الجبل» [@tabrizi-ashr، ص266]."
  - term: "حَرَّةٌ"
    text: "«التي جبالها وحجارتها سود» [@ibn-al-anbari، ص474]."
  - term: "رَجْلَاءُ"
    text: "«وقال آخرون: الرجلاء التي يرتجل الناس فيها لشدتها» [@ibn-al-anbari، ص474]، أي ينزلون عن رواحلهم ويمشون؛ وعند التِّبْرِيزِيّ «الصلبة الشديدة» [@tabrizi-ashr، ص266]."
syntax:
  - "في «ليس» ثلاثة أوجه عند ابن الأَنْبارِيّ: أن يكون اسمها ضمير الشأن، «كأنه قال: ليس الأمر وليس الشأن»؛ أو أن يكون «رأس طود اسم ليس وينجي خبرها»؛ أو أن تكون «ليس في مذهب (ما) فتستغني عن الاسم والخبر» [@ibn-al-anbari، ص474]."
  - "«والحرة نسق على رأس، ورجلاء نعتها» [@ibn-al-anbari، ص474]."
  - "«مِنْ حِذَارٍ» متعلق بـ«يُنجي»."
morphology:
  - "«مُوائِل» اسم فاعل من «واءل» على «فاعَل»، من «وأل» إذا نجا، ومنه «المَوْئِل»: الملجأ [@ibn-al-anbari، ص473]."
  - "«رَجْلاء» على «فَعْلاء»."
  - "«حِذار» مصدر «حاذر» على «فِعال»."
rhetoric:
  thesis: "لا ملجأ: الجبل والحرّة لا يحميان من غارة."
  devices:
    - title: "تقديم النفي"
      text: "بدأ بـ«لَيْسَ يُنْجِي» قبل ذكر الملاجئ، فسبق النفيُ الأملَ، وجاء «رأس طود وحرة رجلاء» بعد أن بطلت نجاتهما."
    - title: "التدرج"
      text: "ذكر أعلى الملاجئ: رأس الجبل، ثم أصعبها: الحرّة التي يترجّل فيها الناس [@ibn-al-anbari، ص474]. فإذا لم ينج هذان، لم ينج شيء."
  connection: "ثم يقول: فملكنا بذلك الناس حتى ملك المنذر بن ماء السماء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "لَيْسَ يُنْجِي / مُوَائِلَنْ / مِنْ حِذَارِنْ = فاعلاتن / متفع لن / فاعلاتن — رَأْسُ طَوْدِنْ / وَحَرْرَتُنْ / رَجْلَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "آخر حكمة الفوضى (35–36)، ثم يعود إلى بَكْر. وعلى رواية الزَّوْزَنِيّ «ليس ينجي الذي يوائل منا» يصير البيت فخرًا صريحًا: «لم ينج الهارب منا تحصنه بالجبل ولا بالحرّة ... الغليظة الشديدة» [@zawzani، ص278]."
variants:
  - reading: "لَيْسَ يُنْجِي الَّذِي يُوَائِلُ مِنَّا"
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى» [@ibn-al-anbari، ص474]، وهي رواية الزَّوْزَنِيّ [@zawzani، ص278]."
