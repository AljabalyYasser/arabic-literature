first: "فَرَدَدْنَاهُمُ بِطَعْنٍ كَمَا تُنْـ"
second: "ـهَزُ عَنْ جَمَّةِ الطَّوِيِّ الدِّلَاءُ"
meaning: "فرددنا جيش حُجْر بطعن تتحرك فيه الرماح في أجسادهم كما تُحرَّك الدلاء في ماء البئر لتمتلئ. قال ابن الأَنْبارِيّ: «قوله (كما تنهز) أي تحرك الدلاء لتمتلئ» [@ibn-al-anbari، ص497]."
vocabulary:
  - term: "تُنْهَزُ"
    text: "تُحرَّك [@ibn-al-anbari، ص497]؛ وفي اللسان: «نَهَزَه نَهْزاً: دَفَعَهُ وَضَرَبَهُ» [@lisan، ج5 ص421]."
  - term: "جَمَّةِ"
    text: "«كثرة الماء فيه» [@ibn-al-anbari، ص497]؛ «وقال أبو مالك: جمة البئر: الموضع الذي يبلغه الماء من البئر لا يبلغ أكثر منه» [@ibn-al-anbari، ص497]. وهي في اللسان بضم الجيم: «والجُمَّة: الْمَاءُ نَفْسُهُ» [@lisan، ج12 ص105]."
  - term: "الطَّوِيِّ"
    text: "«والطَّوِيُّ: البئرُ المَطْوِيَّة بِالْحِجَارَةِ» [@lisan، ج15 ص19]."
syntax:
  - "«والدلاء اسم ما لم يسم فاعله، والكاف نصب بالفعل» [@ibn-al-anbari، ص497]: أي «الدلاءُ» نائب فاعل «تُنهز»، و«كما» نعت لمصدر «رددناهم»."
  - "«عَنْ جَمَّةِ» متعلق بـ«تنهز»، و«عن» بمعنى «في»، كما في الرواية الأخرى «في جمة»."
morphology:
  - "«تُنْهَزُ» مضارع مبني للمجهول من «نهز»."
  - "«الطَّوِيّ» على «فَعِيل» بمعنى «مفعول»، أي مطويّ بالحجارة."
  - "«الدِّلَاء» جمع «دَلْو» على «فِعال»، همزته منقلبة عن واو."
rhetoric:
  thesis: "صورة الطعن من عمل الماء: الرماح دلاء والأجساد آبار."
  devices:
    - title: "التشبيه في «كَمَا تُنْهَزُ عَنْ جَمَّةِ الطَّوِيِّ الدِّلَاءُ»"
      text: "شبّه تحريك الرماح في الأجساد بتحريك الدلاء في ماء البئر لتمتلئ: الرمح يُدفع ويُهز حتى يمتلئ دمًا كما تمتلئ الدلو ماء. قال الزَّوْزَنِيّ: «فتحركت رماحنا في أجسامهم كما تحرك الدلاء في ماء البئر المطوية بالحجارة» [@zawzani، ص281]. وهو تشبيه هيئة متحركة كالذي في البيت 72."
    - title: "التقابل بين «بِطَعْنٍ» هنا و«بِضَرْبٍ» في البيت 72"
      text: "في الآية الأولى «بِضَرْبٍ كَمَا يَخْرُجُ ... الْمَاءُ»، وفي الثانية «بِطَعْنٍ كَمَا تُنْهَزُ ... الدِّلَاءُ»: صورتان من الماء في معركتين، الأولى للسيف والثانية للرمح."
  connection: "ثم ينتقل إلى الآية الثالثة: وفككنا غل امرئ القيس."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَرَدَدْنَا / هُمُو بِطَعْ / نِنْ كَمَا تُنْ = فعلاتن / متفع لن / فاعلاتن — هَزُ عَنْ جَمْ / مَتِطْ طَوِيْ / يِدْ دِلَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "آخر الآية الثانية. وفي جمة البئر قول ثالث عن الأَصْمَعِيّ: «جمة البئر: الذي قد جم فليس يستقى منه» [@ibn-al-anbari، ص497]، أي الماء الذي اجتمع ولم يُستق بعد."
variants:
  - reading: "وَجَبَهْنَاهُمُ بِطَعْنٍ كَمَا تُنْـ / ـهَزُ فِي جُمَّةِ الطَّوِيِّ الدِّلَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (فجبهناهم) ، أي طعنا جباههم»، «ويروى: (في جمة الطوى)» [@ibn-al-anbari، ص497]؛ وهما معًا عند الزَّوْزَنِيّ [@zawzani، ص281]."
