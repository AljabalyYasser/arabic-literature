first: "أَيَّمَا خُطَّةٍ أَرَدْتُمْ فَأَدُّو"
second: "هَا إِلَيْنَا تَمْشِي بِهَا الْأَمْلَاءُ"
meaning: "أيّ أمر أردتم الفصل فيه فابعثوا به إلينا، يمشي به السفراء وتشهد عليه جماعات الناس. قال ابن الأَنْبارِيّ: «معناه فابعثوا ببيان ذلك إلينا مع السفراء ... فان شهدوا وعرفوا ما ادعيتم كان ذلك لكم، وإن ادعيتم ما لا تعرفه الاملاء فليس بشيء» [@ibn-al-anbari، ص464]."
vocabulary:
  - term: "خُطَّةٍ"
    text: "«الأمر يقع بين القوم يشتجرون فيه» [@tabrizi-ashr، ص263]؛ وعند الزَّوْزَنِيّ «الأمر العظيم الذي يحتاج إلى مخلص منه» [@zawzani، ص276]."
  - term: "فَأَدُّوهَا"
    text: "فأبلغوها، أي ابعثوا ببيانها [@ibn-al-anbari، ص464]."
  - term: "الْأَمْلَاءُ"
    text: "«الجماعات، واحدهم ملأ؛ ولا يكون الملأ إلا رجالا لا امرأة فيهم» [@ibn-al-anbari، ص464]؛ «وقال أبو عبيدة: الملأ الرؤساء والأشداء» [@ibn-al-anbari، ص465]."
syntax:
  - "«وأيما نصب بأردتم، وما صلة، كأنه قال: أي خطة أردتم. ومعنى أي الجزاء، والفاء جواب الجزاء» [@ibn-al-anbari، ص465]."
  - "«وتمشى مرتفع في اللفظ بالياء، ومنتصب في التأويل على الحال من الهاء، والأملاء رفع بتمشي» [@ibn-al-anbari، ص465]."
morphology:
  - "«أَدُّوهَا» أمر من «أدّى» على «فعّل»، مسند إلى واو الجماعة."
  - "«الْأَمْلَاء» جمع «مَلَأ» على «أفعال»، «وهو مقصور مهموز، وربما ترك همزه في الشعر» [@ibn-al-anbari، ص464]."
  - "«خُطَّة» على «فُعْلة» من «خطّ»."
rhetoric:
  thesis: "الثقة بالحق: يدعو الخصم إلى التحكيم والشهود."
  devices:
    - title: "العموم في «أَيَّمَا خُطَّةٍ»"
      text: "«أيّما» شرط عام: أي أمر كان. فهو لا يخاف من أي دعوى ما دام الشهود يعرفون. ويبدأ بالصلح قبل أن يهدد بالنبش في البيت التالي، فيظهر منصفًا."
    - title: "الكناية في «تَمْشِي بِهَا الْأَمْلَاءُ»"
      text: "المشي بالخطة كناية عن السعي بها بين الحيين حتى تُعرض على الناس، كما فسرها ابن الأَنْبارِيّ بالسفراء الذين «يمشون به إلينا» [@ibn-al-anbari، ص464]."
  connection: "ثم يقول: فإن نبشتم ما بين مِلْحة فالصاقب ظهر فيه الأموات والأحياء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَيْيَمَا خُطْ / طَتِنْ أَرَدْ / تُمْ فَأَدْدُو = فاعلاتن / متفع لن / فاعلاتن — هَا إِلَيْنَا / تَمْشِي بِهَلْ / أَمْلَاءُو = فاعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يبدأ هنا عرض الخيارات على تَغْلِب (27–31): الصلح بالبينة، أو النبش، أو الاستقصاء، أو السكوت، أو المنع. فالشاعر لا يرفض الحكم، بل يطلبه. ويفهم الزَّوْزَنِيّ البيت على روايته «تُشفى بها الأملاء» وجهًا آخر: «فوضوا إلى آرائنا كل خصومة» [@zawzani، ص276]، أي نحن أهل الرأي في فصل الخصومات."
variants:
