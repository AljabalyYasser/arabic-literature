    status: "رواية أخرى"
    note: "«ويروى: (أيما خطة أخذتم)» [@ibn-al-anbari، ص464]."
  - reading: "...هَا إِلَيْنَا تُشْفَى بِهَا الْأَمْلَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص275]."
  - reading: "...هَا إِلَيْنَا تَسْعَى بِهَا الْأَمْلَاءُ"
    status: "رواية أخرى"
    note: "«ويروى (تسعى بها الأملاء)» [@tabrizi-ashr، ص263]."
