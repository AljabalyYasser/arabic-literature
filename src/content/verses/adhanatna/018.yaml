first: "زَعَمُوا أَنَّ كُلَّ مَنْ ضَرَبَ الْعَيْـ"
second: "ـرَ مَوَالٍ لَنَا وَأَنَّا الْوَلَاءُ"
meaning: "زعموا أن كل من «ضرب العير» موالٍ لنا، وأننا أصحاب ولائهم، فيُحمّلوننا جناياتهم. وفي «العير» أقوال كثيرة، ومعنى البيت عليها كلها واحد: يحمّلوننا ذنوب الناس جميعًا. قال الزَّوْزَنِيّ: «وتفسير آخر البيت في جميع الأقوال على نمط واحد» [@zawzani، ص273]."
vocabulary:
  - term: "الْعَيْرَ"
    text: "«العير في هذا البيت يفسر: بالسيد، والحمار، والوتد، والقذى، وجبل بعينه» [@zawzani، ص272]."
  - term: "مَوَالٍ"
    text: "عند أبي عَمْرو: «والموالى في هذا الموضع: بنو العم» [@ibn-al-anbari، ص449]، «وقال قوم: الموالى في هذا البيت معناهم الأولياء» [@ibn-al-anbari، ص450]."
  - term: "الْوَلَاءُ"
    text: "«العون واليد» [@ibn-al-anbari، ص451]."
syntax:
  - "«أنّ» وما بعدها سدّت مسدّ مفعولي «زعموا»: «كفت من اسم زعموا وخبره، وكلا اسم أن، وضرب العير صلة من» [@ibn-al-anbari، ص452]."
  - "«وموال رفع لأنه خبر أن، والأصل فيه موالي فاستثقلت الضمة في الياء» [@ibn-al-anbari، ص452]."
  - "«وَأَنَّا الْوَلَاءُ» على حذف المضاف: «معناه وأنا أصحاب الولاء، فحذف الأصحاب وأقام الولاء مقامه» [@ibn-al-anbari، ص451]."
morphology:
  - "«مَوَالٍ» جمع «مَوْلى» على «مَفاعِل»، اسم منقوص حُذفت ياؤه للتنوين."
  - "«الوَلاء» ممدود: «والولاء في العون ممدود» [@ibn-al-anbari، ص451]."
  - "«زَعَمُوا» من الزعم، وهو قول يُحكى ولا يُوثق به."
rhetoric:
  thesis: "يحكي حجة الخصم بكلمة «زعموا» فيبطلها قبل أن يردها."
  devices:
    - title: "الكناية في «مَنْ ضَرَبَ الْعَيْرَ»"
      text: "العبارة لا يُقصد بها فعل واحد بعينه، بل عموم الناس: من ضرب وتدًا، أو ساق حمارًا. ولذلك قال الزَّوْزَنِيّ إن تفسير آخر البيت على الأقوال كلها «على نمط واحد» [@zawzani، ص273]. والكناية عند عبد القاهر الجُرْجانيّ أن المتكلم «لا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الحذف في «وَأَنَّا الْوَلَاءُ»"
      text: "أراد أصحاب الولاء، فحذف المضاف [@ibn-al-anbari، ص451]، فصاروا هم الولاء نفسه؛ وهذا أبلغ في السخرية من زعم الخصم."
    - title: "«زَعَمُوا»"
      text: "بدأ بالزعم، فوسم كلامهم بالبطلان قبل أن يحكيه."
  connection: "ثم يصف كيف دبّروا أمرهم بليل، وأصبحوا في ضجيج."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "زَعَمُوا أَنْ / نَ كُلْلَ مَنْ / ضَرَبَلْ عَيْ = فعلاتن / متفع لن / فعلاتن — رَ مَوَالِنْ / لَنَا وَأَنْ / نَلْ وَلَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "أكثر أبيات القصيدة إشكالًا، حتى قال أبو نصر: «لم يقل الأصمعي في هذا البيت شيئا» [@ibn-al-anbari، ص449]. وفي «العير» خمسة أقوال: الوتد، عند المُفَضَّل وغيره: «يقول: كل من ضرب وتدا في الصحراء فأذنب في الأراقم الزمونا ذنبه»؛ وكُلَيْب وائِل، عن خِراش العِجْلي: «أي جعلتم كل من قتل كليبا أو أعان على قتله ابن عم لنا» [@ibn-al-anbari، ص450]؛ والحمار، وجبل بالمدينة [@ibn-al-anbari، ص451]؛ والقذى في العين [@zawzani، ص272]. وعلى قول كُلَيْب يكون في البيت ذكر لحرب البَسُوس، وخبرها في [أيام العرب](/path/1/ayyam-al-arab/)."
