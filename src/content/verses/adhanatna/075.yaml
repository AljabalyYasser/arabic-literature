first: "ثُمَّ حُجْرًا أَعْنِي ابْنَ أُمِّ قَطَامٍ"
second: "وَلَهُ فَارِسِيَّةٌ خَضْرَاءُ"
meaning: "ثم رددنا حُجْرًا، أعني ابن أم قَطام، ومعه كتيبة خضراء سلاحها من صنع فارس. قال ابن الأَنْبارِيّ: «يقول: الآية الثانية التي صنعنا بحجر، وكان حجر غزا امرأ القيس أبا المنذر بن ماء السماء، بجمع من كندة كثير، وكانت بكر بن وائل مع امرئ القيس، فخرجت إليه بكر بن وائل فردته وقتلت جنوده» [@ibn-al-anbari، ص496]."
vocabulary:
  - term: "قَطَامٍ"
    text: "اسم امرأة، أم حُجْر."
  - term: "فَارِسِيَّةٌ"
    text: "«أي سلاحها من عمل فارس» [@ibn-al-anbari، ص496]."
  - term: "خَضْرَاءُ"
    text: "«معه كتيبة خضراء من كثر السلاح» [@ibn-al-anbari، ص496]؛ وعند الزَّوْزَنِيّ خضراء «لما ركب دروعها وبيضها من الصدأ» [@zawzani، ص281]."
syntax:
  - "«ونصب حجرا بالنسق على الهاء والميم، أي رددنا حجرا» [@ibn-al-anbari، ص496]: أي هو معطوف على ضمير الغائبين في الأبيات قبله، والتقدير: ثم رددنا حُجْرًا."
  - "«أَعْنِي ابْنَ أُمِّ قَطَامٍ» جملة معترضة مفسّرة، و«ابنَ» مفعول «أعني»."
  - "«وَلَهُ فَارِسِيَّةٌ» جملة حالية، و«فارسية» صفة لموصوف محذوف هو الكتيبة."
morphology:
  - "«قَطَامٍ» جاء منوّنًا معربًا، وحقه في لغة أهل الحجاز البناء على الكسر بلا تنوين؛ قال التِّبْرِيزِيّ: «وأجرى قطام بالإعراب لما اضطر رده إلى أصل الأسماء» [@tabrizi-ashr، ص282]."
  - "«فَارِسِيَّة» اسم منسوب إلى «فارس»، مؤنث."
  - "«أَعْنِي» مضارع «عنى يعني» بمعنى أقصد."
rhetoric:
  thesis: "الآية الثانية: عدو مسلّح بسلاح الأعاجم."
  devices:
    - title: "الاعتراض في «أَعْنِي ابْنَ أُمِّ قَطَامٍ»"
      text: "قطع الكلام ليعيّن حُجْرًا بنسبه إلى أمه، لأن في الملوك أكثر من حُجْر؛ فالجملة المعترضة تزيل اللبس في مجلس يعرف الأنساب."
    - title: "الكناية في «فَارِسِيَّةٌ خَضْرَاءُ»"
      text: "حذف الموصوف، الكتيبة، وذكر صفتيها: سلاحها من صنع فارس، ولونها أخضر من كثرة الحديد. فالسامع يفهم ضخامة الجيش وجودة عدته دون أن يُذكر عدده."
  connection: "ثم يصف حُجْرًا: أسد في اللقاء ورد هموس."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "ثُمْمَ حُجْرَنْ / أَعْنِبْنَ أُمْ / مِ قَطَامِنْ = فاعلاتن / مستفع لن / فعلاتن — وَلَهُو فَا / رِسِيْيَتُنْ / خَضْرَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]. و«قَطَامٍ» منوّن في آخر الصدر، والوزن يقتضي التنوين؛ وهو عند التِّبْرِيزِيّ معرب للضرورة [@tabrizi-ashr، ص282]."
context: "أول الآية الثانية (75–77). وحُجْر هنا عدو بَكْر، غزا امرأ القيس أبا المنذر فردّته بَكْر [@ibn-al-anbari، ص496]. وفي «فارسية» عند الزَّوْزَنِيّ قول آخر: «وقيل: بل أراد وله دروع فارسية خضراء لصدئها» [@zawzani، ص281]."
