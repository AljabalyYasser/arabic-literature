first: "وَمَعَ الْجَوْنِ جَوْنِ آلِ بَنِي الْأَوْ"
second: "سِ عَنُودٌ كَأَنَّهَا دَفْوَاءُ"
meaning: "وكان مع الجون، جون آل بني الأوس، كتيبة شديدة كأنها قرن منحنٍ يحمي ما تحته، أو عقاب منقضّة. قال ابن الأَنْبارِيّ: «و (العنود) هاهنا: كتيبة محكمة. و (الدفواء) هاهنا: كتيبة منحنية على من تحتها» [@ibn-al-anbari، ص498]."
vocabulary:
  - term: "الْجَوْنِ"
    text: "«ملك من ملوك كندة، وهو ابن عم قيس بن معد يكرب» [@ibn-al-anbari، ص498]."
  - term: "بَنِي الْأَوْسِ"
    text: "«وبنو الأوس من كندة» [@ibn-al-anbari، ص498]."
  - term: "عَنُودٌ"
    text: "«كتيبة محكمة» [@ibn-al-anbari، ص498]؛ وعند التِّبْرِيزِيّ: «الكتيبة كأنها تعند في سيرها» [@tabrizi-ashr، ص286]."
  - term: "دَفْوَاءُ"
    text: "منحنية؛ ويقال للعقاب «دفواء»: «وَإِنَّمَا قِيلَ للعُقاب دَفْوَاءُ لعَوَج مِنْقارها» [@lisan، ج14 ص263]."
syntax:
  - "«والجون خفض بمع، والعنود رفع بمع، وكأنها دفواء صلة العنود» [@ibn-al-anbari، ص499]: أي «عنود» مبتدأ مؤخر، و«مع الجون» خبر مقدم، وجملة «كأنها دفواء» نعت لـ«عنود»."
  - "«جَوْنِ آلِ بَنِي الْأَوْسِ» بدل من «الجون» الأول: «والجون الثاني بدل من الأول» [@zawzani، ص282]."
morphology:
  - "«عَنُود» صيغة مبالغة على «فَعُول» من «عند»؛ وفي اللسان: «العَنُودُ والعَنِيدُ بِمَعْنًى» [@lisan، ج3 ص307]."
  - "«دَفْوَاء» على «فَعْلاء»، مؤنث «أدفى»: «والأدفى من القرون المنحنية: الذي قد انحنى» [@ibn-al-anbari، ص499]."
rhetoric:
  thesis: "عدو آخر عظيم: كتيبة منحنية على ملكها تحميه."
  devices:
    - title: "التشبيه في «كَأَنَّهَا دَفْوَاءُ»"
      text: "في وجهه قولان عند ابن الأَنْبارِيّ: كتيبة منعطفة على ملكها كالقرن المنحني الذي «يمنع ما تحته ولا يوصل إليه» [@ibn-al-anbari، ص499]؛ أو عُقاب: «كما تنقض العُقاب على الصيد كذلك تميل هذه الكتيبة من بغيها» [@ibn-al-anbari، ص499]. وفي الحالين صورة حركة: انحناء للحماية أو انقضاض للهجوم."
    - title: "التكرار في «الْجَوْنِ جَوْنِ آلِ بَنِي الْأَوْسِ»"
      text: "يكرر الاسم ليعيّن صاحبه بنسبه، كما فعل في «حُجْرًا أَعْنِي ابْنَ أُمِّ قَطَامٍ»؛ فالحارِث يدقق في أسماء خصوم بَكْر لأن الملك يعرفهم."
  connection: "ثم يقول: ما جزعنا تحت العجاجة."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَمَعَلْ جَوْ / نِ جَوْنِ آ / لِ بَنِلْ أَوْ = فعلاتن / متفع لن / فعلاتن — سِ عَنُودُنْ / كَأَنْنَهَا / دَفْوَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "خبر الجون عند ابن الأَنْبارِيّ أنه «جاء يمنع بني عمرو بن حُجر آكل المرار ومعه كتيبة خشناء، فهزمته بكر وأخذوا ابن الجون فأتوا به المنذر» [@ibn-al-anbari، ص498]. فالبيت يتصل بالبيت 80: كتيبة الجون جاءت تحمي الملوك التسعة."
