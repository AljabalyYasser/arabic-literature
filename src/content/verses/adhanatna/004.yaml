first: "فَرِيَاضُ الْقَطَا فَأَوْدِيَةُ الشُّرْ"
second: "بُبِ فَالشُّعْبَتَانِ فَالْأَبْلَاءُ"
meaning: "وكان عهده بها كذلك في رياض القطا، وأودية الشُّرْبُب، والشُّعْبتين، والأَبْلاء. قال ابن الأَنْبارِيّ: «خبر إنه قد كان يعهد من يواصله في هذه المواضع كلها، ثم تحملوا عنها وخلَّفوها خاوية» [@ibn-al-anbari، ص436]."
vocabulary:
  - term: "رِيَاضُ الْقَطَا"
    text: "رياض بعينها يدوم فيها الماء، «تعشب فتألفها الطير لذلك» [@ibn-al-anbari، ص435]. والروضة أرض النبت: «لا يقال في الشجر روضة، إنما الروضة في النبت، والحديقة في الشجر» [@ibn-al-anbari، ص435]. والقطا: طائر."
  - term: "الشُّرْبُبِ"
    text: "«جبل» [@ibn-al-anbari، ص435]."
  - term: "الشُّعْبَتَانِ"
    text: "«أكمة لها قرنان ناتئان. والأكمة جبل من الرمل» [@ibn-al-anbari، ص436]."
  - term: "الْأَبْلَاءُ"
    text: "«اسم بئر» [@ibn-al-anbari، ص436]."
syntax:
  - "«والرياض وما بعدها من أسماء المواضع نسق على الخلصاء» [@ibn-al-anbari، ص436]."
  - "«أَوْدِيَةُ الشُّرْبُبِ» إضافة، و«الشُّعْبَتَانِ» مرفوع بالألف لأنه مثنى."
morphology:
  - "«رِيَاض» جمع «رَوْضة»، وأصلها «رِواض» كما يقول ابن الأَنْبارِيّ [@ibn-al-anbari، ص435]، قُلبت الواو ياء لانكسار ما قبلها."
  - "«أَوْدِيَة» جمع «وادٍ» على «أَفْعِلة»."
  - "«الشُّعْبَتَان» مثنى «شُعْبة»، وهي الفرع."
rhetoric:
  thesis: "ختام المواضع: أسماء فيها ماء ونبت وطير، فالذكرى خضراء، ثم يأتي في البيت التالي الخلاء."
  devices:
    - title: "الجمع موضع المفرد في «أَوْدِيَةُ الشُّرْبُبِ»"
      text: "الشُّرْبُب جبل واحد، وقال «أودية» بالجمع. قال الأَصْمَعِيّ: «إنما أراد بوادي الشُّربب، فاضطره الشعر إلى الجمع»، «وقال غيره: العرب توقع الجمع على الواحد» [@ibn-al-anbari، ص436]."
    - title: "الخصب قبل الخلاء"
      text: "اختار من المواضع «رياض القطا»، وهي أرض «تعشب فتألفها الطير» [@ibn-al-anbari، ص435]. فآخر صورة من عهد أسماء صورة خصب، ليشتد الحزن حين يرى المنازل خالية في البيت التالي."
  connection: "ثم يقول: لا أرى من عهدت فيها، فيبكي، ويعلم أن البكاء لا يرد شيئًا."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَرِيَاضُلْ / قَطَا فَأَوْ / دِيَةُشْشُرْ = فعلاتن / متفع لن / فعلاتن — بُبِ فَشْشُعْ / بَتَانِ فَلْ / أَبْلَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "آخر أبيات المواضع، وبه يتم المعنى الذي بدأ في البيت الثاني: عهد طويل في أماكن كثيرة، ثم رحيل. قال الزَّوْزَنِيّ في هذا البيت والذي قبله: «هذه كلها مواضع عهدها بها. يقول: قد عزمت على مفارقتنا بعد طول العهد» [@zawzani، ص269]."
variants:
  - reading: "فَرِيَاضُ الْقَطَا فَأَوْدِيَةُ الشُّرْ / بَبِ فَالشُّعْبَتَانِ فَالْأَبْلَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (الشرْبَب) ، بفتح الباء الأولى» [@ibn-al-anbari، ص435]."
