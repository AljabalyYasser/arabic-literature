first: "أَوْقَدَتْهَا بَيْنَ الْعَقِيقِ فَشَخْصَيْـ"
second: "ـنِ بِعُودٍ كَمَا يَلُوحُ الضِّيَاءُ"
meaning: "أوقدت هند نارها بين العقيق وشَخْصين، بعود الطيب، فلاحت كما يلوح الضوء. رأى النار أولًا في العلياء، «ولم يدر أين موضعها من العلياء، حتى تأملها فعلم أين هي» [@ibn-al-anbari، ص438]."
vocabulary:
  - term: "الْعَقِيقِ"
    text: "«مكان» [@ibn-al-anbari، ص438]."
  - term: "شَخْصَيْنِ"
    text: "«وشخصان: أكمة لها شعبتان» [@ibn-al-anbari، ص438]."
  - term: "بِعُودٍ"
    text: "«أراد الذي يُتبخر به» [@ibn-al-anbari، ص438]، أي عود الطيب."
  - term: "الضِّيَاءُ"
    text: "«الضوء» [@ibn-al-anbari، ص438]؛ وفيه قولان: «قيل: يعني ضياء الفجر، وقيل: يعني ضياء النار» [@tabrizi-ashr، ص253]."
syntax:
  - "«وفاعل أوقدت مضمر فيه من ذكر هند، والهاء والألف تعودان على النار» [@ibn-al-anbari، ص438]، «وشخصين نسق على العقيق» [@ibn-al-anbari، ص438]."
  - "«كَمَا يَلُوحُ الضِّيَاءُ»: الكاف «في موضع نصب؛ لأنها نعت لمصدر محذوف، والمعنى: أوقدتها إيقادا مثل ما يلوح الضياء» [@tabrizi-ashr، ص253]."
  - "و«ما» مصدرية: «ويلوح الضياء صلتها، ولا عائد لها لأنها في معنى المصدر» [@ibn-al-anbari، ص439]."
morphology:
  - "«شَخْصَيْنِ» مثنى «شَخْص»، علم على موضع، مجرور بالياء."
  - "«الضِّيَاء» مصدر «ضاء يضوء»، أصله «ضِواء»، قُلبت الواو ياء لانكسار ما قبلها."
  - "«العَقِيق» على «فَعِيل»، علم على موضع."
rhetoric:
  thesis: "نار طيبة الرائحة: الحب يحوّل نار الصحراء إلى بخور."
  devices:
    - title: "التشبيه في «كَمَا يَلُوحُ الضِّيَاءُ»"
      text: "شبّه لمعان النار بلمعان الضوء، والشبه فيه ظاهر في البصر، فهو من التشبيه الذي يكون عند عبد القاهر الجُرْجانيّ «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "المبالغة في «بِعُودٍ»"
      text: "توقَد النار في الصحراء بالحطب، لكنه جعلها توقَد بعود الطيب تعظيمًا لصاحبتها. ويرى ابن الأَنْبارِيّ في ذلك صنعة شعراء: «ولكن الشعراء قالوا في ذلك فأكثروا» [@ibn-al-anbari، ص438]."
  connection: "ثم ينظر إلى النار من بعيد، ويطمع أن يصطلي بها، فيعلم أنها بعيدة."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَوْقَدَتْهَا / بَيْنَلْ عَقِي / قِ فَشَخْصَيْ = فاعلاتن / مستفع لن / فعلاتن — نِ بِعُودِنْ / كَمَا يَلُو / حُضْضِيَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "يتأمل النار حتى يعرف موضعها: كانت في العلياء، ثم صارت بين العقيق وشخصين، ثم بخَزاز في البيت التالي. فالأبيات 6–8 نظرة تقترب من النار ولا تبلغها. وقد استغرب ابن الأَنْبارِيّ أن توقَد بالعود: «ولعل هذه المرأة التي ذكر لم تر عودا قط، ولكن الشعراء قالوا في ذلك فأكثروا. وما جعلوها كذلك إلا لحبهم موقدي النار» [@ibn-al-anbari، ص438]. وهذا البيت عند الزَّوْزَنِيّ بعد «فتنورت نارها» لا قبله [@zawzani، ص270]."
variants:
  - reading: "أَوْقَدَتْهَا بَيْنَ الْعَقِيقِ فَشَخْصٍ / ذِي قِضِينٍ كَمَا يَلُوحُ الضِّيَاءُ"
    status: "رواية أخرى"
    note: "«ويروى» [@ibn-al-anbari، ص438]؛ «والقضين: جمع قضة، وهي شجرة» [@ibn-al-anbari، ص438]. ويروى أيضًا: «(أوقدتها بين العقيق وذي السدر) . وذو السدر: موضع» [@ibn-al-anbari، ص438]."
