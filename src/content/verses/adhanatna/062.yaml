first: "فَهَدَاهُمْ بِالْأَسْوَدَيْنِ وَأَمْرُ الْـ"
second: "ـلَٰهِ بِلْغٌ يَشْقَى بِهِ الْأَشْقِيَاءُ"
meaning: "فقاد الملك أصحابه وزادُهم التمر والماء، وأمر الله بالغ نافذ، يشقى به من كُتب عليه الشقاء. قال ابن الأَنْبارِيّ: «معناه: هدى عمرو بن هند أصحابه وجمعهم حين غزا بهم» [@ibn-al-anbari، ص489]."
vocabulary:
  - term: "هَدَاهُمْ"
    text: "قادهم وتقدمهم: «هداهم أي تقدمهم» [@zawzani، ص279]."
  - term: "الْأَسْوَدَيْنِ"
    text: "«التمر والماء» [@ibn-al-anbari، ص489]؛ وفي اللسان: «والأَسْوَدان: التَّمْرُ وَالْمَاءُ، وَقِيلَ: الْمَاءُ وَاللَّبَنُ» [@lisan، ج3 ص226]."
  - term: "بِلْغٌ"
    text: "بالغ نافذ: «وأَمرٌ بالِغٌ وبَلْغٌ: نافِذٌ يَبْلُغُ أَين أُرِيدَ به» [@lisan، ج8 ص420]، وأنشد البيت بفتح الباء. وقال الحِرْمازيّ فيما ينقل ابن الأَنْبارِيّ: «بلغ معناه نافذ يبلغ حيث يشاء» [@ibn-al-anbari، ص490]."
syntax:
  - "«والأمر رفع ببلغ، ويشقى موضعه رفع في التأويل على الاتباع لبلغ، ويجوز أن يكون منصوبا على الحال مما في بلغ» [@ibn-al-anbari، ص490]: أي «أمرُ الله» مبتدأ خبره «بلغ»، وجملة «يشقى به الأشقياء» نعت لـ«بلغ» أو حال."
  - "«بِالْأَسْوَدَيْنِ» متعلق بـ«هداهم»، والباء للمصاحبة: قادهم ومعهم التمر والماء."
morphology:
  - "«الْأَسْوَدَيْنِ» مثنى «أسود» على التغليب: «وإنما قيل لهما أسودان وواحدهما ابيض لأن العرب تغلب أحد الاسمين على الآخر» [@ibn-al-anbari، ص489]."
  - "«بِلْغ» على «فِعْل»، صفة بمعنى «بالغ»، ويقال «بَلْغ» بالفتح [@lisan، ج8 ص420]."
  - "«الْأَشْقِيَاء» جمع «شقيّ» على «أفعلاء»."
rhetoric:
  thesis: "جيش متقشف يقوده القدر."
  devices:
    - title: "التغليب في «الْأَسْوَدَيْنِ»"
      text: "التمر أسود والماء لا لون له، فسُمّيا باسم أحدهما؛ ومثّل له ابن الأَنْبارِيّ بقولهم «سنة العمرين» لأبي بكر وعمر [@ibn-al-anbari، ص489]، و«القمران» للشمس والقمر [@ibn-al-anbari، ص490]. والكلمة تقول إن جيش الملك خرج بأبسط الزاد، فلا ترف فيه ولا ثقل."
    - title: "الجناس في «يَشْقَى بِهِ الْأَشْقِيَاءُ»"
      text: "الفعل وفاعله من جذر واحد: يشقى الأشقياء. والعجز حكم عام يصلح مثلًا، وأنشده اللسان شاهدًا [@lisan، ج8 ص420]. وفيه تعريض بتَغْلِب: هم الأشقياء الذين ساقهم القدر إلى هذا الجيش."
  connection: "ثم يقول: إذ تمنيتم لقاءهم غرورًا، فساقتهم إليكم أمنيتكم."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَهَدَاهُمْ / بِلْأَسْوَدَيْ / نِ وَأَمْرُلْ = فعلاتن / مستفع لن / فعلاتن — لَاهِ بِلْغُنْ / يَشْقَى بِهِلْ / أَشْقِيَاءُو = فاعلاتن / مستفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]. وتنتهي تفعيلة الصدر الأخيرة باللام الأولى من لفظ الجلالة، فقسمنا الشطرين «الْـ / ـلَٰهِ»؛ وفي ابن الأَنْبارِيّ «اللّ ... هـ» [@ibn-al-anbari، ص489]."
context: "يصف قيادة الملك لجيشه في الغزوة. وعند الزَّوْزَنِيّ معنى قريب: «وكان يتقدمهم ومعه زادهم من الماء والتمر» [@zawzani، ص279]."
variants:
  - reading: "فَهَدَاهُمْ بِالْأَبْيَضَيْنِ وَأَمْرُ الْـ"
    status: "رواية أخرى"
    note: "«ويروى (فهداهم بالأبيضين) وأراد بالأبيضين الخبز والماء» [@tabrizi-ashr، ص277]."
  - reading: "ـلَٰهِ بَلْغٌ يَشْقَى بِهِ الْأَشْقِيَاءُ"
    status: "رواية التِّبْرِيزِيّ واللسان"
    note: "بفتح الباء [@tabrizi-ashr، ص277] [@lisan، ج8 ص420]."
  - reading: "ـلَٰهِ بِلْغٌ تَشْقَى بِهِ الْأَشْقِيَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص279]."
