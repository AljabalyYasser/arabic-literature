first: "يَخْلِطُونَ الْبَرِيءَ مِنَّا بِذِي الذَّنْـ"
second: "ـبِ وَلَا يَنْفَعُ الْخَلِيَّ الْخَلَاءُ"
meaning: "يسوّون بين البريء منا والمذنب، ولا ينفع البريءَ براءتُه. قال ابن الأَنْبارِيّ: «يخلطون، معناه يشوبون ذا الذنب بالذي لا ذنب له، ظلما لنا وإساءة بنا؛ فهذا عين الجور»، و«معناه ولا ينفع البريء من الذنب براءته منه» [@ibn-al-anbari، ص448]."
vocabulary:
  - term: "يَخْلِطُونَ"
    text: "«يشوبون ذا الذنب بالذي لا ذنب له» [@ibn-al-anbari، ص448]."
  - term: "الْخَلِيَّ"
    text: "«البريء الخالي من الذنب» [@zawzani، ص272]."
  - term: "الْخَلَاءُ"
    text: "«بفتح الخاء: البراءة والترك» [@ibn-al-anbari، ص448]."
syntax:
  - "«يخلطون موضعه رفع في اللفظ بالياء، وموضعه في التأويل نصب على الحال، كأنه قال: خالطين» [@ibn-al-anbari، ص449]."
  - "«والخلاء رفع بينفع، والخلى نصب به» [@ibn-al-anbari، ص449]؛ أي «الخلاء» فاعل مؤخر، و«الخليّ» مفعول به مقدم."
  - "«مِنَّا» متعلق بحال من «البريء»، و«بذي الذنب» متعلق بـ«يخلطون»."
morphology:
  - "«الْبَرِيء» «مهموز لأنه فعيل من بريء من الذنب براءة» [@ibn-al-anbari، ص449]."
  - "«الْخَلِيّ» غير مهموز: «إنما هو فعيل من الخلوة، كأن الأصل فيه الخليو» [@ibn-al-anbari، ص449]، اجتمعت الياء والواو وسبقت إحداهما بالسكون فقُلبت الواو ياء وأُدغمت."
  - "«الخَلاء» و«البَراء» يبقيان بلفظ واحد للمثنى والجمع والمؤنث: «كقولك: نحن الخلاء والبراء منك» [@ibn-al-anbari، ص449]."
rhetoric:
  thesis: "الظلم في صورة خلط: البريء والمذنب في كفة واحدة."
  devices:
    - title: "الجناس في «الْخَلِيَّ الْخَلَاءُ»"
      text: "كلمتان من أصل واحد متجاورتان، فيلتفت السامع إلى أن البراءة لا تنفع صاحبها مع أنها صفته واسمه. وهذا ما يسمى جناس الاشتقاق: أن تأتي بكلمتين من أصل واحد."
    - title: "الطباق بين «الْبَرِيءَ» و«ذِي الذَّنْبِ»"
      text: "ضدان في شطر واحد، وفعل «يخلطون» يجمعهما؛ فالبيت يصور الجور: جمع ما يجب أن يُفرّق."
  connection: "ثم يذكر زعمهم: كل من ضرب العير موالٍ لنا."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "يَخْلِطُونَلْ / بَرِيءَ مِنْ / نَا بِذِذْذَنْ = فاعلاتن / متفع لن / فاعلاتن — بِ وَلَا يَنْ / فَعُلْخَلِيْ / يَلْخَلَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "أول تهمة يردها: تَغْلِب لا تفرق بين من أذنب ومن لم يذنب. وهذا أساس الحجة كلها: بَكْر بريئة مما أصاب رهائن تَغْلِب، ولذلك حكم الملك في آخر الخبر «أنه لا يلزم بكر ابن وائل ما حدث على رهائن تغلب» [@aghani-dk، ج11 ص49]."
variants:
  - reading: "...وَلَا يَنْفَعُ الْخَلِيَّ الْخِلَاءُ"
    status: "رواية أبي جعفر"
    note: "«وروى أبو جعفر وغيره» ... «بكسر الخاء، وقال: الخلاء المتاركة» [@ibn-al-anbari، ص448]."
