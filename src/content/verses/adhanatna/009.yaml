first: "غَيْرَ أَنِّي قَدْ أَسْتَعِينُ عَلَى الْهَـ"
second: "ـمِّ إِذَا خَفَّ بِالثَّوِيِّ النَّجَاءُ"
meaning: "لكني أستعين على همّي، حين يضطر المقيم إلى الرحيل مسرعًا، بناقة سريعة يصفها في البيت التالي. قال الزَّوْزَنِيّ: «يقول: ولكني أستعين على إمضاء همي وقضاء أمري إذا أسرع المقيم في السير لعظم الخطب وفظاعة الخوف» [@zawzani، ص270]."
vocabulary:
  - term: "غَيْرَ أَنِّي"
    text: "«معناه إلا أني» [@ibn-al-anbari، ص440]، أي لكني."
  - term: "خَفَّ"
    text: "«معناه مضى وذهب» [@ibn-al-anbari، ص440]."
  - term: "الثَّوِيِّ"
    text: "«وهو المقيم» [@ibn-al-anbari، ص440]."
  - term: "النَّجَاءُ"
    text: "«الانطلاق والانكماش» [@ibn-al-anbari، ص440]، أي الإسراع في السير."
syntax:
  - "«غَيْرَ» منصوبة على الاستثناء: «فلما وضعت غير في موضع إلا نصب على الاستثناء» [@ibn-al-anbari، ص440]، وهو استثناء منقطع: «وهذا استثناء ليس من الأول» [@tabrizi-ashr، ص254]."
  - "وفتحتها عند البغدادي «إما حركة إعراب وإما فتحة بناء بنيت لإضافتها إلى مبني» [@khizana، ج3 ص417]، وهو موضع الشاهد في البيت عنده [@khizana، ج3 ص414]."
  - "«إِذَا» ظرف متعلق بـ«أستعين»، و«النَّجَاءُ» فاعل «خفّ»، والباء في «بالثوي» «للتعدية» [@zawzani، ص270]: أي أزعج النجاءُ المقيمَ وحمله على الرحيل."
morphology:
  - "«الثَّوِيّ» على «فَعِيل» للمبالغة: «والثوي مبالغة ثاو أي مقيم» [@khizana، ج3 ص417]."
  - "«النَّجاء» ممدود، «والغالب عليه المد وربما قصر في الشعر» [@ibn-al-anbari، ص440]."
  - "«أَسْتَعِين» على «أستفعل» من العون، والسين والتاء للطلب."
rhetoric:
  thesis: "بيت تخلص: ينقطع الحزن بكلمة «غير»، ويبدأ الفعل."
  devices:
    - title: "الاستدراك في «غَيْرَ أَنِّي»"
      text: "«غير» هنا بمعنى «لكن»: نار لا تُبلغ، غير أني لا أستسلم. ويعلّقه البغدادي بقوله «وما يرد البكاء»: «أي: وما يرد على بكائي بعد أن تباعدت عني فاهتممت بذلك لكني أستعين على همي بهذه الناقة» [@khizana، ج3 ص417]."
    - title: "الكناية في «خَفَّ بِالثَّوِيِّ النَّجَاءُ»"
      text: "إذا أسرع المقيم في الرحيل فقد وقع أمر عظيم. فالصورة كناية عن شدة الخطب وكثرة الخوف، كما فسرها الزَّوْزَنِيّ [@zawzani، ص270]، لا عن السفر نفسه. والكناية عند عبد القاهر الجُرْجانيّ أن تجيء «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يصف الأداة التي يستعين بها: ناقة كأنها نعامة."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "غَيْرَ أَنْنِي / قَدْ أَسْتَعِي / نُ عَلَلْ هَمْ = فاعلاتن / مستفع لن / فعلاتن — مِ إِذَا خَفْ / فَ بِثْثَوِيْ / يِنْنَجَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]. ويقرأ البغدادي «قد أستعين» «بنقل حركة الهمزة إلى دال قد» [@khizana، ج3 ص417]، أي «قَدَ اسْتَعِينُ»، فتصير التفعيلة الثانية «متفع لن»؛ والوزن يستقيم بالوجهين."
context: "بيت التخلص، وهو انتقال الشاعر من غرض إلى غرض: يخرج فيه من النسيب إلى وصف الناقة. قال الزَّوْزَنِيّ: «انتقل من النسيب إلى ذكر حاله في طلب المجد» [@zawzani، ص270]. وقال البغدادي: «وبهذا البيت خرج من صفة النساء وصار إلى صفة ناقته على طريقة الاستثناء المنقطع» [@khizana، ج3 ص417]."
