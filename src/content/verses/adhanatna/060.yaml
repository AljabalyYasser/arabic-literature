first: "إِذْ أَحَلَّ الْعَلَاةَ قُبَّةَ مَيْسُو"
second: "نَ فَأَدْنَى دِيَارِهَا الْعَوْصَاءُ"
meaning: "وكان ذلك حين أنزل الملك قبة ميسون، بنت الملك الغسّانيّ، في العلاة، وأقرب ديارها العوصاء. قال ابن الأَنْبارِيّ: «والمعنى: لما قدم عمرو بن هند بميسون الغسانية وقد قتل أباها أنزلها العلياء» [@ibn-al-anbari، ص489]."
vocabulary:
  - term: "أَحَلَّ"
    text: "أنزل: «ويقال: قد أحل الرجل منزل، إذا أنزله فيه» [@ibn-al-anbari، ص489]."
  - term: "الْعَلَاةَ"
    text: "موضع: «والعلاة: قريبة من العوصاء» [@tabrizi-ashr، ص276]."
  - term: "مَيْسُونَ"
    text: "«بنت الغساني التي قتل أباها وأخذها وقبتها وقدم بها» [@ibn-al-anbari، ص489]؛ وفي اللسان: «ومَيْسُونُ: اسْمُ امرأَة»، وأنشد البيت [@lisan، ج6 ص224]."
  - term: "الْعَوْصَاءُ"
    text: "«ارض اقرب دار، أنزلها عمرو بميسون حين أخرجها من الشام» [@ibn-al-anbari، ص489]."
syntax:
  - "«وإذ معناه لما أحل المنذر العلاة قبة ميسون. وأدنى رفع بالعوصاء، والعوصاء به» [@ibn-al-anbari، ص489]: أي «إذ» ظرف متعلق بما قبله، و«أدنى ديارها» و«العوصاء» مبتدأ وخبر."
  - "«أَحَلَّ» يتعدى إلى مفعولين: «وعدَّى (أحل) إلى مفعولين» [@tabrizi-ashr، ص276]؛ والمفعول الأول «قبة ميسون»، والثاني «العلاة»، وقُدّم الثاني."
morphology:
  - "«أَحَلَّ» على «أفعل» من «حلّ يحِلّ»، والهمزة للتعدية: «وقد حل الرجل يحل حلولا» [@ibn-al-anbari، ص489]."
  - "«مَيْسُون» علم مؤنث على «فَيْعُول»: «فَهُوَ عَلَى هَذَا فَيْعُولٌ صَحِيحٌ» [@lisan، ج6 ص224]."
  - "«الْعَوْصَاء» على «فَعْلاء»."
rhetoric:
  thesis: "صورة الغنيمة الملكية: قبة ابنة الملك المقتول تُنصب في أرض المنتصر."
  devices:
    - title: "المجاز المرسل في «قُبَّةَ مَيْسُونَ»"
      text: "ذكر القبة وأراد صاحبتها: أُنزلت ميسون مع قبتها، فالقبة علامة الملك التي انتُزعت مع صاحبتها."
    - title: "صدى المطلع في «فَأَدْنَى دِيَارِهَا الْعَوْصَاءُ»"
      text: "يختم البيت بعبارة البيت الثاني نفسها: «فَأَدْنَى دِيَارِهَا الْخَلْصَاءُ». هناك ديار أسماء التي رحلت، وهنا ديار ميسون التي سُبيت: المرأة البعيدة في النسيب صارت المرأة المأخوذة في الحرب."
  connection: "ثم يقول: فتجمعت له صعاليك من كل حي."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "إِذْ أَحَلْلَلْ / عَلَاةَ قُبْ / بَةَ مَيْسُو = فاعلاتن / متفع لن / فعلاتن — نَ فَأَدْنَى / دِيَارِهَلْ / عَوْصَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "في هذا البيت ينتقل الحارِث من تَغْلِب التي أبت الغزو إلى غزوة الملك على غسّان. والخبر عند ابن الأَنْبارِيّ أن عَمْرو بن هند لما فرغ من تَغْلِب «أقبل يريد الغسانيين، فمر ببعض مدن الشام فقتل ملكا من ملوكهم، وأخذ بنتا له وكان اسمها ميسون، واستنقذ أخاه امرأ القيس بن المنذر بن ماء السماء» [@ibn-al-anbari، ص488]. ويقول ابن الأَنْبارِيّ في الإعراب «لما أحل المنذر» [@ibn-al-anbari، ص489]، فيسمي الملك «المنذر» كما في البيت السابق."
variants:
