first: "مَلِكٌ مُقْسِطٌ وَأَكْمَلُ مَنْ يَمْـ"
second: "ـشِي وَمِنْ دُونِ مَا لَدَيْهِ الثَّنَاءُ"
meaning: "هو ملك عادل، أكمل من يمشي على الأرض، وما نثني به عليه دون ما عنده. قال ابن الأَنْبارِيّ: «معناه الثناء بنا عليه اقل مما فيه، وعنده من الخير والمعروف أكثر مما نصف ونثني عليه» [@ibn-al-anbari، ص492]."
vocabulary:
  - term: "مُقْسِطٌ"
    text: "«العادل» [@ibn-al-anbari، ص491]؛ وفي اللسان: «أَقْسَطَ يُقْسِطُ، فَهُوَ مُقْسِطٌ إِذا عدَل، وقَسَطَ يَقْسِطُ، فَهُوَ قاسِطٌ إِذا جارَ» [@lisan، ج7 ص377]."
  - term: "أَكْمَلُ مَنْ يَمْشِي"
    text: "«يريد به عقلا ورأيا» [@ibn-al-anbari، ص492]."
  - term: "الثَّنَاءُ"
    text: "المدح."
syntax:
  - "«والملك رفع بإضمار هو، والثناء رفع بمن» [@ibn-al-anbari، ص492]: أي «ملكٌ» خبر لمبتدأ محذوف تقديره «هو»، و«الثناء» مبتدأ مؤخر خبره «من دون ما لديه»."
  - "«مِنْ دُونِ» بكسر النون لأنها مجرورة بـ«من»؛ وفي نسخة الشاملة «دونَ» بالفتح، والصواب ما عند الزَّوْزَنِيّ والتِّبْرِيزِيّ [@zawzani، ص275] [@tabrizi-ashr، ص279]."
morphology:
  - "«مُقْسِط» اسم فاعل من «أقسط» على «أفعل»، والهمزة فيه للسلب: «فكأَن الْهَمْزَةَ فِي أَقْسَطَ للسَّلْب» [@lisan، ج7 ص377]، أي أزال القَسْط الذي هو الجور."
  - "«أَكْمَل» اسم تفضيل على «أفعل»، مضاف إلى «مَن» فيعم الناس."
rhetoric:
  thesis: "أول المدح: العدل، ثم الكمال، ثم العجز عن الوصف."
  devices:
    - title: "الطباق الخفي في «مُقْسِطٌ»"
      text: "المقسط العادل والقاسط الجائر، من جذر واحد؛ واستشهد ابن الأَنْبارِيّ بالآيتين: «إنَّ الله يُحِبُّ المقْسِطِين» و«وأما القاسطون فكانوا لجهنَّم حَطَباً» [@ibn-al-anbari، ص492]. فوصف الملك بالإقساط في خصومة يطلب فيها الحارِث العدل تذكير له بما يُنتظر منه."
    - title: "المبالغة في «وَمِنْ دُونِ مَا لَدَيْهِ الثَّنَاءُ»"
      text: "يقول إن المدح نفسه قاصر، فيجعل عجزه عن الوصف وصفًا؛ وهذا أبلغ من تعداد الفضائل."
  connection: "ثم يقول: إرميّ بمثله جالت الجن."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "مَلِكُنْ مُقْ / سِطُنْ وَأَكْ / مَلُ مَنْ يَمْ = فعلاتن / متفع لن / فعلاتن — شِي وَمِنْ دُو / نِ مَا لَدَيْ / هِثْ ثَنَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]."
context: "أول المدح الصريح: «وإنما يمدح بهذا عمرو بن هند» [@ibn-al-anbari، ص492]. وهذا البيت والذي بعده يأتيان عند الزَّوْزَنِيّ في موضع متقدم، بعد البيت 26، والثاني منهما قبل الأول [@zawzani، ص275]."
variants:
  - reading: "مَلِكٌ بَاسِطٌ وَأَكْمَلُ مَنْ يَمْـ"
    status: "رواية أخرى"
    note: "«(ملك باسط) ، أي منبسط الأمر، قد بسط عدله في الناس» [@ibn-al-anbari، ص492]."
  - reading: "مَلِكٌ مُقْسِطٌ وَأَكْرَمُ مَنْ يَمْـ"
    status: "رواية أخرى"
    note: "«(أكرم من يمشي) أي فعلا» [@ibn-al-anbari، ص492]."
  - reading: "مَلِكٌ مُقْسِطٌ وَأَفْضَلُ مَنْ يَمْـ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص275]."
  - reading: "مَلِكًا مُقْسِطًا وَأَكْمَلَ مَنْ يَمْـ"
    status: "رواية بالنصب"
    note: "«ويروى بالنصب» [@tabrizi-ashr، ص279]."
