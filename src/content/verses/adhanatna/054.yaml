first: "تَرَكُوهُمْ مُلَحَّبِينَ فَآبُوا"
second: "بِنِهَابٍ يَصَمُّ فِيهِ الْحُدَاءُ"
meaning: "تركوا بني رِزاح مقطّعين بالسيوف، ورجعوا بغنائم كثيرة لها ضجيج ورغاء لا يُسمع معه الحُداء. قال ابن الأَنْبارِيّ: «معناه أن الإبل والمواشي التي أخذت من بني رزاح لها جلبة» [@ibn-al-anbari، ص485]، «فجلبتها أكثر من أن يسمع فيها الحداء» [@ibn-al-anbari، ص486]."
vocabulary:
  - term: "مُلَحَّبِينَ"
    text: "«مقطعين بالسيوف» [@ibn-al-anbari، ص485]؛ وفي اللسان: «والمُلَحَّبُ: المُقَطَّعُ» [@lisan، ج1 ص736]."
  - term: "آبُوا"
    text: "«رجعوا» [@ibn-al-anbari، ص485]."
  - term: "نِهَابٍ"
    text: "«ما انتهبوا من أموال بني رزاح» [@ibn-al-anbari، ص485]."
  - term: "الْحُدَاءُ"
    text: "غناء الحادي الذي يسوق الإبل."
syntax:
  - "«وملحبين نصب على الحال من الهاء والميم، والحداء رفع بيصم» [@ibn-al-anbari، ص486]."
  - "جملة «يَصَمُّ فِيهِ الْحُدَاءُ» نعت لـ«نهاب»."
morphology:
  - "«مُلَحَّبِين» اسم مفعول من «لحّب» على «فعّل»، والتضعيف للتكثير."
  - "«نِهَاب» جمع «نَهْب» على «فِعال»."
  - "«يَصَمُّ» مضارع «صَمّ» اللازم، أي يصير أصمّ؛ ويروى «يُصِمُّ» من «أصمّ» المتعدي: «يقال أصممتهم، إذا صادفتهم صما» [@ibn-al-anbari، ص486]."
rhetoric:
  thesis: "صوت الغنيمة: الكثرة تُعرف بالضجيج."
  devices:
    - title: "المجاز العقلي في «يَصَمُّ فِيهِ الْحُدَاءُ»"
      text: "الحداء لا يصمّ، وإنما يصمّ عنه سامعه لكثرة الضجيج. قال التِّبْرِيزِيّ: «وحقيقته (يصم منه سامع الحداء) وهو مجاز» [@tabrizi-ashr، ص274]، «كما يقال: نام ليلك» [@tabrizi-ashr، ص275]. وهذا ما يسميه عبد القاهر الجُرْجانيّ مجازًا في الإسناد لا في الكلمة: «ليس المجازُ في الآية في لفظة ربحت نفسِها، ولكن في إِسنادها إِلى التجارة» [@dalail، ص294]."
    - title: "المقابلة بين «تَرَكُوهُمْ» و«فَآبُوا»"
      text: "فعلان في شطر واحد: تركوا القتلى وراءهم، ورجعوا بالمال؛ فالغارة تمت دون أن يلحقهم أحد."
  connection: "ثم يقول: وجاءوا يسترجعون فلم يُرجع إليهم شيء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "تَرَكُوهُمْ / مُلَحْحَبِي / نَ فَآبُو = فعلاتن / متفع لن / فعلاتن — بِنِهَابِنْ / يَصَمْمُ فِي / هِلْ حُدَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "يتم خبر غارة تميم: قتل ونهب. وعند الزَّوْزَنِيّ «يُصِمُّ مِنْهَا الْحُدَاءُ»، وفسره بالكثرة: «يصم حداء حداتها آذان السامعين، أشار بذلك إلى كثرتها» [@zawzani، ص285]."
variants:
  - reading: "...بِنِهَابٍ يَصَمُّ مِنْهُ الْحُدَاءُ"
    status: "رواية التِّبْرِيزِيّ"
    note: "«ويروى: (يصم منه الحداء)» [@ibn-al-anbari، ص485]، وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص274]."
  - reading: "تَرَكُوهُمْ مُلَحَّبِينَ وَآبُوا / بِنِهَابٍ يُصِمُّ مِنْهَا الْحُدَاءُ"
    status: "رواية الزَّوْزَنِيّ"
