first: "إِنْ نَبَشْتُمْ مَا بَيْنَ مِلْحَةَ فَالصَّا"
second: "قِبِ فِيهِ الْأَمْوَاتُ وَالْأَحْيَاءُ"
meaning: "إن أثرتم ما كان بيننا وبينكم من القتل في الوقائع بين مِلْحة والصاقب، ففيه أموات وأحياء. قال ابن الأَنْبارِيّ: «معناه أن أثرتم ما كان بيننا وبينكم من القتل في الوقَعات التي كانت بين ملحة فالصاقبِ، ظهرَ عليكم ما تكرهون من قتلَى قتَلْنا لم تدركوا بثأرهم» [@ibn-al-anbari، ص466]."
vocabulary:
  - term: "نَبَشْتُمْ"
    text: "أثرتم وكشفتم ما دُفن من الأمر [@ibn-al-anbari، ص466]."
  - term: "مِلْحَةَ"
    text: "«مكان» [@ibn-al-anbari، ص466]."
  - term: "الصَّاقِبِ"
    text: "«جبل» [@ibn-al-anbari، ص466]."
  - term: "الْأَمْوَاتُ وَالْأَحْيَاءُ"
    text: "عند ابن الأَنْبارِيّ: «موتى قد ذهبوا ونسوا ومات امرهم، وفيه أحياء قد بقوا حديث أمرهم» [@ibn-al-anbari، ص466]؛ وعند الزَّوْزَنِيّ: «فسمّى الذي لم يثأر بها أمواتًا، والذي ثُئِر بهم أحياء» [@zawzani، ص276]."
syntax:
  - "«وما ينتصب بنبشتم» [@ibn-al-anbari، ص467]؛ و«مِلْحَةَ» مجرورة بالفتحة لأنها ممنوعة من الصرف: «وملحة خفض ببين» [@ibn-al-anbari، ص467]."
  - "«وجواب الجزاء محذوف لوضوح معناه. كأنه قال: أن نبشتم هذا هلكتم. وإن شئت كان الجواب الفاء التي في البيت الثاني» [@ibn-al-anbari، ص467]."
  - "وجملة «فيه الأموات والأحياء» حال على تقدير الواو: «ومن خفضه أضمر الواو مع في وأراد: وفيه الأموات، أي وهذه حاله» [@ibn-al-anbari، ص467]."
morphology:
  - "«نَبَشْتُمْ» من «نبش ينبُش» إذا كشف المدفون."
  - "«الصَّاقِب» اسم فاعل من «صقِب» إذا قرب: «والصاقب في غير هذا الموضع: الملاصِق» [@ibn-al-anbari، ص466]."
  - "«الْأَمْوَات» جمع «ميّت»، و«الْأَحْيَاء» جمع «حيّ»، كلاهما على «أفعال»."
rhetoric:
  thesis: "التاريخ مقبرة: من ينبشها يجد قتلاه."
  devices:
    - title: "الاستعارة في «نَبَشْتُمْ»"
      text: "النبش إخراج المدفون من القبر، فجعل البحث في الحروب القديمة نبشًا للقبور، لأن في تلك الحروب قتلى. والاستعارة هنا في الفعل، وعبد القاهر الجُرْجانيّ يقول: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]."
    - title: "الحذف في جواب الشرط"
      text: "لم يقل ما يكون إن نبشوا، بل قال «فيه الأموات والأحياء» وسكت. والجواب عند ابن الأَنْبارِيّ «محذوف لوضوح معناه» [@ibn-al-anbari، ص467]، فيتخيل السامع العاقبة. وفي الحذف يقول عبد القاهر: «وتَجدُكَ أَنْطَقَ ما تكونُ إِذا لم تَنْطِقْ» [@dalail، ص146]."
    - title: "الطباق بين «الْأَمْوَاتُ» و«الْأَحْيَاءُ»"
      text: "ضدان يجمعان الماضي كله، فلا يبقى شيء خارج النبش."
  connection: "ثم يعرض الخيار الثاني: الاستقصاء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "إِنْ نَبَشْتُمْ / مَا بَيْنَ مِلْ / حَةَ فَصْصَا = فاعلاتن / مستفع لن / فعلاتن — قِبِ فِيهِلْ / أَمْوَاتُ وَلْ / أَحْيَاءُو = فعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "أول الخيارات المهددة: النبش. وفي «الأموات والأحياء» ثلاثة أقوال: أمور قديمة منسية وأمور حديثة، عند ابن الأَنْبارِيّ؛ والقتلى الذين ثُئر بهم والذين لم يُثأر بهم، عند الزَّوْزَنِيّ، «يريد أنهم ثأروا بقتلاهم وتغلب لم تثأر بقتلاهم» [@zawzani، ص276]؛ وفي التِّبْرِيزِيّ: «إنكم تعتدون علينا بذنوب الأموات وما فعلوا، كما تعتدون علينا بذنوب الأحياء» [@tabrizi-ashr، ص263]."
variants:
  - reading: "إِنْ نَبَشْتُمْ مَا بَيْنَ مِلْحَةَ وَالصَّا / قِبُ فِيهِ الْأَمْوَاتُ وَالْأَحْيَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (والصاقب) بالرفع، والرافع له عود الهاء عليه، وهو حينئذ مستأنف والواو التي فيه واو الحال» [@ibn-al-anbari، ص467]."
