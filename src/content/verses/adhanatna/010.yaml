first: "بِزَفُوفٍ كَأَنَّهَا هِقْلَةٌ أُمْـ"
second: "ـمُ رِئَالٍ دَوِّيَّةٌ سَقْفَاءُ"
meaning: "أستعين على الهم بناقة سريعة، كأنها في سرعتها نعامة لها فراخ، تسكن الفلاة الواسعة، في رجلها انحناء. قال الزَّوْزَنِيّ: «أستعين على إمضاء همي وقضاء أمري عند صعوبة الخطب وشدته بناقة مسرعة في سيرها، كأنها في إسراعها في السير نعامة لها أولاد» [@zawzani، ص271]."
vocabulary:
  - term: "زَفُوفٍ"
    text: "ناقة «مسرعة خفيفة، تزف زفيفا. والزفيف: عدو النعام إذا أسرع» [@ibn-al-anbari، ص441]."
  - term: "هِقْلَةٌ"
    text: "«نعامة، والذكر هقل» [@ibn-al-anbari، ص441]."
  - term: "رِئَالٍ"
    text: "«فراخ النعام، واحدها رأل» [@ibn-al-anbari، ص442]."
  - term: "دَوِّيَّةٌ"
    text: "«منسوبة إلى الدو. والدو: الأرض الواسعة البعيدة الأطراف» [@ibn-al-anbari، ص442]."
  - term: "سَقْفَاءُ"
    text: "«نعامة في رجلها انحناء» [@ibn-al-anbari، ص442]؛ وعند الزَّوْزَنِيّ: «السقف: طول مع انحناء» [@zawzani، ص271]، وعند التِّبْرِيزِيّ: «مرتفعة، وكل ما ارتفع سقف» [@tabrizi-ashr، ص255]."
syntax:
  - "«بِزَفُوفٍ» متعلق بـ«أستعين» في البيت السابق: «الباء متعلقة بأستعين» [@khizana، ج3 ص418]، و«زفوف» صفة لموصوف محذوف، أي بناقة زفوف."
  - "«والهاء اسم كأن، وهقلة خبر كأن. وأم رئال، ودوية، وسقفاء، نعوت لهقلة» [@ibn-al-anbari، ص442]."
morphology:
  - "«زَفُوف» على «فَعُول» للمبالغة: «والزفوف مبالغة» [@zawzani، ص271]."
  - "«دَوِّيَّة» نسبة إلى «الدَّوّ»، والياء المشددة ياء النسب، والتاء للتأنيث."
  - "«سَقْفاء» على «فَعْلاء»، مؤنث «أَسْقَف»: «ويقال للرجل أسقف، وللمرأة سقفاء، إذا كان فيهما انحناء» [@ibn-al-anbari، ص442]."
  - "«رِئال» جمع «رَأْل»: «وثلاثة أرؤل، فاذا كثرت فهي رئال ورئلان» [@ibn-al-anbari، ص442]."
rhetoric:
  thesis: "الناقة نعامة: تشبيه معروف في الشعر الجاهلي، يجعل سرعة الناقة سرعة طائر يعدو."
  devices:
    - title: "التشبيه في «كَأَنَّهَا هِقْلَةٌ»"
      text: "شبّه الناقة بالنعامة في سرعتها، والسرعة صفة تُرى، فهو من التشبيه الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» كما يقول عبد القاهر الجُرْجانيّ [@asrar، ص90]."
    - title: "تتابع الصفات"
      text: "«أُمُّ رِئَالٍ دَوِّيَّةٌ سَقْفَاءُ»: ثلاث صفات بلا عاطف، كل واحدة تزيد الصورة تحديدًا وتزيد النعامة سرعة: أمّ تخاف على فراخها، وتعيش في الفلاة، وطويلة الساقين. والمعنى عند البغدادي أنها «نعامة لها أولاد طويلة منحنية لا تفارق المفاوز» [@khizana، ج3 ص418]."
  connection: "ثم يذكر ما يزيد النعامة سرعة: صوت خفي، وصيادون، ومساء قريب."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "بِزَفُوفِنْ / كَأَنْنَهَا / هِقْلَتُنْ أُمْ = فعلاتن / متفع لن / فاعلاتن — مُ رِئَالِنْ / دَوْوِيْيَتُنْ / سَقْفَاءُو = فعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "أول أبيات الناقة (9–14)، وهي قصيرة إذا قيست بناقة طَرَفَة التي تمتد ثلاثين بيتًا. يشبّه الناقة بالنعامة، ثم ينصرف إلى النعامة فيصفها في البيت التالي. قال ابن الأَنْبارِيّ: «وإنما وصف الناقة بصفة النعامة لأنها شبهت بها» [@ibn-al-anbari، ص441]."
