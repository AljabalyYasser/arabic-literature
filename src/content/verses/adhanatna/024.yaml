first: "قَبْلَ مَا الْيَوْمِ بَيَّضَتْ بِعُيُونِ النْـ"
second: "ـنَاسِ فِيهَا تَعَيُّطٌ وَإِبَاءُ"
meaning: "قبل يومنا هذا أعمت عزتنا عيون الناس، وفيها امتناع وإباء للضيم. قال ابن الأَنْبارِيّ: «معناه: قبل اليوم عظم شأنها على الناس حتى أعمتهم وعظمت على أبصارهم» [@ibn-al-anbari، ص458]."
vocabulary:
  - term: "بَيَّضَتْ بِعُيُونِ النَّاسِ"
    text: "«بيضت عيون الناس، والباء زائدة» [@ibn-al-anbari، ص459]؛ وتبييض العين: «كناية عن الإعماء» [@zawzani، ص274]."
  - term: "تَعَيُّطٌ"
    text: "«معناه فيها ارتفاع وامتناع» [@ibn-al-anbari، ص460]؛ «ومن التعيط قولهم: اعتاطت الناقة واعتاصت، إذا امتنعت من الحمل» [@ibn-al-anbari، ص460]. وعند التِّبْرِيزِيّ وجه آخر: من «رجل أعيط وامرأة عيطاء» إذا كانا طويلين، «فيكون المعنى على هذا: لنا عزة طويلة غير ناقصة» [@tabrizi-ashr، ص261]."
  - term: "إِبَاءُ"
    text: "«معناه أنها تأبى الضيم» [@ibn-al-anbari، ص460]."
syntax:
  - "«وقبل نصب ببيضت، وما صلة اليوم مختفض بقبل» [@ibn-al-anbari، ص460]؛ أي «ما» زائدة و«اليوم» مضاف إليه."
  - "«بِعُيُونِ»: الباء زائدة، و«عيون» مفعول به في المعنى، «كما قال الله تبارك وتعالى: (ومَن يُردْ فيه بإلحادٍ بظُلْم)» [@ibn-al-anbari، ص459]."
  - "«والتعيط رفع بفي، والإباء نسق عليه» [@ibn-al-anbari، ص460]؛ والجملة حال من فاعل «بيّضت»."
morphology:
  - "«بَيَّضَتْ» على «فعّل» من البياض، والتضعيف للتعدية."
  - "«تَعَيُّط» مصدر «تعيّط» على «تفعّل»؛ «ويقال: ناقة عائط، وفي الجمع نوق عوط وعيط» [@ibn-al-anbari، ص460]."
  - "«إِبَاء» مصدر «أبى يأبى» على «فِعال»."
rhetoric:
  thesis: "العزة تعمي الحاسد: بياض العين صورة للعمى من شدة الغيظ."
  devices:
    - title: "الكناية في «بَيَّضَتْ بِعُيُونِ النَّاسِ»"
      text: "تبييض العين ذهاب سوادها، أي العمى؛ قال الزَّوْزَنِيّ: «وتبييض العين: كناية عن الإعماء» [@zawzani، ص274]. فلم يقل أعمت، بل ذكر ما يلزم العمى. وهذا ما يحدّه عبد القاهر الجُرْجانيّ في الكناية: «ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المجاز في إسناد التعيّط والإباء إلى العزة"
      text: "جعل للعزة امتناعًا وإباء كالناقة العائط. قال الزَّوْزَنِيّ: «وجعل التغيظ والإباء للعزة مجازًا وهما عند التحقيق لهم» [@zawzani، ص274]، أي لأصحاب العزة. وهذا المجاز في الإسناد هو ما يسميه عبد القاهر المجاز الحكمي: «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]."
  connection: "ثم يشبّه بَكْرًا بجبل ترمي إليه المنون فلا تضره."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "قَبْلَ مَلْيَوْ / مِ بَيْيَضَتْ / بِعُيُونِنْ = فاعلاتن / متفع لن / فعلاتن — نَاسِ فِيهَا / تَعَيْيُطُنْ / وَإِبَاءُو = فاعلاتن / متفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وآخر العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "يكمل البيت السابق: عزة بَكْر ليست جديدة. والضمير في «بيّضت» للعزة المذكورة في البيت 23. ويذكر ابن الأَنْبارِيّ نظائر المعنى: من يغيظه أمر يظلم عليه نهاره، كقولهم «لأرينك الكواكب بالنهار» [@ibn-al-anbari، ص458]."
variants:
  - reading: "...فِيهَا تَغَيُّظٌ وَإِبَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "يريد عنده «أن الناس يحسدوننا على إباء عزتنا على من كادها وتغيظها على من أرادها بسوء» [@zawzani، ص274]."
