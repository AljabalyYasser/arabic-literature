first: "أَمْ عَلَيْنَا جَرَّى قُضَاعَةَ أَمْ لَيْـ"
second: "ـسَ عَلَيْنَا مِمَّا جَنَوْا أَنْدَاءُ"
meaning: "أم علينا جناية قُضاعة؟ بل ليس علينا مما جنوا شيء يصيبنا ولو قليلًا. قال ابن الأَنْبارِيّ: «يريد: ليس يندانا مما جنوا شيء» [@ibn-al-anbari، ص482]."
vocabulary:
  - term: "قُضَاعَةَ"
    text: "قبيلة غزت بني تَغْلِب: «وذلك أن قضاعة غزت بني تغلب فقتلوا فيهم وسبوا» [@ibn-al-anbari، ص482]."
  - term: "أَنْدَاءُ"
    text: "«واحدها ندى» [@ibn-al-anbari، ص482]، وهو البلل؛ والمعنى ما يصيب المرء من غيره. وفي اللسان: «وَيُقَالُ: مَا نَدِيَني مِنْ فُلَانٍ شَيْءٌ أَكْرَهُه أَي مَا بلَّني وَلَا أَصابني» [@lisan، ج15 ص314]."
syntax:
  - "«والأنداء اسم ليس، واحدها ندى، وعلينا خبر» [@ibn-al-anbari، ص482]: أي خبر «ليس» مقدم واسمها مؤخر."
  - "«أَمْ» الأولى تعطف السؤال على ما قبله، و«أَمْ» الثانية في «أَمْ لَيْسَ» للإضراب: تنتقل من السؤال إلى الجواب. وفي هذا يقول التِّبْرِيزِيّ: «وتقع أمْ لخروج من كلام إلى كلام أيضا» [@tabrizi-ashr، ص271]."
  - "«مِمَّا جَنَوْا»: «مِن» دخلت على «ما» المصدرية، والمعنى: من جنايتهم."
morphology:
  - "«أَنْدَاء» جمع «ندى» على «أفعال»، وهمزته منقلبة عن ياء متطرفة بعد ألف زائدة."
  - "«جَنَوْا» ماضي «جنى» مسندًا إلى واو الجماعة، حُذفت لامه وبقيت الفتحة قبل الواو."
  - "«قُضَاعَة» علم على «فُعالة»، ممنوع من الصرف للعلمية والتأنيث، ولذلك فُتح آخره وهو مضاف إليه."
rhetoric:
  thesis: "يجيب الحارِث عن سؤاله بنفسه: لا يصيبنا من جناية قُضاعة بلل."
  devices:
    - title: "الاستعارة في «أَنْدَاءُ»"
      text: "الندى البلل، فجعل الجناية ماء ينضح على من حولها، ونفى أن تصيب بَكْرًا منه قطرة. وهذا أبلغ من أن يقول: لا ذنب لنا، لأنه نفى أقل القليل. والعبارة معروفة في الكلام، ففي اللسان: «وَمَا نَدِيَتْ كفِّي لَهُ بشَّرٍ» [@lisan، ج15 ص314]."
    - title: "السؤال والجواب في «أَمْ عَلَيْنَا ... أَمْ لَيْسَ عَلَيْنَا»"
      text: "كرر «علينا» في الشطرين: سؤال يحكي التهمة، ثم جواب ينفيها باللفظ نفسه. فالبيت يحمل التهمة وردّها معًا."
  connection: "ثم يسمي قتلى تَغْلِب: ليس منا المضرَّبون ولا قيس ولا جندل."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَمْ عَلَيْنَا / جَرْرَى قُضَا / عَةَ أَمْ لَيْ = فاعلاتن / مستفع لن / فعلاتن — سَ عَلَيْنَا / مِمْمَا جَنَوْ / أَنْدَاءُو = فعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "السؤال الخامس، وبه يبلغ الحارِث قبيلة كبيرة غزت تَغْلِب. ويقول ابن الأَنْبارِيّ إن الأسئلة تُقال وخصم الحارِث حاضر: «هذا كله تعيير منه لبني تغلب، وعمرو بن كلثوم يسمع» [@ibn-al-anbari، ص482]."
variants:
  - reading: "...أَمْ لَيْـ / ـسَ عَلَيْنَا فِيمَا جَنَوْا أَنْدَاءُ"
    status: "رواية الزَّوْزَنِيّ والتِّبْرِيزِيّ"
    note: "[@zawzani، ص285] [@tabrizi-ashr، ص271]؛ وبها جاء شرح ابن الأَنْبارِيّ نفسه: «وليس علينا فيما جنوا أنداء» [@ibn-al-anbari، ص482]."
  - reading: "...أَوْ لَيْـ / ـسَ عَلَيْنَا فِيمَا جَنَوْا أَنْدَاءُ"
    status: "رواية أخرى"
    note: "«ويروى (أو ليس علينا فيما جنوا)» [@tabrizi-ashr، ص271]."
