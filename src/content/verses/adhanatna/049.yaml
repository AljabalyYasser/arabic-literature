first: "لَيْسَ مِنَّا الْمُضَرَّبُونَ وَلَا قَيْـ"
second: "ـسٌ وَلَا جَنْدَلٌ وَلَا الْحَدَّاءُ"
meaning: "ليس منا الذين ضُربوا بالسيوف، ولا قيس ولا جندل ولا الحدّاء: هؤلاء قتلاكم أنتم، فلا تطالبونا بهم. قال ابن الأَنْبارِيّ: «هؤلاء قوم من بني تغلب ضربوا بالسيوف فعيرهم بهم» [@ibn-al-anbari، ص482]."
vocabulary:
  - term: "الْمُضَرَّبُونَ"
    text: "الذين ضُربوا بالسيوف، وهم من تَغْلِب [@ibn-al-anbari، ص482]."
  - term: "جَنْدَلٌ"
    text: "اسم من أسماء قتلى تَغْلِب، كقيس، ولم يذكر الشرّاح خبره."
  - term: "الْحَدَّاءُ"
    text: "«قبيلة من ربيعة، ويقال: هو رجل من ربيعة» [@ibn-al-anbari، ص482]. وهي في اللسان بضم الحاء: «والحُدَّاء: قبيلة»، وأنشد البيت [@lisan، ج3 ص144]."
syntax:
  - "«والمضربون اسم ما لم يسم فاعله، والأسماء التي بعدهم نسَق عليهم» [@ibn-al-anbari، ص482]: أي «المضرَّبون» اسم مفعول، وهو اسم «ليس» مؤخر وخبرها «منا» مقدم، وما بعده معطوف عليه."
  - "تكررت «لا» بعد الواو لتوكيد النفي في كل معطوف."
morphology:
  - "«الْمُضَرَّبُون» اسم مفعول من «ضرّب» على «فعّل»، والتضعيف للتكثير: من كثر فيهم الضرب."
  - "«الْحَدَّاء» على «فَعّال»؛ وفي اللسان: «وَيَحْتَمِلُ الحُدَّاء أَن يَكُونَ فُعَّالًا مِنْ حَدَأَ» [@lisan، ج3 ص144]."
rhetoric:
  thesis: "التعيير بالأسماء: يعدّ قتلى تَغْلِب أمامها."
  devices:
    - title: "التعداد في «الْمُضَرَّبُونَ وَلَا قَيْسٌ وَلَا جَنْدَلٌ وَلَا الْحَدَّاءُ»"
      text: "يسرد الأسماء واحدًا بعد واحد، و«لا» قبل كل اسم، فيطول النفي وتطول معه قائمة القتلى. فالبيت ينفي عن بَكْر، ويذكّر تَغْلِب في الوقت نفسه بمن فقدت."
    - title: "التعريض في «لَيْسَ مِنَّا»"
      text: "ظاهره براءة، وباطنه: هم منكم. قال الزَّوْزَنِيّ: «هؤلاء المضربون ليسوا منا، عيّرهم بأنهم منهم» [@zawzani، ص284]."
  connection: "ثم يعود إلى الأسئلة: أم علينا جناية إياد؟"
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "لَيْسَ مِنْنَلْ / مُضَرْرَبُو / نَ وَلَا قَيْ = فاعلاتن / متفع لن / فعلاتن — سُنْ وَلَا جَنْ / دَلُنْ وَلَلْ / حَدْدَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "بيت يقطع سلسلة الأسئلة بنفي صريح، ثم تعود في البيت التالي. وفي ترتيب التِّبْرِيزِيّ يأتي بعد بيت إياد لا قبله [@tabrizi-ashr، ص273]."
