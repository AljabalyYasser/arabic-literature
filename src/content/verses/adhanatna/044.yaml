first: "أَعَلَيْنَا جُنَاحُ كِنْدَةَ أَنْ يَغْـ"
second: "ـنَمَ غَازِيهِمُ وَمِنَّا الْجَزَاءُ"
meaning: "أعلينا إثم كِنْدة إذ غزاكم غازيهم فغنم منكم، ثم يكون علينا نحن جزاء ما فعل؟ قال ابن الأَنْبارِيّ: «أي أتغنم كندة فيكم ويكون جناح ما صنعوا علينا» [@ibn-al-anbari، ص479]."
vocabulary:
  - term: "جُنَاحُ"
    text: "«الإثم» [@ibn-al-anbari، ص479]؛ وفي اللسان عن أبي الهيثم: «الجُناح: الْجِنَايَةُ والجُرْمُ»، وأنشد هذا البيت [@lisan، ج2 ص430]."
  - term: "غَازِيهِمُ"
    text: "الذي غزا منهم، مفرد يراد به الجنس."
  - term: "الْجَزَاءُ"
    text: "العقاب هنا؛ قال في اللسان بعد البيت: «وَالْجَزَاءُ يَكُونُ ثَوَابًا وَعِقَابًا» [@lisan، ج2 ص430]."
syntax:
  - "«و (الجناح) : الإثم، وهو رفع، وكندة نصب وهو في موضع خفض، وإن نصب بفقد الخافض، والغازي رفع بيغنم، والجزاء رفع بمن» [@ibn-al-anbari، ص479]. أي: «جُنَاحُ» مبتدأ مؤخر خبره «علينا»، و«كِنْدَةَ» مضاف إليه مجرور بالفتحة لأنه ممنوع من الصرف، و«أَنْ يَغْنَمَ» في موضع نصب بنزع الخافض، والتقدير: في أن يغنم، و«الجزاءُ» مبتدأ خبره «منّا»."
  - "الهمزة في «أَعَلَيْنَا» للاستفهام الإنكاري، دخلت على الخبر المقدم «علينا»."
morphology:
  - "«غَازِي» اسم فاعل من «غزا يغزو» على «فاعل»، قُلبت لامه ياء لانكسار ما قبلها، والميم في «غازيهمُ» مشبعة في الوزن."
  - "«جُنَاح» اسم على «فُعال»."
  - "«يَغْنَمَ» مضارع «غنم» منصوب بـ«أنْ»."
rhetoric:
  thesis: "أول الأسئلة: إنكار أن تحمل بَكْر ذنب قبيلة أخرى."
  devices:
    - title: "الاستفهام الإنكاري في «أَعَلَيْنَا جُنَاحُ كِنْدَةَ»"
      text: "لا يسأل ليعرف، بل ينكر أن يكون ذلك. وقدّم «علينا» على «جناح» فوقع الإنكار على أن تكون بَكْر هي المحمَّلة. ويبني الحارِث من هذا البيت إلى البيت 50 سلسلة أسئلة على نسق واحد، يتكلم فيها كأن هناك جناية ثابتة، ثم يسأل عن صاحبها، فيظهر أنها لا تقع على بَكْر في أي موضع. وهذا ما يصفه عبد القاهر الجُرْجانيّ في الاستفهام الذي يُراد به إبطال الأمر من أصله: «ثم يُقال لهم: \"أَخْبِرونا عن هذا التَّحريم الذي زعمتُمْ، فيمَ هو؟ أفي هذا أم ذاك أم في الثالث؟ \" ليتبيَّنَ بُطْلانُ قولِهمْ» [@dalail، ص115]."
    - title: "الطباق بين «يَغْنَمَ غَازِيهِمُ» و«مِنَّا الْجَزَاءُ»"
      text: "الغنيمة لكِنْدة والعقوبة على بَكْر: يضع الربح والخسارة في شطر واحد، فيظهر الظلم في القسمة دون تعليق."
  connection: "ثم يسأل: أم علينا جناية حَنِيفة؟"
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَعَلَيْنَا / جُنَاحُ كِنْ / دَةَ أَنْ يَغْ = فعلاتن / متفع لن / فعلاتن — نَمَ غَازِي / هِمُو وَمِنْ / نَلْ جَزَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "أول أبيات جنايات غيرنا (44–51). وخبر كِنْدة عند ابن الأَنْبارِيّ عن الأَصْمَعِيّ: «كانت كندة كسرت خراجها على الملك، فبعث إليهم رجالا من بني تغلب فقتلوا فيهم وأسروا» [@ibn-al-anbari، ص479]، أي امتنعت كِنْدة عن أداء الخراج، فلقي التغلبيون منها ما لقوا. وعند التِّبْرِيزِيّ قول آخر: «كانت كندة قد غزت تغلب، وقتلت فيهم وسبت» [@tabrizi-ashr، ص269]. والبيت عند الزَّوْزَنِيّ بعد البيت 51 [@zawzani، ص284]."
