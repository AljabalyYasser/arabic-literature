first: "وَثَمَانُونَ مِنْ تَمِيمٍ بِأَيْدِيـ"
second: "ـهِمْ رِمَاحٌ صُدُورُهُنَّ الْقَضَاءُ"
meaning: "وغزاكم ثمانون رجلًا من تميم، في أيديهم رماح أسنّتها الموت. قال ابن الأَنْبارِيّ: «وقوله (صدورهن القضاء) معناه الموت» [@ibn-al-anbari، ص485]."
vocabulary:
  - term: "صُدُورُهُنَّ"
    text: "صدر الرمح أعلاه، أي سنانه؛ قال الزَّوْزَنِيّ: «وصدر كل شيء: أوله» [@zawzani، ص285]."
  - term: "الْقَضَاءُ"
    text: "«الموت» [@ibn-al-anbari، ص485]؛ وعند الزَّوْزَنِيّ «القتل» [@zawzani، ص285]."
syntax:
  - "«والثمانون رفع بما عاد من الهاء والميم، والرماح رفع بالباء وما بعدها صلتها، والقضاء رفع بالصدور» [@ibn-al-anbari، ص485]: أي «ثمانون» مبتدأ، و«رماح» مبتدأ مؤخر خبره «بأيديهم»، والجملة خبر «ثمانون»، وجملة «صدورهن القضاء» نعت لـ«رماح»."
  - "الواو في «وَثَمَانُونَ» استئنافية تبدأ مقطعًا جديدًا."
morphology:
  - "«ثَمَانُونَ» من ألفاظ العقود، ملحق بجمع المذكر السالم."
  - "«صُدُور» جمع «صدر» على «فُعول»."
  - "«الْقَضَاء» مصدر «قضى» على «فَعال»، همزته منقلبة عن ياء."
rhetoric:
  thesis: "يبدأ الهجوم المضاد: ما أصاب تَغْلِب جاءها من غيرنا."
  devices:
    - title: "التشبيه البليغ في «صُدُورُهُنَّ الْقَضَاءُ»"
      text: "لم يقل: كأن أسنتها الموت، بل جعلها الموت نفسه، فحذف الأداة ووجه الشبه. وفسرها الزَّوْزَنِيّ: «رماح أسنتها القتل، أي القاتلة» [@zawzani، ص285]، فالمصدر وُضع موضع الصفة مبالغة."
    - title: "الإيجاز في «وَثَمَانُونَ مِنْ تَمِيمٍ»"
      text: "يذكر العدد والقبيلة ولا يذكر الغزو، فالسامعون يعرفون الخبر؛ والعدد الصغير يزيد العار: ثمانون رجلًا فعلوا بتَغْلِب ما فعلوا."
  connection: "ثم يقول: لم يتركوا بني رِزاح ببرقاء نِطاع حتى صاروا يدعون عليهم."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَثَمَانُو / نَ مِنْ تَمِي / مِنْ بِأَيْدِي = فعلاتن / متفع لن / فاعلاتن — هِمْ رِمَاحُنْ / صُدُورُهُنْ / نَلْ قَضَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر فصارت «فعلاتن» [@atiq، ص98–99]."
context: "أول أبيات ما أصاب تَغْلِب من غيرنا (52–64). والخبر عند ابن الأَنْبارِيّ أن عَمْرًا من بني سعد بن زيد مناة بن تميم «خرج في ثمانين رجلا من بني تميم غازين، فأغار على ناس من بني تغلب يقال لهم بنو رزاح، كانوا ينزلون أرضا يقال لها نطاع، قريبة من اليمن، فقتل فيهم وأخذ أموالا كثيرة» [@ibn-al-anbari، ص485]. فبعد أن نفى الحارِث الجنايات عن بَكْر، يذكر الآن من جنى على تَغْلِب حقًّا: هي مغلوبة، ولكن من غير بَكْر."
