first: "أَمْ جَنَايَا بَنِي عَتِيقٍ فَمَنْ يَغْـ"
second: "ـدِرْ فَإِنَّا مِنْ حَرْبِهِمْ بُرَآءُ"
meaning: "أم علينا جنايات بني عتيق؟ من غدر منهم فنحن براء من حربهم، لا نُسأل عنها ولا ندخل فيها."
vocabulary:
  - term: "جَنَايَا"
    text: "جمع جِناية، وهي الذنب يجنيه المرء على غيره."
  - term: "بَنِي عَتِيقٍ"
    text: "قوم لم يذكر الشرّاح خبرهم."
  - term: "بُرَآءُ"
    text: "جمع بريء. قال ابن الأَنْبارِيّ: «ومن العرب من يقول: فلان براء منك، ولا يثنيه ولا يجمعه» [@ibn-al-anbari، ص481]، أي يجعله مصدرًا لا يتغير."
syntax:
  - "«والجنايا رفع بالنسق على جرى، ومن رفع بما في يغدر، وبراء خبر إن، ومن صلة برآء» [@ibn-al-anbari، ص481]: أي «جنايا» معطوف على «جَرَّى» في البيت السابق، و«مَنْ» اسم شرط في موضع رفع، و«بُرَآء» خبر «إنّ»، و«من حربهم» متعلق به."
  - "«يَغْدِرْ» فعل الشرط مجزوم، و«فَإِنَّا ...» جملة جواب الشرط، اقترنت بالفاء لأنها اسمية."
morphology:
  - "«جَنَايَا» جمع «جِناية» على «فَعالى»، كـ«هدية وهدايا»."
  - "«بُرَآء» جمع «بريء» على «فُعَلاء»، ويقال فيه «بِراء» على مثال «ظِراف» كما ذكر ابن الأَنْبارِيّ [@ibn-al-anbari، ص481]."
  - "«يَغْدِرْ» مضارع «غدر» على «يفعِل»، مجزوم بالسكون."
rhetoric:
  thesis: "البراءة: من غدر فذنبه عليه لا علينا."
  devices:
    - title: "الشرط في «فَمَنْ يَغْدِرْ فَإِنَّا مِنْ حَرْبِهِمْ بُرَآءُ»"
      text: "يقطع السؤال بقاعدة عامة: كل غادر يتحمل حربه وحده. فلا يحتاج إلى أن يروي خبر بني عتيق؛ الشرط يشمل كل غادر."
    - title: "التوكيد في «فَإِنَّا»"
      text: "أكد براءته بـ«إنّ» لأن المخاطَب ينكرها، وجاء بالجملة اسمية لتدل على براءة ثابتة لا تتغير."
  connection: "ثم يسأل: أم علينا جناية العِباد؟"
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَمْ جَنَايَا / بَنِي عَتِي / قِنْ فَمَنْ يَغْ = فاعلاتن / متفع لن / فاعلاتن — دِرْ فَإِنْنَا / مِنْ حَرْبِهِمْ / بُرَآءُو = فاعلاتن / مستفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في آخر العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "السؤال الثالث في السلسلة، وفيه يتحول السؤال إلى قاعدة: الغادر وحده يحمل غدره. وعند الزَّوْزَنِيّ عجز آخر يجعل التهديد لتَغْلِب نفسها: «أم علينا جنايا بني عتيق؟ ثم قال: إن نقضتم العهد فإنا برآء منكم» [@zawzani، ص284]، وهو عنده بعد البيت 49."
