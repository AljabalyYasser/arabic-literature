first: "وَهُوَ الرَّبُّ وَالشَّهِيدُ عَلَى يَوْ"
second: "مِ الْحِيَارَيْنِ وَالْبَلَاءُ بَلَاءُ"
meaning: "وهو، أي المنذر، السيد والشاهد على يوم الحِيارين، حين أبلت فيه بَكْر بلاء عظيمًا. قال ابن الأَنْبارِيّ: «يخبر إنه قد شهدهم في هذين اليومين فعلم فيه صنيعهم وبلاءهم الذي أبلوا. وكان المنذر بن ماء السماء غزا أهل الحيارين ومعه بنو يشكر فأبلوا بلاء حسنا» [@ibn-al-anbari، ص476]."
vocabulary:
  - term: "الرَّبُّ"
    text: "«والرب في هذا الموضع: السيد» [@ibn-al-anbari، ص476]؛ وفي اللسان أن العرب قالت «الرب» بالألف واللام لغير الله: «وقد قالوه في الجاهلية للملك» [@lisan، ج1 ص399]."
  - term: "الشَّهِيدُ"
    text: "«ومعناه الشاهد، كما تقول عليم وعالم» [@ibn-al-anbari، ص476]."
  - term: "الْحِيَارَيْنِ"
    text: "«بلدان» [@ibn-al-anbari، ص476]."
  - term: "وَالْبَلَاءُ بَلَاءُ"
    text: "«معناه: والبلاء شديد» [@ibn-al-anbari، ص476]."
syntax:
  - "«والرب رفع بهو، والشهيد نسق عليه» [@ibn-al-anbari، ص476]."
  - "«وعلى صلة شهيد، والبلاء الأول رفع» [@ibn-al-anbari، ص476]؛ أي «البلاء» مبتدأ و«بلاء» خبره، والجملة حال."
morphology:
  - "«الشَّهِيد» على «فَعِيل» بمعنى فاعل."
  - "«وفي الرب لغتان: رب بتشديد الباء، ورب بتخفيفها» [@ibn-al-anbari، ص476]."
  - "«الحِيارَيْن» مثنى، مجرور بالياء."
rhetoric:
  thesis: "الملك شاهد: يستشهد الشاعر بأبي الملك على بلاء قومه."
  devices:
    - title: "التكرار في «وَالْبَلَاءُ بَلَاءُ»"
      text: "كرر الكلمة مبتدأ وخبرًا، فلم يزد الخبر شيئًا في اللفظ، وزاد في المعنى: البلاء الذي تعرفه، البلاء العظيم. ومعناه عند ابن الأَنْبارِيّ «والبلاء شديد»، ويجوز أن يكون من البلية أو «من الإبلاء والإنعام» [@ibn-al-anbari، ص476]؛ والإبلاء: حسن الصنيع في الحرب."
    - title: "الاحتجاج بشهادة الملك"
      text: "«الرَّبُّ وَالشَّهِيدُ»: يجعل المنذر سيدًا وشاهدًا معًا، فشهادته لا تُرد؛ وابنه عَمْرو بن هند يسمع، فالبيت يذكّر الملك بما عرفه أبوه."
  connection: "ثم يمدح المنذر: ملك أضلع البرية لا يكافئه أحد."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَهُوَرْ رَبْ / بُ وَشْشَهِي / دُ عَلَى يَوْ = فعلاتن / متفع لن / فعلاتن — مِلْحِيَارَيْ / نِ وَلْبَلَا / ءُ بَلَاءُو = فاعلاتن / متفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وآخر العجز فصارت «فعلاتن» [@atiq، ص98–99]. و«وَهُوَ» بضم الهاء يقتضيه الوزن، وفي متن التِّبْرِيزِيّ «وَهْوَ» بسكونها [@tabrizi-ashr، ص267]، ولا يستقيم به."
context: "يتصل بالبيت السابق ولا يتم معناه إلا به، كما قال الأَثْرَم وابن السِّكِّيت [@ibn-al-anbari، ص475]: فالضمير «هو» للمنذر بن ماء السماء. أما الزَّوْزَنِيّ، وليس عنده البيت 37، فيجعل هذا البيت آخر القصيدة، ويقول: «يريد عمرو بن هند فإنه شهد عناءهم هذا» [@zawzani، ص286]. وبه يبدأ الحارِث تذكير الملك ببلاء بَكْر مع أبيه."
variants:
  - reading: "...عَلَى يَوْ / مِ الْحَوَارَيْنِ وَالْبَلَاءُ بَلَاءُ"
    status: "رواية ابن الأَعْرابيّ"
    note: "«ورواه ابن الأعرابي: (يوم الحوارين)» [@ibn-al-anbari، ص476]."
