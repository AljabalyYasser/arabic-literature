first: "فَتَأَوَّتْ لَهُمْ قَرَاضِبَةٌ مِنْ"
second: "كُلِّ حَيٍّ كَأَنَّهُمْ أَلْقَاءُ"
meaning: "فتجمعت للملك حين دعا إلى الغزو صعاليك من كل حي، كأنهم من خمولهم أشياء مطروحة. قال ابن الأَنْبارِيّ: «تأوت: اجتمعت حين دعاهم إلى الغزو» [@ibn-al-anbari، ص489]."
vocabulary:
  - term: "تَأَوَّتْ"
    text: "اجتمعت [@ibn-al-anbari، ص489]. والتأوّي في الأصل للطير، كما في اللسان: «واستعمله الحرثُ بْنُ حِلِّزة فِي غَيْرِ الطَّيْرِ» [@lisan، ج14 ص52]."
  - term: "قَرَاضِبَةٌ"
    text: "«الصعاليك، وهم الفقراء، واحدهم قرضوب، ويقال قرضاب أيضا» [@ibn-al-anbari، ص489]؛ وفي اللسان: «والقُرْضُوبُ والقِرْضابُ: اللِّصُّ، وَالْجَمْعُ القَراضِبةُ» [@lisan، ج1 ص670]."
  - term: "أَلْقَاءُ"
    text: "«واحد الألقاء لقي، وهو الشيء المطروح الذي لا يكترث به» [@ibn-al-anbari، ص489]؛ «وقال بعض الرواة: الألقاء: جمع لقوة، وهي العُقاب. والقول الأول هو الذي نختاره» [@ibn-al-anbari، ص489]."
syntax:
  - "«ومن صلة تأوت. والألقاء خبر كأن، وهو ممدود واحده مقصور يكتب بالياء» [@ibn-al-anbari، ص489]."
  - "الضمير في «لَهُمْ» لعَمْرو بن هند وأصحابه، وفي رواية «لَهُ» للملك وحده."
morphology:
  - "«تَأَوَّتْ» ماضٍ على «تفعّل» من «أوى»، حُذفت لامه لالتقائها ساكنة مع تاء التأنيث."
  - "«قَرَاضِبَة» جمع «قُرْضُوب» على «فَعالِلة»."
  - "«أَلْقَاء» جمع «لَقًى» على «أفعال»: «واللَّقَى: الشَّيْءُ المُلْقى، وَالْجَمْعُ أَلْقَاء» [@lisan، ج15 ص255]."
rhetoric:
  thesis: "يردّ على تَغْلِب احتقارها لجيش الملك بكلمتها هي."
  devices:
    - title: "الاستعارة في «تَأَوَّتْ»"
      text: "التأوّي تجمّع الطير بعضها إلى بعض، فاستعاره الحارِث لتجمّع الرجال، كما نبه اللسان [@lisan، ج14 ص52]. وتتصل الصورة بقول من فسر «الألقاء» بالعِقبان: «جمع لَقوة وهي العُقاب» [@zawzani، ص279]، فتصير الصعاليك سربًا من الطير الجارحة يتجمع للغارة."
    - title: "التشبيه في «كَأَنَّهُمْ أَلْقَاءُ»"
      text: "على اختيار ابن الأَنْبارِيّ هم كالأشياء المطروحة لا يُعبأ بها، وعلى القول الآخر هم كالعقبان، كما يقول الزَّوْزَنِيّ: «كأنهم عقبان لقوتهم وشجاعتهم» [@zawzani، ص279]. والتشبيه يحتمل الوجهين: احتقار تَغْلِب لهم، وحقيقتهم في القتال."
  connection: "ثم يقول: فقادهم الملك بالتمر والماء، وأمر الله نافذ."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَتَأَوْوَتْ / لَهُمْ قَرَا / ضِبَتُنْ مِنْ = فعلاتن / متفع لن / فعلاتن — كُلْلِ حَيْيِنْ / كَأَنْنَهُمْ / أَلْقَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يصف جيش الملك. وفي شرح البيت 63 يذكر ابن الأَنْبارِيّ أن تَغْلِب قالت: «إنما معه قراضبة قد جمعوا له من كُلّ مكان لقتالنا» [@ibn-al-anbari، ص490]، فالكلمة كلمتهم، والحارِث يعيدها عليهم."
variants:
  - reading: "فَتَأَوَّتْ لَهُ قَرَاضِبَةٌ مِنْ"
    status: "رواية الزَّوْزَنِيّ"
