first: "مَنْ لَنَا عِنْدَهُ مِنَ الْخَيْرِ آيَا"
second: "تٌ ثَلَاثٌ فِي كُلِّهِنَّ الْقَضَاءُ"
meaning: "هو الذي لنا عنده ثلاث آيات من حسن البلاء، يقضي الناس لنا في كل واحدة منها. قال ابن الأَنْبارِيّ: «يقول: نحن أنصح الناس للملك وأكرمهم عليه، وأجودهم منه منزلة ومكانا. (في كلهن القضاء) معناه في كلهن يقضى الناس لنا بذلك» [@ibn-al-anbari، ص493]."
vocabulary:
  - term: "آيَاتٌ"
    text: "«العلامات الثلاث» [@ibn-al-anbari، ص493]، أي ثلاث وقائع تشهد ببلاء بَكْر."
  - term: "الْقَضَاءُ"
    text: "الحكم لنا؛ «أي في كلهن يُقضى لنا بولاء الملك» [@tabrizi-ashr، ص280]."
syntax:
  - "«ومن رفع بإضمار هو، والايات رفع باللام» [@ibn-al-anbari، ص493]: أي «مَن» اسم موصول خبر لمبتدأ محذوف، والتقدير: هو مَن لنا عنده آيات، و«آيات» مبتدأ مؤخر خبره «لنا»."
  - "«مِنَ الْخَيْرِ» حال من «آيات» تقدمت عليها، و«ثلاث» نعت لها."
morphology:
  - "«آيَات» جمع «آية» بالألف والتاء."
  - "«ثَلَاث» عدد جاء بلا تاء لأن معدوده «آية» مؤنث."
  - "«عِنْدَهُ» ظرف مضاف إلى الضمير، والهاء مشبعة في الوزن."
rhetoric:
  thesis: "إعلان الخطة: ثلاث آيات تُعدّ بعده واحدة واحدة."
  devices:
    - title: "الإجمال قبل التفصيل في «آيَاتٌ ثَلَاثٌ»"
      text: "يذكر العدد قبل أن يعدّ، فيترقب السامع الثلاث، ثم يأتيه بها في الأبيات التالية: يوم الشقيقة، ثم حُجْر، ثم فكّ امرئ القيس. وبهذا يتحول المدح إلى حجة مرتبة."
    - title: "الإيجاز في «فِي كُلِّهِنَّ الْقَضَاءُ»"
      text: "يقول إن الحكم لبَكْر في كل واحدة، ولا يقول من يحكم؛ فالقاضي هم الناس كلهم كما يفسره ابن الأَنْبارِيّ، والملك أولهم."
  connection: "ثم يبدأ بالأولى: آية شارق الشقيقة."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "مَنْ لَنَا عِنْ / دَهُو مِنَلْ / خَيْرِ آيَا = فاعلاتن / متفع لن / فاعلاتن — تُنْ ثَلَاثُنْ / فِي كُلْلِهِنْ / نَلْ قَضَاءُو = فاعلاتن / مستفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن» [@atiq، ص98–99]."
context: "يقسم الحارِث بلاء بَكْر عند الملك ثلاث آيات، ويعدّها في الأبيات 69–79: الأولى يوم الشقيقة (69–74)؛ والثانية حُجْر بن أم قَطام، وفيها يقول ابن الأَنْبارِيّ: «يقول: الآية الثانية التي صنعنا بحجر» [@ibn-al-anbari، ص496]؛ والثالثة فكّ امرئ القيس بن المنذر والثأر لأبيه (78–79)، وفيها يقول الزَّوْزَنِيّ: «وهذه هي الآية الثالثة» [@zawzani، ص282]."
variants:
  - reading: "...فِي فَصْلِهِنَّ الْقَضَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (في فصلهن القضاء)» [@ibn-al-anbari، ص493]."
  - reading: "إِنَّ عَمْرًا لَنَا لَدَيْهِ خِلَالٌ / غَيْرَ شَكٍّ فِي كُلِّهِنَّ الْقَضَاءُ"
    status: "رواية أخرى للبيت"
    note: "يرويه ابن الأَنْبارِيّ [@ibn-al-anbari، ص493]، ويثبته التِّبْرِيزِيّ في متنه قبل البيت 66 بقافية «البلاء»: «والبلاء هاهنا النعمة» [@tabrizi-ashr، ص279]."
