first: "إِذْ رَفَعْنَا الْجِمَالَ مِنْ سَعَفِ الْبَحْـ"
second: "ـرَيْنِ سَيْرًا حَتَّى نَهَاهَا الْحِسَاءُ"
meaning: "حين سرنا بجمالنا من نخل البحرين سيرًا شديدًا، نغير على من لقينا، حتى انتهت بنا إلى الحِساء. قال ابن الأَنْبارِيّ: «يخبر عن مغازيهم، أي قد أغرنا على من لقينا من الناس حتى انتهينا إلى النخل» [@ibn-al-anbari، ص471]."
vocabulary:
  - term: "رَفَعْنَا الْجِمَالَ"
    text: "«رفعنا الجمال في السير: أي سرنا سيرا رفيعا» [@tabrizi-ashr، ص265]، أي سريعًا."
  - term: "سَعَفِ"
    text: "«أغصان النخلة، والوحدة سَعَفة» [@zawzani، ص277]؛ وأراد النخل، «فاكتفى بالسعف من النخل» [@ibn-al-anbari، ص471]."
  - term: "نَهَاهَا"
    text: "«ومعنى (نهاها) كفها وحبسها» [@ibn-al-anbari، ص471]."
  - term: "الْحِسَاءُ"
    text: "«جمع حسى البحر. والحسى: الماء الجاري» [@ibn-al-anbari، ص471]؛ وعند الزَّوْزَنِيّ «موضع بعينه» [@zawzani، ص277]."
syntax:
  - "«وإذ من صلة علمتم» [@ibn-al-anbari، ص471]: أي «إذ» متعلقة بـ«علمتم» في البيت السابق، أو بدل من «أيام»."
  - "«والسير نصب على المصدر» [@ibn-al-anbari، ص471]؛ وقال الزَّوْزَنِيّ: «أي فسارت سيرًا فحذف الفعل لدلالة المصدر عليه» [@zawzani، ص277]."
  - "«والحساء رفع بفعلها» [@ibn-al-anbari، ص471]: أي فاعل «نهاها»."
morphology:
  - "«الحِساء» جمع «حِسْي» على «فِعال»."
  - "«السَّعَف» اسم جنس جمعي، مفرده «سَعَفة»."
  - "«نَهَى» هنا بمعنى كفّ وحبس، وهو أصل معنى النهي."
rhetoric:
  thesis: "الغارة رحلة بلا حدود: لا يوقفها إلا الماء."
  devices:
    - title: "المجاز المرسل في «سَعَفِ الْبَحْرَيْنِ»"
      text: "ذكر السعف وأراد النخل كله، «فاكتفى بالسعف من النخل» كما يقول ابن الأَنْبارِيّ [@ibn-al-anbari، ص471]. فالجزء يدل على الكل، ويكفي ذكر جريد النخل لترى البحرين."
    - title: "المجاز في «نَهَاهَا الْحِسَاءُ»"
      text: "جعل الماء ينهى الجمال ويكفها كأنه رجل يمنعها. والمجاز في الإسناد لا في الكلمة، كما يقول عبد القاهر الجُرْجانيّ في المجاز الحكمي: «ليس المجازُ في الآية في لفظة ربحت نفسِها، ولكن في إِسنادها إِلى التجارة» [@dalail، ص294]."
  connection: "ثم يقول: ثم ملنا على تميم."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "إِذْ رَفَعْنَلْ / جِمَالَ مِنْ / سَعَفِلْ بَحْ = فاعلاتن / متفع لن / فعلاتن — رَيْنِ سَيْرَنْ / حَتْتَى نَهَا / هَلْ حِسَاءُو = فاعلاتن / مستفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]."
context: "أول غارة يعدّها في أيام الفوضى: من البحرين إلى الحِساء. «يقول: فلما بلغنا الحساء لم يكن وراءها مغار» [@ibn-al-anbari، ص471]، أي بلغوا آخر ما يمكن أن يُغار عليه."
variants:
  - reading: "إِذْ رَكِبْنَا الْجِمَالَ ..."
    status: "رواية أخرى"
    note: "«ويروى: (إذ ركبنا الجمال)» [@ibn-al-anbari، ص471]."
