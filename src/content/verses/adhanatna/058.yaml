first: "مَا أَصَابُوا مِنْ تَغْلَبِيٍّ فَمَطْلُو"
second: "لٌ عَلَيْهِ إِذَا تَوَلَّى الْعَفَاءُ"
meaning: "من أصابه أصحاب الغلّاق من تَغْلِب فدمه مهدر لا يُثأر له، وعليه إذا مضى المحو والنسيان. قال ابن الأَنْبارِيّ: «فكل من أصابوا من بني تغلب فقد طل دمه، أي أهدر دمه ليس له من ينتصر له» [@ibn-al-anbari، ص487]."
vocabulary:
  - term: "مَطْلُولٌ"
    text: "المهدر دمه؛ وفي اللسان: «أَبو زَيْدٍ: طُلَّ دَمُه وأَطَلَّه اللهُ، وَلَا يُقَالُ طَلَّ دَمُه، بِالْفَتْحِ» [@lisan، ج11 ص405]."
  - term: "الْعَفَاءُ"
    text: "«الدروس في هذا الموضع» [@ibn-al-anbari، ص487]، أي المحو؛ وعند الزَّوْزَنِيّ: «وهو أيضًا التراب الذي يغطي الأثر» [@zawzani، ص278]."
  - term: "تَغْلَبِيٍّ"
    text: "منسوب إلى تَغْلِب، وتُفتح لامه في النسب."
syntax:
  - "«وموضع ما نصب بأصابوا، ومعناها الجزاء، والفاء جواب الجزاء، ومطلول رفع بإضمار هو، والعفاء رفع بعليه» [@ibn-al-anbari، ص487]: أي «ما» اسم شرط مفعول به مقدم لـ«أصابوا»، و«فَمَطْلُولٌ» جواب الشرط، والتقدير: فهو مطلول."
  - "«مِنْ تَغْلَبِيٍّ» بيان لـ«ما»."
morphology:
  - "«مَطْلُول» اسم مفعول من «طلّ»؛ وفيه عن أبي عُبَيْدة «ثلاث لغات: طل دمه طلا وطلولا، وطل دمه، وأطل دمه إطلالا» [@ibn-al-anbari، ص487]، أي يُبنى الفعل للمجهول وللمعلوم، ويُقال بالهمزة."
  - "«الْعَفَاء» مصدر «عفا» على «فَعال»، همزته منقلبة عن واو."
rhetoric:
  thesis: "دم بلا ثأر: أقسى ما يُعيَّر به قوم."
  devices:
    - title: "الدعاء في «عَلَيْهِ إِذَا تَوَلَّى الْعَفَاءُ»"
      text: "«هذا دعاء عليه. يريد: فعلى دمه العفاء» [@ibn-al-anbari، ص487]: جملة خبرية لفظًا، دعائية معنى. فلا يكتفي الحارِث بأن يقول إن دمهم أُهدر، بل يدعو عليه بأن يُمحى أثره."
    - title: "الشرط في «مَا أَصَابُوا ... فَمَطْلُولٌ»"
      text: "الشرط يعمّ: كل من أصابوا، لا واحد ولا اثنان؛ فالإهدار قاعدة لا حادثة."
  connection: "ثم يقول: كتكاليف قومنا إذ غزا المنذر."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "مَا أَصَابُو / مِنْ تَغْلَبِيْ / يِنْ فَمَطْلُو = فاعلاتن / مستفع لن / فاعلاتن — لُنْ عَلَيْهِي / إِذَا تَوَلْ / لَلْ عَفَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن» [@atiq، ص98–99]."
context: "يحكم على ما أصاب الغلّاق من تَغْلِب: دماء ذهبت هدرًا. قال ابن الأَنْبارِيّ: «وهذا كله تعيير لبني تغلب» [@ibn-al-anbari، ص487]. وعند الزَّوْزَنِيّ مقابلة صريحة: «يريد أن دماء بني تغلب تهدر ودماؤهم لا تهدر بل يدركون ثأرهم» [@zawzani، ص278]، والبيت عنده بعد البيت 59."
