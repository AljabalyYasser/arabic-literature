first: "أَسَدٌ فِي اللِّقَاءِ وَرْدٌ هَمُوسٌ"
second: "وَرَبِيعٌ إِنْ شَنَّعَتْ غَبْرَاءُ"
meaning: "كان حُجْر أسدًا في الحرب، أحمر اللون، خفيّ الوطء، وكان للناس ربيعًا إذا أجدبت السنة. قال ابن الأَنْبارِيّ في «إن شنعت»: «يقول: إذا أقحطوا كان لهم ربيعا» [@ibn-al-anbari، ص496]."
vocabulary:
  - term: "وَرْدٌ"
    text: "«الذي يضرب لونه إلى الحمرة» [@zawzani، ص281]."
  - term: "هَمُوسٌ"
    text: "«المختال الذي يخفى وطأة حتى يأخذ فريسته» [@ibn-al-anbari، ص496]؛ وفي اللسان: «والأَسد الهَمُوس: الْخَفِيُّ الْوَطْءِ» [@lisan، ج6 ص250]."
  - term: "شَنَّعَتْ"
    text: "«والتشنيع: إذا أجدبت السنة وقل مطرها ونباتها فذلك التشنيع. ويقال شنَّعتْ: جاءت بأمر شنيع» [@ibn-al-anbari، ص496]."
  - term: "غَبْرَاءُ"
    text: "«السنة القليلة المطر» [@ibn-al-anbari، ص496]، وهي في البيت 45 الصعاليك."
syntax:
  - "«أَسَدٌ» و«وَرْدٌ» و«هَمُوسٌ» و«رَبِيعٌ» أخبار لمبتدأ محذوف تقديره «هو»، يعود على حُجْر."
  - "«إِنْ شَنَّعَتْ» شرط جوابه محذوف دل عليه ما قبله. وفي نسخة الشاملة «أن شنّعت»، وفي الشرح «قوله (إن شنعت)» [@ibn-al-anbari، ص496]، فهي «إنْ» الشرطية."
morphology:
  - "«هَمُوس» صيغة مبالغة على «فَعُول» من «همس»."
  - "«شَنَّعَتْ» على «فعّلت»، من «الشناعة»."
  - "«غَبْرَاء» على «فَعْلاء»، مؤنث «أغبر»، صفة للسنة حُذف موصوفها."
rhetoric:
  thesis: "مدح العدو: كلما عظم حُجْر عظم من ردّه."
  devices:
    - title: "الطباق في «أَسَدٌ ... وَرَبِيعٌ»"
      text: "الأسد للحرب والربيع للجدب: يجمع في حُجْر الشدة على العدو والكرم على الناس. والحارِث يمدح عدوه، لأن الآية في رد من هذه صفته."
    - title: "التشبيه البليغ في «وَرَبِيعٌ»"
      text: "جعل الرجل ربيعًا، أي خصبًا ومطرًا للناس في السنة المجدبة، بلا أداة. وقدّرها التِّبْرِيزِيّ: «وقوله (وربيع) تقديره ذو ربيع» [@tabrizi-ashr، ص284]، وعلى ظاهر اللفظ هو الربيع نفسه، وهو أبلغ."
  connection: "ثم يقول: فرددناهم بطعن كما تُحرَّك الدلاء في جمة البئر."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَسَدُنْ فِلْ / لِقَاءِ وَرْ / دُنْ هَمُوسُنْ = فعلاتن / متفع لن / فاعلاتن — وَرَبِيعُنْ / إِنْ شَنْنَعَتْ / غَبْرَاءُو = فعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "وصف حُجْر بين خبره وردّه، والموصوف عند الزَّوْزَنِيّ حُجْر: «كان حجر أسدًا في الحرب بهذه الصفة» [@zawzani، ص281]. ويخالف الزَّوْزَنِيّ ابن الأَنْبارِيّ في «هموس»، فيجعله من صوت القدم: «وجعل الأسد هموسًا؛ لأنه يسمع من رجليه في مشيه صوت» [@zawzani، ص281]."
variants:
  - reading: "وَرَبِيعٌ إِنْ شَنَّعَتْ شَهْبَاءُ"
    status: "رواية أخرى"
    note: "«ويروى (إن شنعت شهباءُ) وهي السنة الشديدة» [@tabrizi-ashr، ص284]."
  - reading: "أَسَدٌ فِي السِّلَاحِ وَرْدٌ هَمُوسٌ"
    status: "رواية أخرى"
    note: "«ويروى (أسد في السلاح) يعني حُجرا» [@tabrizi-ashr، ص284]."
  - reading: "وَرَبِيعٌ إِنْ شَمَّرَتْ غَبْرَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«شمرت: استعدت» [@zawzani، ص281]."
