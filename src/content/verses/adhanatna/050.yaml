first: "أَمْ عَلَيْنَا جَرَّى إِيَادٍ كَمَا قِيـ"
second: "ـلَ بِطَسْمٍ أَخُوكُمُ الْأَبَّاءُ"
meaning: "أم علينا جناية إياد؟ تأخذوننا بذنب غيرنا كما قيل لطَسْم: أخوكم هو الذي أبى، فنأخذكم بذنبه. قال ابن الأَنْبارِيّ: «يقول: فتريدون أن تحملوا علينا ذنوب الناس كما قيل لطسم: أن أخاكم كسر الخراج فنحن نأخذكم بذنبه» [@ibn-al-anbari، ص484]."
vocabulary:
  - term: "إِيَادٍ"
    text: "قبيلة من نزار. قال هشام بن محمد الكَلْبِيّ فيما ينقل ابن الأَنْبارِيّ: «ولم يكن في نزار حي أكثر من إياد ولا أحسن وجوها ولا أمد أجساما، ولا أشد امتناعا» [@ibn-al-anbari، ص483]."
  - term: "طَسْمٍ"
    text: "قبيلة قديمة، أخت جَدِيس؛ كسرت جَدِيس خراج الملك «فأخذت طسم بذنب جديس» [@ibn-al-anbari، ص484]."
  - term: "الْأَبَّاءُ"
    text: "«الذي أبى أن يطيع الملك بأن يؤدي ما عليه، يقال: أبى يأبى إباء فهو آب وأَبَّاء على التكثير» [@tabrizi-ashr، ص273]."
syntax:
  - "«والأخ رفع بالأباء، وجملة الكلام اسم ما لم يسم فاعله» [@ibn-al-anbari، ص484]: أي جملة «أخوكم الأبّاء» مقول القول، وهي في موضع نائب الفاعل لـ«قِيل»."
  - "الباء في «بِطَسْمٍ» بمعنى اللام، أي قيل لطَسْم، وهي رواية التِّبْرِيزِيّ «لِطَسْمٍ» [@tabrizi-ashr، ص272]."
morphology:
  - "«الْأَبَّاء» صيغة مبالغة على «فَعّال» من «أبى» [@tabrizi-ashr، ص273]."
  - "«قِيلَ» ماض مبني للمجهول من «قال»، أصله «قُوِلَ»."
  - "«أَخُوكُمُ» من الأسماء الخمسة، مرفوع بالواو، والميم مشبعة في الوزن."
rhetoric:
  thesis: "مَثَل من التاريخ القديم: طَسْم أُخذت بذنب أختها."
  devices:
    - title: "التمثيل في «كَمَا قِيلَ بِطَسْمٍ أَخُوكُمُ الْأَبَّاءُ»"
      text: "يشبه حال بَكْر بحال طَسْم، وهي حكاية يعرفها السامعون: قوم أُخذوا بذنب إخوتهم. فالتشبيه لا يحتاج إلى شرح، يكفيه أن يذكّر بالقصة. والشبه في الحال كلها لا في صفة واحدة."
    - title: "الحكاية في «أَخُوكُمُ الْأَبَّاءُ»"
      text: "نقل الكلمة التي قيلت لطَسْم بلفظها، فصار الملك القديم يتكلم في البيت؛ وفي ذلك تعريض بأن تَغْلِب تطلب من عَمْرو بن هند أن يكون مثل ذلك الملك الظالم."
  connection: "ثم يجمع الأسئلة كلها في حكم واحد: عَنَنًا باطلًا وظلمًا."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَمْ عَلَيْنَا / جَرْرَى إِيَا / دِنْ كَمَا قِي = فاعلاتن / مستفع لن / فاعلاتن — لَ بِطَسْمِنْ / أَخُوكُمُلْ / أَبْبَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في أول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "آخر الأسئلة (44–50). وفي إياد خبر طويل عند ابن الأَنْبارِيّ عن هشام بن محمد الكَلْبِيّ: كانت تنزل سنداد وتمتنع عن الإتاوة، وهزمت جيوش كِسرى مرتين، ثم تفرقت [@ibn-al-anbari، ص482–483]. وليس البيت تامًّا عند الزَّوْزَنِيّ: صدره عنده مع عجز البيت 47 [@zawzani، ص284]."
