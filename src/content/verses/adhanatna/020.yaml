first: "مِنْ مُنَادٍ وَمِنْ مُجِيبٍ وَمِنْ تَصْـ"
second: "ـهَالِ خَيْلٍ خِلَالَ ذَاكَ رُغَاءُ"
meaning: "ضوضاء من منادٍ يصيح، ومجيب يرد، وصهيل خيل، وبين ذلك رغاء الإبل. قال ابن الأَنْبارِيّ: «معناه من مناد يقول يا فلان، ومن مجيب المنادى، ومن صهيل خيل» [@ibn-al-anbari، ص453]."
vocabulary:
  - term: "تَصْهَالِ"
    text: "«التصهال كالصهيل» [@zawzani، ص273]، وهو صوت الخيل."
  - term: "خِلَالَ ذَاكَ"
    text: "«معناه بين ذاك» [@ibn-al-anbari، ص453]."
  - term: "رُغَاءُ"
    text: "«رغاء الخيل والإبل» [@ibn-al-anbari، ص453]، وعند التِّبْرِيزِيّ «رغاء الإبل: أي أصواتها» [@tabrizi-ashr، ص259]."
syntax:
  - "«ومن صلة الضوضاء» [@ibn-al-anbari، ص453]: أي أن «من منادٍ» وما عُطف عليه بيان للضوضاء في البيت السابق."
  - "«ورغاء يرتفع بقوله خلال» [@ibn-al-anbari، ص453]؛ أي هو مبتدأ مؤخر خبره الظرف «خلال ذاك»."
morphology:
  - "«تَصْهَال» مصدر على «تَفْعال» بفتح التاء: «وتفعال لا يكون إلا مصدرًا، وتِفعال لا يكون إلا اسْمًا» [@zawzani، ص273]."
  - "«رُغاء» مصدر على «فُعال»، وهو وزن يكثر في الأصوات كالصُّراخ والنُّباح."
  - "«مُنادٍ» و«مُجِيب» اسما فاعل من «نادى» و«أجاب»، و«منادٍ» منقوص حُذفت ياؤه للتنوين."
rhetoric:
  thesis: "بيت أصوات: يُسمعك الجلبة صوتًا صوتًا."
  devices:
    - title: "التفصيل بعد الإجمال"
      text: "أجمل في «ضوضاء»، ثم فصّلها هنا أربعة أصوات: النداء والإجابة والصهيل والرغاء. قال الزَّوْزَنِيّ: «اختلطت أصوات الداعين والمجيبين والخيل والإبل، يريد بذلك تجمعهم وتأهبهم» [@zawzani، ص273]."
    - title: "تكرار «مِنْ»"
      text: "«مِنْ مُنَادٍ وَمِنْ مُجِيبٍ وَمِنْ تَصْهَالِ»: ثلاث مرات، فتتزاحم الأصوات في السمع كما تتزاحم في الحي."
  connection: "ثم يلتفت إلى الذي يتكلم عنهم عند الملك: «أيها الناطق المرقش عنا»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "مِنْ مُنَادِنْ / وَمِنْ مُجِي / بِنْ وَمِنْ تَصْ = فاعلاتن / متفع لن / فاعلاتن — هَالِ خَيْلِنْ / خِلَالَ ذَا / كَ رُغَاءُو = فاعلاتن / متفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "تفسير الضوضاء في البيت السابق، «بيَّن الضوضاء في هذا البيت» كما يقول التِّبْرِيزِيّ [@tabrizi-ashr، ص259]. وسبب هذا الحشد عند ابن الأَنْبارِيّ «اجتماع بني تغلب علينا، وتهمتهم إيانا بأبنائهم الذين قتلهم العطش» [@ibn-al-anbari، ص453]؛ وهو يوافق رواية من قال إن رهائن تَغْلِب ماتوا عطشًا، لا رواية السَّموم."
variants:
  - reading: "...خِلَالَ ذَاكَ الرُّغَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (خلال ذاك الرغاء) بالألف واللام» [@ibn-al-anbari، ص453]."
