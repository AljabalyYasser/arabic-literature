first: "لَمْ يَغُرُّوكُمُ غُرُورًا وَلَكِنْ"
second: "يَرْفَعُ الْآلُ جَمْعَهُمْ وَالضَّحَاءُ"
meaning: "لم يأتوكم على غفلة، بل رأيتم جمعهم يرفعه السراب في ضحى النهار. قال ابن الأَنْبارِيّ: «هؤلاء الذين غزوكم، يعنى عمرا وأصحابه، لم يأتوكم عن غرة، ولكن الآل والضحاء رفعا لكم جمعهم فأتوكم على خبرة منكم بهم» [@ibn-al-anbari، ص491]."
vocabulary:
  - term: "يَغُرُّوكُمُ"
    text: "يأتوكم على غِرّة، أي غفلة: «لم يأتوكم عن غرة» [@ibn-al-anbari، ص491]."
  - term: "الْآلُ"
    text: "«الذي يراه الإنسان من بعد في وقت ارتفاع النهار يخيل له» [@ibn-al-anbari، ص491]؛ وعند الزَّوْزَنِيّ: «ما يرى كالسراب في طرفي النهار» [@zawzani، ص279]."
  - term: "الضَّحَاءُ"
    text: "«ارتفاع النهار» [@ibn-al-anbari، ص491]."
syntax:
  - "«والآل رفع بيرفع، والضحاء نسق عليه» [@ibn-al-anbari، ص491]."
  - "«غُرُورًا» مفعول مطلق مؤكد لـ«يغروكم»."
  - "«وَلَكِنْ» حرف استدراك مخفف لا يعمل، وبعده جملة فعلية."
morphology:
  - "«يَغُرُّوكُمُ» مضارع «غرّ» مجزوم بـ«لم» بحذف النون، والميم مشبعة في الوزن."
  - "«الضَّحَاء» على «فَعال»، ممدود."
  - "«جَمْع» مصدر «جمع» يراد به المجموع، أي الجيش."
rhetoric:
  thesis: "لا عذر لتَغْلِب: رأت الجيش قادمًا ولم تمنعه."
  devices:
    - title: "الصورة في «يَرْفَعُ الْآلُ جَمْعَهُمْ»"
      text: "السراب في ضحى الصحراء يُظهر الشخوص البعيدة مرتفعة فوق الأرض؛ وينقل البغدادي عن ابن الأَنْبارِيّ في «الإنصاف»: «وَبِه سمي الْآل لِأَنَّهُ يرفع الشخوص أول النَّهَار وَآخره» [@khizana، ج9 ص249]. فالجيش لم يتسلل، بل رفعه السراب أمام أعينهم، وهذا أشد في عارهم."
    - title: "التكرار في «غُرُورًا»"
      text: "جاءت الكلمة في البيت السابق «إِذْ تَمَنَّوْنَهُمْ غُرُورًا»، أي اغترارًا، وتعود هنا «لَمْ يَغُرُّوكُمُ غُرُورًا»، أي لم يأتوكم على غِرّة. فاللفظ واحد والمعنى مختلف: تَغْلِب هي التي اغترت، والجيش لم يغترّها."
  connection: "ثم يلتفت إلى الشانئ المبلّغ عند عَمْرو: هل لذاك انتهاء؟"
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "لَمْ يَغُرْرُو / كُمُو غُرُو / رَنْ وَلَاكِنْ = فاعلاتن / متفع لن / فاعلاتن — يَرْفَعُلْ آ / لُ جَمْعَهُمْ / وَضْضَحَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن» [@atiq، ص98–99]."
context: "خاتمة أبيات ما أصاب تَغْلِب من غيرنا (52–64)، وفيها يقطع الحارِث على تَغْلِب عذر المفاجأة. وبعده يلتفت إلى خصمه في المجلس ثم إلى الملك."
variants:
  - reading: "...وَلَكِنْ / رَفَعَ الْآلُ شَخْصَهُمْ وَالضَّحَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (رفع الآل)» [@ibn-al-anbari، ص491]، و«شخصهم» عند الزَّوْزَنِيّ [@zawzani، ص279]."
  - reading: "...يَرْفَعُ الْآلُ حِزْبَهُمْ وَالضَّحَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (حزبهم والضحاء)» [@ibn-al-anbari، ص491]، وعند التِّبْرِيزِيّ «حزمهم» [@tabrizi-ashr، ص278]."
