first: "هَلْ عَلِمْتُمْ أَيَّامَ يُنْتَهَبُ النَّا"
second: "سُ غِوَارًا لِكُلِّ حَيٍّ عُوَاءُ"
meaning: "قد علمتم أيام كان الناس يُنهبون بالغارات، ولكل حي صياح مما ينزل به، ولم يطمع فينا أحد. قال ابن الأَنْبارِيّ: «فنحن حين كان الناس هكذا لم يطمع فينا أحد من العرب» [@ibn-al-anbari، ص470]، «لأنا أعزهم، وكنا يومئذ أمنع العرب» [@ibn-al-anbari، ص471]."
vocabulary:
  - term: "غِوَارًا"
    text: "«مصدر غاور القوم مغاورة وغوارا، إذا غار بعضهم على بعض» [@ibn-al-anbari، ص470]."
  - term: "عُوَاءُ"
    text: "«أي صياح، مما ينزل بهم من الإغارة عليهم» [@ibn-al-anbari، ص470]؛ وأصله «صوت الذئب ونحوه» [@zawzani، ص277]."
syntax:
  - "«والأيام نصب بعلمتم، وهي مضافة إلى ينتهب، وغواراُ نصب على المصدر، وعواء رفع باللام» [@ibn-al-anbari، ص471]."
  - "وجملة «لكل حي عواء» حال من «الناس»."
  - "«هَلْ» هنا للتقرير: «وهل في البيت بمعنى قد لأنه يحتج عليهم بما علموه» [@zawzani، ص277]."
morphology:
  - "«غِوَار» مصدر «غاور» على «فِعال»، وهو مصدر «فاعَل» كالقتال والنزال."
  - "«يُنْتَهَبُ» مضارع «انتهب» على «افتعل» مبني للمجهول."
  - "«عُوَاء» مصدر على «فُعال»، وزن الأصوات."
rhetoric:
  thesis: "يحتج بالتاريخ: ما تعلمونه أنتم يشهد لنا."
  devices:
    - title: "الاستفهام التقريري في «هَلْ عَلِمْتُمْ»"
      text: "لا يسأل عن علمهم، بل يقررهم بما يعرفون؛ قال الزَّوْزَنِيّ: «وهل في البيت بمعنى قد» [@zawzani، ص277]. والاستفهام عند عبد القاهر الجُرْجانيّ قد يكون «تَقريرٌ بفعلٍ قد كان، وإنكارٌ له لِمَ كان» [@dalail، ص114]، وهو هنا التقرير."
    - title: "الاستعارة في «عُوَاءُ»"
      text: "العواء صوت الذئب [@zawzani، ص277]، فجعل صياح الأحياء المنكوبة عواء؛ فالناس في تلك الأيام كالذئاب، يغير بعضهم على بعض، ويصيح المغلوب."
  connection: "ثم يذكر غاراتهم: من سعف البحرين إلى الحِساء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "هَلْ عَلِمْتُمْ / أَيْيَامَ يُنْ / تَهَبُنْنَا = فاعلاتن / مستفع لن / فعلاتن — سُ غِوَارَنْ / لِكُلْلِ حَيْ / يِنْ عُوَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "يبدأ هنا ذكر أيام بَكْر (32–39). وفي زمن هذه الأيام قولان: قال الأَصْمَعِيّ إن العرب كانت في طاعة الأكاسرة، فلما ضعف أمر كسرى «غزا بعض العرب بعضا» [@ibn-al-anbari، ص470]؛ وقال أبو عُبَيْدة: «هي أيام غزا فيروز الترك فأسروه، فضعف أمر ملك العرب، فجعلت بكر بن وائل تغير على القبائل» [@ibn-al-anbari، ص471]. والزمن في القولين زمن فوضى، لا ملك فيه يمنع القوي من الضعيف."
variants:
