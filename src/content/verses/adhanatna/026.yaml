first: "مُكْفَهِرًّا عَلَى الْحَوَادِثِ لَا تَرْ"
second: "تُوهُ لِلدَّهْرِ مُؤْيِدٌ صَمَّاءُ"
meaning: "جبلًا متراكبًا ثابتًا على الحوادث، لا تنقصه داهية شديدة من دواهي الدهر. قال الزَّوْزَنِيّ: «يقول: يشتد ثباته على انتياب الحوادث لا ترخيه ولا تضعفه داهية قوية شديدة من دواهي الدهر، يقول: ونحن مثل هذا الجبل في المنعة والقوة» [@zawzani، ص275]."
vocabulary:
  - term: "مُكْفَهِرًّا"
    text: "«متراكم بعضه على بعض ممتنع مارد على الحوادث» [@ibn-al-anbari، ص463]."
  - term: "لَا تَرْتُوهُ"
    text: "«الرتو: القصر من الشيء والنقصان له» [@ibn-al-anbari، ص463]؛ وعند التِّبْرِيزِيّ «لا تنقصه» [@tabrizi-ashr، ص262]."
  - term: "مُؤْيِدٌ"
    text: "«معناه داهية قوية شديدة تغلب كل من تعرض لها» [@ibn-al-anbari، ص463]."
  - term: "صَمَّاءُ"
    text: "«معناه لا جهة لها لشدتها وامتناعها» [@ibn-al-anbari، ص464]، وعند التِّبْرِيزِيّ «لا تسمع فيعتذر إليها» [@tabrizi-ashr، ص262]."
syntax:
  - "«ونصب (مكفهرا) على النعت لأرعن» [@ibn-al-anbari، ص464]، ويجوز رفعه «على معنى هو مكفهر» [@tabrizi-ashr، ص262]."
  - "«والمؤيد رفع بترتوه ... وصماء نعت المؤيد، واللام صلة ترتوه» [@ibn-al-anbari، ص464]؛ أي «مؤيد» فاعل مؤخر، و«للدهر» متعلق بالفعل."
morphology:
  - "«مُكْفَهِرّ» اسم فاعل من «اكفهرّ» على «افعللّ»."
  - "«مُؤْيِد» من «الأَيْد» وهو القوة: «يقال: رجل ذو أيد وآد، أي ذو قوة» [@ibn-al-anbari، ص463]؛ «ويروى: (موئد) بتقديم الواو على الهمزة على إنه مفعل من الوأد. والوأد: الثقل» [@ibn-al-anbari، ص464]."
  - "«تَرْتُوهُ» من «رتا يرتو»: «وأصل الرتو الشد والجمع» [@ibn-al-anbari، ص463]، وهو عند الزَّوْزَنِيّ «من الأضداد، ولكنه في البيت بمعنى الإرخاء» [@zawzani، ص275]."
rhetoric:
  thesis: "الجبل يتحدى الدهر: الثبات صفة قوم الشاعر."
  devices:
    - title: "الاستعارة في «مُكْفَهِرًّا»"
      text: "الاكفهرار في الأصل للوجه العابس: «يقال وجه فلان مكفهر، إذا كان قاطبا» [@ibn-al-anbari، ص463]. فوصف الجبل بوجه عابس يلقى الحوادث، كأنه رجل غاضب لا يلين. وهي استعارة تجعل «للشيءِ الشيءَ ليس له» كما يقول عبد القاهر الجُرْجانيّ [@dalail، ص67]."
    - title: "الاستعارة في «مُؤْيِدٌ صَمَّاءُ»"
      text: "جعل للداهية أذنًا لا تسمع رجاء ولا عذرًا [@tabrizi-ashr، ص262]، فهي لا ترحم. ومع ذلك لا تنقص الجبل."
    - title: "المبالغة بالنفي في «لَا تَرْتُوهُ»"
      text: "لم يقل لا تهدمه، بل لا تنقص منه شيئًا. فنفى أدنى الأثر، فانتفى ما فوقه."
  connection: "ثم يخاطب تَغْلِب: أي خطة أردتم فأدّوها إلينا تشهد بها الأملاء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "مُكْفَهِرْرَنْ / عَلَلْ حَوَا / دِثِ لَا تَرْ = فاعلاتن / متفع لن / فعلاتن — تُوهُ لِدْدَهْ / رِ مُؤْيِدُنْ / صَمْمَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]. وفي متن البيت في النسخة الرقمية «لا تَرْتُوُ» بلا هاء، والصواب «لا ترتوه» كما في الشرح [@ibn-al-anbari، ص463]، وبه يستقيم الوزن."
context: "آخر صورة الجبل (25–26)، وآخر الفخر قبل أن يعرض على تَغْلِب ما يختارون. والجبل في البيتين صورة لبَكْر كلها: لا يضرها الوشاة ولا الدهر."
variants:
  - reading: "...مَا تَرْ / تُوهُ لِلدَّهْرِ مُؤْيِدٌ صَمَّاءُ"
    status: "رواية التِّبْرِيزِيّ"
    note: "«ويروى: (ما ترتوه)» [@ibn-al-anbari، ص464]، وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص262]."
  - reading: "...لَا تَعْجُو / هُ لِلدَّهْرِ مُؤْيِدٌ صَمَّاءُ"
    status: "رواية ابن منظور"
    note: "أنشده شاهدًا على «وعجوته عجوا: أملته»، ثم قال: «ويروى: لا ترتوه» [@lisan، ج15 ص30]."
