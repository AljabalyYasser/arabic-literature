first: "لَمْ يُخَلُّوا بَنِي رِزَاحٍ بِبَرْقَا"
second: "ءِ نِطَاعٍ لَهُمْ عَلَيْهِمْ دُعَاءُ"
meaning: "لم يترك التميميون بني رِزاح في برقاء نِطاع حتى صار بنو رِزاح يدعون الله عليهم، إذ عجزوا عن الثأر. قال ابن الأَنْبارِيّ في «لهم عليهم دعاء»: «يدعون الله تعالى عليهم» [@ibn-al-anbari، ص485]."
vocabulary:
  - term: "يُخَلُّوا"
    text: "من «خلّى» أي ترك؛ والمعنى: لم يتركوهم وشأنهم."
  - term: "رِزَاحٍ"
    text: "بنو رِزاح: قوم من تَغْلِب أغار عليهم التميميون [@ibn-al-anbari، ص485]."
  - term: "بَرْقَاءِ"
    text: "«والبُرْقةُ والبَرْقاء: أَرض غَلِيظَةٌ مُخْتَلِطَةٌ بِحِجَارَةٍ وَرَمْلٍ» [@lisan، ج10 ص16]."
  - term: "نِطَاعٍ"
    text: "«أرضا يقال لها نطاع، قريبة من اليمن» [@ibn-al-anbari، ص485]."
syntax:
  - "«ورواه أبو العباس: (ببرقاء) . نصب برقاء لأنها لا تجري لمدة التأنيث. ونطاع، نعت برقاء. ومن رواه ببرقاء نطاع، قال: كل ما لا يجرى إذا أضيف جرى» [@ibn-al-anbari، ص485]. أي في البيت روايتان: «بِبَرْقَاءِ نِطَاعٍ» بالإضافة، فتُكسر «برقاء» لأن الممنوع من الصرف يُجر بالكسرة إذا أضيف؛ و«بِبَرْقَاءَ نِطَاعٍ» عند أبي العباس، فتُفتح لأنها ممنوعة من الصرف بألف التأنيث الممدودة، و«نطاع» نعت لها."
  - "«لَهُمْ عَلَيْهِمْ دُعَاءُ» جملة حالية: «دعاء» مبتدأ مؤخر، و«لهم» خبر مقدم، و«عليهم» متعلق بـ«دعاء»."
morphology:
  - "«يُخَلُّوا» مضارع «خلّى» على «فعّل»، مجزوم بـ«لم» بحذف النون."
  - "«بَرْقَاء» على «فَعْلاء»، ممنوع من الصرف لألف التأنيث الممدودة."
  - "«دُعَاء» مصدر «دعا» على «فُعال»، همزته منقلبة عن واو."
rhetoric:
  thesis: "صورة المغلوب: لم يبق لتَغْلِب إلا الدعاء."
  devices:
    - title: "الكناية في «لَهُمْ عَلَيْهِمْ دُعَاءُ»"
      text: "لم يقل إنهم عجزوا عن الثأر، بل قال إنهم يدعون الله على عدوهم، والدعاء سلاح من لا سلاح له. فذكر اللازم وأراد الملزوم، وهي الكناية كما يحدها عبد القاهر الجُرْجانيّ: «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المقابلة في «لَهُمْ عَلَيْهِمْ»"
      text: "حرفا جر متجاوران: «لهم» لبني رِزاح، و«عليهم» لتميم؛ فالكلمتان تضعان الفريقين متقابلين في نصف شطر."
  connection: "ثم يقول: تركوهم مقطّعين بالسيوف وعادوا بنهاب كثير."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "لَمْ يُخَلْلُو / بَنِي رِزَا / حِنْ بِبَرْقَا = فاعلاتن / متفع لن / فاعلاتن — ءِ نِطَاعِنْ / لَهُمْ عَلَيْ / هِمْ دُعَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "يتابع خبر غارة تميم على بني رِزاح. وروى الزَّوْزَنِيّ «لَمْ يُحِلُّوا» من الإحلال، وشرحه على وجه آخر: «يعيرهم بأنهم أحلوا محارم هؤلاء القوم بهذا الموضع فدعوا عليهم» [@zawzani، ص285]، وهو عنده بعد البيت 55."
