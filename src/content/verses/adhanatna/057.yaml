first: "ثُمَّ خَيْلٌ مِنْ بَعْدِ ذَاكَ مَعَ الْغَلْـ"
second: "ـلَاقِ لَا رَأْفَةٌ وَلَا إِبْقَاءُ"
meaning: "ثم غزتكم بعد تميم خيل مع الغَلّاق، لا رحمة عندهم بكم ولا إبقاء عليكم. قال ابن الأَنْبارِيّ: «يريد: غزتكم بعد بني تميم خيل من الغلاق. (لا رأفة) ، يقول: ليس لأصحاب الغلاق رأفة بكم ولا إبقاء عليكم» [@ibn-al-anbari، ص487]."
vocabulary:
  - term: "الْغَلَّاقِ"
    text: "«رجل من بني يربوع بن حنظلة، من تميم، كان على هجائن النعمان بن المنذر الأكبر، وكان أغار على بني تغلب فقتل فيهم» [@ibn-al-anbari، ص487]."
  - term: "رَأْفَةٌ"
    text: "أشد الرحمة."
  - term: "إِبْقَاءُ"
    text: "أن يُبقي المرء على عدوه فلا يستأصله."
syntax:
  - "«والخيل رفع بما عاد من المضمر، معناه: لا عندهم رأفة، والرأفة رفع بالصفة» [@ibn-al-anbari، ص487]: أي «خيلٌ» مبتدأ، وخبره جملة «لا رأفة ولا إبقاء» على تقدير «عندهم»."
  - "«مِنْ بَعْدِ ذَاكَ» متعلق بالخبر المحذوف، والإشارة إلى غارة تميم الأولى."
morphology:
  - "«رَأْفَة» مصدر «رأف» على «فَعْلة»."
  - "«إِبْقَاء» مصدر «أبقى» على «إفعال»، همزته منقلبة عن ياء."
  - "«الْغَلَّاق» على «فَعّال»، صيغة مبالغة صارت اسمًا لرجل."
rhetoric:
  thesis: "الضربة الثانية: بعد تميم جاء الغلّاق."
  devices:
    - title: "المجاز في «خَيْلٌ»"
      text: "قال «خيل» وأراد فرسانها، فذكر المركوب وأراد الراكب. وقدّرها التِّبْرِيزِيّ: «ثم أصحاب خيل من بعد بني تميم» [@tabrizi-ashr، ص275]، أي حُذف المضاف."
    - title: "الإيجاز في «لَا رَأْفَةٌ وَلَا إِبْقَاءُ»"
      text: "جملتان بلا فعل ولا خبر ظاهر، كأنهما صيحة الغارة نفسها: لا رحمة ولا بقاء."
  connection: "ثم يقول: ما أصابوا من تغلبي فدمه مطلول."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "ثُمْمَ خَيْلُنْ / مِنْ بَعْدِ ذَا / كَ مَعَلْ غَلْ = فاعلاتن / مستفع لن / فعلاتن — لَاقِ لَا رَأْ / فَتُنْ وَلَا / إِبْقَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]. وتنتهي تفعيلة الصدر الأخيرة باللام الأولى من «الغلّاق»، فقسمة الشطرين «الْغَلْـ / ـلَاقِ»؛ وفي نسخة الشاملة «الغَ ... لاّقِ» [@ibn-al-anbari، ص486]."
context: "الغارة الثانية في هذا المقطع. والغلّاق تميمي كما يقول ابن الأَنْبارِيّ، فتَغْلِب أُصيبت من تميم مرتين، والحارِث يعدّ ذلك عليها أمام الملك."
