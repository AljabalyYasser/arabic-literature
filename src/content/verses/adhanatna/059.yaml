first: "كَتَكَالِيفِ قَوْمِنَا إِذْ غَزَا الْمُنْـ"
second: "ـذِرُ هَلْ نَحْنُ لِابْنِ هِنْدٍ رِعَاءُ"
meaning: "ودماؤكم هذه كدماء الذين كُلّفوا الغزو مع الملك فأبوا وقالوا: أرعاءٌ نحن لابن هند؟ فقُتلوا وذهبت دماؤهم هدرًا. قال ابن الأَنْبارِيّ: «كما كلفوا أن يرجعوا إلى عمرو بن هند فقالوا: لا نرجع. فجعل أول غزاة عليهم، فقتل من قتل منهم فطلت دماؤهم» [@ibn-al-anbari، ص488]."
vocabulary:
  - term: "تَكَالِيفِ"
    text: "«التكاليف من التكلُّف» [@ibn-al-anbari، ص487]، و«يجوز أن يكون جمع تكلفة، ويجوز أن يكون جمع تكليف» [@tabrizi-ashr، ص276]. وهي عند الزَّوْزَنِيّ «المشاقّ والشدائد» [@zawzani، ص278]."
  - term: "قَوْمِنَا"
    text: "هم عند ابن الأَنْبارِيّ الطائفة من تَغْلِب التي أبت طاعة عَمْرو بن هند [@ibn-al-anbari، ص487–488]، وعند الزَّوْزَنِيّ بَكْر قوم الشاعر [@zawzani، ص278]."
  - term: "ابْنِ هِنْدٍ"
    text: "عَمْرو بن هند، وأمه هند بنت عَمْرو بن حُجْر آكل المُرار [@ibn-al-anbari، ص487–488]."
  - term: "رِعَاءُ"
    text: "جمع راعٍ؛ أي: أنحن رعاة نسير بأمره ونغزو إذا دعانا؟"
syntax:
  - "«والكاف معناه مثل، والرعاء رفع بنحن» [@ibn-al-anbari، ص488]: أي الكاف اسم بمعنى «مثل»، والتقدير: دماؤكم مطلولة مثل دماء الذين كُلّفوا؛ و«رعاء» خبر «نحن»."
  - "«هَلْ نَحْنُ لِابْنِ هِنْدٍ رِعَاءُ» جملة محكية، هي قول تَغْلِب كما يقول ابن الأَنْبارِيّ [@ibn-al-anbari، ص488]."
  - "«إِذْ» ظرف مضاف إلى جملة «غَزَا الْمُنْذِرُ»."
morphology:
  - "«تَكَالِيف» جمع «تكلفة» أو «تكليف» [@tabrizi-ashr، ص276]، على «تفاعيل»."
  - "«رِعَاء» جمع «راعٍ» على «فِعال»."
  - "«الْمُنْذِر» اسم فاعل من «أنذر» صار علمًا."
rhetoric:
  thesis: "يقلب على تَغْلِب كلمتها: الذين أنفوا أن يكونوا رعاء الملك قُتلوا."
  devices:
    - title: "الحكاية في «هَلْ نَحْنُ لِابْنِ هِنْدٍ رِعَاءُ»"
      text: "ينقل كلمة تَغْلِب بلفظها في مجلس ابن هند نفسه: «فإنما حكى الحارث في قوله (هل نحن لابن هند رعاء) قول بني تغلب» [@ibn-al-anbari، ص488]. فالبيت يشهد عليهم بلسانهم أمام الملك الذي استكبروا عن طاعته."
    - title: "الاستفهام الإنكاري في «هَلْ نَحْنُ ... رِعَاءُ»"
      text: "استفهام في فم تَغْلِب يراد به الأنفة: لسنا رعاة لك. والحارِث يحكيه ليُغضب الملك عليهم من جديد."
  connection: "ثم يذكر ميسون: إذ أحلّ العلاة قبة ميسون."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "كَتَكَالِي / فِ قَوْمِنَا / إِذْ غَزَلْ مُنْ = فعلاتن / متفع لن / فاعلاتن — ذِرُ هَلْ نَحْ / نُ لِبْنِ هِنْ / دِنْ رِعَاءُو = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]. وفي نسخة الشاملة «ذِرُ هَلْ لابنِ هِندٍ رِعاءُ» بسقوط «نحن»، وبه ينكسر الوزن؛ وفي شرح ابن الأَنْبارِيّ نفسه «(هل نحن لابن هند رعاء)» و«والرعاء رفع بنحن» [@ibn-al-anbari، ص488]، وكذلك عند الزَّوْزَنِيّ والتِّبْرِيزِيّ [@zawzani، ص278] [@tabrizi-ashr، ص276]؛ فأثبتناها."
context: "بيت التحول من غارات تميم إلى غزوة الملك نفسه (59–64). والخبر عند ابن الأَنْبارِيّ أن طائفة من تَغْلِب انحازت بعد مقتل المُنْذِر بن ماء السماء وقالت: «لا نعطي أحدا من ولده طاعة» [@ibn-al-anbari، ص487]، فلما دعاهم عَمْرو بن هند إلى الغزو معه قالوا: «مالنا نغزو معك، أرعاء نحن لك» [@ibn-al-anbari، ص488]، فجعل أخاه النُّعْمان على جيشه وأمره أن يبدأ بهم [@ibn-al-anbari، ص488]. ويسمي البيت الغازي «المنذر». وفي «قومنا» قولان: هم عند ابن الأَنْبارِيّ تَغْلِب، والحارِث يحكي قولها؛ وعند الزَّوْزَنِيّ بَكْر: «ذكر أنهم نصروا الملك حين لم ينصره بنو تغلب، وعيّرهم بأنهم رعاء الملك وقومه يأنفون من ذلك» [@zawzani، ص278]."
