first: "إِرَمِيٌّ بِمِثْلِهِ جَالَتِ الْجِنْـ"
second: "ـنُ فَآبَتْ لِخَصْمِهَا الْأَجْلَاءُ"
meaning: "هو ملك عريق كأنه من إرم عاد، بمثله كاشف دهاة الناس خصومهم فرجعوا وقد ظهر أمرهم وغلبوا. قال ابن الأَنْبارِيّ: «يقول: بمثل عمرو بن هند كاشفت الجن الناس فآبوا، أي رجعوا، وقد فلج خصمهم على كل من خاصمهم» [@ibn-al-anbari، ص493]، أي غلب صاحبهم كل من خاصمه."
vocabulary:
  - term: "إِرَمِيٌّ"
    text: "«نسبة إلى إرم عاد، أي ملكه قديم كان على عهد إرم» [@ibn-al-anbari، ص492]؛ «وقال بعضهم: أراد كأن هذا الممدوح من إرم عاد في الحلم» [@ibn-al-anbari، ص492]."
  - term: "الْجِنُّ"
    text: "«الجن في هذا الموضع: دهاة الناس وأبطالهم» [@ibn-al-anbari، ص493]."
  - term: "جَالَتِ"
    text: "«فأعلت من المجالاة، وهي المكاشفة» [@ibn-al-anbari، ص493]، أي على وزن «فاعَلت»."
  - term: "الْأَجْلَاءُ"
    text: "«جمع الجلا. والجلا: الأمر المنكشف» [@ibn-al-anbari، ص493]، ومنه قول سُحَيْم بن وَثِيل: «أَنَا ابْنُ جَلَا وَطَلَّاعُ الثَّنَايَا» [@ibn-al-anbari، ص493]."
syntax:
  - "«والباء صلة جالت ... والأجلاء رفع بآبت، واللام صلة آبت» [@ibn-al-anbari، ص493]: أي «بمثله» متعلق بـ«جالت»، و«الأجلاء» فاعل «آبت»."
  - "«إِرَمِيٌّ» خبر لمبتدأ محذوف، أي: هو إرميّ، ويتصل بالبيت السابق."
morphology:
  - "«جَالَتْ» على «فاعَلت» من «جلا»: «والأصل في جالت جالوت، فصارت الواو ألفا لتحركها وانفتاح ما قبلها، وسقطت لسكونها وسكون التاء» [@ibn-al-anbari، ص493]."
  - "«إِرَمِيّ» اسم منسوب إلى «إرم»؛ وفي اللسان: «وَقَالَ اللِّحْيَانِيُّ: أَرَمِيّ ويَرَمِيّ وإِرَمِيّ» [@lisan، ج12 ص15]."
  - "«الْأَجْلَاء» جمع «جَلًا» على «أفعال»."
rhetoric:
  thesis: "مدح بالقِدَم وبالدهاء: ملك عريق يغلب به أنصاره خصومهم."
  devices:
    - title: "الاستعارة في «الْجِنُّ»"
      text: "سمى دهاة الناس وأبطالهم جنًّا، «يقال للرجل إذا كان بطلا: ما هو إلا جنى» [@ibn-al-anbari، ص493]. فالذين يحتمون بالملك يصيرون كالجن قوة وخفاء."
    - title: "التشبيه المضمر في «إِرَمِيٌّ»"
      text: "النسبة إلى إرم تحمل التشبيه بلا أداة: كأنه من عاد في قدم ملكه، أو في حلمه، أو في جسمه وقوته، على الأقوال الثلاثة عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص492–493]. فالكلمة الواحدة تجمع العراقة والقوة."
  connection: "ثم يقول: من لنا عنده من الخير آيات ثلاث."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "إِرَمِيْيُنْ / بِمِثْلِهِي / جَالَتِلْ جِنْ = فعلاتن / متفع لن / فاعلاتن — نُ فَآبَتْ / لِخَصْمِهَلْ / أَجْلَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "البيت من أغمض أبيات القصيدة، واختلفت فيه الروايات والشروح. فمعنى العجز عند التِّبْرِيزِيّ: «أن من كاشف بفخر هذا الملك انكشف أمره وتبين؛ لأن فخره لا يخفى على أحد» [@tabrizi-ashr، ص280]. وعند الزَّوْزَنِيّ رواية أخرى للعجز (انظر الروايات)، وشرحها: «بمثله ينبغي أن تجول الخيل وأن تأبى لخصمها أن يجلى صاحبها عن أوطانه» [@zawzani، ص275]."
variants:
  - reading: "إِرَمِيٌّ بِمِثْلِهِ جَالَتِ الْخَيْـ / ـلُ وَتَأْبَى لِخَصْمِهَا الْإِجْلَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص275]."
