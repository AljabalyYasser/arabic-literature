first: "أَجْمَعُوا أَمْرَهُمْ بِلَيْلٍ فَلَمَّا"
second: "أَصْبَحُوا أَصْبَحَتْ لَهُمْ ضَوْضَاءُ"
meaning: "أحكموا أمرهم في الليل، فلما أصبحوا علت لهم جلبة وصياح. قال الزَّوْزَنِيّ: «يقول: أطبقوا على أمرهم من قتلنا وجدالنا عشاء، فلما أصبحوا جلبوا وصاحوا» [@zawzani، ص273]."
vocabulary:
  - term: "أَجْمَعُوا"
    text: "«معناه أحكموا»، «وأجمعت الأمر، إذا أحكمته» [@ibn-al-anbari، ص452]."
  - term: "ضَوْضَاءُ"
    text: "«معناه جلبة» [@ibn-al-anbari، ص452]؛ و«الضوضاة والضوضاء: أصوات الناس وجلبتهم» [@lisan، ج14 ص488]."
syntax:
  - "«وفاعل جمعوا مضمر فيه ولا خبر له. والضوضاء اسم الإصباح الثاني واللام خبره» [@ibn-al-anbari، ص452]؛ أي «أصبحت» الثانية ناقصة، و«ضوضاء» اسمها، و«لهم» خبرها."
  - "و«أصبحوا» الأولى تامة بمعنى دخلوا في الصباح؛ قال الفراء: «إذا أردت أن تفيد المخاطب صباح الاسم استغنيت عن الخبر» [@ibn-al-anbari، ص453]."
  - "«لَمَّا» ظرف بمعنى حين، جوابه «أصبحت»."
morphology:
  - "«ضَوْضَاء» «حرف ممدود، وهو جمع واحدته ضوضاءة» [@ibn-al-anbari، ص452]؛ ويرى ابن سِيدَه أنها «فعلاء» [@lisan، ج14 ص488]."
  - "«أَجْمَعَ» على «أفعل» للعزم والإحكام، و«جَمَع» بلا همزة للتأليف بين المتفرق: «يقال: قد جمعت الشيء، إذا وفقت بينه وأزلت تفرقه» [@ibn-al-anbari، ص452]."
rhetoric:
  thesis: "الليل والصباح: تدبير صامت ثم ضجيج."
  devices:
    - title: "الطباق بين «بِلَيْلٍ» و«أَصْبَحُوا»"
      text: "يقابل بين الليل الذي دبروا فيه والصباح الذي ظهر فيه أمرهم. وتخصيص الليل عند التِّبْرِيزِيّ «لأنه وقت تتفرغ فيه الأذهان» [@tabrizi-ashr، ص259]."
    - title: "التكرار في «أَصْبَحُوا أَصْبَحَتْ»"
      text: "كرر الفعل مرتين متجاورتين، الأولى تامة والثانية ناقصة، فصار المعنى: ما إن دخلوا في الصباح حتى دخلت معهم الجلبة."
  connection: "ثم يفصّل الضوضاء: منادٍ ومجيب وصهيل ورغاء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَجْمَعُو أَمْ / رَهُمْ بِلَيْ / لِنْ فَلَمْمَا = فاعلاتن / متفع لن / فاعلاتن — أَصْبَحُو أَصْ / بَحَتْ لَهُمْ / ضَوْضَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يصور تَغْلِب في ليلها ونهارها: تدبير في الليل، وجلبة في الصباح. وفي خبر المجلس أن تَغْلِب اجتمعت إلى سيدها عَمْرو بن كُلْثُوم [@aghani-dk، ج11 ص42]؛ فالبيت صورة الحشد قبل الخصومة."
variants:
  - reading: "أَجْمَعُوا أَمْرَهُمْ عِشَاءً فَلَمَّا ..."
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (أجمعوا أمرهم عشاء)» [@ibn-al-anbari، ص452]، وبها يروي الزَّوْزَنِيّ [@zawzani، ص273] وابن منظور [@lisan، ج14 ص488]."
  - reading: "...أَصْبَحَتْ لَهُمْ غَوْغَاءُ"
    status: "الرواية التي رجّحها ابن الأَنْبارِيّ"
    note: "«فالغوغاء: الرذال من الناس» [@ibn-al-anbari، ص452]. «وأصح الروايتين رواية الذين رووا: (أصبحوا أصبحت لهم غوغاء) ؛ لأن البيت الثاني يدل على الصياح والجلبة» [@ibn-al-anbari، ص453]."
