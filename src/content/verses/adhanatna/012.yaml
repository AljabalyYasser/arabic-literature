first: "فَتَرَى خَلْفَهَا مِنَ الرَّجْعِ وَالْوَقْـ"
second: "ـعِ مَنِينًا كَأَنَّهُ إِهْبَاءُ"
meaning: "فترى خلف الناقة، من رفع قوائمها ووقعها على الأرض، غبارًا دقيقًا كأنه غبار يُثار. قال الزَّوْزَنِيّ: «فترى أنت أيها المخاطب خلف هذه الناقة من رجعها ... قوائمها وضربها الأرض بها غبارًا رقيقًا كأنه هباء منبث» [@zawzani، ص271]."
vocabulary:
  - term: "الرَّجْعِ"
    text: "«من رجع قوائمها» [@ibn-al-anbari، ص443]، أي رفعها ثم ردّها إلى الأرض."
  - term: "الْوَقْعِ"
    text: "«وقع خفافها» [@tabrizi-ashr، ص255]."
  - term: "مَنِينًا"
    text: "«الغبار الدقيق الذي تثيره بقوائمها. وكل ضعيف منين» [@ibn-al-anbari، ص443]."
  - term: "إِهْبَاءُ"
    text: "«إثارتها الهباء. والهباء: الغبار الذي كأنه دخان» [@ibn-al-anbari، ص443]."
syntax:
  - "«والمنين نصب بترى، والهاء اسم كأن، والاهباء خبرها» [@ibn-al-anbari، ص444]."
  - "«مِنَ الرَّجْعِ وَالْوَقْعِ» جار ومجرور متعلق بحال من «منينًا»، و«من» للسبب: الغبار ناشئ عن الرجع والوقع."
morphology:
  - "«مَنِين» «فعيل بمعنى مفعول» [@ibn-al-anbari، ص443]، من المَنّ وهو القطع والإضعاف: «والمنة: القوة؛ ولذلك قيل للحبل الخلق منين» [@ibn-al-anbari، ص443]."
  - "«إِهْبَاء» مصدر «أهبى» على «إفعال»: «ويقال: أهبي الظليم يهبي إهباء، إذا غبر» [@ibn-al-anbari، ص444]."
rhetoric:
  thesis: "السرعة تُرى في أثرها: لا يصف الناقة نفسها، بل الغبار الذي تتركه."
  devices:
    - title: "التشبيه في «كَأَنَّهُ إِهْبَاءُ»"
      text: "شبّه الغبار الدقيق بالهباء المثار، والهباء ما تراه في شعاع الشمس: «وإذا دخلت الشمس في الكوة فالذي تراه كأنه غبار من السماء يتناثر هو الهباء» [@ibn-al-anbari، ص443]. فهو تشبيه في هيئة متحركة، وفي مثله يقول عبد القاهر الجُرْجانيّ: «اعلم أن مما يزداد به التشبيه دقة وسحرًا أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "الخطاب في «فَتَرَى»"
      text: "لم يقل «فأرى»، بل «فترى»، فيدعو السامع أن يرى معه، فيصير شاهدًا على سرعة الناقة. والمخاطب عند الزَّوْزَنِيّ «أنت أيها المخاطب» [@zawzani، ص271]."
  connection: "ثم يذكر نعالها التي تتساقط في الصحراء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَتَرَى خَلْ / فَهَا مِنَرْ / رَجْعِ وَلْوَقْ = فعلاتن / متفع لن / فاعلاتن — عِ مَنِينَنْ / كَأَنْنَهُو / إِهْبَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يعود من النعامة إلى الناقة، فالضمير في «خلفها» للناقة: «والمعنى: فترى خلف الناقة من الرجع» [@ibn-al-anbari، ص443]. والغبار الرقيق علامة السرعة: «وجعله رقيقًا إشارة إلى غاية إسراعها» [@zawzani، ص271]."
variants:
  - reading: "...مَنِينًا كَأَنَّهُ أَهْبَاءُ"
    status: "رواية التِّبْرِيزِيّ"
    note: "«ومن رواه (كأنه أهباء) بفتح الهمزة قال: الأهباء جمع الهباء»، و«الإهباء بالكسر في هذا البيت أصح في قول الأصمعي» [@ibn-al-anbari، ص444]. وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص255]."
  - reading: "فَتَرَى خَلْفَهُنَّ مِنْ شِدَّةِ الْوَقْـ / ـعِ مَنِينًا كَأَنَّهُ إِهْبَاءُ"
    status: "رواية أخرى"
    note: "«ويروى (فترى خلفهن من شدة الوقع منينا)»، والضمير فيها للإبل، «لأن الناقة الموصوفة تسير مع غيرها» [@tabrizi-ashr، ص255]."
