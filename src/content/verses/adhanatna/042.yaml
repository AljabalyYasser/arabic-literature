first: "حَذَرَ الْخَوْنِ وَالتَّعَدِّي وَهَلْ يَنْـ"
second: "ـقُضُ مَا فِي الْمَهَارِقِ الْأَهْوَاءُ"
meaning: "تحالفنا حذرًا من الخيانة والتعدي، وهل تنقض الأهواء ما كُتب في الصحف؟ قال ابن الأَنْبارِيّ: «معناه: فإن كانت أهواؤكم زينت لكم الغدر والخيانة بعدما تحالفنا وتعاقدنا فكيف تصنعون بما في الصحف مكتوب عليكم» [@ibn-al-anbari، ص479]."
vocabulary:
  - term: "الْخَوْنِ"
    text: "«من الخيانة» [@ibn-al-anbari، ص478]."
  - term: "الْمَهَارِقِ"
    text: "«الصحف، واحدها مهرق. قال الأصمعي: المهرق فارسي في الأصل» [@ibn-al-anbari، ص478]، وأصله بالفارسية «مهره كرد»، «أي المصقول» [@ibn-al-anbari، ص479]. وعند الزَّوْزَنِيّ: «يأخذون الخرقة ويطلونها بشيء ثم يصقلونها ثم يكتبون عليها شيئًا» [@zawzani، ص283]."
  - term: "الْأَهْوَاءُ"
    text: "جمع هوى، وهو ميل النفس."
syntax:
  - "«والحذر نصب على المصدر» [@ibn-al-anbari، ص479]؛ وعند التِّبْرِيزِيّ: «وهذا يسميه النحويون مفعولا من أجله» [@tabrizi-ashr، ص269]."
  - "«والأهواء رفع بينقض، وما نصب بينقض، وفي صلة ما» [@ibn-al-anbari، ص479]."
  - "«هل» هنا للنفي: «وكذلك معنى هل الجحد» [@ibn-al-anbari، ص479]."
morphology:
  - "«الخَوْن» مصدر «خان يخون» على «فَعْل»."
  - "«المَهارِق» جمع «مُهْرَق» على «مَفاعِل»، وهو معرّب."
  - "«الأَهْواء» جمع «هوى» على «أفعال»."
rhetoric:
  thesis: "الكتابة أقوى من الهوى: العهد المكتوب حجة لا تنقض."
  devices:
    - title: "الاستفهام المراد به النفي"
      text: "«وَهَلْ يَنْقُضُ مَا فِي الْمَهَارِقِ الْأَهْوَاءُ»: لا يسأل بل ينفي، «وكذلك معنى هل الجحد» [@ibn-al-anbari، ص479]. ويروى «ولن ينقض»، والسؤال أبلغ لأنه يحمل الخصم على الإقرار بنفسه."
    - title: "الاستعارة في «يَنْقُضُ ... الْأَهْوَاءُ»"
      text: "جعل الأهواء تنقض كما يُنقض البناء أو الحبل، فللهوى يد تهدم. وهي استعارة في الفعل، والاستعارة عند عبد القاهر الجُرْجانيّ «لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]."
    - title: "المقابلة بين «الْمَهَارِقِ» و«الْأَهْوَاءُ»"
      text: "الصحف ثابتة مكتوبة، والأهواء متقلبة؛ فالبيت يضع الثابت في وجه المتحول."
  connection: "ثم يقول: واعلموا أننا وإياكم فيما اشترطنا يوم اختلفنا سواء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "حَذَرَلْ خَوْ / نِ وَتْتَعَدْ / دِي وَهَلْ يَنْ = فعلاتن / متفع لن / فاعلاتن — قُضُ مَا فِلْ / مَهَارِقِلْ / أَهْوَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "آخر أبيات هذا الجزء (40–42)، وفيه علة الحلف: الحذر من الغدر. والحجة أن العهد مكتوب، والمكتوب لا تبطله الأهواء: «وذلك لا ينقضه شيء» [@ibn-al-anbari، ص479]. وفي البيت التالي يقرر أن الفريقين في الشروط سواء."
variants:
  - reading: "حَذَرَ الْجَوْرِ وَالتَّعَدِّي ..."
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (حذر الجور)» [@ibn-al-anbari، ص478]، وهي رواية الزَّوْزَنِيّ [@zawzani، ص283]، وكذلك عند التِّبْرِيزِيّ [@tabrizi-ashr، ص268]."
  - reading: "...وَلَنْ يَنْـ / ـقُضَ مَا فِي الْمَهَارِقِ الْأَهْوَاءُ"
    status: "رواية التِّبْرِيزِيّ"
    note: "«ويروى: (ولن ينقض)» [@ibn-al-anbari، ص479]، وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص268]."
