first: "وَصَتِيتٍ مِنَ الْعَوَاتِكِ مَا تَنْـ"
second: "ـهَاهُ إِلَّا مُبْيَضَّةٌ رَعْلَاءُ"
meaning: "ومعهم جماعة من أبناء العواتك، لا يكفها إلا ضربة تكشف بياض العظم ويتدلى لحمها من جانبيها. قال ابن الأَنْبارِيّ: «يقول: لا يكف هذا الجمع إلا ضرب شديد موضح عن بياض العظم» [@ibn-al-anbari، ص494]."
vocabulary:
  - term: "صَتِيتٍ"
    text: "«الجماعة» [@ibn-al-anbari، ص494]؛ وفي اللسان: «والصَّتِيتُ: الفِرْقة مِنَ النَّاسِ فِي جَلَبة» [@lisan، ج2 ص52]."
  - term: "الْعَوَاتِكِ"
    text: "«نساء من كندة من الملوك» [@ibn-al-anbari، ص494]؛ وعند الزَّوْزَنِيّ: «الشوابّ الحرائر الخيار من النساء» [@zawzani، ص280]."
  - term: "مُبْيَضَّةٌ"
    text: "ضربة تُظهر بياض العظم."
  - term: "رَعْلَاءُ"
    text: "«الضربة المسترخية اللحم من الجانبين جميعا حتى يظهر العظم» [@ibn-al-anbari، ص494]؛ وأصلها في اللسان من الأذن المشقوقة: «الرَّعْلاء الَّتِي شُقَّت أُذنها شَقّاً وَاحِدًا بَائِنًا فِي وَسَطِهَا فناسَتِ الأُذن مِنْ جَانِبَيْهَا» [@lisan، ج11 ص288]، أي تدلّت."
syntax:
  - "«والصتيت منخفض بالنسق على الكبش، كأنه قال: جاء بنو الشقيقة مستلئمين بكبش وبصتيت من العواتك، والمبيضة رفع بتنهاه، والهاء يعود على الصتيت» [@ibn-al-anbari، ص494]."
  - "«إِلَّا» أداة حصر بعد النفي بـ«ما»، و«مبيضة» فاعل مؤخر، و«رعلاء» نعت لها."
morphology:
  - "«صَتِيت» على «فَعِيل»."
  - "«مُبْيَضَّة» اسم فاعل مؤنث من «ابيضّ» على «افعلّ»، وهو بناء الألوان."
  - "«رَعْلَاء» على «فَعْلاء»."
rhetoric:
  thesis: "العدو الشريف لا يرده إلا الضرب العنيف."
  devices:
    - title: "الكناية في «مُبْيَضَّةٌ رَعْلَاءُ»"
      text: "حذف الموصوف، وهو الضربة، وذكر صفتيها: تُظهر بياض العظم، ويتدلى لحمها من جانبيها. فالسامع يرى الجرح نفسه، ويفهم شدة الضرب من أثره."
    - title: "الإشادة بالعدو في «مِنَ الْعَوَاتِكِ»"
      text: "يصف الخصوم بأنهم أبناء نساء الملوك من كِنْدة، فشرفهم يعظّم فعل بَكْر؛ ولا فخر في رد قوم لا شرف لهم."
  connection: "ثم يقول: فجبهناهم بضرب يخرج منه الدم كما يخرج الماء من فم المزادة."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَصَتِيتِنْ / مِنَلْ عَوَا / تِكِ مَا تَنْ = فعلاتن / متفع لن / فعلاتن — هَاهُ إِلْلَا / مُبْيَضْضَتُنْ / رَعْلَاءُو = فاعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]. و«صَتِيتٍ» منوّن مجرور كما يقتضيه الوزن وقول ابن الأَنْبارِيّ «والصتيت منخفض بالنسق على الكبش» [@ibn-al-anbari، ص494]؛ وهو في نسخة الشاملة بلا تنوين."
context: "يتم وصف جيش العدو في الآية الأولى: «وبنو العواتك خرجوا مع قيس بن معد يكرب» [@ibn-al-anbari، ص494]. وعند الزَّوْزَنِيّ «مبيضة» كتيبة بيضاء بدروعها، «وقيل: بل معناه إلا سيوف مبيضة طوال» [@zawzani، ص280]."
variants:
