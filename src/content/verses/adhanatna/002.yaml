first: "بَعْدَ عَهْدٍ لَهَا بِبُرْقَةِ شَمَّا"
second: "ءَ فَأَدْنَى دِيَارِهَا الْخَلْصَاءُ"
meaning: "أعلمتنا أسماء بفراقها بعد أن كان لنا بها عهد في بُرْقة شَمّاء، وأقرب ديارها إلينا الخَلْصاء. قال ابن الأَنْبارِيّ: «ومعنى البيت: آذنتنا ببينها بعد عهدنا بهذا الموضع»، ثم «أخبر أن له عهدا بهذه المرأة في الخلصاء أقرب من عهده بها في برقة شماء» [@ibn-al-anbari، ص434]."
vocabulary:
  - term: "عَهْدٍ"
    text: "«العهد: اللقاء» [@zawzani، ص269]."
  - term: "بُرْقَةِ"
    text: "«رابية فيها رمل وطين، أو طين وحجارة مختلطان» [@ibn-al-anbari، ص434]."
  - term: "شَمَّاءَ"
    text: "«هضبة معروفة. والهضبة: الجبل من الرمل» [@ibn-al-anbari، ص434]. وفي اللسان: «وبرقة شماء: جبل معروف» [@lisan، ج12 ص327]."
  - term: "أَدْنَى"
    text: "أقرب."
  - term: "الْخَلْصَاءُ"
    text: "«أرض» [@ibn-al-anbari، ص434]."
syntax:
  - "«وبعد صلة آذنتنا، واللام والباء صلتان للعهد» [@ibn-al-anbari، ص434]؛ أي أن الظرف «بَعْدَ» متعلق بالفعل «آذنتنا» في البيت الأول، و«لَهَا» و«بِبُرْقَةِ» متعلقان بـ«عَهْدٍ»."
  - "«وشماء مخفوضة بإضافة البرقة إليها، إلا أنها نصبت لأنها لا تجرى بمدة التأنيث التي فيها» [@ibn-al-anbari، ص434]؛ أي أنها مجرورة بالفتحة لأنها ممنوعة من الصرف، و«لا تُجرى» معناه لا تُصرف."
  - "«وأدنى رفع بالخلصاء، والخلصاء به» [@ibn-al-anbari، ص434]؛ أي أنهما مبتدأ وخبر يرفع كل منهما الآخر، على مذهب الكوفيين، والجملة معطوفة بالفاء."
morphology:
  - "«الديار: جمع دار. والأصل في دار دور»، «وديار في الجمع بمنزلة قولك عبد وعباد، وبحر وبحار. ويقال في جمع الدار أيضا أدؤر ودور» [@ibn-al-anbari، ص434]."
  - "«أَدْنَى» اسم تفضيل على «أَفْعَل» من «دنا يدنو» إذا قرب."
  - "«شَمَّاء» على «فَعْلاء»، مؤنث «أَشَمّ»، من الشمم وهو ارتفاع الرأس: «وجبل أشم أي طويل الرأس» [@lisan، ج12 ص327]."
rhetoric:
  thesis: "بيت أماكن: يجعل الشاعر الذكرى جغرافيا، فيقيس بُعد صاحبته بالمواضع: عهد قديم ببُرْقة شَمّاء، وعهد أقرب بالخَلْصاء."
  devices:
    - title: "الإيجاز في «بَعْدَ عَهْدٍ»"
      text: "لم يقل: بعد أن لقيتها وعاشرتها، بل قال «عهد» وترك السامع يملأ الكلمة بما يعرف من أيام الوصل. والعهد عند الزَّوْزَنِيّ اللقاء [@zawzani، ص269]."
    - title: "التدرج من البعيد إلى القريب"
      text: "«بِبُرْقَةِ شَمَّاءَ» ثم «فَأَدْنَى دِيَارِهَا الْخَلْصَاءُ»: ينتقل من موضع إلى أقرب منه، فالفاء ترتب المواضع كما ترتب الأيام. وهكذا فهمه ابن الأَنْبارِيّ: عهده بها في الخلصاء «أقرب من عهده بها في برقة شماء» [@ibn-al-anbari، ص434]."
  connection: "ثم يعدّ مواضع أخرى عهدها فيها: المُحَيّاة والصِّفاح وفِتاق وعاذِب والوَفاء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "بَعْدَ عَهْدِنْ / لَهَا بِبُرْ / قَةِ شَمْمَا = فاعلاتن / متفع لن / فعلاتن — ءَ فَأَدْنَى / دِيَارِهَلْ / خَلْصَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "يكمل المطلع: الفراق جاء بعد عهد طويل. وتبدأ هنا أسماء المواضع التي تمتد إلى البيت 4، فالشاعر يقيس عهده بصاحبته بالأماكن. وقال البغدادي بعد أن شرح هذا البيت: «ثم اورد بيتين آخرين فيهما أسامي أماكن معطوفة على الخلصاء لا فائدة في إيرادها» [@khizana، ج3 ص416]، أي لا فائدة في نقلهما في كتابه، لأنه يشرح شواهد النحو."
variants:
  - reading: "بَعْدَ عَهْدٍ لَنَا بِبُرْقَةِ شَمَّا"
    status: "رواية أخرى"
    note: "«ويروى: (بعد عهد لنا)» [@ibn-al-anbari، ص434]، وبها أنشده ابن منظور [@lisan، ج12 ص327]، ويذكرها التِّبْرِيزِيّ [@tabrizi-ashr، ص252]."
