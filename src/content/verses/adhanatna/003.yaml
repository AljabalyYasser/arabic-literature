    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (فأعناق فتاق)» [@ibn-al-anbari، ص435]، وبها يروي الزَّوْزَنِيّ [@zawzani، ص269]. وفي اللسان «فأعناقُ قَنانٍ» [@lisan، ج15 ص401]."
