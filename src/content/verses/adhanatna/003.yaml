first: "فَمُحَيَّاةُ فَالصِّفَاحُ فَأَعْلَى"
second: "ذِي فِتَاقٍ فَعَاذِبٌ فَالْوَفَاءُ"
meaning: "ثم كان عهده بها في مواضع أخرى متتابعة: المُحَيّاة، فالصِّفاح، فأعلى ذي فِتاق، فعاذِب، فالوَفاء. قال ابن الأَنْبارِيّ: «أخبر بقرب عهده بهذه المواضع وبهذه المرأة فيها» [@ibn-al-anbari، ص435]."
vocabulary:
  - term: "مُحَيَّاةُ"
    text: "«أرض» [@ibn-al-anbari، ص435]."
  - term: "الصِّفَاحُ"
    text: "«أسماء هضاب مجتمعة. وواحد الصفاح صفحة» [@ibn-al-anbari، ص435]."
  - term: "فِتَاقٍ"
    text: "«جبل» [@ibn-al-anbari، ص435]."
  - term: "عَاذِبٌ"
    text: "«واد» [@ibn-al-anbari، ص435]."
  - term: "الْوَفَاءُ"
    text: "«أرض» [@ibn-al-anbari، ص435]، و«الوفاء: موضع» [@lisan، ج15 ص401]."
syntax:
  - "«ومحياة وما بعدها من أسماء المواضع ترتفع بالنسق على الخلصاء» [@ibn-al-anbari، ص435]؛ أي أنها معطوفة بالفاء على «الخلصاء» في البيت السابق."
  - "«أَعْلَى ذِي فِتَاقٍ» إضافة، و«ذي» مجرورة بالياء لأنها من الأسماء الخمسة، بمعنى صاحب."
  - "«مُحَيَّاةُ» ممنوعة من الصرف للعلمية والتأنيث، فرُفعت بلا تنوين، و«عَاذِبٌ» منوّن مصروف."
morphology:
  - "«الصِّفَاح» جمع «صَفْحة» على «فِعال» [@ibn-al-anbari، ص435]، كما يقال قَصْعة وقِصاع."
  - "«مُحَيَّاة» على صيغة اسم المفعول من «حيّا» على «فعّل»، وصار علمًا على موضع."
  - "«أَعْلَى» اسم تفضيل على «أفعل» من «علا يعلو»، قُلبت لامه ألفًا."
rhetoric:
  thesis: "بيت كله أسماء أماكن معطوفة بالفاء، فيصير خريطة لأيام الوصل."
  devices:
    - title: "تكرار الفاء"
      text: "خمس فاءات في بيت واحد: «فَمُحَيَّاةُ فَالصِّفَاحُ فَأَعْلَى ... فَعَاذِبٌ فَالْوَفَاءُ». والفاء للترتيب والتعقيب، فكأن المواضع تتوالى أمام عينه، كما فهمها التِّبْرِيزِيّ: «أخبر بقرب عهده بهذه المرأة في هذه المنازل منزلاً منزلا» [@tabrizi-ashr، ص252]."
    - title: "عدّ المواضع"
      text: "عدّ أسماء الأماكن متتابعة بالفاء طريقة معروفة في مطالع الشعر الجاهلي، ومنها مطلع امرئ القَيْس «بِسِقْطِ اللِّوَى بَيْنَ الدَّخُولِ فَحَوْمَلِ». وصوت الأسماء الغريبة وحده يوحي ببعد العهد."
  connection: "ويختم المواضع في البيت التالي برياض القطا وأودية الشُّرْبُب والشُّعْبتين والأَبْلاء."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَمُحَيْيَا / تُ فَصْصِفَا / حُ فَأَعْلَى = فعلاتن / متفع لن / فعلاتن — ذِي فِتَاقِنْ / فَعَاذِبُنْ / فَلْوَفَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]."
context: "البيت الثاني من أبيات المواضع (2–4). ولا يزيد الشراح في هذه الأسماء على أنها أرض وجبل وواد، ويجمعها الزَّوْزَنِيّ في جملة واحدة: «هذه كلها مواضع عهدها بها» [@zawzani، ص269]. فقيمتها في تتابعها، لا في كل اسم وحده."
variants:
