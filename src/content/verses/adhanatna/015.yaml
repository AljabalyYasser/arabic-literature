first: "وَأَتَانَا عَنِ الْأَرَاقِمِ أَنْبَا"
second: "ءٌ وَخَطْبٌ نُعْنَى بِهِ وَنُسَاءُ"
meaning: "وجاءتنا عن الأراقم أخبار وأمر عظيم نهتم به ويسوؤنا. قال ابن الأَنْبارِيّ: «وقوله (نعنى به) معناه نهتم به ويثقل علينا»، و«قال بعض أهل اللغة: معناه ويسوءنا ما يأتينا من ذلك» [@ibn-al-anbari، ص446]."
vocabulary:
  - term: "الْأَرَاقِمِ"
    text: "«أحياء من بني تغلب» [@ibn-al-anbari، ص446]؛ وعند الزَّوْزَنِيّ: «بطون من تغلب، سموا بها لأن امرأة شبهت عيون آبائهم بعيون الأراقم» [@zawzani، ص272]، والأراقم جمع أرقم، وهو ذكر الحيات."
  - term: "أَنْبَاءٌ"
    text: "أخبار؛ «والعرب تقول للخبر نبأ، حقا كان أو باطلا» [@ibn-al-anbari، ص446]."
  - term: "خَطْبٌ"
    text: "«الأمر العظيم» [@tabrizi-ashr، ص257]."
  - term: "نُعْنَى بِهِ"
    text: "«نهتم به ويثقل علينا» [@ibn-al-anbari، ص446]."
  - term: "نُسَاءُ"
    text: "«معنى نساء به نُظن فيه ونلزم الإساءة» [@ibn-al-anbari، ص446]، وقيل: يسوءنا."
syntax:
  - "«والأنباء ترتفع بأتانا. وإنما قال وأتانا ولم يقل وأتتنا لأن فعل المؤنث إذا فُصل بينه وبين المؤنث بشيء كان الفاصل بينهما كالعوض من تاء التأنيث» [@ibn-al-anbari، ص446]."
  - "«وخطب نسق على الأنباء، ونعني به صلة خطب» [@ibn-al-anbari، ص446]؛ أي الجملة صفة لـ«خطب»، «ونساء نسق على نُعنى»."
morphology:
  - "«أَنْبَاء» جمع «نَبَأ» على «أفعال»: «ويجوز أن يكون ذكر الفعل لأن الأنباء جمع نبأ، والنبأ مذكر، فبنى الجمع على الواحد» [@ibn-al-anbari، ص446]."
  - "«نُعْنَى» مضارع «عُنِي» المبني للمجهول: «يقال عنيت بالشيء أعني به فأنا به معنى» [@ibn-al-anbari، ص446]."
  - "«نُسَاءُ» مضارع «ساء» مبني للمجهول، وأصله «نُسْوَأُ»، نُقلت فتحة الواو إلى السين فقُلبت ألفًا."
rhetoric:
  thesis: "بيت الانتقال إلى الموضوع: كلمة «أتانا» تفتح باب الخصومة."
  devices:
    - title: "التقديم في «وَأَتَانَا عَنِ الْأَرَاقِمِ أَنْبَاءٌ»"
      text: "قدّم «عَنِ الْأَرَاقِمِ» على الفاعل «أنباء»، فعُرف مصدر الخبر قبل الخبر: من تَغْلِب يأتي الشر. وفي التقديم يقول عبد القاهر الجُرْجانيّ: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "الإبهام ثم التفسير"
      text: "قال «أنباء وخطب» ولم يقل ما هي، ثم فسّرها في البيت التالي؛ قال الزَّوْزَنِيّ: «ثم فسر ذلك الخطب فقال: هو تعدي إخواننا من الأراقم علينا» [@zawzani، ص272]. فالإبهام يشد السامع إلى ما بعده."
  connection: "ثم يفسر الخطب: إخواننا الأراقم يغلون علينا في قولهم."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَأَتَانَا / عَنِلْ أَرَا / قِمِ أَنْبَا = فعلاتن / متفع لن / فعلاتن — ءُنْ وَخَطْبُنْ / نُعْنَى بِهِي / وَنُسَاءُو = فاعلاتن / مستفع لن / فعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر وآخر العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "هنا تبدأ القضية: بعد النسيب والناقة يأتي الخبر الذي قامت له القصيدة. ويذكر ابن الأَنْبارِيّ أن الأراقم «اجتمعوا هم وأحياء من بني بكر بن وائل» ... «كانوا مالوا بني تغلب على بني يشكر» [@ibn-al-anbari، ص446]، وهم عِجْل وحَنِيفة وذُهْل بن شَيْبان؛ أي أن بعض بَكْر نفسها مالأت تَغْلِب على قوم الشاعر بني يَشْكُر."
variants:
  - reading: "وَأَتَانَا مِنَ الْحَوَادِثِ وَالْأَنْـ / ـبَاءِ خَطْبٌ نُعْنَى بِهِ وَنُسَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "يذكرها ابن الأَنْبارِيّ بقوله «ويروى» [@ibn-al-anbari، ص446]، وبها يروي الزَّوْزَنِيّ [@zawzani، ص272]."
