first: "لَا أَرَى مَنْ عَهِدْتُ فِيهَا فَأَبْكِي الْـ"
second: "ـيَوْمَ دَلْهًا وَمَا يَرُدُّ الْبُكَاءُ"
meaning: "لا أرى في هذه المنازل من كنت أعهده من أحبابي، فأبكي اليوم بكاء ضائعًا، وأي شيء يرده البكاء؟ قال ابن الأَنْبارِيّ: «فأنا اليوم أبكي شوقا إليهم»، و«أي بكائي يذهب ضياعا، إذ كنت لا أستدرك به شيئا» [@ibn-al-anbari، ص436]."
vocabulary:
  - term: "عَهِدْتُ"
    text: "عرفت ولقيت؛ «العهد: اللقاء» [@zawzani، ص269]."
  - term: "دَلْهًا"
    text: "«معناه باطلا وضياعا» [@ibn-al-anbari، ص436]. وعند الزَّوْزَنِيّ: «الدَّلْه والدَّلَهُ: ذهاب العقل» [@zawzani، ص270]، أي أبكي ذاهب العقل."
  - term: "وَمَا يَرُدُّ الْبُكَاءُ"
    text: "«معناه ما يردهم عليّ ولا يغنى شيئا، غير أني أبكي لتذكرهم» [@ibn-al-anbari، ص436]."
syntax:
  - "«مَنْ» مفعول به لـ«أرى»: «ومن نصب بأرى، وعهدت صلة من» [@ibn-al-anbari، ص436]، والعائد محذوف: من عهدته."
  - "«فَأَبْكِي» ليس جوابًا للنفي: «(فأبكى) ليس بجواب لقوله (لا أرى) ولو كان جوابا لنصبه، ولكنه خبر» [@tabrizi-ashr، ص253]، فهو مرفوع."
  - "«ودلها نصب على المصدر» [@ibn-al-anbari، ص437]، وقيل: «هو من قولهم دلهني أي حيرني فهو تمييز» [@khizana، ج3 ص416]."
  - "«وما نصب بيرد ومعناها الاستفهام كأنه قال: وأي شيء يرد البكاء» [@ibn-al-anbari، ص437]، «والبكاء رفع بفعله»."
morphology:
  - "«دَلْه» مصدر «دَلِه يَدْلَه»: «يقال: رجل مدله العقل، إذا كان ذاهب العقل» [@ibn-al-anbari، ص436]."
  - "«يَرُدُّ» مضارع «ردّ» المضعّف، أُدغمت فيه الدال في الدال."
  - "«البُكاء» مصدر «بكى» على «فُعال»، وهو وزن يكثر في الأصوات."
rhetoric:
  thesis: "البكاء على الأطلال ثم نقده في البيت نفسه: يبكي، ويعرف أن البكاء لا يرد أحدًا."
  devices:
    - title: "الاستفهام المراد به النفي في «وَمَا يَرُدُّ الْبُكَاءُ»"
      text: "سؤال لا ينتظر جوابًا. قال الزَّوْزَنِيّ: «وهذا استفهام يتضمن الجحود، أي لا يرد البكاء على صاحبه فائتًا» [@zawzani، ص270]. والجحود: النفي. والنفي في صورة السؤال أوقع، لأنه يدع السامع يجيب بنفسه."
    - title: "كلمة «الْيَوْمَ»"
      text: "«فَأَبْكِي الْيَوْمَ»: الكلمة تفصل الحاضر الخالي عن العهد القديم الذي عدّ مواضعه في الأبيات 2–4، فالبكاء ابن اللحظة، والمواضع أبناء الماضي."
  connection: "ثم يذكر نارًا أوقدتها هند، امرأة أخرى من أحبابه، رآها آخر عهده بها."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "لَا أَرَى مَنْ / عَهِدْتُ فِي / هَا فَأَبْكِلْ = فاعلاتن / متفع لن / فاعلاتن — يَوْمَ دَلْهَنْ / وَمَا يَرُدْ / دُلْبُكَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن» [@atiq، ص98–99]."
context: "بعد عدّ المواضع يأتي الخلاء: المنازل باقية والناس رحلوا. وفي البيت اعتراف بالبكاء واعتراف بأنه لا يجدي. قال الزَّوْزَنِيّ: «وتحرير المعنى: لما خلت هذه المواضع منها بكيت جزعًا لفراقها مع علمي بأنه لا طائل في البكاء» [@zawzani، ص270]."
variants:
  - reading: "لَا أَرَى مَنْ عَهِدْتُ فِيهَا فَأَبْكِي / أَهْلَ وُدِّي وَمَا يَرُدُّ الْبُكَاءُ"
    status: "رواية أخرى"
    note: "يرويها البغدادي، ويقول: «أي: فأنا أبكي أهل مودتي شوقا إليهم» [@khizana، ج3 ص416]. وعند ابن الأَنْبارِيّ: «لا يُرى من عهدت فيها فأبكى ... أهلَ ودِّي» [@ibn-al-anbari، ص436]."
  - reading: "...وَمَا يُحِيرُ الْبُكَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (وما يحير البكاء) أي وما يرد» [@ibn-al-anbari، ص436]، وبها يروي الزَّوْزَنِيّ: «الإحارة: الرد» [@zawzani، ص269]."
