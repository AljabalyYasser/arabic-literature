first: "أَوْ نَقَشْتُمْ فَالنَّقْشُ تَجْشَمُهُ النَّا"
second: "سُ وَفِيهِ الصَّلَاحُ وَالْإِبْرَاءُ"
meaning: "أو إن استقصيتم في الأمر، فالاستقصاء يتكلفه الناس على مشقة، وفيه ينكشف الأمر ويظهر البريء. قال ابن الأَنْبارِيّ: «والتأويل أن استقصيتم فالاستقصاء يتجشمه الناس ويتكلفونه»، «وفي الاستقصاء صلاح، أي انكشاف للأمر» [@ibn-al-anbari، ص468]."
vocabulary:
  - term: "نَقَشْتُمْ"
    text: "استقصيتم؛ «قال أبو عبيد: لا أحسب نقش الشوكة من الرجل إلا من هذا، وهو استخراجها حتى لا يترك في الجسد منها شيء» [@ibn-al-anbari، ص468]."
  - term: "تَجْشَمُهُ"
    text: "تتكلفه على مشقة؛ «يقال: قد جشمتك لقاء فلان؛ أي كلفتكه» [@ibn-al-anbari، ص468]."
  - term: "الْإِبْرَاءُ"
    text: "البراءة؛ «وعسى أن يكون الإبراء منا فيستبين ذلك للناس» [@ibn-al-anbari، ص468]."
syntax:
  - "«أَوْ نَقَشْتُمْ» شرط ثانٍ معطوف على «إن نبشتم»، وجوابه «فالنقش»."
  - "«والنقش رفع بما عاد من الهاء، والناس مرتفعون بفعلهم، والواو في الصلاح واو حال، والصلاح رفع بفي، والأبراء نسق عليه» [@ibn-al-anbari، ص469]."
morphology:
  - "«نَقَش» يُستعمل في استخراج الشوكة: «وإنما سمى المنقاش منقاشا لأنه ينقش به، أي يستخرج به الشوك» [@ibn-al-anbari، ص468]."
  - "«تَجْشَمُ» من «جَشِم يجشَم» إذا تكلف الأمر على مشقة."
  - "«الْإِبْرَاء» مصدر «أبرأ» على «إفعال»؛ وعند الزَّوْزَنِيّ: «الإبراء: مصدر، والأبراء: جمع برء» [@zawzani، ص276]."
rhetoric:
  thesis: "الاستقصاء كإخراج الشوكة: مؤلم، ولكنه يظهر الحق."
  devices:
    - title: "الاستعارة في «نَقَشْتُمْ»"
      text: "النقش في الأصل استخراج الشوكة من الجسد [@ibn-al-anbari، ص468]، فجعل البحث الدقيق في الذنوب نقشًا لا يترك شيئًا. ومنه الحديث الذي ينقله ابن الأَنْبارِيّ في أن من نوقش الحساب عُذّب، «أي من استقصى عليه» [@ibn-al-anbari، ص469]."
    - title: "الجناس بين «نَبَشْتُمْ» و«نَقَشْتُمْ»"
      text: "كلمتان تختلفان في حرف واحد، في بيتين متتاليين: النبش ثم النقش؛ فيتقارب الخياران في اللفظ كما يتقاربان في المعنى [@ibn-al-anbari، ص467]."
    - title: "التعريض"
      text: "قال «وَفِيهِ الصَّلَاحُ وَالْإِبْرَاءُ» ولم يقل لمن البراءة. والبراءة عند ابن الأَنْبارِيّ لبَكْر، «ويصير عاره عليكم في الاستقصاء» [@ibn-al-anbari، ص468]. فهو يهدد دون أن يصرّح."
  connection: "ثم يعرض الخيار الثالث: السكوت."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَوْ نَقَشْتُمْ / فَنْنَقْشُ تَجْ / شَمُهُنْنَا = فاعلاتن / مستفع لن / فعلاتن — سُ وَفِيهِصْ / صَلَاحُ وَلْ / إِبْرَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "الخيار الثاني: الاستقصاء. والبيت متصل بالسابق، ولذلك أجاز ابن الأَنْبارِيّ أن يكون جواب الشرط في البيت السابق «الفاء التي في البيت الثاني، لأن النقش يضارع معنى النبش» [@ibn-al-anbari، ص467]. ومعناه عند الزَّوْزَنِيّ: «يريد أن الاستقصاء فيما ذكر يبيّن براءتنا من الذنب والذنب ذنبكم» [@zawzani، ص276]."
variants:
  - reading: "...وَفِيهِ السَّقَامُ وَالْإِبْرَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (وفيه السقام)»، «ومن روى: (وفيه السقام) ، أراد: وفي الناس سقام وبراءة» [@ibn-al-anbari، ص468]."
  - reading: "...يَجْشَمُهُ النَّا / سُ وَفِيهِ الْإِسْقَامُ وَالْإِبْرَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«كنّى بالسقم عن الذنب وبالبرء عن براءة الساحة» [@zawzani، ص276]."
  - reading: "إِنْ نَقَشْتُمْ فَالنَّقْشُ ..."
    status: "رواية أخرى"
    note: "«ويروى: (إن نقشتم)» [@ibn-al-anbari، ص468]."
