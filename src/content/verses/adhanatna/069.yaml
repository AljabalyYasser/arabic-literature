first: "آيَةٌ شَارِقُ الشَّقِيقَةِ إِذْ جَا"
second: "ءُوا جَمِيعًا لِكُلِّ حَيٍّ لِوَاءُ"
meaning: "الآية الأولى يوم شارق الشقيقة، حين جاء بنو الشقيقة جميعًا، لكل حي منهم لواء. قال ابن الأَنْبارِيّ: «بنو الشقيقة: قوم من بني شيبان جاءوا يغيرون على إبل لعمرو بن هند، وعليهم قيس بن معد يكرب، وهو أبو الأشعث بن قيس، فردتهم بنو يشكر» [@ibn-al-anbari، ص493]."
vocabulary:
  - term: "شَارِقُ"
    text: "«معناه جاء من قبل المشرق، أي هو صاحب المشرق» [@ibn-al-anbari، ص494]؛ وفي اللسان عن أبي الهيثم: «وَقَوْلُهُ شَارِقُ الشَّقِيقة أَي مِنْ جَانِبِهَا الشَّرْقي الَّذِي يَلِي المَشْرِق» [@lisan، ج10 ص175]."
  - term: "الشَّقِيقَةِ"
    text: "«ويروى عن أبي عمرو إنه قال: الشقيقة: صخرة بيضاء» [@ibn-al-anbari، ص494]؛ وعند الزَّوْزَنِيّ: «أرض صلبة بين رملتين» [@zawzani، ص280]."
  - term: "لِوَاءُ"
    text: "الراية."
syntax:
  - "«والآية رفع بإضمار منهن، وهي العلامة. وشارق تابع للآية، واللواء رفع باللام الزائدة» [@ibn-al-anbari، ص494]: أي «آيةٌ» مبتدأ خبره محذوف تقديره «منهن»، و«شارق» بدل منها."
  - "«جَمِيعًا» حال، وجملة «لكل حي لواء» حال ثانية."
morphology:
  - "«شَارِق» اسم فاعل من «شرق»، ويقول اللسان فيه: «هَذَا مَفْعُولٌ فَجَعَلَهُ فَاعِلًا» [@lisan، ج10 ص175]، أي هو المكان الذي تشرق عليه الشمس، جُعل كأنه هو المُشرق."
  - "«الشَّقِيقَة» على «فَعِيلة»."
  - "«لِوَاء» على «فِعال»، همزته منقلبة عن ياء."
rhetoric:
  thesis: "الآية الأولى: كثرة العدو تعظّم الدفاع."
  devices:
    - title: "الإيجاز في «آيَةٌ شَارِقُ الشَّقِيقَةِ»"
      text: "يسمي الوقعة بمكانها ولا يروي خبرها، فالاسم وحده يستدعي اليوم كله لمن يعرفه."
    - title: "الكناية في «لِكُلِّ حَيٍّ لِوَاءُ»"
      text: "لا يعدّ القبائل، بل يقول إن لكل حي لواء، فتُفهم الكثرة من كثرة الرايات. قال التِّبْرِيزِيّ: «أي هم أحياء مختلفة» [@tabrizi-ashr، ص280]."
  connection: "ثم يقول: حول قيس مستلئمين بكبش قرظي."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "آيَتُنْ شَا / رِقُشْ شَقِي / قَةِ إِذْ جَا = فاعلاتن / متفع لن / فعلاتن — ءُو جَمِيعَنْ / لِكُلْلِ حَيْ / يِنْ لِوَاءُو = فاعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر فصارت «فعلاتن» [@atiq، ص98–99]."
context: "أول الآيات الثلاث (69–74): بنو الشقيقة يغيرون على إبل الملك، وبنو يَشْكُر، قوم الحارِث، يردّونهم «وقتلوا فيهم» [@ibn-al-anbari، ص494]. وفي رواية الزَّوْزَنِيّ واللسان «إِذْ جَاءَتْ مَعَدٌّ»، وشرحه الزَّوْزَنِيّ: «حين جاءت معد بألويتها وراياتها» [@zawzani، ص280]."
variants:
  - reading: "...إِذْ جَا / ءَتْ مَعَدٌّ لِكُلِّ حَيٍّ لِوَاءُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص280]، وكذلك في اللسان [@lisan، ج10 ص175]."
  - reading: "إِنَّهُ شَارِقُ الشَّقِيقَةِ إِذْ جَا"
    status: "رواية اللسان"
    note: "[@lisan، ج10 ص175]."
