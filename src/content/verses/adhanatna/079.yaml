first: "وَأَقَدْنَاهُ رَبَّ غَسَّانَ بِالْمُنْـ"
second: "ـذِرِ كَرْهًا إِذْ لَا تُكَالُ الدِّمَاءُ"
meaning: "وأعطينا الملك القصاص من ملك غسّان، قتلناه بأبيه المنذر قهرًا، في وقت لا يُقتص فيه للدماء. قال ابن الأَنْبارِيّ: «يقول: قتلنا ملك غسان هذا، وإنما قتلناه بالمنذر كرها لأن لا تكال الدماء» [@ibn-al-anbari، ص497]."
vocabulary:
  - term: "أَقَدْنَاهُ"
    text: "أعطيناه القَوَد، أي القصاص: «أقدته: أعطيته القَوَد» [@zawzani، ص282]."
  - term: "رَبَّ غَسَّانَ"
    text: "ملك غسّان: «هو الملك الذي تقدم ذكره أبو ميسون» [@tabrizi-ashr، ص285]."
  - term: "تُكَالُ"
    text: "«يقال: كيل فلان بفلان، إذا قُتل به» [@ibn-al-anbari، ص497]."
syntax:
  - "«والهاء نصب بالفعل، والرب مفعول ثان، وكرها نصب على المصدر» [@ibn-al-anbari، ص497]: أي الهاء لعمرو بن هند، و«ربَّ غسّان» المفعول الثاني، و«بالمنذر» متعلق بـ«أقدناه»."
  - "«إِذْ لَا تُكَالُ الدِّمَاءُ» ظرف مضاف إلى الجملة."
morphology:
  - "«أَقَدْنَا» ماضي «أقاد» على «أفعل» من «القَوَد»، حُذفت ألفه لاتصاله بضمير رفع متحرك."
  - "«تُكَالُ» مضارع مبني للمجهول من «كال يكيل»، وألفه منقلبة عن ياء."
  - "«كَرْهًا» مصدر على «فَعْل»."
rhetoric:
  thesis: "الثأر للأب: أعظم ما يقدّم للملك."
  devices:
    - title: "الاستعارة في «تُكَالُ الدِّمَاءُ»"
      text: "جعل القصاص كيلًا، كأن الدم يُقاس بالدم كما يُكال الطعام؛ قال الزَّوْزَنِيّ: «وجعل كيل الدماء مستعارًا للقصاص» [@zawzani، ص282]. فالمعنى: في وقت لا يُقتص فيه لأحد، اقتصصنا لك."
    - title: "الإيجاز في «وَأَقَدْنَاهُ رَبَّ غَسَّانَ بِالْمُنْذِرِ»"
      text: "فعل واحد بمفعولين يحمل الخبر كله: لك القصاص، والمقتص منه ملك، والمقتص له أبوك."
  connection: "ثم يقول: وفديناهم بتسعة أملاك."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَأَقَدْنَا / هُ رَبْبَ غَسْ / سَانَ بِلْمُنْ = فعلاتن / متفع لن / فاعلاتن — ذِرِ كَرْهَنْ / إِذْ لَا تُكَا / لُدْ دِمَاءُو = فعلاتن / مستفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]."
context: "تمام الآية الثالثة: الثأر للمنذر بن ماء السماء. وفي رواية «وما تكال الدماء» قولان عند ابن الأَنْبارِيّ: «كانت القتلى منهم أكثر من أن تحصى، فليست تحسب الدماء ولا تكال من كثرتها»، «وقال بعض اهل اللغة: معنى قوله: (وما تكال الدماء) : ذهبت هدرا ليس فيها قود» [@ibn-al-anbari، ص497]."
variants:
  - reading: "ـذِرِ كَرْهًا وَمَا تُكَالُ الدِّمَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (وما تكال الدماء)» [@ibn-al-anbari، ص497]؛ وعند التِّبْرِيزِيّ: «أي ذهبت هدرا» [@tabrizi-ashr، ص285]."
