first: "مِثْلُهَا تُخْرِجُ النَّصِيحَةَ لِلْقَوْ"
second: "مِ فَلَاةٌ مِنْ دُونِهَا أَفْلَاءُ"
meaning: "مثل هذه القرابة تُخرج النصيحة للقوم: نصيحة واسعة كفلاة تمتد وراءها فلوات. قال ابن الأَنْبارِيّ: «معناه: هذه القرابة بيننا وبينك أيها الملك تخرج نصيحتنا لك، ثم قال: (فلاة من دونها أفلاء) يعنى نصيحة كثيرة واسعة مثل الفلاة التي دونها أفلاء كثيرة» [@ibn-al-anbari، ص501]."
vocabulary:
  - term: "مِثْلُهَا"
    text: "مثل هذه القرابة، والضمير لما في البيت السابق."
  - term: "فَلَاةٌ"
    text: "الأرض الواسعة المقفرة."
  - term: "أَفْلَاءُ"
    text: "«جمع فلا؛ وفلاً: جمع فلاة» [@ibn-al-anbari، ص501]؛ وقال ابن سِيدَه فيما ينقل اللسان: «لَيْسَ أَفْلاء جَمْعَ فَلاة لأَن فَعَلة لَا يكَسَّر عَلَى أَفْعال، إِنما أَفلاء جَمْعُ فَلًا الَّذِي هُوَ جَمْعُ فَلاةٍ» [@lisan، ج15 ص164]."
syntax:
  - "«والفلاة مرفوعة على التكرير، كأنه قال: مثلها فلاة. والأفلاء رفع بمن، ومثل الظاهرة رفع بما عاد من تخرج» [@ibn-al-anbari، ص501]: أي «مثلُها» مبتدأ خبره جملة «تُخْرِجُ النَّصِيحَةَ»، و«فلاةٌ» خبر ثان على تكرار المبتدأ."
  - "وعند التِّبْرِيزِيّ وجهان: «ويروى فلاةٌ وفلاةً بالرفع والنصب، فمن نصب فعلى الحال كأنه قال: مثل فلاة واسعة، ومن رفع فعلى إضمار مبتدأ» [@tabrizi-ashr، ص287]."
morphology:
  - "«أَفْلَاء» جمع الجمع: «فلاة» جمعها «فلا»، و«فلا» جمعها «أفلاء» [@lisan، ج15 ص164]."
  - "«النَّصِيحَة» على «فَعِيلة»."
  - "«تُخْرِجُ» مضارع «أخرج» على «أفعل»، والهمزة للتعدية."
rhetoric:
  thesis: "الخاتمة: القرابة تلد النصيحة، والنصيحة لا تُحد."
  devices:
    - title: "التشبيه البليغ في «فَلَاةٌ مِنْ دُونِهَا أَفْلَاءُ»"
      text: "جعل النصيحة فلاة بلا أداة، ثم جعل وراءها فلوات: صورة مكان يمتد بلا نهاية، مألوفة لمن يعيش في الصحراء. وعلى رواية «فلاء» تصير النصيحة صغار خيل تتوالد: «أي يتولد من النصيحة مثل الفلاء، وهو جمع فلو» [@ibn-al-anbari، ص501]."
    - title: "حسن الختام في «تُخْرِجُ النَّصِيحَةَ»"
      text: "يختم الحارِث القصيدة بالنصيحة: بعد الحجاج والتعيير والمدح، يجعل آخر ما يبقى في سمع الملك أن بَكْرًا ناصحة له. وفي الختام يقول ابن رَشِيق: «وخاتمة الكلام أبقى في السمع، وألصق بالنفس» [@ibn-rashiq، ج1 ص217]."
  connection: "آخر القصيدة عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ؛ أما الزَّوْزَنِيّ فيضع بعده الأبيات 40–43، ثم يتابع بترتيب آخر حتى يختم بالبيت 38 [@zawzani، ص283–286]."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "مِثْلُهَا تُخْ / رِجُنْ نَصِي / حَةَ لِلْقَوْ = فاعلاتن / متفع لن / فعلاتن — مِ فَلَاتُنْ / مِنْ دُونِهَا / أَفْلَاءُو = فعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "آخر بيت في القصيدة، وفيه يقول ابن الأَنْبارِيّ: «تمت القصيدة بغريبها وأخبارها ومعانيها» [@ibn-al-anbari، ص501]. ويقول التِّبْرِيزِيّ بعده: «هذا آخر القصائد السبع، وما بعدها المزيد عليها» [@tabrizi-ashr، ص287]، فهي في ترتيبه خاتمة المعلقات السبع."
