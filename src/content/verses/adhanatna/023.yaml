first: "فَبَقِينَا عَلَى الشَّنَاءَةِ تَنْمِيـ"
second: "ـنَا حُصُونٌ وَعِزَّةٌ قَعْسَاءُ"
meaning: "فبقينا مع بغض الناس لنا، ترفعنا حصون منيعة وعزة ثابتة. قال ابن الأَنْبارِيّ: «ومعنى البيت: بتنا على بغض الناس، أنا نزداد رفعة وعلوا ويزدادون غيظا» [@ibn-al-anbari، ص457]."
vocabulary:
  - term: "الشَّنَاءَةِ"
    text: "«البغض» [@ibn-al-anbari، ص456]."
  - term: "تَنْمِينَا"
    text: "«ترفعنا» [@zawzani، ص274]."
  - term: "حُصُونٌ"
    text: "«أي الحصون تحول بيننا وبين شناءة الناس إيانا» [@ibn-al-anbari، ص457]."
  - term: "قَعْسَاءُ"
    text: "«الثابتة المصمتة» [@ibn-al-anbari، ص457]."
syntax:
  - "«عَلَى الشَّنَاءَةِ» جار ومجرور متعلق بحال من فاعل «بقينا»، أي بقينا مبغَضين."
  - "«حُصُونٌ» فاعل «تنمي»، و«عزة» معطوفة عليه: «والجدود مرتفعة بتنمينا. والعزة نسق عليها» [@ibn-al-anbari، ص458]، والشرح على رواية «جدود»."
  - "«تَنْمِينَا» جملة حال من فاعل «بقينا»."
morphology:
  - "«الشَّنَاءَة» مصدر «شنئ» على «فَعَالة»: «تقول: شنئت الرجل، إذا أبغضته. والشناءة والشنَّآن بفتح النون المصدر أيضا» [@ibn-al-anbari، ص456]."
  - "«تَنْمِي» مضارع «نمى» المتعدي بمعنى رفع؛ «وفي المتعدى اختلاف، فأكثر أهل اللغة يقول: أنمى الله إنماء، وقال بعضهم: لا يجوز إلا نماه الله» [@tabrizi-ashr، ص261]."
  - "«قَعْسَاء» على «فَعْلاء» مؤنث «أَقْعَس»."
  - "«عِزَّة»: «الغلبة، من قولهم: (من عز بزَّ) ، أي من غلب سلب» [@ibn-al-anbari، ص457]."
rhetoric:
  thesis: "العزة جسد ثابت: يصفها بصفة الجسم الذي لا يتطامن."
  devices:
    - title: "الاستعارة في «عِزَّةٌ قَعْسَاءُ»"
      text: "القعساء صفة الجسم الثابت، فوصف بها العزة: «القعساء: الثابتة المصمتة» [@ibn-al-anbari، ص457]. فجعل للعزة جسدًا ثابتًا لا يلين. وهذا ما يسميه عبد القاهر الجُرْجانيّ أن تجعل «للشيءِ الشيءَ ليس له» [@dalail، ص67]."
    - title: "المقابلة"
      text: "بغض الناس يريد أن يضعهم، والحصون والعزة ترفعهم؛ فالبيت يقابل بين الشناءة والنماء: هم يبغضون، ونحن نعلو."
  connection: "ثم يقول: وقبل اليوم أعمت عزتنا عيون الناس."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَبَقِينَا / عَلَشْشَنَا / ءَةِ تَنْمِي = فعلاتن / متفع لن / فعلاتن — نَا حُصُونُنْ / وَعِزْزَتُنْ / قَعْسَاءُو = فاعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وآخر الصدر فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "جواب الوشاية: البغض قديم، والعزة أقدم. وهو القرينة التي تدل على المفعول المحذوف في البيت السابق، كما يقول البغدادي [@khizana، ج1 ص324]. ويبدأ هنا فخر بَكْر الذي يمتد إلى البيت 26."
variants:
  - reading: "...تَنْمِيـ / ـنَا جُدُودٌ وَعِزَّةٌ قَعْسَاءُ"
    status: "رواية التِّبْرِيزِيّ"
    note: "يشرح ابن الأَنْبارِيّ عليها: «وقوله (تنمينا جدود) أي ترفعنا آباؤنا بأحسابهم»، ثم يقول: «ويروى: (تنمينا حصون)» [@ibn-al-anbari، ص457]. وهي متن التِّبْرِيزِيّ [@tabrizi-ashr، ص260] والبغدادي [@khizana، ج1 ص324]. والجدود: الآباء، أو الحظوظ."
  - reading: "فَعَلَوْنَا عَلَى الشَّنَاءَةِ ..."
    status: "رواية أخرى"
    note: "«ويروى: (فعلونا على الشناءة)» [@ibn-al-anbari، ص456]."
  - reading: "...وَمَنْعَةٌ قَعْسَاءُ"
    status: "رواية أخرى"
    note: "«ويروى ايضا: (ومنعة قعساء)» [@ibn-al-anbari، ص457]."
