    status: "رواية الزَّوْزَنِيّ"
    note: "«خزازى: بقعة بعينها» [@zawzani، ص270]، ويذكرها التِّبْرِيزِيّ: «ويروى: بخزازي» [@tabrizi-ashr، ص254]."
