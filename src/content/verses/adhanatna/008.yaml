first: "فَتَنَوَّرْتُ نَارَهَا مِنْ بَعِيدٍ"
second: "بِخَزَازٍ هَيْهَاتَ مِنْكَ الصِّلَاءُ"
meaning: "نظرت إلى نارها من بعيد بخَزاز، فطمعت أن أصطلي بها، ثم علمت بعدها فقلت: ما أبعد الاصطلاء بها! قال ابن الأَنْبارِيّ: «ثم إنه أطمع نفسه في اصطلائها فظن إنها قريب، فلما علم إنها بعيدة قال: هيهات منك الصلاء، أي ما أبعده منك» [@ibn-al-anbari، ص439]."
vocabulary:
  - term: "تَنَوَّرْتُ"
    text: "«والتنور: نظرك إلى النار وتأملك أين هي؟ قريبة أم بعيدة» [@ibn-al-anbari، ص439]."
  - term: "خَزَازٍ"
    text: "«جبل بين العقيق وشخصين» [@ibn-al-anbari، ص439]."
  - term: "هَيْهَاتَ"
    text: "«ومعنى هيهات البعد» [@ibn-al-anbari، ص439]."
  - term: "الصِّلَاءُ"
    text: "«النار بكسر الصاد فيمد» [@ibn-al-anbari، ص440]؛ وعند الزَّوْزَنِيّ: «الصلاء مصدر صَلْيِ النَّار ... إذا احترق بها أو ناله حرّها» [@zawzani، ص270]، أي الدفء بالنار."
syntax:
  - "«ومن والباء صلتان لتنورت، والصلاء رفع بهيهات» [@ibn-al-anbari، ص440]؛ أي «الصِّلاء» فاعل لاسم الفعل «هيهات»، و«نارَها» مفعول به لـ«تنورت»."
  - "«هَيْهَاتَ» اسم فعل ماض بمعنى «بَعُد»، وجملة «هيهات منك الصلاء» مقول قول محذوف، أي فقلت لنفسي."
  - "وفي «هيهات» لغات: «ويقال: هيهاتٍ هيهاتٍ بكسر التاء فيهما مع التنوين. ويقال: هيهاتاً هيهاتاً بنصبهما مع التنوين» [@ibn-al-anbari، ص439]."
morphology:
  - "«تَنَوَّرْتُ» على «تفعّل» من النور: «ويقال: قد تنور فلان النار، إذا نظر إليها» [@ibn-al-anbari، ص439]."
  - "«الصِّلاء» بالكسر ممدود، «والصَّلا بالفتح مقصور» [@ibn-al-anbari، ص440]."
  - "«بَعِيد» على «فَعِيل»، صفة مشبهة من «بَعُد»."
rhetoric:
  thesis: "بيت الطمع والخيبة في سطر واحد: نار تُرى ولا تُبلغ."
  devices:
    - title: "الالتفات في «مِنْكَ»"
      text: "قال «تَنَوَّرْتُ» بضمير المتكلم، ثم «هَيْهَاتَ مِنْكَ» بضمير المخاطب، كأنه يقف خارج نفسه ويخاطبها بالخيبة."
    - title: "الحذف"
      text: "لم يقل: فقلت لنفسي هيهات، بل جاء بكلمة الخيبة بعد ذكر الموضع مباشرة، فصار التحسر أسرع. وفي الحذف يقول عبد القاهر الجُرْجانيّ: «فإنكَ ترى به تَرْكَ الذِكْر، أَفْصَحَ من الذكْرِ» [@dalail، ص146]."
    - title: "الكناية في «الصِّلَاءُ»"
      text: "الاصطلاء التدفؤ بالنار، وهو هنا الوصول إلى صاحبتها. فلم يقل: هيهات أن أصل إليها، بل ذكر الدفء الذي يتبع القرب من النار. وهذا ما يحدّه عبد القاهر في الكناية: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يقول: غير أني أستعين على الهم، فيخرج من النسيب إلى ناقته."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَتَنَوْوَرْ / تُ نَارَهَا / مِنْ بَعِيدِنْ = فعلاتن / متفع لن / فاعلاتن — بِخَزَازِنْ / هَيْهَاتَ مِنْ / كَصْصِلَاءُو = فعلاتن / مستفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]. وكتبنا «هَيْهَاتَ» بفتح التاء، وبه يستقيم الوزن؛ ولو نُوّنت لانكسر."
context: "آخر أبيات هند: نظرة من بعيد وأمل لا يتحقق، وبعدها يترك النسيب. ويفسر الزَّوْزَنِيّ البعد بالحروب: «أي أردت أن آتيها فعاقتني العوائق من الحروب وغيرها» [@zawzani، ص270]. وهذا البيت عنده السابع، قبل «أوقدتها» [@zawzani، ص270]."
variants:
