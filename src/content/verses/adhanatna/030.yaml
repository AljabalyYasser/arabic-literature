  - reading: "أَبْعِدُوا فِي الْمَدَى وَكُونُوا كَمَنْ أَغْـ / ـمَضَ عَيْنًا ..."
    status: "رواية أخرى"
    note: "«ويروى»، «أي ابلغوا غايتكم» [@ibn-al-anbari، ص469]."
