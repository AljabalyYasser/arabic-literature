first: "أَوْ سَكَتُّمْ عَنَّا فَكُنَّا كَمَنْ أَغْـ"
second: "ـمَضَ عَيْنًا فِي جَفْنِهَا أَقْذَاءُ"
meaning: "أو إن سكتم عنا ولم تستقصوا، كنا كمن أغمض عينه على القذى، أي نسكت على ما في صدورنا منكم. قال ابن الأَنْبارِيّ: «وان سكتم عنا فلم تستقصوا كنا نحن وانتم عند الناس في علمهم بنا سواء، وكان أسلم لنا ولكم، على أنا نسكت ونغمض عينا على ما فيها منكم. وهذا مثل» [@ibn-al-anbari، ص469]."
vocabulary:
  - term: "أَغْمَضَ"
    text: "أطبق جفنيه."
  - term: "جَفْنِهَا"
    text: "«الأجفان: أغطية العينين» [@ibn-al-anbari، ص469]."
  - term: "أَقْذَاءُ"
    text: "«القذى: شيء يسقط في العين» [@ibn-al-anbari، ص469]، و«الأقذاء: جمع القذى» [@zawzani، ص276]."
syntax:
  - "«أَوْ سَكَتُّمْ» شرط ثالث معطوف، وجوابه «فكنا»."
  - "«والكاف خبر الكون، وأغمض عينا صلة من، وفي جفنها أقذاء صلة العين» [@ibn-al-anbari، ص469]؛ أي جملة «في جفنها أقذاء» صفة لـ«عينًا»."
morphology:
  - "«سَكَتُّمْ» أُدغمت فيه تاء الفعل في تاء الفاعل."
  - "«أَغْمَضَ» على «أفعل»."
  - "«أَقْذَاء» جمع «قَذًى» على «أفعال»، «والقذى جمع قذاة» [@zawzani، ص276]."
rhetoric:
  thesis: "السلم المرّ: أغمض عيني والقذى فيها."
  devices:
    - title: "التمثيل في «كَمَنْ أَغْمَضَ عَيْنًا فِي جَفْنِهَا أَقْذَاءُ»"
      text: "صورة رجل يطبق جفنه على قذى يؤلمه، فلا يُخرجه ولا يستريح منه. وابن الأَنْبارِيّ يقول: «وهذا مثل» [@ibn-al-anbari، ص469]. وهو تمثيل لا تشبيه مفرد، لأن الشبه في الحال كلها: صبر على أذى مكتوم. وفيه يقول عبد القاهر الجُرْجانيّ: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "التعريض بالحقد"
      text: "لم يقل: نحقد عليكم، بل جعل الحقد قذى في العين. فالمعنى ظاهر لمن تأمل، مستور في اللفظ."
  connection: "ثم يعرض الخيار الأخير: إن منعتم الإنصاف."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "أَوْ سَكَتْتُمْ / عَنْنَا فَكُنْ / نَا كَمَنْ أَغْ = فاعلاتن / مستفع لن / فاعلاتن — مَضَ عَيْنَنْ / فِي جَفْنِهَا / أَقْذَاءُو = فعلاتن / مستفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «فاعلاتن» في أول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]."
context: "الخيار الثالث: السكوت. وهو أسلم للفريقين، لكنه ليس رضا؛ قال الزَّوْزَنِيّ: «وإن أعرضتم عن ذلك أعرضنا عنكم مع إضمارنا الحقد عليكم كمن أغضى الجفون عن القذى» [@zawzani، ص276]. فالسلم المعروض سلم على قذى."
variants:
