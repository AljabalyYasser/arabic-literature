first: "ثُمَّ فَاءُوا مِنْهُمْ بِقَاصِمَةِ الظَّهْـ"
second: "ـرِ وَلَا يَبْرُدُ الْغَلِيلَ الْمَاءُ"
meaning: "ثم رجع بنو رِزاح ومن حشد معهم بداهية تقصم الظهر، وفي صدورهم حرقة لا يبردها الماء. قال ابن الأَنْبارِيّ: «فرجعوا بقاصمة الظهر، أي قصمت بنو تميم ظهورهم، حيث ساقوا أموالهم وتبعوهم فلم يصلوا إلى شيء مما أخذ منهم، فرجعوا خائبين» [@ibn-al-anbari، ص486]."
vocabulary:
  - term: "فَاءُوا"
    text: "«رجعوا، يعنى بني رزاح ومن حشد معهم من بني تغلب وغيرهم» [@ibn-al-anbari، ص486]."
  - term: "قَاصِمَةِ"
    text: "«والقاصمة: الكاسرة. والتأويل: رجعوا بداهية تكسر الظهر» [@ibn-al-anbari، ص486]."
  - term: "الْغَلِيلَ"
    text: "«الحرارة التي تكون في الصدر» [@ibn-al-anbari، ص486]؛ وأصله العطش، ففي اللسان: «الغُلُّ والغُلّة والغَلَلُ والغَلِيلُ، كُلُّهُ: شِدَّةُ الْعَطَشِ وَحَرَارَتُهُ» [@lisan، ج11 ص499]."
syntax:
  - "«والباء صلة فاءوا، والماء رفع بيبرد، والغليل نصب به» [@ibn-al-anbari، ص486]: أي «الماءُ» فاعل مؤخر، و«الغليلَ» مفعول مقدم."
  - "الواو في «وَلَا يَبْرُدُ» حالية، والجملة حال من فاعل «فاءوا»."
morphology:
  - "«فَاءُوا» ماضي «فاء يفيء» مسندًا إلى واو الجماعة، وألفه منقلبة عن ياء."
  - "«قَاصِمَة» اسم فاعل مؤنث من «قصم»، صار اسمًا للداهية فحُذف موصوفه."
  - "«الْغَلِيل» على «فَعِيل»."
rhetoric:
  thesis: "الهزيمة في الظهر والحسرة في الصدر."
  devices:
    - title: "الاستعارة في «قَاصِمَةِ الظَّهْرِ»"
      text: "جعل الخيبة ضربة تكسر الظهر؛ قال التِّبْرِيزِيّ: «وقاصمة الظهر: الخيبة، وهذا تمثيل، أي صاروا بمنزلة من قصم ظهره» [@tabrizi-ashr، ص275]."
    - title: "تقديم المفعول في «يَبْرُدُ الْغَلِيلَ الْمَاءُ»"
      text: "قدّم «الغليل» على فاعله «الماء»، فبدأ بما في الصدور وهو المقصود، وأخّر الماء لأنه المنفي أثره. والغليل عند الزَّوْزَنِيّ «حرارة الحقد لا حرارة العطش» [@zawzani، ص286]، فالماء لا يبلغه. وفي التقديم يقول عبد القاهر الجُرْجانيّ: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
  connection: "ثم يقول: ثم جاءتكم بعد ذلك خيل الغلّاق."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "ثُمْمَ فَاءُو / مِنْهُمْ بِقَا / صِمَتِظْ ظَهْ = فاعلاتن / مستفع لن / فعلاتن — رِ وَلَا يَبْ / رُدُلْ غَلِي / لَلْ مَاءُو = فعلاتن / متفع لن / فالاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في العجز فصارت «متفع لن»، و«فاعلاتن» في آخر الصدر وأول العجز فصارت «فعلاتن». ودخل التشعيثُ، وهو حذف أول الوتد المجموع، الضربَ فصار «فالاتن» [@atiq، ص98–99]. وقسمة الشطرين هنا «الظَّهْـ / ـرِ» كما عند الزَّوْزَنِيّ والتِّبْرِيزِيّ [@zawzani، ص285] [@tabrizi-ashr، ص275]؛ أما نسخة الشاملة من ابن الأَنْبارِيّ ففيها «بقاصمة ال ... ظّهر» [@ibn-al-anbari، ص486]، وبها ينكسر الوزن."
context: "خاتمة خبر بني رِزاح (52–56): غارة، ثم نهب، ثم استرداد يخيب. وبه يُري الحارِث الملك أن تَغْلِب غُلبت مرة بعد مرة، وأن غالبيها ليسوا بَكْرًا."
variants:
  - reading: "...وَلَا يَبْرُدُ الصُّدُورَ الْمَاءُ"
    status: "رواية أخرى"
    note: "«ويروى: (ولا يبرد الصدور الماء) ، أي لما فيها من عظيم الحرارة» [@ibn-al-anbari، ص486]."
