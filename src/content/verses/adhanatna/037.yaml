first: "فَمَلَكْنَا بِذَلِكَ النَّاسَ حَتَّى"
second: "مَلَكَ الْمُنْذِرُ بْنُ مَاءِ السَّمَاءِ"
meaning: "فملكنا الناس بعزنا وحروبنا التي غلبنا فيها، حتى ملك المنذر بن ماء السماء. قال البغدادي: «بذلك يعني بالعز والامتناع وبالحروب التي كان الغلب لنا فيها» [@khizana، ج4 ص363]."
vocabulary:
  - term: "بِذَلِكَ"
    text: "«يعني بالعز والامتناع وبالحروب التي كان الغلب لنا فيها» [@khizana، ج4 ص363]."
  - term: "الْمُنْذِرُ بْنُ مَاءِ السَّمَاءِ"
    text: "ملك الحِيرة، أبو عَمْرو بن هند: «وهو عمرو بن المنذر بن ماء السماء» [@ibn-al-anbari، ص487]. وفي لقبه يقول ابن الأَنْبارِيّ: «وإنما قيل له ماء السماء لأنه شبه عموم نفعه بعموم ماء المطر» [@ibn-al-anbari، ص475]."
syntax:
  - "«والناس نصب بملكنا، والمنذر رفع بملك، والابن نعته» [@ibn-al-anbari، ص475]."
  - "«حَتَّى» حرف ابتداء وغاية، دخل على جملة فعلية."
  - "حُذفت همزة «ابن» لأنه بين علمين، فكُتب «المنذرُ بنُ»."
morphology:
  - "«مَلَكْنَا» ماضي «ملك» مسندًا إلى «نا»."
  - "«السَّماء» على «فَعال»، وهمزتها منقلبة عن واو، من «سما يسمو»."
  - "«المُنْذِر» اسم فاعل من «أنذر» على «أفعل»، صار علمًا."
rhetoric:
  thesis: "بيت التاريخ: عزّ بَكْر يمتد حتى جاء ملك يحكم الجميع."
  devices:
    - title: "التكرار في «فَمَلَكْنَا ... مَلَكَ»"
      text: "بدأ الصدر بـ«ملكنا» وبدأ العجز بـ«ملك»: هم ملكوا الناس، ثم ملك المنذر. فالفعل نفسه ينتقل من بَكْر إلى الملك، فلا يبدو ملكه انتزاعًا لملكهم بل خاتمة له."
    - title: "الإشارة في «بِذَلِكَ»"
      text: "اسم الإشارة يجمع كل ما مضى في الأبيات 32–36: الغارات والعزة؛ فكلمة واحدة تختصر المقطع كله، كما فسرها البغدادي [@khizana، ج4 ص363]."
  connection: "ثم يصف المنذر: هو الرب والشهيد على يوم الحِيارين."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ الهمزة المكسورة، وفيه إقواء"
  scansion: "فَمَلَكْنَا / بِذَالِكَنْ / نَاسَ حَتْتَى = فعلاتن / متفع لن / فاعلاتن — مَلَكَلْ مُنْ / ذِرُبْنُ مَا / ءِسْسَمَاءِي = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخبنُ، وهو حذف الثاني الساكن، «مستفع لن» في الصدر والعجز فصارت «متفع لن»، و«فاعلاتن» في أول الصدر وأول العجز فصارت «فعلاتن» [@atiq، ص98–99]. وفي القافية إقواء: الروي مكسور والقصيدة مضمومة الروي. قال الأخفش في الإقواء: «وقلت قصيدة ينشدونها إلا وفيها إقواء ثم لا يستنكرونه لأنه لا يكسر الشعر» [@lisan، ج15 ص208]، أي لا يُخرج البيت عن الوزن؛ ويستشهد ابن جِنِّي بهذا البيت مع المطلع على اجتماع الرفع والجر في قصيدة واحدة [@lisan، ج15 ص208]."
context: "في هذا البيت إقواء، وهو أن تختلف حركة الرَّوِيّ في القصيدة الواحدة: فالقصيدة مضمومة الروي، و«السماءِ» مكسورة. روى الأَصْمَعِيّ البيت عن رجل أنشده إياه، وفي خبره: «لا يضره إقواؤه»، «وإنما هذه القصيدة كانت شبيها بالخطبة، قام بها الحارث مرتجلا» [@ibn-al-anbari، ص475]. ويروي ابن قُتَيْبة الإقواء عن الأَصْمَعِيّ، ويعتذر بأن الحارِث «ارتجلها فكانت كالخطبة» [@ibn-qutayba، ج1 ص194]. وقال الأَثْرَم وابن السِّكِّيت: «لا يتم معنى (وهو الرب والشهيد) إلا بهذا البيت الذي أقوى فيه» [@ibn-al-anbari، ص475]. أما البغدادي فينقل: «وقيل هذا البيت منحول إليه ليس من القصيدة» [@khizana، ج4 ص363]، ويرى أحمد شاكر، محقق كتاب ابن قُتَيْبة، أن هذا القول «تكلف» [@ibn-qutayba، ج1 ص194، الحاشية]، وليس البيت في رواية الزَّوْزَنِيّ. أبقيناه لأنه في متن ابن الأَنْبارِيّ والتِّبْرِيزِيّ [@tabrizi-ashr، ص267]."
variants:
