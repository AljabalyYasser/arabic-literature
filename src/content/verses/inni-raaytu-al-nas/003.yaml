explained: false
first: "وَهُمْ لِمُقِلِّ المَالِ أَوْلَادُ عَلَّةٍ"
second: "وَإِنْ كَانَ مَحْضًا فِي العُمُومَةِ مُخْوَلَا"
vocabulary:
  - term: "مُقِلِّ المَالِ"
    text: "الفقير."
  - term: "أَوْلَادُ عَلَّةٍ"
    text: "«أولاد علة أولاد ضرة» [@ibn-qutayba، ج1 ص204، الحاشية]، أي إخوة لأب من أمهات شتى، لا يتعاطفون."
  - term: "مَحْضًا فِي العُمُومَةِ مُخْوَلَا"
    text: "خالص النسب في أعمامه، كريم الأخوال. يقول المحقق: «رجل معم مخول، بصيغى اسم الفاعل واسم المفعول: كريم الأعمام والأخوال» [@ibn-qutayba، ج1 ص204، الحاشية]."
