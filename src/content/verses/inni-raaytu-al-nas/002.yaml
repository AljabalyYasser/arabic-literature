first: "بَنِي أُمِّ ذِي المَالِ الكَثِيرِ يَرَوْنَهُ"
second: "وَإِنْ كَانَ عَبْدًا سَيِّدَ الأَمْرِ جَحْفَلَا"
vocabulary:
  - term: "بَنِي أُمِّ ذِي المَالِ"
    text: "إخوته لأمه وأبيه، أي يتقربون إلى الغني كأنهم إخوته."
  - term: "جَحْفَلَا"
    text: "يقول المحقق: «الجحفل: السيد العظيم القدر» [@ibn-qutayba، ج1 ص203، الحاشية]."
