explained: false
first: "أَفَاطِمَ إِنَّ الْحُبَّ يَعْفُو عَنِ الْقِلَى"
second: "وَيُجْشِمُ ذَا الْعِرْضِ الْكَرِيمَ الْمَجَاشِمَا"
vocabulary:
  - term: "يَعْفُو عَنِ الْقِلَى"
    text: "«\"يعفو\" أي: يكثر. و\"القِلَى\": البُغْض. والمعنى: إن الحب، مع مَنْع المحبوب وجفائه، يزداد ويستحكم» [@tabrizi-ikhtiyarat، ج2 ص1102]."
  - term: "وَيُجْشِمُ ... الْمَجَاشِمَا"
    text: "من تجشّم الأمر، «وتجشّمته إذا تكلّفته» [@lisan، ج12 ص100]: يحمل الكريمَ على الأمور الشاقة."
