explained: false
first: "صَحَا قَلْبُهُ عَنْهَا عَلَى أَنَّ ذِكْرَةً"
second: "إِذَا خَطَرَتْ دَارَتْ بِهِ الْأَرْضُ قَائِمَا"
vocabulary:
  - term: "صَحَا قَلْبُهُ"
    text: "«يقول: أفاق يأسًا منها، إلا أن الصحو الذي حصل له عنها مقرون بأنه كلما سمع بذكرها دِيرَ به الأرض» [@tabrizi-ikhtiyarat، ج2 ص1097]."
  - term: "قَائِمَا"
    text: "«وانتصب \"قائما\" على الحال. وليس المراد بالقيام الذي هو ضد الجلوس، وإنما هو من قولك: قام بالحق، إذا لزمه» [@tabrizi-ikhtiyarat، ج2 ص1097]."
