first: "كَأَنَّ عَلَيْهِ تَاجَ آلِ مُحَرِّقٍ"
second: "بِأَنْ ضَرَّ مَوْلَاهُ وَأَصْبَحَ سَالِمَا"
vocabulary:
  - term: "آلِ مُحَرِّقٍ"
    text: "«وكان عمرو بن هند يلقَّب بالمُحَرِّق» [@lisan، ج10 ص42]، فتاجهم تاج الملك. ويقول الشارح: «هذا الجاني عليه كأنه نال رئاسة عمرو بن هند، بأن ضرّ مولاه» [@tabrizi-ikhtiyarat، ج2 ص1106]، أي ابن عمه."
