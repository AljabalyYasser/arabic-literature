explained: false
first: "تَرَاءَتْ لَنَا يَوْمَ الرَّحِيلِ بِوَارِدٍ"
second: "وَعَذْبِ الثَّنَايَا لَمْ يَكُنْ مُتَرَاكِمَا"
vocabulary:
  - term: "بِوَارِدٍ"
    text: "«الوارد: شَعَرها» [@tabrizi-ikhtiyarat، ج2 ص1095]، أي شعر طويل يَرِد على متنيها."
  - term: "مُتَرَاكِمَا"
    text: "يقول محقق شرح التِّبْرِيزِيّ: «الثغر المتراكم هو الذي تقاربت أسنانه، فركب بعضها بعضًا» [@tabrizi-ikhtiyarat، ج2 ص1095، الحاشية]."
