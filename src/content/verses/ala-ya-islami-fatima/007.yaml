explained: false
first: "تَبَصَّرْ خَلِيلِي هَلْ تَرَى مِنْ ظَعَائِنٍ"
second: "خَرَجْنَ سِرَاعًا وَاقْتَعَدْنَ الْمَفَائِمَا"
vocabulary:
  - term: "تَبَصَّرْ ... ظَعَائِنٍ"
    text: "«أراد: تأمّل يا خليلي، هل ترى من نساء في هوادج» [@tabrizi-ikhtiyarat، ج2 ص1098]. «والظَّعِينة: المرأة في الهودج» [@lisan، ج13 ص271]."
  - term: "وَاقْتَعَدْنَ الْمَفَائِمَا"
    text: "«اقتعدتُ قَعُودًا، أي: ركبت بعيرًا». و«المفائم»: «المُوسَّعة من المراكب وغيرها ... والمفائم: الإبل العظام، الواحد مُفْأَم» [@tabrizi-ikhtiyarat، ج2 ص1098]."
