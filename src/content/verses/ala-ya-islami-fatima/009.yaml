explained: false
first: "تَحَلَّيْنَ يَاقُوتًا وَشَذْرًا وَصِيغَةً"
second: "وَجَزْعًا ظَفَارِيًّا وَدُرًّا تَوَائِمَا"
vocabulary:
  - term: "شَذْرًا"
    text: "«ضرب من اللؤلؤ» [@tabrizi-ikhtiyarat، ج2 ص1099]."
  - term: "صِيغَةً"
    text: "«فِعْلة من صَوْغ الذهب» [@tabrizi-ikhtiyarat، ج2 ص1099]."
  - term: "وَجَزْعًا ظَفَارِيًّا"
    text: "الجَزْع: «خرز فيه سواد وبياض» كما يقول المحقق [@tabrizi-ikhtiyarat، ج2 ص1099، الحاشية]، و«ظَفار: من بلاد اليمن لحِمْيَر، يُنسب إليه \"الجَزْع\"» [@tabrizi-ikhtiyarat، ج2 ص1099]."
  - term: "تَوَائِمَا"
    text: "«يُشبه بعضُه بعضًا، ويقال: اثنين اثنين» [@tabrizi-ikhtiyarat، ج2 ص1099]."
