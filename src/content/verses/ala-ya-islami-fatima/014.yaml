first: "وَإِنِّي وَإِنْ كَلَّتْ قَلُوصِي لَرَاجِمٌ"
second: "بِهَا وَبِنَفْسِي يَا فُطَيْمَ الْمَرَاجِمَا"
vocabulary:
  - term: "كَلَّتْ"
    text: "«أعيت وقصرت» [@tabrizi-ikhtiyarat، ج2 ص1101]."
  - term: "قَلُوصِي"
    text: "«والقَلُوص: الفَتِيّة من الإبل، بمنزلة الجارية الفتاة من النساء» [@lisan، ج7 ص81]."
  - term: "لَرَاجِمٌ ... الْمَرَاجِمَا"
    text: "«و\"الرَّجْم\" هنا مثل، وهو أسرع السير» [@tabrizi-ikhtiyarat، ج2 ص1101]."
