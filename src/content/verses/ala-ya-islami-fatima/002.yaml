explained: false
first: "رَمَتْكَ ابْنَةُ الْبَكْرِيِّ عَنْ فَرْعِ ضَالَةٍ"
second: "وَهُنَّ بِنَا خُوصٌ يُخَلْنَ نَعَائِمَا"
vocabulary:
  - term: "رَمَتْكَ"
    text: "«أي: نظرت إليك، كأنها رمتك بسهم»، و«المعنى: أنها رمتني عن عُرُض بنافذة من سهام الوُدّ» [@tabrizi-ikhtiyarat، ج2 ص1095]."
  - term: "ضَالَةٍ"
    text: "واحدة الضال، و«الضّالُ: السِّدْر البرّي» [@lisan، ج11 ص397]."
  - term: "خُوصٌ يُخَلْنَ نَعَائِمَا"
    text: "«والإبل \"الخوص\" أي: الغائرة العيون، تسير بنا، فيُحسَبْن لإسراعها نعائم» [@tabrizi-ikhtiyarat، ج2 ص1095]."
