first: "وَإِنِّي لَأَسْتَحْيِيكِ وَالْخَرْقُ بَيْنَنَا"
second: "مَخَافَةَ أَنْ تَلْقَيْ أَخًا لِيَ صَارِمَا"
vocabulary:
  - term: "وَالْخَرْقُ"
    text: "«والخَرْقُ: الأرض البعيدة، مستوية كانت أو غير مستوية» [@lisan، ج10 ص74]."
  - term: "أَخًا لِيَ صَارِمَا"
    text: "«أي: أخاف أن تلقَيْ مُصارِمًا لي، يَسْبَعُني عندك» [@tabrizi-ikhtiyarat، ج2 ص1101]، أي قاطعًا لي يذمّني عندك."
