first: "أَلَا يَا اسْلَمِي بِالْكَوْكَبِ الطَّلْقِ فَاطِمَا"
second: "وَإِنْ لَمْ يَكُنْ صَرْفُ النَّوَى مُتَلَائِمَا"
vocabulary:
