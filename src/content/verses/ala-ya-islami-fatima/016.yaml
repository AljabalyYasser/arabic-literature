  - term: "صَرْفُ النَّوَى مُتَلَائِمَا"
    text: "«و\"النَّوَى\": وِجْهة القوم التي ينوونها. و\"المتلائم\": المتلاحم» [@tabrizi-ikhtiyarat، ج2 ص1102]."
