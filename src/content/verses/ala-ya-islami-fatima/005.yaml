first: "أَرَتْكَ بِذَاتِ الضَّالِ مِنْهَا مَعَاصِمًا"
second: "وَخَدًّا أَسِيلًا كَالْوَذِيلَةِ نَاعِمَا"
vocabulary:
  - term: "مَعَاصِمًا"
    text: "جمع مِعْصَم، «والمِعْصَم: موضع السِّوار من اليد» [@lisan، ج12 ص408]."
  - term: "كَالْوَذِيلَةِ"
    text: "«\"الوَذِيلة\": سبيكة الفضة، وقيل: مرآة الفضة، وقيل: الصفيحة منها» [@tabrizi-ikhtiyarat، ج2 ص1097]."
