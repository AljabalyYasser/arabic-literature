explained: false
first: "أَمِنْ حُلُمٍ أَصْبَحْتَ تَنْكُتُ وَاجِمًا"
second: "وَقَدْ تَعْتَرِي الْأَحْلَامُ مَنْ كَانَ نَائِمَا"
vocabulary:
  - term: "أَمِنْ حُلُمٍ"
    text: "«كلام مستعظِم لأمرٍ مُنِيَ به، وخطبٍ اتّفق عليه، حتى صار كأنه يرى في المنام ما جرى عليه» [@tabrizi-ikhtiyarat، ج2 ص1105–1106]."
  - term: "تَنْكُتُ وَاجِمًا"
    text: "«ومعنى \"تنكت\": تضرب وتقرع. و\"الواجم\": الحزين» [@tabrizi-ikhtiyarat، ج2 ص1106]، أي تضرب الأرض بإصبعك أو بعود كما يفعل المهموم."
