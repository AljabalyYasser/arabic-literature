first: "أَلَا يَا اسْلَمِي لَا صُرْمَ لِي الْيَوْمَ فَاطِمَا"
second: "وَلَا أَبَدًا مَا دَامَ وَصْلُكِ دَائِمَا"
vocabulary:
  - term: "يَا اسْلَمِي"
    text: "«أي: دُومي سالمة» [@tabrizi-ikhtiyarat، ج2 ص1094]."
  - term: "لَا صُرْمَ لِي"
    text: "الصُّرْم: القطيعة، و«معنى \"لا صرم لي\" يريد: دوامه على الوصال في الحال، وفيما بعده» [@tabrizi-ikhtiyarat، ج2 ص1094]."
