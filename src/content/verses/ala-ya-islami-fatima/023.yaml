first: "أَلَمْ تَرَ أَنَّ الْمَرْءَ يَجْذِمُ كَفَّهُ"
second: "وَيَجْشَمُ مِنْ لَوْمِ الصَّدِيقِ الْمَجَاشِمَا"
vocabulary:
  - term: "يَجْذِمُ كَفَّهُ"
    text: "«\"الجَذْم\": القطع. وهذا هو ما فعله بنفسه، لمّا وقفت صاحبته على إفشاء سرّه» [@tabrizi-ikhtiyarat، ج2 ص1105]."
  - term: "وَيَجْشَمُ ... الْمَجَاشِمَا"
    text: "«أي: من مخافة لوم الصديق يتجشّم العظائم» [@tabrizi-ikhtiyarat، ج2 ص1105]."
