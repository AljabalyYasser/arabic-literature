explained: false
first: "سَقَاهُ حَبِيُّ الْمُزْنِ فِي مُتَهَلِّلٍ"
second: "مِنَ الشَّمْسِ رَوَّاهُ رَبَابًا سَوَاجِمَا"
vocabulary:
  - term: "حَبِيُّ الْمُزْنِ"
    text: "«\"الحَبِيّ\" من السحاب: ما حبا، أي: ارتفع» [@tabrizi-ikhtiyarat، ج2 ص1096]."
  - term: "مُتَهَلِّلٍ"
    text: "«أي متبسّم من البرق» [@tabrizi-ikhtiyarat، ج2 ص1096]."
  - term: "رَبَابًا"
    text: "«والرَّباب، بالفتح: سحاب أبيض» [@lisan، ج1 ص402]."
  - term: "سَوَاجِمَا"
    text: "«السوائل». ويقول الشارح: «ذِكْرُ \"السقي والمُزْن\" إشارة إلى الظَّلْم، وهو: ماء الأسنان» [@tabrizi-ikhtiyarat، ج2 ص1096]."
