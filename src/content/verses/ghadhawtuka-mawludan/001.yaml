first: "غَذَوْتُكَ مَوْلُودًا وَعُلْتُكَ يَافِعًا"
second: "تُعَلُّ بِمَا أُدْنِي إِلَيْكَ وَتُنْهَلُ"
meaning: "أطعمتك وأنت مولود، وقمت بأمرك وأنت شاب، تشرب مما أقرّبه إليك مرة بعد مرة. فأنت كالإبل التي تُسقى الشربة الأولى ثم الثانية حتى تروى، وأنا الساقي."
vocabulary:
  - term: "غَذَوْتُكَ"
    text: "أطعمتك ما ينمو به جسمك، وفي حاشية محقق «الحماسة»: «غذوتك أَي قُمْت بمؤنتك» [@tabrizi-hamasa، ج1 ص314، الحاشية]."
  - term: "عُلْتُكَ"
    text: "كفيتك معاشك. يقول الأَصْمَعِيّ كما في اللسان: «عَالَ عِيالَه يَعُولُهم إِذا كَفَاهم مَعاشَهم» [@lisan، ج11 ص486]."
  - term: "يَافِعًا"
    text: "شابًّا، و«غلامٌ يافِعٌ ... شابٌّ» [@lisan، ج8 ص415]."
  - term: "تُعَلُّ ... وَتُنْهَلُ"
    text: "تُسقى مرة بعد مرة. «النَّهْل: أَوَّل الشُّرْب» [@lisan، ج11 ص680]، و«العَلُّ والعَلَلُ: الشَّرْبةُ الثَّانِيَةُ ... يُقَالُ: عَلَلٌ بَعْدَ نَهَلٍ» [@lisan، ج11 ص467]."
  - term: "أُدْنِي"
    text: "أقرّب."
context: "مطلع القطعة، وفيه حياة الابن كلها قبل أن يكبر: الطفولة والشباب في شطر واحد، ثم السقي المتصل في الشطر الثاني. ولا يذكر الأب هنا ما لقي من ابنه، بل يبدأ بما أعطى، ليكون الانقلاب في البيتين 5–6 أشدّ وقعًا. ويرويه أبو الفَرَج: «وَمُنْتُكَ يَافِعًا»، أي قمت بمؤونتك، و«تُعَلُّ بِمَا أَجْنِي عَلَيْكَ»، وينقل محققوه عن شرح التِّبْرِيزِيّ: «أجنى عليك: أكسب» [@aghani-dk، ج4 ص130، الحاشية]."
syntax:
  - "«غَذَوْتُكَ» فعل ماض، والتاء فاعل، والكاف مفعول به، و«مولودًا» حال من الكاف."
  - "«وَعُلْتُكَ يَافِعًا» معطوفة على ما قبلها، و«يافعًا» حال."
  - "«تُعَلُّ» فعل مضارع مبني للمجهول، ونائب الفاعل ضمير المخاطب، والجملة حال من الكاف في «علتك»."
  - "«بِمَا» جار ومجرور متعلق بـ«تُعَلّ»، و«ما» اسم موصول، وجملة «أدني إليك» صلته، والعائد محذوف تقديره: أُدنيه."
  - "«وَتُنْهَلُ» معطوف على «تُعَلّ»."
morphology:
  - "«عُلْتُ» من «عالَ يَعُولُ» الأجوف الواوي، حُذفت عينه لالتقاء الساكنين حين اتصل بتاء الفاعل، وضُمّت فاؤه دلالةً على الواو المحذوفة."
  - "«تُعَلّ» مضارع «عَلَّ» المضعّف مبنيًّا للمجهول، و«تُنْهَل» مضارع «أَنْهَلَ» مبنيًّا للمجهول."
  - "«يافِع» اسم فاعل من «يَفَعَ»، و«مَوْلود» اسم مفعول من «وَلَدَ»."
rhetoric:
  thesis: "الأب يحصي عطاءه كما يحصي الراعي سقي إبله: أولًا الطعام والكفاية، ثم الماء الذي لا ينقطع. والصورة كلها من حياة البادية، فالابن عنده كالناقة العزيزة."
  devices:
    - title: "الاستعارة في «تُعَلُّ ... وَتُنْهَلُ»"
      text: "النهل والعلل في الأصل سقي الإبل، فاستعارهما لما كان يمنحه ابنه من رزق ورعاية. والاستعارة عند عبد القاهر الجُرْجانيّ أن «تُريدَ تشبيهَ الشيءِ بالشيءِ، فَتَدعَ أنْ تُفْصحَ بالتشبيهِ وتُظْهرَه، وتجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]."
    - title: "تقديم «تُعَلُّ» على «تُنْهَلُ»"
      text: "النهل قبل العلل في الواقع، فقدّم الثاني وأخّر الأول، والواو لا ترتب. وأراد بذكرهما معًا اتصال العطاء، لا ترتيبه، وأخّر «تُنْهَل» لتقع في القافية. وهي قراءتنا."
    - title: "المقابلة في «مَوْلُودًا ... يَافِعًا»"
      text: "يضع حالين متقابلتين في صدر واحد: الطفل في المهد والشاب، فيختصر سنين الرعاية في كلمتين."
  connection: "ينتقل في البيت التالي من العطاء إلى السهر: إذا مرض الابن لم ينم الأب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "غَذَوْتُ / كَمَوْلُودَنْ / وَعُلْتُ / كَيَافِعَنْ = فَعُولُ / مَفاعِيلُن / فَعُولُ / مَفاعِلُن — تُعَلْلُ / بِمَا أُدْنِي / إِلَيْكَ / وَتُنْهَلُو = فَعُولُ / مَفاعِيلُن / فَعُولُ / مَفاعِلُن"
  note: "حُذف خامس «فَعُولُن» الساكن فصارت «فَعُولُ» في الموضعين من الشطرين، وهذا القَبْض، وهو كثير في الطويل."
