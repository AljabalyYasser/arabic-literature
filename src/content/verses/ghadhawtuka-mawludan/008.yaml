first: "وَسَمَّيْتَنِي بِاسْمِ الْمُفَنَّدِ رَأْيُهُ"
second: "وَفِي رَأْيِكَ التَّفْنِيدُ لَوْ كُنْتَ تَعْقِلُ"
vocabulary:
  - term: "الْمُفَنَّدِ رَأْيُهُ"
    text: "الذي يُنسب رأيه إلى الضعف من الكبر. «الفَنَدُ: الخَرَفُ وإِنكار الْعَقْلِ مِنَ الهَرَم أَو المَرضِ» [@lisan، ج3 ص338]."
  - term: "التَّفْنِيدُ"
    text: "تضعيف الرأي ونسبته إلى الخرف."
