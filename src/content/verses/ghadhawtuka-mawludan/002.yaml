explained: false
first: "إِذَا لَيْلَةٌ نَابَتْكَ بِالشَّكْوِ لَمْ أَبِتْ"
second: "لِشَكْوَاكَ إِلَّا سَاهِرًا أَتَمَلْمَلُ"
vocabulary:
  - term: "نَابَتْكَ بِالشَّكْوِ"
    text: "نزلت بك بالمرض. والشَّكْو: المرض، كما في قول الشاعر في اللسان: «وإِن كَانَ ذاكَ الشَّكْوُ بِي فأَخِي طِبِّي» [@lisan، ج14 ص440]."
  - term: "أَتَمَلْمَلُ"
    text: "أتقلّب في فراشي. «فُلَانٌ يَتَمَلْمَلُ عَلَى فِراشه ويَتَمَلَّلُ إِذا لَمْ يَسْتَقِرَّ مِنَ الْوَجَعِ كأَنه عَلَى مَلَّة» [@lisan، ج11 ص630]، والمَلّة: الرماد الحار."
