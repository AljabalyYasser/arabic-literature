explained: false
first: "فَلَيْتَكَ إِذْ لَمْ تَرْعَ حَقَّ أُبُوَّتِي"
second: "فَعَلْتَ كَمَا الْجَارُ الْمُجَاوِرُ يَفْعَلُ"
vocabulary:
  - term: "لَمْ تَرْعَ"
    text: "لم تحفظ."
  - term: "الْجَارُ الْمُجَاوِرُ"
    text: "الجار الذي ينزل قريبًا منك، وله حق الجوار. وفي «عيون الأخبار»: «كَمَا يَفْعَلُ الْجَارُ الْمُجَاوِرُ تَفْعَلُ» [@uyun-al-akhbar، ج3 ص99]."
