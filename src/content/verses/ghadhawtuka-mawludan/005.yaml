first: "فَلَمَّا بَلَغْتَ السِّنَّ وَالْغَايَةَ الَّتِي"
second: "إِلَيْهَا مَدَى مَا كُنْتُ فِيكَ أُؤَمِّلُ"
meaning: "فلما بلغتَ سنّ الرجال، وبلغتَ الغاية التي كان إليها منتهى ما أرجوه فيك، أي حين صرتَ الرجل الذي كنت أنتظره... ولا يتم الكلام هنا، فجواب «لمّا» في البيت التالي."
vocabulary:
  - term: "السِّنَّ"
    text: "سنّ الرجولة والقوة."
  - term: "الْغَايَةَ"
    text: "المنتهى."
  - term: "مَدَى"
    text: "الأمد الذي ينتهي إليه الشيء."
  - term: "أُؤَمِّلُ"
    text: "أرجو."
context: "مفصل القطعة: بعد أربعة أبيات من الرعاية يأتي الزمن الذي كان الأب يعيش من أجله، فإذا هو بداية الخيبة. ويرويه ابن قُتَيْبة: «فَلَمَّا بَلَغْتَ الْوَقْتَ فِي الْعِدَّةِ الَّتِي / إِلَيْهَا جَرَى مَا أَبْتَغِيهِ وَآمُلُ» [@uyun-al-akhbar، ج3 ص99]، ويرويه أبو الفَرَج كرواية أبي تمّام [@aghani-dk، ج4 ص130]."
syntax:
  - "«فَلَمَّا» الفاء عاطفة، و«لمّا» ظرف بمعنى «حين» متضمن معنى الشرط، و«بلغتَ» فعل وفاعل، والجملة في محل جر بإضافة «لمّا» إليها، وجوابها «جعلتَ» في البيت التالي."
  - "«السِّنَّ» مفعول به، و«الغايةَ» معطوف عليه، و«التي» اسم موصول نعت لـ«الغاية»."
  - "«إِلَيْهَا مَدَى مَا ...» جملة اسمية صلة الموصول: «إليها» جار ومجرور متعلق بمحذوف خبر مقدم، و«مدى» مبتدأ مؤخر مرفوع بضمة مقدرة، و«ما» اسم موصول مضاف إليه."
  - "«كُنْتُ فِيكَ أُؤَمِّلُ» صلة «ما»: «كان» واسمها التاء، وجملة «أؤمّل» خبرها، و«فيك» متعلق بـ«أؤمّل»، والعائد محذوف تقديره: أؤمّله."
morphology:
  - "«الغاية» على «فَعَلة» من «غيي»، أُعلّت عينها فصارت ألفًا."
  - "«مَدَى» اسم مقصور على «فَعَل» من «مدي»."
  - "«أُؤَمِّل» مضارع «أَمَّلَ» على «فَعَّلَ»، والهمزة الأولى حرف المضارعة."
rhetoric:
  thesis: "بيت معلّق: يبني الشاعر الانتظار كله في شرط طويل، ويؤخر الجواب إلى البيت التالي، فيعيش القارئ لحظة الأمل قبل أن يسقط عليه الجواب."
  devices:
    - title: "التضمين بين البيتين 5 و6"
      text: "لا يستقل البيت بمعناه، فجواب «لمّا» في البيت الذي بعده. وهذا ما يسميه العروضيون التضمين: «ألا يستقل البيت بمعناه، بل يكون المعنى مجزءًا بين بيتين» [@atiq، ص166]. ويعدّه أهل القوافي عيبًا، لكنه هنا يحمل المعنى: الأمل يمتد إلى آخر البيت، ولا ينقطع إلا بالخيبة. والتقدير الفني قراءتنا."
    - title: "الإطناب في «السِّنَّ وَالْغَايَةَ الَّتِي / إِلَيْهَا مَدَى مَا كُنْتُ فِيكَ أُؤَمِّلُ»"
      text: "كان يكفيه «فلما كبرت»، لكنه يطيل في وصف الغاية، فتطول معه المسافة بين الأمل وخيبته."
  connection: "الجواب في البيت التالي: «جَعَلْتَ جَزَائِي مِنْكَ جَبْهًا وَغِلْظَةً»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "فَلَمْمَا / بَلَغْتَسْسِنْ / نَوَلْغَا / يَتَلْلَتِي = فَعُولُن / مَفاعِيلُن / فَعُولُن / مَفاعِلُن — إِلَيْهَا / مَدَى مَا كُنْ / تُفِيكَ / أُؤَمْمِلُو = فَعُولُن / مَفاعِيلُن / فَعُولُ / مَفاعِلُن"
  note: "الصدر تامّ التفعيلات، وفي العجز قُبضت «فَعُولُن» الثانية فصارت «فَعُولُ»، والقبض كثير في الطويل."
