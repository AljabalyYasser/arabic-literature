first: "تَرَاهُ مُعَدًّا لِلْخِلَافِ كَأَنَّهُ"
second: "بِرَدٍّ عَلَى أَهْلِ الصَّوَابِ مُوَكَّلُ"
vocabulary:
  - term: "مُعَدًّا لِلْخِلَافِ"
    text: "مهيَّأً للمخالفة دائمًا. والضمير للابن أو لرأيه."
  - term: "مُوَكَّلُ"
    text: "مكلَّف بالأمر لا يفارقه."
