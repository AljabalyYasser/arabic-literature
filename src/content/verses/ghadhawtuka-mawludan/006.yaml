first: "جَعَلْتَ جَزَائِي مِنْكَ جَبْهًا وَغِلْظَةً"
second: "كَأَنَّكَ أَنْتَ الْمُنْعِمُ الْمُتَفَضِّلُ"
meaning: "جعلتَ جزائي على ما صنعت لك أن تلقاني بما أكره وأن تغلظ لي، كأنك أنت صاحب النعمة عليّ والفضل، لا أنا."
vocabulary:
  - term: "جَبْهًا"
    text: "لقاءً بالمكروه، و«الجَبْهِ وَهُوَ الِاسْتِقْبَالُ بِالْمَكْرُوهِ» [@lisan، ج13 ص484]، وأصله أن تصيب جبهة الرجل."
  - term: "غِلْظَةً"
    text: "خشونة في القول والفعل."
  - term: "الْمُنْعِمُ الْمُتَفَضِّلُ"
    text: "صاحب النعمة والفضل الذي يُشكر ولا يَشكر."
context: "جواب «لمّا» في البيت السابق، وفيه تنقلب القطعة: كل ما عُدّد من عطاء في الأبيات 1–4 يقابله الآن جزاء واحد. ويرويه أبو الفَرَج: «جَعَلْتَ جَزَائِي غِلْظَةً وَفَظَاظَةً» [@aghani-dk، ج4 ص130]، وبه ينتهي ما يرويه من القطعة."
syntax:
  - "«جَعَلْتَ» فعل وفاعل، وهو جواب «لمّا» في البيت السابق، و«جزائي» مفعول به أول منصوب بفتحة مقدرة، والياء مضاف إليه."
  - "«مِنْكَ» جار ومجرور متعلق بمحذوف حال من «جزائي»، و«جبهًا» مفعول به ثان، و«غلظةً» معطوف عليه."
  - "«كَأَنَّكَ» حرف تشبيه ونصب، والكاف اسمها، و«أنتَ» ضمير فصل لا محل له، و«المنعمُ» خبر «كأنّ»، و«المتفضلُ» خبر ثان أو نعت."
morphology:
  - "«جَزاء» مصدر «جَزَى» على «فَعال»، وهمزته منقلبة عن الياء."
  - "«جَبْه» مصدر «جَبَهَ» على «فَعْل»، و«غِلْظة» على «فِعْلة»."
  - "«المُنْعِم» اسم فاعل من «أَنْعَمَ»، و«المُتَفَضِّل» اسم فاعل من «تَفَضَّلَ»."
rhetoric:
  thesis: "مرارة الأب في قلب الأدوار: الابن الذي أُنعم عليه يتصرف تصرف المنعم. فالبيت لا يشكو الأذى وحده، بل يشكو أن الابن نسي من صاحب الفضل."
  devices:
    - title: "التشبيه بـ«كأنّ» في «كَأَنَّكَ أَنْتَ الْمُنْعِمُ»"
      text: "تشبيه فيه تهكّم: لا يريد أن الابن منعم، بل أنه يتصرف تصرف من له المنّة، والحقيقة عكس ذلك."
    - title: "القصر في «أَنْتَ الْمُنْعِمُ»"
      text: "ضمير الفصل «أنت» وتعريف الخبر بـ«ال» يجعلان النعمة كلها للابن في ظنه، كأن لا منعم غيره. ويقول عبد القاهر الجُرْجانيّ إنك إذا قلت «زيدٌ المنطلقُ» كان كلامك مع من عرف أن انطلاقًا كان، «فأنتَ تُعْلِمه أنه كان من زيدٍ دون غيره» [@dalail، ص177]، فتعريف الخبر يقصر الصفة على صاحبها. والتطبيق على البيت قراءتنا."
    - title: "المقابلة بين البيتين 1 و6"
      text: "«غَذَوْتُكَ ... وَعُلْتُكَ» في أول القطعة يقابله هنا «جَبْهًا وَغِلْظَةً»: عطاءان بجزاءين، والفعلان في الأول للأب، وفي الآخر للابن."
  connection: "بعد الشكوى يأتي التمني في البيت التالي: فليتك عاملتني كما يعامل الجار جاره."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة"
  scansion: "جَعَلْتَ / جَزَائِي مِنْ / كَجَبْهَنْ / وَغِلْظَتَنْ = فَعُولُ / مَفاعِيلُن / فَعُولُن / مَفاعِلُن — كَأَنْنَ / كَأَنْتَلْمُنْ / عِمُلْمُ / تَفَضْضِلُو = فَعُولُ / مَفاعِيلُن / فَعُولُ / مَفاعِلُن"
  note: "القَبْض في «فَعُولُ» الأولى من الصدر، والأولى والثالثة من العجز، وهو كثير في الطويل."
