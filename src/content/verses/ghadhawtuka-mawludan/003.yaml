explained: false
first: "كَأَنِّي أَنَا الْمَطْرُوقُ دُونَكَ بِالَّذِي"
second: "طُرِقْتَ بِهِ دُونِي وَعَيْنِي تَهَمَّلُ"
vocabulary:
  - term: "الْمَطْرُوقُ"
    text: "الذي نزل به الأمر ليلًا، أي كأن المرض نزل بي لا بك."
  - term: "تَهَمَّلُ"
    text: "تسيل دموعها، وأصلها: تتهمّل."
sources:
