first: "كِرَامٍ فَلَا ذُو الضِّغْنِ يُدْرِكُ تَبْلَهُ"
second: "وَلَا الْجَارِمُ الْجَانِي عَلَيْهِمْ بِمُسْلَمِ"
meaning: "هم قوم كرام أعزّة: لا يبلغ صاحب الحقد عندهم ثأره، ولا يُسلمون من جنى جناية إلى خصومه. ففي شرح ابن الأَنْبارِيّ: «يقول: من جنى عليهم لم يسلموه» [@ibn-al-anbari، ص273]. وقال الأَعْلَم: «يقول: هم أعزة»، و«أي: إذا جنى عليهم جان منهم شرًّا إلى غيرهم لم يسلموه لهم، لعزهم، ومنعتهم» [@diwan-zuhayr، ص25]."
vocabulary:
  - term: "الضِّغْنِ"
    text: "«الضغن والضغينة واحد: وهو ما استكن في القلب من العداوة» [@zawzani، ص148]."
  - term: "تَبْلَهُ"
    text: "ثأره وحقده. «والتبل والذحل واحد» [@ibn-al-anbari، ص272]، و«التبل: الثأر» [@tabrizi-ashr، ص119]. والذَّحْل: الثأر."
  - term: "الْجَارِمُ الْجَانِي"
    text: "«الجارم والجاني واحد والجارم: ذو الجرم» [@zawzani، ص148]، و«الجارم: الذي أتى بالجرم وهو الذنب» [@tabrizi-ashr، ص119]."
  - term: "بِمُسْلَمِ"
    text: "مخذول يُسلَم إلى عدوه. «الإسلام: الخذلان» [@zawzani، ص148]."
context: "تمام مدح الحي. ويُروى البيت روايات كثيرة في صدره، وكلها تدور على المعنى نفسه. وهو البيت 46 عند الأَعْلَم [@diwan-zuhayr، ص24]، و47 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص34]، و45 عند الزَّوْزَنِيّ [@zawzani، ص148]؛ وبعده عندهم ثلاثتهم «سئمت تكاليف الحياة»، فتبدأ الحكمة بعد مدح الحي مباشرة."
syntax:
  - "«كِرَامٍ» صفة ثانية لـ«حَيٍّ» في البيت السابق: «والكرام نعت الحي، وذو رفع بما عاد من يدرك، والجارم رفع بمسلم» [@ibn-al-anbari، ص273]. فـ«ذُو الضِّغْنِ» مبتدأ خبره جملة «يُدْرِكُ تَبْلَهُ»، و«الْجَارِمُ» مبتدأ خبره «بِمُسْلَمِ»، والباء زائدة لتوكيد النفي."
  - "و«لا» مكررة نافية في الجملتين، وتكرارها مع المعرفة لازم."
morphology:
  - "«تَبْل» جمعه «تُبول»، و«الضِّغْن» جمعه «الأضغان»، و«الضغينة» جمعها «الضغائن» [@zawzani، ص148]. ويعدّد ابن الأَنْبارِيّ ما في معناه: «يقال، في قلبي عليه ضغن، وذحل، وحقد، وإحنة، وترة، وتبل» [@ibn-al-anbari، ص272]."
  - "«الجارِم» اسم فاعل، «ويقال: جرم، وأجرم، وأجرم أفصح» [@tabrizi-ashr، ص119]."
  - "«مُسْلَم» اسم مفعول من «أَسْلَمَه» إذا خذله."
rhetoric:
  thesis: "عزة الحي وجه آخر من كرمه: لا يُنال منهم ثأر، ولا يتخلّون عن واحد منهم."
  devices:
    - title: "التقسيم"
      text: "التقسيم: أن يُستوفى أقسام المعنى. قسم المنعة قسمين: فلا عدوّ يأخذ منهم ثأرًا «فَلَا ذُو الضِّغْنِ يُدْرِكُ تَبْلَهُ»، ولا واحد منهم يُسلَّم إلى عدوه «وَلَا الْجَارِمُ الْجَانِي عَلَيْهِمْ بِمُسْلَمِ». فاستوفى جهتي العزة: الدفع عن أنفسهم، والحماية لمن يلوذ بهم."
    - title: "الترادف"
      text: "«الْجَارِمُ الْجَانِي» لفظان بمعنى واحد كما يقول الزَّوْزَنِيّ [@zawzani، ص148]، فجاء الثاني توكيدًا للأول."
  connection: "ثم يرجع إلى ما كان قبل الصلح: «رَعَوْا ظِمْأَهُمْ حَتَّى إِذَا تَمَّ أَوْرَدُوا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "كِرَامِنْ / فَلَا ذُضْ ضِغْ / نِ يُدْرِ / كُ تَبْلَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — وَلَلْ جَا / رِمُلْ جَانِي / عَلَيْهِمْ / بِمُسْلَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر [@atiq، ص29]."
