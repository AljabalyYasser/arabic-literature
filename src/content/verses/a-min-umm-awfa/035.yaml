  - reading: "كِرَامٍ فَلَا ذُو الْوِتْرِ يُدْرِكُ وِتْرَهُ ... لَدَيْهِمْ وَلَا الْجَانِي عَلَيْهِمْ بِمُسْلَمِ"
    status: "متن الأَعْلَم"
    note: "[@diwan-zuhayr، ص24]. والوِتر: الثأر."
  - reading: "كِرَامٍ فَلَا ذُو التَّبْلِ مُدْرِكُ تَبْلِهِ ... لَدَيْهِمْ وَلَا الْجَانِي عَلَيْهِمْ بِمُسْلَمِ"
    status: "متن الشرح المنسوب إلى ثَعْلَب"
    note: "وفيه أن أبا عمرو يروي «يدرك تبله» [@sharh-thalab-zuhayr، ص34]. وعند التِّبْرِيزِيّ: «ويروى (فلا ذو التبل يدرك تبله لديهم، ولا الجاني عليهم بمسلم)» [@tabrizi-ashr، ص119]."
