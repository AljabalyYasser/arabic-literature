first: "فَأَقْسَمْتُ بِالْبَيْتِ الَّذِي طَافَ حَوْلَهُ"
second: "رِجَالٌ بَنَوْهُ مِنْ قُرَيْشٍ وَجُرْهُمِ"
meaning: "فحلفتُ بالكعبة التي طاف حولها رجال بنوها من قريش وجُرْهُم. قال الزَّوْزَنِيّ: «حلفت بالكعبة التي طاف حولها من بناها من القبيلتين» [@zawzani، ص139]."
vocabulary:
  - term: "الْبَيْتِ"
    text: "«يعني: الكعبة» [@diwan-zuhayr، ص15]."
  - term: "جُرْهُمِ"
    text: "«أمّة قديمة، كانوا أرباب البيت، قبل قريش» [@diwan-zuhayr، ص15]. وعند الزَّوْزَنِيّ: «قبيلة قديمة تزوج فيهم إسماعيل، عليه السلام، فغلبوا على الكعبة والحرم بعد وفاته» [@zawzani، ص139]."
  - term: "قُرَيْشٍ"
    text: "«وقريش اسم لولد النضر بن كنانة» [@zawzani، ص139]."
syntax:
  - "الفاء عاطفة تربط القسم بالمدح السابق، و«بِالْبَيْتِ» متعلق بـ«أَقْسَمْتُ»، و«الَّذِي» نعت للبيت."
  - "«رِجَالٌ» فاعل «طَافَ»، وجملة «بَنَوْهُ» صفة لرجال، و«مِنْ قُرَيْشٍ» متعلق بمحذوف صفة ثانية."
  - "جواب القسم في البيت التالي: «لَنِعْمَ السَّيِّدَانِ»، وبينهما «يَمِينًا» مصدر مؤكّد للقسم [@khizana، ج3 ص7]. فالبيتان مرتبطان، وهذا ما يسميه العروضيون التضمين: أن يتعلق معنى البيت بالبيت الذي بعده."
morphology:
  - "«بَنَوْهُ» بفتح النون من البناء، قال البَغْدادِيّ: «وبنوه بفتح النون من البناء وضمها خطأ» [@khizana، ج3 ص6]، أي لا تُقرأ «بُنُوه» جمع ابن."
  - "«أَقْسَمْتُ» على «أَفْعَلَ» من القَسَم، «ويقال أقسمت في اليمين فأنا أقسم إقساما ومقسما» [@ibn-al-anbari، ص265]."
rhetoric:
  thesis: "يرفع الشاعر مدحه إلى مقام اليمين: يحلف بأقدس ما عند العرب على أن الساعيين نعم السيدان."
  devices:
    - title: "تعظيم المقسم به"
      text: "لم يقل «أقسمت بالكعبة»، بل وصفها بمن طاف بها وبناها: «طَافَ حَوْلَهُ رِجَالٌ بَنَوْهُ مِنْ قُرَيْشٍ وَجُرْهُمِ». فالوصف يذكّر بقِدم البيت وتعاقب أهله عليه، فيزيد اليمين وزنًا. وفصّل ابن الأَنْبارِيّ في شرح البيت خبر ولاية البيت عن أبي عُبَيْدة: إبراهيم وإسماعيل، ثم جُرْهُم، ثم خُزاعة، ثم قُصَيّ [@ibn-al-anbari، ص253–260]."
    - title: "القسم في المدح"
      text: "القسم توكيد، والمدح المؤكد باليمين يُخرج الكلام من المجاملة إلى الشهادة. وبه يبدأ المدح بعد بيت السعي. وهذه قراءتنا."
  connection: "ثم يذكر المقسم عليه: نعم السيدان وُجدتما في الشدة والرخاء [@ibn-al-anbari، ص260]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَأَقْسَمْ / تُ بِلْبَيْتِلْ / لَذِي طَا / فَ حَوْلَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — رِجَالُنْ / بَنَوْهُ مِنْ / قُرَيْشِنْ / وَجُرْهُمِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبض «مفاعيلن» الثانية من العجز فصارت «مفاعلن» [@atiq، ص29]. وأُشبعت ضمة الهاء في «حَوْلَهُ»، وهمزة الوصل في «الَّذِي» تسقط في النطق."
context: "ثاني أبيات «سعى ساعيا» والقسم (16–18). وأطال ابن الأَنْبارِيّ في شرحه حتى بلغ ثماني صفحات في أخبار مكة [@ibn-al-anbari، ص253–260]. ويذكر المحقق قباوة أن بعده «في نسخة الجمهرة، بكبرل» بيتًا في القسم باللات والعزّى [@diwan-zuhayr، ص14]، وليس هو في نشرة الجمهرة التي نعتمدها، وفيها يتلو هذا البيتَ «يمينًا لنعم السيدان» [@jamhara، ص161]."
