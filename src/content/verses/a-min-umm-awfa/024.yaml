first: "تُعَفَّى الْكُلُومُ بِالْمِئِينَ فَأَصْبَحَتْ"
second: "يُنَجِّمُهَا مَنْ لَيْسَ فِيهَا بِمُجْرِمِ"
meaning: "تُمحى الجراح بمئات الإبل تُدفع ديةً، وأصبح يؤدّيها أقساطًا من لم يجنِ فيها جناية. قال الأَعْلَم: «وإنما يعني أنّ الدماء تَسقط بالديات»، وأن الساعي لم يأت بجرم «تجب عليه فيه الدية، ولكنه تحمّلها كرماً، وصلةً للرحم» [@diwan-zuhayr، ص17]."
vocabulary:
  - term: "تُعَفَّى"
    text: "تُمحى: «معناه تمحى الجراح بالمئين من الإبل تؤدي» [@ibn-al-anbari، ص264]. «ويقال عفا الشيء يعفو عفاء، إذا درس» [@ibn-al-anbari، ص264]."
  - term: "الْكُلُومُ"
    text: "الجراح، «الكلوم والكلام: جمع كَلْم وهو الجرح» [@zawzani، ص141]."
  - term: "الْمِئِينَ"
    text: "جمع مائة، والمراد مئات الإبل التي تُدفع في الديات."
  - term: "يُنَجِّمُهَا"
    text: "«ينجِّمها أي: يعطيها نجومًا» [@zawzani، ص141]. والنجم: القسط يُؤدّى في وقت معلوم؛ قال التِّبْرِيزِيّ: «ويُنجمها: يجعل لأدائها وقتا» [@tabrizi-ashr، ص114]."
  - term: "بِمُجْرِمِ"
    text: "الجاني. «يقال أجرم الرجل يجرم إجراما، وجرم يجرم جرما وجرمة» [@ibn-al-anbari، ص264]."
syntax:
  - "«والكلوم اسم ما لم يسم فاعله، والباء صلة تعفى» [@ibn-al-anbari، ص264]، أي نائب فاعل، و«بِالْمِئِينَ» متعلق بالفعل."
  - "«واسم أصبحت مضمر فيه من ذكر المئين، وخبر أصبحت ما عاد من الهاء في ينجمها» [@ibn-al-anbari، ص264]: أي أصبحت المئون ينجّمها من ليس بمجرم."
  - "«وموضع من رفع. بينجم، وليس صلة من... وبمجرم خبر ليس، وفيها صلة مجرم» [@ibn-al-anbari، ص264]: «مَنْ» موصول فاعل «يُنَجِّمُ»، وجملة «لَيْسَ فِيهَا بِمُجْرِمِ» صلته، والباء في «بِمُجْرِمِ» زائدة في خبر «ليس»."
morphology:
  - "«تُعَفَّى» مضارع «عَفَّى» المبني للمجهول، والتضعيف للتكثير. «وقد عفوته وعفيته» [@ibn-al-anbari، ص264]."
  - "«الكُلُوم» جمع «كَلْم» على «فُعُول»، ويُجمع أيضًا على «كِلام» [@ibn-al-anbari، ص264]."
  - "«المِئِين» جمع «مائة» جمعًا بالياء والنون، و«مُجْرِم» اسم فاعل من «أَجْرَمَ»."
rhetoric:
  thesis: "الدية تمحو الجرح كما تمحو الريح الأثر. ومن يدفعها ليس القاتل، بل السيد الذي لم يسفك دمًا."
  devices:
    - title: "المجاز في «الْكُلُومُ»"
      text: "لم يرد الجراح نفسها، بل ما ترتّب عليها من ثأر ودم مطلوب؛ فالجرح لا يُمحى بالإبل، والثأر يُمحى. وهذا مجاز تُذكر فيه الجراح ويُراد ما يتبعها. وفسّره الأَعْلَم بقوله: «إنما يعني أنّ الدماء تَسقط بالديات» [@diwan-zuhayr، ص17]."
    - title: "الحذف"
      text: "في «بِالْمِئِينَ» حذف المعدود، أي المئين من الإبل، لأن السامع يعرفه. يقول عبد القاهر في الحذف: «فإنك ترى به ترك الذكر، أفصح من الذكر» [@dalail، ص146]. فذكر العدد وحده يكفي ليرى السامع القطعان."
    - title: "صدى المطلع"
      text: "فعل «عَفَا» من ألفاظ الأطلال: الديار تعفو، أي تدرس. وفي هذا البيت تعفو الجراح. فالقصيدة التي بدأت بآثار تمّحي حزنًا تصل إلى آثار تمّحي صلحًا. وهذه قراءتنا."
  connection: "ثم يفسّر هذا البيت في البيت التالي: قوم يؤدّونها لقوم ولم يريقوا بينهم ملء محجم [@ibn-al-anbari، ص265]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "تُعَفْفَلْ / كُلُومُ بِلْ / مِئِينَ / فَأَصْبَحَتْ = فعولن / مفاعلن / فعولُ / مفاعلن — يُنَجْجِ / مُهَا مَنْ لَيْ / سَ فِيهَا / بِمُجْرِمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «مفاعيلن» الثانية و«فعولن» الثالثة في الصدر، و«فعولن» الأولى في العجز [@atiq، ص29]."
context: "ثاني أبيات الديات المنجّمة (23–25)، وفيه أول ذكر لبراءة الساعيين من الدماء، وسيعود إليه في الأبيات 44–46."
