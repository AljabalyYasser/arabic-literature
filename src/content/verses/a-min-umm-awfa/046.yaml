first: "فَكُلًّا أَرَاهُمْ أَصْبَحُوا يَعْقِلُونَهُ"
second: "صَحِيحَاتِ أَلْفٍ بَعْدَ أَلْفٍ مُصَتَّمِ"
meaning: "فكل واحد من هؤلاء القتلى أرى الساعين يؤدون ديته إبلًا سليمة، ألفًا بعد ألف تامّ. قال الزَّوْزَنِيّ: «يقول: فكل واحد من القتلى أرى العاقلين يعقلونه» [@zawzani، ص148]. وفي شرح ابن الأَنْبارِيّ: «العقل: الدية»، «و (المصتم) : التام» [@ibn-al-anbari، ص280]."
vocabulary:
  - term: "يَعْقِلُونَهُ"
    text: "يؤدون ديته. «قال الأصمعي: أصله أن يؤتى بالإبل فتعقل بأفنية أولياء القتيل؛ ثم كثر استعمالهم هذا حتى قالوه في الدراهم» [@ibn-al-anbari، ص280]. وتُعقل: تُشدّ بالعِقال. وعند الزَّوْزَنِيّ وجه آخر: «وسميت الدية عقلًا لأنها تعقل الدم عن السفك أي تحقنه وتحبسه» [@zawzani، ص148]."
  - term: "صَحِيحَاتِ"
    text: "سليمة لا عيب فيها، أي إبلًا تامة تُدفع في الحال. ويفسّر الأَعْلَم «صحيحات مال» في البيت الزائد بعده عنده: «أي: ليست بعدة ولا مطل» [@diwan-zuhayr، ص24]، والعِدَة: الوعد."
  - term: "مُصَتَّمِ"
    text: "تامّ. وفي لسان العرب: «وألف مصتم: متمم. وألف صتم أي تام» [@lisan، ج12 ص332]."
context: "خاتمة البراءة: لم يقتلوا، ومع ذلك يدفعون. قال أبو جَعْفَر: «معنى البيت: كل هؤلاء لم يكونوا في هذه الحرب» [@ibn-al-anbari، ص280]. وبه ينتهي عند ابن الأَنْبارِيّ ذكر الديات، ثم تبدأ الحكمة. أما الأَعْلَم فالبيت عنده 43، ويليه بيت زائد ليس عند ابن الأَنْبارِيّ: «تُسَاقُ إِلَى قَوْمٍ لِقَوْمٍ غَرَامَةً / صَحِيحَاتِ مَالٍ طَالِعَاتٍ بِمَخْرِمِ» (44)، ثم «لحي حلال» و«كرام» [@diwan-zuhayr، ص24]. وفي الشرح المنسوب إلى ثَعْلَب: «ولم يرو أبو عمرو» هذا البيت الزائد [@sharh-thalab-zuhayr، ص34]. والمَخْرِم: الطريق في الجبل؛ يقول الأَعْلَم: «أي: طلعت الإبل عليهم من المخرم، وهو الثنيّة في الجبل والطريق» [@diwan-zuhayr، ص24]. ولم نعرضه بيتًا لأنه ليس في رواية ابن الأَنْبارِيّ."
syntax:
  - "«كُلًّا» مفعول به لفعل محذوف يفسره «أَرَاهُمْ»: «وموضع كل نصب بأرى، والمعنى: فأرى كلا أصبحوا يعقلونه، فلما تقدم المفعول عن موضعه أدخلوا هاء في موضعه تخلفه ويشتغل الفعل بها» [@ibn-al-anbari، ص280]. وهذا ما يسميه النحاة الاشتغال: أن يتقدم اسم ويشتغل الفعل بعده بضميره."
  - "«ويجوز رفع كل بما عاد من الهاء والميم» [@ibn-al-anbari، ص280]. وقال التِّبْرِيزِيّ: «إلا أن النصب أجود لتعطف فعلا على فعل؛ لأن قبله (ولا شاركت في الحرب)» [@tabrizi-ashr، ص124]."
  - "«صَحِيحَاتِ» منصوب بالكسرة لأنه جمع مؤنث سالم، وهو ما يؤدونه في العقل، و«مُصَتَّمِ» صفة لـ«أَلْفٍ» الثاني."
morphology:
  - "«يَعْقِلون» من «عَقَل» الإبلَ إذا شدّها بالعِقال، ثم صار «العقل» اسمًا للدية [@ibn-al-anbari، ص280]."
  - "«مُصَتَّم» اسم مفعول من «صَتَّمَ» على «فعّل»: «والتصتيم: التكميل» [@lisan، ج12 ص332]."
rhetoric:
  thesis: "المفارقة التي بُني عليها المدح: براءة من الدم، ودفع للدية آلافًا."
  devices:
    - title: "المفارقة"
      text: "جاء البيت بعد بيتين ينفيان أي يد لهم في الدماء، ثم قال «أَصْبَحُوا يَعْقِلُونَهُ». فاجتماع البراءة والغرم هو موضع الكرم: يدفعون ما لا يلزمهم ليصلح ما بين القبيلتين. وهذه قراءتنا."
    - title: "التكرار"
      text: "«أَلْفٍ بَعْدَ أَلْفٍ»: كرر العدد ليصوّر الكثرة والتتابع، كأن الإبل تُساق قطيعًا بعد قطيع."
    - title: "اللفظ الذي يحمل صورته"
      text: "«يَعْقِلُونَهُ»: الكلمة تحفظ أصلها كما شرحه الأَصْمَعِيّ: إبل تُعقل بأفنية أولياء القتيل [@ibn-al-anbari، ص280]، فالسامع يرى الإبل مشدودة عند بيوت أهل القتلى."
  connection: "ثم تبدأ الحكمة، وأولها عند ابن الأَنْبارِيّ متصل بالصلح: «وَمَنْ يَعْصِ أَطْرَافَ الزِّجَاجِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَكُلْلَنْ / أَرَاهُمْ أَصْ / بَحُو يَعْ / قِلُونَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — صَحِيحَا / تِ أَلْفِنْ بَعْ / دَ أَلْفِنْ / مُصَتْتَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "لا زحاف في حشو البيت، والعَرُوض والضرب مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
variants:
  - reading: "عُلَالَةَ أَلْفٍ بَعْدَ أَلْفٍ مُصَتَّمِ"
    status: "متن التِّبْرِيزِيّ والأَعْلَم"
    note: "قال التِّبْرِيزِيّ: «والعلالة: الزيادة هنا، وأصله من العلل وهو الشرب الثاني»، ثم: «ويروى (صحيحات ألف)» [@tabrizi-ashr، ص124]؛ وعند الأَعْلَم: «والعلالة: الشيء بعد الشيء» [@diwan-zuhayr، ص24]. وأثبتنا «صحيحات ألف» لأنها نص ابن الأَنْبارِيّ في المكتبة الشاملة، ويشهد لها ابن منظور، إذ أنشد: «صَحِيحَاتُ أَلفٍ بَعْدَ ألفٍ مُصَتَّمِ» [@lisan، ج12 ص333]. وشرح ابن الأَنْبارِيّ لا يفسّر الكلمة، والوزن يقبل الروايتين، ولم نرَ صورة المطبوع."
  - reading: "فَكُلًّا أَرَاهُمْ أَصْبَحُوا يَعْقِلُونَهُ ... صَحِيحَاتِ مَالٍ طَالِعَاتٍ بِمَخْرِمِ"
    status: "متن الزَّوْزَنِيّ"
    note: "صدر هذا البيت وعجز البيت الزائد عند الأَعْلَم، وفسّره: «بصحيحات إبل تعلو في طرق الجبال عند سَوْقها في أولياء المقتولين» [@zawzani، ص148]."
