first: "دِيَارٌ لَهَا بِالرَّقْمَتَيْنِ كَأَنَّهَا"
second: "مَرَاجِعُ وَشْمٍ فِي نَوَاشِرِ مِعْصَمِ"
meaning: "ولها ديار بالرَّقْمَتَيْن، بقيت آثارها كأنها وشم أعادت الفتاة رسمه على ظاهر ذراعها. قال ابن الأَنْبارِيّ: «فشبه وشوم الديار، أي الآثار التي فيها بمراجع الوشم» [@ibn-al-anbari، ص238]."
vocabulary:
  - term: "الرَّقْمَتَيْنِ"
    text: "قال الأَصْمَعِيّ: «الرقمتان إحداهما قرب المدينة والأخرى قرب البصرة، وإنما صارت هاهنا حيث انتجعت» [@ibn-al-anbari، ص238]، أي حيث طلبت المرعى. وفي لسان العرب: «والرّقْمتان: رَوْضَتَانِ إِحداهما قَرِيبٌ مِنَ الْبَصْرَةِ، والأُخرى بنَجْدٍ»، وعن التهذيب: «رَوْضَتَانِ بِنَاحِيَةِ الصَّمَّانِ؛ وإِياهما أَراد زُهَيْرٌ» [@lisan، ج12 ص250]. والروضة: أرض فيها ماء ونبت."
  - term: "مَرَاجِعُ وَشْمٍ"
    text: "«أي معاطف، أي رجع الوشم وأعيد» [@ibn-al-anbari، ص238]. والوشم: «أن يثقب ظاهر الذراع بإبرة أو غيرها ثم يحشى بالكحل والنؤور ليخضر» [@ibn-al-anbari، ص238]، والنَّؤُور: دخان الشحم يُحشى به الوشم."
  - term: "نَوَاشِرِ"
    text: "قال يعقوب: «النواشر عصب الذراع من ظاهرها وباطنها، واحدتها ناشرة»، وقال أبو جَعْفَر: «النواشر عروق ظاهر الذراع خاصة» [@ibn-al-anbari، ص238]."
  - term: "مِعْصَمِ"
    text: "«موضع السوار وهو أسفل من الرسغ» [@ibn-al-anbari، ص238]."
syntax:
  - "«والديار يرتفع بإضمار هي» [@ibn-al-anbari، ص238]، أي هي ديار: خبر لمبتدأ محذوف. وعند الزَّوْزَنِيّ، وهو يروي «ودارٌ لها»، المعنى استفهام معطوف على المطلع: «أمن منازلها دار بالرقمتين؟» [@zawzani، ص133]."
  - "«واللام صلة الديار»، أي «لَهَا» صفة للديار، «والمراجع خبر كأن، وفي صلة الوشم» [@ibn-al-anbari، ص238]، أي «فِي نَوَاشِرِ» صفة للوشم."
  - "الضمير في «كَأَنَّهَا» للديار، والمراد آثارها. قال الزَّوْزَنِيّ: «كأنها، أراد كأن رسومها وأطلالها، فحذف المضاف» [@zawzani، ص134]."
morphology:
  - "«مَرَاجِع» جمع لا مفرد له على قياسه: «وقال أبو جعفر: واحد المراجع رجع، وهو على غير القياس» [@ibn-al-anbari، ص238]. وعند الزَّوْزَنِيّ «المراجيع: جمع المرجوع» [@zawzani، ص133]، وكذا في لسان العرب: «هُوَ جَمْعُ المَرْجُوع وَهُوَ الَّذِي أُعِيد سَوَادُهُ» [@lisan، ج8 ص115]."
  - "«نَوَاشِر» جمع «ناشِرة» على «فَواعِل» [@ibn-al-anbari، ص238]."
  - "«الرَّقْمَتَيْن» مثنى «رَقْمة»، وهي في لسان العرب «الرَّوْضَةُ» [@lisan، ج12 ص250]."
rhetoric:
  thesis: "الأثر الباقي على الأرض وشم في ذراع: يُرى ويُعاد رسمه، فلا يمّحي كله ولا يظهر كله."
  devices:
    - title: "التشبيه"
      text: "التشبيه: أن يُلحق أمر بأمر في صفة تجمعهما، بأداة كالكاف و«كأنّ». وفي «كَأَنَّهَا مَرَاجِعُ وَشْمٍ» شبّه آثار الدار بالوشم المجدَّد. وجعل الزَّوْزَنِيّ وجه الشبه التجديد: «شبه رسوم الدار عند تجديد السيول إياها بكشف التراب عنها بتجديد الوشم» [@zawzani، ص134]. فالسيل يكشف الأثر كما تعيد الواشمة الوشم. وهذا عند عبد القاهر من التشبيه الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]: خطوط داكنة على أرض فاتحة، كما يرى الناظر الوشم على الذراع."
    - title: "من الأرض إلى الجسد"
      text: "في «نَوَاشِرِ مِعْصَمِ» ينتقل الشاعر من خريطة الأرض إلى ذراع امرأة. فالصورة تُبقي المرأة الغائبة حاضرة في وصف دارها. وهذه قراءتنا."
    - title: "الجمع والتثنية"
      text: "في «دِيَارٌ لَهَا بِالرَّقْمَتَيْنِ» ذكر موضعين متباعدين. قال يعقوب: «قوله بالرقمتين معناه بينهما» [@ibn-al-anbari، ص238]. وقال الزَّوْزَنِيّ: «يريد أنها تحل الموضعين عند الانتجاع» [@zawzani، ص133]، «ولم يرد أنها تسكنهما جميعًا؛ لأن بينهما مسافة بعيدة» [@zawzani، ص134]."
  connection: "ثم يصف من يسكن هذه الديار الآن: بقر الوحش والظباء البيض، وأولادها تنهض من مرابضها [@ibn-al-anbari، ص239]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "دِيَارُنْ / لَهَا بِرْرَقْ / مَتَيْنِ / كَأَنْنَهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — مَرَاجِ / عُ وَشْمِنْ فِي / نَوَاشِ / رِ مِعْصَمِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العجز، فصارت «فعولُ» [@atiq، ص29]. والصدر: الشطر الأول."
context: "يتمّ صورة الدار التي بدأ بها: بعد الدمنة الصامتة يأتي أثر يُرى ولا يُقرأ. وبه يضع الشاعر دار صاحبته بين موضعين، كما يقول الزَّوْزَنِيّ: «أخرج الكلام في معرض الشك في هذه الدار أهي لها أم لا، ثم شبه رسومها بالوشم المجدد في المعصم» [@zawzani، ص134]. وقد استشهد المُبَرِّد بالبيت في معنى النواشر: «والنواشر ما يظهر من العروق في ظهر الذراع مما يداني المعصم» [@kamil، ج1 ص72]."
variants:
  - reading: "وَدَارٌ لَهَا بِالرَّقْمَتَيْنِ"
    status: "رواية أبي عمرو"
    note: "«ويروى: (ودار لها بالرقمتين)» [@ibn-al-anbari، ص238]، وفي الشرح المنسوب إلى ثَعْلَب أن أبا عمرو يرويها «ودارٌ لها» [@sharh-thalab-zuhayr، ص16]. وبها يروي الأَعْلَم [@diwan-zuhayr، ص9] والزَّوْزَنِيّ [@zawzani، ص133] والمُبَرِّد [@kamil، ج1 ص72]. قال الزَّوْزَنِيّ: «يريد: وداران لها بهما، فاجتزأ بالواحد عن التثنية» [@zawzani، ص134]."
  - reading: "مَرَاجِيعُ وَشْمٍ"
    status: "رواية الزَّوْزَنِيّ ولسان العرب"
    note: "بالياء [@zawzani، ص133] [@lisan، ج8 ص115]، والمعنى واحد."
