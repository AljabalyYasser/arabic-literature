  - reading: "وَلَا يُعْفِهَا يَوْمًا مِنَ الذُّلِّ يَنْدَمِ"
    status: "متن التِّبْرِيزِيّ"
    note: "[@tabrizi-ashr، ص126]، وبه أنشده ابن منظور [@lisan، ج11 ص279]."
