first: "وَمَنْ لَا يَزَلْ يَسْتَرْحِلُ النَّاسَ نَفْسَهُ"
second: "وَلَا يُعْفِهَا يَوْمًا مِنَ الذَّمِّ يَنْدَمِ"
meaning: "من لا يزال يجعل نفسه مطيّة للناس يركبونه، ولا يصونها يومًا من الذمّ، ندم. في شرح ابن الأَنْبارِيّ: «فمن رواه (يسترحل) أراد يجعل نفسه كالراحلة للناس يركبونه ويذمونه ومن رواه (يستحمل) أراد يحمل الناس على عيبه» [@ibn-al-anbari، ص284]. ونقل ابن منظور عن ابن السِّكِّيت في «يسترحل» تفسيرين: «أحدهما أنه يذل لهم حتى يركبوه بالأذى ويستذلوه، والثاني أنه يسألهم أن يحملوا عنه كله وثقله ومؤنته» [@lisan، ج11 ص279]."
vocabulary:
  - term: "يَسْتَرْحِلُ"
    text: "يجعل نفسه راحلة للناس، والراحلة: البعير الذي يُركب [@ibn-al-anbari، ص284]."
  - term: "يُعْفِهَا"
    text: "يصونها ويعفيها."
context: "هذا البيت زاده أبو زَيْد الأنصاري على القصيدة، وأبو عَمْرو بن العَلاء لم يعرفه. قال ابن الأَنْبارِيّ: «ويروى عن المازني إنه قال: (قال أبو زيد: قرأت هذه القصيدة على أبي عمرو مذ أربعون سنة وقال أبو عمرو: قرأتها مذ خمسون سنة ولم أسمع هذا البيت إلا منك) . يعني أبا زيد» [@ibn-al-anbari، ص285]. وفي الشرح المنسوب إلى ثَعْلَب: «زاد هذا البيت أبو زيد»، ثم الخبر نفسه عن المازني [@sharh-thalab-zuhayr، ص37]، وعند التِّبْرِيزِيّ أن أبا عمرو قال: «قرأت هذه القصيدة منذ خمسين سنة، فلما اسمع هذا البيت إلا منك» [@tabrizi-ashr، ص126]. فأبو عَمْرو، وهو من أقدم رواة الشعر، قرأ القصيدة عقودًا ولم يجد فيه هذا البيت. وليس البيت عند الزَّوْزَنِيّ. وهو آخر القصيدة عند الأَعْلَم (59) [@diwan-zuhayr، ص29] وفي الشرح المنسوب إلى ثَعْلَب (60) [@sharh-thalab-zuhayr، ص37]، و51 عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ."
syntax:
  - "«وموضع من رفع بما عاد من يزل، واسمها مضمر فيها، وخبرها ما عاد من … يسترحل، ويعفها نسق على يزل، ويندم جواب الجزاء» [@ibn-al-anbari، ص284–285]."
  - "«يَسْتَرْحِلُ» مرفوع لأنه خبر «يزل» لا جواب الشرط: «ويسترحل في لفظ المرفوع وموضعه نصب على الخبر؛ لأنك لو وضعت الدائم في موضعه لقلت لا يزل مسترحلا للناس» [@ibn-al-anbari، ص285]. وقال الأَعْلَم في «يستحمل»: «رفع، لأنه في موضع خبر» [@diwan-zuhayr، ص30]."
  - "«يَسْتَرْحِلُ» يتعدى إلى مفعولين: «النَّاسَ» و«نَفْسَهُ»، أي يطلب من الناس أن يرحلوا نفسه، أي يركبوها."
morphology:
  - "«يَسْتَرْحِل» على «يستفعل» من «الرَّحْل» و«الراحلة»، والسين والتاء للطلب أو للجعل."
  - "«يَزَلْ» مضارع «زال» الناقصة، مجزوم بالسكون، وحُذفت عينه لالتقاء الساكنين."
  - "«يُعْفِ» مضارع «أعفى»، مجزوم بحذف الياء."
rhetoric:
  thesis: "من أذلّ نفسه للناس، أو أثقلهم بحاجاته، وصل إلى الندم."
  devices:
    - title: "الاستعارة"
      text: "في «يَسْتَرْحِلُ النَّاسَ نَفْسَهُ» جعل نفسه راحلة يركبها الناس، فهي صورة الذل الدائم. والفعل «لَا يَزَلْ» يجعل الذل عادة لا مرة."
    - title: "المقابلة"
      text: "قابل بين «يَسْتَرْحِلُ» و«يُعْفِهَا»: الأول بذل للنفس، والثاني صون لها، ومن ترك الصون ندم."
  connection: "ثم يتحدث عن الغربة وكرامة النفس: «وَمَنْ يَغْتَرِبْ يَحْسِبْ عَدُوًّا صَدِيقَهُ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ لَا / يَزَلْ يَسْتَرْ / حِلُنْ نَا / سَ نَفْسَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَلَا يُعْ / فِهَا يَوْمَنْ / مِنَذْ ذَمْ / مِ يَنْدَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "لا زحاف في حشو البيت، والعَرُوض والضرب مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
variants:
  - reading: "وَمَنْ لَا يَزَلْ يَسْتَحْمِلُ النَّاسَ نَفْسَهُ ... وَلَا يُغْنِهَا يَوْمًا مِنَ الدَّهْرِ يُسْأَمِ"
    status: "متن الأَعْلَم"
    note: "وفسّره: «أي: من لا يزل يثقل على الناس، ويستحملهم أموره، استثقلوه وسئموه» [@diwan-zuhayr، ص29–30]. و«يستحمل» رواية عند ابن الأَنْبارِيّ أيضًا [@ibn-al-anbari، ص284]."
  - reading: "وَلَا يُغْنِهَا يَوْمًا مِنَ الشَّرِّ يُسْأَمِ"
    status: "رواية عند ابن الأَنْبارِيّ"
    note: "«ويروى: (ولا يغنها يوما من الشر يسأم)» [@ibn-al-anbari، ص285]."
  - reading: "وَلَمْ يُغْنِهَا يَوْمًا مِنَ النَّاسِ يُسْأَمِ"
    status: "متن الشرح المنسوب إلى ثَعْلَب"
