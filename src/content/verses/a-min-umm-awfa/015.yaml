first: "وَفِيهِنَّ مَلْهًى لِلَّطِيفِ وَمَنْظَرٌ"
second: "أَنِيقٌ لِعَيْنِ النَّاظِرِ الْمُتَوَسِّمِ"
meaning: "وفي هؤلاء النساء لهوٌ لمن يتلطّف في الوصول إليهن، ومنظرٌ معجب لعين من يتأمل محاسنهن. قال الزَّوْزَنِيّ: «وفي هؤلاء النسوان لهو أو موضع لهو للمتأنق الحسن المنظر، ومناظر معجبة لعين الناظر المتتبع محاسنهن وسمات جمالهن» [@zawzani، ص138]."
vocabulary:
  - term: "مَلْهًى"
    text: "«ويقال: لهوت بالشيء ألهو به لهوا وملهى» [@ibn-al-anbari، ص252]. وعند الزَّوْزَنِيّ: «الملهى: اللهو وموضعه» [@zawzani، ص137]."
  - term: "لِلَّطِيفِ"
    text: "«اللطيف، يعنى نفسه يتلطف في الوصول إليهن»، «وقال يعقوب: اللطيف الذي يتطلف في طلب اللهو» [@ibn-al-anbari، ص252]. وعند التِّبْرِيزِيّ: «المتلطف الذي ليس معه جفاء» [@tabrizi-ashr، ص110]."
  - term: "أَنِيقٌ"
    text: "«المعجب. يقال آنقني الشيء يونقني إيناقا» [@ibn-al-anbari، ص252]. وفي لسان العرب: «وآنقَني الشَّيْءُ يُؤْنِقُني إِينَاقًا: أَعجبني» [@lisan، ج10 ص10]."
  - term: "الْمُتَوَسِّمِ"
    text: "«المتثبت. وقال الكلابي: المتوسم: الذي ينظر» [@ibn-al-anbari، ص252]. وعند الأَعْلَم: «الناظر المتفرّس في نظره. يقال: توسّمتُ فيه الخير، إذا تفرّسته فيه» [@diwan-zuhayr، ص12]. وفي لسان العرب: «وَقَدْ تَوَسَّمْت فِيهِ الْخَيْرَ أَي تفرَّسْت» [@lisan، ج12 ص636]."
syntax:
  - "«والملهى مرفوع بفي، والمنظر نسق عليه، والأنيق نعته، واللام صلة أنيق» [@ibn-al-anbari، ص252]. أي أن «فِيهِنَّ» عند الكوفيين رافع لـ«مَلْهًى»، وهو في إعراب البصريين خبر مقدم و«مَلْهًى» مبتدأ مؤخر. و«لِعَيْنِ» متعلق بـ«أَنِيقٌ»."
  - "«لِلَّطِيفِ» متعلق بـ«مَلْهًى» أو بمحذوف صفة له."
  - "«الْمُتَوَسِّمِ» نعت لـ«النَّاظِرِ»."
morphology:
  - "«مَلْهًى» على «مَفْعَل» يصلح مصدرًا ميميًّا واسم مكان، ولذلك قال الزَّوْزَنِيّ «اللهو وموضعه» [@zawzani، ص137]. وعند الأَعْلَم أن الملهى «واللهو واحد، مثل المقتل والقتل» [@diwan-zuhayr، ص12]."
  - "«أَنِيق» على «فَعِيل» بمعنى «مُفْعِل»: «الأنيق: المعجب، فعيل بمعنى المفعل، كالحكيم بمعنى المحكم، والسميع بمعنى المسمع» [@zawzani، ص137]."
  - "«المُتَوَسِّم» اسم فاعل من «تَوَسَّمَ»، وأصله عند الزَّوْزَنِيّ «من الوسام والوسامة وهما الحسن... وقد يكون من الوسم فيكون تتبع علامات الشيء وسماته» [@zawzani، ص137]."
rhetoric:
  thesis: "خاتمة مقطع الظعائن: بعد الطريق والمراكب والماء يذكر الشاعر ما فيهن هنّ: لهو للقلب ومنظر للعين."
  devices:
    - title: "التقسيم بين القلب والعين"
      text: "قسم البيت بين «مَلْهًى» في الصدر و«مَنْظَرٌ» في العجز: الأول لمن يقترب ويتلطّف، والثاني لمن ينظر ويتأمل. فجمع حظّ الوصل وحظّ النظر. وهذه قراءتنا."
    - title: "الناظر المتوسّم"
      text: "في «لِعَيْنِ النَّاظِرِ الْمُتَوَسِّمِ» لم يكتف بالناظر حتى وصفه بالتوسّم، أي التثبّت والتفرّس. فالجمال هنا لا يُرى بنظرة عابرة، بل بنظر متأمّل. واستشهد ابن الأَنْبارِيّ بقوله تعالى «إِنَّ فِي ذَلِكَ لَآيَاتٍ لِلْمُتَوَسِّمِينَ»، «أي للناظرين المتبصرين» [@ibn-al-anbari، ص252]."
    - title: "اللطيف هو الشاعر"
      text: "فسّر ابن الأَنْبارِيّ «اللَّطِيف» بأنه الشاعر «يعنى نفسه يتلطف في الوصول إليهن» [@ibn-al-anbari، ص252]، ونقله التِّبْرِيزِيّ: «وقيل: عنى باللطيف نفسه» [@tabrizi-ashr، ص110]. فالشاعر يدخل في آخر المشهد بعد أن كان يتبعه بعين صاحبه."
  connection: "ثم يترك الظعائن فجأة إلى المدح: سعى سيّدان من غيظ بن مرة في الصلح بعد أن تشقّق بالدم [@ibn-al-anbari، ص252]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَفِيهِنْ / نَ مَلْهَنْ لِلْ / لَطِيفِ / وَمَنْظَرُنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — أَنِيقُنْ / لِعَيْنِنْنَا / ظِرِلْمُ / تَوَسْسِمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» الثالثة في الشطرين [@atiq، ص29]. وكلمة «لِعَيْنِ» ساقطة من نسخة ابن الأَنْبارِيّ في المكتبة الشاملة، وبسقوطها ينكسر العجز، وهي ثابتة عند التِّبْرِيزِيّ والزَّوْزَنِيّ والأَعْلَم [@tabrizi-ashr، ص110] [@zawzani، ص137] [@diwan-zuhayr، ص12]؛ فأثبتناها."
context: "آخر أبيات النسيب عند ابن الأَنْبارِيّ، وبعده يخرج إلى المدح. أما الأَعْلَم والشرح المنسوب إلى ثَعْلَب فيجعلانه التاسع، بعد بيت الأنماط [@diwan-zuhayr، ص12]، ويختمان النسيب ببيت الماء. وقال البَغْدادِيّ إن زُهَيْرًا قال بيت «سعى ساعيا» «بعد أن تغزل بخمسة عشر بيتا» [@khizana، ج3 ص6]."
variants:
  - reading: "وَفِيهِنَّ مَلْهًى لِلصَّدِيقِ"
    status: "رواية الأَعْلَم"
    note: "قال الأَعْلَم: «وأراد بـالصديق: العاشق» [@diwan-zuhayr، ص12]."
