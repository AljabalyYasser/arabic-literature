first: "جَعَلْنَ الْقَنَانَ عَنْ يَمِينٍ وَحَزْنَهُ"
second: "وَكَمْ بِالْقَنَانِ مِنْ مُحِلٍّ وَمُحْرِمِ"
meaning: "سارت الظعائن فجعلن جبل القَنان وأرضه الغليظة عن أيمانهن، وكم بهذا الجبل من رجل لا عهد له يمنعه، ومن رجل له عهد وحرمة. قال الأَعْلَم: «والمعنى أنّ هؤلاء الظعن لمّا تحمّلن جعلن عن أيمانهنّ حَزْنَ القنان ومن أقام به، من عدوٍّ مُحِلٍّ من نفسه، وصديقٍ محرم» [@diwan-zuhayr، ص13]."
vocabulary:
  - term: "الْقَنَانَ"
    text: "«القنان: جبل بني أسد» [@ibn-al-anbari، ص245]."
  - term: "حَزْنَهُ"
    text: "«و (الحزن) والحزم سواء، وهو الموضع الغليظ» [@ibn-al-anbari، ص245]. وفي لسان العرب: «والحَزْنُ مَا غلُظَ مِنَ الأَرض، وَالْجَمْعُ حُزُونٌ» [@lisan، ج13 ص112]."
  - term: "مُحِلٍّ"
    text: "قال يعقوب: «أي ليس في حرمة تمنعه من عهد ولا ميثاق» [@ibn-al-anbari، ص245]."
  - term: "مُحْرِمِ"
    text: "«أي من له عهد أو ذمة أو جوار هو له حرمة من أن يغار عليه» [@ibn-al-anbari، ص245]. والذمّة: العهد والأمان."
syntax:
  - "«والقنان منصوب بجعلن والحزن نسق عليه» [@ibn-al-anbari، ص246]، أي معطوف عليه. و«عَنْ يَمِينٍ» في موضع المفعول الثاني لـ«جَعَلَ» بمعنى «صيّر»."
  - "«كَمْ» خبرية تفيد الكثرة، «وكم في موضع رفع» [@ibn-al-anbari، ص246]: مبتدأ خبره «بِالْقَنَانِ»، و«مِنْ مُحِلٍّ» تمييز لها مجرور بـ«مِنْ»."
  - "على رواية الأَصْمَعِيّ «ومن بالقنان» تكون «مَنْ» في موضع رفع، «ويجوز أن يكون في موضع نصب بالنسق على القنان» [@ibn-al-anbari، ص246]، أي: جعلن القنان ومن به عن أيمانهن."
morphology:
  - "«مُحِلّ» اسم فاعل من «أَحَلَّ»، و«مُحْرِم» من «أَحْرَمَ». «ويقال أحل القوم، إذا خرجوا من أشهر الحرم إلى أشهر الحل» [@ibn-al-anbari، ص246]."
  - "«حَزْن» يُجمع على «حُزُون» [@ibn-al-anbari، ص245]، ومنه «أَحْزَنَ القومُ»: صاروا إلى الحَزْن."
rhetoric:
  thesis: "الطريق الذي سلكته الظعائن مكان خطر، يمرّ بأعداء وأصدقاء، والشاعر يتبعه ويعرف ما فيه."
  devices:
    - title: "الطباق"
      text: "الطباق: الجمع بين ضدين. وفي «مُحِلٍّ وَمُحْرِمِ» جمع من لا حرمة له ومن له حرمة. واختُلف في المراد: فعند الأَصْمَعِيّ «يريد من له حرمة ومن لا حرمة له»، وعند غيره «يريد دخل في أشهر الحل ودخل في أشهر الحرم» [@zawzani، ص136]، وهو قول المُبَرِّد كما ينقله التِّبْرِيزِيّ: «المحل والمحرم هنا الداخلان في الأشهر الحرم وفي الأشهر التي ليست بحرم» [@tabrizi-ashr، ص107]."
    - title: "ما وراء الطريق"
      text: "قرأ أبو جَعْفَر «وَكَمْ بِالْقَنَانِ» على أنها خبر عن الشاعر نفسه: «والمعنى إنه طلب الظعن فمر بالقنان، فيقول: حملت نفسي في طلب هذه الظعن على شدة وممر بموضع فيه أعدائي، لو ظفروا بي لهلكت» [@ibn-al-anbari، ص246]. فالعجز يحوّل الوصف الجغرافي إلى مخاطرة الشاعر في تتبّعهن."
    - title: "الأسماء والأماكن"
      text: "يسمّي الشاعر الأماكن واحدًا بعد واحد: العلياء، وجُرْثُم، والقَنان، ثم السُّوبان والرَّسّ. فالطريق يُرسم بأسماء معروفة لسامعيه. وهذه قراءتنا."
  connection: "ثم يصف ما على الهوادج من أنماط وكِلَل حمراء [@ibn-al-anbari، ص246]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "جَعَلْنَلْ / قَنَانَ عَنْ / يَمِينِنْ / وَحَزْنَهُو = فعولن / مفاعلن / فعولن / مفاعلن — وَكَمْ بِلْ / قَنَانِ مِنْ / مُحِلْلِنْ / وَمُحْرِمِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبض «مفاعيلن» في التفعيلة الثانية من الشطرين، فصارت «مفاعلن»؛ وهو حذف الخامس الساكن [@atiq، ص29]. وأُشبعت ضمة الهاء في «حَزْنَهُ» آخر الصدر."
context: "يبدأ تتبّع طريق الظعائن، وهو تتبّع يجري في الأبيات 8–14 من جبل إلى وادٍ إلى ماء. وموضعه عند الأَعْلَم بعد بيت «بكرن» [@diwan-zuhayr، ص12]."
variants:
