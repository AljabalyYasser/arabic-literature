first: "جَرِيءٍ مَتَى يُظْلَمْ يُعَاقِبْ بِظُلْمِهِ"
second: "سَرِيعًا وَإِلَّا يُبْدَ بِالظُّلْمِ يَظْلِمِ"
meaning: "جريء، إذا ظُلم عاقب على ظلمه سريعًا، وإن لم يبدأه أحد بالظلم بدأ هو. في شرح ابن الأَنْبارِيّ: «معناه أن هذا الجيش متى تكن له ترة في قوم طلبها، وإن لم تكن له ترة وتر» [@ibn-al-anbari، ص279]، والترة: الثأر. وقال الأَعْلَم: «يقول: إن لم يُظلم بدأهم بالظلم، لعزة نفسه، وشدة جرأته» [@diwan-zuhayr، ص22]. وقال الزَّوْزَنِيّ: «وإن لم يظلمه أحد ظلم الناس إظهارًا لغنائه وحسن بلائه» [@zawzani، ص146]."
vocabulary:
  - term: "جَرِيءٍ"
    text: "شجاع. «الجرأة والجراءة: الشجاعة» [@zawzani، ص146]. وقال الأَعْلَم: «يعني: الأسد» [@diwan-zuhayr، ص22]."
  - term: "يُبْدَ"
    text: "يُبدأ، من «بدأ» بتخفيف الهمزة [@ibn-al-anbari، ص279]."
context: "آخر قصة حُصَيْن. قال الزَّوْزَنِيّ: «والبيت من صفة أسد في البيت الذي قبله وعنى به حصينًا ثم أضرب عن قصته ورجع إلى تقبيح صورة الحرب والحث على الاعتصام بالصلح» [@zawzani، ص146]. وفي البيت خُلُق جاهلي يعود في الحكمة: «وَمَنْ لَا يَظْلِمِ النَّاسَ يُظْلَمِ» (53)؛ فالبدء بالظلم عندهم دليل عزة. وهو البيت 38 عند الأَعْلَم [@diwan-zuhayr، ص21] والزَّوْزَنِيّ [@zawzani، ص146]."
syntax:
  - "«جَرِيءٍ» صفة لـ«أَسَدٍ» في البيت السابق، «ويروى (جريء) أي هو جريء» [@tabrizi-ashr، ص122]، على القطع."
  - "«مَتَى يُظْلَمْ» شرط وجوابه «يُعَاقِبْ»، و«سريعا يجوز أن يكون منصوبا على الحال، وان يكون نعتا لمصدر محذوف، كأنه قال: يعاقب عقابا سريعا» [@tabrizi-ashr، ص123]."
  - "«وَإِلَّا» هي «إنْ» الشرطية و«لا» النافية، «ويبد جزم بإلا، علامة الجزم فيه سقوط الألف» [@ibn-al-anbari، ص279]، و«يَظْلِمِ» جوابها."
morphology:
  - "في «يُبْدَ» قولان. ابن الأَنْبارِيّ يجعلها لغة: «وبديت على الانتقال من الهمز إلى التشبيه بقضيت ورميت... ومن قال بديت قال لم أبد» [@ibn-al-anbari، ص279]. والتِّبْرِيزِيّ يجعلها ضرورة: «الأصل فيه الهمز من بدأ يبدأ، إلا إنه لما اضطر أبدل من الهمزة ألفا، ثم حذف الألف للجزم، وهذا من أقبح الضرورات» [@tabrizi-ashr، ص123]. والضرورة: ما يجوز للشاعر من مخالفة القياس ليستقيم الوزن."
  - "«جريء» على «فعيل» صفة مشبهة من «جَرُؤَ»."
rhetoric:
  thesis: "يتم صورة الأسد بخُلُقه: لا يصبر على ظلم، ولا ينتظر أن يُظلم."
  devices:
    - title: "المقابلة"
      text: "قابل بين شرطين: «مَتَى يُظْلَمْ يُعَاقِبْ» و«إِلَّا يُبْدَ بِالظُّلْمِ يَظْلِمِ». فالأسد في الحالين فاعل: يردّ الظلم، أو يبدأ به."
    - title: "جناس الاشتقاق"
      text: "تتكرر مادة الظلم أربع مرات: «يُظْلَمْ ... بِظُلْمِهِ ... بِالظُّلْمِ ... يَظْلِمِ». وهذا من الجناس، لأن الألفاظ ترجع إلى أصل واحد، فيلحّ البيت على المعنى الذي بُني عليه."
  connection: "ثم يرجع إلى الذين يدفعون الديات: «لَعَمْرُكَ مَا جَرَّتْ عَلَيْهِمْ رِمَاحُهُمْ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "جَرِيئِنْ / مَتَى يُظْلَمْ / يُعَاقِبْ / بِظُلْمِهِي = فعولن / مفاعيلن / فعولن / مفاعلن — سَرِيعَنْ / وَإِلْلَا يُبْ / دَ بِظْظُلْ / مِ يَظْلِمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت كسرة الهاء في «بِظُلْمِهِ». ولا زحاف في حشو البيت، والعَرُوض والضرب مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
