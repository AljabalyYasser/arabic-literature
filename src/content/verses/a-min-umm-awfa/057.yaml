first: "رَأَيْتُ الْمَنَايَا خَبْطَ عَشْوَاءَ مَنْ تُصِبْ"
second: "تُمِتْهُ وَمَنْ تُخْطِئْ يُعَمَّرْ فَيَهْرَمِ"
meaning: "رأيت المنايا تخبط الناس كما تخبط الناقة العمياء: من أصابته أماتته، ومن أخطأته عاش حتى يهرم. قال يَعْقُوب: «(خبط عشواء) معناه تعشو فلا تقصد، فمن أصابته قتلته» [@ibn-al-anbari، ص288]. وقال أبو جَعْفَر: «هو مثل، معناه أن المنايا تأتي بما لا تعرفه، فمن أصابته أماتته، فكأنها ناقة عشواء لا تبصر، وقد ندت فهي تقتل من أصابته» [@ibn-al-anbari، ص289]. وندّت: شردت."
vocabulary:
  - term: "خَبْطَ"
    text: "«الخبط: الضرب باليد» [@zawzani، ص149]، وعند التِّبْرِيزِيّ: «ضرب اليدين والرجلين» [@tabrizi-ashr، ص128]."
  - term: "عَشْوَاءَ"
    text: "«العشواء: الناقة التي لا تبصر ليلًا» [@zawzani، ص149]. وفي لسان العرب: «وهي الناقة التي في بصرها ضعف تخبط إذا مشت لا تتوقى شيئا» [@lisan، ج7 ص281]."
  - term: "يُعَمَّرْ"
    text: "«التعمير: تطويل العمر» [@zawzani، ص149]."
context: "أشهر أبيات الحكمة، وفيه خلاف قديم. قال التِّبْرِيزِيّ: «وإنما يريد أن المنايا تأتي على غير قصد، وليس كما قال؛ لأنها تأتى بقضاء وقدر» [@tabrizi-ashr، ص128]. وروى المَرْزُبانِيّ عن أبي سعيد بن هُبَيْرة الأَسَدِيّ أنه «كان يسمع المشايخ يقولون: هذا بيت زندقة، وهو بعيد من أبياته التى يقول فى بعضها»، وأنشدوا البيت 28 في الحساب؛ ثم قال إن زِياد بن قُنَيْع أعجب منه خطأً لأنه أخذ المعنى وهو «فى أكبر ظنى مسلم» [@muwashshah، ص51]. والزندقة هنا: الخروج عن الدين. أما الأَعْلَم فيقرأ البيت قراءة لا تعارض القدر: «وإنما يريد أنها لا تترك الشاب لشبابه، ولا تقصد الكبير لكبره، وإنما تأتي بأجل معلوم» [@diwan-zuhayr، ص25]. ويرى شوقي ضيف أن أبيات الحياة والموت «قد تكون» صحيحة النسبة إلى زُهَيْر «لأنها تتصل كالبيت السابق بموضوع القصيدة»، ويقول في هذا البيت: «وفى البيت أيضا صورة بديعة، إذ يشبه الموت بناقة عشواء لا تبصر طريقها، فهى تخبط الطريق خبطا أعمى ليس له نظام ولا قياس» [@deif، ج1 ص325]. وهو 57 عند ابن الأَنْبارِيّ، و48 عند الأَعْلَم [@diwan-zuhayr، ص25] والزَّوْزَنِيّ [@zawzani، ص149]، و49 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص34]."
syntax:
  - "«والمنايا اسم رأيت، وخبط عشواء خبرها، والمعنى كخبط عشواء» [@ibn-al-anbari، ص289]. أي إن «رأى» هنا قلبية تنصب مفعولين، والثاني مصدر جاء موضع التشبيه."
  - "«مَنْ تُصِبْ تُمِتْهُ» شرط وجوابه، و«قوله: ومن تخطئ أي ومن تخطئه، فحذف المفعول، وحذفه سائغ كثير في الكلام والشعر والتنزيل» [@zawzani، ص149]. و«فَيَهْرَمِ» معطوف على الجواب «يُعَمَّرْ»."
morphology:
  - "«عَشْواء» مؤنث «أعشى» على «فَعْلاء»: «يقال عشا يعشو عشوا، إذا جاء على غير بصر... وقد عشى يعشى عشىً، إذا أصابه العمى» [@ibn-al-anbari، ص288–289]."
  - "«تُمِتْهُ» مضارع «أمات» مجزوم، حُذفت عينه لالتقاء الساكنين."
  - "«يُعَمَّر» على «يُفَعَّل» من العُمْر."
rhetoric:
  thesis: "الموت أعمى لا يختار: يصيب ويخطئ بلا نظام، ومن أخطأه لم ينجُ، بل بقي حتى الهرم."
  devices:
    - title: "التشبيه البليغ"
      text: "التشبيه البليغ: ما حُذفت منه الأداة ووجه الشبه، فصار المشبه كأنه المشبه به. وهو في «رَأَيْتُ الْمَنَايَا خَبْطَ عَشْوَاءَ»، «والمعنى كخبط عشواء» [@ibn-al-anbari، ص289]. فجعل الموت ناقة عمياء تضرب بأخفافها كل ما في طريقها."
    - title: "المقابلة"
      text: "«مَنْ تُصِبْ تُمِتْهُ» و«مَنْ تُخْطِئْ يُعَمَّرْ فَيَهْرَمِ»: إصابة يقابلها خطأ، وموت يقابله عمر طويل. لكن العمر الطويل ينتهي إلى الهرم، فلا ربح في الحالين، وهذا يردّ البيت إلى سأمه في البيت السابق. وهذه قراءتنا."
    - title: "المثل"
      text: "«خَبْطَ عَشْوَاءَ» صار مثلًا، قال الزَّوْزَنِيّ: «ويقال في المثل: هو خابط خبط عشواء، أي قد ركب رأسه في الضلالة كالناقة التي لا تبصر ليلًا» [@zawzani، ص149]."
  connection: "ثم ينتقل من الموت إلى الأخلاق: «وَمَهْمَا تَكُنْ عِنْدَ امْرِئٍ مِنْ خَلِيقَةٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "رَأَيْتُلْ / مَنَايَا خَبْ / طَ عَشْوَا / ءَ مَنْ تُصِبْ = فعولن / مفاعيلن / فعولن / مفاعلن — تُمِتْهُو / وَمَنْ تُخْطِئْ / يُعَمْمَرْ / فَيَهْرَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت ضمة الهاء في «تُمِتْهُ». ولا زحاف في حشو البيت، والعَرُوض والضرب مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
