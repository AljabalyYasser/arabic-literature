first: "فَتُنْتَجْ لَكُمْ غِلْمَانَ أَشْأَمَ كُلُّهُمْ"
second: "كَأَحْمَرِ عَادٍ ثُمَّ تُرْضِعْ فَتَفْطِمِ"
meaning: "فتلد لكم الحرب غلمان شؤم، كل واحد منهم في شؤمه كعاقر ناقة صالح، ثم ترضعهم وتفطمهم. قال الزَّوْزَنِيّ: «فتولد لكم أبناء في أثناء تلك الحروب كل واحد منهما يضاهي في الشؤم عاقر الناقة ثم ترضعهم الحروب وتفطمهم، أي تكون ولادتهم ونشوؤهم في الحروب فيصبحون مشائيم على آبائهم» [@zawzani، ص144]."
vocabulary:
  - term: "غِلْمَانَ أَشْأَمَ"
    text: "«معناه تنتج لكم غلمان شؤم. وأشأم هو الشؤم بعينه» [@ibn-al-anbari، ص269]."
  - term: "أَحْمَرِ عَادٍ"
    text: "«وأراد بأحمر عاد أحمر ثمود وهو عاقر الناقة، واسمه قدار بن سالف» [@zawzani، ص144]. وفي لسان العرب: «وأحمر ثمود: لقب قدار بن سالف عاقر ناقة صالح» [@lisan، ج4 ص215]."
  - term: "تُرْضِعْ فَتَفْطِمِ"
    text: "الفِطام: قطع الرضيع عن اللبن. قال ابن الأَنْبارِيّ: «معناه أن أمرها يطول عليكم ولا يسرع انكشافها عنكم حتى تكون بمنزلة من يلد ويفطم» [@ibn-al-anbari، ص270]. وقال الأَعْلَم: «أي: يتمّ أمر الحرب. لأن المرأة إذا أرضعت، ثم فطمت، فقد تممت» [@diwan-zuhayr، ص20]. وقال أبو جَعْفَر: «المعنى إنها تسرع بكم وتدارك بذنوبكم شرا بعد شر، فيفنى بعضكم بعضا وتذهب أموالكم في الحمالات» [@ibn-al-anbari، ص270]."
context: "هنا موضع نقد قديم. قال الأَصْمَعِيّ: «أخطأ زهير في هذا؛ لأن عاقر الناقة ليس من عاد، وإنما هو من ثمود فغلط فجعله من عاد»، وردّ عليه المُبَرِّد: «هذا ليس بغلط؛ لأن ثمود يقال لها عاد الأخيرة» [@tabrizi-ashr، ص118]. وعدّه ابن قُتَيْبَة من الغلط [@ibn-qutayba، ج1 ص112]، وابن الأَنْبارِيّ يقول: «فاضطره الشعر إلى عاد، فقال على جهة الغلط»، ويضع معه أمثلة من الأَعْشَى والشَّمّاخ والنّابِغَة [@ibn-al-anbari، ص269–270]. أما ابن رَشِيق فيعجب من تخطئة الأَصْمَعِيّ: «ولا أدري لم خطأه وقد سمع قول الله عز وجل»، يعني {وَأَنَّهُ أَهْلَكَ عَاداً الْأُولَى}، ويقول: «فهل قال هذا إلا وثم عاد أخرى؟» [@ibn-rashiq، ج2 ص246]. وهو البيت 31 عند الأَعْلَم [@diwan-zuhayr، ص19] والزَّوْزَنِيّ [@zawzani، ص144]."
syntax:
  - "الفعل «تُنْتَجْ» مبني للمجهول، «واسم ما لم يسم فاعله مضمر فيه من ذكر الحرب، كأنه قال: فتنتج لكم الحرب غلمان أشأم. ونصب الغلمان بوقوع الفعل عليهم» [@ibn-al-anbari، ص271]؛ فهو يتعدى إلى مفعولين: نُتجت الناقةُ ولدًا."
  - "«كُلُّهُمْ» مبتدأ و«كَأَحْمَرِ عَادٍ» خبره، قال التِّبْرِيزِيّ: «ولا يجوز أن يكون توكيدا لأشأم ولا لغلمان؛ لأنهما نكرتان، والنكرة لا تؤكد» [@tabrizi-ashr، ص118]. والجملة صفة لـ«غِلْمَانَ»."
  - "«أَشْأَمَ» مجرور بالإضافة وعلامة جره الفتحة لأنه ممنوع من الصرف [@ibn-al-anbari، ص271]."
morphology:
  - "«أَشْأَم» على «أَفْعَل» لكنه بمعنى المصدر، «فلما جعل أفعل مصدرا … لم يحتج إلى من. ولو كان افعل لم يكن له بد مِن مِنْ» [@ibn-al-anbari، ص269]. ونقل ابن منظور عن الجَوْهَرِيّ: «وهو أفعل بمعنى المصدر لأنه أراد غلمان شؤم فجعل اسم الشؤم أشأم كما جعلوا اسم الضر الضراء» [@lisan، ج12 ص315]."
  - "وعند الأَعْلَم أن «أشأم» «هاهنا صفة للمصدر، على معنى المبالغة» [@diwan-zuhayr، ص20]، أي: غلمان شؤمٍ أشأمَ، كما يقال: شُغلٌ شاغل."
rhetoric:
  thesis: "يتم صورة الناقة: الحرب تلد، لكن مواليدها شؤم كلهم، كل واحد منهم قُدار جديد يجرّ الهلاك على قومه، ثم ترعاهم حتى يكبروا."
  devices:
    - title: "التشبيه"
      text: "في «كُلُّهُمْ كَأَحْمَرِ عَادٍ» شبّه كل غلام بعاقر الناقة، وهو مثل عند العرب لمن يجرّ الهلاك على قومه؛ فقُدار عقر ناقة صالح فهلكت ثمود كلها."
    - title: "ترشيح الاستعارة"
      text: "الترشيح: أن تُذكر بعد الاستعارة صفات المستعار منه، فتقوى الصورة. والحرب في البيت السابق ناقة تلقح وتلد، وهنا تُتمّ أفعال الأم: «ثُمَّ تُرْضِعْ فَتَفْطِمِ». فاكتملت دورة الأمومة كلها في الحرب. وهذه قراءتنا."
    - title: "المفارقة"
      text: "أفعال الأمومة مواضع رحمة، وقد جعلها زُهَيْر مواضع شؤم: ما تلده الحرب وما ترضعه هلاك. فالصورة تقلب ما يُفرح به إلى ما يُخشى."
  connection: "ثم يختم صورة الحرب بالسخرية: «فَتُغْلِلْ لَكُمْ مَا لَا تُغِلُّ لِأَهْلِهَا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَتُنْتَجْ / لَكُمْ غِلْمَا / نَ أَشْأَ / مَ كُلْلُهُمْ = فعولن / مفاعيلن / فعولُ / مفاعلن — كَأَحْمَ / رِ عَادِنْ ثُمْ / مَ تُرْضِعْ / فَتَفْطِمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر والأولى في العَجُز [@atiq، ص29]."
