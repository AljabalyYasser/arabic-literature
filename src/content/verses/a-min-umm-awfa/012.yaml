    status: "رواية الأَعْلَم والزَّوْزَنِيّ والتِّبْرِيزِيّ"
    note: "«ويروى: (في كل منزل نزلن به)» [@ibn-al-anbari، ص249]. وبها يروي الأَعْلَم [@diwan-zuhayr، ص13] والزَّوْزَنِيّ [@zawzani، ص138] والتِّبْرِيزِيّ [@tabrizi-ashr، ص109]، وأنشده بها المُبَرِّد [@kamil، ج3 ص69]."
  - reading: "كَأَنَّ حُتَاتَ الْعِهْنِ"
    status: "رواية أخرى"
    note: "«ويروى: (كأن حتات العهن) وهو ما انحت» [@ibn-al-anbari، ص249]، أي ما تساقط منه."
