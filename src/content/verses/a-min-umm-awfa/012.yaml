first: "كَأَنَّ فُتَاتَ الْعِهْنِ فِي كُلِّ مَوْقِفٍ"
second: "وَقَفْنَ بِهِ حَبُّ الْفَنَا لَمْ يُحَطَّمِ"
meaning: "كأن ما يتساقط من الصوف الأحمر المعلّق على الهوادج، في كل موضع وقفن فيه، حَبُّ الفنا الأحمر قبل أن يُكسر. قال يعقوب: «فشبه ما تفتت من العهن الذي علق على الهودج إذا نزلن منه منزلا بحب الفنا» [@ibn-al-anbari، ص249]."
vocabulary:
  - term: "فُتَاتَ"
    text: "«الفتات: اسم لما انفت من الشيء أي: تقطع وتفرق» [@zawzani، ص138]."
  - term: "الْعِهْنِ"
    text: "«و (العهن) : الصوف المصبوغ» [@ibn-al-anbari، ص249]. وقال الأَصْمَعِيّ: «العهن: الصوف صبغ أو لم يصبغ، وهو هاهنا المصبوغ؛ لأنه شبه بحب الفنا» [@ibn-al-anbari، ص249]. وفي لسان العرب: «العِهْنُ: الصُّوفُ المَصْبُوغُ أَلواناً» [@lisan، ج13 ص297]."
  - term: "الْفَنَا"
    text: "«شجر ثمره حب أحمر وفيه نقطة سوداء. وقال الفراء: هو عنب الثعلب» [@ibn-al-anbari، ص249]. وقال المُبَرِّد: «الفنا: شجر بعينه، يثمر ثمراً أحمر ثم يتفرق في هيئة النبق الصغار» [@kamil، ج3 ص69]."
  - term: "لَمْ يُحَطَّمِ"
    text: "لم يُكسر: «أراد أن حب الفنا صحيح، لأنه إذا كسر ظهر له لون غير الحمرة» [@ibn-al-anbari، ص249]."
syntax:
  - "«والفتات اسم كأن، والحب الخبر» [@ibn-al-anbari، ص249]. و«فِي كُلِّ مَوْقِفٍ» متعلق بمحذوف حال من «فُتَاتَ»، أي: كائنًا في كل موقف."
  - "جملة «وَقَفْنَ بِهِ» صفة لـ«مَوْقِفٍ»، والضمير في «بِهِ» عائد عليه."
  - "جملة «لَمْ يُحَطَّمِ» حال من «حَبُّ الْفَنَا» أو صفة له على أن «ال» فيه للجنس."
morphology:
  - "«الْفَنَا» مقصور، وهو غير «الفَناء» الممدود: «والفنا على وجهين: الفناء: نفاد الشيء؛ والفنا: عنب الثعلب، مقصور» [@ibn-al-anbari، ص249]."
  - "«فُتَات» على «فُعال»، وهي صيغة لما تكسّر من الشيء؛ «وأصله من الفت وهو التقطيع والتفريق» [@zawzani، ص138]."
  - "«يُحَطَّم» مضارع «حَطَّمَ» المبني للمجهول، والتضعيف للتكثير. «التحطم: التكسر، والحطم: الكسر» [@zawzani، ص138]."
rhetoric:
  thesis: "أثر الظعائن في الطريق قطع صوف حمراء تتناثر، والشاعر يرى فيها حبًّا أحمر سليمًا، فيبقى اللون صافيًا كما كان على الهوادج."
  devices:
    - title: "التشبيه في اللون"
      text: "في «كَأَنَّ فُتَاتَ الْعِهْنِ ... حَبُّ الْفَنَا» شبّه قطع الصوف المصبوغ بحب الفنا في الحمرة والاستدارة والتفرّق. وعدّه المُبَرِّد «من أحسن التشبيه. وإنما وصف ما يسقط من أنماطهن إذا نزلن» [@kamil، ج3 ص69]. وهو عند عبد القاهر تشبيه «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]، يُدرك بالعين."
    - title: "الإيغال"
      text: "الإيغال: أن يتمّ المعنى قبل آخر البيت، ثم يزيد الشاعر في آخره ما يقوّيه. وجعل ابن رَشِيق «لَمْ يُحَطَّمِ» إيغالًا تبع فيه زُهَيْر امرأ القيس في «الجزع الذي لم يثقب»: «فأوغل في التشبيه إيغالاً بتشبيهه ما يتناثر من فتات الأرجوان بحب الفنا الذي لم يحطم؛ لأنه أحمر الظاهر أبيض الباطن، فإذا لم يحطم لم يظهر فيه بياض البتة، وكان خالص الحمرة» [@ibn-rashiq، ج2 ص58]. ومثله عند أبي هلال العَسْكَرِيّ: قرنه بقول امرئ القيس «لم يثقب» الذي «يزيد التشبيه توكيدا»، وقال: «القنا إذا كسر ابيض» [@sinaatayn، ص381]."
    - title: "اللون الثاني"
      text: "بعد الأنماط الحمراء في البيت 9 يعود الأحمر في الصوف المتناثر. فالمقطع يلوّن الرحلة بلون واحد. وهذه قراءتنا."
  connection: "ثم يعود إلى سيرهن: بكّرن وسرن في السحر، وهنّ قاصدات وادي الرَّسّ [@ibn-al-anbari، ص250]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "كَأَنْنَ / فُتَاتَلْعِهْ / نِ فِي كُلْ / لِ مَوْقِفِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — وَقَفْنَ / بِهِي حَبْبُلْ / فَنَا لَمْ / يُحَطْطَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الأولى في الشطرين [@atiq، ص29]، وأُشبعت كسرة الهاء في «بِهِ» فصارت «بِهِي»."
context: "آخر صور الزينة في مقطع الظعائن، وهو من أشهر أبياته في كتب البلاغة. وموضعه عند الأَعْلَم البيت 13، وعند الزَّوْزَنِيّ كذلك [@diwan-zuhayr، ص13] [@zawzani، ص138]."
variants:
