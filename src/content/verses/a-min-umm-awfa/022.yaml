first: "عَظِيمَيْنِ فِي عُلْيَا مَعَدٍّ هُدِيتُمَا"
second: "وَمَنْ يَسْتَبِحْ كَنْزًا مِنَ الْمَجْدِ يُعْظِمِ"
meaning: "أصبحتما عظيمين في أشراف مَعَدّ، هداكما الله. ومن وجد كنزًا من المجد مباحًا فأخذه، أتى بأمر عظيم وعظُم شأنه. قال الأَعْلَم: «يقول: من فعل فعلكما، وسعى سعيكما، فقد أتيح له المجد، واستحقّ أن يُعْظَم عند الناس» [@diwan-zuhayr، ص17]."
vocabulary:
  - term: "عُلْيَا مَعَدٍّ"
    text: "«عليا معد: أرفعها؛ يقال: هو في عُليا معد وعَليا معد» [@ibn-al-anbari، ص262]. وعند الأَعْلَم: «أشرافها» [@diwan-zuhayr، ص16]. ومَعَدّ: مَعَدّ بن عدنان، أبو قبائل عرب الشمال."
  - term: "هُدِيتُمَا"
    text: "«دعاء لهما» [@zawzani، ص140]، أي: هداكما الله إلى الرشد."
  - term: "يَسْتَبِحْ"
    text: "قال أبو جَعْفَر: يجد كنزًا مباحًا «فيأخذه لنفسه فيعظم حينئذ» [@ibn-al-anbari، ص263]. وعند الزَّوْزَنِيّ: «الاستباحة: وجود الشيء مباحًا، وجعل الشيء مباحًا، والاستباحة الاستئصال» [@zawzani، ص140]. وفي لسان العرب: «وَقَدِ اسْتَبَاحَهُ أَي انْتَهَبَه» [@lisan، ج2 ص416]."
  - term: "يُعْظِمِ"
    text: "قال أبو جَعْفَر: «وقال (يعظم) : يأتي بأمر عظيم. و (يعظم) : يعظمه الناس. و (يعظم) يصير عظيما. وقال: يروى على هذه الوجوه الثلاثة» [@ibn-al-anbari، ص263]. أي: يُعْظِم، ويُعْظَم، ويَعْظُم."
syntax:
  - "«وموضع عظيمين نصب على الإتباع لبعيدين» [@ibn-al-anbari، ص263]، أي خبر ثانٍ لـ«أصبحتما» في البيت السابق، أو حال؛ قال الزَّوْزَنِيّ: «ونصب عظيمين على الحال» [@zawzani، ص140]."
  - "«هُدِيتُمَا» جملة دعاء معترضة، لا محل لها من الإعراب. والجملة المعترضة: جملة تقع بين أجزاء الكلام لغرض كالدعاء."
  - "«وموضع من رفع بما عاد من يستبح، ويعظم موضعه جزم لأنه جواب الجزاء» [@ibn-al-anbari، ص263]: «مَنْ» اسم شرط مبتدأ، و«يَسْتَبِحْ» فعل الشرط، و«يُعْظِمِ» جوابه."
morphology:
  - "«عُلْيَا» تأنيث «الأعلى»، «وجمعها العليات والعلى مثل الكبرى في تأنيث الأكبر» [@zawzani، ص140]."
  - "«يَسْتَبِحْ» على «يَسْتَفْعِل» من «باح»، وهي صيغة الطلب والوجدان: وجد الشيء مباحًا."
  - "«يُعْظِم» مضارع «أَعْظَمَ» اللازم: أتى بأمر عظيم؛ و«يُعْظَم» مضارعه المبني للمجهول؛ و«يَعْظُم» مضارع «عَظُمَ»."
rhetoric:
  thesis: "يختم مدح السيدين بالدعاء ثم بحكم عام: المجد كنز مباح لمن سعى إليه، ومن أخذه عظم."
  devices:
    - title: "الاستعارة"
      text: "في «كَنْزًا مِنَ الْمَجْدِ» جعل المجد كنزًا يُستباح ويُنتهب. وقال الأَعْلَم إن الكنز «كناية عن الكثرة» [@diwan-zuhayr، ص16–17]، أي مجد كثير. وهو على حدّ عبد القاهر استعارة: أن تجيء «إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]؛ والجامع أن كليهما ثمين مخبوء لا يناله إلا من يجده."
    - title: "التذييل"
      text: "التذييل: أن يُختم الكلام بجملة عامة تؤكد معناه وتصلح مثلًا. والعجز «وَمَنْ يَسْتَبِحْ كَنْزًا مِنَ الْمَجْدِ يُعْظِمِ» حكم عام بعد مدح خاص، وهو أول ما يظهر في القصيدة من الأسلوب الذي ستُختم به: الجملة الشرطية المبدوءة بـ«وَمَنْ»، كما في الأبيات 47–55."
    - title: "الدعاء المعترض"
      text: "في «هُدِيتُمَا» يقطع الشاعر المدح بدعاء: «هديتما إلى طريق الصلاح والنجاح والفلاح» [@zawzani، ص140]. فالمادح يشارك في الثناء ولا يكتفي بوصفه."
  connection: "ثم يذكر أثر سعيهما: إبل الديات تُساق إلى أولياء القتلى من أموالهم [@ibn-al-anbari، ص263]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "عَظِيمَيْ / نِ فِي عُلْيَا / مَعَدْدِنْ / هُدِيتُمَا = فعولن / مفاعيلن / فعولن / مفاعلن — وَمَنْ يَسْ / تَبِحْ كَنْزَنْ / مِنَلْمَجْ / دِ يُعْظِمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "التفعيلات تامة إلا العروض والضرب [@atiq، ص29]. والقافية «يُعْظِمِ» ساقطة من نسخة ابن الأَنْبارِيّ في المكتبة الشاملة، وشرحه يفسّرها بثلاثة وجوه أولها «يأتي بأمر عظيم» [@ibn-al-anbari، ص263]، وبه يرويها التِّبْرِيزِيّ وهو ينقل شرحه [@tabrizi-ashr، ص113]؛ فأثبتناها. والوجوه الثلاثة سواء في الوزن، أما «يُعَظَّمِ» فلا يستقيم بها."
context: "آخر أبيات مدح السيدين (19–22)، وبه يتمّ الحديث عن فعلهما قبل الحديث عن الديات."
variants:
  - reading: "عَظِيمَيْنِ فِي عُلْيَا مَعَدٍّ وَغَيْرِهَا"
    status: "رواية الأَعْلَم"
    note: "في متنه «وغيرها» مكان «هُدِيتُمَا» [@diwan-zuhayr، ص16]. ويقول البَغْدادِيّ: «وروي بدل وغيرها هديتما وهو دعاء» [@khizana، ج3 ص8]."
  - reading: "يَعْظُمِ"
    status: "رواية الأَعْلَم والزَّوْزَنِيّ"
    note: "بمعنى يصير عظيمًا [@diwan-zuhayr، ص16] [@zawzani، ص140]. ويذكر الأَعْلَم رواية «يُعْظِم»، «أي: يجيء بأمر عظيم» [@diwan-zuhayr، ص17]. وفي الخزانة الوجوه الثلاثة: «روي يعظم بالفتح أي: يصر عظيما وبالضم مع كسر الظاء أي: يأت بأمر عظيم ومع فتح الظاء أي: يعظمه الناس» [@khizana، ج3 ص8]."
