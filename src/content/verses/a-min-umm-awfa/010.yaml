first: "ظَهَرْنَ مِنَ السُّوبَانِ ثُمَّ جَزَعْنَهُ"
second: "عَلَى كُلِّ قَيْنِيٍّ قَشِيبٍ وَمُفْأَمِ"
meaning: "خرجت الظعائن من وادي السُّوبان، ثم قطعنه، وهنّ على رحال قَيْنية جديدة، وعلى إبل ضخمة أو رحال موسّعة. قال يعقوب: «(ظهرن من السوبان) معناه خرجن منه. وقوله: (ثم جزعنه) معناه عرض لهن مرة أخرى فقطعنه لأنه يتثنى» [@ibn-al-anbari، ص248]."
vocabulary:
  - term: "السُّوبَانِ"
    text: "«السوبان: واد» [@ibn-al-anbari، ص248]. وفي لسان العرب: «والسُّوبانُ: اسْمُ وادٍ» [@lisan، ج1 ص479]."
  - term: "جَزَعْنَهُ"
    text: "قطعنه. والجزع عند الزَّوْزَنِيّ: «قطع الوادي» [@zawzani، ص138]."
  - term: "قَيْنِيٍّ"
    text: "قال يعقوب: «قيني أراد غبيطاً، وهة قتب طويل يكون تحت الهودج. وقيني نسب إلى بلقين» [@ibn-al-anbari، ص248]. والغبيط: رحل للنساء، والقتب: رحل صغير. وعند الأَعْلَم بنو القين «حيٌّ من اليمن، تُنسب إليهم الرِّحال» [@diwan-zuhayr، ص13]، وفي لسان العرب: «وَيُقَالُ لِبَنِي القَيْن مِنْ بَنِي أَسد: بَلْقَيْنِ... وإِذا نَسَبْتَ إِليهم قُلْتَ قَيْنيٌّ» [@lisan، ج13 ص352]."
  - term: "قَشِيبٍ"
    text: "«وقشيب: جديد. يقال ثياب قشب» [@ibn-al-anbari، ص248]."
  - term: "مُفْأَمِ"
    text: "«وقال أبو عمرو: (ومفأم) يعنى جملا ضخما. وقال الأصمعي: مفأّم بالتشديد: قد وسع زيد فيه بنيقتان من جانبيه ليتسع» [@ibn-al-anbari، ص248]. والبنيقة: «وصلة بمنزلة بنيقة القميص» [@ibn-al-anbari، ص248]. وفي لسان العرب: «وفَأّمَ الهَوْدجَ وأَفْأَمَه: وسَّعَ أسفَلَه» [@lisan، ج12 ص447]."
syntax:
  - "«ظَهَرْنَ» معطوف على «جَعَلْنَ» في البيت 8، «وفيه ضمير الظعائن» [@ibn-al-anbari، ص248]. و«ثُمَّ» للترتيب مع التراخي."
  - "«عَلَى كُلِّ قَيْنِيٍّ» في موضع الحال من ضمير الظعائن: وهنّ راكبات على كل قيني. و«قَشِيبٍ» نعت لـ«قَيْنِيٍّ»."
  - "«والمفأم نسق على قيني. ومن رواه مفأم جعله نعتا للقشيب» [@ibn-al-anbari، ص248]: فعلى رواية الواو «المُفْأَم» شيء آخر غير الرحل، هو الجمل الضخم عند أبي عمرو، وعلى رواية الأَصْمَعِيّ بلا واو هو صفة للرحل نفسه."
morphology:
  - "«قَيْنِيّ» منسوب إلى «القَيْن»، وتقول العرب «بَلْقَيْن» بحذف «بني»، «كَمَا قَالُوا بَلْحرث وبَلْهُجَيم، وَهُوَ مِنْ شَوَاذِّ التَّخْفِيفِ» [@lisan، ج13 ص352]."
  - "«مُفْأَم» اسم مفعول من «أَفْأَمَ»، و«مُفَأَّم» من «فَأَّمَ» بالتضعيف: «يقال فئَّم دلوك؛ فتزيد فيه بنيقة» [@ibn-al-anbari، ص248]."
  - "«قَشِيب» على «فَعِيل» بمعنى «فاعل»، وجمعه «قُشُب» [@ibn-al-anbari، ص248]."
rhetoric:
  thesis: "رحلة النساء تُرى في حركة الماء والأرض: يخرجن من الوادي ثم يعود الوادي فيعترضهن فيقطعنه، على رحال جديدة."
  devices:
    - title: "الحركة المتعرجة"
      text: "في «ظَهَرْنَ ... ثُمَّ جَزَعْنَهُ» حركتان. وفسّرها يعقوب بأن الوادي «يتثنى» فيعترض الطريق مرتين، وأنكر ذلك أبو جَعْفَر: «جزعنه: خلفنه ومررن ولم يعرض لهن بعد ذلك» [@ibn-al-anbari، ص248]. وعلى القولين يرسم البيت مسارًا يتابعه الشاعر بعينه."
    - title: "دلالة الجِدّة والسعة"
      text: "«قَشِيبٍ» و«مُفْأَمِ» صفتان تدلان على الغنى. قال أبو جَعْفَر: «يصف نعمتهن وأنهن ملوك»، و«إنما جعله مفأماً لضخم النساء وأن لهن أجساما» [@ibn-al-anbari، ص248]. والضخامة في نساء الجاهلية من علامات النعمة."
    - title: "التتبّع"
      text: "مقطع الظعائن مبنيّ على التتبّع: كل بيت مرحلة. وهذا البيت يفتح المرحلة الثانية، من الجبل إلى الوادي. وهذه قراءتنا."
  connection: "ثم يصف كيف مِلن في السوبان وعلون متنه، وعليهن دلال المترفات [@ibn-al-anbari، ص248]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "ظَهَرْنَ / مِنَسْسُوبَا / نِ ثُمْمَ / جَزَعْنَهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — عَلَى كُلْ / لِ قَيْنِيْيِنْ / قَشِيبِنْ / وَمُفْأَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» في التفعيلتين الأولى والثالثة من الصدر [@atiq، ص29]، وأُشبعت ضمة الهاء في «جَزَعْنَهُ». وكلمة «قَشِيبٍ» ساقطة من العجز في نسخة ابن الأَنْبارِيّ في المكتبة الشاملة، وبسقوطها ينكسر الوزن، وشرحه يفسّرها ويقول: «ومن رواه مفأم جعله نعتا للقشيب» [@ibn-al-anbari، ص248]؛ فأثبتناها."
context: "الأَعْلَم يضع هذا البيت بعد «جعلن القنان» [@diwan-zuhayr، ص12–13]، وابن الأَنْبارِيّ يجعل بينهما بيت الأنماط. وبعده عند ابن الأَنْبارِيّ بيت «ووَرّكن في السوبان»، وليس هو في رواية الأَعْلَم [@diwan-zuhayr، ص13]."
variants:
  - reading: "عَلَى كُلِّ قَيْنِيٍّ قَشِيبٍ مُفَأَّمِ"
    status: "رواية الأَصْمَعِيّ والأَعْلَم"
    note: "بلا واو وبالتشديد: «وقال: روى الأصمعي: (قشيب مفأم)» [@ibn-al-anbari، ص248]. وبها يروي الأَعْلَم، وفسّر المُفأَّم بأنه «الذي قد وُسِّع، وزيد فيه بنيقتان من جانبيه، ليتّسع» [@diwan-zuhayr، ص13]. ويذكرها الشرح المنسوب إلى ثَعْلَب رواية أخرى [@sharh-thalab-zuhayr، ص21]."
  - reading: "ظَهَرْنَ مِنَ السُّوبَانِ ثُمَّ بَطَنَّهُ"
    status: "رواية أخرى"
    note: "في الشرح المنسوب إلى ثَعْلَب أن البيت يُروى «ثمّ بطنّه»، وفسّرها: «أي: دخلن في بطنه» [@sharh-thalab-zuhayr، ص21]."
  - reading: "عَلَى كُلِّ حِيرِيٍّ"
    status: "رواية أخرى"
    note: "«ويروى: على كل حيري، منسوب إلى الحيرة» [@zawzani، ص139]، وهي بلدة قرب الكوفة."
