first: "وَأَصْبَحَ يُحْدَى فِيهِمُ مِنْ تِلَادِكُمْ"
second: "مَغَانِمُ شَتَّى مِنْ إِفَالٍ مُزَنَّمِ"
meaning: "وصارت تُساق إلى أولياء القتلى، من أموالكم القديمة الموروثة، غنائم متفرقة من صغار الإبل الكريمة الموسومة. قال يعقوب: «يقول: صرتم تغرمون لهم من تلادكم» [@ibn-al-anbari، ص263]."
vocabulary:
  - term: "يُحْدَى"
    text: "«يحدي: يساق» [@ibn-al-anbari، ص263]. والحُداء: غناء يُساق به الإبل."
  - term: "تِلَادِكُمْ"
    text: "«والتالد من المال والتليد: ما ولد عندهم»، «والطارف والطريف: ما استحدثوا» [@ibn-al-anbari، ص263]. وفي لسان العرب: «التَّالِدُ: الْمَالُ الْقَدِيمُ الأَصلِيُّ الَّذِي وُلد عِنْدَكَ، وَهُوَ نَقِيضُ الطَّارِفِ» [@lisan، ج3 ص99]."
  - term: "إِفَالٍ"
    text: "قال يعقوب: «الإفال: الصغار من الإبل بنات المخاض وبنات اللبون، الواحد أفيل وأفيلة للأنثى» [@ibn-al-anbari، ص263]. وفي لسان العرب: «والإِفَال والأَفَائِل: صِغار الإِبل بَنَاتُ المخَاض ونحوُها» [@lisan، ج11 ص18]."
  - term: "مُزَنَّمِ"
    text: "«والتزنيم علامة كانت تجعل على ضرب من الإبل كرام، وهو أن يسحى ظاهر الأذن، أي تقشر جلدته، ثم تفتل فتبقى زنمة تنوس، أي تضطرب» [@ibn-al-anbari، ص263]. وفي لسان العرب: «والمُزَنَّمُ مِنَ الإِبل: الْمَقْطُوعُ طَرَفِ الأُذن» [@lisan، ج12 ص275]."
syntax:
  - "«والمغانم ترتفع لأنها اسم أصبح، وخبر أصبح ما عاد من يحدى، وشتى في موضع رفع على النعت للمغانم» [@ibn-al-anbari، ص264]. أي أن «مَغَانِمُ» اسم «أَصْبَحَ» مؤخر، وجملة «يُحْدَى» خبرها مقدم."
  - "«فِيهِمُ» متعلق بـ«يُحْدَى»، والضمير لأولياء المقتولين كما يقول الزَّوْزَنِيّ [@zawzani، ص141]. و«مِنْ تِلَادِكُمْ» متعلق بـ«يُحْدَى» أو حال من «مَغَانِمُ»."
  - "«مُزَنَّمِ» نعت لـ«إِفَالٍ» بلفظ المذكر المفرد؛ قال الزَّوْزَنِيّ: «ولم يقل المزنمة وإن كان صفة الإفال حملًا على اللفظ؛ لأن فعالًا من الأبنية التي اشترك فيها الآحاد والجموع» [@zawzani، ص142]."
morphology:
  - "«التِّلاد» أصل تائه واو: «وأصله الوالد والوليد، فأبدلت التاء من الواو؛ كما قالوا متزن، والتراث وأصله الوراث» [@ibn-al-anbari، ص263]."
  - "«إِفَال» جمع «أَفِيل» على «فِعال»."
  - "«مُزَنَّم» اسم مفعول من «زَنَّمَ» على «فَعَّلَ»، من «الزَّنَمة»: ما يُترك معلّقًا من الأذن."
rhetoric:
  thesis: "الديات تُرى إبلًا تُحدى في الطريق إلى أولياء القتلى: موكب سلام يقابل مواكب الحرب."
  devices:
    - title: "تسمية الديات مغانم"
      text: "سمّى الإبل التي يأخذها أولياء القتلى «مَغَانِمُ»، والمغانم ما يُؤخذ في الحرب. فالصلح يعطي القوم ما كانوا يطلبونه بالقتال، من غير قتال. وهذه قراءتنا."
    - title: "دلالة «تِلَادِكُمْ»"
      text: "المال التالد أعزّ المال لأنه موروث. فدفع الديات منه دليل على صدق البذل. وقرأ أبو جَعْفَر «من تلادكم» على المعنى: «من كرم سعيكم الذي سعيتم لهم حتى جمعتم لهم الحمالة» [@ibn-al-anbari، ص263]."
    - title: "تخصيص الإفال"
      text: "خصّ صغار الإبل لأنها التي تُدفع في الدية. قال الأَعْلَم: «وإنما خصّ الإفال، لأنهم كانوا يَغرمون في الدية صِغار الإبل» [@diwan-zuhayr، ص17]. فاللفظ دقيق في العرف، لا لمجرد الوزن."
  connection: "ثم يقول إن الجراح تُمحى بالمئين من الإبل، يؤدّيها نجومًا من لم يجرم [@ibn-al-anbari، ص264]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَأَصْبَ / حَ يُحْدَى فِي / هِمُو مِنْ / تِلَادِكُمْ = فعولُ / مفاعيلن / فعولن / مفاعلن — مَغَانِ / مُ شَتْتَى مِنْ / إِفَالِنْ / مُزَنْنَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الأولى في الشطرين [@atiq، ص29]. وأُشبعت ضمة الميم في «فِيهِمُ» فصارت «فِيهِمُو»؛ وإشباع ميم الجمع جائز في الشعر."
context: "أول أبيات الديات المنجّمة (23–25). بعد مدح السيدين يصف ما بذلاه بعينه. وفي متن ابن الأَنْبارِيّ في المكتبة الشاملة صدر هذا البيت «وَأَصبَحَ يُحْدَي فيكُم مِن إِفالِها»، وشرحه لا يفسّر «إفالها» بل يفسّر «تلادكم»، ويذكر رواية «فأصبح يجري فيهم من تلادكم» [@ibn-al-anbari، ص263]. والتِّبْرِيزِيّ، وهو ينقل شرحه، يروي الصدر «وَأَصْبَحَ يُحْدَى فِيهِمُ مِنْ تِلاَدِكُمْ» [@tabrizi-ashr، ص113]، فاعتمدنا روايته."
variants:
  - reading: "فَأَصْبَحَ يَجْرِي فِيهِمُ مِنْ تِلَادِكُمْ"
    status: "رواية الأَعْلَم والزَّوْزَنِيّ"
    note: "«ويروى: (فأصبح يجري فيهم من تلادكم)» [@ibn-al-anbari، ص263]. وبها يروي الأَعْلَم [@diwan-zuhayr، ص16] والزَّوْزَنِيّ [@zawzani، ص141]."
  - reading: "مِنْ إِفَالِ الْمُزَنَّمِ"
    status: "رواية أبي عُبَيْدة والأَعْلَم"
    note: "«وروى أبو عبيدة: (من إفال المزنم) ، وقال: هو فحل معروف» [@ibn-al-anbari، ص263]. وبها يروي الأَعْلَم، وقال إن المزنّم «فحل معروف، نسبها إليه» [@diwan-zuhayr، ص17]."
  - reading: "مِنْ نِتَاجِ مُزَنَّمِ"
    status: "رواية أبي جَعْفَر"
    note: "«ورواه أبو جعفر: (من نتاج مزنم) وقال: إفال خطأ، لأنه لا ينبغي أن تكون مزنمة» [@ibn-al-anbari، ص263]، أي أن الصغار لا توسم."
