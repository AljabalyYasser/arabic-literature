first: "رَعَوْا ظِمْأَهُمْ حَتَّى إِذَا تَمَّ أَوْرَدُوا"
second: "غِمَارًا تَسِيلُ بِالسِّلَاحِ وَبِالدَّمِ"
meaning: "كفّوا عن القتال مدة كما ترعى الإبل أيام ظمئها بعيدة عن الماء، فلما تمت المدة عادوا إلى الحرب كما تُورَد الإبل الماء، لكنهم وردوا غمرات تسيل بالسلاح والدم. قال أبو عُبَيْدَة: «يعنى سكنوا وكفوا عن القتال ثم أوردوا غمارا، أي قاتلوا» [@ibn-al-anbari، ص274]. وقال الأَعْلَم: «يريد: أقاموا في غير حرب، ثم أوردوا خيلهم وأنفسهم الحرب» [@diwan-zuhayr، ص23]."
vocabulary:
  - term: "ظِمْأَهُمْ"
    text: "«الظمء: ما بين الشربتين» [@ibn-al-anbari، ص274]، أي المدة التي تبقى فيها الإبل في المرعى بلا ماء بين وردين."
  - term: "أَوْرَدُوا"
    text: "أوردوا إبلهم الماء، والمراد أنفسهم: «فلما عادوا في ذلك أوردوا إبلهم غمارا، وإنما يريد أنفسهم» [@ibn-al-anbari، ص274]."
  - term: "غِمَارًا"
    text: "«(الغمار) : الأمور العظام»، «وغمرة كل شيء: معظمه» [@ibn-al-anbari، ص274]. وعند الزَّوْزَنِيّ: «جمع غمر وهو الماء الكثير» [@zawzani، ص146]."
context: "يرجع زُهَيْر هنا إلى أمر القبيلتين قبل الصلح، قال أبو جَعْفَر: «معناه إنه رجع إلى وصف أمرهم قبل الصلح، فأخبر أنهم رعوا ظمأهم. يعني أن بعضهم كان يثب على بعض فيقتله قبل اجتماعهم في الحرب» [@ibn-al-anbari، ص274]. ويختلف موضعه: هو عند ابن الأَنْبارِيّ بعد مدح الحي، وعند الأَعْلَم البيت 39 بعد قصة حُصَيْن [@diwan-zuhayr، ص23]، وكذلك عند الزَّوْزَنِيّ، الذي يقول في ختام قصة حُصَيْن: «ثم أضرب عن قصته ورجع إلى تقبيح صورة الحرب» [@zawzani، ص146]."
syntax:
  - "«والظمء منصوب برعوا، والغمار نصب بأوردوا، وتسيل صلة الغمار» [@ibn-al-anbari، ص274]، أي صفة لها."
  - "«الرعي يقتصر على مفعول واحد: رعت الماشية الكلأ، وقد يتعدى إلى مفعولين نحو: رعيت الماشية الكلأ» [@zawzani، ص146]. وجعل مفعوله هنا الزمن نفسه، «ظِمْأَهُمْ»، أي رعوا مدة ظمئهم."
  - "حُذف مفعول «أَوْرَدُوا» الأول، وهو الإبل أو أنفسهم، وبقي الثاني «غِمَارًا». وفاعل «تَمَّ» ضمير الظِّمء."
morphology:
  - "«الظِّمْء» جمعه «الأظماء» [@zawzani، ص146]."
  - "«أَوْرَدَ» على «أفعل» من «وَرَدَ»، والهمزة للتعدية: وَرَدت الإبل، وأوردها صاحبها."
  - "«غِمار» جمع «غَمْر» على «فِعال» [@zawzani، ص146]."
rhetoric:
  thesis: "يصوّر الهدنة ثم الحرب بدورة الإبل بين المرعى والماء: يرعون مدة، ثم يردون، فإذا الماء دم."
  devices:
    - title: "التمثيل"
      text: "شبّه حالهم في الكفّ عن القتال ثم العودة إليه بحال إبل ترعى أيام ظمئها ثم تُورَد. قال الزَّوْزَنِيّ: «وهذا كله استعارة، والمعنى أنهم كفوا عن القتال وأقلعوا عن النزال مدة معلومة كما ترعى الإبل مدة معلومة، ثم عادوا الوقائع كما تورد الإبل بعد الرعي» [@zawzani، ص147]. والشبه هنا بين هيئتين لا بين شيئين، فهو عند عبد القاهر الجُرْجانيّ تمثيل، لأن الشبه فيه «محصّلاً بضرب من التأوّل» [@asrar، ص90]."
    - title: "كسر المتوقَّع"
      text: "الإبل تُورَد الماء لتشرب، وهؤلاء أُوردوا «غِمَارًا تَسِيلُ بِالسِّلَاحِ وَبِالدَّمِ». فالعجز يقلب الصورة: الماء الذي يُنتظر بعد الظمء صار سلاحًا ودمًا. وهذه قراءتنا."
  connection: "ثم يتمّ الدورة: بعد الورد يكون الصَّدَر، «فَقَضَّوْا مَنَايَا بَيْنَهُمْ ثُمَّ أَصْدَرُوا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "رَعَوْ ظِمْ / أَهُمْ حَتْتَى / إِذَا تَمْ / مَ أَوْرَدُو = فعولن / مفاعيلن / فعولن / مفاعلن — غِمَارَنْ / تَسِيلُ بِسْ / سِلَاحِ / وَبِدْدَمِي = فعولن / مفاعلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «مفاعيلن» الثانية في العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]، و«فعولن» الثانية فيه فصارت «فعولُ» [@atiq، ص29]."
