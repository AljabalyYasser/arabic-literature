first: "وَوَرَّكْنَ فِي السُّوبَانِ يَعْلُونَ مَتْنَهُ"
second: "عَلَيْهِنَّ دَلُّ النَّاعِمِ الْمُتَنَعِّمِ"
meaning: "ومالت الظعائن في وادي السُّوبان وهنّ يعلون ما ارتفع منه، وعليهن دلال المترف الذي نشأ في النعمة. قال الزَّوْزَنِيّ: «وركبت هؤلاء النسوة أوراك ركابهن في حال علوهن متن السوبان، وعليهن دلال الإنسان الطيب العيش الذي يتكلف ذلك» [@zawzani، ص137]."
vocabulary:
  - term: "وَرَّكْنَ"
    text: "قال يعقوب: «وركن معناه ملن فيه»، «ويقال: قد وركت موضع كذا وكذا، إذا خلفته وراء أوراكها» [@ibn-al-anbari، ص248–249]. وعند الزَّوْزَنِيّ: «التوريك: ركوب أوراك الدواب» [@zawzani، ص137]."
  - term: "مَتْنَهُ"
    text: "«و (المتن) : ما غلظ من الأرض وارتفع» [@ibn-al-anbari، ص249]."
  - term: "دَلُّ"
    text: "«الدل والدلال والدالة واحد، وقد أدلت المرأة وتدللت» [@zawzani، ص137]، وهو ما تُظهره المرأة من الغنج والتمنّع."
  - term: "النَّاعِمِ الْمُتَنَعِّمِ"
    text: "«النعمة: طيب العيش. والتنعم: تكلف النعمة» [@zawzani، ص137]."
syntax:
  - "«وَرَّكْنَ» معطوف على «جَعَلْنَ» في البيت 8 [@ibn-al-anbari، ص248]."
  - "«ويعلون، فيه ضمير الظعائن وتقديره الحال، فهو في موضع نصب في التأويل، والتقدير: ووركن في السوبان عاليات متنه» [@ibn-al-anbari، ص249]."
  - "«عَلَيْهِنَّ» خبر مقدم، و«دَلُّ» مبتدأ مؤخر، والجملة حال ثانية من الظعائن. «وقوله: (عليهن) ، معناه على الظعائن» [@ibn-al-anbari، ص249]."
morphology:
  - "«يَعْلُونَ» لفظ يشترك فيه المذكر والمؤنث: «فالواو مع المذكر مزيدة للتذكير والجمع، والواو مع المؤنث أصلية هي لام الفعل، والنون علامة التأنيث والجمع» [@ibn-al-anbari، ص249]. فوزنه هنا «يَفْعُلْنَ» من «علا يعلو»."
  - "«وَرَّكَ» على «فَعَّلَ» من «الوَرِك»، أي جعل الشيء خلف وركه أو ركب الورك."
  - "«المُتَنَعِّم» اسم فاعل من «تَنَعَّمَ» على «تَفَعَّلَ»، وهي صيغة التكلّف كما يقول الزَّوْزَنِيّ [@zawzani، ص137]."
rhetoric:
  thesis: "بعد المكان يأتي وصف النساء أنفسهن: ركبن في ترف ودلال، فالسفر عندهن نزهة."
  devices:
    - title: "الجناس"
      text: "الجناس: تشابه لفظين في الحروف مع اختلاف المعنى أو الصيغة. وفي «النَّاعِمِ الْمُتَنَعِّمِ» لفظان من جذر واحد، فهو جناس اشتقاق. الأول من نشأ في النعمة، والثاني من يتكلّفها ويُظهرها. فاجتمع فيهن الأصل والإظهار. وهذه قراءتنا للفرق، مبنية على تفريق الزَّوْزَنِيّ بين النعمة والتنعم [@zawzani، ص137]."
    - title: "التذكير في وصف النساء"
      text: "قال «دَلُّ النَّاعِمِ» ولم يقل «الناعمة». وفسّره الزَّوْزَنِيّ بـ«دلال الإنسان الطيب العيش» [@zawzani، ص137]: فالمراد جنس المترف، والنساء منه."
    - title: "دلالة الرفق"
      text: "قرأ أبو جَعْفَر «وَرَّكْنَ» على أنهن نزلن ومِلن رفقًا بهن: «عدلن أوراك إبلهن ونزلن لما علون متنه وحزنه لترفقهم بهن، وهو قوله (عليهن دل الناعم المتنعم)» [@ibn-al-anbari، ص249]. فالعجز تفسير للصدر: يُرفق بهن لأنهن مدلّلات."
  connection: "ثم يصف ما يتساقط من صوف الهوادج في منازلهن كأنه حب الفنا الأحمر [@ibn-al-anbari، ص249]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَوَرْرَكْ / نَ فِسْسُوبَا / نِ يَعْلُو / نَ مَتْنَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — عَلَيْهِنْ / نَ دَلْلُنْنَا / عِمِلْمُ / تَنَعْعِمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» الثالثة من العجز [@atiq، ص29]، وأُشبعت ضمة الهاء في «مَتْنَهُ»."
context: "ليس هذا البيت في رواية الأَعْلَم، وهي رواية الأَصْمَعِيّ. ويذكر المحقق قباوة أنه «بعده في التبريزي، وابن الأنباري، وثعلب، والزوزني، والجمهرة» [@diwan-zuhayr، ص13]. ويذكر محقق الشرح المنسوب إلى ثَعْلَب أنه سقط من أصل نسخته ومن نسخة أخرى [@sharh-thalab-zuhayr، ص21]. وموضعه عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ بعد «ظهرن من السوبان» [@tabrizi-ashr، ص108]، وعند الزَّوْزَنِيّ قبل «بكرن بكورا» [@zawzani، ص137]."
