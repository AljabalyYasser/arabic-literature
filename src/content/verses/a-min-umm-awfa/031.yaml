first: "فَتَعْرُكْكُمُ عَرْكَ الرَّحَى بِثِفَالِهَا"
second: "وَتَلْقَحْ كِشَافًا ثُمَّ تُنْتَجْ فَتُتْئِمِ"
meaning: "فتطحنكم الحرب كما تطحن الرحى الحَبّ وتحتها ثفالها، وتحمل حملًا بعد حمل بلا راحة، ثم تلد توأمين. قال الزَّوْزَنِيّ: «جعل إفناء الحرب إياهم بمنزلة طحن الرحى الحب، وجعل صنوف الشر تتولد من تلك الحروب بمنزلة الأولاد الناشئة من الأمهات» [@zawzani، ص144]."
vocabulary:
  - term: "تَعْرُكْكُمُ"
    text: "«أي: تطحنكم وتهلككم. وأصل العرك: دلك الشيء» [@diwan-zuhayr، ص19]."
  - term: "ثِفَالِهَا"
    text: "«جلدة أو خرقة تجعل تحت الرحى ليكون ما سقط من الطحين في الثفال» [@ibn-al-anbari، ص268]. وفي لسان العرب: «الجلد الذي يبسط تحت رحى اليد ليقي الطحين من التراب» [@lisan، ج11 ص85]."
  - term: "تَلْقَحْ كِشَافًا"
    text: "تحمل كل عام. «الكشاف: أن تحمل على الناقة في كل سنة فتلقح، وذلك أردأ النتاج» [@ibn-al-anbari، ص268]؛ لأن «أحمد النتاج في الإبل أن يحمل على الناقة سنة ثم تجم سنة؛ وذلك أقوى للولد» [@ibn-al-anbari، ص268]، وتجمّ: تستريح."
  - term: "تُنْتَجْ"
    text: "تلد. «يقال نتجت الناقة تنتج نتاجا، ونتجها أهلها» [@ibn-al-anbari، ص268]."
  - term: "فَتُتْئِمِ"
    text: "«معناه تنتج اثنين في بطن» [@ibn-al-anbari، ص269]."
context: "قلب صورة الحرب. الرحى: حجران يُطحن بينهما الحَبّ، والثفال جلد يُبسط تحتها. وقد شاعت الصورة بعد زُهَيْر، ففي لسان العرب أن عليًّا قال في الفتن: «وتدقهم الفتن دق الرحى بثفالها» [@lisan، ج11 ص85]. وهو البيت 30 عند الأَعْلَم [@diwan-zuhayr، ص19] والزَّوْزَنِيّ [@zawzani، ص143]."
syntax:
  - "«فَتَعْرُكْكُمُ» معطوف على جواب الشرط في البيت السابق، فهو مجزوم، قال البَغْدادِيّ: «معطوف على جواب الشرط»؛ ونقل قول صَعُوداء: «وإن رفعته مستانفاً كان صوابا»، ثم ردّه: «يمنعه ما بعده من الأفعال السبعة فإنها مجزومة» [@khizana، ج3 ص11]. وفي شرح ابن الأَنْبارِيّ: «وكذلك ما بعده من الأفعال المجزومة» [@ibn-al-anbari، ص269]."
  - "«عَرْكَ الرَّحَى» مفعول مطلق يبيّن نوع الفعل. والباء في «بِثِفَالِهَا» للمصاحبة: «ولم يرد كما تعرك الرحى ثفالها، وإنما أراد عرك الرحى ومعها ثفالها، أي عرك الرحى طاحنة» [@ibn-al-anbari، ص268]، ومثله عند البَغْدادِيّ: «والباء للمعيّة نحو قوله تعالى تنبت بالدهن» [@khizana، ج3 ص11]."
  - "«والكشاف منصوب على المصدر في قول الكوفيين، وقال البصريون: هو مصدر جعل في موضع الحال» [@ibn-al-anbari، ص269]."
morphology:
  - "«تُنْتَجْ» مبني للمجهول، ولا يُبنى للفاعل من الناقة «إلا في قولك أنتجت الناقة، وذلك إذا نتجت فوضعت ولدها وليس أحد يحضرها» [@ibn-al-anbari، ص269]."
  - "«تُتْئِم» من «أَتْأَمَ» على «أَفْعَلَ»: «يقال: أتأمت المرأة والشاة فهي متئم، إذا ولدت اثنين في بطن واحد. فإذا كان ذلك من عادتها قيل متآم» [@ibn-al-anbari، ص269]، والمفرد «توأم»."
  - "«كِشاف» مصدر، «ويقال ناقة كشوف وإبل كشف» [@ibn-al-anbari، ص269]."
rhetoric:
  thesis: "صورتان في بيت: رحى تطحن فلا يفلت منها شيء، وناقة لا تستريح من الحمل وتلد اثنين. الأولى للهلاك، والثانية لتكاثر الشر."
  devices:
    - title: "التمثيل"
      text: "في «فَتَعْرُكْكُمُ عَرْكَ الرَّحَى بِثِفَالِهَا» شبّه فعل الحرب بهم بطحن الرحى، والشبه ليس في شكل ولا لون، بل في حال يستخرجها الفكر: دوران متصل يسحق كل ما يقع بين الحجرين. وهذا عند عبد القاهر الجُرْجانيّ هو التمثيل، الذي يكون فيه الشبه «محصّلاً بضرب من التأوّل» [@asrar، ص90]. وقيد «بِثِفَالِهَا» يجعل الرحى في حال الطحن نفسها، لأن الثفال لا يُبسط «إلا أن تطحن» [@ibn-al-anbari، ص268]."
    - title: "الاستعارة"
      text: "في «وَتَلْقَحْ كِشَافًا ثُمَّ تُنْتَجْ فَتُتْئِمِ» لم يذكر الناقة، بل أعطى الحرب أفعالها: اللقاح والنتاج والإتآم. وهذا الضرب عند عبد القاهر أن تجعل «للشيءِ الشيءَ ليس له» [@dalail، ص67]، والغرض فيه «أن تُثبت له حكم من يكون له ذلك الشيء في فعل أو غيره، لا نفسَ ذلك الشيء»، ومثّل له بقول زُهَيْر نفسه: «وَعُرّيَ أفْراسُ الصّبا ورَوَاحِلُه» [@asrar، ص47]. وفي لسان العرب: «ولقحت الحرب كشافا على المثل»، فضرب ذلك «مثلا لشدة الحرب وامتداد أيامها» [@lisan، ج9 ص301]."
    - title: "المبالغة"
      text: "قال الزَّوْزَنِيّ: «وبالغ في وصفها باستتباع الشر شيئين: أحدهما جعله إياها لاقحة كشافًا، والآخر إتآمها» [@zawzani، ص144]. فالحرب لا تلد مرة، بل كل عام، ولا تلد واحدًا، بل اثنين."
  connection: "ويتمّ صورة الولادة في البيت التالي: ما الذي تلده الحرب؟ «غِلْمَانَ أَشْأَمَ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَتَعْرُكْ / كُمُو عَرْكَرْ / رَحَى بِ / ثِفَالِهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — وَتَلْقَحْ / كِشَافَنْ ثُمْ / مَ تُنْتَجْ / فَتُتْئِمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت ضمة الميم في «فَتَعْرُكْكُمُ». ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر فصارت «فعولُ» [@atiq، ص29]."
