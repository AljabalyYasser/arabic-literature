first: "وَمَهْمَا تَكُنْ عِنْدَ امْرِئٍ مِنْ خَلِيقَةٍ"
second: "وَلَوْ خَالَهَا تَخْفَى عَلَى النَّاسِ تُعْلَمِ"
meaning: "أيّ خُلُق يكون في الإنسان، ولو ظن أنه يخفى على الناس، فإنه سيُعلم. قال يَعْقُوب: «معناه أن الرجل سيلبس رداء عمله» [@ibn-al-anbari، ص289]. وقال الأَعْلَم: «يقول: من كتم خليقته عن الناس، وظن أنها تخفى عليهم، فلا بد أن تظهر عندهم، بما يجربون منه» [@diwan-zuhayr، ص30]. ولخّصه الزَّوْزَنِيّ: «وتحرير المعنى: أن الأخلاق لا تخفى والتخلّق لا يبقى» [@zawzani، ص151]."
vocabulary:
  - term: "مَهْمَا"
    text: "أداة شرط. «فأرادوا أن يصلوا ما بما التي يوصل بها حروف الجزاء كقولك إما، ومتى ما، فثقل عليهم أن يقولوا ماما؛ لاستواء اللفظين، فأبدلوا من الألف الأولى هاء ووصلوها بالثانية فقالوا مهما» [@ibn-al-anbari، ص289]. ونسب التِّبْرِيزِيّ هذا إلى الخليل: «مهما أصله ماما، فما الأولى للشرط، والثانية للتوكيد» [@tabrizi-ashr، ص128]."
  - term: "خَلِيقَةٍ"
    text: "طبع. قال الأَعْلَم: «الطبيعة» [@diwan-zuhayr، ص30]، وفي الشرح المنسوب إلى ثَعْلَب: «الخليقة والطبيعة والسليقة والنحيزة» بمعنى واحد [@sharh-thalab-zuhayr، ص37]."
  - term: "خَالَهَا"
    text: "«معناه ولو ظنها» [@ibn-al-anbari، ص289]."
context: "روى الأَصْفَهانيّ عن ابن الأَعْرابِيّ عن أبي زِياد الكِلابِيّ قال: «أنشد عثمان بن عفّان قول زهير»، وذكر هذا البيت، «فقال: أحسن زهير وصدق، لو أن رجلًا دخل بيتًا في جوف بيت لتحدّث به الناس»، ثم قال: «وقال النبيّ صلّى الله عليه وسلّم: لا تعمل عملًا تكره أن يُتحدّث عنك به» [@aghani-dk، ج10 ص306]. وعدّه قُدامة مثالًا على المساواة، «وهو أن يكون اللفظ مساوياً للمعنى، حتى لا يزيد عليه ولا ينقص عنه» [@naqd-al-shir، ص55]، وأنشده المُبَرِّد وقال: «فهذا مثل المثل الذي ذكرناه» [@kamil، ج2 ص228]. وهو 58 عند ابن الأَنْبارِيّ والأَعْلَم [@diwan-zuhayr، ص28] والزَّوْزَنِيّ [@zawzani، ص151]، و59 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص37]. ويزيد الزَّوْزَنِيّ بعده أربعة أبيات تختم القصيدة عنده، أولها «وَكَائِنْ تَرَى مِنْ صَامِتٍ لَكَ مُعْجِبٍ / زِيَادَتُهُ أَوْ نَقْصُهُ فِي التَّكَلُّمِ» [@zawzani، ص151–152]؛ ويذكر المحقق قَباوَة أن أولها وثانيها يُنسبان إلى الأَعْوَر الشَّنِّيّ وإلى عبد الله بن مُعاوِيَة الجَعْفَرِيّ [@diwan-zuhayr، ص29]. وليست عند ابن الأَنْبارِيّ ولا الأَعْلَم، فلم نعرضها."
syntax:
  - "«مَهْمَا» اسم شرط، و«تَكُنْ» فعل الشرط تامّ، و«تُعْلَمِ» جوابه. «والهاء والألف اسم خال، والخبر ما عاد من تخفى» [@ibn-al-anbari، ص289]، أي إن «خال» تنصب مفعولين: الضمير، وجملة «تَخْفَى»."
  - "وزعم السُّهَيْلِيّ أن «مهما» هنا حرف لا اسم، كما ينقل البَغْدادِيّ: «هي هنا: حرف بمنزلة إن بدليل أنها لا محل لها» [@khizana، ج9 ص26]؛ وعلى قوله يكون «مِنْ خَلِيقَةٍ» فاعل «تكن» و«من» زائدة."
  - "«وَلَوْ خَالَهَا» جملة معترضة، و«لو» فيها للمبالغة."
morphology:
  - "«خَلِيقَة» على «فعيلة»: «والخلق والخليقة واحد، والجمع الأخلاق والخلائق» [@zawzani، ص151]."
  - "«خَالَ» ماضي «يخال» الأجوف اليائي، بمعنى ظنّ."
  - "«تُعْلَمِ» مضارع مبني للمجهول، مجزوم وكُسر للقافية."
rhetoric:
  thesis: "الطبع يغلب التطبّع: ما يخفيه المرء من خُلُقه يظهر للناس وإن ظن أنه مستور."
  devices:
    - title: "المساواة"
      text: "المساواة عند قُدامة: أن يأتي اللفظ على قدر المعنى بلا زيادة ولا نقص [@naqd-al-shir، ص55]. فالبيت حكم كامل: شرط يعمّ كل خُلُق، واعتراض يحكي ظن صاحبه، وجواب من كلمة واحدة «تُعْلَمِ»."
    - title: "الطباق"
      text: "«تَخْفَى ... تُعْلَمِ»: جمع الخفاء والعلم في عجز واحد، وجعل آخره «تُعْلَمِ» حاسمًا."
    - title: "صدى البيت 27"
      text: "«وَمَهْمَا تَكُنْ ... تُعْلَمِ» يعيد بناء «وَمَهْمَا يُكْتَمِ اللَّهُ يَعْلَمِ» في أول الرسالة: هناك ما يُكتم عن الله يعلمه، وهنا ما يُكتم عن الناس يعلمونه. وهذه قراءتنا."
  connection: "ويختم ابن الأَنْبارِيّ القصيدة بحدود علم الإنسان: «وَأَعْلَمُ مَا فِي الْيَوْمِ وَالْأَمْسِ قَبْلَهُ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَهْمَا / تَكُنْ عِنْدَمْ / رِئِنْ مِنْ / خَلِيقَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَلَوْ خَا / لَهَا تَخْفَى / عَلَنْ نَا / سِ تُعْلَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "سقطت همزة الوصل في «امْرِئٍ» فنُطقت «عِنْدَمْرِئِنْ». ولا زحاف في حشو البيت [@atiq، ص29]."
