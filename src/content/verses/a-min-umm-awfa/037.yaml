first: "فَقَضَّوْا مَنَايَا بَيْنَهُمْ ثُمَّ أَصْدَرُوا"
second: "إِلَى كَلَإٍ مُسْتَوْبَلٍ مُتَوَخَّمِ"
meaning: "فأتمّوا بينهم آجالًا كثيرة، ثم صدروا عن الحرب إلى مرعى وبيء لا تُحمد عاقبته. وفي معنى هذا المرعى أقوال. في شرح ابن الأَنْبارِيّ: «معناه إلى أمر استوخموا عاقبته. وهذا مثل»، ثم: «يعني أنهم كانوا من أشدائهم ثم صاروا إلى اخذ دياتهم» [@ibn-al-anbari، ص274–275]، أي إن أخذ الدية بدل الثأر ثقيل على أهل البأس. وعند الزَّوْزَنِيّ: «أي: ثم أقلعوا عن القتال والقراع واشتغلوا بالاستعداد له ثانيًا» [@zawzani، ص147]. وعند الأَعْلَم: «أي: صار آخر أمرهم إلى وخامة، وفساد» [@diwan-zuhayr، ص23]."
vocabulary:
  - term: "قَضَّوْا"
    text: "«قضَيت الشيء وقضّيته: أحكمته وأتممته» [@zawzani، ص147]. وقال الأَعْلَم: «أي: أنفذوها بما بعثوا، من الحرب» [@diwan-zuhayr، ص23]."
  - term: "أَصْدَرُوا"
    text: "رجعوا عن الماء. «أصدرت: ضد أوردت» [@zawzani، ص147]."
  - term: "كَلَإٍ"
    text: "«الكلأ: العشب» [@tabrizi-ashr، ص119]."
  - term: "مُسْتَوْبَلٍ"
    text: "يقال: «كلأ وبيل وماء وبيل، إذا صار غير مريء. ومنه استوبل فعلته، أي استوخمها» [@ibn-al-anbari، ص274–275]. والمريء: الهنيء."
  - term: "مُتَوَخَّمِ"
    text: "«وتوخمه واستوخمه: لم يستمرئه ولا حمد مغبته» [@lisan، ج12 ص631]، والمغبّة: العاقبة."
context: "تمام دورة الإبل التي بدأت في البيت السابق: رعي، ثم وِرد، ثم صَدَر إلى مرعى وبيء. ويستشهد ابن الأَنْبارِيّ على أنهم كانوا أهل بأس بقول عَنْتَرَة: «إن المنية لو تُمثَّلُ مُثِّلتْ / مثلى إذا نزلوا بضنك المنزلِ» [@ibn-al-anbari، ص275]. وهو البيت 40 عند الأَعْلَم [@diwan-zuhayr، ص23] والزَّوْزَنِيّ، الذي يقول بعده: «ثم أضرب عن هذا الكلام وعاد إلى مدح الذين يعقلون القتلى ويَدُونها» [@zawzani، ص147]."
syntax:
  - "«والمنايا نصب بقضوا، والمستوبل نعت الكلأ» [@ibn-al-anbari، ص275]، و«مُتَوَخَّمِ» نعت ثانٍ. و«بَيْنَهُمْ» ظرف متعلق بـ«قَضَّوْا»."
  - "حُذف مفعول «أَصْدَرُوا»، وهو الإبل في ظاهر الصورة: «ثم أصدروا إبلهم إلى كلأ وبيل وخيم» [@zawzani، ص147]."
morphology:
  - "«قَضَّوْا» على «فَعَّلُوا»: أصله «قَضَّيُوا»، حُذفت الياء وبقيت الفتحة قبل الواو."
  - "«مُسْتَوْبَل» اسم مفعول من «اسْتَوْبَلَ» على «استفعل»: «استوبلت الشيء: وجدته وبيلًا» [@zawzani، ص147]. و«مُتَوَخَّم» اسم مفعول من «تَوَخَّمَ» على «تفعّل»."
rhetoric:
  thesis: "بعد الحرب لا راحة: صدروا عنها إلى مرعى وبيء، فالحرب تُفسد ما بعدها كما تُفسد ما فيها."
  devices:
    - title: "التمثيل"
      text: "يتم الصورة التي بدأها: الوِرد ثم الصَّدَر. قال الزَّوْزَنِيّ: «جعل استعدادهم للحرب أولًا وخوضهم غمراتها وإقلاعهم عنها زمانًا وخوضهم إياها ثانية بمنزل رعي الإبل أولًا وإيرادها وإصدارها ورعيها ثانيًا، وشبه تلك الحال بهذه الحال» [@zawzani، ص147]."
    - title: "الاستعارة"
      text: "«فَقَضَّوْا مَنَايَا بَيْنَهُمْ»: جعل الموت شيئًا يُقضى ويُتمّ كالحاجة أو الدَّين، وجعله «بينهم» فكل فريق يقضيه على الآخر."
    - title: "الترادف"
      text: "«مُسْتَوْبَلٍ مُتَوَخَّمِ» صفتان متقاربتان في المعنى، فتراكمتا على الكلأ كما تتراكم عواقب الحرب."
  connection: "ثم ينتقل إلى حُصَيْن بن ضَمْضَم، الذي جرّ على قومه بما لم يرضوه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَقَضْضَوْ / مَنَايَا بَيْ / نَهُمْ ثُمْ / مَ أَصْدَرُو = فعولن / مفاعيلن / فعولن / مفاعلن — إِلَى كَ / لَإِنْ مُسْتَوْ / بَلِنْ مُ / تَوَخْخَمِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثانية في العَجُز فصارتا «فعولُ» [@atiq، ص29]."
variants:
  - reading: "إِلَى كَلَإٍ مُسْتَوْبِلٍ مُتَوَخِّمِ"
    status: "متن الزَّوْزَنِيّ"
    note: "بكسر الباء والخاء [@zawzani، ص147]."
  - reading: "قَضَوْا مَا قَضَوْا مِنْ أَمْرِهِمْ ثُمَّ أَوْرَدُوا ... إِلَى كَلَإٍ مُسْتَوْبَلٍ مُتَوَخَّمِ"
    status: "رواية لسان العرب"
    note: "كذا أنشده ابن منظور في مادة «وخم» [@lisan، ج12 ص631]."
