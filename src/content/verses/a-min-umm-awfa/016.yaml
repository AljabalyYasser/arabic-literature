first: "سَعَى سَاعِيَا غَيْظِ بْنِ مُرَّةَ بَعْدَمَا"
second: "تَبَزَّلَ مَا بَيْنَ الْعَشِيرَةِ بِالدَّمِ"
meaning: "سعى سيّدان من بني غَيْظ بن مُرّة في الصلح، بعد أن تشقّق ما كان بين القبيلة من صلح وقرابة بالدماء المسفوكة، فأصلحاه. قال الأَصْمَعِيّ: «كان بينهم صلح فشقق بالدم. تبزل. تشقق وتفطر، فسعى ساعيا غيظ بن مرة فأصلحاه» [@ibn-al-anbari، ص252]."
vocabulary:
  - term: "سَعَى سَاعِيَا"
    text: "«قال الأصمعي: سعى ساعيا، معناه عملا عملا حسنا» [@ibn-al-anbari، ص252]. وعند الأَعْلَم: «حين مشيا بالصلح، وتحمّلا الديات» [@diwan-zuhayr، ص15]."
  - term: "غَيْظِ بْنِ مُرَّةَ"
    text: "قال أبو عُبَيْدة: «غيظ بن مرة بن عوف بن سعد بن ذبيان بن بغيض» [@ibn-al-anbari، ص253]. وعند الأَعْلَم: «حيّ من غطفان ثم من بني ذبيان» [@diwan-zuhayr، ص15]."
  - term: "تَبَزَّلَ"
    text: "«تشقق وتفطر»، «ومنه بزول البعير بنابه؛ لأنه يتفطر موضعه» [@ibn-al-anbari، ص252–253]. وفي لسان العرب: «بَزَل الشيءَ يَبْزُلُهُ بَزْلًا وبَزَّلَهُ فَتَبَزَّل: شَقَّه. وتَبَزَّل الْجَسَدُ: تَفَطَّر بِالدَّمِ» [@lisan، ج11 ص52]."
  - term: "الْعَشِيرَةِ"
    text: "القبيلة وذوو القرابة، والمراد عبس وذبيان، وهما أخوان ابنا بغيض [@khizana، ج3 ص7]."
syntax:
  - "«سَعَى» فعل ماض، و«سَاعِيَا» فاعله، مثنى حُذفت نونه للإضافة إلى «غَيْظِ»، ووُحّد الفعل لأن الفاعل اسم ظاهر."
  - "«بَعْدَمَا»: «ما» مصدرية، والمصدر المؤوّل من «مَا تَبَزَّلَ» مضاف إليه، أي: بعد تبزُّل ما بين العشيرة."
  - "«مَا» في «مَا بَيْنَ الْعَشِيرَةِ» اسم موصول فاعل «تَبَزَّلَ»، و«بَيْنَ الْعَشِيرَةِ» صلته، و«بِالدَّمِ» متعلق بـ«تَبَزَّلَ»."
morphology:
  - "«تَبَزَّلَ» على «تَفَعَّلَ» مطاوع «بَزَّلَ»، «ومنه قيل المبزل والبزال» [@ibn-al-anbari، ص253]."
  - "«سَاعِيَا» مثنى «ساعٍ» اسم فاعل من «سَعَى»، وأصله «ساعِيانِ»."
  - "«البَزْلاء»: الرأي الجيد، من الجذر نفسه، «لأنها قد انتجعت وبزلت» [@ibn-al-anbari، ص253]."
rhetoric:
  thesis: "بيت التخلّص: من النساء والرحيل إلى السيدين اللذين سدّا الصدع. والتخلّص: انتقال الشاعر من غرض إلى غرض."
  devices:
    - title: "الاستعارة والتمثيل"
      text: "في «تَبَزَّلَ مَا بَيْنَ الْعَشِيرَةِ بِالدَّمِ» جعل الصلح بين القبيلتين شيئًا يتشقّق كما يتشقّق الجلد أو السقاء. والاستعارة عند عبد القاهر أن تريد تشبيه الشيء بالشيء «فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وسمّاه التِّبْرِيزِيّ تمثيلًا: «ومعنى (تبزل) تشقق، وهذا تمثيل» [@tabrizi-ashr، ص111]. والتمثيل عند عبد القاهر تشبيه أخصّ، «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]، وهو ما يُنتزع فيه الشبه من هيئة: هنا هيئة شيء متماسك يتفطّر حين يسيل منه الدم."
    - title: "الجناس"
      text: "في «سَعَى سَاعِيَا» لفظان من جذر واحد، فهو جناس اشتقاق. والتكرار يجعل السعي صفة لهما وعملًا معًا. وهذه قراءتنا."
    - title: "التخلّص المفاجئ"
      text: "لا يمهّد الشاعر للانتقال: يقف البيت 15 عند النساء، ويبدأ هذا البيت بالمدح. والفعل الماضي «سَعَى» في أوله يجعل المدح خبرًا عن عمل وقع، لا وصفًا لصفات."
  connection: "ثم يقسم بالكعبة على مدح السيدين [@ibn-al-anbari، ص253]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "سَعَى سَا / عِيَا غَيْظِبْ / نِ مُرْرَ / ةَ بَعْدَمَا = فعولن / مفاعيلن / فعولُ / مفاعلن — تَبَزْزَ / لَ مَا بَيْنَلْ / عَشِيرَ / ةِ بِدْدَمِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» الثالثة من الصدر، والأولى والثالثة من العجز [@atiq، ص29]. وهمزة الوصل في «ابْنِ» تسقط في النطق."
context: "أول المدح، وأول مقطع «سعى ساعيا» والقسم (16–18). وهو أول بيت فيه غرض القصيدة: صلح عبس وذبيان. وليس هذا البيت في رواية الزَّوْزَنِيّ، وفيها يتلو «فأقسمت بالبيت» بيتَ «ظهرن من السوبان» [@zawzani، ص138–139]. ويختلف الرواة في الساعيين: هما عند الأَعْلَم «الحارث بن عوف وهرم بن سنان. وقيل: خارجة بن سنان» [@diwan-zuhayr، ص15]، ومثله في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص23] وعند التِّبْرِيزِيّ [@tabrizi-ashr، ص111]؛ وقال أبو عُبَيْدة: «وعنى بالساعيين خارجة بن سنان بن أبي حارثة بن مرة بن نشبة بن غيظ بن مرة، والآخر الحارث بن عوف بن أبي حارثة» [@ibn-al-anbari، ص253]. وفي جمهرة أشعار العرب قبله بيت ليس عند ابن الأَنْبارِيّ: «تُذَكّرُني الأحلامَ لَيْلَى وَمَنْ تُطِفْ ... عَلَيْهِ خَيَالاَتُ الأحِبَّةِ يَحْلُمِ» [@jamhara، ص160]."
