first: "تَدَارَكْتُمَا عَبْسًا وَذُبْيَانَ بَعْدَمَا"
second: "تَفَانَوْا وَدَقُّوا بَيْنَهُمْ عِطْرَ مَنْشِمِ"
meaning: "أدركتما عبسًا وذبيان بالصلح بعد أن أفنى بعضهم بعضًا، وبعد أن صاروا في الحرب كالذين تطيّبوا بعطر مَنْشِم فهلكوا جميعًا. قال الأَعْلَم: «أي: تداركتماهما بالصلح، بعد ما تفانوا بالحرب» [@diwan-zuhayr، ص15]."
vocabulary:
  - term: "تَدَارَكْتُمَا"
    text: "«التدارك: التلافي، أي تداركتما أمرهما» [@zawzani، ص139]، أي أصلحتماه قبل أن يفوت."
  - term: "تَفَانَوْا"
    text: "«التفاني: التشارك في الفناء» [@zawzani، ص139]، أي أفنى بعضهم بعضًا."
  - term: "دَقُّوا"
    text: "في لسان العرب: «ودَقَّ الشيءَ يدُقُّه إِذَا أَظْهَرَهُ؛ وَمِنْهُ قَوْلُ زُهَيْرٍ: ودَقُّوا بَيْنَهُمْ عِطْرَ مَنْشِمِ أَيْ أَظهروا العُيوب والعَداوات» [@lisan، ج10 ص102]. ويُفهم أيضًا على ظاهره: سحقوا العطر وتطيّبوا به."
  - term: "عِطْرَ مَنْشِمِ"
    text: "مثل في الشؤم والحرب، واختلفوا في أصله. قال الأَصْمَعِيّ إنهم تحالفوا «في عطرها على أن يقاتلوا حتى يموتوا»، وقال أبو عَمْرو بن العَلاء: «عطر منشم إنما هو من التنشيم في الشر»، وقال أبو عُبَيْدة: «منشم اسم وضع لشدة الحرب، وليس ثم امرأة»، وقال أبو عَمْرو الشَّيْبانيّ: «منشم امرأة من خزاعة كانت تبيع عطرا بمكة، فإذا حاربوا اشتروا منها كافورا لموتاهم؛ فتشأموا بها»، وقال ابن الكَلْبيّ: «منشم امرأة الوجيه الحميري» [@ibn-al-anbari، ص261]. وفي لسان العرب أنها «امرأَة عَطَّارَةٌ مِنْ هَمْدان كَانُوا إِذَا تطيَّبوا مِنْ رِيحِهَا اشتدَّت الْحَرْبُ فَصَارَتْ مَثَلًا فِي الشَّرِّ» [@lisan، ج12 ص577]."
syntax:
  - "«وعبسا منصوب بتداركتما، وأجرى لأنه اسم لرجل لا علة فيه تمنعه الإجراء. وذبيان لا يجري لأن فيه ألفا ونونا زائدتين» [@ibn-al-anbari، ص261]. والإجراء: الصرف."
  - "«بَعْدَمَا»: «ما» مصدرية، والمصدر المؤوّل مضاف إليه: بعد تفانيهم."
  - "«وَدَقُّوا» معطوف على «تَفَانَوْا»، و«بَيْنَهُمْ» ظرف متعلق به، و«عِطْرَ» مفعول به."
morphology:
  - "«تَفَانَوْا» على «تَفاعَلُوا» من الفناء، وهي صيغة المشاركة؛ أصله «تَفانَيُوا»، حُذفت الياء لالتقاء الساكنين بعد قلبها ألفًا."
  - "«ذُبْيَان» يقال بضم الذال وكسرها، قال التِّبْرِيزِيّ: «والضم اكثر، والأصل ذِبَّان، فأبدل من الباء ياء» [@tabrizi-ashr، ص114]."
  - "«مَنْشِم» على «مَفْعِل»، ممنوع من الصرف للعلمية والتأنيث، وكُسر هنا للقافية."
rhetoric:
  thesis: "الحرب في البيت فناء متبادل، والصلح تدارك في آخر لحظة. والمثل الذي يختم البيت يجعل الحرب الأخيرة كحروب الشؤم المعروفة عند العرب."
  devices:
    - title: "المثل"
      text: "في «دَقُّوا بَيْنَهُمْ عِطْرَ مَنْشِمِ» استعمل زُهَيْر مثلًا سائرًا. قال الأَعْلَم في خبر المتحالفين: «فضرب زهير بها المثل، أي صار هؤلاء، في شدّة الأمر، بمنزلة أولئك» [@diwan-zuhayr، ص15]. فالشاعر لا يصف القتال، بل يحيل إلى قصة يعرفها السامع فيفهم منها نهاية من قاتلوا حتى ماتوا."
    - title: "الكناية"
      text: "على تفسير لسان العرب يكون «دَقُّوا ... عِطْرَ مَنْشِمِ» كناية عن إظهار العداوات [@lisan، ج10 ص102]؛ وعلى تفسير الزَّوْزَنِيّ كناية عن الفناء: «أي بعد إتيان القتال على آخرهم كما أتى على آخر المتعطرين بعطر منشم» [@zawzani، ص140]. والكناية عند عبد القاهر أن يُذكر المعنى بما «هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الطباق بين الفناء والتدارك"
      text: "في الصدر «تَدَارَكْتُمَا» وفي العجز «تَفَانَوْا»: إنقاذ في مقابل هلاك. فالسيدان يقفان في الموضع الذي يفترق فيه الطريقان. وهذه قراءتنا."
  connection: "ثم يذكر ما قالاه حين سعيا: إن أدركنا الصلح ببذل المال والمعروف سلمنا [@ibn-al-anbari، ص262]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "تَدَارَكْ / تُمَا عَبْسَنْ / وَذُبْيَا / نَ بَعْدَمَا = فعولن / مفاعيلن / فعولن / مفاعلن — تَفَانَوْ / وَدَقْقُو بَيْ / نَهُمْ عِطْ / رَ مَنْشِمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "التفعيلات تامة إلا العروض والضرب [@atiq، ص29]. والواو في «تَفَانَوْا» ساكنة بعد فتح، فهي مقطع طويل مع النون."
context: "أول أبيات مدح السيدين (19–22)، وفيه يُسمّي القبيلتين لأول مرة. وعبس وذبيان «أخوان وهما ابنا بغيض بن ريث بن غطفان» [@khizana، ج3 ص7]، وحربهما حرب داحِس والغَبْراء."
variants:
  - reading: "تَفَانَوْا وَبَقَّوْا بَيْنَهُمْ عِطْرَ مَنْشِمِ"
    status: "في نسخة ابن الأَنْبارِيّ في المكتبة الشاملة"
    note: "وبعده في شرحه: «في أخرى: (ودقوا)، وكذا الخزاعي: (ودقوا)» [@ibn-al-anbari، ص261]. واعتمدنا «وَدَقُّوا» لأنها رواية الأَعْلَم [@diwan-zuhayr، ص15] والزَّوْزَنِيّ [@zawzani، ص139] والتِّبْرِيزِيّ، وهو ينقل شرح ابن الأَنْبارِيّ في هذا البيت [@tabrizi-ashr، ص112]، ولأن شرح ابن الأَنْبارِيّ لا يفسّر «بَقَّوْا»، ولأن «دَقّ منشم» لفظ سائر في الشعر [@lisan، ج12 ص577]."
  - reading: "عِطْرَ مَنْشَمِ"
    status: "رواية الجمهرة"
    note: "بفتح الشين [@jamhara، ص161]. وفي لسان العرب عن ابن الكَلْبيّ: «مَنْ قَالَ مَنْشِم، بِكَسْرِ الشِّينِ، فَهِيَ مَنْشِم بِنْتُ الوَجيه مِنْ حِمْير»، «وَمَنْ قَالَ مَنْشَم، بِفَتْحِ الشِّينِ، فَهِيَ امرأَة كَانَتْ تَنْتجع العربَ تبيعُهم عِطرها» [@lisan، ج12 ص577]."
