first: "فَلَا تَكْتُمُنَّ اللَّهَ مَا فِي صُدُورِكُمْ"
second: "لِيَخْفَى وَمَهْمَا يُكْتَمِ اللَّهُ يَعْلَمِ"
meaning: "لا تُخفوا عن الله ما في صدوركم لعله يخفى عليه، فما يُكتم عن الله يعلمه. وفي المكتوم قولان. ففي شرح ابن الأَنْبارِيّ: «لا تكتموا الله تعالى ما صرتم إليه من الصلح وتقولوا إنا لم نكن نحتاج إلى الصلح وأنا لم نسترخ من الحرب؛ فإن الله جل وعلا يعلم من ذلك ما تكتمونه» [@ibn-al-anbari، ص266]، ونحوه عند الأَعْلَم [@diwan-zuhayr، ص18]. وقال أبو جَعْفَر: «معنى البيت لا تظهروا الصلح وفي أنفسكم أن تغدروا» [@ibn-al-anbari، ص266]، وعليه الزَّوْزَنِيّ: «لا تخفوا من الله ما تضمرون من الغدر ونقض العهد ليخفى على الله» [@zawzani، ص142]."
vocabulary:
  - term: "تَكْتُمُنَّ"
    text: "تُخفُنّ. «يقال كتمت الأمر كتمة وكتمانا، إذا لم تظهره» [@ibn-al-anbari، ص266]. ومن الأصل نفسه قول الأَصْمَعِيّ: «ناقة كتوم، إذا كانت لا ترغو» [@ibn-al-anbari، ص266]."
  - term: "لِيَخْفَى"
    text: "ليستتر. «يقال خفي الشيء يخفى، إذا استتر؛ وأخفيته، إذا سترته؛ وخفيته، إذا أظهرته» [@ibn-al-anbari، ص266]."
  - term: "مَهْمَا"
    text: "أداة شرط بمعنى «ما»، أي: أيُّ شيء [@ibn-al-anbari، ص289]."
context: "يرى شوقي ضيف أن زُهَيْرًا «كان وثنيّا، مثله مثل قومه»، ويلاحظ «عنده بعض أبيات يؤمن فيها باليوم الآخر وما فيه من حساب وعقاب وثواب»، ويستشهد بهذا البيت والذي بعده، ثم يقول: «وإذا صحت نسبة البيتين إليه كان ذلك دليلا على أنه أحد من تحنفوا فى الجاهلية وشكوا فى دينهم الوثنى»، ويستدرك: «وأغلب الظن أنه لم يفارق دين قومه، إنما هى خطرات كانت تمر به» [@deif، ج1 ص303]. ومعنى التحنّف: الميل إلى الحنيفية، دين إبراهيم، وترك عبادة الأوثان. وأبو جَعْفَر يربط البيت بالحادثة نفسها، فالمعنى عنده لا تغدروا «كما فعل حصين بن ضمضم إذ قتل ورد بن حابس بعد الصلح» [@ibn-al-anbari، ص266]؛ فالتحذير هنا يمهّد لقصة حُصَيْن (38–43). وهو البيت 26 عند الأَعْلَم [@diwan-zuhayr، ص18] والزَّوْزَنِيّ [@zawzani، ص142]."
syntax:
  - "«وموضع تكتمن جزم على النهى، والنون دخلت للتوكيد، وما نصب بوقوع الفعل عليها، ويخفى نصب بلام كي» [@ibn-al-anbari، ص266]. و«يُكْتَمِ» مجزوم بـ«مهما»، و«يَعْلَمِ» جوابها."
  - "«كتم» يتعدى إلى مفعولين: كتمتُ زيدًا الحديثَ. فـ«اللهَ» المفعول الأول و«ما» الثاني. وفي «يُكْتَمِ اللهُ» بُني الفعل للمجهول فصار اسم الجلالة نائب فاعل، قال الزَّوْزَنِيّ: «وقوله: يكتم الله، أي يكتم من الله» [@zawzani، ص142]. وقال البَغْدادِيّ: «ويكتم: بالبناء للمفعول بخلاف يعلم فإنه للفاعل» [@khizana، ج3 ص10]."
  - "كُسرت ميم «يُكْتَمِ» لالتقاء الساكنين، وكُسرت ميم «يَعْلَمِ» للقافية، وكلاهما مجزوم."
morphology:
  - "«تَكْتُمُنَّ» أصلها «تكتمونَ»، حُذفت نون الرفع للجزم بـ«لا» الناهية، ثم دخلت نون التوكيد الثقيلة فحُذفت واو الجماعة لالتقاء الساكنين، وبقيت الضمة قبلها دليلًا عليها."
  - "«خَفِيَ» و«خَفَيْتُ» من الأضداد، أي ما يدل على الشيء وضده: الأول بمعنى استتر، والثاني بمعنى أظهر [@ibn-al-anbari، ص266]."
rhetoric:
  thesis: "الصلح لا يكفي أن يُعلن؛ فالله يعلم ما تخفيه الصدور. فزُهَيْر يردّ الأمر من الأيمان الظاهرة إلى النيات."
  devices:
    - title: "التذييل"
      text: "«وَمَهْمَا يُكْتَمِ اللَّهُ يَعْلَمِ»: ختم النهي بجملة عامة تؤكد معناه، وهذا هو التذييل. والجملة تستقل بنفسها، فتصلح أن تُقال في كل كتمان."
    - title: "إظهار الاسم موضع الضمير"
      text: "كرر اسم الجلالة: «فَلَا تَكْتُمُنَّ اللَّهَ ... يُكْتَمِ اللَّهُ»، وكان يكفيه الضمير في الثانية. فبقي ذكر الله ظاهرًا في الشطرين، وهو موضع التهديد. وهذه قراءتنا."
    - title: "توكيد النهي"
      text: "«فَلَا تَكْتُمُنَّ»: أكد النهي بالنون الثقيلة، فاشتد التحذير."
  connection: "ثم يفصّل عاقبة الكتمان: حساب مؤجَّل أو عقاب معجَّل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَلَا تَكْ / تُمُنْنَلْ لَا / هَ مَا فِي / صُدُورِكُمْ = فعولن / مفاعيلن / فعولن / مفاعلن — لِيَخْفَى / وَمَهْمَا يُكْ / تَمِلْ لَا / هُ يَعْلَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "لا زحاف في حشو البيت، والعَرُوض والضرب مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
