first: "وَمَنْ لَا يَذُدْ عَنْ حَوْضِهِ بِسِلَاحِهِ"
second: "يُهَدَّمْ وَمَنْ لَا يَظْلِمِ النَّاسَ يُظْلَمِ"
meaning: "من لم يدفع الناس عن حوضه بسلاحه هُدم حوضه، ومن كفّ عن الناس ظلموه. قال الأَصْمَعِيّ: «من ملأ حوضه ثم لم يمنع منه غُشى وهُدم، وهو تمثيل، أي من لأن للناس ظلموه واستضاموه» [@tabrizi-ashr، ص127]. وقال الأَعْلَم: «وإنما يريد: من لم يدفع عن قومه انتهكت حرمته، وأذل» [@diwan-zuhayr، ص27]. وفي شرح ابن الأَنْبارِيّ: «وقوله (ومن لا يظلم الناس يظلم) معناه من كف عن الناس ظلموه وركبوه» [@ibn-al-anbari، ص286]."
vocabulary:
  - term: "يَذُدْ"
    text: "«يذد: يدفع. يقال ذدت الإبل فأنا أذودها ذودا وذيادا عن الحوض، إذا نحيتها عنه» [@ibn-al-anbari، ص285]."
  - term: "حَوْضِهِ"
    text: "مجتمع الماء الذي تُسقى منه الإبل، والمراد حُرمته وقومه: «واستعار الحوض للحريم» [@zawzani، ص151]."
  - term: "يُهَدَّمْ"
    text: "يُهدم حوضه، أي تُنتهك حرمته [@diwan-zuhayr، ص27]."
context: "حكمة من حياة الصحراء، حيث الماء أعزّ ما يُحمى. والشطر الثاني يردّد خُلُق الأسد في البيت 43: «وَإِلَّا يُبْدَ بِالظُّلْمِ يَظْلِمِ». وهو 53 عند ابن الأَنْبارِيّ والأَعْلَم [@diwan-zuhayr، ص27]، و54 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص35]، و56 عند الزَّوْزَنِيّ [@zawzani، ص151]، وهو عند التِّبْرِيزِيّ بعد «ومن يغترب» كما عند ابن الأَنْبارِيّ [@tabrizi-ashr، ص127]."
syntax:
  - "«وموضع يذد جزم بمن وعلامة الجزم فيه سكون الدال، والواو سقطت لاجتماع الساكنين، ومن مرفوعة بما عاد من يذد، ويهدم جواب الجزاء» [@ibn-al-anbari، ص286]."
  - "«يَظْلِمِ» مجزوم بـ«من»، كُسرت ميمه لالتقاء الساكنين، و«يُظْلَمِ» جوابه."
morphology:
  - "«يَذُدْ» من «ذاد يذود» الأجوف الواوي: حُذفت الواو في الجزم لالتقاء الساكنين [@ibn-al-anbari، ص286]."
  - "«يُهَدَّم» على «يُفَعَّل» للتكثير، أي يُهدم هدمًا شديدًا."
  - "«السلاح» يُذكّر ويؤنّث، كما نقل ابن الأَنْبارِيّ عن الفراء [@ibn-al-anbari، ص286]."
rhetoric:
  thesis: "في عالم زُهَيْر لا يحمي المرءَ إلا سلاحه: من لم يدافع استُبيح، ومن لم يُخِف الناس ظُلم."
  devices:
    - title: "التمثيل"
      text: "في «وَمَنْ لَا يَذُدْ عَنْ حَوْضِهِ بِسِلَاحِهِ يُهَدَّمْ» صورة من حياة الماء: حوض لا يُذاد عنه يُغشى ويُهدم. والمراد كل حرمة لا تُحمى. قال الأَصْمَعِيّ: «وهو تمثيل» [@tabrizi-ashr، ص127]، وقال الزَّوْزَنِيّ: «واستعار الحوض للحريم» [@zawzani، ص151]."
    - title: "الطباق"
      text: "«لَا يَظْلِمِ ... يُظْلَمِ»: الفعل مبنيًّا للمعلوم منفيًّا، ثم مبنيًّا للمجهول مثبتًا. فمن ترك الظلم وقع عليه. والحكمة هنا وصف لعالم قاسٍ، لا دعوة إلى الظلم. وهذه قراءتنا."
  connection: "ثم يجعل المداراة شرط السلامة: «وَمَنْ لَمْ يُصَانِعْ فِي أُمُورٍ كَثِيرَةٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ لَا / يَذُدْ عَنْ حَوْ / ضِهِي بِ / سِلَاحِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — يُهَدْدَمْ / وَمَنْ لَا يَظْ / لِمِنْ نَا / سَ يُظْلَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت كسرة الهاء في «حَوْضِهِ». ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر [@atiq، ص29]."
