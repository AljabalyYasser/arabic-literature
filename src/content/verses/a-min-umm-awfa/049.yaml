first: "وَمَنْ يَبْغِ أَطْرَافَ الرِّمَاحِ يَنَلْنَهُ"
second: "وَلَوْ رَامَ أَنْ يَرْقَى السَّمَاءَ بِسُلَّمِ"
meaning: "من طلب أطراف الرماح، أي تعرّض للحرب، أصابته، ولو حاول أن يصعد إلى السماء بسُلّم. في شرح ابن الأَنْبارِيّ: «فيقول: من تعرض للرماح نالته» [@ibn-al-anbari، ص283]. وعلى رواية «ومن هاب أسباب المنايا» يكون المعنى، كما يقول الزَّوْزَنِيّ: «ومن خاف وهاب أسباب المنايا نالته، ولم يُجْدِ عليه خوفه وهيبته إياها نفعًا ولو رام الصعود إلى السماء فرارًا منها» [@zawzani، ص150]."
vocabulary:
  - term: "يَبْغِ"
    text: "يطلب. «يقال: بغيت الشيء فأنا أبغيه بغية وبغاء» [@ibn-al-anbari، ص283]."
  - term: "رَامَ"
    text: "«(رام) : حاول» [@ibn-al-anbari، ص283]."
  - term: "يَرْقَى"
    text: "يصعد. «ويقال: رقى في الدرجة والسلم يرقى رُقياً ورِقياً» [@ibn-al-anbari، ص283]."
  - term: "سُلَّمِ"
    text: "ما يُصعد عليه، «والسلم يذكر ويؤنث» [@ibn-al-anbari، ص283]."
context: "للبيت روايتان كبيرتان: «ومن يبغ أطراف الرماح» في متن ابن الأَنْبارِيّ، وهي رواية أبي عَمْرو في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص35]؛ و«ومن هاب أسباب المنايا» رواية أبي جَعْفَر [@ibn-al-anbari، ص283] ومتن التِّبْرِيزِيّ [@tabrizi-ashr، ص125]، ومثلها عند الأَعْلَم برواية الأَصْمَعِيّ «ومن هاب أسباب المنية يلقها» [@diwan-zuhayr، ص27]. وعلى الثانية يصح عجز البيت تمامًا: الهارب لو صعد إلى السماء لأدركه الموت، واستشهد التِّبْرِيزِيّ لهذا المعنى بقوله تعالى: {قُلْ إِنَّ الْمَوْتَ الَّذِي تَفِرُّونَ مِنْهُ فَإِنَّهُ مُلَاقِيكُمْ} [@tabrizi-ashr، ص125]. وهو 49 عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ، و54 عند الأَعْلَم [@diwan-zuhayr، ص27]، و55 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص35]، و53 عند الزَّوْزَنِيّ [@zawzani، ص150]."
syntax:
  - "«ومن مرفوعة بما في يبغ، ويبغ مجزوم بمن، وينلنه جواب الجزاء، ويرقى نصب بأن» [@ibn-al-anbari، ص283]."
  - "النون في «يَنَلْنَهُ» ضمير جماعة الإناث، يعود على «أطراف الرماح»، والهاء مفعول به."
  - "«وَلَوْ» وصلية، تأتي للمبالغة: يناله ذلك في كل حال، حتى في أبعدها."
morphology:
  - "«يَبْغِ» مضارع «بغى» مجزوم بحذف الياء."
  - "«يَنَلْنَ» من «نال ينال» الأجوف: حُذفت الألف لالتقاء الساكنين حين سكنت اللام لاتصالها بنون النسوة."
  - "«سُلَّم» على «فُعَّل»."
rhetoric:
  thesis: "لا نجاة لمن تعرّض للحرب، ولا لمن هرب من الموت: الطرف الذي يُطلب، أو السبب الذي يُخشى، يصل إلى صاحبه أينما كان."
  devices:
    - title: "المبالغة بالمستحيل"
      text: "«وَلَوْ رَامَ أَنْ يَرْقَى السَّمَاءَ بِسُلَّمِ»: فرض أمرًا لا يكون، ليثبت أن الحكم لا يتخلف حتى فيه."
    - title: "الاستعارة"
      text: "في «يَنَلْنَهُ» جعل أطراف الرماح كأنها تقصد صاحبها وتلحقه، فهي فاعلة تطلب."
    - title: "التكرار بين بيتين"
      text: "«أَطْرَافَ الزِّجَاجِ» (47) و«أَطْرَافَ الرِّمَاحِ» هنا: الطرف الأسفل للسلم، والطرف الأعلى لمن طلب الحرب. فالبيتان يكمل أحدهما الآخر على رواية ابن الأَنْبارِيّ. وهذه قراءتنا."
  connection: "ثم ينتقل من الحرب إلى المال: «وَمَنْ يَكُ ذَا فَضْلٍ فَيَبْخَلْ بِفَضْلِهِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ يَبْ / غِ أَطْرَافَرْ / رِمَاحِ / يَنَلْنَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — وَلَوْ رَا / مَ أَنْ يَرْقَسْ / سَمَاءَ / بِسُلْلَمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الشطرين [@atiq، ص29]."
