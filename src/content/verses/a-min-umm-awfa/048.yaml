first: "وَمَنْ يُوفِ لَا يُذْمَمْ وَمَنْ يُفْضِ قَلْبُهُ"
second: "إِلَى مُطْمَئِنِّ الْبِرِّ لَا يَتَجَمْجَمِ"
meaning: "من وفى بعهده لم يُذمّ، ومن انتهى قلبه إلى برّ ثابت لم يتردد. في شرح ابن الأَنْبارِيّ: «يقول: من كان في صدره بر قد اطمأن وسكن، ليس ببر يرجف ولم يطمئن، لم يتجمجم وأمضى كل أمر على جهته، وليس كمن غدرا فهو يتردد في أمره ويتثنى» [@ibn-al-anbari، ص282]. وقال أبو الهَيْثَم فيما ينقله ابن منظور: «أي من يصر قلبه إلى فضاء من البر ليس دونه ستر لم يشتبه أمره عليه فيتجمجم أي يتردد فيه» [@lisan، ج15 ص157]."
vocabulary:
  - term: "يُوفِ"
    text: "يفي بعهده. «يقال: وفى الرجل يفي، وأوفى يوفي» [@ibn-al-anbari، ص282]."
  - term: "يُفْضِ"
    text: "يصل وينتهي. قال الأَعْلَم: «يتصل. يقال: أفضى الشيء إلى الشيء، إذا اتصل به» [@diwan-zuhayr، ص28]."
  - term: "مُطْمَئِنِّ الْبِرِّ"
    text: "البرّ الثابت الخالص. «ومطمئن البر: خالصه» [@tabrizi-ashr، ص125]، و«(البر) : الصلاح» [@ibn-al-anbari، ص282]."
  - term: "يَتَجَمْجَمِ"
    text: "يتردد ويُخفي ما في نفسه. قال الأَعْلَم: «ترك التقدم في الأمر، والتردد فيه» [@diwan-zuhayr، ص28]. وفي لسان العرب: «وجمجم في صدره شيئا: أخفاه ولم يبده» [@lisan، ج12 ص109]."
context: "بعد الصلح يأتي الوفاء به. والبيت يقابل صورة الغادر في قصة حُصَيْن، وابن الأَنْبارِيّ نفسه يقابل بينهما: «وليس كمن غدرا فهو يتردد في أمره» [@ibn-al-anbari، ص282]. ويختلف موضعه: هو 48 عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ [@tabrizi-ashr، ص125]، و56 عند الأَعْلَم [@diwan-zuhayr، ص27]، و57 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص36]، و52 عند الزَّوْزَنِيّ [@zawzani، ص150]."
syntax:
  - "«وموضع من رفع بما عاد من يوف، ويوف جزم بمن علامة الجزم فيه سقوط الياء، ويذمم جواب الجزاء» [@ibn-al-anbari، ص282]."
  - "دخلت «لا» بين الشرط وجوابه ولم تمنع الجزم، قال التِّبْرِيزِيّ: «ولم تفصل لا بين الشرط وجوابه كما لم تفصل بين النعت والمنعوت في قولك: مررت برجل لا جالس ولا قائم» [@tabrizi-ashr، ص125]."
  - "«والقلب رفع بيفض، ويتجمجم جواب الجزاء» [@ibn-al-anbari، ص282]. و«مُطْمَئِنِّ الْبِرِّ» من إضافة الصفة إلى الموصوف، أي: البرّ المطمئن، كما فسّره الأَعْلَم: «أي: إلى البر، المطمئن في القلب، الثابت به» [@diwan-zuhayr، ص28]."
morphology:
  - "«يُوفِ» و«يُفْضِ» مضارعان من «أَوْفَى» و«أَفْضَى» على «أَفْعَل»، جُزما بحذف الياء."
  - "«يُذْمَمْ» فُكّ فيه الإدغام في الجزم، وهي لغة أهل الحجاز."
  - "«يَتَجَمْجَم» على «يَتَفَعْلَل» من الرباعي المضعّف «جَمْجَمَ»، وأصله في الكلام: «أن لا يبين كلامه من غير عي» [@lisan، ج12 ص109]."
rhetoric:
  thesis: "الوفيّ لا يُذمّ، وصاحب البرّ الثابت يمضي بلا تردد؛ والغادر وحده يتجمجم."
  devices:
    - title: "المقابلة مع صورة الغادر"
      text: "«لَا يَتَجَمْجَمِ» هي الكلمة نفسها التي رُوي بها وصف حُصَيْن: «فَلَا هُوَ أَبْدَاهَا وَلَمْ يَتَجَمْجَمِ» (39). فالغادر يطوي كشحه على سرّه، والوفيّ لا سرّ له يتردد فيه. وهذه قراءتنا."
    - title: "الاستعارة"
      text: "في «يُفْضِ قَلْبُهُ إِلَى مُطْمَئِنِّ الْبِرِّ» جعل البرّ مكانًا يصل إليه القلب ويستقر، وجعل له طمأنينة، وهي صفة النفس. وتفسير أبي الهَيْثَم يوضح الصورة: «فضاء من البر ليس دونه ستر» [@lisan، ج15 ص157]."
    - title: "الإيجاز"
      text: "في البيت شرطان وجوابان، كل واحد منهما حكمة تامة، في سطر واحد."
  connection: "ثم يقرر أن التعرض للرماح لا نجاة منه: «وَمَنْ يَبْغِ أَطْرَافَ الرِّمَاحِ يَنَلْنَهُ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ يُو / فِ لَا يُذْمَمْ / وَمَنْ يُفْ / ضِ قَلْبُهُو = فعولن / مفاعيلن / فعولن / مفاعلن — إِلَى مُطْ / مَئِنْنِلْ بِرْ / رِ لَا يَ / تَجَمْجَمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في العَجُز [@atiq، ص29]."
variants:
