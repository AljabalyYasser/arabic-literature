first: "يُنَجِّمُهَا قَوْمٌ لِقَوْمٍ غَرَامَةً"
second: "وَلَمْ يُهَرِيقُوا بَيْنَهُمْ مِلْءَ مِحْجَمِ"
meaning: "يؤدّي الديات أقساطًا قومٌ إلى قوم، غرامةً تحمّلوها، وهم لم يسفكوا في تلك الحروب من الدم ما يملأ كأس الحجّام. قال الأَعْلَم: «يعني أنّ هذين الساعيين حملا دماء من قُتل، وغرم فيها قوم من رهطهما، على أنهم لم يصبّوا ملء محجم من دم. أي: أعطوا فيها ولم يقتلوا» [@diwan-zuhayr، ص17]."
vocabulary:
  - term: "غَرَامَةً"
    text: "ما يلزم أداؤه من مال. قال ابن الأَنْبارِيّ: «يقول: لم يكن لهم في تلك الحروب ذنب ولاهراقوا فيها دما، ولكنهم حملوها» [@ibn-al-anbari، ص265]."
  - term: "يُهَرِيقُوا"
    text: "يريقوا، أي يسفكوا. في لسان العرب: «الْهَاءُ فِي ذَلِكَ كُلِّهِ مُتَحَرِّكَةٌ لأَنها لَيْسَتْ بأَصلية إِنَّمَا هِيَ بَدَلٌ مِنَ هَمْزَةِ أَراق» [@lisan، ج10 ص365]."
  - term: "مِلْءَ"
    text: "«والمِلء، بكسر الميم الاسم، وهو ما يأخذه الإناء الممتلئ من الشراب» [@ibn-al-anbari، ص265]، أما «المَلء» بالفتح فالمصدر."
  - term: "مِحْجَمِ"
    text: "«المحجم: آلة الحجام، والجمع المحاجم» [@zawzani، ص141]، وهي الكأس الصغيرة التي يُمصّ بها الدم. وفي لسان العرب: «والمِحْجَمُ والمِحْجَمَةُ: مَا يُحْجَم بِهِ. قَالَ الأَزهري: المحْجَمَةُ قارُورَتُهُ» [@lisan، ج12 ص117]."
syntax:
  - "«والقوم يرتفعون بفعلهم، والغرامة تنتصب على المصدر، والملء ينتصب بوقوع الفعل عليه» [@ibn-al-anbari، ص265]: «قَوْمٌ» فاعل «يُنَجِّمُ»، و«غَرَامَةً» مفعول مطلق من المعنى، و«مِلْءَ» مفعول به لـ«يُهَرِيقُوا»."
  - "«لِقَوْمٍ» متعلق بـ«يُنَجِّمُ»: يؤدّيها قوم إلى قوم."
  - "الواو في «وَلَمْ» واو الحال، والجملة حال من «قَوْمٌ»: يؤدّونها وهم لم يريقوا دمًا."
morphology:
  - "«يُهَرِيقُوا» أصله «يُرِيقُوا»؛ والهاء بدل من الهمزة: «وأصل يهريق يؤروق، فأبدلوا من الهمزة هاء فصار يهروق، واستثقلوا الكسرة في الواو فألقوها على الراء، وصارت الواو ياء لانكسار ما قبلها» [@ibn-al-anbari، ص265]. وقال البَغْدادِيّ: «ويهريقوا: أصله يريقوا وزيدت الهاء المفتوحة» [@khizana، ج3 ص9]."
  - "في الفعل ثلاث لغات: «أراق الماء والدم يريقه وهراقه يهريقه وأهراقه يهريقه لغات، والأصل اللغة الأولى» [@zawzani، ص141]."
  - "«مِحْجَم» اسم آلة على «مِفْعَل» من «حَجَمَ»."
rhetoric:
  thesis: "خاتمة الكلام في الديات: من يدفع لم يقتل، ومن يأخذ لم يُعطَ بقتال. وأصغر مقدار من الدم هو مقياس البراءة."
  devices:
    - title: "المبالغة بالتقليل"
      text: "في «مِلْءَ مِحْجَمِ» اختار أصغر وعاء للدم: كأس الحجّام. فنفي هذا القدر نفي لكل قدر. وهذا من الكناية عن البراءة التامة: لا يقول «لم يقتلوا»، بل يقول إنهم لم يريقوا حتى هذا القليل. وقد يكون في ذكر المحجم إشارة إلى أن الدم الوحيد الذي يعرفونه دم الحجامة، دم العلاج لا دم القتل. وهذه قراءتنا."
    - title: "التكرار للتفسير"
      text: "أعاد «يُنَجِّمُهَا» من البيت السابق ليفسّره. قال التِّبْرِيزِيّ: «وهذا البيت تفسير الذي قبله» [@tabrizi-ashr، ص114]. فالبيت الأول قال «مَنْ لَيْسَ فِيهَا بِمُجْرِمِ»، والثاني فصّل: قوم يؤدّونها وما أراقوا دمًا."
    - title: "التقابل في «قَوْمٌ لِقَوْمٍ»"
      text: "اللفظ واحد والطرفان مختلفان: قوم يدفعون وقوم يأخذون. فالصلح يجمعهما في عبارة واحدة كما جمعتهما الحرب."
  connection: "بهذا البيت يتمّ خبر الصلح والديات، وبعده يبدأ خطابًا جديدًا إلى الأحلاف وذبيان: «أَلَا أَبْلِغِ الْأَحْلَافَ عَنِّي رِسَالَةً» [@ibn-al-anbari، ص265]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يُنَجْجِ / مُهَا قَوْمُنْ / لِقَوْمِنْ / غَرَامَتَنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — وَلَمْ يُ / هَرِيقُو بَيْ / نَهُمْ مِلْ / ءَ مِحْجَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الأولى في الشطرين [@atiq، ص29]. والهاء في «يُهَرِيقُوا» متحركة، فهي تزيد مقطعًا على «يُرِيقُوا»، وبها يستقيم الوزن."
context: "آخر أبيات الديات المنجّمة (23–25)، وآخر ما نقرؤه في المرحلة الثانية من المسار. وفي رواية الأَعْلَم بيت آخر يتكرر فيه شطر قريب: «تُسَاقُ إِلَى قَوْمٍ لِقَوْمٍ غَرَامَةً ... صَحِيحَاتِ مَالٍ طَالِعَاتٍ بِمَخْرَمِ»، وهو البيت 44 عنده [@diwan-zuhayr، ص24]، وليس عند ابن الأَنْبارِيّ."
variants:
  - reading: "عَلَى أَنَّهُمْ لَمْ يُصِيبُوا فِي ذَلِكَ مِلْءَ مِحْجَمٍ"
    status: "في شرح الأَعْلَم، لا في البيت"
    note: "يذكر المحقق قباوة أن في نسخة من شرح الأَعْلَم: «على أنهم لم يصيبوا في ذلك ملء محجم» [@diwan-zuhayr، ص17]، وهي عبارة الشارح لا لفظ زُهَيْر."
