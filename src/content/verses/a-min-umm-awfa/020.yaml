first: "وَقَدْ قُلْتُمَا إِنْ نُدْرِكِ السِّلْمَ وَاسِعًا"
second: "بِمَالٍ وَمَعْرُوفٍ مِنَ الْقَوْلِ نَسْلَمِ"
meaning: "وقد قلتما حين سعيتما: إن أدركنا الصلح ممكنًا، بما نبذل من المال ونقول من الكلام الحسن، سلمنا من الحرب. قال ابن الأَنْبارِيّ: «وقوله (واسعا) معناه ممكن. يقول: نبذل فيها الأموال ونحث عليها» [@ibn-al-anbari، ص262]."
vocabulary:
  - term: "السِّلْمَ"
    text: "«السِّلْم والسَّلْم: الصلح؛ وهو يذكر ويؤنث» [@ibn-al-anbari، ص262]."
  - term: "وَاسِعًا"
    text: "ممكنًا [@ibn-al-anbari، ص262]. وعند الأَعْلَم: «أي: ممكناً» [@diwan-zuhayr، ص16]."
  - term: "مَعْرُوفٍ"
    text: "الإحسان والكلام الحسن. وعند الزَّوْزَنِيّ: «ببذل المال وإسداء معروف من الخير» [@zawzani، ص140]."
  - term: "نَسْلَمِ"
    text: "«أي: نسلم من أمر الحرب. وقال الأصمعي: نسلم أي: لا نركب، من الأمر، مالا يحِلّ» [@diwan-zuhayr، ص16]."
syntax:
  - "«وموضع واسع نصب على الحال من السلم، والباء صلة ندرك، وموضع نسلم جزم على جواب الجزاء» [@ibn-al-anbari، ص262]. أي: «إِنْ» شرطية، و«نُدْرِكِ» فعل الشرط مجزوم وكُسر لالتقاء الساكنين، و«نَسْلَمِ» جوابه مجزوم وكُسر للقافية."
  - "جملة الشرط وجوابه في محل نصب مقول القول لـ«قُلْتُمَا»، والواو في «وَقَدْ» للحال أو للعطف على «تَدَارَكْتُمَا»."
  - "جاء «وَاسِعًا» مذكّرًا لأن السلم يذكّر ويؤنّث، وهو هنا مذكّر كما يقول البَغْدادِيّ [@khizana، ج3 ص8]."
morphology:
  - "«السِّلْم» بكسر السين وفتحها لغتان [@ibn-al-anbari، ص262]، والتأنيث فيه على معنى المصالحة."
  - "«وَاسِع» اسم فاعل من «وَسِعَ»، استُعمل هنا بمعنى الممكن."
  - "«مَعْرُوف» اسم مفعول من «عَرَفَ»، صار اسمًا للإحسان."
rhetoric:
  thesis: "يحكي الشاعر كلام السيدين يوم الصلح: عزمٌ مشروط بالبذل. فالمدح هنا بقولهما لا بوصفه هو."
  devices:
    - title: "حكاية القول"
      text: "في «وَقَدْ قُلْتُمَا» يضع الشاعر كلام الممدوحين في شعره كأنه يرويه. وبهذا يصير قرارهما شاهدًا على كرمهما: لم يُطلب منهما البذل، بل عرضاه. وهذه قراءتنا."
    - title: "المجاز في «وَاسِعًا»"
      text: "وصف الصلح بالسعة، والسعة صفة للمكان، وأراد الإمكان: «معناه ممكن» [@ibn-al-anbari، ص262]. فالصلح الواسع طريق يمكن السير فيه، والحرب ضيق. واستشهد ابن الأَنْبارِيّ ببيت فيه الصورة نفسها: «فلا تضيقَنَّ أن السلم واسعةٌ ... مَلْساءُ ليس بها وعْثٌ ولا ضِيقُ» [@ibn-al-anbari، ص262]."
    - title: "المال والقول"
      text: "في «بِمَالٍ وَمَعْرُوفٍ مِنَ الْقَوْلِ» جمع البذل والكلام الحسن. فالصلح عندهما لا يتمّ بالديات وحدها، بل بالكلمة التي تطيّب النفوس."
  connection: "ثم يقول إنهما أصبحا من هذا الصلح على خير منزلة، بعيدين عن قطيعة الرحم والإثم [@ibn-al-anbari، ص262]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَقَدْ قُلْ / تُمَا إِنْ نُدْ / رِكِسْسِلْ / مَ وَاسِعَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — بِمَالِنْ / وَمَعْرُوفِنْ / مِنَلْقَوْ / لِ نَسْلَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "التفعيلات تامة إلا العروض والضرب [@atiq، ص29]. وكُسرت الكاف في «نُدْرِكِ» لالتقاء الساكنين."
context: "الثاني من أبيات مدح السيدين (19–22): بعد ذكر ما فعلا يذكر ما قالا."
