first: "بَكَرْنَ بُكُورًا وَاسْتَحَرْنَ بِسُحْرَةٍ"
second: "فَهُنَّ وَوَادِي الرَّسِّ كَالْيَدِ فِي الْفَمِ"
meaning: "ابتدأت الظعائن السير في أول النهار، وسرن في السحر، وهنّ يقصدن وادي الرَّسّ قصدًا لا يخطئنه، كما تقصد اليد الفم فلا تخطئه. قال يعقوب: «معناه يقصدن لهذا الوادي فلا يجزنه كما لا تجوز اليد إذا قصدت للفم ولا تخطئه» [@ibn-al-anbari، ص250]."
vocabulary:
  - term: "بَكَرْنَ بُكُورًا"
    text: "سرن بُكرة، أي أول النهار. «يقال بكرت في الحاجة، وأبكرت، وبكرت خفيف» [@ibn-al-anbari، ص250]."
  - term: "اسْتَحَرْنَ بِسُحْرَةٍ"
    text: "«استحر: سار سحرًا» [@zawzani، ص137]. «ويقال: خرجنا بسحرة، أي في السحر» [@ibn-al-anbari، ص250]. وعند الأَعْلَم أن السُّحْرة «السَّحَر الأعلى» [@diwan-zuhayr، ص12]، أي أوّل السحر. والسحر: آخر الليل قبل الفجر."
  - term: "الرَّسِّ"
    text: "«ماء ونخل لبني أسد، والرسيس حذاءه» [@ibn-al-anbari، ص250]. وأصل الرسّ عند الأَعْلَم «البئر. وهو هنا موضع بعينه، كأنه سُمّي باسم بئر فيه» [@diwan-zuhayr، ص12]. وفي لسان العرب: «والرّسُّ: الْبِئْرُ الْقَدِيمَةُ أَو المَعْدِنُ» [@lisan، ج6 ص98]."
syntax:
  - "«بُكُورًا» مفعول مطلق مؤكّد لـ«بَكَرْنَ»، و«بِسُحْرَةٍ» الباء فيه بمعنى «في» للظرفية."
  - "«هُنَّ» مبتدأ، و«وَادِي الرَّسِّ» معطوف عليه، و«كَالْيَدِ فِي الْفَمِ» خبر: هنّ والوادي كاليد والفم. فالتشبيه بين زوج وزوج."
  - "على رواية «فهنّ لوادي الرس» تكون اللام متعلقة بمعنى القصد: هنّ قاصدات لوادي الرس، و«كَالْيَدِ لِلْفَمِ» خبر [@diwan-zuhayr، ص12]."
morphology:
  - "«بُكُور» مصدر «بَكَرَ» على «فُعُول». ويقال أيضًا: «ابتكرت في الحاجة أبتكر ابتكارا» [@ibn-al-anbari، ص250]."
  - "«اسْتَحَرْنَ» على «اسْتَفْعَلَ» من السَّحَر، أي سرن في السحر. و«سُحْرة» عند الزَّوْزَنِيّ «اسم للسحر، ولا تصرف سحرة وسحر إذا عنيتهما من يومك الذي أنت فيه، وإن عنيت سحرًا من الأسحار صرفتهما» [@zawzani، ص137]؛ وصُرفت هنا لأنه أراد سحرًا من الأسحار."
  - "«الفم» فيه لغات، منها أن «تضم الفاء في موضع الرفع وتفتح في موضع النصب وتكسر في موضع الخفض، فيكون معربا من جهتين» [@ibn-al-anbari، ص250]، أي بحركة الفاء وحركة الميم معًا."
rhetoric:
  thesis: "سير الظعائن يُرى في يوم واحد من البكور إلى السحر، ثم يُختصر في صورة واحدة: يد تمضي إلى الفم."
  devices:
    - title: "التشبيه في الحركة"
      text: "في «كَالْيَدِ فِي الْفَمِ» شبّه قصد الظعائن الوادي بقصد اليد الفم: حركة لا تتردد ولا تخطئ. وهذا من التشبيه الذي يقول فيه عبد القاهر: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]. فالمشبّه به حركة يعرفها كل أحد، وبها يفهم السامع ثقة الظعائن بطريقهن."
    - title: "اختلاف في وجه الشبه"
      text: "وجه الشبه عند يعقوب القصد دون مجاوزة [@ibn-al-anbari، ص250]. أما أبو جَعْفَر فيقول: «كاليد للفم، أي دخلن فيه كما تدخل اليد في الفم، ولم يرد القصد» [@ibn-al-anbari، ص250]. فعلى قوله الصورة صورة الدخول في الوادي، لا الاتجاه إليه."
    - title: "الزمن"
      text: "في «بَكَرْنَ ... وَاسْتَحَرْنَ» ذكر وقتين: أول النهار وآخر الليل. وقد يكون المراد تكرار السير يومًا بعد يوم. وهذه قراءتنا."
  connection: "ثم يصل بهن إلى الماء: وردنه صافيًا فأقمن عنده [@ibn-al-anbari، ص251]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "بَكَرْنَ / بُكُورَنْ وَسْ / تَحَرْنَ / بِسُحْرَتِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — فَهُنْنَ / وَوَادِرْرَسْ / سِ كَلْيَ / دِ فِلْفَمِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» الأولى والثالثة في الشطرين، فصارت «فعولُ» [@atiq، ص29]. وهمزة الوصل في «وَاسْتَحَرْنَ» تسقط في النطق."
context: "خاتمة الطريق قبل الوصول إلى الماء. وموضع البيت عند الأَعْلَم العاشر، قبل «جعلن القنان» [@diwan-zuhayr، ص12]، وعند الزَّوْزَنِيّ الحادي عشر [@zawzani، ص137]."
variants:
  - reading: "فَهُنَّ لِوَادِي الرَّسِّ كَالْيَدِ لِلْفَمِ"
    status: "رواية الأَعْلَم، وهي عند التِّبْرِيزِيّ رواية أخرى"
    note: "«وروى الأصمعي: (كاليد للفم)» [@ibn-al-anbari، ص250]. وبها يروي الأَعْلَم [@diwan-zuhayr، ص12]، ويذكرها التِّبْرِيزِيّ: «ويروى (فهن لوادي الرس كاليد للفم)» [@tabrizi-ashr، ص109]. وعند الزَّوْزَنِيّ «فَهُنّ وَوَادِي الرَّسِّ كاليَدِ لِلفَمِ» [@zawzani، ص137]."
  - reading: "بَكَرْنَ بُكُورًا وَادَّلَجْنَ بِسُحْرَةٍ"
    status: "رواية المُبَرِّد"
    note: "يستشهد به المُبَرِّد على «ادّلج»: «تقول: أدلجت، إذا سرت في أول الليل. وادلجت، إذا سرت من آخره في السحر. قال زهير» [@kamil، ج3 ص66–67]."
