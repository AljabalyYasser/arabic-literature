first: "وَأَعْلَمُ مَا فِي الْيَوْمِ وَالْأَمْسِ قَبْلَهُ"
second: "وَلَكِنَّنِي عَنْ عِلْمِ مَا فِي غَدٍ عَمِي"
meaning: "أعلم ما في يومي وما كان بالأمس قبله، لكني لا أبصر ما في غد. قال الأَعْلَم: «يقول: أعلم ما في يومي لأني مشاهده، وأعلم ما كان بالأمس لأني عهدته، وأما علم ما في غد فلا يعلمه إلا الله، لأنه من الغيب» [@diwan-zuhayr، ص26]. وقال الزَّوْزَنِيّ: «وقد يحيط علمي بما مضى وما حضر، ولكني عميُّ القلب عن الإحاطة بما هو منتظر متوقع» [@zawzani، ص149]."
vocabulary:
  - term: "عَمِي"
    text: "«معناه غبي عنه جاهل. يقال رجل أعمى القلب وعمى القلب» [@ibn-al-anbari، ص289]. وفي لسان العرب: «ورجل عم في أمره: لا يبصره، ورجل أعمى في البصر»، ثم: «ومثله قول زهير» [@lisan، ج15 ص96]."
  - term: "الْأَمْسِ"
    text: "اليوم الذي قبل يومك. «والأمس نسق على اليوم» [@ibn-al-anbari، ص289]."
  - term: "غَدٍ"
    text: "اليوم الذي بعد يومك. «والأصل في (غد) غدو، فحذفت الواو وعربت الدال» [@ibn-al-anbari، ص290]."
context: "خاتمة القصيدة عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ [@tabrizi-ashr، ص128–129]؛ قال ابن الأَنْبارِيّ بعده: «تمت قصيدة زهير بغريبها، وهي تسعة وخمسون بيتا» [@ibn-al-anbari، ص290]. أما الأَعْلَم فالبيت عنده 49، بعد «سئمت» و«رأيت» [@diwan-zuhayr، ص25]، وهو 50 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص35]، و47 عند الزَّوْزَنِيّ بين «سئمت» و«رأيت» [@zawzani، ص149]. فتختم القصيدة عند ابن الأَنْبارِيّ بحدود علم الإنسان، وعند الأَعْلَم والشرح المنسوب إلى ثَعْلَب ببيت أبي زَيْد (51)، وعند الزَّوْزَنِيّ بـ«سألنا فأعطيتم». ويرى شوقي ضيف في قافيته شاهدًا على براعة زُهَيْر: «فقد وصل إلى القافية، فوجد نفسه مضيّقا عليه، ولم يلبث أن نفذ إلى كلمة»، ثم «فتمم البيت فى غير عسر ولا مشقة» [@deif، ج1 ص328]."
syntax:
  - "«وسبيل أمس أن يكون مكسورا إذا كان معرفة لا ألف ولا لام فيه، كقولك: مضى أمس ورأيته أمس. فإذا دخلت عليه الألف واللام عرب بوجوه … الإعراب» [@ibn-al-anbari، ص289–290]؛ فـ«الْأَمْسِ» هنا مجرور بالكسرة عطفًا على «الْيَوْمِ»."
  - "«قَبْلَهُ» ظرف في موضع الحال من «الأمس». و«عَمِي» خبر «لكنّ»، وأصله «عَمٍ» اسم منقوص حُذفت ياؤه مع التنوين، فظهرت في القافية."
  - "«عَنْ عِلْمِ» متعلق بـ«عَمٍ»."
morphology:
  - "«عَمٍ» صفة مشبهة على «فَعِل» من «عَمِيَ»، للأعمى في أمره، و«أعمى» للأعمى في بصره [@lisan، ج15 ص96]."
  - "«غَد» محذوف اللام، وأصله «غَدْو» [@ibn-al-anbari، ص290]."
  - "«أَعْلَمُ» مضارع للمتكلم، ومعناه الاستمرار."
rhetoric:
  thesis: "بعد سلسلة من الأحكام يعترف الحكيم بحدّ علمه: الماضي والحاضر في يده، والغد مغلق دونه."
  devices:
    - title: "التقسيم"
      text: "قسم الزمن ثلاثة: «الْيَوْمِ» و«الْأَمْسِ» و«غَدٍ»، وجعل الأولين في العلم والثالث في العمى. فاستوفى أقسام الزمن، والاستدراك بـ«لكنّ» يفصل بين ما يُعلم وما لا يُعلم."
    - title: "حسن المقطع"
      text: "جعل العَسْكَرِيّ البيت مثالًا لجودة الفاصلة، وهو الضرب الذي «يضيّق على الشاعر موضع القافية، فيأتى بلفظ قصير قليل الحروف فيتمم به البيت» [@sinaatayn، ص445]. فكلمة «عَمِي» قصيرة، وجاءت في موضعها تامة المعنى."
    - title: "الاستعارة"
      text: "في «عَمِي» جعل الجهل بالغد عمى، فالمستقبل شيء لا يُرى. والعرب تفرق بين «أعمى» في البصر و«عمٍ» في الأمر [@lisan، ج15 ص96]، فاختار اللفظ الذي يدل على عمى القلب."
  connection: "وبه تنتهي القصيدة عند ابن الأَنْبارِيّ."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَأَعْلَ / مُ مَا فِلْ يَوْ / مِ وَلْ أَمْ / سِ قَبْلَهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — وَلَاكِنْ / نَنِي عَنْ عِلْ / مِ مَا فِي / غَدِنْ عَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "«عَمٍ» اسم منقوص، ظهرت ياؤه في القافية فنُطقت «عَمِي». ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر [@atiq، ص29]."
