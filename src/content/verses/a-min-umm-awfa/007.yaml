first: "تَبَصَّرْ خَلِيلِي هَلْ تَرَى مِنْ ظَعَائِنٍ"
second: "تَحَمَّلْنَ بِالْعَلْيَاءِ مِنْ فَوْقِ جُرْثُمِ"
meaning: "انظر يا صاحبي: هل ترى نساءً في هوادجهن ارتحلن من الأرض المرتفعة فوق ماء جُرْثُم؟ قال أبو جَعْفَر: «معناه إنه هو شغل بالبكاء فقال لخليله: تبصر أنت، لأني أنا مشغول بالبكاء عن النظر» [@ibn-al-anbari، ص244]."
vocabulary:
  - term: "ظَعَائِنٍ"
    text: "قال يعقوب: «الظعائن: النساء في الهوادج، واحدتها ظعينة. ويقال للمرأة وهي في بيتها ظعينة» [@ibn-al-anbari، ص245]. وفي لسان العرب: «والظَّعِينة: الهَوْدج تَكُونُ فِيهِ المرأَة، وَقِيلَ: هُوَ الْهَوْدَجُ، كَانَتْ فِيهِ أَو لَمْ تَكُنْ» [@lisan، ج13 ص271]. والهودج: مركب من خشب يُغطّى بالثياب وتركب فيه المرأة على البعير."
  - term: "تَحَمَّلْنَ"
    text: "ارتحلن، وفسّرها الأَعْلَم بقوله: «رحلن» [@diwan-zuhayr، ص12]."
  - term: "الْعَلْيَاءِ"
    text: "«ما ارتفع من الأرض» [@ibn-al-anbari، ص245]. وعند الأَعْلَم: «بلد» [@diwan-zuhayr، ص12]."
  - term: "جُرْثُمِ"
    text: "«وقال الأصمعي: جرثم: ماءة من مياه بني أسد» [@ibn-al-anbari، ص245]."
syntax:
  - "«تَبَصَّرْ» فعل أمر، و«خَلِيلِي» منادى بحذف الأداة، و«هَلْ تَرَى» استفهام في موضع نصب بـ«تَبَصَّرْ»، علّق الفعلَ عن العمل."
  - "«مِنْ» في «مِنْ ظَعَائِنٍ» زائدة عند الأَصْمَعِيّ: «من في قول (من ظعائن) زائدة»، «يريد إنها زائدة للتوكيد، ويحتمل أن تكون غير زائدة وتكون للتبعيض» [@tabrizi-ashr، ص106–107]. فـ«ظَعَائِنٍ» على الأول مفعول به لـ«تَرَى» في المعنى."
  - "«وتحملن صلة الظعائن» [@ibn-al-anbari، ص245]، أي جملة صفة لها."
morphology:
  - "«ظَعَائِن» جمع «ظَعِينة» على «فَعائِل»، وهي ممنوعة من الصرف، ونُوّنت هنا للضرورة: «وأجرى الظعائن لضرورة الشعر. قال الفراء والكسائي: الشعراء تجرى في أشعارها كل ما لا يجري» [@ibn-al-anbari، ص245]. والإجراء في اصطلاح الكوفيين: الصرف والتنوين."
  - "«تَبَصَّرْ» على «تَفَعَّلْ»: النظر بتأمّل. و«الظِّعان»: «النسعة التي يشد بها الهودج» [@ibn-al-anbari، ص245]، من الجذر نفسه."
  - "«العَلْياء» تأنيث «الأعلى»، اسم للمكان المرتفع."
rhetoric:
  thesis: "يتحوّل الشاعر من الدار الخالية إلى مشهد الرحيل، ويسلّم النظر إلى صاحبه، فالرحلة تُرى بعين غيره."
  devices:
    - title: "خطاب الصاحب"
      text: "في «تَبَصَّرْ خَلِيلِي» يطلب الشاعر من صاحبه أن ينظر عنه. وعلّله أبو جَعْفَر بأنه مشغول بالبكاء، وقرنه بقول امرئ القيس «أعنّي على برق أريك وميضه» [@ibn-al-anbari، ص244]. فالشاعر يُشرك صاحبه في المشهد، ويخفي ضعفه وراء الطلب."
    - title: "المستحيل الذي يُطلب"
      text: "يرى الزَّوْزَنِيّ في السؤال وجدًا بلغ حدّ المحال: «يريد أن الوجد برّح به والصبابة ألَحّت عليه حتى ظن المحال لفرط ولهه؛ لأن كونهن بحيث يراهن خليله بعد مضي عشرين سنة محال» [@zawzani، ص136]. فالظعائن صورة من الذاكرة لا من العين."
    - title: "الاستفهام"
      text: "«هَلْ تَرَى» استفهام يحمل الرجاء، لا يطلب خبرًا. وبه يدخل الشاعر في وصف الرحلة كأنها تجري الآن."
  connection: "ثم يتبع طريق الظعائن: جعلن جبل القَنان عن أيمانهن [@ibn-al-anbari، ص245]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "تَبَصْصَرْ / خَلِيلِي هَلْ / تَرَى مِنْ / ظَعَائِنِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — تَحَمْمَلْ / نَ بِلْعَلْيَا / ءِ مِنْ فَوْ / قِ جُرْثُمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "صُرفت «ظَعَائِنٍ» للضرورة، ولو لم تُنوّن لنقص المقطع الأخير من العروض [@ibn-al-anbari، ص245]. وسائر التفعيلات تامة."
context: "أول مقطع الظعائن (7–15). وهو انتقال معروف في القصيدة الجاهلية من الدار إلى رحيل أهلها، يصف فيه الشاعر طريقهن ومراكبهن ومنزلهن."
