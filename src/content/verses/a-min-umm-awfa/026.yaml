first: "أَلَا أَبْلِغِ الْأَحْلَافَ عَنِّي رِسَالَةً"
second: "وَذُبْيَانَ هَلْ أَقْسَمْتُمُ كُلَّ مُقْسَمِ"
meaning: "أبلِغْ عني الأحلافَ وذُبْيانَ رسالةً: هل حلفتم كل يمين؟ وللشراح في السؤال وجهان. فالزَّوْزَنِيّ يجعله تذكيرًا بأيمانهم على الصلح: «يقول: أبلغ ذبيان وحلفاءها وقل لهم: قد حلفتم على إبرام حبل الصلح كل حلف فتحرجوا من الحنث وتجنبوا» [@zawzani، ص142]. والأَعْلَم يجعله توبيخًا: «أي: حلفتم كل الحلف، لتفعلن ما لا ينبغي» [@diwan-zuhayr، ص18]، ومثله عند التِّبْرِيزِيّ [@tabrizi-ashr، ص114–115]."
vocabulary:
  - term: "الْأَحْلَافَ"
    text: "«أسد وغطفان، الواحد حلف. يقال فلان حلف بني فلان، إذا حالفوه أن يمنعوه مما يمنعون منه أنفسهم وأن يكون معهم يدا على غيرهم» [@ibn-al-anbari، ص265]. وفي لسان العرب: «والأحلاف الذين في شعر زهير هم: أسد وغطفان لأنهم تحالفوا على التناصر» [@lisan، ج9 ص54]. ويزيد الأَعْلَم طَيِّئًا: «أسد وغطفان وطيِّئ» [@diwan-zuhayr، ص18]."
  - term: "ذُبْيَانَ"
    text: "قبيلة من غَطَفان، منها بنو مُرَّة رهطُ السيدين، وكانت الحرب بينها وبين عَبْس [@ibn-al-anbari، ص236]. «ويقال: ذُبيان وذِبيان، والضم اكثر» [@tabrizi-ashr، ص114]."
  - term: "أَقْسَمْتُمُ ... مُقْسَمِ"
    text: "حلفتم. «ويقال أقسمت في اليمين فأنا أقسم إقساما ومقسما. والمقسمة: الموضع الذي يحلف فيه» [@ibn-al-anbari، ص265]."
context: "أول المقطع الثاني من القصيدة. تمّت في البيت 25 قصة الديات المنجّمة، ويبدأ هنا خطاب جديد إلى القبائل التي اصطلحت بعد حرب عَبْس وذُبْيان [@ibn-al-anbari، ص236]: رسالة تذكّرها بأيمانها، ثم تحذّرها من الغدر، وتصف لها الحرب إن عادت. وهو البيت 25 عند الأَعْلَم [@diwan-zuhayr، ص17] وعند الزَّوْزَنِيّ [@zawzani، ص142]، لأن كلًّا منهما يُسقط بيتًا من المقطع الأول."
syntax:
  - "«ألا افتتاح للكلام. والرسالة مفعول ثان، وكل مقسم منصوب على المصدر» [@ibn-al-anbari، ص265]. فـ«الأحلافَ» المفعول الأول، و«ذُبْيانَ» معطوف عليه، وقد فصلت بينهما «عَنِّي رِسَالَةً»."
  - "«هَلْ» عند الزَّوْزَنِيّ بمعنى «قد»: «هل أقسمتم أي قد أقسمتم، ومنه قوله تعالى: {هَلْ أَتَى عَلَى الإِنسَان} … أي قد أتى» [@zawzani، ص142]. وعلى قول الأَعْلَم والتِّبْرِيزِيّ هي استفهام باقٍ على معناه، فيه لوم."
  - "جملة «هَلْ أَقْسَمْتُمُ كُلَّ مُقْسَمِ» هي نص الرسالة، فهي بدل من «رِسَالَةً» أو بيان لها."
morphology:
  - "«الأحلاف» جمع «حِلْف» عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص265]، وعند الزَّوْزَنِيّ جمع «حليف»، «كما جمع نجيب على أنجاب، وشريف على أشراف» [@zawzani، ص142]."
  - "«مُقْسَم» مصدر ميمي من «أَقْسَمَ» على وزن اسم المفعول، ومثله يأتي اسمَ مكان [@ibn-al-anbari، ص265]؛ وهو هنا مصدر."
  - "«ذُبْيان»: «والأصل ذِبَّان، فأبدل من الباء ياء، كما قالوا تقصيت» [@tabrizi-ashr، ص114]."
rhetoric:
  thesis: "ينتقل زُهَيْر من مدح السيدين إلى مخاطبة القبائل نفسها: يرسل إليها رسالة، أولها تذكير بالأيمان التي أقسمتها."
  devices:
    - title: "حكاية الرسالة بلفظها"
      text: "في «أَبْلِغِ ... رِسَالَةً ... هَلْ أَقْسَمْتُمُ» يبدأ بأمر الرسول، ثم ينقل نص الرسالة كما تُقال، فيخاطب القبائل خطابًا مباشرًا. فيصير الكلام كأنه حديث إليهم لا عنهم. وهذه قراءتنا."
    - title: "الاستفهام"
      text: "«هَلْ أَقْسَمْتُمُ» سؤال لا يطلب جوابًا: هو عند الزَّوْزَنِيّ تقرير، أي إثبات لأمر يعرفونه: قد حلفتم فلا تحنثوا [@zawzani، ص142]، وعند الأَعْلَم لوم لهم على أيمان حلفوها في غير موضعها [@diwan-zuhayr، ص18]."
    - title: "التوكيد بالمصدر"
      text: "«كُلَّ مُقْسَمِ»: لم يقل «أقسمتم» وحدها، بل أضاف «كل» إلى المصدر، فجعل أيمانهم كل يمين ممكنة. فإذا كانت الأيمان بهذا القدر، كان نقضها أشد."
  connection: "ثم يحذّرهم أن يُضمروا خلاف ما أظهروا: «فَلَا تَكْتُمُنَّ اللَّهَ مَا فِي صُدُورِكُمْ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَلَا أَبْ / لِغِلْ أَحْلَا / فَ عَنْنِي / رِسَالَتَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَذُبْيَا / نَ هَلْ أَقْسَمْ / تُمُو كُلْ / لَ مُقْسَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت ضمة الميم في «أَقْسَمْتُمُ» فنُطقت «تُمُو»، وهو جائز في ميم الجمع. ولا زحاف في البيت، والعَرُوض والضرب «مفاعلن» مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
variants:
  - reading: "فَمَنْ مُبْلِغُ الْأَحْلَافِ عَنِّي رِسَالَةً"
    status: "رواية الأَصْمَعِيّ"
    note: "قال التِّبْرِيزِيّ: «وروى الأصمعي (فمن مبلغ الأحلاف عنى) يريد مبلغ الأحلاف، على أن يحذف التنوين لالتقاء الساكنين» [@tabrizi-ashr، ص115]، وبها جاء البيت في شعر زُهَيْر برواية الأَعْلَم [@diwan-zuhayr، ص17]."
