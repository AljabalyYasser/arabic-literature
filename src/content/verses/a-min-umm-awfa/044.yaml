first: "لَعَمْرُكَ مَا جَرَّتْ عَلَيْهِمْ رِمَاحُهُمْ"
second: "دَمَ ابْنِ نَهِيكٍ أَوْ قَتِيلِ الْمُثَلَّمِ"
meaning: "وحياتك، ما جنت رماح هؤلاء الذين يؤدون الديات دمَ ابن نَهِيك ولا دم قتيل المُثَلَّم. ففي شرح ابن الأَنْبارِيّ: «يقول: ما حملوا دم ابن نهيك ودم ابن المهزم، لأن رماحهم كانت جرت جريرته، ولكنهم تبرعوا بذلك ليصلح ما بين عشيرتهم» [@ibn-al-anbari، ص279]. وقال الأَعْلَم: «يقول: هؤلاء الذين يدون القتلى لم تجر عليهم رماحهم دماءهم» [@diwan-zuhayr، ص23]."
vocabulary:
  - term: "جَرَّتْ"
    text: "جنت، «من الجريرة» [@ibn-al-anbari، ص279]."
  - term: "ابْنِ نَهِيكٍ ... قَتِيلِ الْمُثَلَّمِ"
    text: "قتيلان من عَبْس؛ قال الأَعْلَم في أسماء هذا البيت والذي بعده: «كلهم من عبس» [@diwan-zuhayr، ص23]. ويقول المحقق قَباوَة في حاشيته: «المثلم: اسم موضع» [@diwan-zuhayr، ص23]، فيكون القتيل منسوبًا إلى موضع قتله."
context: "أول مقطع البراءة (44–46): الذين حملوا الديات لم يقتلوا أحدًا. وهو يردّد ما قاله في البيت 25: «وَلَمْ يُهَرِيقُوا بَيْنَهُمْ مِلْءَ مِحْجَمِ»، وقد ربط الأَعْلَم بينهما، فقال بعد شرح هذا البيت: «وهذا كقوله»، وذكر صدر البيت 25 [@diwan-zuhayr، ص23]. ولأبي جَعْفَر قول آخر في هؤلاء القتلى: «المعنى أن هؤلاء قتلوا قبل هذه الحرب، فلما شملهم هذه الحروب أدخلوا كل قتيل كان لهم في هذه الحرب فطالبوا بهم حمالات وقودا حتى اصطلحوا» [@ibn-al-anbari، ص279]؛ والحمالات: الديات يتحملها غير القاتل، والقَوَد: القصاص. وهو البيت 41 عند الأَعْلَم [@diwan-zuhayr، ص23] والزَّوْزَنِيّ [@zawzani، ص147]."
syntax:
  - "«والعمر يرتفع على القسم، وما جرَّت جواب القسم، والرماح رفع بجرَّت، والدم منصوب به» [@ibn-al-anbari، ص279]. فـ«لَعَمْرُكَ» مبتدأ خبره محذوف، أي: لعمرك قسمي."
  - "«أَوْ قَتِيلِ» معطوف على «ابْنِ نَهِيكٍ»، والمضاف «دَمَ» مقدَّر قبله."
morphology:
  - "«العَمْر» بفتح العين لغة في «العُمْر»، وهي التي تُستعمل في القسم."
  - "«جَرَّتْ» ماضٍ مضعّف، والتاء للتأنيث لأن الفاعل جمع تكسير «رِمَاحُهُمْ»."
rhetoric:
  thesis: "يبرّئ الدافعين من الدماء التي وَدَوْها: لم تقتل رماحهم أحدًا من هؤلاء، ومع ذلك حملوا دياتهم. وهنا موضع المدح كله."
  devices:
    - title: "المجاز العقلي"
      text: "في «مَا جَرَّتْ عَلَيْهِمْ رِمَاحُهُمْ» أسند الجناية إلى الرماح، وهي آلتها لا فاعلها. قال الزَّوْزَنِيّ في هذا وفي «شاركت» بعده: «والتأنيث في شاركت للرماح يبين براءة ذممهم عن سفك دمهم ليكون ذلك أبلغ في مدحهم بعقلهم القتلى» [@zawzani، ص147]. فنفي فعل الرماح أبلغ من نفي فعلهم: لم تمتدّ أداة منهم إلى دم."
    - title: "التعيين بالأسماء"
      text: "سمّى القتلى: «ابْنِ نَهِيكٍ» و«قَتِيلِ الْمُثَلَّمِ»، ثم نَوْفَل ووَهْب وابن المُحَزَّم في البيت التالي. فالبراءة ليست دعوى عامة، بل قائمة بأسماء يعرفها السامعون. وهذه قراءتنا."
    - title: "القسم"
      text: "«لَعَمْرُكَ»: قسم بحياة المخاطب، يؤكد به النفي."
  connection: "ويتم القائمة في البيت التالي: «وَلَا شَارَكَتْ فِي الْمَوْتِ فِي دَمِ نَوْفَلٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "لَعَمْرُ / كَ مَا جَرْرَتْ / عَلَيْهِمْ / رِمَاحُهُمْ = فعولُ / مفاعيلن / فعولن / مفاعلن — دَمَبْ نِ / نَهِيكِنْ أَوْ / قَتِيلِلْ / مُثَلْلَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في الشطرين [@atiq، ص29]."
variants:
