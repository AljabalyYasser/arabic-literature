first: "فَلَمَّا عَرَفْتُ الدَّارَ قُلْتُ لِرَبْعِهَا"
second: "أَلَا انْعَمْ صَبَاحًا أَيُّهَا الرَّبْعُ وَاسْلَمِ"
meaning: "فلما عرفت الدار حيّيت منزلها ودعوت له: طاب عيشك في صباحك أيها المنزل، وسلمت. قال ابن الأَنْبارِيّ: «معناه لقيت يا ربع نعيما في صباحك»، و«الدعاء في الظاهر للربع، وفي المعنى لمن كان يسكن الربع، ممن يألفه ويحبه» [@ibn-al-anbari، ص243]."
vocabulary:
  - term: "رَبْعِهَا"
    text: "«الربع: المنزل. يقال: هذا ربع بنى فلان، أي منزلهم» [@ibn-al-anbari، ص243]. وقال الأَعْلَم في الرَّبْع: «موضع الدار، حيث أقاموا في الربيع وغيره» [@diwan-zuhayr، ص11]."
  - term: "أَلَا انْعَمْ صَبَاحًا"
    text: "تحية، قال يعقوب: «ألا انعم» صباحًا «وعم صباحاً، وانعم ظلاما وعم ظلاما: تحية لهم» [@ibn-al-anbari، ص243–244]. وخصّ الصباح بالدعاء، قال الزَّوْزَنِيّ: «لأن الغارات والكرائه تقع صباحًا» [@zawzani، ص135]."
  - term: "وَاسْلَمِ"
    text: "قال الأَعْلَم: «أي: سلّمك الله من الدروس، والتغيّر» [@diwan-zuhayr، ص11]. والدروس: امّحاء الأثر."
syntax:
  - "«لَمَّا» ظرف بمعنى «حين» فيه معنى الشرط، وجوابه «قُلْتُ»."
  - "«وألا افتتاح للكلام، وانعم مجزوم على الأمر، وصباحا منصوب على الوقت» [@ibn-al-anbari، ص244]، أي ظرف زمان. و«أَيُّهَا الرَّبْعُ» نداء حُذفت أداته، و«اسْلَمِ» فعل أمر معطوف على «انْعَمْ»، وكُسر آخره للقافية."
  - "جملة «أَلَا انْعَمْ...» في محل نصب مفعول به لـ«قُلْتُ»، وهي مقول القول."
morphology:
  - "«انْعَمْ» من «نَعِمَ يَنْعَمُ»، ويقال أيضًا «يَنْعِمُ»؛ قال أبو عُبَيْدة: «والعرب تقول: نعم ينعَم ينعِم... فكسر المستقبل في هؤلاء الأحرف على غير القياس» [@ibn-al-anbari، ص244]. وذكر الزَّوْزَنِيّ في التحية «أربع لغات»: انْعَمْ، وانْعِمْ، وعَمْ، وعِمْ [@zawzani، ص135]."
  - "«عِمْ صَبَاحًا» في رواية الأَصْمَعِيّ «وتقدير الفعل الماضي منه وعم يعم، ولا ينطق به» [@ibn-al-anbari، ص244]. وفي لسان العرب: «وَالَّذِي سَمِعْنَاهُ وحَفِظْناه فِي تَفْسِيرِ عِمْ صَباحاً أَن مَعْنَاهُ انْعِمْ صَباحاً، كَذَلِكَ رُوِيَ عَنِ ابْنِ الأَعرابي» [@lisan، ج12 ص641]."
  - "«الرَّبْع» يُجمع «في الجمع القليل أربع، وفي الجمع الكثير ربوع ورباع» [@ibn-al-anbari، ص243]."
rhetoric:
  thesis: "بعد التعرّف يأتي الكلام: الشاعر يحيّي المنزل كما يحيّي إنسانًا، ويدعو له بالبقاء، لأن بقاءه بقاء ذكرى أهله."
  devices:
    - title: "خطاب الجماد"
      text: "في «أَيُّهَا الرَّبْعُ» يخاطب المنزل خطاب العاقل ويحيّيه. والمقصود أهله: «والدعاء في الظاهر للربع، وفي المعنى لمن كان يسكن الربع» [@ibn-al-anbari، ص243]. وقال الأَعْلَم: «دعا للرّبع وحيّاه، تذكّراً لمن كان فيه» [@diwan-zuhayr، ص11]. فهو مجاز: يُسند الدعاء إلى المكان ويُراد به من سكنه."
    - title: "الدعاء بما ينقض الواقع"
      text: "يدعو للربع بأن يسلم، وقد رأى في الأبيات السابقة أنه لم يسلم: دمنة صامتة وأثافٍ ونؤي متهدّم. قال الأَعْلَم في «وَاسْلَمِ»: «سلّمك الله من الدروس، والتغيّر» [@diwan-zuhayr، ص11]. فالدعاء رغبة في إيقاف ما وقع. وهذه قراءتنا."
    - title: "اللفظ المأثور"
      text: "«انْعَمْ صَبَاحًا» تحية كانت العرب تقولها، فالشاعر يضع لفظ الحياة اليومية في موضع الحزن، ويحيّي الدار كما كان يحيّي أهلها."
  connection: "ثم يلتفت إلى صاحبه يسأله أن ينظر: هل يرى ظعائن راحلات [@ibn-al-anbari، ص244]؟"
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَلَمْمَا / عَرَفْتُدْدَا / رَ قُلْتُ / لِرَبْعِهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — أَلَنْعَمْ / صَبَاحَنْ أَيْ / يُهَرْرَبْ / عُ وَسْلَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "همزتا الوصل في «انْعَمْ» و«اسْلَمِ» تسقطان في النطق. ودخل القبض «فعولن» الثالثة في الصدر [@atiq، ص29]."
context: "خاتمة مقطع الدار (1–6): يبدأ بالسؤال، ويمرّ بالوصف والتعرّف، وينتهي بالتحية. وبعده ينتقل إلى الظعائن."
variants:
  - reading: "أَلَا عِمْ صَبَاحًا أَيُّهَا الرَّبْعُ وَاسْلَمِ"
    status: "رواية الأَصْمَعِيّ والأَعْلَم"
    note: "«وروى الأصمعي: (ألا عم صباحا) . وقال: معناه انعم. وقال: هكذا تنشده عامة العرب» [@ibn-al-anbari، ص244]. وبها يروي الأَعْلَم [@diwan-zuhayr، ص11]، وكذلك أنشده أبو الفَرَج [@aghani-dk، ج10 ص287]."
