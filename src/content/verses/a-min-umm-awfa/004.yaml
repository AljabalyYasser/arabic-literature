first: "وَقَفْتُ بِهَا مِنْ بَعْدِ عِشْرِينَ حِجَّةً"
second: "فَلَأْيًا عَرَفْتُ الدَّارَ بَعْدَ تَوَهُّمِ"
meaning: "وقفت بهذه الدار بعد عشرين سنة من فراق أهلها، فلم أعرفها إلا بعد إبطاء وجهد، وبعد أن ظننت فلم أستيقن. قال ابن الأَنْبارِيّ: «معناه عهدي بها منذ عشرين حجة، عرفتها بعد أن توهمت فلم أعرف» [@ibn-al-anbari، ص241]."
vocabulary:
  - term: "حِجَّةً"
    text: "السنة. قال يعقوب: «والحِجة مكسورة لا تفتح» [@ibn-al-anbari، ص241]، وقال التِّبْرِيزِيّ: «الحِجَّة السنة والحَجَّ الفعلة من الحج» [@tabrizi-ashr، ص104]."
  - term: "لَأْيًا"
    text: "«بعد إبطاء وجهد» [@ibn-al-anbari، ص241]. وفي لسان العرب: «اللَّأَى: الإِبْطاء والاحْتِباس» [@lisan، ج15 ص237]. ويقال: «التأت عليه الحاجة، إذا أبطأت» [@ibn-al-anbari، ص241]."
  - term: "تَوَهُّمِ"
    text: "الظن والتخمين، أي بعد أن تمثّلها في نفسه فلم يقطع بها. وعند الأَعْلَم: «يقول: عرفتها بعد جهد وبطء، لما كان عهدي بها منذ عشرين سنة، مع تغيّرها عما عهدتها عليه» [@diwan-zuhayr، ص10]."
syntax:
  - "«بِهَا» متعلق بـ«وَقَفْتُ»، و«مِنْ بَعْدِ» متعلق به أيضًا. و«حِجَّةً» تمييز؛ قال ابن الأَنْبارِيّ: «والحجة نصب على التفسير عن العدد» [@ibn-al-anbari، ص241]، والتفسير عند الكوفيين هو التمييز: اسم نكرة يبيّن المعدود المبهم بعد «عشرين»."
  - "في نصب «لَأْيًا» وجهان. عند ابن الأَنْبارِيّ: «ونصب لأيا على المصدر بعرفت» [@ibn-al-anbari، ص241]، ومثله في لسان العرب: «وَهُوَ مِنَ الْمَصَادِرِ الَّتِي يَعْمَلُ فِيهَا مَا لَيْسَ مِن لَفْظِهَا، كَقَوْلِكَ لَقِيته التِقاطاً وقَتَلْته صَبْراً» [@lisan، ج15 ص237]. وعند التِّبْرِيزِيّ: «والأجود أن يكون المعنى فعرفت الدار لأياً، يكون قوله (لأيا) في موضع الحال والمعنى مبطئا» [@tabrizi-ashr، ص105]."
  - "الفاء في «فَلَأْيًا» عاطفة، وقُدّم «لَأْيًا» على فعله «عَرَفْتُ» للعناية به."
morphology:
  - "«الحِجّة» مكسورة الحاء في معنى السنة، أما «الحَجّة» بالفتح فالمرة الواحدة من الحج، قال الفراء: «ولم أر العرب تقول حَجة، وهو قياس إذا أردت مرة واحدة» [@ibn-al-anbari، ص241]."
  - "«لَأْي» مصدر «لَأَى يَلْأَى»، ومنه «الْتَأَتِ الحاجةُ» على «افتعل» [@ibn-al-anbari، ص241]."
  - "«تَوَهُّم» مصدر «تَوَهَّمَ» على «تَفَعُّل»."
rhetoric:
  thesis: "عشرون سنة بين الشاعر والدار: الرقم يفسّر الشك الذي في المطلع، والجهد في معرفتها يقيس طول الغياب."
  devices:
    - title: "تقديم «لَأْيًا»"
      text: "في «فَلَأْيًا عَرَفْتُ الدَّارَ» قدّم المصدر على الفعل. يقول عبد القاهر في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]. والمهم هنا البطء نفسه: لم تكن المعرفة هي الخبر، بل الجهد الذي سبقها."
    - title: "جواب المطلع"
      text: "سؤال البيت الأول «أَمِنْ أُمِّ أَوْفَى دِمْنَةٌ» يجد جوابه هنا: نعم هي دارها، ولكنه لم يعرفها إلا «بَعْدَ تَوَهُّمِ». فالبيت يفسّر الشك بالسنين العشرين. وهذه قراءتنا."
    - title: "شاهد في اللغة"
      text: "استشهد به أصحاب اللغة على «اللأي»؛ ففي لسان العرب بعد تعريفه: «قَالَ زُهَيْرٌ: فَلأْياً عَرفت الدارَ بَعْدَ توهُّم» [@lisan، ج15 ص237]."
  connection: "ثم يعدّ العلامات التي عرف بها الدار: أثافي القدر السود، والنؤي الذي بقي أصله [@ibn-al-anbari، ص241]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَقَفْتُ / بِهَا مِنْ بَعْ / دِ عِشْرِي / نَ حِجْجَتَنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — فَلَأْيَنْ / عَرَفْتُدْدَا / رَ بَعْدَ / تَوَهْهُمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» في التفعيلة الأولى من الصدر والثالثة من العجز، فصارت «فعولُ» [@atiq، ص29]."
context: "يقرّر الشاعر في هذا البيت زمن الوقفة، فيضع المطلع في سياقه: رجل يعود إلى دار بعد عشرين سنة. ويفتح الباب لتعداد العلامات في البيت التالي، ثم للتحية في البيت 6."
