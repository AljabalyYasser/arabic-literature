first: "فَلَمَّا وَرَدْنَ الْمَاءَ زُرْقًا جِمَامُهُ"
second: "وَضَعْنَ عِصِيَّ الْحَاضِرِ الْمُتَخَيِّمِ"
meaning: "فلما بلغت الظعائن الماء صافيًا لم يرده أحد قبلهن، أقمن عنده إقامة من نزل في أهله واتخذ خيمة. قال ابن الأَنْبارِيّ: «وقوله (زرقا) معناه لم يورد قبلهن فيكدر، فهو صاف. وقوله (وضعن عصى الحاضر المتخيم) معناه أقمن كما يطرح الذي لا يريد السفر عصاه ويقيم» [@ibn-al-anbari، ص251]."
vocabulary:
  - term: "زُرْقًا"
    text: "صافيًا، «يقال: ماء أزرق، إذا كان صافيا» [@ibn-al-anbari، ص251]. وقال الأَعْلَم: «وإذا صفا الماء رأيته أزرق، إلى الخضرة» [@diwan-zuhayr، ص14]."
  - term: "جِمَامُهُ"
    text: "قال الأَصْمَعِيّ: «يقال للماء إذا خرج من عيونه فارتفع في البئر: قد جم يجم جموما؛ ويسمى الماء نفسه جما» [@ibn-al-anbari، ص251]. وفي لسان العرب: «وجَمُّ الماءِ: مُعْظَمُه إِذا ثَابَ... وَكَذَلِكَ جُمَّتُه، وَجَمْعُهَا جِمامٌ وجُمُومٌ» [@lisan، ج12 ص105]."
  - term: "الْحَاضِرِ"
    text: "عند الأَعْلَم: «الذين حضروا الماء، وأقاموا عليه» [@diwan-zuhayr، ص14]. وفي الشرح المنسوب إلى ثَعْلَب: «والحاضرة: أهل القرى. ولا يقال الحاضر لمن حضر القرى» [@sharh-thalab-zuhayr، ص22]."
  - term: "الْمُتَخَيِّمِ"
    text: "«يريد الذي يتخذ خيمة، وهي أعواد تنصب وتجعل لها عوارض فتظلل بالثمام» [@ibn-al-anbari، ص251]. والثُّمام: نبت يُظلّل به."
syntax:
  - "«وزرقاً منصوب على الحال من الماء، والجمام رفع بمعنى زرق» [@ibn-al-anbari، ص252]، أي أن «جِمَامُهُ» فاعل للصفة «زُرْقًا»: وردن الماء زرقًا جمامُه. قال التِّبْرِيزِيّ: «وجاز أن يقول زرقا وان كان بمعنى الفعل لأنه جمع مكسر فقد خالف الفعل من هذه الجهة» [@tabrizi-ashr، ص110]."
  - "«ولما وقت فيه طرف من الجزاء، وهو من صلة وضعن» [@ibn-al-anbari، ص252]: «لَمَّا» ظرف فيه معنى الشرط، وجوابه «وَضَعْنَ»."
  - "«عِصِيَّ» مفعول به، و«الْحَاضِرِ» مضاف إليه، و«الْمُتَخَيِّمِ» نعته."
morphology:
  - "«عِصِيّ» جمع «عَصًا»، وأصله «عُصُوو»: «وكان يجب أن يقال: عصو، فأبدل من الواو ياء لأنها طرف... ثم كسرت الصاد من أجل الياء التي بعدها» [@tabrizi-ashr، ص110]."
  - "«جِمام» جمع «جَمّ» و«جُمّة» على «فِعال» [@diwan-zuhayr، ص14]."
  - "«المُتَخَيِّم» اسم فاعل من «تَخَيَّمَ» على «تَفَعَّلَ»، و«التَّخَيُّم: ابتناء الخيمة» [@zawzani، ص138]."
rhetoric:
  thesis: "تنتهي الرحلة بالإقامة: ماء صاف لم يمسّه أحد، ونساء يلقين عصيّهن كأنهن في ديارهن. فالأمن تمام المشهد."
  devices:
    - title: "الكناية"
      text: "في «وَضَعْنَ عِصِيَّ الْحَاضِرِ» لم يقل «أقمن»، بل ذكر فعلًا يلزم الإقامة. قال الزَّوْزَنِيّ: «وضع العصى: كناية عن الإقامة؛ لأن المسافرين إذا أقاموا وضعوا عصيهم» [@zawzani، ص138]. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. وقال الأَعْلَم: «وضرب هذا مثلاً. يقال لكلّ من أقام ولم يسافر: ألقى عصا السفر، وألقى عصا السير» [@diwan-zuhayr، ص14]."
    - title: "الصفاء علامة السبق"
      text: "«زُرْقًا جِمَامُهُ» تدل على أن الماء لم يُورد قبلهن، فهن أول من نزل عليه. وقال أبو جَعْفَر في دلالة البيت: «وصف أنهن في أمن ومتعة، فإذا نزلْن نزلن آمنات كنزول من هو في أهله ووطنه» [@ibn-al-anbari، ص252]."
    - title: "بيت النسيب"
      text: "نقل الشرح المنسوب إلى ثَعْلَب: «قيل لكُثَيِّر عَزَّة: أيُّ بيتٍ أنسبُ؟ فأنشد: فلمّا وردنَ الماءَ، زُرْقاً جِمامُهُ» [@sharh-thalab-zuhayr، ص23]. وأنسب البيوت: أبلغها في النسيب. فالشاعر العاشق كُثَيِّر اختار من غزل الجاهلية بيتًا لا يذكر المرأة إلا بفعلها."
  connection: "ثم يختم وصف الظعائن بما فيهن من لهو للعاشق ومنظر يعجب الناظر [@ibn-al-anbari، ص252]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَلَمْمَا / وَرَدْنَلْمَا / ءَ زُرْقَنْ / جِمَامُهُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَضَعْنَ / عِصِيْيَلْحَا / ضِرِلْمُ / تَخَيْيِمِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» الأولى والثالثة من العجز [@atiq، ص29]، وأُشبعت ضمة الهاء في «جِمَامُهُ»."
context: "يكمل رحلة الظعائن بنزولهن على الماء، وهو مستقر الرحلة. وموضعه عند الأَعْلَم البيت 14 أيضًا [@diwan-zuhayr، ص13]."
variants:
  - reading: "زُرْقٌ جِمَامُهُ"
    status: "رواية أخرى"
    note: "«ومن روى (زرق جمامه) رفع زرقا على إنه خبر الابتداء، وينوي به التأخير» [@tabrizi-ashr، ص110]."
  - reading: "وُرْقًا جِمَامُهُ"
    status: "تصحيف"
    note: "نقل الشرح المنسوب إلى ثَعْلَب عن الأَصْمَعِيّ أن من قال «وُرْقاً جمامُه» «فقد صحّف» [@sharh-thalab-zuhayr، ص23]. والتصحيف: الخطأ في قراءة الكلمة بتغيير نقطها."
  - reading: "فَلَمَّا وَرَدْنَا الْمَاءَ"
    status: "في الكامل ولسان العرب"
    note: "كذا أنشده المُبَرِّد شاهدًا على أن الزرقاء الصافية [@kamil، ج3 ص76]، وكذا في لسان العرب [@lisan، ج12 ص105]."
