first: "وَمَنْ لَمْ يُصَانِعْ فِي أُمُورٍ كَثِيرَةٍ"
second: "يُضَرَّسْ بِأَنْيَابٍ وَيُوطَأْ بِمَنْسِمِ"
meaning: "من لم يُدارِ الناس في كثير من الأمور عضّوه بأنيابهم ووطئوه بأخفافهم. في شرح ابن الأَنْبارِيّ: «قوله (يصانع) معناه يترفق ويداري. وقوله (يضرس بأنياب) : يمضغ بضرس. و (يوطأ بمنسم) وهذا مثل» [@ibn-al-anbari، ص286]. وقال الزَّوْزَنِيّ: «يقول: ومن لم يصانع الناس ولم يدارهم في كثير من الأمور قهروه وغلبوه وأذلوه وربما قتلوه» [@zawzani، ص149]. وعند الأَعْلَم: «أصيب بما يكره، وعُضّ بالقبيح من القول» [@diwan-zuhayr، ص26]."
vocabulary:
  - term: "يُصَانِعْ"
    text: "«يترفق ويداري» [@ibn-al-anbari، ص286]."
  - term: "يُضَرَّسْ"
    text: "يُعضّ بالأضراس. «الضرس: العض على الشيء بالضرس، والتضريس مبالغة» [@zawzani، ص149]."
  - term: "مَنْسِمِ"
    text: "«والمنسمان: الظفران في صدر خف البعير» [@ibn-al-anbari، ص286]. و«المنسم للبعير: بمنزلة السنبك … للفرس» [@zawzani، ص149]، والسُّنبك: طرف الحافر."
context: "من حكم المداراة. وفيه مثل للعرب ذكره ابن الأَنْبارِيّ: «يقال: طأني بظلف وكلني بضرس» [@ibn-al-anbari، ص286]، أي: إن أردت أن تذلّني فاجعله برفق. وهو 54 عند ابن الأَنْبارِيّ، و50 عند الأَعْلَم [@diwan-zuhayr، ص26]، و51 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص35]، و49 عند الزَّوْزَنِيّ [@zawzani، ص149]؛ وهو عند هؤلاء الثلاثة أول أبيات «وَمَنْ» بعد «سئمت» و«رأيت» و«وأعلم»."
syntax:
  - "«ويصانع جزم بمن، ومن مرفوعة بما عاد من يصانع، ويضرس جواب الجزاء، ويوطأ نسق عليه» [@ibn-al-anbari، ص286]."
  - "«فِي أُمُورٍ كَثِيرَةٍ» متعلق بـ«يُصَانِعْ»، و«بِأَنْيَابٍ» و«بِمَنْسِمِ» متعلقان بالفعلين بعدهما، والباء للاستعانة."
morphology:
  - "«يُصانِع» على «يُفاعِل»، وفيه معنى المشاركة: يلين للناس فيلينون له."
  - "«يُضَرَّس» على «يُفَعَّل» للمبالغة [@zawzani، ص149]."
  - "«يُوطَأ» مضارع «وطئ» مبني للمجهول: «يقال وطئته فأنا أطؤه وطئا، مثل وضعا» [@ibn-al-anbari، ص286]."
rhetoric:
  thesis: "المداراة شرط السلامة بين الناس: من لم يلِن لهم أكلوه وداسوه."
  devices:
    - title: "التمثيل"
      text: "في «يُضَرَّسْ بِأَنْيَابٍ وَيُوطَأْ بِمَنْسِمِ» جعل من لا يداري كالشيء تعضّه الإبل بأنيابها وتطؤه بأخفافها. وهذا عند ابن الأَنْبارِيّ «مثل» [@ibn-al-anbari، ص286]، والمراد الذل كما قال أبو جَعْفَر: «معناه يذل»، وأنشد للفرزدق: «أذلَّ من القِردان تحت المناسمِ» [@ibn-al-anbari، ص286]."
    - title: "الترقّي"
      text: "بدأ بالعضّ ثم انتهى إلى الوطء بالأقدام، فارتقى من أذى إلى أشد منه: يُعضّ أولًا، ثم يُداس. وهذه قراءتنا."
  connection: "ثم يجعل المعروف وقاية للعرض: «وَمَنْ يَجْعَلِ الْمَعْرُوفَ مِنْ دُونِ عِرْضِهِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ لَمْ / يُصَانِعْ فِي / أُمُورِنْ / كَثِيرَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — يُضَرْرَسْ / بِأَنْيَابِنْ / وَيُوطَأْ / بِمَنْسِمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "لا زحاف في حشو البيت، والعَرُوض والضرب مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
