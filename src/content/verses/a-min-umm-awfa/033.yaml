first: "فَتُغْلِلْ لَكُمْ مَا لَا تُغِلُّ لِأَهْلِهَا"
second: "قُرًى بِالْعِرَاقِ مِنْ قَفِيزٍ وَدِرْهَمِ"
meaning: "فتؤدي إليكم الحرب غلّة لا تؤديها قرى العراق لأهلها من الحَبّ والدراهم: غلّتها الدم والديات. قال يَعْقُوب: «هذا تهكم، أي هزء. يقول: لا يأتيكم منها ما تسرون به مثل ما يأتي أهل القرى من الطعام والدراهم، ولكن غلة هذا عليكم ما تكرهون» [@ibn-al-anbari، ص271]. وقال أبو جَعْفَر: «فتغلل لكم معناه أنكم تقتلون ويحمل إليكم ديات قومكم، فافرحوا فهذه لكم غلة» [@ibn-al-anbari، ص271]."
vocabulary:
  - term: "تُغْلِلْ ... تُغِلُّ"
    text: "من الغَلّة، وهي ما تؤديه الأرض. «وأغلت الضيعة: أعطت الغلة، فهي مغلة إذا أتت بشيء وأصلها باق» [@lisan، ج11 ص504]."
  - term: "قُرًى بِالْعِرَاقِ"
    text: "قرى العراق الخصبة، «التي تغل الدراهم بالقفيزات» [@zawzani، ص144]."
  - term: "قَفِيزٍ"
    text: "مكيال للحبوب. ويقول المحقق قَباوَة: «القفيز: مكيال. وأراد: ما يملأ المكيال، من المحصولات» [@diwan-zuhayr، ص19]."
context: "آخر صورة الحرب (29–33). بعد الرحى والناقة يأتي التهكم، ثم يلخص الزَّوْزَنِيّ المقطع كله: «وتلخيص المعنى أن المضار المتولدة من هذه الحروب تُرْبي على المنافع المتولدة من هذه القرى، كل هذا حث منه إياهم على الاعتصام بحبل الصلح، وزجر عن الغدر بإيقاد نار الحرب» [@zawzani، ص144]. وتُربي: تزيد. وهو البيت 32 عند الأَعْلَم [@diwan-zuhayr، ص19] والزَّوْزَنِيّ [@zawzani، ص144]، وبعده عندهما مباشرة قصة حُصَيْن بن ضَمْضَم."
syntax:
  - "«وموضع (فتغلل) جزم على النسق على فتنتج لكم» [@ibn-al-anbari، ص272]. و«مَا» الأولى مفعول «تُغْلِلْ»، و«قُرًى» فاعل «تُغِلُّ»، والتقدير: ما لا تُغِلّه قرى العراق لأهلها."
  - "«مِنْ قَفِيزٍ وَدِرْهَمِ» بيان لـ«ما» الثانية، أي: من الحَبّ المكيل والمال."
morphology:
  - "«تُغْلِلْ» مضارع «أغلّ» مجزوم، فكّ إدغامه. قال الزَّوْزَنِيّ: «أظهر تضعيف المضاعف في محل الجزم والبناء على الوقف» [@zawzani، ص144]، وهي لغة أهل الحجاز. أما «تُغِلُّ» فمرفوع مدغم."
  - "«قُرًى» جمع «قرية» على «فُعَل»، اسم مقصور نُوّن."
rhetoric:
  thesis: "يختم صورة الحرب بالسخرية: يجعلها ضيعة تُغِلّ لهم، ثم يكشف أن غلّتها القتلى والديات."
  devices:
    - title: "التهكم"
      text: "التهكم: أن يُخرج الكلام مخرج البشارة أو المدح وهو تحذير أو ذم. وهو في «فَتُغْلِلْ لَكُمْ»: الغلة خير يُنتظر، وهي هنا الدم. وقد سماه يَعْقُوب: «هذا تهكم، أي هزء» [@ibn-al-anbari، ص271]."
    - title: "المقابلة"
      text: "قابل بين غلّة الحرب وغلّة «قُرًى بِالْعِرَاقِ مِنْ قَفِيزٍ وَدِرْهَمِ»: الأولى تُفني الأموال، والثانية تنمّيها. فاختار أخصب ما يعرفه العرب ليجعل خسارة الحرب أظهر."
    - title: "الاستعارة"
      text: "في «فَتُغْلِلْ» جعل الحرب أرضًا مزروعة تؤدي غلّتها كل موسم. والصورة تكمل ما قبلها: الحرب ناقة تلد، ثم ضيعة تُغِلّ."
  connection: "ثم يعود إلى الحي الذي حمل الديات: «لِحَيٍّ حِلَالٍ يَعْصِمُ النَّاسَ أَمْرُهُمْ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَتُغْلِلْ / لَكُمْ مَا لَا / تُغِلْلُ / لِأَهْلِهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — قُرَنْ بِلْ / عِرَاقِ مِنْ / قَفِيزِنْ / وَدِرْهَمِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر [@atiq، ص29]، و«مفاعيلن» الثانية في العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
