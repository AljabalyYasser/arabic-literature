first: "وَمَنْ يَكُ ذَا فَضْلٍ فَيَبْخَلْ بِفَضْلِهِ"
second: "عَلَى قَوْمِهِ يُسْتَغْنَ عَنْهُ وَيُذْمَمِ"
meaning: "من كان عنده فضل مال أو خير فبخل به على قومه، استغنوا عنه وذمّوه. قال الأَعْلَم: «يقول: من كان له فضل مال، فبخل به على قومه، استغنوا عنه واعتمدوا على غيره» [@diwan-zuhayr، ص26]. وقال الزَّوْزَنِيّ: «يقول: من كان ذا فضل ومال فبخل به استغني عنه وذم» [@zawzani، ص151]."
vocabulary:
  - term: "فَضْلٍ"
    text: "زيادة من المال أو الخير على حاجة صاحبه [@diwan-zuhayr، ص26]."
  - term: "يُسْتَغْنَ عَنْهُ"
    text: "لا يحتاج إليه قومه، فيلجؤون إلى غيره."
  - term: "يُذْمَمِ"
    text: "«يقال ذممت الرجل أذمه ذما ومذَمة ومذِمة. ويقال قد أذم الرجل، إذا أتى بالذميم من الأمر» [@ibn-al-anbari، ص284]."
context: "أول ما في الحكمة من أمر المال والمعروف. وهو 50 عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ [@tabrizi-ashr، ص126]، و51 عند الأَعْلَم [@diwan-zuhayr، ص26] والزَّوْزَنِيّ [@zawzani، ص151]، و52 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص35]. وسلسلة الأبيات التي تبدأ بـ«وَمَنْ» في هذا المقطع بناء الأمثال: شرط وجواب، كل منهما حكم عام، فيسهل حفظه وتمثّله."
syntax:
  - "«يَكُ» مجزوم بـ«من»، «علامة الجزم فيه سكون النون في الأصل، والنون سقطت لكثرة الاستعمال، وشبهت في حال سكونها بالواو والياء والألف، ولم يجز سقوطها إذا تحركت، كقولك: لم يكن الرجل قائما» [@ibn-al-anbari، ص284]."
  - "«واسم الكون مضمر فيه من ذكر من، وذا فضل خبر الكون، ويبخل نسق على يك، ويستغن جواب الجزاء علامة الجزم فيه سقوط الألف، ويذمم نسق على يستغن» [@ibn-al-anbari، ص284]."
morphology:
  - "«يَكُ» أصلها «يَكُنْ»، حُذفت النون تخفيفًا، وجاء الوجهان في القرآن: «فلا تكنْ من المُمْتَرين» و«فلا تكُ في مرْية منه» [@ibn-al-anbari، ص284]."
  - "«يُذْمَمِ» فُكّ فيه الإدغام: «فأظهر التضعيف على لغة أهل الحجاز؛ لأن لغتهم إظهار التضعيف في محل الجزم والبناء على الوقف» [@zawzani، ص151]."
  - "«يُسْتَغْنَ» مضارع «استغنى» مبني للمجهول، مجزوم بحذف الألف."
rhetoric:
  thesis: "البخل بالفضل يعاقب صاحبه مرتين: يستغني الناس عنه، ثم يذمّونه."
  devices:
    - title: "المفارقة"
      text: "صاحب الفضل هو الذي يُنتظر أن يحتاج إليه الناس، فإذا بخل صار هو المستغنى عنه: «ذَا فَضْلٍ ... يُسْتَغْنَ عَنْهُ». فالبخل يقلب ميزته إلى عزلة. وهذه قراءتنا."
    - title: "الجزاء المضاعف"
      text: "جواب الشرط فعلان: «يُسْتَغْنَ عَنْهُ وَيُذْمَمِ»، فالعقوبة في الحال وفي الذكر."
  connection: "ثم يأتي البيت الذي زاده أبو زَيْد: «وَمَنْ لَا يَزَلْ يَسْتَرْحِلُ النَّاسَ نَفْسَهُ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ يَ / كُ ذَا فَضْلِنْ / فَيَبْخَلْ / بِفَضْلِهِي = فعولُ / مفاعيلن / فعولن / مفاعلن — عَلَى قَوْ / مِهِي يُسْتَغْ / نَ عَنْهُو / وَيُذْمَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت كسرة الهاء في «قَوْمِهِ» وضمتها في «عَنْهُ». ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر [@atiq، ص29]."
