first: "وَمَنْ يَغْتَرِبْ يَحْسِبْ عَدُوًّا صَدِيقَهُ"
second: "وَمَنْ لَا يُكَرِّمْ نَفْسَهُ لَا يُكَرَّمِ"
meaning: "من ابتعد عن قومه حسب العدوّ صديقًا، ومن لم يُكرم نفسه لم يُكرمه الناس. قال الزَّوْزَنِيّ: «يقول: من سافر واغترب حسب الأعداء أصدقاء؛ لأنه لم يجربهم فتوقفه التجارب على ضمائر صدورهم، ومن لم يكرم نفسه بتجنب الدنايا لم يكرمه الناس» [@zawzani، ص151]. وللأَعْلَم في الصدر قولان: «من يصر غريبًا يدار العدو، حتى كأنه عنده صديق. وقيل: معناه: من اغترب عن قومه، وصار فيمن لا يعرف، أشكل عليه العدو والصديق» [@diwan-zuhayr، ص29]."
vocabulary:
  - term: "يَغْتَرِبْ"
    text: "«معناه يبعد عن قومه، يقال رجل غريب وغرب، ورجل جانب وجنب» [@ibn-al-anbari، ص285]."
  - term: "يُكَرِّمْ ... يُكَرَّمِ"
    text: "يُكرِم ويُكرَم، «وكرم وأكرم بمعنى» [@ibn-al-anbari، ص285]. وقال الأَعْلَم: «أي: من لا يقصر نفسه على الأمور التي تؤدي إلى الكرامة استخف به، وأهين» [@diwan-zuhayr، ص29]."
context: "حكمتان في بيت، الأولى في الغربة والثانية في كرامة النفس. وهو 52 عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ [@tabrizi-ashr، ص126]، و57 عند الأَعْلَم [@diwan-zuhayr، ص28] والزَّوْزَنِيّ [@zawzani، ص151]، و58 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص36]."
syntax:
  - "«ومن جزاء، ويحسب جواب الجزاء واسم المحسبة العدو، وخبرها الصديق» [@ibn-al-anbari، ص285]. أي إن «حسب» تنصب مفعولين أصلهما مبتدأ وخبر: «عَدُوًّا» الأول، و«صَدِيقَهُ» الثاني، والمعنى: يظن العدو صديقه."
  - "ويحتمل التركيب الوجه الآخر: أن يكون «صَدِيقَهُ» المفعول الأول مؤخرًا، فالمعنى: يظن صديقه عدوًّا. وهذه قراءتنا، والشراح على الأول."
  - "«لَا يُكَرَّمِ» جواب الشرط الثاني، مجزوم، وكُسر آخره للقافية."
morphology:
  - "«يَغْتَرِب» على «يفتعل» من «غرب»."
  - "«يُكَرِّم» مضارع «كَرَّم» على «فعّل» مبني للمعلوم، و«يُكَرَّم» مضارعه المبني للمجهول؛ والتضعيف هنا بمعنى «أكرم» [@ibn-al-anbari، ص285]."
rhetoric:
  thesis: "الغريب لا يعرف عدوه من صديقه، والكرامة تبدأ من النفس: من أهان نفسه لم يكرمه أحد."
  devices:
    - title: "الطباق"
      text: "«عَدُوًّا ... صَدِيقَهُ»: جمع بين الضدين في جملة واحدة، فصوّر الالتباس الذي تصنعه الغربة."
    - title: "رد العجز على الصدر"
      text: "«يُكَرِّمْ ... يُكَرَّمِ»: الفعل نفسه مبنيًّا للمعلوم ثم للمجهول، فالجزاء من جنس العمل: ما تفعله بنفسك يُفعل بك. وهذا من الجناس، لأن اللفظين من أصل واحد."
  connection: "ثم يعود إلى الحرب وحماية الحرمة: «وَمَنْ لَا يَذُدْ عَنْ حَوْضِهِ بِسِلَاحِهِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ يَغْ / تَرِبْ يَحْسِبْ / عَدُوْوَنْ / صَدِيقَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَمَنْ لَا / يُكَرْرِمْ نَفْ / سَهُو لَا / يُكَرْرَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "لا زحاف في حشو البيت، والعَرُوض والضرب مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
variants:
