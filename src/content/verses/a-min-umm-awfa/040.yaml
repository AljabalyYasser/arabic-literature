first: "وَقَالَ سَأَقْضِي حَاجَتِي ثُمَّ أَتَّقِي"
second: "عَدُوِّي بِأَلْفٍ مِنْ وَرَائِيَ مُلْجِمِ"
meaning: "وقال حُصَيْن في نفسه: سأقضي حاجتي من الثأر، ثم أجعل بيني وبين عدوي ألف فارس من قومي. قال الزَّوْزَنِيّ: «وقال حصين في نفسه: سأقضي حاجتي من قتل قاتل أخي أو قتل كفؤ له، ثم أجعل بيني وبين عدوي ألف فارس ملجم فرسه أو ألفًا من الخيل ملجمًا» [@zawzani، ص145]. وقال أبو جَعْفَر: «حاجته قتل ورد بن حابس» [@ibn-al-anbari، ص276]."
vocabulary:
  - term: "حَاجَتِي"
    text: "ثأري. قال الأَعْلَم: «أي: سأدرك ثأري» [@diwan-zuhayr، ص21]."
  - term: "أَتَّقِي"
    text: "أحتمي. «يقال: اتقاه بحقه، أي جعله بينه وبينه» [@diwan-zuhayr، ص21]."
  - term: "مُلْجِمِ"
    text: "صاحب فرس ملجَم، أي عليه لجامه متهيئًا للحرب. «فمن رواه ملجِم أراد بألف فارس ملجم، ومن رواه ملجَم أراد بألف فرس ملجم» [@ibn-al-anbari، ص276]."
context: "يحكي زُهَيْر خطة حُصَيْن: يقتل، ثم يحتمي بقبيلته. وهذا هو معنى «جَرَّ عَلَيْهِمُ» في البيت 38: جعل قومه درعًا لثأره الخاص، وهم لم يوافقوه. وهو البيت 35 عند الأَعْلَم [@diwan-zuhayr، ص20] والزَّوْزَنِيّ [@zawzani، ص145]."
syntax:
  - "جملة «سَأَقْضِي حَاجَتِي ثُمَّ أَتَّقِي» مقول القول، والسين في «سَأَقْضِي» للمستقبل القريب."
  - "«والملجم نعت الألف، والألف مذكر، فان رأيته في شعر مؤنثا فإنما يذهب بتأنيثه إلى تأنيث الجمع» [@ibn-al-anbari، ص276]. و«مِنْ وَرَائِيَ» صفة أخرى للألف، أي ألف يكونون خلفي."
morphology:
  - "«أَتَّقِي» على «أَفْتَعِل» من «وقى»: أصله «أَوْتَقِي»، قُلبت الواو تاء وأُدغمت في تاء الافتعال."
  - "«مُلْجِم» اسم فاعل من «أَلْجَمَ»، و«مُلْجَم» اسم مفعول منه."
rhetoric:
  thesis: "حديث نفس يكشف الغدر: القتل «حاجة» تُقضى، والقبيلة ستر يُحتمى به."
  devices:
    - title: "الكناية"
      text: "في «بِأَلْفٍ مُلْجِمِ» ذكر الخيل وأراد فرسانها. قال الأَعْلَم: «وإنما يعني في الحقيقة: أصحاب الخيل، فكنى عنهم بالخيل» [@diwan-zuhayr، ص21]."
    - title: "التلطيف"
      text: "سمّى القتل «حَاجَتِي»، كأنه أمر عادي يُقضى ثم يُنصرف عنه. فاللفظ الهادئ يكشف برود الغادر. وهذه قراءتنا."
    - title: "حكاية حديث النفس"
      text: "«وَقَالَ»: القول هنا في النفس لا باللسان، كما فسّره الزَّوْزَنِيّ «في نفسه» [@zawzani، ص145]. فالشاعر يدخل إلى ضمير الغادر ويحكي ما أخفاه، وهو ما وصفه في البيت السابق بـ«مُسْتَكِنَّةٍ»."
  connection: "ثم يحكي التنفيذ: «فَشَدَّ وَلَمْ يُنْظِرْ بُيُوتًا كَثِيرَةً»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَقَالَ / سَأَقْضِي حَا / جَتِي ثُمْ / مَ أَتْتَقِي = فعولُ / مفاعيلن / فعولن / مفاعلن — عَدُوْوِي / بِأَلْفِنْ مِنْ / وَرَائِ / يَ مُلْجِمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر والثانية في العَجُز [@atiq، ص29]. وفُتحت ياء «وَرَائِيَ» للوزن."
variants:
  - reading: "عَدُوِّي بِأَلْفٍ مِنْ وَرَائِيَ مُلْجَمِ"
    status: "رواية عند ابن الأَنْبارِيّ، ومتن الأَعْلَم"
