first: "وَمَا الْحَرْبُ إِلَّا مَا عَلِمْتُمْ وَذُقْتُمُ"
second: "وَمَا هُوَ عَنْهَا بِالْحَدِيثِ الْمُرَجَّمِ"
meaning: "ليست الحرب إلا ما عرفتموه وجرّبتموه بأنفسكم، وما أقوله عنها ليس كلامًا يُرمى بالظن. قال يَعْقُوب: «معناه وما الحرب إلا ما قد جربتم وذقتم، فإياكم أن تعودوا»، و«وما الخبر عنها بحديث يرجم فيه بالظن، ولكن هذا ما شهدتم وباشرتم وعرفتم» [@ibn-al-anbari، ص267]. وقال الزَّوْزَنِيّ: «أي هذا ما شهدت عليه الشواهد الصادقة من التجارب وليس من أحكام الظنون» [@zawzani، ص143]."
vocabulary:
  - term: "ذُقْتُمُ"
    text: "جرّبتم. «الذوق: التجربة» [@zawzani، ص143]."
  - term: "الْمُرَجَّمِ"
    text: "«الذي يرمى فيه بالظن» [@ibn-al-anbari، ص267]. وفي لسان العرب: «ومنه الحديث المرجم، بالتشديد؛ قال زهير»، و«والرجم: القذف بالغيب والظن» [@lisan، ج12 ص228]."
context: "أول صورة الحرب (29–33). بعد الوعيد بحساب الله يذكّرهم زُهَيْر بما رأوه بأعينهم، ثم يصف ما سيكون إن عادوا. قال أبو جَعْفَر: «معناه أن غدرتم ثم عادت الحرب وهي ما قد جربتم وعرفتم فإياكم أن تغدروا» [@ibn-al-anbari، ص267]. وهو البيت 28 عند الأَعْلَم [@diwan-zuhayr، ص18] والزَّوْزَنِيّ [@zawzani، ص143]، وصار شاهدًا عند النحاة، فأورده الرَّضِيّ في شرح الكافية، كما ينقل البَغْدادِيّ: «في باب المصدر على أن ضمير المصدر يعمل في الجار والمجرور» [@khizana، ج3 ص10]."
syntax:
  - "«ما» نافية، و«الحربُ» مبتدأ، و«إلا ما علمتم» خبره بعد استثناء لم يُذكر فيه المستثنى منه، وهو ما يسميه النحاة الاستثناء المفرَّغ؛ والعائد محذوف: «والتقدير: وما الحرب إلا ما علمتموه» [@ibn-al-anbari، ص267]."
  - "وفي مرجع «هُوَ» أقوال جمعها البَغْدادِيّ: هو العلم، لأنه «لما قال إلا ما علمتم دل على العلم»، وعليه الخَطِيب وأبو جَعْفَر النحويّ والأَعْلَم؛ وقال صَعُوداء: «هو ضمير ما»؛ وقال الزَّوْزَنِيّ: «هو ضمير القول لا العلم» [@khizana، ج3 ص10]. وجعله الرَّضِيّ ضمير المصدر: «أي: ما حديثي عنها» [@khizana، ج3 ص10]."
  - "«عَنْهَا» حال عند ابن الأَنْبارِيّ، «ويصلح في قول الكسائي أن تجعل (عنها) من صلة المرجم» [@ibn-al-anbari، ص267]. وقال الأَعْلَم إن «عن» هنا «بدل من الباء» [@diwan-zuhayr، ص18]. والباء في «بِالْحَدِيثِ» زائدة لتوكيد النفي."
morphology:
  - "«المُرَجَّم» اسم مفعول من «رَجَّمَ» بالتضعيف، من الرَّجْم: الرمي بالحجارة، ثم استُعمل في الرمي بالظن [@lisan، ج12 ص228]."
  - "«ذُقْتُم» من «ذاق يذوق»، أجوف واوي: سقطت العين عند اتصال الفعل بالضمير، وضُمّت الفاء دلالة على الواو المحذوفة."
rhetoric:
  thesis: "حجة زُهَيْر هنا التجربة لا الخبر: الحرب ليست قصة تُروى، بل شيء ذاقوه."
  devices:
    - title: "الاستعارة"
      text: "في «ذُقْتُمُ»: جعل الحرب شيئًا يُذاق، فنقل الذوق من الطعام إلى التجربة، كما فسّره الزَّوْزَنِيّ [@zawzani، ص143]. والذوق أخص الحواس بالجسد، فالمعرفة بالحرب عندهم معرفة جسد لا سماع."
    - title: "القصر"
      text: "«وَمَا الْحَرْبُ إِلَّا مَا عَلِمْتُمْ»: قصر الحرب على ما عرفوه بالنفي والاستثناء، فلا حاجة إلى وصفها لمن ذاقها. والقصر: تخصيص شيء بشيء بطريق مخصوص."
    - title: "المقابلة بين العلم والظن"
      text: "قابل بين «عَلِمْتُمْ وَذُقْتُمُ» في الصدر و«الْحَدِيثِ الْمُرَجَّمِ» في العَجُز: يقين التجربة في مقابل رجم الظنون."
  connection: "ثم يصف ما يكون إن أثاروها: «مَتَى تَبْعَثُوهَا تَبْعَثُوهَا ذَمِيمَةً»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَلْ حَرْ / بُ إِلْلَا مَا / عَلِمْتُمْ / وَذُقْتُمُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَمَا هُ / وَ عَنْهَا بِلْ / حَدِيثِلْ / مُرَجْجَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت ضمة الميم في «ذُقْتُمُ» آخر الصدر. ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في العَجُز فصارت «فعولُ» [@atiq، ص29]."
