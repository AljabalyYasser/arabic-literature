first: "بِهَا الْعِينُ وَالْآرَامُ يَمْشِينَ خِلْفَةً"
second: "وَأَطْلَاؤُهَا يَنْهَضْنَ مِنْ كُلِّ مَجْثَمِ"
meaning: "سكن الدارَ بعد أهلها بقرُ الوحش والظباء البيض، يمضي منها قطيع فيأتي قطيع، وأولادها الصغار تنهض من مرابضها إلى أمهاتها لترضع. قال يعقوب: «وإنما أراد أن الدار أقفرت حتى صار فيها ضروب من الوحش» [@ibn-al-anbari، ص239]."
vocabulary:
  - term: "الْعِينُ"
    text: "«العين: البقر، واحدها أعين وعيناء، وإنما سميت عيناء لسعة عينها» [@ibn-al-anbari، ص239]، والمراد بقر الوحش."
  - term: "الْآرَامُ"
    text: "«ظباء بيض خوالص البياض، واحدها ريم وريمة، ومساكنها الرمل» [@ibn-al-anbari، ص239]."
  - term: "خِلْفَةً"
    text: "قال يعقوب: «معناه إذا مضى فوج جاء آخر» [@ibn-al-anbari، ص239]. وحكى عن بعض أهل اللغة: «خلفة معناه مختلفة، يريد أنها تردد في كل وجه»، وقال أبو جَعْفَر: «معناه في أمن وخصب» [@ibn-al-anbari، ص240]."
  - term: "أَطْلَاؤُهَا"
    text: "جمع طَلًا: «ولد البقرة والظبي والشاة، ويقال له طلا من ساعة يولد إلى نصف شهر» [@ibn-al-anbari، ص240]."
  - term: "مَجْثَمِ"
    text: "«للغزال والأرنب والطائر: موضعه الذي يجثم فيه»، و«قال أبو عبيدة: الجثوم للطائر والإنسان بمنزلة البروك للإبل» [@ibn-al-anbari، ص240]. وعند الأَعْلَم: «المربض» [@diwan-zuhayr، ص10]."
syntax:
  - "«بِهَا» خبر مقدم، و«الْعِينُ» مبتدأ مؤخر، و«الْآرَامُ» معطوف عليه. وجملة «يَمْشِينَ» حال منهما."
  - "«خِلْفَةً» حال؛ قال التِّبْرِيزِيّ: «و (خلفة) في موضع الحال بمعنى مختلفات» [@tabrizi-ashr، ص104]."
  - "«وَأَطْلَاؤُهَا» مبتدأ، وجملة «يَنْهَضْنَ» خبره، و«مِنْ كُلِّ مَجْثَمِ» متعلق بـ«يَنْهَضْنَ»."
morphology:
  - "«الْعِين» جمع «أَعْيَن» و«عَيْناء»، قال التِّبْرِيزِيّ: «والأصل أن يجمع على فُعل كأحمر وحمر، إلا أن العين كسرت لمجاورتها الياء» [@tabrizi-ashr، ص104]، فأصلها «عُيْن»."
  - "«مَجْثَم» بفتح الثاء وكسرها: «فمن فتح الثاء قال المجثم اسم من جثم يجثم... ومن قال مجثِم بكسر الثاء قال: هو الاسم من جثَم يجثِم» [@ibn-al-anbari، ص240]. وقال الزَّوْزَنِيّ إن «المفعل» من «فعَل يفعِل» «إذا كان مفتوح العين كان مصدرًا، وإذا كان مكسور العين كان موضعًا» [@zawzani، ص134]."
  - "«خِلْفة» على «فِعْلة»، ومنه قوله تعالى: «وَهُوَ الَّذِي جَعَلَ اللَّيْلَ وَالنَّهَارَ خِلْفَةً»، قال ابن الأَنْبارِيّ: «معناه أن أحدهما يخلف الآخر» [@ibn-al-anbari، ص239]."
rhetoric:
  thesis: "الدار خالية من الناس، ولكنها غير ميتة: يعمرها الوحش وأولاده. فالحياة باقية، وأهل الدار وحدهم هم الغائبون."
  devices:
    - title: "الكناية"
      text: "الكناية عند عبد القاهر أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. ولم يقل زُهَيْر إن الدار خلت من أهلها، بل قال «بِهَا الْعِينُ وَالْآرَامُ يَمْشِينَ»؛ والوحش لا يأمن في دار فيها ناس، فأمنها دليل خلوّها. وبهذا فسّره الأَعْلَم: «وإنما يصف خلوّ الدار من الأنيس، وأنها أقفرت حتى صار فيها ضروب من الوحش» [@diwan-zuhayr، ص10]."
    - title: "حركة الأمهات والأولاد"
      text: "في «يَنْهَضْنَ مِنْ كُلِّ مَجْثَمِ» مشهد دقيق شرحه الأَعْلَم: الأمهات «يُنِمن أولادهنّ، إذا أرضعنهنّ، ثم يرعين. فإذا ظننّ أنّ أولادهنّ قد أنفدن ما في أجوافهنّ من اللبن، صوّتن بأولادهنّ، فينهضن من مجاثمهنّ للأصوات، ليرضعن» [@diwan-zuhayr، ص10]. وقال أبو جَعْفَر: «هذا مثل بيت ذي الرمة» [@ibn-al-anbari، ص240]."
    - title: "المقابلة بين الماضي والحاضر"
      text: "النساء اللواتي كنّ في الدار حلّ محلّهن بقر واسع العيون وظباء بيض، وهي صفات يوصف بها النساء في الشعر. فالوحش يسكن الدار ويذكّر بأهلها معًا. وهذه قراءتنا."
  connection: "ثم يقول إنه وقف بهذه الدار بعد عشرين سنة، فلم يعرفها إلا بعد جهد [@ibn-al-anbari، ص241]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "بِهَلْعِي / نُ وَلْآرَا / مُ يَمْشِي / نَ خِلْفَتَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَأَطْلَا / ؤُهَا يَنْهَضْ / نَ مِنْ كُلْ / لِ مَجْثَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "التفعيلات تامة إلا العروض والضرب، وهما «مفاعلن» على ما يلزم في هذه القصيدة. والعروض آخر تفعيلة في الصدر، والضرب آخر تفعيلة في العجز. وهمزة الوصل في «الْعِينُ» و«الْآرَامُ» تسقط في النطق [@atiq، ص29]."
context: "يتمّ وصف الدار الخالية، ويمهّد للبيت التالي: دار تغيّرت إلى هذا الحد لا تُعرف إلا بعد توهّم."
variants:
  - reading: "مِنْ كُلِّ مَجْثِمِ"
    status: "رواية أخرى"
    note: "بكسر الثاء: «ويروى (مجثم) بكسر الثاء» [@ibn-al-anbari، ص240]. وبقاعدة الزَّوْزَنِيّ المذكورة في الصرف يكون المكسور اسمًا للموضع، والمفتوح مصدرًا [@zawzani، ص134]."
  - reading: "وَالْأَرْآمُ"
    status: "رواية الزَّوْزَنِيّ"
    note: "بتقديم الراء على الهمزة [@zawzani، ص134]، وهما جمعان للرِّئْم."
