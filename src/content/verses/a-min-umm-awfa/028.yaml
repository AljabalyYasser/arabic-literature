first: "يُؤَخَّرْ فَيُوضَعْ فِي كِتَابٍ فَيُدَّخَرْ"
second: "لِيَوْمِ الْحِسَابِ أَوْ يُعَجَّلْ فَيُنْقَمِ"
meaning: "ما تكتمونه يؤخَّر فيُكتب في كتاب ويُحفظ ليوم الحساب، أو يُعجَّل عقابه في الدنيا. قال يَعْقُوب: «معناه لا تكتمن الله تعالى ما في نفوسكم فيؤخر ذلك إلى الحساب فتحاسبوا به ويعجل في الدنيا لكم النقمة به» [@ibn-al-anbari، ص266]. وقال الزَّوْزَنِيّ: «يريد لا مخلص من عقاب الذنب آجلا أو عاجلًا» [@zawzani، ص143]."
vocabulary:
  - term: "يُؤَخَّرْ"
    text: "يُرجأ العقاب عليه، فلا يُعجَّل [@zawzani، ص143]."
  - term: "يُدَّخَرْ"
    text: "يُحفظ ويُخبأ. «أي يؤخر عقابه ويرقم في كتاب فيدخر ليوم الحساب» [@zawzani، ص143]."
  - term: "يَوْمِ الْحِسَابِ"
    text: "يوم يحاسَب الناس على أعمالهم، أي يوم القيامة."
  - term: "يُنْقَمِ"
    text: "يُعاقَب. «يقال: نقم منه من باب ضرب بمعنى عاقبه وانتقم» [@khizana، ج3 ص10]."
context: "هذا البيت عند القدماء شاهد على أن زُهَيْرًا كان يؤمن بالبعث. قال ابن قُتَيْبَة: «وكان زهير يتألّه ويتعفّف فى شعره. ويدلّ شعره على إيمانه بالبعث. وذلك قوله»، وأنشد هذا البيت [@ibn-qutayba، ج1 ص139]. ومعنى «يتألّه»: يتعبّد ويتنسّك. وروى المَرْزُبانِيّ أن شيوخًا عابوا بيته «رأيت المنايا» (57)، وقالوا: «وهو بعيد من أبياته التى يقول فى بعضها»، وأنشدوا هذا البيت [@muwashshah، ص51]؛ فهو عندهم دليل على تديّنه. أما شوقي ضيف فيعلّق الحكم على صحة النسبة: «وإذا صحت نسبة البيتين إليه كان ذلك دليلا على أنه أحد من تحنفوا فى الجاهلية»، ويرجّح أنه «لم يفارق دين قومه» [@deif، ج1 ص303]. وهو البيت 27 عند الأَعْلَم [@diwan-zuhayr، ص18] والزَّوْزَنِيّ [@zawzani، ص142]."
syntax:
  - "«ويؤخر مجزوم على الاتباع ليعلم» [@ibn-al-anbari، ص266]، أي هو بدل من «يَعْلَمِ» في البيت السابق، ومثّل له ابن الأَنْبارِيّ بقوله تعالى: {وَمَن يَفْعَلْ ذَلِكَ يَلْقَ أَثَاماً يُضَاعَفْ لَهُ الْعَذَابُ}، فـ«يضاعف» بدل من «يلق». «وموضع فيدخر ويعجل وينقم نسق على يؤخر» [@ibn-al-anbari، ص266]."
  - "وأنكر بعض النحويين البدل هنا، لأن «مضاعفة العذاب هو لقي الأثام، وليس التأخير العلم»، «وقال بعض النحويين (يؤخر) جواب النهي» [@tabrizi-ashr، ص115–116]، أي جواب «فلا تكتمن»."
  - "قال البَغْدادِيّ: «جميع الأفعال بالبناء للمفعول ما عدا الأخير» [@khizana، ج3 ص10]؛ فهو يقرأ آخرها «فَيَنْقِمِ» بالبناء للفاعل، أي فينتقم الله."
morphology:
  - "«يُدَّخَرْ» على «يُفْتَعَل» من «ذخر»: أصله «يُذْتَخَر»، قُلبت التاء دالًا ثم أُدغمت الذال فيها فصارت دالًا مشددة."
  - "«يُؤَخَّرْ» و«يُعَجَّلْ» على «يُفَعَّل»، مبنيان للمجهول، والتضعيف فيهما للتعدية."
  - "«الحِساب» مصدر «حاسَب» على «فِعال»."
rhetoric:
  thesis: "لا مهرب للكاتم: إما حساب مؤجَّل في كتاب محفوظ، وإما عقاب معجَّل."
  devices:
    - title: "الطباق"
      text: "الطباق: الجمع بين معنيين متضادين. وهو في «يُؤَخَّرْ ... يُعَجَّلْ»: قسم العاقبة قسمين لا ثالث لهما، فسدّ على الكاتم كل طريق."
    - title: "تتابع الأفعال"
      text: "في الشطر الأول ثلاثة أفعال يربطها الفاء: «يُؤَخَّرْ فَيُوضَعْ ... فَيُدَّخَرْ»، فكأنها خطوات تُسجَّل واحدة بعد واحدة، ثم يأتي «يُعَجَّلْ فَيُنْقَمِ» قصيرًا سريعًا كالعقاب المعجّل نفسه. وهذه قراءتنا."
    - title: "صورة الكتاب"
      text: "«فِي كِتَابٍ ... لِيَوْمِ الْحِسَابِ»: العمل يُكتب ويُحفظ إلى يوم يُحاسَب فيه صاحبه. ولهذه الصورة جعل ابن قُتَيْبَة البيت دليلًا على إيمانه بالبعث [@ibn-qutayba، ج1 ص139]."
  connection: "ثم ينتقل من الوعيد إلى التجربة: «وَمَا الْحَرْبُ إِلَّا مَا عَلِمْتُمْ وَذُقْتُمُ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يُؤَخْخَرْ / فَيُوضَعْ فِي / كِتَابِنْ / فَيُدْدَخَرْ = فعولن / مفاعيلن / فعولن / مفاعلن — لِيَوْمِلْ / حِسَابِ أَوْ / يُعَجْجَلْ / فَيُنْقَمِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «مفاعيلن» الثانية في العَجُز فصارت «مفاعلن»، وهو جائز في حشو الطويل [@ahda-sabil، ص28]."
