first: "أَثَافِيَّ سُفْعًا فِي مُعَرَّسِ مِرْجَلٍ"
second: "وَنُؤْيًا كَجِذْمِ الْحَوْضِ لَمْ يَتَثَلَّمِ"
meaning: "عرفتُ الدار بأحجار القدر السود في موضعها الذي كانت تُنصب فيه، وبحاجز التراب الذي كان حول البيت، قد ذهب أعلاه وبقي أصله سالمًا كأصل حوض. قال الزَّوْزَنِيّ: «يريد أن هذه الأشياء دلته على أنها دار أم أوفى» [@zawzani، ص135]."
vocabulary:
  - term: "أَثَافِيَّ"
    text: "«الأحجار التي ينصب عليها القدر» [@ibn-al-anbari، ص242]، واحدتها أُثْفِيّة. وفي لسان العرب: «والأُثْفِيَّة: مَا يُوضَعُ عَلَيْهِ القِدْر، تَقْدِيرُهُ أُفْعُولة» [@lisan، ج14 ص113]."
  - term: "سُفْعًا"
    text: "«والسفعة: سواد إلى حمرة» [@ibn-al-anbari، ص242]. وفي لسان العرب: «وَقِيلَ: السَّوَادُ المُشْرَبُ حُمْرة... وَمِنْهُ قِيلَ للأَثافي سُفْعٌ» [@lisan، ج8 ص156]، لأن النار سوّدتها."
  - term: "مُعَرَّسِ مِرْجَلٍ"
    text: "«ومعرس المرجل: موضعه على الأثافي»، و«المرجل: كل قدر يطبخ فيها من حجارة أو حديد أو خزف أو نحاس» [@ibn-al-anbari، ص242–243]. والتعريس: «نزول القوم ليستريحوا؛ وأكثره من آخر الليل» [@ibn-al-anbari، ص243]، ثم استُعير للموضع الذي تُنصب فيه القدر."
  - term: "نُؤْيًا"
    text: "قال يعقوب: «النؤى حاجز يرفع حول البيت من تراب من خارج لئلا يدخل الماء البيت» [@ibn-al-anbari، ص243]. وفي لسان العرب: «الحَفِير حَوْلَ الخِباء أَو الخَيْمة يَدْفَع عَنْهَا السيلَ» [@lisan، ج15 ص301]."
  - term: "جِذْمِ الْحَوْضِ"
    text: "أصله؛ «وجذم البيت: أصله» [@ibn-al-anbari، ص243]. وقال الأَعْلَم: «شبّه ما داخِلَ الحاجز بالحوض، في استدارته» [@diwan-zuhayr، ص11]."
syntax:
  - "في نصب «أَثَافِيَّ» ثلاثة أقوال. عند ابن الأَنْبارِيّ: «والأثافي موضعها نصب بعرفت» [@ibn-al-anbari، ص243]، أي مفعول به لفعل البيت السابق. وعند الزَّوْزَنِيّ: «نصب أثافي على البدل في قوله: عرفت الدار» [@zawzani، ص135]؛ والبدل: اسم يتبع اسمًا قبله ويكون هو المقصود بالحكم. وعند الأَعْلَم نصبها بالتوهّم في البيت السابق، «كما قال النابغة» [@diwan-zuhayr، ص11]، أي بعد أن توهّم أثافيّ."
  - "«والسفع نعتها... والنؤى نسق على الأثافي، والكاف نعت النؤى» [@ibn-al-anbari، ص243]. والنسق: العطف. وجملة «لَمْ يَتَثَلَّمِ» صفة ثانية للنؤي."
  - "قال ابن الأَنْبارِيّ: «والأثافي لا تجرى ولا يلحقها التنوين» [@ibn-al-anbari، ص243]، أي أنها ممنوعة من الصرف لأنها على صيغة منتهى الجموع."
morphology:
  - "«أَثَافِيّ» بالتشديد، ويجوز التخفيف «أَثَافٍ»: «إذا كانت الواحدة مشددة ففي الجمع التثقيل والتخفيف، كقولك أمنية وأماني وأمان» [@ibn-al-anbari، ص241]. ويقول التِّبْرِيزِيّ: «والتخفيف أكثر - وإن كان الأصل التثقيل - لكثرة استعمالهم إياها» [@tabrizi-ashr، ص105]."
  - "«سُفْع» جمع «أَسْفَع» و«سَفْعاء»، على «فُعْل» كأحمر وحُمْر."
  - "«نُؤْي» يُجمع على «أَنْآء» و«نُئِيّ» [@ibn-al-anbari، ص243]."
rhetoric:
  thesis: "الدار تُعرف بأشياء صغيرة: ثلاثة أحجار سوّدتها النار، وحاجز تراب. فما بقي من حياة الناس هو علامتها."
  devices:
    - title: "التشبيه"
      text: "في «كَجِذْمِ الْحَوْضِ» شبّه بقية النؤي بأصل حوض. ووجه الشبه الاستدارة، كما يقول الأَعْلَم: «شبّه ما داخِلَ الحاجز بالحوض، في استدارته» [@diwan-zuhayr، ص11]. وهو من التشبيه الذي يكون «من جهة الصُّورة والشكل» [@asrar، ص90]."
    - title: "النفي الدقيق"
      text: "في «لَمْ يَتَثَلَّمِ» دقة: النؤي ذهب أعلاه، والباقي منه لم ينكسر. قال ابن الأَنْبارِيّ: «يعنى النؤى قد ذهب أعلاه ولم يتثلم ما بقى منه» [@ibn-al-anbari، ص243]. فالشاعر لا يقول إن الأثر سليم كله، بل يحدّد ما بقي منه."
    - title: "علامات الحياة"
      text: "العلامتان من أدوات العيش: القدر التي يُطبخ فيها للأهل والضيف، والحاجز الذي يقي البيت السيل. فالدار تُعرف بما كان يُصنع فيها. وهذه قراءتنا."
  connection: "فلما عرفها بهذه العلامات حيّاها ودعا لها [@ibn-al-anbari، ص243]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَثَافِيْ / يَ سُفْعَنْ فِي / مُعَرْرَ / سِ مِرْجَلِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — وَنُؤْيَنْ / كَجِذْمِلْ حَوْ / ضِ لَمْ يَ / تَثَلْلَمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» في التفعيلة الثالثة من الشطرين، فصارت «فعولُ» [@atiq، ص29]. وجاءت «أَثَافِيَّ» بالتشديد، فالياء المشددة تقوم بمقطعين."
context: "يعدّد العلامات التي عرف بها الدار بعد «التوهم» في البيت السابق، وبه يتمّ وصف الأطلال قبل التحية."
variants:
  - reading: "وَنُؤْيًا كَحَوْضِ الْجُرِّ"
    status: "رواية أخرى"
    note: "«ويروى (كحوض الجر) . والجر: سفح الجبل» [@ibn-al-anbari، ص243]: الحوض المحفور في الأرض الصلبة يبقى دهرًا لا يتغير."
  - reading: "وَنُؤْيًا كَجُدِّ الْحَوْضِ"
    status: "رواية أخرى"
    note: "يذكرها التِّبْرِيزِيّ: «ويروى (ونؤيا كجُدِّ الحوض) والجُدُّ: البئر العتيقة» [@tabrizi-ashr، ص105]."
  - reading: "أَثَافِيَ سُفْعًا"
    status: "رواية أخرى"
    note: "بتخفيف الياء [@tabrizi-ashr، ص105]."
