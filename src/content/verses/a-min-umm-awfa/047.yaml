first: "وَمَنْ يَعْصِ أَطْرَافَ الزِّجَاجِ فَإِنَّهُ"
second: "يُطِيعُ الْعَوَالِي رُكِّبَتْ كُلَّ لَهْذَمِ"
meaning: "من أبى الصلح أطاع الحرب: من عصى أسافل الرماح، وهي علامة السلم، أطاع أعاليها التي رُكّبت فيها الأسنّة الماضية. قال الأَصْمَعِيّ: «من عصى الأمر الصغير صار إلى الأمر الكبير»، وقال أبو عُبَيْدَة: «هذا مثل، يقول: أن الزج ليس يطعن به، وإنما الطعن بالسنان، … فمن أبى الصلح - وهو الزج الذي لا طعن به - أعطى العوالي، وهو التي يطعن بها» [@ibn-al-anbari، ص280–281]. ونقل ابن الأَنْبارِيّ عن غيره: «كانوا إذا لقوا قوما لقوهم بالأزجة ليؤذنوهم أنهم لا يريدون حربهم، فان أبوا قلبوا لهم الأسنة فقاتلوهم» [@ibn-al-anbari، ص281]."
vocabulary:
  - term: "الزِّجَاجِ"
    text: "«جمع زُجّ الرمح: وهو الحديد المركب في أسفله» [@zawzani، ص151]."
  - term: "الْعَوَالِي"
    text: "«جمع عالية، وهي نحو من ذراع من مقدم الرمح» [@ibn-al-anbari، ص281]."
  - term: "يُطِيعُ"
    text: "«ومعنى (يطيع العوالي) أي إذا طعن بها سقط موتا، فكأنه لما مات مطعونا بها مطيع لها» [@ibn-al-anbari، ص281]."
  - term: "لَهْذَمِ"
    text: "«معناه الماضي؛ يقال سنان لهذم ولسان لهذم، سواء» [@ibn-al-anbari، ص281]."
context: "أول الحكمة (47–59) عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ [@tabrizi-ashr، ص124]، وهو متصل بموضوع القصيدة: الدعوة إلى الصلح. ويختلف ترتيب الحكمة بين الروايات: ابن الأَنْبارِيّ والتِّبْرِيزِيّ يبدآنها بهذا البيت ويختمانها بـ«سئمت، رأيت، ومهما، وأعلم»؛ والأَعْلَم والشرح المنسوب إلى ثَعْلَب يبدآنها بـ«سئمت، رأيت، وأعلم»، وهذا البيت عند الأَعْلَم 55 [@diwan-zuhayr، ص27] وفي الشرح المنسوب إلى ثَعْلَب 56 [@sharh-thalab-zuhayr، ص36]؛ وهو عند الزَّوْزَنِيّ 55 أيضًا [@zawzani، ص151]. وكان أهل النظر يقولون في زُهَيْر إنه «أكثرهم أمثالا فى شعره» [@ibn-sallam، ج1 ص64]. ويرى شوقي ضيف أن الأَصْمَعِيّ «كان يشك فيها ويقول إنها لشاعر أنصارى يسمى صرمة»، أي في أبيات الحكمة، وأنه «يظهر أن حكما له اختلطت بحكم لهذا الشاعر، ونستطيع أن نفرد منها له مثل قوله» هذا البيت، لأن «فكرة البيت متصلة بالمعلقة وما تدعو إليه من السلام والاستجابة إلى الصلح» [@deif، ج1 ص325]. ولم نجد في شرح ابن الأَنْبارِيّ ولا شرح الأَعْلَم ولا الشرح المنسوب إلى ثَعْلَب شكًّا في هذه الأبيات."
syntax:
  - "«وموضع من رفع بما عاد من يعص ومعناها الجزاء، ويعص جزم بها علامة الجزم فيه سقوط الياء، والفاء جواب الجزاء» [@ibn-al-anbari، ص281]."
  - "«الْعَوَالِي» مفعول به منصوب، وسُكّنت ياؤه: «وسكن الياء على لغة من يقول رأيت الجواري» [@ibn-al-anbari، ص281]؛ وقال الزَّوْزَنِيّ: «كان حقه أن يقول: يطيع العوالِيَ، بفتح الياء، ولكنّه سكن الياء لإقامة الوزن» [@zawzani، ص151]."
  - "جملة «رُكِّبَتْ» صفة للعوالي: «كأنه قال: فإنه يطيع التي ركبت كل لهذم» [@ibn-al-anbari، ص282]. و«كُلَّ لَهْذَمِ» منصوب على نزع الخافض، ففي الشرح المنسوب إلى ثَعْلَب: «أي: في كل لهذم» [@sharh-thalab-zuhayr، ص36]."
morphology:
  - "«زِجاج» جمع «زُجّ» على «فِعال»، و«عَوالي» جمع «عالية» على «فواعل»."
  - "ومن الزُّجّ فعل: «يقال رمح مزج. إذا عمل له الزج؛ ومنصل، إذا عمل له نصل. ويقال أنصلت السهم، إذا نزعت نصله؛ ونصلته، إذا عملت له نصلا» [@ibn-al-anbari، ص281]."
rhetoric:
  thesis: "أول الحكمة عند ابن الأَنْبارِيّ خلاصة القصيدة: من أبى الصلح لم يبق له إلا الحرب."
  devices:
    - title: "التمثيل"
      text: "لم يقل: من أبى الصلح قاتل، بل جاء بصورة. قال العَسْكَرِيّ: «أراد أن يقول: من أبى الصلح رضى بالحرب، فعدل عن لفظه، وأتى بالتمثيل؛ فجعل الزّج للصلح؛ لأنه مستقبل فى الصلح، والسنان للحرب لأن الحرب به يكون» [@sinaatayn، ص356]. وقال التِّبْرِيزِيّ: «وهذا تمثيل» [@tabrizi-ashr، ص124]. ويرى شوقي ضيف فيه ميل زُهَيْر «إلى إخراج أفكاره ومعانيه فى صور متلاحقة» [@deif، ج1 ص325]. وعبد القاهر الجُرْجانيّ يقول في التمثيل إذا جاء في الوعظ: «كان أشْفَى للصدر، وأدعى إلى الفكر، وأبلغ في التنبيه والزَّجر» [@asrar، ص116]."
    - title: "الطباق"
      text: "«يَعْصِ ... يُطِيعُ»، و«أَطْرَافَ الزِّجَاجِ ... الْعَوَالِي»: عصيان وطاعة، وأسفل الرمح وأعلاه. فالرمح نفسه يحمل الخيارين، ومن رفض طرفه الأسفل جاءه طرفه الأعلى."
    - title: "المثل"
      text: "صار البيت مثلًا، وله نظائر في كلام العرب، منها ما ذكره أبو عُبَيْدَة: «ومثل للعرب (الطعن يظأر) أي يعطف على الصلح» [@ibn-al-anbari، ص281]، وما ذكره العَسْكَرِيّ: «من عصى الصوت أطاع السيف» [@sinaatayn، ص356]."
  connection: "ثم ينتقل من الصلح إلى الوفاء به: «وَمَنْ يُوفِ لَا يُذْمَمْ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ يَعْ / صِ أَطْرَافَزْ / زِجَاجِ / فَإِنْنَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — يُطِيعُلْ / عَوَالِي رُكْ / كِبَتْ كُلْ / لَ لَهْذَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "سُكّنت ياء «الْعَوَالِي» وهي منصوبة، وهي ضرورة نبّه عليها الشراح [@zawzani، ص151]. ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر [@atiq، ص29]."
