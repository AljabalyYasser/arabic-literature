first: "لِحَيٍّ حِلَالٍ يَعْصِمُ النَّاسَ أَمْرُهُمْ"
second: "إِذَا طَرَقَتْ إِحْدَى اللَّيَالِي بِمُعْظَمِ"
meaning: "تُساق الديات لحيٍّ كثير العدد، إذا اجتمع رأيهم على أمر كان عصمة للناس حين تأتي ليلة بأمر عظيم. قال يَعْقُوب: «الحلال: الكثير. والحلة: مائتا بيت تكون في موضع واحد: فيقول: هذه الإبل التي في الدية لحي كثير. وإنما أراد أن يكثرهم ليكثر العقل. وقوله (يعصم الناس أمرهم) معناه إذا ائتمروا أمرا كان عصمة للناس» [@ibn-al-anbari، ص272]. والعقل: الدية. وقال الأَعْلَم: «وأراد بالحي الحلال: حي الساعيين بالصلح، بين عبس وذبيان» [@diwan-zuhayr، ص25]."
vocabulary:
  - term: "حِلَالٍ"
    text: "كثير. وفي لسان العرب: «قال كراع: هي مائة بيت، والجمع حلال؛ قال الأزهري: الحلال جمع بيوت الناس، واحدتها حلة؛ قال: وحي حلال أي كثير» [@lisan، ج11 ص165]. وعند الزَّوْزَنِيّ: «حلال: جمع حال مثل صاحب وصحاب» [@zawzani، ص148]، أي نازلون."
  - term: "يَعْصِمُ"
    text: "يمنع، «كما قال الله عز وجل: (لا عاصمَ اليومَ من أمر الله) ، أي لا مانع» [@ibn-al-anbari، ص272]."
  - term: "طَرَقَتْ"
    text: "«معناه أتت ليلا» [@ibn-al-anbari، ص272]. وفي الشرح المنسوب إلى ثَعْلَب: «ولا يكون الطروق إلا بالليل» [@sharh-thalab-zuhayr، ص34]."
  - term: "بِمُعْظَمِ"
    text: "«بأمر عظيم» عند يَعْقُوب، وقال أبو جَعْفَر: «ومن أراد بمعظم، أي بأمر يعظمه الناس» [@ibn-al-anbari، ص272]."
context: "بعد صورة الحرب يرجع زُهَيْر إلى الذين يؤدون الديات، فيمدح قومهم. ويختلف ترتيب البيت وتاليه بين الروايات: عند ابن الأَنْبارِيّ والتِّبْرِيزِيّ يأتيان بعد صورة الحرب [@tabrizi-ashr، ص118]، وعند الأَعْلَم يتأخران إلى 45–46 بعد «فكلا أراهم» والبيت الزائد «تساق إلى قوم» [@diwan-zuhayr، ص24]، وعند الزَّوْزَنِيّ إلى 44–45 [@zawzani، ص148]، وفي الشرح المنسوب إلى ثَعْلَب هو 46 [@sharh-thalab-zuhayr، ص34]. وعلى ترتيب هؤلاء يتصل مدح الحي بأبيات الديات قبله مباشرة، ثم تبدأ الحكمة."
syntax:
  - "في متعلَّق اللام من «لِحَيٍّ» أقوال. قال التِّبْرِيزِيّ: «واللام في قوله (لحي) متعلقة بقوله: (سعى ساعيا غيظ بن مرة، لحى حلال) وقيل: المعنى اذكر هذا لحى حلال» [@tabrizi-ashr، ص118]، أي بالبيت 16. وفي الشرح المنسوب إلى ثَعْلَب: «أراد: الذي أذكر لحي حلال»، ثم جعل تعليقها بـ«سعى» أجود [@sharh-thalab-zuhayr، ص34]. وعند أبي جَعْفَر: «معناه تصير إليكم الحمالات بسبب هذا الحي الذي يقوم لكم بأخذها» [@ibn-al-anbari، ص272]."
  - "«والحلال نعت الحي، والأمر رفع بيعصم» [@ibn-al-anbari، ص272]، و«النَّاسَ» مفعول به."
  - "«والباء في قوله بمعظم يجوز كونه بمعنى مع وكونه للتعدية» [@zawzani، ص148]."
morphology:
  - "«حِلال» جمع «حِلّة» عند الأزهري [@lisan، ج11 ص165]، وجمع «حالّ» عند الزَّوْزَنِيّ [@zawzani، ص148]."
  - "«مُعْظَم» اسم مفعول من «أَعْظَمَ» على الوجه الذي يجعله أمرًا يعظّمه الناس؛ وعلى قول الزَّوْزَنِيّ هو اسم فاعل «مُعْظِم» من «أعظم الأمر أي سار إلى حال العظم» [@zawzani، ص148]."
rhetoric:
  thesis: "الديات لا تُساق لقوم ضعاف، بل لحيٍّ كثير يلجأ إليه الناس في الشدائد؛ فكثرتهم تكثر الدية، ورأيهم عصمة لغيرهم."
  devices:
    - title: "التفخيم بالإبهام"
      text: "«إِحْدَى اللَّيَالِي»: لم يسمِّ الليلة ولا المصيبة، فصار الإبهام تهويلًا. قال الأَعْلَم: «أراد ليلة من الليالي. وفي الكلام معنى التفخيم والتعظيم، كما يقال: أصابته إحدى الدواهي، أي: داهية شديدة» [@diwan-zuhayr، ص24–25]."
    - title: "المجاز العقلي"
      text: "في «طَرَقَتْ إِحْدَى اللَّيَالِي بِمُعْظَمِ» أسند المجيء بالمصيبة إلى الليلة، والليلة زمانها لا فاعلها. وإسناد الفعل إلى زمانه أو مكانه أو سببه هو ما يسميه البلاغيون المجاز العقلي. واختار «طرقت»، والطروق لا يكون إلا ليلًا [@sharh-thalab-zuhayr، ص34]، فالمصيبة تأتي بغتة كالطارق."
    - title: "الإسناد إلى الرأي"
      text: "«يَعْصِمُ النَّاسَ أَمْرُهُمْ»: جعل العاصم «أمرهم»، أي رأيهم، لا سيوفهم؛ فقوتهم في التدبير والإصلاح، وهذا ما يناسب مدح الساعين بالصلح."
  connection: "ثم يصف منعتهم: لا يُدرك عندهم ثأر، ولا يُسلَم من جنى عليهم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "لِحَيْيِنْ / حِلَالِنْ يَعْ / صِمُنْ نَا / سَ أَمْرُهُمْ = فعولن / مفاعيلن / فعولن / مفاعلن — إِذَا طَ / رَقَتْ إِحْدَلْ / لَيَالِي / بِمُعْظَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في العَجُز فصارت «فعولُ» [@atiq، ص29]."
variants:
  - reading: "إِذَا نَزَلَتْ إِحْدَى اللَّيَالِي بِمُعْظَمِ"
    status: "نص ابن الأَنْبارِيّ في المكتبة الشاملة"
    note: "كذا في نص البيت، لكن شرحه يفسّر «طرقت»: «وقوله (إذا طرقت) معناه أتت ليلا» [@ibn-al-anbari، ص272]، وبها البيت عند التِّبْرِيزِيّ [@tabrizi-ashr، ص118] والزَّوْزَنِيّ [@zawzani، ص148] وفي لسان العرب [@lisan، ج11 ص165]. فأثبتنا ما يفسّره الشرح."
  - reading: "إِذَا طَلَعَتْ إِحْدَى اللَّيَالِي بِمُعْظَمِ"
    status: "متن الأَعْلَم"
    note: "[@diwan-zuhayr، ص24]."
  - reading: "إِذَا طَرَقَتْ إِحْدَى اللَّيَالِي بِمُعْظِمِ"
    status: "وجه في الضبط"
    note: "بكسر الظاء، على تفسير الزَّوْزَنِيّ: «أعظم الأمر أي سار إلى حال العظم» [@zawzani، ص148]؛ وفي شرح ابن الأَنْبارِيّ ما يدل على الوجهين [@ibn-al-anbari، ص272]."
