first: "فَشَدَّ وَلَمْ يُنْظِرْ بُيُوتًا كَثِيرَةً"
second: "لَدَى حَيْثُ أَلْقَتْ رَحْلَهَا أُمُّ قَشْعَمِ"
meaning: "فحمل حُصَيْن على الرجل فقتله، ولم يؤخّر أهل بيته، عند الموضع الذي ألقت فيه المنية أو الحرب رحلها. قال أبو جَعْفَر: «معناه لم يؤخر أهل بيت ورد في قتله، لكنه عجل فقتله» [@tabrizi-ashr، ص121–122]. وعلى رواية الأَصْمَعِيّ «ولم تفزع بيوت كثيرة» يقول ابن الأَنْبارِيّ: «يقول: شد على عدوه وحده فقتله ولم يفزع العامة بطلب واحد - يريد بذلك تملقهم وألا يغضبوا - وإنما قصد لثأره ولم يردكم، فاقبلوا الدية والصلح ودعوا الحرب» [@ibn-al-anbari، ص277]."
vocabulary:
  - term: "شَدَّ"
    text: "حمل عليه. «الشدة: الحملة، وقد شد عليه يشد شدًّا» [@zawzani، ص146]."
  - term: "يُنْظِرْ"
    text: "«ينظر: يؤخر» [@tabrizi-ashr، ص121]."
  - term: "أَلْقَتْ رَحْلَهَا"
    text: "نزلت واستقرت، فالمسافر يلقي رحله حيث ينزل. قال الزَّوْزَنِيّ: «وملقى الرحل: المنزل؛ لأن المسافر يلقي به رحله، أراد عند منزل المنية» [@zawzani، ص146]."
  - term: "أُمُّ قَشْعَمِ"
    text: "في شرح ابن الأَنْبارِيّ: «الحرب الشديدة»، «ويقال أم قشعم للمنية. وقال أبو عبيدة: أم قشعم: العنكبوت» [@ibn-al-anbari، ص277]. وفي لسان العرب: «وأم قشعم: الحرب، وقيل: المنية، وقيل: الضبع، وقيل: العنكبوت، وقيل: الذلة؛ وبكل فسر قول زهير» [@lisan، ج12 ص485]."
context: "لحظة الفعل في قصة حُصَيْن. وعلى رواية الأَصْمَعِيّ، وهي متن الأَعْلَم، يخدم البيت غاية القصيدة: الجاني رجل واحد قتل رجلًا واحدًا، فلا موجب لأن تعود الحرب. قال الأَعْلَم: «وإنما أراد بقوله هذا ألاّ يفسدوا صلحهم، بفعله» [@diwan-zuhayr، ص21]. وعلى قول أبي عُبَيْدَة في «أم قشعم»: «أي شد عليه بمضيعة فقتله» [@ibn-al-anbari، ص277]، أي في أرض خالية. وهو البيت 36 عند الأَعْلَم [@diwan-zuhayr، ص21] والزَّوْزَنِيّ [@zawzani، ص146]."
syntax:
  - "«وموضع حيث خفض بلدى، والأم ترتفع بألقت، والرحل منصوب به» [@ibn-al-anbari، ص277]."
  - "«حَيْثُ» مبنية على الضم. وفي علة ضمها قولان نقلهما ابن الأَنْبارِيّ: قال الكسائي: «لأن أصلها حوث فعدلت عن الواو إلى الياء وجعلت ضمة الثاء خلفا من الواو»، «وقال الفراء: ضمت لتضمنها معنى المحلين» [@ibn-al-anbari، ص277]."
  - "«بُيُوتًا» مفعول «يُنْظِرْ»، والمراد أهلها: «ومن روى: (ولم ينظر بيوتا) أراد ولم ينظر حصين بيوتا» [@ibn-al-anbari، ص277]."
morphology:
  - "«قَشْعَم»: «وقشعم فعلم، الميم زائدة، هو من قشعت الريح التراب فانقشع» [@tabrizi-ashr، ص122]، أي وزنه «فَعْلَم»."
  - "«يُنْظِرْ» مضارع «أَنْظَرَ» بمعنى أمهل وأخّر، مجزوم بـ«لم»."
rhetoric:
  thesis: "ضربة واحدة في موضع الموت: حُصَيْن لا يمهل، والموت قد نزل في المكان قبله."
  devices:
    - title: "الاستعارة"
      text: "في «أَلْقَتْ رَحْلَهَا أُمُّ قَشْعَمِ» جعل المنية أو الحرب مسافرة تحطّ رحلها حيث تنزل. لم يذكر المسافر، بل أعطى المنية فعله، فهي من الضرب الذي يجعل فيه عبد القاهر الجُرْجانيّ «للشيءِ الشيءَ ليس له» [@dalail، ص67]. والمعنى: حمل عليه حيث استقرّ الموت، فلا نجاة."
    - title: "الكناية"
      text: "«أُمُّ قَشْعَمِ» كنية لا اسم، والكنى من هذا النوع تُطلق على الشدائد تهويلًا. وتعدد الأقوال فيها، من الحرب إلى المنية إلى العنكبوت [@lisan، ج12 ص485]، يوسّع الصورة ولا يضيّقها."
    - title: "التهوين"
      text: "على رواية «وَلَمْ تَفْزَعْ بُيُوتٌ كَثِيرَةٌ» يصغّر الشاعر الحادثة عمدًا: لم يعلم بها أكثر الناس. وابن الأَنْبارِيّ يرى فيه قصدًا: «يريد بذلك تملقهم وألا يغضبوا» [@ibn-al-anbari، ص277]."
  connection: "ثم يصف الذي شدّ عليه حُصَيْن، أو الجيش الذي احتمى به، بأنه أسد تام السلاح."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَشَدْدَ / وَلَمْ يُنْظِرْ / بُيُوتَنْ / كَثِيرَتَنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — لَدَى حَيْ / ثُ أَلْقَتْ رَحْ / لَهَا أُمْ / مُ قَشْعَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر [@atiq، ص29]."
