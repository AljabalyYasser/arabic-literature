first: "وَعَالَيْنَ أَنْمَاطًا عِتَاقًا وَكِلَّةً"
second: "وِرَادَ الْحَوَاشِي لَوْنُهَا لَوْنُ عَنْدَمِ"
meaning: "ورفعن على الإبل فُرُشًا كريمة وسترًا رقيقًا، حواشيها حمراء كلون العَنْدَم. قال أبو جَعْفَر: «معناه رفعن الأنماط والكلل عن الإبل التي ركبها الظعن، وسويت لهن الأنماط، وسترن بالكلل» [@ibn-al-anbari، ص246]."
vocabulary:
  - term: "عَالَيْنَ"
    text: "رفعن، قال يعقوب: «معناه طرحن المتاع أنماطا» [@ibn-al-anbari، ص246]."
  - term: "أَنْمَاطًا"
    text: "جمع نَمَط، وفي لسان العرب: «النمَطُ: ظِهارةُ فِرَاشٍ مَا» [@lisan، ج7 ص417]، أي الوجه الظاهر من الفراش. وقال أبو جَعْفَر: «الأنماط تفرش لهن في خدورهن» [@ibn-al-anbari، ص247]."
  - term: "عِتَاقًا"
    text: "كرامًا، «العتاق الكرام الواحد عتيق» [@zawzani، ص136]."
  - term: "كِلَّةً"
    text: "«الكلّة: الستر الرقيق، والجمع الكلل» [@zawzani، ص136]."
  - term: "وِرَادَ الْحَوَاشِي"
    text: "«معناه لونها إلى الحمرة، أراد إنه أخلص الحاشية بلون واحد، لم يعملها بغير الحمرة» [@ibn-al-anbari، ص246]."
  - term: "عَنْدَمِ"
    text: "«و (العندم) : البقم» [@ibn-al-anbari، ص247]، وهو صبغ أحمر. وقال أبو جَعْفَر: «العندم: ثمر نبت لا ساق له، ينبت في أصل الطلح كهيئة اللبلاب، له ثمرة حمراء» [@ibn-al-anbari، ص247]. وفي لسان العرب: «العَنْدَمُ: دَمُ الأَخَوَيْنِ... وَقَالَ أَبو عَمْرٍو: العَنْدَمُ شَجَرٌ أَحمر» [@lisan، ج12 ص430]."
syntax:
  - "«وعالين، وظهرن، ووركن، نسق على جعلن، وفيه ضمير الظعائن» [@ibn-al-anbari، ص248]. و«أَنْمَاطًا» مفعول به، و«عِتَاقًا» صفته، و«كِلَّةً» معطوفة على «أَنْمَاطًا»."
  - "«والوراد منصوب على النعت للكلة» [@ibn-al-anbari، ص247]، وجملة «لَوْنُهَا لَوْنُ عَنْدَمِ» صفة ثانية."
  - "سؤال في النعت: الكِلّة مفردة و«وِراد» جمع. أجاب ابن الأَنْبارِيّ: «وراد على لفظ واحد، وهو على مثال كتاب وحمار، فكان بمنزلة قولك مررت برجل كرام الآباء» [@ibn-al-anbari، ص247]؛ أي أن «فِعال» يشبه أوزان المفرد فجاز أن يُنعت به المفرد."
morphology:
  - "«وِرَاد» جمع «وَرْد»، وهو الأحمر [@diwan-zuhayr، ص12]، على «فِعال»."
  - "«عَالَيْنَ» على «فاعَلَ» بمعنى «أَفْعَلَ»، قال الزَّوْزَنِيّ: «والمعالاة قد تكون بمعنى الإعلاء» [@zawzani، ص136]."
  - "«أَنْمَاط» جمع «نَمَط» على «أَفْعال»، و«عِتَاق» جمع «عَتِيق» على «فِعال»."
rhetoric:
  thesis: "الهوادج مزينة بالأحمر: ثياب كريمة وستر رقيق، وكلها دليل على نعمة أهلها. فالرحيل موكب لا هرب."
  devices:
    - title: "التشبيه البليغ"
      text: "في «لَوْنُهَا لَوْنُ عَنْدَمِ» شبّه لون الحواشي بلون العندم دون أداة، فجعله هو. والتشبيه البليغ: ما حُذفت منه الأداة ووجه الشبه. وهو من التشبيه في اللون الذي يمثّل له عبد القاهر بـ«تشبيه الخدود بالورد» [@asrar، ص90]."
    - title: "اللون الواحد"
      text: "في «وِرَادَ الْحَوَاشِي» يحدّد الشاعر موضع اللون: الحواشي. وقال أبو جَعْفَر: «أراد أنها وراد كلها. وقال: الأنماط كلها حمر» [@ibn-al-anbari، ص247]. والأحمر لون الترف في وصف الظعائن، وسيعود في البيت 12 مع فتات العهن."
    - title: "دلالة الترف"
      text: "قال أبو جَعْفَر في وصف هذه المراكب: «يصف نعمتهن وأنهن ملوك» [@ibn-al-anbari، ص248]. فالشاعر يرفع شأن نساء قومه بما يحملن من ثياب."
  connection: "ثم يقول إنهن خرجن من وادي السُّوبان ثم قطعنه، على رحال جديدة واسعة [@ibn-al-anbari، ص248]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَعَالَيْ / نَ أَنْمَاطَنْ / عِتَاقَنْ / وَكِلْلَتَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وِرَادَلْ / حَوَاشِي لَوْ / نُهَا لَوْ / نُ عَنْدَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "التفعيلات تامة إلا العروض والضرب، وهما «مفاعلن» [@atiq، ص29]."
context: "بعد طريق الظعائن يصف مراكبهن. وموضع البيت عند الأَعْلَم بعد «تبصّر خليلي» مباشرة [@diwan-zuhayr، ص11]."
variants:
  - reading: "عَلَوْنَ بِأَنْطَاكِيَّةٍ فَوْقَ عِقْمَةٍ ... وِرَادٍ حَوَاشِيهَا مُشَاكِهَةِ الدَّمِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«وروى الأصمعي: عَلَون بإنطاكيَّة فوق عِقْمةٍ ... وِرادٍ حَواشيها مشاكِهةَ الدَّمِ»؛ والأنطاكية «أنماط توضع على الخدور، نسبها إلى إنطاكية. وقال: كل شيء جاء من الشام فهو عندهم أنطاكي» [@ibn-al-anbari، ص246–247]. والعِقْمة: ضرب من الوشي."
  - reading: "عَلَوْنَ بِأَنْمَاطٍ عِتَاقٍ وَكِلَّةٍ ... وِرَادٍ حَوَاشِيهَا مُشَاكِهَةِ الدَّمِ"
    status: "رواية الأَعْلَم والزَّوْزَنِيّ والشرح المنسوب إلى ثَعْلَب"
    note: "قال الأَعْلَم: «أي: طرحوا على أعلى المتاع أنماطاً، وهي التي تُفترش»، و«مشاكهة الدم»: «يُشبه لونُها لونَ الدم» [@diwan-zuhayr، ص12]. ويذكر الشرح المنسوب إلى ثَعْلَب رواية ابن الأَنْبارِيّ أيضًا: «وعالَيْنَ أنماطاً» [@sharh-thalab-zuhayr، ص19]. وعند الزَّوْزَنِيّ: «الباء في قوله: علون بأنماط، للتعدية» [@zawzani، ص136]."
