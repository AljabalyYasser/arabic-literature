first: "فَأَصْبَحْتُمَا مِنْهَا عَلَى خَيْرِ مَوْطِنٍ"
second: "بَعِيدَيْنِ فِيهَا مِنْ عُقُوقٍ وَمَأْثَمِ"
meaning: "فصرتما من هذا الأمر في خير منزلة، بعيدين عن قطيعة الرحم وعن الإثم. قال الأَعْلَم: «أي: سعيتما في الصلح بين عبس وذبيان، ووصلتما الرحم، ولم تعقّا. ولا أثمتما» [@diwan-zuhayr، ص16]. وقال ابن الأَنْبارِيّ: «معناه: لا تركبان منها ما لا يحل لكما» [@ibn-al-anbari، ص262]."
vocabulary:
  - term: "مَوْطِنٍ"
    text: "المنزلة، وعند الأَعْلَم: «على خير منزلة، وأعلى رتبة» [@diwan-zuhayr، ص16]."
  - term: "عُقُوقٍ"
    text: "«العقوق: قطيعة الرحم» [@tabrizi-ashr، ص113]. وفي لسان العرب: «وعَقَّ وَالِدَيْهِ: قَطَعَهُمَا وَلَمْ يَصِلْ رَحِمَه مِنْهُمَا، وَقَدْ يُعَمُّ بِلَفْظِ العُقُوقِ جَمِيعَ الرَّحِمِ» [@lisan، ج10 ص256]. والمتحاربون من عبس وذبيان إخوة، فالحرب بينهم عقوق."
  - term: "مَأْثَمِ"
    text: "«المأثم: الإثم» [@zawzani، ص140]."
syntax:
  - "«ونصب بعيدين على الحال، وعلى خبر أصبحتما» [@ibn-al-anbari، ص262]: فإما أن يكون «عَلَى خَيْرِ مَوْطِنٍ» خبر «أصبح» و«بَعِيدَيْنِ» حالًا، كما يقول التِّبْرِيزِيّ [@tabrizi-ashr، ص113]، وإما أن يكونا خبرين، و«بعيدين: خبر بعد خبر» عند البَغْدادِيّ [@khizana، ج3 ص8]."
  - "اختُلف في الضمير في «مِنْهَا» و«فِيهَا». فعند الأَعْلَم والتِّبْرِيزِيّ للحرب: «منها: من الحرب» [@tabrizi-ashr، ص113]، وعند الزَّوْزَنِيّ للسلم: «والضمير في منها يعود إلى السلم، يذكر ويؤنث» [@zawzani، ص140]."
  - "«مِنْ» في «مِنْهَا» عند البَغْدادِيّ «للبدل» [@khizana، ج3 ص8]، أي: أصبحتما بدل الحرب على خير موطن."
morphology:
  - "«مَأْثَم» مصدر ميمي من «أَثِمَ»، على «مَفْعَل». ويفرّق الزَّوْزَنِيّ بين «آثمه» أي «صيره ذا إثم» و«تأثّم» أي «تجنب الإثم» [@zawzani، ص140]."
  - "«عُقُوق» مصدر «عَقَّ يَعُقُّ» على «فُعُول»."
  - "«مَوْطِن» اسم مكان من «وَطَنَ» على «مَفْعِل»، استُعمل للمنزلة."
rhetoric:
  thesis: "مدح بالنتيجة: خرج السيدان من الحرب لا بالغنيمة، بل بالبراءة من الإثم وبصلة الرحم."
  devices:
    - title: "المجاز في «مَوْطِنٍ»"
      text: "الموطن مكان، وأراد به المنزلة الأخلاقية. فالسيدان «أصبحا» في مكان، كأن الخُلُق أرض يقيم فيها الإنسان. وفسّره الأَعْلَم بـ«خير منزلة، وأعلى رتبة» [@diwan-zuhayr، ص16]."
    - title: "العقوق في القبيلة"
      text: "اختار لفظ «عُقُوقٍ»، وأصله في قطيعة الوالدين، ليصف حربًا بين قبيلتين. فجعل عبسًا وذبيان أسرة واحدة، والقتال بينهما قطيعة رحم. وفسّره الزَّوْزَنِيّ بـ«عقوق الأقارب والإثم بقطيعة الرحم» [@zawzani، ص140]."
    - title: "المدح بالنفي"
      text: "الشطر الثاني يمدح بما لم يفعلاه: لم يعقّا ولم يأثما. وهذا يهيّئ لما سيقوله في البيتين 24–25: إنهما غرما دماء لم يسفكاها. وهذه قراءتنا."
  connection: "ثم يدعو لهما وهما عظيمان في عليا معدّ، ويقول إن من وجد المجد مباحًا كما وجداه عظم [@ibn-al-anbari، ص262–263]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "فَأَصْبَحْ / تُمَا مِنْهَا / عَلَى خَيْ / رِ مَوْطِنِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — بَعِيدَيْ / نِ فِيهَا مِنْ / عُقُوقِنْ / وَمَأْثَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "التفعيلات تامة إلا العروض والضرب [@atiq، ص29]."
context: "الثالث من أبيات مدح السيدين (19–22): بعد الفعل في البيت 19 والقول في البيت 20 يأتي الحكم عليهما."
