first: "سَئِمْتُ تَكَالِيفَ الْحَيَاةِ وَمَنْ يَعِشْ"
second: "ثَمَانِينَ حَوْلًا لَا أَبَا لَكَ يَسْأَمِ"
meaning: "مللت مشاقّ الحياة، ومن عاش ثمانين سنة ملّ لا محالة. قال يَعْقُوب: «سئمت ما تجيء به الحياة من المشقة» [@ibn-al-anbari، ص287]. وقال الزَّوْزَنِيّ: «يقول: مللت مشاق الحياة وشدائدها، ومن عاش ثمانين سنة ملَّ الكبر لا محالة» [@zawzani، ص149]."
vocabulary:
  - term: "سَئِمْتُ"
    text: "«ومعنى سئمت مللت»، وأنشد ابن الأَنْبارِيّ قول لَبِيد: «ولقد سئمتُ من الحياة وطولها / وسؤالِ هذا الناسِ كيف لبيدُ» [@ibn-al-anbari، ص288]."
  - term: "تَكَالِيفَ"
    text: "مشاقّ. «يقال: عليّ من هذا الأمر تكلفة، أي مشقة» [@ibn-al-anbari، ص287]. وقال الأَعْلَم: «مشقاتها، وما يتكلفه الإنسان من الأمور الصعبة» [@diwan-zuhayr، ص25]."
  - term: "حَوْلًا"
    text: "سنة."
  - term: "لَا أَبَا لَكَ"
    text: "قال الزَّوْزَنِيّ: «كلمة جافية لا يراد بها الجفاء وإنما يراد بها التنبيه والإعلام» [@zawzani، ص149]. وقال الأَعْلَم: «كأنه يلوم نفسه. وهي كلمة تستعملها العرب، في تضاعيف كلامها، عند الجفاء والغلظة وتشديد الأمر» [@diwan-zuhayr، ص25]."
context: "يلتفت الشاعر هنا إلى نفسه وعمره، ومن هذا البيت تبدأ الحكمة عند الأَعْلَم (47) [@diwan-zuhayr، ص25] والزَّوْزَنِيّ (46) [@zawzani، ص148]، وفي الشرح المنسوب إلى ثَعْلَب (48) [@sharh-thalab-zuhayr، ص34]، بعد مدح الحي مباشرة. أما ابن الأَنْبارِيّ والتِّبْرِيزِيّ فيجعلانه 56، أي بعد أبيات «وَمَنْ» [@tabrizi-ashr، ص127]. ويذكر شوقي ضيف أن الأَصْمَعِيّ كان يشك في أبيات الحكمة الملحقة بالمعلقة [@deif، ج1 ص325]؛ ولم نجد هذا الشك في الشروح القديمة التي بين أيدينا."
syntax:
  - "«والثمانين نصب بيعش، والحول نصب على التفسير، والأب منصوب بلا على التبرئة، ولك خبر التبرئة» [@ibn-al-anbari، ص288]. والتفسير عند الكوفيين هو التمييز، و«لا التبرئة» هي النافية للجنس."
  - "وللنحاة في «لَا أَبَا لَكَ» قول آخر: «واللام في (لا أبا لك) زائدة، والتقدير: لا أباك... والخبر محذوف» [@tabrizi-ashr، ص128]."
  - "جملة «لَا أَبَا لَكَ» معترضة بين الشرط «وَمَنْ يَعِشْ» وجوابه «يَسْأَمِ»."
morphology:
  - "«سَئِمَ» مكسور العين، ومصدره: «سأما، وسأمة ساكنة الهمزة، وسآمة بألف بعد الهمزة» [@ibn-al-anbari، ص287]."
  - "«أَبَا» بالألف وهو غير مضاف في اللفظ، و«هذه اللغة العالية، وهي مبنية على لغة الذين يقولون قام أباك وأكرمت أباك ومررت بأباك» [@ibn-al-anbari، ص288]."
  - "«ثَمانين» عدد ملحق بجمع المذكر السالم، منصوب بالياء."
rhetoric:
  thesis: "صوت الشيخ: ثمانون سنة كافية لأن يملّ المرء أعباء العيش؛ ومن هنا يتكلم زُهَيْر بلسان المجرّب."
  devices:
    - title: "الانتقال من الخاص إلى العام"
      text: "بدأ بنفسه «سَئِمْتُ»، ثم جعل حاله قاعدة: «وَمَنْ يَعِشْ ثَمَانِينَ حَوْلًا ... يَسْأَمِ». فالشطر الثاني دليل على الأول، وصار البيت مثلًا."
    - title: "الاعتراض"
      text: "الاعتراض: أن تقع جملة بين جزأين متلازمين من الكلام. وهو «لَا أَبَا لَكَ» بين الشرط وجوابه، وهي عند الزَّوْزَنِيّ للتنبيه [@zawzani، ص149]."
    - title: "خطاب النفس"
      text: "المخاطَب في «لَا أَبَا لَكَ» هو الشاعر نفسه عند الأَعْلَم: «كأنه يلوم نفسه» [@diwan-zuhayr، ص25]، وكذلك في الشرح المنسوب إلى ثَعْلَب: «يلوم نفسه» [@sharh-thalab-zuhayr، ص34]. فهو يجرّد من نفسه شخصًا يعاتبه."
  connection: "ثم يذكر ما رآه في طول عمره من الموت: «رَأَيْتُ الْمَنَايَا خَبْطَ عَشْوَاءَ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "سَئِمْتُ / تَكَالِيفَلْ / حَيَاةِ / وَمَنْ يَعِشْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — ثَمَانِي / نَ حَوْلَنْ لَا / أَبَا لَ / كَ يَسْأَمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثانية في الصدر، والثانية في العَجُز [@atiq، ص29]."
variants:
  - reading: "ثَمَانِينَ عَامًا لَا أَبَا لَكَ يَسْأَمِ"
    status: "نص ابن الأَنْبارِيّ في المكتبة الشاملة"
    note: "كذا في نص البيت، لكن شرحه يقول: «والثمانين نصب بيعش، والحول نصب على التفسير» [@ibn-al-anbari، ص288]، فالكلمة التي شرحها «حولًا». وبها البيت عند الأَعْلَم [@diwan-zuhayr، ص25] والزَّوْزَنِيّ [@zawzani، ص148] والتِّبْرِيزِيّ [@tabrizi-ashr، ص127] وفي الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص34]. فأثبتنا ما يفسّره الشرح."
