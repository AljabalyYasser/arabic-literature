first: "لَدَى أَسَدٍ شَاكِي الْبَنَانِ مُقَاذِفٍ"
second: "لَهُ لِبَدٌ أَظْفَارُهُ لَمْ تُقَلَّمِ"
meaning: "عند أسد حادّ البراثن، غليظ اللحم، له لِبْدة، لم تُقلَّم أظفاره؛ أي جيش تام السلاح. في شرح ابن الأَنْبارِيّ: «معناه إنه تام السلاح حديده، يريد الجيش، واللفظ على الأسد» [@ibn-al-anbari، ص278]، ومثله عند الأَعْلَم، فالمراد بالأسد عنده «الجيش. وحمل لفظ البيت على الأسد» [@diwan-zuhayr، ص22]. أما الزَّوْزَنِيّ فيقول: «والبيت كله من صفة حصين» [@zawzani، ص146]."
vocabulary:
  - term: "شَاكِي"
    text: "«ومعناه سلاحه ذو … شوكة. وأصل شاكي شائك» [@ibn-al-anbari، ص277–278]، أي حادّ."
  - term: "الْبَنَانِ"
    text: "«أراد براثن الأسد. وأصل البنان أصابع الإنسان، الواحدة بنانة» [@ibn-al-anbari، ص278]. والبراثن: مخالب السبع."
  - term: "مُقَاذِفٍ"
    text: "«ومقاذف: مرام» [@tabrizi-ashr، ص122]، أي يرامي أقرانه. وقال أبو جَعْفَر: «الرواية الجيدة (مقاذف)» [@ibn-al-anbari، ص278]."
  - term: "لِبَدٌ"
    text: "«جمع لبدة، وهي الشعر المتراكب على زبرة الأسد، وهو ما بين الكتفين قد تلبد عليه الشعر» [@ibn-al-anbari، ص278]."
context: "يختلف الشراح في الأسد: هو الجيش الذي احتمى به حُصَيْن عند ابن الأَنْبارِيّ والأَعْلَم والتِّبْرِيزِيّ [@tabrizi-ashr، ص122]، وهو حُصَيْن نفسه عند الزَّوْزَنِيّ. والصورة قديمة في الشعر: قال الأَعْلَم: «وأول من كنى بالأظفار عن السلاح أوس بن حجر»، في قوله: «لَعَمْرُكَ إِنَّا وَالْأَحَالِيفَ هَؤُلَا / لَفِي حِقْبَةٍ أَظْفَارُهَا لَمْ تُقَلَّمِ»، «ثم تبعه زهير، والنابغة» [@diwan-zuhayr، ص22]. وقال الأَصْمَعِيّ: «اخذ هذا المعنى زهير والنابغة من أوس» [@ibn-al-anbari، ص278]. وهذا ما يسميه النقاد الأخذ: أن يأخذ شاعر معنى من غيره. وهو البيت 37 عند الأَعْلَم [@diwan-zuhayr، ص21] والزَّوْزَنِيّ [@zawzani، ص146]."
syntax:
  - "«ولدى صلة شد، وشاكي نعت للأسد، وكذلك المقاذف، واللبد رفع بله، وأظفاره رفع بما عاد من تقلم» [@ibn-al-anbari، ص279]. فجملة «لَهُ لِبَدٌ» صفة أخرى، وجملة «أَظْفَارُهُ لَمْ تُقَلَّمِ» كذلك."
  - "«شَاكِي الْبَنَانِ» إضافة لفظية، أي إضافة الصفة إلى معمولها، فلم تفد «أسدًا» تعريفًا، وبقي نكرة موصوفة."
morphology:
  - "«شاكي» مقلوب «شائك»، «كما قالوا جرف هار وأصله هائر» [@ibn-al-anbari، ص278]. قال التِّبْرِيزِيّ: «هذا هو القلب الصحيح عند البصريين» [@tabrizi-ashr، ص122]. والقلب هنا: تقديم حرف على حرف في الكلمة."
  - "«لِبَد» جمع «لِبْدة» على «فِعَل» [@ibn-al-anbari، ص278]."
  - "«مُقاذِف» اسم فاعل من «قاذَفَ» على «فاعَل» للمشاركة: يقاذف الأقران ويقاذفونه."
rhetoric:
  thesis: "صورة أسد كاملة العُدّة، واللفظ للأسد والمراد الجيش: كل صفة فيه سلاح."
  devices:
    - title: "الاستعارة"
      text: "«لَدَى أَسَدٍ»: سمّى الجيش، أو حُصَيْنًا، أسدًا. وهذا الضرب عند عبد القاهر الجُرْجانيّ أن «تجعل الشيءَ الشيءَ ليس به» [@dalail، ص67]، كقولك: رأيت أسدًا، تريد رجلًا شجاعًا."
    - title: "الترشيح"
      text: "الترشيح: أن تذكر بعد الاستعارة ما يلائم المستعار منه، فتقوى الصورة. فبعد «أَسَدٍ» جاء «الْبَنَانِ» و«لِبَدٌ» و«أَظْفَارُهُ لَمْ تُقَلَّمِ»، وكلها من صفات الأسد. وفي «أَظْفَارُهُ» استعار ظفر الإنسان لمخلب الأسد، قال أبو عُبَيْد فيما ينقله ابن منظور: «وكقول زهير يصف الأسد»، ثم أنشد البيت وقال: «وإنما له المخالب» [@lisan، ج13 ص412]."
    - title: "الكناية"
      text: "«أَظْفَارُهُ لَمْ تُقَلَّمِ» كناية عن تمام السلاح وحدّته، والأظفار عند الأَعْلَم «السلاح» [@diwan-zuhayr، ص22]."
  connection: "ثم يصف جرأة هذا الأسد: يعاقب من ظلمه، ويبدأ بالظلم إن لم يُظلم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "لَدَى أَ / سَدِنْ شَاكِلْ / بَنَانِ / مُقَاذِفِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — لَهُو لِ / بَدُنْ أَظْفَا / رُهُو لَمْ / تُقَلْلَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت ضمة الهاء في «لَهُ» و«أَظْفَارُهُ». ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثانية في الصدر، والأولى في العَجُز [@atiq، ص29]."
variants:
  - reading: "لَدَى أَسَدٍ شَاكِي السِّلَاحِ مُقَذَّفٍ"
    status: "رواية الأَصْمَعِيّ، ومتن الأَعْلَم والزَّوْزَنِيّ"
    note: "«وروى الأصمعي: (لدى أسد شاكي السلاح مقذف)» [@ibn-al-anbari، ص277]. و«المقذف: الغليظ اللحم» [@ibn-al-anbari، ص278]، أو كما يقول الزَّوْزَنِيّ: «أي: يقذف به كثيرًا إلى الوقائع» [@zawzani، ص146]. وفي لسان العرب: «ورجل مقذف أي كثير اللحم كأنه قذف باللحم قذفا» [@lisan، ج9 ص277]."
