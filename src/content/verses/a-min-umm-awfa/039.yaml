first: "وَكَانَ طَوَى كَشْحًا عَلَى مُسْتَكِنَّةٍ"
second: "فَلَا هُوَ أَبْدَاهَا وَلَمْ يَتَقَدَّمِ"
meaning: "وكان حُصَيْن قد طوى جنبه على نية مستورة، فلم يُظهرها ولم يعجّل بها حتى تمكّن. في شرح ابن الأَنْبارِيّ: «معناه: وكان طوى كشحه على فعلة أكنها في نفسه فلم يظهرها» [@ibn-al-anbari، ص275]. وقال الزَّوْزَنِيّ: «وكان حصين أضمر في صدره حقدًا وطوى كشحه على نية مستترة فيه ولم يظهرها لأحد ولم يتقدم عليها قبل إمكانه الفرصة» [@zawzani، ص145]."
vocabulary:
  - term: "كَشْحًا"
    text: "«الكشح: الخاصرة» [@ibn-al-anbari، ص276]، وعند الزَّوْزَنِيّ: «منقطع الأضلاع» [@zawzani، ص145]. وفي لسان العرب: «وطوى كشحه على أمر إذا أخفاه» [@lisan، ج15 ص19]."
  - term: "مُسْتَكِنَّةٍ"
    text: "«(المستكنة) : الغدرة» [@ibn-al-anbari، ص276]، وفي لسان العرب: «والمستكنة: الحقد» [@lisan، ج13 ص361]، وعند الأَعْلَم: «خطة، أكنها في نفسه» [@diwan-zuhayr، ص20]."
  - term: "أَبْدَاهَا"
    text: "أظهرها."
context: "يصوّر زُهَيْر الغدر الذي حذّر منه في البيت 27: أن يُظهر المرء الصلح ويُضمر غيره. ومن طريف ما في لسان العرب أنه أنشد البيت مرة لعَبْدة بن الطَّبِيب، ثم قال: «وهذا البيت أنشده في ترجمة كنن ونسبه لزهير» [@lisan، ج13 ص368]، أي في مادة «كنن» حيث أنشده لزُهَيْر [@lisan، ج13 ص361]؛ والرواة كلهم على أنه لزُهَيْر. وهو البيت 34 عند الأَعْلَم [@diwan-zuhayr، ص20] والزَّوْزَنِيّ [@zawzani، ص145]."
syntax:
  - "«واسم كان مضمر فيها، وطوى خبرها» [@ibn-al-anbari، ص276]. وقال المُبَرِّد: «هذا بإضمار قد، والمعنى وكان قد طوى كشحا»، وخالفه أصحابه فأجازوا أن يكون خبر «كان» فعلًا ماضيًا [@tabrizi-ashr، ص120]."
  - "«لا» هنا بمعنى «لم»: «ولا، معناها لم، كأنه قال: لم يبدها لهم، كما قال الله عز وجل: (فلا صَدَّقَ ولا صَلَّى) معناه فلم يصدق ولم يصل» [@ibn-al-anbari، ص276]. ولذلك عطف عليها «وَلَمْ يَتَقَدَّمِ»."
  - "«مُسْتَكِنَّةٍ» صفة لموصوف محذوف، «أي على حالة مستكنة» [@tabrizi-ashr، ص121]."
morphology:
  - "«مُسْتَكِنّ» اسم فاعل من «استكنّ» على «استفعل». «الاستكنان: طلب الكن، والاستكنان الاستتار، وهو في البيت على المعنى الثاني» [@zawzani، ص145]. «يقال: أكننت الشيء، إذا سترته» [@ibn-al-anbari، ص275]."
  - "ومن «الكشح» جاء «الكاشح»: «المضمر العداوة في كشحه» [@zawzani، ص145]."
rhetoric:
  thesis: "صورة الغادر: جنب مطويّ على سرّ، لا يُظهره ولا يستعجل، حتى تحين الفرصة."
  devices:
    - title: "الكناية"
      text: "الكناية: أن تذكر معنى يلزم منه المعنى المراد، فتدل به عليه. وهي في «طَوَى كَشْحًا عَلَى مُسْتَكِنَّةٍ»: طيّ الجنب على الشيء يلزم منه إخفاؤه، فدل به على الإضمار. وفي لسان العرب: «وطوى كشحه على أمر إذا أخفاه» [@lisan، ج15 ص19]."
    - title: "حذف الموصوف"
      text: "قال «مُسْتَكِنَّةٍ» ولم يذكر ما هي: غدرة أم حقد أم خطة. فبقي الشيء المستور مستورًا في اللفظ أيضًا، واختلف الشراح في تقديره كما رأينا. وهذه قراءتنا."
    - title: "الصلة بالتحذير"
      text: "البيت تطبيق لما نهى عنه في «فَلَا تَكْتُمُنَّ اللَّهَ مَا فِي صُدُورِكُمْ» (27): حُصَيْن كتم ما في صدره، فجرّ على قومه. وأبو جَعْفَر يربط البيت 27 بحُصَيْن صراحة [@ibn-al-anbari، ص266]."
  connection: "ثم يحكي ما قاله في نفسه: «سَأَقْضِي حَاجَتِي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَكَانَ / طَوَى كَشْحَنْ / عَلَى مُسْ / تَكِنْنَتِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — فَلَا هُ / وَ أَبْدَاهَا / وَلَمْ يَ / تَقَدْدَمِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر، والأولى والثانية في العَجُز [@atiq، ص29]."
variants:
  - reading: "فَلَا هُوَ أَبْدَاهَا وَلَمْ يَتَجَمْجَمِ"
    status: "رواية عند ابن الأَنْبارِيّ، ومتن الأَعْلَم"
    note: "«ويروى: (ولم يتجمجم) أي لم يدع التقدم على ما أضمر» [@ibn-al-anbari، ص275]. وهي متن الأَعْلَم، وفسّرها: «أي: لم يدع التقدم فيما أضمره، ولم يتردد في إنفاذه» [@diwan-zuhayr، ص20]، وبها أنشده ابن منظور [@lisan، ج13 ص361]."
