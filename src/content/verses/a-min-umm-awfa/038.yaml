first: "لَعَمْرِي لَنِعْمَ الْحَيُّ جَرَّ عَلَيْهِمُ"
second: "بِمَا لَا يُوَاتِيهِمْ حُصَيْنُ بْنُ ضَمْضَمِ"
meaning: "أقسم بحياتي: لنعم الحيّ هم، جرّ عليهم حُصَيْن بن ضَمْضَم جناية لم يوافقوه عليها. وفي شرح ابن الأَنْبارِيّ: «لعمري لنعم القوم جر عليهم حصين بن ضمضم بما لم يكن عن ملأ منهم» [@ibn-al-anbari، ص275]، أي لم يكن عن اتفاق منهم. وقال الزَّوْزَنِيّ: «أقسم بحياتي لنعمت القبيلة جنى عليهم حصين بن ضمضم، وإن لم يوافقوه في إضمار الغدر ونقض العهد» [@zawzani، ص145]."
vocabulary:
  - term: "لَعَمْرِي"
    text: "قَسَم بالحياة، أي: وحياتي. قال الزَّوْزَنِيّ: «أقسم بحياتي» [@zawzani، ص145]."
  - term: "جَرَّ عَلَيْهِمُ"
    text: "جنى عليهم، «من الجريرة» [@ibn-al-anbari، ص275]، و«الجريرة الجناية» [@zawzani، ص144]."
  - term: "يُوَاتِيهِمْ"
    text: "«بما لا يوافقهم» [@ibn-al-anbari، ص275]."
  - term: "حُصَيْنُ بْنُ ضَمْضَمِ"
    text: "«وحصين من بني مرة، كان أبى أن يدخل في صلحهم، فلما اجتمعوا للصلح شد على رجل منهم فقتله» [@ibn-al-anbari، ص275]."
context: "أول قصة حُصَيْن (38–43). يرويها ابن الأَنْبارِيّ عن يَعْقُوب في خبر القصيدة: قتل وَرْد بن حابِس العَبْسيّ هَرِمَ بن ضَمْضَم في الحرب قبل الصلح، فلما اصطلحوا لم يدخل أخوه حُصَيْن في الصلح، «فحلف ألا يغسل رأسه حتى يقتل ورد بن حابس أو رجلا من بني عبس ثم من بني غالب». فنزل به رجل من عَبْس فقتله، فركبت عَبْس نحو الحارِث بن عَوْف، فبعث إليهم بمائة من الإبل معها ابنه، فاختاروا الإبل وتمّ الصلح [@ibn-al-anbari، ص236]. وفي ابنَي ضَمْضَم يقول عَنْتَرَة: «وَلَقَدْ خَشِيتُ بِأَنْ أَمُوتَ وَلَمْ تَكُنْ / لِلْحَرْبِ دَائِرَةٌ عَلَى ابْنَيْ ضَمْضَمِ» [@ibn-al-anbari، ص236]. أما أبو جَعْفَر فيجعل القتيل وَرْدًا نفسه: «كان هرم بن ضمضم قتله ورد بن حابس، فقتله أخوه حصين به» [@ibn-al-anbari، ص276]. ويأتي هذا المقطع عند الأَعْلَم (33–38) والزَّوْزَنِيّ (33–38) بعد صورة الحرب مباشرة [@diwan-zuhayr، ص20] [@zawzani، ص144]."
syntax:
  - "قال التِّبْرِيزِيّ: «(لعمري) في موضع رفع بالابتداء، والخبر محذوف، كأنه قال: لعمري الذي أقسم به» [@tabrizi-ashr، ص120]، واللام في «لَنِعْمَ» واقعة في جواب القسم."
  - "«والحي رفع بنعم، وحصين رفع بجر» [@ibn-al-anbari، ص275]. والمخصوص بالمدح محذوف، والتقدير: لنعم الحيُّ حيٌّ جرّ عليهم حُصَيْن."
  - "«بِمَا لَا يُوَاتِيهِمْ» متعلق بـ«جَرَّ»: جرّ عليهم جريرة بفعل لا يوافقهم."
morphology:
  - "«جَرَّ» فعل مضعّف، ومنه «الجريرة» على «فعيلة»."
  - "«يُوَاتِي» مضارع «واتى» على «فاعل»: وافق وطاوع."
  - "«حُصَيْن» تصغير «حِصْن»."
rhetoric:
  thesis: "يبرئ القبيلة من فعل رجل واحد: نعم الحيُّ هم، وإنما جرّ عليهم حُصَيْن ما لم يرضوه."
  devices:
    - title: "الاحتراس"
      text: "الاحتراس: أن يأتي المتكلم بما يدفع عن كلامه فهمًا غير مراد. فلما ذكر الجناية قدّم مدح الحي «لَنِعْمَ الْحَيُّ»، وقيّدها بـ«بِمَا لَا يُوَاتِيهِمْ»، فلا يُفهم أن القبيلة شاركت في الغدر. وهذا يخدم الصلح: الجاني واحد، فلا تعود الحرب بين القبيلتين. وهذه قراءتنا."
    - title: "القسم"
      text: "«لَعَمْرِي» ثم لام الجواب في «لَنِعْمَ»: توكيدان للمدح قبل ذكر الجناية."
    - title: "التصريح بالاسم"
      text: "سمّى الجاني باسمه واسم أبيه «حُصَيْنُ بْنُ ضَمْضَمِ»، فحصر التبعة فيه وحده."
  connection: "ثم يصف كيف أضمر الغدر: «وَكَانَ طَوَى كَشْحًا عَلَى مُسْتَكِنَّةٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "لَعَمْرِي / لَنِعْمَلْ حَيْ / يُ جَرْرَ / عَلَيْهِمُو = فعولن / مفاعيلن / فعولُ / مفاعلن — بِمَا لَا / يُوَاتِيهِمْ / حُصَيْنُبْ / نُ ضَمْضَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت ضمة الميم في «عَلَيْهِمُ» آخر الصدر. ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر [@atiq، ص29]."
variants:
