first: "وَمَنْ يَجْعَلِ الْمَعْرُوفَ مِنْ دُونِ عِرْضِهِ"
second: "يَفِرْهُ وَمَنْ لَا يَتَّقِ الشَّتْمَ يُشْتَمِ"
meaning: "من جعل إحسانه إلى الناس سترًا دون عرضه حفظ عرضه وافرًا، ومن لم يتّقِ الشتم شُتم. في شرح ابن الأَنْبارِيّ: «معناه من اصطنع المعروف إلى الناس وقى عرضه» [@ibn-al-anbari، ص287]. وقال الأَعْلَم: «أي: من جعل المعروف بين عرضه وبين الناس سلم عرضه من الذم، وأصابه وافرًا، لم ينل منه شيء. ومن منع المعروف، ولم يتق الشتم، شتم. وإنما يريد بالشتم الهجو والذم» [@diwan-zuhayr، ص27]."
vocabulary:
  - term: "الْمَعْرُوفَ"
    text: "الإحسان إلى الناس."
  - term: "عِرْضِهِ"
    text: "«(العرض) : موضع المدح والذم من الرجل»، «وقال بعضهم العرض: النفس» [@ibn-al-anbari، ص287]."
  - term: "يَفِرْهُ"
    text: "«يجعله وافرا» [@ibn-al-anbari، ص287]، و«أي يتمه ولا ينقصه» [@tabrizi-ashr، ص127]."
context: "حكمة المعروف، وهي تكمل البيت 50 في البخل بالفضل. وهو 55 عند ابن الأَنْبارِيّ، و52 عند الأَعْلَم [@diwan-zuhayr، ص26]، و53 في الشرح المنسوب إلى ثَعْلَب [@sharh-thalab-zuhayr، ص35]، و50 عند الزَّوْزَنِيّ [@zawzani، ص149]. ويزيد الزَّوْزَنِيّ بعد «ومن هاب» بيتًا قريبًا منه: «وَمَنْ يَجْعَلِ الْمَعْرُوفَ فِي غَيْرِ أَهْلِهِ / يَكُنْ حَمْدُهُ ذَمًّا عَلَيْهِ وَيَنْدَمِ» (54) [@zawzani، ص150]، ويذكر المحقق قَباوَة أنه في الجمهرة بعد هذا البيت [@diwan-zuhayr، ص26]. وليس عند ابن الأَنْبارِيّ ولا الأَعْلَم ولا التِّبْرِيزِيّ، فلم نعرضه."
syntax:
  - "«ويجعل مجزوم بمن، واللام كسرت لاجتماع الساكنين، ويفره جواب الجزاء علامة الجزم فيه سكون الراء» [@ibn-al-anbari، ص287]."
  - "«مِنْ دُونِ عِرْضِهِ» في موضع المفعول الثاني لـ«يجعل»: يجعل المعروف حاجزًا أمام عرضه."
  - "«يَتَّقِ» مجزوم بحذف الياء، و«يُشْتَمِ» جوابه."
morphology:
  - "«يَفِر» مثال واوي حُذفت فاؤه: «وكان الأصل فيه يوفره، فحذفت الواو لوقوعها بين الكسرة والياء، كما حذفت من يزن ويلد» [@ibn-al-anbari، ص287]. وللكسائي تعليل آخر: «حذفت الواو فرقا بين الواقع وغير الواقع» [@ibn-al-anbari، ص287]، أي بين المتعدي واللازم."
  - "«يَتَّقِ» على «يفتعل» من «وقى»، قُلبت الواو تاء وأُدغمت."
rhetoric:
  thesis: "المعروف درع للعرض: من بذله سلم عرضه، ومن لم يحترس من الشتم وقع فيه."
  devices:
    - title: "الاستعارة"
      text: "في «يَجْعَلِ الْمَعْرُوفَ مِنْ دُونِ عِرْضِهِ» جعل الإحسان حاجزًا يقف أمام العرض فيتلقى عنه ألسنة الناس، كما فسّره الأَعْلَم: «بين عرضه وبين الناس» [@diwan-zuhayr، ص27]."
    - title: "المقابلة"
      text: "الشطر الأول لمن بذل فسلم، والثاني لمن لم يتّقِ فشُتم، والمقصود به من منع المعروف كما يقول الزَّوْزَنِيّ: «ومن بخل معروفه عرَّض عرضه للذم والشتم» [@zawzani، ص150]."
    - title: "الجناس"
      text: "«يَتَّقِ الشَّتْمَ يُشْتَمِ»: المصدر ثم فعله المبني للمجهول، فالشتم الذي لم يُتّقَ يعود على صاحبه بلفظه."
  connection: "ثم يلتفت إلى نفسه: «سَئِمْتُ تَكَالِيفَ الْحَيَاةِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَمَنْ يَجْ / عَلِلْ مَعْرُو / فَ مِنْ دُو / نِ عِرْضِهِي = فعولن / مفاعيلن / فعولن / مفاعلن — يَفِرْهُو / وَمَنْ لَا يَتْ / تَقِشْ شَتْ / مَ يُشْتَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "أُشبعت ضمة الهاء في «يَفِرْهُ». ولا زحاف في حشو البيت، والعَرُوض والضرب مقبوضتان كما يلزم في الطويل [@atiq، ص29]."
