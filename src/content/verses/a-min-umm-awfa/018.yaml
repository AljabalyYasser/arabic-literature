first: "يَمِينًا لَنِعْمَ السَّيِّدَانِ وُجِدْتُمَا"
second: "عَلَى كُلِّ حَالٍ مِنْ سَحِيلٍ وَمُبْرَمِ"
meaning: "أحلف يمينًا: لَنِعم السيدان وُجدتما، في كل حال، في الأمر الهيّن والأمر الشديد. قال ابن الأَنْبارِيّ: «معناه: لنعم السيدان وجدتما حين تفاجآن لأمر قد أبرمتماه. وأمر لم تبرماه ولم تحكماه، على كل حال من شدة الأمر وسهولته» [@ibn-al-anbari، ص260]. وقال الزَّوْزَنِيّ: «وأراد بالسيدين هرم بن سنان والحارث بن عوف» [@zawzani، ص139]."
vocabulary:
  - term: "سَحِيلٍ"
    text: "«والسحيل خيط واحد لا يضم إليه آخر» [@ibn-al-anbari، ص260]. وفي لسان العرب: «السَّحْلُ والسَّحِيلُ: ثَوْبٌ لَا يُبْرَم غَزْلُه أَي لَا يُفْتَل طاقتَين»، ثم قال: «وَقِيلَ: السَّحِيل الغَزْل الَّذِي لَمْ يُبْرَم» [@lisan، ج11 ص327]."
  - term: "مُبْرَمِ"
    text: "«أن المبرم يفتل خيطين حتى يصيرا خيطا واحدا» [@ibn-al-anbari، ص260]. وفسّره الأَعْلَم بقوله: «المفتول» [@diwan-zuhayr، ص15]."
syntax:
  - "«ويمينا نصب بأقسمت، وموضع نعم نصب بوجدتما، والسيدان رفع بنعم» [@ibn-al-anbari، ص260]. أي أن «يَمِينًا» مفعول مطلق من معنى «أَقْسَمْتُ» في البيت السابق، وجملة «لَنِعْمَ السَّيِّدَانِ» جواب القسم [@khizana، ج3 ص7]."
  - "«وُجِدْتُمَا» فعل ماض مبني للمجهول من «وَجَدَ» التي تنصب مفعولين، ونائب الفاعل ضمير المثنى، وهو المخصوص بالمدح. قال البَغْدادِيّ إن الرضيّ أورد البيت «على أن المخصوص بالمدح إذا تأخر عن نعم يجوز دخول نواسخ المبتدأ عليه فإن ضمير التثنية في وجدتما هو المخصوص بالمدح وقد دخل عليه الناسخ وهو وجد» [@khizana، ج3 ص7]. والنواسخ: أفعال وحروف تدخل على المبتدأ والخبر فتغيّر إعرابهما."
  - "«عَلَى كُلِّ حَالٍ» متعلق بـ«وُجِدْتُمَا»، و«مِنْ سَحِيلٍ» بيان لـ«حَالٍ»."
morphology:
  - "«مُبْرَم» اسم مفعول من «أَبْرَمَ»: «مفعول من أبرم الفاتل الحبل: إذا أعاد عليه الفتل ثانيا بعد أول» [@khizana، ج3 ص7]."
  - "«سَحِيل» على «فَعِيل» بمعنى «مَفْعُول»: «المسحول أي: الذي لم يحكم فتله» [@khizana، ج3 ص7]."
  - "«نِعْمَ» فعل جامد لإنشاء المدح، لا يتصرّف."
rhetoric:
  thesis: "المقسم عليه هو المدح كله: السيدان لا يتغيران بتغيّر الأحوال، هيّنها وشديدها."
  devices:
    - title: "الاستعارة"
      text: "في «مِنْ سَحِيلٍ وَمُبْرَمِ» أخذ الشاعر لفظين من فتل الحبال، وأراد بهما أحوال الناس. قال الزَّوْزَنِيّ: «ثم يستعار السحيل للضعيف والمبرم للقوي» [@zawzani، ص139]. فالأمر الهيّن خيط مفرد، والأمر الشديد حبل مفتول. وهذه استعارة بالمعنى الذي يحدّه عبد القاهر: أن تجيء «إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الطباق"
      text: "«سَحِيلٍ» و«مُبْرَمِ» ضدّان، والجمع بينهما يستغرق الأحوال كلها، كما في قوله «عَلَى كُلِّ حَالٍ». وفسّره أبو جَعْفَر: «من أمر شديد أو لين، محكم أو غير محكم» [@ibn-al-anbari، ص260]."
    - title: "الخطاب"
      text: "في «وُجِدْتُمَا» ينتقل من الحديث عن السيدين بضمير الغائب في البيت 16 إلى خطابهما. والانتقال من الغيبة إلى الخطاب يسمّيه البلاغيون الالتفات. وبه يصير المدح مواجهة. وهذه قراءتنا."
  connection: "ثم يذكر ما وُجدا عليه: تداركا عبسًا وذبيان بعد أن تفانوا [@ibn-al-anbari، ص261]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "يَمِينَنْ / لَنِعْمَسْسَيْ / يِدَانِ / وُجِدْتُمَا = فعولن / مفاعيلن / فعولُ / مفاعلن — عَلَى كُلْ / لِ حَالِنْ مِنْ / سَحِيلِنْ / وَمُبْرَمِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الثالثة من الصدر [@atiq، ص29]."
context: "خاتمة مقطع القسم (16–18): يتمّ به اليمين الذي بدأ في البيت 17. وهو من شواهد النحاة في باب أفعال المدح والذم، أورده الرضيّ في شرحه، وشرحه البَغْدادِيّ في خزانة الأدب [@khizana، ج3 ص7]."
