first: "مَتَى تَبْعَثُوهَا تَبْعَثُوهَا ذَمِيمَةً"
second: "وَتَضْرَ إِذَا ضَرَّيْتُمُوهَا فَتَضْرَمِ"
meaning: "متى أثرتم الحرب أثرتموها مذمومة، وإذا عوّدتموها القتل اعتادته كما يعتاد السبع الصيد، فتشتعل كالنار. قال الأَعْلَم: «يقول: إن بعثتم الحرب، ولم تقبلوا الصلح، كان ذلك سببًا لتكررها عليكم، واستئصالها لكم» [@diwan-zuhayr، ص19]. وفي شرح ابن الأَنْبارِيّ أنها مذمومة لأن «أولها صغير ثم تعظم بعد» [@ibn-al-anbari، ص267]."
vocabulary:
  - term: "تَبْعَثُوهَا"
    text: "«تثيروها» [@tabrizi-ashr، ص116]."
  - term: "ذَمِيمَةً"
    text: "«معناه مذمومة» [@ibn-al-anbari، ص267]، أي: تُذمّون على إثارتها [@zawzani، ص143]."
  - term: "تَضْرَ ... ضَرَّيْتُمُوهَا"
    text: "«معناه تضرى كما يضرى السبع» [@ibn-al-anbari، ص268]، أي: تتعوّد القتل كما يتعوّد السبع الافتراس. وفي لسان العرب: «وقد ضري الكلب بالصيد ضراوة أي تعود، وأضراه صاحبه أي عوده»، ثم أنشد البيت [@lisan، ج14 ص482]. ونقل يَعْقُوب عن الأَصْمَعِيّ قول عمر بن الخطاب: «إياكم وهذه المجازر فإن لها ضراوة كضراوة الخمر» [@ibn-al-anbari، ص268]."
  - term: "فَتَضْرَمِ"
    text: "«تضطرم. يقال: أضرم نارك. وقد تضرمت، إذا اشتعلت» [@ibn-al-anbari، ص268]."
context: "يحذّرهم زُهَيْر من إشعال الحرب ثانية، ويمهّد لصورتي الرحى والناقة في البيتين التاليين. قال الزَّوْزَنِيّ: «يحثّهم على التمسك بالصلح، ويعلمهم سوء عاقبة إيقاد نار الحرب» [@zawzani، ص143]. وهو البيت 29 عند الأَعْلَم [@diwan-zuhayr، ص19] والزَّوْزَنِيّ [@zawzani، ص143]."
syntax:
  - "«وتبعثوها جزم بمتى، وتبعثوها الثاني جواب الجزاء، وذميمة نصب على الحال من الهاء» [@ibn-al-anbari، ص268]."
  - "«وتَضْرَ» معطوف على جواب الشرط، «وعلامة الجزم في تضر سقوط الألف، وتضرم نسق على تضر» [@ibn-al-anbari، ص268]. وجملة «إِذَا ضَرَّيْتُمُوهَا» شرط معترض، جوابه محذوف يدل عليه ما قبله."
morphology:
  - "«ذميمة» فعيلة بمعنى مفعولة. والقياس أن «فعيلًا» بمعنى مفعول لا تلحقه الهاء، قال التِّبْرِيزِيّ: «وهذا إنما يقع للمؤنث بغير هاء إذا تقدم الاسم كقولك: مررت بامرأة قتيل، أي مقتولة، فإن قلت (مررت بقتيلة) لم يجز حذف الهاء» [@tabrizi-ashr، ص116]؛ والموصوف هنا غير مذكور، فلحقته الهاء."
  - "«ضَرِيَ» بالشيء: «اعتاده واجترأ عليه ويعدّى بالهمزة والتضعيف» [@khizana، ج3 ص11]؛ فـ«ضَرَّيْتُمُوها» على «فعّل» للتعدية، أي جعلتموها ضارية."
  - "«تَضْرَم» من «ضَرِمَت النار» إذا التهبت [@khizana، ج3 ص11]."
rhetoric:
  thesis: "الحرب عند زُهَيْر كائن حيّ: تُبعث، وتُعوَّد الدم فتعتاده، ثم تشتعل نارًا. والمسؤول عنها من أثارها."
  devices:
    - title: "الاستعارة"
      text: "في «وَتَضْرَ إِذَا ضَرَّيْتُمُوهَا» جعل الحرب سبعًا يتعوّد الافتراس [@ibn-al-anbari، ص268]، وفي «فَتَضْرَمِ» جعلها نارًا تلتهب. ولم يصرّح بالسبع ولا بالنار، بل أعطى الحرب فعلهما. وهذا ما يسميه عبد القاهر الجُرْجانيّ أن تجعل «للشيءِ الشيءَ ليس له» [@dalail، ص67]."
    - title: "التكرار"
      text: "«تَبْعَثُوهَا تَبْعَثُوهَا»: كرر الفعل في الشرط والجواب، وزاد في الجواب «ذَمِيمَةً». فالمعنى: ساعة تثيرونها تكونون قد أثرتم شيئًا مذمومًا، بلا مهلة بين الفعل وعاقبته. وهذه قراءتنا."
    - title: "الجناس"
      text: "الجناس: تشابه لفظين في حروفهما مع اختلاف معناهما. وهو في «تَضْرَ ... ضَرَّيْتُمُوهَا ... تَضْرَمِ»: ثلاث كلمات تبدأ بالضاد والراء، فيتردد الصوت كما تتصاعد الحرب."
  connection: "ثم يصوّر الحرب رحى تطحنهم، وناقة تلد لهم الشر."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "مَتَى تَبْ / عَثُوهَا تَبْ / عَثُوهَا / ذَمِيمَتَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَتَضْرَ / إِذَا ضَرْرَيْ / تُمُوهَا / فَتَضْرَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في العَجُز فصارت «فعولُ» [@atiq، ص29]."
variants:
  - reading: "مَتَى تَبْعَثُوهَا تَبْعَثُوهَا دَمِيمَةً"
    status: "رواية"
    note: "بالدال المهملة. قال التِّبْرِيزِيّ: «ويروى (دميمه) أي حقيرة» [@tabrizi-ashr، ص116]، وقال البَغْدادِيّ: «وهذا باعتبار المبدأ» [@khizana، ج3 ص11]، أي إن الحرب تبدأ حقيرة صغيرة."
  - reading: "وَتَضْرَ إِذَا ضَرَّيْتُمُوهَا وَتَلْذَمِ"
    status: "رواية عند ابن الأَنْبارِيّ"
    note: "«ويروى: (إذا ضريتموها وتلذم) أي تلزم. قال يعقوب: قال الأصمعي: يقال ألذم به، إذا أغرى به حتى لزمه» [@ibn-al-anbari، ص268]."
