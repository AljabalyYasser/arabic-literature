first: "وَلَا شَارَكَتْ فِي الْمَوْتِ فِي دَمِ نَوْفَلٍ"
second: "وَلَا وَهَبٍ مِنْهَا وَلَا ابْنِ الْمُحَزَّمِ"
meaning: "ولا شاركت رماحهم في قتل نَوْفَل، ولا وَهْب، ولا ابن المُحَزَّم. فالمعنى عند الزَّوْزَنِيّ أنهم «لم يسفكوها ولم يشاركوا قاتليهم في سفك دمائهم» [@zawzani، ص147]، وقال في هذا البيت: «مضى شرح هذا البيت في أثناء شرح البيت الذي قبله» [@zawzani، ص147]."
vocabulary:
  - term: "شَارَكَتْ"
    text: "الفاعل ضمير الرماح: «وفاعل شاركت مضمر فيه من ذكر الرماح» [@ibn-al-anbari، ص280]."
  - term: "نَوْفَلٍ ... وَهَبٍ ... ابْنِ الْمُحَزَّمِ"
    text: "قتلى من عَبْس، قال الأَعْلَم: «كلهم من عبس. وابن المحزم بالحاء غير معجمة» [@diwan-zuhayr، ص23]."
context: "تتمة قائمة القتلى الذين وَدَاهم الساعيان ولم يقتلوهم. ولم نجد في الشروح التي بين أيدينا خبرًا عن هؤلاء غير أنهم من عَبْس. وهو البيت 42 عند الأَعْلَم [@diwan-zuhayr، ص23] والزَّوْزَنِيّ [@zawzani، ص147]."
syntax:
  - "«وفاعل شاركت مضمر فيه من ذكر الرماح، ووهب نسق على نوفل» [@ibn-al-anbari، ص280]."
  - "«فِي الْمَوْتِ» و«فِي دَمِ نَوْفَلٍ» متعلقان بـ«شَارَكَتْ»، والثاني يبيّن الأول. و«مِنْهَا» حال من الضمير في «شاركت»، أي: ولا شارك منها رمح، وهذه قراءتنا."
  - "«وَلَا ابْنِ» معطوف على «نَوْفَلٍ» مجرور، و«لا» زائدة لتأكيد النفي."
morphology:
  - "«شارَكَ» على «فاعَلَ»، وهو بناء المشاركة بين اثنين."
  - "«المُحَزَّم» اسم مفعول من «حَزَّمَ» على «فعّل»."
rhetoric:
  thesis: "يؤكد البراءة اسمًا اسمًا: لا يد لهم في دم أحد من هؤلاء."
  devices:
    - title: "تكرار النفي"
      text: "«وَلَا شَارَكَتْ ... وَلَا وَهَبٍ ... وَلَا ابْنِ الْمُحَزَّمِ»: أعاد «لا» مع كل اسم، فصار لكل قتيل نفيه الخاص. وهذه قراءتنا."
    - title: "إسناد المشاركة إلى الرماح"
      text: "جعل الرماح هي التي لم تشارك «فِي الْمَوْتِ». قال الزَّوْزَنِيّ: «والتأنيث في شاركت للرماح يبين براءة ذممهم عن سفك دمهم ليكون ذلك أبلغ في مدحهم بعقلهم القتلى» [@zawzani، ص147]."
  connection: "ثم يخلص إلى النتيجة: كلهم يؤدون ديته ألفًا بعد ألف."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَلَا شَا / رَكَتْ فِلْ مَوْ / تِ فِي دَ / مِ نَوْفَلِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — وَلَا وَ / هَبِنْ مِنْهَا / وَلَبْ نِلْ / مُحَزْزَمِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "سقطت همزة الوصل في «وَلَا ابْنِ» فنُطقت «وَلَبْنِ». ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر والأولى في العَجُز [@atiq، ص29]."
variants:
  - reading: "وَلَا ابْنِ الْمُخَزَّمِ"
    status: "رواية أبي جَعْفَر"
    note: "«وروى أبو جعفر: (المخزم) بالخاء معجمة. ورواية يعقوب وجماعة من الرواة (المحزم) بالحاء غير معجمة» [@ibn-al-anbari، ص280]."
  - reading: "وَلَا شَارَكَتْ فِي الْحَرْبِ فِي دَمِ نَوْفَلٍ ... وَلَا وَهَبٍ فِيهَا وَلَا ابْنِ الْمُخَزَّمِ"
    status: "متن التِّبْرِيزِيّ"
    note: "وقال: «ويروى (ولا شاركت في الموت)» [@tabrizi-ashr، ص124]."
  - reading: "وَلَا شَارَكُوا فِي الْقَوْمِ فِي دَمِ نَوْفَلٍ ... وَلَا وَهَبٍ مِنْهُمْ وَلَا ابْنِ الْمُحَزَّمِ"
    status: "متن الأَعْلَم"
    note: "[@diwan-zuhayr، ص23]."
