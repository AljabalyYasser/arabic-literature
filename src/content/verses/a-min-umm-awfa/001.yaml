first: "أَمِنْ أُمِّ أَوْفَى دِمْنَةٌ لَمْ تَكَلَّمِ"
second: "بِحَوْمَانَةِ الدَّرَّاجِ فَالْمُتَثَلَّمِ"
meaning: "أمِن منازل المرأة المكنّاة بأُمّ أَوْفَى هذه الآثار التي لا تجيب، بحومانة الدَّرّاج والمُتَثَلَّم؟ يسألها عن أهلها فلا تردّ. قال الأَعْلَم: «يريد أنّه سألها عن أهلها، توجّعاً منه وتذكّراً، فلم تجبه» [@diwan-zuhayr، ص9]."
vocabulary:
  - term: "أُمِّ أَوْفَى"
    text: "عند الزَّوْزَنِيّ «الحبيبة المكناة بأم أوفى» [@zawzani، ص133]. وفي الأغاني: «وأمّ أوفى: امرأة كانت لزهير فطلّقها» [@aghani-dk، ج10 ص287]."
  - term: "دِمْنَةٌ"
    text: "«آثار الناس وما سودوا بالرماد وغير ذلك» [@ibn-al-anbari، ص237]."
  - term: "لَمْ تَكَلَّمِ"
    text: "«لم يتكلم أهلها» [@ibn-al-anbari، ص237]؛ أو: لا تجيب من يسألها [@zawzani، ص133]."
  - term: "حَوْمَانَةِ"
    text: "«الحومانة جمعها حوامين: أماكن غلاظ منقادة» [@ibn-al-anbari، ص238]، أي أرض صلبة ممتدة. وعلّل الأَعْلَم نزولهم فيها: «لأنهم كانوا يتخيّرون النزول فيما غلظ من الأرض وصلب، ليكونوا بمعزل من السيل، وليمكنهم حفر النّؤي، وضرب أوتاد الخباء» [@diwan-zuhayr، ص9]. والنُّؤْي: حاجز حول البيت يردّ الماء، ويأتي في البيت 5."
  - term: "الدَّرَّاجِ فَالْمُتَثَلَّمِ"
    text: "«موضعان بالعالية منقادان» [@ibn-al-anbari، ص238]. والعالية: ما ارتفع من بلاد نجد."
syntax:
  - "الهمزة للاستفهام، والتقدير عند الأَصْمَعِيّ: «أمن دمن أم أوفى دمنة لم تكلم، أي أمن منازل أم أوفى» [@ibn-al-anbari، ص237]. وعند التِّبْرِيزِيّ: «لأن من هاهنا للتبعيض، فأخرج الدمنة من الدمن» [@tabrizi-ashr، ص102]، أي أن هذه الدمنة واحدة من دمنها. وفي الشرح المنسوب إلى ثَعْلَب: «الألف ألف الاستفهام منقولة. يريد: أدمنة من منازل أم أوفى لم تكلم» [@sharh-thalab-zuhayr، ص16]، أي أن موضع السؤال هو الدمنة نفسها."
  - "قال ابن الأَنْبارِيّ: «والدمنة رفع بالصفة، ولم تكلم صلة الدمنة، والباء حال للدمنة» [@ibn-al-anbari، ص238]. و«الصفة» في اصطلاح الكوفيين الجار والمجرور، فـ«دِمْنَةٌ» عنده مرفوعة بـ«مِنْ أُمِّ أَوْفَى»، وهي في إعراب البصريين مبتدأ مؤخر خبره «مِنْ أُمِّ أَوْفَى». و«الصلة» هنا الصفة: جملة «لَمْ تَكَلَّمِ» نعت للدمنة. والحال: وصف يبيّن هيئة صاحبه، و«بِحَوْمَانَةِ» حال من الدمنة."
  - "«تَكَلَّمِ» مجزومة بـ«لَمْ»، وكُسرت ميمها لأن الجزم «إذا حرك حرك إلى الخفض، واحتيج إلى كسرها إصلاحا للقافية» [@ibn-al-anbari، ص238]، ثم مُدّت الكسرة ياء في الإنشاد."
morphology:
  - "«تَكَلَّمِ» أصلها «تَتَكَلَّمُ»، حُذفت إحدى التاءين تخفيفًا."
  - "«الدِّمْنة» جمعها «دِمَن»، وتأتي في غير هذا الموضع بمعنى الحقد [@ibn-al-anbari، ص237]."
  - "«حَوْمانة» جمعها «حَوامين» [@ibn-al-anbari، ص238]. و«المُتَثَلَّم» اسم مفعول من «تَثَلَّمَ»، على وزن «المُتَفَعَّل»."
rhetoric:
  thesis: "يبدأ زُهَيْر بسؤال لا بخبر: أمن ديار أُمّ أَوْفَى هذه الآثار؟ والسؤال يحتمل الشك ويحتمل التوجع، والشرّاح يختلفون في أيهما أراد."
  devices:
    - title: "الاستفهام للتفجع"
      text: "قال الأَصْمَعِيّ في سؤال «أَمِنْ أُمِّ أَوْفَى دِمْنَةٌ»: «وهذا على التفجع» [@ibn-al-anbari، ص237]، أي على التوجّع والحسرة. وقال الأَعْلَم: «وهذا الاستفهام توجّعٌ منه، ولم يكن جاهلاً بها» [@diwan-zuhayr، ص9]. فالسؤال لا يطلب جوابًا، بل يبث الحزن."
    - title: "صياغة الشاكّ"
      text: "أما الزَّوْزَنِيّ فيرى في «أَمِنْ أُمِّ أَوْفَى...؟» شكًّا مقصودًا: «أخرج الكلام في معرض الشك ليدل بذلك على أنه لبعد عهده بالدمنة وفرط تغيرها لم يعرفها معرفة قطع وتحقيق» [@zawzani، ص133]. ولموضع «مِنْ أُمِّ أَوْفَى» بعد الهمزة مباشرة معنى: فعبد القاهر الجُرْجانيّ يقرر أنك إذا قلت «أأنت فعلت؟» «كان الشك في الفاعل من هو» [@dalail، ص111]؛ أي أن ما يلي الهمزة هو المسؤول عنه. فزُهَيْر لا يشك في أن أمامه دمنة، بل في أنها من ديار أُمّ أَوْفَى. والبيت 4 يرجّح قراءة الزَّوْزَنِيّ، ففيه أنه لم يعرف الدار إلا «بعد توهّم»."
    - title: "الدمنة التي لا تتكلم"
      text: "في «لَمْ تَكَلَّمِ» وصف الآثار بأنها لا تتكلم، كأن من شأنها الكلام. وفهمه المُبَرِّد على أن العرب «تجعل كلّ دليل قولاً»: «وإنما كلامها عنده أن تبين بما يرى من الآثار فيها، من قدم أهلها وحدثان عهدهم» [@kamil، ج2 ص69]. ونقل البَغْدادِيّ عن ابن السِّيد في البيت: «أي: لم يكن بها أثر يستبان لقدم عهدها بالنزول فيها» [@khizana، ج8 ص528]. فالدمنة الصامتة دمنة دارسة لا تُقرأ آثارها."
  connection: "ثم يصف ديارها بالرَّقْمَتَيْن كأنها بقايا وشم أُعيد في معصم [@ibn-al-anbari، ص238]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَمِنْ أُمْ / مِ أَوْفَى دِمْ / نَتُنْ لَمْ / تَكَلْلَمِي = فعولن / مفاعيلن / فعولن / مفاعلن — بِحَوْمَا / نَتِدْ دَرْرَا / جِ فَلْمُ / تَثَلْلَمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "همزة الوصل في «فَالْمُتَثَلَّمِ» تسقط في النطق: «فَلْمُتَثَلْلَمِي». وجاءت «فعولن» مقبوضة مرة واحدة في العَجُز؛ والقبض حذف الخامس الساكن، وهو جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]. والعَجُز: الشطر الثاني من البيت."
context: "مطلع معلقة زُهَيْر، وقد قالها يمدح الحارِث بن عَوْف وهَرِم بن سِنان حين تحمّلا ديات القتلى وأصلحا بين عَبْس وذُبْيان [@ibn-al-anbari، ص236]. يفتح النسيب بالدار، والنسيب: ذكر النساء والديار في أول القصيدة. وعلى وزن هذا البيت يمثّل عَتِيق للبحر الطويل [@atiq، ص30]."
variants:
  - reading: "بِحَوْمَانَةِ الدُّرَّاجِ"
    status: "رواية أبي العباس، ويرويها أبو عمرو عن بعض ولد زُهَيْر"
    note: "بضم الدال: «وقال أبو العباس: يروى (الدُّراج) بضم الدال. وقال يعقوب: قال الأصمعي: الدَّراج بفتح الدال» [@ibn-al-anbari، ص238]. وفي الأغاني أن أبا عمرو روى «عن بعض ولد زهير» الدُّرّاجَ «مضمومة الدال» [@aghani-dk، ج10 ص287]. وبالضم يروي الشرح المنسوب إلى ثَعْلَب في الرواية الأخرى [@sharh-thalab-zuhayr، ص16]، ويقول التِّبْرِيزِيّ: «والدراج بفتح الدال وضمها» [@tabrizi-ashr، ص103]."
