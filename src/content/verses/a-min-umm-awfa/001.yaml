first: "أَمِنْ أُمِّ أَوْفَى دِمْنَةٌ لَمْ تَكَلَّمِ"
second: "بِحَوْمَانَةِ الدَّرَّاجِ فَالْمُتَثَلَّمِ"
meaning: "أمِن منازل الحبيبة المكنّاة بأُمّ أَوْفَى هذه الآثار التي لا تجيب، بحومانة الدرّاج والمُتَثَلَّم؟ يسأل كأنه لا يكاد يعرفها، لطول عهده بها وشدة تغيرها [@zawzani، ص133]."
vocabulary:
  - term: "أُمِّ أَوْفَى"
    text: "كنية الحبيبة [@zawzani، ص133]."
  - term: "دِمْنَةٌ"
    text: "آثار الناس وما سوّدوا بالرماد وغيره [@ibn-al-anbari، ص237]."
  - term: "لَمْ تَكَلَّمِ"
    text: "لم يتكلم أهلها [@ibn-al-anbari، ص237]؛ أو: لا تجيب من يسألها [@zawzani، ص133]."
  - term: "حَوْمانة الدَّرّاج والمُتَثَلَّم"
    text: "موضعان بالعالية [@ibn-al-anbari، ص238]. والحومانة: الأرض الغليظة المنقادة [@ibn-al-anbari، ص238]."
syntax:
  - "الهمزة للاستفهام، والتقدير عند الأَصْمَعِيّ: أمِن دِمَن أُمّ أَوْفَى دمنةٌ لم تكلّم؟ أي: أمن منازلها [@ibn-al-anbari، ص237]."
  - "«دِمْنَةٌ» مبتدأ مؤخر، و«مِنْ أُمِّ أَوْفَى» خبر مقدم، و«لَمْ تَكَلَّمِ» صفة للدمنة، و«بِحَوْمَانَةِ الدَّرَّاجِ» حال منها [@ibn-al-anbari، ص238]."
  - "«تَكَلَّمِ» مجزومة بـ«لَمْ»، وكُسرت ميمها لإصلاح القافية، لأن الساكن إذا حُرّك حُرّك إلى الكسر، ثم مُدّت الكسرة ياء [@ibn-al-anbari، ص238]."
morphology:
  - "«تَكَلَّمِ» أصلها «تتكلّم»، حُذفت إحدى التاءين تخفيفًا."
  - "«الدِّمنة» جمعها «دِمَن»، وتأتي في غير هذا الموضع بمعنى الحقد [@ibn-al-anbari، ص237]."
  - "«حَوْمانة» جمعها «حَوامين» [@ibn-al-anbari، ص238]."
rhetoric:
  thesis: "يبدأ زُهَيْر بسؤال لا بخبر: أمن ديار أُمّ أَوْفَى هذه الآثار؟ فالشك نفسه يدل على طول الغياب وشدة التغير."
  devices:
    - title: "الاستفهام للتفجع"
      text: "قال الأَصْمَعِيّ في سؤال «أَمِنْ أُمِّ أَوْفَى دِمْنَةٌ»: «وهذا على التفجع» [@ibn-al-anbari، ص237]، أي على التوجّع والحسرة. فالسؤال لا يطلب جوابًا، بل يبث الحزن."
    - title: "صياغة الشاكّ"
      text: "صاغ الشاعر كلامه صياغة الشاكّ: «أَمِنْ أُمِّ أَوْفَى...؟»، كأنه لا يتيقن أن هذه ديارها. وهذا الشك مقصود: يدل على أنه غاب عنها طويلًا، وأنها تغيرت حتى كاد لا يعرفها. قال الزَّوْزَنِيّ: «أخرج الكلام في معرض الشك ليدل بذلك على أنه لبعد عهده بالدمنة وفرط تغيرها لم يعرفها معرفة قطع وتحقيق» [@zawzani، ص133]."
    - title: "الدمنة التي لا تتكلم"
      text: "وصف الآثار بأنها «لَمْ تَكَلَّمِ»، كأن من شأنها أن تتكلم؛ فالشاعر يسائل الديار كما يسائل الناس."
  connection: "ثم يصف ديارها بالرَّقْمَتَيْن كأنها بقايا وشم في معصم [@ibn-al-anbari، ص238]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَمِنْ أُمْ / مِ أَوْفَى دِمْ / نَتُنْ لَمْ / تَكَلْلَمِي = فعولن / مفاعيلن / فعولن / مفاعلن — بِحَوْمَا / نَتِدْ دَرْرَا / جِ فَلْمُ / تَثَلْلَمِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "همزة الوصل في «فَالْمُتَثَلَّمِ» تسقط في النطق: «فَلْمُتَثَلْلَمِي». وجاءت «فعولن» مقبوضة مرة واحدة في العَجُز، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "مطلع معلقة زُهَيْر، وقد قالها يمدح الحارِث بن عَوْف وهَرِم بن سِنان حين تحمّلا ديات القتلى وأصلحا بين عَبْس وذُبْيان [@ibn-al-anbari، ص236]. وعلى وزنها يمثّل عَتِيق للبحر الطويل [@atiq، ص30]."
variants:
