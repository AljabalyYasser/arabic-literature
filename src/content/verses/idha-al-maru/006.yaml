first: "وَأُخْرَى أُصَادِي النَّفْسَ عَنْهَا وَإِنَّهَا"
second: "لَمَوْرِدُ حَزْمٍ إِنْ فَعَلْتُ وَمَصْدَرُ"
vocabulary:
  - term: "أُصَادِي النَّفْسَ"
    text: "أداريها؛ قال أبو العباس في المصاداة: «قال أهل الكوفة هي المداراة» [@lisan، ج14 ص456]."
  - term: "لَمَوْرِدُ حَزْمٍ... وَمَصْدَرُ"
    text: "يرد فيها الحزم ويصدر، أي هي الخطة الحازمة."
