explained: false
first: "أَقُولُ لِلِحْيَانٍ وَقَدْ صَفِرَتْ لَهُمْ"
second: "وِطَابِي وَيَوْمِي ضَيِّقُ الجُحْرِ مُعْوِرُ"
vocabulary:
  - term: "لِحْيَانٍ"
    text: "بطن من هُذَيْل."
  - term: "صَفِرَتْ لَهُمْ وِطَابِي"
    text: "خلت أسقيتي، والوطاب أسقية اللبن، وأراد ظروف العسل التي صبّها."
  - term: "ضَيِّقُ الجُحْرِ مُعْوِرُ"
    text: "ضيّق المخرج، مكشوف لا ستر فيه من العدو."
sources:
  - source: "tabrizi-hamasa"
    loc: "ج1 ص17"
    url: "https://shamela.ws/book/6907/16"
