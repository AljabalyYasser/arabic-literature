first: "إِذَا المَرْءُ لَمْ يَحْتَلْ وَقَدْ جَدَّ جِدُّهُ"
second: "أَضَاعَ وَقَاسَى أَمْرَهُ وَهْوَ مُدْبِرُ"
vocabulary:
  - term: "لَمْ يَحْتَلْ"
    text: "لم يطلب الحيلة."
  - term: "جَدَّ جِدُّهُ"
    text: "اشتدّ عليه الأمر."
  - term: "مُدْبِرُ"
    text: "مولٍّ قد فاته وجه الخلاص."
