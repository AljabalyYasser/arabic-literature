explained: false
first: "إِذَا المَرْءُ لَمْ يَحْتَلْ وَقَدْ جَدَّ جِدُّهُ"
second: "أَضَاعَ وَقَاسَى أَمْرَهُ وَهْوَ مُدْبِرُ"
vocabulary:
  - term: "لَمْ يَحْتَلْ"
    text: "لم يطلب الحيلة."
  - term: "جَدَّ جِدُّهُ"
    text: "زاد اجتهاده، وفي حاشية محقق شرح الحماسة للتبريزي: «وجد جده أي زاد اجتهاده» [@tabrizi-hamasa، ج1 ص17، الحاشية]."
  - term: "مُدْبِرُ"
    text: "مولٍّ قد فاته وجه الخلاص؛ وفي الحاشية نفسها: «وهو مول مدبر» [@tabrizi-hamasa، ج1 ص17، الحاشية]."
