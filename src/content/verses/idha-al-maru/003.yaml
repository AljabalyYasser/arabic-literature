explained: false
first: "فَذَاكَ قَرِيعُ الدَّهْرِ مَا عَاشَ حُوَّلٌ"
second: "إِذَا سُدَّ مِنْهُ مَنْخِرٌ جَاشَ مَنْخِرُ"
vocabulary:
  - term: "قَرِيعُ الدَّهْرِ"
    text: "الذي جرّبته الأيام وقرعته الشدائد."
  - term: "حُوَّلٌ"
    text: "كثير الحيلة، يحوّل الأمور على وجوهها."
  - term: "إِذَا سُدَّ مِنْهُ مَنْخِرٌ جَاشَ مَنْخِرُ"
    text: "إذا ضاق عليه مخرج انفتح له مخرج آخر، كالذي يُسدّ أحد منخريه فيتنفس بالآخر."
sources:
  - source: "tabrizi-hamasa"
    loc: "ج1 ص17"
