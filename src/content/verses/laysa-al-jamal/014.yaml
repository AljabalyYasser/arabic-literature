first: مَا إِنْ جَزِعْتُ وَلَا هَلِعْـ
second: ـتُ وَلَا يَرُدُّ بُكَايَ زَنْدَا
vocabulary:
- term: هَلِعْتُ
  text: من الهَلَع، وهو «أسوأ الجزع وأفحشه» [@lisan، ج8 ص374].
- term: زَنْدَا
  text: العود الذي يُقدح به النار [@lisan، ج3 ص195]، يريد أن البكاء لا يردّ شيئًا مهما قلّ.
