first: وَعَلِمْتُ أَنِّي يَوْمَ ذَا
second: كَ مُنَازِلٌ كَعْبًا وَنَهْدَا
vocabulary:
- term: مُنَازِلٌ
  text: مُقاتل منازلةً، أي وجهًا لوجه.
- term: كَعْبًا وَنَهْدَا
  text: 'قبيلتان؛ قال ابن بَرِّيّ: «أراد بكعب بني الحرث بن كعب وهم من مذحج ونهد من قضاعة، وكانت بينه وبينهم حروب» [@lisan، ج5 ص235].'
