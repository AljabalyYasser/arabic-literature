explained: false
first: أَعْدَدْتُ لِلْحَدَثَانِ سَا
second: بِغَةً وَعَدَّاءً عَلَنْدَى
vocabulary:
- term: الْحَدَثَانِ
  text: 'نوائب الدهر؛ «وحدثان الدهر… وحوادثه: نوبه، وما يحدث منه» [@lisan، ج2 ص132].'
- term: سَابِغَةً
  text: '«والسابغة: الدرع الواسعة» [@lisan، ج8 ص433].'
- term: عَدَّاءً
  text: فرسًا كثير العَدْو.
- term: عَلَنْدَى
  text: 'ضخمًا شديدًا؛ «والعلندى: البعير الضخم الشديد، وقيل: الضخم الطويل وكذلك الفرس» [@lisan، ج3 ص301].'
