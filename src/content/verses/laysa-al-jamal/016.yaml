first: أُغْنِي غَنَاءَ الذَّاهِبِيـ
second: ـنَ أُعَدُّ لِلْأَعْدَاءِ عَدَّا
vocabulary:
- term: أُغْنِي غَنَاءَ الذَّاهِبِينَ
  text: أكفي كفاية من مضى من قومي، وأقوم مقامهم.
- term: أُعَدُّ لِلْأَعْدَاءِ عَدَّا
  text: أُحسب وحدي بعدد من الرجال في وجه الأعداء.
