explained: false
first: "يَبِيتُ النَّدَى يَا أُمَّ عَمْرٍو ضَجِيعَهُ"
second: "إِذَا لَمْ يَكُنْ فِي المُنْقِيَاتِ حَلُوبُ"
vocabulary:
  - term: "النَّدَى"
    text: "الكرم."
  - term: "ضَجِيعَهُ"
    text: "ملازمًا له كمن ينام إلى جنبه."
  - term: "المُنْقِيَاتِ"
    text: "يقول محققا «الأصمعيات»: «ذوات النقي وهو الشحم» [@asmaiyyat، ص96، الحاشية]."
  - term: "حَلُوبُ"
    text: "«التي تحلب، يريد الناقة» [@asmaiyyat، ص96، الحاشية]. أي إذا جفّت ألبان الإبل في الجدب."
