first: "تَرَى عَرَصَاتِ الحَيِّ تُمْسِي كَأَنَّهَا"
second: "إِذَا غَابَ لَمْ يَحْلُلْ بِهِنَّ عَرِيبُ"
vocabulary:
  - term: "عَرَصَاتِ"
    text: "يقول محققا «الأصمعيات»: «جمع عرصة، البقعة الواسعة بين الدور ليس فيها بناء» [@asmaiyyat، ص97، الحاشية]."
  - term: "عَرِيبُ"
    text: "«أحد، ولا تستعمل في غير النفي» [@asmaiyyat، ص97، الحاشية]."
