explained: false
first: "كَأَنَّ أَبَا المِغْوَارِ لَمْ يُوفِ مَرْقَبًا"
second: "إِذَا رَبَأَ القَوْمَ الغُزَاةَ رَقِيبُ"
vocabulary:
  - term: "يُوفِ مَرْقَبًا"
    text: "يقول محققا «الأصمعيات»: «المرقب والمرقبة: الموضع المشرف يرتفع عليه الرقيب. وأوفيت عليه وأوفيت فيه: أشرفت وعلوت» [@asmaiyyat، ص96، الحاشية]."
  - term: "رَبَأَ القَوْمَ"
    text: "«اطلع لهم على شرف» [@asmaiyyat، ص96، الحاشية]، أي صار لهم طليعة."
