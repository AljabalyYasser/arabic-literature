first: "إِذَا حَلَّ لَمْ يُقْصِ المَحَلَّةَ بَيْتَهُ"
second: "وَلَكِنَّهُ الأَدْنَى بِحَيْثُ تَنُوبُ"
vocabulary:
  - term: "لَمْ يُقْصِ المَحَلَّةَ بَيْتَهُ"
    text: "يقول محققا «الأصمعيات»: «أي لم يبعد بيته عن المحلة، بحذف الخافض» [@asmaiyyat، ص96، الحاشية]، فلا يتوارى عن الضيفان."
  - term: "تَنُوبُ"
    text: "«أي تنوب النوائب» [@asmaiyyat، ص96، الحاشية]."
