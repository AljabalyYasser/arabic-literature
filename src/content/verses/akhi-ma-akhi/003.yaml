first: "لَقَدْ كَانَ أَمَّا حِلْمُهُ فَمُرَوِّحٌ"
second: "عَلَيْنَا وَأَمَّا جَهْلُهُ فَعَزِيبُ"
vocabulary:
  - term: "فَمُرَوِّحٌ"
    text: "يقول محققا «الأصمعيات»: «من الرواح» [@asmaiyyat، ص95، الحاشية]، أي يروح علينا ويأتينا كما تروح الإبل إلى أهلها."
  - term: "جَهْلُهُ"
    text: "غضبه وحدّته."
  - term: "فَعَزِيبُ"
    text: "«بعيد» [@asmaiyyat، ص95، الحاشية]."
