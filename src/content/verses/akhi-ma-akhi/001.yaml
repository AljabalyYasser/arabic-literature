first: "أَخِي مَا أَخِي لَا فَاحِشٌ عِنْدَ بَيْتِهِ"
second: "وَلَا وَرَعٌ عِنْدَ اللِّقَاءِ هَيُوبُ"
vocabulary:
  - term: "أَخِي مَا أَخِي"
    text: "تعظيم وتعجيب: أيّ أخ كان أخي!"
  - term: "فَاحِشٌ"
    text: "بذيء القول والفعل."
  - term: "وَرَعٌ"
    text: "يقول محققا «الأصمعيات»: «الورع، بفتحتين: الجبان» [@asmaiyyat، ص95، الحاشية]."
  - term: "هَيُوبُ"
    text: "كثير الهيبة والخوف."
