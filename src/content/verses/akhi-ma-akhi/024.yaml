explained: false
first: "تَرَوَّحَ تَزْهَاهُ صَبًا مُسْتَطِيفَةٌ"
second: "بِكُلِّ ذَرًا وَالمُسْتَرَادُ جَدِيبُ"
vocabulary:
  - term: "تَرَوَّحَ"
    text: "يقول محققا «الأصمعيات»: «سار في الرواح، وهو من لدن زوال الشمس إلى الليل، والضمير للغريب في البيت السابق» [@asmaiyyat، ص97، الحاشية]."
  - term: "تَزْهَاهُ"
    text: "«تسوقه وتدفعه» [@asmaiyyat، ص97، الحاشية]."
  - term: "صَبًا"
    text: "«ريح تهب من المشرق» [@asmaiyyat، ص97، الحاشية]."
  - term: "مُسْتَطِيفَةٌ"
    text: "مطيفة به."
  - term: "ذَرًا"
    text: "«كل ما استتر به» [@asmaiyyat، ص97، الحاشية]."
  - term: "المُسْتَرَادُ"
    text: "«موضع الارتياد للكلأ» [@asmaiyyat، ص97، الحاشية]."
