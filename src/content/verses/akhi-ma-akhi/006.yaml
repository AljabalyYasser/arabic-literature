explained: false
first: "كَعَالِيَةِ الرُّمْحِ الرُّدَيْنِيِّ لَمْ يَكُنْ"
second: "إِذَا ابْتَدَرَ الخَيْلَ الرِّجَالُ يَخِيبُ"
vocabulary:
  - term: "عَالِيَةِ الرُّمْحِ"
    text: "أعلاه مما يلي السنان."
  - term: "الرُّدَيْنِيِّ"
    text: "يقول محققا «الأصمعيات»: «نسبة إلى ردينة، امرأة سمهر، التي تنسب إليه الرماح السمهرية، وكانا يقومان الرماح بخط هجر» [@asmaiyyat، ص95، الحاشية]."
  - term: "ابْتَدَرَ"
    text: "تسابق إلى."
  - term: "يَخِيبُ"
    text: "يرجع بلا غنيمة."
