explained: false
first: "هَوَتْ أُمُّهُ مَا يَبْعَثُ الصُّبْحُ غَادِيًا"
second: "وَمَاذَا يُؤَدِّي اللَّيْلُ حِينَ يَؤُوبُ"
vocabulary:
  - term: "هَوَتْ أُمُّهُ"
    text: "يقول البغدادي: «قال القالي: أي هلكت أمه كأنها انحدرت إلى الهاوية»، والمراد «ليس الدعاء بالوقوع بل التعجب والمدح كقولهم: قاتله الله ما أفصحه» [@khizana، ج10 ص436]."
  - term: "مَا يَبْعَثُ الصُّبْحُ غَادِيًا"
    text: "أي شيء يبعث الصبح منه حين يغدو إلى الحرب، وأي شيء يردّ الليل منه حين يرجع إلى أهله [@khizana، ج10 ص437]."
  - term: "يَؤُوبُ"
    text: "يرجع."
