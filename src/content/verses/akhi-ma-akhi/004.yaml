first: "حَلِيمٌ إِذَا مَا سَوْرَةُ الجَهْلِ أُطْلِقَتْ"
second: "حُبَى الشِّيبِ لِلنَّفْسِ اللَّجُوجِ غَلُوبُ"
vocabulary:
  - term: "سَوْرَةُ الجَهْلِ"
    text: "«حدته» [@asmaiyyat، ص95، الحاشية]."
  - term: "حُبَى الشِّيبِ"
    text: "الحُبى جمع حُبْوة، وهي الثوب يحتبي به الجالس فيشدّ ظهره وساقيه، وإطلاقها كناية عن ذهاب الحلم. يقول محققا «الأصمعيات»: «وإنما خص حبى الشيب لأنهم أكثر وقارا» [@asmaiyyat، ص95، الحاشية]."
  - term: "اللَّجُوجِ"
    text: "«المتمادية» [@asmaiyyat، ص95، الحاشية]."
