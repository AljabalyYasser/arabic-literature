first: "لَا أَعْرِفَنَّكَ بَعْدَ اليَوْمِ تَنْدُبُنِي"
second: "وَفِي حَيَاتِيَ مَا زَوَّدْتَنِي زَادِي"
vocabulary:
  - term: "لَا أَعْرِفَنَّكَ"
    text: "«لَا: ناهية. وَنهي الْمُتَكَلّم نَفسه قَلِيل» [@khizana، ج11 ص258]: لا تفعلنّ ما أعرفك به."
  - term: "تَنْدُبُنِي"
    text: "تبكيني وتعدّد محاسني بعد موتي."
