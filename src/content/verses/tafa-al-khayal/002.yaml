first: "أَنَّى اهْتَدَيْتَ لِرَكْبٍ طَالَ لَيْلُهُمُ"
second: "فِي سَبْسَبٍ بَيْنَ دَكْدَاكٍ وَأَعْقَادِ"
vocabulary:
  - term: "أَنَّى اهْتَدَيْتَ"
    text: "«التِفَات من الغيبة إلى الخطاب» [@khizana، ج11 ص257]."
  - term: "سَبْسَبٍ"
    text: "«المفازة والقفر» [@khizana، ج11 ص257]."
  - term: "دَكْدَاكٍ"
    text: "«من الرمل: ما التبد وَلم يرْتَفع» [@khizana، ج11 ص257]."
  - term: "أَعْقَادِ"
    text: "«جمع عقد ... هُوَ مَا تعقّد من الرمل أَي: تراكم» [@khizana، ج11 ص257]."
