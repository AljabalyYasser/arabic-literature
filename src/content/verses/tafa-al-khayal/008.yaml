explained: false
first: "فَانْظُرْ إِلَى ظِلِّ مُلْكٍ أَنْتَ تَارِكُهُ"
second: "هَلْ تُرْسِيَنَّ أَوَاخِيهِ بِأَوْتَادِ"
vocabulary:
  - term: "أَوَاخِيهِ"
    text: "«جمع آخية» [@khizana، ج11 ص258]، والآخيّة «عُودٌ يُعَرَّض فِي الْحَائِطِ ويُدْفَن طَرَفاه فِيهِ وَيَصِيرُ وسَطه كالعُروة تُشدُّ إِلَيْهِ الدابَّة» [@lisan، ج14 ص23]."
  - term: "هَلْ تُرْسِيَنَّ"
    text: "هل تثبّتنّ: ملكك ظل زائل لا تثبته الأوتاد."
