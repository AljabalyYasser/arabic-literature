explained: false
first: "قَدْ أَتْرُكُ القِرْنَ مُصْفَرًّا أَنَامِلُهُ"
second: "كَأَنَّ أَثْوَابَهُ مُجَّتْ بِفِرْصَادِ"
vocabulary:
  - term: "القِرْنَ"
    text: "«المثل فِي الشجَاعَة» [@khizana، ج11 ص258]، أي الكفء في القتال."
  - term: "مُصْفَرًّا أَنَامِلُهُ"
    text: "يقتله فينزف دمه فتصفرّ أنامله، و«قال الأعلم: خصّ الأنامل لِأَن الصُّفْرَة إِلَيْهَا أسْرع وفيهَا أظهر» [@khizana، ج11 ص258]."
  - term: "مُجَّتْ بِفِرْصَادِ"
    text: "«ومجّت: دميت وَالْمرَاد صبغت»، والفرصاد «قَالَ الأعلم: هُوَ التّوت شبّه الدَّم بحمرة عصارته» [@khizana، ج11 ص258]."
