first: "نَزَلْتُمْ مَنْزِلَ الْأَضْيَافِ مِنَّا"
second: "فَعَجَّلْنَا الْقِرَى أَنْ تَشْتِمُونَا"
meaning: "جئتم إلينا كما يجيء الضيوف، فعجّلنا لكم القِرى لئلّا تشتمونا على تأخيره. والقِرى هنا الحرب. قال ابن الأَنْبارِيّ: «معناه نزلتم بحيث نزل الأضياف فعجلنا القرى. وإنما هذا مثل. أراد: عاجلناكم بالحرب ولم ننتظركم أن تشتمونا» [@ibn-al-anbari، ص420]. وقال الزَّوْزَنِيّ: «والمعنى: تعرضتم لمعاداتنا كما يتعرض الضيف للقِرى فقتلناكم عجالًا كما يحمد تعجيل قِرى الضيف» [@zawzani، ص222]."
vocabulary:
  - term: "الْأَضْيَافِ"
    text: "الضيوف، جمع «ضَيْف»."
  - term: "الْقِرَى"
    text: "طعام الضيف وما يُكرم به، «والقرى يمد ويقصر» [@ibn-al-anbari، ص421]."
  - term: "تَشْتِمُونَا"
    text: "تسبّونا، والضيف يشتم المضيف إذا أبطأ عليه بالقرى."
syntax:
  - "«مَنْزِلَ» منصوب على الظرفية، «معناه نزلتم بحيث نزل الأضياف» [@ibn-al-anbari، ص420]."
  - "«أَنْ تَشْتِمُونَا» فيه مذهبان. الكوفيون يقدّرون «لئلا تشتمونا»: «وموضع أن نصب على معنى لأن لا تشتمونا، فحذف الخافض واكتفى بأن من لا فأسقطها»، واستشهد بقوله تعالى: {وَأَلْقَى فِي الْأَرْضِ رَوَاسِيَ أَنْ تَمِيدَ بِكُمْ}، «معناه لأن لا تميد» [@ibn-al-anbari، ص420]. والبصريون يقدّرون مضافًا محذوفًا: «أراد كراهة أن تشتمونا، فحذف الكراهة وأقام أن مقامها» [@ibn-al-anbari، ص421]. قال التِّبْرِيزِيّ: «ولا يجوز عند البصريين حذف لا، لأن المعنى ينقلب» [@tabrizi-ashr، ص246]."
  - "«تَشْتِمُونَا» منصوب بـ«أن» وعلامة نصبه حذف النون، و«نا» مفعول به."
morphology:
  - "«أَضْيَاف» جمع «ضَيْف» على «أَفْعَال»."
  - "«الْقِرَى» مصدر «قَرَى الضيفَ يَقْرِيه»، ناقص يائي."
  - "«عَجَّلْنَا» على «فَعَّلَ» من «عَجِلَ»، والتضعيف للتعدية."
rhetoric:
  thesis: "سخرية مُرّة: يجعل الحرب قِرى، والأعداء ضيوفًا، والقتل كرمًا."
  devices:
    - title: "التهكم في «فَعَجَّلْنَا الْقِرَى أَنْ تَشْتِمُونَا»"
      text: "التهكم أن يُخرج الكلام في صورة الإكرام والمراد ضدّه. قال الزَّوْزَنِيّ: «ثم قال تهكمًا بهم واستهزاء: أن تشتمونا، أي قريناكم على عجلة كراهية شتمكم إيانا إن أخّرنا قراكم» [@zawzani، ص222]."
    - title: "الاستعارة في «مَنْزِلَ الْأَضْيَافِ» و«الْقِرَى»"
      text: "«وإنما هذا مثل» [@ibn-al-anbari، ص420]: جعل الغزاة ضيوفًا والحرب طعامًا لهم. وهي الاستعارة عند عبد القاهر الجُرْجانيّ: أن تترك التصريح بالتشبيه «وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "قلب القيمة"
      text: "تعجيل القرى من أعلى مكارم العرب، فأخذ الشاعر فضيلة الكرم وجعلها صورة للقتل السريع، فيمدح قومه بالكرم والبطش في كلمة واحدة. وهذه قراءتنا."
  connection: "ثم يتم الصورة: «قريناكم فعجّلنا قراكم»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "نَزَلْتُمْ مَنْ / زِلَلْ أَضْيَا / فِ مِنْنَا = مفاعلْتن / مفاعلْتن / فعولن — فَعَجْجَلْنَلْ / قِرَى أَنْ تَشْ / تِمُونَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلات الأربع في الحشو."
context: "من خطاب إياد (78–81). وموضعه يختلف في الروايات: هو عند الزَّوْزَنِيّ بعد أبيات الرحى (24–25) في أول الفخر [@zawzani، ص222]، وفي الجَمْهَرة يليه بيت القرى ثم بيتا الرحى [@jamhara، ص296]. وفي قول ابن الأَنْبارِيّ معنى آخر: «معناه عاجلناكم بالقتال قبل أن توقعوا بنا فتكونوا سبباً لشتم الناس إيانا»، ونقل عن أبي جَعْفَر: «معناه نحن مستعدون، فلا يُطمع فينا، ولا يفجؤنا بغارة أحد» [@ibn-al-anbari، ص420]."
