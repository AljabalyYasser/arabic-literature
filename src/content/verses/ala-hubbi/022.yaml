first: "تَرَكْنَا الْخَيْلَ عَاكِفَةً عَلَيْهِ"
second: "مُقَلَّدَةً أَعِنَّتَهَا صُفُونَا"
meaning: "تركنا خيلنا واقفة عند جثته، قد عُلّقت أعنّتها في أعناقها، وهي قائمة على ثلاث قوائم. أي قتلناه ونزلنا عن خيلنا عنده. قال الزَّوْزَنِيّ: «يقول: قتلناه وحبسنا خيلنا عليه وقد قلّدناها أعنتها في حال صفونها عنده» [@zawzani، ص221]. ويذكر التِّبْرِيزِيّ وجهين: «أحدهما أن يريد خيله وخيل أصحابه، يقول: أحطنا به لأخذ سلبه، فقد نزل الرجال عن الخيل فقلّدوها الأعنة يأخذون السلب، وإذا أراد معشره فالمعنى أن أصحابه لم يُغنوا عنه شيئا وهم حواليه لا يردون عنه» [@tabrizi-ashr، ص226]."
vocabulary:
  - term: "عَاكِفَةً"
    text: "«معناه واقفة مقيمة عليه» [@ibn-al-anbari، ص389]."
  - term: "مُقَلَّدَةً أَعِنَّتَهَا"
    text: "عُلّقت أعنّتها في أعناقها كالقلائد، لأن فرسانها نزلوا عنها."
  - term: "صُفُونَا"
    text: "«وقال الفراء: الصافن القائم على ثلاث» [@ibn-al-anbari، ص390]، وقال الزَّوْزَنِيّ: «وقد صفن الفرس يصفن صفونًا إذا قام على ثلاث قوائم وثَنَّى سنبكه الرابع» [@zawzani، ص221]. والسنبك: طرف الحافر. وفي «لسان العرب»: «وصَفَنَتِ الدابةُ تَصْفِنُ صُفُوناً: قَامَتْ عَلَى ثلاثٍ» [@lisan، ج13 ص248]."
syntax:
  - "قال ابن الأَنْبارِيّ: «وعاكفة نصب بتركنا، ومقلدة تابع لعاكفة، وكذلك صفونا» [@ibn-al-anbari، ص390]. و«ترك» هنا بمعنى «صيّر»، فـ«الخيلَ» مفعول أول، و«عاكفةً» مفعول ثانٍ."
  - "«مقلّدةً» اسم مفعول من «قلّد» الذي يتعدى إلى مفعولين، ونائب فاعله ضمير الخيل، و«أعنّتَها» مفعوله الثاني."
  - "«عليه» متعلق بـ«عاكفة»، والضمير يعود على السيد في البيت السابق."
morphology:
  - "«عاكِفة» اسم فاعل من «عَكَفَ يَعْكُفُ»."
  - "«أَعِنَّة» جمع «عِنَان» على «أَفْعِلَة»."
  - "«صُفُون» جمع «صافِن» على «فُعُول»، قال ابن الأَنْبارِيّ: «وواحدة الصفون صافن» [@ibn-al-anbari، ص389]."
rhetoric:
  thesis: "لم يصف المعركة ولا ضربة القتل، بل وصف ما بعدها: خيل ساكنة حول جثة ملك. فالمشهد الساكن يقول إن كل شيء قد انتهى."
  devices:
    - title: "الكناية في «تَرَكْنَا الْخَيْلَ عَاكِفَةً عَلَيْهِ»"
      text: "لم يقل: قتلناه، بل ذكر ما يتبع القتل: خيل تقف عند المقتول. والزَّوْزَنِيّ يصرّح بالمراد: «قتلناه». والكناية عند عبد القاهر الجُرْجانيّ أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "الاستعارة في «عَاكِفَةً»"
      text: "العكوف الإقامة على الشيء ولزومه، ومنه عكوف العابد. واستشهد له ابن الأَنْبارِيّ بقوله تعالى: «الذي ظلت عليه عاكفا» [@ibn-al-anbari، ص390]. فكأن الخيل تعتكف عند جثة الملك."
    - title: "الصورة الساكنة"
      text: "بعد حركة الحرب في الأبيات السابقة، مشهد سكون تام: خيل لا تتحرك، وأعنّة مرخاة. والسكون هنا دليل الحسم. وهذه قراءتنا."
  connection: "ثم يقول: حتى كلاب الحي كرهتنا، وكسرنا شوكة من حولنا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "تَرَكْنَلْ خَيْ / لَ عَاكِفَةَنْ / عَلَيْهِي = مفاعَلْتن / مفاعلَتن / فعولن — مُقَلْلَدَةَنْ / أَعِنْنَتَهَا / صُفُونَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، فصارت «مفاعَلْتن»."
context: "جواب «رُبّ» في البيت السابق، فالبيتان معًا خبر واحد عن ملك قتلته تَغْلِب. وهو عند الزَّوْزَنِيّ البيت السابع والعشرون، وبعده عنده بيت ليس في رواية ابن الأَنْبارِيّ [@zawzani، ص221]."
variants:
  - reading: "تَرَكْنَا الْخَيْلَ عَاطِفَةً عَلَيْهِ"
    status: "رواية يذكرها التِّبْرِيزِيّ"
    note: "قال: «ويروى (عاطفة عليه)» [@tabrizi-ashr، ص226]، أي مائلة إليه."
  - reading: "وَأَنْزَلْنَا الْبُيُوتَ بِذِي طُلُوحٍ / إِلَى الشَّامَاتِ نَنْفِي الْمُوعِدِينَا"
    status: "بيت يرويه الزَّوْزَنِيّ بعد هذا البيت، وليس في رواية ابن الأَنْبارِيّ"
    note: "قال الزَّوْزَنِيّ: «يقول: وأنزلنا بيوتنا بمكان يعرف بذي طلوح إلى الشامات ننفي من هذه الأماكن أعداءنا الذين كانوا يوعدوننا» [@zawzani، ص222]."
