first: "إِلَيْكُمْ يَا بَنِي بَكْرٍ إِلَيْكُمْ"
second: "أَلَمَّا تَعْرِفُوا مِنَّا الْيَقِينَا"
meaning: "تنحّوا عنّا يا بني بكر، تنحّوا! ألم تعرفوا بعدُ جدّنا في الحرب معرفة يقين؟ قال ابن الأَنْبارِيّ: «معناه ارجعوا. يقال: اذهب إليك»، وقال في العجز: «معناه ألما تعرفوا منا الجد في الحرب» [@ibn-al-anbari، ص413]. ونقل عن أبي جَعْفَر: «ارجعوا فلستم من رجالنا وأريحوا أنفسكم» [@ibn-al-anbari، ص414]. وقال الزَّوْزَنِيّ: «أي قد علمتم ذلك لنا فلا تتعرضوا لنا» [@zawzani، ص230]."
vocabulary:
  - term: "إِلَيْكُمْ"
    text: "كلمة زجر بمعنى: تنحّوا وابتعدوا. وفي اللسان: «قَالَ ابْنُ السِّكِّيتِ: مَعْنَاهُ اذْهَبُوا إليكُم وتَباعَدوا عَنَّا» [@lisan، ج15 ص436]."
  - term: "بَنِي بَكْرٍ"
    text: "بكر بن وائل، إخوة تَغْلِب وخصومهم في المجلس الذي أُنشدت فيه القصيدة."
  - term: "الْيَقِينَا"
    text: "الجِدّ في الحرب كما فسّره ابن الأَنْبارِيّ [@ibn-al-anbari، ص413]، أي ما يُعلم من بأسهم علمًا لا شك فيه."
syntax:
  - "«واليكم صلة لفعل مضمر، معناه: اذهبوا إليكم» [@ibn-al-anbari، ص413]، على مذهب الكوفيين. وهو عند غيرهم اسم فعل: «إليك: اسم للفعل، فإذا قال القائل (إليك عني) فمعناه أبعد» [@tabrizi-ashr، ص242]. وقال البَغْداديّ: «وإليكم: اسْم فعل أَي: ابعدوا وتنحوا عَنَّا إِلَى أقْصَى مَا يُمكن من الْبعد» [@khizana، ج9 ص10]."
  - "«يَا بَنِي بَكْرٍ» منادى مضاف منصوب بالياء لأنه ملحق بجمع المذكر السالم، و«بَكْرٍ» مضاف إليه."
  - "«أَلَمَّا»: الهمزة للاستفهام، و«لمّا» حرف نفي وجزم، و«تَعْرِفُوا» مجزوم وعلامة جزمه حذف النون، و«الْيَقِينَا» مفعول به. والفرق بين «لمّا» و«لم» عند التِّبْرِيزِيّ «أن لما نفي قد فعل ولم نفُى فعل»، أي أن «لمّا» تنفي فعلًا يُنتظر وقوعه وتمتد إلى الحاضر [@tabrizi-ashr، ص242]."
morphology:
  - "«الْيَقِين» على «فَعِيل»، مصدر «يَقِنَ الأمرَ» إذا علمه وتحقّقه."
  - "«تَعْرِفُوا» مضارع «عَرَفَ» على «فَعَلَ يَفْعِلُ»."
rhetoric:
  thesis: "يلتفت من الملك إلى الخصوم الحاضرين، فيصرفهم بكلمة زجر، ويذكّرهم بما يعرفونه من بأس قومه."
  devices:
    - title: "التكرار في «إِلَيْكُمْ ... إِلَيْكُمْ»"
      text: "افتتح البيت بكلمة الزجر وختم بها صدره، و«كرر إِلَيْكُم تَأْكِيدًا للأولى» [@khizana، ج9 ص10]. فالشطر الأول كله صيحة طرد."
    - title: "الاستفهام التقريري في «أَلَمَّا تَعْرِفُوا»"
      text: "الاستفهام التقريري سؤال يحمل المخاطب على الإقرار بما يعرفه. قال البَغْداديّ: الهمزة هنا «للاستفهام التقريري أَي: ألم تعرفوا منا إِلَى الْآن الْجد فِي الْحَرْب عرفاناً يَقِينا. أَي: قد علمْتُم ذَلِك» [@khizana، ج9 ص10]."
    - title: "الالتفات"
      text: "الالتفات تحويل الخطاب من مخاطَب إلى آخر أو من الغيبة إلى الخطاب. كان يحدّث عن بني بكر بضمير الغائب في الأبيات 62–64 («بنو أبينا»، «فصالوا»، «فآبوا»)، ثم واجههم بالنداء، فصار البيت كأنه موجّه إليهم في المجلس."
  connection: "ثم يكرر سؤاله ويبيّن ما يجب أن يعرفوه: كتائب الفريقين وهي تتطاعن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "إِلَيْكُمْ يَا / بَنِي بَكْرِنْ / إِلَيْكُمْ = مفاعلْتن / مفاعلْتن / فعولن — أَلَمْمَا تَعْ / رِفُو مِنْنَلْ / يَقِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلات الأربع في الحشو. وقصرت واو «تَعْرِفُوا» لالتقائها بالساكن بعدها."
context: "يبدأ به خطاب بني بكر (65–66) بعد أبيات يوم خَزَاز. ويرد في «خزانة الأدب» شاهدًا نحويًّا، الشاهد التاسع والسبعون بعد الستمائة، على دخول همزة الاستفهام على «لمّا» [@khizana، ج9 ص10]."
