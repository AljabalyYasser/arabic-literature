first: "نَصَبْنَا مِثْلَ رَهْوَةَ ذَاتَ حَدٍّ"
second: "مُحَافَظَةً وَكُنَّا السَّابِقِينَا"
meaning: "نصبنا كتيبة كأنها جبل رهوة، ذات سلاح وشوكة، محافظةً على أحسابنا، وكنا السابقين إلى القتال. قال ابن الأَنْبارِيّ: «معناه إذا عي أهل الحرب بالحرب واشتبهت عليهم أمورهم فلم يتوجهوا لها نصبنا مثل رهوة. و (رهوة) : جبل. أي أتينا بكتيبة مثل رهوة» [@ibn-al-anbari، ص398]. وقال الزَّوْزَنِيّ: «وتحرير المعنى: إذا فزع غيرنا من التقدم أقدمنا مع كتيبة ذات شوكة وغلبنا، وإنما نفعل هذا محافظة على أحسابنا» [@zawzani، ص225]."
vocabulary:
  - term: "رَهْوَةَ"
    text: "«جبل» [@ibn-al-anbari، ص398]. وفي «لسان العرب»: «قَالَ ابْنُ بَرِّيٍّ: رَهْوَةُ اسْمُ جَبَلٍ بِعَيْنِهِ» [@lisan، ج14 ص344]."
  - term: "ذَاتَ حَدٍّ"
    text: "كتيبة «ذات شوكة» [@ibn-al-anbari، ص399]، و«وَالْحَدُّ: السِّلَاحُ وَالشَّوْكَةُ» [@lisan، ج14 ص344]."
  - term: "مُحَافَظَةً"
    text: "حفاظًا على الأحساب، قال ابن الأَنْبارِيّ: «محافظة لأحسابنا» [@ibn-al-anbari، ص399]. والحسب: ما يعدّه الرجل من مفاخر آبائه."
  - term: "السَّابِقِينَا"
    text: "المتقدمين في الحرب، الغالبين."
syntax:
  - "قال ابن الأَنْبارِيّ: «ونصبنا جواب إذا، وإذا نصب بنصبنا، ومثل نصب بنصبنا، ورهوة خفض بإضافة مثل إليها، وانتصبت لأنها لا تجري، وذات حد نعت لمثل» [@ibn-al-anbari، ص399]. أي أن «مثلَ» مفعول به، والموصوف محذوف: كتيبة مثل رهوة."
  - "وفي «محافظة» وجهان: «ومحافظة نصب على المصدر» عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص399]، و«ومُحافظة: مَفْعُولٌ لَهُ» عند ابن بَرِّيّ [@lisan، ج14 ص344]، أي: نصبناها لأجل المحافظة."
  - "«وكنّا السابقينا» الواو عاطفة، و«نا» اسم «كان»، و«السابقين» خبرها."
morphology:
  - "«رَهْوَة» علم على جبل، ممنوع من الصرف للعلمية والتأنيث، ولذلك جُرّ بالفتحة."
  - "«مُحَافَظَة» مصدر «حَافَظَ» على «مُفَاعَلَة»."
  - "«السَّابِقِين» جمع «سابِق»، اسم فاعل من «سَبَقَ»."
rhetoric:
  thesis: "الجواب على تحيّر الناس: كتيبة ثابتة كالجبل. والدافع ليس الغنيمة بل الحسب: يقاتلون ليحفظوا شرف آبائهم."
  devices:
    - title: "حذف الموصوف في «مِثْلَ رَهْوَةَ»"
      text: "لم يذكر الكتيبة، فقال ابن بَرِّيّ إن «ذات حد» «مِنْ نَعْتِ الْمَحْذُوفِ، أَراد نَصَبْنا كَتيبَةً مِثلَ رَهْوَة ذاتَ حَدٍّ» [@lisan، ج14 ص344]. وفي هذا الحذف قوة، فالجبل يملأ الصورة. ويقول عبد القاهر الجُرْجانيّ في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "التشبيه في «مِثْلَ رَهْوَةَ»"
      text: "شبّه الكتيبة بجبل في ثباتها وضخامتها، فهي لا تتزحزح حين يتراجع غيرها."
    - title: "التذييل في «وَكُنَّا السَّابِقِينَا»"
      text: "جملة تختم البيت بالنتيجة: نحن السابقون. فهي تلخّص البيتين معًا."
  connection: "ثم يذكر رجال هذه الكتيبة: فتيان يرون القتل مجدًا، وشيوخ مجرّبون."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "نَصَبْنَا مِثْ / لَ رَهْوَةَ ذَا / تَ حَدْدِنْ = مفاعَلْتن / مفاعلَتن / فعولن — مُحَافَظَةَنْ / وَكُنْنَسْ سَا / بِقِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "جواب البيت السابق. وهو عند الزَّوْزَنِيّ البيت السادس والأربعون [@zawzani، ص225]."
variants:
  - reading: "مُحَافَظَةً وَكُنَّا الْمُسْنِفِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي في «تهذيب اللغة» كما في «لسان العرب»"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (كنا المسنفينا) ، معناه المتقدمين» [@ibn-al-anbari، ص399]. وفي «لسان العرب»: «وَفِي التَّهْذِيبِ: وَكُنَّا المُسْنِفينا» [@lisan، ج14 ص344]."
  - reading: "مُحَافَظَةً وَكُنَّا الْأَيْمَنِينَا"
    status: "رواية «الصحاح» كما في «لسان العرب»"
    note: "«وَفِي الصِّحَاحِ: وَكُنَّا الأَيْمَنينا» [@lisan، ج14 ص344]، أي أصحاب الميمنة، كما في البيت 62 من القصيدة."
