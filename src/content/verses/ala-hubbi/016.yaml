first: "وَلَا شَمْطَاءُ لَمْ يَتْرُكْ شَقَاهَا"
second: "لَهَا مِنْ تِسْعَةٍ إِلَّا جَنِينَا"
meaning: "ولا حزنت كحزني امرأة عجوز شاب شعرها، لم يترك لها شقاؤها من أبنائها التسعة إلا من غطّاه القبر. قال ابن الأَنْبارِيّ: «معناه ما وجدت كوجدي امرأة فقدت تسعة أولاد فما بقى من ولدها إلا جنين، أي أجنته الأرض» [@ibn-al-anbari، ص386]. وقال الزَّوْزَنِيّ: «يقول: ولا حزنت كحزني عجوز لم يترك شقاء جَدّها لها من تسعة بنين إلا مدفونًا في قبره، أي ماتوا كلهم ودفنوا» [@zawzani، ص220]."
vocabulary:
  - term: "شَمْطَاءُ"
    text: "التي خالط الشيبُ شعرها، في «لسان العرب»: «والشَمَطُ: بَيَاضُ شَعْرِ الرأْسِ يُخالِطُ سَواده» [@lisan، ج7 ص336]. وقال التِّبْرِيزِيّ: «الشمطاء: التي ليست بشابة، وهو أشد لحزنها» [@tabrizi-ashr، ص224]."
  - term: "شَقَاهَا"
    text: "شقاؤها وسوء حظها، و«(الشقاء) يمد ويقصر» [@ibn-al-anbari، ص386]."
  - term: "جَنِينَا"
    text: "المدفون، قال الزَّوْزَنِيّ: «الجنين: المستور في القبر هنا» [@zawzani، ص220]. وقال ابن الأَنْبارِيّ: «يقال: جن عليه الليل وأجنه الليل، أي ستره» [@ibn-al-anbari، ص386]."
syntax:
  - "قال ابن الأَنْبارِيّ: «والشمطاء منسوقة على أم سقب، وشقاها رفع بيترك، والجنين نصب بيترك أيضا» [@ibn-al-anbari، ص386]. أي أن «شمطاءُ» معطوفة على فاعل «وجدت» في البيت السابق، ولم تُنوَّن لأنها ممنوعة من الصرف."
  - "«لا» زائدة لتوكيد النفي بعد «ما» في البيت السابق."
  - "«إلا جنينا» استثناء مفرّغ: «جنينا» مفعول «يترك»، و«لها» و«من تسعة» متعلقان به."
morphology:
  - "«شَمْطَاء» على «فَعْلاء»، مؤنث «أَشْمَط»، ممنوعة من الصرف."
  - "«جَنِين» على «فَعِيل» بمعنى «مُفْعَل»، أي «مُجَنّ»، صُرف عن «مُفْعَل» إلى «فَعِيل» كما يقول ابن الأَنْبارِيّ، ومثّل له بقوله تعالى ﴿تلك آيات الكتاب الحكيم﴾، قال: «أراد المحكم» [@ibn-al-anbari، ص386]."
  - "«شَقًا» مقصور «شَقَاء»."
rhetoric:
  thesis: "بعد الناقة يأتي بالإنسان: أمّ عجوز فقدت أبناءها التسعة. فالصورة الثانية أشد من الأولى، وبها يبلغ النسيب ذروة الحزن."
  devices:
    - title: "التدرّج من الصورة إلى الأشد"
      text: "من ناقة فقدت فصيلًا واحدًا، إلى امرأة فقدت تسعة. فكل صورة تزيد على التي قبلها، وحزن الشاعر فوقهما. وهذه قراءتنا."
    - title: "الكناية في «إِلَّا جَنِينَا»"
      text: "لم يقل: ماتوا كلهم، بل قال: لم يبق لها إلا مستور في الأرض. والكلمة نفسها، «جنين»، تُقال للولد في بطن أمه، فكأن القبر صار رحمًا يضم الأبناء من جديد. وهذه قراءتنا."
    - title: "العدد في «مِنْ تِسْعَةٍ»"
      text: "العدد المحدد يجعل المصيبة محسوسة: ليس «أبناء كثيرين» بل تسعة، يُعدّون واحدًا واحدًا."
  connection: "ثم يختم النسيب بحكمة: اليوم وغدًا وبعد غد مرهونة بما لا تعلمين."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَلَا شَمْطَا / ءُ لَمْ يَتْرُكْ / شَقَاهَا = مفاعَلْتن / مفاعَلْتن / فعولن — لَهَا مِنْ تِسْ / عَةِنْ إِلْلَا / جَنِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "ثاني بيتي الحزن (15–16). وهو عند الزَّوْزَنِيّ البيت العشرون [@zawzani، ص220]."
