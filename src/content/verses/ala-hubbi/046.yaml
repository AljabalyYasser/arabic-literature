first: "تَهَدَّدْنَا وَأَوْعِدْنَا رُوَيْدًا"
second: "مَتَى كُنَّا لِأُمِّكَ مَقْتَوِينَا"
meaning: "هدّدنا وتوعّدنا كما تشاء، على مهل! متى كنا خدمًا لأمك حتى نخاف وعيدك؟ قال الزَّوْزَنِيّ: «يقول: تَرَفّق في تهددنا وإيعادنا ولا تمعن فيهما، فمتى كنا خدمًا لأمك؟ أي: لم نكن خدمًا لها حتى نعبأ بتهديدك ووعديك إيانا» [@zawzani، ص227]. وفي ذكر الأم إشارة إلى خبر مقتل الملك، حين أراد أن تخدم أمُّ الشاعر أمَّه [@ibn-qutayba، ج1 ص228–229]."
vocabulary:
  - term: "رُوَيْدًا"
    text: "على مهل، «ورويدا نصب على المصدر، وهو تصغير رود» [@ibn-al-anbari، ص403]."
  - term: "مَقْتَوِينَا"
    text: "«و (المقتوون) : الخدم، واحدهم مقتوي» [@ibn-al-anbari، ص403]. قال الزَّوْزَنِيّ: «القَتْو: خدمة الملوك» [@zawzani، ص227]. ويقول الفرّاء: «وهو مفعل من القتو - والقتو: الخدمة خدمة الملوك خاصة والتذلل لهم» [@ibn-al-anbari، ص404]."
syntax:
  - "قال ابن الأَنْبارِيّ: «وتهددنا جزم على الأمر، ورويدا نصب على المصدر» [@ibn-al-anbari، ص403]. أي أن «تهدّدْنا» و«أوعِدْنا» فعلا أمر."
  - "«متى» اسم استفهام إنكاري في موضع الظرف، متعلق بـ«كنّا»، و«نا» اسم «كان»، و«مقتوين» خبرها، و«لأمك» متعلق به."
morphology:
  - "في «مَقْتَوِين» أقوال. قال الفرّاء: «الرواة والنحويون ينشدون بيت عمرو (مَقتوينا) بفتح الميم كأنه نسب إلى مقتي» [@ibn-al-anbari، ص403]، ثم إن الشاعر «اضطر إلى تخفيف الياء فقال مقتوين يريد مقتويين» [@ibn-al-anbari، ص404]. أي أنه جمع «مَقْتَوِيّ» المنسوب، وخفّف ياء النسب."
  - "وعن أبي زيد أن الكلمة لا تتغير: «رجل مقتوين ورجلان مقتوين ورجال مقتوين. وكذلك المرأة والنساء وهو الذي يخدم القوم بطعام بطنه» [@khizana، ج8 ص80]."
  - "«رُوَيْد» تصغير «رُود» على «فُعَيْل»، و«تَهَدَّدَ» على «تَفَعَّلَ»، و«أَوْعَدَ» على «أَفْعَلَ»."
rhetoric:
  thesis: "أقسى أبيات التحدي: السخرية من الوعيد، ثم ذكر أم الملك. فالشاعر يرد الإهانة التي أرادها الملك لأمه بإهانة أشد: لم نكن يومًا خدمًا لأمك."
  devices:
    - title: "الأمر للتهكم في «تَهَدَّدْنَا وَأَوْعِدْنَا رُوَيْدًا»"
      text: "لا يأمره حقًّا بالتهديد، بل يسخر منه: هدّد ما شئت، فلن يغيّر ذلك شيئًا. وفسّره الزَّوْزَنِيّ: «تَرَفّق في تهددنا وإيعادنا ولا تمعن فيهما» [@zawzani، ص227]."
    - title: "الاستفهام الإنكاري في «مَتَى كُنَّا لِأُمِّكَ مَقْتَوِينَا»"
      text: "ينفي أن يكونوا خدمًا في أي زمن مضى، فـ«متى» تستغرق الماضي كله."
    - title: "التعريض بالأم"
      text: "ذكر أم الملك بعينها لا أهله أو قومه، فأصاب الموضع الذي أراد الملك أن يهين فيه أم الشاعر. وهذه قراءتنا على ضوء خبر ابن قُتَيْبة."
  connection: "ثم يختم التحدي بصورة القناة التي لا تلين."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "تَهَدْدَدْنَا / وَأَوْعِدْنَا / رُوَيْدَنْ = مفاعَلْتن / مفاعَلْتن / فعولن — مَتَا كُنْنَا / لِأُمْمِكَ مَقْ / تَوِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات التحدي، ويرويه ابن قُتَيْبة مع البيت السابق فيما قاله عَمْرو في مقتل عَمْرو بن هند [@ibn-qutayba، ج1 ص229]. وهو عند الزَّوْزَنِيّ البيت السادس والخمسون [@zawzani، ص227]."
variants:
  - reading: "تُهَدِّدُنَا وَتُوعِدُنَا رُوَيْدًا"
    status: "رواية يذكرها ابن الأَنْبارِيّ والزَّوْزَنِيّ والتِّبْرِيزِيّ و«لسان العرب»"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (تهددنا وتوعدنا رويدا) بالرفع على معنى الخبر» [@ibn-al-anbari، ص403]. وقال الزَّوْزَنِيّ: «ومن روى: تهددنا وتوعدنا، كان إخبارًا، ثم قال: رويدًا أي دع الوعيد والتهديد وأمهله» [@zawzani، ص227]. وبها يرويه «لسان العرب» [@lisan، ج15 ص169]."
