first: "وَنُوجَدُ نَحْنُ أَمْنَعَهُمْ ذِمَارًا"
second: "وَأَوْفَاهُمْ إِذَا عَقَدُوا يَمِينَا"
meaning: "ونُوجَد نحن أشدّ الناس حماية لما يجب أن يُحمى، وأوفاهم بالعهد إذا عاهدوا. قال ابن الأَنْبارِيّ: «معناه إذا عاهدوا أوفوا بعهدهم ولم ينقضوه» [@ibn-al-anbari، ص408]. وقال الزَّوْزَنِيّ: «تجدنا أيها المخاطب أمنعهم ذمة وجوارًا وحلفًا وأوفاهم باليمين عند عقدها» [@zawzani، ص229]."
vocabulary:
  - term: "ذِمَارًا"
    text: "«حريم الرجل وما يجب عليه أن يحميه» [@ibn-al-anbari، ص408]. وفي اللسان: «والذِّمارُ: ذِمارُ الرَّجُلِ وَهُوَ كُلُّ مَا يَلْزَمُكَ حِفْظُهُ وَحِيَاطَتُهُ وَحِمَايَتُهُ وَالدَّفْعُ عَنْهُ وإِن ضَيَّعه لَزِمَهُ اللَّوْمُ» [@lisan، ج4 ص312]. وعند الزَّوْزَنِيّ: «الذمار: العهد والحلف والذمة، سُمِّي به لأنه يتذمر له أي يتغضب لمراعاته» [@zawzani، ص229]."
  - term: "عَقَدُوا يَمِينَا"
    text: "عاهدوا وحلفوا. واستشهد ابن الأَنْبارِيّ بقول الحُطَيْئة «قومٌ إذا عَقَدوا عقْداً لجارِهم»، وقال: «فمعنى قوله عقدوا عقداً لجارهم: عاهدوه» [@ibn-al-anbari، ص409]."
syntax:
  - "«ونحن يرتفع لأنه توكيد لما في نوجد، وأمنعهم منصوب على خبر نوجد، وأوفاهم ينتصب بالنسق على أمنعهم، وذمارا ويمينا منصوبان على التفسير» [@ibn-al-anbari، ص409]. أي أن «نُوجَدُ» مضارع مبني للمجهول من «وَجَد» بمعنى علم، ونائب فاعله ضمير المتكلمين وهو المفعول الأول في الأصل، و«نَحْنُ» توكيد له، و«أَمْنَعَهُمْ» المفعول الثاني، وسمّاه «خبر نوجد». و«ذِمَارًا» و«يَمِينَا» تمييز، والتفسير اسم الكوفيين للتمييز."
  - "ويجيز التِّبْرِيزِيّ وجهًا آخر: «ويجوز أن يروى (ونوجد نحن أمنعهم) على أن يكون» [@tabrizi-ashr، ص239] «خبر نحن، والجملة في موضع نصب» [@tabrizi-ashr، ص240]، أي برفع «أمنعُهم» خبرًا لـ«نحن»."
  - "«إِذَا عَقَدُوا» ظرف شرطي، وجوابه محذوف يدل عليه ما قبله."
morphology:
  - "«أَمْنَع» و«أَوْفَى» اسما تفضيل. قال التِّبْرِيزِيّ: «ويقال: وفى وأوفى، وأوفى أفصح، إلا أن (أوفاهم) لا يجوز أن يكون من أوفى؛ لأن الفعل إذا جاوز ثلاثة أحرف لم يُقل فيه: هذا أفعل من هذا» [@tabrizi-ashr، ص240]، أي أنه مبني من الثلاثي «وَفَى»."
  - "«ذِمَار» على «فِعَال» من «ذَمَرَ» إذا غضب، كما مرّ في قول الزَّوْزَنِيّ."
  - "«نُوجَد» مضارع «وَجَدَ» مبنيًّا للمجهول، مثال واوي ثبتت واوه لانضمام ما قبلها."
rhetoric:
  thesis: "فضيلتان في بيت واحد: القوة في الحماية، والشرف في الوفاء. فالقوم لا يمنعون حريمهم فقط، بل يحفظون عهود غيرهم."
  devices:
    - title: "التوازي بين «أَمْنَعَهُمْ ذِمَارًا» و«أَوْفَاهُمْ ... يَمِينَا»"
      text: "التوازي أن يُبنى الشطران على نسق واحد. فهنا اسم تفضيل مضاف إلى ضمير الناس، ثم تمييز يبيّن جهة التفضيل، في كل شطر."
    - title: "التوكيد بالضمير في «نَحْنُ»"
      text: "لم يكتف بالضمير المستتر في «نُوجَدُ»، بل أبرزه: «لأنه توكيد لما في نوجد» [@ibn-al-anbari، ص409]، فقدّم ذواتهم إلى السامع قبل صفاتهم."
    - title: "بناء الفعل للمجهول في «نُوجَدُ»"
      text: "لم يقل: يجدنا الناس، بل «نُوجَد»، فالحكم ثابت لا يتوقف على شاهد بعينه: كل من بحث وجدهم كذلك."
  connection: "ثم يذكر يوم خَزَاز، وهو أول الأيام في فخره."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَنُوجَدُ نَحْ / نُ أَمْنَعَهُمْ / ذِمَارَنْ = مفاعلتن / مفاعلتن / فعولن — وَأَوْفَاهُمْ / إِذَا عَقَدُوا / يَمِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». الصدر على الأصل، ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من العَجُز."
context: "من أبيات المناقب (56–61) التي يتكرر فيها ضمير «نحن» في صدورها."
