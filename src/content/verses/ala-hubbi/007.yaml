first: "بِيَوْمِ كَرِيهَةٍ ضَرْبًا وَطَعْنًا"
second: "أَقَرَّ بِهِ مَوَالِيكِ الْعُيُونَا"
meaning: "نخبرك بيوم حرب مكروه كثر فيه الضرب بالسيوف والطعن بالرماح، فظفر فيه بنو عمك وقرّت عيونهم. قال الزَّوْزَنِيّ: «يقول: نخبرك بيوم حرب كثير فيه الضرب والطعن، فأقر بنو أعمامك عيونهم في ذلك اليوم، أي فازوا ببغيتهم وظفروا بمناهم من قهر الأعداء» [@zawzani، ص218]. وقال ابن الأَنْبارِيّ في معنى «أقر به مواليك العيونا»: «ظفروا فنامت عيونهم وزال سهرهم» [@ibn-al-anbari، ص376]."
vocabulary:
  - term: "كَرِيهَةٍ"
    text: "«اسم لشدة الناس في الحرب» [@ibn-al-anbari، ص376]. و«الكريهة: من أسماء الحرب، والجمع الكرائه، سميت لأن النفوس تكرهها» [@zawzani، ص217]."
  - term: "مَوَالِيكِ"
    text: "«بنو العم في هذا الموضع» [@ibn-al-anbari، ص376]."
  - term: "أَقَرَّ ... الْعُيُونَا"
    text: "اختلفوا في أصله. قال الأَصْمَعِيّ: «أقر الله عينك، معناه أبرد الله جل وعلا دمعتك. وزعم أن دمعة الفرح باردة ودمعة الحزن حارة»، وأنكر ذلك أبو العباس ثَعْلَب وقال: «الدمع كله حار في فرح كان أو حزن» [@ibn-al-anbari، ص376]. وقيل: «أَقَرَّ اللهُ عَيْنَكَ أَي صَادَفْتَ مَا يُرْضِيكَ فَتَقَرُّ عَيْنُكَ مِنَ النَّظَرِ إِلى غَيْرِهِ» [@lisan، ج5 ص86]. والمعنى في الأقوال كلها: الفرح ونيل المراد."
syntax:
  - "«بيوم» متعلق بـ«نخبّرك» في البيت السابق، وهو تفسير لليقين. و«كريهةٍ» مضاف إليه."
  - "قال ابن الأَنْبارِيّ: «وضربا وطعنا منصوبان على المصدر، ومواليك رفع بأقر، والعيون نصب بأقر أيضا» [@ibn-al-anbari، ص377]. وقال الزَّوْزَنِيّ: «ونصب ضربًا وطعنًا على المصدر أي يضرب فيه ضربًا ويطعن فيه طعنًا» [@zawzani، ص217]."
  - "جملة «أقرّ به مواليكِ العيونا» نعت لـ«يوم»، والضمير في «به» يعود عليه، والألف في «العيونا» للإطلاق."
morphology:
  - "«كَرِيهة» على «فَعِيلة» بمعنى مفعولة، قال ابن الأَنْبارِيّ: «وإنما ثبتت الهاء في كريهة وهي في تأويل مفعولة لأنها جعلت اسما بمنزلة النطيحة والذبيحة» [@ibn-al-anbari، ص376]. أي أن «فعيلة» بمعنى مفعولة لا تلحقها التاء في الصفة، ولحقتها هنا لأنها صارت اسمًا للحرب."
  - "«مَوَالِي» جمع «مَوْلًى» على «مَفَاعِل»."
  - "«أَقَرَّ» على «أَفْعَلَ» من المضعّف، وهو عند الأَصْمَعِيّ «مشتق من القر والقرة، وهما البرد» [@ibn-al-anbari، ص376]، وعند غيره من القرار والسكون."
rhetoric:
  thesis: "اليقين الذي يخبر به الظعينة يوم حرب. فالشاعر يخطب ودّها بأخبار القتال، والنسيب عنده متصل بالفخر من بيته الثاني."
  devices:
    - title: "الكناية في «أَقَرَّ بِهِ مَوَالِيكِ الْعُيُونَا»"
      text: "لم يقل: فرحوا وانتصروا، بل ذكر ما يتبع الفرح: قرار العين ونومها وبرد دمعها. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "التنكير في «بِيَوْمِ كَرِيهَةٍ»"
      text: "نكّر اليوم ولم يسمّه، فصار أعظم في النفس: يوم من أيام الشدة، لا يحتاج إلى اسم ليُعرف. وهذه قراءتنا."
    - title: "الإيجاز في «ضَرْبًا وَطَعْنًا»"
      text: "مصدران يختصران المعركة كلها: السيوف والرماح."
  connection: "ثم يعيد النداء «قفي» ويسألها: هل أحدثت وصلًا، أم خنت من لا يخونها؟"
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بِيَوْمِ كَرِي / هَةِنْ ضَرْبَنْ / وَطَعْنَنْ = مفاعلَتن / مفاعَلْتن / فعولن — أَقَرْرَ بِهِي / مَوَالِيكِلْ / عُيُونَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "ثاني أبيات الظعينة، وفيه يبدأ الفخر بأيام الحرب في وسط النسيب. ويقول التِّبْرِيزِيّ إن المعنى: «قفي بهذا اليوم الكريه الذي كان بيننا وبين أهلك فيه حرب لأنظر أغيرك ذلك أم لا» [@tabrizi-ashr، ص220]. وهو عند الزَّوْزَنِيّ البيت الحادي عشر، بعد «قفي نسألك» [@zawzani، ص217]."
