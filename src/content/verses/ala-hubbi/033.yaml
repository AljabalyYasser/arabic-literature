first: "تَخَالُ جَمَاجِمَ الْأَبْطَالِ فِيهَا"
second: "وُسُوقًا بِالْأَمَاعِزِ يَرْتَمِينَا"
meaning: "تحسب رؤوس الأبطال في المعركة أحمال إبل تسقط على أرض صلبة كثيرة الحجارة. قال الزَّوْزَنِيّ: «يقول: كأن جماجم الشجعان منهم أحمال إبل تسقط في الأماكن الكثيرة الحجارة، شبه رءوسهم في عظمها بأحمال الإبل» [@zawzani، ص223]."
vocabulary:
  - term: "تَخَالُ"
    text: "تظن وتحسب."
  - term: "جَمَاجِمَ"
    text: "الرؤوس، والجمجمة: عظم الرأس."
  - term: "الْأَبْطَالِ"
    text: "«(الأبطال) : الأشداء» [@ibn-al-anbari، ص396]، وقال الزَّوْزَنِيّ: «الأبطال: جمع بطل وهو الشجاع الذي يبطل دماء أقرانه» [@zawzani، ص223]."
  - term: "وُسُوقًا"
    text: "«جمع وسق؛ والوسق: الحمل» [@ibn-al-anbari، ص396]، وفي «لسان العرب»: «وَقِيلَ: هُوَ حِمْلُ بَعِيرٍ» [@lisan، ج10 ص378]."
  - term: "الْأَمَاعِزِ"
    text: "«جمع أمعز، والأمعز: مكان فيه حصى» [@ibn-al-anbari، ص396]، وفي «لسان العرب»: «والأَمْعَزُ والمَعْزاءُ: الأَرض الحَزْنَةُ الغليظةُ ذَاتُ الْحِجَارَةِ» [@lisan، ج5 ص411]."
  - term: "يَرْتَمِينَا"
    text: "«معناه يسقطن» [@ibn-al-anbari، ص396]. وفي «لسان العرب»: «أَرْمَيْت الحِمْل عَنْ ظَهْرِ البَعِير فارْتَمَى عَنْهُ إِذَا طَاحَ وسَقَط إِلَى الأَرض» [@lisan، ج14 ص337]."
syntax:
  - "قال ابن الأَنْبارِيّ: «والجماجم اسم تخال. وقوله (وسوقا) خبر تخال» [@ibn-al-anbari، ص396]. أي أن «تخال» من أفعال الظن، تنصب مفعولين: «جماجمَ» و«وسوقًا»."
  - "«فيها» متعلق بـ«تخال»، والضمير للحرب أو للسيوف. و«والباء صلة وسوق» [@ibn-al-anbari، ص397]، أي أن «بالأماعز» متعلق بـ«وسوقًا»."
  - "جملة «يرتمين» نعت لـ«وسوقًا»."
morphology:
  - "«جَمَاجِم» جمع «جُمْجُمَة» على «فَعَالِل»."
  - "«وُسُوق» جمع «وَسْق» على «فُعُول»، و«أَمَاعِز» جمع «أَمْعَز» على «أَفَاعِل»."
  - "«يَرْتَمِين» مضارع «ارْتَمَى» على «افْتَعَلَ»، قال الزَّوْزَنِيّ: «والارتماء لازم ومتعد، وهو في البيت لازم» [@zawzani، ص223]."
rhetoric:
  thesis: "الرؤوس المقطوعة تتساقط ثقيلة كأحمال تُلقى عن ظهور الإبل. فالصورة تجمع الثقل والكثرة والصوت."
  devices:
    - title: "التشبيه في «تَخَالُ جَمَاجِمَ الْأَبْطَالِ ... وُسُوقًا»"
      text: "شبّه الرؤوس الساقطة بالأحمال الساقطة، قال الزَّوْزَنِيّ: «شبه رءوسهم في عظمها بأحمال الإبل» [@zawzani، ص223]. والتشبيه هنا تشبيه هيئة متحركة، وهو عند عبد القاهر الجُرْجانيّ أدق التشبيه: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "الصوت في «بِالْأَمَاعِزِ»"
      text: "اختار الأرض الحجرية لا الرملية، فيُسمع ارتطام الأحمال بالحجارة. وهذه قراءتنا."
    - title: "الخطاب في «تَخَالُ»"
      text: "يخاطب السامع: أنت لو رأيت لظننت. فيجعله شاهدًا على المعركة."
  connection: "ثم يقول: نقطع رؤوسهم بلا رحمة، فلا يعرفون كيف يتقوننا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "تَخَالُ جَمَا / جِمَلْ أَبْطَا / لِ فِيهَا = مفاعلَتن / مفاعَلْتن / فعولن — وُسُوقَنْ بِلْ / أَمَاعِزِ يَرْ / تَمِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب. وهو عند الزَّوْزَنِيّ البيت السابع والثلاثون، قبل «نشق بها» [@zawzani، ص223]."
variants:
  - reading: "كَأَنَّ جَمَاجِمَ الْأَبْطَالِ فِيهَا / وُسُوقٌ بِالْأَمَاعِزِ يَرْتَمِينَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "بـ«كأنّ» مكان «تخال»، فارتفع «وسوقٌ» خبرًا لها [@zawzani، ص223]."
  - reading: "وَسُوقًا بِالْأَمَاعِزِ يَرْتَمِينَا"
    status: "رواية يذكرها التِّبْرِيزِيّ"
    note: "قال: «ويروى (وسوقا) جمع ساق» [@tabrizi-ashr، ص230]، فتكون الصورة رؤوسًا وسيقانًا تتساقط."
