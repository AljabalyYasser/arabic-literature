first: "بِأَنَّا الْعَاصِمُونَ بِكُلِّ كَحْلٍ"
second: "وَأَنَّا الْبَاذِلُونَ لِمُجْتَدِينَا"
meaning: "علمت القبائل أنّا نمنع الناس ونحميهم في كل سنة مجدبة، وأنّا نبذل العطاء لمن جاء يطلبه. قال ابن الأَنْبارِيّ: «(العاصمون) : المانعون»، ونقل عن الفَرّاء: «كحل: سنة شديدة» [@ibn-al-anbari، ص418]."
vocabulary:
  - term: "الْعَاصِمُونَ"
    text: "المانعون: «يقال عصم الله سبحانه وتعالى فلانا، أي منعه من التعرض لما لا يحل له» [@ibn-al-anbari، ص418]."
  - term: "كَحْلٍ"
    text: "السنة الشديدة القاحلة [@ibn-al-anbari، ص418]. وفي اللسان: «وكَحْلُ: السَّنَةُ الشَّدِيدَةُ، تُصْرَفُ وَلَا تُصْرَفُ»، واستشهد بقول سلامة بن جَنْدَل: «قومٌ، إِذا صَرَّحت كَحْلٌ، بُيوتُهُمُ ... مأْوَى الضَّرِيكِ» [@lisan، ج11 ص585]، والضريك الفقير."
  - term: "لِمُجْتَدِينَا"
    text: "الطالبين للعطاء: «(المجتدي) : الطالب، وهو الجادي أيضا» [@ibn-al-anbari، ص418]. وفي اللسان: «والجَادِي: السائلُ العافِي» [@lisan، ج14 ص134]."
syntax:
  - "الباء في «بِأَنَّا» متعلقة بـ«عَلِمَ» في البيت قبله، و«أنّ» واسمها وخبرها في تأويل مصدر مجرور، أي: علمت القبائل بكوننا العاصمين. و«الْعَاصِمُونَ» خبر «أنّ»."
  - "«أَنَّا» أصلها «أنّنا»، حُذفت إحدى النونات تخفيفًا. «وقال الفراء: أنَّا أجود من أنَّنا، وكلاهما جائز» [@ibn-al-anbari، ص418]."
  - "«بِكُلِّ كَحْلٍ»: الباء بمعنى «في»، والجار والمجرور متعلق بـ«العاصمون». واللام في «لِمُجْتَدِينَا» لام التقوية، تقوّي عمل اسم الفاعل في مفعوله."
  - "و«كَحْل» علم على السنة الشديدة، قال الفَرّاء: «هي أنثى تُجْرى ولا تُجْرى» [@tabrizi-ashr، ص244]، «والوجه ألا تُجرى» [@tabrizi-ashr، ص245]، أي أنها تُصرف وتُمنع، والأجود منعها. وجاءت في البيت مصروفة."
morphology:
  - "«مُجْتَدِين» جمع «مُجْتَدٍ» اسم فاعل من «اجْتَدَى» على «افْتَعَلَ» من «جَدَا»، ومن المادة: «ويقال للعطية الجدوى. ويقال قد أجدى، إذا أعطى، فهو مجد» [@ibn-al-anbari، ص418]."
  - "«الْعَاصِمُون» و«الْبَاذِلُون» جمعا مذكر سالمان لاسمي الفاعل من «عَصَمَ» و«بَذَلَ»."
rhetoric:
  thesis: "ما علمته القبائل: فضيلتان تظهران حين يشتد الجدب، المنع والعطاء."
  devices:
    - title: "المقابلة بين «الْعَاصِمُونَ» و«الْبَاذِلُونَ»"
      text: "المقابلة أن يُؤتى بمعنيين متقابلين في نسق واحد. فالأول منعٌ للأذى عن الناس، والثاني بذلٌ للخير لهم، وكلاهما في سنة القحط."
    - title: "التعميم في «بِكُلِّ كَحْلٍ»"
      text: "«كل» تجعل الحكم دائمًا: ليست سنة واحدة أحسنوا فيها، بل كل سنة شديدة مرّت بالناس."
    - title: "تكرار «أَنَّا»"
      text: "يبدأ به سلسلة من الجمل المؤكدة بـ«أنّ» تمتد إلى البيت 77، فيتوالى التوكيد كما تتوالى الشهادات."
  connection: "ثم يتابع: «وأنّا المانعون لما يلينا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بِأَنْنَلْ عَا / صِمُونَ بِكُلْ / لِ كَحْلِنْ = مفاعلْتن / مفاعلتن / فعولن — وَأَنْنَلْ بَا / ذِلُونَ لِمُجْ / تَدِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين."
context: "جواب «وَقَدْ عَلِمَ الْقَبَائِلُ» في البيت 73 [@ibn-al-anbari، ص417]، وأول ما علمته القبائل. ويذكر ابن الأَنْبارِيّ أن أبا جَعْفَر رواه بلفظ آخر، وأن «بعض الرواة» يصلون به البيت 61 بلفظ «وأنَّا التاركون لمَا سَخِطنا» [@ibn-al-anbari، ص419]، فالأبيات التي تبدأ بـ«نحن» و«أنّا» تتبادل مواضعها في الروايات."
variants:
  - reading: "بِأَنَّا الْعَاصِمُونَ إِذَا أُطِعْنَا ... وَأَنَّا الْعَازِمُونَ إِذَا عُصِينَا"
    status: "رواية أبي جَعْفَر"
    note: "«ورواه أبو جعفر» بهذا اللفظ [@ibn-al-anbari، ص418–419]، وهو قريب من البيت 60."
