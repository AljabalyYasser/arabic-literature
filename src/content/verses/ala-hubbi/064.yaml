first: "فَآبُوا بِالنِّهَابِ وَبِالسَّبَايَا"
second: "وَأُبْنَا بِالْمُلُوكِ مُصَفَّدِينَا"
meaning: "فرجعوا بالغنائم والأسرى، ورجعنا نحن بالملوك مقيّدين في الحديد. قال الزَّوْزَنِيّ: «فرجع بنو بكر بالغنائم والسبايا ورجعنا مع الملوك مقيدين، أي اغتنموا الأموال وأسرنا الملوك» [@zawzani، ص230]. ونقل ابن الأَنْبارِيّ عن أبي جَعْفَر: «معنى البيت ظفرنا بهم فلم نلتفت إلى أسلابهم ولا أموالهم، وعمدنا إلى ملوكهم فصفدناهم في الحديد. قال: وهذا أمدح وأشرف» [@ibn-al-anbari، ص412]."
vocabulary:
  - term: "آبُوا"
    text: "«معناه فرجعوا. والأواب: الرجاع» [@ibn-al-anbari، ص412]."
  - term: "النِّهَابِ"
    text: "«الغنائم وما ينتهب» [@ibn-al-anbari، ص412]. وفي اللسان: «النَّهْبُ: الغَنيمة»، «وَالْجَمْعُ نِهابٌ ونُهُوبٌ» [@lisan، ج1 ص773]."
  - term: "السَّبَايَا"
    text: "من يؤخذ في الحرب من النساء والصبيان."
  - term: "مُصَفَّدِينَا"
    text: "مغلولين: «والصفاد والصفد: الغل. وجمع الصفد أصفاد»، واستشهد بقوله تعالى: {مُقَرَّنِينَ فِي الْأَصْفَادِ}، «فمعناه في الأغلال» [@ibn-al-anbari، ص412]."
syntax:
  - "«ومصفدين نصب على الحال من الملوك» [@ibn-al-anbari، ص412]."
  - "الباء في «بِالنِّهَابِ» و«بِالسَّبَايَا» و«بِالْمُلُوكِ» للمصاحبة، والجار والمجرور متعلق بالفعل قبله."
  - "فاعل «آبُوا» عند الزَّوْزَنِيّ بنو بكر [@zawzani، ص230]، وقد يكون الأعداء الذين حملوا عليهم في البيت قبله."
morphology:
  - "«آبُوا» ماضي «آبَ يَؤُوبُ»، أجوف واوي، و«أُبْنَا» حُذفت عينه حين اتصل بضمير الرفع وضُمّت فاؤه."
  - "«مُصَفَّد» اسم مفعول من «صَفَّدَ» المضعّف، ويقال بالتخفيف أيضًا: «يقال: صَفَدْته وَصَفَّدْتُه أي قيدته وأوثقته» [@zawzani، ص230]."
  - "«سَبَايَا» جمع «سَبِيَّة»، و«نِهَاب» جمع «نَهْب» على «فِعَال»."
rhetoric:
  thesis: "هنا يفترق القومان بعد التسوية في البيت قبله: غيرهم طلب المال، وتَغْلِب طلبت الملوك."
  devices:
    - title: "المقابلة بين الشطرين"
      text: "قابل «آبُوا» بـ«أُبْنَا»، و«النهاب والسبايا» بـ«الملوك مصفدين». فالتوازي في اللفظ يكشف التفاوت في المعنى، والكفة ترجح لقومه."
    - title: "التفضيل الضمني"
      text: "لم يقل إنهم خير من إخوانهم، بل وضع الغنيمتين جنبًا إلى جنب وترك الحكم للسامع. وقرّبه أبو جَعْفَر من قول عَنْتَرة: «يُخبرْك مَن شهِد الوَقيعة أنَّني ... أغشَى الوغَى وأعفُّ عند المغنَمِ»، «أي لا أطلب المال، إنما أطلب الرجال» [@ibn-al-anbari، ص412]."
    - title: "جناس الاشتقاق في «آبُوا» و«أُبْنَا»"
      text: "فعل واحد في أول الشطرين بضميرين مختلفين، فيبدأ كل شطر بالرجوع، ويختلف ما رجع به كل فريق."
  connection: "ثم يلتفت إلى بني بكر مخاطبًا: «إليكم يا بني بكر إليكم»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "فَآبُو بِنْ / نِهَابِ وَبِسْ / سَبَايَا = مفاعلْتن / مفاعلتن / فعولن — وَأُبْنَا بِلْ / مُلُوكِ مُصَفْ / فَدِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين. وقصرت واو «آبُوا» لالتقائها بلام التعريف الساكنة: «فَآبُو بِنْ»."
context: "آخر أبيات يوم خَزَاز (58–64)، وبه ختم أبو عَمْرو بن العَلاء ما أنشده من خبر ذلك اليوم [@iqd، ج6 ص98]. وللبيت عند البَغْداديّ مناسبة أخرى: ينقل عن أبي القاسم السَّعْدِيّ أن المنذر بن ماء السماء «أرسل جَيْشًا من بكر وتغلب فِي طلب بني آكل المرار فجيء إِلَيْهِ مِنْهُم بِسِتَّة عشر رجلا فَضرب أَعْنَاقهم» [@khizana، ج8 ص545]، ثم يقول: «وَفِي ذَلِك أَيْضا يَقُول عَمْرو بن كُلْثُوم فِي معلقته»، وينشد البيت [@khizana، ج8 ص546]. وبنو آكل المُرار ملوك كِنْدة، أهل امرئ القيس، ويذكر البَغْداديّ في الخبر نفسه هرب امرئ القيس بعد قتلهم [@khizana، ج8 ص546]."
