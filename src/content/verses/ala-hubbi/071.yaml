first: "وَتَحْمِلُنَا غَدَاةَ الرَّوْعِ جُرْدٌ"
second: "عُرِفْنَ لَنَا نَقَائِذَ وَافْتُلِينَا"
meaning: "وتحملنا يوم الحرب خيل قصيرة الشعر كريمة، عُرفت بأنها لنا، استنقذناها من أعدائنا وفُطمت عندنا. قال الزَّوْزَنِيّ: «وتحملنا في الحرب خيل رقاق الشعور قصارها، عُرفن لنا وفُطمت عندنا وخلصناها من أيدي أعدائنا بعد استيلائهم عليها» [@zawzani، ص231]."
vocabulary:
  - term: "الرَّوْعِ"
    text: "«الرَّوع: الفزع ويريد به الحرب هنا» [@zawzani، ص231]."
  - term: "جُرْدٌ"
    text: "«(الأجرد) من الخيل: القصير الشعر الكريم» [@ibn-al-anbari، ص417]، وقال التِّبْرِيزِيّ: «وطول الشعر هُجنة» [@tabrizi-ashr، ص244]، أي علامة على أن الفرس غير كريم الأصل."
  - term: "نَقَائِذَ"
    text: "«ما استنقذت من قوم آخرين. وواحد النقائذ نقيذة» [@ibn-al-anbari، ص417]. وفي اللسان: «وَفَرَسٌ نَقَذٌ إِذا أُخِذَ مِنْ قَوْمٍ آخَرِينَ» [@lisan، ج3 ص516]."
  - term: "افْتُلِينَا"
    text: "«فطمن عن أمهاتهن. ويقال: افتليت المهر عن أمه، إذا قطعته. ويقال: افتلين: نتجن عندنا» [@ibn-al-anbari، ص417]."
syntax:
  - "«تَحْمِلُنَا» مضارع، و«نا» مفعول به مقدّم، و«جُرْدٌ» فاعل مؤخر، و«غَدَاةَ» ظرف زمان، و«الرَّوْعِ» مضاف إليه."
  - "جملة «عُرِفْنَ لَنَا» نعت لـ«جرد». «ومن رواه: (عرفن لنا) نصب نقائذ على الحال مما في عرفن. ومن رواه: (جرد مسومة) رفع نقائذ على النعت لجرد» [@ibn-al-anbari، ص417]. و«نَقَائِذَ» ممنوع من الصرف لأنه على صيغة منتهى الجموع."
  - "«وَافْتُلِينَا» معطوف على «عُرِفْنَ»، والألف للإطلاق."
morphology:
  - "«نَقِيذَة» على «فَعِيلَة» بمعنى «مُفْعَلَة»: «يقال: أنقذتها، أي: خلصتها، فهي منقذة ونقيذة» [@zawzani، ص231]."
  - "«افْتُلِين» ماضٍ مبني للمجهول على «افْتُعِلْنَ» من «فَلَا» إذا فطم، «الفلو والافتلاء: الفطام» [@zawzani، ص231]، ومنه «الفِلْو» للمهر."
  - "«جُرْد» جمع «أَجْرَد» و«جَرْداء» على «فُعْل»: «والواحد أجرد والواحدة جرداء» [@zawzani، ص231]."
rhetoric:
  thesis: "يصف الخيل بأصلين يفخر بهما معًا: ما أخذوه من أعدائهم عنوة، وما وُلد عندهم وفُطم في بيوتهم."
  devices:
    - title: "حذف الموصوف في «جُرْدٌ»"
      text: "لم يذكر الخيل، بل ذكر صفتها، فقامت الصفة مقامها. والحذف عند عبد القاهر الجُرْجانيّ باب «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "الإيجاز في «نَقَائِذَ»"
      text: "كلمة واحدة تحكي قصة كاملة: غارة أُخذت فيها الخيل، ثم غارة استُردّت فيها."
    - title: "المقابلة بين «نَقَائِذَ» و«افْتُلِينَا»"
      text: "خيل جاءت من خارج البيت بالقوة، وخيل نشأت فيه منذ الفطام. وهذه قراءتنا."
  connection: "ثم يذكر أن هذه الخيل ميراث الآباء للأبناء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَتَحْمِلُنَا / غَدَاتَرْ رَوْ / عِ جُرْدُنْ = مفاعلتن / مفاعلْتن / فعولن — عُرِفْنَ لَنَا / نَقَائِذَ وَفْ / تُلِينَا = مفاعلتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الثانية من الصدر. وسقطت همزة الوصل في «افْتُلِينَا» فاتصلت الفاء بالواو قبلها: «وَفْ»."
context: "أول أبيات الخيل (71–72). وبعده في رواية الزَّوْزَنِيّ والجَمْهَرة بيت ليس في رواية ابن الأَنْبارِيّ: «وَرَدْنَ دَوَارِعًا وَخَرَجْنَ شُعْثًا ... كَأَمْثَالِ الرَّصَائِعِ قَدْ بَلِينَا» [@zawzani، ص231]، [@jamhara، ص294]، والدوارع: الخيل عليها دروعها."
variants:
  - reading: "وَتَحْمِلُنَا غَدَاةَ الرَّوْعِ جُرْدٌ ... مُسَوَّمَةٌ نَقَائِذُ وَافْتُلِينَا"
    status: "رواية أخرى"
    note: "«ويروى: (جرد مسومة نقائذ) . فالمسومة: المعلمة بالسيما، وهي العلامة» [@ibn-al-anbari، ص417]."
