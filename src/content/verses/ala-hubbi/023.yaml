first: "وَقَدْ هَرَّتْ كِلَابُ الْحَيِّ مِنَّا"
second: "وَشَذَّبْنَا قَتَادَةَ مَنْ يَلِينَا"
meaning: "وقد كرهتنا كلاب الحي وهرّت في وجوهنا، وكسرنا شوكة من يجاورنا من الأعداء كما تُقطع أشواك القتاد. قال ابن الأَنْبارِيّ: «وقد هرت كلاب الحي منا، معناه كرهتنا كلاب الحي. وكلابهم: الذين يهرون من سوء أخلاقهم»، ثم قال: «وقوله (شذبنا قتادة من يلينا) ، هذا مثل، وأراد: وكسرنا حد من يلينا ممن يفاخرنا» [@ibn-al-anbari، ص390]. وللزَّوْزَنِيّ تفسير آخر للشطر الأول: «يقول: وقد لبسنا الأسلحة حتى أنكرتنا الكلاب وهرّت لإنكارها إيانا، وقد كسرنا شوكة من يقرب منا من أعدائنا» [@zawzani، ص222]."
vocabulary:
  - term: "هَرَّتْ"
    text: "كرهت، في «لسان العرب»: «هَرَّ الشيءَ يَهُرُّه ويَهِرُّه هَرّاً وهَريراً: كَرِهَهُ» [@lisan، ج5 ص260]. والهرير أيضًا صوت الكلب حين يكشّر."
  - term: "شَذَّبْنَا"
    text: "قطعنا، قال الزَّوْزَنِيّ: «التشذيب: نفي الشوك والأغصان الزائدة والليف عن الشجر» [@zawzani، ص222]، وقال ابن الأَنْبارِيّ: «وشذبنا: فرقنا» [@ibn-al-anbari، ص390]."
  - term: "قَتَادَةَ"
    text: "«والقتادة: شجرة لها شوك لا تمس إذا هاجت لشدة شوكها. من ذلك قولهم: (دون ما تروم خرط القتاد)» [@ibn-al-anbari، ص390]، أي أن ما تطلبه أصعب من نزع شوك القتاد باليد."
  - term: "مَنْ يَلِينَا"
    text: "من يقرب منا، قال الزَّوْزَنِيّ: «يلينا، أي: يقرب منا» [@zawzani، ص222]."
syntax:
  - "«قد» حرف تحقيق، و«هرّت كلابُ» فعل وفاعل، و«منّا» متعلق بـ«هرّت»: كرهت منا."
  - "قال ابن الأَنْبارِيّ: «ويلينا صلة من، وما فيه يعود على من، وشذبنا نسق على هرَّت» [@ibn-al-anbari، ص391]. أي أن «مَنْ» اسم موصول مضاف إليه، و«يلينا» صلته، وفاعله ضمير يعود على «من»."
morphology:
  - "«هَرَّ» على «فَعَلَ» من المضعّف، مضارعه بالضم والكسر كما في «اللسان»."
  - "«شَذَّبَ» على «فَعَّلَ» للتكثير، و«قَتَادَة» واحدة «القَتَاد»."
  - "«يَلِي» مضارع «وَلِيَ» المثال الواوي، حُذفت الواو في المضارع."
rhetoric:
  thesis: "أثر القوة في من حولها: الكلاب تكرههم، والجيران كُسرت شوكتهم. فالعداوة التي يثيرونها دليل على بأسهم."
  devices:
    - title: "الاستعارة في «كِلَابُ الْحَيِّ»"
      text: "على تفسير ابن الأَنْبارِيّ هي استعارة: الكلاب رجال يهرّون بالعداوة لسوء أخلاقهم. وعلى تفسير الزَّوْزَنِيّ هي كلاب حقيقية أنكرتهم في سلاحهم. والوجهان قائمان في البيت."
    - title: "التمثيل في «شَذَّبْنَا قَتَادَةَ مَنْ يَلِينَا»"
      text: "قال ابن الأَنْبارِيّ: «هذا مثل» [@ibn-al-anbari، ص390]. وقال الزَّوْزَنِيّ: «استعار لفَلِّ الغرب وكسر الشوكة تشذيب القتادة» [@zawzani، ص222]. أي جعل قوة الخصم شجرة شائكة، وكسرها تقطيع أشواكها. والشبه هنا يُدرك بالتأمل لا بالعين، وهو عند عبد القاهر الجُرْجانيّ ما يكون فيه «الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]."
    - title: "المثل المضمر"
      text: "القتاد عند العرب رمز الصعوبة، ومنه مثلهم «دون ما تروم خرط القتاد» [@ibn-al-anbari، ص390]. فمن قطع شوك القتاد صنع ما يعجز عنه الناس."
  connection: "ثم يأتي بصورة الرحى: متى نقلناها إلى قوم صاروا لها طحينًا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَقَدْ هَرْرَتْ / كِلَابُلْ حَيْ / يِ مِنْنَا = مفاعَلْتن / مفاعَلْتن / فعولن — وَشَذْذَبْنَا / قَتَادَةَ مَنْ / يَلِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات الخطاب للملك، يصف فيه هيبة تَغْلِب عند جيرانها. وهو عند الزَّوْزَنِيّ البيت التاسع والعشرون [@zawzani، ص222]."
variants:
  - reading: "وَقَدْ هَقَّتْ كِلَابُ الْحَيِّ مِنَّا"
    status: "رواية «لسان العرب»"
    note: "قال صاحب «اللسان»: «هَقَّ الرجلُ: هَرَبَ؛ قَالَ عَمْرُو بْنُ كُلْثُومٍ فَاسْتَعَارَهُ لِلْكِلَابِ» [@lisan، ج10 ص369]، أي هربت الكلاب منا."
  - reading: "وَقَدْ هَرَّتْ كِلَابُ الْجِنِّ مِنَّا"
    status: "رواية يذكرها التِّبْرِيزِيّ"
    note: "قال: «ويروى (وقد هرت كلاب الجن منا) والمعنى: إنا قد غلبنا كل أحد حتى» كرهتنا كلاب الحي وكلاب الجن، و«شبه من كان شديد البأس بالجن» [@tabrizi-ashr، ص226–227]."
