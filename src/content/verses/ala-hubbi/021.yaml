first: "وَسَيِّدِ مَعْشَرٍ قَدْ تَوَّجُوهُ"
second: "بِتَاجِ الْمُلْكِ يَحْمِي الْمُحْجَرِينَا"
meaning: "وكم من سيد قوم ألبسه قومه تاج الملك، يحمي من يلجأ إليه من المضطرين، قد قهرناه. قال الزَّوْزَنِيّ: «يقول: ورب سيد قوم متوج بتاج الملك حام للملجئين قهرناه» [@zawzani، ص221]. وجواب «رُبّ» في البيت التالي: تركنا الخيل واقفة عليه."
vocabulary:
  - term: "مَعْشَرٍ"
    text: "قوم وجماعة."
  - term: "تَوَّجُوهُ"
    text: "ألبسوه التاج، علامة الملك."
  - term: "يَحْمِي"
    text: "«معناه يمنع» [@ibn-al-anbari، ص389]."
  - term: "الْمُحْجَرِينَا"
    text: "«معناه الذين ألجئوا إلى الضيق» [@ibn-al-anbari، ص389]، وقال الزَّوْزَنِيّ: «أحجرته: ألجأته» [@zawzani، ص221]."
syntax:
  - "قال ابن الأَنْبارِيّ: «والسيد مخفوض بإضمار رب، وقد توجوه صلة سيد، ويحمى موضعه خفض في التأويل على النعت للسيد، أي حامي المحجرين» [@ibn-al-anbari، ص389]."
  - "وخبر «رُبّ» أو جوابها لا يأتي إلا في البيت التالي: «تركنا الخيل عاكفة عليه»، فالبيتان متعلقان."
morphology:
  - "«تَوَّجُوه» على «فَعَّلُوه» من «التاج»، والتضعيف لجعل الشيء ذا تاج."
  - "«المُحْجَرِين» جمع «مُحْجَر»، اسم مفعول من «أَحْجَرَ»: ألجأ إلى الجُحر أو المضيق."
  - "«مَعْشَر» على «مَفْعَل»."
rhetoric:
  thesis: "يعظّم الخصم ليعظم قاتله: لم يقتلوا رجلًا عاديًا، بل ملكًا متوّجًا يحمي الضعفاء."
  devices:
    - title: "تعظيم الخصم"
      text: "ثلاث صفات تصنع رجلًا عظيمًا: سيد معشر، ومتوّج بتاج الملك، وحامي اللاجئين. وكلما عظم المقتول عظم فخر القاتل. وهذه قراءتنا."
    - title: "واو «رُبّ»"
      text: "تفيد هنا التكثير: كم من سيد مثله. فالمثال الواحد يُفهم منه أمثال كثيرة."
    - title: "التضمين"
      text: "لا يتم المعنى إلا بالبيت التالي، ففيه ما فعلوه بهذا السيد. والتضمين عند ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
  connection: "ثم يقول ما صنعوا به: تركوه قتيلًا والخيل واقفة عليه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَسَيْيِدِ مَعْ / شَرِنْ قَدْ تَوْ / وَجُوهُو = مفاعلَتن / مفاعَلْتن / فعولن — بِتَاجِلْ مُلْ / كِ يَحْمِلْ مُحْ / جَرِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات الخطاب للملك، ومثال على «الأيام» التي عصت فيها تَغْلِب الملوك. والكلام يحتمل التعريض بالمخاطب نفسه، وهو ملك متوّج. وهو عند الزَّوْزَنِيّ البيت السادس والعشرون [@zawzani، ص221]."
variants:
  - reading: "وَسَيِّدِ مَعْشَرٍ قَدْ عَصَّبُوهُ / بِتَاجِ الْمُلْكِ يَحْمِي الْمُحْجَرِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ والتِّبْرِيزِيّ و«لسان العرب»"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (قد عصبوه بتاج الملك)» [@ibn-al-anbari، ص389]. وفي «لسان العرب»: «وَرَجُلٌ مُعَصَّبٌ ومُعَمَّم أَي مُسَوَّدٌ» [@lisan، ج1 ص606]، أي جُعل سيدًا."
