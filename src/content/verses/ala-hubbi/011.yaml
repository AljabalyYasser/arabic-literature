first: "وَثَدْيًا مِثْلَ حُقِّ الْعَاجِ رَخْصًا"
second: "حَصَانًا مِنْ أَكُفِّ اللَّامِسِينَا"
meaning: "وتريك ثديًا أبيض مستديرًا ناتئًا كحُقّ صغير من العاج، لينًا، لم تلمسه يد رجل قط. قال ابن الأَنْبارِيّ: «أراد: تريك ذراعي عيطل وتريك ثديا في بياضه ونتوه مثل حق العاج»، و«(من أكف اللامسين) ، يقول: لم تمسها أكف الناس» [@ibn-al-anbari، ص381]. وقال الزَّوْزَنِيّ: «يقول: وتريك ثديًا مثل حق من عاج بياضًا واستدارة، محرزة من أكف من يلمسها» [@zawzani، ص219]. فهي تكشف له صدرها في الخلوة، وثديها في وصفه ممتلئ مرتفع ناعم، ولم يمسّه رجل قبله."
vocabulary:
  - term: "حُقِّ"
    text: "وعاء صغير منحوت بغطاء، في «لسان العرب»: «والحُقُّ والحُقَّةُ، بِالضَّمِّ: مَعْرُوفَةٌ، هَذَا المَنْحوت مِنَ الْخَشَبِ وَالْعَاجِ وَغَيْرِ ذَلِكَ مِمَّا يَصْلُحُ أَن يُنحت مِنْهُ» [@lisan، ج10 ص56]."
  - term: "الْعَاجِ"
    text: "عظم ناب الفيل، وهو أبيض صقيل."
  - term: "رَخْصًا"
    text: "«رخصًا: لينا» [@zawzani، ص219]."
  - term: "حَصَانًا"
    text: "«عفيفة في قول أبي عمرو. وقال غيره: الحصان: التي قد تحصنت من الريب بزوج» [@ibn-al-anbari، ص381]."
  - term: "اللَّامِسِينَا"
    text: "الذين يلمسون، وقال التِّبْرِيزِيّ: «واللامسون: أهل الريبة» [@tabrizi-ashr، ص222]، أي من يريد الحرام."
syntax:
  - "قال ابن الأَنْبارِيّ: «والثدي نسق على ذراعي عيطل، ومثل ورخصا وحصانا من نعت الثدي، ومن صلة حصان. ويجوز أن ينتصب حصانا على الحال من الضمير الذي في تريك» [@ibn-al-anbari، ص382]."
  - "فعلى الوجه الأول تكون العفة صفة للثدي نفسه: محفوظ من الأيدي. وعلى الثاني تكون صفة للمرأة: تريك ثديها وهي عفيفة."
morphology:
  - "«ثَدْي» على «فَعْل»."
  - "«حَصَان» على «فَعَال»، قال ابن الأَنْبارِيّ: «ويقال امرأة حصان بينة الحصانة والحصُن والحصْن. وقد أحصنت وحصُنت» [@ibn-al-anbari، ص381]."
  - "«اللامِسِين» جمع «لامِس»، اسم فاعل من «لَمَسَ»."
rhetoric:
  thesis: "يصف الثدي بالبياض والاستدارة والليونة، ثم يجعله ممنوعًا على كل يد. فهي تكشف لصاحبها ما لا يراه غيره، وفي ذلك فخر العاشق بأنه المختار."
  devices:
    - title: "التشبيه في «مِثْلَ حُقِّ الْعَاجِ»"
      text: "شبّه الثدي بحُقّ العاج في لونه وشكله، قال ابن الأَنْبارِيّ: «في بياضه ونتوه» [@ibn-al-anbari، ص381]. وهو تشبيه حسي يدرك بالعين، من الضرب الذي يقول فيه عبد القاهر الجُرْجانيّ إنه يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "الجمع بين الكشف والعفة"
      text: "«تريك ... ثديًا» ثم «حصانًا من أكف اللامسينا»: تكشفه له، ولم تمسه يد. فالمشهد الحسي محاط بالعفة، والمرأة تعطي واحدًا ما تمنعه الناس جميعًا. وهذه قراءتنا."
    - title: "الإيجاز في «حَصَانًا مِنْ أَكُفِّ اللَّامِسِينَا»"
      text: "صفة واحدة بحرف جر جمعت المعنى: محفوظ من الأيدي، فلم يحتج إلى فعل."
  connection: "ثم يصف ظهرها وأردافها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَثَدْيَنْ مِثْ / لَ حُقْقِلْ عَا / جِ رَخْصَنْ = مفاعَلْتن / مفاعَلْتن / فعولن — حَصَانَنْ مِنْ / أَكُفْفِلْ لَا / مِسِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات وصف جسد الظعينة (9–12). وهو عند الزَّوْزَنِيّ البيت الخامس عشر [@zawzani، ص219]."
