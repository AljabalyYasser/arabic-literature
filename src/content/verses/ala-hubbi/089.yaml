first: "وَمَا مَنَعَ الظَّعَائِنَ مِثْلُ ضَرْبٍ"
second: "تَرَى مِنْهُ السَّوَاعِدَ كَالْقُلِينَا"
meaning: "لا شيء يحمي النساء من السبي مثل ضرب بالسيوف تطير منه سواعد الأعداء كما تطير عيدان الصبيان في لعبهم. قال الزَّوْزَنِيّ: «ما منع النساء من سبي الأعداء إياهن مثل ضرب تندر وتطير منه سواعد المضروبين كما تطير القلة إذا ضربت بالمقلى» [@zawzani، ص233]."
vocabulary:
  - term: "السَّوَاعِدَ"
    text: "الأذرع، جمع «ساعد»، وهو ما بين المرفق والكف."
  - term: "الْقُلِينَا"
    text: "«القلين: جمع قلة، وهي خشبة يلعب بها الصبيان يديرونها ثم يضربون بها» [@ibn-al-anbari، ص425]. وفي اللسان: «والقُلةُ والمِقْلَى والمِقْلاء، عَلَى مِفْعالٍ، كلهُ: عودانِ يَلعب بِهِمَا الصِّبْيَانُ، فالمِقْلَى الْعُودُ الْكَبِيرُ الَّذِي يُضْرَبُ بِهِ، والقُلَةُ الخَشبة الصَّغِيرَةُ» [@lisan، ج15 ص199]، فيضرب الصبي القُلة الصغيرة بالعود الكبير فتطير."
syntax:
  - "«وما» نافية، و«الظَّعَائِنَ» مفعول به مقدّم، «ومثل رفع بمنع» [@ibn-al-anbari، ص425]، أي فاعل مؤخر، و«ضَرْبٍ» مضاف إليه."
  - "«والكاف نصب بترى، والتقدير: ترى منها السواعد مثل القلين» [@ibn-al-anbari، ص425]: أي أن الكاف اسم بمعنى «مثل» في موضع المفعول الثاني لـ«ترى»، و«السَّوَاعِدَ» المفعول الأول، و«مِنْهُ» متعلق بـ«ترى»، والضمير للضرب."
  - "وجملة «تَرَى مِنْهُ ...» نعت لـ«ضرب»."
morphology:
  - "«قُلِين» جمع «قُلَة»، جُمعت بالياء والنون عوضًا عن لامها المحذوفة، «ويقال في جمع القُلة قُلات أيضا» [@ibn-al-anbari، ص425]. وأصلها في اللسان «قُلَوٌ، وَالْهَاءُ عِوَضٌ» [@lisan، ج15 ص199]."
  - "«السَّوَاعِد» جمع «سَاعِد» على «فَوَاعِل»، و«الظَّعَائِن» جمع «ظَعِينَة» على «فَعَائِل»."
rhetoric:
  thesis: "ختام أبيات النساء: العهد والوصف كلاهما يُختمان بالسيف، فلا يحمي الحرائر إلا الضرب."
  devices:
    - title: "القصر بالنفي في «وَمَا مَنَعَ الظَّعَائِنَ مِثْلُ ضَرْبٍ»"
      text: "نفى أن يكون للنساء مانع يساوي الضرب، فحصر الحماية فيه. والقصر تخصيص شيء بشيء بطريق مخصوص، وهنا بالنفي ونفي المِثل."
    - title: "تشبيه الهيئة المتحركة في «السَّوَاعِدَ كَالْقُلِينَا»"
      text: "شبّه السواعد المقطوعة وهي تطير بالقُلات تطير من ضرب الصبيان، فالشبه في الحركة. وهذا عند عبد القاهر الجُرْجانيّ مما «يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "التقريب بين البعيدين"
      text: "جمع بين أشد مشاهد الحرب ولعب الصبيان. قال ابن رَشِيق: «وإنما حسن التشبيه أن يقرب بين البعيدين» [@ibn-rashiq، ج1 ص289]. وفي هذا الجمع استخفاف بالعدو: سواعد الأبطال عندهم كعيدان اللعب."
  connection: "ثم يعود إلى الملك: «إذا ما الملك سام الناس خسفًا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَمَا مَنَعَظْ / ظَعَائِنَ مِثْ / لُ ضَرْبِنْ = مفاعلتن / مفاعلتن / فعولن — تَرَى مِنْهُسْ / سَوَاعِدَ كَلْ / قُلِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». الصدر على الأصل، ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من العَجُز."
context: "آخر أبيات النساء (82–89). واستشهد ابن الأَنْبارِيّ للقُلات بقول آخر: «كأنّ نَزْوَ فراخ الهام وسْطهمُ ... نَزْوُ القُلات زَهاها قالُ قالينا» [@ibn-al-anbari، ص425]، والهام هنا الرؤوس."
