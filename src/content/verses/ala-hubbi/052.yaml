first: "وَرِثْتُ مُهَلْهِلًا وَالْخَيْرَ مِنْهُمْ"
second: "زُهَيْرًا نِعْمَ ذُخْرُ الذَّاخِرِينَا"
meaning: "ورثت مجد جدّي مُهَلْهِل، وورثت خيرهم زُهَيْرًا، ونِعم الذخر هو لمن يدّخر. وعلى رواية «والخيرَ منه» يكون زُهَيْر خيرًا من مُهَلْهِل، قال الزَّوْزَنِيّ: «ورثت مجد مهلهل، ومجد الرجل الذي هو خير منه وهو زهير فنعم ذخر الذاخرين هو، أي مجده وشرفه للافتخار به» [@zawzani، ص228]."
vocabulary:
  - term: "مُهَلْهِلًا"
    text: "«رجل من بني تغلب، وكذلك زهير» [@ibn-al-anbari، ص406]. وهو عند البَغْداديّ «اسْم جد الشَّاعِر من قبل أمه. وَهُوَ أَخُو كُلَيْب بن وَائِل وَصَاحب حَرْب البسوس أَرْبَعِينَ سنة» [@khizana، ج8 ص262]."
  - term: "زُهَيْرًا"
    text: "«وزهير: جده من قبل أبيه» [@tabrizi-ashr، ص238]. وقال البَغْداديّ: «وَإِنَّمَا كَانَ زُهَيْر خيرا من مهلهل لِأَنَّهُ جده من قبل أَبِيه» [@khizana، ج8 ص262]."
  - term: "ذُخْرُ"
    text: "ما يُدّخر ويُحفظ لوقت الحاجة."
syntax:
  - "«والخير نسق على مهلهل، وزهير مترجم عن الخير، والذخر رفع بنعم» [@ibn-al-anbari، ص406]: أي أن «الْخَيْرَ» معطوف على «مُهَلْهِلًا»، و«زُهَيْرًا» بدل منه، والترجمة اسم الكوفيين للبدل، و«ذُخْرُ» فاعل «نِعْمَ»."
  - "المخصوص بالمدح محذوف: «والمعنى: نعم ذخر الذاخرين هو، فحذف هو لدلالة المعنى عليه» [@ibn-al-anbari، ص406]."
  - "وعلى رواية «والخيرَ منه» جعله البَغْداديّ شاهدًا: «على أَن اللَّام فِي الْخَيْر زَائِدَة وَمن فِي مِنْهُ تفضيلية» [@khizana، ج8 ص261]، أي أن المعنى «خيرًا منه»، لأن اسم التفضيل لا يجتمع فيه «أل» و«مِن» في الغالب. وجعل «زهيرًا» عطف بيان للخير [@khizana، ج8 ص262]."
morphology:
  - "«خَيْر» اسم تفضيل حُذفت همزته، وأصله «أَخْيَر»، ولا يكاد يُستعمل إلا محذوفها."
  - "«الذَّاخِرِين» جمع «ذَاخِر» اسم فاعل من «ذَخَرَ يَذْخَرُ»، و«ذُخْر» على «فُعْل» اسم لما يُدّخر."
  - "«مُهَلْهِل» على صيغة اسم الفاعل من الرباعي «هَلْهَلَ»."
rhetoric:
  thesis: "يجمع المجد من طرفيه: جدّ الأم مُهَلْهِل، وجدّ الأب زُهَيْر. فهو وارث الشرف من البيتين."
  devices:
    - title: "حذف المضاف في «وَرِثْتُ مُهَلْهِلًا»"
      text: "الإنسان لا يرث رجلًا، بل يرث مجده، كما قدّره البَغْداديّ: «يُرِيد: ورثت مجد مهلهل ومجد زُهَيْر» [@khizana، ج8 ص262]. والحذف عند عبد القاهر الجُرْجانيّ باب «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]: لما حذف «المجد» جعل الجدّ نفسه هو الميراث، فكأن مُهَلْهِلًا كله يجري فيه."
    - title: "الانتقال من «وَرِثْنَا» إلى «وَرِثْتُ»"
      text: "قال في البيت قبله «ورثنا»، وهنا «ورثتُ»، كما نبّه البَغْداديّ: «هُوَ بالتكلم» [@khizana، ج8 ص262]. فمُهَلْهِل جدّه هو من جهة أمه، لا جدّ القبيلة كلها، فخصّ نفسه بإرثه."
    - title: "المدح بـ«نِعْمَ»"
      text: "«نِعْمَ» فعل يُنشأ به المدح، فختم ذكر زُهَيْر بحكم لا يحتمل الخلاف."
  connection: "ثم يتم سلسلة الآباء: عَتّاب جدّه، وكُلْثُوم أبوه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَرِثْتُ مُهَلْ / هِلَنْ وَلْخَيْ / رَ مِنْهُمْ = مفاعلتن / مفاعلْتن / فعولن — زُهَيْرَنْ نِعْ / مَ ذُخْرُذْ ذَا / خِرِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الثانية من الصدر، والأولى والثانية من العَجُز. وفي نص ابن الأَنْبارِيّ على المكتبة الشاملة سقطت «نِعْمَ» من العَجُز، وهي ثابتة في شرحه «والذخر رفع بنعم» [@ibn-al-anbari، ص406]، ولا يستقيم الوزن بدونها."
context: "قلب تعداد الآباء (50–55). ويرد في «خزانة الأدب» شاهدًا نحويًّا، الشاهد الثامن عشر بعد الستمائة، بروايته «والخيرَ منه» [@khizana، ج8 ص261]."
