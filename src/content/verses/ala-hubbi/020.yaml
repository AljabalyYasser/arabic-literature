first: "وَأَيَّامٍ لَنَا غُرٍّ طِوَالٍ"
second: "عَصَيْنَا الْمَلْكَ فِيهَا أَنْ نَدِينَا"
meaning: "ونخبرك بأيام لنا مشهورة، طويلة على أعدائنا، عصينا فيها الملك كراهية أن نطيعه ونخضع له. قال الزَّوْزَنِيّ: «يقول: نخبرك بوقائع لنا مشاهير كالغر من الخيل عصينا الملك فيها كراهية أن نطيعه ونتذلل له» [@zawzani، ص221]. وقال أبو عُبَيْدة: «إنما سمى الأيام غر طوالا لعلوهم على الملك وامتناعهم منه، لعزهم، فأيامهم غر لهم، وطوال على أعدائهم» [@ibn-al-anbari، ص389]."
vocabulary:
  - term: "أَيَّامٍ"
    text: "الوقائع والحروب، قال الزَّوْزَنِيّ: «الأيام: الوقائع هنا» [@zawzani، ص221]. وجعلها أبو عُبَيْدة شاهدًا على أن العرب قد تسمي النعم أيامًا: «فقد يكون جعلها غرا طوالا لإنعامهم على الناس فيها» [@ibn-al-anbari، ص389]."
  - term: "غُرٍّ"
    text: "«وواحدة الغر أغر» [@ibn-al-anbari، ص388]، وقال الزَّوْزَنِيّ: «الغُرّ بمعنى المشاهير كالخيل الغرّ لاشتهارها فيما بين الخيل» [@zawzani، ص221]. والأغرّ من الخيل: الذي في جبهته بياض."
  - term: "الْمَلْكَ"
    text: "الملِك، بتسكين اللام، قال ابن الأَنْبارِيّ: «و (الملك) يقال ملك ومليك» [@ibn-al-anbari، ص389]."
  - term: "نَدِينَا"
    text: "نطيع، «يقال: دنت لفلان، أي دخلت في طاعته» [@ibn-al-anbari، ص389]. وفي «لسان العرب»: «والدِّين الطَّاعَةُ. وَقَدْ دِنْته ودِنْتُ لَهُ أَي أَطعته» [@lisan، ج13 ص169]."
syntax:
  - "قال ابن الأَنْبارِيّ: «معناه: ورب أيام لنا بيض مشهورة» [@ibn-al-anbari، ص388]، ثم قال: «والأيام مخفوضة بمعنى رب، ولنا صلة الأيام، وأن ندينا نصب بإسقاط الخافض» [@ibn-al-anbari، ص389]. أي أن الواو واو «رُبّ»."
  - "ويجعلها التِّبْرِيزِيّ معطوفة على «بأنّا»: «وقوله: (وأيام) معطوف على قوله: (بأنا) والمعنى بأيام» [@tabrizi-ashr، ص225]، أي: نخبرك بأيام."
  - "وفي «أن ندينا» قال الزَّوْزَنِيّ: «أي كراهية أن ندين، فحذف المضاف، هذا على قول البصريين، وقال الكوفيون: تقديره أن لا ندين، أي لئلا ندين، فحذف لا» [@zawzani، ص221]."
morphology:
  - "«غُرّ» جمع «أَغَرّ» على «فُعْل»، و«طِوَال» جمع «طويل» على «فِعَال»."
  - "«المَلْك» مخفف «المَلِك» بتسكين العين، ويذكر ابن الأَنْبارِيّ قراءة أبي عمرو «مَلْكِ يوم الدين» بالتسكين [@ibn-al-anbari، ص389]."
  - "«نَدِين» مضارع «دَانَ يَدِينُ»، أجوف يائي."
rhetoric:
  thesis: "بعد الصورة يأتي التاريخ: تَغْلِب قبيلة لها أيام عصت فيها الملوك. والكلام موجّه إلى ملك، فهو يذكّره بأن قومه لا يطيعون أحدًا."
  devices:
    - title: "الاستعارة في «غُرٍّ»"
      text: "جعل الأيام خيلًا بيضاء الجباه، تُعرف بين الأيام كما يُعرف الفرس الأغر بين الخيل. وهي استعارة على ما يحدّه عبد القاهر الجُرْجانيّ: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الكناية في «طِوَالٍ»"
      text: "الأيام لا تطول في نفسها، لكنها طويلة على الأعداء، يقاسون فيها الشدة. فالطول هنا كناية عن الهول، كما فسّره أبو عُبَيْدة."
    - title: "التعريض بالمخاطب في «عَصَيْنَا الْمَلْكَ»"
      text: "يقول هذا لملك جالس أمامه، فكأنه يقول له: قد عصينا ملوكًا قبلك. وهذه قراءتنا."
  connection: "ثم يذكر مثالًا: سيد قوم متوّجًا بالتاج، قتلوه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَأَيْيَامِنْ / لَنَا غُرْرِنْ / طِوَالِنْ = مفاعَلْتن / مفاعَلْتن / فعولن — عَصَيْنَلْ مَلْ / كَ فِيهَا أَنْ / نَدِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات الخطاب للملك. وهو عند الزَّوْزَنِيّ البيت الخامس والعشرون [@zawzani، ص221]."
variants:
  - reading: "وَأَيَّامٍ لَنَا وَلَهُمْ طِوَالٍ"
    status: "رواية يذكرها ابن الأَنْبارِيّ والتِّبْرِيزِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (وأيام لنا ولهم طوال)» [@ibn-al-anbari، ص389]. وقال التِّبْرِيزِيّ: «ومن روى (لنا ولهم) أراد القبائل، ولم يجر لها ذكر» [@tabrizi-ashr، ص225]."
  - reading: "وَأَيَّامًا لَنَا غُرًّا كِرَامًا"
    status: "رواية «لسان العرب»"
    note: "بالنصب، و«كراما» مكان «طوال» [@lisan، ج13 ص169]."
