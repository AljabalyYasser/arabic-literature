first: "عَلَيْنَا الْبَيْضُ وَالْيَلَبُ الْيَمَانِي"
second: "وَأَسْيَافٌ يُقَمْنَ وَيَنْحَنِينَا"
meaning: "علينا خوذ الحديد ودروع الجلد اليمانية، ومعنا سيوف تُرفع وتنحني من كثرة الضرب بها. قال الزَّوْزَنِيّ: «وكان علينا البيض واليلب اليماني وأسياف يقمن وينحنين لطول الضِّراب بها» [@zawzani، ص231]."
vocabulary:
  - term: "الْبَيْضُ"
    text: "خوذ الحديد على الرؤوس: «والبيض: جمع بيضة الحديد» [@tabrizi-ashr، ص242]."
  - term: "الْيَلَبُ"
    text: "اختلفوا فيه: «ترسة من جلود الإبل يعمل باليمن»، «وقال الأصمعي: اليلب: جلود يخرز بعضها إلى بعض تلبس على الرءوس خاصة، وليست على الأجساد. وقال أبو عبيدة: هي جلود تعمل منها دروع، وليست بترسة» [@ibn-al-anbari، ص414]. وعند الزَّوْزَنِيّ: «اليلب: نسيجة من سيور» تُلبس تحت البيض [@zawzani، ص230]. وفي اللسان أن بعض الأعراب سمع البيت «فَظَنَّ أَنّ اليَلَبَ أَجْوَدُ الْحَدِيدِ»، قال ابن السِّكِّيت: «وَهُوَ خطأٌ، إِنما قَالَهُ عَلَى التَّوَهُّمِ» [@lisan، ج1 ص806]."
  - term: "يُقَمْنَ"
    text: "يُرفعن ويُنصبن: «ومعنى يقمن ينتصبن» [@ibn-al-anbari، ص414]."
  - term: "يَنْحَنِينَا"
    text: "ينثنين. وفي الفعلين أقوال: «يريد ترفع وتوضع إذا ضرب بها»، «وقال بعضهم: هو أن يضرب بها حتى تنحني ثم تقوم فيضرب بها أيضا. قال أبو جعفر: المعنى تنصب عند الضرب بها، فإذا ضربوا بها انحنت» [@ibn-al-anbari، ص414]."
syntax:
  - "«عَلَيْنَا» جار ومجرور متعلق بمحذوف خبر مقدم، و«الْبَيْضُ» مبتدأ مؤخر، و«الْيَلَبُ» معطوف عليه، و«الْيَمَانِي» نعت له."
  - "«وَأَسْيَافٌ» معطوف على «الْبَيْضُ». «ويقمن صلة الأسياف» [@ibn-al-anbari، ص414]، أي أن جملة «يُقَمْنَ» نعت لها، و«يَنْحَنِينَا» معطوف عليه."
morphology:
  - "«يُقَمْنَ» مضارع «أَقَامَ» مبنيًّا للمجهول، اتصلت به نون النسوة فسكن آخره وحُذفت عينه. وفي الرواية الأخرى «يَقُمْنَ» من الثلاثي «قَامَ»."
  - "«يَنْحَنِين» مضارع «انْحَنَى» على «انْفَعَلَ» من «حَنَى»."
  - "«الْيَمَانِي» منسوب إلى اليمن، عُوّضت الألف عن إحدى ياءي النسب، فهو «يمانٍ» أو «يمانيّ»."
  - "«الْبَيْض» جمع «بَيْضَة» اسم جنس جمعي، و«أَسْيَاف» جمع «سَيْف» جمع قلة."
rhetoric:
  thesis: "يبدأ وصف السلاح: رؤوس محمية بالحديد والجلد، وسيوف أنهكها الضرب."
  devices:
    - title: "الكناية في «يُقَمْنَ وَيَنْحَنِينَا»"
      text: "انحناء السيوف أثر الضرب الكثير، فذكر الأثر وأراد شدة القتال، وهو ما فسّره الزَّوْزَنِيّ بـ«طول الضِّراب بها» [@zawzani، ص231]. والكناية عند عبد القاهر الجُرْجانيّ أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الطباق في «يُقَمْنَ» و«يَنْحَنِينَا»"
      text: "القيام والانحناء ضدان، والطباق الجمع بين الضدين، فيرسم حركة السيف صعودًا وهبوطًا مع كل ضربة."
    - title: "تقديم الخبر «عَلَيْنَا»"
      text: "قدّم «علينا» على المبتدأ، فالمقصود أن السلاح على أجسادهم هم، لا مخزون عندهم. ويعلّل عبد القاهر التقديم بأنهم «يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
  connection: "ثم يصف الدروع: «علينا كل سابغة دلاص»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "عَلَيْنَلْ بَيْ / ضُ وَلْيَلَبُلْ / يَمَانِي = مفاعلْتن / مفاعلتن / فعولن — وَأَسْيَافُنْ / يُقَمْنَ وَيَنْ / حَنِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين."
context: "أول أبيات السلاح والخيل (67–72). وفي الجَمْهَرة بيت قبله ليس في رواية ابن الأَنْبارِيّ: «نَقُودُ الخَيْلَ داميَةً كِلاها» [@jamhara، ص293]. ويستشهد به صاحب اللسان في مادة «يلب» [@lisan، ج1 ص806]."
variants:
  - reading: "وَأَسْيَافٌ يَقُمْنَ وَيَنْحَنِينَا"
    status: "رواية أخرى"
    note: "«ويروى: (يقمن وينحنينا) بفتح الياء وضم القاف» [@ibn-al-anbari، ص414]، وبها رواية اللسان [@lisan، ج1 ص806]."
