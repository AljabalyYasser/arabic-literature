first: "أَلَا سَائِلْ بَنِي الطَّمَّاحِ عَنَّا"
second: "وَدُعْمِيًّا فَكَيْفَ وَجَدْتُمُونَا"
meaning: "سَلْ بني الطمّاح ودُعْميًّا عنّا، وقل لهم: كيف وجدتمونا حين لقيتمونا؟ قال ابن الأَنْبارِيّ: «الطماح ودعمى: حيان من إياد. والمعنى: فقل لهم: كيف وجدتم ممارستنا؟ فأضمر القول لبيان معناه» [@ibn-al-anbari، ص419]. وقال الزَّوْزَنِيّ: «سل هؤلاء كيف وجدونا؟ شجعانًا أم جبناء؟» [@zawzani، ص235]."
vocabulary:
  - term: "سَائِلْ"
    text: "سَلْ واستخبر."
  - term: "بَنِي الطَّمَّاحِ وَدُعْمِيًّا"
    text: "«حيان من إياد» [@ibn-al-anbari، ص419]. ونقل التِّبْرِيزِيّ عن ابن السِّكِّيت أن بني الطمّاح من بني نُمارة، وقال: «ودعمى بن جديلة من إياد» [@tabrizi-ashr، ص246]."
  - term: "وَجَدْتُمُونَا"
    text: "لقيتمونا وعرفتم حالنا، والمراد في القتال، أي «ممارستنا» كما قال ابن الأَنْبارِيّ."
syntax:
  - "«أَلَا» حرف استفتاح، و«سَائِلْ» فعل أمر، و«بَنِي» مفعول به منصوب بالياء، و«الطَّمَّاحِ» مضاف إليه، و«عَنَّا» متعلق بـ«سائل»، و«دُعْمِيًّا» معطوف على «بني»."
  - "القول محذوف قبل «فَكَيْفَ»: «فأضمر القول لبيان معناه»، و«موضع كيف نصب بوجدتمونا» [@ibn-al-anbari، ص419–420]، أي أن «كيف» اسم استفهام في موضع المفعول الثاني لـ«وجد»."
  - "الواو في «وَجَدْتُمُونَا» واو تنشأ من إشباع ضمة الميم إذا اتصل بها ضمير، والأصل: وجدتم + نا."
morphology:
  - "«سَائِلْ» أمر من «سَاءَلَ» على «فَاعَلَ»."
  - "«الطَّمَّاح» على «فَعَّال»، من «طَمَحَ» إذا ارتفع."
  - "«وَجَدَ» مثال واوي، و«وَجَدْتُمُو» ماضيه المسند إلى جماعة المخاطبين."
rhetoric:
  thesis: "يستشهد بأعدائه بعد أن استشهد بالقبائل: من لقينا يعرفنا، فاسألوه."
  devices:
    - title: "الالتفات في «وَجَدْتُمُونَا»"
      text: "الالتفات تحويل الكلام من الغيبة إلى الخطاب أو العكس. بدأ بالحديث عن بني الطمّاح بضمير الغائب «سائل بني الطمّاح»، ثم خاطبهم مباشرة «وجدتمونا»، فكأنهم حضروا فجأة أمامه."
    - title: "حذف القول"
      text: "حذف «فقل لهم» قبل السؤال، «فأضمر القول لبيان معناه» [@ibn-al-anbari، ص419]. والحذف عند عبد القاهر الجُرْجانيّ باب «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]، فالحذف هنا يُسرع بالسؤال إلى وجوههم."
    - title: "الاستفهام التقريري في «فَكَيْفَ وَجَدْتُمُونَا»"
      text: "سؤال يعرف السائل جوابه، ويريد أن يُقرّ به المسؤول: لقد وجدتمونا أشداء."
  connection: "ثم يذكّرهم بما لقوه: «نزلتم منزل الأضياف منا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "أَلَا سَائِلْ / بَنِطْ طَمْمَا / حِ عَنْنَا = مفاعلْتن / مفاعلْتن / فعولن — وَدُعْمِيْيَنْ / فَكَيْفَ وَجَدْ / تُمُونَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر، والأولى من العَجُز. وقصرت ياء «بَنِي» لالتقائها بلام التعريف: «بَنِطْ»."
context: "يبدأ به خطاب إياد (78–81)، وهو عند الزَّوْزَنِيّ في آخر القصيدة قبيل خاتمتها [@zawzani، ص234–235]."
