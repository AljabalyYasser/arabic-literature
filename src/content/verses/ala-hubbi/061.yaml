first: "وَنَحْنُ التَّارِكُونَ لِمَا سَخِطْنَا"
second: "وَنَحْنُ الْآخِذُونَ لِمَا رَضِينَا"
meaning: "ما كرهناه تركناه، ولا يُكرهنا عليه أحد، وما رضيناه أخذناه، ولا يحول بيننا وبينه أحد. قال التِّبْرِيزِيّ، ونصّه موافق لشرح ابن الأَنْبارِيّ: «يقول: إذا كرهنا شيئا تركناه، ولم يستطع أحد إجبارنا عليه، وإذا رضينا أخذناه، ولم يحل بيننا وبينه أحد؛ لعزنا وارتفاع شأننا» [@tabrizi-ashr، ص241]، [@ibn-al-anbari، ص411]."
vocabulary:
  - term: "سَخِطْنَا"
    text: "كرهنا وغضبنا."
  - term: "الْآخِذُونَ"
    text: "الذين يأخذون ما يريدون. وفسّره الزَّوْزَنِيّ على روايته بالعطايا: «أي لا نقبل عطايا من سخطنا عليه ونقبل هدايا من رضينا عليه» [@zawzani، ص234]."
syntax:
  - "«نَحْنُ» مبتدأ و«التَّارِكُونَ» خبره، ومثله الشطر الثاني."
  - "«وما في معنى الذي، والهاء المضمرة تعود عليها، والتقدير للذي رضيناه» [@ibn-al-anbari، ص411]: أي أن «ما» اسم موصول، وصلته «سَخِطْنَا» و«رَضِينَا»، والعائد ضمير محذوف."
  - "اللام في «لِمَا» لام التقوية، تدخل على مفعول اسم الفاعل فتقوّي عمله، والمعنى: التاركون ما سخطنا، والآخذون ما رضينا."
morphology:
  - "«سَخِطَ يَسْخَطُ» على «فَعِلَ يَفْعَلُ»، والمصدر «السُّخْط»."
  - "«رَضِينَا» ماضي «رَضِيَ»، وأصله واوي من «الرِّضْوان»، قُلبت الواو ياء لانكسار ما قبلها."
  - "«الْآخِذُون» جمع «آخِذ» اسم فاعل من «أَخَذَ» المهموز الفاء، اجتمعت فيه همزتان فقُلبت الثانية ألفًا."
rhetoric:
  thesis: "إرادة لا يحدّها شيء: الترك والأخذ كلاهما بأمرهم وحدهم."
  devices:
    - title: "الطباق في «التَّارِكُونَ» و«الْآخِذُونَ»، و«سَخِطْنَا» و«رَضِينَا»"
      text: "المطابقة عند ابن رَشِيق: «جمعك بين الضدين في الكلام أو بيت الشعر» [@ibn-rashiq، ج2 ص5]. وفي البيت طباقان متقابلان: الترك مع السخط، والأخذ مع الرضا، فيجمع البيت أحوال الإرادة كلها."
    - title: "الإيجاز في «لِمَا»"
      text: "«ما» تعمّ كل شيء: مالًا كان أو صلحًا أو حربًا أو جوارًا، فلا يحدّ الشاعر ما يتركون ولا ما يأخذون."
    - title: "التكرار في «وَنَحْنُ»"
      text: "آخر أبيات «ونحن» المتوالية، وبعدها يعود إلى قصة يوم خَزَاز."
  connection: "ثم يعود إلى خَزَاز: «وكنا الأيمنين إذا التقينا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَنَحْنُتْ تَا / رِكُونَ لِمَا / سَخِطْنَا = مفاعلْتن / مفاعلتن / فعولن — وَنَحْنُلْ آ / خِذُونَ لِمَا / رَضِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين."
context: "من أبيات «ونحن» (57–61). ويذكر ابن الأَنْبارِيّ أن بعض الرواة يروونه بعد البيت 74 بلفظ «وأنَّا التاركون لمَا سَخِطنا»، ثم يقول: «وقد ذكرته أنا في غير هذا الموضع من القصيدة» [@ibn-al-anbari، ص419]، أي في هذا الموضع."
