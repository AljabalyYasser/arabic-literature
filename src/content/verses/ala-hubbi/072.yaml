first: "وَرِثْنَاهُنَّ عَنْ آبَاءِ صِدْقٍ"
second: "وَنُورِثُهَا إِذَا مِتْنَا بَنِينَا"
meaning: "ورثنا هذه الخيل عن آباء كرام صادقين، ونورثها أبناءنا إذا متنا. قال ابن الأَنْبارِيّ: «قوله (ورثناهن) معناه ورثنا الخيل عن الآباء» [@ibn-al-anbari، ص417]. وقال الزَّوْزَنِيّ: «ورثنا خيلنا من آباء كرام شأنهم الصدق في الفعال والمقال ونورثها أبناءنا إذا متنا، يريد أنها تناتجت وتناسلت عندهم قديْمًا» [@zawzani، ص232]."
vocabulary:
  - term: "آبَاءِ صِدْقٍ"
    text: "آباء كرام، صادقون في الفعل والقول كما فسّره الزَّوْزَنِيّ [@zawzani، ص232]."
  - term: "نُورِثُهَا"
    text: "نجعلها ميراثًا لهم."
syntax:
  - "«عَنْ آبَاءِ» متعلق بـ«وَرِثْنَا»، و«صِدْقٍ» مضاف إليه."
  - "رجع الضمير على الخيل مرة بـ«هُنَّ» ومرة بـ«هَا»: «ويجوز في الكلام ورثناها؛ لأنك تقول: الخيل اشتريتها واشتريتهن» [@ibn-al-anbari، ص417]."
  - "«نُورِثُ» يتعدى إلى مفعولين: «ها» الأول، و«بَنِينَا» الثاني منصوب بالياء لأنه ملحق بجمع المذكر السالم. و«إِذَا مِتْنَا» ظرف شرطي جوابه محذوف دلّ عليه ما قبله."
morphology:
  - "«نُورِث» مضارع «أَوْرَثَ» الرباعي، مثال واوي سكنت واوه وانضم ما قبلها."
  - "«مِتْنَا» ماضي «مَاتَ» الأجوف، بكسر الفاء على لغة من يقول «مِتّ يمات»، وفي رواية الزَّوْزَنِيّ «مُتْنَا» بالضم على لغة «مُتّ يموت»."
  - "«صِدْق» مصدر، وإضافة الموصوف إليه وصف به على المبالغة: آباء هم الصدق نفسه."
rhetoric:
  thesis: "الخيل سلسلة أجيال: تأتي من الآباء وتمضي إلى الأبناء، فهي جزء من المجد الموروث الذي بدأ به الشاعر في البيت 51."
  devices:
    - title: "المقابلة بين الشطرين"
      text: "الصدر ما أخذوه عمّن قبلهم، والعجز ما يعطونه لمن بعدهم: «ورثناهن ... عن آباء» مقابل «نورثها ... بنينا». فالقوم حلقة بين جيلين."
    - title: "الوصف بالمصدر في «آبَاءِ صِدْقٍ»"
      text: "لم يقل «آباء صادقين»، بل أضافهم إلى الصدق، والوصف بالمصدر أبلغ من الوصف باسم الفاعل، كأن الصدق صار ذاتهم."
  connection: "ثم يبدأ شهادة القبائل: «وقد علم القبائل من معدّ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَرِثْنَاهُنْ / نَ عَنْ آبَا / ءِ صِدْقِنْ = مفاعلْتن / مفاعلْتن / فعولن — وَنُورِثُهَا / إِذَا مِتْنَا / بَنِينَا = مفاعلتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر، والثانية من العَجُز."
context: "آخر أبيات الخيل (71–72)، وبه يُختم وصف العُدّة الذي بدأ في البيت 67."
