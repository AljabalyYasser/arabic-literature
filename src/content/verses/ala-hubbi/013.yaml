first: "تَذَكَّرْتُ الصِّبَا وَاشْتَقْتُ لَمَّا"
second: "رَأَيْتُ حُمُولَهَا أُصُلًا حُدِينَا"
meaning: "تذكّرت أيام الهوى والشباب، واشتقت إليها، حين رأيت إبلها المحمّلة يسوقها الحداة بالغناء في العشيّ، راحلة بها. قال الزَّوْزَنِيّ: «يقول: تذكرت العشق والهوى واشتقت إلى العشيقة لما رأيت حمول إبلها سيقت عشيًّا» [@zawzani، ص220]."
vocabulary:
  - term: "الصِّبَا"
    text: "الميل إلى اللهو والهوى، قال ابن الأَنْبارِيّ: «ويقال صبي بيَّن الصِّبا والصَّباء، وقد صبا إلى اللهو يصبو صبوا» [@ibn-al-anbari، ص383]."
  - term: "حُمُولَهَا"
    text: "«و (الحمول) الإبل التي تحمل» [@ibn-al-anbari، ص382]، أي إبلها وعليها الهوادج والمتاع."
  - term: "أُصُلًا"
    text: "«عشيا» [@ibn-al-anbari، ص382]، أي آخر النهار. «وفي الأصل قولان، يقال هو اسم واحد بمنزلة الحلم والعقب» [@ibn-al-anbari، ص382]، «ويقال: هو جمع أصيل» [@ibn-al-anbari، ص383]."
  - term: "حُدِينَا"
    text: "«معناه حدت الحداة الإبل» [@ibn-al-anbari، ص383]. والحُداء: غناء يسوق به الراعي الإبل فتسرع."
syntax:
  - "قال ابن الأَنْبارِيّ: «ولما نصب بتذكرت. وأصلا نصب على الوقت، والحمول نصب برأيت، وحدين معناه قد حدين، وتأويله الحال» [@ibn-al-anbari، ص383]. أي أن «لمّا» ظرف بمعنى «حين» متعلق بـ«تذكّرت»، و«أُصُلًا» ظرف زمان، وجملة «حُدين» حال من الحمول."
  - "«حُدِين» فعل ماضٍ مبني للمجهول، ونون النسوة نائب فاعل يعود على الحمول، والألف للإطلاق."
  - "«واشتقتُ» معطوف على «تذكّرت»."
morphology:
  - "«تَذَكَّرْتُ» على «تَفَعَّلْتُ»، و«اشْتَقْتُ» على «افْتَعَلْتُ» من «الشوق»، أجوف واوي."
  - "«حُمُول» جمع، قال الزَّوْزَنِيّ: «الحمول: جمع حامل، يريد إبلها» [@zawzani، ص220]."
  - "«حُدِينَ» على «فُعِلْنَ» من «حَدَا يَحْدُو»، ناقص واوي، قُلبت واوه ياء لانكسار ما قبلها."
rhetoric:
  thesis: "بعد صورة الجسد يأتي مشهد الرحيل: الإبل تمضي بالمحبوبة في المساء، وغناء الحداة يزيد الشوق. ويبدأ هنا الحزن الذي يبلغ ذروته في البيتين 15–16."
  devices:
    - title: "الصورة الحركية الصوتية في «رَأَيْتُ حُمُولَهَا أُصُلًا حُدِينَا»"
      text: "ثلاثة أشياء في عجز واحد: إبل تتحرك، ووقت يميل إلى الغروب، وغناء يسوقها. فالمشهد يُرى ويُسمع معًا. وهذه قراءتنا."
    - title: "الإيجاز في «حُدِينَا»"
      text: "لم يذكر الحداة، وبنى الفعل للمجهول، فبقي الانتباه على الإبل الراحلة. وقدّر ابن الأَنْبارِيّ معه «قد»: «وحدين معناه قد حدين» [@ibn-al-anbari، ص383]."
    - title: "ربط الذكرى بالرؤية في «لَمَّا رَأَيْتُ»"
      text: "الشوق لم يأت من فراغ، بل أثاره منظر الإبل. فالتذكر مسبَّب عن الرؤية، و«لمّا» تربط الحالين."
  connection: "ثم يرى اليمامة تلوح أمامه، فيعرف أين تمضي الظعينة."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "تَذَكْكَرْتُصْ / صِبَا وَاشْتَقْ / تُ لَمْمَا = مفاعَلْتن / مفاعَلْتن / فعولن — رَأَيْتُ حُمُو / لَهَا أُصُلَنْ / حُدِينَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، فصارت «مفاعَلْتن»."
context: "من أبيات الظعينة، وفيه الانتقال من الوصف إلى الرحيل والشوق. وهو عند الزَّوْزَنِيّ البيت الحادي والعشرون، بعد بيتي الحزن «فما وجدت» و«ولا شمطاء» [@zawzani، ص220]."
variants:
  - reading: "وَرَاجَعْتُ الصِّبَا وَاشْتَقْتُ لَمَّا"
    status: "رواية يذكرها التِّبْرِيزِيّ"
    note: "قال التِّبْرِيزِيّ: «ويروى (وراجعت الصبا) أي رجعت إلى ما كنت عليه من اللهو في شبيبتي» [@tabrizi-ashr، ص223]."
