first: "إِذَا لَمْ نَحْمِهِنَّ فَلَا بَقِينَا"
second: "لِشَيْءٍ بَعْدَهُنَّ وَلَا حَيِينَا"
meaning: "إن لم نحمهنّ فلا بقينا لشيء بعدهن، ولا عشنا. يدعو الشاعر على قومه بالفناء إن قصّروا في حماية نسائهم، فلا قيمة للحياة عندهم بعد سبيهن. ولم يشرحه ابن الأَنْبارِيّ ولا التِّبْرِيزِيّ، وليس في رواية الزَّوْزَنِيّ، فهذا المعنى قراءتنا."
vocabulary:
  - term: "نَحْمِهِنَّ"
    text: "نحمي النساء ونمنعهن من السبي."
  - term: "بَقِينَا"
    text: "دُمنا وثبتنا."
  - term: "حَيِينَا"
    text: "عشنا."
syntax:
  - "«إِذَا» ظرف شرطي، و«لَمْ نَحْمِ» مضارع مجزوم بـ«لم» وعلامة جزمه حذف الياء، و«هِنَّ» مفعول به."
  - "«فَلَا بَقِينَا»: الفاء رابطة لجواب الشرط، و«لا» دعائية دخلت على الماضي، والماضي بعدها يفيد الدعاء، كقولهم: لا فُضّ فوك. و«وَلَا حَيِينَا» معطوف عليه."
  - "«لِشَيْءٍ» متعلق بـ«بَقِينَا»، و«بَعْدَهُنَّ» ظرف زمان متعلق بمحذوف نعت لـ«شيء»."
morphology:
  - "«نَحْمِ» مضارع «حَمَى يَحْمِي» الناقص، حُذفت ياؤه للجزم."
  - "«حَيِينَا» ماضي «حَيِيَ» بفك الإدغام، ويقال أيضًا «حَيَّ» بالإدغام."
  - "«بَقِينَا» ماضي «بَقِيَ»، ناقص يائي ثبتت ياؤه."
rhetoric:
  thesis: "يمين الرجال جوابًا عن قول النساء في البيت قبله: الحياة كلها مرهونة بحمايتهن."
  devices:
    - title: "الدعاء على النفس في «فَلَا بَقِينَا ... وَلَا حَيِينَا»"
      text: "الدعاء على النفس من أشد صيغ الالتزام عند العرب: يجعل المتكلم فناءه جزاء تقصيره. فالبيت قسم في صورة دعاء."
    - title: "الإطناب في «وَلَا حَيِينَا»"
      text: "الإطناب زيادة اللفظ على المعنى لفائدة. فـ«حيينا» قريبة من «بقينا»، وتكرارها يؤكد اليمين ويُطيل وقعها في السمع."
  connection: "ثم يذكر ما يحمي به النساء: «وما منع الظعائن مثل ضرب»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "إِذَا لَمْ نَحْ / مِهِنْنَ فَلَا / بَقِينَا = مفاعلْتن / مفاعلتن / فعولن — لِشَيْئِنْ بَعْ / دَهُنْنَ وَلَا / حَيِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين."
context: "في صحته كلام قديم: نقل ابن الأَنْبارِيّ عن أبي جَعْفَر: «وقال أبو جعفر هذا البيت منحول. ورواه جماعة من الرواة غيره» [@ibn-al-anbari، ص424]. والمنحول بيت يُدخل في شعر شاعر وليس له. فأبو جَعْفَر يردّه، وغيره من الرواة يثبته. وهو في رواية التِّبْرِيزِيّ [@tabrizi-ashr، ص248] والجَمْهَرة [@jamhara، ص298]، وليس في رواية الزَّوْزَنِيّ [@zawzani، ص233]."
variants:
  - reading: "إِذَا لَمْ نَحْمِهِنَّ فَلَا تُرِكْنَا ... لِشَيْءٍ بَعْدَهُنَّ وَلَا بَقِينَا"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص424]، وذكرها التِّبْرِيزِيّ [@tabrizi-ashr، ص248]."
