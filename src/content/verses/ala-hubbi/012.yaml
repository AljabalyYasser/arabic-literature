first: "وَمَتْنَيْ لَدْنَةٍ طَالَتْ وَلَانَتْ"
second: "رَوَادِفُهَا تَنُوءُ بِمَا يَلِينَا"
meaning: "وتريك جانبي ظهر امرأة لينة طويلة القامة، أردافها ثقيلة، تنهض بها وبما يليها بتثاقل. قال ابن الأَنْبارِيّ: «(روادفها) : أعجازها. (تنوء) : تنهض. (بما يلينا) ، أي بما يليهن، يعنى بما يقرب من أعجازهن»، و«(طالت ولانت) ، معناه هي طويلة القامة لينتها» [@ibn-al-anbari، ص382]. وقال الزَّوْزَنِيّ: «يقول: وتريك متني قامة طويلة لينة تثقل أرادفها مع ما يقرب منها، وصفها بطول القامة وثقل الأرداف» [@zawzani، ص219]. أي أن عجيزتها ضخمة ممتلئة، إذا قامت ثقل عليها حملها، وهذا من صفات الجمال عندهم."
vocabulary:
  - term: "مَتْنَيْ"
    text: "«و (المتنان) : جانبا الفقار» [@ibn-al-anbari، ص382]، أي اللحم الممتد على جانبي العمود الفقري في الظهر."
  - term: "لَدْنَةٍ"
    text: "«اللينة» [@ibn-al-anbari، ص382]، وفي «لسان العرب»: «وامرأَة لَدْنة: رَيَّا الشّبابِ ناعمةٌ» [@lisan، ج13 ص383]."
  - term: "رَوَادِفُهَا"
    text: "«أعجازها» [@ibn-al-anbari، ص382]. وقال الزَّوْزَنِيّ: «الرادفتان والرانفتان: فرعا الأليتين، والجمع الروادف والروانف» [@zawzani، ص219]. أي ردفاها، وهما أعلى الأليتين."
  - term: "تَنُوءُ"
    text: "«تنهض» [@ibn-al-anbari، ص382]، و«النَّوء: النهوض في تثاقل» [@zawzani، ص219]."
  - term: "يَلِينَا"
    text: "يقرب منها، قال الزَّوْزَنِيّ: «الوَلْيُ: القرب» [@zawzani، ص219]."
syntax:
  - "«ومتنَيْ» معطوف على «ذراعي» في البيت العاشر، منصوب بالياء، وحُذفت نونه للإضافة. و«لدنةٍ» مضاف إليه، وهي صفة أقيمت مقام موصوفها، أي امرأة لدنة."
  - "قال ابن الأَنْبارِيّ: «والألف في يلينا صلة لفتحة النون، ومتنى لدنة نسق على ذراعي عيطل، والروادف مرتفعة بطالت، وفي تنوء ضمير مرفوع من اللدنة» [@ibn-al-anbari، ص382]. فـ«روادفها» عنده فاعل «طالت ولانت»، وفاعل «تنوء» ضمير المرأة: هي تنهض بأردافها."
  - "ويُفهم من شرح الزَّوْزَنِيّ وجه آخر: «طالت ولانت» صفة للمرأة، و«روادفها» مبتدأ خبره جملة «تنوء بما يلينا»."
morphology:
  - "«مَتْنَيْ» مثنى «مَتْن»، و«لَدْنَة» على «فَعْلَة»، مؤنث «لَدْن»."
  - "«رَوَادِف» جمع «رادِفة» على «فَوَاعِل»."
  - "«تَنُوء» مضارع «نَاءَ يَنُوءُ»، أجوف واوي مهموز اللام."
  - "«يَلِي» مضارع «وَلِيَ»، حُذفت واوه في المضارع."
rhetoric:
  thesis: "يختم صورة الجسد بالقامة والأرداف: طول ولين، وعجيزة ثقيلة. وهذا مثال الجمال الحسي في الغزل الجاهلي: الامتلاء لا النحول."
  devices:
    - title: "الكناية في «تَنُوءُ بِمَا يَلِينَا»"
      text: "لم يقل إن أردافها ضخمة، بل ذكر ما يلزم عن ذلك: أنها تنهض بها بثقل. وهذا هو الطريق الذي يصفه عبد القاهر الجُرْجانيّ في الكناية: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "الجمع بين صفتين في «طَالَتْ وَلَانَتْ»"
      text: "الطول واللين معًا: قامة ممتدة لا جفاء فيها. والفعلان على وزن واحد وقافية داخلية، فيتوازن الشطر."
    - title: "التدرّج في الوصف"
      text: "من الذراعين إلى الثدي إلى الظهر والأرداف: يمضي الوصف في الجسد من أعلاه إلى أسفله في ثلاثة أبيات. وهذه قراءتنا."
  connection: "ثم يترك الجسد إلى مشهد الرحيل: «تذكرت الصبا واشتقت لما رأيت حمولها»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَمَتْنَيْ لَدْ / نَةِنْ طَالَتْ / وَلَانَتْ = مفاعَلْتن / مفاعَلْتن / فعولن — رَوَادِفُهَا / تَنُوءُ بِمَا / يَلِينَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، فصارت «مفاعَلْتن»."
context: "آخر أبيات وصف الجسد (9–12) في رواية ابن الأَنْبارِيّ. وهو عند الزَّوْزَنِيّ البيت السادس عشر، وبعده عنده بيتان في الوركين والساقين ليسا في رواية ابن الأَنْبارِيّ [@zawzani، ص219]."
variants:
  - reading: "وَمَتْنَيْ لَدْنَةٍ سَمَقَتْ وَطَالَتْ / رَوَادِفُهَا تَنُوءُ بِمَا وَلِينَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "قال الزَّوْزَنِيّ: «السُّموق: الطول» [@zawzani، ص219]. و«بما ولينا» يذكرها ابن الأَنْبارِيّ أيضًا: «ويروى: (بما ولينا)» [@ibn-al-anbari، ص382]."
  - reading: "وَمَأْكَمَةً يَضِيقُ الْبَابُ عَنْهَا / وَكَشْحًا قَدْ جُنِنْتُ بِهِ جُنُونَا"
    status: "بيت يرويه الزَّوْزَنِيّ بعد هذا البيت، وليس في رواية ابن الأَنْبارِيّ"
    note: "قال الزَّوْزَنِيّ: «المأكَمة والمأكِمة: رأس الورك»، «يقول: وتريك وركًا يضيق الباب عنها لعظمها وضخمها وامتلائها باللحم، وكشحًا قد جننت بحسنه جنونا» [@zawzani، ص219]. أي أن وركيها عريضان حتى لا يتسع لهما الباب، وخصرها يذهب بعقله."
  - reading: "وَسَارِيَتَيْ بَلَنْطٍ أَوْ رُخَامٍ / يَرِنُّ خُشَاشُ حَلْيِهِمَا رَنِينَا"
    status: "بيت يرويه الزَّوْزَنِيّ بعد السابق"
    note: "قال الزَّوْزَنِيّ: «البلنط: العاج. السارية: الأسطوانة»، «يقول: وتريك ساقين كأسطوانتين من عاج أو رخام بياضًا وضخمًا يصوت حليهما، أي خلاخيلهما، تصويتًا» [@zawzani، ص219]. أي ساقان بيضاوان ممتلئتان، تصوت عليهما الخلاخيل."
