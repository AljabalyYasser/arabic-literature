first: "يَكُونُ ثِفَالُهَا شَرْقِيَّ نَجْدٍ"
second: "وَلُهْوَتُهَا قُضَاعَةَ أَجْمَعِينَا"
meaning: "تكون الجلدة التي تحت رحى حربنا شرقيَّ نجد، ويكون ما نلقيه في فمها من الحَبّ قبيلة قُضاعة كلها. قال الزَّوْزَنِيّ: «تكون معركتنا الجانب الشرقي في نجد، وتكون قبضتنا قضاعة أجمعين، فاستعار للمعركة اسم الثفال وللقتلى اسم اللهوة ليشاكل الرحى والطحين» [@zawzani، ص222]."
vocabulary:
  - term: "ثِفَالُهَا"
    text: "«الثِّفال: خرقة أو جلدة تبسط تحت الرحى ليقع عليها الدقيق» [@zawzani، ص222]. وفي اللسان: «الثِّفال، بِالْكَسْرِ، الجِلْد الَّذِي يُبْسط تَحْتَ رَحَى الْيَدِ لِيَقي الطَّحِين مِنَ التُّرَابِ» [@lisan، ج11 ص85]."
  - term: "لُهْوَتُهَا"
    text: "«اللُّهوة القبضة من الحب تلقى في فم الرحى» [@zawzani، ص222]. وفي اللسان: «واللُّهْوَةُ واللَّهْوَةُ: مَا أَلقَيْتَ فِي فَمِ الرَّحى مِنَ الحُبوب للطَّحْن»، واستشهد بهذا العجز [@lisan، ج15 ص261]."
  - term: "قُضَاعَةَ"
    text: "قبيلة من العرب جعلها حَبّ الرحى. قال ابن الأَنْبارِيّ في البيت 25: «أراد أن قضاعة تطحنهم الحرب كما تطحن الرحى ما يلقى فيها من الطعام» [@ibn-al-anbari، ص391]."
syntax:
  - "«ثِفَالُهَا» اسم «يكون»، و«شَرْقِيَّ» ظرف مكان منصوب في موضع الخبر، و«نَجْدٍ» مضاف إليه. والضمير في «ثفالها» و«لهوتها» للرحى، أي رحى الحرب التي صوّرها في البيت 24 وفي «طحونًا» في البيت قبله."
  - "«لُهْوَتُهَا» معطوف على «ثفالها»، و«قُضَاعَةَ» معطوف على الخبر، ممنوع من الصرف للعلمية والتأنيث. وقدّر ابن الأَنْبارِيّ في البيت 25 فعلًا آخر: «والثفال اسم يكون، وشرقي سلمى الخبر، واللهوة رفع بإضمار يكون، وقضاعة خبر الكون المضمر» [@ibn-al-anbari، ص392]. و«أَجْمَعِينَا» توكيد لقضاعة منصوب بالياء، وجُمع لأن القبيلة جماعة."
morphology:
  - "«ثِفَال» على «فِعَال» اسم لما يُبسط تحت الرحى، ومن مادته «الثُّفْل»: ما يرسب أسفل الشيء."
  - "«لُهْوَة» على «فُعْلَة»، من «أَلْهَى الرحى» إذا ألقى فيها: «وقد ألهيت الرحى ألقيت فيها لُهْوَة» [@zawzani، ص222]."
  - "«أَجْمَعِين» جمع «أَجْمَع»، من ألفاظ التوكيد المعنوي."
rhetoric:
  thesis: "يتم استعارة الرحى بأدواتها كلها: الأرض جلدتها، والقبيلة المحاربة حبّها الذي يُطحن."
  devices:
    - title: "ترشيح الاستعارة في «ثِفَالُهَا» و«لُهْوَتُهَا»"
      text: "الترشيح أن يُذكر مع الاستعارة ما يلائم المستعار منه. فبعد أن جعل الحرب رحى، ذكر ثفالها ولهوتها، فاكتملت الصورة. وقد نبّه على ذلك الزَّوْزَنِيّ: «فاستعار للمعركة اسم الثفال وللقتلى اسم اللهوة ليشاكل الرحى والطحين» [@zawzani، ص222]. والاستعارة عند عبد القاهر الجُرْجانيّ أن تجيء «إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "المبالغة في «قُضَاعَةَ أَجْمَعِينَا»"
      text: "قبيلة كاملة لا تزيد على قبضة حَبّ في فم رحاهم، فصغّر العدو وعظّم قومه في صورة واحدة."
  connection: "ثم ينتقل إلى النساء خلف الصفوف: «على آثارنا بيض حسان»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "يَكُونُ ثِفَا / لُهَا شَرْقِيْ / يَ نَجْدِنْ = مفاعلتن / مفاعلْتن / فعولن — وَلُهْوَتُهَا / قُضَاعَةَ أَجْ / مَعِينَا = مفاعلتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الثانية من الصدر، وجاء العَجُز على الأصل."
context: "قال ابن الأَنْبارِيّ قبله: «وروى بعض الرواة متصلا بهذا البيت» [@ibn-al-anbari، ص421]، ولم يشرحه. وهو البيت 25 نفسه في روايته، وفيه «شَرْقِيَّ سَلْمَى» [@ibn-al-anbari، ص391]، رواه بعضهم في هذا الموضع بلفظ «شرقيّ نجد». وفي رواية الزَّوْزَنِيّ والجَمْهَرة يأتي مرة واحدة بلفظ «شرقيّ نجد» بعد «متى ننقل إلى قوم رحانا» [@zawzani، ص222]، [@jamhara، ص296]، فهو هناك تمام صورة الرحى في موضعها الأول."
variants:
  - reading: "يَكُونُ ثِفَالُهَا شَرْقِيَّ سَلْمَى"
    status: "البيت 25 في رواية ابن الأَنْبارِيّ"
    note: "[@ibn-al-anbari، ص391]. وذكر ابن الأَنْبارِيّ هناك هذه الرواية: «ويروى: (يكون ثفالها شرقي نجد)» [@ibn-al-anbari، ص391]."
