first: "وَنَحْنُ الْحَابِسُونَ بِذِي أُرَاطَى"
second: "تَسَفُّ الْجِلَّةُ الْخُورُ الدَّرِينَا"
meaning: "ونحن الذين أقاموا بإبلهم في ذي أُراطى، حتى صارت كرام الإبل الغزيرة اللبن تأكل يابس النبت، فلم يبرحوا مكانهم. قال ابن الأَنْبارِيّ: «فيقول: حبسنا في هذا المكان إذ لم يكن للإبل ما ترعى إلا الدرين»، ونقل عن أبي جَعْفَر: «معناه أقمنا في الثغر وحبسنا ابلنا على الدرين. صبرا، حتى ظفرنا ولم يطمع فينا عدو» [@ibn-al-anbari، ص410]. وجعله الزَّوْزَنِيّ عونًا لقومهم: «لإعانة قومنا ومساعدتهم على قتال أعدائهم» [@zawzani، ص229]."
vocabulary:
  - term: "ذِي أُرَاطَى"
    text: "«أراطي: مكان» [@ibn-al-anbari، ص409]، «وقيل: ماء» [@tabrizi-ashr، ص240]."
  - term: "الْجِلَّةُ"
    text: "«ذوات العظام من الإبل» [@ibn-al-anbari، ص409]، و«قَالَ ابْنُ الأَعرابي: الجِلَّة المَسانُّ مِنَ الإِبل» [@lisan، ج11 ص117]، أي الكبار منها."
  - term: "الْخُورُ"
    text: "«الغزار الكثيرة الألبان» [@ibn-al-anbari، ص409]."
  - term: "تَسَفُّ"
    text: "«أي تأكل يابسًا، والمصدر السفوف» [@zawzani، ص229]."
  - term: "الدَّرِينَا"
    text: "«حشيش يابس» [@ibn-al-anbari، ص409]. وفي اللسان: «الْجَوْهَرِيُّ: الدَّرين حُطام المَرْعى إِذا قَدُم، وَهُوَ مَا بَلِيَ مِنَ الْحَشِيشِ، وقلَّما تَنْتَفِعُ بِهِ الإِبلُ» [@lisan، ج13 ص153]."
syntax:
  - "«نَحْنُ» مبتدأ، و«الْحَابِسُونَ» خبره، و«بِذِي» متعلق به. ومفعول «الحابسون» محذوف، أي الحابسون إبلَنا."
  - "«وأراطي: مخفوض بإضافة ذي إليه، وترك إجراؤها لما فيه من علامة التأنيث» [@ibn-al-anbari، ص410]: أي أنها مجرورة بالإضافة، ومُنعت من الصرف لألف التأنيث المقصورة، والإجراء اسم الكوفيين للصرف."
  - "جملة «تَسَفُّ الْجِلَّةُ» في موضع الحال، و«الْجِلَّةُ» فاعل، و«الْخُورُ» نعت له، و«الدَّرِينَا» مفعول به."
morphology:
  - "«تَسَفّ» مضارع «سَفِفَ» على «فَعِلَ يَفْعَلُ»: «وَقَالَ أَبو زَيْدٍ: سَفِفْتُ الماءَ أَسَفُّه سَفّاً» [@lisan، ج9 ص153]."
  - "«الْجِلَّة» على «فِعْلَة»، و«يَكُونُ وَاحِدًا وَجَمْعًا وَيَقَعُ عَلَى الذَّكَرِ والأُنثى» [@lisan، ج11 ص117]."
  - "«الْخُور» جمع «خَوْراء»، قال التِّبْرِيزِيّ: «وبنى واحدتها على خوراء، والمستعمل في كلام العرب خوارة» [@tabrizi-ashr، ص240]."
rhetoric:
  thesis: "الصبر موضع فخر: يقيمون حيث يجب أن يقيموا، ولو جاعت إبلهم."
  devices:
    - title: "الكناية في «تَسَفُّ الْجِلَّةُ الْخُورُ الدَّرِينَا»"
      text: "لم يقل: صبرنا على الجدب طويلًا، بل رسم كرام إبلهم تأكل أخسّ النبت، فدلّ على طول الإقامة وشدّة الحال معًا. وهذه هي الكناية عند عبد القاهر الجُرْجانيّ: أن يترك المتكلم اللفظ الموضوع للمعنى، «ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المقابلة بين «الْجِلَّةُ الْخُورُ» و«الدَّرِينَا»"
      text: "أكرم الإبل وأخسّ المرعى في شطر واحد، والتضاد بينهما يقيس مقدار ما احتملوا. وهذه قراءتنا."
    - title: "حذف المفعول في «الْحَابِسُونَ»"
      text: "لم يذكر ما حبسوا، فاحتمل الإبل والنفس معًا، كما جمعهما أبو جَعْفَر: «أقمنا في الثغر وحبسنا ابلنا» [@ibn-al-anbari، ص410]."
  connection: "ثم تتوالى أبيات «ونحن» في صفة سلطانهم: «ونحن الحاكمون إذا أطعنا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَنَحْنُلْ حَا / بِسُونَ بِذِي / أُرَاطَى = مفاعلْتن / مفاعلتن / فعولن — تَسَفْفُلْ جِلْ / لَتُلْ خُورُدْ / دَرِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الصدر، والأولى والثانية من العَجُز."
context: "من أبيات يوم خَزَاز وما حوله (58–64). ويستشهد به صاحب اللسان في مادة «درن» [@lisan، ج13 ص153]."
