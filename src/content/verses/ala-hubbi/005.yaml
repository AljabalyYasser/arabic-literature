first: "وَإِنَّا سَوْفَ تُدْرِكُنَا الْمَنَايَا"
second: "مُقَدَّرَةً لَنَا وَمُقَدَّرِينَا"
meaning: "سيدركنا الموت لا محالة، وقد كُتب علينا في وقت معلوم كما كُتبنا له، فلنشرب قبل أن يأتي. قال ابن الأَنْبارِيّ في «مقدّرة لنا ومقدّرينا»: «معناه قدرت علينا وقدرنا لها» [@ibn-al-anbari، ص375]. وقال الزَّوْزَنِيّ: «يقول: سوف تدركنا مقادير موتنا، وقد قدّرت تلك المقادير لنا وقدرنا لها» [@zawzani، ص216]. ويصل البَغْداديّ البيت بالمطلع، فيقول: «والمعنى: فاصبحينا من قبل حضور الأجل فإن الموت مقدّر لنا ونحن مقدّرون له» [@khizana، ج3 ص180]."
vocabulary:
  - term: "الْمَنَايَا"
    text: "«جمع منية، وهي الموت. ويقال: المنايا: الأقدار» [@ibn-al-anbari، ص374]، ويستشهد ابن الأَنْبارِيّ بقوله تعالى «مِنْ نُطْفَةٍ إِذَا تُمْنَى»، «معناه إذا تقدَّر» [@ibn-al-anbari، ص374]. فالمنية في أصلها: القدر المكتوب."
  - term: "تُدْرِكُنَا"
    text: "تلحق بنا وتبلغنا، كما يدرك الطالبُ المطلوب."
  - term: "مُقَدَّرَةً"
    text: "مكتوبة علينا في وقت لا يتقدم ولا يتأخر."
  - term: "مُقَدَّرِينَا"
    text: "مكتوبين لها، فنحن نمضي إليها كما تمضي إلينا."
syntax:
  - "«إِنَّا»: «إنّ» حرف توكيد، و«نا» اسمها، وجملة «سوف تدركنا المنايا» خبرها. و«سوف» حرف استقبال، يجعل المضارع للمستقبل."
  - "قال ابن الأَنْبارِيّ: «ونصب مقدرة على الحال من المنايا، ونصب مقدرين على الحال من النون والألف في تدركنا، ونسق مقدرين على مقدرة، وأضمر بعد مقدرين نحن، أي ومقدرين لها نحن» [@ibn-al-anbari، ص375]. أي أن الحالين تقابلتا: الأولى تصف الموت، والثانية تصفنا نحن، والواو بينهما عاطفة."
  - "«لنا» متعلق بـ«مقدّرةً». والألف في «مقدّرينا» ألف الإطلاق، تُشبع بها فتحة النون في القافية."
morphology:
  - "«المَنَايا» جمع «مَنِيّة» على «فَعَالَى»، و«المنيّة» على «فَعِيلة» بمعنى مفعولة، من «مَنَى يَمْنِي»: قدّر."
  - "«تُدْرِك» مضارع «أَدْرَكَ» الرباعي على «أَفْعَلَ»."
  - "«مُقَدَّرة» اسم مفعول من «قَدَّرَ» المضعّف العين، و«مُقَدَّرِين» جمع مذكر سالم منه، منصوب بالياء."
rhetoric:
  thesis: "بعد الدعوة إلى الشرب يذكر الموت، فيصير الشرب مبادرة للزمن: اسقينا الآن، فالأجل مكتوب. وبهذا البيت يختم المطلع الخمري، ويمهّد لما يأتي من فخر قوم لا يهابون الموت."
  devices:
    - title: "الاستعارة في الفعل «تُدْرِكُنَا»"
      text: "جعل الموت طالبًا يلحق بمطلوبه فيدركه، فاستعار له فعل اللحاق. ويقول عبد القاهر الجُرْجانيّ: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]، وهي هنا في الفعل."
    - title: "المقابلة بين «مُقَدَّرَةً لَنَا» و«مُقَدَّرِينَا»"
      text: "الموت مقدّر لنا، ونحن مقدّرون له: علاقة متبادلة، كأن كلًّا منهما ينتظر صاحبه في موعد مكتوب. وجاءت الكلمتان من جذر واحد، فاشتد التقابل. وهذه قراءتنا."
    - title: "التوكيد في «وَإِنَّا سَوْفَ»"
      text: "«إنّ» توكيد، و«سوف» استقبال، فالجملة تقرّر أمرًا لا شك فيه: الموت آتٍ. ومن هذا اليقين تخرج الدعوة إلى الشرب."
  connection: "ثم ينتقل فجأة من الخمر والموت إلى ظعينة راحلة: «قفي قبل التفرق يا ظعينا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَإِنْنَا سَوْ / فَ تُدْرِكُنَلْ / مَنَايَا = مفاعَلْتن / مفاعلَتن / فعولن — مُقَدْدَرَةَنْ / لَنَا وَمُقَدْ / دَرِينَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، فصارت «مفاعَلْتن»."
context: "آخر أبيات المطلع الخمري في رواية ابن الأَنْبارِيّ (1–5). وهو عند الزَّوْزَنِيّ البيت الثامن، فبينه وبين «ترى اللحز الشحيح» عنده ثلاثة أبيات ليست في رواية ابن الأَنْبارِيّ [@zawzani، ص216]. ويصل البَغْداديّ معناه بالمطلع: «معنى هذا البيت في اتصاله بما قبله أنه لما قال لها هبي بصحنك حثها على ذلك» [@khizana، ج3 ص180]."
variants:
  - reading: "صَبَنْتِ الْكَأْسَ عَنَّا أُمَّ عَمْرٍو / وَكَانَ الْكَأْسُ مَجْرَاهَا الْيَمِينَا"
    status: "بيت يرويه الزَّوْزَنِيّ قبل هذا البيت، وليس في رواية ابن الأَنْبارِيّ"
    note: "قال الزَّوْزَنِيّ: «الصبن: الصرف»، «يقول: صرفت الكأس عنا يا أم عمرو، وكان مجرى الكأس على اليمين فأجريتها على اليسار» [@zawzani، ص216]. ويرويه التِّبْرِيزِيّ «صَدَدْتِ الْكَأْسَ»، ويقول: «بعضهم يروي هذين البيتين لعمرو أخت جذيمة الأبرش» [@tabrizi-ashr، ص219]، أي لعَمْرو ابن أخت جَذِيمة. ويجعلهما ابن رَشِيق لعَمْرو ذي الطوق، ثم يقول: «فاستلحقهما عمرو بن كلثوم؛ فهما في قصيدته» [@ibn-rashiq، ج2 ص283]."
  - reading: "وَمَا شَرُّ الثَّلَاثَةِ أُمَّ عَمْرٍو / بِصَاحِبِكِ الَّذِي لَا تَصْبَحِينَا"
    status: "يرويه الزَّوْزَنِيّ والتِّبْرِيزِيّ بعد البيت السابق"
    note: "قال الزَّوْزَنِيّ: «يقول: ليس بصاحبك الذي لا تسقينه الصبوح شر هؤلاء الثلاثة الذين تسقينهم، أي لستُ شرَّ أصحابي، فكيف أخرتني وتركت سقيي الصبوح؟» [@zawzani، ص216]."
  - reading: "وَكَأْسٍ قَدْ شَرِبْتُ بِبَعْلَبَكٍّ / وَأُخْرَى فِي دِمَشْقَ وَقَاصِرِينَا"
    status: "يرويه الزَّوْزَنِيّ وحده قبل هذا البيت"
    note: "قال الزَّوْزَنِيّ: «يقول: ورب كأس شربتها بهذه البلدة، ورب كأس شربتها بتينك البلدتين» [@zawzani، ص216]. وبَعْلَبَكّ ودِمَشْق وقاصِرِين من بلاد الشام."
