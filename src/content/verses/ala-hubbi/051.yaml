  - reading: "أَبَاحَ لَنَا قُصُورَ الْمَجْدِ دِينَا"
    status: "رواية اللسان"
    note: "وفي اللسان: «وقَصْرُ المجْدِ: مَعْدِنهُ» [@lisan، ج5 ص104]."
