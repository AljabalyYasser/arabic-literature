first: "وَرِثْنَا مَجْدَ عَلْقَمَةَ بْنِ سَيْفٍ"
second: "أَبَاحَ لَنَا حُصُونَ الْمَجْدِ دِينَا"
meaning: "ورثنا شرف جدّنا عَلْقَمة بن سيف، الذي فتح لنا حصون المجد قهرًا. قال الزَّوْزَنِيّ: «ورثنا مجد هذا الرجل الشريف من أسلافنا، وقد جعل لنا حصون المجد مباحة قهرًا وعنوة، أي غلب أقرانه على المجد ثم أورثنا مجده ذلك» [@zawzani، ص228]."
vocabulary:
  - term: "مَجْدَ"
    text: "«الشرف والرفعة» [@ibn-al-anbari، ص405]."
  - term: "عَلْقَمَةَ بْنِ سَيْفٍ"
    text: "«رجل منهم» [@ibn-al-anbari، ص405]، أي من تَغْلِب. وقال التِّبْرِيزِيّ: «ويقال: أن علقمة هذا هو الذي أنزل بني تغلب الجزيرة» [@tabrizi-ashr، ص238]."
  - term: "أَبَاحَ"
    text: "جعلها مباحة لنا ندخلها متى شئنا. وفسّره ابن الأَنْبارِيّ على رواية «حصون الحرب»: «معناه إنه كان قاتل حتى غلب عليها ثم تركها مباحة لنا» [@ibn-al-anbari، ص405]."
  - term: "دِينَا"
    text: "فيه قولان: «معناه خاضعا ذليلا» عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص405]، و«الدين: القهر» عند الزَّوْزَنِيّ، واستشهد بقوله تعالى: {فَلَوْلَا إِنْ كُنْتُمْ غَيْرَ مَدِينِينَ}، «أي غير مقهورين» [@zawzani، ص228]. وفي اللسان: «يُقَالُ: دِنْتُهم فَدَانُوا أَي قهَرْتهم فأَطاعوا» [@lisan، ج13 ص167]."
syntax:
  - "«مَجْدَ» مفعول به، و«عَلْقَمَةَ» مضاف إليه مجرور بالفتحة لأنه ممنوع من الصرف للعلمية والتأنيث، و«بْنِ» نعت له، و«سَيْفٍ» مضاف إليه."
  - "«أَبَاحَ» ماضٍ فاعله ضمير عَلْقَمة، و«لَنَا» متعلق به، و«حُصُونَ» مفعول به، و«الْمَجْدِ» مضاف إليه. والجملة نعت لعَلْقَمة أو مستأنفة."
  - "«ودينا منصوب على الحال مما في أباح، وهو مجعول في موضع الحال» [@ibn-al-anbari، ص405]: أي أنه مصدر وُضع موضع الحال من الضمير في «أَبَاحَ». وعلى تفسير الزَّوْزَنِيّ يكون المعنى: أباحها قاهرًا."
morphology:
  - "«دِين» مصدر «دَانَ يَدِينُ» على «فِعْل»، والفعل أجوف يائي."
  - "«أَبَاحَ» رباعي أجوف على «أَفْعَلَ» من «باحَ يبوح»."
  - "«حُصُون» جمع «حِصْن» على «فُعُول»."
rhetoric:
  thesis: "أول الآباء الذين يعدّدهم جوابًا عن سؤاله. والمجد عنده ميراث يتسلّمه الأحفاد، كما يتسلّمون المال."
  devices:
    - title: "الاستعارة في «حُصُونَ الْمَجْدِ»"
      text: "جعل المجد مدينة محصّنة لا تُدخل إلا بالقتال، وجعل جدّه فاتحها. وهي الاستعارة كما يحدّها عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. فلم يقل: المجد كالحصن، بل أعطاه الحصون مباشرة."
    - title: "الاستعارة في «وَرِثْنَا مَجْدَ»"
      text: "الإرث للأموال، فجعل الشرف تركة تنتقل من الجدّ إلى الأحفاد. وسيعود الإرث في البيتين التاليين: «ورثت مهلهلًا»، «نلنا تراث الأكرمين»."
    - title: "التكرار في «مَجْدَ» و«الْمَجْدِ»"
      text: "تكررت الكلمة في الشطرين، فكأن البيت كله دائر على المجد: ما ورثوه، وما فُتح لهم."
  connection: "ثم يذكر جدّيه الأقربين: مُهَلْهِلًا وزُهَيْرًا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَرِثْنَا مَجْ / دَ عَلْقَمَتَبْ / نِ سَيْفِنْ = مفاعلْتن / مفاعلتن / فعولن — أَبَاحَ لَنَا / حُصُونَلْ مَجْ / دِ دِينَا = مفاعلتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الصدر، والثانية من العَجُز. وسقطت همزة «ابن» بين العلمين."
context: "أول جواب عن السؤال في البيت 50: يبدأ بأبعد الآباء ذكرًا، ثم يقترب في الأبيات التالية حتى يبلغ أباه كُلْثُومًا."
