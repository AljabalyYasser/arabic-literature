first: "بِسُمْرٍ مِنْ قَنَا الْخَطِّيِّ لُدْنٍ"
second: "ذَوَابِلَ أَوْ بِبِيضٍ يَعْتَلِينَا"
meaning: "نطاعنهم برماح سمر من قنا الخطّ، لينة فيها شيء من اليبس، أو نضربهم بسيوف بيض تعلو رؤوسهم. قال ابن الأَنْبارِيّ: «أراد: نطاعن بسمر من قنا الخطى» [@ibn-al-anbari، ص395]، وقال في الذوابل: «يقول: لم تجف كل الجفوف فتنشق إذا طُعن بها وتندق» [@ibn-al-anbari، ص395]. وقال الزَّوْزَنِيّ: «توصف الرماح بالسمرة؛ لأن سمرتها دالة على نضجها في منابتها» [@zawzani، ص223]."
vocabulary:
  - term: "سُمْرٍ"
    text: "رماح سمراء، قال التِّبْرِيزِيّ: «والسُّمر من الرماح أجودها» [@tabrizi-ashr، ص229]."
  - term: "الْخَطِّيِّ"
    text: "«منسوب إلى الخط، والخط مرفأ البحرين» [@ibn-al-anbari، ص395]، أي ميناء على ساحل البحرين كانت الرماح تُجلب إليه."
  - term: "لُدْنٍ"
    text: "«لينة» [@ibn-al-anbari، ص395]، وفي «لسان العرب»: «وَقَنَاةٌ لَدْنة: ليِّنة المهَزَّةِ» [@lisan، ج13 ص383]."
  - term: "ذَوَابِلَ"
    text: "«فيها بعض اليبس» [@ibn-al-anbari، ص395]."
  - term: "قَنَا"
    text: "الرماح، جمع قناة، يقول الزَّوْزَنِيّ في شرح البيت: «نطاعنهم برماح سمر لينة من رماح الرجل الخطيِّ» [@zawzani، ص223]."
  - term: "بِيضٍ"
    text: "سيوف بيض لامعة: «أو نضاربهم بسيوف بيض» [@zawzani، ص223]."
  - term: "يَعْتَلِينَا"
    text: "«ومعناه يعلون» [@ibn-al-anbari، ص396]، وقال التِّبْرِيزِيّ: «ويعتلين: أي يعلون رؤوسهم» [@tabrizi-ashr، ص229]."
syntax:
  - "قال ابن الأَنْبارِيّ: «والباء صلة نطاعن، ولدن وذوابل نعتان للقنا، والبيض نسق على السمر، ويعتلينا صلة البيض» [@ibn-al-anbari، ص396]. أي أن «بسُمرٍ» متعلق بـ«نطاعن» في البيت السابق."
  - "«ذوابلَ» مجرور بالفتحة لأنه ممنوع من الصرف، و«أو» للتقسيم: إما هذا وإما ذاك."
  - "جملة «يعتلين» نعت لـ«بيض»، ونون النسوة فاعل."
morphology:
  - "«سُمْر» جمع «أَسْمَر» و«سَمْراء» على «فُعْل»، و«لُدْن» جمع «لَدْن» على «فُعْل»."
  - "«ذَوَابِل» جمع «ذابِل» على «فَوَاعِل»."
  - "«يَعْتَلِين» مضارع «اعْتَلَى» على «افْتَعَلَ» من «علا»."
rhetoric:
  thesis: "بعد ذكر الطعن والضرب يصف أداتيهما وصف خبير: رمح لين لا ينكسر ولا يتشقق، وسيف يعلو الرؤوس. ومعرفة السلاح جزء من الفخر."
  devices:
    - title: "حذف الموصوف في «بِسُمْرٍ» و«بِبِيضٍ»"
      text: "لم يذكر الرماح ولا السيوف، بل ذكر لونيهما، فعرفهما السامع. والحذف عند عبد القاهر الجُرْجانيّ قد يكون أبلغ من الذكر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "الجمع بين «لُدْنٍ» و«ذَوَابِلَ»"
      text: "صفتان تبدوان متعارضتين: لين ويبس. والمراد التوازن: ليس رطبًا فينثني، ولا يابسًا فينكسر، كما شرح ابن الأَنْبارِيّ. وهذه دقة الخبير بالرماح."
    - title: "مراعاة اللون"
      text: "السُّمر والبِيض في بيت واحد: لونان يقابل أحدهما الآخر، ويصنعان صورة مرئية للسلاح. وهذه قراءتنا."
  connection: "ثم يصف عمل السيوف: تشق الرؤوس وتقطع الرقاب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بِسُمْرِنْ مِنْ / قَنَلْ خَطْطِيْ / يِ لُدْنِنْ = مفاعَلْتن / مفاعَلْتن / فعولن — ذَوَابِلَ أَوْ / بِبِيضِنْ يَعْ / تَلِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب، يفصّل فيه البيت السابق. وهو عند الزَّوْزَنِيّ البيت السادس والثلاثون [@zawzani، ص223]."
variants:
  - reading: "ذَوَابِلَ أَوْ بِبِيضٍ يَخْتَلِينَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "أي يقطعن، قال: «أو نضاربهم بسيوف بيض يقطعن ما ضرب بها» [@zawzani، ص223]."
