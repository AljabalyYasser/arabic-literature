first: "وَأَنَّا الْمُنْعِمُونَ إِذَا قَدَرْنَا"
second: "وَأَنَّا الْمُهْلِكُونَ إِذَا أُتِينَا"
meaning: "وأنّا نتفضّل على من أسرناه فنطلقه إذا قدرنا عليه، ونُهلك من جاءنا غازيًا. قال ابن الأَنْبارِيّ: «معناه: نُنعم على من أسرنا بالتخلية، ونُهلك من أتانا يُغير علينا» [@ibn-al-anbari، ص419]."
vocabulary:
  - term: "الْمُنْعِمُونَ"
    text: "المتفضّلون، وفسّر ابن الأَنْبارِيّ الإنعام هنا بإطلاق الأسير: «بالتخلية» [@ibn-al-anbari، ص419]."
  - term: "قَدَرْنَا"
    text: "ظفرنا وتمكّنّا من عدونا."
  - term: "أُتِينَا"
    text: "غُزينا، أي أتانا من «يُغير علينا» [@ibn-al-anbari، ص419]."
syntax:
  - "«أَنَّا» معطوفة على «أنّا» في البيتين قبله، و«الْمُنْعِمُونَ» خبرها."
  - "«إِذَا» ظرف شرطي، و«قَدَرْنَا» فعل الشرط في محل جر بالإضافة، والجواب محذوف دلّ عليه ما قبله. ومثله «إِذَا أُتِينَا»، و«أُتِينَا» ماضٍ مبني للمجهول، و«نا» نائب فاعل."
morphology:
  - "«الْمُنْعِم» اسم فاعل من «أَنْعَمَ» الرباعي، و«الْمُهْلِك» اسم فاعل من «أَهْلَكَ»."
  - "«أُتِينَا» ماضي «أَتَى» الناقص اليائي مبنيًّا للمجهول، ظهرت ياؤه لانكسار ما قبلها."
  - "«قَدَرْنَا» من «قَدَرَ على الشيء يَقْدِرُ» إذا تمكّن منه."
rhetoric:
  thesis: "العفو عند القدرة والبطش عند العدوان: وجهان لقوة واحدة."
  devices:
    - title: "المقابلة بين الشطرين"
      text: "قابل «الْمُنْعِمُونَ» بـ«الْمُهْلِكُونَ»، و«قَدَرْنَا» بـ«أُتِينَا»: فالإنعام حين يكونون هم الغالبين، والإهلاك حين يكونون هم المقصودين. والمقابلة أن يُؤتى بمعنيين ثم بما يقابلهما على الترتيب."
    - title: "بناء الفعل للمجهول في «أُتِينَا»"
      text: "لم يسمّ المعتدي، فالحكم يعمّ كل من يأتيهم غازيًا، كائنًا من كان."
  connection: "ثم يختم شهادة القبائل بالمثل: «وأنّا الشاربون الماء صفوًا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَأَنْنَلْ مُنْ / عِمُونَ إِذَا / قَدَرْنَا = مفاعلْتن / مفاعلتن / فعولن — وَأَنْنَلْ مُهْ / لِكُونَ إِذَا / أُتِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين."
context: "ثالث ما علمته القبائل في سلسلة «أنّا» (74–77). وفي نص ابن الأَنْبارِيّ على المكتبة الشاملة: «وأنَّا المانِعُونَ إذا قَدَرْنَا»، وهو تكرار للفظ البيت قبله، وشرحه «نُنعم على من أسرنا بالتخلية» [@ibn-al-anbari، ص419] يدل على «المنعمون». وبها رواه التِّبْرِيزِيّ وشرحه بلفظ ابن الأَنْبارِيّ [@tabrizi-ashr، ص245]، وكذلك الجَمْهَرة [@jamhara، ص295]، فأخذنا بها."
variants:
  - reading: "وَأَنَّا الْمَانِعُونَ إِذَا قَدَرْنَا"
    status: "نص المكتبة الشاملة لشرح ابن الأَنْبارِيّ"
    note: "[@ibn-al-anbari، ص419]."
  - reading: "وَأَنَّا الْمُطْعِمُونَ إِذَا قَدَرْنَا ... وَأَنَّا الْمُهْلِكُونَ إِذَا ابْتُلِينَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "وشرحها: «قد علمت هذه القبائل أنا نطعم الضيفان إذا قدرنا عليه، ونهلك أعداءنا إذا اختبروا قتالنا» [@zawzani، ص234]."
