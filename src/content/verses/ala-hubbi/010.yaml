first: "ذِرَاعَيْ عَيْطَلٍ أَدْمَاءَ بِكْرٍ"
second: "تَرَبَّعَتِ الْأَجَارِعَ وَالْمُتُونَا"
meaning: "تريك ذراعين ممتلئتين بيضاوين، كذراعي ناقة طويلة العنق بيضاء فتية، رعت الربيع في الرمال والأرض الصلبة فسمنت. قال الزَّوْزَنِيّ: «يقول: تريك ذراعين ممتلئتين لَحْمًا كذراعي ناقة طويلة لم تلد بعد» [@zawzani، ص218]، ثم قال: «ذكر هذا مبالغة في سمنها، أي ناقة سمينة لم تحمل ولدًا قط، بيضاء اللون» [@zawzani، ص219]. أما ابن الأَنْبارِيّ فيجعل العيطل ظبية: «وأراد: ذراعي عيطل، يعني ظبية عيطلا» [@ibn-al-anbari، ص381]."
vocabulary:
  - term: "عَيْطَلٍ"
    text: "«والعيطل والعيطاء، والعطبول، والعنطنطة: الطويلة. ويقال: العطبول، والعطبولة، والعيطاء والعنقاء: الطويلة العنق» [@ibn-al-anbari، ص379]. وفي «لسان العرب»: «والعَيْطَل: النَّاقَةُ الطَّوِيلَةُ فِي حُسْن مَنْظَر وسِمَن» [@lisan، ج11 ص455]."
  - term: "أَدْمَاءَ"
    text: "«البيضاء» [@ibn-al-anbari، ص379]."
  - term: "بِكْرٍ"
    text: "قال الزَّوْزَنِيّ: «البِكْر: الناقة التي حملت بطنًا واحدًا، ويروى بَكر بفتح الباء، وهو الفتي من الإبل وبكسر الباء أعلى الروايتين» [@zawzani، ص218]."
  - term: "تَرَبَّعَتِ"
    text: "«معناه أقامت أيام الربيع بالأجارع» [@ibn-al-anbari، ص379]، أي رعت عشب الربيع."
  - term: "الْأَجَارِعَ"
    text: "«وواحد الأجارع أجرع، وهو من الرمل ما لم يبلغ أن يكون حبلا» [@ibn-al-anbari، ص379]، والحبل من الرمل: «المجتمع الكثير العالي» [@lisan، ج11 ص137]، فالأجرع رمل لم يرتفع ارتفاعه."
  - term: "الْمُتُونَا"
    text: "«ما غلظ من الأرض، واحدها متن» [@ibn-al-anbari، ص380]."
syntax:
  - "قال ابن الأَنْبارِيّ: «و (ذراعي عيطل) نصب بتريك. وأدماء نعت لعيطل، وفي تربعت كناية العيطل» [@ibn-al-anbari، ص381]، والكناية عنده: الضمير. أي أن «ذراعَيْ» مفعول ثانٍ لـ«تريك» في البيت السابق، منصوب بالياء لأنه مثنى، وحُذفت نونه للإضافة."
  - "«أدماءَ» نعت لـ«عيطلٍ» مجرور بالفتحة لأنه ممنوع من الصرف، و«بِكْرٍ» نعت ثانٍ."
  - "جملة «تربّعت الأجارع والمتونا» نعت ثالث، وفاعلها ضمير العيطل، و«الأجارعَ» مفعول به، و«المتونا» معطوف عليه."
morphology:
  - "«عَيْطَل» على «فَيْعَل»، والياء زائدة، من «عَطَل»."
  - "«أَدْمَاء» على «فَعْلاء»، مؤنث «آدَم»، من الأُدْمة: البياض في الإبل."
  - "«تَرَبَّعَ» على «تَفَعَّلَ»، من الربيع: أقام فيه ورعى."
  - "«الأَجَارِع» جمع «أَجْرَع» على «أَفَاعِل»، و«المُتُون» جمع «مَتْن» على «فُعُول»."
rhetoric:
  thesis: "أول ما يصفه من جسدها ذراعاها: بيضاوان ممتلئتان. والصورة من عالم البادية: ناقة فتية سمينة رعت الربيع. فجمال المرأة يقاس عنده بأحسن ما يعرفه من الحيوان."
  devices:
    - title: "الاستعارة في «ذِرَاعَيْ عَيْطَلٍ»"
      text: "لم يقل: ذراعين كذراعي عيطل، بل جعل ذراعيها ذراعي الناقة نفسها. وهذا ما يسميه عبد القاهر الجُرْجانيّ استعارة: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "تتابع الصفات في «عَيْطَلٍ أَدْمَاءَ بِكْرٍ»"
      text: "ثلاث صفات في ثلاث كلمات: الطول، والبياض، والفتوّة. وكل صفة منها من صفات المرأة الجميلة عندهم."
    - title: "التعليل بالصورة في «تَرَبَّعَتِ الْأَجَارِعَ وَالْمُتُونَا»"
      text: "ذكر مرعى الناقة ليفسّر امتلاءها، قال الزَّوْزَنِيّ: «ذكر هذا مبالغة في سمنها» [@zawzani، ص219]. فالشطر الثاني كله دليل على الصفة."
  connection: "ثم يصف ثديها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "ذِرَاعَيْ عَيْ / طَلِنْ أَدْمَا / ءَ بِكْرِنْ = مفاعَلْتن / مفاعَلْتن / فعولن — تَرَبْبَعَتِلْ / أَجَارِعَ وَالْ / مُتُونَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، فصارت «مفاعَلْتن»."
context: "من أبيات وصف جسد الظعينة (9–12)، وهي أبيات حسية نشرحها كاملة. وهو عند الزَّوْزَنِيّ البيت الرابع عشر، وعجزه عنده «هِجَانِ اللَّوْنِ لَمْ تَقْرَأْ جَنِينَا» [@zawzani، ص218]."
variants:
  - reading: "ذِرَاعَيْ حُرَّةٍ أَدْمَاءَ بِكْرٍ / هِجَانِ اللَّوْنِ لَمْ تَقْرَأْ جَنِينَا"
    status: "رواية أبي عُبَيْدة، يذكرها ابن الأَنْبارِيّ"
    note: "قال ابن الأَنْبارِيّ: «فالحرة تكون امرأة خالصة كريمة. و (هجان اللون) معناه بيضاء»، «وقوله: (لم تقرأ جنينا) قال أبو عبيدة: معناه لم تضم في رحمها ولدا قط» [@ibn-al-anbari، ص380]. والزَّوْزَنِيّ يروي العجز هكذا مع «عيطل» [@zawzani، ص218]."
  - reading: "ذِرَاعَيْ عَيْطَلٍ أَدْمَاءَ بَكْرٍ / غَذَاهَا الْخَفْضُ لَمْ تَحْمِلْ جَنِينَا"
    status: "رواية في «لسان العرب»"
    note: "رواها صاحب «اللسان» في مادة «بكر» [@lisan، ج4 ص79]، والخفض: لين العيش ودعته."
  - reading: "تَرَبَّعَتِ الْأَمَاعِزَ وَالْمُتُونَا"
    status: "رواية الجوهري، يذكرها صاحب «لسان العرب»"
    note: "قال: «وَهَذَا الْبَيْتُ أَورده الْجَوْهَرِيُّ»، ثم ذكره بالأماعز [@lisan، ج11 ص455]، والأماعز: الأرض الصلبة ذات الحجارة."
