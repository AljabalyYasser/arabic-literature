first: "حُدَيَّا النَّاسِ كُلِّهِمُ جَمِيعًا"
second: "مُقَارَعَةً بَنِيهِمْ عَنْ بَنِينَا"
meaning: "نحن نتحدى الناس كلهم جميعًا، ونقارع أبناءهم دفاعًا عن أبنائنا. قال الزَّوْزَنِيّ: «يقول: نتحدى الناس كلهم بمثل مجدنا وشرفنا، ونقارع أبناءهم ذابين عن أبنائنا، أي نضاربهم بالسيوف حماية للحريم وذبًّا عن الحوزة» [@zawzani، ص225]. ولأبي جعفر تفسير آخر: «حديا الناس معناه أحدو الناس، أسوقهم وأدعوهم كلهم، لا أحاشي منهم أحدا، إلى المقارعة» [@ibn-al-anbari، ص399]."
vocabulary:
  - term: "حُدَيَّا"
    text: "فيها أقوال يذكرها ابن الأَنْبارِيّ: «حُدياك معناه أغلبك»، و«نحن أشراف الناس»، و«والحديا: الغاية» [@ibn-al-anbari، ص399]. وفي «لسان العرب»: «وَهُوَ حُدَيَّا الناسِ أَي يَتَحَدَّاهم ويَتَعَمَّدهم» [@lisan، ج14 ص168]."
  - term: "مُقَارَعَةً"
    text: "«والمقارعة: المخاطرة» [@ibn-al-anbari، ص399]، وقال أبو جعفر: «مقارعة: مراهنة» [@ibn-al-anbari، ص399]. وعند الزَّوْزَنِيّ: المضاربة بالسيوف."
syntax:
  - "يذكر ابن الأَنْبارِيّ في «حديا» أربعة أوجه: «وموضع حديا الناس رفع بإضمار نحن حديا الناس. ويجوز أن يكون منصوبا على المدح، يريد: أذكر حديا الناس. ويجوز أن يكون مخفوضا على معنى الباء، يريد بفتيان بحديا الناس. ويجوز أن يكون منصوبا على المصدر، يريد أحدو حديا الناس» [@ibn-al-anbari، ص399]."
  - "وقال: «وجميعا ومقارعة منصوبان على المصدر، وبنيهم نصب بفعل مشتق، معناه نقارع بنيهم» [@ibn-al-anbari، ص399]."
  - "«كلِّهم» توكيد لـ«الناس» مجرور، و«عن بنينا» متعلق بالمقارعة."
morphology:
  - "«حُدَيَّا» على صيغة التصغير، قال أبو جعفر: «وقال: حديا تصغير حدوى» [@ibn-al-anbari، ص399]، وقال الزَّوْزَنِيّ: «حُديَّا: اسم جاء على صيغة التصغير مثل ثريا وحميّا وهي بمعنى التحدي» [@zawzani، ص225]."
  - "«مُقَارَعَة» مصدر «قَارَعَ» على «مُفَاعَلَة»."
  - "«بَنِين» جمع «ابن» ملحق بجمع المذكر السالم."
rhetoric:
  thesis: "تحدٍّ شامل: الناس كلهم خصوم محتملون، والقتال دفاع عن الأبناء والحريم. فالفخر يربط الحرب بحماية الأسرة."
  devices:
    - title: "المقابلة في «بَنِيهِمْ عَنْ بَنِينَا»"
      text: "أبناؤهم في مقابل أبنائنا: صراع بين أسرتين، والكلمتان من جذر واحد. والمطابقة عند ابن رَشِيق: «أن يأتلف في معناه ما يضاد في فحواه» [@ibn-rashiq، ج2 ص5]."
    - title: "تراكم التوكيد في «النَّاسِ كُلِّهِمُ جَمِيعًا»"
      text: "ثلاث كلمات للعموم: الناس، وكلهم، وجميعًا. فلا يُستثنى أحد من التحدي. وهذه قراءتنا."
    - title: "الإيجاز في «حُدَيَّا»"
      text: "كلمة واحدة على صيغة نادرة تحمل معنى التحدي والسبق والغاية، ولذلك كثرت أقوال الشراح فيها."
  connection: "ثم يفسّر هذه المقارعة: يومان، يوم خوف ويوم أمن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "حُدَيْيَنْ نَا / سِ كُلْلِهِمُو / جَمِيعَنْ = مفاعَلْتن / مفاعلَتن / فعولن — مُقَارَعَةَنْ / بَنِيهِمْ عَنْ / بَنِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن». وأُشبعت ضمة الميم في «كُلِّهِمُ» فصارت «كُلِّهِمُو»."
context: "من أبيات المجد والحرب، وأصعب أبيات القصيدة لفظًا، كما تدل كثرة الوجوه فيه. قال أبو جعفر إن البيت التالي يفسّر معنى المقارعة [@ibn-al-anbari، ص400]. وهو عند الزَّوْزَنِيّ البيت الثامن والأربعون [@zawzani، ص225]."
variants:
  - reading: "مُقَارَعَةً بَنِيهِمْ أَوْ بَنِينَا"
    status: "رواية يذكرها التِّبْرِيزِيّ"
    note: "قال: «وقيل: الرواية (مقارعة بنيهم أو بنينا) أي نقتل بنيهم أو يقتلون بنينا» [@tabrizi-ashr، ص233]."
