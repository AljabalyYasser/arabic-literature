first: "نَحُزُّ رُءُوسَهُمْ فِي غَيْرِ بِرٍّ"
second: "فَمَا يَدْرُونَ مَاذَا يَتَّقُونَا"
meaning: "نقطع رؤوسهم بلا رحمة ولا شفقة، فقد دهشوا فلا يدرون كيف يتقوننا. قال ابن الأَنْبارِيّ: «قوله (في غير بر) معناه في غير بر منا بهم، ولا شفقة عليهم، فما يدرون كيف يردون عن أنفسهم» [@ibn-al-anbari، ص397]. وقال أبو جعفر: «قد دهشوا فما يدرون كيف يتقون ونحن نقتلهم كيف شئنا» [@ibn-al-anbari، ص397]. وقال الزَّوْزَنِيّ: «يقول: نقطع رءوسهم في غير بِرٍّ، أي في عقوق، ولا يدرون ماذا يحذرون منا من القتل وسبي الْحُرَم واستباحة الأموال» [@zawzani، ص224]."
vocabulary:
  - term: "نَحُزُّ"
    text: "نقطع."
  - term: "بِرٍّ"
    text: "إحسان وشفقة. وفي «لسان العرب» في البيت: «مَعْنَاهُ فِي غَيْرِ طَاعَةٍ وَخَيْرٍ» [@lisan، ج4 ص52]."
  - term: "يَتَّقُونَا"
    text: "يحذرون ويحتمون."
syntax:
  - "قال ابن الأَنْبارِيّ: «و (في) من صلة نحز، وهي حال معناه نحز رءوسهم غير بارين» [@ibn-al-anbari، ص397]."
  - "وفي «ماذا» وجهان عنده: «وموضع ما رفع بذا، وذا بما، ويتقون صلة ذا»، أي: ما الذي يتقونه، «ويجوز أن يكون ماذا حرفا واحدا منصوبا. بيتقون، يريد بأي شيء يتقون» [@ibn-al-anbari، ص397]."
  - "«فما يدرون» الفاء سببية، و«ما» نافية، وجملة «ماذا يتقون» سدّت مسدّ مفعولي «يدرون»."
morphology:
  - "«نَحُزّ» مضارع «حَزَّ» المضعّف على «فَعَلَ يَفْعُلُ»."
  - "«يَتَّقُون» مضارع «اتَّقَى» على «افْتَعَلَ» من «وقى»، قُلبت الواو تاء وأُدغمت في تاء الافتعال."
  - "«بِرّ» مصدر «بَرَّ يَبَرُّ»."
rhetoric:
  thesis: "يفخر بالقسوة صراحة: لا رحمة في القتل. والعدو في حيرة لا يعرف من أين يأتيه الموت، فيكتمل الإذلال."
  devices:
    - title: "تعدد المعنى في «فِي غَيْرِ بِرٍّ»"
      text: "البِرّ بالكسر: الرحمة والطاعة، وفي رواية بالفتح «بَرّ»: البر اليابس، فيصير المعنى أن الرؤوس تسقط في بحر من الدم لا على أرض، كما يذكر ابن الأَنْبارِيّ والتِّبْرِيزِيّ. فالكلمة تحمل في الروايات صورتين."
    - title: "الاستفهام في «مَاذَا يَتَّقُونَا»"
      text: "يصوّر حيرة الأعداء بسؤال يدور في نفوسهم: ماذا نتقي؟ فيدخل السامع في رؤوسهم المرتبكة. وهذه قراءتنا."
    - title: "النفي المزدوج"
      text: "«في غير بر» و«فما يدرون»: نفي الرحمة عن القاتل، ونفي المعرفة عن المقتول. وهذه قراءتنا."
  connection: "ثم يصف السيوف في أيدي الفريقين: كأنها مخاريق في أيدي صبيان يلعبون."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "نَحُزْزُ رُءُو / سَهُمْ فِي غَيْ / رِ بِرْرِنْ = مفاعلَتن / مفاعَلْتن / فعولن — فَمَا يَدْرُو / نَ مَاذَا يَتْ / تَقُونَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب. وهو عند الزَّوْزَنِيّ البيت الثاني والأربعون، بعد «ونحن إذا عماد الحي» [@zawzani، ص224]."
variants:
  - reading: "نَجُذُّ رُءُوسَهُمْ فِي غَيْرِ بِرٍّ"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي نص الزَّوْزَنِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (نجذ رءوسهم) أي نقطعها» [@ibn-al-anbari، ص397]. وقال الزَّوْزَنِيّ: «الجذ: القطع» [@zawzani، ص224]."
  - reading: "نَحُزُّ رُءُوسَهُمْ فِي غَيْرِ بَرٍّ"
    status: "رواية يذكرها ابن الأَنْبارِيّ والتِّبْرِيزِيّ"
    note: "بفتح الباء، قال ابن الأَنْبارِيّ: «أي تسقط في بحر من الدماء، يريد لا تسقط في صحراء. وهذا مثل، أي صارت الأرض كالبحر من الدم» [@ibn-al-anbari، ص397]. ويرويه التِّبْرِيزِيّ «تَخِرُّ رُءُوسُهُمْ فِي غَيْرِ بَرٍّ» [@tabrizi-ashr، ص230]."
  - reading: "نَجُزُّ رُءُوسَهُمْ فِي غَيْرِ بِرٍّ"
    status: "رواية يذكرها ابن الأَنْبارِيّ والتِّبْرِيزِيّ"
    note: "«بالجيم والزاي» [@ibn-al-anbari، ص397]، وقال التِّبْرِيزِيّ: «أي نجزُّ نواصيهم إذا أسرناهم، ونمن عليهم» [@tabrizi-ashr، ص230]."
  - reading: "نَجُذُّ رُءُوسَهُمْ فِي غَيْرِ نُسْكٍ"
    status: "رواية يذكرها التِّبْرِيزِيّ"
    note: "قال: «وقالوا (في غير بر) أي لا نتقرب إلى الله بذلك كما نتقرب بالنُّسُك، ويروى (في غير نُسك)» [@tabrizi-ashr، ص230]."
