first: "عَشَوْزَنَةً إِذَا انْقَلَبَتْ أَرَنَّتْ"
second: "تَدُقُّ قَفَا الْمُثَقِّفِ وَالْجَبِينَا"
meaning: "قناة صلبة، إذا تقلّبت في الثِّقاف صوّتت، وضربت قفا من يقوّمها وجبينه. قال ابن الأَنْبارِيّ: «أي صوتت وشجت قفا من يثقفها، أي يقوّمها. وهذا مثل ضربه. أي قناتنا لا تستقيم لمن أراد أن يقومها» [@ibn-al-anbari، ص405]."
vocabulary:
  - term: "عَشَوْزَنَةً"
    text: "الصلبة الشديدة، وقد مرّت في البيت قبله [@ibn-al-anbari، ص404]."
  - term: "انْقَلَبَتْ"
    text: "تقلّبت في الثِّقاف حين يُغمز بها، أي «إذا انقلبت في ثقافها صوَّتت» كما يقول التِّبْرِيزِيّ [@tabrizi-ashr، ص237]."
  - term: "أَرَنَّتْ"
    text: "«صوتت» [@zawzani، ص228]. وفي اللسان: «وأَرَنَّت القوسُ فِي إنباضِها» [@lisan، ج13 ص187]، أي صوّتت حين يُجذب وترها ثم يُرسل، فالقناة تصوّت كما تصوّت القوس."
  - term: "قَفَا"
    text: "مؤخَّر العنق."
  - term: "الْمُثَقِّفِ"
    text: "الذي يقوّم الرمح بالثِّقاف، «أي يقوّمها» [@ibn-al-anbari، ص405]."
syntax:
  - "«عَشَوْزَنَةً» منصوبة: «والعشوزنة الثانية مردودة على الأولى» [@ibn-al-anbari، ص405]، أي أنها تابعة لـ«عَشَوْزَنَةً» التي في عجز البيت قبله، تكرّرها وتبني عليها."
  - "«إِذَا» ظرف شرطي، وجملة «انْقَلَبَتْ» في محل جر بإضافته إليها، و«أَرَنَّتْ» جوابه. والجملة الشرطية في موضع نصب نعت لـ«عَشَوْزَنَةً»."
  - "«تَدُقُّ» مضارع فاعله ضمير القناة، و«قَفَا» مفعول به منصوب بفتحة مقدّرة على الألف، «والجبين نسق على القفا» [@ibn-al-anbari، ص405]، أي معطوف عليه، والنسق اسم الكوفيين للعطف بالحرف. وجملة «تَدُقُّ» نعت ثانٍ."
morphology:
  - "«أَرَنَّ» على «أَفْعَلَ» من المضعّف «رَنَّ»: «رَنَّت تَرِنُّ رَنيناً ورَنَّنَتْ تَرْنيناً وتَرْنِيَة وأَرَنَّتْ: صَاحَتْ» [@lisan، ج13 ص187]."
  - "«انْقَلَبَ» على «انْفَعَلَ»، مطاوع «قَلَبَ»."
  - "«الْمُثَقِّف» اسم فاعل من «ثَقَّفَ» على «فَعَّلَ»."
rhetoric:
  thesis: "يبلغ المثل غايته: القناة لا تنفر وحدها، بل تصيب من يعالجها في قفاه وجبينه. فمن حاول إذلال تَغْلِب عاد عليه الأذى."
  devices:
    - title: "تمام التمثيل في «تَدُقُّ قَفَا الْمُثَقِّفِ»"
      text: "جعل الأذى يرجع على المقوِّم نفسه. قال الزَّوْزَنِيّ: «كذلك عزّتهم لا تضعضع لمن رامها بل تهلكه وتقهره» [@zawzani، ص228]. والتمثيل تشبيه حال بحال يُستخرج وجه الشبه بينهما بالتأمل، وهو عند عبد القاهر الجُرْجانيّ ما كان الشبه فيه «محصّلاً بضرب من التأوّل» [@asrar، ص90]. والمخاطَب بالمثل هو الملك: من أراد تقويم تَغْلِب أصابته."
    - title: "الاستعارة في «أَرَنَّتْ»"
      text: "الإرنان صوت القوس عند إنباضها، وصوت النائحة [@lisan، ج13 ص187]، فأعطى القناة صوتًا كأن لها نفسًا تصيح وتمتنع."
    - title: "الطباق في «قَفَا» و«الْجَبِينَا»"
      text: "الطباق الجمع بين الضدين في الكلام. وهنا خلف الرأس وأمامه، فالقناة تصيب المقوِّم من كل جهة. وهذه قراءتنا."
  connection: "ثم يلتفت إلى الملك سائلًا: هل سمعت بنقص في جُشَم بن بكر؟"
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "عَشَوْزَنَتَنْ / إِذَنْ قَلَبَتْ / أَرَنْنَتْ = مفاعلتن / مفاعلتن / فعولن — تَدُقْقُ قَفَلْ / مُثَقْقِفِ وَلْ / جَبِينَا = مفاعلتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». جاء الحشو كله على الأصل، بلا عَصْب. والعَرُوض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وسقطت همزة الوصل في «انْقَلَبَتْ» فصارت «إِذَنْ قَلَبَتْ» في النطق."
context: "آخر أبيات القناة (47–49). ويستشهد به صاحب اللسان مع البيت قبله في مادة «عشزن» [@lisan، ج13 ص286]، وفي مادة «ثقف» [@lisan، ج9 ص20]."
