first: "أَبَا هِنْدٍ فَلَا تَعْجَلْ عَلَيْنَا"
second: "وَأَنْظِرْنَا نُخَبِّرْكَ الْيَقِينَا"
meaning: "يا أبا هند، لا تعجل علينا بحكمك أو بغضبك، وأمهلنا نخبرك بالخبر اليقين عن قومنا. قال الزَّوْزَنِيّ: «يقول: يا أبا هند لا تعجل علينا وانظرنا نخبرك باليقين من أمرنا وشرفنا، يريد عمرو بن هند فكناه» [@zawzani، ص221]."
vocabulary:
  - term: "أَبَا هِنْدٍ"
    text: "«أبو هند: عمرو بن المنذر» [@ibn-al-anbari، ص387]، ملك الحيرة، وكُني بأبي هند وهو ابن هند."
  - term: "أَنْظِرْنَا"
    text: "«معناه انتظرنا» [@ibn-al-anbari، ص387]، ويجوز عنده أن يكون معناه «أخرنا» [@ibn-al-anbari، ص388]. وفي «لسان العرب»: «وَقَالَ الزَّجَّاجُ: قِيلَ مَعْنَى أَنْظِرُونا انْتَظِرُونا أَيضاً؛ وَمِنْهُ قَوْلُ عَمْرِو بْنِ كُلْثُومٍ» [@lisan، ج5 ص216]."
  - term: "الْيَقِينَا"
    text: "الخبر الثابت الذي لا شك فيه."
syntax:
  - "قال ابن الأَنْبارِيّ: «ونصب أبا هند على النداء، والفاء تصل ما بعدها بما قبلها، ونخبِّرك جواب الجزاء المقدر، أي أن تنظرنا نخبّرك» [@ibn-al-anbari، ص388]."
  - "«لا تعجلْ» فعل مضارع مجزوم بـ«لا» الناهية، و«أنظِرْنا» فعل أمر، و«نخبّرْك» مجزوم في جوابه."
morphology:
  - "«أَنْظِرْ» أمر «أَنْظَرَ» على «أَفْعَلَ» بمعنى أمهل. ويذكر ابن الأَنْبارِيّ في الآية ﴿انظرونا نقتبس من نوركم﴾ قراءتين: «انظُرونا» بمعنى انتظرونا، و«أنظِرونا» بمعنى أخّرونا [@ibn-al-anbari، ص388]."
  - "«تَعْجَل» مضارع «عَجِلَ» على «فَعِلَ يَفْعَلُ»."
rhetoric:
  thesis: "هنا ينتقل الشاعر من النسيب إلى موضوعه: الخطاب للملك. ويعيد عبارة البيت السادس «نخبرك اليقين»، فالخبر الذي عرضه على الظعينة يعرضه الآن على عَمْرو بن هند."
  devices:
    - title: "النداء بالكنية «أَبَا هِنْدٍ»"
      text: "لم يخاطبه بلقب الملك، بل بكنيته، كما يخاطب الرجلُ الرجل. فهو يكلمه كلام الندّ للندّ. وهذه قراءتنا."
    - title: "التكرار الرابط في «نُخَبِّرْكَ الْيَقِينَا»"
      text: "العبارة نفسها في البيت السادس للظعينة، وهنا للملك. فيربط التكرار بين قسمي القصيدة: كلاهما يُطلب منه أن يقف ويسمع خبر تَغْلِب. وهذه قراءتنا."
    - title: "الطلب الذي يحمل التهديد"
      text: "«فلا تعجل علينا» نهي في ظاهره، وفي باطنه تحذير: إن عجلت ندمت، لأنك لا تعرف من نحن بعد."
  connection: "ثم يبدأ الخبر اليقين: «بأنا نورد الرايات بيضا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "أَبَا هِنْدِنْ / فَلَا تَعْجَلْ / عَلَيْنَا = مفاعَلْتن / مفاعَلْتن / فعولن — وَأَنْظِرْنَا / نُخَبْبِرْكَلْ / يَقِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "أول القسم الذي يخاطب فيه عَمْرو بن هند (18–25)، وبه تبدأ القصيدة الفخر الصريح. ويتفق مع خبر الخصومة الذي يرويه ابن الأَنْبارِيّ: تَغْلِب تقف بين يدي الملك تطلب حكمه [@ibn-al-anbari، ص370]."
variants:
