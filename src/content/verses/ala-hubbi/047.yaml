first: "فَإِنَّ قَنَاتَنَا يَا عَمْرُو أَعْيَتْ"
second: "عَلَى الْأَعْدَاءِ قَبْلَكَ أَنْ تَلِينَا"
meaning: "فإن رمحنا، يا عَمْرو، قد أبى أن يلين لأعدائنا قبلك، فلن يلين لك. والقناة هنا عزّ القبيلة وأصلها. قال ابن الأَنْبارِيّ: «ويروى: (وإن قناتنا) ، أي عودنا وأصلنا. وهذا مثل. يريد أن كل من نازعنا وأراد مغالبتنا خاب وفزنا بالظفر به» [@ibn-al-anbari، ص404]. وقال الزَّوْزَنِيّ: «العرب تستعير للعز اسم القناة. يقول: فإن قناتنا أبت أن تلين لأعدائنا قبلك، يريد أن عزهم أبى أن يزول بمحاربة أعدائهم ومخاصمتهم ومكايدتهم، يريد أن عزهم منيع لا يرام» [@zawzani، ص227]."
vocabulary:
  - term: "قَنَاتَنَا"
    text: "القناة: الرمح، وأراد بها الأصل والعز، قال التِّبْرِيزِيّ: «أراد بالقناة الأصل، أي نحن لا نلين لأحد» [@tabrizi-ashr، ص236]."
  - term: "أَعْيَتْ"
    text: "أبت وامتنعت، من الإعياء: العجز، أي أعجزت الأعداء."
  - term: "تَلِينَا"
    text: "تنثني وتخضع."
syntax:
  - "«إنّ» حرف توكيد، و«قناتَنا» اسمها، وجملة «أعيت» خبرها، و«يا عمرو» نداء معترض بين الاسم والخبر."
  - "قال ابن الأَنْبارِيّ: «وموضع أن نصب على معنى بأن تلين، ولأن تلين» [@ibn-al-anbari، ص404]. أي أن المصدر المؤول منصوب بنزع الخافض."
  - "«على الأعداء» متعلق بـ«أعيت»، و«قبلك» ظرف متعلق به كذلك."
morphology:
  - "«قَنَاة» على «فَعَلَة»، وجمعها «قَنًا» و«قَنَوات»."
  - "«أَعْيَتْ» ماضي «أَعْيَا» على «أَفْعَلَ»، ناقص يائي."
  - "«تَلِين» مضارع «لَانَ يَلِينُ»، أجوف يائي."
rhetoric:
  thesis: "يختم الإنكار بصورة واحدة تلخص موقف القبيلة: رمح لا ينثني. والقناة في الأبيات الثلاثة (47–49) تتحول إلى رمز للعزة التي تجرح من يحاول تقويمها."
  devices:
    - title: "الاستعارة في «قَنَاتَنَا»"
      text: "جعل عزّ القبيلة قناة صلبة، فاستعار لها اسم الرمح. قال الزَّوْزَنِيّ: «العرب تستعير للعز اسم القناة» [@zawzani، ص227]. وهي استعارة على ما يحدّه عبد القاهر الجُرْجانيّ: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "النداء المعترض «يَا عَمْرُو»"
      text: "قطع الجملة ليسمّي المخاطب باسمه وحده، بلا كنية ولا نسب: مواجهة مباشرة في منتصف الكلام. وهذه قراءتنا."
    - title: "التعريض في «قَبْلَكَ»"
      text: "كلمة واحدة تجعل الملك واحدًا من أعداء كثيرين حاولوا وفشلوا، فهو ليس أول من يحاول ولن يكون الأخير."
  connection: "ثم يمد الصورة: إذا عضّ الثقاف القناة لتقويمها نفرت وضربت من يقوّمها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "فَإِنْنَ قَنَا / تَنَا يَا عَمْ / رُ أَعْيَتْ = مفاعلَتن / مفاعَلْتن / فعولن — عَلَلْ أَعْدَا / ءِ قَبْلَكَ أَنْ / تَلِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "آخر بيت في قسم الشرح الأول من القصيدة، وأول أبيات القناة (47–49). وهو عند الزَّوْزَنِيّ البيت السابع والخمسون [@zawzani، ص227]."
