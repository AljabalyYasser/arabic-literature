first: "يَقُتْنَ جِيَادَنَا وَيَقُلْنَ لَسْتُمْ"
second: "بُعُولَتَنَا إِذَا لَمْ تَمْنَعُونَا"
meaning: "يُطعمن خيلنا الجياد بأيديهن، ويقلن لنا: لستم أزواجنا إن لم تحمونا من السبي. قال الزَّوْزَنِيّ: «يعلفن خيلنا الجياد ويقلن: لستم أزواجنا إذا لم تمنعونا من سبي الأعداء إيانا» [@zawzani، ص233]."
vocabulary:
  - term: "يَقُتْنَ"
    text: "يُطعمن القُوت: «يقتن: من القوت، يقال: قات أهله يقوتهم قياتة وقوتا، والقوت: الاسم» [@tabrizi-ashr، ص248]. «القوت: الإطعام بقدر الحاجة» [@zawzani، ص233]. وفي اللسان: «والقَوْتُ: مصدرُ قاتَ يَقُوتُ قَوْتاً وقِياتَةً» [@lisan، ج2 ص74]."
  - term: "جِيَادَنَا"
    text: "خيلنا الكريمة: «والجياد: الخيل، واحدها جواد، فإذا قلت (رجل جواد) جمعته على أجواد للفرق» [@tabrizi-ashr، ص248]."
  - term: "بُعُولَتَنَا"
    text: "أزواجنا، كما في شرح الزَّوْزَنِيّ: «ويقلن: لستم أزواجنا إذا لم تمنعونا» [@zawzani، ص233]. وقد مرّ في البيت 84."
syntax:
  - "«وفي يقتن ضمير الظعائن، ويقتن جواب إذا» [@ibn-al-anbari، ص424]، أي جواب «إذا» في البيت قبله. و«جِيَادَنَا» مفعول به."
  - "«وَيَقُلْنَ» معطوف على «يَقُتْنَ»، وجملة «لَسْتُمْ بُعُولَتَنَا» مقول القول: «ليس» واسمها التاء، و«بُعُولَتَنَا» خبرها."
  - "«إِذَا لَمْ تَمْنَعُونَا» شرط جوابه محذوف دلّ عليه ما قبله. و«تَمْنَعُوا» مجزوم بـ«لم» وعلامة جزمه حذف النون، و«نا» مفعول به."
morphology:
  - "«يَقُتْنَ» مضارع «قَاتَ يَقُوتُ» الأجوف، اتصلت به نون النسوة فسكن آخره، فالتقى ساكنان فحُذفت الواو: يَقُوتْنَ ثم يَقُتْنَ. ومثله «يَقُلْنَ» من «قَالَ يَقُولُ»."
  - "«جِيَاد» جمع «جَوَاد» على «فِعَال»، قُلبت الواو ياء لانكسار ما قبلها."
rhetoric:
  thesis: "النساء يعتنين بالخيل التي يُقاتَل عليها، ثم يربطن صفة الزوج بالحماية: من لا يحمي لا يستحق اسم الزوج."
  devices:
    - title: "الكناية في «يَقُتْنَ جِيَادَنَا»"
      text: "إطعام النساء الخيل بأنفسهن كناية عن عناية القوم بخيلهم وإعدادها للحرب. قال التِّبْرِيزِيّ: «وكانوا لا يرضون للقيام على الخيل إلا بأهليهم إشفاقا عليها» [@tabrizi-ashr، ص248]."
    - title: "الاحتجاج بالشرط في «لَسْتُمْ بُعُولَتَنَا إِذَا لَمْ تَمْنَعُونَا»"
      text: "جعلن الزوجية مشروطة بالحماية، فنفين الصفة عند فقد شرطها. فالحماية عندهن من معنى الزوج نفسه."
    - title: "المقابلة بين «يَقُتْنَ» و«يَقُلْنَ»"
      text: "فعل وقول في شطر واحد: يعملن للحرب بأيديهن، ويحرّضن عليها بألسنتهن."
  connection: "ثم يردّ الرجال على القول بيمين: «إذا لم نحمهنّ فلا بقينا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "يَقُتْنَ جِيَا / دَنَا وَيَقُلْ / نَ لَسْتُمْ = مفاعلتن / مفاعلتن / فعولن — بُعُولَتَنَا / إِذَا لَمْ تَمْ / نَعُونَا = مفاعلتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». الصدر على الأصل، ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الثانية من العَجُز."
context: "من أبيات النساء (82–89)، وهو جواب الشرط في البيت قبله."
variants:
