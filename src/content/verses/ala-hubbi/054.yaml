first: "وَذَا الْبُرَةِ الَّذِي حُدِّثْتَ عَنْهُ"
second: "بِهِ نُحْمَى وَنَحْمِي الْمُلْجَئِينَا"
meaning: "وورثت ذا البُرَة الذي بلغك خبره، به يحمينا غيرنا فلا يُعتدى علينا، وبه نحمي من لجأ إلينا. قال الزَّوْزَنِيّ: «وبمجده يحمينا سيدنا وبه نحمي الفقراء الملجئين إلى الاستجارة بغيرهم» [@zawzani، ص229]."
vocabulary:
  - term: "ذَا الْبُرَةِ"
    text: "«ذا البرة: رجل من بني تغلب بن ربيعة» [@ibn-al-anbari، ص407]. ونقل ابن الأَنْبارِيّ عن أبي جَعْفَر: «ذو البرة يقال له (برة القُنفذ) لقب بذلك لشعر كان على أنفه يلتوي كأنه برة» [@ibn-al-anbari، ص407]. وقال التِّبْرِيزِيّ: «وقيل: هو كعب بن زهير» [@tabrizi-ashr، ص238]. والبُرَة في اللغة: «الحَلْقَة فِي أَنف الْبَعِيرِ» [@lisan، ج14 ص71]."
  - term: "حُدِّثْتَ عَنْهُ"
    text: "بلغك خبره."
  - term: "الْمُلْجَئِينَا"
    text: "«الذين قد التجئوا واحتاجوا إلى من ينصرهم» [@ibn-al-anbari، ص407]."
syntax:
  - "«وذا البرة نسق على مهلهل، والباء صلة» [@ibn-al-anbari، ص407]: أي أن «ذَا» معطوف على «مُهَلْهِلًا» في البيت 52، منصوب بالألف لأنه من الأسماء الستة، و«الْبُرَةِ» مضاف إليه. والباء في «بِهِ» متعلقة بالفعلين بعدها."
  - "«الَّذِي» نعت لـ«ذا البرة»، وجملة «حُدِّثْتَ عَنْهُ» صلة الموصول."
  - "«نُحْمَى» مضارع مبني للمجهول، ونائب الفاعل ضمير المتكلمين. و«نَحْمِي» مبني للمعلوم، و«الْمُلْجَئِينَا» مفعول به منصوب بالياء."
morphology:
  - "«الْبُرَة» حُذفت لامها وعُوّض منها بالتاء. وفي اللسان أنها مما يُكتب بالياء، «وَالْجَمْعُ بُرَاتٌ وبُرًى وبُرِينَ وبِرِينَ» [@lisan، ج14 ص71]."
  - "«الْمُلْجَئِين» جمع «مُلْجَأ» اسم مفعول من «أَلْجَأَ» الرباعي، أي من أُلجئ إلى غيره."
  - "«نُحْمَى» و«نَحْمِي» من «حَمَى يَحْمِي»، ناقص يائي: قُلبت ياؤه ألفًا في المبني للمجهول."
rhetoric:
  thesis: "رجل يحمي قومه من بعده: باسمه يُهاب قومه، وباسمه يُجيرون من استجار بهم."
  devices:
    - title: "المجانسة بين «نُحْمَى» و«نَحْمِي»"
      text: "المجانسة أن يتشابه لفظان ويختلف معناهما. وهنا لفظان من أصل واحد، الأول مبني للمجهول والثاني للمعلوم: فهم محميّون وحماة في وقت واحد، والحماية تأتيهم وتخرج منهم."
    - title: "الإحالة على الشهرة في «الَّذِي حُدِّثْتَ عَنْهُ»"
      text: "لا يعرّف ذا البُرَة، بل يحيل الملك إلى ما سمعه عنه، فشهرته تغني عن وصفه. وهذا يعيد صدى البيت 50: «فهل حُدِّثتَ»."
  connection: "ثم يختم السلسلة بأعظم أجداده: كُلَيْب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَذَلْ بُرَتِلْ / لَذِي حُدْدِثْ / تَ عَنْهُو = مفاعلتن / مفاعلْتن / فعولن — بِهِي نُحْمَى / وَنَحْمِلْ مُلْ / جَئِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الثانية من الصدر، والأولى والثانية من العَجُز. وأُشبعت كسرة الهاء في «بِهِ» فصارت «بِهِي»، وضمة الهاء في «عَنْهُ» آخر الصدر."
context: "خامس الآباء في سلسلة الأبيات 50–55، وهو آخر المنصوبات المعطوفة على «مُهَلْهِلًا»."
variants:
  - reading: "بِهِ نُحْمَى وَنَحْمِي الْمُحْجَرِينَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص229]. والمُحْجَر: المُلجأ، قال الزَّوْزَنِيّ: «أحجرته: ألجأته» [@zawzani، ص221]."
