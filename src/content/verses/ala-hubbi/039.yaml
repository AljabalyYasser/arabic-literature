first: "بِفِتْيَانٍ يَرَوْنَ الْقَتْلَ مَجْدًا"
second: "وَشِيبٍ فِي الْحُرُوبِ مُجَرَّبِينَا"
meaning: "نصبنا الكتيبة بشبان يرون القتل في الحرب مجدًا، وبشيوخ قد جرّبوا الحروب وعرفوها. قال الزَّوْزَنِيّ: «يقول: نسبق ونغلب بشبان يعدون القتال في الحروب مجدًا، وشيب قد مرنوا على الحروب» [@zawzani، ص225]."
vocabulary:
  - term: "فِتْيَانٍ"
    text: "شبان."
  - term: "مَجْدًا"
    text: "«(المجد) : الحظ الوافر الكافي من الشرف والسودد» [@ibn-al-anbari، ص399]، وقال التِّبْرِيزِيّ: «وأصل المجد في الكثرة» [@tabrizi-ashr، ص232]."
  - term: "شِيبٍ"
    text: "جمع «أشيب»: من ابيضّ شعره."
  - term: "مُجَرَّبِينَا"
    text: "قد جُرّبوا في الحروب فعُرف بأسهم، أو جرّبوها فعرفوها، وفسّره الزَّوْزَنِيّ: «وشيب قد مرنوا على الحروب» [@zawzani، ص225]."
syntax:
  - "«بفتيان» متعلق بـ«نصبنا» في البيت السابق أو بـ«السابقين»، ويوافق الثاني شرح الزَّوْزَنِيّ: نسبق ونغلب بشبان."
  - "جملة «يرون القتل مجدا» نعت لـ«فتيان»، و«يرى» هنا قلبية تنصب مفعولين: «القتلَ» و«مجدًا»."
  - "«وشيبٍ» معطوف على «فتيانٍ»، و«مجرّبين» نعت له مجرور بالياء، والألف للإطلاق."
morphology:
  - "«فِتْيَان» جمع «فَتًى» على «فِعْلَان»."
  - "«شِيب» جمع «أَشْيَب» على «فُعْل»، وكُسرت الفاء لمناسبة الياء، كـ«بِيض»."
  - "«مُجَرَّبِين» جمع «مُجَرَّب»، اسم مفعول من «جَرَّبَ»."
rhetoric:
  thesis: "الكتيبة الكاملة تجمع جيلين: حماسة الشباب وخبرة الشيوخ. والقتل عند الشباب ليس نهاية، بل مجد يُطلب."
  devices:
    - title: "الطباق بين «فِتْيَانٍ» و«شِيبٍ»"
      text: "الشباب والشيب في بيت واحد، فالقبيلة كلها في الحرب. والمطابقة عند ابن رَشِيق: «جمعك بين الضدين في الكلام أو بيت الشعر» [@ibn-rashiq، ج2 ص5]."
    - title: "قلب القيم في «يَرَوْنَ الْقَتْلَ مَجْدًا»"
      text: "ما يخافه الناس يراه هؤلاء شرفًا. فالبيت يجعل الموت في الحرب كسبًا. وهذه قراءتنا."
    - title: "التقسيم"
      text: "لكل جيل صفة: للفتيان الإقدام، وللشيوخ التجربة. وهذه قراءتنا."
  connection: "ثم يقول: نحن نتحدى الناس كلهم، ونقارع أبناءهم دفاعًا عن أبنائنا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بِفِتْيَانِنْ / يَرَوْنَلْ قَتْ / لَ مَجْدَنْ = مفاعَلْتن / مفاعَلْتن / فعولن — وَشِيبِنْ فِلْ / حُرُوبِ مُجَرْ / رَبِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب، يتمّ صورة الكتيبة في البيت السابق. وهو عند الزَّوْزَنِيّ البيت السابع والأربعون [@zawzani، ص225]."
variants:
  - reading: "بِشُبَّانٍ يَرَوْنَ الْقَتْلَ مَجْدًا"
    status: "رواية الزَّوْزَنِيّ"
    note: "بـ«شُبّان» مكان «فتيان» [@zawzani، ص225]، والمعنى واحد."
