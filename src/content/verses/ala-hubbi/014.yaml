first: "وَأَعْرَضَتِ الْيَمَامَةُ وَاشْمَخَرَّتْ"
second: "كَأَسْيَافٍ بِأَيْدِي مُصْلِتِينَا"
meaning: "وظهرت لنا اليمامة وارتفعت جبالها في الأفق، تلمع في السراب كأنها سيوف مسلولة في أيدي رجال يشهرونها. قال الزَّوْزَنِيّ: «يقول: فظهرت لنا قرى اليمامة وارتفعت في أعيننا كأسياف بأيدي رجال سالّين سيوفهم، شبه ظهور قراها بظهور أسياف مسلولة من أغمادها» [@zawzani، ص221]. وقال ابن الأَنْبارِيّ: «(أعرضت اليمامة) معناه ظهرت وبدت، أي لمع بها السراب» [@ibn-al-anbari، ص383]. ويرى التِّبْرِيزِيّ أن اليمامة هي الموضع الذي تمضي إليه الظعينة: «فاشتقت لذلك لما رأيت موضعها الذي تصير إليه» [@tabrizi-ashr، ص223]."
vocabulary:
  - term: "أَعْرَضَتِ"
    text: "ظهرت. في «لسان العرب»: «أَعْرَضَتْ هِيَ أَي ظَهَرَتْ وَاسْتَبَانَتْ»، و«أَي أَبْدَتْ عُرْضَها ولاحَتْ جِبالُها لِلنَّاظِرِ إِليها عارِضةً» [@lisan، ج7 ص185]."
  - term: "الْيَمَامَةُ"
    text: "بلاد في وسط جزيرة العرب، كانت لبني حَنِيفة، وفيها أُسر الشاعر في آخر أخباره [@aghani-dk، ج11 ص56]."
  - term: "اشْمَخَرَّتْ"
    text: "«معناه ارتفعت وطالت» [@ibn-al-anbari، ص384]."
  - term: "مُصْلِتِينَا"
    text: "«يقال: أصلت سيفه، إذا سله من غمده وشهره» [@ibn-al-anbari، ص384]."
syntax:
  - "«أعرضت» و«اشمخرّت» فعلان ماضيان، و«اليمامةُ» فاعل الأول، وفاعل الثاني ضميرها."
  - "قال ابن الأَنْبارِيّ: «والكاف نصب بأعرضت، والباء صلة الأسياف، والألف في مصلتينا صلة لفتحة النون» [@ibn-al-anbari، ص384]. وقال التِّبْرِيزِيّ: «والكاف في قوله (كأسياف) في موضع نصب على إنها نعت لمصدر محذوف» [@tabrizi-ashr، ص223]، أي ظهرت ظهورًا كظهور الأسياف."
  - "«بأيدي مصلتين» على حذف الموصوف، قال ابن الأَنْبارِيّ: «معناه بأيدي قوم مصلتين» [@ibn-al-anbari، ص384]."
morphology:
  - "«أَعْرَضَ» على «أَفْعَلَ» لازمًا بمعنى ظهر، وهو مطاوع «عَرَضَ». قال الزَّوْزَنِيّ: «وهذا من النوادر، عرضت الشيء فأعرض، ومثله كببته فأكب، ولا ثالث لهما فيما سمعنا» [@zawzani، ص220]. أي أن المجرد هنا متعدٍّ، والمزيد بالهمزة لازم، على عكس المعتاد."
  - "«اشْمَخَرَّ» على «افْعَلَلَّ»، رباعي مزيد بالهمزة وتضعيف اللام."
  - "«مُصْلِتِين» جمع «مُصْلِت»، اسم فاعل من «أَصْلَتَ»."
rhetoric:
  thesis: "حتى في لحظة الشوق يرى الأفق سيوفًا. فصورة الحرب تتسلل إلى النسيب، وتمهّد للفخر الذي سيأتي."
  devices:
    - title: "التشبيه التمثيلي في «كَأَسْيَافٍ بِأَيْدِي مُصْلِتِينَا»"
      text: "لم يشبّه الجبال بالسيوف في شكل ساكن، بل في هيئة: جبال طويلة تلمع في السراب وتهتز، كسيوف مسلولة ترتفع في الأيدي. ويقول عبد القاهر الجُرْجانيّ: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "التشخيص في «أَعْرَضَتِ ... وَاشْمَخَرَّتْ»"
      text: "جعل الأرض تفعل فعل الإنسان: تُظهر عرضها، وتشمخ بأنفها. وهذه قراءتنا."
    - title: "اللون الحربي في النسيب"
      text: "السيوف المسلولة في مشهد وداع: إشارة إلى أن الشاعر لا يرى العالم إلا بعين المحارب. وهذه قراءتنا."
  connection: "ثم يصف حزنه على فراقها: أشد من حزن ناقة أضلت ولدها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَأَعْرَضَتِلْ / يَمَامَةُ وَاشْ / مَخَرْرَتْ = مفاعلَتن / مفاعلَتن / فعولن — كَأَسْيَافِنْ / بِأَيْدِي مُصْ / لِتِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات الظعينة. وهو عند الزَّوْزَنِيّ البيت الثاني والعشرون، يأتي بعد «تذكرت الصبا» كما عند ابن الأَنْبارِيّ [@zawzani، ص220]."
variants:
  - reading: "فَأَعْرَضَتِ الْيَمَامَةُ وَاشْمَخَرَّتْ"
