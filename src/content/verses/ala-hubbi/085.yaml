first: "لَيَسْتَلِبُنَّ أَبْدَانًا وَبِيضًا"
second: "وَأَسْرَى فِي الْحَدِيدِ مُقَرَّنِينَا"
meaning: "هذا نص العهد: ليسلبُنّ الأعداء دروعهم وسيوفهم، وليأتُنّ بأسرى منهم مقرونين في القيود. وفسّره الزَّوْزَنِيّ بالسلب وبـ«أسرى منهم قد قرنوا في الحديد» [@zawzani، ص232]."
vocabulary:
  - term: "أَبْدَانًا"
    text: "«(الأبدان) : الدروع» [@ibn-al-anbari، ص423]، واستشهد بقول الأعشى: «لها قَونسٌ فوقَ جيب البَدَنْ»، «معناه جيب الدرع» [@ibn-al-anbari، ص423]."
  - term: "بِيضًا"
    text: "السيوف بكسر الباء، والخوذ بفتحها: «والبيض: الحديد، ومن كسر الباء فالمراد به السيوف» [@tabrizi-ashr، ص247]."
  - term: "مُقَرَّنِينَا"
    text: "«مغللين» [@ibn-al-anbari، ص423]، أي مشدودًا بعضهم إلى بعض في القيود."
syntax:
  - "«واللام في قوله (ليستلبن) جواب لأخذ العهد؛ لأنه يمين» [@ibn-al-anbari، ص423]، أي أن العهد في البيت قبله في معنى القسم، وهذا جوابه."
  - "«لَيَسْتَلِبُنَّ» مضارع مسند إلى واو الجماعة العائدة على الأزواج، وأصله «لَيَسْتَلِبُونَنَّ»، حُذفت نون الرفع لتوالي النونات، ثم حُذفت الواو لالتقاء الساكنين وبقيت الضمة دليلًا عليها."
  - "«أَبْدَانًا» مفعول به، و«بِيضًا» و«أَسْرَى» معطوفان عليه، و«فِي الْحَدِيدِ» متعلق بـ«مُقَرَّنِينَا»، و«مُقَرَّنِينَا» نعت لـ«أسرى»."
morphology:
  - "«أَسْرَى» جمع «أَسِير» على «فَعْلَى». قال التِّبْرِيزِيّ: «وأسرى وأسارى بمعنى واحد وقال أبو زيد: الأسرى من كان في وقت الحرب، والأسارى من كان في الأيدي» [@tabrizi-ashr، ص247]."
  - "«مُقَرَّن» اسم مفعول من «قَرَّنَ» المضعّف، والتضعيف للتكثير: قُرن كثيرون بعضهم ببعض."
  - "«أَبْدَان» جمع «بَدَن» على «أَفْعَال»، و«يَسْتَلِب» على «يَفْتَعِل» من «سَلَبَ»."
rhetoric:
  thesis: "مضمون العهد غنيمة كاملة: سلاح العدو وسيوفه ورجاله أسرى، فالنساء يطلبن النصر لا السلامة."
  devices:
    - title: "التوكيد في «لَيَسْتَلِبُنَّ»"
      text: "اجتمع فيه القسم المفهوم من العهد، واللام الواقعة في جوابه، ونون التوكيد الثقيلة، فصار الفعل أقوى ما يكون التزامًا."
    - title: "الترقّي في «أَبْدَانًا وَبِيضًا وَأَسْرَى»"
      text: "بدأ بالدروع ثم السيوف ثم الرجال أنفسهم: من سلاح الدفاع إلى سلاح الهجوم إلى صاحب السلاح."
  connection: "ثم يصف النساء وهن يمشين في الحيّ."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "لَيَسْتَلِبُنْ / نَ أَبْدَانَنْ / وَبِيضَنْ = مفاعلتن / مفاعلْتن / فعولن — وَأَسْرَى فِلْ / حَدِيدِ مُقَرْ / رَنِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الثانية من الصدر، والأولى من العَجُز."
context: "في نسبة هذا البيت إلى القصيدة كلام قديم: روى ابن الأَنْبارِيّ عن الفَرّاء أن المُفَضَّل قال في البيت الذي أوله «ليستلبن» إنه «ليس هو من هذه القصيدة»، ثم قال الفَرّاء: «فجواب أخذ العهد محذوف لبيان معناه» [@ibn-al-anbari، ص423]، أي أن البيت قبله يتم بنفسه دون هذا. ونقل التِّبْرِيزِيّ قول المُفَضَّل نفسه [@tabrizi-ashr، ص247]. وهو ثابت في رواية الزَّوْزَنِيّ والجَمْهَرة [@zawzani، ص232]، [@jamhara، ص297]."
variants:
  - reading: "وَأَسْرَى فِي الْحَدِيدِ مُقَنَّعِينَا"
    status: "رواية أخرى"
    note: "«ويروى: (وأسرى في الحديد مقنعينا)»، «و (مقنعين) معناه مستلئمين» [@ibn-al-anbari، ص423]، أي لابسين دروعهم."
  - reading: "لَيَسْتَلِبُنَّ أَفْرَاسًا وَبِيضًا"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص232]."
  - reading: "لَيَسْتَلِبُنَّ أَبْدَانًا وَبَيْضًا"
    status: "رواية التِّبْرِيزِيّ"
    note: "بفتح الباء، أي خوذ الحديد [@tabrizi-ashr، ص247]."
