first: "عَلَى آثَارِنَا بِيضٌ حِسَانٌ"
second: "نُحَاذِرُ أَنْ تُقَسَّمَ أَوْ تَهُونَا"
meaning: "وراءنا في الحرب نساء بيض جميلات، نخاف عليهن أن يُسبين فيُقسمن بين الأعداء ويُهنّ. قال ابن الأَنْبارِيّ: «معناه: لقيناكم ومن ورائنا النساء. وكذلك كان أهل الجاهلية يفعلون إذا حاربوا» [@ibn-al-anbari، ص421]. وقال الزَّوْزَنِيّ: «كانت العرب تشهد نساءها الحروب وتقيمها خلف الرجال ليقاتل الرجال ذبًّا عن حرمها فلا تفشل مخافة العار بسبي الحرم» [@zawzani، ص232]."
vocabulary:
  - term: "عَلَى آثَارِنَا"
    text: "خلفنا، حيث تقع آثار أقدامنا: «لقيناكم ومن ورائنا النساء» [@ibn-al-anbari، ص421]."
  - term: "بِيضٌ"
    text: "نساء بيض، والبياض عندهم علامة الحرائر المصونات."
  - term: "تُقَسَّمَ"
    text: "تُقسم غنيمة بين السابين، كما قال الزَّوْزَنِيّ: «نحاذر عليها أن يسبيها الأعداء فتقسمها وتهينها» [@zawzani، ص232]."
  - term: "تَهُونَا"
    text: "تذلّ وتُهان."
syntax:
  - "«عَلَى آثَارِنَا» متعلق بمحذوف خبر مقدّم، و«بِيضٌ» مبتدأ مؤخر، و«حِسَانٌ» نعت له."
  - "«وموضع نحاذر رفع في اللفظ بالنون ونصب في التأويل على الحال مما في كرام من ذكر البيض، أي محاذرين نحن تقسيمهن» [@ibn-al-anbari، ص421]: أي أن «نُحَاذِرُ» مضارع مرفوع، وجملته في موضع الحال. وقوله «كرام» يدل على أن روايته في الشرح «بيض كرام»."
  - "«أَنْ تُقَسَّمَ» في تأويل مصدر مفعول به لـ«نحاذر»، و«تَهُونَا» معطوف منصوب، والألف للإطلاق. وفي نص المكتبة الشاملة «تُقَسَّمُ» بالضم، والوجه النصب بعد «أن»."
morphology:
  - "«حِسَان» جمع «حَسْنَاء» على «فِعَال»."
  - "«تُقَسَّم» مضارع «قَسَّمَ» مبني للمجهول، والتضعيف للتكثير: تُوزّع على أيدٍ كثيرة."
  - "«تَهُون» مضارع «هَانَ يَهُونُ»، أجوف واوي. و«نُحَاذِر» على «فَاعَلَ» من «حَذِرَ»."
rhetoric:
  thesis: "يفتتح أبيات النساء: هن سبب الثبات في القتال، لأن الهزيمة تعني سبيهن."
  devices:
    - title: "حذف الموصوف في «بِيضٌ حِسَانٌ»"
      text: "لم يقل «نساء»، بل ذكر صفتين، فعرف السامع الموصوف منهما. والحذف عند عبد القاهر الجُرْجانيّ باب «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "الإيجاز في «تُقَسَّمَ»"
      text: "كلمة واحدة تختصر مصير الأسيرة كله: تُؤخذ، وتُعدّ غنيمة، وتُوزّع بين الغالبين."
    - title: "الترتيب في «تُقَسَّمَ أَوْ تَهُونَا»"
      text: "بدأ بالأشد ظهورًا، وهو القسمة، ثم بما يتبعها من الهوان. وهذه قراءتنا."
  connection: "ثم يبيّن من هن: «ظعائن من بني جشم بن بكر»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "عَلَى آثَا / رِنَا بِيضُنْ / حِسَانُنْ = مفاعلْتن / مفاعلْتن / فعولن — نُحَاذِرُ أَنْ / تُقَسْسَمَ أَوْ / تَهُونَا = مفاعلتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر، وجاء العَجُز على الأصل."
context: "أول أبيات النساء (82–89)، وهي من أشهر ما في القصيدة. ويفسّرها ابن الأَنْبارِيّ والزَّوْزَنِيّ بعادة جاهلية: يُخرج القوم نساءهم إلى الحرب ويضعونهن خلف الصفوف، فلا يفرّ الرجال خوفًا من سبيهن."
variants:
  - reading: "عَلَى آثَارِنَا بِيضٌ كِرَامٌ"
    status: "رواية التِّبْرِيزِيّ"
    note: "[@tabrizi-ashr، ص246]، ويدل عليها شرح ابن الأَنْبارِيّ [@ibn-al-anbari، ص421]."
  - reading: "نُحَاذِرُ أَنْ تُفَارِقَ أَوْ تَهُونَا"
    status: "رواية أخرى"
    note: "«ويروى: (نحاذر أن تفارق أو تهونا) ، أي تُسبى» [@ibn-al-anbari، ص421]، وبها رواية التِّبْرِيزِيّ [@tabrizi-ashr، ص246] والجَمْهَرة [@jamhara، ص296]."
