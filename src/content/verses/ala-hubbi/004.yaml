first: "تَرَى اللَّحِزَ الشَّحِيحَ إِذَا أُمِرَّتْ"
second: "عَلَيْهِ لِمَالِهِ فِيهَا مُهِينَا"
meaning: "ترى البخيل الضيّق الصدر، إذا دارت عليه الكأس، يهين ماله في سبيلها ويبذله. قال ابن الأَنْبارِيّ: «ومعنى البيت: أن الكأس إذا أديرت على القوم وشرب البخيل السيئ الخلق حسن خلقه وأهان ماله» [@ibn-al-anbari، ص374]. وقال الزَّوْزَنِيّ: «ترى الإنسان الضيق الصدر البخيل الحريص مهينا لماله، فيها أي في شربها إذا أمرت الخمر عليه، أي إذا أديرت عليه» [@zawzani، ص216]."
vocabulary:
  - term: "اللَّحِزَ"
    text: "«الضيق البخيل» [@ibn-al-anbari، ص373]، و«اللَّحِزُ: الضَّيِّقُ الشَّحيح النفْس الَّذِي لَا يَكَادُ يُعْطِي شَيْئًا، فإِن أَعطى فَقَلِيلٌ» [@lisan، ج5 ص404]. وقال أبو عَمْرو: «اللحز: السيئ الخلق اللئيم» [@ibn-al-anbari، ص373]."
  - term: "الشَّحِيحَ"
    text: "«البخيل الحريص» [@zawzani، ص216]."
  - term: "أُمِرَّتْ عَلَيْهِ"
    text: "أُديرت عليه الكأس: «إِذا امرّت عَلَيْهِ أَي: أديرت الكأس عَلَيْهِ» [@khizana، ج3 ص179]."
  - term: "مُهِينَا"
    text: "مستخفًّا بماله، يبذله ولا يبالي."
syntax:
  - "قال ابن الأَنْبارِيّ: «واللحز منصوب بترى، ومهينا خبر ترى، واللام وفي صلتان لمهين» [@ibn-al-anbari، ص374]. أي أن «ترى» تنصب «اللحز» مفعولًا أول، و«مهينا» مفعولًا ثانيًا، وهو ما سمّاه «خبر ترى». و«لِمَالِهِ» و«فِيهَا» متعلقان بـ«مهينًا»."
  - "«الشَّحِيحَ» نعت لـ«اللَّحِزَ» منصوب."
  - "«إِذَا أُمِرَّتْ عَلَيْهِ»: «إذا» ظرف شرطي، و«أُمِرَّتْ» ماضٍ مبني للمجهول، ونائب الفاعل ضمير الكأس أو الخمر، و«عَلَيْهِ» متعلق به. وجواب «إذا» محذوف دلّ عليه ما قبله."
  - "اللام في «لِمَالِهِ» لام التقوية، تدخل على مفعول اسم الفاعل إذا تقدّم عليه: مُهينٌ مالَه، فلما قدّم المفعول قوّاه باللام."
morphology:
  - "«اللَّحِز» على «فَعِل» صفة مشبهة، من «لَحِزَ لَحَزًا وتَلَحَّزَ» [@lisan، ج5 ص404]."
  - "«الشَّحِيح» على «فَعِيل»، «والجمع الأشحة والأشحاء، والشحاح أيضًا مثل الشحيح، والفعل شح يَشح، والمصدر الشح وهو البخل معه حرص» [@zawzani، ص216]."
  - "«أُمِرَّتْ» ماضي «أَمَرَّ» الرباعي المضعّف مبنيًّا للمجهول، من الإمرار: الإدارة."
  - "«مُهِين» اسم فاعل من «أَهَانَ» الرباعي الأجوف."
rhetoric:
  thesis: "يختم وصف الخمر بأبلغ ما تصنعه عندهم: البخيل نفسه يصير كريمًا. فمدح الخمر هنا مدح للكرم، والكرم أول ما يفخر به قوم الشاعر في القصيدة."
  devices:
    - title: "الطباق"
      text: "بين «الشَّحِيحَ» و«لِمَالِهِ ... مُهِينَا»: البخل وبذل المال في بيت واحد. والمطابقة عند ابن رَشِيق: «أن يأتلف في معناه ما يضاد في فحواه»، و«جمعك بين الضدين في الكلام أو بيت الشعر» [@ibn-rashiq، ج2 ص5]."
    - title: "المبالغة بالمثال"
      text: "لم يقل: ترى الرجل يهين ماله، بل اختار أبعد الناس عن ذلك ووصفه بصفتين: «اللَّحِزَ الشَّحِيحَ». فكلما اشتد بخله كان تحوّله أدلّ على قوة الخمر. وهذه قراءتنا."
    - title: "الخطاب العام"
      text: "«تَرَى» خطاب لا يقصد به مخاطبًا بعينه، بل كل من يشهد المجلس، فكأنه يدعو السامع إلى أن يرى بعينه."
  connection: "ثم يخرج من الخمر إلى الموت المقدّر: «وإنا سوف تدركنا المنايا مقدّرة لنا ومقدّرينا» [@ibn-al-anbari، ص374]."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "تَرَلْ لَحِزَشْ / شَحِيحَ إِذَا / أُمِرْرَتْ = مفاعلَتن / مفاعلَتن / فعولن — عَلَيْهِ لِمَا / لِهِي فِيهَا / مُهِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "الصدر على الأصل. وفي العَجُز أُشبعت كسرة الهاء في «لِمَالِهِ» فصارت «لِمَالِهِي»، ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الثانية."
context: "آخر أبيات المطلع الخمري في رواية ابن الأَنْبارِيّ [@ibn-al-anbari، ص371–374]. وبه استدل الأَصْمَعِيّ على أن «سخينا» في البيت الثاني من السخاء، كما يروي ابن بَرِّيّ [@lisan، ج13 ص205]. ويقول البَغْداديّ: «والمعنى: أنّ الخمر إذا كثر دورانها عليه أهان ماله وجاد به» [@khizana، ج3 ص179]."
