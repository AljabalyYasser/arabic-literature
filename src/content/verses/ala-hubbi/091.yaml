first: "أَلَا لَا يَجْهَلَنْ أَحَدٌ عَلَيْنَا"
second: "فَنَجْهَلَ فَوْقَ جَهْلِ الْجَاهِلِينَا"
meaning: "لا يَسْفَهَنّ علينا أحد، فنجازيه بأشد من سفهه. قال الزَّوْزَنِيّ: «أي لا يسفهن أحد علينا فنسفه عليهم فوق سفههم، أي نجازيهم بسفههم جزاء يربي عليه» [@zawzani، ص226]، أي يزيد عليه."
vocabulary:
  - term: "يَجْهَلَنْ"
    text: "يسفه ويطيش [@zawzani، ص226]. والجهل هنا ليس ضد العلم، بل هو «السفه والغضب والنزق» [@deif، ج1 ص39]."
  - term: "فَنَجْهَلَ"
    text: "«معناه فنهلكه ونعاقبه بما هو أعظم من جهله» [@ibn-al-anbari، ص426]."
  - term: "فَوْقَ"
    text: "أكثر من، وأشد."
syntax:
  - "«أَلَا» حرف «افتتاح للكلام» [@ibn-al-anbari، ص427]. و«لَا» ناهية، و«يَجْهَلَنْ» فعل مضارع مبني على الفتح لاتصاله بنون التوكيد الخفيفة، في محل جزم بـ«لا». قال ابن الأَنْبارِيّ: «ودخلت النون في يجهلن لتوكيد المستقبل» [@ibn-al-anbari، ص427]."
  - "«أَحَدٌ» فاعل، و«عَلَيْنَا» جار ومجرور متعلق بـ«يجهلن»."
  - "«فَنَجْهَلَ» فعل مضارع منصوب بعد فاء السببية الواقعة في جواب النهي. ويقول ابن الأَنْبارِيّ على مذهب الكوفيين: «منصوب بالفاء لأنها جواب الجحد» [@ibn-al-anbari، ص427]؛ والبصريون يقولون: منصوب بـ«أن» مضمرة بعد الفاء."
  - "«فَوْقَ» ظرف متعلق بـ«نجهل»، و«جَهْلِ» مضاف إليه، و«الْجَاهِلِينَا» مضاف إليه مجرور بالياء لأنه جمع مذكر سالم، والألف للإطلاق."
morphology:
  - "«يَجْهَلَنْ» مضارع «جَهِل» على «فَعِل يَفْعَل»، لحقته نون التوكيد الخفيفة الساكنة."
  - "«الْجَاهِلِين» جمع «جاهل»، اسم فاعل من «جَهِل»."
rhetoric:
  thesis: "بيت تهديد: يعلن أن تَغْلِب لا تبدأ أحدًا بالعدوان، لكنها ترد العدوان بأشد منه. وسمّى الجزاء جهلًا ليقابل لفظ العدوان بمثله."
  devices:
    - title: "المشاكلة، أو «الازدواج»"
      text: "سمّى عقابه جهلًا، وهو ليس جهلًا. قال ابن الأَنْبارِيّ: «فنسب الجهل إلى نفسه وهو يريد الإهلاك والمعاقبة، ليزدوج اللفظان، فتكون الثانية على مثل لفظ الأولى وهي تخالفها في المعنى؛ لأن ذلك أخف على اللسان وأخصر من اختلافهما»، واستشهد بقوله تعالى: {فَمَنِ اعْتَدَى عَلَيْكُمْ فَاعْتَدُوا عَلَيْهِ بِمِثْلِ مَا اعْتَدَى عَلَيْكُمْ}، «والثاني ليس اعتداء في الحقيقة، بل هو عدل» [@ibn-al-anbari، ص426]. وقال الزَّوْزَنِيّ: «فسمّي جزاء الجهل جهلًا لازدواج الكلام وحسن تجانس اللفظ» [@zawzani، ص226]. وهذا ما سمّاه البلاغيون بعدهم «المشاكلة»: أن تذكر الشيء بلفظ غيره لوقوعه في صحبته."
    - title: "ليس اعترافًا بالجهل"
      text: "نبّه ابن الأَنْبارِيّ إلى أن الشاعر لا يفخر بالجهل: «ولا يجوز أن يكون قول عَمْرو: فنجهل فوق جهل الجاهلينا اعترافًا منه بالجهل وتثبيتًا منه إياه لنفسه؛ لأن الجهل لا يستحسنه أحد ولا يرتضيه» [@ibn-al-anbari، ص427]."
    - title: "النكرة في سياق النهي"
      text: "قال «أحد» نكرة بعد النهي، فعمّ كل أحد: لا يستثني ملكًا ولا قبيلة. وقد أنشدها بين يدي ملك، هو عَمْرو بن هند [@ibn-al-anbari، ص371]."
    - title: "التكرار"
      text: "كرر مادة الجهل ثلاث مرات: «يجهلن»، «فنجهل»، «جهل الجاهلين». فالبيت كله يدور على كلمة واحدة، كل مرة بمعنى أشد."
  connection: "«وهو البيت آخر القصيدة في رواية أكثر الناس. وروى بعض الرواة فيها بعد البيت الماضي ثلاثة أبيات» [@ibn-al-anbari، ص427]، أولها: «لنا الدنيا وما أمسى عليها»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "أَلَا لَا يَجْ / هَلَنْ أَحَدُنْ / عَلَيْنَا = مفاعلْتن / مفاعلتن / فعولن — فَنَجْهَلَ فَوْ / قَ جَهْلِلْ جَا / هِلِينَا = مفاعلتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. ودخل العَصْب، وهو تسكين الخامس، التفعيلة الأولى من الصدر، والثانية من العَجُز، فصارت «مفاعلْتن» [@atiq، ص54]. والعَرُوض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها القَطْف [@atiq، ص54]."
context: "ختام المعلقة في رواية أكثر الرواة [@ibn-al-anbari، ص427]. ويستشهد به شوقي ضيف على أن كلمة «الجاهلية» ليست من الجهل الذي هو ضد العلم، بل من الجهل بمعنى «السفه والغضب والنزق» [@deif، ج1 ص39]."
