first: "تُرِيكَ إِذَا دَخَلْتَ عَلَى خَلَاءٍ"
second: "وَقَدْ أَمِنَتْ عُيُونَ الْكَاشِحِينَا"
meaning: "حين تدخل عليها في خلوة، لا رقيب معكما، وقد اطمأنت إلى أن عيون الأعداء لا تراها، تكشف لك عن جسدها: والذي تريه يأتي في الأبيات الثلاثة التالية، ذراعاها وثديها ومتناها وردفاها. قال الزَّوْزَنِيّ: «يقول: تريك هذه المرأة إذا أتيتها خالية وأمنت عيون أعدائها» [@zawzani، ص218]. وقال ابن الأَنْبارِيّ في البيت التالي: «قوله (ذراعي عيطل) معناه تريك إذا دخلت على خلاء ذراعي عيطل» [@ibn-al-anbari، ص379]. فهو مشهد خلوة بين عاشقين، تتعرّى فيه المرأة لصاحبها."
vocabulary:
  - term: "خَلَاءٍ"
    text: "الخلوة: «من الخلوة ممدود» [@ibn-al-anbari، ص379]، و«خلاء: خلوة من الرُّقباء» [@tabrizi-ashr، ص221]."
  - term: "أَمِنَتْ"
    text: "اطمأنت ولم تخف."
  - term: "الْكَاشِحِينَا"
    text: "«الأعداء، واحدهم كاشح، وإنما قيل له كاشح لأنه يعرض عنك ويوليك كشحه» [@ibn-al-anbari، ص377]. وقال الزَّوْزَنِيّ: «الكاشح: المضمر العداوة في كشحه» [@zawzani، ص218]. والكشح: الجنب، ما بين الخاصرة والأضلاع."
syntax:
  - "«تريك» مضارع فاعله ضمير الظعينة، ومفعوله الأول الكاف، ومفعوله الثاني لا يأتي إلا في البيت التالي: «و (ذراعي عيطل) نصب بتريك» [@ibn-al-anbari، ص381]."
  - "«إذا» ظرف لما يستقبل متعلق بـ«تريك»، وجملة «دخلت» في محل جر بالإضافة."
  - "«والواو في (وقد) واو الحال» [@ibn-al-anbari، ص379]، أي: وقد أمنت، في حال أمنها. و«عيونَ» مفعول به لـ«أمنت»."
morphology:
  - "«تُرِي» مضارع «أَرَى» الرباعي، من الرؤية، يتعدى إلى مفعولين."
  - "«خَلَاء» مصدر ممدود على «فَعَال»."
  - "«الكاشِحِين» جمع «كاشِح»، اسم فاعل من «كَشَحَ»."
rhetoric:
  thesis: "يبدأ وصف جسد المرأة من مشهد خلوة. ويؤخّر المفعول إلى البيت التالي، فيبقى السامع ينتظر ما تريه، ثم تتوالى صور الجسد في ثلاثة أبيات."
  devices:
    - title: "التضمين"
      text: "لا يتم معنى البيت إلا بما بعده، فمفعول «تريك» في البيت العاشر. والتضمين عند ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها»، ويقول: «وكلما كانت اللفظة المتعلقة بالبيت الثاني بعيدة من القافية كان أسهل عيبًا» [@ibn-rashiq، ج1 ص171]. والمتعلق هنا الفعل «تريك» في أول البيت، فهو بعيد عن القافية."
    - title: "الخطاب في «تُرِيكَ إِذَا دَخَلْتَ»"
      text: "كان يخاطبها، ثم صار يتحدث عنها بضمير الغائبة، ويخاطب «أنت» الذي يدخل عليها، وهو يعني نفسه. فكأنه يجرّد من نفسه شخصًا يشهد المشهد. وهذه قراءتنا."
    - title: "المجاز في «عُيُونَ الْكَاشِحِينَا»"
      text: "ذكر العيون وأراد أصحابها، لأن الخطر في نظرهم. وهذه قراءتنا."
  connection: "ثم يذكر أول ما تريه: ذراعين كذراعي ناقة طويلة العنق بيضاء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "تُرِيكَ إِذَا / دَخَلْتَ عَلَا / خَلَاءِنْ = مفاعلَتن / مفاعلَتن / فعولن — وَقَدْ أَمِنَتْ / عُيُونَلْ كَا / شِحِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "رابع أبيات الظعينة، وأول أبيات وصف جسدها (9–12). وهي من الأبيات الحسية في المعلقة، نشرحها كاملة. وهو عند الزَّوْزَنِيّ البيت الثالث عشر [@zawzani، ص218]."
