first: "بِأَيِّ مَشِيئَةٍ عَمْرَو بْنَ هِنْدٍ"
second: "تُطِيعُ بِنَا الْوُشَاةَ وَتَزْدَرِينَا"
meaning: "بأي إرادة، يا عَمْرو بن هند، تطيع النمّامين فينا وتحتقرنا؟ قال الزَّوْزَنِيّ: «يقول: كيف تشاء أن تطيع الوشاة بنا إليك وتحتقرنا وتقصر بنا؟ أي: أيّ شيء دعاك إلى هذه المشيئة؟ أي لم يظهر منا ضعف يطمع الملك فينا حتى يصغي إلى من يشي بنا إليه ويغريه بنا فيحتقرنا» [@zawzani، ص227]."
vocabulary:
  - term: "الْوُشَاةَ"
    text: "«(الوشاة) : النمامون، واحدهم واش» [@ibn-al-anbari، ص402]."
  - term: "تَزْدَرِينَا"
    text: "«تستخف بنا» [@ibn-al-anbari، ص402]، وقال الزَّوْزَنِيّ: «ازدراه وازدرى به: قصر به واحتقره» [@zawzani، ص227]. وفي «لسان العرب»: «زَرَيْتُ عَلَيْهِ وزَرَى عَلَيْهِ ... عَابَهُ وعاتَبه» [@lisan، ج14 ص356]."
syntax:
  - "قال ابن الأَنْبارِيّ: «والباء صلة تطيع، وتزدرينا نسق على تطيع، وأي معناها الاستفهام» [@ibn-al-anbari، ص402]. أي أن «بنا» متعلق بـ«تطيع»: تطيع الوشاة فينا."
  - "«تزدري» متعدٍّ هنا بنفسه، ونون «نا» مفعوله، والألف للإطلاق. ويرى التِّبْرِيزِيّ في ذلك ضرورة، لأن العرب تقول «زريت على الرجل» و«أزريت به» بحرف جر، «إلا إنه يجوز على قبح في الشعر أن تحذف الحرف وتعديه» [@tabrizi-ashr، ص235]."
morphology:
  - "«وُشَاة» جمع «وَاشٍ» على «فُعَلَة»، وهو جمع يختص بالمعتل الآخر كـ«قاضٍ وقضاة»، كما يقول التِّبْرِيزِيّ [@tabrizi-ashr، ص235]."
  - "«تَزْدَرِي» مضارع «ازْدَرَى» على «افْتَعَلَ» من «زرى»، قُلبت تاء الافتعال دالًا بعد الزاي."
  - "«تُطِيع» مضارع «أَطَاعَ» على «أَفْعَلَ»."
rhetoric:
  thesis: "الإنكار الثاني أشد من الأول: الملك لا يريد إذلالهم فحسب، بل يسمع فيهم كلام النمامين. فالشاعر يتهم الملك بضعف الرأي."
  devices:
    - title: "التكرار في «بِأَيِّ مَشِيئَةٍ عَمْرَو بْنَ هِنْدٍ»"
      text: "الصدر نفسه في البيتين 44 و45، فيتحول السؤال إلى لازمة تتردد. والتكرار هنا قوة لا عجز، لأنه يقرع المخاطب بالسؤال مرتين."
    - title: "الاستفهام الإنكاري"
      text: "«بأي مشيئة ... تطيع بنا الوشاة»: إنكار أن يكون عند الملك سبب لما يفعل، وفيه لوم له على تصديق النمامين."
    - title: "الطباق الخفي بين «تُطِيعُ» و«تَزْدَرِي»"
      text: "يطيع غيرهم ويحتقرهم: يرفع النمامين ويخفض أشراف تَغْلِب. وهذه قراءتنا."
  connection: "ثم يسخر من تهديده: «تهددنا وأوعدنا رويدا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بِأَيْيِ مَشِي / ئَةِنْ عَمْرَبْ / نَ هِنْدِنْ = مفاعلَتن / مفاعَلْتن / فعولن — تُطِيعُ بِنَلْ / وُشَاةَ وَتَزْ / دَرِينَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، فصارت «مفاعَلْتن»."
context: "من أبيات التحدي. ويرويه ابن قُتَيْبة مع البيت التالي في خبر مقتل عَمْرو بن هند: «ففي ذلك يقول عمرو بن كلثوم» [@ibn-qutayba، ج1 ص229]. وقال التِّبْرِيزِيّ إن هذا البيت «لم يروه ابن السكيت» [@tabrizi-ashr، ص235]. وهو عند الزَّوْزَنِيّ البيت الخامس والخمسون [@zawzani، ص227]."
variants:
  - reading: "تُطِيعُ بِنَا الْوُشَاةَ وَتَزْدَهِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ والتِّبْرِيزِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (وتزدهينا) ، أي تستخفنا» [@ibn-al-anbari، ص402]. وقال التِّبْرِيزِيّ: «ويروى (وتزدهينا) وفيه من الضرورة ما في الأول» [@tabrizi-ashr، ص235]."
