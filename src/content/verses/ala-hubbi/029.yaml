first: "نُدَافِعُ عَنْهُمُ الْأَعْدَاءَ قِدْمًا"
second: "وَنَحْمِلُ عَنْهُمُ مَا حَمَّلُونَا"
meaning: "ندافع عن جيراننا الأعداء منذ القديم، ونحمل عنهم ما يحمّلوننا من ديات وأعباء. قال ابن الأَنْبارِيّ: «ومن روى: (ندافع) أراد ندافع عن من يلينا ونحمل ما حمَّلونا من ديات أو دماء» [@ibn-al-anbari، ص394]. وقال التِّبْرِيزِيّ: «و (حملونا) أي ما جنوا علينا من حمالة أو غيرها» [@tabrizi-ashr، ص229]، والحَمالة: الدية يتحملها الرجل عن غيره."
vocabulary:
  - term: "نُدَافِعُ"
    text: "نردّ ونحمي."
  - term: "قِدْمًا"
    text: "«قِدما: أي قديما» [@tabrizi-ashr، ص229]، أي منذ زمن بعيد."
  - term: "حَمَّلُونَا"
    text: "ما ألقوه علينا من أعباء: الديات والدماء، كما فسّر ابن الأَنْبارِيّ."
syntax:
  - "قال ابن الأَنْبارِيّ: «وقدما نصب بندافع، وما نصب بنحمل، وحملونا صلة ما، والهاء المضمرة تعود على ما» [@ibn-al-anbari، ص394]، أي: ما حمّلوناه."
  - "الضمير في «عنهم» يعود على «مَن يلينا» في البيت السابق."
  - "«الأعداءَ» مفعول به لـ«ندافع»."
morphology:
  - "«نُدَافِع» مضارع «دَافَعَ» على «فَاعَلَ»."
  - "«حَمَّلُوا» على «فَعَّلُوا»، والتضعيف يعدّي الفعل إلى مفعولين: حمّلونا الأعباء."
  - "«قِدْم» على «فِعْل»."
rhetoric:
  thesis: "واجبان للسيادة: الدفاع بالسلاح، وتحمّل الأعباء بالمال. فالشرف عندهم حماية ومغارم، لا تسلّط."
  devices:
    - title: "الموازنة بين الشطرين"
      text: "«ندافع عنهم» في الصدر، و«نحمل عنهم» في العجز: فعلان مضارعان بعدهما «عنهم»، فيتوازن البيت، ويقابل الحماية بالسلاح الحماية بالمال. وهذه قراءتنا."
    - title: "الجناس الاشتقاقي في «نَحْمِلُ ... حَمَّلُونَا»"
      text: "الفعلان من جذر واحد: ما يحمّلوننا نحمله. فاللفظ يقول إن الجزاء على قدر الطلب."
    - title: "الظرف «قِدْمًا»"
      text: "كلمة واحدة تجعل الفعل عادة قديمة لا فعلة واحدة، فالفخر بتاريخ لا بيوم."
  connection: "ثم يصف طريقتهم في القتال: الطعن للبعيد والضرب للقريب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "نُدَافِعُ عَنْ / هُمُلْ أَعْدَا / ءَ قِدْمَنْ = مفاعلَتن / مفاعَلْتن / فعولن — وَنَحْمِلُ عَنْ / هُمُو مَا حَمْ / مَلُونَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن». وأُشبعت ضمة الميم في «عَنْهُمُ» في العَجُز فصارت «عَنْهُمُو» ليستقيم الوزن."
context: "من أبيات المجد والحرب. والزَّوْزَنِيّ يرويه برواية أخرى، ويضعه البيت الرابع والثلاثين [@zawzani، ص223]."
variants:
  - reading: "نَعُمُّ أُنَاسَنَا وَنَعِفُّ عَنْهُمْ / وَنَحْمِلُ عَنْهُمُ مَا حَمَّلُونَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي نص الزَّوْزَنِيّ"
    note: "قال ابن الأَنْبارِيّ: «معناه نعمهم بالخير ونعف لا نسألهم شيئا» [@ibn-al-anbari، ص394]. وقال الزَّوْزَنِيّ: «يقول: نَعُمّ عشائرنا بنوالنا وسيبنا، ونعفّ عن أموالهم ونحمل عنهم ما حملونا من أثقال حقوقهم ومؤنتهم» [@zawzani، ص223]."
