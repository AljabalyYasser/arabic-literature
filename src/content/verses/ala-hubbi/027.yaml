first: "وَرِثْنَا الْمَجْدَ قَدْ عَلِمَتْ مَعَدٌّ"
second: "نُطَاعِنُ دُونَهُ حَتَّى يَبِينَا"
meaning: "ورثنا الشرف عن آبائنا، وقد علمت قبائل مَعَدّ ذلك، ونحن نطاعن بالرماح دونه حتى يظهر لنا ظهورًا لا ينازعنا فيه أحد. قال الزَّوْزَنِيّ: «يقول: ورثنا شرف آبائنا قد علمت ذلك معد، نطاعن الأعداء دون شرفنا حتى يظهر الشرف لنا» [@zawzani، ص224]."
vocabulary:
  - term: "الْمَجْدَ"
    text: "«(المجد) : الشرف والرفعة» [@ibn-al-anbari، ص393]."
  - term: "مَعَدٌّ"
    text: "مَعَدّ بن عَدْنان، جدّ القبائل العدنانية، ومنه نسب تَغْلِب كما يسوقه ابن الأَنْبارِيّ: «بن ربيعة بن نزار بن معد بن عدنان» [@ibn-al-anbari، ص369]. والمراد هنا قبائله كلها."
  - term: "نُطَاعِنُ دُونَهُ"
    text: "نطعن الأعداء بالرماح دفاعًا عنه."
  - term: "يَبِينَا"
    text: "«معناه حتى يظهر ويستبين» [@ibn-al-anbari، ص393]. وقال أبو جعفر: «الرواية (حتى يَبينا) بفتح الياء، أي ينقطع منهم ويصير إلينا» [@ibn-al-anbari، ص393]، فهو عنده من البَيْن: الانفصال."
syntax:
  - "«قد علمت معدٌّ» جملة معترضة بين الفعل «ورثنا» والجملة التي بعده."
  - "قال ابن الأَنْبارِيّ: «ونطاعن موضعه نصب في التأويل على الحال. تقديره: ورثنا المجد مطاعنين دونه نحن. ويجوز أن يكون خبرا مستأنفا والعلم معترض لا اسم له ولا خبر» [@ibn-al-anbari، ص393]."
  - "«حتى يبينا»: «حتى» حرف غاية، و«يبين» منصوب بـ«أن» مضمرة بعدها، والألف للإطلاق."
morphology:
  - "«وَرِثَ» على «فَعِلَ»، مثال واوي، مضارعه «يَرِث»."
  - "«نُطَاعِن» مضارع «طَاعَنَ» على «فَاعَلَ» للمشاركة: نطعنهم ويطعنوننا."
  - "«يَبِين» مضارع «بَانَ يَبِينُ»، أجوف يائي."
rhetoric:
  thesis: "الشرف عند الشاعر ميراث، لكنه ميراث يحتاج إلى حراسة بالرماح. فالآباء أعطوا، والأبناء يدافعون، وبهذا يبدأ قسم الفخر الطويل."
  devices:
    - title: "الاعتراض في «قَدْ عَلِمَتْ مَعَدٌّ»"
      text: "قطع الكلام ليستشهد بالعرب كلهم: ليس هذا قولنا وحدنا، بل تعرفه مَعَدّ. فالاعتراض شهادة في وسط الدعوى. وهذه قراءتنا."
    - title: "الكناية في «نُطَاعِنُ دُونَهُ»"
      text: "المجد شيء معنوي لا يُطاعَن دونه، فجعله كالحمى أو الحريم الذي يُحمى بالرماح. والكناية عن حمايته بالقتال."
    - title: "تعدد الوجوه في «حَتَّى يَبِينَا»"
      text: "الكلمة تحتمل الظهور والانفصال، وفي روايتها أوجه أخرى، فالقافية تجمع أكثر من معنى. وهذه قراءتنا."
  connection: "ثم يذكر صورة من هذا المجد: إذا هربت القبائل منعنا من يجاورنا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَرِثْنَلْ مَجْ / دَ قَدْ عَلِمَتْ / مَعَدْدُنْ = مفاعَلْتن / مفاعلَتن / فعولن — نُطَاعِنُ دُو / نَهُو حَتْتَا / يَبِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب. وهو عند الزَّوْزَنِيّ البيت الأربعون [@zawzani، ص224]."
variants:
  - reading: "نُطَاعِنُ دُونَهُ حَتَّى يُبِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ"
    note: "قال: «ورواه بعض الناس: (حتى يُبينا) بضم الياء، وقال: يقال أبان الشيء، إذا ظهر وتبين» [@ibn-al-anbari، ص393]."
  - reading: "نُطَاعِنُ دُونَهُ حَتَّى نُبِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ والتِّبْرِيزِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (حتى نُبينا) بضم النون، أي حتى نبين مجدنا وفضلنا» [@ibn-al-anbari، ص393]."
  - reading: "نُطَاعِنُ دُونَهُ حَتَّى يَلِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ"
    note: "قال: «ويروى: (حتى يلينا) : حتى ينقاد لنا» [@ibn-al-anbari، ص393]."
