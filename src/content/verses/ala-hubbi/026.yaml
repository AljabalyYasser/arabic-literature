first: "وَإِنَّ الضِّغْنَ بَعْدَ الضِّغْنِ يَبْدُو"
second: "عَلَيْكَ وَيُخْرِجُ الدَّاءَ الدَّفِينَا"
meaning: "الحقد إذا تراكم بعضه فوق بعض ظهر عليك، وأخرج الداء المستور في القلوب، فيصير عداوة معلنة وطلبًا للثأر. قال ابن الأَنْبارِيّ: «قوله (ويخرج الداء الدفين) معناه المستتر في القلب» [@ibn-al-anbari، ص392]. وقال الزَّوْزَنِيّ: «ويخرج الداء المدفون من الأفئدة أي يبعث على الانتقام» [@zawzani، ص224]. وقال التِّبْرِيزِيّ: «والضغن: الحقد الذي يخفى ولا يظهر إلا بالدلائل، والداء: يعني به الحقد» [@tabrizi-ashr، ص228]."
vocabulary:
  - term: "الضِّغْنَ"
    text: "«الحقد» [@ibn-al-anbari، ص392]، وفي «لسان العرب»: «الضِّغْنُ والضَّغَنُ: الحِقْد» [@lisan، ج13 ص255]. ويعدّ ابن الأَنْبارِيّ له أسماء كثيرة: «يقال: في قلبي عليه ضغن، وحقد، وتبل، وترة، ووغر، ووغم، وغمر» [@ibn-al-anbari، ص392]."
  - term: "يَبْدُو"
    text: "يظهر."
  - term: "الدَّاءَ الدَّفِينَا"
    text: "المرض المدفون، أي الحقد المستتر في القلب، «والأصل في الدفين المدفون، فصرف عن مفعول إلى فعيل» [@ibn-al-anbari، ص392]."
syntax:
  - "قال ابن الأَنْبارِيّ: «والضغن اسم إن، ويبدو الخبر» [@ibn-al-anbari، ص392]."
  - "«بعدَ الضغن» ظرف متعلق بمحذوف حال من «الضغن»: الضغن متراكمًا بعد الضغن. و«عليك» متعلق بـ«يبدو»."
  - "«ويُخرجُ» معطوف على «يبدو»، وفاعله ضمير الضغن، و«الداءَ» مفعول به، و«الدفينا» نعت له، والألف للإطلاق."
morphology:
  - "«ضِغْن» على «فِعْل»، وجمعه «أَضْغَان»."
  - "«يَبْدُو» مضارع «بَدَا» الناقص الواوي."
  - "«دَفِين» على «فَعِيل» بمعنى «مَفْعُول»."
rhetoric:
  thesis: "بيت حكمة في وسط الفخر: الأحقاد إذا تراكمت لا تبقى مخفية. ويُفهم منه تحذير لمن يخاطبه، ملكًا كان أو خصمًا: ما تخفيه من عداوة سيظهر، وما في صدورنا كذلك."
  devices:
    - title: "الاستعارة في «الدَّاءَ الدَّفِينَا»"
      text: "جعل الحقد مرضًا، ثم جعل المرض مدفونًا كما يُدفن الشيء في الأرض، فاجتمعت في عبارة واحدة صورتان: المرض والدفن. وهي استعارة بالمعنى الذي يحدّه عبد القاهر الجُرْجانيّ: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "التكرار في «الضِّغْنَ بَعْدَ الضِّغْنِ»"
      text: "تكرار الكلمة يصوّر التراكم: حقد فوق حقد، حتى يفيض. وهذه قراءتنا."
    - title: "الحكمة"
      text: "البيت يصلح أن يُقال في كل عداوة، ولذلك يقف وحده كالمثل في وسط القصيدة."
  connection: "ثم يبدأ الفخر بالميراث: «ورثنا المجد قد علمت معد»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَإِنْنَضْ ضِغْ / نَ بَعْدَضْ ضِغْ / نِ يَبْدُو = مفاعَلْتن / مفاعَلْتن / فعولن — عَلَيْكَ وَيُخْ / رِجُدْ دَاءَدْ / دَفِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "أول أبيات المجد والحرب (26–43). ويضعه الزَّوْزَنِيّ في موضع آخر، البيت التاسع والثلاثين بعد «نشق بها رؤوس القوم» [@zawzani، ص224]، فيكون عنده حكمة بعد وصف القتال."
variants:
  - reading: "وَإِنَّ الضِّغْنَ بَعْدَ الضِّغْنِ يَفْشُو"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي نص التِّبْرِيزِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (يفشو)» [@ibn-al-anbari، ص392]، أي ينتشر. والتِّبْرِيزِيّ يرويه «يفشو» ويقول: «ويروى (يبدو)» [@tabrizi-ashr، ص228]."
