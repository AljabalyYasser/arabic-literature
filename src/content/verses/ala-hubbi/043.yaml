first: "بِرَأْسٍ مِنْ بَنِي جُشَمَ بْنِ بَكْرٍ"
second: "نَدُقُّ بِهِ السُّهُولَةَ وَالْحُزُونَا"
meaning: "نغير برأس من بني جُشَم بن بَكْر، أي بسيد منهم أو بجيش منهم، نسحق به السهل والوعر، فلا يمتنع علينا شيء. قال الزَّوْزَنِيّ: «الرأس: الرئيس والسيد. يقول: نغير عليهم مع سيد من هؤلاء القوم ندق به السهل والْحَزْن، أي نهزم الضعاف والأشداء» [@zawzani، ص226]. وقال أبو جعفر: «معناه ندق به كل صعب، لا نبقي شيئا ولا أحدا إلا أغرنا عليه. قال: والرأس هاهنا: جيش» [@ibn-al-anbari، ص401]."
vocabulary:
  - term: "رَأْسٍ"
    text: "«(الرأس) : السيد. والرأس هاهنا: الحي. ويقال: حي رأس، إذا كان مستغنيا أن يجلبه أحد، أي يعينه» [@ibn-al-anbari، ص401]، وعند أبي جعفر: الجيش."
  - term: "جُشَمَ بْنِ بَكْرٍ"
    text: "رهط الشاعر من تَغْلِب، وفي نسبه عند ابن الأَنْبارِيّ: «بن زهير بن جشم بن بكر بن حبيب بن عمرو بن غنم بن تغلب» [@ibn-al-anbari، ص369]."
  - term: "السُّهُولَةَ"
    text: "«ما لان من الأرض» [@ibn-al-anbari، ص401]."
  - term: "الْحُزُونَا"
    text: "«جمع حزن. والحزن: ما غلظ من الأرض» [@ibn-al-anbari، ص401]."
syntax:
  - "قال ابن الأَنْبارِيّ: «والباء صلة فعل مضمر معناه نجيء برأس ونغير برأس، وندق خبر مستأنف. ويجوز أن يكون نعتا للرأس في التأويل، والهاء تعود على الرأس» [@ibn-al-anbari، ص401]."
  - "«جُشَمَ» مجرور بالفتحة لأنه ممنوع من الصرف، و«بنِ» نعت له، و«بكرٍ» مضاف إليه."
morphology:
  - "«السُّهُولة» مصدر «سَهُلَ» على «فُعُولَة»، استُعمل اسمًا للأرض السهلة."
  - "«حُزُون» جمع «حَزْن» على «فُعُول»."
  - "«جُشَم» علم على «فُعَل»، قال التِّبْرِيزِيّ: «وجشم فعل من (جشمت الأمر) إذا تكلفته» [@tabrizi-ashr، ص234]."
rhetoric:
  thesis: "بعد أن تحدث عن تَغْلِب كلها يسمّي رهطه: بني جُشَم بن بَكْر. فالفخر القبلي ينتهي إلى البيت الذي خرج منه الشاعر."
  devices:
    - title: "الطباق بين «السُّهُولَةَ» و«الْحُزُونَا»"
      text: "السهل والوعر معًا: الأرض كلها، وبالكناية الناس كلهم، ضعيفهم وقويهم، كما فسّر الزَّوْزَنِيّ. والمطابقة عند ابن رَشِيق: «جمعك بين الضدين في الكلام أو بيت الشعر» [@ibn-rashiq، ج2 ص5]."
    - title: "الكناية في «نَدُقُّ بِهِ السُّهُولَةَ وَالْحُزُونَا»"
      text: "دقّ الأرض كناية عن الغلبة على كل من فيها. والكناية عند عبد القاهر الجُرْجانيّ أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "المجاز في «بِرَأْسٍ»"
      text: "سمّى السيد أو الجيش رأسًا، لأن الرأس مقدّم الجسد وأشرفه. وهذه قراءتنا."
  connection: "ثم يلتفت إلى الملك متحديًا: «بأي مشيئة عمرو بن هند»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بِرَأْسِنْ مِنْ / بَنِي جُشَمَبْ / نِ بَكْرِنْ = مفاعَلْتن / مفاعلَتن / فعولن — نَدُقْقُ بِهِسْ / سُهُولَةَ وَالْ / حُزُونَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، فصارت «مفاعَلْتن»."
context: "آخر أبيات المجد والحرب (26–43). وبعده عند الزَّوْزَنِيّ بيت ليس عند ابن الأَنْبارِيّ: «أَلَا لَا يَعْلَمُ الْأَقْوَامُ أَنَّا / تَضَعْضَعْنَا وَأَنَّا قَدْ وَنِينَا»، ثم «ألا لا يجهلن أحد علينا» [@zawzani، ص226]، وهو عندنا البيت 91."
