first: "فَهَلْ حُدِّثْتَ فِي جُشَمَ بْنِ بَكْرٍ"
second: "بِنَقْصٍ فِي خُطُوبِ الْأَوَّلِينَا"
meaning: "هل أُخبرتَ يا عَمْرو بن هند أن قومي بني جُشَم بن بكر أصابهم نقص فيما مضى من الدهر؟ قال ابن الأَنْبارِيّ: «وإنما يخاطب عمرو بن هند. معناه هل حدثت أن أحدا اضطهدنا في قديم الدهر» [@ibn-al-anbari، ص405]. وقال الزَّوْزَنِيّ: «هل أخبرت بنقص كان من هؤلاء في أمور القرون الماضية أو بنقض عهد سلف» [@zawzani، ص228]."
vocabulary:
  - term: "حُدِّثْتَ"
    text: "أُخبرت."
  - term: "جُشَمَ بْنِ بَكْرٍ"
    text: "البطن الذي ينتمي إليه الشاعر من تَغْلِب. ونسبه عند البَغْداديّ: «عَمْرو بن كُلْثُوم بن عتاب بن مَالك بن ربيعَة بن زُهَيْر بن جشم بن بكر بن حبيب بن عَمْرو بن غنم بن تغلب بن وَائِل» [@khizana، ج8 ص262]. وجُشَم عند التِّبْرِيزِيّ «فعل من (جشمت الأمر) إذا تكلفته» [@tabrizi-ashr، ص234]."
  - term: "نَقْصٍ"
    text: "«من النقصان» [@ibn-al-anbari، ص405]."
  - term: "خُطُوبِ"
    text: "«الأمور، واحدها خطب» [@ibn-al-anbari، ص405]. وفي اللسان: «الخَطْبُ: الشَّأْنُ أَو الأَمْرُ، صَغُر أَو عَظُم» [@lisan، ج1 ص360]."
  - term: "الْأَوَّلِينَا"
    text: "من مضى من الآباء والقرون."
syntax:
  - "الفاء في «فَهَلْ» استئنافية، و«هل» حرف استفهام. و«حُدِّثْتَ» ماضٍ مبني للمجهول، والتاء نائب فاعل."
  - "«وفي الأولى صلة حدثت، والثانية صلة نقص» [@ibn-al-anbari، ص405]: أي أن «فِي جُشَمَ» متعلق بـ«حُدِّثْتَ»، و«فِي خُطُوبِ» متعلق بـ«نَقْصٍ». والصلة في اصطلاح ابن الأَنْبارِيّ الكوفي هي ما يسميه البصريون التعلّق."
  - "«جُشَمَ» مجرور بالفتحة نيابة عن الكسرة، لأنه ممنوع من الصرف للعلمية والعدل، كـ«عُمَر». و«بْنِ» نعت له، و«بَكْرٍ» مضاف إليه. و«بِنَقْصٍ» متعلق بـ«حُدِّثْتَ»، يقال: حُدِّث بكذا."
morphology:
  - "«حُدِّثَ» ماضي «حَدَّثَ» على «فَعَّلَ»، مبنيًّا للمجهول."
  - "«خُطُوب» جمع «خَطْب» على «فُعُول». واستشهد ابن الأَنْبارِيّ بقوله تعالى: {قَالَ فَمَا خَطْبُكَ}، «معناه ما أمرك» [@ibn-al-anbari، ص405]."
  - "«الْأَوَّلِين» جمع «أَوَّل» جمع مذكر سالم، مجرور بالياء."
rhetoric:
  thesis: "بعد المثل يأتي التحدي الصريح: يسأل الملك سؤالًا يعرف جوابه، ثم يعدّد آباءه في الأبيات التالية جوابًا عنه."
  devices:
    - title: "الاستفهام الإنكاري في «فَهَلْ حُدِّثْتَ»"
      text: "الاستفهام الإنكاري سؤال لا يطلب جوابًا، بل ينفي في صورة السؤال. فالمعنى: لم يُحدَّث أحد بذلك لأنه لم يكن. وهذه قراءتنا، ويوافقها شرح ابن الأَنْبارِيّ: «هل حدثت أن أحدا اضطهدنا في قديم الدهر» [@ibn-al-anbari، ص405]."
    - title: "تسمية البطن الأدنى في «جُشَمَ بْنِ بَكْرٍ»"
      text: "لا يقول «تَغْلِب» بل يذكر بطنه الأقرب، فيفخر بأهله الأدنين، وهم الذين يعدّد رجالهم بعده: عَلْقَمة ومُهَلْهِل وزُهَيْر وعَتّاب وكُلْثُوم."
    - title: "الإيجاز في «خُطُوبِ الْأَوَّلِينَا»"
      text: "الإيجاز أداء المعنى الكثير بلفظ قليل. وهنا كلمتان تجمعان تاريخ القبيلة كله: ما مرّ بها من الأحداث منذ أول آبائها."
  connection: "ثم يجيب عن سؤاله بنفسه: ورثنا مجد عَلْقَمة بن سيف."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "فَهَلْ حُدْدِثْ / تَ فِي جُشَمَبْ / نِ بَكْرِنْ = مفاعلْتن / مفاعلتن / فعولن — بِنَقْصِنْ فِي / خُطُوبِلْ أَوْ / وَلِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الصدر، والأولى والثانية من العَجُز. وسقطت همزة «ابن» لأنه بين علمين، فاتصلت باؤه الساكنة بما قبلها: «جُشَمَبْ»."
context: "يفتتح تعداد الآباء (50–55): سؤال للملك، ثم الجواب في خمسة أبيات بأسماء الأجداد. وهو جواب عن تهديد عَمْرو بن هند في البيت 46: قوم لم يُعرف عنهم نقص قط لا يكونون خدمًا لأمّه."
