first: "أَلَمَّا تَعْرِفُوا مِنَّا وَمِنْكُمْ"
second: "كَتَائِبَ يَطَّعِنَّ وَيَرْتَمِينَا"
meaning: "ألم تعرفوا كتائب منّا ومنكم يطعن بعضها بعضًا بالرماح ويرمي بعضها بعضًا بالنبل؟ قال الزَّوْزَنِيّ: «ألم تعلموا كتائب منا ومنكم يطعن بعضهم بعضًا، ويرمي بعضهم بعضًا؟» [@zawzani، ص230]. ونقل ابن الأَنْبارِيّ عن أبي جَعْفَر في معنى السؤال: «ألم تعرفونا فيما مضى وتعلموا أنَّا نقتل من لقينا» [@ibn-al-anbari، ص414]."
vocabulary:
  - term: "كَتَائِبَ"
    text: "«الجماعات، واحدتها كتيبة، وإنما سميت الكتيبة كتيبة لاجتماع بعضها إلى بعض» [@ibn-al-anbari، ص413]."
  - term: "يَطَّعِنَّ"
    text: "يتطاعنّ بالرماح، من الطعن [@ibn-al-anbari، ص414]."
  - term: "يَرْتَمِينَا"
    text: "يترامين، «ويرتمين من الرمي بالنبل» [@ibn-al-anbari، ص414]. قال الزَّوْزَنِيّ: «الاطِّعان والارتماء: مثل التطاعن والترامي» [@zawzani، ص230]."
syntax:
  - "«كَتَائِبَ» مفعول به لـ«تَعْرِفُوا» ممنوع من الصرف لأنه على صيغة منتهى الجموع، و«مِنَّا وَمِنْكُمْ» متعلقان بمحذوف نعت للكتائب تقدّم عليها فصار حالًا."
  - "«ويطعن صلة الكتائب» [@ibn-al-anbari، ص414]، أي أن جملة «يَطَّعِنَّ» نعت لها، والصلة في اصطلاحه هنا الصفة. و«يَرْتَمِينَا» معطوف عليه، والألف للإطلاق."
  - "قال الزَّوْزَنِيّ: «وما في قول: أَلَمّا صلة زائدة» [@zawzani، ص230]، أي أنه يرى «لمّا» هنا «لم» زيدت عليها «ما»."
morphology:
  - "«يَطَّعِنَّ» على «يَفْتَعِلْنَ» من الطعن: «والأصل فيه يطتعن فأبدلوا من التاء طاء وأدغموها في الطاء التي بعدها» [@ibn-al-anbari، ص414]."
  - "«يَرْتَمِين» على «يَفْتَعِلْن» من «رَمَى». قال البَغْداديّ: «ويطعن: يفتعلن من الطعْن وَكَذَلِكَ يرتمينا: يفتعلن من الرَّمْي وَالْألف للإطلاق» [@khizana، ج9 ص11]. والافتعال هنا للمشاركة، كالتفاعل."
  - "«كَتِيبَة» من «كَتَبَ» بمعنى جمع، ومنه الكتابة: «وإنما سمي الكاتب كاتبا لأنه يضم بعض الحروف إلى بعض» [@ibn-al-anbari، ص413]."
rhetoric:
  thesis: "يذكّر بني بكر بما بين القبيلتين من حروب، وهو تهديد مبطّن: من عرف تلك الكتائب لا يتعرّض لتَغْلِب."
  devices:
    - title: "التكرار في «أَلَمَّا تَعْرِفُوا»"
      text: "يكرر عجز البيت السابق في صدر هذا البيت، فيتصل البيتان ويشتد الإلحاح في السؤال."
    - title: "الإبهام في «مِنَّا وَمِنْكُمْ»"
      text: "لم يقل من غلب، بل جمع كتائب الفريقين في مشهد واحد، وترك الحكم لما يعرفه المخاطبون. والمقصود ما كان بينهم من حرب البَسُوس. وهذه قراءتنا."
    - title: "صيغة المشاركة في «يَطَّعِنَّ وَيَرْتَمِينَا»"
      text: "صيغة «افتعل» هنا بمعنى التفاعل، فالفعل متبادل: كل كتيبة تطعن وتُطعن، وترمي وتُرمى. فالمشهد قتال متكافئ قريب (الطعن) وبعيد (الرمي)."
  connection: "ثم ينتقل إلى وصف سلاح قومه: البيض واليلب والسيوف."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "أَلَمْمَا تَعْ / رِفُو مِنْنَا / وَمِنْكُمْ = مفاعلْتن / مفاعلْتن / فعولن — كَتَائِبَ يَطْ / طَعِنْنَ وَيَرْ / تَمِينَا = مفاعلتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر، وجاء العَجُز على الأصل."
context: "ختام خطاب بني بكر (65–66). وينشده البَغْداديّ بعد البيت السابق في الشاهد نفسه [@khizana، ج9 ص10–11]."
