first: "وَنَحْنُ الْحَاكِمُونَ إِذَا أُطِعْنَا"
second: "وَنَحْنُ الْعَازِمُونَ إِذَا عُصِينَا"
meaning: "نحن نمنع من أطاعنا ونحميه، ونمضي عزمنا على من عصانا. قال التِّبْرِيزِيّ: «والحاكمون: المانعون، والمعنى: إنا نمنع ممن أطاعنا ونعزم أي نثبت على قتال من عصانا» [@tabrizi-ashr، ص241]. وقال ابن الأَنْبارِيّ في «العازمون»: «معناه: إذا عزمنا على الأمر أنفذنا عزيمتنا ولم نهب أحدا» [@ibn-al-anbari، ص411]."
vocabulary:
  - term: "الْحَاكِمُونَ"
    text: "المانعون الرادّون. فسّره ابن الأَنْبارِيّ بالذين يردّون الناس عمّا لا ينبغي لهم، ونقل عن ابن الأعرابي: «يقال قد أحكمت الرجل، إذا رددته عن رأيه»، وقال: «إنما سميت حكمة الفرس حكمة لأنها ترد من غربه، أي من حده» [@ibn-al-anbari، ص410]، أي من حدّته وجماحه."
  - term: "الْعَازِمُونَ"
    text: "الماضون في عزمهم، كما مرّ في المعنى [@ibn-al-anbari، ص411]."
  - term: "أُطِعْنَا"
    text: "أطاعنا غيرنا."
  - term: "عُصِينَا"
    text: "عصانا غيرنا."
syntax:
  - "«نَحْنُ» مبتدأ و«الْحَاكِمُونَ» خبره، ومثله الشطر الثاني."
  - "«وإذا وقت منتصبة بالفعل» [@ibn-al-anbari، ص411]: أي أن «إِذَا» ظرف زمان منصوب، والعامل فيه ما في «الحاكمون» و«العازمون» من معنى الفعل. وجواب الشرط محذوف دلّ عليه ما قبله."
  - "«أُطِعْنَا» و«عُصِينَا» ماضيان مبنيان للمجهول، و«نا» فيهما نائب فاعل."
morphology:
  - "«حَكَمَة الفرس» من أصل المادة، «وهي الحديدة المستديرة في اللجام على حنك الفرس» [@ibn-al-anbari، ص411]، فالحكم في الأصل المنع والردّ."
  - "«أُطِعْنَا» من «أَطَاعَ» الرباعي الأجوف، حُذفت عينه لالتقاء الساكنين. و«عُصِينَا» من «عَصَى» الناقص، قُلبت ألفه ياء في المبني للمجهول."
  - "«الْحَاكِمُون» و«الْعَازِمُون» جمعا مذكر سالمان لاسمي الفاعل «حاكم» و«عازم»."
rhetoric:
  thesis: "للسلطان وجهان: حماية لمن أطاع، وقوة لا تتراجع أمام من عصى."
  devices:
    - title: "المقابلة بين الشطرين"
      text: "المقابلة أن يُؤتى بمعنيين ثم بما يقابلهما على الترتيب. فقابل «أُطِعْنَا» بـ«عُصِينَا»، وقابل جزاء الطاعة بجزاء المعصية، وبنى الشطرين على لفظ واحد: «ونحن ... إذا ...»."
    - title: "التكرار في «وَنَحْنُ»"
      text: "تتوالى «ونحن» في صدور الأبيات 58–61، وتتكرر في شطري هذا البيت، فيصير الضمير نفسه عنوانًا للفخر."
    - title: "بناء الفعل للمجهول في «أُطِعْنَا» و«عُصِينَا»"
      text: "لم يذكر من يطيع ومن يعصي، فالحكم يعمّ الناس كلهم: كل مطيع محميّ، وكل عاصٍ مقصود."
  connection: "ثم يبني البيت التالي على النسق نفسه: «ونحن التاركون لما سخطنا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَنَحْنُلْ حَا / كِمُونَ إِذَا / أُطِعْنَا = مفاعلْتن / مفاعلتن / فعولن — وَنَحْنُلْ عَا / زِمُونَ إِذَا / عُصِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين، فتشابه الشطران وزنًا كما تشابها لفظًا."
context: "من أبيات «ونحن» (57–61). ويتنقّل البيت بين مواضع في روايات القصيدة: فقد رواه أبو جَعْفَر في موضع البيت 74 بلفظ «بأنَّا العاصمون إذا أُطعنا» [@ibn-al-anbari، ص419]، وجاء عند الزَّوْزَنِيّ بعد أبيات «وقد علم القبائل» [@zawzani، ص234]. ولا شرح للزَّوْزَنِيّ عليه في موضعه [@zawzani، ص230]."
variants:
  - reading: "وَنَحْنُ الْعَاصِمُونَ إِذَا أُطِعْنَا"
    status: "رواية أخرى"
    note: "«ويروى (ونحن العاصمون إذا أُطعنا)» [@tabrizi-ashr، ص241]."
  - reading: "وَأَنَّا الْعَاصِمُونَ إِذَا أُطِعْنَا ... وَأَنَّا الْعَازِمُونَ إِذَا عُصِينَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "وشرحها: «وأنا نعصم ونمنع جيراننا إذا أطاعونا ونعزم عليهم بالعدوان إذا عصونا» [@zawzani، ص234]."
