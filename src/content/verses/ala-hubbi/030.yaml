first: "نُطَاعِنُ مَا تَرَاخَى النَّاسُ عَنَّا"
second: "وَنَضْرِبُ بِالسُّيُوفِ إِذَا غُشِينَا"
meaning: "نطاعن الأعداء بالرماح ما داموا بعيدين عنا، فإذا اقتربوا منا وغشونا ضربناهم بالسيوف. قال الزَّوْزَنِيّ: «يقول: نطاعن الأبطال ما تباعدوا عنا، أي وقت تباعدهم عنا، ونضربهم بالسيوف إذا أُتينا، أي أتونا، فقربوا منا» [@zawzani، ص223]. وقارنه أبو جعفر ببيت لزُهَيْر في وصف بطل يتدرج في القتال، فشرحه: «أي يكون قريبا منهم، فإذا رموا طاعن، فإذا طاعنوا ضارب، وإذا ضاربوا اعتنق» [@ibn-al-anbari، ص395]."
vocabulary:
  - term: "تَرَاخَى"
    text: "«معناه تباعد. يقال: تراخت داره، إذا بعدت» [@ibn-al-anbari، ص395]."
  - term: "غُشِينَا"
    text: "أُتينا وقرب منا العدو، قال الزَّوْزَنِيّ: «الغشيان: الإتيان» [@zawzani، ص223]."
syntax:
  - "قال ابن الأَنْبارِيّ: «وما نصب بنطاعن، وتراخى الناس عنا صلة ما ولا عائد لما؛ لأنها في مذهب المصدر وأصلها الجزاء» [@ibn-al-anbari، ص395]. أي أن «ما» مصدرية ظرفية: نطاعن مدة تراخيهم."
  - "«إذا» ظرف شرط، و«غُشينا» فعل مبني للمجهول، وجواب الشرط محذوف دل عليه «ونضرب»."
  - "«بالسيوف» متعلق بـ«نضرب»."
morphology:
  - "«تَرَاخَى» على «تَفَاعَلَ» من «رخو»."
  - "«غُشِيَ» ماضي «غَشِيَ» مبنيًّا للمجهول، و«غُشِينا» مسند إلى «نا»."
  - "«نُطَاعِن» على «نُفَاعِل» للمشاركة."
rhetoric:
  thesis: "البيت درس في القتال: لكل مسافة سلاحها. فالفخر هنا فخر الخبرة، لا فخر الشجاعة وحدها."
  devices:
    - title: "الطباق بين «تَرَاخَى» و«غُشِينَا»"
      text: "البعد والقرب في بيت واحد، ومعهما الطعن والضرب. والمطابقة عند ابن رَشِيق: «جمعك بين الضدين في الكلام أو بيت الشعر» [@ibn-rashiq، ج2 ص5]."
    - title: "التقسيم"
      text: "قسم القتال حالين: حال البعد وحال القرب، وجعل لكل حال فعلها، فلم يترك حالًا ثالثة. وهذه قراءتنا."
    - title: "المضارع المستمر"
      text: "«نطاعن» و«نضرب» مضارعان يصفان عادة دائمة، لا معركة واحدة."
  connection: "ثم يصف السلاحين: الرماح السمر والسيوف البيض."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "نُطَاعِنُ مَا / تَرَاخَنْ نَا / سُ عَنْنَا = مفاعلَتن / مفاعَلْتن / فعولن — وَنَضْرِبُ بِسْ / سُيُوفِ إِذَا / غُشِينَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب. وهو عند الزَّوْزَنِيّ البيت الخامس والثلاثون [@zawzani، ص223]."
variants:
  - reading: "نُطَاعِنُ مَا تَرَاخَى الصَّفُّ عَنَّا"
    status: "رواية يذكرها ابن الأَنْبارِيّ والتِّبْرِيزِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (ما تراخى الصف عنا)» [@ibn-al-anbari، ص395]، أي صف الأعداء."
