first: "فَصَالُوا صَوْلَةً فِيمَنْ يَلِيهِمْ"
second: "وَصُلْنَا صَوْلَةً فِيمَنْ يَلِينَا"
meaning: "فحمل إخواننا حملة على من يليهم من العدو، وحملنا حملة على من يلينا. قال ابن الأَنْبارِيّ: «فصالوا صولة، معناه: فحملوا حملة فيمن يليهم وحملنا فيمن يلينا» [@ibn-al-anbari، ص412]. وقال الزَّوْزَنِيّ: «فحمل بنو بكر على من يليهم من الأعداء، وحملنا على من يلينا» [@zawzani، ص230]."
vocabulary:
  - term: "صَالُوا"
    text: "حملوا وسطوا. وفي اللسان: «صَالَ عَلَى قِرْنِه صَوْلًا وصِيالًا وصُؤُولًا وصَوَلاناً وَصَالًا ومَصالةً: سَطا» [@lisan، ج11 ص387]. وقال ابن الأَنْبارِيّ: «وأصل الصيال تخمط الفحل ووثوبه عليه» [@ibn-al-anbari، ص412]، والتخمّط: الهياج والزمجرة."
  - term: "صَوْلَةً"
    text: "حملة واحدة."
  - term: "يَلِيهِمْ"
    text: "يقرب منهم ويحاذيهم في الصف."
syntax:
  - "«والصول منصوب على المصدر. والصولة منصوبة على التفسير عن عدد المرات» [@ibn-al-anbari، ص412]: أي أن «صَوْلَةً» مفعول مطلق يبيّن العدد، فهي حملة واحدة."
  - "«فِيمَنْ»: «في» حرف جر، و«مَن» اسم موصول مجرور، وجملة «يَلِيهِمْ» صلته. وأفرد الفعل مع أن المقصود جماعة: «وقال (فيمن يليهم) على لفظ من» [@tabrizi-ashr، ص241]، ولو راعى المعنى لقال «يلونهم»."
  - "الفاء في «فَصَالُوا» عاطفة تفيد الترتيب والتعقيب: التقى الجيشان ثم حملوا."
morphology:
  - "«صَوْلَة» اسم مرة على «فَعْلَة»، من «صَالَ يَصُولُ» الأجوف الواوي."
  - "«صُلْنَا» ماضٍ أجوف اتصل بضمير الرفع، فحُذفت عينه لالتقاء الساكنين، وضُمّت فاؤه دلالة على أن العين واو."
  - "«يَلِي» مضارع «وَلِيَ»، لفيف مفروق حُذفت فاؤه في المضارع."
rhetoric:
  thesis: "معركة متوازنة: كل قبيلة حملت على ما يقابلها، فلا فضل لأحد على أحد في ظاهر البيت."
  devices:
    - title: "التوازي بين الشطرين"
      text: "التوازي أن يُبنى الشطران على نسق واحد. فالشطران هنا متطابقان إلا في الضمير: «صالوا/صلنا»، «يليهم/يلينا»، فيتقاسم القوم الحملة قسمة عادلة في اللفظ نفسه."
    - title: "الاستعارة في «صَالُوا» و«صُلْنَا»"
      text: "أصل الصيال وثوب الفحل على الفحل [@ibn-al-anbari، ص412]، فجعل المحاربين فحولًا هائجة. وهي الاستعارة عند عبد القاهر الجُرْجانيّ: أن تترك التصريح بالتشبيه «وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "جناس الاشتقاق في «صَالُوا صَوْلَةً»"
      text: "الفعل ومصدره متجاوران، ويتكرر الزوج في العَجُز، فتتردد مادة «صول» أربع مرات في البيت."
  connection: "ثم يأتي ما يفترق فيه القومان: ما رجع به كل منهما."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "فَصَالُو صَوْ / لَتَنْ فِيمَنْ / يَلِيهِمْ = مفاعلْتن / مفاعلْتن / فعولن — وَصُلْنَا صَوْ / لَتَنْ فِيمَنْ / يَلِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلات الأربع في الحشو، فجاء الشطران بوزن واحد تام التطابق."
context: "من أبيات يوم خَزَاز (58–64)، ومما أنشده أبو عَمْرو بن العَلاء في خبر ذلك اليوم [@iqd، ج6 ص98]."
