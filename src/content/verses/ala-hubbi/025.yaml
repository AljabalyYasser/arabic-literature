first: "يَكُونُ ثِفَالُهَا شَرْقِيَّ سَلْمَى"
second: "وَلُهْوَتُهَا قُضَاعَةَ أَجْمَعِينَا"
meaning: "يكون الجلد الذي تحت رحانا شرقيّ سلمى، وتكون الحفنة التي نلقيها فيها قبيلة قضاعة كلها. أي أن ساحة حربنا واسعة كالأرض، والقبيلة الكبيرة فيها قبضة حب تُطحن. قال ابن الأَنْبارِيّ: «أراد أن شرقي سلمى للحرب بمنزلة الثفال للرحى»، وقال: «أراد أن قضاعة تطحنهم الحرب كما تطحن الرحى ما يلقى فيها من الطعام» [@ibn-al-anbari، ص391]. وقال الزَّوْزَنِيّ: «يقول: تكون معركتنا الجانب الشرقي في نجد، وتكون قبضتنا قضاعة أجمعين، فاستعار للمعركة اسم الثفال وللقتلى اسم اللهوة ليشاكل الرحى والطحين» [@zawzani، ص222]."
vocabulary:
  - term: "ثِفَالُهَا"
    text: "«(الثفال) : جلدة أو خرقة تجعل تحت الرحى، ليكون ما سقط من الطحين في الثفال» [@ibn-al-anbari، ص391]. وفي «لسان العرب»: «الثِّفال، بِالْكَسْرِ، الجِلْد الَّذِي يُبْسط تَحْتَ رَحَى الْيَدِ لِيَقي الطَّحِين مِنَ التُّرَابِ» [@lisan، ج11 ص85]."
  - term: "لُهْوَتُهَا"
    text: "«و (اللهوة) : القبضة من الطعام تلقيها في الرحى، وجمعها لهى» [@ibn-al-anbari، ص391]، وفي «لسان العرب»: «واللُّهْوَةُ واللَّهْوَةُ: مَا أَلقَيْتَ فِي فَمِ الرَّحى مِنَ الحُبوب للطَّحْن» [@lisan، ج15 ص261]."
  - term: "سَلْمَى"
    text: "موضع، ويرويه بعضهم «شرقيّ نجد»."
  - term: "قُضَاعَةَ"
    text: "قبيلة كبيرة من العرب."
syntax:
  - "قال ابن الأَنْبارِيّ: «والثفال اسم يكون، وشرقي سلمى الخبر، واللهوة رفع بإضمار يكون، وقضاعة خبر الكون المضمر» [@ibn-al-anbari، ص392]. أي: وتكون لهوتُها قضاعةَ، فحُذف الفعل لدلالة الأول عليه."
  - "«قضاعةَ» منصوبة بالفتحة بلا تنوين لأنها ممنوعة من الصرف، و«أجمعينا» توكيد معنوي لها منصوب بالياء."
morphology:
  - "«ثِفَال» على «فِعَال»، و«لُهْوَة» على «فُعْلَة»، وجمعها «لُهًى»."
  - "«شَرْقِيّ» نسبة إلى الشرق."
  - "«أَجْمَعِين» جمع «أَجْمَع»، من ألفاظ التوكيد."
rhetoric:
  thesis: "يكمل صورة الرحى بأجزائها: الجلد تحتها والحب في فمها. فالصورة تتسع حتى تصير الأرض جلد الرحى، وقبيلة كاملة حفنة حب."
  devices:
    - title: "ترشيح الاستعارة في «ثِفَالُهَا ... وَلُهْوَتُهَا»"
      text: "بعد أن جعل الحرب رحى، أعطاها ثفالًا ولُهوة، فاكتملت الآلة. قال الزَّوْزَنِيّ إنه فعل ذلك «ليشاكل الرحى والطحين» [@zawzani، ص222]. والصورة كلها تمثيل، وهو عند عبد القاهر الجُرْجانيّ ضرب من التشبيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "المبالغة في «قُضَاعَةَ أَجْمَعِينَا»"
      text: "قبيلة كبيرة كلها ليست إلا قبضة يُلقيها الطاحن في رحاه. فالتوكيد «أجمعين» يزيد المبالغة: لا يبقى منهم أحد خارج الرحى."
    - title: "التناسب بين الأجزاء"
      text: "رحى، وطحين، وثفال، ولهوة: ألفاظ من حقل واحد في بيتين، وهذا ما يسميه البلاغيون مراعاة النظير. وهذه قراءتنا."
  connection: "ثم يترك الرحى إلى حكمة عن الضغائن: «وإن الضغن بعد الضغن يبدو»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "يَكُونُ ثِفَا / لُهَا شَرْقِيْ / يَ سَلْمَا = مفاعلَتن / مفاعَلْتن / فعولن — وَلُهْوَتُهَا / قُضَاعَةَ أَجْ / مَعِينَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، فصارت «مفاعَلْتن»."
context: "ثاني بيتي الرحى، وآخر القسم الأول من الخطاب للملك (18–25). ويعود البيت في رواية ابن الأَنْبارِيّ نفسها في الموضع 81 بلفظ «شرقيّ نجد». وهو عند الزَّوْزَنِيّ البيت الحادي والثلاثون، وبعده عنده بيتا «نزلتم منزل الأضياف» و«قريناكم» [@zawzani، ص222]، وهما عند ابن الأَنْبارِيّ البيتان 79–80."
variants:
  - reading: "يَكُونُ ثِفَالُهَا شَرْقِيَّ نَجْدٍ"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي نص الزَّوْزَنِيّ والتِّبْرِيزِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (يكون ثفالها شرقي نجد)» [@ibn-al-anbari، ص391]. وبها يرويه الزَّوْزَنِيّ [@zawzani، ص222]."
