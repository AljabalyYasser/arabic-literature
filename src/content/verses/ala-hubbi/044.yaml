first: "بِأَيِّ مَشِيئَةٍ عَمْرَو بْنَ هِنْدٍ"
second: "نَكُونُ لِقَيْلِكُمْ فِيهَا قَطِينَا"
meaning: "بأي إرادة، يا عَمْرو بن هند، نكون خدمًا لمن تولّيه أمرنا من ملوككم؟ قال الزَّوْزَنِيّ: «يقول: كيف تشاء يا عمرو بن هند أن نكون خَدَمًا لِمَن وليتموه أمرنا من الملوك الذين وليتموهم؟ أي: أيّ شيء دعاك إلى هذه المشيئة المحالة؟ يريد أنه لم يظهر منهم ضعف يطمع الملك في إذلالهم باستخدام قيله إياهم» [@zawzani، ص227]."
vocabulary:
  - term: "مَشِيئَةٍ"
    text: "إرادة."
  - term: "قَيْلِكُمْ"
    text: "الملك الذي دون الملك الأعظم، قال ابن الأَنْبارِيّ: «والأقيال: وزراء الملوك في قول بعض أهل اللغة. وقال أبو عبيد: ملوك باليمن دون الملك الأعظم، واحدهم قيل» [@ibn-al-anbari، ص401]. وقال الزَّوْزَنِيّ: «القَيْلُ: الملك دون الملك الأعظم» [@zawzani، ص227]."
  - term: "قَطِينَا"
    text: "«و (القطين) : الخدم» [@ibn-al-anbari، ص402]. وفي «لسان العرب»: «والقَطِينُ: الخَدَمُ والأَتْباع والحَشَمُ» [@lisan، ج13 ص343]."
syntax:
  - "«بأيّ مشيئةٍ» جار ومجرور متعلق بـ«نكون»، و«أيّ» اسم استفهام."
  - "«عمرَو بنَ هند» منادى حُذفت منه أداة النداء. قال التِّبْرِيزِيّ: «وعمرو: منصوب على إنه اتباع لقوله ابن هند» [@tabrizi-ashr، ص235]، أي أن «عمرو» فُتح ليتبع حركة «ابنَ»."
  - "قال ابن الأَنْبارِيّ: «والباء صلة نكون، واسم الكون مضمر فيه، وخبره قطينا» [@ibn-al-anbari، ص402]. و«لقيلكم» و«فيها» متعلقان بـ«قطينا»."
morphology:
  - "«مَشِيئَة» على «مَفْعِلَة» من «شاء»، قال التِّبْرِيزِيّ: «(مشيئة) من شاء يشاء؛ وإن شئت لينت الهمزة فقلت مشية» [@tabrizi-ashr، ص235]، وبها يرويه ابن قُتَيْبة «مشيّة» [@ibn-qutayba، ج1 ص229]."
  - "«قَيْل» مخفف «قَيِّل» على «فَيْعِل»."
  - "«قَطِين» على «فَعِيل»، يقع على الواحد والجمع."
rhetoric:
  thesis: "هنا ينقلب الخطاب من طلب التمهل إلى التحدي الصريح: كيف تريد أن تجعلنا خدمًا لأتباعك؟ والسؤال إنكار، لا استفهام."
  devices:
    - title: "الاستفهام الإنكاري في «بِأَيِّ مَشِيئَةٍ»"
      text: "لا يسأل عن سبب، بل ينكر أن يكون للملك حق في ذلك. قال الزَّوْزَنِيّ: «أي: أيّ شيء دعاك إلى هذه المشيئة المحالة؟» [@zawzani، ص227]."
    - title: "النداء باسم الملك مجردًا"
      text: "في البيت 18 ناداه «أبا هند» بكنيته، وهنا يناديه «عمرو بن هند» باسمه ونسبه إلى أمه، بلا أداة نداء ولا لقب. والفرق بين الندائين فرق بين طلب المهلة والمواجهة. وهذه قراءتنا."
    - title: "التكرار في افتتاح البيتين 44–45"
      text: "يبدأ البيتان بالعبارة نفسها «بأي مشيئة عمرو بن هند»، فيضرب على الكلمة مرتين، كمن يكرر سؤاله في وجه خصمه."
  connection: "ثم يعيد السؤال بإنكار آخر: تطيع الوشاة وتحتقرنا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بِأَيْيِ مَشِي / ئَةِنْ عَمْرَبْ / نَ هِنْدِنْ = مفاعلَتن / مفاعَلْتن / فعولن — نَكُونُ لِقَيْ / لِكُمْ فِيهَا / قَطِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "أول أبيات التحدي (44–49). ويرتبط بخبر الخدمة الذي أدى إلى مقتل الملك [@ibn-qutayba، ج1 ص228–229]. وهو عند الزَّوْزَنِيّ البيت الرابع والخمسون [@zawzani، ص227]، والتِّبْرِيزِيّ يقدّم عليه البيت التالي [@tabrizi-ashr، ص235]."
variants:
  - reading: "نَكُونُ لِخَلْفِكُمْ فِيهَا قَطِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ والتِّبْرِيزِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى في البيت الأول: (نكون لخلفكم فيها قطينا) لخلفكم: لنسلكم» [@ibn-al-anbari، ص402]. وقال التِّبْرِيزِيّ: «ويروى (نكون لخلفكم) والخلف: الرديء من كل شيء» [@tabrizi-ashr، ص235]."
