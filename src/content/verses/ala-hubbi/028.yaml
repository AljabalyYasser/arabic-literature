first: "وَنَحْنُ إِذَا عِمَادُ الْحَيِّ خَرَّتْ"
second: "عَلَى الْأَحْفَاضِ نَمْنَعُ مَنْ يَلِينَا"
meaning: "ونحن إذا فزعت القبائل فأسقطت أعمدة بيوتها على متاعها لتهرب، نثبت ونحمي من يجاورنا. قال ابن الأَنْبارِيّ: «يقول: إذا فزع كل قوم فتساقطت أخبيتهم وهموا بالهرب نمنع نحن من يلينا» [@ibn-al-anbari، ص393]. وقال أبو جعفر: «معناه لا ندعهم يرحلون، بل نقاتل عنهم» [@ibn-al-anbari، ص393]. وقال التِّبْرِيزِيّ: «ومعنى البيت: إنه لا يُطمع فيهم في إقامة ولا ظعن» [@tabrizi-ashr، ص228]."
vocabulary:
  - term: "عِمَادُ الْحَيِّ"
    text: "«معناه الخشب الذي تقوم به أخبيتهم ويوضع عليها المتاع» [@ibn-al-anbari، ص393]، أي أعمدة الخيام."
  - term: "خَرَّتْ"
    text: "سقطت."
  - term: "الْأَحْفَاضِ"
    text: "«(الأحفاض) : الإبل التي تحمل المتاع، واحدها حفض. والأحفاض هاهنا: المتاع بعينه» [@ibn-al-anbari، ص393]. وفي «لسان العرب»: «والحَفَضَ متاعُ الْبَيْتِ، وَقِيلَ: متاعُ الْبَيْتِ إِذا هيئَ لِلْحَمْلِ» [@lisan، ج7 ص137]."
  - term: "مَنْ يَلِينَا"
    text: "من يقرب منا من الجيران والحلفاء."
syntax:
  - "قال ابن الأَنْبارِيّ: «ونحن رفع بما عاد من نمنع، وإذا وقت منصوب بنمنع» [@ibn-al-anbari، ص394]. أي أن «نحن» مبتدأ خبره جملة «نمنع»، و«إذا» ظرف متعلق بها."
  - "«عمادُ الحي» فاعل لفعل محذوف يفسّره «خرّت»، لأن «إذا» لا يليها إلا فعل. وأُنّث الفعل لأن «العماد» جمع، قال التِّبْرِيزِيّ: «والعماد: جمع عمود» [@tabrizi-ashr، ص228]."
  - "«على الأحفاض» متعلق بـ«خرّت»، و«مَن» موصول مفعول به لـ«نمنع»."
morphology:
  - "«عِمَاد» جمع «عَمُود» على «فِعَال»."
  - "«أَحْفَاض» جمع «حَفَض» على «أَفْعَال»."
  - "«خَرَّ» على «فَعَلَ» من المضعّف."
rhetoric:
  thesis: "صورة الفزع العام: القبائل تقتلع خيامها وتهرب، وتَغْلِب وحدها تثبت وتحمي جيرانها. فالبطولة هنا حماية لا غزو."
  devices:
    - title: "الكناية في «عِمَادُ الْحَيِّ خَرَّتْ عَلَى الْأَحْفَاضِ»"
      text: "لم يقل: إذا فزع الناس وهربوا، بل وصف المشهد الذي يلزم عن الفزع: أعمدة تسقط على المتاع المهيّأ للرحيل. والكناية عند عبد القاهر الجُرْجانيّ أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "التقديم في «وَنَحْنُ ... نَمْنَعُ»"
      text: "قدّم «نحن» على الفعل، فصار الكلام عنهم هم دون غيرهم: نحن الذين نمنع. ويقول عبد القاهر الجُرْجانيّ في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "المقابلة الضمنية"
      text: "الآخرون يهربون، ونحن نمنع: البيت يقابل بين فعلين دون أن يذكر الأول صراحة. وهذه قراءتنا."
  connection: "ثم يفصّل هذه الحماية: ندافع عنهم ونحمل عنهم."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَنَحْنُ إِذَا / عِمَادُلْ حَيْ / يِ خَرْرَتْ = مفاعلَتن / مفاعَلْتن / فعولن — عَلَلْ أَحْفَا / ضِ نَمْنَعُ مَنْ / يَلِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب. وفي النص المطبوع من شرح ابن الأَنْبارِيّ جاء البيت في رأسه «نمنع ما يلينا»، ثم شرحه بـ«من يلينا» وقال: «ويروى: (ما يلينا)» [@ibn-al-anbari، ص393]، فاعتمدنا «من» كما في شرحه، وهي رواية الزَّوْزَنِيّ والتِّبْرِيزِيّ أيضًا [@zawzani، ص224]. وهو عند الزَّوْزَنِيّ البيت الحادي والأربعون."
variants:
  - reading: "عَنِ الْأَحْفَاضِ نَمْنَعُ مَنْ يَلِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي نص الزَّوْزَنِيّ"
    note: "قال أبو جعفر: «من روى (على الأحفاض) أراد: من عجلتهم قوضوا بيوتهم على متاعهم ونزعوا أعمدة البيوت من الفزع. ومن روى: (عن الأحفاض) أراد بالأحفاض الإبل التي تحمل المتاع» [@ibn-al-anbari، ص393]. وقال الزَّوْزَنِيّ: «أو ونحن إذا سقطت الخيام عن الإبل للإسراع في الهرب نمنع ونحمي جيراننا» [@zawzani، ص224]."
  - reading: "عَلَى الْأَحْفَاضِ نَمْنَعُ مَا يَلِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي في رأس البيت في النص المطبوع"
    note: "«ويروى: (ما يلينا)» [@ibn-al-anbari، ص393]، أي نحمي ما يقرب منا من أرض ومال."
