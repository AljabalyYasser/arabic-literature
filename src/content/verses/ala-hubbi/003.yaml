first: "تَجُورُ بِذِي اللُّبَانَةِ عَنْ هَوَاهُ"
second: "إِذَا مَا ذَاقَهَا حَتَّى يَلِينَا"
meaning: "هذه الخمر تميل بصاحب الحاجة عن حاجته وما يهواه، إذا ذاقها، حتى يلين. قال الزَّوْزَنِيّ: «يمدح الخمر ويقول: تميل صاحب الحاجة عن حاجته وهواه إذا ذاقها حتى يلين، أي هي تنسي الهموم والحوائج أصحابها، فإذا شربوها لانوا ونسوا أحزانهم وحوائجهم» [@zawzani، ص216]. وقال ابن الأَنْبارِيّ: «ومعنى البيت أن الخمر تميل بشاربها عن حاجته» [@ibn-al-anbari، ص373]."
vocabulary:
  - term: "تَجُورُ"
    text: "تعدل وتميل، قال البَغْداديّ: «من الجور وهو العدول» [@khizana، ج3 ص179]."
  - term: "اللُّبَانَةِ"
    text: "«الحاجة، يقال: لي إليه حاجة، ولبانة، وأشكلة، وشهلاء» [@ibn-al-anbari، ص373]."
  - term: "يَلِينَا"
    text: "يلين خُلُقه ويسهل، بعد أن كان مشغولًا بحاجته منقبضًا."
syntax:
  - "قال ابن الأَنْبارِيّ: «وفاعل تجور مضمر فيه من ذكر الخمر، وما صلة، وإذا نصب بتجور، ويلينا نصب بحتى، والألف صلة لفتحة النون» [@ibn-al-anbari، ص373]. أي أن الفاعل ضمير يعود على الخمر، و«ما» زائدة بعد «إذا»، و«يلين» منصوب بـ«أن» مضمرة بعد «حتى»، والألف ألف الإطلاق."
  - "«بِذِي اللُّبَانَةِ» الباء للتعدية: «تجور به» أي تجعله يجور، و«ذِي» مجرور بالياء لأنه من الأسماء الخمسة، و«اللُّبَانَةِ» مضاف إليه. و«عَنْ هَوَاهُ» متعلق بـ«تجور»."
  - "«إِذَا مَا ذَاقَهَا» شرط حُذف جوابه لدلالة ما قبله عليه: إذا ذاقها جارت به عن هواه."
morphology:
  - "«تَجُورُ» مضارع «جَارَ يَجُورُ» الأجوف الواوي، والمصدر «الجَوْر»."
  - "«اللُّبَانَة» على «فُعَالة». ومن نظائرها في معنى الحاجة عند ابن الأَنْبارِيّ: «المأربة» و«الأرب» و«الإربة» و«الوطر» [@ibn-al-anbari، ص373]."
  - "«يَلِينَ» مضارع «لَانَ يَلِينُ» الأجوف اليائي."
rhetoric:
  thesis: "بعد لون الخمر يذكر فعلها في النفس: صاحب الهمّ المقبل على حاجته يذوقها فينصرف عن همه ويلين. فالمطلع يمدح الخمر بما تصنعه في الشاربين، تمهيدًا لفخر قوم لا يدّخرون."
  devices:
    - title: "الاستعارة"
      text: "«تَجُورُ بِذِي اللُّبَانَةِ عَنْ هَوَاهُ»: الجَوْر العدول عن الطريق، فجعل حاجة الرجل طريقًا يسير فيه، وجعل الخمر تأخذ به فتعدل به عنه. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تُريدَ تشبيهَ الشيءِ بالشيءِ، فَتَدعَ أنْ تُفْصحَ بالتشبيهِ وتُظْهرَه، وتجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]."
    - title: "«ذاقها» لا «شربها»"
      text: "قال «إِذَا مَا ذَاقَهَا» ولم يقل: إذا شربها. فالذوق أول الشرب وأقله، وبه وحده يتم فعلها. وفي ذلك مبالغة في قوتها. وهذه قراءتنا."
    - title: "الغاية بـ«حتى»"
      text: "«حَتَّى يَلِينَا» يجعل اللين غاية ينتهي إليها فعل الخمر، فالتحول يحدث شيئًا بعد شيء: يذوق، فيميل عن همّه، ثم يلين."
  connection: "ثم يأتي بأشد الناس إمساكًا: البخيل الضيّق الصدر يهين ماله إذا دارت عليه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "تَجُورُ بِذِلْ / لُبَانَةِ عَنْ / هَوَاهُو = مفاعلَتن / مفاعلَتن / فعولن — إِذَا مَا ذَا / قَهَا حَتْتَى / يَلِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "الصدر على الأصل «مفاعلَتن مفاعلَتن فعولن»، وأُشبعت ضمة الهاء في «هَوَاهُ» فصارت «هَوَاهُو». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، تفعيلتي العَجُز."
context: "ثالث أبيات المطلع الخمري. ويشرحه البَغْداديّ بلفظ قريب من لفظ الزَّوْزَنِيّ في سياق شرحه المطلع [@khizana، ج3 ص179]."
