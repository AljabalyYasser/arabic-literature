first: "فَأَمَّا يَوْمَ خَشْيَتِنَا عَلَيْهِمْ"
second: "فَنُصْبِحُ غَارَةً مُتَلَبِّبِينَا"
meaning: "فأما يوم نخاف على أبنائنا ونسائنا، فنصبح غارة مستعدين قد شددنا علينا السلاح. قال ابن الأَنْبارِيّ: «قال أبو جعفر: فسر معنى المقارعة بهذا الكلام. (عليهم) معناه على البنين والحرم. وقوله (فنصْبِحُ غارةً مُتلبِّبينا) معناه فنصبح متيقظين مستعدين» [@ibn-al-anbari، ص400]."
vocabulary:
  - term: "خَشْيَتِنَا عَلَيْهِمْ"
    text: "خوفنا عليهم، و«(عليهم) معناه على البنين والحرم» [@ibn-al-anbari، ص400]."
  - term: "غَارَةً"
    text: "هجومًا على العدو، «ويقال: أغرت على العدو إغارة وغارة» [@ibn-al-anbari، ص400]."
  - term: "مُتَلَبِّبِينَا"
    text: "«معناه فنصبح متيقظين مستعدين» [@ibn-al-anbari، ص400]. وفي «لسان العرب»: «والمُتَلَبِّبُ: المُتَحَزِّمُ بِالسِّلَاحِ وَغَيْرِهِ» [@lisan، ج1 ص733]، وقال التِّبْرِيزِيّ: «التلبُّب: التحزم بالسلاح» [@tabrizi-ashr، ص233]."
syntax:
  - "«أمّا» حرف شرط وتفصيل، و«يومَ» ظرف منصوب، والفاء في «فنصبح» واقعة في جواب «أمّا»."
  - "«خشيتِنا» مضاف إلى «يوم»، وهو مصدر مضاف إلى فاعله، و«عليهم» متعلق به."
  - "«نصبح» فعل ناقص، و«غارةً» خبره، جُعل القوم غارة على المبالغة، «ومتلببينا نعت لغارة» [@ibn-al-anbari، ص400]، حُمل على المعنى لأن الغارة رجال."
morphology:
  - "«خَشْيَة» على «فَعْلَة»، مصدر «خَشِيَ»."
  - "«غَارَة» اسم مصدر من «أَغَارَ»."
  - "«مُتَلَبِّب» اسم فاعل من «تَلَبَّبَ» على «تَفَعَّلَ»، من اللَّبَب: موضع القلادة من الصدر، لأن المتلبب يشد ثوبه عند صدره."
rhetoric:
  thesis: "أول قسمي التقسيم: يوم الخوف. فالقبيلة تتحول كلها إلى غارة مسلحة. والبيتان معًا يصوّران حياة القوم بين الحرب والسلم."
  devices:
    - title: "التقسيم بـ«فَأَمَّا ... وَأَمَّا»"
      text: "قسم أيامهم قسمين، لكل قسم بيت. والتقسيم يجعل الحياة كلها داخلة في الفخر: لا يوم يخلو من صفة تُحمد."
    - title: "المبالغة في «فَنُصْبِحُ غَارَةً»"
      text: "لم يقل: نصبح مغيرين، بل جعلهم الغارة نفسها، كأنهم صاروا الفعل كله. وهذه قراءتنا."
    - title: "الدافع في «خَشْيَتِنَا عَلَيْهِمْ»"
      text: "الغارة هنا ليست طمعًا، بل خوف على الأبناء والنساء، فالقتال حماية."
  connection: "ثم القسم الثاني: يوم الأمن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "فَأَمْمَا يَوْ / مَ خَشْيَتِنَا / عَلَيْهِمْ = مفاعَلْتن / مفاعلَتن / فعولن — فَنُصْبِحُ غَا / رَةَنْ مُتَلَبْ / بِبِينَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، فصارت «مفاعَلْتن»."
context: "أول بيتي التقسيم (41–42)، وهو عند أبي جعفر تفسير للمقارعة في البيت السابق [@ibn-al-anbari، ص400]. وهو عند الزَّوْزَنِيّ البيت التاسع والأربعون برواية أخرى [@zawzani، ص225]."
variants:
  - reading: "فَأَمَّا يَوْمَ خَشْيَتِنَا عَلَيْهِمْ / فَتُصْبِحُ خَيْلُنَا عُصَبًا ثُبِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي نص الزَّوْزَنِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (فتصبح خيلنا عصبا ثبينا)» [@ibn-al-anbari، ص400]. وقال الزَّوْزَنِيّ: «يقول: فأما يوم نخشى على أبنائنا وحرمنا من الأعداء تصبح خيلنا جماعات، أي تتفرق في كل وجه لذبّ الأعداء عن الْحُرَم» [@zawzani، ص226]. والعُصَب: الجماعات، والثُّبُون: الجماعات المتفرقة."
