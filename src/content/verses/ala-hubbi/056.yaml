first: "مَتَى نَعْقِدْ قَرِينَتَنَا بِحَبْلٍ"
second: "نَجُذِّ الْحَبْلَ أَوْ نَقِصِ الْقَرِينَا"
meaning: "متى قُرنّا بقوم في حرب أو سباق، قطعنا الحبل الذي يربطنا بهم، أو دققنا عنق من قُرن بنا. قال ابن الأَنْبارِيّ: «يقول: متى نقرن إلى غيرنا، أي متى نسابق قوما نسبقهم، ومتى قارنا قوما في حرب صابرناهم حتى نقص من يقرن بنا، أي ندق عنقه» [@ibn-al-anbari، ص408]. وقال الزَّوْزَنِيّ: «والمعنى: متى قرنا بقوم في قتال أو جدال غلبناهم وقهرناهم» [@zawzani، ص229]."
vocabulary:
  - term: "قَرِينَتَنَا"
    text: "«التي تقرن إلى غيرها» [@ibn-al-anbari، ص408]. وقال التِّبْرِيزِيّ: «وأصل القرينة الناقة والجمل» تكون فيهما خشونة، «يُربط أحدهما إلى الآخر حتى يلين أحدهما» [@tabrizi-ashr، ص239]. وفي اللسان قول آخر: «قَرِينته: نَفْسُه هَاهُنَا. يَقُولُ: إِذا أَقْرَنَّا لِقرْنٍ غَلَبْنَاهُ» [@lisan، ج13 ص339]."
  - term: "نَجُذِّ"
    text: "نقطع: «الجذ: القطع» [@zawzani، ص229]."
  - term: "نَقِصِ"
    text: "ندقّ العنق: «الوقص: دق العنق، والفعل وقص يقص» [@zawzani، ص229]."
  - term: "الْقَرِينَا"
    text: "من يُقرن بنا."
syntax:
  - "«ونعقد جزم بمتى، ونجذ جواب الجزاء وكسرت الذال لاجتماع الساكنين» [@ibn-al-anbari، ص408]: «مَتَى» اسم شرط جازم، و«نَعْقِدْ» فعل الشرط، و«نَجُذِّ» جوابه، وأصله «نَجُذّْ» فالتقى ساكنان، الذال المدغمة ولام «الحبل»، فكُسرت الذال. ويجيز ابن الأَنْبارِيّ ضمّها وفتحها، والضم «على الاتباع لضمة الجيم» [@ibn-al-anbari، ص408]."
  - "«نَقِصِ» معطوف على «نَجُذِّ» مجزوم مثله، وكُسرت صاده لالتقاء الساكنين."
  - "«بِحَبْلٍ» متعلق بـ«نَعْقِدْ»، و«الْحَبْلَ» و«الْقَرِينَا» مفعولان."
morphology:
  - "«نَقِص» من «وَقَصَ يَقِصُ»، مثال واوي: «والأصل في نقص نوقص، فحذفت الواو لوقوعها بين كسرة وياء» [@ibn-al-anbari، ص408]، أي كما حُذفت في «يَقِص» و«يَعِد»."
  - "«نَجُذّ» مضارع «جَذَّ» المضعّف على «فَعَلَ يَفْعُلُ»."
  - "«قَرِينَة» على «فَعِيلَة» بمعنى «مَفْعُولة»، أي مقرونة، و«قَرِين» بمعنى «مُقارِن»."
rhetoric:
  thesis: "ينتقل من الآباء إلى صفة القوم: من قُرن بهم خسر، إما بانقطاع ما يربطه بهم، وإما بهلاكه."
  devices:
    - title: "التمثيل في «نَعْقِدْ قَرِينَتَنَا بِحَبْلٍ»"
      text: "صورة بعيرين يُربط أحدهما إلى الآخر ليذلّ الصعب منهما، فيقطع بعيرهم الحبل أو يدقّ عنق صاحبه. وهي مثل لكل منافسة وحرب، كما قال الزَّوْزَنِيّ: «متى قرنا بقوم في قتال أو جدال غلبناهم» [@zawzani، ص229]. والتمثيل عند عبد القاهر الجُرْجانيّ أخصّ من التشبيه، «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "التقسيم في «نَجُذِّ ... أَوْ نَقِصِ»"
      text: "التقسيم أن يستوفي الشاعر أحوال الشيء. ذكر حالين لا ثالث لهما، وكلاهما غلبة: إما أن ينقطع الرباط، وإما أن يهلك القرين."
  connection: "ثم يصف قومه بالمنع والوفاء: «ونوجد نحن أمنعهم ذمارًا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "مَتَى نَعْقِدْ / قَرِينَتَنَا / بِحَبْلِنْ = مفاعلْتن / مفاعلتن / فعولن — نَجُذْذِلْ حَبْ / لَ أَوْ نَقِصِلْ / قَرِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين."
context: "أول أبيات المناقب بعد سلسلة الآباء. وقد عُلّق بهذا البيت خبر موت الشاعر: يروي ابن قُتَيْبة أن عَمْرًا أغار على بني حنيفة باليمامة «فأسره يزيد بن عمرو الحنفىّ فشدّه وثاقا، ثم قال: ألست القائل» وأنشده البيت، ثم قال: «أما إنى سأقرنك بناقتى هذه، ثم أطردكما جميعا» [@ibn-qutayba، ج1 ص368]. فالبيت الذي فخر فيه بأنه لا يُقرن بأحد إلا غلبه صار سخرية آسره منه."
variants:
  - reading: "مَتَى نَعْقِدْ قَرِينَتَنَا بِقَوْمٍ ... نَجُزَّ الْحَبْلَ"
    status: "رواية أخرى"
    note: "ذكرها ابن الأَنْبارِيّ [@ibn-al-anbari، ص408] والتِّبْرِيزِيّ [@tabrizi-ashr، ص239]."
  - reading: "تَجُذَّ الْحَبْلَ أَوْ تَقِصِ الْقَرِينَا"
    status: "رواية الزَّوْزَنِيّ والجَمْهَرة"
    note: "[@zawzani، ص229]، [@jamhara، ص290]. والفعل على هذه الرواية للقرينة: «ومن قال (نجذ الحبل) جعله للمتكلم، ومن رواه بالتاء جعله للقرينة». وردّها أبو جَعْفَر: «الرواية (نجذ الحبل) بالنون، وأنكر التاء، وقال: القرينة من غيرهم فلا معنى للتاء» [@ibn-al-anbari، ص408]."
  - reading: "نَجُذَّ الْوَصْلَ أَوْ نَقِصِ الْقَرِينَا"
    status: "رواية التِّبْرِيزِيّ"
    note: "[@tabrizi-ashr، ص239]."
