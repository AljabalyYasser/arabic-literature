first: "وَأَمَّا يَوْمَ لَا نَخْشَى عَلَيْهِمْ"
second: "فَنُصْبِحُ فِي مَجَالِسِنَا ثُبِينَا"
meaning: "وأما يوم لا نخاف عليهم، فنقيم في مجالسنا جماعات جماعات. قال التِّبْرِيزِيّ: «يقول: إذا خشينا اجتمعنا، فإذا لم نخش تفرَّقنا» [@tabrizi-ashr، ص234]. أي أنهم في الأمن يتفرقون في مجالسهم آمنين، وفي الخوف يجتمعون غارة واحدة."
vocabulary:
  - term: "مَجَالِسِنَا"
    text: "مواضع جلوسنا وأنديتنا."
  - term: "ثُبِينَا"
    text: "جماعات متفرقة، قال ابن الأَنْبارِيّ: «و (الثبون) : المتفرقون، وواحدها ثبة» [@ibn-al-anbari، ص400]. وفي «لسان العرب»: «والثُّبةُ: الجماعةُ مِنَ النَّاسِ» [@lisan، ج1 ص244]. وقال الزَّوْزَنِيّ: «الثبة: الجماعة، والجمع الثبات، والثبون في الرفع والثبين في النصب والجر» [@zawzani، ص226]."
syntax:
  - "«وأمّا» معطوفة على «فأمّا» في البيت السابق، و«يومَ» ظرف، وجملة «لا نخشى عليهم» في محل جر بالإضافة."
  - "«نصبح» فعل ناقص، واسمه ضمير «نحن»، و«ثبينا» خبره منصوب بالياء، و«في مجالسنا» متعلق به."
morphology:
  - "«ثُبُون» ملحق بجمع المذكر السالم، مفرده «ثُبَة» محذوفة اللام، قال التِّبْرِيزِيّ: «وإنما جمع بالواو والنون لأنه قد حذف منه آخره، فقيل: المحذوف منه ياء، وقيل: واو» [@tabrizi-ashr، ص233]."
  - "«مَجَالِس» جمع «مَجْلِس» على «مَفَاعِل»."
  - "«نَخْشَى» مضارع «خَشِيَ»، ناقص يائي."
rhetoric:
  thesis: "القسم الثاني من التقسيم: يوم الأمن. والمقابلة بين البيتين تقول إن هؤلاء القوم يجتمعون للخطر ويتفرقون للراحة، فلا يجمعهم إلا الدفاع."
  devices:
    - title: "المقابلة بين البيتين 41–42"
      text: "«يوم خشيتنا» و«يوم لا نخشى»، و«غارة متلببين» و«في مجالسنا ثبين»: حالان متقابلتان في الوقت والفعل. والمطابقة عند ابن رَشِيق: «جمعك بين الضدين في الكلام أو بيت الشعر» [@ibn-rashiq، ج2 ص5]."
    - title: "التكرار الموازي"
      text: "«فأما يوم ... فنصبح» ثم «وأما يوم ... فنصبح»: البناء نفسه في البيتين، فيظهر الفرق في النهاية وحدها. وهذه قراءتنا."
  connection: "ثم يذكر رأس الحي الذي يغيرون به: «برأس من بني جشم بن بكر»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَأَمْمَا يَوْ / مَ لَا نَخْشَا / عَلَيْهِمْ = مفاعَلْتن / مفاعَلْتن / فعولن — فَنُصْبِحُ فِي / مَجَالِسِنَا / ثُبِينَا = مفاعلَتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، فصارت «مفاعَلْتن»."
context: "ثاني بيتي التقسيم. وفي رواية الزَّوْزَنِيّ يختلف المعنى: يوم الخوف تتفرق الخيل لتحمي الحريم، ويوم الأمن «فنمعن في الإغارة على الأعداء» [@zawzani، ص226]. فالترتيب عنده معكوس: في الأمن يغيرون، وفي الخوف يدافعون."
variants:
  - reading: "وَأَمَّا يَوْمَ لَا نَخْشَى عَلَيْهِمْ / فَنُمْعِنُ غَارَةً مُتَلَبِّبِينَا"
    status: "رواية الزَّوْزَنِيّ والتِّبْرِيزِيّ"
    note: "قال الزَّوْزَنِيّ: «الإمعان: الإسراع والمبالغة في الشيء. التلبُّبُ: لبس السلاح»، «يقول: وأما يوم لا نخشى على حرمنا من أعدائنا فنمعن في الإغارة على الأعداء لابسين أسلحتنا» [@zawzani، ص226]. وقال التِّبْرِيزِيّ: «ومن روى في البيت الأول (فتصبح خيلنا عصبا ثبينا) روى هذا البيت» هكذا [@tabrizi-ashr، ص234]."
  - reading: "وَأَمَّا يَوْمَ لَا نَخْشَى عَلَيْهِمْ / فَنُصْبِحُ غَارَةً مُتَلَبِّبِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ"
    note: "قال: «التفسير في إعرابه كالتفسير في البيت الأول» [@ibn-al-anbari، ص401]."
