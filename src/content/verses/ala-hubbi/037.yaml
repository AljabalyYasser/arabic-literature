first: "إِذَا مَا عَيَّ بِالْإِسْنَافِ حَيٌّ"
second: "مِنَ الْهَوْلِ الْمُشَبَّهِ أَنْ يَكُونَا"
meaning: "إذا عجز قوم عن التقدم في الحرب، وتحيّروا خوفًا من هول يُتوقع أن يقع، فلم يعرفوا كيف يتوجهون، فعلنا ما يذكره البيت التالي. قال الزَّوْزَنِيّ: «يقول: إذا عجز عن التقدم قوم مخافة هول منتظر متوقع يشبه أن يكون ويمكن» [@zawzani، ص225]. وقال التِّبْرِيزِيّ: «ومعنى البيت: إذا تحير الحي وتوقفوا كراهة أن يكون الهول تقدَّمنا ونصبنا الكتائب» [@tabrizi-ashr، ص232]."
vocabulary:
  - term: "عَيَّ"
    text: "عجز، قال ابن الأَنْبارِيّ: «و (عي) من العي في الحرب لهولها. يقال: عييت بالأمر، وأعييت في المشي» [@ibn-al-anbari، ص398]."
  - term: "الْإِسْنَافِ"
    text: "«(الإسناف) : التقدم في الحرب» [@ibn-al-anbari، ص398]. وفي «لسان العرب»: «وَفُرْسٌ مُسْنِفةٌ إِذَا كَانَتْ تَتَقَدَّمُ الخيلَ» [@lisan، ج9 ص162]، وفيه: «وَيُقَالُ فِي الْمَثَلِ لِمَنْ تَحَيَّر فِي أَمره: عَيَّ بالإِسْنَاف» [@lisan، ج9 ص163]."
  - term: "الْهَوْلِ"
    text: "الأمر المفزع."
  - term: "الْمُشَبَّهِ"
    text: "«(المشبه) إذا اشتبه الأمر عليهم فلم يعلموا كيف يتوجهون له» [@ibn-al-anbari، ص398]."
syntax:
  - "«إذا» ظرف شرط، و«ما» زائدة، و«عيّ حيٌّ» فعل وفاعل، و«بالإسناف» متعلق بـ«عيّ»."
  - "قال ابن الأَنْبارِيّ في «أن يكونا»: «وما صلة، واسم الكون مضمر فيه، ولا خبر للكون لأنه بمعنى الحدوث والوقوع. يريد أن يقع ويحدث» [@ibn-al-anbari، ص398]. أي أن «يكون» هنا تامة بمعنى يحدث. وقدّر التِّبْرِيزِيّ مضافًا محذوفًا: «وقوله (أن يكون) أراد كراهة أن يكون، ثم حذف كراهة وأقام أن مُقامها» [@tabrizi-ashr، ص232]."
  - "جواب «إذا» في البيت التالي: «نصبنا»، فالبيتان متعلقان."
morphology:
  - "«عَيَّ» أصله «عَيِيَ» على «فَعِلَ»، قال ابن الأَنْبارِيّ: «والأصل في عي عيي، فاستثقلوا الجمع بين حرفين متحركين من جنس واحد فأسكنوا الياء الأولى وأدغموها في الثانية التي بعدها» [@ibn-al-anbari، ص398]."
  - "«إِسْنَاف» مصدر «أَسْنَفَ» على «إِفْعَال»."
  - "«المُشَبَّه» اسم مفعول من «شَبَّهَ»، والمراد ما اشتبه أمره."
rhetoric:
  thesis: "يصوّر لحظة التردد عند الآخرين ليجعل إقدام قومه أوضح. فالبيت كله شرط، وجوابه في البيت التالي: هنا يقف الناس، وهناك تتقدم تَغْلِب."
  devices:
    - title: "التضمين"
      text: "لا يأتي جواب «إذا» إلا في البيت التالي، فيبقى السامع معلقًا بين الشرط وجوابه، كما يبقى القوم معلقين بين الإقدام والإحجام. والتضمين عند ابن رَشِيق: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
    - title: "الإبهام في «الْهَوْلِ الْمُشَبَّهِ أَنْ يَكُونَا»"
      text: "لم يحدد الخطر، بل جعله هولًا يُتوقع ولا يُعرف. والمجهول أخوف من المعلوم. وهذه قراءتنا."
    - title: "التعبير السائر «عَيَّ بِالْإِسْنَافِ»"
      text: "عبارة صارت مثلًا لمن تحيّر في أمره، كما في «اللسان»، فالشاعر يستعمل لغة الأمثال."
  connection: "ثم يأتي الجواب: «نصبنا مثل رهوة ذات حد»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "إِذَا مَا عَيْ / يَ بِلْإِسْنَا / فِ حَيْيُنْ = مفاعَلْتن / مفاعَلْتن / فعولن — مِنَلْ هَوْلِلْ / مُشَبْبَهِ أَنْ / يَكُونَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب، وأول بيتين متعلقين (37–38). وهو عند الزَّوْزَنِيّ البيت الخامس والأربعون [@zawzani، ص225]."
