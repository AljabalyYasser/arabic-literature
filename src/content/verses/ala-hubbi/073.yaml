first: "وَقَدْ عَلِمَ الْقَبَائِلُ مِنْ مَعَدٍّ"
second: "إِذَا قُبَبٌ بِأَبْطَحِهَا بُنِينَا"
meaning: "وقد علمت قبائل مَعَدّ كلها، حين تُضرب قبابها في الأبطح، ما يأتي في البيت التالي: أنّا نحمي ونعطي. قال ابن الأَنْبارِيّ: «ومعنى البيت: وقد علم القبائل» إذا ضُربت القباب «أنَّا سادة العرب وأشرافهم» [@ibn-al-anbari، ص417]. ونقل عن أبي جَعْفَر: «أراد أبطح مكة الذي يجتمع من كل وجه. وقال: المعنى قد علم الناس كلهم أنا أشرافهم وساداتهم» [@ibn-al-anbari، ص418]."
vocabulary:
  - term: "مَعَدٍّ"
    text: "اسم يجمع القبائل المنتسبة إلى مَعَدّ بن عدنان، وتَغْلِب وبكر منها."
  - term: "قُبَبٌ"
    text: "خيام مستديرة. «القبب والقباب جمعا قبة» [@zawzani، ص234]."
  - term: "أَبْطَحِهَا"
    text: "«(الأبطح) : وادٍ فيه حصى» [@ibn-al-anbari، ص417]. وقال التِّبْرِيزِيّ: «والأبطح والبطحاء: بطن الوادي يكون فيه رمل وحصى كأنه المكان المنبطح» [@tabrizi-ashr، ص244]. وفي اللسان: «الأَبْطَحُ مَسِيل واسِع فِيهِ دُقاقُ الحَصى» [@lisan، ج2 ص413]."
syntax:
  - "«الْقَبَائِلُ» فاعل «عَلِمَ»، وذُكّر الفعل لأن الفاعل جمع تكسير. و«مِنْ مَعَدٍّ» متعلق بمحذوف نعت للقبائل. ومفعول «علم» في البيت التالي: «بأنّا العاصمون»."
  - "«والقبب رفع بما عاد من بنينا، والباء صلة قُبب» [@ibn-al-anbari، ص418]: أي أن «قُبَبٌ» مرفوع بفعل يفسّره «بُنِينَا»، لأن «إذا» لا يليها إلا فعل، و«بِأَبْطَحِهَا» متعلق بالفعل. والضمير في «أبطحها» لمَعَدّ أو للقبائل."
  - "«بُنِينَا» ماضٍ مبني للمجهول اتصلت به نون النسوة العائدة على القبب، والألف للإطلاق."
morphology:
  - "«قُبَب» جمع «قُبَّة» على «فُعَل»، قال التِّبْرِيزِيّ: «ويقال: قُبَّة وقُبب وقباب وقِبب» [@tabrizi-ashr، ص244]."
  - "«أَبْطَح» على «أَفْعَل» اسم للمكان، من «بَطَحَ» إذا بسط."
  - "«بُنِينَ» ماضي «بَنَى» الناقص مبنيًّا للمجهول، ردّت ياؤه حين اتصل بنون النسوة."
rhetoric:
  thesis: "يجعل العرب كلها شهودًا على مجد قومه، في أكثر مواضع الاجتماع ظهورًا."
  devices:
    - title: "التضمين"
      text: "التضمين أن يتعلق البيت بما بعده فلا يتم معناه إلا به. فـ«علم القبائل» لا يُعرف معلومه إلا في البيت التالي: «بأنّا العاصمون بكل كحل»، فيبقى السامع منتظرًا الجواب."
    - title: "الكناية في «إِذَا قُبَبٌ بِأَبْطَحِهَا بُنِينَا»"
      text: "ضرب القباب في الأبطح كناية عن اجتماع الناس في مواسمهم، وهو عند أبي جَعْفَر أبطح مكة [@ibn-al-anbari، ص418]. فالمعنى أن مجدهم معلوم حيث تجتمع العرب كلها. والكناية أن يُذكر لازم المعنى ويُراد المعنى نفسه."
    - title: "الإسناد إلى «الْقَبَائِلُ»"
      text: "لم يقل «علمت قبيلة»، بل القبائل كلها، فصار المجد خبرًا متواترًا عند الناس جميعًا."
  connection: "ثم يأتي ما علمته القبائل: «بأنّا العاصمون بكل كحل»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَقَدْ عَلِمَلْ / قَبَائِلُ مِنْ / مَعَدْدِنْ = مفاعلتن / مفاعلتن / فعولن — إِذَا قُبَبُنْ / بِأَبْطَحِهَا / بُنِينَا = مفاعلتن / مفاعلتن / فعولن"
  note: "جاء الحشو كله على الأصل «مفاعلتن» بلا عَصْب، والعَصْب «تسكين الحرف الخامس» [@atiq، ص54]. وفي نص ابن الأَنْبارِيّ على المكتبة الشاملة «يُنِينَا» بالياء، وصوابه «بُنِينَا» كما في شرحه: «والقبب رفع بما عاد من بنينا» [@ibn-al-anbari، ص418]، وكما في رواية الزَّوْزَنِيّ والتِّبْرِيزِيّ."
context: "يفتتح شهادة القبائل (73–77)، وهي سلسلة تبدأ أبياتها بـ«أنّا». وجاء عند الزَّوْزَنِيّ في آخر القصيدة تقريبًا، بعد أبيات النساء [@zawzani، ص234]."
variants:
  - reading: "وَقَدْ عَلِمَ الْقَبَائِلُ غَيْرَ فَخْرٍ"
    status: "رواية أخرى"
    note: "«ويروى: (وقد علم القبائل غير فخر)»، «(غير فخر) ، يريد ما نفخر به: لأن عزنا وشرفنا أعظم من أن نفخر به» [@ibn-al-anbari، ص417]، «ونصب (غير فخر) على مذهب المصدر، أراد قولا غير فخر» [@ibn-al-anbari، ص418]. وبها رواية الجَمْهَرة [@jamhara، ص294]."
