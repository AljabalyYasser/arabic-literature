first: "وَكُنَّا الْأَيْمَنِينَ إِذَا الْتَقَيْنَا"
second: "وَكَانَ الْأَيْسَرِينَ بَنُو أَبِينَا"
meaning: "كنا يوم التقينا بالعدو أصحاب الميمنة، وكان إخواننا بنو أبينا أصحاب الميسرة. قال ابن الأَنْبارِيّ: «معناه: وكنا أصحاب اليمين وكان بنو أبينا أصحاب الشمال» [@ibn-al-anbari، ص411]. وفيه قولان: أنه موضعهم في صفوف القتال، قال ابن السِّكِّيت: «أي كنا يوم خزازي في الميمنة وكان بنو عمنا في الميسرة» [@tabrizi-ashr، ص241]؛ أو أنه التقدم والتأخر، قال أبو العَبّاس ثَعْلَب: «أصحاب الميمنة: أصحاب التقدم، وأصحاب المشأمة: أصحاب التأخر» [@ibn-al-anbari، ص411]."
vocabulary:
  - term: "الْأَيْمَنِينَ"
    text: "أصحاب الميمنة، أي الجناح الأيمن من الجيش، أو المقدَّمين."
  - term: "الْأَيْسَرِينَ"
    text: "أصحاب الميسرة، أي الجناح الأيسر، أو المؤخَّرين."
  - term: "بَنُو أَبِينَا"
    text: "بنو عمنا، كما في قول ابن السِّكِّيت [@tabrizi-ashr، ص241]، وهم بكر بن وائل إخوة تَغْلِب بن وائل."
syntax:
  - "«وبنو أبينا اسم كان، والأيسرين خبر كان. ويجوز في النحو: وكان الأيسرون بني أبينا، على أن تجعل الأيسرين الاسم وبني أبينا الخبر» [@ibn-al-anbari، ص411]. واختيار الوجه الأول عند الفَرّاء أن الصفة المتغيرة أولى بالخبر، والنسب الثابت أولى بالاسم: «إذا قلت كان القائم أخوك، كان الوجه رفع الأخ ونصب القائم؛ لأن القائم ينتقل إذ كان فعلا محدثا ينقطع، والأخوة لا تنقطع لأنها نسب متصل» [@ibn-al-anbari، ص411–412]."
  - "«كُنَّا»: «كان» واسمها «نا»، و«الْأَيْمَنِينَ» خبرها منصوب بالياء. و«إِذَا الْتَقَيْنَا» ظرف."
morphology:
  - "«الْأَيْمَن» و«الْأَيْسَر» صفتان على «أَفْعَل»، جُمعتا جمع مذكر سالمًا."
  - "«الْتَقَيْنَا» على «افْتَعَلَ» من «لَقِيَ»، وفيه معنى المشاركة."
  - "«أَبِينَا» من الأسماء الستة، مجرور بالياء."
rhetoric:
  thesis: "يقسم ميدان خَزَاز بين القبيلتين الأختين، ويعطي قومه الجانب الأشرف."
  devices:
    - title: "الكناية في «الْأَيْمَنِينَ» و«الْأَيْسَرِينَ»"
      text: "على قول ثَعْلَب، اليمين كناية عن التقدم والشمال عن التأخر، واستشهد ابن الأَنْبارِيّ بقول ابن الدُّمَيْنة: «أبِيني ففي يمنَي يديك جعلتِني ... فأفرحَ أمْ صيَّرتِني في شِمالكِ»، «فمعناه: أأنا من المقدمين عندك أم من المؤخرين» [@ibn-al-anbari، ص411]. والكناية عند عبد القاهر الجُرْجانيّ أن يترك المتكلم لفظ المعنى، «ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. فظاهر البيت موضع في الصف، وتحته دعوى السبق على بكر."
    - title: "الطباق في «الْأَيْمَنِينَ» و«الْأَيْسَرِينَ»"
      text: "المطابقة «جمعك بين الضدين في الكلام أو بيت الشعر» [@ibn-rashiq، ج2 ص5]، وهنا الضدان في موضعين متقابلين من الشطرين."
    - title: "اللين في «بَنُو أَبِينَا»"
      text: "لم يسمّ بكرًا، بل سمّاهم بني أبيه، فذكّر بالقرابة وهو يفاخرهم بين يدي الملك. وهذه قراءتنا."
  connection: "ثم يصف الحملتين: «فصالوا صولة فيمن يليهم»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَكُنْنَلْ أَيْ / مَنِينَ إِذَلْ / تَقَيْنَا = مفاعلْتن / مفاعلتن / فعولن — وَكَانَلْ أَيْ / سَرِينَ بَنُو / أَبِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين. وسقطت همزة الوصل في «الْتَقَيْنَا» فاتصلت اللام بما قبلها: «إِذَلْ»."
context: "من أبيات يوم خَزَاز (58–64)، ومما أنشده أبو عَمْرو بن العَلاء في خبر ذلك اليوم [@iqd، ج6 ص98]. وللزَّوْزَنِيّ قول آخر في مناسبته، فهو عنده يصف بلاءهم «في حرب نزار واليمن عندما قتل كليب وائل لبيد بن عنق الغساني عامل ملك غسان على تغلب حين لطم أخت كليب وكانت تحته» [@zawzani، ص230]."
