first: "لَنَا الدُّنْيَا وَمَا أَمْسَى عَلَيْهَا"
second: "وَنَبْطِشُ حِينَ نَبْطِشُ قَادِرِينَا"
meaning: "الدنيا لنا وكل ما عليها، وإذا بطشنا بطشنا قادرين لا يردّنا أحد. ولم يشرحه ابن الأَنْبارِيّ ولا التِّبْرِيزِيّ، وليس في رواية الزَّوْزَنِيّ، فهذا المعنى قراءتنا."
vocabulary:
  - term: "أَمْسَى عَلَيْهَا"
    text: "صار عليها، أي كل ما على الأرض."
  - term: "نَبْطِشُ"
    text: "نأخذ بشدة وعنف. وفي اللسان: «البَطْش: التَّنَاوُلُ بِشِدَّةٍ عِنْدَ الصَّوْلة والأَخذُ الشديدُ فِي كُلِّ شَيْءٍ بطشٌ» [@lisan، ج6 ص267]."
  - term: "قَادِرِينَا"
    text: "متمكّنين لا يعجزنا شيء."
syntax:
  - "«لَنَا» متعلق بمحذوف خبر مقدّم، و«الدُّنْيَا» مبتدأ مؤخر، و«وَمَا» معطوف عليها، و«ما» اسم موصول. و«أَمْسَى» فعل ناقص بمعنى صار، واسمه ضمير يعود على «ما»، و«عَلَيْهَا» متعلق بمحذوف خبره، والجملة صلة الموصول."
  - "«حِينَ» ظرف زمان مضاف إلى جملة «نَبْطِشُ»، و«قَادِرِينَا» حال من فاعل «نَبْطِشُ» الأول، منصوب بالياء، والألف للإطلاق."
morphology:
  - "«الدُّنْيَا» مؤنث «الأدنى» على «فُعْلَى»، صفة غلبت فصارت اسمًا للحياة الأولى."
  - "«نَبْطِشُ» مضارع «بَطَشَ»، ويقال فيه الضم والكسر: «بَطَشَ يَبْطُشُ ويَبْطِشُ بَطْشاً» [@lisan، ج6 ص267]."
  - "«قَادِرِين» جمع «قَادِر» اسم فاعل من «قَدَرَ»."
rhetoric:
  thesis: "أول الأبيات الثلاثة التي يرويها بعض الرواة بعد الخاتمة، وفيها يبلغ الفخر أقصى الغلو: الدنيا كلها ملك القبيلة."
  devices:
    - title: "الغلو في «لَنَا الدُّنْيَا وَمَا أَمْسَى عَلَيْهَا»"
      text: "الغلو تجاوز الحد في الوصف. ويذكر ابن رَشِيق أن «من أسمائه أيضاً الإغراق، والإفراط»، وينقل حدّه عن قُدامة: «والغلو عند قدامة: تجاوز في نعت ما للشيء أن يكون عليه، وليس خارجاً عن طباعه» [@ibn-rashiq، ج2 ص60–61]. وملك الدنيا كلها خارج عن طبع القبيلة، فهو أبعد من الغلو الذي يقبله قُدامة."
    - title: "التكرار في «نَبْطِشُ حِينَ نَبْطِشُ»"
      text: "الفعل نفسه في الشرط والحال، فلا يُذكر للبطش سبب ولا غاية: هو يقع متى أرادوه، ويقع قادرًا."
  connection: "ويتبعه في الرواية نفسها: «بغاةً ظالمين وما ظُلمنا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "لَنَدْ دُنْيَا / وَمَا أَمْسَى / عَلَيْهَا = مفاعلْتن / مفاعلْتن / فعولن — وَنَبْطِشُ حِي / نَ نَبْطِشُ قَا / دِرِينَا = مفاعلتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر، وجاء العَجُز على الأصل."
context: "يقدّم ابن الأَنْبارِيّ هذا البيت والبيتين بعده بعد البيت 91، ويقول: «وهو البيت آخر القصيدة في رواية أكثر الناس. وروى بعض الرواة فيها بعد البيت الماضي ثلاثة أبيات» [@ibn-al-anbari، ص427]. فهي عنده أبيات في رواية بعض الرواة، لا في رواية الأكثر، ولم يشرح منها إلا إعراب «البحر» في الثالث. ثم يقول: «عرف أبو جعفر البيت الأخير» [@ibn-al-anbari، ص428]، أي أن أبا جَعْفَر لم يعرف هذا البيت ولا الذي بعده. وهو في رواية التِّبْرِيزِيّ في موضع آخر، قبل «إذا ما الملك سام الناس خسفًا» [@tabrizi-ashr، ص248]، وفي الجَمْهَرة [@jamhara، ص298]، وليس في رواية الزَّوْزَنِيّ."
