first: "إِذَا وُضِعَتْ عَنِ الْأَبْطَالِ يَوْمًا"
second: "رَأَيْتَ لَهَا جُلُودَ الْقَوْمِ جُونَا"
meaning: "إذا نزع الأبطال دروعهم يومًا رأيت جلودهم سودًا من أثرها. قال ابن الأَنْبارِيّ: «يقول: إذا وضعت الدروع عن الأبطال يوما رأيت جلودهم سودا من صدأ الحديد. وقال أبو جعفر: معناه من طول لبسهم إياها اتسخت جلودهم. ولم يرد أن درنها على الجلود» [@ibn-al-anbari، ص416]. وقال الزَّوْزَنِيّ: «إذا خلعها الأبطال يومًا رأيت جلودهم سودًا للبسهم إياها» [@zawzani، ص231]."
vocabulary:
  - term: "وُضِعَتْ"
    text: "نُزعت عنهم."
  - term: "الْأَبْطَالِ"
    text: "«الأبطال: جمع بطل وهو الشجاع الذي يبطل دماء أقرانه» [@zawzani، ص223]، أي يُذهبها هدرًا فلا يُثأر لها."
  - term: "جُونَا"
    text: "«(الجون) : السُّود» [@ibn-al-anbari، ص416]. وهو من الأضداد، قال الزَّوْزَنِيّ: «الْجَون: الأسود والجون الأبيض، والجمع الجون» [@zawzani، ص231]. وفي اللسان: «الجَوْنُ: الأَسْوَدُ اليَحْمُوميُّ» [@lisan، ج13 ص101]، أي الشديد السواد."
syntax:
  - "«إِذَا» ظرف شرطي، وجملة «وُضِعَتْ» في محل جر بإضافته إليها، ونائب الفاعل ضمير الدروع. و«رَأَيْتَ» جواب «إذا»."
  - "«والجلود منصوبة برأيت، والجون كذلك، والتأويل: ورأيت من أجلها جلود القوم» [@ibn-al-anbari، ص416]: أي أن اللام في «لَهَا» للتعليل، واستشهد بقوله تعالى: {وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ}، «فمعناه من أجل حب المال لبخيل» [@ibn-al-anbari، ص416]. وقال الزَّوْزَنِيّ: «قوله: لها، أي للبسها» [@zawzani، ص231]."
  - "«يَوْمًا» ظرف زمان، و«جُونَا» منصوب، مفعول ثانٍ أو حال، والألف للإطلاق."
morphology:
  - "«جُون» جمع «جَوْن»، قال التِّبْرِيزِيّ: «ويقال: أن الجُون جمع جون والأصل فيه على هذا أن يكون على فُعُول، حذفت منه الواو لالتقاء الساكنين» [@tabrizi-ashr، ص243]."
  - "«الْأَبْطَال» جمع «بَطَل» على «أَفْعَال»."
  - "«وُضِعَتْ» ماضي «وَضَعَ» مبنيًّا للمجهول، مثال واوي."
rhetoric:
  thesis: "سواد الجلد شاهد على أن الحرب عندهم دائمة: لا يخلعون الدروع إلا نادرًا، فإذا خلعوها ظهر أثرها."
  devices:
    - title: "الكناية في «جُلُودَ الْقَوْمِ جُونَا»"
      text: "لم يقل: نحن في حرب لا تنقطع، بل ذكر أثرها على الجلد. وهذا بعينه ما يحدّ به عبد القاهر الجُرْجانيّ الكناية: أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. فسواد الجلد تالٍ لطول اللبس، وطول اللبس تالٍ لدوام القتال."
    - title: "الإيحاء في «يَوْمًا»"
      text: "«يومًا» نكرة توحي بالندرة: يومٌ ما، قلّما يأتي، تُخلع فيه الدروع. وهذه قراءتنا."
  connection: "ثم يشبّه الدروع بالغدران تضربها الرياح."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "إِذَا وُضِعَتْ / عَنِلْ أَبْطَا / لِ يَوْمَنْ = مفاعلتن / مفاعلْتن / فعولن — رَأَيْتَ لَهَا / جُلُودَلْ قَوْ / مِ جُونَا = مفاعلتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الثانية من الشطرين."
context: "من أبيات السلاح (67–70)، يتوسط وصف الدروع: قبله سعتها، وبعده بريقها. وهو في الجَمْهَرة بعد تشبيه الدروع بالغدران (البيت 70) لا قبله [@jamhara، ص293]."
variants:
  - reading: "إِذَا وُضِعَتْ عَلَى الْأَبْطَالِ يَوْمًا"
    status: "رواية أخرى"
    note: "«ويروى: (إذا وضعت على الأبطال يوما)» [@ibn-al-anbari، ص416]، وذكرها التِّبْرِيزِيّ [@tabrizi-ashr، ص243]. والمعنى على هذه الرواية: إذا لُبست."
