first: "إِذَا عَضَّ الثِّقَافُ بِهَا اشْمَأَزَّتْ"
second: "وَوَلَّتْهُمْ عَشَوْزَنَةً زَبُونَا"
meaning: "إذا شدّ الثِّقاف على قناتنا ليقوّمها نفرت منه، وردّت على من يعالجها قناةً صلبة تدفع وتضرب. وهو مثل لعزّ قومه، قال الزَّوْزَنِيّ: «جعل القناة التي لا يتهيأ تقويمها مثلًا لعزتهم التي لا تضعضع، وجعل قهرها من تعرض لهدمها كنفار القناة من التقويم والاعتدال» [@zawzani، ص228]."
vocabulary:
  - term: "الثِّقَافُ"
    text: "«ما تقوم به الرماح» [@ibn-al-anbari، ص404]، وهو عند الزَّوْزَنِيّ «الحديدة التي يقوم بها الرمح» [@zawzani، ص228]. وفي اللسان عن أبي حَنِيفة: «الثِّقافُ خَشَبَةٌ قَوية قَدْرَ الذِّراع فِي طرَفها خَرق» [@lisan، ج9 ص20]، تُدخل فيه القناة وتُغمز حتى تستقيم. واستشهد ابن الأَنْبارِيّ بقول ابن مسعود في قوم يأتون «يثقفونه وليسوا بخياركم»، يعني القرآن، أي «يقوّمون حروفه كما يثقف المثقف الرمح» [@ibn-al-anbari، ص404]."
  - term: "عَضَّ"
    text: "لزمها وشدّ عليها: «وعَضَّ الثِّقافُ بأَنابِيبِ الرُّمْحِ عَضّاً وعَضَّ عَلَيْهَا: لَزِمَها» [@lisan، ج7 ص188]."
  - term: "اشْمَأَزَّتْ"
    text: "«معناه نفرت» [@ibn-al-anbari، ص404]."
  - term: "عَشَوْزَنَةً"
    text: "«شديدة صلبة» [@ibn-al-anbari، ص404]. وفي اللسان عن الجَوْهَرِيّ: «العَشَوْزنُ الصُّلْبُ الشَّدِيدُ الْغَلِيظُ»، واستشهد بالبيت [@lisan، ج13 ص286]."
  - term: "زَبُونَا"
    text: "«تضرب برجليها وتدفع» [@ibn-al-anbari، ص404]، «وأصله من قولهم: زبنت الناقة حالبها، إذا ضربته بثفنات رجليها أي بركبتيها» [@zawzani، ص228]."
syntax:
  - "«إِذَا» ظرف لما يُستقبل من الزمان فيه معنى الشرط، وجملة «عَضَّ الثِّقَافُ» في محل جر بإضافة «إذا» إليها، و«بِهَا» متعلق بـ«عَضَّ»، والضمير للقناة في البيت قبله. و«اشْمَأَزَّتْ» جواب «إذا»."
  - "«وَوَلَّتْهُمْ» معطوف على «اشْمَأَزَّتْ». والضمير «هم» للأعداء في البيت قبله، قال ابن الأَنْبارِيّ: «فمن جمع رد الهاء على الأعداء، ومن وحد ردها على واحد الأعداء» [@ibn-al-anbari، ص405]."
  - "«والعشوزنة نصب بولت، والزبون نعت العشوزنة» [@ibn-al-anbari، ص404]: أي أن «عَشَوْزَنَةً» منصوبة بالفعل «وَلَّتْ»، و«زَبُونَا» نعت لها، والألف للإطلاق، أي لمدّ القافية."
morphology:
  - "«الثِّقَاف» على «فِعَال»، من «ثَقَّفَ الرمح» إذا قوّمه: «وقد ثقفته: قومته» [@zawzani، ص228]، وجمعه «ثُقُف» [@lisan، ج9 ص20]."
  - "«اشْمَأَزَّ» رباعي مزيد على «افْعَلَلَّ»، كـ«اطمأنّ» و«اقشعرّ»، ويدل على النفور والانقباض."
  - "«عَشَوْزَنَة» مؤنث «عَشَوْزَن»، «وَجَمْعُ العَشَوْزَنِ عَشاوِزُ» [@lisan، ج13 ص286]."
  - "«زَبُون» على «فَعُول» من «زَبَنَ» إذا دفع، وهو بناء يستوي فيه المذكر والمؤنث، فلذلك وُصفت به القناة بلا تاء. ومن مادته «الزبانية»، قال ابن الأَنْبارِيّ: «والزبانية عند العرب: الأشداء» [@ibn-al-anbari، ص404]."
rhetoric:
  thesis: "يمضي في المثل الذي بدأه في البيت قبله: قناة قومه لا تلين. ولا تكتفي القناة بالامتناع، بل تدفع من يعالجها كما تدفع الناقة الشَّموس حالبها."
  devices:
    - title: "التمثيل في «الثِّقَافُ» و«اشْمَأَزَّتْ»"
      text: "القناة عزّ تَغْلِب، والثقاف من يريد إذلالهم، والنفور امتناعهم. قال ابن الأَنْبارِيّ في البيت قبله: «وهذا مثل» [@ibn-al-anbari، ص404]، وقال الزَّوْزَنِيّ: «العرب تستعير للعز اسم القناة» [@zawzani، ص227]. وهذا ما يسميه عبد القاهر الجُرْجانيّ تمثيلًا، أي تشبيه حال بحال لا يظهر الشبه بينهما للعين، بل يكون «محصّلاً بضرب من التأوّل» [@asrar، ص90]، «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "الاستعارة في «اشْمَأَزَّتْ» و«زَبُونَا»"
      text: "النفور والدفع بالرجلين من صفات الدابة، فأجراهما على القناة وطوى ذكر الدابة. وهي الاستعارة كما يحدّها عبد القاهر: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. فالقناة في البيت ناقة صعبة لا تُحلب، والزَّوْزَنِيّ يردّ «الزبون» إلى الناقة التي تضرب حالبها [@zawzani، ص228]."
  connection: "ويتم الصورة في البيت التالي: القناة إذا انقلبت في الثِّقاف صوّتت وأصابت قفا من يقوّمها وجبينه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "إِذَا عَضْضَثْ / ثِقَافُ بِهَشْ / مَأَزْزَتْ = مفاعلْتن / مفاعلتن / فعولن — وَوَلْلَتْهُمْ / عَشَوْزَنَتَنْ / زَبُونَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين، فصارت «مفاعلْتن». والعَرُوض والضرب، أي آخر تفعيلة في الصدر وفي العَجُز، «فعولن»، وأصلهما «مفاعلتن» دخلها القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وسقطت همزة الوصل في «اشْمَأَزَّتْ» في الدرج، فاتصلت الشين بما قبلها: «بِهَشْ»."
context: "ثاني أبيات القناة (47–49)، وهي جواب عَمْرو عن وعيد الملك عَمْرو بن هند في البيت 46: لم تلن قناتنا لأعدائنا قبلك، فلن تلين لك. ويستشهد به صاحب اللسان مع البيت التالي في مادة «عشزن» [@lisan، ج13 ص286]."
variants:
  - reading: "وَوَلَّتْهُ عَشَوْزَنَةً زَبُونَا"
    status: "رواية أخرى"
    note: "«ويروى في البيت الأول: (ولته عشوزنة) بالتوحيد» [@ibn-al-anbari، ص405]. وبها رواية الزَّوْزَنِيّ [@zawzani، ص227] والجَمْهَرة [@jamhara، ص288]، والضمير على هذه الرواية للثِّقاف عند الزَّوْزَنِيّ: «وولت الثقاف قناة صلبة شديدة دفوعًا» [@zawzani، ص228]."
