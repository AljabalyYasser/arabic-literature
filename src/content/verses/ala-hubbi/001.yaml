first: "أَلَا هُبِّي بِصَحْنِكِ فَاصْبَحِينَا"
second: "وَلَا تُبْقِي خُمُورَ الْأَنْدَرِينَا"
meaning: "ألا استيقظي أيتها الساقية، واسقينا شراب الصباح بقدحك الكبير، ولا تدّخري شيئًا من خمور الأَنْدَرِين [@zawzani، ص215]."
vocabulary:
  - term: "هُبِّي"
    text: "قومي [@ibn-al-anbari، ص371]؛ من «هبّ من نومه» إذا استيقظ [@zawzani، ص215]."
  - term: "الصحن"
    text: "القدح الضخم الواسع [@ibn-al-anbari، ص371]."
  - term: "اصْبَحِينَا"
    text: "اسقينا الصَّبوح، وهو شرب الغداة [@ibn-al-anbari، ص371]."
  - term: "الْأَنْدَرِينَ"
    text: "قرية بالشام كثيرة الخمر [@ibn-al-anbari، ص371]."
syntax:
  - "«أَلَا» حرف استفتاح، و«هُبِّي» فعل أمر، علامة جزمه حذف النون [@ibn-al-anbari، ص371]."
  - "«فَاصْبَحِينَا» معطوف على «هُبِّي» بالفاء، و«وَلَا تُبْقِي» نهي مجزوم بـ«لا»، وعلامة جزمه حذف النون كذلك [@ibn-al-anbari، ص372]."
  - "«الْأَنْدَرِينَا»: فُتحت نونه لأنه مشبّه بجمع المذكر، والألف بعدها لإطلاق القافية؛ ويقال في رفعه: الأندرون [@ibn-al-anbari، ص372]."
morphology:
  - "«اصبحينا» من «الصَّبوح»، وهو شراب الصباح؛ يقال: صبَحه يصبَحه إذا سقاه الصبوح [@zawzani، ص215]."
  - "«أبقيت الشيء» و«بقّيته» بمعنى واحد [@zawzani، ص215]."
  - "«الصحن» جمعه «صحون» [@zawzani، ص215]."
rhetoric:
  thesis: "يخالف عَمْرو المطالع كلها: لا أطلال ولا بكاء، بل دعوة إلى الشراب في أول النهار. والمطلع يمهّد لقصيدة فخر: قوم يشربون في الصباح بلا ادّخار ولا خوف."
  devices:
    - title: "المطلع الخمري"
      text: "من بين المعلقات السبع لا يبدأ بالخمر إلا عَمْرو بن كُلْثُوم؛ فأبيات الخمر هنا تقوم مقام الوقوف على الأطلال."
    - title: "تتابع الطلب"
      text: "«هُبّي، فاصبحينا، ولا تُبقي»: ثلاثة أفعال طلب متتابعة في بيت واحد، تعطي المطلع حركة وعجلة."
  connection: "ثم يصف الخمر ممزوجة بالماء، وكيف تجعل البخيل مهينًا لماله [@ibn-al-anbari، ص372–373]."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "أَلَا هُبْبِي / بِصَحْنِكِ فَصْ / بَحِينَا = مفاعَلْتن / مفاعلَتن / فعولن — وَلَا تُبْقِي / خُمُورَلْ أَنْ / دَرِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. ويدخل حَشْوُه العَصْب، وهو تسكين الخامس، فتصير «مفاعلَتن» «مفاعَلْتن» [@atiq، ص54]، وقد دخل ثلاث تفعيلات هنا."
context: "مطلع معلقة عَمْرو بن كُلْثُوم. ويروي ابن الأَنْبارِيّ أنه أنشدها بين يدي عَمْرو بن هند في خصومة بين تَغْلِب وبَكْر، «فلما فرغ منها ظن الناس أنها لا يعدلها شيء» [@ibn-al-anbari، ص371]."
