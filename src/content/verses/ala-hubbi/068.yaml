first: "عَلَيْنَا كُلُّ سَابِغَةٍ دِلَاصٍ"
second: "تَرَى فَوْقَ النِّجَادِ لَهَا غُضُونَا"
meaning: "علينا كل درع واسعة لينة برّاقة، تطول حتى ترى فضولها مثنية فوق حمائل السيوف. قال الزَّوْزَنِيّ: «وكانت علينا كل درع واسعة براقة ترى أيها المخاطب فوق المنطقة لها غضونًا لسعتها وسبوغها» [@zawzani، ص231]. ونقل ابن الأَنْبارِيّ عن أبي جَعْفَر: «معناه تثنى الدرع، للينها وسهولتها تتثني على النجاد. يصف أنها قديمة عتيقة، ليست بمحدثة فتكون منتصبة» [@ibn-al-anbari، ص415]."
vocabulary:
  - term: "سَابِغَةٍ"
    text: "«السابغة: الدرع الواسعة التامة» [@zawzani، ص231]. وفي اللسان: «سَبَغَتِ الدِّرْعُ، وكلُّ شيءٍ طالَ إِلَى الأَرض، فَهُوَ سابِغٌ» [@lisan، ج8 ص433]."
  - term: "دِلَاصٍ"
    text: "«المحكمة، ويقال هي السهلة اللينة» [@ibn-al-anbari، ص415]، و«الدِّلاص: البراقة» [@zawzani، ص231]. وفي اللسان: «ودِرعٌ دِلاصٌ: بَرَّاقَةٌ مَلْسَاءُ لَيِّنَةٌ بَيّنةُ الدَّلَصِ» [@lisan، ج7 ص37]."
  - term: "النِّجَادِ"
    text: "«حمائل السيف» [@ibn-al-anbari، ص415]، أي السير الذي يُعلّق به السيف على الكتف."
  - term: "غُضُونَا"
    text: "«فضول الدرع تفضل من الرجل فيشمرها» [@ibn-al-anbari، ص415]. وفي اللسان: «الغَضْنُ والغَضَنُ: الكَسْرُ فِي الجِلْد وَالثَّوْبِ وَالدِّرْعِ وَغَيْرِهَا، وَجَمْعُهُ غُضُون» [@lisan، ج13 ص314]."
syntax:
  - "«عَلَيْنَا» متعلق بمحذوف خبر مقدم، و«كُلُّ» مبتدأ مؤخر، و«سَابِغَةٍ» مضاف إليه، و«دِلَاصٍ» نعت لها."
  - "«تَرَى» مضارع فاعله ضمير المخاطب، و«غُضُونَا» مفعول به، و«فَوْقَ» ظرف، و«لَهَا» متعلق بمحذوف حال من «غضونا» تقدّم عليها. والجملة نعت ثانٍ لـ«سابغة»."
morphology:
  - "«دِلَاص» على «فِعَال»، يكون للمفرد والجمع: «وَقَدْ يَكُونُ الدِّلاصُ جَمْعًا مكسَّراً، وَلَيْسَ مِنْ بَابِ جُنُب لِقَوْلِهِمْ دِلاصان؛ حَكَاهُ سِيبَوَيْهِ» [@lisan، ج7 ص37]، أي أنه يُثنّى، فليس وصفًا جامدًا يستوي فيه العدد."
  - "«سَابِغَة» اسم فاعل مؤنث من «سَبَغَ»، صار اسمًا للدرع لكثرة وصفها به."
  - "«غُضُون» جمع «غَضْن»: «ويقال: إنه جمع غضن كفلس وفُلُوس» [@tabrizi-ashr، ص243]."
rhetoric:
  thesis: "دروع طويلة لينة قديمة، والقِدم هنا فخر: سلاح لُبس في حروب كثيرة."
  devices:
    - title: "الكناية في «تَرَى فَوْقَ النِّجَادِ لَهَا غُضُونَا»"
      text: "الثنيات فوق الحمائل أثر يدل على طول الدرع ولينها، وعلى قِدمها عند أبي جَعْفَر [@ibn-al-anbari، ص415]. فذكر الأثر وأراد صفة الدرع، وهي الكناية عند عبد القاهر الجُرْجانيّ: أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "حذف الموصوف في «سَابِغَةٍ دِلَاصٍ»"
      text: "لم يذكر الدرع، بل ذكر صفتيها، فقامت الصفة مقام الاسم. والحذف عند عبد القاهر باب «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "الخطاب العام في «تَرَى»"
      text: "لا يقصد مخاطبًا بعينه، بل يدعو كل سامع إلى أن يرى الدروع بعينه، فيصير الوصف مشهدًا."
  connection: "ثم يصف ما تتركه الدروع على أجساد لابسيها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "عَلَيْنَا كُلْ / لُ سَابِغَتِنْ / دِلَاصِنْ = مفاعلْتن / مفاعلتن / فعولن — تَرَى فَوْقَنْ / نِجَادِ لَهَا / غُضُونَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين."
context: "من أبيات السلاح (67–70). واستشهد ابن الأَنْبارِيّ لتشمير فضول الدرع بقول زُهَيْر: «ومفاضة كالنِّهي تنِسُجُه الصَّبا ... بيْضاءَ كَفَّتْ فضلَها بمهنَّدِ»، «يعني إنه علَّق الدرع بمعلاق في السيف» [@ibn-al-anbari، ص415]. ويستشهد بالبيت صاحب اللسان في مادتي «دلص» و«غضن» [@lisan، ج7 ص37]، [@lisan، ج13 ص314]."
