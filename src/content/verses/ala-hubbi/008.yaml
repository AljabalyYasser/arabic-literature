first: "قِفِي نَسْأَلْكِ هَلْ أَحْدَثْتِ وَصْلًا"
second: "لِوَشْكِ الْبَيْنِ أَمْ خُنْتِ الْأَمِينَا"
meaning: "قفي نسألك: هل أحدثتِ وصلًا جديدًا لقرب الفراق، أم خنت المحب الوفي؟ هذا على رواية ابن الأَنْبارِيّ «وصلا»، وقد شرح البين بمعنيين: «والبين: الفراق. والبيْن: الوصال» [@ibn-al-anbari، ص377]. ويرويه الزَّوْزَنِيّ «صرما»، أي قطيعة، ويقول: «أي هل دعتك سرعة الفراق إلى القطيعة أو إلى الخيانة في مودة من لا يخونك في مودته إياك؟» [@zawzani، ص217]. والأمين هو الشاعر نفسه."
vocabulary:
  - term: "نَسْأَلْكِ"
    text: "مجزوم في جواب الأمر، والأصل «نسألُكِ»."
  - term: "وَصْلًا"
    text: "مودة وصلة. ويُروى «صرما»، و«الصرم: القطيعة» [@ibn-al-anbari، ص377]."
  - term: "وَشْكِ"
    text: "«سرعته» [@ibn-al-anbari، ص377]، و«الوَشِيك: السَّرِيعُ» [@lisan، ج10 ص513]."
  - term: "الْبَيْنِ"
    text: "من الأضداد: «والبين: الفراق. والبيْن: الوصال» [@ibn-al-anbari، ص377]، والمراد هنا الفراق."
  - term: "الْأَمِينَا"
    text: "«الوفيُّ العهد» [@ibn-al-anbari، ص377]، وقال الزَّوْزَنِيّ: «الأمين: بمعنى المأمون» [@zawzani، ص217]."
syntax:
  - "«قفي» أمر، و«نسألكِ» مجزوم جوابًا للطلب، كما في «قفي ... نخبّرك»."
  - "«هل» حرف استفهام، و«أحدثتِ وصلًا» فعل وفاعل ومفعول. و«أم» معادلة لـ«هل»، قال ابن الأَنْبارِيّ: «واللام صلة وصل، وخنت نسق على أحدثت، معناه: أم هل خُنت الأمين» [@ibn-al-anbari، ص377]، أي أن «لوشك البين» متعلق بـ«وصلًا»."
  - "«الأمينا» مفعول به لـ«خنتِ»، والألف للإطلاق."
morphology:
  - "«أَحْدَثْتِ» على «أَفْعَلْتِ» من «حَدَثَ»."
  - "«وَشْك» مصدر على «فَعْل»، ومنه «الوَشِيك» على «فَعِيل»."
  - "«الأَمِين» على «فَعِيل»، وهو عند الزَّوْزَنِيّ بمعنى مفعول: مأمون."
rhetoric:
  thesis: "يكرر الوقفة، ويحوّل الخبر إلى سؤال: هل تغيّرت حين قرب الرحيل؟ والسؤال قلق المحب أكثر منه اتهامًا."
  devices:
    - title: "التكرار في «قِفِي»"
      text: "أعاد الأمر الذي بدأ به البيت السادس، فالوقفة مطلوبة بإلحاح، والراحلة لا تقف."
    - title: "الاستفهام في «هَلْ أَحْدَثْتِ ... أَمْ خُنْتِ»"
      text: "لا يطلب جوابًا بقدر ما يكشف خوفه: كل احتمال عنده خسارة. وهذه قراءتنا."
    - title: "الكناية في «الْأَمِينَا»"
      text: "يصف نفسه دون أن يسمّيها، فهو الأمين الذي لا يخون. قال التِّبْرِيزِيّ: «وجعل نفسه بمنزلة الأمين الذي يحفظ السر» [@tabrizi-ashr، ص221]."
  connection: "ثم يذكر ما تريه في الخلوة، حين تأمن عيون الأعداء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "قِفِي نَسْأَلْ / كِ هَلْ أَحْدَثْ / تِ وَصْلَنْ = مفاعَلْتن / مفاعَلْتن / فعولن — لِوَشْكِلْ بَيْ / نِ أَمْ خُنْتِلْ / أَمِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "ثالث أبيات الظعينة. وهو عند الزَّوْزَنِيّ البيت العاشر، قبل «بيوم كريهة» [@zawzani، ص217]. ويليهما عنده «وإن غدا وإن اليوم رهن»، وهو عندنا البيت 17."
variants:
  - reading: "قِفِي نَسْأَلْكِ هَلْ أَحْدَثْتِ صَرْمًا"
    status: "رواية يذكرها ابن الأَنْبارِيّ، وهي نص الزَّوْزَنِيّ والتِّبْرِيزِيّ"
    note: "قال ابن الأَنْبارِيّ: «ويروى: (صرما) . والصرم: القطيعة» [@ibn-al-anbari، ص377]. وقال التِّبْرِيزِيّ: «والمعنى: هل أحدثت قطيعة لقرب الفراق؟ وجعل ما تخبره به كأنه خيانة» [@tabrizi-ashr، ص221]."
