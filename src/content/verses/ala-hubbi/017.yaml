first: "وَإِنَّ غَدًا وَإِنَّ الْيَوْمَ رَهْنٌ"
second: "وَبَعْدَ غَدٍ بِمَا لَا تَعْلَمِينَا"
meaning: "اليوم وغدًا وبعد غد، كلها مرهونة بأحداث لا تعلمينها: لا ندري ما يأتي به الزمن. قال ابن الأَنْبارِيّ: «معناه يأتيك غد بما لا تعلمين من الحوادث وغيرها» [@ibn-al-anbari، ص387]. وقال الزَّوْزَنِيّ: «يقول: فإن الأيام رهن بما لايحيط علمك به أي ملازمة له» [@zawzani، ص218]. ويصل التِّبْرِيزِيّ البيت بالنسيب: «ومعنى هذا البيت في أثر تلك الأبيات: أني قد علَّقت قلبي بهذه المرأة، والأقدار تأتي، ولا أدري ما يكون من أمرها» [@tabrizi-ashr، ص224]."
vocabulary:
  - term: "رَهْنٌ"
    text: "ما يُحبس ويُوثق به. والمعنى أن الأيام موقوفة على أحداثها، لا تنفك عنها، وقال الزَّوْزَنِيّ: «أي ملازمة له» [@zawzani، ص218]."
  - term: "غَدًا"
    text: "اليوم الآتي، «وفي غد لغتان: غد، وغدو» [@ibn-al-anbari، ص387]."
syntax:
  - "قال ابن الأَنْبارِيّ: «وغدا اسم إن، واليوم نسق على غد، ورهن خبر إن، وإن الثانية لغو» [@ibn-al-anbari، ص387]، أي زائدة لا عمل لها في المعنى. ثم ذكر وجهًا آخر: «ويجوز أن يكون رهن خبرا لإحداهما ويكون خبر الأخرى مضمرا، يريد: وان غدا رهن وان اليوم رهن» [@ibn-al-anbari، ص387]."
  - "«وبعدَ غدٍ» معطوف على ما قبله، و«بما لا تعلمينا» متعلق بـ«رهن»، و«لا تعلمين» صلة «ما»، والعائد محذوف: لا تعلمينه."
morphology:
  - "«رَهْن» مصدر «رَهَنَ» وُصف به، فلم يُثنَّ ولم يُجمع. قال ابن الأَنْبارِيّ: «وإنما يوحد الرهن إذا ألغيت أن الثانية؛ لأن مصدر رهنت رهنا، والمصدر يكون للواحد والاثنين والجميع والمؤنث بلفظ واحد» [@ibn-al-anbari، ص387]."
  - "«غَد» محذوف اللام، أصله «غَدْو»."
  - "«تَعْلَمِين» مضارع «عَلِمَ» مسند إلى ياء المخاطبة، مرفوع بثبوت النون."
rhetoric:
  thesis: "حكمة تختم النسيب: الحب معلّق، والزمن مجهول. وتعيد ذكر الموت المقدّر في البيت الخامس بصورة أوسع: لا نعلم ما في الغد."
  devices:
    - title: "الاستعارة في «رَهْنٌ»"
      text: "جعل الأيام رهائن محبوسة عند الأقدار، تُسلَّم بما فيها في موعدها. وهذا ما يسميه عبد القاهر الجُرْجانيّ استعارة: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "التكرار في «وَإِنَّ غَدًا وَإِنَّ الْيَوْمَ»"
      text: "«إنّ» الثانية زائدة في الإعراب، كما يقول ابن الأَنْبارِيّ، لكنها تفصل كل يوم عن صاحبه وتؤكده وحده: الغد مرهون، واليوم مرهون. وهذه قراءتنا."
    - title: "التقسيم الزمني"
      text: "اليوم، وغد، وبعد غد: ثلاثة أزمنة تغطي المستقبل كله، فلا يبقى وقت يُعرف ما فيه."
  connection: "ثم يلتفت فجأة إلى الملك: «أبا هند فلا تعجل علينا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَإِنْنَ غَدَنْ / وَإِنْنَلْ يَوْ / مَ رَهْنُنْ = مفاعلَتن / مفاعَلْتن / فعولن — وَبَعْدَ غَدِنْ / بِمَا لَا تَعْ / لَمِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "آخر أبيات الظعينة في رواية ابن الأَنْبارِيّ، وبه ينتهي النسيب. أما الزَّوْزَنِيّ فيضعه البيت الثاني عشر، بعد «بيوم كريهة» [@zawzani، ص218]، فيكون عنده جزءًا من حديث الوقفة. ويستشهد التِّبْرِيزِيّ له بنظير في معناه: «وأعلم ما في اليوم والأمس قبله» [@tabrizi-ashr، ص224]، وهو بيت زُهَيْر في معلقته."
