    status: "رواية أخرى"
    note: "«ويروى: (أخذن على بعولتهن نذرا)» [@ibn-al-anbari، ص422]، [@tabrizi-ashr، ص246]."
  - reading: "أَخَذْنَ عَلَى فَوَارِسِهِنَّ عَهْدًا"
    status: "رواية أخرى"
    note: "«ويروى: (أخذن على فوارسهن عهدا)» [@ibn-al-anbari، ص422]، وبها رواية الجَمْهَرة [@jamhara، ص297]."
  - reading: "إِذَا لَاقَوْا فَوَارِسَ مُعْلِمِينَا"
    status: "رواية التِّبْرِيزِيّ والجَمْهَرة"
    note: "[@tabrizi-ashr، ص246]، [@jamhara، ص297]."
