first: "أَخَذْنَ عَلَى بُعُولَتِهِنَّ عَهْدًا"
second: "إِذَا لَاقَوْا كَتَائِبَ مُعْلِمِينَا"
meaning: "أخذت النساء على أزواجهن عهدًا، إذا لقوا كتائب فرسانٍ معلَّمين، أن يثبتوا ولا يفرّوا. قال الزَّوْزَنِيّ: «قد عاهدن أزواجهن إذا قاتلوا كتائب من الأعداء قد أعلموا أنفسهم بعلامات يعرفون بها في الحروب أن يثبتوا في حومة القتال ولا يفروا» [@zawzani، ص232]. وجعله أبو جَعْفَر عهدًا معنويًّا: «معنى البيت: الواجب علينا أن نحميهن، فصار كالعهد. وعهدهن: ما لهن في قلوبهم من المحبة، لا أنهن أخذن عليهم العهد» [@ibn-al-anbari، ص422]."
vocabulary:
  - term: "بُعُولَتِهِنَّ"
    text: "أزواجهن: «والبعول والبعولة جمع بعل، يقال للرجل: هو بعل المرأة» [@zawzani، ص232]. وفي اللسان عن الأَزْهَرِيّ: «وإِنما سُمِّيَ زَوْجُ المرأَة بَعْلًا لأَنه سَيِّدُهَا وَمَالِكُهَا» [@lisan، ج11 ص58]."
  - term: "مُعْلِمِينَا"
    text: "الفرسان الذين جعلوا لأنفسهم علامة يُعرفون بها في الحرب. وفي اللسان: «وأَعْلَمَ الفارِسُ: جَعَلَ لِنَفْسِهِ عَلامةَ الشُّجعان، فَهُوَ مُعْلِمٌ» [@lisan، ج12 ص419]."
syntax:
  - "«عَهْدًا» مفعول به لـ«أَخَذْنَ»، و«عَلَى بُعُولَتِهِنَّ» متعلق به."
  - "جاء «إذا» للمستقبل مع فعل ماضٍ: «وإنما قال (إذا لاقوا) وأخذن فعل ماض»، «لأن الفعل الماضي تأويله الاستقبال، فصحبته إذا لتأويله» [@ibn-al-anbari، ص422]، أي أن «أخذن» في معنى «يأخذن» كلما خرجوا للحرب، واستشهد بقوله تعالى: {وَقَالُوا لِإِخْوَانِهِمْ إِذَا ضَرَبُوا فِي الْأَرْضِ}."
  - "«كَتَائِبَ» مفعول «لَاقَوْا»، و«مُعْلِمِينَا» نعت لها على المعنى، أي أصحاب كتائب معلَّمين، كما فسّره الزَّوْزَنِيّ."
morphology:
  - "«بُعُولَة» جمع «بَعْل» على «فُعُولَة»."
  - "«لَاقَوْا» ماضي «لَاقَى» على «فَاعَلَ» من «لَقِيَ»، حُذفت ألفه لاتصاله بواو الجماعة."
  - "«مُعْلِم» اسم فاعل من «أَعْلَمَ» الرباعي، أي جعل لنفسه علامة."
rhetoric:
  thesis: "النساء لا يقاتلن، لكنهن يُلزمن الرجال بالثبات: الشرف عهد بينهما."
  devices:
    - title: "الاستعارة في «أَخَذْنَ ... عَهْدًا»"
      text: "على قول أبي جَعْفَر لم يكن ثمة عهد يُنطق به، بل وجوب الحماية ومحبة الرجال لنسائهم، «فصار كالعهد» [@ibn-al-anbari، ص422]. فاستعار لفظ العهد لما في القلوب، فصار الواجب ميثاقًا لا يُنقض."
    - title: "التعبير بالماضي عن المستقبل في «أَخَذْنَ»"
      text: "الماضي يجعل العهد أمرًا قد تمّ ووقع، فلا رجعة فيه، وإن كان المقصود ما يتجدد في كل حرب."
  connection: "ثم يأتي نص العهد: «ليستلبنّ أبدانًا وبيضًا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "أَخَذْنَ عَلَى / بُعُولَتِهِنْ / نَ عَهْدَنْ = مفاعلتن / مفاعلتن / فعولن — إِذَا لَاقَوْ / كَتَائِبَ مُعْ / لِمِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من العَجُز. وفي نص ابن الأَنْبارِيّ على المكتبة الشاملة «إذا رقَوْا»، وشرحه «وإنما قال (إذا لاقوا)» [@ibn-al-anbari، ص422] يدل على أن الصواب «لَاقَوْا»، وهو لفظ الزَّوْزَنِيّ والتِّبْرِيزِيّ."
context: "من أبيات النساء (82–89)، وهو أول بيتين متصلين: هذا البيت يذكر العهد، والذي بعده نصّه."
variants:
