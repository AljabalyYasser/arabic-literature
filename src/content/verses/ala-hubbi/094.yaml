first: "مَلَأْنَا الْبَرَّ حَتَّى ضَاقَ عَنَّا"
second: "وَنَحْنُ الْبَحْرُ نَمْلَؤُهُ سَفِينَا"
meaning: "ملأنا البرّ بكثرتنا حتى ضاق عنا، والبحرَ نملؤه بسفننا. قال الزَّوْزَنِيّ: «عممنا الدنيا برًّا وبحرًا فَضَاقَ البر عن بيوتنا والبحر عن سفننا» [@zawzani، ص235]."
vocabulary:
  - term: "الْبَرَّ"
    text: "اليابسة، خلاف البحر."
  - term: "سَفِينَا"
    text: "سفنًا. وفي اللسان أن السفينة «وَالْجَمْعُ سَفائن وسُفُن وسَفِين»، واستشهد بالبيت [@lisan، ج13 ص210]."
syntax:
  - "«مَلَأْنَا» فعل وفاعل، و«الْبَرَّ» مفعول به، و«حَتَّى» حرف غاية، و«ضَاقَ عَنَّا» فعل وفاعله ضمير البر."
  - "«ويجوز في (البحر) الرفع والنصب؛ من رفعه رفعه بما عاد من الهاء ورفع نحن بما عاد من نملؤه»، «ومن نصبه نصبه بنملأ»، «وسفينا مفعول ثان» [@ibn-al-anbari، ص428]. فعلى الرفع، وهو ما أثبتناه، «نَحْنُ» مبتدأ، و«الْبَحْرُ» مبتدأ ثانٍ، وجملة «نَمْلَؤُهُ» خبره، والجملة خبر «نحن». وعلى النصب «البحرَ» مفعول لفعل يفسّره «نملؤه»، وهو ما يسميه النحاة الاشتغال: أن يتقدم اسم ويشتغل الفعل بعده بضميره."
  - "وقال التِّبْرِيزِيّ على روايته «وظهرَ البحر»: «(ظهر) منصوب على إضمار فعل ليعطف على ما عمل فيه الفعل، وإن شئت رفعته على الابتداء وعطف جملة على جملة» [@tabrizi-ashr، ص249]."
morphology:
  - "«مَلَأْنَا» و«نَمْلَؤُهُ» من «مَلَأَ يَمْلَأُ»، مهموز اللام، وكُتبت الهمزة على الواو في «نملؤه» لانضمامها."
  - "«سَفِين» جمع «سَفِينَة»، «والسَّفِينة: الفُلْك لأَنها تَسْفِن وَجْهَ الْمَاءِ أَي تُقَشِّرُهُ، فَعِيلة بِمَعْنَى فَاعِلَةٍ» [@lisan، ج13 ص209]."
rhetoric:
  thesis: "آخر الأبيات المزيدة، وفيه يبلغ الغلو أوسع مداه: البر والبحر كلاهما لا يتسعان للقبيلة."
  devices:
    - title: "الغلو"
      text: "الغلو تجاوز الحد في الوصف، و«من أسمائه أيضاً الإغراق، والإفراط»، وينقل ابن رَشِيق عن قُدامة أنه «تجاوز في نعت ما للشيء أن يكون عليه، وليس خارجاً عن طباعه» [@ibn-rashiq، ج2 ص60–61]. وامتلاء البر والبحر بقبيلة واحدة يتجاوز ذلك إلى الإفراط."
    - title: "الطباق في «الْبَرَّ» و«الْبَحْرُ»"
      text: "الطباق الجمع بين الضدين في الكلام، والبر والبحر ضدان يجمعان الأرض كلها، فالمعنى: ملأنا الدنيا."
    - title: "التقديم في «وَنَحْنُ الْبَحْرُ نَمْلَؤُهُ»"
      text: "قدّم «البحر» على فعله، فصار هو موضع الاهتمام، كما يقول عبد القاهر الجُرْجانيّ في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
  connection: "وبه تنتهي القصيدة في رواية ابن الأَنْبارِيّ: «تمت هذه القصيدة» [@ibn-al-anbari، ص428]."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "مَلَأْنَلْ بَرْ / رَ حَتْتَى ضَا / قَ عَنْنَا = مفاعلْتن / مفاعلْتن / فعولن — وَنَحْنُلْ بَحْ / رُ نَمْلَؤُهُو / سَفِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر، والأولى من العَجُز. وأُشبعت ضمة الهاء في «نَمْلَؤُهُ» فصارت «نَمْلَؤُهُو». وفي نص المكتبة الشاملة «مَلأَْ البَرَّ»، وصوابه «ملأنا» كما في سائر الروايات، ولا يستقيم الوزن إلا به."
context: "ثالث الأبيات التي يرويها «بعض الرواة» بعد البيت 91 [@ibn-al-anbari، ص427]، وهو الوحيد منها الذي عرفه أبو جَعْفَر: «عرف أبو جعفر البيت الأخير» [@ibn-al-anbari، ص428]. ويرويه الزَّوْزَنِيّ قبل بيت آخر يختم به القصيدة: «إِذَا بَلَغَ الفِطَامَ لَنَا صَبِيٌّ ... تَخِرُّ لَهُ الْجَبَابِرُ سَاجِدِينَا» [@zawzani، ص235]، وذلك البيت في رواية التِّبْرِيزِيّ قبله [@tabrizi-ashr، ص249] وفي الجَمْهَرة كذلك [@jamhara، ص299]، وليس في رواية ابن الأَنْبارِيّ. ويستشهد بالبيت صاحب اللسان في مادة «سفن» [@lisan، ج13 ص210]."
