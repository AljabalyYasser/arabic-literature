first: "كَأَنَّ سُيُوفَنَا فِينَا وَفِيهِمْ"
second: "مَخَارِيقٌ بِأَيْدِي لَاعِبِينَا"
meaning: "كأن سيوفنا وسيوفهم في المعركة، بيننا وبينهم، مخاريق يلعب بها الصبيان: تتحرك بسرعة وكثرة وخفة. قال ابن الأَنْبارِيّ: «معناه: كأن اختلاف سيوفنا فيما بيننا في كثرتها وسرعتها مخاريق بأيدي صبيان يلعبون» [@ibn-al-anbari، ص397]. وقال أبو جعفر: «معناه من حذقنا وخفتنا بالضرب كأن سيوفنا مخاريق بأيدي صبيان يلعبون» [@ibn-al-anbari، ص397]. وقال الزَّوْزَنِيّ: «يقول: كنا لا نحفل بالضرب بالسيوف كما لا يحفل اللاعبون بالضرب بالمخاريق، أو كنا نضرب بها في سرعة كما يضرب بالمخاريق في سرعة» [@zawzani، ص225]."
vocabulary:
  - term: "مَخَارِيقٌ"
    text: "«وواحد المخاريق مخراق، وهو ثوب يفتل» [@ibn-al-anbari، ص397]. وفي «لسان العرب»: «والمَخارِيقُ، وَاحِدُهَا مِخْراق: مَا تَلْعَبُ بِهِ الصِّبْيَانُ مِنَ الخِرَقِ المَفْتُولة» [@lisan، ج10 ص76]. وقال الزَّوْزَنِيّ: «والمخراق أيضًا سيف من خشب» [@zawzani، ص225]."
  - term: "لَاعِبِينَا"
    text: "صبيان يلعبون، كما فسّر ابن الأَنْبارِيّ."
syntax:
  - "قال ابن الأَنْبارِيّ: «والسيوف اسم كأن، ومخاريق خبر كأن، وفينا وفيهم معناهما الحال» [@ibn-al-anbari، ص398]."
  - "«بأيدي لاعبين» متعلق بـ«مخاريق»، و«لاعبين» صفة لموصوف محذوف: صبيان لاعبين."
morphology:
  - "«مَخَارِيق» جمع «مِخْرَاق» على «مَفَاعِيل»، وهي صيغة منتهى الجموع الممنوعة من الصرف، وقد نُوّنت هنا للوزن."
  - "«سُيُوف» جمع «سَيْف» على «فُعُول»."
  - "«لاعِبِين» جمع «لاعِب»، اسم فاعل من «لَعِبَ»."
rhetoric:
  thesis: "أبرد صورة في أعنف موقف: السيوف في المعركة ألعاب صبيان. فالموت يصير لعبًا عند أهل الحذق، وفي ذلك احتقار للخطر."
  devices:
    - title: "التشبيه التمثيلي في «كَأَنَّ سُيُوفَنَا ... مَخَارِيقٌ بِأَيْدِي لَاعِبِينَا»"
      text: "لا يشبّه السيف بالمخراق في شكله، بل يشبّه هيئة السيوف تتحرك بين الفريقين بهيئة صبيان يتضاربون بالخرق المفتولة. قال ابن كيسان: «فيه معنى لطيف؛ لأنه وصف السيوف وجودتها ثم أخبر أنها في أيديهم بمنزلة المخاريق في أيدي الصبيان» [@tabrizi-ashr، ص231]. وهذا ما يقول فيه عبد القاهر الجُرْجانيّ: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "الإنصاف في «فِينَا وَفِيهِمْ»"
      text: "لم يجعل السيوف سيوف قومه وحدهم، بل سيوف الفريقين، فاعترف بأن خصومه قاتلوا أيضًا. قال التِّبْرِيزِيّ: «وقيل: إنه أراد سيوف أصحابه وسيوف أعدائه، وعند بعضهم سميت هذه القصيدة المنصفة لهذا» [@tabrizi-ashr، ص231]."
    - title: "صرف الممنوع في «مَخَارِيقٌ»"
      text: "نوّن الكلمة وهي لا تُنوَّن في الكلام، ليستقيم الوزن. قال ابن الأَنْبارِيّ: «ونوَّن مخاريق وهي لا تجري، لأن كل مالا يجرى تجريه الشعراء في شعرهم ليستوي بالتنوين وزن البيت» [@ibn-al-anbari، ص398]."
  connection: "ثم يصف الثياب بعد المعركة: كأنها صُبغت بالأرجوان."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "كَأَنْنَ سُيُو / فَنَا فِينَا / وَفِيهِمْ = مفاعلَتن / مفاعَلْتن / فعولن — مَخَارِيقُنْ / بِأَيْدِي لَا / عِبِينَا = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن». ونُوّنت «مَخَارِيق» وهي ممنوعة من الصرف، لضرورة الوزن."
context: "من أبيات المجد والحرب، وأول بيتين متوازيين يبدآن بـ«كأنّ» (35–36). وهو عند الزَّوْزَنِيّ البيت الثالث والأربعون [@zawzani، ص224]."
variants:
