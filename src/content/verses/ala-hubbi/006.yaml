first: "قِفِي قَبْلَ التَّفَرُّقِ يَا ظَعِينَا"
second: "نُخَبِّرْكِ الْيَقِينَ وَتُخْبِرِينَا"
meaning: "أيتها الراحلة في هودجها، قفي قبل أن نفترق، نخبرك الخبر الذي لا شك فيه، وتخبريننا. قال الزَّوْزَنِيّ: «يقول: قفي مطيّتك أيتها الحبيبة الظاعنة نخبرك بما قاسينا بعدك، وتخبرينا بما لاقيت بعدنا» [@zawzani، ص217]. ويجعل التِّبْرِيزِيّ اليقين خبر الحرب: «أي قفي نخبرك ما لا تشكين فيه من حروبنا مع أهلك، والمعنى قبل أن يفارقنا أهلك، وقيل: المعنى قبل أن يفرق بيننا الموت، والأول أصح» [@tabrizi-ashr، ص220]."
vocabulary:
  - term: "قِفِي"
    text: "أمر من «وقف»، يطلب منها أن توقف بعيرها."
  - term: "التَّفَرُّقِ"
    text: "الفراق، حين يرحل أهلها ويبقى."
  - term: "ظَعِينَا"
    text: "أراد «يا ظعينة»، قال ابن الأَنْبارِيّ: «فرخم فحذف الهاء ووصل فتحة النون بالألف» [@ibn-al-anbari، ص375]. و«الظعينة: المرأة في الهودج، سميت بذلك لظعنها مع زوجها» [@zawzani، ص217]. وفي «لسان العرب»: «والظَّعينة: المرأَة فِي الْهَوْدَجِ، وإِذا لَمْ تَكُنْ فِيهِ فَلَيْسَتْ بظَعِينة» [@lisan، ج13 ص271]."
  - term: "الْيَقِينَ"
    text: "الخبر الثابت الذي لا شك فيه."
syntax:
  - "قال ابن الأَنْبارِيّ: «ونخبِّرك ينجزم لأنه جواب الجزاء المقدّر. يريد: أن تقفي نخبرك. وتخبرينا نسق على نخبرك، علامة الجزم فيه سقوط النون» [@ibn-al-anbari، ص375]. أي أن الأمر «قفي» يتضمن شرطًا: إن تقفي نخبرك، فجُزم الفعل جوابًا له."
  - "«قبلَ التفرق» ظرف متعلق بـ«قفي». و«يا ظعينا» منادى مرخّم، حُذفت منه التاء، وبقيت فتحة النون فأُشبعت ألفًا."
  - "«نخبّرك اليقين»: الكاف مفعول أول، و«اليقين» مفعول ثانٍ. وفي البيت التالي يبيّن هذا اليقين بقوله «بيوم كريهة»، وجعل ابن الأَنْبارِيّ الباء هناك «صلة نخبرك اليقين» [@ibn-al-anbari، ص375]، أي متعلقة به."
morphology:
  - "«التَّفَرُّق» مصدر «تَفَرَّقَ» على «تَفَعُّل»."
  - "«نُخَبِّر» مضارع «خَبَّرَ» المضعّف. قال ابن الأَنْبارِيّ: «وخبَّر وأخبر لغتان معناهما واحد، كما تقول: مهَّل وأمهل، ووصّى وأوصى» [@ibn-al-anbari، ص375]."
  - "«ظَعِينة» على «فَعِيلة»، قال الزَّوْزَنِيّ: «فهي فعيلة بمعنى فاعلة» [@zawzani، ص217]، لأنها هي التي تظعن، أي ترحل."
rhetoric:
  thesis: "ينتقل من الخمر إلى امرأة راحلة، ولا يقف على أطلالها كما يفعل غيره، بل يستوقفها وهي تمضي. والخبر الذي يعرضه عليها خبر حرب، فيدخل الفخر في النسيب من أوله."
  devices:
    - title: "الترخيم في «يَا ظَعِينَا»"
      text: "حذف آخر الاسم المنادى، فقال «يا ظعين» وهو يريد «يا ظعينة». والترخيم في النداء يقرّب المنادى ويدلّله، كأنه يناديها نداء الأُلفة. وهذه قراءتنا."
    - title: "المقابلة في «نُخَبِّرْكِ ... وَتُخْبِرِينَا»"
      text: "خبر بخبر: يعطيها وتعطيه. فالوقفة التي يطلبها حوار بين اثنين، لا شكوى من واحد."
    - title: "الإبهام في «الْيَقِينَ»"
      text: "لم يقل ما اليقين، فترك السامع ينتظر، ثم فسّره في البيت التالي بيوم الحرب. وهذا يشدّ البيتين أحدهما إلى الآخر."
  connection: "ثم يفسّر اليقين: يوم حرب كثر فيه الضرب والطعن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "قِفِي قَبْلَتْ / تَفَرْرُقِ يَا / ظَعِينَا = مفاعَلْتن / مفاعلَتن / فعولن — نُخَبْبِرْكِلْ / يَقِينَ وَتُخْ / بِرِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "أول أبيات الظعينة (6–17). ويأتي بعد ذكر الموت مباشرة، فالفراق الذي يخشاه صورة صغيرة من الفراق الأكبر. وهو عند الزَّوْزَنِيّ البيت التاسع [@zawzani، ص217]."
