first: "وَأَنَّا الْمَانِعُونَ لِمَا يَلِينَا"
second: "إِذَا مَا الْبِيضُ فَارَقَتِ الْجُفُونَا"
meaning: "وأنّا نحمي ما يجاورنا من أرض وجيران، إذا سُلّت السيوف من أغمادها وبدأ القتال. قال ابن الأَنْبارِيّ: «معناه إذا ما السيوف سُلَّت من أغمادها» [@ibn-al-anbari، ص419]."
vocabulary:
  - term: "لِمَا يَلِينَا"
    text: "لما يقرب منّا ويجاورنا."
  - term: "الْبِيضُ"
    text: "السيوف، سُمّيت بلونها لبريقها، قال ابن الأَنْبارِيّ: «معناه إذا ما السيوف سُلَّت من أغمادها» [@ibn-al-anbari، ص419]."
  - term: "الْجُفُونَا"
    text: "أغماد السيوف. وفي اللسان: «والجَفْنُ: غِمْدُ السَّيْفِ» [@lisan، ج13 ص89]."
syntax:
  - "«الْمَانِعُونَ» خبر «أنّ»، واللام في «لِمَا» لام التقوية، و«ما» اسم موصول، وجملة «يَلِينَا» صلته."
  - "«وما صلة، والبيض رفع بما عاد من فارقت» [@ibn-al-anbari، ص419]: أي أن «ما» بعد «إذا» زائدة للتوكيد، والصلة في اصطلاح الكوفيين هنا الحرف الزائد، و«الْبِيضُ» مرفوع بفعل يفسّره «فَارَقَتْ»."
  - "«الْجُفُونَا» مفعول به لـ«فارقت»، والألف للإطلاق. وجواب «إذا» محذوف دلّ عليه ما قبله."
morphology:
  - "«الْبِيض» جمع «أَبْيَض» على «فُعْل»، كُسرت فاؤه لتسلم الياء."
  - "«الْجُفُون» جمع «جَفْن» على «فُعُول»."
  - "«فَارَقَتْ» على «فَاعَلَ» من «فَرَقَ»."
rhetoric:
  thesis: "الحماية في ساعة الخطر: حين تخرج السيوف يظهر من يمنع جاره."
  devices:
    - title: "الكناية في «فَارَقَتِ الْجُفُونَا»"
      text: "خروج السيوف من أغمادها كناية عن قيام الحرب. والكناية عند عبد القاهر الجُرْجانيّ أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]، فالسلّ يسبق الضرب ويلازمه."
    - title: "حذف الموصوف في «الْبِيضُ»"
      text: "ذكر لون السيوف ولم يذكرها، فصار اللون اسمًا لها. والحذف عند عبد القاهر باب «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
  connection: "ثم يتابع: «وأنّا المنعمون إذا قدرنا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَأَنْنَلْ مَا / نِعُونَ لِمَا / يَلِينَا = مفاعلْتن / مفاعلتن / فعولن — إِذَا مَلْ بِي / ضُ فَارَقَتِلْ / جُفُونَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين. وقصرت ألف «مَا» لالتقائها بلام «الْبِيضُ» الساكنة: «مَلْ»."
context: "ثاني ما علمته القبائل في سلسلة «أنّا» (74–77). وفي رواية الزَّوْزَنِيّ بيت يبدأ بصدره ويختلف عجزه: «وَأَنَّا الْمَانِعُونَ لِمَا أَرَدْنَا ... وَأَنَّا النَّازِلُونَ بِحَيْثُ شِينَا»، وشرحه: «وأنا نمنع الناس ما أردنا منعه إياهم، وننزل حيث شئنا من بلاد العرب» [@zawzani، ص234]. وفي الجَمْهَرة «وَأَنَّا الْحَاكِمُونَ بِمَا أَرَدْنَا» بالعجز نفسه [@jamhara، ص295]."
variants:
