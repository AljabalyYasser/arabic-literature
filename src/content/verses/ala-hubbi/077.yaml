first: "وَأَنَّا الشَّارِبُونَ الْمَاءَ صَفْوًا"
second: "وَيَشْرَبُ غَيْرُنَا كَدِرًا وَطِينَا"
meaning: "وأنّا نشرب الماء صافيًا، ويشرب غيرنا ما بقي بعدنا كدرًا مختلطًا بالطين. وليس المراد الماء وحده، قال ابن الأَنْبارِيّ: «إنما ضرب الماء مثلا. يريد أَنَّا نغلب على الفاضل من كل شيء فنحوزه ولا يصل الناس إلا إلى ما ننفيه ولا نريده، لعزنا وامتناع جانبنا» [@ibn-al-anbari، ص419]. وقال الزَّوْزَنِيّ: «ونأخذ من كل شيء أفضله وندع لغيرنا أرذله، يريد لهم السادة والقادة وغيرهم أتباع لهم» [@zawzani، ص234]."
vocabulary:
  - term: "صَفْوًا"
    text: "صافيًا لم يكدره أحد قبلنا."
  - term: "كَدِرًا"
    text: "عكر. وفي اللسان: «الكَدَرُ: نَقِيضُ الصَّفَاءِ» [@lisan، ج5 ص134]."
  - term: "طِينَا"
    text: "ماءً مختلطًا بالطين، وهو ما يبقى في أسفل الحوض أو البئر بعد أن يشرب الأولون."
syntax:
  - "«الشَّارِبُونَ» خبر «أنّ»، و«الْمَاءَ» مفعول به لاسم الفاعل. «وصفوا نصب على المصدر» [@ibn-al-anbari، ص419]، أي أنه مصدر في موضع الحال، والتقدير: صافيًا."
  - "«وَيَشْرَبُ» مضارع مرفوع، والجملة معطوفة على جملة «أنّا الشاربون» أو مستأنفة، و«غَيْرُنَا» فاعل، و«كَدِرًا» حال أو مفعول به، و«طِينَا» معطوف عليه. وفي نص المكتبة الشاملة «ويَشربْ» بالسكون، والوجه الرفع."
morphology:
  - "«صَفْو» مصدر «صَفَا يَصْفُو» على «فَعْل»، ناقص واوي."
  - "«كَدِر» صفة مشبهة على «فَعِل» من «كَدِرَ يَكْدَرُ»."
  - "«الشَّارِبُون» جمع «شارب» اسم فاعل من «شَرِبَ»."
rhetoric:
  thesis: "من أشهر أبيات القصيدة: صورة الورود على الماء تختصر مكانة القبيلة بين العرب، فهي أولى بكل شيء."
  devices:
    - title: "التمثيل في «الشَّارِبُونَ الْمَاءَ صَفْوًا»"
      text: "«إنما ضرب الماء مثلا» [@ibn-al-anbari، ص419]: من يرد الماء أولًا هو الأقوى، ومن يأتي بعده يشرب الكدر. فالصورة مثل لكل خير يُتنافس عليه. والتمثيل عند عبد القاهر الجُرْجانيّ ما كان الشبه فيه «محصّلاً بضرب من التأوّل» [@asrar، ص90]، «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "المقابلة بين الشطرين"
      text: "قابل «أنّا» بـ«غيرنا»، و«الشاربون» بـ«يشرب»، و«صفوًا» بـ«كدرًا وطينًا»، فانقسم الناس في البيت قسمين: هم، وسائر الناس."
    - title: "الترقّي في «كَدِرًا وَطِينَا»"
      text: "لم يكتف بالكدر، بل زاد الطين، فنزل بنصيب غيرهم درجة بعد درجة."
  connection: "ثم يلتفت إلى حيّين من إياد: «ألا سائل بني الطمّاح عنا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَأَنْنَشْ شَا / رِبُونَلْ مَا / ءَ صَفْوَنْ = مفاعلْتن / مفاعلْتن / فعولن — وَيَشْرَبُ غَيْ / رُنَا كَدِرَنْ / وَطِينَا = مفاعلتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر، وجاء العَجُز على الأصل. ولو سُكّنت باء «وَيَشْرَبْ» كما في المطبوع لدخل العَصْب أولى العَجُز، والوزن مستقيم في الحالين."
context: "ختام شهادة القبائل (73–77)، وهو مثل سائر من القصيدة. وناقش التِّبْرِيزِيّ على الرواية الأخرى «ونشرب إن وردنا» موضع جواب الشرط: «وجواب الشرط فيه قولان: أحدهما إنه ونشرب، وهذا لا يقع إلا في الماضي، إلا في الشعر»، «والقول الآخر أن الجواب محذوف» [@tabrizi-ashr، ص245]."
variants:
  - reading: "وَنَشْرَبُ إِنْ وَرَدْنَا الْمَاءَ صَفْوًا"
    status: "رواية الزَّوْزَنِيّ والتِّبْرِيزِيّ والجَمْهَرة"
    note: "«ويروى (ونشرب أن وردنا الماء صفوا)» [@tabrizi-ashr، ص245]، [@zawzani، ص234]، [@jamhara، ص295]."
  - reading: "وَيَشْرَبُ غَيْرُنَا كَدَرًا وَطِينَا"
    status: "رواية التِّبْرِيزِيّ والجَمْهَرة"
    note: "بالمصدر بدل الصفة [@tabrizi-ashr، ص245]، [@jamhara، ص295]."
