first: "نَشُقُّ بِهَا رُءُوسَ الْقَوْمِ شَقًّا"
second: "وَنُخْلِيهَا الرِّقَابَ فَيَخْتَلِينَا"
meaning: "نشق بالسيوف رؤوس الأعداء شقًّا، ونجعل رقابهم لها كالحشيش، فتقطعها كما يُقطع العشب. قال ابن الأَنْبارِيّ: «نشق بها، معناه بالسيوف. و (نخليها الرقاب) معناه نجعل الرقاب لها كالخلي والخلى: الحشيش» [@ibn-al-anbari، ص396]. وقال التِّبْرِيزِيّ: «يصف حدة السيوف وسُرعة قطعها، فكأنهم يقطعون بها حشيشا» [@tabrizi-ashr، ص230]."
vocabulary:
  - term: "نُخْلِيهَا الرِّقَابَ"
    text: "نجعل الرقاب للسيوف خَلًى، أي حشيشًا رطبًا، «والخلى: الحشيش، مقصور يكتب بالياء» [@ibn-al-anbari، ص396]."
  - term: "يَخْتَلِينَا"
    text: "«(فيختلين) معناه يقطعن. يقال: اختليت الحشيش، أي قطعته» [@ibn-al-anbari، ص396]. وفي «لسان العرب»: «وخَلى الخَلى خَلْياً واخْتَلاه فانْخَلَى: جَزَّه وقَطَعَه» [@lisan، ج14 ص243]."
syntax:
  - "«بها» متعلق بـ«نشق»، والضمير للسيوف في البيت السابق، و«شقًّا» مفعول مطلق مؤكد."
  - "قال ابن الأَنْبارِيّ: «والهاء والألف نصب بنخلي، والرقاب مفعول ثان» [@ibn-al-anbari، ص396]. أي أن «نُخلي» يتعدى إلى مفعولين: نجعل السيوف تجد الرقاب خَلًى."
  - "«فيختلين» الفاء للتعقيب، ونون النسوة فاعل يعود على السيوف."
morphology:
  - "«نُخْلِي» مضارع «أَخْلَى» على «أَفْعَلَ»، مشتق من اسم «الخَلَى»: جعله خلًى."
  - "«يَخْتَلِي» مضارع «اخْتَلَى» على «افْتَعَلَ» من الجذر نفسه."
  - "«رُءُوس» جمع «رَأْس» على «فُعُول»، و«رِقَاب» جمع «رَقَبَة» على «فِعَال»."
rhetoric:
  thesis: "العنف هنا مصوَّر بهدوء الحاصد: الرقاب عشب، والسيوف مناجل. فسهولة القتل دليل على حدة السلاح وقوة اليد."
  devices:
    - title: "الاستعارة في «نُخْلِيهَا الرِّقَابَ»"
      text: "جعل الرقاب حشيشًا يُقطع، ثم بنى من اسم الحشيش فعلًا. وهي استعارة على حدّ عبد القاهر الجُرْجانيّ: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الجناس الاشتقاقي في «نُخْلِيهَا ... فَيَخْتَلِينَا» و«نَشُقُّ ... شَقًّا»"
      text: "في كل شطر كلمتان من جذر واحد، فيتردد الصوت كما تتردد الضربات. وهذه قراءتنا."
    - title: "المفعول المطلق «شَقًّا»"
      text: "يؤكد الفعل ويقوّيه: شق كامل لا خدش."
  connection: "ثم يصف الرؤوس المتساقطة: كأنها أحمال إبل تسقط على أرض حجرية."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "نَشُقْقُ بِهَا / رُءُوسَلْ قَوْ / مِ شَقْقَنْ = مفاعلَتن / مفاعَلْتن / فعولن — وَنُخْلِيهَرْ / رِقَابَ فَيَخْ / تَلِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات المجد والحرب. وهو عند الزَّوْزَنِيّ البيت الثامن والثلاثون، بعد «كأن جماجم الأبطال» [@zawzani، ص224]."
variants:
  - reading: "وَيُخْلَيْنَ الرِّقَابَ فَيَخْتَلِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ"
    note: "قال: «ويروى: (ويخلين الرقاب فيختلينا) فاسم ما لم يسم فاعله مضمر في يخلين، والرقاب نصب بيخلين» [@ibn-al-anbari، ص396]، أي بالبناء للمجهول: تُعطى السيوف الرقاب خلًى."
  - reading: "وَنَخْتَلِبُ الرِّقَابَ فَتَخْتَلِينَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "قال: «الاختلاب: قطع الشيء بالمخلب وهو المنجل الذي لا أسنان له» [@zawzani، ص224]."
