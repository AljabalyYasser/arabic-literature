first: "قَرَيْنَاكُمْ فَعَجَّلْنَا قِرَاكُمْ"
second: "قُبَيْلَ الصُّبْحِ مِرْدَاةً طَحُونَا"
meaning: "قريناكم وعجّلنا لكم قراكم قبيل الفجر: كتيبة كالصخرة الثقيلة تطحنكم طحنًا. قال ابن الأَنْبارِيّ: «(مرداة) : صخرة. شبه الكتيبة بها فقال: جعلنا قراكم إذ نزلتم بنا الحرب، ولقيناكم بكتيبة تطحنكم طحن الرحى» [@ibn-al-anbari، ص421]. وقال الزَّوْزَنِيّ: «مرداة طحونًا أي حربًا أهلكتهم أشد إهلاك» [@zawzani، ص223]."
vocabulary:
  - term: "قُبَيْلَ الصُّبْحِ"
    text: "قبل الفجر بقليل، وهو وقت الغارة عند العرب."
  - term: "مِرْدَاةً"
    text: "«المرداة: الصخرة التي يكسر بها الصخور، والمرداة أيضًا الصخرة التي يرمى بها، والردي الرمي» [@zawzani، ص223]. وفي اللسان: «والمِرْدَى والمِرْدَاةُ: الحَجَرُ وأَكثر مَا يُقَالُ فِي الحَجَرِ الثَّقِيلِ» [@lisan، ج14 ص318]."
  - term: "طَحُونَا"
    text: "«الطَّحون: فعول من الطحن» [@zawzani، ص223]، أي كثيرة الطحن."
syntax:
  - "«والمرداة نصب بقرينا» [@ibn-al-anbari، ص421]: «قَرَى» يتعدى إلى مفعولين، الأول «كم» والثاني «مِرْدَاةً»، أي قريناكم مرداةً. وما بينهما «فَعَجَّلْنَا قِرَاكُمْ» معطوف معترض."
  - "«قُبَيْلَ» ظرف زمان منصوب، و«الصُّبْحِ» مضاف إليه. و«طَحُونَا» نعت لـ«مرداة»، والألف للإطلاق."
morphology:
  - "«قُبَيْل» تصغير «قَبْل»، والتصغير في الظرف للتقريب: قبل الصبح بقليل."
  - "«مِرْدَاة» اسم آلة على «مِفْعَلَة» من «رَدَى يَرْدِي» إذا رمى، قُلبت لامها ألفًا."
  - "«طَحُون» على «فَعُول» من أبنية المبالغة، يستوي فيه المذكر والمؤنث، فلذلك وُصفت به «مرداة» بلا تاء."
rhetoric:
  thesis: "يتم التهكم: ما قُدّم للضيوف لم يكن طعامًا، بل كتيبة تسحقهم."
  devices:
    - title: "الاستعارة في «مِرْدَاةً طَحُونَا»"
      text: "«شبه الكتيبة بها» [@ibn-al-anbari، ص421]، و«استعار المرداة للحرب» [@zawzani، ص223]. والاستعارة عند عبد القاهر الجُرْجانيّ أن تدع الإفصاح بالتشبيه «وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. ثم وصف الصخرة بالطحن، فجمع في الصورة الثقل والسحق."
    - title: "جناس الاشتقاق في «قَرَيْنَاكُمْ ... قِرَاكُمْ»"
      text: "مادة القرى تتكرر في الشطر الأول وفي البيت قبله، فيلحّ على السخرية حتى يكشفها العجز."
    - title: "المفارقة"
      text: "الصدر كله كرم، والعجز كله فتك، والمسافة بين الشطرين هي موضع السخرية. وهذه قراءتنا."
  connection: "ثم يتم صورة الرحى: ثفالها شرقي نجد ولهوتها قضاعة."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "قَرَيْنَاكُمْ / فَعَجْجَلْنَا / قِرَاكُمْ = مفاعلْتن / مفاعلْتن / فعولن — قُبَيْلَصْ صُبْ / حِ مِرْدَاتَنْ / طَحُونَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلات الأربع في الحشو."
context: "من خطاب إياد (78–81). وقال ابن الأَنْبارِيّ بعده: «وروى بعض الرواة متصلا بهذا البيت» [@ibn-al-anbari، ص421]، يعني البيت 81. والبيتان (79–80) عند الزَّوْزَنِيّ بعد بيتي الرحى [@zawzani، ص222–223]."
