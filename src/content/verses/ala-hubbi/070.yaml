first: "كَأَنَّ مُتُونَهُنَّ مُتُونُ غُدْرٍ"
second: "تُصَفِّقُهَا الرِّيَاحُ إِذَا جَرَيْنَا"
meaning: "كأن ظهور الدروع ظهور غدران ماء تضربها الرياح إذا هبّت، فتتموّج حلقاتها كما يتموّج الماء. قال ابن الأَنْبارِيّ: «كأن متونهن متون غدر، شبه فضول الدرع التي تشنج منها بمتون غدر. وقال أبو جعفر: إنما يصف تدريج الدرع وحسن نسجها، فشبها بطرائق الماء إذا هبت عليه الريح» [@ibn-al-anbari، ص416]."
vocabulary:
  - term: "مُتُونَهُنَّ"
    text: "«(متونها) : ظهورها» [@ibn-al-anbari، ص416]، والضمير للدروع."
  - term: "غُدْرٍ"
    text: "«الغُدْر: مخفّف غُدُر وهو جمع غدير» [@zawzani، ص231]. وفي اللسان: «والغَدِير: الْقِطْعَةُ مِنَ الْمَاءِ يُغادِرُها السَّيْلُ أَي يَتْرُكُهَا» [@lisan، ج5 ص9]."
  - term: "تُصَفِّقُهَا"
    text: "«تصفقه: تضربه» [@zawzani، ص231]. وفي اللسان: «اللَّيْثُ: يُقَالُ الثَّوْبُ الْمُعَلَّقُ تُصَفِّقه الرِّيحُ كُلَّ مُصَفَّق فيَنْصَفِقُ» [@lisan، ج10 ص201]."
  - term: "جَرَيْنَا"
    text: "هببن، والضمير للرياح."
syntax:
  - "«كَأَنَّ» حرف تشبيه ونصب، و«مُتُونَهُنَّ» اسمها، و«مُتُونُ» خبرها، و«غُدْرٍ» مضاف إليه."
  - "«وتصفقها الرياح صلة غدر» [@ibn-al-anbari، ص416]: أي أن الجملة نعت لـ«غدر»، والصلة في اصطلاحه هنا الصفة. وأنّث الضمير في «تُصَفِّقُهَا» لأن الغدر جمع."
  - "«إِذَا جَرَيْنَا» ظرف، والنون نون النسوة عائدة على الرياح، والألف للإطلاق."
morphology:
  - "«غُدْر» مخفف «غُدُر»: «وأصله غدُر فسكنّت الدال تخفيفا. وهو كقولهم: كتاب كُتُب وكتْب» [@ibn-al-anbari، ص416]."
  - "«تُصَفِّق» مضارع «صَفَّقَ» على «فَعَّلَ»، والتضعيف للتكثير: ضرب بعد ضرب."
  - "«جَرَيْنَ» ماضي «جَرَى» الناقص، ثبتت ياؤه لما اتصلت به نون النسوة."
rhetoric:
  thesis: "بعد صلابة الدروع وأثرها، يأتي جمالها: حلقات تلمع وتتموّج كوجه الماء."
  devices:
    - title: "التشبيه في «كَأَنَّ مُتُونَهُنَّ مُتُونُ غُدْرٍ»"
      text: "شبّه طرائق الحلق في الدرع بطرائق الماء، قال الزَّوْزَنِيّ: «شبه غضون الدرع بمتون الغدران إذا ضربتها الرياح في جريها، والطرائق التي تُرَى في الدروع بالتي تراها في الماء إذا ضربته الريح» [@zawzani، ص231]. وهو من الضرب الذي يكون الشبه فيه عند عبد القاهر الجُرْجانيّ «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]، فالعين ترى البريق والتموّج في الشيئين."
    - title: "تشبيه الهيئة المتحركة في «تُصَفِّقُهَا الرِّيَاحُ»"
      text: "لم يشبّه الدرع بغدير ساكن، بل بغدير تضربه الريح، فأدخل الحركة في الصورة. وقال عبد القاهر: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "التكرار في «مُتُونَهُنَّ مُتُونُ»"
      text: "الكلمة نفسها في طرفي التشبيه، فيتقارب المشبه والمشبه به حتى يكادا يتحدان."
  connection: "ثم ينتقل من الدروع إلى الخيل التي تحملهم."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "كَأَنْنَ مُتُو / نَهُنْنَ مُتُو / نُ غُدْرِنْ = مفاعلتن / مفاعلتن / فعولن — تُصَفْفِقُهَرْ / رِيَاحُ إِذَا / جَرَيْنَا = مفاعلتن / مفاعلتن / فعولن"
  note: "جاء الحشو كله على الأصل «مفاعلتن»، بلا عَصْب، والعَصْب «تسكين الحرف الخامس» [@atiq، ص54]. وفي القافية عيب نبّه عليه القدماء، هو السِّناد. والرِّدف حرف المدّ قبل الرَّوِيّ، وهو الياء في «الأندرينا» وسائر القوافي، وما قبله مكسور. وجاء هنا مفتوحًا في «جَرَيْنَا». قال ابن قُتَيْبة: «والسناد: هو أن يختلف إرداف القوافى»، واستشهد بالمطلع ثم قال: «فالحاء مكسورة»، وبهذا العجز ثم قال: «فالراء مفتوحة، وهى بمنزلة الحاء» [@ibn-qutayba، ج1 ص97]. وقال التِّبْرِيزِيّ إنه «سناد؛ لأن الياء إذا انفتح ما قبلها لم يتم لينها» [@tabrizi-ashr، ص243]. وهذا النوع عند ابن رَشِيق أشهر أنواع السِّناد: «منها وهو المشهور أن يختلف الحذو، وهو حركة ما قبل الردف» [@ibn-rashiq، ج1 ص167]."
context: "آخر أبيات الدروع (68–70). وهو مما يستشهد به العروضيون والنقاد على السِّناد [@ibn-qutayba، ج1 ص97]. وفي روايتين أخريين ينكسر ما قبل الياء فتسلم القافية من هذا العيب: «إذا عَرِينا» عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص416]، و«إذا غَرِينا» في اللسان [@lisan، ج15 ص123]. وهذه ملاحظتنا، ولم يقل أحد من القدماء إن الروايتين صُنعتا لإصلاحه."
variants:
  - reading: "كَأَنَّ غُضُونَهُنَّ مُتُونُ غُدْرٍ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«ويروى: (كأن غضونهن) ، أي تكسرهن» [@ibn-al-anbari، ص416]، [@zawzani، ص231]، [@tabrizi-ashr، ص243]."
  - reading: "تُصَفِّقُهَا الرِّيَاحُ إِذَا عَرِينَا"
    status: "رواية أخرى"
    note: "«ويروى: (إذا عرينا) فمعناه إذا أصابتهن الريح الباردة. والعرية عندهم: الريح الباردة» [@ibn-al-anbari، ص416]."
  - reading: "كَأَنَّ مُتُونَهُنَّ مُتُونُ عِدٍّ ... تُصَفِّقُهُ الرِّيَاحُ إِذَا غَرِينَا"
    status: "رواية اللسان"
    note: "والعِدّ الماء الذي لا ينقطع، و«وغَرِيَ العِدُّ: بَرَدَ ماؤُه» [@lisan، ج15 ص123]."
