first: "إِذَا مَا رُحْنَ يَمْشِينَ الْهُوَيْنَى"
second: "كَمَا اضْطَرَبَتْ مُتُونُ الشَّارِبِينَا"
meaning: "إذا خرجت النساء في العشيّ يمشين مشيًا بطيئًا متمهّلًا، تتمايل أجسادهن كما تتمايل ظهور السكارى. وسبب البطء امتلاء أجسادهن وثقل أعجازهن. قال ابن الأَنْبارِيّ: «إذا ما راح النساء يمشين الهويني، أي لا يعجلن في مشيهن. كما اضطربت متون الشاربين، أي ينثنين في مشيهن ويتمايلن كما تفعل السكارى» [@ibn-al-anbari، ص424]. وقال الزَّوْزَنِيّ: «إذا مشين يمشين مشيًا رفيقًا لثقل أردافهن وكثرة لحومهن، ثم شبههن في تبخترهن بالسكارى في مشيهم» [@zawzani، ص233]."
vocabulary:
  - term: "رُحْنَ"
    text: "خرجن في الرواح، وهو آخر النهار، أو مضين."
  - term: "الْهُوَيْنَى"
    text: "المشي الرفيق البطيء. «الهوينى: تصغير الهونى وهي تأنيث الأهون» [@zawzani، ص233]. وفي اللسان: «والهَوْنُ والهُوَيْنا: التُّؤَدة والرِّفْق وَالسَّكِينَةُ وَالْوَقَارُ» [@lisan، ج13 ص439]."
  - term: "مُتُونُ"
    text: "ظهور، جمع «مَتْن»."
  - term: "الشَّارِبِينَا"
    text: "شاربي الخمر حين يسكرون، فيميلون في مشيهم."
syntax:
  - "«إِذَا» ظرف شرطي، و«مَا» زائدة للتوكيد، و«رُحْنَ» فعل الشرط، والنون نون النسوة العائدة على الظعائن. وجوابه في البيت التالي: «ويقتن جواب إذا، وما توكيد الكلام» [@ibn-al-anbari، ص424]."
  - "«يَمْشِينَ» في موضع الحال. «الهوينى في موضع نصب، وسبيله أن يكتب بالياء لأنه يجرى مجرى متى» [@ibn-al-anbari، ص424]: أي أنه صفة لمصدر محذوف، والتقدير: يمشين المشية الهوينى."
  - "«كَمَا»: الكاف للتشبيه و«ما» مصدرية، والتقدير: كاضطراب متون الشاربين. و«مُتُونُ» فاعل «اضطربت»، و«الشَّارِبِينَا» مضاف إليه."
morphology:
  - "«الْهُوَيْنَى» تصغير «الهُونَى» مؤنث «الأهون»، على «فُعَيْلَى»."
  - "«رُحْنَ» ماضي «رَاحَ يَرُوحُ»، أجوف واوي حُذفت عينه حين اتصل بنون النسوة وضُمّت فاؤه."
  - "«اضْطَرَبَتْ» على «افْتَعَلَ» من «ضَرَبَ»، قُلبت التاء طاء لمجاورة الضاد."
rhetoric:
  thesis: "بعد الشرف والعهد يأتي الجسد: نساء ممتلئات منعّمات، يمشين ببطء، فيتمايلن في مشيهن. والنعمة نفسها شاهد على عزّ القوم الذين يحمونهن."
  devices:
    - title: "تشبيه الهيئة المتحركة في «كَمَا اضْطَرَبَتْ مُتُونُ الشَّارِبِينَا»"
      text: "شبّه تمايل النساء في مشيهن بتمايل السكارى. والشبه في الحركة لا في الشكل، وهذا عند عبد القاهر الجُرْجانيّ أدقّ التشبيه: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]. واستشهد ابن الأَنْبارِيّ بقول آخر: «مشيَنَ كما اهتزَّتْ رماحٌ تسفَّهتْ ... أعاليَها مرُّ الرِّياحِ النَّواسمِ» [@ibn-al-anbari، ص424]."
    - title: "الكناية في «يَمْشِينَ الْهُوَيْنَى»"
      text: "بطء المشي كناية عن امتلاء الجسد وعن النعمة، فهن لا يُعجّلهن عمل ولا خوف. قال التِّبْرِيزِيّ: «وإنما يصف» نعمتهن [@tabrizi-ashr، ص247–248]. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "التضمين"
      text: "التضمين أن يتعلق البيت بما بعده فلا يتم معناه إلا به. فجواب «إذا» في البيت التالي: «يقتن جيادنا»."
  connection: "ثم يقول جواب الشرط: حين يرحن يعلفن خيلنا ويقلن ما يقلن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "إِذَا مَا رُحْ / نَ يَمْشِينَلْ / هُوَيْنَى = مفاعلْتن / مفاعلْتن / فعولن — كَمَضْ طَرَبَتْ / مُتُونُشْ شَا / رِبِينَا = مفاعلتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من الصدر، والثانية من العَجُز. وسقطت همزة الوصل في «اضْطَرَبَتْ» فاتصلت الضاد بما قبلها: «كَمَضْ»."
context: "من أبيات النساء (82–89)، وهو البيت الذي يصف فيه أجسادهن. وهو عند الزَّوْزَنِيّ قبل «يقتن جيادنا» كذلك [@zawzani، ص233]."
