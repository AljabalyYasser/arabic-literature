first: "وَنَحْنُ غَدَاةَ أُوقِدَ فِي خَزَازٍ"
second: "رَفَدْنَا فَوْقَ رِفْدِ الرَّافِدِينَا"
meaning: "ونحن يوم أُوقدت نار الحرب على خَزَاز أعنّا قومنا فوق ما أعان كل معين. قال ابن الأَنْبارِيّ: «يقول: أوقدت نار الحرب في خزاز. وقوله (رفدنا) معناه أعنا. (فوق رفد الرافدين) : فوق عون من أعان. أي أتينا بجيش فوق كل جيش» [@ibn-al-anbari، ص409]. وقال الزَّوْزَنِيّ: «يفتخر بإعانة قومه بني نزار في محاربتهم اليمن» [@zawzani، ص229]."
vocabulary:
  - term: "خَزَازٍ"
    text: "جبل. وفي اللسان: «وخَزازٌ وخَزازى، مَقْصُورٌ: كِلَاهُمَا جَبَلٌ كَانَتِ الْعَرَبُ تُوقِد عَلَيْهِ غَدَاةَ الغارَة. ويومُ خَزازى: أَحدُ أَيام الْعَرَبِ» [@lisan، ج5 ص346]. ووصفه أبو عَمْرو بن العَلاء: «هو جبل قريب من أمرة على يسار الطريق» [@iqd، ج6 ص97]."
  - term: "رَفَدْنَا"
    text: "«معناه أعنا» [@ibn-al-anbari، ص409]. وفي اللسان: «رَفَدَه يَرْفِدُه رَفْداً: أَعطاه، ورَفَدَه وأَرْفَده: أَعانه، وَالِاسْمُ مِنْهُمَا الرِّفْد» [@lisan، ج3 ص181]."
  - term: "رِفْدِ"
    text: "«والرفد: العطية، وهو الاسم» [@ibn-al-anbari، ص409]، والمراد هنا العون في الحرب."
syntax:
  - "«ونحن رفع بما عاد من النون والألف في رفدنا. والغداة نصب على الوقت» [@ibn-al-anbari، ص409]: «نَحْنُ» مبتدأ، وجملة «رَفَدْنَا» خبره، والكوفيون يرفعون المبتدأ بما يعود عليه من الخبر. و«غَدَاةَ» ظرف زمان متعلق بـ«رَفَدْنَا»."
  - "«أُوقِدَ» ماضٍ مبني للمجهول، ونائب فاعله ضمير يعود على النار المفهومة من الفعل، والجملة في محل جر بإضافة «غداة» إليها. و«فِي خَزَازٍ» متعلق بـ«أُوقِدَ»."
  - "«فَوْقَ» ظرف مكان متعلق بـ«رَفَدْنَا»، و«رِفْدِ» مضاف إليه، و«الرَّافِدِينَا» مضاف إليه مجرور بالياء."
morphology:
  - "«الرِّفْد» بالكسر الاسم، و«الرَّفْد» بالفتح المصدر: «الرِّفْد، بِالْكَسْرِ: الْعَطَاءُ وَالصِّلَةُ. والرَّفْد، بِالْفَتْحِ: الْمَصْدَرُ» [@lisan، ج3 ص181]، وبنحوه قال ابن الأَنْبارِيّ [@ibn-al-anbari، ص409]."
  - "«أُوقِدَ» ماضي «أَوْقَدَ» الرباعي مبنيًّا للمجهول، و«الرَّافِدِين» جمع «رافد» اسم فاعل من «رَفَدَ»."
  - "«خَزَاز» مصروف، و«خَزَازَى» في الرواية الأخرى مقصور ممنوع من الصرف لألف التأنيث."
rhetoric:
  thesis: "يفتتح ذكر يوم خَزَاز. وفخره فيه ليس بالرياسة بل بالعون: كانوا أكثر من أعان."
  devices:
    - title: "الكناية في «أُوقِدَ»"
      text: "إيقاد النار على الجبل كناية عن الحرب، فالعرب كانت «تُوقِد عَلَيْهِ غَدَاةَ الغارَة» [@lisan، ج5 ص346]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]: فالنار تابعة لاجتماع الجيوش، فذكرها وأراد الحرب."
    - title: "حذف الفاعل في «أُوقِدَ»"
      text: "لم يذكر من أوقد النار ولا ذكر النار نفسها، فالمهم أن الحرب قامت، لا من أشعلها. والحذف عند عبد القاهر باب «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "جناس الاشتقاق في «رَفَدْنَا ... رِفْدِ الرَّافِدِينَا»"
      text: "ثلاث كلمات من أصل واحد في شطر واحد. وجناس الاشتقاق أن يجتمع لفظان أو أكثر يرجعان إلى أصل واحد. وتكرار المادة يُبرز معنى العون، وهو موضع الفخر."
  connection: "ثم يذكر صبرهم بذي أُراطى."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَنَحْنُ غَدَا / ةَ أُوقِدَ فِي / خَزَازِنْ = مفاعلتن / مفاعلتن / فعولن — رَفَدْنَا فَوْ / قَ رِفْدِرْ رَا / فِدِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». الصدر على الأصل، ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلتين الأوليين من العَجُز."
context: "أول أبيات يوم خَزَاز (58–64). وفيه خبر يرويه أبو عُبَيْدة: تنازع قوم من أهل البصرة في مجلس أبي عَمْرو بن العَلاء فيمن كان رئيس الناس يوم خَزَاز، فقال: «ولقد سألت عنه منذ ستين سنة فما وجدت أحدا من القوم يعلم من رئيسهم ومن الملك»، و«لولا قول عمرو بن كلثوم ما عرف ذلك اليوم» [@iqd، ج6 ص97]. ثم أنشد هذا البيت والأبيات 62–64، وقال: «ولو كان جدّه كليب بن وائل قائدهم ورئيسهم ما ادعى الرّفادة وترك الرياسة» [@iqd، ج6 ص98]. فقد استدل أبو عَمْرو بلفظ «رفدنا» على أن تَغْلِب كانت يومئذ معينة لا قائدة."
variants:
  - reading: "وَنَحْنُ غَدَاةَ أُوقِدَ فِي خَزَازَى"
    status: "رواية أخرى"
    note: "«ويروى: (ونحن غداة أوقد في خزازي)» [@ibn-al-anbari، ص409]، وبها رواية الزَّوْزَنِيّ [@zawzani، ص229] واللسان [@lisan، ج5 ص346] والجَمْهَرة [@jamhara، ص290]."
