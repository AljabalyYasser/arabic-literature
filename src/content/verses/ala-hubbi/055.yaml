first: "وَمِنَّا قَبْلَهُ السَّاعِي كُلَيْبٌ"
second: "فَأَيُّ الْمَجْدِ إِلَّا قَدْ وَلِينَا"
meaning: "ومنّا قبل ذي البُرَة كُلَيْب، الذي سعى إلى المعالي. فأيّ مجد لم نَلِه؟ قال الزَّوْزَنِيّ: «ومنا قبل ذي البرة الساعي للمعالي كليب، يعني كليب وائل، ثم قال: وأي المجد إلا وقد ولينا، أي قربنا منه فحوينا» [@zawzani، ص229]."
vocabulary:
  - term: "السَّاعِي"
    text: "«كليب الملك الساعي، سعى في المجد» [@ibn-al-anbari، ص407]."
  - term: "كُلَيْبٌ"
    text: "كُلَيْب وائل [@zawzani، ص229]، أخو مُهَلْهِل جدّ الشاعر لأمه [@khizana، ج8 ص262]."
  - term: "وَلِينَا"
    text: "«من الولاية، أي صار إلينا فصرنا ولاة عليه» [@ibn-al-anbari، ص407]."
syntax:
  - "«والساعي رفع بمن، وكليب مترجم عن الساعي، وقبله صلة منا» [@ibn-al-anbari، ص408]: أي أن «السَّاعِي» مرفوع مبتدأ مؤخر خبره «مِنَّا»، على اصطلاح الكوفيين في رفعه بالجار، و«كُلَيْبٌ» بدل منه، و«قَبْلَهُ» ظرف متعلق بالخبر."
  - "«فَأَيُّ» فيه روايتان. رفعه الكِسائيّ، «أراد فأي المجد إلا قد وليناه» بإضمار الهاء [@ibn-al-anbari، ص407]. ونصبه أبو عَمْرو والأَصْمَعِيّ، «ولم يعرف هشام لروايتهما مذهبا». واختار ابن الأَنْبارِيّ الرفع: «والصواب عندي رواية الكسائي، لأن الا أداة مانعة تمنع ما بعدها من نصب من قبلها» [@ibn-al-anbari، ص407]، أي أن «وَلِينَا» بعد «إلا» لا يعمل في «أيّ» قبلها."
  - "«أيّ» استفهام بمعنى النفي، و«إِلَّا» بعده أداة استثناء مفرّغ، والمعنى: ما من مجد إلا قد ولينا."
morphology:
  - "«السَّاعِي» اسم فاعل من «سَعَى يَسْعَى»، ناقص يائي."
  - "«كُلَيْب» تصغير «كَلْب» على «فُعَيْل»."
  - "«وَلِينَا» ماضي «وَلِيَ يَلِي»، لفيف مفروق، أي اجتمع فيه حرفا علة بينهما حرف صحيح."
rhetoric:
  thesis: "ذروة السلسلة: أعظم الأجداد كُلَيْب، ثم سؤال جامع يدّعي للقوم كل مجد."
  devices:
    - title: "تقديم الصفة على الاسم في «السَّاعِي كُلَيْبٌ»"
      text: "عرّفه بفعله قبل اسمه، ثم جاء الاسم بدلًا: «وكليب مترجم عن الساعي» [@ibn-al-anbari، ص408]. فالسامع يسمع السعي إلى المجد أولًا، ثم يعرف صاحبه."
    - title: "الاستفهام الإنكاري في «فَأَيُّ الْمَجْدِ إِلَّا قَدْ وَلِينَا»"
      text: "سؤال لا ينتظر جوابًا، معناه النفي: لا مجد إلا ولينا أمره. واجتماع الاستفهام المنفي و«إلا» يفيد القصر، أي حصر المجد كله فيهم."
    - title: "التذييل"
      text: "التذييل أن يُختم الكلام بجملة عامة تؤكد ما قبله. فالعجز حكم يجمع كل ما عدّده من الآباء في الأبيات 51–55."
  connection: "ثم ينتقل من الآباء إلى صفات القوم: متى قُرنوا بقوم غلبوهم."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَمِنْنَا قَبْ / لَهُسْ سَاعِي / كُلَيْبُنْ = مفاعلْتن / مفاعلْتن / فعولن — فَأَيْيُلْ مَجْ / دِ إِلْلَا قَدْ / وَلِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلات الأربع في الحشو كلها، فتوالت المقاطع الطويلة في بيت الذروة."
context: "ختام تعداد الآباء (50–55). وبعده يترك الشاعر الأسماء إلى أفعال القوم ومناقبهم (56–61)."
variants:
  - reading: "فَأَيَّ الْمَجْدِ إِلَّا قَدْ وَلِينَا"
    status: "رواية أبي عَمْرو والأَصْمَعِيّ"
    note: "«وقال هشام: روى بيت عمرو أبو عمرو والأصمعي بالنصب» [@ibn-al-anbari، ص407]. وهي عند التِّبْرِيزِيّ رواية الأكثر: «الرواية عند أكثر أهل اللغة بنصب أي على أن تُنصب بولينا» [@tabrizi-ashr، ص239]."
