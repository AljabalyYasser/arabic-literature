first: "بِأَنَّا نُورِدُ الرَّايَاتِ بِيضًا"
second: "وَنُصْدِرُهُنَّ حُمْرًا قَدْ رَوِينَا"
meaning: "الخبر اليقين: أنا نذهب برايات الحرب إلى القتال بيضًا، ونرجع بها حمرًا قد ارتوت من دماء الأعداء. قال ابن الأَنْبارِيّ: «يقول: نوردهن بيضا، ونصدرهن أي نردهن حمرا قد روين من الدم فصرن حمرا» [@ibn-al-anbari، ص388]. وقال الزَّوْزَنِيّ: «هذا البيت تفسير اليقين من البيت الأول» [@zawzani، ص221]. وقال التِّبْرِيزِيّ: «وهذا تمثيل، مثَّل الرايات بالإبل والدم بالماء، فكأن الرايات ترجع وقد رويت من الدم كما ترجع الإبل وقد رويت من الماء» [@tabrizi-ashr، ص225]."
vocabulary:
  - term: "الرَّايَاتِ"
    text: "«الأعلام» [@ibn-al-anbari، ص388]، أي أعلام الحرب."
  - term: "نُورِدُ"
    text: "الإيراد: أن تأتي بالإبل إلى الماء لتشرب، قال التِّبْرِيزِيّ: «مثَّل الرايات بالإبل والدم بالماء، فكأن الرايات ترجع وقد رويت من الدم كما ترجع الإبل وقد رويت من الماء» [@tabrizi-ashr، ص225]."
  - term: "نُصْدِرُهُنَّ"
    text: "الإصدار: أن تعود بها عن الماء بعد شربها، وفسّرها ابن الأَنْبارِيّ: «أي نردهن» [@ibn-al-anbari، ص388]."
  - term: "رَوِينَا"
    text: "شربن حتى ارتوين."
syntax:
  - "«بأنّا» الباء متعلقة بـ«نخبّرك» في البيت السابق، و«أنّا» وما بعدها في تأويل مصدر مجرور بها: نخبرك بإيرادنا."
  - "قال ابن الأَنْبارِيّ: «وبيضا وحمرا منصوبان على الحال. وقد روينا معناه الحال أيضا، أي حمرا رواء. والألف صلة لفتحة النون ليستوي وزن البيت» [@ibn-al-anbari، ص388]."
  - "«روين» فعل ماضٍ، ونون النسوة فاعل يعود على الرايات."
morphology:
  - "«الرايات» جمع «راية»، قال الزَّوْزَنِيّ: «الراية: العلم، والجمع الرايات والراي» [@zawzani، ص221]."
  - "«نُورِد» و«نُصْدِر» مضارعا «أَوْرَدَ» و«أَصْدَرَ» على «أَفْعَلَ»."
  - "«بِيض» و«حُمْر» جمعا «بيضاء» و«حمراء» على «فُعْل»، وكُسرت باء «بِيض» لمناسبة الياء."
rhetoric:
  thesis: "البيت كله صورة واحدة: لون الراية قبل المعركة وبعدها. ومن هذا التحول يفهم السامع ما جرى بينهما من غير أن يُذكر القتال."
  devices:
    - title: "الطباق والمقابلة في «نُورِدُ ... بِيضًا» و«نُصْدِرُهُنَّ حُمْرًا»"
      text: "قابل الإيراد بالإصدار، والبياض بالحمرة. وزعم بعضهم أن هذا أفضل طباق في الشعر، فردّ ابن رَشِيق ذلك، لأن الأبيض ضد الأسود على الحقيقة لا ضد الأحمر، فقال بعد أن نقل قول الرُّمّاني: «وإنما أوردته إبطالا لزعم من زعم أن أفضل مطابقة وقعت قول عمرو بن كلثوم» [@ibn-rashiq، ج2 ص11]. فالمقابلة الحقيقية بين «نورد» و«نصدر»، أما البياض والحمرة فلونان مختلفان لا ضدان."
    - title: "التمثيل في «قَدْ رَوِينَا»"
      text: "جعل الرايات إبلًا ترد الماء وتصدر عنه وقد ارتوت، والماء دم. وهذا ما سمّاه التِّبْرِيزِيّ تمثيلًا. والشبه هنا لا يُرى بالعين، بل يُدرك بالتأمل، وهو عند عبد القاهر الجُرْجانيّ الضرب الذي يكون فيه «الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]."
    - title: "الكناية بالألوان"
      text: "لم يذكر القتل ولا الجرحى، بل ذكر لون الراية. فالحمرة وحدها تقول: كثر القتل في أعدائنا."
  connection: "ثم يضيف إلى الخبر: أيام عصت فيها تَغْلِب الملوك."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بِأَنْنَا نُو / رِدُرْ رَايَا / تِ بِيضَنْ = مفاعَلْتن / مفاعَلْتن / فعولن — وَنُصْدِرُهُنْ / نَ حُمْرَنْ قَدْ / رَوِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "أشهر أبيات الخطاب للملك، وهو تفسير «اليقين» الذي وعد به في البيت السابق. وهو عند الزَّوْزَنِيّ البيت الرابع والعشرون [@zawzani، ص221]."
