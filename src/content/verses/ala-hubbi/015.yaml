first: "فَمَا وَجَدَتْ كَوَجْدِي أُمُّ سَقْبٍ"
second: "أَضَلَّتْهُ فَرَجَّعَتِ الْحَنِينَا"
meaning: "ما حزنت ناقة ضاع منها ولدها، فظلت تردد حنينها، حزنًا مثل حزني على فراق صاحبتي. قال الزَّوْزَنِيّ: «يقول: فما حزنت حزنًا مثل حزني ناقة أضلت ولدها فرددت صوتها مع توجعها في طلبها، يريد أن حزن الناقة دون حزنه فراق حبيبته» [@zawzani، ص220]."
vocabulary:
  - term: "وَجَدَتْ"
    text: "حزنت، قال ابن الأَنْبارِيّ: «ويقال: وجدت في الحزن وجدا» [@ibn-al-anbari، ص385]."
  - term: "أُمُّ سَقْبٍ"
    text: "«(أم سقب) : ناقة. والسقب: الفصيل» [@ibn-al-anbari، ص384]. وفي «لسان العرب»: «السَّقْبُ: ولدُ الناقةِ، وَقِيلَ: الذكَرُ مِنْ ولدِ الناقةِ» [@lisan، ج1 ص468]."
  - term: "أَضَلَّتْهُ"
    text: "«معناه فقدته. ويقال: أضللت البعير، إذا ضيعته» [@ibn-al-anbari، ص384]."
  - term: "رَجَّعَتِ الْحَنِينَا"
    text: "قال الزَّوْزَنِيّ: «الترجيع: ترديد الصوت. الحنين: صوت المتوجع» [@zawzani، ص220]."
syntax:
  - "قال ابن الأَنْبارِيّ: «وما جحد، والكاف في موضع نصب بوجدت، وفي أضلت ورجعت ذكر من الأم» [@ibn-al-anbari، ص385]. أي أن «ما» نافية، والكاف اسم بمعنى «مثل» في موضع المفعول المطلق: ما وجدت وجدًا مثل وجدي، والضمير في الفعلين يعود على الناقة."
  - "«أمُّ سقبٍ» فاعل «وجدت»، وجملة «أضلّته» نعت لها، و«فرجّعت» معطوف عليه."
  - "«كوجدي» من إضافة المصدر إلى فاعله: كما وجدتُ أنا."
morphology:
  - "«وَجْد» مصدر «وَجَدَ»، ويفرّق ابن الأَنْبارِيّ بين مصادره بحسب المعنى: «ويقال: وجدت في الحزن وجدا، ووجدت على الرجل موجدة، ووجدت في المال وجدا وجِدَة، ووجدت الضالة وجدانا» [@ibn-al-anbari، ص385]."
  - "«أَضَلَّ» على «أَفْعَلَ» من المضعّف، و«رَجَّعَ» على «فَعَّلَ» للتكثير والتكرار."
  - "«سَقْب» على «فَعْل»."
rhetoric:
  thesis: "يقيس حزنه بأشد ما يعرفه البدوي من الحزن: ناقة فقدت ولدها، ثم يجعل حزنه أكبر. والمبالغة هنا ليست زخرفًا، بل اعتراف بأن الفراق جرح."
  devices:
    - title: "التشبيه المنفي في «فَمَا وَجَدَتْ كَوَجْدِي»"
      text: "لا يقول: حزني كحزن الناقة، بل ينفي أن يكون حزنها مثل حزنه، فيجعل المشبه أقوى من المشبه به. وهذه قراءتنا."
    - title: "الصورة الصوتية في «فَرَجَّعَتِ الْحَنِينَا»"
      text: "الترجيع ترديد الصوت، والحنين صوت الموجوع، فالشطر يُسمع: ناقة تحنّ ثم تعيد حنينها."
    - title: "اختيار الناقة"
      text: "ليس في بيئة البادية صورة أقرب إلى الفقد من ناقة تبحث عن فصيلها. فالصورة مأخوذة من حياة السامع اليومية."
  connection: "ثم يضيف صورة أشد: أمًّا شمطاء فقدت تسعة أبناء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "فَمَا وَجَدَتْ / كَوَجْدِي أُمْ / مُ سَقْبِنْ = مفاعلَتن / مفاعَلْتن / فعولن — أَضَلْلَتْهُو / فَرَجْجَعَتِلْ / حَنِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "أول بيتي الحزن (15–16) في آخر النسيب. وهو عند الزَّوْزَنِيّ البيت التاسع عشر، بعد بيتين في الوصف ليسا عند ابن الأَنْبارِيّ [@zawzani، ص219]."
