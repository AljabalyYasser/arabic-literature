first: "وَعَتَّابًا وَكُلْثُومًا جَمِيعًا"
second: "بِهِمْ نِلْنَا تُرَاثَ الْأَكْرَمِينَا"
meaning: "وورثت جدّي عَتّابًا وأبي كُلْثُومًا جميعًا، وبهم بلغنا ميراث الكرام. قال الزَّوْزَنِيّ: «ورثنا مَجْدَ عتاب وكلثوم وبهم بلغنا ميراث الأكارم أي حزنا مآثرهم ومفاخرهم فشرفنا بها وكرمنا» [@zawzani، ص228]."
vocabulary:
  - term: "عَتَّابًا وَكُلْثُومًا"
    text: "«وكلثوم أبو عمرو الشاعر، وعتَّاب جده» [@ibn-al-anbari، ص406]. وكذلك عند البَغْداديّ: «عتاب: جد الشَّاعِر. وكلثوم: أَبوهُ» [@khizana، ج8 ص262]."
  - term: "تُرَاثَ"
    text: "الميراث، واستشهد له ابن الأَنْبارِيّ بقوله تعالى: {وَتَأْكُلُونَ التُّرَاثَ أَكْلًا لَمًّا}، «فمعناه تأكلون الميراث» [@ibn-al-anbari، ص406]."
  - term: "الْأَكْرَمِينَا"
    text: "الكرام، جمع «الأكرم»."
syntax:
  - "«عَتَّابًا» معطوف على «مُهَلْهِلًا» في البيت 52، والعامل فيه «وَرِثْتُ»، و«كُلْثُومًا» معطوف عليه."
  - "«وجميعا نصب على الحال» [@ibn-al-anbari، ص406]."
  - "«بِهِمْ» متعلق بـ«نِلْنَا»، و«تُرَاثَ» مفعول به، و«الْأَكْرَمِينَا» مضاف إليه مجرور بالياء، والألف للإطلاق."
morphology:
  - "«تُرَاث» أصله «وُرَاث»: «وأصله الوراث لأنه فعال من ورثت، فأبدلوا من الواو تاء لقربها منها في المخرج» [@ibn-al-anbari، ص406]."
  - "«عَتَّاب» على «فَعَّال»، من أبنية المبالغة، سُمّي به."
  - "«نِلْنَا» ماضي «نَالَ يَنَالُ» الأجوف، حُذفت ألفه لالتقاء الساكنين حين اتصل بضمير الرفع، وكُسرت النون لأن الفعل يائي: نَيِلَ."
rhetoric:
  thesis: "يبلغ في سلسلة الآباء أباه كُلْثُومًا، فيكتمل النسب المجيد من الجدّ البعيد إلى الأب، ثم يجمع الفضل كله في «بهم»."
  devices:
    - title: "التقديم في «بِهِمْ نِلْنَا»"
      text: "قدّم الجار والمجرور على الفعل، فحصر الفضل في هؤلاء الآباء: بهم لا بغيرهم نلنا ما نلنا. ويعلّل عبد القاهر الجُرْجانيّ التقديم بقول سيبويه: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "التعميم في «تُرَاثَ الْأَكْرَمِينَا»"
      text: "لم يقل «تراثهم» بل «تراث الأكرمين»: فآباؤه هم الأكرمون، وميراثهم ميراث الكرم كله. وهذه قراءتنا."
  connection: "ثم يذكر ذا البُرَة، ثم كُلَيْبًا قبله."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "وَعَتْتَابَنْ / وَكُلْثُومَنْ / جَمِيعَنْ = مفاعلْتن / مفاعلْتن / فعولن — بِهِمْ نِلْنَا / تُرَاثَلْ أَكْ / رَمِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلات الأربع في الحشو كلها، فجاء البيت ثقيل الحركة بمقاطعه الطويلة. والعَرُوض والضرب «فعولن»."
context: "يتم سلسلة الآباء (50–55)، ويصل فيها الشاعر إلى أبيه. والأسماء المنصوبة متعلقة كلها بفعل واحد في البيت 52: «وَرِثْتُ»."
variants:
  - reading: "بِهِمْ نِلْنَا مَسَاعِيْ الْأَكْرَمِينَا"
    status: "رواية أخرى"
    note: "«ويروى: (بهم نلنا مساعي الأكرمينا)»، وسُكّنت الياء في النصب «على لغة الذين يقولون: رأيت قاضيك وداعيك» [@ibn-al-anbari، ص406]. والمساعي: المكارم التي يُسعى إليها."
  - reading: "بِهِمْ نِلْنَا تُرَاثَ الْأَجْمَعِينَا"
    status: "رواية أخرى"
    note: "«ويروى (تراث الأجمعينا) يعني جماعتهم» [@tabrizi-ashr، ص238]."
