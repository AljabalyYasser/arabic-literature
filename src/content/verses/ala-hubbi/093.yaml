first: "بُغَاةً ظَالِمِينَ وَمَا ظُلِمْنَا"
second: "وَلَكِنَّا سَنَبْدَأُ ظَالِمِينَا"
meaning: "نبطش بغاةً ظالمين، لا لأن أحدًا ظلمنا فنثأر منه، بل لأننا نبدأ بالظلم. ولم يشرحه أحد من الشرّاح الذين بين أيدينا، فهذا المعنى قراءتنا."
vocabulary:
  - term: "بُغَاةً"
    text: "معتدين، جمع «بَاغٍ»، من البغي وهو تجاوز الحد والاعتداء."
  - term: "ظُلِمْنَا"
    text: "وقع علينا الظلم من غيرنا."
  - term: "سَنَبْدَأُ"
    text: "سنكون البادئين."
syntax:
  - "«بُغَاةً» منصوب على الحال، وهو متصل بالبيت قبله: نبطش قادرين بغاةً. و«ظَالِمِينَ» حال ثانية أو نعت لـ«بغاة»."
  - "الواو في «وَمَا ظُلِمْنَا» حالية، و«ما» نافية، و«ظُلِمْنَا» ماضٍ مبني للمجهول، و«نا» نائب فاعل."
  - "«وَلَكِنَّا»: «لكنّ» حرف استدراك ونصب، و«نا» اسمها، وجملة «سَنَبْدَأُ» خبرها، و«ظَالِمِينَا» حال من فاعل «نبدأ»."
morphology:
  - "«بُغَاة» جمع «بَاغٍ» على «فُعَلَة»، وأصله «بُغَيَة» قُلبت ياؤه ألفًا. وهو بناء يختص به اسم الفاعل المعتل اللام، كما ذكر التِّبْرِيزِيّ في «وُشاة» جمع «واشٍ» [@tabrizi-ashr، ص235]."
  - "«لَكِنَّا» أصلها «لكنّنا»، حُذفت إحدى النونات تخفيفًا."
  - "«سَنَبْدَأُ» مضارع «بَدَأَ» المهموز اللام، والسين للاستقبال."
rhetoric:
  thesis: "يجاهر بالعدوان ويجعله فخرًا: القوة عندهم لا تنتظر سببًا."
  devices:
    - title: "الطباق في «ظَالِمِينَ» و«ظُلِمْنَا»"
      text: "الطباق الجمع بين الضدين. والضدان هنا من فعل واحد: الظالم والمظلوم، فنفى عنهم الثاني وأثبت الأول."
    - title: "الاستدراك بـ«لَكِنَّا»"
      text: "الاستدراك رفع ما يُتوهّم من الكلام السابق. فقد يُظن أنهم ظلموا جزاءً، فاستدرك: بل هم البادئون."
    - title: "المخالفة لقول ابن الأَنْبارِيّ في البيت 91"
      text: "ذهب ابن الأَنْبارِيّ إلى أن عَمْرًا لم يفخر بالجهل في «فنجهل فوق جهل الجاهلينا»، «لأن الجهل لا يستحسنه أحد ولا يرتضيه» [@ibn-al-anbari، ص427]. وهذا البيت يفخر بالظلم صريحًا، فهو أبعد عن ذلك الفهم. وهذه ملاحظتنا، ولم يربط أحد من القدماء بين الأمرين."
  connection: "ثم يأتي ثالث الأبيات المزيدة: «ملأنا البر حتى ضاق عنا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "بُغَاتَنْ ظَا / لِمِينَ وَمَا / ظُلِمْنَا = مفاعلْتن / مفاعلتن / فعولن — وَلَاكِنْنَا / سَنَبْدَأُ ظَا / لِمِينَا = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلة الأولى من الشطرين. وتُنطق «لَكِنَّا» بألف بعد اللام لا تُكتب: «لَاكِنْنَا»."
context: "ثاني الأبيات الثلاثة التي يقول ابن الأَنْبارِيّ إن «بعض الرواة» يروونها بعد البيت 91 [@ibn-al-anbari، ص427]، وهو من البيتين اللذين لم يعرفهما أبو جَعْفَر [@ibn-al-anbari، ص428]. ورواه التِّبْرِيزِيّ بلفظ آخر بعد «إذا ما الملك سام الناس خسفًا» [@tabrizi-ashr، ص248]، وليس في رواية الزَّوْزَنِيّ ولا الجَمْهَرة [@jamhara، ص298–299]."
variants:
  - reading: "نُسَمَّى ظَالِمِينَ وَمَا ظَلَمْنَا"
    status: "رواية التِّبْرِيزِيّ"
    note: "وذكر بعدها: «ويروى (بُغاة ظالمين وما ظلمنا)» [@tabrizi-ashr، ص248–249]. والمعنى على روايته: يسمّينا الناس ظالمين ولم نظلم بعد، ولكنا سنبدأ بالظلم."
