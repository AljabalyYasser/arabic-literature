first: "مَتَى نَنْقُلْ إِلَى قَوْمٍ رَحَانَا"
second: "يَكُونُوا فِي اللِّقَاءِ لَهَا طَحِينَا"
meaning: "متى نقلنا رحى حربنا إلى قوم، صاروا لها في اللقاء طحينًا، أي سحقناهم كما تسحق الرحى الحب. قال ابن الأَنْبارِيّ: «قوله: متى ننقل إلى قوم رحانا يكونوا كالطحين للرحى، أي كالحنطة. وهذا مثل، معناه متى حاربنا قوم كانوا كذلك» [@ibn-al-anbari، ص391]. وقال الزَّوْزَنِيّ: «أراد بالرحى: رحى الحرب وهي معظمها. يقول: متى حاربنا قومًا قتلناهم» [@zawzani، ص222]."
vocabulary:
  - term: "رَحَانَا"
    text: "الرحى: حجران يُطحن بهما الحب. و«رحى الحرب»: معظمها وموضع اشتدادها، كما يقول الزَّوْزَنِيّ: «أراد بالرحى: رحى الحرب وهي معظمها» [@zawzani، ص222]."
  - term: "اللِّقَاءِ"
    text: "الحرب والالتقاء بالعدو."
  - term: "طَحِينَا"
    text: "المطحون، قال ابن الأَنْبارِيّ: «وأصله مطحونا، فصرف عن مفعول إلى فعيل» [@ibn-al-anbari، ص391]."
syntax:
  - "قال ابن الأَنْبارِيّ: «وننقل جزم بمتى، ويكونوا جواب الجزاء، وطحينا خبر الكون» [@ibn-al-anbari، ص391]. أي أن «متى» اسم شرط جازم، و«يكونوا» جوابه مجزوم بحذف النون، والواو اسمها، و«طحينا» خبرها."
  - "«إلى قوم» متعلق بـ«ننقل»، و«في اللقاء» و«لها» متعلقان بـ«طحينا»."
morphology:
  - "«رَحًى» اسم مقصور، و«رحانا» مضاف إلى «نا»."
  - "«طَحِين» على «فَعِيل» بمعنى «مَفْعُول»."
  - "«نَنْقُل» مضارع «نَقَلَ» على «فَعَلَ يَفْعُلُ»."
rhetoric:
  thesis: "صورة الرحى من أشهر صور الحرب في الشعر الجاهلي. والشاعر يجعل الحرب آلة تمضي حيث يريد قومه، والأعداء مادة تُسحق فيها."
  devices:
    - title: "الاستعارة المرشّحة في «رَحَانَا ... طَحِينَا»"
      text: "استعار للحرب الرحى، ثم أتبعها بما يلائمها: الطحين. قال الزَّوْزَنِيّ: «لما استعار للحرب اسم الرحى استعار لقتلاها اسم الطحين» [@zawzani، ص222]. وهي استعارة بالمعنى الذي يحدّه عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الشرط في «مَتَى»"
      text: "«متى» تعم الأزمنة: في أي وقت نقلنا الرحى. فالنتيجة واحدة دائمًا، والشرط يجعل النصر قانونًا لا حادثة."
    - title: "صورة موروثة"
      text: "استشهد ابن الأَنْبارِيّ ببيت المُهَلْهِل جدّ الشاعر لأمه: «كأنَّا غُدوةً وبنى أبينا ... بجنْبِ عُنيزة رحَيا مُديِرِ»، وبقول زُهَيْر «فتعرككمُ عركَ الرَّحى بثفِالها» [@ibn-al-anbari، ص391]. فالصورة يتوارثها الشعراء، ويضيف إليها كل واحد."
  connection: "ثم يكمل الصورة: ثفال الرحى ولُهوتها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "مَتَا نَنْقُلْ / إِلَا قَوْمِنْ / رَحَانَا = مفاعَلْتن / مفاعَلْتن / فعولن — يَكُونُو فِلْ / لِقَاءِ لَهَا / طَحِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر، والتفعيلة الثانية من الصدر، والتفعيلة الأولى من العَجُز، فصارت «مفاعَلْتن»."
context: "من أبيات الخطاب للملك، وأول بيتي الرحى (24–25). وهو عند الزَّوْزَنِيّ البيت الثلاثون [@zawzani، ص222]."
