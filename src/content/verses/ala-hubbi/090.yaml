first: "إِذَا مَا الْمَلْكُ سَامَ النَّاسَ خَسْفًا"
second: "أَبَيْنَا أَنْ نُقِرَّ الْخَسْفَ فِينَا"
meaning: "إذا حمّل الملك الناس الذلّ والظلم، أبينا أن نقبله أو نُقيم عليه. قال ابن الأَنْبارِيّ: «يقول: إذا حمل الملك الناس على الظلم أبينا أن نحتمل ذلك ونقرَّ به» [@ibn-al-anbari، ص426]. وقال الزَّوْزَنِيّ: «إذا أكره الملك الناس على ما فيه ذلهم أبينا الانقياد له» [@zawzani، ص235]. وقال التِّبْرِيزِيّ: «وإنما يصف عزتهم، وأن الملوك لا تصل إلى ظلمهم» [@tabrizi-ashr، ص248]."
vocabulary:
  - term: "الْمَلْكُ"
    text: "الملِك بسكون اللام: «الملْك: الملِك. وفيه ثلاث لغات: ملِك، وملْك، ومليك» [@ibn-al-anbari، ص425]."
  - term: "سَامَ"
    text: "كلّف وحمّل: «وقوله (سام الناس) ، أي أولى الناس الخسف وأراده منهم» [@ibn-al-anbari، ص425]. وفي اللسان: «وَسَامَهُ الأَمرَ سَوْماً: كَلَّفَه إِياه، وَقَالَ الزَّجَّاجُ: أَولاه إِياه، وأَكثر مَا يُسْتَعْمَلُ فِي الْعَذَاب» [@lisan، ج12 ص311]."
  - term: "خَسْفًا"
    text: "«الظلم والنقصان» [@ibn-al-anbari، ص426]. و«الْخَسْف: والْخُسْف: بفتح الخاء وضمها: الذل» [@zawzani، ص235]."
syntax:
  - "«إِذَا» ظرف شرطي، و«مَا» زائدة، و«الْمَلْكُ» فاعل لفعل محذوف يفسّره «سَامَ»، لأن «إذا» لا يليها إلا فعل. و«النَّاسَ» مفعول أول، و«خَسْفًا» مفعول ثانٍ."
  - "«أَبَيْنَا» جواب الشرط، «وموضع أن نصب بأبينا» [@ibn-al-anbari، ص426]، أي أن المصدر المؤوّل من «أن نقرّ» مفعول به. و«فِينَا» متعلق بـ«نقرّ»."
morphology:
  - "«الْمَلْك» مخفف «الملِك»: «وقد يقول بعضهم: الملْك تخفيف الملك، بمنزلة قولهم: قد هرْم الرجل بمعنى هرِم الرجل» [@ibn-al-anbari، ص425]."
  - "«سَامَ يَسُومُ» أجوف واوي، ومصدره «السَّوْم». و«نُقِرَّ» مضارع «أَقَرَّ» الرباعي المضعّف."
  - "«أَبَيْنَا» ماضي «أَبَى يَأْبَى»، ناقص يائي ردّت ياؤه حين اتصل بضمير الرفع."
rhetoric:
  thesis: "يعود في آخر القصيدة إلى موضوعها الأول: علاقة القبيلة بالملك. فالقصيدة التي بدأت بالرد على عَمْرو بن هند تكاد تُختم بإباء الخضوع لأي ملك."
  devices:
    - title: "التعريض في «الْمَلْكُ»"
      text: "التعريض أن يُشار إلى معيّن بكلام عام دون تسميته. لم يسمّ عَمْرو بن هند، بل قال «الملك» معرّفًا، والقصيدة كلها في مجلسه وجواب وعيده. وهذه قراءتنا."
    - title: "التكرار في «خَسْفًا ... الْخَسْفَ»"
      text: "تختم الكلمة الصدر، وتعود في العَجُز، فما أراده الملك هو بعينه ما رُدّ عليه."
    - title: "الإسناد إلى «النَّاسَ» و«نا»"
      text: "الملك يسوم «الناس» كلهم، والإباء من «نا» وحدهم: فالناس يقبلون، وتَغْلِب تأبى."
  connection: "ثم يختم بالبيت الذي يرويه أكثر الناس آخرًا: «ألا لا يجهلن أحد علينا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "إِذَا مَلْ مَلْ / كُ سَامَنْ نَا / سَ خَسْفَنْ = مفاعلْتن / مفاعلْتن / فعولن — أَبَيْنَا أَنْ / نُقِرْرَلْ خَسْ / فَ فِينَا = مفاعلْتن / مفاعلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن». ودخل العَصْب، وهو «تسكين الحرف الخامس» [@atiq، ص54]، التفعيلات الأربع في الحشو. وفي نص ابن الأَنْبارِيّ على المكتبة الشاملة «أن يُقِرَّ» بالياء، وشرحه «أبينا أن نحتمل ذلك ونقرَّ به» [@ibn-al-anbari، ص426] يدل على النون، وبها رواية التِّبْرِيزِيّ والجَمْهَرة [@tabrizi-ashr، ص248]، [@jamhara، ص298]، فأخذنا بها."
context: "ما قبل الختام في رواية ابن الأَنْبارِيّ. وهو عند الزَّوْزَنِيّ من أواخر القصيدة أيضًا، قبل «ملأنا البر» [@zawzani، ص235]."
