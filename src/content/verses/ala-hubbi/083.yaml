first: "ظَعَائِنُ مِنْ بَنِي جُشَمَ بْنِ بَكْرٍ"
second: "خَلَطْنَ بِمِيسَمٍ حَسَبًا وَدِينَا"
meaning: "هن نساء من بني جُشَم بن بكر، جمعن إلى الجمال شرف النسب والدين. قال الزَّوْزَنِيّ: «هن نساء من هذه القبيلة جمعن إلى الجمال الكرم والدين» [@zawzani، ص233]. وقال التِّبْرِيزِيّ: «أي لهن مع جمالهن حسب ودين» [@tabrizi-ashr، ص246]."
vocabulary:
  - term: "ظَعَائِنُ"
    text: "«أصل (الظعينة) المرأة في الهودج، ثم قيل للمرأة وهي في بيتها ظعينة» [@ibn-al-anbari، ص421]."
  - term: "مِيسَمٍ"
    text: "«(الميسم) : الحسن» [@ibn-al-anbari، ص421]. وفي اللسان: «والمِيسَمُ والوَسَامَةُ: أَثر الحُسْنِ»، واستشهد بهذا العجز [@lisan، ج12 ص637]."
  - term: "حَسَبًا"
    text: "«الحسب: ما يحسب من مكارم الإنسان ومكارم أسلافه» [@zawzani، ص233]."
  - term: "دِينَا"
    text: "الدين والعفّة."
syntax:
  - "«وظعائن ترتفع على الاتباع لبيض، وخلطن خبر مستأنف» [@ibn-al-anbari، ص421]: أي أن «ظَعَائِنُ» بدل من «بيض» في البيت قبله، وجملة «خَلَطْنَ» مستأنفة. و«ظعائن» ممنوع من الصرف لأنه على صيغة منتهى الجموع."
  - "«بِمِيسَمٍ» متعلق بـ«خَلَطْنَ»، و«حَسَبًا» مفعول به، و«دِينَا» معطوف عليه، والألف للإطلاق."
morphology:
  - "«مِيسَم» على «مِفْعَل» من «وَسَمَ»: «وهو مفعل من وسمت، أصله موسم، فلما سكنت الواو وانكسر ما قبلها صارت ياء، كما قالت العرب ميثاق وأصله موثاق» [@ibn-al-anbari، ص421]."
  - "«حَسَب» على «فَعَل» بمعنى المفعول: «فهو فعل في معنى مفعول» [@zawzani، ص233]، كالنَّفَض والخَبَط والقَبَض واللَّقَط في أمثلته، أي المحسوب من المكارم."
  - "«ظَعَائِن» جمع «ظَعِينَة» على «فَعَائِل»."
rhetoric:
  thesis: "يرفع قدر النساء اللاتي يقاتل الرجال دونهن: جمال وحسب ودين، فحمايتهن حماية للشرف كله."
  devices:
    - title: "الجمع في «خَلَطْنَ بِمِيسَمٍ حَسَبًا وَدِينَا»"
      text: "الجمع أن يُجمع بين أشياء متعددة في حكم واحد. فقد جمعت هؤلاء النساء الجمال إلى النسب إلى الدين، والفعل «خلطن» يجعلها مادة واحدة لا تنفصل."
    - title: "الاستعارة في «خَلَطْنَ»"
      text: "الخلط للأشياء المادية، فجعل الصفات أخلاطًا تمتزج، فلا يُرى جمالهن إلا مع شرفهن."
    - title: "التكرار في «بَنِي جُشَمَ بْنِ بَكْرٍ»"
      text: "يعيد النسب الذي افتتح به ذكر الآباء في البيت 50، فالبطن الذي خرج منه الأجداد هو الذي خرجت منه هؤلاء النساء."
  connection: "ثم يذكر العهد الذي أخذنه على أزواجهن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "ظَعَائِنُ مِنْ / بَنِي جُشَمَبْ / نِ بَكْرِنْ = مفاعلتن / مفاعلتن / فعولن — خَلَطْنَ بِمِي / سَمِنْ حَسَبَنْ / وَدِينَا = مفاعلتن / مفاعلتن / فعولن"
  note: "جاء الحشو كله على الأصل «مفاعلتن»، بلا عَصْب، والعَصْب «تسكين الحرف الخامس» [@atiq، ص54]. وسقطت همزة «ابن» بين العلمين فاتصلت باؤه بما قبلها."
context: "من أبيات النساء (82–89). وهو عند الزَّوْزَنِيّ بعد «يقتن جيادنا» [@zawzani، ص233]."
