first: "مُشَعْشَعَةً كَأَنَّ الْحُصَّ فِيهَا"
second: "إِذَا مَا الْمَاءُ خَالَطَهَا سَخِينَا"
meaning: "اسقينا خمرًا ممزوجة بالماء، كأن فيها الوَرْس من لونها إذا خالطها الماء. وفي آخر البيت قولان قديمان: أن «سَخِينَا» من السخاء، أي إذا شربناها ممزوجة صرنا أسخياء، وأن «سَخِينًا» صفة للماء، أي إذا خالطها الماء حارًّا. ونقل ابن الأَنْبارِيّ عن أبي عَمْرو أن معناه إذا مُزجت وشربناها «كنا أسخياء، أي ازداد سخاؤنا»، ثم قال: «وقال غيره: إذا ما الماء خالطها سخينا معناه إنها تمزج بالماء الحار» [@ibn-al-anbari، ص372]. وجمع الزَّوْزَنِيّ بين اللون والسخاء: «كأنها من شدة حمرتها بعد امتزاجها بالماء ألقي فيها نَوْر هذا النبت الأحمر»، ثم قال إنهم إذا شربوها وسكروا جادوا بأنفس أموالهم [@zawzani، ص215]."
vocabulary:
  - term: "مُشَعْشَعَةً"
    text: "«الخمر التي أرق مزجها» [@ibn-al-anbari، ص372]، أي أكثروا ماءها حتى رقّت."
  - term: "الْحُصَّ"
    text: "«الورس» [@ibn-al-anbari، ص372]، وهو عند الزَّوْزَنِيّ «نبت له نوّار أحمر يشبه الزعفران» [@zawzani، ص215]."
  - term: "سَخِينَا"
    text: "فيه وجهان: «جعل سخينًا صفة ومعناه الحار، من سخن يسخُن سخونة»، أو «جعله فعلًا من سخي يسخى سخاءً» [@zawzani، ص215]."
syntax:
  - "«مُشَعْشَعَةً» منصوب، قال ابن الأَنْبارِيّ: «ومشعشعة نصب بقوله فاصبحينا» [@ibn-al-anbari، ص372]، أي مفعول به ثانٍ: اسقينا خمرًا مشعشعة. ويذكر البَغْداديّ معه وجهين آخرين: «وقيل: حال من خمور وقيل بدل منها» [@khizana، ج3 ص179]."
  - "«كَأَنَّ الْحُصَّ فِيهَا»: «كأنّ» حرف تشبيه ونصب، و«الحُصَّ» اسمها، و«فيها» جار ومجرور في موضع خبرها، والجملة صفة لـ«مشعشعة». و«فيها» عند ابن الأَنْبارِيّ «معناه في الخمر» [@ibn-al-anbari، ص372]."
  - "«إِذَا مَا الْمَاءُ خَالَطَهَا سَخِينَا»: قال ابن الأَنْبارِيّ: «وإذا وقت، والماء رفع بما عاد من خالط، وما صلة وسخينا فعل ماض من السخاء جواب لإذا. ومن قال سخينا حارا نصبه على الحال من الماء» [@ibn-al-anbari، ص372]. يريد أن «الماء» فاعل لفعل محذوف يفسره «خالطها»، و«ما» زائدة."
morphology:
  - "«مُشَعْشَعَة» اسم مفعول من «شَعْشَعَ» الرباعي، يقال: «وما مزج فأرق مزجه فقد شعشع، ومنه قيل رجل شعشاع، إذا كان طويلا خفيف اللحم» [@ibn-al-anbari، ص372]."
  - "«سَخِينَا» على الوجه الأول ماضٍ من «سَخِيَ يَسْخَى»، والنون والألف ضمير المتكلمين، «وفيه ثلاث لغات: إحداهن ما ذكرنا، والثانية سَخُوَ يسخو، والثالثة سخا يسخو سخاوة» [@zawzani، ص215]. وعلى الوجه الثاني «سَخِين» على «فَعِيل» بمعنى «مُفْعَل»، قال ابن بَرِّيّ: «وَقَدْ جَاءَ ذَلِكَ كَثِيرًا، أَعني فَعَيْلًا بِمَعْنَى مُفْعَل مِثْلَ مُسْخَن وسَخِين» [@lisan، ج13 ص205]."
  - "«الحُصّ» جمعه «أَحْصاصٌ وحُصوصٌ» [@lisan، ج7 ص15]."
rhetoric:
  thesis: "بعد الدعوة إلى الشراب يصف الخمر بلونها وبفعلها: لونها حين تُمزج كلون الوَرْس، وفعلها، إن كانت «سخينا» من السخاء، أنها تجعل شاربيها كرامًا. والكرم هو ما سيفخر به المطلع كله."
  devices:
    - title: "التشبيه"
      text: "«كَأَنَّ الْحُصَّ فِيهَا»: شبّه لون الخمر الممزوجة بلون الوَرْس، حتى كأنه أُلقي فيها. وهو عند عبد القاهر الجُرْجانيّ من التشبيه الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل»، ومنه «التشبيه من جهة اللّون، كتشبيه الخدود بالورد» [@asrar، ص90]."
    - title: "كلمة بوجهين"
      text: "«سَخِينَا» تقبل معنيين، واختلف فيها العلماء. فالجوهري يجعلها من السخاء ويردّ قول من جعلها من السخونة، وابن الأعرابي يقول: «وَقَوْلُ مَنْ قَالَ جُدْنا بأَموالنا فَلَيْسَ بِشَيْءٍ»، ويوافقه ابن بَرِّيّ: «يَعْنِي أَنّ الْمَاءَ الْحَارَّ إِذَا خَالَطَهَا اصْفَرَّت، قَالَ: وَهَذَا هُوَ الصَّحِيحُ؛ وَكَانَ الأَصمعي يَذْهَبُ إِلَى أَنه مِنَ السَّخاء لأَنه يَقُولُ بَعْدَ هَذَا الْبَيْتِ: تَرَى اللَّحِزَ الشَّحِيحَ» [@lisan، ج13 ص205] [@lisan، ج14 ص373]. فمن قرأها من السخاء ربطها بالبيت الرابع، ومن قرأها من السخونة ربطها بلون الوَرْس في الشطر الأول."
  connection: "ثم يصف فعلها في صاحب الحاجة: تميل به عن هواه حتى يلين."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "مُشَعْشَعَتَنْ / كَأَنْنَلْ حُصْ / صَ فِيهَا = مفاعلَتن / مفاعَلْتن / فعولن — إِذَا مَلْ مَا / ءُ خَالَطَهَا / سَخِينَا = مفاعَلْتن / مفاعلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. ودخل العَصْب، و«العصب: هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر والأولى من العَجُز."
context: "ثاني أبيات المطلع الخمري (1–4) في رواية ابن الأَنْبارِيّ، وهو المطلع الذي تنفرد به هذه المعلقة بين المعلقات السبع. ويورد البَغْداديّ المطلع كله ويشرحه في «خزانة الأدب» [@khizana، ج3 ص178–179]."
variants:
  - reading: "إِذَا مَا الْمَاءُ خَالَطَهَا شَحِينَا"
    status: "رواية يذكرها ابن الأَنْبارِيّ والزَّوْزَنِيّ"
    note: "يقول ابن الأَنْبارِيّ إنها تُروى «بالشين معجمة وبالحاء غير معجمة» [@ibn-al-anbari، ص372]، أي مملوءة: «يريد أنها حال امتزاجها بالماء وكون الماء كثيرًا تشبه هذا النَّور» [@zawzani، ص216]."
