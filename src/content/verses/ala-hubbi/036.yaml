first: "كَأَنَّ ثِيَابَنَا مِنَّا وَمِنْهُمْ"
second: "خُضِبْنَ بِأُرْجُوَانٍ أَوْ طُلِينَا"
meaning: "كأن ثيابنا وثياب أعدائنا، من كثرة الدم عليها، صُبغت بصبغ أحمر أو طُليت به. قال ابن الأَنْبارِيّ: «(الأرجوان) : صبغ احمر. فشبه كثرة الدماء على الثياب بصبغ أحمر» [@ibn-al-anbari، ص398]. وقال الزَّوْزَنِيّ: «يقول: كأن ثيابنا وثياب أقراننا خضبت بأرجوان أو طليت» [@zawzani، ص225]."
vocabulary:
  - term: "أُرْجُوَانٍ"
    text: "«صبغ احمر» [@ibn-al-anbari، ص398]. وفي «لسان العرب»: «قَالَ أَبو عُبَيْدٍ: الأُرْجُوَان الشَّدِيدُ الحُمْرَة، لَا يُقَالُ لِغَيْرِ الحُمْرة أُرْجُوَان، وَقَالَ غَيْرُهُ أُرْجُوَان مُعَرَّبٌ أَصله أُرْغُوَانٌ بِالْفَارِسِيَّةِ» [@lisan، ج14 ص312]."
  - term: "خُضِبْنَ"
    text: "صُبغن."
  - term: "طُلِينَا"
    text: "دُهنّ ولُطخن."
syntax:
  - "قال ابن الأَنْبارِيّ: «وخبر كأن ما عاد من خضبن، وطلينا نسق على خضبن» [@ibn-al-anbari، ص398]. أي أن جملة «خُضبن» خبر «كأنّ»."
  - "«منّا ومنهم» في موضع الحال من «ثيابنا»: كائنة منا ومنهم."
  - "«أو» للتخيير أو للإبهام: لا يدري أصُبغت أم طُليت."
morphology:
  - "«خُضِبْنَ» و«طُلِينَ» ماضيان مبنيان للمجهول مسندان إلى نون النسوة."
  - "«طُلِيَ» من «طَلَى يَطْلِي»، ناقص يائي."
  - "«أُرْجُوَان» اسم معرّب، كما في «اللسان»."
rhetoric:
  thesis: "البيت تتمة لسابقه: بعد السيوف، الثياب. ولم يذكر الدم صراحة، بل ذكر لونه، فبقيت الصورة صورة صبغ لا صورة جرح."
  devices:
    - title: "التشبيه في «كَأَنَّ ثِيَابَنَا ... خُضِبْنَ بِأُرْجُوَانٍ»"
      text: "قال ابن الأَنْبارِيّ: «فشبه كثرة الدماء على الثياب بصبغ أحمر» [@ibn-al-anbari، ص398]. وهو تشبيه في اللون يُدرك بالعين، من الضرب الذي يكون عند عبد القاهر الجُرْجانيّ «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "حذف المشبه به الحقيقي"
      text: "لم تُذكر كلمة الدم في البيت، ففهمها السامع من الصبغ الأحمر. والحذف هنا عند عبد القاهر الجُرْجانيّ مما يكون فيه «ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "الموازنة بين البيتين 35–36"
      text: "«كأن سيوفنا فينا وفيهم» و«كأن ثيابنا منا ومنهم»: بناء واحد يتكرر، والإنصاف نفسه: الدم على الفريقين. وهذه قراءتنا."
  connection: "ثم يقول: إذا عجز قوم عن التقدم خوفًا، تقدمنا نحن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ النون، والألف بعدها للإطلاق"
  scansion: "كَأَنْنَ ثِيَا / بَنَا مِنْنَا / وَمِنْهُمْ = مفاعلَتن / مفاعَلْتن / فعولن — خُضِبْنَ بِأُرْ / جُوَانِنْ أَوْ / طُلِينَا = مفاعلَتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض، وهي آخر تفعيلة في الصدر، والضَّرْب، وهو آخر تفعيلة في العَجُز، «فعولن» في القصيدة كلها، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، و«هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الثانية من الصدر، والتفعيلة الثانية من العَجُز، فصارت «مفاعَلْتن»."
context: "ثاني البيتين المتوازيين (35–36). ويرى التِّبْرِيزِيّ أن من قال إن الشاعر يصف سيوف الفريقين في البيت السابق «احتج بهذا البيت» [@tabrizi-ashr، ص231]. وهو عند الزَّوْزَنِيّ البيت الرابع والأربعون [@zawzani، ص225]."
