first: "لَمْ أَرَ مِثْلَ الْفِتْيَانِ فِي غَبَنِ الْـ"
second: "ـأَيَّامِ يَنْسَوْنَ مَا عَوَاقِبُهَا"
vocabulary:
  - term: "غَبَنِ الْأَيَّامِ"
    text: "يقول أبو الفَرَج: «الأيامُ تَغْبِنُ الناسَ فتخدَعُهم وتختِلُهم مثلَ الغبنِ في البيع» [@aghani-dk، ج2 ص147]."
  - term: "عَوَاقِبُهَا"
    text: "ما تنتهي إليه."
