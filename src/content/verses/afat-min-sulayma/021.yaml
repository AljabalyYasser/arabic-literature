first: "تَبِيتُ النِّسَاءُ المُرْضِعَاتُ بِرَهْوَةٍ"
second: "تَفَزَّعُ مِنْ خَوْفِ الجَنَانِ قُلُوبُهَا"
vocabulary:
  - term: "بِرَهْوَةٍ"
    text: "الرَّهْوة عند أبي عبيدة: ما ارتفع من الأرض وما انخفض، أي فررن فاستترن [@tabrizi-ikhtiyarat، ج3 ص1391]."
  - term: "الجَنَانِ"
    text: "الظلمة، وقيل: سواد الشخص. والمراد شمول الخوف لهن على كل حال [@tabrizi-ikhtiyarat، ج3 ص1391]."
