first: "نَقَلْنَاهُمُ نَقْلَ الكِلَابِ جِرَاءَهَا"
second: "عَلَى كُلِّ مَعْلُوبٍ يَثُورُ عُكُوبُهَا"
vocabulary:
  - term: "نَقَلْنَاهُمُ نَقْلَ الكِلَابِ جِرَاءَهَا"
    text: "أي كنّا مقتدرين عليهم، وكانوا أذلّاء لنا، نكرّهم فيهم كيف نشاء [@tabrizi-ikhtiyarat، ج3 ص1388]."
  - term: "مَعْلُوبٍ"
    text: "طريق، وأصل العَلْب الأثر [@tabrizi-ikhtiyarat، ج3 ص1388]."
  - term: "عُكُوبُهَا"
    text: "غبارها."
