first: "عَضَارِيطُنَا مُسْتَبْطِنُو البِيضِ كَالدُّمَى"
second: "مُضَرَّجَةً بِالزَّعْفَرَانِ جُيُوبُهَا"
meaning: "سبينا نساءكم يا بني عامر، فصار خدمنا وأتباعنا يضاجعون البيض منهن، الحسان كالتماثيل، المصبوغة جيوب ثيابهن بالزعفران."
vocabulary:
  - term: "عَضَارِيطُنَا"
    text: "«العضاريط»: الأُجَراء والأتباع، واحدها عُضْروط وعِضْرَوْط [@tabrizi-ikhtiyarat، ج3 ص1390]."
  - term: "مُسْتَبْطِنُو"
    text: "جمع مستبطن، حُذفت نونه للإضافة، من استبطن المرأة: صار في بطنها، أي ضاجعها. والتِّبْرِيزِيّ يشرحه بقوله «فاستبطنوهن» [@tabrizi-ikhtiyarat، ج3 ص1391]."
  - term: "البِيضِ"
    text: "النساء البيض، كناية عن الحرائر المنعّمات."
  - term: "الدُّمَى"
    text: "«التماثيل، شبّه بهن النساء في الحسن» [@tabrizi-ikhtiyarat، ج3 ص1391]."
  - term: "مُضَرَّجَةً"
    text: "ملطخة مصبوغة بلون أحمر."
  - term: "جُيُوبُهَا"
    text: "جيب القميص: فتحته عند العنق والصدر، وكانت الحرائر يطيّبنه بالزعفران."
context: "من القصيدة 96، وقالها بِشْر «في حرب ودماء كانت بين بني سعد بن ضبة وبين بني يربوع» كما يقول التِّبْرِيزِيّ، ويقول محقق شرحه قباوة إنها يوم النِّسار، استعانت فيه بنو سعد بن ضبة بأسد وطيئ على يربوع وهوازن فهزمتهم [@tabrizi-ikhtiyarat، ج3 ص1379]، وبنو عامر من هوازن. بعد أن عدّد بِشْر من قُتل من بني عامر، يخاطبهم: «بني عامر إنا تركنا نساءكم من الشل والإيجاف تدمى عجوبها» (19)، أي ساقوهن سوقًا شديدًا على غير وطاء، ثم يذكر في هذا البيت ما صار إليه السبي. وهو هجاء بالعِرض، أقسى ما يعيّر به العربي خصمه: أن نساءه صرن في أيدي الخدم."
syntax:
  - "«عضاريطُنا» مبتدأ مضاف إلى «نا»، و«مستبطِنو» خبره، مضاف إلى «البيضِ»، وحُذفت نونه للإضافة."
  - "«كالدُّمى» جار ومجرور في موضع الحال من «البيض» أو نعت لها، أي البيض المشبهات بالتماثيل."
  - "«مضرّجةً» حال من «البيض»، و«جيوبُها» نائب فاعل لاسم المفعول «مضرّجة»، و«بالزعفران» متعلق به."
  - "وفي رواية الطُّوسِيّ «عضاريطُنا البيضُ الكواعبُ كالدمى» يتغير الإعراب: «البيضُ» خبر، والمعنى أن النساء صرن خدمنا."
morphology:
  - "«عضاريط» جمع «عُضْروط» على «فعاليل»، من الخماسي المزيد."
  - "«مستبطِن» اسم فاعل من «استبطن» على «استفعل» من البطن، والسين والتاء للاتخاذ: اتخذها في بطنه، أي صار فوق بطنها."
  - "«الدُّمى» جمع «دُمْية»، وهي الصورة المنحوتة من رخام أو عاج."
  - "«مضرّجة» اسم مفعول من «ضرّج» على «فعّل»، والتضعيف للتكثير."
rhetoric:
  thesis: "هجاء صريح بالسبي والاغتصاب، يجمع بين أقسى ما في الحرب الجاهلية وأجمل ما في وصف النساء: الضحايا حسان كالدمى، والمضاجعون خدم وأُجَراء، وفي الجمع بينهما الإهانة كلها."
  devices:
    - title: "التصريح بالسبي"
      text: "لم يكتف بالسبي، بل ذكر المضاجعة بلفظ صريح «مستبطنو». ويقول التِّبْرِيزِيّ: «يريد: أنّا سبينا نساءكم، واستهنّا بهن، وملّكنا أمورهن التُّبّاع والخدم، فاستبطنوهن. وجعلهن «بيضًا كالدمى» تشنيعًا» [@tabrizi-ikhtiyarat، ج3 ص1391]. فالجمال هنا ليس غزلًا، بل زيادة في التشنيع على قومهن."
    - title: "المفارقة بين الطرفين"
      text: "في أول البيت «عضاريطنا»، أدنى الناس منزلة، وبعدها «البيض كالدمى» المضرّجة جيوبها بالزعفران، أعلى النساء نعمة. والبيت مبني على هذه المسافة: كلما ارتفعت النساء في الوصف اشتد العار. وهذه قراءتنا."
    - title: "التشبيه"
      text: "«كالدمى» تشبيه للنساء بالتماثيل في البياض وحسن الصورة، وهو من التشبيهات المألوفة في الغزل الجاهلي، استعمله هنا في الهجاء."
    - title: "الكناية"
      text: "«مضرّجة بالزعفران جيوبها» كناية عن أنهن حرائر منعّمات، لا إماء يعملن، فالطيب في جيوبهن علامة النعمة التي سُلبت."
  connection: "ثم يصف المرضعات منهن يبتن على رهوة من الأرض، وقلوبهن تفزع من خوف الليل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المضمومة، موصولة بالهاء والألف «ـبُهَا»"
  scansion: "عَضَارِي / طُنَا مُسْتَبْ / طِنُلْبِي / ضِكَدْدُمَى = فعولن / مفاعيلن / فعولن / مفاعلن — مُضَرْرَ / جَتَنْبِزْزَعْ / فَرَانِ / جُيُوبُهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "العَرُوض والضَّرْب مقبوضتان «مفاعلن»، وهو لازم في الطويل، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]. وفي العجز قبض «فعولن» مرتين فصارت «فعولُ»، والقبض: حذف الخامس الساكن."
variants:
  - reading: "عَضَارِيطُنَا البِيضُ الكَوَاعِبُ كَالدُّمَى"
    status: "رواية الطُّوسِيّ"
    note: "[@tabrizi-ikhtiyarat، ج3 ص1391]، والمعنى عليها أن النساء صرن خدمًا لهم."
  - reading: "عَضَارِيطُنَا مُسْتَبْطِنُو البِيضَ كَالدُّمَى"
    status: "رواية ابن الأَنْبارِيّ"
    note: "بنصب «البيضَ» مفعولًا لاسم الفاعل، وحُذفت النون تخفيفًا لا للإضافة [@tabrizi-ikhtiyarat، ج3 ص1390]. وفي الديوان «مستحقبو البيض»، أي حاملوهن خلفهم على الرحال، كما يذكر محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1390]."
