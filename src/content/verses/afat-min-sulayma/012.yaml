explained: false
first: "فَكَانُوا كَذَاتِ القِدْرِ لَمْ تَدْرِ إِذْ غَلَتْ"
second: "أَتُنْزِلُهَا مَذْمُومَةً أَمْ تُذِيبُهَا"
vocabulary:
  - term: "كَذَاتِ القِدْرِ"
    text: "امرأة كانت تسلأ سمنًا ففاجأها ما أفزعها، فلم تدر أتُنزل القدر فيفسد السمن، أم تُطعم منه، فتحيّرت. فيقول: كانت هوازن لما أحسّت بنا في التحيّر كتلك [@tabrizi-ikhtiyarat، ج3 ص1386–1387]."
  - term: "تُذِيبُهَا"
    text: "قالوا: إذابتها إياها أن تغرف لهم منها وتطعمهم [@tabrizi-ikhtiyarat، ج3 ص1387]."
