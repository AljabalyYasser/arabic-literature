explained: false
first: "بِغَرْبٍ وَمَرْبُوعٍ وَعَوْدٍ تُقِيمُهُ"
second: "مَحَالَةُ خُطَّافٍ تَصِرُّ ثُقُوبُهَا"
vocabulary:
  - term: "مَرْبُوعٍ"
    text: "حبل فُتل على أربع قُوًى [@tabrizi-ikhtiyarat، ج3 ص1382]."
  - term: "عَوْدٍ"
    text: "البعير المسنّ [@tabrizi-ikhtiyarat، ج3 ص1382]."
  - term: "مَحَالَةُ خُطَّافٍ"
    text: "المَحالة: البَكْرة، سميت بذلك لأنها تُحيل الماء، أي تصبّه، والخُطّاف: الحديدة التي تدور عليها البكرة [@tabrizi-ikhtiyarat، ج3 ص1382–1383]."
  - term: "تَصِرُّ"
    text: "تصوّت، يريد صرير البكرة إذا دارت."
