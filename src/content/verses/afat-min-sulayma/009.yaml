explained: false
first: "وَكُنَّا إِذَا قُلْنَا هَوَازِنُ أَقْبِلِي"
second: "إِلَى الرُّشْدِ لَمْ يَأْتِ السَّدَادَ خَطِيبُهَا"
vocabulary:
  - term: "هَوَازِنُ"
    text: "نصف قيس، لأن قيسًا هم هوازن وغطفان [@tabrizi-ikhtiyarat، ج3 ص1385]."
  - term: "السَّدَادَ"
    text: "الصواب من الأمر [@tabrizi-ikhtiyarat، ج3 ص1385]."
  - term: "خَطِيبُهَا"
    text: "القيّم بشأنهم والمدبّر لهم، يريد: إذا رُمنا ردّهم إلى القصد أبوا إلا اللجاج [@tabrizi-ikhtiyarat، ج3 ص1386]."
