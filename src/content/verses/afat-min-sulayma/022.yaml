first: "دَعُوا مَنْبِتَ السِّيفَيْنِ إِنَّهُمَا لَنَا"
second: "إِذَا مُضَرُ الحَمْرَاءُ شُبَّتْ حُرُوبُهَا"
vocabulary:
  - term: "مَنْبِتَ السِّيفَيْنِ"
    text: "السِّيف: ساحل البحر [@tabrizi-ikhtiyarat، ج3 ص1392]."
  - term: "مُضَرُ الحَمْرَاءُ"
    text: "«الحمراء» لقب لمُضَر، لأنها ورثت عن أبيها القبّة الحمراء، كما قيل لربيعة لما ورثت الخيل: ربيعة الفرس [@tabrizi-ikhtiyarat، ج3 ص1392]."
