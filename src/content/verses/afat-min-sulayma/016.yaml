explained: false
first: "لَدُنْ غُدْوَةً حَتَّى أَتَى اللَّيْلُ دُونَهُمْ"
second: "وَأَدْرَكَ جَرْيَ المُبْقِيَاتِ لُغُوبُهَا"
vocabulary:
  - term: "لَدُنْ غُدْوَةً"
    text: "أي قتلناهم من غُدوة إلى الليل [@tabrizi-ikhtiyarat، ج3 ص1389]."
  - term: "المُبْقِيَاتِ"
    text: "ذوات الجري، أي الخيل التي تُبقي من جريها [@tabrizi-ikhtiyarat، ج3 ص1389]."
  - term: "لُغُوبُهَا"
    text: "تعبها وإعياؤها."
