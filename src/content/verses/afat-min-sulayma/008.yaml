explained: false
first: "أَجَبْنَا بَنِي سَعْدِ بْنِ ضَبَّةَ إِذْ دَعَوْا"
second: "وَلِلَّهِ مَوْلَى دَعْوَةٍ لَا يُجِيبُهَا"
vocabulary:
  - term: "إِذْ دَعَوْا"
    text: "حين استصرخوا [@tabrizi-ikhtiyarat، ج3 ص1385]."
  - term: "وَلِلَّهِ مَوْلَى دَعْوَةٍ لَا يُجِيبُهَا"
    text: "تعجّب وإنكار: لله مدعوٌّ ومستغاث به لا يُغيث ولا يجيب إذا دُعي، وهو هنا ذمّ. قال ابن الأعرابي: كانت ضَبّة دعت فأجابتها أَسَد، وهذا يوم النِّسار [@tabrizi-ikhtiyarat، ج3 ص1385]."
