explained: false
first: "قَطَعْنَاهُمُ فَبِاليَمَامَةِ فِرْقَةٌ"
second: "وَأُخْرَى بِأَوْطَاسٍ تَهِرُّ كَلِيبُهَا"
vocabulary:
  - term: "قَطَعْنَاهُمُ"
    text: "هزمناهم وبدّدنا شملهم فصاروا فِرَقًا [@tabrizi-ikhtiyarat، ج3 ص1387]."
  - term: "أَوْطَاسٍ"
    text: "وادٍ بحُنَيْن [@tabrizi-ikhtiyarat، ج3 ص1387]."
  - term: "تَهِرُّ كَلِيبُهَا"
    text: "الكَلِيب: الكلاب، وجعلها تهرّ لأنها رأت ما لا عهد لها به [@tabrizi-ikhtiyarat، ج3 ص1387–1388]."
