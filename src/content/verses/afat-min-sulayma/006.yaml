explained: false
first: "مُعَالِيَةً لَا هَمَّ إِلَّا مُحَجَّرٌ"
second: "وَحَرَّةُ لَيْلَى السَّهْلُ مِنْهَا وَلُوبُهَا"
vocabulary:
  - term: "مُعَالِيَةً"
    text: "يريد أنها تقصد العالية، يقال: عاليتُ، إذا أتيت العالية [@tabrizi-ikhtiyarat، ج3 ص1383]، والعالية: ما ارتفع من بلاد نجد."
  - term: "مُحَجَّرٌ"
    text: "موضع [@tabrizi-ikhtiyarat، ج3 ص1383]."
  - term: "حَرَّةُ لَيْلَى"
    text: "الحَرّة: أرض تلبَّس حجارةً سودًا، و«اللُّوب» جمع لُوبة، وهي الحرّة [@tabrizi-ikhtiyarat، ج3 ص1383]."
