explained: false
first: "جَعَلْنَ قُشَيْرًا غَايَةً يُهْتَدَى بِهَا"
second: "كَمَا مَدَّ أَشْطَانَ الدِّلَاءِ قَلِيبُهَا"
vocabulary:
  - term: "قُشَيْرًا"
    text: "من هوازن [@tabrizi-ikhtiyarat، ج3 ص1389]."
  - term: "غَايَةً"
    text: "جعلناهم غاية في الشرّ، وقيل: الغاية هنا الراية [@tabrizi-ikhtiyarat، ج3 ص1389]."
  - term: "كَمَا مَدَّ أَشْطَانَ الدِّلَاءِ قَلِيبُهَا"
    text: "شبّه انجذاب الخيل نحو قشير بانجذاب الدلاء بحبالها إلى البئر [@tabrizi-ikhtiyarat، ج3 ص1389]. والأشطان: الحبال، والقليب: البئر."
