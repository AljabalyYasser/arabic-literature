explained: false
first: "عَطَفْنَا لَهُمْ عَطْفَ الضَّرُوسِ مِنَ المَلَا"
second: "بِشَهْبَاءَ لَا يَمْشِي الضَّرَاءَ رَقِيبُهَا"
vocabulary:
  - term: "الضَّرُوسِ"
    text: "الناقة السيئة الخلق على من يريد الدنوّ منها في وِلادها [@tabrizi-ikhtiyarat، ج3 ص1386]."
  - term: "المَلَا"
    text: "الصحراء [@tabrizi-ikhtiyarat، ج3 ص1386]."
  - term: "بِشَهْبَاءَ"
    text: "بكتيبة شهباء [@tabrizi-ikhtiyarat، ج3 ص1386]، يلمع فيها الحديد."
  - term: "لَا يَمْشِي الضَّرَاءَ رَقِيبُهَا"
    text: "لا يستخفي رئيسها ولا يتوارى، لعزّها وكثرتها، والضَّراء: ما واراك من شجر [@tabrizi-ikhtiyarat، ج3 ص1386]."
