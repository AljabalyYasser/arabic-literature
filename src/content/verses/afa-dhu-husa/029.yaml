first: "خَطَاطِيفُ حُجْنٌ فِي حِبَالٍ مَتِينَةٍ"
second: "تَمُدُّ بِهَا أَيْدٍ إِلَيْكَ نَوَازِعُ"
meaning: "أنا في يدك كالدلو في البئر: خطاطيف معوجّة مشدودة بحبال متينة، تمدّها إليك أيدٍ تجذبها. قال الأَعْلَم: «يقول: ضاقت الدنيا عليّ فكأني في بئر، فأنا أُجَرّ بالخطاطيف إليك وأُجذَب، وهذا مثلٌ، ضربه لقوة سلطانه، وإدراكه لمطلوبه» [@diwan-nabigha، ص38]."
vocabulary:
  - term: "خَطَاطِيفُ"
    text: "«جمع خُطّاف البئر، وهو مثل القَعْو الذي فيه البكرة، إلا أنه من حديد والقعو من خشب» [@diwan-nabigha، ص38]. وفي اللسان: «والخُطَّافُ: حَدِيدَةٌ حَجْناءُ تُعْقَلُ بِهَا البَكْرةُ مِنْ جانِبَيْها فِيهَا المِحْوَر» [@lisan، ج9 ص77]. والبكرة خشبة مستديرة يجري عليها حبل الدلو."
  - term: "حُجْنٌ"
    text: "«جمع أحجن وهو المعوجّ» [@diwan-nabigha، ص38]."
  - term: "مَتِينَةٍ"
    text: "«القويّة» [@diwan-nabigha، ص38]."
  - term: "نَوَازِعُ"
    text: "«أي جواذب، ويقال: نزعت من البئر دلوًا أو دلوين، إذا جذبتهما» [@diwan-nabigha، ص38]."
context: "تتمّة البيت السابق، وهما عند النقاد بيت واحد في المعنى. قال ابن قُتَيْبة بعد أن أنشد البيت 28: «ثم قال»، وأنشد هذا البيت، ثم حكم عليهما: «قال أبو محمد: رأيت قوما يستجيدونه. وهو عندي غير جيّد في المعنى ولا التشبيه» [@ibn-qutayba، ج1 ص169]. وأبو محمد هو ابن قُتَيْبة نفسه، فهو يخالف من يستحسن البيتين."
syntax:
  - "«خَطَاطِيفُ» خبر لمبتدأ محذوف يدل عليه الكلام قبله، كأنه قال: ولك خطاطيف، أو: فأنت لي خطاطيف. وهذا تقديرنا، فالبيت متمّم لصورة البيت السابق."
  - "«حُجْنٌ» صفة لخطاطيف، و«فِي حِبَالٍ مَتِينَةٍ» صفة ثانية، و«مَتِينَةٍ» صفة لحبال."
  - "«تَمُدُّ بِهَا أَيْدٍ» جملة صفة ثالثة، و«أيدٍ» فاعل «تمدّ» مرفوع بضمة مقدّرة على الياء المحذوفة، و«نَوَازِعُ» صفة لأيد، و«إليك» متعلق بـ«تمدّ»."
morphology:
  - "«خَطَاطِيف» جمع «خُطّاف» على «فَعَالِيل»."
  - "«حُجْن» جمع «أحجن» على «فُعْل»، كما يقول الأَعْلَم [@diwan-nabigha، ص38]."
  - "«أَيْدٍ» جمع «يد» على «أَفْعُل»، أصله «أَيْدُيٌ»، فقُلبت ضمة الدال كسرة لتسلم الياء، ثم حُذفت الياء للتنوين كما في كل اسم منقوص."
  - "«نَوَازِع» جمع «نازعة» على «فَوَاعِل»، من «نزع» إذا جذب."
rhetoric:
  thesis: "ينتقل من صورة الليل الواسع إلى صورة القبضة: حديد معوجّ لا يُفلت، وحبال لا تنقطع، وأيدٍ تجذب. فالبيت السابق يقول إنه لا مهرب، وهذا البيت يقول كيف يُجَرّ الهارب."
  devices:
    - title: "التمثيل في «خَطَاطِيفُ حُجْنٌ»"
      text: "صورة مركّبة من البئر والدلو: الشاعر كالدلو في قعر البئر، والملك يجذبه بخطاطيفه متى شاء. وقد قال الأَعْلَم: «وهذا مثلٌ، ضربه لقوة سلطانه، وإدراكه لمطلوبه» [@diwan-nabigha، ص38]. والشبه هنا لا يُدرك بالحس، بل يحتاج إلى تأمّل، وهذا ما يسميه عبد القاهر الجُرْجانيّ تمثيلًا [@asrar، ص95]."
    - title: "اختلاف القراءة"
      text: "الأيدي عند الأَعْلَم أيدي سلطان الملك تجذب الشاعر [@diwan-nabigha، ص38]. ويقرأ شَوْقي ضَيْف البيت قراءة أخرى، فيجعل الخطاطيف قصائد النابِغة نفسه: «فصور قصائده التى يرسل بها إليه ليلين قلبه عليه كأنها خطاطيف معوجة ثبّتت فى حبال متينة، وأيدى النابغة تمد بها إليه، تريد أن تظفر بعطفه ورضاه» [@deif، ج1 ص290]. فالصورة عند الأول خوف من القوة، وعند الثاني رجاء في العطف."
    - title: "تتابع الصفات"
      text: "كل صفة تسدّ منفذًا للهرب: «حُجْنٌ» لأن المعوجّ لا ينفلت ما علق به، و«مَتِينَةٍ» لأن الحبل القوي لا ينقطع، و«نَوَازِعُ» لأن الأيدي لا تفتر عن الجذب."
  connection: "ثم يسأله: أتتوعّد عبدًا لم يخنك وتترك الظالم؟"
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "خَطَاطِي / فُ حُجْنُنْ فِي / حِبَالِنْ / مَتِينَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — تَمُدْ دُ / بِهَا أَيْ دِنْ / إِلَيْ كَ / نَوَازِعُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في العجز، فصارتا «فعولُ» [@atiq، ص29]. والصدر سالم من الزحاف."
