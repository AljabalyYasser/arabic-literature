first: "فَإِنَّكَ كَاللَّيْلِ الَّذِي هُوَ مُدْرِكِي"
second: "وَإِنْ خِلْتُ أَنَّ الْمُنْتَأَى عَنْكَ وَاسِعُ"
meaning: "فأنت كالليل الذي يدركني أينما ذهبت، وإن ظننت أن في الأرض مكانًا بعيدًا عنك أفرّ إليه. قال الأَعْلَم: «أي أنا في قبضتك حيث كنتُ وإن بعدتُ عنك، فأنت كذلك كالليل الذي يُدركني ويشملني بظلامه أينما وجّهت» [@diwan-nabigha، ص38]."
vocabulary:
  - term: "مُدْرِكِي"
    text: "لاحقي وبالغي."
  - term: "خِلْتُ"
    text: "ظننتُ."
  - term: "الْمُنْتَأَى"
    text: "«الموضع الذي يُتناءى فيه، أي يُتباعد. والنَّأي: البُعد» [@diwan-nabigha، ص38]."
context: "أشهر أبيات القصيدة، وهو جواب الشرط الذي بدأ في البيت 26: إن كنت لا تكذّب الحاقد عليّ ولا تقبل يميني، ولا تأمنني فيما أقول، فإنك كالليل الذي لا أفلت منه. وفي خبر يرويه ابن قُتَيْبة أن عمر بن الخطاب سأل وفد غَطَفان عن قائل أبيات منها هذا البيت، فلما قالوا النابِغة «قال: هذا أشعر شعرائكم» [@ibn-qutayba، ج1 ص157]. ووازن النقاد بينه وبين ليل امرئ القيس في معلقته، قال ابن سَلّام: «خيروا بينه وبين قول النابغة»، ثم أنشده وقال: «فزعم بعض الأشياخ أن بيت النابغة أحكمها» [@ibn-sallam، ج1 ص86–87]. وانظر الموازنة في [المرحلة الثانية من المعلقة في مسار امرئ القيس](/people/imru-al-qais/al-muallaqa-2/)."
syntax:
  - "«فَإِنَّكَ» الفاء واقعة في جواب الشرط «فإن كنتُ» في البيت 26، و«إنّ» واسمها الكاف، و«كَاللَّيْلِ» جار ومجرور في موضع خبرها، و«الَّذِي هُوَ مُدْرِكِي» صفة لليل، و«هو مدركي» صلة الموصول."
  - "«وَإِنْ خِلْتُ» فيها وجهان ينقلهما البَغْداديّ عن أبي عليّ الفارسيّ: «يحتمل أن تكون إن نافية كأنك قلت: ما خلت أن المنتأى عنك واسع لأنك كالليل المدركي أينما كنت. ويجوز أن تكون إن للجزاء كأنه قال: إن خلت أن المنتأى عنك واسع أدركتني ولم أفتك كما يدركني الليل. والأول أشبه» [@khizana، ج2 ص466]."
  - "«أَنَّ الْمُنْتَأَى عَنْكَ وَاسِعُ» «أنّ» واسمها وخبرها، وهي في موضع مفعولي «خلت»."
morphology:
  - "«الْمُنْتَأَى» اسم مكان على «مُفْتَعَل» من «انتأى»، أي ابتعد، وأصله من «نأى ينأى»."
  - "«مُدْرِك» اسم فاعل من «أدرك» على «مُفْعِل»، أضيف إلى ياء المتكلم."
  - "«خِلْتُ» من «خال يخال» بمعنى ظنّ، حُذفت الألف لالتقاء الساكنين حين اتصل الفعل بالتاء، وكُسرت الخاء لأن العين ياء."
rhetoric:
  thesis: "لا يمدح الملك هنا بالكرم ولا بالشجاعة، بل بأنه لا مهرب منه. فالاعتذار يصير اعترافًا بالقوة: لو أردت الفرار ما استطعت، فأنا أعود إليك. وبهذا تتحول مخافة الشاعر نفسها إلى ثناء."
  devices:
    - title: "التمثيل في «فَإِنَّكَ كَاللَّيْلِ»"
      text: "يجعل عبد القاهر الجُرْجانيّ هذا البيت مثالًا للتمثيل: «والتمثيل كقوله: فإنك كالليل الذي هو مدركي» [@asrar، ص28]. ويبيّن أن الشبه ليس في الظلمة، بل في أن الليل يعمّ الأرض كلها، ولذلك لا يصح أن يُحذف حرف التشبيه فيقال: أنت الليل، كما يقال: زيد الأسد. يقول: «فلا يجوز أن تقصِد جعلَ الممدوحِ الليلَ، ولكنك تنوي أنك أردت أن تقول فإنك مِثل الليل»، ثم يقول إن القصد «لم يقع إلى وصف في الليل كالظلمة ونحوها، وإنّما قُصد الحكمُ الذي له، من تعميمه الآفاق، وامتناعِ أن يصير الإنسان إلى مكان لا يُدركه الليلُ فيه» [@asrar، ص248]."
    - title: "لماذا الليل؟"
      text: "اعترض الأَصْمَعِيّ بأن النهار يعمّ الأرض أيضًا، فينقل ابن رَشِيق «قول الأصمعي في بيت النابغة: ليس الليل أولى بهذا المثل من النهار» [@ibn-rashiq، ج2 ص179]. وأجاب الأَعْلَم: «وإنما خصّ الليل لأنه يلبس كلّ شيء، وكلّ شيء يسكن فيه، والنهار أيضًا يشمل كلّ شيء، ولكن بعض الناس ينتشر فيه ولا يسكن كسكونه في الليل» [@diwan-nabigha، ص38]. ويقول البَغْداديّ: «إنما قال: كالليل ولم يقل: كالصبح مثلا لأنه وصفه في حال سخطه فشبهه بالليل وهوله» [@khizana، ج2 ص466–467]، أي إن الليل يحمل الخوف الذي في نفس الشاعر."
    - title: "منزلته عند النقاد"
      text: "عدّه ابن قُتَيْبة مما سبق إليه النابِغة: «ومما سبق إليه ولم ينازعه قوله» [@ibn-qutayba، ج1 ص169]، وقال العسكري بعد أن أورد بيتًا لأبي نواس في المعنى نفسه: «وللنابغة قصبة السبق» [@sinaatayn، ص236]، أي هو السابق إليه. وجعله مثالًا لما تُمدح به الملوك: «وإنما تمدح الملوك بمثل قول الشاعر» [@sinaatayn، ص75]."
  connection: "ثم يتمّ الصورة في البيت التالي: خطاطيف معوجّة في حبال متينة تمدّها أيدٍ إليه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "فَإِنْ نَ / كَ كَلْلَيْ لِلْ / لَذِي هُ / وَ مُدْرِكِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَإِنْ خِلْ / تُ أَنْنَلْ مُنْ / تَأَى عَنْ / كَ وَاسِعُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر، فصارتا «فعولُ» [@atiq، ص29]. وتسقط همزة الوصل في «الَّذِي» و«الْمُنْتَأَى»."
