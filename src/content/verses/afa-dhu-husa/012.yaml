explained: false
first: "يُسَهَّدُ مِنْ لَيْلِ التِّمَامِ سَلِيمُهَا"
second: "لِحَلْيِ النِّسَاءِ فِي يَدَيْهِ قَعَاقِعُ"
vocabulary:
  - term: "يُسَهَّدُ"
    text: "«أي يُمنع النوم» [@diwan-nabigha، ص33]."
  - term: "لَيْلِ التِّمَامِ"
    text: "«أطول ليالي الشتاء» [@diwan-nabigha، ص33]."
  - term: "سَلِيمُهَا"
    text: "«والسليم: الملدوغ؛ سمّي بذلك على التفاؤل له بالسلامة» [@diwan-nabigha، ص33]."
  - term: "لِحَلْيِ النِّسَاءِ فِي يَدَيْهِ قَعَاقِعُ"
    text: "كانوا يعلّقون الحلي على الملدوغ. قال الأَعْلَم: «قال أبو عمرو وغيره: كان يفعل به ذلك لئلا ينام فيدبّ السمّ فيه». والقعاقع: «الحركة والصوت» [@diwan-nabigha، ص33]."
sources:
