first: "فَبِتُّ كَأَنِّي سَاوَرَتْنِي ضَئِيلَةٌ"
second: "مِنَ الرُّقْشِ فِي أَنْيَابِهَا السُّمُّ نَاقِعُ"
meaning: "لما بلغني وعيد الملك بتُّ ليلتي كأن حيّة دقيقة رقطاء وثبت عليّ فلدغتني، وفي أنيابها سمّ ثابت قاتل. فهو لا ينام من الخوف كما لا ينام الملدوغ من الألم."
vocabulary:
  - term: "سَاوَرَتْنِي"
    text: "«أي واثبتني» [@diwan-nabigha، ص33]."
  - term: "ضَئِيلَةٌ"
    text: "«حيّة دقيقة قد أتت عليها سنون كثيرة، فقلّ لحمها، واشتدّ سمّها» [@diwan-nabigha، ص33]."
  - term: "الرُّقْشِ"
    text: "«التي فيها نُقَط، سواد وبياض» [@diwan-nabigha، ص33]، والواحدة رقشاء."
  - term: "نَاقِعُ"
    text: "«ثابت، يقال: نقع نقوعًا، إذا ثبت» [@diwan-nabigha، ص33]. وفي اللسان: «وَيُقَالُ: سُمٌّ ناقِعٌ أَي بالِغٌ قاتِلٌ»، وقيل: «ثَابِتٌ مُجْتَمِعٌ مِنْ نَقْعِ الْمَاءِ» [@lisan، ج8 ص360]."
context: "بعد أن سمّى سبب همّه في البيت 10، وعيد أبي قابوس، يصوّر أثره في ثلاثة أبيات (11–13): الحية، والملدوغ الساهر، والحية التي لا تجيب الراقي. وقد أنشد المُبَرِّد الأبيات الأربعة 10–13، وقال: «ومن التشبيه القاصد ... الصحيح، قول النابغة»، ثم قال بعدها: «فهذه صفة الخائف المهموم» [@kamil، ج3 ص97]، والقاصد: المستقيم الواضح. واستشهد سِيبَوَيْه بهذا البيت في النحو [@sibawayh، ج2 ص89]."
syntax:
  - "«فَبِتُّ»: «بات» فعل ناقص، والتاء اسمها، وجملة «كأنّي ساورتني ضئيلةٌ» خبرها. و«كَأَنِّي»: كأنّ واسمها ياء المتكلم، وجملة «ساورتني ضئيلةٌ» خبرها، و«ضئيلةٌ» فاعل، و«مِنَ الرُّقْشِ» صفة لها."
  - "«فِي أَنْيَابِهَا السُّمُّ نَاقِعُ» جملة صفة ثانية لضئيلة: «السمُّ» مبتدأ، و«ناقعُ» خبره، و«في أنيابها» ظرف مُلغى متعلق بـ«ناقع». وعلى هذا أنشده سِيبَوَيْه، فإنك إذا قدّمت الظرف ثم جئت بالوصف بعده «وإن شئت ألغيت فيها فقلت: فيها عبد الله قائمٌ. قال النابغة»، ثم أنشد البيت [@sibawayh، ج2 ص89]. أي إن «ناقع» خبر مرفوع، لا حال منصوبة."
  - "وكان عيسى بن عُمَر يرى النصب أولى، فـ«كان عيسى يقول: أساء النابغة في قوله»، ثم أنشده، «ويقول: موضعه ... ناقعا» [@muwashshah، ص42]، أي حالًا. ويقول البَغْداديّ إن سِيبَوَيْه «أورده على أن ناقعًا رفع على أنه خبر عن السم ويجوز في غير الشعر ناقعًا على الحالية» [@khizana، ج2 ص457]."
morphology:
  - "«سَاوَرَتْنِي» على «فاعَلَتْ» من «سار يسور» إذا وثب، وبناء «فاعَل» يدل على المواثبة."
  - "«ضَئِيلَة» على «فَعِيلة» من «ضَؤُل» إذا دقّ وصغر."
  - "«الرُّقْش» جمع «رقشاء» على «فُعْل»، كحُمْر جمع حمراء."
  - "«نَاقِع» اسم فاعل من «نَقَعَ ينقَع»، و«أَنْيَاب» جمع «ناب» على «أفعال»."
rhetoric:
  thesis: "لا يقول إنه خاف، بل يجعل الخوف لدغة في الجسد: حية صغيرة قديمة، سمّها أشد كلما قلّ لحمها. فالقلق المجرّد صار ألمًا يُرى."
  devices:
    - title: "التمثيل في «كَأَنِّي سَاوَرَتْنِي ضَئِيلَةٌ»"
      text: "ليس الشبه هنا في لون أو شكل، بل بين حالين: حال الخائف من الملك الذي لا يغمض له جفن، وحال الملدوغ الذي يسهر ألمًا. وقد بيّن المُبَرِّد وجه الشبه: «وإنما ذكر خوفه من النعمان وما يعتريه من لوعة، في إثر لوعة، والفترة بينهما، والخائف لا ينام إلا غرارًا، فلذلك شبهه بالملدوغ المسهد» [@kamil، ج3 ص97]. وهذا عند عبد القاهر الجُرْجانيّ من الشبه الذي يكون «محصّلاً بضرب من التأوّل» [@asrar، ص90]، ويسميه تمثيلًا، ويقول: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "تخصيص الحية في «ضَئِيلَةٌ» و«مِنَ الرُّقْشِ»"
      text: "لم يقل «حيّة» مطلقة، بل اختار الدقيقة التي أتت عليها السنون فاشتدّ سمّها، والرقطاء، وهي من أخبث الحيات، ثم جعل السم «ناقعًا» في أنيابها. فكل قيد يزيد الخطر. ويرى شَوْقي ضَيْف في هذه الأبيات «صورة بارعة، وقد أخذ يدقق فيها حتى يجسم ألمه» [@deif، ج1 ص290]."
  connection: "ثم يصف ليلة الملدوغ: لا ينام، وحلي النساء تقعقع في يديه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "فَبِتْ تُ / كَأَنْنِي سَا / وَرَتْنِي / ضَئِيلَتُنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — مِنَرْ رُقْ / شِ فِي أَنْيَا / بِهَسْ سُمْ / مُ نَاقِعُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر فصارت «فعولُ» [@atiq، ص29]. وتسقط همزة الوصل في «السُّمُّ» فيتصل ما قبلها بها: «بِهَسْسُمْ»."
