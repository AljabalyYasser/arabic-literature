explained: false
first: "عَلَيْهِنَّ شُعْثٌ عَامِدُونَ لِحَجِّهِمْ"
second: "فَهُنَّ كَأَطْرَافِ الْحَنِيِّ خَوَاضِعُ"
vocabulary:
  - term: "شُعْثٌ"
    text: "«أي متغيّرون من السفر» [@diwan-nabigha، ص36]، والأشعث المغبرّ الشعر."
  - term: "عَامِدُونَ لِحَجِّهِمْ"
    text: "قاصدون حجّهم."
  - term: "كَأَطْرَافِ الْحَنِيِّ"
    text: "«والحَنِيّ: القِسِيّ، واحدتها حَنِيّة؛ سُمّيت بذلك لأنها معطوفة الطرفين» [@diwan-nabigha، ص37]. يريد أن الإبل «ضامرة دقيقة من شدّة السير والجهد معوجّة» [@diwan-nabigha، ص37]."
  - term: "خَوَاضِعُ"
    text: "«أي خواشع ذليلة من الجهد» [@diwan-nabigha، ص37]."
