explained: false
first: "أَبَى اللَّهُ إِلَّا عَدْلَهُ وَوَفَاءَهُ"
second: "فَلَا النُّكْرُ مَعْرُوفٌ وَلَا الْعُرْفُ ضَائِعُ"
vocabulary:
  - term: "عَدْلَهُ وَوَفَاءَهُ"
    text: "في الهاء عند الأَعْلَم وجهان: أن تعود على الله، أي «أبى الله إلا أن يعدل بين عباده، ويفي لهم بما وعدهم به»، أو على النعمان، أي «أبى الله إلا أن يعدل ويفي أي قد جعله كذلك، وخلقه للعدل والوفاء» [@diwan-nabigha، ص39]."
  - term: "النُّكْرُ"
    text: "«المنكر» [@diwan-nabigha، ص39]."
  - term: "الْعُرْفُ"
    text: "«المعروف» [@diwan-nabigha، ص39]. وفسّر الأَعْلَم الشطر: «أي ليس النكر كالمعروف في الجزاء والحكم» [@diwan-nabigha، ص39]."
sources:
