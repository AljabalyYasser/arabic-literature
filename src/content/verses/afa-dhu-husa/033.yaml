explained: false
first: "وَتُسْقَى إِذَا مَا شِئْتَ غَيْرَ مُصَرَّدٍ"
second: "بِزَوْرَاءَ فِي حَافَاتِهَا الْمِسْكُ كَانِعُ"
vocabulary:
  - term: "وَتُسْقَى"
    text: "قال الأَعْلَم: «هو في مذهب الدعاء وليس بخبر» [@diwan-nabigha، ص39]، أي: سُقيتَ."
  - term: "غَيْرَ مُصَرَّدٍ"
    text: "«أي غير مُقلَّل، وقيل: غير ممنوع ولا مقطوع عليك. والتصريد: شُرْبٌ دون الريّ» [@diwan-nabigha، ص39]."
  - term: "بِزَوْرَاءَ"
    text: "«والزوراء: كأس مستطيلة من فضّة. وقيل: هي كأس مُزوَّرة على الشُّرب، أي مائلة عليهم. وقيل: هي دار بالحيرة للنعمان» [@diwan-nabigha، ص39]."
  - term: "حَافَاتِهَا"
    text: "«نواحيها» [@diwan-nabigha، ص39]."
  - term: "كَانِعُ"
    text: "«والكانع: الداني بعضه من بعض» [@diwan-nabigha، ص39]، أي لاصق بها."
sources:
  - source: "diwan-nabigha"
    loc: "ص39"
    url: "https://archive.org/details/3409pdf_202001/page/n38/mode/1up"
status: "review"
