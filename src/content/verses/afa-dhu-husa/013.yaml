explained: false
first: "تَنَاذَرَهَا الرَّاقُونَ مِنْ سُوءِ سَمِّهَا"
second: "تُطَلِّقُهُ طَوْرًا وَطَوْرًا تُرَاجِعُ"
vocabulary:
  - term: "تَنَاذَرَهَا الرَّاقُونَ"
    text: "«أنذر بعضهم بعضًا؛ لأنها لا تجيب راقيًا؛ لنكارتها وشدّتها» [@diwan-nabigha، ص34]. والراقي من يعالج اللديغ بالرُّقية."
  - term: "تُطَلِّقُهُ طَوْرًا"
    text: "«أي تخفّف عنه مرّة، ومرّة تشتدّ عليه، وكذلك حال اللديغ» [@diwan-nabigha، ص34]. والضمير للسمّ أو للحية، والهاء للملدوغ."
sources:
