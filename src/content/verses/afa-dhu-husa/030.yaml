first: "أَتُوعِدُ عَبْدًا لَمْ يَخُنْكَ أَمَانَةً"
second: "وَتَتْرُكُ عَبْدًا ظَالِمًا وَهْوَ ضَالِعُ"
meaning: "أتتهدّد عبدًا لك لم يخنك في أمانة قط، وتترك عبدًا آخر ظالمًا مائلًا عن الحق؟ يعني بالأول نفسه، وبالثاني الذي وشى به عند الملك."
vocabulary:
  - term: "أَتُوعِدُ"
    text: "«من الوعيد وهو التهدّد» [@diwan-nabigha، ص38]."
  - term: "ضَالِعُ"
    text: "«أي مائل عن الحق جائر» [@diwan-nabigha، ص38]."
context: "بعد صورتي الليل والخطاطيف، وفيهما خضوع لقوة الملك، يرفع الشاعر صوته بسؤال فيه عتاب: الظلم ليس في العقوبة وحدها، بل في أنها نزلت بغير مستحقها. وهو يعود إلى معنى البيت 25 «لَكَلَّفْتَنِي ذَنْبَ امْرِئٍ وَتَرَكْتَهُ». ويلخّص شَوْقي ضَيْف هذا الموضع بقوله: «ويصور له أمانته وأنه لا يخون عهده، بينما من يختانون هذا العهد يقربهم ويرعاهم» [@deif، ج1 ص290]."
syntax:
  - "«أَتُوعِدُ»: الهمزة للاستفهام، ومعناه الإنكار، و«تُوعِدُ» مضارع فاعله ضمير المخاطب، و«عَبْدًا» مفعول به."
  - "«لَمْ يَخُنْكَ أَمَانَةً» جملة صفة لعبد، و«خان» يتعدى إلى مفعولين: الكاف مفعول أول، و«أمانةً» مفعول ثانٍ."
  - "«وَتَتْرُكُ» معطوف على «توعد» فهو داخل في الإنكار، و«عَبْدًا» مفعوله، و«ظَالِمًا» صفة، و«وَهْوَ ضَالِعُ» جملة حالية."
morphology:
  - "«تُوعِد» مضارع «أَوْعَدَ» على «أَفْعَلَ» من «وعد»، و«أوعد» يكون في الشرّ."
  - "«يَخُنْ» من «خان يخون»، سكنت النون للجزم فالتقى ساكنان، فحُذفت الواو."
  - "«ظَالِم» و«ضَالِع» اسما فاعل على «فاعِل»، من «ظَلَم» و«ضَلَعَ»."
rhetoric:
  thesis: "يقلب الاعتذار عتابًا: المذنب الحقيقي آمن، والبريء مهدَّد. ولا يصرّح باتهام الملك بالظلم، بل يضعه أمام صورتين ويترك له الحكم."
  devices:
    - title: "الاستفهام الإنكاري في «أَتُوعِدُ»"
      text: "الوعيد قد وقع، فالسؤال لا يطلب خبرًا، بل ينكر الفعل الواقع ويلوم فاعله. وهذا من معاني الهمزة عند عبد القاهر الجُرْجانيّ إذا وليها الفعل: «تَقريرٌ بفعلٍ قد كان، وإنكارٌ له لِمَ كان، وتوبيخٌ لفاعِلِه عليه» [@dalail، ص114]. غير أن النابِغة يخاطب ملكًا، فخفّف التوبيخ بأن جعل نفسه «عبدًا»."
    - title: "المقابلة"
      text: "قابل بين «أَتُوعِدُ» و«وَتَتْرُكُ»، وبين «عَبْدًا لَمْ يَخُنْكَ أَمَانَةً» و«عَبْدًا ظَالِمًا». وكرّر كلمة «عَبْدًا» في الشطرين، فالرجلان في منزلة واحدة من الملك، والفرق بينهما في العمل وحده، ومع ذلك عوقب البريء."
    - title: "تقارب اللفظين «ظَالِمًا» و«ضَالِعُ»"
      text: "كلمتان متقاربتان في الحروف والجرس، تكرّران المعنى نفسه في صورتين: الظلم والميل عن الحق. وفي الرواية الأخرى «ظَالِعُ» يزداد التقارب حتى لا يفترقا إلا في حرف."
  connection: "ثم يعود إلى المدح: أنت ربيع ينعش الناس، وسيف تستعيره المنية."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "أَتُو عِ / دُ عَبْدَنْ لَمْ / يَخُنْ كَ / أَمَانَتَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَتَتْ رُ / كُ عَبْدَنْ ظَا / لِمَنْ وَهْ / وَ ضَالِعُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر، والأولى في العجز، فصارت «فعولُ» [@atiq، ص29]."
variants:
  - reading: "وَتَتْرُكُ عَبْدًا ظَالِمًا وَهْوَ ظَالِعُ"
    status: "رواية ذكرها الأَعْلَم، ونقلها البَغْداديّ عن أبي عُبَيْدة"
    note: "قال الأَعْلَم: «ويُروى: «ظالع» بالظاء، وهو أيضًا الجائر المذنب، وأصله من ظَلَع البعير والدابة، وهو أن يُبطئ في مشيته؛ لداء يصيبه في يديه» [@diwan-nabigha، ص38]. وفي الخزانة: «قال أبو عبيدة: ظالم: جائر متحامل. وضلع أي: جار. وروي: ظالع» [@khizana، ج2 ص461]."
