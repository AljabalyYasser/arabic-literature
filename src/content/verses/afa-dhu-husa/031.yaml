first: "وَأَنْتَ رَبِيعٌ يُنْعِشُ النَّاسَ سَيْبُهُ"
second: "وَسَيْفٌ أُعِيرَتْهُ الْمَنِيَّةُ قَاطِعُ"
meaning: "وأنت مطرٌ يحيي الناس عطاؤه، وسيفٌ قاطع أعارته المنيّة فهي تقتل به. قال الأَعْلَم: «يقول: أنت سَيْبٌ لأوليائك تُنعشهم وترفعهم، وسيفٌ على أعدائك تُهلكهم وتستأصلهم» [@diwan-nabigha، ص38]."
vocabulary:
  - term: "رَبِيعٌ"
    text: "«أي أنت بمنزلة الربيع، وهو الغيث» [@diwan-nabigha، ص38]، أي المطر."
  - term: "يُنْعِشُ"
    text: "«يجبر ويرفع، ومنه سُمّي النَّعْش» [@diwan-nabigha، ص38]."
  - term: "سَيْبُهُ"
    text: "«والسَّيْب: العطاء» [@diwan-nabigha، ص38]."
  - term: "أُعِيرَتْهُ الْمَنِيَّةُ"
    text: "«يريد أنه يُهلك أعداءه، فكأنه سيف استعارته المنيّة، تُهلك به من بلغ أجله» [@diwan-nabigha، ص38]. والمنيّة: الموت."
context: "بعد العتاب في البيت 30 يرجع إلى المدح، ويجمع صفتي الملك في بيت واحد: العطاء والبأس. ثم يختم القصيدة ببيتين: «أَبَى اللَّهُ إِلَّا عَدْلَهُ وَوَفَاءَهُ»، ودعاء بأن يُسقى في كأسه. ويقول شَوْقي ضَيْف في ختام هذه الاعتذارية: «فهو غيث منعش لأوليائه وسيف مصلت على أعدائه» [@deif، ج1 ص291]."
syntax:
  - "«وَأَنْتَ رَبِيعٌ» مبتدأ وخبر، و«يُنْعِشُ النَّاسَ سَيْبُهُ» جملة صفة لربيع، و«سيبُه» فاعل «ينعش»، و«الناسَ» مفعول به مقدّم على الفاعل."
  - "«وَسَيْفٌ» معطوف على «ربيع». و«أُعِيرَتْهُ الْمَنِيَّةُ» جملة صفة لسيف: «أُعيرت» فعل مبني للمجهول، و«المنيةُ» نائب الفاعل، والهاء مفعول ثانٍ. و«قَاطِعُ» صفة ثانية لسيف."
morphology:
  - "«يُنْعِش» مضارع «أَنْعَشَ» على «أَفْعَلَ»."
  - "«أُعِيرَتْ» ماضي «أَعَارَ» على «أَفْعَلَ» مبنيًّا للمجهول، أصله «أُعْوِرَتْ»، نُقلت كسرة الواو إلى العين فقُلبت ياء."
  - "«سَيْب» مصدر «ساب يسيب» إذا جرى، ثم سُمّي به العطاء الجاري."
  - "«قَاطِع» اسم فاعل من «قطع»."
rhetoric:
  thesis: "يجمع الملك في صورتين متقابلتين: مطر يحيي أولياءه، وسيف يميت أعداءه. وفي ذلك تذكير خفيّ: الشاعر يسأل أن يكون له الملك ربيعًا لا سيفًا."
  devices:
    - title: "التشبيه البليغ في «وَأَنْتَ رَبِيعٌ» و«وَسَيْفٌ»"
      text: "حذف أداة التشبيه، فجعل الملك ربيعًا وسيفًا، لا شبيهًا بهما. وهذا عند عبد القاهر الجُرْجانيّ ضرب من جعل المشبّه هو المشبّه به، يكون «حيث تجري اسم المشبه به خبرًا على المشبَّه» [@dalail، ص68]. ويخالف هذا ما في البيت 28، فهناك ذكر الكاف «كَاللَّيْلِ» لأن الشبه في حكم الليل لا في صفته، كما بيّن عبد القاهر [@asrar، ص248]."
    - title: "الاستعارة في «أُعِيرَتْهُ الْمَنِيَّةُ»"
      text: "جعل الموت شخصًا يستعير السيف ليقتل به، فأثبت له فعلًا لا يكون إلا من إنسان. وهذا الضرب من الاستعارة يفرده عبد القاهر الجُرْجانيّ عن غيره، ويمثّل له بقول لَبِيد «إِذْ أَصْبَحَتْ بِيَدِ الشَّمَالِ زِمَامُهَا»، فيقول: «وفي الثاني للشّيءِ الشيءَ ليس له» [@dalail، ص67]، أي تثبت للشيء ما ليس له، كاليد للريح، وهنا الإعارة للمنيّة. وفيه مبالغة: سيف الملك لا يخطئ، كأن الموت نفسه يضرب به."
    - title: "المقابلة بين «يُنْعِشُ» و«قَاطِعُ»"
      text: "الإنعاش رفع وحياة، والقطع إهلاك. فالبيت يقسم الناس قسمين: من نالهم عطاؤه، ومن نالهم سيفه."
  connection: "ثم يقول: أبى الله إلا أن يجعله عادلًا وفيًّا، فلا المنكر معروف عنده ولا المعروف ضائع."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "وَأَنْ تَ / رَبِيعُنْ يُنْ / عِشُنْ نَا / سَ سَيْبُهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — وَسَيْفُنْ / أُعِيرَتْ هُلْ / مَنِيْ يَ / تُ قَاطِعُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر والثالثة في العجز، فصارتا «فعولُ» [@atiq، ص29]. وتُشبَع ضمة الهاء في «سَيْبُهُ» فتصير «سَيْبُهُو»، أما هاء «أُعِيرَتْهُ» فتبقى قصيرة وتتصل بلام «الْمَنِيَّةُ»."
