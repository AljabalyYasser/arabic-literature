explained: false
first: "وَقَدْ حَالَ هَمٌّ دُونَ ذَلِكَ شَاغِلٌ"
second: "مَكَانَ الشِّغَافِ تَبْتَغِيهِ الْأَصَابِعُ"
vocabulary:
  - term: "حَالَ هَمٌّ دُونَ ذَلِكَ"
    text: "قال الأَعْلَم: «يقول: لقد حال دون ما أنا عليه من الصبابة والبكاء على الديار همٌّ داخلَ فؤادي ولابسه» [@diwan-nabigha، ص32]."
  - term: "الشِّغَافِ"
    text: "«حجاب القلب ووعاؤه الذي يكون فيه، وهو أيضًا داءٌ يأخذ تحت شراسيف الضلوع، في الشقّ الأيمن» [@diwan-nabigha، ص32]. والشراسيف أطراف الأضلاع مما يلي البطن."
  - term: "تَبْتَغِيهِ الْأَصَابِعُ"
    text: "«أي أصابع الأطبّاء المعالجين» [@diwan-nabigha، ص32]، تلتمس موضع الداء."
