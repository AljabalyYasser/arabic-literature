explained: false
first: "أَقَارِعُ عَوْفٍ لَا أُحَاوِلُ غَيْرَهَا"
second: "وُجُوهَ قُرُودٍ تَبْتَغِي مَنْ تُجَادِعُ"
vocabulary:
  - term: "لَا أُحَاوِلُ غَيْرَهَا"
    text: "«أي لا أريد هجاء غيرها. والمحاولة المعالجة والمزاولة» [@diwan-nabigha، ص35]."
  - term: "وُجُوهَ قُرُودٍ"
    text: "شتمٌ لهم. قال الأَعْلَم: «ونصب «وجوه قرود» على الذمّ، ويجوز رفعها على القطع» [@diwan-nabigha، ص35]."
  - term: "تُجَادِعُ"
    text: "«تشاتم، وإنما استعاره من جدع الأنف» [@diwan-nabigha، ص35]."
sources:
  - source: "diwan-nabigha"
    loc: "ص35"
    url: "https://archive.org/details/3409pdf_202001/page/n34/mode/1up"
status: "review"
