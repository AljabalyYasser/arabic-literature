first: "لَكَلَّفْتَنِي ذَنْبَ امْرِئٍ وَتَرَكْتَهُ"
second: "كَذِي الْعُرِّ يُكْوَى غَيْرُهُ وَهْوَ رَاتِعُ"
meaning: "أقسم لقد حمّلتني ذنب غيري وتركت المذنب، فكنتُ كالبعير الصحيح يُكوى ليبرأ البعير الذي به العُرّ، وصاحب الداء يرعى آمنًا. ويحكي الأَعْلَم أن العرب كانوا «إذا أرادوا أن يعالجوه كَوَوْا بعيرًا آخر صحيحًا؛ فيبرأ ذلك البعير»، ثم ينقل قول أبي عُبَيْدة: «هذا لا يكون، وإنما هذا مثلٌ، أي أخذتني بذنب غيري» [@diwan-nabigha، ص37]."
vocabulary:
  - term: "الْعُرِّ"
    text: "«داء يصيب الإبل، وقيل: هو قُرْحٌ بشفر البعير» [@diwan-nabigha، ص37]. وفي اللسان: «والعُرُّ، بِالضَّمِّ: قُرُوحٌ مِثْلُ القُوَباء تَخْرُجُ بالإِبل مُتَفَرِّقَةً فِي مَشَافِرِهَا وَقَوَائِمِهَا»، و«فتُكْوَى الصِّحاحُ لِئَلَّا تُعْدِيها المِراضُ» [@lisan، ج4 ص555]. والقُوَباء داء في الجلد."
  - term: "يُكْوَى"
    text: "يُحرق جلده بحديدة محماة للعلاج."
  - term: "رَاتِعُ"
    text: "يرعى في خصب وأمن."
context: "هذا جواب القسم الذي بدأه في البيت 21، قال الأَعْلَم: ««لكلّفتني» جواب لقوله: «حلفتُ»» [@diwan-nabigha، ص37]. فبعد اليمين بالإبل الحاجّة يأتي المقسَم عليه: أنه أُخذ بذنب غيره. ومن هذا البيت يبدأ ابن رَشِيق اقتباسه من القصيدة، وقال إنه «يقول فيها بعد قسم قدمه على عاداته» [@ibn-rashiq، ج2 ص178]. وعدّه ابن قُتَيْبة مما أخذه الشعراء عن النابِغة [@ibn-qutayba، ج1 ص159]."
syntax:
  - "«لَكَلَّفْتَنِي»: اللام واقعة في جواب القسم «حلفتُ» [@diwan-nabigha، ص37]، و«كلّفتَ» فعل وفاعل، والياء مفعول أول، و«ذَنْبَ» مفعول ثانٍ، و«امْرِئٍ» مضاف إليه."
  - "«وَتَرَكْتَهُ» معطوفة على «كلّفتني»، والهاء للمرء المذنب."
  - "«كَذِي الْعُرِّ»: يقول البَغْداديّ: «وقوله: كذي العر حال من مفعول تركته أو تقديره: تركا كترك ذي العر» [@khizana، ج2 ص463]. و«يُكْوَى غَيْرُهُ» جملة تفسّر حال ذي العُرّ، و«غيرُه» نائب فاعل، و«وَهْوَ رَاتِعُ» جملة حالية، والضمير لذي العُرّ."
morphology:
  - "«كَلَّفْتَ» على «فَعَّلَ» من «كلف»، والتضعيف يعدّيه إلى مفعولين: كلّفه الأمرَ."
  - "«امْرِئ» تتبع راؤه حركة آخره في الإعراب: امرُؤٌ، امرَأً، امرِئٍ، وهمزته للوصل."
  - "«يُكْوَى» مضارع «كَوَى» مبني للمجهول، قُلبت ياؤه ألفًا لتحركها وانفتاح ما قبلها."
  - "«رَاتِع» اسم فاعل من «رَتَعَ يَرْتَعُ»."
rhetoric:
  thesis: "يحوّل شكواه إلى مثل من حياة الإبل يعرفه كل عربي: العقوبة نزلت بالبريء، والمذنب يرعى آمنًا. فلا يحتاج إلى شرح الظلم، لأن الصورة تحكم بنفسها."
  devices:
    - title: "التمثيل في «كَذِي الْعُرِّ يُكْوَى غَيْرُهُ»"
      text: "شبّه حاله بحال مركّبة: بعير صحيح يُكوى، وبعير مريض يرعى. فالشبه ليس في صفة واحدة، بل في هيئة ظلم كاملة: ألم في غير موضع الذنب، وراحة في موضعه. وهذا عند عبد القاهر الجُرْجانيّ تمثيل، والتمثيل أخصّ من التشبيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. وأبو عُبَيْدة يجعله مثلًا لا خبرًا عن عادة حقيقية [@diwan-nabigha، ص37]."
    - title: "المقابلة بين «يُكْوَى» و«رَاتِعُ»"
      text: "المقابلة أن يؤتى بمعنيين أو أكثر ثم بما يقابلهما. الكيّ ألم ونار، والرتع أكل في خصب ولهو. وجعل الألم لغير صاحب الداء، والنعمة لصاحبه."
    - title: "الأخذ"
      text: "الأخذ أن يأخذ شاعر معنى سبقه إليه غيره. قال ابن قُتَيْبة: «أخذه الكميت فقال»، وأنشد: «وَلَا أَكْوِي الصِّحَاحَ بِرَاتِعَاتٍ ... بِهِنَّ الْعُرُّ قَبْلِي مَا كُوِينَا» [@ibn-qutayba، ج1 ص159]، أي إن الكُمَيْت جعل المعنى في نفسه: لا يعاقب البريء بذنب المذنب. وانظر مفهوم [الأخذ](/concepts/al-akhdh/)."
  connection: "ثم يقول: فإن كنت لا تكذّب الحاقد عليّ، ولا تقبل حلفي على البراءة..."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "لَكَلْلَفْ / تَنِي ذَنْ بَمْ / رِئِنْ وَ / تَرَكْتَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — كَذِلْ عُرْ / رِ يُكْوَى غَيْ / رُهُو وَهْ / وَ رَاتِعُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر فصارت «فعولُ» [@atiq، ص29]. وتُشبَع ضمة الهاء في «وَتَرَكْتَهُ» و«غَيْرُهُ» فتصيران «تَرَكْتَهُو» و«غَيْرُهُو»، ويسقط همز الوصل في «امْرِئٍ» فتتصل باء «ذَنْبَ» بالميم."
