first: "أَتَاكَ امْرُؤٌ مُسْتَبْطِنٌ لِيَ بِغْضَةً"
second: "لَهُ مِنْ عَدُوٍّ مِثْلَ ذَلِكَ شَافِعُ"
vocabulary:
  - term: "مُسْتَبْطِنٌ لِيَ بِغْضَةً"
    text: "«أي مضمرها ساتر» [@diwan-nabigha، ص35]."
  - term: "شَافِعُ"
    text: "«والشافع: المعين، وأصله من الشافع، وهو الثاني؛ وإنما يريد أن هذا الرجل الذي وشى به من بني قريع له من أعداء مثله ثانٍ معين له على النابغة» [@diwan-nabigha، ص35]."
