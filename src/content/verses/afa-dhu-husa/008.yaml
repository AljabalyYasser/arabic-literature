first: "عَلَى حِينَ عَاتَبْتُ الْمَشِيبَ عَلَى الصِّبَا"
second: "وَقُلْتُ أَلَمَّا أَصْحُ وَالشَّيْبُ وَازِعُ"
meaning: "رددتُ دمعي في الوقت الذي لمتُ فيه نفسي، وقد شبتُ، على ميلها إلى الصبا، وقلت لها: ألم أُفِق بعدُ من هذا الهوى، والشيب يزجرني عنه؟ والبيت متصل بالذي قبله، قال الأَعْلَم: «أي رددت العبرة في حين معاتبتي للشيب»، و«أي ألمّا أُفِق مما أنا فيه من الصبابة والشوق، والشيب كافّ عن ذلك» [@diwan-nabigha، ص32]."
vocabulary:
  - term: "عَاتَبْتُ الْمَشِيبَ عَلَى الصِّبَا"
    text: "لمتُ نفسي في زمن شيبي على ميلها إلى اللهو. وفي شرح الأَعْلَم: «أي عاتبت نفسي على الصبا» [@diwan-nabigha، ص32]، وهي زيادة أثبتها المحقق من إحدى النسخ."
  - term: "الصِّبَا"
    text: "الميل إلى اللهو والغزل، وهو مقصور."
  - term: "أَلَمَّا أَصْحُ"
    text: "ألم أُفِق بعدُ. قال الأَعْلَم: «أي ألمّا أُفِق مما أنا فيه من الصبابة والشوق» [@diwan-nabigha، ص32]."
  - term: "وَازِعُ"
    text: "«الناهي الكافّ عن الجهل» [@diwan-nabigha، ص32]."
context: "هذا البيت هو الخروج من النسيب. بكى الشاعر على الدار في البيت 7، ثم ردّ دمعه هنا لأنه شاب، وفي البيت التالي يذكر همًّا شغله عن الصبا، ثم يسمّيه في البيت 10: وعيد أبي قابوس. والخروج أن ينتقل الشاعر من قسم من القصيدة إلى قسم بعده. ويرى شَوْقي ضَيْف أن النابِغة كاد في هذه المقدمة يصوّر حبه، فيقول: «وقد أوشك في مقدمته لاعتذاريته العينية أن يصور عواطفه وحبه» [@deif، ج1 ص294]، ثم لم يلبث «حتى أمسك نفسه، وعاتبها على الصبوة وقد علا رأسه الشيب» [@deif، ج1 ص295]، ويجعله مثالًا لحسن تخلّصه: «فإنه خرج من النسيب إلى الاعتذار خروجا متصلا، إذ قال إنه كفّ عن التشبيب والحب لشيبه ولما يشغله من هم، هو غضب النعمان» [@deif، ج1 ص298]."
syntax:
  - "«عَلَى حِينَ» جار ومجرور متعلق بـ«رددتها» في البيت السابق، و«على» هنا «بمنزلة في» كما يقول الأَعْلَم [@diwan-nabigha، ص32]. و«حِينَ» ظرف مضاف إلى الجملة الفعلية «عاتبت المشيب»."
  - "ويجوز في «حين» البناء على الفتح والجرّ. قال الأَعْلَم: «ويجوز نصب «حين» وخفضها، وكذلك جميع أسماء الزمان إذا أضيفت إلى الأفعال، فالنصب على البناء؛ لإضافتها إلى غير متمكّن» [@diwan-nabigha، ص32]، أي لإضافتها إلى جملة، والجملة ليست اسمًا معربًا. وأنشده سِيبَوَيْه على البناء، فقال: «كأنه جعل حين وعاتبت اسما واحدا» [@sibawayh، ج2 ص330]. وأورده البَغْداديّ على الوجه الآخر: «على أنه يجوز إعراب حين بالجر لعدم لزومها للإضافة إلى الجملة» [@khizana، ج6 ص550]."
  - "«وَقُلْتُ» معطوف على «عاتبت». و«أَلَمَّا أَصْحُ»: الهمزة للاستفهام، و«لمّا» حرف نفي وجزم، و«أصحُ» مضارع مجزوم بحذف الواو. و«وَالشَّيْبُ وَازِعُ» جملة حالية من مبتدأ وخبر."
morphology:
  - "«الْمَشِيب» على «مَفْعِل» من «شاب يشيب»، وهو الشيب نفسه."
  - "«أَصْحُ» أصله «أَصْحُو» من «صحا يصحو» إذا أفاق، حُذفت الواو للجزم."
  - "«وَازِع» اسم فاعل من «وَزَعَ يَزَعُ» إذا كفّ ونهى، على «فاعِل»."
  - "«الصِّبا» مصدر «صبا يصبو» إذا مال إلى اللهو، وأصل ألفه واو."
rhetoric:
  thesis: "يقطع البكاء بلحظة وعي: دمع الشيخ على الديار لا يليق به، والشيب نفسه يزجره. فيمهّد بذلك للهمّ الحقيقي الذي جاء من أجله: غضب الملك."
  devices:
    - title: "الخروج"
      text: "لم ينتقل من النسيب إلى الاعتذار انتقالًا مفاجئًا، بل جعل ترك الصبا سببًا: شاب فكفّ عن الغزل، ثم شغله همّ أكبر. وهذا ما يسميه شَوْقي ضَيْف خروجًا متصلًا [@deif، ج1 ص298]. فالبيت جسر بين قسمين، يغلق الأول ويفتح الثاني."
    - title: "الطباق بين «الْمَشِيبَ» و«الصِّبَا»"
      text: "الطباق الجمع بين الضدين في الكلام. جمع الشيب والصبا في شطر واحد، فصار البيت كله صراعًا بين عمرين: عمر انقضى ونفس لم تنقضِ رغبتها."
    - title: "الاستفهام في «أَلَمَّا أَصْحُ»"
      text: "سؤال يوجّهه إلى نفسه لا ينتظر جوابه، وفيه لوم: و«لمّا» تنفي ما كان يُنتظر وقوعه، فكأن الإفاقة قد تأخرت عن وقتها. ثم جاءت الحال «وَالشَّيْبُ وَازِعُ» تقطع العذر: الناهي حاضر في رأسه."
  connection: "ثم يقول إن همًّا شاغلًا حال دون ذلك، حتى نزل من قلبه منزلة الداء."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "عَلَى حِي / نَ عَاتَبْ تُلْ / مَشِيبَ / عَلَصْ صِبَا = فعولن / مفاعيلن / فعولُ / مفاعلن — وَقُلْتُ / أَلَمْمَا أَصْ / حُ وَشْشَيْ / بُ وَازِعُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر والأولى في العجز، فصارتا «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
variants:
