explained: false
first: "فَمُجْتَمَعُ الْأَشْرَاجِ غَيَّرَ رَسْمَهَا"
second: "مَصَايِفُ مَرَّتْ بَعْدَنَا وَمَرَابِعُ"
vocabulary:
  - term: "فَمُجْتَمَعُ الْأَشْرَاجِ"
    text: "موضع تجتمع فيه الأشراج، وهي كما يقول الأَعْلَم: «شِعاب تدفع إلى الحرّة، واحدتها شَرْج؛ وإنما قيل لها أشراج؛ لأن بعضها اتّصل ببعض» [@diwan-nabigha، ص30]."
  - term: "رَسْمَهَا"
    text: "أثرها الباقي."
  - term: "مَصَايِفُ"
    text: "«جمع مَصيف، وهو زمن الصيف» [@diwan-nabigha، ص30]."
  - term: "وَمَرَابِعُ"
    text: "«أزمنة الربيع» [@diwan-nabigha، ص30]. وفسّر الأَعْلَم الشطر كله: «أي عفا وغيّر رسوم الدار وآثارها مطرُ الربيع ورياحُ الصيف» [@diwan-nabigha، ص30]."
sources:
