first: "أَتَانِي أَبَيْتَ اللَّعْنَ أَنَّكَ لُمْتَنِي"
second: "وَتِلْكَ الَّتِي تَسْتَكُّ مِنْهَا الْمَسَامِعُ"
meaning: "بلغني، أيها الملك الذي يأبى أن يأتي ما يُلعن عليه، أنك لمتني، وهذه الملامة مما تنسدّ منه الآذان كراهة أن تسمعه. قال الأَعْلَم: «أي تلك الملامة التي أتتني عنك أصمّت مسامعي؛ كراهةً لسماعها» [@diwan-nabigha، ص34]."
vocabulary:
  - term: "أَبَيْتَ اللَّعْنَ"
    text: "تحية الملوك في الجاهلية: «كلمةٌ كَانَتِ الْعَرَبُ تُحَيِّي بِهَا مُلوكها فِي الْجَاهِلِيَّةِ، تَقُولُ للملِك: أَبَيْتَ اللَّعْنَ؛ مَعْنَاهُ أَبيْتَ أَيُّها الملِك أَن تأْتي مَا تُلْعَنُ عَلَيْهِ» [@lisan، ج13 ص387]."
  - term: "تَسْتَكُّ"
    text: "«أي تشتدّ وتضيق، فلا تَسمع، يقال: استكّ الوادي بالنبت، إذا لم تكن فيه فُرجة» [@diwan-nabigha، ص34]. وفي اللسان: «واسْتَكَّتْ مَسَامِعُهُ إِذَا صَمَّ» [@lisan، ج10 ص439]."
  - term: "الْمَسَامِعُ"
    text: "«وواحد المسامع مَسْمَع، وهو الأذن» [@diwan-nabigha، ص34]."
context: "بعد أبيات الحية (11–13) يسمّي ما أوجعه: لوم الملك. وصدر هذا البيت هو مطلع اعتذارية أخرى إلى النُّعْمان، قافيتها الباء: [«أَتَانِي أَبَيْتَ اللَّعْنَ أَنَّكَ لُمْتَنِي / وَتِلْكَ الَّتِي أَهْتَمُّ مِنْهَا وَأَنْصَبُ»](/texts/atani-abayta-al-lan/1/)، فالشطر الأول واحد في القصيدتين، والعجز يختلف. وفي رواية ابن السِّكِّيت يبدأ هذا البيت بغير هذا الصدر (انظر الروايات)، ويقول المحقق بعده: «وبعد هذا تختلف رواية ابن السكيت في ترتيب الأبيات» [@diwan-nabigha، ص236]."
syntax:
  - "«أَتَانِي» فعل ماض، والياء مفعول به، والفاعل المصدر المؤوّل من «أنّك لمتني»، أي: أتاني لومُك."
  - "«أَبَيْتَ اللَّعْنَ» جملة معترضة بين الفعل وفاعله، و«اللعنَ» مفعول «أبيتَ»."
  - "«وَتِلْكَ الَّتِي ...»: «تلك» مبتدأ، و«التي» خبره، وجملة «تستكّ منها المسامع» صلة الموصول. والإشارة إلى الملامة."
  - "ويفسّر البيتُ التالي هذه الملامة بقوله: «مَقَالَةُ أَنْ قَدْ قُلْتَ سَوْفَ أَنَالُهُ»، و«مقالة» عند الأَعْلَم «تبيين لقوله: «أنك لمتني»، وبدلٌ منها» [@diwan-nabigha، ص34]."
morphology:
  - "«تَسْتَكُّ» مضارع «اسْتَكَّ» على «افتعل» من «سكك»، أصله «تَسْتَكِكُ» فأُدغمت الكاف في الكاف."
  - "«الْمَسَامِع» جمع «مَسْمَع» على «مَفاعِل»، اسم للأذن لأنها موضع السمع."
  - "«لُمْتَنِي» من «لام يلوم»، سكنت الميم لاتصال الضمير فالتقى ساكنان، فحُذفت الواو وبقيت الضمة دليلًا عليها."
rhetoric:
  thesis: "بعد أن صوّر الأثر يكشف السبب: كل هذا السهر من كلمة لوم بلغته. وقدّم بين الخبر وصاحبه تحية الملوك، فبدأ الشكوى بالأدب."
  devices:
    - title: "الاعتراض في «أَبَيْتَ اللَّعْنَ»"
      text: "الاعتراض أن تدخل جملة في أثناء الكلام لا يتوقف عليها معناه. وضع تحية الملك بين «أتاني» وفاعله، فالسامع ينتظر ما أتاه، فيسمع أولًا الدعاء للملك، ثم الخبر المؤلم. وبذلك لا يواجه الملك بالشكوى قبل التحية."
    - title: "الكناية في «تَسْتَكُّ مِنْهَا الْمَسَامِعُ»"
      text: "لم يقل إن الملامة آلمته، بل ذكر ما يلزم منها: أن تنسدّ الآذان فلا تريد أن تسمعها. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]. وقد فسّرها الأَعْلَم بالمعنى المقصود: «أصمّت مسامعي؛ كراهةً لسماعها» [@diwan-nabigha، ص34]."
    - title: "الإشارة في «وَتِلْكَ»"
      text: "أشار إلى الملامة باسم الإشارة للبعيد، وهي قريبة منه حاضرة في نفسه. فكأنها شيء ثقيل يُشار إليه من بعيد ولا يُلمس."
  connection: "ثم يفسّر هذه الملامة: كلمة بلغته أن الملك قال: سوف أناله."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "أَتَانِي / أَبَيْتَلْ لَعْ / نَ أَنْنَ / كَ لُمْتَنِي = فعولن / مفاعيلن / فعولُ / مفاعلن — وَتِلْكَلْ / لَتِي تَسْتَكْ / كُ مِنْهَلْ / مَسَامِعُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر فصارت «فعولُ» [@atiq، ص29]. وتسقط همزة الوصل في «اللَّعْنَ» و«الَّتِي» و«الْمَسَامِعُ» في درج الكلام."
variants:
  - reading: "وَأُخْبِرْتُ خَيْرَ النَّاسِ أَنَّكَ لُمْتَنِي"
    status: "رواية ابن السِّكِّيت"
    note: "يذكرها المحقق في مقابلته [@diwan-nabigha، ص236]. وبها يزول اشتراك الصدر بين هذه القصيدة والقصيدة البائية."
