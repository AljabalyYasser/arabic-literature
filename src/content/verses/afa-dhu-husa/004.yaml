explained: false
first: "رَمَادٌ كَكُحْلِ الْعَيْنِ لَأْيًا أُبِينُهُ"
second: "وَنُؤْيٌ كَجِذْمِ الْحَوْضِ أَثْلَمُ خَاشِعُ"
vocabulary:
  - term: "رَمَادٌ كَكُحْلِ الْعَيْنِ"
    text: "من آيات الدار. قال الأَعْلَم: «إنما شبّه الرماد بالكحل؛ لأنه إذا قدم عهده اسودّ وقلّ» [@diwan-nabigha، ص30]."
  - term: "لَأْيًا أُبِينُهُ"
    text: "«أي لقلّته وتغيّره عن حاله لا أتبيّنه إلا بعد بطء وصبر» [@diwan-nabigha، ص30]."
  - term: "وَنُؤْيٌ"
    text: "«والنؤي: حاجز حول البيت؛ لئلا يدخله الماء» [@diwan-nabigha، ص30]."
  - term: "كَجِذْمِ الْحَوْضِ"
    text: "«وجِذْم كل شيء: أصله» [@diwan-nabigha، ص30]، أي كأصل حوض تهدّم أعلاه."
  - term: "أَثْلَمُ خَاشِعُ"
    text: "«والأثلم: الذي تثلّم وتهدّم. والخاشع هنا: المطمئن اللاصق بالأرض الذي ذهب شخصه» [@diwan-nabigha، ص30]."
sources:
