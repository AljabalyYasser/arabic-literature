first: "عَفَا ذُو حُسًى مِنْ فَرْتَنَى فَالْفَوَارِعُ"
second: "فَجَنْبَا أَرِيكٍ فَالتِّلَاعُ الدَّوَافِعُ"
meaning: "درست منازل فَرْتَنَى في ذي حُسًى، ثم في الفوارع، ثم في جانبَي أَرِيك، ثم في التلاع التي تدفع الماء إلى الوادي، فلم يبق منها ما يدل عليها. قال الأَعْلَم الشَّنْتَمَرِيّ: «ومعنى «عفا»: دَرَس وامّحت آثاره؛ لبُعد عهده بالأنيس. وأخبر عن الموضع، وهو يريد الربع الذي كان به» [@diwan-nabigha، ص30]، أي إن المكان باقٍ، والذي عفا هو منزل القوم فيه."
vocabulary:
  - term: "عَفَا"
    text: "«دَرَس وامّحت آثاره» [@diwan-nabigha، ص30]."
  - term: "ذُو حُسًى"
    text: "«موضع في ديار بني مُرّة» [@diwan-nabigha، ص30]، ومُرّة من ذُبْيان، قوم الشاعر."
  - term: "فَرْتَنَى"
    text: "امرأة يذكرها في نسيبه، و«مِنْ فَرْتَنَى» عند الأَعْلَم: «يريد منازل فرتنى» [@diwan-nabigha، ص30]. وفي اللسان: «وفَرْتَنَى، مَقْصُورٌ: اسْمُ امرأَة»، ثم أنشد هذا البيت [@lisan، ج13 ص322]."
  - term: "فَالْفَوَارِعُ"
    text: "«مواضع مرتفعة» [@diwan-nabigha، ص30]."
  - term: "أَرِيكٍ"
    text: "«موضع أو واد» [@diwan-nabigha، ص30]، وجنباه ناحيتاه."
  - term: "فَالتِّلَاعُ"
    text: "«مجاري المياه إلى الأودية، وهي مسايل عظام، الواحدة تَلْعة» [@diwan-nabigha، ص30]."
  - term: "الدَّوَافِعُ"
    text: "«التي تدفع إلى الوادي، وواحدتها دافعة» [@diwan-nabigha، ص30]."
context: "مطلع القصيدة، يبدأ به نسيبًا على الدار يمتد إلى البيت 7، ثم يخرج في البيت 8 إلى همّه من وعيد النُّعْمان. وهي ثالثة قصائد النابِغة في الاعتذار عند ابن رَشِيق، يسميها بهذا المطلع، ويقول إنه «يقول فيها بعد قسم قدمه على عاداته» [@ibn-rashiq، ج2 ص178]، أي بعد اليمين التي يقدّمها في اعتذاراته. ويقول البَغْداديّ في شرحها: «واعلم أن هذه القصيدة غالب أبياتها شواهد في كتب العربية» [@khizana، ج2 ص451]، أي يستشهد النحاة بأبياتها."
syntax:
  - "«عَفَا» فعل ماض، و«ذُو» فاعله، مرفوع بالواو لأنه من الأسماء الخمسة، و«حُسًى» مضاف إليه مجرور بكسرة مقدّرة على الألف المحذوفة، لأنه اسم مقصور منوّن."
  - "«مِنْ فَرْتَنَى» جار ومجرور متعلق بـ«عفا»، وفيه حذف مضاف قدّره الأَعْلَم: «يريد منازل فرتنى» [@diwan-nabigha، ص30]. و«فرتنى» مجرورة بفتحة مقدّرة، لأنها ممنوعة من الصرف لألف التأنيث المقصورة."
  - "«فَالْفَوَارِعُ» و«فَجَنْبَا أَرِيكٍ» و«فَالتِّلَاعُ» معطوفة بالفاء على «ذُو حُسًى»، فهي كلها فاعل لـ«عفا». و«جَنْبَا» مثنى مرفوع بالألف، حُذفت نونه للإضافة إلى «أَرِيكٍ». و«الدَّوَافِعُ» صفة للتلاع."
morphology:
  - "«فَرْتَنَى» على «فَعْلَلَى» بألف التأنيث المقصورة. وفي أصلها خلاف ينقله صاحب اللسان: «وَقَدْ تَقَدَّمَ أَنه ثُلَاثِيٌّ عَلَى رأْي ابْنِ حَبِيبٍ، وأَن نُونَهُ زَائِدَةٌ»، ثم قال: «وأَما سِيبَوَيْهِ فَجَعَلَهُ رُبَاعِيًّا» [@lisan، ج13 ص322]، أي إن النون عنده من أصل الكلمة."
  - "«الْفَوَارِع» جمع «فارعة» على «فَوَاعِل»، و«الدَّوَافِع» جمع «دافعة» كما يقول الأَعْلَم [@diwan-nabigha، ص30]، و«التِّلَاع» جمع «تَلْعة» على «فِعَال»."
  - "«حُسًى» اسم مقصور، آخره ألف لازمة، فتُقدّر عليه الحركات الثلاث."
rhetoric:
  thesis: "مطلع على عادة القصيدة الجاهلية: دار عفت، وأسماء مواضع تتتابع واحدًا بعد واحد، فيرسم الشاعر بالأسماء وحدها خريطة لمنازل لم يبق منها شيء. ولا يظهر في المطلع شيء من غرض القصيدة، فالاعتذار مؤجّل إلى ما بعد البيت 8."
  devices:
    - title: "التصريع"
      text: "ختم الصدر بـ«فَالْفَوَارِعُ» على قافية العجز «الدَّوَافِعُ». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. والعروض آخر تفعيلة في الصدر، والضرب آخر تفعيلة في العجز، وبه يعرف السامع قافية القصيدة من بيتها الأول."
    - title: "الإسناد إلى المكان في «عَفَا ذُو حُسًى»"
      text: "أسند العفاء إلى المواضع، والذي عفا هو ما كان فيها من منازل. وهذا ما نبّه عليه الأَعْلَم في قوله: «وأخبر عن الموضع، وهو يريد الربع الذي كان به» [@diwan-nabigha، ص30]. فكأن الأرض كلها، من ذي حُسًى إلى التلاع، قد محت ذكرى صاحبتها."
    - title: "التعداد بالفاء"
      text: "في «فَالْفَوَارِعُ ... فَجَنْبَا أَرِيكٍ فَالتِّلَاعُ» عطف المواضع بالفاء، والفاء تفيد الترتيب والتعقيب، فتنتقل العين من موضع إلى الذي يليه كأن الشاعر يتتبع منازل الحي على الأرض. وهي طريقة امرئ القيس في «بِسِقْطِ اللِّوَى بَيْنَ الدَّخُولِ فَحَوْمَلِ»."
  connection: "ثم يذكر موضعًا آخر، مجتمع الأشراج، ويقول إن رياح الصيف ومطر الربيع غيّرت رسم الدار."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "عَفَا ذُو / حُسَنْ مِنْ فَرْ / تَنَى فَلْ / فَوَارِعُو = فعولن / مفاعيلن / فعولن / مفاعلن — فَجَنْبَا / أَرِيكِنْ فَتْ / تِلَاعُدْ / دَوَافِعُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "البيت تامّ الحشو، لم يدخله القبض، وهو حذف الخامس الساكن، في «فعولن» ولا في «مفاعيلن». والعروض «مفاعلن» مقبوضة على ما يلزم في الطويل [@atiq، ص29]، والضرب «مفاعلن» مقبوض مثلها [@atiq، ص30]. والبيت مصرّع. وتُشبَع ضمة العين في آخر الشطرين: «فَوَارِعُو» و«دَوَافِعُو»."
variants:
  - reading: "عَفَا حُسُمٌ مِنْ فَرْتَنَى فَالْفَوَارِعُ"
    status: "رواية ابن السِّكِّيت"
    note: "يورد محقق الديوان في مقدمة ابن السِّكِّيت لقصيدة المتجردة قوله: «وفيه أيضًا يقول»، ثم هذا الصدر بلفظ «حُسُمٌ» [@diwan-nabigha، ص246]، ويذكره في مقابلته عند البيت الأول [@diwan-nabigha، ص236]."
