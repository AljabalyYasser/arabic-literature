explained: false
first: "لَعَمْرِي وَمَا عَمْرِي عَلَيَّ بِهَيِّنٍ"
second: "لَقَدْ نَطَقَتْ بُطْلًا عَلَيَّ الْأَقَارِعُ"
vocabulary:
  - term: "لَعَمْرِي"
    text: "قسم بالحياة. قال الأَعْلَم: «قال بعضهم: لديني، والمعروف أن معناه البقاء» [@diwan-nabigha، ص34]."
  - term: "بُطْلًا"
    text: "«والبُطْل والباطل بمعنى واحد» [@diwan-nabigha، ص34]."
  - term: "الْأَقَارِعُ"
    text: "«وأراد بالأقارع بني قريع بن عوف، وهم من بني تميم، وكانوا قد وشوا به إلى النعمان، وذكروا أنه يصف في شعره المتجردة» [@diwan-nabigha، ص34]."
sources:
  - source: "diwan-nabigha"
    loc: "ص34"
