explained: false
first: "عَلَى ظَهْرِ مِبْنَاةٍ جَدِيدٍ سُيُورُهَا"
second: "يَطُوفُ بِهَا وَسْطَ اللَّطِيمَةِ بَائِعُ"
vocabulary:
  - term: "مِبْنَاةٍ"
    text: "«والمِبناة: النِّطَع، سُمّيت بذلك لأنها كانت تتّخذ قِبابًا» [@diwan-nabigha، ص31]. والنِّطع بساط من جلد، وكانوا كما يقول الأَعْلَم «يبسطون النطع ويلقون عليه الحُصُر إذا عرضوها للبيع» [@diwan-nabigha، ص31]."
  - term: "اللَّطِيمَةِ"
    text: "«سوق الطيب، وقيل: هي سوق فيها بزّ وطيب، وقيل: هي عيرٌ تحمل الطيب وأفضل المتاع إلى الأسواق» [@diwan-nabigha، ص31]."
sources:
  - source: "diwan-nabigha"
    loc: "ص31"
