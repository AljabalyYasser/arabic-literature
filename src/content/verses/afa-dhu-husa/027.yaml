explained: false
first: "وَلَا أَنَا مَأْمُونٌ بِشَيْءٍ أَقُولُهُ"
second: "وَأَنْتَ بِأَمْرٍ لَا مَحَالَةَ وَاقِعُ"
vocabulary:
  - term: "وَلَا أَنَا مَأْمُونٌ"
    text: "أي لا تأمنني ولا تصدّقني فيما أقول. وهو متّصل بما قبله، قال الأَعْلَم: «متعلّق بقوله: «فإن كنت لا ذو الضغن»، وليس بمستأنف» [@diwan-nabigha، ص37]."
  - term: "لَا مَحَالَةَ"
    text: "لا بدّ."
