explained: false
first: "أَتَاكَ بِقَوْلٍ هَلْهَلِ النَّسْجِ كَاذِبٍ"
second: "وَلَمْ يَأْتِ بِالْحَقِّ الَّذِي هُوَ نَاصِعُ"
vocabulary:
  - term: "هَلْهَلِ النَّسْجِ"
    text: "«أي أتاك بقولٍ ضعيفٍ باطل، لم أكن لأقوله، بمنزلة الثوب المهلهل، وهو الذي نُسج وخُفّف ولم يُحكم» [@diwan-nabigha، ص35]."
  - term: "كَاذِبٍ"
    text: "«أي مكذوب فيه» [@diwan-nabigha، ص35]."
  - term: "نَاصِعُ"
    text: "«الواضح البيّن؛ وأصل الناصع: الخالص البياض» [@diwan-nabigha، ص35]."
sources:
