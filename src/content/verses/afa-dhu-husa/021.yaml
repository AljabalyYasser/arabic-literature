first: "حَلَفْتُ فَلَمْ أَتْرُكْ لِنَفْسِكَ رِيبَةً"
second: "وَهَلْ يَأْثَمَنْ ذُو إِمَّةٍ وَهْوَ طَائِعُ"
meaning: "أقسمتُ لك يمينًا لم تُبقِ في نفسك شكًّا في صدقي، وهل يحلف كاذبًا فيأثم رجلٌ له دين وهو مطيع لك؟ قال الأَعْلَم: «يقول: حلفتُ فلم أترك لنفسك شكًّا في صدق، وحلفت وأنا لك طائع ذو دين واستقامة، فتحرّجت من أن أكذب في يميني فأكون آثمًا» [@diwan-nabigha، ص35–36]."
vocabulary:
  - term: "رِيبَةً"
    text: "«الرِّيبة: الشكّ» [@diwan-nabigha، ص35]."
  - term: "يَأْثَمَنْ"
    text: "يقع في الإثم، يعني بيمين كاذبة."
  - term: "إِمَّةٍ"
    text: "«والأُمّة والإِمّة: الدين والطريقة المستقيمة» [@diwan-nabigha، ص35]. وفي اللسان: «والإِمَّةُ: لُغَةٌ فِي الأُمَّةِ، وَهِيَ الطَّرِيقَةُ والدينُ» [@lisan، ج12 ص24]."
  - term: "طَائِعُ"
    text: "مطيع لك، منقاد."
context: "بهذا البيت يبدأ القسم، وهو أطول ما في القصيدة من الحجاج: يحلف هنا، ثم يذكر في الأبيات 22–24 ما يحلف به، وهو الإبل التي تحمل الحجاج إلى إلال، ثم يأتي جواب القسم في البيت 25 «لَكَلَّفْتَنِي ذَنْبَ امْرِئٍ». وصدر البيت هو صدر بيت في البائية: [«حَلَفْتُ فَلَمْ أَتْرُكْ لِنَفْسِكَ رِيبَةً / وَلَيْسَ وَرَاءَ اللَّهِ لِلْمَرْءِ مَذْهَبُ»](/texts/atani-abayta-al-lan/3/). وترتيبه في الرواية التي يشرحها البَغْداديّ بعد البيت 27 [@khizana، ج2 ص465]."
syntax:
  - "«حَلَفْتُ» فعل وفاعل، وجواب القسم متأخر إلى البيت 25، قال الأَعْلَم: ««لكلّفتني» جواب لقوله: «حلفتُ»» [@diwan-nabigha، ص37]. والباء في «بمصطحبات» في البيت 22 متعلقة به [@khizana، ج2 ص465]."
  - "«فَلَمْ أَتْرُكْ لِنَفْسِكَ رِيبَةً» معطوفة بالفاء، و«ريبةً» مفعول به، و«لنفسك» متعلق بـ«أترك»."
  - "«وَهَلْ يَأْثَمَنْ»: «هل» للاستفهام، ومعناه النفي. و«يأثمنْ» مضارع مبني على الفتح لاتصاله بنون التوكيد الخفيفة، و«ذو» فاعله، و«إمّةٍ» مضاف إليه. و«وَهْوَ طَائِعُ» جملة حالية."
morphology:
  - "«رِيبَة» على «فِعْلة» من «راب يريب»."
  - "«يَأْثَمَنْ» من «أَثِمَ يأثَم» على «فَعِلَ يَفْعَلُ»، والنون في آخره نون التوكيد الخفيفة."
  - "«إِمَّة» على «فِعْلة» من «أمم»، وهي لغة في «أُمّة» كما في اللسان [@lisan، ج12 ص24]."
  - "«طَائِع» اسم فاعل من «طاع يطوع»، أبدلت عينه همزة لأنها جاءت بعد ألف فاعل."
rhetoric:
  thesis: "لا يكتفي بالحلف، بل يحتجّ لصدق يمينه بخلقه: الرجل المتديّن المطيع لا يحلف كاذبًا. فاليمين عنده حجة لا مجرد كلمة."
  devices:
    - title: "الاستفهام في «وَهَلْ يَأْثَمَنْ»"
      text: "سؤال لا ينتظر جوابًا، بل يحمل الملك على أن يجيب في نفسه: لا. وتوكيد الفعل بالنون في سياق السؤال يقوّي الإنكار: أيُعقل أن يأثم مثله؟"
    - title: "الحكمة في العجز"
      text: "خرج العجز من الحال الخاصة إلى قاعدة عامة: ذو الدين لا يأثم وهو طائع. فلم يعد يتكلم عن نفسه وحدها، بل عن صنف من الناس يعرفه الملك، ثم ترك الملك يضع الشاعر فيه."
    - title: "اختلاف التتمة بين القصيدتين"
      text: "الصدر نفسه في البائية تتمّه حكمة أخرى: «وَلَيْسَ وَرَاءَ اللَّهِ لِلْمَرْءِ مَذْهَبُ». فهناك يحتجّ بعظمة من حلف به، وهنا يحتجّ بدين من حلف. فالقسم واحد، والحجتان مختلفتان."
  connection: "ثم يذكر ما يحلف به: الإبل التي يصطحبها الحجاج من لصاف وثبرة إلى إلال."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "حَلَفْ تُ / فَلَمْ أَتْ رُكْ / لِنَفْ سِ / كَ رِيبَتَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَهَلْ يَأْ / ثَمَنْ ذُو إِمْ / مَتِنْ وَهْ / وَ طَائِعُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر، فصارتا «فعولُ» [@atiq، ص29]. و«وَهْوَ» بتسكين الهاء، وبه يستقيم الوزن."
variants:
  - reading: "وَهَلْ يَأْثَمَنْ ذُو أُمَّةٍ وَهْوَ طَائِعُ"
    status: "رواية اللسان، وبها يرويه شَوْقي ضَيْف"
    note: "أنشده صاحب اللسان بضم الهمزة [@lisan، ج12 ص24]، ثم قال في موضع آخر: «وَيُرْوَى: ذُو إمَّةٍ، فَمَنْ قال ذو أُمَّةٍ فمعناه ذُو دينٍ وَمَنْ قَالَ ذو إمَّةٍ فمعناه ذو نِعْمة أُسْدِيَتْ إِلَيْهِ» [@lisan، ج12 ص27]. وبضم الهمزة هو عند شَوْقي ضَيْف [@deif، ج1 ص289]. أما الأَعْلَم فيجعل اللغتين بمعنى واحد [@diwan-nabigha، ص35]."
