explained: false
first: "بِمُصْطَحَبَاتٍ مِنْ لَصَافٍ وَثَبْرَةٍ"
second: "يَزُرْنَ إِلَالًا سَيْرُهُنَّ التَّدَافُعُ"
vocabulary:
  - term: "بِمُصْطَحَبَاتٍ"
    text: "الباء للقسم. قال الأَعْلَم: «يعني الإبل؛ وإنما أقسم بها لأنها تصطحب في السير إلى الحجّ، فعظّمها لذلك وأقسم بها» [@diwan-nabigha، ص36]."
  - term: "لَصَافٍ وَثَبْرَةٍ"
    text: "«موضعان في بلاد بني تميم» [@diwan-nabigha، ص36]."
  - term: "إِلَالًا"
    text: "«جبل عن يمين الحاجّ، إذا وقفت بعرفة» [@diwan-nabigha، ص36]."
  - term: "سَيْرُهُنَّ التَّدَافُعُ"
    text: "«أي هنّ مُعيِيات فيتحاملن تحاملًا من الجهد والإعياء» [@diwan-nabigha، ص36]."
sources:
  - source: "diwan-nabigha"
    loc: "ص36"
