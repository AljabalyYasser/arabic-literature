explained: false
first: "كَأَنَّ مَجَرَّ الرَّامِسَاتِ ذُيُولَهَا"
second: "عَلَيْهِ حَصِيرٌ نَمَّقَتْهُ الصَّوَانِعُ"
vocabulary:
  - term: "الرَّامِسَاتِ"
    text: "«الرياح الشديدات الهبوب التي ترمس الأثر، أي تُعفّيه» [@diwan-nabigha، ص31]."
  - term: "ذُيُولَهَا"
    text: "«مآخيرها» [@diwan-nabigha، ص31]، أي أواخر الرياح."
  - term: "نَمَّقَتْهُ الصَّوَانِعُ"
    text: "زيّنته النساء الصانعات. قال الأَعْلَم: «فشبّه آثار مآخير الرياح في هذا الرسم بحصيرٍ من جريد أو أدم تنمّقه الصوانع، أي تعمله وتخرزه وتلصق بعضه ببعض» [@diwan-nabigha، ص31]."
sources:
