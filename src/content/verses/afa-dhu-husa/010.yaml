explained: false
first: "وَعِيدُ أَبِي قَابُوسَ فِي غَيْرِ كُنْهِهِ"
second: "أَتَانِي وَدُونِي رَاكِسٌ فَالضَّوَاجِعُ"
vocabulary:
  - term: "أَبِي قَابُوسَ"
    text: "كنية النُّعْمان بن المُنْذِر، ففي اللسان: «يَعْنِي بِهِ النُّعْمَانَ بْنَ الْمُنْذِرِ وَكُنْيَتُهُ أَبو قَابُوسَ» [@lisan، ج5 ص132]."
  - term: "فِي غَيْرِ كُنْهِهِ"
    text: "«أي جاءني وعيده بي غير قدر الوعيد، وفي غير حقيقته، أي لم أكن بلغت ما يغضب عليّ فيه» [@diwan-nabigha، ص32]."
  - term: "رَاكِسٌ فَالضَّوَاجِعُ"
    text: "«و«راكس»: وادٍ. و«الضواجع»: جمع ضاجعة، وهي منحنى الوادي ومنعطفه» [@diwan-nabigha، ص32]. يريد أن بينه وبين الملك هذه المواضع، فهو بعيد عنه."
