first: "فَإِنْ كُنْتُ لَا ذُو الضِّغْنِ عَنِّي مُكَذَّبٌ"
second: "وَلَا حَلِفِي عَلَى الْبَرَاءَةِ نَافِعُ"
vocabulary:
  - term: "الضِّغْنِ"
    text: "«الحقد والعداوة» [@diwan-nabigha، ص37]."
  - term: "ذُو الضِّغْنِ عَنِّي مُكَذَّبٌ"
    text: "أي لا يكذّبه أحد فيما يقوله عني، فقوله مقبول عندك."
  - term: "الْبَرَاءَةِ"
    text: "البراءة مما رُميتُ به."
