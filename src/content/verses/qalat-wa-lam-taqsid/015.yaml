explained: false
first: "حَتَّى تَجَلَّتْ وَلَنَا غَايَةٌ"
second: "مِنْ بَيْنِ جَمْعٍ غَيْرِ جُمَّاعِ"
vocabulary:
  - term: "تَجَلَّتْ"
    text: "انكشفت المعركة."
  - term: "غَايَةٌ"
    text: "«والغاية والراية واحد» [@tabrizi-ikhtiyarat، ج3 ص1241]."
  - term: "جَمْعٍ غَيْرِ جُمَّاعِ"
    text: "جمع من قبيلة واحدة لا أخلاط من الناس: «ذلك الجمع كله منا، لم نستعن بأحد غيرنا» [@tabrizi-ikhtiyarat، ج3 ص1241]."
