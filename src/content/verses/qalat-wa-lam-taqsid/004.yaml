explained: false
first: "قَدْ حَصَّتِ البَيْضَةُ رَأْسِي فَمَا"
second: "أَطْعَمُ غُمْضًا غَيْرَ تَهْجَاعِ"
vocabulary:
  - term: "حَصَّتِ البَيْضَةُ رَأْسِي"
    text: "يقول محققو «الأغاني»: «حصت: أذهبت الشعر من رأسه. والبيضة هنا: الخوذة» [@aghani-dk، ج17 ص116، الحاشية]."
  - term: "غُمْضًا"
    text: "نومًا. وفي «الأغاني» وعند التِّبْرِيزِيّ «نومًا»."
  - term: "تَهْجَاعِ"
    text: "نوم خفيف قليل."
