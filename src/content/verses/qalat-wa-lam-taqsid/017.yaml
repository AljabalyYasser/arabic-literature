first: "هَلْ أَبْذُلُ المَالَ عَلَى حُبِّهِ"
second: "فِيهِمْ وَآتِي دَعْوَةَ الدَّاعِي"
vocabulary:
  - term: "عَلَى حُبِّهِ"
    text: "مع حبي له وحاجتي إليه، يريد عند الشدة: «في صعوبة الزمان، ووقت الشح على المال» [@tabrizi-ikhtiyarat، ج3 ص1242]."
  - term: "آتِي دَعْوَةَ الدَّاعِي"
    text: "أجيب المستغيث وأنصره."
