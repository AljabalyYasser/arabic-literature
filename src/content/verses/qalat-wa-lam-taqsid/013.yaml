first: "نَذُودُهُمْ عَنَّا بِمُسْتَنَّةٍ"
second: "ذَاتِ عَرَانِينَ وَدُفَّاعِ"
vocabulary:
  - term: "نَذُودُهُمْ"
    text: "«ندفعهم ونمنعهم» [@tabrizi-ikhtiyarat، ج3 ص1240]."
  - term: "بِمُسْتَنَّةٍ"
    text: "«الكتيبة. وأصل الاستنان: النشاط» [@tabrizi-ikhtiyarat، ج3 ص1240]."
  - term: "عَرَانِينَ"
    text: "سادة متقدمون في الفضل والشجاعة."
  - term: "دُفَّاعِ"
    text: "جمع دافع، وهم الذين يدفعون الأعداء."
