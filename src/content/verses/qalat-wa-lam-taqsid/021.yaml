explained: false
first: "تُعْطِي عَلَى الأَيْنِ وَتَنْجُو مِنَ الضْـ"
second: "ـضَرْبِ أَمُونٍ غَيْرِ مِظْلَاعِ"
vocabulary:
  - term: "الأَيْنِ"
    text: "الإعياء. أي: «تعطي سيرا، وهي معيية، لا يكلها الإعياء» [@tabrizi-ikhtiyarat، ج3 ص1244]."
  - term: "وَتَنْجُو مِنَ الضَّرْبِ"
    text: "لا تحوج راكبها إلى ضربها."
  - term: "أَمُونٍ"
    text: "«التي يؤمن عثارها» [@tabrizi-ikhtiyarat، ج3 ص1244]."
  - term: "مِظْلَاعِ"
    text: "من الظَّلَع، وهو العرج في الإبل."
