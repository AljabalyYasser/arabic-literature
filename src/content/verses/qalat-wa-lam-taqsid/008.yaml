first: "صَدْقٍ حُسَامٍ وَادِقٍ حَدُّهُ"
second: "وَمُجْنَأٍ أَسْمَرَ قَرَّاعِ"
vocabulary:
  - term: "صَدْقٍ"
    text: "صلب: «يعني أنه صلب» [@tabrizi-ikhtiyarat، ج3 ص1238]."
  - term: "وَادِقٍ"
    text: "«الداني» [@tabrizi-ikhtiyarat، ج3 ص1238]، كأن حدّه قريب من كل شيء لنفاذه."
  - term: "وَمُجْنَأٍ"
    text: "«الترس، وهو من: جنأ إذا انحنى. وجعله أسمر لأنه من جلود الإبل» [@tabrizi-ikhtiyarat، ج3 ص1238]."
