explained: false
first: "كَأَنَّهُمْ أُسْدٌ لَدَى أَشْبُلٍ"
second: "يَنْهِتْنَ فِي غِيلٍ وَأَجْزَاعِ"
vocabulary:
  - term: "أَشْبُلٍ"
    text: "جمع شِبْل، ولد الأسد، والأسد عند أشباله أشرس."
  - term: "يَنْهِتْنَ"
    text: "يزأرن."
  - term: "غِيلٍ"
    text: "«الأجمة» [@tabrizi-ikhtiyarat، ج3 ص1240]، أي الشجر الكثيف."
  - term: "أَجْزَاعِ"
    text: "«جمع جزع، وهو: الجانب» [@tabrizi-ikhtiyarat، ج3 ص1240]، أي منعطف الوادي."
