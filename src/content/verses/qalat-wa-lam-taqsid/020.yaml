first: "ذَاتِ أَسَاهِيجَ جُمَالِيَّةٍ"
second: "حُشَّتْ بِحَارِيٍّ وَأَقْطَاعِ"
vocabulary:
  - term: "أَسَاهِيجَ"
    text: "«فنون من السير» [@tabrizi-ikhtiyarat، ج3 ص1243]."
  - term: "جُمَالِيَّةٍ"
    text: "ضخمة كأنها جمل."
  - term: "حُشَّتْ بِحَارِيٍّ وَأَقْطَاعِ"
    text: "ملئ رحلها بوسائد. و«الحاري: منسوب إلى الحيرة. والأقطاع: جمع قطع، وهي طنفسة تكون على الرحل» [@tabrizi-ikhtiyarat، ج3 ص1243]."
