first: "وَأَضْرِبُ القَوْنَسَ يَوْمَ الوَغَى"
second: "بِالسَّيْفِ لَمْ يَقْصُرْ بِهِ بَاعِي"
vocabulary:
  - term: "القَوْنَسَ"
    text: "أعلى بيضة الحديد، أي رأس المقاتل."
  - term: "لَمْ يَقْصُرْ بِهِ بَاعِي"
    text: "لم يقصر ذراعي عن بلوغ ما أريد بالسيف. والباع: مدّ الذراعين."
