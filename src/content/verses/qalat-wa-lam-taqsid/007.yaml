first: "أَحْفِزُهَا عَنِّي بِذِي رَوْنَقٍ"
second: "مُهَنَّدٍ كَالمِلْحِ قَطَّاعِ"
vocabulary:
  - term: "أَحْفِزُهَا"
    text: "«أرفعها» [@tabrizi-ikhtiyarat، ج3 ص1237]، يرفع ذيل الدرع ويعلّقه بالسيف ليخفّ عليه."
  - term: "بِذِي رَوْنَقٍ"
    text: "بسيف له بريق."
  - term: "كَالمِلْحِ"
    text: "في بياضه ولمعانه."
