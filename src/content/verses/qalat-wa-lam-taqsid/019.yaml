    text: "«المتسع من الأرض الذي تتخرق فيه الرياح» [@tabrizi-ikhtiyarat، ج3 ص1243]."
  - term: "الرَّدَى"
    text: "الهلاك."
  - term: "أَدْمَاءَ"
    text: "«البيضاء. يريد: ناقة» [@tabrizi-ikhtiyarat، ج3 ص1243]."
  - term: "هِلْوَاعِ"
    text: "«السريعة الشديدة الحرص على السير» [@tabrizi-ikhtiyarat، ج3 ص1243]."
