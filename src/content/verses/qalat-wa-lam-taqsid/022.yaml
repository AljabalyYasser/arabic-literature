first: "كَأَنَّ أَطْرَافَ وَلِيَّاتِهَا"
second: "فِي شَمْأَلٍ حَصَّاءَ زَعْزَاعِ"
vocabulary:
  - term: "وَلِيَّاتِهَا"
    text: "جمع وَلِيّة، وهي «البرذعة» [@tabrizi-ikhtiyarat، ج3 ص1244]."
  - term: "شَمْأَلٍ"
    text: "ريح الشمال."
  - term: "حَصَّاءَ زَعْزَاعِ"
    text: "«شديدة الهبوب، كأنها تطيّر ما تمر به» [@tabrizi-ikhtiyarat، ج3 ص1244]، مزعزعة. يريد شدة سير الناقة."
