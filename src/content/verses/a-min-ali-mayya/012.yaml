first: "وَالْبَطْنُ ذُو عُكَنٍ لَطِيفٌ طَيُّهُ"
second: "وَالنَّحْرُ تَنْفُجُهُ بِثَدْيٍ مُقْعَدِ"
meaning: "وبطنها ذو طيّات لطيفة، ضامر غير منتفخ، وأعلى صدرها يرتفع بثدي ناهد ثابت لم يسترخِ. قال الأَعْلَم: «وقوله: «والبطن ذو عكن»، أي مهفهفة خميصة البطن، ولو كانت مفاضة عظيمة لم يكن لها عكن. و«النحر تنفجه بثدي»، أي تعليه وترفعه ... والمقعد: الغليظ الأصل في أول قعوده، الذي لم يسترخ» [@diwan-nabigha، ص92]. وفي اللسان: «وثَدْيٌ مُقْعَدٌ: ناتِئٌ عَلَى النَّحْرِ إِذَا كَانَ ناهِداً لَمْ يَنْثَنِ بَعْدُ» [@lisan، ج3 ص361]. فالمعنى بلغة اليوم: بطنها نحيل، فيه ثنيات خفيفة من لحم ناعم، وثدياها بارزان مرتفعان على صدرها، ممتلئان من أصلهما، مشدودان لم يتدلّيا، كثدي الفتاة في أول بلوغها. وهذا وصف لجسد امرأة النُّعْمان لا يعرفه إلا من رآها بلا ثياب، وهو مما جعل ابن قُتَيْبة يقول إن النابغة ذكر في القصيدة «بطنها وعكنها ... ومتنها وروادفها وفرجها» [@ibn-qutayba، ج1 ص164]."
vocabulary:
  - term: "عُكَنٍ"
    text: "طيّات البطن: «العُكَنُ والأَعْكان: الأَطْواء فِي البَطْن مِنَ السِّمَن»، و«وَاحِدَةُ العُكَنِ عُكْنَة» [@lisan، ج13 ص288]."
  - term: "لَطِيفٌ طَيُّهُ"
    text: "دقيق انطواؤه، أي البطن ضامر، وطيّاته رقيقة. والأَعْلَم يفسر البيت بأنها «مهفهفة خميصة البطن» [@diwan-nabigha، ص92]، والمهفهفة الضامرة البطن، والخميصة كذلك."
  - term: "وَالنَّحْرُ"
    text: "أعلى الصدر، موضع القلادة."
  - term: "تَنْفُجُهُ"
    text: "«أي تُعليه وترفعه، يقال: امرأة نُفُج الحقيبة، أي ضخمة العجيزة مرتفعتها» [@diwan-nabigha، ص92]."
  - term: "بِثَدْيٍ مُقْعَدِ"
    text: "بثدي ناهد ثابت في موضعه: «والمُقْعَد: الغليظ الأصل في أول قعوده، الذي لم يسترخ» [@diwan-nabigha، ص92]، و«ثَدْيٌ مُقْعَدٌ: ناتِئٌ عَلَى النَّحْرِ إِذَا كَانَ ناهِداً لَمْ يَنْثَنِ بَعْدُ» [@lisan، ج3 ص361]. والناهد: المرتفع المكتنز."
syntax:
  - "«وَالْبَطْنُ ذُو عُكَنٍ»: «البطن» مبتدأ، و«ذو» خبره مرفوع بالواو لأنه من الأسماء الخمسة، و«عُكَنٍ» مضاف إليه. و«أل» في «البطن» تقوم مقام الضمير، أي: وبطنها."
  - "«لَطِيفٌ طَيُّهُ»: «لطيفٌ» خبر ثانٍ، و«طيُّه» فاعل له، لأن الصفة المشبهة تعمل عمل فعلها، كأنه قال: لطُف طيُّه."
  - "«وَالنَّحْرُ تَنْفُجُهُ»: «النحر» مبتدأ، وجملة «تنفجه» خبره، وفاعل «تنفج» ضمير مستتر يعود على المرأة، والهاء مفعول به تعود على النحر."
  - "«بِثَدْيٍ مُقْعَدِ»: جار ومجرور متعلق بـ«تنفج»، و«مقعدِ» نعت مجرور."
morphology:
  - "«عُكَن» جمع «عُكْنة» على «فُعَل» [@lisan، ج13 ص288]."
  - "«طَيّ» مصدر «طَوَى يَطْوِي»، وأصله «طَوْي»، اجتمعت الواو والياء وسُبقت الأولى بالسكون، فقُلبت الواو ياء وأُدغمت في الياء."
  - "«تَنْفُج» مضارع «نَفَجَ يَنْفُجُ»، وأصل النَّفْج الرفع والإعلاء، كما فسّره الأَعْلَم [@diwan-nabigha، ص92]."
  - "«مُقْعَد» اسم مفعول من «أَقْعَدَ» على «أَفْعَلَ»، من «القُعود»، كأن الثدي أُقعد على الصدر فثبت فيه."
rhetoric:
  thesis: "بعد العين والعقد والقوام (9–11) ينزل الوصف إلى البطن والثدي، ثم إلى الظهر والعجيزة والجسد العاري في البيت التالي. فالصورة تمضي في جسدها من أعلى إلى أسفل."
  devices:
    - title: "التقسيم"
      text: "«وَالْبَطْنُ ... وَالنَّحْرُ ...»: يذكر عضوًا ثم صفته، ثم عضوًا آخر ثم صفته، في جملتين متوازيتين، كأنه يعدّ أعضاءها عدًّا. والتقسيم أن يُذكر الشيء أقسامًا ويُعطى كل قسم حكمه. وهذه قراءتنا."
    - title: "الجمع بين الصفتين في «ذُو عُكَنٍ لَطِيفٌ طَيُّهُ»"
      text: "العُكَن تكون «مِنَ السِّمَن» [@lisan، ج13 ص288]، ولطف الطيّ ضمور، فجمع لها النَّعمة والنحافة معًا: طيات تدل على العيش الرغد، وبطن لا يعظم. وعلى هذا فسّره الأَعْلَم: «ولو كانت مفاضة عظيمة لم يكن لها عكن» [@diwan-nabigha، ص92]."
    - title: "الاستعارة في «مُقْعَدِ»"
      text: "القعود للإنسان، فجعل الثدي كأنه جالس في مكانه على الصدر، ثابت لا يسترخي ولا يتدلّى، وبهذا المعنى فسّره الأَعْلَم: «الغليظ الأصل في أول قعوده» [@diwan-nabigha، ص92]. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "النظير عند امرئ القَيْس"
      text: "قال امرؤ القَيْس في صاحبته: «لَطِيفَةُ طَيِّ الْكَشْحِ غَيْرُ مُفَاضَةٍ» [@khizana، ج1 ص67]، والكشح الخصر. وفي هذا البيت «لَطِيفٌ طَيُّهُ»، وفي الذي بعده «غَيْرُ مُفَاضَةٍ»، فاللفظان عند النابغة كما هما عند امرئ القَيْس. وهذه ملاحظتنا."
  connection: "ثم ينتقل إلى ظهرها وعجيزتها وجسدها مجرّدًا: «مَخْطُوطَةُ الْمَتْنَيْنِ غَيْرُ مُفَاضَةٍ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلْبَطْنُ ذُو / عُكَنِنْ لَطِي / فُنْ طَيْيُهُو = مُتْفاعلن / متَفاعلن / مُتْفاعلن — وَنْنَحْرُ تَنْ / فُجُهُو بِثَدْ / يِنْ مُقْعَدِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأولى والثالثة من الصدر والعجز، فصارتا «مُتْفاعلن». وأُشبعت ضمة الهاء في «طيُّهُ» و«تنفجُهُ» فنُطقتا «طيّهو» و«تنفجهو»، وكسرة الدال في القافية «مقعدِ» فنُطقت «مقعدي»."
context: "من صورة المرأة في القصيدة (9–13): عينها كعين الظبي، والذهب في نحرها، وقوامها كالغصن، ثم هذا البيت في بطنها وثديها، ثم ظهرها وعجيزتها. وهو من الأعضاء التي عدّها ابن قُتَيْبة حين روى خبر النعمان: «صفها لى فى شعرك يا أبا أمامة!»، فقال النابغة القصيدة، «وقد ذكر فيها بطنها وعكنها ... ومتنها وروادفها وفرجها» [@ibn-qutayba، ج1 ص164]. ووصف جسد امرأة الملك على هذا النحو هو ما يعنيه شوقي ضَيْف حين يقول إن في القصيدة «غزلا مفحشا» [@deif، ج1 ص277]."
variants:
  - reading: "وَالْبَطْنُ ذُو عُكَنٍ خَمِيصٌ طَيُّهُ"
    status: "رواية ابن السِّكِّيت، كما ينقلها المحقق"
    note: "[@diwan-nabigha، ص247]. والخميص الضامر، والمعنى قريب من «لطيف»."
  - reading: "وَالْإِتْبُ تَنْفُجُهُ بِثَدْيٍ مُقْعَدِ"
    status: "رواية اللسان"
    note: "[@lisan، ج3 ص361]. والإتب ثوب المرأة: «الإِتْبُ: البَقِيرة، وَهُوَ بُرْدٌ أَو ثَوْبٌ يُؤْخَذُ فَيُشَقُّ فِي وسَطِه، ثُمَّ تُلْقِيه المرأَةُ فِي عُنُقِها مِنْ غَيْرِ جَيْب وَلَا كُمَّيْنِ» [@lisan، ج1 ص205]. فعلى هذه الرواية يرفع الثديُ ثوبها، لا صدرها."
