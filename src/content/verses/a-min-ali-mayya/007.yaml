explained: false
first: "غَنِيَتْ بِذَلِكَ إِذْ هُمُ لَكَ جِيرَةٌ"
second: "مِنْهَا بِعَطْفِ رِسَالَةٍ وَتَوَدُّدِ"
vocabulary:
  - term: "غَنِيَتْ بِذَلِكَ"
    text: "«أي أقامت وعاشت بما أودعتك من حبها» [@diwan-nabigha، ص90]."
  - term: "إِذْ هُمُ لَكَ جِيرَةٌ"
    text: "«يريد إذ كان حيُّه وحيُّها متجاورين في زمن الربيع، فكانت تعرض له، وتعطف عليه الرسائل، وتتودّد إليه» [@diwan-nabigha، ص90]."
sources:
