explained: false
first: "قَامَتْ تَرَاءَى بَيْنَ سِجْفَيْ كِلَّةٍ"
second: "كَالشَّمْسِ يَوْمَ طُلُوعِهَا بِالْأَسْعُدِ"
vocabulary:
  - term: "تَرَاءَى"
    text: "تتراءى. قال الأَعْلَم: «أي تعرض لنا نفسها وتتظاهر» [@diwan-nabigha، ص92]."
  - term: "سِجْفَيْ"
    text: "السِّجفان مصراعا الستر. قال الأَعْلَم: «والسِّجف: الستر المشقوق الوسط» [@diwan-nabigha، ص92]."
  - term: "كِلَّةٍ"
    text: "«والكِلَّة: السِّتر الرَّقِيقُ يُخاط كَالْبَيْتِ» [@lisan، ج11 ص595]."
  - term: "بِالْأَسْعُدِ"
    text: "جمع سَعْد، و«السَّعْد: اليُمْن، وَهُوَ نَقِيضُ النَّحْس» [@lisan، ج3 ص213]. قال الأَعْلَم: «وجعل طلوع الشمس بالأسعد؛ ليكون ذلك أتمّ للتشبيه، وأبلغ في الوصف» [@diwan-nabigha، ص92]."
