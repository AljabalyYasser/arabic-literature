explained: false
first: "لَا وَارِدٌ مِنْهَا يَحُورُ لِمَصْدَرٍ"
second: "عَنْهَا وَلَا صَدِرٌ يَحُورُ لِمَوْرِدِ"
vocabulary:
  - term: "وَارِدٌ"
    text: "الآتي إليها، من ورود الماء. قال الأَعْلَم: «يقول الذي يريد هذه المرأة، أي ينال منها لا يريد بذلك بدلًا، فيصدر عنها، وكلّ الذي يصدر عنها لا يريد أيضًا منها بدلًا، فيصدر ليريد غيرها. وأصل الورد والصَّدَر في الماء، فضربه مثلًا» [@diwan-nabigha، ص97]."
  - term: "صَدِرٌ"
    text: "المنصرف عنها، من الصدور عن الماء بعد الشرب."
  - term: "يَحُورُ"
    text: "«يرجع» [@diwan-nabigha، ص97]."
sources:
  - source: "diwan-nabigha"
    loc: "ص97"
    url: "https://archive.org/details/3409pdf_202001/page/n96/mode/1up"
status: "review"
