first: "لَا وَارِدٌ مِنْهَا يَحُورُ لِمَصْدَرٍ"
second: "عَنْهَا وَلَا صَدِرٌ يَحُورُ لِمَوْرِدِ"
meaning: "من جامعها لا يريد أن يتركها إلى غيرها، ومن فرغ منها لا يذهب إلى امرأة أخرى. فهي تكفي كل من نالها، فلا يطلب بعدها بدلًا. قال الأَعْلَم: «يقول الذي يريد هذه المرأة، أي ينال منها لا يريد بذلك بدلًا، فيصدر عنها، وكلّ الذي يصدر عنها لا يريد أيضًا منها بدلًا، فيصدر ليريد غيرها. وأصل الورد والصَّدَر في الماء، فضربه مثلًا. ومعنى «يحور»: يرجع» [@diwan-nabigha، ص97]. والورود في الأصل المجيء إلى الماء للشرب، والصدور الانصراف عنه بعد الريّ، فجعل الجماع بها شربًا من ماء لا يُستبدل به ماء آخر. و«ينال منها» في قول الأَعْلَم: يجامعها."
vocabulary:
  - term: "وَارِدٌ"
    text: "الآتي إليها، من ورود الماء، والمراد من يجامعها."
  - term: "يَحُورُ"
    text: "«يرجع» [@diwan-nabigha، ص97]."
  - term: "لِمَصْدَرٍ"
    text: "للانصراف، والمصدر موضع الصدور عن الماء أو وقته."
  - term: "صَدِرٌ"
    text: "المنصرف عنها بعد أن نال منها، كالصادر عن الماء بعد الشرب."
  - term: "لِمَوْرِدِ"
    text: "لماء آخر يرده، أي لامرأة أخرى."
syntax:
  - "«لَا وَارِدٌ مِنْهَا يَحُورُ»: «لا» نافية عاملة عمل «ليس»، و«واردٌ» اسمها مرفوع، وجملة «يحور» خبرها، و«منها» متعلق بـ«وارد». ويجوز أن تكون «لا» مهملة لتكرارها، و«واردٌ» مبتدأ."
  - "«لِمَصْدَرٍ عَنْهَا»: جار ومجرور متعلق بـ«يحور»، و«عنها» متعلق بـ«مصدر». وامتد المعنى من الصدر إلى أول العجز."
  - "«وَلَا صَدِرٌ يَحُورُ لِمَوْرِدِ»: معطوفة على الأولى بالبناء نفسه."
morphology:
  - "«وَارِد» اسم فاعل من «وَرَدَ»، و«صَدِر» على «فَعِل» صفة مشبهة من «صَدَرَ» بمعنى الصادر."
  - "«مَصْدَر» و«مَوْرِد» على «مَفْعَل»، اسما مكان أو زمان أو مصدران ميميان، من «صَدَرَ» و«وَرَدَ»."
  - "«يَحُور» مضارع «حارَ يَحُورُ» أجوف واوي بمعنى رجع."
rhetoric:
  thesis: "خاتمة القصيدة في رواية الأَصْمَعِيّ: بعد صور الجماع، حكم عام في المرأة: لا بديل لمن نالها. فالأبيات الصريحة تنتهي بمدح يقوم على الجماع نفسه."
  devices:
    - title: "التمثيل بالورد والصَّدَر"
      text: "جعل الرجال حول المرأة كالإبل حول الماء: واردون وصادرون. وقد قال الأَعْلَم: «وأصل الورد والصَّدَر في الماء، فضربه مثلًا» [@diwan-nabigha، ص97]. والتمثيل عند عبد القاهر الجُرْجانيّ ما يكون فيه «الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، فالشبه بين الماء والمرأة لا يُرى، بل يُفهم: كلاهما ريّ لا يُستبدل به غيره."
    - title: "المقابلة"
      text: "«وَارِدٌ ... لِمَصْدَرٍ» في الصدر، و«صَدِرٌ ... لِمَوْرِدِ» في العجز: عكس الكلمات في الشطر الثاني فصار الوارد صادرًا والمصدر موردًا. والمقابلة أن يؤتى بمعنيين ثم بما يقابلهما على الترتيب، وهي هنا تغلق الطريقين: لا ينصرف القادم، ولا يقصد المنصرف غيرها."
  connection: "وبه تُختم القصيدة في رواية الأَصْمَعِيّ."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "لَا وَارِدُنْ / مِنْهَا يَحُو / رُ لِمَصْدَرِنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — عَنْهَا وَلَا / صَدِرُنْ يَحُو / رُ لِمَوْرِدِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأوليين من الصدر والأولى من العجز. وأُشبعت كسرة الدال في القافية «لموردِ» فنُطقت «لموردي»."
context: "آخر الأبيات الخمسة الصريحة (30–34)، وآخر القصيدة عند الأَعْلَم [@diwan-nabigha، ص97]. وعند ابن السِّكِّيت، فيما ينقله المحقق، رواية أخرى للبيت، وفي نسخة المحقق بعده بيت آخر لا نجده في المطبوع [@diwan-nabigha، ص247–248]، نذكره في متن القصيدة."
variants:
  - reading: "لَا وَارِدٌ مِنْهَا يَجُوزُ إِذَا اسْتَقَى / صَدَرًا وَلَا صَدِرٌ يَجُوزُ لِمَوْرِدِ"
    status: "رواية ابن السِّكِّيت، كما ينقلها المحقق"
    note: "[@diwan-nabigha، ص247]. و«يجوز» هنا بمعنى يتجاوز، أي لا يتجاوزها الوارد إلى غيرها بعد أن يستقي، ولا الصادر إلى مورد آخر، والمعنى واحد."
