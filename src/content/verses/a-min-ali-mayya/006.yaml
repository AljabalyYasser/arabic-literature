explained: false
first: "فِي إِثْرِ غَانِيَةٍ رَمَتْكَ بِسَهْمِهَا"
second: "فَأَصَابَ قَلْبَكَ غَيْرَ أَنْ لَمْ تُقْصِدِ"
vocabulary:
  - term: "فِي إِثْرِ غَانِيَةٍ"
    text: "قال الأَعْلَم: «أي حان الرحيل بعد أن عرضت لك هذه الجارية ورمتك بسهمها، أي أودعت قلبك حبًّا» [@diwan-nabigha، ص90]."
  - term: "غَانِيَةٍ"
    text: "«والغانية: التي غَنِيَت بجمالها» [@diwan-nabigha، ص90]، أي استغنت به عن الزينة."
  - term: "لَمْ تُقْصِدِ"
    text: "لم تقتلك فتستريح من حبها، من قولهم: «رماه فأقصده، إذا قتله» [@diwan-nabigha، ص90]."
sources:
