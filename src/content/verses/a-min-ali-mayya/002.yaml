explained: false
first: "أَفِدَ التَّرَحُّلُ غَيْرَ أَنَّ رِكَابَنَا"
second: "لَمَّا تَزُلْ بِرِحَالِنَا وَكَأَنْ قَدِ"
vocabulary:
  - term: "أَفِدَ التَّرَحُّلُ"
    text: "«أي دنا الرحيل وقرُب» [@diwan-nabigha، ص89]."
  - term: "رِكَابَنَا"
    text: "«والرِّكاب: الإبل، واحدها راحلة، ولا واحد لها من لفظها» [@diwan-nabigha، ص89]."
  - term: "لَمَّا تَزُلْ بِرِحَالِنَا"
    text: "لم تذهب برحالنا بعدُ، و«لمّا» نفيٌ لما يُنتظر وقوعه."
  - term: "وَكَأَنْ قَدِ"
    text: "أي: وكأنْ قد زالت، فحذف الفعل. قال الأَعْلَم: «أي قد زالت لقرب وقت زوالها ودنوّه» [@diwan-nabigha، ص89]."
sources:
