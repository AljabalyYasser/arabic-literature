explained: false
first: "زَعَمَ الْهُمَامُ وَلَمْ أَذُقْهُ أَنَّهُ"
second: "عَذْبٌ إِذَا مَا ذُقْتَهُ قُلْتَ ازْدَدِ"
vocabulary:
  - term: "وَلَمْ أَذُقْهُ"
    text: "كلام معترض: يقول ذلك على لسان الهمام، وينفي عن نفسه أن يكون ذاقه."
  - term: "ازْدَدِ"
    text: "اطلب الزيادة منه."
sources:
