first: "زَعَمَ الْهُمَامُ وَلَمْ أَذُقْهُ أَنَّهُ"
second: "عَذْبٌ إِذَا مَا ذُقْتَهُ قُلْتَ ازْدَدِ"
meaning: "قال الملك، وأنا لم أذق فمها، إنه عذب، إذا ذقته قلت: زِدني. ولم يشرح الأَعْلَم هذا البيت، فقد ترك رقمه بلا كلام [@diwan-nabigha، ص95]، فشرحه هنا قراءتنا. والذوق هنا ذوق القبلة: أن تلثم فمها وتذوق ريقها. فالمعنى بلغة اليوم: يقول النُّعْمان إن ريق امرأته حلو، من قبّلها مرة طلب أن يقبّلها مرة أخرى ولم يشبع منها؛ ويقطع النابغة الكلام ليقول: «ولم أذقه»، أي لم أقبّلها قط ولم أعرف طعم فمها، وإنما أنقل ما قاله زوجها. ثم يخاطب السامع: «إذا ما ذقته»، فيجعل التقبيل لكل من يتخيّله."
vocabulary:
  - term: "وَلَمْ أَذُقْهُ"
    text: "لم أذق طعم فمها، أي لم أقبّلها. والهاء تعود على الفم في «فاها» في البيت السابق."
  - term: "عَذْبٌ"
    text: "حلو طيب الطعم، وأصله في الماء."
  - term: "ذُقْتَهُ"
    text: "ذقت طعمه، والخطاب لمن يسمع، أي لكل من يقبّلها."
  - term: "ازْدَدِ"
    text: "اطلب الزيادة: زِدني، وكُسرت الدال الأخيرة للقافية."
syntax:
  - "«زَعَمَ الْهُمَامُ»: فعل وفاعل، و«أَنَّهُ عَذْبٌ» في تأويل مصدر سدّ مسدّ مفعولي «زعم»، والهاء اسم «أنّ» تعود على الفم، و«عذبٌ» خبرها."
  - "«وَلَمْ أَذُقْهُ»: الواو اعتراضية، و«لم» حرف نفي وجزم، و«أَذُقْ» مضارع مجزوم، والهاء مفعول به. والجملة معترضة بين الفعل «زعم» وما سدّ مسدّ مفعوليه، لا محل لها من الإعراب."
  - "«إِذَا مَا ذُقْتَهُ»: «إذا» ظرف لما يستقبل متضمن معنى الشرط، و«ما» زائدة للتوكيد، و«ذقتَه» فعل الشرط. و«قُلْتَ ازْدَدِ» جوابه، و«ازددْ» فعل أمر مبني على السكون، حُرّك بالكسر للروي، والجملة في محل نصب مقول القول. وجملة الشرط وجوابه في محل رفع صفة لـ«عذب»."
morphology:
  - "«أَذُقْ» مضارع «ذَاقَ يَذُوقُ»، أجوف واوي، أصله «أَذُوقْ»، فلما جُزم التقى ساكنان فحُذفت الواو."
  - "«ازْدَدْ» أمر من «ازْدَادَ» على «افْتَعَلَ» من «زَادَ»، وأصل الماضي «ازْتَادَ»، قُلبت تاء الافتعال دالًا بعد الزاي. وفي الأمر «ازْدَادْ» التقى ساكنان، الألف والدال، فحُذفت الألف: «ازْدَدْ»."
  - "«عَذْب» صفة مشبهة على «فَعْل»."
rhetoric:
  thesis: "يكرر «زَعَمَ الْهُمَامُ» ويزيد عليه نفيًا صريحًا: «وَلَمْ أَذُقْهُ». فالبيت يصف لذة تقبيلها، ويبرّئ الشاعر منها في اللحظة نفسها."
  devices:
    - title: "الاعتراض"
      text: "«وَلَمْ أَذُقْهُ»: جملة دخلت بين «زعم» و«أنّه»، فقطعت الكلام لتنفي عن الشاعر أن يكون قبّلها. والاعتراض أن يُدخل المتكلم في أثناء الكلام جملة تتم بها فائدة لا يتم بها الإعراب. وهذا النفي يلفت إلى ما ينفيه: فالرواة جعلوا المُنَخَّل اليَشْكُرِيّ يقول في شعر القصيدة: «ما يستطيع أن يقول مثل هذا الشعر إلّا من قد جرّب!» [@ibn-qutayba، ج1 ص165]. وربطُ الاعتراض بالخبر قراءتنا."
    - title: "الالتفات"
      text: "بدأ بالمتكلم «أَذُقْهُ»، ثم انتقل إلى المخاطب «ذُقْتَهُ ... قُلْتَ». والالتفات نقل الكلام من التكلم أو الخطاب أو الغيبة إلى غيره. فبعد أن نفى القبلة عن نفسه جعلها للسامع، كأن كل من يسمع البيت يتذوّق ما لم يذقه الشاعر. وهذه قراءتنا."
    - title: "الجناس في «أَذُقْهُ» و«ذُقْتَهُ»"
      text: "الفعل نفسه منفيًّا عن الشاعر، ومثبتًا للسامع. والجناس أن تتشابه الكلمتان في اللفظ أو في أصله، وهو هنا يضع النفي والإثبات متجاورين في بيت واحد."
  connection: "ثم يكرر العبارة مرة ثالثة، وينتقل من الطعم إلى رائحة الريق: «زَعَمَ الْهُمَامُ وَلَمْ أَذُقْهُ أَنَّهُ / يُشْفَى بِرَيَّا رِيقِهَا الْعَطِشُ الصَّدِي»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "زَعَمَلْ هُمَا / مُ وَلَمْ أَذُقْ / هُو أَنْنَهُو = متَفاعلن / متَفاعلن / مُتْفاعلن — عَذْبُنْ إِذَا / مَا ذُقْتَهُو / قُلْتَزْدَدِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأخيرة من الصدر، وتفعيلات العجز كلها. وأُشبعت ضمة الهاء في «أذقهُ» و«أنّهُ» و«ذقتهُ» فنُطقت «أذقهو» و«أنّهو» و«ذقتهو». وسقطت همزة الوصل في «ازددِ» في النطق، فاتصلت التاء بالزاي: «قُلْتَزْدَدِي»."
context: "ثاني الأبيات الثلاثة التي يبدأ كل منها بـ«زَعَمَ الْهُمَامُ» (22–24)، وأولها الذي فيه «وَلَمْ أَذُقْهُ». وعجزه في رواية ابن السِّكِّيت عجزٌ للبيت 22، وفيها تصير الأبيات الثلاثة بيتين [@diwan-nabigha، ص247]. ولم يقف الأَعْلَم عنده بشيء [@diwan-nabigha، ص95]."
variants:
  - reading: "زَعَمَ الْهُمَامُ بِأَنَّ فَاهَا بَارِدٌ / عَذْبٌ إِذَا مَا ذُقْتَهُ قُلْتَ ازْدَدِ"
    status: "رواية ابن السِّكِّيت، كما ينقلها المحقق"
    note: "عجز هذا البيت مع صدر البيت 22 [@diwan-nabigha، ص247]، فلا يكون فيها «وَلَمْ أَذُقْهُ» إلا مرة واحدة، في البيت الذي يقابل البيت 24."
