explained: false
first: "حَانَ الرَّحِيلُ وَلَمْ تُوَدِّعْ مَهْدَدًا"
second: "وَالصُّبْحُ وَالْإِمْسَاءُ مِنْهَا مَوْعِدِي"
vocabulary:
  - term: "مَهْدَدًا"
    text: "«اسم جارية، ويحتمل أن يريد بها «ميّة»، وقد يسمّون المرأة في أشعارهم باسمين وأكثر من ذلك» [@diwan-nabigha، ص90]."
  - term: "وَالصُّبْحُ وَالْإِمْسَاءُ مِنْهَا مَوْعِدِي"
    text: "«أي لا موعدَ بيني وبينها يكون فيه اجتماع إلى آخر الدهر، وكنّى بالصبح والإمساء عن مدة الدهر» [@diwan-nabigha، ص90]."
sources:
  - source: "diwan-nabigha"
    loc: "ص90"
