first: "لَا مَرْحَبًا بِغَدٍ وَلَا أَهْلًا بِهِ"
second: "إِنْ كَانَ تَفْرِيقُ الْأَحِبَّةِ فِي غَدِ"
vocabulary:
  - term: "لَا مَرْحَبًا بِغَدٍ"
    text: "«أي لا رَحْبًا به ولا سعة» [@diwan-nabigha، ص90]. ويقول الأَعْلَم: «وإنما يريد إن كان تفريقنا في غدٍ فأبعده الله ولا جاء به» [@diwan-nabigha، ص90]."
