first: "أَخَذَ الْعَذَارَى عِقْدَهُ فَنَظَمْنَهُ"
second: "مِنْ لُؤْلُؤٍ مُتَتَابِعٍ مُتَسَرِّدِ"
meaning: "أخذت الجواري الأبكار عقده فنظمنه من لؤلؤ متتابع، حبّة بعد حبّة في نسق واحد. قال الأَعْلَم: «العذارى: أبكار الجواري. والمتسرِّد: الذي يتبع بعضه بعضًا، يقال: سرد الحديث، إذا والى بينه وتابعه، وصف أنها ذات حلي ونعيم، وأن العذارى يخدمنها ويتصرفن في أمورها» [@diwan-nabigha، ص95]. فهي عند الأَعْلَم ملكة مخدومة، تنظم الجواري عقودها. لكن الضمير في «عِقْدَهُ» مذكر، ولم يقل «عقدها»، والمذكر الذي يسبقه هو الفم في «فَاهَا ... مُقَبَّلُهُ» (22). فيحتمل البيت أن يكون عقدُ الفم أسنانَها: صفّان من لؤلؤ منظوم كأن العذارى نظمنه بأيديهن، وبهذا يتصل بوصف الثغر والريق قبله. وهذا الاحتمال قراءتنا، ولم يذكره الأَعْلَم. فالمعنى بلغة اليوم على قول الأَعْلَم: لها قلادة من لؤلؤ منتظم نظمتها لها جواريها، فهي غنية منعّمة؛ وعلى قراءتنا: أسنانها في فمها الذي يُقبَّل مصفوفة بيضاء كحبات لؤلؤ في عقد."
vocabulary:
  - term: "الْعَذَارَى"
    text: "«أبكار الجواري» [@diwan-nabigha، ص95]، أي الفتيات اللواتي لم يتزوجن، وهنّ هنا خادماتها."
  - term: "عِقْدَهُ"
    text: "العِقْد: القلادة من الخرز أو اللؤلؤ تُنظم في خيط."
  - term: "فَنَظَمْنَهُ"
    text: "أدخلن حبّاته في الخيط واحدة بعد أخرى."
  - term: "مُتَتَابِعٍ مُتَسَرِّدِ"
    text: "«الذي يتبع بعضه بعضًا، يقال: سرد الحديث، إذا والى بينه وتابعه» [@diwan-nabigha، ص95]."
syntax:
  - "«أَخَذَ الْعَذَارَى»: فعل ماضٍ، و«العذارى» فاعل مرفوع بضمة مقدرة على الألف. وذُكّر الفعل وفاعله جمع مؤنث، لأن «العذارى» جمع تكسير، وجمع التكسير يجوز في فعله التذكير والتأنيث."
  - "«عِقْدَهُ»: مفعول به، والهاء مضاف إليه، وفي مرجعها ما ذُكر في المعنى."
  - "«فَنَظَمْنَهُ»: الفاء عاطفة، و«نظمْن» فعل ماضٍ مبني على السكون لاتصاله بنون النسوة، والنون فاعل، والهاء مفعول به تعود على العقد."
  - "«مِنْ لُؤْلُؤٍ»: جار ومجرور متعلق بـ«نظمنه»، و«من» لبيان الجنس، و«مُتَتَابِعٍ» و«مُتَسَرِّدِ» نعتان لـ«لؤلؤ» مجروران."
morphology:
  - "«الْعَذَارَى» جمع «عَذْراء» على «فَعالَى»."
  - "«مُتَتَابِع» اسم فاعل من «تَتَابَعَ» على «تَفاعَلَ»، و«مُتَسَرِّد» اسم فاعل من «تَسَرَّدَ» على «تَفَعَّلَ»، من «سَرَدَ» [@diwan-nabigha، ص95]."
  - "«لُؤْلُؤ» اسم رباعي مهموز الفاء واللام."
rhetoric:
  thesis: "يختم أبيات الفم بصورة اللؤلؤ المنظوم: عند الأَعْلَم حليٌّ تنظمه لها الجواري، فهو دليل على النعمة، ويحتمل أن يكون صورة لأسنانها."
  devices:
    - title: "الكناية"
      text: "«أَخَذَ الْعَذَارَى عِقْدَهُ فَنَظَمْنَهُ»: لم يقل إنها ملكة مخدومة، بل ذكر جواري ينظمن عقدها، فدلّ بذلك على ما وراءه. وهذا ما فهمه الأَعْلَم: «وصف أنها ذات حلي ونعيم، وأن العذارى يخدمنها» [@diwan-nabigha، ص95]. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الإطناب في «مُتَتَابِعٍ مُتَسَرِّدِ»"
      text: "جمع صفتين متقاربتين في المعنى، فكرر فكرة الانتظام، كأن حبّات اللؤلؤ تتوالى في السمع كما تتوالى في الخيط. وهذه قراءتنا."
    - title: "اللؤلؤ والأسنان"
      text: "إن صحّ أن الضمير في «عِقْدَهُ» يعود على الفم، فالبيت تشبيه ضمني: لم يذكر الأسنان ولا أداة التشبيه، بل وصف عقدًا منظومًا وترك السامع يفهم أنه أسنانها. وقد شبّه أسنانها قبل ذلك بالبَرَد والأقحوان (20–21). وهذه قراءتنا."
  connection: "ثم يخرج من صفة جسدها إلى أثر حسنها في غيرها: «لَوْ أَنَّهَا عَرَضَتْ لِأَشْمَطَ رَاهِبٍ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَخَذَلْ عَذَا / رَى عِقْدَهُو / فَنَظَمْنَهُو = متَفاعلن / مُتْفاعلن / متَفاعلن — مِنْ لُؤْلُئِنْ / مُتَتَابِعِنْ / مُتَسَرْرِدِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر والأولى من العجز. وأُشبعت ضمة الهاء في «عقدَهُ» و«نظمنَهُ» فنُطقتا «عقدهو» و«نظمنهو»، وكسرة الدال في القافية فنُطقت «متسرّدي»."
context: "آخر أبيات الثغر والريق (20–25)، وبعده ينتقل إلى أثر حسنها وحديثها في الراهب والوعول (26–28). وهو في رواية الأَعْلَم يعود إلى الحلي الذي بدأ به في البيت 10 «وَالنَّظْمُ فِي سِلْكٍ يُزَيِّنُ نَحْرَهَا»، فيُقرأ صفة لنعمتها. ولم يذكر المحقق للبيت رواية أخرى عن ابن السِّكِّيت [@diwan-nabigha، ص247]."
