explained: false
first: "أَخَذَ الْعَذَارَى عِقْدَهُ فَنَظَمْنَهُ"
second: "مِنْ لُؤْلُؤٍ مُتَتَابِعٍ مُتَسَرِّدِ"
vocabulary:
  - term: "الْعَذَارَى"
    text: "«أبكار الجواري» [@diwan-nabigha، ص95]."
  - term: "مُتَسَرِّدِ"
    text: "«الذي يتبع بعضه بعضًا، يقال: سرد الحديث، إذا والى بينه وتابعه» [@diwan-nabigha، ص95]. وقال الأَعْلَم في البيت: «وصف أنها ذات حلي ونعيم، وأن العذارى يخدمنها ويتصرفن في أمورها» [@diwan-nabigha، ص95]."
sources:
