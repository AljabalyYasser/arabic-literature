explained: false
first: "مَخْطُوطَةُ الْمَتْنَيْنِ غَيْرُ مُفَاضَةٍ"
second: "رَيَّا الرَّوَادِفِ بَضَّةُ الْمُتَجَرَّدِ"
vocabulary:
  - term: "مَخْطُوطَةُ الْمَتْنَيْنِ"
    text: "قال الأَعْلَم: «المخطوطة المتنين: التي في متنيها خطّان»، ونقل عن الأَصْمَعِيّ أنها «ملساء الظهر غير متقبضة الجلد». والمتنان: «لحمتا الظهر عن يمين الفقار وشماله» [@diwan-nabigha، ص92]."
  - term: "مُفَاضَةٍ"
    text: "«الواسعة البطن العظيمته» [@diwan-nabigha، ص92]."
  - term: "رَيَّا"
    text: "«الممتلئة؛ وأصله من ريّ الماء» [@diwan-nabigha، ص92]."
  - term: "بَضَّةُ الْمُتَجَرَّدِ"
    text: "«والبَضّة: الناعمة البيضاء. والمتجرّد: الجسم المجرّد» [@diwan-nabigha، ص92]."
sources:
