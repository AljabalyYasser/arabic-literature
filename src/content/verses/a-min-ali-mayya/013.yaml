first: "مَخْطُوطَةُ الْمَتْنَيْنِ غَيْرُ مُفَاضَةٍ"
second: "رَيَّا الرَّوَادِفِ بَضَّةُ الْمُتَجَرَّدِ"
meaning: "ظهرها أملس مستوٍ، وبطنها غير منتفخ، وعجيزتها ممتلئة، وجسدها إذا جُرّد من ثيابه أبيض ناعم. قال الأَعْلَم: «المخطوطة المتنين: التي في متنيها خطّان، كما تُخَطّ الجلود إذا زُيِّنت بالحديدة مثل جلود المصاحف وغيرها. وقال الأصمعي: «مخطوطة»، أي ملساء الظهر غير متقبضة الجلد؛ لأن الظهر أسرع الجسد تقبّضًا ... والمفاضة: الواسعة البطن العظيمته [والريّا] الممتلئة؛ وأصله من ريّ الماء. والبضّة: الناعمة البيضاء. والمتجرّد: الجسم المجرّد، أي إذا جرّدتها رأيتها بضّة الجسم ناعمته. والمتنان: لحمتا الظهر عن يمين الفقار وشماله» [@diwan-nabigha، ص92]. فالمعنى بلغة اليوم: إذا خلعت ثيابها رأيت ظهرًا أملس مشدود الجلد، وبطنًا ضامرًا، وأردافًا كبيرة ممتلئة، وبشرة بيضاء ناعمة في جسدها العاري كله. وهذا أصرح ما في القصيدة قبل أبياتها الأخيرة: فالشاعر يصف امرأة الملك عارية، ولذلك قال الأَعْلَم في تفسيره «إذا جرّدتها»."
vocabulary:
  - term: "مَخْطُوطَةُ الْمَتْنَيْنِ"
    text: "ملساء الظهر. «المخطوطة المتنين: التي في متنيها خطّان»، وعن الأَصْمَعِيّ: «أي ملساء الظهر غير متقبضة الجلد» [@diwan-nabigha، ص92]."
  - term: "الْمَتْنَيْنِ"
    text: "«والمتنان: لحمتا الظهر عن يمين الفقار وشماله» [@diwan-nabigha، ص92]، والفَقار عظام الظهر."
  - term: "مُفَاضَةٍ"
    text: "«الواسعة البطن العظيمته» [@diwan-nabigha، ص92]."
  - term: "رَيَّا الرَّوَادِفِ"
    text: "ممتلئة العجيزة: «[والريّا] الممتلئة؛ وأصله من ريّ الماء» [@diwan-nabigha، ص92]. والروادف الأعجاز: «والرِّدْفُ: الكَفَلُ والعجُزُ، وَخَصَّ بَعْضُهُمْ بِهِ عَجِيزَةَ المرأَة ... والرَّوادِفُ: الأَعْجازُ» [@lisan، ج9 ص115]."
  - term: "بَضَّةُ الْمُتَجَرَّدِ"
    text: "بيضاء ناعمة الجسد إذا جُرّدت من ثيابها: «والبضّة: الناعمة البيضاء. والمتجرّد: الجسم المجرّد» [@diwan-nabigha، ص92]. وفي اللسان: «امرأَةٌ بَضَّةُ المتجرَّدِ إِذا كَانَتْ بَضَّةَ البَشَرَةِ إِذا جُرِّدَتْ مِنْ ثَوْبِهَا» [@lisan، ج3 ص116]."
syntax:
  - "«مَخْطُوطَةُ الْمَتْنَيْنِ»: خبر لمبتدأ محذوف تقديره «هي»، وهو مضاف و«المتنين» مضاف إليه مجرور بالياء لأنه مثنى. والإضافة لفظية، لأن المعنى: مخطوطٌ متناها."
  - "«غَيْرُ مُفَاضَةٍ»: خبر ثانٍ، و«مفاضة» مضاف إليه."
  - "«رَيَّا الرَّوَادِفِ»: خبر ثالث مرفوع بضمة مقدرة على الألف، و«بَضَّةُ الْمُتَجَرَّدِ» خبر رابع. وكل هذه الأخبار صفات للمرأة نفسها التي وصف بطنها وثديها في البيت السابق."
morphology:
  - "«مَخْطُوطَة» اسم مفعول من «خَطَّ يَخُطُّ»، مضعّف."
  - "«مُفَاضَة» اسم مفعول من «أَفَاضَ» على «أَفْعَلَ»، أجوف يائي من «الفَيْض». وقال البَغْداديّ في المفاضة عند امرئ القَيْس: «وهما من الفيض» [@khizana، ج1 ص67]."
  - "«رَيَّا» على «فَعْلَى»، مؤنث «رَيّان»، وأصلها «رَوْيا»، قُلبت الواو ياء وأُدغمت."
  - "«الْمُتَجَرَّد» بفتح الراء يكون مصدرًا ميميًّا، ويكون بكسرها اسم فاعل يراد به الجسم: «وامرأَة بَضَّةُ الجُرْدةِ والمتجرِّدِ والمتجرَّدِ، وَالْفَتْحُ أَكثر، أَي بَضَّةٌ عِنْدَ التجرُّدِ، فالمتجرَّدِ عَلَى هَذَا مَصْدَرٌ ... وَمَنْ قَالَ بَضَّةُ المتجرِّد، بِالْكَسْرِ، أَراد الجسمَ» [@lisan، ج3 ص116]."
rhetoric:
  thesis: "يكمل صورة الجسد من الخلف والأسفل: الظهر، والبطن، والعجيزة، ثم يجمع ذلك كله في «بَضَّةُ الْمُتَجَرَّدِ»: الجسد كله عاريًا."
  devices:
    - title: "المقابلة بين «غَيْرُ مُفَاضَةٍ» و«رَيَّا الرَّوَادِفِ»"
      text: "بطن ضامر وعجيزة ممتلئة، وهو الجسد الذي يمدحه الشعراء. وقد قال البَغْداديّ في صاحبة امرئ القَيْس التي وُصفت بمثل هذا: «وصفها بثلاثة أمور بهضم الخصر وضخامة الكفل والطيب» [@khizana، ج1 ص67]. والهضم: الضمور، والكفل: العجيزة."
    - title: "الاستعارة في «رَيَّا»"
      text: "الريّ للعطشان الذي شرب حتى امتلأ، كما قال الأَعْلَم: «وأصله من ريّ الماء» [@diwan-nabigha، ص92]، فاستعاره لعجيزة ممتلئة اللحم. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "«الْمُتَجَرَّدِ» واسم المرأة"
      text: "ختم البيت بكلمة «المتجرَّد»، وامرأة النُّعْمان التي يقول الرواة إنه يصفها اسمها المُتَجَرِّدة: «والمتجرِّدةُ: اسْمُ امرأَةِ النعمانِ بْنِ المنذِر مَلِكَ الحَيرةِ» [@lisan، ج3 ص116]. فالكلمة تصف جسدها العاري وتكاد تسمّيها، وهو الذي «كنى عنها» كما يقول الأَعْلَم في رأس القصيدة [@diwan-nabigha، ص89]. وهذه قراءتنا."
  connection: "ثم يصورها قائمة بين مصراعي الستر كالشمس: «قَامَتْ تَرَاءَى بَيْنَ سِجْفَيْ كِلَّةٍ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "مَخْطُوطَتُلْ / مَتْنَيْنِ غَيْ / رُ مُفَاضَتِنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — رَيْيَرْرَوَا / دِفِ بَضْضَتُلْ / مُتَجَرْرَدِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأوليين من الصدر والأولى من العجز. وأُشبعت كسرة الدال في القافية «المتجرَّدِ» فنُطقت «المتجرَّدي»."
context: "آخر أبيات صورة المرأة (9–13)، وبعده تبدأ صورها البعيدة: الشمس والدرّة والدمية (14–16). وهو البيت الذي فيه «متنها وروادفها» من قول ابن قُتَيْبة إن النابغة ذكر في القصيدة «بطنها وعكنها ... ومتنها وروادفها وفرجها» [@ibn-qutayba، ج1 ص164]. وصفة الجسد المجرّد من الثياب هي التي بنى عليها الرواة خبر غيرة المُنَخَّل اليَشْكُرِيّ، إذ قال: «ما يستطيع أن يقول مثل هذا الشعر إلّا من قد جرّب!» [@ibn-qutayba، ج1 ص165]."
variants:
  - reading: "مَحْطُوطَةُ الْمَتْنَيْنِ غَيْرُ مُفَاضَةٍ"
    status: "رواية البَطَلْيَوْسيّ كما ينقلها المحقق، وهي في اللسان"
    note: "بالحاء [@diwan-nabigha، ص247]. وفي اللسان: «وَجَارِيَةٌ مَحْطُوطةُ المَتْنَيْن: ممدودَتُهما، وَقَالَ الأَزهري: مَمْدُودَةٌ حسنَة مُسْتَوِيَةٌ؛ قَالَ النَّابِغَةُ»، ثم أنشد الصدر [@lisan، ج7 ص274]. وينقل المحقق في حاشيته عن القُتَيْبِيّ: «معناه أن متنيها أملسان؛ كأنما دلكا بالمحطّ كما يدلك الجلد، أى يصقل، وخصّ المتن وهو الظهر لأنه أسرع الجلد تقبضا» [@diwan-nabigha، ص247، الحاشية]. والمِحَطّ، ويقول الأَعْلَم «المِخَطّ»: «حديدة يُصقَل بها الجلد» [@diwan-nabigha، ص92]. فالمعنى في الروايتين واحد: ظهر أملس."
