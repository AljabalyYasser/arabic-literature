first: "وَإِذَا طَعَنْتَ طَعَنْتَ فِي مُسْتَهْدِفٍ"
second: "رَابِي الْمَجَسَّةِ بِالْعَبِيرِ مُقَرْمَدِ"
meaning: "وإذا أولجتَ أولجتَ في موضع عريض مرتفع، ناتئ تحت اليد، مطليّ بالطيب كما يُطلى الحوض بالجصّ. قال الأَعْلَم: «والمستهدِف: المرتفع. يقال: أهدف له الشيء، إذا ارتفع. والعبير: هو الزعفران، وقيل: هو الخَلُوق. والمقرمد: المطليّ. والقِرْمِد: الجيّار والجصّ؛ يعني أنه مطليّ بالزعفران كما يُطلَى الحوض والبناء بالقرمد. والرابي: المرتفع» [@diwan-nabigha، ص97]. والجيّار: الجصّ أو الكلس، والخَلُوق: طيب يُعمل من الزعفران. فالطعن هنا الجماع، والبيت وصف صريح للفرج عند الإيلاج. والمعنى بلغة اليوم: إذا أدخلتَ ذكرك في فرجها وجدته فرجًا مرتفعًا ممتلئًا تحت اليد، مطيَّبًا بالزعفران."
vocabulary:
  - term: "طَعَنْتَ"
    text: "من الطعن بالرمح، والمراد الإيلاج."
  - term: "مُسْتَهْدِفٍ"
    text: "«المرتفع. يقال: أهدف له الشيء، إذا ارتفع» [@diwan-nabigha، ص97]. وفي اللسان: «وركب مستهدف أي عريض مرتفع»، ثم أنشد البيت [@lisan، ج9 ص346]."
  - term: "رَابِي الْمَجَسَّةِ"
    text: "مرتفع موضع الجسّ، أي ما تقع عليه اليد: «والرابي: المرتفع. والربوة: ما ارتفع من الأرض» [@diwan-nabigha، ص97]."
  - term: "الْعَبِيرِ"
    text: "«هو الزعفران، وقيل: هو الخَلُوق» [@diwan-nabigha، ص97]، وفي اللسان: «والعبير: أخلاط من الطيب تجمع بالزعفران» [@lisan، ج4 ص531]."
  - term: "مُقَرْمَدِ"
    text: "«المطليّ» [@diwan-nabigha، ص97]. وفي اللسان: «وثوب مقرمد بالزعفران والطيب أي مطلي؛ قال النابغة يصف هنا»، ثم: «وقيل في قول النابغة ... إنه الضيق؛ وقيل: المطلي كما يطلى الحوض بالقرمد» [@lisan، ج3 ص352]. والهَن: كناية عن الفرج."
syntax:
  - "«وَإِذَا طَعَنْتَ طَعَنْتَ»: شرط وجوابه بلفظ واحد، كما في البيت السابق."
  - "«فِي مُسْتَهْدِفٍ»: جار ومجرور متعلق بـ«طعنتَ» الثانية، و«مستهدف» صفة لموصوف محذوف."
  - "«رَابِي الْمَجَسَّةِ»: نعت ثانٍ للموصوف المحذوف، مجرور بكسرة مقدّرة على الياء، مضاف إلى «المجسّة» إضافة لفظية لا تفيده تعريفًا."
  - "«بِالْعَبِيرِ»: متعلق بـ«مقرمد»، و«مُقَرْمَدِ» نعت ثالث."
morphology:
  - "«مُسْتَهْدِف» اسم فاعل من «اسْتَهْدَفَ» على «اسْتَفْعَلَ»، وفي اللسان: «وقد استهدف أي انتصب» [@lisan، ج9 ص345]."
  - "«الْمَجَسَّة» على «مَفْعَلة» من «جَسَّ»، اسم لموضع الجسّ."
  - "«رَابِي» اسم فاعل من «رَبَا يَرْبُو» إذا ارتفع، ومنه الرَّبْوة."
  - "«مُقَرْمَد» اسم مفعول من الفعل الرباعي «قَرْمَدَ»."
rhetoric:
  thesis: "هذا البيت وتاليه هما ما سمّاه أبو عَمْرو الشَّيْبانيّ «إفحاش» النابغة: يرويهما وحدهما بعد المطلع، ثم يجعل غيرة المُنَخَّل منهما سبب هرب الشاعر. فالبيت عند الرواة ليس وصفًا فحسب، بل ذنب يُطلب صاحبه."
  devices:
    - title: "الاستعارة"
      text: "في «طَعَنْتَ» استعار الطعن، وهو فعل الفارس بالرمح، للإيلاج، فجعل الجماع طعنًا والعضو رمحًا. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "لفظ من البناء"
      text: "«مُقَرْمَدِ» كلمة من صنعة البناء: القِرْمِد الجصّ، والمقرمد ما طُلي به، «كما يُطلَى الحوض والبناء بالقرمد» كما يقول الأَعْلَم [@diwan-nabigha، ص97]. فاستعار لطيب الجسد كلمة من طلاء الحيطان والأحواض، والعبير فيه مكان الجصّ. وفي اللسان قول آخر في الكلمة: «إنه الضيق» [@lisan، ج3 ص352]، فتكون صفة للضيق لا للطيب."
    - title: "الكناية عن الموصوف"
      text: "لم يسمّ الفرج في الأبيات الثلاثة، بل كنى عنه بصفاته: «مُسْتَهْدِفٍ»، «رَابِي الْمَجَسَّةِ»، «مُقَرْمَدِ». والكناية عند عبد القاهر الجُرْجانيّ ألا يُذكر المعنى «باللفظ الموضوع له في اللغة» [@dalail، ص66]."
  connection: "ثم يتمّ الصورة بالنزع: «وإذا نزعت نزعت عن مستحصف»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِذَا طَعَنْ / تَ طَعَنْتَ فِي / مُسْتَهْدِفِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — رَابِلْ مَجَسْ / سَةِ بِلْعَبِي / رِ مُقَرْمَدِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلةَ الثالثة من الصدر والأولى من العجز، فصارت «متَفاعلن» «مُتْفاعلن»."
context: "يروي أبو الفَرَج بإسناده إلى أبي عَمْرو الشَّيْبانيّ أن النعمان أمر النابغة بوصف المُتَجَرِّدة: «فأما النابغة فإن النعمان أمره بوصفها فقال قصيدته التي أولها»، وأنشد المطلع، ثم قال: «ووصفها فأفحش فقال»، وأنشد هذا البيت وتاليه، ثم: «فغار المنخّل من ذلك، وقال: هذه صفة مُعاين، فهمّ النعمان بقتل النابغة حتى هرب منه» [@aghani-dk، ج21 ص2]. والمعاين: الذي رأى بعينه. وفي حاشية محققي «الأغاني»: «مقرمد: مطلي» [@aghani-dk، ج21 ص2، الحاشية]. وعند ابن قُتَيْبة الخبر نفسه، والأبيات فيه ثلاثة (30–32) [@ibn-qutayba، ج1 ص164–165]."
variants:
  - reading: "وَإِذَا طَعَنْتَ طَعَنْتَ فِي مُسْتَهْدِفٍ / رَابِي الْمَجَسَّةِ بِالْعَبِيرِ مُقَرْمَدِ"
    status: "رواية أبي عَمْرو الشَّيْبانيّ في «الأغاني»"
    note: "بلفظ الأَعْلَم، لكنه يرويه مع تاليه وحدهما بعد المطلع، ويجعلهما ما «أفحش» فيه النابغة [@aghani-dk، ج21 ص2]. وهو كذلك عند ابن قُتَيْبة بعد «وإذا لمست» [@ibn-qutayba، ج1 ص164]، وفي اللسان [@lisan، ج9 ص346]."
