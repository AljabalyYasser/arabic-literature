first: "وَإِذَا يَعَضُّ تَشُدُّهُ أَعْضَاؤُهُ"
second: "عَضَّ الْكَبِيرِ مِنَ الرِّجَالِ الْأَدْرَدِ"
vocabulary:
  - term: "يَعَضُّ"
    text: "يقبض ويضمّ، والضمير للموصوف في الأبيات السابقة."
  - term: "الْأَدْرَدِ"
    text: "الذي سقطت أسنانه: «ورجل أدرد: ليس في فمه سن» [@lisan، ج3 ص166]."
