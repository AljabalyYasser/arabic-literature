first: "وَإِذَا يَعَضُّ تَشُدُّهُ أَعْضَاؤُهُ"
second: "عَضَّ الْكَبِيرِ مِنَ الرِّجَالِ الْأَدْرَدِ"
meaning: "وإذا قبض فرجُها على الذكر الداخل فيه، شدّته جدرانه وضمّته ضمًّا محكمًا، كما يعضّ الشيخ الكبير الذي سقطت أسنانه: يطبق بلثته إطباقًا قويًّا لا أسنان فيه تجرح. فالعضّ هنا استعارة لانقباض الفرج على الذكر في الجماع، والتشبيه بعضّ الأدرد يجمع الشدة واللين معًا. والأدرد: «وَرَجُلٌ أَدْرَدُ: لَيْسَ فِي فَمِهِ سِنٌّ» [@lisan، ج3 ص166]. ولم يشرح الأَعْلَم هذا البيت، فشرحه هنا قراءتنا."
vocabulary:
  - term: "يَعَضُّ"
    text: "يقبض ويطبق، والفاعل الفرج الموصوف في الأبيات السابقة، شبّه انقباضه بالعضّ."
  - term: "تَشُدُّهُ"
    text: "تضمّه بقوة، والهاء للذكر الذي فُهم من «طعنت» و«نزعت» في البيتين 31–32."
  - term: "أَعْضَاؤُهُ"
    text: "أجزاؤه، أي جدران الفرج وما حوله."
  - term: "الْأَدْرَدِ"
    text: "الذي ذهبت أسنانه: «الدَّرَد: ذَهَابُ الأَسنان، دَرِدَ دَرَداً. وَرَجُلٌ أَدْرَدُ: لَيْسَ فِي فَمِهِ سِنٌّ» [@lisan، ج3 ص166]."
syntax:
  - "«وَإِذَا يَعَضُّ»: «إذا» ظرف لما يستقبل متضمن معنى الشرط، و«يعضّ» فعل الشرط، وفاعله ضمير مستتر يعود على الموصوف المحذوف في الأبيات 30–32، أي الفرج."
  - "«تَشُدُّهُ أَعْضَاؤُهُ»: جملة جواب الشرط، و«أعضاؤه» فاعل «تشدّ» مؤخر، والهاء في «تشدّه» مفعول به، والهاء في «أعضاؤه» للفرج."
  - "«عَضَّ الْكَبِيرِ»: مفعول مطلق مبيّن للنوع، منصوب، والعامل فيه «يعضّ»، والمعنى: يعضّ عضًّا كعضّ الكبير. و«مِنَ الرِّجَالِ» متعلق بمحذوف حال من «الكبير»، و«الْأَدْرَدِ» نعت له مجرور."
morphology:
  - "«يَعَضُّ» مضارع «عَضَّ» المضعف، و«عَضّ» مصدره على «فَعْل»."
  - "«أَعْضَاء» جمع «عُضْو» على «أَفْعال»، ناقص واوي، قُلبت الواو همزة لتطرفها بعد ألف زائدة."
  - "«الْأَدْرَد» صفة مشبهة على «أَفْعَل» من «دَرِدَ» إذا ذهبت أسنانه، ومؤنثه «دَرْداء» [@lisan، ج3 ص166]."
rhetoric:
  thesis: "يضيف إلى الصور الثلاث السابقة، اللمس والطعن والنزع، صورة رابعة من داخل الجماع: انقباض الفرج على الذكر. ويأتي بها من عالم آخر: فم شيخ بلا أسنان."
  devices:
    - title: "الاستعارة في «يَعَضُّ»"
      text: "جعل للفرج فعل الفم، فاستعار العضّ لانقباضه على الذكر. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "التمثيل في «عَضَّ الْكَبِيرِ ... الْأَدْرَدِ»"
      text: "لا يشبّه عضوًا بعضو، بل هيئة بهيئة: إطباق قوي لا جرح فيه. وعبد القاهر الجُرْجانيّ يفرق بين تشبيه يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل»، وآخر يكون فيه «الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، وهذا من الثاني، لأن وجه الشبه لا يُرى بل يُستخرج: الشدة مع اللين."
    - title: "الجناس"
      text: "«يَعَضُّ» و«عَضَّ» من أصل واحد، و«أَعْضَاؤُهُ» تقاربهما في الحروف. والجناس أن تتشابه الكلمتان في اللفظ أو في أصله، وهو هنا يكرر صوت العين والضاد حتى يكاد السامع يسمع العضّ. وهذه قراءتنا."
  connection: "ثم يختم القصيدة بأن من ورد عليها لا يريد غيرها: «لَا وَارِدٌ مِنْهَا يَحُورُ لِمَصْدَرٍ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِذَا يَعَضْ / ضُ تَشُدْدُهُو / أَعْضَاؤُهُو = متَفاعلن / متَفاعلن / مُتْفاعلن — عَضْضَلْ كَبِي / رِ مِنَرْ رِجَا / لِلْأَدْرَدِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثالثة من الصدر، والأولى والثالثة من العجز. وأُشبعت ضمة الهاء في «تشدُّهُ» و«أعضاؤُهُ» فنُطقتا «تشدّهو» و«أعضاؤهو»."
context: "رابع الأبيات الصريحة في آخر القصيدة (30–34)، ولم يروه ابن قُتَيْبة ولا أبو عَمْرو الشَّيْبانيّ في خبر المُتَجَرِّدة، فهما يرويان 30–32 أو 31–32 وحدها [@ibn-qutayba، ج1 ص164] [@aghani-dk، ج21 ص2]. ولم يقف عنده الأَعْلَم بشيء [@diwan-nabigha، ص97]. وفي مقابلة المحقق برواية ابن السِّكِّيت يذكر تحت الرقم 33 روايةَ ابن السِّكِّيت للبيت «لَا وَارِدٌ مِنْهَا»، ويقول تحت الرقم 34: «لم يرد فى رواية ابن السكيت» [@diwan-nabigha، ص247–248]. فكأن البيتين في نسخته على عكس ترتيب المطبوع، ويكون هذا البيت هو الذي لم يروه ابن السِّكِّيت."
