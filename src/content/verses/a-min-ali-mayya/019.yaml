explained: false
first: "نَظَرَتْ إِلَيْكَ بِحَاجَةٍ لَمْ تَقْضِهَا"
second: "نَظَرَ السَّقِيمِ إِلَى وُجُوهِ الْعُوَّدِ"
vocabulary:
  - term: "بِحَاجَةٍ لَمْ تَقْضِهَا"
    text: "قال الأَعْلَم: «يقول: نظرت إليك نظرًا ضعيفًا لا تقدر معه على الكلام، أي نظرت نظر خائف مراقب، وأرادت كلامك – وهو حاجتها – فلم تقدر على ذلك؛ خشية الرقباء» [@diwan-nabigha، ص93–94]."
  - term: "الْعُوَّدِ"
    text: "الذين يعودون المريض. قال الأَعْلَم: «فهي كالسقيم الذي ينظر إلى من يعوده بطرف فاتر ضعيف، ولا يقدر على الكلام» [@diwan-nabigha، ص94]."
