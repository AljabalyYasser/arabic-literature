first: "وَيَكَادُ يَنْزِعُ جِلْدَهُ مِنْ مَلَّةٍ"
second: "فِيهَا لَوَاقِحُ كَالْحَرِيقِ الْمُوقَدِ"
meaning: "ويكاد الذكر حين يدخل فرجها يُسلخ جلده من شدة حرارته، كأنه أُدخل في حفرة فيها جمر، تخرج منها لفحات تحرق كالنار المشتعلة. وليس البيت في متن الأَعْلَم، وإنما ينقله المحقق عن رواية ابن السِّكِّيت بلا شرح [@diwan-nabigha، ص248]. لكن البَغْداديّ أورده في «شَرْح أَبْيات مُغْنِي اللَّبِيب» بين ما اختاره «من أبيات القصيدة في وصف المتجردة» [@baghdadi-mughni، ج4 ص94]، بلفظ «لوافح» بالفاء، وشرحه فقال: «الملة: الحفرة التي فيها النار، ولوافح: من لفحته النار، إذا حرقته. وأثرت فيه، وهذا وصف فرجها بالحرارة»، ثم استشهد بقول مُعاوِيَة بن صَعْصَعَة: «بِذِي وَهَجٍ يُصْطَلَى كَيْنُهُ / يَكَادُ يُمَزِّقُ جِلْدَ الذَّكَرْ»، والكَيْن عنده لحم الفرج من داخل: «والكين: لحم داخله» [@baghdadi-mughni، ج4 ص95]. فبيت مُعاوِيَة يقول المعنى نفسه صريحًا: فرج حارّ يُستدفأ بلحمه الداخل، يكاد يمزّق جلد الذكر. والمَلّة في اللسان: «الرَّماد الحارُّ والجمْر»، ويقال «مَلَّ الشيءَ فِي الجمْر يَمُلُّه مَلًّا» إذا أدخله فيه [@lisan، ج11 ص629]، ومنه خبز المَلّة الذي يُدفن في الرماد الحار حتى ينضج. فالمعنى بلغة اليوم: فرجها شديد الحرارة من الداخل، إذا أدخل الرجل ذكره فيه أحسّ كأنه أدخله في جمر، حتى يكاد جلد ذكره ينسلخ من الحرّ. وهو بيت في الجماع، يكمل الأبيات 31–33: الإدخال، ثم الإخراج من فرج ضيق، ثم انقباض الفرج على الذكر، ثم حرارته."
vocabulary:
  - term: "يَنْزِعُ جِلْدَهُ"
    text: "يسلخ جلده ويقلعه. والهاء للذكر الذي فُهم من «طعنت» و«نزعت» في البيتين 31–32، كما في «تَشُدُّهُ» في البيت 33."
  - term: "مَلَّةٍ"
    text: "قال البَغْداديّ: «الملة: الحفرة التي فيها النار» [@baghdadi-mughni، ج4 ص95]. وفي اللسان: «والمَلَّة: الرَّماد الحارُّ والجمْر» [@lisan، ج11 ص629]. وأراد بها فرجها في حرارته، كما قال البَغْداديّ: «وهذا وصف فرجها بالحرارة» [@baghdadi-mughni، ج4 ص95]."
  - term: "لَوَاقِحُ"
    text: "كذا في المطبوع بالقاف. واللواقح في اللسان الحوامل: «وَقَالَ ابْنُ السِّكِّيتِ: لَوَاقِحُ حَوَامِلُ، وَاحِدَتُهَا لَاقِحٌ» [@lisan، ج2 ص583]، ويقال للعقارب: «أَراد باللَّواقِح العقارب» [@lisan، ج2 ص584]. ولا يناسب المعنيان «كالحريق الموقد». والبيت عند البَغْداديّ «لَوَافِحُ» بالفاء، وفسّرها: «ولوافح: من لفحته النار، إذا حرقته» [@baghdadi-mughni، ج4 ص95]. وفي اللسان: «لَفَحَتْه النارُ والسَّمُومُ بحرِّها أَحرقته» [@lisan، ج2 ص578]. فهي لفحات من الحرّ تحرق ما تصيبه، وبهذا نشرح البيت."
  - term: "كَالْحَرِيقِ"
    text: "كالنار المشتعلة."
  - term: "الْمُوقَدِ"
    text: "الذي أُشعل وأُذكي."
syntax:
  - "«وَيَكَادُ»: الواو عاطفة، و«يكاد» مضارع ناقص من أفعال المقاربة، واسمه ضمير مستتر تقديره «هو» يعود على الذكر، وجملة «ينزع جلده» في محل نصب خبره."
  - "«يَنْزِعُ جِلْدَهُ»: فعل مضارع، وفاعله ضمير مستتر يعود على اسم «يكاد»، و«جلدَه» مفعول به، والمعنى: يكاد ينزع جلده عن نفسه، أي ينسلخ جلده."
  - "«مِنْ مَلَّةٍ»: جار ومجرور متعلق بـ«ينزع»، و«من» للتعليل، أي بسبب ملّة. ويجوز أن يكون فاعل «يكاد» الفرج، وتكون «من» لبيان الجنس: يكاد ينزع جلده وهو من ملّة، أي فرج كأنه جمر. والمعنى في الوجهين واحد: الحرارة تكاد تسلخ الجلد."
  - "«فِيهَا لَوَاقِحُ»: «فيها» جار ومجرور خبر مقدم، و«لواقحُ» مبتدأ مؤخر مرفوع، والجملة في محل جر صفة لـ«ملّة». و«كَالْحَرِيقِ» متعلق بمحذوف صفة لـ«لواقح»، و«الموقدِ» نعت لـ«الحريق» مجرور."
morphology:
  - "«يَكَاد» مضارع «كَادَ»، فعل أجوف من أفعال المقاربة."
  - "«مَلَّة» على «فَعْلة»، من المضعّف «مَلَّ»."
  - "«لَوَاقِح» جمع «لاقِح» على «فَواعِل» [@lisan، ج2 ص583]، و«لَوَافِح» في رواية البَغْداديّ جمع «لافِحة» على الوزن نفسه."
  - "«الْحَرِيق» على «فَعِيل» من «حَرَقَ»، و«الْمُوقَد» اسم مفعول من «أَوْقَدَ» على «أَفْعَلَ»، مثال واوي من «وَقَدَ»."
rhetoric:
  thesis: "بيت في حرارة فرجها، يُضاف إلى صور الجماع في آخر القصيدة. فبعد اللمس والطعن والنزع والعضّ يأتي الحرّ."
  devices:
    - title: "الاستعارة في «مَلَّةٍ»"
      text: "لم يذكر الفرج، بل ذكر المَلّة، وهي عند البَغْداديّ «الحفرة التي فيها النار»، وأراد بها الفرج في حرارته، كما قال: «وهذا وصف فرجها بالحرارة» [@baghdadi-mughni، ج4 ص95]. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وفي معنى المَلّة إدخال الشيء في الجمر [@lisan، ج11 ص629]، وهي عند البَغْداديّ حفرة، فالكلمة تحمل صورة الإدخال نفسه. وهذا الأخير قراءتنا."
    - title: "المبالغة بـ«يَكَادُ»"
      text: "«يَكَادُ يَنْزِعُ جِلْدَهُ»: لم يقل إن الجلد ينسلخ، بل إنه يكاد، فقرّب المبالغة من الممكن. وقال ابن رَشِيق: «وأحسن الإغراق ما نطق فيه الشاعر أو المتكلم بكاد أو ما شاكلها، نحو كأن ولو ولولا» [@ibn-rashiq، ج2 ص64]. والإغراق: مبالغة تبعد عن المعتاد ولا تبلغ المحال."
    - title: "التشبيه في «كَالْحَرِيقِ الْمُوقَدِ»"
      text: "شبّه اللفحات بنار مشتعلة، ووجه الشبه الحرّ والإحراق، وهو يُحسّ ولا يحتاج إلى تأوّل. وعلى «لواقح» بالقاف يضيع وجه الشبه، فالحوامل والعقارب لا تشبه الحريق، وهذا مما يرجّح رواية البَغْداديّ."
  connection: "وهو آخر ما في نصنا من القصيدة، ويُختم به وصف الجماع."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَيَكَادُ يَنْ / زِعُ جِلْدَهُو / مِنْ مَلْلَتِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — فِيهَا لَوَا / قِحُ كَلْحَرِي / قِلْ مُوقَدِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأخيرة من الصدر، والأولى والأخيرة من العجز. وأُشبعت ضمة الهاء في «جلدَهُ» فنُطقت «جلدهو»، وكسرة الدال في القافية فنُطقت «الموقدي»."
context: "هذا البيت ليس في رواية الأَصْمَعِيّ التي شرحها الأَعْلَم، وهي نصنا في سائر القصيدة، بل هو من رواية ابن السِّكِّيت، ينقله محقق الديوان في مقابلته بين الروايتين، لا في المتن. فتحت الرقم 33 يذكر رواية ابن السِّكِّيت للبيت «لَا وَارِدٌ مِنْهَا» (34 عندنا)، وتحت الرقم 34 يقول: «لم يرد فى رواية ابن السكيت»، ثم يذكر تحت الرقم 35 رواية ابن السِّكِّيت، ويطبع هذا البيت [@diwan-nabigha، ص247–248]. ولا يقول المحقق أين موضعه من ترتيب ابن السِّكِّيت، فوضعناه بعد آخر أبيات الأَعْلَم، وأعطيناه الرقم الذي أعطاه المحقق. وأورده البَغْداديّ في «شَرْح أَبْيات مُغْنِي اللَّبِيب» فيما اختاره من أبيات القصيدة في وصف المُتَجَرِّدة، وهو عنده بعد «وَإِذَا نَزَعْتَ نَزَعْتَ مِنْ مُسْتَحْصِفٍ» مباشرة [@baghdadi-mughni، ج4 ص94–95]، لكنه يختار ولا يسوق القصيدة كلها، فلا يُبنى على ترتيبه. ونصّه عندنا بلفظ ابن السِّكِّيت كما طبعه المحقق، وفي المطبوع بعض تشكيله، فأكملناه، إلا أنا نشرحه برواية البَغْداديّ «لوافح». وهو من الأبيات الصريحة التي يقوم عليها خبر المُتَجَرِّدة، والتي قال فيها المُنَخَّل اليَشْكُرِيّ فيما يروي ابن قُتَيْبة: «ما يستطيع أن يقول مثل هذا الشعر إلّا من قد جرّب!» [@ibn-qutayba، ج1 ص165]."
