    status: "رواية البَغْداديّ في «شَرْح أَبْيات مُغْنِي اللَّبِيب»، وبها نشرح البيت"
    note: "أورده بالفاء وفسّره: «ولوافح: من لفحته النار، إذا حرقته» [@baghdadi-mughni، ج4 ص95]. وفي المطبوع من رواية ابن السِّكِّيت «لواقح» بالقاف [@diwan-nabigha، ص248]، ولا يستقيم بها المعنى، فنراها تصحيفًا، أي خطأً في نقط الحرف."
