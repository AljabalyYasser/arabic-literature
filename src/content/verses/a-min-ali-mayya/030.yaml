first: "وَإِذَا لَمَسْتَ لَمَسْتَ أَجْثَمَ جَاثِمًا"
second: "مُتَحَيِّزًا بِمَكَانِهِ مِلْءَ الْيَدِ"
meaning: "وإذا لمستَ فرجها لمستَ موضعًا عريضًا مرتفعًا، لازمًا مكانه، بارزًا عما حوله، يملأ الكفّ. قال الأَعْلَم: «الأجثم: العريض في ارتفاع. والجاثم: الذي اتسع موضعه وتمكّن، وأصل الجاثم: الرابض اللاصق بالأرض»، وقال في «متحيزًا بمكانه»: «أي قد جاز ما حوله وبرز» [@diwan-nabigha، ص96]. وصرّح صاحب اللسان بموضوع البيت حين أنشده: «وقال النابغة الذبياني وذكر فرج المرأة» [@lisan، ج4 ص224]. فالمعنى بلغة اليوم: فرجها ممتلئ مكتنز بارز عما حوله، إذا وضعت يدك عليه ملأها."
vocabulary:
  - term: "لَمَسْتَ"
    text: "مسستَ باليد، والخطاب لمخاطَب غير معيَّن."
  - term: "أَجْثَمَ"
    text: "«العريض في ارتفاع» [@diwan-nabigha، ص96]."
  - term: "جَاثِمًا"
    text: "«الذي اتسع موضعه وتمكّن، وأصل الجاثم: الرابض اللاصق بالأرض» [@diwan-nabigha، ص96]. وفي اللسان: «الليث: الجاثم اللازم مكانه لا يبرح» [@lisan، ج12 ص83]."
  - term: "مُتَحَيِّزًا بِمَكَانِهِ"
    text: "«أي قد جاز ما حوله وبرز» [@diwan-nabigha، ص96]."
  - term: "مِلْءَ الْيَدِ"
    text: "ما يملأ الكفّ."
syntax:
  - "«وَإِذَا لَمَسْتَ»: «إذا» ظرف شرطي، و«لَمَسْتَ» فعل الشرط، والتاء للمخاطب، و«لَمَسْتَ أَجْثَمَ» جواب الشرط بلفظ فعله."
  - "«أَجْثَمَ»: مفعول به لصفة محذوف موصوفها، أي موضعًا أجثم، ممنوع من الصرف لأنه صفة على «أَفْعَل»."
  - "«جَاثِمًا»: نعت لـ«أجثم»، و«مُتَحَيِّزًا» نعت ثانٍ، و«بِمَكَانِهِ» متعلق به، و«مِلْءَ الْيَدِ» نعت ثالث، ويجوز في الثلاثة أن تكون أحوالًا."
morphology:
  - "«أَجْثَم» صفة على «أَفْعَل» من «جَثَمَ»، و«جَاثِم» اسم فاعل منه."
  - "«مُتَحَيِّز» اسم فاعل من «تَحَيَّزَ» على «تَفَيْعَلَ»، من «الحَوْز»، وأصله «تَحَيْوَزَ»، قُلبت الواو ياء وأُدغمت في الياء."
  - "«مِلْء» اسم لما يملأ الشيء."
rhetoric:
  thesis: "أول الأبيات الخمسة التي تُختم بها القصيدة: بعد الوجه والثغر والشعر ينزل إلى الفرج، ويصفه باللمس لا بالنظر. وهذه الأبيات هي التي قصدها ابن قُتَيْبة بقوله إن النابغة ذكر في القصيدة «بطنها وعكنها ... ومتنها وروادفها وفرجها» [@ibn-qutayba، ج1 ص164]، وبها ردّ شوقي ضَيْف القصيدة كلها."
  devices:
    - title: "الجواب بلفظ الشرط"
      text: "«إِذَا لَمَسْتَ لَمَسْتَ»: جاء الجواب بلفظ الشرط، فلا تقع الفائدة في الفعل بل في مفعوله وصفاته: «أَجْثَمَ جَاثِمًا ... مِلْءَ الْيَدِ». ويتكرر البناء نفسه في البيتين التاليين: «وإذا طعنت طعنت»، «وإذا نزعت نزعت»، فتصير الأبيات الثلاثة سلسلة واحدة: لمس، ثم طعن، ثم نزع. وهذه قراءتنا."
    - title: "الخطاب لغير معيَّن"
      text: "قال «لَمَسْتَ» بتاء المخاطب، ولم يقل «لمستُ»، فجعل السامع هو اللامس. وعلى هذا الخطاب يقوم الخبر الذي يرويه ابن قُتَيْبة، فقد قال المُنَخَّل اليَشْكُرِيّ للنعمان: «ما يستطيع أن يقول مثل هذا الشعر إلّا من قد جرّب!» [@ibn-qutayba، ج1 ص165]."
    - title: "الكناية عن الموصوف"
      text: "لم يسمّ العضو، بل ذكر صفاته وحدها: «أَجْثَمَ جَاثِمًا مُتَحَيِّزًا ... مِلْءَ الْيَدِ»، فدلّت الصفات على موصوفها. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الاستعارة في «جَاثِمًا»"
      text: "أصل الجاثم، كما يقول الأَعْلَم، «الرابض اللاصق بالأرض» [@diwan-nabigha، ص96]، وهو وصف الطائر والحيوان إذا لزم موضعه. فاستعاره لعضو ثابت في مكانه لا يتحرك."
  connection: "ثم ينتقل من اللمس إلى ما بعده: «وإذا طعنت طعنت في مستهدف»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِذَا لَمَسْ / تَ لَمَسْتَ أَجْ / ثَمَ جَاثِمَنْ = متَفاعلن / متَفاعلن / متَفاعلن — مُتَحَيْيِزَنْ / بِمَكَانِهِي / مِلْءَلْ يَدِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "جاءت تفعيلات الصدر تامة، ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلةَ الأخيرة من العجز فصارت «مُتْفاعلن». وأُشبعت كسرة الهاء في «بمكانهِ» فنُطقت «بمكانهي»."
context: "تُختم القصيدة في رواية الأَصْمَعِيّ التي شرحها الأَعْلَم بخمسة أبيات (30–34) في فرج المُتَجَرِّدة وفي الجماع، بعد صفة شعرها في البيت 29. ويروي ابن قُتَيْبة هذا البيت والبيتين بعده في خبره: أن النعمان سأل النابغة أن يصف امرأته المُتَجَرِّدة، فقال القصيدة، «وقد ذكر فيها بطنها وعكنها ... ومتنها وروادفها وفرجها»، والعُكَن طيّات البطن من السِّمَن، ثم قال المُنَخَّل ما قال، فخافه النابغة وهرب إلى غَسّان [@ibn-qutayba، ج1 ص164–165]. ويرى شوقي ضَيْف أن الرواة «جعلوه يتغزل بزوجه هذا الغزل الماجن الذي يندى له الجبين» ليفسّروا به غضب النعمان، فيردّ القصيدة كلها [@deif، ج1 ص277]."
variants:
  - reading: "وَإِذَا لَمَسْتَ لَمَسْتَ أَخْثَمَ جَاثِمًا"
    status: "رواية ابن قُتَيْبة، وهي في اللسان"
    note: "بالخاء [@ibn-qutayba، ج1 ص164]. وفي اللسان: «والأخثم: الجهاز المرتفع الغليظ»، ثم أنشد البيت [@lisan، ج12 ص165]. ويقول محقق الديوان إن الروايتين «وردتا في اللسان، وهما بمعنى واحد» [@diwan-nabigha، ص96، الحاشية]."
  - reading: "مُتَحَيِّرًا بِمَكَانِهِ مِلْءَ الْيَدِ"
    status: "رواية اللسان"
    note: "بالراء [@lisan، ج12 ص83] [@lisan، ج4 ص224]، أي ثابتًا لا يبرح. ونقل صاحب اللسان عن شَمِر: «والعرب تقول لكل شيء ثابت دائم لا يكاد ينقطع: مستحير ومتحير» [@lisan، ج4 ص224]."
