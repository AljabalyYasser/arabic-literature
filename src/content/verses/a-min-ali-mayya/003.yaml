explained: false
first: "زَعَمَ الْغُرَابُ بِأَنَّ رِحْلَتَنَا غَدًا"
second: "وَبِذَاكَ خَبَّرَنَا الْغُدَافُ الْأَسْوَدُ"
vocabulary:
  - term: "زَعَمَ الْغُرَابُ"
    text: "«يعني أن الغراب نعب فأنذر بالرحيل، وكانوا يتطيّرون به، ويسمّونه حاتمًا؛ لأنه يحتم عندهم بالفراق» [@diwan-nabigha، ص89]."
  - term: "رِحْلَتَنَا"
    text: "«والرِّحلة: الارتحال» [@diwan-nabigha، ص89]."
  - term: "الْغُدَافُ"
    text: "الغراب، والغُداف عند الأَعْلَم «السابغ الريش» [@diwan-nabigha، ص89]، أي الوافر الريش."
sources:
