first: "زَعَمَ الْهُمَامُ بِأَنَّ فَاهَا بَارِدٌ"
second: "عَذْبٌ مُقَبَّلُهُ شَهِيُّ الْمَوْرِدِ"
meaning: "قال الملك إن فمها بارد عذب حين يُقبَّل، وإن ريقه شهيّ لمن يرده كما يُورد الماء. قال الأَعْلَم: «وقوله: «زعم الهمام»، يعني النعمان بن المنذر؛ لأنه كان يصف امرأته المتجردة. والهمام: السيد، سمّي بذلك لأنه إذا همّ بأمر أمضاه، ويقال: سمي به لبعد همته» [@diwan-nabigha، ص95]. فالمعنى بلغة اليوم: يقول النابغة إن النُّعْمان نفسه، زوجها، هو الذي يحدّث أن تقبيل فمها لذيذ: فمها بارد عذب الطعم حين يلثمه ويمصّ ريقها، يشتهيه كما يشتهي العطشان الماء. فالشاعر لا يدّعي أنه قبّلها، بل ينقل وصف قبلتها عن زوجها، وبهذا يصف ما لا يجوز له أن يعرفه من غير أن يقول إنه عرفه. وهذا البيان قراءتنا."
vocabulary:
  - term: "زَعَمَ"
    text: "قال وحدّث. ويذكر صاحب اللسان عن اللَّيْث أن «زعم» يقال فيما يُشك فيه: «وإِذا شُكَّ فِيهِ فَلَمْ يُدْرَ لَعَلَّهُ كَذِبٌ أَو بَاطِلٌ قِيلَ زَعَمَ فُلَانٌ» [@lisan، ج12 ص264]."
  - term: "الْهُمَامُ"
    text: "الملك السيد، و«يعني النعمان بن المنذر؛ لأنه كان يصف امرأته المتجردة» [@diwan-nabigha، ص95]."
  - term: "فَاهَا"
    text: "فمها."
  - term: "مُقَبَّلُهُ"
    text: "موضع تقبيله، أي الشفتان والفم حين يُلثمان."
  - term: "شَهِيُّ الْمَوْرِدِ"
    text: "لذيذ الموضع الذي يُشرب منه. والمَوْرِد في الأصل الماء الذي يُورد للشرب، وأراد به فمها وريقها."
syntax:
  - "«زَعَمَ الْهُمَامُ»: فعل وفاعل."
  - "«بِأَنَّ فَاهَا بَارِدٌ»: «فاها» اسم «أنّ» منصوب بالألف لأنه من الأسماء الخمسة، و«باردٌ» خبرها، و«عَذْبٌ» خبر ثانٍ. وفي الباء قولان ذكرهما صاحب اللسان وهو ينشد هذا الصدر: «فَقَدْ تَكُونُ الْبَاءُ زَائِدَةً ... وَقَدْ تَكُونُ زَعَمَ هَاهُنَا فِي مَعْنَى شَهِدَ فَعَدَّاهَا بِمَا تُعدّى بِهِ شَهِدَ» [@lisan، ج12 ص264]، أي: شهد الهمام بأن فاها بارد."
  - "«عَذْبٌ مُقَبَّلُهُ»: «مُقَبَّلُه» فاعل للصفة المشبهة «عذبٌ»، كأنه قال: عذُب مقبَّلُه."
  - "«شَهِيُّ الْمَوْرِدِ»: خبر ثالث لـ«أنّ»، وهو مضاف و«المورد» مضاف إليه، والإضافة لفظية، والمعنى: شهيٌّ موردُه."
morphology:
  - "«الْهُمَام» على «فُعال»، من «هَمَّ بالأمر»، وفسّره الأَعْلَم بأنه الذي «إذا همّ بأمر أمضاه» [@diwan-nabigha، ص95]."
  - "«مُقَبَّل» اسم مفعول من «قَبَّلَ» على «فَعَّلَ»، يراد به هنا موضع التقبيل."
  - "«الْمَوْرِد» على «مَفْعِل»، اسم مكان من «وَرَدَ يَرِدُ»، مثال واوي."
  - "«فَا» من الأسماء الخمسة، يُنصب بالألف: «فاها»."
rhetoric:
  thesis: "أول ثلاثة أبيات تبدأ كلها بـ«زَعَمَ الْهُمَامُ» (22–24): الشاعر ينتقل من وصف ما يُرى من فمها إلى ما لا يعرفه إلا من قبّلها، فيحمّل الملك نفسه هذا الوصف."
  devices:
    - title: "إسناد الخبر إلى غير الشاعر"
      text: "«زَعَمَ الْهُمَامُ»: جعل الوصف قولًا للنعمان، فلم يقل «فمها بارد» بل «زعم الملك أن فمها بارد». والفعل «زعم» مما يقال، كما ينقل صاحب اللسان، فيما لا يُدرى أصدق هو أم كذب [@lisan، ج12 ص264]، فالشاعر يروي ولا يشهد. لكنه بهذا يجعل الملك يصف قبلة امرأته أمام الناس. وهذه قراءتنا."
    - title: "الاستعارة في «شَهِيُّ الْمَوْرِدِ»"
      text: "جعل فمها موردًا، أي ماءً يُقصد للشرب، والقبلة شربًا منه. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وهذه الصورة تمتد إلى «الْعَطِشُ الصَّدِي» في البيت 24، ثم تعود في آخر القصيدة: «لَا وَارِدٌ مِنْهَا يَحُورُ لِمَصْدَرٍ» (34)."
    - title: "تتابع الأخبار"
      text: "«بَارِدٌ / عَذْبٌ / شَهِيُّ الْمَوْرِدِ»: ثلاث صفات للفم بلا عطف، كل واحدة تزيد على التي قبلها: البرودة في اللمس، ثم العذوبة في الطعم، ثم الشهوة في النفس. وهذه قراءتنا."
  connection: "ثم يكرر «زَعَمَ الْهُمَامُ» ويضيف «وَلَمْ أَذُقْهُ»: «زَعَمَ الْهُمَامُ وَلَمْ أَذُقْهُ أَنَّهُ / عَذْبٌ إِذَا مَا ذُقْتَهُ قُلْتَ ازْدَدِ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "زَعَمَلْ هُمَا / مُ بِأَنْنَ فَا / هَا بَارِدُنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — عَذْبُنْ مُقَبْ / بَلُهُو شَهِيْ / يُلْمَوْرِدِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأخيرة من الصدر، والأولى والأخيرة من العجز. وأُشبعت ضمة الهاء في «مقبّلُهُ» فنُطقت «مقبّلهو»، وكسرة الدال في القافية فنُطقت «الموردي»."
context: "أول ثلاثة أبيات (22–24) يحكي فيها الشاعر عن النعمان صفة فم امرأته وريقها، بعد صفة أسنانها (20–21). والهمام عند الأَعْلَم هو النعمان، والمرأة امرأته المُتَجَرِّدة [@diwan-nabigha، ص95]. وهذه الأبيات الثلاثة في رواية ابن السِّكِّيت بيتان، يقول المحقق: «موضع هذه الأبيات الثلاثة فى ابن السكيت»، ثم يذكر البيتين [@diwan-nabigha، ص247]. وأنشد صاحب اللسان صدر هذا البيت في «زعم» [@lisan، ج12 ص264]."
variants:
  - reading: "زَعَمَ الْهُمَامُ بِأَنَّ فَاهَا بَارِدٌ / عَذْبٌ إِذَا مَا ذُقْتَهُ قُلْتَ ازْدَدِ"
    status: "رواية ابن السِّكِّيت، كما ينقلها المحقق"
    note: "صدر هذا البيت مع عجز البيت 23، وبها يكون البيت الأول من البيتين اللذين يرويهما ابن السِّكِّيت مكان الأبيات 22–24 [@diwan-nabigha، ص247]."
