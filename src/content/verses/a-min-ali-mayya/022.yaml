first: "زَعَمَ الْهُمَامُ بِأَنَّ فَاهَا بَارِدٌ"
second: "عَذْبٌ مُقَبَّلُهُ شَهِيُّ الْمَوْرِدِ"
vocabulary:
  - term: "الْهُمَامُ"
    text: "«يعني النعمان بن المنذر؛ لأنه كان يصف امرأته المتجردة. والهمام: السيد، سمّي بذلك لأنه إذا همّ بأمرٍ أمضاه» [@diwan-nabigha، ص95]."
  - term: "الْمَوْرِدِ"
    text: "موضع الورود، والمراد الفم."
sources:
