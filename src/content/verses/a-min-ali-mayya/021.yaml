first: "كَالْأُقْحُوَانِ غَدَاةَ غِبِّ سَمَائِهِ"
second: "جَفَّتْ أَعَالِيهِ وَأَسْفَلُهُ نَدِي"
meaning: "أسنانها كزهر الأقحوان صباح اليوم الذي يلي ليلة مطر: جفّت أعاليه فاشتد بياضه، وبقي أسفله نديًّا. قال الأَعْلَم: «الأقحوان: نبت له نوْر أبيض وسطه أصفر؛ فشبّه الأسنان ببياض ورقه. وقوله: «غداة غبّ سمائه». السماء: المطر. وغِبّ الشيء: بعده. وقوله: «جفّت أعاليه»، أي مُطر ليلًا فنحّى المطرُ ما عليه من الغبار، وصفا لونه، ثم جفّ الماء من أعلاه؛ فاشتدّ بياضه وحسن، وارتوى أصله من ذلك المطر» [@diwan-nabigha، ص95]. فالمعنى بلغة اليوم: أسنانها نظيفة لامعة شديدة البياض كبتلات الأقحوان التي غسلها المطر، وأصولها رطبة بالريق. وهذا الندى في أسفل الأسنان هو الذي يمهّد للأبيات التالية في ريقها وتقبيلها، فالشاعر ينتقل من بياض الأسنان إلى رطوبة الفم. وهذا الربط قراءتنا."
vocabulary:
  - term: "كَالْأُقْحُوَانِ"
    text: "«نبت له نوْر أبيض وسطه أصفر؛ فشبّه الأسنان ببياض ورقه» [@diwan-nabigha، ص95]. والنَّوْر: الزهر."
  - term: "غِبِّ سَمَائِهِ"
    text: "بعد مطره: «السماء: المطر. وغِبّ الشيء: بعده» [@diwan-nabigha، ص95]."
  - term: "جَفَّتْ أَعَالِيهِ"
    text: "يبس الماء عن أطراف بتلاته، «فاشتدّ بياضه وحسن» [@diwan-nabigha، ص95]."
  - term: "نَدِي"
    text: "رطب مبتلّ، وهو «نَدٍ» أُثبتت ياؤه للقافية. قال الأَعْلَم: «وارتوى أصله من ذلك المطر» [@diwan-nabigha، ص95]."
syntax:
  - "«كَالْأُقْحُوَانِ»: الكاف حرف جر للتشبيه، والجار والمجرور متعلق بمحذوف صفة لـ«بَرَدًا» في البيت السابق، فالمعنى متصل: تجلو بَرَدًا كالأقحوان."
  - "«غَدَاةَ غِبِّ سَمَائِهِ»: «غداةَ» ظرف زمان منصوب متعلق بمحذوف حال من «الأقحوان»، وهو مضاف و«غِبِّ» مضاف إليه، وهو مضاف و«سمائه» مضاف إليه."
  - "«جَفَّتْ أَعَالِيهِ»: فعل وفاعل، والجملة في محل نصب حال من «الأقحوان»، وأُنّث الفعل لأن الفاعل جمع تكسير."
  - "«وَأَسْفَلُهُ نَدِي»: الواو حالية، و«أسفلُه» مبتدأ، و«نَدِي» خبره مرفوع بضمة مقدرة على الياء، وأصله «نَدٍ»، والجملة حال ثانية."
morphology:
  - "«أُقْحُوَان» على «أُفْعُلان»، وجمعه أقاحٍ."
  - "«أَعَالِي» جمع «أَعْلَى» على «أَفاعِل»، و«أَسْفَل» اسم تفضيل على «أَفْعَل» استُعمل اسمًا لجهة السفل."
  - "«نَدٍ» صفة مشبهة على «فَعِل» من «نَدِيَ يَنْدَى»، منقوص."
  - "«سَمَاء» أصلها «سَماو»، قُلبت الواو همزة لتطرفها بعد ألف زائدة."
rhetoric:
  thesis: "يكمل صورة الأسنان التي بدأها بالبَرَد في البيت السابق، ويزيد عليها صورة الأقحوان المغسول بالمطر، فيجمع البياض والصفاء والرطوبة."
  devices:
    - title: "التمثيل"
      text: "لا يشبّه الأسنان بالأقحوان مطلقًا، بل بأقحوان في حال مخصوصة: صباح ما بعد المطر، أعلاه جافّ أبيض وأسفله ندٍ. فالشبه منتزع من هيئة كاملة، وهذا هو التمثيل الذي يكون عند عبد القاهر الجُرْجانيّ «الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، لأن السامع يحتاج إلى أن يركّب الصورة ليفهم وجه الشبه: بياض في الأعلى، ورطوبة في الأصل."
    - title: "المجاز في «سَمَائِهِ»"
      text: "أراد بالسماء المطر، كما قال الأَعْلَم: «السماء: المطر» [@diwan-nabigha، ص95]. فسمّى المطر باسم الموضع الذي ينزل منه، وهذا مجاز علاقته المكان."
    - title: "الطباق في «جَفَّتْ ... نَدِي» و«أَعَالِيهِ ... أَسْفَلُهُ»"
      text: "قابل بين الجفاف والندى، وبين الأعلى والأسفل، في عجز واحد. والطباق الجمع بين الشيء وضده."
  connection: "ثم يأتي إلى الفم والقبلة على لسان الملك: «زَعَمَ الْهُمَامُ بِأَنَّ فَاهَا بَارِدٌ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَلْأُقْحُوَا / نِ غَدَاةَ غِبْ / بِ سَمَائِهِي = مُتْفاعلن / متَفاعلن / متَفاعلن — جَفْفَتْ أَعَا / لِيهِي وَأَسْ / فَلُهُو نَدِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأوليين من العجز. وأُشبعت كسرة الهاء في «سمائهِ» و«أعاليهِ» فنُطقتا «سمائهي» و«أعاليهي»، وضمة الهاء في «أسفلُهُ» فنُطقت «أسفلهو»."
context: "ثاني أبيات الثغر (20–21)، وهو متصل بالذي قبله في الإعراب والمعنى: الأسنان بَرَد في البيت 20، وأقحوان في هذا البيت. وبعده تبدأ الأبيات الثلاثة التي ينسب فيها الشاعر وصف ريقها وتقبيلها إلى النُّعْمان (22–24)."
