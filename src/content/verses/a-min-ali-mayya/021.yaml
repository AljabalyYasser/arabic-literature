explained: false
first: "كَالْأُقْحُوَانِ غَدَاةَ غِبِّ سَمَائِهِ"
second: "جَفَّتْ أَعَالِيهِ وَأَسْفَلُهُ نَدِي"
vocabulary:
  - term: "كَالْأُقْحُوَانِ"
    text: "«الأقحوان: نبت له نَوْر أبيض وسطه أصفر؛ فشبّه الأسنان ببياض ورقه» [@diwan-nabigha، ص95]."
  - term: "غِبِّ سَمَائِهِ"
    text: "«السماء: المطر. وغِبّ الشيء: بعده» [@diwan-nabigha، ص95]."
  - term: "جَفَّتْ أَعَالِيهِ"
    text: "«أي مُطر ليلًا فنحّى المطرُ ما عليه من الغبار، وصفا لونه، ثم جفّ الماء من أعلاه؛ فاشتدّ بياضه وحسن، وارتوى أصله من ذلك المطر» [@diwan-nabigha، ص95]."
sources:
