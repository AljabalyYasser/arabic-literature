explained: false
first: "بِمُخَضَّبٍ رَخْصٍ كَأَنَّ بَنَانَهُ"
second: "عَنَمٌ يَكَادُ مِنَ اللَّطَافَةِ يُعْقَدُ"
vocabulary:
  - term: "بِمُخَضَّبٍ رَخْصٍ"
    text: "«أي اتّقتنا بمعصمٍ مخضّب أو بعضو مخضّب، يعني كفّها» [@diwan-nabigha، ص93]. والرَّخْص: الليّن الناعم."
  - term: "بَنَانَهُ"
    text: "«والبنان: الأصابع المخضوبة» [@diwan-nabigha، ص93]."
  - term: "عَنَمٌ"
    text: "«شجر أحمر الثمر ينبت في جوف السَّمُر، أشبه شيء بالأصابع المخضوبة» [@diwan-nabigha، ص93]."
  - term: "يَكَادُ مِنَ اللَّطَافَةِ يُعْقَدُ"
    text: "«أي هو من لينه ونَعمته وسباطته لو شئت أن تعقده لعقدته» [@diwan-nabigha، ص93]."
sources:
