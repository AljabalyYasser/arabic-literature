explained: false
first: "لَرَنَا لِرُؤْيَتِهَا وَحُسْنِ حَدِيثِهَا"
second: "وَلَخَالَهُ رَشَدًا وَإِنْ لَمْ يَرْشُدِ"
vocabulary:
  - term: "لَرَنَا"
    text: "«ورَنا إِلَيْهَا يَرْنُو رُنُوّاً ورَناً، مَقْصُورٌ، إِذَا نظرَ إليْها مُداوَمة» [@lisan، ج14 ص340]. وقال الأَعْلَم: «أي لو عرضت لهذا الراهب الأشيب الذي لا يعرف النساء لأدام النظر إليها، ولأعرض عمّا هو فيه من عبادته» [@diwan-nabigha، ص96]."
  - term: "وَلَخَالَهُ رَشَدًا"
    text: "«ولظنّ ذلك رشدًا، ولم ير فيه حرجًا وإن لم يكن فيه رشد» [@diwan-nabigha، ص96]."
