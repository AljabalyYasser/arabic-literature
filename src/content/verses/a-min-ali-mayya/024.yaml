first: "زَعَمَ الْهُمَامُ وَلَمْ أَذُقْهُ أَنَّهُ"
second: "يُشْفَى بِرَيَّا رِيقِهَا الْعَطِشُ الصَّدِي"
meaning: "قال الملك، وأنا لم أذقه، إن رائحة ريقها الطيبة يُشفى بها العطشان الذي اشتد عطشه. قال الأَعْلَم: «الرّيّا: الرِّيح الطيّبة. والصّدِي: الشديد العطش، وصف ريقها بطيب الرائحة وشدة البرد، حتى لو استنكهها الشديد العطش لذهب عطشه» [@diwan-nabigha، ص95]. واستنكهها: شمّ نَكْهتها، أي رائحة فمها. فالمعنى بلغة اليوم: يقول النُّعْمان إن نَفَس امرأته وريقها طيبا الرائحة باردان، حتى إن الرجل الظامئ لو قرّب فمه من فمها وشمّه لارتوى قبل أن يقبّلها. ويعيد النابغة: «ولم أذقه»، أي لم أقبّلها ولم أذق ريقها. فالبيت يصف القرب من فمها في القبلة، ويبالغ: الرائحة وحدها تكفي العطشان."
vocabulary:
  - term: "بِرَيَّا"
    text: "«الرّيّا: الرِّيح الطيّبة» [@diwan-nabigha، ص95]، أي الرائحة."
  - term: "رِيقِهَا"
    text: "ماء فمها."
  - term: "الْعَطِشُ"
    text: "الظامئ."
  - term: "الصَّدِي"
    text: "«الشديد العطش» [@diwan-nabigha، ص95]. وفي اللسان: «الصَّدَى: شدَّةُ العَطَشِ ... صَدِيَ يَصْدَى صَدىً، فَهُوَ صَدٍ وصادٍ وصَدْيانُ» [@lisan، ج14 ص453]."
syntax:
  - "«زَعَمَ الْهُمَامُ وَلَمْ أَذُقْهُ أَنَّهُ»: كإعراب صدر البيت السابق، والهاء في «أنّه» ضمير الشأن، أي: زعم أن الشأن والحال كذا."
  - "«يُشْفَى»: فعل مضارع مبني للمجهول مرفوع بضمة مقدرة على الألف، و«الْعَطِشُ» نائب فاعل مؤخر، و«الصَّدِي» نعت له مرفوع بضمة مقدرة على الياء، وأصله «الصّدِيُ»، وأُثبتت الياء مع «أل». والجملة في محل رفع خبر «أنّ»."
  - "«بِرَيَّا رِيقِهَا»: جار ومجرور متعلق بـ«يُشفى»، و«ريّا» مجرور بكسرة مقدرة على الألف، وهو مضاف و«ريقِها» مضاف إليه."
morphology:
  - "«يُشْفَى» مضارع «شُفِيَ» المبني للمجهول من «شَفَى يَشْفِي»، ناقص يائي."
  - "«رَيَّا» على «فَعْلَى»، أصلها «رَوْيا»، اجتمعت الواو والياء وسُبقت الأولى بالسكون، فقُلبت الواو ياء وأُدغمت."
  - "«عَطِش» و«صَدٍ» صفتان مشبهتان على «فَعِل»، والثاني منقوص من «صَدِيَ يَصْدَى» [@lisan، ج14 ص453]."
rhetoric:
  thesis: "ثالث «زَعَمَ الْهُمَامُ» وآخرها: من البرودة والعذوبة إلى الرائحة. فالأبيات الثلاثة تصف القبلة بالحواس كلها: اللمس والطعم والشم."
  devices:
    - title: "المبالغة"
      text: "«يُشْفَى بِرَيَّا رِيقِهَا الْعَطِشُ الصَّدِي»: لا يُشفى العطشان بالشرب من ريقها، بل برائحته وحدها. والأَعْلَم يقرأه كذلك: «حتى لو استنكهها الشديد العطش لذهب عطشه» [@diwan-nabigha، ص95]."
    - title: "تكرار «زَعَمَ الْهُمَامُ وَلَمْ أَذُقْهُ»"
      text: "أعاد الصدر كله تقريبًا كما في البيت السابق، فثبّت النفي مرتين: الملك هو الذي ذاق، لا الشاعر. والتكرار في أول ثلاثة أبيات متتالية يجعلها كأنها شهادات تُعدّ واحدة بعد أخرى. وهذه قراءتنا."
    - title: "الاستعارة الممتدة"
      text: "بدأت في البيت 22 بـ«شَهِيُّ الْمَوْرِدِ»، فجعل فمها ماءً يُورد، ثم جعل من يقبّلها «العطش الصدي» يُشفى بها. فصورة الماء والعطش تجمع الأبيات الثلاثة. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
  connection: "ثم يعود إلى الحلي واللؤلؤ: «أَخَذَ الْعَذَارَى عِقْدَهُ فَنَظَمْنَهُ / مِنْ لُؤْلُؤٍ مُتَتَابِعٍ مُتَسَرِّدِ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "زَعَمَلْ هُمَا / مُ وَلَمْ أَذُقْ / هُو أَنْنَهُو = متَفاعلن / متَفاعلن / مُتْفاعلن — يُشْفَى بِرَيْ / يَا رِيقِهَلْ / عَطِشُصْ صَدِي = مُتْفاعلن / مُتْفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأخيرة من الصدر، والأوليين من العجز. وأُشبعت ضمة الهاء في «أذقهُ» و«أنّهُ» فنُطقتا «أذقهو» و«أنّهو»."
context: "آخر الأبيات الثلاثة التي يحكي فيها الشاعر عن النعمان صفة فم امرأته (22–24). وفي رواية ابن السِّكِّيت، كما ينقلها المحقق، صدر هذا البيت هو صدر البيت الثاني من بيتين يرويهما مكان الأبيات الثلاثة، وعجزه فيها بلفظ آخر في ريقها [@diwan-nabigha، ص247]."
