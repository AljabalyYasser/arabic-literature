explained: false
first: "لَوْ أَنَّهَا عَرَضَتْ لِأَشْمَطَ رَاهِبٍ"
second: "عَبَدَ الْإِلَٰهَ صَرُورَةٍ مُتَعَبِّدِ"
vocabulary:
  - term: "لِأَشْمَطَ"
    text: "«الأشمط: الأشيب» [@diwan-nabigha، ص95]."
  - term: "صَرُورَةٍ"
    text: "«والصَّرورة: اللازم لصومعته لا يريد حجًّا ولا غيره؛ وإنما عنى نصارى الشام الذين لا يعرفون الحجّ، وقيل أيضًا: الصرورة ها هنا الذي لا يأتي النساء» [@diwan-nabigha، ص95]."
sources:
