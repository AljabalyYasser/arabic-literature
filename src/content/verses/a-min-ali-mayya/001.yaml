explained: false
first: "أَمِنْ آلِ مَيَّةَ رَائِحٌ أَوْ مُغْتَدِ"
second: "عَجْلَانَ ذَا زَادٍ وَغَيْرَ مُزَوَّدِ"
vocabulary:
  - term: "رَائِحٌ أَوْ مُغْتَدِ"
    text: "يخاطب الشاعر نفسه. قال الأَعْلَم: «يخاطب نفسه يقول: أرائحٌ أنت من آل مية أو مغتدٍ، أي تروح اليوم أم تغتدي غدًا، وليس هذا شكًّا منه، ولكنه كالمستثبت» [@diwan-nabigha، ص89]. والرائح الذي يسير في آخر النهار، والمغتدي الذي يسير في أوله."
  - term: "عَجْلَانَ"
    text: "«من العجلة» [@diwan-nabigha، ص89]، أي مستعجلًا."
  - term: "ذَا زَادٍ وَغَيْرَ مُزَوَّدِ"
    text: "«يريد أتروح زُوِّدت أم لم تُزوَّد، وأراد بالزاد ما كان من تحية وردّ سلام ووداع، ونحو ذلك» [@diwan-nabigha، ص89]."
sources:
