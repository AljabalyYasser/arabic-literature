first: "وَإِذَا نَزَعْتَ نَزَعْتَ عَنْ مُسْتَحْصِفٍ"
second: "نَزْعَ الْحَزَوَّرِ بِالرِّشَاءِ الْمُحْصَدِ"
meaning: "وإذا أخرجتَ ذكرك أخرجته من موضع ضيّق شديد، تحتاج في إخراجه إلى جذب كجذب الغلام القوي الدلوَ من البئر بالحبل المفتول. قال الأَعْلَم: «أصل النَّزْع جذب الدلو من البئر، فضربه مثلًا. والمستحصِف: الشديد الضيِّق، والقليل البَلَل»، ثم: «يقول: هو ضيِّق، فإذا نزعتَ عنه نزعتَ بشدّة، كما ينزع الغلامُ القويّ بالحبل المفتول، وإنما خصّ المحصَد لأنه يأمن انقطاعه، فيشدّ الجذب، ويتقوّى عليه» [@diwan-nabigha، ص97]. وذكر الأَعْلَم تأويلًا آخر: «وقيل: أراد بالحزوّر هنا المترعرع الذي ناهز الحُلُم، وإنما وصف أنه إن أراد نزع ذَكَره ضعُف عن ذلك؛ لضيقه، كما يضعف الحزوّر عن استقاء الماء» [@diwan-nabigha، ص97]."
vocabulary:
  - term: "نَزَعْتَ"
    text: "«أصل النَّزْع جذب الدلو من البئر، فضربه مثلًا» [@diwan-nabigha، ص97]."
  - term: "مُسْتَحْصِفٍ"
    text: "«الشديد الضيِّق، والقليل البَلَل» [@diwan-nabigha، ص97]، وفي اللسان: «وفرج مستحصف أي ضيق» [@lisan، ج9 ص48]."
  - term: "الْحَزَوَّرِ"
    text: "«والحزوّر هنا الغلام القويّ، وفي مكان آخر: المحتلم؛ واشتقاقه من الحَزْوَرة، وهي الأكمة الصغيرة» [@diwan-nabigha، ص97]. وأنشد صاحب اللسان العجز، ونقل عن ابن السِّكِّيت: «أراد البالغ القوي» [@lisan، ج4 ص187]."
  - term: "الرِّشَاءِ"
    text: "الحبل، «وهو الحبل» كما يقول الأَعْلَم [@diwan-nabigha، ص97]."
  - term: "الْمُحْصَدِ"
    text: "«الشديد الفتل» [@diwan-nabigha، ص97]."
syntax:
  - "«وَإِذَا نَزَعْتَ نَزَعْتَ»: شرط وجوابه بلفظ واحد، ثالث الأبيات المبنية على هذا النسق."
  - "«عَنْ مُسْتَحْصِفٍ»: جار ومجرور متعلق بـ«نزعتَ» الثانية، و«مستحصف» صفة لموصوف محذوف."
  - "«نَزْعَ الْحَزَوَّرِ»: مفعول مطلق مبيّن للنوع، منصوب، مضاف إلى «الحزوّر»، والمعنى: نزعًا كنزع الحزوّر."
  - "«بِالرِّشَاءِ»: متعلق بالمصدر «نزع»، و«الْمُحْصَدِ» نعت للرشاء."
morphology:
  - "«مُسْتَحْصِف» اسم فاعل من «اسْتَحْصَفَ» على «اسْتَفْعَلَ»، وفي اللسان: «واستحصف الشيء: استحكم» [@lisan، ج9 ص48]."
  - "«الْحَزَوَّر» على «فَعَوَّل»."
  - "«الْمُحْصَد» اسم مفعول من «أَحْصَدَ» الحبلَ إذا أحكم فتله."
  - "«الرِّشَاء» على «فِعَال»، وجمعه أَرْشِية."
rhetoric:
  thesis: "يختم الأبيات الثلاثة بالنزع، ويضرب له مثلًا من سقي الماء: غلام قوي يجذب الدلو بحبل محكم. فالضيق الذي يمدحه لا يُذكر وحده، بل يُفهم من شدة الجذب."
  devices:
    - title: "التمثيل"
      text: "«نَزْعَ الْحَزَوَّرِ بِالرِّشَاءِ الْمُحْصَدِ» صورة مركبة: غلام، وحبل، ودلو، وبئر، تُشبَّه بها هيئة أخرى. وقد قال الأَعْلَم: «أصل النزع جذب الدلو من البئر، فضربه مثلًا» [@diwan-nabigha، ص97]. وعبد القاهر الجُرْجانيّ يفرق بين تشبيه يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل»، وآخر يكون فيه «الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، والثاني هو ما يسميه التمثيل. وهذا منه: لا شبه في الصورة بين الدلو والجسد، وإنما الشبه في هيئة الجذب وشدته."
    - title: "تعدد التأويل"
      text: "حمل الأَعْلَم الصورة على وجهين متعاكسين: الحزوّر القويّ الذي يشدّ الجذب ولا يخاف انقطاع الحبل، أو الصبيّ الذي «ضعُف عن ذلك؛ لضيقه» [@diwan-nabigha، ص97]. وكلا الوجهين يرجع إلى معنى واحد: الضيق، لكن الأول يجعله مغالبة والثاني عجزًا."
    - title: "النسق في الأبيات الثلاثة"
      text: "«وَإِذَا لَمَسْتَ»، «وَإِذَا طَعَنْتَ»، «وَإِذَا نَزَعْتَ»: ثلاثة أبيات على قالب واحد، الشرط فيها والجواب بلفظ واحد، والأفعال على ترتيبها في الجماع. فالتكرار يجعل الوصف قصة متتابعة، وهذه قراءتنا."
  connection: "ثم يضيف صورة رابعة: «وإذا يعضّ تشدّه أعضاؤه»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَإِذَا نَزَعْ / تَ نَزَعْتَ عَنْ / مُسْتَحْصِفِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — نَزْعَلْ حَزَوْ / وَرِ بِرْرِشَا / ءِلْمُحْصَدِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلةَ الثالثة من الصدر، والأولى والثالثة من العجز."
context: "ثاني البيتين اللذين رواهما أبو عَمْرو الشَّيْبانيّ في خبر «ووصفها فأفحش» [@aghani-dk، ج21 ص2]، وثالث الأبيات عند ابن قُتَيْبة [@ibn-qutayba، ج1 ص164]. وفي حاشية محققي «الأغاني»: «مستحصف: قليل البلولة ضيق» و«المحصد: الحبل الشديد الفتل» [@aghani-dk، ج21 ص2، الحاشية]. وشرح الأَعْلَم يسمّي فيه «ذَكَره» صريحًا، فالبيت أصرح الأبيات الثلاثة، وبه وبسابقه عدّ الرواة النابغة قد «أفحش»."
