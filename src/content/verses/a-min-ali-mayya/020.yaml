explained: false
first: "تَجْلُو بِقَادِمَتَيْ حَمَامَةِ أَيْكَةٍ"
second: "بَرَدًا أُسِفَّ لِثَاتُهُ بِالْإِثْمِدِ"
vocabulary:
  - term: "تَجْلُو"
    text: "تكشف. قال الأَعْلَم: «يقول: إذا تبسّمت كشفت عن أسنان كأنها برد؛ لبياضها وصفائها» [@diwan-nabigha، ص94]."
  - term: "بِقَادِمَتَيْ حَمَامَةِ"
    text: "«والقادمتان: الريشتان اللتان في مقدّمي الجناحين؛ يعني أن في شفتيها لعسًا وحُوّة، وهو سمرة في الشفتين» [@diwan-nabigha، ص94]، فشبّه الشفتين بريشتي الحمامة. وفيه قول آخر: أنه أراد إصبعيها، والأول أصحّ عند الأَعْلَم [@diwan-nabigha، ص94]."
  - term: "أَيْكَةٍ"
    text: "«الأَيْكةَ: الشَّجَرُ الْكَثِيرُ الْمُلْتَفُّ» [@lisan، ج10 ص394]."
  - term: "بَرَدًا"
    text: "حَبّ الغمام، شبّه به الأسنان."
  - term: "أُسِفَّ لِثَاتُهُ بِالْإِثْمِدِ"
    text: "«أي ذُرّ الإثمد على لثاتها، وكان يفعل ذلك أهل الجاهلية» [@diwan-nabigha، ص94]، فتسودّ اللثة ويبدو بياض الأسنان. والإثمد: الكحل."
