first: "تَجْلُو بِقَادِمَتَيْ حَمَامَةِ أَيْكَةٍ"
second: "بَرَدًا أُسِفَّ لِثَاتُهُ بِالْإِثْمِدِ"
meaning: "إذا تبسّمت كشفت بشفتين سمراوين كريشتي الحمامة عن أسنان بيضاء كحبّ البَرَد، لثاتها موشومة بالكحل. قال الأَعْلَم: «وقوله: «تجلو بقادمتي حمامة»، يقول: إذا تبسّمت كشفت عن أسنان كأنها برد؛ لبياضها وصفائها. والقادمتان: الريشتان اللتان في مقدمي الجناحين؛ يعني أن في شفتيها لعسًا وحوّة، وهو سمرة في الشفتين، وهما لطيفتان براقتان؛ فشبههما بالقادمتين لذلك» [@diwan-nabigha، ص94]. وقال في «أسفّ لثاته»: «أي ذُرّ الإثمد على لثاتها، وكان يفعل ذلك أهل الجاهلية يغرزون الشفة بإبرة ثم يذرّون عليها إثمدًا أو نؤورًا، فيبقى سواده؛ فيحسن بياض الثغر» [@diwan-nabigha، ص94]. فالمعنى بلغة اليوم: شفتاها رقيقتان لامعتان مائلتان إلى السمرة، وإذا ابتسمت ظهرت أسنان ناصعة البياض، تزيدها بياضًا لثة سوداء من الوشم. وهذا أول وصف فمها، وهو الفم الذي سيقول في الأبيات التالية إن تقبيله عذب وريقه يشفي العطشان."
vocabulary:
  - term: "تَجْلُو"
    text: "تكشف وتُظهر، والأصل في الجلاء الصقل والكشف. قال الأَعْلَم: «إذا تبسّمت كشفت عن أسنان كأنها برد» [@diwan-nabigha، ص94]."
  - term: "بِقَادِمَتَيْ حَمَامَةِ"
    text: "«والقادمتان: الريشتان اللتان في مقدمي الجناحين»، وأراد الشفتين لما فيهما من لعس وحوّة [@diwan-nabigha، ص94]. واللَّعَس: «لَونُ الشَّفَةِ إِذا كَانَتْ تَضْرِبُ إِلى السَّوَادِ قَلِيلًا، وَذَلِكَ يُسْتَمْلَح» [@lisan، ج6 ص207]."
  - term: "أَيْكَةٍ"
    text: "«الأَيْكةَ: الشَّجَرُ الْكَثِيرُ الْمُلْتَفُّ» [@lisan، ج10 ص394]، وحمامة الأيكة: الحمامة التي تسكن الشجر. قال الأَعْلَم: «وأراد بالحمامة القمريّة» [@diwan-nabigha، ص94]."
  - term: "بَرَدًا"
    text: "حَبّ الغمام، والمراد أسنانها في بياضها وصفائها."
  - term: "أُسِفَّ لِثَاتُهُ بِالْإِثْمِدِ"
    text: "وُشمت لثاته بالكحل: يقال «أَسَفَّ الوَشْمَ بالنَّؤُورِ: حَشاهُ»، والإسفاف «أَن يُغْرَزَ الجلدُ بِإِبْرَةٍ ثُمَّ تُحْشى المَغارِزُ كُحْلًا» [@lisan، ج9 ص153]. واللِّثة: اللحم الذي تنبت فيه الأسنان، والإثمد: حجر الكحل."
syntax:
  - "«تَجْلُو»: فعل مضارع مرفوع بضمة مقدرة على الواو، وفاعله ضمير مستتر يعود على المرأة."
  - "«بِقَادِمَتَيْ حَمَامَةِ»: جار ومجرور متعلق بـ«تجلو»، والباء للاستعانة، و«قادمتَيْ» مجرور بالياء لأنه مثنى، وحُذفت نونه للإضافة، و«حمامةِ» مضاف إليه، و«أيكةٍ» مضاف إليه ثانٍ."
  - "«بَرَدًا»: مفعول به لـ«تجلو»، وجملة «أُسِفَّ لِثَاتُهُ» في محل نصب صفة له، و«لثاتُه» نائب فاعل، و«بالإثمد» متعلق بـ«أُسِفّ»."
morphology:
  - "«تَجْلُو» مضارع «جَلَا يَجْلُو»، ناقص واوي."
  - "«قَادِمَة» اسم فاعل من «قَدَمَ»، صار اسمًا للريشة المتقدمة في الجناح، ومثناها «قادمتان»."
  - "«أُسِفَّ» ماضٍ مبني للمجهول من «أَسَفَّ» على «أَفْعَلَ»، مضعّف."
  - "«لِثَات» جمع «لِثَة»، و«إِثْمِد» على «إِفْعِل»."
rhetoric:
  thesis: "يبدأ وصف الفم بالشفتين والأسنان واللثة، في صورة لونين متقابلين: سمرة الشفة وسواد اللثة، وبياض الأسنان بينهما."
  devices:
    - title: "الاستعارة في «بِقَادِمَتَيْ حَمَامَةِ»"
      text: "لم يذكر الشفتين، بل ذكر ريشتي الحمامة وأراد بهما الشفتين، فهي استعارة: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. ووجه الشبه عند الأَعْلَم السمرة واللطف والبريق، وخصّ القادمتين «لأنهما أشد سوادًا من سائر الريش» [@diwan-nabigha، ص94]."
    - title: "الاستعارة في «بَرَدًا»"
      text: "سمّى الأسنان بَرَدًا، فأتى باسم المشبه به وحده. والبرد أبيض صافٍ بارد، فيحمل الاسم معه البرودة التي سيذكرها في البيت 22: «فَاهَا بَارِدٌ». وهذه قراءتنا."
    - title: "الطباق في اللون"
      text: "جمع الأسود والأبيض: سمرة الشفتين وسواد اللثة الموشومة، وبياض الأسنان. والطباق الجمع بين الشيء وضده. وقد ذكر الأَعْلَم الغاية من الوشم: «فيبقى سواده؛ فيحسن بياض الثغر» [@diwan-nabigha، ص94]، فالسواد هنا لإظهار البياض."
  connection: "ثم يشبّه أسنانها بالأقحوان بعد المطر: «كَالْأُقْحُوَانِ غَدَاةَ غِبِّ سَمَائِهِ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "تَجْلُو بِقَا / دِمَتَيْ حَمَا / مَةِ أَيْكَتِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — بَرَدَنْ أُسِفْ / فَ لِثَاتُهُو / بِلْإِثْمِدِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والأخيرة من العجز. وأُشبعت ضمة الهاء في «لثاتُهُ» فنُطقت «لثاتهو»، وكسرة الدال في القافية فنُطقت «بالإثمدي»."
context: "أول أبيات الثغر والريق (20–25)، بعد أن نظرت إليه في البيت 19 «نَظَرَ السَّقِيمِ إِلَى وُجُوهِ الْعُوَّدِ». وفي البيت قول آخر يذكره الأَعْلَم ويردّه: «وقيل: أراد بالقادمتين إصبعيها؛ يعني أنها تجلو أسنانها وتصقلها بالسواد، وشبّههما بالقادمتين لطولهما. والقول الأول أصحّ» [@diwan-nabigha، ص94]، أي إن القادمتين الشفتان. وأنشد صاحب اللسان البيت في الإسفاف بالإثمد [@lisan، ج9 ص153]. ووصف فم امرأة الملك وشفتيها هو مقدمة الأبيات التي يذكر فيها تقبيلها (22–24)."
