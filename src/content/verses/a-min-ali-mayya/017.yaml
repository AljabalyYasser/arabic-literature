explained: false
first: "سَقَطَ النَّصِيفُ وَلَمْ تُرِدْ إِسْقَاطَهُ"
second: "فَتَنَاوَلَتْهُ وَاتَّقَتْنَا بِالْيَدِ"
vocabulary:
  - term: "النَّصِيفُ"
    text: "«نصف خمار أو نصف ثوب يُعتجر به» [@diwan-nabigha، ص93]، أي يُلفّ على الرأس."
  - term: "وَاتَّقَتْنَا بِالْيَدِ"
    text: "سترت وجهها عنا بيدها. وفي رأس القصيدة عند الأَعْلَم أنها فاجأته «فسقط نصيفها عنها، فغطّت وجهها بمعصمها» [@diwan-nabigha، ص89]."
