    text: "يقول محققا «المفضليات»: «الطروق: المجيء ليلا» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "لَمْ يُرَعْ"
    text: "يقول محققا «المفضليات»: «لم يفزع» [@mufaddaliyyat، ص191، الحاشية]."
