explained: false
first: "وَإِذَا مَا حُمِّلُوا لَمْ يَظْلَعُوا"
second: "وَإِذَا حَمَّلْتَ ذَا الشِّفِّ ظَلَعْ"
vocabulary:
  - term: "يَظْلَعُوا"
    text: "يقول محققا «المفضليات»: «الظلع في الإبل بمنزلة الغمز في الخيل، وهما عرج في مشيهما» [@mufaddaliyyat، ص195، الحاشية]."
  - term: "ذَا الشِّفِّ"
    text: "يقول محققا «المفضليات»: «الشف ههنا: الفضل والزيادة» [@mufaddaliyyat، ص195، الحاشية]."
  - term: "وَإِذَا مَا حُمِّلُوا لَمْ يَظْلَعُوا"
    text: "يقول محققا «المفضليات»: «يريد أنهم إذا حملوا أمرا يعجز عنه غيرهم، من حمل دية أو قرى ضيف أو فك أسير، استقلوا به» [@mufaddaliyyat، ص195، الحاشية]."
