explained: false
first: "وَأَتَانِي صَاحِبٌ ذُو غَيِّثٍ"
second: "زَفَيَانٌ عِنْدَ إِنْفَادِ القُرَعْ"
vocabulary:
  - term: "ذُو غَيِّثٍ"
    text: "يقول محققا «المفضليات»: «ذو إجابة، وأصله أن يقال بئر ذات غيث: إذا كانت لها مادة، كلما ذهب ماء جاء ماء آخر» [@mufaddaliyyat، ص201، الحاشية]."
  - term: "زَفَيَانٌ"
    text: "يقول محققا «المفضليات»: «الخفيف السريع» [@mufaddaliyyat، ص201، الحاشية]."
  - term: "إِنْفَادِ"
    text: "يقول محققا «المفضليات»: «من قولهم أنفدت الركية، أي ذهب ماؤها» [@mufaddaliyyat، ص201، الحاشية]."
  - term: "القُرَعْ"
    text: "يقول محققا «المفضليات»: «جمع قرعة، بضم فسكون، وهي المزادة» [@mufaddaliyyat، ص201، الحاشية]."
