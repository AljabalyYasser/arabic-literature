explained: false
first: "كَالمَغَالِي عَارِفَاتٍ لِلسُّرَى"
second: "مُسْنَفَاتٍ لَمْ تُوَشَّمْ بِالنِّسَعْ"
vocabulary:
  - term: "كَالمَغَالِي"
    text: "يقول محققا «المفضليات»: «السهام التي يغلى بها، أي يتباعد بها في الرمي» [@mufaddaliyyat، ص193، الحاشية]."
  - term: "عَارِفَاتٍ"
    text: "يقول محققا «المفضليات»: «الصبورات على السير» [@mufaddaliyyat، ص193، الحاشية]."
  - term: "لِلسُّرَى"
    text: "يقول محققا «المفضليات»: «سير الليل» [@mufaddaliyyat، ص193، الحاشية]."
  - term: "مُسْنَفَاتٍ"
    text: "يقول محققا «المفضليات»: «التي شد عليها السناف، بالكسر، وهو خيط يشد من اللبب إلى الحزام» [@mufaddaliyyat، ص193، الحاشية]."
  - term: "بِالنِّسَعْ"
    text: "يقول محققا «المفضليات»: «جمع نسعة» [@mufaddaliyyat، ص193، الحاشية]."
