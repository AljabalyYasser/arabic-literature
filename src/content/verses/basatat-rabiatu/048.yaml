first: "كَالتُّؤَامِيَّةِ إِنْ بَاشَرْتَهَا"
second: "قَرَّتِ العَيْنُ وَطَابَ المُضْطَجَعْ"
meaning: "هي كالدرّة التُّؤاميّة في بياضها وصفائها ونفاستها، وإذا باشرتها، أي نمت معها فلامست بشرتُك بشرتَها في فراش واحد وجامعتها، سُرّت عينك وطاب الموضع الذي تضطجع فيه معها. فالشطر الأول للجمال الذي يُرى، والثاني للذة التي تُنال بالجسد. وليس في الشرح القديم كلام في الشطر الثاني غير لفظه؛ والمباشرة في اللغة أن يكون الرجل مع المرأة «في ثوب واحد فوليت بشرته بشرتها»، و«معنى المباشرة الجماع» [@lisan، ج4 ص61]."
vocabulary:
  - term: "كَالتُّؤَامِيَّةِ"
    text: "يقول التِّبْرِيزِيّ: «قال الأصمعي: «التؤام»: موضع على البحر يكون عنده غوص، فأراد: درّة، نسبها إلى ذلك الموضع. قال أبو جعفر: نسبها إلى عمان، وعمان ما ولي البحر منها يقال له: تؤام، وما ولي البر يقال له: صحار» [@tabrizi-ikhtiyarat، ج2 ص892]."
  - term: "بَاشَرْتَهَا"
    text: "من البَشَرة، وهي ظاهر الجلد. وفي اللسان: «وباشر الرجل امرأته مباشرة وبشارا: كان معها في ثوب واحد فوليت بشرته بشرتها»، ثم: «معنى المباشرة الجماع» [@lisan، ج4 ص61]. ويقول محقق شرح التِّبْرِيزِيّ: «صرت معها في ثوب واحد. وأصله إلصاق بشرته بشرتها» [@tabrizi-ikhtiyarat، ج2 ص892، الحاشية]."
  - term: "قَرَّتِ العَيْنُ"
    text: "سُرّت ورضيت، فلم تطمح إلى غيرها."
  - term: "المُضْطَجَعْ"
    text: "موضع الاضطجاع، أي الفراش الذي ينامان فيه."
context: "من النسيب الثاني في القصيدة (45–50): خيال سُلَيْمى يؤرّقه، وقد نزل أهله بجانب الحِصن ونزلت هي بالفَرَع، فلا يلقاها إلا في المنام. ثم يصفها بهذا البيت، وبعده رحيلها (49–50). وهو البيت الصريح في القصيدة، من جانب الغزل الجسدي فيها، فشرحناه شرحًا كاملًا."
syntax:
  - "«كَالتُّؤَامِيَّةِ»: جار ومجرور متعلق بمحذوف خبر لمبتدأ محذوف تقديره «هي». و«التؤامية» صفة لموصوف محذوف، أي: كالدرّة التؤامية."
  - "«إِنْ بَاشَرْتَهَا»: «إن» حرف شرط جازم، و«باشرتَ» فعل الشرط في محل جزم، والتاء فاعل، والهاء مفعول به."
  - "«قَرَّتِ العَيْنُ»: جواب الشرط في محل جزم، فعل ماض وفاعله، وكُسرت التاء لالتقاء الساكنين."
  - "«وَطَابَ المُضْطَجَعْ»: معطوفة على الجواب، و«المضطجع» فاعل، وسُكّن للقافية المقيدة."
morphology:
  - "«التُّؤَامِيَّة» منسوبة إلى «تُؤَام» بياء النسب، ولحقتها تاء التأنيث لأنها صفة للدرّة."
  - "«بَاشَرَ» على «فاعَلَ» من البَشَرة، والمفاعلة فيه بين اثنين."
  - "«المُضْطَجَع» اسم مكان من «اضْطَجَعَ» على «افْتَعَلَ»، أصله «اضْتَجَعَ»، قلبت تاء الافتعال طاءً لمجيئها بعد الضاد."
rhetoric:
  thesis: "تشبيه بالدرّة، ثم وصف صريح للذة الوصال."
  devices:
    - title: "حذف الموصوف في «كَالتُّؤَامِيَّةِ»"
      text: "لم يذكر الدرّة، بل ذكر نسبتها وحدها، فعلى السامع أن يعرف أن التؤاميّة درّة من ذلك الساحل، وبهذا يشرحه الأصمعي فيما ينقله التِّبْرِيزِيّ: «فأراد: درّة» [@tabrizi-ikhtiyarat، ج2 ص892]. والحذف عند عبد القاهر الجُرْجانيّ باب «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "الكناية في «إِنْ بَاشَرْتَهَا ... وَطَابَ المُضْطَجَعْ»"
      text: "المعنى المقصود الجماع، ولم يذكره بلفظه، بل ذكر ما يلزمه: الجلد على الجلد، وطيب الفراش. والكناية عند عبد القاهر أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. لكن الكناية هنا قريبة جدًّا، لأن «المباشرة» نفسها تُستعمل للجماع [@lisan، ج4 ص61]."
    - title: "التدرّج من «قَرَّتِ العَيْنُ» إلى «وَطَابَ المُضْطَجَعْ»"
      text: "بدأ بالعين، أي بالنظر والرضا، ثم انتقل إلى الفراش، أي إلى الجسد، فجعل اللذة درجتين. وهذه قراءتنا."
  connection: "ثم يأتي الفراق: «بَكَرَتْ مُزْمِعَةً نِيَّتَهَا / وَحَدَا الحَادِي بِهَا ثُمَّ انْدَفَعْ»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ العين الساكنة"
  scansion: "كَتْتُؤَامِيْ / يَةِ إِنْ بَا / شَرْتَهَا = فاعلاتن / فعِلاتن / فاعلن — قَرْرَتِلْعَيْ / نُوَطَابَلْ / مُضْطَجَعْ = فاعلاتن / فعِلاتن / فاعلن"
  note: "دخل الخَبْن، وهو حذف الثاني الساكن، التفعيلة الثانية من الشطرين فصارت «فعِلاتن»، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79–80]. والعروض والضرب محذوفان: «فاعلن» [@atiq، ص80]."
