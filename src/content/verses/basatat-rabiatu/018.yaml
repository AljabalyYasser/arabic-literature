first: "وَدَعَتْنِي بِرُقَاهَا إِنَّهَا"
second: "تُنْزِلُ الأَعْصَمَ مِنْ رَأْسِ اليَفَعْ"
vocabulary:
  - term: "بِرُقَاهَا"
    text: "يقول محققا «المفضليات»: «الرقى: جمع رقية، يريد أنها دعته برقاها فلم يجد له فكاكا» [@mufaddaliyyat، ص192، الحاشية]."
  - term: "الأَعْصَمَ"
    text: "يقول محققا «المفضليات»: «الوعل الذي في يديه بياض» [@mufaddaliyyat، ص192، الحاشية]."
  - term: "اليَفَعْ"
    text: "يقول محققا «المفضليات»: «المرتفع، كاليفاع» [@mufaddaliyyat، ص192، الحاشية]."
