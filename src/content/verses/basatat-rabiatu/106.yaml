explained: false
first: "ذُو عُبَابٍ زَبِدٍ آذِيُّهُ"
second: "خَمِطُ التَّيَّارِ يَرْمِي بِالقَلَعْ"
vocabulary:
  - term: "عُبَابٍ"
    text: "يقول محققا «المفضليات»: «تكاثف الموج واضطرابه» [@mufaddaliyyat، ص202، الحاشية]."
  - term: "آذِيُّهُ"
    text: "يقول محققا «المفضليات»: «الآذي والتيار واحد، وهما الموج» [@mufaddaliyyat، ص202، الحاشية]."
  - term: "خَمِطُ التَّيَّارِ"
    text: "يقول محققا «المفضليات»: «مضطربه متلاطمه» [@mufaddaliyyat، ص202، الحاشية]."
  - term: "بِالقَلَعْ"
    text: "يقول محققا «المفضليات»: «جمع قلعة، بفتحات، وهي الصخرة العظيمة، والمراد هنا الأمواج العظيمة» [@mufaddaliyyat، ص202، الحاشية]."
