first: "وَيُحَيِّينِي إِذَا لَاقَيْتُهُ"
second: "وَإِذَا يَخْلُو لَهُ لَحْمِي رَتَعْ"
meaning: "يسلّم عليّ ويحيّيني إذا التقينا وجهًا لوجه، فإذا غبت عنه وخلا له عرضي اغتابني ونال مني، كما ترعى الدابة في مرعى لا يمنعها منه أحد. فالشطر الأول وجهه الظاهر، والثاني باطنه."
vocabulary:
  - term: "لَحْمِي"
    text: "كناية عن عِرضه، فمن يغتاب رجلًا كأنه يأكل لحمه."
  - term: "رَتَعْ"
    text: "يقول محققا «المفضليات»: «أكل بشره» [@mufaddaliyyat، ص198، الحاشية]، أي أكل بنهم. ويقول محقق شرح التِّبْرِيزِيّ: «رتع: أكل» [@tabrizi-ikhtiyarat، ج2 ص904، الحاشية]."
context: "من صورة العدو المنافق (67–91): بعد غيظه (67)، وضيقه به كالشجا في الحلق (68)، وتعاظمه في الغيبة وتضاؤله في الحضور (69)، يأتي هذا البيت الذي يجمع الوجهين في سطر واحد. وهو من الأبيات التي تمثّل بها الحجّاج على المنبر [@ibn-qutayba، ج1 ص411]، وبعده: «مُسْتَسِرُّ الشَّنْءِ لَوْ يَفْقِدُنِي / لَبَدَا مِنْهُ ذُبَابٌ فَنَبَعْ»."
syntax:
  - "«وَيُحَيِّينِي»: الواو عاطفة، و«يحيّي» فعل مضارع مرفوع بضمة مقدرة على الياء، وفاعله ضمير العدو، والنون للوقاية، والياء مفعول به."
  - "«إِذَا لَاقَيْتُهُ»: «إذا» ظرف لما يُستقبل فيه معنى الشرط، وجملة «لاقيته» في محل جر بالإضافة، وجوابه محذوف دلّ عليه ما قبله."
  - "«وَإِذَا يَخْلُو لَهُ لَحْمِي»: «يخلو» فعل مضارع، و«له» متعلق به، و«لحمي» فاعل مؤخر."
  - "«رَتَعْ»: فعل ماض فاعله ضمير العدو، والجملة جواب «إذا»، وسُكّن للقافية."
morphology:
  - "«يُحَيِّي» مضارع «حَيَّا» على «فَعَّلَ» من التحية."
  - "«لَاقَى» على «فاعَلَ» من اللقاء، والمفاعلة فيه بين اثنين."
  - "«يَخْلُو» مضارع «خلا»، لامه واو."
rhetoric:
  thesis: "صورة المنافق في بيت واحد: تحية في الحضور، ونهش في الغياب."
  devices:
    - title: "المقابلة بين الشطرين"
      text: "قابل «يحيّيني» بـ«رتع»، و«إذا لاقيته» بـ«إذا يخلو له»: لقاء وخلوة، وتحية وأكل. فكل لفظ في الصدر له نقيض في العجز. وهذه قراءتنا."
    - title: "الاستعارة في «لَحْمِي رَتَعْ»"
      text: "جعل الاغتياب أكلًا للحم، ثم جعل المغتاب دابة ترتع، أي ترعى كما تشاء في مرعى خالٍ. وهي الاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. وصورة أكل اللحم في الغيبة هي صورة القرآن في قوله: ﴿أَيُحِبُّ أَحَدُكُمْ أَنْ يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا﴾ (الحجرات: 12)."
  connection: "ثم يكشف ما يُضمره: «مُسْتَسِرُّ الشَّنْءِ لَوْ يَفْقِدُنِي / لَبَدَا مِنْهُ ذُبَابٌ فَنَبَعْ»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ العين الساكنة"
  scansion: "وَيُحَيْيِي / نِي إِذَا لَا / قَيْتُهُو = فعِلاتن / فاعلاتن / فاعلن — وَإِذَا يَخْ / لُو لَهُو لَحْ / مِي رَتَعْ = فعِلاتن / فاعلاتن / فاعلن"
  note: "دخل الخَبْن أول الشطرين فصارت «فعِلاتن»، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79–80]. وأُشبعت ضمة الهاء في «لاقيتُهُ» و«لَهُ»."
