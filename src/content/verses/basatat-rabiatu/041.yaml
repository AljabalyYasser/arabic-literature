explained: false
first: "فَبِهِمْ يُنْكَى عَدُوٌّ وَبِهِمْ"
second: "يُرْأَبُ الشَّعْبُ إِذَا الشَّعْبُ انْصَدَعْ"
vocabulary:
  - term: "يُنْكَى"
    text: "يقول محققا «المفضليات»: «يقال نكيت العدو، ونكيت فيه، نكاية: إذا أصبت منهم فأكثرت الجراح والقتل» [@mufaddaliyyat، ص195، الحاشية]."
  - term: "الشَّعْبُ"
    text: "يقول محققا «المفضليات»: «الصدع والتفرق، وهو من الأضداد، يكون أيضا بمعنى الالتئام» [@mufaddaliyyat، ص195، الحاشية]."
  - term: "يُرْأَبُ"
    text: "يقول محققا «المفضليات»: «رأبه: أصلحه» [@mufaddaliyyat، ص195، الحاشية]."
