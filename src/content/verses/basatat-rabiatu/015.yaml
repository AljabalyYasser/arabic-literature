explained: false
first: "وَيُزَجِّيهَا عَلَى إِبْطَائِهَا"
second: "مُغْرَبُ اللَّوْنِ إِذَا اللَّوْنُ انْقَشَعْ"
vocabulary:
  - term: "وَيُزَجِّيهَا"
    text: "يقول محققا «المفضليات»: «يسوقها برفق» [@mufaddaliyyat، ص192، الحاشية]."
  - term: "مُغْرَبُ اللَّوْنِ"
    text: "يقول محققا «المفضليات»: «المغرب، بفتح الراء: الأبيض، يعني بياض الصبح، شبهه بالمغرب من الخيل، وهو الذي تتسع غرته في وجهه حتى تجاوز عينيه» [@mufaddaliyyat، ص192، الحاشية]."
  - term: "انْقَشَعْ"
    text: "يقول محققا «المفضليات»: «ذهب» [@mufaddaliyyat، ص192، الحاشية]."
