explained: false
first: "أَصْقَعُ النَّاسِ بِرَجْمٍ صَائِبٍ"
second: "لَيْسَ بِالطَّيْشِ وَلَا بِالمُرْتَجَعْ"
vocabulary:
  - term: "أَصْقَعُ النَّاسِ"
    text: "يقول محققا «المفضليات»: «أشدهم صقعا، وهو الضرب على الرأس» [@mufaddaliyyat، ص199، الحاشية]."
  - term: "بِرَجْمٍ"
    text: "يقول محققا «المفضليات»: «الرجم: الرمي، وأراد به هنا الكلام» [@mufaddaliyyat، ص199، الحاشية]."
  - term: "لَيْسَ بِالطَّيْشِ وَلَا بِالمُرْتَجَعْ"
    text: "يقول محققا «المفضليات»: «إن كلامه ليس يخطئ ولا يرتجع، أي لا يرد» [@mufaddaliyyat، ص199، الحاشية]."
