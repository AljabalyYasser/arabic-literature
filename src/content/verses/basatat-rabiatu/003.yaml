first: "صَقَلَتْهُ بِقَضِيبٍ نَاضِرٍ"
second: "مِنْ أَرَاكٍ طَيِّبٍ حَتَّى نَصَعْ"
vocabulary:
  - term: "صَقَلَتْهُ"
    text: "يقول محققا «المفضليات»: «الصقل: الجلاء» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "نَاضِرٍ"
    text: "يقول محققا «المفضليات»: «ناعم أخضر ريان» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "أَرَاكٍ"
    text: "يقول محققا «المفضليات»: «شجر يتخذ منه السواك المعروف، وهو أجود سواك» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "نَصَعْ"
    text: "يقول محققا «المفضليات»: «خلص لونه» [@mufaddaliyyat، ص191، الحاشية]."
