first: "يَدَّرِعْنَ اللَّيْلَ يَهْوِينَ بِنَا"
second: "كَهُوِيِّ الكُدْرِ صَبَّحْنَ الشَّرَعْ"
vocabulary:
  - term: "يَدَّرِعْنَ اللَّيْلَ"
    text: "يقول محققا «المفضليات»: «يدخلن فيه كما تلبس الدرع» [@mufaddaliyyat، ص194، الحاشية]."
  - term: "الكُدْرِ"
    text: "يقول محققا «المفضليات»: «القطا الكدري، وهو الذي في لونه غبرة» [@mufaddaliyyat، ص194، الحاشية]."
  - term: "صَبَّحْنَ"
    text: "يقول محققا «المفضليات»: «وافين في الصبح» [@mufaddaliyyat، ص194، الحاشية]."
  - term: "الشَّرَعْ"
    text: "يقول محققا «المفضليات»: «الماء والشرب جميعا» [@mufaddaliyyat، ص194، الحاشية]."
