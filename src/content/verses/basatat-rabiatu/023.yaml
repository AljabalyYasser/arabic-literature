explained: false
first: "وَفَلَاةٍ وَاضِحٍ أَقْرَابُهَا"
second: "بَالِيَاتٌ مِثْلُ مُرْفَتِّ القَزَعْ"
vocabulary:
  - term: "أَقْرَابُهَا"
    text: "يقول محققا «المفضليات»: «الأقراب: الخواصر، وهي ههنا تشبيه، أراد جوانبها وأطرافها» [@mufaddaliyyat، ص193، الحاشية]."
  - term: "مُرْفَتِّ"
    text: "يقول محققا «المفضليات»: «المتكسر المتحطم» [@mufaddaliyyat، ص193، الحاشية]."
  - term: "القَزَعْ"
    text: "يقول محققا «المفضليات»: «جمع قزعة، وهي بقايا تبقى من الشعر في الرأس، شبه بها علامات الفلاة» [@mufaddaliyyat، ص193، الحاشية]."
