first: "بَسَطَتْ رَابِعَةُ الحَبْلَ لَنَا"
second: "فَوَصَلْنَا الحَبْلَ مِنْهَا مَا اتَّسَعْ"
meaning: "مدّت رابعة لنا حبل الوصل، فوصلنا من جهتنا ما امتدّ منه. يقول التِّبْرِيزِيّ: «يريد: وسّعت مجال الطمع في وصلها، والسكون إلى دوام عهدها، فأمددنا ما بذلت لنا بوصل يستديم بقاءه» [@tabrizi-ikhtiyarat، ج2 ص867]. فهي بدأت بالمودة، وهو قابلها بمثلها، ما دامت هي تمدّ."
vocabulary:
  - term: "رَابِعَةُ"
    text: "يقول محققا «المفضليات»: «صاحبته يتغزل فيها» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "الحَبْلَ"
    text: "يقول محققا «المفضليات»: «يريد به الوصل» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "مَا اتَّسَعْ"
    text: "يقول التِّبْرِيزِيّ: «ومعنى «ما اتسع»: مدّة اتساعه وامتداده» [@tabrizi-ikhtiyarat، ج2 ص867]."
context: "مطلع «اليتيمة»، وبه تُعرف: قرأ أبو نصر صاحب الأصمعي شعر سُوَيْد على الأصمعي، «فلما قرأ قصيدته: بسطت رابعة الحبل لنا ... فضّلها الأصمعى» [@aghani-dk، ج13 ص102]، وبه يذكرها ابن سَلّام في طبقته السادسة [@ibn-sallam، ج1 ص153]، وابن رَشِيق حين يقول: «وسويد بن أبي كاهل، صاحب: بسطت رابعة الحبل لنا» [@ibn-rashiq، ج1 ص105]. والقصيدة تبدأ بنسيب طويل: صفة رابعة (1–7)، ثم خيالها الذي يطرقه ليلًا (8–19)."
syntax:
  - "«بَسَطَتْ رَابِعَةُ الحَبْلَ لَنَا»: «بسط» فعل ماض، والتاء للتأنيث، و«رابعةُ» فاعل مرفوع بالضمة، ممنوع من الصرف للعلمية والتأنيث، و«الحبلَ» مفعول به، و«لنا» جار ومجرور متعلق ببسطت."
  - "«فَوَصَلْنَا الحَبْلَ مِنْهَا»: الفاء عاطفة، و«وصلنا» فعل وفاعل، و«الحبل» مفعول به، و«منها» متعلق بوصلنا."
  - "«مَا اتَّسَعْ»: «ما» مصدرية ظرفية، والمصدر المؤول في محل نصب على الظرفية، أي: مدةَ اتساعه، كما يفسّرها التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج2 ص867]."
morphology:
  - "«رَابِعَة» علم على وزن «فاعِلة»."
  - "«اتَّسَعَ» على «افْتَعَلَ» من «وَسِع»، أصله «اوْتَسَعَ»، قلبت فاء الفعل الواوُ تاءً وأُدغمت في تاء الافتعال."
  - "«بَسَطَتْ» و«وَصَلْنَا» فعلان ثلاثيان مجردان."
rhetoric:
  thesis: "مطلع غزلي يجعل المودة حبلًا تمدّه المرأة ويصله الشاعر."
  devices:
    - title: "الاستعارة في «الحَبْلَ»"
      text: "سمّى الوصل حبلًا، ولم يذكر الوصل نفسه. وهي الاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الترشيح في «بَسَطَتْ ... فَوَصَلْنَا ... مَا اتَّسَعْ»"
      text: "ثم أتبع الحبل بأفعال تناسب الحبل: البسط والوصل والاتساع، فبقي في الصورة إلى آخر البيت ولم يخرج إلى لفظ المودة. وهذه قراءتنا."
    - title: "التكرار في «الحَبْلَ ... الحَبْلَ»"
      text: "كرّر «الحبل» في الشطرين، فالحبل الذي بسطته هي هو نفسه الذي وصله هو، فتمّ التبادل في اللفظ كما تمّ في المعنى."
  connection: "ثم يصف رابعة: «حُرَّةٌ تَجْلُو شَتِيتًا وَاضِحًا»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ العين الساكنة، فالقافية مقيّدة"
  scansion: "بَسَطَتْ رَا / بِعَتُلْحَبْ / لَ لَنَا = فعِلاتن / فعِلاتن / فعِلن — فَوَصَلْنَلْ / حَبْلَ مِنْهَا / مَتْتَسَعْ = فعِلاتن / فاعلاتن / فاعلن"
  note: "وزن الرمل التام «فاعلاتن فاعلاتن فاعلن» في كل شطر، وعَرُوضه وضربه محذوفان: «فاعلن» [@atiq، ص80]. ودخل الخَبْن، وهو حذف الثاني الساكن، التفعيلات الثلاث في الصدر وأولى العجز، فصارت «فعِلاتن» و«فعِلن»، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79–80]. والقافية مقيدة، رويّها عين ساكنة في القصيدة كلها."
