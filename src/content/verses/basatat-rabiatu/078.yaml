explained: false
first: "فَارِغُ السَّوْطِ فَمَا يَجْهَدُنِي"
second: "ثَلِبٌ عَوْدٌ وَلَا شَخْتٌ ضَرَعْ"
vocabulary:
  - term: "فَارِغُ السَّوْطِ"
    text: "يقول محققا «المفضليات»: «يريد أنه مشغول عمن عاداه. أو أنه شبه نفسه بفرس لا يحتاج أن يضرب بالسوط لأنه مسرع» [@mufaddaliyyat، ص199، الحاشية]."
  - term: "ثَلِبٌ"
    text: "يقول محققا «المفضليات»: «الكبير الهرم من الإبل، وهو العود» [@mufaddaliyyat، ص199، الحاشية]."
  - term: "شَخْتٌ"
    text: "يقول محققا «المفضليات»: «الدقيق النحيف الصغير» [@mufaddaliyyat، ص199، الحاشية]."
  - term: "ضَرَعْ"
    text: "يقول محققا «المفضليات»: «الصغير السن» [@mufaddaliyyat، ص199، الحاشية]."
