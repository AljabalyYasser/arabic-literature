first: "هَلْ سُوَيْدٌ غَيْرُ لَيْثٍ خَادِرٍ"
second: "ثَئِدَتْ أَرْضٌ عَلَيْهِ فَانْتَجَعْ"
meaning: "ما سُوَيْد إلا أسد في عرينه، إذا لم توافقه أرض تركها إلى غيرها. يقول محققا «المفضليات»: «الخادر: الذي اتخذ الأجمة خدرا. ثئدت: نديت ... انتجع: من النجعة ... وهي طلب الكلأ في موضعه. أي لما فسد عليه موضع انتقل إلى غيره» [@mufaddaliyyat، ص202، الحاشية]. فهو لا يقيم على ضيم ولا على أرض لا تصلح له."
vocabulary:
  - term: "خَادِرٍ"
    text: "يقول محققا «المفضليات»: «الذي اتخذ الأجمة خدرا» [@mufaddaliyyat، ص202، الحاشية]، والأجمة: الشجر الملتفّ، وهي عرين الأسد."
  - term: "ثَئِدَتْ"
    text: "يقول التِّبْرِيزِيّ: «من الثأد، وهو الندى» [@tabrizi-ikhtiyarat، ج2 ص907]. ويقول محققه: «فالثأد هنا هو الفساد، أو عدم الموافقة» [@tabrizi-ikhtiyarat، ج2 ص907، الحاشية]، أي صارت الأرض ندية وخمة لا يطيب المقام فيها."
  - term: "فَانْتَجَعْ"
    text: "يقول محققا «المفضليات»: «من النجعة، بضم فسكون، وهي طلب الكلأ في موضعه» [@mufaddaliyyat، ص202، الحاشية]."
context: "آخر القصيدة في رواية المفضليات، وهي رواية ابن الأَنْبارِيّ والمرزوقي؛ أما التِّبْرِيزِيّ فيجعله البيت التاسع والسبعين، ويقول محققه: «أخره الأنباري والمرزوقي، فأثبتاه في آخر القصيدة» [@tabrizi-ikhtiyarat، ج2 ص907، الحاشية]. وهو مما تمثّل به الحجّاج على المنبر، ورواه ابن قُتَيْبة بعد «ويحيّيني إذا لاقيته» [@ibn-qutayba، ج1 ص411]. فالقصيدة التي بدأت باسم رابعة تنتهي باسم الشاعر نفسه."
syntax:
  - "«هَلْ»: حرف استفهام، خرج هنا إلى النفي، أي: ما سويد إلا ليث."
  - "«سُوَيْدٌ غَيْرُ لَيْثٍ»: «سويد» مبتدأ، و«غير» خبره مضاف، و«ليث» مضاف إليه، و«خادر» صفة."
  - "«ثَئِدَتْ أَرْضٌ عَلَيْهِ»: فعل ماض والتاء للتأنيث، و«أرض» فاعل، و«عليه» متعلق بثئدت. والجملة صفة ثانية لليث، أو حال منه لتخصّصه بالصفة."
  - "«فَانْتَجَعْ»: الفاء عاطفة، و«انتجع» فعل ماض فاعله ضمير الليث، وسُكّن للقافية."
morphology:
  - "«سُوَيْد» علم على صيغة التصغير «فُعَيْل»."
  - "«خَادِر» اسم فاعل من «خَدَرَ» الأسد، إذا لزم خِدره، أي عرينه."
  - "«انْتَجَعَ» على «افْتَعَلَ» من النُّجْعة."
rhetoric:
  thesis: "ختام فخر يسمّي فيه الشاعر نفسه ويجعلها أسدًا لا يقيم على أرض لا تصلح له."
  devices:
    - title: "الاستفهام في «هَلْ سُوَيْدٌ غَيْرُ لَيْثٍ»"
      text: "استفهام لا يطلب جوابًا، بل يقرّر: لا يكون سويد إلا أسدًا. وكأنه يتحدى من يشك في ذلك. وهذه قراءتنا."
    - title: "ذكر الاسم في «سُوَيْدٌ»"
      text: "كان يتحدث عن نفسه بضمير المتكلم في القصيدة كلها، ثم سمّى نفسه في آخرها كأنه يتحدث عن غيره، فصار الختام توقيعًا باسمه. وهذه قراءتنا."
    - title: "التشبيه في «سُوَيْدٌ ... لَيْثٍ خَادِرٍ»"
      text: "ذكر المشبه «سويد» والمشبه به «ليث» وحذف الأداة، فهو تشبيه لا استعارة، لأن الاستعارة عند عبد القاهر أن تدع الإفصاح بالتشبيه «وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]، والمشبه هنا مذكور. وزاد الليث صفة «خادر»، أي في عرينه، والأسد في عرينه أشدّ ما يكون."
    - title: "الكناية في «ثَئِدَتْ أَرْضٌ عَلَيْهِ فَانْتَجَعْ»"
      text: "الأسد إذا ساءت أرضه تركها، والمراد أن الشاعر لا يقيم حيث يُضام. ويروي أبو الفَرَج أن سُوَيْدًا «كان إذا غضب على بني يشكر ادّعى إلى بني ذبيان، وإذا رضي عنهم أقام على نسبه فيهم» [@aghani-dk، ج13 ص103]، فللبيت صدى من سيرته، وهذه قراءتنا."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ العين الساكنة"
  scansion: "هَلْ سُوَيْدُنْ / غَيْرُ لَيْثِنْ / خَادِرِنْ = فاعلاتن / فاعلاتن / فاعلن — ثَئِدَتْ أَرْ / ضُنْ عَلَيْهِي / فَنْتَجَعْ = فعِلاتن / فاعلاتن / فاعلن"
  note: "دخل الخَبْن أول العجز فصارت «فعِلاتن»، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79–80]. وأُشبعت كسرة الهاء في «عَلَيْهِ» فصارت «عَلَيْهِي»، وسقطت همزة الوصل في «انتجع»."
