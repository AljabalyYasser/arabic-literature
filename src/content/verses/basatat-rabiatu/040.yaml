first: "وَلُيُوثٌ تُتَّقَى عُرَّتُهَا"
second: "سَاكِنُو الرِّيحِ إِذَا طَارَ القَزَعْ"
vocabulary:
  - term: "عُرَّتُهَا"
    text: "يقول محققا «المفضليات»: «الأذى» [@mufaddaliyyat، ص195، الحاشية]."
  - term: "سَاكِنُو الرِّيحِ"
    text: "يقول محققا «المفضليات»: «لا يخفون ولا يعجلون» [@mufaddaliyyat، ص195، الحاشية]."
  - term: "القَزَعْ"
    text: "يقول محققا «المفضليات»: «الخفاف الذين لا ركانة لهم، شبههم بقزع السحاب، وهو قطعه المتفرقة» [@mufaddaliyyat، ص195، الحاشية]."
