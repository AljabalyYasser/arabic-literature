first: "قَالَ لَبَّيْكَ وَمَا اسْتَصْرَخْتُهُ"
second: "حَاقِرًا لِلنَّاسِ قَوَّالَ القَذَعْ"
vocabulary:
  - term: "قَالَ لَبَّيْكَ"
    text: "يقول محققا «المفضليات»: «يعني شيطانه. ومن عادة الشعراء أن يذكروا أن لهم صاحبا من الجن يوحي إليهم الشعر» [@mufaddaliyyat، ص201، الحاشية]."
  - term: "القَذَعْ"
    text: "يقول محققا «المفضليات»: «الكلام السيئ القبيح» [@mufaddaliyyat، ص201، الحاشية]."
