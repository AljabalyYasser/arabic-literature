first: "ثُمَّ وَلَّى وَهْوَ لَا يَحْمِي اسْتَهُ"
second: "طَائِرُ الإِتْرَافِ عَنْهُ قَدْ وَقَعْ"
meaning: "ثم فرّ خصمي مهزومًا، يولّيني ظهره ومؤخرته ولا يحميها، وقد ذهب عنه ما كان فيه من تنعّم وبغي. والاست هي العَجُز، أي المؤخرة وموضع الدُّبر؛ والمنهزم في القتال يعطي عدوه قفاه ودبره فلا يدافع عنهما، فصار «لا يحمي استه» صورة للفرار المذلّ. يقول التِّبْرِيزِيّ: «أي: غلبته وخصمته، فولّى لا ينثني راجعًا» [@tabrizi-ikhtiyarat، ج2 ص915]. والمعركة هنا معركة كلام: مفاخرة بين الشاعر وخصمه أمام الأعادي (92–97)، غلب فيها الشاعر، ففرّ الخصم كما يفرّ المهزوم في الحرب."
vocabulary:
  - term: "وَلَّى"
    text: "أدبر وفرّ."
  - term: "اسْتَهُ"
    text: "الاسْت: العَجُز، أي المؤخرة، ويُراد بها موضع الدبر. وفي اللسان: «السته والسته والاست: معروفة، وهو من المحذوف المجتلبة له ألف الوصل» [@lisan، ج13 ص495]."
  - term: "طَائِرُ الإِتْرَافِ"
    text: "يقول التِّبْرِيزِيّ: «يريد: ما كان عليه من البغي. وقال أبو جعفر: «الإتراف»: التنعم، يقول: قد طار عنه نعيمه» [@tabrizi-ikhtiyarat، ج2 ص915]. ويقول محققا «المفضليات»: «الإتراف: الترف والتنعم. قد وقع: يريد أنه ذهب عنه تنعمه» [@mufaddaliyyat، ص201، الحاشية]."
context: "من مقطع المفاخرة (92–103): خاصمه عدوّ قديم، فتساقيا الكلام المرّ، وارتميا بالحجج أمام الأعادي، فلما غُلب الخصم ولّى. وفي البيتين بعده يصفه ساجدًا بأنفه، خاشع الطرف، ثم فارًّا وقد هرب منه شيطانه. والبيت من الهجاء المقذع في القصيدة، فشرحناه شرحًا كاملًا، وكلمة «استه» فيه مقصودة: أراد أن يجعل هزيمة خصمه في الكلام هزيمة جسد مكشوف."
syntax:
  - "«ثُمَّ وَلَّى»: «ثم» حرف عطف، و«ولّى» فعل ماض فاعله ضمير الخصم."
  - "«وَهْوَ لَا يَحْمِي اسْتَهُ»: الواو حالية، و«هو» مبتدأ، وسُكّنت هاؤه بعد الواو، وجملة «لا يحمي استه» خبره، و«استَه» مفعول به، والجملة الاسمية في محل نصب حال."
  - "«طَائِرُ الإِتْرَافِ عَنْهُ قَدْ وَقَعْ»: «طائر» مبتدأ، و«الإتراف» مضاف إليه، و«عنه» متعلق بوقع، وجملة «قد وقع» خبر. والجملة حال ثانية، أو مستأنفة."
morphology:
  - "«وَلَّى» على «فَعَّلَ»، يقال: ولّى، إذا أدبر."
  - "«اسْت» اسم ثلاثي محذوف اللام، أصله «سَتَه»، حُذفت الهاء وعُوّض عنها همزة الوصل في أوله، وعلى هذا صاحب اللسان: «من المحذوف المجتلبة له ألف الوصل» [@lisan، ج13 ص495]."
  - "«الإِتْرَاف» مصدر «أَتْرَفَ» على «إِفْعَال»، وهمزته همزة قطع."
rhetoric:
  thesis: "هجاء يجعل هزيمة الخصم في الجدال هزيمة فارّ في الحرب، مكشوف المؤخرة، زائل النعمة."
  devices:
    - title: "الكناية في «لَا يَحْمِي اسْتَهُ»"
      text: "أراد الهزيمة والجبن، فذكر ما يلزم المنهزم: أنه يولّي عدوه ظهره ودبره ولا يدافع عنهما. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. واختار أخسّ ما في الجسد ليكون الهجاء أوجع."
    - title: "الاستعارة في «طَائِرُ الإِتْرَافِ ... قَدْ وَقَعْ»"
      text: "جعل لترف الخصم ونعمته طائرًا كان يحلّق فسقط، كما يقول التِّبْرِيزِيّ عن أبي جعفر: «قد طار عنه نعيمه» [@tabrizi-ikhtiyarat، ج2 ص915]. وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» عند عبد القاهر [@dalail، ص67]."
  connection: "ثم يزيده إذلالًا: «سَاجِدَ المَنْخِرِ لَا يَرْفَعُهُ / خَاشِعَ الطَّرْفِ أَصَمَّ المُسْتَمَعْ»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ العين الساكنة"
  scansion: "ثُمْمَ وَلْلَى / وَهْوَ لَا يَحْ / مِسْتَهُو = فاعلاتن / فاعلاتن / فاعلن — طَائِرُلْ إِتْ / رَافِعَنْهُو / قَدْ وَقَعْ = فاعلاتن / فاعلاتن / فاعلن"
  note: "جاء البيت على «فاعلاتن» تامة في الحشو، والعروض والضرب محذوفان «فاعلن» [@atiq، ص80]. وتسقط همزة الوصل في «اسْتَهُ» فتتصل الميم بالسين: «يَحْمِسْتَهُو». وأُشبعت ضمة الهاء في «استَهُ» و«عَنْهُ»."
variants:
  - reading: "طَائِرُ الخَالَةِ عَنْهُ قَدْ وَقَعْ"
    status: "رواية يذكرها التِّبْرِيزِيّ"
    note: "يقول: «ويروى: «طائر الخالة عنه قد وقع». أراد بـ«الخالة»: المختالين ذوي الخيلاء» [@tabrizi-ikhtiyarat، ج2 ص915]."
