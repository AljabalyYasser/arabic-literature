explained: false
first: "مُزْبِدٌ يَخْطِرُ مَا لَمْ يَرَنِي"
second: "فَإِذَا أَسْمَعْتُهُ صَوْتِي انْقَمَعْ"
vocabulary:
  - term: "مُزْبِدٌ"
    text: "يقول محققا «المفضليات»: «كالجمل الهائج إذا ظهر الزبد على مشافره، وهو لغامه الأبيض» [@mufaddaliyyat، ص198، الحاشية]."
  - term: "يَخْطِرُ"
    text: "يقول محققا «المفضليات»: «من الخطر، بسكون الطاء، وهو ضرب الفحل بذنبه إذا هاج» [@mufaddaliyyat، ص198، الحاشية]."
  - term: "انْقَمَعْ"
    text: "يقول محققا «المفضليات»: «دخل بعضه في بعض» [@mufaddaliyyat، ص198، الحاشية]."
  - term: "مَا لَمْ يَرَنِي"
    text: "يقول محققا «المفضليات»: «المعنى: أنه يتعظم إذا لم يرني، فإذا رآني تضاءل» [@mufaddaliyyat، ص198، الحاشية]."
