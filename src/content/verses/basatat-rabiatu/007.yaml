explained: false
first: "وَقُرُونًا سَابِغًا أَطْرَافُهَا"
second: "غَلَّلَتْهَا رِيحُ مِسْكٍ ذِي فَنَعْ"
vocabulary:
  - term: "وَقُرُونًا"
    text: "يقول محققا «المفضليات»: «القرون: الذوائب» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "سَابِغًا"
    text: "يقول محققا «المفضليات»: «الطويل التام» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "غَلَّلَتْهَا"
    text: "يقول محققا «المفضليات»: «دخلت فيها» [@mufaddaliyyat، ص191، الحاشية]."
  - term: "فَنَعْ"
    text: "يقول محققا «المفضليات»: «الكثرة والفضل، والمراد هنا طيب ريحه وسطوعها» [@mufaddaliyyat، ص191، الحاشية]."
