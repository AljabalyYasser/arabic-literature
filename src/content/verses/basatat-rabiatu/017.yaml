explained: false
first: "خَبَّلَتْنِي ثُمَّ لَمَّا تُشْفِنِي"
second: "فَفُؤَادِي كُلَّ أَوْبٍ مَا اجْتَمَعْ"
vocabulary:
  - term: "خَبَّلَتْنِي"
    text: "يقول محققا «المفضليات»: «من قولهم خبله وخبله، بالتشديد والتخفيف، واختبله: إذا أفسد عقله» [@mufaddaliyyat، ص192، الحاشية]."
  - term: "كُلَّ أَوْبٍ"
    text: "يقول محققا «المفضليات»: «كل وجه» [@mufaddaliyyat، ص192، الحاشية]."
  - term: "مَا اجْتَمَعْ"
    text: "يقول محققا «المفضليات»: «متفرق لم يجتمع» [@mufaddaliyyat، ص192، الحاشية]."
