first: "رُبَّ مَنْ أَنْضَجْتُ غَيْظًا قَلْبَهُ"
second: "قَدْ تَمَنَّى لِيَ مَوْتًا لَمْ يُطَعْ"
meaning: "كثير ممن أحرقت قلبه غيظًا مني تمنّى لي الموت، فلم يُستجب لما تمنّى. يقول التِّبْرِيزِيّ: «والمعنى: ربّ إنسان كرّبت قلبه بغيظه عليّ، وهو يشتهي لي الموت والبقاء بعدي، فلم يطعه القدر» [@tabrizi-ikhtiyarat، ج2 ص901]. فالشاعر هو الذي يغيظ أعداءه، وهم الذين يتمنّون، والقدر لا يطيعهم."
vocabulary:
  - term: "أَنْضَجْتُ غَيْظًا قَلْبَهُ"
    text: "جعلت قلبه ينضج من الغيظ كما ينضج اللحم على النار. والغيظ: أشدّ الغضب."
  - term: "لَمْ يُطَعْ"
    text: "يقول التِّبْرِيزِيّ: «فلم يطعه القدر» [@tabrizi-ikhtiyarat، ج2 ص901]."
context: "أول مقطع العدوّ في القصيدة. يقول محققا «المفضليات» إن الشاعر يصوّر فيه «صورة رائعة للعداوة»، ويتناول هذا المعنى «في الأبيات 67–91» [@mufaddaliyyat، ص190، الحاشية]. وهذا البيت أول الأبيات التي يقول ابن قُتَيْبة إن «الحجّاج تمثّل يوم رستقباذ على المنبر» بها [@ibn-qutayba، ج1 ص411]، فصارت أبيات سُوَيْد في الحاسد خطبةَ والٍ أمويٍّ في أعدائه."
syntax:
  - "يقول التِّبْرِيزِيّ: «من» نكرة، «والفعل الذي بعده صفة له. ولو كان «من» معرفة لكان الفعل صلة له. وانتصب «غيظا» على أنه مفعول له» [@tabrizi-ikhtiyarat، ج2 ص901]."
  - "«رُبَّ مَنْ»: «ربّ» حرف جر شبيه بالزائد، و«مَن» نكرة مجرورة لفظًا مرفوعة محلًّا على الابتداء، وجملة «أنضجت» صفتها."
  - "«قَلْبَهُ»: مفعول به لأنضجت، وقُدّم عليه المفعول لأجله «غيظًا»."
  - "«قَدْ تَمَنَّى لِيَ مَوْتًا»: جملة في محل رفع خبر المبتدأ «مَن»، و«لي» متعلق بتمنّى، و«موتًا» مفعول به."
  - "«لَمْ يُطَعْ»: «لم» حرف جزم، و«يُطَع» مضارع مبني للمجهول مجزوم، ونائب الفاعل ضمير يعود على المتمنّي، والجملة حال."
morphology:
  - "«أَنْضَجْتُ» على «أَفْعَلَ» من «نَضِج»، والهمزة للتعدية."
  - "«تَمَنَّى» على «تَفَعَّلَ» من المُنى، أصله «تَمَنَّيَ»، قلبت الياء ألفًا لتحركها وانفتاح ما قبلها."
  - "«يُطَعْ» مضارع «أطاع» مبني للمجهول، أصله «يُطاعُ»، فلما جُزم سكنت العين وحُذفت الألف لالتقاء الساكنين."
rhetoric:
  thesis: "يجعل غيظ العدو نارًا تُنضج قلبه، ويجعل أمنيته أمرًا لا يطيعه القدر."
  devices:
    - title: "الاستعارة في «أَنْضَجْتُ غَيْظًا قَلْبَهُ»"
      text: "النضج للّحم والطعام على النار، فاستعاره للقلب الذي يحترق غيظًا، فوقعت الاستعارة في الفعل. يقول عبد القاهر الجُرْجانيّ: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]."
    - title: "«رُبَّ» للتكثير"
      text: "لم يرد عدوًّا واحدًا، بل كثرة من الحسّاد، فكأنه يقول: كم من عدوّ. ثم يفرد الضمائر بعده كأنه يتحدث عن رجل واحد يمثّلهم جميعًا. وهذه قراءتنا."
    - title: "المفارقة في «تَمَنَّى لِيَ مَوْتًا لَمْ يُطَعْ»"
      text: "المتمنّي يريد أن يأمر القدر، والقدر لا يطيع، فهو يبقى بغيظه والشاعر حيّ. وهذا ما يلتقطه التِّبْرِيزِيّ في قوله: «فلم يطعه القدر» [@tabrizi-ikhtiyarat، ج2 ص901]."
  connection: "ثم يصف حال العدو: «وَيَرَانِي كَالشَّجَا فِي حَلْقِهِ / عَسِرًا مَخْرَجُهُ مَا يُنْتَزَعْ»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ العين الساكنة"
  scansion: "رُبْبَ مَنْ أَنْ / ضَجْتُ غَيْظَنْ / قَلْبَهُو = فاعلاتن / فاعلاتن / فاعلن — قَدْ تَمَنْنَى / لِيَ مَوْتَنْ / لَمْ يُطَعْ = فاعلاتن / فعِلاتن / فاعلن"
  note: "دخل الخَبْن التفعيلة الثانية من العجز فصارت «فعِلاتن»، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79–80]. وأُشبعت ضمة الهاء في «قلبَهُ» فصارت «قلبَهُو»."
variants:
  - reading: "رُبَّ مَنْ أَنْضَجْتُ غَيْظًا صَدْرَهُ"
    status: "رواية ابن قُتَيْبة والمرزوقي"
    note: "[@ibn-qutayba، ج1 ص411]. ويذكر محقق شرح التِّبْرِيزِيّ أن المرزوقي يروي «صدره» و«قد تمنّى لي شرًّا» [@tabrizi-ikhtiyarat، ج2 ص901، الحاشية]."
