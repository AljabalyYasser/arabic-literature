first: "فَتَسَاقَيْنَا بِمُرٍّ نَاقِعٍ"
second: "فِي مَقَامٍ لَيْسَ يَثْنِيهِ الوَرَعْ"
vocabulary:
  - term: "بِمُرٍّ"
    text: "يقول محققا «المفضليات»: «أراد به الكلام» [@mufaddaliyyat، ص200، الحاشية]."
  - term: "نَاقِعٍ"
    text: "يقول محققا «المفضليات»: «المجتمع القاتل، شبه كلامه بالسم الناقع» [@mufaddaliyyat، ص200، الحاشية]."
  - term: "الوَرَعْ"
    text: "يقول محققا «المفضليات»: «بفتح الراء: الهيوب الجبان» [@mufaddaliyyat، ص200، الحاشية]."
