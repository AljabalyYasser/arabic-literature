first: "وَكَرِيمٌ عِنْدَهَا مُكْتَبَلٌ"
second: "غَلِقٌ إِثْرَ القَطِينِ المُتَّبَعْ"
vocabulary:
  - term: "مُكْتَبَلٌ"
    text: "يقول محققا «المفضليات»: «موثق، والكبل: القيد. يريد أن قلبه معها» [@mufaddaliyyat، ص196، الحاشية]."
  - term: "غَلِقٌ"
    text: "يقول محققا «المفضليات»: «ذاهب، من قولهم: غلق الرهن إذا ذهب ولم يفتك» [@mufaddaliyyat، ص196، الحاشية]."
  - term: "القَطِينِ"
    text: "يقول محققا «المفضليات»: «الأهل والحشم» [@mufaddaliyyat، ص196، الحاشية]."
