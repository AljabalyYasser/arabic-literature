first: "فَرَكِبْنَاهَا عَلَى مَجْهُولِهَا"
second: "بِصِلَابِ الأَرْضِ فِيهِنَّ شَجَعْ"
vocabulary:
  - term: "عَلَى مَجْهُولِهَا"
    text: "يقول محققا «المفضليات»: «سرنا فيها على جهل بمسالكها وأعلامها» [@mufaddaliyyat، ص193، الحاشية]."
  - term: "بِصِلَابِ الأَرْضِ"
    text: "يقول محققا «المفضليات»: «بخيل صلاب الحوافر، وأرض الفرس: حوافرها» [@mufaddaliyyat، ص193، الحاشية]."
  - term: "شَجَعْ"
    text: "يقول محققا «المفضليات»: «جنون من النشاط» [@mufaddaliyyat، ص193، الحاشية]."
