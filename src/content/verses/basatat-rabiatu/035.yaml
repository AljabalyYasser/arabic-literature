explained: false
first: "وَجِفَانٍ كَالجَوَابِي مُلِئَتْ"
second: "مِنْ سَمِينَاتِ الذُّرَى فِيهَا تَرَعْ"
vocabulary:
  - term: "كَالجَوَابِي"
    text: "يقول محققا «المفضليات»: «الحياض الكبار التي يجبى فيها الماء، الواحدة جابية» [@mufaddaliyyat، ص194، الحاشية]."
  - term: "الذُّرَى"
    text: "يقول محققا «المفضليات»: «جمع ذروة، وذروة كل شيء أعلاه، أراد الأسنمة» [@mufaddaliyyat، ص194، الحاشية]."
  - term: "تَرَعْ"
    text: "يقول محققا «المفضليات»: «الامتلاء» [@mufaddaliyyat، ص194، الحاشية]."
