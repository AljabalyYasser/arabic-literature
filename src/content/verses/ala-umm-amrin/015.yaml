explained: false
first: "وَبَاضِعَةٍ حُمْرِ القِسِيِّ بَعَثْتُهَا"
second: "وَمَنْ يَغْزُ يَغْنَمْ مَرَّةً وَيُشَمَّتِ"
vocabulary:
  - term: "بَاضِعَةٍ"
    text: "«القطعة من الخيل، تبضع الناس بالغزو» [@tabrizi-ikhtiyarat، ج1 ص521]، أي تشقّ فيهم؛ ويريد بها جماعة من رفاقه الغزاة."
  - term: "حُمْرِ القِسِيِّ"
    text: "قِسِيّهم حمر «لأنها متخذة من النَّبْع»، وقيل احمرّت لقِدَمها، وقيل لأن الشمس والأنداء غيّرت لونها [@tabrizi-ikhtiyarat، ج1 ص521]."
  - term: "يُشَمَّتِ"
    text: "«يُخيَّب» [@tabrizi-ikhtiyarat، ج1 ص521]؛ يقال: رجع القوم شِماتاً إذا خابوا."
