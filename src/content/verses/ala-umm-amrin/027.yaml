first: "تَرَاهَا كَأَذْنَابِ الحَسِيلِ صَوَادِرًا"
second: "وَقَدْ نَهِلَتْ مِنَ الدِّمَاءِ وَعَلَّتِ"
vocabulary:
  - term: "الحَسِيلِ"
    text: "«جمع حسيلة، وهي: أولاد البقر. شبّه السيوف بأذناب الحسيل، إذا رأت أمّهاتها فجعلت تحرّك أذنابها» [@tabrizi-ikhtiyarat، ج1 ص528]."
  - term: "نَهِلَتْ... وَعَلَّتِ"
    text: "شربت الشربة الأولى ثم الثانية، «و«النَّهَل» و«العَلَل» هنا للسيوف» [@tabrizi-ikhtiyarat، ج1 ص528]."
