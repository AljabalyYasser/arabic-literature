explained: false
first: "تَبِيتُ بُعَيْدَ النَّوْمِ تُهْدِي غَبُوقَهَا"
second: "لِجَارَتِهَا إِذَا الهَدِيَّةُ قَلَّتِ"
vocabulary:
  - term: "بُعَيْدَ النَّوْمِ"
    text: "بعد أن ينام الناس بقليل؛ «يقال: بات يفعل كذا، إذا فعله ليلاً» [@tabrizi-ikhtiyarat، ج1 ص516]."
  - term: "تُهْدِي غَبُوقَهَا"
    text: "تعطي جارتها ما تشربه هي في العشيّ من اللبن، «يريد: أنها تؤثر بزادها لكرمها» [@tabrizi-ikhtiyarat، ج1 ص516]."
  - term: "إِذَا الهَدِيَّةُ قَلَّتِ"
    text: "في الجدب وبرد الشتاء، «حيث تذهب الإبل وينفد الزاد» [@tabrizi-ikhtiyarat، ج1 ص517]."
