explained: false
first: "لَهَا وَفْضَةٌ فِيهَا ثَلَاثُونَ سَيْحَفًا"
second: "إِذَا آنَسَتْ أُولَى العَدِيِّ اقْشَعَرَّتِ"
vocabulary:
  - term: "وَفْضَةٌ"
    text: "«الجَعْبة» [@tabrizi-ikhtiyarat، ج1 ص525]، أي وعاء السهام."
  - term: "سَيْحَفًا"
    text: "«السهم العريض النَّصْل» [@tabrizi-ikhtiyarat، ج1 ص525]."
  - term: "آنَسَتْ"
    text: "«أحسّت وأبصرت» [@tabrizi-ikhtiyarat، ج1 ص525]."
  - term: "العَدِيِّ"
    text: "«الذين يعدون قُدّام الخيل»، أي الرَّجّالة [@tabrizi-ikhtiyarat، ج1 ص526]."
  - term: "اقْشَعَرَّتِ"
    text: "«تهيّأت للقتال، وتشمّرت» [@tabrizi-ikhtiyarat، ج1 ص526]."
