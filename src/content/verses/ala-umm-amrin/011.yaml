first: "إِذَا هُوَ أَمْسَى آبَ قُرَّةَ عَيْنِهِ"
second: "مَآبَ السَّعِيدِ لَمْ يَسَلْ أَيْنَ ظَلَّتِ"
vocabulary:
  - term: "آبَ"
    text: "رجع إلى ما يسرّه منها [@tabrizi-ikhtiyarat، ج1 ص519]."
  - term: "لَمْ يَسَلْ أَيْنَ ظَلَّتِ"
    text: "لم يسأل أين قضت نهارها، «لأنها لا تبرح بيتها» [@tabrizi-ikhtiyarat، ج1 ص519]."
