first: "وَهُنِّئَ بِي قَوْمٌ وَمَا إِنْ هَنَأْتُهُمْ"
second: "وَأَصْبَحْتُ فِي قَوْمٍ وَلَيْسُوا بِمَنْبِتِي"
vocabulary:
  - term: "هُنِّئَ بِي قَوْمٌ"
    text: "يقول: «هُنِّئ بي قوم وما انتفعوا بي. وذلك أنه أُخذ رهينة، ويقال: أُخذ في فدية، فبقي في القوم الذين أخذوه فصارت نصرته لهم» [@tabrizi-ikhtiyarat، ج1 ص529]."
  - term: "بِمَنْبِتِي"
    text: "بأصلي وعشيرتي."
