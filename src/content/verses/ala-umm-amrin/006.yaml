first: "لَقَدْ أَعْجَبَتْنِي لَا سَقُوطًا قِنَاعُهَا"
second: "إِذَا مَا مَشَتْ وَلَا بِذَاتِ تَلَفُّتِ"
meaning: "لقد أعجبتني أميمة: إذا مشت لم يسقط قناعها عن رأسها، ولم تكن تلتفت يمينًا وشمالًا."
vocabulary:
  - term: "قِنَاعُهَا"
    text: "ما تغطي به المرأة رأسها."
  - term: "سَقُوطًا"
    text: "كثير السقوط، على وزن «فَعُول» للمبالغة."
  - term: "تَلَفُّتِ"
    text: "الالتفات إلى الجانبين."
context: "في وصف أميمة، زوج الشاعر أو حبيبته. والبيت أول صفاتها الحسية: مشيتها. ويقول الأَصْمَعِيّ: «وصفها بالخَرادة والحياء، لأن المُريبة تتلفّت وتُسقط القناع» [@tabrizi-ikhtiyarat، ج1 ص516]، والخَرادة: الحياء والخفر."
syntax:
  - "«لا سقوطًا» منصوب على الحال من الضمير في «أعجبتني»، و«قناعُها» مرفوع به، أي: أعجبتني غيرَ ساقطٍ قناعها [@tabrizi-ikhtiyarat، ج1 ص515]."
  - "«ولا بذات تلفّت» معطوف على الحال في المعنى، «كأنه قال: أعجبتني لا ساقطةً ولا متلفّتةً» [@tabrizi-ikhtiyarat، ج1 ص516]."
  - "ويُروى «لا سقوطٌ» بالرفع، فيكون «قناعها» مبتدأ و«سقوط» خبرًا مقدمًا، أو يكون «سقوط» خبر مبتدأ محذوف: لا هي سقوط [@tabrizi-ikhtiyarat، ج1 ص516]."
  - "«إذا ما مشت» ظرف، و«ما» زائدة بعد «إذا»."
morphology:
  - "«سَقُوط» على «فَعُول» من أوزان المبالغة، يستوي فيه المذكر والمؤنث."
  - "«تَلَفُّت» مصدر «تلفّت» على «تفعّل»، وفيه معنى التكرار: التفات بعد التفات."
rhetoric:
  thesis: "صورة الحياء من خلال المشي: المرأة الحرة العفيفة تمشي مستورة لا تتلفت، فيستدل الشاعر بظاهر الحركة على باطن الخُلق."
  devices:
    - title: "الكناية في «لا سقوطًا قناعها»"
      text: "لم يقل إنها عفيفة حيية، بل ذكر ثبات القناع على رأسها وترك التلفت، وهما يلزمان الحياء في العادة، فدلّ بهما عليه. وهذا ما يفسره الأَصْمَعِيّ بقوله: «لأن المُريبة تتلفّت وتُسقط القناع» [@tabrizi-ikhtiyarat، ج1 ص516]. والكناية عند عبد القاهر أن يأتي المتكلم إلى معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "النفي في الوصف"
      text: "يصفها بما ليست عليه: «لا سقوطًا» «ولا بذات تلفّت». فالصورة تُبنى بنفي صفات المريبة، فيبقى في ذهن السامع ضدّها. وهذه قراءتنا."
  connection: "ثم يصف كرمها: تبيت بعد أن ينام الناس تُهدي غبوقها لجارتها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ التاء المكسورة، فهي تائية"
  scansion: "لَقَدْ أَعْ / جَبَتْنِي لَا / سَقُوطَنْ / قِنَاعُهَا = فعولن / مفاعيلن / فعولن / مفاعلن — إِذَا مَا / مَشَتْ وَلَا / بِذَاتِ / تَلَفْفُتِي = فعولن / مفاعلن / فعولُ / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. ودخل القبض «مفاعيلن» الثانية في العجز فصارت «مفاعلن»، و«فعولن» الثالثة فيه فصارت «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]."
