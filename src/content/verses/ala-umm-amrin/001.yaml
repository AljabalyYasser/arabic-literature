first: "أَلَا أُمُّ عَمْرٍو أَجْمَعَتْ فَاسْتَقَلَّتِ"
second: "وَمَا وَدَّعَتْ جِيرَانَهَا إِذْ تَوَلَّتِ"
meaning: "ألا إن أم عمرو عزمت على الرحيل فارتحلت، ومضت ولم تودّع جيرانها حين ولّت."
vocabulary:
  - term: "أَجْمَعَتْ"
    text: "عزمت، «يقال: «أجمعتُ» كذا، إذا عزمتَ عليه» [@tabrizi-ikhtiyarat، ج1 ص513]."
  - term: "فَاسْتَقَلَّتِ"
    text: "«ومعنى «استقلّت»: سارت» [@tabrizi-ikhtiyarat، ج1 ص514]."
  - term: "تَوَلَّتِ"
    text: "أدبرت ومضت."
context: "مطلع التائية. يبدأ الشَّنْفَرَى بامرأة ترحل فجأة، ثم يترك «أم عمرو» إلى أميمة في البيت الرابع، فهي مدخل إلى صورة المرأة التي يحبها. وفي رواية «الأغاني» أن الشَّنْفَرَى قالها في قتله حَزام بن جابر، قاتل أبيه [@aghani-dk، ج21 ص186]."
syntax:
  - "«ألا» حرف استفتاح وتنبيه، يلفت السامع إلى ما بعده."
  - "«أمُّ عمرٍو» مبتدأ، وجملة «أجمعت» خبره، و«فاستقلّت» معطوفة عليها بالفاء، والفاء للترتيب والتعقيب: عزمت فسارت في الحال."
  - "«وما ودّعت جيرانها» جملة معطوفة على الخبر، و«إذ تولّت» ظرف لما مضى من الزمان متعلق بـ«ودّعت»."
morphology:
  - "«أجمعت» على «أفعلت» من الجمع، والإجماع: العزم. وينقل التِّبْرِيزِيّ عن الخليل أن الإبل إذا جُمعت ثم سيقت فهو الإجماع، وإذا لم تُسَق فهو الجمع [@tabrizi-ikhtiyarat، ج1 ص513]."
  - "«استقلّت» على «استفعلت» من القِلّ، وأصل استقلّ الشيء: رفعه وحمله، ثم قيل للقوم إذا ارتحلوا: استقلّوا."
  - "«تولّت» على «تفعّلت» من وَلِيَ، أي أعطت ظهرها وذهبت."
rhetoric:
  thesis: "مطلع يبدأ بالرحيل لا بالوقوف على الأطلال: امرأة تقرر وتمضي في لحظة، والشاعر يشهد ذلك ولا يملك ردّه."
  devices:
    - title: "التصريع"
      text: "ختم الصدر بـ«فاستقلّت» على قافية العجز «تولّت». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. وهو من عادة المطالع، يُعلم السامع بالقافية من أول بيت."
    - title: "تتابع الأفعال"
      text: "في «أجمعت فاستقلّت» فعلان تربطهما الفاء بلا فاصل: العزم والرحيل شيء واحد. وسيعيد الشاعر هذا الإيقاع في البيت الثالث بخمسة أفعال متتابعة: «فباتت فأصبحت فقضّت أمورًا فاستقلّت فولّت». وهذه قراءتنا."
    - title: "الكناية في «وما ودّعت جيرانها»"
      text: "لم يقل إنها جافية أو مستعجلة، بل ذكر ترك الوداع، فدلّ به على عجلتها وقطعها ما بينها وبين جيرانها. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
  connection: "ثم يقول إنها استبدّت برأيها، وفاجأتهم بإبلها حتى أظلّتهم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ التاء المكسورة، فهي تائية"
  scansion: "أَلَا أُمْ / مُعَمْرِنْ أَجْ / مَعَتْ فَسْ / تَقَلْلَتِي = فعولن / مفاعيلن / فعولن / مفاعلن — وَمَا وَدْ / دَعَتْ جِيرَا / نَهَا إِذْ / تَوَلْلَتِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. والبيت مصرّع، وتُمدّ كسرة التاء في آخره فتُنطق «تِي»."
variants:
  - reading: "أَرَى أُمَّ عَمْرٍو أَجْمَعَتْ فَاسْتَقَلَّتِ"
    status: "رواية الأغاني"
    note: "[@aghani-dk، ج21 ص186]. ويذكر محقق شرح التِّبْرِيزِيّ أن في أصل التِّبْرِيزِيّ «أرى أم» ثم صوّبه فأثبت «ألا أم» [@tabrizi-ikhtiyarat، ج1 ص513]."
