explained: false
first: "إِذَا فَزِعُوا طَارَتْ بِأَبْيَضَ صَارِمٍ"
second: "وَرَامَتْ بِمَا فِي جَفْرِهَا ثُمَّ سَلَّتِ"
vocabulary:
  - term: "طَارَتْ"
    text: "«وثبت بسيف قاطع، أي: متقلّداً سيفه» [@tabrizi-ikhtiyarat، ج1 ص527]."
  - term: "جَفْرِهَا"
    text: "الجفر عند التِّبْرِيزِيّ: «الكنانة»، أي جعبة السهام؛ «يقول: يرمي بما في كنانته ثم يجالد بسيفه» [@tabrizi-ikhtiyarat، ج1 ص527]."
