first: "وَلَوْ لَمْ أَرِمْ فِي أَهْلِ بَيْتِيَ قَاعِدًا"
second: "إِذَنْ جَاءَنِي بَيْنَ العَمُودَيْنِ حُمَّتِي"
vocabulary:
  - term: "لَمْ أَرِمْ"
    text: "لم أبرح، «والفعل رام يريم إذا برح» [@lisan، ج12 ص259]."
  - term: "بَيْنَ العَمُودَيْنِ"
    text: "بين عمودَي البيت، أي وأنا قاعد في أهلي."
  - term: "حُمَّتِي"
    text: "منيّتي [@tabrizi-ikhtiyarat، ج1 ص522]."
