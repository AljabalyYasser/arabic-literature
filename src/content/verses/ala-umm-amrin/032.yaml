explained: false
first: "إِذَا مَا أَتَتْنِي مِيتَتِي لَمْ أُبَالِهَا"
second: "وَلَمْ تُذْرِ خَالَاتِي الدُّمُوعَ وَعَمَّتِي"
vocabulary:
  - term: "مِيتَتِي"
    text: "«الحالة التي يموت عليها الإنسان، وقد يراد بالمِيتة الموت... وهو المراد هنا» [@tabrizi-ikhtiyarat، ج1 ص530]."
  - term: "لَمْ تُذْرِ"
    text: "لم تُسِل الدموع؛ يقول: لم يُبكَ عليّ، «إما لانقطاع الإلف بيني وبينهم، أو لكثرة جرائري عليهم» [@tabrizi-ikhtiyarat، ج1 ص530]."
