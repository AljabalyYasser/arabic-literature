first: "وَإِنِّي لَحُلْوٌ إِنْ أُرِيدَتْ حَلَاوَتِي"
second: "وَمُرٌّ إِذَا نَفْسُ العَزُوفِ اسْتَمَرَّتِ"
meaning: "وإني لحلو لمن أراد حلاوتي وسالمني، ومرّ إذا استمرّت نفسُ العزوف على خلافي ومجانبتي."
vocabulary:
  - term: "العَزُوفِ"
    text: "«الراجع عن الشيء التارك له ظَلَفاً وعفّة» [@tabrizi-ikhtiyarat، ج1 ص531]."
  - term: "اسْتَمَرَّتِ"
    text: "مضت على حالها واستحكمت، وفيها مع ذلك معنى المرارة."
context: "في خاتمة القصيدة، بعد الغزو والثأر، يصف الشاعر نفسه. وفسّره ابن الأَنْبارِيّ كما ينقل التِّبْرِيزِيّ: «يقول: أنا سهلٌ لمن سامحني، ومرٌّ عند الخلاف عليّ» [@tabrizi-ikhtiyarat، ج1 ص531]."
syntax:
  - "«إنّي» حرف توكيد واسمه، و«لحلوٌ» خبرها، واللام هي اللام المزحلقة الداخلة على خبر «إنّ» للتوكيد."
  - "«إن أُريدت حلاوتي» شرط حُذف جوابه لدلالة ما قبله عليه، أي: إن أريدت حلاوتي فأنا حلو."
  - "«ومرٌّ» معطوف على «حلوٌ»، و«إذا نفس العزوف استمرّت» ظرف شرطي، و«نفسُ» فاعل لفعل محذوف يفسره «استمرّت»."
morphology:
  - "«العَزوف» على «فَعُول» من أوزان المبالغة، من عزف عن الشيء: انصرف عنه."
  - "«استمرّت» على «استفعلت» من المرور أو من المرارة، وهو موضع التورية في البيت."
rhetoric:
  thesis: "بيت الأخلاق الذي ينتهي إليه الصعلوك: لا عداوة بلا سبب، ولا مسالمة لمن خالف."
  devices:
    - title: "الطباق بين «حلو» و«مرّ»"
      text: "قابل بين الحلاوة والمرارة في شطري البيت، فجعل الخُلق الواحد طعمين بحسب من يلقاه. وهذا المعنى من المعاني السائرة في الفخر."
    - title: "الاستعارة في «حلو» و«مرّ»"
      text: "الحلاوة والمرارة من صفات الطعم، فاستعارهما للخُلق: لينه وشدته. والاستعارة عند عبد القاهر أن تجيء «إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الجناس في «استمرّت»"
      text: "لفظ «استمرّت» يحتمل المضيّ والاستحكام، ويحتمل أن تكون صارت مُرّة، فيلتقي مع «مُرّ» في أول الشطر. وهذه قراءتنا."
  connection: "ثم يختم: أبيّ لما آبى، سريع الرجوع إلى كل نفس تقصد مسرّتي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ التاء المكسورة، فهي تائية"
  scansion: "وَإِنْنِي / لَحُلْوُنْ إِنْ / أُرِيدَتْ / حَلَاوَتِي = فعولُ / مفاعيلن / فعولن / مفاعلن — وَمُرْرُنْ / إِذَا نَفْسُلْ / عَزُوفِسْ / تَمَرْرَتِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. ودخل القبض «فعولن» الأولى في الصدر [@atiq، ص29]."
variants:
  - reading: "وَمُرٌّ إِذَا نَفْسُ العَزُوفِ اقْشَعَرَّتِ"
    status: "رواية المرزوقي"
    note: "«وذكر الاقشعرار مثلاً للاجتواء والكراهة» [@tabrizi-ikhtiyarat، ج1 ص531]."
