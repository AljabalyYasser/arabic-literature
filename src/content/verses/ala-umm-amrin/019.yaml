first: "وَأُمِّ عِيَالٍ قَدْ شَهِدْتُ تَقُوتُهُمْ"
second: "إِذَا أَطْعَمَتْهُمْ أَوْتَحَتْ وَأَقَلَّتِ"
meaning: "وربّ أمّ عيال شهدتها تقوت عيالها، فإذا أطعمتهم قلّلت الطعام وقتّرت عليهم."
vocabulary:
  - term: "أُمِّ عِيَالٍ"
    text: "يريد تأبّط شرًّا، و«كانوا حين غزوا جعلوا طعامهم في يديه، فكان يقتّر عليهم مخافة أن تطول الغَزاة بهم فيموتوا جوعاً» [@tabrizi-ikhtiyarat، ج1 ص523]."
  - term: "تَقُوتُهُمْ"
    text: "تطعمهم القوت، وهو ما يمسك الرمق."
  - term: "أَوْتَحَتْ"
    text: "قلّلت، ويُروى «أحترت»، «والحَتْر: الشيء القليل» [@tabrizi-ikhtiyarat، ج1 ص523]."
context: "يبدأ هنا مقطع «أم العيال»، وهو أظرف ما في القصيدة: يصف قائد الغزاة، تأبّط شرًّا، بأنه أمّ لعيال جياع، والعيال هم الصعاليك. ويقول شوقي ضيف إنه يقص ذلك «في مداعبة طريفة له، إذ يدعوه أمهم، وهو وأصحابه عيالها» [@deif، ج1 ص381]."
syntax:
  - "الواو واو «ربّ»، و«أمِّ عيال» مجرور بـ«ربّ» محذوفة، وهو مبتدأ في المحل."
  - "«قد شهدتُ» جملة صفة لـ«أمّ عيال»، و«تقوتهم» حال من «أمّ عيال» أو جملة خبر."
  - "«إذا أطعمتهم أوتحت وأقلّت»: «إذا» ظرف شرطي، و«أوتحت» جوابه، و«أقلّت» معطوف عليه."
  - "حذف مفعولَي «أوتحت» و«أقلّت»، أي: أوتحت الطعام وأقلّته."
morphology:
  - "«أوتح» على «أفعل» من الوَتْح، وهو القليل التافه."
  - "«عِيال» جمع عَيِّل، وهو من يعوله الرجل وينفق عليه."
rhetoric:
  thesis: "الصعلوك يرى في رئيس عصابته أمًّا شحيحة رحيمة في آن: تقتّر عليهم خوفًا عليهم."
  devices:
    - title: "الاستعارة في «أم عيال»"
      text: "استعار للرجل اسم الأم، وللرفاق اسم العيال، ثم أجرى عليه أفعال الأم: تقوتهم وتطعمهم وتخاف عليهم. والاستعارة عند عبد القاهر «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. وقد صرّح التِّبْرِيزِيّ بالمراد: «وأراد بـ«أم عيال»: تأبّط شرًّا» [@tabrizi-ikhtiyarat، ج1 ص523]."
    - title: "الإلغاز"
      text: "يمضي الشاعر في الاستعارة أبياتًا كثيرة حتى يظن السامع أنه يتكلم عن امرأة، ثم يكشف المراد في البيت الرابع والعشرين. وهذا ما يسميه الأَصْمَعِيّ «كأوابد الأعراب الذين يُلغزون» [@tabrizi-ikhtiyarat، ج1 ص526]."
  connection: "ثم يقول إنها تخاف عليهم الفقر إن أكثرت لهم الطعام."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ التاء المكسورة، فهي تائية"
  scansion: "وَأُمْمِ / عِيَالِنْ قَدْ / شَهِدْتُ / تَقُوتُهُمْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — إِذَا أَطْ / عَمَتْهُمْ أَوْ / تَحَتْ وَ / أَقَلْلَتِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. ودخل القبض «فعولن» الأولى والثالثة في الصدر، والثالثة في العجز [@atiq، ص29]."
