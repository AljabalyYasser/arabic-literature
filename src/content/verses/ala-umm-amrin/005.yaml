first: "فَيَا جَارَتِي وَأَنْتِ غَيْرُ مُلِيمَةٍ"
second: "إِذَا ذُكِرَتْ وَلَا بِذَاتِ تَقَلَّتِ"
vocabulary:
  - term: "غَيْرُ مُلِيمَةٍ"
    text: "لا تأتي ما تُلام عليه."
  - term: "تَقَلَّتِ"
    text: "«تفعّلت من القِلى» [@tabrizi-ikhtiyarat، ج1 ص515]، والقِلى: البغض؛ أي ليست ممن تُبغض جارها ويُبغضها."
