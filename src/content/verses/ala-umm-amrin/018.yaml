first: "أُمَشِّي عَلَى أَيْنِ الغَزَاةِ وَبُعْدِهَا"
second: "يُقَرِّبُنِي مِنْهَا رَوَاحِي وَغَدْوَتِي"
vocabulary:
  - term: "أَيْنِ الغَزَاةِ"
    text: "تعب الغزو ومشقته؛ يقول: «أمشي على ما يصيبني، ويعرض لأصحابي من شِقّ الأنفس وبُعد المسافة، فيقرّبني من مغازيّ صِلَتي السيرَ بالسُّرى» [@tabrizi-ikhtiyarat، ج1 ص523]."
  - term: "رَوَاحِي وَغَدْوَتِي"
    text: "سيري في آخر النهار وفي أوله."
