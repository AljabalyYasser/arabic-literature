explained: false
first: "أُمَشِّي عَلَى الأَرْضِ الَّتِي لَنْ تَضُرَّنِي"
second: "لِأَنْكِيَ قَوْمًا أَوْ أُصَادِفَ حُمَّتِي"
vocabulary:
  - term: "أُمَشِّي"
    text: "«كأنه يغزو على رجليه» [@tabrizi-ikhtiyarat، ج1 ص522]."
  - term: "لَنْ تَضُرَّنِي"
    text: "«لا أخاف بها أحداً» [@tabrizi-ikhtiyarat، ج1 ص522]."
  - term: "لِأَنْكِيَ قَوْمًا"
    text: "لأصيب من العدو وأوقع بهم."
  - term: "حُمَّتِي"
    text: "منيّتي [@tabrizi-ikhtiyarat، ج1 ص522]."
