first: "كَأَنَّ لَهَا فِي الأَرْضِ نِسْيًا تَقُصُّهُ"
second: "عَلَى أَمِّهَا وَإِنْ تُكَلِّمْكَ تَبْلَتِ"
meaning: "إذا مشت أطرقت إلى الأرض كأنها تطلب فيها شيئًا ضاع منها، فهي لا ترفع رأسها ولا تلتفت؛ وإذا كلمتك قطعت كلامها ولم تطله."
vocabulary:
  - term: "نِسْيًا"
    text: "الشيء المنسيّ الضائع."
  - term: "تَقُصُّهُ"
    text: "تتبع أثره."
  - term: "عَلَى أَمِّهَا"
    text: "على قصدها، «و«أمّها»: قصدها الذي تريده» [@tabrizi-ikhtiyarat، ج1 ص518]."
  - term: "تَبْلَتِ"
    text: "«تنقطع في كلامها لا تطيله» [@tabrizi-ikhtiyarat، ج1 ص518]."
context: "من صفات أميمة. وهو أشهر أبيات القصيدة في الحياء، وفسّره التِّبْرِيزِيّ بقوله: «كأنها، من شدة حيائها، إذا مشت تطلب شيئًا ضاع منها، لا ترفع رأسها ولا تلتفت» [@tabrizi-ikhtiyarat، ج1 ص518]."
syntax:
  - "«كأنّ» حرف تشبيه، و«لها» خبرها مقدّم، و«نِسيًا» اسمها مؤخّر، و«في الأرض» متعلق بمحذوف صفة لـ«نسيًا»."
  - "جملة «تقصّه» صفة ثانية لـ«نسيًا»."
  - "«على أمّها» في موضع نصب على الحال، أي: تقصّه مؤتمّةً قصدها [@tabrizi-ikhtiyarat، ج1 ص518]."
  - "«وإن تكلّمك تبلت» جملة شرطية: «تكلّمك» فعل الشرط مجزوم، و«تبلت» جوابه مجزوم، وحُرّك بالكسر للقافية."
morphology:
  - "«نِسْي» على «فِعْل» بمعنى «مفعول»: الشيء المنسيّ، كالذِّبْح بمعنى المذبوح."
  - "«تَبْلِت» مضارع «بَلَت»، أي قطع."
rhetoric:
  thesis: "الحياء يُرى في هيئة المشي وفي قلة الكلام: عينها في الأرض، وكلامها قليل منقطع."
  devices:
    - title: "التشبيه في «كأنّ لها في الأرض نسيًا تقصّه»"
      text: "شبّه إطراقها في المشي بهيئة من ضاع منه شيء فهو يتتبعه بعينه في الأرض. والشبه هنا لا يُرى إلا بالتأمل في الهيئة كلها، لا في لون أو شكل. وعبد القاهر يقسم الشبه قسمين: «أحدهما أن يكون من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل، والآخر أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، وهذا من الثاني."
    - title: "الإيجاز في «وإن تكلّمك تبلت»"
      text: "ختم البيت بفعل واحد يصف كلامها كله: تبدأ ثم تقطع. ويجوز عند التِّبْرِيزِيّ أن يريد «أنها لنعمتها تنقطع نفسها عند المفاوضة» [@tabrizi-ikhtiyarat، ج1 ص518]، أي من رقة نشأتها."
  connection: "ثم يقول إن أخبارها لا تُخزي زوجها، فإذا ذُكرت النساء عفّت وجلّت."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ التاء المكسورة، فهي تائية"
  scansion: "كَأَنْنَ / لَهَا فِلْأَرْ / ضِ نِسْيَنْ / تَقُصْصُهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — عَلَى أَمْ / مِهَا وَإِنْ / تُكَلْلِمْ / كَ تَبْلِتِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. ودخل القبض «فعولن» الأولى في الصدر و«مفاعيلن» الثانية في العجز [@atiq، ص29]، وأُشبعت ضمة الهاء في «تقصّهُ» فصارت «هو»."
variants:
  - reading: "وَإِنْ تُكَلِّمْكَ تَبْلَتِ"
    status: "رواية ابن الأَنْبارِيّ والمرزوقي"
    note: "بفتح اللام، كما يذكر محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج1 ص517]."
  - reading: "تَقُصُّهُ عَلَى أُمِّهَا"
    status: "رواية الأغاني"
    note: "[@aghani-dk، ج21 ص187]، بضم الهمزة: كأنها تقصّه على أمها، فيكون المعنى أنها لا تفارق أمها."
