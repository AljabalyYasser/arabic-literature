explained: false
first: "جَزَيْنَا سَلَامَانَ بْنَ مُفْرِجَ قَرْضَهَا"
second: "بِمَا قَدَّمَتْ أَيْدِيهِمُ وَأَزَلَّتِ"
vocabulary:
  - term: "سَلَامَانَ بْنَ مُفْرِجَ"
    text: "«من الأزد، وهم بنو عمّ الشَّنْفَرَى» [@tabrizi-ikhtiyarat، ج1 ص528]."
  - term: "قَرْضَهَا"
    text: "جزاءَ ما قدّمت، «من قولهم: العوارف عند الناس قروض» [@tabrizi-ikhtiyarat، ج1 ص528]."
  - term: "أَزَلَّتِ"
    text: "أسدت من نعمة، يقال: أزلّ إليه نعمة."
