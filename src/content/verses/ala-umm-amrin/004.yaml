first: "فَوَاكَبِدَا عَلَى أُمَيْمَةَ بَعْدَمَا"
second: "طَمِعْتُ فَهَبْهَا نِعْمَةَ العَيْشِ زَلَّتِ"
vocabulary:
  - term: "فَوَاكَبِدَا"
    text: "نداء تفجّع، أي: يا لَكبدي من الحزن. ويُروى «فوا أسفا» [@tabrizi-ikhtiyarat، ج1 ص514]."
  - term: "فَهَبْهَا"
    text: "احسبها [@tabrizi-ikhtiyarat، ج1 ص514]."
  - term: "زَلَّتِ"
    text: "ذهبت وانقضت كما يزلّ الشيء من اليد."
