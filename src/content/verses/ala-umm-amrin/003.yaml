explained: false
first: "بِعَيْنَيَّ مَا أَمْسَتْ فَبَاتَتْ فَأَصْبَحَتْ"
second: "فَقَضَّتْ أُمُورًا فَاسْتَقَلَّتْ فَوَلَّتِ"
vocabulary:
  - term: "بِعَيْنَيَّ"
    text: "بمرأى مني؛ يقول التِّبْرِيزِيّ: «بعينيّ جرت هذه الخطوب، لأن مُشاهِد الفجائع ليس كمن مُنِيَ بها على بُعد» [@tabrizi-ikhtiyarat، ج1 ص514]."
  - term: "قَضَّتْ أُمُورًا"
    text: "أنجزت حاجاتها قبل الرحيل."
