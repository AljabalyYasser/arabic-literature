explained: false
first: "أَلَا لَا تَعُدْنِي إِنْ تَشَكَّيْتُ خُلَّتِي"
second: "شَفَانِي بِأَعْلَى ذِي البُرَيْقَيْنِ عَدْوَتِي"
vocabulary:
  - term: "لَا تَعُدْنِي"
    text: "«لفظه نهي، والمراد: لا يشُقَّنّ ذلك عليك، فقد اشتفيت بعَدْوتي، فلا تظنّنّ أني متشكٍّ فتتكلّف عيادتي» [@tabrizi-ikhtiyarat، ج1 ص530]."
  - term: "خُلَّتِي"
    text: "هي «الخليل» [@tabrizi-ikhtiyarat، ج1 ص530]."
  - term: "ذِي البُرَيْقَيْنِ"
    text: "موضع."
