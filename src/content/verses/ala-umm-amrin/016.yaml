first: "خَرَجْنَا مِنَ الوَادِي الَّذِي بَيْنَ مِشْعَلٍ"
second: "وَبَيْنَ الجَبَا هَيْهَاتَ أَنْشَأْتُ سُرْبَتِي"
vocabulary:
  - term: "هَيْهَاتَ"
    text: "«من أسماء الأفعال، ومعناه: بَعُدَ. وقد يفيد مع البعد معنى التعجّب، كأنه يريد: ما أبعد ما رميت بأصحابي!» [@tabrizi-ikhtiyarat، ج1 ص522]."
  - term: "أَنْشَأْتُ سُرْبَتِي"
    text: "«أطلعت أصحابي» [@tabrizi-ikhtiyarat، ج1 ص522]، والسُّرْبة: الجماعة."
