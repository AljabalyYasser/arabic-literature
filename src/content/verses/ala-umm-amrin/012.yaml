first: "فَدَقَّتْ وَجَلَّتْ وَاسْبَكَرَّتْ وَأُكْمِلَتْ"
second: "فَلَوْ جُنَّ إِنْسَانٌ مِنَ الحُسْنِ جُنَّتِ"
meaning: "دقّ منها ما يُستحسن دقّته، وعظُم ما يُستحسن عظمه، واعتدلت قامتها، وكملت خِلقتها؛ فلو جُنّ إنسان من فرط الحسن لكانت هي التي تُجنّ."
vocabulary:
  - term: "دَقَّتْ وَجَلَّتْ"
    text: "دقّت في محاسنها وجلّت في منصبها، أو «دَقّ من أعضائها ما يُستحبّ دِقّته، وفَخُم ما يُستحبّ فخامته» [@tabrizi-ikhtiyarat، ج1 ص519]."
  - term: "اسْبَكَرَّتْ"
    text: "«اعتدلت، وقد يكون الاسبكرار: الاسترسال» [@tabrizi-ikhtiyarat، ج1 ص519]."
  - term: "جُنَّتِ"
    text: "أصابها الجنون، أو سُترت عن العيون."
context: "ذروة وصف أميمة: بعد الحياء والكرم يصل إلى الجمال. وقد عدّ الأَصْمَعِيّ هذه الأبيات «أحسنَ ما قيل في خَفَر امرأة وعفّتها» [@tabrizi-ikhtiyarat، ج1 ص519]."
syntax:
  - "أربعة أفعال ماضية متعاطفة بالواو، فاعلها ضمير أميمة."
  - "«فلو جُنّ إنسان من الحسن جُنّت»: «لو» حرف امتناع لامتناع، و«جُنّ إنسان» فعل الشرط مبني للمجهول، و«جُنّت» جوابه، و«من الحسن» متعلق بـ«جُنّ»، و«من» فيه للتعليل."
  - "«أُكملت» مبني للمجهول: أكملها الخالق، فلم يذكر الفاعل لأنه معلوم."
morphology:
  - "«اسبكرّت» على «افعلَلّت»، وهو بناء يدل على المبالغة في الصفة."
  - "«جُنّ» و«جُنّت» فعلان مبنيان للمجهول من الجنون، ولا يكاد يُستعمل منه المبني للمعلوم بهذا المعنى."
rhetoric:
  thesis: "بيت يجمع الجمال كله في أربعة أفعال، ثم يرفعه فوق طاقة البشر."
  devices:
    - title: "المبالغة في «فلو جُنّ إنسان من الحسن جُنّت»"
      text: "يذكر التِّبْرِيزِيّ للعبارة ثلاثة وجوه: أن يريد «لو سُتر إنسان عن العيون، صيانةً له عن الابتذال، لفُعل بهذه»؛ أو أن يريد «لو جُنّ إنسانٌ تفكّراً فيما تفرّد به من الجمال لكانت هذه»؛ أو أن معناه: «لو أُخرج من البشرية إنسان ونُسب إلى الجن، لما مُنح من الحسن، لكانت هذه. وهذا مبنيّ على ما يقوله العامة من حسن الغِيلان» [@tabrizi-ikhtiyarat، ج1 ص520]."
    - title: "التقسيم في «فدقّت وجلّت»"
      text: "أعطى كل عضو ما يليق به: الدقة لما يُستحسن دقيقًا، والضخامة لما يُستحسن ضخمًا، ثم جمع ذلك كله بـ«أُكملت». وهذه قراءتنا على تفسير التِّبْرِيزِيّ الثاني."
    - title: "الجناس في «جُنّ» و«جُنّت»"
      text: "كرر الفعل نفسه في الشرط والجواب، فربط الإنسان العاشق بالمرأة المعشوقة في لفظ واحد."
  connection: "ثم يذكر ليلة باتها معها، فكأن البيت حُجِّر حولهم بريحانة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ التاء المكسورة، فهي تائية"
  scansion: "فَدَقْقَتْ / وَجَلْلَتْ وَسْ / بَكَرْرَتْ / وَأُكْمِلَتْ = فعولن / مفاعيلن / فعولن / مفاعلن — فَلَوْ جُنْ / نَ إِنْسَانُنْ / مِنَلْحُسْ / نِ جُنْنَتِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن."
