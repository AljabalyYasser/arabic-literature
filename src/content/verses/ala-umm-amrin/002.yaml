explained: false
first: "وَقَدْ سَبَقَتْنَا أُمُّ عَمْرٍو بِأَمْرِهَا"
second: "وَكَانَتْ بِأَعْنَاقِ المَطِيِّ أَظَلَّتِ"
vocabulary:
  - term: "سَبَقَتْنَا أُمُّ عَمْرٍو بِأَمْرِهَا"
    text: "استبدّت برأيها فلم تشاورنا [@tabrizi-ikhtiyarat، ج1 ص514]."
  - term: "بِأَعْنَاقِ المَطِيِّ أَظَلَّتِ"
    text: "فاجأتنا بإبلها حتى أظلّتنا، أي أقبلت رواحلها علينا فجأة [@tabrizi-ikhtiyarat، ج1 ص514]. والمطيّ: الإبل يُركب ظهرها."
