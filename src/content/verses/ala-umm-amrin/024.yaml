first: "وَتَأْتِي العَدِيَّ بَارِزًا نِصْفُ سَاقِهَا"
second: "تَجُولُ كَعَيْرِ العَانَةِ المُتَلَفِّتِ"
meaning: "وتأتي العَدِيّ، أي الرجّالة الذين يعدون أمام الخيل، مشمّرةً قد بدا نصف ساقها، تجول كما يجول حمار الوحش المتلفّت الذي يحمي أُتُنه."
vocabulary:
  - term: "العَدِيَّ"
    text: "«اسم موضوع لا واحد له من لفظه. وهم الذين يعدون قُدّام الخيل» [@tabrizi-ikhtiyarat، ج1 ص526]."
  - term: "بَارِزًا نِصْفُ سَاقِهَا"
    text: "مشمّرة جادّة، «يعني: أنه متشمّر جادّ» [@tabrizi-ikhtiyarat، ج1 ص526]."
  - term: "عَيْرِ العَانَةِ"
    text: "حمار الوحش بين قطيع أُتُنه، والعانة: القطيع منها."
  - term: "المُتَلَفِّتِ"
    text: "الذي يلتفت يمينًا وشمالًا حذرًا."
context: "آخر صور «أم العيال»، وفيه ينكشف اللغز: امرأة لا تشمّر عن ساقها أمام المقاتلين. قال التِّبْرِيزِيّ: «وإنما وصفها بهذا ليُعلَم أنه لا يعني امرأة. قال الأَصْمَعِيّ: وكنايته عن تأبّط شرًّا كأوابد الأعراب الذين يُلغزون» [@tabrizi-ikhtiyarat، ج1 ص526]."
syntax:
  - "«بارزًا» حال من فاعل «تأتي»، و«نصفُ ساقها» مرفوع به فاعلًا، «وارتفع «نصف ساقها» بقوله «بارزاً»» [@tabrizi-ikhtiyarat، ج1 ص526]."
  - "«تجول» جملة في موضع نصب على الصفة لـ«بارزًا» أو حال ثانية، و«كعيرِ» في موضع الحال [@tabrizi-ikhtiyarat، ج1 ص526]."
  - "ذكّر «بارزًا» وهو حال من ضمير المؤنث، لأنه رفع اسمًا ظاهرًا مذكرًا هو «نصف»، والصفة تتبع ما بعدها إذا رفعته."
morphology:
  - "«العَدِيّ» اسم جمع على «فَعِيل»، لا مفرد له من لفظه."
  - "«المتلفّت» اسم فاعل من «تلفّت» على «تفعّل»، وفيه معنى التكرار."
rhetoric:
  thesis: "تنكشف المرأة رجلًا مقاتلًا: التشمير والجولان صفتان لا تكونان في الأم الحيية، بل في قائد الغزاة."
  devices:
    - title: "الكناية في «بارزًا نصف ساقها»"
      text: "كشف الساق كناية عن الجدّ والاستعداد للأمر الشديد، كما قال أبو جُنْدَب الهُذَليّ فيما ينشده التِّبْرِيزِيّ: «أُشمِّرُ حتى ينصف الساقَ مئزري» [@tabrizi-ikhtiyarat، ج1 ص526]. والكناية أن يُذكر معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "التشبيه في «كعير العانة المتلفّت»"
      text: "شبّهه بحمار الوحش «لأن الحمار أغير ما يكون، فهو يتفلّت إلى الحمير يطردها عن أُتُنه» [@tabrizi-ikhtiyarat، ج1 ص526]. فالشبه في الغيرة والحماية والحركة الدائمة حول القطيع، كما يحمي القائد أصحابه."
    - title: "الإلغاز"
      text: "البيت مفتاح اللغز الذي بدأ في البيت التاسع عشر، ولذلك قال فيه الأَصْمَعِيّ إنه من «أوابد الأعراب الذين يُلغزون» [@tabrizi-ikhtiyarat، ج1 ص526]."
  connection: "ثم يصفها إذا فزع القوم: تطير بسيف أبيض وترمي بما في جعبتها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ التاء المكسورة، فهي تائية"
  scansion: "وَتَأْتِلْ / عَدِيْيَ بَا / رِزَنْ نِصْ / فُ سَاقِهَا = فعولن / مفاعيلن / فعولن / مفاعلن — تَجُولُ / كَعَيْرِلْ عَا / نَةِلْ مُتْ / تَلَفْفِتِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض، وهي آخر تفعيلة في الصدر، مقبوضة «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضَّرْب، وهو آخر تفعيلة في العَجُز، مقبوض مثلها «لتصير مفاعيلن مفاعلن» [@atiq، ص30]. والقبض: حذف الخامس الساكن. ودخل القبض «فعولن» الأولى في العجز فصارت «فعولُ» [@atiq، ص29]."
variants:
  - reading: "تَجُولُ كَعَيْرِ العَانَةِ المُتَفَلِّتِ"
    status: "رواية التِّبْرِيزِيّ"
    note: "[@tabrizi-ikhtiyarat، ج1 ص526]، والمتفلّت: الذي يتفلّت إلى الحمير يطردها. ويذكر محققه أن رواية ابن الأَنْبارِيّ «المتلفّت»."
