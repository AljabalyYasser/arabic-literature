first: "شَفَيْنَا بِعَبْدِ اللَّهِ بَعْضَ غَلِيلِنَا"
second: "وَعَوْفٍ لَدَى المَعْدَى أَوَانَ اسْتَهَلَّتِ"
vocabulary:
  - term: "غَلِيلِنَا"
    text: "«حرارة العطش. وهو ههنا العطش إلى القتل» [@tabrizi-ikhtiyarat، ج1 ص530]."
  - term: "المَعْدَى"
    text: "«موضع القتال» [@tabrizi-ikhtiyarat، ج1 ص530]."
  - term: "اسْتَهَلَّتِ"
    text: "تكون للحرب، أي «ارتفعت الأصوات فيها» [@tabrizi-ikhtiyarat، ج1 ص530]."
