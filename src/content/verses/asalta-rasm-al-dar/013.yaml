first: "يَسْقُونَ مَنْ وَرَدَ الْبَرِيصَ عَلَيْهِمُ"
second: "بَرَدَى يُصَفَّقُ بِالرَّحِيقِ السَّلْسَلِ"
meaning: "يسقون من ورد البريص، وهو نهر دمشق، ماء بَرَدى ممزوجًا بالخمر الصافية العذبة."
vocabulary:
  - term: "الْبَرِيصَ"
    text: "«البريص: نهر بدمشق»، كما في حاشية محقق الأغاني [@aghani-dk، ج15 ص157]. ويقول محقق «الشعر والشعراء»: «موضع بدمشق، ورجح ياقوت أنه اسمه الغوطة بأجمعها» [@ibn-qutayba، ج1 ص296]."
  - term: "بَرَدَى"
    text: "«أعظم نهر بدمشق» [@ibn-qutayba، ج1 ص296]، في حاشية المحقق."
  - term: "يُصَفَّقُ"
    text: "«وصَفَّقَ الشرابَ: مزجَه»، و«حوَّله مِنْ إِناء إِلى إِناء لِيَصْفُو»، ويستشهد ابن منظور بالبيت [@lisan، ج10 ص202]."
  - term: "الرَّحِيقِ"
    text: "«الرَّحِيقُ: مِنْ أَسماء الْخَمْرِ»، وقيل: «صَفُوة الْخَمْرِ» [@lisan، ج10 ص114]."
  - term: "السَّلْسَلِ"
    text: "«الْمَاءُ العَذْب السَّلِس السَّهْل فِي الحَلْقِ» [@lisan، ج11 ص343]."
syntax:
  - "«مَنْ» اسم موصول مفعول أول لـ«يَسْقُونَ»، وجملة «وَرَدَ الْبَرِيصَ» صلته، و«عَلَيْهِمُ» متعلق بـ«وَرَدَ»."
  - "«بَرَدَى» مفعول ثانٍ، أي ماء بردى."
  - "«يُصَفَّقُ» جملة حالية من «بَرَدَى»."
morphology:
  - "«يُصَفَّقُ» مضارع مجهول من «صفّق» المضعّف."
  - "«السَّلْسَل» على وزن «فَعْلَل»، رباعي مضعّف."
rhetoric:
  thesis: "الكرم بالماء والخمر معًا، في مدينة الأنهار."
  devices:
    - title: "المجاز في «بَرَدَى»"
      text: "سمّى النهر وأراد ماءه، والنهر لا يُسقى. وهو إطلاق للمحلّ وإرادة الحالّ فيه."
    - title: "تقابل العذب والصافي"
      text: "«بِالرَّحِيقِ السَّلْسَلِ»: الرحيق صفوة الخمر، والسلسل العذب السهل. فالشراب صافٍ لا كدر فيه ولا حدّة."
  connection: "ثم يكمل صورة الترف: يُسقون الرحيق، ولا تُدعى ولائدهم لنقف الحنظل."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، وبعدها ياء تنشأ من إشباع الكسرة: «ـلِي»"
  scansion: "يَسْقُونَ مَنْ / وَرَدَلْ بَرِي / صَ عَلَيْهِمُو = متْفاعلن / متَفاعلن / متَفاعلن — بَرَدَى يُصَفْ / فَقُ بِرْرَحِي / قِسْسَلْسَلِي = متَفاعلن / متَفاعلن / متْفاعلن"
context: "يرويه ابن سَلّام بعد البيت 7 [@ibn-sallam، ج1 ص218]، وابن قُتَيْبة بعد البيت 11 [@ibn-qutayba، ج1 ص296]. وفي الأغاني «كأسًا تُصَفَّق بالرحيق السلسل» [@aghani-dk، ج15 ص157]."
