first: "لِلَّهِ دَرُّ عِصَابَةٍ نَادَمْتُهُمْ"
second: "يَوْمًا بِجِلِّقَ فِي الزَّمَانِ الْأَوَّلِ"
meaning: "لله درّ جماعة نادمتهم يومًا بدمشق في الزمن الأول. يتعجب من كرمهم ويمدحهم."
vocabulary:
  - term: "لِلَّهِ دَرُّ"
    text: "عبارة تعجب ومدح، والدَّرّ في الأصل اللبن، ثم صار للخير والعطاء."
  - term: "عِصَابَةٍ"
    text: "جماعة من الناس."
  - term: "نَادَمْتُهُمْ"
    text: "شربت معهم، و«النَّدِيمُ: الشَّرِيبُ الَّذِي يُنادِمه» [@lisan، ج12 ص572]."
  - term: "جِلِّقَ"
    text: "دمشق: «قَالَ ابْنُ بَرِّيٍّ: جَلَقَ اسْمُ دِمَشق»، ويستشهد بالبيت [@lisan، ج10 ص36]."
syntax:
  - "«لِلَّهِ» خبر مقدم، و«دَرُّ» مبتدأ مؤخر، و«عِصَابَةٍ» مضاف إليه. والجملة إنشاء تعجب بلفظ الخبر."
  - "«نَادَمْتُهُمْ» صفة لـ«عِصَابَةٍ»، و«يَوْمًا» و«بِجِلِّقَ» و«فِي الزَّمَانِ الْأَوَّلِ» متعلقات بها."
  - "«جِلِّقَ» ممنوعة من الصرف هنا للعلمية والتأنيث، وفي اللسان أنها «يُصْرَفُ وَلَا يُصْرَفُ» [@lisan، ج10 ص36]."
morphology:
  - "«نَادَمْتُ» على وزن «فاعل» من «ندم»، والمفاعلة للمشاركة في الشرب."
  - "«عِصَابَة» على وزن «فِعَالة»."
rhetoric:
  thesis: "البيت الذي تبدأ به رواية الأغاني للقصيدة، وفيه يتحول الطلل إلى ذكرى المجلس."
  devices:
    - title: "التعجب بـ«لِلَّهِ دَرُّ»"
      text: "صيغة مدح موروثة: ينسب الخير الصادر عنهم إلى الله تعجبًا من كثرته."
    - title: "الزمان الأول"
      text: "«فِي الزَّمَانِ الْأَوَّلِ»: يضع المجلس في زمن مضى، فالبيت مدح وحنين معًا. وهو يقوله شيخًا يتذكر شبابه، كما سيقول في البيت 19."
  connection: "ثم يصف هيئة هؤلاء الندماء في حللهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، وبعدها ياء تنشأ من إشباع الكسرة: «ـلِي»"
  scansion: "لِلْلَاهِ دَرْ / رُ عِصَابَتِنْ / نَادَمْتُهُمْ = متْفاعلن / متَفاعلن / متْفاعلن — يَوْمَنْ بِجِلْ / لِقَ فِزْزَمَا / نِلْ أَوْوَلِي = متْفاعلن / متَفاعلن / متْفاعلن"
context: "يروي أبو الفَرَج بإسناده إلى حسّان أنه أتى جبلة بن الأيهم وعنده النابغة وعلقمة، فأنشداه، ثم أنشده حسّان «لله درّ عصابة نادمتهم» وأبياتًا بعدها [@aghani-dk، ج15 ص157]. وفي حاشية المحقق على هذا البيت: «هذا البيت لم يرو فى ط، ها، مط» [@aghani-dk، ج15 ص157]، أي في بعض أصول الأغاني. وهو عند ابن سَلّام أول ما ينشده منها [@ibn-sallam، ج1 ص218]."
