first: "أَسَأَلْتَ رَسْمَ الدَّارِ أَمْ لَمْ تَسْأَلِ"
second: "بَيْنَ الْجَوَابِي فَالْبُضَيْعِ فَحَوْمَلِ"
meaning: "أسألتَ أثر الدار بين الجوابي والبُضَيْع وحَوْمَل، أم لم تسأله؟ يبدأ بسؤال نفسه عن وقوفه بالطلل."
vocabulary:
  - term: "رَسْمَ الدَّارِ"
    text: "أثرها الباقي بعد رحيل أهلها."
  - term: "الْجَوَابِي"
    text: "موضع بالشام. وفي رواية أبي عَمْرو الشَّيْبانيّ عند أبي الفَرَج «الحوابي»، ويقول محقق الأغاني إن الديوان «الجوابي» [@aghani-dk، ج15 ص158]."
  - term: "الْبُضَيْعِ"
    text: "يقول محقق الأغاني: «البضيع، بالتصغير: جبل بالشام أسود» [@aghani-dk، ج15 ص158]."
  - term: "حَوْمَلِ"
    text: "موضع."
syntax:
  - "«أَسَأَلْتَ» الهمزة للاستفهام، و«أَمْ» معادلة لها، أي: أسألت أم لم تسأل؟"
  - "«بَيْنَ الْجَوَابِي» ظرف متعلق بمحذوف حال من «رَسْمَ الدَّارِ»، و«فَالْبُضَيْعِ فَحَوْمَلِ» معطوفان بالفاء."
morphology:
  - "«الْبُضَيْعُ» تصغير «بَضْع» أو «بِضْع»، وكثيرًا ما تأتي أسماء المواضع مصغّرة."
  - "«تَسْأَلِ» مضارع مجزوم بـ«لم»، وكُسرت لامه للقافية، وأصلها السكون."
rhetoric:
  thesis: "يبدأ بالطلل كما يبدأ امرؤ القيس، بل بأسماء تذكّر بمعلقته."
  devices:
    - title: "الاستفهام المتردد"
      text: "«أَسَأَلْتَ ... أَمْ لَمْ تَسْأَلِ»: يخاطب نفسه، ولا يعرف أيسأل الدار أم يعرض عنها، فيصير التردد نفسه حزنًا."
    - title: "صدى امرئ القيس"
      text: "«فَحَوْمَلِ» في آخر البيت تذكّر بـ«بين الدخول فحومل» في مطلع معلقة امرئ القيس. فحسّان يضع نفسه في سنّة الطلل الكبرى، ثم يجعل الطلل في الشام."
    - title: "التصريع"
      text: "اتفقت «تَسْأَلِ» و«حَوْمَلِ» في الوزن والرويّ، وهو تصريع المطلع."
  connection: "ثم يواصل عدّ المواضع: مرج الصُّفَّرين وجاسم وديار سلمى."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، وبعدها ياء تنشأ من إشباع الكسرة: «ـلِي»"
  scansion: "أَسَأَلْتَ رَسْ / مَدْدَارِ أَمْ / لَمْ تَسْأَلِي = متَفاعلن / متْفاعلن / متْفاعلن — بَيْنَلْ جَوَا / بِي فَلْبُضَيْ / عِ فَحَوْمَلِي = متْفاعلن / متْفاعلن / متَفاعلن"
  note: "الكامل: «متفاعلن» ست مرات، ويكثر فيه الإضمار، وهو تسكين الثاني فتصير «متْفاعلن» [@atiq، ص59]."
context: "مطلع القصيدة التي يُروى أن حسّان أنشدها ملك غسّان. وفي رواية أبي عَمْرو الشَّيْبانيّ أنه أنشدها عَمْرو بن الحارث، فقال: «هات يا ابن الفريعة. فأنشأت: أسألت رسم الدار أم لم تسأل» [@aghani-dk، ج15 ص158]."
