first: "بِيضُ الْوُجُوهِ كَرِيمَةٌ أَحْسَابُهُمْ"
second: "شُمُّ الْأُنُوفِ مِنَ الطِّرَازِ الْأَوَّلِ"
meaning: "بيض الوجوه، كريمة أحسابهم، عالية أنوفهم عزة، من الطراز الأول، أي من الطبقة الأولى والطراز القديم في الكرم."
vocabulary:
  - term: "بِيضُ الْوُجُوهِ"
    text: "كناية عن نقاء العرض والكرم."
  - term: "أَحْسَابُهُمْ"
    text: "جمع حَسَب، وهو ما يُعدّ من مآثر الرجل وآبائه."
  - term: "شُمُّ الْأُنُوفِ"
    text: "جمع أشمّ، وهو المرتفع قصبة الأنف، كناية عن العزة والأنفة. وفي اللسان يستشهد بالبيت في الأنف [@lisan، ج9 ص12]."
  - term: "الطِّرَازِ الْأَوَّلِ"
    text: "الطراز: النمط والطبقة."
syntax:
  - "«بِيضُ» خبر لمبتدأ محذوف، أي: هم بيض الوجوه، وهو من إضافة الصفة المشبهة إلى فاعلها في المعنى."
  - "«كَرِيمَةٌ أَحْسَابُهُمْ» «كَرِيمَةٌ» خبر ثانٍ، و«أَحْسَابُهُمْ» فاعل الصفة المشبهة."
  - "«شُمُّ الْأُنُوفِ» خبر ثالث، و«مِنَ الطِّرَازِ الْأَوَّلِ» متعلق بمحذوف خبر رابع."
morphology:
  - "«بِيض» جمع «أبيض» على وزن «فُعْل»، كُسرت الباء لمناسبة الياء، وأصلها «بُيْض»."
  - "«شُمّ» جمع «أشمّ» على وزن «فُعْل»."
rhetoric:
  thesis: "بيت سائر في المدح بالأصالة، اختاره شوقي ضَيْف مثالًا لجاهلية حسّان."
  devices:
    - title: "الكنايات المتتابعة"
      text: "«بِيضُ الْوُجُوهِ» و«شُمُّ الْأُنُوفِ»: صفتان في الجسد يُراد بهما صفتان في الخلق، النقاء والعزة. وهي كناية بمعناها عند عبد القاهر: يومئ إلى المعنى بما يلزمه في الوجود [@dalail، ج1 ص66]."
    - title: "الطراز الأول"
      text: "«مِنَ الطِّرَازِ الْأَوَّلِ»: استعار الطراز، وهو نقش الثوب ونمطه، للجيل والطبقة، فجعل الممدوحين نسيجًا قديمًا كريمًا لم يتغير."
  connection: "ثم يعود إلى نفسه: كيف علا إليهم من أرض البريص."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، وبعدها ياء تنشأ من إشباع الكسرة: «ـلِي»"
  scansion: "بِيضُلْ وُجُو / هِ كَرِيمَتُنْ / أَحْسَابُهُمْ = متْفاعلن / متَفاعلن / متْفاعلن — شُمْمُلْ أُنُو / فِ مِنَطْ طِرَا / زِلْ أَوْوَلِي = متْفاعلن / متَفاعلن / متْفاعلن"
context: "يقول شوقي ضَيْف إنه يوثّق شعر حسّان الجاهلي، ويذكر من رائعه «لاميته التى يمدح بها الغساسنة» بهذا البيت [@deif، ج2 ص81]. وهو في خبر جبلة عند أبي الفَرَج [@aghani-dk، ج15 ص158]."
