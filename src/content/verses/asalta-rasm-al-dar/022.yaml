first: "يَسْعَى عَلَيَّ بِكَأْسِهَا مُتَنَطِّفٌ"
second: "فَيَعُلُّنِي مِنْهَا وَلَوْ لَمْ أَنْهَلِ"
vocabulary:
  - term: "فَيَعُلُّنِي"
    text: "يسقيني مرة بعد مرة: «العَلُّ والعَلَلُ: الشَّرْبةُ الثَّانِيَةُ»، و«يُقَالُ: عَلَلٌ بَعْدَ نَهَلٍ» [@lisan، ج11 ص467]، فالنَّهَل الشربة الأولى."
