first: "إِنَّ الَّتِي نَاوَلْتَنِي فَرَدَدْتُهَا"
second: "قُتِلَتْ قُتِلْتَ فَهَاتِهَا لَمْ تُقْتَلِ"
vocabulary:
  - term: "قُتِلَتْ"
    text: "مُزجت بالماء: «وقَتَل الْخَمْرَ قَتْلًا: مَزَجَهَا فأَزال بِذَلِكَ حِدَّتها»، ويستشهد بالبيت [@lisan، ج11 ص551]."
  - term: "قُتِلْتَ"
    text: "«دُعَاءٌ عَلَيْهِ أَي قَتَلك اللَّهُ لِمَ مَزَجْتَهَا» [@lisan، ج11 ص551]."
