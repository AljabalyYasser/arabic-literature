first: "يُغْشَوْنَ حَتَّى مَا تَهِرُّ كِلَابُهُمْ"
second: "لَا يَسْأَلُونَ عَنِ السَّوَادِ الْمُقْبِلِ"
meaning: "يكثر الناس على بيوتهم حتى ألفت كلابهم الضيوف فلا تنبح عليهم، ولا يسألون عن الشخص المقبل من بعيد: من هو، لأنهم يقرون كل قادم."
vocabulary:
  - term: "يُغْشَوْنَ"
    text: "يقصدهم الناس ويأتونهم."
  - term: "تَهِرُّ"
    text: "تصوّت دون النباح كارهة: «وهَرَّ الكلبُ إِليه يَهِرُّ هَرِيراً» [@lisan، ج5 ص260]."
  - term: "السَّوَادِ الْمُقْبِلِ"
    text: "الشخص يُرى من بعيد مقبلًا، والسواد: الشخص."
syntax:
  - "«يُغْشَوْنَ» فعل مضارع مبني للمجهول، والواو نائب الفاعل."
  - "«حَتَّى» حرف ابتداء، وما بعدها جملة مستأنفة: «مَا تَهِرُّ كِلَابُهُمْ»."
  - "«لَا يَسْأَلُونَ» جملة حالية أو مستأنفة."
morphology:
  - "«يُغْشَوْنَ» مضارع «غُشِيَ» المجهول، أصله «يُغْشَيُونَ»، حُذفت الياء لالتقاء الساكنين."
  - "«تَهِرُّ» مضارع «هرّ» المضعّف على «فعَل يفعِل»."
rhetoric:
  thesis: "أشهر بيت في القصيدة، جعله القدماء من أمدح ما قالت العرب."
  devices:
    - title: "الكناية عن الكرم"
      text: "لم يقل إنهم كرماء، بل ذكر لازمين من لوازم الكرم: كلاب لا تهرّ لأنها ألفت الضيوف، وقوم لا يسألون عن القادم. وهذا هو باب الكناية عند عبد القاهر، كقولهم «كثير رماد القدر» يعنون «كثير القرى» [@dalail، ج1 ص66]."
    - title: "الصورة من بعيد"
      text: "«السَّوَادِ الْمُقْبِلِ»: يرسم شخصًا لم تتبيّن ملامحه بعد، فالسؤال عنه طبيعي، ومع ذلك لا يسألون."
  connection: "ثم يصف ما يسقون به ضيوفهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، وبعدها ياء تنشأ من إشباع الكسرة: «ـلِي»"
  scansion: "يُغْشَوْنَ حَتْ / تَى مَا تَهِرْ / رُ كِلَابُهُمْ = متْفاعلن / متْفاعلن / متَفاعلن — لَا يَسْأَلُو / نَ عَنِسْ سَوَا / دِلْ مُقْبِلِي = متْفاعلن / متَفاعلن / متْفاعلن"
context: "يروي ابن رَشِيق: «لما حضرت الحطيئة الوفاة قال: أبلغوا الأنصار أن أخاهم أمدح الناس حيث يقول» هذا البيت، ثم يذكر من خالفه في أمدح بيت [@ibn-rashiq، ج2 ص139]. وهو عند ابن سَلّام [@ibn-sallam، ج1 ص218] وابن قُتَيْبة [@ibn-qutayba، ج1 ص297] وفي خبر جبلة عند أبي الفَرَج [@aghani-dk، ج15 ص158]."
