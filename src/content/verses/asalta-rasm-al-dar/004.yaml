first: "دِمَنٌ تَعَاقَبَهَا الرِّيَاحُ دَوَارِسٌ"
second: "وَالْمُدْجِنَاتُ مِنَ السِّمَاكِ الْأَعْزَلِ"
vocabulary:
  - term: "دِمَنٌ"
    text: "«دِمْنةُ الدَّارِ: أَثَرُها» [@lisan، ج13 ص157]."
  - term: "الْمُدْجِنَاتُ"
    text: "السحب المظلمة، من الدَّجْن: «الدَّجْنُ: ظلُّ الْغَيْمِ» [@lisan، ج13 ص147]."
  - term: "السِّمَاكِ الْأَعْزَلِ"
    text: "«كوكبٌ عَلَى المَجرَّة»، وهو «مِنْ مَنَازِلِ الْقَمَرِ» [@lisan، ج11 ص442]، تُنسب إليه أمطار."
