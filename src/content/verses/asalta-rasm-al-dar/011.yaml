first: "أَوْلَادُ جَفْنَةَ حَوْلَ قَبْرِ أَبِيهِمُ"
second: "قَبْرِ ابْنِ مَارِيَةَ الْكَرِيمِ الْمُفْضِلِ"
meaning: "هم أولاد جَفْنة، مقيمون حول قبر أبيهم ابن مارية، الكريم صاحب الفضل. أي أنهم في ديار آبائهم لم يرحلوا عنها."
vocabulary:
  - term: "أَوْلَادُ جَفْنَةَ"
    text: "«وآلُ جَفْنةَ: مُلوكٌ مِنْ أَهل الْيَمَنِ كَانُوا اسْتَوْطَنُوا الشأْم» [@lisan، ج13 ص91]، وهم الغَساسِنة."
  - term: "ابْنِ مَارِيَةَ"
    text: "يقول ابن قُتَيْبة: «وابن مارية هو الحارث الأعرج بن أبى شمر الغسّانىّ» [@ibn-qutayba، ج1 ص297]. ومارية في حاشية محقق كتابه «بنت الأرقم بن عمرو بن ثعلبة بن جفنة» [@ibn-qutayba، ج1 ص296]."
  - term: "الْمُفْضِلِ"
    text: "صاحب الفضل والإحسان."
syntax:
  - "«أَوْلَادُ» خبر لمبتدأ محذوف، أي: هم أولاد جفنة."
  - "«حَوْلَ قَبْرِ أَبِيهِمُ» ظرف متعلق بمحذوف حال."
  - "«قَبْرِ ابْنِ مَارِيَةَ» بدل من «قَبْرِ أَبِيهِمُ»، و«الْكَرِيمِ الْمُفْضِلِ» صفتان لابن مارية."
morphology:
  - "«الْمُفْضِل» اسم فاعل من «أفضل» على وزن «أفعل»، بمعنى أحسن."
  - "«أَوْلَاد» جمع «وَلَد» على وزن «أفعال»."
rhetoric:
  thesis: "مدح الملوك بالأصالة: هم في أرض آبائهم، وقبر الجد شاهد عليهم."
  devices:
    - title: "الكناية بالقبر"
      text: "«حَوْلَ قَبْرِ أَبِيهِمُ»: لا يقول إنهم ملوك مستقرون أعزّة، بل إنهم مقيمون حول قبر أبيهم. وفي اللسان: «وأَراد بِقَوْلِهِ عِنْدَ قَبْرِ أَبيهم أَنهم فِي مَسَاكِنَ آبَائِهِمْ ورِباعِهم الَّتِي كَانُوا ورِثُوها عَنْهُمْ» [@lisan، ج13 ص91]. والكناية عند عبد القاهر أن يومئ المتكلم إلى المعنى بمعنى «هو تاليه وردفه في الوجود» [@dalail، ج1 ص66]."
    - title: "البدل"
      text: "«قَبْرِ أَبِيهِمُ قَبْرِ ابْنِ مَارِيَةَ»: يكرر «قبر» ليسمّي الجد بعد أن أبهمه، فيعظّمه."
  connection: "ثم يصف كرمهم: بيوتهم مقصودة لا تنبح كلابها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، وبعدها ياء تنشأ من إشباع الكسرة: «ـلِي»"
  scansion: "أَوْلَادُ جَفْ / نَةَ حَوْلَ قَبْ / رِ أَبِيهِمُو = متْفاعلن / متَفاعلن / متَفاعلن — قَبْرِبْنِ مَا / رِيَةَلْ كَرِي / مِلْمُفْضِلِي = متْفاعلن / متَفاعلن / متْفاعلن"
context: "من أشهر أبيات حسّان في الغساسنة. يذكره ابن قُتَيْبة في «جيّد شعره» فيهم [@ibn-qutayba، ج1 ص296]، وابن سَلّام بعد بيتين [@ibn-sallam، ج1 ص218]. وفي الأغاني «عند قبر أبيهم» [@aghani-dk، ج15 ص157]، وفي اللسان «حول» [@lisan، ج13 ص91]."
