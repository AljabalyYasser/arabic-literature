first: "وَلَقَدْ شَرِبْتُ الْخَمْرَ فِي حَانُوتِهَا"
second: "صَهْبَاءَ صَافِيَةً كَطَعْمِ الْفُلْفُلِ"
meaning: "ولقد شربت الخمر في حانوتها، أي عند بائعها، صهباء صافية حادّة كطعم الفلفل."
vocabulary:
  - term: "حَانُوتِهَا"
    text: "«الحانُوتُ، مَعْرُوفٌ، وَقَدْ غَلَبَ عَلَى حانوتِ الخَمَّار» [@lisan، ج2 ص26]، أي دكان بائع الخمر."
  - term: "صَهْبَاءَ"
    text: "الخمر التي يميل لونها إلى الحمرة والشقرة."
syntax:
  - "«وَلَقَدْ» الواو استئنافية، واللام موطئة لقسم محذوف، و«قد» للتحقيق."
  - "«صَهْبَاءَ» حال من «الْخَمْرَ»، و«صَافِيَةً» حال ثانية، و«كَطَعْمِ الْفُلْفُلِ» متعلق بمحذوف حال ثالثة أو صفة."
morphology:
  - "«صَهْبَاء» صفة على وزن «فعلاء»، مؤنث «أصهب»."
  - "«حَانُوت» على وزن «فاعول»، وأصله فيما يرى بعضهم معرّب."
rhetoric:
  thesis: "بداية الفخر باللهو الجاهلي: الشاعر في حانوت الخمّار."
  devices:
    - title: "التشبيه بالطعم"
      text: "«كَطَعْمِ الْفُلْفُلِ»: يشبّه حدّة الخمر في اللسان بحرارة الفلفل. وهو تشبيه حسّي من جهة الذوق، والوجه فيه بيّن لا يحتاج إلى تأويل. ويسمّي عبد القاهر هذا الضرب ما يكون «من جهة أمر بيّن لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "التوكيد"
      text: "«وَلَقَدْ شَرِبْتُ»: لام القسم وقد، فالشاعر يؤكد الخبر كأنه ينتظر من ينكره."
  connection: "ثم يصف الساقي والكأس."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، وبعدها ياء تنشأ من إشباع الكسرة: «ـلِي»"
  scansion: "وَلَقَدْ شَرِبْ / تُلْ خَمْرَ فِي / حَانُوتِهَا = متَفاعلن / متْفاعلن / متْفاعلن — صَهْبَاءَ صَا / فِيَتَنْ كَطَعْ / مِلْ فُلْفُلِي = متْفاعلن / متَفاعلن / متْفاعلن"
context: "الأبيات 21–25 خمرية يمضي فيها حسّان على سنّة الجاهليين، وهي مما يختاره القدماء من هذه القصيدة: يرويها ابن الشجري في حماسته [@diwan-hassan، ص76]."
