explained: false
first: "إِمَّا تَرَيْ رَأْسِي تَغَيَّرَ لَوْنُهُ"
second: "شَمَطًا فَأَصْبَحَ كَالثَّغَامِ الْمُحْوِلِ"
vocabulary:
  - term: "شَمَطًا"
    text: "«والشَمَطُ: بَيَاضُ شَعْرِ الرأْسِ يُخالِطُ سَواده» [@lisan، ج7 ص336]."
  - term: "الثَّغَامِ"
    text: "«نَبْت ... يَكُونُ فِي الجَبل ينبُت أَخضر ثُمَّ يَبْيَضُّ إِذا يَبِس» [@lisan، ج12 ص77]، يُشبّه به الشيب."
  - term: "الْمُحْوِلِ"
    text: "الذي أتى عليه الحول فيبس. وفي اللسان روايتان للبيت بـ«المُمْحِل» [@lisan، ج11 ص617]."
