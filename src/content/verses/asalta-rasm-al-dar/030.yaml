first: "وَتَزُورُ أَبْوَابَ الْمُلُوكِ رِكَابُنَا"
second: "وَمَتَى نُحَكَّمْ فِي الْبَرِيَّةِ نَعْدِلِ"
meaning: "وتزور إبلنا أبواب الملوك، فنحن من أهل مجالسهم، ومتى جُعلنا حكّامًا في الناس عدلنا."
vocabulary:
  - term: "رِكَابُنَا"
    text: "إبلنا التي نركبها، لا واحد لها من لفظها."
  - term: "الْبَرِيَّةِ"
    text: "الناس والخلق."
syntax:
  - "«رِكَابُنَا» فاعل «تَزُورُ» مؤخر، و«أَبْوَابَ» مفعوله."
  - "«وَمَتَى نُحَكَّمْ» «متى» اسم شرط جازم، و«نُحَكَّمْ» فعل الشرط مجزوم مبني للمجهول، و«نَعْدِلِ» جوابه مجزوم، وكُسر للقافية."
morphology:
  - "«نُحَكَّمْ» مضارع «حكّم» المضعّف، مبني للمجهول."
  - "«الرِّكَاب» اسم جمع على وزن «فِعَال»."
rhetoric:
  thesis: "يجمع في بيت صفتين من صفات السادة في الجاهلية: الوفادة على الملوك، والحكم بين الناس."
  devices:
    - title: "المجاز العقلي"
      text: "«وَتَزُورُ أَبْوَابَ الْمُلُوكِ رِكَابُنَا»: أسند الزيارة إلى الإبل، والزائرون أصحابها. فالإبل تعرف الطريق إلى الملوك لكثرة ما تسير إليهم."
    - title: "الشرط في «وَمَتَى نُحَكَّمْ»"
      text: "يجعل العدل جوابًا لازمًا لكل تحكيم، فلا يقع منهم حكم إلا عدلًا. وفيه إشارة إلى قومه حكّام يثرب، ومنهم جدّه المنذر بن حرام الذي حكم يوم سُمَيْحة."
  connection: "ثم يصف فتى يحب الحمد يجعل ماله دون أبيه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة، وبعدها ياء تنشأ من إشباع الكسرة: «ـلِي»"
  scansion: "وَتَزُورُ أَبْ / وَابَلْ مُلُو / كِ رِكَابُنَا = متَفاعلن / متْفاعلن / متَفاعلن — وَمَتَى نُحَكْ / كَمْ فِلْ بَرِيْ / يَةِ نَعْدِلِي = متَفاعلن / متْفاعلن / متَفاعلن"
context: "هذا البيت ليس في مخطوطة «طا»، وهو في «ط» [@diwan-hassan، ص76]. وحكومة المنذر بن حرام جد حسّان يوم سُمَيْحة يرويها ابن سَلّام [@ibn-sallam، ج1 ص216]."
