first: "بِزُجَاجَةٍ رَقَصَتْ بِمَا فِي قَعْرِهَا"
second: "رَقَصَ الْقَلُوصِ بِرَاكِبٍ مُسْتَعْجِلِ"
vocabulary:
  - term: "رَقَصَتْ"
    text: "اضطربت بما فيها لكثرته، وفي اللسان أن حسّان أراد بالزجاجة الباطية العظيمة التي «إِذَا وُضِعَ فِيهَا القَدَحُ سَحَّتْ بِهِ ورَقَصَتْ» [@lisan، ج14 ص74]."
