first: "تُهِينُ النُّفُوسَ وَهُونُ النُّفُوـ"
second: "ـسِ يَوْمَ الْكَرِيهَةِ أَبْقَى لَهَا"
meaning: "تستهين بالأرواح، والاستهانة بالأرواح يوم الحرب أبقى لها. وللقدماء في «أبقى» قولان يذكرهما الشرح المنسوب إلى ثَعْلَب: «أبقى لها: في الذكر؛ أي أبقى ذكرًا»، و«يقال: معناه إذا غامرتْ وغشيت القتال كان أسلم لها من الانهزام. قال: سمعت القولين جميعًا» [@diwan-khansa، ص106]. فالذي لا يبالي بالموت إما أن يبقى اسمه بعده، وإما أن ينجو، لأن الثبات في القتال أسلم من الفرار."
vocabulary:
  - term: "تُهِينُ"
    text: "تستخفّ ولا تبالي. والفاعل في نص ثَعْلَب المخاطَب، أي معاوية، أو الكتيبة. ويرويه ابن الأعرابي «نُهِين» بالنون [@diwan-khansa، ص106]."
  - term: "وَهُونُ"
    text: "الهوان. في الشرح: «الهُوْن: الهَوان بعينه، أهنتُه إهانةً وهَوانًا، وهانَ هُونًا»، و«وهُون النفوس على أربابها ألّا يبالوا يوم الحفيظة أقُتلوا أم سلموا» [@diwan-khansa، ص105]. وفي لسان العرب: «وَقِيلَ: الهُونُ الهَوانُ والهَوْنُ الرِّفق» [@lisan، ج13 ص439]، فهي بضم الهاء لا بفتحها."
  - term: "الْكَرِيهَةِ"
    text: "الحرب. في الشرح: «والكريهة: الحرب» [@diwan-khansa، ص105]."
context: "قلب مقطع الكتيبة (25–27): بعد صورة الجيش كالسحاب تأتي القاعدة التي يقاتل بها. والبيت يُروى حكمةً قائمة بنفسها: يورده ابن عبد رَبِّه في باب ما يُتمثّل به في الحرب، بعد قوله «وكان يزيد بن المهلّب يتمثل كثيرا في الحرب بقول حصين بن الحمام»، وبيت الحُصَين: «تأخّرت أستقي الحياة فلم أجد ... لنفسي حياة مثل أن أتقدّما»، ثم «وقالت الخنساء» وينشد البيت [@iqd، ج1 ص95]. ويرويه أبو الفَرَج في المرثية التي يجعلها في معاوية [@aghani-dk، ج15 ص92]."
syntax:
  - "«تُهِينُ» فعل مضارع، وفاعله ضمير مستتر تقديره «أنت»، خطابًا لمعاوية كسائر أفعال هذا الجزء من القصيدة («نَازَلْتَ»، «جَعَلْتَ»، «سُقْتَهَا»)، ويجوز أن يعود على الكتيبة. و«النُّفُوسَ» مفعول به."
  - "«وَهُونُ النُّفُوسِ» الواو استئنافية، و«هُونُ» مبتدأ مرفوع، و«النُّفُوسِ» مضاف إليه، و«يَوْمَ» ظرف متعلق بـ«هُون»، و«أَبْقَى» خبر المبتدأ، و«لَهَا» متعلق بـ«أَبْقَى». وضبطت النشرة «وهُونِ» بالكسر [@diwan-khansa، ص105]، ولا وجه له في الإعراب، فهو مبتدأ خبره «أبقى»، وبالرفع ضبطه أبو الفَرَج [@aghani-dk، ج15 ص92]."
morphology:
  - "«هُون» مصدر «هانَ يَهُونُ»، كما في الشرح: «وهانَ هُونًا» [@diwan-khansa، ص105]. و«تُهِينُ» مضارع «أَهانَ» على «أَفْعَلَ»، فالفعل والمصدر من جذر واحد (هـ و ن)."
  - "«أَبْقَى» اسم تفضيل على «أَفْعَل» من «بَقِيَ»، وألفه منقلبة عن الياء."
  - "«الْكَرِيهَة» على «فَعِيلَة» بمعنى «مَفْعُولة»: الحرب التي تُكره، ثم صارت اسمًا لها."
rhetoric:
  thesis: "حكمة الشجاع: من لا يبالي بالموت أقرب إلى النجاة وأبقى ذكرًا."
  devices:
    - title: "المفارقة بالطباق"
      text: "«هُونُ النُّفُوسِ ... أَبْقَى لَهَا»: الهوان يقابل البقاء، والمعنى الظاهر أن من يُهين نفسه يُهلكها، فجاء البيت بعكسه. والطباق الجمع بين الضدين."
    - title: "الاشتقاق والتكرار"
      text: "«تُهِينُ» و«هُونُ» من جذر واحد، و«النُّفُوسَ» مكررة في الشطر الأول. فالكلمات تعود على نفسها، كأن البيت يُبرهن على حكمته بلفظه."
    - title: "الحكمة"
      text: "البيت كله حكم عام لا يخص معاوية وحده، ولذلك استشهد له القدماء بقول بشر بن أبي خازم: «ولا يُنجي من الغمرات إلّا / براكاءُ القتال أو الفرارُ» [@diwan-khansa، ص106]، وفي الأغاني «كقول بشر بن أبى خازم» [@aghani-dk، ج15 ص95]. والبراكاء: الثبات في المعركة."
  connection: "ثم تقول إن قومها يعلمون أن منايا الرجال تبلغهم حين يحين وقتها."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، وقبلها ألف، وبعدها «هَا»"
  scansion: "تُهِينُنْ / نُفُوسَ / وَهُونُنْ / نُفُو = فعولن / فعولُ / فعولن / فعَلْ — سِ يَوْمَلْ / كَرِيهَ / تِ أَبْقَى / لَهَا = فعولن / فعولُ / فعولن / فعَلْ"
  note: "في البيت تدوير: كلمة «النُّفُوسِ» الثانية مقسومة بين الشطرين، آخرها «سِ» أول العجز. ودخل القبضُ التفعيلة الثانية من الشطرين، والعروض والضرب محذوفان «فعَلْ» [@atiq، ص121]."
