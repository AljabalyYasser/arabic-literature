first: "حَدِيدُ الْفُؤَادِ ذَلِيقُ اللِّسَانِ"
second: "يُجَازِي الْمَقَارِضَ أَمْثَالَهَا"
vocabulary:
- term: "ذَلِيقُ اللِّسَانِ"
  text: "حادّه، «وذَلَقُ اللِّسَانِ كذَلَقِ السِّنان» [@lisan، ج1 ص204]."
- term: "الْمَقَارِضَ"
  text: "ما يُفعل به أو يُقال له من سوء. في لسان العرب: «والمُقارَضةُ: تَكُونُ فِي العَمَلِ السَّيِء والقَوْلِ السَّيِء» [@lisan، ج7 ص217]."
