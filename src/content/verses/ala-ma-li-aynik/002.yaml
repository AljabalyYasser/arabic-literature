first: "أَبَعْدَ ابْنِ عَمْرٍو مِنَ آلِ الشَّرِيـ"
second: "ـدِ حَلَّتْ بِهِ الْأَرْضُ أَثْقَالَهَا"
meaning: "أبعد ابن عمرو، من آل الشَّرِيد، تزيّنت الأرض بمن فيها من الموتى إذ دُفن فيها؟ أو: ألقت الأرض أثقالها بموته؟ وفي الشرح المنسوب إلى ثَعْلَب للبيت تفسيران: «قال أبو عمرو: تريد زيّنتْ به الأرضُ موتاها. وفسّره السلميّون على ما فسّره أبو عمرو. وقال الأموي والأصمعي وغيرهما: تريد أنّ معاوية كان ثقيلًا على الأرض»، فلما مات «انحلّ ذلك الثقل الذي كان عليها»، ثم يرجّح: «والقول قول أبي عمرو والسلميّين» [@diwan-khansa، ص79]. وعلى التفسير الأول صار الميت حِلْية لبطن الأرض، وعلى الثاني كان ثِقلًا على ظهرها تحمله، أي أنه كان يملأ الأرض بخيله وحروبه."
vocabulary:
  - term: "الشَّرِيدِ"
    text: "جدّ الخنساء وأخويها، وهي تُماضِر بنت عمرو بن الحارث بن الشَّرِيد. وفي لسان العرب: «وَبَنُو الشَّريدِ: حَيٌّ، مِنْهُمْ صَخْرٌ أَخو الْخَنْسَاءِ»، ثم ينشد هذا البيت ويقول: «وبنو الشَّريدِ: بَطْنٌ مِنْ سُلَيْم» [@lisan، ج3 ص238]."
  - term: "حَلَّتْ"
    text: "فيها قولان يرويهما أبو عُبَيْدة: «حلت من الحلية أى زيّنت به الأرض موتاها، حين دفن بها. وقال بعضهم: حلّت من حللت الشىء. والمعنى ألقت مراسيها، كأنّه كان ثقلا عليها» [@aghani-dk، ج15 ص93]. وكذلك في الشرح: «وقال بعضهم: حلّت من الحِلْيَة، وقال بعضهم: حلّت من حَلَلْتُ الشيء» [@diwan-khansa، ص80]."
  - term: "أَثْقَالَهَا"
    text: "على التفسير الأول: موتاها. قال المُبَرِّد: «حلت من الحلي»، ثم: «تقول: زينت به الأرض الموتى. وقال المفسرون في قول الله عز وجل: {وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا}»، ثم قال: «قالوا الموتى» [@kamil، ج4 ص43]. وفي لسان العرب: «أَثْقَالُها: كنوزُها ومَوْتَاها» [@lisan، ج11 ص85]."
context: "البيت الذي يسمّي الميت، ولا يسمّيه إلا بأبيه: «ابن عمرو». وصخر ومعاوية كلاهما ابن عمرو بن الشَّرِيد، فاللفظ نفسه لا يحسم لمن قيلت القصيدة، ولذلك يرويه ابن عبد رَبِّه «أمن بعد صخر» [@iqd، ج3 ص224]. ويرى أبو عُبَيْدة أن جواب الاستفهام في البيت التالي: «قال: جوابُ «أبعد» فى «آسى» أى أبعد ابن عمرو آسى وأسأل نائحة مالها» [@aghani-dk، ج15 ص94]. وبعده في الأغاني بين معقوفين، من زيادة نسخة بولاق كما يقول محققو طبعة دار الكتب: «وقال أبو عبيدة: هذا البيت لمية بنت ضرار بن عمرو الضبية ترثى أخاها» [@aghani-dk، ج15 ص94]. وفي الشرح المنسوب إلى ثَعْلَب أن لمَيّة بنت ضِرار بيتًا يشبه البيت الرابع من هذه القصيدة [@diwan-khansa، ص83]."
syntax:
  - "الهمزة للاستفهام، و«بَعْدَ» ظرف زمان منصوب متعلق بالفعل «حَلَّتْ»، و«ابْنِ» مضاف إليه، و«عَمْرٍو» مضاف إليه. و«مِنَ آلِ الشَّرِيدِ» جار ومجرور في موضع الحال من «ابن عمرو»."
  - "«حَلَّتْ» فعل ماض، و«الْأَرْضُ» فاعله، و«أَثْقَالَهَا» مفعول به. والباء في «بِهِ» على التفسير الأول للآلة: زيّنت به موتاها، وعلى الثاني للسبب: ألقت أثقالها بموته."
  - "يقول أبو عُبَيْدة: «اللفظ لفظ الاستفهام والمعنى خبر، كما قال جرير: ألستم خير من ركب المطايا ... وأندى العالمين بطون راح» [@aghani-dk، ج15 ص93]، فالسؤال تقرير لحال لا طلب لجواب. ويجعل جوابه في «آسى» من البيت التالي [@aghani-dk، ج15 ص94]، فالبيتان متعلق أحدهما بالآخر، وهو ما يسمّيه ابن رَشِيق التضمين: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
morphology:
  - "«حَلَّتْ» صورة واحدة لفعلين: من «حَلَّى يُحَلِّي» إذا زيّن، والأصل «حَلَّيَتْ» فحُذفت الألف المنقلبة عن الياء قبل تاء التأنيث كما في «رَمَتْ»؛ ومن «حَلَّ يَحُلُّ» إذا فكّ وأطلق. فاختلاف التفسيرين راجع إلى اختلاف الجذر: (ح ل ي) و(ح ل ل)."
  - "«أَثْقَال» جمع «ثِقْل» على «أَفْعال»: «والثِّقْل: الحِمْل الثَّقِيل، وَالْجَمْعُ أَثْقَال مِثْلَ حِمْل وأَحمال» [@lisan، ج11 ص85]."
rhetoric:
  thesis: "تجعل موت أخيها حدثًا تحسّ به الأرض نفسها: إما تتزيّن به في بطنها، وإما تستريح من ثقله على ظهرها."
  devices:
    - title: "الاستعارة"
      text: "في «حَلَّتْ بِهِ الْأَرْضُ أَثْقَالَهَا» صارت الأرض كائنًا يتزيّن أو يُلقي حمله. فعلى قول أبي عمرو هي امرأة تلبس حُلِيّها، وعلى القول الآخر هي سفينة «ألقت مراسيها» كما في الشرح [@diwan-khansa، ص80]. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الاستفهام الخارج إلى الخبر"
      text: "«أَبَعْدَ ابْنِ عَمْرٍو» سؤال في لفظه، وخبر في معناه كما قال أبو عُبَيْدة [@aghani-dk، ج15 ص93]: لقد تزيّنت الأرض به. والسؤال أوقع في النفس، لأنه يدعو السامع إلى أن يجيب هو بما يعرفه."
    - title: "التسمية بالنسب"
      text: "«ابْنِ عَمْرٍو مِنَ آلِ الشَّرِيدِ» تسمّي أخاها بأبيه وجدّه، فيصير موته فقدًا لبيت كامل من بني سُلَيْم، لا لرجل واحد."
  connection: "ثم يأتي جواب السؤال: لا أحزن بعده على هالك، ولا أسأل نائحة عن مصيبتها."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، وقبلها ألف، وبعدها «هَا»"
  scansion: "أَبَعْدَبْ / نِ عَمْرِنْ / مِنَالِشْ / شَرِي = فعولن / فعولن / فعولن / فعَلْ — دِ حَلْلَتْ / بِهِلْ أَرْ / ضُ أَثْقَا / لَهَا = فعولن / فعولن / فعولن / فعَلْ"
  note: "في البيت تدوير: كلمة «الشَّرِيدِ» مقسومة بين الشطرين، آخرها «دِ» أول العجز. والتدوير أن تشترك كلمة بين الصدر والعجز. و«مِنَ آلِ» تُقرأ بنقل فتحة الهمزة إلى النون وحذف الهمزة: «مِنَالِ»، وبهذا ضبطتها النشرة ولسان العرب بفتح النون [@lisan، ج3 ص238]، وبه يستقيم الوزن. والعروض والضرب محذوفان «فعَلْ» [@atiq، ص121]."
variants:
  - reading: "أَمِنْ بَعْدِ صَخْرٍ مِنَ آلِ الشَّرِيدِ"
    status: "رواية العقد"
    note: "[@iqd، ج3 ص224]. وبها يصير البيت في صخر صراحة. والمُبَرِّد وأبو الفَرَج ولسان العرب يروونه «أبعد ابن عمرو» كما في نص ثَعْلَب."
