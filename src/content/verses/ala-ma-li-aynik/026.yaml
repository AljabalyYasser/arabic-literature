first: "كَكِرْفِئَةِ الْغَيْثِ ذَاتِ الصَّبِيـ"
second: "ـرِ تَرْمِي السَّحَابَ وَيُرْمَى لَهَا"
meaning: "هذه الكتيبة، التي ذكرتها في البيت السابق، كأنها سحابة مطر ضخمة، فوقها سحاب أبيض متراكم، تنضمّ هي إلى السحاب، وينضمّ السحاب إليها، فتكبر وتشتد. وفي الشرح المنسوب إلى ثَعْلَب عن زائدة: «أي ككرفئة سحاب الغيث في كثافتها وضخمها» [@diwan-khansa، ص103]. وشبّهتها بالسحاب لكثرتها وحركتها، كما يقول الأخفش شارح ديوانها في الخزانة: «وشبه الرجراجة في كثرتها وحركتها وتمخضها بالكرفئة، وهي السحابة العظيمة التي يركب بعضها على بعض» [@khizana، ج1 ص51]."
vocabulary:
  - term: "كَكِرْفِئَةِ"
    text: "الكِرْفِئة: القطعة من السحاب. قال الأَصْمَعِيّ: «الكِرفئة، وجمعها كِرفئ: قِطع من السحاب بعضها فوق بعض» [@aghani-dk، ج15 ص95]."
  - term: "الْغَيْثِ"
    text: "المطر."
  - term: "الصَّبِيرِ"
    text: "في لسان العرب: «والصَّبِيرُ: السَّحَابُ الأَبيض الَّذِي يصبرُ بَعْضُهُ فَوْقَ بَعْضٍ دَرَجًا؛ قَالَ يصِف جَيْشاً: كَكِرْفِئَة الغَيْث ذاتِ الصبِير» [@lisan، ج4 ص439]."
  - term: "تَرْمِي السَّحَابَ وَيُرْمَى لَهَا"
    text: "في تفسير الأغاني: «أى تنضمّ إليه وتتّصل به. ويرمى لها، أى ينضمّ إليها السحاب حتى يستوى» [@aghani-dk، ج15 ص95]. وفي الشرح: «يقال رُمي لهذا السحاب؛ إذا اجتمع إليه» [@diwan-khansa، ص103]."
context: "من مقطع الكتيبة (25–27): في البيت السابق «وَرَجْرَاجَةٍ فَوْقَهَا بَيْضُهَا»، والرجراجة الكتيبة، وهذا البيت يشبّهها. وهو أكثر أبيات القصيدة نزاعًا في نسبته: في الشرح نفسه: «قال ابن الأعرابي: هذا البيت لعامر بن جوين الطائي» [@diwan-khansa، ص104]، والخبر نفسه في الخزانة [@khizana، ج1 ص52]. ويروي الزمخشريّ، فيما ينقله البغداديّ، صدره في أبيات لعامر أولها «وَجَارِيَةٍ مِنْ بَنَاتِ الْمُلُوكِ»، ثم يقول البغداديّ: «وقد رأيت البيتين الأولين في شعر الخنساء من قصيدة ترثي بها أخاها صخرا» [@khizana، ج1 ص50–51]. ويقول ابن بَرِّيّ في لسان العرب: «هَذَا الصَّدْرُ يَحْتَمِلُ أَن يَكُونَ صَدْرًا لِبَيْتِ عَامِرُ بْنُ جُوَيْنٍ الطَّائِيُّ» [@lisan، ج4 ص439]. وعند عامر وصفٌ لجارية، وعند الخنساء وصفٌ لكتيبة. وعامر بن جُوَيْن هو الذي يروي له أبو الفَرَج البيتين 5 و6 من هذه القصيدة [@aghani-dk، ج9 ص96]."
syntax:
  - "«كَكِرْفِئَةِ» الكاف حرف تشبيه، والجار والمجرور في موضع الصفة لـ«رَجْرَاجَةٍ» في البيت السابق، فالبيتان متعلق أحدهما بالآخر. و«الْغَيْثِ» مضاف إليه."
  - "«ذَاتِ الصَّبِيرِ» صفة لـ«كِرْفِئَةِ» مجرورة، و«ذَاتِ» بمعنى صاحبة."
  - "«تَرْمِي السَّحَابَ» جملة في موضع الصفة الثانية. و«وَيُرْمَى لَهَا» فعل مبني للمجهول، ونائب الفاعل ضمير السحاب. ويقول الأخفش: «بالبناء للمفعول، أي: يضم إليها حتى يستوي ويخلولق» [@khizana، ج1 ص52]."
morphology:
  - "«كِرْفِئَة» رباعي على «فِعْلِلَة»، وجمعه «كِرْفِئ» كما قال الأَصْمَعِيّ [@aghani-dk، ج15 ص95]."
  - "«صَبِير» على «فَعِيل»، من «صَبَرَ» إذا حبس وجمع، لأنه سحاب يركب بعضه بعضًا [@lisan، ج4 ص439]."
  - "«تَرْمِي» و«يُرْمَى» من فعل واحد، الأول مبني للمعلوم والثاني للمجهول، فالسحابة فاعلة ومفعول لها في وقت واحد."
rhetoric:
  thesis: "تشبّه جيش أخيها بسحاب مطر يزداد كلما سار: يلحق غيرَه ويلحقه غيرُه."
  devices:
    - title: "التشبيه التمثيلي"
      text: "في «كَكِرْفِئَةِ الْغَيْثِ ... تَرْمِي السَّحَابَ وَيُرْمَى لَهَا» لا يقف الشبه عند الضخامة، بل يشمل صورة كاملة: كتلة تتحرك وتجتذب ما حولها فتكبر. وهذا ما يخصّه عبد القاهر الجُرْجانيّ باسم التمثيل، وهو عنده أخصّ من التشبيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "المقابلة بين المعلوم والمجهول"
      text: "«تَرْمِي» و«يُرْمَى لَهَا» فعل واحد في صورتين، فالحركة متبادلة: تعطي وتأخذ. وبهذا تصوّر الكتيبة كثيرة المدد، كلما سارت انضمّ إليها غيرها."
    - title: "اختيار «الغيث»"
      text: "لم تقل سحاب الحرب أو الرعد، بل «الْغَيْثِ»، وهو المطر النافع. فالكتيبة في عين أخته خير لقومه، كما يكون الغيث خيرًا للأرض."
  connection: "ثم تقول الحكمة التي تقوم عليها هذه الكتيبة: هوان النفس يوم الحرب أبقى لها."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، وقبلها ألف، وبعدها «هَا»"
  scansion: "كَكِرْفِ / ئَتِلْ غَيْ / ثِ ذَاتِصْ / صَبِي = فعولُ / فعولن / فعولن / فعَلْ — رِ تَرْمِسْ / سَحَابَ / وَيُرْمَى / لَهَا = فعولن / فعولُ / فعولن / فعَلْ"
  note: "في البيت تدوير: كلمة «الصَّبِيرِ» مقسومة بين الشطرين. ودخل القبضُ التفعيلة الأولى من الصدر والثانية من العجز، والعروض والضرب محذوفان «فعَلْ» [@atiq، ص121]."
