first: "لَعَمْرُ أَبِيهِ لَنِعْمَ الْفَتَى"
second: "تَحُشُّ بِهِ الْحَرْبُ أَجْذَالَهَا"
vocabulary:
- term: "تَحُشُّ"
  text: "توقد. في لسان العرب: «ويَحُشُّ الرجلُ الحطبَ ويَحُشُّ النَّارَ إِذا ضَمَّ الْحَطَبَ عَلَيْهَا وأَوقَدَها» [@lisan، ج6 ص285]."
- term: "أَجْذَالَهَا"
  text: "جمع جِذْل، «وَهُوَ أَصل الشَّجَرَةِ» [@lisan، ج10 ص413]. فهو حطب الحرب الذي تشتعل به."
