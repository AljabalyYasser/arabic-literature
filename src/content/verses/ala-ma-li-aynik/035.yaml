first: "فَإِنْ تَكُ مُرَّةُ أَوْدَتْ بِهِ"
second: "فَقَدْ كَانَ يُكْثِرُ تَقْتَالَهَا"
meaning: "إن كانت بنو مُرَّة قد قتلته، فلطالما قتل منهم. فلا شماتة لهم فيه، لأنه أخذ منهم قبل أن يأخذوه."
vocabulary:
  - term: "مُرَّةُ"
    text: "بنو مُرَّة بن عوف بن سعد بن ذُبيان، من غَطَفان، قتلة معاوية. وفي عنوان القصيدة الأولى من الديوان أن معاوية «قتله بنو مرة بن عوف بن سعد بن ذبيان؛ قتله هاشم بن حرملة» [@diwan-khansa، ص58]."
  - term: "أَوْدَتْ بِهِ"
    text: "أهلكته."
  - term: "تَقْتَالَهَا"
    text: "قتلها. في لسان العرب: «قَتَلَه يَقْتُلُه قَتْلًا وتَقْتَالًا» [@lisan، ج11 ص547]. ويذكر المحقق أن في حاشية نسخة دار الكتب بخط الكرماني: «أي قَتْلها» [@diwan-khansa، ص108]."
context: "هذا البيت هو الذي يحسم لمن قيلت القصيدة. فمعاوية قتلته بنو مُرَّة، وصخر مات من طعنة رجل من بني أسد. يقول ابن سَلّام: «فَأَما صَخْر فَقتلته بَنو أَسد وَأما مُعَاوِيَة فَقتلته بَنو مرّة غطفان»، ثم يجعل هذه القصيدة في معاوية [@ibn-sallam، ج1 ص210]. وبهذا ردّ السُّلَمِيّ على أبي عُبَيْدة حين رواها في صخر، والبيت في الأبيات التي رواها أبو عُبَيْدة نفسه: «ليست هذه فى صخر، هذه إنما رثت بها معاوية أخاها، وبنو مرة قتلته» [@aghani-dk، ج15 ص80]. وعنوانها في رواية ثَعْلَب: «وقالت لمعاوية أخيها، وقتله بنو مرّة على غدير قَلَهَى» [@diwan-khansa، ص78]."
syntax:
  - "«إِنْ» حرف شرط، و«تَكُ» فعل الشرط مجزوم، وأصله «تَكُنْ» حُذفت نونه تخفيفًا، وهو حذف يجوز في مضارع «كان» المجزوم إذا لم يلِه ساكن. و«مُرَّةُ» اسم «تكن» ممنوع من الصرف للعلمية والتأنيث اللفظي، وجملة «أَوْدَتْ بِهِ» خبرها."
  - "«فَقَدْ كَانَ يُكْثِرُ تَقْتَالَهَا» الفاء رابطة لأن الجملة بدأت بـ«قد». والجواب في المعنى محذوف، تقديره: فلا عجب ولا شماتة، وما بعد الفاء تعليل له."
  - "«كَانَ» فعل ماض ناقص، واسمه ضمير معاوية، وجملة «يُكْثِرُ تَقْتَالَهَا» خبرها. و«تَقْتَالَهَا» مفعول به، والضمير لمُرَّة."
morphology:
  - "«تَقْتَال» مصدر على «تَفْعال» بفتح التاء، وهي صيغة تأتي للكثرة والمبالغة، فـ«التَّقْتال» القتل الكثير المتكرر، وقد جاءت مع الفعل «يُكْثِرُ» فاجتمعت الكثرة في اللفظين."
  - "«أَوْدَتْ» ماضي «أَوْدَى» على «أَفْعَلَ»، ولا يتعدى إلا بالباء: أودى به."
rhetoric:
  thesis: "عزاء بالمكافأة: إن أخذت مُرَّةُ واحدًا فقد أخذ منها كثيرين."
  devices:
    - title: "المقابلة"
      text: "«أَوْدَتْ بِهِ» قتلٌ واحد، و«يُكْثِرُ تَقْتَالَهَا» قتل كثير. فالشطر الثاني يرجح الأول ويغلبه، والميزان في صالح أخيها."
    - title: "الحذف"
      text: "لم تذكر جواب الشرط، بل جاءت بعلّته وحدها: «فَقَدْ كَانَ». فالسامع يكمل: فلا تفخر مُرَّة بقتله. وهذا الحذف يجعل الجملة أقرب إلى الرد على شامت حاضر."
    - title: "التسمية"
      text: "سمّت القبيلة «مُرَّةُ» صريحة، بعد أن سمّت أخاها في القصيدة «ابن عمرو» فقط. فالقاتل يُذكر باسمه، والمقتول يُذكر بأبيه."
  connection: "ثم تصف أيامه: يومًا على فرس ضخم في الحرب، ويومًا في لذة وعيش رخي."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، وقبلها ألف، وبعدها «هَا»"
  scansion: "فَإِنْ تَ / كُ مُرْرَ / ةُ أَوْدَتْ / بِهِي = فعولُ / فعولُ / فعولن / فعَلْ — فَقَدْ كَا / نَ يُكْثِ / رُ تَقْتَا / لَهَا = فعولن / فعولُ / فعولن / فعَلْ"
  note: "دخل القبضُ التفعيلتين الأوليين من الصدر والثانية من العجز، والعروض والضرب محذوفان «فعَلْ» [@atiq، ص121]. وتُشبع كسرة الهاء في «بِهِ» فتُنطق «بِهِي»."
