first: "لَهَا مِشْفَرٌ سَابِغٌ طُولُهُ"
second: "وَلَا عَيْنَ فِيهَا وَلَا فَا لَهَا"
vocabulary:
- term: "مِشْفَرٌ"
  text: "في الشرح: «المِشفر: أوّل خيلها ورجالها ورماحها» [@diwan-khansa، ص95]."
- term: "وَلَا عَيْنَ فِيهَا وَلَا فَا لَهَا"
  text: "في الشرح: «أخبر أنّ هذه الصخرة ململمة لا عين فيها ولا فم» [@diwan-khansa، ص95]."
