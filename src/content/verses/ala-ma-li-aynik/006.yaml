first: "سَأَحْمِلُ نَفْسِي عَلَى آلَةٍ"
second: "فَإِمَّا عَلَيْهَا وَإِمَّا لَهَا"
meaning: "سأحمل نفسي على حال شديدة من الحرب، فإما أن تكون الدائرة عليها فأهلك، وإما أن تكون لها فأنجو وأظفر. وفي الشرح المنسوب إلى ثَعْلَب: «قوله «على آلةٍ» أي حالةٍ، فإما أموت أو أنجو»، ويشبّهه بقولهم: «إمّا هُلْكٌ وإمّا مُلْكٌ» [@diwan-khansa، ص85]."
vocabulary:
  - term: "آلَةٍ"
    text: "حال. في الشرح: «أي حالةٍ» [@diwan-khansa، ص85]، وعند أبي عُبَيْدة: «آلة: حالة. تقول: فإما أن أموت وإما أن أنجو» [@aghani-dk، ج15 ص94]، وعند المُبَرِّد: «أي على حالة وعلى خطة» [@kamil، ج4 ص43]."
context: "تكملة البيت السابق: ذكرت هناك أنها همّت بأمر، وهنا تقوله. ويرى أبو سعيد في الشرح أنها لم تُرد نفسها، بل أرادت أن تعيّر قومها بقعودهم عن الثأر: «هذا أشدّ للتحضيض، وإنّما أرادت أن تذمّ عشيرتها، فقالت: ما أراني إلّا سأقوم مقامكم، فإما أن أدرك حظًّا أو أهلك» [@diwan-khansa، ص85]. والتحضيض: الحثّ على الفعل. وهذا البيت مع السابق يرويهما أبو الفَرَج لعامر بن جُوَيْن الطّائيّ، ثم يقول إن من الناس من يرويهما للخنساء [@aghani-dk، ج9 ص96]."
syntax:
  - "«سَأَحْمِلُ» فعل مضارع، والسين للاستقبال، و«نَفْسِي» مفعول به، و«عَلَى آلَةٍ» جار ومجرور متعلق بالفعل."
  - "«فَإِمَّا عَلَيْهَا وَإِمَّا لَهَا» «إِمَّا» حرف تفصيل مكرر. والمبتدأ محذوف في الموضعين، والتقدير: فإما الأمر عليها وإما الأمر لها، أي إما الهلاك وإما الظفر."
  - "وفي الشرح أن السُّلَمِيّين يروون «لأحملَ نفسي»: «أي: هممت لأن أحمل نفسي على آلة» [@diwan-khansa، ص85]، فيكون البيت متعلقًا بالفعل «هممتُ» في البيت السابق."
morphology:
  - "«آلَة» على «فَعَلَة» من الجذر (أ و ل)، وأصلها «أَوَلَة» قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها. ومن معانيها الحال: وفي لسان العرب في بيت كعب بن زهير «يَوْماً عَلى آلةٍ حَدْباءَ مَحْمُولُ»: «وَقِيلَ: أَراد بِالْآلَةِ الحالةَ» [@lisan، ج1 ص301]."
  - "«إِمَّا» مركبة من «إنْ» و«ما». ويذكر الشرح عن التَّوَّزِيّ أن قومًا يقولونها «أمّا» بالفتح: «وهي لغة، والكسر أجود» [@diwan-khansa، ص85]."
rhetoric:
  thesis: "عزم على المخاطرة: لا حياة لها بعده إلا أن تضع نفسها بين الهلاك والظفر."
  devices:
    - title: "المقابلة"
      text: "«عَلَيْهَا» و«لَهَا» ضدان: الأول للخسارة والثاني للربح. وبهما ينقسم العجز قسمين متساويين يبدأ كل منهما بـ«إِمَّا». وقال ابن رَشِيق: «فإذا جاوز الطباق ضدين كان مقابلة» [@ibn-rashiq، ج2 ص15]، والطباق الجمع بين الضدين."
    - title: "الإيجاز"
      text: "«فَإِمَّا عَلَيْهَا وَإِمَّا لَهَا» أربع كلمات تحمل الموت والحياة معًا، ولم تذكر أيًّا منهما. وما حذفته يفهمه السامع من حرفي الجر: «على» للضرر و«اللام» للنفع."
    - title: "التجريد"
      text: "في «سَأَحْمِلُ نَفْسِي» تجعل نفسها شيئًا يُحمل، كما يُحمل المقاتل على فرسه. فالمتكلمة والنفس اثنتان: واحدة تقرّر، والأخرى تُساق إلى الخطر."
  connection: "ثم تعود إلى الميت تمدحه: لنعم الفتى كان، تحشّ به الحرب أجذالها."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، وقبلها ألف، وبعدها «هَا»"
  scansion: "سَأَحْمِ / لُ نَفْسِي / عَلَى آ / لَتِنْ = فعولُ / فعولن / فعولن / فعَلْ — فَإِمْمَا / عَلَيْهَا / وَإِمْمَا / لَهَا = فعولن / فعولن / فعولن / فعَلْ"
  note: "دخل القبضُ التفعيلة الأولى من الصدر فصارت «فعولُ»، والعروض والضرب محذوفان «فعَلْ» [@atiq، ص121]. والعجز كله تفعيلات سالمة."
variants:
  - reading: "سَأَحْمِلُ نَفْسِي عَلَى خُطَّةٍ"
    status: "رواية الأغاني والعقد"
    note: "في رواية أبي عُبَيْدة لها في صخر [@aghani-dk، ج15 ص80]، وعند ابن عبد رَبِّه [@iqd، ج3 ص224]. والخُطّة: الأمر والحال."
  - reading: "لِأَحْمِلَ نَفْسِي عَلَى آلَةٍ"
    status: "رواية السُّلَمِيّين والمُبَرِّد"
    note: "[@diwan-khansa، ص85]؛ [@kamil، ج4 ص43]."
  - reading: "سَأَحْمِلُ نَفْسِي عَلَى أَلَّةٍ"
    status: "رواية يخطّئها الشرح"
    note: "والأَلّة الحربة. قال أبو عُبَيْدة: «ولو قالت [على ألّة] لم تنج؛ لأن الألّة هى الحربة» [@aghani-dk، ج15 ص94]، وكذلك في الشرح: «وهو خطأ؛ لأنها لو فعلت لم تنج» [@diwan-khansa، ص85]."
