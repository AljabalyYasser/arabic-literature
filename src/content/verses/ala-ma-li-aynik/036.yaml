first: "فَيَوْمًا تَرَاهُ عَلَى هَيْكَلٍ"
second: "أَخَا الْحَرْبِ يَلْبَسُ سِرْبَالَهَا"
vocabulary:
- term: "هَيْكَلٍ"
  text: "فرس ضخم. في لسان العرب: «اللَّيْثُ: الهَيْكَلُ الْفَرَسُ الطَّوِيلُ عُلُوًّا وعدْواً» [@lisan، ج11 ص700]."
- term: "سِرْبَالَهَا"
  text: "درعها: «السِّرْبالُ: القَميص والدِّرْع» [@lisan، ج11 ص335]."
