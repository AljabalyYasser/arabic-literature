first: "هَمَمْتُ بِنَفْسِيَ بَعْضَ الْهُمُومِ"
second: "فَأَوْلَى لِنَفْسِيَ أَوْلَى لَهَا"
meaning: "عزمتُ في نفسي على أمر من الأمور الكبار، فويلٌ لنفسي، ويلٌ لها. ولا تقول ما الذي همّت به، فاختلف فيه المفسرون: فهو عند أبي عُبَيْدة وعيد، وفي الشرح المنسوب إلى ثَعْلَب أنها «همّت بأن تغزو وأن تكون سارية» [@diwan-khansa، ص84]، أي أن تخرج هي إلى الحرب تطلب ثأر أخيها. وعند الأَثْرَم أنها همّت بقتل نفسها: «كأنّها أرادت أن تقتل نفسها» [@aghani-dk، ج15 ص94]."
vocabulary:
  - term: "هَمَمْتُ"
    text: "عزمتُ وأردتُ أن أفعل."
  - term: "فَأَوْلَى"
    text: "كلمة وعيد. في الشرح: «قال أبو عبيدة: أَوْلى: توعُّد» [@diwan-khansa، ص84]. وفي لسان العرب عن الأَصْمَعِيّ: «مَعْنَاهُ قارَبَه مَا يُهْلِكه أَي نَزَلَ بِهِ» [@lisan، ج15 ص412]."
context: "بعد سؤال العين وذكر الميت تنتقل إلى نفسها: ماذا تفعل بعده؟ وهذا البيت والذي يليه يرويهما أبو الفَرَج في أخبار امرئ القَيْس لعامر بن جُوَيْن الطّائيّ، وكان امرؤ القيس قد نزل به: «وكان عامر أيضا يقول يعرّض بهند بنت امرئ القيس»، ثم ينشد بيتًا ثم هذين البيتين، ثم يقول: «هكذا روى ابن أبى سعد عن دارم بن عقال، ومن الناس من يروى هذه الأبيات للخنساء فى قصيدتها» [@aghani-dk، ج9 ص96]. فالبيت يُروى لعامر بن جُوَيْن أيضًا. ويرويه للخنساء المُبَرِّد [@kamil، ج4 ص43]، وابن عبد رَبِّه [@iqd، ج3 ص224]، وابن مَنْظُور [@lisan، ج15 ص412]. وأبو الفَرَج لم يروه في ترجمتها، لكنه نقل تفسيره عن أبي عُبَيْدة والأَصْمَعِيّ، فيقول محققو طبعة دار الكتب إنه «تفسير لبيت لم يروه أبو الفرج» [@aghani-dk، ج15 ص94]."
syntax:
  - "«هَمَمْتُ» فعل وفاعل، و«بِنَفْسِيَ» جار ومجرور متعلق به، و«بَعْضَ الْهُمُومِ» مفعول مطلق، أي هممتُ هَمًّا من الهموم. والمهموم به محذوف لم يُذكر."
  - "«فَأَوْلَى لِنَفْسِيَ» جملة وعيد. و«أَوْلَى» على تفسير الأَصْمَعِيّ في معنى الفعل «قاربه ما يهلكه» [@lisan، ج15 ص412]، و«لِنَفْسِيَ» متعلق به. و«أَوْلَى لَهَا» توكيد لفظي للجملة الأولى."
  - "يقول المُبَرِّد في هذه الكلمة: «يقول الرجل إذا حاول شيئاً فأفلته من بعد ما كاد يصيبه: أولى له! وإذا أفلت من عظيمة قال: أولى لي!» [@kamil، ج4 ص43]. فهي عنده كلمة من نجا من أمر عظيم بعد أن كاد يقع فيه."
morphology:
  - "«أَوْلَى» على «أَفْعَل» من الجذر (و ل ي) الدال على القرب، ولذلك فسّرها الأَصْمَعِيّ بالمقاربة: قاربه ما يهلكه."
  - "«الْهُمُوم» جمع «هَمّ» على «فُعُول»، و«هَمَمْتُ» من الجذر نفسه، فبين الفعل ومفعوله المطلق اشتقاق."
  - "«بِنَفْسِيَ» و«لِنَفْسِيَ» بفتح ياء المتكلم، وهي لغة في الياء الساكنة، وبها ضبطه لسان العرب [@lisan، ج15 ص412]، وبها يستقيم الوزن."
rhetoric:
  thesis: "تنتقل من البكاء إلى الفعل: همّت بأمر عظيم ولم تسمّه، ثم توعّدت نفسها."
  devices:
    - title: "الحذف"
      text: "لم تقل بماذا همّت، واكتفت بـ«بَعْضَ الْهُمُومِ»، فترك الحذفُ الباب مفتوحًا لتفسيرات القدماء: الغزو، أو قتل النفس. ويقول عبد القاهر الجُرْجانيّ في الحذف: «فإنك ترى به ترك الذكر، أفصح من الذكر» [@dalail، ص146]."
    - title: "التكرار"
      text: "«فَأَوْلَى لِنَفْسِيَ أَوْلَى لَهَا» كرّرت كلمة الوعيد، فصار العجز كله تهديدًا متصاعدًا."
    - title: "الالتفات"
      text: "قالت «لِنَفْسِيَ» بالتكلم، ثم «لَهَا» بالغيبة، فكأنها تكلّم نفسها ثم تتحدث عنها كأنها امرأة أخرى تخافها وتتوعّدها."
  connection: "ثم تقول ما عزمت عليه: ستحمل نفسها على حال تُهلكها أو تنصرها."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، وقبلها ألف، وبعدها «هَا»"
  scansion: "هَمَمْتُ / بِنَفْسِ / يَ بَعْضَلْ / هُمُومِي = فعولُ / فعولُ / فعولن / فعولن — فَأَوْلَى / لِنَفْسِ / يَ أَوْلَى / لَهَا = فعولن / فعولُ / فعولن / فعَلْ"
  note: "دخل القبضُ «فعولن» فصارت «فعولُ» في التفعيلتين الأوليين من الصدر والثانية من العجز [@atiq، ص121]. وجاءت العروض هنا صحيحة «فعولن»، والضرب محذوف «فعَلْ»، وكلاهما جائز في المتقارب [@atiq، ص121–122]."
