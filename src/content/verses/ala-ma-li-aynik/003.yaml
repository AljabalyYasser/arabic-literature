first: "يَدَ الدَّهْرِ آسَى عَلَى هَالِكٍ"
second: "وَأَسْأَلُ نَائِحَةً مَا لَهَا"
vocabulary:
- term: "يَدَ الدَّهْرِ"
  text: "في الشرح المنسوب إلى ثَعْلَب: «كأنّها قالت: يد أول الدهر. تريد: أبد الدّهر» [@diwan-khansa، ص81]."
- term: "آسَى"
  text: "أحزن. في الشرح: «أسِيَ يأسَى أسىً إذا حزن» [@diwan-khansa، ص81]."
