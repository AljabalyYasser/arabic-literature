explained: false
first: "وَدَاهِيَةٍ جَرَّهَا جَارِمٌ"
second: "تُبِيلُ الْحَوَاصِنَ أَحْبَالَهَا"
vocabulary:
- term: "جَرَّهَا جَارِمٌ"
  text: "جناها جانٍ. في الشرح: «جرّها: أي جرّها جارمٌ من جُرّامك» [@diwan-khansa، ص89]."
- term: "تُبِيلُ الْحَوَاصِنَ أَحْبَالَهَا"
  text: "في الشرح: «أي: تُلقي أولادها من الفزع» [@diwan-khansa، ص89]، و«الحواصن ها هنا: الحوامل» [@diwan-khansa، ص90]."
sources:
- source: "diwan-khansa"
  loc: "ص89–90"
  url: "https://archive.org/details/3318pdf_202001/page/n88/mode/1up"
status: "review"
