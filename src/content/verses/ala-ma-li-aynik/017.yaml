first: "وَهَاجِرَةٍ حَرُّهَا وَاقِدٌ"
second: "جَعَلْتَ رِدَاءَكَ أَظْلَالَهَا"
vocabulary:
- term: "وَهَاجِرَةٍ"
  text: "في لسان العرب: «هَجَّر الرَّجُلُ إِذا خَرَجَ بِالْهَاجِرَةِ، وَهِيَ نِصْفُ النَّهَارِ» [@lisan، ج5 ص255]."
- term: "رِدَاءَكَ"
  text: "السيف. يذكر المحقق أن في حاشية نسخة دار الكتب بخط الكرماني: «يعني بالرداء: السيف» [@diwan-khansa، ص94]."
