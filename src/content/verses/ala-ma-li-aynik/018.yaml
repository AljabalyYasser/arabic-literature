first: "وَصَخْرَةِ بَلْغٍ تَعَرْقَبْتَهَا"
second: "عَسِيرًا فَأَسْرَعْتَ إِذْلَالَهَا"
vocabulary:
- term: "وَصَخْرَةِ بَلْغٍ"
  text: "في الشرح: «يعني بالصخرة: كتيبة الحرب ورحاها. والبَلْغ: الكَرْب» [@diwan-khansa، ص95]."
- term: "تَعَرْقَبْتَهَا"
  text: "في الشرح: «ركبتَ عليها وارتقيتها كما يُتعرقب الحمار» [@diwan-khansa، ص95]."
