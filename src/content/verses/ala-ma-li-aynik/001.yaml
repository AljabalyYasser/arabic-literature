first: "أَلَا مَا لِعَيْنِكِ أَمْ مَا لَهَا"
second: "وَقَدْ أَخْضَلَ الدَّمْعُ سِرْبَالَهَا"
meaning: "تسأل نفسها: ما بال عينكِ؟ بل ما بالها؟ وقد سال دمعها حتى بلّ ثوبها. والسؤال لا ينتظر جوابًا، فالجواب في البيت التالي: إنه ابن عمرو."
vocabulary:
  - term: "أَخْضَلَ"
    text: "بَلَّ. في لسان العرب: «وأَخْضَلَ الثوبَ دمعُه: بَلَّه، وَكَذَلِكَ أَخْضَلَتْه السماءُ حَتَّى خَضِلَ خَضَلًا» [@lisan، ج11 ص208]."
  - term: "سِرْبَالَهَا"
    text: "ثوبها. في لسان العرب: «السِّرْبالُ: القَميص والدِّرْع، وَقِيلَ: كُلُّ مَا لُبِسَ فَهُوَ سِرْبالٌ» [@lisan، ج11 ص335]."
context: "مطلع القصيدة، وبه يسمّيها ابن سَلّام حين يعدّ كلمات الخَنْساء الثلاث: «وَقَالَت فى مُعَاوِيَة (أَلا مَا لعينك أم مَالهَا ... لقد أخضل الدمع سربالها)» [@ibn-sallam، ج1 ص210]. وبه أيضًا يعرّفها أبو الفَرَج حين يروي البيتين 5 و6 لعامر بن جُوَيْن الطّائيّ ثم يقول: «ومن الناس من يروى هذه الأبيات للخنساء فى قصيدتها: ألا ما لعينى ألا ما لها * لقد أخضل الدمع سربالها» [@aghani-dk، ج9 ص96]. ولم يقف الشرح المنسوب إلى ثَعْلَب عند هذا البيت بشيء [@diwan-khansa، ص78]."
syntax:
  - "«أَلَا» حرف استفتاح يُنبَّه به السامع. و«مَا» اسم استفهام مبتدأ، و«لِعَيْنِكِ» جار ومجرور خبره: أيُّ شيء لعينك؟"
  - "«أَمْ» هنا منقطعة بمعنى «بل»، لأنها لم تُسبق بهمزة تعادلها، فهي تبدأ سؤالًا جديدًا: بل ما لها؟ و«مَا لَهَا» مبتدأ وخبر كالأولى."
  - "«وَقَدْ أَخْضَلَ الدَّمْعُ سِرْبَالَهَا» الواو للحال، و«الدَّمْعُ» فاعل، و«سِرْبَالَهَا» مفعول به. والجملة حال من العين: تسأل عنها وهي على هذه الحال."
morphology:
  - "«أَخْضَلَ» على «أَفْعَلَ»، متعدٍّ من «خَضِلَ» اللازم، والهمزة فيه للتعدية: خَضِلَ الثوب إذا ابتلّ، وأخضله الدمع إذا بلّه [@lisan، ج11 ص208]."
  - "«سِرْبَال» رباعي على «فِعْلال»، ومنه الفعل «تَسَرْبَلَ» إذا لبس السربال [@lisan، ج11 ص335]."
rhetoric:
  thesis: "تبدأ كما بدأت القصيدة الأم «قَذًى بِعَيْنِكِ»: بسؤال عن العين، لا عن الميت. فأول ما يراه السامع أثر الفقد في جسدها، ثم يعرف من فقدت."
  devices:
    - title: "الالتفات"
      text: "في «لِعَيْنِكِ» تخاطب نفسها، ثم في «مَا لَهَا» و«سِرْبَالَهَا» تتحدث عن العين كأنها غائبة. والالتفات: أن ينتقل الكلام من الخطاب إلى الغيبة أو من الغيبة إلى الخطاب. فالشاعرة تسأل نفسها، ثم تقف بعيدًا وتنظر إلى عينها كما ينظر إليها غيرها."
    - title: "الاستفهام"
      text: "«مَا لِعَيْنِكِ ... أَمْ مَا لَهَا» سؤالان متتابعان لا يطلبان جوابًا، بل يُظهران التعجب من دمع لا يكفّ، والتكرار فيهما يقوّي هذا التعجب."
    - title: "الكناية"
      text: "«أَخْضَلَ الدَّمْعُ سِرْبَالَهَا» لا تقول إنها بكت كثيرًا، بل تذكر ما يلزم عن كثرة البكاء: ثوب مبلول. وهذا ما يسمّيه عبد القاهر الجُرْجانيّ الكناية، أن يترك المتكلم اللفظ الموضوع للمعنى، «ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]."
  connection: "ثم تقول لماذا تبكي: أبعد ابن عمرو، من آل الشَّرِيد، تحلّت الأرض به؟"
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، وقبلها ألف، وبعدها «هَا»: «ـالَهَا»، فهي لامية"
  scansion: "أَلَا مَا / لِعَيْنِ / كِ أَمْ مَا / لَهَا = فعولن / فعولُ / فعولن / فعَلْ — وَقَدْ أَخْ / ضَلَدْ دَمْ / عُ سِرْبَا / لَهَا = فعولن / فعولن / فعولن / فعَلْ"
  note: "وزن المتقارب «فعولن» أربع مرات في كل شطر. ودخل القبضُ، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ»، التفعيلةَ الثانية من الصدر. وآخر تفعيلة في الشطرين محذوفة «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن فتصبح فعو، وتنقل إلى فعَلْ» [@atiq، ص121]."
