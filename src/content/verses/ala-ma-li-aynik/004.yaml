explained: false
first: "لِتَأْتِ الْمَنِيَّةُ بَعْدَ الْفَتَى الْـ"
second: "ـمُغَادَرِ بِالْمَحْوِ أَذْلَالَهَا"
vocabulary:
- term: "الْمُغَادَرِ"
  text: "المتروك في قبره. في الشرح: «والمُغادَر: المخلَّف» [@diwan-khansa، ص83]."
- term: "بِالْمَحْوِ"
  text: "موضع. في الشرح: «والمحو: بين أبلى وتعار، وهو خرق من الأرض مستو أفيح لا جبال فيه» [@diwan-khansa، ص82]."
- term: "أَذْلَالَهَا"
  text: "طرقها. في الشرح: «قال: وسمعت أبا عمرو يقول: إنّ أمور الله جارية على أذلالها؛ أي مسالكها، واحدها: ذِلّ» [@diwan-khansa، ص82]."
sources:
- source: "diwan-khansa"
  loc: "ص81–83"
  url: "https://archive.org/details/3318pdf_202001/page/n80/mode/1up"
