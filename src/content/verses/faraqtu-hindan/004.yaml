explained: false
first: "خَوْدٌ رَدَاحٌ طَفْلَةٌ"
second: "مَا الْفُحْشُ مِنْ أَخْلَاقِهَا"
vocabulary:
  - term: "خَوْدٌ"
    text: "«الخَوْدُ: الفتاة الحسنة الخَلق الشابّة ما لم تَصِر نَصَفًا» [@lisan، ج3 ص165]، والنَّصَف: المرأة بين الشابة والكهلة."
  - term: "رَدَاحٌ"
    text: "«وامرأة رَداح ... عَجْزاء ثقيلة الأوراك تامّة الخَلْق» [@lisan، ج2 ص447]، وهو عندهم من صفات الجمال."
  - term: "طَفْلَةٌ"
    text: "ناعمة، يقال: «امرأة طَفْلة البَنان: رَخْصَتُها في بياض» [@lisan، ج11 ص402]."
