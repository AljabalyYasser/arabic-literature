first: "إِنْ كُنْتِ سَاقِيَةً بِبُزْ"
second: "لِ الْأُدْمِ أَوْ بِحِقَاقِهَا"
vocabulary:
  - term: "بِبُزْلِ"
    text: "جمع بازِل، و«بَزَل البعيرُ يَبْزُل بُزُولًا: فَطَر نابُه، أي انشقّ، فهو بازل ... وذلك في السنة التاسعة» [@lisan، ج11 ص52]. وفي البيت تدوير."
  - term: "الْأُدْمِ"
    text: "«والأُدْمة في الإبل البياض الشديد. يقال: بعير آدم، وناقة أدماء، والجمع أُدْم» [@lisan، ج12 ص12]."
  - term: "بِحِقَاقِهَا"
    text: "جمع حِقّ، و«البعير إذا استكمل السنة الثالثة ودخل في الرابعة فهو حينئذ حِقّ» كما ينقل صاحب اللسان عن أبي عبيد [@lisan، ج10 ص55]."
