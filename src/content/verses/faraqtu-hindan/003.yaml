first: "مُتَحَلِّيًا فَوْقَ الرِّدَا"
second: "ءِ يَجُولُ مِنْ رَقْرَاقِهَا"
vocabulary:
  - term: "مُتَحَلِّيًا"
    text: "من تحلّى، و«تَحَلَّى بالحَلْي أي تزيّن» [@lisan، ج14 ص195]: يصير الدمع، وهو كالدرّ، حَلْيًا على ردائه."
  - term: "رَقْرَاقِهَا"
    text: "«وكلّ شيء له بَصِيص وتلألؤ فهو رَقْراق» [@lisan، ج10 ص124]، أي من دمعها المتلألئ."
