explained: false
first: "فَالْعَيْنُ تُذْرِي دَمْعَةً"
second: "كَالدُّرِّ مِنْ آمَاقِهَا"
vocabulary:
  - term: "تُذْرِي"
    text: "«أَذْرَتِ العينُ الدمعَ تُذْرِيه إِذْراءً وذَرًى، أي: صبّته» [@lisan، ج14 ص284]."
  - term: "آمَاقِهَا"
    text: "جمع مُؤْق، و«مُؤق العين: طرفها مما يلي الأنف ... والجمع آماق» [@lisan، ج10 ص337]، ومنه يجري الدمع."
