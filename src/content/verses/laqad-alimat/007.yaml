first: لَعَمْرِي وَمَا عَمْرِي عَلَيَّ بِهَيِّنٍ
second: لَقَدْ شَانَ حُرَّ الْوَجْهِ طَعْنَةُ مُسْهِرِ
vocabulary:
- term: شَانَ
  text: عاب وقبّح.
- term: حُرَّ الْوَجْهِ
  text: '«ما أقبل عليك منه»، وقيل: «مسايل أربعة مدامع العينين» [@lisan، ج4 ص183].'
- term: طَعْنَةُ مُسْهِرِ
  text: طعنة مُسْهِر بن يزيد الحارثي يوم فيف الريح، «فأصاب عينه» [@iqd، ج6 ص88]. وفي رواية أخرى عن أبي عُبَيْدة أنه كان حليفًا لبني عامر، فطعنه في وجنته «ففلق وجنته» [@naqaid، ج2 ص639].
