explained: false
first: لَقَدْ عَلِمَتْ عُلْيَا هَوَازِنَ أَنَّنِي
second: أَنَا الْفَارِسُ الْحَامِي حَقِيقَةَ جَعْفَرِ
vocabulary:
- term: عُلْيَا هَوَازِنَ
  text: 'أعالي هَوازِن؛ قال المحققان: هم سعد بن بَكْر بن هَوازِن، وجُشَم ونصر ابنا معاوية بن بَكْر، وثقيف [@mufaddaliyyat، ص361، الحاشية].'
- term: حَقِيقَةَ
  text: '«ما يحق عليه أن يحميه»، وقيل: الراية، وقيل: الحرمة [@lisan، ج10 ص52].'
- term: جَعْفَرِ
  text: بنو جعفر بن كلاب، رهط عامر.
