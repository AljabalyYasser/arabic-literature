first: فَبِئْسَ الْفَتَى إِنْ كُنْتُ أَعْوَرَ عَاقِرًا
second: جَبَانًا فَمَا عُذْرِي لَدَى كُلِّ مَحْضَرِ
vocabulary:
- term: أَعْوَرَ
  text: ذاهب إحدى العينين.
- term: عَاقِرًا
  text: 'لا يولد له؛ قال ابن قُتَيْبة: «كان أعور عقيما لا يولد له، ولم يعقب» [@ibn-qutayba، ج1 ص322].'
- term: مَحْضَرِ
  text: مجلس يحضره الناس.
