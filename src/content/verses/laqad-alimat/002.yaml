explained: false
first: وَقَدْ عَلِمَ الْمَزْنُوقُ أَنِّي أَكُرُّهُ
second: عَلَى جَمْعِهِمْ كَرَّ الْمَنِيحِ الْمُشَهَّرِ
vocabulary:
- term: الْمَزْنُوقُ
  text: «اسم فرس عامر بن الطفيل» [@lisan، ج10 ص146].
- term: أَكُرُّهُ
  text: أعطفه عليهم مرة بعد مرة.
- term: الْمَنِيحِ الْمُشَهَّرِ
  text: 'المنيح: قدح من قداح الميسر «لا نصيب له» [@lisan، ج2 ص607]، «وإنما خص المنيح لكثرة جولانه في القداح، لأنه إذا خرج منها رد فيها»؛ والمشهّر: المشهور [@mufaddaliyyat، ص361، الحاشية].'
