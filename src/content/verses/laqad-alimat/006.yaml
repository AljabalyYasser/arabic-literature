explained: false
first: أَرَدْتُ لِكَيْ لَا يَعْلَمَ اللَّهُ أَنَّنِي
second: صَبَرْتُ وَأَخْشَى مِثْلَ يَوْمِ الْمُشَقَّرِ
vocabulary:
- term: لِكَيْ لَا يَعْلَمَ
  text: '«لا» زائدة [@mufaddaliyyat، ص362، الحاشية]، والمعنى: أردت أن يعلم الله أني صبرت.'
- term: يَوْمِ الْمُشَقَّرِ
  text: المشقّر «حصن بالبحرين قديم» [@lisan، ج4 ص422]؛ فتح عامل كسرى بابه لبني تميم وقد جاؤوا يمتارون، فأدخلهم فوجًا فوجًا وضرب أعناقهم [@mufaddaliyyat، ص361، الحاشية].
