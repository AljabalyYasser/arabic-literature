first: وَقَدْ عَلِمُوا أَنِّي أَكُرُّ عَلَيْهِمُ
second: عَشِيَّةَ فَيْفِ الرِّيحِ كَرَّ الْمُدَوِّرِ
vocabulary:
- term: فَيْفِ الرِّيحِ
  text: «موضع بالبادية» [@lisan، ج9 ص275]، كانت فيه الوقعة بين بني عامر ومَذْحِج.
- term: الْمُدَوِّرِ
  text: '«الذي يطوف بالدوار» [@mufaddaliyyat، ص362، الحاشية]، والدوار: «صنم كانت العرب تنصبه يجعلون موضعا حوله يدورون به» [@lisan، ج4 ص297].'
