explained: false
first: أَقُولُ لِنَفْسٍ لَا يُجَادُ بِمِثْلِهَا
second: أَقِلِّي الْمِرَاحَ إِنَّنِي غَيْرُ مُقْصِرِ
vocabulary:
- term: لَا يُجَادُ بِمِثْلِهَا
  text: لا يبذل مثلَها أحدٌ لنفاستها.
- term: الْمِرَاحَ
  text: «المرح، وهو شدة الفرح والنشاط حتى يجاوز قدره، أو التبختر والاختيال» [@mufaddaliyyat، ص362، الحاشية].
- term: مُقْصِرِ
  text: كافٍّ؛ «أقصر عن الشيء إذا نزع عنه وهو يقدر عليه» [@lisan، ج5 ص97].
