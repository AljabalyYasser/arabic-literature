first: وَأَنْبَأْتُهُ أَنَّ الْفِرَارَ خَزَايَةٌ
second: عَلَى الْمَرْءِ مَا لَمْ يُبْلِ جَهْدًا وَيُعْذِرِ
vocabulary:
- term: خَزَايَةٌ
  text: 'عار يُستحيا منه؛ والخزاية: «الاستحياء» [@mufaddaliyyat، ص362، الحاشية].'
- term: يُبْلِ جَهْدًا
  text: يبذل جهده ويُحسن البلاء في القتال.
- term: يُعْذِرِ
  text: «يأتي بعذر» [@mufaddaliyyat، ص362، الحاشية].
