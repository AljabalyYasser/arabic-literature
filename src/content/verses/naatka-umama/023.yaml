first: "أَمِينُ الْخَلِيفَةِ بَعْدَ الرَّسُولِ"
second: "وَأَوْفَى قُرَيْشٍ جَمِيعًا حِبَالَا"
meaning: "هو الذي ائتمنه الخليفة بعد الرسول ﷺ، يعني أبا بكر، وهو أوفى قريش كلها بالعهود. فالشاعر يمدح عمر بثقة أبي بكر به، وبوفائه."
vocabulary:
  - term: "الْخَلِيفَةِ"
    text: "أبو بكر، خليفة الرسول ﷺ."
  - term: "حِبَالَا"
    text: "عهودًا ومواثيق، والحبل يُستعار للعهد لأنه يربط بين المتعاهدين."
context: "من أبيات المديح الخالص (23–24) التي تسبق الاعتذار في الأبيات 25–29. والشاعر يبني مكانة عمر على من سبقه: أبو بكر ائتمنه، فكيف لا يكون أمينًا على عفوه هو؟"
syntax:
  - "«أَمِينُ الْخَلِيفَةِ» خبر لمبتدأ محذوف تقديره: هو أمين الخليفة، والضمير يعود على «مَالِكٍ عَادِلٍ» في البيت 20."
  - "«بَعْدَ الرَّسُولِ» ظرف متعلق بمحذوف حال من «الْخَلِيفَةِ»، أي: الخليفة القائم بعد الرسول."
  - "«وَأَوْفَى قُرَيْشٍ» معطوف على «أَمِينُ»، و«جَمِيعًا» حال مؤكدة، و«حِبَالَا» تمييز منصوب."
morphology:
  - "«أَمِينٌ» صفة مشبهة على وزن فَعِيل بمعنى مفعول، أي مأمون، أو بمعنى فاعل."
  - "«أَوْفَى» اسم تفضيل من «وَفَى» على وزن أَفْعَل، مقصور."
  - "«حِبَالٌ» جمع «حَبْل» على وزن فِعال."
rhetoric:
  thesis: "مديح بالموقع والسيرة: عمر ثقة من قبله، ووفيّ بعهده. وفي ذلك تمهيد لطلب الشاعر: من كان أوفى قريش لا يأخذ رجلًا بقول الوشاة."
  devices:
    - title: "الاستعارة"
      text: "في «حِبَالَا» جعل العهود حبالًا، والوفاء بها شدًّا للحبل لا يُقطع. وهي الاستعارة التي يقول فيها عبد القاهر الجُرْجانيّ إنك تجيء «إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "التفضيل"
      text: "في «وَأَوْفَى قُرَيْشٍ جَمِيعًا» فضّله على قريش كلها، و«جميعًا» تمنع الاستثناء."
  connection: "ثم يتمّ المديح بالكرم والفعل: «وَأَطْوَلُهُمْ فِي النَّدَى بَسْطَةً»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "أَمِينُلْ / خَلِيفَ / ةِبَعْدَرْ / رَسُولِي = فعولن / فعولُ / فعولن / فعولن — وَأَوْفَى / قُرَيْشِنْ / جَمِيعَنْ / حِبَالَا = فعولن / فعولن / فعولن / فعولن"
  note: "دخل القبضُ التفعيلةَ الثانية من الصدر فصارت «فعولُ» [@atiq، ص121]. وأُشبعت كسرة اللام في «الرَّسُولِ»."
variants:
