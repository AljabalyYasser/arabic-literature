  - reading: "أَمِينُ الْخَلِيقَةِ بَعْدَ الرَّسُولِ"
    status: "رواية «جمهرة أشعار العرب» كما ينقلها المحقق"
    note: "«جم: الخليقة» [@diwan-hutayah، ص221]، أي أمين الناس جميعًا."
