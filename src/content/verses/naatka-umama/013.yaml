explained: false
first: "وَيَحْدُو يَدَيْهَا زَجُولَا الْحَصَى"
second: "أَمَرَّهُمَا الْعَصْبُ ثُمَّ اسْتَمَالَا"
vocabulary:
  - term: "زَجُولَا الْحَصَى"
    text: "رجلاها، «أراد رجليها تزجُلان الحصى تقذفانه» [@diwan-hutayah، ص219]."
  - term: "أَمَرَّهُمَا"
    text: "«فتلهما» [@diwan-hutayah، ص218]."
  - term: "الْعَصْبُ"
    text: "«شدة الفتل بالرفق» [@diwan-hutayah، ص219]."
  - term: "اسْتَمَالَا"
    text: "«أى استعطفهما فى السير» [@diwan-hutayah، ص219]."
