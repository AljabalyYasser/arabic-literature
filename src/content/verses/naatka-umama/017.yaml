first: "وَلَيْلٍ تَخَطَّيْتُ أَهْوَالَهُ"
second: "إِلَى عُمَرٍ أَرْتَجِيهِ ثِمَالَا"
meaning: "ورُبّ ليل عبرت أهواله سائرًا إلى عمر، أرجو أن يكون لي غياثًا يقوم بأمري. وفي هامش مخطوطة ابن السِّكِّيت: «هو ثِمالهم: أى غِياثهم والقيّم بأمرهم» [@diwan-hutayah، ص220]."
vocabulary:
  - term: "تَخَطَّيْتُ"
    text: "اجتزت وعبرت."
  - term: "أَهْوَالَهُ"
    text: "مخاوفه، جمع هَوْل."
  - term: "ثِمَالَا"
    text: "غياثًا وقيّمًا. قال السُّكَّرِيّ: «الثِّمال: الغياث»، واستشهد بقول أبي طالب: «وَأَبْيَضَ يُسْتَسْقَى الْغَمَامُ بِوَجْهِهِ ... ثِمَالُ الْيَتَامَى عِصْمَةٌ لِلْأَرَامِلِ» [@diwan-hutayah، ص220]. وفي «جمهرة أشعار العرب» كما ينقل المحقق: «الثمال: الربيع» [@diwan-hutayah، ص220]."
context: "أول المديح (الأبيات 17–29) كما يقسمها المحقق [@diwan-hutayah، ص220]. والبيت هو مخلص القصيدة: ينقل الرحلة من طريق إلى أُمامة إلى طريق إلى عمر، ويسمّي الممدوح لأول مرة."
syntax:
  - "«وَلَيْلٍ» الواو واو رُبّ، و«لَيْلٍ» مجرور لفظًا بـ«رُبّ» المحذوفة، مرفوع محلًا على الابتداء، وخبره جملة «تَخَطَّيْتُ أَهْوَالَهُ»."
  - "«إِلَى عُمَرٍ» متعلق بـ«تَخَطَّيْتُ»، وصُرف «عُمَر» للضرورة."
  - "«أَرْتَجِيهِ» جملة حالية من فاعل «تَخَطَّيْتُ»، و«ثِمَالَا» حال من الهاء، أو مفعول ثانٍ على تضمين «أرتجي» معنى «أجعل»."
morphology:
  - "«تَخَطَّى» على وزن تَفَعَّلَ، من الخطو، وأصل لامه واو أو همزة."
  - "«أَرْتَجِي» مضارع «ارْتَجَى» على وزن افتعل، من الرجاء."
  - "«ثِمَالٌ» على وزن فِعال."
rhetoric:
  thesis: "رحلة الليل تنتهي عند عمر: كل الأهوال التي عبرها الشاعر كانت في طريقه إلى من يرجو غوثه. فالخليفة في القصيدة غاية السفر، كما كان الممدوح في القصائد الجاهلية."
  devices:
    - title: "حسن التخلص"
      text: "في «إِلَى عُمَرٍ» انتقل من وصف الرحلة إلى المديح في نصف بيت، دون أن يقطع الكلام: الليل الذي عبره هو نفسه الطريق إلى الممدوح. وهو ما يصفه ابن قُتَيْبة في بناء القصيدة: يرحل الشاعر في شعره، «وشكا النّصب والسّهر، وسرى الليل وحرّ الهجير»، فإذا أوجب على ممدوحه حق الرجاء «بدأ فى المديح، فبعثه على المكافأة» [@ibn-qutayba، ج1 ص76]."
    - title: "الاستعارة"
      text: "في «ثِمَالَا» جعل عمر غياثًا لمن لا غياث له، كما في بيت أبي طالب الذي يستشهد به السُّكَّرِيّ [@diwan-hutayah، ص220]."
  connection: "ويتابع وصف رحلته إليه: «طَوَيْتُ مَهَالِكَ مَخْشِيَّةً»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "وَلَيْلِنْ / تَخَطْطَيْ / تُأَهْوَا / لَهُو = فعولن / فعولن / فعولن / فعو — إِلَى عُ / مَرِنْ أَرْ / تَجِيهِ / ثِمَالَا = فعولُ / فعولن / فعولُ / فعولن"
  note: "العروض محذوفة «فعو»، ودخل القبضُ التفعيلتين الأولى والثالثة من العجز [@atiq، ص121]. وأُشبعت ضمة الهاء في «أَهْوَالَهُ»."
