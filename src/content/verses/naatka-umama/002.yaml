first: "خَيَالًا يَرُوعُكَ عِنْدَ الْمَنَامِ"
second: "وَيَأْبَى مَعَ الصُّبْحِ إِلَّا زَوَالَا"
meaning: "خيالًا يفزعك في نومك بزيارته، ثم يأبى إذا جاء الصبح إلا أن يزول. فالطيف لا يبقى، ولا يترك من أُمامة شيئًا تمسكه."
vocabulary:
  - term: "يَرُوعُكَ"
    text: "يفزعك ويهزّك."
  - term: "زَوَالَا"
    text: "ذهابًا وانقطاعًا."
context: "يكمل صورة الخيال التي بدأت في المطلع، ويغلقها: الخيال يأتي في الليل ويذهب مع الصبح. وبعده يتحول إلى أُمامة نفسها: من أي قوم هي، وأين دارها، وبماذا تُشبه."
syntax:
  - "«خَيَالًا» بدل من «خَيَالَا» في البيت الأول، وهذا التكرار بدل يربط البيتين."
  - "«يَرُوعُكَ» جملة في موضع نصب صفة لـ«خَيَالًا»، و«عِنْدَ الْمَنَامِ» ظرف متعلق بـ«يَرُوعُ»."
  - "«وَيَأْبَى ... إِلَّا زَوَالَا» معطوفة على «يَرُوعُ»، و«إِلَّا» أداة استثناء ملغاة لأن «يأبى» في معنى النفي، و«زَوَالَا» مفعول به."
morphology:
  - "«يَرُوعُ» مضارع «رَاعَ» الأجوف الواوي."
  - "«الْمَنَامُ» مصدر ميمي من «نَامَ»، بمعنى النوم."
  - "«زَوَالٌ» مصدر «زالَ يزول» على وزن فَعال."
rhetoric:
  thesis: "طيف يزور ويفرّ: في الليل يروّع، وفي الصبح يأبى إلا الرحيل. وهو صورة للحب الذي لا يُنال، ومدخل إلى قصيدة يطلب فيها الشاعر ما لم يُنل بعد: عفو عمر."
  devices:
    - title: "ردّ العجز على الصدر بين البيتين"
      text: "في «خَيَالًا» أول البيت كرر الكلمة التي ختم بها البيت الأول، فوصل البيتين وصلًا لفظيًا، وجعل الخيال يملأ الصدر والعجز معًا."
    - title: "التشخيص"
      text: "في «وَيَأْبَى مَعَ الصُّبْحِ إِلَّا زَوَالَا» جعل الخيال صاحب إرادة: يأبى ويرفض، كأنه ضيف عنيد لا يُستبقى."
    - title: "الطباق"
      text: "بين «الْمَنَامِ» و«الصُّبْحِ» طباق في المعنى: الليل الذي يأتي فيه الطيف، والصبح الذي يمحوه."
  connection: "ثم يعرّف بأُمامة: «كِنَانِيَّةٌ دَارُهَا غَرْبَةٌ»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "خَيَالَنْ / يَرُوعُ / كَعِنْدَلْ / مَنَامِي = فعولن / فعولُ / فعولن / فعولن — وَيَأْبَى / مَعَصْصُبْ / حِإِلْلَا / زَوَالَا = فعولن / فعولن / فعولن / فعولن"
  note: "دخل القبضُ التفعيلةَ الثانية من الصدر فصارت «فعولُ» [@atiq، ص121]. وأُشبعت كسرة الميم في آخر الصدر «الْمَنَامِ»."
variants:
  - reading: "وَيَأْتِي مَعَ الصُّبْحِ إِلَّا زَوَالَا"
    status: "رواية «جمهرة أشعار العرب» كما ينقلها المحقق"
