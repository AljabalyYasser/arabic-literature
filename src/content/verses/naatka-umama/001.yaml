first: "نَأَتْكَ أُمَامَةُ إِلَّا سُؤَالَا"
second: "وَأَبْصَرْتَ مِنْهَا بِغَيْبٍ خَيَالَا"
meaning: "بعدت عنك أُمامة، فلم يبق لك منها إلا أن تسأل عنها، وإلا خيال رأيته منها في غيبتها. وفي هامش مخطوطة ابن السِّكِّيت: «إلا سؤالا: يعنى إلا أن تسأل عنها» [@diwan-hutayah، ص214]."
vocabulary:
  - term: "نَأَتْكَ"
    text: "بعدت عنك."
  - term: "أُمَامَةُ"
    text: "اسم امرأة، وهو اسم امرأة الحُطَيْئة في خبر يرويه ابن سَلّام [@ibn-sallam، ج1 ص114]، ولا يقول أحد من الشرّاح إنه أرادها هنا."
  - term: "بِغَيْبٍ"
    text: "في غيبتها، وهي بعيدة عنك."
  - term: "خَيَالَا"
    text: "الطيف الذي يُرى في المنام."
context: "مطلع القصيدة على رواية السُّكَّرِيّ، وهو أول المقدمة الغزلية التي يسمّيها المحقق «المقدمة الغزلية» (الأبيات 1–8) [@diwan-hutayah، ص214]. قصيدة اعتذار إلى عمر تبدأ كما تبدأ القصائد الجاهلية: بامرأة بعيدة وطيف يزور."
syntax:
  - "«نَأَتْكَ أُمَامَةُ» فعل ومفعول وفاعل، و«نأى» يتعدى بنفسه وبـ«عن»."
  - "«إِلَّا سُؤَالَا» استثناء منقطع منصوب، أي: بعدت عنك فلم يبق منها إلا السؤال عنها."
  - "«وَأَبْصَرْتَ مِنْهَا بِغَيْبٍ خَيَالَا» الواو عاطفة، و«خَيَالَا» مفعول به، و«بِغَيْبٍ» جار ومجرور في موضع الحال."
morphology:
  - "«نَأَتْ» ماضٍ من «نَأَى يَنْأَى» المعتل الآخر، حُذفت ألفه لاتصاله بتاء التأنيث الساكنة."
  - "«سُؤَالٌ» مصدر «سَأَلَ» على وزن فُعال."
  - "«خَيَالٌ» على وزن فَعال، وجمعه أخيلة."
rhetoric:
  thesis: "يبدأ بالغياب: امرأة بعيدة لا يصل إليها إلا بالسؤال وبالطيف. وهو يتهيأ لقصيدة اعتذار، فيبدأها بغائب لا يُدرك، كما سيكون رضا عمر بعيدًا لا يُدرك إلا بالرحلة."
  devices:
    - title: "الاستثناء بعد النفي الضمني"
      text: "في «نَأَتْكَ أُمَامَةُ إِلَّا سُؤَالَا» جعل البعد تامًا ثم استثنى منه ما لا يُقرّب: السؤال. فالاستثناء يؤكد البعد ولا ينقضه."
    - title: "المطلع التقليدي"
      text: "في «خَيَالَا» يستعمل صورة الطيف التي تكثر في مطالع القصائد. وابن قُتَيْبة ينقل أن مقصد القصيد يبدأ بالديار والنسيب ليميل نحوه القلوب، ثم يصل إلى المدح [@ibn-qutayba، ج1 ص75]."
  connection: "ثم يصف الخيال نفسه: «خَيَالًا يَرُوعُكَ عِنْدَ الْمَنَامِ»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "نَأَتْكَ / أُمَامَ / ةُإِلْلَا / سُؤَالَا = فعولُ / فعولُ / فعولن / فعولن — وَأَبْصَرْ / تَمِنْهَا / بِغَيْبِنْ / خَيَالَا = فعولن / فعولن / فعولن / فعولن"
  note: "وزن المتقارب «فعولن» ثماني مرات. ودخل القبضُ، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلتين الأوليين في الصدر فصارتا «فعولُ». والبيت مصرّع: «سُؤَالَا» و«خَيَالَا»."
variants:
