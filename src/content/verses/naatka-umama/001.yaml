    status: "رواية السُّكَّرِيّ"
    note: "«بغيب: هـ: بطيف» [@diwan-hutayah، ص214]."
  - reading: "وَأَبْصَرْتَ مِنْهَا بِعَيْنٍ خَيَالَا"
    status: "رواية «جمهرة أشعار العرب»"
    note: "[@jamhara، ص657] [@diwan-hutayah، ص214]."
