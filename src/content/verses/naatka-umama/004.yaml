first: "كَعَاطِيَةٍ مِنْ ظِبَاءِ السَّلِيلِ"
second: "حُسَّانَةِ الْجِيدِ تُزْجِي غَزَالَا"
vocabulary:
  - term: "كَعَاطِيَةٍ"
    text: "ظبية تتناول ورق الشجر؛ في شرح السُّكَّرِيّ: «العاطية: التى تناول بظلفها الغصن إذا ارتفع عنها» [@diwan-hutayah، ص215]."
  - term: "السَّلِيلِ"
    text: "«والسليل: الوادى يُنبت الطلح والسَّمُر» [@diwan-hutayah، ص215]."
