explained: false
first: "إِذَا مَا النَّوَاعِجُ وَاكَبْنَهَا"
second: "جَشَمْنَ مِنَ السَّيْرِ رَبْوًا عُضَالَا"
vocabulary:
  - term: "النَّوَاعِجُ"
    text: "«النواعج: البيض من الإبل» [@diwan-hutayah، ص218]."
  - term: "وَاكَبْنَهَا"
    text: "«سرن معها فى الموكب» [@diwan-hutayah، ص218]."
  - term: "جَشَمْنَ"
    text: "«تكلفن على مشقة فى السير» [@diwan-hutayah، ص218]."
  - term: "رَبْوًا"
    text: "«وهو أن تربو: تنتفخ» [@diwan-hutayah، ص218]."
  - term: "عُضَالَا"
    text: "«شديد الأدواء» [@diwan-hutayah، ص218]."
