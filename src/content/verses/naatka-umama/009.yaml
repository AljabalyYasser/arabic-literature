first: "فَهَلْ تُبْلِغَنِّيكَهَا عِرْمِسٌ"
second: "صَمُوتُ السُّرَى لَا تَشَكَّى الْكَلَالَا"
meaning: "فهل توصلني إليها ناقة شديدة صلبة، صامتة في سير الليل، لا تشكو التعب؟ وفي هامش مخطوطة ابن السِّكِّيت: «عِرْمِسٌ: شديدة، وصموت: لا ترغو. والكَلال: الإعياء» [@diwan-hutayah، ص217]."
vocabulary:
  - term: "عِرْمِسٌ"
    text: "الناقة الشديدة الصلبة؛ قال السُّكَّرِيّ: «العِرْمِسُ: الشديدة، شبّهها بالصخرة» [@diwan-hutayah، ص217]."
  - term: "صَمُوتُ"
    text: "لا ترغو، أي لا تصيح؛ قال السُّكَّرِيّ: «والصَّمُوت: التى لا ترغو لصبرها وكرمها» [@diwan-hutayah، ص217]."
  - term: "السُّرَى"
    text: "السير بالليل."
  - term: "الْكَلَالَا"
    text: "التعب والإعياء [@diwan-hutayah، ص217]."
context: "أول وصف الناقة (الأبيات 9–16)، وهو الخروج من الغزل إلى الرحلة على عادة القصيدة الطويلة. والسؤال «فهل تبلغنّيكها» يجعل الرحلة طريقًا إلى المرأة البعيدة، وهي في آخر القصيدة طريق إلى عمر."
syntax:
  - "«فَهَلْ» الفاء استئنافية، و«هل» حرف استفهام."
  - "«تُبْلِغَنِّيكَهَا» فعل مضارع مبني على الفتح لاتصاله بنون التوكيد الثقيلة، والياء مفعول به أول، والكاف للخطاب، والهاء مفعول به ثانٍ: تبلغني إياها."
  - "«عِرْمِسٌ» فاعل، و«صَمُوتُ السُّرَى» صفة له، و«لَا تَشَكَّى» جملة في موضع رفع صفة ثانية، و«الْكَلَالَا» مفعول به."
morphology:
  - "«تُبْلِغَنَّ» مضارع «أَبْلَغَ» الرباعي، مؤكد بالنون الثقيلة."
  - "«تَشَكَّى» أصله «تَتَشَكَّى»، حُذفت إحدى التاءين تخفيفًا."
  - "«صَمُوتٌ» صيغة مبالغة على وزن فَعُول، يستوي فيها المذكر والمؤنث."
rhetoric:
  thesis: "سؤال يفتح الرحلة: هل من ناقة توصلني؟ والجواب وصف الناقة كلها: صلبة كالصخر، صابرة صامتة. فالشاعر يصف أداة الوصول قبل أن يصل."
  devices:
    - title: "الاستفهام"
      text: "في «فَهَلْ تُبْلِغَنِّيكَهَا» استفهام لا يطلب جوابًا، بل يتمنى ويمهّد للوصف. ونون التوكيد في الاستفهام تشدّ الرجاء."
    - title: "الكناية"
      text: "في «صَمُوتُ السُّرَى» كنى عن صبرها وكرمها بأنها لا ترغو في سير الليل، كما يشرحها السُّكَّرِيّ «لصبرها وكرمها» [@diwan-hutayah، ص217]. والكناية عند عبد القاهر الجُرْجانيّ أن يذكر المتكلم معنى «هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]: والصمت تالي الصبر."
    - title: "الإيجاز في الضمائر"
      text: "في «تُبْلِغَنِّيكَهَا» جمع ثلاثة ضمائر في كلمة واحدة: المتكلم، والمخاطب، والغائبة. فالكلمة نفسها رحلة من الشاعر إلى المرأة."
  connection: "ثم يصف خَلق الناقة وسرعتها: «مُفَرَّجَةُ الضَّبْعِ مَوَّارَةٌ»."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "فَهَلْ تُبْ / لِغَنْنِي / كَهَا عِرْ / مِسُنْ = فعولن / فعولن / فعولن / فعو — صَمُوتُسْ / سُرَى لَا / تَشَكْكَى / لْكَلَالَا = فعولن / فعولن / فعولن / فعولن"
  note: "جاءت العروض محذوفة «فعو»، والحذف «حذف السبب الخفيف من آخر فعولن فتصبح فعو، وتنقل إلى فعَلْ» [@atiq، ص121]."
