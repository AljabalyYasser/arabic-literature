first: "فَإِنَّكَ خَيْرٌ مِنَ الزِّبْرِقَانِ"
second: "أَشَدُّ نَكَالًا وَخَيْرٌ نَوَالَا"
meaning: "فأنت خير من الزِّبْرِقان: أشد منه عقوبة إذا عاقبت، وأكثر منه عطاء إذا أعطيت. فالشاعر يحتمي بعمر من خصمه، ويجعل عقوبة عمر نفسها خيرًا من عقوبة الزِّبْرِقان."
vocabulary:
  - term: "الزِّبْرِقَانِ"
    text: "الزِّبْرِقان بن بدر، خصم الحُطَيْئة الذي هجاه في السينية فاستعدى عليه عمر [@ibn-sallam، ج1 ص116]."
  - term: "نَكَالًا"
    text: "عقوبة رادعة."
  - term: "نَوَالَا"
    text: "عطاءً."
context: "خاتمة القصيدة على رواية السُّكَّرِيّ، وأقرب أبياتها إلى خبر الحبس. وهو البيت الوحيد منها الذي في القطعة «أعوذ بجدك» التي يرويها أبو عُبَيْدة، فيقول المحقق: «ولم يرد منها فى ع أو طبعة جولدتسيهر إلا البيت 29 الذى ذكر فى القصيدة السابقة» [@diwan-hutayah، ص222]. ويروي أبو الفَرَج تلك القطعة على أنها «أول ما قاله» الحُطَيْئة لما حبسه عمر، والبيت فيها ثانيها [@aghani-dk، ج2 ص187]."
syntax:
  - "«فَإِنَّكَ خَيْرٌ» الفاء تعليلية، و«خَيْرٌ» خبر «إنّ»، و«مِنَ الزِّبْرِقَانِ» متعلق بـ«خَيْرٌ»."
  - "«أَشَدُّ نَكَالًا» خبر ثانٍ لـ«إنّ»، و«نَكَالًا» تمييز."
  - "«وَخَيْرٌ نَوَالَا» معطوف على «أَشَدُّ»، و«نَوَالَا» تمييز."
morphology:
  - "«خَيْرٌ» اسم تفضيل حُذفت همزته لكثرة الاستعمال، وأصله أَخْيَر."
  - "«أَشَدُّ» اسم تفضيل من «شَدَّ» على وزن أَفْعَل، أُدغمت عينه في لامه."
  - "«نَكَالٌ» و«نَوَالٌ» مصدران على وزن فَعال."
rhetoric:
  thesis: "يجمع الشاعر في عمر ما يخافه وما يرجوه: هو أشد عقوبة، وهو أكرم عطاء. والاعتذار عنده لا ينفي الذنب، بل يضع المذنب بين يدي من يملك العقوبة والعفو معًا."
  devices:
    - title: "المقابلة"
      text: "في «أَشَدُّ نَكَالًا وَخَيْرٌ نَوَالَا» قابل بين العقوبة والعطاء، وجعلهما متجاورين في نصف بيت. والتجانس بين «نَكَالًا» و«نَوَالَا» يقوّي المقابلة: كلمتان على وزن واحد وقافية واحدة، ومعنيان متضادان."
    - title: "التفضيل على الخصم"
      text: "في «خَيْرٌ مِنَ الزِّبْرِقَانِ» فضّل الخليفة على خصمه. وهو يعتذر من الهجاء بالتفضيل نفسه الذي عدّه بعضهم أشد الهجاء [@ibn-rashiq، ج2 ص170]: فالزِّبْرِقان مذكور في المدح أيضًا، دون عمر."
  connection: "وبهذا البيت تنتهي القصيدة على رواية السُّكَّرِيّ."
prosody:
  meter: "البحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، تتبعها ألف الإطلاق"
  scansion: "فَإِنْنَ / كَخَيْرُنْ / مِنَزْزِبْ / رِقَانِي = فعولُ / فعولن / فعولن / فعولن — أَشَدْدُ / نَكَالَنْ / وَخَيْرُنْ / نَوَالَا = فعولُ / فعولن / فعولن / فعولن"
  note: "دخل القبضُ التفعيلةَ الأولى في الشطرين فصارت «فعولُ» [@atiq، ص121]. وأُشبعت كسرة النون في «الزِّبْرِقَانِ»."
