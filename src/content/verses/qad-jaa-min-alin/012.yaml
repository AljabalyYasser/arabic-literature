first: "لَمْ تُرَ أَرْضٌ وَلَمْ يُسْمَعْ بِهَا أَحَدٌ"
second: "إِلَّا بِهَا مِنْ نَوَادِي وَقْعِهِ أَثَرُ"
vocabulary:
  - term: "نَوَادِي"
    text: "«نوادي كل شيء بالنون أوائله وما ندر منه» [@khizana، ج1 ص195]."
  - term: "وَقْعِهِ"
    text: "نزوله بها غازيًا [@khizana، ج1 ص195]."
