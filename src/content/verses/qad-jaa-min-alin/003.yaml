explained: false
first: "وَجَاشَتِ النَّفْسُ لَمَّا جَاءَ جَمْعُهُمُ"
second: "وَرَاكِبٌ جَاءَ مِنْ تَثْلِيثَ مُعْتَمِرُ"
vocabulary:
  - term: "جَاشَتِ النَّفْسُ"
    text: "اضطربت وغثت، قال المُبَرِّد: «خبثت، يكون ذلك من تذكرها للتهوع» [@kamil، ج4 ص57]، والتهوّع: التقيؤ."
  - term: "جَمْعُهُمُ"
    text: "القوم الذين شهدوا مقتله، ويروى «فَلُّهم»، أي منهزموهم [@khizana، ج1 ص192]."
  - term: "تَثْلِيثَ"
    text: "«اسم موضع» [@khizana، ج1 ص192]."
  - term: "مُعْتَمِرُ"
    text: "«صفة راكب بمعنى زائر» [@khizana، ج1 ص192]."
