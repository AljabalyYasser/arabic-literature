explained: false
first: "وَرَاحَتِ الشَّوْلُ مُغْبَرًّا مَبَاءَتُهَا"
second: "شُعْثًا تَغَيَّرَ مِنْهَا النِّيُّ وَالوَبَرُ"
vocabulary:
  - term: "الشَّوْلُ"
    text: "النوق التي «أتى عليها من حملها أو وضعها سبعة أشهر فجف لبنها» [@khizana، ج1 ص193]."
  - term: "مَبَاءَتُهَا"
    text: "مراحها الذي تبيت فيه."
  - term: "شُعْثًا"
    text: "متغيرة متلبدة الوبر من الجدب."
  - term: "النِّيُّ"
    text: "«الشحم» [@khizana، ج1 ص193]."
