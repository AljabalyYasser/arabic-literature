explained: false
first: "مُهَفْهَفٌ أَهْضَمُ الكَشْحَيْنِ مُنْخَرِقٌ"
second: "عَنْهُ القَمِيصُ لِسَيْرِ اللَّيْلِ مُحْتَقِرُ"
vocabulary:
  - term: "مُهَفْهَفٌ"
    text: "«الخميص البطن الدقيق الخصر» [@khizana، ج1 ص196]."
  - term: "أَهْضَمُ الكَشْحَيْنِ"
    text: "«المنضم الجنبين» [@khizana، ج1 ص196]، والعرب تمدح الضمور."
  - term: "مُنْخَرِقٌ عَنْهُ القَمِيصُ"
    text: "من طول السفر، يقال: «رجل منخرق السربال إذا طال سفره فشققت ثيابه» [@khizana، ج1 ص196]."
  - term: "مُحْتَقِرُ"
    text: "يستصغر سير الليل ولا يهابه."
