first: "إِمَّا سَلَكْتَ سَبِيلًا كُنْتَ سَالِكَهَا"
second: "فَاذْهَبْ فَلَا يُبْعِدَنْكَ اللَّهُ مُنْتَشِرُ"
vocabulary:
  - term: "سَبِيلًا كُنْتَ سَالِكَهَا"
    text: "طريق الموت الذي لا بد منه."
  - term: "لَا يُبْعِدَنْكَ اللَّهُ"
    text: "دعاء للميت ألا يُنسى."
  - term: "مُنْتَشِرُ"
    text: "منادى حُذف حرف ندائه: يا منتشر."
