first: "عِشْنَا بِذَلِكَ دَهْرًا ثُمَّ فَارَقَنَا"
second: "كَذَلِكَ الرُّمْحُ ذُو النَّصْلَيْنِ يَنْكَسِرُ"
meaning: "عشنا بهذه الخصال كلها زمنًا طويلًا، ثم فارقنا. وكذلك الرمح القوي المسلّح من طرفيه، بالسنان في أعلاه والزُّجّ في أسفله، ينكسر آخر الأمر. يقول البغدادي: «وهذا مثل أي كل شيء يهلك ويذهب» [@khizana، ج1 ص199]."
vocabulary:
  - term: "دَهْرًا"
    text: "زمنًا طويلًا."
  - term: "ذُو النَّصْلَيْنِ"
    text: "«والنصلان هما السنان وهي الحديدة العليا من الرمح والزج وهي الحديدة السفلى» [@khizana، ج1 ص199]."
context: "نقطة التحول في القصيدة. بعد أن عدّد صفاته من البيت 6 إلى 26، يعود إلى الفقد في شطر واحد، ويفتح الأبيات الأخيرة: الجزع والصبر (28–29)، ثم خطاب القاتل والوداع (30–33)."
syntax:
  - "«عشنا» فعل وفاعل، و«بذلك» متعلق به، والإشارة إلى ما عدّده من خصاله، و«دهرًا» ظرف زمان."
  - "«ثم فارقنا» معطوف على «عشنا»، والفاعل ضمير مستتر يعود على المنتشر، و«نا» مفعول به."
  - "«الرمحُ» مبتدأ، و«ذو النصلين» صفته، وجملة «ينكسر» خبره. و«كذلك» جار ومجرور متعلق بـ«ينكسر»، أي ينكسر انكسارًا مثل ذلك، وقُدّم للعناية به."
morphology:
  - "«النصلين» مثنى «نَصْل»، وأطلقه على السنان والزُّجّ تغليبًا، أي سمّى الاثنين باسم أحدهما."
  - "«ينكسر» مضارع «انكسر» على «انفعل»، وهو مطاوع «كَسَر»."
  - "«ذلك» اسم إشارة للبعيد، يُكتب بلا ألف ويُنطق «ذالك»."
rhetoric:
  thesis: "حكمة تختم الثناء: كل قوي ينكسر."
  devices:
    - title: "التمثيل في «كذلك الرمح ذو النصلين ينكسر»"
      text: "يجعل موت المنتشر صورة من قانون عام: الرمح المسلّح من طرفيه لا يمنعه سلاحه من الانكسار. فالتمثيل جاء بعد المعنى ليقرّره ويجعله حكمة تُحفظ. وفي هذا الموضع يقول عبد القاهر: «أن التمثيل إذا جاء في أعقاب المعاني، أو برزت هي باختصار في معرضه، ونقلت عن صورها الأصلية إلى صورته، كساها أبهة» [@asrar، ص115]."
    - title: "اسم الإشارة «بذلك»"
      text: "يشير «ذلك» إلى عشرين بيتًا من الصفات قبله، فيجمعها في كلمة واحدة، كأنه يقول: هذا كله كان، وانتهى."
    - title: "الإيجاز في «ثم فارقنا»"
      text: "الموت كله في كلمة «فارقنا»، بلا ذكر للقتل ولا للقاتل ولا لما صُنع به. ويؤخر ذكر القاتل إلى البيت 30."
  connection: "ثم يقول: إن جزعنا فالمصيبة هدّتنا، وإن صبرنا فنحن قوم صُبُر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "عِشْنَابِذَا / لِكَدَهْ / رَنْثُمْمَفَا / رَقَنَا = مستفعلن / فعِلن / مستفعلن / فعِلن — كَذَالِكَرْ / رُمْحُذُنْ / نَصْلَيْنِيَنْ / كَسِرُو = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "العروض مخبونة «فعِلن» والضرب مخبون مثلها [@atiq، ص48]. ودخل الخبن «فاعلن» الأولى في الصدر، و«مستفعلن» الأولى في العجز فصارت «متفعلن»، والخبن «حذف الثاني الساكن» [@atiq، ص46]."
