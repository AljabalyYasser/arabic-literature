explained: false
first: "لَا يَتَأَرَّى لِمَا فِي القِدْرِ يَرْقُبُهُ"
second: "وَلَا يَزَالُ أَمَامَ القَوْمِ يَقْتَفِرُ"
vocabulary:
  - term: "لَا يَتَأَرَّى"
    text: "قال المُبَرِّد: «لا يتحبس له» [@kamil، ج4 ص60]، أي لا يقعد ينتظر نضج القدر."
  - term: "يَقْتَفِرُ"
    text: "يتبع الأثر، و«الاقتفار بتقديم القاف على الفاء اتباع الآثار» [@khizana، ج1 ص197]."
