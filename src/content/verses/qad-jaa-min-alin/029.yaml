explained: false
first: "إِنِّي أَشُدُّ حَزِيمِي ثُمَّ يُدْرِكُنِي"
second: "مِنْكَ البَلَاءُ وَمِنْ آلَائِكَ الذِّكَرُ"
vocabulary:
  - term: "حَزِيمِي"
    text: "يقول محققا «الأصمعيات»: «الحزيم: موضع الحزام من الصدر والظهر كله» [@asmaiyyat، ص91، الحاشية]. وشدّه كناية عن التجلّد."
  - term: "البَلَاءُ"
    text: "الصنيع الحسن."
  - term: "آلَائِكَ"
    text: "نعمك."
  - term: "الذِّكَرُ"
    text: "جمع ذِكْرة، أي تذكّري لنعمك."
