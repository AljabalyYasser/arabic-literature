explained: false
first: "طَاوِي المَصِيرِ عَلَى العَزَّاءِ مُنْصَلِتٌ"
second: "بِالقَوْمِ لَيْلَةَ لَا مَاءٌ وَلَا شَجَرُ"
vocabulary:
  - term: "طَاوِي المَصِيرِ"
    text: "ضامر البطن، والمصير المِعى، و«أراد طاوي البطن» [@khizana، ج1 ص196]."
  - term: "العَزَّاءِ"
    text: "قال المُبَرِّد: «العزاء: الأمر الشديد» [@kamil، ج4 ص58]."
  - term: "مُنْصَلِتٌ"
    text: "ماضٍ كالسيف المسلول، قال المُبَرِّد: «يقال: سيف منصلت، وصلت: إذا جرد من غمده» [@kamil، ج4 ص58]."
