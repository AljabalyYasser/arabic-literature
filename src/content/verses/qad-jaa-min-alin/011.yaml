first: "وَتَفْزَعُ الشَّوْلُ مِنْهُ حِينَ يَفْجَؤُهَا"
second: "حَتَّى تَقَطَّعَ فِي أَعْنَاقِهَا الجِرَرُ"
vocabulary:
  - term: "يَفْجَؤُهَا"
    text: "يأتيها بغتة."
  - term: "الجِرَرُ"
    text: "جمع جِرّة، «وهي ما يخرجه البعير للاجترار» [@khizana، ج1 ص194]. يقول المُبَرِّد: «حتى اعتادت أن ينحرها، فهي تفزع منه» [@kamil، ج4 ص59]."
