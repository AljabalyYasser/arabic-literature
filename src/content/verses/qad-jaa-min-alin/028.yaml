first: "فَإِنْ جَزِعْنَا فَقَدْ هَدَّتْ مُصِيبَتُنَا"
second: "وَإِنْ صَبَرْنَا فَإِنَّا مَعْشَرٌ صُبُرُ"
vocabulary:
  - term: "هَدَّتْ"
    text: "هدمت وأضعفت، والمفعول محذوف يقدّره البغدادي: «أي قوانا» [@khizana، ج1 ص199]."
  - term: "صُبُرُ"
    text: "«جمع صبور مبالغة صابر» [@khizana، ج1 ص199]."
