explained: false
first: "أَخُو رَغَائِبَ يُعْطِيهَا وَيُسْأَلُهَا"
second: "يَأْبَى الظُّلَامَةَ مِنْهُ النَّوْفَلُ الزُّفَرُ"
vocabulary:
  - term: "رَغَائِبَ"
    text: "«جمع رغيبة وهي العطايا الكثيرة» [@khizana، ج1 ص187]."
  - term: "الظُّلَامَةَ"
    text: "الظلم، وهي عند البغدادي «ما تطلبه عند الظالم» [@khizana، ج1 ص187]."
  - term: "النَّوْفَلُ"
    text: "«البحر والكثير العطاء» [@khizana، ج1 ص187]."
  - term: "الزُّفَرُ"
    text: "«الكثير الناصر والأهل والعدة» [@khizana، ج1 ص187]."
