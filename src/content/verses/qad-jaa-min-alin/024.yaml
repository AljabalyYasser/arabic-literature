first: "تَكْفِيهِ حُزَّةُ فِلْذٍ إِنْ أَلَمَّ بِهَا"
second: "مِنَ الشِّوَاءِ وَيُرْوِي شُرْبَهُ الغُمَرُ"
vocabulary:
