first: "عَلَيْهِ أَوَّلُ زَادِ القَوْمِ إِنْ نَزَلُوا"
second: "ثُمَّ المَطِيُّ إِذَا مَا أَرْمَلُوا جُزُرُ"
meaning: "إذا نزل القوم في سفرهم فهو الذي يطعمهم من زاده أولًا، فإذا نفد زادهم نحر لهم الإبل التي يركبونها. يقول البغدادي: «يعني أنه يرتب على نفسه زاد أصحابه أولا وإذا فني الزاد نحر لهم» [@khizana، ج1 ص194]."
vocabulary:
  - term: "زَادِ القَوْمِ"
    text: "طعامهم في السفر."
  - term: "أَرْمَلُوا"
    text: "«وأرمل الرجل نفد زاده» [@khizana، ج1 ص194]."
  - term: "المَطِيُّ"
    text: "«جمع مطية وهي الناقة» [@khizana، ج1 ص194]، والمراد الرواحل التي يركبونها."
  - term: "جُزُرُ"
    text: "«بضمتين جمع جزور وهي الناقة التي تنحر» [@khizana، ج1 ص194]."
context: "من أبيات الكرم (6–13). بعد أن وصف إطعامه الحيّ في سنة الجدب (6–8)، ينتقل إلى كرمه في السفر مع رفاقه، ثم إلى الإبل التي تعرف سيفه (10–11)."
syntax:
  - "«عليه» جار ومجرور متعلق بمحذوف خبر مقدم، و«أولُ» مبتدأ مؤخر، و«زادِ» مضاف إليه، و«القوم» مضاف إليه."
  - "«إن نزلوا» شرط حُذف جوابه لدلالة ما قبله عليه، والتقدير: إن نزلوا فعليه أول زادهم."
  - "«ثم المطيُّ ... جُزُرُ»: «المطيُّ» مبتدأ، و«جُزُرُ» خبره. و«إذا ما أرملوا» ظرف متضمن معنى الشرط معترض بينهما، و«ما» زائدة."
morphology:
  - "«زاد» اسم لطعام المسافر، وجمعه أزواد."
  - "«المطيّ» جمع «مطيّة» على «فعيل»، وهي الراحلة."
  - "«جُزُر» جمع «جَزُور» على «فُعُل»، مثل رسول ورُسُل."
  - "«أرملوا» على «أفعلوا»، أي صاروا بلا زاد."
rhetoric:
  thesis: "كرم مرتّب في السفر: الزاد أولًا، ثم الرواحل نفسها."
  devices:
    - title: "تقديم «عليه»"
      text: "قدّم الخبر «عليه» على المبتدأ، فجعل زاد القوم دَينًا عليه هو لا على غيره، كأنه واجب لزمه. والتقديم عند عبد القاهر لما يُعتنى به، ويستشهد بقول سيبويه: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "الكناية في «ثم المطيُّ ... جُزُرُ»"
      text: "نحر الراحلة في الصحراء غاية الكرم، لأن فيها نجاة راكبها. فلم يقل «هو أكرم الناس»، بل ذكر فعلًا يلزم منه ذلك. والكناية عند عبد القاهر أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الترتيب بـ«ثم»"
      text: "«ثم» تجعل نحر المطيّ مرتبة ثانية بعد الزاد: لا يبدأ به، ولا يتردد فيه إذا نفد الزاد."
  connection: "ثم يصف الإبل نفسها: البازل الكوماء لا تأمن ضربته بالسيف."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "عَلَيْهِأَوْ / وَلُزَا / دِلْقَوْمِإِنْ / نَزَلُو = متفعلن / فعِلن / مستفعلن / فعِلن — ثُمْمَلْمَطِيْ / يُإِذَا / مَاأَرْمَلُو / جُزُرُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "العروض مخبونة «فعِلن» والضرب مخبون مثلها [@atiq، ص48]. ودخل الخبن «مستفعلن» الأولى في الصدر فصارت «متفعلن»، والخبن «حذف الثاني الساكن» [@atiq، ص46]."
