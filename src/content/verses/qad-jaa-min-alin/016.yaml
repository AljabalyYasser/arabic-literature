first: "أَخُو حُرُوبٍ وَمِكْسَابٌ إِذَا عَدِمُوا"
second: "وَفِي المَحَافِلِ مِنْهُ الجِدُّ وَالحَذَرُ"
vocabulary:
  - term: "مِكْسَابٌ"
    text: "كثير الكسب، يكسب لقومه."
  - term: "عَدِمُوا"
    text: "افتقروا، و«العدم الفقر» [@khizana، ج1 ص195]."
  - term: "المَحَافِلِ"
    text: "مجامع القوم."
