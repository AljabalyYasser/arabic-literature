explained: false
first: "فَظَلْتُ مُرْتَفِقًا لِلنَّجْمِ أَرْقُبُهُ"
second: "حَرَّانَ مُكْتَئِبًا لَوْ يَنْفَعُ الحَذَرُ"
vocabulary:
  - term: "مُرْتَفِقًا"
    text: "قال المُبَرِّد: «وهو المتكئ على مرفقه، وإنما أراد السهر» [@kamil، ج4 ص57]."
  - term: "أَرْقُبُهُ"
    text: "أرعاه بعيني حتى يغيب، من طول السهر."
  - term: "حَرَّانَ"
    text: "ملتهب الجوف من الحزن."
