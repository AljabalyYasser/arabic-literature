explained: false
first: "لَا يَغْمِزُ السَّاقَ مِنْ أَيْنٍ وَمِنْ وَصَبٍ"
second: "وَلَا يَعَضُّ عَلَى شُرْسُوفِهِ الصَّفَرُ"
vocabulary:
  - term: "لَا يَغْمِزُ السَّاقَ"
    text: "لا يجسّها ويدلكها من التعب، يصف «جلده وتحمله للمشاق» [@khizana، ج1 ص197]."
  - term: "أَيْنٍ"
    text: "«الإعياء» [@khizana، ج1 ص197]."
  - term: "وَصَبٍ"
    text: "«الوجع» [@khizana، ج1 ص197]."
  - term: "شُرْسُوفِهِ"
    text: "طرف ضلعه، قال المُبَرِّد: «الشراسيف: أطراف الضلوع» [@kamil، ج4 ص60]."
  - term: "الصَّفَرُ"
    text: "قال المُبَرِّد: «حية البطن» [@kamil، ج4 ص60]، وكانوا يزعمون أنها تعض الجائع. ويقول البغدادي إن الشاعر «أراد أنه لا صفر في جوفه فيعض يصفه بشدة الخلق وصحة البنية» [@khizana، ج1 ص197]."
