explained: false
first: "إِنَّ الَّذِي جِئْتَ مِنْ تَثْلِيثَ تَنْدُبُهُ"
second: "مِنْهُ السَّمَاحُ وَمِنْهُ النَّهْيُ وَالغِيَرُ"
vocabulary:
  - term: "تَنْدُبُهُ"
    text: "تبكيه وتعدّد محاسنه [@khizana، ج1 ص192–193]."
  - term: "النَّهْيُ وَالغِيَرُ"
    text: "النهي خلاف الأمر، والغِيَر عند البغدادي «اسم من غيرت الشيء فتغير، أقامه مقام الأمر» [@khizana، ج1 ص193]. أي إليه كان أمر القوم ونهيهم."
