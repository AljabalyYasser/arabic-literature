explained: false
first: "نَعَيْتَ مَنْ لَا تُغِبُّ الحَيَّ جَفْنَتُهُ"
second: "إِذَا الكَوَاكِبُ أَخْطَا نَوْءَهَا المَطَرُ"
vocabulary:
  - term: "نَعَيْتَ"
    text: "أخبرت بموته. قال الأَصْمَعِيّ: «كانت العرب إذا مات ميت له قدر ركب راكب فرسا وجعل يسير في الناس ويقول نعاء فلانا» [@khizana، ج1 ص193]."
  - term: "لَا تُغِبُّ الحَيَّ جَفْنَتُهُ"
    text: "لا تأتيهم قصعته يومًا وتغيب يومًا، بل كل يوم [@khizana، ج1 ص193]."
  - term: "أَخْطَا نَوْءَهَا المَطَرُ"
    text: "إذا لم تمطر النجوم التي كانوا ينسبون إليها المطر، أي في القحط. والنوء عند المُبَرِّد «طلوع نجم وسقوط آخر» [@kamil، ج4 ص58]."
