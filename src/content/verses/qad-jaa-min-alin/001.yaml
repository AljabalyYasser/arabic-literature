first: "قَدْ جَاءَ مِنْ عَلُ أَنْبَاءٌ أُنَبَّؤُهَا"
second: "إِلَيَّ لَا عَجَبٌ مِنْهَا وَلَا سُخُرُ"
meaning: "جاءتني من أعالي البلاد أخبار أُخبَر بها، لا أعجب منها ولا هي مما يُسخر منه: إنها نعي المنتشر. ويفسّر البغدادي «لا عجب» بقوله: «لا أعجب منها، وإن كانت عظيمة، لأن مصائب الدنيا كثيرة» [@khizana، ج1 ص192]، أي إن الموت لا يُستغرب وإن عظم الميت. و«لا سُخُر»: لا أقول ذلك هازئًا، فالخبر جِدّ."
vocabulary:
  - term: "مِنْ عَلُ"
    text: "من فوق. قال المُبَرِّد: «من عل يقول: من فوق» [@kamil، ج4 ص56]. وعن أبي عُبَيْدة، فيما ينقله البغدادي: «أراد العالية» [@khizana، ج1 ص191]، وهي أعالي نجد."
  - term: "أَنْبَاءٌ"
    text: "أخبار، جمع نبأ."
  - term: "أُنَبَّؤُهَا"
    text: "أُخبَر بها."
  - term: "سُخُرُ"
    text: "السخرية، وهو عند البغدادي «بفتحتين وبضمتين: مصدر سخر منه» [@khizana، ج1 ص192]."
context: "مطلع المرثية. يدخل الشاعر في الخبر من أول كلمة، بلا وقوف على الأطلال ولا نسيب، ولا يسمّي الميت. ثم يصف ليلته بعد الخبر (2)، واضطراب نفسه حين جاء القوم والراكب من تَثْلِيث (3–4)، ولا يذكر المنتشر بصفاته إلا في البيت السادس."
syntax:
  - "«قد» حرف تحقيق، و«جاء» فعل ماض، و«أنباءٌ» فاعله مؤخر."
  - "«من علُ» جار ومجرور متعلق بـ«جاء». و«علُ» ظرف مبني على الضم، لأنه قُطع عن الإضافة ونُوي معناها، كقبلُ وبعدُ. قال المُبَرِّد: «فإذا كان معرفة مفردا بني على الضم. كقبل وبعد» [@kamil، ج4 ص56]."
  - "«أُنبَّؤها» فعل مضارع مبني للمجهول، ونائب الفاعل ضمير المتكلم، والهاء مفعول به ثانٍ. والجملة في محل رفع صفة لـ«أنباء»."
  - "«إليّ» متعلق بـ«جاء»، وتأخر إلى أول العجز."
  - "«لا عجبٌ منها ولا سُخُرُ»: «لا» نافية لم تعمل لتكرارها، و«عجبٌ» مبتدأ، و«منها» متعلق بمحذوف خبر، و«ولا سخرُ» معطوف عليه. والجملة صفة ثانية لـ«أنباء»."
morphology:
  - "«أنباء» جمع «نَبَأ» على «أفعال»."
  - "«أُنَبَّؤها» مضارع «نَبَّأ» المضعّف، مبني للمجهول، والفعل يتعدى إلى مفعولين."
  - "«عَلُ» من «علا يعلو»، ويقال فيه «عَلُ» و«عَلِ» و«عَلْوُ» بأوجه، كما يذكر البغدادي [@khizana، ج1 ص192]."
  - "«سُخُر» مصدر «سَخِرَ»، ويقال «سَخَر» بفتحتين."
rhetoric:
  thesis: "مطلع يقدّم الخبر ويؤخر صاحبه، فيبقى السامع مع الشاعر ينتظر أن يعرف من مات."
  devices:
    - title: "تنكير «أنباءٌ»"
      text: "لم يقل «نعي المنتشر»، بل «أنباءٌ» نكرة، فأبهم الخبر وهوّله. فالسامع يعرف أن المصاب كبير قبل أن يعرف صاحبه. وهذه قراءتنا."
    - title: "ترك الذكر"
      text: "في الشطرين كليهما لم يذكر الشاعر من مات، وترك «لا عجب منها» تدل على أنه أمر جليل. وفي مثل هذا يقول عبد القاهر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "اللسان بمعنى الرسالة (في الرواية الأخرى)"
      text: "في رواية المُبَرِّد «إنّي أتتني لسانٌ»: جعل اللسان، وهو آلة الكلام، اسمًا لما يُقال به، أي الرسالة، قال: «وأراد باللسان ها هنا الرسالة» [@kamil، ج4 ص56]. ولذلك أنّث الفعل «أتتني»، لأن اللسان بمعنى الرسالة مؤنث عند البغدادي [@khizana، ج1 ص191]."
  connection: "ثم يصف ليلته بعد الخبر: سهر متكئًا يرقب النجم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "قَدْجَاءَمِنْ / عَلُأَمْ / بَاءُنْ أُنَبْ / بَؤُهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — إِلَيْيَلَا / عَجَبُنْ / مِنْهَاوَلَا / سُخُرُو = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]، وهما هنا مخبونان «فعِلن»، وكذلك في القصيدة كلها. ودخل الخبن «فاعلن» الأولى في الشطرين، و«مستفعلن» الأولى في العجز فصارت «متفعلن»، والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
variants:
  - reading: "إِنِّي أَتَتْنِي لِسَانٌ لَا أُسَرُّ بِهَا / مِنْ عَلُ لَا عَجَبٌ مِنْهَا وَلَا سَخَرُ"
    status: "رواية المُبَرِّد"
    note: "[@kamil، ج4 ص55]. وهي رواية صاحب «الجمهرة» بلفظ «من عُلْوَ» [@jamhara، ص568]، والبغدادي يرويها «من علو» ويقول إن الواو تُروى بالحركات الثلاث [@khizana، ج1 ص191]. وهي أشهر روايات المطلع."
  - reading: "إِنِّي أُتِيتُ بِشَيْءٍ لَا أُسَرُّ بِهِ"
    status: "رواية ثَعْلَب، فيما ينقله البغدادي"
    note: "[@khizana، ج1 ص191]."
