explained: false
first: "لَا تَأْمَنُ البَازِلُ الكَوْمَاءُ ضَرْبَتَهُ"
second: "بِالمَشْرَفِيِّ إِذَا مَا اخْرَوَّطَ السَّفَرُ"
vocabulary:
  - term: "البَازِلُ"
    text: "«البعير الذي فطر نابه بدخوله في السنة التاسعة» [@khizana، ج1 ص198]."
  - term: "الكَوْمَاءُ"
    text: "«الناقة العظيمة السنام» [@khizana، ج1 ص198]."
  - term: "المَشْرَفِيِّ"
    text: "قال المُبَرِّد: «والمشرفي: السيف. وهو منسوب إلى المشارف» [@kamil، ج4 ص59]."
  - term: "اخْرَوَّطَ السَّفَرُ"
    text: "«امتد وطال» [@khizana، ج1 ص198]. يعقر الناقة للقوم إذا طال سفرهم."
