first: "وَرَّادُ حَرْبٍ شِهَابٌ يُسْتَضَاءُ بِهِ"
second: "كَمَا يُضِيءُ سَوَادَ الطَّخْيَةِ القَمَرُ"
vocabulary:
  - term: "وَرَّادُ حَرْبٍ"
    text: "كثير الإقدام على الحرب، كمن يرد الماء."
  - term: "شِهَابٌ"
    text: "شعلة نار."
  - term: "الطَّخْيَةِ"
    text: "قال المُبَرِّد: «والطخية، والطخية، والطخية، ثلاث لغات: شدة الظلمة» [@kamil، ج4 ص60]."
