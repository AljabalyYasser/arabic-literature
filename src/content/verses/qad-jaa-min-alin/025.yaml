first: "كَأَنَّهُ بَعْدَ صِدْقِ القَوْمِ أَنْفُسَهُمْ"
second: "بِاليَأْسِ يَلْمَعُ مِنْ قُدَّامِهِ البُشُرُ"
meaning: "إذا أيقن القوم بالهلاك في الحرب أو الشدة، وحدّثوا أنفسهم باليأس صادقين، رأيته منطلق الوجه واثقًا، كأن أمامه بشراء يلوّحون له بالنصر. يقول البغدادي: «يقول إذا فزع القوم وأيقنوا بالهلاك عند الحروب أو الشدائد فكأنه من ثقته بنفسه قدامه بشير يبشره ... بالظفر والنجاح» [@khizana، ج1 ص198–199]."
vocabulary:
  - term: "صِدْقِ القَوْمِ أَنْفُسَهُمْ بِاليَأْسِ"
    text: "أن يُحدّثوا أنفسهم باليأس صادقين، أي أن يوقنوا بالهلاك."
  - term: "يَلْمَعُ"
    text: "يضيء ويلوح، و«لمع أضاء» [@khizana، ج1 ص198]."
  - term: "البُشُرُ"
    text: "«جمع بشير» [@khizana، ج1 ص198]، وهو الذي يأتي بالخبر السار."
context: "من أبيات الصفات (14–26). وهو البيت الذي يقول فيه المُبَرِّد، فيما ينقله الشريف المرتضى ثم البغدادي: «لا نعلم بيتا في يمن النقيبة وبركة الطلعة أبرع من هذا البيت» [@khizana، ج1 ص199]. واليُمْن: البركة، والنَّقِيبة: النفس والطبيعة، أي الرجل الذي يتفاءل به أصحابه."
syntax:
  - "«كأنّه» حرف تشبيه ونصب، والهاء اسمها."
  - "«بعدَ» ظرف زمان متعلق بـ«يلمع»، و«صدقِ» مضاف إليه، وهو مصدر مضاف إلى فاعله «القوم»، و«أنفسَهم» مفعوله، و«باليأس» متعلق بالمصدر."
  - "«يلمعُ ... البُشُرُ» جملة فعلية في محل رفع خبر «كأنّ»، و«البشر» فاعل مؤخر، و«من قدّامه» متعلق بـ«يلمع»."
morphology:
  - "«البُشُر» جمع «بشير» على «فُعُل»، مثل نذير ونُذُر."
  - "«صِدْق» مصدر «صَدَق»، ويتعدى إلى مفعولين: صدقه الحديثَ، وصدق القومُ أنفسَهم اليأسَ، وقد عدّاه هنا إلى الثاني بالباء."
  - "«قُدّام» ظرف مكان بمعنى أمام."
rhetoric:
  thesis: "صورة الرجل الذي يتفاءل به القوم في ساعة اليأس."
  devices:
    - title: "التمثيل في «كأنه ... يلمع من قدامه البشر»"
      text: "لا يشبّه شيئًا بشيء، بل هيئة بهيئة: رجل ثابت مستبشر بين قوم يائسين، كمن يرى البشراء يقبلون عليه من بعيد. فالشبه لا يُدرك من ظاهر اللفظ، بل يأتي «محصّلاً بضرب من التأوّل» كما يقول عبد القاهر في التمثيل [@asrar، ص90]، ويقول: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "الطباق بين «اليأس» و«البُشُر»"
      text: "يجمع البيت ضدين: يأس القوم وبشرى الرجل، فيظهر كل منهما بالآخر، ويبدو ثباته أعظم لأنه في وسط اليأس."
    - title: "الاستعارة في «يلمع»"
      text: "البشراء لا تلمع، وإنما يلمع النور. فجعل البشارة ضوءًا يلوح أمامه. والاستعارة عند عبد القاهر «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
  connection: "ثم يصفه بالأناة في الفزع: لا يعجل القوم عن طعامهم، ويسري الليل حتى يتسع الصبح."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "كَأَنْنَهُو / بَعْدَصِدْ / قِلْقَوْمِأَنْ / فُسَهُمْ = متفعلن / فاعلن / مستفعلن / فعِلن — بِلْيَأْسِيَلْ / مَعُمِنْ / قُدْدَامِهِلْ / بُشُرُو = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "العروض مخبونة «فعِلن» والضرب مخبون مثلها [@atiq، ص48]. ودخل الخبن «مستفعلن» الأولى في الصدر فصارت «متفعلن»، و«فاعلن» الأولى في العجز فصارت «فعِلن»، والخبن «حذف الثاني الساكن» [@atiq، ص46]."
