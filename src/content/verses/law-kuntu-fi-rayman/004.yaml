explained: false
first: "غَضْبَانُ مُمْتَلِئًا عَلَيَّ إِهَابُهُ"
second: "إِنِّي وَرَبِّكَ سُخْطُهُ يُرْضِينِي"
vocabulary:
  - term: "غَضْبانُ"
    text: "يقول محققا «الأصمعيات»: «بالنصب حال من «اللئيم» أو بالرفع خبر مبتدأ محذوف» [@asmaiyyat، ص126، الحاشية]، أي: هو غضبان."
  - term: "إِهابُهُ"
    text: "«الإهاب: الجلد الذى لم يدبغ، واستعير هنا لجلد الإنسان» [@asmaiyyat، ص126، الحاشية]. فهو ممتلئ غيظًا حتى كاد جلده ينشق."
