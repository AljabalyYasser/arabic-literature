explained: false
first: "يَا رُبَّ نِكْسٍ إِنْ أَتَتْهُ مَنِيَّتِي"
second: "فَرِحٍ وَخِرْقٍ إِنْ هَلَكْتُ حَزِينِ"
vocabulary:
  - term: "نِكْسٍ"
    text: "يقول محققا «الأصمعيات»: «النكس، بكسر النون وسكون الكاف: الرجل الضعيف، أو المقصر عن غاية النجدة والكرم» [@asmaiyyat، ص126، الحاشية]."
  - term: "خِرْقٍ"
    text: "«الخرق، بكسر الخاء: الكريم المتخرق فى الكرم، أو الفتى الظريف فى سماحة ونجدة» [@asmaiyyat، ص126، الحاشية]."
