explained: false
first: "وَلَقَدْ مَرَرْتُ عَلَى اللَّئِيمِ يَسُبُّنِي"
second: "فَمَضَيْتُ ثُمَّتَ قُلْتُ لَا يَعْنِينِي"
vocabulary:
  - term: "ثُمَّتَ"
    text: "يقول محققا «الأصمعيات»: «هى «ثم» العاطفة تزيد العرب التاء فى آخرها، فتختص بعطف الجمل» [@asmaiyyat، ص126، الحاشية]."
  - term: "لا يَعْنِينِي"
    text: "يقول البغدادي: «أَي لَا يهمني أَو بِمَعْنى لَا يقصدني» [@khizana، ج1 ص358]."
