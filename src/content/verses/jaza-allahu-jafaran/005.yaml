first: "وَمِنْ بَعْدِ مَا كُنَّا لِسَلْمَى وَأَهْلِهَا"
second: "قَطِينًا وَمَلَّتْنَا الْبِلَادُ وَمُلَّتِ"
vocabulary:
  - term: "لِسَلْمَى"
    text: "سَلْمى اسم يحتمل امرأة، ويحتمل الجبل الذي يقول فيه ياقوت: «وهو أحد جبلي طيّء، وهما أجأ وسلمى» [@yaqut-buldan، ج3 ص238]. وكانت غَنِيّ، قوم طفيل، تنزل قريبًا منه، ففي خبر يرويه أبو حاتم عن الأَصْمَعِيّ في ديوانه أن غنيًّا كانت «بالرخيمة بين سلمى ورمّان» [@diwan-tufayl، ص123]. فإن كان الجبل فأهله طيّء، والمعنى: بعد أن أقمنا في جوار طيّء. وهذه قراءتنا، ولا يعيّنه مصدر."
  - term: "قَطِينًا"
    text: "مقيمين في جوارهم: «والقَطِينُ: الْمُقِيمُونَ فِي الْمَوْضِعِ لَا يَكَادُونَ يَبْرَحُونه» [@lisan، ج13 ص343]."
  - term: "وَمَلَّتْنَا الْبِلَادُ وَمُلَّتِ"
    text: "سئمتنا البلاد وسئمناها، أي طال بنا التنقل."
