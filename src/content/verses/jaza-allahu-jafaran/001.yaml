explained: false
first: "جَزَى اللَّهُ عَنَّا جَعْفَرًا حِينَ أَزْلَقَتْ"
second: "بِنَا نَعْلُنَا فِي الْوَاطِئِينَ فَزَلَّتِ"
vocabulary:
  - term: "جَعْفَرًا"
    text: "بنو جعفر، القبيلة التي نزل فيها قوم الشاعر فأحسنت إليهم، كما تقول القطعة نفسها."
  - term: "أَزْلَقَتْ بِنَا نَعْلُنَا ... فَزَلَّتِ"
    text: "زلّت بنا قدمنا، أي أصابتنا عثرة وشدة في الدهر. ويرويه ثعلب «حِينَ أَشْرَفَتْ» [@lisan، ج9 ص171]."
  - term: "الْوَاطِئِينَ"
    text: "الذين يطؤون الأرض، أي الناس."
