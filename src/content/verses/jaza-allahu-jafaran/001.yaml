explained: false
first: "جَزَى اللَّهُ عَنَّا جَعْفَرًا حِينَ أَزْلَقَتْ"
second: "بِنَا نَعْلُنَا فِي الْوَاطِئِينَ فَزَلَّتِ"
vocabulary:
  - term: "جَعْفَرًا"
    text: "بنو جعفر بن كِلاب، قوم لَبِيد، القبيلة التي نزل فيها قوم الشاعر فأحسنت إليهم، كما تقول القطعة نفسها."
  - term: "أَزْلَقَتْ بِنَا نَعْلُنَا ... فَزَلَّتِ"
    text: "زلّت بنا قدمنا، أي أصابتنا عثرة وشدة في الدهر. ويرويه أبو الفَرَج «حِينَ أَشْرَفَتْ» [@aghani-dk، ج15 ص368]، وكذلك ينشده ثعلب [@lisan، ج9 ص171]."
  - term: "الْوَاطِئِينَ"
    text: "الذين يطؤون الأرض، أي الناس."
