first: "وَقَالُوا هَلُمَّ الدَّارَ حَتَّى تَبَيَّنُوا"
second: "وَتَنْجَلِيَ الْغَمَّاءُ عَمَّا تَجَلَّتِ"
vocabulary:
  - term: "هَلُمَّ الدَّارَ"
    text: "أقبلوا إلى الدار، أي انزلوا عندنا."
  - term: "تَبَيَّنُوا"
    text: "يتّضح لكم أمركم."
  - term: "الْغَمَّاءُ"
    text: "الشدة والكربة التي تغمّ الناس."
