explained: false
first: "فَذُو الْمَالِ مَوْفُورٌ وَكُلُّ مُعَصَّبٍ"
second: "إِلَى حُجُرَاتٍ أَدْفَأَتْ وَأَظَلَّتِ"
vocabulary:
  - term: "مَوْفُورٌ"
    text: "تامّ لم يُنقص منه شيء."
  - term: "مُعَصَّبٍ"
    text: "الفقير الجائع: «ويقال للرجل الجائع، يشتد عليه سخفة الجوع فيعصب بطنه بحجر: معصب» [@lisan، ج1 ص604]. يعني أن فقيرهم أُوي إلى بيوت دافئة."
  - term: "حُجُرَاتٍ"
    text: "جمع حُجْرة، وهي البيت."
  - term: "أَدْفَأَتْ وَأَظَلَّتِ"
    text: "كانت دفئًا في البرد وظلًّا في الحر."
