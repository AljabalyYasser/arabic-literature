first: "وَالْخَيْلُ سَاهِمَةُ الْوُجُوهِ كَأَنَّمَا"
second: "تُسْقَى فَوَارِسُهَا نَقِيعَ الْحَنْظَلِ"
vocabulary:
- term: "سَاهِمَةُ الْوُجُوهِ"
  text: "«أي متغيرة لما تلقى من الجهد، وتكون الخيل أيضا كناية عن أصحابها» [@diwan-antara، ص252]."
- term: "نَقِيعَ الْحَنْظَلِ"
  text: "ماء الحنظل المرّ: «يريد كأنهم لصعوبة الحرب ومر مذاقها يسقون نقيع الحنظل، والحنظل شجر العلقم» [@diwan-antara، ص253]."
sources:
