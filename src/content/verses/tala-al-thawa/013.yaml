first: "وَإِذَا الْكَتِيبَةُ أَحْجَمَتْ وَتَلَاحَظَتْ"
second: "أُلْفِيتُ خَيْرًا مِنْ مُعَمٍّ مُخْوَلِ"
meaning: "إذا جبنت الكتيبة، ونظر بعض فرسانها إلى بعض ينتظر من يتقدم، وُجدتُ خيرًا من الرجل الكريم الأعمام والأخوال. قال الأَعْلَم: «يقول إذا اشتدت الحروب وانهزم القوم وجدت في ذلك الموطن خيرا من رجل كريم الأعمام والأخوال، أي لا يضرني أني هجين إذا كنت كريم الفعل» [@diwan-antara، ص250]."
vocabulary:
- term: "الْكَتِيبَةُ"
  text: "«الكتيبة العسكر، سميت بذلك لاجتماعها» [@diwan-antara، ص250]."
- term: "أَحْجَمَتْ"
  text: "«ومعنى أحجمت: جبنت» [@diwan-antara، ص250]، وفي الأغاني: «وأحجمت: كعّت» [@aghani-dk، ج8 ص242]."
- term: "تَلَاحَظَتْ"
  text: "«أي نظر بعضهم إلى بعض أيهم يتقدم» [@diwan-antara، ص250]، «وأصل التلاحظ النظر من القوم بعضهم إلى بعض بمؤخر العين» [@aghani-dk، ج8 ص242]."
- term: "مُعَمٍّ مُخْوَلِ"
  text: "«والمعم المخول الكريم الأعمام والأخوال» [@diwan-antara، ص250]. وفي اللسان: «وَالْعَرَبُ تَقُولُ: رَجُلٌ مُعَمٌّ مُخْوَلٌ … إِذَا كَانَ كَرِيمَ الأَعْمام والأَخْوال كثيرَهم» [@lisan، ج12 ص424]."
context: "يروي أبو الفَرَج هذا البيت مع البيت 9 في كلامه على أغربة العرب [@aghani-dk، ج8 ص240]، وكذلك ابن قُتَيْبة [@ibn-qutayba، ج1 ص246] وشوقي ضَيْف [@deif، ج1 ص369]، فالبيتان يسيران معًا: الأول يقول إن نصفه من خير عبس، والثاني يقول إنه في الحرب خير ممن نسبه كله كريم. وهذا اللفظ عند امرئ القَيْس أيضًا في وصف جيد الصاحبة، كما يرويه ابن منظور: «بِجِيدٍ مُعَمّ فِي العَشِيرةِ مُخْوَلِ» [@lisan، ج12 ص424]."
syntax:
- "إِذَا ظرف للمستقبل فيه معنى الشرط، والْكَتِيبَةُ فاعل لفعل محذوف يفسّره أَحْجَمَتْ، أي: إذا أحجمت الكتيبة، لأن إذا يليها الفعل."
- "أُلْفِيتُ جواب إذا، مبني للمجهول من ألفى بمعنى وجد، والتاء نائب فاعل وهي المفعول الأول، وخَيْرًا المفعول الثاني. ويشرحه الأَعْلَم بالفعل وجد: «وجدت في ذلك الموطن خيرا من رجل كريم الأعمام والأخوال» [@diwan-antara، ص250]."
- "مِنْ مُعَمٍّ متعلق بخيرًا، وخير اسم تفضيل حُذفت همزته، ومُخْوَلِ صفة ثانية. فهما صفتان لرجل واحد."
morphology:
- "الكَتِيبة فعيلة من كتب بمعنى جمع: «ويقال: كتبت الشيء إذا جمعت بعضه إلى بعض» [@diwan-antara، ص250]."
- "أَحْجَمَ رباعي لازم بمعنى كفّ وجبن، ويقال فيه أجحم بتقديم الجيم: «ويقال أحجم وأجحم بمعنى واحد» [@diwan-antara، ص250]."
- "تَلَاحَظَ على تفاعَل، وهو بناء المشاركة: نظر كلّ منهم إلى صاحبه."
- "مُعَمّ ومُخْوَل اسما مفعول من أعمّ وأخول، ويقال فيهما بكسر الميم: «قَالَ اللَّيْثُ: وَيُقَالُ فِيهِ مِعَمٌّ مِخْوَلٌ» [@lisan، ج12 ص424]."
rhetoric:
  thesis: "يضع نفسه في مقابل صاحب النسب الكامل في أشد لحظات الحرب، حين يتردد الجميع. فالنسب يُسأل عنه في السلم، والفعل يُرى في الحرب."
  devices:
  - title: "الكناية في «تَلَاحَظَتْ»"
    text: "لم يقل: خافت الكتيبة، بل صوّر الفرسان ينظر بعضهم إلى بعض، كلّ ينتظر غيره أن يتقدم، فدلّ على الخوف بلازمه. وهذا من الكناية التي يذكر فيها الشاعر معنى «هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]، ويشرحه الأَعْلَم: «أي نظر بعضهم إلى بعض أيهم يتقدم» [@diwan-antara، ص250]."
  - title: "التفضيل على «مُعَمٍّ مُخْوَلِ»"
    text: "اختار للمقارنة أكرم الناس نسبًا، كريم الأعمام والأخوال معًا، أي من سلم نسبه من الجهتين، وهو ما ليس لعنترة، ثم جعل نفسه خيرًا منه. والأَعْلَم يصرّح بالمقصود: «أي لا يضرني أني هجين إذا كنت كريم الفعل» [@diwan-antara، ص250]."
  - title: "البناء للمجهول في «أُلْفِيتُ»"
    text: "لم يقل: كنت خيرًا، بل قال: أُلفيت، أي وجدني الناس كذلك، فجعل الحكم لغيره، كما يحتكم في معلقته إلى من شهد الوقيعة."
  connection: "ثم يقول إن الخيل والفرسان يعلمون أنه فرّق جمعهم بطعنة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَإِذَلْ كَتِي / بَةُ أَحْجَمَتْ / وَتَلَاحَظَتْ = متَفاعلن / متَفاعلن / متَفاعلن — أُلْفِيتُ خَيْ / رَنْ مِنْ مُعَمْ / مِنْ مُخْوَلِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، تفعيلات العجز كلها، وسلم الصدر منه."
