first: "طَالَ الثَّوَاءُ عَلَى رُسُومِ الْمَنْزِلِ"
second: "بَيْنَ اللَّكِيكِ وَبَيْنَ ذَاتِ الْحَرْمَلِ"
meaning: "طالت إقامتي على آثار منزل خلا من أهله، بين موضعين هما اللَّكِيك وذات الحَرْمَل. قال الأَعْلَم: «الثواء الإقامة، واللكيك وذات الحرمل موضعان» [@diwan-antara، ص246]."
vocabulary:
- term: "الثَّوَاءُ"
  text: "«الثواء الإقامة» [@diwan-antara، ص246]. وفي لسان العرب: «الثَّواءُ: طولُ المُقام» [@lisan، ج14 ص125]، فالطول في معنى الكلمة نفسها، وزاده الفعل طال."
- term: "رُسُومِ"
  text: "جمع رَسْم، وهو ما بقي من أثر الدار لاصقًا بالأرض: «والرَّسْمُ مَا كَانَ لاصِقاً بالأَرض» [@lisan، ج11 ص406]."
- term: "اللَّكِيكِ وَ ... ذَاتِ الْحَرْمَلِ"
  text: "«موضعان» عند الأَعْلَم [@diwan-antara، ص246]، ويقول محقق الديوان في اللكيك إنه «موضع في حزن بني يربوع» [@diwan-antara، ص246]. والحَرْمَل نبت: «الحَرْمَل حَبٌّ كالسِّمْسم» [@lisan، ج11 ص150]، فذات الحرمل أرض ينبت فيها."
context: "مطلع القصيدة. وهي في أصلها جواب لقيس بن زُهَيْر الذي غضّ من بلاء عَنْتَرَة يوم غزوة تميم [@diwan-antara، ص245–246]، لكن عَنْتَرَة يبدؤها كما تُبدأ القصائد، بالوقوف على الدار، ولا يصل إلى الجواب إلا في البيت التاسع. ولا ينشد أبو الفَرَج هذا المطلع، ويبدأ ما يغنّى من القصيدة بالبيت السابع عشر [@aghani-dk، ج8 ص241]."
syntax:
- "طَالَ فعل ماض، والثَّوَاءُ فاعله، وعَلَى رُسُومِ الْمَنْزِلِ متعلق بالثواء، لأنه مصدر يعمل عمل فعله، أي: طال ثوائي على رسومه. ويوافق هذا شرح الأَعْلَم الثواء بالإقامة [@diwan-antara، ص246]."
- "بَيْنَ اللَّكِيكِ ظرف متعلق بمحذوف صفة للمنزل أو حال منه. ولو قال: بين اللكيك وذات الحرمل لتمّ المعنى، فإعادة بَيْنَ مع الاسم الثاني توكيد يحدد المكان."
- "ذَاتِ الْحَرْمَلِ مضاف ومضاف إليه، وذات بمعنى صاحبة: الموضع الذي فيه الحرمل."
morphology:
- "الثَّوَاء مصدر ثَوَى يَثْوِي، ومنه المَثْوَى أي المنزل: «وثَوَى بِالْمَكَانِ: نَزَلَ فِيهِ، وَبِهِ سُمِّي الْمَنْزِلُ مَثْوىً» [@lisan، ج14 ص125]."
- "رُسُوم جمع رَسْم على فُعُول، والمَنْزِل اسم مكان من نزل على مَفْعِل."
rhetoric:
  thesis: "مطلع تقليدي: طول الوقوف على الدار. لكنه لا يبدأ بنداء الدار ولا بالأمر بالوقوف، بل بالإخبار عن طول الإقامة، فيقدّم الحزن قبل أن يصف الدار."
  devices:
  - title: "الكناية في «طَالَ الثَّوَاءُ»"
    text: "لم يقل إنه حزين، بل قال إنه أطال الإقامة على أثر لا أحد فيه، وطول المقام على أثر خالٍ لا يكون إلا من حزن ووجد. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]. ويفسّر الأَعْلَم البيت التالي بهذا المعنى: «يعني أن الحزن غلب قلبه فجعل يسأل الديار ولم يذهل عن ذلك» [@diwan-antara، ص246]."
  - title: "تسمية الموضعين"
    text: "سمّى موضعين يحدّان المنزل، فصار الطلل مكانًا معروفًا لا صورة عامة، كما سمّى امرؤ القَيْس في مطلع معلقته الدَّخُول وحَوْمَل، والصيغة عند الشاعرين واحدة: بين، ثم موضعان."
  - title: "التصريع"
    text: "اتفق آخر الصدر وآخر العجز في القافية، الْمَنْزِلِ والْحَرْمَلِ، وهذا التصريع، وهو عند ابن رَشِيق «ما كانت عروض البيت فيه تابعة لضربه» [@ibn-rashiq، ج1 ص173]. والعَرُوض آخر تفعيلة في الصدر، والضَّرْب آخر تفعيلة في العجز، والتصريع من عادة المطالع."
  connection: "ثم يصف وقوفه في ساحات الدار يسألها كمن لم يذهل عنها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "طَالَثْ ثَوَا / ءُ عَلَى رُسُو / مِلْ مَنْزِلِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن — بَيْنَلْ لَكِي / كِ وَبَيْنَ ذَا / تِلْ حَرْمَلِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأولى والثالثة من الصدر ومن العجز. والبيت مصرّع."
