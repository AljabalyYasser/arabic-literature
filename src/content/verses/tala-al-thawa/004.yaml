first: "أَفَمِنْ بُكَاءِ حَمَامَةٍ فِي أَيْكَةٍ"
second: "ذَرَفَتْ دُمُوعُكَ فَوْقَ ظَهْرِ الْمِحْمَلِ"
meaning: "أمِن أجل حمامة تنوح في شجر ملتف سالت دموعك على حمالة سيفك؟ قال الأَعْلَم: «يعني أنه سمع حمامة تنوح فبكى فسالت دموعه فوق محمل سيفه» [@diwan-antara، ص247]."
vocabulary:
- term: "بُكَاءِ حَمَامَةٍ"
  text: "صوتها، سمّاه بكاء، وهو عند الأَعْلَم نَوْح: «سمع حمامة تنوح» [@diwan-antara، ص247]."
- term: "أَيْكَةٍ"
  text: "«والأيكة الشجر الملتف» [@diwan-antara، ص247]، وفي اللسان: «الأَيْكةَ: الشَّجَرُ الْكَثِيرُ الْمُلْتَفُّ» [@lisan، ج10 ص394]."
- term: "ذَرَفَتْ"
  text: "«أي قطرت» [@diwan-antara، ص247]. وفي الأغاني: «يقال: ذرفت تذرف ذريفا وذرفا، وهو قطر يكاد يتصل» [@aghani-dk، ج8 ص238]."
- term: "الْمِحْمَلِ"
  text: "«والمحمل حمالة السيف» [@diwan-antara، ص247]، أي السير الذي يُعلّق به. وفي اللسان: «عِلاقة السَّيف وَهُوَ المِحْمَل مِثْلَ المِرْجَل» [@lisan، ج11 ص178]، فهو بكسر الميم، وهو في طبعة الديوان بفتحها."
context: "بعد ثلاثة أبيات في الطلل يلتفت إلى نفسه: دموعه تسيل لصوت حمامة، ثم يشبّهها في البيت التالي بالدرّ المنثور. ويقرأ شوقي ضَيْف البيت في حب عَنْتَرَة لعَبْلة، ويقول: «فالحمام يهيجه كما يهيجه النسيم الذى يهب من صوبها، وكما تهيجه الرسوم والأطلال» [@deif، ج1 ص374]."
syntax:
- "الهمزة للاستفهام، وفيه تعجب وإنكار، والفاء عاطفة على كلام مقدّر، كأنه قال: أهذا ما أبكاك؟ أفمن بكاء حمامة؟ والهمزة تتقدم حرف العطف لأن لها الصدارة."
- "مِنْ بُكَاءِ حَمَامَةٍ جار ومجرور متعلق بالفعل ذَرَفَتْ، قُدّم عليه، ومِن للتعليل: بسبب بكاء حمامة، وبه يشرحه الأَعْلَم: «سمع حمامة تنوح فبكى» [@diwan-antara، ص247]. وفِي أَيْكَةٍ صفة لحمامة."
- "دُمُوعُكَ فاعل ذَرَفَتْ، وفَوْقَ ظَهْرِ الْمِحْمَلِ ظرف متعلق بالفعل، أي «فوق محمل سيفه» [@diwan-antara، ص247]."
morphology:
- "البُكاء مصدر بكى على فُعال، وهو بناء يكثر في الأصوات."
- "الأَيْكَة واحدة الأَيْك: «وَالْجَمْعُ أَيْكٌ» [@lisan، ج10 ص394]."
- "المِحْمَل اسم آلة على مِفْعَل من حمل، وجمعه مَحامِل، وجمع الحِمالة حمائل: «التَّهْذِيبُ: جَمْعُ الحِمَالَة حَمَائِل، وَجَمْعُ المِحْمَل مَحَامِل» [@lisan، ج11 ص178]."
rhetoric:
  thesis: "الفارس يبكي، والدمع يقع على حمالة السيف: يجمع البيت الرقة والسلاح في صورة واحدة. ويسأل نفسه سؤال من يعجب من ضعفه أمام صوت حمامة."
  devices:
  - title: "التقديم في «أَفَمِنْ بُكَاءِ حَمَامَةٍ»"
    text: "قدّم سبب البكاء على الفعل، فوقع الاستفهام على السبب لا على البكاء نفسه: الدموع قد سالت، والعجب من أن يكون سببها صوت حمامة. وهذه قاعدة عبد القاهر الجُرْجانيّ في الاستفهام بالهمزة: ما يلي الهمزة موضع الشك، فإذا قلت «أأنت فعلت؟» فبدأت بالاسم كان الشك في الفاعل، «لأنك لم تَشُكَّ في الفعل أنه كانَ» [@dalail، ص111]."
  - title: "التجريد في «دُمُوعُكَ»"
    text: "يخاطب نفسه بكاف الخطاب كأنه يكلّم غيره، وهو يريد نفسه. والتجريد أن ينتزع المتكلم من نفسه شخصًا يخاطبه، فكأن الفارس يقف خارج نفسه ويعجب من الباكي."
  - title: "الاستعارة في «بُكَاءِ حَمَامَةٍ»"
    text: "جعل صوت الحمامة بكاء، والأَعْلَم يجعله نَوْحًا [@diwan-antara، ص247]: فهي باكية، وهو يبكي لبكائها. وهذا عند عبد القاهر الجُرْجانيّ من الضرب الذي يُجعل فيه «للشّيءِ الشيءَ ليس له» [@dalail، ص67]."
  - title: "الدمع على «ظَهْرِ الْمِحْمَلِ»"
    text: "لم يقل: على صدري أو على ثيابي، بل جعل الدمع يقع على أداة الحرب، فذكّر وهو يبكي بأنه فارس."
  connection: "ثم يشبّه دموعه في البيت التالي بالدرّ أو الجُمان انقطع سلكه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَفَمِنْ بُكَا / ءِ حَمَامَتِنْ / فِي أَيْكَتِنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — ذَرَفَتْ دُمُو / عُكَ فَوْقَ ظَهْ / رِلْ مِحْمَلِي = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأخيرة من الصدر ومن العجز."
variants:
- reading: "دَرَّتْ دُمُوعُكَ فَوْقَ ظَهْرِ الْمِحْمَلِ"
  status: "في لسان العرب"
  note: "أنشده ابن منظور شاهدًا على المِحْمَل، ولم يسمّ قائله: «دَرَّتْ دُموعُك فَوْقَ ظَهْرِ المِحْمَل» [@lisan، ج11 ص178]."
