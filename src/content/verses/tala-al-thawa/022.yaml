first: "وَإِذَا حَمَلْتُ عَلَى الْكَرِيهَةِ لَمْ أَقُلْ"
second: "بَعْدَ الْكَرِيهَةِ لَيْتَنِي لَمْ أَفْعَلِ"
meaning: "إذا حملت نفسي على القتال في الشدة لم أقل بعدها: ليتني لم أفعل. قال الأَعْلَم: «أي إذا حملت نفسي على» مكروه الحروب «لم أندم على ذلك، والمعنى أنه إذا حمل كان على بصيرة» [@diwan-antara، ص253]."
vocabulary:
- term: "حَمَلْتُ"
  text: "هجمت وكررت، ويفسّره الأَعْلَم بقوله: «إذا حملت نفسي على» مكروه الحروب [@diwan-antara، ص253]."
- term: "الْكَرِيهَةِ"
  text: "الحرب وشدتها: «والكَرِيهةُ: النازلةُ والشدَّةُ فِي الحرْبِ» [@lisan، ج13 ص536]."
context: "خاتمة القصيدة. بعد أن ردّ على العاذلة بأن الموت لا بد منه، يختم بأنه لا يندم على إقدامه، ويقول الأَعْلَم: «ولم يكن حمله على جهل» منه وعمى «فيندم بعد حمله» [@diwan-antara، ص253]. ويقول المحقق إن البَطَلْيَوْسِيّ يورد أبيات القصيدة اثنين وعشرين بترتيب آخر [@diwan-antara، ص252]."
syntax:
- "إِذَا ظرف فيه معنى الشرط، وحَمَلْتُ فعل الشرط، وعَلَى الْكَرِيهَةِ متعلق به، ولَمْ أَقُلْ جوابه."
- "بَعْدَ الْكَرِيهَةِ ظرف متعلق بأقل، وجملة لَيْتَنِي لَمْ أَفْعَلِ مقول القول: ليت واسمها الياء، وجملة لم أفعل خبرها، وكُسرت اللام للقافية. وحُذف مفعول أفعل، وهو الحمل نفسه، كما في شرح الأَعْلَم: «فيندم بعد حمله» [@diwan-antara، ص253]."
morphology:
- "الكَرِيهة فعيلة من كَرِه، صفة غلبت حتى صارت اسمًا للشدة في الحرب [@lisan، ج13 ص536]."
- "حَمَلَ يتعدى بعلى في معنى الهجوم، وأَفْعَل مضارع مجزوم بلم، حُرّك بالكسر لأجل القافية."
rhetoric:
  thesis: "خاتمة على الثبات: لا يقدم الفارس ثم يتمنى لو لم يفعل. فالقصيدة التي بدأت بالدمع على الطلل تنتهي بنفس لا تعرف الندم."
  devices:
  - title: "التكرار في «الْكَرِيهَةِ»"
    text: "كرر الكلمة في الشطرين، فجعل الحرب نفسها حدًّا بين ما قبلها وما بعدها: يحمل على الكريهة، ثم لا يندم بعد الكريهة. وانظر مفهوم [التكرار](/concepts/al-takrar/)."
  - title: "حكاية قول النادم"
    text: "وضع على لسانه قول النادم، ليتني لم أفعل، ثم نفاه، فاستحضر الندم ليبرأ منه. وهذا أقوى من أن يقول: لا أندم، وإن كان الأَعْلَم يشرحه بهذا: «لم أندم على ذلك» [@diwan-antara، ص253]."
  - title: "الحذف في «لَمْ أَفْعَلِ»"
    text: "لم يذكر ما فعله، فالمقصود الفعل نفسه لا متعلَّقه. ويقول عبد القاهر الجُرْجانيّ في الحذف: «فإنكَ ترى به تَرْكَ الذِكْر، أَفْصَحَ من الذكْرِ، والصمتَ عن الإفادةِ، أَزْيَدَ للإِفادة» [@dalail، ص146]."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَإِذَا حَمَلْ / تُ عَلَلْ كَرِي / هَةِ لَمْ أَقُلْ = متَفاعلن / متَفاعلن / متَفاعلن — بَعْدَلْ كَرِي / هَةِ لَيْتَنِي / لَمْ أَفْعَلِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأولى والثالثة من العجز، وسلم الصدر منه."
variants:
