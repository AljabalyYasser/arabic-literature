explained: false
first: "نَادَيْتُ عَبْسًا فَاسْتَجَابُوا بِالْقَنَا"
second: "وَبِكُلِّ أَبْيَضَ صَارِمٍ لَمْ يَنْجَلِ"
vocabulary:
- term: "الْقَنَا"
  text: "«القنا الرمح» [@diwan-antara، ص248]."
- term: "أَبْيَضَ صَارِمٍ"
  text: "«والصارم السيف القاطع، والأبيض المصقول» [@diwan-antara، ص248]."
- term: "لَمْ يَنْجَلِ"
  text: "لم يرقّ حدّه من كثرة الشحذ، ويشرحه الأَعْلَم: «لم يشحذ حتى يذهب بحديده» فيجحف به، «وهو من نحول الجسم» [@diwan-antara، ص248]. ويقول المحقق إنها في بعض النسخ «ينحل» [@diwan-antara، ص248]."
sources:
- source: "diwan-antara"
  loc: "ص248"
  url: "https://archive.org/details/3562pdf/page/n253/mode/1up"
status: "review"
