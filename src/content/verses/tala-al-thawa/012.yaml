first: "وَلَقَدْ أَبِيتُ عَلَى الطَّوَى وَأَظَلُّهُ"
second: "حَتَّى أَنَالَ بِهِ كَرِيمَ الْمَأْكَلِ"
meaning: "إني لأبيت الليل جائعًا، وأظل النهار جائعًا، حتى أنال بصبري على الجوع طعامًا كريمًا لا عيب فيه. قال الأَعْلَم: «أي أظل على الجوع نهارا، أي لا آكل شيئا، وإن طويت يوما وليلة وأكثر من ذلك، حتى أنال من الطعام أطيبه وأكرمه» [@diwan-antara، ص249]. وقال الأَصْمَعِيّ: «أبيت بالليل على الطوى وأظل بالنهار كذلك حتى أنال به كريم المأكل أي ما لا عيب فيه علي» [@aghani-dk، ج8 ص242]."
vocabulary:
- term: "الطَّوَى"
  text: "«والطوى الجوع وهو مصدر طوى إذا خمص بطنه من قلة الأكل» [@diwan-antara، ص249]. وفي اللسان: «والطَّوَى: الجُوعُ» [@lisan، ج15 ص20]."
- term: "أَظَلُّهُ"
  text: "أظل عليه، أي على الجوع: «أي أظل على الجوع نهارا» [@diwan-antara، ص249]."
- term: "كَرِيمَ الْمَأْكَلِ"
  text: "الطعام الذي لا يُعاب آكله: «أي ما لا عيب فيه علي» [@aghani-dk، ج8 ص242]."
context: "يقول الأَعْلَم: «يقول هذا تعريضا بقيس بن زهير وكان أكولا» [@diwan-antara، ص249]، وهو قيس الذي قال يوم غزوة تميم: «والله ما حمى الناس إلا ابن السوداء» [@diwan-antara، ص246]. فالبيت يقلب معيار قيس: عيّره قيس بأمه، فعيّره عَنْتَرَة ببطنه. ويُروى أن عمر بن الخطاب كان «إذا سمع هذا البيت يقول: ذاك رسول الله» [@diwan-antara، ص249]، ويُروى أن النبي ﷺ أُنشده فقال: «ما وصف لي أعرابي قط فأحببت أن أراه إلا عنترة» [@aghani-dk، ج8 ص243]، والخبران منسوبان، وبيانهما في مدخل القصيدة. ويستشهد الميداني بالبيت، بلا نسبة، على [المثل](/concepts/al-mathal/) «سوء حمل الفاقة يضع الشرف» [@maydani، ج1 ص337]."
syntax:
- "اللام في «وَلَقَدْ» واقعة في جواب قسم مقدّر، وقد للتحقيق، أي: والله إني لأبيت. وأَبِيتُ مضارع بات، وعَلَى الطَّوَى متعلق به. والبيت عند الميداني بهذا اللفظ: «ولقد أبِيتُ عَلَى الطّوَى وَأظَلّهُ» [@maydani، ج1 ص337]."
- "في أَظَلُّهُ حذف: الأصل أظلّ عليه، فحذف الجار ووصل الفعل إلى الضمير، قال الميداني: «أراد أبيتُ على الطوى وأظل عليه، فحذف حرف الجر وأصل الفعل» [@maydani، ج1 ص337]. ومثله ما يرويه أبو الفَرَج من قولهم: «إنه ليأتي علي اليومان لا أذوقهما طعاما ولا شرابا أي لا أذوق فيهما» [@aghani-dk، ج8 ص243]."
- "حَتَّى أَنَالَ: حتى للغاية، والفعل بعدها منصوب بأن مضمرة. والباء في بِهِ بمعنى مع عند الميداني: «والباء في به بمعنى مع، أي حتى أنال مع الجوع المأكل الكريم» [@maydani، ج1 ص337]."
morphology:
- "الطَّوَى مصدر طَوِيَ يَطْوَى إذا جاع، أما من تعمّد الجوع فيقال فيه طَوَى يَطْوِي: «وَقَدْ طَوِيَ يَطْوَى، بِالْكَسْرِ، طَوًى وطِوًى؛ عَنْ سِيبَوَيْهِ: خَمُصَ مِنَ الجوعِ، فَإِذَا تَعَمَّدَ ذلك قيل طَوَى يَطْوِي، بِالْفَتْحِ، طَيّاً» [@lisan، ج15 ص20]. فاختار عَنْتَرَة لفظ الجوع الذي يصيب الإنسان، وهو يصف جوعًا يختاره."
- "المَأْكَل مَفْعَل من أكل، يكون مصدرًا ويكون ما يؤكل، وهو هنا الطعام نفسه."
- "أَظَلّ مضارع ظَلّ، وهو للنهار كما أن بات لليل، فجمع البيت الليل والنهار في فعلين."
rhetoric:
  thesis: "فخر بالصبر على الجوع، وهو في الوقت نفسه هجاء خفي لرجل أكول. فالكرامة عنده أن يجوع ولا يأكل ما يُعاب."
  devices:
  - title: "التعريض"
    text: "لم يذكر قيسًا، بل وصف نفسه بضد صفته، فيفهم المقصودَ من يعرف الخبر. والأَعْلَم يسمّيه بهذا الاسم: «يقول هذا تعريضا بقيس بن زهير وكان أكولا» [@diwan-antara، ص249]. وعبد القاهر الجُرْجانيّ ينقل إجماع الناس على أن «التعريض أوقع من التصريح» [@dalail، ص70]."
  - title: "المقابلة بين «أَبِيتُ» و«أَظَلُّهُ»"
    text: "بات لليل وظلّ للنهار، فالجوع يستغرق اليوم كله، وهذا ما يصرّح به الأَصْمَعِيّ: «أبيت بالليل على الطوى وأظل بالنهار كذلك» [@aghani-dk، ج8 ص242]."
  - title: "الوصف في «كَرِيمَ الْمَأْكَلِ»"
    text: "وصف الطعام بالكرم، والكرم صفة الآكل. فالطعام الكريم ما لا يُذلّ صاحبه، كما يقول الأَصْمَعِيّ: «ما لا عيب فيه علي» [@aghani-dk، ج8 ص242]. فالعيب في الطعام عيب في طريقة نيله لا في طعمه."
  connection: "ثم يعود إلى الحرب: إذا أحجمت الكتيبة كان خيرًا من كريم الأعمام والأخوال."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَلَقَدْ أَبِي / تُ عَلَطْ طَوَى / وَأَظَلْ لُهُو = متَفاعلن / متَفاعلن / متَفاعلن — حَتْتَى أَنَا / لَ بِهِي كَرِي / مَلْ مَأْكَلِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأولى والثالثة من العجز. وأُشبعت ضمة الهاء في وَأَظَلُّهُ فصارت لُهُو، وكسرة الهاء في بِهِ فصارت بِهِي."
variants:
- reading: "وَلَقَدْ أَبِيتُ عَلَى الطَّوَى وَأَظَلُّهُ"
  status: "في جمهرة أشعار العرب، داخل المعلقة"
  note: "يضع جامع الجمهرة هذا البيت في معلقة عَنْتَرَة [@jamhara، ص361]، ولا يرويه فيها أحد من شرّاح المعلقة."
