explained: false
first: "وَالْخَيْلُ تَعْلَمُ وَالْفَوَارِسُ أَنَّنِي"
second: "فَرَّقْتُ جَمْعَهُمُ بِطَعْنَةِ فَيْصَلِ"
vocabulary:
- term: "الْخَيْلُ"
  text: "أصحاب الخيل: «والخيل تعلم بمعنى أصحاب الخيل» [@diwan-antara، ص250]."
- term: "فَرَّقْتُ جَمْعَهُمُ"
  text: "«أي طعنت رئيس الكتيبة طعنة فتفرق جمعهم لذلك» [@diwan-antara، ص250]."
- term: "فَيْصَلِ"
  text: "«بطعنة فيصل أي بطعنة رجل فصل بين القوم، أي فرقهم وفصل بينهم» [@diwan-antara، ص250]."
