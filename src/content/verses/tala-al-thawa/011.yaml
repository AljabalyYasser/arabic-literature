first: "حِينَ النُّزُولُ يَكُونُ غَايَةَ مِثْلِنَا"
second: "وَيَفِرُّ كُلُّ مُضَلَّلٍ مُسْتَوْهِلِ"
vocabulary:
- term: "غَايَةَ مِثْلِنَا"
  text: "«يقول: أنزل حيث يكون غاية لنا، ومنتهى لمثلنا من أهل الشدة والإقدام» [@diwan-antara، ص249]."
- term: "مُضَلَّلٍ مُسْتَوْهِلِ"
  text: "الجبان الحائر الفزِع: «والمضلل المحير. والمستوهل الواهل والفازع والوهل الفزع» [@diwan-antara، ص249]."
