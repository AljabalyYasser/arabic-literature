explained: false
first: "إِنْ يُلْحَقُوا أَكْرُرْ وَإِنْ يُسْتَلْحَمُوا"
second: "أَشْدُدْ وَإِنْ يُلْفَوْا بِضَنْكٍ أَنْزِلِ"
vocabulary:
- term: "إِنْ يُلْحَقُوا أَكْرُرْ"
  text: "«يقول: إن لحقهم العدو وكررت وراءهم فخلصتهم» [@diwan-antara، ص249]."
- term: "يُسْتَلْحَمُوا"
  text: "«يدركوا ويحاط بهم» [@diwan-antara، ص249]."
- term: "أَشْدُدْ"
  text: "«أي أحمل عليهم. يقال: شد على قرنه إذا حمل عليه» [@diwan-antara، ص249]."
- term: "بِضَنْكٍ أَنْزِلِ"
  text: "«والضنك الضيق في الحرب. وقوله: أنزل أي إذا التحمت الخيل، وضاق الموضع عنها، نزلت عن فرسي وقاتلت» [@diwan-antara، ص249]."
sources:
