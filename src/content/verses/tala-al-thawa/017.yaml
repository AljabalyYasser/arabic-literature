first: "بَكَرَتْ تُخَوِّفُنِي الْحُتُوفَ كَأَنَّنِي"
second: "أَصْبَحْتُ عَنْ غَرَضِ الْحُتُوفِ بِمَعْزِلِ"
meaning: "جاءتني عاذلتي باكرًا تخوّفني الموت، كأنني صرت بمعزل عن مرمى المنايا لا تصيبني. قال الأَعْلَم: «بكرت يعني عاذلته، عجلت عليه بلومه على اقتحامه للحروب وتعرضه للحتوف»، «وقوله: بمعزل أي بناحية لا تدركني فيها المنايا. يقول: لا بد من الموت فلم أخوف به» [@diwan-antara، ص251]."
vocabulary:
- term: "بَكَرَتْ"
  text: "جاءت باكرًا، والفاعل عاذلته وإن لم يسمّها: «بكرت يعني عاذلته» [@diwan-antara، ص251]."
- term: "الْحُتُوفَ"
  text: "المنايا: «الحَتْفُ: الْمَوْتُ، وَجَمْعُهُ حُتُوفٌ» [@lisan، ج9 ص38]، وفي الأغاني: «ما عرض الإنسان من المكاره والمتالف» [@aghani-dk، ج8 ص242]."
- term: "غَرَضِ"
  text: "الهدف يُرمى: «والغَرَضُ: هُوَ الهدَفُ الَّذِي يُنْصَبُ فَيُرْمَى فِيهِ» [@lisan، ج7 ص196]."
- term: "بِمَعْزِلِ"
  text: "«بناحية لا تدركني فيها المنايا» [@diwan-antara، ص251]."
context: "من هنا يبدأ المقطع الذي يقول فيه ابن قُتَيْبة: «ومن حسن شعره قوله»، ثم ينشد الأبيات 17–20 [@ibn-qutayba، ج1 ص246–247]. وبهذا البيت يبدأ صوت أبي الفَرَج، أي الأبيات التي يذكر أنها تُغنّى [@aghani-dk، ج8 ص241]. وينشد الجاحِظ (ت 255هـ) الأبيات 17–20 في أقوال الناس في الموت [@bayan، ج3 ص126]، وينشد ابن عبد ربه (ت 328هـ) الأبيات 17–19 ويقول: «ونظير هذا مما يشجّع الجبان قول عنترة الفوارس» [@iqd، ج1 ص97]."
syntax:
- "فاعل بَكَرَتْ ضمير يعود على العاذلة، ولم يتقدم لها ذكر، لأن العاذلة معروفة في الشعر، وبها يشرحه الأَعْلَم [@diwan-antara، ص251]."
- "جملة «تُخَوِّفُنِي الْحُتُوفَ» في موضع الحال، وخوّف يتعدى إلى مفعولين: الياء، و«الْحُتُوفَ». وهي في شرح شوقي ضَيْف «المتالف» [@deif، ج1 ص370]."
- "كَأَنَّنِي: كأنّ واسمها الياء، وخبرها جملة أَصْبَحْتُ. وبِمَعْزِلِ خبر أصبح، وعَنْ غَرَضِ الْحُتُوفِ متعلق بمعزل. والمعنى أن العاذلة تخوّفه «مما قد يلقاه من المكاره والمتالف» كما يقول شوقي ضَيْف [@deif، ج1 ص370]."
morphology:
- "الحُتُوف جمع حَتْف على فُعُول، والحتف الموت، «وَلَا يُبْنى مِنْهُ فِعْل» [@lisan، ج9 ص38]."
- "تُخَوِّف مضارع خوّف على فعّل، والتضعيف للتعدية: خاف الشيءَ، وخوّفه غيرُه إياه."
- "مَعْزِل اسم مكان من عزل: الناحية المنفردة."
rhetoric:
  thesis: "يبدأ حوار العاذلة، وهو من عادات الشعر: امرأة تلوم الفارس على تعرّضه للموت. لكن عَنْتَرَة يجعل خوفها عليه ظنًّا مضحكًا: كأنه وحده بمنجاة من الموت."
  devices:
  - title: "الاستعارة في «غَرَضِ الْحُتُوفِ»"
    text: "جعل للحتوف غرضًا، أي هدفًا ترميه، فصارت المنايا رماة والناس أهدافًا. وهذا عند عبد القاهر الجُرْجانيّ من الضرب الذي تجعل فيه «للشّيءِ الشيءَ ليس له» [@dalail، ص67]، كما جعل لبيد للشمال يدًا."
  - title: "التهكم في «كَأَنَّنِي»"
    text: "يحكي ظن العاذلة بصيغة التشبيه: كأنه وحده خارج مرمى المنايا. فالتشبيه هنا لا يقرّب صورة، بل يُظهر بطلان ظنها، وجوابه في البيت التالي أن الموت لا بد منه."
  - title: "العاذلة"
    text: "لم يسمّها، والأَعْلَم يعيّنها: «يعني عاذلته» [@diwan-antara، ص251]، ويقرؤها شوقي ضَيْف صاحبته: «فهو لا يستمع إلى تخويف صاحبته له» [@deif، ج1 ص370]. والعاذلة في الشعر صوت الحذر الذي يردّ عليه الشاعر، فيصير اللوم مناسبة للفخر."
  connection: "ثم يجيبها: الموت منهل لا بد أن يُسقى منه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "بَكَرَتْ تُخَوْ / وِفُنِلْ حُتُو / فَ كَأَنْنَنِي = متَفاعلن / متَفاعلن / متَفاعلن — أَصْبَحْتُ عَنْ / غَرَضِلْ حُتُو / فِ بِمَعْزِلِي = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من العجز، وسلم الصدر منه."
variants:
- reading: "أَصْبَحْتُ عَنْ عَرَضِ الْحُتُوفِ بِمَعْزِلِ"
  status: "رواية الأغاني"
  note: "ويفسّرها أبو الفَرَج: «عن عرض أي ما يعرض منها» [@aghani-dk، ج8 ص242]. ويقول محقق الديوان إن الكلمة في إحدى نسخ الأَعْلَم بلا إعجام، وفي أخرى بالوجهين [@diwan-antara، ص251]، وشرح الأَعْلَم نفسه يفسّر العَرَض: «والعرض ما عرض له من أمر فيه متعبة من غير أن يطلبه» [@diwan-antara، ص251]."
