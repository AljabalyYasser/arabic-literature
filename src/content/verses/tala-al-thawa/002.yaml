explained: false
first: "فَوَقَفْتُ فِي عَرَصَاتِهَا مُتَحَيِّرًا"
second: "أَسَلُ الدِّيَارَ كَفِعْلِ مَنْ لَمْ يَذْهَلِ"
vocabulary:
- term: "عَرَصَاتِهَا"
  text: "ساحاتها، «أي في عرصات الرسوم، ويجوز أن يريد عرصات الديار» [@diwan-antara، ص246]."
- term: "مُتَحَيِّرًا"
  text: "«أي قد غلب علي الحزن وحيرني» [@diwan-antara، ص246]."
- term: "أَسَلُ"
  text: "أسأل، خُففت همزته: «وسَأَلْتُ أَسْأَلُ وسَلْتُ أَسَلُ» [@lisan، ج11 ص318]."
- term: "لَمْ يَذْهَلِ"
  text: "«ومعنى يذهل يسلو عما هو فيه ويتركه» [@diwan-antara، ص246]."
