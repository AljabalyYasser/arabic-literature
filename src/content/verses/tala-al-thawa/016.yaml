explained: false
first: "وَلَقَدْ غَدَوْتُ أَمَامَ رَايَةِ غَالِبٍ"
second: "يَوْمَ الْهِيَاجِ وَمَا غَدَوْتُ بِأَعْزَلِ"
vocabulary:
- term: "غَالِبٍ"
  text: "لعله غالب بن قُطَيْعة بن عَبْس، وهو من أجداد عَنْتَرَة في أحد أنسابه عند أبي الفَرَج: «مالك ابن غالب بن قطيعة بن عبس» [@aghani-dk، ج8 ص237]."
- term: "الْهِيَاجِ"
  text: "«الهياج شدة الحرب» [@diwan-antara، ص251]."
- term: "بِأَعْزَلِ"
  text: "«والأعزل الذي لا سلاح معه» [@diwan-antara، ص251]."
