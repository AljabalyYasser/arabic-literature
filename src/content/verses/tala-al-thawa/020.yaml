first: "إِنَّ الْمَنِيَّةَ لَوْ تُمَثَّلُ مُثِّلَتْ"
second: "مِثْلِي إِذَا نَزَلُوا بِضَنْكِ الْمَنْزِلِ"
meaning: "لو صُوّر الموت في مثال لكان على صورتي، حين ينزل الفرسان في المكان الضيق للقتال. قال الأَعْلَم: «يقول: لو مثلت المنية صورة لمثلت في صورتي لشدتي وكراهتي إلى أعدائي» [@diwan-antara، ص252]."
vocabulary:
- term: "تُمَثَّلُ مُثِّلَتْ"
  text: "تُصوَّر، صُوِّرت: «ومَثَّلَ الشَّيْءَ بِالشَّيْءِ: سوَّاه وشبَّهه بِهِ وَجَعَلَهُ مِثْلَه وَعَلَى مِثالِه» [@lisan، ج11 ص613]."
- term: "نَزَلُوا"
  text: "نزل الفرسان عن خيلهم للقتال حين يضيق المكان، كما قال في البيت العاشر: «وَإِنْ يُلْفَوْا بِضَنْكٍ أَنْزِلِ» [@diwan-antara، ص248]."
- term: "بِضَنْكِ الْمَنْزِلِ"
  text: "«الضنك الضيق إذا نزلوا بالأمر الشديد» [@diwan-antara، ص252]، وفي اللسان: «الضَّنْكُ: الضِّيقُ مِنْ كُلِّ شَيْءٍ» [@lisan، ج10 ص462]."
context: "آخر الأبيات الأربعة التي يقول فيها ابن قُتَيْبة «ومن حسن شعره»، ثم يقابلها بقول عنترة «وأنا المنيّة فى المواطن كلّها» ويقول فيه: «ومن إفراطه» [@ibn-qutayba، ج1 ص246–247]. ويورد الجاحِظ البيتين متجاورين، «وأنا المنية» ثم هذا البيت، في كلامه على ما في صفة الحرب من «إسراف من أسرف، واقتصاد من اقتصد» [@hayawan، ج6 ص540–541]. ويقرؤه شوقي ضَيْف تضخّمًا لإحساس عَنْتَرَة ببطولته: «فإذا هو يتصور أن المنية لو خلقت فى مثال لكانت فى مثل صورته» [@deif، ج1 ص370]."
syntax:
- "إِنَّ الْمَنِيَّةَ: إنّ واسمها، وخبرها الجملة الشرطية «لَوْ تُمَثَّلُ مُثِّلَتْ». ولو حرف امتناع لامتناع، دخل على المضارع تُمَثَّلُ بمعنى الماضي، وجوابه مُثِّلَتْ بلا لام. والبيت كذلك في رواية ابن قُتَيْبة: «إنّ المنيّة لو تمثّل مثّلت» [@ibn-qutayba، ج1 ص247]."
- "مِثْلِي منصوب على الحال من نائب الفاعل في مُثِّلَتْ: صُوّرت مشبهة لي. وإِذَا نَزَلُوا ظرف متعلق بمثّلت، والضمير في نَزَلُوا للفرسان، ولم يتقدم لهم ذكر في هذه الأبيات. وفي شرح شوقي ضَيْف: «لكانت فى مثل صورته» [@deif، ج1 ص370]."
morphology:
- "تُمَثَّل ومُثِّلَتْ من مَثَّل على فعّل، مبنيان للمجهول، ومِثْل من الجذر نفسه. والتِّمثال الصورة: «والتِّمْثَالُ: الصُّورةُ» [@lisan، ج11 ص613]."
- "الضَّنْك مصدر يوصف به، فيقال مكان ضنك ومعيشة ضنك، «الذَّكَرُ والأُنثى فِيهِ سَوَاءٌ» [@lisan، ج10 ص462]."
- "المَنْزِل هنا مصدر ميمي بمعنى النزول، أو اسم مكان: موضع النزول للقتال."
rhetoric:
  thesis: "أبعد ما يذهب إليه الفخر في القصيدة: لا يشبّه نفسه بالموت، بل يجعل الموت هو الذي يشبهه. ثم يحفظ البيت من الإفراط بحرف لو."
  devices:
  - title: "قلب التشبيه"
    text: "المعتاد أن يُشبَّه الفارس بالموت، فقلب عَنْتَرَة الطرفين: جعل نفسه الأصل والموت فرعًا يُصوَّر على مثاله. وهذا ما يصفه عبد القاهر الجُرْجانيّ في قول محمد بن وهيب «وبدا الصباح كأن غرته وجه الخليفة»: يقصد الشاعر «أنْ يُوهِم في الشيء هو قاصرٌ عن نظيره في الصفة أنه زائد عليه في استحقاقها، واستيجابِ أن يُجعَل أصلاً فيها»، ويقول إن «جِهَتُه الساحرة أنه يُوقع المبالغةَ في نفسك من حيث لا تشعر» [@asrar، ص223]."
  - title: "«لَوْ» وحدّ الغلو"
    text: "لم يقل: أنا المنية، بل قال: لو صُوّرت المنية لكانت مثلي، فالشرط يجعل الدعوى افتراضًا لا خبرًا. وينقل ابن رَشِيق عن قُدامة أن «مخارج الغلو عنده على تكاد» [@ibn-rashiq، ج2 ص61]، أي إن الغلو يحسن إذا جاء بما يقرّبه من الممكن. ولعل هذا ما يفرق بين البيت وقول عَنْتَرَة «وأنا المنيّة فى المواطن كلّها» الذي يعدّه ابن قُتَيْبة «من إفراطه» [@ibn-qutayba، ج1 ص247]."
  - title: "الجناس في «تُمَثَّلُ مُثِّلَتْ مِثْلِي»"
    text: "ثلاث كلمات من جذر واحد في بيت واحد. ويسمّي ابن رَشِيق ما اتفقت حروفه التجنيس المحقق، «رجع إلى الاشتقاق أو لم يرجع»، ويقول في بيت لأبي تمام: «فأحكم المجانسة بالاشتقاق»، ثم: «فجنس بثلاث لفظات» [@ibn-rashiq، ج1 ص323–324]."
  - title: "المِثال والمَثَل"
    text: "تدور الكلمات الثلاث على معنى المِثال والصورة، ومن هذا الجذر نفسه المَثَل الذي يُضرب: «والمَثَلُ: الشَّيْءُ الَّذِي يُضرَب لِشَيْءٍ مِثْلًا فَيَجْعَلُ مِثْلَه» [@lisan، ج11 ص611]. فالمثل قول يُجعل شبيهًا لحال جديدة، والمنية هنا تُجعل شبيهة بعنترة. وانظر مفهوم [المثل](/concepts/al-mathal/)."
  connection: "ثم يصف الخيل متغيرة الوجوه كأن فرسانها يُسقون الحنظل."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "إِنْنَلْ مَنِيْ / يَةَ لَوْ تُمَثْ / ثَلُ مُثْثِلَتْ = مُتْفاعلن / متَفاعلن / متَفاعلن — مِثْلِي إِذَا / نَزَلُوا بِضَنْ / كِلْ مَنْزِلِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر، والأولى والثالثة من العجز."
