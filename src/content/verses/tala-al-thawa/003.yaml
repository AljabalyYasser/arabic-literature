explained: false
first: "لَعِبَتْ بِهَا الْأَنْوَاءُ بَعْدَ أَنِيسِهَا"
second: "وَالرَّامِسَاتُ وَكُلُّ جَوْنٍ مُسْبِلِ"
vocabulary:
- term: "الْأَنْوَاءُ"
  text: "الأمطار، «الأنواء جمع نوء، أي نزلت بالديار أمطارها» فمحت رسومها [@diwan-antara، ص247]."
- term: "أَنِيسِهَا"
  text: "«وأنيسها من أقام بها وسكنها» [@diwan-antara، ص247]."
- term: "الرَّامِسَاتُ"
  text: "«والرامسات الرياح»، سُمّيت بذلك لأنها تدفن الأثر «وتثير عليه الغبار» [@diwan-antara، ص247]."
- term: "جَوْنٍ مُسْبِلِ"
  text: "«والجون الأسود من السحاب، والمسبل المنسكب بالمطر» [@diwan-antara، ص247]."
sources:
- source: "diwan-antara"
  loc: "ص247"
