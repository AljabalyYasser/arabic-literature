first: "فَأَجَبْتُهَا إِنَّ الْمَنِيَّةَ مَنْهَلٌ"
second: "لَا بُدَّ أَنْ أُسْقَى بِكَأْسِ الْمَنْهَلِ"
meaning: "فأجبتها: الموت ماء يرده كل حي، ولا بد أن أشرب بكأسه. قال الأَعْلَم: «المنهل الماء المورود. يقول: الموت كالمنهل المورود الذي لا غنى عن وروده، وكذلك الموت لا بد منه» [@diwan-antara، ص252]."
vocabulary:
- term: "الْمَنِيَّةَ"
  text: "الموت: «والمَنى والمَنِيَّةُ: الْمَوْتُ لأَنه قُدِّر عَلَيْنَا» [@lisan، ج15 ص292]."
- term: "مَنْهَلٌ"
  text: "«المنهل الماء المورود» [@diwan-antara، ص252]، «والمَنْهَل: المشرَب ثُمَّ كَثُرَ ذَلِكَ حَتَّى سُمِّيَتْ مَنازل السُّفَّار عَلَى المِياه مَناهِل» [@lisan، ج11 ص681]."
context: "جواب العاذلة، وأشهر بيت في المقطع. ويستشهد به أبو هلال العَسْكَرِيّ (ت 395هـ) في باب رد الأعجاز على الصدور [@sinaatayn، ص385]، ويرويه ابن منظور لعنترة مع البيت التالي شاهدًا على قولهم «فاقني حياءك» [@lisan، ج15 ص201]."
syntax:
- "الفاء في فَأَجَبْتُهَا عاطفة، والهاء للعاذلة. وجملة إِنَّ الْمَنِيَّةَ مَنْهَلٌ مقول لقول دلّ عليه أجبتها، ولذلك كُسرت همزة إنّ كما تُكسر بعد القول. وفي رواية الأغاني «أَنَّ» بالفتح [@aghani-dk، ج8 ص241]، فتكون مع ما بعدها مصدرًا: أجبتها بأن المنية منهل."
- "لَا بُدَّ: لا النافية للجنس، وبُدَّ اسمها مبني على الفتح، والخبر محذوف، والمصدر المؤول من «أَنْ أُسْقَى» مجرور بحرف محذوف: لا بد من أن أُسقى. وهو في رواية اللسان: «لَا بُدَّ أَن أُسْقَى بِذاكَ المَنْهَلِ» [@lisan، ج15 ص201]."
morphology:
- "المَنِيّة فعيلة بمعنى مفعولة من مَنَى أي قدّر، فهي المقدّرة: «لأَنه قُدِّر عَلَيْنَا» [@lisan، ج15 ص292]."
- "المَنْهَل مَفْعَل من نَهِل، وهو الشرب الأول، فهو موضع الشرب: «المَنْهَل الْمَوْضِعُ الَّذِي فِيهِ المشرَب» [@lisan، ج11 ص681]."
- "أُسْقَى مضارع مبني للمجهول من سقى: غيري يسقيني، فلا اختيار له في الشرب."
rhetoric:
  thesis: "يجعل الموت شيئًا مألوفًا: ماءً يرده كل الناس. فلا معنى للتخويف منه، والسؤال الوحيد متى يرده، لا هل يرده."
  devices:
  - title: "التشبيه البليغ في «إِنَّ الْمَنِيَّةَ مَنْهَلٌ»"
    text: "حذف أداة التشبيه ووجه الشبه، فجعل المنية منهلًا. والأَعْلَم يردّ الأداة في شرحه: «الموت كالمنهل المورود الذي لا غنى عن وروده» [@diwan-antara، ص252]. والشبه ليس في صورة تُرى، بل في حكم: أن كل حي وارده. وهذا عند عبد القاهر الجُرْجانيّ الضرب الثاني من الشبه: «والآخر أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]."
  - title: "ترشيح الصورة في «بِكَأْسِ الْمَنْهَلِ»"
    text: "لم يكتف بأن الموت منهل، بل جعل له كأسًا يُسقى بها، فأتمّ الصورة بما يلائم المشبه به."
  - title: "ردّ العجز على الصدر"
    text: "ختم الصدر بكلمة منهل، وختم العجز بها، فعادت كلمة آخر الصدر في آخر البيت. ويجعله أبو هلال العَسْكَرِيّ مثالًا لأول أقسام ردّ الأعجاز على الصدور: «ما يوافق آخر كلمة فى البيت آخر كلمة فى النصف الأول» [@sinaatayn، ص385]."
  connection: "ثم يأمرها أن تلزم حياءها، فهو ميت قُتل أو لم يُقتل."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَأَجَبْتُهَا / إِنْنَلْ مَنِيْ / يَةَ مَنْهَلُنْ = متَفاعلن / مُتْفاعلن / متَفاعلن — لَا بُدْدَ أَنْ / أُسْقَى بِكَأْ / سِلْ مَنْهَلِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر، وتفعيلات العجز كلها."
