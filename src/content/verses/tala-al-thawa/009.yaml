first: "إِنِّي امْرُؤٌ مِنْ خَيْرِ عَبْسٍ مَنْصِبًا"
second: "شَطْرِي وَأَحْمِي سَائِرِي بِالْمُنْصُلِ"
meaning: "أنا رجل نصفه من أشرف عَبْس أصلًا، وهو نسب أبيه، وأحمي نصفه الآخر، وهو نسب أمه، بالسيف. قال الأَعْلَم: «يقول: شطري شريف من قبل أبي، فإذا حاربت حميت شطري الآخر من قبل أمي، حتى يصير له من الشرف مثل ما صار للشطر الأول» [@diwan-antara، ص248]."
vocabulary:
- term: "مَنْصِبًا"
  text: "«المنصب: الحسب والأصل» [@diwan-antara، ص248]."
- term: "شَطْرِي"
  text: "نصفي. قال ابن قُتَيْبة: «يقول: النصف من نسبى فى خير عبس» [@ibn-qutayba، ج1 ص246]."
- term: "سَائِرِي"
  text: "بقيتي، أي نصفي الآخر: «وسائر الشيء بقيته» [@diwan-antara، ص248]."
- term: "الْمُنْصُلِ"
  text: "«والمنصل السيف» [@diwan-antara، ص248]، «ويقال مُنْصَل أيضا بفتح الصاد» [@aghani-dk، ج8 ص242]."
context: "هنا يبدأ الجواب على قيس بن زُهَيْر بعد الطلل والدمع ويوم النداء. ويضع أبو الفَرَج هذا البيت والبيت 13 بعد كلام ابن الكَلْبيّ في أغربة العرب، ويقول: «وفي ذلك يقول عنترة»، أي في سواده من قبل أمه، ثم يقول: «وأحسب أن هذه القصيدة هي التي يضاف إليها البيتان اللذان يغنّى فيهما، وهذه الأبيات قالها في حرب داحس والغبراء» [@aghani-dk، ج8 ص240]. ويرويه ابن قُتَيْبة مع البيت 13 [@ibn-qutayba، ج1 ص246]، ويرى شوقي ضَيْف أن عَنْتَرَة «ظل يذكر هذا الجرح الذى أصابه فى الصميم» [@deif، ج1 ص369]."
syntax:
- "إِنِّي امْرُؤٌ: إنّ واسمها، وهو ياء المتكلم، وخبرها امْرُؤٌ. ومِنْ خَيْرِ عَبْسٍ صفة لامرئ، ومَنْصِبًا تمييز: من خيرهم أصلًا."
- "ونقرأ «شَطْرِي» بدلًا من ياء المتكلم في «إِنِّي»، بدل بعض من كل، فهو منصوب مثلها: إنّ شطري من خير عبس منصبًا. فالبيت يقول «إِنِّي» ثم يستدرك: لا كلّي بل شطري. ويؤيد هذا الفهم شرح ابن قُتَيْبة: «النصف من نسبى فى خير عبس» [@ibn-qutayba، ج1 ص246]."
- "وَأَحْمِي سَائِرِي جملة معطوفة على إِنِّي امْرُؤٌ، وبِالْمُنْصُلِ متعلق بأحمي، والباء للاستعانة."
morphology:
- "مَنْصِب مَفْعِل من نَصَب، وهو المنبت والأصل: «المنصب: الحسب والأصل» [@diwan-antara، ص248]."
- "سَائِر اسم فاعل من سَأَر أي بقي، قال الأَعْلَم: «واشتقاقه من السؤر، وهو ما فضل من الشيء» [@diwan-antara، ص248]. فسائر الشيء ما بقي منه، لا جميعه."
- "المُنْصُل بضم الميم والصاد، «ويقال مُنْصَل أيضا بفتح الصاد» [@aghani-dk، ج8 ص242]."
rhetoric:
  thesis: "يقسم نفسه نصفين: نصف ورثه من أبيه، ونصف يصنعه بيده. فالشرف عنده نسب يُورث وفعل يُكتسب، والفعل يعدل النسب."
  devices:
  - title: "المقابلة بين «شَطْرِي» و«سَائِرِي»"
    text: "قابل النصف الذي من خير عبس بالنصف الآخر، والشرف الموروث في «مَنْصِبًا» بالشرف المكتسب في «بِالْمُنْصُلِ»، وبين الكلمتين تقارب في اللفظ يجمع النسب والسيف. وهذا ما يصرّح به ابن قُتَيْبة: «وأحمى النصف الآخر، وهو نسبه فى السودان، بالسيف، فأشرّفه أيضا» [@ibn-qutayba، ج1 ص246]."
  - title: "الكناية في «سَائِرِي»"
    text: "لم يذكر أمه ولا سواده، بل قال: سائري، أي ما بقي مني. فترك ما يُعيَّر به بلا اسم. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة» [@dalail، ص66]. وصرّح الأَعْلَم بما سكت عنه البيت: «حميت شطري الآخر من قبل أمي» [@diwan-antara، ص248]."
  - title: "الفخر بالفعل"
    text: "يقول أبو الفَرَج في معناه: «فأنا خير في قومي ممن عمه وخاله منهم وهو لا يغني غنائي» [@aghani-dk، ج8 ص240]. فالفخر هنا بالنفس في مقابل النسب، والبيت التالي يفسّر كيف يحمي سائره: يكرّ ويشدّ وينزل."
  connection: "ثم يفصّل كيف يحمي سائره بالسيف: إن لُحق قومه كرّ، وإن أحيط بهم شدّ، وإن ضاق الموضع نزل عن فرسه."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "إِنْنِمْ رُؤُنْ / مِنْ خَيْرِ عَبْ / سِنْ مَنْصِبَنْ = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — شَطْرِي وَأَحْ / مِي سَائِرِي / بِلْ مُنْصُلِي = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلات الست كلها. فليس في البيت مقطعان قصيران متواليان، وهذا يثقّل إيقاعه."
