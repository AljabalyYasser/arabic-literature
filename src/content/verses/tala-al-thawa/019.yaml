  status: "في لسان العرب"
  note: "أنشده ابن منظور هكذا، ثم قال: «قَالَ ابْنُ بَرِّيٍّ: صَوَابُهُ فاقْنَيْ حَياءك» [@lisan، ج15 ص201]."
