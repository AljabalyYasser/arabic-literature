first: "فَاقْنَيْ حَيَاءَكِ لَا أَبَا لَكِ وَاعْلَمِي"
second: "أَنِّي امْرُؤٌ سَأَمُوتُ إِنْ لَمْ أُقْتَلِ"
meaning: "فالزمي حياءك ودعي لومي، واعلمي أني ميت لا محالة إن لم يقتلني أحد. قال الأَعْلَم: «فاقني حياءك أي التزمي الحياء، وارجعي عن لومي» [@diwan-antara، ص252]."
vocabulary:
- term: "فَاقْنَيْ حَيَاءَكِ"
  text: "«أي التزمي الحياء» [@diwan-antara، ص252]، وفي الأغاني: «أي احفظيه ولا تضيعيه» [@aghani-dk، ج8 ص242]. وفي اللسان: «وَمِنْهُ قَنِيتُ حَيائي أَي لَزِمته» [@lisan، ج15 ص201]."
- term: "لَا أَبَا لَكِ"
  text: "كلمة تقال في الحث والإغلاظ، ولا يُراد بها نفي الأب حقيقة: «وإِنما هِيَ خَارِجَةٌ مَخْرَج الْمَثَلِ» [@lisan، ج14 ص11]."
context: "تمام الجواب، وفيه أشهر نصف بيت في القصيدة: «سَأَمُوتُ إِنْ لَمْ أُقْتَلِ». ويستشهد ابن منظور بالبيت مرتين: على قولهم قَنِيَ الحياءَ [@lisan، ج15 ص201]، وعلى قولهم «لا أبا لك» [@lisan، ج14 ص11]. ويرويه ابن عبد ربه فيما يقول إنه «مما يشجّع الجبان» [@iqd، ج1 ص97]."
syntax:
- "فَاقْنَيْ فعل أمر من قَنِيَ يَقْنَى، والياء فاعل، وحَيَاءَكِ مفعول به، والفاء عاطفة على أجبتها. والبيت كذلك في رواية اللسان: «فاقْنَيْ حَياءَك، لَا أَبَا لَك واعْلَمي» [@lisan، ج14 ص11]."
- "لَا أَبَا لَكِ: لا النافية للجنس، وأَبَا اسمها منصوب بالألف، ولَكِ خبرها. وهي في الأصل «لا أباكِ»، واللام مقحمة بين المضاف والمضاف إليه، كما يقول الجوهري: «لأَن اللَّامَ كالمُقْحَمة لَا يُعْتَدُّ بِهَا فِي مِثْلِ هَذَا الْمَوْضِعِ، كَقَوْلِكَ لَا أَبا لَكَ وأَصله لَا أَباك» [@lisan، ج11 ص210]."
- "وَاعْلَمِي أَنِّي امْرُؤٌ: أنّ واسمها وخبرها سدّت مسدّ مفعولي اعلمي، وسَأَمُوتُ صفة لامرئ، وإِنْ لَمْ أُقْتَلِ شرط حُذف جوابه لدلالة ما قبله: إن لم أُقتل فسأموت. والبيت في اللسان: «أَنِّي امْرُؤٌ سأَموتُ إِنْ لَمْ أُقْتَلِ» [@lisan، ج15 ص201]."
morphology:
- "اقْنَيْ أمر من قَنِيَ، وهو من القِنْية، أي ما يكتسبه المرء ويحفظه، ثم قيل للزوم الحياء، ويقول الأَعْلَم: «وأصل الاقتناء اكتساب المال واتخاذه» [@diwan-antara، ص252]."
- "أُقْتَل مضارع مبني للمجهول، وأَمُوت مضارع لازم: الأول فعل يقع عليه من غيره، والثاني فعل يقع منه."
rhetoric:
  thesis: "حجة الفارس كلها في نصف بيت: الموت آتٍ قُتل أو لم يُقتل، فلا يبقى له إلا أن يختار طريقه إليه."
  devices:
  - title: "المقابلة بين «سَأَمُوتُ» و«أُقْتَلِ»"
    text: "قابل الموت الذي يأتي من نفسه بالقتل الذي يأتي من غيره، ونفى بالشرط أن يكون بينهما ثالث، فالخوف من القتل لا يُنجي من الموت. وهو تمام ما بدأه في البيت السابق، كما يلخّصه الأَعْلَم: «لا بد من الموت فلم أخوف به» [@diwan-antara، ص251]."
  - title: "«لَا أَبَا لَكِ»"
    text: "يقول ابن منظور، ناقلًا عن أبي علي، إن قولهم لا أبا لك «لَا حَقِيقَةَ لِمَعْنَاهُ مُطابِقة لِلَفْظِهِ، وإِنما هِيَ خَارِجَةٌ مَخْرَج الْمَثَلِ» [@lisan، ج14 ص11]، ثم يستشهد ببيت عَنْتَرَة. والمَثَل قول يجري على الألسنة فيقال في غير ما قيل فيه أولًا، وانظر مفهوم [المثل](/concepts/al-mathal/)."
  - title: "الأمر في «فَاقْنَيْ» و«وَاعْلَمِي»"
    text: "انتقل من الجواب إلى الأمر: لا يجادلها بعد ذلك بل يأمرها، فالعاذلة التي بدأت باللوم صارت مأمورة بالحياء."
  connection: "ثم يرتفع من قبول الموت إلى أن يجعل الموت على صورته هو."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَقْنَيْ حَيَا / ءَكِ لَا أَبَا / لَكِ وَعْلَمِي = مُتْفاعلن / متَفاعلن / متَفاعلن — أَنْنِمْ رُؤُنْ / سَأَمُوتُ إِنْ / لَمْ أُقْتَلِي = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "تسقط همزة الوصل في النطق في فاقني واعلمي وامرؤ. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر، والأولى والثالثة من العجز."
variants:
