first: "بَيْنَ بَنِي جَحْجَبَى وَبَيْنَ بَنِي"
second: "زَيْدٍ فَأَنَّى لِجَارِيَ التَّلَفُ"
vocabulary:
  - term: "بَنِي جَحْجَبَى ... بَنِي زَيْدٍ"
    text: "بطون من بني عَمْرو بن عَوْف من الأوس، قوم سُمَيْر."
  - term: "لِجَارِيَ"
    text: "لحليفي الذي في جواري، وهو المقتول."
