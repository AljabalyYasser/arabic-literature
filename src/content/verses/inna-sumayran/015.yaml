first: "مَا قَصَّرَ المَجْدُ دُونَ مَحْتِدِنَا"
second: "بَلْ لَمْ يَزَلْ فِي بُيُوتِنَا يَكِفُ"
vocabulary:
  - term: "مَحْتِدِنَا"
    text: "أصلنا."
  - term: "يَكِفُ"
    text: "يقطر ويسيل، كأن المجد مطر لا ينقطع عن بيوتهم."
