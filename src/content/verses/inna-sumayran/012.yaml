explained: false
first: "أَبْنَاءُ حَرْبِ الحُرُوبِ ضَرَّسَنَا"
second: "أَبْكَارُهَا وَالعَوَانُ وَالشُّرُفُ"
vocabulary:
  - term: "ضَرَّسَنَا"
    text: "جرّبنا وأحكمنا."
  - term: "أَبْكَارُهَا وَالعَوَانُ وَالشُّرُفُ"
    text: "يشبّه الحروب بالنوق: البكر أولها، والعوان ما قوتل فيها مرة بعد مرة، والشُّرُف جمع شارف، وهي المسنّة."
