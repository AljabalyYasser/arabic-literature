explained: false
first: "إِنْ يَكُنِ الظَّنُّ صَادِقًا بِبَنِي النْـ"
second: "ـنَجَّارِ لَا يُطْعِمُوا الَّذِي عَلَفُوا"
vocabulary:
  - term: "بَنِي النَّجَّارِ"
    text: "من الخزرج، يستنصرهم مالك على بني عَمْرو بن عَوْف."
  - term: "لَا يُطْعِمُوا الَّذِي عَلَفُوا"
    text: "لا يقبلوا الضيم ولا يقرّوا به. وفي «الأغاني» زيادة في تفسيره: «يقال: علفوا الضيم إذا أقروا به، أى ظنى أنهم لا يقبلون الضيم» [@aghani-dk، ج3 ص20]."
