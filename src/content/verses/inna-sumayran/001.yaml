explained: false
first: "إِنَّ سُمَيْرًا أَرَى عَشِيرَتَهُ"
second: "قَدْ حَدِبُوا دُونَهُ وَقَدْ أَنِفُوا"
vocabulary:
  - term: "حَدِبُوا دُونَهُ"
    text: "عطفوا عليه ودافعوا عنه؛ «وحدب فلان على فلان يحدب حدبا فهو حدب، وتحدب: تعطف وحنا عليه» [@lisan، ج1 ص301]."
  - term: "أَنِفُوا"
    text: "استكبروا أن يُسلموه؛ «أنف من الشيء يأنف أنفا إذا كرهه وشرفت عنه نفسه» [@lisan، ج9 ص15]."
