first: وَمِنَّا إِذَا بَلَغَ الصَّبِيُّ فِطَامَهُ
second: سَاسُ الْأُمُورِ وَحَارِبُ الْأَقْوَامِ
vocabulary:
- term: فِطَامَهُ
  text: وقت فطامه، حين يُفصل عن الرضاع.
- term: سَاسُ الْأُمُورِ
  text: سائسها ومدبّرها.
- term: حَارِبُ الْأَقْوَامِ
  text: 'سالبهم أموالهم؛ «والحارب: المُشلِّح»، و«الحَرَب: أن يُسلب الرجل ماله» [@lisan، ج1 ص303].'
