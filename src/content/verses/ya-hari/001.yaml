explained: false
first: يَا حَارِ لَا تَجْهَلْ عَلَى أَشْيَاخِنَا
second: إِنَّا ذَوُو السَّوْرَاتِ وَالْأَحْلَامِ
vocabulary:
- term: يَا حَارِ
  text: يا حارث، بحذف آخر الاسم.
- term: لَا تَجْهَلْ عَلَى
  text: لا تسفه عليهم ولا تتعدَّ.
- term: السَّوْرَاتِ
  text: 'جمع سَوْرة، وهي «الوثبة»، «ويقال: إن لغضبه لسَوْرة» [@lisan، ج4 ص385].'
- term: الْأَحْلَامِ
  text: جمع حِلْم، وهو الأناة والعقل.
