first: وَيَقُمْنَ رَبَّاتُ الْخُدُورِ حَوَاسِرًا
second: يَمْسَحْنَ عُرْضَ ذَوَائِبِ الْأَيْتَامِ
vocabulary:
- term: رَبَّاتُ الْخُدُورِ
  text: النساء المصونات؛ والخُدور جمع خِدْر، وهو الستر يُمدّ للمرأة في ناحية البيت.
- term: حَوَاسِرًا
  text: كاشفات الوجوه والرؤوس، جمع حاسر.
- term: عُرْضَ
  text: جانب.
- term: ذَوَائِبِ
  text: جمع ذُؤابة، وهي الخُصلة من شعر الرأس.
sources:
- source: asmaiyyat
  loc: ص156
