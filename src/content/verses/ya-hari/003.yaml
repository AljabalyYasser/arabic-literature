first: قَتَلُوا كُلَيْبًا ثُمَّ قَالُوا أَرْبَعُوا
second: كَذَبُوا وَرَبِّ الْحِلِّ وَالْإِحْرَامِ
vocabulary:
- term: أَرْبَعُوا
  text: 'كُفّوا وارفقوا، من قولهم: «ارْبَعْ على نفسك رَبْعًا أي كُفّ وارفق»، «ومَن قطع الهمزة قال: فأَرْبَعْ» [@lisan، ج8 ص110].'
- term: الْحِلِّ
  text: الحلال، وهو ضدّ الإحرام.
