first: "وَمَا النَّاسُ إِلَّا كَالدِّيَارِ وَأَهْلِهَا"
second: "بِهَا يَوْمَ حَلُّوهَا وَغَدْوًا بَلَاقِعُ"
meaning: "ليس الناس إلا كالديار مع أهلها: عامرة بهم يوم ينزلونها، وغدًا خالية. قال الطُّوسِيّ: «يقول: بينا هم أحياء إذ ماتوا، وكذلك الديار، بينا هي عامرة إذ أقفرت من أهلها فصارت بلاقع أي قفارا» [@diwan-labid، ص169]."
vocabulary:
  - term: "حَلُّوهَا"
    text: "نزلوها وأقاموا بها."
  - term: "غَدْوًا"
    text: "غدًا، وهو في شرح الطوسي بمعنى «غدًا» [@diwan-labid، ص169]. قال ابن الأَنْبارِيّ: «والأصل في (غد) غدو، فحذفت الواو وعربت الدال»، واستشهد بهذا البيت [@ibn-al-anbari، ص290]."
  - term: "بَلَاقِعُ"
    text: "«أي قفارا» [@diwan-labid، ص169]، جمع «بَلْقَع»، وهي الأرض الخالية."
context: "أول الحكم الثلاث المتوالية التي تبدأ بـ«وَمَا ... إِلَّا» (5، 6، 7)، ثم تعود الصيغة في البيت 10. ينتقل بها الشاعر من فقد أربد إلى قانون يشمل الناس جميعًا. ويستشهد بالبيت المَرْزُبانيّ مثالًا لما جاء من الكلام على أصله: «وقد جاء فى غد غدو» [@muwashshah، ص129]."
syntax:
  - "«ما» نافية، و«النَّاسُ» مبتدأ، و«إِلَّا» أداة حصر، و«كَالدِّيَارِ» جار ومجرور في موضع الخبر، و«أَهْلِهَا» معطوف على «الدِّيَارِ»."
  - "«بِهَا» متعلق بمحذوف حال من «أَهْلِهَا»، أي كائنين بها. و«يَوْمَ» ظرف زمان مضاف إلى جملة «حَلُّوهَا»."
  - "«غَدْوًا» ظرف زمان، و«بَلَاقِعُ» خبر لمبتدأ محذوف تقديره: وهي غدًا بلاقع."
morphology:
  - "«الدِّيَار» جمع «دار» على «فِعَال»، وياؤها منقلبة عن واو."
  - "«غَدْو» على «فَعْل» أصلُ «غَد»، حُذفت لامه في الاستعمال، ورجع إليه الشاعر هنا."
  - "«بَلَاقِع» جمع «بَلْقَع» على «فَعَالِل»."
  - "«حَلُّوا» ماض مضعّف من «حَلَّ يَحُلُّ»، أُسند إلى واو الجماعة."
rhetoric:
  thesis: "حكمة تجعل الموت سنّة: الناس في الدنيا كسكان الديار، ينزلونها ثم يخلونها."
  devices:
    - title: "التشبيه التمثيلي"
      text: "«كَالدِّيَارِ وَأَهْلِهَا ... وَغَدْوًا بَلَاقِعُ»: لم يشبّه الناس بالديار وحدها، بل شبّه حالهم بحال ديار عامرة بأهلها يوم نزلوها ثم صارت قفرًا غدًا. فوجه الشبه هيئة منتزعة من حالين متعاقبين: العمران ثم الخلاء. وعبد القاهر الجُرْجانيّ يقسم التشبيه ضربين: «أحدهما أن يكون من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل، والآخر أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، والثاني هو التمثيل. ويقول في أثر التمثيل إذا كان المعنى وعظًا: «كان أشْفَى للصدر، وأدعى إلى الفكر، وأبلغ في التنبيه والزَّجر» [@asrar، ص116]."
    - title: "القصر بالنفي والاستثناء"
      text: "«وَمَا النَّاسُ إِلَّا ...»: قصر الناس على هذه الصفة. ويرى عبد القاهر أن هذه الصيغة تكون للأمر ينكره المخاطب أو يشك فيه، فتقوله «لمن يدفَعُ أن يكونَ الأمْرُ على ما قلت» [@dalail، ص332]. فكأن الشاعر يخاطب من يعيش ناسيًا للموت، فيقرر له ما يعرفه وينكره بفعله."
    - title: "الطباق"
      text: "«يَوْمَ حَلُّوهَا» و«غَدْوًا بَلَاقِعُ»: العمران والخلاء، واليوم وغده. وقرب «اليوم» من «الغد» يدل على سرعة الانتقال."
  connection: "ثم يأتي بتمثيل ثانٍ للمرء الواحد بعد الناس جميعًا: الشعلة التي تصير رمادًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "وَمَنْ نَا / سُ إِلْلَا كَدْ / دِيَارِ / وَأَهْلِهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — بِهَا يَوْ / مَ حَلْلُوهَا / وَغَدْوَنْ / بَلَاقِعُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر فصارت «فعولُ» [@atiq، ص29]."
