first: "لَعَمْرُكَ مَا تَدْرِي الضَّوَارِبُ بِالْحَصَى"
second: "وَلَا زَاجِرَاتُ الطَّيْرِ مَا اللَّهُ صَانِعُ"
vocabulary:
  - term: "الضَّوَارِبُ بِالْحَصَى"
    text: "الكواهن، وفي اللسان: «والطَّرْقُ: الضَّرْبُ بِالْحَصَى وَهُوَ ضَرْبٌ مِنَ التَّكَهُّنِ»، واستشهد بالبيت برواية «الطَّوَارِقُ بِالْحَصَى» [@lisan، ج10 ص215]."
  - term: "زَاجِرَاتُ الطَّيْرِ"
    text: "اللواتي يتكهنّ بالطير؛ «العِيَافَة: زَجْر الطَّيْرِ والتفاؤُل بأَسمائها وأَصواتها ومَمَرِّها» [@lisan، ج9 ص261]."
