explained: false
first: "أَعَاذِلَ مَا يُدْرِيكِ إِلَّا تَظَنِّيًا"
second: "إِذَا ارْتَحَلَ الْفِتْيَانُ مَنْ هُوَ رَاجِعُ"
vocabulary:
  - term: "أَعَاذِلَ"
    text: "يا عاذلة، أي اللائمة؛ «العَذْلُ: اللَّوْمُ» [@lisan، ج11 ص437]."
  - term: "تَظَنِّيًا"
    text: "ظنًّا، وأصله التظنّن، قُلبت إحدى النونات ياء، «كَمَا قَالُوا: تَظَنَّيْتُ، مِنَ الظَّنِّ» [@lisan، ج1 ص731]."
