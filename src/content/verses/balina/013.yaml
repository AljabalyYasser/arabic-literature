first: "أُخَبِّرُ أَخْبَارَ الْقُرُونِ الَّتِي مَضَتْ"
second: "أَدِبُّ كَأَنِّي كُلَّمَا قُمْتُ رَاكِعُ"
meaning: "صرت أحدّث الناس بأخبار الأجيال التي مضت، لأني أدركتها، وأمشي مشيًا بطيئًا منحنيًا، كأني كلما قمت راكع. قال صاحب اللسان: «فالرّاكِعُ: الْمُنْحَنِي فِي قَوْلِ لَبِيدٍ» [@lisan، ج8 ص133]."
vocabulary:
  - term: "الْقُرُونِ"
    text: "الأجيال؛ «والقَرْنُ: الأُمَّةُ تأْتي بَعْدَ الأُمَّة» [@lisan، ج13 ص333]."
  - term: "أَدِبُّ"
    text: "أمشي رويدًا؛ «ودَبَّ الشيخُ أَي مَشَى مَشْياً رُوَيْداً» [@lisan، ج1 ص369]."
  - term: "رَاكِعُ"
    text: "المنحني [@lisan، ج8 ص133]."
context: "وسط أبيات الشيخوخة (12–14)، وبها تصير المرثية رثاءً للنفس أيضًا: أربد مات، والشاعر بقي ليشيخ. وليس عليه شرح في الديوان، وهو في رواية ابن قُتَيْبة [@ibn-qutayba، ج1 ص271] وأبي الفَرَج في الموضعين [@aghani-dk، ج15 ص374] [@aghani-dk، ج17 ص64] بلفظه."
syntax:
  - "«أُخَبِّرُ» مضارع فاعله ضمير المتكلم، وهو يتعدى إلى مفعولين، حُذف أولهما (الناسَ)، و«أَخْبَارَ» المفعول الثاني، مضاف إلى «الْقُرُونِ»."
  - "«الَّتِي» اسم موصول صفة لـ«الْقُرُونِ»، وجملة «مَضَتْ» صلته."
  - "«أَدِبُّ» جملة مستأنفة بلا عاطف. و«كَأَنِّي» «كأنّ» واسمها ياء المتكلم، و«رَاكِعُ» خبرها."
  - "«كُلَّمَا» ظرف زمان منصوب، و«ما» فيه مصدرية ظرفية، أي كلَّ وقتِ قيامي، وهو متعلق بمعنى التشبيه في «كَأَنِّي ... رَاكِعُ»."
morphology:
  - "«أُخَبِّرُ» مضارع «خَبَّرَ» المضعّف على «فَعَّلَ»، و«أَخْبَار» جمع «خَبَر» على «أَفْعَال»."
  - "«أَدِبُّ» مضارع «دَبَّ يَدِبُّ» المضعّف، ومصدره الدَّبيب."
  - "«الْقُرُون» جمع «قَرْن» على «فُعُول»."
  - "«رَاكِع» اسم فاعل من «رَكَعَ»."
rhetoric:
  thesis: "صورة الشيخ المعمَّر: ذاكرة تحمل أخبار القرون، وجسد منحنٍ يدبّ."
  devices:
    - title: "التشبيه"
      text: "«كَأَنِّي ... رَاكِعُ»: شبّه هيئته إذا قام بهيئة الراكع، والشبه تراه العين: ظهر منحنٍ. فهو من الضرب الأول عند عبد القاهر الجُرْجانيّ، الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "الطباق"
      text: "«قُمْتُ» و«رَاكِعُ»: القيام والركوع ضدان في هيئة المصلي، فجعل قيامه نفسه ركوعًا. فهو لم يعد قادرًا على أن ينتصب."
    - title: "جناس الاشتقاق"
      text: "«أُخَبِّرُ أَخْبَارَ»: كلمتان من أصل واحد. والجناس: أن تتشابه كلمتان في اللفظ، وجناس الاشتقاق أن تجتمعا في أصل واحد. ويدل تضعيف «أُخَبِّرُ» على كثرة الحديث، كعادة الشيوخ."
    - title: "الفصل"
      text: "جاء «أَدِبُّ» بلا عاطف بعد «أُخَبِّرُ»، فوُضعت الصورتان متجاورتين: ما بقي فيه من ذاكرة، وما ذهب من جسده."
  connection: "ثم يجمع الحالين في صورة واحدة: سيف بلي غمده وبقي نصله قاطعًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "أُخَبْبِ / رُ أَخْبَارَلْ / قُرُونِلْ / لَتِي مَضَتْ = فعولُ / مفاعيلن / فعولن / مفاعلن — أَدِبْبُ / كَأَنْنِي كُلْ / لَمَا قُمْ / تُ رَاكِعُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر والعجز، فصارت «فعولُ» [@atiq، ص29]."
