explained: false
first: "فَلَا تَبْعَدَنْ إِنَّ الْمَنِيَّةَ مَوْعِدٌ"
second: "عَلَيْكَ فَدَانٍ لِلطُّلُوعِ وَطَالِعُ"
vocabulary:
  - term: "فَلَا تَبْعَدَنْ"
    text: "«دعاء له» [@diwan-labid، ص171]، أي لا تهلك، يخاطب أربد."
  - term: "مَوْعِدٌ عَلَيْكَ"
    text: "«أي واجبة عليك» [@diwan-labid، ص171]."
  - term: "فَدَانٍ لِلطُّلُوعِ وَطَالِعُ"
    text: "في شرح الطوسي: «فدان للطلوع: أي قريب الأجل»، و«طالع أي يطلع بعد» [@diwan-labid، ص171]. فالناس بين قريب من موعده ومن بلغه."
sources:
  - source: "diwan-labid"
    loc: "ص171"
    url: "https://archive.org/details/3929pdf/page/n216/mode/1up"
status: "review"
