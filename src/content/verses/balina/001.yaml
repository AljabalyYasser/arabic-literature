first: "بَلِينَا وَمَا تَبْلَى النُّجُومُ الطَّوَالِعُ"
second: "وَتَبْقَى الْجِبَالُ بَعْدَنَا وَالْمَصَانِعُ"
meaning: "فنينا نحن، والنجوم التي تطلع كل ليلة لا تفنى، وتبقى بعدنا الجبال وما بناه الناس. والمصانع في شرح الطُّوسِيّ: «مصانع الماء، وهو بناء يبنى يكون فيه الماء؛ ويقال المصانع: القصور» [@diwan-labid، ص168]."
vocabulary:
  - term: "بَلِينَا"
    text: "فنينا، من البِلَى، كما يبلى الثوب فيذهب."
  - term: "الطَّوَالِعُ"
    text: "التي تطلع، ويريد النجوم كلها لأنها تعود فتطلع كل ليلة."
  - term: "الْمَصَانِعُ"
    text: "في شرح الطوسي: «مصانع الماء، وهو بناء يبنى يكون فيه الماء» [@diwan-labid، ص168]. وفي اللسان: «والمَصانِعُ أَيضاً: مَا يَصْنَعُه الناسُ مِنَ الْآبَارِ والأَبْنِيةِ وَغَيْرِهَا»، واستشهد بهذا البيت [@lisan، ج8 ص211]."
context: "مطلع المرثية، وليس قبله نسيب ولا وقوف على ديار: يبدأ بالموت نفسه. وهو البيت الذي سأل به المعتصم جلساءه: «من منكم يروي قوله: بلينا وما تبلى النجوم الطوالع» [@aghani-dk، ج15 ص373]. والقصيدة عند ابن قُتَيْبة «من جيّد شعره» [@ibn-qutayba، ج1 ص270]."
syntax:
  - "«بَلِينَا» فعل ماض، و«نا» فاعله."
  - "الواو في «وَمَا تَبْلَى» للحال، و«ما» نافية، و«النُّجُومُ» فاعل «تَبْلَى»، و«الطَّوَالِعُ» صفة لها. والمعنى: فنينا والحال أن النجوم لا تفنى."
  - "«وَتَبْقَى الْجِبَالُ» معطوفة على «بَلِينَا»، و«بَعْدَنَا» ظرف متعلق بـ«تَبْقَى»، و«الْمَصَانِعُ» معطوف على «الْجِبَالُ»."
morphology:
  - "«بَلِينَا» من «بَلِيَ يَبْلَى» على «فَعِلَ يَفْعَلُ»، ومصدره البِلَى. و«تَبْلَى» مضارع الفعل نفسه، فجمع البيت الماضي والمضارع من مادة واحدة."
  - "«الطَّوَالِع» جمع «طالِعة» على «فَوَاعِل»، و«الْمَصَانِع» جمع «مَصْنَعة» على «مَفَاعِل»."
rhetoric:
  thesis: "حكم عام قبل ذكر الميت: الإنسان يفنى، وما حوله من الطبيعة ومن بناء يده يبقى بعده."
  devices:
    - title: "طباق السلب"
      text: "«بَلِينَا وَمَا تَبْلَى»: أثبت الفعل لنا ونفاه عن النجوم. والطباق: الجمع بين الشيء وضده في الكلام، وطباق السلب أن يكون الضدان فعلًا واحدًا مثبتًا ومنفيًّا. فالمقابلة في الصدر بين فناء الإنسان وبقاء النجوم، وفي العجز بين «نا» و«الْجِبَالُ ... وَالْمَصَانِعُ»."
    - title: "ضمير الجماعة"
      text: "«بَلِينَا» بضمير المتكلمين، لا «بلي أربد»: يدخل الشاعر نفسه والناس جميعًا في الفناء قبل أن يسمي أخاه في البيت التالي، فيصير الرثاء عزاءً عامًّا."
    - title: "الترقي في الباقيات"
      text: "رتّب الباقيات من الأعلى إلى الأدنى: «النُّجُومُ» في السماء، ثم «الْجِبَالُ» في الأرض، ثم «الْمَصَانِعُ» التي بناها الناس بأيديهم. فحتى ما صنعه الإنسان يبقى بعده."
  connection: "ثم يخص من هذا الحكم العام مصابه هو: كان في جوار أربد ففارقه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "بَلِينَا / وَمَا تَبْلَنْ / نُجُومُطْ / طَوَالِعُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَتَبْقَلْ / جِبَالُ بَعْ / دَنَا وَلْ / مَصَانِعُو = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "وزن الطويل في كل شطر «فعولن مفاعيلن فعولن مفاعلن»، و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، أي آخر تفعيلة في الصدر «مفاعلن». والقبض: حذف الخامس الساكن. ودخل القبضُ «مفاعيلن» الثانية في العجز فصارت «مفاعلن». وأُشبعت ضمة العين في آخر البيت فصارت واوًا، وهو الوصل في القافية المطلقة."
