first: "وَقَدْ كُنْتُ فِي أَكْنَافِ جَارِ مَضَنَّةٍ"
second: "فَفَارَقَنِي جَارٌ بِأَرْبَدَ نَافِعُ"
meaning: "كنت أعيش في حمى جار نفيس يُضنّ بمثله، ففارقني بموت أربد جار نافع. وفي شرح الطُّوسِيّ: «جار مضنة: جار يضن به؛ ففارقني بأربد جار نافع، وأربد هو الجار» [@diwan-labid، ص168]."
vocabulary:
  - term: "أَكْنَافِ"
    text: "«وأكناف: جوانب» [@diwan-labid، ص168]. والكون في أكناف الرجل: العيش في حماه."
  - term: "مَضَنَّةٍ"
    text: "عن أبي عمرو في شرح الطوسي: «يقال علق مضنة ومضنة» [@diwan-labid، ص168]، بفتح الضاد وكسرها، أي نفيس يُبخل به. وفي اللسان: «هَذَا الشيءُ عِلْقُ مَضِنَّةٍ أَي يُضَنُّ بِهِ» [@lisan، ج10 ص268]."
  - term: "أَرْبَدَ"
    text: "أربد بن قيس: «وكان أربد بن قيس أخا لبيد بن ربيعة لأمه» [@aghani-dk، ج17 ص58]."
context: "أول ذكر لأربد في القصيدة، فيتحول الكلام من حكم عام إلى مصاب الشاعر. وأربد مات بصاعقة بعد رجوعه من وفد بني عامر: «فأرسل الله عليه وعلى جمله صاعقة فأحرقتهما» [@aghani-dk، ج17 ص58]، والخبر نفسه عند ابن هشام من رواية ابن إسحاق [@ibn-hisham، ج2 ص569]."
syntax:
  - "«قَدْ» مع الماضي للتحقيق، و«كُنْتُ» فعل ناقص والتاء اسمه، و«فِي أَكْنَافِ» خبره، و«جَارِ» مضاف إليه، و«مَضَنَّةٍ» مضاف إليه ثانٍ: جارِ شيءٍ يُضنّ به."
  - "الفاء في «فَفَارَقَنِي» للتعقيب، والنون للوقاية والياء مفعول به، و«جَارٌ» فاعل، و«نَافِعُ» صفته."
  - "«بِأَرْبَدَ» جار ومجرور متعلق بـ«فَارَقَنِي». و«أَرْبَدَ» ممنوع من الصرف للعلمية ووزن الفعل، فجُرّ بالفتحة."
morphology:
  - "«أَكْنَاف» جمع «كَنَف» على «أَفْعَال»."
  - "«مَضَنَّة» على «مَفْعَلة» من «ضَنَّ» إذا بخل، ويقال «مَضِنَّة» أيضًا كما في شرح الطوسي."
  - "«فَارَقَ» على «فاعَلَ»، و«نَافِع» اسم فاعل من «نَفَعَ»."
  - "«أَرْبَد» على «أَفْعَل»، ولذلك مُنع من الصرف."
rhetoric:
  thesis: "يسمّي الميت بعد الحكم العام، ويصف ما فقده: الجوار والحماية."
  devices:
    - title: "التجريد"
      text: "«فَفَارَقَنِي جَارٌ بِأَرْبَدَ»: انتزع من أربد «جارًا نافعًا» كأنه شخص آخر، والمراد أربد نفسه. وبهذا شرحه الطوسي، وقرّبه بقولهم: «أقبل بك الأسد، كأنك لما أقبلت أقبل الأسد» [@diwan-labid، ص168]. والتجريد: أن يُنتزع من الشيء شيء آخر مثله في صفته، مبالغةً في أن الصفة كاملة فيه."
    - title: "الكناية"
      text: "«فِي أَكْنَافِ جَارِ»: الأكناف الجوانب، والكون في جوانب الرجل يدل على الاحتماء به والعيش في رعايته، فهو كناية. وعبد القاهر الجُرْجانيّ يحدّ الكناية بأن يريد المتكلم معنى فلا يذكره بلفظه، «ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود»، «فيومئ به إليهِ، ويجعلهُ دليلاً عليه» [@dalail، ص66]."
    - title: "التنكير"
      text: "«جَارٌ ... نَافِعُ» نكرة موصوفة: لم يقل «ففارقني الجار»، بل جعل أربد واحدًا من جنس نادر، جار ينفع."
  connection: "ثم يقول إنه لا يجزع لهذا الفراق، لأن الدهر يفجع كل فتى."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "وَقَدْ كُنْ / تُ فِي أَكْنَا / فِ جَارِ / مَضَنْنَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — فَفَارَ / قَنِي جَارُنْ / بِأَرْبَ / دَ نَافِعُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر، والأولى والثالثة في العجز، فصارت «فعولُ» [@atiq، ص29]."
variants:
  - reading: "وَقَدْ كُنْتُ فِي أَكْنَافِ دَارِ مَضِنَّةٍ"
    status: "رواية أبي الفَرَج في الجزء 17"
    note: "[@aghani-dk، ج17 ص63]. وفي الجزء 15 أثبت المحقق «جار»، ويقول إن في معظم أصوله «دار مضنة»، وإن الصواب في الديوان والشعر والشعراء [@aghani-dk، ج15 ص373]."
