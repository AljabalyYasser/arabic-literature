first: "فَلَا أَنَا يَأْتِينِي طَرِيفٌ بِفَرْحَةٍ"
second: "وَلَا أَنَا مِمَّا أَحْدَثَ الدَّهْرُ جَازِعُ"
vocabulary:
  - term: "طَرِيفٌ"
    text: "«شيء استطرف واستحدث» [@diwan-labid، ص169]، أي مال جديد. وفي شرح الطوسي: «يقول: لا أفرح بما استطرف من مال أو شيء يسر ولا أجزع إن نكبني الدهر» [@diwan-labid، ص168]."
