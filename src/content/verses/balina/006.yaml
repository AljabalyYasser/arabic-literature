first: "وَمَا الْمَرْءُ إِلَّا كَالشِّهَابِ وَضَوْئِهِ"
second: "يَحُورُ رَمَادًا بَعْدَ إِذْ هُوَ سَاطِعُ"
meaning: "ليس الإنسان إلا كالشعلة وضوئها: تتقد حينًا، ثم تعود رمادًا بعد أن كانت مشتعلة. وفي شرح الطُّوسِيّ: «الشهاب: النار. يحور: يصير» و«ساطع: مشتعل» [@diwan-labid، ص169]."
vocabulary:
  - term: "الشِّهَابِ"
    text: "«النار» [@diwan-labid، ص169]، أي الشعلة المتقدة."
  - term: "يَحُورُ"
    text: "«يصير» [@diwan-labid، ص169]. وفي اللسان: «وَكُلُّ شَيْءٍ تَغَيَّرَ مِنْ حَالٍ إِلى حَالٍ، فَقَدْ حارَ يَحُور حَوْراً»، واستشهد بهذا البيت [@lisan، ج4 ص217]."
  - term: "سَاطِعُ"
    text: "«مشتعل» [@diwan-labid، ص169]."
context: "يوازي البيتَ السابق في صيغته، وينتقل من الناس جميعًا إلى المرء الواحد. وهو من أسير أبيات القصيدة: أنشده المعتصم في الخبر الذي يرويه أبو الفَرَج [@aghani-dk، ج15 ص373]، وهو في مختار ابن قُتَيْبة [@ibn-qutayba، ج1 ص270]."
syntax:
  - "«ما» نافية، و«الْمَرْءُ» مبتدأ، و«كَالشِّهَابِ» في موضع الخبر بعد «إِلَّا»، و«ضَوْئِهِ» معطوف على «الشِّهَابِ»."
  - "«يَحُورُ» بمعنى «يصير» كما فسّره الطوسي، فهو ناقص، واسمه ضمير يعود على الشهاب، و«رَمَادًا» خبره. والجملة حال من «الشِّهَابِ»."
  - "«بَعْدَ» ظرف مضاف إلى «إِذْ»، و«إِذْ» ظرف لما مضى مضاف إلى الجملة الاسمية «هُوَ سَاطِعُ»."
morphology:
  - "«يَحُورُ» مضارع «حارَ يَحُورُ» الأجوف الواوي، ومصدره الحَوْر."
  - "«سَاطِع» اسم فاعل من «سَطَعَ»."
  - "«الشِّهَاب» على «فِعَال»، و«رَمَاد» على «فَعَال»."
rhetoric:
  thesis: "التمثيل الثاني: من خلاء الديار إلى انطفاء الشعلة، ومن الناس إلى المرء."
  devices:
    - title: "التشبيه التمثيلي"
      text: "«كَالشِّهَابِ وَضَوْئِهِ ... يَحُورُ رَمَادًا»: الشبه ليس في الشهاب وحده، بل في قصة الشعلة كلها: ضوء ساطع ثم رماد. فهي هيئة تتغير في الزمن، تقابل حياة الإنسان من قوته إلى موته، ولا يُدرك الشبه إلا بالتأوّل، وهو التمثيل عند عبد القاهر الجُرْجانيّ [@asrar، ص90]. وقد جاء التمثيل بعد أن قرر المعنى صريحًا في المطلع «بَلِينَا»، وعبد القاهر يقول إن التمثيل «إذا جاءَ في أعقاب المعاني ... كساها أُبَّهةً، وكَسَبها مَنْقَبةً» [@asrar، ص115]."
    - title: "الطباق"
      text: "«رَمَادًا» و«سَاطِعُ»: الانطفاء والاشتعال. وقدّم الرماد في اللفظ على السطوع، فبدأ بالنهاية، ثم ردّها بـ«بَعْدَ إِذْ» إلى ما كان."
    - title: "الموازنة بين البيتين"
      text: "«وَمَا النَّاسُ إِلَّا كَالدِّيَارِ» و«وَمَا الْمَرْءُ إِلَّا كَالشِّهَابِ»: صيغة واحدة في صدرين متتاليين، تتغير فيها كلمتان، فتجتمع الحكمتان في ذهن السامع: الجماعة تخلو منها الديار، والفرد ينطفئ."
  connection: "ثم يجعل البرّ والمال من هذا القانون: البر ما أضمرته النفس من التقى، والمال وديعة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "وَمَلْ مَرْ / ءُ إِلْلَا كَشْ / شِهَابِ / وَضَوْئِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — يَحُورُ / رَمَادَنْ بَعْ / دَ إِذْ هُ / وَسَاطِعُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ «فعولن» الثالثة في الصدر، والأولى والثالثة في العجز، فصارت «فعولُ» [@atiq، ص29]. وأُشبعت كسرة الهاء في «ضَوْئِهِ» فصارت ياء، كما يقتضي الوزن."
