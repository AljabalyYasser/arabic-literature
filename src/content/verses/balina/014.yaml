first: "فَأَصْبَحْتُ مِثْلَ السَّيْفِ غَيَّرَ جَفْنَهُ"
second: "تَقَادُمُ عَهْدِ الْقَيْنِ وَالنَّصْلُ قَاطِعُ"
meaning: "صرت كسيف طال عهده بصانعه حتى غيّر الزمن غمده، ونصله ما زال قاطعًا. قال الطُّوسِيّ: «يقول: قد بلي بدني، ونفسي في حدتها وعزتها كالسيف» [@diwan-labid، ص171]."
vocabulary:
  - term: "جَفْنَهُ"
    text: "غمده، كما في شرح الطوسي [@diwan-labid، ص171]."
  - term: "الْقَيْنِ"
    text: "صانع السيف؛ «القَيْنُ: الحَدَّادُ، وَقِيلَ: كُلُّ صَانِعٍ قَيْنٌ» [@lisan، ج13 ص350]."
  - term: "النَّصْلُ"
    text: "«حديدة السيف» [@diwan-labid، ص171]."
context: "آخر أبيات الشيخوخة، يجمع فيه البلى والقوة معًا. ثم يعود إلى أربد في البيت التالي. وفي الشعر والشعراء بيت يكاد يكون هو، يرويه ابن قُتَيْبة للمُساوِر بن هِنْد العَبْسيّ: «وأصبحت مثل السّيف أخلق جفنه ... تقادم عهد القين وهو جديد» [@ibn-qutayba، ج1 ص337]، والعجز فيه يخالف عجز لبيد."
syntax:
  - "«أَصْبَحْتُ» فعل ناقص بمعنى صرت، والتاء اسمه، و«مِثْلَ» خبره، و«السَّيْفِ» مضاف إليه."
  - "جملة «غَيَّرَ جَفْنَهُ تَقَادُمُ ...» صفة للسيف، لأن «ال» فيه للجنس. و«جَفْنَهُ» مفعول به مقدم، و«تَقَادُمُ» فاعل مؤخر، و«عَهْدِ» مضاف إليه، و«الْقَيْنِ» مضاف إليه."
  - "الواو في «وَالنَّصْلُ قَاطِعُ» للحال، و«النَّصْلُ» مبتدأ و«قَاطِعُ» خبره."
morphology:
  - "«تَقَادُم» مصدر «تَقَادَمَ» على «تَفَاعُل»، وهو هنا لطول الزمن لا للمشاركة."
  - "«غَيَّرَ» ماض على «فَعَّلَ»."
  - "«قَاطِع» اسم فاعل من «قَطَعَ»."
rhetoric:
  thesis: "خاتمة الشيخوخة في مفارقة: الجسد يبلى والنفس تبقى حادة."
  devices:
    - title: "التشبيه التمثيلي"
      text: "«مِثْلَ السَّيْفِ غَيَّرَ جَفْنَهُ ... وَالنَّصْلُ قَاطِعُ»: شبّه نفسه وجسده معًا بسيف وغمده: الغمد البالي هو البدن، والنصل القاطع هو النفس، كما شرحه الطوسي. فالشبه منتزع من أمرين متقابلين في صورة واحدة، ولا يُدرك إلا بالتأوّل [@asrar، ص90]."
    - title: "الطباق"
      text: "«غَيَّرَ جَفْنَهُ» و«النَّصْلُ قَاطِعُ»: البلى في الظاهر والبقاء في الباطن."
    - title: "تقديم المفعول"
      text: "«غَيَّرَ جَفْنَهُ تَقَادُمُ عَهْدِ الْقَيْنِ»: قدّم المفعول «جَفْنَهُ» على الفاعل، فبدأ بالأثر الظاهر قبل سببه، وأخّر السبب حتى صار أول العجز."
  connection: "ثم يعود إلى أخيه فيدعو له: «فَلَا تَبْعَدَنْ»، ويذكّر بأن الموت موعد الجميع."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ العين المضمومة"
  scansion: "فَأَصْبَحْ / تُ مِثْلَسْ سَيْ / فِ غَيْيَ / رَ جَفْنَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — تَقَادُ / مُ عَهْدِلْ قَيْ / نِ وَنْنَصْ / لُ قَاطِعُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ «فعولن» الثالثة في الصدر، والأولى في العجز، فصارت «فعولُ» [@atiq، ص29]. وأُشبعت ضمة الهاء في «جَفْنَهُ» فصارت واوًا."
variants:
  - reading: "فَأَصْبَحْتُ مِثْلَ السَّيْفِ أَخْلَقَ جَفْنَهُ"
    status: "رواية في شرح الطوسي، وعند ابن قُتَيْبة وأبي الفَرَج"
    note: "«ويروى: أخلق جفنه (م)» [@diwan-labid، ص171]، أي أبلاه، و(م) رمز نسخة عند المحقق. وبها رواه ابن قُتَيْبة [@ibn-qutayba، ج1 ص271] وأبو الفَرَج [@aghani-dk، ج15 ص374] [@aghani-dk، ج17 ص64]."
