explained: false
first: "فِينَا مَعَاشِرُ لَمْ يَبْنُوا لِقَوْمِهِمُ"
second: "وَإِنْ بَنَى قَوْمُهُمْ مَا أَفْسَدُوا عَادُوا"
vocabulary:
  - term: "مَعَاشِرُ"
    text: "جماعات، جمع مَعْشَر."
  - term: "لَمْ يَبْنُوا لِقَوْمِهِمُ"
    text: "لم يبنوا لقومهم مجدًا ولا خيرًا."
  - term: "مَا أَفْسَدُوا عَادُوا"
    text: "إذا أصلح قومهم ما أفسدوه عادوا إلى إفساده."
