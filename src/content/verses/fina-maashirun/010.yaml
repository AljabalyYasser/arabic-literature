explained: false
first: "أَمَارَةُ الْغَيِّ أَنْ يُلْقَى الْجَمِيعُ لِذِي الْـ"
second: "إِبْرَامِ لِلْأَمْرِ وَالْأَذْنَابُ أَكْتَادُ"
vocabulary:
  - term: "أَمَارَةُ الْغَيِّ"
    text: "علامة الضلال."
  - term: "لِذِي الْـ ... إِبْرَامِ لِلْأَمْرِ"
    text: "صاحب الإحكام للأمر، وإبرام الأمر: إحكامه والقطع فيه. وفي كلمة الإبرام تدوير، أي أن الكلمة بدأت في الصدر بأداة التعريف وتمّت في العجز."
  - term: "وَالْأَذْنَابُ أَكْتَادُ"
    text: "الأذناب: الأتباع وسَفِلة القوم. والأكتاد جمع كَتَد، وفي اللسان: «الكَتَدُ والكَتِدُ: مُجْتَمَعُ الكَتِفَيْنِ مِنَ الإِنسان وَالْفَرَسِ» [@lisan، ج3 ص377]. أي صار الذنب في موضع الكتف، فتقدّم الأتباع وتأخّر السادة."
