explained: false
first: "وَالْبَيْتُ لَا يُبْتَنَى إِلَّا لَهُ عَمَدٌ"
second: "وَلَا عِمَادَ إِذَا لَمْ تُرْسَ أَوْتَادُ"
vocabulary:
  - term: "الْبَيْتُ"
    text: "بيت الشَّعَر، خيمة البدوي."
  - term: "عَمَدٌ ... عِمَادَ"
    text: "العَمَد جمع عمود، وهي الخشبات التي يقوم عليها البيت، والعماد ما يُعتمد عليه منها."
  - term: "تُرْسَ"
    text: "تُثبَّت. في اللسان: «رَسَا الشَّيءُ يَرْسُو رُسُوّاً وأَرْسَى: ثَبَتَ، وأَرْسَاه هُوَ» [@lisan، ج14 ص321]."
  - term: "أَوْتَادُ"
    text: "جمع وَتِد، وهو ما يُدقّ في الأرض لتُشدّ إليه حبال البيت."
