first: "إِنَّ النَّجَاءَ إِذَا مَا كُنْتَ ذَا نَفَرٍ"
second: "مِنْ أَجَّةِ الْغَيِّ إِبْعَادٌ فَإِبْعَادُ"
vocabulary:
