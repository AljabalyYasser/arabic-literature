    text: "صاحب جماعة من قومك."
  - term: "أَجَّةِ الْغَيِّ"
    text: "لهيب الضلال. في اللسان: «والأَجَّةُ: شِدَّةُ الحرِّ وَتَوَهُّجه» [@lisan، ج2 ص207]."
