explained: false
first: "لَا يَصْلُحُ النَّاسُ فَوْضَى لَا سَرَاةَ لَهُمْ"
second: "وَلَا سَرَاةَ إِذَا جُهَّالُهُمْ سَادُوا"
vocabulary:
  - term: "فَوْضَى"
    text: "في اللسان: «وقَوْمٌ فَوْضَى: مُخْتَلِطُون، وَقِيلَ: هُمُ الَّذِينَ لَا أَمير لَهُمْ وَلَا مَنْ يَجْمَعُهُمْ» [@lisan، ج7 ص210]."
  - term: "سَرَاةَ"
    text: "الأشراف والسادة. في اللسان: «قومٌ سَرَاةٌ جمعُ سَرِيٍّ» [@lisan، ج14 ص378]، والسَّرِيّ الشريف."
  - term: "جُهَّالُهُمْ"
    text: "سفهاؤهم وأهل الطيش منهم."
