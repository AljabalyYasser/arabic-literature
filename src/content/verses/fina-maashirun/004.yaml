explained: false
first: "أَوْ بَعْدَهُ كَقُدَارٍ حِينَ تَابَعَهُ"
second: "عَلَى الْغَوَايَةِ أَقْوَامٌ فَقَدْ بَادُوا"
vocabulary:
  - term: "كَقُدَارٍ"
    text: "في اللسان: «وقُدارُ بْنُ سالِفٍ: الَّذِي يُقَالُ لَهُ أَحْمَرُ ثَمُودَ عَاقِرُ نَاقَةِ صَالِحٍ» [@lisan، ج5 ص80]. وبعقره الناقة هلكت ثمود."
  - term: "الْغَوَايَةِ"
    text: "الضلال."
  - term: "بَادُوا"
    text: "هلكوا وانقرضوا."
