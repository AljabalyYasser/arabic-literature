first: "لَا يَرْشُدُونَ وَلَنْ يَرْعَوْا لِمُرْشِدِهِمْ"
second: "فَالْجَهْلُ مِنْهُمْ مَعًا وَالْغَيُّ مِيعَادُ"
vocabulary:
  - term: "يَرْعَوْا"
    text: "يكفّوا ويرجعوا، من الارعواء."
  - term: "وَالْغَيُّ مِيعَادُ"
    text: "الغيّ: الضلال. أي الضلال موعدهم الذي يجتمعون عليه."
