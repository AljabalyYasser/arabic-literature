explained: false
first: "فَإِنْ تَجَمَّعَ أَوْتَادٌ وَأَعْمِدَةٌ"
second: "وَسَاكِنٌ بَلَغُوا الْأَمْرَ الَّذِي كَادُوا"
vocabulary:
  - term: "وَسَاكِنٌ"
    text: "أهل يسكنون البيت."
  - term: "كَادُوا"
    text: "أرادوا. في اللسان: «وأَنشد أَبو بَكْرٍ فِي كَادَ بِمَعْنَى أَراد للأَفوه»، ثم البيت، و«أَراد الَّذِي أَرادوا» [@lisan، ج3 ص385]."
