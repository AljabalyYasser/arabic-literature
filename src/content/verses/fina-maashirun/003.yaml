explained: false
first: "أَضْحَوْا كَقَيْلِ بْنِ عَمْرٍو فِي عَشِيرَتِهِ"
second: "إِذْ أُهْلِكَتْ بِالَّذِي سَدَّى لَهَا عَادُ"
vocabulary:
  - term: "كَقَيْلِ بْنِ عَمْرٍو"
    text: "قَيْل في اللسان: «اسْمُ رَجُلٍ مِنْ عَادٍ. وقَيْلٌ: وافِد عَادٍ» [@lisan، ج11 ص580]، أي الذي أرسلته عاد يستسقي لها. يقول: صار هؤلاء في قومهم كقَيْل في قومه، جرّ عليهم الهلاك."
  - term: "سَدَّى"
    text: "أقام سَدى الثوب، وهو ما مُدّ من خيوطه، ثم استُعير للتدبير: أي بما دبّره لها وجرّه عليها."
  - term: "عَادُ"
    text: "الأمة البائدة التي يذكر القرآن هلاكها بالريح."
