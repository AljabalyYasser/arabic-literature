first: "الْحَمْدُ لِلَّهِ مُمْسَانَا وَمُصْبَحَنَا"
second: "بِالْخَيْرِ صَبَّحَنَا رَبِّي وَمَسَّانَا"
vocabulary:
  - term: "مُمْسَانَا وَمُصْبَحَنَا"
    text: "وقت إمسائنا ووقت إصباحنا، أي في المساء والصباح."
  - term: "صَبَّحَنَا ... وَمَسَّانَا"
    text: "أتانا بالخير صباحًا ومساءً."
