explained: false
first: "رَبُّ الْحَنِيفَةِ لَمْ تَنْفَدْ خَزَائِنُهَا"
second: "مَمْلُوءَةً طَبَّقَ الْآفَاقَ سُلْطَانَا"
vocabulary:
  - term: "الْحَنِيفَةِ"
    text: "الملة الحنيفية، دين إبراهيم."
  - term: "لَمْ تَنْفَدْ"
    text: "لم تفنَ."
  - term: "طَبَّقَ الْآفَاقَ"
    text: "عمّها وغطّاها، و«طَبَّقَ السَّحابُ الجَوَّ: غَشّاه» [@lisan، ج10 ص210]. وفي رواية البَغْداديّ: «طَبَّقَ الْآفَاقَ أَشْطَانَا» [@khizana، ج1 ص248]."
