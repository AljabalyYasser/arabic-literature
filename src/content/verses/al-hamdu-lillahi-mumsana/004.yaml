explained: false
first: "بَيْنَا يُرَبِّبُنَا آبَاؤُنَا هَلَكُوا"
second: "وَبَيْنَمَا نَقْتَنِي الْأَوْلَادَ أَفْنَانَا"
vocabulary:
  - term: "يُرَبِّبُنَا"
    text: "يربّوننا. ورسمها في طبعة «الأغاني» محتمل، وبهذا يرويها البَغْداديّ [@khizana، ج1 ص248]."
  - term: "أَفْنَانَا"
    text: "أفنانا الدهر، أي أهلكنا ونحن نقتني الأولاد. وفي رواية البَغْداديّ: «أَبْلَانَا» [@khizana، ج1 ص248]."
