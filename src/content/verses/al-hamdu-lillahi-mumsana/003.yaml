explained: false
first: "أَلَا نَبِيٌّ لَنَا مِنَّا فَيُخْبِرَنَا"
second: "مَا بَعْدَ غَايَتِنَا مِنْ رَأْسِ مَحْيَانَا"
vocabulary:
  - term: "أَلَا"
    text: "حرف تمنٍّ هنا، أي: ليت لنا نبيًّا منا."
  - term: "غَايَتِنَا"
    text: "منتهانا، وهو الموت."
  - term: "مَحْيَانَا"
    text: "حياتنا. وفي رواية البَغْداديّ: «مِنْ رَأْسِ مَجْرَانَا» [@khizana، ج1 ص248]."
