explained: false
first: "وَقَدْ عَلِمْنَا لَوَ انَّ الْعِلْمَ يَنْفَعُنَا"
second: "أَنْ سَوْفَ يَلْحَقُ أُخْرَانَا بِأُولَانَا"
vocabulary:
  - term: "لَوَ انَّ"
    text: "«لو أنّ»، نُقلت حركة الهمزة إلى الواو وحُذفت الهمزة للوزن."
  - term: "أُخْرَانَا بِأُولَانَا"
    text: "آخرنا بأولنا، أي يموت الباقون كما مات الماضون."
sources:
