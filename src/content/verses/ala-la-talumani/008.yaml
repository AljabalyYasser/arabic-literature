first: "أَقُولُ وَقَدْ شَدُّوا لِسَانِي بِنِسْعَةٍ"
second: "أَمَعْشَرَ تَيْمٍ أَطْلِقُوا عَنْ لِسَانِيَا"
meaning: "أقول لآسريّ وقد ربطوا لساني بسير من جلد: يا بني تَيْم، أطلقوا لساني."
vocabulary:
  - term: "نِسْعَةٍ"
    text: "«النسع: سير يضفر على هيئة أعنة النعال تشد به الرحال ... والقطعة منه نسعة» [@lisan، ج8 ص352]."
  - term: "تَيْمٍ"
    text: "تَيْم الرِّباب، قال التِّبْرِيزِيّ: «أسرته التيم تيم الرباب» [@tabrizi-ikhtiyarat، ج2 ص766]."
  - term: "أَطْلِقُوا عَنْ لِسَانِيَا"
    text: "فكّوا عنه ما شددتموه به."
context: "يتحول الخطاب إلى الآسرين أنفسهم، وفي هذا البيت خبر القصيدة كله: كانوا قد شدّوا لسانه لئلا يهجوهم، قال الجاحظ: «إنهم إذا أسروا الشاعر أخذوا عليه المواثيق، وربما شدوا لسانه بنسعة، كما صنعوا بعبد يغوث ابن وقاص الحارثي» [@bayan، ج3 ص273]. وهو أول ما يرويه ابن رَشِيق من القصيدة [@ibn-rashiq، ج1 ص193]."
syntax:
  - "«أقول» مضارع فاعله ضمير المتكلم، وجملة «وقد شدّوا لساني بنسعة» حال، والواو واو الحال، و«قد» للتحقيق مع الماضي."
  - "«أمعشرَ تيمٍ»: الهمزة حرف نداء، و«معشرَ» منادى منصوب لأنه مضاف، و«تيمٍ» مضاف إليه. وجملة النداء وما بعدها مقول القول."
  - "«أطلقوا عن لسانيا»: فعل أمر وفاعله، و«عن لساني» متعلق به، والمفعول محذوف تقديره: أطلقوا الشدّ عن لساني، والألف للإطلاق."
morphology:
  - "«نِسْعة» على «فِعْلة»، اسم للقطعة من النِّسْع."
  - "«أطلِقوا» أمر من «أطلق» على «أفعل»، فهمزته همزة قطع."
  - "«شدّوا» ماض مضعّف من «شدّ يشُدّ»، أصله «شَدَدوا»."
rhetoric:
  thesis: "بيت يجمع المفارقة كلها: شاعر مشدود اللسان يقول شعرًا."
  devices:
    - title: "المفارقة"
      text: "يبدأ البيت بـ«أَقُولُ» ثم يخبر بأنهم «شَدُّوا لِسَانِي»: فعل القول ونقيضه في شطر واحد. والقصيدة نفسها شاهد على أنهم أطلقوه."
    - title: "الحقيقة أو التمثيل"
      text: "في «شَدُّوا لِسَانِي بِنِسْعَةٍ» قولان يذكرهما التِّبْرِيزِيّ: «هذا مثل، واللسان لا يشد بنسعة، إنما أراد: افعلوا خيرا ينطلق لساني بشكركم، فإنكم ما لم تفعلوا فلساني مشدود، لا أقدر على مدحكم. وقال أبو عبيدة: كانوا قد شدوا لسانه مخافة هجائه، فجعل لهم ألا يهجوهم، فأطلقوا لسانه» [@tabrizi-ikhtiyarat، ج2 ص769]. وعلى القول الأول هو كناية عن العجز عن الكلام بصورة الربط، أي بمعنى هو «تاليه وردفه في الوجود» كما يقول عبد القاهر [@dalail، ص66]. والجاحظ وأبو الفَرَج يرويان الشدّ خبرًا واقعًا، فقول أبي عُبَيْدة أشبه بالخبر."
    - title: "تكرار النداء"
      text: "«أَمَعْشَرَ تَيْمٍ» ينادي آسريه بالهمزة، وهي لنداء القريب، فهم حوله. ثم يكرر النداء نفسه في أول البيت التاسع، فيتوالى الطلب: أطلقوا، ثم أسجحوا."
  connection: "ثم يكرر النداء في البيت التاسع ويسألهم الرفق: «قد ملكتم فأسجحوا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الياء المفتوحة تليها ألف الإطلاق"
  scansion: "أَقُولُ / وَقَدْ شَدْدُو / لِسَانِي / بِنِسْعَتِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — أَمَعْشَ / رَ تَيْمِنْ أَطْ / لِقُو عَنْ / لِسَانِيَا = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الأولى في الشطرين فصارت «فعولُ» [@atiq، ص29]، والعَرُوض والضَّرْب مقبوضتان «مفاعلن»."
