explained: false
first: "وَأَنْحَرُ لِلشَّرْبِ الكِرَامِ مَطِيَّتِي"
second: "وَأَصْدَعُ بَيْنَ القَيْنَتَيْنِ رِدَائِيَا"
vocabulary:
  - term: "لِلشَّرْبِ"
    text: "للقوم يشربون معه، و«قوم شرب وشرب» [@lisan، ج1 ص490]."
  - term: "وَأَصْدَعُ"
    text: "«أشق» [@tabrizi-ikhtiyarat، ج2 ص772]."
  - term: "القَيْنَتَيْنِ"
    text: "«القينة: الأمة مغنية كانت أو غير مغنية. وهي ههنا مغنية» [@tabrizi-ikhtiyarat، ج2 ص772]. أي يشق رداءه بين المغنيتين، فيعطي كلًّا منهما شطره."
