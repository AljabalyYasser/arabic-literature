first: "أَلَمْ تَعْلَمَا أَنَّ المَلَامَةَ نَفْعُهَا"
second: "قَلِيلٌ وَمَا لَوْمِي أَخِي مِنْ شِمَالِيَا"
vocabulary:
  - term: "شِمَالِيَا"
    text: "«أخلاقي. واحدة الشمائل» [@tabrizi-ikhtiyarat، ج2 ص767]، أي ليس اللوم من طبعي."
  - term: "أَخِي"
    text: "أراد بالأخ الجماعة، كما يقول التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج2 ص767]، أي لا ألوم إخواني."
