first: "فَإِنْ تَقْتُلُونِي تَقْتُلُوا بِيَ سَيِّدًا"
second: "وَإِنْ تُطْلِقُونِي تَحْرُبُونِي بِمَالِيَا"
meaning: "إن قتلتموني فإنما تقتلون بصاحبكم سيدًا، وإن أطلقتموني أخذتم مالي فداءً حتى لا يبقى لي شيء."
vocabulary:
  - term: "تَحْرُبُونِي"
    text: "«حربه يحربه حربا، مثل طلبه يطلبه طلبا، إذا أخذ ماله وتركه بلا شيء» [@lisan، ج1 ص304]، وفسّره التِّبْرِيزِيّ: «أي: تسلبوني مالي» [@tabrizi-ikhtiyarat، ج2 ص770]."
  - term: "بِيَ"
    text: "بقتلي، والياء مفتوحة."
context: "سألهم في البيت التاسع أن يرفقوا به، وقال إنه ليس «بَواءً» لصاحبهم، ثم يعرض عليهم الخيارين. ويروي ابن رَشِيق أنه عرض عليهم فداءً فأبوا إلا قتله، فقال هذا البيت، ثم يقول: «وهذه شهامة عظيمة وشدة» [@ibn-rashiq، ج1 ص194]."
syntax:
  - "«فإنْ تقتلوني»: «إنْ» شرطية جازمة، و«تقتلوني» فعل الشرط مجزوم بحذف النون، والواو فاعل، والنون للوقاية، والياء مفعول به. و«تقتلوا» جواب الشرط مجزوم بحذف النون."
  - "«بِيَ سيّدًا»: «سيّدًا» مفعول به لـ«تقتلوا»، و«بيَ» متعلق به، والباء باء التجريد، كقولهم: لقيت بفلان أسدًا، أي لقيت فيه أسدًا. فالمعنى: تقتلوا فيّ سيدًا."
  - "«وإن تطلقوني تحربوني بماليا»: مثل الشطر الأول، و«تحربوني» جواب الشرط، و«بمالي» متعلق به، والباء فيه بمعنى «في» أو للتعدية إلى المفعول الثاني: تسلبوني مالي."
morphology:
  - "«تَحْرُبوني» من «حَرَبه يَحْرُبه» من باب «طَلَب»، كما يقول صاحب اللسان، ومصدره «الحَرَب» بالتحريك."
  - "«سيّد» على «فَيْعِل» من «ساد يسود»، أصله «سَيْوِد»، فقُلبت الواو ياءً وأُدغمت في الياء."
rhetoric:
  thesis: "الأسير يضع آسريه بين خسارتين، لا بين ربح وخسارة."
  devices:
    - title: "المقابلة والتقسيم"
      text: "«فَإِنْ تَقْتُلُونِي ... وَإِنْ تُطْلِقُونِي»: قابل القتل بالإطلاق، والشرط بالشرط، وجعل لكل حال جزاءها. وفي الحالين يبقى عزيزًا: إن قُتل فهو سيد، وإن أُطلق فقد افتدى نفسه بماله."
    - title: "التجريد"
      text: "في «تَقْتُلُوا بِيَ سَيِّدًا» كأنه انتزع من نفسه سيدًا آخر يُقتل فيه. فلا يقول: أنا سيد، بل يجعل السيادة شيئًا قائمًا سيقتلونه. والتجريد: أن ينتزع المتكلم من نفسه شخصًا آخر مثله في الصفة."
  connection: "ثم ينتقل إلى ما سيفوته بالموت: «أحقًّا عباد الله أن لست سامعًا نشيد الرعاء»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الياء المفتوحة تليها ألف الإطلاق"
  scansion: "فَإِنْ تَقْ / تُلُونِي تَقْ / تُلُو بِ / يَ سَيْيِدَنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — وَإِنْ تُطْ / لِقُونِي تَحْ / رُبُونِي / بِمَالِيَا = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الثالثة من الصدر فصارت «فعولُ» [@atiq، ص29]. وتُقرأ «بِيَ» بفتح الياء، ولو سُكّنت لانكسر الوزن."
