first: "أَلَا لَا تَلُومَانِي كَفَى اللَّوْمَ مَا بِيَا"
second: "وَمَا لَكُمَا فِي اللَّوْمِ خَيْرٌ وَلَا لِيَا"
meaning: "لا تلوماني، فما نزل بي من الأسر وانتظار القتل يغني عن لومكما، وليس في اللوم خير لكما ولا لي."
vocabulary:
  - term: "تَلُومَانِي"
    text: "تعذلاني، والخطاب لاثنين."
  - term: "مَا بِيَا"
    text: "ما بي، أي ما نزل بي، والألف في آخره ألف الإطلاق."
context: "مطلع القصيدة. وفي رواية أبي عُبَيْدة أن عِصْمة التيمي تركه مع ابنين له، فقالا: «جمعت أهل اليمن وجئت لتصطلمنا، فكيف رأيت الله صنع بك؟» [@aghani-dk، ج16 ص333]، فقال القصيدة. فالاثنان اللذان ينهاهما عن اللوم في هذه الرواية ابنا آسره. ويروي الجاحظ سبعة من أبياتها أولها هذا، ثم يقول: «وليس في الأرض أعجب من طرفة بن العبد وعبد يغوث» [@bayan، ج2 ص184]."
syntax:
  - "«ألا» حرف استفتاح وتنبيه، و«لا» ناهية، و«تلوماني» مضارع مجزوم بها، وعلامة جزمه حذف النون، والألف فاعل، والنون للوقاية، والياء مفعول به."
  - "«كفى اللومَ ما بيا»: «كفى» فعل ماض، و«اللومَ» مفعول به مقدم، و«ما» اسم موصول فاعل مؤخر، و«بيا» جار ومجرور صلته. والمعنى: كفى ما بي اللومَ، أي أغنى عنه. والجملة استئناف يعلّل النهي."
  - "«وما لكما في اللوم خير»: «ما» نافية، و«لكما» خبر مقدم، و«في اللوم» متعلق بما تعلق به الخبر، و«خيرٌ» مبتدأ مؤخر. و«ولا ليا» معطوف على «لكما»، و«لا» زائدة لتأكيد النفي."
morphology:
  - "«تلوماني» من «لام يلوم لَوْمًا»، أجوف واوي، و«اللوم» مصدره، و«الملامة» في البيت التالي مصدر ميمي منه."
  - "«بيا» و«ليا»: ياء المتكلم بعد حرف الجر تُسكَّن وتُفتح، وفُتحت هنا وأُشبعت الفتحة ألفًا لأنها في القافية، وهي ألف الإطلاق."
rhetoric:
  thesis: "مطلع بلا وقوف على الأطلال ولا نسيب: يبدأ الأسير من موقفه، فالقصيدة كلها من الحاضر."
  devices:
    - title: "التصريع والتكرار"
      text: "في «بِيَا» و«لِيَا» اتفق آخر الشطرين في الوزن والقافية، وهو التصريع، ويكون في مطالع القصائد. ويتكرر «اللوم» في الشطرين، كأنه يردّ على لائميه كلمتهم."
    - title: "الإبهام"
      text: "في «مَا بِيَا» لم يسمّ ما نزل به، الأسر واللسان المشدود والموت المنتظر، وجعله «ما» المبهمة. والسامع يعرف الحال، فالإبهام يكبّرها ولا يخفيها. وهذا قراءتنا."
    - title: "نهي معناه الشكوى"
      text: "«لَا تَلُومَانِي» نهي في لفظه، وهو في معناه شكوى: لا يطلب من اللائمين شيئًا بقدر ما يعلن أنه بلغ حدًّا لا يحتمل معه اللوم."
  connection: "ثم يعلّل النهي في البيت الثاني: الملامة قليلة النفع، وليس اللوم من أخلاقه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الياء المفتوحة تليها ألف الإطلاق"
  scansion: "أَلَا لَا / تَلُومَانِي / كَفَلْ لَوْ / مَ مَا بِيَا = فعولن / مفاعيلن / فعولن / مفاعلن — وَمَا لَ / كُمَا فِلْ لَوْ / مِ خَيْرُنْ / وَلَا لِيَا = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "العَرُوض والضَّرْب مقبوضتان «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والقبض: حذف الخامس الساكن. ودخل القبض «فعولن» الأولى من العَجُز فصارت «فعولُ». والبيت مصرّع."
variants:
  - reading: "فَمَا لَكُمَا فِي اللَّوْمِ نَفْعٌ وَلَا لِيَا"
    status: "رواية «النقائض» و«الأغاني»"
    note: "«نفع» مكان «خير» [@naqaid، ج1 ص325]، وكذلك في «الأغاني» [@aghani-dk، ج16 ص333]."
  - reading: "فَمَا لَكُمَا فِي اللَّوْمِ خَيْرٌ وَلَا لِيَا"
    status: "رواية التِّبْرِيزِيّ والجاحظ"
    note: "«فما» مكان «وما» [@tabrizi-ikhtiyarat، ج2 ص767]؛ [@bayan، ج2 ص183]."
