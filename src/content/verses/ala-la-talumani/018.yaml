explained: false
first: "وَعَادِيَةٍ سَوْمَ الجَرَادِ وَزَعْتُهَا"
second: "بِكَفِّي وَقَدْ أَنْحَوْا إِلَيَّ العَوَالِيَا"
vocabulary:
  - term: "وَعَادِيَةٍ"
    text: "«القوم يعدون» [@tabrizi-ikhtiyarat، ج2 ص773]، أي خيل مغيرة."
  - term: "سَوْمَ الجَرَادِ"
    text: "«أي: انتشاره في المرعى» [@tabrizi-ikhtiyarat، ج2 ص773]، يريد كثرتها."
  - term: "وَزَعْتُهَا"
    text: "«كففتها» [@tabrizi-ikhtiyarat، ج2 ص773]."
  - term: "أَنْحَوْا إِلَيَّ العَوَالِيَا"
    text: "أنحوا الرماح: «أمالوها وقصدوا بها» [@tabrizi-ikhtiyarat، ج2 ص773]، والعوالي: أعالي الرماح."
