first: "وَظَلَّ نِسَاءُ الحَيِّ حَوْلِيَ رُكَّدًا"
second: "يُرَاوِدْنَ مِنِّي مَا تُرِيدُ نِسَائِيَا"
meaning: "وبقيت نساء الحي واقفات حولي لا يبرحن، يطلبن مني ما تطلبه نسائي: أن أطأهن. يقول: أعجبهن جمالي وقوتي وأنا أسير مقيد، فاشتهينني كما تشتهيني زوجاتي."
vocabulary:
  - term: "رُكَّدًا"
    text: "جمع راكدة، من الركود، و«كل ثابت في مكان: فهو راكد» [@lisan، ج3 ص184]، أي مقيمات حوله لا يبرحن."
  - term: "يُرَاوِدْنَ"
    text: "يطلبن ويحاولن، والمراودة في هذا الموضع طلب الجماع: قال الليث: «وتقول راود فلان جاريته عن نفسها وراودته هي عن نفسه إذا حاول كل واحد من صاحبه الوطء والجماع» [@lisan، ج3 ص191]."
  - term: "مَا تُرِيدُ نِسَائِيَا"
    text: "ما تطلبه منه زوجاته، وهو الوطء."
context: "بعد ضحكة العجوز يذكر الصورة المقابلة: نساء الحي حوله لا يسخرن منه بل يشتهينه. وفي «النقائض» أن أم آسره رأته «رجلا شريفاً عظيماً جليلاً جميلاً» [@naqaid، ج1 ص324]، وفي «العقد» أن امرأة الأهتم التي خُبّئ عندها «أعجبها جماله وكمال خلقه» [@iqd، ج6 ص83]. فالبيت فخر بفحولته في ساعة ضعفه. وفي «النقائض» «نساء التيم» مكان «نساء الحي» [@naqaid، ج1 ص325]، أي نساء آسريه أنفسهم. ولم نجد للبيت شرحًا عند التِّبْرِيزِيّ إلا قوله في «ركدًا»: «ينبغي: رواكد» [@tabrizi-ikhtiyarat، ج2 ص771]، فالشرح الصريح هنا شرحنا."
syntax:
  - "«ظلّ» فعل ماض ناقص، و«نساءُ» اسمه، و«الحيّ» مضاف إليه، و«حولي» ظرف متعلق بـ«رُكّدًا»، و«رُكّدًا» خبر «ظلّ»."
  - "جملة «يراودن مني ما تريد نسائيا» خبر ثانٍ لـ«ظلّ» أو حال من «نساء». و«يراودن» مضارع مبني على السكون لاتصاله بنون النسوة، والنون فاعل، و«مني» متعلق به، و«ما» اسم موصول مفعول به، و«تريد نسائيا» صلته، والعائد محذوف: ما تريده."
morphology:
  - "«رُكَّد» جمع «راكد» أو «راكدة» على «فُعَّل»، كـ«ساجد وسُجَّد»، وكان القياس في جمع المؤنث «رواكد»، ولذلك قال التِّبْرِيزِيّ: «ينبغي: رواكد»."
  - "«يراودن» من «راود» على «فاعَل»، وهو للمشاركة والمحاولة المتكررة."
rhetoric:
  thesis: "الأسير يقلب الصورة: لم يعد موضع سخرية بل موضع شهوة."
  devices:
    - title: "المقابلة بين بيتين"
      text: "قابل «وَتَضْحَكُ مِنِّي شَيْخَةٌ» في البيت قبله بـ«يُرَاوِدْنَ مِنِّي» هنا: عجوز واحدة تسخر، ونساء كثيرات يشتهين. فيمحو البيت الثاني أثر الأول."
    - title: "الكناية"
      text: "«مَا تُرِيدُ نِسَائِيَا» كناية عن الجماع: لم يسمّه، وذكر ما يدل عليه، وهو ما تطلبه الزوجات من أزواجهن. وهي من الكناية التي يجيء فيها المتكلم إلى معنى هو «تاليه وردفه في الوجود» عند عبد القاهر الجُرْجانيّ [@dalail، ص66]."
  connection: "ثم يستشهد بامرأته مُلَيْكة: هي تعلم أنه الليث في الهجوم والدفاع."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الياء المفتوحة تليها ألف الإطلاق"
  scansion: "وَظَلْلَ / نِسَاءُلْ حَيْ / يِ حَوْلِ / يَ رُكْكَدَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — يُرَاوِدْ / نَ مِنْنِي مَا / تُرِيدُ / نِسَائِيَا = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]. وتُقرأ «حَوْلِيَ» بفتح الياء."
