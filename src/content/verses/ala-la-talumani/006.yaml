explained: false
first: "وَلَوْ شِئْتُ نَجَّتْنِي مِنَ الخَيْلِ نَهْدَةٌ"
second: "تَرَى خَلْفَهَا الحُوَّ الجِيَادَ تَوَالِيَا"
vocabulary:
  - term: "نَهْدَةٌ"
    text: "فرس «المرتفعة الخلق» [@tabrizi-ikhtiyarat، ج2 ص768]."
  - term: "الحُوَّ"
    text: "جمع أحوى وحوّاء، و«الحوّاء من الخيل: التي تضرب إلى الخضرة» [@tabrizi-ikhtiyarat، ج2 ص769]."
  - term: "تَوَالِيَا"
    text: "«أي: تتلوها، لأن فرسه خفيفة قد تقدّمت الخيل» [@tabrizi-ikhtiyarat، ج2 ص769]."
