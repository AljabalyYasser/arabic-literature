explained: false
first: "أَحَقًّا عِبَادَ اللهِ أَنْ لَسْتُ سَامِعًا"
second: "نَشِيدَ الرِّعَاءِ المُعْزِبِينَ المَتَالِيَا"
vocabulary:
  - term: "نَشِيدَ"
    text: "«والنشيد: رفع الصوت» [@lisan، ج3 ص422]، أي أصوات الرعاة يتنادون."
  - term: "المُعْزِبِينَ"
    text: "الذين يبعدون بإبلهم في المرعى، و«المعزب: المتنحّي» [@tabrizi-ikhtiyarat، ج2 ص771]."
  - term: "المَتَالِيَا"
    text: "الإبل «التي قد نتج بعضها وبقي بعض. الواحدة: متلية» [@tabrizi-ikhtiyarat، ج2 ص771]."
