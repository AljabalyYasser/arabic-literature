first: "فَيَا رَاكِبًا إِمَّا عَرَضْتَ فَبَلِّغَنْ"
second: "نَدَامَايَ مِنْ نَجْرَانَ أَنْ لَا تَلَاقِيَا"
meaning: "يا أيها الراكب، أيًّا كنت، إن أتيت العَروض، أي مكة والمدينة وما حولهما، فبلّغ ندمائي من نَجْران أنه لا لقاء بيننا بعد اليوم."
vocabulary:
  - term: "عَرَضْتَ"
    text: "«وعرض الرجل إذا أتى العروض وهي مكة والمدينة وما حولهما» [@lisan، ج7 ص173]."
  - term: "نَدَامَايَ"
    text: "جمع نديم، و«النديم: الشريب الذي ينادمه» [@lisan، ج12 ص572]، أي صاحبه على الشراب."
  - term: "نَجْرَان"
    text: "بلد باليمن، فيه ندماؤه."
  - term: "تَلَاقِيَا"
    text: "التلاقي، والألف للإطلاق."
context: "بعد نهي اللائمين يتجه إلى من هو أبعد: ندمائه الذين لن يراهم. وهو من شواهد سيبويه في النداء [@sibawayh، ج2 ص200]، ويرويه ابن رَشِيق مع البيت الثامن شاهدًا على من «شعره في رويته وبديهته سواء عند الأمن والخوف» [@ibn-rashiq، ج1 ص193]."
syntax:
  - "«فيا راكبًا»: «يا» حرف نداء، و«راكبًا» منادى منصوب لأنه نكرة غير مقصودة. قال الأعلم فيما ينقله البغدادي: «الشاهد فيه نصب راكب لأنه منادى منكور إذ لم يقصد به راكب بعينه إنما التمس راكبا من الركبان يبلغ قومه خبره وتحيته ولو أراد راكبا بعينه لبناه على الضم ولم يجز له تنوينه ونصبه» [@khizana، ج2 ص194–195]."
  - "وفسّره أبو عُبَيْدة على الندبة: «أراد فيا راكباه للندبة فحذف الهاء» [@lisan، ج7 ص173]. ويعدّ البغدادي هذا من غرائب أبي عُبَيْدة، لأن «الثقات رووه بالنصب والتنوين إلا الأصمعي فإنه كان ينشده بلا تنوين» [@khizana، ج2 ص195]."
  - "«إمّا عرضتَ»: «إنْ» شرطية أُدغمت فيها «ما» الزائدة للتوكيد، و«عرضتَ» فعل الشرط، و«فبلّغَنْ» جوابه، وهو أمر مؤكد بنون التوكيد الخفيفة، والفاء رابطة لأن الجواب طلب."
  - "«ندامايَ» مفعول به أول، والمصدر المؤول من «أنْ لا تلاقيا» في موضع المفعول الثاني. و«أنْ» تحتمل أن تكون مخففة من الثقيلة واسمها ضمير الشأن، وأن تكون مفسِّرة لأن «بلّغ» فيه معنى القول. و«لا» نافية للجنس، و«تلاقيَ» اسمها مبني على الفتح، وخبرها محذوف تقديره: بيننا."
morphology:
  - "«راكب» اسم فاعل من «ركب»."
  - "«ندامى» جمع «نَدْمان» على «فَعالى»، وأضيف إلى ياء المتكلم ففُتحت الياء لأنها بعد ألف."
  - "«تلاقٍ» مصدر «تلاقى» على «تَفاعُل»، وأصله «تلاقُي»، فكُسر ما قبل الياء لتسلم."
rhetoric:
  thesis: "الأسير يرسل نعيه بنفسه، لأن أحدًا من قومه لن يحمله."
  devices:
    - title: "نداء النكرة"
      text: "«فَيَا رَاكِبًا»: نداء لراكب لا يعرفه، أي عابر يمر. فالأسير يوكّل بخبره من يتفق له من المارة، وهذا وحده يقول إنه لا أحد معه."
    - title: "الكناية"
      text: "في «أَنْ لَا تَلَاقِيَا» لم يقل: بلّغهم أني قُتلت، بل قال: لا لقاء، فدلّ على الموت بما يلزمه، وهو انقطاع اللقاء. وهذه الكناية عند عبد القاهر الجُرْجانيّ: أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "اختيار الندامى"
      text: "«نَدَامَايَ»: لم يخص بالنعي أهله ولا قومه، وسيلومهم في البيت الخامس، بل خصّ رفاق الشراب. فالحياة التي يودّعها حياة اللذة والصحبة، وإليها يعود في آخر القصيدة حين يذكر الزِّقّ والأيسار."
  connection: "ثم يسمّي الندامى في البيت الرابع: أبا كَرِب، والأيهمين، وقيسًا بأعلى حضرموت."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الياء المفتوحة تليها ألف الإطلاق"
  scansion: "فَيَا رَا / كِبَنْ إِمْمَا / عَرَضْتَ / فَبَلْلِغَنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — نَدَامَا / يَ مِنْ نَجْرَا / نَ أَنْ لَا / تَلَاقِيَا = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر فصارت «فعولُ» [@atiq، ص29]، والعَرُوض والضَّرْب مقبوضتان «مفاعلن» كسائر القصيدة."
