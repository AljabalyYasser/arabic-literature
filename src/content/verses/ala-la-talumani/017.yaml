    text: "حاذقًا، و«رجل لبق ويقال لبيق، وهو الحاذق الرفيق بكل عمل» [@lisan، ج10 ص326]."
  - term: "بَنَانِيَا"
    text: "«البنان: الأصابع: وقيل: أطرافها» [@lisan، ج13 ص59]."
