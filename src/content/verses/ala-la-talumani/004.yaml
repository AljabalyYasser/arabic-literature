first: "أَبَا كَرِبٍ وَالأَيْهَمَيْنِ كِلَيْهِمَا"
second: "وَقَيْسًا بِأَعْلَى حَضْرَمَوْتَ اليَمَانِيَا"
vocabulary:
  - term: "أَبَا كَرِبٍ وَالأَيْهَمَيْنِ"
    text: "من ندمائه. يسميهم محققا «المفضليات» نقلًا عن ابن الأثير: أبو كَرِب بِشْر بن عَلْقَمة بن الحارِث، والأيهمان الأسود بن عَلْقَمة والعاقب عبد المسيح بن الأبيض [@mufaddaliyyat، ص157، الحاشية]."
  - term: "وَقَيْسًا"
    text: "«ابن معد يكرب، أبو الأشعث بن قيس الكندي» [@tabrizi-ikhtiyarat، ج2 ص768]."
