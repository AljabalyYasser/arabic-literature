first: "وَقَدْ كُنْتُ نَحَّارَ الجَزُورِ وَمُعْمِلَ الْـ"
second: "ـمَطِيِّ وَأَمْضِي حَيْثُ لَا حَيَّ مَاضِيَا"
vocabulary:
  - term: "الجَزُورِ"
    text: "«الناقة المجزورة» [@lisan، ج4 ص134]، أي المنحورة."
  - term: "وَمُعْمِلَ المَطِيِّ"
    text: "الذي يحثّها في السير، ومنه الحديث: «لا تعمل المطي إلا إلى ثلاثة مساجد أي لا تحث ولا تساق» [@lisan، ج11 ص477]."
