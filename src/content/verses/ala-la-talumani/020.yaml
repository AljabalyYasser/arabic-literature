explained: false
first: "وَلَمْ أَسْبَإِ الزِّقَّ الرَّوِيَّ وَلَمْ أَقُلْ"
second: "لِأَيْسَارِ صِدْقٍ أَعْظِمُوا ضَوْءَ نَارِيَا"
vocabulary:
  - term: "أَسْبَإِ"
    text: "أشترِ الخمر، و«سبأ الخمر ... شراها. وفي الصحاح: اشتراها ليشربها» [@lisan، ج1 ص93]."
  - term: "الزِّقَّ"
    text: "«والزق من الأهب: كل وعاء اتخذ لشراب ونحوه» [@lisan، ج10 ص143]، والأُهُب: الجلود."
  - term: "الرَّوِيَّ"
    text: "يقول محققا «المفضليات»: «أراد به الممتلئ» [@mufaddaliyyat، ص158، الحاشية]."
  - term: "لِأَيْسَارِ"
    text: "«والأيسار جمع ياسر وهو الجازر والذي يلي قسمة جزور الميسر» [@khizana، ج1 ص329]."
