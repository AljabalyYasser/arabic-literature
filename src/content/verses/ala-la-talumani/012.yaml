first: "وَتَضْحَكُ مِنِّي شَيْخَةٌ عَبْشَمِيَّةٌ"
second: "كَأَنْ لَمْ تَرَى قَبْلِي أَسِيرًا يَمَانِيَا"
meaning: "وتضحك مني عجوز من بني عبد شمس، كأنها لم ترَ قبلي أسيرًا من اليمن."
vocabulary:
  - term: "شَيْخَةٌ"
    text: "امرأة مسنّة."
  - term: "عَبْشَمِيَّةٌ"
    text: "منسوبة إلى عبد شمس، وفي اللسان: «وعبشمي إذا نسبت إلى عبد شمس» [@lisan، ج6 ص115]، وهم بنو عبد شمس بن سعد من تميم."
  - term: "يَمَانِيَا"
    text: "من أهل اليمن."
context: "هي أم الفتى العبشمي الذي أسره، ضحكت منه حين قال لها: «أنا سيد القوم»، فقالت: «قبحك الله سيد قوم حين أسرك هذا» [@naqaid، ج1 ص324]. ويستشهد صاحب اللسان بهذا البيت على أنه «لم يقتل في المعركة، وإنما قتل بعد الأسر» [@lisan، ج3 ص517]."
syntax:
  - "«وتضحكُ» مضارع مرفوع، و«مني» متعلق به، و«شيخةٌ» فاعل، و«عبشميةٌ» صفة."
  - "«كأنْ» مخففة من «كأنّ»، واسمها ضمير الشأن محذوف، وجملة «لم ترى قبلي أسيرًا» خبرها. و«قبلي» ظرف متعلق بـ«ترى»، و«أسيرًا» مفعول به، و«يمانيًا» صفته."
  - "«لم ترى»: القياس «لم ترَ» بحذف الألف للجزم. وينقل محقق التِّبْرِيزِيّ عن شرح ابن الأَنْبارِيّ أنها رواية الكوفيين، وأن الأخفش قال: «رواية أهل الكوفة: كأن لم ترى، بالألف. وهذا عندنا خطأ. والصواب: تري، بحذف النون علامة للجزم» [@tabrizi-ikhtiyarat، ج2 ص771، الحاشية]، أي «تَرَيْ» على خطاب المرأة. ويحمله أبو علي الفارسي على أن أصله «لم ترأ» بالهمز، ثم أُبدلت الهمزة الساكنة ألفًا، «فالألف على هذا التقدير بدل من الهمزة التي هي عين الفعل، واللام محذوفة للجزم»، أو أنه «أثبت الألف في موضع الجزم تشبيها بالياء» [@lisan، ج5 ص75]."
morphology:
  - "«عبشمية» نسبة منحوتة من «عبد شمس»، قال صاحب اللسان: «وإن شئت أخذت من الأول حرفين ومن الثاني حرفين فرددت الاسم إلى الرباعي ثم نسبت إليه» [@lisan، ج6 ص115]. وهذا هو النحت."
  - "«يمانٍ» نسبة إلى اليمن، عُوّضت فيه الألف من إحدى ياءي النسب، فيقال: يمانٍ، ويمانيّ بالتشديد."
rhetoric:
  thesis: "ذروة الإذلال في القصيدة: لا القتل، بل ضحكة عجوز."
  devices:
    - title: "التشبيه بـ«كأنْ»"
      text: "«كَأَنْ لَمْ تَرَى قَبْلِي أَسِيرًا»: يجعل ضحكها ضحك من يرى شيئًا لم يره قط، والأسرى كثير في أيام العرب. فالتشبيه يردّ السخرية عليها: إنها تضحك مما لا يُضحك منه، لأن الأسر يصيب السادة."
    - title: "الوصف بالنسب"
      text: "«شَيْخَةٌ عَبْشَمِيَّةٌ» و«أَسِيرًا يَمَانِيَا»: وصف كلًّا منهما بنسبه، فالمشهد قبيلة تضحك من قبيلة، لا امرأة من رجل. و«يمانيا» في آخر البيت تذكّر بقومه البعيدين."
  connection: "ثم يذكر نساء الحي الواقفات حوله، ويستشهد بامرأته مُلَيْكة على شجاعته."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الياء المفتوحة تليها ألف الإطلاق"
  scansion: "وَتَضْحَ / كُ مِنْنِي شَيْ / خَتُنْ عَبْ / شَمِيْيَتُنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — كَأَنْ لَمْ / تَرَى قَبْلِي / أَسِيرَنْ / يَمَانِيَا = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الأولى من الصدر [@atiq، ص29]. والألف في «ترى» يحتاجها الوزن: «تَرَى قَبْلِي» مفاعيلن، ولو حُذفت للجزم لنقص الوزن."
