first: إِذْ هِيَ أَقْسَاطٌ كَرِجْلِ الدَّبَى
second: أَوْ كَقَطَا كَاظِمَةَ النَّاهِلِ
vocabulary:
- term: أَقْسَاطٌ
  text: 'قِطَع، كما فسّره شارح القاموس فيما نقله محقّقو اللسان؛ وأورده ابن منظور في القَسَط، وهو يُبس في الرِّجلين، وقال: «يصف الخيل» [@lisan، ج7 ص378–379].'
- term: رِجْلِ الدَّبَى
  text: القطعة العظيمة من صغار الجراد.
- term: كَاظِمَةَ
  text: موضع، وهو «جوّ على سِيف البحر من البصرة على مرحلتين» [@lisan، ج12 ص521].
- term: النَّاهِلِ
  text: الوارد الماء.
