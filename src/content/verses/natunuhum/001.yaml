first: نَطْعُنُهُمْ سُلْكَى وَمَخْلُوجَةً
second: لَفْتَكَ لَأْمَيْنِ عَلَى نَابِلِ
vocabulary:
- term: سُلْكَى
  text: «الطعنة المستقيمة» [@lisan، ج2 ص259].
- term: مَخْلُوجَةً
  text: الطعنة «على اليمين وعلى اليسار» [@lisan، ج2 ص259].
- term: لَفْتَكَ لَأْمَيْنِ
  text: 'ليُّك سهمين وردُّك إياهما، والسهم اللَّأْم: «عليه ريش لُؤام»، أي ريش يلائم بعضه بعضًا [@lisan، ج12 ص531].'
- term: نَابِلِ
  text: صاحب النَّبل الرامي بها.
