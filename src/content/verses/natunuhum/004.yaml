first: فَالْيَوْمَ أَشْرَبْ غَيْرَ مُسْتَحْقِبٍ
second: إِثْمًا مِنَ اللَّهِ وَلَا وَاغِلِ
vocabulary:
- term: مُسْتَحْقِبٍ
  text: 'مُحتمِل، من استحقب الشيء: حمله في حقيبته.'
- term: وَاغِلِ
  text: «الذي يدخل على القوم في طعامهم وشرابهم من غير أن يدعوه إليه» [@lisan، ج11 ص732].
