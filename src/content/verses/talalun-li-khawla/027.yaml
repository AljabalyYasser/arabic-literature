first: "قَرَبًا يَشُجُّ بِهَا الْخُرُوقَ عَشِيَّةً"
second: "رَبِذٌ كَمِقْلَاةِ الْوَلِيدِ شَتِيمُ"
vocabulary:
  - term: "قَرَبًا"
    text: "«القرب للابل: طلب الماء من ليلتها فتصبحه» [@diwan-labid، ص129]."
  - term: "يَشُجُّ بِهَا"
    text: "«يركب بها» [@diwan-labid، ص128]."
  - term: "الْخُرُوقَ"
    text: "«الخرق: البعيد من الأرض» [@diwan-labid، ص128]."
  - term: "رَبِذٌ"
    text: "«سريع» [@diwan-labid، ص129]."
  - term: "مِقْلَاةِ الْوَلِيدِ"
    text: "«خشبة يلعب بها الصبيان» [@diwan-labid، ص129]."
  - term: "شَتِيمُ"
    text: "«قبيح الوجه» [@diwan-labid، ص129]."
