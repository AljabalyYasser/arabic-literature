first: "وَكَتِيبَةُ الْأَحْلَافِ قَدْ لَاقَيْتُهُمْ"
second: "حَيْثُ اسْتَفَاضَ دَكَادِكٌ وَقَصِيمُ"
vocabulary:
  - term: "الْأَحْلَافِ"
    text: "«أسد وغطفان وبعض طىء وبعض نبهان، وضبة وعكل» [@diwan-labid، ص135]."
  - term: "اسْتَفَاضَ"
    text: "«اتسع» [@diwan-labid، ص135]."
  - term: "دَكَادِكٌ"
    text: "«رمل متواضعة ليست مرتفعة» [@diwan-labid، ص135]."
  - term: "قَصِيمُ"
    text: "«رمل خفيف، وهو منبت الغضا» [@diwan-labid، ص135]."
