    text: "«الكتائب، واحدها مقنب» [@diwan-labid، ص137]."
  - term: "الثَّغْرِ"
    text: "«موضع المخافة» [@diwan-labid، ص137]."
  - term: "مِنْسَرٌ"
    text: "«المنسر بكسر الميم وفتح السين: الجيش قدر أربعين رجلا أو خمسين» [@diwan-labid، ص137]."
  - term: "عَظِيمُ"
    text: "«كبير رئيس» [@diwan-labid، ص137]."
