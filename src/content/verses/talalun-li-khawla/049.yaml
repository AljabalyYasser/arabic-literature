explained: false
first: "فَارْتَثَّ كَلْمَاهُمْ عَشِيَّةَ هَزْمِهِمْ"
second: "حَيٌّ بِمُنْعَرَجِ الْمَسِيلِ مُقِيمُ"
vocabulary:
  - term: "ارْتَثَّ"
    text: "«حمل»، ويقال: «ارتث: حمل إلى أهله وبه رمق» [@diwan-labid، ص136]."
  - term: "كَلْمَاهُمْ"
    text: "«مجرحيهم» [@diwan-labid، ص136]."
  - term: "حَيٌّ"
    text: "قال ابن الأَعْرابِيّ في شرح الطوسي: «أراد الضباع، جعلهم حيا» [@diwan-labid، ص136]."
  - term: "مُنْعَرَجِ"
    text: "«منعطف» [@diwan-labid، ص136]."
