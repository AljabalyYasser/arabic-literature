    text: "«صهب: سحابات. دواجن: مقيمات فى ذلك الموضع» [@diwan-labid، ص131]."
  - term: "صَوْبُهُنَّ مُدِيمُ"
    text: "«أى مطرهن مديم» [@diwan-labid، ص131]، أي دائم."
