first: "فَبِتِلْكَ أَقْضِي الْهَمَّ إِنَّ خِلَاجَهُ"
second: "سَقَمٌ وَإِنِّي لِلْخِلَاجِ صَرُومُ"
vocabulary:
  - term: "خِلَاجَهُ"
    text: "«ما ينازعه من الشك فى الآراء» [@diwan-labid، ص131]."
  - term: "صَرُومُ"
    text: "«قاطع»، «وصروم معتاد لذلك» [@diwan-labid، ص131]. يقول: «فإذا خالجنى الأمر صرمته أى قطعته بعزمة» [@diwan-labid، ص131]."
