first: "مِنَّا حُمَاةُ الشِّعْبِ يَوْمَ تَوَاكَلَتْ"
second: "أَسَدٌ وَذُبْيَانُ الصَّفَا وَتَمِيمُ"
meaning: "منّا، نحن بني عامر، كان الذين حموا شِعب جَبَلة يوم تخاذلت أسد وذبيان وتميم واتّكل بعضها على بعض فضعفت."
vocabulary:
  - term: "حُمَاةُ"
    text: "جمع حامٍ، وهو الذي يحمي الموضع ويدفع عنه."
  - term: "الشِّعْبِ"
    text: "«شعب جبلة، وجبلة أكمة» في شرح الطُّوسِيّ [@diwan-labid، ص135]، والشِّعب الطريق في الجبل."
  - term: "تَوَاكَلَتْ"
    text: "«تخاذلت وضعفت» [@diwan-labid، ص135]، وأصله أن يتكل بعضهم على بعض: «وتواكل القوم مواكلة ووكالا: اتكل بعضهم على بعض» [@lisan، ج11 ص735]."
  - term: "ذُبْيَانُ الصَّفَا"
    text: "في شرح الطُّوسِيّ قولان: «الصفا ها هنا من المودة»، و«الصفا: موضع صفا بجبلة» [@diwan-labid، ص135]."
context: "من الأبيات التي يعدّ فيها لَبِيد أيام قومه في آخر القصيدة، بعد يوم النُّخَيْل في البيت 47، وقبل صفة المنهزمين في البيت 49. ويوم شِعب جَبَلة من أعظم أيام بني عامر: جمع لهم لَقِيط بن زُرارة ذُبْيان وتميمًا وأسدًا وملوكًا من العرب [@iqd، ج6 ص10]، قال أبو عُبَيْدة: «فجمعوا جمعا لم يكن في الجاهلية قط مثله أكثر كثرة، فلم تشك العرب في هلاك بني عامر» [@aghani-dk، ج11 ص134]. فالقبائل الثلاث في عجز البيت هي حلفاء لَقِيط أنفسهم. وشهد لَبِيد اليوم صبيًّا، «وهو ابن تسع سنين، ويقال: كان ابن بضع عشرة سنة» [@aghani-dk، ج11 ص149]."
syntax:
  - "«مِنَّا» جار ومجرور متعلق بمحذوف خبر مقدم، و«حُمَاةُ» مبتدأ مؤخر، و«الشِّعْبِ» مضاف إليه."
  - "«يَوْمَ» ظرف زمان متعلق بـ«حماة»، لأن فيه معنى الفعل، وهو مضاف إلى الجملة بعده."
  - "«تَوَاكَلَتْ أَسَدٌ وَذُبْيَانُ الصَّفَا وَتَمِيمُ» فعل وفاعل وما عُطف عليه، والجملة في محل جر بإضافة «يوم» إليها. وأُنّث الفعل لأن الفاعل قبيلة."
morphology:
  - "«حُمَاة» جمع «حامٍ» على «فُعَلة»، وأصله «حُمَيَة» قُلبت الياء ألفًا لتحركها وانفتاح ما قبلها."
  - "«تَوَاكَلَتْ» على «تفاعلت»، وهو بناء المشاركة: كل واحد يكل الأمر إلى صاحبه."
  - "«ذُبْيان» ممنوع من الصرف للعلمية وزيادة الألف والنون، ورُفع بالضمة بلا تنوين، و«أسدٌ» و«تميمُ» مصروفان، وجاء «تميمُ» في القافية بلا تنوين للوقف."
rhetoric:
  thesis: "فخر بيوم واحد: بنو عامر وحدهم في مقابل ثلاث قبائل خذل بعضها بعضًا."
  devices:
    - title: "تقديم «منّا»"
      text: "قدّم الخبر «مِنَّا» على المبتدأ، فصار المعنى: منّا لا من غيرنا كان حماة الشِّعب. يقول عبد القاهر في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]. والأهم عند الشاعر الفاخر قومه، فبدأ بهم."
    - title: "المقابلة في «حماة» و«تواكلت»"
      text: "في الصدر قوم يحمون، وفي العجز قبائل تتّكل كل واحدة منها على الأخرى. فالكثرة التي في العجز، ثلاث قبائل، تنقلب ضعفًا بالتواكل، والقلة في الصدر تنقلب قوة بالحماية. وهذه قراءتنا."
    - title: "التعداد في العجز"
      text: "سمّى القبائل الثلاث واحدة واحدة: «أَسَدٌ وَذُبْيَانُ الصَّفَا وَتَمِيمُ». والتسمية أبلغ في الفخر من أن يقول «تواكل أعداؤنا»، لأنها تُري السامع حجم الجمع الذي غلبه قومه."
  connection: "ثم يصف المنهزمين: «فارتثّ كلماهم عشية هزمهم / حيٌّ بمنعرج المسيل مقيم»، أي حملت الضباع جرحاهم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المضمومة، يتبعها وصل بالواو"
  scansion: "مِنْنَا حُمَا / تُشْشِعْبِ يَوْ / مَ تَوَاكَلَتْ = متْفاعلن / متْفاعلن / متَفاعلن — أَسَدُنْ وَذُبْ / يَانُصْصَفَا / وَتَمِيمُو = متَفاعلن / متْفاعلن / متَفاعلْ"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأوليين من الصدر والثانية من العجز فصارت «متْفاعلن». والضرب مقطوع «متفاعلْ» كسائر القصيدة."
variants:
  - reading: "مِنَّا حُمَاةُ الشِّعْبِ يَوْمَ تَوَاعَدَتْ"
    status: "رواية أبي عُبَيْدة في شرح الطُّوسِيّ"
    note: "«وروى أبو عبيدة: تواعدت» [@diwan-labid، ص135]، أي تواعدت القبائل على القتال، فيكون العجز ذكرًا لجمعهم لا لتخاذلهم."
