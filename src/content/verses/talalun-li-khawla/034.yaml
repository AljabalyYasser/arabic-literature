explained: false
first: "طَعِنٌ إِذَا خِفْتُ الْهَوَانَ بِبَلْدَةٍ"
second: "وَأَخُو الْمَضَاعِفِ لَا يَكَادُ يَرِيمُ"
vocabulary:
  - term: "طَعِنٌ"
    text: "ماضٍ في الأرض؛ «وطعن في المفازة ونحوها يطعن: مضى فيها وأمعن» [@lisan، ج13 ص266]. وفي نسخة عند الطوسي: «ظعن» [@diwan-labid، ص131]."
  - term: "الْمَضَاعِفِ"
    text: "«المضاعف: الضعف» [@diwan-labid، ص131]."
  - term: "يَرِيمُ"
    text: "«يبرح» [@diwan-labid، ص131]."
