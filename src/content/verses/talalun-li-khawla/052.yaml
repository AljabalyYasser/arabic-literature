explained: false
first: "لَا يَجْتَوِيهَا ضَيْفُهُمْ وَفَقِيرُهُمْ"
second: "وَمُدَفَّعٌ طَرَقَ النُّبُوحَ يَتِيمُ"
vocabulary:
  - term: "يَجْتَوِيهَا"
    text: "«يكرهها» [@diwan-labid، ص137]."
  - term: "مُدَفَّعٌ"
    text: "«رجل يدفع من موضع إلى موضع، لا ينزل»، «لا يضيفه أحد لشدة حال الناس» [@diwan-labid، ص137]."
  - term: "النُّبُوحَ"
    text: "«الأحياء»، وقال الأصمعي: «هى ضجة الناس والحى وأصواتهم» [@diwan-labid، ص137]."
