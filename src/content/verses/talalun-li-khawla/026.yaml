    text: "«أى عجل الرواح إلى الماء» [@diwan-labid، ص128]."
  - term: "هَاجَهُ"
    text: "«حركه» [@diwan-labid، ص128]."
  - term: "الْمُعَقِّبِ"
    text: "«صاحب المال. طلب حقه مرة بعد مرة» [@diwan-labid، ص128]، أي هاجه إلى الماء طلبٌ ملحّ كطلب المظلوم حقه."
