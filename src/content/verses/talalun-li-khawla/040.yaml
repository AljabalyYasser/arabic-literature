explained: false
first: "مِنْهَا حُوَيٌّ وَالذُّهَابُ وَقَبْلَهُ"
second: "يَوْمٌ بِبُرْقَةِ رَحْرَحَانَ كَرِيمُ"
vocabulary:
  - term: "حُوَيٌّ وَالذُّهَابُ"
    text: "«حوى والذهاب يومان، كانت لهم فيه وقعة»، والذهاب «غائط من أرض بنى الحارث بن كعب أغار عليها فيه عامر بن الطفيل» [@diwan-labid، ص133]."
  - term: "بُرْقَةِ رَحْرَحَانَ"
    text: "«رحرحان: موضع وقعة» [@diwan-labid، ص133]، وفيه في شرح الطوسي يومان، قُتل في الأول يثربي بن عدس [@diwan-labid، ص133]."
