first: "زُجَلٌ وَرُفِّعَ فِي ظِلَالِ حُدُوجِهَا"
second: "بِيضُ الْخُدُودِ حَدِيثُهُنَّ رَخِيمُ"
vocabulary:
  - term: "زُجَلٌ"
    text: "«فرق» [@diwan-labid، ص121]، أي جماعات."
  - term: "حُدُوجِهَا"
    text: "هوادجها؛ قال الأزهري: «الحِدْجُ، بِكَسْرِ الْحَاءِ، مَرْكَبٌ مِنْ مَرَاكِبِ النِّسَاءِ نَحْوُ الْهَوْدَجِ والمِحَفَّة» [@lisan، ج2 ص230]."
  - term: "رَخِيمُ"
    text: "«لين فى أنس» [@diwan-labid، ص121]."
