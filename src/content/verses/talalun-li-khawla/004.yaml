first: "دِمَنٌ تَلَاعَبَتِ الرِّيَاحُ بِرَسْمِهَا"
second: "حَتَّى تَنَكَّرَ نُؤْيُهَا الْمَهْدُومُ"
vocabulary:
  - term: "دِمَنٌ"
    text: "«واحدها دمنة، والدمنة ما أثر فى الدار من مصب لبن وأثر رماد وبعر» [@diwan-labid، ص119]."
  - term: "تَنَكَّرَ"
    text: "«درس» [@diwan-labid، ص119]."
  - term: "نُؤْيُهَا"
    text: "«والنؤى: حفر يحفر حول البيت، ليرد ماء المطر» [@diwan-labid، ص119]."
