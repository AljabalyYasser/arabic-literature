first: "بِكَتَائِبٍ تَرْدِي تَعَوَّدَ كَبْشُهَا"
second: "نَطْحَ الْكِبَاشِ كَأَنَّهُنَّ نُجُومُ"
vocabulary:
  - term: "تَرْدِي"
    text: "«تمشى وتعدو، والرديان: ضرب من العدو» [@diwan-labid، ص134]."
  - term: "كَبْشُهَا"
    text: "«رئيسها» [@diwan-labid، ص134]."
  - term: "نَطْحَ الْكِبَاشِ"
    text: "«أى مقاتلة الرؤساء» [@diwan-labid، ص134]."
  - term: "كَأَنَّهُنَّ نُجُومُ"
    text: "«من بريق الحديد» [@diwan-labid، ص134]."
