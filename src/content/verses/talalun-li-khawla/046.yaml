    text: "«يوم لهم»، و«الحومان: اسم أرض» [@diwan-labid، ص135]."
  - term: "قَيْسٌ"
    text: "«قيس بن مكشوح المرادى قال أبو عبيدة: ويقال قيس بن سلمة الكندى، أسرته بنو عامر يوم رحرحان» [@diwan-labid، ص135]."
