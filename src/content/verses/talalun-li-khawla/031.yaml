explained: false
first: "غَلَلًا تَضَمَّنَهُ ظِلَالُ يَرَاعَةٍ"
second: "غَرْقَى ضَفَادِعُهُ لَهُنَّ نَئِيمُ"
vocabulary:
  - term: "غَلَلًا"
    text: "ماء يجري بين الشجر؛ «والغَلَلُ: الماءُ الذي يتغلَّل بين الشجر» [@lisan، ج11 ص502]."
  - term: "يَرَاعَةٍ"
    text: "«واليَراعُ: القصب، واحدته يراعة» [@lisan، ج8 ص413]."
  - term: "نَئِيمُ"
    text: "صوت ضعيف؛ «وهو من النئيم الصوت الضعيف» [@lisan، ج12 ص567]."
