first: "وَصَدْرٍ أَرَاحَ اللَّيْلُ عَازِبَ هَمِّهِ"
second: "تَضَاعَفَ فِيهِ الْحُزْنُ مِنْ كُلِّ جَانِبِ"
meaning: "وصدرٍ ردّ عليه الليلُ همَّه الذي كان بعيدًا عنه بالنهار، فتضاعف فيه الحزن من كل ناحية. قال الأَعْلَم: «أي كان همُّه عازبًا بالنهار؛ لأنه يتعلّل نهارَه بالنظر والشُّغل، فيقلّ همُّه، فإذا أمسى انفرد بحاله، ولم ير شيئًا يتعلّل به، فيردّ الليلُ عليه همّه، كما يريح العازبُ ماشيته إلى أهله» [@diwan-nabigha، ص41]. ويتعلّل: يتلهّى ويتشاغل."
vocabulary:
  - term: "وَصَدْرٍ"
    text: "يريد صدره هو، وما فيه من همّ."
  - term: "أَرَاحَ"
    text: "ردّ الماشية إلى أهلها عشيًّا، «فإذا رجع بماشيته قيل: قد أراح» [@diwan-nabigha، ص41]."
  - term: "عَازِبَ هَمِّهِ"
    text: "همّه الذي كان بعيدًا عنه. «والعازب: الذي يبيت في المرعى [بعيدًا] عن أهله» [@diwan-nabigha، ص41]."
  - term: "تَضَاعَفَ"
    text: "«أي تكرّر وصار ضِعفًا فوق ضِعف» [@diwan-nabigha، ص41]."
context: "يختم به صورة الليل والهمّ قبل أن يخرج في البيت 4 إلى عَمْرو ونعمته. وقد جعل بعضهم الأبيات الثلاثة الأولى من هذه القصيدة في مقابل أبيات الليل في معلقة امرئ القَيْس، ومنها [«وَلَيْلٍ كَمَوْجِ الْبَحْرِ أَرْخَى سُدُولَهُ»](/texts/qifa-nabki/44/) [@khizana، ج3 ص271]. ينقل البَغْداديّ عن الباقِلّانيّ في كتابه «إعجاز القرآن» أن أبيات امرئ القَيْس في الليل من محاسن معلقته، وأن بعضهم كان «يعارضها بقول النابغة»، ثم ينشد هذا البيت والبيتين قبله، ويقول: «وقد جرى ذلك بين يدي بعض الخلفاء فقدّمت أبيات امرئ القيس واستحسن استعارتها» [@khizana، ج3 ص272]. فالموازنة قديمة، والحكم فيها لامرئ القَيْس."
syntax:
  - "«وَصَدْرٍ» مجرور، والأقرب أنه معطوف على «ليلٍ» في البيت الأول، فهو مما يقاسيه الشاعر مع الليل. ويجوز أن تكون الواو واو «رُبَّ»."
  - "«أَرَاحَ اللَّيْلُ عَازِبَ هَمِّهِ» جملة في موضع جر صفة لـ«صدر»: «الليلُ» فاعل، و«عازبَ» مفعول به، وهو مضاف إلى «همّه»، من إضافة الصفة إلى موصوفها، أي همّه العازب."
  - "«تَضَاعَفَ فِيهِ الْحُزْنُ» جملة صفة ثانية لـ«صدر»، و«الحزنُ» فاعل، و«مِنْ كُلِّ جَانِبِ» متعلق بـ«تضاعف»."
morphology:
  - "«أَرَاحَ» على «أَفْعَلَ» من «راحَ يروحُ» الأجوف الواوي، ومعناه ردّ الماشية إلى مُراحها، وهو مأواها بالليل."
  - "«عَازِب» اسم فاعل من «عَزَبَ» إذا بعُد، ويقال للراعي إذا بات بعيدًا عن أهله: «قد عَزَب» كما يقول الأَعْلَم [@diwan-nabigha، ص41]."
  - "«تَضَاعَفَ» على «تَفاعَلَ» من الضِّعف، وهو المِثْل، ومعناه هنا التكاثر شيئًا بعد شيء."
rhetoric:
  thesis: "صورة من حياة الرعاة: الراعي العازب يبيت بإبله بعيدًا ثم يريحها إلى أهلها عشيًّا. والنابغة يجعل الهمّ إبلًا ترعى بعيدًا عنه نهارًا، ثم يسوقها الليل إليه فتنزل في صدره."
  devices:
    - title: "الاستعارة في «أَرَاحَ اللَّيْلُ عَازِبَ هَمِّهِ»"
      text: "جعل الليل راعيًا يريح، والهمّ إبلًا عازبة، والصدر مُراحها. وقد شرحه الأَعْلَم بالصورة نفسها: «كما يريح العازبُ ماشيته إلى أهله» [@diwan-nabigha، ص41]. وجعله عبد القاهر الجُرْجانيّ مثالًا للاستعارة التي يصل معناها إلى السامع بلا كلفة، حين يدلّ المعنى الأول على الثاني «أبْيَنَ إِشارةٍ، حتى يخيَّلَ إِليكَ أنَّك فهِمْتَه من حاقِّ اللفظِ»، ثم أنشد هذا البيت مثالًا للاستعارة [@dalail، ص268]. وحاقّ اللفظ: نفسه وظاهره."
    - title: "المبالغة في «مِنْ كُلِّ جَانِبِ»"
      text: "لم يكفه أن يتضاعف الحزن، بل جعله يأتي من كل ناحية من الصدر، كما تملأ الإبل الراجعة مُراحها. واستشهد الأَعْلَم لاشتداد الحزن بالليل بقول الراجز: «كَذَاتِ أَحْزَانٍ أَرَاحَتْ فَقْدَا / يُهَيِّجُ اللَّيْلُ عَلَيْهَا وَجْدَا» [@diwan-nabigha، ص41]."
  connection: "ثم يترك الليل ويذكر سببًا آخر لكلامه: نعمة عَمْرو ونعمة أبيه عليه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "وَصَدْرِنْ / أَرَاحَلْ لَيْ / لُ عَازِ / بَ هَمْمِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — تَضَاعَ / فَ فِيهِلْ حُزْ / نُ مِنْ كُلْ / لِ جَانِبِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر، والأولى في العجز [@atiq، ص29]. وتُشبَع كسرة الهاء في «هَمِّهِ»."
