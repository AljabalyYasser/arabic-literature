explained: false
first: "لَهُمْ شِيمَةٌ لَمْ يُعْطِهَا اللَّهُ غَيْرَهُمْ"
second: "مِنَ الْجُودِ وَالْأَحْلَامُ غَيْرُ عَوَازِبِ"
vocabulary:
  - term: "شِيمَةٌ"
    text: "«أي طبيعة وخُلُق» [@diwan-nabigha، ص46]."
  - term: "وَالْأَحْلَامُ غَيْرُ عَوَازِبِ"
    text: "«أي عقولهم حاضرة غير بعيدة عنهم»، «والمعنى أنهم يجودون وأحلامهم لم يُذهبها سُكرٌ» [@diwan-nabigha، ص46]."
