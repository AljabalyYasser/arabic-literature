explained: false
first: "تَقُدُّ السَّلُوقِيَّ الْمُضَاعَفَ نَسْجُهُ"
second: "وَتُوقِدُ بِالصُّفَّاحِ نَارَ الْحُبَاحِبِ"
vocabulary:
  - term: "تَقُدُّ"
    text: "تقطع."
  - term: "السَّلُوقِيَّ"
    text: "«دروع منسوبة إلى مكان تُنسب إليه الدروع والكلاب» [@diwan-nabigha، ص46]."
  - term: "الْمُضَاعَفَ نَسْجُهُ"
    text: "«المضاعَف: الذي نُسج حلْقتين حلْقتين، وإنما خصّه؛ لأنه أشدّ على السيوف» [@diwan-nabigha، ص46]."
  - term: "بِالصُّفَّاحِ"
    text: "«حجارة عِراض» [@diwan-nabigha، ص46]."
  - term: "نَارَ الْحُبَاحِبِ"
    text: "«والحُباحب: دُوَيبّة تضيء بالليل كالنار، فضربها مثلًا لما ينقدح من الحجارة، إذا قرعتها السيوف» [@diwan-nabigha، ص46]."
sources:
