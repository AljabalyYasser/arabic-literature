explained: false
first: "عَلَى عَارِفَاتٍ لِلطِّعَانِ عَوَابِسٍ"
second: "بِهِنَّ كُلُومٌ بَيْنَ دَامٍ وَجَالِبِ"
vocabulary:
  - term: "عَارِفَاتٍ"
    text: "«أي صابرات، واحدتها عارفة» [@diwan-nabigha، ص43]، يعني الخيل."
  - term: "عَوَابِسٍ"
    text: "«وصفها بالعبوس في الحرب؛ لكثرة ما تردّدت فيها» [@diwan-nabigha، ص44]."
  - term: "كُلُومٌ"
    text: "«الجراحات، واحدها كَلْم» [@diwan-nabigha، ص44]."
  - term: "بَيْنَ دَامٍ وَجَالِبِ"
    text: "بين جرح يسيل دمه وجرح بدأ يبرأ، «والجالب: اليابس الذي قد علته جُلبة البُرْء» [@diwan-nabigha، ص44]."
