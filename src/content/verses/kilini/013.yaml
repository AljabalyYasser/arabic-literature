first: "جَوَانِحَ قَدْ أَيْقَنَّ أَنَّ قَبِيلَهُ"
second: "إِذَا مَا الْتَقَى الْجَمْعَانِ أَوَّلُ غَالِبِ"
meaning: "تميل هذه الطير لتقع على القتلى، وقد أيقنت أن قوم الممدوح أول من يغلب إذا التقى الجيشان. قال الأَعْلَم في «جوانح»: «أي مائلات للوقوع على القتلى في المعركة»، وقال في البيت كله: «لما ذكر أن الطير مرتقبة للقتلى في الأبيات التي قبل هذا، لم يكن في لفظ الأبيات دليل على أن القتلى التي تقع عليها الطير من أعدائهم، بل يقتضي اللفظ أن تكون القتلى منهم، أو من عدوّهم، فتبيّن في هذا البيت مراده، وأخرج اللفظ من الاشتراك» [@diwan-nabigha، ص43]."
vocabulary:
  - term: "جَوَانِحَ"
    text: "«أي مائلات للوقوع على القتلى في المعركة» [@diwan-nabigha، ص43]."
  - term: "أَيْقَنَّ"
    text: "علمن علمًا لا شك معه."
  - term: "قَبِيلَهُ"
    text: "قومه وجماعته، «والقبيل: الجماعة من الناس يكونون من الثلاثة فصاعدا من قوم شتى»، «وربما كان القبيل من أب واحد كالقبيلة» [@lisan، ج11 ص541]."
  - term: "الْجَمْعَانِ"
    text: "الجيشان."
context: "يتمّ صورة الطير التي بدأها في البيت 10، ويكشف سبب تحليقها: هي واثقة بأن الغلبة لقوم الممدوح. وهذا الموضع هو الذي أخذه عليه ابن قُتَيْبة: «جعل الطير تعلم الغالب من المغلوب قبل التقاء الجمعين» [@ibn-qutayba، ج1 ص167]. ويقول محقق كتاب ابن قُتَيْبة في الحاشية إنه «اعتراض غير جيد»، وينقل عن الوزير أبي بكر، شارح ديوان النابغة، قوله: «يريد أنها اعتادت بمصاحبتهم أن تقع على قتلى من يعاديهم، فهذا هو يقينها، لا أنها تعلم الغيب»، وأن ذلك مبيَّن في البيت 14 «لَهُنَّ عَلَيْهِمْ عَادَةٌ قَدْ عَرَفْنَهَا» [@ibn-qutayba، ج1 ص168]. وكذلك فسّر الأَعْلَم البيت 14: «أي لهذه الطير عادة على هؤلاء القوم قد علمنها» [@diwan-nabigha، ص43]."
syntax:
  - "«جَوَانِحَ» حال منصوبة، والأقرب أنها من الضمير «هُنّ» في «تراهنّ» في البيت 12، بعد الحال «خُزْرًا»: تراهنّ خزرًا ... جوانحَ."
  - "«قَدْ أَيْقَنَّ» جملة في موضع نصب صفة لـ«جوانح». و«أَنَّ قَبِيلَهُ ... أَوَّلُ غَالِبِ» سدّت مسدّ مفعولي «أيقنّ»: «قبيلَه» اسم «أنّ»، و«أوّلُ غالبٍ» خبرها، و«غالبِ» مضاف إليه."
  - "«إِذَا مَا الْتَقَى الْجَمْعَانِ» ظرف شرطي معترض بين اسم «أنّ» وخبرها، وجوابه محذوف يدل عليه ما قبله."
  - "والضمير في «قَبِيلَهُ» للممدوح، والفعل في البيت 10 على رواية الأَعْلَم جمع «غزوا»، فيعود الضمير على الممدوح المفهوم من القصيدة. أما في رواية «إذا ما غزا بالجيش» فيعود على فاعل «غزا»."
morphology:
  - "«جَوَانِح» جمع «جانِحة» على «فَواعِل»، من «جَنَحَ» إذا مال، وهي ممنوعة من الصرف لأنها على صيغة منتهى الجموع."
  - "«أَيْقَنَّ» ماض على «أَفْعَلَ» من اليقين، أُسند إلى نون النسوة فسكن آخره، وأُدغمت النون في النون."
  - "«الْتَقَى» على «افْتَعَلَ» من اللقاء. و«الْجَمْعَانِ» مثنى «جَمْع». و«أَوَّل» على «أَفْعَل»، و«غَالِب» اسم فاعل من «غَلَبَ»."
rhetoric:
  thesis: "يجعل الطير شاهدة بالنصر قبل أن يقع: هي واثقة بأن الغلبة لقوم الممدوح، لأنها جرّبتهم. وفيه ما أخذه عليه ابن قُتَيْبة، وما فسّره به غيره."
  devices:
    - title: "الأصل والفرع في معنى الطير"
      text: "يرى عبد القاهر الجُرْجانيّ أن في المعنى الذي تداوله الشعراء في الطير التي تتبع الجيش معنيين: «أحدُهما: أصْلٌ، وهو: عِلْمُ الطَّير بأنَّ الممدوحَ إِذا غزا عَدُوّاً كان الظفَرُ له، وكان هو الغالبَ. والآخرُ فرْعٌ، وهو: طمَعُ الطيرِ في أن تتَّسع عليها المطاعِمُ من لحوم القتلى» [@dalail، ص502]. ثم يقول: «وقد عَمَد النابغةُ إِلى الأَصْل، الذي هو علْمُ الطير بِأنَّ الممدوحَ يكونُ الغالبَ، فذَكَره صريحاً، وكَشَفَ عن وجهه، واعتمَدَ في الفرع الذي هو طمَعُها في لحوم القتلى، وأَنها لذلك تُحَلِّقُ فوقه على دلالةِ الفَحْوى» [@dalail، ص503]. والفحوى ما يُفهم من الكلام دون أن يُصرَّح به. فهذا البيت هو الأصل الصريح، والتحليق في البيت 10 يدل على الفرع. أما أبو نُوَاس فصرّح بالفرع، وترك الأصل للفحوى."
    - title: "إسناد اليقين إلى الطير في «قَدْ أَيْقَنَّ»"
      text: "أسند اليقين إلى الطير، وهو من صفات العقلاء، فجعل لها ما ليس لها. وهذا من الضرب الثاني من الاستعارة عند عبد القاهر الجُرْجانيّ، الذي تجعل فيه «للشّيءِ الشيءَ ليس له» [@dalail، ص67]. وهو الذي أنكره ابن قُتَيْبة حين حمله على الحقيقة، وفسّره الشرّاح بالعادة."
    - title: "رفع الاشتراك في «أَنَّ قَبِيلَهُ ... أَوَّلُ غَالِبِ»"
      text: "قبل هذا البيت كان يمكن أن يُفهم أن الطير تتبع الجيش لتأكل من قتلاه هو. فجاء البيت يحدّد أن الغلبة لقوم الممدوح، وهذا ما يقوله الأَعْلَم: «فتبيّن في هذا البيت مراده، وأخرج اللفظ من الاشتراك» [@diwan-nabigha، ص43]. والاشتراك أن يحتمل اللفظ معنيين."
  connection: "ثم يذكر علة يقينها: عادة عرفتها فيهم إذا نُصبت الرماح على ظهور الخيل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "جَوَانِ / حَ قَدْ أَيْقَنْ / نَ أَنْنَ / قَبِيلَهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — إِذَا مَلْ / تَقَلْ جَمْعَا / نِ أَوْوَ / لُ غَالِبِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر، والثالثة في العجز [@atiq، ص29]. وتُشبَع ضمة الهاء في «قَبِيلَهُ»، وتسقط ألف «مَا» في النطق قبل «الْتَقَى» لالتقاء الساكنين."
