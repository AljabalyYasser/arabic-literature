first: "يَصُونُونَ أَجْسَادًا قَدِيمًا نَعِيمُهَا"
second: "بِخَالِصَةِ الْأَرْدَانِ خُضْرِ الْمَنَاكِبِ"
vocabulary:
  - term: "بِخَالِصَةِ الْأَرْدَانِ"
    text: "«أي هي خالصة، من لون واحد، والأردان: الأكمام، واحدها رُدْن» [@diwan-nabigha، ص47–48]."
  - term: "خُضْرِ الْمَنَاكِبِ"
    text: "«يريد أن ثيابهم بيض ومناكبهم خضر، وهو لباس كان يلبسه أهل الشام» [@diwan-nabigha، ص48]."
sources:
