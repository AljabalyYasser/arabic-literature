first: "كِلِينِي لِهَمٍّ يَا أُمَيْمَةَ نَاصِبِ"
second: "وَلَيْلٍ أُقَاسِيهِ بَطِيءِ الْكَوَاكِبِ"
meaning: "دعيني يا أُمَيْمة لهمّ يُتعبني، ولليل طويل أكابده، كأن كواكبه لا تمضي. قال الأَعْلَم: «أي دعيني وهمّي»، وقال في «ناصب»: «أي ذو نَصَب»، وفي «بطيء الكواكب»: «يقال: طال الليلُ فكأنّ كواكبه لا تسير ولا تغيب، لأن انقضاء الليل لا يكون إلا بانتهاء الكواكب الطالعة في أوله إلى مواضع غُؤورها» [@diwan-nabigha، ص40]. والنَّصَب التعب، وغُؤور الكواكب غروبها."
vocabulary:
  - term: "كِلِينِي"
    text: "«أي دعيني وهمّي، يقال: وَكَلَه إلى كذا يَكِلُه، إذا تركه وإيّاه» [@diwan-nabigha، ص40]."
  - term: "أُمَيْمَةَ"
    text: "يريد ابنته أُمامة، يقول البَغْداديّ: «وأميمة تصغير ترخيم أمامة وهي بنته» [@khizana، ج2 ص321]. وتصغير الترخيم أن يُصغَّر الاسم بعد حذف ما زاد على حروفه الأصلية."
  - term: "نَاصِبِ"
    text: "«أي ذو نَصَب، يقال: أنصبني الهمّ فهو مُنصِب وناصب، على معنى النسب» [@diwan-nabigha، ص40]، أي همّ مُتعِب."
  - term: "أُقَاسِيهِ"
    text: "«وأقاسيه: أكابده» [@khizana، ج2 ص322]."
  - term: "بَطِيءِ الْكَوَاكِبِ"
    text: "طويل، لأن الكواكب لا تمضي فيه: «يقال: طال الليلُ فكأنّ كواكبه لا تسير ولا تغيب» [@diwan-nabigha، ص40]."
context: "مطلع القصيدة، يصف به وبالبيتين بعده ليلة همّ، ثم يخرج في البيت 4 إلى نعمة عَمْرو بن الحارِث عليه. وقد اختاره النقاد في أحسن المطالع. يقول ابن رَشِيق في باب المبدأ: «فإن الشعر قفل أوله مفتاحه، وينبغي للشاعر أن يجود ابتداء شعره»، ثم يعدّ هذا البيت فيما يسمّيه «بعض ما اختير للقدماء» من الابتداءات [@ibn-rashiq، ج1 ص218–219]. وينقل العَسْكَريّ: «وقالوا: أحسن ابتداءات الجاهلية قول النابغة»، وينشد هذا البيت [@sinaatayn، ص433]. ويروي ابن قُتَيْبة، بعد أن يذكر تعجّب الأَصْمَعِيّ من بيت للنابغة: «قال: ومما سبق إليه ولم يجاذبه قوله فى أول شعره: كلينى لهمّ يا أميمة ناصب» [@ibn-qutayba، ج1 ص170]، أي إنه أول من قال هذا المعنى، ولم ينازعه فيه أحد. ويرى شَوْقي ضَيْف أن هذا الاستهلال «براعة استهلال رائعة» [@deif، ج1 ص282]، يريد أن أول القصيدة يهيّئ لما بعده."
syntax:
  - "«كِلِينِي» فعل أمر من «وَكَلَ»، والياء الأولى ياء المخاطَبة فاعل، والنون نون الوقاية، والياء الأخيرة ضمير المتكلم مفعول به. و«لِهَمٍّ» جار ومجرور متعلق به."
  - "«يَا أُمَيْمَةَ» منادى مفرد علم، وحقه البناء على الضم، وجاء مفتوحًا. قال الأَعْلَم: «وأراد «يا أميمَ» فلم يمكنه، فأدخل الهاء وفي نيّته الترخيم فحرّكها بحركة الميم» [@diwan-nabigha، ص40]، والترخيم في النداء حذف آخر الاسم. وهو عند سِيبَوَيْه كقولهم «يا طلحةَ أقبلْ»، ينقل عن الخليل: «فلما ألحقوا الهاء تركوا الاسم على حاله التي كان عليها قبل أن يُلحقوا الهاء»، ثم ينشد البيت [@sibawayh، ج2 ص207]. ويقول البَغْداديّ: «على أن أميمة جاء بفتح التاء والقياس ضمها»، ثم يذكر في توجيهه أقوالًا أخرى [@khizana، ج2 ص321]."
  - "«نَاصِبِ» صفة لـ«همّ» مجرورة، وهي عند سِيبَوَيْه على النسب: «أي: لهمٍّ ذي نصبٍ» [@sibawayh، ج3 ص382]، فالهمّ لا يَنصَب هو، بل هو صاحب نَصَب يُتعب من يحمله."
  - "«وَلَيْلٍ» معطوف على «همّ». و«أُقَاسِيهِ» جملة في موضع جر صفة لـ«ليل»، و«بَطِيءِ الْكَوَاكِبِ» صفة ثانية مفردة. والبيت عند البَغْداديّ شاهد «على أنه يجوز أن توصف النكرة بالجملة قبل وصفها بالمفرد إذا اجتمعا» [@khizana، ج5 ص74]."
morphology:
  - "«كِلِي» أمر من «وَكَلَ يَكِلُ»، وهو فعل مثال واوي، تُحذف واوه في المضارع والأمر، كما يقال: وَعَدَ يَعِدُ عِدْ."
  - "«أُمَيْمَة» على «فُعَيْلَة»، تصغير «أُمامة» بعد حذف ألفها الزائدة، وهو ما يسمّيه البَغْداديّ «تصغير ترخيم» [@khizana، ج2 ص321]."
  - "«نَاصِب» على «فاعِل»، ومعناه النسب: ذو نَصَب. وفي تخريجه عند البَغْداديّ أنه بمعنى «مُنصِب»، جاء به «على طرح الزائد» [@khizana، ج2 ص322]، أي بحذف همزة «أَنْصَبَ»."
  - "«أُقَاسِي» مضارع «قاسَى» على «فاعَلَ»، من القسوة، والمفاعلة فيه تدل على المعاناة الطويلة. و«بَطِيء» صفة مشبهة على «فَعِيل» من «بَطُؤَ»."
rhetoric:
  thesis: "يبدأ القصيدة بالهمّ لا بالأطلال: يطلب من ابنته أن تتركه لهمّه، ثم يجعل الليل شريكًا في الهمّ، ليلًا يكابده لا تمضي كواكبه. فالمطلع يضع السامع في ليلة ساهرة قبل أن يعرف سببها."
  devices:
    - title: "الكناية في «بَطِيءِ الْكَوَاكِبِ»"
      text: "لم يقل إن الليل طويل، بل قال إن كواكبه بطيئة، وطول الليل يلزم من بطء كواكبه، كما بيّن الأَعْلَم: «لأن انقضاء الليل لا يكون إلا بانتهاء الكواكب الطالعة في أوله إلى مواضع غُؤورها» [@diwan-nabigha، ص40]. وهذه هي الكناية عند عبد القاهر الجُرْجانيّ: «أن يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود»، «فيومئ به إليهِ، ويجعلهُ دليلاً عليه» [@dalail، ص66]. والردف التابع: فبطء الكواكب يتبعه طول الليل."
    - title: "الخطاب في «كِلِينِي ... يَا أُمَيْمَةَ»"
      text: "يفتتح بأمر وخطاب لامرأة قريبة، لا بوقوف على دار. ويرى شَوْقي ضَيْف أنه في أول القصيدة «يخاطب بنته أمامة ويشكو لها همومه» [@deif، ج1 ص282]. فالهمّ يبدأ من البيت، ومن طلب الشاعر أن يُترك وحده مع همّه."
    - title: "التصريع"
      text: "ختم الصدر بـ«نَاصِبِ» على قافية العجز «الْكَوَاكِبِ». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. والعروض آخر تفعيلة في الصدر، والضرب آخر تفعيلة في العجز، وبالتصريع يعرف السامع قافية القصيدة من بيتها الأول."
  connection: "ثم يصف هذا الليل: طال حتى ظنّ أنه لا ينقضي، وأن الصبح لن يعود."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "كِلِينِي / لِهَمْمِنْ يَا / أُمَيْمَ / ةَ نَاصِبِي = فعولن / مفاعيلن / فعولُ / مفاعلن — وَلَيْلِنْ / أُقَاسِيهِي / بَطِيئِلْ / كَوَاكِبِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر فصارت «فعولُ» [@atiq، ص29]. والعروض «مفاعلن» مقبوضة على ما يلزم في الطويل، والضرب مثلها [@atiq، ص29–30]. والبيت مصرّع. وتُشبَع كسرة الهاء في «أُقَاسِيهِ» فتُنطق «أُقَاسِيهِي»، وكسرة الباء في آخر الشطرين."
