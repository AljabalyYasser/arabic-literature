first: "إِذَا اسْتُنْزِلُوا عَنْهُنَّ لِلطَّعْنِ أَرْقَلُوا"
second: "إِلَى الْمَوْتِ إِرْقَالَ الْجِمَالِ الْمَصَاعِبِ"
vocabulary:
  - term: "اسْتُنْزِلُوا عَنْهُنَّ"
    text: "«أي إذا اشتدّت الحرب، وضاق الموضع في القتال عن الخيل، فتداعَوا بالنزول عنها» [@diwan-nabigha، ص44]."
  - term: "أَرْقَلُوا"
    text: "«أي عدَوا وأسرعوا» [@diwan-nabigha، ص44]."
  - term: "الْمَصَاعِبِ"
    text: "«جمع مُصْعَب، وهو الفحل الذي لم يمسّه حبل قطّ» [@diwan-nabigha، ص44]."
