first: "تُوُرِّثْنَ مِنْ أَزْمَانِ يَوْمِ حَلِيمَةٍ"
second: "إِلَى الْيَوْمِ قَدْ جُرِّبْنَ كُلَّ التَّجَارِبِ"
meaning: "ورثوا هذه السيوف عن آبائهم منذ يوم حليمة إلى اليوم، وقد جُرّبت في كل حرب. قال الأَعْلَم في «تُورّثن»: «يعني السيوفَ، أي ورثوها من آبائهم وأجدادهم» [@diwan-nabigha، ص45]."
vocabulary:
  - term: "تُوُرِّثْنَ"
    text: "«يعني السيوفَ، أي ورثوها من آبائهم وأجدادهم» [@diwan-nabigha، ص45]."
  - term: "يَوْمِ حَلِيمَةٍ"
    text: "«يوم معروف أحد أيام العرب المشهورة، وهو يوم التقى المنذر الأكبر والحرث الأكبر الغساني» [@lisan، ج12 ص149]."
  - term: "جُرِّبْنَ"
    text: "اختُبرن في القتال مرة بعد مرة."
context: "يأتي بعد «ولا عيب فيهم»، فيكمل صورة السيوف المفلولة: فلولها قديمة، لأنها موروثة منذ يوم حليمة. ويوم حليمة من أيام العرب، أي حروبهم المشهورة (انظر [أيام العرب](/path/1/ayyam-al-arab/)). ويروي الأَعْلَم في خبره ثلاثة أحاديث: في الأول أن غسّان حين خرجت من اليمن نزلت قرب الضَّجاعِمة، وهم عمّال الروم بالشام، فقتل رجل منها يقال له جِذْع عاملَهم لما شدّد عليه في الجباية، فغلبت غسّان وأخذت الملك منهم؛ وفي الثاني أن الغسّانيين قاتلوا الضجاعمة، وكانت لرئيسهم ابنة تُطيّب جنده يقال لها حليمة؛ وفي الثالث أنه اليوم الذي ظفر فيه الحارِث بن أبي شَمِر بالمُنْذِر بن ماء السماء، وأن ابنته حليمة طيّبت جنده، و«فلما ظفر الحارث بالمنذر بعد قتال شديد، قيل»: «مَا يَوْمُ حَلِيمَةَ بِسِرٍّ»، «فذهبت مثلًا» [@diwan-nabigha، ص45]. فخبر يوم حليمة مختلف فيه: تختلف رواياته في جوهره، أي فيمن كان القتال بينهم. والثالث هو ما في اللسان [@lisan، ج12 ص149]، وبه يأخذ شَوْقي ضَيْف [@deif، ج1 ص283–284]."
syntax:
  - "«تُوُرِّثْنَ» فعل ماض مبني للمجهول، ونون النسوة نائب فاعل يعود على السيوف في البيت 19."
  - "«مِنْ أَزْمَانِ يَوْمِ حَلِيمَةٍ» جار ومجرور متعلق بـ«تورّثن»، و«مِن» فيه لابتداء الغاية في الزمان، ويقول البَغْداديّ إن ابن هشام أورده في «المغني» «على أن من تأتي لابتداء الغاية في الزمان» [@khizana، ج3 ص331]. و«إِلَى الْيَوْمِ» لانتهائها."
  - "«قَدْ جُرِّبْنَ كُلَّ التَّجَارِبِ» جملة حالية، ونون النسوة نائب فاعل، و«كُلَّ» مفعول مطلق منصوب لأنه أضيف إلى المصدر «التجارب»."
  - "«حَلِيمَةٍ» عَلَم مؤنث حقه المنع من الصرف، ونُوِّن هنا لضرورة الشعر."
morphology:
  - "«تُوُرِّثْنَ» على «تُفُعِّلْنَ»، ماضي «تَوَرَّثَ» المبني للمجهول، من الإرث."
  - "«جُرِّبْنَ» ماضي «جَرَّبَ» على «فَعَّلَ» مبنيًّا للمجهول، والتضعيف فيه للتكثير."
  - "«التَّجَارِب» جمع «تَجْرِبة» على «تَفاعِل»."
rhetoric:
  thesis: "يجعل للسيوف تاريخًا: هي ليست سيوف هذا الجيل وحده، بل سيوف الآباء منذ اليوم الذي انتصرت فيه غسّان. فالفلول في البيت السابق صارت سجلًّا لحروب قديمة."
  devices:
    - title: "التلميح في «يَوْمِ حَلِيمَةٍ»"
      text: "يكتفي باسم اليوم ليستدعي في ذهن السامع حربًا معروفة ومثلًا سائرًا، «والعرب تضرب المثل في كل أمر متعالم مشهور فتقول: ما يوم حليمة بسر» [@lisan، ج12 ص149]. فاسم اليوم يحمل فخر غسّان كله."
    - title: "الإسناد إلى السيوف في «جُرِّبْنَ كُلَّ التَّجَارِبِ»"
      text: "جعل السيوف هي التي جُرّبت، والمجرَّب في الحقيقة أصحابها. فالسيوف التي لا عيب فيها إلا الفلول صارت شاهدة على شجاعة من حملها جيلًا بعد جيل."
    - title: "المقابلة بين «مِنْ أَزْمَانِ» و«إِلَى الْيَوْمِ»"
      text: "يمدّ الزمن من أوله إلى آخره: من يوم حليمة إلى اليوم، فيوحي بأن القتال لم ينقطع."
  connection: "ثم يصف فعل هذه السيوف: تقطع الدروع المضاعفة، وتقدح النار من الحجارة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "تُوُرْرِثْ / نَ مِنْ أَزْمَا / نِ يَوْمِ / حَلِيمَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — إِلَلْ يَوْ / مِ قَدْ جُرْرِبْ / نَ كُلْلَتْ / تَجَارِبِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر [@atiq، ص29]. ونُوّن «حَلِيمَةٍ» ليستقيم الوزن."
