first: "وَلَا يَحْسِبُونَ الْخَيْرَ لَا شَرَّ بَعْدَهُ"
second: "وَلَا يَحْسِبُونَ الشَّرَّ ضَرْبَةَ لَازِبِ"
vocabulary:
  - term: "ضَرْبَةَ لَازِبِ"
    text: "أمرًا لازمًا لا يزول، «واللازب واللازم واحد» [@diwan-nabigha، ص48]. والمعنى عند الأَعْلَم: «قد عرفوا تصرُّفَ الدهر وتقلّبه، خيرَه وشرّه» [@diwan-nabigha، ص48]."
