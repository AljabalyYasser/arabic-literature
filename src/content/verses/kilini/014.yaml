explained: false
first: "لَهُنَّ عَلَيْهِمْ عَادَةٌ قَدْ عَرَفْنَهَا"
second: "إِذَا عُرِّضَ الْخَطِّيُّ فَوْقَ الْكَوَاثِبِ"
vocabulary:
  - term: "عَادَةٌ قَدْ عَرَفْنَهَا"
    text: "«وتلك العادة أن يظفروا بأعدائهم، فتقع الطير على لحومهم» [@diwan-nabigha، ص43]."
  - term: "عُرِّضَ الْخَطِّيُّ"
    text: "«أي نُصب وأُعدّ للطعن. والخطّيّ: الرماح؛ تُنسب إلى الخطّ، وهو موضع بالبحرين» [@diwan-nabigha، ص43]."
  - term: "الْكَوَاثِبِ"
    text: "«جمع كاثبة، وهي منسج الفرس أمام القَرَبوس» [@diwan-nabigha، ص43]."
sources:
