first: "وَلَا عَيْبَ فِيهِمْ غَيْرَ أَنَّ سُيُوفَهُمْ"
second: "بِهِنَّ فُلُولٌ مِنْ قِرَاعِ الْكَتَائِبِ"
meaning: "لا عيب في هؤلاء القوم إلا أن في سيوفهم ثُلَمًا من كثرة ما ضربوا بها الجيوش، وهذا ليس عيبًا. قال الأَعْلَم: «هو كقولك: لا عيبَ في فلان إلا كرمُه وكثرةُ جوده، أي لا عيب فيه أصلًا»، وقال في «بهنّ فلول»: «أي تكسّر وتثلّم من جهة التجالد بها» [@diwan-nabigha، ص44–45]. والتجالد: التضارب بالسيوف."
vocabulary:
  - term: "فُلُولٌ"
    text: "«وفلوله: ثلمه، واحدها فلّ»، «والفلّ، بالفتح: واحد فلول السيف وهي كسور في حدّه» [@lisan، ج11 ص530]."
  - term: "قِرَاعِ"
    text: "«والقِراع: مصدر قارعته، إذا جالدته وضاربته» [@diwan-nabigha، ص45]."
  - term: "الْكَتَائِبِ"
    text: "«جمع كتيبة وهي الطائفة المجتمعة من الجيش» [@khizana، ج3 ص328]."
context: "أشهر أبيات القصيدة، يأتي في وسط وصف القتال: بعد أن ذكر سيوفهم وما تفعله برؤوس الأعداء، أثبت لها عيبًا واحدًا هو أثر القتال فيها، ثم ذكر في البيت 20 أنها موروثة منذ يوم حليمة. وهو عند البَغْداديّ «مشهور قد تداوله العلماء في تصانيفهم» [@khizana، ج3 ص328]: استشهد به سِيبَوَيْه في النحو [@sibawayh، ج2 ص326]، وأورده علماء البديع شاهدًا لما يسمّونه «تأكيد المدح بما يشبه الذم» [@khizana، ج3 ص328]. ويرى شَوْقي ضَيْف أنه «صورة طريفة ظاهرها ذم وباطنها مدح شديد» [@deif، ج1 ص284]."
syntax:
  - "«لَا» نافية للجنس، و«عَيْبَ» اسمها مبني على الفتح، و«فِيهِمْ» جار ومجرور خبرها."
  - "«غَيْرَ» منصوبة على الاستثناء، وهو استثناء منقطع، لأن ما بعدها ليس من جنس العيب. وأورده سِيبَوَيْه في «باب ما لا يكون إلا على معنى ولكن» [@sibawayh، ج2 ص325]، وقال: «أي ولكن سيوفهم بهن فلول» [@sibawayh، ج2 ص326]. وأجاز المبرّد الرفع في هذا الباب، كما ينقل البَغْداديّ [@khizana، ج3 ص328]."
  - "«أَنَّ سُيُوفَهُمْ بِهِنَّ فُلُولٌ» عند البَغْداديّ «مؤول بمصدر مجرور» بإضافة «غير» إليه [@khizana، ج3 ص327]، والتقدير: غيرَ كونِ سيوفهم بها فلول. و«سيوفَهم» اسم «أنّ»، و«بِهِنَّ فُلُولٌ» جملة خبرها: «بهنّ» خبر مقدّم، و«فلولٌ» مبتدأ مؤخّر."
  - "«مِنْ قِرَاعِ الْكَتَائِبِ» جار ومجرور في موضع رفع صفة لـ«فلول»، و«مِن» فيه للتعليل: فلول سببها القراع."
morphology:
  - "«فُلُول» جمع «فَلّ» على «فُعُول»، وفي اللسان: «وقد قيل: الفلول مصدر، والأول أصح» [@lisan، ج11 ص530]."
  - "«قِرَاع» مصدر «قارَعَ» على «فِعال»، والمفاعلة فيه تدل على المشاركة: يضربون ويُضرَبون."
  - "«الْكَتَائِب» جمع «كَتِيبة» على «فَعائِل»."
rhetoric:
  thesis: "يمدح بما يشبه الذم: ينفي عنهم كل عيب، ثم يستثني شيئًا يظنه السامع عيبًا، فإذا هو أعلى المدح، لأن الفلول لا تكون إلا من كثرة القتال."
  devices:
    - title: "تأكيد المدح بما يشبه الذم"
      text: "يقول ابن رَشِيق في باب الاستثناء: «وابن المعتز يسميه توكيد المدح بما يشبه الذم، وذلك نحو قول النابغة الذبياني»، ثم ينشد البيت ويقول: «فجعل فلول السيف عيباً، وهو أوكد في المدح» [@ibn-rashiq، ج2 ص48]. ويرى أن سبيل هذا الباب أن يؤتى فيه «بما يظن أنه عيب أو تقصير، وإن كان على التحصيل فخراً وفضلاً، كالفلول في سيوف النابغة الذبياني» [@ibn-rashiq، ج2 ص49]. ويجعله العَسْكَريّ من الضرب الأول من الاستثناء، وهو «أن تأتى معنى تريد توكيده والزيادة فيه فتستثنى بغيره؛ فتكون الزيادة التى قصدتها، والتوكيد الذى توخيته فى استثنائك» [@sinaatayn، ص408]."
    - title: "النفي العام ثم الاستثناء"
      text: "بدأ بـ«لا» النافية للجنس، وهي تنفي العيب كله، كما يقول البَغْداديّ: «فإنه نفى العيب عن هؤلاء القوم على جهة الاستغراق ثم أثبت لهم عيبا وهو تثلم سيوفهم من مضاربة الجيوش. وهذا ليس بعيب بل هو غاية المدح» [@khizana، ج3 ص328]. فكلما اتسع النفي في الصدر قويت المفاجأة في العجز."
    - title: "الكناية في «بِهِنَّ فُلُولٌ مِنْ قِرَاعِ الْكَتَائِبِ»"
      text: "لم يقل إنهم شجعان كثيرو القتال، بل ذكر أثر القتال في سيوفهم، وكثرة القتال تُعرف منه. فهو يذكر معنى «هو تاليهِ ورِدْفُه في الوجود»، على تعريف عبد القاهر الجُرْجانيّ للكناية [@dalail، ص66]."
  connection: "ثم يذكر أن هذه السيوف قديمة فيهم: ورثوها منذ يوم حليمة، وجرّبوها في كل حرب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "وَلَا عَيْ / بَ فِيهِمْ غَيْ / رَ أَنْنَ / سُيُوفَهُمْ = فعولن / مفاعيلن / فعولُ / مفاعلن — بِهِنْنَ / فُلُولُنْ مِنْ / قِرَاعِلْ / كَتَائِبِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر، والأولى في العجز [@atiq، ص29]."
