explained: false
first: "لَئِنْ كَانَ لِلْقَبْرَيْنِ قَبْرٍ بِجِلِّقٍ"
second: "وَقَبْرٍ بِصَيْدَاءَ الَّذِي عِنْدَ حَارِبِ"
vocabulary:
  - term: "لِلْقَبْرَيْنِ"
    text: "يريد صاحبي القبرين، «أي ابن هذين الرجلين اللذين في هذين القبرين» [@diwan-nabigha، ص41]، يعني أبا الممدوح وجدّه."
  - term: "بِجِلِّقٍ"
    text: "«بلد» [@diwan-nabigha، ص41]، ويقول البَغْداديّ: «وجلّق بكسر الجيم واللام المشددة هي الشام» [@khizana، ج3 ص330]."
  - term: "بِصَيْدَاءَ"
    text: "«أرض بالشام» [@diwan-nabigha، ص41]."
  - term: "حَارِبِ"
    text: "«اسم رجل، وقيل: هو موضع» [@diwan-nabigha، ص41]."
