explained: false
first: "وَلِلْحَارِثِ الْجَفْنِيِّ سَيِّدِ قَوْمِهِ"
second: "لَيَلْتَمِسَنْ بِالْجَيْشِ دَارَ الْمُحَارِبِ"
vocabulary:
  - term: "وَلِلْحَارِثِ الْجَفْنِيِّ"
    text: "«يريد: ولئن كان ابن الحارث الجفنيّ» [@diwan-nabigha، ص42]. والجَفْنيّ نسبة إلى جَفْنة، ويقول البَغْداديّ: «وهو جفنة بن عمرو مزيقياء بن عامر بن ماء السماء وهم الملوك الذين كانوا بالشام» [@khizana، ج3 ص330]."
  - term: "لَيَلْتَمِسَنْ بِالْجَيْشِ دَارَ الْمُحَارِبِ"
    text: "«أي ليطلبنّ دار مَن حاربه» [@diwan-nabigha، ص42]. يقول: إن كان ابن هؤلاء الملوك فسيغزو أعداءه في ديارهم."
