first: "وَثِقْتُ لَهُ بِالنَّصْرِ إِذْ قِيلَ قَدْ غَزَتْ"
second: "كَتَائِبُ مِنْ غَسَّانَ غَيْرُ أَشَائِبِ"
vocabulary:
  - term: "كَتَائِبُ"
    text: "جيوش، واحدتها كتيبة."
  - term: "غَيْرُ أَشَائِبِ"
    text: "«والأشائب: الأخلاط»، أي إن جيوشه من غسّان «لم يخالطهم غيرُهم» [@diwan-nabigha، ص42]."
