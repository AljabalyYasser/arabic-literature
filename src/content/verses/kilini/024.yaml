explained: false
first: "مَحَلَّتُهُمْ ذَاتُ الْإِلٰهِ وَدِينُهُمْ"
second: "قَوِيمٌ فَمَا يَرْجُونَ غَيْرَ الْعَوَاقِبِ"
vocabulary:
  - term: "مَحَلَّتُهُمْ"
    text: "«أي مسكنهم وموضع حُلولهم» [@diwan-nabigha، ص47]. وروى أبو عُبَيْدة «مَجَلَّتُهُمْ» بالجيم، «وقال: كلّ كتاب عند العرب مجلّة، يريد أنهم كانوا نصارى، وكتابهم الإنجيل» [@diwan-nabigha، ص47]."
  - term: "ذَاتُ الْإِلٰهِ"
    text: "«يعني بيت المقدس وناحية الشام، وهي الأرض المقدّسة ومنازل الأنبياء» [@diwan-nabigha، ص47]."
  - term: "فَمَا يَرْجُونَ غَيْرَ الْعَوَاقِبِ"
    text: "في تفسيره قولان عند الأَعْلَم: «أي لا يخافون ويتّقون غير عواقب الدنيا وأحداثها»، «والرجاء قد يُستعمل في معنى الخوف»، وقال الأَصْمَعِيّ: «فما يرجُون» أي يطلبون «إلا عواقب أمورهم، وحسن الجزاء عليها» [@diwan-nabigha، ص47]."
sources:
