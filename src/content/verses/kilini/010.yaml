first: "إِذَا مَا غَزَوْا فِي الْجَيْشِ حَلَّقَ فَوْقَهُمْ"
second: "عَصَائِبُ طَيْرٍ تَهْتَدِي بِعَصَائِبِ"
meaning: "إذا غزوا في جيشهم دارت فوقهم جماعات من الطير، تتبع كل جماعة منها جماعة أخرى. قال الأَعْلَم: «إذا رأت النُّسورُ وغيرُها من سباع الطير أُهبتَهم للقتال علِمْنَ أن ستكون مَلْحَمةٌ؛ فهي ترفرف فوق رءوسهم وتتبعهم»، وقال في «تهتدي بعصائب»: «أي يتبع بعضُها بعضًا، ويهتدي بعضُها ببعض» [@diwan-nabigha، ص42]. والأُهبة: العُدّة، والملحمة: الوقعة يكثر فيها القتلى."
vocabulary:
  - term: "غَزَوْا"
    text: "خرجوا إلى قتال العدو في أرضه."
  - term: "حَلَّقَ"
    text: "«وحلّق الطائر إذا ارتفع في الهواء واستدار» [@lisan، ج10 ص63]."
  - term: "عَصَائِبُ طَيْرٍ"
    text: "جماعات من الطير، واحدتها عِصابة، يريد النسور وسباع الطير كما يقول الأَعْلَم [@diwan-nabigha، ص42]."
  - term: "تَهْتَدِي بِعَصَائِبِ"
    text: "«أي يتبع بعضُها بعضًا، ويهتدي بعضُها ببعض» [@diwan-nabigha، ص42]."
context: "أول أبيات الطير، وهي ستة (10–15)، يصف فيها جماعات النسور التي تتبع جيش غسّان. وقد أُخذ عليه هذا المعنى. قال ابن قُتَيْبة: «وأخذوا عليه قوله»، وأنشد هذا البيت والبيت 13، ثم قال: «جعل الطير تعلم الغالب من المغلوب قبل التقاء الجمعين» [@ibn-qutayba، ج1 ص167]، والطير تتبع العساكر «للقتلى، ولكنّها لا تعلم أيّها يغلب» [@ibn-qutayba، ج1 ص168]. ولم يكن النابغة أول من ذكر الطير التي تتبع الجيش، فيرى شَوْقي ضَيْف أنه «ربما سبقه الأفوه بقوله»: «وَتَرَى الطَّيْرَ عَلَى آثَارِنَا / رَأْيَ عَيْنٍ ثِقَةً أَنْ سَتُمَارْ» [@deif، ج1 ص283]، والأَفْوَه الأَوْدِيّ شاعر جاهلي يمانيّ. ثم تداول الشعراء المعنى بعده، يقول العَسْكَريّ: «وزاد أبو تمام أيضا على الأفوه، والنابغة، وأبى نواس، ومسلم، فى معنى تداولوه» [@sinaatayn، ص225]."
syntax:
  - "«إِذَا» ظرف لما يستقبل من الزمان فيه معنى الشرط، و«مَا» زائدة للتوكيد، وجملة «غَزَوْا» في موضع جر بإضافة «إذا» إليها، و«فِي الْجَيْشِ» متعلق بـ«غزوا»."
  - "«حَلَّقَ» جواب «إذا»، وفاعله «عَصَائِبُ» في أول العجز. ولم يقل «حلّقت» لأن الفاعل جمع تكسير، يجوز معه تذكير الفعل وتأنيثه، ولا سيما إذا فُصل بينهما كما فصل هنا بـ«فوقهم»."
  - "«فَوْقَهُمْ» ظرف مكان متعلق بـ«حلّق». و«تَهْتَدِي بِعَصَائِبِ» جملة في موضع رفع صفة لـ«عصائب طير». و«عصائب» ممنوع من الصرف، وجُرّ في القافية بالكسرة، وصرف الممنوع جائز في الشعر."
morphology:
  - "«حَلَّقَ» على «فَعَّلَ» من الحَلْقة، أي استدار في طيرانه كالحلقة، وفي اللسان بعد أن ذكر تحلّق القمر واستدارة البيوت حلقة: «وهو من ذلك» [@lisan، ج10 ص63]."
  - "«عَصَائِب» جمع «عِصابة» على «فَعائِل»، وهي الجماعة."
  - "«تَهْتَدِي» على «تَفْتَعِل» من الهداية، والافتعال فيه للمطاوعة: تتبع ما يهديها."
rhetoric:
  thesis: "يمدح الجيش بما يتبعه: إذا خرج الغساسنة إلى الحرب خرجت الطير وراءهم، لأنها اعتادت أن تجد عندهم قتلى أعدائهم. فالشهادة للجيش هنا شهادة الطير، لا شهادة الشاعر."
  devices:
    - title: "الكناية في «حَلَّقَ فَوْقَهُمْ عَصَائِبُ طَيْرٍ»"
      text: "لم يقل إنهم يكثرون القتل في أعدائهم، بل ذكر الطير التي تتبعهم، والطير لا تتبع إلا جيشًا يترك قتلى. وهذه كناية على حدّ عبد القاهر الجُرْجانيّ: يترك المتكلم اللفظ الموضوع للمعنى، «ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود»، «فيومئ به إليهِ، ويجعلهُ دليلاً عليه» [@dalail، ص66]."
    - title: "النقل من صورة إلى صورة: النابغة وأبو نُوَاس"
      text: "يروي عبد القاهر الجُرْجانيّ عن المَرْزُبانيّ أن عمرًا الوَرّاق سمع أبا نُوَاس ينشد قوله «تَتَأَيَّى الطَّيْرُ غُدْوَتَهُ / ثِقَةً بِالشِّبْعِ مِنْ جَزَرِهْ»، فقال له: «ما تركتَ للنابغة شيئاً حيثُ يقولُ»، وذكر هذا البيت والبيت 13، «فقال: اسكُتْ، فلئن كان سَبَقَ فما أسأْتُ الاتِّباعَ» [@dalail، ص502]. ويرى عبد القاهر أن جواب أبي نواس «دليلٌ بيِّنٌ في أنَّ المعنى يُنْقَل من صورةٍ إِلى صورة» [@dalail، ص502]، وانظر ما يقوله في البيت 13. ويفسّر محقق الكتاب «جَزَرِه» بأنهم «القتلى الذين جزرتهم سيوفه» [@dalail، ص501]."
    - title: "التصدير في «عَصَائِبُ ... بِعَصَائِبِ»"
      text: "ختم البيت بكلمة سبقت في أول العجز. وهذا من التصدير عند ابن رَشِيق، وهو «أن يرد أعجاز الكلام على صدوره، فيدل بعضه على بعض»، وهو عنده أقسام، ثالثها: «ما وافق آخر كلمة من البيت بعض ما فيه» [@ibn-rashiq، ج2 ص3]. وفي التكرار هنا صورة الجماعات المتتابعة: عصائب تهتدي بعصائب."
  connection: "ثم يصف هذه الطير: تصاحب الجيش حتى يغير، وهي متعوّدة على الدماء."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "إِذَا مَا / غَزَوْ فِلْ جَيْ / شِ حَلْلَ / قَ فَوْقَهُمْ = فعولن / مفاعيلن / فعولُ / مفاعلن — عَصَائِ / بُ طَيْرِنْ تَهْ / تَدِي بِ / عَصَائِبِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثالثة في الصدر، والأولى والثالثة في العجز [@atiq، ص29]. وتسقط في النطق ألف «غَزَوْا» وياء «فِي» لالتقاء الساكنين: «غَزَوْ فِلْجَيْشِ»."
variants:
  - reading: "إِذَا مَا غَزَا بِالْجَيْشِ حَلَّقَ فَوْقَهُ"
    status: "رواية ابن قُتَيْبة وعبد القاهر"
    note: "بالإفراد، فالغازي هو الممدوح [@ibn-qutayba، ج1 ص167] [@dalail، ص501]. وعلى هذه الرواية يعود الضمير في «قبيله» في البيت 13 على الممدوح بلا تقدير."
  - reading: "إِذَا مَا غَزَوْا بِالْجَيْشِ حَلَّقَ فَوْقَهُمْ"
    status: "رواية العَسْكَريّ وشَوْقي ضَيْف"
    note: "[@sinaatayn، ص225] [@deif، ج1 ص282]."
  - reading: "إِذَا مَا الْتَقَى الْجَمْعَانِ حَلَّقَ فَوْقَهُمْ"
    status: "رواية اللسان"
    note: "[@lisan، ج10 ص63]. وصدرها عجز البيت 13."
  - reading: "أَبْصَرْتَ فَوْقَهُمْ"
    status: "رواية ابن السِّكِّيت"
    note: "يذكرها محقق الديوان [@diwan-nabigha، ص237]."
