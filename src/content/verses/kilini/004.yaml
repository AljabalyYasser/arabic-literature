first: "عَلَيَّ لِعَمْرٍو نِعْمَةٌ بَعْدَ نِعْمَةٍ"
second: "لِوَالِدِهِ لَيْسَتْ بِذَاتِ عَقَارِبِ"
vocabulary:
  - term: "لِعَمْرٍو"
    text: "عَمْرو بن الحارِث الغَسّانيّ، الممدوح، كما في رأس القصيدة [@diwan-nabigha، ص40]."
  - term: "لَيْسَتْ بِذَاتِ عَقَارِبِ"
    text: "«أي ليس فيه مكروه، ولا يكدّرها منٌّ ولا أذًى» [@diwan-nabigha، ص41]."
