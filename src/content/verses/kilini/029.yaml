first: "حَبَوْتُ بِهَا غَسَّانَ إِذْ كُنْتُ لَاحِقًا"
second: "بِقَوْمِي وَإِذْ أَعْيَتْ عَلَيَّ مَذَاهِبِي"
meaning: "أهديت هذه القصيدة إلى غسّان حين كنت لاحقًا بقومي، وحين ضاقت عليّ طرقي. قال الأَعْلَم: «أي بالقصيدة، إذ كنت لاحقًا بقومي، فكانوا أحقَّ مَن أمدح وأَوْلى بذلك»، وقال في «إذ أعيت عليّ مذاهبي»: «يعني أنه كان هاربًا من النعمان، فضاقت عليه طرقُه، وانسدّت مسالكُه؛ كأنه يريد أنه رآهم أهلًا للمدح، وأحقَّ به من غيرهم، في حال أمنه وخوفه» [@diwan-nabigha، ص48]."
vocabulary:
  - term: "حَبَوْتُ"
    text: "أعطيتُ، «حباه كذا إذا أعطاه» [@lisan، ج14 ص162]."
  - term: "بِهَا"
    text: "«أي بالقصيدة» [@diwan-nabigha، ص48]."
  - term: "أَعْيَتْ عَلَيَّ مَذَاهِبِي"
    text: "ضاقت عليّ طرقي، و«انسدّت مسالكُه» كما يقول الأَعْلَم [@diwan-nabigha، ص48]."
context: "خاتمة القصيدة، يرجع فيها إلى نفسه بعد المديح، ويسمّي القصيدة عطاء لغسّان. وفيه ما يفسّر به شَوْقي ضَيْف القصيدة كلها: «ولم يلبث أن صرح بما جاء من أجله، فهو إنما يمدح الغساسنة باسم قومه، وقد ضاقت عليه الدنيا بما رحبت بسبب من أسر منهم عند ممدوحيه» [@deif، ج1 ص285]. أما الأَعْلَم فيفسّر ضيق مذاهبه بهربه من النُّعْمان، على ما في رأس القصيدة [@diwan-nabigha، ص48]. وهما تفسيران لمناسبة القصيدة نذكرهما في مدخلها."
syntax:
  - "«حَبَوْتُ» فعل وفاعل، و«بِهَا» متعلق به، والضمير للقصيدة وإن لم يتقدم ذكرها، لأنها معلومة من المقام. و«غَسَّانَ» مفعول به، ممنوع من الصرف للعلمية وزيادة الألف والنون."
  - "«إِذْ» ظرف لما مضى من الزمان، مضاف إلى جملة «كُنْتُ لَاحِقًا»: التاء اسم «كان»، و«لاحقًا» خبرها، و«بِقَوْمِي» متعلق بـ«لاحقًا»."
  - "«وَإِذْ أَعْيَتْ عَلَيَّ مَذَاهِبِي» معطوف على «إذ» الأولى، و«مذاهبي» فاعل «أعيت»، و«عليّ» متعلق به."
morphology:
  - "«حَبَوْتُ» من «حَبَا يَحْبُو» الناقص الواوي، ظهرت واوه حين أُسند إلى تاء المتكلم."
  - "«أَعْيَتْ» ماضي «أَعْيَا» على «أَفْعَلَ»، حُذفت ألفه لالتقاء الساكنين مع تاء التأنيث."
  - "«مَذَاهِب» جمع «مَذْهَب» على «مَفاعِل»، وهو مكان الذهاب، أي الطريق. و«لَاحِق» اسم فاعل من «لَحِقَ»."
rhetoric:
  thesis: "يختم بما يشبه التوقيع: هذه القصيدة عطاء لغسّان، قالها في حال يعرفها الممدوح، حين ضاقت به الطرق."
  devices:
    - title: "حسن الختام"
      text: "يعود في آخر بيت إلى القصيدة نفسها فيسمّيها عطاء، فيعرف السامع أن الكلام قد انتهى. ويقول ابن رَشِيق في الخاتمة: «وخاتمة الكلام أبقى في السمع، وألصق بالنفس؛ لقرب العهد بها؛ فإن حسنت حسن، وإن قبحت قبح» [@ibn-rashiq، ج1 ص217]."
    - title: "الاستعارة في «حَبَوْتُ بِهَا»"
      text: "الحِباء العطاء، فجعل القصيدة عطاء يحبو به الملوك، والمعتاد أن الملوك هم الذين يحبون الشعراء. فقلب الشاعر الأمر، فصار هو المعطي."
    - title: "المقابلة بين الحالين"
      text: "على تفسير الأَعْلَم يذكر حالين: حال أمن مع قومه في «إِذْ كُنْتُ لَاحِقًا بِقَوْمِي»، وحال خوف ضاقت فيها طرقه في «وَإِذْ أَعْيَتْ عَلَيَّ مَذَاهِبِي»، وغسّان أهل للمدح «في حال أمنه وخوفه» [@diwan-nabigha، ص48]."
  connection: "وبه تنتهي القصيدة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "حَبَوْ تُ / بِهَا غَسْسَا / نَ إِذْ كُنْ / تُ لَاحِقَنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — بِقَوْمِي / وَإِذْ أَعْيَتْ / عَلَيْيَ / مَذَاهِبِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى في الصدر، والثالثة في العجز [@atiq، ص29]. وتُشبَع كسرة الباء في «مَذَاهِبِي»."
