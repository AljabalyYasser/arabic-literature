first: "تَطَاوَلَ حَتَّى قُلْتُ لَيْسَ بِمُنْقَضٍ"
second: "وَلَيْسَ الَّذِي يَرْعَى النُّجُومَ بِآيِبِ"
meaning: "طال هذا الليل حتى قلت إنه لا ينقضي، وإن الذي يرعى النجوم لا يعود. وفي «الذي يرعى النجوم» قولان عند الأَعْلَم: الأول أن «كلّ راعي إبل وغيرها فهو يثوب مع الليل إلى أهله، ويسكن وينام، والذي يرعى النجوم لا ينام إنما هو قاعد ينتظر الصبح»، يعني الساهر نفسه؛ والثاني: «وقيل أراد بالذي يرعى النجوم الصبح، كأنه يراعي غروبها ليطلع ويلوح» [@diwan-nabigha، ص40]. ويثوب: يرجع."
vocabulary:
  - term: "تَطَاوَلَ"
    text: "امتدّ وطال، والضمير لليل."
  - term: "بِمُنْقَضٍ"
    text: "منتهٍ ذاهب."
  - term: "يَرْعَى النُّجُومَ"
    text: "يراقبها وينتظر غيابها. وفي اللسان: «وكل شيء تنتظره، فأنت تراعيه وترعاه؛ ومنه تقول: هو يرعى الشمس أي ينتظر وجوبها، قال: والشاعر يرعى النجوم» [@lisan، ج8 ص389]. ووجوب الشمس غروبها."
  - term: "بِآيِبِ"
    text: "براجع، من آبَ يؤوبُ إذا رجع."
context: "يتمّ صورة الليل التي بدأها في المطلع: الكواكب لا تمضي، فلا ينقضي الليل، ولا يعود ما ينتظره الساهر. ويرى شَوْقي ضَيْف أنه يصوّر الليل «تصويرا بديعا، فالكواكب بطيئة لا تجرى، حتى ليظن أن الصبح الذى يرعى النجوم بأضوائه ويحصدها حصدا لن يؤوب» [@deif، ج1 ص282]، فهو يأخذ بالقول الثاني من قولي الأَعْلَم. وهذا البيت مع المطلع والبيت التالي هي الأبيات الثلاثة التي وازن بها بعضهم أبيات الليل في معلقة امرئ القَيْس، كما في شرح البيت 3."
syntax:
  - "«تَطَاوَلَ» فعل ماض، فاعله ضمير مستتر يعود على «ليل» في البيت الأول. و«حَتَّى» ابتدائية تفيد الغاية، وبعدها جملة «قُلْتُ»."
  - "«لَيْسَ بِمُنْقَضٍ» مقول القول: اسم «ليس» ضمير مستتر يعود على الليل، و«بِمُنْقَضٍ» خبرها، والباء زائدة لتوكيد النفي."
  - "«وَلَيْسَ الَّذِي يَرْعَى النُّجُومَ بِآيِبِ»: «الذي» اسم «ليس»، وصلته «يرعى النجوم»، و«بِآيِبِ» خبرها والباء زائدة. والأقرب أن الجملة معطوفة على «ليس بمنقض»، فهي من مقول القول أيضًا."
morphology:
  - "«تَطَاوَلَ» على «تَفاعَلَ» من الطول، وفيه معنى الامتداد شيئًا بعد شيء."
  - "«مُنْقَضٍ» اسم فاعل من «انقضى» على «انْفَعَلَ»، وأصله «مُنْقَضِيٌ»، حُذفت ياؤه مع التنوين، فهو اسم منقوص."
  - "«آيِب» اسم فاعل من «آبَ يؤوبُ» الأجوف الواوي، قُلبت عينه همزة في اسم الفاعل، كما في «قائل» من «قال يقول»."
rhetoric:
  thesis: "يبالغ في طول الليل بلسان الساهر: لا يقول إن الليل طويل، بل يروي ما قاله في نفسه حين طال: ليس بمنقض. ثم يضيف صورة يختلف فيها الشرّاح، صورة «الذي يرعى النجوم»."
  devices:
    - title: "الاستعارة في «الَّذِي يَرْعَى النُّجُومَ»"
      text: "على القول الثاني عند الأَعْلَم أراد الصبح، فجعله راعيًا للنجوم، «كأنه يراعي غروبها ليطلع ويلوح» [@diwan-nabigha، ص40]. وهذه استعارة يجعل فيها الشيءَ غيرَه، على قسمة عبد القاهر الجُرْجانيّ للاستعارة: «وذاكَ أنكَ في الأولِ تجعلُ الشيءَ الشيءَ ليس به، وفي الثاني للشّيءِ الشيءَ ليس له» [@dalail، ص67]، فالصبح هنا جُعل راعيًا وليس به. وعلى القول الأول هو الساهر نفسه، يرعى النجوم كما يرعى الراعي إبله، إلا أن راعي الإبل يرجع إلى أهله ليلًا، وراعي النجوم لا يرجع. وفي شرح البَطَلْيَوْسيّ، كما ينقل المحقق في الحاشية: «قال أبو علي: أراد الراعي فأقامه مقام الراعي الذي يغدو فيذهب بالإبل الماشية، يلوّح بذلك تلويحًا عجيبًا» [@diwan-nabigha، ص40]."
    - title: "حكاية القول في «حَتَّى قُلْتُ لَيْسَ بِمُنْقَضٍ»"
      text: "لم يصف طول الليل وصفًا، بل روى ما قاله في نفسه حين طال، فيرى السامع الساهر وهو ييأس من الصبح. فالمبالغة هنا تأتي من حال المتكلم لا من وصف الليل."
    - title: "التكرار في «لَيْسَ ... وَلَيْسَ»"
      text: "كرّر النفي في الشطرين: الليل لا ينقضي، والراعي لا يعود. فالشطر الثاني يعيد معنى الأول بصورة أخرى ويقوّيه."
  connection: "ثم ينتقل من الليل إلى الصدر الذي يحمل الهمّ: الليل هو الذي يردّ عليه همّه كما يردّ الراعي إبله."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "تَطَاوَ / لَ حَتْتَى قُلْ / تُ لَيْسَ / بِمُنْقَضِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَلَيْسَلْ / لَذِي يَرْعَنْ / نُجُومَ / بِآيِبِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر، والثالثة في العجز، فصارت «فعولُ» [@atiq، ص29]."
