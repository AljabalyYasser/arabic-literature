explained: false
first: "حَلَفْتُ يَمِينًا غَيْرَ ذِي مَثْنَوِيَّةٍ"
second: "وَلَا عِلْمَ إِلَّا حُسْنُ ظَنٍّ بِصَاحِبِ"
vocabulary:
  - term: "غَيْرَ ذِي مَثْنَوِيَّةٍ"
    text: "«أي لم أستثن في يميني؛ ثقةً بفعل هذا الممدوح، وحُسْنَ ظنٍّ به» [@diwan-nabigha، ص41]. والاستثناء في اليمين أن يقول الحالف: إن شاء الله، فلا تلزمه."
  - term: "وَلَا عِلْمَ إِلَّا حُسْنُ ظَنٍّ بِصَاحِبِ"
    text: "أي ليس عندي علم بما سيفعل، وإنما هو حسن ظني به."
sources:
