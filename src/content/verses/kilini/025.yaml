first: "رِقَاقُ النِّعَالِ طَيِّبٌ حُجُزَاتُهُمْ"
second: "يُحَيَّوْنَ بِالرَّيْحَانِ يَوْمَ السَّبَاسِبِ"
meaning: "هم ملوك لا يمشون فتبلى نعالهم، أعفّاء، يُحيَّون بالريحان يوم عيدهم. قال الأَعْلَم: «يريد أنهم ملوك ليسوا بأصحاب مَشْيٍ ولا تَعَب؛ فيطارقوا نعالهم»، وقال في «طيّب حجزاتهم»: «أي أعفّاء الفروج، يقال: فلانٌ طيّبُ الحُجْزة، وطيّبُ معقِد الإزار، إذا كان عفيفَ الفرج نقيًّا من الدنس»، «والسَّباسب: عيدٌ من أعياد النصارى» [@diwan-nabigha، ص47]. ويقول المحقق في الحاشية: «طارق النعل، أي خصفها وخرزها» [@diwan-nabigha، ص47]، أي رقّعها."
vocabulary:
  - term: "رِقَاقُ النِّعَالِ"
    text: "كناية عن الملك والنعمة، ويقول البَغْداديّ: «أراد أنهم ملوك لا يخصفون نعالهم إنما يخصفها من يمشي» [@khizana، ج9 ص490]."
  - term: "حُجُزَاتُهُمْ"
    text: "«الحُجْزة حيث يُثنى طرف الإزار في لوث الإزار، وجمعه حُجُزات» [@lisan، ج5 ص332]، أي موضع شدّ الإزار على الوسط."
  - term: "يَوْمَ السَّبَاسِبِ"
    text: "«يوم السباسب: عيد للنصارى، ويسمّونه يوم السعانين» [@lisan، ج1 ص460]."
context: "من أبيات السلم بعد أبيات الحرب: بعد دينهم القويم (24) يذكر نعالهم وعفّتهم وعيدهم، ثم جواريهم وثيابهم (26–27). قال ابن قُتَيْبة: «وقال النابغة فى العفّة، وهو أحسن ما قيل فيه»، ثم ذكر أن عديّ بن زيد أخذ معناه [@ibn-qutayba، ج1 ص161]. ويرى شَوْقي ضَيْف أن النابغة «نفذ فى أثناء ذلك إلى معان حضرية جديدة، إذ صور دينهم وترفهم وما هم فيه من نعيم» [@deif، ج1 ص285]، وأنه يختلف في ذلك عن شعراء البادية، لأنه عاش أكثر أيامه في الحِيرة وعند الغساسنة."
syntax:
  - "«رِقَاقُ النِّعَالِ» خبر لمبتدأ محذوف تقديره «هم»، وإضافة «رقاق» إلى «النعال» من إضافة الصفة إلى معمولها، أي نعالهم رقاق."
  - "«طَيِّبٌ حُجُزَاتُهُمْ» خبر ثان: «طيّبٌ» صفة مشبهة، و«حجزاتُهم» فاعل بها مرفوع. ولذلك أُفردت «طيّب» مع أن فاعلها جمع، كما يُفرد الفعل مع فاعله الظاهر."
  - "«يُحَيَّوْنَ» مضارع مبني للمجهول، والواو نائب فاعل، و«بِالرَّيْحَانِ» متعلق به، و«يَوْمَ السَّبَاسِبِ» ظرف زمان. والجملة خبر ثالث."
morphology:
  - "«رِقَاق» جمع «رَقِيق» على «فِعال»، و«النِّعَال» جمع «نَعْل» على «فِعال» أيضًا."
  - "«حُجُزَات» جمع «حُجْزة»، حُرّكت الجيم بالضم إتباعًا لضمة الحاء، كما يقال «غُرُفات» في جمع «غُرْفة»."
  - "«يُحَيَّوْنَ» أصله «يُحَيَّيُونَ»، استُثقلت الضمة على الياء فحُذفت، ثم حُذفت الياء لالتقاء الساكنين، وبقيت الفتحة قبل واو الجماعة."
rhetoric:
  thesis: "صورة ملوك في سلمهم: لا يمشون، أعفّاء، يُستقبلون بالريحان في عيدهم. وهو يكني بأشياء صغيرة، النعل والحجزة والريحان، عن الملك والعفة والنعمة."
  devices:
    - title: "الكناية في «طَيِّبٌ حُجُزَاتُهُمْ»"
      text: "كنى بطيب موضع الإزار عن العفة. قال صاحب اللسان: «فإنما كنّى به عن الفروج؛ يريد أنهم أعفّاء عن الفجور» [@lisan، ج5 ص332]. ويقول البَغْداديّ: «وقد يكنون عن عفة الفرج بطيب الحجزة كما قال النابغة» [@khizana، ج5 ص50]. وهذه كناية على حدّ عبد القاهر الجُرْجانيّ: يذكر المتكلم معنى «هو تاليهِ ورِدْفُه في الوجود» ليدلّ به على ما يريده [@dalail، ص66]."
    - title: "الكناية في «رِقَاقُ النِّعَالِ»"
      text: "رقة النعال تلزم من قلة المشي، وقلة المشي تلزم من الملك والنعمة، فهي كناية عن أنهم ملوك، كما فسّرها الأَعْلَم [@diwan-nabigha، ص47]. ويقول البَغْداديّ: «وهم يتمدحون بجودة النعال كما يتمدحون بجودة الملابس» [@khizana، ج9 ص490]."
    - title: "تعديد الصفات"
      text: "جمع في بيت واحد ثلاث صفات متتابعة بلا عطف: الملك في «رقاق النعال»، والعفة في «طيّب حجزاتهم»، والنعمة في «يُحيَّون بالريحان». فيرى السامع الملوك في صورة واحدة."
  connection: "ثم يصف ما حولهم من نعمة: جوارٍ بيض يحيّينهم، وثياب الخزّ الأحمر على المشاجب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "رِقَاقُنْ / نِعَالِ طَيْ / يِبُنْ حُ / جُزَاتُهُمْ = فعولن / مفاعلن / فعولُ / مفاعلن — يُحَيْيَوْ / نَ بِرْرَيْحَا / نِ يَوْمَسْ / سَبَاسِبِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض، وهو حذف الخامس الساكن [@atiq، ص28]، «مفاعيلن» الأولى في الصدر فصارت «مفاعلن»، و«فعولن» الثانية فيه فصارت «فعولُ»."
