explained: false
first: وَأَفْلَتَنَا ابْنُ قُرَّانٍ جَرِيضًا
second: تَمُرُّ بِهِ مُسَاعِفَةٌ حَرُوقُ
vocabulary:
- term: وَأَفْلَتَنَا
  text: نجا منا وفاتنا.
- term: ابْنُ قُرَّانٍ
  text: فارس من خصومهم لم تعرّفه المصادر المعتمدة.
- term: جَرِيضًا
  text: 'يقال: «وأفلتني جريضًا أي مجهودًا يكاد يقضي» [@lisan، ج7 ص130].'
- term: مُسَاعِفَةٌ حَرُوقُ
  text: 'يعني فرسًا [@asmaiyyat، ص203، الحاشية]، مطاوعة سريعة؛ «والإسعاف والمساعفة: المساعدة والمواتاة» [@lisan، ج9 ص152]، والحَروق من الاحتراق في العدو؛ يقال: «وفرس حراق العدو إذا كان يحترق في عدوه» [@lisan، ج10 ص44].'
