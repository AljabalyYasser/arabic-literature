explained: false
first: وَجَاوَزْنَا الْمَنُونَ بِغَيْرِ نِكْسٍ
second: وَخَاظِي الْجِلْزِ ثَعْلَبُهُ دَمِيقُ
vocabulary:
- term: نِكْسٍ
  text: 'سهم ضعيف؛ «والنكس: السهم الذي ينكس أو ينكسر فوقه فيجعل أعلاه أسفله» [@lisan، ج6 ص242].'
- term: وَخَاظِي الْجِلْزِ
  text: 'رمح غليظ أصل السنان؛ «الخاظي: الغليظ الصلب» [@lisan، ج14 ص233]، «وجلز السنان: الحلقة المستديرة في أسفله، وقيل: جلزه أعلاه، وقيل: معظمه» [@lisan، ج5 ص322]. ورأى المحققان أنه عنى بالنكس السهم وبما بعده الرمح [@asmaiyyat، ص202، الحاشية].'
- term: ثَعْلَبُهُ
  text: '«وثعلب الرمح: ما دخل في جبة السنان منه» [@lisan، ج1 ص238].'
- term: دَمِيقُ
  text: 'مُدخَل محكم؛ «فهو مدموق ودميق، وأدمقه: أدخله فيه» [@lisan، ج10 ص103].'
