explained: false
first: فَحَوَّطَ عَنْ بَنِي عَمْرِو بْنِ عَوْفٍ
second: وَأَفْنَاءُ الْعُمُورِ بِهَا شَفِيقُ
vocabulary:
- term: فَحَوَّطَ
  text: 'حمى ودافع؛ من «حاطه يحوطه حوطًا وحيطة وحياطة: حفظه وتعهده» [@lisan، ج7 ص279].'
- term: بَنِي عَمْرِو بْنِ عَوْفٍ
  text: قوم لم تعرّفهم المصادر المعتمدة؛ وذكر المحققان أن الشاعر أنصفهم كذلك [@asmaiyyat، ص199، الحاشية].
- term: وَأَفْنَاءُ الْعُمُورِ
  text: 'الأفناء: الأخلاط، يقال: «بها أعناء من الناس وأفناء أي أخلاط» [@lisan، ج15 ص165]؛ و«العمور: حي من عبد القيس» [@asmaiyyat، ص201، الحاشية].'
- term: شَفِيقُ
  text: 'خائف حذِر؛ «وأشفق منه جزع»، «وشفيق: بمعنى مشفق» [@lisan، ج10 ص180].'
