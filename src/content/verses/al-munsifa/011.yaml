explained: false
first: فَجَاؤُوا عَارِضًا بَرِدًا وَجِئْنَا
second: كَسَيْلِ الْعِرْضِ ضَاقَ بِهِ الطَّرِيقُ
vocabulary:
- term: عَارِضًا
  text: 'كالسحاب المعترض؛ «والعارض: السحاب المطل يعترض في الأفق» [@lisan، ج7 ص174].'
- term: بَرِدًا
  text: 'ذا بَرَد؛ «وسحاب بَرِدٌ وأبرد: ذو قُرٍّ وبرد» [@lisan، ج3 ص84].'
- term: الْعِرْضِ
  text: 'الوادي؛ «والعِرض: الوادي، وقيل جانبه» [@lisan، ج7 ص172].'
