first: فَوَدِّعْهَا وَإِنْ كَانَتْ أَنَاةً
second: مُبَتَّلَةً لَهَا خَلْقٌ أَنِيقُ
vocabulary:
- term: أَنَاةً
  text: 'قال الأَصْمَعِيّ: «الأناة من النساء التي فيها فتور عن القيام وتأنٍّ»، وقال الليث: هي «المباركة الحليمة المواتية» [@lisan، ج14 ص50].'
- term: مُبَتَّلَةً
  text: '«وقيل: المبتّلة التامة الخلق» [@lisan، ج11 ص43].'
- term: أَنِيقُ
  text: حسن معجب.
