first: فَدَمْعِي لُؤْلُؤٌ سَلِسٌ عُرَاهُ
second: يَخِرُّ عَلَى الْمَهَاوِي مَا يَلِيقُ
vocabulary:
- term: سَلِسٌ عُرَاهُ
  text: 'منحلّ النظام يتساقط حبّه؛ والعُرى: «جمع عروة، وهي طوق القلادة» [@asmaiyyat، ص200، الحاشية].'
- term: الْمَهَاوِي
  text: «جمع مهوى، وهو موضع الهوى» [@asmaiyyat، ص200، الحاشية]، أي مواضع السقوط.
- term: مَا يَلِيقُ
  text: 'لا يحتبس ولا يثبت؛ يقال: «وما يليق بكفه درهم أي ما يحتبس» [@lisan، ج10 ص334].'
