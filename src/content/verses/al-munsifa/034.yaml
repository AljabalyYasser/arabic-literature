explained: false
first: وَسَائِلَةٍ بِثَعْلَبَةَ بْنِ سَيْرٍ
second: وَقَدْ أَوْدَتْ بِثَعْلَبَةَ الْعَلُوقُ
vocabulary:
- term: وَسَائِلَةٍ
  text: ورُبّ امرأة تسأل.
- term: بِثَعْلَبَةَ بْنِ سَيْرٍ
  text: '«أراد: بثعلبة بن سيار فجعله سيرًا للضرورة»؛ وقال ابن بري: «البيت للمفضل النكري يذكر أن ثعلبة بن سيار كان في أسره» [@lisan، ج4 ص391].'
- term: أَوْدَتْ
  text: أهلكت.
- term: الْعَلُوقُ
  text: المنية؛ «والعلوق المنية، صفة غالبة» [@lisan، ج10 ص265].
