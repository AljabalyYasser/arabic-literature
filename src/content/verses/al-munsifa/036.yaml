first: تَشُقُّ الْأَرْضَ شَائِلَةَ الذُّنَابَى
second: وَهَادِيهَا كَأَنْ جِذْعٌ سَحُوقُ
vocabulary:
- term: شَائِلَةَ الذُّنَابَى
  text: 'رافعة ذنبها؛ «والذنابى: الذنب» [@lisan، ج1 ص389].'
- term: وَهَادِيهَا
  text: 'عنقها؛ «والهادي: العنق لتقدمه» [@lisan، ج15 ص356].'
- term: جِذْعٌ سَحُوقُ
  text: '«والجذع: ساق النخلة» [@asmaiyyat، ص203، الحاشية]؛ «ونخلة سحوق: طويلة» [@lisan، ج10 ص154].'
