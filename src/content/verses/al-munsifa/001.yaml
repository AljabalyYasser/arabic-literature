explained: false
first: أَلَمْ تَرَ أَنَّ جِيرَتَنَا اسْتَقَلُّوا
second: فَنِيَّتُنَا وَنِيَّتُهُمْ فَرِيقُ
vocabulary:
- term: جِيرَتَنَا
  text: جيراننا، يعني قوم سُلَيْمَى.
- term: اسْتَقَلُّوا
  text: ارتحلوا ومضوا.
- term: نِيَّتُنَا
  text: 'وجهتنا في السفر؛ والنية: «الوجه الذي ينويه المسافر» [@asmaiyyat، ص200، الحاشية].'
- term: فَرِيقُ
  text: 'متفرّقة، أي وجهتنا غير وجهتهم؛ و«نيّة فريق: مفرّقة» [@lisan، ج10 ص301].'
