explained: false
first: تَلَاقَيْنَا بِغَيْبَةِ ذِي طُرَيْفٍ
second: وَبَعْضُهُمُ عَلَى بَعْضٍ حَنِيقُ
vocabulary:
- term: بِغَيْبَةِ
  text: 'الغيبة: «الهبطة من الأرض» [@asmaiyyat، ص200، الحاشية]؛ و«وقعنا في غيبة من الأرض أي في هبطة» [@lisan، ج1 ص655].'
- term: ذِي طُرَيْفٍ
  text: «موضع بالبحرين كان لهم فيه وقعة» [@asmaiyyat، ص201، الحاشية].
- term: حَنِيقُ
  text: 'شديد الغيظ؛ قال ابن بري: «وقد جاء حنيق بمعنى مُحنَق»، وأنشد البيت [@lisan، ج10 ص70].'
