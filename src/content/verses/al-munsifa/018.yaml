explained: false
first: لَقِينَا الْجَهْمَ ثَعْلَبَةَ بْنَ سَيْرٍ
second: أَضَرَّ بِمَنْ يُجَمِّعُ أَوْ يَسُوقُ
vocabulary:
- term: الْجَهْمَ
  text: 'العابس الغليظ الوجه؛ والجهم «من الوجوه: الغليظ المجتمع في سماجة» [@lisan، ج12 ص110].'
- term: ثَعْلَبَةَ بْنَ سَيْرٍ
  text: «يعني به ثعلبة بن سيار» [@asmaiyyat، ص201، الحاشية]، غيّر اسمه للضرورة [@lisan، ج4 ص391]. وابنه «حنظلة بن ثعلبة بن سيّار العجلي» كان على ميسرة بَكْر يوم ذي قار [@naqaid، ج3 ص794].
