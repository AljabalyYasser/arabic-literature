explained: false
first: وَبَسْلٌ أَنْ تَرَى فِيهِمْ كَمِيًّا
second: كَبَا لِيَدَيْهِ إِلَّا فِيهِ فُوقُ
vocabulary:
- term: وَبَسْلٌ
  text: 'وحرامٌ؛ «والبسل من الأضداد: وهو الحرام والحلال» [@lisan، ج11 ص55]، «وهو ها هنا الحرام» كما في الشنقيطية [@asmaiyyat، ص201، الحاشية]، أي لن ترى.'
- term: كَمِيًّا
  text: شجاعًا مستترًا بسلاحه.
- term: كَبَا لِيَدَيْهِ
  text: سقط على وجهه.
- term: فُوقُ
  text: الفُوق من السهم «موضع الوتر» [@lisan، ج10 ص320]، أي لا تجد صريعًا إلا وفيه سهم.
