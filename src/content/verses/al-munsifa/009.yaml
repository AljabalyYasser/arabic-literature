first: وَهُمْ دَفَعُوا الْمَنِيَّةَ فَاسْتَقَلَّتْ
second: دِرَاكًا بَعْدَ مَا كَادَتْ تَحِيقُ
vocabulary:
- term: فَاسْتَقَلَّتْ
  text: ارتفعت عنهم ومضت.
- term: دِرَاكًا
  text: 'متتابعًا؛ يقال: «وضرب دراك: متتابع» [@lisan، ج10 ص420].'
- term: تَحِيقُ
  text: 'تنزل بهم؛ «وحاق به الشيء يحيق حيقًا: نزل به وأحاط به» [@lisan، ج10 ص71].'
