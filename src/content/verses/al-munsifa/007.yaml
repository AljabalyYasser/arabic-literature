explained: false
first: فِدَاءٌ خَالَتِي لِبَنِي حُيَيٍّ
second: خُصُوصًا يَوْمَ كُسُّ الْقَوْمِ رُوقُ
vocabulary:
- term: فِدَاءٌ خَالَتِي
  text: أي خالتي فداء لهم، ثناءً عليهم.
- term: بَنِي حُيَيٍّ
  text: قوم لم تعرّفهم المصادر المعتمدة. وظاهر البيت 32 أنهم في صفّ الشاعر، وجعلهم المحققان من أعدائه الذين أنصفهم [@asmaiyyat، ص199، الحاشية].
- term: كُسُّ الْقَوْمِ رُوقُ
  text: 'الكُسّ جمع أكسّ، والكسس «قصر الأسنان وصغرها» [@lisan، ج6 ص196]؛ و«الرُّوق: الطِّوال الأسنان، وهو جمع الأروق» [@lisan، ج10 ص135]. وفي هامش الشنقيطية: «وأراد أنه إذا قتل قلص عن أسنانه فتبين روقًا» [@asmaiyyat، ص200، الحاشية].'
