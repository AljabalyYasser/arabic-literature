first: فَأَشْبَعْنَا السِّبَاعَ وَأَشْبَعُوهَا
second: فَرَاحَتْ كُلُّهَا تَئِقٌ يَفُوقُ
vocabulary:
- term: تَئِقٌ
  text: 'ممتلئ؛ «تئق السقاء يتأق تأقًا، فهو تئق: امتلأ» [@lisan، ج10 ص31].'
- term: يَفُوقُ
  text: 'يتردد نفَسه من شدة الامتلاء؛ «ويقال للإنسان تشخص الريح في صدره: فاق يفوق فواقًا» [@lisan، ج10 ص320].'
