first: قَتَلْنَا الْحَارِثَ الْوَضَّاحَ مِنْهُمْ
second: فَخَرَّ كَأَنَّ لِمَّتَهُ الْعُذُوقُ
vocabulary:
- term: الْحَارِثَ الْوَضَّاحَ
  text: 'رجل من خصومهم لم تعرّفه المصادر المعتمدة؛ والوضّاح: الأبيض المشرق.'
- term: لِمَّتَهُ
  text: شعر رأسه المسترسل.
- term: الْعُذُوقُ
  text: '«جمع عذق، وهو بكسر العين: العرجون بما فيه من الشماريخ» [@asmaiyyat، ص202، الحاشية]؛ «والعِذق: الكباسة» [@lisan، ج10 ص238].'
