first: بِكُلِّ مَجَالَةٍ غَادَرْتُ خِرْقًا
second: مِنَ الْفِتْيَانِ مَبْسِمُهُ رَقِيقُ
vocabulary:
- term: مَجَالَةٍ
  text: موضع تجول فيه الخيل، أي معترك.
- term: غَادَرْتُ
  text: تركتُ.
- term: خِرْقًا
  text: '«والخرق من الفتيان: الظريف في سماحة ونجدة» [@lisan، ج10 ص74].'
- term: مَبْسِمُهُ
  text: ثغره.
