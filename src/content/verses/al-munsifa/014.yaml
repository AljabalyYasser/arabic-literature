first: كَأَنَّ النَّبْلَ بَيْنَهُمُ جَرَادٌ
second: تُكَفِّيهِ شَآمِيَةٌ خَرِيقُ
vocabulary:
- term: النَّبْلَ
  text: السهام.
- term: تُكَفِّيهِ
  text: تقلبه، من كفّأ الشيءَ إذا قلبه [@lisan، ج1 ص140]، وسُهّلت الهمزة [@asmaiyyat، ص201، الحاشية].
- term: شَآمِيَةٌ
  text: 'ريح الشمال؛ «ويقال لهذه الشمال: الشامية» [@lisan، ج1 ص771].'
- term: خَرِيقُ
  text: «الباردة الشديدة الهبوب» [@asmaiyyat، ص201، الحاشية].
