first: هُمُ صَبَرُوا وَصَبْرُهُمُ تَلِيدٌ
second: عَلَى الْعَزَّاءِ إِذْ بَلَغَ الْمَضِيقُ
vocabulary:
- term: تَلِيدٌ
  text: قديم موروث، «وأصله المال القديم» [@asmaiyyat، ص200، الحاشية].
- term: الْعَزَّاءِ
  text: 'الشدة [@asmaiyyat، ص200، الحاشية]؛ و«العزّاء: السنة الشديدة... وقيل: هي الشدة» [@lisan، ج5 ص377].'
- term: الْمَضِيقُ
  text: الموضع الضيق، يريد اشتداد الحرب.
