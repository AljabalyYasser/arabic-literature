first: فَلَمَّا اسْتَيْقَنُوا بِالصَّبْرِ مِنَّا
second: تُذُكِّرَتِ الْعَشَائِرُ وَالْحَزِيقُ
vocabulary:
- term: تُذُكِّرَتِ الْعَشَائِرُ
  text: ذُكرت القرابة بين العشائر؛ وفسّره المحققان بأن الحنين والقرابة عطفا الفريقين فكفّوا عن القتال [@asmaiyyat، ص199، الحاشية].
- term: الْحَزِيقُ
  text: '«الأَصْمَعِيّ: الحزيق الجماعة من الناس» [@lisan، ج10 ص47].'
