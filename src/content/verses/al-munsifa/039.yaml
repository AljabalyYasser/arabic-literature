first: وَأَنْعَمْنَا وَأَبْأَسْنَا عَلَيْهِمْ
second: لَنَا فِي كُلِّ أَبْيَاتٍ طَلِيقُ
vocabulary:
- term: وَأَبْأَسْنَا
  text: أنزلنا بهم البؤس والشدة.
- term: أَبْيَاتٍ
  text: بيوت، أي في كل بيت من بيوتهم.
- term: طَلِيقُ
  text: «الأسير الذي أطلق عنه إساره وخلي سبيله» [@lisan، ج10 ص227].
