first: وَجَدْنَا السِّدْرَ خَوَّارًا ضَعِيفًا
second: وَكَانَ النَّبْعُ مَنْبِتُهُ وَثِيقُ
vocabulary:
- term: السِّدْرَ
  text: شجر النَّبِق.
- term: خَوَّارًا
  text: ضعيفًا ينكسر.
- term: النَّبْعُ
  text: شجر «من أشجار الجبال تتخذ منه القسي» [@lisan، ج8 ص345]، «لشدته ورزانته» [@asmaiyyat، ص201، الحاشية].
- term: مَنْبِتُهُ وَثِيقُ
  text: أصله محكم متين.
