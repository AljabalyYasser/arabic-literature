explained: false
first: فَأَبْقَيْنَا وَلَوْ شِئْنَا تَرَكْنَا
second: لُجَيْمًا لَا تَقُودُ وَلَا تَسُوقُ
vocabulary:
- term: فَأَبْقَيْنَا
  text: أبقينا عليهم فلم نستأصلهم.
- term: لُجَيْمًا
  text: «قبيلة، وهو لجيم بن صعب بن علي بن بَكْر بن وائِل» [@asmaiyyat، ص203، الحاشية].
- term: لَا تَقُودُ وَلَا تَسُوقُ
  text: لا تبقى لها خيل تقودها ولا إبل تسوقها؛ «وأكثر ما يكون القود للخيل، وأكثر ما يكون السوق للإبل» [@asmaiyyat، ص203، الحاشية].
