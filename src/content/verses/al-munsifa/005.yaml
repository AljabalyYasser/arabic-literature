first: تُلَهِّي الْمَرْءَ بِالْحُدْثَانِ لَهْوًا
second: وَتَحْدِجُهُ كَمَا حُدِجَ الْمُطِيقُ
vocabulary:
- term: بِالْحُدْثَانِ
  text: بالأحاديث؛ وقد جمعوا الحديث على «حِدْثان وحُدْثان، وهو قليل» [@lisan، ج2 ص133].
- term: وَتَحْدِجُهُ
  text: 'تركبه وتذلّله كما يُشدّ الحِدْج، وهو مركب النساء، على البعير؛ قال في اللسان: «هو مثل أي تغلبه بدلّها وحديثها حتى يكون من غلبتها له كالمحدوج المركوب الذليل من الجمال» [@lisan، ج2 ص231].'
- term: الْمُطِيقُ
  text: البعير الذي يطيق الحمل.
