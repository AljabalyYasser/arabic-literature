first: أَصَابَتْهُ رِمَاحُ بَنِي حِيَيٍّ
second: فَخَرَّ كَأَنَّهُ سَيْفٌ دَلُوقُ
vocabulary:
- term: بَنِي حِيَيٍّ
  text: 'هم بنو حُيَيّ في البيت 7؛ وكُسرت الحاء هنا، وفي هامش الشنقيطية: «كسرت الحاء إتباعًا للياء» [@asmaiyyat، ص203، الحاشية].'
- term: دَلُوقُ
  text: «سلس الخروج من غمده يخرج من غير سل، وهو أجود السيوف وأخلصها» [@lisan، ج10 ص102].
