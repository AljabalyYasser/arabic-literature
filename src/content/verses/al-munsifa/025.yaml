first: وَكَمْ مِنْ سَيِّدٍ مِنَّا وَمِنْهُمْ
second: بِذِي الطَّرْفَاءِ مَنْطِقُهُ شَهِيقُ
vocabulary:
- term: بِذِي الطَّرْفَاءِ
  text: موضع [@asmaiyyat، ص202، الحاشية]، لم تحدّده المصادر المعتمدة.
- term: شَهِيقُ
  text: 'نَفَس يتردد في صدره، يريد أنه يجود بنفسه؛ يقال: شهق «ردّد البكاء في صدره» [@lisan، ج10 ص191].'
