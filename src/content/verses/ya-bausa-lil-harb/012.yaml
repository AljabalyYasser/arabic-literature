first: إِنَّ الْمُوَائِلَ خَوْفَهَا
second: يَعْتَاقُهُ الْأَجَلُ الْمُتَاحُ
vocabulary:
- term: الْمُوَائِلَ
  text: 'طالب النجاة؛ يقال: «واءل منه على فاعل أي طلب النجاة» [@lisan، ج11 ص715].'
- term: يَعْتَاقُهُ
  text: 'يحبسه؛ «واعتاقه، كله: صرفه وحبسه» [@lisan، ج10 ص279].'
- term: الْمُتَاحُ
  text: 'المقدَّر؛ «وأتاحه له: قدّره له» [@lisan، ج2 ص418].'
