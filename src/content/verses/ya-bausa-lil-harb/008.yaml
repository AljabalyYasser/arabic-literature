explained: false
first: فَالْهَمُّ بَيْضَاتُ الْخُدُوـ
second: ـرِ هُنَاكَ لَا النَّعَمُ الْمُرَاحُ
vocabulary:
- term: بَيْضَاتُ الْخُدُورِ
  text: 'النساء المصونات؛ «وبيضة الخدر: الجارية لأنها في خدرها مكنونة» [@lisan، ج7 ص125].'
- term: النَّعَمُ الْمُرَاحُ
  text: 'الإبل المردودة عشيًّا إلى مأواها؛ يقال: «أرحتها أنا إذا رددتها إلى المُراح»، «والمُراح، بالضم: حيث تأوي إليه الإبل والغنم بالليل» [@lisan، ج2 ص465].'
