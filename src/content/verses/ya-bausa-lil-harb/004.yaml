first: وَالنَّثْرَةُ الْحَصْدَاءُ وَالْـ
second: ـبَيْضُ الْمُكَلَّلُ وَالرِّمَاحُ
vocabulary:
- term: النَّثْرَةُ
  text: 'الدرع؛ «والنثرة: الدرع السلسة الملبس، وقيل: هي الدرع الواسعة» [@lisan، ج5 ص193].'
- term: الْحَصْدَاءُ
  text: 'المحكمة؛ «ودرع حصداء: صلبة شديدة محكمة» [@lisan، ج3 ص152].'
- term: الْبَيْضُ الْمُكَلَّلُ
  text: 'البيض: الخُوَذ، واحدتها بَيْضة، «سميت بذلك لأنها على شكل بيضة النعام» [@lisan، ج7 ص125]. والمكلَّل: كأنه أُلبس إكليلًا، من «كلّله أي ألبسه الإكليل» [@lisan، ج11 ص596].'
