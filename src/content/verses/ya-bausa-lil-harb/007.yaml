first: كَشَفَتْ لَهُمْ عَنْ سَاقِهَا
second: وَبَدَا مِنَ الشَّرِّ الصُّرَاحُ
vocabulary:
- term: كَشَفَتْ لَهُمْ عَنْ سَاقِهَا
  text: 'اشتدت؛ «الساق في اللغة الأمر الشديد، وكشفه مثل في شدة الأمر»، وعليه أُنشد هذا البيت: «بيت الحماسة لجد طَرَفَة» [@lisan، ج10 ص168].'
- term: الصُّرَاحُ
  text: الخالص.
