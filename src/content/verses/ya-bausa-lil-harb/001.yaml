explained: false
first: يَا بُؤْسَ لِلْحَرْبِ الَّتِي
second: وَضَعَتْ أَرَاهِطَ فَاسْتَرَاحُوا
vocabulary:
- term: يَا بُؤْسَ لِلْحَرْبِ
  text: 'البؤس: الشدة. ونقل البغدادي عن المُبَرِّد: «كأنه دعاء على الحرب» [@khizana، ج1 ص469].'
- term: وَضَعَتْ أَرَاهِطَ
  text: 'قال البغدادي: «حطتهم وأسقطتهم فلم يكن لهم ذكر شرف في هذه الحرب» [@khizana، ج1 ص469]، فاستراحوا من عنائها. والأراهط جمع رَهْط، وهو «عدد يجمع من ثلاثة إلى عشرة» [@lisan، ج7 ص305].'
