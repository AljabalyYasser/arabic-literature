first: مَنْ صَدَّ عَنْ نِيرَانِهَا
second: فَأَنَا ابْنُ قَيْسٍ لَا بَرَاحُ
vocabulary:
- term: صَدَّ
  text: أعرض.
- term: ابْنُ قَيْسٍ
  text: قيس بن ثعلبة، جده الأعلى [@khizana، ج1 ص474]، «وأضاف نفسه إلى جده الأعلى لشهرته به» [@khizana، ج1 ص467].
- term: لَا بَرَاحُ
  text: لا أبرح مكاني؛ والبراح «مصدر برح الشيء براحًا ... إذا زال من مكانه» [@khizana، ج1 ص468].
