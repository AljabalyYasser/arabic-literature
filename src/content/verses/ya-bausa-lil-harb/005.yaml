first: وَتَسَاقَطَ الْأَوْشَاظُ وَالـ
second: ـذَّنَبَاتُ إِذْ جُهِدَ الْفِضَاحُ
vocabulary:
- term: الْأَوْشَاظُ
  text: 'الدخلاء في القوم؛ «والوشيظة والوشيظ: الدخلاء في القوم ليسوا من صميمهم» [@lisan، ج7 ص465].'
- term: الذَّنَبَاتُ
  text: 'الأتباع؛ «وأذناب الناس وذنباتهم: أتباعهم وسفلتهم دون الرؤساء» [@lisan، ج1 ص389].'
- term: إِذْ جُهِدَ الْفِضَاحُ
  text: 'حين اشتدت الفضيحة وبلغت غايتها؛ والفِضاح: الفضيحة.'
