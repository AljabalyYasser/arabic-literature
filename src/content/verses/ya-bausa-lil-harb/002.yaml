explained: false
first: وَالْحَرْبُ لَا يَبْقَى لِجَاـ
second: ـحِمِهَا التَّخَيُّلُ وَالْمِرَاحُ
vocabulary:
- term: لِجَاحِمِهَا
  text: 'جاحم الحرب: «معظمها، وقيل: شدة القتل في معتركها» [@lisan، ج12 ص85]، من «جحمت النار فهي جاحمة إذا اضطرمت» [@khizana، ج1 ص470]. وفي «الأغاني»: «لصاحبها» [@aghani، ج5 ص51].'
- term: التَّخَيُّلُ
  text: التكبر، من الخُيَلاء [@khizana، ج1 ص470].
- term: الْمِرَاحُ
  text: 'النشاط والبطر؛ قال البغدادي: «أي إنها تكف حدة البطر النشيط» [@khizana، ج1 ص470].'
