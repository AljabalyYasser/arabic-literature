first: بِئْسَ الْخَلَائِفُ بَعْدَنَا
second: أَوْلَادُ يَشْكُرَ وَاللَّقَاحُ
vocabulary:
- term: الْخَلَائِفُ
  text: جمع خليفة، وهو من يخلف القوم بعدهم.
- term: يَشْكُرَ
  text: «وبنو يَشْكُر قبيلة في بَكْر بن وائِل» [@lisan، ج4 ص427].
- term: اللَّقَاحُ
  text: 'بنو حنيفة، «سُمّوا بذلك لأنهم لا يدينون بالطاعة للملوك، وكانوا قد اعتزلوا حرب بَكْر وتَغْلِب إلا الفند الزماني» [@lisan، ج2 ص409]. وقيل: هي بكسر اللام، جمع لِقْحة، وهي الناقة ذات اللبن، وقال البغدادي: «وهذا ليس بالوجه» [@khizana، ج1 ص471].'
