first: "إِذَا مَا رَآنِي النَّاسُ قَالُوا أَلَمْ يَكُنْ"
second: "حَدِيثًا جَدِيدَ الْبَرْيِ غَيْرَ كَهَامِ"
vocabulary:
  - term: "جَدِيدَ الْبَرْيِ"
    text: "كالسهم أو العود الذي نُحت حديثًا؛ «برى العود والقلم والقدح وغيرها يبريه بريا: نحته» [@lisan، ج14 ص70]. وفي الديوان كما يذكر محققو «الأغاني»: «جديد البز»، «والبز: السلاح» [@aghani-dk، ج18 ص142، الحاشية]."
  - term: "كَهَامِ"
    text: "«ورجل كهام وكهيم: ثقيل مسن دثور لا غناء عنده» [@lisan، ج12 ص529]."
