explained: false
first: "كَأَنِّي وَقَدْ جَاوَزْتُ تِسْعِينَ حِجَّةً"
second: "خَلَعْتُ بِهَا عَنِّي عِنَانَ لِجَامِي"
vocabulary:
  - term: "حِجَّةً"
    text: "سنة؛ «والحجة: السنة، والجمع حجج» [@lisan، ج2 ص227]."
  - term: "عِنَانَ لِجَامِي"
    text: "«وعنان اللجام: السير الذي تمسك به الدابة» [@lisan، ج13 ص291]. فكأنه فرس خُلع عنه لجامه، فلا يُركب ولا يُقاد."
