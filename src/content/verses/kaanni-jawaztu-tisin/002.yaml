first: "عَلَى الرَّاحَتَيْنِ مَرَّةً وَعَلَى الْعَصَا"
second: "أَنُوءُ ثَلَاثًا بَعْدَهُنَّ قِيَامِي"
meaning: "إذا أراد أن يقوم لم يستطع دفعة واحدة: ينهض مثقلًا، مرة متكئًا على راحتيه ومرة على عصاه، ثلاث نهضات، ثم يستوي قائمًا بعدها."
vocabulary:
  - term: "الرَّاحَتَيْنِ"
    text: "مثنى الراحة، وهي باطن الكف."
  - term: "أَنُوءُ"
    text: "أنهض مثقلًا؛ «ويقال: ناء بالحمل إذا نهض به مثقلا»، وناء: «نهض بجهد ومشقة» [@lisan، ج1 ص174]."
  - term: "قِيَامِي"
    text: "أن أستوي قائمًا."
context: "بعد البيت الأول الذي جعل فيه نفسه كفرس خُلع لجامه، يرسم هنا كيف يقوم من مجلسه، فهذه صورة العجز التي يُبنى عليها ما بعدها، ثم يذكر سببه في البيت الثالث. وفي ترتيب ابن قُتَيْبة هو البيت السادس، بعد «فَلَوْ أَنَّنِي أُرْمَى بِنَبْلٍ رَأَيْتُهَا» [@ibn-qutayba، ج1 ص365]. وفي رواية الشَّعْبِيّ أن عبد الملك بن مَرْوان أنشده في مرضه الأخير مع «كأني وقد جاوزت» [@aghani-dk، ج18 ص143]."
syntax:
  - "«على الراحتين» جار ومجرور متعلق بـ«أنوء»، و«مرةً» منصوب على الظرفية، أي في مرة، و«وعلى العصا» معطوف على «على الراحتين»، ويُفهم منه «مرةً» أخرى."
  - "«أنوء» فعل مضارع مرفوع، والفاعل ضمير مستتر تقديره «أنا». وقد تقدّم عليه متعلّقاه."
  - "«ثلاثًا» نائب عن المفعول المطلق، أي ثلاث نَوْءات، فحُذف المصدر وبقي عدده."
  - "«بعدهنّ قيامي»: «بعدَ» ظرف متعلق بمحذوف خبر مقدم، والضمير «هنّ» للنَّوْءات الثلاث، و«قيامي» مبتدأ مؤخر. والجملة صفة لـ«ثلاثًا»."
morphology:
  - "«أنوء» من «ناء ينوء نَوْءًا»، فعل أجوف واوي مهموز اللام."
  - "«الراحتين» مثنى «راحة»، وأصل ألفها واو، من «روح»."
  - "«قيامي» مصدر «قام يقوم»، وأصله «قِوام»، قُلبت الواو ياء لانكسار ما قبلها."
rhetoric:
  thesis: "الكبر مرسوم بالحركة: لا يقول الشيخ إنه ضعف، بل يعدّ نهضاته قبل أن يقوم."
  devices:
    - title: "الكناية"
      text: "البيت كله، من «عَلَى الرَّاحَتَيْنِ» إلى «قِيَامِي»، كناية عن الهرم: لم يذكر الضعف بلفظه، بل ذكر ما يلزمه في الواقع. وهذه الكناية عند عبد القاهر: «أن يريد المتكلم إثبات معنى من المعاني، فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "التقديم"
      text: "قدّم «عَلَى الرَّاحَتَيْنِ مَرَّةً وَعَلَى الْعَصَا» على الفعل «أَنُوءُ»، فبدأ البيت بما يتكئ عليه، فيرى السامع اليدين والعصا قبل أن يسمع النهوض. ويقول عبد القاهر في هذا الباب إنه «باب كثير الفوائد، جم المحاسن»، وإنك تجد الشعر يروقك فإذا نظرت وجدت السبب «أن قدم فيه شيء، وحول اللفظ عن مكان إلى مكان» [@dalail، ص106]، ويمتحن ذلك بأن تزيل الجار والظرف عن مكانهما في بيت ثم تنظر «كيف يذهب الحسن والحلاوة» [@dalail، ص99]."
    - title: "العدد"
      text: "في «ثَلَاثًا» يعدّ الشيخ نهضاته كما يعدّ سنيه في البيت الأول «تِسْعِينَ حِجَّةً»، فالعدد في القطعة كلها علامة الكبر. وهذا قراءتنا."
  connection: "ثم يذكر في البيت التالي سبب هذا العجز: سهام يُرمى بها ولا يراها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة تليها ياء الإشباع، وقبلها ألف الرِّدْف"
  scansion: "عَلَرْ رَا / حَتَيْنِ مَرْ / رَتَنْ وَ / عَلَلْ عَصَا = فعولن / مفاعلن / فعولُ / مفاعلن — أَنُوءُ / ثَلَاثَنْ بَعْ / دَهُنْنَ / قِيَامِي = فعولُ / مفاعيلن / فعولُ / فعولن"
  note: "«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، أي «مفاعلن» بحذف الخامس الساكن. وضرب القطعة كلها محذوف: حُذف السبب الأخير من «مفاعيلن» فصارت «مفاعي»، وتُكتب «فعولن» [@atiq، ص30]. ودخل القبض حشو البيت: «مفاعيلن» الأولى من الصدر صارت «مفاعلن»، و«فعولن» صارت «فعولُ» مرة في الصدر ومرتين في العَجُز."
