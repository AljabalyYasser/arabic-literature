first: "رَمَتْنِي بَنَاتُ الدَّهْرِ مِنْ حَيْثُ لَا أَرَى"
second: "فَمَا بَالُ مَنْ يُرْمَى وَلَيْسَ بِرَامِ"
meaning: "أصابتني مصائب الدهر من حيث لا أراها فأتّقيها، فكيف حال من يُرمى ولا يقدر أن يردّ الرمي على من رماه؟"
vocabulary:
  - term: "بَنَاتُ الدَّهْرِ"
    text: "يقول محقق ابن قُتَيْبة أحمد شاكر: «بنات الدهر: حوادثه ومصائبه» [@ibn-qutayba، ج1 ص365، الحاشية]."
  - term: "فَمَا بَالُ"
    text: "ما حال؛ «والبال: الحال والشأن» [@lisan، ج11 ص74]."
  - term: "بِرَامِ"
    text: "برامٍ، أي ليس يرمي هو."
context: "هذا البيت الذي أنشده حَمّاد الراوية حين سئل «من أشعر الناس؟»، ثم قال: «والشعر لعمرو بن قميئة» [@aghani-dk، ج18 ص142]. وبه تبدأ القطعة في ترتيب ابن قُتَيْبة [@ibn-qutayba، ج1 ص365]. وفي ترتيب «الأغاني» يأتي بعد صورة الشيخ الذي ينهض ثلاثًا، فيذكر سبب عجزه: عدو لا يُرى."
syntax:
  - "«رمتني» فعل ماض، والتاء للتأنيث، والنون للوقاية، والياء مفعول به. و«بناتُ» فاعل، و«الدهرِ» مضاف إليه."
  - "«من حيثُ» جار ومجرور متعلق بـ«رمتني». و«حيثُ» ظرف مبني على الضم في محل جر، وجملة «لا أرى» في محل جر بإضافة «حيث» إليها، ومفعول «أرى» محذوف، أي لا أراها."
  - "«فما بالُ مَن يُرمى»: «ما» اسم استفهام مبتدأ، و«بالُ» خبره، و«مَن» اسم موصول مضاف إليه، وجملة «يُرمى» صلته، ونائب الفاعل ضمير يعود على «مَن»."
  - "«وليس برامِ»: الواو حالية، و«ليس» واسمها ضمير مستتر، والباء حرف جر زائد، و«رامٍ» خبر «ليس» مجرور لفظًا منصوب محلًّا. والجملة حال من نائب الفاعل."
morphology:
  - "«يُرمى» مضارع «رمى يرمي» مبني للمجهول، فعل ناقص يائي، قُلبت ياؤه ألفًا."
  - "«رامٍ» اسم فاعل من «رمى»، منقوص حُذفت ياؤه لأنه نكرة، ورُدّت في القافية بإشباع الكسرة."
  - "«بنات» جمع «بنت» جمعًا مؤنثًا سالمًا."
rhetoric:
  thesis: "البيت الذي تقوم عليه القطعة: الكبر حرب يخسرها الشيخ لأنه لا يرى عدوه ولا يملك أن يرميه."
  devices:
    - title: "الاستعارة"
      text: "في «رَمَتْنِي بَنَاتُ الدَّهْرِ» جعل للدهر بنات، ولبناته رميًا، وليس للدهر بنات ولا سهام. وهذا عند عبد القاهر الضرب الذي تجعل فيه «للشيء الشيء ليس له»، كما ادّعى لَبِيد أن للشَّمال يدًا في «إذ أصبحت بيد الشمال زمامها» [@dalail، ص67]."
    - title: "الاستفهام"
      text: "«فَمَا بَالُ مَنْ يُرْمَى» سؤال لا ينتظر جوابًا، معناه الشكوى والتعجب: لا حال لمن هذه حاله. ولم يقل «فما بالي»، بل جعل نفسه «مَن»، فصارت الشكوى حكمًا على كل شيخ."
    - title: "التصدير"
      text: "افتتح البيت بـ«رَمَتْنِي» وختمه بـ«رَامِ»، والكلمتان من أصل واحد. وهذا قريب من «التصدير» عند ابن رَشِيق: «أن يرد أعجاز الكلام على صدوره، فيدل بعضه على بعض»، ومن أقسامه ما يوافق فيه آخر البيت أوله [@ibn-rashiq، ج2 ص3]. فالبيت يبدأ بالرمي الواقع عليه، وينتهي بنفي أن يكون هو راميًا."
  connection: "ثم يفسّر في البيت التالي ما معنى أنه ليس برامٍ: لو كان يُرمى بنبل لرمى بمثلها، لكنه يُرمى بغير سهام."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة، وقبلها ألف الرِّدْف"
  scansion: "رَمَتْنِي / بَنَاتُدْ دَهْ / رِمِنْ حَيْ / ثُ لَا أَرَى = فعولن / مفاعيلن / فعولن / مفاعلن — فَمَا بَا / لُ مَنْ يُرْمَى / وَلَيْسَ / بِرَامِي = فعولن / مفاعيلن / فعولُ / فعولن"
  note: "العَرُوض مقبوضة «مفاعلن» والضرب محذوف «فعولن» كسائر القطعة [@atiq، ص29–30]. ودخل القبض «فعولن» الثالثة من العَجُز فصارت «فعولُ»."
