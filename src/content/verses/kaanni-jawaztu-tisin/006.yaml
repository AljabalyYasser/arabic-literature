first: "وَأَفْنَى وَمَا أُفْنِي مِنَ الدَّهْرِ لَيْلَةً"
second: "وَلَمْ يُغْنِ مَا أَفْنَيْتُ سِلْكَ نِظَامِ"
vocabulary:
  - term: "سِلْكَ نِظَامِ"
    text: "خيطًا يُنظم فيه الخرز؛ «الخيط: السلك» [@lisan، ج7 ص298]، «والنظام: ما نظمت فيه الشيء من خيط وغيره» [@lisan، ج12 ص578]. أي إن ما أبلاه من عمره لم يغن عنه شيئًا، ولا قدر خيط."
