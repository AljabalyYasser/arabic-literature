explained: false
first: أُنُفٍ كَلَوْنِ دَمِ الْغَزَالِ مُعَتَّقٍ
second: مِنْ خَمْرِ عَانَةَ أَوْ كُرُومِ شَبَامِ
vocabulary:
- term: أُنُفٍ
  text: «الخمر التي لم يُستخرج من دنّها شيء قبلها» [@lisan، ج9 ص14].
- term: مُعَتَّقٍ
  text: قديم طال مكثه في الدنّ.
- term: عَانَةَ
  text: «قرية على الفرات فوق هيت» [@lisan، ج12 ص317].
- term: شَبَامِ
  text: 'موضع بالشام عند أبي عبيدة، وقيل: جبل باليمن [@lisan، ج12 ص317].'
