explained: false
first: عُوجَا عَلَى الطَّلَلِ الْمُحِيلِ لِأَنَّنَا
second: نَبْكِي الدِّيَارَ كَمَا بَكَى ابْنُ خِذَامِ
vocabulary:
- term: عُوجَا
  text: مِيلا واعطفا راحلتيكما.
- term: الْمُحِيلِ
  text: «الذي أتت عليه أحوال وغيّرته» [@ibn-qutayba، ج1 ص129، الحاشية].
- term: ابْنُ خِذَامِ
  text: '«رجل جاهلي من الشعراء» [@lisan، ج12 ص169]. وقال ابن سلّام: «رجل من طيئ لم نسمع شعره الذي بكى فيه، ولا شعرًا غير هذا البيت الذي ذكره امرؤ القَيْس» [@ibn-sallam، ج1 ص39].'
