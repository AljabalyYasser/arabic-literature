explained: false
first: أَبْلِغْ سُبَيْعًا إِنْ عَرَضْتَ رِسَالَةً
second: أَنِّي كَهَمِّكَ إِنْ عَشَوْتُ أُحَامِي
vocabulary:
- term: سُبَيْعًا
  text: سُبَيْع بن عوف بن مالك بن حنظلة، وفيه قيلت القصيدة بحسب مقدمتها في الديوان [@diwan-imru-al-qais، ص114].
- term: عَرَضْتَ
  text: 'أتيت العَروض: «وعَرَضَ الرجلُ إذا أتى العَروضَ، وهي مكة والمدينة وما حولهما» [@lisan، ج7 ص173].'
- term: أُحَامِي
  text: أدافع وأحمي.
