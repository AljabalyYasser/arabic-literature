first: أَبْلِغْ سُبَيْعًا إِنْ عَرَضْتَ رِسَالَةً
second: إِنِّي كَهَمِّكَ إِنْ عَشَوْتُ أَمَامِي
vocabulary:
- term: سُبَيْعًا
  text: سُبيع بن عَوْف من بني طُهيّة، وفيه قيلت القصيدة بحسب مقدمتها في الديوان.
- term: عَرَضْتَ
  text: 'أتيت العَروض: «وعَرَضَ الرجلُ إذا أتى العَروضَ، وهي مكة والمدينة وما حولهما» [@lisan، ج7 ص173].'
