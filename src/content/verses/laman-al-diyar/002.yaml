first: فَصَفَا الْأَطِيطِ فَصَاحَتَيْنِ فَغَاضِرٍ
second: تَمْشِي النِّعَاجُ بِهَا مَعَ الْآرَامِ
vocabulary:
- term: صَفَا الْأَطِيطِ
  text: موضع، ومثله صاحتان وغاضر.
- term: النِّعَاجُ
  text: بقر الوحش.
- term: الْآرَامِ
  text: الظباء البيض، واحدها رِئْم.
