explained: false
first: وَأَنَا الَّذِي عَرَفَتْ مَعَدٌّ فَضْلَهُ
second: وَنَشَدْتُ عَنْ حُجْرِ ابْنِ أُمِّ قَطَامِ
vocabulary:
- term: مَعَدٌّ
  text: قبائل العرب من ولد معدّ بن عدنان.
- term: نَشَدْتُ
  text: «أي رفعت ذكره وفخرت به وشهرته» [@diwan-imru-al-qais، ص118].
- term: حُجْرِ ابْنِ أُمِّ قَطَامِ
  text: أبو الشاعر، قتله بنو أَسَد «وهو ابن أم قطام» [@khizana، ج2 ص213].
