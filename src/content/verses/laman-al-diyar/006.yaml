first: حُورًا تُعَلَّلُ بِالْعَبِيرِ جُلُودُهَا
second: بِيضَ الْوُجُوهِ نَوَاعِمَ الْأَجْسَامِ
vocabulary:
- term: حُورًا
  text: جمع حوراء، وهي التي اشتدّ بياض عينها في شدة سوادها.
- term: تُعَلَّلُ
  text: تُطيَّب مرة بعد مرة.
- term: الْعَبِيرِ
  text: '«أخلاط من الطيب تُجمع بالزعفران، وقيل: هو الزعفران وحده» [@lisan، ج4 ص531].'
