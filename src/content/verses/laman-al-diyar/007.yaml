first: فَظَلِلْتُ فِي دِمَنِ الدِّيَارِ كَأَنَّنِي
second: نَشْوَانُ بَاكَرَهُ صَبُوحُ مُدَامِ
vocabulary:
- term: دِمَنِ
  text: آثار الديار وما سوّده أهلها.
- term: نَشْوَانُ
  text: سكران.
- term: بَاكَرَهُ
  text: أتاه في أول النهار.
- term: صَبُوحُ مُدَامِ
  text: شَربة خمر في الصباح.
