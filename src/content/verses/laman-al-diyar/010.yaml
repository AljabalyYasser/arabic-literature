first: وَمُجِدَّةٍ نَسَّأْتُهَا فَتَكَمَّشَتْ
second: رَتْكَ النَّعَامَةِ فِي طَرِيقٍ حَامِ
vocabulary:
- term: مُجِدَّةٍ
  text: ناقة جادّة في السير.
- term: نَسَّأْتُهَا
  text: زجرتها وسقتها [@lisan، ج1 ص169].
- term: فَتَكَمَّشَتْ
  text: فأسرعت وجدّت [@lisan، ج6 ص343].
- term: رَتْكَ
  text: 'الرَّتْك: مقاربة الخطو في سرعة، وهو «مِشية فيها اهتزاز» [@lisan، ج10 ص431].'
