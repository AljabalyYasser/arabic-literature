first: تَخْدِي عَلَى الْعِلَّاتِ سَامٍ رَأْسُهَا
second: رَوْعَاءَ مَنْسِمُهَا رَثِيمٌ دَامِ
vocabulary:
- term: تَخْدِي
  text: تسرع وتزجّ بقوائمها [@lisan، ج14 ص224].
- term: عَلَى الْعِلَّاتِ
  text: على كل حال.
- term: رَوْعَاءَ
  text: «حديدة الفؤاد» [@lisan، ج8 ص137].
- term: مَنْسِمُهَا رَثِيمٌ
  text: طرف خفّها قد «أدمته الحجارة» [@lisan، ج12 ص226].
