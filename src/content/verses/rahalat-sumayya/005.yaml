first: "قَدْ بِتُّ رَائِدَهَا وَشَاةِ مُحَاذِرٍ"
second: "حَذِرًا يُقِلُّ بِعَيْنِهِ أَغْفَالَهَا"
meaning: "قد قضيت الليل أرتاد تلك الأرض الممطرة، وأرصد امرأة رجل غيور، شديد الحذر عليها، يراقبها بعينه فلا يكاد يغفل عنها لحظة. والشاة هنا المرأة، كما يقول المحقق: «الشاة من الضأن والمعزى يكنى بها عن المرأة. محاذر شديد الحذر عليها دائم المراقبة لها، وهو زوجها» [@diwan-asha، ص63]. ولخّص المحقق الأبيات: «وكم رجل غيور على صاحبته يحرص عليها، ويبالغ في حياطتها، فهو لشدة حذره لا يكاد ينام» [@diwan-asha، ص62]. فالبيت أول قصة امرأة متزوجة يتربص بها الشاعر ليزني بها."
vocabulary:
  - term: "رَائِدَهَا"
    text: "مرتادها، والضمير لمصاب الغادية في البيت السابق: «وَالرَّائِدُ: الَّذِي يُرْسَل فِي الْتِمَاسِ النُّجْعَة وَطَلَبِ الكلإِ» [@lisan، ج3 ص187]."
  - term: "وَشَاةِ مُحَاذِرٍ"
    text: "امرأة رجل محاذر: «وَرُبَّمَا كُنِيَ بِالشَّاةِ عَنِ المرأَة أَيضاً» [@lisan، ج13 ص510]، والمحاذر زوجها [@diwan-asha، ص63]."
  - term: "يُقِلُّ بِعَيْنِهِ أَغْفَالَهَا"
    text: "يجعل ساعات غفلته عنها قليلة بمراقبتها بعينه، والأغفال جمع غُفْل، وهي هنا أوقات الغفلة."
syntax:
  - "«قَدْ بِتُّ رَائِدَهَا»: «بات» فعل ناقص، والتاء اسمه، و«رائدَها» خبره، والهاء لمصاب الغادية."
  - "«وَشَاةِ مُحَاذِرٍ»: يحتمل وجهين: أن تكون الواو واو رُبّ، و«شاةِ» مجرورة بها، وخبرها في البيت التالي «فَظَلِلْتُ أَرْعَاهَا»، أي: ورُبّ شاةِ محاذرٍ ظللت أرعاها؛ أو أن تكون معطوفة على الضمير المجرور في «رائدها»، أي: ورائدَ شاةِ محاذر. والعطف على الضمير المجرور بغير إعادة الجارّ يجيزه الكوفيون ويمنعه البصريون إلا في الشعر."
  - "«حَذِرًا»: حال من «محاذر»، وجملة «يُقِلُّ بِعَيْنِهِ أَغْفَالَهَا» حال ثانية أو نعت لـ«حذرًا». و«بعينه» متعلق بـ«يُقلّ»، و«أغفالها» مفعول به."
morphology:
  - "«رَائِد» اسم فاعل من «رادَ يَرُودُ» أجوف واوي، قُلبت عينه همزة في اسم الفاعل."
  - "«مُحَاذِر» اسم فاعل من «حاذَرَ» على «فاعَلَ»، و«حَذِر» صفة مشبهة على «فَعِل»."
  - "«يُقِلّ» مضارع «أَقَلَّ» على «أَفْعَلَ» من «قَلَّ»، والهمزة للتعدية."
rhetoric:
  thesis: "بيت يجمع لذّتين في قسم واحد: ارتياد الأرض الممطرة، وترصّد امرأة غيره. فيجعل المرأة شاة في مرعى، والزوج راعيها، والشاعر رائدًا كالذي يطلب الكلأ."
  devices:
    - title: "الاستعارة في «شَاةِ»"
      text: "سمّى المرأة شاة ولم يذكرها، فهي استعارة. وقد قال المُبَرِّد بعد أن ذكر هذا الباب: «والعرب تكني عن المرأة بالبقرة والنعجة» [@kamil، ج1 ص225]. والاستعارة عند عبد القاهر الجُرْجانيّ أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وتتصل الصورة بالمرعى في البيت السابق، فيصير الحديث كله حديث راعٍ ورائد وكلأ."
    - title: "الجمع بين أمرين في فعل واحد"
      text: "«رَائِدَهَا وَشَاةِ مُحَاذِرٍ»: جعل ارتياد الأرض وترصّد المرأة عملًا واحدًا لليلة واحدة، فساوى بين المرأة والمرعى. وهذه التسوية تمهّد لما بعدها، وهي قراءتنا."
  connection: "ثم يصف يوم الترصّد: «فَظَلِلْتُ أَرْعَاهَا وَظَلَّ يَحُوطُهَا»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المفتوحة، وبعدها هاء: «لَهَا»"
  scansion: "قَدْ بِتْتُ رَا / ئِدَهَا وَشَا / ةِ مُحَاذِرِنْ = مُتْفاعلن / متَفاعلن / متَفاعلن — حَذِرَنْ يُقِلْ / لُ بِعَيْنِهِي / أَغْفَالَهَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر والثالثة من العجز. وأُشبعت كسرة الهاء في «بعينِهِ» فنُطقت «بعينهي»."
context: "أول الأبيات الأربعة (5–8) التي يحكي فيها الأَعْشَى اختلاسه امرأة من زوجها، في سياق رده على سُمَيّة التي رحلت غاضبة: هي لا تدري كم غانية قطع هو وصلها، ولا ما كان له من لذّات. ويصف شوقي ضَيْف هذه الأبيات بأن الأَعْشَى «يتحدث عن مغامراته ووصوله إلى محبوباته من المتزوجات» [@deif، ج1 ص361]."
