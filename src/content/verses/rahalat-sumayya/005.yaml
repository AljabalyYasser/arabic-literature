explained: false
first: "قَدْ بِتُّ رَائِدَهَا وَشَاةِ مُحَاذِرٍ"
second: "حَذِرًا يُقِلُّ بِعَيْنِهِ أَغْفَالَهَا"
vocabulary:
  - term: "رَائِدَهَا"
    text: "«وَالرَّائِدُ: الَّذِي يُرْسَل فِي الْتِمَاسِ النُّجْعَة وَطَلَبِ الكلإِ» [@lisan، ج3 ص187]."
  - term: "وَشَاةِ مُحَاذِرٍ"
    text: "الشاة هنا المرأة، كما في البيت 7، والمحاذر زوجها الذي يرقبها."
  - term: "أَغْفَالَهَا"
    text: "ساعات غفلتها."
