explained: false
first: "عَسْفًا وَإِرْقَالَ الْهَجِيرِ تَرَى لَهَا"
second: "خَدَمًا تُسَاقِطُ بِالطَّرِيقِ نِعَالَهَا"
vocabulary:
  - term: "عَسْفًا"
    text: "«العَسْفُ: السَّير بِغَيْرِ هِدَايَةٍ والأَخْذُ عَلَى غَيْرِ الطَّرِيقِ» [@lisan، ج9 ص245]."
  - term: "وَإِرْقَالَ"
    text: "«والإِرْقَال: ضَرْبٌ مِنَ الخَبَب» [@lisan، ج11 ص293]، والخَبَب ضرب من السير السريع."
  - term: "الْهَجِيرِ"
    text: "شدة الحر نصف النهار."
  - term: "خَدَمًا"
    text: "«والخَدَمة: السَّيْرُ الْغَلِيظُ المحكمُ مثل الحَلْقة، يُشدّ فِي رُسْغ الْبَعِيرِ» [@lisan، ج12 ص167]. والنعال هنا ما يُلبس خفّ الناقة ليقيه."
