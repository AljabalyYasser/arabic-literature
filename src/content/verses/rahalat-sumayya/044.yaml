explained: false
first: "حَتَّى إِذَا لَمَعَ الدَّلِيلُ بِثَوْبِهِ"
second: "سُقِيَتْ وَصَبَّ رُوَاتُهَا أَشْوَالَهَا"
vocabulary:
  - term: "لَمَعَ الدَّلِيلُ بِثَوْبِهِ"
    text: "أشار به من بعيد."
  - term: "رُوَاتُهَا"
    text: "سُقاتها."
  - term: "أَشْوَالَهَا"
    text: "جمع شَوْل: «والشَّوْلُ: بَقِيَّةُ الْمَاءِ فِي السِّقاء والدَّلْو» [@lisan، ج11 ص376]، وأنشد صاحب اللسان هذا البيت. أي صبّوا بقية الماء لأنهم بلغوا ماء العدو."
