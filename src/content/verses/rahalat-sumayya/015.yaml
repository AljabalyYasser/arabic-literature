first: "كَانَتْ بَقِيَّةَ أَرْبَعٍ فَاعْتَمْتُهَا"
second: "لَمَّا رَضِيتُ مَعَ النَّجَابَةِ آلَهَا"
vocabulary:
  - term: "فَاعْتَمْتُهَا"
    text: "اخترتها: «وَقَدِ اعْتامَ يَعْتامُ اعْتِياماً واعْتانَ يَعْتانُ اعْتِياناً إِذَا اخْتَارَ» [@lisan، ج12 ص433]."
  - term: "آلَهَا"
    text: "خَلْقها وهيئتها."
