explained: false
first: "وَإِذَا تَجِيءُ كَتِيبَةٌ مَلْمُومَةٌ"
second: "خَرْسَاءُ تُغْشِي مَنْ يَذُودُ نِهَالَهَا"
vocabulary:
  - term: "مَلْمُومَةٌ"
    text: "«وكَتيبة مَلْمُومَة ومُلَمْلَمَة: مُجْتَمِعَةٌ» [@lisan، ج12 ص550]."
  - term: "خَرْسَاءُ"
    text: "«وَكَتِيبَةٌ خَرْساء إِذا صَمَتَتْ مِنْ كَثْرَةِ الدُّرُوعِ أَي لَمْ يَكُنْ لَهَا قَعاقِعُ» [@lisan، ج6 ص62]."
  - term: "نِهَالَهَا"
    text: "العطاش من رماحها، أي الرماح التي تطلب الدم."
