explained: false
first: "وَسَمِعْتُ أَكْثَرَ مَا يُقَالُ لَهَا اقْدُمِي"
second: "وَالنَّصُّ وَالْإِيجَافُ كَانَ صِقَالَهَا"
vocabulary:
  - term: "اقْدُمِي"
    text: "زجر للخيل تُحثّ به على الإقدام."
  - term: "وَالنَّصُّ"
    text: "«وأَصل النَّصّ أَقصى الشَّيْءِ وغايتُه، ثُمَّ سُمِّيَ بِهِ ضربٌ مِنَ السَّيْرِ سَرِيعٌ» [@lisan، ج7 ص98]."
  - term: "وَالْإِيجَافُ"
    text: "حملها على الوجيف، و«الوَجِيفُ ضَرْبٌ مِنْ سَيْرِ الإِبل وَالْخَيْلِ» [@lisan، ج9 ص352]."
  - term: "صِقَالَهَا"
    text: "ما يُضمرها ويهذّبها كما يُصقل السيف."
