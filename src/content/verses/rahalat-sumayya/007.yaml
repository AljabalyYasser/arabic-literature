explained: false
first: "فَرَمَيْتُ غَفْلَةَ عَيْنِهِ عَنْ شَاتِهِ"
second: "فَأَصَبْتُ حَبَّةَ قَلْبِهَا وَطِحَالَهَا"
vocabulary:
  - term: "شَاتِهِ"
    text: "امرأته: «وَرُبَّمَا كُنِيَ بِالشَّاةِ عَنِ المرأَة أَيضاً؛ قَالَ الأَعشى» [@lisan، ج13 ص510]، وأنشد هذا البيت. وأنشده المُبَرِّد بعد قوله: «والعرب تكني عن المرأة بالبقرة والنعجة» [@kamil، ج1 ص225]."
  - term: "حَبَّةَ قَلْبِهَا"
    text: "«وحَبَّةُ القَلْبِ: ثَمَرتُه وسُوَيْداؤُه» [@lisan، ج1 ص294]، وأنشد صاحب اللسان هذا العجز. فالصورة صورة صياد رمى شاة فأصاب قلبها."
