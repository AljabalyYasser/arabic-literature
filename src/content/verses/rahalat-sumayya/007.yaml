first: "فَرَمَيْتُ غَفْلَةَ عَيْنِهِ عَنْ شَاتِهِ"
second: "فَأَصَبْتُ حَبَّةَ قَلْبِهَا وَطِحَالَهَا"
meaning: "فاغتنمت اللحظة التي غفلت فيها عين الزوج عن امرأته، فرميتها كما يرمي الصياد الشاة، فأصبت قلبها في صميمه، أي ملكت قلبها وأوقعتها في حبي فاستسلمت لي. فالصورة صورة صياد يترقّب الطريدة ثم يصيبها في مقتل، والمراد أنه وصل إليها حين غفل زوجها. والشاة كناية عن المرأة: «وَرُبَّمَا كُنِيَ بِالشَّاةِ عَنِ المرأَة أَيضاً؛ قَالَ الأَعشى»، وأنشد هذا البيت [@lisan، ج13 ص510]. ولخّص المحقق: «فأصاب منه غفلة عن شاته، فخلا بها للذته» [@diwan-asha، ص62]."
vocabulary:
  - term: "فَرَمَيْتُ غَفْلَةَ عَيْنِهِ"
    text: "رميت في لحظة غفلة عينه، أي اغتنمتها."
  - term: "شَاتِهِ"
    text: "امرأته: «وَرُبَّمَا كُنِيَ بِالشَّاةِ عَنِ المرأَة أَيضاً» [@lisan، ج13 ص510]."
  - term: "حَبَّةَ قَلْبِهَا"
    text: "صميم قلبها: «وحَبَّةُ القَلْبِ: ثَمَرتُه وسُوَيْداؤُه» [@lisan، ج1 ص294]، وأنشد صاحب اللسان هذا العجز."
  - term: "وَطِحَالَهَا"
    text: "الطِّحال عضو في الجوف إلى جانب المعدة، وذكره مع القلب لأن الرمية النافذة تصيب الجوف كله."
syntax:
  - "«فَرَمَيْتُ غَفْلَةَ عَيْنِهِ»: «غفلةَ» ظرف زمان منصوب لأنه في معنى الوقت، أي رميت وقتَ غفلة عينه، ويجوز أن يكون مفعولًا به على المجاز: رميت غفلته، أي جعلتها هدفًا. و«عَنْ شَاتِهِ» متعلق بـ«غفلة»."
  - "«فَأَصَبْتُ حَبَّةَ قَلْبِهَا وَطِحَالَهَا»: معطوفة بالفاء على «رميت»، والفاء للترتيب والتعقيب: لا فاصل بين الرمي والإصابة. و«طحالَها» معطوف على «حبةَ»."
morphology:
  - "«غَفْلَة» على «فَعْلة» للمرة من «غَفَلَ»، فهي غفلة واحدة اغتنمها."
  - "«شَاة» في اللسان: «والشاةُ: أَصلها شاهَةٌ، فَحُذِفَتِ الْهَاءُ الأَصلية»، وجمعها شِياه [@lisan، ج13 ص510]."
  - "«طِحَال» على «فِعال»."
rhetoric:
  thesis: "لحظة الظفر: بعد يوم من الترقّب يأتي الرمي والإصابة في بيت واحد. والصورة كلها من الصيد: غفلة، ورمية، وإصابة في المقتل."
  devices:
    - title: "التمثيل"
      text: "صورة صياد يرمي شاة غفل راعيها فيصيب قلبها وطحالها، تُشبَّه بها هيئة الرجل الذي يغتنم غفلة الزوج فيملك قلب امرأته. وعبد القاهر الجُرْجانيّ يجعل من التشبيه ما يكون فيه «الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، وهذا منه: لا شبه في الصورة بين السهم والإغواء، وإنما الشبه في الهيئة كلها."
    - title: "الكناية عن المرأة"
      text: "أنشد المُبَرِّد البيت بعد قوله: «والعرب تكني عن المرأة بالبقرة والنعجة» [@kamil، ج1 ص225]، فالشاة هنا امرأة الرجل المحاذر. وذكر الزوج بضمير «عينه» و«شاته»، فجعله مالك الشاة الذي غفل عنها."
    - title: "«غَفْلَةَ عَيْنِهِ»"
      text: "لم يقل: غفل الزوج، بل جعل الغفلة للعين، لأن الزوج كان يحرسها بعينه كما قال في البيت الخامس: «يُقِلُّ بِعَيْنِهِ أَغْفَالَهَا». فالعين التي حرست هي العين التي غفلت. وهذه الصلة قراءتنا."
  connection: "ثم يقول ما حدث بعد الإصابة: «حَفِظَ النَّهَارَ وَبَاتَ عَنْهَا غَافِلًا»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المفتوحة، وبعدها هاء: «لَهَا»"
  scansion: "فَرَمَيْتُ غَفْ / لَةَ عَيْنِهِي / عَنْ شَاتِهِي = متَفاعلن / متَفاعلن / مُتْفاعلن — فَأَصَبْتُ حَبْ / بَةَ قَلْبِهَا / وَطِحَالَهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثالثة من الصدر، وسلمت تفعيلات العجز. وأُشبعت كسرة الهاء في «عينِهِ» و«شاتِهِ» فنُطقتا «عينهي» و«شاتهي»."
context: "من الأبيات 5–8 في اختلاس المرأة من زوجها. وهو مما يرويه القدماء من القصيدة: أنشده المُبَرِّد [@kamil، ج1 ص225]، وصاحب اللسان في موضعين [@lisan، ج13 ص510] [@lisan، ج1 ص294]. وأنشده شوقي ضَيْف مع البيتين 6 و8، وقال في الحاشية: «الشاة هنا: كناية عن المرأة» [@deif، ج1 ص361]."
