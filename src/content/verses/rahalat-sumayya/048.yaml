explained: false
first: "فَأَصَبْنَ ذَا كَرَمٍ وَمَنْ أَخْطَأْنَهُ"
second: "جَزَأَ الْمَقِيظَةَ خَشْيَةً أَمْثَالَهَا"
vocabulary:
  - term: "جَزَأَ"
    text: "اكتفى: «وجَزِئَتِ الإِبلُ: إِذَا اكْتَفَتْ بالرُّطْبِ عَنِ الْمَاءِ» [@lisan، ج1 ص46]."
  - term: "الْمَقِيظَةَ"
    text: "«والمَقِيظةُ: نَبَاتٌ يَبْقَى أَخْضَرَ إِلى الْقَيْظِ» [@lisan، ج7 ص457]. يقول: من أخطأته الغارة لزم البادية لا يقرب الماء خشية أن يُصاب."
