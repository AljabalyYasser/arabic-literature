explained: false
first: "وَسَبِيئَةٍ مِمَّا تُعَتِّقُ بَابِلٌ"
second: "كَدَمِ الذَّبِيحِ سَلَبْتُهَا جِرْيَالَهَا"
vocabulary:
  - term: "وَسَبِيئَةٍ"
    text: "خمر مشتراة: «سَبَأَ الخَمْرَ يَسْبَؤُها سَبْأً وسِباءً ومَسْبَأً واستَبَأَها: شَراها» [@lisan، ج1 ص93]."
  - term: "تُعَتِّقُ"
    text: "تُطيل حبسها حتى تَعْتُق: «والمُعَتَّقَةُ: مِنْ أَسماء الطِّلاء وَالْخَمْرِ» [@lisan، ج10 ص237]."
  - term: "جِرْيَالَهَا"
    text: "لونها. يروي ابن قُتَيْبة أن عُبَيْدًا راوية الأَعْشَى سأله عن هذا البيت، فقال: «شربتها حمراء وبلتها بيضاء. والجريال: اللّون» [@ibn-qutayba، ج1 ص253]."
