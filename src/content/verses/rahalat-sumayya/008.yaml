first: "حَفِظَ النَّهَارَ وَبَاتَ عَنْهَا غَافِلًا"
second: "فَخَلَتْ لِصَاحِبِ لَذَّةٍ وَخَلَا لَهَا"
meaning: "حرسها زوجها طوال النهار، ثم نام الليل غافلًا عنها، فخلت المرأة لعاشقها الباحث عن اللذة، وخلا لها، أي اجتمعا وحدهما فجامعها. ولخّص المحقق الأبيات: «فأصاب منه غفلة عن شاته، فخلا بها للذته، وكان عندها حظيًّا أثيرًا» [@diwan-asha، ص62]، والحظيّ الأثير المحبوب المقدَّم. فالبيت يقول صراحة إن الشاعر زنى بامرأة الرجل في الليل الذي نام فيه زوجها، ويجعل الزوج هو الذي فتح له الباب بغفلته."
vocabulary:
  - term: "حَفِظَ النَّهَارَ"
    text: "حرسها في النهار كله."
  - term: "وَبَاتَ عَنْهَا غَافِلًا"
    text: "وقضى الليل غافلًا عنها، أي نائمًا."
  - term: "فَخَلَتْ لِصَاحِبِ لَذَّةٍ"
    text: "انفردت بعاشق يطلب اللذة، أي بالشاعر نفسه."
  - term: "وَخَلَا لَهَا"
    text: "وانفرد هو بها، أي جامعها في خلوة لا رقيب فيها."
syntax:
  - "«حَفِظَ النَّهَارَ»: «حفظ» فعل ماض فاعله ضمير الزوج، و«النهارَ» ظرف زمان منصوب، ومفعول «حفظ» محذوف يفهم من السياق، أي حفظها النهارَ."
  - "«وَبَاتَ عَنْهَا غَافِلًا»: «بات» فعل ناقص، واسمه ضمير الزوج، و«غافلًا» خبره، و«عنها» متعلق بـ«غافلًا»."
  - "«فَخَلَتْ لِصَاحِبِ لَذَّةٍ وَخَلَا لَهَا»: الفاء للسببية: غفلته سبب خلوتها. و«لِصَاحِبِ لَذَّةٍ» متعلق بـ«خلت»، و«لها» متعلق بـ«خلا»، وفاعله ضمير «صَاحِبِ لَذَّةٍ»."
morphology:
  - "«خَلَتْ» و«خَلَا» من «خَلَا يَخْلُو» ناقص واوي، حُذفت لامه في «خلت» لالتقاء الساكنين."
  - "«غَافِل» اسم فاعل من «غَفَلَ»، و«لَذَّة» على «فَعْلة» من «لَذَّ»."
rhetoric:
  thesis: "خاتمة القصة: نهار الحراسة يقابله ليل الغفلة، فينتهي كل شيء بخلوة العاشقين. ويجعل الزوج سبب ما جرى، فتصير القصة سخرية من الغيور الذي حرس النهار ونام الليل."
  devices:
    - title: "المقابلة"
      text: "«حَفِظَ النَّهَارَ» يقابله «وَبَاتَ عَنْهَا غَافِلًا»: الحفظ والغفلة، والنهار والليل. والمقابلة أن يؤتى بمعنيين ثم بما يقابلهما على الترتيب، وهي هنا تجعل حراسة النهار كلها بلا فائدة."
    - title: "التكرار في «فَخَلَتْ ... وَخَلَا»"
      text: "كرر الفعل مرتين في العجز، مرة للمرأة ومرة للرجل: «فَخَلَتْ لِصَاحِبِ لَذَّةٍ وَخَلَا لَهَا». فالخلوة متبادلة، وهي رضًا من الطرفين، لا اختلاس من جانب واحد. وهذه قراءتنا."
    - title: "الكناية في «صَاحِبِ لَذَّةٍ»"
      text: "سمّى نفسه «صَاحِبِ لَذَّةٍ» ولم يقل «أنا»، فجعل نفسه نوعًا من الرجال يُعرف بطلب اللذة. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. والخلوة نفسها كناية عن الجماع، يدل عليها ما يليها في الوجود."
  connection: "ثم ينتقل إلى لذة أخرى: «وَسَبِيئَةٍ مِمَّا تُعَتِّقُ بَابِلٌ»، الخمر."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المفتوحة، وبعدها هاء: «لَهَا»"
  scansion: "حَفِظَنْ نَهَا / رَ وَبَاتَ عَنْ / هَا غَافِلَنْ = متَفاعلن / متَفاعلن / مُتْفاعلن — فَخَلَتْ لِصَا / حِبِ لَذْذَتِنْ / وَخَلَا لَهَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثالثة من الصدر، وسلمت تفعيلات العجز. والعَرُوض «مُتْفاعلن» والضرب «متَفاعلن» تامّان."
context: "آخر الأبيات الأربعة (5–8)، وبعده يعدّ الشاعر لذّاته الأخرى: الخمر البابلية، والقصيدة، والميسر، والفلاة. وأنشده شوقي ضَيْف مع البيتين 6–7، مثالًا على أن غزل الأَعْشَى «ماديّا صريحا لما رأينا من لهوه وخمره» [@deif، ج1 ص361]."
