explained: false
first: "بِجُلَالَةٍ سُرُحٍ كَأَنَّ بِغَرْزِهَا"
second: "هِرًّا إِذَا انْتَعَلَ الْمَطِيُّ ظِلَالَهَا"
vocabulary:
  - term: "بِجُلَالَةٍ"
    text: "بناقة ضخمة: «وَنَاقَةُ جُلالة: ضَخْمة» [@lisan، ج11 ص117]."
  - term: "سُرُحٍ"
    text: "«وناقةٌ سُرُحٌ ومُنْسَرِحة فِي سَيْرِهَا أَي سَرِيعَةٌ» [@lisan، ج2 ص479]، وأنشد صاحب اللسان هذا البيت."
  - term: "بِغَرْزِهَا"
    text: "«والغَرْزُ: رِكابُ الرحْل» [@lisan، ج5 ص386]. كأن في ركابها هرًّا يخدشها فتسرع."
  - term: "انْتَعَلَ الْمَطِيُّ ظِلَالَهَا"
    text: "صارت ظلال الإبل تحت أخفافها، وذلك في الهاجرة."
