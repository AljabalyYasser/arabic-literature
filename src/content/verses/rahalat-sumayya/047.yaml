explained: false
first: "مُتَبَارِيَاتٍ فِي الْأَعِنَّةِ شُزَّبًا"
second: "حَتَّى تُفِيءَ عَشِيَّةً أَنْفَالَهَا"
vocabulary:
  - term: "شُزَّبًا"
    text: "جمع شازب: «الشَّازِبُ: الضامِرُ اليابِسُ مِنَ النَّاسِ وَغَيْرِهِمْ؛ وأَكثرُ مَا يُستعمل فِي الخيلِ وَالنَّاسِ» [@lisan، ج1 ص494]."
  - term: "تُفِيءَ"
    text: "تردّ، أي تعود بها."
  - term: "أَنْفَالَهَا"
    text: "غنائمها."
