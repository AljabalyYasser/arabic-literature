first: "فَظَلِلْتُ أَرْعَاهَا وَظَلَّ يَحُوطُهَا"
second: "حَتَّى دَنَوْتُ إِذَا الظَّلَامُ دَنَا لَهَا"
meaning: "فقضيت النهار أراقب المرأة وأنتظر فرصتي، وقضاه زوجها يحرسها ويحفظها، حتى إذا أقبل الليل عليها اقتربتُ منها. فالرجلان طوال اليوم حولها: الزوج يحرس، والشاعر يتربّص. ولخّص المحقق: «لم يزل يتأتى لها، حتى أقبل الليل» [@diwan-asha، ص62]، أي لم يزل يتلطّف في الوصول إليها. وهذا البيت أول ما استشهد به ابن سَلّام للأَعْشَى حين عدّه ممن كان «ينعى على نفسه ويتعهر» [@ibn-sallam، ج1 ص41–42]، أي يشهّر بنفسه ويحدّث بفجوره."
vocabulary:
  - term: "أَرْعَاهَا"
    text: "أراقبها وأنتظر غفلة حارسها: «ورَعَى النُّجُوم رَعْياً ورَاعَاها: راقَبَها وانْتَظَر مَغِيبَها» [@lisan، ج14 ص327]. وفي الكلمة معنى رعي الغنم أيضًا، لأنها «شاة» في البيت السابق."
  - term: "يَحُوطُهَا"
    text: "يحفظها ويحرسها، والحِياطة الحفظ والرعاية."
  - term: "دَنَوْتُ"
    text: "اقتربت منها."
  - term: "إِذَا الظَّلَامُ دَنَا لَهَا"
    text: "حين أقبل الليل عليها."
syntax:
  - "«فَظَلِلْتُ أَرْعَاهَا»: «ظلّ» فعل ناقص، والتاء اسمه، وجملة «أرعاها» خبره. و«وَظَلَّ يَحُوطُهَا» مثلها، واسم «ظلّ» ضمير يعود على المحاذر."
  - "«حَتَّى دَنَوْتُ»: «حتى» ابتدائية أو حرف غاية، و«دنوت» فعل وفاعل. و«إِذَا الظَّلَامُ دَنَا لَهَا»: «إذا» ظرف، و«الظلامُ» فاعل لفعل محذوف يفسّره «دنا»، والتقدير: إذا دنا الظلامُ دنا لها."
  - "وفُكّ الإدغام في «ظَلِلْتُ» لاتصال الفعل بتاء الفاعل، كما يقال: ظلَّ، وظلِلتُ."
morphology:
  - "«ظَلِلْتُ» ماضي «ظَلَّ» المضعف، فُكّ إدغامه مع ضمير الرفع المتحرك."
  - "«أَرْعَى» مضارع «رَعَى» ناقص يائي، و«يَحُوط» مضارع «حاطَ» أجوف واوي."
  - "«دَنَوْتُ» و«دَنَا» من «دَنَا يَدْنُو» ناقص واوي."
rhetoric:
  thesis: "يوم كامل من الترقّب يختصره في بيت: رجلان يدوران حول امرأة، أحدهما يحرسها والآخر ينتظر، والليل حَكَم بينهما. ويُفهم من الليل ما سيكون."
  devices:
    - title: "المقابلة"
      text: "«فَظَلِلْتُ أَرْعَاهَا» يقابله «وَظَلَّ يَحُوطُهَا»: الفعل نفسه «ظلّ» للرجلين، والمفعول نفسه، والعمل مختلف. فالرجلان متكافئان في النهار، ثم يفترقان في الليل. وهذه قراءتنا."
    - title: "التورية في «أَرْعَاهَا»"
      text: "التورية أن تُذكر كلمة لها معنيان، قريب يتبادر وبعيد هو المراد. و«أرعاها» قريبها رعي الشاة التي ذكرها في البيت السابق، والمراد مراقبة المرأة وترصّد غفلة زوجها. وفي اللسان أن الرعي يكون بمعنى المراقبة: «راقَبَها وانْتَظَر مَغِيبَها» [@lisan، ج14 ص327]."
    - title: "تكرار «دَنَا»"
      text: "«حَتَّى دَنَوْتُ إِذَا الظَّلَامُ دَنَا لَهَا»: دنوّ الشاعر ودنوّ الظلام في عجز واحد، فكأنهما يقتربان منها معًا، والظلام شريكه في الوصول إليها."
  connection: "ثم يصف لحظة الفرصة: «فَرَمَيْتُ غَفْلَةَ عَيْنِهِ عَنْ شَاتِهِ»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ اللام المفتوحة، وبعدها هاء: «لَهَا»"
  scansion: "فَظَلِلْتُ أَرْ / عَاهَا وَظَلْ / لَ يَحُوطُهَا = متَفاعلن / مُتْفاعلن / متَفاعلن — حَتْتَى دَنَوْ / تُ إِذَظْ ظَلَا / مُ دَنَا لَهَا = مُتْفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الثانية من الصدر والأولى من العجز."
context: "قلب الأبيات 5–8. وقد اختاره ابن سَلّام شاهدًا أول على أن الأَعْشَى من الذين يتعهّرون في شعرهم، وقرنه بأبيات امرئ القَيْس «ومثلك حبلى» و«دخلت وقد ألقت لنوم ثيابها» و«سموت إليها بعد ما نام أهلها» [@ibn-sallam، ج1 ص41–42]. وأنشده شوقي ضَيْف مع البيتين التاليين، وقال: «فهو يخالس الزوج ويخاتله، حتى يظفر ببغيته» [@deif، ج1 ص361]."
