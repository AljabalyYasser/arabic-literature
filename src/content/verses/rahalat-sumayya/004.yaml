explained: false
first: "وَمَصَابِ غَادِيَةٍ كَأَنَّ تِجَارَهَا"
second: "نَشَرَتْ عَلَيْهِ بُرُودَهَا وَرِحَالَهَا"
vocabulary:
  - term: "وَمَصَابِ غَادِيَةٍ"
    text: "الموضع الذي صاب فيه مطر الغادية: «والغَادِيَة: السَّحابَة الَّتِي تَنْشَأُ غُدْوة» [@lisan، ج15 ص118]."
  - term: "وَرِحَالَهَا"
    text: "«والرِّحَال: الطَّنَافِسُ الحيريَّة، وَمِنْهُ قَوْلُ الأَعشى» [@lisan، ج11 ص278]، يعني هذا البيت. شبّه نبات الأرض بعد المطر ببرود التجار وطنافسهم المنشورة."
