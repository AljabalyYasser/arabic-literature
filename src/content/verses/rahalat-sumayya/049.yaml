explained: false
first: "وَلَبُونِ مِعْزَابٍ حَوَيْتَ فَأَصْبَحَتْ"
second: "نُهْبَى وَآزِلَةٍ قَضَبْتَ عِقَالَهَا"
vocabulary:
  - term: "وَلَبُونِ"
    text: "إبل ذات لبن."
  - term: "مِعْزَابٍ"
    text: "الذي يبعد بإبله في المرعى."
  - term: "نُهْبَى"
    text: "غنيمة."
  - term: "وَآزِلَةٍ"
    text: "التي حُبست عن المرعى خوفًا: «وأَزَلُوا مالَهم يَأْزِلُونَهُ أَزْلًا: حَبَسُوهُ عَنِ المَرْعَى مِنْ ضِيقٍ وَشِدَّةٍ وَخَوْفٍ» [@lisan، ج11 ص14]."
  - term: "قَضَبْتَ"
    text: "قطعت: «القَضْبُ: القَطْعُ» [@lisan، ج1 ص678]، وأنشد صاحب اللسان هذا البيت بفتح التاء خطابًا للممدوح."
