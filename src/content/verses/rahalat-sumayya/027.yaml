explained: false
first: "وَكَأَنَّمَا تَبِعَ الصُّوَارَ بِشَخْصِهَا"
second: "فَتْخَاءُ تَرْزُقُ بِالسُّلَيِّ عِيَالَهَا"
vocabulary:
  - term: "الصُّوَارَ"
    text: "«الصِّوَارُ والصُّوَارُ القَطيع مِنَ البَقَر» [@lisan، ج4 ص475]، يعني بقر الوحش."
  - term: "فَتْخَاءُ"
    text: "عقاب: «وعُقاب فَتْخاءُ: ليِّنة الْجَنَاحِ» [@lisan، ج3 ص40]."
  - term: "بِالسُّلَيِّ"
    text: "«والسُّلِيُّ والسُّلَيُّ: وَادٍ» [@lisan، ج14 ص396]، وأنشد صاحب اللسان هذا البيت."
  - term: "عِيَالَهَا"
    text: "فراخها: «وَقَدْ يُسْتَعَارُ العِيَال لِلطَّيْرِ وَالسِّبَاعِ وَغَيْرِهِمَا مِنَ الْبَهَائِمِ» [@lisan، ج11 ص486]."
