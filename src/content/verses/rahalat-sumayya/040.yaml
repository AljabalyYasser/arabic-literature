explained: false
first: "بِالْخَيْلِ شُعْثًا مَا تَزَالُ جِيَادُهَا"
second: "رُجُعًا تُغَادِرُ بِالطَّرِيقِ سِخَالَهَا"
vocabulary:
  - term: "شُعْثًا"
    text: "متغيّرة من طول الغزو."
  - term: "رُجُعًا"
    text: "جمع رَجِيع: «والرُّجْعَى والرَّجِيعُ مِنَ الدَّوَابِّ، وَقِيلَ مِنَ الدَّوَابِّ وَمِنَ الإِبل: مَا رَجَعْتَه مِنْ سَفَرٍ إِلى سَفَرٍ وَهُوَ الكالُّ» [@lisan، ج8 ص116]."
  - term: "سِخَالَهَا"
    text: "أولادها، تسقط في الطريق من التعب."
