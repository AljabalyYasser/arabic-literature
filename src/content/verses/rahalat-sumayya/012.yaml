first: "يَهْمَاءَ مُوحِشَةٍ رَفَعْتُ لِعَرْضِهَا"
second: "طَرْفِي لِأَقْدُرَ بَيْنَهَا أَمْيَالَهَا"
vocabulary:
  - term: "يَهْمَاءَ"
    text: "«اليَهْمَاءُ: مفازةٌ لَا مَاءَ فِيهَا وَلَا يُسْمع فِيهَا صوتٌ» [@lisan، ج12 ص648]."
  - term: "أَمْيَالَهَا"
    text: "جمع مِيل، وهو منتهى مدّ البصر من الأرض."
