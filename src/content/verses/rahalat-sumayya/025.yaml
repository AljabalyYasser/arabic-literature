explained: false
first: "الْوَاهِبُ الْمِائَةَ الْهِجَانَ وَعَبْدَهَا"
second: "عُوذًا تُزَجِّي خَلْفَهَا أَطْفَالَهَا"
vocabulary:
  - term: "الْهِجَانَ"
    text: "«والهِجانُ مِنَ الإِبل: البيضُ الْكِرَامُ» [@lisan، ج13 ص431]."
  - term: "عُوذًا"
    text: "«والعُوذُ: الْحَدِيثَاتُ النِّتَاجِ مِنَ الظِّبَاءِ والإِبل وَالْخَيْلِ» [@lisan، ج3 ص500]."
  - term: "تُزَجِّي"
    text: "تسوق."
