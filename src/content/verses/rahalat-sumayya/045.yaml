first: "فَكَفَى الْعَضَارِيطُ الرِّكَابَ فَبُدِّدَتْ"
second: "مِنْهُ لِأَمْرِ مُؤَمَّلٍ فَأَجَالَهَا"
vocabulary:
  - term: "الْعَضَارِيطُ"
    text: "«والعُضْرُطُ والعُضْرُوطُ: الخادمُ عَلَى طَعامِ بطْنه، وَهُمُ العَضارِيطُ والعَضارِطةُ» [@lisan، ج7 ص351]."
  - term: "فَأَجَالَهَا"
    text: "فأدارها وأرسلها في الغارة."
