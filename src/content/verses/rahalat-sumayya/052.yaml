first: "تَأْوِي طَوَائِفُهَا إِلَى مُخْضَرَّةٍ"
second: "مَكْرُوهَةٍ يَخْشَى الْكُمَاةُ نِزَالَهَا"
vocabulary:
  - term: "مُخْضَرَّةٍ"
    text: "كتيبة خضراء: «وَيُقَالُ: كَتِيبَةٌ خَضْراءٌ لِلَّتِي يَعْلُوهَا سَوَادُ الْحَدِيدِ» [@lisan، ج4 ص245]."
  - term: "الْكُمَاةُ"
    text: "الشجعان المستترون بالسلاح."
