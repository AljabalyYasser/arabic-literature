first: "كُنْتَ الْمُقَدَّمَ غَيْرَ لَابِسِ جُنَّةٍ"
second: "بِالسَّيْفِ تَضْرِبُ مُعْلِمًا أَبْطَالَهَا"
vocabulary:
  - term: "جُنَّةٍ"
    text: "«والجُنَّةُ، بِالضَّمِّ: مَا واراكَ مِنَ السِّلاح واسْتَتَرْتَ بِهِ مِنْهُ» [@lisan، ج13 ص94]."
  - term: "مُعْلِمًا"
    text: "«وأَعْلَمَ الفارِسُ: جَعَلَ لِنَفْسِهِ عَلامةَ الشُّجعان، فَهُوَ مُعْلِمٌ» [@lisan، ج12 ص419]."
