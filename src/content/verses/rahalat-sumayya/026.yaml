explained: false
first: "وَالْقَارِحَ الْعَدَّا وَكُلَّ طِمِرَّةٍ"
second: "مَا إِنْ تَنَالُ يَدُ الطَّوِيلِ قَذَالَهَا"
vocabulary:
  - term: "وَالْقَارِحَ"
    text: "«والقارحُ مِنْ ذِي الْحَافِرِ: بِمَنْزِلَةِ الْبَازِلِ مِنَ الإِبل» [@lisan، ج2 ص559]، أي الفرس التام السن."
  - term: "الْعَدَّا"
    text: "السريع العَدْو، وفي اللسان: «أَراد العَدَّاءِ، فقَصَر لِلضَّرُورَةِ» [@lisan، ج15 ص31]."
  - term: "طِمِرَّةٍ"
    text: "فرس وثّابة."
  - term: "قَذَالَهَا"
    text: "«القَذَال: جِماع مُؤَخَّر الرأْس مِنَ الإِنسان والفرسِ فَوْقَ فَأْس القَفا» [@lisan، ج11 ص553]. يصفها بالطول."
