explained: false
first: "وَجَزُورِ أَيْسَارٍ دَعَوْتُ لِحَتْفِهَا"
second: "وَنِيَاطِ مُقْفِرَةٍ أَخَافُ ضَلَالَهَا"
vocabulary:
  - term: "أَيْسَارٍ"
    text: "«والأَيْسارُ: وَاحِدُهُمْ يَسَرٌ، وَهُمُ الَّذِينَ يَتقامَرُون» [@lisan، ج5 ص298]، والجَزُور: الناقة التي يتقامرون عليها فتُنحر."
  - term: "وَنِيَاطِ"
    text: "«ونِياطُ المَفازةِ: بُعد طَرِيقِهَا» [@lisan، ج7 ص419]."
  - term: "مُقْفِرَةٍ"
    text: "أرض خالية."
