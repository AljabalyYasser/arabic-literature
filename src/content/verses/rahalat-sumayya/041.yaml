explained: false
first: "أَمًّا لِصَاحِبِ نِعْمَةٍ طَرَّحْتَهَا"
second: "وَوِصَالِ رَحْمٍ قَدْ نَضَحْتَ بِلَالَهَا"
vocabulary:
  - term: "أَمًّا"
    text: "قصدًا."
  - term: "رَحْمٍ"
    text: "«الرَّحِمُ الْقَرَابَةُ، والرِّحْمُ، بِالْكَسْرِ، مثلُه» [@lisan، ج12 ص232]."
  - term: "نَضَحْتَ بِلَالَهَا"
    text: "وصلتها: «بَلَلْت رَحِمي أَبُلُّها بَلًّا وبِلالًا وَصَلْتها ونَدَّيْتُها» [@lisan، ج11 ص64]."
