explained: false
first: "مَا كُنْتَ فِي الْحَرْبِ الْعَوَانِ مُغَمَّرًا"
second: "إِذْ شَبَّ حَرُّ وَقُودِهَا أَجْزَالَهَا"
vocabulary:
  - term: "الْعَوَانِ"
    text: "«وحَرْبٌ عَوانٌ إِذَا كَانَتْ بَعْدَ حَرْب كَانَتْ قَبْلَهَا» [@lisan، ج12 ص586]."
  - term: "مُغَمَّرًا"
    text: "«وَصَبِيٌّ غُمْرٌ وغَمْرٌ وغَمَرٌ وغَمِرٌ ومُغَمَّر: لَمْ يُجرِّب الأُمور» [@lisan، ج5 ص31]."
  - term: "أَجْزَالَهَا"
    text: "جمع جَزْل: «الجَزْل: الحَطَب الْيَابِسُ، وَقِيلَ الغَلِيظ» [@lisan، ج11 ص109]."
