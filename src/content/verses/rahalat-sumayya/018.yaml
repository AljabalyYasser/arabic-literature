first: "فَإِذَا تُجَوِّزُهَا حِبَالُ قَبِيلَةٍ"
second: "أَخَذَتْ مِنَ الْأُخْرَى إِلَيْكَ حِبَالَهَا"
vocabulary:
  - term: "تُجَوِّزُهَا حِبَالُ قَبِيلَةٍ"
    text: "الحبل هنا العهد والأمان، وفي اللسان: «كَانَ مِنْ عَادَةِ الْعَرَبِ أَن يُخِيف بَعْضُهَا بَعْضًا فِي الْجَاهِلِيَّةِ، فَكَانَ الرَّجُلُ إِذا أَراد سَفَرًا أَخذ عَهْدًا مِنْ سَيِّدِ كُلِّ قَبِيلَةٍ فيأْمن بِهِ مَا دَامَ فِي تِلْكَ الْقَبِيلَةِ حَتَّى يَنْتَهِيَ إِلى الأُخرى» [@lisan، ج11 ص135]، ثم أنشد هذا البيت."
