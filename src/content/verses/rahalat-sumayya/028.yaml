explained: false
first: "طَلَبًا حَثِيثًا بِالْوَلِيدِ تَبُزُّهُ"
second: "حَتَّى تَوَسَّطَ رُمْحُهُ أَكْفَالَهَا"
vocabulary:
  - term: "بِالْوَلِيدِ"
    text: "بالغلام الذي يركبها."
  - term: "تَبُزُّهُ"
    text: "تغلبه: «وبَزَّهُ يَبُزُّهُ بَزًّا: غَلَبَهُ وَغَصَبَهُ» [@lisan، ج5 ص312]."
  - term: "أَكْفَالَهَا"
    text: "جمع كَفَل: «الكَفَل، بِالتَّحْرِيكِ: العجُز» [@lisan، ج11 ص588]، أي أعجاز البقر التي يطعنها."
