explained: false
first: "هَذَا النَّهَارُ بَدَا لَهَا مِنْ هَمِّهَا"
second: "مَا بَالُهَا بِاللَّيْلِ زَالَ زَوَالُهَا"
vocabulary:
  - term: "زَالَ زَوَالُهَا"
    text: "في اللسان: «قِيلَ: مَعْنَاهُ زَالَ الخَيالُ زَوالَها؛ قَالَ ابْنُ الأَعرابي: وإِنما كَرِه الخيالَ لأَنه يَهِيج شَوْقَه» [@lisan، ج11 ص314]. فهو دعاء عليها، أو على خيالها الذي يزوره ليلًا."
