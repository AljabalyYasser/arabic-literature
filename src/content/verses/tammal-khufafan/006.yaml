first: فَجَادَتْ لَهُ يُمْنَى يَدَيَّ بِطَعْنَةٍ
second: كَسَتْ مَتْنَتَيْهِ أَسْوَدَ اللَّوْنِ حَالِكَا
vocabulary:
- term: مَتْنَتَيْهِ
  text: المتنتان مثل المتنين، وهما «مكتنفا الصلب من العصب واللحم» [@khizana، ج5 ص441].
- term: أَسْوَدَ اللَّوْنِ
  text: الدم [@khizana، ج5 ص441].
- term: حَالِكَا
  text: شديد السواد.
