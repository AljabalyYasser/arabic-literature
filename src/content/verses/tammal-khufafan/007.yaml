first: وَقُلْتُ لَهُ وَالرُّمْحُ يَأْطِرُ مَتْنَهُ
second: تَأَمَّلْ خُفَافًا إِنَّنِي أَنَا ذَلِكَا
vocabulary:
- term: يَأْطِرُ
  text: «يحنو ويثني»، أي يعطف ظهر مالك [@khizana، ج5 ص442].
- term: تَأَمَّلْ
  text: انظر وأعد النظر حتى تعرف [@khizana، ج5 ص442].
- term: أَنَا ذَلِكَا
  text: أنا ذلك الفارس الذي سمعت به [@khizana، ج5 ص439].
