explained: false
first: فَإِنْ تَكُ خَيْلِي قَدْ أُصِيبَ عَمِيدُهَا
second: فَإِنِّي عَلَى عَمْدٍ تَيَمَّمْتُ مَالِكَا
vocabulary:
- term: خَيْلِي
  text: فرساني [@khizana، ج5 ص440].
- term: عَمِيدُهَا
  text: 'سيدها؛ «العميد: السيد الذي يُعمد، أي يُقصد»، يعني ابن عمه معاوية بن عَمْرو. ويروى: «صميمها» [@khizana، ج5 ص440].'
- term: تَيَمَّمْتُ
  text: قصدت.
- term: مَالِكَا
  text: «مالك هو ابن حمار، وهو سيد بني شمخ بن فزارة» [@khizana، ج5 ص440].
