first: نَصَبْتُ لَهُ عَلْوَى وَقَدْ خَامَ صُحْبَتِي
second: لِأَبْنِيَ مَجْدًا أَوْ لِأَثْأَرَ هَالِكَا
vocabulary:
- term: عَلْوَى
  text: «اسم فرس خفاف» [@khizana، ج5 ص440].
- term: خَامَ
  text: رجع ونكص، «بمعنى ارتدّ» [@khizana، ج5 ص441].
- term: صُحْبَتِي
  text: أصحابي [@khizana، ج5 ص441].
- term: أَثْأَرَ هَالِكَا
  text: آخذ بثأر قتيل، يعني معاوية [@khizana، ج5 ص441].
