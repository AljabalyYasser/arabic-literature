explained: false
first: "فَمُوتُوا كِرَامًا أَوْ أَمِيتُوا عَدُوَّكُمْ"
second: "وَدِبُّوا لِنَارِ الحَرْبِ بِالحَطَبِ الجَزْلِ"
vocabulary:
  - term: "دِبُّوا"
    text: "امشوا إليها، و«دبّ النمل وغيره من الحيوان على الأرض، يدبّ دبا ودبيبا: مشى على هينته» [@lisan، ج1 ص369]."
  - term: "الجَزْلِ"
    text: "«الجزل: الحطب اليابس، وقيل الغليظ، وقيل ما عظم من الحطب ويبس» [@lisan، ج11 ص109]، وهو أشدّ الحطب اشتعالًا وأطوله بقاء."
