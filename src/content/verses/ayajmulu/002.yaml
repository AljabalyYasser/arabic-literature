first: "وَتُصْبِحُ تَمْشِي فِي الدِّمَاءِ عُفَيْرَةٌ"
second: "جِهَارًا وَزُفَّتْ فِي النِّسَاءِ إِلَى بَعْلِ"
meaning: "أيجمل بكم أن تصبح عُفَيْرة تمشي في دمها أمام الناس، وقد زُفّت بين النساء إلى زوجها؟ والدم دم بكارتها: افتضّها عِمْلِيق ملك طَسْم، أي جامعها كرهًا فأزال بكارتها، ليلة عرسها قبل أن يدخل بها زوجها، فخرجت إلى قومها والدم يسيل منها. فالتي خرجت في موكب عروس إلى زوج، عادت إليهم امرأة مغتصَبة تمشي في دمها."
vocabulary:
  - term: "الدِّمَاءِ"
    text: "دم الافتضاض، يقال في المرأة: «وطمثت إذا دميت بالاقتضاض» [@lisan، ج2 ص165]. والافتضاض والافتراع واحد: إزالة البكارة بالجماع، يقال: «فلان أبو عذر فلانة إذا كان افترعها واقتضها» [@lisan، ج4 ص552]."
  - term: "عُفَيْرَةٌ"
    text: "اسمها، و«عفراء وعفيرة وعفارى: من أسماء النساء» [@lisan، ج4 ص590]. وهي تسمّي نفسها كأنها تتحدث عن امرأة أخرى."
  - term: "جِهَارًا"
    text: "علانيةً أمام الناس، يقال: «جاهرني فلان جهارا أي علانية» [@lisan، ج4 ص150]."
  - term: "زُفَّتْ"
    text: "أُهديت إلى زوجها في موكب العرس، يقال: زففت العروس وأزففتها، «كل ذلك: هداها» [@lisan، ج9 ص137]."
  - term: "بَعْلِ"
    text: "«والبعل: الزوج» [@lisan، ج11 ص58]."
context: "البيت الأول عامّ: «ما يؤتى إلى فتياتكم»، أي ما يُصنع بهن. وهذا البيت يضع أمام الرجال صورة واحدة منه، وهي صورتها هي. ويروي أبو الفَرَج أنها قالت القصيدة بعد أن خرجت إلى قومها «في دمائها شاقة درعها من قبل ومن دبر والدم يسيل وهي في أقبح منظر» [@aghani-dk، ج11 ص165]، أي شقّت ثوبها من أمامها ومن خلفها، فالبيت وصف لما رأوه بأعينهم. ولم نجد للبيت شرحًا عند القدماء، فالشرح الصريح هنا شرحنا."
syntax:
  - "الواو عاطفة، والجملة بعدها معطوفة على ما في البيت الأول، فيمتدّ إليها الاستفهام الإنكاري: أيجمل هذا، وأيجمل أن تصبح عُفَيْرة كذا؟"
  - "«تُصبِح» مضارع ناقص من أخوات «كان»، و«عُفَيْرةٌ» اسمها مؤخّر، وجملة «تمشي في الدماء» خبرها مقدّم، و«في الدماء» متعلق بـ«تمشي»."
  - "«عُفَيْرة» علم مؤنث حقه المنع من الصرف، وصُرف هنا فنُوّن، لأن الوزن لا يستقيم إلا به، وصرف الممنوع من ضرورات الشعر."
  - "«جِهارًا» مصدر في موضع الحال، أي مُجاهِرةً ظاهرةً للناس."
  - "«وزُفَّتْ» الواو للحال، و«قد» مقدّرة: وقد زُفّت. و«زُفّت» ماض مبني للمجهول، ونائب فاعله ضمير يعود على عُفَيْرة، و«في النساء» حال من نائب الفاعل: بين النساء، و«إلى بعلٍ» متعلق بـ«زُفّت»."
morphology:
  - "«عُفَيْرة» على «فُعَيْلة»، وهو بناء التصغير، والعُفْرة «الغبرة ولون التراب» [@lisan، ج4 ص590]."
  - "«جِهار» مصدر «جاهَر» على «فِعال»، كقِتال من قاتَل."
  - "«زُفَّتْ» من «زَفَّ يَزُفُّ»، فعل مضعّف، بُني للمجهول فضُمّ أوله."
  - "«الدِّماء» جمع «دَم» على «فِعال»، وجمعته وهو دم واحد تهويلًا لكثرته."
rhetoric:
  thesis: "البيت يضع أمام الرجال صورة العار بعينها: عروس زُفّت إلى زوج، فخرجت إليهم تمشي في دمها."
  devices:
    - title: "الكناية"
      text: "«تَمْشِي فِي الدِّمَاءِ» كناية عن الافتضاض كرهًا: لم تسمّ الفعل، وذكرت أثره الذي يراه الناس، وهو الدم. وهي من الكناية التي يُترك فيها لفظ المعنى ويُذكر معنى هو «تاليه وردفه في الوجود» عند عبد القاهر الجُرْجانيّ [@dalail، ص66]."
    - title: "المقابلة بين الصدر والعجز"
      text: "«تَمْشِي فِي الدِّمَاءِ» في الصدر، و«زُفَّتْ فِي النِّسَاءِ إِلَى بَعْلِ» في العجز: موكب عرس تمشي فيه العروس بين النساء إلى زوجها، يقابله مشيها في الدم. فالعجز يذكّرهم بما كان ينبغي أن يكون، والصدر بما كان. وفي تكرار «في» («في الدماء» و«في النساء») ما يقرّب بين الصورتين."
    - title: "الالتفات"
      text: "في «عُفَيْرَةٌ»: الالتفات انتقال الكلام من التكلّم أو الخطاب إلى الغيبة، أو العكس. والشاعرة هنا تتكلم عن نفسها باسمها كأنها امرأة أخرى، فلا تقول «وأصبحتُ» بل «وتصبح عُفَيْرة»، فتجعل نفسها مشهدًا يراه الرجال، لا شكوى يسمعونها."
  connection: "ثم تقلب الأدوار: لو كنا نحن الرجال وكنتم النساء لما رضينا بهذا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة، يُشبَع كسرها ياءً"
  scansion: "وَتُصْبِ / حُ تَمْشِي فِدْ / دِمَاءِ / عُفَيْرَتُنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — جِهَارَنْ / وَزُفْفَتْ فِنْ / نِسَاءِ / إِلَى بَعْلِي = فعولن / مفاعيلن / فعولُ / مفاعيلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة من الصدر فصارتا «فعولُ»، والثالثة من العجز [@atiq، ص29]. والعروض «مفاعلن» مقبوضة، والضرب «مفاعيلن» تامّ، كما في أبيات القصيدة كلها."
variants:
  - reading: "وَتُصْبِحُ تَمْشِي فِي الدُّجَى عُفَيْرَةٌ"
    status: "في النسخة «ج» من أصول الأغاني"
    note: "والدُّجى: الظلام. يقول محقق الأغاني إنها في هذه النسخة «في الدجا»، وفي سائر الأصول «في الرعاء»، وإنه أثبت «في الدماء» من «الكامل» لابن الأثير و«الصبح المنير» [@aghani-dk، ج11 ص166، الحاشية]."
  - reading: "وَتُصْبِحُ تَمْشِي فِي الرِّعَاءِ عُفَيْرَةٌ"
    status: "في سائر أصول الأغاني"
    note: "[@aghani-dk، ج11 ص166، الحاشية]."
  - reading: "عُفَيْرَةُ زُفَّتْ فِي النِّسَاءِ إِلَى بَعْلِ"
    status: "في أصول الأغاني"
    note: "يقول المحقق إن «جهارا» رواية «الكامل»، وإن في الأصول «عفيرة زفت»، فتتكرر «عُفَيْرة» في آخر الصدر وأول العجز [@aghani-dk، ج11 ص166، الحاشية]."
  - reading: "عَشِيَّةَ زُفَّتْ فِي النِّسَاءِ إِلَى بَعْلِ"
    status: "في «الصبح المنير»، فيما ينقله المحقق"
    note: "أي مساء زُفّت [@aghani-dk، ج11 ص166، الحاشية]."
