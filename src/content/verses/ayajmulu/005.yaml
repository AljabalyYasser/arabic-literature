first: "وَإِلَّا تَخَلَّوْا بَطْنَهَا وَتَحَمَّلُوا"
second: "إِلَى بَلَدٍ قَفْرٍ وَمُوتُوا مِنَ الهُزْلِ"
vocabulary:
  - term: "الهُزْلِ"
    text: "الهُزال، و«الهزال: نقيض السمن»، يقال: «وهزل هو هزلا وهزلا» [@lisan، ج11 ص696]، أي موتوا جوعًا في أرض لا عيش فيها."
