first: "أَجَدَّ الْقَلْبُ مِنْ سَلْمَى اجْتِنَابَا"
second: "وَأَقْصَرَ بَعْدَ مَا شَابَتْ وَشَابَا"
vocabulary:
  - term: "أَجَدَّ"
    text: "بمعنى جدّد، كما يقول المرزوقي فيما ينقل المحققان: جعل قلبه آخر ما أحدثه معها اجتنابًا جديدًا [@mufaddaliyyat، ص357، الحاشية]."
  - term: "أَقْصَرَ"
    text: "كفّ عن الصبا ونزع عنه [@mufaddaliyyat، ص357، الحاشية]."
