explained: false
first: "فَإِنْ تَكُ نَبْلُهَا طَاشَتْ وَنَبْلِي"
second: "فَقَدْ نَرْمِي بِهَا حِقَبًا صِيَابَا"
vocabulary:
  - term: "طَاشَتْ"
    text: "عدلت ومالت، كما يطيش الرجل في كلامه [@mufaddaliyyat، ص357، الحاشية]."
  - term: "حِقَبًا"
    text: "جمع حِقْبة، وهي المدة من الدهر [@mufaddaliyyat، ص357، الحاشية]."
  - term: "صِيَابَا"
    text: "جمع صائب، والسهم الصائب القاصد المصيب. والنبل ههنا مثل: فإن تغيّر الأمر في هذا الوقت فقد كان أمرنا قبل اليوم يجري على استقامة [@mufaddaliyyat، ص357، الحاشية]."
