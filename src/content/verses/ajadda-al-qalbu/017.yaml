explained: false
first: "وَأَكْفِيهَا مَعَاشِرَ قَدْ أَرَتْهُمْ"
second: "مِنَ الْجَرْبَاءِ فَوْقَهُمُ طِبَابَا"
vocabulary:
  - term: "الْجَرْبَاءِ"
    text: "السماء [@mufaddaliyyat، ص359، الحاشية]."
  - term: "طِبَابَا"
    text: "جمع طِبابة، وأصله الخرز الذي يكون في أسفل القربة طولًا، شبّه بها النجوم. ومعنى «أرتهم ... طبابا» كقول القائل: «لأُرِيَنّك الكواكب بالنهار». يريد أنه يكفي هذه الخلّة معاشر قد أعيتهم وأرتهم ما يكرهون [@mufaddaliyyat، ص359، الحاشية]."
