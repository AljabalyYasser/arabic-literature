explained: false
first: "رَأَبْتُ الصَّدْعَ مِنْ كَعْبٍ فَأَوْدَى"
second: "وَكَانَ الصَّدْعُ لَا يَعِدُ ارْتِئَابَا"
vocabulary:
  - term: "رَأَبْتُ الصَّدْعَ"
    text: "الصدع: الفتق والفساد، ورأبه: أصلحه [@mufaddaliyyat، ص358، الحاشية]."
  - term: "كَعْبٍ"
    text: "قبيلة [@mufaddaliyyat، ص358، الحاشية]، هي كعب بن ربيعة بن عامر، كما في البيت التالي."
  - term: "فَأَوْدَى"
    text: "هلك، أي ذهب الفساد بعد أن أصلحه [@mufaddaliyyat، ص358، الحاشية]."
  - term: "لَا يَعِدُ ارْتِئَابَا"
    text: "«يعد» من الوعد، و«ارتئاب» افتعال من رأب. يقول: أصلحت أمر كعب وما كانوا يقدّرون له إصلاحًا [@mufaddaliyyat، ص358، الحاشية]."
