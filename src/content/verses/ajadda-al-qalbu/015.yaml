explained: false
first: "أُعَوِّدُ مِثْلَهَا الْحُكَمَاءَ بَعْدِي"
second: "إِذَا مَا الْحَقُّ فِي الْأَشْيَاعِ نَابَا"
vocabulary:
  - term: "الْحَقُّ"
    text: "الحق عند العرب: ما يلزمهم من الحمالات وقرى الأضياف [@mufaddaliyyat، ص358، الحاشية]."
  - term: "الْأَشْيَاعِ"
    text: "المتفرقون [@mufaddaliyyat، ص358، الحاشية]."
  - term: "نَابَا"
    text: "جاء وألمّ [@mufaddaliyyat، ص358، الحاشية]."
  - term: "أُعَوِّدُ مِثْلَهَا الْحُكَمَاءَ"
    text: "يقول المحققان: «وبهذا البيت سمي \"معود الحكماء\". يقول: أقوم بهذه الأشياء ليتعودها الحكماء فيفعلوا مثلها» [@mufaddaliyyat، ص358، الحاشية]."
