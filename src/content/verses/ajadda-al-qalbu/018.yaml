first: "يَهُرُّ مَعَاشِرٌ مِنِّي وَمِنْهُمْ"
second: "هَرِيرَ النَّابِ حَاذَرَتِ الْعِصَابَا"
vocabulary:
  - term: "يَهُرُّ"
    text: "يكره [@mufaddaliyyat، ص359، الحاشية]."
  - term: "النَّابِ"
    text: "الناقة المسنّة [@mufaddaliyyat، ص359، الحاشية]."
  - term: "الْعِصَابَا"
    text: "ما يُعصب به كالعِصابة، والناقة العَصُوب هي التي لا تدرّ حتى يُعصب فخذاها. يقول: يلقون ما تلقى هذه الناقة من العصاب [@mufaddaliyyat، ص359، الحاشية]."
