explained: false
first: "مِنَ الْأَجْزَاعِ أَسْفَلَ مِنْ نُمَيْلٍ"
second: "كَمَا رَجَّعْتَ بِالْقَلَمِ الْكِتَابَا"
vocabulary:
  - term: "الْأَجْزَاعِ"
    text: "جمع جِزْع، وهو منعطف الوادي [@mufaddaliyyat، ص357، الحاشية]."
  - term: "نُمَيْلٍ"
    text: "تصغير نَمَلَى على حذف الزيادة، كما قال البكري [@mufaddaliyyat، ص357، الحاشية]."
  - term: "رَجَّعْتَ بِالْقَلَمِ الْكِتَابَا"
    text: "إذا عاد بالقلم على الكتابة. يصف دروس الدار وآثارها [@mufaddaliyyat، ص357، الحاشية]، أي بقيت منها خطوط كالكتابة."
