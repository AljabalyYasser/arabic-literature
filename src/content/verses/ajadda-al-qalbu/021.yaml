first: "وَكُنْتُ إِذَا الْعَظِيمَةُ أَفْظَعَتْهُمْ"
second: "نَهَضْتُ وَلَا أَدِبُّ لَهَا دِبَابَا"
vocabulary:
  - term: "أَفْظَعَتْهُمْ"
    text: "عظمت عليهم [@mufaddaliyyat، ص359، الحاشية]."
  - term: "دِبَابَا"
    text: "الدِّباب والدَّبيب واحد، وهو المشي على هِينة. يقول: قمت بها إذا ضعفوا عنها بقوة، ولم أضعف عن حملها فأدبّ بها ضعفًا [@mufaddaliyyat، ص359، الحاشية]."
