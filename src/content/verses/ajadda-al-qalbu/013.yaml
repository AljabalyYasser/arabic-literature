explained: false
first: "فَأَمْسَى كَعْبُهَا كَعْبًا وَكَانَتْ"
second: "مِنَ الشَّنْآنِ قَدْ دُعِيَتْ كِعَابَا"
vocabulary:
  - term: "الشَّنْآنِ"
    text: "البغض والعداوة [@mufaddaliyyat، ص358، الحاشية]."
  - term: "كِعَابَا"
    text: "جمع كعب: أراد كعب بن ربيعة بن عامر، أخا كلاب. جمع اسمه إرادة أنهم افترقوا وتقاطعوا بعد الألفة، فصاروا بمنزلة قبائل لا يجمعها أب، لكل واحدة منها أب اسمه كعب. ويفخر بأنه سعى في إصلاح أمرهم حتى عادوا قبيلًا واحدًا [@mufaddaliyyat، ص358، الحاشية]."
