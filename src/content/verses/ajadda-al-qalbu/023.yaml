first: "إِذَا نَزَلَ السَّحَابُ بِأَرْضِ قَوْمٍ"
second: "رَعَيْنَاهُ وَإِنْ كَانُوا غِضَابَا"
vocabulary:
  - term: "السَّحَابُ ... رَعَيْنَاهُ"
    text: "«أراد بالسحاب الغيث الذي يكون عنه النبات» [@mufaddaliyyat، ص359، الحاشية]: إذا أمطرت أرض قوم رعينا نبتها ولو غضبوا، عزًّا وقوة. وروايته في اللسان «إذا سقط السماء»، و«السماء: المطر، مذكر» [@lisan، ج14 ص399]."
