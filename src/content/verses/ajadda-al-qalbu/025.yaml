explained: false
first: "وَدَافِعَةِ الْحِزَامِ بِمِرْفَقَيْهَا"
second: "كَشَاةِ الرَّبْلِ آنَسَتِ الْكِلَابَا"
vocabulary:
  - term: "وَدَافِعَةِ الْحِزَامِ بِمِرْفَقَيْهَا"
    text: "ورُبّ فرس تدفع الحزام بمرفقيها، وفي اللسان على رواية «ومُحْفِزة الحزام»: «يعني أن هذه الفرس تدفع الحزام بمرفقيها من شدة جريها» [@lisan، ج5 ص337]."
  - term: "كَشَاةِ الرَّبْلِ"
    text: "الشاة هنا الثور الوحشي، و«الشاة الثور الوحشي» عند الجوهري [@lisan، ج13 ص509]، و«الربل: ضروب من الشجر» [@lisan، ج11 ص264] يخضرّ آخر الصيف، فهو ثور يرعاه."
  - term: "آنَسَتِ الْكِلَابَا"
    text: "أحسّت كلاب الصيد، فهي تعدو بأشد ما تقدر."
