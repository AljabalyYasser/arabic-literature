explained: false
first: "سَبَقْتُ بِهَا قُدَامَةَ أَوْ سُمَيْرًا"
second: "وَلَوْ دُعِيَا إِلَى مِثْلٍ أَجَابَا"
vocabulary:
  - term: "قُدَامَةَ أَوْ سُمَيْرًا"
    text: "ينقل المحققان عن التبريزي في شرح الحماسة أنهما من بني سَلِمة الخير من قُشَيْر بن كعب، وكانا شريفين، وكان قدامة يقال له الذائد، وقُتل يوم النِّسار. وفي الأصمعيات: «أراد: وسميرًا»، أي «أو» بمعنى الواو [@mufaddaliyyat، ص359، الحاشية]."
  - term: "إِلَى مِثْلٍ"
    text: "إلى مثل هذه الحمالة."
