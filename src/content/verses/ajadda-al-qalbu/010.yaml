first: "وَنَاجِيَةٍ بَعَثْتُ عَلَى سَبِيلٍ"
second: "كَأَنَّ عَلَى مَغَابِنِهَا مَلَابَا"
vocabulary:
  - term: "وَنَاجِيَةٍ"
    text: "الناجية: الناقة السريعة، وأراد: ورُبّ ناجية [@mufaddaliyyat، ص358، الحاشية]."
  - term: "مَغَابِنِهَا"
    text: "أسفل البطن [@mufaddaliyyat، ص358، الحاشية]."
  - term: "مَلَابَا"
    text: "ضرب من الطيب، شبّه به عرق الناقة [@mufaddaliyyat، ص358، الحاشية]."
