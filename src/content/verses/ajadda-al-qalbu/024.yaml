explained: false
first: "بِكُلِّ مُقَلِّصٍ عَبْلٍ شَوَاهُ"
second: "إِذَا وُضِعَتْ أَعِنَّتُهُنَّ ثَابَا"
vocabulary:
  - term: "مُقَلِّصٍ"
    text: "الطويل، وأراد الفرس [@mufaddaliyyat، ص359، الحاشية]."
  - term: "عَبْلٍ شَوَاهُ"
    text: "الشوى: القوائم، الواحدة شواة، وعَبْل الشوى: ضخمها في اكتناز [@mufaddaliyyat، ص359، الحاشية]."
  - term: "وُضِعَتْ أَعِنَّتُهُنَّ ثَابَا"
    text: "ثاب: رجع. أي إذا وُضعت أعنّة الخيل عند تقصيرهن في الجري من التعب والإعياء، ثاب هذا الفرس بجري جديد، للفضل الذي فيه [@mufaddaliyyat، ص359، الحاشية]."
