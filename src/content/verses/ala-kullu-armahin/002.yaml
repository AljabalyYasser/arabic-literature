first: "فَإِنَّ الَّذِي أَعْطَيْتُمُ أَوْ مَنَعْتُمُ"
second: "لَكَالتَّمْرِ أَوْ أَحْلَى لِخَلْفِ بَنِي فِهْرِ"
vocabulary:
  - term: "الَّذِي أَعْطَيْتُمُ"
    text: "في هامش مخطوطة ابن السِّكِّيت: «يعنى الصدقة هى أحلى من التمر» [@diwan-hutayah، ص330]."
  - term: "لِخَلْفِ"
    text: "«خلفهم: أولادهم ونسلهم» [@diwan-hutayah، ص330]."
  - term: "بَنِي فِهْرِ"
    text: "«وبنو فهر من قريش» [@diwan-hutayah، ص330]."
