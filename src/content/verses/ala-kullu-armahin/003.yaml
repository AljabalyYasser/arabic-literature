first: "فَبَاسْتِ بَنِي عَبْسٍ وَأَفْنَاءِ طَيِّئٍ"
second: "وَبَاسْتِ بَنِي دُودَانَ حَاشَا بَنِي نَصْرِ"
meaning: "شتيمة صريحة: «باسْتِ بني فلان» معناها: ليكن ذلك في أدبارهم، أي في مؤخراتهم، والاست هي الدُّبُر. وهي عبارة احتقار تقولها العرب لقوم تريد إذلالهم. في «لسان العرب»: «وَيُقَالُ لِلْقَوْمِ إِذَا استُذِلُّوا واسْتُخِفَّ بِهِمْ: باسْتِ بَنِي فُلانٍ، وَهُوَ شَتْمٌ لِلْعَرَبِ؛ وَمِنْهُ قَوْلُ الحُطَيئة»، ثم أنشد البيت [@lisan، ج13 ص497]. فالشاعر يشتم قبيلته عَبْسًا، وقبائل طيّئ، وبني دُودان من أسد، ويستثني من بني دُودان بني نصر. وفي شرح ابن السِّكِّيت: «كلمة تقولها العرب تصغير ومحقرة، أى توعدنى لتقتلنى فباستك ذلك»، أي: لا أبالي بوعيدك، فليكن في دبرك [@diwan-hutayah، ص330]."
vocabulary:
  - term: "بَاسْتِ"
    text: "الباء حرف جر، و«اسْت»: الدُّبُر، وأصلها سَتَه. والعبارة شتم وتحقير [@lisan، ج13 ص497]."
  - term: "أَفْنَاءِ طَيِّئٍ"
    text: "أخلاطها من قبائل شتى؛ وفي الشرح: «وأفناء طيئ قبائلها» [@diwan-hutayah، ص330]."
  - term: "بَنِي دُودَانَ"
    text: "من بني أسد، ومنهم بنو نصر الذين يستثنيهم، كما يُفهم من شرح ابن السِّكِّيت [@diwan-hutayah، ص330]."
  - term: "حَاشَا بَنِي نَصْرِ"
    text: "إلا بني نصر. وفي شرح ابن السِّكِّيت: «أراد بنى نصر بن قُعَيْن ارتدّوا عن الإسلام، لم يرتدّ من بنى أسد غيرهم» [@diwan-hutayah، ص330]."
context: "قلب القطعة: بعد أن فضّل رماح قومه على رماح غيرهم، يشتم القبائل التي أدّت الصدقة إلى المدينة. يقول السُّكَّرِيّ: «فإن ذلك فى هؤلاء، لأنهم أعطوا الزكاة» [@diwan-hutayah، ص330]. والشاعر يشتم قبيلته عَبْسًا نفسها، ويستثني بني نصر لأنهم وقفوا معه. فالقطعة شعر حرب في أيام الرِّدّة، يحرّض فيه قومه، وليس فيه حكم منا على أحد."
syntax:
  - "«فَبَاسْتِ بَنِي عَبْسٍ» الفاء استئنافية، والجار والمجرور متعلق بخبر محذوف لمبتدأ محذوف، والتقدير: فذلك باست بني عبس، أي: ليكن ذلك فيها."
  - "«وَأَفْنَاءِ طَيِّئٍ» معطوف على «بَنِي عَبْسٍ» مجرور بالإضافة."
  - "«حَاشَا بَنِي نَصْرِ» «حاشا» حرف جر يفيد الاستثناء، و«بَنِي» مجرور بالياء، أو فعل ماضٍ و«بني» مفعول به منصوب بالياء، والوجهان جائزان."
morphology:
  - "«اسْتٌ» اسم أوله همزة وصل، وأصله «سَتَهٌ»، حُذفت لامه وعُوّض منها همزة الوصل، وجمعه أستاه."
  - "«أَفْنَاءٌ» جمع لا مفرد له من لفظه، بمعنى الأخلاط."
  - "«طَيِّئٌ» اسم قبيلة على وزن فَيْعِل."
rhetoric:
  thesis: "بيت هجاء فاحش في لفظه، وهو في معناه بيان حرب: يفرز الشاعر القبائل بين من يُشتم ومن يُستثنى، ويضع قبيلته في جانب المشتومين. فالشتيمة هنا موقف سياسي يُعلن، لا غضب عابر."
  devices:
    - title: "الكناية"
      text: "في «فَبَاسْتِ بَنِي عَبْسٍ» لم يقل: هم أذلاء، بل ذكر العضو الذي يُرمى إليه بالاحتقار. وهي عبارة من كلام العرب في الشتم كما يقول «لسان العرب» [@lisan، ج13 ص497]."
    - title: "التكرار"
      text: "في «فَبَاسْتِ ... وَبَاسْتِ» كرر الشتيمة في صدر البيت وعجزه، فجعل البيت قائمتين من المشتومين."
    - title: "الاستثناء"
      text: "في «حَاشَا بَنِي نَصْرِ» يستثني في آخر البيت، فيأتي الاستثناء بعد الشتم كأنه مكافأة. والقافية نفسها «نَصْرِ» تحمل اسم من نصروه."
  connection: "ثم يفدي بني ذُبْيان الذين قاتلوا: «فِدًى لِبَنِي ذُبْيَانَ أُمِّي وَخَالَتِي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الراء المكسورة، تتبعها ياء الإطلاق"
  scansion: "فَبَاسْتِ / بَنِي عَبْسِنْ / وَأَفْنَا / ءِطَيْيِئِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — وَبَاسْتِ / بَنِي دُودَا / نَحَاشَا / بَنِي نَصْرِي = فعولُ / مفاعيلن / فعولن / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى في الشطرين [@atiq، ص29]. والعروض مقبوضة «مفاعلن»، والضرب صحيح «مفاعيلن»."
