first: كُلُّ خَلِيلٍ كُنْتُ خَالَلْتُهُ
second: لَا تَرَكَ اللَّهُ لَهُ وَاضِحَهْ
vocabulary:
- term: خَالَلْتُهُ
  text: اتخذته خليلًا وصادقته.
- term: وَاضِحَهْ
  text: «الأسنان التي تبدو عند الضحك، صفة غالبة» [@lisan، ج2 ص634]؛ فهو يدعو عليه بذهاب أسنانه.
