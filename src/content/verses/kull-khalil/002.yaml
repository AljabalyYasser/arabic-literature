explained: false
first: كُلُّهُمُ أَرْوَغُ مِنْ ثَعْلَبٍ
second: مَا أَشْبَهَ اللَّيْلَةَ بِالْبَارِحَهْ
vocabulary:
- term: أَرْوَغُ
  text: 'أكثر روغانًا ومراوغة. ومن أمثالهم: «أروغ من ثعالة، ومن ذنب ثعلب» [@maydani، ج1 ص317].'
- term: الْبَارِحَهْ
  text: الليلة الماضية. و«ما أشبه الليلة بالبارحة» مثل «يضرب في تساوي الناس في الشر والخديعة» [@maydani، ج2 ص275].
