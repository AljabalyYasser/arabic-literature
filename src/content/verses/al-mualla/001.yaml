first: كَأَنِّي إِذْ نَزَلْتُ عَلَى الْمُعَلَّى
second: نَزَلْتُ عَلَى الْبَوَاذِخِ مِنْ شَمَامِ
vocabulary:
- term: الْمُعَلَّى
  text: رجل من بني تيم أجار الشاعر من المنذر بن ماء السماء، بحسب مقدمة القطعة في الديوان.
- term: الْبَوَاذِخِ
  text: الجبال العالية، واحدها باذخ.
- term: شَمَامِ
  text: جبل.
