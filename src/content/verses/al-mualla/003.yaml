first: أَصَدَّ نَشَاصَ ذِي الْقَرْنَيْنِ حَتَّى
second: تَوَلَّى عَارِضُ الْمَلِكِ الْهُمَامِ
vocabulary:
- term: أَصَدَّ
  text: صرف وردّ [@lisan، ج3 ص245].
- term: نَشَاصَ
  text: السحاب المرتفع، يعني الجيش.
- term: ذِي الْقَرْنَيْنِ
  text: «المنذر الأكبر بن ماء السماء»، وبه فسّر ابن دُرَيْد هذا البيت [@lisan، ج13 ص333].
- term: عَارِضُ
  text: السحاب المعترض في الأفق، يعني الجيش.
