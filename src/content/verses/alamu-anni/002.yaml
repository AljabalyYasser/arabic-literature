first: "بَيْنَا الْفَتَى مُعْجَبٌ بِالْعَيْشِ مُغْتَبِطٌ"
second: "إِذَا الْفَتَى لِلْمَنَايَا مُسْلَمٌ غَلِقُ"
vocabulary:
- term: "غَلِقُ"
  text: "من غَلِق الرهن. قال أبو عُبَيْد: «غَلِقَ الرهنُ إِذَا اسْتَحَقَّهُ الْمُرْتَهِنُ» [@lisan، ج10 ص293]. يقول: صار الفتى للمنايا كالرهن الذي لا يُفتكّ."
