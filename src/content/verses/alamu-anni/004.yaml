explained: false
first: "كَالْغُصْنِ بَيْنَا تَرَاهُ نَاعِمًا هَدِبًا"
second: "إِذْ هَاجَ وَانْحَتَّ عَنْ أَفْنَانِهِ الْوَرَقُ"
vocabulary:
- term: "هَدِبًا"
  text: "كثير الأغصان. يقول المحققون: «وهدب الأشجار: أغصانها» [@diwan-kaab، ص228]."
- term: "هَاجَ"
  text: "يبس. وفي اللسان: «وهاجَ البقلُ هِياجاً ... يَبِسَ واصفرَّ» [@lisan، ج2 ص395]."
- term: "انْحَتَّ"
  text: "تساقط. وفي اللسان: «وانْحَتَّ شَعَرُه عَنْ رأْسه، وانْحَصَّ إِذا تَساقَطَ» [@lisan، ج2 ص22]."
