first: وَإِنَّ امْرَأً أَسْرَى إِلَيْكِ وَدُونَهُ
second: فَيَافٍ تَنُوفَاتٌ وَبَيْدَاءُ خَيْفَقُ
vocabulary:
- term: أَسْرَى
  text: سار ليلًا.
- term: فَيَافٍ
  text: '«والفَيْفَاء: الصَّحْرَاءُ المَلساء وهنَّ الفَيَافِي» [@lisan، ج9 ص274].'
- term: تَنُوفَاتٌ
  text: '«التَّنُوفةُ: القَفْرُ مِنَ الأَرض» [@lisan، ج9 ص18].'
- term: خَيْفَقُ
  text: واسعة.
