first: وَلَا عَادِيًا لَمْ يَمْنَعِ الْمَوْتَ مَالُهُ
second: وَحِصْنٌ بِتَيْمَاءَ الْيَهُودِيِّ أَبْلَقُ
vocabulary:
- term: عَادِيًا
  text: 'عادياء، أبو السَّمَوْأَل صاحب الحصن، و«الأَبْلَقُ الفَرْد: قَصْرُ السَّمَوْأَل بْنِ عادِياء الْيَهُودِيِّ بأَرض تَيْماء» [@lisan، ج10 ص26].'
- term: أَبْلَقُ
  text: اسم الحصن، وقد «أَبدل أَبلق مِنْ حِصْنٍ» كما يقول صاحب اللسان [@lisan، ج10 ص26].
