explained: false
first: يُوَازِي كُبَيْدَاءَ السَّمَاءِ وَدُونَهُ
second: بَلَاطٌ وَدَارَاتٌ وَكِلْسٌ وَخَنْدَقُ
vocabulary:
- term: كُبَيْدَاءَ السَّمَاءِ
  text: 'وسطها، يقال: حلّق الطائر حتى صار في كبد السماء «وكُبَيْداءِ السَّمَاءِ» [@lisan، ج3 ص375].'
- term: بَلَاطٌ
  text: '«والبَلاطُ، بِالْفَتْحِ: الْحِجَارَةُ المَفْرُوشةُ فِي الدَّارِ» [@lisan، ج7 ص264].'
- term: وَكِلْسٌ
  text: '«الكِلْسُ: مِثْلُ الصَّارُوج يُبْنَى بِهِ» [@lisan، ج6 ص197].'
- term: وَخَنْدَقُ
  text: حفير يحيط بالحصن.
