first: وَإِنَّ عِتَاقَ الْعِيسِ سَوْفَ يَزُورُكُمْ
second: ثَنَاءٌ عَلَى أَعْجَازِهِنَّ مُعَلَّقُ
vocabulary:
- term: عِتَاقَ الْعِيسِ
  text: 'كرام الإبل البيض، و«العِيَس والعِيسَة: بَيَاضٌ يُخالِطُه شَيْءٌ مِنْ شُقْرة» [@lisan، ج6 ص152].'
- term: أَعْجَازِهِنَّ
  text: مآخيرها، أي يحمله الركبان.
