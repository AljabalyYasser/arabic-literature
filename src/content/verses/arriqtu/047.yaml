first: وَأَصْفَرَ كَالْحِنَّاءِ طَامٍ جِمَامُهُ
second: إِذَا ذَاقَهُ مُسْتَعْذِبُ الْمَاءِ يَبْصُقُ
vocabulary:
- term: وَأَصْفَرَ
  text: وماء أصفر متغير.
- term: طَامٍ
  text: «ارْتَفَعَ وعَلا ومَلأَ النَّهْرُ، فَهُوَ طامٍ» [@lisan، ج15 ص15].
- term: جِمَامُهُ
  text: 'ما اجتمع منه، و«الجُمَّة: الْمَاءُ نَفْسُهُ» [@lisan، ج12 ص105].'
