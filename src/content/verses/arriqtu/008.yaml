explained: false
first: بَنَاهُ سُلَيْمَانُ بْنُ دَاوُدَ حِقْبَةً
second: لَهُ أَزَجٌ عَالٍ وَطَيٌّ مُوَثَّقُ
vocabulary:
- term: حِقْبَةً
  text: '«والحِقْبةُ مِنَ الدَّهر: مُدَّةٌ لَا وَقْتَ لَهَا» [@lisan، ج1 ص326].'
- term: أَزَجٌ
  text: '«الأَزَجُ: بيْتٌ يُبْنى طُولًا» [@lisan، ج2 ص208].'
- term: وَطَيٌّ مُوَثَّقُ
  text: وبناء بالحجارة محكم، من طيّ البئر وهو بناء جوانبها بالحجارة.
