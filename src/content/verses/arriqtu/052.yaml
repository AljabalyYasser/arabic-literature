explained: false
first: تُشَبُّ لِمَقْرُورَيْنِ يَصْطَلِيَانِهَا
second: وَبَاتَ عَلَى النَّارِ النَّدَى وَالْمُحَلَّقُ
vocabulary:
- term: لِمَقْرُورَيْنِ
  text: لرجلين أصابهما القُرّ، وهو البرد.
- term: يَصْطَلِيَانِهَا
  text: يستدفئان بها.
- term: النَّدَى
  text: الكرم.
- term: وَالْمُحَلَّقُ
  text: لقب عبد العُزّى بن حَنْتَم الكلابي، سُمّي بذلك لأن حصانًا له عضّه في وجنته فترك فيها أثرًا كالحلقة [@aghani-dk، ج9 ص115]. ويضبطه اللسان «المُحلِّق، بِكَسْرِ اللَّامِ» [@lisan، ج10 ص64].
