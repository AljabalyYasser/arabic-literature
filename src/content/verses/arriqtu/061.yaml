first: طَوِيلُ الْيَدَيْنِ رَهْطُهُ غَيْرُ ثِنْيَةٍ
second: أَشَمُّ كَرِيمٌ جَارُهُ لَا يُرَهَّقُ
vocabulary:
- term: طَوِيلُ الْيَدَيْنِ
  text: كناية عن الكرم.
- term: ثِنْيَةٍ
  text: '«والثُّنْيَان، بِالضَّمِّ: الَّذِي يَكُونُ دُونَ السَّيِّدِ فِي الْمَرْتَبَةِ، وَالْجَمْعُ ثِنْيَةٌ» [@lisan، ج14 ص122].'
- term: أَشَمُّ
  text: عزيز أبيّ.
- term: لَا يُرَهَّقُ
  text: لا يُظلم ولا يُحمَّل ما لا يطيق.
