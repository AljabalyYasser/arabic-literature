first: يُعَالَى عَلَيْهِ الْجُلُّ كُلَّ عَشِيَّةٍ
second: وَيُرْفَعُ نُقْلًا بِالضُّحَى وَيُعَرَّقُ
vocabulary:
- term: يُعَالَى عَلَيْهِ الْجُلُّ
  text: 'تُرفع عليه أغطيته. والجُلّ: كساء تُغطّى به الدابة.'
- term: وَيُرْفَعُ نُقْلًا بِالضُّحَى وَيُعَرَّقُ
  text: ويُحمل في الضحى على عدو سريع حتى يعرق، وكانوا يضمّرون الخيل بأن يُلقى عليها «جُلٌّ فَوْقَ جُلٍّ» «لِتَعْرَقَ الفرسُ تَحْتَ تِلْكَ الجِلالِ ويُخْرِجَ العرقُ شَحْمَها» [@lisan، ج3 ص485].
