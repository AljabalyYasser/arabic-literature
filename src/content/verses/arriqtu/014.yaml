explained: false
first: وَيُجْبَى إِلَيْهِ السَّيْلَحُونَ وَدُونَهَا
second: صَرِيفُونَ فِي أَنْهَارِهَا وَالْخَوَرْنَقُ
vocabulary:
- term: وَيُجْبَى إِلَيْهِ
  text: يُجمع إليه خراجها.
- term: السَّيْلَحُونَ
  text: '«والسَّيْلَحُون: مَوْضِعٌ» [@lisan، ج2 ص488].'
- term: صَرِيفُونَ
  text: '«وصَرِيفون: مَوْضِعٌ بِالْعِرَاقِ» [@lisan، ج9 ص192].'
- term: وَالْخَوَرْنَقُ
  text: '«والخَوَرْنق: اسْمُ قَصْرٍ بِالْعِرَاقِ، فَارِسِيٌّ مُعَرَّبٌ، بِنَاهُ النُّعْمَانُ الأَكبر» [@lisan، ج10 ص79].'
