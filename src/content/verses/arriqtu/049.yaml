first: لَمَحْقُوقَةٌ أَنْ تَسْتَجِيبِي لِصَوْتِهِ
second: وَأَنْ تَعْلَمِي أَنَّ الْمُعَانَ مُوَفَّقُ
vocabulary:
- term: لَمَحْقُوقَةٌ
  text: 'لجديرة. وفي اللسان: «فإِنه أَراد لَخُلّة محْقوقة، يَعْنِي بالخُلّة الخَلِيلَ» [@lisan، ج10 ص51].'
- term: الْمُعَانَ
  text: من يعينه الله.
