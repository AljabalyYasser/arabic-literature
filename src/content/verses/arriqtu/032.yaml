explained: false
first: وَمَا كُنْتُ شَاحِرْدًا وَلَكِنْ حَسِبْتُنِي
second: إِذَا مِسْحَلٌ سَدَّى لِيَ الْقَوْلَ أَنْطِقُ
vocabulary:
- term: شَاحِرْدًا
  text: 'لفظ فارسي، يقول فيه المحقق: «قالوا ان معناها متعلم» [@diwan-asha، ص257، الحاشية].'
- term: مِسْحَلٌ
  text: '«ومِسْحَلٌ: اسْمُ جِنِّيِّ الأَعشى» [@lisan، ج11 ص331]، أي الذي يلقي إليه القول كما يقول في البيت.'
- term: سَدَّى لِيَ الْقَوْلَ
  text: نسجه لي، من سَدى الثوب.
