explained: false
first: نَفَى الذَّمَّ عَنْ آلِ الْمُحَلَّقِ جَفْنَةٌ
second: كَجَابِيَةِ السَّيْحِ الْعِرَاقِيِّ تَفْهَقُ
vocabulary:
- term: جَفْنَةٌ
  text: قصعة الطعام الكبيرة.
- term: كَجَابِيَةِ
  text: '«والجابِيَة: الْحَوْضُ الضَّخْم» [@lisan، ج14 ص129]. وفي روايته «الشَّيْخِ الْعِرَاقِيِّ» مكان «السَّيْحِ»، وقال: «خَصَّ الْعِرَاقِيَّ لِجَهْلِهِ بِالْمِيَاهِ لأَنه حَضَرِيّ، فَإِذَا وَجَدَهَا مَلأَ جابيتَه» [@lisan، ج14 ص129].'
- term: السَّيْحِ
  text: '«السَّيْحُ: الماءُ الظَّاهِرُ الْجَارِي عَلَى وَجْهِ الأَرض» [@lisan، ج2 ص492].'
- term: تَفْهَقُ
  text: تمتلئ حتى تفيض، «يَعْنِي الِامْتِلَاءَ» [@lisan، ج10 ص314].
