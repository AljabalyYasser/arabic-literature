explained: false
first: لَهُ دَرْمَكٌ فِي رَأْسِهِ وَمَشَارِبٌ
second: وَمِسْكٌ وَرَيْحَانٌ وَرَاحٌ تُصَفَّقُ
vocabulary:
- term: دَرْمَكٌ
  text: 'الدقيق الأبيض الخالص: «والدَّرْمَكُ: دَقِيقُ الحُوَّارَى» [@lisan، ج10 ص423]، وأنشد صاحب اللسان البيت شاهدًا عليه.'
- term: وَمَشَارِبٌ
  text: مواضع يُشرب فيها.
- term: تُصَفَّقُ
  text: 'تُنقل من إناء إلى إناء لتصفو: «وصَفَقَه وصَفَّقَه وأَصْفَقَه: حوَّله مِنْ إِناء إِلى إِناء لِيَصْفُو» [@lisan، ج10 ص202].'
