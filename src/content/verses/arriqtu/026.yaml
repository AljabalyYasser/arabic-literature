first: هِيَ الصَّاحِبُ الْأَدْنَى وَبَيْنِي وَبَيْنَهَا
second: مَجُوفٌ عِلَافِيٌّ وَقِطْعٌ وَنُمْرُقُ
vocabulary:
- term: مَجُوفٌ
  text: 'رحل عظيم الجوف، قال أبو عبيدة: «المَجُوف الرَّجُل الضَّخْمُ» الجوف، وأنشد البيت [@lisan، ج9 ص35].'
- term: عِلَافِيٌّ
  text: «العِلافيّ أَعظم الرِّحَالِ أَخَرَةً وَوَاسِطًا» [@lisan، ج9 ص256].
- term: وَقِطْعٌ
  text: 'طِنفسة تُلقى على الرحل: «القِطْعِ، يَعْنِي الطِّنْفِسةَ» [@lisan، ج1 ص213].'
- term: وَنُمْرُقُ
  text: وسادة.
