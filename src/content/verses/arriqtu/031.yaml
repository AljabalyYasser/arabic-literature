explained: false
first: نَهَارُ شَرَاحِيلَ بْنِ طَوْدٍ يُرِيبُنِي
second: وَلَيْلُ أَبِي لَيْلَى أَمَرُّ وَأَعْلَقُ
vocabulary:
- term: شَرَاحِيلَ بْنِ طَوْدٍ ... أَبِي لَيْلَى
  text: خصمان يعرّض بهما الشاعر، ولا نعرف عنهما إلا ما في البيت.
- term: يُرِيبُنِي
  text: يوقعني في الريبة والقلق.
- term: وَأَعْلَقُ
  text: 'وأشد أذى باللسان، يقال: «سَلَقَه بِلِسَانِهِ وعَلَقَه إِذا تَنَاوَلَهُ؛ وَهُوَ مَعْنَى قَوْلِ الأَعشى» [@lisan، ج10 ص269].'
