explained: false
first: فَذَاكَ وَلَمْ يُعْجِزْ مِنَ الْمَوْتِ رَبَّهُ
second: وَلَكِنْ أَتَاهُ الْمَوْتُ لَا يَتَأَبَّقُ
vocabulary:
- term: وَلَمْ يُعْجِزْ مِنَ الْمَوْتِ رَبَّهُ
  text: 'لم يُفلت صاحبَه من الموت: «وَمَعْنَى الإِعْجاز الفَوْتُ والسَّبْقُ» [@lisan، ج5 ص370].'
- term: لَا يَتَأَبَّقُ
  text: 'لا يستخفي: «وأَبَقَ وتأَبَّقَ: اسْتَخْفَى ثُمَّ ذَهَبَ» [@lisan، ج10 ص3].'
