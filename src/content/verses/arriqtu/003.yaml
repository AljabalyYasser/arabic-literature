first: فَإِنْ يُمْسِ عِنْدِي الشَّيْبُ وَالْهَمُّ وَالْعَشَى
second: فَقَدْ بِنَّ مِنِّي وَالسِّلَامُ تُفَلَّقُ
vocabulary:
- term: الْعَشَى
  text: 'ضعف البصر: «العَشَا، مقصورٌ: سوءُ البَصَرِ بالليلِ والنهارِ» [@lisan، ج15 ص56].'
- term: وَالسِّلَامُ تُفَلَّقُ
  text: 'والحجارة نفسها تتشقق على الدهر: «والسِّلامُ والسَّلِمُ: الْحِجَارَةُ» [@lisan، ج12 ص297].'
