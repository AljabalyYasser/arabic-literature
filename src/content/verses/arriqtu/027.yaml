first: وَتُصْبِحُ مِنْ غِبِّ السُّرَى وَكَأَنَّمَا
second: أَلَمَّ بِهَا مِنْ طَائِفِ الْجِنِّ أَوْلَقُ
vocabulary:
- term: غِبِّ السُّرَى
  text: عقب سير الليل.
- term: طَائِفِ الْجِنِّ
  text: 'مسّها: «وأَصابه طَوْفٌ مِنَ الشَّيْطَانِ وطَائِفٌ وطَيِّف وطَيْفٌ، الأَخيرة عَلَى التَّخْفِيفِ، أَي مَسٌّ» [@lisan، ج9 ص225].'
- term: أَوْلَقُ
  text: «فالأَوْلَقُ شِبْهُ الْجُنُونِ» [@lisan، ج10 ص384].
