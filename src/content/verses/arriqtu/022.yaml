explained: false
first: وَشَاوٍ إِذَا شِئْنَا كَمِيشٌ بِمِسْعَرٍ
second: وَصَهْبَاءُ مِزْبَادٌ إِذَا مَا تُصَفَّقُ
vocabulary:
- term: وَشَاوٍ
  text: ورجل يشوي اللحم.
- term: كَمِيشٌ
  text: 'سريع: «فانْكَمَشَ وتَكَمَّش أَي أَسرع» [@lisan، ج6 ص343].'
- term: بِمِسْعَرٍ
  text: 'بما توقد به النار: «والمِسْعَرُ والمِسْعارُ: مَا سُعِرَتْ بِهِ» [@lisan، ج4 ص365].'
- term: وَصَهْبَاءُ
  text: '«والصَّهْباءُ: الخَمْر؛ سُمِّيَتْ بِذَلِكَ لِلَوْنِهَا» [@lisan، ج1 ص532].'
- term: مِزْبَادٌ
  text: يعلوها الزَّبَد.
