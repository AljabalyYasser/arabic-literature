first: وَقَدْ أَقْطَعُ الْيَوْمَ الطَّوِيلَ بِفِتْيَةٍ
second: مَسَامِيحَ تُسْقَى وَالْخِبَاءُ مُرَوَّقُ
vocabulary:
- term: مَسَامِيحَ
  text: 'أسخياء، جمع مِسْماح: «وَرِجَالٌ مَسامِيحُ» [@lisan، ج2 ص489].'
- term: وَالْخِبَاءُ مُرَوَّقُ
  text: والخيمة مضروب لها رِواق، و«رِواق الْبَيْتِ مُقدَّمه» [@lisan، ج10 ص133].
