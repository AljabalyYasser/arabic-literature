explained: false
first: وَيَأْمُرُ لِلْيَحْمُومِ كُلَّ عَشِيَّةٍ
second: بِقَتٍّ وَتَعْلِيقٍ وَقَدْ كَادَ يَسْنَقُ
vocabulary:
- term: لِلْيَحْمُومِ
  text: فرس النعمان بن المنذر، «سُمِّيَ يَحموماً لِشِدَّةِ سَوَادِهِ» [@lisan، ج12 ص157].
- term: بِقَتٍّ
  text: '«والقَتُّ: الفِصْفِصَةُ، وخَصَّ بعضُهم بِهِ اليابسةَ مِنْهَا» [@lisan، ج2 ص71].'
- term: وَتَعْلِيقٍ
  text: 'علف يُعلَّق عليه: «والعَلِيقُ: القَضِيمُ يُعَلَّق عَلَى الدَّابَّةِ» [@lisan، ج10 ص267].'
- term: يَسْنَقُ
  text: 'يُتخم: «السَّنَقُ: البَشَمُ» [@lisan، ج10 ص165]، والبَشَم: التخمة.'
