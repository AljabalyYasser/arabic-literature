first: إِذَا قُلْتُ غَنِّ الشَّرْبَ قَامَتْ بِمِزْهَرٍ
second: يَكَادُ إِذَا دَارَتْ لَهُ الْكَفُّ يَنْطِقُ
vocabulary:
- term: غَنِّ الشَّرْبَ
  text: 'كذا في الديوان، والمخاطَبة القينة: أطربي الشَّرْب، و«الشَّرْبُ والشُّرُوبُ: القَوم يَشْرَبُون، ويجْتَمعون عَلَى الشَّراب» [@lisan، ج1 ص488].'
- term: بِمِزْهَرٍ
  text: 'بعود: «المِعْزَفُ، وَهُوَ المِزْهَرُ والعُودُ» [@lisan، ج2 ص401].'
