explained: false
first: مِنَ الْجَاهِلِ الْعِرِّيضِ يُهْدِي لِيَ الْخَنَا
second: وَذَلِكَ مِمَّا يَبْتَرِينِي وَيَعْرُقُ
vocabulary:
- term: الْعِرِّيضِ
  text: 'يقول المحقق: «الذي يتعرض للناس بالشر» [@diwan-asha، ص257، الحاشية].'
- term: الْخَنَا
  text: '«والخَنَا: الفُحْش» [@lisan، ج14 ص244].'
- term: يَبْتَرِينِي
  text: 'يَبريني وينحتني: «وابْتَرَاه: كبَراه» [@lisan، ج14 ص70].'
- term: وَيَعْرُقُ
  text: 'ويأخذ لحمي كما يُعرق العظم: «يُقَالُ: عَرَقْتُ العظمَ وتَعَرَّقْتُه إِذا أَخذتَ اللَّحْمَ عَنْهُ بأَسنانك نَهْشاً» [@lisan، ج10 ص244].'
