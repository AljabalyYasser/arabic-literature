first: رَضِيعَيْ لِبَانٍ ثَدْيَ أُمٍّ تَحَالَفَا
second: بِأَسْحَمَ دَاجٍ عَوْضُ لَا نَتَفَرَّقُ
vocabulary:
- term: رَضِيعَيْ لِبَانٍ
  text: رضيعين من لبن واحد.
- term: بِأَسْحَمَ دَاجٍ
  text: 'في اللسان: «يُقَالُ: الدَّمُ تُغْمَسُ فِيهِ الْيَدُ عِنْدَ التَّحَالُفِ، وَيُقَالُ: بالرَّحِمِ، وَيُقَالُ: بِسَوَادِ حَلَمَة الثَّدْيِ، وَيُقَالُ: بِزِقِّ الْخَمْرِ، وَيُقَالُ: هُوَ اللَّيْلُ» [@lisan، ج12 ص282].'
- term: عَوْضُ لَا نَتَفَرَّقُ
  text: «أَي لَا نَتَفَرَّقُ أَبدًا» [@lisan، ج7 ص192].
