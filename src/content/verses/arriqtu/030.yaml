first: فَمَا أَنَا عَمَّا تَعْمَلُونَ بِجَاهِلٍ
second: وَلَا بِشَبَاةٍ جَهْلُهُ يَتَدَفَّقُ
vocabulary:
- term: بِشَبَاةٍ
  text: 'بسفيه، كما يفسره المحقق [@diwan-asha، ص257، الحاشية]؛ وفي رواية اللسان: «وَلَا بسَفِيهٍ حِلْمُه يَتدفَّقُ» [@lisan، ج10 ص100].'
- term: يَتَدَفَّقُ
  text: 'يندفع ويسارع: «فُلَانٌ يَتدفَّق فِي الْبَاطِلِ تدفُّقاً إِذَا كَانَ يُسارع إِلَيْهِ» [@lisan، ج10 ص100].'
