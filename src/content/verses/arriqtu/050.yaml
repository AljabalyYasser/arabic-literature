explained: false
first: وَلَا بُدَّ مِنْ جَارٍ يُجِيزُ سَبِيلَهَا
second: كَمَا جَوَّزَ السَّكِّيَّ فِي الْبَابِ فَيْتَقُ
vocabulary:
- term: يُجِيزُ سَبِيلَهَا
  text: يأذن لها بالمرور ويحميها في طريقها.
- term: السَّكِّيَّ ... فَيْتَقُ
  text: 'في اللسان في السكّيّ: «وَقِيلَ: هُوَ الْمِسْمَارُ، وَقِيلَ الدِّينَارُ، وَقِيلَ البَرِيدُ، والفَيْتَقُ النَّجَّارُ، وَقِيلَ الحَدَّاد، وَقِيلَ البوَّاب، وَقِيلَ المَلِكُ» [@lisan، ج10 ص440].'
