explained: false
first: وَأَمَّا إِذَا مَا أَوَّبَ الْمَحْلُ سَرْحَهُمْ
second: وَلَاحَ لَهُمْ مِنَ الْعَشِيَّاتِ سَمْلَقُ
vocabulary:
- term: أَوَّبَ
  text: أرجع.
- term: الْمَحْلُ
  text: «المَحْل الجدبُ وَهُوَ انْقِطَاعُ الْمَطَرِ ويُبْسُ الأَرض مِنَ الكَلإِ» [@lisan، ج11 ص617].
- term: سَرْحَهُمْ
  text: '«السَّرْحُ: المالُ السَّائِمُ» [@lisan، ج2 ص478].'
- term: سَمْلَقُ
  text: '«السَّمْلَق: الأَرض الْمُسْتَوِيَةِ، وَقِيلَ: القَفْر الَّذِي لَا نَبَاتَ فِيهِ» [@lisan، ج10 ص164].'
