explained: false
first: فَيَفْجَعْنَ ذَا الْمَالِ الْكَثِيرِ بِمَالِهِ
second: وَطَوْرًا يُقَنِّينَ الضَّرِيكَ فَيَلْحَقُ
vocabulary:
- term: يُقَنِّينَ
  text: 'يُغنين ويجعلن له مالًا يقتنيه: «وأَقناه اللهُ حَتَّى قَنِيَ قِنًى وَهُوَ أَن يَصيرَ لَهُ قِنيةٌ مِنَ الْمَالِ» [@lisan، ج15 ص137].'
- term: الضَّرِيكَ
  text: '«الضَّرِيكُ: الْفَقِيرُ الْيَابِسُ الْهَالِكُ سُوءَ حالٍ» [@lisan، ج10 ص461].'
