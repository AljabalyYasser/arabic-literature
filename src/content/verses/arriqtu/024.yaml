explained: false
first: وَظَلَّتْ شَعِيبٌ غَرْبَةُ الْمَاءِ عِنْدَنَا
second: وَأَسْحَمُ مَمْلُوءٌ مِنَ الرَّاحِ مُتْأَقُ
vocabulary:
- term: شَعِيبٌ
  text: '«والشَّعِيبُ: المَزادةُ المَشْعُوبةُ» [@lisan، ج1 ص498]، والمزادة: القربة الكبيرة.'
- term: غَرْبَةُ الْمَاءِ
  text: 'تفيض بالماء؛ والغربة عند المحقق: «الفيضة من الخمر ومن الدمع» [@diwan-asha، ص255، الحاشية].'
- term: وَأَسْحَمُ
  text: وأسود، يعني الزِّقّ أو الدَّنّ، و«الأَسود إِنما هُوَ الأَسْحَمُ» [@lisan، ج12 ص282].
- term: مُتْأَقُ
  text: 'مملوء: «والتأَق: الامْتِلاء» [@lisan، ج10 ص32].'
