first: تَرَى الْقَوْمَ فِيهَا شَارِعِينَ وَدُونَهُمْ
second: مِنَ الْقَوْمِ وِلْدَانٌ مِنَ النَّسْلِ دَرْدَقُ
vocabulary:
- term: شَارِعِينَ
  text: 'يتناولون الطعام كما يتناول الوارد الماء: «شَرَعَ الوارِدُ يَشْرَعُ شَرْعاً وشُروعاً: تَنَاوَلَ الماءَ بفِيه» [@lisan، ج8 ص175].'
- term: دَرْدَقُ
  text: '«والدَّرْدَقُ: صِغَارُ الإِبل وَالنَّاسِ» [@lisan، ج10 ص96].'
