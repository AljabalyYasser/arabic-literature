first: وَأَحْمَدْتَ أَنْ أَلْحَقْتَ بِالْأَمْسِ صِرْمَةً
second: لَهَا غُدُرَاتٌ وَاللَّوَاحِقُ تَلْحَقُ
vocabulary:
- term: صِرْمَةً
  text: قطعة من الإبل.
- term: غُدُرَاتٌ
  text: بقايا، يقال «غَدَرٌ أَي بَقِيَّةٌ»؛ و«وَاحِدَةُ الغِدَر غِدْرة وَيُجْمَعُ غِدَراً وغِدَرات» [@lisan، ج5 ص9].
