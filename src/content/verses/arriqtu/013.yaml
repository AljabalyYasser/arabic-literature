explained: false
first: وَلَا الْمَلِكُ النُّعْمَانُ يَوْمَ لَقِيتُهُ
second: بِإِمَّتِهِ يُعْطِي الْقُطُوطَ وَيَأْفِقُ
vocabulary:
- term: بِإِمَّتِهِ
  text: 'بنعمته: «والإِمَّة: النِّعْمة» [@lisan، ج12 ص24].'
- term: الْقُطُوطَ
  text: 'صكوك الجوائز: «والقِطُّ: الصَّكُّ بالجائزةِ»، «وَالْجَمْعُ قُطوطٌ» [@lisan، ج7 ص382].'
- term: وَيَأْفِقُ
  text: 'يفضّل بعضهم على بعض في العطاء: «قَوْلُهُ: يأْفِقُ يُفَضِّلُ» [@lisan، ج7 ص382].'
