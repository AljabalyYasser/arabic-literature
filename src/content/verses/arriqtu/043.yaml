first: بِهِ تُنْفَضُ الْأَحْلَاسُ فِي كُلِّ مَنْزِلٍ
second: وَتُعْقَدُ أَنْسَاعُ الْمَطِيِّ وَتُطْلَقُ
vocabulary:
- term: الْأَحْلَاسُ
  text: جمع حِلْس، وهو كساء يُجعل «تَحْتَ الرَّحْلِ تَقِي بِهِ الْبَعِيرَ» [@lisan، ج3 ص326].
- term: أَنْسَاعُ الْمَطِيِّ
  text: '«النِّسْعُ: سَيْرٌ يُضْفَرُ عَلَى هَيْئَةِ أَعِنَّةِ النِّعالِ تُشَدُّ بِهِ الرِّحالُ» [@lisan، ج8 ص352]، والمطيّ: الإبل تُركب.'
