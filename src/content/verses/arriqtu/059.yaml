explained: false
first: وَعَادَ فَتَى صِدْقٍ عَلَيْهِمْ بِجَفْنَةٍ
second: وَسَوْدَاءَ لَأْيًا بِالْمَزَادَةِ تُمْرَقُ
vocabulary:
- term: وَسَوْدَاءَ
  text: يعني القِدْر، سوّدها الطبخ.
- term: لَأْيًا
  text: 'بعد بطء ومشقة: «اللأْيُ: البُطْءُ» [@lisan، ج4 ص454].'
- term: بِالْمَزَادَةِ
  text: بالقربة الكبيرة.
- term: تُمْرَقُ
  text: 'يُكثَّر مرقها: «وأَمْرَقَها يُمْرقها إمْراقاً: أَكثر مَرَقَها» [@lisan، ج10 ص340]؛ أي لا يُصبّ فيها من الماء إلا قليل لكثرة اللحم.'
