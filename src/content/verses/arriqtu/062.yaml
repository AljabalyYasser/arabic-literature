first: كَذَلِكَ فَافْعَلْ مَا حَيِيتَ إِلَيْهِمُ
second: وَأَقْدِمْ إِذَا مَا أَعْيُنُ النَّاسِ تَبْرَقُ
vocabulary:
- term: إِلَيْهِمُ
  text: يعني إلى قومه، يأمر الممدوح أن يدوم على إحسانه إليهم.
- term: تَبْرَقُ
  text: تتحير من الفزع، يقال «بَرِقَ إِذا رأَى سَنا البَرْقِ فَتَحَيَّرَ» [@lisan، ج4 ص44].
