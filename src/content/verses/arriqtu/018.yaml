first: فَذَاكَ وَمَا أَنْجَى مِنَ الْمَوْتِ رَبَّهُ
second: بِسَابَاطَ حَتَّى مَاتَ وَهْوَ مُحَزْرَقُ
vocabulary:
- term: بِسَابَاطَ حَتَّى مَاتَ وَهْوَ مُحَزْرَقُ
  text: '«وحَزْرَقَ الرجلَ وحرْزَقَه: حبَسه وضيَّق عَلَيْهِ»، وفي اللسان أن المعنى: «حبَس كِسْرى النُّعمانَ بْنَ المُنذِر بساباطِ الْمَدَائِنِ حَتَّى ماتَ وَهُوَ مُضَيَّقٌ عَلَيْهِ» [@lisan، ج10 ص48].'
