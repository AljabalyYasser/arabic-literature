first: لَعَمْرِي لَقَدْ لَاحَتْ عُيُونٌ كَثِيرَةٌ
second: إِلَى ضَوْءِ نَارٍ فِي يَفَاعٍ تُحَرَّقُ
vocabulary:
- term: لَاحَتْ
  text: 'نظرت: «ولُحْتُ إِلى كَذَا أَلُوحُ إِذا نَظَرْتُ إِلى نَارٍ بَعِيدَةٍ» [@lisan، ج2 ص585].'
- term: يَفَاعٍ
  text: '«الْيِفَاعُ: المُشْرِفُ مِنَ الأَرض وَالْجَبَلِ» [@lisan، ج8 ص414].'
- term: تُحَرَّقُ
  text: توقد.
