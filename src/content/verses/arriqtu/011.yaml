first: وَحُورٌ كَأَمْثَالِ الدُّمَى وَمَنَاصِفٌ
second: وَقِدْرٌ وَطَبَّاخٌ وَصَاعٌ وَدَيْسَقُ
vocabulary:
- term: الدُّمَى
  text: الصور والتماثيل، واحدتها دُمْية.
- term: وَمَنَاصِفٌ
  text: خدم.
- term: وَصَاعٌ وَدَيْسَقُ
  text: 'قال ابن برّي: «الصَّاعُ مِشْرَبةٌ، والدَّيْسَقُ خِوان مِنْ فضَّة» [@lisan، ج10 ص97].'
