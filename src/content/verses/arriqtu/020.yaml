explained: false
first: وَرَادِعَةٍ بِالْمِسْكِ صَفْرَاءَ عِنْدَنَا
second: لِجَسِّ النَّدَامَى فِي يَدِ الدِّرْعِ مَفْتَقُ
vocabulary:
- term: وَرَادِعَةٍ بِالْمِسْكِ
  text: 'وجارية متلطخة بالمسك: «والرَّدْعُ: أَن تَرْدَع ثَوْبًا بِطِيب أَو زَعْفَرَانٍ» [@lisan، ج8 ص121].'
- term: يَدِ الدِّرْعِ
  text: 'كُمّ قميصها: «ودِرْعُ المرأَةِ: قميصُها» [@lisan، ج8 ص82].'
- term: مَفْتَقُ
  text: 'شقّ مفتوح، من «الفَتْق: خِلَافَ الرَّتْق» [@lisan، ج10 ص296].'
