first: "وَرَادِعَةٍ بِالْمِسْكِ صَفْرَاءَ عِنْدَنَا"
second: "لِجَسِّ النَّدَامَى فِي يَدِ الدِّرْعِ مَفْتَقُ"
meaning: "ورُبّ جارية مغنّية عندنا في مجلس الشرب، قد لطّخت جسدها بالمسك والزعفران حتى اصفرّ، وفي كُمّ قميصها شقّ يُدخل منه الندامى أيديهم فيلمسون جسدها. ولخّص المحقق البيت: «وعندنا جارية قد طلت جسمها بالمسك والزعفران فبدت بشرتها صفراء، يتحسس الندماء جسمها من فتوق قميصها المشقوق الأكمام» [@diwan-asha، ص254]. والجسّ اللمس باليد: «الجَسُّ: اللَّمْسُ بِالْيَدِ» [@lisan، ج6 ص38]. فالبيت بلغة اليوم: كانت الجارية تُلمس وتُتحسَّس في المجلس، وثوبها مفتوح لذلك عمدًا."
vocabulary:
  - term: "وَرَادِعَةٍ"
    text: "متلطخة بالطيب: «والرَّدْعُ: أَن تَرْدَع ثَوْبًا بِطِيب أَو زَعْفَرَانٍ كَمَا تَردَع الجارِيةُ صَدْرَها ومَقادِيمَ جَيْبها بِالزَّعْفَرَانِ مِلْءَ كفِّها» [@lisan، ج8 ص121]. ويقول المحقق: «ردعه بالشيء لطخه به» [@diwan-asha، ص255]."
  - term: "صَفْرَاءَ"
    text: "مصفرّة الجسد من الزعفران والطيب."
  - term: "لِجَسِّ النَّدَامَى"
    text: "ليلمسها رفاق الشراب بأيديهم: «الجَسُّ: اللَّمْسُ بِالْيَدِ» [@lisan، ج6 ص38]. والندامى جمع ندمان، وهو الرفيق على الشراب."
  - term: "يَدِ الدِّرْعِ"
    text: "كُمّ القميص، و«الدرع القميص» [@diwan-asha، ص255]."
  - term: "مَفْتَقُ"
    text: "موضع فتق، أي شقّ مفتوح في الثوب."
syntax:
  - "«وَرَادِعَةٍ»: الواو واو رُبّ، و«رادعةٍ» مجرور لفظًا بـ«رُبّ» المحذوفة، مرفوع محلًّا على الابتداء. و«بِالْمِسْكِ» متعلق بـ«رادعة»، و«صَفْرَاءَ» نعت لها مجرور بالفتحة لأنه ممنوع من الصرف، و«عِنْدَنَا» ظرف متعلق بمحذوف خبر."
  - "«لِجَسِّ النَّدَامَى فِي يَدِ الدِّرْعِ مَفْتَقُ»: «مفتقُ» مبتدأ مؤخر، و«فِي يَدِ الدِّرْعِ» خبر مقدم، و«لِجَسِّ النَّدَامَى» متعلق بـ«مفتق»، واللام للتعليل. والجملة نعت ثانٍ لـ«رادعة»."
morphology:
  - "«رَادِعَة» اسم فاعل من «رَدَعَ»، و«صَفْرَاء» مؤنث «أَصْفَر» على «فَعْلاء»."
  - "«مَفْتَق» اسم مكان على «مَفْعَل» من «فَتَقَ»: موضع الفتق."
  - "«نَدَامَى» جمع «نَدْمان» على «فَعالى»، و«جَسّ» مصدر «جَسَّ» المضعف."
rhetoric:
  thesis: "في وسط مجلس الشرب (19–24) جارية مغنّية، لا يصف صوتها أولًا بل جسدها: مطيّب مصفرّ، وثوبها مشقوق ليلمسه الشاربون. فالمجلس عنده خمر وغناء وجسد، وهو ما عدّه به ابن سَلّام ممن كان «ينعى على نفسه ويتعهر» [@ibn-sallam، ج1 ص41]."
  devices:
    - title: "الكناية"
      text: "«لِجَسِّ النَّدَامَى فِي يَدِ الدِّرْعِ مَفْتَقُ»: لم يقل إنهم يلمسون جسدها، بل ذكر الشقّ المصنوع لذلك، فدلّ به على الفعل. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الاستعارة في «يَدِ الدِّرْعِ»"
      text: "سمّى كُمّ القميص «يدًا»، لأنه موضع اليد منه، فأعار الثوبَ عضوًا من أعضاء لابسته. وهذه الاستعارة شائعة في كلامهم، ويُذكر فيها الثوب بما يغطيه."
    - title: "الموازنة بطَرَفة"
      text: "المعنى نفسه في معلقة طَرَفة: «رَحِيبٌ قِطَابُ الْجَيْبِ مِنْهَا رَفِيقَةٌ ... بِجَسِّ النَّدَامَى بَضَّةُ الْمُتَجَرَّدِ»، والكلمة نفسها «جَسِّ النَّدَامَى». فطَرَفة جعل الشقّ في الجيب، وهو فتحة الثوب عند الصدر، والأَعْشَى جعله في الكُمّ. وهذه الموازنة قراءتنا."
  connection: "ثم يصف غناءها: «إِذَا قُلْتُ غَنِّ الشَّرْبَ قَامَتْ بِمِزْهَرٍ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ القاف المضمومة"
  scansion: "وَرَادِ / عَتِنْ بِلْمِسْ / كِ صَفْرَا / ءَ عِنْدَنَا = فعولُ / مفاعيلن / فعولن / مفاعلن — لِجَسْسِنْ / نَدَامَى فِي / يَدِدْ دِرْ / عِ مَفْتَقُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من الصدر [@atiq، ص29]. و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضرب مقبوض كذلك «لتصير مفاعيلن مفاعلن» [@atiq، ص30]، وهو ضرب القصيدة كلها. وأُشبعت ضمة القاف في «مفتقُ» فنُطقت «مفتقو»."
context: "من مجلس الشرب في القصيدة (19–24)، بعد قسم المواعظ في الملوك الذين ماتوا. وقد جعله ابن سَلّام من شواهده على أن الأَعْشَى ممن كان «ينعى على نفسه ويتعهر» [@ibn-sallam، ج1 ص41]، وأنشده برواية «بالطيب» [@ibn-sallam، ج1 ص43]. وأنشده صاحب اللسان عن الأزهري في «ردع الزعفران وهو لطخه» بالرواية نفسها [@lisan، ج8 ص121]."
