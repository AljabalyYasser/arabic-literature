first: بِأَشْجَعَ أَخَّاذٍ عَلَى الدَّهْرِ حُكْمَهُ
second: فَمِنْ أَيِّ مَا تَجْنِي الْحَوَادِثُ أَفْرَقُ
vocabulary:
- term: بِأَشْجَعَ أَخَّاذٍ عَلَى الدَّهْرِ حُكْمَهُ
  text: 'يعني نفسه: رجل جريء يغلب الدهر في حكمه. وفي اللسان: «عَنَى بالأَشْجَع نَفْسَه، وَلَا يَصِحُّ أَن يُرَادَ بالأَشجع الدَّهْرُ لِقَوْلِهِ أَخّاذٍ عَلَى الدَّهْرِ حُكْمَهُ» [@lisan، ج8 ص173].'
- term: أَفْرَقُ
  text: أخاف، من الفَرَق وهو الخوف.
