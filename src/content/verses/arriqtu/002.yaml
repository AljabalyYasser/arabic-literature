first: وَلَكِنْ أَرَانِي لَا أَزَالُ بِحَادِثٍ
second: أُغَادَى بِمَا لَمْ يُمْسِ عِنْدِي وَأُطْرَقُ
vocabulary:
- term: أُغَادَى
  text: يأتيني الحادث في الغداة، وهي أول النهار.
- term: وَأُطْرَقُ
  text: ويأتيني ليلًا، من الطُّروق وهو الإتيان بالليل.
