first: "فَنَالَ الَّتِي فَوْقَ أَيْدِيهِمُ"
second: "مِنَ الْمَجْدِ ثُمَّ انْتَمَى مُصْعِدَا"
vocabulary:
- term: "فَنَالَ الَّتِي فَوْقَ أَيْدِيهِمُ"
  text: "في الشرح: «أي نال من المكارم ما لم تنل أيديهم؛ لأنهم أرادوا المكارم فقصّروا عنها، وأدركها هو» [@diwan-khansa، ص146]."
- term: "انْتَمَى مُصْعِدَا"
  text: "في الشرح: «فانتمى مُصعِدًا؛ أي عاليًا للأمور» [@diwan-khansa، ص146]."
sources:
