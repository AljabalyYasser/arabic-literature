explained: false
first: "رَفِيعَ الْعِمَادِ طَوِيلَ النِّجَاـ"
second: "ـدِ سَادَ عَشِيرَتَهُ أَمْرَدَا"
vocabulary:
- term: "رَفِيعَ الْعِمَادِ"
  text: "في الشرح: «أي كان بيته طويل العمد واسعًا» [@diwan-khansa، ص143]."
- term: "طَوِيلَ النِّجَادِ"
  text: "في الشرح: «كانت حمائل سيفه طويلة»، وعن الأَصْمَعِيّ: «أرادت أنّه طويل الجسم، وإذا كان كذلك لم يكن نجاده إلّا طويلًا» [@diwan-khansa، ص143–144]."
- term: "أَمْرَدَا"
  text: "شابًّا لم تنبت لحيته."
sources:
- source: "diwan-khansa"
  loc: "ص143–144"
  url: "https://archive.org/details/3318pdf_202001/page/n142/mode/1up"
status: "review"
