first: "غِيَاثُ الْعَشِيرَةِ إِنْ أَمْحَلُوا"
second: "يُهِينُ التِّلَادَ وَيُحْيِي الْجَدَا"
vocabulary:
- term: "أَمْحَلُوا"
  text: "في الشرح: «أمحلوا: أجدبوا، والمَحْل: الجدب» [@diwan-khansa، ص147]."
- term: "التِّلَادَ"
  text: "في الشرح: «والتالد: القديم، وهو ها هنا: المال الموروث» [@diwan-khansa، ص147]."
- term: "الْجَدَا"
  text: "في الشرح: «والجَدا: العطيّة» [@diwan-khansa، ص147]."
