explained: false
first: كَأَنَّ بِلِيتَيْهَا وَبَلْدَةِ نَحْرِهَا
second: مِنَ النَّبْلِ كُرَّاثَ الصَّرِيمِ الْمُنَزَّعَا
vocabulary:
- term: لِيتَيْهَا
  text: صفحتي عنقها.
- term: بَلْدَةِ نَحْرِهَا
  text: «ثغرة النحر وما حولها» [@lisan، ج3 ص95].
- term: النَّبْلِ
  text: السهام.
- term: كُرَّاثَ الصَّرِيمِ الْمُنَزَّعَا
  text: '«الكراث: نبت. الصريم: قطع من الرمل. المنزع: المنزوع، لأن ساق الكراثة تكون في الرمل فإذا نزعت أشبهت السهم. يصف كثرة ما أصاب فرسه من السهام» [@mufaddaliyyat، ص32، الحاشية].'
