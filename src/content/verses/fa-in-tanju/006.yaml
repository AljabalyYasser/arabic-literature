first: أَمَرْتُكُمُ أَمْرِي بِمُنْعَرَجِ اللِّوَى
second: وَلَا أَمْرَ لِلْمَعْصِيِّ إِلَّا مُضَيَّعَا
vocabulary:
- term: مُنْعَرَجِ اللِّوَى
  text: 'اللِّوَى: منقطع الرمل، «ومنعرجه حيث انثنى منه وانعطف» [@khizana، ج1 ص391].'
- term: لِلْمَعْصِيِّ
  text: لمن يُعصى أمره.
- term: مُضَيَّعَا
  text: ضائعًا مهملًا.
