explained: false
first: فَإِنْ تَنْجُ مِنْهَا يَا حَزِيمَ بْنَ طَارِقٍ
second: فَقَدْ تَرَكَتْ مَا خَلْفَ ظَهْرِكَ بَلْقَعَا
vocabulary:
- term: مِنْهَا
  text: من فرسه؛ «من فرس الكلحبة، وكانت تسمى «العرادة»» [@mufaddaliyyat، ص31، الحاشية].
- term: حَزِيمَ بْنَ طَارِقٍ
  text: حَزِيمة بن طارق التَّغْلِبيّ، رئيس بني تَغْلِب في غارتهم؛ و«حزيم بفتح الحاء المهملة وكسر الزاي المعجمة مرخم حزيمة» [@khizana، ج1 ص388].
- term: بَلْقَعَا
  text: 'قفرًا خاليًا؛ يقول: «إن تنج يا حزيمة من فرسي لم تفلت إلا بنفسك وقد استبيح مالك» [@khizana، ج1 ص389].'
