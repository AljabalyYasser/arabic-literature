explained: false
first: فَأَدْرَكَ إِبْقَاءَ الْعَرَادَةِ ظَلْعُهَا
second: وَقَدْ جَعَلَتْنِي مِنْ حَزِيمَةَ إِصْبَعَا
vocabulary:
- term: إِبْقَاءَ
  text: «ما تبقيه الفرس من العدو» تدّخره إلى وقت الحاجة [@khizana، ج1 ص389].
- term: الْعَرَادَةِ
  text: «اسم فرس الكلحبة كانت أنثى» [@khizana، ج1 ص389].
- term: ظَلْعُهَا
  text: عرجها؛ «الظلوع في الإبل بمنزلة الغمز أي العرج اليسير»، ولا يكون في الخيل إلا استعارة [@khizana، ج1 ص390].
- term: جَعَلَتْنِي مِنْ حَزِيمَةَ إِصْبَعَا
  text: «فاتني حزيمة وما بيني وبينه إلا قدر إصبع» [@khizana، ج1 ص390].
