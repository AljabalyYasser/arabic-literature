first: إِذَا الْمَرْءُ لَمْ يَغْشَ الْكَرِيهَةَ أَوْشَكَتْ
second: حِبَالُ الْهُوَيْنَا بِالْفَتَى أَنْ تَقَطَّعَا
vocabulary:
- term: يَغْشَ
  text: يأتِ ويباشر.
- term: الْكَرِيهَةَ
  text: «الحرب وقيل شدتها وقيل النازلة» [@khizana، ج1 ص387].
- term: أَوْشَكَتْ
  text: قاربت ودنت.
- term: حِبَالُ الْهُوَيْنَا
  text: أسباب الدعة؛ «والحبال جمع حبل بمعنى السبب»، «والهوينى الرفق والراحة» [@khizana، ج1 ص387].
