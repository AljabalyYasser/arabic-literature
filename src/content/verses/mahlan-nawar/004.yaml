first: "لَا تَعْذِلِينِي عَلَى مَالٍ وَصَلْتُ بِهِ"
second: "رِحْمًا وَخَيْرُ سَبِيلِ الْمَالِ مَا وَصَلَا"
vocabulary:
  - term: "رِحْمًا"
    text: "قرابة، يقول محقق «الشعر والشعراء»: «الرحم، بكسر الراء وسكون الحاء، والرحم، بفتح فكسر: القرابة» [@ibn-qutayba، ج1 ص238]."
  - term: "مَا وَصَلَا"
    text: "ما وُصلت به القرابة."
