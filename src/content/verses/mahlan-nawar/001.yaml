first: "مَهْلًا نَوَارُ أَقِلِّي اللَّوْمَ وَالْعَذَلَا"
second: "وَلَا تَقُولِي لِشَيْءٍ فَاتَ: مَا فَعَلَا"
vocabulary:
  - term: "نَوَارُ"
    text: "امرأته النَّوار، ينادِيها."
  - term: "الْعَذَلَا"
    text: "العَذَل: اللوم."
  - term: "مَا فَعَلَا"
    text: "أي: أين ذهب؟ سؤال المتحسّر على ما ضاع."
