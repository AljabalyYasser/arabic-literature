explained: false
first: "وَلَا تَقُولِي لِمَالٍ كُنْتُ مُهْلِكَهُ"
second: "مَهْلًا وَإِنْ كُنْتُ أُعْطِي الْجِنَّ وَالْخَبَلَا"
vocabulary:
  - term: "الْخَبَلَا"
    text: "يقول محقق «الشعر والشعراء»: «الخبل، بفتحتين: الجن، أو ضرب من الجن يقال لهم الخابل» [@ibn-qutayba، ج1 ص238]. وفي «العقد» «الأنس والخبلا» [@iqd، ج1 ص243]."
