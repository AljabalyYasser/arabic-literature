explained: false
first: "وَلَقَدْ رَأَيْتُ النَّارَ لِلسْـ"
second: "ـسُلَّافِ تُوقَدُ فِي طَمِيَّهْ"
vocabulary:
  - term: "السُّلَّافِ"
    text: "جمع سالف، وهم المتقدمون في السير [@ibn-sallam، ج1 ص36، الحاشية]."
  - term: "طَمِيَّهْ"
    text: "رأس جبل منيع كان بمنزل زُهَيْر. ويرى شاكر أنه يذكر يوم خَزازَى، حين أُوقدت النار على جبل ليهتدي بها جيش ربيعة، فيذكر بهذا البيت قِدَم عهده بالحروب [@ibn-sallam، ج1 ص36، الحاشية]. وطَمِيّة عند ياقوت «جبل في طريق مكة مقابلة فايد»، وينشد البيت بلا نسبة، وعجزه عنده: «أَنْفَارِ تُوقَدُ فِي طَمِيَّهْ»، أي بِالْأَنْفَارِ مكان لِلسُّلَّافِ، ويقول: «والأنفار: الذين ينفرون إلى الحرب» [@yaqut-buldan، ج4 ص41]."
