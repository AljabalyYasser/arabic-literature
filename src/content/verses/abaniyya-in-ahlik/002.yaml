first: "وَجَعَلْتُكُمْ أَبْنَاءَ سَا"
second: "دَاتٍ زِنَادُكُمُ وَرِيَّهْ"
vocabulary:
  - term: "زِنَادُكُمُ وَرِيَّهْ"
    text: "الزِّناد جمع زَنْد، وهو العود الذي تُقدح به النار، والزند الوَرِيّ: السريع النار. يريد أنهم إذا طلبوا أمرًا أدركوه بلا إبطاء لشرفهم وعزمهم، كما يشرحه شاكر [@ibn-sallam، ج1 ص36، الحاشية]."
