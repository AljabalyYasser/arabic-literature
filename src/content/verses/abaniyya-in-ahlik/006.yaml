explained: false
first: "وَلَقَدْ رَحَلْتُ الْبَازِلَ الْـ"
second: "ـوَجْنَاءَ لَيْسَ لَهَا وَلِيَّهْ"
vocabulary:
  - term: "الْبَازِلَ"
    text: "من الإبل: ما طلع نابه في سنته التاسعة، أي في تمام قوته [@ibn-sallam، ج1 ص36، الحاشية]."
  - term: "الْوَجْنَاءَ"
    text: "الناقة الغليظة الصلبة [@ibn-sallam، ج1 ص36، الحاشية]."
  - term: "وَلِيَّهْ"
    text: "البرذعة تكون على ظهر الناقة. يصف جلده وصبره على ركوب الناقة بلا برذعة عند الغزو، كما يقول شاكر [@ibn-sallam، ج1 ص36، الحاشية]."
