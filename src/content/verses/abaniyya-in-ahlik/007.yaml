explained: false
first: "وَلَقَدْ غَدَوْتُ بِمُشْرِفِ الطْـ"
second: "ـطَرَفَيْنِ لَمْ يُغْمَزْ شَظِيَّهْ"
vocabulary:
  - term: "بِمُشْرِفِ الطَّرَفَيْنِ"
    text: "بفرس عالي العنق والوركين [@ibn-sallam، ج1 ص37، الحاشية]."
  - term: "لَمْ يُغْمَزْ شَظِيَّهْ"
    text: "لم يعرج من علة في عظم قوائمه؛ والغَمْز: الظَّلْع الخفي في المشي، والشَّظِيّة: عظم صغير في وظيف الفرس، إذا تحرك كان عيبًا [@ibn-sallam، ج1 ص37، الحاشية]."
