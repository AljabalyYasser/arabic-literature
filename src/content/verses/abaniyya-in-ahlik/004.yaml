explained: false
first: "كَمْ مِنْ مُحَيًّى لَا يُوَا"
second: "زِينِي وَلَا يَهَبُ الرَّعِيَّهْ"
vocabulary:
  - term: "مُحَيًّى"
    text: "ملك تُلقى عليه تحية الملوك، كما يقول شاكر [@ibn-sallam، ج1 ص36، الحاشية]."
  - term: "يُوَازِينِي"
    text: "يساميني ويعادلني [@ibn-sallam، ج1 ص36، الحاشية]."
  - term: "الرَّعِيَّهْ"
    text: "ما يتولاه الراعي من نَعَم أو ناس، وأراد هنا الإبل التي تُمنح عطية، فيما يقول شاكر [@ibn-sallam، ج1 ص36، الحاشية]."
