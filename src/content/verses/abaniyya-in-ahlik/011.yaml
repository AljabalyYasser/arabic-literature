first: "مِنْ أَنْ يُرَى الشَّيْخَ الْبَجَا"
second: "لَ وَقَدْ يُهَادَى بِالْعَشِيَّهْ"
vocabulary:
  - term: "الشَّيْخَ الْبَجَالَ"
    text: "الشيخ المعظَّم، والبَجال: السيد له هيئة وسن وتبجيل. ويقول شاكر إن الألف واللام زائدتان في «الشيخ»، والمعنى: شيخًا بجالًا [@ibn-sallam، ج1 ص37، الحاشية]."
  - term: "يُهَادَى"
    text: "يمشي بين رجلين معتمدًا عليهما من ضعفه وتمايله [@ibn-sallam، ج1 ص37، الحاشية]."
