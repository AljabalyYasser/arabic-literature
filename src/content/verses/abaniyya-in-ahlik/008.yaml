explained: false
first: "فَأَصَبْتُ مِنْ حُمُرِ الْقَنَا"
second: "نِ مَعًا وَمِنْ حُمُرِ الْقَفِيَّهْ"
vocabulary:
  - term: "حُمُرِ الْقَنَانِ"
    text: "حمير الوحش التي ترعى بالقَنان، وهو جبل لبني أسد [@ibn-sallam، ج1 ص37، الحاشية]."
  - term: "الْقَفِيَّهْ"
    text: "يقول شاكر إنه لم يجد «قفية» اسمًا لموضع، وكأنه مكان تهوي إليه حمر الوحش، والقفية: الناحية [@ibn-sallam، ج1 ص37، الحاشية]."
