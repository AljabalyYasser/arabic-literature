first: "إِلَى الْمُنْذِرِ الْخَيْرِ ابْنِ هِنْدٍ تَزُورُهُ"
second: "وَلَيْسَ مِنَ الْفَوْتِ الَّذِي هُوَ سَابِقُهْ"
vocabulary:
  - term: "الْمُنْذِرِ الْخَيْرِ ابْنِ هِنْدٍ"
    text: "المُنْذِر بن المُنْذِر، أخو عَمْرو بن هِنْد، وهو أحد الملكين اللذين يُروى أن الشاعر خاطبهما بالقصيدة [@khizana، ج7 ص438]. وجعله «الخير» لكثرة خيره."
  - term: "وَلَيْسَ مِنَ الْفَوْتِ الَّذِي هُوَ سَابِقُهْ"
    text: "تسرع ناقته إليه، ولا تسرع خوفًا أن يفوتها عطاؤه، فعطاؤه لا يفوت أحدًا. وهذا شرح محقق طبعة التبريزي [@tabrizi-hamasa، ج2 ص348]."
