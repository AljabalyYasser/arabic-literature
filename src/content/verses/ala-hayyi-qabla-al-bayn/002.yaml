first: "وَمَنْ لَا تُوَاتِي دَارُهُ غَيْرَ فَيْنَةٍ"
second: "وَمَنْ أَنْتَ تَبْكِي كُلَّ يَوْمٍ يُفَارِقُهْ"
vocabulary:
