explained: false
first: "لَئِنْ لَمْ تُغَيِّرْ بَعْدَ مَا قَدْ صَنَعْتُمُ"
second: "لَأَنْتَحِيَنْ لِلْعَظْمِ ذُو أَنَا عَارِقُهْ"
vocabulary:
  - term: "لَأَنْتَحِيَنْ"
    text: "لأقصدنّ، و«الانتحاء للشيء: التعرض له والاعتماد والميل» [@khizana، ج7 ص439]."
  - term: "ذُو أَنَا عَارِقُهْ"
    text: "ذو بمعنى الذي، «وهو في لغة طيىء بمعنى الذي»، والعارق من عرق العظم: «أكلت ما عليه من اللحم» [@khizana، ج7 ص440]. يقول: إن لم تغيّر ما صنعت لأقصدنّ العظم نفسه بعد أن نزعت عنه اللحم، أي سأنتقل من الشكوى إلى الكسر. و«بهذا البيت سمي عارقاً» [@khizana، ج7 ص438]."
