explained: false
first: "حَلَفْتُ بِهَدْيٍ مُشْعَرٍ بَكَرَاتُهُ"
second: "تَخُبُّ بِصَحْرَاءِ الْغَبِيطِ دَرَادِقُهْ"
vocabulary:
  - term: "بِهَدْيٍ"
    text: "الهَدْي: «ما يهدى إلى الحرم من النعم» [@khizana، ج7 ص438]."
  - term: "مُشْعَرٍ"
    text: "من الإشعار، «وهو أن يطعن في السنام فيسيل الدم عليه فيستدل بذلك على كونه هديا» [@khizana، ج7 ص439]."
  - term: "بَكَرَاتُهُ"
    text: "جمع بَكْرة، «وهي الشابة من الإبل» [@khizana، ج7 ص439]."
  - term: "الْغَبِيطِ"
    text: "موضع «قريب من فلج في طريق البصرة إلى مكة» [@khizana، ج7 ص439]."
  - term: "دَرَادِقُهْ"
    text: "«صغار الإبل» [@khizana، ج7 ص439]."
