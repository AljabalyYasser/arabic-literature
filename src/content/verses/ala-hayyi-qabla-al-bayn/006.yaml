explained: false
first: "وَلَوْ نِيلَ فِي عَهْدٍ لَنَا لَحْمُ أَرْنَبٍ"
second: "وَفَيْنَا وَهَذَا الْعَهْدُ أَنْتَ مُعَالِقُهْ"
vocabulary:
  - term: "لَحْمُ أَرْنَبٍ"
    text: "أهون شيء، يريد: لو أُخذ في جوارنا شيء حقير لوفينا لصاحبه."
  - term: "مُعَالِقُهْ"
    text: "المتعلّق به، أي العهد في ذمتك حتى تفي به، كما يشرحه محقق طبعة التبريزي [@tabrizi-hamasa، ج2 ص349]."
