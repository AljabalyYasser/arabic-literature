explained: false
first: "فَإِنَّ نِسَاءً غَيْرَ مَا قَالَ قَائِلٌ"
second: "غَنِيمَةُ سَوْءٍ وَسْطَهُنَّ مَهَارِقُهْ"
vocabulary:
  - term: "غَيْرَ مَا قَالَ قَائِلٌ"
    text: "على غير ما زعم من أغرى الملك بهن."
  - term: "مَهَارِقُهْ"
    text: "جمع مُهْرَق، وهو «الصحيفة البيضاء يكتب فيها، فارسي معرب» [@lisan، ج10 ص368]. يقول: النساء اللواتي سباهن جيش الملك غنيمة سوء، لأن صحائف عهده لقومهن معهن."
