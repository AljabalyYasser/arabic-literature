explained: false
first: "تَخُبُّ بِصَحْرَاءِ الثُّوَيَّةِ نَاقَتِي"
second: "كَعَدْوِ رَبَاعٍ قَدْ أَمَخَّتْ نَوَاهِقُهْ"
vocabulary:
  - term: "تَخُبُّ"
    text: "تسير الخَبَب، وهو ضرب من العَدْو السريع."
  - term: "الثُّوَيَّةِ"
    text: "موضع، كما يقول محقق طبعة التبريزي [@tabrizi-hamasa، ج2 ص348]."
  - term: "رَبَاعٍ"
    text: "حمار وحش في سنّ الرَّباعية، أي فتيّ قوي."
  - term: "أَمَخَّتْ نَوَاهِقُهْ"
    text: "صار في عظامه مخّ من السِّمَن، والناهقان: «عظمان شاخصان يندران من ذي الحافر في مجرى الدمع»، ويقال لهما النواهق [@lisan، ج10 ص361]."
