explained: false
first: "فَأَقْسَمْتُ لَا أَحْتَلُّ إِلَّا بِصَهْوَةٍ"
second: "حَرَامٍ عَلَيْكَ رَمْلُهُ وَشَقَائِقُهْ"
vocabulary:
  - term: "أَحْتَلُّ"
    text: "أنزل."
  - term: "بِصَهْوَةٍ"
    text: "«صَهْوَةُ كل شيء: أعلاه» [@lisan، ج14 ص471]، أي لا أنزل إلا بموضع عالٍ لا تبلغه، ويستشهد صاحب اللسان بهذا البيت."
  - term: "شَقَائِقُهْ"
    text: "جمع شقيقة، وهي الرملة بين أرضين."
