explained: false
first: "وَكُنَّا أُنَاسًا دَائِنِينَ بِغِبْطَةٍ"
second: "تَسِيلُ بِنَا تَلْعُ الْمَلَا وَأَبَارِقُهْ"
vocabulary:
  - term: "دَائِنِينَ بِغِبْطَةٍ"
    text: "مطيعين للملك راضين بما نحن فيه من الذمة والنعمة، كما يشرحه محقق طبعة التبريزي [@tabrizi-hamasa، ج2 ص349]."
  - term: "تَلْعُ الْمَلَا"
    text: "التَّلْع جمع تَلْعة، وهي مسيل الماء، و«ما انهبط من الأرض، وقيل: ما ارتفع، وهو من الأضداد» [@lisan، ج8 ص36]، ويستشهد صاحب اللسان بهذا البيت. والمَلا: الصحراء."
  - term: "أَبَارِقُهْ"
    text: "جمع أبرق، وهو الموضع فيه حجارة سود وبيض."
