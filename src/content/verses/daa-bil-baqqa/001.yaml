first: "دَعَا بِالْبَقَّةِ الْأُمَرَاءَ يَوْمًا"
second: "جَذِيمَةُ عَصْرَ يَنْجُوهُمْ ثُبِينَا"
vocabulary:
  - term: "الْبَقَّةِ"
    text: "موضع قرب الحِيرة «كَانَ بِهِ جَذِيمة الأَبرش» [@lisan، ج10 ص24]."
  - term: "يَنْجُوهُمْ"
    text: "يُسارّهم ويستشيرهم."
  - term: "ثُبِينَا"
    text: "جماعات، جمع ثُبَة."
