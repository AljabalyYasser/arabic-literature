explained: false
first: "وَقَدَّمَتِ الْأَدِيمَ لِرَاهِشَيْهِ"
second: "وَأَلْفَى قَوْلَهَا كَذِبًا وَمَيْنَا"
vocabulary:
  - term: "الْأَدِيمَ"
    text: "النِّطْع من الجلد، يُبسط تحت من يُقتل."
  - term: "رَاهِشَيْهِ"
    text: "عرقين في باطن الذراعين، قطعتهما فنزف حتى مات."
  - term: "مَيْنَا"
    text: "كذبًا."
sources:
