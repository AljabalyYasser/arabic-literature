first: "وَدَسَّتْ فِي صَحِيفَتِهَا إِلَيْهِ"
second: "لِيَمْلِكَ بُضْعَهَا وَلِأَنْ تَدِينَا"
vocabulary:
  - term: "دَسَّتْ"
    text: "أخفت حيلتها في كتابها."
