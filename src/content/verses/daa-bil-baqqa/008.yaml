explained: false
first: "أَطَفَّ لِأَنْفِهِ الْمُوسَى قَصِيرٌ"
second: "لِيَجْدَعَهُ وَكَانَ بِهِ ضَنِينَا"
vocabulary:
  - term: "أَطَفَّ"
    text: "قرّب. وفي اللسان: «أَطَفَّ لأَنْفِه المُوسَى قَصِيرٌ، ... وَكَانَ بأَنْفِه حَجِئاً ضَنِينا» [@lisan، ج14 ص166]."
  - term: "يَجْدَعَهُ"
    text: "يقطعه."
  - term: "ضَنِينَا"
    text: "بخيلًا به حريصًا عليه."
