first: "وَمِنْ حَذَرِ الْمَلَاوِمِ وَالْمَخَازِي"
second: "وَهُنَّ الْمُنْدِيَاتُ لِمَنْ مَنِينَا"
vocabulary:
  - term: "الْمَلَاوِمِ"
    text: "ما يُلام عليه."
  - term: "الْمُنْدِيَاتُ"
    text: "المخزيات التي يعرق لها الجبين."
  - term: "مَنِينَا"
    text: "أصبنه وابتُلي بهن."
