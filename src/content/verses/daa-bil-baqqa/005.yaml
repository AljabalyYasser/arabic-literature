explained: false
first: "وَخَبَّرَتِ الْعَصَا الْأَنْبَاءَ عَنْهُ"
second: "وَلَمْ أَرَ مِثْلَ فَارِسِهَا هَجِينَا"
vocabulary:
  - term: "الْعَصَا"
    text: "فرس جذيمة، ركبها قصير ونجا، فعلم الناس بما جرى."
  - term: "هَجِينَا"
    text: "الهجين: من أبوه عربي وأمه غير عربية، يعني قصيرًا."
sources:
