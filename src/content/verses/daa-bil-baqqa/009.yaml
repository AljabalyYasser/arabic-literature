    text: "أماله وأنزله."
  - term: "مَارِنِهِ"
    text: "«والمارِن: الأَنف، وَقِيلَ: طَرفه» [@lisan، ج13 ص404]."
  - term: "طِلَابَ الْوِتْرِ"
    text: "طلبًا للثأر."
  - term: "مَشِينَا"
    text: "مُشوَّهًا."
