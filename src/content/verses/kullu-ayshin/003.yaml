explained: false
first: "اجْعَلِ الْمَوْتَ نُصْبَ عَيْنَيْكَ وَاحْذَرْ"
second: "غَوْلَةَ الدَّهْرِ إِنَّ لِلدَّهْرِ غُولَا"
vocabulary:
  - term: "نُصْبَ عَيْنَيْكَ"
    text: "أمامهما لا يغيب عنهما."
  - term: "غَوْلَةَ الدَّهْرِ"
    text: "إهلاكه على غرّة، و«الغَوْل أَيضاً مِنَ الشَّيْءِ يَغُولك: يَذْهَبُ بِكَ» [@lisan، ج11 ص510]."
  - term: "غُولَا"
    text: "مهالك تغتال الناس، و«الغُول: الْمَنِيَّةُ» [@lisan، ج11 ص507]."
