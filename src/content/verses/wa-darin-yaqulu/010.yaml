explained: false
first: "ضَرُوحَ الْحَمَاتَيْنِ سَامِي التَّلِيلِ"
second: "وَثُوبًا إِذَا مَا انْتَحَاهُ الْخَبَارَا"
vocabulary:
  - term: "ضَرُوحَ"
    text: "يقول محققا «الأصمعيات»: «الفرس النفوح برجله» [@asmaiyyat، ص191، الحاشية]."
  - term: "الْحَمَاتَيْنِ"
    text: "يقول محققا «الأصمعيات»: «اللحمتان اللتان فى عرض الساق تريان كالعصبتين من ظاهر ومن باطن» [@asmaiyyat، ص191، الحاشية]."
  - term: "سَامِي التَّلِيلِ"
    text: "يقول محققا «الأصمعيات»: «مرتفع العنق» [@asmaiyyat، ص191، الحاشية]."
  - term: "انْتَحَاهُ الْخَبَارَا"
    text: "يقول محققا «الأصمعيات»: «انتحاه: قصده. الخبار: ما لان من الأرض واسترخى. يريد أنه يثب فى الخبار إذا ما قصده» [@asmaiyyat، ص191، الحاشية]."
