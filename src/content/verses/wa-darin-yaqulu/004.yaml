explained: false
first: "وَرَاحَ عَلَيْنَا رِعَاءٌ لَنَا"
second: "فَقَالُوا رَأَيْنَا بِهَجْلٍ صُوَارَا"
vocabulary:
  - term: "رِعَاءٌ"
    text: "رُعاة، جمع راعٍ."
  - term: "بِهَجْلٍ"
    text: "يقول محققا «الأصمعيات»: «الغائط يكون بين الجبال مطمئنا موطئه صلب» [@asmaiyyat، ص190، الحاشية]."
  - term: "صُوَارَا"
    text: "يقول محققا «الأصمعيات»: «القطيع من البقر» [@asmaiyyat، ص190، الحاشية]. أي بقر الوحش."
