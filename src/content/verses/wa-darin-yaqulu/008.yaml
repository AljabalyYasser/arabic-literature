explained: false
first: "غَدَوْنَا بِهِ كَسِوَارِ الْهَلُوـ"
second: "ـكِ مُضْطَمِرًا حَالِبَاهُ اضْطِمَارَا"
vocabulary:
  - term: "كَسِوَارِ الْهَلُوكِ"
    text: "الهَلُوك عند محققي «الأصمعيات»: «المرأة الفاجرة المتساقطة على الرجال»، وينقلان عن الشنقيطية: «سوار الهلوك يكون منعطفا» [@asmaiyyat، ص190، الحاشية]. يشبّه الفرس الضامر في انعطافه بسوار امرأة كذلك."
  - term: "مُضْطَمِرًا حَالِبَاهُ"
    text: "يقول محققا «الأصمعيات»: «مضطمرا: ضامرا. الحالبان: عرقان أخضران يكتنفان السرة إلى البطن» [@asmaiyyat، ص191، الحاشية]."
