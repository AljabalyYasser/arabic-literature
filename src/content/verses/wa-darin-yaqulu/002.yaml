first: "فَلَمَّا وَضَعْنَا بِهَا بَيْتَنَا"
second: "نَتَجْنَا حُوَارًا وَصِدْنَا حِمَارَا"
vocabulary:
  - term: "نَتَجْنَا"
    text: "يقول محققا «الأصمعيات»: «ولدنا وولينا نتاج الناقة» [@asmaiyyat، ص190، الحاشية]."
  - term: "حُوَارًا"
    text: "يقول محققا «الأصمعيات»: «ولد الناقة من حين يوضع إلى أن يفطم ويفصل» [@asmaiyyat، ص190، الحاشية]."
  - term: "حِمَارَا"
    text: "حمار الوحش."
