first: "وَبِتْنَا نُغَرِّثُهُ بِاللِّجَامِ"
second: "نُرِيدُ بِهِ قَنَصًا أَوْ غِوَارَا"
vocabulary:
  - term: "نُغَرِّثُهُ"
    text: "ينقل محققا «الأصمعيات» عن هامش الشنقيطية: «نجوعه» [@asmaiyyat، ص190، الحاشية]، أي نمنعه العلف ليضمر ويخفّ."
  - term: "قَنَصًا"
    text: "صيدًا."
  - term: "غِوَارَا"
    text: "يقول محققا «الأصمعيات»: «الغارة» [@asmaiyyat، ص190، الحاشية]."
