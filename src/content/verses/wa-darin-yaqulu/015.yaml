first: "أَكُلَّ امْرِئٍ تَحْسَبِينَ امْرَأً"
second: "وَنَارٍ تَوَقَّدُ بِاللَّيْلِ نَارَا"
vocabulary:
  - term: "أَكُلَّ امْرِئٍ تَحْسَبِينَ امْرَأً"
    text: "أتظنين كل إنسان رجلًا كاملًا؟"
  - term: "وَنَارٍ تَوَقَّدُ بِاللَّيْلِ نَارَا"
    text: "وكلَّ نار توقد في الليل نارَ قِرى للضيفان؟ أي ليس كل من أوقد نارًا كريمًا. وينقل محققا «الأصمعيات» عن العَيْني في جرّ «نارٍ»: «لأن أصله وكل نار، فلما حذف كل أبقى نار على أصله بالجر» [@asmaiyyat، ص191، الحاشية]."
