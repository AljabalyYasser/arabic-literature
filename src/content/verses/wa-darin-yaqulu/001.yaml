explained: false
first: "وَدَارٍ يَقُولُ لَهَا الرَّائِدُوـ"
second: "ـنَ وَيْلُ امِّ دَارِ الْحُذَاقِيِّ دَارَا"
vocabulary:
  - term: "الرَّائِدُونَ"
    text: "الذين يُرسَلون أمام القوم يطلبون الكلأ والماء."
  - term: "وَيْلُ امِّ دَارِ ..."
    text: "كلمة تعجّب ومدح، أصلها «ويلُ أمِّ»، أي ما أعجبها دارًا!"
  - term: "الْحُذَاقِيِّ"
    text: "يقول محققا «الأصمعيات»: «يعنى نفسه، نسبة إلى قبيلته حذاقة، بضم الحاء وتخفيف الذال بعدها قاف» [@asmaiyyat، ص190، الحاشية]."
