explained: false
first: "مَرُوحًا يُجَاذِبُنَا فِي الْقِيَادِ"
second: "تَخَالُ مِنَ الْقَوْدِ فِيهِ اقْوِرَارَا"
vocabulary:
  - term: "مَرُوحًا"
    text: "يقول محققا «الأصمعيات»: «وصف من المرح، وهو النشاط والخفة» [@asmaiyyat، ص191، الحاشية]."
  - term: "الْقِيَادِ"
    text: "يقول محققا «الأصمعيات»: «الحبل الذى يقاد به» [@asmaiyyat، ص191، الحاشية]."
  - term: "الْقَوْدِ"
    text: "يقول محققا «الأصمعيات»: «نقيض السوق، يقود الدابة من أمامها ويسوقها من خلفها» [@asmaiyyat، ص191، الحاشية]."
  - term: "اقْوِرَارَا"
    text: "يقول محققا «الأصمعيات»: «تشنج الجلد وانحناء الصلب هزالا وكبرا» [@asmaiyyat، ص191، الحاشية]."
