first: "وَعَادَى ثَلَاثًا فَخَرَّ السِّنَاـ"
second: "ـنُ إِمَّا نُصُولًا وَإِمَّا انْكِسَارَا"
vocabulary:
  - term: "عَادَى ثَلَاثًا"
    text: "يقول محققا «الأصمعيات»: «والى بينها قتلا ورميا، يصرع أحدها على أثر الآخر فى طلق واحد» [@asmaiyyat، ص191، الحاشية]."
  - term: "نُصُولًا"
    text: "يقول محققا «الأصمعيات»: «خروج النصل من الرمح» [@asmaiyyat، ص191، الحاشية]."
