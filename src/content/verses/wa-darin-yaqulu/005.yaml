first: "فَبِتْنَا عُرَاةً لَدَى مُهْرِنَا"
second: "نُنَزِّعُ مِنْ شَفَتَيْهِ الصُّفَارَا"
vocabulary:
  - term: "عُرَاةً"
    text: "ينقل محققا «الأصمعيات» عن الشنقيطية، وهي نسخة الشِّنْقِيطيّ من الكتاب: «جلوس»، ويقولان: «ولم نجد هذا المعنى فى المعاجم» [@asmaiyyat، ص190، الحاشية]."
  - term: "نُنَزِّعُ"
    text: "ننتزع."
  - term: "الصُّفَارَا"
    text: "ينقل محققا «الأصمعيات» عن الشنقيطية: «نبت له شوك» [@asmaiyyat، ص190، الحاشية]."
