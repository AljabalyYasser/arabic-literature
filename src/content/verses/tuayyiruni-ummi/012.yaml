first: "فَلَمَّا اسْتَقَادَ الكَفَّ بِالكَفِّ لَمْ يَجِدْ"
second: "لَهُ دَرَكًا فِي أَنْ تَبِينَا فَأَحْجَمَا"
vocabulary:
  - term: "اسْتَقَادَ"
    text: "طلب القَوَد، أي القصاص."
  - term: "دَرَكًا"
    text: "إدراكًا لثأر أو نفعًا."
  - term: "تَبِينَا"
    text: "تنفصل، أي تُقطع."
  - term: "فَأَحْجَمَا"
    text: "كفّ وتأخر."
