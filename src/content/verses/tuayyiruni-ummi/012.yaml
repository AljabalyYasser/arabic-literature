explained: false
first: "فَلَمَّا اسْتَقَادَ الكَفَّ بِالكَفِّ لَمْ يَجِدْ"
second: "لَهُ دَرَكًا فِي أَنْ تَبِينَا فَأَحْجَمَا"
vocabulary:
  - term: "اسْتَقَادَ"
    text: "طلب القَوَد، أي القصاص؛ «القود: القصاص»، و«إذا أتى إنسان إلى آخر أمرا فانتقم منه بمثلها قيل: استقادها منه» [@lisan، ج3 ص372]."
  - term: "دَرَكًا"
    text: "إدراكًا لثأر أو نفعًا؛ و«الدرك إدراك الحاجة ومطلبه» [@lisan، ج10 ص419]."
  - term: "تَبِينَا"
    text: "تنفصل، أي تُقطع؛ «وتباين الرجلان: بان كل واحد منهما عن صاحبه» [@lisan، ج13 ص64]."
  - term: "فَأَحْجَمَا"
    text: "كفّ وتأخر؛ «أحجم عن الأمر: كف أو نكص هيبة» [@lisan، ج12 ص116]."
