explained: false
first: "أَرَى عُصُمًا فِي نَصْرِ بُهْثَةَ دَائِبًا"
second: "وَتَعْذُلُنِي فِي نَصْرِ زَيْدٍ فَبِئْسَ مَا"
vocabulary:
  - term: "عُصُمًا"
    text: "رجل من بني ضُبَيْعة، ينقل محققا الأصمعيات عن شرح مختارات ابن الشجري أنه «قال للمتلمس أنت من بني يشكر ولست منا» [@asmaiyyat، ص246، الحاشية]."
  - term: "دَائِبًا"
    text: "مجتهدًا لا يفتر."
  - term: "فَبِئْسَ مَا"
    text: "فبئس ما يفعل."
sources:
