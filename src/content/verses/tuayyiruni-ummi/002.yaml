first: "وَمَنْ يَكُ ذَا عِرْضٍ كَرِيمٍ فَلَمْ يَصُنْ"
second: "لَهُ حَسَبًا كَانَ اللَّئِيمَ المُذَمَّمَا"
vocabulary:
  - term: "عِرْضٍ"
    text: "العِرض: موضع المدح والذم من الإنسان."
  - term: "حَسَبًا"
    text: "شرف الآباء وما يُعدّ من مآثرهم."
  - term: "المُذَمَّمَا"
    text: "الكثير الذم."
