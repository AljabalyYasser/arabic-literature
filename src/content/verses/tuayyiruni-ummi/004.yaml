first: "أَحَارِثُ إِنَّا لَوْ تُسَاطُ دِمَاؤُنَا"
second: "تَزَايَلْنَ حَتَّى لَا يَمَسَّ دَمٌ دَمَا"
vocabulary:
  - term: "أَحَارِثُ"
    text: "يا حارث، يخاطب خاله الحارث بن التوءم."
