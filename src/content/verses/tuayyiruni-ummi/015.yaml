first: "إِذَا لَمْ يَزَلْ حَبْلُ القَرِينَيْنِ يَلْتَوِي"
second: "فَلَا بُدَّ يَوْمًا لِلْقُوَى أَنْ تُجَذَّمَا"
vocabulary:
