explained: false
first: "فَأَطْرَقَ إِطْرَاقَ الشُّجَاعِ وَلَوْ يَرَى"
second: "مَسَاغًا لِنَابَيْهِ الشُّجَاعُ لَصَمَّمَا"
vocabulary:
  - term: "أَطْرَقَ"
    text: "سكت وأرخى عينيه إلى الأرض؛ «وأطرق الرجل إذا سكت فلم يتكلم، وأطرق أيضا أي أرخى عينيه ينظر إلى الأرض» [@lisan، ج10 ص219]."
  - term: "الشُّجَاعِ"
    text: "الحية الذكر؛ «والشجاع والشجاع، بالضم والكسر: الحية الذكر» [@lisan، ج8 ص174]."
  - term: "مَسَاغًا"
    text: "مدخلًا؛ «سغ في الأرض ما وجدت مساغا أي ادخل فيها ما وجدت مدخلا» [@lisan، ج8 ص436]."
  - term: "لَصَمَّمَا"
    text: "لعضّ ولم يرسل ما عضّ؛ «وصمم أي عض ونيب فلم يرسل ما عض»، وبهذا البيت يستشهد ابن منظور [@lisan، ج12 ص347]."
