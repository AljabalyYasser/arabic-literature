first: "فَأَطْرَقَ إِطْرَاقَ الشُّجَاعِ وَلَوْ يَرَى"
second: "مَسَاغًا لِنَابَيْهِ الشُّجَاعُ لَصَمَّمَا"
vocabulary:
  - term: "أَطْرَقَ"
    text: "سكت وأرخى عينيه إلى الأرض."
  - term: "الشُّجَاعِ"
    text: "الحية الذكر."
  - term: "مَسَاغًا"
    text: "مدخلًا."
  - term: "لَصَمَّمَا"
    text: "لعضّ ولم يرسل ما عضّ."
