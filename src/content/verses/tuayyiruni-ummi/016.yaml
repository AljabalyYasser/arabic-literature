first: "وَقَدْ كُنْتُ أَرْجُو أَنْ أَكُونَ لِخَلْفِكُمْ"
second: "زَعِيمًا فَمَا أُحْرِزْتُ أَنْ أَتَكَلَّمَا"
vocabulary:
  - term: "لِخَلْفِكُمْ"
    text: "لعقبكم ومن يأتي بعدكم."
  - term: "زَعِيمًا"
    text: "سيدًا يتكلم عنهم."
  - term: "فَمَا أُحْرِزْتُ أَنْ أَتَكَلَّمَا"
    text: "لم أُمكَّن من الكلام فيكم."
