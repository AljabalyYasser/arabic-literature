first: "أَلَا إِنَّنِي مِنْهُمْ وَعِرْضِيَ عِرْضُهُمْ"
second: "كَذِي الأَنْفِ يَحْمِي أَنْفَهُ أَنْ يُصَلَّمَا"
vocabulary:
