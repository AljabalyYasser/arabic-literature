first: "لِذِي الحِلْمِ قَبْلَ اليَوْمِ مَا تُقْرَعُ العَصَا"
second: "وَمَا عُلِّمَ الإِنْسَانُ إِلَّا لِيَعْلَمَا"
vocabulary:
  - term: "لِذِي الحِلْمِ ... مَا تُقْرَعُ العَصَا"
    text: "ذو الحلم حكيم من العرب أسنّ، فكانت تُقرع له العصا إذا سها فيتنبه. يقول: العاقل يكفيه التنبيه."
sources:
