first: "فَلَوْ غَيْرُ أَخْوَالِي أَرَادُوا نَقِيصَتِي"
second: "جَعَلْتُ لَهُمْ فَوْقَ العَرَانِينِ مِيسَمَا"
vocabulary:
  - term: "نَقِيصَتِي"
    text: "عيبي والنيل مني."
  - term: "العَرَانِينِ"
    text: "أوائل الأنوف، واحدها عِرنين."
  - term: "مِيسَمَا"
    text: "أثر الكيّ، أي أسمهم بالهجاء سمة لا تزول."
