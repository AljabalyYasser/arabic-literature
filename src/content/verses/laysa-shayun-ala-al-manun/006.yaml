explained: false
first: "فَاذْهَبِي يَا أُمَيْمَ غَيْرَ بَعِيدٍ"
second: "لَا يُؤَاتِي الْعِنَاقُ مَنْ فِي الْوَثَاقِ"
vocabulary:
  - term: "أُمَيْمَ"
    text: "منادى مرخّم من «أُمَيْمَة»، امرأة يخاطبها."
  - term: "لَا يُؤَاتِي"
    text: "لا يتهيّأ."
  - term: "الْوَثَاقِ"
    text: "القيد. ويقول المحققون إن البيت «سيأتى» في قصيدة منسوبة للمهلهل بن ربيعة [@aghani-dk، ج2 ص116، الحاشية]."
