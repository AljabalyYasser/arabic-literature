    text: "بأن يُسلَّم إلى من يريد قتله، ويقول المحققون إنه «اسم من إغلاق القاتل وهو إسلامه الى ولى المقتول فيحكم فى دمه ما شاء» [@aghani-dk، ج2 ص117، الحاشية]."
