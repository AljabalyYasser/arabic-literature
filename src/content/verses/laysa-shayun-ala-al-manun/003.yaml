explained: false
first: "فَبَرِيءٌ صَدْرِي مِنَ الظُّلْمِ لِلرَّبْ"
second: "بِ وَحِنْثٍ بِمُعْقَدِ الْمِيثَاقِ"
vocabulary:
  - term: "لِلرَّبِّ"
    text: "يريد الملك النعمان."
  - term: "حِنْثٍ"
    text: "نقض اليمين."
  - term: "بِمُعْقَدِ الْمِيثَاقِ"
    text: "بالعهد المؤكَّد، ويقول المحققون إنهم لم يجدوا «أعقد الميثاق» في كتب اللغة، «ولعله «بمعقد الميثاق» على أنه مصدر ميمى يراد به عقده» [@aghani-dk، ج2 ص116، الحاشية]."
sources:
  - source: "aghani-dk"
    loc: "ج2 ص116"
    url: "https://archive.org/details/aghani2014/2/page/n125/mode/1up"
