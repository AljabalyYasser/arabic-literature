explained: false
first: "تَمَنَّى ابْنَتَايَ أَنْ يَعِيشَ أَبُوهُمَا"
second: "وَهَلْ أَنَا إِلَّا مِنْ رَبِيعَةَ أَوْ مُضَرْ"
vocabulary:
  - term: "تَمَنَّى"
    text: "تتمنّى؛ قال البَغْداديّ: «هو مضارع وأصله تتمنى بتاءين» [@khizana، ج4 ص340]."
  - term: "وَهَلْ أَنَا إِلَّا مِنْ رَبِيعَةَ أَوْ مُضَرْ"
    text: "«أي: جميع آبائي من ربيعة أو مضر قد ماتوا» [@khizana، ج4 ص340]، فلا بد أن أموت كما ماتوا."
