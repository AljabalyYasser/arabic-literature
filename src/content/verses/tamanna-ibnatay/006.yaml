first: "وَقُولَا هُوَ الْمَرْءُ الَّذِي لَا خَلِيلَهُ"
second: "أَضَاعَ وَلَا خَانَ الصَّدِيقَ وَلَا غَدَرْ"
vocabulary:
  - term: "لَا خَلِيلَهُ أَضَاعَ"
    text: "لم يُضِعْ خليله. و«خليله» مفعول مقدَّم، وفي رواية البَغْداديّ «لا صديقه»، قال: «لا صديقه مفعول مقدم لقوله أضاع» [@khizana، ج4 ص341]."
