explained: false
first: "كَأَنَّ هِجَانَهَا مُتَأَبِّضَاتٍ"
second: "وَفِي الْأَقْرَانِ أَصْوِرَةُ الرُّعَامِ"
vocabulary:
  - term: "هِجَانَهَا"
    text: "«هجان الإبل التى كانت في الشرك» [@diwan-labid، ص202]، أي كرائم الإبل الموروثة."
  - term: "مُتَأَبِّضَاتٍ"
    text: "«مشدودة بالإباض، وهو حبل يشد في اليد» [@diwan-labid، ص202]."
  - term: "الْأَقْرَانِ"
    text: "«الحبال واحدها قرن» [@diwan-labid، ص202]."
  - term: "أَصْوِرَةُ"
    text: "«أصورة جمع صوار»، يعني قطعان بقر الوحش: «يقول: كأن ما قرن منه وما أبض أصورة» [@diwan-labid، ص202]."
  - term: "الرُّعَامِ"
    text: "في شرح الطوسي عن عمارة: «الرعام موضع ببلاد كليب، تراب طيب حر سهل» [@diwan-labid، ص203]. ويروى «الرَّغَامِ»، وهو «من الرمل ليس بدقيق فيه خشونة» [@diwan-labid، ص202]، وبها أنشده صاحب اللسان [@lisan، ج13 ص433]."
