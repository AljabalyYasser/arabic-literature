first: "وَقَدْ كَانَ الْمُعَصَّبُ يَعْتَفِيهَا"
second: "وَتُحْبَسُ عِنْدَ غَايَاتِ الذِّمَامِ"
vocabulary:
  - term: "الْمُعَصَّبُ"
    text: "«الفقير المحتاج يعصب رأسه ورجليه بالخرق للجهد» [@diwan-labid، ص203]."
  - term: "يَعْتَفِيهَا"
    text: "«يأتيها يطلب خيرها» [@diwan-labid، ص203]."
  - term: "غَايَاتِ الذِّمَامِ"
    text: "«يريد ما يلزمه نفسه من الحياء والتكرم للسائل» [@diwan-labid، ص203]."
