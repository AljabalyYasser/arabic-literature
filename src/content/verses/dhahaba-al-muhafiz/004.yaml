explained: false
first: "تَطِيرُ عَدَائِدُ الْأَشْرَاكِ شَفْعًا"
second: "وَوِتْرًا وَالزَّعَامَةُ لِلْغُلَامِ"
vocabulary:
  - term: "تَطِيرُ"
    text: "«تخرج» [@diwan-labid، ص202]."
  - term: "عَدَائِدُ الْأَشْرَاكِ"
    text: "«العدائد: الذين يعادّونه في الشرك، شرك الميراث» [@diwan-labid، ص202]، أي الأنصباء التي تخرج للورثة."
  - term: "شَفْعًا وَوِتْرًا"
    text: "«شفعاً أى سهمان، ووتراً أى سهماً» [@diwan-labid، ص202]."
  - term: "وَالزَّعَامَةُ لِلْغُلَامِ"
    text: "«أى الرياسة للغلام»، و«الغلام يعنى ابن الميت» [@diwan-labid، ص202]."
