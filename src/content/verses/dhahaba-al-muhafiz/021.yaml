first: "بِضَرْبَةِ فَيْصَلٍ تَرَكَتْ رَئِيسًا"
second: "عَلَى الْخَدَّيْنِ يَنْحِطُ غَيْرَ نَامِ"
vocabulary:
  - term: "فَيْصَلٍ"
    text: "«فصلت بين القوم. يفصل: يقطع» [@diwan-labid، ص207]."
  - term: "يَنْحِطُ"
    text: "«ينحط بخفض الحاء أى يزحر» [@diwan-labid، ص207]، أي يئن بنفَس شديد."
  - term: "غَيْرَ نَامِ"
    text: "«أى غير مرتفع» [@diwan-labid، ص207]."
