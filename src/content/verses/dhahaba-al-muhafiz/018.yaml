explained: false
first: "يُرِينَ عَصَائِبًا يَرْكُضْنَ رَهْوًا"
second: "سَوَابِقُهُنَّ كَالرَّجْلِ الْقِيَامِ"
vocabulary:
  - term: "عَصَائِبًا"
    text: "«فرق من الخيل» [@diwan-labid، ص206]."
  - term: "رَهْوًا"
    text: "«يتبع بعضها بعضاً»، ويقال «ساكنة» [@diwan-labid، ص206]."
  - term: "كَالرَّجْلِ الْقِيَامِ"
    text: "«رأى الخيل من بعيد مقبلة فشبه أعناقها وطولها بالرجل القيام» [@diwan-labid، ص206]، أي بالرجال القائمين."
