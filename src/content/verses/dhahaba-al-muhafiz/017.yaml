explained: false
first: "إِذَا بَكَرَ النِّسَاءُ مُرَدَّفَاتٍ"
second: "حَوَاسِرَ لَا يُجِئْنَ عَلَى الْخِدَامِ"
vocabulary:
  - term: "مُرَدَّفَاتٍ"
    text: "«محمولات» [@diwan-labid، ص206]."
  - term: "حَوَاسِرَ"
    text: "مكشوفات الرؤوس؛ «وكلُّ مَكْشُوفَةِ الرأْس وَالذِّرَاعَيْنِ: حاسِرٌ، وَالْجَمْعُ حُسَّرٌ وحَواسِر» [@lisan، ج4 ص188]."
  - term: "لَا يُجِئْنَ عَلَى الْخِدَامِ"
    text: "«يريد لا يغطين الخدام وهى الخلاخيل» [@diwan-labid، ص206]، أي يسرعن في الفزع فلا يسترن سوقهن."
