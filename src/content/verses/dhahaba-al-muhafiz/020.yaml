first: "فَوَاءَلَ يَوْمَ ذَلِكَ مَنْ أَتَاهُ"
second: "كَمَا وَأَلَ الْمُحِلُّ إِلَى الْحَرَامِ"
vocabulary:
  - term: "وَاءَلَ"
    text: "«وأل: نجا»، و«من أتاه يعنى أربد» [@diwan-labid، ص207]، أي لجأ إليه من خاف."
  - term: "الْمُحِلُّ إِلَى الْحَرَامِ"
    text: "«الذى في الحل يوائل إلى الحرم» [@diwan-labid، ص207]."
