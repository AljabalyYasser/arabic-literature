explained: false
first: "وَأَرْبَدُ فَارِسُ الْهَيْجَا إِذَا مَا"
second: "تَقَعَّرَتِ الْمَشَاجِرُ بِالْخِيَامِ"
vocabulary:
  - term: "الْهَيْجَا"
    text: "الحرب؛ «والهَيْجُ والهِياجُ والهَيْجا والهَيْجاءُ: الْحَرْبُ، بِالْمَدِّ وَالْقَصْرِ» [@lisan، ج2 ص395]."
  - term: "تَقَعَّرَتْ"
    text: "«تقوضت من أصلها» [@diwan-labid، ص201]."
  - term: "الْمَشَاجِرُ"
    text: "«خشب توضع عليه أمتعتهم»، و«قال الأصمعى: والشجار قبة الهودج» [@diwan-labid، ص201]."
