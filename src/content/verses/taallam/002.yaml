first: "وَلَوْلَا ظُلْمُهُ مَا زِلْتُ أَبْكِي"
second: "عَلَيْهِ الدَّهْرَ مَا طَلَعَ النُّجُومُ"
meaning: "لولا ظلمه لبقيت أبكيه الدهر كله، ما دامت النجوم تطلع. قال المَرْزُوقِيّ: لولا ما أسلفه من الظلم «لاقتضى ما يجمعني وإياه من الأحوال والذمم... والرحم البكاء عليه مدة الدهر» [@marzuqi-hamasa، ص310]."
vocabulary:
  - term: "ظُلْمُهُ"
    text: "«أشار بالظلم إلى ما جرى بينهم في أمر داحِس والغَبْراء، وإنكاره السَّبْق، وركوبه البغي» [@marzuqi-hamasa، ص310]."
  - term: "مَا طَلَعَ النُّجُومُ"
    text: "مدة طلوع النجوم، أي أبدًا."
syntax:
  - "«وَلَوْلَا»: حرف امتناع لوجود. و«ظُلْمُهُ» مبتدأ خبره محذوف وجوبًا."
  - "«مَا زِلْتُ أَبْكِي»: جواب «لولا». «ما» نافية، و«زال» فعل ناقص يفيد مع النفي الاستمرار، والتاء اسمه، وجملة «أبكي» خبره. والأكثر أن يخلو جواب «لولا» المنفي بـ«ما» من اللام."
  - "«عَلَيْهِ»: متعلق بـ«أبكي». و«الدَّهْرَ» ظرف زمان."
  - "«مَا طَلَعَ النُّجُومُ»: «ما» مصدرية ظرفية. قال المَرْزُوقِيّ: «ينتصب على أنه بدل من الدهر... وقوله: ما طلع، بمنزلة المصدر، وقد حُذف اسم الزمان معه» [@marzuqi-hamasa، ص310]. وذُكّر الفعل «طلع» مع «النجوم» لأنها جمع تكسير."
morphology:
  - "«زِلْتُ» ماضي «زال يزال»، أجوف، وأصل ألفه ياء."
  - "«الظُّلْم» مصدر «ظلم» على «فُعْل»."
  - "«النُّجُوم» جمع «نجم» على «فُعُول»."
rhetoric:
  thesis: "اعتراف نادر: كان سيبكي عدوه الدهر كله، لولا ظلمه."
  devices:
    - title: "التعليق بـ«لولا»"
      text: "البكاء ممتنع لوجود الظلم. فالحزن قائم في النفس، لكن الظلم يحبسه. وبذلك مدح القتيل وعذر نفسه في آن."
    - title: "المبالغة في الزمن"
      text: "قال «الدهر» ثم فسّره بـ«ما طلع النجوم»، أي أبدًا. قال المَرْزُوقِيّ: «والمراد بذكر الدهر الكثير والمبالغة والتأبيد» [@marzuqi-hamasa، ص310]."
  connection: "ثم يبيّن الظلم: «ولكنّ الفتى حَمَلَ بن بَدْر / بغى»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَلَوْلَا ظُلْ / مُهُو مَا زِلْ / تُ أَبْكِي = مفاعلْتن / مفاعلْتن / فعولن — عَلَيْهِدْ دَهْ / رَ مَا طَلَعَنْ / نُجُومُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ تفعيلتي الصدر والأولى من العَجُز [@atiq، ص54]."
