first: "تَعَلَّمْ أَنَّ خَيْرَ النَّاسِ مَيْتٌ"
second: "عَلَى جَفْرِ الْهَبَاءَةِ لَا يَرِيمُ"
meaning: "اعلم أن خير الناس ميت عند جَفْر الهَبَاءة، ملقًى لا يبرح مكانه. ويعني حَمَل بن بَدْر [@marzuqi-hamasa، ص309]."
vocabulary:
  - term: "تَعَلَّمْ"
    text: "اعلم. قال المَرْزُوقِيّ: «ولا يقال في جوابه: تعلّمت، استُغني عنه بعلمت» [@marzuqi-hamasa، ص309]."
  - term: "جَفْرِ الْهَبَاءَةِ"
    text: "«بئر قريبة القعر، وماؤها كثير معين» [@marzuqi-hamasa، ص309]، عندها قُتل ابنا بَدْر."
  - term: "لَا يَرِيمُ"
    text: "لا يبرح مكانه."
syntax:
  - "«تَعَلَّمْ»: فعل أمر بمعنى «اعلم»، وفاعله ضمير مستتر."
  - "«أَنَّ خَيْرَ النَّاسِ مَيْتٌ»: «أنّ» حرف توكيد ونصب، و«خيرَ» اسمها، و«النّاس» مضاف إليه، و«مَيْتٌ» خبرها مرفوع."
  - "«عَلَى جَفْرِ الْهَبَاءَةِ»: جار ومجرور متعلقان بمحذوف صفة لـ«ميت»، أي ميت ملقًى على جفر الهباءة. ويجوز أن يتعلقا بـ«ميت» نفسه."
  - "«لَا يَرِيمُ»: جملة في محل رفع صفة ثانية لـ«ميت»."
  - "والمصدر المؤول من «أنّ» ومعموليها سدّ مسدّ مفعولي «تعلّم»."
morphology:
  - "«تَعَلَّمْ»: أمر على «تَفَعَّلْ»."
  - "«يَرِيم»: مضارع «رام يريم» إذا برح، أجوف يائي."
  - "«مَيْتٌ»: مخفف «مَيِّت»، على «فَيْعِل» من «مات يموت». أصله «مَيْوِت»، قُلبت الواو ياء وأُدغمت في الياء فصار «مَيِّت»، ثم خُفّف بحذف الياء الثانية."
rhetoric:
  thesis: "رثاء عدو: يبدأ قَيْس بمدح من قتله قومه، فيسميه «خير الناس»."
  devices:
    - title: "المفارقة"
      text: "الذي يرثيه قتيل قومه، والذي يمدحه خصمه. فالبيت يعترف بفضل العدو في ساعة الظفر به."
    - title: "الإطناب"
      text: "تمّ المعنى بقوله «ميت»، ثم زاد «لا يريم»، فصوّر القتيل ملقًى عند البئر لا يبرحه. فالزيادة لا تخبر بجديد، لكنها تُبقي صورة الجثة أمام السامع."
    - title: "الأمر للتنبيه"
      text: "«تعلّم» أمر لا يُقصد به التعليم، بل التنبيه إلى أمر عظيم."
  connection: "ثم يقول: لولا ظلمه لبكيته الدهر كله."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "تَعَلْلَمْ أَنْ / نَ خَيْرَنْ نَا / سِ مَيْتُنْ = مفاعلْتن / مفاعلْتن / فعولن — عَلَى جَفْرِلْ / هَبَاءَةِ لَا / يَرِيمُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ تفعيلتي الصدر والأولى من العَجُز [@atiq، ص54]."
context: "قاله قَيْس بن زُهَيْر بعد يوم الهَبَاءة، حين قتل قومه حُذَيْفة وحَمَلًا ابني بَدْر [@aghani-dk، ج17 ص205–206]."
variants:
  - reading: "تَعَلَّمْ أَنَّ خَيْرَ النَّاسِ حَيًّا / عَلَى جَفْرِ الْهَبَاءَةِ لَا يَرِيمُ"
    status: "رواية المَرْزُوقِيّ"
    note: "على هذه الرواية «حيًّا» حال، و«على جفر الهباءة» خبر «أنّ»، كما قال المَرْزُوقِيّ [@marzuqi-hamasa، ص309]. والمعنى: إن الذي كان خير الناس في حياته صار عند جفر الهباءة لا يبرح. فالموت لا يُذكر صريحًا، و«لا يريم» كناية عنه، والمقابلة بين حياته ومصيره. أما في رواية التِّبْرِيزِيّ فالموت مصرّح به في «ميت»، وهو الخبر، و«لا يريم» وصف يزيده تصويرًا."
  - reading: "تَعَلَّمْ أَنَّ خَيْرَ النَّاسِ مَيْتٌ / عَلَى جَفْرِ الْهَبَاءَةِ مَا يَرِيمُ"
    status: "رواية الأغاني والعقد"
    note: "هي رواية التِّبْرِيزِيّ إلا «ما يريم» مكان «لا يريم»، والمعنى واحد [@aghani-dk، ج17 ص206] [@iqd، ج6 ص23]. وذكر المَرْزُوقِيّ الروايات كلها [@marzuqi-hamasa، ص309]."
