first: "تَعَلَّمْ أَنَّ خَيْرَ النَّاسِ حَيًّا"
second: "عَلَى جَفْرِ الْهَبَاءَةِ لَا يَرِيمُ"
meaning: "اعلم أن الذي كان خير الناس حيًّا صار ملقى عند جَفْر الهَبَاءة لا يبرح مكانه. ويعني حَمَل بن بَدْر [@marzuqi-hamasa، ص309]."
vocabulary:
  - term: "تَعَلَّمْ"
    text: "اعلم. قال المَرْزُوقِيّ: «ولا يقال في جوابه: تعلّمت، استُغني عنه بعلمت» [@marzuqi-hamasa، ص309]."
  - term: "جَفْرِ الْهَبَاءَةِ"
    text: "«بئر قريبة القعر، وماؤها كثير معين» [@marzuqi-hamasa، ص309]، عندها قُتل ابنا بَدْر."
  - term: "لَا يَرِيمُ"
    text: "لا يبرح مكانه."
syntax:
  - "«تَعَلَّمْ»: فعل أمر بمعنى «اعلم»، وفاعله ضمير مستتر."
  - "«أَنَّ خَيْرَ النَّاسِ»: «أنّ» حرف توكيد ونصب، و«خيرَ» اسمها، و«النّاس» مضاف إليه. و«حَيًّا» حال."
  - "«عَلَى جَفْرِ الْهَبَاءَةِ»: خبر «أنّ»، كما قال المَرْزُوقِيّ [@marzuqi-hamasa، ص309]. وجملة «لا يريم» حال."
  - "والمصدر المؤول من «أنّ» ومعموليها سدّ مسدّ مفعولي «تعلّم»."
morphology:
  - "«تَعَلَّمْ»: أمر على «تَفَعَّلْ»."
  - "«يَرِيم»: مضارع «رام يريم» إذا برح، أجوف يائي."
  - "«حَيًّا»: صفة مشبهة من «حَيِيَ»، أصلها «حَيِيٌ»، فأُدغمت الياء في الياء."
rhetoric:
  thesis: "رثاء عدو: يبدأ قَيْس بمدح من قتله قومه، فيسميه «خير الناس»."
  devices:
    - title: "المفارقة"
      text: "الذي يرثيه قتيل قومه، والذي يمدحه خصمه. فالبيت يعترف بفضل العدو في ساعة الظفر به."
    - title: "الكناية"
      text: "«لا يريم» كناية عن الموت: لا يبرح مكانه. لم يقل «قُتل»، بل ذكر ما يلزم منه."
    - title: "الأمر للتنبيه"
      text: "«تعلّم» أمر لا يُقصد به التعليم، بل التنبيه إلى أمر عظيم."
  connection: "ثم يقول: لولا ظلمه لبكيته الدهر كله."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "تَعَلْلَمْ أَنْ / نَ خَيْرَنْ نَا / سِ حَيْيَنْ = مفاعلْتن / مفاعلْتن / فعولن — عَلَى جَفْرِلْ / هَبَاءَةِ لَا / يَرِيمُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ تفعيلتي الصدر والأولى من العَجُز [@atiq، ص54]."
context: "قاله قَيْس بن زُهَيْر بعد يوم الهَبَاءة، حين قتل قومه حُذَيْفة وحَمَلًا ابني بَدْر [@aghani، ج17 ص208–209]."
variants:
  - reading: "تَعَلَّمْ أَنَّ خَيْرَ النَّاسِ مَيْتٌ / عَلَى جَفْرِ الْهَبَاءَةِ مَا يَرِيمُ"
    status: "رواية الأغاني والعقد"
    note: "و«ميتٌ» خبر «أنّ»، و«على جفر الهباءة» صفة له [@aghani، ج17 ص209] [@iqd، ج6 ص23]. وذكر المَرْزُوقِيّ الروايات كلها [@marzuqi-hamasa، ص309]."
