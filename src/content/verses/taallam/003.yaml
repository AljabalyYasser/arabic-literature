first: "وَلَكِنَّ الْفَتَى حَمَلَ بْنَ بَدْرٍ"
second: "بَغَى وَالْبَغْيُ مَرْتَعُهُ وَخِيمُ"
meaning: "لكن الفتى حَمَل بن بَدْر ظلم وتجاوز، والظلم مرعى وخيم، يثقل على من يرعاه ويُهلكه. قال المَرْزُوقِيّ: «استعمل البغي، واستوبل العافية، واستذمّ المرتع» [@marzuqi-hamasa، ص310]."
vocabulary:
  - term: "بَغَى"
    text: "ظلم وجار. يقال: بغى الرجل على فلان، أي جار عليه [@marzuqi-hamasa، ص310]."
  - term: "مَرْتَعُهُ"
    text: "موضع رعيه، حيث ترتع الدواب."
  - term: "وَخِيمُ"
    text: "ثقيل لا يُستمرأ. «والوخامة: الثقل يعرض من الطعام» [@marzuqi-hamasa، ص310]."
syntax:
  - "«وَلَكِنَّ الْفَتَى»: «لكنّ» حرف استدراك ونصب، و«الفتى» اسمها منصوب بفتحة مقدرة."
  - "«حَمَلَ»: بدل من «الفتى» منصوب. و«بْنَ» صفة لـ«حَمَل»، و«بَدْرٍ» مضاف إليه. وحُذفت ألف «ابن» لأنه وقع بين علمين."
  - "«بَغَى»: فعل ماض، والجملة في محل رفع خبر «لكنّ»."
  - "«وَالْبَغْيُ مَرْتَعُهُ وَخِيمُ»: الواو استئنافية، و«البغي» مبتدأ أول، و«مرتعُه» مبتدأ ثانٍ، و«وخيم» خبر الثاني، والجملة خبر الأول."
morphology:
  - "«مَرْتَع» اسم مكان من «رَتَعَ» على «مَفْعَل»."
  - "«وَخِيم» صفة مشبهة على «فَعِيل» من «وَخُمَ»."
  - "«بَغَى» ناقص يائي، و«البَغْي» مصدره."
rhetoric:
  thesis: "يعلّل ما قبله: الظلم هو الذي منع البكاء. ثم يرسل حكمة عامة."
  devices:
    - title: "الاستعارة"
      text: "جعل للبغي مرتعًا، كأنه مرعى ترعاه الإبل فتستوخمه، أي يثقل عليها ويمرضها. فالظالم يرعى في ظلمه ثم يجد عاقبته."
    - title: "الحكمة في العَجُز"
      text: "جملة «والبغي مرتعه وخيم» تامة بنفسها، تصلح لكل ظالم. وفي «مجمع الأمثال» مثل قريب منها: «الظلم مرتعه وخيم»، ينسبه المَيْدانيّ إلى شاعر آخر [@maydani، ج1 ص444]."
    - title: "الاستدراك"
      text: "«لكنّ» تردّ ما يُتوقع من البيت السابق: كان حقه أن يُبكى، لكنه بغى."
  connection: "ثم يلتفت إلى نفسه: «أظن الحلم دلّ عليّ قومي»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَلَاكِنْنَلْ / فَتَى حَمَلَبْ / نَ بَدْرِنْ = مفاعلْتن / مفاعلَتن / فعولن — بَغَى وَلْبَغْ / يُ مَرْتَعُهُو / وَخِيمُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ الأولى من كل شطر [@atiq، ص54]."
