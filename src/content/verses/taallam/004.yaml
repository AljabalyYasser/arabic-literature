first: "أَظُنُّ الْحِلْمَ دَلَّ عَلَيَّ قَوْمِي"
second: "وَقَدْ يُسْتَجْهَلُ الرَّجُلُ الْحَلِيمُ"
meaning: "أظن أن حلمي عن قومي هو الذي جرّأهم عليّ، والحليم إذا أُحرج قد يُحمل على الغضب. قال المَرْزُوقِيّ: «إذا أُحوج الحليم وأُحرج، فقد يتكلف ما لا يكون معهودًا في طبعه» [@marzuqi-hamasa، ص310]."
vocabulary:
  - term: "الْحِلْم"
    text: "الأناة وضبط النفس عند الغضب."
  - term: "يُسْتَجْهَلُ"
    text: "يُحمل على الجهل. والجهل في لغة الجاهلية ضد الحلم: الطيش والغضب، لا ضد العلم."
syntax:
  - "«أَظُنُّ»: مضارع من أفعال القلوب ينصب مفعولين، وفاعله ضمير مستتر."
  - "«الْحِلْمَ»: مفعول أول. وجملة «دلّ عليّ قومي» في محل نصب مفعول ثانٍ."
  - "«دَلَّ»: ماض، وفاعله ضمير يعود على الحلم. و«عَلَيَّ» متعلق به، و«قَوْمِي» مفعول به."
  - "«وَقَدْ يُسْتَجْهَلُ»: الواو استئنافية، و«قد» مع المضارع للتقليل، و«يُستجهل» مضارع مبني للمجهول، و«الرجلُ» نائب فاعل، و«الحليمُ» صفة."
morphology:
  - "«يُسْتَجْهَل» على «يُسْتَفْعَل»، والسين والتاء هنا للحمل على الشيء: استجهله، أي حمله على الجهل."
  - "«الْحَلِيم» صفة مشبهة على «فعيل» من «حَلُمَ»."
  - "«دَلَّ» مضعّف."
rhetoric:
  thesis: "حكمة الرجل الصبور: حلمه أطمع فيه قومه، والحليم إذا أُحرج خرج عن طبعه."
  devices:
    - title: "المقابلة بين الحلم والجهل"
      text: "البيت كله قائم على الضدين: الحلم في الصدر، والاستجهال في العَجُز. فالحلم الذي دلّ القوم عليه هو نفسه الذي يُستفز حتى ينقلب."
    - title: "«قد» للتقليل"
      text: "لم يقل «يُستجهل الحليم» مطلقًا، بل «قد يُستجهل». فالأصل في الحليم أن يحلم، وخروجه عن حلمه نادر، لا يكون إلا عن إحراج."
    - title: "الاعتذار"
      text: "البيت في معناه اعتذار عما صنع يوم الهَبَاءة: لم يكن ذلك من طبعه، بل حمله عليه قومه."
  connection: "وفي رواية «الأغاني» أبيات أخرى بعده، منها: «ومارستُ الرجالَ ومارسوني / فمعوجٌّ عليّ ومستقيمُ» [@aghani، ج17 ص209]."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "أَظُنْنُلْ حِلْ / مَ دَلْلَ عَلَيْ / يَ قَوْمِي = مفاعلْتن / مفاعلَتن / فعولن — وَقَدْ يُسْتَجْ / هَلُرْ رَجُلُلْ / حَلِيمُو = مفاعلْتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ الأولى من كل شطر [@atiq، ص54]."
variants:
  - reading: "وَقَدْ يُسْتَضْعَفُ الرَّجُلُ الْحَلِيمُ"
    status: "رواية العقد"
    note: "أي: قد يظنه الناس ضعيفًا [@iqd، ج6 ص23]."
