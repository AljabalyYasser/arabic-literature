first: "وَابْعَثْ يَسَارًا إِلَى وُفْرٍ مُذَمَّمَةٍ"
second: "وَاحْدِجْ إِلَيْهَا بِذِي عَرْكَيْنِ قِنْعَاسِ"
meaning: "وأرسل عبدك يسارًا إلى أسقية لبنك الممتلئة، التي يذمّها الضيوف والجيران لأنك لا تسقيهم منها، وشدّ رحله إليها على بعير ضخم شديد في مرفقيه أثر الاحتكاك. قال السُّكَّرِيّ: «يقول: حسبك أن تأكل وتشرب»، ثم قال: «يقول: ابعث يسارا ليأتيك بوطابٍ وُفْرٍ مُذمّمةٍ ضخامٍ لا يُسقى منها الضيفانُ ولا الجيران» [@diwan-hutayah، ص290]."
vocabulary:
  - term: "يَسَارًا"
    text: "اسم عبد. قال ابن السِّكِّيت: «رواية أبى عمرو: يسار راعى الزبرقان»، وقال السُّكَّرِيّ: «يسار: عبده» [@diwan-hutayah، ص290]."
  - term: "وُفْرٍ"
    text: "أسقية لبن ممتلئة. قال ابن السِّكِّيت: «وُفْرٌ: وطاب وافرة، واحدها وافر، أى وطابك مملوءة لأنك لا تقرى منها» [@diwan-hutayah، ص290]. وفي رواية غيره: «وقد أراد الأسقية وهى وطاب اللبن» [@diwan-hutayah، ص290]."
  - term: "مُذَمَّمَةٍ"
    text: "مذمومة كثيرًا؛ «مُذَمَّمَةٌ: يذمّها الأضياف والجيران» [@diwan-hutayah، ص290]."
  - term: "احْدِجْ"
    text: "شدّ الرحل وارحل؛ «واحدج: أى ارحل، والحِدْج: مركب من مراكب النساء» [@diwan-hutayah، ص290]."
  - term: "عَرْكَيْنِ"
    text: "أثرين في جنبي البعير من احتكاك مرفقيه. «والعَرْك: أن يعرك منها المرفقُ الكِركِرةَ فيتغضّن الجلد» [@diwan-hutayah، ص290]."
  - term: "قِنْعَاسِ"
    text: "الضخم الشديد؛ «والقِنعاس: الشديد» [@diwan-hutayah، ص290]."
context: "يكمل صورة البيت 13 بمشهد من البيت: الرجل الذي لا يطلب المكارم يرسل عبده إلى لبنه المخزون. فالأسقية مملوءة لأن الضيوف لا يُسقون منها، وهذا هو البخل الذي يريد أن يثبته."
syntax:
  - "«وَابْعَثْ» معطوف على «اقْعُدْ» في البيت السابق، و«يَسَارًا» مفعول به."
  - "«إِلَى وُفْرٍ» متعلق بـ«ابْعَثْ»، و«مُذَمَّمَةٍ» صفة لـ«وُفْرٍ»."
  - "«وَاحْدِجْ إِلَيْهَا» معطوف، و«بِذِي عَرْكَيْنِ» متعلق بـ«احْدِجْ»، و«ذِي» صفة لموصوف محذوف، أي ببعير ذي عركين، و«قِنْعَاسِ» صفة ثانية."
morphology:
  - "«وُفْرٌ» جمع «وافر» على وزن فُعْل، كما في الشرح: «واحدها وافر» [@diwan-hutayah، ص290]."
  - "«مُذَمَّمَةٌ» اسم مفعول من «ذَمَّمَ» المضعّف للتكثير."
  - "«عَرْكَيْنِ» مثنى «عَرْك»، مجرور بالياء بإضافة «ذي» إليه."
  - "«قِنْعَاسٌ» على وزن فِعْلال، من أوزان الصفات الدالة على الضخامة والشدة."
rhetoric:
  thesis: "الهجاء هنا مشهد لا حكم: عبد يُرسَل، وبعير بطيء ضخم يحمل أسقية مملوءة لا يُعطى منها أحد. فالبخل يُرى في الأشياء، في امتلاء الأسقية."
  devices:
    - title: "الكناية"
      text: "في «وُفْرٍ مُذَمَّمَةٍ» كنى عن البخل بامتلاء الأسقية: «أى وطابك مملوءة لأنك لا تقرى منها» [@diwan-hutayah، ص290]. والكناية عند عبد القاهر الجُرْجانيّ أن تذكر معنى هو «تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]: والامتلاء تالي المنع."
    - title: "التهكّم بالأمر"
      text: "في «وَابْعَثْ» و«وَاحْدِجْ» يتابع الأوامر الساخرة التي بدأت في «دَعِ» و«اقْعُدْ». فالشاعر يرسم للزبرقان برنامج حياته: قعود، وعبد، ولبن مخزون."
    - title: "دقة الوصف"
      text: "في «بِذِي عَرْكَيْنِ» اختار بعيرًا بطيئًا، كما يقول ابن السِّكِّيت: «لأنه إذا كان به عركان لم يُسْرِع، وإذا أسرع وعليه الوطاب يُهْرِيق منها» [@diwan-hutayah، ص290]. فحتى البعير يحرص ألا يضيع من اللبن قطرة."
  connection: "ثم يخرج من السخرية إلى الحكمة: «مَنْ يَفْعَلِ الْخَيْرَ لَا يَعْدَمْ جَوَازِيَهُ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "وَبْعَثْ يَسَا / رَنْ إِلَى / وُفْرِنْ مُذَمْ / مَمَتِنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — وَحْدِجْ إِلَيْ / هَا بِذِي / عَرْكَيْنِ قِنْ / عَاسِي = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "جاءت التفعيلات سالمة إلا العروض المخبونة والضرب المقطوع [@atiq، ص48]. وتسقط همزة الوصل في «ابْعَثْ» و«احْدِجْ»."
