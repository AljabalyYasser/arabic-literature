first: "أَزْمَعْتُ يَأْسًا مُبِينًا مِنْ نَوَالِكُمُ"
second: "وَلَنْ تَرَى طَارِدًا لِلْحُرِّ كَالْيَاسِ"
meaning: "عزمت على يأس بيّن من عطائكم، وليس شيء يصرف الحرّ الكريم عن قوم مثل اليأس منهم. فاليأس عنده دواء من الذل: إذا يئس الحر من الناس كفّ عن سؤالهم."
vocabulary:
  - term: "أَزْمَعْتُ"
    text: "عزمت وأجمعت؛ وفي بعض الروايات «أجمعت» مكانها [@diwan-hutayah، ص288]."
  - term: "مُبِينًا"
    text: "بيّنًا ظاهرًا لا رجعة فيه."
  - term: "نَوَالِكُمُ"
    text: "عطائكم."
  - term: "الْيَاسِ"
    text: "اليأس، خُففت همزته للقافية."
context: "جواب الشرط الذي بدأ في البيت السابع، وبه تنتهي قصة الرجاء: من المدح إلى الانتظار إلى اليأس. ويقول ابن السِّكِّيت: «هذا البيت والذى بعده من رواية الأصمعى» [@diwan-hutayah، ص288]."
syntax:
  - "«أَزْمَعْتُ» جواب «إذا» في البيت السابق، لا محل لها من الإعراب."
  - "«يَأْسًا» مفعول به، و«مُبِينًا» صفته، و«مِنْ نَوَالِكُمُ» متعلق بـ«يَأْسًا»."
  - "«وَلَنْ تَرَى طَارِدًا ... كَالْيَاسِ» الواو استئنافية، و«طَارِدًا» مفعول به لـ«تَرَى»، و«لِلْحُرِّ» متعلق بـ«طَارِدًا»، و«كَالْيَاسِ» صفة لـ«طَارِدًا»، أي: طاردًا مثل اليأس."
morphology:
  - "«أَزْمَعَ» رباعي على وزن أَفْعَلَ، من الزَّمَع: العزم على الأمر."
  - "«يَأْسٌ» مصدر «يَئِسَ يَيْأَسُ»، وخُففت همزته في القافية «الْيَاسِ»، وهو تخفيف شائع في الشعر."
  - "«طَارِدٌ» اسم فاعل من «طَرَدَ»، وعمل عمل فعله فنصب الحرّ بحرف الجر."
rhetoric:
  thesis: "يحوّل الشاعر الهزيمة إلى كرامة: لم يُطرد، بل يئس فرحل. واليأس الذي يبدو ضعفًا يصير في العجز حكمة يتمثل بها الناس."
  devices:
    - title: "التذييل بالمثل"
      text: "في «وَلَنْ تَرَى طَارِدًا لِلْحُرِّ كَالْيَاسِ» ختم الحكاية بقول عام يصلح لكل حر. فالعجز يستقل بمعناه عن الصدر، ويصير مثلًا. والحطيئة كثير التذييل بالحكمة، وستجد أشهر أمثلته في البيت 15."
    - title: "التشخيص"
      text: "في «طَارِدًا ... كَالْيَاسِ» جعل اليأس رجلًا يطرد الحر من دار الذل، فاليأس فاعل لا شعور."
  connection: "ثم يعود إلى بَغِيض بصدر البيت الثاني نفسه: «مَا كَانَ ذَنْبُ بَغِيضٍ أَنْ رَأَى رَجُلًا»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "أَزْمَعْتُ يَأْ / سَنْ مُبِي / نَنْ مِنْ نَوَا / لِكُمُو = مستفعلن / فاعلن / مستفعلن / فعِلن — وَلَنْ تَرَى / طَارِدَنْ / لِلْحُرْرِ كَلْ / يَاسِي = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» الأولى في العجز [@atiq، ص46]. وأُشبعت ضمة الميم في «نَوَالِكُمُ»."
