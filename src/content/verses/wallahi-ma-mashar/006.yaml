    status: "رواية السِّجِسْتانيّ"
    note: "«رواية الشطر الأول فى م: لا ذنب لى اليوم إن كانت نفوسكم» [@diwan-hutayah، ص287]."
  - reading: "فَمَا مَلَكْتُ بِأَنْ كَانَتْ صُدُورُكُمُ"
    status: "رواية غير ابن السِّكِّيت"
    note: "«ويروى صدوركم» [@diwan-hutayah، ص287]."
