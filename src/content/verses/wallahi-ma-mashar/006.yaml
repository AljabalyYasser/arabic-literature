first: "فَمَا مَلَكْتُ بِأَنْ كَانَتْ نُفُوسُكُمُ"
second: "كَفَارِكٍ كَرِهَتْ ثَوْبِي وَإِلْبَاسِي"
meaning: "ولم يكن في يدي شيء حين كرهتني نفوسكم كما تكره المرأةُ زوجها: تأبى أن يدخل معها في ثوبها، وأن تدخل معه في ثوبه، أي تأبى أن تضاجعه وأن يمسّها. وهكذا شرحه ابن السِّكِّيت: «أى ما ملكت إبغاضكم إياى، والفارك: المرأة المبغضة لزوجها»، ثم قال: «وقوله: كرهت ثوبى: أى كرهت أن تدخل معى فى ثوبى، وأن تُدخلنى فى ثوبها، وأن تلبس ثوبها فتُدخلنى معها» [@diwan-hutayah، ص287]. فالمعنى: أنتم نفرتم مني نفور الزوجة الكارهة من فراش زوجها، وليس لي حيلة في ذلك."
vocabulary:
  - term: "مَلَكْتُ"
    text: "قدرت. يريد: لم يكن ذلك في قدرتي، كما يشرحه ابن السِّكِّيت «ما ملكت إبغاضكم إياى» [@diwan-hutayah، ص287]."
  - term: "فَارِكٍ"
    text: "المرأة التي تبغض زوجها. «والفارك: المرأة المبغضة لزوجها، يقال: فَرِكَتْه تفرَكه فِرْكا» [@diwan-hutayah، ص287]."
  - term: "ثَوْبِي وَإِلْبَاسِي"
    text: "كناية عن المضاجعة: أن يجتمعا في ثوب واحد، فيدخل معها في ثوبها أو تدخل معه في ثوبه [@diwan-hutayah، ص287]."
context: "خلاصة الصور الثلاث السابقة: لم يكن العيب في مدحه ولا في صبره، بل في نفوس قوم الزِّبْرِقان. وهو أول تصريح بالبغضاء في القصيدة، ويمهّد لليأس في البيتين التاليين."
syntax:
  - "«فَمَا مَلَكْتُ» الفاء عاطفة، و«ما» نافية."
  - "«بِأَنْ كَانَتْ» الباء حرف جر، وفسّرها ابن السِّكِّيت: «معنى الباء: الطرح» [@diwan-hutayah، ص287]، أي هي زائدة لا معنى لها في الإعراب، والمصدر المؤول «أن كانت» في موضع نصب مفعول به لـ«مَلَكْتُ»."
  - "«نُفُوسُكُمُ» اسم «كَانَتْ»، و«كَفَارِكٍ» جار ومجرور في موضع نصب خبرها."
  - "«كَرِهَتْ ثَوْبِي» جملة في موضع جر صفة لـ«فَارِكٍ»."
morphology:
  - "«فَارِكٌ» اسم فاعل من «فَرِكَ يَفْرَكُ» بلا تاء، لأنه وصف خاص بالمرأة، مثل «حائض» و«طالق»."
  - "«إِلْبَاسٌ» مصدر «أَلْبَسَ» الرباعي على وزن إفعال، أي أن تُلبسه ثوبها."
rhetoric:
  thesis: "أقسى صور القصيدة وأقربها إلى الجسد: قوم الزِّبْرِقان امرأة تبغض زوجها، تأبى أن يشاركها ثوبها وفراشها. فالبغضاء عنده نفور جسدي، لا يُعالج بالمدح ولا بالصبر."
  devices:
    - title: "التشبيه"
      text: "في «كَانَتْ نُفُوسُكُمُ كَفَارِكٍ» شبّه نفوسهم في نفورها منه بالزوجة الكارهة لزوجها. ووجه الشبه بغض لا علة له يقدر الزوج على إزالتها، فالتشبيه يبرّئ الشاعر: لا ذنب للزوج إذا فركته امرأته."
    - title: "الكناية"
      text: "في «كَرِهَتْ ثَوْبِي وَإِلْبَاسِي» لم يذكر المضاجعة، بل ذكر ما يلازمها: أن يجتمعا في ثوب واحد. وهذه هي الكناية عند عبد القاهر الجُرْجانيّ: «أن يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود»، فيومئ به إليه [@dalail، ص66]."
  connection: "ثم يبلغ نهاية القصة: «حَتَّى إِذَا مَا بَدَا لِي غَيْبُ أَنْفُسِكُمْ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "فَمَا مَلَكْ / تُبِأَنْ / كَانَتْ نُفُو / سُكُمُو = متفعلن / فعِلن / مستفعلن / فعِلن — كَفَارِكِنْ / كَرِهَتْ / ثَوْبِي وَإِلْ / بَاسِي = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» الأولى و«فاعلن» الأولى في الشطرين [@atiq، ص46]. وأُشبعت ضمة الميم في «نُفُوسُكُمُ»."
variants:
