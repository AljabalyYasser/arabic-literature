first: "حَتَّى إِذَا مَا بَدَا لِي غَيْبُ أَنْفُسِكُمْ"
second: "وَلَمْ يَكُنْ لِجِرَاحِي فِيكُمُ آسِي"
meaning: "حتى إذا ظهر لي ما كنتم تخفون في أنفسكم من البغض، ولم أجد فيكم من يداوي جراحي، أي من يصلح حالي. قال ابن السِّكِّيت: «يقول: بدا لى منكم ما كان غائبا فى أنفسكم من البغضة، ولم يكن فيكم مُصْلِحٌ لما بى من الفساد وسوء الحال، وضرب الجراح مثلا لسوء حاله» [@diwan-hutayah، ص288]. وجواب «إذا» في البيت التالي."
vocabulary:
  - term: "غَيْبُ"
    text: "ما غاب واستتر؛ وهو في شرح ابن السِّكِّيت «ما كان غائبا فى أنفسكم من البغضة» [@diwan-hutayah، ص288]."
  - term: "آسِي"
    text: "مداوٍ. قال المُبَرِّد: «يقول: مداوٍ، الآسي: الطبيب» [@kamil، ج2 ص141]. وفي شرح ابن السِّكِّيت: «يقال: أسا الجرحَ يأسوه أسْوا وأسًا إذا داواه. والإساء: الدواء. والآسى: المداوى، والأُساة: المداوون» [@diwan-hutayah، ص288]."
context: "بداية الجملة الشرطية التي تُغلق قصة الرجاء: «حتى إذا» تعلن أن الانتظار بلغ آخره. والبيت يجمع ما قبله، والجواب في البيت الثامن."
syntax:
  - "«حَتَّى» ابتدائية، و«إِذَا» ظرف لما يستقبل من الزمان متضمن معنى الشرط، و«مَا» زائدة."
  - "«بَدَا لِي غَيْبُ أَنْفُسِكُمْ» جملة الشرط في محل جر بإضافة «إذا» إليها، و«غَيْبُ» فاعل «بَدَا»."
  - "«وَلَمْ يَكُنْ ... آسِي» معطوفة على جملة الشرط. و«آسِي» اسم «يَكُنْ» مؤخر، وأصله «آسٍ» منقوص، أُثبتت ياؤه للقافية، و«لِجِرَاحِي» و«فِيكُمُ» متعلقان بمحذوف خبر."
  - "وجواب الشرط «أَزْمَعْتُ» في البيت التالي، فالبيتان متصلان في المعنى."
morphology:
  - "«آسٍ» اسم فاعل من «أَسَا يَأْسُو» الناقص الواوي، على وزن فاعل، وأصله آسِوٌ، قُلبت الواو ياء لتطرفها بعد كسرة."
  - "«جِرَاحٌ» جمع «جُرْح» على وزن فِعال."
rhetoric:
  thesis: "يصير الفقر جرحًا، والقوم أطباء امتنعوا عن مداواته. فالجار الذي لا يُعان جريح تُرك ينزف."
  devices:
    - title: "الاستعارة"
      text: "في «لِجِرَاحِي» جعل فقره وسوء حاله جراحًا، وفي «آسِي» جعل من يعينه طبيبًا. «وضرب الجراح مثلا لسوء حاله» كما يقول ابن السِّكِّيت [@diwan-hutayah، ص288]. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "تعليق الجواب"
      text: "في «حَتَّى إِذَا» بدأ شرطًا ولم يتمه في البيت، فيبقى السامع منتظرًا الجواب، كما بقي الشاعر منتظرًا عطاءهم. وهذا ما يسمّيه النقاد التضمين: تعلق معنى البيت بما بعده."
  connection: "والجواب: «أَزْمَعْتُ يَأْسًا مُبِينًا مِنْ نَوَالِكُمُ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "حَتْتَى إِذَا / مَا بَدَا / لِي غَيْبُ أَنْ / فُسِكُمْ = مستفعلن / فاعلن / مستفعلن / فعِلن — وَلَمْ يَكُنْ / لِجِرَا / حِي فِيكُمُو / آسِي = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» و«فاعلن» الأوليين في العجز [@atiq، ص46]. وأُشبعت ضمة الميم في «فِيكُمُ» ليستقيم الوزن."
variants:
  - reading: "لَمَّا بَدَا لِي مِنْكُمْ غَيْبُ أَنْفُسِكُمْ"
    status: "رواية السُّكَّرِيّ والمُبَرِّد وأبي الفَرَج"
    note: "في الشرح عن السُّكَّرِيّ والكامل [@diwan-hutayah، ص288]، وهي عند المُبَرِّد [@kamil، ج2 ص140] وأبي الفَرَج [@aghani-dk، ج2 ص184]."
  - reading: "لَمَّا بَدَا لِي مِنْكُمْ خُبْثُ أَنْفُسِكُمْ"
    status: "رواية غير ابن السِّكِّيت"
    note: "«وروى غيره: لما بدا لى منكم خُبْثُ أنفسكم، وإنما عنَى خصاصته وفقره» [@diwan-hutayah، ص288]. وفي بعض الأصول «عيب» بالعين المهملة."
