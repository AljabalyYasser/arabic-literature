first: "وَاللهِ مَا مَعْشَرٌ لَامُوا امْرَأً جُنُبًا"
second: "مِنْ آلِ لَأْيِ بْنِ شَمَّاسٍ بِأَكْيَاسِ"
meaning: "أقسم بالله: ما القوم الذين لاموا رجلًا غريبًا، يعني نفسه، على مدح آل لَأْي بن شَمّاس، بعقلاء. قال ابن السِّكِّيت: «يقول: لاموه فى مدح هؤلاء فما أصابوا» [@diwan-hutayah، ص284]. وقال السُّكَّرِيّ: «يقول: مَنْ لامنى على مدح بغيض فليس بكيّس لإحسانهم إلىّ» [@diwan-hutayah، ص284]."
vocabulary:
  - term: "مَعْشَرٌ"
    text: "جماعة من الناس."
  - term: "جُنُبًا"
    text: "غريبًا. في شرح ابن السِّكِّيت: «الجانب والجُنُب: الغريب، والجنابة: الغُرْبة» [@diwan-hutayah، ص284]."
  - term: "آلِ لَأْيِ بْنِ شَمَّاسٍ"
    text: "رهط بَغِيض، وهو عند ابن سَلّام «بغيض بن عامر بن لأى بن شماس أحد بنى قريع بن عوف» [@ibn-sallam، ج1 ص115]."
  - term: "أَكْيَاسِ"
    text: "جمع كَيِّس، وهو العاقل الفطن؛ وفسّره السُّكَّرِيّ بقوله: «فليس بكيّس» [@diwan-hutayah، ص284]."
context: "مطلع القصيدة على رواية ابن السِّكِّيت. يبدأ بالقسم والدفاع قبل المدح والهجاء: فالقصيدة في أولها جواب عن لوم، والحُطَيْئة يحاكم لائميه قبل أن يحاكم الزِّبْرِقان. وليس فيها مقدمة غزلية ولا طلل."
syntax:
  - "«وَاللهِ» الواو حرف قسم، ولفظ الجلالة مجرور بها، والجملة القسمية لا محل لها."
  - "«مَا مَعْشَرٌ ... بِأَكْيَاسِ» جواب القسم. «ما» نافية حجازية، و«مَعْشَرٌ» اسمها، و«بِأَكْيَاسِ» خبرها، والباء حرف جر زائد للتوكيد."
  - "«لَامُوا امْرَأً جُنُبًا» جملة في موضع رفع صفة لـ«مَعْشَرٌ»، و«جُنُبًا» صفة لـ«امْرَأً»."
  - "«مِنْ آلِ لَأْيِ بْنِ شَمَّاسٍ» متعلق بمحذوف تقديره: لاموه في مدح قوم من آل لَأْي، كما يشرحه ابن السِّكِّيت «لاموه فى مدح هؤلاء» [@diwan-hutayah، ص284]."
morphology:
  - "«جُنُبٌ» على وزن فُعُل، يستوي فيه الواحد والجمع، والجمع أيضًا «جُنّاب وأجناب» كما في شرح ابن السِّكِّيت [@diwan-hutayah، ص284]."
  - "«أَكْيَاسٌ» جمع تكسير لـ«كَيِّس»، على وزن أفعال."
  - "«امْرَأً» من الأسماء التي أولها همزة وصل، ويتبع حرفُ الراء فيه حركةَ الإعراب."
rhetoric:
  thesis: "يبدأ الهاجي بنفي العقل عن خصومه، ولا يسمّيهم. فالبيت تعريض بالزِّبْرِقان وقومه، وهو يسمّي نفسه «امرأً جنبًا» ليذكّر بحق الغريب على من نزل بهم."
  devices:
    - title: "القسم والتوكيد"
      text: "في «وَاللهِ» قسم، وفي الباء الزائدة في «بِأَكْيَاسِ» توكيد ثانٍ للنفي. فالبيت يقطع بحكمه من أول كلمة."
    - title: "التعريض"
      text: "في «مَا مَعْشَرٌ ... بِأَكْيَاسِ» لم يقل إنهم حمقى، بل نفى عنهم الكياسة، ولم يسمّهم. وهذا ما يقول فيه ابن رَشِيق: «وأنا أرى أن التعريض أهجى من التصريح» [@ibn-rashiq، ج2 ص172]."
    - title: "الحديث عن النفس بلفظ الغائب"
      text: "في «امْرَأً جُنُبًا» يتحدث عن نفسه كأنه رجل آخر. فيصير لومهم لومًا لغريب لا حيلة له، ويصير الغريب قضية عامة لا شكوى شخصية."
  connection: "ثم ينقل اللوم من نفسه إلى بَغِيض: «مَا كَانَ ذَنْبُ بَغِيضٍ لَا أَبَا لَكُمُ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "وَلْلَاهِ مَا / مَعْشَرُنْ / لَامُمْرَأَنْ / جُنُبَا = مستفعلن / فاعلن / مستفعلن / فعِلن — مِنْ آلِ لَأْ / يِبْنِ شَمْ / مَاسِنْ بِأَكْ / يَاسِي = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "وزن البسيط: مستفعلن فاعلن مستفعلن فاعلن، في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]. والضرب في هذه القصيدة كلها مقطوع «فعْلن»، والقطع: «حذف آخر الوتد المجموع وتسكين ما قبله» [@atiq، ص48]. وتسقط همزة الوصل في «امْرَأً» فتتصل الميم بما قبلها."
