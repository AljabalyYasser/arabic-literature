    status: "في «معاهد التنصيص» كما ينقل المحقق"
    note: "[@diwan-hutayah، ص289]. وهي قريبة من المثال الذي صنعه عبد القاهر ليبيّن أن تبديل الألفاظ لا يصنع شعرًا جديدًا [@dalail، ص471]."
