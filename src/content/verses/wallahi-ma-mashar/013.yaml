first: "دَعِ الْمَكَارِمَ لَا تَرْحَلْ لِبُغْيَتِهَا"
second: "وَاقْعُدْ فَإِنَّكَ أَنْتَ الطَّاعِمُ الْكَاسِي"
meaning: "اترك المكارم لأهلها، ولا تتعب في السعي إليها، واقعد في بيتك، فما أنت إلا رجل يأكل ويلبس. قال ابن السِّكِّيت: «أى أنك ترضى بأن تشبع وتلبس» [@diwan-hutayah، ص290]. فالبيت يسلب الزِّبْرِقان كل فضيلة، ولا يترك له إلا حاجتي البدن: الطعام والكسوة."
vocabulary:
  - term: "الْمَكَارِمَ"
    text: "خصال الكرم والشرف، جمع مَكْرُمة."
  - term: "بُغْيَتِهَا"
    text: "طلبها."
  - term: "الطَّاعِمُ"
    text: "صاحب الطعام الشبعان. في «لسان العرب»: «وَرَجُلٌ طاعِمٌ: حَسَنُ الْحَالِ فِي المَطْعمِ»، واستشهد بالبيت [@lisan، ج12 ص364]."
  - term: "الْكَاسِي"
    text: "المكتسي، صاحب الكسوة. في «لسان العرب» بعد البيت: «أَي المُكْتَسي. وَقَالَ الْفَرَّاءُ: يَعْنِي المَكْسُوَّ، كَقَوْلِكَ مَاءٌ دافِقٌ وعيشةٌ راضِيةٌ» [@lisan، ج15 ص224]."
context: "أشهر أبيات القصيدة، وبه احتكم الزِّبْرِقان إلى عمر. يقول ابن سَلّام إن الزِّبْرِقان استعدى عمر، فسأله: ما قال لك؟ «فَقَالَ قَالَ لى» هذا البيت [@ibn-sallam، ج1 ص116]. ويروي ابن قُتَيْبة أن الزِّبْرِقان «أنشده آخر الأبيات»، يعني هذا البيت، فقال عمر: «ما أعلمه هجاك، أما ترضى أن تكون طاعما كاسيا؟!»، فقال الزِّبْرِقان: «إنّه لا يكون فى الهجاء أشدّ من هذا» [@ibn-qutayba، ج1 ص316]. ثم سأل عمر حسّان بن ثابت، فقال فيما يرويه ابن السِّكِّيت في شرح البيت: «يا أمير المؤمنين ما هجاه ولكن سلح عليه!» [@diwan-hutayah، ص290]."
syntax:
  - "«دَعِ الْمَكَارِمَ» فعل أمر مبني على السكون، حُرّك بالكسر لالتقاء الساكنين، و«الْمَكَارِمَ» مفعول به."
  - "«لَا تَرْحَلْ لِبُغْيَتِهَا» «لا» ناهية، والفعل مجزوم بها. والجملة كما يقول عبد القاهر الجُرْجانيّ «جملةً أكَّدتْ» الجملة قبلها [@dalail، ص487]: النهي عن الرحيل في طلب المكارم توكيد للأمر بتركها."
  - "«وَاقْعُدْ» معطوف على ما قبله، وهو عند عبد القاهر «معطوفاً بالواو على مجموعِ ما مضى» [@dalail، ص488]."
  - "«فَإِنَّكَ أَنْتَ الطَّاعِمُ الْكَاسِي» الفاء للتعليل، و«أَنْتَ» ضمير فصل يفيد القصر، و«الطَّاعِمُ» خبر «إنّ»، و«الْكَاسِي» خبر ثانٍ. وهذه الجملة عند عبد القاهر «معطوفة بالفاء على» جملة «اقعد» [@dalail، ص488]."
morphology:
  - "«الْمَكَارِمُ» جمع «مَكْرُمة» على وزن مفاعل."
  - "«بُغْيَةٌ» على وزن فُعْلة، من «بَغَى يَبْغِي» بمعنى طلب."
  - "«الطَّاعِمُ» اسم فاعل من «طَعِمَ يَطْعَمُ» إذا أكل، وهو على النسب عند سِيبَوَيْه كما ينقل «لسان العرب»: «وَرَجُلٌ طاعِمٌ وطَعِمٌ عَلَى النَّسَبِ؛ عَنْ سِيبَوَيْهِ» [@lisan، ج12 ص364]، أي ذو طعام."
  - "«الْكَاسِي» اسم فاعل من «كَسِيَ يَكْسَى» إذا لبس، ويقول الفرّاء إنه بمعنى المفعول «المكسوّ» كما في «ماء دافق» أي مدفوق [@lisan، ج15 ص224]. فالكلمة تحتمل الفاعل والمفعول، وفي الحالين لا فضل لصاحبها إلا أنه لابس."
rhetoric:
  thesis: "هجاء بلا شتم: لا فحش فيه ولا عيب ظاهر، بل أمر بالقعود ووصف بالأكل واللبس. ولذلك قرأه عمر مدحًا، وقرأه الزِّبْرِقان أشد الهجاء. فالبيت يسلب الرجل المكارم ويترك له ما يشترك فيه مع الناس جميعًا."
  devices:
    - title: "التهكّم"
      text: "في «دَعِ الْمَكَارِمَ ... وَاقْعُدْ» يأمره أمر الناصح المشفق، والمعنى سخرية: لست من أهل المكارم فلا تتعب نفسك. ويرى ابن رَشِيق أن «التعريض أهجى من التصريح» [@ibn-rashiq، ج2 ص172]."
    - title: "القصر بضمير الفصل"
      text: "في «أَنْتَ الطَّاعِمُ الْكَاسِي» جاء الخبر معرفة بعد ضمير الفصل، فصار المعنى: لا صفة لك إلا هذه. ولو قال: فإنك طاعم كاسٍ، لكان وصفًا عاديًا؛ لكن «أنت» والتعريف حصرا الرجل في بطنه وثوبه."
    - title: "النظم"
      text: "يقف عبد القاهر الجُرْجانيّ عند هذا البيت ليقول إن الشعر في النظم لا في الألفاظ المفردة: لو وضع أحد مكان كل لفظة لفظة في معناها، فقال «ذَرِ المفاخرَ لا تَذْهَبْ لِمَطْلَبِها ... واجْلِسْ فإنكَ أنتَ الآكِلُ اللابسْ»، لم يأتِ بكلام ثانٍ، «بل لا يكونُ قد قالَ من عندِ نفْسِه شيئاً البتةَ» [@dalail، ص487–488]. ويسمّي هذا الصنيع في موضع آخر «سلخًا» [@dalail، ص471]، أي سرقة مكشوفة."
    - title: "المعنى السابق"
      text: "في «فَإِنَّكَ أَنْتَ الطَّاعِمُ» ينقل البَغْداديّ أن الأعشى سبق الحُطَيْئة إلى المعنى بقوله: «فدعنا وقوماً إِن هم عمدوا لنا ... أَبَا ثابتٍ واجلس فَإنَّك طاعم» [@khizana، ج6 ص299]."
  connection: "ويمضي في السخرية بأمر ثانٍ: «وَابْعَثْ يَسَارًا إِلَى وُفْرٍ مُذَمَّمَةٍ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "دَعِلْ مَكَا / رِمَلَا / تَرْحَلْ لِبُغْ / يَتِهَا = متفعلن / فعِلن / مستفعلن / فعِلن — وَقْعُدْ فَإِنْ / نَكَأَنْ / تَطْطَاعِمُلْ / كَاسِي = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» الأولى في الصدر و«فاعلن» الأولى في الشطرين [@atiq، ص46]. وتسقط همزة الوصل في «الْمَكَارِمَ» و«اقْعُدْ» و«الطَّاعِمُ» و«الْكَاسِي»."
