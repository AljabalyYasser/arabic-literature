first: "لَقَدْ مَرَيْتُكُمُ لَوْ أَنَّ دِرَّتَكُمْ"
second: "يَوْمًا يَجِيءُ بِهَا مَسْحِي وَإِبْسَاسِي"
meaning: "لقد تلطفت بكم ومدحتكم كما يمسح الحالب ضرع الناقة ويهدّئها لتدرّ اللبن، لو كان مسحي وتسكيني يأتيان يومًا بعطائكم. قال السُّكَّرِيّ: «يقول: قد داريتكم ومدحتكم لتدرّوا علىّ بخير فأبيتم» [@diwan-hutayah، ص285]."
vocabulary:
  - term: "مَرَيْتُكُمُ"
    text: "مسحت ضروعكم لتدرّوا. قال ابن السِّكِّيت: «وأصله من مريت الناقة: وهو أن يمسح ضرعها لتدرّ» [@diwan-hutayah، ص285]."
  - term: "دِرَّتَكُمْ"
    text: "لبنكم. في شرح ابن السِّكِّيت: «والدِّرّة: أراد العطية، والسَّيب والنائل» [@diwan-hutayah، ص285]."
  - term: "إِبْسَاسِي"
    text: "صوتي الذي أسكّن به الناقة عند الحلب. قال ابن السِّكِّيت: «والإبساس: صوت تُسكَّن به الناقة عند الحلب، تقول: بُسّ بُسّ» [@diwan-hutayah، ص285]. وقال المُبَرِّد: «وأما الإبساس فأن تدعو الناقة باسمها، أوتلين لها الطريق إلى الحلب، بقول أو مسح أو ما أشبه ذلك» [@kamil، ج2 ص141]."
context: "يبدأ هنا قصة الرجاء الخائب، وتمتد إلى البيت الثامن. ويرويها بصور من الإبل والبئر والزوجة، لا بالكلام المباشر. وبهذا البيت يبدأ المُبَرِّد روايته للقصيدة [@kamil، ج2 ص140]."
syntax:
  - "«لَقَدْ مَرَيْتُكُمُ» اللام واقعة في جواب قسم محذوف، و«قَدْ» للتحقيق."
  - "«لَوْ» حرف تمنٍّ أو شرط حُذف جوابه، والتقدير: لو أن درتكم تجيء لكان خيرًا. و«أَنَّ دِرَّتَكُمْ ... يَجِيءُ بِهَا مَسْحِي» المصدر المؤول في موضع رفع فاعل لفعل محذوف بعد «لو»، أي: لو ثبت ذلك."
  - "«يَوْمًا» ظرف زمان متعلق بـ«يَجِيءُ»، و«مَسْحِي» فاعل «يَجِيءُ»، و«إِبْسَاسِي» معطوف عليه."
morphology:
  - "«مَرَيْتُ» من «مَرَى يَمْرِي» الناقصة اليائية، مثل «رَمَى يَرْمِي»."
  - "«دِرَّةٌ» اسم من «دَرَّ يَدِرُّ» المضعّف، على وزن فِعْلة."
  - "«إِبْسَاسٌ» مصدر «أَبَسَّ» على وزن إفعال، من الصوت «بُسّ»."
rhetoric:
  thesis: "صورة واحدة ممتدة على البيت كله: الشاعر حالب يمسح ضرع ناقة ويهدّئها بصوته، والناقة لا تدرّ. فالمدح عنده تلطّف لاستخراج العطاء، وقوم الزِّبْرِقان ناقة عسيرة لا تعطي."
  devices:
    - title: "التمثيل"
      text: "في «مَرَيْتُكُمُ» و«دِرَّتَكُمْ» و«مَسْحِي وَإِبْسَاسِي» جعل مدحه للقوم مسح الحالب للضرع، وعطاءهم اللبن. قال السُّكَّرِيّ: «هذا مَثَلٌ ضرب به» [@diwan-hutayah، ص285]. والشبه هنا لا يُدرك بالعين بل بالتأمل، وهو الضرب الثاني عند عبد القاهر الجُرْجانيّ: «أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]، فهو تمثيل لا تشبيه ظاهر."
    - title: "التمني الخائب"
      text: "في «لَوْ أَنَّ دِرَّتَكُمْ يَوْمًا يَجِيءُ بِهَا» تفيد «لو» أن الشيء لم يقع. و«يَوْمًا» تقلّل المطلوب: لم يكن يطلب دوام العطاء، بل يومًا واحدًا."
  connection: "ويمضي في المعنى نفسه بصورة ثانية من البئر: «وَقَدْ مَدَحْتُكُمُ عَمْدًا لِأُرْشِدَكُمْ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "لَقَدْ مَرَيْ / تُكُمُو / لَوْ أَنْنَ دِرْ / رَتَكُمْ = متفعلن / فعِلن / مستفعلن / فعِلن — يَوْمَنْ يَجِي / ءُبِهَا / مَسْحِي وَإِبْ / سَاسِي = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» الأولى في الصدر و«فاعلن» الأولى في الشطرين، والخبن «حذف الثاني الساكن» [@atiq، ص46]. وأُشبعت ضمة الميم في «مَرَيْتُكُمُ»."
