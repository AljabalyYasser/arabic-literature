first: "مَا كَانَ ذَنْبُ بَغِيضٍ أَنْ رَأَى رَجُلًا"
second: "ذَا فَاقَةٍ عَاشَ فِي مُسْتَوْعِرٍ شَاسِ"
meaning: "ما ذنب بَغِيض في أنه رأى رجلًا فقيرًا يعيش في أرض وعرة غليظة، فأكرمه؟ قال ابن السِّكِّيت: «ذا فاقة: يعنى الحطيئة نفسه» [@diwan-hutayah، ص288]."
vocabulary:
  - term: "فَاقَةٍ"
    text: "فقر وحاجة."
  - term: "مُسْتَوْعِرٍ"
    text: "مكان وعر صعب؛ في شرح ابن السِّكِّيت: «مستوعر: مكان وعر» [@diwan-hutayah، ص288]."
  - term: "شَاسِ"
    text: "غليظ مرتفع، وأصله «شأس» خُففت همزته. «والشازُ والشاسُ: المكان المرتفع الغليظ» [@diwan-hutayah، ص288]."
context: "يعود إلى سؤال البيت الثاني بلفظه، فيفتح القسم الثاني من الحجة: صورة الجار المهان عند الزِّبْرِقان. وبهذا البيت يبدأ ابن قُتَيْبة روايته، ويرويه «ذا حاجة» [@ibn-qutayba، ج1 ص315]. ويقول المحقق: «هذا البيت لم يذكر إلا فى ع، قت» [@diwan-hutayah، ص288]، أي في رواية ابن السِّكِّيت وفي «الشعر والشعراء»."
syntax:
  - "«مَا كَانَ ذَنْبُ بَغِيضٍ» كما في البيت الثاني."
  - "«أَنْ رَأَى رَجُلًا» المصدر المؤول في موضع نصب خبر «كَانَ»، أي: ما كان ذنبه رؤيته رجلًا."
  - "«ذَا فَاقَةٍ» صفة لـ«رَجُلًا» منصوبة بالألف، و«عَاشَ» جملة في موضع نصب صفة ثانية."
  - "ويتصل البيت بما بعده، فـ«جَارًا» في البيت العاشر صفة أو بدل من «رَجُلًا»."
morphology:
  - "«مُسْتَوْعِرٌ» اسم فاعل من «اسْتَوْعَرَ» على وزن استفعل، بمعنى صار وعرًا."
  - "«فَاقَةٌ» اسم على وزن فَعْلة، وألفه منقلبة عن واو."
rhetoric:
  thesis: "يكرر السؤال ليجعله لازمة: كل مرة يسأل «ما ذنب بَغِيض؟» يزداد الجواب وضوحًا، وتزداد التهمة على الزِّبْرِقان ثقلًا."
  devices:
    - title: "التكرار"
      text: "في «مَا كَانَ ذَنْبُ بَغِيضٍ» أعاد صدر البيت الثاني بلفظه، وسيعيده بصيغة المتكلم في البيت 16: «مَا كَانَ ذَنْبِيَ». فالقصيدة مبنية على هذا السؤال، يتردد ثلاث مرات."
    - title: "الحديث عن النفس بلفظ الغائب"
      text: "في «رَجُلًا ذَا فَاقَةٍ» يصف نفسه كأنه غريب يراه بَغِيض، كما فعل في «امْرَأً جُنُبًا» في المطلع. «ذا فاقة: يعنى الحطيئة نفسه» كما يقول ابن السِّكِّيت [@diwan-hutayah، ص288]."
  connection: "ويتم الصورة في البيت التالي: «جَارًا لِقَوْمٍ أَطَالُوا هُونَ مَنْزِلِهِ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "مَا كَانَ ذَنْ / بُبَغِي / ضِنْ أَنْ رَأَى / رَجُلَا = مستفعلن / فعِلن / مستفعلن / فعِلن — ذَا فَاقَتِنْ / عَاشَ فِي / مُسْتَوْعِرِنْ / شَاسِي = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخبن «فاعلن» الأولى في الصدر [@atiq، ص46]."
