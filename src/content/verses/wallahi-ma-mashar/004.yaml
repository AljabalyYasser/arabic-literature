first: "وَقَدْ مَدَحْتُكُمُ عَمْدًا لِأُرْشِدَكُمْ"
second: "كَيْمَا يَكُونَ لَكُمْ مَتْحِي وَإِمْرَاسِي"
meaning: "ومدحتكم قاصدًا لأدلّكم على الخير، ليكون لكم جهدي كله، كما يجتهد المستقي في جذب الدلو وفي ردّ الحبل إلى البكرة إذا علق. قال السُّكَّرِيّ: «هذا مثل ضربه»، ثم قال: «يريد: مدحتكم ليكون مَدْحى خالصاً لكم دون غيركم ومودّتى فأبيتم» [@diwan-hutayah، ص286]."
vocabulary:
  - term: "عَمْدًا"
    text: "قصدًا، لا اتفاقًا."
  - term: "مَتْحِي"
    text: "جذبي الدلو من البئر. في «لسان العرب»: «المَتْحُ: جَذْبُكَ رِشاءَ الدَّلْو تَمُدُّ بِيَدٍ وتأْخذ بِيَدٍ عَلَى رأْس الْبِئْرِ» [@lisan، ج2 ص588]."
  - term: "إِمْرَاسِي"
    text: "ردّي الحبل إلى مجراه في البكرة. قال السُّكَّرِيّ: «والإمراس: أن يقع الحبلُ بين البكرة وبين القعو، فتخلّصه حتى تردّه إلى البكرة» [@diwan-hutayah، ص286]."
context: "يتابع قصة الرجاء بصورة ثانية: بعد الحالب والناقة، المستقي والبئر. فالمدح عنده عمل شاق، يعطي فيه الشاعر جهده كما يعطي المستقي جهده عند البئر."
syntax:
  - "«وَقَدْ مَدَحْتُكُمُ» الواو عاطفة على «لَقَدْ مَرَيْتُكُمُ»، و«عَمْدًا» مفعول مطلق في معنى الحال، أي: عامدًا."
  - "«لِأُرْشِدَكُمْ» اللام للتعليل، والفعل منصوب بأن مضمرة بعدها، والمصدر المؤول مجرور متعلق بـ«مَدَحْتُ»."
  - "«كَيْمَا يَكُونَ» «كي» حرف تعليل ونصب، و«ما» زائدة، و«مَتْحِي» اسم «يَكُونَ» مؤخر، و«لَكُمْ» خبرها مقدم."
morphology:
  - "«أُرْشِدَ» مضارع «أَرْشَدَ» الرباعي، على وزن أُفْعِل."
  - "«مَتْحٌ» مصدر «مَتَحَ يَمْتَحُ» على وزن فَعْل."
  - "«إِمْرَاسٌ» مصدر «أَمْرَسَ» على وزن إفعال، من قولهم: «مرِس الحبلُ يمرَس مرَسا: إذا نشب فى ذلك المكان»، أي علق بين البكرة وجانبها [@diwan-hutayah، ص286]."
rhetoric:
  thesis: "يكشف أن مدحه لم يكن سؤالًا ذليلًا بل خدمة: أراد أن يرشدهم إلى المجد، وتعب في ذلك كما يتعب المستقي. فإذا أبوا كان العيب فيهم لا فيه."
  devices:
    - title: "التمثيل"
      text: "في «مَتْحِي وَإِمْرَاسِي» جعل مدحه عمل مستقٍ على بئر: يجذب الدلو ويخلّص الحبل إذا علق. وهو تمثيل كالذي في البيت السابق، و«هذا مثل ضربه» كما يقول السُّكَّرِيّ [@diwan-hutayah، ص286]."
    - title: "الطباق في المقصد"
      text: "في «لِأُرْشِدَكُمْ» يجعل المادح مرشدًا والممدوح محتاجًا إلى الإرشاد. فيقلب المعتاد: الشاعر هو صاحب الفضل لا السائل."
  connection: "ثم صورة ثالثة للانتظار الطويل: «وَقَدْ نَظَرْتُكُمُ إِعْشَاءَ صَادِرَةٍ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "وَقَدْ مَدَحْ / تُكُمُو / عَمْدَنْ لِأُرْ / شِدَكُمْ = متفعلن / فعِلن / مستفعلن / فعِلن — كَيْمَا يَكُو / نَلَكُمْ / مَتْحِي وَإِمْ / رَاسِي = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» الأولى في الصدر و«فاعلن» الأولى في الشطرين [@atiq، ص46]. وأُشبعت ضمة الميم في «مَدَحْتُكُمُ»."
