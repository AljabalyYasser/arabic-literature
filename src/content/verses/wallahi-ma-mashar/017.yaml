first: "قَدْ نَاضَلُوكَ فَسَلُّوا مِنْ كِنَانَتِهِمْ"
second: "مَجْدًا تَلِيدًا وَنَبْلًا غَيْرَ أَنْكَاسِ"
meaning: "لقد باروك في المفاخرة كما يتبارى الرماة، فأخرجوا من جعبتهم مجدًا قديمًا موروثًا، وسهامًا جيدة لا عيب فيها، فغلبوك. قال ابن السِّكِّيت: «مجداً تليدا: أى قديما، أى فاخروه فرجحوا عليه بآبائهم وأجدادهم» [@diwan-hutayah، ص293]."
vocabulary:
  - term: "نَاضَلُوكَ"
    text: "باروك في الرمي بالسهام، والمراد: فاخروك."
  - term: "كِنَانَتِهِمْ"
    text: "جعبة سهامهم؛ وفي الشرح: «والكِنانة للنبل بمنزلة الجعبة للنشاب» [@diwan-hutayah، ص293]."
  - term: "تَلِيدًا"
    text: "قديمًا موروثًا؛ «مجداً تليدا: أى قديما» [@diwan-hutayah، ص293]."
  - term: "أَنْكَاسِ"
    text: "جمع نِكْس، وهو السهم الضعيف الفاسد. قال الأَصْمَعِيّ: «النِّكْسُ: النصلُ يُقلب فيُجعل أسفلُه أعلاه إذا انكسر سِنْخُه» [@diwan-hutayah، ص293]. وفي الشرح أن السهم «إذا ارتدع أو نالته آفة نُكِس فى الكنانة ليُعرف من غيره» [@diwan-hutayah، ص292]."
context: "خاتمة القصيدة: فخر بآل لَأْي على الزِّبْرِقان، ينتهي بالانتصار لا بالشكوى. والخطاب فيه للزبرقان وحده، كما في البيتين 13 و14."
syntax:
  - "«قَدْ نَاضَلُوكَ» «قد» للتحقيق، والواو فاعل، والكاف مفعول به."
  - "«فَسَلُّوا» الفاء عاطفة، و«مِنْ كِنَانَتِهِمْ» متعلق بـ«سَلُّوا»، و«مَجْدًا» مفعول به، و«تَلِيدًا» صفته."
  - "«وَنَبْلًا» معطوف على «مَجْدًا»، و«غَيْرَ» صفة لـ«نَبْلًا»، و«أَنْكَاسِ» مضاف إليه."
morphology:
  - "«نَاضَلَ» على وزن فاعَلَ للمشاركة: رمى ورُمي."
  - "«تَلِيدٌ» صفة على وزن فَعِيل، من «تَلَدَ» إذا قدم."
  - "«أَنْكَاسٌ» جمع «نِكْس» على وزن أفعال."
rhetoric:
  thesis: "تنتهي القصيدة بمباراة رماية: الطرفان يسحبان سهامهما، وسهام آل لَأْي أجداد وماضٍ مجيد، فلا تنكسر. فالحرب الكلامية التي بدأت باللوم تنتهي بنصر صريح."
  devices:
    - title: "الاستعارة التمثيلية"
      text: "في «نَاضَلُوكَ فَسَلُّوا مِنْ كِنَانَتِهِمْ» صوّر المفاخرة بين القبيلتين مناضلة بالسهام، والمجد سهامًا في الكنانة. وفي الشرح عن بعضهم أن المجد التليد «النواصى، وكانت العرب إذا أنعمت على الرجل الشريف يأسرونه جزّوا ناصيته وأطلقوه، فتكون الناصية عند الرجل يفخر بها» [@diwan-hutayah، ص293]، فتكون الكنانة مملوءة بنواصي الأسرى الذين أطلقهم آل لَأْي."
    - title: "النفي بالصفة"
      text: "في «نَبْلًا غَيْرَ أَنْكَاسِ» لم يقل «نبلًا جيدة»، بل نفى عنها العيب الذي يكون في السهام. فيلمّح إلى أن نبل خصومهم أنكاس."
  connection: "وبهذا البيت تنتهي القصيدة على رواية ابن السِّكِّيت."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "قَدْ نَاضَلُو / كَفَسَلْ / لُو مِنْ كِنَا / نَتِهِمْ = مستفعلن / فعِلن / مستفعلن / فعِلن — مَجْدَنْ تَلِي / دَنْ وَنَبْ / لَنْ غَيْرَ أَنْ / كَاسِي = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخبن «فاعلن» الأولى في الصدر [@atiq، ص46]."
