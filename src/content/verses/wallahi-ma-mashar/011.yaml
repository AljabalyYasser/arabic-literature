first: "مَلُّوا قِرَاهُ وَهَرَّتْهُ كِلَابُهُمُ"
second: "وَجَرَّحُوهُ بِأَنْيَابٍ وَأَضْرَاسِ"
meaning: "ضجروا من إطعامه، ونبحته كلابهم، ونهشوه بألسنتهم كأنهم يعضّونه بالأنياب والأضراس. قال ابن السِّكِّيت: «هرّته كلابهم: مَثَلٌ: أى ضجروا به. وجرّحوه: أى أساءوا إليه وآذوه». وقال غيره: «أكلوا لحمه بالوقيعة» [@diwan-hutayah، ص289]، أي اغتابوه وعابوه."
vocabulary:
  - term: "قِرَاهُ"
    text: "طعام الضيف."
  - term: "هَرَّتْهُ"
    text: "كرهته ونبحت في وجهه. وفي شرح ابن السِّكِّيت أنها «مَثَلٌ: أى ضجروا به» [@diwan-hutayah، ص289]."
  - term: "جَرَّحُوهُ"
    text: "آذوه وأساؤوا إليه، «أى أساءوا إليه وآذوه» [@diwan-hutayah، ص289]."
context: "تفصيل الهوان الذي ذكره في البيت السابق، في ثلاث صور متصاعدة: الملل، ثم نباح الكلاب، ثم العضّ. وهو آخر الأبيات الثلاثة التي يقول الشرح إنها «من رواية خالد ولم يروها أبو عمرو» [@diwan-hutayah، ص289]."
syntax:
  - "«مَلُّوا قِرَاهُ» جملة مستأنفة تفسّر «أَطَالُوا هُونَ مَنْزِلِهِ»، و«قِرَاهُ» مفعول به منصوب بفتحة مقدرة."
  - "«وَهَرَّتْهُ كِلَابُهُمُ» معطوفة، و«كِلَابُ» فاعل «هَرَّ»، والهاء مفعول به."
  - "«بِأَنْيَابٍ وَأَضْرَاسِ» متعلق بـ«جَرَّحُوهُ»."
morphology:
  - "«مَلُّوا» من «مَلَّ يَمَلُّ» المضعّف."
  - "«جَرَّحَ» على وزن فَعَّلَ للتكثير: جرحوه مرة بعد مرة."
  - "«أَنْيَابٌ» جمع «ناب» على وزن أفعال، و«أَضْرَاسٌ» جمع «ضِرْس» كذلك."
rhetoric:
  thesis: "ثلاث درجات من الأذى في بيت واحد: ملل البيت، ثم عداء كلابه، ثم عضّ أهله. فالجار عند الزِّبْرِقان فريسة."
  devices:
    - title: "الكناية"
      text: "في «وَهَرَّتْهُ كِلَابُهُمُ» لم يقل إنهم كرهوه، بل قال إن كلابهم نبحته. والكلاب تتبع مزاج أهلها، فإذا كره أهل البيت ضيفًا نبحته كلابهم. وهذا عكس صورة الكرم المشهورة، فقد مدح حسّان آل جَفْنة بقوله «يغشون حَتَّى مَا تهر كلابهم» [@ibn-sallam، ج1 ص218]، أي كثر ضيوفهم حتى ألفتهم الكلاب فلا تنبحهم."
    - title: "الاستعارة"
      text: "في «جَرَّحُوهُ بِأَنْيَابٍ وَأَضْرَاسِ» جعلهم سباعًا تعضّ، والمراد الغيبة والأذى. «قال: أكلوا لحمه بالوقيعة» [@diwan-hutayah، ص289]. والاستعارة عند عبد القاهر الجُرْجانيّ أن تجيء «إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
  connection: "ثم يلتفت إلى امرأته ويأمرها بالرحيل: «سِيرِي أُمَامَ أُولَاكِ الْأَكْثَرُونَ حَصًى»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "مَلْلُو قِرَا / هُو وَهَرْ / رَتْهُو كِلَا / بُهُمُو = مستفعلن / فاعلن / مستفعلن / فعِلن — وَجَرْرَحُو / هُبِأَنْ / يَابِنْ وَأَضْ / رَاسِي = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» و«فاعلن» الأوليين في العجز [@atiq، ص46]. وأُشبعت ضمة الهاء في «قِرَاهُ» و«هَرَّتْهُ»، وضمة الميم في «كِلَابُهُمُ»."
