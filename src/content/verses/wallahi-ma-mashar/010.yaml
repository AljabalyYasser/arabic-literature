first: "جَارًا لِقَوْمٍ أَطَالُوا هُونَ مَنْزِلِهِ"
second: "وَغَادَرُوهُ مُقِيمًا بَيْنَ أَرْمَاسِ"
meaning: "كان جارًا لقوم أطالوا إهانته في منزله، وتركوه مقيمًا كأنه ميت بين القبور. قال ابن السِّكِّيت: «وغادروه: خلّفوه، أى تركوه كالميّت بين أموات، وإنما ضرب به مثلا، أى كنت بينكم كأنى بين موتى» [@diwan-hutayah، ص289]."
vocabulary:
  - term: "هُونَ"
    text: "الهوان؛ «الهُون: الهوان» [@diwan-hutayah، ص289]."
  - term: "غَادَرُوهُ"
    text: "تركوه خلفهم؛ «وغادروه: خلّفوه» [@diwan-hutayah، ص289]."
  - term: "أَرْمَاسِ"
    text: "القبور؛ «والأرْماس: القبور واحدها رَمْس، وقد رمسته: إذا دفنته» [@diwan-hutayah، ص289]. وقال المُبَرِّد: «والرَّمس: التراب، يقال: رمسَ فلانٌ في قبره» [@kamil، ج2 ص142]."
context: "يتمّ صورة الرجل الذي رآه بَغِيض في البيت السابق: كان جارًا عند الزِّبْرِقان. ومن هنا يتحول الكلام إلى الهجاء الصريح لقوم الزِّبْرِقان، وإن لم يسمّهم."
syntax:
  - "«جَارًا» صفة ثالثة لـ«رَجُلًا» في البيت السابق، أو بدل منه، ولذلك جاء منصوبًا."
  - "«لِقَوْمٍ» متعلق بـ«جَارًا»، و«أَطَالُوا هُونَ مَنْزِلِهِ» جملة في موضع جر صفة لـ«قَوْمٍ»، و«هُونَ» مفعول به."
  - "«مُقِيمًا» حال من الهاء في «غَادَرُوهُ»، و«بَيْنَ أَرْمَاسِ» ظرف متعلق بـ«مُقِيمًا»."
morphology:
  - "«هُونٌ» مصدر «هانَ يهون» على وزن فُعْل، بمعنى الهوان."
  - "«أَرْمَاسٌ» جمع «رَمْس» على وزن أفعال."
  - "«غَادَرَ» على وزن فاعَلَ، بمعنى ترك."
rhetoric:
  thesis: "الجار عند الزِّبْرِقان حيّ في مقبرة. لا يقول إنهم قتلوه، بل إنهم أهملوه حتى صار بينهم كالميت بين الموتى، فلا أحد يسأل عنه."
  devices:
    - title: "التشبيه الضمني"
      text: "في «مُقِيمًا بَيْنَ أَرْمَاسِ» لم يذكر أداة التشبيه، لكن المعنى: كأنه بين قبور. «وإنما ضرب به مثلا، أى كنت بينكم كأنى بين موتى» كما يقول ابن السِّكِّيت [@diwan-hutayah، ص289]. فالبيوت صارت قبورًا، وأهلها صاروا أمواتًا في كرمهم."
    - title: "الإضافة"
      text: "في «هُونَ مَنْزِلِهِ» أضاف الهوان إلى منزله لا إليه، فالإهانة في المكان الذي ينبغي أن يكون مأمنه، وهو بيت الجار."
  connection: "ثم يفصّل الإهانة: «مَلُّوا قِرَاهُ وَهَرَّتْهُ كِلَابُهُمُ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "جَارَنْ لِقَوْ / مِنْ أَطَا / لُو هُونَ مَنْ / زِلِهِي = مستفعلن / فاعلن / مستفعلن / فعِلن — وَغَادَرُو / هُمُقِي / مَنْ بَيْنَ أَرْ / مَاسِي = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» و«فاعلن» الأوليين في العجز [@atiq، ص46]. وأُشبعت كسرة الهاء في «مَنْزِلِهِ»."
variants:
  - reading: "جَارٌ لِقَوْمٍ أَطَالُوا هُونَ مَنْزِلِهِ"
    status: "رواية السُّكَّرِيّ وأبي الفَرَج"
    note: "«وروى جارٌ بالرفع» [@diwan-hutayah، ص289]، وهي في الأغاني [@aghani-dk، ج2 ص185]. والرفع على أنه خبر لمبتدأ محذوف: هو جارٌ."
  - reading: "جَارٍ لِقَوْمٍ أَطَالُوا هُونَ مَنْزِلِهِ"
    status: "رواية المُبَرِّد"
    note: "بالجر [@kamil، ج2 ص140] [@diwan-hutayah، ص289]. والبيت عنده بعد البيت الثاني، فـ«جارٍ» بدل من «بَائِسٍ»."
  - reading: "جَارًا لِقَوْمٍ أَطَالُوا هُونَ مَنْزِلَةٍ"
    status: "رواية السُّكَّرِيّ"
    note: "«هـ: منزلةٍ» [@diwan-hutayah، ص289]."
