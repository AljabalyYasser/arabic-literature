first: "وَقَدْ نَظَرْتُكُمُ إِعْشَاءَ صَادِرَةٍ"
second: "لِلْخِمْسِ طَالَ بِهَا حَوْزِي وَتَنْسَاسِي"
meaning: "وانتظرتكم طويلًا، كما تطول مدة عشاء الإبل التي صدرت عن الماء بعد أن صبرت عنه أربع ليال، وأنا أسوقها رويدًا ثم أشدّ في سوقها. قال ابن السِّكِّيت: «فيقول: انتظرتكم مثل عشاء هذه الإبل» [@diwan-hutayah، ص287]. وقال السُّكَّرِيّ: «فضرب هذا مثلا لإبطائهم بخيرهم» [@diwan-hutayah، ص287]."
vocabulary:
  - term: "نَظَرْتُكُمُ"
    text: "انتظرتكم؛ وفي شرح ابن السِّكِّيت: «نظرتكم: ارتقبتكم» [@diwan-hutayah، ص286]."
  - term: "إِعْشَاءَ"
    text: "أن ترعى الإبل عشاءها؛ وفي الشرح: «والإعشاء: أن تُعشّى بعد شربها إلى هَوِىٍّ من الليل» [@diwan-hutayah، ص287]، أي إلى ساعة متأخرة منه."
  - term: "صَادِرَةٍ"
    text: "إبل راجعة عن الماء بعد أن شربت."
  - term: "الْخِمْسِ"
    text: "أن تصبر الإبل عن الماء أربعة أيام وترد في الخامس. في الشرح: «والخِمس: أن تعفى الإبل أربع ليالٍ لا تشرب وترِد يومَ الخامس» [@diwan-hutayah، ص287]."
  - term: "حَوْزِي"
    text: "سوقي الرفيق؛ «والحَوْز: السَّوق قليلا قليلا» [@diwan-hutayah، ص287]."
  - term: "تَنْسَاسِي"
    text: "سوقي الشديد؛ «والتَّنْساس: تفعال من النَّسّ وهو السَّوق» [@diwan-hutayah، ص287]."
context: "الصورة الثالثة في قصة الرجاء، وهي صورة الوقت: لم يطلب شيئًا ثم انصرف، بل انتظر طويلًا، وصبر عليهم كما يصبر الراعي على إبل لا تشبع من عشائها."
syntax:
  - "«وَقَدْ نَظَرْتُكُمُ» الواو عاطفة، و«نَظَرَ» هنا بمعنى انتظر، يتعدى بنفسه."
  - "«إِعْشَاءَ صَادِرَةٍ» مفعول مطلق مبيّن للنوع، على حذف مضاف، أي: انتظارًا مثل مدة إعشاء صادرة؛ و«صَادِرَةٍ» صفة لموصوف محذوف، أي إبل صادرة."
  - "«لِلْخِمْسِ» متعلق بـ«صَادِرَةٍ»، أي صادرة بعد ورود الخِمس."
  - "«طَالَ بِهَا حَوْزِي» جملة في موضع جر صفة ثانية لـ«صَادِرَةٍ»، و«حَوْزِي» فاعل «طَالَ»."
morphology:
  - "«إِعْشَاءٌ» مصدر «أَعْشَى» الرباعي، والأصل «عَشِيَ يَعْشَى» إذا رعى ليلًا؛ وفي الشرح: «يقال: عَشِى يعشَى إذا تعشّى» [@diwan-hutayah، ص286]."
  - "«تَنْسَاسٌ» على وزن تَفْعال، وهو بناء يدل على الكثرة والمبالغة، كما يقول الشارح «تفعال من النَّسّ» [@diwan-hutayah، ص287]."
  - "«خِمْسٌ» على وزن فِعْل من العدد خمسة."
rhetoric:
  thesis: "الانتظار هنا ليس كلمة بل مشهد يُرى: إبل عطاش شربت بعد خمس، فهي تأكل الليل كله، وراعيها ينتظر. فيعرف السامع طول الانتظار من طول المشهد."
  devices:
    - title: "التمثيل"
      text: "في «إِعْشَاءَ صَادِرَةٍ لِلْخِمْسِ» جعل انتظاره لعطائهم مثل انتظار الراعي إبله الصادرة. وفي شرح السُّكَّرِيّ أن الضيف ينتظر القرى حتى تعود الإبل من مرعاها، «فضرب هذا مثلا لإبطائهم بخيرهم» [@diwan-hutayah، ص287]."
    - title: "الجمع بين الرفق والشدة"
      text: "في «حَوْزِي وَتَنْسَاسِي» جمع السوق الرفيق والسوق الشديد، كأنه جرّب معهم اللين ثم الحزم، كما جمع في البيت الثالث «مَسْحِي وَإِبْسَاسِي» وفي الرابع «مَتْحِي وَإِمْرَاسِي». فالأبيات الثلاثة تنتهي بزوج من أفعاله."
  connection: "وبعد الصور الثلاث يقول ما وجد في نفوسهم: «فَمَا مَلَكْتُ بِأَنْ كَانَتْ نُفُوسُكُمُ كَفَارِكٍ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "وَقَدْ نَظَرْ / تُكُمُو / إِعْشَاءَ صَا / دِرَتِنْ = متفعلن / فعِلن / مستفعلن / فعِلن — لِلْخِمْسِ طَا / لَبِهَا / حَوْزِي وَتَنْ / سَاسِي = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «مستفعلن» الأولى في الصدر و«فاعلن» الأولى في الشطرين [@atiq، ص46]. وأُشبعت ضمة الميم في «نَظَرْتُكُمُ»."
variants:
  - reading: "وَقَدْ نَظَرْتُكُمُ إِينَاءَ صَادِرَةٍ"
    status: "رواية السِّجِسْتانيّ"
    note: "«ويروى: إيناء صادرة: أى إبطاء، يقال: أنَى الأمرُ إذا أخّر» [@diwan-hutayah، ص287]."
  - reading: "لِلْوِرْدِ طَالَ بِهَا حَوْذِي وَتَنْسَاسِي"
    status: "في بعض الروايات"
    note: "يذكر المحقق «للورد» مكان «للخمس»، و«حوذى» مكان «حوزى» عن السِّجِسْتانيّ، و«حَبْسى» عن السُّكَّرِيّ [@diwan-hutayah، ص286]."
