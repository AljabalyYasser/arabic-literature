first: "مَا كَانَ ذَنْبِيَ أَنْ فَلَّتْ مَعَاوِلَكُمْ"
second: "مِنْ آلِ لَأْيٍ صَفَاةٌ أَصْلُهَا رَاسِي"
meaning: "ما ذنبي أنا إذا تكسّرت معاولكم على صخرة من آل لَأْي ثابتة الأصل؟ أي: أردتم أن تنالوا من شرفهم فلم تقدروا، فلا تلوموني على مدحهم. قال ابن السِّكِّيت: «أى أردتموهم بسوء فلم تعمل فيه معاولكم. والرّاسى: الثابت» [@diwan-hutayah، ص292]. وفي الشرح عن أبي عَمْرو: «ما كان ذنبى، فإنى مدحتُ هؤلاء لأنهم أشرف منكم ولهم مجدٌ راسٍ لا تطيقون إزالته» [@diwan-hutayah، ص292]."
vocabulary:
  - term: "فَلَّتْ"
    text: "ثلمت وكسرت حدّها؛ «فلّت: ثلَمت. والفُلول: الثُّلَم، يقال: سيفٌ أفلّ: إذا كان به فلول» [@diwan-hutayah، ص292]."
  - term: "مَعَاوِلَكُمْ"
    text: "جمع مِعْوَل، وهو الفأس العظيمة يُحفر بها ويُكسر الصخر."
  - term: "صَفَاةٌ"
    text: "صخرة ملساء."
  - term: "رَاسِي"
    text: "ثابت؛ «والرّاسى: الثابت» [@diwan-hutayah، ص292]."
context: "يعيد السؤال الذي بُنيت عليه القصيدة، «ما كان ذنب»، للمرة الثالثة، لكن بصيغة المتكلم: لم يعد يدافع عن بَغِيض، بل عن نفسه. ومنه ينتقل إلى الفخر بآل لَأْي في البيت الأخير."
syntax:
  - "«مَا كَانَ ذَنْبِيَ» كما في البيتين الثاني والتاسع، وفُتحت ياء المتكلم في «ذَنْبِيَ» للوزن."
  - "«أَنْ فَلَّتْ» المصدر المؤول في موضع نصب خبر «كَانَ»، و«مَعَاوِلَكُمْ» مفعول به مقدم، و«صَفَاةٌ» فاعل مؤخر."
  - "«مِنْ آلِ لَأْيٍ» متعلق بمحذوف صفة لـ«صَفَاةٌ» تقدمت عليها فصارت حالًا، و«أَصْلُهَا رَاسِي» جملة اسمية في موضع رفع صفة لـ«صَفَاةٌ»."
morphology:
  - "«مَعَاوِلُ» جمع «مِعْوَل» على وزن مفاعل."
  - "«صَفَاةٌ» على وزن فَعَلة، وجمعها صَفًا وصَفَوات."
  - "«رَاسٍ» اسم فاعل من «رَسَا يَرْسُو» إذا ثبت، منقوص أُثبتت ياؤه في القافية."
rhetoric:
  thesis: "صورة الحرب بين القبيلتين في بيت واحد: قوم الزِّبْرِقان يضربون بالمعاول، وآل لَأْي صخرة لا تتزحزح، فتنثلم المعاول. والشاعر بريء: لم يصنع شيئًا، وإنما الصخرة صخرة."
  devices:
    - title: "الاستعارة"
      text: "في «فَلَّتْ مَعَاوِلَكُمْ ... صَفَاةٌ» جعل مجد آل لَأْي صخرة، وكيد قوم الزِّبْرِقان معاول. وفي الشرح: «صارت معاولكم لا تعمل فى صَفاة آل بغيض، أى غلبت صفاتُهم معاولَكم فكلّت» [@diwan-hutayah، ص292]. وهي الاستعارة التي يقول فيها عبد القاهر الجُرْجانيّ إنك تجيء «إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "التكرار"
      text: "في «مَا كَانَ ذَنْبِيَ» ختم سلسلة السؤال: «ذنب بَغِيض» في البيتين 2 و9، ثم «ذنبي» هنا. فيتحول الدفاع عن الكريم إلى دفاع عن الشاعر، والتهمة كلها تبقى على الزِّبْرِقان."
  connection: "ثم يختم القصيدة بصورة حرب ثانية، المناضلة بالسهام: «قَدْ نَاضَلُوكَ فَسَلُّوا مِنْ كِنَانَتِهِمْ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "مَا كَانَ ذَنْ / بِيَأَنْ / فَلْلَتْ مَعَا / وِلَكُمْ = مستفعلن / فعِلن / مستفعلن / فعِلن — مِنْ آلِ لَأْ / يِنْ صَفَا / تُنْ أَصْلُهَا / رَاسِي = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخبن «فاعلن» الأولى في الصدر [@atiq، ص46]."
