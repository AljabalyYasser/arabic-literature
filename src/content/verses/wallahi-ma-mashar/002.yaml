first: "مَا كَانَ ذَنْبُ بَغِيضٍ لَا أَبَا لَكُمُ"
second: "فِي بَائِسٍ جَاءَ يَحْدُو آخِرَ النَّاسِ"
meaning: "أيّ ذنب لبَغِيض في أنه أكرم رجلًا فقيرًا جاء يسوق إبله في آخر الناس؟ وفي شرح ابن السِّكِّيت أن الناس أصابتهم سنة شديدة فرحلوا، «وكان الحطيئة فيمن انحدر مع الناس، فلم يكن به من القوة أن يكون فى أول الناس» [@diwan-hutayah، ص285]. فالبائس الذي جاء في آخرهم هو الحُطَيْئة نفسه."
vocabulary:
  - term: "بَغِيضٍ"
    text: "بَغِيض بن عامر من آل لَأْي بن شَمّاس، الذي أكرم الحُطَيْئة [@ibn-sallam، ج1 ص115]."
  - term: "لَا أَبَا لَكُمُ"
    text: "عبارة تقولها العرب ولا تريد ظاهرها. في شرح ابن السِّكِّيت: «هذه كلمة تستحسنها العرب، فلا أبا لك مدح، ولا أمّ لك ذم» [@diwan-hutayah، ص285]."
  - term: "بَائِسٍ"
    text: "الفقير الذي اشتدت حاجته؛ وفي شرح ابن السِّكِّيت عن ابن الكلبي: «البائس الزمن» [@diwan-hutayah، ص285]."
  - term: "يَحْدُو"
    text: "يسوق؛ وفسّر ابن السِّكِّيت قوله «آخر الناس»: «أى يسوق آخرهم» [@diwan-hutayah، ص285]."
context: "يكرر في هذا البيت حجة المطلع، ولكن من جهة بَغِيض: فإذا كان لائمو الحُطَيْئة على مدح آل لَأْي غير عقلاء، فلائمو بَغِيض على إكرامه أشد خطأ. والبيت أول القصيدة في رواية الأَصْمَعِيّ [@diwan-hutayah، ص284]، وسيعود الشاعر إلى صدره نفسه في البيت التاسع."
syntax:
  - "«مَا» نافية، و«ذَنْبُ» اسم «كَانَ»، وخبرها محذوف يتعلق به «فِي بَائِسٍ»، أي: ما كان ذنبه كائنًا في بائس. والاستفهام قد يُقرأ في «ما» أيضًا: أيّ شيء كان ذنبه؟"
  - "«لَا أَبَا لَكُمُ» جملة اعتراضية. «لا» نافية للجنس، و«أَبَا» اسمها منصوب بالألف على لغة من يعاملها معاملة المضاف، واللام في «لَكُمُ» زائدة للتوكيد عند كثير من النحاة."
  - "«جَاءَ يَحْدُو» جملة «جَاءَ» صفة لـ«بَائِسٍ»، وجملة «يَحْدُو» حال من فاعل «جَاءَ»، و«آخِرَ» مفعول به لـ«يَحْدُو»."
morphology:
  - "«بَائِسٌ» اسم فاعل من «بَئِسَ يَبْأَسُ» إذا اشتدت حاجته."
  - "«يَحْدُو» مضارع «حَدَا»، معتل الآخر بالواو؛ والحادي: سائق الإبل الذي يغني لها."
  - "«بَغِيضٌ» على وزن فَعِيل، علم منقول من صفة بمعنى مبغوض."
rhetoric:
  thesis: "سؤال لا ينتظر جوابًا: لا ذنب لبَغِيض إلا أنه فعل ما لم يفعله الزِّبْرِقان. فالبيت يمدح بَغِيضًا ويهجو الزِّبْرِقان معًا، ولا يذكر الزِّبْرِقان."
  devices:
    - title: "الاستفهام الإنكاري"
      text: "في «مَا كَانَ ذَنْبُ بَغِيضٍ» يسأل وهو يعرف الجواب: لا ذنب. والاستفهام هنا ينفي ويحتج معًا، فيجعل السامع يجيب بنفسه."
    - title: "العبارة التي لا يُراد ظاهرها"
      text: "«لَا أَبَا لَكُمُ» ظاهرها شتم: لا أب لكم. لكن ابن السِّكِّيت يقول إن العرب تستحسنها، و«لا أبا لك مدح» [@diwan-hutayah، ص285]. فهي هنا صيحة غضب وتنبيه، لا سبّ."
    - title: "الصورة"
      text: "في «يَحْدُو آخِرَ النَّاسِ» صورة رجل يتأخر عن القوم الراحلين في سنة جدب، لأنه أضعفهم. وبها يجعل نفسه أحق الناس بالرحمة، والزِّبْرِقان أبعدهم عنها."
  connection: "ثم يروي ما صنع مع قوم الزِّبْرِقان قبل أن يتحوّل: «لَقَدْ مَرَيْتُكُمُ لَوْ أَنَّ دِرَّتَكُمْ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "مَا كَانَ ذَنْ / بُبَغِي / ضِنْ لَا أَبَا / لَكُمُو = مستفعلن / فعِلن / مستفعلن / فعِلن — فِي بَائِسِنْ / جَاءَ يَحْ / دُو آخِرَنْ / نَاسِي = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخبن «فاعلن» الأولى في الصدر، والخبن «حذف الثاني الساكن» [@atiq، ص46]. وأُشبعت ضمة الميم في «لَكُمُ». والقافية «النَّاسِ» تتكرر في البيت 15، ويسمّي السُّكَّرِيّ ذلك إيطاءً، كما في الروايات."
variants:
  - reading: "مَا كَانَ ذَنْبُ بَغِيضٍ أَنْ رَأَى رَجُلًا ... ذَا فَاقَةٍ عَاشَ فِي مُسْتَوْعِرٍ شَاسِ"
    status: "رواية حمّاد الراوية عند السُّكَّرِيّ، وفي مصدرين آخرين يذكرهما المحقق"
    note: "يرويها البيت كله بلفظ البيت التاسع. ويقول السُّكَّرِيّ إنها رواية حمّاد، وإنها أجود، لئلا تتكرر «الناس» في القافية، «فيكون إيطاء قبيحا» [@diwan-hutayah، ص285]. والإيطاء: تكرار كلمة القافية بمعناها في القصيدة."
