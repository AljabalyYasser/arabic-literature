first: "مَنْ يَفْعَلِ الْخَيْرَ لَا يَعْدَمْ جَوَازِيَهُ"
second: "لَا يَذْهَبُ الْعُرْفُ بَيْنَ اللهِ وَالنَّاسِ"
meaning: "من يصنع المعروف لا يُحرم جزاءه، فالمعروف لا يضيع عند الله ولا عند الناس. وهو هنا مدح لبَغِيض الذي أكرم الحُطَيْئة: سيلقى جزاء صنيعه، وأوله هذا الشعر نفسه."
vocabulary:
  - term: "جَوَازِيَهُ"
    text: "جزاءه. في «لسان العرب» عن ابن جني: «ظَاهِرُ هَذَا أَن تَكُونَ جَوَازِيَه جَمْعُ جازٍ أَي لَا يَعْدَم جَزاءً عَلَيْهِ»، ويجوز أن تكون جمع «جزاء» [@lisan، ج14 ص143]."
  - term: "الْعُرْفُ"
    text: "المعروف؛ في شرح ابن السِّكِّيت: «العرف: المعروف» [@diwan-hutayah، ص291]."
context: "البيت الذي تنتقل به القصيدة من الهجاء إلى الحكمة، ثم إلى الفخر بآل لَأْي في البيتين الأخيرين. وهو أشهر ما في القصيدة بعد البيت 13. قال أبو عَمْرو بن العلاء: «لم تقل العرب بيتًا قطُّ أصدقَ من بيت الحطيئة» وأنشده [@aghani-dk، ج2 ص173]. ولما قيل له: فبيت طَرَفة «ستبدي لك الأيام»؟ فضّل عليه بيت الحُطَيْئة وقال: «وليس بيتٌ مما قالته الشعراء إلا وفيه مَطْعَنٌ إلا قولَ الحطيئة» [@aghani-dk، ج2 ص174]."
syntax:
  - "«مَنْ» اسم شرط جازم مبتدأ، و«يَفْعَلِ» فعل الشرط مجزوم، حُرّك بالكسر لالتقاء الساكنين."
  - "«لَا يَعْدَمْ جَوَازِيَهُ» جواب الشرط مجزوم، و«جَوَازِيَهُ» مفعول به."
  - "«لَا يَذْهَبُ الْعُرْفُ» جملة مستأنفة تعلل ما قبلها، و«لا» نافية والفعل مرفوع، و«بَيْنَ» ظرف متعلق بـ«يَذْهَبُ»."
morphology:
  - "«جَوَازٍ» جمع «جازِيَة» أو «جازٍ» على وزن فواعل، وظهرت الفتحة على الياء في «جَوَازِيَهُ» لأنه منصوب. وفي «لسان العرب»: «والجَازِيَةُ: الجَزاءُ، اسْمٌ لِلْمَصْدَرِ كالعافِية» [@lisan، ج14 ص143]."
  - "«عُرْفٌ» على وزن فُعْل، اسم بمعنى المعروف."
rhetoric:
  thesis: "بيت يخرج من قصته ليصير قاعدة للناس جميعًا. لا يذكر بَغِيضًا ولا الزِّبْرِقان، ومع ذلك يدل على الأول بالمدح وعلى الثاني بالحرمان."
  devices:
    - title: "التذييل والمثل السائر"
      text: "العجز «لَا يَذْهَبُ الْعُرْفُ بَيْنَ اللهِ وَالنَّاسِ» يؤكد الصدر بمعنى عام، ويستقل عنه. قال سَلْم بن قُتَيْبة: «ما أعلم قافيةً تستغنى عن صدرها وتدلّ عليه وإن لم يُنْشَدْ مثلَ قول الحطيئة» [@aghani-dk، ج2 ص174]، وأنشد هذا العجز."
    - title: "الإيجاز"
      text: "في «بَيْنَ اللهِ وَالنَّاسِ» جمع جزاء الدنيا والآخرة في كلمتين: المعروف محفوظ عند الله، ومحفوظ في ذاكرة الناس."
  connection: "ثم يعود إلى قوم الزِّبْرِقان بصيغة المتكلم: «مَا كَانَ ذَنْبِيَ أَنْ فَلَّتْ مَعَاوِلَكُمْ»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "مَنْ يَفْعَلِلْ / خَيْرَ لَا / يَعْدَمْ جَوَا / زِيَهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — لَا يَذْهَبُلْ / عُرْفُ بَيْ / نَلْلَاهِ وَنْ / نَاسِي = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "التفعيلات سالمة إلا العروض المخبونة والضرب المقطوع [@atiq، ص48]. وأُشبعت ضمة الهاء في «جَوَازِيَهُ». وقافيته «النَّاسِ» هي قافية البيت الثاني، وهو ما يسمّيه السُّكَّرِيّ إيطاءً [@diwan-hutayah، ص285]."
