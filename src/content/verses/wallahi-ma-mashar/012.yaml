first: "سِيرِي أُمَامَ أُولَاكِ الْأَكْثَرُونَ حَصًى"
second: "وَالْأَكْرَمُونَ أَبًا مِنْ آلِ شَمَّاسِ"
meaning: "سيري يا أُمامة إلى أولئك، فهم الأكثر عددًا والأكرم آباءً، من آل شَمّاس. يأمر امرأته بالرحيل من جوار الزِّبْرِقان إلى جوار بَغِيض."
vocabulary:
  - term: "أُمَامَ"
    text: "يا أُمامة، امرأة الحُطَيْئة، حُذف آخر الاسم في النداء. ويذكرها ابن سَلّام في خبر آخر: «خرج الحطيئة مَعَ ابْنَته مليكَة وَامْرَأَته أُمَامَة» [@ibn-sallam، ج1 ص114]."
  - term: "أُولَاكِ"
    text: "أولئك، والكاف المكسورة خطاب للمرأة."
  - term: "حَصًى"
    text: "عددًا. في «لسان العرب»: «وَقَوْلُهُمْ: نَحْنُ أَكثر مِنْهُمْ حَصىً أَي عَدَداً» [@lisan، ج14 ص183]."
  - term: "آلِ شَمَّاسِ"
    text: "رهط بَغِيض بن عامر [@ibn-sallam، ج1 ص115]."
context: "البيت الذي يتحول فيه الشاعر من وصف ما جرى إلى الفعل: انتهى الكلام مع قوم الزِّبْرِقان، فلنرحل. وهو الوحيد في القصيدة الذي يخاطب فيه امرأته، فيدخل بيته وأهله في القصة، ويجعل الرحيل قرار أسرة لا قرار شاعر وحده."
syntax:
  - "«سِيرِي» فعل أمر مبني على حذف النون، والياء فاعل."
  - "«أُمَامَ» منادى مرخّم بحرف نداء محذوف، أصله: يا أُمامةُ، حُذفت التاء وبقيت الميم على فتحتها، على لغة من ينتظر المحذوف، وهو مبني على الضم المقدر على التاء المحذوفة."
  - "«أُولَاكِ» مبتدأ، و«الْأَكْثَرُونَ» خبره، و«حَصًى» تمييز منصوب. والجملة تعليل للأمر."
  - "«وَالْأَكْرَمُونَ» معطوف على «الْأَكْثَرُونَ»، و«أَبًا» تمييز، و«مِنْ آلِ شَمَّاسِ» حال أو صفة."
morphology:
  - "«أُولَاكِ» من أسماء الإشارة للجمع، وهي «أُولَى» مع كاف الخطاب، والواو تُكتب ولا تُنطق كما في «أولئك»."
  - "«الْأَكْثَرُونَ» و«الْأَكْرَمُونَ» جمعا مذكر سالمان لاسم التفضيل «أَكْثَر» و«أَكْرَم»."
  - "«حَصًى» اسم جنس جمعي، واحده حَصاة، مقصور."
rhetoric:
  thesis: "بيت رحيل وفخر معًا: يأمر امرأته بالسير، ويعلّل بأن القوم الذين يسير إليهم أكثر وأكرم. فالتفضيل نفسه هجاء للزبرقان، وهو ما يسمّيه يونس «أشد الهجاء»."
  devices:
    - title: "الكناية"
      text: "في «الْأَكْثَرُونَ حَصًى» كناية عن كثرة العدد، لأنهم كانوا يعدّون بالحصى. وعبد القاهر الجُرْجانيّ يعرّف الكناية بأن يذكر المتكلم معنى «هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]."
    - title: "التفضيل"
      text: "في «الْأَكْثَرُونَ» و«الْأَكْرَمُونَ» فاضل بين آل شَمّاس وقوم الزِّبْرِقان دون أن يسمّي هؤلاء. وقد نقل ابن رَشِيق عن يونس بن حبيب: «أشد الهجاء الهجاء بالتفضيل، وهو الإقذاع عندهم» [@ibn-rashiq، ج2 ص170]."
    - title: "الترخيم"
      text: "في «أُمَامَ» حذف آخر الاسم في النداء، وهو نداء الألفة والقرب، كأن الرحيل أمر عائلي يقوله الرجل لامرأته على عجل."
  connection: "ثم يلتفت إلى الزِّبْرِقان نفسه بأشهر أبيات القصيدة: «دَعِ الْمَكَارِمَ لَا تَرْحَلْ لِبُغْيَتِهَا»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ السين المكسورة، تتبعها ياء الإطلاق"
  scansion: "سِيرِي أُمَا / مَأُلَا / كِلْأَكْثَرُو / نَحَصَى = مستفعلن / فعِلن / مستفعلن / فعِلن — وَلْأَكْرَمُو / نَأَبَنْ / مِنْ آلِ شَمْ / مَاسِي = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخبن «فاعلن» الأولى في الشطرين [@atiq، ص46]. والواو في «أُولَاكِ» لا تُنطق، فالكلمة على الوزن «أُلَاكِ»."
variants:
