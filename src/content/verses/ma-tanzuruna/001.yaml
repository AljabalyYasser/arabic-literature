first: مَا تَنْظُرُونَ بِحَقِّ وَرْدَةَ فِيكُمُ
second: صَغُرَ الْبَنُونَ وَرَهْطُ وَرْدَةَ غُيَّبُ
vocabulary:
- term: تَنْظُرُونَ
  text: تنتظرون.
- term: وَرْدَةَ
  text: 'أم الشاعر. قال ابن قُتَيْبة إنه قالها لأخواله «وقد ظلموها حقها» [@ibn-qutayba، ج1 ص185]، وفي موضع آخر: لأعمامه حين أبوا أن يقسموا مال أبيه [@ibn-qutayba، ج1 ص184].'
- term: رَهْطُ
  text: قومها الأدنون.
- term: غُيَّبُ
  text: غائبون.
