first: قَدْ يُورِدُ الظُّلْمُ الْمُبَيَّنُ آجِنًا
second: مِلْحًا يُخَالَطُ بِالذُّعَافِ وَيُقْشَبُ
vocabulary:
- term: آجِنًا
  text: ماءً متغيّر الطعم واللون.
- term: الذُّعَافِ
  text: السم القاتل لساعته.
- term: يُقْشَبُ
  text: يُخلط بالسم؛ «وقشب الطعام يقشبه قشبًا... خلطه بالسم» [@lisan، ج1 ص673].
