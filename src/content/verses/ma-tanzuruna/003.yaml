first: وَالظُّلْمُ فَرَّقَ بَيْنَ حَيَّيْ وَائِلٍ
second: بَكْرٌ تُسَاقِيهَا الْمَنَايَا تَغْلِبُ
vocabulary:
- term: حَيَّيْ وَائِلٍ
  text: بَكْر وتَغْلِب ابني وائِل، وبينهما كانت حرب البسوس.
- term: تُسَاقِيهَا الْمَنَايَا
  text: تسقيها الموت وتُسقى منها، أي يقتل كل من الحيّين الآخر.
