first: أَدُّوا الْحُقُوقَ تَفِرْ لَكُمْ أَعْرَاضُكُمْ
second: إِنَّ الْكَرِيمَ إِذَا يُحَرَّبُ يَغْضَبُ
vocabulary:
- term: تَفِرْ
  text: 'تسلم وتكرم؛ «ووفَر عرضه... وفورًا: كرم ولم يُبتذل» [@lisan، ج5 ص288].'
- term: يُحَرَّبُ
  text: 'يُهاج ويُحرَّش؛ «وحرّبه أغضبه... والتحريب: التحريش» [@lisan، ج1 ص304].'
