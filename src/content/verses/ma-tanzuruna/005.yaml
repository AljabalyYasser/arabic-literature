explained: false
first: وَقِرَافُ مَنْ لَا يَسْتَفِيقُ دَعَارَةً
second: يُعْدِي كَمَا يُعْدِي الصَّحِيحَ الْأَجْرَبُ
vocabulary:
- term: قِرَافُ
  text: '«المقارفة والقراف: المخالطة... ولا تكون المقارفة إلا في الأشياء الدنية» [@lisan، ج9 ص280].'
- term: لَا يَسْتَفِيقُ
  text: لا يصحو ولا يُقلع.
- term: دَعَارَةً
  text: فسقًا وفجورًا.
- term: يُعْدِي
  text: ينقل إليه الداء.
