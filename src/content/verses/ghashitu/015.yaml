explained: false
first: وَأَبْيَضَ كَالْمِخْرَاقِ بَلَّيْتُ حَدَّهُ
second: وَهَبَّتَهُ فِي السَّاقِ وَالْقَصَرَاتِ
vocabulary:
- term: أَبْيَضَ
  text: سيف.
- term: الْمِخْرَاقِ
  text: 'ما «تلعب به الصبيان من الخِرَق المفتولة»، وقيل: السيف، واستُشهد له بهذا البيت [@lisan، ج10 ص76].'
- term: هَبَّتَهُ
  text: «هِزَّتُه ومضاؤه في الضريبة» [@lisan، ج1 ص778].
- term: الْقَصَرَاتِ
  text: أصول الأعناق، واحدتها قَصَرة.
