first: وَعَنْسٍ كَأَلْوَاحِ الْإِرَانِ نَسَأْتُهَا
second: عَلَى لَاحِبٍ كَالْبُرْدِ ذِي الْحِبَرَاتِ
vocabulary:
- term: عَنْسٍ
  text: ناقة صلبة قوية.
- term: الْإِرَانِ
  text: '«تابوت الموتى»، وقال أبو عَمْرو: «تابوت خشب» [@lisan، ج13 ص15].'
- term: نَسَأْتُهَا
  text: زجرتها وسقتها [@lisan، ج1 ص169].
- term: لَاحِبٍ
  text: طريق واضح.
