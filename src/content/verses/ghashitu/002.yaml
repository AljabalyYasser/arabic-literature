explained: false
first: فَغَوْلٍ فَحِلِّيتٍ فَأَكْنَافِ مُنْعِجٍ
second: إِلَى عَاقِلٍ فَالْجُبِّ ذِي الْأَمَرَاتِ
vocabulary:
- term: غَوْلٍ
  text: موضع، ومثله حِلّيت ومُنعِج وعاقل والجُبّ.
- term: أَكْنَافِ
  text: نواحي.
- term: الْأَمَرَاتِ
  text: «الأعلام، واحدتها أَمَرة»، وهي حجارة تُنصب علامات في المفاوز [@lisan، ج4 ص32].
