explained: false
first: فَغَوْلٍ فَحِلِّيتٍ فَنَفْءٍ فَمَنْعِجٍ
second: إِلَى عَاقِلٍ فَالْجُبِّ ذِي الْأَمَرَاتِ
vocabulary:
- term: غَوْلٍ
  text: '«وغول وحليت ونفء ومنعج كلها مواضع. وعاقل: جبل» [@diwan-imru-al-qais، ص78].'
- term: الْأَمَرَاتِ
  text: «الأعلام، واحدتها أَمَرة»، وهي حجارة تُنصب علامات في المفاوز [@lisan، ج4 ص32].
