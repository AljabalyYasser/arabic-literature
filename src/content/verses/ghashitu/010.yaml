first: فَأَوْرَدَهَا مَاءً قَلِيلًا أَنِيسُهُ
second: يُحَاذِرْنَ عَمْرًا صَاحِبَ الْقُتَرَاتِ
vocabulary:
- term: أَنِيسُهُ
  text: من يأنس به ويرده من الناس.
- term: الْقُتَرَاتِ
  text: جمع قُتْرة، وهي «البئر يحتفرها الصائد يكمن فيها» [@lisan، ج5 ص72].
