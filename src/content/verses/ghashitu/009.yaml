first: وَيَأْكُلْنَ بُهْمَى جَعْدَةً حَبَشِيَّةً
second: وَيَشْرَبْنَ بَرْدَ الْمَاءِ فِي السَّبَرَاتِ
vocabulary:
- term: بُهْمَى
  text: نبت ترعاه الدوابّ.
- term: حَبَشِيَّةً
  text: «خضراء تضرب إلى السواد» [@lisan، ج6 ص279].
- term: السَّبَرَاتِ
  text: جمع سَبْرة، وهي الغداة الباردة.
