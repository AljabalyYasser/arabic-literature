first: وَأَمَّا يَوْمُنَا فَنَظَلُّ رَكْبًا
second: وُقُوفًا مَا نَحُلُّ وَمَا نَسِيرُ
vocabulary:
- term: رَكْبًا
  text: ركبانًا على إبلهم.
- term: نَحُلُّ
  text: 'ننزل. والمعنى: «نحن قيام على بابه ننتظر الإذن، فلا هو يأذن فنحل عنده، ولا هو يأمرنا بالرجوع فنسير عنه» [@khizana، ج2 ص418].'
