first: لَنَا يَوْمٌ وَلِلْكِرْوَانِ يَوْمٌ
second: تَطِيرُ الْبَائِسَاتُ وَلَا نَطِيرُ
vocabulary:
- term: لِلْكِرْوَانِ
  text: 'الكِرْوان: قال الأعلم: «جمع كروان، وهو طائر»، وقيل: هو هنا مفرد «بفتح الكاف والراء» [@khizana، ج2 ص417–418].'
- term: الْبَائِسَاتُ
  text: جمع بائسة، من البؤس، وهو الضرّ [@khizana، ج2 ص418]. يعني طيور الكروان.
