first: "فَلَيْتَ لَنَا مَكَانَ الْمَلْكِ عَمْرٍو"
second: "رَغُوثًا حَوْلَ قُبَّتِنَا تَخُورُ"
meaning: "ليت لنا مكان الملك عَمْرو بن هند نعجة مرضعًا تصيح حول قبتنا. أي أن نعجة تدرّ اللبن خير لنا منه."
vocabulary:
  - term: "الْمَلْكِ"
    text: "المَلِك، بإسكان اللام. قال يعقوب في «مَلْكُ النهار» من شعر ذلك الزمان: «ملك النهار لغة رَبِيعة» [@ibn-al-anbari، ص131]؛ أي أن إسكان اللام في «مَلِك» لغة رَبِيعة، وطَرَفَة من رَبِيعة."
  - term: "عَمْرٍو"
    text: "عَمْرو بن هند، ملك الحيرة (554–569م) [@deif، ج1 ص45]."
  - term: "رَغُوثًا"
    text: "المرضع [@ibn-qutayba، ج1 ص183، حاشية المحقق]: نعجة تُرضع ولدها فيكثر لبنها."
  - term: "تَخُورُ"
    text: "تصيح [@diwan-tarafa، ص38، الحاشية]. والخُوار صوت البقر والغنم."
syntax:
  - "«ليت» حرف تمنٍّ ينصب الاسم ويرفع الخبر، و«رغوثًا» اسمها مؤخر، و«لنا» خبرها مقدم."
  - "«مكانَ» ظرف منصوب، و«الملك» مضاف إليه، و«عمرٍو» بدل منه أو عطف بيان."
  - "جملة «تخور» صفة لـ«رغوثًا»، و«حول قبتنا» ظرف متعلق بـ«تخور»."
morphology:
  - "«رَغُوث» على «فَعُول» بمعنى «فاعل»: مُرضِع، ويستوي فيه المذكر والمؤنث."
  - "«قُبّة» على «فُعْلة»، وجمعها «قباب»."
  - "«تخور» مضارع «خار يخور» بمعنى صاح."
rhetoric:
  thesis: "هجاء بالموازنة: الملك الذي يُرجى عطاؤه أقل نفعًا من نعجة تدرّ اللبن حول البيت."
  devices:
    - title: "التمني"
      text: "«فليت» تمنٍّ لما لا يكون. وجرأته أنه يتمنى زوال ملك حيّ ويسمّيه باسمه."
    - title: "السخرية"
      text: "لم يشتم الملك، بل وضع مكانه نعجة. والنعجة المرضع قريبة، كثيرة النفع، تصيح حول البيت؛ والملك بعيد لا يصل إليه أحد. فالصورة وحدها تقول ما لم يقله."
  connection: "ثم يصف النعجة وكثرة لبنها، ويلتفت إلى قابوس."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "فَلَيْتَ لَنَا / مَكَانَلْ مَلْ / كِعَمْرِنْ = مفاعلتن / مفاعلْتن / فعولن — رَغُوثَنْ حَوْ / لَ قُبْبَتِنَا / تَخُورُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر، ويدخل حشوَه العَصْب، وهو تسكين الخامس، فتصير «مفاعلَتن» «مفاعلْتن» [@atiq، ص54]. وقد دخل التفعيلة الثانية من الصدر، والأولى من العَجُز."
context: "البيت الذي قُتل به طَرَفَة. فحين قال عَمْرو بن هند لعبد عَمْرو، صهر طَرَفَة، إن طَرَفَة هجاه، غضب عبد عَمْرو وقال: «قد قال طَرَفَة للملك أقبح من هذا!»، ثم أسمعه هذه الأبيات «وطَرَفَة آمن»، «فسكت عَمْرو بن هند على وقر في نفسه، وكره أن يعجل عليه لمكان قومه» [@ibn-al-anbari، ص123]. والوَقْر: الحقد."
