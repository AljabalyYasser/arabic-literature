first: "لَعَمْرُكَ إِنَّ قَابُوسَ بْنَ هِنْدٍ"
second: "لَيَخْلِطُ مُلْكَهُ نُوكٌ كَثِيرُ"
meaning: "أقسم بحياتك إن قابوس بن هند يخالط ملكَه حمقٌ كثير."
vocabulary:
  - term: "قَابُوسَ بْنَ هِنْدٍ"
    text: "«أخو عَمْرو بن هند، وكان فيه لين، ويسمّى قينة العرس» [@ibn-qutayba، ج1 ص186]. والقينة: المغنية؛ فلقبه يسخر من لينه."
  - term: "نُوكٌ"
    text: "حمق [@diwan-tarafa، ص38، الحاشية]."
syntax:
  - "«لعمرك» مبتدأ خبره محذوف: لعمرك قسمي؛ وجملة «إن قابوس...» جواب القسم."
  - "«قابوس» اسم «إنّ» منصوب، وهو ممنوع من الصرف للعلمية والعجمة، و«ابنَ» صفته."
  - "«ليخلط» اللام لام التوكيد، والجملة خبر «إنّ». و«ملكه» مفعول به مقدم، و«نوكٌ» فاعل مؤخر، و«كثير» صفته."
morphology:
  - "«نُوك» مصدر بمعنى الحمق، ومنه «أنوك» للأحمق."
  - "«هند» في «ابن هند» اسم أمه؛ فعَمْرو وقابوس يُنسبان إلى أمهما هند."
rhetoric:
  thesis: "بعد الملك، الأخ: يقسم أن ملك قابوس مخلوط بالحمق."
  devices:
    - title: "القسم والتوكيد"
      text: "القسم، ثم «إنّ»، ثم اللام في «ليخلط»: ثلاثة مؤكدات لحكم هجاء. فهو لا يتهكم تلميحًا، بل يقسم."
    - title: "تقديم المفعول"
      text: "قدّم «ملكه» على «نوك»، فبدأ بالملك ثم أفسده بالكلمة التالية. فالسامع يسمع الملك أولًا، ثم ما يخلطه."
  connection: "ثم يشكو قسمة الدهر: للطير يوم، ولهما يوم الوقوف بالباب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المضمومة"
  scansion: "لَعَمْرُكَ إِنْ / نَ قَابُوسَبْ / نَ هِنْدِنْ = مفاعلتن / مفاعلْتن / فعولن — لَيَخْلِطُ مُلْ / كَهُو نُوكُنْ / كَثِيرُو = مفاعلتن / مفاعلْتن / فعولن"
  note: "دخل العَصْب، وهو تسكين الخامس، التفعيلة الثانية من الصدر والعَجُز، فصارت «مفاعلْتن» [@atiq، ص54]."
context: "ذكره ابن قُتَيْبة مع البيت الأول مما قاله طَرَفَة فحقد عليه عَمْرو بن هند [@ibn-qutayba، ج1 ص186]. وفي رواية الميداني «ليخلط ملكه نوك كبير» [@maydani، ج1 ص399]."
variants:
