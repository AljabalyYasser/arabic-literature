first: قَسَمْتَ الدَّهْرَ فِي زَمَنٍ رَخِيٍّ
second: كَذَاكَ الْحُكْمُ يَقْصِدُ أَوْ يَجُورُ
vocabulary:
- term: قَسَمْتَ الدَّهْرَ
  text: الخطاب لقابوس في قول المُفَضَّل بن سلمة، أو لعَمْرو بن هند في القول الآخر، يذكر «ما كان من يوم صيده ويوم وقوف الناس ببابه» [@khizana، ج2 ص417].
- term: رَخِيٍّ
  text: سهل ليّن.
- term: يَقْصِدُ
  text: يعدل، من «قصد في الأمر... إذا توسط وطلب الأسدّ ولم يجاوز الحد» [@khizana، ج2 ص417].
- term: يَجُورُ
  text: يظلم.
