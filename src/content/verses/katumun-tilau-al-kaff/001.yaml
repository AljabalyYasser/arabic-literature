first: "كَتُومٌ طِلَاعُ الكَفِّ لَا دُونَ مِلْئِهَا"
second: "وَلَا عَجْسُهَا عَنْ مَوْضِعِ الكَفِّ أَفْضَلَا"
meaning: "هي قوس لا صوت لها إذا جُذب وترها، ولا صدع في عودها، تملأ كف الرامي ملئًا تامًّا: ليست أصغر من ملء الكف، ولا يزيد مقبضها على موضع الكف منها."
vocabulary:
  - term: "كَتُومٌ"
    text: "«والكَتُومُ والكَاتِمُ مِنَ القِسِيِّ: الَّتِي لَا تُرِنُّ إِذَا أُنْبِضَتْ ... وَقِيلَ: هِيَ الَّتِي لَا صَدْعَ فِي نَبْعِها» [@lisan، ج12 ص507]. وتُرِنّ: تصوّت، وأُنبضت: جُذب وترها ثم أُرسل."
  - term: "طِلَاعُ الكَفِّ"
    text: "«أَيْ مِلْءٌ الْكَفِّ» [@lisan، ج12 ص507]."
  - term: "عَجْسُهَا"
    text: "«وعَجْسُ القوسِ ... مَقْبِضُها الَّذِي يَقْبِضُهُ الرَّامِي مِنْهَا ... قَالَ أَبو حَنِيفَةَ: عَجْسُ القَوس أَجلُّ مَوْضِعٍ فِيهَا وأَغلظه» [@lisan، ج6 ص130]."
  - term: "أَفْضَلَا"
    text: "زاد. «وأَفْضَل عَلَيْهِ: زَادَ»، ويستشهد صاحب اللسان بهذا البيت [@lisan، ج11 ص525]."
context: "أول ما يرويه ابن قُتَيْبة من وصف أوس للقوس: «قال أوس يصف قوسا» [@ibn-qutayba، ج1 ص200]. يبدأ بصفة القوس في يد الرامي: لا عيب في عودها، وقدرها على قدر الكف. وفي اللسان أن قوس النبي ﷺ كان اسمها الكتوم، «سُمِّيَتْ بِهِ لانْخِفاضِ صوتِها إِذَا رُمي عَنْهَا» [@lisan، ج12 ص507]."
syntax:
  - "«كَتُومٌ»: خبر لمبتدأ محذوف تقديره «هي»، يعود على القوس التي يصفها. و«طِلَاعُ الكَفِّ» خبر ثانٍ، أو نعت لـ«كتوم»."
  - "«لَا دُونَ مِلْئِهَا»: «لا» نافية، و«دونَ» ظرف متعلق بخبر لمبتدأ محذوف، أي: لا هي دون ملئها. وتكرار «لا» في العطف يجيز دخولها على غير الفعل والنكرة."
  - "«وَلَا عَجْسُهَا عَنْ مَوْضِعِ الكَفِّ أَفْضَلَا»: «عجسُها» مبتدأ، وجملة «أفضلا» خبره، والفعل «أفضلَ» ماضٍ والألف للإطلاق، و«عن موضع الكف» متعلق به. أي: ولا زاد مقبضها على موضع الكف."
morphology:
  - "«كَتُوم» على «فَعُول»، صيغة مبالغة من «كَتَمَ»، يستوي فيها المذكر والمؤنث."
  - "«طِلَاع» على «فِعَال» بمعنى «مِلْء»، أي مقدار ما يملأ."
  - "«عَجْس» على «فَعْل»، وفيه لغات: عَجْس وعِجْس وعُجْس [@lisan، ج6 ص130]."
  - "«أَفْضَلَ» على «أَفْعَلَ»، من الفضل بمعنى الزيادة."
rhetoric:
  thesis: "بيت يقيس القوس بالكف: لا ينقص منها ولا يزيد. وهذا شأن الصانع الخبير الذي يعرف أن القوس الجيدة ما وافقت يد صاحبها تمامًا."
  devices:
    - title: "«كَتُومٌ»: التشخيص"
      text: "الكتمان صفة الإنسان الذي يحفظ السر، فأُعطيت للقوس التي لا يُسمع لها صوت إذا جُذب وترها، كأنها تكتم صوتها. ثم صارت الكلمة اسمًا معروفًا للقوس في اللغة، كما في اللسان. وفي الصفة مدح، لأن القوس التي ترنّ تنبّه الصيد والعدو. وهي قراءتنا."
    - title: "نفي الطرفين: «لَا دُونَ ... وَلَا ... أَفْضَلَا»"
      text: "يحدد قدر القوس بنفي النقص ونفي الزيادة معًا، فيبقى القدر التام وحده. وهو من الاحتراس: أن يأتي المتكلم بما يدفع توهّم خلاف المقصود، فلما قال «طلاع الكف» دفع أن يُظن أنها أصغر أو أكبر. وبين «دون» و«أفضل» تقابل يجعل البيت ميزانًا. وهي قراءتنا."
  connection: "ثم ينتقل من شكلها إلى صوتها حين يجذب الرماة وترها: «نَئِيمًا وَأَزْمَلَا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المفتوحة تتبعها ألف الإطلاق"
  scansion: "كَتُومُنْ / طِلَاعُلْكَفْ / فِلَادُو / نَمِلْئِهَا = فعولن / مفاعيلن / فعولن / مفاعلن — وَلَا عَجْ / سُهَاعَنْمَوْ / ضِعِلْكَفْ / فِأَفْضَلَا = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت على الطويل تامًّا إلا العروض والضرب، فهما مقبوضان «مفاعلن»، لأن «عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]. والقبض: حذف الخامس الساكن."
