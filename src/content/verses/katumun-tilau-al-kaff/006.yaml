first: "كَأَنَّ مَدَبَّ النَّمْلِ يَتَّبِعُ الرُّبَى"
second: "وَمَدْرَجَ ذَرٍّ خَافَ بَرْدًا فَأَسْهَلَا"
meaning: "كأن آثار النمل وهو يدبّ صاعدًا على المرتفعات، وآثار صغار النمل وقد خافت البرد فنزلت إلى السهل، مرسومةٌ على صفحتي هذا السيف. يصف خطوط الفِرِنْد الدقيقة المتعرجة في السيف، ويتم المعنى في البيت التالي: «عَلَى صَفْحَتَيْهِ بَعْدَ حِينِ جِلَائِهِ»."
vocabulary:
  - term: "مَدَبَّ النَّمْلِ"
    text: "موضع دبيبه وأثره. وفي اللسان في صفة السيف: «وحَصِيرُه: فِرِنْدُه الَّذِي تَرَاهُ كَأَنه مَدَبُّ النملِ» [@lisan، ج4 ص196]."
  - term: "الرُّبَى"
    text: "جمع رَبْوة، وهي ما ارتفع من الأرض."
  - term: "مَدْرَجَ ذَرٍّ"
    text: "الذَّرّ: صغار النمل، والمَدْرَج: موضع مشيه وأثره."
  - term: "أَسْهَلَا"
    text: "نزل إلى السهل من الأرض."
context: "أول ما يرويه ابن قُتَيْبة من وصف السيف: «ثم وصف السيف فقال» [@ibn-qutayba، ج1 ص200]، ويعود إليه في آخر الترجمة فيقول: «ويستجاد له قوله فى السيف» [@ibn-qutayba، ج1 ص204]. ويذكره في «عيون الأخبار» مثالًا لتشبيه الشيء بشيئين: «شبّه فرند السيف … بمدرج الذّرّ ومدبّ النمل» [@uyun-al-akhbar، ج2 ص203]."
syntax:
  - "«كَأَنَّ مَدَبَّ النَّمْلِ»: «كأنّ» حرف تشبيه ونصب، و«مدبَّ» اسمها، و«النمل» مضاف إليه. وجملة «يتّبع الربى» حال من النمل."
  - "«وَمَدْرَجَ ذَرٍّ»: معطوف على «مدبَّ» منصوب، وجملة «خاف بردًا» نعت لـ«ذرّ»، و«فأسهلا» معطوفة عليها بالفاء، والألف للإطلاق."
  - "خبر «كأنّ» ليس في هذا البيت، بل في أول البيت التالي: «عَلَى صَفْحَتَيْهِ»، وهو شبه جملة متعلق بخبر محذوف. فالبيت لا يتم إلا بما بعده، وهذا ما يسميه العروضيون التضمين."
morphology:
  - "«مَدَبّ» على «مَفْعَل» من «دَبَّ يَدِبُّ»، مصدر ميمي أو اسم مكان، أي موضع الدبيب."
  - "«مَدْرَج» على «مَفْعَل» من «دَرَجَ يَدْرُجُ»، أي موضع المشي."
  - "«يَتَّبِعُ» مضارع «اتَّبَعَ» على «افْتَعَلَ»، وأصله «اوْتَبَعَ» فقُلبت الواو تاءً وأُدغمت."
  - "«أَسْهَلَ» على «أَفْعَلَ» بمعنى الدخول في المكان: دخل في السهل، كأنجد وأتهم."
rhetoric:
  thesis: "يرى الشاعر في صفحة السيف خريطة صغيرة لحركة النمل: خطوط تصعد وتنحدر، وأخرى تنزل إلى السهل. فالفرند عنده أثر حياة دقيقة، لا نقش جامد."
  devices:
    - title: "تشبيه شيء بشيئين"
      text: "المشبّه واحد هو فرند السيف، والمشبه به اثنان: «مدبّ النمل» و«مدرج ذرّ». ويضعه ابن قُتَيْبة مع قول امرئ القَيْس «كأن قلوب الطير رطبا ويابسا» في باب تشبيه شيئين بشيئين [@uyun-al-akhbar، ج2 ص203]. وعبد القاهر يفرّق في هذا الباب بين التشبيه المركّب، الذي تجتمع أجزاؤه في هيئة واحدة، والتشبيه المتعدد، وهو «تشبيه شيئين بشيئين ضربةً واحدةً، إلاّ أن أحدهما لا يداخل الآخر في الشَّبه» [@asrar، ص192]. وتشبيه أوس من المتعدد في جملته، لأن كلًّا من الصورتين يصلح وحده للفرند، ولكن في كل صورة هيئةً: نمل «يتبع الربى» صاعدًا، وذرّ نزل إلى السهل؛ فكأنه يصف خطوطًا تعلو في صفحة السيف وخطوطًا تنخفض. وهذا التفصيل قراءتنا."
    - title: "«خَافَ بَرْدًا فَأَسْهَلَا»: تعليل الحركة"
      text: "يعطي الذرّ خوفًا وتدبيرًا: خاف البرد فنزل إلى السهل الدافئ. والتعليل يجعل الصورة قصة صغيرة، ويفسّر لماذا تختلف الخطوط في اتجاهها. وهي قراءتنا."
    - title: "التضمين"
      text: "لا يتم البيت إلا بالبيت التالي، لأن خبر «كأنّ» فيه. والتضمين عند الخليل يسمى العظال: «العظال في القوافي: التضمين، حكاه الخليل بن أحمد» [@ibn-rashiq، ج2 ص264]. وهو هنا يحبس السامع على الصورة حتى يعرف في البيت التالي أين هي: على صفحتي السيف."
  connection: "يتم المعنى في البيت التالي: «عَلَى صَفْحَتَيْهِ بَعْدَ حِينِ جِلَائِهِ / كَفَى بِالَّذِي أَبْلَى وَأَنْعَتَ مُنْصُلَا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المفتوحة تتبعها ألف الإطلاق"
  scansion: "كَأَنْنَ / مَدَبْبَنْنَمْ / لِيَتْتَ / بِعُرْرُبَى = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَمَدْرَ / جَذَرْرِنْخَا / فَبَرْدَنْ / فَأَسْهَلَا = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الصدر، و«فعولن» الأولى في العجز، فصارت «فعولُ». والعروض والضرب مقبوضان «مفاعلن» [@atiq، ص29–30]."
