explained: false
first: "كَسَاهُنَّ مِنْ رِيشٍ يَمَانٍ ظَوَاهِرًا"
second: "سُخَامًا لُؤَامًا لَيِّنَ المَسِّ أَطْحَلَا"
vocabulary:
  - term: "كَسَاهُنَّ"
    text: "كسا النابلُ السهامَ؛ يقول ابن قُتَيْبة قبل البيت: «ثم وصف النابل والنبل فقال» [@ibn-qutayba، ج1 ص200]."
  - term: "سُخَامًا لُؤَامًا"
    text: "يقول محقق «الشعر والشعراء»: «السخام من الريش: اللين الحسن. الريش اللؤام: يلائم بعضه بعضا، وهو ما كان بطن القذة منه يلى ظهر الأخرى، وهو أجود ما يكون» [@ibn-qutayba، ج1 ص200، الحاشية]. والقُذّة: الريشة من ريش السهم."
  - term: "أَطْحَلَا"
    text: "«الطُّحْلة لَوْنٌ بَيْنَ الغُبْرة وَالْبَيَاضِ بِسَوَادٍ قَلِيل» [@lisan، ج11 ص399]."
