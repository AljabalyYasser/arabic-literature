explained: false
first: "يَخُرْنَ إِذَا أُنْفِزْنَ فِي سَاقِطِ النَّدَى"
second: "وَإِنْ كَانَ يَوْمًا ذَا أَهَاضِيبَ مُخْضِلَا"
vocabulary:
  - term: "يَخُرْنَ"
    text: "يصوّتن كما يخور البقر والوحش."
  - term: "أُنْفِزْنَ"
    text: "«والتَّنْفِيزُ والإِنْفازُ: إِدارة السَّهْمِ عَلَى الظُّفُر ليُعْرَفَ عَوَجُه مِنْ قِوامِه» [@lisan، ج5 ص419]."
  - term: "أَهَاضِيبَ مُخْضِلَا"
    text: "دفعات من المطر تبلّ ما تصيبه. وفي اللسان في معنى البيتين: «إِذا أُنْفِذَتِ السِّهَامُ خارَتْ خُوارَ هَذِهِ الْوَحْشِ ... وإِن أُنْفِذَتْ فِي يَوْمِ مَطَرٍ مُخْضِلٍ، أَي فَلِهَذِهِ النَّبْلِ فَضْلٌ مِنْ أَجل إِحكام الصَّنْعَةِ وَكَرْمِ الْعِيدَانِ» [@lisan، ج4 ص261]، أي أن الندى والمطر لا يُفسدان صوتها."
