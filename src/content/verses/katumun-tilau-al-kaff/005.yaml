explained: false
first: "خُوَارَ المَطَافِيلِ المُلَمَّعَةِ الشَّوَى"
second: "وَأَطْلَاؤُهَا صَادَفْنَ عِرْنَانَ مُبْقِلَا"
vocabulary:
  - term: "المَطَافِيلِ"
    text: "«الَّتِي تَثْغُو إِلى أَطلائها وَقَدْ أَنشطها المَرْعَى المُخْصِبُ» [@lisan، ج4 ص261]، أي الوحش التي معها أولادها."
  - term: "المُلَمَّعَةِ الشَّوَى"
    text: "التي في قوائمها بقع من لون غير لونها. والشوى: الأطراف."
  - term: "أَطْلَاؤُهَا"
    text: "أولادها، جمع طَلًا."
  - term: "عِرْنَانَ مُبْقِلَا"
    text: "يقول المحقق: «عرنان: واد واسع فى الأرض منخفض يوصف بكثرة الوحش» [@ibn-qutayba، ج1 ص200، الحاشية]. ومُبْقِل: أنبت البقل، أي مخصب."
