explained: false
first: "إِذَا مَا تَعَاطَوْهَا سَمِعْتَ لِصَوْتِهَا"
second: "إِذَا أَنْبَضُوا عَنْهَا نَئِيمًا وَأَزْمَلَا"
vocabulary:
  - term: "تَعَاطَوْهَا"
    text: "تناولوها. يقول المحقق: «تعاطوها: تناولوها» [@ibn-qutayba، ج1 ص200، الحاشية]."
  - term: "أَنْبَضُوا"
    text: "جذبوا وترها ثم أرسلوه ليصوّت. يقول المحقق: «أنبض القوس: جذب وترها لتصوت» [@ibn-qutayba، ج1 ص200، الحاشية]."
  - term: "نَئِيمًا وَأَزْمَلَا"
    text: "قال ابن قُتَيْبة: «النئيم صوت البوم، والأزمل صوت الجنّ» [@ibn-qutayba، ج1 ص200]. وفي اللسان: «والنَّأْمَةُ والنَّئِيمُ: صَوتُ الْقَوْسِ» [@lisan، ج12 ص567]."
