explained: false
first: "عَلَى صَفْحَتَيْهِ بَعْدَ حِينِ جِلَائِهِ"
second: "كَفَى بِالَّذِي أَبْلَى وَأَنْعَتَ مُنْصُلَا"
vocabulary:
  - term: "صَفْحَتَيْهِ"
    text: "وجهي السيف العريضين. وهما خبر «كأنّ» في البيت السابق."
  - term: "جِلَائِهِ"
    text: "صقله."
  - term: "أَبْلَى وَأَنْعَتَ"
    text: "أبلى: أحسن البلاء في الحرب. ويقول المحقق: «أنعت: حسن وجهه حتى ينعت» [@ibn-qutayba، ج1 ص201، الحاشية]."
  - term: "مُنْصُلَا"
    text: "السيف، «بضم الصاد وبفتحها» [@ibn-qutayba، ج1 ص201، الحاشية]."
sources:
  - source: "ibn-qutayba"
    loc: "ج1 ص201"
