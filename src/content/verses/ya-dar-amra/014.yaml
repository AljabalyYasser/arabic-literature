explained: false
first: "فَسَاوَرُوهُ فَأَلْفَوْهُ أَخَا عَلَلٍ"
second: "فِي الحَرْبِ يَخْتَتِلُ الرِّئْبَالَ وَالسَّبُعَا"
vocabulary:
  - term: "سَاوَرُوهُ"
    text: "واثبوه. وفي نسختين من الأغاني «فثاوروه»، ومعناه عند المحققين «واثبوه» [@aghani-dk، ج22 ص358، الحاشية]."
  - term: "أَخَا عَلَلٍ"
    text: "العَلَل: الشرب بعد الشرب، أي يعاود الحرب مرة بعد مرة."
  - term: "يَخْتَتِلُ"
    text: "يأخذه على غِرّة ويخدعه."
  - term: "الرِّئْبَالَ"
    text: "الأسد."
sources:
  - source: "aghani-dk"
    loc: "ج22 ص358"
    url: "https://archive.org/details/aghani2014/22/page/n360/mode/1up"
