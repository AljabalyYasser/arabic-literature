first: "يَا قَوْمِ لَا تَأْمَنُوا إِنْ كُنْتُمُ غُيُرًا"
second: "عَلَى نِسَائِكُمُ كِسْرَى وَمَا جَمَعَا"
vocabulary:
  - term: "غُيُرًا"
    text: "جمع «غَيُور»، وهو الذي يغار على أهله."
  - term: "كِسْرَى"
    text: "لقب ملوك الفرس."
  - term: "وَمَا جَمَعَا"
    text: "وما حشد من جيوش."
