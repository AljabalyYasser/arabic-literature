explained: false
first: "عَبْلَ الذِّرَاعِ أَبِيًّا ذَا مُزَابَنَةٍ"
second: "فِي الحَرْبِ لَا عَاجِزًا نِكْسًا وَلَا وَرَعَا"
vocabulary:
  - term: "عَبْلَ الذِّرَاعِ"
    text: "غليظ الذراع قويها."
  - term: "ذَا مُزَابَنَةٍ"
    text: "ذا مدافعة، من الزَّبْن وهو الدفع."
  - term: "نِكْسًا"
    text: "«والنِّكْسُ مِنَ الرِّجَالِ الْمُقَصِّرُ عَنْ غَايَةِ النَّجْدَة وَالْكَرَمِ» [@lisan، ج6 ص242]."
  - term: "وَرَعَا"
    text: "«الْوَرَعُ الصَّغِيرُ الضَّعِيفُ الَّذِي لَا غَناءَ عِنْدَهِ» [@lisan، ج8 ص388]."
sources:
