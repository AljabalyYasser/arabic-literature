first: "هَذَا كِتَابِي إِلَيْكُمْ وَالنَّذِيرُ لَكُمْ"
second: "لِمَنْ رَأَى الرَّأْيَ بِالإِبْرَامِ قَدْ نَصَعَا"
meaning: "هذه رسالتي إليكم، وهذا إنذاري لكم، ينتفع به من رأى أن الرأي الصواب قد استحكم ووضح."
vocabulary:
  - term: "النَّذِيرُ"
    text: "الإنذار، وهو الإعلام بالخطر قبل وقوعه."
  - term: "الإِبْرَامِ"
    text: "الإحكام، وأصله إحكام فتل الحبل."
  - term: "نَصَعَا"
    text: "وضح وخلص: «ونَصَعَ الشيءُ: خلَص، والأَمر: وضَحَ وبانَ؛ قَالَ ابْنُ بَرِّيٍّ: شَاهِدُهُ قَوْلُ لقِيطٍ الإِياديّ» [@lisan، ج8 ص355]."
context: "قبل البيت الأخير: يسمّي القصيدة «كتابًا»، فهي رسالة كُتبت لتُحمل إلى إياد بالجزيرة، لا قصيدة تُنشد في محفل. ويجعل أبو الفَرَج في أولها أبياتًا على وزن آخر «جعل عنوان الكتاب» [@aghani-dk، ج22 ص358]. ولذلك يمثّل بها ناصر الدين الأسد على الشعر الجاهلي المكتوب، ويروي هذا البيت خاتمةً لها [@asad، ص114]."
syntax:
  - "«هذا» اسم إشارة مبتدأ، و«كتابي» خبره، و«إليكم» جار ومجرور متعلق بـ«كتابي»."
  - "«والنذيرُ لكم»: «النذيرُ» معطوف على «كتابي»، و«لكم» متعلق به."
  - "«لمن رأى الرأيَ» جار ومجرور متعلق بالنذير، أي النذير لمن هذا شأنه. وجملة «قد نصعا» حال من «الرأي»، و«بالإبرام» متعلق بـ«نصعا»: وضح بالإحكام."
morphology:
  - "«نَذِير» على «فَعِيل»، ويأتي بمعنى المُنذِر وبمعنى الإنذار."
  - "«الإِبْرام» مصدر «أبرم» على «إفعال»."
  - "«نَصَعَ» فعل ثلاثي، والألف في آخره ألف الإطلاق."
rhetoric:
  thesis: "تعرّف القصيدة نفسها في آخرها: كتاب ونذير، والبيت الأخير يضيف: ونصيحة."
  devices:
    - title: "الإشارة بالقريب"
      text: "«هَذَا كِتَابِي»: يشير إلى القصيدة كأنها صحيفة بين أيديهم يرونها، فيقرّب الخطر الذي يحذّر منه."
    - title: "الاستعارة"
      text: "«بِالإِبْرَامِ»: الإبرام في الأصل إحكام فتل الحبل، فاستعاره لإحكام الرأي، كأن الرأي حبل يُفتل حتى يشتد. وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» [@dalail، ص67]."
  connection: "ثم يختم ببيت النصح: «وقد بذلت لكم نصحي بلا دخل»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المفتوحة، تتبعها ألف الإطلاق"
  scansion: "هاذاكِتا / بِي إِلَيْ / كُمْ وَنْنَذِي / رُلَكُمْ = مستفعلن / فاعلن / مستفعلن / فعِلن — لِمَنْ رَأَرْ / رَأْيَبِلْ / إِبْرامِقَدْ / نَصَعا = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخبن «مستفعلن» الأولى من العَجُز، والخبن: «حذف الثاني الساكن» [@atiq، ص46]. ويُكتب «هذا» بلا ألف بعد الهاء، وتُنطق ألفًا."
variants:
