first: "فَقَلِّدُوا أَمْرَكُمْ لِلَّهِ دَرُّكُمُ"
second: "رَحْبَ الذِّرَاعِ بِأَمْرِ الحَرْبِ مُضْطَلِعَا"
meaning: "فولّوا أمركم، لله دَرّكم، رجلًا واسع القوة عند الشدائد، يحمل أمر الحرب وينهض به."
vocabulary:
  - term: "قَلِّدُوا أَمْرَكُمْ"
    text: "ولّوه أمركم، واجعلوه في عنقه كالقلادة."
  - term: "لِلَّهِ دَرُّكُمُ"
    text: "كلمة يقولها العرب في المدح والتعجب، والدَّرّ في الأصل اللبن، أي لله خيركم."
  - term: "رَحْبَ الذِّرَاعِ"
    text: "«أَي واسِعَ القُوَّةِ عِنْدَ الشَّدائد» [@lisan، ج1 ص414]."
  - term: "مُضْطَلِعَا"
    text: "قويًّا على حمله: «هُوَ مُضْطَلِعٌ بحَمْلِه أَي قويٌّ عَلَى حَمْلِه» [@lisan، ج8 ص228]."
context: "أول أبيات صفة القائد (5–11)، وهي أشهر ما في القصيدة. فبعد صيحة الخطر يأتي الحل: أن تجتمع إياد على رجل واحد. وقد انفصلت هذه الأبيات عن خبر إياد فصارت وصفًا لكل قائد: تمثل بها الحَجّاج في المُهَلَّب [@kamil، ج3 ص287]، وأوردها ابن قُتَيْبة فيمن يُختار للأمر [@uyun-al-akhbar، ج1 ص69]، وفي «لسان العرب» من حديث ابن عَوْف: «قَلِّدوا أَمْرَكُم رَحْب الذِّراع» [@lisan، ج1 ص414]."
syntax:
  - "الفاء للتفريع: بعد أن وصف الخطر رتّب عليه الحل."
  - "«قلّدوا» فعل أمر، والواو فاعل، و«أمرَكم» مفعول به أول، و«رحبَ الذراع» مفعول به ثان، وهو صفة لموصوف محذوف: رجلًا رحب الذراع."
  - "«لله درّكم» جملة معترضة بين المفعولين للمدح والتعجب: «لله» جار ومجرور خبر مقدم، و«درّكم» مبتدأ مؤخر."
  - "«بأمر الحرب» جار ومجرور متعلق بـ«مضطلعا»، و«مضطلعا» صفة ثانية للموصوف المحذوف."
morphology:
  - "«قَلِّدُوا» من «قلّد» على «فعّل»، من القِلادة."
  - "«مُضْطَلِع» اسم فاعل من «اضطلع»، و«اضْطَلَعَ افتَعَلَ مِنَ الضَّلاعةِ وَهِيَ القوةُ» [@lisan، ج8 ص228]، وأصله «مُضْتَلِع»، فقُلبت تاء الافتعال طاء لمجاورة الضاد."
  - "«رَحْب» صفة مشبهة من «رَحُب» إذا اتسع."
rhetoric:
  thesis: "صفة القائد تُبنى بالكناية لا بالتصريح: لا يقول «قويّ»، بل «رحب الذراع»."
  devices:
    - title: "الكناية"
      text: "«رَحْبَ الذِّرَاعِ»: لا يريد سعة ذراعه، بل سعة طاقته وقوته عند الشدة، كما فسرها «لسان العرب». فهو معنى يُعرف بلازمه، والكناية عند عبد القاهر أن يجيء المتكلم إلى معنى «هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "الاستعارة"
      text: "«قَلِّدُوا أَمْرَكُمْ»: جعل الأمر قلادة تُوضع في عنق القائد، فهو مسؤولية تلازمه لا يخلعها. وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» [@dalail، ص67]."
    - title: "الاعتراض"
      text: "«لِلَّهِ دَرُّكُمُ»: جملة مدح بين الفعل ومفعوله الثاني. يمدحهم وهو يأمرهم، فيلين الأمر في نفوسهم، ويذكّرهم بأنهم أهل خير قبل أن يطلب منهم ما يطلب."
  connection: "ثم ينفي عن القائد صفتين: أن يبطره الرخاء، وأن تذله الشدة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المفتوحة، تتبعها ألف الإطلاق"
  scansion: "فَقَلْلِدُو / أَمْرَكُمْ / لِلْلاهِدَرْ / رُكُمُو = متفعلن / فاعلن / مستفعلن / فعِلن — رَحْبَذْذِرا / عِبِأَمْ / رِلْحَرْبِمُضْ / طَلِعا = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "أُشبعت ضمة الميم في «درّكمُ» فصارت «درّكمُو» لتمام «فعِلن» في العَروض، وهو إشباع جائز في ميم الجمع. ودخل الخبن «مستفعلن» الأولى من الصدر، و«فاعلن» الأولى من العَجُز، والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
