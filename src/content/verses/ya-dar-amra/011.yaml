explained: false
first: "حَتَّى اسْتَمَرَّتْ عَلَى شَزْرٍ مَرِيرَتُهُ"
second: "مُسْتَحْكِمَ السِّنِّ لَا قَحْمًا وَلَا ضَرَعَا"
vocabulary:
  - term: "اسْتَمَرَّتْ ... مَرِيرَتُهُ"
    text: "المريرة طاقة الحبل المفتول، واستمرت: استحكم فتلها. أي اشتدت عزيمته وقوي."
  - term: "عَلَى شَزْرٍ"
    text: "الشَّزْر: فتل الحبل من جهة اليسار، وهو أشد لفتله."
  - term: "مُسْتَحْكِمَ السِّنِّ"
    text: "في السن التي يتم فيها العقل والقوة."
  - term: "قَحْمًا"
    text: "شيخًا فانيًا."
  - term: "ضَرَعَا"
    text: "غِرًّا ضعيفًا."
sources:
  - source: "aghani-dk"
    loc: "ج22 ص357"
    url: "https://archive.org/details/aghani2014/22/page/n359/mode/1up"
  - source: "ibn-qutayba"
    loc: "ج1 ص197"
    url: "https://shamela.ws/book/23785/190"
    note: "البيت وتفسير محققه للشزر والمريرة."
