first: "يَا دَارَ عَمْرَةَ مِنْ مُحْتَلِّهَا الجَرَعَا"
second: "هَاجَتْ لِيَ الهَمَّ وَالأَحْزَانَ وَالوَجَعَا"
meaning: "يا دار عَمْرة، منذ نزلت صاحبتها الجَرَع، أثرتِ في نفسي الهم والأحزان والوجع."
vocabulary:
  - term: "مُحْتَلِّهَا"
    text: "نزولها وإقامتها، من «احتلّ المكانَ» إذا نزله."
  - term: "الجَرَعَا"
    text: "«والجَرَعةُ والجَرْعةُ والجَرَعُ والأَجْرَعُ والجَرْعاءُ: الأَرضُ ذاتُ الحُزُونة تُشاكل الرملَ، وَقِيلَ: هِيَ الرملةُ السَّهلة الْمُسْتَوِيَةُ» [@lisan، ج8 ص46]، والحُزونة: الغلظ. ويقول محققو الأغاني إنها «هنا موضع» [@aghani-dk، ج22 ص354، الحاشية]."
  - term: "هَاجَتْ"
    text: "أثارت وحرّكت."
context: "مطلع القصيدة، وهو كل ما يرويه أبو الفَرَج في الخبر من غزلها: يبدأ النذير كما تبدأ القصائد، بالدار والحبيبة، ثم ينتقل في البيت التالي مباشرة إلى قومه. ويعيده أبو الفَرَج في الصوت الذي يفتتح به أخبار لَقِيط [@aghani-dk، ج22 ص354]، ثم في الخبر [@aghani-dk، ج22 ص356]."
syntax:
  - "«يَا دَارَ عَمْرَةَ»: «يا» حرف نداء، و«دارَ» منادى مضاف منصوب، و«عَمْرَةَ» مضاف إليه مجرور بالفتحة لأنه ممنوع من الصرف للعلمية والتأنيث."
  - "«مِنْ مُحْتَلِّها الجَرَعا»: «مُحْتَلّ» مصدر ميمي بمعنى الاحتلال، أي النزول، مضاف إلى فاعله الضمير، و«الجَرَعا» مفعوله، و«مِنْ» لابتداء الغاية في الزمان: منذ نزلت الجَرَع."
  - "«هاجَتْ» فعل ماض، وفاعله ضمير مستتر يعود على الدار، و«الهَمَّ» مفعوله، و«الأحزانَ» و«الوجعا» معطوفان عليه."
morphology:
  - "«مُحْتَلّ» من «احتلّ» على «افتعل» من الحُلول، وأصله «مُحْتَلَل»، فأدغمت اللام في اللام. والمصدر الميمي من غير الثلاثي على زنة اسم المفعول."
  - "«الجَرَع» اسم جنس واحدته «جَرَعة»."
  - "«الأَحْزان» جمع «حُزْن» على «أفْعال»."
rhetoric:
  thesis: "مطلع تقليدي لقصيدة غير تقليدية: يبكي الدار كما يبكيها الشعراء، والقصيدة كلها بعد ذلك إنذار حرب."
  devices:
    - title: "النداء للتحسر"
      text: "«يَا دَارَ عَمْرَةَ»: ينادي الدار وهي لا تسمع ولا تجيب. فالنداء خرج عن طلب الإقبال، وهو أصل معناه، إلى إظهار الحسرة."
    - title: "المجاز في الإسناد"
      text: "«هَاجَتْ لِيَ الهَمَّ»: أسند الإثارة إلى الدار، والذي يثير الهم في الحقيقة ذكرى من سكنها. والمجاز هنا في نسبة الفعل لا في الكلمة، وهو ما يسميه عبد القاهر المجاز الحكمي: «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]."
    - title: "الترقي في العطف"
      text: "«الهَمَّ وَالأَحْزَانَ وَالوَجَعَا»: ثلاثة أسماء يرتفع بها من شغل النفس، إلى الحزن، إلى الوجع الذي يكاد يكون ألمًا في البدن."
  connection: "ثم يترك الدار، فلا يعود إليها في رواية الأغاني، وينادي قومه: «يا قوم لا تأمنوا»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المفتوحة، تتبعها ألف الإطلاق"
  scansion: "يادارَعَمْ / رَةَمِنْ / مُحْتَلْلِهَلْ / جَرَعا = مستفعلن / فعِلن / مستفعلن / فعِلن — هاجَتْ لِيَلْ / هَمْمَوَلْ / أَحْزانَوَلْ / وَجَعا = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]، وهو هنا مخبون «فعِلن» في القصيدة كلها. والخبن: «حذف الثاني الساكن» [@atiq، ص46]، وقد دخل «فاعلن» الأولى من الصدر. والبيت مصرّع: «الجَرَعا» و«الوَجَعا». والألف في آخرهما ألف الإطلاق، لا تكون رويًّا، ويمثل لها «لسان العرب» بهذا البيت نفسه: «نَحْوَ أَلف الجَرَعا مِنْ قَوْلِهِ: يَا دارَ عَفْراء مِن مُحْتَلِّها الجَرعَا» [@lisan، ج14 ص349]."
