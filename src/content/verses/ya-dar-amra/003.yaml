first: "هُوَ الجَلَاءُ الَّذِي تَبْقَى مَذَلَّتُهُ"
second: "إِنْ طَارَ طَائِرُكُمْ يَوْمًا وَإِنْ وَقَعَا"
meaning: "ما يأتيكم به كسرى هو أن تُخرَجوا من أرضكم، وهذا ذل يبقى معكم في كل حال: إن رحلتم وتفرقتم، وإن نزلتم وأقمتم."
vocabulary:
  - term: "الجَلَاءُ"
    text: "الخروج عن الأوطان: «جَلا القومُ عَنْ أَوطانهم يَجْلُون وأَجْلَوْا إِذا خَرَجُوا مِنْ بَلَدٍ إِلى بَلَدٍ» [@lisan، ج14 ص149]."
  - term: "مَذَلَّتُهُ"
    text: "ذُلّه وهوانه."
  - term: "إِنْ طَارَ طَائِرُكُمْ ... وَإِنْ وَقَعَا"
    text: "إن نفرتم ورحلتم كما يطير الطائر، وإن نزلتم واستقررتم كما يقع."
context: "بعد أن قال لهم «لا تأمنوا كسرى» يسمّي الخطر باسمه: الجلاء، أي فقد الأرض. والبيت عند ابن قُتَيْبة أيضًا [@ibn-qutayba، ج1 ص196]. وقد وقع في الخبر ما خافه: هُزمت إياد بعد ذلك، «ولحقت إياد بأطراف الشام» [@aghani-dk، ج22 ص358]."
syntax:
  - "«هو» ضمير يعود على ما يريده كسرى بهم، وهو مبتدأ، و«الجلاءُ» خبره، و«الذي» اسم موصول صفة للجلاء، وجملة «تبقى مذلّته» صلته."
  - "«إن طار طائركم يومًا وإن وقعا»: شرطان متعاطفان حُذف جوابهما لدلالة ما قبلهما عليه، أي إن طار طائركم بقيت المذلة، وإن وقع بقيت. و«يومًا» ظرف زمان."
  - "الألف في «وقعا» ألف الإطلاق."
morphology:
  - "«الجَلاء» مصدر «جلا يجلو» على «فَعال»."
  - "«مَذَلَّة» مصدر ميمي من «ذلّ يذِلّ» على «مَفْعَلة»، وأصله «مَذْلَلَة»، فنُقلت حركة اللام الأولى إلى الذال وأدغمت في الثانية."
  - "«طائِر» اسم فاعل من «طار يطير»، وقُلبت عينه همزة لوقوعها بعد ألف «فاعل»."
rhetoric:
  thesis: "حكم قاطع بلا تعليل: لا يقول إن الجلاء محتمل، بل يعرّف ما يأتي به كسرى تعريفًا: «هو الجلاء»."
  devices:
    - title: "تعريف الخبر"
      text: "«هُوَ الجَلَاءُ الَّذِي»: جاء الخبر معرفة بأل وبصلة، فكأن ما يأتي به كسرى ليس شيئًا غير الجلاء. ويكرر البناء نفسه في البيت التالي ويرتفع به درجة: «هو الفناء الذي يجتث أصلكم»، من الخروج إلى الهلاك."
    - title: "الطباق"
      text: "«طَارَ» و«وَقَعَا» ضدان، جمعهما ليستغرق الأحوال كلها: لا ينجي من الذل رحيل ولا إقامة."
    - title: "الاستعارة"
      text: "«طَائِرُكُمْ»: جعل القوم في رحيلهم ونزولهم طائرًا يطير ثم يقع، فاستعار لهم حركة الطائر. وهذا من الضرب الذي تجعل فيه «للشيء الشيء ليس له» [@dalail، ص67]."
  connection: "ثم يكرر البناء ويرتفع به: «هو الفناء الذي يجتث أصلكم»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المفتوحة، تتبعها ألف الإطلاق"
  scansion: "هُوَلْجَلا / ءُلْلَذِي / تَبْقَى مَذَلْ / لَتُهُو = متفعلن / فاعلن / مستفعلن / فعِلن — إِنْ طارَطا / ئِرُكُمْ / يَوْمَنْ وَإِنْ / وَقَعا = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخبنُ «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الأولى من العَجُز فصارت «فعِلن»، والخبن: «حذف الثاني الساكن» [@atiq، ص46]. وأُشبعت ضمة الهاء في «مذلّتُهُ» فصارت «مذلّتُهُو» لتمام «فعِلن»."
variants:
