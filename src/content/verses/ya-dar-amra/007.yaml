explained: false
first: "لَا يَطْعَمُ النَّوْمَ إِلَّا رَيْثَ يَبْعَثُهُ"
second: "هَمٌّ يَكَادُ حَشَاهُ يَقْصِمُ الضِّلَعَا"
vocabulary:
  - term: "لا يَطْعَمُ النَّوْمَ"
    text: "لا يذوقه."
  - term: "رَيْثَ"
    text: "قدرَ ما، أي لا ينام إلا ريثما يوقظه همّه."
  - term: "حَشَاهُ"
    text: "ما في جوفه."
  - term: "يَقْصِمُ الضِّلَعَا"
    text: "يكسر الأضلاع."
