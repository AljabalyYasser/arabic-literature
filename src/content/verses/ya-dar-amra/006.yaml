explained: false
first: "لَا مُتْرَفًا إِنْ رَخَاءُ العَيْشِ سَاعَدَهُ"
second: "وَلَا إِذَا حَلَّ مَكْرُوهٌ بِهِ خَشَعَا"
vocabulary:
  - term: "مُتْرَفًا"
    text: "منعّمًا أبطرته النعمة؛ «والمترف: الذي قد أبطرته النعمة وسعة العيش» [@lisan، ج9 ص17]."
  - term: "سَاعَدَهُ"
    text: "واتاه وأعانه؛ «وساعده مساعدة وسعادا وأسعده: أعانه» [@lisan، ج3 ص214]."
  - term: "خَشَعَا"
    text: "ذلّ وخضع؛ «الخشوع قريب من الخضوع» [@lisan، ج8 ص71]."
