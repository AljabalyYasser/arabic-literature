explained: false
first: "كَمَالِكِ بْنِ قِنَانٍ أَوْ كَصَاحِبِهِ"
second: "زَيْدِ القَنَا حِينَ لَاقَى الحَارِثَيْنِ مَعَا"
vocabulary:
  - term: "مَالِكِ بْنِ قِنَانٍ ... زَيْدِ القَنَا"
    text: "رجلان يضرب بهما المثل في الشجاعة، ولم نجد خبرهما في مصادرنا. وفي نسختين من الأغاني «سنان» مكان «قنان»."
  - term: "الحَارِثَيْنِ"
    text: "يقول محققو الأغاني: «يقصد بهما الحارث بن ظالم والحارث بن عوف المريين» [@aghani-dk، ج22 ص357، الحاشية]."
sources:
