explained: false
first: "مُسَهَّدُ النَّوْمِ تَعْنِيهِ ثُغُورُكُمُ"
second: "يَرُومُ مِنْهَا إِلَى الأَعْدَاءِ مُطَّلَعَا"
vocabulary:
  - term: "مُسَهَّدُ النَّوْمِ"
    text: "قليل النوم، يمنعه السهر منه."
  - term: "تَعْنِيهِ"
    text: "تُهمّه وتشغله."
  - term: "ثُغُورُكُمُ"
    text: "أطراف بلادكم التي يُخشى أن يأتي منها العدو."
  - term: "مُطَّلَعَا"
    text: "موضعًا يطّلع منه على العدو ويأتيه منه."
sources:
  - source: "aghani-dk"
    loc: "ج22 ص357"
    url: "https://archive.org/details/aghani2014/22/page/n359/mode/1up"
status: "review"
