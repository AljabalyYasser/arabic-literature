first: "إِذْ عَابَهُ عَائِبٌ يَوْمًا فَقَالَ لَهُ"
second: "دَمِّثْ لِجَنْبِكَ قَبْلَ اللَّيْلِ مُضْطَجَعَا"
vocabulary:
  - term: "دَمِّثْ"
    text: "ليّن ومهّد."
  - term: "مُضْطَجَعَا"
    text: "موضعًا تضطجع فيه. يعيّره العائب بالدعة: هيّئ لجنبك فراشًا لينًا، فما أنت إلا رجل راحة ونوم."
sources:
