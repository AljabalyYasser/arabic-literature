first: "مَا انْفَكَّ يَحْلُبُ هَذَا الدَّهْرَ أَشْطُرَهُ"
second: "يَكُونُ مُتَّبِعًا طَوْرًا وَمُتَّبَعَا"
meaning: "ما زال يجرّب الدهر بخيره وشره، كما يحلب الحالب أخلاف الناقة كلها، فكان مرة تابعًا لغيره، ومرة متبوعًا يقود."
vocabulary:
  - term: "مَا انْفَكَّ"
    text: "ما زال."
  - term: "يَحْلُبُ هَذَا الدَّهْرَ أَشْطُرَهُ"
    text: "يجرّب الدهر كله، و«حَلَبَ الدهرَ أشطرَه» مثل: «أَي خَبَرَ ضُرُوبَهُ، يَعْنِي أَنه مرَّ بِهِ خيرُه وَشَرُّهُ وَشِدَّتُهُ ورخاؤُه، تَشْبِيهًا بِحَلْبِ جَمِيعِ أَخلاف النَّاقَةِ» [@lisan، ج4 ص407]. والأخلاف: حلمات ضرع الناقة."
  - term: "مُتَّبِعًا ... وَمُتَّبَعَا"
    text: "تابعًا لغيره مرة، ومتبوعًا يتبعه الناس مرة."
context: "قلب صفة القائد: الخبرة. فالذي يريده لإياد رجل عرف الطاعة قبل أن يأمر. وقد صار البيت شاهدًا على المثل: يقول أبو هلال العَسْكَرِيّ إن «حلب الدهر أشطره» «يضْرب مثلا للرجل الْعَالم بالدهر»، ثم يستشهد بالبيت، ويقول: «ومن هذا البيت أخذ زياد قوله إنا سسنا وساسنا السائسون وجربنا وجربنا المجربون» [@askari-amthal، ج1 ص346]."
syntax:
  - "«ما انفكّ» فعل ماض ناقص يفيد الاستمرار مع النفي، واسمه ضمير مستتر يعود على القائد، وجملة «يحلب...» في محل نصب خبره."
  - "«هذا الدهرَ» مفعول به، و«أشطرَه» بدل منه بدل بعض من كل. يقول المَيْدانيّ في المثل: «ونصب أَشْطُرَه على البدل، فكأنه قال: حلَبَ أَشْطُرَ الدهر» [@maydani، ج1 ص195]."
  - "جملة «يكون متّبِعًا طورًا ومتّبَعا» حال من فاعل «يحلب» تفسّر الحلب، واسم «يكون» ضمير مستتر، و«متّبِعًا» خبرها، و«طورًا» ظرف زمان، و«متّبَعا» معطوف على «متّبِعًا»."
morphology:
  - "«أَشْطُر» جمع «شَطْر» جمع قلة على «أفْعُل». والشطر في الناقة: خِلفان من أخلافها الأربعة، يقول المَيْدانيّ: «وذلك إذا حلب خِلْفَين من أخلافها، ثم يحلبها الثانية خِلْفَيْن أيضا» [@maydani، ج1 ص195]."
  - "«مُتَّبِع» اسم فاعل و«مُتَّبَع» اسم مفعول من «اتّبع» على «افتعل»، وأصله «اتْتَبَع»، فأدغمت فاء الكلمة في تاء الافتعال. ولا يفرق بينهما إلا حركة الباء."
  - "«انْفَكَّ» على «انفعل» من «فكّ»."
rhetoric:
  thesis: "الخبرة في صورة من حياة الرعاة: الدهر ناقة، والرجل المجرّب حالب يعرف أخلافها كلها، ما يدرّ منها وما لا يدرّ."
  devices:
    - title: "التمثيل"
      text: "«يَحْلُبُ هَذَا الدَّهْرَ أَشْطُرَهُ»: صوّر تجربة الأيام بهيئة حالب يحلب الناقة خِلفين بعد خلفين حتى يستوفي ضرعها. فالشبه منتزع من هيئة كاملة لا من صفة مفردة، وهذا تمثيل، وعبد القاهر يجعله أخص من التشبيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "الجناس والطباق"
      text: "«مُتَّبِعًا» و«مُتَّبَعَا»: كلمتان لا تختلفان إلا في حركة الباء، ومعناهما ضدان: التابع والمتبوع. فجمع في لفظ واحد تقريبًا طرفي الخبرة: أن يطيع ثم يقود."
  connection: "ثم يزيده صفة: لا يشغله عن قومه مال يثمّره ولا ولد يطلب له الرفعة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المفتوحة، تتبعها ألف الإطلاق"
  scansion: "مَنْفَكْكَيَحْ / لُبُهَا / ذَدْدَهْرَأَشْ / طُرَهُو = مستفعلن / فعِلن / مستفعلن / فعِلن — يَكُونُمُتْ / تَبِعَنْ / طَوْرَنْ وَمُتْ / تَبَعا = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "تسقط همزة الوصل في «انْفَكَّ» في الدرج، فتلتقي ألف «ما» بالنون الساكنة، فتُنطق «مَنْ». ودخل الخبنُ «فاعلن» الأولى في الشطرين، و«مستفعلن» الأولى من العَجُز، والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
