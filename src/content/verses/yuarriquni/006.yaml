first: "أَلَا يَا صَخْرُ لَا أَنْسَاكَ حَتَّى"
second: "أُفَارِقَ مُهْجَتِي وَيُشَقَّ رَمْسِي"
vocabulary:
- term: "مُهْجَتِي"
  text: "روحي. في لسان العرب: «المُهْجَةُ: دَمُ الْقَلْبِ، ولا بقاء للنَّفْسِ بعد ما تُراقُ مُهْجَتُه» [@lisan، ج2 ص370]."
- term: "رَمْسِي"
  text: "قبري: «والرَّمْسُ: الْقَبْرُ» [@lisan، ج4 ص294]."
