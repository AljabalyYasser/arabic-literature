first: "عَلَى صَخْرٍ وَأَيُّ فَتًى كَصَخْرٍ"
second: "لِيَوْمِ كَرِيهَةٍ وَطِعَانِ خَلْسِ"
meaning: "حزني على صخر، وأيُّ فتى مثل صخر ليوم الحرب، وللطعان الذي يختلس فيه الفارس الفرصة من خصمه. وفي الشرح المنسوب إلى ثَعْلَب في «طعان خلس»: «أي مُخالَسة، والطَّعن خَلْسٌ كلُّه، وإنّما هو فُرَص» [@diwan-khansa، ص325]."
vocabulary:
  - term: "كَرِيهَةٍ"
    text: "حرب، سُمّيت بذلك لأنها تُكره. وفي الشرح في موضع آخر: «والكريهة: الحرب» [@diwan-khansa، ص105]."
  - term: "خَلْسِ"
    text: "اختلاس واغتنام للفرصة. في لسان العرب: «الخَلْسُ: الأَخذ فِي نُهْزَةٍ ومُخاتلة»، و«والقرْنانِ إِذا تَبَارَزَا يَتَخالسان أَنفسَهما: يُناهِزُ كلُّ وَاحِدٍ مِنْهُمَا قَتْل صَاحِبِهِ» [@lisan، ج6 ص65]."
context: "البيت الذي يسمّي الميت، ويتعلق بما قبله: التذكر الذي يؤرّقها هو «على صخر». وصدره بحروفه صدر البيت الثاني من قصيدتها «أبت عيني»: «عَلَى صَخْرٍ وَأَيُّ فَتًى كَصَخْرٍ / إِذَا مَا النَّابُ لَمْ تَرْأَمْ طَلَاهَا» [@diwan-khansa، ص278]، فهو من الصيغ التي تعود إليها في رثائه. والبيت عند القالِيّ بلفظ ثَعْلَب [@qali، ج2 ص163]."
syntax:
  - "«عَلَى صَخْرٍ» جار ومجرور متعلق بـ«التَّذَكُّرُ» أو بـ«الْأَحْزَانِ» في البيت الأول، فالبيتان متعلق أحدهما بالآخر، وهو ما يسمّيه ابن رَشِيق التضمين: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]."
  - "«وَأَيُّ فَتًى كَصَخْرٍ» جملة معترضة: «أَيُّ» اسم استفهام مبتدأ، و«فَتًى» مضاف إليه، و«كَصَخْرٍ» جار ومجرور خبره. والاستفهام للتعظيم: لا فتى مثله."
  - "«لِيَوْمِ كَرِيهَةٍ» جار ومجرور متعلق بما في «كَصَخْرٍ» من معنى المماثلة، أي لا أحد يماثله في هذا اليوم. و«وَطِعَانِ خَلْسِ» معطوف عليه."
morphology:
  - "«طِعَان» مصدر «طَاعَنَ» على «فِعَال»، وهو وزن مصدر «فاعَل» الدال على المشاركة: طعنٌ بين اثنين."
  - "«خَلْس» مصدر «خَلَسَ يَخْلِسُ» [@lisan، ج6 ص65]، أُضيف إليه «طِعَان» إضافة وصف: طعان يُختلس فيه."
rhetoric:
  thesis: "تسمّي أخاها لأول مرة، وتجعل اسمه نفسه مقياسًا للفتوة."
  devices:
    - title: "التكرار"
      text: "«صَخْرٍ ... كَصَخْرٍ» تكرر الاسم في شطر واحد، ولم تقل «كمثله». فالاسم صار هو الوصف: لا يُشبَّه صخر إلا بصخر. وهو كتكرار اسمه في القصيدة الأم «وَإِنَّ صَخْرًا»."
    - title: "الاستفهام"
      text: "«وَأَيُّ فَتًى كَصَخْرٍ» سؤال لا جواب له، والمعنى نفي: ليس فتى كصخر. والسؤال أبلغ من النفي لأنه يتحدى السامع أن يجد مثله."
    - title: "الكناية"
      text: "«يَوْمِ كَرِيهَةٍ» كناية عن الحرب، تسمّيها بأثرها في النفوس، و«طِعَانِ خَلْسِ» تصف شجاعة الفارس الذي يقتنص اللحظة في المبارزة."
  connection: "ثم تقول إنها لم تسمع بمصيبة مثله، لا في الجن ولا في الإنس."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ السين المكسورة"
  scansion: "عَلَى صَخْرِنْ / وَأَيْيُ فَتَنْ / كَصَخْرِنْ = مفاعلْتن / مفاعلتن / فعولن — لِيَوْمِ كَرِي / هَتِنْ وَطِعَا / نِ خَلْسِي = مفاعلتن / مفاعلتن / فعولن"
  note: "دخل العَصْبُ، وهو تسكين الخامس المتحرك، التفعيلةَ الأولى من الصدر فصارت «مفاعلْتن»، والعَصْب جائز في حشو الوافر [@atiq، ص54]. والعروض والضرب «فعولن» مقطوفان."
