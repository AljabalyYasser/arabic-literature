first: "فَلَوْلَا كَثْرَةُ الْبَاكِينَ حَوْلِي"
second: "عَلَى إِخْوَانِهِمْ لَقَتَلْتُ نَفْسِي"
meaning: "لولا أني أرى حولي كثيرين يبكون إخوانهم مثلي، لقتلتُ نفسي من الحزن. فما يُبقيها حيّة أنها ليست وحدها في مصيبتها."
vocabulary:
  - term: "فَلَوْلَا"
    text: "حرف يمتنع به الجواب لوجود ما بعده: امتنع قتلها نفسها لوجود الباكين."
  - term: "إِخْوَانِهِمْ"
    text: "جمع أخ. وهي تبكي أخاها، فترى في كل باكٍ على أخيه صورة نفسها."
context: "قلب القصيدة: بعد أن وصفت حزنًا لا يهدأ ليلًا ولا نهارًا (1–7)، تقول ما الذي يمنعه من أن يقتلها. ومن هنا تبدأ فكرة الأبيات الأخيرة (8–11): التأسّي بالآخرين. ولم يقف الشرح المنسوب إلى ثَعْلَب عنده بشيء [@diwan-khansa، ص326]، ورواه القالِيّ في أبياتها [@qali، ج2 ص163]."
syntax:
  - "«لَوْلَا» حرف امتناع لوجود: امتنع قتلها نفسها لوجود الباكين. و«كَثْرَةُ» مبتدأ، وخبره محذوف وجوبًا تقديره «موجودة»، كما يُحذف خبر المبتدأ بعد «لولا» دائمًا."
  - "«الْبَاكِينَ» مضاف إليه مجرور بالياء، و«حَوْلِي» ظرف مكان متعلق بـ«الباكين»، و«عَلَى إِخْوَانِهِمْ» جار ومجرور متعلق به أيضًا."
  - "«لَقَتَلْتُ نَفْسِي» جواب «لولا»، واللام فيه واقعة في جواب لولا، و«نَفْسِي» مفعول به."
morphology:
  - "«الْبَاكِينَ» جمع مذكر سالم لـ«بَاكٍ»، اسم فاعل من «بَكَى» الناقص، حُذفت ياؤه في المفرد المنوّن وعادت في الجمع."
  - "«إِخْوَان» جمع «أَخ» على «فِعْلان»."
rhetoric:
  thesis: "اعتراف صريح بأن الحزن بلغ حدّ الرغبة في الموت، وأن العزاء الوحيد هو رؤية الآخرين في المصيبة نفسها."
  devices:
    - title: "الإيجاز بالحذف"
      text: "خبر «لَوْلَا» محذوف، والسامع يفهمه من السياق: لولا وجود الباكين. والحذف هنا يجعل الشطر الأول كله قائمًا على كلمة واحدة: «كَثْرَةُ»، أي الكثرة هي المانع."
    - title: "المبالغة"
      text: "«لَقَتَلْتُ نَفْسِي» جواب صريح لا كناية فيه. فبعد صور العين والسحاب والمرض في أول القصيدة، تقول هنا ما تريد بلا صورة، وفي هذه المباشرة قوة البيت."
    - title: "المقابلة بين الجمع والفرد"
      text: "«الْبَاكِينَ» و«إِخْوَانِهِمْ» جمع، و«نَفْسِي» فرد. فالشاعرة المفردة تحتمي بالجماعة الباكية: لو كانت وحدها في حزنها لما احتملته."
  connection: "ثم تفصّل ما تراه من الباكين: ثكلى ونائحة تبكي كل منهما أخاها."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ السين المكسورة"
  scansion: "فَلَوْلَا كَثْ / رَتُلْ بَاكِي / نَ حَوْلِي = مفاعلْتن / مفاعلْتن / فعولن — عَلَى إِخْوَا / نِهِمْ لَقَتَلْ / تُ نَفْسِي = مفاعلْتن / مفاعلتن / فعولن"
  note: "دخل العَصْبُ، وهو تسكين الخامس المتحرك، التفعيلتين الأوليين من الصدر والأولى من العجز، فصارت «مفاعلْتن» [@atiq، ص54]. والعروض والضرب «فعولن» مقطوفان."
