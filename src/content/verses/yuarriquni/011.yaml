first: "وَمَا يَبْكِينَ مِثْلَ أَخِي وَلَكِنْ"
second: "أُسَلِّي النَّفْسَ عَنْهُ بِالتَّأَسِّي"
meaning: "والنساء اللواتي أراهن يبكين لا يبكين رجلًا مثل أخي، ولكني أُسلّي نفسي عنه بأن أرى غيري مصابًا مثلي. وفي الشرح المنسوب إلى ثَعْلَب: «تحكي: النوائح أنّهن لا يبكين مثل أخي» [@diwan-khansa، ص327]."
vocabulary:
  - term: "يَبْكِينَ"
    text: "يعني الثكلى والنائحة اللتين ذكرتهما في البيتين السابقين."
  - term: "أُسَلِّي"
    text: "أُصبّر وأُنسي."
  - term: "بِالتَّأَسِّي"
    text: "بالتعزّي برؤية مصائب الآخرين. في لسان العرب: «والتَّأْسِيَة: التَّعْزِيَةُ. أسَّيْته تَأْسِيةً أَي عَزَّيته. وأَسَّاه فَتَأَسَّى: عَزَّاه فتَعزَّى. وتَأَسَّى بِهِ أَي تعزَّى بِهِ» [@lisan، ج14 ص35]."
context: "خاتمة القصيدة، تجمع فكرتها: الحزن الذي لا يُحتمل (1–8)، والباكيات حولها (9–10)، ثم العزاء الناقص: هن لا يبكين مثل صخر، لكنها تتعزّى بهن. وفي الشرح بعد هذا البيت: «قال: هذه آخر قصيدة قالتها»، ثم خبر النائحة التي ظنّتها الخنساء مصابة مثلها، فإذا هي تبكي «على جرو كلبٍ لي هلك»، فحلفت ألا تبكي بعدها [@diwan-khansa، ص327]."
syntax:
  - "«وَمَا يَبْكِينَ» «ما» نافية، و«يَبْكِينَ» فعل مضارع مبني على السكون لاتصاله بنون النسوة، والنون فاعل. و«مِثْلَ» مفعول به، و«أَخِي» مضاف إليه."
  - "«وَلَكِنْ» حرف استدراك، خُففت نونه فلا تعمل. و«أُسَلِّي» فعل مضارع، و«النَّفْسَ» مفعول به، و«عَنْهُ» و«بِالتَّأَسِّي» جاران ومجروران متعلقان بـ«أُسَلِّي»."
morphology:
  - "«أُسَلِّي» على «أُفَعِّلُ» من «سَلَا يَسْلُو» إذا نسي، والتضعيف للتعدية: أُسلّي نفسي أي أجعلها تسلو."
  - "«التَّأَسِّي» مصدر «تَأَسَّى» على «تَفَعُّل»، من الجذر (أ س و) الذي منه «الأُسْوة»: أن تجعل غيرك أسوة لك [@lisan، ج14 ص35]."
rhetoric:
  thesis: "تعترف بأن عزاءها ناقص: من حولها يبكين من هو دون أخيها، ومع ذلك تتعزّى بهن."
  devices:
    - title: "الاستدراك"
      text: "«وَلَكِنْ» في آخر الصدر تقلب المعنى: نفت أولًا أن يكون حزنهن كحزنها، ثم استدركت بأنها تتعزّى بهن رغم ذلك. ووقوع «لكنْ» في آخر الشطر يعلّق السامع حتى يأتي العجز."
    - title: "القافية الجامعة"
      text: "«بِالتَّأَسِّي» كلمة القافية في آخر بيت، وهي اسم الفكرة التي بُنيت عليها الأبيات من الثامن: التعزّي بمصاب الآخرين. فالقصيدة تنتهي بتسمية ما كانت تصفه."
    - title: "تقارب الألفاظ"
      text: "«أُسَلِّي» و«التَّأَسِّي» كلمتان من جذرين مختلفين، لكنهما تتقاربان في الحروف والإيقاع: في كلتيهما السين، وكلتاهما تنتهي بحرف مشدد مكسور تليه ياء. والمعنيان متقاربان أيضًا: السلوّ والعزاء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ السين المكسورة"
  scansion: "وَمَا يَبْكِي / نَ مِثْلَ أَخِي / وَلَاكِنْ = مفاعلْتن / مفاعلتن / فعولن — أُسَلْلِنْ نَفْ / سَ عَنْهُو بِتْ / تَأَسْسِي = مفاعلْتن / مفاعلْتن / فعولن"
  note: "«وَلَكِنْ» تُنطق بألف بعد اللام «وَلَاكِنْ» وإن لم تُكتب. وتُشبع ضمة الهاء في «عَنْهُ» فتُنطق «عَنْهُو». ودخل العَصْبُ، وهو تسكين الخامس المتحرك، الأولى من الصدر والأوليين من العجز [@atiq، ص54]."
variants:
  - reading: "وَمَا يَبْكُونَ مِثْلَ أَخِي وَلَكِنْ / أُعَزِّي النَّفْسَ عَنْهُ بِالتَّأَسِّي"
    status: "رواية القالِيّ ونسخ ابن السِّكِّيت"
    note: "[@qali، ج2 ص163]، ويذكرها المحقق عن نسختي برنستون وبرلين [@diwan-khansa، ص327]."
