first: "يُذَكِّرُنِي طُلُوعُ الشَّمْسِ صَخْرًا"
second: "وَأَذْكُرُهُ لِكُلِّ غُرُوبِ شَمْسِ"
meaning: "إذا طلعت الشمس ذكّرتني صخرًا، وإذا غربت ذكرتُه. فالنهار كله من أوله إلى آخره ذكرى له. وفسّر القدماء الوقتين بعادتين من عاداته: قال المُبَرِّد: «قالوا: أرادت بطلوع الشمس وقت الغارة، وبغروب الشمس وقت الأضياف» [@kamil، ج3 ص113]، وعند القالِيّ: «قَالَ أَبُو بَكْرٍِ: طلوع الشمس للغارة، وغروب الشمس للضيفان» [@qali، ج2 ص163]. فالصبح وقت الغارة على العدو، والمساء وقت نزول الضيوف وإطعامهم."
vocabulary:
  - term: "لِكُلِّ"
    text: "عند كل. واللام هنا للتوقيت."
context: "أشهر أبيات القصيدة، وهو مع البيت الذي بعده من محفوظات الخنساء. ويقف عنده المُبَرِّد والقالِيّ فيفسّرانه كما في المعنى [@kamil، ج3 ص113] [@qali، ج2 ص163]. ولم يقف الشرح المنسوب إلى ثَعْلَب عنده بشيء [@diwan-khansa، ص326]، لكنه يروي في خبر دخولها على عائشة أنها أنشدته هناك: فلما قالت لها عائشة إن الإسلام هدم ما كان يصنعه صخر، «فأنشأت تقول: «يذكّرني غروبُ.....» وهي مكتوبة» [@diwan-khansa، ص367–368]، أي أنها أنشدت هذا البيت المكتوب في موضعه."
syntax:
  - "«يُذَكِّرُنِي» فعل مضارع متعدٍّ إلى مفعولين، الأول الياء، والثاني «صَخْرًا». و«طُلُوعُ» فاعل مؤخر، و«الشَّمْسِ» مضاف إليه."
  - "«وَأَذْكُرُهُ» معطوف، والهاء مفعول به لصخر. و«لِكُلِّ غُرُوبِ شَمْسِ» جار ومجرور متعلق بـ«أَذْكُرُ»، واللام للتوقيت بمعنى «عند»."
morphology:
  - "«يُذَكِّرُ» على «يُفَعِّلُ» من «ذَكَرَ»، والتضعيف للتعدية، فصار يتعدى إلى مفعولين: يُذكّرني صخرًا. و«أَذْكُرُ» من الثلاثي المجرد، فالفعلان من جذر واحد، الأول تفعله الشمس بها، والثاني تفعله هي."
  - "«طُلُوع» و«غُرُوب» مصدران على «فُعُول»."
rhetoric:
  thesis: "الذكرى تملأ اليوم كله بين طرفيه، وكل طرف منهما يذكّر بفضيلة من فضائله."
  devices:
    - title: "الطباق"
      text: "«طُلُوعُ» و«غُرُوبِ» ضدان، والطباق الجمع بين الضدين. وذِكرُ طرفي النهار يعني النهار كله، فالطباق هنا يدل على الدوام."
    - title: "الكناية"
      text: "على تفسير المُبَرِّد والقالِيّ، لا تريد الشمس نفسها، بل ما يكون فيها: الغارة صباحًا، والقِرى مساءً. والكناية عند عبد القاهر الجُرْجانيّ أن يترك المتكلم اللفظ الموضوع للمعنى «ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]."
    - title: "التصدير"
      text: "«الشَّمْسِ» في حشو الصدر، و«شَمْسِ» في القافية، فرجع آخر البيت إلى لفظ في أوله. وهذا ما يسمّيه ابن رَشِيق التصدير: «أن يرد أعجاز الكلام على صدوره، فيدل بعضه على بعض» [@ibn-rashiq، ج2 ص3]."
    - title: "تبادل الفاعل"
      text: "في الصدر الشمس هي التي تُذكّرها «يُذَكِّرُنِي»، وفي العجز هي التي تَذكره «وَأَذْكُرُهُ». فالذكرى تأتيها من الخارج، ثم تصير فعلها هي."
  connection: "ثم تقول ما الذي يمنعها من قتل نفسها: كثرة الباكين حولها على إخوانهم."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ السين المكسورة"
  scansion: "يُذَكْكِرُنِي / طُلُوعُشْ شَمْ / سِ صَخْرَنْ = مفاعلتن / مفاعلْتن / فعولن — وَأَذْكُرُهُو / لِكُلْلِ غُرُو / بِ شَمْسِي = مفاعلتن / مفاعلتن / فعولن"
  note: "دخل العَصْبُ، وهو تسكين الخامس المتحرك، التفعيلةَ الثانية من الصدر فصارت «مفاعلْتن» [@atiq، ص54]. وتُشبع ضمة الهاء في «أَذْكُرُهُ» فتُنطق «أَذْكُرُهُو». والعروض والضرب «فعولن» مقطوفان."
