first: "يُؤَرِّقُنِي التَّذَكُّرُ حِينَ أُمْسِي"
second: "فَيَرْدَعُنِي مَعَ الْأَحْزَانِ نُكْسِي"
meaning: "إذا جاء المساء أبقتني الذكرى ساهرة، ثم يعود إليّ حزني كما يعود المرض إلى من برئ منه، فيكفّني عن العافية. وفي الشرح المنسوب إلى ثَعْلَب: «أخبرت أنّها تكون صالحةً، فإذا ذكرت نفسها ترتدّ وترتاع وتُنكس في حزنها» [@diwan-khansa، ص325]."
vocabulary:
  - term: "يُؤَرِّقُنِي"
    text: "يُسهرني ويمنعني النوم."
  - term: "فَيَرْدَعُنِي"
    text: "فيكفّني. في لسان العرب: «الرَّدْعُ: الكَفُّ عَنِ الشَّيْءِ. رَدَعَه يَرْدَعه رَدْعاً فارْتَدَع: كفَّه فكفَّ» [@lisan، ج8 ص121]."
  - term: "نُكْسِي"
    text: "عودة مرضي. في لسان العرب: «والنُّكْسُ والنَّكْسُ، والنُّكاسُ كُلُّهُ: العَوْد فِي الْمَرَضِ، وَقِيلَ: عَوْد الْمَرِيضِ فِي مَرَضِهِ بَعْدَ مَثَالته» [@lisan، ج6 ص243]. وفي الشرح: «قال: نُكْسي؛ وهي لُغتُهم» [@diwan-khansa، ص325]."
context: "مطلع القصيدة. ويروي أبو عُبَيْدة، فيما يرويه القالِيّ بإسناده، أنها قالتها بعد موت صخر تعارض بها دُرَيْد بن الصِّمَّة: «فلما مات صخر قَالَت الخنساء تعارض دريدا فِي كلمته»، وكلمته سينية على هذا الوزن والرويّ [@qali، ج2 ص162–163]. والمعارضة: أن يقول شاعر قصيدة على وزن قصيدة لغيره وقافيتها. وفي آخر صدر مطلع دُرَيْد «أَمْسَى»، وفي آخر صدر مطلعها «أُمْسِي»."
syntax:
  - "«يُؤَرِّقُنِي» فعل مضارع، والنون للوقاية والياء مفعول به، و«التَّذَكُّرُ» فاعل. و«حِينَ» ظرف زمان مضاف إلى جملة «أُمْسِي»."
  - "«فَيَرْدَعُنِي» معطوف بالفاء، و«نُكْسِي» فاعل مؤخر، و«مَعَ الْأَحْزَانِ» ظرف متعلق بالفعل، قُدّم على الفاعل. فالمعنى: يعود إليّ مرضي مع الأحزان فيكفّني."
morphology:
  - "«يُؤَرِّقُ» على «يُفَعِّلُ» من الأَرَق، والتضعيف فيه للتعدية: أَرِقَ الرجل إذا سهر، وأرّقه غيره إذا أسهره."
  - "«التَّذَكُّر» مصدر «تَذَكَّرَ» على «تَفَعَّلَ»، وفيه معنى التكرار والتدرّج، فهو ذكرى تعود مرة بعد مرة."
  - "«نُكْس» على «فُعْل» بضم النون، وفيه «النَّكْس» بالفتح أيضًا [@lisan، ج6 ص243]، ويقول الشرح إن الضم لغة قومها [@diwan-khansa، ص325]."
rhetoric:
  thesis: "تصف حزنها مرضًا يعاود صاحبه كلما ظنّ أنه شُفي، ويشتدّ بالليل."
  devices:
    - title: "الاستعارة"
      text: "«نُكْسِي» كلمة الطب: رجوع المرض بعد البُرء. فجعلت الحزن مرضًا، وكل ساعة تنساه فيها شفاءً مؤقتًا. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "التقديم"
      text: "في «مَعَ الْأَحْزَانِ نُكْسِي» قدّمت الظرف على الفاعل، فجاء «نُكْسِي» في القافية آخر الكلام، وهو موضع الثقل في البيت. وعبد القاهر الجُرْجانيّ ينقل عن سِيبَوَيْه في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "وقت المساء"
      text: "«حِينَ أُمْسِي» تحدد الوقت الذي يعود فيه الحزن: الليل، حين يهدأ الناس. وستعود إلى الزمن في البيت السابع: طلوع الشمس وغروبها."
  connection: "ثم تسمّي من تبكيه: صخر، وأي فتى كصخر في يوم الحرب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ السين المكسورة، فهي سينية"
  scansion: "يُؤَرْرِقُنِتْ / تَذَكْكُرُ حِي / نَ أُمْسِي = مفاعلتن / مفاعلتن / فعولن — فَيَرْدَعُنِي / مَعَلْ أَحْزَا / نِ نُكْسِي = مفاعلتن / مفاعلْتن / فعولن"
  note: "وزن الوافر في كل شطر «مفاعلتن مفاعلتن فعولن». والعروض والضرب «فعولن»، وأصلهما «مفاعلتن» دخلها القَطْف، وهو تسكين الخامس وحذف السبب الخفيف من آخرها [@atiq، ص54]. ودخل العَصْب، وهو تسكين الخامس المتحرك، التفعيلة الثانية من العجز فصارت «مفاعلْتن» [@atiq، ص54]."
