explained: false
first: "وَأَكْرَمَ عِنْدَ ضُرِّ النَّاسِ جَهْدًا"
second: "لِجَادٍ أَوْ لِجَارٍ أَوْ لِعِرْسِ"
vocabulary:
- term: "عِنْدَ ضُرِّ النَّاسِ"
  text: "في الشرح: «أي: إذا ضرّ الناس وجُهدوا كان صخر أكرم ما يكون؛ أي يُطعم ويُسقى» [@diwan-khansa، ص326]."
- term: "لِجَادٍ"
  text: "في الشرح: «الجادي: الطالب» [@diwan-khansa، ص326]."
- term: "لِعِرْسِ"
  text: "في الشرح: «العِرس: امرأة الرجل» [@diwan-khansa، ص326]."
