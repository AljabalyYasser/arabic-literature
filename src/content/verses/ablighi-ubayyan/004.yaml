explained: false
first: "فَلَا أَعْرِفَنْكَ كَذَاتِ الْغُلَا"
second: "مِ مَا لَمْ تَجِدْ عَارِمًا تَعْتَرِمْ"
vocabulary:
  - term: "ذَاتِ الْغُلَامِ"
    text: "الأم المرضع."
  - term: "عَارِمًا تَعْتَرِمْ"
    text: "قال ابن قُتَيْبة في البيت: «معناه: إن لم تجد من يرضعها رضعت ثدى نفسها، يقال «عرم الصبىّ أمّه» إذا رضعها» [@ibn-qutayba، ج1 ص226]. أي لا تكن كمن يؤذي نفسه إذا لم يجد غيره."
