explained: false
first: "وَالْأَبَارِيقُ عَلَيْهَا فُدُمٌ"
second: "وَجِيَادُ الْخَيْلِ تَرْدِي فِي الْجِلَالِ"
vocabulary:
  - term: "فُدُمٌ"
    text: "جمع فِدام، و«أَمَّا الفِدام فَإِنَّهُ مِصْفاة الْكُوزِ والإِبريق» [@lisan، ج12 ص450]."
  - term: "تَرْدِي"
    text: "تعدو وتضرب الأرض بحوافرها."
  - term: "الْجِلَالِ"
    text: "جمع جُلّ، وهو ما تُلبسه الدابة لتُصان به."
