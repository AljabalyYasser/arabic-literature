first: "هَلْ مَا عَلِمْتَ وَمَا اسْتُودِعْتَ مَكْتُومُ"
second: "أَمْ حَبْلُهَا إِذْ نَأَتْكَ اليَوْمَ مَصْرُومُ"
meaning: "هل بقي ما عرفتَه منها وما ائتمنتك عليه من سرّها مكتومًا محفوظًا؟ بل لعلّ حبل وصلها قد انقطع اليوم إذ بعدت عنك."
vocabulary:
  - term: "اسْتُودِعْتَ"
    text: "جُعل عندك وديعة، يريد ما ائتمنته عليه من سرّها."
  - term: "مَكْتُومُ"
    text: "مستور لم يُذَع."
  - term: "حَبْلُها"
    text: "وصلها وعهدها، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1600]."
  - term: "نَأَتْكَ"
    text: "بعدت عنك."
  - term: "مَصْرُومُ"
    text: "مقطوع، كما يقول المحقق [@tabrizi-ikhtiyarat، ج3 ص1600]."
context: "مطلع الميمية. وفي رواية حَمّاد الراوية أن العرب كانت تعرض أشعارها على قريش، فقدم عليهم عَلْقَمة فأنشدهم هذه القصيدة، «فقالوا: هذه سِمْط الدهر» [@aghani-dk، ج21 ص201]، والسمط: القلادة. وسار المطلع حتى صار يُتمثّل به: مرّ رجل من مُزَيْنة بباب رجل من الأنصار يُتّهم بامرأته فتمثّل به، فاستعدى عليه الأنصاريّ عمر بن الخطاب فعاقبه [@ibn-sallam، ج1 ص140] [@aghani-dk، ج21 ص203]، والخبر في [المتمثّل ببيت عَلْقَمة](/stories/al-mutamaththil/)."
syntax:
  - "«هل» حرف استفهام، و«ما» اسم موصول مبتدأ، و«علمت» صلته، و«وما استودعت» معطوف عليه، و«مكتوم» خبر المبتدأ، وأفرده لأن المعطوفين شيء واحد في المعنى."
  - "«أم» هنا المنقطعة بمعنى «بل» مع الاستفهام، ولا تكون المتصلة «لأن تلك عديلة الألف خاصة» [@tabrizi-ikhtiyarat، ج3 ص1600]، أي لا تأتي إلا بعد همزة الاستفهام. و«حبلها» مبتدأ، و«مصروم» خبره، و«إذ نأتك» ظرف متعلق بـ«مصروم»، و«اليوم» ظرف."
  - "والضمير في «حبلها» للمرأة، ولم يجر لها ذكر، «ولكن لما لم يلتبس صار كالمنطوق به» [@tabrizi-ikhtiyarat، ج3 ص1600]."
morphology:
  - "«استُودِعت» ماض مبني للمجهول على «استُفعِل» من الوديعة."
  - "«مكتوم» و«مصروم» اسما مفعول من كتم وصرم."
  - "«نأتك» ماض «نأى» المعتل الآخر، حُذفت ألفه لاتصاله بتاء التأنيث الساكنة."
rhetoric:
  thesis: "مطلع بالسؤال بدل الوقوف على الأطلال: يسأل الشاعر عن السرّ والعهد قبل أن يسأل عن الدار، فالمسألة عنده أمانة بين اثنين."
  devices:
    - title: "«أم» المنقطعة بين الشك واليقين"
      text: "سأل أولًا «هل ما علمت مكتوم؟»، ثم أضرب عن السؤال بـ«أم» إلى ظنّ أشدّ: «أم حبلها مصروم». ويفرّق التِّبْرِيزِيّ بينها وبين «بل»: «إلا أن ما بعد «بل» يكون يقينا، وما بعد «أم» يكون شكا» [@tabrizi-ikhtiyarat، ج3 ص1600]. فالشاعر لم يبلغ اليقين بالقطيعة، وإنما يخشاها."
    - title: "الاستعارة في «حبلها... مصروم»"
      text: "في «حبلها» جعل الوصل حبلًا ممدودًا بينهما، ثم جعل القطيعة صرمًا لهذا الحبل. وهي الاستعارة عند عبد القاهر: أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "الإضمار قبل الذكر في «حبلها»"
      text: "لم يسمّ المرأة، وأعاد إليها الضمير من أول بيت، كأنها حاضرة في نفسه وفي نفس السامع لا تحتاج إلى اسم. وهذه قراءتنا لما يذكره التِّبْرِيزِيّ من أنه لم يجر لها ذكر."
    - title: "التصريع"
      text: "ختم الصدر بـ«مكتوم» على قافية العجز «مصروم»، والتصريع «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]."
  connection: "ثم يسأل سؤالًا ثالثًا: هل يُجزى الكبير الباكي إثر الأحبة يوم الفراق؟"
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الميم المضمومة، وقبلها ردف بالواو، فهي ميمية"
  scansion: "هَلْ مَا عَلِمْ / تَوَمَسْ / تُودِعْتَ مَكْ / تُومُو = مستفعلن / فعِلن / مستفعلن / فعْلن — أَمْ حَبْلُهَا / إِذْ نَأَتْ / كَلْيَوْمَ مَصْ / رُومُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]. والضرب هنا مقطوع «فعْلن»، وهو كذلك في القصيدة كلها، والعروض هنا مقطوعة مثله لأن البيت مصرّع. ودخل الخبن «فاعلن» الأولى في الصدر فصارت «فعِلن»، والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
