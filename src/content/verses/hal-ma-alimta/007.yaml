explained: false
first: "كَأَنَّ فَارَةَ مِسْكٍ فِي مَفَارِقِهَا"
second: "لِلْبَاسِطِ المُتَعَاطِي وَهْوَ مَزْكُومُ"
vocabulary:
  - term: "فارَةَ مِسْكٍ"
    text: "«وعاء المسك، وهو النافجة» [@tabrizi-ikhtiyarat، ج3 ص1603]."
  - term: "مَفارِقِها"
    text: "«جمع مَفْرِق الرأس» [@tabrizi-ikhtiyarat، ج3 ص1603]."
  - term: "البَاسِطِ المُتَعاطِي"
    text: "الذي يبسط يده إليها ليتناول [@tabrizi-ikhtiyarat، ج3 ص1603]، و«خصّ المزكوم، لأنه أضعف إدراكًا للرائحة» [@tabrizi-ikhtiyarat، ج3 ص1604]."
