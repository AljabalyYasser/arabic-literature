first: "صِفْرُ الوِشَاحَيْنِ مِلْءُ الدِّرْعِ خَرْعَبَةٌ"
second: "كَأَنَّهَا رَشَأٌ فِي البَيْتِ مَلْزُومُ"
meaning: "سلمى دقيقة الخصر حتى يفرغ عنها الوشاحان، ممتلئة الجسم حتى يمتلئ بها قميصها، تامّة الخلق ممدودة القامة، كأنها ظبي صغير رُبّي في البيت فأَلِف أهله."
vocabulary:
  - term: "صِفْرُ الوِشاحَيْنِ"
    text: "الصِّفر: الخالي، والوشاح كما ينقل محقق شرح التِّبْرِيزِيّ عن البَطَلْيَوْسِيّ «في هذا البيت: النطاق المشدود على الخصر» [@tabrizi-ikhtiyarat، ج3 ص1607]؛ يقول: «هي دقيقة الخصر» [@tabrizi-ikhtiyarat، ج3 ص1607]، فالنطاق يجول عليها كأنه فارغ."
  - term: "مِلْءُ الدِّرْعِ"
    text: "يملأ جسمها قميصها، «ودرع المرأة: قميصها» [@lisan، ج8 ص82]. وفي رواية «ملء المرط»، يقول التِّبْرِيزِيّ: «غليظة الكفل، و«مرطها» - وهو الإزار - يمتلئ منها» [@tabrizi-ikhtiyarat، ج3 ص1607]."
  - term: "خَرْعَبَةٌ"
    text: "«التامّة الخلق، المديدة القامة» [@tabrizi-ikhtiyarat، ج3 ص1607]."
  - term: "رَشَأٌ"
    text: "الظبي الصغير، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1607]."
  - term: "مَلْزُومُ"
    text: "مربّى في البيت لا يفارقه؛ «ثم شبّهها بغزال مربوب في البيت» [@tabrizi-ikhtiyarat، ج3 ص1607]."
context: "يأتي بعد أن ذكر بكاءه من ذكر سلمى (8–12)، فيرسم صورتها في بيت واحد قبل أن ينصرف إلى الناقة (14). وهو غزل بالجسد: خصر نحيل، وبدن ممتلئ يملأ القميص، وفي رواية «المرط» ردفان غليظان يملآن الإزار، كما يفسّر التِّبْرِيزِيّ. وهذا مقياس الجمال الذي يتكرر في الشعر الجاهلي."
syntax:
  - "«صِفرُ الوشاحين» خبر لمبتدأ محذوف تقديره: هي، مضاف ومضاف إليه، و«ملءُ الدرع» خبر ثان، و«خرعبةٌ» خبر ثالث."
  - "«كأنها رشأ» كأنّ واسمها الضمير وخبرها «رشأ»، و«في البيت» متعلق بـ«ملزوم»، و«ملزوم» نعت لـ«رشأ»."
morphology:
  - "«صِفْر» و«مِلْء» مصدران وُصف بهما، فيستوي فيهما المذكر والمؤنث."
  - "«الوشاحين» مثنى «وِشاح» على «فِعال»."
  - "«خَرْعَبة» رباعي على «فَعْلَلة»، و«ملزوم» اسم مفعول من لَزِم."
rhetoric:
  thesis: "صورة الجمال الجاهلي في بيت: خصر دقيق وبدن ممتلئ، ثم ظبي أليف يجمع الحسن إلى الأُنس."
  devices:
    - title: "الكناية في «صفر الوشاحين» و«ملء الدرع»"
      text: "لم يقل «دقيقة الخصر ممتلئة البدن»، بل ذكر الوشاح الفارغ والقميص الممتلئ، فدلّ بهما على الجسد الذي تحتهما. والكناية عند عبد القاهر أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الطباق بين «صفر» و«ملء»"
      text: "جمع في شطر واحد الخلوّ والامتلاء، فصار التضاد بين الكلمتين هو التضاد بين الخصر والبدن."
    - title: "التشبيه في «كأنها رشأ في البيت ملزوم»"
      text: "شبّهها بالظبي الصغير في نعومته وحسن عينيه، ثم قيّده بأنه «في البيت ملزوم»، فنفى عنه النفور الذي في الظباء. والشبه هنا من الضرب الذي يكون عند عبد القاهر «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
  connection: "ثم يتمنّى ناقة صلبة تلحقه بأواخر الحيّ الراحلين."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الميم المضمومة المردفة بالواو"
  scansion: "صِفْرُلْوِشَا / حَيْنِمِلْ / ءُدْدِرْعِخَرْ / عَبَتُنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — كَأَنْنَهَا / رَشَأُنْ / فِلْبَيْتِمَلْ / زُومُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "العروض مخبونة «فعِلن» والضرب مقطوع «فعْلن» [@atiq، ص48]. ودخل الخبن «مستفعلن» الأولى في العجز فصارت «متفعلن»، و«فاعلن» الأولى فيه فصارت «فعِلن»، والخبن «حذف الثاني الساكن» [@atiq، ص46]."
