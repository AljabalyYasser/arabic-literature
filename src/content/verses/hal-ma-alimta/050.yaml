explained: false
first: "وَقَدْ عَلَوْتُ قُتُودَ الرَّحْلِ يَسْفَعُنِي"
second: "يَوْمٌ تَجِيءُ بِهِ الجَوْزَاءُ مَسْمُومُ"
vocabulary:
  - term: "قُتُودَ الرَّحْلِ"
    text: "عيدانه، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1626]."
  - term: "يَسْفَعُنِي"
    text: "«يغيّر لوني، ويحرقني» [@tabrizi-ikhtiyarat، ج3 ص1626]."
  - term: "الجَوْزاءُ"
    text: "نجم تطلع في شدة الحر [@tabrizi-ikhtiyarat، ج3 ص1626]."
  - term: "مَسْمُومُ"
    text: "«تهبّ فيه السَّموم» [@tabrizi-ikhtiyarat، ج3 ص1626]، وهي الريح الحارة."
