explained: false
first: "أَبْيَضُ أَبْرَزَهُ لِلضِّحِّ رَاقِبُهُ"
second: "مُقَلَّدٌ قُضُبَ الرَّيْحَانِ مَفْغُومُ"
vocabulary:
  - term: "أَبْرَزَهُ لِلضِّحِّ"
    text: "«أي: أبرزه الخمّار، لتصيبه الريح» [@tabrizi-ikhtiyarat، ج3 ص1623]، والضِّحّ: الشمس."
  - term: "راقِبُهُ"
    text: "«الذي يرصد صلاحه وإدراكه» [@tabrizi-ikhtiyarat، ج3 ص1623]."
  - term: "مُقَلَّدٌ قُضُبَ الرَّيْحانِ"
    text: "عُلّقت أغصان الريحان على عنقه."
  - term: "مَفْغُومُ"
    text: "من قولهم: «فغمته رائحة الطيب، إذا سدّت أنفه» [@tabrizi-ikhtiyarat، ج3 ص1623]."
