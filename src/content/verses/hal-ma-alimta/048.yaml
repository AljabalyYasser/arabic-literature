first: "لَوْ يَيْسِرُونَ بِخَيْلٍ قَدْ يَسَرْتُ بِهَا"
second: "وَكُلُّ مَا يَسَرَ الأَقْوَامُ مَغْرُومُ"
vocabulary:
  - term: "لَوْ يَيْسِرُونَ بِخَيْلٍ"
    text: "«يقول: لو جرى العرف والعادة بالخيل لفعلت ذلك... ولكن جُعل ذلك في ذوات الأخفاف والأظلاف» [@tabrizi-ikhtiyarat، ج3 ص1625]."
  - term: "مَغْرُومُ"
    text: "من خرج عليه شيء غرمه، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1625]."
