explained: false
first: "فُوهُ كَشَقِّ العَصا لَأْيًا تَبَيَّنُهُ"
second: "أَسَكُّ ما يَسْمَعُ الأَصْواتَ مَصْلُومُ"
vocabulary:
  - term: "فُوهُ كَشَقِّ العَصا"
    text: "«أي: فوه متلاصق، ليس بمفتوح» [@tabrizi-ikhtiyarat، ج3 ص1610]."
  - term: "لَأْيًا"
    text: "«أي: بعد جهد» [@tabrizi-ikhtiyarat، ج3 ص1610]."
  - term: "أَسَكُّ"
    text: "الصغير الأذنين، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1610]."
  - term: "مَصْلُومُ"
    text: "«المقطوع الأذنين. والصلم خلقة في النعام» [@tabrizi-ikhtiyarat، ج3 ص1611]."
