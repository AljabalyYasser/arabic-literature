first: "حَتَّى تَلافَى وقَرْنُ الشَّمْسِ مُرْتَفِعٌ"
second: "أُدْحِيَّ عِرْسَيْنِ فِيهِ البَيْضُ مَرْكُومُ"
vocabulary:
  - term: "تَلافَى"
    text: "«تدارك» [@tabrizi-ikhtiyarat، ج3 ص1615]."
  - term: "عِرْسَيْنِ"
    text: "«هو والنعامة. هو عرس لها، وهي عرس له» [@tabrizi-ikhtiyarat، ج3 ص1615]."
  - term: "مَرْكُومُ"
    text: "ركب بعضه بعضًا لكثرته، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1614]."
