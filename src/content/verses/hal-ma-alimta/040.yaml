explained: false
first: "كَأْسُ عَزِيزٍ مِنَ الأَعْنَابِ عَتَّقَهَا"
second: "لِبَعْضِ أَحْيَانِهَا حَانِيَّةٌ حُومُ"
vocabulary:
  - term: "عَزِيزٍ"
    text: "الملك، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1620]."
  - term: "عَتَّقَها"
    text: "حبسها حتى قدمت."
  - term: "لِبَعْضِ أَحْيانِها"
    text: "«أي: أُعدّت ليوم عيد» [@tabrizi-ikhtiyarat، ج3 ص1620]."
  - term: "حانِيَّةٌ حُومُ"
    text: "«حانيّة»: «منسوبة إلى الحانة»، و«الحوم»: «الكثير» [@tabrizi-ikhtiyarat، ج3 ص1620]، وقيل جمع حائم، «أي: يحومون حولها، ويخدمونها» [@tabrizi-ikhtiyarat، ج3 ص1621]."
