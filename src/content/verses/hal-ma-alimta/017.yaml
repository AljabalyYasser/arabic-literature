explained: false
first: "تُلاحِظُ السَّوْطَ شَزْرًا وهْيَ ضامِزَةٌ"
second: "كَما تَوَجَّسَ طاوِي الكَشْحِ مَوْشُومُ"
vocabulary:
  - term: "شَزْرًا"
    text: "«النظر بمؤخر العين» [@tabrizi-ikhtiyarat، ج3 ص1609]."
  - term: "ضامِزَةٌ"
    text: "«التي لا ترغو من ضجر، ولا تجترّ» [@tabrizi-ikhtiyarat، ج3 ص1609]."
  - term: "تَوَجَّسَ"
    text: "تسمّع خائفًا."
  - term: "طاوِي الكَشْحِ مَوْشُومُ"
    text: "الثور الوحشي، «ضامر الجنبين والبطن»، و«لقوائمه خطط سود» [@tabrizi-ikhtiyarat، ج3 ص1609]."
