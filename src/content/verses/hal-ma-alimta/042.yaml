explained: false
first: "عانِيَّةٌ قَرْقَفٌ لَمْ تُطَّلَعْ سَنَةً"
second: "يَجُنُّها مُدْمَجٌ بِالطِّينِ مَخْتُومُ"
vocabulary:
  - term: "عانِيَّةٌ"
    text: "منسوبة إلى عانة، قرية من قرى الجزيرة الفراتية، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1622]."
  - term: "قَرْقَفٌ"
    text: "«التي يأخذ شاربها مثل الرعدة» [@tabrizi-ikhtiyarat، ج3 ص1622]."
  - term: "لَمْ تُطَّلَعْ سَنَةً"
    text: "«لم يُنظر إليها سنة، بل كان يجنّها دنّ، أُدمج رأسه بالطين، وخُتم عليه» [@tabrizi-ikhtiyarat، ج3 ص1622]."
