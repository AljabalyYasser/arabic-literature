explained: false
first: "ظَلَّتْ تَرَقْرَقُ فِي النّاجُودِ يَصْفِقُها"
second: "وَلِيدُ أَعْجَمَ بِالكَتّانِ مَفْدُومُ"
vocabulary:
  - term: "تَرَقْرَقُ"
    text: "«تذهب وتجيء» [@tabrizi-ikhtiyarat، ج3 ص1622]."
  - term: "النّاجُودِ"
    text: "«أول ما يخرج من البِزال. وقيل: الناجود: الباطية» [@tabrizi-ikhtiyarat، ج3 ص1622]."
  - term: "يَصْفِقُها"
    text: "يمزجها، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1622]."
  - term: "وَلِيدُ أَعْجَمَ"
    text: "خادم ملك أعجمي، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1622]."
  - term: "مَفْدُومُ"
    text: "من الفِدام، «وهي: الخرقة يشدّها الغلام على فيه، إذا أراد أن يسقي القوم» [@tabrizi-ikhtiyarat، ج3 ص1622]."
