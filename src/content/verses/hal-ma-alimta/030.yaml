first: "تَحُفُّهُ هِقْلَةٌ سَطْعَاءُ خَاضِعَةٌ"
second: "تُجِيبُهُ بِزِمَارٍ فِيهِ تَرْنِيمُ"
vocabulary:
  - term: "هِقْلَةٌ"
    text: "النعامة، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1616]."
  - term: "سَطْعاءُ"
    text: "«طويلة العنق» [@tabrizi-ikhtiyarat، ج3 ص1616]."
  - term: "خاضِعَةٌ"
    text: "«التي أمالت رأسها للرعي» [@tabrizi-ikhtiyarat، ج3 ص1616]."
  - term: "زِمارٍ"
    text: "«صوت الأنثى» [@tabrizi-ikhtiyarat، ج3 ص1616]."
  - term: "تَرْنِيمُ"
    text: "«التطريب» [@tabrizi-ikhtiyarat، ج3 ص1616]."
