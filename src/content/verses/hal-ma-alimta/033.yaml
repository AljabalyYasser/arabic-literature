first: "وَالجُودُ نَافِيَةٌ لِلْمَالِ مَهْلِكَةٌ"
second: "وَالبُخْلُ بَاقٍ لِأَهْلِيهِ وَمَذْمُومُ"
meaning: "الجود يذهب بالمال ويُهلكه، والبخل يُبقي المال لأهله، لكنهم يُذمّون به. فالجواد يخسر ماله ويربح الحمد، والبخيل يحفظ ماله ويخسر الثناء."
vocabulary:
  - term: "نافِيَةٌ لِلْمالِ"
    text: "مُذهِبة له؛ «أي: الجود يُفني المال ويهلكه، والبخل يوفّره، وأهله مذمومون» [@tabrizi-ikhtiyarat، ج3 ص1617]."
  - term: "مَهْلِكَةٌ"
    text: "سبب لهلاكه وفنائه."
  - term: "أَهْلِيهِ"
    text: "أهله، جمع «أهل» جمعًا سالمًا."
  - term: "مَذْمُومُ"
    text: "يلحقه الذمّ؛ و«الذمّ لصاحب البخل، لا للبخل نفسه» [@tabrizi-ikhtiyarat، ج3 ص1617]."
context: "ثاني بيتي الجود في الميمية، وهو تتمّة للبيت السابق: إن كان الحمد لا يُشترى إلا بالمال، فالجود يُذهب المال، والبخل يُبقيه ويُبقي معه الذمّ. ويقدّمه صانع الديوان مع البيت 34 على «والحمد لا يشترى»، كما يذكر محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1616]."
syntax:
  - "«الجود» مبتدأ، و«نافية» خبر أول، و«للمال» متعلق بها، و«مهلكة» خبر ثان. وأُنّث الخبران والمبتدأ مذكّر، والأقرب أن التاء للمبالغة كما في «راوية» و«علّامة»، أو أن المعنى: الجود خصلة نافية. وهذه قراءتنا."
  - "«والبخل» مبتدأ، و«باقٍ» خبر أول مرفوع بضمة مقدّرة على الياء المحذوفة، و«لأهليه» متعلق به، و«ومذموم» خبر ثان معطوف بالواو."
morphology:
  - "«نافية» اسم فاعل من «نفى» المعتل الآخر."
  - "«مَهْلِكة» على «مَفْعِلة» من هلك، وهو وزن يدلّ على السبب، كما يقال: الولد مَبْخَلة مَجْبَنة."
  - "«باقٍ» اسم فاعل منقوص من «بقي»، و«أهليه» جمع مذكر سالم لـ«أهل»، مجرور بالياء، وحُذفت نونه للإضافة."
rhetoric:
  thesis: "ميزان بين خصلتين: المال يذهب بالجود ويبقى بالبخل، لكن الذمّ يلحق الباقي لا الذاهب."
  devices:
    - title: "المقابلة بين الشطرين"
      text: "قابل «الجود» بـ«البخل»، و«نافية مهلكة» بـ«باقٍ»، فاستوى الشطران في البناء واختلفا في النتيجة. ثم أضاف إلى الشطر الثاني كلمة ليس لها مقابل: «ومذموم»، فكانت هي الحكم. وهذه قراءتنا."
    - title: "الإسناد المجازي في «البخل... مذموم»"
      text: "جعل البخل هو المذموم، والذمّ في الحقيقة لصاحبه، كما يقول التِّبْرِيزِيّ: «الذمّ لصاحب البخل، لا للبخل نفسه» [@tabrizi-ikhtiyarat، ج3 ص1617]. وهذا مما يجعله عبد القاهر مجازًا في الإسناد لا في اللفظ، وهو «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط» [@dalail، ص293]."
    - title: "التأخير في «ومذموم»"
      text: "أخّر الذمّ إلى آخر البيت بعد أن ذكر بقاء المال، فجاء الحكم مفاجئًا بعد مدح ظاهر للبخل، وكأنه يقول: نعم يبقى المال، ولكن."
  connection: "ثم يضرب للمال مثلًا: صوف صغار الغنم، منه الوافي ومنه المجزوز."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الميم المضمومة المردفة بالواو"
  scansion: "وَلْجُودُنَا / فِيَتُنْ / لِلْمَالِمَهْ / لِكَتُنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — وَلْبُخْلُبَا / قِنْلِأَهْ / لِيهِي وَمَذْ / مُومُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "العروض مخبونة «فعِلن» والضرب مقطوع «فعْلن» [@atiq، ص48]. ودخل الخبن «فاعلن» الأولى في الصدر، والخبن «حذف الثاني الساكن» [@atiq، ص46]. وتُشبَع كسرة الهاء في «أهليهِ» فتُنطق «لِيهِي»."
