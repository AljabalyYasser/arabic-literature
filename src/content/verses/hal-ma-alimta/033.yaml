    status: "رواية المرزوقي والاختيارين والديوان"
    note: "وفي رواية ابن الأنباري «مَهْلَكة»، كما يذكر محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1617]."
  - reading: "والبُخْلُ مُبْقٍ لِأَهْلِيهِ ومَذْمُومُ"
    status: "رواية الاختيارين والديوان"
    note: "[@tabrizi-ikhtiyarat، ج3 ص1617]."
  - reading: "والجُودُ ناقِيَةٌ لِلْمالِ مُهْلِكَةٌ"
    status: "رواية التِّبْرِيزِيّ"
    note: "بالقاف، من نقيتُ العظم إذا استخرجت نِقْيه، والرواة على «نافية» كما يذكر المحقق [@tabrizi-ikhtiyarat، ج3 ص1617]."
