explained: false
first: "والجَهْلُ ذُو عَرَضٍ لا يُسْتَرادُ لَهُ"
second: "والحِلْمُ آوِنَةً فِي النّاسِ مَعْدُومُ"
vocabulary:
  - term: "لا يُسْتَرادُ"
    text: "«لا يراد ولا يطلب» [@tabrizi-ikhtiyarat، ج3 ص1618]."
  - term: "ذُو عَرَضٍ"
    text: "«يعرض لك، وأنت لا تريده، ولا تطلبه» [@tabrizi-ikhtiyarat، ج3 ص1618]."
  - term: "آوِنَةً"
    text: "«أحيانًا» [@tabrizi-ikhtiyarat، ج3 ص1618]."
