first: "فَلَا تَزَيُّدُهُ فِي مَشْيِهِ نَفِقٌ"
second: "وَلَا الزَّفِيفُ دُوَيْنَ الشَّدِّ مَسْؤُومُ"
vocabulary:
  - term: "تَزَيُّدُهُ"
    text: "«التزيّد: المشي فوق العنق» [@tabrizi-ikhtiyarat، ج3 ص1611]."
  - term: "نَفِقٌ"
    text: "«السريع الذهاب» [@tabrizi-ikhtiyarat، ج3 ص1611]."
  - term: "الزَّفِيفُ"
    text: "عَدْوٌ «دون الشدّ قليلًا» [@tabrizi-ikhtiyarat، ج3 ص1612]، والشدّ: العدو."
  - term: "مَسْؤُومُ"
    text: "«المملول» [@tabrizi-ikhtiyarat، ج3 ص1612]."
