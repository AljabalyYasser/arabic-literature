explained: false
first: "كَأَنَّهَا خَاضِبٌ زُعْرٌ قَوَادِمُهُ"
second: "أَجْنَى لَهُ بِاللِّوَى شَرْيٌ وَتَنُّومُ"
vocabulary:
  - term: "خاضِبٌ"
    text: "ذكر النعام، «الظليم رعى الربيع، فعلته خضرة» [@tabrizi-ikhtiyarat، ج3 ص1609]."
  - term: "زُعْرٌ قَوادِمُهُ"
    text: "الزُّعر جمع أزعر، «وهو القليل الريش»، والقوادم «من كبار الريش» [@tabrizi-ikhtiyarat، ج3 ص1609]."
  - term: "أَجْنَى لَهُ"
    text: "أدرك ثمره فصار جنًى يُجنى."
  - term: "شَرْيٌ وتَنُّومُ"
    text: "الشَّرْي «شجر الحنظل»، والتَّنّوم «شجرة لها حبّ... ترعاه النعام» [@tabrizi-ikhtiyarat، ج3 ص1610]."
