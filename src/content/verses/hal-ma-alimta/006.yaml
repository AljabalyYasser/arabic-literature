explained: false
first: "يَحْمِلْنَ أُتْرُجَّةً نَضْخُ العَبِيرِ بِهَا"
second: "كَأَنَّ تَطْيَابَهَا فِي الأَنْفِ مَشْمُومُ"
vocabulary:
  - term: "أُتْرُجَّةً"
    text: "كنى بها عن المرأة «لطيب رائحتها» [@tabrizi-ikhtiyarat، ج3 ص1603]."
  - term: "نَضْخُ العَبِيرِ"
    text: "أثره الكثيف، والنضخ بالخاء «يكون اسمًا للخاثر» [@tabrizi-ikhtiyarat، ج3 ص1603]، والعبير أخلاط من الطيب تُجمع بالزعفران، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1603]."
  - term: "تَطْيابَها"
    text: "طيبها، «مصدر كالترداد والتذراف» [@tabrizi-ikhtiyarat، ج3 ص1603]."
