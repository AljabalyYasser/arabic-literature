explained: false
first: "يَكَادُ مَنْسِمُهُ يَخْتَلُّ مُقْلَتَهُ"
second: "كَأَنَّهُ حَاذِرٌ لِلنَّخْسِ مَشْهُومُ"
vocabulary:
  - term: "مَنْسِمُهُ"
    text: "«ظفره» [@tabrizi-ikhtiyarat، ج3 ص1612]."
  - term: "يَخْتَلُّ مُقْلَتَهُ"
    text: "يشكّها؛ يقول: «يزجّ برجليه زجًّا شديدًا، ويخفض عنقه، فيكاد منسمه يشكّ عينه» [@tabrizi-ikhtiyarat، ج3 ص1612]."
  - term: "النَّخْسِ"
    text: "أن يُغرز جنب الدابة أو مؤخرها بعود، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1612]."
  - term: "مَشْهُومُ"
    text: "«الفزع المروّع» [@tabrizi-ikhtiyarat، ج3 ص1612]."
