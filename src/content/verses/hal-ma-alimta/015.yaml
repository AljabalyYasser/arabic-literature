explained: false
first: "كَأَنَّ غِسْلَةَ خِطْمِيٍّ بِمِشْفَرِها"
second: "فِي الخَدِّ مِنْها وفِي اللَّحْيَيْنِ تَلْغِيمُ"
vocabulary:
  - term: "غِسْلَةَ خِطْمِيٍّ"
    text: "«ما غُسل به الرأس» [@tabrizi-ikhtiyarat، ج3 ص1608]، والخِطْمِيّ نبات يُغسل به الرأس."
  - term: "مِشْفَرِها"
    text: "شفتها."
  - term: "تَلْغِيمُ"
    text: "من اللُّغام، «وهو زبد تخلطه خضرة مما رعت» [@tabrizi-ikhtiyarat، ج3 ص1608]."
