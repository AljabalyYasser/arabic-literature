first: "فَطافَ طَوْفَيْنِ بِالأُدْحِيِّ يَقْفُرُهُ"
second: "كَأَنَّهُ حاذِرٌ لِلنَّخْسِ مَشْهُومُ"
vocabulary:
  - term: "الأُدْحِيِّ"
    text: "مبيض النعام، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1614]."
  - term: "يَقْفُرُهُ"
    text: "«القفر: تتبّع الأثر»، وكرّر التطواف «ليستأنس بالأدحي، ولينظر: هل تغيّر عما عهد له؟» [@tabrizi-ikhtiyarat، ج3 ص1614]."
