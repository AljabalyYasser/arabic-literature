first: "وَالحَمْدُ لَا يُشْتَرَى إِلَّا لَهُ ثَمَنٌ"
second: "مِمَّا يَضِنُّ بِهِ الأَقْوَامُ مَعْلُومُ"
meaning: "الثناء لا يُنال بلا مقابل، بل له ثمن معروف من الأموال التي يبخل بها الناس، فمن أراد الحمد فليبذل ما يضنّ به غيره."
vocabulary:
  - term: "الحَمْدُ"
    text: "الثناء والذكر الحسن بين الناس."
  - term: "يَضِنُّ"
    text: "يبخل."
  - term: "مَعْلُومُ"
    text: "معروف مقدَّر؛ و«معناه: لا يُشترى الحمد إلا بأثمان، تضنّ بها النفوس. أي: يُغالى به، فيُبذل فيه المضنون» [@tabrizi-ikhtiyarat، ج3 ص1616]."
context: "من الحِكَم التي يقطع بها وصف الرحلة قبل مجلس الخمر (31–38). ويروي الجاحظ هذا البيت مع خمسة من أخواته متتابعة: «وقال علقمة بن عبدة»، في «قطعة من أشعار الاتعاظ» [@hayawan، ج7 ص87]، فهي عنده مقطوعة حكمة تُروى وحدها. ويقدّم صانع الديوان عليه البيتين 33 و34، كما يذكر محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1616]."
syntax:
  - "«الحمد» مبتدأ، و«لا يُشترى» جملة فعلية في محل رفع خبر، ونائب الفاعل ضمير الحمد."
  - "«إلا» أداة استثناء ملغاة، وجملة «له ثمن» في محل نصب حال من نائب الفاعل، جاءت بلا واو، والتقدير: لا يُشترى إلا وله ثمن. و«له» خبر مقدّم، و«ثمن» مبتدأ مؤخّر."
  - "«مما يضنّ به الأقوام» جار ومجرور متعلق بمحذوف نعت لـ«ثمن»، و«ما» موصولة، و«يضنّ به الأقوام» صلتها، و«معلوم» نعت ثان لـ«ثمن»."
morphology:
  - "«يُشترى» مضارع مبني للمجهول من «اشترى» على «افتعل»، معتل الآخر."
  - "«يضنّ» مضارع «ضنّ» المضعّف، ومصدره الضنّ والضنانة."
  - "«الأقوام» جمع «قوم» على «أفعال»."
rhetoric:
  thesis: "الكرم عنده صفقة رابحة: المال يُدفع ثمنًا لثناء يبقى بعد صاحبه."
  devices:
    - title: "الاستعارة في «يُشترى... ثمن»"
      text: "في «يُشترى» و«ثمن» جعل الحمد سلعة تُشترى، والمال ثمنها، والكريم مشتريًا، فصار الثناء شيئًا يُقتنى. وهي الاستعارة عند عبد القاهر: أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "القصر بالنفي والاستثناء"
      text: "في «لا يُشترى إلا له ثمن» نفى أن يُنال الحمد بغير ثمن، ثم أثبت الثمن بعد «إلا»، فصار البيت قاعدة لا استثناء فيها. وهذه قراءتنا."
    - title: "الإبهام في «مما يضنّ به الأقوام»"
      text: "لم يسمّ الثمن مالًا، بل وصفه بأنه ما يبخل به الناس، فجعل قيمة الثمن في عزّته على النفوس لا في مقداره، وهو ما يعبّر عنه التِّبْرِيزِيّ بقوله: «فيُبذل فيه المضنون» [@tabrizi-ikhtiyarat، ج3 ص1616]."
  connection: "ثم يضع الجود والبخل في ميزان: الجود يُفني المال، والبخل يُبقيه ويُبقي معه الذمّ."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الميم المضمومة المردفة بالواو"
  scansion: "وَلْحَمْدُلَا / يُشْتَرَى / إِلْلَا لَهُو / ثَمَنُنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — مِمْمَا يَضِنْ / نُبِهِلْ / أَقْوَامُمَعْ / لُومُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "العروض مخبونة «فعِلن» والضرب مقطوع «فعْلن» [@atiq، ص48]. ودخل الخبن «فاعلن» الأولى في العجز، والخبن «حذف الثاني الساكن» [@atiq، ص46]. وتُشبَع ضمة الهاء في «لهُ» فتُنطق «لَهُو»."
