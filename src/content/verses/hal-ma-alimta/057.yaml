first: "يَهْدِي بِها أَكْلَفُ الخَدَّيْنِ مُخْتَبَرٌ"
second: "مِنَ الجِمالِ كَثِيرُ اللَّحْمِ عَيْثُومُ"
vocabulary:
  - term: "يَهْدِي بِها"
    text: "«يعني فحلها» [@tabrizi-ikhtiyarat، ج3 ص1630]."
  - term: "أَكْلَفُ"
    text: "من «الكُلفة: حمرة فيها سواد، وهو مستحب» [@tabrizi-ikhtiyarat، ج3 ص1630]."
  - term: "مُخْتَبَرٌ"
    text: "«مجرَّب» [@tabrizi-ikhtiyarat، ج3 ص1630]."
  - term: "عَيْثُومُ"
    text: "«الضخم الجرم، الكثير اللحم» [@tabrizi-ikhtiyarat، ج3 ص1630]."
