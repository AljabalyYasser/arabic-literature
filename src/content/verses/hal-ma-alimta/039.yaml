explained: false
first: "قَدْ أَشْهَدُ الشَّرْبَ فِيهِمْ مِزْهَرٌ رَنِمٌ"
second: "والقَوْمُ تَصْرَعُهُمْ صَهْباءُ خُرْطُومُ"
vocabulary:
  - term: "الشَّرْبَ"
    text: "جماعة الشاربين."
  - term: "مِزْهَرٌ رَنِمٌ"
    text: "«يعني به: عودًا له رنيم، أي: صوت طيّب» [@tabrizi-ikhtiyarat، ج3 ص1619]."
  - term: "صَهْباءُ خُرْطُومُ"
    text: "خمر، والخرطوم أول ما ينزل منها من الدنّ، «وذلك أصفى لها»، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1619]."
