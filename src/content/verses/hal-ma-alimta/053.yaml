explained: false
first: "لا فِي شَظاها ولا أَرْساغِها عَتَبٌ"
second: "ولا السَّنابِكُ أَفْناهُنَّ تَقْلِيمُ"
vocabulary:
  - term: "شَظاها"
    text: "«الشظى: عظم لاصق بالذراع، رقيق» [@tabrizi-ikhtiyarat، ج3 ص1627]."
  - term: "عَتَبٌ"
    text: "عيب؛ «وأصل العتب: ما ينتأ من جانب البئر والجبل» [@tabrizi-ikhtiyarat، ج3 ص1628]."
  - term: "السَّنابِكُ"
    text: "أطراف الحوافر، وهي «صلبة لم تأكلها الأرض» [@tabrizi-ikhtiyarat، ج3 ص1628]."
