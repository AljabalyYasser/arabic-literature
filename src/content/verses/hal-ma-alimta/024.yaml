explained: false
first: "وَضّاعَةٌ كَعِصِيِّ الشِّرْعِ جُؤْجُؤُهُ"
second: "كَأَنَّهُ بِتَناهِي الرَّوْضِ عُلْجُومُ"
vocabulary:
  - term: "وَضّاعَةٌ"
    text: "من «الوضع: السير السريع»، والهاء للمبالغة [@tabrizi-ikhtiyarat، ج3 ص1613]."
  - term: "عِصِيِّ الشِّرْعِ"
    text: "«العود الذي يُضرب به»، والشرع: الأوتار، «شبّه صدر الظليم، في نتوئه، بصدر البربط» [@tabrizi-ikhtiyarat، ج3 ص1613]."
  - term: "جُؤْجُؤُهُ"
    text: "صدره."
  - term: "تَناهِي الرَّوْضِ"
    text: "حيث ينتهي السيل ويستقر من الرياض، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1613]."
  - term: "عُلْجُومُ"
    text: "قال المَرْزُوقِيّ: «وهو طير الماء، وقد يكون ذكر الضفادع» [@tabrizi-ikhtiyarat، ج3 ص1613]."
