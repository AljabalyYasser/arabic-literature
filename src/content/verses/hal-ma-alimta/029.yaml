explained: false
first: "صَعْلٌ كَأَنَّ جَنَاحَيْهِ وَجُؤْجُؤَهُ"
second: "بَيْتٌ أَطَافَتْ بِهِ خَرْقَاءُ مَهْجُومُ"
vocabulary:
  - term: "صَعْلٌ"
    text: "«الخفيف الرأس والعنق» [@tabrizi-ikhtiyarat، ج3 ص1615]."
  - term: "خَرْقاءُ"
    text: "امرأة «غير صَناع»؛ يقول: يرفع جناحيه في عدوه ويحطّهما، فكأنه بيت شعر أو صوف ترفعه هذه المرأة فيسقط [@tabrizi-ikhtiyarat، ج3 ص1615]."
  - term: "مَهْجُومُ"
    text: "«مصروع» [@tabrizi-ikhtiyarat، ج3 ص1616]."
