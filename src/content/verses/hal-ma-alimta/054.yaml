explained: false
first: "سُلّاءَةٌ كَعَصا النَّهْدِيِّ غُلَّ لَها"
second: "ذُو فَيْئَةٍ مِنْ نَوَى قُرّانَ مَعْجُومُ"
vocabulary:
  - term: "سُلّاءَةٌ"
    text: "«يعني: فرسه. شبّهها بشوكة النخلة، لإرهاف صدرها» [@tabrizi-ikhtiyarat، ج3 ص1628]."
  - term: "كَعَصا النَّهْدِيِّ"
    text: "«أي: عصا نبع»، وخصّ نَهْدًا «لأن النبع ينبت في بلادهم» [@tabrizi-ikhtiyarat، ج3 ص1628]."
  - term: "غُلَّ لَها"
    text: "«أي: أُدخل لها في باطن حافرها نسور، كأنها في الصلابة نوى تمر «قرّان»» [@tabrizi-ikhtiyarat، ج3 ص1629]."
  - term: "ذُو فَيْئَةٍ"
    text: "«يريد: نوى له مرجوع»، لصلابته «إذا اعتلفه الإبل يرجع في البعر صحيحًا» [@tabrizi-ikhtiyarat، ج3 ص1629]."
  - term: "قُرّانَ"
    text: "«قرية باليمامة لبني حنيفة» [@tabrizi-ikhtiyarat، ج3 ص1629]."
  - term: "مَعْجُومُ"
    text: "«المعضوض» [@tabrizi-ikhtiyarat، ج3 ص1629]."
