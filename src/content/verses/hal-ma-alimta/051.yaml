first: "حامٍ كَأَنَّ أُوارَ النّارِ شامِلُهُ"
second: "دُونَ الثِّيابِ ورَأْسُ المَرْءِ مَعْمُومُ"
vocabulary:
  - term: "أُوارَ النّارِ"
    text: "«لهبها وتوهّجها» [@tabrizi-ikhtiyarat، ج3 ص1627]."
  - term: "دُونَ الثِّيابِ"
    text: "«يريد: أن الثياب لا يقي من الحرّ، ولا يغني» [@tabrizi-ikhtiyarat، ج3 ص1627]."
  - term: "مَعْمُومُ"
    text: "«أي: يوقّى بالعمامة» [@tabrizi-ikhtiyarat، ج3 ص1627]."
