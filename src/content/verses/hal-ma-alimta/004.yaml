explained: false
first: "رَدَّ الإِمَاءُ جِمَالَ الحَيِّ فَاحْتَمَلُوا"
second: "فَكُلُّهَا بِالتَّزِيدِيَّاتِ مَعْكُومُ"
vocabulary:
  - term: "الإِماءُ"
    text: "الجواري المملوكات."
  - term: "احْتَمَلُوا"
    text: "رحلوا بأحمالهم."
  - term: "التَّزِيدِيّاتِ"
    text: "«ضرب من البرود، نُسبت إلى قبيلة يقال لها: تَزِيد» من قُضاعة [@tabrizi-ikhtiyarat، ج3 ص1601]."
  - term: "مَعْكُومُ"
    text: "المشدود عليه حمله [@tabrizi-ikhtiyarat، ج3 ص1601]، والعِكْم: العِدْل [@tabrizi-ikhtiyarat، ج3 ص1602]."
