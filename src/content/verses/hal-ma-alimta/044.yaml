first: "كَأَنَّ إِبْرِيقَهُمْ ظَبْيٌ عَلَى شَرَفٍ"
second: "مُفَدَّمٌ بِسَبَا الكَتَّانِ مَرْثُومُ"
meaning: "إبريق الخمر بين الشاربين، بعنقه المرفوع، كأنه ظبي واقف على مكان مرتفع يمدّ عنقه، وعلى فمه خرقة من الكتان تُصفّى بها الخمر، وقد احمرّ فمه من الخمر كأنه أنف كُسر فدَمِي."
vocabulary:
  - term: "إِبْرِيقَهُمْ"
    text: "إناء الخمر ذو العنق، والضمير للشَّرْب الذين ذكرهم في البيت 39."
  - term: "شَرَفٍ"
    text: "مكان مرتفع من الأرض."
  - term: "مُفَدَّمٌ"
    text: "من الفِدام، وهي في البيت السابق «الخرقة يشدّها الغلام على فيه، إذا أراد أن يسقي القوم» [@tabrizi-ikhtiyarat، ج3 ص1622]، وهي هنا على فم الإبريق."
  - term: "سَبا الكَتّانِ"
    text: "«أراد بـ«السبا»: السبيبة. وقيل: أراد: السبائب، فحذف منه، وهي الشقاق» [@tabrizi-ikhtiyarat، ج3 ص1623]، أي قطع الكتان الرقيقة."
  - term: "مَرْثُومُ"
    text: "«الذي قد رُثم أنفه، أي: كُسر» [@tabrizi-ikhtiyarat، ج3 ص1622]، يريد احمرار فمه بالخمر."
context: "من مجلس الشراب في آخر الميمية (39–45)، وهو أشهر أبياتها عند النقاد. قال المُبَرِّد: «ومن التشبيه المستحسن قول علقمة بن عبدة»، وأنشده ثم قال: «فهذا حسن جدا» [@kamil، ج3 ص32]. ويذكر ابن قُتَيْبة أن عَدِيّ بن زيد «أوّل من شبّه أباريق الخمر بالظّباء» [@ibn-qutayba، ج1 ص224]، فلا ندري أسبق عَدِيٌّ إلى الصورة أم عَلْقَمة. والأبيات في [«المجون: قصصه وأشعاره»](/path/1/al-mujun/)."
syntax:
  - "«كأنّ» حرف تشبيه ونصب، و«إبريقهم» اسمها، و«ظبي» خبرها، و«على شرف» جار ومجرور نعت لـ«ظبي»."
  - "«مفدَّم» خبر ثان لـ«كأنّ»، و«بسبا» متعلق به، و«الكتان» مضاف إليه، و«مرثوم» خبر ثالث."
morphology:
  - "«مفدَّم» اسم مفعول من «فدّم» على «فعّل»، وفي البيت السابق «مفدوم» من الثلاثي، ويقال: «مفدوم ومفدَّم» [@tabrizi-ikhtiyarat، ج3 ص1622]."
  - "«سبا» محذوف من «سبائب»، حذفه للضرورة كما يقول ابن رَشِيق: «يريد «بسبائب الكتان» فحذف اضطرارا؛ لأن الوزن لا يستقيم له إلا بعد الحذف» [@ibn-rashiq، ج1 ص253]."
  - "«مرثوم» اسم مفعول من رثم."
rhetoric:
  thesis: "لوحة من مجلس الشراب: الإبريق ظبي، والخرقة على فمه لثام، والخمر على شفته دم."
  devices:
    - title: "التشبيه المركب في «كأن إبريقهم ظبي على شرف»"
      text: "لم يشبّه الإبريق بالظبي في لونه وحده، بل في هيئته: عنق طويل مرفوع، ورأس مشرف، والجسم قائم على مكان عالٍ، كما يقف الظبي على مرتفع يتشوّف. وهذا ما استحسنه المُبَرِّد [@kamil، ج3 ص32]. والشبه منتزع من هيئة كاملة، وهو عند عبد القاهر من التمثيل: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "الحذف للضرورة في «سبا»"
      text: "في «بسبا الكتان» حذف بعض الكلمة، ويضربه ابن رَشِيق مثلًا لحذف لا يُستحسن: «لا كما قال علقمة بن عبدة» ثم أنشد البيت [@ibn-rashiq، ج1 ص253]، أي أن الحذف هنا ضرورة الوزن لا بلاغة الإيجاز."
    - title: "الاستعارة في «مرثوم»"
      text: "في «مرثوم» أعار الإبريق أنفًا مكسورًا يدمى، والدم هو الخمر الحمراء على فمه، فتمّت به صورة الظبي الجريح. وهي الاستعارة عند عبد القاهر: أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وهذه قراءتنا لتفسير التِّبْرِيزِيّ."
  connection: "ثم يتمّ صفة الإبريق: أبيض أبرزه الخمّار للريح، مقلَّد بقضبان الريحان."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الميم المضمومة المردفة بالواو"
  scansion: "كَأَنْنَإِبْ / رِيقَهُمْ / ظَبْيُنْ عَلَى / شَرَفِنْ = متفعلن / فاعلن / مستفعلن / فعِلن — مُفَدْدَمُنْ / بِسَبَلْ / كَتْتَانِمَرْ / ثُومُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "العروض مخبونة «فعِلن» والضرب مقطوع «فعْلن» [@atiq، ص48]. ودخل الخبن «مستفعلن» الأولى في الشطرين و«فاعلن» الأولى في العجز، والخبن «حذف الثاني الساكن» [@atiq، ص46]."
