explained: false
first: "إِذا تَزَغَّمَ مِنْ حافاتِها رُبَعٌ"
second: "حَنَّتْ شَغامِيمُ فِي حافاتِها كُومُ"
vocabulary:
  - term: "تَزَغَّمَ"
    text: "«حنّ حنينًا خفيًّا، أي: تزغّم لأمّه لترضعه» [@tabrizi-ikhtiyarat، ج3 ص1630]."
  - term: "رُبَعٌ"
    text: "الفصيل المولود في أول الربيع، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1629]."
  - term: "شَغامِيمُ"
    text: "«المسانّ التوام» [@tabrizi-ikhtiyarat، ج3 ص1630]."
  - term: "كُومُ"
    text: "«العظام الأسنمة» [@tabrizi-ikhtiyarat، ج3 ص1630]."
