explained: false
first: "والمالُ صُوفُ قَرارٍ يَلْعَبُونَ بِهِ"
second: "عَلَى نِقادَتِهِ وافٍ ومَجْلُومُ"
vocabulary:
  - term: "قَرارٍ"
    text: "«صغار الغنم» [@tabrizi-ikhtiyarat، ج3 ص1617]."
  - term: "يَلْعَبُونَ بِهِ"
    text: "«يتداولونه، ويعبثون به» [@tabrizi-ikhtiyarat، ج3 ص1617]."
  - term: "نِقادَتِهِ"
    text: "صغار الغنم، و«على نقادته» «أي: صغر أجسامه» [@tabrizi-ikhtiyarat، ج3 ص1618]."
  - term: "وافٍ ومَجْلُومُ"
    text: "الوافي «كثير»، والمجلوم «مجزوز بالجَلَم»، «وهذا مثل» [@tabrizi-ikhtiyarat، ج3 ص1617]: «منهم من يُعطى القليل، ومنهم من يُعطى الكثير» [@tabrizi-ikhtiyarat، ج3 ص1618]."
