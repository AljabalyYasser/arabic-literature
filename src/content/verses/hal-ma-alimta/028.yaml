first: "يُوحِي إِلَيْهَا بِإِنْقَاضٍ وَنَقْنَقَةٍ"
second: "كَمَا تَرَاطَنُ فِي أَفْدَانِهَا الرُّومُ"
meaning: "يكلّم الظليمُ أنثاه بأصوات خفيّة من إنقاض ونقنقة لا يفهمها غيرهما، كما يتكلم الروم في قصورهم بلغتهم التي لا يفهمها العربي."
vocabulary:
  - term: "يُوحِي إِلَيْها"
    text: "«أي: إلى النعامة» [@tabrizi-ikhtiyarat، ج3 ص1615]، والإيحاء: الكلام الخفيّ والإشارة."
  - term: "إِنْقاضٍ ونَقْنَقَةٍ"
    text: "«ضربان من صوته» [@tabrizi-ikhtiyarat، ج3 ص1615]."
  - term: "تَراطَنُ"
    text: "«التراطن: ما لا يُفهم من الكلام» [@tabrizi-ikhtiyarat، ج3 ص1615]."
  - term: "أَفْدانِها"
    text: "قصورها، جمع فَدَن، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1615]."
context: "من وصف الظليم، وهو ذكر النعام، الذي شبّه به ناقته (18–30): يرعى الحنظل والتنّوم، ثم يتذكر بيضه فيعدو إليه، ويبلغه وقد ارتفعت الشمس، فيكلّم أنثاه. وهذا الوصف أطول ما في الميمية، وأخذ منه ذو الرُّمّة صورة جناحي الظليم في البيت 29، كما يقول المُبَرِّد [@kamil، ج3 ص27]."
syntax:
  - "«يوحي» فعل مضارع فاعله ضمير الظليم، و«إليها» متعلق به، و«بإنقاض» متعلق به أيضًا، و«نقنقة» معطوف على «إنقاض»."
  - "«كما» الكاف حرف جر، و«ما» مصدرية، والمصدر المؤول من «تراطن الروم» مجرور بالكاف، والجار والمجرور نعت لمصدر محذوف: إيحاءً كتراطن الروم. و«في أفدانها» متعلق بـ«تراطن»، و«الروم» فاعل."
morphology:
  - "«إنقاض» مصدر «أنقض» على «إفعال»، و«نقنقة» مصدر رباعي مضعّف على «فَعْلَلة» يحكي الصوت."
  - "«تراطنُ» أصله «تتراطن» على «تتفاعل»، حُذفت إحدى التاءين تخفيفًا، وفيه معنى المشاركة."
  - "«أفدان» جمع «فَدَن» على «أفعال»."
rhetoric:
  thesis: "من أطرف تشبيهات الميمية: صوت الطائر يناجي أنثاه في عشّه يصير لغة أعجمية في قصر."
  devices:
    - title: "التشبيه التمثيلي في «كما تراطن في أفدانها الروم»"
      text: "لم يشبّه صوتًا بصوت فحسب، بل شبّه هيئة الظليم يناجي أنثاه بأصوات لا يفهمها السامع، بهيئة الروم يتراطنون في قصورهم: كلام بين قوم في مكانهم، والغريب يسمعه ولا يفقهه. فالشبه منتزع من الحال كلها، وهو التمثيل عند عبد القاهر الذي يقول: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]."
    - title: "الاستعارة في «يوحي»"
      text: "في «يوحي» أعار الطائر فعل الإنسان الذي يسرّ إلى صاحبه بالكلام، فصار الظليم وأنثاه متحادثين. وهي الاستعارة عند عبد القاهر: أن «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "محاكاة الصوت في «نقنقة»"
      text: "اختار لفظًا يحكي الصوت نفسه بتكرار النون والقاف، فيسمع القارئ النقنقة قبل أن يفهم معناها. وهذه قراءتنا."
  connection: "ثم يصفه صغير الرأس، يرفع جناحيه ويحطّهما كبيت تطيف به خرقاء."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الميم المضمومة المردفة بالواو"
  scansion: "يُوحِي إِلَيْ / هَا بِإِنْ / قَاضِنْ وَنَقْ / نَقَتِنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — كَمَا تَرَا / طَنُفِي / أَفْدَانِهَرْ / رُومُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "العروض مخبونة «فعِلن» والضرب مقطوع «فعْلن» [@atiq، ص48]. ودخل الخبن «مستفعلن» و«فاعلن» الأوليين في العجز، والخبن «حذف الثاني الساكن» [@atiq، ص46]."
