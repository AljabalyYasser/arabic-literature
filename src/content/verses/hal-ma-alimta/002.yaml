explained: false
first: "أَمْ هَلْ كَبِيرٌ بَكَى لَمْ يَقْضِ عَبْرَتَهُ"
second: "إِثْرَ الأَحِبَّةِ يَوْمَ البَيْنِ مَشْكُومُ"
vocabulary:
  - term: "كَبِيرٌ"
    text: "يعني نفسه، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1601]."
  - term: "لَمْ يَقْضِ عَبْرَتَهُ"
    text: "«لم يستشف بها»، و«العبرة»: الدمعة [@tabrizi-ikhtiyarat، ج3 ص1601]."
  - term: "مَشْكُومُ"
    text: "«المجزيّ، وقيل: هو من العطية» [@tabrizi-ikhtiyarat، ج3 ص1601]، أي: هل يُجزى الباكي على بكائه بوصل؟"
