explained: false
first: "تَشْفِي الصُّداعَ ولا يُؤْذِيكَ صالِبُها"
second: "ولا يُخالِطُها فِي الرَّأْسِ تَدْوِيمُ"
vocabulary:
  - term: "صالِبُها"
    text: "الحمّى الشديدة؛ «يصفها بطيب الرائحة، وأن سورتها لا تورث الحمّى» [@tabrizi-ikhtiyarat، ج3 ص1621]."
  - term: "تَدْوِيمُ"
    text: "الدُّوار، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1621]."
