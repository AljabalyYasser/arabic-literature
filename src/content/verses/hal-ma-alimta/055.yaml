first: "تَتْبَعُ جُونًا إِذَا مَا هُيِّجَتْ زَجِلَتْ"
second: "كَأَنَّ دُفًّا عَلَى العَلْيَاءِ مَهْزُومُ"
vocabulary:
  - term: "تَتْبَعُ جُونًا"
    text: "«أي: تتبع هذه الفرس إبلًا جونًا، تُسقى من ألبانها»، والجون «أقلّ سوادًا من الدهم» [@tabrizi-ikhtiyarat، ج3 ص1629]."
  - term: "زَجِلَتْ"
    text: "«الزجل: ارتفاع الصوت» [@tabrizi-ikhtiyarat، ج3 ص1629]."
  - term: "مَهْزُومُ"
    text: "«المشقوق» [@tabrizi-ikhtiyarat، ج3 ص1629]."
