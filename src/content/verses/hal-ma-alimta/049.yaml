explained: false
first: "وقَدْ أُصاحِبُ فِتْيانًا طَعامُهُمُ"
second: "خُضْرُ المَزادِ ولَحْمٌ فِيهِ تَنْشِيمُ"
vocabulary:
  - term: "فِتْيانًا"
    text: "«غزاة، طالت مدتهم في الغزو» [@tabrizi-ikhtiyarat، ج3 ص1625]."
  - term: "خُضْرُ المَزادِ"
    text: "«المطحلبة، التي قد اخضرّت مما يُحمل فيها الماء» [@tabrizi-ikhtiyarat، ج3 ص1626]."
  - term: "تَنْشِيمُ"
    text: "«ابتداء ظهور التغيّر والنتن في اللحم» [@tabrizi-ikhtiyarat، ج3 ص1625]."
