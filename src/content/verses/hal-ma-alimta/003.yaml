explained: false
first: "لَمْ أَدْرِ بِالبَيْنِ حَتَّى أَزْمَعُوا ظَعَنًا"
second: "كُلُّ الجِمَالِ قُبَيْلَ الصُّبْحِ مَزْمُومُ"
vocabulary:
  - term: "أَزْمَعُوا"
    text: "«الإزماع: الإجماع على الشيء» [@tabrizi-ikhtiyarat، ج3 ص1601]، أي عزموا."
  - term: "ظَعَنًا"
    text: "«أي: ظاعنين» [@tabrizi-ikhtiyarat، ج3 ص1601]، والظعن الرحيل."
  - term: "مَزْمُومُ"
    text: "قد شُدّ زمامه، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1601]."
