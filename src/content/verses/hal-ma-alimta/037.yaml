first: "وَمَنْ تَعَرَّضَ لِلْغِرْبَانِ يَزْجُرُهَا"
second: "عَلَى سَلَامَتِهِ لَا بُدَّ مَشْؤُومُ"
meaning: "من تصدّى للغربان يطردها خوفًا من شؤمها وهو سالم لم يصبه شيء، فهو المشؤوم لا محالة: الشؤم في تطيّره لا في الغراب."
vocabulary:
  - term: "تَعَرَّضَ لِلْغِرْبانِ"
    text: "تصدّى لها، والغراب عندهم طائر يُتشاءم به."
  - term: "يَزْجُرُها"
    text: "يطردها ويصيح بها؛ «يقول: الغربان يُتشاءم بها، فمن تعرّض لها، يزجرها ويطردها، مخافة أن يصيبه الشرّ، فلا بدّ أن يقع فيما يخاف ويحذر» [@tabrizi-ikhtiyarat، ج3 ص1619]."
  - term: "عَلَى سَلامَتِهِ"
    text: "وهو في سلامة، «في موضع الحال» [@tabrizi-ikhtiyarat، ج3 ص1619]."
  - term: "مَشْؤُومُ"
    text: "يلحقه الشؤم."
context: "من الحِكَم في آخر الرحلة. وفي معناه قولان يجمعهما شرح التِّبْرِيزِيّ: قول ابن الأنباري الذي في المفردات، أن المتطيّر يقع فيما يخاف، وقول المَرْزُوقِيّ: «كأنه ينكر الإيمان بالطيرة» [@tabrizi-ikhtiyarat، ج3 ص1619]. ويضعه الجاحظ في باب «من أنكر الطيرة»، لكنه ينسبه هناك إلى سلامة بن جندل [@hayawan، ج3 ص214]، ثم يرويه في موضع آخر لعلقمة مع خمسة من أبيات هذه الحكمة [@hayawan، ج7 ص87]. فنسبته في الحيوان مضطربة، وهو في رواية المفضليات لعلقمة."
syntax:
  - "«من» اسم موصول مبتدأ، و«تعرّض» صلته، و«للغربان» متعلق به، و«مشؤوم» خبر المبتدأ، كما يقول التِّبْرِيزِيّ: «و«مشؤوم» في موضع الخبر» [@tabrizi-ikhtiyarat، ج3 ص1619]."
  - "جملة «يزجرها» في محل نصب حال من فاعل «تعرّض»، و«على سلامته» جار ومجرور في موضع الحال كذلك."
  - "«لا بدّ» «لا» نافية للجنس و«بدّ» اسمها، والخبر محذوف، والجملة معترضة للتوكيد، فهي «تأكيد للخطب، بمنزلة «لا محالة»» [@tabrizi-ikhtiyarat، ج3 ص1619]."
morphology:
  - "«تعرّض» على «تفعّل» من العُرْض، وفيه معنى التكلّف والقصد."
  - "«الغِرْبان» جمع «غُراب» على «فِعْلان»."
  - "«مشؤوم» اسم مفعول من شأم، والشؤم ضد اليُمن."
rhetoric:
  thesis: "حكمة تقلب عادة جاهلية: المتطيّر بالغراب هو المشؤوم، لا الغراب."
  devices:
    - title: "الاحتراس في «على سلامته»"
      text: "قيّد المتطيّر بأنه «على سلامته»، أي لم يصبه شيء، فبيّن أن الشؤم لم يأتِه من الغراب بل من تعرّضه له، ولولا هذا القيد لظُنّ أنه يزجر الغربان عن شرّ نزل به. وهذه قراءتنا على قول المَرْزُوقِيّ."
    - title: "التوكيد في «لا بدّ»"
      text: "أدخل «لا بدّ» بين المبتدأ والخبر، فقطع الكلام قبل الحكم ليؤكّده: لا محالة. ويفسّرها التِّبْرِيزِيّ بأنها «تأكيد للخطب» [@tabrizi-ikhtiyarat، ج3 ص1619]."
    - title: "الكناية عن التطيّر في «يزجرها»"
      text: "لم يذكر الطِّيَرة باسمها، بل ذكر فعل المتطيّر: يتعرّض للغربان ويزجرها، فدلّ بالفعل على العقيدة التي وراءه. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
  connection: "ثم يعمّم الحكمة: كل حصن، مهما طالت سلامته، لا بدّ مهدوم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الميم المضمومة المردفة بالواو"
  scansion: "وَمَنْ تَعَرْ / رَضَلِلْ / غِرْبَانِيَزْ / جُرُهَا = متفعلن / فعِلن / مستفعلن / فعِلن — عَلَى سَلَا / مَتِهِي / لَابُدْدَمَشْ / أُومُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "العروض مخبونة «فعِلن» والضرب مقطوع «فعْلن» [@atiq، ص48]. ودخل الخبن «مستفعلن» و«فاعلن» الأوليين في الشطرين، والخبن «حذف الثاني الساكن» [@atiq، ص46]. وتُشبَع كسرة الهاء في «سلامتِهِ» فتُنطق «مَتِهِي»."
variants:
  - reading: "وكُلُّ حِصْنٍ وإِنْ طالَتْ سَلامَتُهُ"
    status: "ترتيب الاختيارين"
    note: "قدّم صاحب «الاختيارين» عليه البيت 38، كما يذكر محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1619]."
