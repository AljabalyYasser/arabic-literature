first: "وَالْمَرْءُ مَا عَاشَ مَمْدُودٌ لَهُ أَمَلٌ"
second: "لَا تَنْتَهِي الْعَيْنُ حَتَّى يَنْتَهِي الْأَثَرُ"
vocabulary:
- term: "الْأَثَرُ"
  text: "«الأَثَرُ: الأَجل، وَسُمِّيَ بِهِ لأَنه يَتْبَعُ الْعُمْرَ» [@lisan، ج4 ص6]. يقول: لا تكفّ عينه عن الطمع حتى ينقضي أجله."
