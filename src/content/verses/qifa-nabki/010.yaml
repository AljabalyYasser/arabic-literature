first: "أَلَا رُبَّ يَوْمٍ لَكَ مِنْهُنَّ صَالِحٍ"
second: "وَلَا سِيَّمَا يَوْمٌ بِدَارَةِ جُلْجُلِ"
meaning: "كم من يوم طيب كان لك مع النساء، ولا يوم منها مثل يوم دارة جُلْجُل. قال الزَّوْزَنِيّ: «يريد أن ذلك اليوم كان أحسن الأيام وأتمها» [@zawzani، ص39]."
vocabulary:
  - term: "صَالِحٍ"
    text: "طيب. والمعنى عند ابن الأَنْبارِيّ: «ألا رب يوم كان فيه لك سرور وغبطة» [@ibn-al-anbari، ص33]."
  - term: "سِيَّمَا"
    text: "السِّيّ: المِثْل. «يقال: هما سيّان، أي مثلان» [@zawzani، ص39]."
  - term: "دَارَةِ جُلْجُلِ"
    text: "«غدير بعينه» [@zawzani، ص39]. قال ابن الكَلْبِيّ: عند غمر ذي كِنْدة، وقال الأَصْمَعِيّ وأبو عُبَيْدة: في الحِمى [@ibn-al-anbari، ص33]."
syntax:
  - "«أَلَا»: حرف استفتاح وتنبيه. و«رُبَّ» حرف جر، و«يومٍ» مجرور بها."
  - "«لَكَ»: متعلق بمحذوف صفة لـ«يوم»، و«مِنْهُنَّ» متعلق بما تعلق به «لك»، و«صالحٍ» صفة لـ«يوم»."
  - "«وَلَا سِيَّمَا»: لا بد أن يسبقها الواو. و«سِيّ» اسم «لا» النافية للجنس، وخبرها محذوف. ويجوز في الاسم بعدها الجر والرفع، والنصب إذا كان نكرة: فالجر على الإضافة و«ما» زائدة، والرفع على أنه خبر لمبتدأ محذوف و«ما» موصولة أو نكرة موصوفة، والنصب على التمييز [@sharrab، ج2 ص289]."
  - "وابن الأَنْبارِيّ يرويه بالرفع: «والتقدير: ولا مثل الذي هو يوم. فما بمعنى الذي، واليوم مرفوع بإضمار هو» [@ibn-al-anbari، ص33]. و«بِدَارَةِ» متعلق بمحذوف صفة لـ«يوم»."
morphology:
  - "«رُبّ» فيها لغات: رُبَّ ورَبَّ ورُبْ ورُبَ، وتلحقها التاء فيقال: رُبَّت [@zawzani، ص39]."
  - "«سِيَّمَا» يقال بالتشديد والتخفيف: «سِيَما وسِيَّما» [@ibn-al-anbari، ص33]."
  - "«دارة» مؤنث «دار»؛ «يقال: دار ودارة، وغدير وغديرة» [@ibn-al-anbari، ص33]."
rhetoric:
  thesis: "ينتقل من الحزن إلى الذكرى السعيدة، ثم يخص من أيامه كلها يومًا واحدًا."
  devices:
    - title: "التخصيص بـ«لا سيما»"
      text: "قال الزَّوْزَنِيّ: «فأفادت لا سيما التفضيل والتخصيص» [@zawzani، ص39]. وقال ابن الأَنْبارِيّ: «معناه التعجب من فضل هذا اليوم، أي هو يوم يفضل الأيام» [@ibn-al-anbari، ص33]."
    - title: "«ربّ» للتكثير"
      text: "«ربّ» في أصلها للتقليل، «ثم ربما حُملت على كم في المعنى فيراد بها التكثير» [@zawzani، ص39]. وهي هنا للتكثير: أيام كثيرة طيبة."
    - title: "خطاب النفس"
      text: "قال «لك» ولم يقل «لي»، فخاطب نفسه كأنه يحدّث رجلًا آخر، كما قال قبلها «كدأبك»."
  connection: "ثم يروي ما جرى في ذلك اليوم: «ويوم عقرت للعذارى مطيتي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَلَا رُبْ / بَ يَوْمِنْ لَ / كَ مِنْهُنْ / نَ صَالِحِنْ = فعولن / مفاعيلُ / فعولن / مفاعلن — وَلَا سِيْ / يَمَا يَوْمُنْ / بِدَارَ / ةِ جُلْجُلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل «مفاعيلن» في التفعيلة الثانية من الصدر الكَفُّ، وهو حذف السابع الساكن، فصارت «مفاعيلُ»، وهو جائز في حشو الطويل، ولا يجتمع فيها الكف والقَبْض [@ahda-sabil، ص28]. ودخل القبضُ «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]."
context: "يروى أن يوم دارة جُلْجُل يوم لقي فيه امرؤ القَيْس صاحبته وصواحبها عند غدير، وهو خبر يعدّه شوقي ضيف منتحلًا [@deif، ج1 ص237–238]."
variants:
  - reading: "وَلَا سِيَّمَا يَوْمٍ بِدَارَةِ جُلْجُلِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "بالجر، وهو أرجح الأوجه عند النحويين [@zawzani، ص39] [@sharrab، ج2 ص289]."
  - reading: "أَلَا رُبَّ يَوْمٍ صَالِحٍ لَكَ مِنْهُمَا"
    status: "رواية في كتب النحو"
    note: "والضمير فيها للمرأتين في الأبيات قبله [@sharrab، ج2 ص289]. وبهذه الرواية يسلم الصدر من الكَفّ."
