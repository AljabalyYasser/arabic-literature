first: "أَلَا رُبَّ خَصْمٍ فِيكِ أَلْوَى رَدَدْتُهُ"
second: "نَصِيحٍ عَلَى تَعْذَالِهِ غَيْرِ مُؤْتَلِ"
meaning: "كم من خصم شديد الخصومة لامني فيك ونصحني، لم يقصّر في لومه، فرددته ولم أنزجر. قال الزَّوْزَنِيّ: «وتحرير المعنى أنه يخبرها ببلوغ حبه إياها الغاية القصوى، حتى أنه لا يرتدع عنه بردع ناصح ولا ينجع فيه لوم لائم» [@zawzani، ص58]."
vocabulary:
  - term: "أَلْوَى"
    text: "«الشديد الخصومة» [@ibn-al-anbari، ص73]، «كأنه يلوي خصمه عن دعواه» [@zawzani، ص58]."
  - term: "نَصِيحٍ"
    text: "الناصح [@zawzani، ص58]."
  - term: "تَعْذَالِهِ"
    text: "العَذْل، أي اللوم: «عذلته عذلا وتعذالا» [@ibn-al-anbari، ص74]."
  - term: "غَيْرِ مُؤْتَلِ"
    text: "«غير تارك نصحي بجهده. يقال: ما ألوت وما آليت، أي ما قصرت» [@ibn-al-anbari، ص74]."
syntax:
  - "«وألا افتتاح للكلام، والخصم خفض برب، وفيك صلة الخصم، وألوى نعت للخصم، ورددته خبر لرب، ونصيح نعت للخصم، وغير مؤتل نعت للخصم أيضا» [@ibn-al-anbari، ص74]."
  - "وتقدير ترتيبه عند الزَّوْزَنِيّ: «ألا رُبّ خصم ألوى نصيح على تعذاله غير مؤتل رددته» [@zawzani، ص58]."
morphology:
  - "«أَلْوَى» على «أفعل» صفة، من «لوى»: «يقال: لوى الرجل غريمه ليا وليانا» [@ibn-al-anbari، ص74]."
  - "«تَعْذَال» مصدر على «تَفْعال»، وهو وزن يدل على الكثرة."
  - "«مُؤْتَلٍ» اسم فاعل من «ائتلى» على «افتعل»، منقوص؛ «الألو والائتلاء: التقصير» [@zawzani، ص58]."
rhetoric:
  thesis: "آخر بيت في الغزل: حبّه أقوى من كل لائم."
  devices:
    - title: "«ربّ» للتكثير"
      text: "لم يكن خصمًا واحدًا، بل خصوم كثيرون؛ فكثرة اللائمين تزيد ثبات الحب."
    - title: "تكديس الصفات"
      text: "ألوى، ونصيح، وغير مؤتل: خصم شديد، مخلص في نصحه، لا يقصّر؛ فكلما قوي الخصم عظم ردّه."
    - title: "الخطاب"
      text: "«فيك»: الخطاب لصاحبته، فالبيت ليس خبرًا عن الماضي بل برهان يقدمه لها على حبه."
  connection: "وبه ينتهي النصف الأول. ثم يأتي الليل: «وليل كموج البحر أرخى سدوله»، وموعده المحطة 1.6."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَلَا رُبْ / بَ خَصْمِنْ فِي / كِ أَلْوَى / رَدَدْتُهُو = فعولن / مفاعيلن / فعولن / مفاعلن — نَصِيحِنْ / عَلَى تَعْذَا / لِهِي غَيْ / رِ مُؤْتَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "هاء «تعذاله» تُشبع فتُنطق «تَعْذَالِهِي». جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "يقول شوقي ضيف إنه «رجع في معلقته بعد حديثه عن بيضة الخدر يصف لصاحبته شقاءه بحبها وأنه لا يستمع فيه إلى نصيحة ناصح، ولا إلى عذل عاذل» [@deif، ج1 ص252]."
