first: "دَرِيرٍ كَخُذْرُوفِ الْوَلِيدِ أَمَرَّهُ"
second: "تَتَابُعُ كَفَّيْهِ بِخَيْطٍ مُوَصَّلِ"
meaning: "يديم الجري ويتابعه، سريعًا كخذروف الصبي إذا أحكم فتل خيطه وتتابعت يداه في تدويره. قال الزَّوْزَنِيّ: «هو يدرّ العدو والجري أي: يديمهما ويواصلهما... ويسرع فيهما إسراع خذروف الصبي» [@zawzani، ص68]."
vocabulary:
  - term: "دَرِيرٍ"
    text: "«مستدر في العدو» [@ibn-al-anbari، ص88]، أي متتابع الجري كما يدرّ اللبن."
  - term: "خُذْرُوفِ"
    text: "«الخرارة التي يلعب بها الصبيان تسمع لها صوتا: خرَّ خرَّ» [@ibn-al-anbari، ص88]. وعند الزَّوْزَنِيّ: «حصاة مثقوبة يجعل الصبيان فيه خيطًا فيديرها الصبي على رأسه» [@zawzani، ص67]."
  - term: "الْوَلِيدِ"
    text: "الصبي [@zawzani، ص67]."
  - term: "أَمَرَّهُ"
    text: "«من الإمرار، وهو إحكام الفتل» [@ibn-al-anbari، ص88]."
  - term: "مُوَصَّلِ"
    text: "خيط «قد لعب به حتى خف وأخلق وملس، فتقطع خيطه فوصل، فهو أسرع لدورانه» [@ibn-al-anbari، ص88]."
syntax:
  - "«والدرير نعت لما تقدم قبله، والكاف نعت للدرير وهي خافضة للخذروف، والخذروف مضاف إلى الوليد» [@ibn-al-anbari، ص88]."
  - "«أَمَرَّهُ تَتَابُعُ كَفَّيْهِ»: «والتتابع مرتفع بأمرّه، وهو مضاف إلى كفيه، والباء صلة التتابع، وهي خافضة للخيط، وموصل نعت له» [@ibn-al-anbari، ص88]. والجملة صفة للخذروف."
morphology:
  - "«دَرِير» فعيل، يجوز أن يكون بمعنى فاعل، أو بمعنى «مُفعِل» من الإدرار، «كالحكيم بمعنى المحكم» [@zawzani، ص67]."
  - "«أَمَرّ» رباعي مضعف من «مرّ»."
  - "«مُوَصَّل» اسم مفعول من المضعف «وصّل»."
rhetoric:
  thesis: "سرعة لا تنقطع: الفرس كلعبة صبي تدور ولا تكفّ."
  devices:
    - title: "التشبيه"
      text: "شبّه الفرس في سرعته ودوام عدوه بالخذروف في دورانه. قال شوقي ضيف: «وما أشبهه في سرعة انطلاقه بلعبة الخذروف الدوارة التي يلعب بها الصبيان» [@deif، ج1 ص254]."
    - title: "دقة التفصيل"
      text: "لم يكتفِ بالخذروف، بل ذكر يدي الصبي المتتابعتين، والخيط المحكم، ثم الخيط الموصَّل، لأن الخيط الذي قُطع ثم وُصل صار أملس فهو «أسرع لدورانه» [@ibn-al-anbari، ص88]. وكل تفصيل يزيد السرعة."
    - title: "صورة من الحياة اليومية"
      text: "يأخذ الشاعر صورته من لعب الصبيان في الحي، فيقرّب سرعة الفرس من شيء رآه كل سامع."
  connection: "ثم يجمع أربعة تشبيهات في بيت: «له إطلا ظبي وساقا نعامة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "دَرِيرِنْ / كَخُذْرُوفِلْ / وَلِيدِ / أَمَرْرَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — تَتَابُ / عُ كَفْفَيْهِي / بِخَيْطِنْ / مُوَصْصَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "هاء «كَفَّيْهِ» تُشبع فتُنطق «كَفْفَيْهِي» ليستقيم الوزن. دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "من التشبيهات التي استحسنها الناس لامرئ القَيْس، ذكره ابن سَلّام في بابها [@ibn-sallam، ج1 ص84]."
variants:
  - reading: "أَمَرَّهُ تَقَلُّبُ كَفَّيْهِ بِخَيْطٍ مُوَصَّلِ"
    status: "رواية أخرى"
    note: "«أي تقلبهما بالخرارة» [@ibn-al-anbari، ص88]. وبها يرويه شوقي ضيف [@deif، ج1 ص254]."
