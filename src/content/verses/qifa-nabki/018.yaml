first: "وَيَوْمًا عَلَى ظَهْرِ الْكَثِيبِ تَعَذَّرَتْ"
second: "عَلَيَّ وَآلَتْ حَلْفَةً لَمْ تَحَلَّلِ"
meaning: "ويومًا على ظهر كثيب الرمل تشدّدت عليّ صاحبتي، وحلفت يمينًا لم تستثن فيها أن تهجرني. قال الزَّوْزَنِيّ: «وقد تشددت العشيقة والْتَوت، وساءت عشرتها يومًا على ظهر الكثيب المعروف، وحلفت حلفًا لم تستثن فيه أنها تصارمني وتهاجرني» [@zawzani، ص45]."
vocabulary:
  - term: "الْكَثِيبِ"
    text: "«رمل كثير، والجمع أكثبة وكُثُب وكثبان» [@zawzani، ص44]."
  - term: "تَعَذَّرَتْ"
    text: "«تشددت» [@ibn-al-anbari، ص42]. وقال السِّجِسْتانيّ: «أي لم نجدها على ما نريد» [@ibn-al-anbari، ص42]."
  - term: "آلَتْ"
    text: "«حلفت» [@ibn-al-anbari، ص42]."
  - term: "لَمْ تَحَلَّلِ"
    text: "«التحلل في اليمين: الاستثناء» [@zawzani، ص45]، أي لم تقل «إن شاء الله»، فيمينها قاطعة."
syntax:
  - "«وَيَوْمًا»: «اليوم منصوب بتعذرت» [@ibn-al-anbari، ص42]، أي ظرف زمان."
  - "«حَلْفَةً»: «نصب حلفة لأنها حلت محل الإيلاء كأنه قال: وآلت إيلاء»، أي مفعول مطلق من غير لفظ الفعل [@zawzani، ص45]."
  - "«لَمْ تَحَلَّلِ»: أصله «تتحلّل»، حُذفت إحدى التاءين، وجُزم بلم وكُسر للقافية. والجملة صفة لـ«حلفة»."
morphology:
  - "«آلَتْ» من «آلى» على «أفعل»: حلف. «واسم اليمين الأَلِيَّة والأَلوة والأُلوة معًا» [@zawzani، ص44–45]."
  - "«حَلْفَة» اسم مرة على «فَعْلة»؛ «الحلفة: المرة» [@zawzani، ص45]."
  - "«تَعَذَّرَت» على «تفعّلت» من العذر."
rhetoric:
  thesis: "بين أيام الوصال يوم امتناع: صاحبته قاسية، ويمينها قاطعة."
  devices:
    - title: "المقابلة بين الأيام"
      text: "عدّد أيامًا سعيدة: «يوم بدارة جُلْجُل»، «ويوم عقرت»، «ويوم دخلت الخدر»، ثم جاء بـ«ويومًا» تعذرت فيه. فالغزل عنده ليس انتصارًا دائمًا."
    - title: "دقة «لم تحلّل»"
      text: "اليمين التي لا استثناء فيها لا رجعة عنها؛ فالقيد يجعل الهجر أشد."
    - title: "تمهيد للعتاب"
      text: "بعد هذا البيت مباشرة يقول «أفاطم مهلًا بعض هذا التدلل»؛ فامتناعها هنا هو سبب العتاب هناك."
  connection: "ثم يلتفت إلى فاطمة: «أفاطم مهلًا بعض هذا التدلل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَيَوْمَنْ / عَلَى ظَهْرِلْ / كَثِيبِ / تَعَذْذَرَتْ = فعولن / مفاعيلن / فعولُ / مفاعلن — عَلَيْيَ / وَآلَتْ حَلْ / فَتَنْ لَمْ / تَحَلْلَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "قال الزَّوْزَنِيّ: «ويحتمل أن يكون صفة حال اتفقت له مع عنيزة، ويحتمل أنها اتفقت مع المرضع التي وصفها» [@zawzani، ص45]، أي في البيتين قبله."
