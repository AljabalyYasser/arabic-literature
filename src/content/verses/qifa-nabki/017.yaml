first: "إِذَا مَا بَكَى مِنْ خَلْفِهَا انْصَرَفَتْ لَهُ"
second: "بِشِقٍّ وَتَحْتِي شِقُّهَا لَمْ يُحَوَّلِ"
meaning: "إذا بكى طفلها من خلفها مالت إليه بنصف جسدها فأرضعته، ونصفها الآخر تحتي لم تحوّله عني. قال ابن الأَنْبارِيّ: «يقول: كانت تحتي، فإذا بكى الصبي انصرفت له بشق ترضعه وهي تحتي بعد. وإنما تفعل هذا لأن هواها معي» [@ibn-al-anbari، ص42]. وقال الزَّوْزَنِيّ: «إذا ما بكى الصبي من خلف المرضع انصرفت إليه بنصفها الأعلى فأرضعته وأرضته وتحتي نصفها الأسفل لم تحوله عني، وصف غاية ميلها إليه» [@zawzani، ص44]، وولعها به، فلم يشغلها عنه ما يشغل الأمهات عن كل شيء. فالمشهد مشهد جماع صريح، يقطعه بكاء الطفل فلا ينقطع."
vocabulary:
  - term: "مِنْ خَلْفِهَا"
    text: "من ورائها، والضمير للمرضع، والباكي طفلها «ذو التمائم»."
  - term: "انْصَرَفَتْ لَهُ"
    text: "مالت إليه."
  - term: "بِشِقٍّ"
    text: "«شقّ الشيء: نصفه» [@zawzani، ص44]."
  - term: "لَمْ يُحَوَّلِ"
    text: "لم يُنقل عن موضعه."
syntax:
  - "«إِذَا مَا بَكَى»: «وما صلة، كأنه قال: إذا بكى. وما في (بكى) يعود على ذي تمائم. وانصرفت جواب إذا، والهاء في له يعود على ما في بكى» [@ibn-al-anbari، ص42]. والصلة في كلامهم: الحرف الزائد للتوكيد."
  - "«بِشِقٍّ»: جار ومجرور متعلق بـ«انصرفت»، أي بنصفها."
  - "«وَتَحْتِي شِقُّهَا لَمْ يُحَوَّلِ»: الواو للحال، و«شِقُّهَا» مبتدأ، وجملة «لَمْ يُحَوَّلِ» خبره، و«تَحْتِي» ظرف قُدّم وهو متعلق بالخبر. والجملة كلها حال من فاعل «انصرفت»."
  - "«يُحَوَّلِ»: مضارع مبني للمجهول مجزوم بـ«لم»، وحُرّك بالكسر لإطلاق القافية."
morphology:
  - "«انْصَرَفَتْ» على «انْفَعَلَتْ»، وهو بناء المطاوعة: صرفها شيء فانصرفت."
  - "«يُحَوَّل» مضارع «حُوِّلَ» المبني للمجهول، من «حَوَّلَ» على «فَعَّلَ»، والتضعيف فيه للتعدية."
  - "«شِقّ» بكسر الشين: النصف، اسم لا مصدر."
rhetoric:
  thesis: "يتمّ البيت حجة البيت السابق بصورة لا لبس فيها: جسد المرأة يقسمه بكاء الطفل نصفين، نصف للأمومة ونصف للعاشق. وهو أصرح ما في المعلقة، وأكثر ما وقف عنده النقاد منها."
  devices:
    - title: "المقابلة"
      text: "قابل بين «بِشِقٍّ» و«شِقُّهَا»، وبين «انْصَرَفَتْ لَهُ» و«لَمْ يُحَوَّلِ»: نصف يتحرك ونصف يثبت. والمقابلة أن يُؤتى بمعنيين ثم بما يقابلهما. ومن هذا التقابل وحده يُفهم ما قاله الزَّوْزَنِيّ إنه «وصف غاية ميلها إليه» [@zawzani، ص44]."
    - title: "معنى المعنى"
      text: "لم يقل: كانت تؤثرني على ولدها، بل رسم المشهد وترك السامع يستنتج منه الحكم. وهذا ما سمّاه عبد القاهر الجُرْجانيّ «معنى المعنى»، وهو «أن تعقل من اللفظ معنى، ثم يفضي بك ذلك المعنى إلى معنى آخر» [@dalail، ص263]. فالمعنى الأول صورة الجسد المنقسم، والثاني شدة هواها له."
    - title: "فحش المعنى وجودة الشعر"
      text: "على هذا البيت وسابقه بنى قُدامة بن جعفر قاعدة في النقد، فقال فيمن عابهما: «ويذكر أن هذا معنى فاحش، وليس فحاشة المعنى في نفسه مما يزيل جودة الشعر فيه، كما لا يعيب جودة النجارة في الخشب مثلًا رداءته في ذاته» [@naqd-al-shir، ص5]. يريد أن الناقد يحكم على صنعة الشاعر في المعنى، لا على المعنى نفسه، كما يُحكم على صنعة النجار لا على نوع الخشب."
  connection: "ثم ينتقل إلى يوم آخر امتنعت فيه صاحبته: «ويومًا على ظهر الكثيب تعذّرت»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "إِذَا مَا / بَكَى مِنْ خَلْ / فِهَنْ صَ / رَفَتْ لَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — بِشِقْقِنْ / وَتَحْتِي شِقْ / قُهَا لَمْ / يُحَوْوَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]، وجاء العَجُز تامًّا. وتسقط همزة الوصل في «انصرفت» في درج الكلام، فتتصل نون «خلفها» بالصاد: «خَلْفِهَنْصَرَفَتْ»."
context: "البيت تتمة لسابقه، والضمائر فيه للمرضع وطفلها. وقد أورد ابن قُتَيْبة البيتين معًا في باب ما يعاب على امرئ القَيْس، ثم ردّ: «قال أبو محمد: وليس هذا عندى عيبا»، وعلّل بأن الحامل والمرضع لا تريدان الرجال [@ibn-qutayba، ج1 ص135]، وأبو محمد هو ابن قُتَيْبة نفسه. وأوردهما المَرْزُبانيّ فيما عيب عليه من «فجوره وعهره» [@muwashshah، ص34]. فالخلاف بين القدماء لم يكن في أن البيتين صريحان، بل في أن الصراحة عيب في الشعر أم لا."
