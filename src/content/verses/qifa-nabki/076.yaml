first: "وَمَرَّ عَلَى الْقَنَانِ مِنْ نَفَيَانِهِ"
second: "فَأَنْزَلَ مِنْهُ الْعُصْمَ مِنْ كُلِّ مَنْزِلِ"
meaning: "ومرّ على جبل القَنان ما تطاير من رشاش المطر، فأنزل الوعول من كل موضع فيه. قال الزَّوْزَنِيّ: «فأنزل الأوعال العصم من كل موضع من هذا الجبل، لهولها من وقع قطره على الجبل وفرط انصبابه» [@zawzani، ص75]."
vocabulary:
  - term: "الْقَنَانِ"
    text: "«جبل بني أَسَد» [@ibn-al-anbari، ص104]."
  - term: "نَفَيَانِهِ"
    text: "«وأصل النفيان ما تطاير عن الرشاء عند الاستقاء؛ وهو هاهنا ما شذ عن معظمه» [@ibn-al-anbari، ص104]. والرِّشاء: حبل الدلو."
  - term: "الْعُصْمَ"
    text: "«تيوس الجبال، سمين عصما لبياض في أطراف أيديهن» [@ibn-al-anbari، ص104]، أي الوعول."
  - term: "مَنْزِلِ"
    text: "«من كل مكان تنزل منه العصم» [@ibn-al-anbari، ص105]."
syntax:
  - "«وَمَرَّ»: فاعله ضمير الماء، «والتقدير: ومر الماء على القنان» [@ibn-al-anbari، ص105]."
  - "«وعلى صلة مر، وكذلك من، وأنزل نسق على مر، والعصم منصوبة به، ومن صلة أنزل» [@ibn-al-anbari، ص105]."
morphology:
  - "«نَفَيَان» مصدر على «فَعَلان»، وهو وزن يدل على الحركة والاضطراب، كالغليان والجولان."
  - "«العُصْم» جمع «أعصم» على «فُعْل» [@zawzani، ص75]."
  - "«مَنْزِل» اسم مكان: «موضع الإنزال» [@zawzani، ص75]."
rhetoric:
  thesis: "حتى رشاش المطر يهزم سكان القمم."
  devices:
    - title: "المبالغة"
      text: "لم يجعل معظم المطر ينزل الوعول، بل أطرافه وما تطاير منه. فإذا كان هذا فعل الرشاش، فكيف بالمطر نفسه؟"
    - title: "المفارقة"
      text: "الوعول لا تنزل من قمم الجبال، ومنها يُضرب المثل في الامتناع. وهنا نزلت «من كل منزل»؛ فالسيل غلب ما لا يُغلب."
    - title: "التعميم"
      text: "«من كل منزل»: لم يبق موضع في الجبل آمنًا."
  connection: "ثم يصل السيل إلى القرى: «وتيماء لم يترك بها جذع نخلة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَمَرْرَ / عَلَلْقَنَا / نِ مِنْ نَ / فَيَانِهِي = فعولُ / مفاعلن / فعولُ / مفاعلن — فَأَنْزَ / لَ مِنْهُلْ عُصْ / مَ مِنْ كُلْ / لِ مَنْزِلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "قال شوقي ضيف، على روايته «ألقى ببسيان»: «وعمّ المطر جبل بسيان حتى أنزل منه الأوعال التي كانت مستقرة به» [@deif، ج1 ص256]."
variants:
  - reading: "فَأَنْزَلَ مِنْهُ الْعُفْرَ مِنْ كُلِّ مَنْزِلِ"
    status: "رواية أخرى"
    note: "«والعفر: البيض من الظباء» [@ibn-al-anbari، ص104]."
  - reading: "وَأَلْقَى بِبُسْيَانٍ مَعَ اللَّيْلِ بَرْكَهُ"
    status: "رواية الأَصْمَعِيّ"
    note: "«وبسيان: جبل. وبركه: صدره. ضربه مثلا» [@ibn-al-anbari، ص105]. وبها يرويه شوقي ضيف [@deif، ج1 ص256]."
