first: "فَتُوضِحَ فَالْمِقْرَاةِ لَمْ يَعْفُ رَسْمُهَا"
second: "لِمَا نَسَجَتْهَا مِنْ جَنُوبٍ وَشَمْأَلِ"
meaning: "وبين تُوضِح والمِقْراة أيضًا. لم تُمحَ آثار هذه الديار، لأن ريح الجنوب وريح الشمال تتعاقبان عليها: كلما غطّتها إحداهما بالتراب كشفته الأخرى [@zawzani، ص36]."
vocabulary:
  - term: "تُوضِح والمِقْراة"
    text: "موضعان [@zawzani، ص36]. ويقال: المِقْراة غدير يجتمع فيه الماء [@ibn-al-anbari، ص20]."
  - term: "لَمْ يَعْفُ"
    text: "لم يُمحَ ولم يذهب أثره."
  - term: "الرسم"
    text: "ما لصق بالأرض من آثار الدار، كالبعر والرماد [@zawzani، ص36]."
  - term: "نَسَجَتْهَا"
    text: "اختلاف الريحين عليها، تسترها إحداهما بالتراب وتكشفه الأخرى [@zawzani، ص36]."
  - term: "شَمْأَلِ"
    text: "ريح الشمال، وفيها ست لغات: شَمال، وشَمْأَل، وشَأْمَل، وشَمُول، وشَمْل، وشَمَل [@zawzani، ص36]."
syntax:
  - "«فَتُوضِحَ فَالْمِقْرَاةِ» معطوفان على «الدَّخُولِ فَحَوْمَلِ» في البيت الأول، فهي كلها مجرورة. و«تُوضِح» مجرورة بالفتحة لأنها ممنوعة من الصرف، للتعريف والتاء الزائدة في أولها [@ibn-al-anbari، ص20]."
  - "«لَمْ يَعْفُ رَسْمُهَا»: «يَعْفُ» مجزوم بـ«لَمْ»، وعلامة جزمه حذف الواو، و«رَسْمُهَا» فاعل [@ibn-al-anbari، ص22]."
  - "«لِمَا نَسَجَتْهَا»: «ما» بمعنى «التي»، والتقدير: للريح التي نسجت هذه المواضع. ويجوز أن تكون مصدرية: لنسج الريح إياها. و«مِنْ جَنُوبٍ وَشَمْأَلِ» تفسير لـ«ما» [@ibn-al-anbari، ص22]."
morphology:
  - "«يعفو» من «عفا الأثر» إذا درس وامّحى، ويأتي «عفا» أيضًا بمعنى كثُر [@ibn-al-anbari، ص20–21]."
  - "«الرسم» الأثر بلا شخص، وجمعه أرسم ورسوم [@ibn-al-anbari، ص20]."
  - "«نَسَجَتْهَا» من النسج؛ والضمير فيها للمواضع، وفي رواية «نسجته» للرسم [@ibn-al-anbari، ص22]."
rhetoric:
  thesis: "يجعل الشاعر الريح ناسجة: الجنوب تستر الأثر بالتراب، والشمال تكشفه. فالأثر باقٍ لأن قوتين متضادتين تتعاقبان عليه."
  devices:
    - title: "استعارة النسج"
      text: "جعل اختلاف الريحين على الأثر نسجًا؛ و«نسج الريحين: اختلافهما عليها وستر إحداهما إياها بالتراب وكشف الأخرى التراب عنها» [@zawzani، ص36]."
    - title: "بقاء الأثر عذاب"
      text: "قال الأَصْمَعِيّ في هذا البيت: «فنحن نحزن، ولو عفا لاسترحنا» [@ibn-al-anbari، ص20]. فبقاء الأثر هو ما يُبقي الحزن حيًّا."
    - title: "المواضع المتتابعة"
      text: "أربعة أسماء مواضع في بيتين: الدَّخُول، وحَوْمَل، وتُوضِح، والمِقْراة. والعطف بالفاء بينها يرسم الطريق موضعًا بعد موضع."
  connection: "ثم يصف ما بقي في هذه الديار: أثر الظباء."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَتُوضِ / حَ فَلْمِقْرَا / ةِ لَمْ يَعْ / فُ رَسْمُهَا = فعولُ / مفاعيلن / فعولن / مفاعلن — لِمَا نَ / سَجَتْهَا مِنْ / جَنُوبِنْ / وَشَمْأَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "التفعيلة قد تنتهي في وسط الكلمة: «فَتُوضِ / حَ ...»، «لِمَا نَ / سَجَتْهَا». فالميزان يتبع المقاطع لا الكلمات [@ahda-sabil، ص14]."
context: "لماذا لم تمحها الريح؟ يذكر الشراح ثلاثة أقوال: أن الريحين تتعاقبان فتكشف إحداهما ما غطته الأخرى؛ أو أن الريح وحدها لم تمحها، بل محاها معها المطر ومرور السنين؛ أو أن رسمها لم يعفُ من قلب الشاعر وإن عفا على الأرض [@zawzani، ص36]. ويقول الأَصْمَعِيّ: لم يدرس فهو باقٍ، «فنحن نحزن، ولو عفا لاسترحنا» [@ibn-al-anbari، ص20]."
variants:
  - reading: "لِمَا نَسَجَتْهُ مِنْ جَنُوبٍ وَشَمْأَلِ"
    status: "رواية أخرى"
    note: "بتذكير الضمير، فيعود على الرسم لا على المواضع [@ibn-al-anbari، ص22]."
