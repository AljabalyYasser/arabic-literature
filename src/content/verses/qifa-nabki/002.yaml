first: "فَتُوضِحَ فَالْمِقْرَاةِ لَمْ يَعْفُ رَسْمُهَا"
second: "لِمَا نَسَجَتْهَا مِنْ جَنُوبٍ وَشَمْأَلِ"
level: "basic"
meaning: "وبين تُوضِح والمِقْراة أيضًا. لم تُمحَ آثار هذه الديار، لأن ريح الجنوب وريح الشمال تتعاقبان عليها: كلما غطّتها إحداهما بالتراب كشفته الأخرى [@zawzani، ص36]."
vocabulary:
  - term: "تُوضِح والمِقْراة"
    text: "موضعان [@zawzani، ص36]. ويقال: المِقْراة غدير يجتمع فيه الماء [@ibn-al-anbari، ص20]."
  - term: "لَمْ يَعْفُ"
    text: "لم يُمحَ ولم يذهب أثره."
  - term: "الرسم"
    text: "ما لصق بالأرض من آثار الدار، كالبعر والرماد [@zawzani، ص36]."
  - term: "نَسَجَتْهَا"
    text: "اختلاف الريحين عليها، تسترها إحداهما بالتراب وتكشفه الأخرى [@zawzani، ص36]."
  - term: "شَمْأَلِ"
    text: "ريح الشمال، وفيها ست لغات: شَمال، وشَمْأَل، وشَأْمَل، وشَمُول، وشَمْل، وشَمَل [@zawzani، ص36]."
context: "لماذا لم تمحها الريح؟ يذكر الشراح ثلاثة أقوال: أن الريحين تتعاقبان فتكشف إحداهما ما غطته الأخرى؛ أو أن الريح وحدها لم تمحها، بل محاها معها المطر ومرور السنين؛ أو أن رسمها لم يعفُ من قلب الشاعر وإن عفا على الأرض [@zawzani، ص36]. ويقول الأَصْمَعِيّ: لم يدرس فهو باقٍ، «فنحن نحزن، ولو عفا لاسترحنا» [@ibn-al-anbari، ص20]."
variants:
  - reading: "لِمَا نَسَجَتْهُ مِنْ جَنُوبٍ وَشَمْأَلِ"
    status: "رواية أخرى"
    note: "بتذكير الضمير، فيعود على الرسم لا على المواضع [@ibn-al-anbari، ص22]."
