first: "مِسَحٍّ إِذَا مَا السَّابِحَاتُ عَلَى الْوَنَى"
second: "أَثَرْنَ الْغُبَارَ بِالْكَدِيدِ الْمُرَكَّلِ"
meaning: "يصبّ الجري صبًّا، حين تفتر الخيل السريعة وتتعب فتثير الغبار في الأرض الصلبة التي ركلتها الحوافر. قال ابن الأَنْبارِيّ: «يقول: إذا فعل العتاق هذا كان هو مسحا يصب الجرى صبا» [@ibn-al-anbari، ص87]. والعِتاق: كرام الخيل."
vocabulary:
  - term: "مِسَحٍّ"
    text: "«معناه يصب الجرى صبا» [@ibn-al-anbari، ص86]، من سحّ المطر إذا انصبّ."
  - term: "السَّابِحَاتُ"
    text: "«اللواتي عدوهن سباحة؛ والسباحة في الجرى: أن تدحو بأيديها دحوا، أي تبسطها» [@ibn-al-anbari، ص86]."
  - term: "الْوَنَى"
    text: "«الجهد والفتور» [@ibn-al-anbari، ص86]."
  - term: "الْكَدِيدِ"
    text: "«الموضع الغليظ» [@ibn-al-anbari، ص87]، و«الأرض الصلبة المطمئنة» [@zawzani، ص66]."
  - term: "الْمُرَكَّلِ"
    text: "الذي «تركله بحوافرها» [@ibn-al-anbari، ص87]، أي تضربه بها مرة بعد مرة [@zawzani، ص66]."
syntax:
  - "«مِسَحٍّ»: نعت لـ«منجرد»، ولذلك جُرّ. وقال الزَّوْزَنِيّ: «ولو رفع لكان صوابًا وكان حينئذٍ خبر مبتدأ محذوف... ولو نصب لكان صوابًا أيضًا وكان انتصابه على المدح» [@zawzani، ص66]."
  - "«إِذَا مَا السَّابِحَاتُ... أَثَرْنَ»: «والسابحات موضعها رفع بما عاد من أثرن» [@ibn-al-anbari، ص87]، أي فاعل لفعل محذوف يفسره «أثرن»، لأن «إذا» لا يليها إلا الفعل عند البصريين. و«ما» زائدة."
  - "«عَلَى الْوَنَى» و«بِالْكَدِيدِ»: «صلتان لأثرن» [@ibn-al-anbari، ص87]، أي متعلقان به."
morphology:
  - "«مِسَحّ» على «مِفْعَل»، «ومفعلًا في الصفات يقتضي مبالغة» [@zawzani، ص66]."
  - "«الْمُرَكَّل» اسم مفعول من المضعف «ركّل»، «والتركيل التكرير والتشديد» [@zawzani، ص66]."
  - "«الْوَنَى» مصدر «ونى يني» [@zawzani، ص66]."
rhetoric:
  thesis: "يقيس فرسه بغيره: حين تتعب الخيل الكريمة يبدأ هو."
  devices:
    - title: "الاستعارة في «مسحّ»"
      text: "السَّحّ صبّ الماء، فجعل الجري ماء ينصبّ من الفرس صبًّا متتابعًا."
    - title: "تسمية الخيل «سابحات»"
      text: "الخيل تمد أيديها في العدو «شبه بالسابح في الماء» [@zawzani، ص66]؛ فالبيت كله صورة ماء: سحّ وسباحة."
    - title: "المقابلة"
      text: "الخيل السابحات فاترات يثرن الغبار، وهو يصبّ الجري. ويقرأ شوقي ضيف الصورة قراءة أخرى: «يريد أن حوافره لا تكاد تمس الأرض، وهي لذلك لا تثير بها غبارا كما تصنع السابحات» [@deif، ج1 ص253، الحاشية]."
  connection: "ثم يقول: «يزلّ الغلام الخِفّ عن صهواته»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "مِسَحْحِنْ / إِذَا مَسْسَا / بِحَاتُ / عَلَلْوَنَى = فعولن / مفاعيلن / فعولُ / مفاعلن — أَثَرْنَلْ / غُبَارَ بِلْ / كَدِيدِلْ / مُرَكْكَلِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "قال الزَّوْزَنِيّ في تحرير معناه: «أنه يجيء بجري بعد جري إذا كلّت الخيل السوابح وأعيت» [@zawzani، ص66]."
variants:
