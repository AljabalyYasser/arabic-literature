first: "كَأَنَّ مَكَاكِيَّ الْجِوَاءِ غُدَيَّةً"
second: "صُبِحْنَ سُلَافًا مِنْ رَحِيقٍ مُفَلْفَلِ"
meaning: "كأن طيور المُكّاء في الوادي صباحًا قد سُقيت أول الخمر ممزوجة بالفلفل، فهي تغرد بنشاط كالسكارى. قال الزَّوْزَنِيّ: «وإنما جعلها كذلك لحدة ألسنتها وتتابع أصواتها ونشاطها في تغريدها؛ لأن الشراب المفلفل يحذي اللسان ويسكر» [@zawzani، ص77]."
vocabulary:
  - term: "مَكَاكِيَّ"
    text: "جمع مُكّاء، وهو «ضرب من الطير» [@zawzani، ص77]."
  - term: "الْجِوَاءِ"
    text: "«الوادي» [@zawzani، ص77]. وقال أبو عَمْرو: «ما اتسع من الأرض» [@ibn-al-anbari، ص110]."
  - term: "غُدَيَّةً"
    text: "«تصغير غدوة أو غداة» [@zawzani، ص77]، أي في أول الصباح."
  - term: "صُبِحْنَ"
    text: "سُقين الصَّبوح، «وهو شرب الغداة» [@ibn-al-anbari، ص110]."
  - term: "سُلَافًا"
    text: "«أول ما يعصر من الخمر» [@ibn-al-anbari، ص110]، وهو أجودها [@zawzani، ص77]."
  - term: "مُفَلْفَلِ"
    text: "«الذي ألقي فيه الفلفل» [@zawzani، ص77]. وقال ابن حبيب: «معناه يحذي اللسان» [@ibn-al-anbari، ص110]، أي يلذعه."
syntax:
  - "«مَكَاكِيَّ» اسم كأن، و«غُدَيَّةً» «نصب على الوقت» [@ibn-al-anbari، ص111]، أي ظرف زمان."
  - "«صُبِحْنَ»: فعل ماض مبني للمجهول، ونون النسوة نائب فاعل. والجملة خبر كأن [@ibn-al-anbari، ص111]."
  - "«سُلَافًا»: «منصوب بوقوع صبحن عليه» [@ibn-al-anbari، ص111]، أي مفعول به. و«من رحيق» صفة له، و«مفلفل» نعت للرحيق."
morphology:
  - "«غُدَيَّة» تصغير «غُدْوة» على «فُعَيْلة»."
  - "«صُبِحْنَ» مبني للمجهول من «صَبَح»: سقاه الصَّبوح."
  - "«مُفَلْفَل» اسم مفعول من الرباعي المضعف «فلفل»: «فلفلت الشراب أفلفله فلفلة» [@zawzani، ص77]."
rhetoric:
  thesis: "بعد الخراب يأتي الفرح: الطيور تغرد في الوادي كأنها سكارى."
  devices:
    - title: "التشبيه"
      text: "شبّه نشاط الطيور وحدّة أصواتها بحال شاربين سُقوا خمرًا مفلفلة في الصباح؛ فجعل «نشاط الطير كالسكر، وتغريدها بحدة ألسنتها من حذي الشراب المفلفل إياها» [@zawzani، ص77]."
    - title: "علامة الخصب"
      text: "الطيور هنا بشارة: قال ابن حبيب إن المكاء «لما رأى الخصب والمطر فرح وصوّت كأنه شارب مغن. ويقال: إن المكاء لا يغرد إلا في الخصب» [@ibn-al-anbari، ص110–111]."
    - title: "الانتقال من العنف إلى البهجة"
      text: "بعد نخل مقتلع وبيوت مهدومة وجبال غارقة، يأتي بيت كله غناء. فالمطر الذي هدم هو نفسه الذي أحيا."
  connection: "ثم يختم القصيدة: «كأن السباع فيه غرقى عشية / بأرجائه القصوى أنابيش عنصل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنَ / مَكَاكِيْيَلْ / جِوَاءِ / غُدَيْيَتَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — صُبِحْنَ / سُلَافَنْ مِنْ / رَحِيقِنْ / مُفَلْفَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "يأتي بعد أن ألقى السحاب ماءه بصحراء الغبيط فأنبت ألوان الزهر، «كنزول التاجر اليماني صاحب العياب من الثياب حين نشر ثيابه يعرضها على المشترين» [@zawzani، ص77]. فالمشهد مشهد خصب بعد المطر."
