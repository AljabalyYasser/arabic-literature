first: "فَجِئْتُ وَقَدْ نَضَتْ لِنَوْمٍ ثِيَابَهَا"
second: "لَدَى السِّتْرِ إِلَّا لِبْسَةَ الْمُتَفَضِّلِ"
meaning: "فجئتها وقد خلعت ثيابها للنوم عند الستر، ولم يبق عليها إلا ثوب واحد تنام فيه. قال ابن الأَنْبارِيّ: «معناه ليس عليها من الثياب إلا شعارها، وهو ثوبها الذي يلي جسدها، وتقوم وتقعد فيه وتنام. يقول: جئتها بعد هدء من الليل» [@ibn-al-anbari، ص52]، أي بعد أن سكن الليل. والشِّعار: الثوب الذي يلي الجسد. وقرأ الزَّوْزَنِيّ في وقوفها عند الستر انتظارًا له: «أتيتها وقد خلعت ثيابها عند النوم غير ثوب واحد تنام فيه وقد وقفت عند الستر مترقبة ومنتظرة، وإنما خلعت الثياب لتري أهلها أنها تريد النوم» [@zawzani، ص49]. فهو يصل إليها في خلوتها، وهي شبه عارية."
vocabulary:
  - term: "نَضَتْ"
    text: "خلعت، يقال: «نضا عنه ثيابه، وسرى عنه ثيابه، إذا ألقاها» [@ibn-al-anbari، ص52]."
  - term: "السِّتْرِ"
    text: "ما يُرخى على الخِدْر فيحجب من وراءه."
  - term: "لِبْسَةَ"
    text: "«اللِبسة: حالة اللابس وهيئة لبسه الثياب» [@zawzani، ص49]."
  - term: "الْمُتَفَضِّلِ"
    text: "«المتفضل: الذي في ثوب واحد، وهو الفضل» [@ibn-al-anbari، ص52]. وفي اللسان عن الجَوْهَرِيّ: «تفضّلت المرأة في بيتها إذا كانت في ثوب واحد كالخيعل ونحوه» [@lisan، ج11 ص526]."
syntax:
  - "«فَجِئْتُ»: «والفاء التي في قوله فجئت، تصل ما بعدها بما قبلها» [@ibn-al-anbari، ص52]، فالمجيء يعقب تجاوز الأحراس في وقت الثريا."
  - "«وَقَدْ نَضَتْ»: «والواو في قوله وقد نضت واو حال، وما في نضت يعود على المرأة» [@ibn-al-anbari، ص52]، و«ثِيَابَهَا» مفعول به."
  - "«لِنَوْمٍ»: جار ومجرور متعلق بـ«نضت»، واللام للتعليل. وجاء المصدر مجرورًا باللام ولم يُنصب مفعولًا لأجله، لأن وقت النوم بعد وقت الخلع لا معه."
  - "«لَدَى السِّتْرِ»: «ولدى الستر معناه عند الستر» [@ibn-al-anbari، ص52]، ظرف متعلق بـ«نضت»."
  - "«إِلَّا لِبْسَةَ الْمُتَفَضِّلِ»: استثناء من «ثيابها». وقال ابن الأَنْبارِيّ: «واللبسة منصوبة على المصدر، وهي مضافة إلى المتفضل» [@ibn-al-anbari، ص52]، كأن التقدير: إلا أن تلبس لِبْسة المتفضل."
morphology:
  - "«نَضَتْ» ماضٍ من «نَضَا يَنْضُو»، ناقص واوي، حُذفت ألفه لالتقائها ساكنة بتاء التأنيث الساكنة. وفي رواية الزَّوْزَنِيّ «نَضَّتْ» بالتشديد، قال: «نضا الثياب ينضوها نضوًا إذا خلعها، ونضّاها يُنضِّيها إذا أراد المبالغة» [@zawzani، ص49]."
  - "«لِبْسَة» على «فِعْلة» بكسر الفاء، وهي بناء الهيئة، «بمنزلة الْجِلسة والقِعدة والركبة» [@zawzani، ص49]."
  - "«الْمُتَفَضِّل» اسم فاعل من «تَفَضَّلَ» على «تَفَعَّلَ»."
rhetoric:
  thesis: "يصل إليها بعد الأحراس والثريا، فإذا هي قد تجرّدت من ثيابها إلا ثوبًا واحدًا. والبيت وصف لا فعل، لكنه باب الخلوة، ولذلك أنشده ابن سَلّام فيما «يتعهّر» فيه امرؤ القَيْس."
  devices:
    - title: "الاستثناء"
      text: "بنى البيت على الاستثناء: «نَضَتْ ... ثِيَابَهَا ... إِلَّا لِبْسَةَ الْمُتَفَضِّلِ». فأثبت التجرّد أولًا، ثم استثنى منه أقل ما يكون، فصار المستثنى نفسه دليلًا على قرب العُري."
    - title: "العلّة المعلنة والعلّة المسكوت عنها"
      text: "ظاهر «لِنَوْمٍ» أنها تهيأت للنوم. لكن الزَّوْزَنِيّ يقرأ في ذلك حيلة: «وإنما خلعت الثياب لتري أهلها أنها تريد النوم» [@zawzani، ص49]، فوقوفها «لَدَى السِّتْرِ» انتظار له. وعلى قراءته تكون العلة المذكورة غطاءً لعلة أخرى لا يذكرها البيت، فالمرأة شريكة في المغامرة كما ستظهر في البيتين التاليين."
    - title: "تكرار الصورة"
      text: "تعود «الْمُتَفَضِّلِ» في وصف صاحبته في البيت 37: «نؤوم الضحى لم تنتطق عن تفضّل». هناك التفضّل علامة الترف، فهي لا تشد وسطها للعمل، وهنا علامة الخلوة، وهي قراءتنا."
  connection: "ثم يأتي الحوار: «فقالت يمين الله ما لك حيلة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَجِئْتُ / وَقَدْ نَضَتْ / لِنَوْمِنْ / ثِيَابَهَا = فعولُ / مفاعلن / فعولن / مفاعلن — لَدَسْ سِتْ / رِ إِلْلَا لِبْ / سَتَلْمُ / تَفَضْضِلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من الصدر والثالثة من العَجُز [@atiq، ص29]. ودخل القبض أيضًا «مفاعيلن» الثانية من الصدر فصارت «مفاعلن»، وذلك برواية ابن الأَنْبارِيّ «نَضَتْ» بالتخفيف، وهو جائز في حشو الطويل؛ أما رواية الزَّوْزَنِيّ «نَضَّتْ» فتأتي بها تامة."
context: "يأتي بعد البيتين اللذين يحدد فيهما طريقه إليها ووقته: تجاوز الأحراس حين تعرّضت الثريا. وهو من الأبيات الثلاثة التي استشهد بها ابن سَلّام على أن امرأ القَيْس «كان ينعى على نفسه ويتعهر»، ورواه «دخلت وقد ألقت لنوم ثيابها» [@ibn-sallam، ج1 ص41–42]. ويضعه شوقي ضَيْف في المشهد كله: «وكيف وصل إليها وقد استعدّت للنوم وما كان بينه وبينها من حوار» [@deif، ج1 ص250]. وعلى هذا القصص الغرامي اعترض طه حسين، كما ينقل ضَيْف، «فأنكر ما ينسب إلى امرئ القيس من هذا الغزل القصصى الصريح وقال إنه انتحل انتحالا» على غرار غزل عمر بن أبي رَبِيعة [@deif، ج1 ص251]."
