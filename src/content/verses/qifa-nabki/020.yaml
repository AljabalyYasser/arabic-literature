first: "أَغَرَّكِ مِنِّي أَنَّ حُبَّكِ قَاتِلِي"
second: "وَأَنَّكِ مَهْمَا تَأْمُرِي الْقَلْبَ يَفْعَلِ"
meaning: "أغرّك مني أن حبك يقتلني، وأنك مهما أمرت القلب بشيء فعله؟ قال الزَّوْزَنِيّ: «قد غرّك مني كون حبك قاتلي، وكون قلبي منقادًا لك بحيث مهما أمرته بشيء فعله» [@zawzani، ص45]."
vocabulary:
  - term: "أَغَرَّكِ"
    text: "أجعلك تطمعين وتغترّين."
  - term: "مَهْمَا"
    text: "اسم شرط بمعنى: أيّ شيء."
syntax:
  - "«أَغَرَّكِ»: الهمزة للاستفهام، ومعناه التقرير لا الاستخبار [@zawzani، ص45]. و«غرّ» فعل ماض، والكاف مفعول به، و«مِنِّي» متعلق به."
  - "«أَنَّ حُبَّكِ قَاتِلِي»: المصدر المؤول فاعل «غرّ»؛ قال ابن الأَنْبارِيّ: «كأنك قلت: أغرّك مني حبيك» [@ibn-al-anbari، ص45]. و«قاتلي» خبر «أنّ»."
  - "«وَأَنَّكِ»: معطوف على «أنّ» الأولى، والكاف اسمها، وجملة الشرط والجواب بعدها خبرها."
  - "«مَهْمَا»: اسم شرط جازم في موضع نصب مفعول به لـ«تأمري» [@ibn-al-anbari، ص45]. و«تَأْمُرِي» فعل الشرط مجزوم بحذف النون، و«الْقَلْبَ» مفعول به، و«يَفْعَلِ» جواب الشرط مجزوم، وحُرّك بالكسر للقافية [@sharrab، ج2 ص210]."
morphology:
  - "«مهما»: قال الفَرّاء: «كان الأصل في مهما: ما، فحذفت العرب الألف منها وجعلت الهاء خلفًا منها، ثم وصلت بما». وقال بعض النحويين: «مه» بمعنى «كُفّ» ضُمّت إليها «ما» [@ibn-al-anbari، ص45]."
  - "«قَاتِل» اسم فاعل من «قتل»."
  - "«غَرَّ» مضعّف، مضارعه «يغُرّ»."
rhetoric:
  thesis: "سؤال لا ينتظر جوابًا: يقرّرها بأنها عرفت ضعفه أمامها، فاستعملته."
  devices:
    - title: "الاستفهام التقريري"
      text: "«لفظه لفظ الاستفهام، ومعناه معنى التقرير»، كقول جَرِير: «ألستم خير من ركب المطايا» [@ibn-al-anbari، ص45]. فهو لا يسألها، بل يواجهها بما تعرفه."
    - title: "المبالغة"
      text: "«حبك قاتلي»: جعل الحب قاتلًا، ولم يقل «يؤلمني» أو «يُضنيني»."
    - title: "معنيان في العَجُز"
      text: "ذكر ابن الأَنْبارِيّ أن المعنى قد يكون: «مهما تأمري قلبك يفعل لأنك مالكة له، وأنا لا أملك قلبي»، أو: «مهما تأمري قلبي يفعل لأنه مطيع لك» [@ibn-al-anbari، ص45]. وكلاهما يخدم العتاب: هي تملك أمرها، وهو لا يملك أمره."
  connection: "ثم يقول: «وإن تك قد ساءتك مني خليقة / فسُلّي ثيابي من ثيابك تنسُلِ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَغَرْ رَ / كِ مِنْنِي أَنْ / نَ حُبْ بَ / كِ قَاتِلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَأَنْ نَ / كِ مَهْمَا تَأْ / مُرِلْ قَلْ / بَ يَفْعَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "يعدّه شوقي ضيف من «الأبيات البديعة» التي يعاتب فيها فاطمة [@deif، ج1 ص249]."
