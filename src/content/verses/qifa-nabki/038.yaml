first: "وَتَعْطُو بِرَخْصٍ غَيْرِ شَثْنٍ كَأَنَّهُ"
second: "أَسَارِيعُ ظَبْيٍ أَوْ مَسَاوِيكُ إِسْحِلِ"
meaning: "وتتناول الأشياء بأصابع لينة ناعمة غير غليظة، كأنها ديدان بيض في كثيب يسمى ظبيًا، أو مساويك من شجر الإسحل. قال الزَّوْزَنِيّ: «وتتناول الأشياء ببنان رخص ليّن ناعم غير غليظ ولا كز، كأن تلك الأنامل تشبه هذا الصنف من الدود أو هذا الضرب من المساويك» [@zawzani، ص57]."
vocabulary:
  - term: "تَعْطُو"
    text: "«تتناول» [@ibn-al-anbari، ص66]."
  - term: "رَخْصٍ"
    text: "«ببنان رخص. والبنان: الأصابع» [@ibn-al-anbari، ص66]، والرخص: «اللين الناعم» [@zawzani، ص56]."
  - term: "شَثْنٍ"
    text: "«الكز الخشن» [@ibn-al-anbari، ص66]."
  - term: "أَسَارِيعُ ظَبْيٍ"
    text: "ظبي: «اسم كثيب»، والأساريع: «دودة تكون في الرمل... فشبه أصابعها بالأساريع للينها» [@ibn-al-anbari، ص66–67]. وعند الزَّوْزَنِيّ: دود يكون في البقل والأماكن الندية [@zawzani، ص56]."
  - term: "مَسَاوِيكُ إِسْحِلِ"
    text: "«الإسحل شجر له غصون دقاق يستاك بها» [@ibn-al-anbari، ص67]."
syntax:
  - "«والفاعل مضمر في تعطو من ذكر المرأة، والباء صلة تعطو، وهي خافضة للرخص، وغير شثن للرخص»، أي نعت [@ibn-al-anbari، ص67]."
  - "«كَأَنَّهُ»: «والهاء اسم كأن، وهي عائدة على الرخص، والأساريع خبر كأن، وهي مضافة إلى الظبي، والمساويك نسق على الأساريع» [@ibn-al-anbari، ص67]."
  - "«رَخْصٍ»: صفة لموصوف محذوف، أي «ببنان رخص» [@ibn-al-anbari، ص66]."
morphology:
  - "«تَعْطُو» مضارع «عطا يعطو»، ناقص واوي؛ «والإعطاء المناولة، والتعاطي التناول» [@zawzani، ص56]."
  - "«أَسَارِيع» جمع «أُسروع» و«يُسروع» [@ibn-al-anbari، ص67]."
  - "«مَسَاوِيك» جمع «مسواك» [@zawzani، ص56]."
rhetoric:
  thesis: "تشبيه يعجب القدماء ويستغربه المتأخرون: أنامل كديدان الرمل."
  devices:
    - title: "تشبيهان بـ«أو»"
      text: "شبّه أصابعها بالأساريع في لينها وبياضها، وبمساويك الإسحل «في دقتها ونقائها واستوائها» [@ibn-al-anbari، ص67]."
    - title: "تشبيه بدوي"
      text: "قال ابن رَشِيق: «وقد أتت القدماء بتشبيهات رغب المولدون إلا القليل عن مثلها استبشاعاً لها، وإن كانت بديعة في ذاتها، مثل قول امرئ القَيْس: وتعطو برخص...». ثم بيّن وجه الشبه: الأسروعة «كأحسن البنان: ليناً، وبياضاً، وطولاً، واستواءً، ودقة، وحمرة رأس» [@ibn-rashiq، ج1 ص299]. فالصورة صحيحة، والذوق الحضري هو الذي نفر منها."
    - title: "نفي العيب"
      text: "«غير شثن»: وصفها بالنعومة ثم نفى الخشونة، فأكّد الصفة من طرفيها."
  connection: "ثم يصف وجهها في الليل: «تضيء الظلام بالعشاء كأنها»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَتَعْطُو / بِرَخْصِنْ غَيْ / رِ شَثْنِنْ / كَأَنْنَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — أَسَارِي / عُ ظَبْيِنْ أَوْ / مَسَاوِي / كُ إِسْحِلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "قال ابن الأَنْبارِيّ إن ذا الرُّمَّة أخذ هذا المعنى في قوله: «خراعيب أملود كأن بنانها / بنات النقا تخفى مرارا وتظهر»، «قال: وسرقه ذو الرمة منه، يعني من امرئ القَيْس» [@ibn-al-anbari، ص67]."
