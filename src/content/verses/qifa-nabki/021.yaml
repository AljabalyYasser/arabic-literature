first: "وَإِنْ تَكُ قَدْ سَاءَتْكِ مِنِّي خَلِيقَةٌ"
second: "فَسُلِّي ثِيَابِي مِنْ ثِيَابِكِ تَنْسُلِ"
meaning: "وإن كان قد ساءك مني خُلُق، فافصلي أمري عن أمرك ينفصل. قال ابن الأَنْبارِيّ: «أن كان فيَّ خلق لا ترضينه فلي ثيابي من ثيابك، أي قلبي من قلبك» [@ibn-al-anbari، ص46]. وقال شوقي ضيف: «سلي ثيابي من ثيابك: انزعي أمري من أمرك» [@deif، ج1 ص249، الحاشية]."
vocabulary:
  - term: "خَلِيقَةٌ"
    text: "الخُلُق والطبع: «والخليقة والطبيعة والسليقة... كله واحد» [@ibn-al-anbari، ص46]."
  - term: "سُلِّي"
    text: "انزعي وأخرجي."
  - term: "ثِيَابِي"
    text: "فيها قولان: القلب، «والثياب هاهنا كناية عن القلب» [@ibn-al-anbari، ص46]، أو الثياب الملبوسة، «كنّى بتباين الثياب وتباعدها عن تباعدهما» [@zawzani، ص46]."
  - term: "تَنْسُلِ"
    text: "«تبين عنها. يقال للسن إذا بانت فسقطت: قد نسلت» [@ibn-al-anbari، ص46]."
syntax:
  - "«إِنْ تَكُ»: «موضع تك جزم بإن»، وأصلها «تكون»، سقطت الواو لالتقاء الساكنين، «والنون حذفت لكثرة الاستعمال» [@ibn-al-anbari، ص46]. ولا تُحذف النون إذا وليها ساكن: «لم يكن الرجل قائما»."
  - "«واسم الكون الخليقة، والخبر ساءتك، وجواب الجزاء الفاء» [@ibn-al-anbari، ص46]."
  - "«تَنْسُلِ»: مجزوم «لأنه جواب للجزاء المقدر؛ والتقدير: فسلي ثيابي من ثيابك، أي أن تسليها تنسل»، وكُسر للقافية [@ibn-al-anbari، ص47]."
morphology:
  - "«تَكُ» مضارع «كان» مجزوم، حُذفت نونه تخفيفًا."
  - "«سُلِّي» أمر من المضعف «سلّ» للمخاطبة."
  - "«تَنْسُل» «ويقال: نسل الريش ينسُل وينسِل» [@ibn-al-anbari، ص47]."
rhetoric:
  thesis: "يعرض عليها الفراق بعبارة هادئة، وهو يعرف أنها لن تفعل."
  devices:
    - title: "الكناية"
      text: "الثياب كناية عن القلب، كما قال عَنْتَرَة «فشككت بالرمح الطويل ثيابه»، أي قلبه [@ibn-al-anbari، ص46]. وعلى القول الآخر هي كناية عن الفراق؛ «وقال خالد بن كلثوم: كان طلاق أهل الجاهلية أن يسل الرجل ثوبه من امرأته وتسل المرأة ثوبها» [@ibn-al-anbari، ص46]."
    - title: "الجناس"
      text: "بين «سُلّي» و«تنسل»، وبين «ثيابي» و«ثيابك». وعدّه شوقي ضيف من أمثلة الجناس في غزله [@deif، ج1 ص264]."
    - title: "الشرط بـ«إن»"
      text: "جاء بـ«إن» التي تُستعمل لما يُشك في وقوعه، لا بـ«إذا» التي للمحقق؛ فهو لا يسلّم بأن فيه خلقًا يسوؤها."
  connection: "ثم يتهم دموعها: «وما ذرفت عيناك إلا لتضربي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَإِنْ تَ / كُ قَدْ سَاءَتْ / كِ مِنْنِي / خَلِيقَتُنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — فَسُلْلِي / ثِيَابِي مِنْ / ثِيَابِ / كِ تَنْسُلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "من أبيات عتاب فاطمة التي وصفها شوقي ضيف بأنها «الأبيات البديعة» [@deif، ج1 ص249]. وقال أبو عُبَيْدة: «هذا صرم والأول قتل»، يعني أن هذا البيت فراق، وقوله قبل «أزمعت قتلي» في رواية أخرى أشد منه [@ibn-al-anbari، ص46]."
variants:
  - reading: "وَإِنْ كُنْتِ قَدْ سَاءَتْكِ مِنِّي خَلِيقَةٌ"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص46]. وبها يرويه شوقي ضيف [@deif، ج1 ص249]."
  - reading: "فَسُلِّي ثِيَابِي مِنْ ثِيَابِكِ تَنْسَلِي"
    status: "رواية أخرى"
    note: "«وجعل الانسلاء بمعنى التسلي، والرواية الأولى أولاهما بالصواب» [@zawzani، ص46]."
