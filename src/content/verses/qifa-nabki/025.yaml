first: "إِذَا مَا الثُّرَيَّا فِي السَّمَاءِ تَعَرَّضَتْ"
second: "تَعَرُّضَ أَثْنَاءِ الْوِشَاحِ الْمُفَصَّلِ"
meaning: "تجاوزت إليها الحراس حين ظهرت الثريا في السماء مائلة، تريك جانبها كما يريك الوشاح المفصّل بالخرز جانبه. قال الزَّوْزَنِيّ: «تجاوزت إليها في وقت إبداء الثريا عرضها في السماء، كإبداء الوشاح الذي فُصل بين جواهره وخرزه بالذهب أو غيره عرضه» [@zawzani، ص49]."
vocabulary:
  - term: "الثُّرَيَّا"
    text: "جماعة من النجوم الصغيرة المتقاربة."
  - term: "تَعَرَّضَتْ"
    text: "أبدت عُرْضها، وهو الناحية [@zawzani، ص48]. قال ابن الأَنْبارِيّ: «الثريا تستقبلك بأنفها أول ما تطلع، فإذا أرادت أن تسقط تعرضت» [@ibn-al-anbari، ص50]."
  - term: "أَثْنَاءِ"
    text: "النواحي [@zawzani، ص48]."
  - term: "الْوِشَاحِ"
    text: "«خرز يُعمل من كل لون» [@ibn-al-anbari، ص51]، تلبسه المرأة على صدرها."
  - term: "الْمُفَصَّلِ"
    text: "«الذي فُصل بين خرزه بالذهب أو غيره» [@zawzani، ص48]."
syntax:
  - "«إِذَا»: ظرف متعلق بـ«تجاوزت» في البيت السابق، والمعنى: «تجاوزت أحراسًا إليها عند تعرض الثريا في السماء» [@ibn-al-anbari، ص50]. فالبيتان متعلقان لا يتم أحدهما إلا بالآخر."
  - "«مَا»: زائدة للتوكيد [@ibn-al-anbari، ص51]."
  - "«الثُّرَيَّا»: فاعل لفعل محذوف يفسّره «تعرضت». و«فِي السَّمَاءِ» متعلق بـ«تعرضت»."
  - "«تَعَرُّضَ»: مفعول مطلق منصوب، «وهو مضاف إلى الأثناء، والأثناء مضاف إلى الوشاح، والمفصل نعت للوشاح» [@ibn-al-anbari، ص51]."
morphology:
  - "«تَعَرَّضَت» على «تَفَعَّلَت»، ومصدره «تَعَرُّض» على «تَفَعُّل»."
  - "«أَثْنَاء» جمع «ثِنْي» و«ثِنًى» و«ثَنًى» [@ibn-al-anbari، ص51]."
  - "«الْمُفَصَّل» اسم مفعول من «فَصَّل»."
rhetoric:
  thesis: "يحدد وقت زيارته بصورة من السماء: الثريا مائلة في الأفق كوشاح مرصّع."
  devices:
    - title: "بُعد الطرفين"
      text: "جمع بين نجوم في السماء وخرز على صدر امرأة. قال عبد القاهر: «وجدت التباعد بين الشيئين كلما كان أشد، كانت إلى النفوس أعجب»، ومثّل بتشبيه الثريا بالوشاح المفصّل [@asrar، ص130]."
    - title: "مراعاة الهيئة"
      text: "قال عبد القاهر في هذا البيت: «وقد اعتُبر فيه هيئة التفصيل في الوشاح، والشكل الذي يكون عليه الخرز المنظوم في الوشاح، فصار اعتبار التفصيل أعجب تفصيل في التشبيه» [@asrar، ص168]. فلو تلاصقت حبات الوشاح لبطل الشبه؛ لأن نجوم الثريا متقاربة لا متلاصقة."
    - title: "تشبيه حركة بحركة"
      text: "جاء بالمشبه به مصدرًا: «تعرّضَ أثناء الوشاح»؛ فلم يشبّه الثريا بالوشاح وهو ساكن، بل شبّه ميل الثريا بميل الوشاح."
  connection: "ثم يصل إليها: «فجئت وقد نضت لنوم ثيابها»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "إِذَا مَثْ / ثُرَيْيَا فِسْ / سَمَاءِ / تَعَرْرَضَتْ = فعولن / مفاعيلن / فعولُ / مفاعلن — تَعَرْ رُ / ضَ أَثْنَاءِلْ / وِشَاحِلْ / مُفَصْصَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر والأولى من العَجُز [@atiq، ص29]."
context: "يأتي بعد قوله: «تجاوزت أحراسًا إليها ومعشرًا / عليّ حِراصًا لو يُسِرّون مقتلي». وأنكر قوم أن تتعرض الثريا، ويُحكى عن ابن سَلّام أنه قال: «إنما عنى بالثريا الجوزاء، لأن الثريا لا تعرض» [@ibn-al-anbari، ص51]، ورد الزَّوْزَنِيّ ذلك وعدّه غلطًا [@zawzani، ص49]."
