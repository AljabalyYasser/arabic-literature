first: "وَيَوْمَ عَقَرْتُ لِلْعَذَارَى مَطِيَّتِي"
second: "فَيَا عَجَبًا لِرَحْلِهَا الْمُتَحَمِّلِ"
meaning: "ويوم نحرت ناقتي للفتيات فأطعمتهن من لحمها، فيا عجبًا لرحلها وقد حملنه على رواحلهن! قال ابن الأَنْبارِيّ في العجب معنيين: «فعلت هذا لسفهي في شبابي»، أو العجب لهن «كيف أطقن حمل الرحل في هودجهن... على تنعمهن ورفاهة عيشهن» [@ibn-al-anbari، ص34]."
vocabulary:
  - term: "عَقَرْتُ"
    text: "العقر: ضرب قوائم البعير بالسيف ثم نحره."
  - term: "الْعَذَارَى"
    text: "جمع عذراء، وهي البكر [@zawzani، ص40]."
  - term: "مَطِيَّتِي"
    text: "ناقتي [@ibn-al-anbari، ص34]."
  - term: "رَحْلِهَا"
    text: "الرحل: ما يوضع على ظهر البعير ليُركب عليه."
syntax:
  - "«وَيَوْمَ»: قال الزَّوْزَنِيّ إنه فُتح «مع كونه معطوفًا على مجرور أو مرفوع... لأنه بناه على الفتح لما أضافه إلى مبني، وهو الفعل الماضي» [@zawzani، ص40]. وعند ابن الأَنْبارِيّ أنه معطوف على «يومٌ» بعد «سيما»، «إلا أنه نصب في اللفظ لأنه مضاف غير محض»، وقال غيره: منصوب بفعل مضمر، أي: واذكر يوم عقرت [@ibn-al-anbari، ص33–34]."
  - "«عَقَرْتُ»: فعل وفاعل، والجملة في محل جر بالإضافة. و«لِلْعَذَارَى» متعلق بـ«عقرت»، و«مَطِيَّتِي» مفعول به."
  - "«فَيَا عَجَبًا»: «يا» حرف نداء، و«عجبًا» منادى منصوب. قال الزَّوْزَنِيّ: إن قيل كيف نادى العجب؟ قيل: «المنادى محذوف، والتقدير: يا هؤلاء، أو يا قوم، اشهدوا عجبي»، وقيل: «بل نادى العجب اتساعًا ومجازًا، فكأنه قال: يا عجبي تعال واحضر» [@zawzani، ص40]."
  - "«لِرَحْلِهَا»: متعلق بـ«عجبًا»، و«الْمُتَحَمِّلِ» صفة لـ«رحل»."
morphology:
  - "«الْعَذَارَى»: جمع «عذراء»، ويقال: العذارَى والعذارِي [@ibn-al-anbari، ص34]."
  - "«مَطِيَّة»: فعيلة بمعنى مفعولة، من المطا وهو الظهر: ما يُركب ظهره."
  - "«الْمُتَحَمِّل»: اسم فاعل من «تحمّل» على «تفعّل»."
rhetoric:
  thesis: "يوم لهو وكرم معًا: يعقر ناقته ليطعم الفتيات، ثم يتعجب من رحلها وقد تقاسمنه."
  devices:
    - title: "نداء العجب"
      text: "نادى ما لا يعقل: «فيا عجبًا». وهي طريقة العرب في إظهار الدهشة، كأنه يستدعي العجب ليحضر فيشهد [@zawzani، ص40]."
    - title: "الكرم في الغزل"
      text: "جعل الكرم جزءًا من صورته عند النساء؛ فالفتى الجاهلي يفخر بالبذل كما يفخر بالحب."
    - title: "الإيجاز"
      text: "بيت واحد يحمل حكاية كاملة: نحر الناقة، وإطعام الفتيات، وحمل الرحل. ترك تفصيلها للسامع، ففصّلها الرواة بعده في حكاية دارة جُلْجُل."
  connection: "ثم يصف الفتيات وهن يتهادين لحمها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَيَوْ مَ / عَقَرْتُ لِلْ / عَذَارَى / مَطِيْيَتِي = فعولُ / مفاعلن / فعولن / مفاعلن — فَيَا عَ / جَبَنْ لِرَحْ / لِهَلْ مُ / تَحَمْمِلِي = فعولُ / مفاعلن / فعولُ / مفاعلن"
  note: "دخل القبضُ «مفاعيلن» في التفعيلة الثانية من الشطرين فصارت «مفاعلن» [@ahda-sabil، ص28]، ودخل «فعولن» في التفعيلة الأولى من الشطرين، والثالثة من العَجُز [@atiq، ص29]."
context: "يروي الفَرَزْدَق عن جده أن امرأ القَيْس عقر ناقته للفتيات يوم الغدير، فأطعمهن منها، ثم تقاسمن متاع راحلته [@ibn-al-anbari، ص14–15]."
variants:
