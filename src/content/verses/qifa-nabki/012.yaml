first: "فَظَلَّ الْعَذَارَى يَرْتَمِينَ بِلَحْمِهَا"
second: "وَشَحْمٍ كَهُدَّابِ الدِّمَقْسِ الْمُفَتَّلِ"
meaning: "فظلت الفتيات طول النهار يتقاذفن لحمها وشحمًا أبيض لينًا كأطراف الحرير المفتول. قال الزَّوْزَنِيّ: «فجعلن يلقي بعضهن إلى بعض شواء المطية استطابة أو توسعًا فيه طول نهارهن؛ وشبه شحمها بالإبريسم الذي أجيد فتله» [@zawzani، ص41]."
vocabulary:
  - term: "ظَلَّ"
    text: "«العرب تقول: ظل فلان يفعل كذا وكذا، إذا فعله نهارًا؛ وبات يفعل كذا وكذا، إذا فعله ليلًا» [@ibn-al-anbari، ص35]."
  - term: "يَرْتَمِينَ"
    text: "«يتهادينه ويناول بعضهن بعضًا» [@ibn-al-anbari، ص35]."
  - term: "هُدَّابِ"
    text: "«ما استرسل من الشيء، نحو ما استرسل من الأشفار من الشعر، ومن أطراف الأثواب» [@zawzani، ص40]."
  - term: "الدِّمَقْسِ"
    text: "«الإبريسم، وقيل: هو الأبيض منه خاصة» [@zawzani، ص41]. والإبريسم: الحرير."
syntax:
  - "«فَظَلَّ»: الفاء عاطفة، و«ظلّ» فعل ماض ناقص. و«الْعَذَارَى» اسمها مرفوع بضمة مقدرة، وجملة «يرتمين» خبرها."
  - "«بِلَحْمِهَا»: متعلق بـ«يرتمين». و«وَشَحْمٍ» معطوف على «لحمها»."
  - "«كَهُدَّابِ»: الكاف «في موضع خفض لأنها نعت للشحم، كأنك قلت: وشحم مثل هُدّاب» [@ibn-al-anbari، ص36]. و«الدِّمَقْسِ» مضاف إليه، و«الْمُفَتَّلِ» نعت له."
morphology:
  - "«ظلّ» أصله «ظَلِلَ»، «فكرهت العرب أن يُجمع بين حرفين متحركين من جنس واحد، فأسقطوا حركة الحرف الأول وأدغموه في الثاني» [@ibn-al-anbari، ص35]."
  - "«يَرْتَمِينَ» «يفتعلن من الرمي» [@ibn-al-anbari، ص36]."
  - "«الْمُفَتَّل» اسم مفعول من «فتّل»، والتضعيف للتكثير: أُجيد فتله."
rhetoric:
  thesis: "مشهد لهو في وضح النهار، وصورته الحسية كلها بياض ونعومة."
  devices:
    - title: "التشبيه"
      text: "شبّه الشحم بهُدّاب الحرير الأبيض. قال الأَصْمَعِيّ: «فشبه بياض اللحم ولينه ونَعمته بذلك» [@ibn-al-anbari، ص35]."
    - title: "اختيار «ظلّ»"
      text: "الفعل يدل على أن اللهو امتد النهار كله، لا ساعة منه."
    - title: "المشبه به من عالم الترف"
      text: "الحرير المفتول صورة من نعمة الملوك، تناسب ابن ملك يطعم الفتيات."
  connection: "ثم يروي يومًا آخر: «ويوم دخلت الخدر خدر عُنَيْزة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَظَلْ لَلْ / عَذَارَى يَرْ / تَمِينَ / بِلَحْمِهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — وَشَحْمِنْ / كَهُدْدَابِدْ / دِمَقْسِلْ / مُفَتْتَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الثالثة من الصدر وحدها [@atiq، ص29]."
