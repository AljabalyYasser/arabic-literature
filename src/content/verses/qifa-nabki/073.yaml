first: "قَعَدْتُ لَهُ وَصُحْبَتِي بَيْنَ ضَارِجٍ"
second: "وَبَيْنَ الْعُذَيْبِ بُعْدَ مَا مُتَأَمَّلِ"
meaning: "قعدت مع أصحابي بين ضارج والعُذيب ننظر إلى هذا البرق من أين يأتي بالمطر، فما أبعد ما نظرت إليه! قال الأَصْمَعِيّ: «معناه قعدت لذلك البرق انظر من أين يجيء بالمطر»، «وقوله (بُعد ما متأمل) معناه يا بُعد ما تأملت» [@ibn-al-anbari، ص102]."
vocabulary:
  - term: "ضَارِجٍ"
    text: "موضع [@ibn-al-anbari، ص102]."
  - term: "الْعُذَيْبِ"
    text: "موضع [@ibn-al-anbari، ص102]."
  - term: "مُتَأَمَّلِ"
    text: "المنظور إليه، أي السحاب الذي «كنت أنظر إليه وأرقب مطره» [@zawzani، ص74]."
syntax:
  - "«قَعَدْتُ لَهُ»: الضمير للبرق. و«وصحبتي بين ضارج»: «والصحبة يرتفعون ببين، والواو واو حال» [@ibn-al-anbari، ص102]؛ أي جملة حالية."
  - "«بُعْدَ مَا مُتَأَمَّلِ»: فيه أقوال. قال ابن الأَنْبارِيّ: «وموضع ما خفض ببعد ومعناها الذي، والمتأمل مرفوع بإضمار هو» [@ibn-al-anbari، ص102]، أي: يا بُعدَ الذي هو متأمَّل. وقال الزَّوْزَنِيّ: «أصله بَعُدَ ما فخففه فقال بَعْدَ، وما زائدة وتقديره: بعُد متأملي» [@zawzani، ص74]."
morphology:
  - "«بُعْدَ» على قول من جعله فعلًا أصله «بَعُدَ»، «فألقيت ضمة العين على الباء، كما قالوا نُعْم الرجل وأصله نَعِم الرجل» [@ibn-al-anbari، ص102]."
  - "«مُتَأَمَّل» اسم مفعول من «تأمّل»."
  - "«العُذَيْب» على صيغة التصغير «فُعَيْل»."
rhetoric:
  thesis: "مشهد انتظار: جماعة قاعدة ترقب برقًا بعيدًا، فيتعجب الشاعر من بعده."
  devices:
    - title: "التعجب"
      text: "«بُعدَ ما متأمَّل»: عبارة موجزة تحمل التعجب، «يا بُعد ما تأملت أي تبينت» [@ibn-al-anbari، ص102]؛ فهو يرى السحاب من مكان بعيد جدًّا."
    - title: "تحديد المكان"
      text: "حدد مجلسه بين موضعين، كما حدد الأطلال في المطلع بين الدَّخول وحَوْمل؛ فالقصيدة تبدأ بمكان وتنتهي بمكان."
    - title: "الإيجاز"
      text: "الشطر الأخير يحتاج إلى تقدير كثير، ولذلك تعددت فيه أقوال الشراح. وهذا الإيجاز يجعل التعجب يأتي في كلمات قليلة."
  connection: "ثم يصف امتداد السحاب: «علا قطنا بالشيم أيمن صوبه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "قَعَدْتُ / لَهُو وَصُحْ / بَتِي بَيْ / نَ ضَارِجِنْ = فعولُ / مفاعلن / فعولن / مفاعلن — وَبَيْنَلْ / عُذَيْبِ بُعْ / دَ مَا مُ / تَأَمْمَلِي = فعولن / مفاعلن / فعولُ / مفاعلن"
  note: "هاء «لَهُ» تُشبع فتُنطق «لَهُو». دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والثالثة من العَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الشطرين فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "قال شوقي ضيف: «ويصف كيف جلس هو وأصحابه يتأملونه بين حامر وإكام» [@deif، ج1 ص256]، على روايته."
