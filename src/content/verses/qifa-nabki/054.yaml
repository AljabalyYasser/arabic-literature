first: "مِكَرٍّ مِفَرٍّ مُقْبِلٍ مُدْبِرٍ مَعًا"
second: "كَجُلْمُودِ صَخْرٍ حَطَّهُ السَّيْلُ مِنْ عَلِ"
meaning: "فرس يكرّ إذا أريد منه الكرّ، ويفرّ إذا أريد منه الفرّ، ويقبل ويدبر؛ كل ذلك حاضر فيه، وهو في سرعته وصلابته كصخرة عظيمة دفعها السيل من أعلى [@zawzani، ص64]."
vocabulary:
  - term: "مِكَرٍّ"
    text: "كثير الكرّ، أي الرجوع على العدو."
  - term: "مِفَرٍّ"
    text: "كثير الفرار حين يُراد منه."
  - term: "جُلْمُودِ"
    text: "الحجر العظيم الصلب [@zawzani، ص64]."
  - term: "حَطَّهُ"
    text: "ألقاه من علو إلى أسفل [@zawzani، ص64]."
  - term: "مِنْ عَلِ"
    text: "من فوق."
syntax:
  - "«مِكَرٍّ مِفَرٍّ مُقْبِلٍ مُدْبِرٍ» نعوت لـ«منجرد» في البيت السابق [@ibn-al-anbari، ص83]، ولذلك جاءت مجرورة."
  - "«مَعًا» منصوب على الحال: مجتمعةً."
  - "«كَجُلْمُودِ صَخْرٍ» صفة أخرى، و«حَطَّهُ السَّيْلُ» جملة صفة لـ«جُلْمُود»، و«السَّيْلُ» فاعل [@ibn-al-anbari، ص83]. و«جُلْمُود صخر» من إضافة البعض إلى الكل، أي: جُلْمُود من صخر، كقولهم: باب حديد [@zawzani، ص64]."
morphology:
  - "«مِكَرٍّ» و«مِفَرٍّ» على وزن «مِفْعَل»، وهو وزن يفيد المبالغة؛ لأنه يأتي في أسماء الآلات، فكأن الفرس أداة للكرّ والفرّ [@zawzani، ص64]."
  - "«الجُلمود» والجَلْمَد: الحجر العظيم الصلب، وجمعه جلامد وجلاميد [@zawzani، ص64]."
  - "«مِنْ عَلِ»: أي من فوق، وفيها لغات كثيرة، منها: من علُ، ومن علوُ، ومن عالٍ [@zawzani، ص64]."
rhetoric:
  thesis: "بيت يجمع الأضداد في لحظة واحدة، ثم يختمها بصورة صخرة هاوية؛ فيحسّ القارئ السرعة والقوة معًا."
  devices:
    - title: "الطباق"
      text: "الطباق هو الجمع بين الضدين. وهنا جمع بين «مِكَرٍّ» و«مِفَرٍّ»، وبين «مُقْبِلٍ» و«مُدْبِرٍ». لكن الفرس لا يكرّ ويفرّ في اللحظة نفسها؛ فالمعنى أنه قادر على كل ذلك متى أراد صاحبه، فالأضداد مجتمعة «في قوته لا في فعله؛ لأن فيها تضادًا» [@zawzani، ص64]."
    - title: "التشبيه"
      text: "في «كَجُلْمُودِ صَخْرٍ حَطَّهُ السَّيْلُ مِنْ عَلِ» شبّهه «في سرعة مَرّه وصلابة خلقه بحُجْر عظيم ألقاه السيل من مكان عالٍ» [@zawzani، ص64]؛ والجُلمود: الصخرة الصلبة."
    - title: "تتابع الصفات"
      text: "أربع صفات متتالية بلا حرف عطف: «مِكَرٍّ مِفَرٍّ مُقْبِلٍ مُدْبِرٍ»؛ فتأتي سريعة كعدو الفرس."
  connection: "ثم يمضي في وصف الفرس ولونه وعدْوه إلى البيت السبعين."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "مِكَرْرِنْ / مِفَرْرِنْ مُقْ / بِلِنْ مُدْ / بِرِنْ مَعَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — كَجُلْمُو / دِ صَخْرِنْ حَطْ / طَهُسْ سَيْ / لُ مِنْ عَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "التنوين يُحسب نونًا ساكنة، فتتوالى في الصدر أربع نونات: «مِكَرْرِنْ مِفَرْرِنْ مُقْبِلِنْ مُدْبِرِنْ» [@ahda-sabil، ص13]. وجاء البيت كله بلا قبض في «فعولن»، فإيقاعه تام."
context: "كيف يجتمع الإقبال والإدبار «مَعًا»؟ يجيب الزَّوْزَنِيّ: هي «مجتمعة في قوته لا في فعله؛ لأن فيها تضادًا» [@zawzani، ص64]. وقال غيره: إذا استقبلته حسن، وإذا استدبرته حسن [@ibn-al-anbari، ص83]. وصيغة «مِفعَل» في «مِكَرٍّ» و«مِفَرٍّ» تفيد المبالغة، كأن الفرس آلة للكرّ والفرّ [@zawzani، ص64]."
