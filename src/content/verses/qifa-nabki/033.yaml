first: "وَجِيدٍ كَجِيدِ الرِّيمِ لَيْسَ بِفَاحِشٍ"
second: "إِذَا هِيَ نَصَّتْهُ وَلَا بِمُعَطَّلِ"
meaning: "وتبدي عن عنق كعنق الظبي الأبيض، لا يجاوز الطول المحمود إذا رفعته، وليس عاطلًا من الحلي كعنق الظبي. قال الزَّوْزَنِيّ: «فشبّه عنقها بعنق الظبية في حال رفعها عنقها، ثم ذكر أنه لا يشبه عنق الظبي في التعطّل عن الحلي» [@zawzani، ص54]."
vocabulary:
  - term: "جِيدٍ"
    text: "العنق [@ibn-al-anbari، ص61]."
  - term: "الرِّيمِ"
    text: "«الظبي الأبيض الشديد البياض» [@ibn-al-anbari، ص61]."
  - term: "فَاحِشٍ"
    text: "«ما جاوز القدر المحمود من كل شيء» [@zawzani، ص54]."
  - term: "نَصَّتْهُ"
    text: "رفعته. «ومنه سُمّي ما تُجلى عليه العروس مِنَصّة» [@zawzani، ص54]."
  - term: "مُعَطَّلِ"
    text: "«العُطُل الذي لا حلي عليه» [@ibn-al-anbari، ص61]."
syntax:
  - "«وَجِيدٍ»: مجرور عطفًا على «بناظرة» في البيت السابق [@ibn-al-anbari، ص61]."
  - "«كَجِيدِ الرِّيمِ»: الكاف في موضع جر نعت لـ«جيد»، «والتقدير: وجيد مثل جيد الريم» [@ibn-al-anbari، ص61]."
  - "«لَيْسَ بِفَاحِشٍ»: «ليس» فعل ناقص، واسمها ضمير يعود على الجيد، والباء زائدة، و«فاحش» خبرها مجرور لفظًا منصوب محلًّا."
  - "«إِذَا هِيَ نَصَّتْهُ»: «إذا» ظرف متعلق بـ«فاحش» [@ibn-al-anbari، ص61]، و«هي» فاعل لفعل محذوف يفسره «نصّته». و«وَلَا بِمُعَطَّلِ» معطوف على «بفاحش»، و«لا» لتأكيد النفي."
morphology:
  - "«الرِّيم» أصلها «الرِّئْم» بالهمز، خُففت الهمزة فصارت ياء، وجمعها «أرآم» [@ibn-al-anbari، ص61]."
  - "«نَصَّت» مضعّف من «نصّ ينُصّ»."
  - "«مُعَطَّل» اسم مفعول من «عطّل»."
rhetoric:
  thesis: "تشبيه يستدرك على نفسه: عنقها كعنق الظبي في طوله وبياضه، لكن بلا عيبين فيه."
  devices:
    - title: "التشبيه من جهة واحدة"
      text: "قال ابن رَشِيق: التشبيه «صفة الشيء بما قاربه وشاكله، من جهة واحدة أو جهات كثيرة، لا من جميع جهاته»، ومثّل بقولهم «جيد كجيد الريم»، أي «أن هذا الجيد لانتصابه وطوله كجيد الريم» [@ibn-rashiq، ج1 ص286]."
    - title: "الاحتراس"
      text: "خاف أن يُفهم من التشبيه ما لا يريد، فنفى أمرين: الطول المفرط «ليس بفاحش»، والعُطْل «ولا بمعطّل». فأخذ من الظبي أجمل ما فيه، وترك ما لا يليق بامرأة."
  connection: "ثم ينتقل إلى شعرها: «وفرع يزين المتن أسود فاحم»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَجِيدِنْ / كَجِيدِرْ رِي / مِ لَيْسَ / بِفَاحِشِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — إِذَا هِ / يَ نَصْصَتْهُو / وَلَا بِ / مُعَطْطَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "هاء «نصّته» تُشبع فتُنطق «نَصَّتْهُو». ودخل القبضُ، وهو حذف الخامس الساكن «فعولن» ثلاث مرات [@atiq، ص29]."
