first: "وَيَوْمَ دَخَلْتُ الْخِدْرَ خِدْرَ عُنَيْزَةٍ"
second: "فَقَالَتْ لَكَ الْوَيْلَاتُ إِنَّكَ مُرْجِلِي"
meaning: "ويوم دخلت هودج عُنَيْزة، فقالت: لك الويل، إنك ستجعلني أمشي على رجليّ. قال الزَّوْزَنِيّ: «وقالت: إنك تصيرني راجلة لعقرك ظهر بعيري، يريد أن هذا اليوم كان من محاسن الأيام الصالحة التي نلتها منهن أيضًا» [@zawzani، ص42]."
vocabulary:
  - term: "الْخِدْرَ"
    text: "«الخدر: الهودج»، ويستعار للستر، «ومنه قولهم: خدرت الجارية، وجارية مخدَّرة أي: مقصورة في خدرها لا تبرز منه» [@zawzani، ص41]."
  - term: "عُنَيْزَةٍ"
    text: "صاحبته، وفيها أقوال: «قال ابن الكَلْبِيّ: لا أعرف عنيزة. وقال الأَصْمَعِيّ: عنيزة لقب لفاطمة»، وقال ابن حبيب: هي موضع [@ibn-al-anbari، ص36]."
  - term: "لَكَ الْوَيْلَاتُ"
    text: "الويلات جمع ويلة، «والويلة والويل: شدة العذاب» [@zawzani، ص41]."
  - term: "مُرْجِلِي"
    text: "تجعلني راجلة: «إنك تعقر بعيري فتدعني ذات رجلة» [@ibn-al-anbari، ص37]."
syntax:
  - "«وَيَوْمَ»: «منسوق على قوله: ويوم عقرت، يجوز فيه ما جاز فيه، وهو منصوب من قول قوم من النحويين بفعل مضمر، كأنك قلت: واذكر يوم عقرت» [@ibn-al-anbari، ص36]."
  - "«الْخِدْرَ خِدْرَ عُنَيْزَةٍ»: «والخدر منصوب بدخلت، وخدر عنيزة مترجم عن الخدر الأول» [@ibn-al-anbari، ص36]، أي بدل منه، «مثل قوله تعالى: لعلي أبلغ الأسباب، أسباب السموات» [@zawzani، ص42]."
  - "«عُنَيْزَةٍ»: ممنوعة من الصرف للعلمية والتأنيث، «ولكنه خفضها بتنوين لضرورة الشعر» [@ibn-al-anbari، ص36]."
  - "«لَكَ الْوَيْلَاتُ»: «الويلات» مبتدأ مؤخر، و«لك» خبر مقدم. و«إِنَّكَ مُرْجِلِي» جملة مستأنفة تعلل الدعاء."
morphology:
  - "«عُنَيْزَة» على صيغة التصغير «فُعَيْلة»."
  - "«مُرْجِل» اسم فاعل من «أرجل»: «يقال رجل الرجل يرجل رجلا، وأرجله إرجالا» [@ibn-al-anbari، ص37]."
  - "«الْوَيْلَات» جمع «ويلة» جمع مؤنث سالمًا."
rhetoric:
  thesis: "مشهد بحوار: الشاعر لا يصف عنيزة، بل ينقل كلامها، فتحضر في القصيدة بصوتها."
  devices:
    - title: "دعاء ظاهره الذم"
      text: "«لك الويلات» فيه قولان: دعاء عليه حقيقة، لأنها تخاف على بعيرها، أو دعاء له في صورة الدعاء عليه، «كما تقول العرب للرجل إذا رمى فأجاد: قاتله الله ما أرماه!» [@ibn-al-anbari، ص36]. قال الزَّوْزَنِيّ: «والعرب تفعل ذلك صرفًا لعين الكمال عن المدعو عليه» [@zawzani، ص41]."
    - title: "البدل"
      text: "كرر «الخدر» ثم أضافه: «الخدر خدر عنيزة»؛ فالتكرار يبطئ الكلام عند المكان المقصود ويسمّيه."
    - title: "الحوار"
      text: "نقل كلامها بلفظه، فصار البيت مشهدًا قصصيًّا. وهذا الغزل القصصي هو الذي يقول شوقي ضيف إن امرأ القَيْس بدأه [@deif، ج1 ص251]."
  connection: "ثم يكمل الحوار: «تقول وقد مال الغبيط بنا معا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَيَوْمَ / دَخَلْتُلْ خِدْ / رَ خِدْرَ / عُنَيْزَتِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — فَقَالَتْ / لَكَلْ وَيْلَا / تُ إِنْنَ / كَ مُرْجِلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "يصف شوقي ضيف هذا الموضع: «ثم يفيض في وصف يوم عنيزة مصورا كيف كان ينال منها وكيف كانت تدل عليه أحيانا» [@deif، ج1 ص249]. وهو مما تحكيه قصة دارة جُلْجُل."
variants:
  - reading: "وَيَوْمَ دَخَلْتُ الْخِدْرَ يَوْمَ عُنَيْزَةٍ"
    status: "رواية ابن حبيب"
    note: "وعنده أن «عنيزة: هضبة سوداء بالشحر ببطن فلج» [@ibn-al-anbari، ص36]، أي موضع لا امرأة."
