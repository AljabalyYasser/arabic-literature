first: "تُضِيءُ الظَّلَامَ بِالْعِشَاءِ كَأَنَّهَا"
second: "مَنَارَةُ مُمْسَى رَاهِبٍ مُتَبَتِّلِ"
meaning: "يضيء وجهها ظلام أول الليل، كأنها سراج راهب منقطع للعبادة يوقده في المساء. قال ابن الأَنْبارِيّ: «إذا برزت في الظلام استنار وجهها وظهر جمالها حتى يغلب الظلمة» [@ibn-al-anbari، ص67]."
vocabulary:
  - term: "الْعِشَاءِ"
    text: "أول الليل."
  - term: "مَنَارَةُ"
    text: "«المسرجة، وهي مَفْعَلة من النور» [@ibn-al-anbari، ص67]، أي موضع السراج."
  - term: "مُمْسَى"
    text: "«بمعنى الإمساء والوقت جميعًا» [@zawzani، ص57]."
  - term: "مُتَبَتِّلِ"
    text: "«المنقطع إلى الله بنيته وعمله» [@zawzani، ص57]، ومنه قوله تعالى: «وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًا»."
syntax:
  - "«تُضِيءُ»: مضارع، وفاعله ضمير يعود على المرأة. و«الظَّلَامَ» مفعول به، لأن «أضاء» يكون لازمًا ومتعديًا [@zawzani، ص57]."
  - "«بِالْعِشَاءِ»: الباء بمعنى «في»، والجار والمجرور متعلق بـ«تضيء»."
  - "«كَأَنَّهَا»: «كأنّ» والهاء اسمها، و«مَنَارَةُ» خبرها، و«مُمْسَى» مضاف إليه، و«رَاهِبٍ» مضاف إليه، و«مُتَبَتِّلِ» نعت للراهب [@ibn-al-anbari، ص68]."
morphology:
  - "«مَنَارة» على «مَفْعَلة» من النور، «أصلها منورة، فألقيت فتحة الواو على النون وصارت ألفًا» [@ibn-al-anbari، ص68]."
  - "«مُمْسى» مصدر ميمي واسم زمان من «أمسى»."
  - "«مُتَبَتِّل» اسم فاعل من «تبتّل» على «تفعّل»."
rhetoric:
  thesis: "يخرج من وصف الأعضاء إلى وصف الأثر: جمالها ضوء يغلب الظلام."
  devices:
    - title: "التشبيه"
      text: "شبّهها بسراج الراهب. قال ابن حبيب: «شبهها بسراج الراهب لأن سراج الراهب لا يُطفأ» [@ibn-al-anbari، ص68]؛ فالراهب يسهر الليل في العبادة، وسراجه باقٍ حتى الصباح."
    - title: "«أضاء» متعديًا"
      text: "لم يقل «تضيء في الظلام»، بل «تضيء الظلامَ»؛ فجعل الظلام نفسه مفعولًا تقع عليه إضاءتها."
    - title: "تقييد المشبه به"
      text: "لم يكتفِ بالمنارة، بل قيّدها بوقت المساء وبصاحبها الراهب المتبتل. فصارت الصورة ضوءًا وحيدًا ثابتًا في ظلام البرية، يراه السائر من بعيد."
  connection: "ثم يقول: «إلى مثلها يرنو الحليم صبابة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "تُضِي ءُظْ / ظَلَامَ بِلْ / عِشَا ءِ / كَأَنْنَهَا = فعولن / مفاعلن / فعولُ / مفاعلن — مَنَا رَ / ةُ مُمْسَى رَا / هِبِنْ مُ / تَبَتْتِلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]، و«فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
