first: "عَلَا قَطَنًا بِالشَّيْمِ أَيْمَنُ صَوْبِهِ"
second: "وَأَيْسَرُهُ عَلَى السِّتَارِ فَيَذْبُلِ"
meaning: "علا جانبُ المطر الأيمن جبلَ قَطَن، فيما نقدّره بالنظر، وجانبه الأيسر على جبلي السِّتار ويَذْبُل. قال الزَّوْزَنِيّ: «يصف عظم السحاب، وغزارته وعموم جوده، وقوله: بالشيم، أراد: إني ما أحكم به حدسًا وتقديرًا لأنه لا يرى ستارًا ويذبل وقطن معًا» [@zawzani، ص74]."
vocabulary:
  - term: "قَطَنًا"
    text: "«جبل في أرض بني أَسَد» [@ibn-al-anbari، ص102]."
  - term: "الشَّيْمِ"
    text: "«النظر إلى البرق أين هو» [@ibn-al-anbari، ص102–103]، «مع ترقب المطر» [@zawzani، ص74]."
  - term: "صَوْبِهِ"
    text: "«نزول المطر» [@ibn-al-anbari، ص103]."
  - term: "السِّتَارِ فَيَذْبُلِ"
    text: "«جبلان» [@ibn-al-anbari، ص103]، «وبينهما وبين قَطَن مسافة بعيدة» [@zawzani، ص74]."
syntax:
  - "«والقطن منصوب بعلا... وأيمن مرفوع بعلا» [@ibn-al-anbari، ص103]، أي «أيمنُ» فاعل مؤخر و«قطنًا» مفعول مقدم."
  - "«وأيسر مرفوع بقوله على الستار، ويذبل نسق على الستار» [@ibn-al-anbari، ص103]؛ أي «أيسره» مبتدأ و«على الستار» خبره."
  - "«بِالشَّيْمِ»: متعلق بـ«علا»، أي فيما يُرى بالنظر والتقدير."
morphology:
  - "«عَلَا» ماض من العلوّ، أصل ألفه واو."
  - "«أَيْمَن» و«أَيْسَر» على «أفعل». قال ابن الأَنْبارِيّ: «العرب تقول: يمنة وشأمة ولا يقولون يسرة» [@ibn-al-anbari، ص103]."
  - "«صَوْب» «مصدر صاب يصوب صوبًا أي نزل من علو إلى سفل» [@zawzani، ص74]."
rhetoric:
  thesis: "سحاب يملأ الأفق: جانب منه على جبل، وجانب على جبلين بعيدين."
  devices:
    - title: "المبالغة"
      text: "جعل للمطر يمينًا ويسارًا تمتدان بين جبال متباعدة، فصار السحاب بحجم الأفق كله."
    - title: "الاحتراس بـ«بالشيم»"
      text: "قيّد المبالغة بأنها نظر وتقدير: «أراد: إني ما أحكم به حدسًا وتقديرًا» [@zawzani، ص74]؛ فهو لا يدّعي أنه رأى الجبال الثلاثة معًا."
    - title: "المقابلة"
      text: "بين «أيمن صوبه» و«أيسره»."
  connection: "ثم يقول: «فأضحى يسح الماء حول كُتيفة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "عَلَا قَ / طَنَنْ بِشْشَيْ / مِ أَيْمَ / نُ صَوْبِهِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَأَيْسَ / رُهُو عَلَسْ / سِتَارِ / فَيَذْبُلِي = فعولُ / مفاعلن / فعولُ / مفاعلن"
  note: "هاء «أيسرُه» تُشبع فتُنطق «أَيْسَرُهُو». دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الشطرين [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "ويَذْبُل هو الجبل الذي شُدّت إليه نجوم الليل في البيت 47. وقال شوقي ضيف في معنى البيت: «حتى ليظن مبصره أن أيمنه على قطن جبل بني أَسَد وأيسره على الستار ويذبل مما يلي بلاد البحرين» [@deif، ج1 ص256]."
variants:
  - reading: "عَلَى قَطَنٍ بِالشَّيْمِ أَيْمَنُ صَوْبِهِ"
    status: "رواية أخرى"
    note: "«ومن رواه: على قطن قال: على صلة والقطن مخفوض بها، وأيمن يرتفع بعلى» [@ibn-al-anbari، ص103]. وبها يرويه الزَّوْزَنِيّ وشوقي ضيف [@zawzani، ص74] [@deif، ج1 ص256]."
  - reading: "وَأَيْسَرُهُ عَلَى النِّبَاجِ وَثَيْتَلِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«النباج وثيتل: موضعان، وهما ماءان لبني سعد بن زيد مناة مما يلي البحرين» [@ibn-al-anbari، ص103]."
