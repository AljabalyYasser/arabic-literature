first: "كَأَنَّ السِّبَاعَ فِيهِ غَرْقَى عَشِيَّةً"
second: "بِأَرْجَائِهِ الْقُصْوَى أَنَابِيشُ عُنْصُلِ"
meaning: "كأن السباع التي غرقت في السيل عشيةً، في أطرافه البعيدة، أصولُ بصل بري نُبشت من الأرض. قال الزَّوْزَنِيّ: «شبه تلطخها بالطين والماء الكدر بأصول البصل البري؛ لأنها متلطخة بالطين والتراب» [@zawzani، ص78]."
vocabulary:
  - term: "غَرْقَى"
    text: "جمع غريق [@zawzani، ص77]."
  - term: "أَرْجَائِهِ"
    text: "«النواحي والجوانب، واحدها رجا» [@ibn-al-anbari، ص111]."
  - term: "الْقُصْوَى"
    text: "«تأنيث الأقصى: وهو الأبعد» [@zawzani، ص78]."
  - term: "أَنَابِيشُ"
    text: "«أصول النبت، سميت بذلك لأنها ينبش عنها» [@zawzani، ص78]."
  - term: "عُنْصُلِ"
    text: "«البصل البري» [@zawzani، ص78]، «يعمل منه خل عنصلان، وهو شديد الحموضة» [@ibn-al-anbari، ص111]."
syntax:
  - "«كَأَنَّ السِّبَاعَ»: «والسباع اسم كأنّ، وغرقى منصوب على الحال من السباع، وأنابيشُ خبر كأنّ» [@ibn-al-anbari، ص112]."
  - "«فِيهِ» و«بِأَرْجَائِهِ»: جاران ومجروران متعلقان بـ«غرقى»، والضمير فيهما للسيل. و«عَشِيَّةً» ظرف زمان."
morphology:
  - "«غَرْقَى» على «فَعْلى» جمع «فعيل»، «مثل مرضى ومريض وجرحى وجريح» [@zawzani، ص77]."
  - "«الْقُصْوَى» على «فُعْلى»، ويقال «القُصيا»، «والياء لغة نجد والواو لغة سائر العرب» [@zawzani، ص78]."
  - "«أَنَابِيش» جمع «أُنبوشة» [@zawzani، ص78]. و«العُنْصُل» يقال بضم الصاد وفتحها [@ibn-al-anbari، ص111]."
rhetoric:
  thesis: "آخر صورة في القصيدة: السباع، رمز القوة، صارت أشياء صغيرة ملطخة بالطين يطفو بها السيل."
  devices:
    - title: "التشبيه"
      text: "شبّه السباع الغرقى بأصول البصل البري المنبوشة: كلاهما متلطخ بالطين، ملقى على وجه الأرض. «قال أبو عُبَيْدة: شبه السباع الغرقى بما نبش من العنصل» [@ibn-al-anbari، ص111]."
    - title: "تصغير القوي"
      text: "اختار السباع، أقوى ما في البادية، ثم جعلها في صورة نبات حقير. فقوة السيل تظهر في ما صنعه بالأقوياء."
    - title: "خاتمة بلا خاتمة"
      text: "لا يعود إلى نفسه ولا إلى صاحبته، بل يترك القصيدة على صورة السيل. قال ابن رَشِيق: «ومن العرب من يختم القصيدة فيقطعها والنفس بها متعلقة... ألا ترى معلقة امرئ القَيْس كيف ختمها بقوله يصف السيل... فلم يجعل لها قاعدة كما فعل غيره من أصحاب المعلقات، وهي أفضلها» [@ibn-rashiq، ج1 ص240–241]."
  connection: "وهو آخر القصيدة. قال ابن الأَنْبارِيّ: «تمت قصيدة امرئ القَيْس بغريبها، وهي اثنان وثمانون بيتا» [@ibn-al-anbari، ص112]."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنَسْ / سِبَاعَ فِي / هِ غَرْقَى / عَشِيْيَتَنْ = فعولن / مفاعلن / فعولن / مفاعلن — بِأَرْجَا / ئِهِلْ قُصْوَى / أَنَابِي / شُ عُنْصُلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]، وسائر البيت تام."
context: "قال شوقي ضيف في معنى المقطع: «وما زالت السيول تفيض حتى علت آجام السباع فغرقت في لججها وتراءت رءوسها للعين كأنها جذور البصل البري» [@deif، ج1 ص256]."
variants:
  - reading: "كَأَنَّ السِّبَاعَ فِيهِ غَرْقَى غُدَيَّةً"
    status: "رواية أخرى"
    note: "«يقول: حين أصبح الناس ورأوها» [@ibn-al-anbari، ص111]. وبها يرويه ابن رَشِيق [@ibn-rashiq، ج1 ص241]."
