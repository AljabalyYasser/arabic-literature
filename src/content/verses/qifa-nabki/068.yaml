first: "فَظَلَّ طُهَاةُ اللَّحْمِ مِنْ بَيْنِ مُنْضِجٍ"
second: "صَفِيفَ شِوَاءٍ أَوْ قَدِيرٍ مُعَجَّلِ"
meaning: "فظل الطباخون بين من يشوي اللحم مصفوفًا على الحجارة، ومن يطبخه في القدر مستعجلًا. قال الزَّوْزَنِيّ: «يقول كثر الصيد فأخصب القوم فطبخوا واشتووا» [@zawzani، ص72]."
vocabulary:
  - term: "طُهَاةُ"
    text: "«الطباخون، واحدهم طاه» [@ibn-al-anbari، ص97]."
  - term: "مُنْضِجٍ"
    text: "من الإنضاج، وهو «يشتمل على طبخ اللحم وشيِّه» [@zawzani، ص71]."
  - term: "صَفِيفَ شِوَاءٍ"
    text: "الصفيف: «المصفوف على الحجارة لينضج» [@zawzani، ص72]، وعند ابن الأَنْبارِيّ: «المرقق» [@ibn-al-anbari، ص97]."
  - term: "قَدِيرٍ"
    text: "«الطبيخ، وأصله المقدور الذي طبخ في القدور، فصرف من مفعول إلى فعيل» [@ibn-al-anbari، ص97]."
  - term: "مُعَجَّلِ"
    text: "«الذي لا يحبس» [@ibn-al-anbari، ص98]، «ويستحب تعجيل كل ما كان من الصيد يستطرف» [@ibn-al-anbari، ص97]."
syntax:
  - "«فَظَلَّ»: «بمنزلة كان في العمل»، و«طهاة» اسمها، «ومن خبر ظل وهي خافضة لبين، وبين خافضة لمنضج» [@ibn-al-anbari، ص97]."
  - "«صَفِيفَ»: «منصوب بمنضج»، أي مفعول به لاسم الفاعل."
  - "«أَوْ قَدِيرٍ»: جُرّ وهو معطوف على «صفيف» المنصوب، لأنه عُطف على المعنى، كأنه قال: من بين منضجِ صفيفٍ أو قديرٍ. قال ابن الأَنْبارِيّ: «والقدير نسق على الصفيف في التقدير... أجاز الكسائي والفَرّاء: عبد الله مكرم أخيك في الدار وأباك» [@ibn-al-anbari، ص97]."
  - "«مِنْ بَيْنِ»: «مِن» هنا «للتفصيل والتفسير، كقولهم: هم من بين عالم وزاهد» [@zawzani، ص72]."
morphology:
  - "«طُهَاة» جمع «طاهٍ» على «فُعَلة»، «كالقضاة جمع قاضٍ» [@zawzani، ص71]."
  - "«قَدِير» فعيل بمعنى مفعول [@ibn-al-anbari، ص97]."
  - "«مُعَجَّل» اسم مفعول من المضعف «عجّل»."
rhetoric:
  thesis: "خاتمة يوم الصيد: وليمة، والطباخون لا يعرفون إلا صنفين من العمل."
  devices:
    - title: "التقسيم"
      text: "قسم الطهاة صنفين: شاوٍ وطابخ، «يريد أنهم لا يعدون الصنفين» [@zawzani، ص72]."
    - title: "الكناية عن الكرم والخصب"
      text: "كثرة الطهاة وتنوع الطعام كناية عن كثرة الصيد، وعن كرم القوم الذين يطعمون منه."
    - title: "دقة «معجّل»"
      text: "اللحم لا يُحبس حتى ينضج على مهل، بل يُعجَّل؛ فهم جياع بعد الصيد، وهو صيد طازج يُستطرف."
  connection: "ثم يعود القوم مساء: «ورحنا يكاد الطرف يقصر دونه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَظَلْلَ / طُهَاتُلْ لَحْ / مِ مِنْ بَيْ / نِ مُنْضِجِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — صَفِيفَ / شِوَائِنْ أَوْ / قَدِيرِنْ / مُعَجْجَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الشطرين [@atiq، ص29]."
context: "قال شوقي ضيف: «فصادوا ما ابتغوا، وأخذ الطهاة يعدون لهم طعامهم بين مشوي ومطبوخ» [@deif، ج1 ص255]."
