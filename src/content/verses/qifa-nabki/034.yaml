first: "وَفَرْعٍ يَزِينُ الْمَتْنَ أَسْوَدَ فَاحِمٍ"
second: "أَثِيثٍ كَقِنْوِ النَّخْلَةِ الْمُتَعَثْكِلِ"
meaning: "وتبدي عن شعر تامّ يزين ظهرها، شديد السواد، كثيف، كعذق النخلة المتدلي بشماريخه. قال الزَّوْزَنِيّ: «وتبدي عن شعر طويل تام يزين ظهرها إذا أرسلته عليه، ثم شبه ذؤابتيها بقنو نخلة أخرجت قنوانها» [@zawzani، ص55]."
vocabulary:
  - term: "فَرْعٍ"
    text: "«الشعر التام» [@ibn-al-anbari، ص62]."
  - term: "الْمَتْنَ"
    text: "«ما عن يمين الصلب وشماله من العصب واللحم» [@ibn-al-anbari، ص62]، أي الظهر."
  - term: "فَاحِمٍ"
    text: "«الشديد السواد، وهو مشتق من الفحم» [@ibn-al-anbari، ص62]."
  - term: "أَثِيثٍ"
    text: "«كثير» [@ibn-al-anbari، ص62]."
  - term: "قِنْوِ"
    text: "العِذق، و«القنو: من التمر كالعنقود من العنب» [@zawzani، ص54، الحاشية]."
  - term: "الْمُتَعَثْكِلِ"
    text: "«الذي قد دخل بعضه في بعض لكثرته»، «وقال بعض أهل اللغة: المتعثكل المتدلي» [@ibn-al-anbari، ص62]."
syntax:
  - "«وَفَرْعٍ»: «نسق على الجيد» [@ibn-al-anbari، ص62] في البيت السابق، أي معطوف على «أسيل» و«جيد»: وتبدي عن فرعٍ."
  - "«يَزِينُ الْمَتْنَ»: جملة صفة، «والمتن منصوب بيزين» [@ibn-al-anbari، ص62]."
  - "«أَسْوَدَ»: «نعت للفرع، ونصب في اللفظ لأنه لا يجرى»، أي مجرور بالفتحة لأنه ممنوع من الصرف، «والفاحم نعت للأسود» [@ibn-al-anbari، ص62]."
  - "«أَثِيثٍ»: «نعت للفرع، والكاف في موضع خفض على النعت للأثيث، والتقدير: أثيث مثل قنو النخلة» [@ibn-al-anbari، ص62]."
morphology:
  - "«أَسْوَد» على «أفعل» صفة، ممنوع من الصرف للوصفية ووزن الفعل."
  - "«أَثِيث» على «فعيل» من «أثّ الشعر والنبت» [@zawzani، ص54]."
  - "«الْمُتَعَثْكِل» اسم فاعل من «تعثكل»، والعثاكيل: الشماريخ، «الواحد عثكول وعثكال» [@ibn-al-anbari، ص62]."
rhetoric:
  thesis: "الشعر صورة خصب: كثيف أسود كعذق نخلة مثقل بثمره."
  devices:
    - title: "التشبيه"
      text: "شبّه ذوائبها بعذق النخلة، «والذوائب تشبه بالعناقيد، والقنوان يراد به تجعدها وأثاثتها» [@zawzani، ص55]. وعند شوقي ضيف: «وأما شعرها الغزير فكعذق النخلة المتداخل» [@deif، ج1 ص261]."
    - title: "تتابع الصفات"
      text: "«أسود فاحم أثيث»: ثلاث صفات متتالية، كل واحدة تزيد على ما قبلها: اللون، ثم شدته، ثم الكثافة."
    - title: "النخلة"
      text: "اختار النخلة، وهي أكرم الشجر عند العرب؛ فالتشبيه يحمل معنى النفاسة مع الصورة."
  connection: "ثم يصف ضفائرها: «غدائره مستشزرات إلى العلا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَفَرْعِنْ / يَزِينُلْ مَتْ / نَ أَسْوَ / دَ فَاحِمِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — أَثِيثِنْ / كَقِنْوِنْ نَخْ / لَ تِلْمُ / تَعَثْكِلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الشطرين [@atiq، ص29]."
context: "يأتي بين وصف العنق (33) ووصف الضفائر (35)؛ فالوصف ينحدر من الوجه إلى العنق إلى الشعر المسدل على الظهر."
