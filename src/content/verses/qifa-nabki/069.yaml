first: "وَرُحْنَا يَكَادُ الطَّرْفُ يَقْصُرُ دُونَهُ"
second: "مَتَى مَا تَرَقَّ الْعَيْنُ فِيهِ تَسَهَّلِ"
meaning: "ثم عدنا مساء، والعين تكاد تعجز عن إدراك حسن الفرس، فإذا صعدت بالنظر إلى أعلاه عادت فانحدرت إلى أسفله. قال الزَّوْزَنِيّ: «أنه كامل الحسن رائع الصورة تكاد العيون تقصر عن كُنه حسنه ومهما نظرت العيون إلى أعالي خلقه اشتهت النظر إلى أسافله» [@zawzani، ص72]."
vocabulary:
  - term: "رُحْنَا"
    text: "رجعنا في آخر النهار."
  - term: "الطَّرْفُ"
    text: "البصر، وهو في الأصل «اسم لما يتحرك من أشفار العين» [@zawzani، ص72]."
  - term: "يَقْصُرُ دُونَهُ"
    text: "يعجز عن إدراك حسنه [@zawzani، ص72]."
  - term: "تَرَقَّ"
    text: "تصعد؛ «الترقي والارتقاء والرقي واحد» [@zawzani، ص72]."
  - term: "تَسَهَّلِ"
    text: "تنحدر، من السهل ضد الجبل: «ويقال للرجل: صعد في الجبل وسهل في الحضيض» [@ibn-al-anbari، ص98]."
syntax:
  - "«وَرُحْنَا»: فعل وفاعل، وجملة «يكاد الطرف...» حال. «والطرف يرتفع بيكاد» [@ibn-al-anbari، ص98]، وجملة «يقصر دونه» خبر يكاد."
  - "«مَتَى مَا تَرَقَّ الْعَيْنُ»: «متى» اسم شرط و«ما» زائدة، و«ترقّ مجزوم بمتى ما»، وعلامة جزمه حذف حرف العلة. «والعين مرتفعة بترق، وتسهل جواب الجزاء» [@ibn-al-anbari، ص98]، وكُسر للقافية."
morphology:
  - "«تَرَقَّ» مضارع «ترقّى» على «تفعّل»، حُذفت ألفه للجزم."
  - "«تَسَهَّل» على «تفعّل» من «السهل»."
  - "«الطَّرْف» مصدر «طرف يطرف»: حرّك جفنه [@zawzani، ص72]."
rhetoric:
  thesis: "لا يصف الفرس هنا، بل يصف نظر الناس إليه: عين لا تشبع."
  devices:
    - title: "الاستعارة"
      text: "جعل نظر العين إلى الفرس صعودًا في جبل ثم نزولًا إلى السهل. قال ابن الأَنْبارِيّ: «وهذا مثل قولهم: صعد فيه البصر وصوبه... وهذا في الفرس كناية» [@ibn-al-anbari، ص98]."
    - title: "الطباق"
      text: "بين «ترقّ» و«تسهّل»: صعود ونزول."
    - title: "المبالغة بـ«يكاد»"
      text: "«يكاد الطرف يقصر دونه»: لم يعجز البصر حقًّا، بل قارب العَجُز؛ وهي مبالغة تبقى في حدود المعقول."
  connection: "ثم يختم القسم: «فبات عليه سرجه ولجامه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَرُحْنَا / يَكَادُطْ طَرْ / فُ يَقْصُ / رُ دُونَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — مَتَى مَا / تَرَقْقَلْ عَيْ / نُ فِيهِ / تَسَهْهَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الشطرين [@atiq، ص29]."
context: "وفي «يقصر دونه» قول آخر: «أراد يقصر دون بصر الناظر لئلا تصيبه العين» [@ibn-al-anbari، ص98]، أي أن الفرس يحجب نفسه عن العين الحاسدة. وقال ابن حبيب في العَجُز: «معناه من نظر إلى أعلاه نظر إلى أسفله لكماله، ليستتم النظر إلى جميع جسده» [@ibn-al-anbari، ص98]."
variants:
  - reading: "وَرُحْنَا وَرَاحَ الطِّرْفُ يَنْفُضُ رَأْسَهُ"
    status: "رواية الأَصْمَعِيّ وأبي عُبَيْدة"
    note: "«الطِّرف: كل شيء كريم من رجل أو فرس»، و«ينفض رأسه، معناه من المرح والنشاط» [@ibn-al-anbari، ص98]."
  - reading: "مَتَى مَا تَرَقَّ الْعَيْنُ فِيهِ تَسَفَّلِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص72]."
