first: "فَقُلْتُ لَهُ لَمَّا تَمَطَّى بِصُلْبِهِ"
second: "وَأَرْدَفَ أَعْجَازًا وَنَاءَ بِكَلْكَلِ"
meaning: "فقلت لهذا الليل حين طال طولًا مفرطًا: امتد وسطه، وتتابعت أواخره، وبعُد عهدي بأوله [@zawzani، ص60]."
vocabulary:
  - term: "تَمَطَّى"
    text: "تمدد [@zawzani، ص59]."
  - term: "صُلْبِهِ"
    text: "وسطه [@ibn-al-anbari، ص75]."
  - term: "أَرْدَفَ أَعْجَازًا"
    text: "أتبع أواخره بعضها بعضًا؛ والأعجاز: المآخير [@zawzani، ص59]."
  - term: "نَاءَ بِكَلْكَلِ"
    text: "الكلكل: الصدر. و«نَاءَ» عند ابن الأَنْبارِيّ: تهيأ لينهض [@ibn-al-anbari، ص76]، وعند الزَّوْزَنِيّ: بَعُد [@zawzani، ص59]."
syntax:
  - "«فَقُلْتُ لَهُ لَمَّا تَمَطَّى»: الهاء في «لَهُ» تعود على الليل، و«لَمَّا» ظرف فيه معنى الشرط [@ibn-al-anbari، ص76]."
  - "«وَأَرْدَفَ أَعْجَازًا وَنَاءَ بِكَلْكَلِ» معطوفان على «تَمَطَّى» [@ibn-al-anbari، ص76]."
  - "مقول القول لا يأتي في هذا البيت، بل في البيت التالي؛ فهذا البيت لا يتم معناه إلا بما بعده."
morphology:
  - "«تَمَطَّى» من «المطا» وهو الظهر، أو من «التمطّط» فقُلبت إحدى الطاءين ياء، كما قالوا: تقضّى البازي [@zawzani، ص59]."
  - "«الصُّلب» فيه لغات: الصُّلْب، والصُّلُب، والصَّلَب [@zawzani، ص59]."
  - "«نَاءَ» فيه لغتان: ناء، ونأى [@ibn-al-anbari، ص76]."
rhetoric:
  thesis: "يرسم الشاعر الليل حيوانًا ضخمًا يتمطّى ويتثاقل، فيحسّ القارئ ثقل الساعات وطولها."
  devices:
    - title: "الاستعارة"
      text: "«استعار لليل صلبًا واستعار لطوله لفظ التمطي ليلائم الصلب واستعار لأوائله لفظ الكلكل ولمآخيره لفظ الأعجاز» [@zawzani، ص60]."
    - title: "لماذا طال الليل؟"
      text: "لأن «المغموم يستطيل ليله، والمسرور يستقصر ليله» [@zawzani، ص60]؛ فطول الليل في البيت صورة للهم."
  connection: "ومقول القول في البيت التالي: «أَلَا أَيُّهَا اللَّيْلُ الطَّوِيلُ أَلَا انْجَلِي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَقُلْتُ / لَهُو لَمْمَا / تَمَطْطَى / بِصُلْبِهِي = فعولُ / مفاعيلن / فعولن / مفاعلن — وَأَرْدَ / فَ أَعْجَازَنْ / وَنَاءَ / بِكَلْكَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "هاء «لَهُ» تُشبع فتُنطق «لَهُو». وجاءت «فعولن» مقبوضة ثلاث مرات، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "جعل الليل حيوانًا ضخمًا له ظهر وصدر وعجز. يقول الزَّوْزَنِيّ: «استعار لليل صلبًا واستعار لطوله لفظ التمطي ليلائم الصلب واستعار لأوائله لفظ الكلكل ولمآخيره لفظ الأعجاز»، ثم يعلل طول الليل: «لأن المغموم يستطيل ليله، والمسرور يستقصر ليله» [@zawzani، ص60]. والبيت لا يتم معناه إلا بما بعده؛ فما قاله لليل في البيت التالي."
variants:
