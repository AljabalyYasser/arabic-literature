first: "فَقُلْتُ لَهُ لَمَّا تَمَطَّى بِصُلْبِهِ"
second: "وَأَرْدَفَ أَعْجَازًا وَنَاءَ بِكَلْكَلِ"
level: "basic"
meaning: "فقلت لهذا الليل حين طال طولًا مفرطًا: امتد وسطه، وتتابعت أواخره، وبعُد عهدي بأوله [@zawzani، ص60]."
vocabulary:
  - term: "تَمَطَّى"
    text: "تمدد [@zawzani، ص59]."
  - term: "صُلْبِهِ"
    text: "وسطه [@ibn-al-anbari، ص75]."
  - term: "أَرْدَفَ أَعْجَازًا"
    text: "أتبع أواخره بعضها بعضًا؛ والأعجاز: المآخير [@zawzani، ص59]."
  - term: "نَاءَ بِكَلْكَلِ"
    text: "الكلكل: الصدر. و«نَاءَ» عند ابن الأَنْبارِيّ: تهيأ لينهض [@ibn-al-anbari، ص76]، وعند الزَّوْزَنِيّ: بَعُد [@zawzani، ص59]."
context: "جعل الليل حيوانًا ضخمًا له ظهر وصدر وعجز. يقول الزَّوْزَنِيّ: «استعار لليل صلبًا واستعار لطوله لفظ التمطي ليلائم الصلب واستعار لأوائله لفظ الكلكل ولمآخيره لفظ الأعجاز»، ثم يعلل طول الليل: «لأن المغموم يستطيل ليله، والمسرور يستقصر ليله» [@zawzani، ص60]. والبيت لا يتم معناه إلا بما بعده؛ فما قاله لليل في البيت التالي."
variants:
  - reading: "فَقُلْتُ لَهُ لَمَّا تَمَطَّى بِجَوْزِهِ"
    status: "رواية الأَصْمَعِيّ"
    note: "والجوز: الوسط [@ibn-al-anbari، ص75–76]."
