first: "لَهُ إِطِلَا ظَبْيٍ وَسَاقَا نَعَامَةٍ"
second: "وَإِرْخَاءُ سِرْحَانٍ وَتَقْرِيبُ تَتْفُلِ"
meaning: "لهذا الفرس خاصرتان ضامرتان كخاصرتي الظبي، وساقان صلبتان كساقي النعامة، وعَدْو سهل كعدو الذئب، ووثب كوثب ولد الثعلب. قال الزَّوْزَنِيّ: «فجمع أربعة تشبيهات في هذا البيت» [@zawzani، ص68]."
vocabulary:
  - term: "إِطِلَا"
    text: "مثنى «إطل»، ويقال «أيطل»: الكشح، «وهو ما بين آخر الضلوع إلى الورك... وإنما شبهه بأيطل الظبي لأنه طاو»، أي ضامر [@ibn-al-anbari، ص89]."
  - term: "سَاقَا نَعَامَةٍ"
    text: "«النعامة قصيرة الساقين صلبتهما... ويستحب من الفرس قصر الساق» [@ibn-al-anbari، ص89]. وعند الزَّوْزَنِيّ أنه شبّه ساقيه بساقيها «في الانتصاب والطول» [@zawzani، ص68]."
  - term: "إِرْخَاءُ"
    text: "«جري ليس بالشديد... وليس دابة أحسن إرخاء من الذئب» [@ibn-al-anbari، ص89]."
  - term: "سِرْحَانٍ"
    text: "الذئب [@ibn-al-anbari، ص89]."
  - term: "تَقْرِيبُ"
    text: "«أن يرفع يديه معا ويضعهما معا» [@ibn-al-anbari، ص89]، أي أن يثب في عدوه."
  - term: "تَتْفُلِ"
    text: "«ولد الثعلب، وهو أحسن الدواب تقريبا» [@ibn-al-anbari، ص89]."
syntax:
  - "«لَهُ»: جار ومجرور، خبر مقدم. و«إِطِلَا» مبتدأ مؤخر مرفوع بالألف لأنه مثنى، وحُذفت نونه للإضافة إلى «ظبي». قال ابن الأَنْبارِيّ: «والإطلان يرتفعان بله وهما مضافان إلى الظبي» [@ibn-al-anbari، ص89]."
  - "«وَسَاقَا نَعَامَةٍ وَإِرْخَاءُ سِرْحَانٍ وَتَقْرِيبُ تَتْفُلِ»: «نسق على الإطلين» [@ibn-al-anbari، ص89]، أي معطوفات عليه."
morphology:
  - "«إِطِل» على «فِعِل»، وهو وزن نادر: «أجمع البصريون على أنه لم يأت على فِعِل من الأسماء إلا إبل... وحكى الكوفيون إطلًا من الأسماء أيضًا» [@zawzani، ص68]."
  - "«سَاقَا» مثنى «ساق»، حُذفت نونه للإضافة."
  - "«تَقْرِيب» مصدر «قرّب» على «تفعيل»."
rhetoric:
  thesis: "بيت واحد يرسم الفرس كله من أربعة حيوانات: الظبي، والنعامة، والذئب، والثعلب."
  devices:
    - title: "تشبيه أربعة بأربعة"
      text: "شبّه أربعة أشياء في الفرس بأربعة من غيره في بيت واحد. قال ابن رَشِيق: «فقال امرؤ القَيْس وهو أول من فتح هذا الباب» [@ibn-rashiq، ج1 ص293]."
    - title: "التشبيه بلا أداة"
      text: "لم يقل «كأن خاصرتيه خاصرتا ظبي»، بل «له إطلا ظبي»، فجعلها للفرس نفسه. قال ابن رَشِيق: «فجاء بتشبيه إضافة كما ترى حتى جعله تحقيقًا لولا مفهوم الخطاب» [@ibn-rashiq، ج1 ص293]؛ أي لولا أن السامع يفهم المراد لظنه حقيقة."
    - title: "خلاف النقاد فيه"
      text: "جعله قُدامة «أفضل التشبيه كافة»، لأن الطرفين يشتركان في أكثر صفاتهما. وردّ ابن رَشِيق: هذا «تشبيه أعضاء بأعضاء هي هي بعينها... إلا أن فضل الشاعر فيه غير كبير حينئذ... وإنما حسن التشبيه أن يقرب بين البعيدين» [@ibn-rashiq، ج1 ص289]. وهو قريب من قول عبد القاهر إن التشبيه كلما تباعد طرفاه كان أعجب."
  connection: "ثم يصف ذيله: «ضليع إذا استدبرته سدّ فرجه / بضافٍ فويق الأرض ليس بأعزل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "لَهُو إِ / طِلَا ظَبْيِنْ / وَسَاقَا / نَعَامَتِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — وَإِرْخَا / ءُ سِرْحَانِنْ / وَتَقْرِي / بُ تَتْفُلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "هاء «لَهُ» تُشبع فتُنطق «لَهُو». ودخل القبضُ، وهو حذف الخامس الساكن «فعولن» في التفعيلة الأولى من الصدر [@atiq، ص29]، وجاء العَجُز تامًّا."
context: "قال ابن قُتَيْبة: «وقد أجاد في صفة الفرس»، وأنشد هذا البيت [@ibn-qutayba، ج1 ص112]. وزعم الفَرَزْدَق أن «أكمل بيت قالته العرب، أو قال: أجمع بيت» هو هذا البيت [@ibn-rashiq، ج2 ص24]."
variants:
  - reading: "لَهُ أَيْطَلَا ظَبْيٍ وَسَاقَا نَعَامَةٍ"
    status: "رواية الزَّوْزَنِيّ وابن قُتَيْبة"
