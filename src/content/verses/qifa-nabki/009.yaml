first: "فَفَاضَتْ دُمُوعُ الْعَيْنِ مِنِّي صَبَابَةً"
second: "عَلَى النَّحْرِ حَتَّى بَلَّ دَمْعِيَ مِحْمَلِي"
meaning: "فسالت دموعي شوقًا حتى جرت على صدري وبلّت حمالة سيفي. قال الزَّوْزَنِيّ: «فسالت دموع عيني من فرط وجدي بهما وشدة حنيني إليهما حتى بلّ دمعي حمالة سيفي» [@zawzani، ص39]."
vocabulary:
  - term: "فَاضَتْ"
    text: "سالت [@ibn-al-anbari، ص31]."
  - term: "صَبَابَةً"
    text: "«رقة الشوق» [@zawzani، ص39]."
  - term: "النَّحْرِ"
    text: "أعلى الصدر."
  - term: "مِحْمَلِي"
    text: "«السير الذي يُحمل به السيف» [@ibn-al-anbari، ص31]، أي حمالة السيف."
syntax:
  - "«فَفَاضَتْ دُمُوعُ الْعَيْنِ»: الفاء عاطفة، و«فاضت» فعل ماض، و«دموع» فاعل، و«العين» مضاف إليه. و«مِنِّي» متعلق بـ«فاضت»."
  - "«صَبَابَةً»: فيها قولان. عند ابن الأَنْبارِيّ مفعول مطلق، «كما تقول: أقبل عبد الله ركضًا» [@ibn-al-anbari، ص31]. وعند الزَّوْزَنِيّ مفعول لأجله، أي: للصبابة، كقوله تعالى: «مِنَ الصَّوَاعِقِ حَذَرَ الْمَوْتِ» [@zawzani، ص39]."
  - "«عَلَى النَّحْرِ»: متعلق بـ«فاضت»."
  - "«حَتَّى بَلَّ دَمْعِيَ مِحْمَلِي»: «حتى» حرف ابتداء يفيد الغاية، و«بلّ» فعل ماض، و«دمعيَ» فاعل، و«محملي» مفعول به."
morphology:
  - "«صبابة» مصدر «صَبّ»، «والأصل صَبِب، فسكنت العين وأدغمت في اللام» [@zawzani، ص39]."
  - "«مِحْمَل» على «مِفْعَل»، وجمعه المحامل؛ «والحمائل جمع الحِمالة» [@zawzani، ص39]."
  - "«فاضت» أجوف يائي، من «فاض يفيض»."
rhetoric:
  thesis: "مبالغة في وصف البكاء: الدمع لا يقف على الخد، بل يبلغ الصدر وحمالة السيف."
  devices:
    - title: "المبالغة بالغاية"
      text: "«حتى» تجعل الدمع يمضي إلى غاية بعيدة: من العين، إلى النحر، إلى حمالة السيف."
    - title: "ذكر المِحْمَل"
      text: "لم يقل «ثوبي» بل «محملي»؛ فالباكي رجل يحمل سيفه، وبكاؤه لا ينقص من فروسيته."
    - title: "ختام الذكرى"
      text: "المقطع الذي بدأ بـ«قفا نبك» ينتهي هنا: بدأ بالدعوة إلى البكاء، وانتهى إلى البكاء نفسه."
  connection: "ثم يفتح بابًا جديدًا: «ألا ربّ يوم لك منهن صالح»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَفَاضَتْ / دُمُوعُلْ عَيْ / نِ مِنْنِي / صَبَابَتَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — عَلَنْ نَحْ / رِ حَتْتَى بَلْ / لَ دَمْ عِ / يَ مِحْمَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من العَجُز وحدها [@atiq، ص29]."
context: "بعد أن وصف أم الحُوَيْرِث وأم الرَّباب «بالجمال وطيب النشر، وصف حاله بعد بعدهما» [@zawzani، ص39]."
