first: "فَأَدْبَرْنَ كَالْجَزْعِ الْمُفَصَّلِ بَيْنَهُ"
second: "بِجِيدِ مُعَمٍّ فِي الْعَشِيرَةِ مُخْوَلِ"
meaning: "فولّت إناث البقر هاربات متفرقات، كأنهن خرز جَزْع فُصل بين حباته في قلادة على عنق صبي كريم الأعمام والأخوال. قال يعقوب: «أدبرن يبرقن كما يبرق الجزع الذي جعل بينه ما يفصله، أي أنهن متفرقات» [@ibn-al-anbari، ص94]."
vocabulary:
  - term: "الْجَزْعِ"
    text: "«خرز فيه بياض وسواد، فالواسط أبيض والطرفان أسودان... وذلك أن البقر بيض إلا القوائم والخدود» [@ibn-al-anbari، ص94]. وعند الزَّوْزَنِيّ: «الخرز اليماني» [@zawzani، ص70]."
  - term: "الْمُفَصَّلِ بَيْنَهُ"
    text: "الذي فُصل بين حباته بغيرها من الجواهر [@zawzani، ص70]."
  - term: "جِيدِ"
    text: "العنق [@zawzani، ص70]."
  - term: "مُعَمٍّ مُخْوَلِ"
    text: "«المعِمّ: الكريم الأعمام. المُخوِل: الكريم الأخوال» [@zawzani، ص70]."
syntax:
  - "«فَأَدْبَرْنَ»: نون النسوة فاعل، وهي للنعاج، «والكاف في موضع نصب، والتقدير: فأدبرن مثل الجزع المفصل بينه» [@ibn-al-anbari، ص94]، أي حال."
  - "«بَيْنَهُ»: «وموضع بين رفع في قول الفَرّاء لأنها اسم ما لم يسم فاعله» [@ibn-al-anbari، ص94]، أي نائب فاعل لـ«المفصّل»."
  - "«بِجِيدِ»: «والباء صلة المفصل أيضا، والجيد مضاف إلى معم، ومخول نعته» [@ibn-al-anbari، ص94]."
morphology:
  - "«مُعَمّ» و«مُخْوَل» من الشواذ: «وقد أعمَّ وأخوَل إذا كرم أعمامه وأخواله، وهذان من الشواذ؛ لأن القياس من أفعل فهو مُفعِل، وهما أفعل فهو مُفعَل» [@zawzani، ص70]."
  - "«الْمُفَصَّل» اسم مفعول من المضعف «فصّل»."
  - "«جِيد» جمعه أجياد [@zawzani، ص70]."
rhetoric:
  thesis: "القطيع الهارب قلادة منفرطة: أبيض تتخلله أطراف سود، متفرق على مسافات."
  devices:
    - title: "التشبيه بالهيئة"
      text: "لم يشبّه البقرة الواحدة بخرزة، بل هيئة القطيع كله: حبات بيض أطرافها سود، بينها فواصل. «وشرط كونه مفصلًا لتفرقهن عند رؤيته» [@zawzani، ص71]. وهذا ما رأيناه في بيت الثريا والوشاح المفصّل في النصف الأول من المعلقة."
    - title: "قيد يرفع القيمة"
      text: "«بجيد معمّ مخول»: شرط أن تكون القلادة على صبي كريم النسب، «لأن جواهر قلادة مثل هذا الصبي أعظم من جواهر قلادة غيره» [@zawzani، ص71]. فالقيد يجعل الخرز أنفس."
    - title: "الحركة في الصورة"
      text: "قلادة على عنق صبي تتحرك مع حركته، كما يتحرك القطيع وهو يولّي."
  connection: "ثم يقول: «فألحقه بالهاديات ودونه / جواحرها في صرة لم تزيّل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَأَدْبَرْ / نَ كَلْجَزْعِلْ / مُفَصْصَ / لِ بَيْنَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — بِجِيدِ / مُعَمْمِنْ فِلْ / عَشِيرَ / ةِ مُخْوَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "يأتي بعد أن ظهر القطيع كعذارى يطفن حول دوار، فالبقر الذي كان يمشي متبخترًا صار الآن يفرّ متفرقًا. وقال ابن حبيب في «أدبرن كالجزع»: «تفرقن» [@ibn-al-anbari، ص94]."
variants:
  - reading: "فَأَدْبَرْنَ كَالْجِزْعِ الْمُفَصَّلِ بَيْنَهُ"
    status: "بكسر الجيم"
    note: "كذا في رواية الزَّوْزَنِيّ [@zawzani، ص70]. «وقال أبو عُبَيْدة: لا أعرف الجِزع بالكسر. وقال غيره: الجزع بالكسر: ما انعطف من الوادي، والجَزْع بالفتح: الخرز» [@ibn-al-anbari، ص94]."
