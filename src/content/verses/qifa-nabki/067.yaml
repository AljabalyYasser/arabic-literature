first: "فَعَادَى عِدَاءً بَيْنَ ثَوْرٍ وَنَعْجَةٍ"
second: "دِرَاكًا وَلَمْ يُنْضَحْ بِمَاءٍ فَيُغْسَلِ"
meaning: "فصاد ثورًا ونعجة من بقر الوحش واحدًا بعد الآخر في شوط واحد، ولم يعرق. قال ابن الأَنْبارِيّ: «والى بين اثنين في طلق، قتلهما ولم يعرق، أدرك صيده قبل أن يعرق» [@ibn-al-anbari، ص96]. والطَّلَق: الشوط."
vocabulary:
  - term: "عَادَى عِدَاءً"
    text: "«المعاداة والعداء: الموالاة» [@zawzani، ص71]، أي تابع بين الصيدين."
  - term: "ثَوْرٍ وَنَعْجَةٍ"
    text: "ذكر بقر الوحش وأنثاه."
  - term: "دِرَاكًا"
    text: "«المداركة» [@ibn-al-anbari، ص96]، أي متتابعًا."
  - term: "لَمْ يُنْضَحْ بِمَاءٍ فَيُغْسَلِ"
    text: "«لم يعرق فيصير كأنه قد غسل بالماء» [@ibn-al-anbari، ص96]."
syntax:
  - "«والعداء منصوب بعادى»، أي مفعول مطلق، «وبين صلة عادى، ودراكا منصوب بعادى» [@ibn-al-anbari، ص96]، أي مصدر في موضع الحال."
  - "«وَلَمْ يُنْضَحْ... فَيُغْسَلِ»: «وينضح مجزوم بلم، والباء صلة ينضح، ويغسل منسوق على ينضح، واللام كسرت للقافية، وذلك أن المجزوم إذا احتيج إلى حركته كسر» [@ibn-al-anbari، ص96]."
morphology:
  - "«عادى» على «فاعَل» من «عدا»، ومصدره «عِداء» على «فِعال»."
  - "«العِداء» غير «العِدى»: «والعداء على أربعة أوجه: العداء الموالاة ممدودة، والعدى: الأعداء مقصور...» [@ibn-al-anbari، ص97]."
  - "«دِرَاك» مصدر «دارك» على «فِعال»."
rhetoric:
  thesis: "غاية الصيد: صيدان في شوط واحد، والفرس لم يعرق."
  devices:
    - title: "الكناية"
      text: "«ولم ينضح بماء فيغسل» كناية عن أنه لم يتعب؛ فالفرس لا يغتسل، «ولكنها تعرق» [@ibn-al-anbari، ص96]. فجعل العرق الغزير كالغسل، ونفاه."
    - title: "إسناد الفعل إلى الفرس"
      text: "الفارس هو الذي يصيد، لكنه جعل الصيد للفرس. قال الزَّوْزَنِيّ: «نسب فعل الفارس إلى الفرس؛ لأنه حامله وموصله إلى مرامه» [@zawzani، ص71]."
    - title: "عبارة سبق إليها"
      text: "قال ابن قُتَيْبة إن امرأ القَيْس «أوّل من قال: فعادى عداء، فاتّبعه الناس» [@ibn-qutayba، ج1 ص133]."
  connection: "ثم تأتي الوليمة: «فظل طهاة اللحم من بين منضج»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَعَادَى / عِدَاءَنْ بَيْ / نَ ثَوْرِنْ / وَنَعْجَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — دِرَاكَنْ / وَلَمْ يُنْضَحْ / بِمَائِنْ / فَيُغْسَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "هذه غاية ما وعد به في البيت 53 حين سمّى فرسه «قيد الأَوابِد»: الوحش لا يفوته، ويأخذ منه اثنين في شوط واحد."
