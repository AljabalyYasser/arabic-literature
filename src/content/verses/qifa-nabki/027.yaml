first: "فَقَالَتْ يَمِينَ اللهِ مَا لَكَ حِيلَةٌ"
second: "وَمَا إِنْ أَرَى عَنْكَ الْغَوَايَةَ تَنْجَلِي"
meaning: "فقالت: أحلف بالله ما لي حيلة في دفعك، وما أرى ضلالك عني ينكشف. قال الزَّوْزَنِيّ: «ما لي سبيل إلى دفعك أو ما لك عذر في زيارتي وما أراك نازعًا عن هواك وغيك» [@zawzani، ص50]."
vocabulary:
  - term: "يَمِينَ اللهِ"
    text: "قسم: أحلف بيمين الله."
  - term: "مَا لَكَ حِيلَةٌ"
    text: "فيه أقوال: «قال ابن حبيب: مالك حيلة، معناه لا أقدر أن أحتال في دفعك عني. وقال غيره: وليس لك حجة في أن تفضحني» [@ibn-al-anbari، ص53]. وقال الأَصْمَعِيّ: «تجيء والناس أحوالي» [@ibn-al-anbari، ص53]."
  - term: "الْغَوَايَةَ"
    text: "«الغواية والغَيّ: الضلالة» [@zawzani، ص49]."
  - term: "تَنْجَلِي"
    text: "«تتكشف» [@ibn-al-anbari، ص53]."
syntax:
  - "«يَمِينَ اللهِ»: «منصوب على مذهب القسم»، أي بفعل محذوف تقديره: أحلف يمين الله. «قال الفَرّاء: هو منصوب بالجواب، وجواب القسم مالك حيلة» [@ibn-al-anbari، ص53]."
  - "«مَا لَكَ حِيلَةٌ»: «ما» نافية، و«لك» خبر مقدم، و«حيلة» مبتدأ مؤخر، «والحيلة مرفوعة باللام» على قول الكوفيين [@ibn-al-anbari، ص53]."
  - "«وَمَا إِنْ أَرَى»: «ما» نافية و«إن» زائدة، «وهي تزاد مع ما النافية» [@zawzani، ص49]. «والغواية منصوبة بأرى... وخبر أرى ما عاد من تنجلي» [@ibn-al-anbari، ص53]."
morphology:
  - "«حِيلَة» «أصلها حولة فأبدلت الواو ياء لسكونها وانكسار ما قبلها» [@zawzani، ص49]."
  - "«الْغَوَايَة» مصدر «غوى يغوي»؛ «ويروى العماية وهي العمى» [@zawzani، ص49]."
  - "«تَنْجَلِي» مضارع «انجلى» على «انفعل»."
rhetoric:
  thesis: "الحبيبة تستسلم بقسم: كلامها احتجاج في ظاهره، ورضا في باطنه."
  devices:
    - title: "القسم"
      text: "بدأت كلامها بـ«يمين الله»؛ فالقسم يجعل اعتراضها جادًّا في ظاهره."
    - title: "الحوار المزدوج"
      text: "تنفي أن يكون لها حيلة في دفعه، وتصفه بالغواية؛ فهي تلومه وتستسلم في جملة واحدة. قال الزَّوْزَنِيّ: «وقال الرواة: هذا أغنج بيت في الشعر» [@zawzani، ص50]، والغَنَج: الدلال."
    - title: "الاستعارة في «تنجلي»"
      text: "الانجلاء للظلمة والغبار، فجعل الغواية غشاوة على الشاعر لا تنكشف."
  connection: "ثم يقول: «فقمت بها أمشي تجرّ وراءنا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَقَالَتْ / يَمِينَلْلَا / هِ مَا لَ / كَ حِيلَتُنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — وَمَا إِنْ / أَرَى عَنْكَلْ / غَوَايَ / ةَ تَنْجَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الشطرين [@atiq، ص29]."
context: "يأتي بعد البيت 26 الذي لا نشرحه، وفيه وصوله إليها ليلًا. قال شوقي ضيف في المشهد: «وكيف وصل إليها وقد استعدّت للنوم وما كان بينه وبينها من حوار» [@deif، ج1 ص250]."
variants:
  - reading: "وَمَا إِنْ أَرَى عَنْكَ الْعَمَايَةَ تَنْجَلِي"
    status: "رواية الأَصْمَعِيّ"
    note: "«والعماية: مصدر عمى يعمى عمى وعماية» [@ibn-al-anbari، ص52]. وبها يرويه شوقي ضيف: «العماية: الغواية والجهالة» [@deif، ج1 ص250، الحاشية]."
