first: "فَعَنَّ لَنَا سِرْبٌ كَأَنَّ نِعَاجَهُ"
second: "عَذَارَى دَوَارٍ فِي مُلَاءٍ مُذَيَّلِ"
meaning: "فظهر لنا قطيع من بقر الوحش، كأن إناثه فتيات يطفن حول الحجر المنصوب في مُلاءات طويلة الذيول. قال الزَّوْزَنِيّ: «وشبه المها في بياض ألوانها بالعذارى لأنهن مصونات في الخدور... وشبّه طول أذيالها وسبوغ شعرها بالملاء المذيل، وشبّه حسن مشيها بحسن تبختر العذارى في مشيهن» [@zawzani، ص70]."
vocabulary:
  - term: "عَنَّ"
    text: "«اعترض» [@ibn-al-anbari، ص93]، أي ظهر أمامنا."
  - term: "سِرْبٌ"
    text: "«القطيع من البقر والظباء والقطا والنساء» [@ibn-al-anbari، ص93]."
  - term: "نِعَاجَهُ"
    text: "«إناث بقر الوحش» [@zawzani، ص70]."
  - term: "دَوَارٍ"
    text: "«حجر كان أهل الجاهلية ينصبونه ويطوفون حوله تشبيهًا بالطائفين حول الكعبة إذا نأوا عن الكعبة» [@zawzani، ص70]. وقال أبو عُبَيْدة: «يطوفون حولها أسابيع، يتشبهون بأهل مكة» [@ibn-al-anbari، ص93]."
  - term: "مُلَاءٍ مُذَيَّلِ"
    text: "الملاء جمع مُلاءة، وهي الثوب يُلتحف به. والمذيّل: «الذي أطيل ذيله وأرخي» [@zawzani، ص70]."
syntax:
  - "«فَعَنَّ لَنَا سِرْبٌ»: «والسرب يرتفع بعن» [@ibn-al-anbari، ص94]، أي فاعل."
  - "«كَأَنَّ نِعَاجَهُ عَذَارَى دَوَارٍ»: «النعاج اسم كأن، وعذارى خبر كأن وهي مضافة إلى دوار» [@ibn-al-anbari، ص94]. والجملة صفة للسرب."
  - "«فِي مُلَاءٍ»: متعلق بـ«عذارى»، و«مُذَيَّلِ» نعت للملاء [@ibn-al-anbari، ص94]."
morphology:
  - "«عَنَّ» مضعف، «يقال عنّ يعِنّ ويعُنّ» [@ibn-al-anbari، ص93]."
  - "«عَذَارَى» جمع «عذراء»."
  - "«مُذَيَّل» اسم مفعول من المضعف «ذيّل»."
rhetoric:
  thesis: "يرى الصيد بعين الغَزِل: بقر الوحش فتيات في ثياب بيض يطفن حول صنم."
  devices:
    - title: "التشبيه المقلوب"
      text: "المعتاد أن تُشبَّه المرأة ببقرة الوحش، كما صنع هو في وصف صاحبته. وهنا عكس. قال شوقي ضيف: «وبذلك عكس الصورة فشبه البقر بالنساء، وهو تشبيه مقلوب، تبعه فيه الشعراء» [@deif، ج1 ص262]."
    - title: "تعدد وجه الشبه"
      text: "جمع بين الطرفين بثلاث صفات: البياض، وطول الذيول، وحسن المشي [@zawzani، ص70]."
    - title: "صورة من حياتهم"
      text: "الطواف حول «دوار» مشهد يعرفه السامع الجاهلي؛ فالشاعر يأخذ تشبيهه مما يراه قومه."
  connection: "ثم يصف فرار القطيع: «فأدبرن كالجزع المفصّل بينه / بجيد معمّ في العشيرة مخول»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَعَنْنَ / لَنَا سِرْبُنْ / كَأَنْنَ / نِعَاجَهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — عَذَارَى / دَوَارِنْ فِي / مُلَائِنْ / مُذَيْيَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]، وجاء العَجُز تامًّا."
context: "هنا يبدأ خبر الصيد. قال شوقي ضيف: «واستطرد امرؤ القَيْس يتحدث عن صيده، فوصف سربا من بقر الوحش عنّ لهم في الصحراء مصورا كيف قيّده فرسه» [@deif، ج1 ص254–255]."
variants:
