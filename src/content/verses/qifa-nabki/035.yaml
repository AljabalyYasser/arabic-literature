first: "غَدَائِرُهُ مُسْتَشْزَرَاتٌ إِلَى الْعُلَا"
second: "تَضِلُّ الْعِقَاصُ فِي مُثَنًّى وَمُرْسَلِ"
meaning: "ضفائر شعرها مرفوعة مشدودة إلى أعلى الرأس، وتغيب العقائص في كثافته، بين مثنيّ ومرسل. قال الزَّوْزَنِيّ: «ذوائبها وغدائرها مرفوعات أو مرتفعات إلى فوق... ثم قال: تغيب تعاقيصها في شعر مثنى وبعضه مرسل، أراد به وفور شعرها» [@zawzani، ص55]."
vocabulary:
  - term: "غَدَائِرُهُ"
    text: "«الذوائب، واحدتها غديرة» [@ibn-al-anbari، ص63]، أي الضفائر. والضمير للفرع، أي الشعر، في البيت السابق."
  - term: "مُسْتَشْزَرَاتٌ"
    text: "مرفوعات، «وأصل الشَّزْر الفتل على غير الجهة» [@ibn-al-anbari، ص63]."
  - term: "الْعِقَاصُ"
    text: "«ما جُمع من الشعر كهيئة الكُبّة» [@ibn-al-anbari، ص63]."
  - term: "مُثَنًّى وَمُرْسَلِ"
    text: "«منها ما قد ثُني، ومنها ما لم يُثنَ» [@ibn-al-anbari، ص63]."
syntax:
  - "«غَدَائِرُهُ»: مبتدأ، والهاء مضاف إليه. و«مُسْتَشْزَرَاتٌ» خبره، و«إِلَى الْعُلَا» متعلق به."
  - "«تَضِلُّ الْعِقَاصُ»: فعل وفاعل. و«فِي مُثَنًّى» متعلق بـ«تضل»، و«مُرْسَلِ» معطوف عليه."
  - "والجملة الثانية مستأنفة تصف كثافة الشعر."
morphology:
  - "«مُسْتَشْزَرَات» اسم مفعول من «استشزر» على «استفعل». «ومن روى مستشزِرات بكسر الزاي جعله من اللازم، ومن روى بفتح الزاي جعله من المتعدي» [@zawzani، ص55]."
  - "«غَدَائِر» جمع «غديرة» على «فعائل»."
  - "«مُثَنًّى» اسم مفعول من «ثنّى»، مقصور منوّن."
rhetoric:
  thesis: "بيت في وفرة الشعر وتصفيفه، صار عند البلاغيين المتأخرين مثالًا لثقل الكلمة على اللسان."
  devices:
    - title: "تنافر الحروف"
      text: "عدّ البلاغيون «مستشزرات» مثالًا للكلمة التي يثقل نطقها لتقارب مخارج حروفها، وجعلها الهاشمي من النوع «الخفيف في الثقل»، ثم قال: «ولا ضابط لمعرفة الثقل والصعوبة سوى الذوق السليم» [@hashimi، ص20]."
    - title: "الكناية عن الكثرة"
      text: "«تضل العقاص»: العقيصة تضيع في الشعر لكثرته. ذكر ما يلزم من الكثرة، ولم يذكر الكثرة نفسها."
    - title: "سؤال للقارئ"
      text: "ولك أن تسأل: هل يناسب ثقلُ الكلمة كثافةَ الشعر الملفوف المرفوع؟ لم يقل القدماء ذلك، والحكم فيه، كما قال الهاشمي، للذوق."
  connection: "ثم يصف خصرها وساقها: «وكشح لطيف كالجديل مخصّر»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "غَدَا ءِ / رُهُو مُسْتَشْ / زَرَاتُنْ / إِلَلْ عُلَا = فعولُ / مفاعيلن / فعولن / مفاعلن — تَضِلْ لُلْ / عِقَاصُ فِي / مُثَنْنَنْ / وَمُرْسَلِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "هاء «غدائرُه» تُشبع فتُنطق «غَدَائِرُهُو». ودخل القبضُ «فعولن» الأولى [@atiq، ص29]، و«مفاعيلن» الأولى من العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
variants:
  - reading: "غَدَائِرُهُ مُسْتَشْزِرَاتٌ"
    status: "بكسر الزاي"
    note: "«على معنى مرتفعات» [@ibn-al-anbari، ص63]."
  - reading: "تَضِلُّ الْمَدَارِي فِي مُثَنًّى وَمُرْسَلِ"
    status: "رواية"
    note: "والمَدارى جمع مِدْرى، «وهو مثل الشوكة يُصلح به شعر المرأة» [@ibn-al-anbari، ص63]."
