first: "كَبِكْرِ الْمُقَانَاةِ الْبَيَاضِ بِصُفْرَةٍ"
second: "غَذَاهَا نَمِيرُ الْمَاءِ غَيْرَ مُحَلَّلِ"
meaning: "هي كبيضة النعامة الأولى التي خالط بياضَها صفرةٌ يسيرة، وقد نشأت على ماء عذب نامٍ لم يكدّره نزول الناس عليه. قال الزَّوْزَنِيّ: «إنها بيضاء تشوب بياضها صفرة وقد غذاها ماء نمير عذب صافٍ، والبياض الذي شابته صفرة أحسن ألوان النساء عند العرب» [@zawzani، ص53]."
vocabulary:
  - term: "بِكْرِ"
    text: "«البكر: أول بيضة تبيضها النعامه» [@ibn-al-anbari، ص71]. وعند الزَّوْزَنِيّ: «البكر من كل صنف: ما لم يسبقه مثله» [@zawzani، ص52]."
  - term: "الْمُقَانَاةِ"
    text: "«المخالطة، التي قونى بياضها بصفرة، أي خلط بياضها بصفرة» [@ibn-al-anbari، ص71]."
  - term: "نَمِيرُ الْمَاءِ"
    text: "«النامي الذي ينجع في الجسد» [@ibn-al-anbari، ص72]. وقال أبو عُبَيْدة: «ليس كل عذب بنمير؛ لأن النمير ما كان شاربه طويل الري منه» [@ibn-al-anbari، ص72]."
  - term: "غَيْرَ مُحَلَّلِ"
    text: "«لا يحلله أحد فيصفر ويتغير» [@ibn-al-anbari، ص72]، أي لم ينزل عليه الناس فيكدّروه."
syntax:
  - "«الْبَيَاضِ»: يجوز فيه ثلاثة أوجه، كما نقل ابن الأَنْبارِيّ عن ثعلب: «يجوز الخفض والنصب والرفع؛ فمن خفضه أضاف المقاناة اليه... ومن نصب البياض نصبه على التفسير، كما تقول: مررت بالرجل الحسن وجها. ومن رفع البياض جعل الألف واللام بدلا من الهاء» [@ibn-al-anbari، ص70]."
  - "«غَذَاهَا نَمِيرُ الْمَاءِ»: «والنمير مرتفع بغذاها، وهو مضاف إلى الماء»، و«نصب غير محلل على الحال» [@ibn-al-anbari، ص72]."
morphology:
  - "«الْمُقَانَاة» اسم مفعول من «قانى» على «فاعَل»: «وكل ما جمع بين لونين فقد قانى» [@ibn-al-anbari، ص71]. «والمقاناة في البيت مصوغة للمفعول دون المصدر» [@zawzani، ص52]."
  - "«نَمِير» فعيل من النماء."
  - "«مُحَلَّل» «ذكر أنه من الحلول، وذكر أنه من الحل» [@zawzani، ص52]."
rhetoric:
  thesis: "تشبيه باللون الذي يحبه العرب: بياض تخالطه صفرة، كبيضة النعام."
  devices:
    - title: "تشبيه بثلاثة تفسيرات"
      text: "للشراح في المشبّه به ثلاثة أقوال: بيضة النعامة الأولى، أو الدرة البكر في صدفتها، أو البردية البكر [@zawzani، ص52–53]. والجامع بينها اللون: بياض تشوبه صفرة."
    - title: "الانتقال من المشبّه به إلى المشبّه"
      text: "بدأ بالبيضة، ثم قال «غذاها نمير الماء»، فعاد إلى المرأة: «ثم رجع إلى نعت المرأة» [@ibn-al-anbari، ص72]. فالبيت يبدأ بالصورة وينتهي بصاحبة الصورة."
    - title: "الماء والنشأة"
      text: "جعل جمالها أثرًا من آثار الماء الذي نشأت عليه، «لأن الماء من أكثر الأشياء تأثيرًا في الغذاء» [@zawzani، ص53]."
  connection: "ثم يختم الغزل: «تسلّت عمايات الرجال عن الصبا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَبِكْرِلْ / مُقَانَاتِلْ / بَيَاضِ / بِصُفْرَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — غَذَاهَا / نَمِيرُلْ مَا / ءِ غَيْرَ / مُحَلْلَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الشطرين [@atiq، ص29]."
context: "في رواية الزَّوْزَنِيّ يأتي هذا البيت بعد «مهفهفة بيضاء» (31)، لا في هذا الموضع [@zawzani، ص52]؛ وموضعه في رواية ابن الأَنْبارِيّ بعد «إلى مثلها يرنو الحليم»."
variants:
