  - reading: "كَبِكْرِ مُقَانَاةِ الْبَيَاضِ بِصُفْرَةٍ"
    status: "رواية سهل"
    note: "«قال: وأظنها من صفة المرأة» [@ibn-al-anbari، ص72]."
