first: "أَفَاطِمَ مَهْلًا بَعْضَ هَذَا التَّدَلُّلِ"
second: "وَإِنْ كُنْتِ قَدْ أَزْمَعْتِ صَرْمِي فَأَجْمِلِي"
meaning: "يا فاطمة، رفقًا، دعي بعض هذا الدلال. وإن كنت قد عزمت على هجري فأجملي في الهجر. قال الزَّوْزَنِيّ: «يا فاطمة دعي بعض دلالك، وإن كنت وطّنت نفسك على فراقي فأجملي في الهجران» [@zawzani، ص45]."
vocabulary:
  - term: "مَهْلًا"
    text: "رفقًا [@zawzani، ص45]."
  - term: "التَّدَلُّلِ"
    text: "الدلال: «أن يثق الإنسان بحب غيره إياه فيؤذيه على حسب ثقته به» [@zawzani، ص45]."
  - term: "أَزْمَعْتِ"
    text: "عزمتِ. قال الأَصْمَعِيّ: «يقال: قد أزمعت على الأمر، وأجمعت عليه، وعزمت عليه، سواء» [@ibn-al-anbari، ص44]."
  - term: "صَرْمِي"
    text: "الصرم: القطيعة، «ومنه سيف صارم» [@ibn-al-anbari، ص44]."
  - term: "فَأَجْمِلِي"
    text: "من الإجمال، وهو ترك ما يقبح [@deif، ج1 ص249]."
syntax:
  - "«أَفَاطِمَ»: الهمزة حرف نداء للقريب، و«فاطمَ» منادى مرخّم، أصله «فاطمة»، حُذفت التاء وبقيت الميم مفتوحة، «كما يقال في ترخيم بثينة وخديجة: يا بُثين أقبلي، ويا خديج اقعدي» [@ibn-al-anbari، ص43]."
  - "«مَهْلًا»: مفعول مطلق لفعل محذوف. و«بَعْضَ» منصوب؛ قال الزَّوْزَنِيّ: «نصب بعض لأن مهلًا ينوب مناب دَعْ» [@zawzani، ص45]. و«هذا» مضاف إليه، و«التدلل» بدل منه."
  - "«وَإِنْ كُنْتِ قَدْ أَزْمَعْتِ صَرْمِي»: «إن» حرف شرط، و«كنتِ» فعل الشرط، وتاؤه اسمها، وجملة «قد أزمعت» خبرها، و«صرمي» مفعول به."
  - "«فَأَجْمِلِي»: الفاء رابطة لجواب الشرط، و«أجملي» فعل أمر مبني على حذف النون."
morphology:
  - "«التَّدَلُّل» مصدر «تدلّل» على «تَفَعُّل»."
  - "«أَزْمَعَ» على «أَفْعَلَ»."
  - "«صَرْم» مصدر «صرم يصرم»، و«الصُّرْم» الاسم [@ibn-al-anbari، ص44]."
rhetoric:
  thesis: "بعد أن قص مغامراته مع غيرها، يلتفت إلى فاطمة بعتاب رقيق: لا يطلب منها ترك الدلال كله، بل بعضه."
  devices:
    - title: "الترخيم والنداء بالهمزة"
      text: "حذف آخر اسمها في النداء، وناداها بالهمزة التي للقريب؛ فالنداء كله قُرب وتحبّب. وذكر ابن الأَنْبارِيّ في المنادى تسع لغات، منها هذه [@ibn-al-anbari، ص42–43]."
    - title: "«بعض» تلطيف"
      text: "لم يقل «دعي التدلل»، بل «بعض هذا التدلل»؛ فهو يحب دلالها، ويريد أن يخف لا أن ينتهي. ولهذا وصفه شوقي ضيف بأنه «عتاب رقيق» [@deif، ج1 ص249]."
    - title: "التسليم في الشرط"
      text: "جاء بالاحتمال الأسوأ: «وإن كنت قد أزمعت صرمي»، ثم لم يطلب منعه، بل طلب أن يكون جميلًا. فالبيت يجمع الرجاء والتسليم."
  connection: "ثم يسألها: «أغرّك مني أن حبك قاتلي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَفَا طِ / مَ مَهْلَنْ بَعْ / ضَ هَاذَتْ / تَدَلْلُلِي = فعولُ / مفاعيلن / فعولن / مفاعلن — وَإِنْ كُنْ / تِ قَدْ أَزْمَعْ / تِ صَرْمِي / فَأَجْمِلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى من الصدر وحدها [@atiq، ص29]."
context: "يقول شوقي ضيف إنه بعد أن قص مغامراته، «يعود فيبث فاطمة حبه مصورًا دلالها، ومعاتبًا لها عتابًا رقيقًا» [@deif، ج1 ص249]. وفاطمة عند ابن الكَلْبِيّ «ابنة العُبَيْد بن ثعلبة» من عُذْرة [@ibn-al-anbari، ص44]، وعند الزَّوْزَنِيّ قد تكون هي عُنَيْزة، «وعنيزة لقب لها فيما قيل» [@zawzani، ص45]."
variants:
  - reading: "أَفَاطِمَ أَبْقِي بَعْضَ هَذَا التَّدَلُّلِ"
    status: "رواية أبي عَمْرو الشيباني"
    note: "أي: أبقي بعضه واتركي بعضه [@ibn-al-anbari، ص44]."
  - reading: "وَإِنْ كُنْتِ قَدْ أَزْمَعْتِ قَتْلِي فَأَجْمِلِي"
    status: "رواية أبي عُبَيْدة"
    note: "ومنه المثل: «أجمل في قتلي» [@ibn-al-anbari، ص44]."
