first: "فَقُلْتُ لَهُ لَمَّا عَوَى إِنَّ شَأْنَنَا"
second: "قَلِيلُ الْغِنَى إِنْ كُنْتَ لَمَّا تَمَوَّلِ"
meaning: "فقلت للذئب لما صاح: إن أمرنا واحد، كلانا قليل المال إن كنتَ لم تملك شيئًا بعد. قال ابن الأَنْبارِيّ: «معناه أنا لا أغني عنك وأنت لا تغني عني شيئا. أي أنا أطلب وأنت تطلب فكلانا لا غنى له» [@ibn-al-anbari، ص81]."
vocabulary:
  - term: "عَوَى"
    text: "«صاح» [@ibn-al-anbari، ص81]."
  - term: "شَأْنَنَا"
    text: "أمرنا وحالنا."
  - term: "الْغِنَى"
    text: "المال والكفاية."
  - term: "تَمَوَّلِ"
    text: "«وقد تموّل الرجل إذا صار ذا مال» [@zawzani، ص63]."
syntax:
  - "«إِنَّ»: كُسرت «لمجيئها بعد القول» [@ibn-al-anbari، ص81]. «والشأن اسم إن، وقليل خبر إن» [@ibn-al-anbari، ص81]. وعند الزَّوْزَنِيّ تقدير: «إن شأننا أننا قليل الغنى» [@zawzani، ص63]."
  - "«إِنْ كُنْتَ»: شرطية، «والتاء اسم الكون، وما عاد من تمول خبر الكون» [@ibn-al-anbari، ص81]، أي جملة «لمّا تموّل» خبر كان. وجواب الشرط محذوف دلّ عليه ما قبله."
  - "«لَمَّا»: حرف جزم بمعنى «لم»، «كما كانت في قوله تعالى: ولما يعلم الله الذين جاهدوا منكم» [@zawzani، ص63]. و«تموّلِ» مجزوم بها، وكُسر للقافية."
morphology:
  - "«تَمَوَّل» على «تفعّل» من «المال»، وأصل ألفه واو."
  - "«عَوَى» لفيف مقرون، مضارعه «يعوي»."
  - "«لمّا» الجازمة تنفي الفعل إلى وقت الكلام."
rhetoric:
  thesis: "يجعل الذئب محاورًا ونظيرًا: جائعان في وادٍ واحد."
  devices:
    - title: "خطاب ما لا يعقل"
      text: "«فقلت له»: يخاطب الذئب كما يخاطب رجلًا، فتصير العزلة حوارًا بين شريكين في الفقر."
    - title: "المشاكلة في الحال"
      text: "«إن شأننا»: جمع نفسه والذئب في ضمير واحد، ومهّد بذلك للبيت التالي «كلانا»."
    - title: "روايتان في المعنى"
      text: "رواية «قليل الغنى»: كلانا فقير. ورواية «طويل الغنى»: «أراد همتي تطول في طلب الغنى» [@ibn-al-anbari، ص81]؛ أي كلانا يطلب الغنى طويلًا ولا يظفر."
  connection: "ثم يقول: «كلانا إذا ما نال شيئا أفاته»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَقُلْتُ / لَهُو لَمْمَا / عَوَى إِنْ / نَ شَأْنَنَا = فعولُ / مفاعيلن / فعولن / مفاعلن — قَلِيلُلْ / غِنَى إِنْ كُنْ / تَ لَمْمَا / تَمَوْوَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "هاء «لَهُ» تُشبع فتُنطق «لَهُو». دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "من الأبيات الأربعة (49–52) التي رواها بعض الرواة في المعلقة، وأنكرها الأَصْمَعِيّ وأبو عُبَيْدة وجمهور الأئمة، ونسبها بعضهم إلى تأبَّط شرًّا [@ibn-al-anbari، ص80، ص82] [@zawzani، ص61]."
variants:
  - reading: "طَوِيلُ الْغِنَى إِنْ كُنْتَ لَمَّا تَمَوَّلِ"
    status: "رواية أخرى"
    note: "«فمعناه طويل طلب الغنى» [@zawzani، ص63] [@ibn-al-anbari، ص81]."
