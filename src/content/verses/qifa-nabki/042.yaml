first: "تَسَلَّتْ عَمَايَاتُ الرِّجَالِ عَنِ الصِّبَا"
second: "وَلَيْسَ فُؤَادِي عَنْ هَوَاكِ بِمُنْسَلِ"
meaning: "ذهبت عن الرجال جهالات الصبا فسلوا، أما قلبي فلا يسلو عن هواك. قال الزَّوْزَنِيّ: «أنه رغم أن عشق العشاق قد بطل وزال وعشقه إياها باقٍ ثابت ولا يزول ولا يبطل» [@zawzani، ص58]."
vocabulary:
  - term: "تَسَلَّتْ"
    text: "«ذهبت. يقال: سلوت عن كذا وكذا وسليت، إذا طابت نفسي بتركه» [@ibn-al-anbari، ص73]."
  - term: "عَمَايَاتُ"
    text: "جمع عماية، و«عد الجهل عمى» [@ibn-al-anbari، ص73]."
  - term: "الصِّبَا"
    text: "«اللعب»، من «صبا إلى اللهو يصبو صباء» [@ibn-al-anbari، ص73]."
  - term: "بِمُنْسَلِ"
    text: "بسالٍ، من «انسلى انسلاء أي زال حبه من قلبه» [@zawzani، ص58]."
syntax:
  - "«والعمايات مرتفعة بتسلت، وهي مضافة إلى الرجال، وعن الصبا صلة تسلت، وفؤادي مرتفع بليس، وبمنسل خبر ليس، وعن هواك صلة منسلى» [@ibn-al-anbari، ص73]."
  - "والباء في «بمنسل» زائدة لتوكيد النفي، و«منسلٍ» مجرور لفظًا منصوب محلًّا خبرًا لليس."
morphology:
  - "«تَسَلَّت» على «تفعّل» من «سلا»."
  - "«مُنْسَلٍ» اسم فاعل من «انسلى» على «انفعل»، منقوص حُذفت ياؤه."
  - "«عَمَايَات» جمع «عماية»، «والعماية والعمى واحد» [@zawzani، ص58]."
rhetoric:
  thesis: "يختم الغزل بمقابلة: الرجال يسلون، وهو وحده لا يسلو."
  devices:
    - title: "المقابلة"
      text: "الصدر للرجال: تسلّوا. والعَجُز له: لم يسلُ. فالبيت كله قائم على الفرق بينه وبين الناس."
    - title: "القلب"
      text: "«زعم أكثر الأئمة أن في البيت قلبًا تقديره: تسلت الرجالات عن عمايات الصبا أي خرجوا من ظلماته» [@zawzani، ص58]. والقلب أن يُجعل أحد طرفي الكلام مكان الآخر."
    - title: "الاستعارة"
      text: "جعل الجهل عمى، فالشباب عنده ظلمات يخرج منها الرجال، إلا هو [@ibn-al-anbari، ص73]."
  connection: "ثم يقول: «ألا رب خصم فيك ألوى رددته»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "تَسَلْلَتْ / عَمَايَاتُرْ / رِجَالِ / عَنِصْصِبَا = فعولن / مفاعيلن / فعولُ / مفاعلن — وَلَيْسَ / فُؤَادِي عَنْ / هَوَاكِ / بِمُنْسَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]."
context: "وقال بعضهم إن «عن» هنا بمعنى «بعد»: «انكشفت وبطلت ضلالات الرجال بعد مضي صباهم، وفؤادي بعد في ضلالة هواها» [@zawzani، ص58]."
