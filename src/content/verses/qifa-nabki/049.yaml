first: "وَقِرْبَةِ أَقْوَامٍ جَعَلْتُ عِصَامَهَا"
second: "عَلَى كَاهِلٍ مِنِّي ذَلُولٍ مُرَحَّلِ"
meaning: "ورُبّ قربة ماء لقوم حملتها، فجعلت حبلها على كاهل مني تعوّد الحمل. قال ابن الأَنْبارِيّ: «يصف نفسه بأنه يخدم أصحابه» [@ibn-al-anbari، ص80]. وللزَّوْزَنِيّ فيه قولان: أنه يفخر بخدمة رفاقه في السفر وحمل الماء لهم، أو أنه يفخر بتحمل أثقال الناس ونوائبهم، «واستعار حمل القربة لتحمل الحقوق» [@zawzani، ص61]."
vocabulary:
  - term: "عِصَامَهَا"
    text: "«عصام القربة: الحبل الذي تحمل به ويضعه الرجل على عاتقه وعلى صدره» [@ibn-al-anbari، ص80]."
  - term: "كَاهِلٍ"
    text: "«موصل العنق إلى الظهر» [@ibn-al-anbari، ص80]."
  - term: "ذَلُولٍ"
    text: "منقاد قد اعتاد ما يُحمل عليه."
  - term: "مُرَحَّلِ"
    text: "«الترحيل: مبالغة الرحل، يقال: رحلته إذا كررت رحله» [@zawzani، ص61]. وعند شوقي ضيف: «مرحل: تعود الرحلة» [@deif، ج1 ص245، الحاشية]."
syntax:
  - "«وَقِرْبَةِ»: «مخفوضة بالواو التي تخلف رب» [@ibn-al-anbari، ص80]، أي أن الواو نابت عن «ربّ». و«أقوام» مضاف إليه."
  - "«جَعَلْتُ عِصَامَهَا»: «والعصام منصوب بجعلت، وعلى صلة جعلت وهي خافضة للكاهل» [@ibn-al-anbari، ص80]."
  - "«مِنِّي»: صفة للكاهل. و«ذلولٍ» و«مرحّلٍ» «نعتان للكاهل» [@ibn-al-anbari، ص80]."
morphology:
  - "«عِصَام» على «فِعال»، وهو من أوزان الآلة: ما يُعصم به الشيء."
  - "«ذَلُول» على «فَعُول»، من الذُّل الذي هو ضد الصعوبة."
  - "«مُرَحَّل» اسم مفعول من المضعف «رحّل»، والتضعيف للتكثير [@zawzani، ص61]."
rhetoric:
  thesis: "فخر بالخدمة والتحمل، لا بالملك والنسب: الشاعر هنا رجل يحمل الماء لقومه."
  devices:
    - title: "الاستعارة"
      text: "على قول الزَّوْزَنِيّ الأول، القربة استعارة لحقوق الناس ونوائبهم، «ثم ذكر الكاهل؛ لأنه موضع القربة من حاملها، وعبر بكون الكاهل ذلولًا مرحلًا عن اعتياده تحمل الحقوق» [@zawzani، ص61]."
    - title: "الكناية"
      text: "«ذلول مرحّل» كناية عن طول الاعتياد: كاهل حمل كثيرًا حتى لان."
    - title: "صوت غريب عن القصيدة"
      text: "بعد ليل الهموم يأتي رجل يخدم أصحابه، وهذه صورة الصعلوك لا صورة الأمير. ولهذا رأى الأَصْمَعِيّ أن هذه الأبيات «لا تشاكل شعره» [@deif، ج1 ص245]."
  connection: "ثم يقطع واديًا قفرًا: «ووادٍ كجوف العير قفرٍ قطعته»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَقِرْبَ / ةِ أَقْوَامِنْ / جَعَلْتُ / عِصَامَهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — عَلَى كَا / هِلِنْ مِنْنِي / ذَلُولِنْ / مُرَحْحَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "من الأبيات الأربعة (49–52) التي رواها بعض الرواة في المعلقة، وأنكرها الأَصْمَعِيّ وأبو عُبَيْدة وجمهور الأئمة، ونسبها بعضهم إلى تأبَّط شرًّا [@ibn-al-anbari، ص80، ص82] [@zawzani، ص61]."
