first: "وَقَدْ أَغْتَدِي وَالطَّيْرُ فِي وُكُنَاتِهَا"
second: "بِمُنْجَرِدٍ قَيْدِ الْأَوَابِدِ هَيْكَلِ"
level: "basic"
meaning: "وكثيرًا ما أخرج إلى الصيد مبكرًا، والطير لم تغادر أعشاشها بعد، على فرس قصير الشعر، يلحق الوحوش فلا تفوته فكأنه قيد لها، عظيم الجسم [@zawzani، ص63–64]."
vocabulary:
  - term: "أَغْتَدِي"
    text: "أغدو، أي أخرج في أول النهار [@ibn-al-anbari، ص82]."
  - term: "وُكُنَاتِهَا"
    text: "مواضعها التي تبيت فيها [@ibn-al-anbari، ص82]."
  - term: "مُنْجَرِدٍ"
    text: "القصير الشعر، وذلك من كرم الأصل [@ibn-al-anbari، ص82]؛ وقيل: الماضي في السير [@zawzani، ص63]."
  - term: "الْأَوَابِدِ"
    text: "الوحوش [@ibn-al-anbari، ص82]."
  - term: "هَيْكَلِ"
    text: "العظيم من الخيل [@ibn-al-anbari، ص82]."
context: "هنا يبدأ الفخر بالفروسية [@zawzani، ص64]. و«قيد الأَوابِد» من أشهر ما سبق إليه امرؤ القَيْس؛ عدّه ابن سَلّام في مبتكراته [@ibn-sallam، ج1 ص55]، وقال أبو عُبَيْدة: «وأول من قيدها امرؤ القَيْس» [@ibn-al-anbari، ص82]. والمعنى أن الفرس سريع حتى إن الوحش لا يمكنها الفوت منه، كما لا يفوت المقيّد [@zawzani، ص64]."
variants:
  - reading: "وَالطَّيْرُ فِي وُكُرَاتِهَا"
    status: "رواية أخرى"
    note: "«وُكُرَاتِهَا» بدل «وُكُنَاتِهَا»، والمعنى واحد [@ibn-al-anbari، ص82]."
