first: "وَقَدْ أَغْتَدِي وَالطَّيْرُ فِي وُكُنَاتِهَا"
second: "بِمُنْجَرِدٍ قَيْدِ الْأَوَابِدِ هَيْكَلِ"
meaning: "وكثيرًا ما أخرج إلى الصيد مبكرًا، والطير لم تغادر أعشاشها بعد، على فرس قصير الشعر، يلحق الوحوش فلا تفوته فكأنه قيد لها، عظيم الجسم [@zawzani، ص63–64]."
vocabulary:
  - term: "أَغْتَدِي"
    text: "أغدو، أي أخرج في أول النهار [@ibn-al-anbari، ص82]."
  - term: "وُكُنَاتِهَا"
    text: "مواضعها التي تبيت فيها [@ibn-al-anbari، ص82]."
  - term: "مُنْجَرِدٍ"
    text: "القصير الشعر، وذلك من كرم الأصل [@ibn-al-anbari، ص82]؛ وقيل: الماضي في السير [@zawzani، ص63]."
  - term: "الْأَوَابِدِ"
    text: "الوحوش [@ibn-al-anbari، ص82]."
  - term: "هَيْكَلِ"
    text: "العظيم من الخيل [@ibn-al-anbari، ص82]."
syntax:
  - "«وَقَدْ أَغْتَدِي»: «قد» مع المضارع هنا تفيد التكثير؛ ولذلك يشرحها الزَّوْزَنِيّ: «وربما باكرت الصيد» [@zawzani، ص64]."
  - "«وَالطَّيْرُ فِي وُكُنَاتِهَا» جملة حالية، والواو واو الحال [@ibn-al-anbari، ص83]."
  - "«بِمُنْجَرِدٍ» متعلق بـ«أَغْتَدِي»، و«قَيْدِ الْأَوَابِدِ» و«هَيْكَلِ» نعتان له. وقد نُعتت النكرة «منجرد» بالمعرفة «قَيْدِ الْأَوَابِدِ» لأن المعنى: مثل قيد الأَوابِد [@ibn-al-anbari، ص83]."
morphology:
  - "«أَغْتَدِي» على وزن «أفتعل» من «غدا»، بمعنى أغدو [@ibn-al-anbari، ص82]."
  - "«الوُكُنات» جمع «وُكْنة»، ويجوز في كافها الضم والفتح والإسكان [@zawzani، ص63]."
  - "«الْأَوَابِدِ» جمع «آبدة»، من «أبَد الوحش» إذا توحّش [@zawzani، ص63]."
rhetoric:
  thesis: "في كلمتين، «قَيْدِ الْأَوَابِدِ»، يصف الشاعر سرعة فرسه كلها: الوحوش لا تفلت منه، فكأنه قيد في أرجلها."
  devices:
    - title: "الاستعارة «قَيْدِ الْأَوَابِدِ»"
      text: "جعل الفرس قيدًا، لأن الوحش لا يمكنها الفوت منه كما لا يفوت المقيّد [@zawzani، ص64]. قال أبو عُبَيْدة: «وأول من قيدها امرؤ القَيْس» [@ibn-al-anbari، ص82]، وعدّها ابن سَلّام من مبتكراته [@ibn-sallam، ج1 ص55]."
    - title: "معنى يحتاج إلى قليل من التأمل"
      text: "يضرب عبد القاهر الجُرْجانيّ «بِمُنْجَرِدٍ قَيْدِ الْأَوَابِدِ هَيْكَلِ» مثلًا للمعنى الذي لا ينكشف من أول سماع، فهو «كالجوهر في الصدف لا يبرز لك إلا أن تشقّه عنه» [@asrar، ص141]. ولا يريد الغموض المتعب، بل «القدر الذي يحتاج إليه» من الفكر [@asrar، ص140]: تسأل نفسك كيف يكون الفرس قيدًا، ثم تجد الجواب، فتفرح به أكثر مما لو قيل لك صراحة: فرسي سريع."
    - title: "التبكير"
      text: "«وَالطَّيْرُ فِي وُكُنَاتِهَا»: يخرج قبل أن تستيقظ الطير؛ وفي ذلك فخر بالنشاط والهمة."
  connection: "ثم يفصّل صفة هذا الفرس في البيت التالي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَقَدْ أَغْ / تَدِي وَطْطَيْ / رُ فِي وُ / كُنَاتِهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — بِمُنْجَ / رِدِنْ قَيْدِلْ / أَوَابِ / دِ هَيْكَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "«وَالطَّيْرُ» تُنطق «وَطْطَيْرُ»: اللام الشمسية تُدغم في الطاء فلا تُحسب. وجاءت «فعولن» مقبوضة ثلاث مرات، في التفعيلة الثالثة من الصدر، والأولى والثالثة من العَجُز، وكل ذلك جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "هنا يبدأ الفخر بالفروسية [@zawzani، ص64]. و«قَيْدِ الْأَوَابِدِ» من أشهر ما سبق إليه امرؤ القَيْس؛ عدّه ابن سَلّام في مبتكراته [@ibn-sallam، ج1 ص55]، وقال أبو عُبَيْدة: «وأول من قيدها امرؤ القَيْس» [@ibn-al-anbari، ص82]. والمعنى أن الفرس سريع حتى إن الوحش لا يمكنها الفوت منه، كما لا يفوت المقيّد [@zawzani، ص64]."
variants:
  - reading: "وَالطَّيْرُ فِي وُكُرَاتِهَا"
    status: "رواية أخرى"
    note: "«وُكُرَاتِهَا» بدل «وُكُنَاتِهَا»، والمعنى واحد [@ibn-al-anbari، ص82]."
