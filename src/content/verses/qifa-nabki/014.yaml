first: "تَقُولُ وَقَدْ مَالَ الْغَبِيطُ بِنَا مَعًا"
second: "عَقَرْتَ بَعِيرِي يَا امْرَأَ الْقَيْسِ فَانْزِلِ"
meaning: "كانت تقول، وقد مال بنا الهودج جميعًا: أدبرتَ ظهر بعيري يا امرأ القَيْس، فانزل. قال الزَّوْزَنِيّ: «كانت هذه المرأة تقول لي في حال إمالة الهودج أو الرحل إيانا: قد أدبرت ظهر بعيري فانزل عن البعير» [@zawzani، ص42]. وأدبر ظهره: جرحه وأدماه."
vocabulary:
  - term: "الْغَبِيطُ"
    text: "«قال أبو عَمْرو الشيباني: هو الهودج بعينه. وقال الأَصْمَعِيّ: قتب الهودج. وقال غيرهما: هو مركب من مراكب النساء» [@ibn-al-anbari، ص38]."
  - term: "مَعًا"
    text: "جميعًا [@ibn-al-anbari، ص38]."
  - term: "عَقَرْتَ"
    text: "«تركت بعيري عقيرا» [@ibn-al-anbari، ص38]، أي جرحت ظهره."
syntax:
  - "«تَقُولُ»: فاعله ضمير عُنَيْزة. «وَقَدْ مَالَ الْغَبِيطُ»: الواو واو الحال، «وإنما جاز لمال أن تكون حالا لأن قد صحبته» [@ibn-al-anbari، ص37]، «لأن الماضي لا يكون حالا إلا بقد» [@ibn-al-anbari، ص38]."
  - "«بِنَا»: الباء للتعدية، أي: وقد أمالنا الغبيط [@zawzani، ص42]. و«معًا» «منصوب على الحال من النون والألف» [@ibn-al-anbari، ص38]."
  - "«يَا امْرَأَ الْقَيْسِ»: «منصوب لأنه منادى مضاف» [@ibn-al-anbari، ص38]. و«فانزلِ» فعل أمر ساكن الآخر، «إلا إنه كسر اللام للقافية ووصل كسرة اللام بالياء» [@ibn-al-anbari، ص38]."
morphology:
  - "«الْغَبِيط» على «فعيل»."
  - "«عَقَرْتَ» من العقر، «ومنه قولهم: كلب عقور، ولا يقال في ذي الروح إلا عقور» [@zawzani، ص42]."
  - "«امْرَأَ» من الأسماء التي تتبع راؤها الهمزة في الحركة: امرُؤٌ، امرَأً، امرِئٍ."
rhetoric:
  thesis: "بيت من الحوار الخالص: كلام عنيزة بلفظها، وفيه اسمه صريحًا."
  devices:
    - title: "ذكر اسمه على لسانها"
      text: "«يا امرأ القَيْس»: يسمع السامع اسم الشاعر من فم صاحبته، فيصير البيت شهادة حيّة على المشهد."
    - title: "الجملة الحالية"
      text: "«وقد مال الغبيط بنا معًا»: جملة قصيرة ترسم الحركة، فيرى السامع الهودج يميل بهما قبل أن يسمع كلامها."
    - title: "الإيجاز"
      text: "في العَجُز ثلاث جمل: خبر، ونداء، وأمر؛ وكلها في نصف بيت."
  connection: "ثم يروي جوابه: «فقلت لها سيري وأرخي زمامه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "تَقُولُ / وَقَدْ مَالَلْ / غَبِيطُ / بِنَا مَعَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — عَقَرْتَ / بَعِيرِي يَمْ / رَأَلْقَيْ / سِ فَنْزِلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "همزة «امرأ» وهمزة «انزل» همزتا وصل تسقطان في النطق: «يَمْرَأَلْقَيْسِ فَنْزِلِي». دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "قال أبو عُبَيْدة: «إنما قال: عقرت بعيري ولم يقل ناقتي، لأنهم يحملون النساء على الذكور، لأنها أقوى وأضبط» [@ibn-al-anbari، ص37]."
