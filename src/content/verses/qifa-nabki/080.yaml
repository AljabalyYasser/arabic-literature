first: "وَأَلْقَى بِصَحْرَاءِ الْغَبِيطِ بَعَاعَهُ"
second: "نُزُولَ الْيَمَانِي ذِي الْعِيَابِ الْمُحَمَّلِ"
meaning: "وألقى السحاب ثقله بصحراء الغبيط، فأنبت فيها زهرًا مختلف الألوان، كما ينزل التاجر اليمني فينشر ثيابه الملونة. قال ابن الأَنْبارِيّ: «أرسل ماءه وثقله كهذا التاجر اليماني حين ألقى متاعه في الأرض ونشر ثيابه، فكان بعضها أحمر، وبعضها أصفر، وبعضها أخضر... كذلك ما أخرج المطر من النبات والزهر» [@ibn-al-anbari، ص109]."
vocabulary:
  - term: "صَحْرَاءِ الْغَبِيطِ"
    text: "«وكل أرض منخفضة فهي غبيط» [@ibn-al-anbari، ص109]. وعند الزَّوْزَنِيّ: «أكمة قد انخفض وسطها وارتفع طرفاها، سميت غبيطًا تشبيهًا بغبيط البعير» [@zawzani، ص77]، والغبيط رحل تركب عليه النساء."
  - term: "بَعَاعَهُ"
    text: "«ثقله. يقال: ألقى فلان عليه بعاعه، أي ثقله وما معه من المتاع» [@ibn-al-anbari، ص109]."
  - term: "الْيَمَانِي"
    text: "التاجر اليمني [@zawzani، ص77]."
  - term: "الْعِيَابِ"
    text: "جمع عَيْبة، وهي «وعاء من جلد توضع فيه الثياب» [@zawzani، ص77، الحاشية]."
  - term: "الْمُحَمَّلِ"
    text: "الذي حُمّل عيابه [@ibn-al-anbari، ص109]."
syntax:
  - "«وألقى فعل للسحاب. المعنى: وألقى السحاب بصحراء الغبيط بعاعه» [@ibn-al-anbari، ص109]."
  - "«نُزُولَ الْيَمَانِي»: مفعول مطلق، «والتقدير مثل نزول اليماني» [@ibn-al-anbari، ص109]. وقال الزَّوْزَنِيّ: «وتقدير البيت: وألقى ثقله بصحراء الغبيط فنزل به نزولًا مثل نزول التاجر اليماني» [@zawzani، ص77]."
  - "«وذي العياب المحمل نعتان لليماني» [@ibn-al-anbari، ص109–110]."
morphology:
  - "«الْيَمَانِي» منسوب إلى اليمن، والألف فيه عوض من إحدى ياءي النسب، ولذلك خُففت الياء."
  - "«عِيَاب» جمع «عَيْبة» على «فِعال»."
  - "«الْمُحَمَّل» اسم مفعول من المضعف «حمّل»."
rhetoric:
  thesis: "بعد الهدم يأتي الخصب: الأرض تتزين بالزهر كبضاعة تاجر منشورة."
  devices:
    - title: "التشبيه التمثيلي"
      text: "شبّه حالًا بحال: «شبه نزول هذا المطر بنزول التاجر، وشبه ضروب النبات الناشئة من هذا المطر بصنوف الثياب التي نشرها التاجر عند عرضها للبيع» [@zawzani، ص77]."
    - title: "الإيجاز"
      text: "لم يذكر الزهر ولا النبات، بل ذكر التاجر وثيابه، وترك للسامع أن يرى الألوان. والشراح هم الذين صرّحوا بما سكت عنه."
    - title: "الاستعارة في «ألقى بعاعه»"
      text: "جعل للسحاب ثقلًا يلقيه كما يلقي المسافر متاعه إذا نزل، «فضربه مثلا للسحاب» [@ibn-al-anbari، ص109]."
  connection: "ثم تغرد الطيور: «كأن مكاكيّ الجِواء غُديّة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَأَلْقَى / بِصَحْرَاءِلْ / غَبِيطِ / بَعَاعَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — نُزُولَلْ / يَمَانِي ذِلْ / عِيَابِلْ / مُحَمْمَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "قال شوقي ضيف: «وقد ألقى بصحراء الغبيط ثقله فنشر به من النباتات والأزهار ما يشبه ضروب الثياب الزاهية الألوان التي ينشرها التاجر اليماني حين يعرضها للشراء» [@deif، ج1 ص256]."
variants:
  - reading: "كَصَرْعِ الْيَمَانِي ذِي الْعِيَابِ الْمُخَوَّلِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«أراد كما يطرح اليماني ذو العياب الذي معه الخول، ما معه إذا نزل بمكان» [@ibn-al-anbari، ص108–109]. والخَوَل: الخدم."
