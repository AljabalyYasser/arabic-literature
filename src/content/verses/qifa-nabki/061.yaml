first: "ضَلِيعٍ إِذَا اسْتَدْبَرْتَهُ سَدَّ فَرْجَهُ"
second: "بِضَافٍ فُوَيْقَ الْأَرْضِ لَيْسَ بِأَعْزَلِ"
meaning: "فرس عظيم الأضلاع منتفخ الجنبين، إذا نظرت إليه من خلفه رأيت ذيله السابغ قد سدّ ما بين رجليه، قريبًا من الأرض لا يبلغها، مستويًا لا يميل. قال الزَّوْزَنِيّ: «فسبوغ ذنبه من دلائل عتقه وكرمه» [@zawzani، ص69]."
vocabulary:
  - term: "ضَلِيعٍ"
    text: "«يقال فرس ضليع وبعير ضليع، إذا كانا قويين منتفجي الجنبين» [@ibn-al-anbari، ص90]."
  - term: "اسْتَدْبَرْتَهُ"
    text: "نظرت إليه من خلفه؛ «والاستدبار: النظر إلى دبر الشيء، وهو مؤخره» [@zawzani، ص68]."
  - term: "فَرْجَهُ"
    text: "«ما بين رجليه» [@ibn-al-anbari، ص90]."
  - term: "ضَافٍ"
    text: "«بذنب ضاف، وهو السابغ» [@ibn-al-anbari، ص90]، أي الطويل التام."
  - term: "أَعْزَلِ"
    text: "«الذي يميل عظم ذنبه إلى أحد الشقين» [@zawzani، ص68]."
syntax:
  - "«ضَلِيعٍ»: «نعت لما قبله» [@ibn-al-anbari، ص90]، أي لـ«منجرد»."
  - "«إِذَا اسْتَدْبَرْتَهُ سَدَّ فَرْجَهُ»: «وإذا وقت فيها طرف من الجزاء، وسد فرجه جواب إذا» [@ibn-al-anbari، ص90]."
  - "«بِضَافٍ»: صفة لموصوف محذوف: «أراد بذنب ضافٍ فحذف الموصوف اجتزاء بدلالة الصفة عليه» [@zawzani، ص68]. و«فويقَ» «منصوب على المحل»، أي ظرف، و«اسم ليس مضمر فيه، وخبرها بأعزل» [@ibn-al-anbari، ص90]."
morphology:
  - "«ضَلِيع» صفة على «فعيل»، «والمصدر الضلاعة» [@zawzani، ص68]."
  - "«ضافٍ» اسم فاعل منقوص من «ضفا يضفو»: سبغ وتمّ [@zawzani، ص68]."
  - "«فُوَيْق» «تصغير فوق وهو تصغير التقريب مثل قبيل وبُعَيد» [@zawzani، ص68]، أي قريبًا من الأرض."
rhetoric:
  thesis: "بعد أن وصفه من جانبه ومن أمامه، يصفه من خلفه: وصف من كل زاوية."
  devices:
    - title: "دقة القيد"
      text: "«فويق الأرض»: قيد يحفظ الصفة من العيب، «لأنه إذا بلغ الأرض وطئه برجليه وذلك عيب؛ لأنه ربما عثر به» [@zawzani، ص69]."
    - title: "نفي العيب"
      text: "«ليس بأعزل»: بعد أن أثبت له الحسن نفى عنه العيب المعروف في الأذناب، فلا يبقى للسامع اعتراض."
    - title: "خطاب السامع"
      text: "«إذا استدبرته»: يضع السامع خلف الفرس، فيرى ما يصفه الشاعر."
  connection: "ثم يصف ظهره: «كأن سراته لدى البيت قائما»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "ضَلِيعِنْ / إِذَسْتَدْبَرْ / تَهُو سَدْ / دَ فَرْجَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — بِضَافِنْ / فُوَيْقَلْ أَرْ / ضِ لَيْسَ / بِأَعْزَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "همزة «استدبرته» همزة وصل تسقط في النطق: «إِذَسْتَدْبَرْ». وجاء الصدر تامًّا، دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]."
context: "روى ابن الأَنْبارِيّ في الضليع عن عمر بن الخطاب أنه قال: «إذا اشتريت بعيراً فاشتره ضليعا، فإنْ أخطأك مخبر لم يخطئك منظر» [@ibn-al-anbari، ص90]؛ أي إن لم يكن جيد الباطن فهو جيد المنظر."
variants:
