first: "تَجَاوَزْتُ أَحْرَاسًا إِلَيْهَا وَمَعْشَرًا"
second: "عَلَيَّ حِرَاصًا لَوْ يُسِرُّونَ مَقْتَلِي"
meaning: "تجاوزت إليها حراسًا وقومًا حريصين على قتلي لو قدروا على ذلك خفية. قال الزَّوْزَنِيّ: «وقومًا حراصًا على قتلي لو قدروا عليه في خفية؛ لأنهم لا يجترئون على قتلي جهارًا»، ورجّح هذا المعنى «لأنه كان ملكًا والملوك لا يقدر على قتلهم علانية» [@zawzani، ص48]."
vocabulary:
  - term: "أَحْرَاسًا"
    text: "جمع «حَرَس» أو جمع «حارس» [@zawzani، ص48]."
  - term: "مَعْشَرًا"
    text: "«يريد قومها» [@ibn-al-anbari، ص49]."
  - term: "حِرَاصًا"
    text: "جمع حريص [@zawzani، ص48]."
  - term: "يُسِرُّونَ"
    text: "من الأضداد: «يقال: أسررت الشيء، إذا أخفيته؛ وأسررته، إذا أظهرته» [@ibn-al-anbari، ص49]."
syntax:
  - "«والأحراس منصوبون بتجاوزت... واليها صلة تجاوزت، والمعشر منسوق على الأحراس» [@ibn-al-anbari، ص49]."
  - "«حِرَاصًا»: «نعت للمعشر، وعلى صلة حراص» [@ibn-al-anbari، ص50]."
  - "«لَوْ يُسِرُّونَ»: «معنى لو يسرون: أن يسروا»، فـ«لو» هنا مصدرية بمعنى «أن»، «يقال: وددت أن يقوم عبد الله، ووددت لو قام عبد الله» [@ibn-al-anbari، ص50]. «ومقتلي موضعه نصب بيسرون» [@ibn-al-anbari، ص50]."
morphology:
  - "«مَعْشَر» «جمع لا واحد له من لفظه، وكذلك النفر والقوم والرهط» [@ibn-al-anbari، ص49–50]."
  - "«حِرَاص» جمع «حريص» على «فِعال»، «مثل ظراف وكرام ولئام» [@zawzani، ص48]."
  - "«مَقْتَل» مصدر ميمي من «قتل»."
rhetoric:
  thesis: "الوصول إليها مخاطرة: يعظم المغامرة بعظم ما تجاوزه."
  devices:
    - title: "كلمة من الأضداد"
      text: "«يُسرّون» تحتمل الإخفاء والإظهار، ويُروى «يُشِرّون» بمعنى يظهرون [@ibn-al-anbari، ص49]. وعلى المعنيين يبقى الخطر قائمًا: قتل في السر، أو قتل معلن."
    - title: "الفخر"
      text: "على قول من قال إنهم لا يقدرون على قتله «لشرفي ونباهتي وموضعي من قومي» [@ibn-al-anbari، ص49]، يصير البيت فخرًا بالمنزلة لا وصفًا للخطر وحده."
    - title: "الإيجاز"
      text: "«تجاوزت»: فعل واحد يطوي مسافة وحراسًا وقومًا، ولا يذكر كيف تجاوزهم."
  connection: "ثم يحدد وقت زيارته: «إذا ما الثريا في السماء تعرّضت»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "تَجَاوَزْ / تُ أَحْرَاسَنْ / إِلَيْهَا / وَمَعْشَرَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — عَلَيْيَ / حِرَاصَنْ لَوْ / يُسِرْرُو / نَ مَقْتَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "جاء الصدر تامًّا، ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "قال شوقي ضيف: «مصورا كيف اقتحم إليها الأهوال والأحراس» [@deif، ج1 ص250]. وقال يعقوب: «هذا مثل قولك: هو حريص على لو يقتلني» [@ibn-al-anbari، ص49]."
