first: "قِفَا نَبْكِ مِنْ ذِكْرَى حَبِيبٍ وَمَنْزِلِ"
second: "بِسِقْطِ اللِّوَى بَيْنَ الدَّخُولِ فَحَوْمَلِ"
level: "full"
meaning: "قفا يا صاحبيّ وأعيناني على البكاء، حين تذكرت حبيبًا فارقته ومنزلًا كان يسكنه، هناك في منقطع الرمل بين الدَّخُول وحَوْمَل [@zawzani، ص36]."
vocabulary:
  - term: "قِفَا"
    text: "فعل أمر من «وَقَفَ»، والخطاب لاثنين."
  - term: "سِقْطِ اللِّوَى"
    text: "منقطع الرمل حيث يستدق من طرفه [@zawzani، ص35]."
  - term: "اللِّوَى"
    text: "رمل يعوج ويلتوي [@zawzani، ص36]؛ وهو حيث يسترق الرمل فتخرج منه إلى الأرض الصلبة [@ibn-al-anbari، ص19]."
  - term: "الدَّخُول وحَوْمَل"
    text: "موضعان [@zawzani، ص36]. والديار التي وصفها امرؤ القَيْس في شعره كلها ديار بني أَسَد [@ibn-qutayba، ج1 ص107]."
syntax:
  - "خاطب بالتثنية «قِفَا». وللشراح في ذلك أقوال: أنه خاطب صاحبين حقًا؛ أو خاطب واحدًا بخطاب الاثنين على عادة العرب؛ أو أراد تكرير الأمر «قِفْ قِفْ»؛ أو أراد «قِفَنْ» بنون التوكيد فقلبها ألفًا [@zawzani، ص35]."
  - "«نَبْكِ» مجزوم لأنه جواب الأمر، وعلامة جزمه حذف الياء من آخره. والتقدير عند بعض النحويين: قفا إن تقفا نبكِ [@ibn-al-anbari، ص18]."
  - "«مِنْ ذِكْرَى» متعلق بـ«نَبْكِ» [@ibn-al-anbari، ص15]: فالبكاء سببه التذكر."
  - "الباء في «بِسِقْطِ اللِّوَى» تحتمل ثلاثة أوجه: أن تتعلق بـ«مَنْزِل»، أو بـ«نَبْكِ»، أو بـ«قِفَا» [@ibn-al-anbari، ص19]."
  - "«بَيْنَ الدَّخُولِ فَحَوْمَلِ»: الأصل أن يُعطف بعد «بين» بالواو. ولذلك روى الأَصْمَعِيّ «وَحَوْمَلِ» وقال: لا يقال رأيتك بين زيد فعَمْرو. وأجاز الفَرّاء الفاء على تقدير: بين أهل الدَّخُول فأهل حَوْمَل [@ibn-al-anbari، ص19]."
morphology:
  - "«قِفَا» من وَقَفَ يَقِفُ. والأصل «اوْقِفا»، سقطت الواو كما سقطت في المضارع «يَقِفُ»، فلم تبق حاجة إلى همزة الوصل فسقطت [@ibn-al-anbari، ص18]."
  - "يقال: بكى يبكي بكاءً وبُكًى، بالمد والقصر [@ibn-al-anbari، ص18]."
  - "في «سِقْط» ثلاث لغات: سِقط وسُقط وسَقط [@ibn-al-anbari، ص19]."
rhetoric:
  thesis: "مطلع صار مثالًا يُحتذى: يبدأ الشاعر قصيدته بالوقوف على منزل الحبيبة الخالي والبكاء عليه. وفي شطر واحد يجمع الحبيب والمنزل، فالبكاء على الإنسان والمكان معًا."
  devices:
    - title: "اسْتِيقاف الصحب"
      text: "يبدأ بأمر صاحبيه أن يقفا، فيجعل السامع شاهدًا على المشهد منذ الكلمة الأولى. وهذا مما عدّه ابن سَلّام من سبق امرئ القَيْس: «اسْتِيقاف صحبه، والتَّبْكاء في الديار» [@ibn-sallam، ج1 ص55]."
    - title: "الحبيب والمنزل"
      text: "لم يقل «مِنْ ذِكْرَى حَبِيبٍ» وحده، بل قرن به المنزل. فالمكان يستدعي الذكرى، والذكرى تستدعي البكاء."
    - title: "المكان بأسمائه"
      text: "لم يقل «في الصحراء»، بل سمّى المواضع: سِقْط اللِّوَى، والدَّخُول، وحَوْمَل، ثم تُوضِح والمِقْراة في البيت التالي. فالديار عنده أماكن حقيقية لها أسماء."
  connection: "ثم يكمل تحديد المكان في البيت الثاني، ويذكر أن آثار الديار لم تمحها الرياح."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "قِفَا نَبْ / كِ مِنْ ذِكْرَى / حَبِيبِنْ / وَمَنْزِلِي = فعولن / مفاعيلن / فعولن / مفاعلن — بِسِقْطِلْ / لِوَى بَيْنَدْ / دَخُولِ / فَحَوْمَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "هذا تقطيع محمود مصطفى للبيت [@ahda-sabil، ص14]. وآخر الصدر «وَمَنْزِلِ» يوافق آخر العَجُز «فَحَوْمَلِ»، وهذا يسميه الناس تَصْرِيعًا. ويدقق ابن رَشِيق فيسميه «تَقْفِيَة»، لأن العَرُوض والضرب فيه كلاهما «مفاعلن» كسائر القصيدة، ويخص اسم التَّصْرِيع بما تتغير فيه العَرُوض لتتبع الضرب. والغاية عنده «مبادرة الشاعر القافية ليعلم في أول وهلة أنه أخذ في كلام موزون غير منثور» [@ibn-rashiq، ج1 ص173–174]."
context: "أشهر مطلع في المعلقات، وبه يبدأ ابن عبد رَبِّه قائمتها [@iqd، ج6 ص118]. ويتخذه محمود مصطفى أول مثال يعلّم به تقطيع الشعر [@ahda-sabil، ص14]."
variants:
  - reading: "بَيْنَ الدَّخُولِ وَحَوْمَلِ"
    status: "رواية الأَصْمَعِيّ"
    note: "بالواو بدل الفاء، لأن «بين» لا يُعطف بعدها بالفاء عنده [@ibn-al-anbari، ص19]."
  - reading: "بِسَقْطِ اللِّوَى"
    status: "رواية الأَصْمَعِيّ"
    note: "قال الرِّياشِيّ: كان الأَصْمَعِيّ لا يعرف إلا السَّقط، مفتوح السين [@ibn-al-anbari، ص19]."
