first: "فَقُمْتُ بِهَا أَمْشِي تَجُرُّ وَرَاءَنَا"
second: "عَلَى إِثْرِنَا أَذْيَالَ مِرْطٍ مُرَحَّلِ"
meaning: "فقمت بها نمشي، وهي تجرّ وراءنا ذيل ثوبها الموشّى، فتمحو آثار أقدامنا. قال ابن الأَنْبارِيّ: «وهي تجر ذيلها لتعفى الأثر لئلا يستدل علينا» [@ibn-al-anbari، ص53]."
vocabulary:
  - term: "إِثْرِنَا"
    text: "الإثر والأثر: موضع القدم، «الأَثَرُ والإثر واحد» [@zawzani، ص50]."
  - term: "مِرْطٍ"
    text: "«كساء من خز أو غيره» [@ibn-al-anbari، ص53]. وعند شوقي ضيف: «إزار من خز» [@deif، ج1 ص250، الحاشية]."
  - term: "مُرَحَّلِ"
    text: "«المنقش بنقوش تشبه رحال الإبل» [@zawzani، ص50]، أي الموشّى."
syntax:
  - "«أَمْشِي»: «موضعه في التأويل نصب على الحال من التاء في قمت، والتقدير: قمت بها ماشيا» [@ibn-al-anbari، ص54]."
  - "«تَجُرُّ»: «فيه كناية مرفوعة تعود على المرأة، والأذيال منصوبة بتجر، وهي مضافة إلى المرط، والمرحل نعته» [@ibn-al-anbari، ص54]. والجملة حال ثانية."
  - "«وَرَاءَنَا» و«عَلَى إِثْرِنَا»: متعلقان بـ«تجرّ»."
morphology:
  - "«أَذْيَال» جمع «ذيل»، «والذيل يجمع على الأذيال والذيول» [@zawzani، ص50]."
  - "«مِرْط» جمعه «المروط» [@zawzani، ص50]."
  - "«مُرَحَّل» اسم مفعول من «رحّل»، «يقال: ثوب مرحل وفي هذا الثوب ترحيل» [@zawzani، ص50]."
rhetoric:
  thesis: "تفصيل صغير يحمل المشهد كله: ذيل ثوب يمحو الآثار."
  devices:
    - title: "الكناية"
      text: "جرّ الذيل على الأثر كناية عن الحذر والخوف من الرقباء؛ فهي شريكة في المغامرة لا مغلوبة عليها."
    - title: "الوصف بالحركة"
      text: "رجلان يمشيان، وثوب يُجرّ وراءهما: صورة تُرى، لا خبر يُروى."
    - title: "الترف في الثوب"
      text: "«مرط مرحّل»: ثوب من خز موشّى؛ فحتى أداة التخفي علامة على منزلة صاحبته."
  connection: "ثم يقول: «فلما أجزنا ساحة الحي وانتحى»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَقُمْتُ / بِهَا أَمْشِي / تَجُرْرُ / وَرَاءَنَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — عَلَى إِثْ / رِنَا أَذْيَا / لَ مِرْطِنْ / مُرَحْحَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "قال شوقي ضيف: «وكيف كانت تعفّي آثار أقدامهما بأذيال ثوبها الموشى» [@deif، ج1 ص251]."
variants:
  - reading: "خَرَجْتُ بِهَا أَمْشِي تَجُرُّ وَرَاءَنَا"
    status: "رواية الزَّوْزَنِيّ"
    note: "«أي خرجت بها من البيوت لنخلو» [@ibn-al-anbari، ص53] [@zawzani، ص50]."
  - reading: "عَلَى أَثَرَيْنَا ذَيْلَ مِرْطٍ مُرَحَّلِ"
    status: "رواية أخرى"
    note: "[@zawzani، ص50] [@deif، ج1 ص250]."
