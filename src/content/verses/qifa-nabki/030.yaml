first: "مَدَدْتُ بِغُصْنَيْ دَوْمَةٍ فَتَمَايَلَتْ"
second: "عَلَيَّ هَضِيمَ الْكَشْحِ رَيَّا الْمُخَلْخَلِ"
meaning: "فلما خلونا جذبتُ إليّ ضفيرتيها، وهما كغصني شجرة الدَّوْم، فمالت عليّ مطاوعة، وهي ضامرة الخصر ممتلئة الساقين. وقال الزَّوْزَنِيّ على روايته «هصرت بفودي رأسها»: «لَمّا خرجنا من الحلة وأمنّا الرقباء جذبت ذؤابتيها إلَيّ فطاوعتني فيما رمت منها ومالت عليّ مسعفة بطلبتي في حال ضمر كشحيها وامتلاء ساقيها باللحم» [@zawzani، ص52]. وفي «تمايلت عليّ» قال ابن الأَنْبارِيّ: «ويقال معنى قوله: (تمايلت عليَّ): التزمتني، وهو إعطاؤها» [@ibn-al-anbari، ص57]، أي عانقته وأعطته نفسها، والمعنى بلغة اليوم: ضمّته إليها ومكّنته من نفسها فجامعها. فالبيت خاتمة المغامرة: ما خرج من أجله قد تمّ."
vocabulary:
  - term: "مَدَدْتُ"
    text: "جذبتُ إليّ."
  - term: "بِغُصْنَيْ دَوْمَةٍ"
    text: "«الدومة الشجرة، ويقال في جمعها دوم» [@ibn-al-anbari، ص57]. وقال الزَّوْزَنِيّ: «شبهها بشجرة الدوم وشبه ذؤابتيها» بغصنين [@zawzani، ص51]، والذؤابة: الضفيرة من الشعر."
  - term: "فَتَمَايَلَتْ عَلَيَّ"
    text: "مالت عليّ، وهو عند ابن الأَنْبارِيّ «التزمتني» [@ibn-al-anbari، ص57]."
  - term: "هَضِيمَ الْكَشْحِ"
    text: "«ضامر الكشح داخلته»، و«الكشح: ما بين منقطع الأضلاع إلى الورك» [@ibn-al-anbari، ص57]."
  - term: "رَيَّا الْمُخَلْخَلِ"
    text: "ممتلئة موضع الخلخال من الساق: «ريّا: تأنيث الريان. المخلخل: موضع الخلخال من الساق»، و«عبر عن كثرة لحم الساقين وامتلائهما بالري» [@zawzani، ص51]."
syntax:
  - "البيت جواب «لمّا» في البيت السابق «فلما أجزنا ساحة الحي وانتحى». نقل ابن الأَنْبارِيّ عن أبي عُبَيْدة: «وانتحى نسق على أجزنا. وجواب فلما أجزنا (هصرت بفودي رأسها)» [@ibn-al-anbari، ص55]، وذكر الزَّوْزَنِيّ أن «هصرت جواب لَمَّا» عند البصريين [@zawzani، ص51–52]. وعلى رواية «إذا قلت هاتي ناوليني» يكون جواب «لما» محذوفًا [@zawzani، ص52]."
  - "«بِغُصْنَيْ دَوْمَةٍ»: جار ومجرور متعلق بـ«مددت»، و«غُصْنَيْ» مثنى مجرور بالياء حُذفت نونه للإضافة."
  - "«فَتَمَايَلَتْ عَلَيَّ»: معطوف بالفاء التي تفيد التعقيب: جذب فمالت."
  - "«هَضِيمَ الْكَشْحِ»: «ونصب هضيم الكشح على الحال» [@zawzani، ص52]، أي حال من فاعل «تمايلت». و«رَيَّا الْمُخَلْخَلِ» حال ثانية."
morphology:
  - "«هَضِيم» فعيل بمعنى مفعول، ولذلك «لم يقل هضيمة الكشح؛ لأن فعيلًا إذا كان بمعنى مفعول لم تلحقه علامة التأنيث» [@zawzani، ص52]."
  - "«رَيَّا» على «فَعْلى»، مؤنث «رَيّان»."
  - "«الْمُخَلْخَل» على صيغة اسم المفعول من «خَلْخَلَ»، ومعناه المكان: «موضع الخلخال. والمسور: موضع السوار» [@ibn-al-anbari، ص57]."
  - "«تَمَايَلَتْ» على «تَفَاعَلَتْ»، وفيه معنى الميل شيئًا بعد شيء."
rhetoric:
  thesis: "خاتمة المغامرة: بعد الأحراس والثريا والخروج من الحي، يجذبها فتميل عليه. ولا يسمّي ما كان، بل يقف عند الجذبة والميل، ثم يصف جسدها في العَجُز، فينتقل من القصة إلى الوصف."
  devices:
    - title: "الاستعارة"
      text: "في «بِغُصْنَيْ دَوْمَةٍ» جعل ضفيرتيها غصنين، وجعلها شجرة. قال الزَّوْزَنِيّ: «شبهها بشجرة الدوم وشبه ذؤابتيها» بغصنين، «وجعل ما نال منها كالثمر الذي يجتنى من الشجر» [@zawzani، ص51]. والاستعارة عند عبد القاهر الجُرْجانيّ «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وهي تعود إلى صورة البيت 15 «ولا تبعديني من جناك المعلّل»: المرأة شجرة، والوصال ثمرها."
    - title: "الكناية"
      text: "«فَتَمَايَلَتْ عَلَيَّ» ميل الجسد، والمراد ما بعده، كما فسّره ابن الأَنْبارِيّ: «التزمتني، وهو إعطاؤها» [@ibn-al-anbari، ص57]. فذكر الحركة التي تسبق الجماع وترك الجماع نفسه، وهذه الكناية التي يجيء فيها المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "المقابلة"
      text: "«هَضِيمَ الْكَشْحِ رَيَّا الْمُخَلْخَلِ»: ضمور في الوسط وامتلاء في الساق. وهي الصورة التي يعود إليها في البيت التالي: «مهفهفة بيضاء غير مفاضة»."
  connection: "ثم يأخذ في وصفها وصفًا متصلًا: «مهفهفة بيضاء غير مفاضة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "مَدَدْتُ / بِغُصْنَيْ دَوْ / مَتِنْ فَ / تَمَايَلَتْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — عَلَيْ يَ / هَضِيمَلْ كَشْ / حِ رَيْ يَلْ / مُخَلْخَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "يختم المغامرة التي بدأت في البيت 23 «وبيضة خدر لا يرام خباؤها»: تجاوز الأحراس، ووصل إليها، وتحاورا، وخرجا من الحي، ثم كان هذا. ويقول شوقي ضَيْف بعد أن يسرد المشهد: «واسترسل يصف محاسنها ومفاتن جسدها وأطرافها» [@deif، ج1 ص251]، وهو ما يبدأ في البيت التالي. والبيت مختلف في روايته اختلافًا كبيرًا: ابن الأَنْبارِيّ يثبت «مددت بغصني دومة» [@ibn-al-anbari، ص56]، والزَّوْزَنِيّ «هصرت بفودي رأسها» [@zawzani، ص51]، وشوقي ضَيْف ينشده «إذا قلت هاتى نوّلينى تمايلت» [@deif، ج1 ص250]."
variants:
  - reading: "هَصَرْتُ بِفَوْدَيْ رَأْسِهَا فَتَمَايَلَتْ"
    status: "رواية الزَّوْزَنِيّ، وذكرها ابن الأَنْبارِيّ"
    note: "«فمعنى هصرت جذبت وثنيت. والفودان: جانبا الرأس» [@ibn-al-anbari، ص57]. وبها احتج أبو عُبَيْدة في جواب «لما» [@ibn-al-anbari، ص55]. وفي اللسان عن الجَوْهَرِيّ: «هصرت الغصن وبالغصن إذا أخذت برأسه فأملته إليك» [@lisan، ج5 ص264]، فالفعل نفسه من معجم الأغصان."
  - reading: "مَدَدْتُ بِفَوْدَيْ رَأْسِهَا فَتَمَايَلَتْ"
    status: "رواية ذكرها ابن الأَنْبارِيّ"
    note: "[@ibn-al-anbari، ص57]."
  - reading: "إِذَا قُلْتُ هَاتِي نَوِّلِينِي تَمَايَلَتْ"
    status: "رواية ذكرها ابن الأَنْبارِيّ والزَّوْزَنِيّ، وبها أنشده شوقي ضَيْف"
    note: "«فمعنى هاتى أعطيني نوالك، أي أصيري إلى وصالك وأفضلي علىَّ به» [@ibn-al-anbari، ص56]، «ويقال: معنى قوله نوِّليني قبِّليني» [@ibn-al-anbari، ص57]. وهي عند الزَّوْزَنِيّ «ناوليني» [@zawzani، ص51]، وبها أنشده شوقي ضَيْف [@deif، ج1 ص250]."
