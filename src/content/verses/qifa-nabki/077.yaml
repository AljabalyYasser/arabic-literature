first: "وَتَيْمَاءَ لَمْ يَتْرُكْ بِهَا جِذْعَ نَخْلَةٍ"
second: "وَلَا أُجُمًا إِلَّا مَشِيدًا بِجَنْدَلِ"
meaning: "ومرّ السيل على تيماء فلم يترك بها جذع نخلة، ولا بيتًا، إلا ما بُني بالصخر. قال الزَّوْزَنِيّ: «يعني أنه قلع الأشجار وهدم الأبنية إلا ما كان منها مرفوعًا بالحجارة والجص» [@zawzani، ص76]."
vocabulary:
  - term: "تَيْمَاءَ"
    text: "«من أمهات القرى، قرى عربية» [@ibn-al-anbari، ص106]، في شمال الحجاز [@deif، ج1 ص255]."
  - term: "أُجُمًا"
    text: "«الأجم والآجام: البيوت المسقفة» [@ibn-al-anbari، ص105]."
  - term: "مَشِيدًا"
    text: "مبنيًّا بالشِّيد، «والشيد: الجص» [@ibn-al-anbari، ص105]. «والشيد الرفع وعلو البنيان» [@zawzani، ص75]."
  - term: "جَنْدَلِ"
    text: "الصخر [@zawzani، ص75]."
syntax:
  - "«وَتَيْمَاءَ»: معطوفة على «القَنان» في البيت قبلها: «ومرّ على القنان من نفيانه»، ولذلك هي مجرورة [@ibn-al-anbari، ص106]، وعلامة جرها الفتحة لأنها ممنوعة من الصرف."
  - "«لَمْ يَتْرُكْ بِهَا جِذْعَ نَخْلَةٍ»: الفاعل ضمير يعود على الماء، أي «لم يترك الماء بها جذع نخلة» [@ibn-al-anbari، ص106]. و«جذع» مفعول به، و«ولا أجمًا» معطوف عليه."
  - "«إِلَّا مَشِيدًا»: «منصوب على الحال من الأجم أو على خبر الترك، والاختيار أن ينصب بالرد على الأجم، كما تقول: لم أضرب أحدا إلا زيدا» [@ibn-al-anbari، ص106]."
morphology:
  - "«تَيْمَاء» على «فَعْلاء»، ممنوعة من الصرف لألف التأنيث الممدودة."
  - "«مَشِيد» اسم مفعول من الأجوف اليائي «شاد يشيد»."
  - "«أُجُم» مفرد، وجمعه «آجام» [@ibn-al-anbari، ص105]."
rhetoric:
  thesis: "يقيس قوة السيل بما بقي بعده: لم يصمد إلا ما بُني بالصخر."
  devices:
    - title: "الحصر بالنفي والاستثناء"
      text: "«لم يترك... إلا مشيدًا بجندل»: عمّ الهدم كل شيء، ثم استثنى الأقوى وحده، فصار الاستثناء نفسه دليلًا على شدة السيل."
    - title: "التدرج من الشجر إلى البناء"
      text: "بدأ بالنخل ثم بالبيوت: ما صنعته الطبيعة وما صنعه الإنسان، كلاهما لم يصمد."
    - title: "المكان المعروف"
      text: "ذكر تيماء باسمها، وهي قرية يعرفها السامع، فصار السيل واقعة في مكان محدد لا خيالًا."
  connection: "ثم يصف الجبال في السيل: «كأن ثبيرا في عرانين وبله / كبير أناس في بجاد مزمّل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَتَيْمَا / ءَ لَمْ يَتْرُكْ / بِهَا جِذْ / عَ نَخْلَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَلَا أُ / جُمَنْ إِلْلَا / مَشِيدَنْ / بِجَنْدَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "جاء الصدر تامًّا، ودخل القبضُ، وهو حذف الخامس الساكن «فعولن» في التفعيلة الأولى من العَجُز [@atiq، ص29]."
context: "يرى شوقي ضيف أن هذا المطر نزل «بمنازل قومه بني أَسَد بالقرب من تيماء في شمالي الحجاز» [@deif، ج1 ص255]، وأن ذكر هذه الأمكنة من أدلة صحة المعلقة. وفي تيماء حصن السَّمَوْأَل الذي استودعه امرؤ القَيْس دروعه، كما رأينا في سيرته."
variants:
  - reading: "وَلَا أُطُمًا إِلَّا مَشِيدًا بِجَنْدَلِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«ويقال هي رواية الأَصْمَعِيّ. والأطم والآطام مثل الأجم والآجام» [@ibn-al-anbari، ص105]. والأُطُم: القصر [@zawzani، ص75]."
