first: "كَأَنَّ الثُّرَيَّا عُلِّقَتْ فِي مَصَامِهَا"
second: "بِأَمْرَاسِ كَتَّانٍ إِلَى صُمِّ جَنْدَلِ"
meaning: "كأن الثريا قد عُلّقت في موضعها بحبال من كتان إلى صخور صلبة، فهي لا تبرح مكانها. قال يعقوب في «إلى صم جندل»: «إلى جبال صم. يقول: كأن لها أواخي في الأرض تحبسها» [@ibn-al-anbari، ص79]. والأواخي: الحبال التي تُشد بها الدواب."
vocabulary:
  - term: "الثُّرَيَّا"
    text: "نجوم صغيرة متقاربة، وقد مرّ ذكرها في البيت 25."
  - term: "مَصَامِهَا"
    text: "موضعها الذي لا تبرحه. قال يعقوب: «مصامها، معناه في موضعها»، «والصائم: القائم. ويقال: صام الماء، إذا سكن» [@ibn-al-anbari، ص79]."
  - term: "أَمْرَاسِ"
    text: "الحبال: «المرسة: الحبل، يقال مرسة ومرس، وفي الجمع أمراس» [@ibn-al-anbari، ص79]."
  - term: "صُمِّ"
    text: "«الأصم: الصلب، وتأنيثه الصمّاء، والجمع الصُمّ» [@zawzani، ص60]."
  - term: "جَنْدَلِ"
    text: "الحجارة [@ibn-al-anbari، ص79]، «والجمع جنادل» [@zawzani، ص60]."
syntax:
  - "«الثُّرَيَّا» اسم كأن، وجملة «عُلِّقَت» خبرها. و«في مصامها» و«بأمراس» و«إلى صمّ» كلها متعلقة بـ«عُلّقت» [@ibn-al-anbari، ص80]."
  - "«أَمْرَاسِ كَتَّانٍ»: إضافة «من إضافة البعض إلى الكل، أي: بأمراس من كتان، كقولهم: باب حديد، وخاتم فضة» [@zawzani، ص60]."
morphology:
  - "«مَصَام» اسم مكان من «صام» بمعنى قام وسكن [@ibn-al-anbari، ص79]."
  - "«أَمْرَاس» جمع «مَرَس»، «وقد يكون المرس جمع مَرَسة وهو الحبل أيضًا، فتكون الأمراس حينئذ جمع الجمع» [@zawzani، ص60]."
  - "«صُمّ» جمع «أصمّ» على «فُعْل»."
rhetoric:
  thesis: "بعد أن جعل النجوم كلها مشدودة إلى جبل، يخص نجمًا يعرفه كل أعرابي: الثريا أيضًا لا تتحرك."
  devices:
    - title: "التشبيه"
      text: "شبّه الثريا في ثباتها بشيء عُلّق بحبال إلى صخور؛ فالليل عنده واقف لا يمضي."
    - title: "تأكيد الصورة"
      text: "البيتان 47 و48 صورة واحدة مكررة: النجوم مشدودة، ثم الثريا معلقة. والتكرار هنا يطيل الليل على السامع كما طال على الشاعر."
    - title: "بيت بتفسيرين"
      text: "من الرواة من جعله في وصف الفرس، فقال: «شبه تحجيل الفرس في بياضه وصفائه بنجوم شدت بحجارة، فشبه الحوافر بالحجارة» [@ibn-al-anbari، ص92]. والتحجيل بياض في قوائم الفرس. فالصورة نفسها تصلح لليل الواقف وللفرس الواقف."
  connection: "ثم تأتي الأبيات الأربعة المختلف فيها: «وقربة أقوام جعلت عصامها»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنَثْ / ثُرَيْيَا عُلْ / لِقَتْ فِي / مَصَامِهَا = فعولن / مفاعيلن / فعولن / مفاعلن — بِأَمْرَا / سِ كَتْتَانِنْ / إِلَى صُمْ / مِ جَنْدَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "قال ابن الأَنْبارِيّ إن فيه تفسيرين: وصف الليل، أو وصف الفرس، «فهذا تفسير من يرويه مؤخرا بعد صفة الفرس» [@ibn-al-anbari، ص79]. ورواه محمد بن حبيب بعد وصف ظهر الفرس، «وليس هو موضعه عند يعقوب وغيره» [@ibn-al-anbari، ص92]. وفي رواية الزَّوْزَنِيّ لا يوجد هذا البيت مستقلًّا، بل عجزه عجز البيت السابق [@zawzani، ص60]. ويقرؤه شوقي ضيف في الليل: كأن نجومه «شدّت بأسباب وأمراس من الجنادل والجبال فهي لا تتحرك ولا تزول» [@deif، ج1 ص253]."
