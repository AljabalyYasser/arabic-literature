first: "مُهَفْهَفَةٌ بَيْضَاءُ غَيْرُ مُفَاضَةٍ"
second: "تَرَائِبُهَا مَصْقُولَةٌ كَالسَّجَنْجَلِ"
meaning: "هي امرأة لطيفة الخصر ضامرة البطن، بيضاء، غير مسترخية اللحم، وصدرها لامع كالمرآة. قال الزَّوْزَنِيّ: «هي امرأة دقيقة الخصر ضامرة البطن غير عظيمة البطن ولا مسترخيته، وصدرها بَرَّاق اللون متلألئ الصفاء كتلألؤ المرآة» [@zawzani، ص52]."
vocabulary:
  - term: "مُهَفْهَفَةٌ"
    text: "«الخفيفة اللحم التي ليست برهلة ولا ضخمة البطن» [@ibn-al-anbari، ص58]."
  - term: "مُفَاضَةٍ"
    text: "«المسترخية البطن» [@ibn-al-anbari، ص58]."
  - term: "تَرَائِبُهَا"
    text: "«جمع تريبة، وهو موضع القلادة من الصدر» [@ibn-al-anbari، ص58]."
  - term: "السَّجَنْجَلِ"
    text: "«قال يعقوب: هو رومي. قال: وأراد مرآة» [@ibn-al-anbari، ص59]. وعند ابن سَلّام: «هى المرآة بالرومية» [@ibn-sallam، ج1 ص88]."
syntax:
  - "«مُهَفْهَفَةٌ»: «ترتفع بإضمار هي مهفهفة؛ وبيضاء وغير: نعتان لمهفهفة، وغير مضافة إلى المفاضة» [@ibn-al-anbari، ص59]. فهي خبر لمبتدأ محذوف."
  - "«تَرَائِبُهَا مَصْقُولَةٌ»: مبتدأ وخبر، «والكاف في موضع رفع لأنها نعت لمصقولة، والتقدير هي مصقولة مثل السجنجل» [@ibn-al-anbari، ص59]."
morphology:
  - "«مُهَفْهَفَة» اسم مفعول من الرباعي المضعف «هفهف»."
  - "«مُفَاضَة» اسم مفعول من «أفاض»؛ «وهو من قولهم: حديث مستفيض» [@ibn-al-anbari، ص58]."
  - "«السَّجَنْجَل» معرّب، «لغة رومية عربتها العرب» [@zawzani، ص52]."
rhetoric:
  thesis: "أول بيت في صورة الحبيبة: يبدأ بالقوام واللون، ثم يأتي بتشبيه من خارج البادية."
  devices:
    - title: "التشبيه"
      text: "شبّه صدرها في صفائه وبريقه بالمرآة. وهو من التشبيهات التي استحسنها الناس لامرئ القَيْس [@ibn-sallam، ج1 ص88]، ويقول شوقي ضيف: «أما ترائبها فكالمرآة» [@deif، ج1 ص261]."
    - title: "الاحتراس"
      text: "«غير مفاضة»: بعد أن وصفها بالنحافة نفى عنها العيب المقابل، الترهل، فحفظ الصفة من الزيادة والنقص."
    - title: "لفظ غريب"
      text: "أدخل كلمة رومية في وصف عربي؛ فالمرآة نفسها شيء نادر يأتي من بلاد الروم، والكلمة الغريبة تحمل غرابة الشيء."
  connection: "ثم يصف وجهها وعينها: «تصدّ وتبدي عن أسيل وتتقي»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "مُهَفْهَ / فَتُنْ بَيْضَا / ءُ غَيْرُ / مُفَاضَتِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — تَرَائِ / بُهَا مَصْقُو / لَتُنْ كَسْ / سَجَنْجَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "قال ابن الأَنْبارِيّ في آخر شرحه: «وإنما يصف المرأة بحداثة السن» [@ibn-al-anbari، ص59]."
variants:
  - reading: "تَرَائِبُهَا مَصْقُولَةٌ بِالسَّجَنْجَلِ"
    status: "رواية أبي عُبَيْدة"
    note: "«ويقال السجنجل: الزعفران، ويقال السجنجل: ماء الذهب والزعفران» [@ibn-al-anbari، ص59]."
