first: "كَأَنَّ سَرَاتَهُ لَدَى الْبَيْتِ قَائِمًا"
second: "مَدَاكُ عَرُوسٍ أَوْ صَلَايَةُ حَنْظَلِ"
meaning: "كأن أعلى ظهره إذا وقف عند البيت حجرٌ أملس تسحق عليه العروس طيبها، أو حجرٌ يُكسر عليه الحنظل. قال ابن الأَنْبارِيّ: «أراد به ملاسة ظهره واستواءه، واكتناز اللحم عليه»، «فهو أملس يبرق، لأنه أجرد ليس بكثير الشعر» [@ibn-al-anbari، ص90–91]."
vocabulary:
  - term: "سَرَاتَهُ"
    text: "«السراة أعلى ظهره. وسراة الجبل أعلاه» [@ibn-al-anbari، ص90]."
  - term: "مَدَاكُ عَرُوسٍ"
    text: "المداك: الحجر الذي يُسحق به الطيب أو عليه [@zawzani، ص69]. «معناه صلاية عروس، لأنها قريبة عهد بالسحق، فهي تبرق» [@ibn-al-anbari، ص91]."
  - term: "صَلَايَةُ حَنْظَلِ"
    text: "«الحجر الأملس الذي يسحق عليه شيء كالهبيد وهو حب الحنظل» [@zawzani، ص69]. «وقال أبو نصر: إنما قال صلاية حنظل لأن حب الحنظل يخرج دهنه فيبرق على الصلاية» [@ibn-al-anbari، ص91]."
syntax:
  - "«والسراة اسم كأن، ولدى البيت محل، ومداك عروس خبر كأن، والصلاية نسق على مداك» [@ibn-al-anbari، ص92]."
  - "«قَائِمًا»: «ونصب قائمًا على الحال» [@zawzani، ص69]."
morphology:
  - "«سَرَاة» أعلى الشيء، «والجمع السروات، ويستعار لعلية الناس» [@zawzani، ص69]."
  - "«مَدَاك» من «داكه يدوكه دوكا، إذا طحنه» [@ibn-al-anbari، ص91]."
  - "«صَلَايَة» على «فَعالة»."
rhetoric:
  thesis: "يصفه ساكنًا بعد أن وصفه عاديًا: حتى في وقوفه يلمع ظهره."
  devices:
    - title: "التشبيه بالملاسة والبريق"
      text: "وجه الشبه أن الظهر أملس مستوٍ لامع كحجر الطيب. «شبه انملاس ظهره واكتنازه باللحم، بالحجر الذي تسحق العروس به أو عليه الطيب» [@zawzani، ص69]."
    - title: "لماذا العروس؟"
      text: "«وخص مداك العروس لحدثان عهدها بالسحق للطيب» [@zawzani، ص69]؛ فحجرها لامع بما علق به من الطيب. والقيد الصغير يزيد الصورة بريقًا ورائحة."
    - title: "تشبيهان بـ«أو»"
      text: "جاء بصورتين يختار السامع أيهما شاء: حجر العروس وحجر الحنظل، وكلاهما أملس لامع."
  connection: "ثم يقول: «كأن دماء الهاديات بنحره»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنَ / سَرَاتَهُو / لَدَلْبَيْ / تِ قَائِمَنْ = فعولُ / مفاعلن / فعولن / مفاعلن — مَدَاكُ / عَرُوسِنْ أَوْ / صَلَايَ / ةُ حَنْظَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر، والأولى والثالثة من العَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "قال شوقي ضيف: «وإذا اعترضك خيّل إليك للمعانه وبريقه أنك تنظر إلى مداك عروس أو صراية حنظل» [@deif، ج1 ص254]."
variants:
  - reading: "كَأَنَّ عَلَى الْكَتِفَيْنِ مِنْهُ إِذَا انْتَحَى"
    status: "رواية أخرى"
    note: "«وانتحى: اعترض» [@ibn-al-anbari، ص90]. وبها يرويه شوقي ضيف [@deif، ج1 ص254]، وعند الزَّوْزَنِيّ: «كأن على المتنين منه» [@zawzani، ص69]."
  - reading: "مَدَاكُ عَرُوسٍ أَوْ صَرَايَةُ حَنْظَلِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«والصراية: الحنظلة التي قد اصفرت... فإذا اصفرت صارت تبرق كأنها قد صقلت» [@ibn-al-anbari، ص90–91]."
