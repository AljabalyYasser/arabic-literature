first: "وَكَشْحٍ لَطِيفٍ كَالْجَدِيلِ مُخَصَّرٍ"
second: "وَسَاقٍ كَأُنْبُوبِ السَّقِيِّ الْمُذَلَّلِ"
meaning: "وتبدي عن خصر ضامر دقيق كزمام من جلد، وعن ساق بيضاء ناعمة كقصبة البَرْدِيّ بين نخل مسقيّ. قال الزَّوْزَنِيّ: «شبه ضمور بطنها بمثل هذا الخطام، وشبه صفاء لون ساقها ببردي بين نخيل تظله أغصانها» [@zawzani، ص55]."
vocabulary:
  - term: "كَشْحٍ"
    text: "«الخصر» [@ibn-al-anbari، ص64]."
  - term: "الْجَدِيلِ"
    text: "«الزمام يتخذ من السيور فيجيء حسنا لينا يتثنى» [@ibn-al-anbari، ص64]. وعند الزَّوْزَنِيّ: «خطام يتخذ من الأدم» [@zawzani، ص55]."
  - term: "مُخَصَّرٍ"
    text: "«الدقيق الوسط» [@zawzani، ص55]."
  - term: "أُنْبُوبِ السَّقِيِّ"
    text: "«الأنبوب: البردى الذي ينبت وسط النخل. والسقي: النخل الذي يسقى» [@ibn-al-anbari، ص64]."
  - term: "الْمُذَلَّلِ"
    text: "النخل «الذي قد عطف ثمره ليجتنى منه»، «فأراد أنه ناعم في كن» [@ibn-al-anbari، ص64]. وقيل: «المذلل له الماء» [@ibn-al-anbari، ص64]."
syntax:
  - "«والكشح نسق على الجيد، واللطيف نعته، والكاف نعت للطيف، والمخصر نعت للكشح» [@ibn-al-anbari، ص65]."
  - "«والساق نسق على الكشح، والكاف نعت للساق، وهي خافضة للأنبوب، والأنبوب مضاف إلى السقي، والمذلل نعت للسقي» [@ibn-al-anbari، ص65]."
morphology:
  - "«السَّقِيّ» فعيل «بمعنى المسقي كالجريح بمعنى المجروح» [@zawzani، ص55]."
  - "«مُخَصَّر» اسم مفعول من «خصّر»، «ومنه نعل مخصرة» [@zawzani، ص55]."
  - "«أُنْبُوب» على «أُفْعُول»، «والجمع الأنابيب» [@zawzani، ص55]."
rhetoric:
  thesis: "بيت بتشبيهين متوازيين: الخصر في الصدر، والساق في العَجُز."
  devices:
    - title: "تشبيهان في بيت"
      text: "الخصر كالجديل في دقته ولينه وتثنيه، والساق كالبردي في بياضه ونعومته. وعند شوقي ضيف: «وأما خصرها فليّن كالزمام، وأما ساقها فكالبردي في بياضه» [@deif، ج1 ص261]."
    - title: "دقة القيد"
      text: "لم يقل «كالبردي» وحسب، بل بردي بين نخل مسقي مذلل؛ «وإنما شرط ذلك ليكون أصفى لونًا وأنقى رونقًا» [@zawzani، ص55]، لأن الظل يحفظ لونه."
    - title: "التوازي"
      text: "الشطران على بناء واحد: اسم، ثم تشبيه، ثم صفة. فالإيقاع يتكرر كما تتكرر الصورة."
  connection: "ثم يقول: «ويضحي فتيت المسك فوق فراشها»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَكَشْحِنْ / لَطِيفِنْ كَلْ / جَدِيلِ / مُخَصْصَرِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — وَسَاقِنْ / كَأُنْبُوبِسْ / سَقِيْيِلْ / مُذَلْلَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "ومثل تشبيه الساق بالبردي قول قيس بن الخَطِيم: «تمشي على برديّتين غذاهما / غدق بساحة حائر يعبوب»، أي على ساقين كأنهما برديتان في بياضهما [@ibn-al-anbari، ص64]."
