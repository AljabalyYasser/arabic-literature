first: "فَيَا لَكَ مِنْ لَيْلٍ كَأَنَّ نُجُومَهُ"
second: "بِكُلِّ مُغَارِ الْفَتْلِ شُدَّتْ بِيَذْبُلِ"
meaning: "يا لك من ليل! كأن نجومه قد شُدّت بكل حبل محكم الفتل إلى جبل يَذْبُل، فهي ثابتة لا تسير. قال يعقوب: «معناه كأن نجومه شدت بيذبل، وهو الجبل» [@ibn-al-anbari، ص79]. وقال الزَّوْزَنِيّ: «إن نجومه لا تزول من أماكنها ولا تغرب... وإنما استطال الليل لمعاناته الهموم ومقاساته الأحزان فيه» [@zawzani، ص61]."
vocabulary:
  - term: "مُغَارِ الْفَتْلِ"
    text: "«المغار: الحبل الشديد الفتل. يقال: أغرت الحبل، إذا شددت فتله» [@ibn-al-anbari، ص79]."
  - term: "شُدَّتْ"
    text: "رُبطت وأُحكم ربطها."
  - term: "يَذْبُلِ"
    text: "جبل [@ibn-al-anbari، ص79] [@deif، ج1 ص253، الحاشية]."
syntax:
  - "«فَيَا لَكَ مِنْ لَيْلٍ»: أسلوب تعجب. «يا» حرف نداء، و«لك» جار ومجرور، و«من ليل» قال فيه ابن الأَنْبارِيّ: «معناه التفسير للتعجب» [@ibn-al-anbari، ص79]، أي أنه تمييز يبيّن ما يُتعجب منه."
  - "«كَأَنَّ نُجُومَهُ»: «النجوم اسم كأن، وخبر كأن شدت» [@ibn-al-anbari، ص79]. و«شُدَّت» فعل ماض مبني للمجهول، ونائب الفاعل ضمير النجوم."
  - "«بِكُلِّ مُغَارِ الْفَتْلِ» و«بِيَذْبُلِ»: جاران ومجروران متعلقان بـ«شُدّت» [@ibn-al-anbari، ص79]. و«يَذْبُل» ممنوع من الصرف للعلمية ووزن الفعل، وجُرّ بالكسرة لضرورة القافية."
morphology:
  - "«مُغَار» اسم مفعول من الرباعي «أغار»: أحكم الفتل [@ibn-al-anbari، ص79]."
  - "«شُدَّت» ماض مبني للمجهول من المضعف «شدّ»."
  - "«يَذْبُل» علم على وزن الفعل المضارع «يَفْعُل»."
rhetoric:
  thesis: "الليل الطويل عنده ليل لا يتحرك: النجوم فيه كأنها مربوطة إلى جبل."
  devices:
    - title: "التشبيه"
      text: "شبّه النجوم في ثباتها بأشياء شُدّت بحبال محكمة إلى جبل، فجعل طول الليل صورة تُرى: النجوم لا تسير، فالصبح لا يأتي."
    - title: "التعجب"
      text: "«فَيَا لَكَ مِنْ لَيْلٍ»: بعد أن خاطب الليل في البيت السابق يتعجب منه، فينتقل من الطلب إلى الانفعال."
    - title: "المبالغة بـ«كل»"
      text: "لم يقل «بحبل»، بل «بكل مغار الفتل»، أي بكل حبل محكم؛ فهي موثقة من كل جهة."
    - title: "معنى تبعه الشعراء"
      text: "قال شوقي ضيف في هذه الصورة: «وقد ردّد الشعراء بعده هذا المعنى طويلا» [@deif، ج1 ص253]."
  connection: "ثم يزيد الصورة بيتًا آخر: «كأن الثريا عُلّقت في مَصامها / بأمراس كتّان إلى صُمّ جَنْدل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَيَا لَ / كَمِنْ لَيْلِنْ / كَأَنْنَ / نُجُومَهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — بِكُلْ لِ / مُغَارِلْ فَتْ / لِشُدْدَتْ / بِيَذْبُلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "قال ابن الأَنْبارِيّ: «لم يرو هذا البيت الأَصْمَعِيّ ورواه يعقوب وغيره» [@ibn-al-anbari، ص79]. وفي رواية الزَّوْزَنِيّ وابن سَلّام يتصل الصدر بعجز البيت التالي: «بأمراس كتّان إلى صم جندل». وذكر ابن سَلّام أنهم خيّروا بين هذا البيت وقول النابغة يخاطب النعمان: «فإنك كالليل الذي هو مدركي»، «فزعم بعض الأشياخ أن بيت النابغة أحكمها» [@ibn-sallam، ج1 ص86–87]."
variants:
  - reading: "فَيَا لَكَ مِنْ لَيْلٍ كَأَنَّ نُجُومَهُ / بِأَمْرَاسِ كَتَّانٍ إِلَى صُمِّ جَنْدَلِ"
    status: "رواية الزَّوْزَنِيّ وابن سَلّام"
    note: "ذكرها ابن الأَنْبارِيّ رواية [@ibn-al-anbari، ص79]، وبها يسقط البيت التالي [@zawzani، ص60] [@ibn-sallam، ج1 ص86]. لكن الزَّوْزَنِيّ نفسه يقول في رواية ابن الأَنْبارِيّ: «وهذا أعرف الروايتين وأسيرهما» [@zawzani، ص61]."
