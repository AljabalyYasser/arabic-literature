first: "فَلَمَّا أَجَزْنَا سَاحَةَ الْحَيِّ وَانْتَحَى"
second: "بِنَا بَطْنُ خَبْتٍ ذِي قِفَافٍ عَقَنْقَلِ"
meaning: "فلما قطعنا فناء الحي وخرجنا من بين البيوت، وصرنا إلى أرض منخفضة بين تلال من الرمل المتراكب. قال الزَّوْزَنِيّ: «فلما خرجنا من مجمع بيوت القبيلة وصرنا إلى مثل هذا الموضع طاب حالنا وراق عيشنا» [@zawzani، ص51]."
vocabulary:
  - term: "أَجَزْنَا"
    text: "«قطعنا، يقال: أجزت الوادي، إذا قطعته وخلفته» [@ibn-al-anbari، ص54]."
  - term: "سَاحَةَ الْحَيِّ"
    text: "الساحة: «فناء الدار» [@ibn-al-anbari، ص54]، والحي: القبيلة [@zawzani، ص50]."
  - term: "انْتَحَى"
    text: "«اعترض» [@ibn-al-anbari، ص54]."
  - term: "خَبْتٍ"
    text: "«بطن من الأرض غامض» [@ibn-al-anbari، ص54]، أي منخفض."
  - term: "قِفَافٍ"
    text: "«جمع قف، وهو ما غلظ من الأرض وارتفع» [@ibn-al-anbari، ص55]."
  - term: "عَقَنْقَلِ"
    text: "«المنعقد الداخل بعضه فوق بعض» [@ibn-al-anbari، ص55]."
syntax:
  - "«فَلَمَّا أَجَزْنَا»: «لمّا» ظرف فيه معنى الشرط، «والساحة منصوبة بأجزنا» [@ibn-al-anbari، ص55]."
  - "«وَانْتَحَى»: فيه خلاف. «وقال أبو عُبَيْدة: وانتحى نسق على أجزنا. وجواب فلما أجزنا (هصرت...)» في البيت التالي. «وقال غيره: وانتحى جواب فلما، والواو مقحمة» [@ibn-al-anbari، ص55]. وعند البصريين لا تُقحم الواو، «والجواب يكون محذوفًا» [@zawzani، ص51]."
  - "«بَطْنُ خَبْتٍ»: فاعل «انتحى». و«عقنقلِ» نعت، «والعقنقل من صفة الخبت لذلك لم يؤنثه» [@zawzani، ص51]."
morphology:
  - "«أَجَزْنَا» من «أجاز» الرباعي، «يقال: أجزت المكان وجزته إذا قطعته إجازة وجوازًا» [@zawzani، ص50]."
  - "«عَقَنْقَل» على «فَعَنْلَل»، «وأصله من العقل وهو الشد» [@zawzani، ص50]."
  - "«سَاحَة» جمعها «الساحات والساح والسوح» [@zawzani، ص50]."
rhetoric:
  thesis: "الخروج من الحي إلى الخلاء: المكان المستتر يُرسم بدقة لأنه مكان الأمان."
  devices:
    - title: "الإسناد إلى المكان"
      text: "«انتحى بنا بطن خبت»: جعل المكان هو الذي اعترض لهما وأخذهما، «والفعل عند التحقيق لهما ولكنه ضرب من الاتساع في الكلام» [@zawzani، ص51]."
    - title: "تكديس الأوصاف"
      text: "«بطن خبت ذي قفاف عقنقل»: منخفض، بين مرتفعات، من رمل متراكب؛ فالأوصاف كلها تقول إن المكان محجوب عن الأعين."
    - title: "الحذف"
      text: "على قول البصريين حُذف جواب «لمّا»، فبقي المعنى معلقًا يتمّه السامع؛ والحذف هنا ستر كما أن المكان ستر."
  connection: "وبعده بيت من الصريح لا نشرحه (30)، ثم يصف صاحبته: «مهفهفة بيضاء غير مفاضة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَلَمْمَا / أَجَزْنَا سَا / حَتَلْ حَيْ / يِ وَنْتَحَى = فعولن / مفاعيلن / فعولن / مفاعلن — بِنَا بَطْ / نُ خَبْتِنْ ذِي / قِفَافِنْ / عَقَنْقَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "قال شوقي ضيف في المشهد: «وكيف أطاعته وخرجت معه من الحي إلى مكان بعيد لا تراهما فيه العيون» [@deif، ج1 ص250–251]. وفي حاشيته: «والواو في وانتحى زائدة لأنها جواب لما» [@deif، ج1 ص250، الحاشية]."
variants:
  - reading: "بِنَا بَطْنُ حِقْفٍ ذِي رُكَامٍ عَقَنْقَلِ"
    status: "رواية أخرى"
    note: "«والحقف: رمل منعرج. وركام: بعضه فوق بعض» [@ibn-al-anbari، ص54]. وبها يرويه شوقي ضيف [@deif، ج1 ص250]."
  - reading: "بِنَا بَطْنُ خَبْتٍ ذِي حِقَافٍ عَقَنْقَلِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "[@zawzani، ص50]."
