first: "فَمِثْلِكِ حُبْلَى قَدْ طَرَقْتُ وَمُرْضِعٍ"
second: "فَأَلْهَيْتُهَا عَنْ ذِي تَمَائِمَ مُحْوِلِ"
meaning: "يقول لصاحبته: رُبَّ امرأة مثلكِ، حاملٍ أو مرضعٍ، أتيتها ليلًا فغلبتها على نفسها حتى شغلتها عن طفلها الذي عُلّقت عليه التمائم وأتمّ عامه الأول. قال الزَّوْزَنِيّ: «فربَّ امرأة حبلى قد أتيتها ليلًا وربّ امرأة ذات رضيع أتيتها ليلًا فشغلتها عن ولدها» [@zawzani، ص44]. وفسّر الأَصْمَعِيّ «طرقت» فقال: «معناه أتيتها فغلبتها على نفسها حتى لهيت عن ولدها» [@ibn-al-anbari، ص40]. فالبيت فخر صريح بأنه كان يغشى النساء ليلًا ولو كنّ حوامل أو مرضعات، وحجته فيه أن هاتين أزهد النساء في الرجال: «وإنما خص الحبلى والمرضع؛ لأنهما أزهد النساء في الرجال وأقلهن شغفًا بهم وحرصًا عليهم، فقال: خدعت مثلهما مع اشتغالهما بأنفسهما فكيف تتخلصين مني؟» [@zawzani، ص44]."
vocabulary:
  - term: "فَمِثْلِكِ"
    text: "أي فرُبَّ امرأة مثلكِ. قال الزَّوْزَنِيّ: «يريد به فرُبَّ امرأة مثل عنيزة في ميله إليها وحبه لها؛ لأن عنيزة في هذا الوقت كانت عذراء غير حبلى ولا مرضع» [@zawzani، ص44]."
  - term: "طَرَقْتُ"
    text: "أتيتُ ليلًا: «ويقال: طرقت الرجل، إذا أتيته ليلا. ولا يكون الطروق إلا بالليل» [@ibn-al-anbari، ص40]."
  - term: "مُرْضِعٍ"
    text: "«التي لها ولد رضيع» [@zawzani، ص43]."
  - term: "فَأَلْهَيْتُهَا"
    text: "شغلتها، «وألهيته إلهاء إذا شغلته» [@zawzani، ص44]."
  - term: "تَمَائِمَ"
    text: "قال أبو عُبَيْدة: «التمائم: العوذ، واحدتها تميمة» [@ibn-al-anbari، ص40]، وهي ما يُعلَّق على الصبي يُتّقى به الأذى."
  - term: "مُحْوِلِ"
    text: "قال أبو عَمْرو: «المحول: الذي قد أتى عليه حول» [@ibn-al-anbari، ص41]، والحَوْل: السنة."
syntax:
  - "«فَمِثْلِكِ»: «مخفوضة بإضمار رب، كأنه قال: فرب مثلك» [@ibn-al-anbari، ص39]. والفاء تعطف الكلام على ما قبله، فهو ما زال يخاطبها بعد قولها «فانزل»."
  - "«حُبْلَى»: «خفض على الاتباع لمثل، لأن مثلا تأويلها تأويل النكرة ولفظها لفظ المعرفة» [@ibn-al-anbari، ص39]. يريد أن «مثلك» مضاف إلى معرفة في لفظه، لكنه نكرة في معناه، فتبعته النكرة."
  - "«قَدْ طَرَقْتُ»: جملة صفة لـ«حبلى»، والعائد محذوف، «كأنك قلت: قد طرقتها» [@ibn-al-anbari، ص39]."
  - "«وَمُرْضِعٍ»: «مخفوضة على النسق على الحبلى» [@ibn-al-anbari، ص39]، أي معطوفة عليها. وأجاز ابن الأَنْبارِيّ نصبها، ثم قال: «ولم يرو النصب أحد» [@ibn-al-anbari، ص40]."
  - "«فَأَلْهَيْتُهَا»: معطوف على «طرقت»، والهاء للمرضع. و«عَنْ ذِي تَمَائِمَ» على حذف الموصوف: «ألهيتها عن صبي ذي تمائم» [@ibn-al-anbari، ص40]. و«تَمَائِمَ» ممنوع من الصرف لأنه على صيغة منتهى الجموع، فجُرّ بالفتحة، و«مُحْوِلِ» نعت لـ«ذي»."
morphology:
  - "«مُرْضِع» وصف للمؤنث بلا تاء. قال الزَّوْزَنِيّ: «إذا بنيت على الفعل أنثت فقيل: أرضعت فهي مرضعة، وإذا حملوها على أنها بمعنى ذات إرضاع أو ذات رضيع لم تلحقها تاء التأنيث، ومثلها حائض وطالق وحامل» [@zawzani، ص43]. وفي اللسان عن ابن بَرِّيّ: «أما مرضع فهو على النسب أي ذات رضيع» [@lisan، ج8 ص127]."
  - "«حُبْلَى» على «فُعْلَى»، وألفها ألف التأنيث المقصورة."
  - "«مُحْوِل» اسم فاعل من «أَحْوَلَ»: «يقال: أحول الصبي إذا تم له حول فهو محول» [@zawzani، ص44]."
  - "«تَمَائِم» جمع «تَمِيمة» على «فَعائِل»."
rhetoric:
  thesis: "أول بيت في المعلقة يصرّح فيه بالفجور، وهو حجة يسوقها إلى صاحبته: من غلب الحامل والمرضع على أنفسهما فلن تمتنع منه عذراء. ولذلك صار البيت شاهد النقاد على «تعهّره»، أي إذاعته فجوره في شعره: عابه قوم بفحش معناه، ودافع عنه آخرون بأن المبالغة فيه مقصودة."
  devices:
    - title: "المبالغة في اختيار المثال"
      text: "خصّ «حُبْلَى» و«مُرْضِعٍ» لأنهما أشد النساء انشغالًا عن الرجال. والمبالغة عند أبي هلال العَسْكَرِيّ «أن تبلغ بالمعنى أقصى غاياته، وأبعد نهاياته»، وقد أورد البيت مثالًا لها بعد آية المرضعة التي تذهل عما أرضعت، وقال إن امرأ القَيْس ذكر المرضع «لما أراد المبالغة فى وصف محبّة المرأة له» [@sinaatayn، ص365]. وبهذا دافع عنه ابن قُتَيْبة: «لأن المرضع والحبلى لا تريدان الرجال ولا ترغبان فى النكاح. فإذا أصباهما وألهاهما كان لغيرهما أشدّ إصباء وإلهاء» [@ibn-qutayba، ج1 ص135]. وأصباهما: جعلهما تصبوان إليه، أي تميلان."
    - title: "الكناية"
      text: "لم يسمّ الفعل، بل ذكر طرفيه: «طَرَقْتُ»، وهو المجيء ليلًا، و«فَأَلْهَيْتُهَا»، وهو أثره فيها، فدلّ بهما على ما بينهما. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» فيومئ به إليه [@dalail، ص66]. فنسيان المرضع طفلها تالٍ لما كان بينهما ورِدْفٌ له."
    - title: "الاحتجاج على المخاطَبة"
      text: "«فَمِثْلِكِ» تجعل صاحبته طرفًا في الحجة: إن كانت الحامل والمرضع لم تمتنعا، «فكيف تتخلصين مني؟» كما صاغها الزَّوْزَنِيّ [@zawzani، ص44]. فالبيت ليس قصة تُروى لذاتها، بل ردّ على قولها في البيت 14 «عقرت بعيري يا امرأ القيس فانزل»."
  connection: "ثم يكمل الصورة في البيت التالي بما هو أصرح: «إذا ما بكى من خلفها انصرفت له»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَمِثْلِ / كِ حُبْلَى قَدْ / طَرَقْتُ / وَمُرْضِعِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — فَأَلْهَيْ / تُهَا عَنْ ذِي / تَمَائِ / مَ مُحْوِلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلتين الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "يأتي بعد الحوار على ظهر البعير (13–15): قالت «فانزل»، فقال «سيري وأرخي زمامه». ثم يحتج عليها بهذا البيت وتاليه. وهو أول ما استشهد به ابن سَلّام حين ذكر من الشعراء من «كان ينعى على نفسه ويتعهر» [@ibn-sallam، ج1 ص41–42]، أي يذيع فجوره ولا يستره، ونقل ابن قُتَيْبة كلامه بلفظ «كان امرؤ القيس ممن يتعهر في شعره»، ثم أنشد هذا البيت [@ibn-qutayba، ج1 ص111]. وجمع المَرْزُبانيّ ما عابه النقاد فيه، فقال: «وعيب أيضا على امرئ القيس فجوره وعهره فى شعره»، وأورد البيتين، ثم: «وقالوا: هذا معنى فاحش» [@muwashshah، ص34]. وعابه آخرون من جهة أخرى: «فقالوا: كيف قصد للحبلى والمرضع دون البكر وهو ملك وابن ملوك؟ ما فعل هذا إلا لنقص همته» [@muwashshah، ص35]. أما ابن قُتَيْبة فأورد البيتين فيما يعاب عليه، ثم قال: «وليس هذا عندى عيبا» [@ibn-qutayba، ج1 ص135]. ويقول شوقي ضَيْف في المقطع كله: «وفي أثناء ذلك يتعهر ولا يتستر، فيقول لعنيزة بيته المشهور»، ثم ينشد هذا البيت [@deif، ج1 ص249]."
