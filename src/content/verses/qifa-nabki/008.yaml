first: "إِذَا قَامَتَا تَضَوَّعَ الْمِسْكُ مِنْهُمَا"
second: "نَسِيمَ الصَّبَا جَاءَتْ بِرَيَّا الْقَرَنْفُلِ"
meaning: "إذا قامت المرأتان انتشرت منهما رائحة المسك، كما ينتشر نسيم الصَّبا حاملًا رائحة القَرَنْفُل. قال الزَّوْزَنِيّ: «إذا قامت أم الحُوَيْرِث وأم الرَّباب فاحت ريح المسك منهما كنسيم الصبا إذا جاءت بعرف القرنفل ونشره» [@zawzani، ص39]. والعَرْف والنَّشْر: الرائحة الطيبة."
vocabulary:
  - term: "قَامَتَا"
    text: "الضمير لأم الحُوَيْرِث وأم الرَّباب في البيت السابق [@ibn-al-anbari، ص29]."
  - term: "تَضَوَّعَ"
    text: "«ضاع الطيب وتضوّع إذا انتشرت رائحته» [@zawzani، ص39]."
  - term: "نَسِيمَ الصَّبَا"
    text: "الصَّبا: الريح الشرقية، و«نسيم الصبا: تنسّمها، وهو هبوبها بضعف» [@ibn-al-anbari، ص30]."
  - term: "رَيَّا"
    text: "«ريح القرنفل ولا تكون الريا إلا ريحا طيبة» [@ibn-al-anbari، ص30]."
syntax:
  - "«إِذَا قَامَتَا»: «إذا» ظرف فيه معنى الشرط، و«تضوّع جواب إذا» [@ibn-al-anbari، ص29]. «والمسك مرفوع بتضوع» [@ibn-al-anbari، ص30]، أي فاعل."
  - "«نَسِيمَ الصَّبَا»: «والنسيم منصوب على المصدر»، أي مفعول مطلق، والتقدير: تضوّعًا مثل نسيم الصبا [@ibn-al-anbari، ص30]."
  - "«جَاءَتْ بِرَيَّا الْقَرَنْفُلِ»: جملة صفة للصبا. قال ابن الأَنْبارِيّ: «وإنما جاز للصبا أن توصل لأن هبوبها يختلف فيصير بمنزلة المجهول، فيوصل كما يوصل الذي»، أي أن «الصبا» وإن كان معرفة بالألف واللام فهو في معنى النكرة، فوُصف بالجملة [@ibn-al-anbari، ص30]."
morphology:
  - "«تَضَوَّع» على «تفعّل»، «من ضاع يضُوع» [@ibn-al-anbari، ص29]."
  - "«الْمِسْك» يذكّر، «فإذا أنث فإنما يذهب إلى الريح» عند الفَرّاء، «وقال غيره: المسك والعنبر يذكران ويؤنثان» [@ibn-al-anbari، ص30]."
  - "«رَيَّا» على «فَعْلى» من الريح الطيبة."
rhetoric:
  thesis: "يصف المرأتين بالرائحة لا بالصورة: حضورهما عطر يملأ المكان."
  devices:
    - title: "التشبيه"
      text: "«شبه طيب رياهما بطيب نسيم هبّ على قرنفل وأتى بريّاه» [@zawzani، ص39]. فالمشبه به رائحة تحملها ريح، والرائحة مع الحركة أبلغ في الانتشار."
    - title: "اختيار الصَّبا"
      text: "الصَّبا ريح لينة يحبها العرب ويذكرونها في الحنين، و«نسيمها» هبوبها الضعيف؛ فالرائحة تأتي رقيقة لا عاصفة."
    - title: "تمهيد للبكاء"
      text: "«ثم لما وصفهما بالجمال وطيب النشر وصف حاله بعد بعدهما» [@zawzani، ص39]؛ فالبيت يرفع الذكرى إلى غايتها قبل أن يسقط في الدموع."
  connection: "ثم يقول: «ففاضت دموع العين مني صبابة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "إِذَا قَا / مَتَا تَضَوْ / وَعَلْ مِسْ / كُ مِنْهُمَا = فعولن / مفاعلن / فعولن / مفاعلن — نَسِيمَصْ / صَبَا جَاءَتْ / بِرَيْيَلْ / قَرَنْفُلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]. وجاء العَجُز تامًّا."
context: "البيت بين ذكر المرأتين (7) والبكاء عليهما (9)، فهو وصفهما الوحيد في القصيدة."
variants:
  - reading: "إِذَا الْتَفَتَتْ نَحْوِي تَضَوَّعَ رِيحُهَا"
    status: "رواية أخرى"
    note: "[@ibn-al-anbari، ص30]. وبها يرويه شوقي ضيف في موضع آخر من القصيدة، في مغامرة بيضة الخدر [@deif، ج1 ص250]."
