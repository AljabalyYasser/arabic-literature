first: "كَأَنَّ ذُرَى رَأْسِ الْمُجَيْمِرِ غُدْوَةً"
second: "مِنَ السَّيْلِ وَالْغُثَّاءِ فَلْكَةُ مِغْزَلِ"
meaning: "كأن رأس أكمة المُجَيمر صباحًا، وقد أحاط بها السيل وما يحمله من حطام، فَلْكة مغزل. قال ابن الأَنْبارِيّ: «شبه قليعة المجيمر وقد علاها الماء والغثاء فما يستبين إلا رأسها، بفلكة» [@ibn-al-anbari، ص108]."
vocabulary:
  - term: "ذُرَى"
    text: "جمع ذروة، وهي «أعلى الشيء» [@zawzani، ص76]."
  - term: "الْمُجَيْمِرِ"
    text: "«أرض لبني فزارة» [@ibn-al-anbari، ص108]، وعند الزَّوْزَنِيّ: «أكمة بعينها» [@zawzani، ص76]."
  - term: "الْغُثَّاءِ"
    text: "«حميلة السيل، وهو ما يجيء فوق الماء» [@ibn-al-anbari، ص108]، من «الحشيش والشجر والكلأ والتراب» [@zawzani، ص76]."
  - term: "فَلْكَةُ مِغْزَلِ"
    text: "فلكة المغزل: «ما استدار فوق رأسه» [@deif، ج1 ص255، الحاشية]. والمغزل: الآلة التي يُغزل بها الصوف."
syntax:
  - "«والذرى اسم كأن، وغدوة منصوبة على الوقت، والفلكة خبر كأن» [@ibn-al-anbari، ص108]."
  - "«مِنَ السَّيْلِ»: جار ومجرور متعلق بما يدل عليه الكلام، أي: مما أحاط بها من السيل."
morphology:
  - "«الْغُثَّاء» بالتشديد، «ورواه الفَرّاء: من السيل والأغثاء. فالأغثاء: جمع الغثاء» [@ibn-al-anbari، ص108]."
  - "«مِغْزَل» اسم آلة، «وفي المغزل ثلاث لغات: المُغْزل والمِغَزل والمَغَزل» [@ibn-al-anbari، ص108]."
  - "«ذُرًى» جمع «ذِروة» على «فُعَل»."
rhetoric:
  thesis: "أكمة كاملة تصير رأس مغزل: السيل يصغّر كل ما حوله."
  devices:
    - title: "التشبيه بالهيئة"
      text: "«شبه استدارة هذه الأكمة بما حاط بها من الأغثاء باستدارة فلكة المغزل وإحاطتها بها بإحاطة المغزل» [@zawzani، ص76]. فالصورة شكل: رأس مستدير وسط شيء يلتف حوله."
    - title: "تصغير الكبير"
      text: "شبّه جبلًا بقطعة صغيرة من أداة منزلية؛ فالسيل عظيم حتى صار الجبل فيه صغيرًا."
    - title: "صورة من البيت"
      text: "المغزل أداة النساء في الخيام. وقد مرّ بنا في وصف الفرس «مداك عروس»؛ فالشاعر يأخذ صوره من البيت كما يأخذها من الصحراء."
  connection: "ثم يقول: «وألقى بصحراء الغبيط بعاعه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنَ / ذُرَى رَأْسِلْ / مُجَيْمِ / رِ غُدْوَتَنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — مِنَسْ سَيْ / لِ وَلْغُثْثَا / ءِ فَلْكَ / ةُ مِغْزَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والثالثة من العَجُز [@atiq، ص29]."
context: "روى ابن حبيب البيت «وكأنّ قُليعة المجيمر»، «وكذلك ما بعده إلى آخرها، وبجعله مخزوما: وكأنّ وكأنّ» [@ibn-al-anbari، ص108]. والخَزْم زيادة حرف أو أكثر في أول البيت لا يُحسب في الوزن. وكان ابن كَيْسان ينشد هذه الأبيات بالواو، «ليكون الكلام نسقا بعضه على بعض» [@ibn-rashiq، ج1 ص143]."
variants:
  - reading: "كَأَنَّ طَمِيَّةَ الْمُجَيْمِرِ غُدْوَةً"
    status: "رواية الأَصْمَعِيّ"
    note: "«وطمية: جبل في بلادهم» [@ibn-al-anbari، ص108]. وبها يرويه شوقي ضيف [@deif، ج1 ص255]."
  - reading: "مِنَ السَّيْلِ وَالْأَغْثَاءِ فَلْكَةُ مِغْزَلِ"
    status: "رواية الفَرّاء"
    note: "[@ibn-al-anbari، ص108] [@zawzani، ص76]."
