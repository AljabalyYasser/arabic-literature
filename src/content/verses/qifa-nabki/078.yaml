first: "كَأَنَّ ثَبِيرًا فِي عَرَانِينِ وَبْلِهِ"
second: "كَبِيرُ أُنَاسٍ فِي بِجَادٍ مُزَمَّلِ"
meaning: "كأن جبل ثَبِير، وقد نزلت عليه أوائل المطر الغزير، شيخ كبير من الناس التفّ بكساء مخطط. قال الزَّوْزَنِيّ: «شبه تغطيته بالغثاء بتغطي هذا الرجل بالكساء» [@zawzani، ص76]."
vocabulary:
  - term: "ثَبِيرًا"
    text: "«جبل بمكة» [@ibn-al-anbari، ص106]."
  - term: "عَرَانِينِ"
    text: "«عرانينه: أوائله» [@ibn-al-anbari، ص106]. والعرنين في الأصل الأنف، «ثم استعار العرانين لأوائل المطر؛ لأن الأنوف تتقدم الوجوه» [@zawzani، ص76]."
  - term: "وَبْلِهِ"
    text: "«الوبل: جمع وابل وهو المطر الغزير العظيم القطر» [@zawzani، ص76]."
  - term: "بِجَادٍ"
    text: "«كساء من أكسية الأعراب من وبر الإبل وصوف الغنم مخططة» [@ibn-al-anbari، ص107]."
  - term: "مُزَمَّلِ"
    text: "«ملتف» [@ibn-al-anbari، ص107]."
syntax:
  - "«كَأَنَّ ثَبِيرًا»: «ثبير اسم كأن، وفي حال لثبير»، و«كبير» خبر كأن [@ibn-al-anbari، ص107]."
  - "«مُزَمَّلِ»: هو في المعنى نعت لـ«كبير»، وحقه الرفع، لكنه جُرّ لمجاورته «بجاد». قال ابن الأَنْبارِيّ: «أجراه على أعراب البجاد للمجاورة، كما تقول العرب: هذا جحر ضب خرب، يخفضون خربا على المجاورة للضب وهو في المعنى نعت للجحر» [@ibn-al-anbari، ص107]. ومثله عند الزَّوْزَنِيّ [@zawzani، ص76]."
morphology:
  - "«عَرَانِين» جمع «عِرْنين» على «فعاليل»."
  - "«وَبْل» جمع «وابل»، «ومثله شارب وشَرْب وراكب ورَكْب... والوبل أيضًا مصدر» [@zawzani، ص76]."
  - "«مُزَمَّل» اسم مفعول من «زمّل»، و«التزميل: التلفيف بالثياب» [@zawzani، ص76]."
rhetoric:
  thesis: "يجعل الجبل شيخًا وقورًا ملتفًّا بكسائه وسط العاصفة."
  devices:
    - title: "التشبيه بالهيئة"
      text: "لم يشبّه الجبل بالشيخ في الحجم، بل في الهيئة: «شبه الجبل وقد غطاه الماء والغثاء الذي أحاط به إلا رأسه، بشيخ في كساء مخطط؛ وذلك أن رأس الجبل يضرب إلى السواد والماء حوله أبيض» [@ibn-al-anbari، ص107]."
    - title: "لماذا الشيخ؟"
      text: "اختار «كبير أناس» «لأن الكبير أبدا متدثر» [@ibn-al-anbari، ص107]؛ فالتفاف الشيخ بكسائه هيئة يعرفها السامع."
    - title: "الاستعارة في «عرانين وبله»"
      text: "العرانين الأنوف، فجعل للمطر أنوفًا هي أوائله، لأن الأنف أول الوجه [@zawzani، ص76]. وهذا من الضرب الذي تجعل فيه للشيء عضوًا ليس له."
  connection: "ثم يصف أكمة أخرى: «كأن ذرى رأس المجيمر غدوة / من السيل والغثاء فلكة مغزل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنَ / ثَبِيرَنْ فِي / عَرَانِي / نِ وَبْلِهِي = فعولُ / مفاعيلن / فعولن / مفاعلن — كَبِيرُ / أُنَاسِنْ فِي / بِجَادِنْ / مُزَمْمَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الشطرين [@atiq، ص29]."
context: "في هذا البيت مسألة من القافية. رواه الأَصْمَعِيّ «كأن أبانا في أفانين ودقه» [@ibn-al-anbari، ص106–107]، وبروايته يقرؤه شوقي ضيف، ثم يقول: لو ضُمّت لام «مزمّل»، «وهو ما يقتضيه القياس النحوي لأنها صفة لكلمة كبير أناس المرفوعة، أصبح في هذا البيت هو الآخر إقواء، إذ اختلفت حركة الرَّوِيّ» [@deif، ج1 ص265]. والإِقْواء اختلاف حركة الرَّوِيّ بين الأبيات. أما ابن الأَنْبارِيّ والزَّوْزَنِيّ فيحملان الكسرة على الجر بالمجاورة، فلا إقواء عندهما."
variants:
  - reading: "كَأَنَّ أَبَانًا فِي أَفَانِينِ وَدْقِهِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«وقال: هما أبانان: جبل أبيض وجبل أسود... وأفانين: ضروب. والودق: المطر» [@ibn-al-anbari، ص106–107]."
