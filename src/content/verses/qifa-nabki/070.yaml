first: "فَبَاتَ عَلَيْهِ سَرْجُهُ وَلِجَامُهُ"
second: "وَبَاتَ بِعَيْنِي قَائِمًا غَيْرَ مُرْسَلِ"
meaning: "فبات الفرس مسرجًا ملجمًا، قائمًا حيث أراه، لم أرسله إلى المرعى. قال ابن الأَنْبارِيّ: «يقول: بات متهيئا ليرسل في وجه الصبح» [@ibn-al-anbari، ص99]. وقال الزَّوْزَنِيّ: «بات مسرجًا ملجمًا قائمًا بين يدي غير مرسل إلى المرعى» [@zawzani، ص72]."
vocabulary:
  - term: "بَاتَ"
    text: "قضى الليل."
  - term: "بِعَيْنِي"
    text: "«معناه بحيث أراه» [@ibn-al-anbari، ص99]."
  - term: "غَيْرَ مُرْسَلِ"
    text: "«معناه يعلف وهو غير مهمل» [@ibn-al-anbari، ص99]، أي لم يُطلق إلى المرعى."
syntax:
  - "«والسرج يرتفع ببات، واللجام نسق، وعلى صلة بات وهي خبره» [@ibn-al-anbari، ص99]؛ أي «عليه» خبر «بات» مقدم، و«سرجه» اسمها."
  - "«وبات الثاني نسق على بات الأول، والباء صلة بات وهي خبره، وقائما منصوب على الحال، وغير مرسل نعت» [@ibn-al-anbari، ص99]. واسم «بات» الثانية ضمير الفرس."
morphology:
  - "«بات» أجوف، مضارعه «يبيت»."
  - "«مُرْسَل» اسم مفعول من «أرسل»."
  - "«لِجَام» على «فِعال»، وهو من أوزان الآلة."
rhetoric:
  thesis: "فرس مستعد دائمًا: ينتهي يوم الصيد، وهو جاهز ليوم آخر."
  devices:
    - title: "الكناية"
      text: "بقاء السرج واللجام عليه كناية عن الاستعداد للغدو، «كأنه أراد الغدو فكأنه معد لذلك» [@ibn-al-anbari، ص99]. وقيل: «لأنهم مسافرون لا ينزعونه عنه» [@ibn-al-anbari، ص99]."
    - title: "تكرار «بات»"
      text: "بدأ الشطرين بـ«بات»: الأول لما على الفرس، والثاني لمكانه من صاحبه. فالبيت صورتان لليلة واحدة."
    - title: "«بعيني»"
      text: "لا يغيب الفرس عن نظره؛ وفي ذلك عناية الفارس بفرسه وحرصه عليه."
  connection: "وبه ينتهي وصف الفرس والصيد، ثم يرى برقًا: «أصاح ترى برقا أريك وميضه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَبَاتَ / عَلَيْهِ سَرْ / جُهُو وَ / لِجَامُهُو = فعولُ / مفاعلن / فعولُ / مفاعلن — وَبَاتَ / بِعَيْنِي قَا / ئِمَنْ غَيْ / رَ مُرْسَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "هاء «سرجُه» تُشبع فتُنطق «سَرْجُهُو». دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الصدر فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "بدأ هذا القسم بقوله «وقد أغتدي والطير في وكناتها» (53)، أي بخروج في أول الصباح، وينتهي هنا بفرس بائت على سرجه ينتظر صباحًا آخر."
