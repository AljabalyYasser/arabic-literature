first: "تَرَى بَعَرَ الْآرَامِ فِي عَرَصَاتِهَا"
second: "وَقِيعَانِهَا كَأَنَّهُ حَبُّ فُلْفُلِ"
meaning: "صارت الديار بعد أهلها مسكنًا للظباء؛ ترى بعرها منثورًا في ساحاتها وأرضها المنخفضة، كأنه حب الفلفل."
vocabulary:
  - term: "الْآرَامِ"
    text: "الظباء البيض، واحدها رِئْم [@ibn-al-anbari، ص23]."
  - term: "عَرَصَاتِهَا"
    text: "ساحاتها، واحدتها عَرْصة [@ibn-al-anbari، ص23]."
  - term: "قِيعَانِهَا"
    text: "جمع قاع، وهو الموضع يستنقع فيه الماء [@ibn-al-anbari، ص23]."
syntax:
  - "«تَرَى» فعل مضارع، والخطاب لكل من يقف بهذه الديار، لا لمخاطب بعينه."
  - "«بَعَرَ الْآرَامِ» مفعول به، و«في عرصاتها وقيعانها» متعلق بـ«تَرَى»."
  - "«كَأَنَّهُ حَبُّ فُلْفُلِ» جملة حالية، والضمير في «كَأَنَّهُ» يعود على البعر."
morphology:
  - "«الْآرَامِ» جمع «رِئْم»، ويرويها ابن الأَنْبارِيّ «الأَرْآم» [@ibn-al-anbari، ص23]."
  - "«عرصات» جمع «عَرْصة» جمع مؤنث سالمًا، و«قيعان» جمع «قاع» جمع تكسير [@ibn-al-anbari، ص23]."
  - "«فُلْفُلِ» بضم الفاءين."
rhetoric:
  thesis: "صورة الخراب هنا صغيرة وحسية: لا يقول «خلت الديار»، بل يُريك أثر الظباء حيث كان الناس."
  devices:
    - title: "الدلالة بالأثر"
      text: "بعر الظباء في الساحات يعني أن الوحش أمنت المكان بعد أهله؛ فالبيت يقول «خلت الديار» دون أن يقولها."
    - title: "التشبيه"
      text: "شبّه البعر بحب الفلفل في سواده وصغره وتناثره؛ تشبيه من المحسوس القريب يراه كل أحد."
  connection: "ثم يعود بالذاكرة إلى يوم الرحيل نفسه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "تَرَى بَ / عَرَلْ ءَارَا / مِ فِي عَ / رَصَاتِهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَقِيعَا / نِهَا كَأَنْ / نَهُو حَبْ / بُ فُلْفُلِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "هاء «كَأَنَّهُ» تُشبع فتُنطق «كأنّهو» ليستقيم الوزن. ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]، و«مفاعيلن» في التفعيلة الثانية من العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "صورة الخراب هنا صغيرة ودقيقة: لا ناس في الديار، بل ظباء، وأثرها حبات سوداء متناثرة. وهذا البيت مختلف فيه: رواه أبو عُبَيْدة، وقال الأَصْمَعِيّ: «هو منحول لا يعرف»، وذكر أن الأعراب يروونه في القصيدة [@ibn-al-anbari، ص23]."
variants:
  - reading: "البيت كله"
    status: "مختلف فيه"
    note: "رواه أبو عُبَيْدة، وعدّه الأَصْمَعِيّ منحولًا [@ibn-al-anbari، ص23]."
