first: "تَرَى بَعَرَ الْآرَامِ فِي عَرَصَاتِهَا"
second: "وَقِيعَانِهَا كَأَنَّهُ حَبُّ فُلْفُلِ"
level: "basic"
meaning: "صارت الديار بعد أهلها مسكنًا للظباء؛ ترى بعرها منثورًا في ساحاتها وأرضها المنخفضة، كأنه حب الفلفل."
vocabulary:
  - term: "الْآرَامِ"
    text: "الظباء البيض، واحدها رِئْم [@ibn-al-anbari، ص23]."
  - term: "عَرَصَاتِهَا"
    text: "ساحاتها، واحدتها عَرْصة [@ibn-al-anbari، ص23]."
  - term: "قِيعَانِهَا"
    text: "جمع قاع، وهو الموضع يستنقع فيه الماء [@ibn-al-anbari، ص23]."
context: "صورة الخراب هنا صغيرة ودقيقة: لا ناس في الديار، بل ظباء، وأثرها حبات سوداء متناثرة. وهذا البيت مختلف فيه: رواه أبو عُبَيْدة، وقال الأَصْمَعِيّ: «هو منحول لا يعرف»، وذكر أن الأعراب يروونه في القصيدة [@ibn-al-anbari، ص23]."
variants:
  - reading: "البيت كله"
    status: "مختلف فيه"
    note: "رواه أبو عُبَيْدة، وعدّه الأَصْمَعِيّ منحولًا [@ibn-al-anbari، ص23]."
