first: "وَبَيْضَةِ خِدْرٍ لَا يُرَامُ خِبَاؤُهَا"
second: "تَمَتَّعْتُ مِنْ لَهْوٍ بِهَا غَيْرَ مُعْجَلِ"
meaning: "ورُبّ امرأة مصونة في خدرها كأنها بيضة، لا يجرؤ أحد على طلب خيمتها، لهوت بها على مهل. قال ابن الأَنْبارِيّ: «رب امرأة كأنها بيضة في خدرها، شبهها بها لصفائها ورقتها»، و«لا يرام خباؤها معناه لعزها لا يتعرض لخبائها» [@ibn-al-anbari، ص48]."
vocabulary:
  - term: "بَيْضَةِ خِدْرٍ"
    text: "امرأة ملازمة خدرها، شُبّهت بالبيضة؛ «لأنها مخدرة مصونة مكنونة لا تبرز للشمس، ولا تظهر للناس» [@ibn-al-anbari، ص48]."
  - term: "لَا يُرَامُ"
    text: "لا يُطلب؛ «الرَّوم: الطلب» [@zawzani، ص48]."
  - term: "خِبَاؤُهَا"
    text: "«الخباء: ما كان على عمودين أو ثلاثة» [@ibn-al-anbari، ص48]، أي الخيمة الصغيرة."
  - term: "غَيْرَ مُعْجَلِ"
    text: "«على تمهل وتمكث، لم أعجل ولم أعر» [@ibn-al-anbari، ص48]. «ويقال معنى قوله: غير معجل غير خائف» [@ibn-al-anbari، ص48]."
syntax:
  - "«وَبَيْضَةِ»: الواو واو رُبّ، و«بيضةِ» مجرورة بها، ومعناه «رب بيضة خدر» [@ibn-al-anbari، ص48]."
  - "«لَا يُرَامُ خِبَاؤُهَا»: جملة صفة لـ«بيضة»، «والخباء اسم ما لم يسم فاعله» [@ibn-al-anbari، ص48]، أي نائب فاعل."
  - "«غَيْرَ مُعْجَلِ»: «منصوب على الحال من التاء» [@ibn-al-anbari، ص48]. «وغير يروى بالنصب والجر فالجر على صفة لهو، والنصب على الحال من التاء في تمتعت» [@zawzani، ص48]."
morphology:
  - "«يُرَام» مضارع مبني للمجهول من «رام يروم»، أجوف واوي."
  - "«خِبَاء» على «فِعال»، «والجمع الأخبية» [@zawzani، ص48]."
  - "«مُعْجَل» اسم مفعول من «أعجل»."
rhetoric:
  thesis: "يرفع المغامرة بأن يرفع صاحبتها: امرأة لا يُقترب من خيمتها."
  devices:
    - title: "الاستعارة"
      text: "سمّاها «بيضة» ولم يقل «كالبيضة»، فهي استعارة. قال ابن رَشِيق إن امرأ القَيْس استعار البيضة للخدر، «وكلاهما يعني المرأة» [@ibn-rashiq، ج1 ص272]."
    - title: "وجوه الشبه"
      text: "ذكر الزَّوْزَنِيّ ثلاثة وجوه يُشبَّه بها النساء بالبيض: السلامة والصحة، والصيانة والستر «لأن الطائر يصون بيضه ويحضنه»، وصفاء اللون ونقاؤه [@zawzani، ص47]."
    - title: "الكناية عن العزة"
      text: "«لا يرام خباؤها»: لم يقل إن أهلها أقوياء، بل إن أحدًا لا يطلب خيمتها. فالعزة تُعرف بأثرها."
  connection: "ثم يروي كيف وصل إليها: «تجاوزت أحراسًا إليها ومعشرًا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَبَيْضَ / ةِ خِدْرِنْ لَا / يُرَامُ / خِبَاؤُهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — تَمَتْتَعْ / تُ مِنْ لَهْوِنْ / بِهَا غَيْ / رَ مُعْجَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "يقول شوقي ضيف إنه «ما يلبث أن يرجع إلى استثارة فاطمة بمغامرة جريئة له مع من كنى عنها ببيضة خدر لا يرام خباؤها» [@deif، ج1 ص250]. وفي الحاشية: «شبه صاحبته بالبيضة لبياضها ورقتها» [@deif، ج1 ص250]."
variants:
  - reading: "تَمَتَّعْتُ مِنْ لَهْوٍ بِهَا غَيْرِ مُعْجَلِ"
    status: "بالجر"
    note: "على أنه صفة للهو [@zawzani، ص48]."
