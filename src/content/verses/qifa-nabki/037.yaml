first: "وَيُضْحِي فَتِيتُ الْمِسْكِ فَوْقَ فِرَاشِهَا"
second: "نَؤُومُ الضُّحَى لَمْ تَنْتَطِقْ عَنْ تَفَضُّلِ"
meaning: "يبقى فتات المسك على فراشها إلى الضحى، وهي تنام إلى الضحى، ولا تشد وسطها بنطاق للعمل. قال الزَّوْزَنِيّ: «يريد أنها مخدومة منعَّمة تُخدَم ولا تَخدُم» [@zawzani، ص56]."
vocabulary:
  - term: "يُضْحِي"
    text: "يبقى إلى الضحى [@ibn-al-anbari، ص65]."
  - term: "فَتِيتُ الْمِسْكِ"
    text: "«ما يُفتّ منه» [@ibn-al-anbari، ص65]، أي دقاقه."
  - term: "نَؤُومُ"
    text: "كثيرة النوم."
  - term: "لَمْ تَنْتَطِقْ"
    text: "«والانتطاق: الائتزار للعمل، والنطاق: ثوب تشده المرأة على وسطها للمهنة والعمل» [@ibn-al-anbari، ص66]."
  - term: "تَفَضُّلِ"
    text: "«لبس الفُضلة، وهي ثوب واحد يلبس للخفة» [@zawzani، ص56]."
syntax:
  - "«وَيُضْحِي»: فعل ناقص من أخوات «كان» بمعنى: يصير في الضحى. و«فَتِيتُ» اسمه، و«الْمِسْكِ» مضاف إليه، و«فَوْقَ فِرَاشِهَا» ظرف متعلق بمحذوف خبره [@ibn-al-anbari، ص66]."
  - "«نَؤُومُ الضُّحَى»: خبر لمبتدأ محذوف تقديره «هي»، رُفع على المدح، «ويجوز نؤومًا بالنصب على المدح أيضًا، كأنك قلت: أذكر نؤوم الضحى» [@ibn-al-anbari، ص66]."
  - "«لَمْ تَنْتَطِقْ»: مضارع مجزوم بـ«لم». و«عَنْ تَفَضُّلِ» متعلق به، و«عن» بمعنى «بعد»: «لم تنتطق بعد تفضل» [@zawzani، ص56]، كقول العجاج: «ومنهل وردته عن منهل»، أي بعد منهل [@ibn-al-anbari، ص66]."
morphology:
  - "«نَؤُوم» صيغة مبالغة على «فَعُول»، يستوي فيها المذكر والمؤنث [@zawzani، ص56]. «ونؤوم يُهمز ولا يُهمز» [@ibn-al-anbari، ص66]."
  - "«تَنْتَطِق» على «تَفْتَعِل» من النطاق."
  - "«تَفَضُّل» مصدر «تفضّل» على «تَفَعُّل»."
rhetoric:
  thesis: "لم يقل إنها غنية مخدومة، بل ذكر ما يدل على ذلك: المسك على فراشها، ونومها إلى الضحى، وأنها لا تشد نطاقًا للعمل."
  devices:
    - title: "الكناية"
      text: "هذا البيت هو الذي مثّل به عبد القاهر للكناية. قال: «وفي المرأة: نؤوم الضحى، والمراد أنها مترفة مخدومة، لها من يكفيها أمرها» [@dalail، ص66]. فالنوم إلى الضحى لازم من لوازم الترف، ذكره الشاعر ليدل به على الترف."
    - title: "تتابع الكنايات"
      text: "ثلاث كنايات عن معنى واحد: فتيت المسك، ونوم الضحى، وترك النطاق. قال الزَّوْزَنِيّ: «وصفها بالدعة والنعمة وخفض العيش، وأن لها من يخدمها ويكفيها أمورها» [@zawzani، ص56]."
    - title: "صيغة المبالغة"
      text: "«نؤوم» على «فعول» تدل على عادة، لا على نومة واحدة."
  connection: "ثم يصف أناملها: «وتعطو برَخْص غير شَثْن»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَيُضْ حِي / فَتِيتُلْ مِسْ / كِ فَوْ قَ / فِرَاشِهَا = فعولن / مفاعيلن / فعولُ / مفاعلن — نَؤُو مُضْ / ضُحَى لَمْ تَنْ / تَطِقْ عَنْ / تَفَضْضُلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر وحدها [@atiq، ص29]."
context: "قال أبو جعفر أحمد بن عبيد: ليس المعنى أن أحدًا فتّ لها المسك في فراشها، بل «كأن فراشها فيه المسك من طيب جسدها» [@ibn-al-anbari، ص65]."
