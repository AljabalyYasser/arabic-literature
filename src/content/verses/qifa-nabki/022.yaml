first: "وَمَا ذَرَفَتْ عَيْنَاكِ إِلَّا لِتَضْرِبِي"
second: "بِسَهْمَيْكِ فِي أَعْشَارِ قَلْبٍ مُقَتَّلِ"
meaning: "ما بكيتِ إلا لتصيبي بسهمي عينيك قلبًا مكسّرًا ذلّله حبك. قال الأَصْمَعِيّ: «لم تبكي لأنك مظلومة، وإنما بكيت لتقدحي في قلبي» [@ibn-al-anbari، ص48]."
vocabulary:
  - term: "ذَرَفَتْ"
    text: "سال دمعها [@zawzani، ص46]."
  - term: "أَعْشَارِ"
    text: "«من قولهم: بُرْمة أعشار، إذا كانت قطعًا» [@zawzani، ص46]. والبُرمة: القدر من الحجر."
  - term: "مُقَتَّلِ"
    text: "«المذلّل غاية التذليل» [@zawzani، ص46]."
  - term: "بِسَهْمَيْكِ"
    text: "عيناها في القول الأول، وقدحا الميسر المعلّى والرقيب في القول الثاني [@zawzani، ص46–47]."
syntax:
  - "«وَمَا ذَرَفَتْ عَيْنَاكِ»: «ما» نافية، و«ذرفت» فعل ماض، و«عيناك» فاعل مرفوع بالألف لأنه مثنى."
  - "«إِلَّا»: أداة حصر."
  - "«لِتَضْرِبِي»: اللام للتعليل، والفعل منصوب بـ«أن» مضمرة بعدها، وعلامة نصبه حذف النون. والمصدر المؤول مجرور باللام، والجار والمجرور متعلق بـ«ذرفت»."
  - "«بِسَهْمَيْكِ» و«فِي أَعْشَارِ»: متعلقان بـ«تضربي». و«قَلْبٍ» مضاف إليه، و«مُقَتَّلِ» نعت له."
morphology:
  - "«ذَرَفَ» مصدره «ذريف وذرفان وتذراف» [@zawzani، ص46]."
  - "«مُقَتَّل» اسم مفعول من «قتّل»، والتضعيف للمبالغة: ذُلّل غاية التذليل."
  - "«أَعْشَار» في القول الأول جمع «لا واحد له من لفظه» [@zawzani، ص46]، وفي القول الثاني جمع «عُشْر»، لأن أجزاء الجزور عشرة [@zawzani، ص47]."
rhetoric:
  thesis: "يجعل دموعها سلاحًا: لم تبكِ ضعفًا، بل لتصيب قلبه."
  devices:
    - title: "الحصر بـ«ما... إلا»"
      text: "قال عبد القاهر إن الخبر بالنفي والإثبات، نحو «ما هذا إلا كذا»، «يكون للأمر ينكره المخاطب ويشك فيه» [@dalail، ص332]. وفاطمة تبكي كأنها مظلومة، فجاء بالحصر ليرد ما تدّعيه دموعها: ما بكيتِ لشيء إلا لهذا."
    - title: "الاستعارة، على القول الأول"
      text: "قال الأكثرون: «استعار لِلَحظ عينيها ودمعهما اسم السهم، لتأثيرهما في القلوب وجرحهما إياها، كما أن السهام تجرح الأجسام» [@zawzani، ص46]. وقال ابن الأَنْبارِيّ: يخرق قلبي «كما يخرق الجابر أعشار البرمة، والبرمة تنجبر والقلب لا ينجبر» [@ibn-al-anbari، ص48]."
    - title: "صورة من الميسر، على القول الثاني"
      text: "قال آخرون: أراد بالسهمين المعلّى والرقيب من قداح الميسر، والجزور يُقسم عشرة أجزاء، «فللمعلّى سبعة أجزاء وللرقيب ثلاثة أجزاء، فمن فاز بهذين القدحين فقد فاز بجميع الأجزاء». فالمعنى: «وما بكيت إلا لتملكي قلبي كله» [@zawzani، ص47]."
  connection: "ثم ينتقل إلى مغامرة أخرى: «وبيضة خدر لا يُرام خباؤها»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَمَا ذَ / رَفَتْ عَيْنَا / كِ إِلْلَا / لِتَضْرِبِي = فعولُ / مفاعيلن / فعولن / مفاعلن — بِسَهْمَيْ / كِ فِي أَعْشَا / رِ قَلْبِنْ / مُقَتْتَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى وحدها [@atiq، ص29]."
context: "يروي ابن الأَنْبارِيّ حكاية عن راكب ظليم لقيه رجل ليلًا، فسأله عن أشعر الناس، فقال: «الذي يقول: وما ذرفت عيناك...» [@ibn-al-anbari، ص47]."
variants:
  - reading: "وَمَا ذَرَفَتْ عَيْنَاكِ إِلَّا لِتَقْدَحِي"
    status: "رواية أخرى"
    note: "كذا عند شوقي ضيف [@deif، ج1 ص249]. والقدح: الضرب بقداح الميسر، وقد ذكره الأَصْمَعِيّ في تفسير البيت [@ibn-al-anbari، ص48]."
