first: "أَلَا أَيُّهَا اللَّيْلُ الطَّوِيلُ أَلَا انْجَلِي"
second: "بِصُبْحٍ وَمَا الْإِصْبَاحُ فِيكَ بِأَمْثَلِ"
meaning: "أيها الليل الطويل، انكشف وأَعقِب صبحًا. ثم يستدرك: وما الصبح بأفضل منك عندي؛ فأنا معذّب، والليل والنهار عليّ سواء [@ibn-al-anbari، ص77]."
vocabulary:
  - term: "انْجَلِي"
    text: "انكشف [@ibn-al-anbari، ص77]."
  - term: "الْإِصْبَاحُ"
    text: "الصبح."
  - term: "أَمْثَلِ"
    text: "أفضل [@zawzani، ص60]."
syntax:
  - "«أَلَا» حرف استفتاح، و«أَيُّهَا» منادى مبني على الضم، و«اللَّيْلُ» مرفوع على الاتباع، و«الطَّوِيلُ» نعت [@ibn-al-anbari، ص77]."
  - "«انْجَلِي» فعل أمر، وأصله «انْجَلِ» بسكون اللام، فحرّكها بالكسر ووصل الكسرة بالياء ليستقيم الوزن [@ibn-al-anbari، ص78]."
  - "«وَمَا الْإِصْبَاحُ فِيكَ بِأَمْثَلِ»: «ما» نافية، و«الْإِصْبَاحُ» اسمها، والباء في «بِأَمْثَلِ» زائدة لتأكيد النفي."
morphology:
  - "«انجلى» على وزن «انفعل» من «جلا»: انكشف [@ibn-al-anbari، ص77]."
  - "«الْإِصْبَاحُ» مصدر «أصبح» على وزن «إفعال»، وهو هنا الصبح."
  - "«أمثل» اسم تفضيل على وزن «أفعل»: أفضل [@zawzani، ص60]."
rhetoric:
  thesis: "يتمنى الشاعر الصبح، ثم يستدرك في الشطر نفسه أن الصبح لن ينفعه؛ فالبيت يبدأ بالرجاء وينتهي باليأس."
  devices:
    - title: "نداء ما لا يعقل"
      text: "خطاب الليل «يدل على فرط الوله وشدة التحيّر، وإنما يستحسن هذا الضرب في النَّسِيب والمراثي وما يوجب حزنًا وكآبة» [@zawzani، ص60]."
    - title: "الاستدراك"
      text: "«وَمَا الْإِصْبَاحُ فِيكَ بِأَمْثَلِ»: ينقض رجاءه بنفسه؛ فالمعنى: «أنا معذب فالليل والنهار علي سواء» [@ibn-al-anbari، ص77]."
    - title: "تكرار «أَلَا»"
      text: "«ألا أيها ... ألا انجلي»: استفتاح مكرر يشبه الصيحة في ظلام طويل."
  connection: "ويكمل وصف الليل ببيتين عن نجومه التي لا تتحرك، ثم ينتقل إلى الوادي والفرس."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَلَا أَيْ / يُهَلْ لَيْلُطْ / طَوِيلُ / أَلَنْجَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن — بِصُبْحِنْ / وَمَلْ إِصْبَا / حُ فِيكَ / بِأَمْثَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "همزة «انْجَلِي» همزة وصل تسقط في النطق: «أَلَنْجَلِي». وألف «أَيُّهَا» تسقط في النطق قبل «اللَّيْلُ»: «يُهَلْ لَيْلُ»."
context: "من أشهر أبيات الليل في الشعر العربي. وخطاب الليل، وهو لا يعقل، يدل عند الزَّوْزَنِيّ «على فرط الوله وشدة التحيّر» [@zawzani، ص60]. والأصل في «انْجَلِ» سكون اللام لأنه أمر، فكسرها الشاعر ووصل الكسرة بياء «ليستوي له وزن البيت» [@ibn-al-anbari، ص78]."
variants:
  - reading: "وَمَا الْإِصْبَاحُ مِنْكَ بِأَمْثَلِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«مِنْكَ» بدل «فِيكَ» [@zawzani، ص60]."
