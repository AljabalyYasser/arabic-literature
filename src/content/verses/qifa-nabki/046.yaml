first: "أَلَا أَيُّهَا اللَّيْلُ الطَّوِيلُ أَلَا انْجَلِي"
second: "بِصُبْحٍ وَمَا الْإِصْبَاحُ فِيكَ بِأَمْثَلِ"
level: "basic"
meaning: "أيها الليل الطويل، انكشف وأَعقِب صبحًا. ثم يستدرك: وما الصبح بأفضل منك عندي؛ فأنا معذّب، والليل والنهار عليّ سواء [@ibn-al-anbari، ص77]."
vocabulary:
  - term: "انْجَلِي"
    text: "انكشف [@ibn-al-anbari، ص77]."
  - term: "الْإِصْبَاحُ"
    text: "الصبح."
  - term: "أَمْثَلِ"
    text: "أفضل [@zawzani، ص60]."
context: "من أشهر أبيات الليل في الشعر العربي. وخطاب الليل، وهو لا يعقل، يدل عند الزَّوْزَنِيّ «على فرط الوله وشدة التحيّر» [@zawzani، ص60]. والأصل في «انْجَلِ» سكون اللام لأنه أمر، فكسرها الشاعر ووصل الكسرة بياء «ليستوي له وزن البيت» [@ibn-al-anbari، ص78]."
variants:
  - reading: "وَمَا الْإِصْبَاحُ مِنْكَ بِأَمْثَلِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "«مِنْكَ» بدل «فِيكَ» [@zawzani، ص60]."
