first: "وَإِنَّ شِفَائِي عَبْرَةٌ مُهَرَاقَةٌ"
second: "فَهَلْ عِنْدَ رَسْمٍ دَارِسٍ مِنْ مُعَوَّلِ"
meaning: "ودوائي مما أنا فيه دمعة أصبّها. ولكن هل ينفع البكاء عند أثر ممحوّ، أو هل عنده ما يُعتمد عليه [@zawzani، ص38]؟"
vocabulary:
  - term: "عَبْرَةٌ"
    text: "دمعة [@ibn-al-anbari، ص26]."
  - term: "مُهَرَاقَةٌ"
    text: "مصبوبة [@ibn-al-anbari، ص26]."
  - term: "رَسْمٍ دَارِسٍ"
    text: "أثر قد امّحى."
  - term: "مُعَوَّلِ"
    text: "فيه معنيان: موضع بكاء، من العويل وهو البكاء مع رفع الصوت؛ أو ما يُعتمد عليه ويُتّكل [@zawzani، ص38]."
syntax:
  - "«إِنَّ شِفَائِي عَبْرَةٌ»: جملة اسمية مؤكدة بـ«إنّ»، و«عَبْرَةٌ» خبرها، و«مُهَرَاقَةٌ» صفة لها."
  - "«فَهَلْ عِنْدَ رَسْمٍ دَارِسٍ مِنْ مُعَوَّلِ»: «مُعَوَّلِ» مبتدأ مؤخر دخلت عليه «مِنْ» الزائدة فجرّته لفظًا، و«عِنْدَ رَسْمٍ» خبر مقدم. و«مِنْ» الزائدة بعد الاستفهام تفيد العموم: هل من معوّل أيًّا كان؟"
  - "والاستفهام هنا يتضمن معنى الإنكار؛ فالمعنى: لا طائل في البكاء في هذا الموضع [@zawzani، ص38]."
morphology:
  - "«مُهَرَاقَةٌ» من أَراقَ الماءَ. يقال: أَرَقْتُ الماءَ، وهَرَقْتُه، وأَهْرَقْتُه، فزيدت الهاء في بعض لغاته [@ibn-al-anbari، ص26]."
  - "«مُعَوَّلِ» من «عَوَّلَ»: إذا بكى رافعًا صوته، أو إذا اعتمد على الشيء [@zawzani، ص38]."
  - "«دَارِسٍ» اسم فاعل من «دَرَسَ» الأثر: إذا امّحى."
rhetoric:
  thesis: "يختم الشاعر مشهد الأطلال بسؤال ينقض ما قبله: البكاء شفاؤه، لكن هل ينفع البكاء عند أثر ممحوّ؟ فالمطلع كله ينتهي إلى حيرة."
  devices:
    - title: "استفهام بمعنى الإنكار"
      text: "«فَهَلْ عِنْدَ رَسْمٍ دَارِسٍ مِنْ مُعَوَّلِ» ليس سؤالًا ينتظر جوابًا، بل معناه: لا ينفع البكاء هنا، «لأنه لا يرد حبيبًا، ولا يجدي على صاحبه بخير» [@zawzani، ص38]."
    - title: "بين «لَمْ يَعْفُ» و«دَارِسٍ»"
      text: "في البيت الثاني قال إن الرسم «لَمْ يَعْفُ» أي لم يُمحَ، وهنا يصفه بأنه «دَارِسٍ» أي ممحوّ. فكيف يجتمعان؟ للعلماء ثلاثة أقوال: قال الأَصْمَعِيّ: درس بعضه وبقي بعضه. وقال أبو عُبَيْدة: «رجع فأكذب نفسه»، أي نقض ما قاله أولًا، كما فعل زُهَيْر في قوله: «قِفْ بِالدِّيَارِ الَّتِي لَمْ يَعْفُهَا القِدَمُ ... بَلَى وَغَيَّرَهَا الأَرْوَاحُ وَالدِّيَمُ». وقال آخرون: لم يدرس من قلبه، وهو في نفسه دارس [@ibn-al-anbari، ص26]."
  connection: "بعد هذا البيت يترك الأطلال إلى ذكرياته القديمة: «كَدَأْبِكَ مِنْ أُمِّ الحُوَيْرِثِ قَبْلَهَا»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَإِنْنَ / شِفَائِي عَبْ / رَتُنْ مُ / هَرَاقَتُنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — فَهَلْ عِنْ / دَ رَسْمِنْ دَا / رِسِنْ مِنْ / مُعَوْوَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاءت «فعولن» مقبوضة «فعولُ» مرتين في الصدر، وهذا تغيير جائز في حشو الطويل لا يلزم في بقية الأبيات [@atiq، ص29]."
context: "خاتمة مشهد الأطلال. وبعده يبدأ الشاعر رحلة في الذاكرة."
variants:
  - reading: "وَإِنَّ شِفَائِي عَبْرَةٌ إِنْ سَفَحْتُهَا"
    status: "رواية أخرى"
    note: "ومعنى سفحتها: صببتها [@ibn-al-anbari، ص25]."
