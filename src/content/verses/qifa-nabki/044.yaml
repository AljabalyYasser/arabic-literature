first: "وَلَيْلٍ كَمَوْجِ الْبَحْرِ أَرْخَى سُدُولَهُ"
second: "عَلَيَّ بِأَنْوَاعِ الْهُمُومِ لِيَبْتَلِي"
meaning: "ورُبّ ليل مخيف كموج البحر، أرخى عليّ ستور ظلامه مع ألوان الهموم، ليختبرني: أأصبر أم أجزع [@zawzani، ص59]؟"
vocabulary:
  - term: "وَلَيْلٍ"
    text: "الواو هنا بمعنى «رُبّ»، ولذلك جُرّ «لَيْل» [@ibn-al-anbari، ص75]."
  - term: "سُدُولَهُ"
    text: "ستوره، واحدها سَدْل [@ibn-al-anbari، ص74]."
  - term: "أَرْخَى"
    text: "أرسل وأسدل."
  - term: "لِيَبْتَلِي"
    text: "ليختبر ما عندي من الصبر والجزع [@ibn-al-anbari، ص75]."
syntax:
  - "«وَلَيْلٍ»: الواو واو «رُبّ»، و«لَيْل» مجرور بـ«ربّ» المحذوفة [@ibn-al-anbari، ص75]؛ والمعنى: ورُبّ ليل."
  - "«كَمَوْجِ الْبَحْرِ» صفة لـ«لَيْل»، و«أَرْخَى سُدُولَهُ» صفة ثانية [@ibn-al-anbari، ص75]."
  - "«لِيَبْتَلِي»: اللام لام التعليل، والفعل منصوب بها عند الكوفيين، وبـ«أن» مضمرة عند البصريين [@ibn-al-anbari، ص75]."
morphology:
  - "«سُدول» جمع «سَدْل»، وهو الستر [@ibn-al-anbari، ص74]."
  - "«أَرْخَى» على وزن «أفعل»: أرسل الشيء ولم يضمّه."
  - "«يبتلي» على وزن «يفتعل» من «بلا»: يختبر ما عندي من الصبر والجزع [@ibn-al-anbari، ص75]."
rhetoric:
  thesis: "الليل هنا ليس زمنًا بل خصم: يُرخي ستوره، ويأتي بالهموم، ويختبر الشاعر."
  devices:
    - title: "التشبيه"
      text: "شبّه الليل بموج البحر؛ في كثافة ظلمته عند ابن الأَنْبارِيّ [@ibn-al-anbari، ص74]، وفي هوله ووحشته عند الزَّوْزَنِيّ [@zawzani، ص59]."
    - title: "الاستعارة"
      text: "جعل لليل سدولًا يرخيها، أي ستورًا؛ كأنه يُسدل على الشاعر ستارًا من الظلام."
    - title: "غاية الليل"
      text: "جعل لليل قصدًا: «لِيَبْتَلِي»؛ فصار الصبر عليه بطولة يفخر بها [@zawzani، ص59]."
  connection: "ثم يصف هذا الليل الطويل ويخاطبه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَلَيْلِنْ / كَمَوْجِلْ بَحْ / رِ أَرْخَى / سُدُولَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — عَلَيْيَ / بِأَنْوَاعِلْ / هُمُومِ / لِيَبْتَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "جاءت «فعولن» مقبوضة مرتين في العَجُز: «عَلَيْيَ» و«هُمُومِ»، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "هنا يترك الشاعر الغزل إلى الفخر بصبره. يقول الزَّوْزَنِيّ: «لما أمعن في النَّسِيب من أول القصيدة إلى هنا انتقل منه إلى التمدح بالصبر والجلد» [@zawzani، ص59]. ووجه الشبه بين الليل وموج البحر عند ابن الأَنْبارِيّ كثافة الظلمة [@ibn-al-anbari، ص74]، وعند الزَّوْزَنِيّ الهول والوحشة [@zawzani، ص59]."
