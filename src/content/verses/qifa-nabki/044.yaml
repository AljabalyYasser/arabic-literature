first: "وَلَيْلٍ كَمَوْجِ الْبَحْرِ أَرْخَى سُدُولَهُ"
second: "عَلَيَّ بِأَنْوَاعِ الْهُمُومِ لِيَبْتَلِي"
level: "basic"
meaning: "ورُبّ ليل مخيف كموج البحر، أرخى عليّ ستور ظلامه مع ألوان الهموم، ليختبرني: أأصبر أم أجزع [@zawzani، ص59]؟"
vocabulary:
  - term: "وَلَيْلٍ"
    text: "الواو هنا بمعنى «رُبّ»، ولذلك جُرّ «لَيْل» [@ibn-al-anbari، ص75]."
  - term: "سُدُولَهُ"
    text: "ستوره، واحدها سَدْل [@ibn-al-anbari، ص74]."
  - term: "أَرْخَى"
    text: "أرسل وأسدل."
  - term: "لِيَبْتَلِي"
    text: "ليختبر ما عندي من الصبر والجزع [@ibn-al-anbari، ص75]."
context: "هنا يترك الشاعر الغزل إلى الفخر بصبره. يقول الزَّوْزَنِيّ: «لما أمعن في النَّسِيب من أول القصيدة إلى هنا انتقل منه إلى التمدح بالصبر والجلد» [@zawzani، ص59]. ووجه الشبه بين الليل وموج البحر عند ابن الأَنْبارِيّ كثافة الظلمة [@ibn-al-anbari، ص74]، وعند الزَّوْزَنِيّ الهول والوحشة [@zawzani، ص59]."
