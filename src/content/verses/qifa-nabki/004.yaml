first: "كَأَنِّي غَدَاةَ الْبَيْنِ يَوْمَ تَحَمَّلُوا"
second: "لَدَى سَمُرَاتِ الْحَيِّ نَاقِفُ حَنْظَلِ"
level: "basic"
meaning: "كأني صباح الفراق، يوم ارتحلوا، واقفًا عند شجرات السَّمُر في الحي، رجلٌ يشق الحنظل، فعيناه تدمعان من حرارته [@ibn-al-anbari، ص23]."
vocabulary:
  - term: "غَدَاةَ الْبَيْنِ"
    text: "صباح الفراق."
  - term: "تَحَمَّلُوا"
    text: "ارتحلوا وحملوا متاعهم."
  - term: "سَمُرَاتِ"
    text: "شجر له شوك [@ibn-al-anbari، ص23]."
  - term: "نَاقِفُ حَنْظَلِ"
    text: "الذي يشق الحنظل ليستخرج حبه، وتدمع عيناه لحرارته [@ibn-al-anbari، ص23]."
context: "يرجع الشاعر إلى لحظة الرحيل نفسها: الدمع الذي يسيل الآن عند الأطلال سال أول مرة يوم الفراق. وبدل أن يقول «بكيت» شبّه نفسه برجل تدمع عيناه رغمًا عنه. وهذا من التشبيهات التي استجادها ابن قُتَيْبة لامرئ القَيْس [@ibn-qutayba، ج1 ص111]."
variants:
  - reading: "كَأَنِّي غَدَاةَ الْبَيْنِ لَمَّا تَحَمَّلُوا"
    status: "رواية ابن قُتَيْبة"
    note: "«لما» بدل «يوم» [@ibn-qutayba، ج1 ص111]."
