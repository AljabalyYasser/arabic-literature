first: "كَأَنِّي غَدَاةَ الْبَيْنِ يَوْمَ تَحَمَّلُوا"
second: "لَدَى سَمُرَاتِ الْحَيِّ نَاقِفُ حَنْظَلِ"
meaning: "كأني صباح الفراق، يوم ارتحلوا، واقفًا عند شجرات السَّمُر في الحي، رجلٌ يشق الحنظل، فعيناه تدمعان من حرارته [@ibn-al-anbari، ص23]."
vocabulary:
  - term: "غَدَاةَ الْبَيْنِ"
    text: "صباح الفراق."
  - term: "تَحَمَّلُوا"
    text: "ارتحلوا وحملوا متاعهم."
  - term: "سَمُرَاتِ"
    text: "شجر له شوك [@ibn-al-anbari، ص23]."
  - term: "نَاقِفُ حَنْظَلِ"
    text: "الذي يشق الحنظل ليستخرج حبه، وتدمع عيناه لحرارته [@ibn-al-anbari، ص23]."
syntax:
  - "«كأنّي ... ناقفُ حنظل»: «كأنّ» حرف تشبيه، والياء اسمها، و«نَاقِفُ» خبرها."
  - "«غَدَاةَ الْبَيْنِ» ظرف زمان، و«يَوْمَ تَحَمَّلُوا» بدل منه يحدد ذلك الصباح: يوم ارتحلوا."
  - "«لَدَى سَمُرَاتِ الْحَيِّ» ظرف مكان متعلق بـ«نَاقِفُ»: هناك، عند شجرات الحي، وقف يبكي."
morphology:
  - "«نَاقِفُ» اسم فاعل من «نقَف» إذا شقّ."
  - "«تَحَمَّلُوا» على وزن «تفعّلوا» من «حمَل»: حملوا متاعهم وارتحلوا."
  - "«سَمُرَاتِ» جمع «سَمُرة»، وهي شجرة ذات شوك [@ibn-al-anbari، ص23]."
rhetoric:
  thesis: "بدل أن يقول «بكيت» يرسم الشاعر رجلًا تدمع عيناه رغمًا عنه، ويرجع بنا من الأطلال الحاضرة إلى لحظة الفراق."
  devices:
    - title: "التشبيه"
      text: "شبّه نفسه يوم الفراق بناقِف الحَنْظَل؛ يقول ابن الأَنْبارِيّ: «اعتزلت أبكي كأني ناقف حنظل، لأن ناقِف الحَنْظَل تدمع عيناه، لحرارة الحنظل» [@ibn-al-anbari، ص23]. وقد عدّه ابن قُتَيْبة من جيد تشبيه امرئ القَيْس [@ibn-qutayba، ج1 ص111]."
    - title: "مرارة الحنظل"
      text: "والحنظل مُرّ؛ فالصورة توحي بمرارة الفراق كما تصف الدمع."
    - title: "الرجوع بالزمن"
      text: "البيتان السابقان وصفا الحاضر، وهذا البيت يرجع إلى الماضي: «غَدَاةَ الْبَيْنِ». فالأطلال أيقظت الذكرى."
  connection: "ثم يعود إلى الحاضر: أصحابه واقفون حوله يواسونه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنِي / غَدَاتَلْ بَيْ / نِ يَوْمَ / تَحَمْمَلُو = فعولن / مفاعيلن / فعولُ / مفاعلن — لَدَى سَ / مُرَاتِلْ حَيْ / يِ نَاقِ / فُ حَنْظَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "جاءت «فعولن» مقبوضة «فعولُ» ثلاث مرات: «نِ يَوْمَ» و«لَدَى سَ» و«يِ نَاقِ»، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "يرجع الشاعر إلى لحظة الرحيل نفسها: الدمع الذي يسيل الآن عند الأطلال سال أول مرة يوم الفراق. وبدل أن يقول «بكيت» شبّه نفسه برجل تدمع عيناه رغمًا عنه. وهذا من التشبيهات التي استجادها ابن قُتَيْبة لامرئ القَيْس [@ibn-qutayba، ج1 ص111]."
variants:
  - reading: "كَأَنِّي غَدَاةَ الْبَيْنِ لَمَّا تَحَمَّلُوا"
    status: "رواية ابن قُتَيْبة"
    note: "«لَمَّا» بدل «يَوْمَ» [@ibn-qutayba، ج1 ص111]."
