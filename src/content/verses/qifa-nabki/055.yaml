first: "كُمَيْتٍ يَزِلُّ اللِّبْدُ عَنْ حَالِ مَتْنِهِ"
second: "كَمَا زَلَّتِ الصَّفْوَاءُ بِالْمُتَنَزِّلِ"
meaning: "فرس كُمَيْت، ظهره أملس ممتلئ اللحم، ينزلق اللِّبد عنه كما تُزلق الصخرة الملساء المطرَ النازل عليها. قال ابن الأَنْبارِيّ: «شبه ملاسة ظهر الفرس لاكتناز اللحم عليه وامتلائه بالصفاة الملساء» [@ibn-al-anbari، ص84]."
vocabulary:
  - term: "كُمَيْتٍ"
    text: "«الفرس الأحمر في سواد» [@deif، ج1 ص253، الحاشية]."
  - term: "اللِّبْدُ"
    text: "ما يُلقى على ظهر الفرس تحت الراكب."
  - term: "حَالِ مَتْنِهِ"
    text: "«مقعد الفارس من ظهر الفرس» [@zawzani، ص65]. وقال يعقوب: «والحال: موضع اللبد. قال: ولم أسمع به إلا في هذا» [@ibn-al-anbari، ص84]."
  - term: "الصَّفْوَاءُ"
    text: "«الصخرة الملساء التي لا ينبت فيها شيء. يقال صفواء وصفوان وصفاة» [@ibn-al-anbari، ص84]."
  - term: "الْمُتَنَزِّلِ"
    text: "النازل عليها: المطر، أو الإنسان [@zawzani، ص65]. «وقال غير يعقوب: بالمتنزل يعنى السيل والمطر» [@ibn-al-anbari، ص84]."
syntax:
  - "«كُمَيْتٍ»: نعت لـ«منجرد» في البيت 53، ولذلك جُرّ؛ قال الزَّوْزَنِيّ: «وجرّ كميتًا وما قبله من الأوصاف؛ لأنها نعوت لمنجرد» [@zawzani، ص65]."
  - "«يَزِلُّ اللِّبْدُ»: فعل وفاعل، «ويزل في موضع النعت» [@ibn-al-anbari، ص84]. و«عَنْ حَالِ» متعلق بـ«يزلّ»."
  - "«كَمَا زَلَّتِ الصَّفْوَاءُ»: الكاف للتشبيه، و«ما» مصدرية، والتقدير: كزَلِّ الصفواء. و«الصفواء مرتفعة بزلت» [@ibn-al-anbari، ص84]."
  - "«بِالْمُتَنَزِّلِ»: «الباء في قوله بالمتنزل للتعدية» [@zawzani، ص65]، أي: كما أزلّت الصفواءُ المتنزّلَ. و«المتنزّل» صفة لمحذوف، «وتقديره بالمطر المتنزل أو بالإنسان المتنزل» [@zawzani، ص65]."
morphology:
  - "«كُمَيْت» على صيغة التصغير «فُعَيْل»، وهو اسم لهذا اللون من الخيل."
  - "«الْمُتَنَزِّل» اسم فاعل من «تنزّل» على «تفعّل»، «والتنزّل والنزول واحد» [@zawzani، ص65]."
  - "«الصَّفْوَاء» على «فَعْلاء»، ومثلها في المعنى «صفوان» و«صفاة» [@ibn-al-anbari، ص84]."
rhetoric:
  thesis: "يجعل صفة خفية، امتلاء الظهر وملاسته، صورة ترى: لبد ينزلق كما ينزلق الماء عن صخرة ملساء."
  devices:
    - title: "تشبيه حركة بحركة"
      text: "لم يشبّه الظهر بالصخرة مباشرة، بل شبّه انزلاق اللبد عن الظهر بانزلاق المطر عن الصخرة. فوجه الشبه هيئة حركة، لا لون ولا شكل."
    - title: "الجناس"
      text: "بين «يَزِلّ» و«زَلَّت»: لفظان من أصل واحد. وعدّه شوقي ضيف من أمثلة الجناس المبكرة في الشعر الجاهلي [@deif، ج1 ص230]."
    - title: "قراءتان للصورة"
      text: "عند ابن الأَنْبارِيّ والزَّوْزَنِيّ ينزلق اللبد لملاسة الظهر واكتناز لحمه [@zawzani، ص65]. ويقرؤها شوقي ضيف صورة سرعة: «وإن لبده لشدة حركته ليسقط عنه وينزلق» [@deif، ج1 ص254]."
  connection: "ثم يصف صوت جريه: «على الذبل جيّاش كأن اهتزامه / إذا جاش فيه حميه غلي مرجل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كُمَيْتِنْ / يَزِلْلُلْ لِبْ / دُعَنْ حَا / لِمَتْنِهِي = فعولن / مفاعيلن / فعولن / مفاعلن — كَمَا زَلْ / لَتِصْ صَفْوَا / ءُ بِلْمُ / تَنَزْزِلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "جاء الصدر تامًّا، ودخل القبضُ، وهو حذف الخامس الساكن «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]."
context: "من التشبيهات التي استحسنها الناس لامرئ القَيْس، ذكره ابن سَلّام في بابها [@ibn-sallam، ج1 ص84]."
variants:
