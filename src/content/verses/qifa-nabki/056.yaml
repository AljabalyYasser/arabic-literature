first: "عَلَى الذَّبْلِ جَيَّاشٍ كَأَنَّ اهْتِزَامَهُ"
second: "إِذَا جَاشَ فِيهِ حَمْيُهُ غَلْيُ مِرْجَلِ"
meaning: "فرس ضامر الجسم، لكنه يغلي نشاطًا، كأن صوت جوفه في الجري إذا اشتد غليانُ قدر. قال ابن الأَنْبارِيّ: «شبه صوت جرى الفرس بغليان المرجل» [@ibn-al-anbari، ص85]. وقال الزَّوْزَنِيّ: «تغلي فيه حرارة نشاطه على ذبول خلقه وضمر بطنه» [@zawzani، ص65]."
vocabulary:
  - term: "الذَّبْلِ"
    text: "«الذبل والذبول واحد» [@zawzani، ص65]، أي الضمور."
  - term: "جَيَّاشٍ"
    text: "«مبالغة جائش، وهو فاعل من جاشت القدر تجيش جيشًا وجيشانًا إذا غلت» [@zawzani، ص65]. وقال أبو عُبَيْدة: «الجياش المتزيد في حضره الذي لا ينقطع جريه» [@ibn-al-anbari، ص85]. والحُضْر: العَدْو."
  - term: "اهْتِزَامَهُ"
    text: "«صوته» [@ibn-al-anbari، ص85]. وعند الزَّوْزَنِيّ: «التكسر»، أي تكسّر صهيله في صدره [@zawzani، ص65]."
  - term: "حَمْيُهُ"
    text: "حرارته [@zawzani، ص65]."
  - term: "مِرْجَلِ"
    text: "«القدر من صُفر أو حديد أو نحاس أو شبهه» [@zawzani، ص65]."
syntax:
  - "«جَيَّاشٍ»: «نعت لما تقدم قبله» [@ibn-al-anbari، ص86]، أي نعت آخر لـ«منجرد» في البيت 53، ولذلك جُرّ. و«على الذبل» متعلق بـ«جيّاش»."
  - "«كَأَنَّ اهْتِزَامَهُ... غَلْيُ مِرْجَلِ»: «والاهتزام اسم كأن»، و«غلي مرجل» خبرها."
  - "«إِذَا جَاشَ فِيهِ حَمْيُهُ»: «وحميه مرفوع بجاش»، و«إذا وقت فيها طرف من الجزاء» [@ibn-al-anbari، ص86]، أي ظرف زمان فيه معنى الشرط."
morphology:
  - "«جَيَّاش» على «فعّال» للمبالغة [@zawzani، ص65]."
  - "«اهْتِزَام» مصدر على «افتعال»."
  - "«مِرْجَل» على «مِفْعَل»، والجمع مراجل [@zawzani، ص65]."
rhetoric:
  thesis: "ظاهره ضامر، وباطنه يغلي: قوة الفرس في داخله لا في حجمه."
  devices:
    - title: "تشبيه صوت بصوت"
      text: "شبّه ما يُسمع من جوف الفرس وهو يجري بصوت القدر وهي تغلي. فالتشبيه هنا للأذن لا للعين."
    - title: "المقابلة بين الذبول والجيشان"
      text: "«على الذبل جيّاش»: جمع بين الضمور والغليان في كلمتين، فكأن الضمور نفسه يزيد النار في داخله."
    - title: "الاستعارة في «جيّاش»"
      text: "الجيشان في الأصل للقدر إذا غلت وللبحر إذا هاج [@zawzani، ص65]، فأعاره للفرس، ثم صرّح بالقدر في آخر البيت؛ فالبيت كله مبني على صورة القدر."
  connection: "ثم يقول: «مِسَحٍّ إذا ما السابحات على الونى»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "عَلَذْ ذَبْ / لِ جَيْيَاشِنْ / كَأَنْنَهْ / تِزَامَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — إِذَا جَا / شَ فِيهِ حَمْ / يُهُو غَلْ / يُ مِرْجَلِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "همزة «اهتزامه» همزة وصل تسقط في النطق: «كَأَنْنَهْتِزَامَهُو». وجاء الصدر تامًّا، دخل القبضُ «مفاعيلن» في التفعيلة الثانية من العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "قال شوقي ضيف في معنى المقطع: «إنما هو أن يحركه راكبه فإذا به يغلي غليان القدر لا يني ولا يفتر» [@deif، ج1 ص254]."
variants:
  - reading: "عَلَى الْعَقْبِ جَيَّاشٍ كَأَنَّ اهْتِزَامَهُ"
    status: "رواية الأَصْمَعِيّ وأبي عُبَيْدة"
    note: "«قال قوم: العقب جرى بعد جرى... وقال آخرون: على العقب، أي إذا حركته بعقبك جاش وكفاك ذلك من السوط» [@ibn-al-anbari، ص85]. وبها يرويه شوقي ضيف [@deif، ج1 ص254]."
