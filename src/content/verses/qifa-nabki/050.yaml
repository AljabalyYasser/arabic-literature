first: "وَوَادٍ كَجَوْفِ الْعَيْرِ قَفْرٍ قَطَعْتُهُ"
second: "بِهِ الذِّئْبُ يَعْوِي كَالْخَلِيعِ الْمُعَيَّلِ"
meaning: "ورُبّ وادٍ خالٍ لا خير فيه، كجوف الحمار، قطعته، يعوي فيه الذئب من الجوع كأنه رجل مقامر كثير العيال. قال الزَّوْزَنِيّ: «وكان الذئب فيه من فرط الجوع كالمقامر الذي كثر عياله ويطالبه عياله بالنفقة، وهو يصيح بهم ويخاصمهم إذ لا يجد ما يرضيهم به» [@zawzani، ص62]."
vocabulary:
  - term: "الْعَيْرِ"
    text: "الحمار [@zawzani، ص62]. وفي المراد بجوفه قولان، انظر حكاية «جوف العير»."
  - term: "قَفْرٍ"
    text: "«المكان الخالي» [@zawzani، ص62]."
  - term: "الْخَلِيعِ"
    text: "«المقامر، ويقال هو الذي قد خلع عذاره فليس يبالي ما ارتكب» [@ibn-al-anbari، ص81]. وأصله الذي خلعه أهله لخبثه فتبرؤوا من جرائره، «وزعم الأئمة أن الخليع في هذا البيت المقامر» [@zawzani، ص62]."
  - term: "الْمُعَيَّلِ"
    text: "«الكثير العيال» [@ibn-al-anbari، ص81]."
syntax:
  - "«وَوَادٍ»: الواو واو رُبّ، و«وادٍ» «مخفوض بإضمار رب» [@ibn-al-anbari، ص81]. وهو على أحد الأوجه مجرور لفظًا مرفوع محلًّا على الابتداء، وجملة «قطعته» خبره."
  - "«كَجَوْفِ الْعَيْرِ»: الكاف «نعت للوادي» [@ibn-al-anbari، ص81]، و«قَفْرٍ» نعت ثان."
  - "«بِهِ الذِّئْبُ يَعْوِي»: «الذئب» مبتدأ، وجملة «يعوي» خبره، والجملة صفة أخرى للوادي. و«كَالْخَلِيعِ» متعلق بـ«يعوي» [@ibn-al-anbari، ص81]، و«الْمُعَيَّلِ» نعت للخليع."
morphology:
  - "«وادٍ» اسم منقوص، حُذفت ياؤه لالتقائها ساكنة مع التنوين."
  - "«الْخَلِيع» فعيل بمعنى مفعول: الذي خلعه أهله [@zawzani، ص62]."
  - "«الْمُعَيَّل» اسم مفعول من المضعف «عيّل»: «وقد عيَّل تعييلًا فهو معيل إذا كثر عياله» [@zawzani، ص62]."
rhetoric:
  thesis: "وادٍ موحش، وذئب جائع يصرخ كإنسان خاسر: صورة فقر كاملة يدخلها الشاعر وحده."
  devices:
    - title: "تشبيه الوادي"
      text: "شبّه الوادي بجوف العير في الخلاء وقلة النفع؛ فهو «في الخلاء من النبات والإنس» كجوف الحمار [@zawzani، ص62]."
    - title: "تشبيه الذئب بالإنسان"
      text: "لم يشبّه الذئب بحيوان آخر، بل برجل: مقامر خسر ماله وعياله يطالبونه. فصار عواء الذئب صياح رجل مهموم، وبهذا يمهّد لمخاطبته في البيت التالي كأنه رفيق."
    - title: "الفخر بالجرأة"
      text: "«قطعته»: يقطع وحده واديًا لا يسكنه إلا الذئب، وهذا فخر بالشجاعة والصبر على الفلاة."
  connection: "ثم يخاطب الذئب: «فقلت له لما عوى: إن شأننا / قليل الغنى إن كنت لما تمول»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وَوَادِنْ / كَجَوْفِلْ عَيْ / رِقَفْرِنْ / قَطَعْتُهُو = فعولن / مفاعيلن / فعولن / مفاعلن — بِهِذْ ذِئْ / بُ يَعْوِي كَلْ / خَلِيعِلْ / مُعَيْيَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "جاء البيت تامًّا، بلا قبض في «فعولن» ولا في «مفاعيلن»، على الأصل: فعولن مفاعيلن فعولن مفاعلن [@ahda-sabil، ص28]."
context: "من الأبيات الأربعة (49–52) التي رواها بعض الرواة في المعلقة، وأنكرها الأَصْمَعِيّ وأبو عُبَيْدة وجمهور الأئمة، ونسبها بعضهم إلى تأبَّط شرًّا [@ibn-al-anbari، ص80، ص82] [@zawzani، ص61]."
variants:
  - reading: "وَخَرْقٍ كَجَوْفِ الْعَيْرِ قَفْرٍ قَطَعْتُهُ"
    status: "رواية أخرى"
    note: "«فالخرق: الذي يتخرق في الفلاة» [@ibn-al-anbari، ص80]، أي الأرض الواسعة."
