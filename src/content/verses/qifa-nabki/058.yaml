first: "يَزِلُّ الْغُلَامُ الْخِفُّ عَنْ صَهَوَاتِهِ"
second: "وَيُلْوِي بِأَثْوَابِ الْعَنِيفِ الْمُثَقَّلِ"
meaning: "ينزلق الغلام الخفيف عن ظهره، ويطيّر ثياب الراكب الثقيل الذي لا يحسن الركوب. قال ابن الأَنْبارِيّ: «إذا كان راكب الفرس خفيفا رمى به، وإذا كان ثقيلا رمى بثيابه» [@ibn-al-anbari، ص87]."
vocabulary:
  - term: "الْخِفُّ"
    text: "«الخفيف» [@ibn-al-anbari، ص87]."
  - term: "صَهَوَاتِهِ"
    text: "«جمع صهوة، وهي موضع اللبد» [@ibn-al-anbari، ص87]، أي «مقعد الفارس من ظهر الفرس» [@zawzani، ص66]."
  - term: "يُلْوِي"
    text: "«يرمى بثيابه، أي يذهبها ويبعدها» [@ibn-al-anbari، ص87]."
  - term: "الْعَنِيفِ"
    text: "«الذي ليس برفيق» [@ibn-al-anbari، ص87]."
  - term: "الْمُثَقَّلِ"
    text: "«الثقيل» [@ibn-al-anbari، ص87]."
syntax:
  - "«والغلام رفع بيزل، والخف نعته، وعن صهواته صلة يزل، ويلوي نسق على يزل، والباء صلة يلوي وهي خافضة للأثواب، والأثواب مضافة إلى العنيف، والمثقل نعته» [@ibn-al-anbari، ص88]."
  - "وفاعل «يُلوي» ضمير يعود على الفرس."
morphology:
  - "«صَهَوَات» جمع «صَهْوة» على «فَعَلات» بفتح العين، لأنها اسم، والصفة تُجمع بسكون العين [@zawzani، ص66–67]."
  - "«يُلْوِي» مضارع «ألوى»: «ألوى بالشيء: رمى به، وألوى به ذهب به» [@zawzani، ص67]."
  - "«الْمُثَقَّل» اسم مفعول من «ثقّل»."
rhetoric:
  thesis: "يعرّفك بشدة الفرس من أثره في راكبه: الخفيف يسقط، والثقيل تطير ثيابه."
  devices:
    - title: "التقسيم"
      text: "قسم الركاب قسمين: خفيف وثقيل، ثم ذكر ما يصيب كلًّا منهما؛ فلا ينجو من الفرس راكب لا يحسن ركوبه."
    - title: "الكناية عن السرعة والمرح"
      text: "لم يقل إن فرسه سريع شديد، بل ذكر ما يفعله بمن يركبه، فدلّ الأثر على الصفة. قال الزَّوْزَنِيّ: «لشدة عدوه وفرط مرحه في جريه» [@zawzani، ص67]."
    - title: "الطباق"
      text: "بين «الخِفّ» و«المثقّل»."
  connection: "ثم يقول: «درير كخذروف الوليد أمرّه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "يَزِلْلُلْ / غُلَامُلْ خِفْ / فُ عَنْ صَ / هَوَاتِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — وَيُلْوِي / بِأَثْوَابِلْ / عَنِيفِلْ / مُثَقْقَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "لماذا قال «صهواته» بالجمع، والفرس له صهوة واحدة؟ قال الزَّوْزَنِيّ: «لأنه لا لبس فيه... كما يقال: رجل عظيم المناكب وغليظ المشافر، ولا يكون له إلا منكبان وشفتان» [@zawzani، ص67]."
variants:
  - reading: "يَطِيرُ الْغُلَامُ الْخِفُّ عَنْ صَهَوَاتِهِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«معناه يرمى به من خفته ونشاطه وسرعته» [@ibn-al-anbari، ص87]. وبها يرويه شوقي ضيف [@deif، ج1 ص254]."
  - reading: "يُزِلُّ الْغُلَامَ الْخِفَّ عَنْ صَهَوَاتِهِ"
    status: "رواية الزَّوْزَنِيّ"
    note: "بجعل الفعل متعديًا فاعله الفرس [@zawzani، ص67]."
