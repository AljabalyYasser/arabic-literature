first: "أَصَاحِ تَرَى بَرْقًا أُرِيكَ وَمِيضَهُ"
second: "كَلَمْعِ الْيَدَيْنِ فِي حَبِيٍّ مُكَلَّلِ"
meaning: "يا صاحبي، أترى برقًا أُريك لمعانه في سحاب متراكم، يتحرك كتحرك اليدين؟ قال الزَّوْزَنِيّ: «يا صاحبي هل ترى برقًا أريك لمعانه وتلألؤه وتألقه في سحاب متراكم صار أعلاه كالإكليل لأسفله... شبه لمعان البرق وتحركه بتحرك اليدين» [@zawzani، ص73]."
vocabulary:
  - term: "أَصَاحِ"
    text: "«أراد أصاحب أي: يا صاحب، فرخّم» [@zawzani، ص72]."
  - term: "وَمِيضَهُ"
    text: "«الوميض والإيماض: اللمعان» [@zawzani، ص73]."
  - term: "لَمْعِ الْيَدَيْنِ"
    text: "«اللمع: التحريك والتحرك جميعًا» [@zawzani، ص73]، أي كحركة اليدين إذا أُشير بهما."
  - term: "حَبِيٍّ"
    text: "«السحاب المتراكم، سمي بذلك لأنه حبا بعضه إلى بعض فتراكم» [@zawzani، ص73]."
  - term: "مُكَلَّلِ"
    text: "«الذي بعضه على بعض» [@ibn-al-anbari، ص100]، أو الذي «صار أعلاه كالإكليل لأسفله» [@zawzani، ص73]."
syntax:
  - "«أَصَاحِ»: الهمزة حرف نداء، وهي «نداء للقريب دون البعيد» [@zawzani، ص73]، و«صاحِ» منادى مرخّم، حُذف آخره."
  - "«تَرَى بَرْقًا»: استفهام حُذفت أداته، و«برقًا» مفعول به [@ibn-al-anbari، ص100]. وجملة «أريك وميضه» صفة للبرق [@ibn-al-anbari، ص100]."
  - "«كَلَمْعِ الْيَدَيْنِ»: الكاف «نعت للبرق» [@ibn-al-anbari، ص100]. و«في حبيّ» متعلق باللمع. وتقدير البيت عند الزَّوْزَنِيّ: «أريك وميضه في حبي مكلل كلمع اليدين» [@zawzani، ص73]."
morphology:
  - "«صاحِ» ترخيم «صاحب»، كما يقال في «حارث»: يا حارِ، وفي «مالك»: يا مالِ [@zawzani، ص72]."
  - "«حَبِيّ» على «فعيل» من «حبا»."
  - "«مُكَلَّل» اسم مفعول من «كلّل»، «ويروى مكلِّل، بكسر اللام، وقد كلل تكليلًا، وانكلّ انكلالًا إذا تبسم» [@zawzani، ص73]."
rhetoric:
  thesis: "يفتح مشهد المطر بدعوة صاحبه إلى النظر، كما فتح القصيدة بدعوة صاحبيه إلى الوقوف."
  devices:
    - title: "التشبيه"
      text: "البرق يلمع ويختفي ويعود، فشبّهه بحركة اليدين: صورة حركة متكررة سريعة."
    - title: "إشراك السامع"
      text: "بالنداء «أصاحِ» والسؤال «ترى»، ثم «أُريك»: الشاعر يرى ويُري، فيضع صاحبه، والسامع معه، أمام المشهد."
    - title: "ملاحظة شوقي ضيف على الترتيب"
      text: "يرى شوقي ضيف في هذا الموضع شيئًا من «النبو»، فقد «كان ترتيب السياق ونسقه يقتضيان أن يكمل وصفه للبرق بأنه في حبي مكلل وسحاب متراكم وأنه يضيئ سناه، ثم يشبهه بلمع اليدين ومصابيح الراهب» [@deif، ج1 ص261]. أي أن التشبيه جاء قبل تمام الوصف."
  connection: "ثم يكمل تشبيه البرق: «يضيء سناه أو مصابيح راهب / أمال السليط بالذبال المفتّل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَصَاحِ / تَرَى بَرْقَنْ / أُرِيكَ / وَمِيضَهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — كَلَمْعِلْ / يَدَيْنِ فِي / حَبِيْيِنْ / مُكَلْلَلِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر [@atiq، ص29]، و«مفاعيلن» في التفعيلة الثانية من العَجُز فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "بهذا البيت يبدأ القسم الأخير من المعلقة. قال الزَّوْزَنِيّ: «فرغ من وصف الفرس والآن قد أخذ في وصف المطر» [@zawzani، ص73]."
variants:
