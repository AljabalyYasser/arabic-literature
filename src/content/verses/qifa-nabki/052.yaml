first: "كِلَانَا إِذَا مَا نَالَ شَيْئًا أَفَاتَهُ"
second: "وَمَنْ يَحْتَرِثْ حَرْثِي وَحَرْثَكَ يَهْزُلِ"
meaning: "يقول للذئب: كل واحد منا إذا ظفر بشيء أضاعه، ومن سعى سعيي وسعيك عاش فقيرًا. قال الزَّوْزَنِيّ: «كل واحد منا إذا ظفر بشيء فوّته على نفسه أي: إذا ملك شيئًا أنفقه وبذّره، ثم قال: ومن سعى سعيي وسعيك افتقر وعاش مهزول العيش» [@zawzani، ص63]."
vocabulary:
  - term: "أَفَاتَهُ"
    text: "أضاعه، من الفَوْت؛ ومعناه عند ابن الأَنْبارِيّ: «إذا نلت شيئا أفته، وكذلك أنت إذا أصبت شيئا أفته» [@ibn-al-anbari، ص81]."
  - term: "يَحْتَرِثْ حَرْثِي"
    text: "«أصل الحرث إصلاح الأرض وإلقاء البذر فيها، ثم يستعار للسعي والكسب» [@zawzani، ص63]. «والاحتراث والحرث واحد» [@zawzani، ص63]."
  - term: "يَهْزُلِ"
    text: "يضعف ويفتقر، من الهُزال وهو ضد السِّمَن."
syntax:
  - "«كِلَانَا»: مبتدأ [@ibn-al-anbari، ص82]، وجملة «إذا ما نال شيئا أفاته» خبره. و«ما» بعد «إذا» زائدة. وعاد الضمير في «نال» و«أفاته» مفردًا لأن لفظ «كلا» مفرد وإن كان معناه مثنى."
  - "«وَمَنْ يَحْتَرِثْ»: «من» اسم شرط، و«يحترث» فعل الشرط مجزوم، و«حرثي» مفعول به، و«حرثك» معطوف عليه، و«يهزلِ» جواب الشرط مجزوم، وكُسر للقافية [@ibn-al-anbari، ص82]."
morphology:
  - "«يَحْتَرِث» على «يفتعل» من «حرث»."
  - "«أَفَات» رباعي من «فات»، والهمزة فيه للتعدية: فاته الشيء، وأفاته هو."
  - "«كِلا» اسم ملازم للإضافة، لفظه مفرد ومعناه مثنى."
rhetoric:
  thesis: "يساوي نفسه بالذئب في الفقر وتبديد ما يملك، ثم يخرج من حالهما إلى حكم عام."
  devices:
    - title: "الاستعارة في «يحترث حرثي»"
      text: "الحرث في الأصل شق الأرض للزرع، واستعاره للسعي في طلب الرزق. قال الزَّوْزَنِيّ: «وهو في البيت مستعار» [@zawzani، ص63]."
    - title: "المساواة بـ«كلانا»"
      text: "بدأ بلفظ يجمعه مع الذئب، فلم يعد الذئب عدوًّا بل شريكًا في الجوع."
    - title: "الخروج إلى الحكمة"
      text: "العَجُز «ومن يحترث حرثي وحرثك يهزل» حكم عام بصيغة الشرط، يصلح للتمثل به في كل من يطلب رزقه من غير وجهه."
  connection: "وبه تنتهي الأبيات الأربعة، ثم يعود إلى الفرس: «وقد أغتدي والطير في وكناتها»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كِلَانَا / إِذَا مَا نَا / لَ شَيْئَنْ / أَفَاتَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — وَمَنْ يَحْ / تَرِثْ حَرْثِي / وَحَرْثَ / كَ يَهْزُلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "جاء الصدر تامًّا، ودخل القبضُ، وهو حذف الخامس الساكن «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]."
context: "من الأبيات الأربعة (49–52) التي رواها بعض الرواة في المعلقة، وأنكرها الأَصْمَعِيّ وأبو عُبَيْدة وجمهور الأئمة، ونسبها بعضهم إلى تأبَّط شرًّا [@ibn-al-anbari، ص80، ص82] [@zawzani، ص61]. وفي معنى العَجُز قول آخر: «من كانت صناعته وطلبته مثل طلبتي وطلبتك في هذا الموضع مات هزلا؛ لأنهما كانا بواد لا نبات به ولا صيد» [@ibn-al-anbari، ص82]."
