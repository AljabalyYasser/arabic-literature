first: "كَأَنَّ دِمَاءَ الْهَادِيَاتِ بِنَحْرِهِ"
second: "عُصَارَةُ حِنَّاءٍ بِشَيْبٍ مُرَجَّلِ"
meaning: "كأن دماء أوائل الوحش التي صادها على صدر الفرس عصارةُ حنّاء خُضب بها شعر أشيب مُسرَّح. قال الزَّوْزَنِيّ: «شبه الدم الجامد على نحره من دماء الصيد بما جف من عصارة الحناء عن شعر الأشيب» [@zawzani، ص70]."
vocabulary:
  - term: "الْهَادِيَاتِ"
    text: "«المتقدمات. والهوادي من الإبل والخيل والحمر ومن كل شيء: أوله» [@ibn-al-anbari، ص92]."
  - term: "نَحْرِهِ"
    text: "أعلى صدره."
  - term: "عُصَارَةُ"
    text: "عصارة الشيء: «ما خرج منه عند عصره» [@zawzani، ص69]."
  - term: "مُرَجَّلِ"
    text: "«المسرَّح بالمشط» [@zawzani، ص69]. وقال ابن الأَنْبارِيّ: «بشيب قد غسل عنه الحناء فرجل» [@ibn-al-anbari، ص93]."
syntax:
  - "«كَأَنَّ دِمَاءَ»: «الدماء اسم كأن»، و«عُصَارَةُ» خبرها، وهي مضافة إلى «حناء» [@ibn-al-anbari، ص93]."
  - "«بِنَحْرِهِ»: متعلق بالدماء، و«بِشَيْبٍ» متعلق بالعصارة، و«الْمُرَجَّل» نعت للشيب [@ibn-al-anbari، ص93]."
morphology:
  - "«الْهَادِيَات» جمع «هادية»، اسم فاعل من «هدى»، وسمي المتقدم هاديًا «لأن هادي القوم يتقدمهم، ومنه قيل لعنق الفرس هاد» [@zawzani، ص69]."
  - "«عُصَارَة» على «فُعالة»، وهو وزن يأتي لما يبقى من الشيء، كالنُّخالة والقُلامة."
  - "«مُرَجَّل» اسم مفعول من المضعف «رجّل»: سرّح الشعر [@zawzani، ص69]."
rhetoric:
  thesis: "صورة غريبة يريد بها أن يُطرف سامعه: الدم على صدر الفرس صبغ حنّاء على شيب."
  devices:
    - title: "التشبيه الطريف"
      text: "قال شوقي ضيف: «ونحس دائما أنه يحاول أن يطرف سامعه بما يورد عليه من الصور الغريبة»، وذكر هذا البيت، ثم قال: فدم الوحش يلطّخ صدر الفرس «فيتراءى كأنه عصارة حناء صبغ بها شيب، إذ لا يكاد يفترق عن الخضاب في شيء» [@deif، ج1 ص262]."
    - title: "الكناية عن السرعة"
      text: "لم يقل إن فرسه سريع، بل ذكر أن على نحره دماء «الهاديات»، أي أوائل القطيع؛ «أراد أنه يلحقها فيطعنها فتصيب دماؤها نحره» [@ibn-al-anbari، ص92]. ومن يلحق أوائل الوحش فهو أسبق الخيل."
    - title: "بين المعنى والقافية"
      text: "لاحظ الزَّوْزَنِيّ أنه «أتى بالمرجّل لإقامة القافية» [@zawzani، ص70]. ومع ذلك فالكلمة تزيد الصورة دقة: الشعر المسرّح تتوزع عليه الحمرة خطوطًا كما يتوزع الدم على شعر النحر."
  connection: "ثم يروي خبر الصيد نفسه: «فعنّ لنا سرب كأن نعاجه / عذارى دوار في ملاء مذيّل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَأَنْنَ / دِمَاءَلْ هَا / دِيَاتِ / بِنَحْرِهِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — عُصَارَ / تُ حِنْنَائِنْ / بِشَيْبِنْ / مُرَجْجَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "يأتي في آخر وصف الفرس، قبل خبر الصيد، فكأنه يقدّم نتيجة الصيد قبل حكايته: هذا فرس عادته أن يعود وعلى صدره دماء الوحش. وهو مما استحسنه الناس من تشبيهه [@ibn-sallam، ج1 ص85]."
