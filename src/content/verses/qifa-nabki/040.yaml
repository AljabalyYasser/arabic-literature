first: "إِلَى مِثْلِهَا يَرْنُو الْحَلِيمُ صَبَابَةً"
second: "إِذَا مَا اسْبَكَرَّتْ بَيْنَ دِرْعٍ وَمِجْوَلِ"
meaning: "إلى مثلها يديم العاقل الرزين النظر شوقًا، إذا امتدت قامتها في سن بين سن الصبية وسن المرأة. قال الزَّوْزَنِيّ: «إلى مثلها ينبغي أن ينظر العاقل كلفًا بها وحنينًا إليها إذا طال قدّها وامتدت قامتها بين من تلبس الدرع وبين من تلبس المجول» [@zawzani، ص57–58]."
vocabulary:
  - term: "يَرْنُو"
    text: "«يديم النظر» [@ibn-al-anbari، ص68]."
  - term: "الْحَلِيمُ"
    text: "العاقل الرزين."
  - term: "صَبَابَةً"
    text: "«رقة الشوق» [@ibn-al-anbari، ص69]."
  - term: "اسْبَكَرَّتْ"
    text: "«امتدت وتمت»، «يقال: قد اسبكرت المرأة، اذا تم شبابها» [@ibn-al-anbari، ص69]."
  - term: "دِرْعٍ وَمِجْوَلِ"
    text: "الدرع قميص المرأة، والمجول «ثوب تلبسه الجارية الصغيرة» [@zawzani، ص57]. «وإنما يريد أن سنها بين سن من يلبس الدرع وبين سن من يلبس المجول» [@ibn-al-anbari، ص69]."
syntax:
  - "«إِلَى مِثْلِهَا»: «وإلى صلة يرنو، والحليم يرتفع بيرنو، والصبابة تنتصب على المصدر، والتقدير يرنو الحليم صبابة إلى مثلها» [@ibn-al-anbari، ص70]. وتقديم «إلى مثلها» يفيد الاختصاص: إلى مثلها لا إلى غيرها."
  - "«إِذَا مَا اسْبَكَرَّتْ»: «وإذا وقت من صلة يرنو، وما صلة للكلام لا موضع لها من الإعراب» [@ibn-al-anbari، ص70]."
  - "«بَيْنَ دِرْعٍ وَمِجْوَلِ»: «تقديره: بين لابسة درع ولابسة مجول، فحذف المضاف وأقام المضاف إليه مقامه» [@zawzani، ص58]."
morphology:
  - "«اسْبَكَرَّت» على «افعلَلّ»، من الرباعي المزيد، ومنه «شعر مسبكر للمنبسط» [@ibn-al-anbari، ص69]."
  - "«يَرْنُو» مضارع «رنا يرنو»، ناقص واوي؛ «ويقال: رنا إليه بصره، أي أدام إليه بصره» [@ibn-al-anbari، ص69]."
  - "«مِجْوَل» على «مِفْعَل»: ثوب تجول فيه الصبية [@ibn-al-anbari، ص69]."
rhetoric:
  thesis: "بعد أن وصفها عضوًا عضوًا، يحكم عليها بأثرها في الناظرين: حتى الحليم يديم النظر إليها."
  devices:
    - title: "الكناية"
      text: "«بين درع ومجول» كناية عن السن: لم يقل إنها في أول الشباب، بل ذكر ثوبين، ثوب الصبية وثوب المرأة، ووضعها بينهما."
    - title: "اختيار «الحليم»"
      text: "لم يقل «يرنو الفتى»، بل «الحليم»، وهو أبعد الناس عن الصبابة. فإذا أدام الحليم النظر، فكيف بغيره؟"
    - title: "الخروج من الوصف إلى الحكم"
      text: "«إلى مثلها»: بعد أبيات الوصف يعمّم، فتصير صاحبته مثالًا يُقاس عليه."
  connection: "ثم يشبهها: «كبكر المقاناة البياض بصفرة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "إِلَى مِثْ / لِهَا يَرْنُلْ / حَلِيمُ / صَبَابَتَنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — إِذَا مَسْ / بَكَرْرَتْ بَيْ / نَ دِرْعِنْ / وَمِجْوَلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "همزة «اسبكرت» همزة وصل تسقط في النطق: «إِذَا مَسْبَكَرْرَتْ». دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "يقول شوقي ضيف في هذا القسم إنه «استرسل يصف محاسنها... مصورا كيف تستصبي الرجال وتعبث بقلوبهم» [@deif، ج1 ص251]؛ وهذا البيت خاتمة ذلك."
