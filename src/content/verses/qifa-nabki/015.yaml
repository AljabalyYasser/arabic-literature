first: "فَقُلْتُ لَهَا سِيرِي وَأَرْخِي زِمَامَهُ"
second: "وَلَا تُبْعِدِينِي مِنْ جَنَاكِ الْمُعَلِّلِ"
meaning: "فقلت لها: سيري وأرخي زمام البعير، ولا تبعديني عنك. قال الأَصْمَعِيّ: «المعنى هوني عليك لا تبالي أعقر أم سلم» [@ibn-al-anbari، ص38]. وجعلها كشجرة لها ثمر يُجتنى، «فجعل ما يصيب من رائحتها وحديثها... بمنزلة ما يصيب من رائحة الشجرة وثمرها» [@ibn-al-anbari، ص38]."
vocabulary:
  - term: "زِمَامَهُ"
    text: "الزمام: الحبل الذي يُقاد به البعير، والضمير للبعير."
  - term: "جَنَاكِ"
    text: "الجنى: «اسم لما يجتنى من الشجر» [@zawzani، ص43]."
  - term: "الْمُعَلِّلِ"
    text: "«الشاغل الذي يعللني ساعة بعد ساعة، ويقال للمعلل الملهى» [@ibn-al-anbari، ص38]."
syntax:
  - "«سِيرِي»: فعل أمر، و«موضع سيري جزم بتأويل لام ساقطة، كأنه قال: لتسيري، وعلامة الجزم فيه سقوط النون» [@ibn-al-anbari، ص38]. و«أرخي زمامه» معطوف عليه."
  - "«وَلَا تُبْعِدِينِي»: «جزم على النهي بلا، وعلامة الجزم فيه سقوط النون» [@ibn-al-anbari، ص38]، والنون الباقية نون الوقاية."
  - "«مِنْ جَنَاكِ»: «والجنى مخفوض بمن، والمعلل نعته» [@ibn-al-anbari، ص38]."
morphology:
  - "«سِيرِي» أمر من «سار يسير»، أجوف يائي. قال الزَّوْزَنِيّ: «ويقال لمن على الدابة سار يسير كما قال للماشي» [@zawzani، ص43]."
  - "«الْمُعَلِّل» اسم فاعل من «علّل»، «وقد روي في البيت بكسر اللام وفتحها» [@zawzani، ص42]."
  - "«جَنًى» اسم مقصور، و«الجَنْي المصدر» [@zawzani، ص43]."
rhetoric:
  thesis: "يرد على شكواها بلا مبالاة: البعير لا يهمه، وقربها هو المطلوب."
  devices:
    - title: "الاستعارة"
      text: "«جعل العشيقة بمنزلة الشجرة، وجعل ما نال منها... بمنزلة الثمرة لتناسب الكلام» [@zawzani، ص42]. فذكر «الجنى» ولم يذكر الشجرة. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]، وندرسها أداةً في النصف الثاني من المعلقة."
    - title: "المقابلة بين الأمرين"
      text: "أمرها أن «تسير» وتبعد البعير، ونهاها أن «تبعده» هو. فالبعد المأذون فيه للبعير، والمنهي عنه له."
    - title: "الحوار"
      text: "بدأ الحوار في البيت 13 بقولها، ثم قولها في 14، ثم قوله هنا؛ فثلاثة أبيات مشهد قصصي كامل."
  connection: "وبعده بيتان من صريح غزله (16–17): «فمثلكِ حُبلى قد طرقتُ ومُرضعٍ»، ثم يوم آخر: «ويومًا على ظهر الكثيب تعذّرت»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَقُلْتُ / لَهَا سِيرِي / وَأَرْخِي / زِمَامَهُو = فعولُ / مفاعيلن / فعولن / مفاعلن — وَلَا تُبْ / عِدِينِي مِنْ / جَنَاكَلْ / مُعَلْلِلِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر [@atiq، ص29]. وجاء العَجُز تامًّا."
context: "هذا جواب الشاعر على قولها في البيت السابق «فانزل». وحكاية دارة جُلْجُل تجعل هذا الحوار في طريق الرحيل، بعد أن حملته عُنَيْزة على بعيرها."
variants:
  - reading: "وَلَا تُبْعِدِينِي مِنْ جَنَاكِ الْمُعَلَّلِ"
    status: "بفتح اللام"
    note: "أي المكرر، «من قولهم: علّه يعِلَه ويعلّه إذا كرر سقيه» [@zawzani، ص42]."
