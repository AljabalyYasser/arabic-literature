first: "فَأَلْحَقَهُ بِالْهَادِيَاتِ وَدُونَهُ"
second: "جَوَاحِرُهَا فِي صَرَّةٍ لَمْ تُزَيَّلِ"
meaning: "فألحق الفرسُ راكبَه بأوائل القطيع، وأواخرُه وراءه لم تتفرق بعد. قال ابن الأَنْبارِيّ: «فألحق الفرس الغلام بالهاديات، أي ألحقه بالأوائل ودونه المتخلفات» [@ibn-al-anbari، ص95]. وقال الزَّوْزَنِيّ: «يريد أنه يدرك أوائلها قبل تفرُّقِ جماعتها، يصفه بشدة عدوه» [@zawzani، ص71]."
vocabulary:
  - term: "الْهَادِيَاتِ"
    text: "«السوابق المتقدمات» [@ibn-al-anbari، ص95]."
  - term: "جَوَاحِرُهَا"
    text: "«اللواتي قد تخلفن» [@ibn-al-anbari، ص95]."
  - term: "صَرَّةٍ"
    text: "«جماعة» [@ibn-al-anbari، ص95]، «والصرة: الصيحة والضجة» [@ibn-al-anbari، ص96]."
  - term: "لَمْ تُزَيَّلِ"
    text: "«لم تفرق» [@ibn-al-anbari، ص95]، «والزيل والتزييل: التفريق» [@zawzani، ص71]."
syntax:
  - "«فَأَلْحَقَهُ»: فاعله ضمير الفرس، «والهاء منصوبة بألحق»، وهي للغلام الراكب، «والباء صلة ألحق» [@ibn-al-anbari، ص96]."
  - "«وَدُونَهُ جَوَاحِرُهَا»: «والواو واو الحال، وجواحرها مرفوعة بفي، ودونه صلة في، ويجوز أن يرتفع بدونه» [@ibn-al-anbari، ص96]؛ أي الجملة حالية، و«جواحرها» مبتدأ مؤخر في أحد الوجهين."
  - "«لَمْ تُزَيَّلِ»: فعل مضارع مبني للمجهول مجزوم بلم، وكُسر للقافية، والجملة صفة لـ«صرّة»."
morphology:
  - "«جَوَاحِر» جمع «جاحرة» على «فواعل». «قال الأَصْمَعِيّ: وقد تقول من جاحر: قد جحر. قال: ولا أدري كيف يفعل منه» [@ibn-al-anbari، ص95]."
  - "«تُزَيَّل» مضارع مبني للمجهول من المضعف «زيّل»."
  - "«الْهَادِيَات» جمع «هادية»."
rhetoric:
  thesis: "سرعة تسبق تفرق القطيع: أدرك الأوائل والأواخر ما زالت مجتمعة."
  devices:
    - title: "الكناية عن السرعة"
      text: "لم يقل إن الفرس سريع، بل إنه بلغ أول القطيع قبل أن ينتشر آخره. فالصورة تقيس السرعة بلحظة لم تكد تمر."
    - title: "المقابلة"
      text: "بين «الهاديات» و«الجواحر»: أول القطيع وآخره، والفرس بينهما."
    - title: "كلمة بمعنيين"
      text: "«في صرّة»: الجماعة أو الصيحة [@ibn-al-anbari، ص95–96]. وكلا المعنيين في المشهد: قطيع مجتمع، وضجة فراره."
  connection: "ثم يقول: «فعادى عداء بين ثور ونعجة»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَأَلْحَ / قَهُو بِلْهَا / دِيَاتِ / وَدُونَهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — جَوَاحِ / رُهَا فِي صَرْ / رَتِنْ لَمْ / تُزَيْيَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى والثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "قال شوقي ضيف: «مصورا كيف قيّده فرسه، فإذا هو يلحق بأوائله تاركا وراءه ما تخلف منه» [@deif، ج1 ص254–255]؛ وهذا تحقيق «قيد الأَوابِد» في البيت 53."
