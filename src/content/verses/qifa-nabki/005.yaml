first: "وُقُوفًا بِهَا صَحْبِي عَلَيَّ مَطِيَّهُمْ"
second: "يَقُولُونَ لَا تَهْلِكْ أَسًى وَتَجَمَّلِ"
meaning: "وقف أصحابي بي هناك على رواحلهم، يقولون: لا تُهلك نفسك حزنًا، وتجمّل بالصبر [@zawzani، ص38]."
vocabulary:
  - term: "صَحْبِي"
    text: "أصحابي، جمع صاحب [@zawzani، ص37]."
  - term: "مَطِيَّهُمْ"
    text: "رواحلهم، واحدتها مطية؛ سميت بذلك لأنه يُركب مطاها، أي ظهرها [@zawzani، ص37–38]."
  - term: "أَسًى"
    text: "حزنًا."
  - term: "تَجَمَّلِ"
    text: "تصبّر، وأظهر الصبر."
syntax:
  - "«وُقُوفًا» منصوب، ولابن الأنباري في نصبه أقوال، منها: أنه مصدر لـ«قِفَا»، أو حال من فاعل «نَبْكِ» [@ibn-al-anbari، ص24]. ويراه الزَّوْزَنِيّ حالًا، على معنى: قفا نبكِ في حال وقف أصحابي مطيهم عليّ [@zawzani، ص37]."
  - "«صَحْبِي» مرفوع بـ«وُقُوفًا» لأنه بمعنى الفعل، و«مَطِيَّهُمْ» منصوب به [@ibn-al-anbari، ص24]."
  - "«لَا تَهْلِكْ» مجزوم بـ«لَا»، و«تجمّلِ» فعل أمر، والكسرة في آخره تُمدّ للقافية [@ibn-al-anbari، ص25]."
  - "«أَسًى» عند الكوفيين مصدر، وعند البصريين مصدر في موضع الحال، أي: لا تهلك آسيًا [@ibn-al-anbari، ص25]؛ ويراه الزَّوْزَنِيّ مفعولًا لأجله [@zawzani، ص38]."
morphology:
  - "«وُقوف» جمع «واقف»، مثل «شهود» جمع «شاهد» [@zawzani، ص37]."
  - "«مطيّة» على وزن «فعيلة»، وأصلها «مَطِيوَة»؛ اجتمعت الواو والياء والأولى ساكنة، فصارتا ياء مشددة [@ibn-al-anbari، ص25]."
  - "«تَجَمَّلْ» على وزن «تفعّل»: تكلّف الجميل من الصبر."
rhetoric:
  thesis: "مشهد جماعي: الشاعر يبكي، وأصحابه فوقه على رواحلهم. فصار الحزن شأنًا يشارك فيه الرفاق."
  devices:
    - title: "النهي والأمر"
      text: "«لَا تَهْلِكْ أَسًى» نهي، و«تَجَمَّلْ» أمر: نصيحة من كلمتين، لكنها تكشف أن حزنه بلغ حدًّا خاف أصحابه أن يهلكه."
    - title: "معنى التجمل"
      text: "لم يطلبوا منه أن يكفّ عن الحزن، بل أن يخفيه؛ فالتجمل عند ابن الأَنْبارِيّ أن تُظهر «للناس خلاف ما في قلبك من الحزن والوجد، لئلا يشمت العواذل والعداة بك» [@ibn-al-anbari، ص25]."
  connection: "ثم يجيب أصحابه: شفائي في الدمع."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "وُقُوفَنْ / بِهَا صَحْبِي / عَلَيْيَ / مَطِيْيَهُمْ = فعولن / مفاعيلن / فعولُ / مفاعلن — يَقُولُو / نَ لَا تَهْلِكْ / أَسَنْ وَ / تَجَمْمَلِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "الياء المشددة حرفان، ساكن ثم متحرك: «عَلَيْيَ»، «مَطِيْيَهُمْ». وجاءت «فعولن» مقبوضة في الشطرين، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "تكتمل الصورة: الشاعر يبكي، وأصحابه واقفون حوله على رواحلهم يواسونه. ومعنى «تَجَمَّلْ» عند ابن الأَنْبارِيّ: «لا تظهر الجزع ولكن تجمل وتصبر، وأظهر للناس خلاف ما في قلبك من الحزن والوجد، لئلا يشمت العواذل والعداة بك» [@ibn-al-anbari، ص25]."
