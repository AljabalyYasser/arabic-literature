first: "فَأَضْحَى يَسُحُّ الْمَاءَ حَوْلَ كُتَيْفَةٍ"
second: "يَكُبُّ عَلَى الْأَذْقَانِ دَوْحَ الْكَنَهْبَلِ"
meaning: "فأصبح السحاب يصبّ الماء حول كُتيفة، يقلع الأشجار العظيمة ويلقيها على وجوهها. قال الزَّوْزَنِيّ: «أن سيل هذا الغيث ينصبّ من الجبال والآكام، فيقلع الشجر العظام» [@zawzani، ص75]."
vocabulary:
  - term: "يَسُحُّ"
    text: "«يصب» [@ibn-al-anbari، ص103]."
  - term: "كُتَيْفَةٍ"
    text: "موضع [@ibn-al-anbari، ص104]."
  - term: "يَكُبُّ"
    text: "«يقلعه فيلقيه على وجهه» [@ibn-al-anbari، ص104]."
  - term: "الْأَذْقَانِ"
    text: "جمع ذقن، وهو «مجتمع اللحيين، والأذقان مستعار في البيت للشجر» [@zawzani، ص75]."
  - term: "دَوْحَ"
    text: "«العظام من الشجر، واحدته دوحة» [@ibn-al-anbari، ص104]."
  - term: "الْكَنَهْبَلِ"
    text: "«شجر هو من أعظم العضاه» [@ibn-al-anbari، ص104]. والعِضاه: كل شجر عظيم له شوك."
syntax:
  - "«فَأَضْحَى»: «واسم أضحى مضمر فيه»، أي السحاب، «وخبره ما عاد من يسح، وحول كتيفة صلة يسح» [@ibn-al-anbari، ص104]."
  - "«يَكُبُّ»: «خبر مستأنف، ويجوز أن يكون في موضع نصب... على الحال» [@ibn-al-anbari، ص104]. «والدوح منصوب بيكب، وعلى صلة يكب» [@ibn-al-anbari، ص104]."
morphology:
  - "«كبّ» متعدٍّ و«أكبّ» لازم، «وهذا من النوادر؛ لأن أصله متعد إلى المفعول به ثم لَمَّا نقل بالهمزة إلى باب الأفعال قصر عن الوصول إلى المفعول به، وهذا عكس القياس المطرد» [@zawzani، ص74]. فالقياس أن الهمزة تعدّي اللازم، كقعد وأقعد."
  - "«كُتَيْفَة» على صيغة التصغير."
  - "«يَسُحّ» مضارع المضعف «سحّ»."
rhetoric:
  thesis: "قوة السيل: أعظم الشجر ينكبّ على وجهه."
  devices:
    - title: "الاستعارة في «الأذقان»"
      text: "جعل للشجر أذقانًا يقع عليها، كما يقع الإنسان على وجهه. وهذا من الضرب الذي تجعل فيه للشيء عضوًا ليس له."
    - title: "التشخيص"
      text: "الشجر يسقط كرجل صُرع؛ فالسيل عدوّ يصرع الأقوياء."
    - title: "الفعلان المضارعان"
      text: "«يسحّ... يكبّ»: فعلان مضارعان يجعلان الصب والاقتلاع مستمرين أمام السامع."
  connection: "ثم يقول: «ومر على القنان من نفيانه»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "فَأَضْحَى / يَسُحْحُلْ مَا / ءَ حَوْلَ / كُتَيْفَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — يَكُبْبُ / عَلَلْ أَذْقَا / نِ دَوْحَلْ / كَنَهْبَلِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من الصدر، والأولى من العَجُز [@atiq، ص29]."
context: "قال شوقي ضيف: «والسحاب يسحّ سحّا، حتى لتقتلع سيوله كل ما في طريقها من أشجار العضاه العظيمة» [@deif، ج1 ص256]."
variants:
  - reading: "فَأَضْحَى يَسُحُّ الْمَاءَ عَنْ كُلِّ فِيقَةٍ"
    status: "رواية الأَصْمَعِيّ"
    note: "«والفيقة: ما بين الحلبتين، كأنه يحلب حلبة ويسكن ساعة ثم يحلب أخرى. يعنى السحاب، وذلك أشد المطر» [@ibn-al-anbari، ص103]. وبها يرويه شوقي ضيف [@deif، ج1 ص255]."
  - reading: "فَأَضْحَى يَسُحُّ الْمَاءَ مِنْ كُلِّ تَلْعَةٍ"
    status: "رواية أبي عُبَيْدة"
    note: "«والتلعة: مسيل الماء» [@ibn-al-anbari، ص103]."
