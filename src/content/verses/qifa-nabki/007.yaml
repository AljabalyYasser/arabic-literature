first: "كَدَأْبِكَ مِنْ أُمِّ الْحُوَيْرِثِ قَبْلَهَا"
second: "وَجَارَتِهَا أُمِّ الرَّبَابِ بِمَأْسَلِ"
meaning: "حالك مع هذه الحبيبة كحالك من قبلها مع أم الحُوَيْرِث وجارتها أم الرَّباب بمأسل: قليل من الوصال، وكثير من الوجد. قال الزَّوْزَنِيّ: «عادتك في حب هذه كعادتك من تينك، أي قلة حظك من وصال هذه ومعاناتك الوجد بها كقلة حظك من وصالهما» [@zawzani، ص38]."
vocabulary:
  - term: "دَأْبِكَ"
    text: "الدأب: «العادة، وأصلها متابعة العمل والجد في السعي» [@zawzani، ص38]."
  - term: "أُمِّ الْحُوَيْرِثِ"
    text: "قال ابن الكَلْبِيّ: هي أم الحارِث بن حصن الكَلْبِيّ، وقال غيره: هي وأم الرَّباب امرأتان من كلب [@ibn-al-anbari، ص28]."
  - term: "مَأْسَلِ"
    text: "«جبل بعينه» [@zawzani، ص38]، وعند ابن الأَنْبارِيّ: موضع."
syntax:
  - "«كَدَأْبِكَ»: الكاف حرف جر للتشبيه، و«دأبِ» مجرور بها، والكاف في آخره مضاف إليه. والجار والمجرور متعلق بمحذوف يدل عليه ما قبله، والتقدير: حالك في هذه كدأبك. قال ابن الأَنْبارِيّ: «الكاف صلة للكلام الذي قبلها»، ومثّل بقوله تعالى: «كَدَأْبِ آلِ فِرْعَوْنَ» [@ibn-al-anbari، ص27–28]."
  - "«مِنْ أُمِّ الْحُوَيْرِثِ»: متعلق بـ«دأبك». و«قَبْلَهَا» ظرف متعلق بمحذوف حال."
  - "«وَجَارَتِهَا»: معطوف على «أم الحُوَيْرِث». و«أُمِّ الرَّبَابِ» بدل منها؛ قال ابن الأَنْبارِيّ: «وأم الرَّباب مترجمة عن الجارة» [@ibn-al-anbari، ص28]، أي مبيّنة لها."
  - "«بِمَأْسَلِ»: متعلق بمحذوف حال، وجُرّ بالكسرة للقافية."
morphology:
  - "«دأب» مصدر «دأب يدأب»، ويقال الدأْب والدأَب بتسكين الهمزة وفتحها [@zawzani، ص38]."
  - "«الْحُوَيْرِث» تصغير «الحارِث» على «فُوَيْعِل»."
  - "«مَأْسَل» اسم موضع على «مَفْعَل»."
rhetoric:
  thesis: "يخرج من الأطلال إلى تاريخ قلبه: هذه الحبيبة ليست الأولى، وحظه منها حظه ممن قبلها."
  devices:
    - title: "تشبيه الحال بالعادة"
      text: "جعل حاله الآن صورة مكررة من حال قديمة، واختار لفظ «الدأب»، وهو المداومة؛ فالحب عنده عادة تتكرر، والخيبة معه."
    - title: "الحذف"
      text: "لم يذكر المشبَّه، بل تركه لما قبله: حاله عند الديار وبكاؤه. فالبيت يبدأ بالكاف كأنه يكمل جملة لم تنقطع."
    - title: "الأسماء والمواضع"
      text: "أم الحُوَيْرِث، وأم الرَّباب، ومأسل: أسماء محددة تجعل الذكرى واقعة لا خيالًا."
  connection: "ثم يصف المرأتين: «إذا قامتا تضوّع المسك منهما»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "كَدَأْ بِ / كَ مِنْ أُمْ مِلْ / حُوَيْ رِ / ثِ قَبْلَهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَجَا رَ / تِهَا أُمْ مِرْ / رَبَا بِ / بِمَأْسَلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الشطرين، وهو جائز في حشو الطويل [@atiq، ص29]."
context: "يأتي بعد قوله: «وإنّ شفائي عَبْرة مُهَراقة / فهل عند رسم دارس من مُعَوَّل»، فيربط بكاءه الحاضر ببكاء قديم."
variants:
  - reading: "كَدِينِكَ مِنْ أُمِّ الْحُوَيْرِثِ قَبْلَهَا"
    status: "رواية أبي عُبَيْدة"
    note: "«يريد: كدأبك وحالك وعادتك» [@ibn-al-anbari، ص28]."
