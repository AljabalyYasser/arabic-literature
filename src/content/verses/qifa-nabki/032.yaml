first: "تَصُدُّ وَتُبْدِي عَنْ أَسِيلٍ وَتَتَّقِي"
second: "بِنَاظِرَةٍ مِنْ وَحْشِ وَجْرَةَ مُطْفِلِ"
meaning: "تعرض عنا، فتظهر في إعراضها خدًّا أسيلًا، وتلقانا بعين كعين ظبية من ظباء وَجْرة لها طفل. قال الزَّوْزَنِيّ: «تعرض عنا فتظهر في إعراضها خدًّا أسيلًا، وتستقبلنا بعين مثل عيون ظباء وَجْرة أو مهاها اللواتي لها أطفال» [@zawzani، ص54]."
vocabulary:
  - term: "تَصُدُّ"
    text: "تعرض [@zawzani، ص53]."
  - term: "تُبْدِي"
    text: "تُظهر [@zawzani، ص53]."
  - term: "أَسِيلٍ"
    text: "«الأسالة: امتداد وطول في الخد» [@zawzani، ص53]."
  - term: "تَتَّقِي"
    text: "تجعل بيننا وبينها حاجزًا؛ «يقال: اتقيته بترس، أي جعلت الترس حاجزًا بيني وبينه» [@zawzani، ص53]."
  - term: "وَجْرَةَ"
    text: "موضع [@ibn-al-anbari، ص59]."
  - term: "مُطْفِلِ"
    text: "ذات طفل [@ibn-al-anbari، ص59]."
syntax:
  - "«تَصُدُّ»: مضارع، وفاعله ضمير يعود على المرأة. و«تُبْدِي» و«تَتَّقِي» معطوفان عليه [@ibn-al-anbari، ص60]."
  - "«عَنْ أَسِيلٍ»: متعلق بـ«تبدي»، و«أسيل» صفة لموصوف محذوف، أي: عن خد أسيل."
  - "«بِنَاظِرَةٍ»: متعلق بـ«تتقي»، و«ناظرة» صفة لموصوف محذوف، أي: بعين ناظرة. و«مِنْ وَحْشِ» متعلق بمحذوف صفة لها."
  - "«وَجْرَةَ»: مضاف إليه مجرور بالفتحة، لأنه ممنوع من الصرف «للتعريف والتأنيث» [@ibn-al-anbari، ص60]. و«مُطْفِلِ» نعت لـ«ناظرة» [@ibn-al-anbari، ص60]."
morphology:
  - "«أَسِيل» صفة مشبهة على «فعيل» من «أسُل»."
  - "«مُطْفِل» اسم فاعل من «أطفل»: صارت ذات طفل."
  - "«تَتَّقِي» على «تَفْتَعِل» من «وقى»، أصله «تَوْتَقِي»، قُلبت الواو تاء وأُدغمت في تاء الافتعال."
rhetoric:
  thesis: "صورة حركة: تعرض عنه، وفي إعراضها نفسه يظهر جمالها."
  devices:
    - title: "الطباق"
      text: "بين «تصدّ» و«تبدي»: الإعراض والإظهار في لحظة واحدة. فالإعراض لا يخفيها، بل يكشف خدها."
    - title: "حذف الموصوف"
      text: "قال «عن أسيل» و«بناظرة»، ولم يذكر الخد والعين؛ فالصفة وحدها تكفي، ويكمل السامع الصورة."
    - title: "التشبيه بالمُطْفِل"
      text: "«والمطفل أحسن نظرًا من غيرها، لحسن نظرها إلى طفلها من الرقة والشفقة» [@ibn-al-anbari، ص59]. فعينها مع جمالها حانية."
  connection: "ثم يصف عنقها: «وجيد كجيد الرِّيم»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "تَصُدْ دُ / وَتُبْدِي عَنْ / أَسِيلِنْ / وَتَتْتَقِي = فعولُ / مفاعيلن / فعولن / مفاعلن — بِنَا ظِ / رَتِنْ مِنْ وَحْ / شِ وَجْ رَ / تَ مُطْفِلِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» ثلاث مرات [@atiq، ص29]."
variants:
  - reading: "تَصَدَّى وَتُبْدِي عَنْ أَسِيلٍ"
    status: "رواية"
    note: "«يريد تتصدّى، أي تتعرض لتنظر» [@ibn-al-anbari، ص60]."
  - reading: "وَتُبْدِي عَنْ شَتِيتٍ"
    status: "رواية"
    note: "«أي عن ثغر شتيت، أي متفرق ما بين الثنيتين» [@ibn-al-anbari، ص60]."
