first: "يُضِيءُ سَنَاهُ أَوْ مَصَابِيحُ رَاهِبٍ"
second: "أَمَالَ السَّلِيطَ بِالذُّبَالِ الْمُفَتَّلِ"
meaning: "يضيء ضوء هذا البرق، أو كأنه مصابيح راهب صبّ الزيت على فتائلها فاشتد نورها. قال الزَّوْزَنِيّ: «يريد أن تحرك البرق يحكي تحرك اليدين وضوءه يحكي ضوء مصباح الراهب إذا أفعم صبُّ الزيت عليه فيضيء» [@zawzani، ص73]. وأُفعم: مُلئ."
vocabulary:
  - term: "سَنَاهُ"
    text: "«السنا: الضوء» [@ibn-al-anbari، ص100]."
  - term: "السَّلِيطَ"
    text: "«الزيت»، «وعند أهل اليمن: دهن السمسم» [@ibn-al-anbari، ص101]."
  - term: "الذُّبَالِ"
    text: "«الفتائل، واحدتها ذبالة» [@ibn-al-anbari، ص101]."
  - term: "أَمَالَ"
    text: "صبّ وأكثر. وفيه أقوال، انظر لسان «البلاغة» ولسان «الروايات»."
syntax:
  - "«والسنا مرتفع بيضيء» [@ibn-al-anbari، ص101]، أي فاعل."
  - "«أَوْ مَصَابِيحُ»: بالرفع «منسوقة على ما في الكاف من ذكر البرق»، أي على البرق في البيت السابق «كلمع اليدين»؛ ومن جرّها جعلها «منسوقة على اللمع، كأنه قال: كلمع اليدين أو مصابيح راهب» [@ibn-al-anbari، ص100]."
  - "«أَمَالَ السَّلِيطَ»: «والسليط منصوب بأمال، والباء صلة أمال» [@ibn-al-anbari، ص101]. والجملة صفة للراهب."
morphology:
  - "«سَنا» مقصور «يكتب بالألف. ويقال في تثنيته: سنوان»، «والسناء من المجد والشرف ممدود» [@ibn-al-anbari، ص100]."
  - "«الذُّبال» جمع «ذُبالة»، «وقد يثقل فيقال ذبَّال» [@zawzani، ص73]."
  - "«الْمُفَتَّل» اسم مفعول من المضعف «فتّل»."
rhetoric:
  thesis: "التشبيه الثاني للبرق: كان في البيت السابق حركة، وهو هنا نور."
  devices:
    - title: "تشبيهان لجهتين"
      text: "شبّه البرق في حركته بلمع اليدين، وفي ضوئه بمصابيح الراهب [@zawzani، ص73]. فكل تشبيه يأخذ من البرق صفة."
    - title: "القلب"
      text: "«وزعم أكثر الناس أن قوله أمال السليط بالذبال المفتل من المقلوب، وتقديره: أمال الذبال بالسليط إذا صبَّه عليه» [@zawzani، ص73]. والقلب أن يُجعل أحد طرفي الكلام مكان الآخر."
    - title: "استعارة في «أمال»"
      text: "يرى شوقي ضيف أن رواية «أمال» إن صحّت ففيها «استعارة بديعة، لأن من معاني أمال رعى، وكأنه استعار صورة رعي الأنعام للنبات لما يفنيه الذبال من الزيت شيئا فشيئا» [@deif، ج1 ص264]؛ أي أن الفتيلة ترعى الزيت كما ترعى الماشية العشب."
  connection: "ثم يقول: «قعدت له وصحبتي بين ضارج / وبين العذيب بُعد ما متأمَّل»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "يُضِيءُ / سَنَاهُ أَوْ / مَصَابِي / حُ رَاهِبِنْ = فعولُ / مفاعلن / فعولن / مفاعلن — أَمَالَسْ / سَلِيطَ بِذْ / ذُبَالِلْ / مُفَتْتَلِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الأولى من الصدر [@atiq، ص29]، ودخل «مفاعيلن» في التفعيلة الثانية من الشطرين فصارت «مفاعلن» [@ahda-sabil، ص28]."
context: "صورة مصباح الراهب مرت بنا في البيت 39: «منارة ممسى راهب متبتل». فالراهب الذي يسهر على سراجه صورة يعود إليها الشاعر للنور في الظلام."
variants:
  - reading: "أَهَانَ السَّلِيطَ بِالذُّبَالِ الْمُفَتَّلِ"
    status: "رواية الأَصْمَعِيّ"
    note: "«ومعنى قوله أهان السليط: لم يكن عنده عزيزا، يعنى إنه لا يكرمه عن استعماله وإتلافه في الوقود». وقال الأَصْمَعِيّ: «وليس قوله أمال السليط بشيء، ولا معنى له» [@ibn-al-anbari، ص101]. أما شوقي ضيف فيرى «أمال» «أجود» [@deif، ج1 ص255، الحاشية]."
  - reading: "أَوْ مَصَابِيحِ رَاهِبٍ"
    status: "بالجر"
    note: "عطفًا على «لمع اليدين» [@ibn-al-anbari، ص100]."
