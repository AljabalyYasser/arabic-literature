first: "لَأَسْتَشْعِرَنْ أَعْلَى دَرِيسَيَّ مُسْلِمًا"
second: "لِوَجْهِ الَّذِي يُحْيِي الْأَنَامَ وَيَقْتُلُ"
meaning: "لألبسنّ أخلق ثوبيّ وأنا مسلم، أي لأنامنّ في ثيابي متوكلًا، مسلمًا وجهي للذي يحيي الناس ويميتهم. قال السُّكَّرِيّ: «الدَّريس: الثوب الخَلَق. يقول: لألبسنّ ثوبي على الإسلام» [@diwan-kaab، ص56]. ويرى المحققون عبارة الأحول «أوفى وأتم»: «يقول أتوكل على الله وأنام مسلمًا وجهي له إنه يفعل ما يشاء يميت ويحيي» [@diwan-kaab، ص56]."
vocabulary:
- term: "أَسْتَشْعِرَنْ"
  text: "ألبسنّ، و«استشعر الثوب: لبسه» كما يقول المحققون [@diwan-kaab، ص56]؛ والشِّعار: الثوب الذي يلي الجسد."
- term: "دَرِيسَيَّ"
  text: "مثنى دريس، وهو «الثوب الخَلَق» [@diwan-kaab، ص56]."
- term: "الْأَنَامَ"
  text: "الناس."
context: "المحلوف عليه في البيت السابق، وأوضح أبيات المقطع في الإسلام. وهو عند ضَيْف ثاني الأبيات التي أُدخلت بعد إسلامه، ويقول في حاشيته: «كنى بذلك عن حسن إسلامه وتوكله على الله الذى يحيى ويميت» [@deif، ج2 ص87]."
syntax:
- "«لَأَسْتَشْعِرَنْ»: اللام واقعة في جواب القسم في البيت السابق، والفعل مؤكد بالنون الخفيفة. و«أَعْلَى» مفعول به، و«دَرِيسَيَّ» مضاف إليه."
- "«مُسْلِمًا» حال من الفاعل، و«لِوَجْهِ الَّذِي» متعلق بـ«مسلمًا»، و«يُحْيِي الْأَنَامَ وَيَقْتُلُ» صلة."
morphology:
- "«أَسْتَشْعِرَنْ» على «أَسْتَفْعِل» من الشِّعار، والسين والتاء للاتخاذ."
- "«دَرِيسَيَّ» مثنى «دَرِيس» مضاف إلى ياء المتكلم، أُدغمت ياء التثنية في ياء المتكلم."
rhetoric:
  thesis: "صورة التوكل: الرجل ينام في ثيابه البالية في الصحراء، وقد أسلم وجهه لله."
  devices:
  - title: "الكناية في «لَأَسْتَشْعِرَنْ أَعْلَى دَرِيسَيَّ»"
    text: "لبس الثوب الأعلى كناية عن النوم في ثيابه دون حراسة، أي الاطمئنان. ويقول ضَيْف إنه كنّى بذلك «عن حسن إسلامه» [@deif، ج2 ص87]."
  - title: "الطباق في «يُحْيِي ... وَيَقْتُلُ»"
    text: "الإحياء والإماتة بيد الله: فلا معنى للحراسة إذا كان الموت والحياة بيده."
  - title: "«مُسْلِمًا لِوَجْهِ»"
    text: "عبارة قريبة من لفظ القرآن في إسلام الوجه لله، كما في قوله تعالى: ﴿بَلَىٰ مَنْ أَسْلَمَ وَجْهَهُ لِلَّهِ وَهُوَ مُحْسِنٌ﴾ (البقرة: 112). ونذكر الآية للفظ وحده."
  connection: "ثم يصف الله الحافظ للنائم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "لَأَسْتَشْ / عِرَنْ أَعْلَا / دَرِيسَيْ / يَ مُسْلِمَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — لِوَجْهِلْ / لَذِي يُحْيِلْ / أَنَامَ / وَيَقْتُلُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "«لَأَسْتَشْ» فعولن، و«عِرَنْ أَعْلَا» مفاعيلن. و«دَرِيسَيْ / يَ مُسْلِمَنْ» فعولن مفاعلن."
