first: "إِذَا غَلَبَتْهُ الْكَأْسُ لَا مُتَعَبِّسٌ"
second: "حَصُورٌ وَلَا مِنْ دُونِهَا يَتَبَسَّلُ"
vocabulary:
- term: "حَصُورٌ"
  text: "«الضيّق»، و«البخيل الذي لا ينفق مع القوم» [@diwan-kaab، ص44]."
- term: "يَتَبَسَّلُ"
  text: "قيل: يعبس ويكره منظره، وقيل: «يتشجّع، أُخذ من الباسل» [@diwan-kaab، ص44]."
