first: "هُوَ الْحَافِظُ الْوَسْنَانَ بِاللَّيْلِ مَيِّتًا"
second: "عَلَى أَنَّهُ حَيٌّ مِنَ النَّوْمِ مُثْقَلُ"
meaning: "هو الحافظ للنائم بالليل، وهو كالميت، مع أنه حيّ أثقله النوم. قال السُّكَّرِيّ: «يقول: إن الله جلّ وعزّ هو الحافظ. والوَسَن: النوم»، «يقول: إذا نام الإنسان فهو كالميت» [@diwan-kaab، ص56]."
vocabulary:
- term: "الْوَسْنَانَ"
  text: "النائم، «والوَسَن: النوم، والسِّنة: اختلاط النوم بالعين» [@diwan-kaab، ص56]."
- term: "مُثْقَلُ"
  text: "أثقله النوم."
context: "الثالث من الأبيات الأربعة عند ضَيْف [@deif، ج2 ص87]، وفيه صفة الله الحافظ للنائم."
syntax:
- "«هُوَ» مبتدأ يعود على «الذي يحيي الأنام» في البيت السابق، و«الْحَافِظُ» خبر، و«الْوَسْنَانَ» مفعول به لاسم الفاعل."
- "«مَيِّتًا» حال من «الوسنان»، و«بِاللَّيْلِ» ظرف. و«عَلَى أَنَّهُ حَيٌّ» استدراك على «ميتًا»، و«مُثْقَلُ» خبر ثانٍ لـ«أنّ»."
morphology:
- "«الْحَافِظُ» اسم فاعل عمل عمل فعله فنصب «الوسنان»."
- "«الْوَسْنَانَ» صفة مشبهة على «فَعْلان»."
rhetoric:
  thesis: "النوم موت صغير، والله يحفظ الإنسان فيه."
  devices:
  - title: "التشبيه البليغ في «مَيِّتًا»"
    text: "جعل النائم ميتًا بلا أداة، ثم استدرك بأنه حي. فالنوم يقرّب من الموت، والحفظ فيه من الله وحده. ويقول السُّكَّرِيّ: «إذا نام الإنسان فهو كالميت» [@diwan-kaab، ص56]."
  - title: "الطباق في «مَيِّتًا ... حَيٌّ»"
    text: "الكلمتان في شطرين متقابلين، تجمعان حال النائم: ميت في غيابه، حي في جسده."
  connection: "ثم يذكر ما يحفظه منه: الحية التي تسري ليلًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "هُوَلْ حَا / فِظُلْ وَسْنَا / نَ بِلْلَيْ / لِ مَيْيِتَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — عَلَا أَنْ / نَهُو حَيْيُنْ / مِنَنْ نَوْ / مِ مُثْقَلُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "البيت كله على التفعيلات التامة إلا الضرب «مُثْقَلُو» مفاعلن، وهو ضرب الطويل المقبوض."
variants:
- reading: "هُوَ الْكَالِئُ الْوَسْنَانَ لَيْلًا وَقَلْبُهُ"
  status: "رواية"
  note: "«ويروى: * هو الكالئ الوسنان ليلًا وقلبه *» [@diwan-kaab، ص56]."
