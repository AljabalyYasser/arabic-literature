first: "يُقَوِّمُهَا حَتَّى تَقُومَ مُتُونُهَا"
second: "فَيَقْصُرُ عَنْهَا كُلُّ مَا يُتَمَثَّلُ"
vocabulary:
- term: "يُقَوِّمُهَا"
  text: "«يعني القوافي. يريد أنه يقوّمها كما تقوّم السهام» [@diwan-kaab، ص60]."
- term: "يُتَمَثَّلُ"
  text: "«يُضرب مثلًا» كما يقول المحققون [@diwan-kaab، ص60]."
