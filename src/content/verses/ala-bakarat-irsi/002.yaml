first: "وَلَمَّا رَأَتْ رَأْسِي تَبَدَّلَ لَوْنُهُ"
second: "بَيَاضًا عَنِ اللَّوْنِ الَّذِي كَانَ أَوَّلُ"
meaning: "ولما رأت رأسي تغير لونه إلى البياض عن اللون الأسود الذي كان عليه أولًا..."
vocabulary:
- term: "تَبَدَّلَ لَوْنُهُ"
  text: "تغير لونه."
- term: "أَوَّلُ"
  text: "قبلُ، في أول أمره."
context: "يذكر سبب اللوم: الشيب. وجواب «لمّا» في البيت التالي: «أرنّت»."
syntax:
- "«لَمَّا» ظرف بمعنى حين يتضمن معنى الشرط، وجوابها «أرنّت» في البيت التالي."
- "«رَأْسِي» مفعول «رأت»، وجملة «تَبَدَّلَ لَوْنُهُ» حال أو مفعول ثانٍ، و«بَيَاضًا» تمييز أو مفعول به لـ«تبدّل»."
- "«أَوَّلُ» ظرف مبني على الضم لقطعه عن الإضافة، أي أوّلَ الأمر، والجملة صلة «الذي» بتقدير: كان عليه أولُ."
morphology:
- "«أَوَّلُ» على «أَفْعَل»، وبُني على الضم كـ«قبلُ» و«بعدُ»."
- "«تَبَدَّلَ» على «تَفَعَّلَ»."
rhetoric:
  thesis: "يصف الشيب بلغة التبديل لا الهرم: لون حلّ محل لون."
  devices:
  - title: "الكناية في «تَبَدَّلَ لَوْنُهُ بَيَاضًا»"
    text: "لم يقل «شاب»، بل وصف التغيّر، وترك السامع يفهم الشيب."
  connection: "ثم يأتي جواب «لمّا»: صرخت جزعًا، فيرد عليها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "وَلَمْمَا / رَأَتْ رَأْسِي / تَبَدْدَ / لَ لَوْنُهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — بَيَاضَنْ / عَنِلْ لَوْنِلْ / لَذِي كَا / نَ أَوْوَلُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "«وَلَمْمَا» فعولن تامة، و«رَأَتْ رَأْسِي» مفاعيلن تامة، و«تَبَدْدَ» فعولُ مقبوضة."
