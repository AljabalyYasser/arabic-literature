explained: false
first: "وَجَحْلٌ سَلِيمٌ قَدْ كَشَفْنَا جِلَالَهُ"
second: "وَآخَرُ فِي أَنْضَاءِ مِسْحٍ مُسَرْبَلُ"
vocabulary:
- term: "جَحْلٌ"
  text: "«الزِّق» [@diwan-kaab، ص45]، أي قربة الخمر."
- term: "جِلَالَهُ"
  text: "«جمع جُلّ وهو الغطاء» كما يقول المحققون [@diwan-kaab، ص45]."
- term: "أَنْضَاءِ مِسْحٍ"
  text: "«أنضاؤه: خُلقانه» [@diwan-kaab، ص45]، و«المِسْح: كساء من شعر» [@diwan-kaab، ص45]."
