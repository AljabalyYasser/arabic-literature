first: "أَلَا بَكَرَتْ عِرْسِي تَلُومُ وَتَعْذُلُ"
second: "وَغَيْرُ الَّذِي قَالَتْ أَعَفُّ وَأَجْمَلُ"
meaning: "بكّرت امرأتي في الصباح تلومني وتعذلني، وغير ما قالته أعفّ وأجمل بها."
vocabulary:
- term: "بَكَرَتْ"
  text: "جاءت في البُكرة، أي أول النهار."
- term: "عِرْسِي"
  text: "امرأتي؛ والعِرْس: الزوجة."
- term: "تَعْذُلُ"
  text: "تلوم، والعذل: اللوم."
context: "مطلع لامية طويلة يقول شوقي ضَيْف إنها «يظهر أنه نظمها فى الجاهلية لما يذكر فيها من شربه الخمر مع من يصطفيه» [@deif، ج2 ص87]. وتبدأ بالعاذلة على عادة الشعراء: امرأة تلوم الشاعر، فيجيبها بما يكشف حياته."
syntax:
- "«أَلَا» حرف استفتاح وتنبيه، و«عِرْسِي» فاعل «بكرت»، وجملتا «تَلُومُ وَتَعْذُلُ» حال."
- "«وَغَيْرُ الَّذِي قَالَتْ أَعَفُّ وَأَجْمَلُ»: «غير» مبتدأ، و«الذي» مضاف إليه، و«أعفّ» خبر، و«أجمل» معطوف عليه، والعائد محذوف أي قالته."
morphology:
- "«أَعَفُّ» و«أَجْمَلُ» اسما تفضيل على «أَفْعَل»، حُذف المفضّل عليه للعلم به، أي أعفّ من قولها."
- "«تَعْذُلُ» مضارع «عَذَلَ» من باب نَصَرَ."
rhetoric:
  thesis: "افتتاح هادئ بعتاب الزوجة، يرد عليه الشاعر بنصيحة مهذبة بدل الغضب."
  devices:
  - title: "الحذف في «أَعَفُّ وَأَجْمَلُ»"
    text: "لم يقل «أعف من قولك»، فترك اللوم ضمنيًا، وجاء الرد لينًا. وهذا من الحذف الذي يقول فيه عبد القاهر الجُرْجانيّ: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
  - title: "«تَلُومُ وَتَعْذُلُ»"
    text: "فعلان متقاربان في المعنى، يصوران كثرة اللوم وإلحاحه."
  connection: "ثم يذكر سبب لومها: رأت رأسه قد شاب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "أَلَا بَ / كَرَتْ عِرْسِي / تَلُومُ / وَتَعْذُلُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَغَيْرُلْ / لَذِي قَالَتْ / أَعَفْفُ / وَأَجْمَلُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "البيت مصرّع: «تَعْذُلُ» و«أَجْمَلُ». و«أَلَا بَ» فعولُ مقبوضة، والقبض حذف الخامس الساكن من «فعولن»."
variants:
