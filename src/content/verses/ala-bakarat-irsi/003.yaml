first: "أَرَنَّتْ مِنَ الشَّيْبِ الْعَجِيبِ الَّذِي رَأَتْ"
second: "وَهَلْ أَنْتِ مِنِّي وَيْبَ غَيْرِكِ أَمْثَلُ"
meaning: "صاحت جزعًا من الشيب العجيب الذي رأته، وهل أنتِ، ويحك، بأحسن مني حالًا؟ قال السُّكَّرِيّ: «أرنّت: صوّتت وأظهرت من ذلك جزعًا. يقول: قد أصابك ما أصابني من الكِبَر والشيب فلستِ بأمثل مني في ذلك» [@diwan-kaab، ص41]."
vocabulary:
- term: "أَرَنَّتْ"
  text: "«صوّتت وأظهرت من ذلك جزعًا» [@diwan-kaab، ص41]."
- term: "وَيْبَ غَيْرِكِ"
  text: "كلمة تقال للذم والتعجب، يقصد بها نفسها ويوجهها إلى غيرها تلطفًا. وينقل السُّكَّرِيّ عن الخليل أن العرب قالت «ويل» للذم والسب، «ثم استقبحتها فقالت مكانها «ويح»، ثم كثرت «ويح» فجعلت مكانها «ويس»، ثم كثرت «ويس» فجعلت مكانها «ويب»» [@diwan-kaab، ص41–42]."
- term: "أَمْثَلُ"
  text: "أفضل وأحسن حالًا."
context: "جواب «لمّا» في البيت السابق، والرد على العاذلة: الشيب أصابها هي أيضًا. والكلمة نفسها «ويب غيرك» في أبياته إلى بجير «على أي شيء ويب غيرك دلّكا» [@diwan-kaab، ص4]."
syntax:
- "«أَرَنَّتْ» جواب «لمّا»، و«مِنَ الشَّيْبِ» متعلق به، و«الَّذِي رَأَتْ» صفة للشيب."
- "«وَهَلْ أَنْتِ مِنِّي ... أَمْثَلُ»: استفهام إنكاري، و«أنت» مبتدأ، و«أمثل» خبر، و«منّي» متعلق بـ«أمثل»، و«وَيْبَ غَيْرِكِ» معترضة، و«ويب» مفعول مطلق لفعل محذوف."
morphology:
- "«أَرَنَّتْ» ماض رباعي «أَرَنَّ» من الرنين."
- "«أَمْثَلُ» اسم تفضيل من «مَثُلَ» إذا فضل."
rhetoric:
  thesis: "يقلب اللوم على اللائمة: كلاكما كبر."
  devices:
  - title: "الاستفهام الإنكاري في «وَهَلْ أَنْتِ مِنِّي ... أَمْثَلُ»"
    text: "لا يسأل، بل ينفي: لستِ أحسن مني."
  - title: "التلطف في «وَيْبَ غَيْرِكِ»"
    text: "دعاء عليها في صورة دعاء على غيرها، فيجمع بين العتاب والرفق."
  connection: "ثم يصف الشيب الذي علاهما معًا بصورة السهام."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "أَرَنْنَتْ / مِنَشْ شَيْبِلْ / عَجِيبِلْ / لَذِي رَأَتْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَهَلْ أَنْ / تِ مِنْنِي وَيْ / بَ غَيْرِ / كِ أَمْثَلُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "«وَهَلْ أَنْ» فعولن، و«تِ مِنْنِي وَيْ» مفاعيلن، و«بَ غَيْرِ» فعولُ مقبوضة."
variants:
- reading: "فَهَلْ أَنْتِ مِنِّي لَا أَبَا لَكِ أَمْثَلُ"
  status: "رواية الأَصْمَعِيّ"
  note: "«وروى الأصمعي: «فهل أنت مني لا أبا لك»» [@diwan-kaab، ص41]."
