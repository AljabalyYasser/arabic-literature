first: "مِنَ الْأَسْوَدِ السَّارِي وَإِنْ كَانَ ثَائِرًا"
second: "عَلَى حَدِّ نَابَيْهِ السِّمَامُ الْمُثَمَّلُ"
meaning: "...يحفظه من الحية السوداء التي تسري بالليل، وإن كانت هائجة، على حدّ نابيها السمّ المجتمع. قال السُّكَّرِيّ: «الأسود: الحية. والساري: الذي يأتي ليلًا»، «والمُثَمَّل: المجمَّع. يقول: الله الحافظ من هذه الأشياء المهلكة» [@diwan-kaab، ص57]."
vocabulary:
- term: "الْأَسْوَدِ"
  text: "«الحية» [@diwan-kaab، ص57]، وفي حاشية ضَيْف: «الأسود: الأفعى» [@deif، ج2 ص87]."
- term: "السَّارِي"
  text: "«الذي يأتي ليلًا في أي وقت كان» [@diwan-kaab، ص57]."
- term: "ثَائِرًا"
  text: "«الطالب بثأر، وهو هنا غير طالب، وهو ظالم لا يبالي من أصاب»، و«يكون ثائر بمعنى ثار من مكانه» [@diwan-kaab، ص57]."
- term: "السِّمَامُ"
  text: "السمّ، جمع سمّ."
- term: "الْمُثَمَّلُ"
  text: "«المجمَّع» [@diwan-kaab، ص57]."
context: "آخر الأبيات الأربعة عند ضَيْف [@deif، ج2 ص87]، وفيه ما يُحفظ منه النائم في الصحراء: الحية. ثم يعود في البيت 43 إلى الرحيل عند السحر، وبه تنتهي رواية أهل الكوفة."
syntax:
- "«مِنَ الْأَسْوَدِ» متعلق بـ«الحافظ» في البيت السابق، و«السَّارِي» صفة."
- "«وَإِنْ كَانَ ثَائِرًا» شرط حُذف جوابه. و«عَلَى حَدِّ نَابَيْهِ» خبر مقدم، و«السِّمَامُ» مبتدأ مؤخر، و«المثمّل» صفته، والجملة صفة ثانية للأسود."
morphology:
- "«نَابَيْهِ» مثنى «ناب» مجرور بالياء، وحُذفت النون للإضافة."
- "«الْمُثَمَّلُ» اسم مفعول من «ثَمَّلَ» المضعّف."
rhetoric:
  thesis: "يختم المقطع الإسلامي بأشد أخطار الليل: الحية. فإذا كان الله يحفظ منها فهو يحفظ من كل شيء."
  devices:
  - title: "الكناية في «الْأَسْوَدِ السَّارِي»"
    text: "لم يسمّ الحية، بل ذكر لونها ووقت خروجها، فصار الخطر صفة تتحرك في الظلام."
  - title: "«عَلَى حَدِّ نَابَيْهِ السِّمَامُ الْمُثَمَّلُ»"
    text: "صورة دقيقة: السمّ مجتمع على طرف الناب. فالخطر يُرى قريبًا، ويزيد بذلك معنى الحفظ في البيت السابق."
  connection: "ثم يعود إلى الرحلة: لما استدار الفرقدان زجر ناقته ورحل."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "مِنَلْ أَسْ / وَدِسْ سَارِي / وَإِنْ كَا / نَ ثَائِرَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — عَلَا حَدْ / دِ نَابَيْهِسْ / سِمَامُلْ / مُثَمْمَلُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "البيت على التفعيلات التامة: «مِنَلْ أَسْ» فعولن، و«وَدِسْ سَارِي» مفاعيلن."
