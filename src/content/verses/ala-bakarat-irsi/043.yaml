explained: false
first: "فَلَمَّا اسْتَدَارَ الْفَرْقَدَانِ زَجَرْتُهَا"
second: "وَهَبَّ سِمَاكٌ ذُو سِلَاحٍ وَأَعْزَلُ"
vocabulary:
- term: "الْفَرْقَدَانِ"
  text: "نجمان قريبان من القطب الشمالي يُهتدى بهما، كما يقول المحققون [@diwan-kaab، ص57]؛ واستدارتهما «للغروب وذلك عند الصباح» [@diwan-kaab، ص57]."
- term: "سِمَاكٌ ذُو سِلَاحٍ وَأَعْزَلُ"
  text: "«وذو سلاح يعني السِّماك الرامح الذي بين يديه كواكب مستطيلة كالرمح. والأعزل: السماك الأعزل الذي لا كواكب أمامه» [@diwan-kaab، ص57]."
sources:
