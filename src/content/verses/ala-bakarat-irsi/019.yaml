first: "كَسُوبٌ إِلَى أَنْ شَبَّ مِنْ كَسْبِ وَاحِدٍ"
second: "مُحَالِفُهُ الْإِقْتَارُ لَا يَتَمَوَّلُ"
vocabulary:
- term: "كَسُوبٌ"
  text: "«وقوله: من كسب واحد أي من كسبة واحدة لم يعنه على ذلك أحد» [@diwan-kaab، ص48]."
- term: "مُحَالِفُهُ الْإِقْتَارُ"
  text: "يلازمه الفقر، «ثم وصف نفسه بالإقتار ومحالفة الفقر له» [@diwan-kaab، ص49]."
