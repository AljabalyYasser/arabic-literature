explained: false
first: "فَلَمْ يَجِدَا إِلَّا مُنَاخَ مَطِيَّةٍ"
second: "تَجَافَى بِهَا زَوْرٌ نَبِيلٌ وَكَلْكَلُ"
vocabulary:
- term: "تَجَافَى"
  text: "«عن الأرض وذاك أكرم لها، أي لم ترم بنفسها» [@diwan-kaab، ص52]."
- term: "زَوْرٌ نَبِيلٌ وَكَلْكَلُ"
  text: "«والزَّوْر والكَلْكَل بعضه قريب من بعض» [@diwan-kaab، ص52]، و«نبيل: ضخم جسيم» كما يقول المحققون [@diwan-kaab، ص52]."
