explained: false
first: "قَطَعْتُ يُمَاشِينِي بِهَا مُتَضَائِلٌ"
second: "مِنَ الطُّلْسِ أَحْيَانًا يَخُبُّ وَيَعْسِلُ"
vocabulary:
- term: "مُتَضَائِلٌ"
  text: "«النحيف»، «وإنما يريد أنه قطع هذه الفلاة الصرماء فلم يجد فيها غير الذئب» [@diwan-kaab، ص46]."
- term: "الطُّلْسِ"
  text: "«الأطلس: الذي في لونه طُلسة، وهي غُبرة تعلوها كدرة» [@diwan-kaab، ص46–47]."
- term: "يَعْسِلُ"
  text: "«العَسَلان: عدو الذئب» [@diwan-kaab، ص47]."
