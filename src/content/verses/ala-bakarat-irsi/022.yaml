first: "تَرَاهُ سَمِينًا مَا شَتَا وَكَأَنَّهُ"
second: "حَمِيٌّ إِذَا مَا صَافَ أَوْ هُوَ أَهْزَلُ"
vocabulary:
- term: "صَافَ"
  text: "دخل في الصيف؛ قال الأَصْمَعِيّ: «وصفه بالسِّمَن في الشتاء لأنه يأكل من الأشلاء، وإذا جاء الصيف جُهد»، «وكل السباع تهزل في الصيف» [@diwan-kaab، ص50]."
