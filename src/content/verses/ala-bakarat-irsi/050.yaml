first: "فَمَنْ لِلْقَوَافِي شَانَهَا مَنْ يَحُوكُهَا"
second: "إِذَا مَا ثَوَى كَعْبٌ وَفَوَّزَ جَرْوَلُ"
meaning: "فمن للقوافي إذا مات كعب ومات جَرْوَل، أي الحطيئة؟ من يحوكها بعدهما إلا من يأتي بها معيبة؟ قال السُّكَّرِيّ: «وفوّز: مات»، «وجرول يعني الحطيئة. قالوا: ومعنى شانها: جاء بها شائنة أي معيبة» [@diwan-kaab، ص59–60]. ويقول الأحول فيما ينقله المحققون: «يقول: إذا أنا متّ والحطيئة فليقل من شاء الشعر فإنهم لا يسدّدون ولا يقاربون» [@diwan-kaab، ص60]."
vocabulary:
- term: "الْقَوَافِي"
  text: "القصائد، سمّاها بآخر أبياتها."
- term: "شَانَهَا"
  text: "«جاء بها شائنة أي معيبة» [@diwan-kaab، ص60]."
- term: "يَحُوكُهَا"
  text: "ينسجها، أي يقولها؛ شبّه نظم الشعر بنسج الثوب."
- term: "ثَوَى"
  text: "«هلك» [@diwan-kaab، ص59]، وأصله أقام."
- term: "فَوَّزَ"
  text: "«مات» [@diwan-kaab، ص59]. وقال بعضهم: «لا يقال: فوّز فلان حتى يتقدّم الكلامَ كلامٌ، فيقال: مات فلان وفوّز فلان بعده» [@diwan-kaab، ص59–60]."
- term: "جَرْوَلُ"
  text: "«يعني الحطيئة» [@diwan-kaab، ص60]، وهو اسمه."
context: "أول الأبيات الأربعة التي يقول الشارح إنها «زيادة محمد بن سلام» [@diwan-kaab، ص59]. ولها خبر يرويه ابن سَلّام: قال الحُطَيْئة لكعب: «قد علمت روايتى شعر أهل الْبَيْت وانقطاعى وَقد ذهب الفحول غيرى وَغَيْرك فَلَو قلت شعرًا تذكر فِيهِ نَفسك وتضعنى موضعا»، فقال كعب هذه الأبيات [@ibn-sallam، ج1 ص104]. ويرويه أبو الفَرَج عن ابن سَلّام وأبي عُبَيْدة [@aghani-dk، ج17 ص82]، وابن قُتَيْبة [@ibn-qutayba، ج1 ص152، ص155]. والخبر في المرحلة الأولى من مسار كعب."
syntax:
- "«فَمَنْ» اسم استفهام مبتدأ، و«لِلْقَوَافِي» خبر."
- "«شَانَهَا مَنْ يَحُوكُهَا»: «من» موصولة فاعل «شانها»، و«يحوكها» صلتها، والجملة حال من «القوافي» أو مستأنفة."
- "«إِذَا مَا ثَوَى كَعْبٌ» ظرف شرط، و«ما» زائدة، و«جَرْوَلُ» فاعل «فوّز»."
morphology:
- "«فَوَّزَ» على «فَعَّلَ»، من المفازة، ويقول المحققون: «كأنه صار في مفازة ما بين الدنيا والآخرة» [@diwan-kaab، ص59]."
- "«الْقَوَافِي» جمع «قافية» على «فَوَاعِل»."
rhetoric:
  thesis: "يجعل نفسه والحطيئة آخر الشعراء: بعدهما يضيع الشعر."
  devices:
  - title: "الاستعارة في «يَحُوكُهَا»"
    text: "جعل نظم الشعر حياكة، فالقصيدة ثوب يُنسج خيطًا خيطًا. وهي استعارة تناسب مذهب زهير وتلاميذه في تنقيح الشعر، ويكملها في البيتين التاليين بالتقويم والتنخّل."
  - title: "الاستفهام الإنكاري في «فَمَنْ لِلْقَوَافِي»"
    text: "لا يسأل، بل يقرر أنه لا أحد بعدهما."
  - title: "تقديم كعب على جرول"
    text: "ذكر نفسه أولًا ثم الحطيئة، كما طلب الحطيئة: «تبدأ بنفسك فيه وتثنّي بي» في رواية أبي عُبَيْدة [@aghani-dk، ج17 ص82]."
  connection: "ثم يصف كعب نفسه: يقول فلا يعيا، ويقوّم القوافي حتى تستقيم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "فَمَنْ لِلْ / قَوَافِي شَا / نَهَا مَنْ / يَحُوكُهَا = فعولن / مفاعيلن / فعولن / مفاعلن — إِذَا مَا / ثَوَا كَعْبُنْ / وَفَوْوَ / زَ جَرْوَلُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "«وَفَوْوَ» فعولُ مقبوضة، و«زَ جَرْوَلُو» مفاعلن، وهو الضرب."
variants:
- reading: "فَمَنْ لِلْقَوَافِي مَنْ لَهَا مَنْ يَحُوكُهَا"
  status: "رواية"
  note: "يذكرها السُّكَّرِيّ [@diwan-kaab، ص59]."
- reading: "إِذَا مَا مَضَى كَعْبٌ"
  status: "رواية"
  note: "«ويروى: «إذا ما مضى كعب» أي هلك، ومثله ثوى» [@diwan-kaab، ص59]، وهي رواية ابن قُتَيْبة في الموضع الثاني [@ibn-qutayba، ج1 ص155]."
