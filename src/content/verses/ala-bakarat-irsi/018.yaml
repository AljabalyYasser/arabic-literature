first: "إِذَا مَا عَوَى مُسْتَقْبِلَ الرِّيحِ جَاوَبَتْ"
second: "مَسَامِعُهُ فَاهُ عَلَى الزَّادِ مُعْوِلُ"
vocabulary:
- term: "مُعْوِلُ"
  text: "«مصوّت، وهو من العويل» [@diwan-kaab، ص48]."
- term: "جَاوَبَتْ مَسَامِعُهُ فَاهُ"
  text: "«إذا قابل الريح دخلت في فمه ثم خرجت من مسامعه لخلاء جوفه» [@diwan-kaab، ص48]."
