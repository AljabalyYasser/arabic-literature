first: "فَأَقْسَمْتُ بِالرَّحْمَنِ لَا شَيْءَ غَيْرُهُ"
second: "يَمِينَ امْرِئٍ بَرٍّ وَلَا أَتَحَلَّلُ"
meaning: "فأقسمت بالرحمن، لا بشيء غيره، يمين رجل بارّ صادق، لا أستثني فيها. قال السُّكَّرِيّ: «برّ أي غير آثم. ولا أتحلّل: ولا أستثني. وتحلّة اليمين: إن شاء الله» [@diwan-kaab، ص56]."
vocabulary:
- term: "بَرٍّ"
  text: "«غير آثم» [@diwan-kaab، ص56]، أي صادق في يمينه."
- term: "لَا أَتَحَلَّلُ"
  text: "«ولا أستثني. وتحلّة اليمين: إن شاء الله» [@diwan-kaab، ص56]. وفي حاشية ضَيْف: «لا أتحلل: لا أستثنى» [@deif، ج2 ص87]."
context: "أول الأبيات الأربعة (39–42) التي يقول فيها شوقي ضَيْف: «ويظهر أنه عاد فأدخل فيها بعد إسلامه هذه الأبيات» [@deif، ج2 ص87]. وهي في رواية أهل الكوفة، لا في زيادة الأَصْمَعِيّ ولا ابن سَلّام [@diwan-kaab، ص57]."
syntax:
- "«بِالرَّحْمَنِ» متعلق بـ«أقسمت»، و«لَا شَيْءَ غَيْرُهُ» جملة معترضة: «لا» نافية للجنس، و«شيء» اسمها، و«غيرُه» خبرها مرفوع، أو صفة على المحل."
- "«يَمِينَ» مفعول مطلق نائب عن المصدر، أي أقسمت يمينَ امرئ. و«وَلَا أَتَحَلَّلُ» جملة حالية."
morphology:
- "«أَتَحَلَّلُ» مضارع «تَحَلَّلَ» على «تَفَعَّلَ»، من التحلّة."
- "«بَرٍّ» صفة مشبهة من «بَرَّ يَبَرُّ»."
rhetoric:
  thesis: "قسم بالله وحده، بلا استثناء: إعلان توحيد في صورة يمين."
  devices:
  - title: "القصر في «بِالرَّحْمَنِ لَا شَيْءَ غَيْرُهُ»"
    text: "لم يكتف بالقسم بالله، بل نفى أن يقسم بغيره، فخرج القسم من عادة الجاهلية التي كانت تحلف بالأصنام والأنصاب إلى التوحيد. ويرى شوقي ضَيْف في هذه الأبيات أنها «تنمّ عن ولائه لدينه الحنيف» [@deif، ج2 ص88]."
  - title: "«وَلَا أَتَحَلَّلُ»"
    text: "نفي الاستثناء يجعل اليمين قاطعة لا رجعة فيها."
  connection: "ثم يذكر المحلوف عليه: أن ينام مسلمًا متوكلًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "فَأَقْسَمْ / تُ بِرْرَحْمَ / نِ لَا شَيْ / ءَ غَيْرُهُو = فعولن / مفاعيلُ / فعولن / مفاعلن — يَمِينَمْ / رِئِنْ بَرْرِنْ / وَلَا أَ / تَحَلْلَلُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "«تُ بِرْرَحْمَ» مفاعيلُ مكفوفة، والكفّ حذف السابع الساكن من «مفاعيلن»."
