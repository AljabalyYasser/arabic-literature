first: "مَدَى النَّبْلِ تَغْشَانِي إِذَا مَا زَجَرْتُهُ"
second: "قُشَعْرِيرَةٌ مِنْ وَجْهِهِ وَهْوَ مُقْبِلُ"
vocabulary:
- term: "مَدَى النَّبْلِ"
  text: "بمقدار رمية السهم؛ ويُروى «مدى الرمح» «يقول: هو مني بمقدار طول الرمح» [@diwan-kaab، ص47]."
- term: "قُشَعْرِيرَةٌ"
  text: "«والذئب لا يلقاك إلا كاشرًا، ولا تراه أبدًا إلا اقشعر لرؤيتك» [@diwan-kaab، ص47]."
