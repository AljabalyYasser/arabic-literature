first: "أَأَكْلَؤُهَا خَوْفَ الْحَوَادِثِ إِنَّهَا"
second: "تَرِيبُ عَلَى الْإِنْسَانِ أَمْ أَتَوَكَّلُ"
meaning: "أأحرسها خوفًا من الحوادث، فإنها تأتي الإنسان بما يكره، أم أتوكل على الله؟ قال السُّكَّرِيّ: «أأكلؤها: أأحفظها»، «وتَريب: تأتي برَيْب. والرَّيْب: كل حادث يؤذيك» [@diwan-kaab، ص56]."
vocabulary:
- term: "أَأَكْلَؤُهَا"
  text: "«أأحفظها. والكالئ: الحافظ، يقال: اذهب في كَلاءة الله» [@diwan-kaab، ص56]."
- term: "تَرِيبُ"
  text: "«تأتي بريب. والريب: كل حادث يؤذيك» [@diwan-kaab، ص56]."
- term: "أَتَوَكَّلُ"
  text: "أعتمد على الله وأفوّض الأمر إليه."
context: "بداية المقطع الذي يرى فيه شوقي ضَيْف أثر الإسلام. أناخ ناقته في الليل وحار: أيسهر يحرسها أم ينام متوكلًا؟ وهذا البيت هو تفصيل «وآمرت نفسي أيّ أمريّ أفعل» في البيت السابق، والجواب في الأبيات الأربعة التالية."
syntax:
- "الهمزة الأولى للاستفهام، و«أَكْلَؤُهَا» مضارع وفاعله مستتر، والهاء مفعول به، و«خَوْفَ» مفعول لأجله."
- "«إِنَّهَا تَرِيبُ عَلَى الْإِنْسَانِ» جملة تعليلية معترضة، والضمير للحوادث. و«أَمْ أَتَوَكَّلُ» «أم» المتصلة المعادلة لهمزة الاستفهام."
morphology:
- "«أَكْلَؤُهَا» مضارع «كَلَأَ» مهموز اللام."
- "«أَتَوَكَّلُ» مضارع «تَوَكَّلَ» على «تَفَعَّلَ»."
rhetoric:
  thesis: "حيرة رجل في الصحراء ليلًا بين الحذر والتوكل، وهي الحيرة التي يحلّها في الأبيات التالية."
  devices:
  - title: "الاستفهام التخييري في «أَأَكْلَؤُهَا ... أَمْ أَتَوَكَّلُ»"
    text: "سؤال بين أمرين، يعرض فيه الشاعر حواره مع نفسه بصوت مسموع."
  - title: "«تَرِيبُ عَلَى الْإِنْسَانِ»"
    text: "جعل الحوادث فاعلًا يأتي بالريب، فصار الخطر شخصًا يتربص."
  connection: "ثم يحسم الحيرة بقسم: سينام متوكلًا مسلمًا وجهه لله."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ اللام المضمومة، وبعدها واو الإطلاق: «ـلُو». والقافية مطلقة مجردة من الرِّدْف"
  scansion: "أَأَكْلَ / ؤُهَا خَوْفَلْ / حَوَادِ / ثِ إِنْنَهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — تَرِيبُ / عَلَلْ إِنْسَا / نِ أَمْ أَ / تَوَكْكَلُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "«أَأَكْلَ» فعولُ مقبوضة، و«ؤُهَا خَوْفَلْ» مفاعيلن تامة."
sources:
