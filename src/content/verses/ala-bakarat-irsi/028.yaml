first: "أَغَارَا عَلَى مَا خَيَّلَتْ وَكِلَاهُمَا"
second: "سَيُخْلِفُهُ مِنِّي الَّذِي كَانَ يَأْمُلُ"
vocabulary:
- term: "أَغَارَا"
  text: "«يعني الذئب والغراب» [@diwan-kaab، ص52]."
- term: "عَلَى مَا خَيَّلَتْ"
  text: "على ما أوهمتهما أنفسهما؛ ويقول المحققون: «أي على ما أرتك نفسك وشبّهت وأوهمت، أي على غرر من غير يقين» [@diwan-kaab، ص52]."
