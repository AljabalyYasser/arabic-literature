explained: false
first: وَيُخْرِجُ مِنْهُ ضَرَّةُ الْقَوْمِ مَصْدَقًا
second: وَطُولُ السُّرَى دُرِّيَّ عَضْبٍ مُهَنَّدِ
vocabulary:
- term: ضَرَّةُ الْقَوْمِ
  text: 'شدة الحال والحاجة؛ «والاضطرار: الاحتياج إلى الشيء... والاسم الضَّرّة» [@lisan، ج4 ص483].'
- term: مَصْدَقًا
  text: 'جِدًّا وصلابة؛ «والمَصْدَق أيضًا: الجِدّ، وبه فسّر بعضهم قول دُرَيْد»، و«المصدق: الصلابة» عن ثعلب [@lisan، ج10 ص195].'
- term: السُّرَى
  text: السير ليلًا.
- term: دُرِّيَّ عَضْبٍ مُهَنَّدِ
  text: 'تلألؤ سيف قاطع هنديّ؛ قال الأزهري: «إن أضرّ به شدة اليوم أخرج منه مصدقًا وصبرًا وتهلّل وجهه كأنه ذرّيّ سيف»، ويروى «ذَرِّيّ» أي فرنده [@lisan، ج4 ص305].'
