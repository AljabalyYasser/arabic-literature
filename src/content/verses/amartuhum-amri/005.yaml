first: "فَجِئْتُ إِلَيْهِ وَالرِّمَاحُ تَنُوشُهُ"
second: "كَوَقْعِ الصَّيَاصِي فِي النَّسِيجِ المُمَدَّدِ"
meaning: "فأسرعت إليه والرماح تتناوله من كل جانب، تتتابع في جسده كما تتتابع خشبة الحائك في خيوط النسيج الممدود."
vocabulary:
  - term: "تَنُوشُهُ"
    text: "تتناوله [@marzuqi-hamasa، ص578]."
  - term: "الصَّيَاصِي"
    text: "خشبة الحائك يفصل بها خيوط النسيج بعضها عن بعض [@marzuqi-hamasa، ص578]."
  - term: "النَّسِيجِ المُمَدَّدِ"
    text: "الخيوط المشدودة على النَّوْل."
syntax:
  - "«وَالرِّمَاحُ تَنُوشُهُ» جملة حالية، والواو واو الحال: جئت إليه والرماح تتناوله."
  - "«كَوَقْعِ الصَّيَاصِي»: الكاف للتشبيه، والجار والمجرور صفة لمصدر محذوف، والتقدير: تنوشه نوشًا كوقع الصياصي."
  - "«فِي النَّسِيجِ المُمَدَّدِ» متعلق بـ«وقع»، و«المُمَدَّدِ» نعت للنسيج."
morphology:
  - "«تَنُوشُهُ» من «ناش ينوش نوشًا» إذا تناول، ومنه في القرآن «التناوش» [@marzuqi-hamasa، ص578]."
  - "«الصَّيَاصِي» جمع «صِيصِيَة»، وهي خشبة الحائك. وكأنها سُمّيت بذلك تشبيهًا بصيصية الديك، وهي مخلب في ساقه، وصيصية الثور، وهي قرنه [@marzuqi-hamasa، ص578]."
  - "«المُمَدَّدِ» اسم مفعول من «مدّد» على وزن «مُفَعَّل»، والتضعيف فيه يدل على كثرة المد والشد."
rhetoric:
  thesis: "يستعير الشاعر صورة من الحياة اليومية، النسيج على النَّوْل، ليصف أقسى لحظة في المعركة؛ فيجتمع في البيت المألوف والفاجع."
  devices:
    - title: "تشبيه الحركة بالحركة"
      text: "لم يشبّه الرمح بالخشبة وحدها، بل شبّه الحركة كلها: الرماح تتتابع في جسد أخيه كما تتتابع خشبة الحائك بين خيوط النسيج الممدود [@marzuqi-hamasa، ص578]."
    - title: "المضارع «تَنُوشُهُ»"
      text: "جاء بالمضارع ليصوّر المشهد وهو يحدث أمامنا، لا حدثًا مضى وانقضى."
    - title: "سرعة الوصول"
      text: "«فَجِئْتُ إِلَيْهِ» فعل واحد يطوي المسافة بين سماع النداء والوصول؛ فلا وقت للوصف قبل أن يرى المشهد."
  connection: "ثم يقاتل دونه حتى يتفرق الفرسان."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَجِئْتُ / إِلَيْهِ وَرْ / رِمَاحُ / تَنُوشُهُو = فعولُ / مفاعلن / فعولُ / مفاعلن — كَوَقْعِصْ / صَيَاصِي فِنْ / نَسِيجِلْ / مُمَدْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "«وَالرِّمَاحُ» تُنطق «وَرْرِمَاحُ»: اللام الشمسية تُدغم في الراء فلا تُحسب، والراء المشددة حرفان. وجاء صدر البيت مقبوضًا كله تقريبًا: «فعولُ مفاعلن فعولُ»، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "صورة من الحياة اليومية: الحائك ونسيجه. يستعيرها الشاعر ليصف مشهد الموت، فيصير الأخ كالنسيج على النَّوْل، والرماح تتخلله كما تتخلل الخشبة خيوطه."
variants:
  - reading: "فَجِئْتُ إِلَيْهِ وَالرِّمَاحُ تَنُوشُهُ"
    status: "رواية ابن قُتَيْبة والحماسة"
    note: "وهي المثبتة هنا [@marzuqi-hamasa، ص578]."
  - reading: "غَدَاةَ دَعَانِي وَالرِّمَاحُ يَنُشْنَهُ"
    status: "رواية الأَصْمَعِيّات"
    note: "وفيها أن أخاه دعاه فأجابه [@asmaiyyat، ص109]."
