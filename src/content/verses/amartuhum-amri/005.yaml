explained: false
first: عَلَانِيَةً ظُنُّوا بِأَلْفَيْ مُدَجَّجٍ
second: سَرَاتُهُمُ فِي الْفَارِسِيِّ الْمُسَرَّدِ
vocabulary:
- term: ظُنُّوا
  text: 'أيقنوا، «وهو من الأضداد يكون شكًّا ويكون يقينًا»؛ وقيل: ظنّوا بهم كل ظن قبيح [@khizana، ج11 ص282].'
- term: مُدَجَّجٍ
  text: 'الكامل السلاح، وقيل: لابس السلاح وإن لم يكمل [@khizana، ج11 ص282].'
- term: سَرَاتُهُمُ
  text: أشرافهم.
- term: الْفَارِسِيِّ الْمُسَرَّدِ
  text: الدروع الفارسية المحكمة النسج [@khizana، ج11 ص282].
