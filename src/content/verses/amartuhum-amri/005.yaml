first: "فَجِئْتُ إِلَيْهِ وَالرِّمَاحُ تَنُوشُهُ"
second: "كَوَقْعِ الصَّيَاصِي فِي النَّسِيجِ المُمَدَّدِ"
level: "basic"
meaning: "فأسرعت إليه والرماح تتناوله من كل جانب، تتتابع في جسده كما تتتابع خشبة الحائك في خيوط النسيج الممدود."
vocabulary:
  - term: "تَنُوشُهُ"
    text: "تتناوله [@marzuqi-hamasa، ص578]."
  - term: "الصَّيَاصِي"
    text: "خشبة الحائك يفصل بها خيوط النسيج بعضها عن بعض [@marzuqi-hamasa، ص578]."
  - term: "النَّسِيجِ المُمَدَّدِ"
    text: "الخيوط المشدودة على النَّوْل."
context: "صورة من الحياة اليومية: الحائك ونسيجه. يستعيرها الشاعر ليصف مشهد الموت، فيصير الأخ كالنسيج على النَّوْل، والرماح تتخلله كما تتخلل الخشبة خيوطه."
variants:
  - reading: "فَجِئْتُ إِلَيْهِ وَالرِّمَاحُ تَنُوشُهُ"
    status: "رواية ابن قُتَيْبة والحماسة"
    note: "وهي المثبتة هنا [@marzuqi-hamasa، ص578]."
  - reading: "غَدَاةَ دَعَانِي وَالرِّمَاحُ يَنُشْنَهُ"
    status: "رواية الأَصْمَعِيّات"
    note: "وفيها أن أخاه دعاه فأجابه [@asmaiyyat، ص109]."
