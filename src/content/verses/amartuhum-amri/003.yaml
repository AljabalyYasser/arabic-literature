first: "وَهَلْ أَنَا إِلَّا مِنْ غَزِيَّةَ إِنْ غَوَتْ"
second: "غَوَيْتُ وَإِنْ تَرْشُدْ غَزِيَّةُ أَرْشُدِ"
level: "full"
meaning: "ما أنا إلا واحد من قومي بني غزية: إن ضلّوا ضللت معهم، وإن اهتدوا اهتديت معهم. مصيري مصيرهم مهما كان رأيي."
vocabulary:
  - term: "غزية"
    text: "رهط الشاعر [@marzuqi-hamasa، ص577]، وهم فخذ من جشم من هوازن [@ibn-qutayba، ج2 ص737]."
  - term: "غوت"
    text: "ضلّت وأخطأت الطريق."
  - term: "ترشد"
    text: "تهتدي إلى الصواب."
syntax:
  - "«هل» استفهام خرج إلى معنى النفي، ولذلك جاء بعده «إلا»؛ والمعنى: ما أنا إلا من غزية [@marzuqi-hamasa، ص577]."
  - "«من» في «من غزية» تفيد أن الشاعر بعضٌ من قبيلته، لا يُفرد عنها."
  - "في البيت جملتا شرط متقابلتان: «إن غوت غويت» و«إن ترشد غزية أرشد»، وجواب كل منهما من لفظ فعل الشرط نفسه."
  - "أعاد الشاعر الاسم «غزية» في العجز بدل أن يكتفي بالضمير، فتكرر اسم القبيلة في شطري البيت."
morphology:
  - "«ترشد» يجوز فيها ضم الشين وفتحها، لأن العرب تقول: رشَد يرشُد، ورشِد يرشَد [@marzuqi-hamasa، ص577]."
  - "«غوت» و«غويت» من مادة واحدة (غ و ي)، و«ترشد» و«أرشد» من مادة واحدة (ر ش د)؛ فجواب كل شرط يعود بلفظ شرطه."
rhetoric:
  thesis: "بيت يلخص فكرة القبيلة في الجاهلية: الفرد لا يرى نفسه خارج جماعته. وقوته في أنه لا يمدح هذا الولاء ولا يذمه، بل يقرره كأنه حقيقة لا جدال فيها."
  devices:
    - title: "الاستفهام الذي يعني النفي"
      text: "لم يقل «ما أنا» في هذه الرواية، بل «هل أنا». والاستفهام بمعنى النفي يشرك السامع في الجواب، كأنه يسأله: وهل تنتظر مني غير هذا؟"
    - title: "مقابلة الغي بالرشد"
      text: "قابل بين «غوت/غويت» و«ترشد/أرشد»، فجمع الحالين المتضادين في بيت واحد؛ والولاء ثابت فيهما معًا."
    - title: "تكرار اسم القبيلة"
      text: "ذكر «غزية» مرتين ولم يكتف بالضمير في العجز؛ فيبقى اسم القبيلة حاضرًا في طرفي البيت."
    - title: "ليس تكرارًا لما قبله"
      text: "قد يبدو البيت إعادة لقوله «كنت منهم وقد أرى غوايتهم». ويجيب المرزوقي بأن الأول يصف اتباعه لهم بعد نصحه، وهذا يصف مشاركته إياهم فيما جرّه عليهم اختيارهم [@marzuqi-hamasa، ص577]."
  connection: "ثم ينتقل من الحكمة إلى الحدث: صيحة في المعركة تخبر بسقوط فارس."
prosody:
  meter: "البحر الطويل"
  rhyme: "الروي الدال المكسورة"
  note: "القافية هنا كلمة «أَرْشُدِ» كلها: تبدأ من الهمزة، لأنها المتحرك الذي قبل الساكن الأول «الراء»."
context: "أشهر بيت في القصيدة، وقد صار شاهدًا على معنى الانتماء القبلي. وهو جواب سؤال المحطة: لماذا تحتفل القبيلة بشاعرها؟ لأن الشاعر صوتها، ولا يرى نفسه إلا منها."
variants:
  - reading: "وهل أنا إلا من غزية"
    status: "رواية ابن قتيبة والحماسة"
    note: "وهي المثبتة هنا [@ibn-qutayba، ج2 ص738]."
  - reading: "وما أنا إلا من غزية"
    status: "رواية الأصمعيات"
    note: "والمعنى واحد، لأن الاستفهام في الرواية الأولى بمعنى النفي [@asmaiyyat، ص107]."
