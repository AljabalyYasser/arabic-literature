first: أَعَاذِلَ إِنَّ الرُّزْءَ فِي مِثْلِ خَالِدٍ
second: وَلَا رُزْءَ فِيمَا أَهْلَكَ الْمَرْءُ عَنْ يَدِ
vocabulary:
