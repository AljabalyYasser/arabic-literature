explained: false
first: كَمِيشُ الْإِزَارِ خَارِجٌ نِصْفُ سَاقِهِ
second: صَبُورٌ عَلَى الْعَزَّاءِ طَلَّاعُ أَنْجُدِ
vocabulary:
- term: كَمِيشُ الْإِزَارِ
  text: 'مشمّر؛ وفي الشطر كله: «أراد أنه مشمّر جادّ، ولم يرد خروج الساق بعينها» [@lisan، ج10 ص168].'
- term: الْعَزَّاءِ
  text: 'الشدة؛ و«العَزّاء: السنة الشديدة» [@lisan، ج5 ص377].'
- term: طَلَّاعُ أَنْجُدِ
  text: يعلو الأمور ويغلبها؛ «يقال فلان طلّاع أنجد وطلّاع الثنايا إذا كان ساميًا لمعالي الأمور» [@lisan، ج3 ص414].
