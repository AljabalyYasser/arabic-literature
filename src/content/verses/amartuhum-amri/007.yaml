first: "قِتَالَ امْرِئٍ آسَى أَخَاهُ بِنَفْسِهِ"
second: "وَيَعْلَمُ أَنَّ المَرْءَ غَيْرُ مُخَلَّدِ"
meaning: "قاتلت قتال رجل جعل نفسه فداء أخيه ورضي لها مصيره، وهو يعلم أن الإنسان لن يعيش إلى الأبد."
vocabulary:
  - term: "آسَى أَخَاهُ بِنَفْسِهِ"
    text: "جعل نفسه أسوة أخيه، ورضي لها ما جرى عليه [@marzuqi-hamasa، ص579]."
  - term: "مُخَلَّدِ"
    text: "باقٍ لا يموت."
syntax:
  - "«قِتَالَ امْرِئٍ» مفعول مطلق منصوب، وفعله مفهوم مما قبله: قاتلتُ قتالَ امرئ."
  - "«آسَى أَخَاهُ بِنَفْسِهِ» جملة في موضع جر، نعت لـ«امْرِئٍ»."
  - "«وَيَعْلَمُ أَنَّ المَرْءَ غَيْرُ مُخَلَّدِ» جملة معطوفة على «آسَى»، و«أَنَّ» وما بعدها سدّت مسدّ مفعولي «يعلم»."
morphology:
  - "«آسَى» على وزن «فاعَل» من الأُسوة: جعل نفسه أسوة لأخيه ورضي لها ما جرى عليه. والمواساة والتأسي والائتساء بمعنى واحد [@marzuqi-hamasa، ص579]."
  - "«امْرِئٍ» تتبع راؤه همزته في الحركة: امرؤٌ، وامرأً، وامرئٍ."
  - "«مُخَلَّدِ» اسم مفعول من «خلّد» على وزن «مُفَعَّل»: الباقي أبدًا."
rhetoric:
  thesis: "يختم الشاعر بحكمة تفسّر ما فعل: الموت آتٍ لا محالة، فالأكرم أن يلقاه المرء وهو يفدي أخاه."
  devices:
    - title: "الحكمة سببًا"
      text: "«وَيَعْلَمُ أَنَّ المَرْءَ غَيْرُ مُخَلَّدِ» ليست زيادة؛ إنها سبب الشجاعة كلها. يقول المَرْزُوقِيّ: «عالمًا بأن المرء لا يبقى، بل مآله إلى الفناء، وأن استقتاله ليلحق بأخيه خير له من أن يبقى بعده فيشقى بالجزع له» [@marzuqi-hamasa، ص579]."
    - title: "الحديث عن النفس بضمير الغائب"
      text: "قال «امرئ ... ويعلم»، فتحدث عن نفسه كأنه يتحدث عن رجل آخر؛ فصار فعله مثالًا لكل أخ. وفي رواية الأَصْمَعِيّات «وأعلم»، بضمير المتكلم [@asmaiyyat، ص109]."
  connection: "بهذا البيت تنتهي الأبيات السبعة التي اختارها ابن قُتَيْبة من القصيدة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "قِتَالَمْ / رِئِنْ آسَى / أَخَاهُ / بِنَفْسِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — وَيَعْلَ / مُ أَنْنَلْ مَرْ / ءَ غَيْرُ / مُخَلْلَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "همزة «امْرِئٍ» همزة وصل تسقط في النطق: «قِتَالَمْ رِئِنْ». وجاءت «فعولن» مقبوضة ثلاث مرات، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "يختم المقطع بحكمة تفسّر اندفاعه: ما دام الموت لا مفر منه، فالأكرم أن يلقاه المرء دفاعًا عن أخيه."
variants:
  - reading: "قِتَالَ امْرِئٍ ... وَيَعْلَمُ أَنَّ المَرْءَ"
    status: "رواية ابن قُتَيْبة والحماسة"
    note: "وهي المثبتة هنا [@marzuqi-hamasa، ص579]."
  - reading: "طِعَانَ امْرِئٍ ... وَأَعْلَمُ أَنَّ المَرْءَ"
    status: "رواية الأَصْمَعِيّات"
    note: "وفيها يتحدث الشاعر عن نفسه بضمير المتكلم [@asmaiyyat، ص109]."
