first: "قِتَالَ امْرِئٍ آسَى أَخَاهُ بِنَفْسِهِ"
second: "وَيَعْلَمُ أَنَّ المَرْءَ غَيْرُ مُخَلَّدِ"
level: "basic"
meaning: "قاتلت قتال رجل جعل نفسه فداء أخيه ورضي لها مصيره، وهو يعلم أن الإنسان لن يعيش إلى الأبد."
vocabulary:
  - term: "آسى أخاه بنفسه"
    text: "جعل نفسه أسوة أخيه، ورضي لها ما جرى عليه [@marzuqi-hamasa، ص579]."
  - term: "مخلد"
    text: "باقٍ لا يموت."
context: "يختم المقطع بحكمة تفسّر اندفاعه: ما دام الموت لا مفر منه، فالأكرم أن يلقاه المرء دفاعًا عن أخيه."
variants:
  - reading: "قتال امرئ ... ويعلم أن المرء"
    status: "رواية ابن قتيبة والحماسة"
    note: "وهي المثبتة هنا [@marzuqi-hamasa، ص579]."
  - reading: "طعان امرئ ... وأعلم أن المرء"
    status: "رواية الأصمعيات"
    note: "وفيها يتحدث الشاعر عن نفسه بضمير المتكلم [@asmaiyyat، ص109]."
