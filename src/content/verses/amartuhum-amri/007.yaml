first: "فَلَمَّا عَصَوْنِي كُنْتُ مِنْهُمْ وَقَدْ أَرَى"
second: "غَوَايَتَهُمْ وَأَنَّنِي غَيْرُ مُهْتَدِ"
meaning: "فلما رفضوا رأيي بقيت معهم ولم أفارقهم، وأنا أرى ضلالهم، وأعرف أنني حين أتبعهم لا أسلك طريق الصواب."
vocabulary:
  - term: "عَصَوْنِي"
    text: "خالفوا رأيي ولم يعملوا به."
  - term: "غَوَايَتَهُمْ"
    text: "ضلالهم وخطأ رأيهم."
  - term: "مُهْتَدِ"
    text: "من اهتدى إلى الصواب."
syntax:
  - "«لمّا» ظرف يدل على وقوع شيء لوقوع غيره [@marzuqi-hamasa، ص576]: وقع العصيان فوقع البقاء معهم. وجوابها «كُنْتُ مِنْهُمْ»."
  - "«مِنْ» في «كُنْتُ مِنْهُمْ» تفيد الوفاق وترك الخلاف؛ فهو وإياهم شيء واحد لا تمايز بينهم [@marzuqi-hamasa، ص576]."
  - "«وقد أرى غوايتهم» جملة حالية، والواو واو الحال: بقيت معهم وأنا أرى ضلالهم."
  - "«وَأَنَّنِي غَيْرُ مُهْتَدِ» معطوف على «غَوَايَتَهُمْ»؛ فهو يرى أمرين: ضلالهم، وأنه هو أيضًا غير مهتد باتباعهم."
morphology:
  - "«عَصَوْنِي» من «عصى»؛ أُسند إلى واو الجماعة فحُذفت ألفه، وبقيت فتحة الصاد دالة عليها: عَصَوْا."
  - "«غَواية» مصدر «غوى يغوي»، وهي الضلال؛ ومن مادتها «غَوَتْ» و«غَوَيْتُ» في البيت التالي."
  - "«مُهْتَدٍ» اسم فاعل من «اهتدى» على وزن «مُفْتَعِل»، وهو اسم منقوص تُحذف ياؤه في النكرة؛ وأُشبعت كسرته في القافية فنُطقت ياء."
rhetoric:
  thesis: "في بيت واحد يجتمع العقل والولاء متعارضين: الشاعر يرى الخطأ بعينه، ويمشي فيه مع قومه. والبيت لا يعتذر عن ذلك ولا يفخر به، بل يرويه كما وقع."
  devices:
    - title: "المفارقة"
      text: "«وقد أرى غوايتهم» تأتي بعد «كُنْتُ مِنْهُمْ» مباشرة؛ فالرؤية الصحيحة لا تغيّر الموقف. وهذه المفارقة روح الأبيات كلها."
    - title: "الحكم على النفس"
      text: "لم يقل «وأنهم غير مهتدين»، بل «وَأَنَّنِي غَيْرُ مُهْتَدِ»؛ فهو يحكم على نفسه قبلهم. ويشرحه المَرْزُوقِيّ: «وأني ضال عن الطريق عادل عن الصواب في اتباعي لهم، لكني لم أستصلح لنفسي الخروج منهم» [@marzuqi-hamasa، ص576]."
    - title: "الإيجاز"
      text: "لم يذكر ما دار بينه وبينهم بعد العصيان؛ فـ«لما» تطوي الموقف كله، وتنقلنا من «عَصَوْنِي» إلى «كُنْتُ مِنْهُمْ» في لحظة."
  connection: "ثم يجمع هذا الموقف في حكمة سائرة: «وَمَا أَنَا إِلَّا مِنْ غَزِيَّةَ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَلَمْمَا / عَصَوْنِي كُنْ / تُ مِنْهُمْ / وَقَدْ أَرَى = فعولن / مفاعيلن / فعولن / مفاعلن — غَوَايَ / تَهُمْ وَأَنْ / نَنِي غَيْ / رُ مُهْتَدِي = فعولُ / مفاعلن / فعولن / مفاعلن"
  note: "في أول العَجُز جاءت «فعولن» مقبوضة «فعولُ»، وجاءت «مفاعيلن» مقبوضة «مفاعلن»، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "هنا ينقلب الموقف: الرجل الذي يرى الخطأ بوضوح يختار أن يبقى في صف قومه. ويقول المَرْزُوقِيّ إن «مِنْهُمْ» هنا تفيد الوفاق وترك الخلاف [@marzuqi-hamasa، ص576]."
