first: رَئِيسُ حُرُوبٍ لَا يَزَالُ رَبِيئَةً
second: مُشِيحًا عَلَى مُحْقَوْقِفِ الصُّلْبِ مُلْبِدِ
vocabulary:
- term: رَبِيئَةً
  text: طليعة يرقب العدو لقومه، «ولا يكون إلا على جبل أو شرف ينظر منه» [@lisan، ج1 ص82].
- term: مُشِيحًا
  text: 'جادًّا حذرًا؛ «الشِّيح والشائح والمُشيح: الجادّ والحذر» [@lisan، ج2 ص500].'
- term: مُحْقَوْقِفِ الصُّلْبِ
  text: فرس في ظهره طول وانحناء؛ «وكل ما طال واعوجّ فقد احقوقف كظهر البعير» [@lisan، ج9 ص52].
- term: مُلْبِدِ
  text: «الذي يخطر بذنبه فيتلبّد البول على وركيه»، ويوصف به الفحل [@lisan، ج1 ص790].
