first: "وَمَا أَنَا إِلَّا مِنْ غَزِيَّةَ إِنْ غَوَتْ"
second: "غَوَيْتُ وَإِنْ تَرْشُدْ غَزِيَّةُ أَرْشُدِ"
meaning: "ما أنا إلا واحد من قومي بني غَزِيَّة: إن ضلّوا ضللت معهم، وإن اهتدوا اهتديت معهم. مصيري مصيرهم مهما كان رأيي."
vocabulary:
  - term: "غَزِيَّةَ"
    text: "رهط الشاعر [@marzuqi-hamasa، ص577]، وهم فَخِذ من جُشَم من هَوازِن [@ibn-qutayba، ج2 ص737]."
  - term: "غَوَتْ"
    text: "ضلّت وأخطأت الطريق."
  - term: "تَرْشُدْ"
    text: "تهتدي إلى الصواب."
syntax:
  - "«ما» نافية، و«أَنَا» مبتدأ، و«مِنْ غَزِيَّةَ» في موضع الخبر، و«إِلَّا» أداة حصر: نفى أن يكون شيئًا غير واحد من غَزِيَّة."
  - "«مِنْ» في «مِنْ غَزِيَّةَ» تفيد أن الشاعر بعضٌ من قبيلته، لا يُفرد عنها."
  - "في البيت جملتا شرط متقابلتان: «إِنْ غَوَتْ غَوَيْتُ» و«إِنْ تَرْشُدْ غَزِيَّةُ أَرْشُدِ»، وجواب كل منهما من لفظ فعل الشرط نفسه."
  - "أعاد الشاعر الاسم «غَزِيَّةَ» في العَجُز بدل أن يكتفي بالضمير، فتكرر اسم القبيلة في شطري البيت."
morphology:
  - "«تَرْشُدْ» يجوز فيها ضم الشين وفتحها، لأن العرب تقول: رشَد يرشُد، ورشِد يرشَد [@marzuqi-hamasa، ص577]."
  - "«غَوَتْ» و«غَوَيْتُ» من مادة واحدة (غ و ي)، و«تَرْشُدْ» و«أَرْشُدِ» من مادة واحدة (ر ش د)؛ فجواب كل شرط يعود بلفظ شرطه."
rhetoric:
  thesis: "بيت يلخص فكرة القبيلة في الجاهلية: الفرد لا يرى نفسه خارج جماعته. وقوته في أنه لا يمدح هذا الولاء ولا يذمه، بل يقرره كأنه حقيقة لا جدال فيها."
  devices:
    - title: "القصر بـ«ما» و«إلا»"
      text: "«وَمَا أَنَا إِلَّا مِنْ غَزِيَّةَ»: نفي ثم استثناء، فصار الكلام قصرًا: لست إلا واحدًا من غَزِيَّة، لا غير. و«ما… إلا» عند عبد القاهر الجُرْجانيّ لـ«اختصاص» الشيء بالحكم ونفيه «عمن عداه» [@dalail، ص337]. وفي رواية ابن قُتَيْبة والحماسة «وَهَلْ أَنَا إِلَّا»، والاستفهام فيها بمعنى النفي [@marzuqi-hamasa، ص577]، كأنه يسأل السامع: وهل تنتظر مني غير هذا؟"
    - title: "مقابلة الغَيّ بالرُّشْد"
      text: "قابل بين «غَوَتْ/غَوَيْتُ» و«تَرْشُدْ/أَرْشُدِ»، فجمع الحالين المتضادين في بيت واحد؛ والولاء ثابت فيهما معًا."
    - title: "تكرار اسم القبيلة"
      text: "ذكر «غَزِيَّةَ» مرتين ولم يكتف بالضمير في العَجُز؛ فيبقى اسم القبيلة حاضرًا في طرفي البيت."
    - title: "ليس تكرارًا لما قبله"
      text: "قد يبدو البيت إعادة لقوله «كُنْتُ مِنْهُمْ وَقَدْ أَرَى غَوَايَتَهُمْ». ويجيب المَرْزُوقِيّ بأن الأول يصف اتباعه لهم بعد نصحه، وهذا يصف مشاركته إياهم فيما جرّه عليهم اختيارهم [@marzuqi-hamasa، ص577]."
  connection: "ثم يتوعد قتلة أخيه، ثم ينتقل إلى الحدث: صيحة في المعركة تخبر بسقوط فارس."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  note: "ألف «أَنَا» لا تُنطق في وصل الكلام، فتُقطَّع «وَهَلْ أَ / نَ إِلْلَا». القافية هنا كلمة «أَرْشُدِ» كلها: تبدأ من الهمزة، لأنها المتحرك الذي قبل الساكن الأول «الراء»."
  scansion: "وَمَا أَ / نَ إِلْلَا مِنْ / غَزِيْيَ / ةَ إِنْ غَوَتْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — غَوَيْتُ / وَإِنْ تَرْشُدْ / غَزِيْيَ / تُ أَرْشُدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
context: "أشهر بيت في القصيدة، وقد صار شاهدًا على معنى الانتماء القبلي. وهو جواب سؤالنا في «الصحراء والقبيلة والسوق»: لماذا تحتفل القبيلة بشاعرها؟ لأن الشاعر صوتها، ولا يرى نفسه إلا منها."
variants:
  - reading: "وَهَلْ أَنَا إِلَّا مِنْ غَزِيَّةَ"
    status: "رواية ابن قُتَيْبة والحماسة والجمهرة"
    note: "وهي أشهر روايات البيت. والمعنى واحد، لأن الاستفهام فيها بمعنى النفي [@ibn-qutayba، ج2 ص738] [@jamhara، ص468]."
