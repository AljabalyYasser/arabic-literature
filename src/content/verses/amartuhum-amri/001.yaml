first: "أَمَرْتُهُمُ أَمْرِي بِمُنْعَرَجِ اللِّوَى"
second: "فَلَمْ يَسْتَبِينُوا الرُّشْدَ إِلَّا ضُحَى الغَدِ"
level: "full"
meaning: "نصحت قومي وأشرت عليهم برأيي حين كنا عند منعطف الرمل، فلم يتبينوا صواب ما قلت إلا في ضحى اليوم التالي، حين فات وقت الأخذ به."
vocabulary:
  - term: "أمري"
    text: "رأيي ومشورتي، أو ما أمرتهم به [@marzuqi-hamasa، ص577]."
  - term: "منعرج اللوى"
    text: "منعطف الرمل؛ فاللوى مسترق الرمل، والمنعرج المنعطف [@marzuqi-hamasa، ص577]."
  - term: "يستبينوا الرشد"
    text: "يتبينوا الصواب ويعرفوه."
  - term: "ضحى الغد"
    text: "أول النهار من اليوم التالي، حين يعلو الضوء."
syntax:
  - "«أمري» يحتمل وجهين ذكرهما المرزوقي: أن يكون بمعنى المأمور به، والأصل «أمرتهم بأمري» فحُذف حرف الجر؛ أو أن يكون مصدرًا جاء لتأكيد الفعل [@marzuqi-hamasa، ص577]."
  - "«بمنعرج اللوى» شبه جملة متعلقة بالفعل «أمرتهم»، تحدد مكان النصيحة. ويرى المرزوقي في ذكر المكان دليلًا على أن الشاعر تخيّر للنصيحة موضعها ووقتها [@marzuqi-hamasa، ص577]."
  - "في العجز قصر بالنفي والاستثناء: «لم يستبينوا ... إلا ضحى الغد»؛ نفى أن يتبينوا الرشد في أي وقت، ثم استثنى وقتًا واحدًا متأخرًا."
morphology:
  - "«منعرج» اسم مكان من الفعل «انعرج» على وزن «مُنفعَل»، ومعناه المنعطف."
  - "«يستبينوا» من «استبان» على وزن «استفعل»، وهو هنا بمعنى «تبيّن»: عرف الأمر واتضح له."
  - "«الرُّشد» مصدر، وهو خلاف الغيّ؛ وسيقابله الشاعر بعد بيتين بقوله «إن غوت غويت»."
rhetoric:
  thesis: "يحكي البيت خيبة الناصح في أقل الكلمات: نصيحة في مكان محدد، ثم إدراك متأخر في وقت محدد. والمسافة بين «منعرج اللوى» و«ضحى الغد» هي مسافة الندم."
  devices:
    - title: "«ضحى الغد»: الوضوح المتأخر"
      text: "يقول المرزوقي إن ذكر الغد يكثر فيما يتأخر من عواقب الأمور، وإن الشاعر زاد «ضحى» لأنه أضوأ النهار؛ فالمعنى أنهم لم يتبينوا الصواب إلا في الوقت الذي لا لبس فيه ولا شك [@marzuqi-hamasa، ص577]."
    - title: "القصر بالنفي والاستثناء"
      text: "«لم يستبينوا ... إلا ضحى الغد» يحصر إدراكهم في لحظة واحدة متأخرة، فيشعر القارئ بأن الفرصة كانت قائمة ثم ضاعت."
    - title: "المكان والزمان"
      text: "يبدأ الصدر بالمكان وينتهي العجز بالزمان؛ فكأن البيت خريطة صغيرة للحدث: هنا قيلت النصيحة، وهناك انكشف صوابها."
  connection: "بعد أن حكى النصيحة، سيقول في البيتين التاليين ماذا فعل حين عصوه: لم يتركهم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الروي الدال المكسورة"
  note: "تُشبَع ضمة ميم الجمع في الصدر فتُنطق «أمرتُهُمُو أمري» ليستقيم الوزن. والقافية هنا «ـحَى الغَدِ»، تبدأ من حاء «ضحى» لأنها المتحرك الذي قبل أول الساكنين الأخيرين."
context: "مفتاح القصة كلها: نصيحة لم تُسمع. وكل ما يأتي بعده نتيجة لهذا البيت."
variants:
  - reading: "ترتيب «أمرتهم أمري» قبل «فلما عصوني»"
    status: "رواية ابن قتيبة والأصمعيات"
    note: "وفي شرح المرزوقي للحماسة يأتي بيت «فلما عصوني» قبل هذا البيت [@marzuqi-hamasa، ص576–577]."
