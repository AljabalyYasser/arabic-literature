first: "أَرَثَّ جَدِيدُ الْحَبْلِ مِنْ أُمِّ مَعْبَدِ"
second: "بِعَاقِبَةٍ وَأَخْلَفَتْ كُلَّ مَوْعِدِ"
meaning: "أبَلِيَ في آخر الأمر ما كان جديدًا من حبل الوصل بيني وبين أم مَعْبَد، وأخلفتْ كل وعد وعدتني إياه؟"
vocabulary:
  - term: "أَرَثَّ"
    text: "بَلِيَ وأخلق. يقال: رثّ الحبل وأرثّ [@lisan، ج2 ص151]."
  - term: "جَدِيدُ الْحَبْلِ"
    text: "الجديد من الحبل. والحبل هنا الوصل بين المحبين، قال ابن السِّكِّيت: «الحبل الوصال» [@lisan، ج11 ص135]."
  - term: "أُمِّ مَعْبَدِ"
    text: "المرأة التي يتغزل بها في المطلع، ولا تذكر المصادر عنها شيئًا."
  - term: "بِعَاقِبَةٍ"
    text: "في آخر الأمر."
  - term: "أَخْلَفَتْ"
    text: "لم تفِ بما وعدت."
syntax:
  - "في «أَرَثَّ» وجهان ذكرهما صاحب اللسان: أن يكون فعلًا ماضيًا على لغة من يقول «أرثّ» بمعنى «رثّ»، فالكلام خبر؛ وأن تكون الهمزة للاستفهام دخلت على «رثّ»، فالكلام سؤال [@lisan، ج2 ص151]. ورواية الجمهرة «أم أخلفت» تقوّي الاستفهام، لأن «أم» تأتي معادلة للهمزة [@jamhara، ص466]."
  - "«جَدِيدُ الْحَبْلِ» فاعل، وهو من إضافة الصفة إلى الموصوف: الحبلُ الجديد."
  - "«بِعَاقِبَةٍ» جار ومجرور متعلق بالفعل: رثّ في العاقبة، أي في آخر الأمر."
  - "«وَأَخْلَفَتْ كُلَّ مَوْعِدِ» جملة معطوفة، وفاعلها ضمير يعود على «أُمِّ مَعْبَدِ»؛ فانتقل الكلام من الحبل إلى المرأة نفسها."
morphology:
  - "«أَرَثَّ» على «أَفْعَل» من «رثّ»، وأصلها «أَرْثَثَ»، أُدغمت الثاء في الثاء. وأجاز أبو زيد «رثّ» و«أرثّ» معًا، وقال الأَصْمَعِيّ «رثّ» بغير ألف، ثم رجع فأجازهما [@lisan، ج2 ص151]."
  - "«مَوْعِد» على «مَفْعِل» من «وعد»، مصدر ميمي بمعنى الوعد."
rhetoric:
  thesis: "مرثية تبدأ بالغزل: حبل وصل بَلِي، ووعود لم تُوفَ. وهذا ما جعل القصيدة فريدة عند القدماء."
  devices:
    - title: "النَّسِيب في أول المرثية"
      text: "ليس من عادة الشعراء أن يبدؤوا الرثاء بالنَّسِيب، والنَّسِيب: الغزل في أول القصيدة. قال ابن الكَلْبِيّ: «لا أعلم مرثية أولها نسيب إلا قصيدة دُرَيْد بن الصِّمَّة» [@ibn-rashiq، ج2 ص151]. ونقل ابن رَشِيق عن النَّحّاس أن «المتعارف عند أهل اللغة أنه ليس للعرب في الجاهلية مرثية أولها تشبيب إلا قصيدة دُرَيْد». ويفسر ابن رَشِيق ذلك بأن الراثي مشغول بمصيبته عن الغزل، وأن دُرَيْدًا إنما «تغزل ... بعد قتل أخيه بسنة، وحين أخذ ثأره، وأدرك طلبته» [@ibn-rashiq، ج2 ص152]."
    - title: "الاستعارة في «الحبل»"
      text: "الحبل ما يُشدّ به الشيء إلى الشيء، فاستُعير للوصل بين المحبين، و«رثّ» من صفات الحبال والثياب إذا بليت. فأجرى على الوصل ما يجري على الحبل، وهذه استعارة دخلت اللغة نفسها: «والحبل: التواصل» [@lisan، ج11 ص135]."
    - title: "الطباق بين «جديد» و«رثّ»"
      text: "جمع في الصدر بين «جديد» و«رثّ»: ما كان جديدًا صار باليًا. فالطباق يختصر قصة الوصل كلها في كلمتين."
  connection: "ثم يقول إنها بانت، ولم يحمد جوارها، ولا يرجو أن تعود «اليوم أو غد»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَرَثْثَ / جَدِيدُلْحَبْ / لِمِنْ أُمْ / مِمَعْبَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن — بِعَاقِ / بَتِنْ وَأَخْ / لَفَتْ كُلْ / لَمَوْعِدِي = فعولُ / مفاعلن / فعولن / مفاعلن"
  note: "جاءت «فعولن» الأولى في الشطرين مقبوضة «فعولُ»، وهو جائز في حشو الطويل [@atiq، ص29]. وجاءت «مفاعيلن» في حشو العَجُز مقبوضة أيضًا: «مفاعلن» (بَتِنْ وَأَخْ) [@ahda-sabil، ص28]."
context: "مطلع القصيدة. قالها دُرَيْد في رثاء أخيه عبد الله بعد مقتله، وفيها يذكر نصيحته لقومه وعصيانهم إياه، ثم يرثي أخاه ويصفه. وعند ابن رَشِيق أنه قالها بعد مقتل أخيه بسنة، حين أخذ ثأره [@ibn-rashiq، ج2 ص152]."
