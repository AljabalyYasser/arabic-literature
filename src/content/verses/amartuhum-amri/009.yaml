first: وَإِنْ تُعْقِبِ الْأَيَّامُ وَالدَّهْرُ تَعْلَمُوا
second: بَنِي قَارِبٍ أَنَّا غِضَابٌ بِمَعْبَدِ
vocabulary:
- term: تُعْقِبِ الْأَيَّامُ وَالدَّهْرُ
  text: 'إن تتابعت الأيام فجاءت بحال بعد حال؛ من قولهم: «أعقب هذا هذا إذا ذهب الأول فلم يبق منه شيء، وصار الآخر مكانه» [@lisan، ج1 ص613].'
- term: بَنِي قَارِبٍ
  text: رهط من عبس، منهم قاتل عبد الله بن الصِّمَّة [@khizana، ج11 ص281]، وهو ذؤاب بن أسماء بن زيد بن قارب [@ibn-qutayba، ج2 ص739].
- term: مَعْبَدِ
  text: من أسماء أخيه عبد الله [@iqd، ج6 ص32].
