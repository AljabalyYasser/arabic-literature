explained: false
first: وَغَارَةِ بَيْنَ الْيَوْمِ وَاللَّيْلِ فَلْتَةٍ
second: تَدَارَكْتُهَا رَكْضًا بِسِيدٍ عَمَرَّدِ
vocabulary:
- term: فَلْتَةٍ
  text: فجأة؛ «كان ذلك الأمر فلتة أي فجأة إذا لم يكن عن تدبر ولا تردد» [@lisan، ج2 ص67].
- term: سِيدٍ
  text: ذئب؛ «شبّه فرسه بالذئب» [@lisan، ج2 ص68].
- term: عَمَرَّدِ
  text: 'طويل؛ «العُمْرود والعَمَرَّد: الطويل، يقال ذئب عمرّد» [@lisan، ج3 ص306].'
