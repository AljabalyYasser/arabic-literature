first: "فَطَاعَنْتُ عَنْهُ الخَيْلَ حَتَّى تَبَدَّدَتْ"
second: "وَحَتَّى عَلانِي حَالِكُ اللَّوْنِ أَسْوَدُ"
meaning: "فقاتلت الفرسان بالرمح دفاعًا عنه حتى تفرقوا، وحتى جُرحت فغطاني دم شديد السواد."
vocabulary:
  - term: "طَاعَنْتُ"
    text: "قاتلت بالرمح."
  - term: "تَبَدَّدَتْ"
    text: "تفرقت وانكشفت."
  - term: "حَالِكُ اللَّوْنِ أَسْوَدُ"
    text: "الدم؛ والحالك الشديد السواد. والمعنى: جُرحت فسال الدم عليّ [@marzuqi-hamasa، ص579]."
syntax:
  - "«فَطَاعَنْتُ عَنْهُ الخَيْلَ»: فعل وفاعل ومفعول به، و«عَنْهُ» متعلق بالفعل، أي دفاعًا عنه."
  - "«حَتَّى» في «حَتَّى تَبَدَّدَتْ» و«حتى علاني» حرف غاية؛ فللقتال غايتان: تفرُّق الفرسان، وسيلان الدم عليه."
  - "«حَالِكُ اللَّوْنِ أَسْوَدُ» صفتان لموصوف محذوف، والمعنى كما يشرحه المَرْزُوقِيّ: جُرحت فسال الدم عليّ [@marzuqi-hamasa، ص579]."
morphology:
  - "«طاعنتُ» على وزن «فاعلتُ»، وهي صيغة المشاركة: يطعنهم ويطعنونه."
  - "«تَبَدَّدَتْ» على وزن «تفعّلت» من «بدّد» أي فرّق، وتدل على التفرق شيئًا بعد شيء."
  - "«حَالِكُ» اسم فاعل من «حلَك» إذا اشتد سواده؛ فالحالك الشديد السواد [@marzuqi-hamasa، ص579]."
rhetoric:
  thesis: "لا يقول الشاعر إنه جُرح، بل يقول إن شيئًا «حَالِكُ اللَّوْنِ أَسْوَدُ» علاه، ويترك القارئ يدرك أنه الدم."
  devices:
    - title: "الكناية"
      text: "«عَلانِي حَالِكُ اللَّوْنِ أَسْوَدُ» كناية عن سيلان الدم عليه [@marzuqi-hamasa، ص579]. والكناية عند عبد القاهر الجُرْجانيّ أن «يريد المتكلم إثبات معنى من المعاني، فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود، فيومئ به إليه» [@dalail، ص66]؛ فالسواد الذي غطّاه يتبع الدم ويلزمه. ويقول: «قد أجمع الجميع على أن الكناية أبلغ من الإفصاح»، لا لأنها تزيد في المعنى نفسه، بل لأنك «زدت في إثباته، فجعلته أبلغ وآكد وأشد» [@dalail، ص70–71]."
    - title: "تكرار «حَتَّى»"
      text: "«حتى تبدّدت، وحتى علاني»: غايتان متتابعتان، الأولى نصر، والثانية ثمن هذا النصر."
  connection: "ثم يفسّر لماذا قاتل هذا القتال: لأنه رجل جعل نفسه فداء أخيه."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَطَاعَنْ / تُ عَنْهُلْ خَيْ / لَ حَتْتَى / تَبَدْدَدَتْ = فعولن / مفاعيلن / فعولن / مفاعلن — وَحَتْتَى / عَلَانِي حَا / لِكُلْ لَوْ / نِ أَسْوَدُو = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "في هذا البيت الإِقْواء: الرَّوِيّ فيه دال مضمومة «أَسْوَدُ»، والقصيدة مكسورة الرَّوِيّ [@marzuqi-hamasa، ص579]. انظر الروايات."
context: "في هذا البيت عيب في القافية يسمى «الإِقْواء»: القصيدة مكسورة الرَّوِيّ، وهنا جاء الرَّوِيّ مضمومًا «أَسْوَدُ». ويذكر المَرْزُوقِيّ أن كثيرًا من العلماء يهوّنون أمر الإِقْواء، وأن الأَخْفَش قال: «ما أنشدتني العرب قصيدة سلمت من الإِقْواء» [@marzuqi-hamasa، ص579]."
variants:
  - reading: "وَحَتَّى عَلَانِي حَالِكٌ لَوْنُ أَسْوَدِ"
    status: "رواية يضعّفها المَرْزُوقِيّ"
    note: "بإضافة «لون» إلى «أَسْوَدُ» فيسلم البيت من الإِقْواء. لكن المَرْزُوقِيّ يرى الضعف فيها ظاهرًا، لأن «حَالِكُ» هو الشديد السواد، فلا معنى لأن يقول بعده «لون أسود» [@marzuqi-hamasa، ص579]."
  - reading: "حَالِكُ اللَّوْنِ أَسْوَدِي"
    status: "تخريج المَرْزُوقِيّ"
    note: "يريد «أسوديّ» بياء النسب، كما قيل في الأحمر: الأحمريّ، ثم خُففت الياء. ويراه أجود من الرواية السابقة، وبه يسلم البيت من الإِقْواء [@marzuqi-hamasa، ص579]."
