first: "فَطَاعَنْتُ عَنْهُ الخَيْلَ حَتَّى تَبَدَّدَتْ"
second: "وَحَتَّى عَلانِي حَالِكُ اللَّوْنِ أَسْوَدُ"
level: "basic"
meaning: "فقاتلت الفرسان بالرمح دفاعًا عنه حتى تفرقوا، وحتى جُرحت فغطاني دم شديد السواد."
vocabulary:
  - term: "طاعنت"
    text: "قاتلت بالرمح."
  - term: "تبددت"
    text: "تفرقت وانكشفت."
  - term: "حالك اللون أسود"
    text: "الدم؛ والحالك الشديد السواد. والمعنى: جُرحت فسال الدم عليّ [@marzuqi-hamasa، ص579]."
context: "في هذا البيت عيب في القافية يسمى «الإقواء»: القصيدة مكسورة الروي، وهنا جاء الروي مضمومًا «أسودُ». ويذكر المرزوقي أن كثيرًا من العلماء يهوّنون أمر الإقواء، وأن الأخفش قال: «ما أنشدتني العرب قصيدة سلمت من الإقواء» [@marzuqi-hamasa، ص579]."
