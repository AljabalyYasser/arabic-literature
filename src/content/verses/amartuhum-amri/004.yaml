explained: false
first: وَقُلْتُ لِعَارِضٍ وَأَصْحَابِ عَارِضٍ
second: وَرَهْطِ بَنِي السَّوْدَاءِ وَالْقَوْمُ شُهَّدِي
vocabulary:
- term: عَارِضٍ
  text: 'قال البغدادي: «عارض: قوم من بني جُشَم كان دُرَيْد نهاهم عن النزول حيث نزلوا فعصوه» [@khizana، ج11 ص282].'
- term: رَهْطِ
  text: قوم الرجل وعشيرته.
- term: شُهَّدِي
  text: حاضرون، أي «حاضرين مقامي أو شهودي أني قد نهيتهم» [@khizana، ج11 ص282].
