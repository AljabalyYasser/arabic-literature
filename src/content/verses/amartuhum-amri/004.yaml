first: "تَنَادَوْا فَقَالُوا: أَرْدَتِ الخَيْلُ فَارِسًا"
second: "فَقُلْتُ: أَعَبْدُ اللهِ ذَلِكُمُ الرَّدِي؟"
meaning: "تصايح القوم في المعركة: أسقطت الخيل فارسًا! فسألت خائفًا: أهو أخي عبد الله ذلك الساقط الهالك؟"
vocabulary:
  - term: "تَنَادَوْا"
    text: "نادى بعضهم بعضًا."
  - term: "الخَيْلُ"
    text: "الفرسان [@marzuqi-hamasa، ص578]."
  - term: "أَرْدَتِ"
    text: "أسقطت وأهلكت."
  - term: "الرَّدِي"
    text: "الساقط الهالك [@marzuqi-hamasa، ص578]."
syntax:
  - "«تَنَادَوْا فَقَالُوا»: فعلان متعاقبان بالفاء؛ نادى بعضهم بعضًا، وكان مضمون النداء ما قالوه."
  - "«أَرْدَتِ الخَيْلُ فَارِسًا»: فعل وفاعل ومفعول به. و«الخَيْلُ» هنا الفرسان [@marzuqi-hamasa، ص578]؛ أُسند الفعل إلى الخيل والمراد راكبوها."
  - "«أَعَبْدُ اللهِ ذَلِكُمُ الرَّدِي؟»: الهمزة للاستفهام، و«عبدُ الله» مبتدأ، و«ذَلِكُمُ» خبره، و«الرَّدِي» نعت لاسم الإشارة. والمعنى: أهو عبد الله ذلك الساقط؟"
morphology:
  - "«تَنَادَوْا» على وزن «تفاعَلوا»، وهي صيغة تدل على المشاركة: نادى بعضهم بعضًا."
  - "«أَرْدَتِ» من «أردى» على وزن «أفعل»: أهلك وأسقط. و«الرَّدِي» صفة على وزن «فَعِل» من «رَدِيَ» إذا هلك."
  - "«ذَلِكُمُ» اسم إشارة للبعيد، اتصلت به كاف الخطاب وميم الجمع لأنه يخاطب جماعة."
rhetoric:
  thesis: "البيت كله أصوات: نداء في المعركة، ثم سؤال خائف. لا يصف الشاعر مشاعره، بل يترك السؤال وحده يكشف فزعه."
  devices:
    - title: "الحوار"
      text: "نقل الكلام كما قيل: «قالوا ... فقلتُ ...»، فصار البيت مشهدًا يُسمع لا خبرًا يُروى."
    - title: "الاستفهام الخائف"
      text: "«أَعَبْدُ اللهِ ذَلِكُمُ الرَّدِي؟» سؤال يكشف فزع السائل أكثر مما يطلب جوابًا. ويذكر المَرْزُوقِيّ سببين لخطور أخيه بباله أولًا: سوء ظن الشقيق بما يصيب شقيقه، وعلمه بإقدام أخيه في الحرب وتعرضه للموت [@marzuqi-hamasa، ص578]. وقد جاء بالاسم «عَبْدُ اللهِ» بعد الهمزة مباشرة، ولم يقل: أسقط عبد الله؟ وعبد القاهر الجُرْجانيّ يفرّق بين الصورتين: إذا بدأت بالفعل «كان الشك في الفعل نفسه»، وإذا بدأت بالاسم «كان الشك في الفاعل من هو» [@dalail، ص111]. فدُرَيْد لا يسأل هل سقط فارس، فقد سمع النداء بذلك، بل يسأل: أهو أخي؟"
    - title: "الخيل والفرسان"
      text: "قال «أَرْدَتِ الخَيْلُ فَارِسًا» وأراد الفرسان [@marzuqi-hamasa، ص578]؛ فذكر الخيل وأراد راكبيها، لأنهما في المعركة شيء واحد."
  connection: "ثم يسرع إلى أخيه، فيجده والرماح تتناوله."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "تَنَادَوْ / فَقَالُو أَرْ / دَتِلْ خَيْ / لُ فَارِسَنْ = فعولن / مفاعيلن / فعولن / مفاعلن — فَقُلْتُ / أَعَبْدُلْ لَا / هِ ذَالِ / كُمُرْ رَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "همزة «اللهِ» همزة وصل تسقط في النطق، ولامه مشددة فتُحسب حرفين: «أَعَبْدُلْ لَاهِ». وجاءت «فعولن» مقبوضة مرتين في العَجُز، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "لماذا خطر له أخوه أولًا؟ يذكر المَرْزُوقِيّ سببين: خوف الشقيق على شقيقه، وعلمه بإقدام أخيه في الحرب وتعرّضه للموت [@marzuqi-hamasa، ص578]."
