first: "تَنَادَوْا فَقَالُوا: أَرْدَتِ الخَيْلُ فَارِسًا"
second: "فَقُلْتُ: أَعَبْدُ اللهِ ذَلِكُمُ الرَّدِي؟"
level: "basic"
meaning: "تصايح القوم في المعركة: أسقطت الخيل فارسًا! فسألت خائفًا: أهو أخي عبد الله ذلك الساقط الهالك؟"
vocabulary:
  - term: "تَنَادَوْا"
    text: "نادى بعضهم بعضًا."
  - term: "الخَيْلُ"
    text: "الفرسان [@marzuqi-hamasa، ص578]."
  - term: "أَرْدَتِ"
    text: "أسقطت وأهلكت."
  - term: "الرَّدِي"
    text: "الساقط الهالك [@marzuqi-hamasa، ص578]."
context: "لماذا خطر له أخوه أولًا؟ يذكر المَرْزُوقِيّ سببين: خوف الشقيق على شقيقه، وعلمه بإقدام أخيه في الحرب وتعرّضه للموت [@marzuqi-hamasa، ص578]."
