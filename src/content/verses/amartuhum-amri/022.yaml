first: "طِعَانَ امْرِئٍ آسَى أَخَاهُ بِنَفْسِهِ"
second: "وَأَعْلَمُ أَنَّ المَرْءَ غَيْرُ مُخَلَّدِ"
meaning: "طاعنتهم طعان رجل جعل نفسه فداء أخيه ورضي لها مصيره، وأنا أعلم أن الإنسان لن يعيش إلى الأبد."
vocabulary:
  - term: "طِعَانَ"
    text: "المطاعنة بالرماح."
  - term: "آسَى أَخَاهُ بِنَفْسِهِ"
    text: "جعل نفسه أسوة أخيه، ورضي لها ما جرى عليه [@marzuqi-hamasa، ص579]."
  - term: "مُخَلَّدِ"
    text: "باقٍ لا يموت."
syntax:
  - "«طِعَانَ امْرِئٍ» مفعول مطلق منصوب، وعامله «طاعنتُ» في البيت قبله: فطاعنتُ عنه الخيلَ طعانَ امرئ."
  - "«آسَى أَخَاهُ بِنَفْسِهِ» جملة في موضع جر، نعت لـ«امْرِئٍ»."
  - "«وَأَعْلَمُ»: الواو عاطفة على «طاعنتُ» في البيت قبله، أو واو الحال على تقدير: وأنا أعلم. و«أَنَّ» وما بعدها سدّت مسدّ مفعولي «أعلم»."
morphology:
  - "«طِعَان» مصدر «طاعَنَ» على وزن «فِعال»، كقاتل قتالًا، وفيه معنى المشاركة: يطعنهم ويطعنونه."
  - "«آسَى» على وزن «فاعَل» من الأُسوة: جعل نفسه أسوة لأخيه ورضي لها ما جرى عليه. والمواساة والتأسي والائتساء بمعنى واحد [@marzuqi-hamasa، ص579]."
  - "«امْرِئٍ» تتبع راؤه همزته في الحركة: امرؤٌ، وامرأً، وامرئٍ."
  - "«مُخَلَّدِ» اسم مفعول من «خلّد» على وزن «مُفَعَّل»: الباقي أبدًا."
rhetoric:
  thesis: "يختم الشاعر بحكمة تفسّر ما فعل: الموت آتٍ لا محالة، فالأكرم أن يلقاه المرء وهو يفدي أخاه."
  devices:
    - title: "الحكمة سببًا"
      text: "«وَأَعْلَمُ أَنَّ المَرْءَ غَيْرُ مُخَلَّدِ» ليست زيادة؛ إنها سبب الشجاعة كلها. يقول المَرْزُوقِيّ: «عالمًا بأن المرء لا يبقى، بل مآله إلى الفناء، وأن استقتاله ليلحق بأخيه خير له من أن يبقى بعده فيشقى بالجزع له» [@marzuqi-hamasa، ص579]."
    - title: "من الغائب إلى المتكلم"
      text: "وصف طعانه أولًا بطعان رجل آخر: «طِعَانَ امْرِئٍ آسَى أَخَاهُ»، فصار فعله مثالًا لكل أخ. ثم عاد إلى نفسه: «وَأَعْلَمُ». وفي رواية ابن قُتَيْبة والحماسة «قِتَالَ امْرِئٍ ... وَيَعْلَمُ»، فيبقى الكلام كله عن ذلك الرجل [@ibn-qutayba، ج2 ص738]."
  connection: "ثم يهوّن على نفسه: أخوه سبقه إلى الموت، وهو لاحق به «اليوم أو غد». وبهذا البيت تنتهي الأبيات السبعة التي اختارها ابن قُتَيْبة من القصيدة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "طِعَانَمْ / رِئِنْ ءَاسَى / أَخَاهُ / بِنَفْسِهِي = فعولن / مفاعيلن / فعولُ / مفاعلن — وَأَعْلَ / مُ أَنْنَلْ مَرْ / ءَ غَيْرُ / مُخَلْلَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "همزة «امْرِئٍ» همزة وصل تسقط في النطق: «طِعَانَمْ رِئِنْ». وجاءت «فعولن» مقبوضة ثلاث مرات، وكلاهما جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "يختم المقطع بحكمة تفسّر اندفاعه: ما دام الموت لا مفر منه، فالأكرم أن يلقاه المرء دفاعًا عن أخيه."
variants:
  - reading: "قِتَالَ امْرِئٍ ... وَيَعْلَمُ أَنَّ المَرْءَ"
    status: "رواية ابن قُتَيْبة والحماسة والجمهرة"
    note: "وفيها يبقى الكلام كله عن ذلك الرجل، ولا يعود الشاعر إلى نفسه [@ibn-qutayba، ج2 ص738] [@marzuqi-hamasa، ص579] [@jamhara، ص470]."
