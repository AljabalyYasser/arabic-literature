first: "غَدَاةَ دَعَانِي وَالرِّمَاحُ يَنُشْنَهُ"
second: "كَوَقْعِ الصَّيَاصِي فِي النَّسِيجِ المُمَدَّدِ"
meaning: "يوم دعاني أخي لأنجده، والرماح تتناوله من كل جانب، تتتابع في جسده كما تتتابع خشبة الحائك في خيوط النسيج الممدود."
vocabulary:
  - term: "غَدَاةَ"
    text: "صباحَ يومِ، والمراد: يومَ."
  - term: "يَنُشْنَهُ"
    text: "يتناولنه؛ من «ناش ينوش» إذا تناول [@marzuqi-hamasa، ص578]."
  - term: "الصَّيَاصِي"
    text: "خشبة الحائك يفصل بها خيوط النسيج بعضها عن بعض [@marzuqi-hamasa، ص578]."
  - term: "النَّسِيجِ المُمَدَّدِ"
    text: "الخيوط المشدودة على النَّوْل."
syntax:
  - "«غَدَاةَ» ظرف زمان منصوب، مضاف إلى جملة «دَعَانِي»: يومَ دعاني."
  - "«وَالرِّمَاحُ يَنُشْنَهُ» جملة حالية، والواو واو الحال: دعاني والرماح تتناوله. و«يَنُشْنَهُ» فعل مضارع، ونون النسوة فاعله، وهي تعود على «الرماح»، والهاء مفعول به."
  - "«كَوَقْعِ الصَّيَاصِي»: الكاف للتشبيه، والجار والمجرور صفة لمصدر محذوف، والتقدير: تنوشه نوشًا كوقع الصياصي."
  - "«فِي النَّسِيجِ المُمَدَّدِ» متعلق بـ«وقع»، و«المُمَدَّدِ» نعت للنسيج."
morphology:
  - "«يَنُشْنَهُ» من «ناش ينوش نوشًا» إذا تناول، ومنه في القرآن «التناوش» [@marzuqi-hamasa، ص578]. وأصلها «يَنُوشْنَهُ»: سكنت الشين لاتصالها بنون النسوة، فالتقى ساكنان، فحُذفت الواو، كما تقول: هنّ يَقُلْنَ ويَقُمْنَ."
  - "«الصَّيَاصِي» جمع «صِيصِيَة»، وهي خشبة الحائك. وكأنها سُمّيت بذلك تشبيهًا بصيصية الديك، وهي مخلب في ساقه، وصيصية الثور، وهي قرنه [@marzuqi-hamasa، ص578]."
  - "«المُمَدَّدِ» اسم مفعول من «مدّد» على وزن «مُفَعَّل»، والتضعيف فيه يدل على كثرة المد والشد."
rhetoric:
  thesis: "يستعير الشاعر صورة من الحياة اليومية، النسيج على النَّوْل، ليصف أقسى لحظة في المعركة؛ فيجتمع في البيت المألوف والفاجع."
  devices:
    - title: "تشبيه الحركة بالحركة"
      text: "لم يشبّه الرمح بالخشبة وحدها، بل شبّه الحركة كلها: الرماح تتتابع في جسد أخيه كما تتتابع خشبة الحائك بين خيوط النسيج الممدود [@marzuqi-hamasa، ص578]. وعبد القاهر الجُرْجانيّ يعدّ هذا من أدق التشبيه: «اعلم أن مما يزداد به التشبيه دقة وسحرًا أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]."
    - title: "المضارع «يَنُشْنَهُ»"
      text: "جاء بالمضارع ليصوّر المشهد وهو يحدث أمامنا، لا حدثًا مضى وانقضى."
    - title: "يبدأ بالنداء"
      text: "«غَدَاةَ دَعَانِي»: يبدأ البيت بصوت أخيه يستنجده، فيسمع القارئ النداء قبل أن يرى المشهد. وفي رواية ابن قُتَيْبة والحماسة «فَجِئْتُ إِلَيْهِ»، فيبدأ البيت بفعل الشاعر نفسه [@ibn-qutayba، ج2 ص738]."
  connection: "ثم يصف نفسه وهو يقبل عليه: «وَكُنْتُ كَذَاتِ الْبَوِّ رِيعَتْ فَأَقْبَلَتْ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "غَدَاةَ / دَعَانِي وَرْ / رِمَاحُ / يَنُشْنَهُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — كَوَقْعِصْ / صَيَاصِي فِنْ / نَسِيجِلْ / مُمَدْدَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "«وَالرِّمَاحُ» تُنطق «وَرْرِمَاحُ»: اللام الشمسية تُدغم في الراء فلا تُحسب، والراء المشددة حرفان. وجاءت «فعولن» مقبوضة «فعولُ» مرتين في الصدر، وهو جائز في حشو الطويل [@atiq، ص29] [@ahda-sabil، ص28]."
context: "صورة من الحياة اليومية: الحائك ونسيجه. يستعيرها الشاعر ليصف مشهد الموت، فيصير الأخ كالنسيج على النَّوْل، والرماح تتخلله كما تتخلل الخشبة خيوطه."
variants:
  - reading: "فَجِئْتُ إِلَيْهِ وَالرِّمَاحُ تَنُوشُهُ"
    status: "رواية ابن قُتَيْبة والحماسة والجمهرة"
    note: "وفيها يبدأ البيت بمجيء الشاعر، لا بنداء أخيه [@ibn-qutayba، ج2 ص738] [@jamhara، ص469]."
