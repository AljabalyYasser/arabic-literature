first: "صَبَا مَا صَبَا حَتَّى عَلَا الشَّيْبُ رَأْسَهُ"
second: "فَلَمَّا عَلَاهُ قَالَ لِلْبَاطِلِ ابْعَدِ"
meaning: "لهى أخي في شبابه ما شاء أن يلهو، حتى إذا ظهر الشيب في رأسه قال للّهو: اذهب عني، فتركه."
vocabulary:
  - term: "صَبَا"
    text: "مال إلى اللهو والغزل. و«الصَّبْوَة: جَهْلَة الفُتُوَّة واللهو من الغزل» [@lisan، ج14 ص449]."
  - term: "عَلَا الشَّيْبُ رَأْسَهُ"
    text: "ظهر فيه البياض."
  - term: "الْبَاطِلِ"
    text: "اللهو واللعب."
  - term: "ابْعَدِ"
    text: "اذهب وابتعد، أو اهلك. يقال: «بَعِدَ بَعَدًا وبَعُد: هلك أو اغترب» [@lisan، ج3 ص91]."
syntax:
  - "«صَبَا مَا صَبَا»: «ما» اسم مبهم في موضع المفعول المطلق، والتقدير: صبا الصِّبا الذي صباه. ولم يحدّه، لأن إبهامه يدل على كثرته، كقوله تعالى: «فَغَشِيَهُمْ مِنَ الْيَمِّ مَا غَشِيَهُمْ»."
  - "«حَتَّى» حرف غاية: امتد صباه إلى أن علا الشيب رأسه."
  - "«فَلَمَّا عَلَاهُ قَالَ»: «لمّا» ظرف بمعنى «حين» فيه معنى الشرط، وجوابها «قَالَ»."
  - "«ابْعَدِ» فعل أمر، والجملة مقول القول، وكُسرت الدال للقافية."
morphology:
  - "«صَبَا» فعل ماض أصل لامه واو، من «صبا صَبْوًا وصُبُوًّا وصِبًى» [@lisan، ج14 ص449]."
  - "«ابْعَدِ» أمر من «بَعِدَ يَبْعَدُ»، وهمزته همزة وصل. وفي رواية الجمهرة «ابْعُدِ» من «بَعُدَ يَبْعُدُ» [@jamhara، ص474]، والفعلان بمعنى [@lisan، ج3 ص91]."
rhetoric:
  thesis: "بيت يختصر حياة أخيه كلها: شباب لاهٍ، ثم رجولة جادّة. والتحول يأتي في لحظة واحدة، كأنه قرار."
  devices:
    - title: "إبهام «ما صبا»"
      text: "لم يذكر ما فعل أخوه في صباه، بل قال «صبا ما صبا»، وترك للسامع أن يتصوره. والإبهام هنا أبلغ من التفصيل، لأن ما يُترك للخيال أوسع مما يُعدّ."
    - title: "تكرار «علا»"
      text: "«حتى علا الشيب رأسه، فلما علاه»: أعاد الفعل ليصل آخر الصبا بأول الجِدّ، فلا فاصل بينهما."
    - title: "مخاطبة الباطل"
      text: "جعل الباطل شخصًا يُخاطب ويُطرد: «قال للباطل ابعد». فصار ترك اللهو فعلًا حاسمًا، كرجل يصرف صاحبًا لم يعد يريده."
  connection: "ثم يهوّن على نفسه فقده: لم يقل لأخيه يومًا «كذبت»، ولم يبخل عليه بما ملكت يده."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "صَبَا مَا / صَبَا حَتْتَى / عَلَشْ شَيْ / بُرَأْسَهُو = فعولن / مفاعيلن / فعولن / مفاعلن — فَلَمْمَا / عَلَاهُ قَا / لَلِلْبَا / طِلِبْعَدِي = فعولن / مفاعلن / فعولن / مفاعلن"
  note: "همزة «ابْعَدِ» همزة وصل تسقط في النطق: «طِلِبْعَدِي». وجاءت «مفاعيلن» في حشو العَجُز مقبوضة «مفاعلن» (عَلَاهُ قَا) [@ahda-sabil، ص28]."
context: "من الأبيات التي يصف فيها أخاه عبد الله بعد أن يذكر مقتله: لم يكن جبانًا يقف عن القتال ولا طائش اليد، وكان صبورًا على المصائب، ثم هذا البيت. وهو من الأبيات التي اختارها ابن قُتَيْبة من القصيدة [@ibn-qutayba، ج2 ص739]."
variants:
