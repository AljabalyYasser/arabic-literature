first: وَبَانَتْ وَلَمْ أَحْمَدْ إِلَيْكَ جِوَارَهَا
second: وَلَمْ تُرْجَ فِينَا رِدَّةُ الْيَوْمِ أَوْ غَدِ
vocabulary:
- term: بَانَتْ
  text: فارقت وبعدت.
- term: لَمْ أَحْمَدْ إِلَيْكَ جِوَارَهَا
  text: 'لم أجد قربها مما يُحمد فأثني عليه عندك؛ من قولهم: «أحمد إليك الله: أشكره عندك» [@lisan، ج3 ص156].'
- term: رِدَّةُ
  text: رجوع وعودة.
