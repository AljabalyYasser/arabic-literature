first: "فَلَمَّا عَصَوْنِي كُنْتُ مِنْهُمْ وَقَدْ أَرَى"
second: "غَوَايَتَهُمْ وَأَنَّنِي غَيْرُ مُهْتَدِ"
level: "basic"
meaning: "فلما رفضوا رأيي بقيت معهم ولم أفارقهم، وأنا أرى ضلالهم، وأعرف أنني حين أتبعهم لا أسلك طريق الصواب."
vocabulary:
  - term: "عصوني"
    text: "خالفوا رأيي ولم يعملوا به."
  - term: "غوايتهم"
    text: "ضلالهم وخطأ رأيهم."
  - term: "مهتد"
    text: "من اهتدى إلى الصواب."
context: "هنا ينقلب الموقف: الرجل الذي يرى الخطأ بوضوح يختار أن يبقى في صف قومه. ويقول المرزوقي إن «منهم» هنا تفيد الوفاق وترك الخلاف [@marzuqi-hamasa، ص576]."
