explained: false
first: وَلَا بَرَمًا إِذَا الرِّيَاحُ تَنَاوَحَتْ
second: بِرَطْبِ الْعِضَاهِ وَالضَّرِيعِ الْمُعَضَّدِ
vocabulary:
- term: بَرَمًا
  text: 'البَرَم: «الذي لا يدخل مع القوم في الميسر» [@lisan، ج12 ص43].'
- term: تَنَاوَحَتْ
  text: 'اشتد هبوبها وتقابلت؛ «والرياح إذا اشتد هبوبها يقال: تناوحت» [@lisan، ج2 ص627].'
- term: الْعِضَاهِ
  text: كل شجر له شوك.
- term: الضَّرِيعِ الْمُعَضَّدِ
  text: 'الضريع: نبت، وقيل: هو العوسج الرطب [@lisan، ج8 ص223]؛ والمعضَّد: المقطوع؛ و«العضيد والعضد: ما قطع من الشجر» [@lisan، ج3 ص294].'
