explained: false
first: وَإِنْ يَكُ عَبْدُ اللَّهِ خَلَّى مَكَانَهُ
second: فَمَا كَانَ وَقَّافًا وَلَا طَائِشَ الْيَدِ
vocabulary:
- term: خَلَّى مَكَانَهُ
  text: مات؛ «وخلّى فلان مكانه إذا مات» [@lisan، ج14 ص242].
- term: وَقَّافًا
  text: «المحجم عن القتال كأنه يقف نفسه عنه ويعوقها» [@lisan، ج9 ص360].
- term: طَائِشَ الْيَدِ
  text: الذي تخطئ ضربته أو رميته؛ و«طيش السهم جوره عن سننه» [@lisan، ج6 ص312].
