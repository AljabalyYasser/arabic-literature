first: سَلِيمِ الشَّظَى عَبْلِ الشَّوَى شَنِجِ النَّسَا
second: طَوِيلِ الْقَرَا نَهْدٍ أَسِيلِ الْمُقَلَّدِ
vocabulary:
- term: سَلِيمِ الشَّظَى
  text: 'الشظى: «عُظيم ملزق بالذراع، فإذا تحرك من موضعه قيل قد شَظِيَ الفرس» [@lisan، ج14 ص433].'
- term: عَبْلِ الشَّوَى
  text: 'غليظ القوائم؛ والشوى: اليدان والرجلان.'
- term: شَنِجِ النَّسَا
  text: متقبّض عرق النسا، «وهو مدح له لأنه إذا تقبّض نساه وشنج لم تسترخ رجلاه» [@lisan، ج2 ص309].
- term: الْقَرَا نَهْدٍ أَسِيلِ الْمُقَلَّدِ
  text: 'القرا: الظهر، والنهد: الضخم المشرف، وأسيل المقلَّد: طويل العنق أملسه، والمقلَّد موضع القلادة.'
