first: "جَهْمُ الْمُحَيَّا تُضِيءُ اللَّيْلَ صُورَتُهُ"
second: "آبَاؤُهُ مِنْ طِوَالِ السَّمْكِ أَحْرَارُ"
meaning: "عابس الوجه في وجه أعدائه، وصورته مع ذلك تضيء الليل، وآباؤه أحرار كرام طوال القامات. ويقول المحقق: «جهم المحيا: كالح باسر لأعدائه، السمك: القامة» [@diwan-khansa، ص389]."
vocabulary:
  - term: "جَهْمُ الْمُحَيَّا"
    text: "عابس الوجه. «ورجل جهم الوجه أي كالح الوجه» [@lisan، ج12 ص111]."
  - term: "السَّمْكِ"
    text: "القامة والطول. «والسَّمْك: القامة من كل شيء، بعيد طويل السمك» [@lisan، ج10 ص444]."
  - term: "أَحْرَارُ"
    text: "جمع حُرّ، وهو الكريم الأصل الذي لم يُستعبد."
syntax:
  - "«جَهْمُ الْمُحَيَّا» خبر لمبتدأ محذوف، والإضافة فيه لفظية."
  - "«تُضِيءُ اللَّيْلَ صُورَتُهُ» جملة خبر ثان، و«صُورَتُهُ» فاعل. و«اللَّيْلَ» مفعول به لأن «أضاء» يأتي متعديًا: تضيء صورته الليلَ؛ ويجوز أن يكون ظرفًا: تضيء في الليل."
  - "«آبَاؤُهُ ... أَحْرَارُ» جملة اسمية مستأنفة، و«مِنْ طِوَالِ السَّمْكِ» متعلق بمحذوف حال أو صفة متقدمة."
morphology:
  - "«جَهْم» صفة مشبهة على «فَعْل». و«طِوَال» جمع «طويل» على «فِعال»، و«أَحْرَار» جمع «حُرّ» على «أَفْعال»."
  - "«تُضِيءُ» مضارع «أَضَاءَ» على «أَفْعَلَ»."
rhetoric:
  thesis: "تجمع في وجهه نقيضين: العبوس للعدو، والضياء في الليل."
  devices:
    - title: "الطباق"
      text: "جمعت بين «جَهْمُ الْمُحَيَّا» و«تُضِيءُ اللَّيْلَ صُورَتُهُ»، والجهامة ظلمة في الوجه والضياء نور. ويرفع المحقق التناقض بأن الجهامة «لأعدائه» [@diwan-khansa، ص389]. وفي البيت 18 وصفته بأنه «جَمِيلُ الْمُحَيَّا»، فالوجه الواحد له حالان."
    - title: "المبالغة"
      text: "«تُضِيءُ اللَّيْلَ صُورَتُهُ» تجعل وجهه مصدر نور، وهي صورة تتصل بالنار على رأس العَلَم في البيت 17: صخر علامة تُرى في الظلام."
    - title: "النسب"
      text: "«آبَاؤُهُ ... أَحْرَارُ» تبدأ ذكر النسب الذي يتم في البيتين التاليين: المجد الموروث، والفرع من الفرع الكريم."
  connection: "ثم تقول: ورث المجد، مبارك النفس، عظيم العطاء، كثير الغارات في الشدة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "جَهْمُلْ مُحَيْ / يَا تُضِي / ءُلْ لَيْلَ صُو / رَتُهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — آبَاؤُهُو / مِنْ طِوَا / لِسْ سَمْكِ أَحْ / رَارُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "جاء الحشو تامًّا في الشطرين: «مستفعلن فاعلن مستفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والخَبْن حذف الثاني الساكن [@atiq، ص46]. والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "في مقطع «العفة والقرى والنسب»، وبه يبدأ ذكر الآباء. ولا شرح له في الشرح المنسوب إلى ثَعْلَب."
