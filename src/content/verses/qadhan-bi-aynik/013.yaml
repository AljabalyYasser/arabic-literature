first: "لَا تَسْمَنُ الدَّهْرَ فِي أَرْضٍ وَإِنْ رُبِعَتْ"
second: "فَإِنَّمَا هِيَ تَحْنَانٌ وَتَسْجَارُ"
meaning: "لا تسمن أبدًا في أي أرض ترعاها، ولو أصاب تلك الأرض مطر الربيع فأخصبت، فما هي إلا حنين متصل وحنين ممدود."
vocabulary:
  - term: "رُبِعَتْ"
    text: "أصابها مطر الربيع. في الشرح: «ربعت: أصابها مطر الربيع، يقال: ربعت الأرض فهي مربوعة» [@diwan-khansa، ص384]، وكذلك في اللسان [@lisan، ج8 ص105]."
  - term: "تَحْنَانٌ"
    text: "حنين كثير. والحنين في الشرح: «حنت الناقة؛ إذا طربت في إثر ولدها» [@diwan-khansa، ص384]. وفي اللسان أن حنين الناقة «صوتها إذا اشتاقت إلى ولدها»، أو «نزاعها إلى ولدها من غير صوت» [@lisan، ج13 ص129]."
  - term: "تَسْجَارُ"
    text: "حنين ممدود. في الشرح: «فإذا مدت الحنين وطربت قيل سجرت سجرا» [@diwan-khansa، ص384]، ويذكر المحقق أن هذا القول منقول عن ابن السِّكِّيت [@diwan-khansa، ص384]. وفي الخزانة: «فإذا مدت الحنين وطربت قيل سجرت بالجيم» [@khizana، ج1 ص433]."
syntax:
  - "«لَا تَسْمَنُ» فاعله ضمير العجول، و«الدَّهْرَ» ظرف زمان بمعنى «أبدًا»، و«فِي أَرْضٍ» متعلق بالفعل."
  - "«وَإِنْ رُبِعَتْ» الواو للحال، و«إنْ» وصلية لا جواب لها، تفيد أن الحكم ثابت حتى في هذه الحال: ولو رُبعت الأرض."
  - "«فَإِنَّمَا هِيَ تَحْنَانٌ» مثل «فَإِنَّمَا هِيَ إِقْبَالٌ» في البيت السابق: مصدر مُخبَر به عن ذات على سعة الكلام."
morphology:
  - "«تَحْنَان» و«تَسْجَار» مصدران على «تَفْعال» بفتح التاء، وهي صيغة تدل على الكثرة والتكرار. ويقول محقق الأغاني: «التسجار: تفعال من سجرت الناقة: مدت حنينها» [@aghani-dk، ج15 ص81]."
  - "«رُبِعَتْ» فعل مبني للمجهول، ومنه اسم المفعول «مربوعة» [@diwan-khansa، ص384]."
rhetoric:
  thesis: "يبلغ المثل غايته: الحزن يغلب حاجة الجسد إلى الطعام، فلا ينفع الخصب من به هذا الحنين."
  devices:
    - title: "الكناية"
      text: "«لَا تَسْمَنُ» كناية عن أن الحزن يأكل جسدها، فالخصب حولها والهزال فيها. ولم تقل إنها حزينة، بل ذكرت أثر الحزن الذي يُرى."
    - title: "الموازنة"
      text: "أعادت قالب البيت السابق «فَإِنَّمَا هِيَ» ومصدرين متعاطفين: «إِقْبَالٌ وَإِدْبَارُ» ثم «تَحْنَانٌ وَتَسْجَارُ». فالأول حركة الجسد، والثاني صوته، والناقة في البيتين لا شيء غير حزنها."
    - title: "«وَإِنْ رُبِعَتْ»"
      text: "الربيع أخصب أوقات المرعى، فاشتراطه يقطع كل عذر: لو كان الهزال من الجدب لزال بالربيع."
  connection: "ثم يأتي خبر المثل كله: ليست بأشد وجدًا مني يوم فارقني صخر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "لَا تَسْمَنُدْ / دَهْرَ فِي / أَرْضِنْ وَإِنْ / رُبِعَتْ = مستفعلن / فاعلن / مستفعلن / فعِلن — فَإِنْنَمَا / هِيَ تَحْ / نَانُنْ وَتَسْ / جَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن»، و«فاعلن» بعدها فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "ثالث أبيات المثل. ويستطرد الشرح هنا إلى أسماء أمطار السنة، ثم يورد عن أبي عُبَيْدة المثل «لا يستوي الرغاء والحنين»، وهو «مثل للشيئين أحدهما أهون من الآخر؛ لأن الرغاء جزع والحنين ليس به بأس» [@diwan-khansa، ص384–385]. والرُّغاء صوت الناقة العالي."
