first: "وَمَا تَرَاهُ وَمَا فِي الْبَيْتِ يَأْكُلُهُ"
second: "لَكِنَّهُ بَارِزٌ بِالصَّحْنِ مِهْمَارُ"
meaning: "لا تراه مختبئًا يأكل وحده ما في بيته، بل هو ظاهر للناس بالقدح الكبير، يُكثر من الطعام لضيوفه. وفي الشرح: «مهمار: مكثار، يكثر لأضيافه من القرى. والصحن: العسّ» [@diwan-khansa، ص388]."
vocabulary:
  - term: "بَارِزٌ"
    text: "ظاهر غير مستتر."
  - term: "الصَّحْنِ"
    text: "في الشرح: «والصحن: العسّ» [@diwan-khansa، ص388]، والعُسّ القدح الكبير. وفي اللسان: «والصحن: شبه العسّ العظيم إلا أن فيه عرضا وقرب قعر» [@lisan، ج13 ص245]. وللصحن في اللسان معنى آخر: «ساحة وسط الدار» [@lisan، ج13 ص244]."
  - term: "مِهْمَارُ"
    text: "في الشرح: «مكثار، يكثر لأضيافه من القرى» [@diwan-khansa، ص388]. أما في اللسان فالمهمار «كثير الكلام»، و«الذي يهمر عليك الكلام همرا أي يكثر» [@lisan، ج5 ص266]. ويقول محقق الأغاني: «مهمار: مبالغة من الهمر، وهو انصباب المطر، كناية عن كثرة جوده. والذي في المعاجم أن المهمار: الكثير الكلام» [@aghani-dk، ج15 ص81]."
syntax:
  - "«وَمَا تَرَاهُ» «ما» نافية، والهاء مفعول به. و«وَمَا فِي الْبَيْتِ يَأْكُلُهُ» يحتمل وجهين: أن تكون «ما» نافية ثانية و«فِي الْبَيْتِ» متعلقًا بـ«يَأْكُلُ»، أي لا يأكل في البيت؛ أو أن تكون «ما» موصولة مفعولًا لـ«يَأْكُلُ» قُدّم، والجملة حال: لا تراه يأكل ما في البيت."
  - "«لَكِنَّهُ بَارِزٌ» «لكنّ» حرف استدراك ينصب الاسم ويرفع الخبر، والهاء اسمها، و«بَارِزٌ» خبرها، و«بِالصَّحْنِ» متعلق به، و«مِهْمَارُ» خبر ثان."
morphology:
  - "«مِهْمَار» على «مِفْعال»، صيغة مبالغة من «هَمَرَ» إذا صبّ."
  - "«بَارِز» اسم فاعل من «بَرَزَ»."
rhetoric:
  thesis: "صفة الكرم بصورة من الحياة اليومية: البخيل يأكل وحده في الخفاء، والكريم يخرج طعامه إلى الناس."
  devices:
    - title: "النفي ثم الاستدراك"
      text: "نفت أولًا «وَمَا تَرَاهُ وَمَا فِي الْبَيْتِ يَأْكُلُهُ»، ثم استدركت «لَكِنَّهُ بَارِزٌ بِالصَّحْنِ». فنفي الصفة الذميمة يمهّد لإثبات الحميدة، والاستدراك يقلب الصورة من الداخل المغلق إلى الخارج المفتوح."
    - title: "الكناية"
      text: "«بَارِزٌ بِالصَّحْنِ» كناية عن القِرى، كما يمثّل عبد القاهر الجُرْجانيّ للكناية بقولهم «كثير رماد القدر» يعنون «كثير القرى» [@dalail، ص66]."
    - title: "«مِهْمَارُ»"
      text: "الشرح يجعله كثير القِرى، واللسان يجعله كثير الكلام. وعلى تفسير الشرح تتصل الكلمة بالصحن قبلها، كأن الطعام يُصبّ صبًّا."
  connection: "ثم تزيد صفة الإطعام: يطعم القوم الشحم في المجاعة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "وَمَا تَرَا / هُو وَمَا / فِلْ بَيْتِ يَأْ / كُلُهُو = متفعلن / فاعلن / مستفعلن / فعِلن — لَاكِنْنَهُو / بَارِزُنْ / بِصْصَحْنِ مِهْ / مَارُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "أول بيت يقف عنده الشرح بعد البيت 17. وهو ثاني البيتين اللذين غنّى فيهما ابن سُرَيْج فيما يذكر أبو الفَرَج [@aghani-dk، ج15 ص81]."
