first: "وَإِنَّ صَخْرًا لَمِقْدَامٌ إِذَا رَكِبُوا"
second: "وَإِنَّ صَخْرًا إِذَا جَاعُوا لَعَقَّارُ"
meaning: "وإن صخرًا لكثير الإقدام على العدو إذا ركب القوم للحرب، وإنه إذا جاع الناس لكثير العَقْر للإبل يطعمهم لحمها."
vocabulary:
  - term: "مِقْدَامٌ"
    text: "«ورجل مِقدام ومِقدامة: مُقدِم كثير الإقدام على العدو جريء في الحرب» [@lisan، ج12 ص468]."
  - term: "رَكِبُوا"
    text: "ركبوا الخيل والإبل إلى الغزو."
  - term: "عَقَّارُ"
    text: "كثير العَقْر للإبل. والعقر ضرب قوائم الناقة بالسيف حتى تسقط ثم تُنحر. قال الأزهري فيما ينقله اللسان: «العقر عند العرب كشف عرقوب البعير، ثم يجعل النحر عقرا لأن ناحر الإبل يعقرها ثم ينحرها» [@lisan، ج4 ص593]."
syntax:
  - "«لَمِقْدَامٌ» خبر «إنّ» دخلت عليه اللام المزحلقة، و«إِذَا رَكِبُوا» ظرف فيه معنى الشرط متعلق بـ«مِقْدَامٌ»، وجوابه محذوف يدل عليه ما قبله."
  - "في العجز تقدّم الظرف «إِذَا جَاعُوا» على الخبر «لَعَقَّارُ»، والواو في «رَكِبُوا» و«جَاعُوا» للقوم."
morphology:
  - "«مِقْدَام» على «مِفْعال»، و«عَقَّار» على «فَعّال»، وكلاهما صيغة مبالغة تدل على أن الفعل عادة له لا مرة."
  - "«جَاعُوا» فعل أجوف أصله «جَوِعُوا»، قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها."
rhetoric:
  thesis: "صفتا الفارس الكريم مرة أخرى: يتقدم في الحرب، ويُطعم في المجاعة."
  devices:
    - title: "التكرار"
      text: "«وَإِنَّ صَخْرًا» للمرة الثالثة والرابعة. والتكرار هنا للتنويه بالاسم كما يقول ابن رَشِيق في البيت السابق [@ibn-rashiq، ج2 ص74]، وهو أيضًا نداء النائحة التي تعيد اسم ميتها."
    - title: "التقديم والتأخير"
      text: "في الصدر جاء الخبر قبل الظرف «لَمِقْدَامٌ إِذَا رَكِبُوا»، وفي العجز جاء الظرف قبل الخبر «إِذَا جَاعُوا لَعَقَّارُ». فالشطران متقابلان كالمرآة، والعجز يقدّم حال الجوع، لأنها ما يشغل السامع، ثم يأتي الفرج «لَعَقَّارُ» في آخر البيت. ويقول عبد القاهر الجُرْجانيّ ناقلًا عن سِيبَوَيْه في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "المقابلة"
      text: "قابلت بين «رَكِبُوا»، وهي حال الحرب، و«جَاعُوا»، وهي حال الجدب، فصخر حاضر في الشدتين."
  connection: "ثم يأتي ذروة المقطع: الهداة يأتمّون به كأنه جبل في رأسه نار."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "وَإِنْنَ صَخْ / رَنْ لَمِقْ / دَامُنْ إِذَا / رَكِبُو = متفعلن / فاعلن / مستفعلن / فعِلن — وَإِنْنَ صَخْ / رَنْ إِذَا / جَاعُو لَعَقْ / قَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الشطرين فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "وسط مقطع «وإنّ صخرًا». ولم نجده عند المُبَرِّد ولا أبي الفَرَج ولا ابن رَشِيق ولا البَغْداديّ، فهؤلاء يصلون البيت 15 بالبيت 17 [@kamil، ج4 ص40]؛ [@aghani-dk، ج15 ص81]؛ [@khizana، ج1 ص433]. ولا يقف عنده الشرح، والكلام الذي بعده في النشرة («يقال: ما أحلى وما أمرّ») تفسير للبيت 14 [@diwan-khansa، ص385]."
