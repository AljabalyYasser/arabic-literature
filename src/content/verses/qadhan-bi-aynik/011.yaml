first: "فَمَا عَجُولٌ عَلَى بَوٍّ تُطِيفُ بِهِ"
second: "لَهَا حَنِينَانِ إِصْغَارٌ وَإِكْبَارُ"
meaning: "ليست ناقة فقدت ولدها، فهي تدور حول جلده المحشوّ وتحنّ حنينين، خافتًا مرة وعاليًا مرة، بأشدّ حزنًا مني يوم فارقني صخر. وخبر «ما» لا يأتي إلا في البيت 14: «بِأَوْجَدَ مِنِّي». وفي الشرح: «تقول: ترفع من صوتها مرة وتخفض أخرى» [@diwan-khansa، ص383]."
vocabulary:
  - term: "عَجُولٌ"
    text: "الناقة التي فقدت ولدها. في الشرح: «العجول: التي يموت ولدها وهو صغير»، وقال أبو عُبَيْدة: «العجول والخلوج والسلوب والواله: مثل الفاقد» [@diwan-khansa، ص382]. وفي اللسان: «والعَجُول من النساء والإبل: الواله التي فقدت ولدها الثكلى لعجلتها في جيئتها وذهابها جزعا» [@lisan، ج11 ص427]."
  - term: "بَوٍّ"
    text: "جلد ولد الناقة يُحشى ويُقرَّب منها لتدرّ عليه. في الشرح: «والبوّ: أن ينحر ولد الناقة ويحشى جلده ثماما أو غيره من الشجر، ويدنى من أمه فترأمه» [@diwan-khansa، ص382]. والثُّمام: نبت، وترأمه: تعطف عليه وتشمّه."
  - term: "تُطِيفُ بِهِ"
    text: "تدور حوله وتلازمه."
  - term: "إِصْغَارٌ وَإِكْبَارُ"
    text: "حنين خافت وحنين عالٍ. وفي حاشية المحقق عن العاصمي: «إصغار وإكبار أي صغير وكبير» [@diwan-khansa، ص382]."
syntax:
  - "«ما» نافية حجازية تعمل عمل «ليس»، و«عَجُولٌ» اسمها، وخبرها «بِأَوْجَدَ» في البيت 14، والباء فيه زائدة. فالجملة تمتد على أربعة أبيات."
  - "«عَلَى بَوٍّ» متعلق بـ«تُطِيفُ»، وجملة «تُطِيفُ بِهِ» صفة لـ«عَجُولٌ»."
  - "«لَهَا حَنِينَانِ» جملة في موضع الصفة الثانية، و«إِصْغَارٌ وَإِكْبَارُ» بدل من «حَنِينَانِ»."
morphology:
  - "«عَجُول» على «فَعُول» بمعنى فاعل، يستوي فيه المذكر والمؤنث، فلم تلحقه التاء."
  - "«تُطِيف» مضارع «أَطَافَ» الرباعي. و«إِصْغَار» و«إِكْبَار» مصدرا «أَصْغَرَ» و«أَكْبَرَ» على «إِفْعال»."
rhetoric:
  thesis: "تضرب لحزنها مثلًا من حياة الإبل التي يعرفها السامعون: أمّ تحنّ إلى ولد ميت."
  devices:
    - title: "التشبيه التمثيلي"
      text: "لا تشبّه شيئًا بشيء مفرد، بل حالها كلها بحال الناقة كلها: الفقد، والدوران حول جلد الولد، والحنين المتقطع. والتشبيه التمثيلي هو ما كان وجه الشبه فيه صورة منتزعة من أشياء متعددة. ثم تنفي أن تكون الناقة أشد حزنًا منها، فالمثل ينتهي إلى أن حزنها أعظم من المثل نفسه."
    - title: "«البَوّ»"
      text: "الناقة تُخدع بجلد محشوّ فتعطف عليه، وهي تعلم في قرارتها أنه ليس ولدها. وفي اختيار هذا المشهد قسوة: عزاءٌ صورته صورة الفقيد ولا روح فيه."
    - title: "الطباق"
      text: "جمعت بين ضدين في «إِصْغَارٌ وَإِكْبَارُ». والطباق الجمع بين الكلمة وضدها، وهنا يرسم الضدان صوت الناقة يعلو ويخفت."
  connection: "ثم تصف قلق الناقة: ترعى ما غفلت، فإذا تذكرت صارت إقبالًا وإدبارًا."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "فَمَا عَجُو / لُنْ عَلَى / بَوْوِنْ تُطِي / فُ بِهِي = متفعلن / فاعلن / مستفعلن / فعِلن — لَهَا حَنِي / نَانِ إِصْ / غَارُنْ وَإِكْ / بَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الشطرين فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يفتتح مقطع «العَجُول» (11–14). وفي ترتيبه خلاف: ابن الأعرابي «روى هذا البيت بعد قوله: تبكي لصخر» [@diwan-khansa، ص382]، أي بعد البيت 3. وفي خبر نقله البَغْداديّ عن ابن خلف «عن بعضهم أنه في وصف بقرة أخذ ولدها» [@khizana، ج1 ص433]، لا ناقة."
variants:
  - reading: "حَنِينُ وَالِهَةٍ ضَلَّتْ أَلِيفَتَهَا"
    status: "رواية ابن الأعرابي"
    note: "في الشرح: «ورواه ابن الأعرابي: حنين والهة ضلّت أليفتها لها حنينان» [@diwan-khansa، ص382]. والأليفة: «صاحبتها التي كانت ترعى معها» [@diwan-khansa، ص383]. وفي العقد: «بُكَاءُ وَالِهَةٍ ضَلَّتْ أَلِيفَتَهَا» [@iqd، ج3 ص224]."
  - reading: "قَدْ سَاعَدَتْهَا عَلَى التَّحْنَانِ أَظْآرُ"
    status: "رواية ابن قُتَيْبة والخزانة"
    note: "وصدره عند ابن قُتَيْبة «فَمَا عَجُولٌ لَدَى بَوٍّ تُطِيفُ بِهِ» [@ibn-qutayba، ج1 ص335]؛ [@khizana، ج1 ص432]. والأظآر جمع ظئر، وهي «التي تعطف على ولد غيرها» [@khizana، ج1 ص432]. ويروي ابن قُتَيْبة بعده بيتًا ليس عند ثَعْلَب عجزه عجز هذا البيت (انظر مدخل القصيدة)."
  - reading: "وَمَا عَجُولٌ عَلَى بَوٍّ تَحِنُّ لَهُ / لَهَا حَنِينَانِ إِعْلَانٌ وَإِسْرَارُ"
    status: "رواية الكامل"
    note: "[@kamil، ج4 ص40]، وفي المطبوع «إغلان» بالغين، ونراه تصحيفًا."
