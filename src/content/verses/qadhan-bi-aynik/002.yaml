first: "كَأَنَّ عَيْنِي لِذِكْرَاهُ إِذَا خَطَرَتْ"
second: "فَيْضٌ يَسِيلُ عَلَى الْخَدَّيْنِ مِدْرَارُ"
meaning: "كلما مرّت ذكرى صخر بخاطرها صارت عينها كأنها ماء فائض يسيل على خديها، غزيرًا لا ينقطع. وهذا جواب ضمني عن أسئلة البيت الأول: ليس بعينها قذى ولا رمد، بل ذكراه."
vocabulary:
  - term: "خَطَرَتْ"
    text: "مرّت بالبال وعرضت للنفس."
  - term: "فَيْضٌ"
    text: "ماء كثير يفيض فيسيل من جوانب ما هو فيه."
  - term: "مِدْرَارُ"
    text: "كثير الدَّرّ والسيلان. ومنه في لسان العرب: «وسماء مدرار وسحابة مدرار» [@lisan، ج4 ص280]، أي كثيرة المطر."
syntax:
  - "«كَأَنَّ» حرف تشبيه ينصب الاسم ويرفع الخبر، و«عَيْنِي» اسمها، و«فَيْضٌ» خبرها، وجملة «يَسِيلُ» صفة لـ«فَيْضٌ»، و«مِدْرَارُ» صفة ثانية."
  - "«لِذِكْرَاهُ» اللام للتعليل، متعلقة بما في «فَيْضٌ» من معنى الفيض، أي تفيض لذكراه. والهاء لصخر، وإن لم يُذكر اسمه بعد، فهو حاضر في نفسها قبل أن تسمّيه."
  - "«إِذَا خَطَرَتْ» ظرف لما يستقبل متضمن معنى الشرط، وجوابه مفهوم مما قبله: إذا خطرت ذكراه فاضت."
morphology:
  - "«مِدْرَار» على «مِفْعال»، وهي صيغة مبالغة من «دَرَّ» إذا سال وكثر، ويستوي فيها المذكر والمؤنث."
  - "«ذِكْرَى» على «فِعْلَى»، اسم من الذِّكر، وأُضيفت إلى الضمير: ذكراه."
rhetoric:
  thesis: "تصف الدمع بعد أن سألت عن سببه، فتجعل العين نفسها سيلًا."
  devices:
    - title: "التشبيه"
      text: "في «كَأَنَّ عَيْنِي ... فَيْضٌ» شبّهت العين نفسها بالماء الفائض، ولم تقل إن دمعها كالفيض. فالعين في الصورة صارت ماءً كلها، وهذا أبلغ من تشبيه الدمع وحده."
    - title: "تتابع الصفات"
      text: "وصفت الفيض بصفتين: «يَسِيلُ عَلَى الْخَدَّيْنِ» ثم «مِدْرَارُ»، فالأولى ترسم حركته على الوجه، والثانية كثرته ودوامه."
  connection: "ثم تقول من تبكي: تبكي لصخر، وقد حال بينها وبينه تراب القبر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "كَأَنْنَ عَيْ / نِي لِذِكْ / رَاهُو إِذَا / خَطَرَتْ = متفعلن / فاعلن / مستفعلن / فعِلن — فَيْضُنْ يَسِي / لُ عَلَلْ / خَدْدَيْنِ مِدْ / رَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يكمل المطلع: من السؤال عن العين إلى وصف دمعها. ولم يقف الشرح المنسوب إلى ثَعْلَب عند هذا البيت بشيء، فشرحه على الألفاظ في البيت الأول [@diwan-khansa، ص378]."
