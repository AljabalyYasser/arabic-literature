first: "فَرْعٌ لِفَرْعٍ كَرِيمٍ غَيْرِ مُؤْتَشَبٍ"
second: "جَلْدُ الْمَرِيرَةِ عِنْدَ الْجَمْعِ فَخَّارُ"
meaning: "هو سيد من سلالة سادة، أصله كريم صريح لا خلط فيه، صلب العزيمة، وإذا اجتمعت القبائل كان أكثرهم مفاخر. ويقول المحقق: «فرع القوم: زعيمهم، المؤتشب: المخلوط النسب، المريرة: إبرام الرأي، والجلد: الحازم، والفخار: الكثير الفخر، أو الذي يكثر خيره فيكثر ما يفخر به» [@diwan-khansa، ص389]."
vocabulary:
  - term: "فَرْعٌ"
    text: "الفرع من القوم شريفهم الذي يعلوهم. «وفرع القوم وتفرّعهم: فاقهم» [@lisan، ج8 ص247]."
  - term: "مُؤْتَشَبٍ"
    text: "مخلوط النسب. «ورجل مأشوب الحسب: غير محض، وهو مُؤتشِب أي مخلوط غير صريح في نسبه» [@lisan، ج1 ص214]."
  - term: "الْمَرِيرَةِ"
    text: "العزيمة، وأصلها الحبل الشديد الفتل. «والمرير والمريرة: العزيمة»، «وقيل: المريرة الحبل الشديد الفتل» [@lisan، ج5 ص168]."
  - term: "فَخَّارُ"
    text: "كثير الفخر. والفخر «التمدح بالخصال والافتخار وعدّ القديم» [@lisan، ج5 ص48]."
syntax:
  - "«فَرْعٌ» خبر لمبتدأ محذوف، و«لِفَرْعٍ» متعلق بمحذوف صفة لـ«فَرْعٌ»، و«كَرِيمٍ» صفة لـ«فَرْعٍ» المجرور، و«غَيْرِ مُؤْتَشَبٍ» صفة ثانية."
  - "«جَلْدُ الْمَرِيرَةِ» خبر ثان، و«فَخَّارُ» خبر ثالث، و«عِنْدَ الْجَمْعِ» ظرف متعلق بـ«فَخَّارُ»."
morphology:
  - "«مُؤْتَشَب» من «ائْتَشَبَ» على «افْتَعَلَ» من «أَشِبَ» إذا اختلط. وضبطته النشرة بفتح الشين، وفي اللسان «مُؤتشِب» بكسرها اسم فاعل [@lisan، ج1 ص214]."
  - "«فَخَّار» على «فَعّال» للمبالغة، و«مَرِيرَة» على «فَعِيلة»."
rhetoric:
  thesis: "خاتمة النسب: صخر غصن من شجرة كلها كريمة."
  devices:
    - title: "الاستعارة"
      text: "في «فَرْعٌ لِفَرْعٍ» جعلت النسب شجرة، وصخرًا فرعًا من فرع، فالكرم يتسلسل فيه غصنًا بعد غصن. وفي «جَلْدُ الْمَرِيرَةِ» جعلت العزيمة حبلًا مفتولًا شديدًا لا ينقطع."
    - title: "النفي في الوصف"
      text: "«غَيْرِ مُؤْتَشَبٍ» تنفي عنه شائبة النسب، وفي العرب من يُعيَّر باختلاط نسبه، فهي تقطع على العائب الطريق."
    - title: "«عِنْدَ الْجَمْعِ فَخَّارُ»"
      text: "الفخر في مجامع القبائل كان مناظرة بالمآثر، وصخر فيها كثير ما يُعدّ له. ويفسرها المحقق بأنه «الذي يكثر خيره فيكثر ما يفخر به» [@diwan-khansa، ص389]."
  connection: "ثم تنتقل فجأة إلى القبر: مقيم في جوف رمس فوقه الصخور والحجارة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "فَرْعُنْ لِفَرْ / عِنْ كَرِي / مِنْ غَيْرِ مُؤْ / تَشَبِنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — جَلْدُلْ مَرِي / رَةِ عِنْ / دَلْ جَمْعِ فَخْ / خَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "آخر مقطع «العفة والقرى والنسب». ويذكر المحقق أن نسخة من رواية ابن السِّكِّيت تروي بعده صورة أخرى للبيت 18: «سهل جميل جواد بارع ورع / وفي الحروب إذا لاقيت مسعار» [@diwan-khansa، ص389]."
