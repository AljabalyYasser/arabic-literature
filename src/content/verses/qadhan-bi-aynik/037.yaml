first: "جَوَّابُ قَاصِيَةٍ جَزَّازُ نَاصِيَةٍ"
second: "عَقَّادُ أَلْوِيَةٍ لِلْخَيْلِ جَرَّارُ"
meaning: "يجوب الأرض البعيدة، ويجزّ نواصي الفرسان، ويعقد رايات الحرب، ويقود الخيل الكثيرة."
vocabulary:
  - term: "جَوَّابُ"
    text: "كثير الجَوْب، أي قطع البلاد والسير فيها."
  - term: "قَاصِيَةٍ"
    text: "أرض بعيدة. «والقاصي والقاصية والقصيّ والقصيّة من الناس والمواضع: المتنحي البعيد» [@lisan، ج15 ص184]."
  - term: "جَزَّازُ نَاصِيَةٍ"
    text: "الناصية شعر مقدَّم الرأس، وجزّها قصّها. والمراد، فيما نفهم، أنه يأسر الفرسان ثم يمنّ عليهم فيجزّ نواصيهم ويطلقهم، فجزّ الناصية علامة على القدرة والمنّ."
  - term: "عَقَّادُ أَلْوِيَةٍ"
    text: "يعقد الرايات، أي يعلن الحرب ويجمع لها. واللواء «الراية ولا يمسكها إلا صاحب الجيش»، «وألوى اللواء: عمله أو رفعه» [@lisan، ج15 ص266]."
  - term: "جَرَّارُ"
    text: "يقود خيلًا كثيرة ثقيلة السير. «وعسكر جرّار: كثير» [@lisan، ج4 ص130]."
syntax:
  - "«جَوَّابُ قَاصِيَةٍ» خبر لمبتدأ محذوف، وما بعده أخبار متتابعة بلا عطف."
  - "صيغ المبالغة أُضيفت إلى مفعولها في المعنى: يجوب القاصية، ويجزّ الناصية، ويعقد الألوية. و«لِلْخَيْلِ» متعلق بـ«جَرَّارُ»."
morphology:
  - "«جَوَّاب» على «فَعّال» من «جاب يجوب»، فعل أجوف واوي ظهرت واوه في صيغة المبالغة."
  - "«قَاصِيَة» و«نَاصِيَة» على «فاعِلة»، و«أَلْوِيَة» جمع «لِواء» على «أَفْعِلة»."
rhetoric:
  thesis: "بيت مرصّع آخر، وفيه ينتقد العَسْكَرِيّ الخلل الذي يقع حين يُكثر الشاعر من الترصيع."
  devices:
    - title: "الترصيع"
      text: "«جَوَّابُ قَاصِيَةٍ / جَزَّازُ نَاصِيَةٍ» جزآن على صيغة واحدة «فَعّالُ فاعِلَةٍ» وسجع واحد «ـاصِيَةٍ»، وهو أكمل ما يكون الترصيع: سجع في الحرف، و«جنس واحد في التصريف» كما يقول قُدامة [@naqd-al-shir، ص11]. ثم «عَقَّادُ أَلْوِيَةٍ» يحفظ الصيغة ويقارب السجع، ثم «لِلْخَيْلِ جَرَّارُ» يخرج عن الاثنين."
    - title: "نقد العَسْكَرِيّ"
      text: "يقول أبو هلال في هذا البيت: «آخر هذا البيت لا يجرى مع ما قبله، وإذا قسته بأوله وجدته فاترا باردا» [@sinaatayn، ص378]. يعني أن الأجزاء الثلاثة الأولى تبني في الأذن نسقًا قويًّا، ثم يأتي «لِلْخَيْلِ جَرَّارُ» ضعيفًا لا يجاري ما قبله، لأن القافية ألزمت الشاعرة بـ«ـارُ». وهذا عنده دليل التكلف حين يتوالى الترصيع: يحسن في موضع أو موضعين، فإذا كثر «دلّ على التكلّف» [@sinaatayn، ص377]. وهو قريب مما قاله قُدامة قبله: إذا تواتر الترصيع في الأبيات «دل على تعمل وأبان عن تكلف» [@naqd-al-shir، ص13]."
    - title: "شبهه بالبيت 20"
      text: "بين هذا البيت والبيت 20 «حَمَّالُ أَلْوِيَةٍ ... لِلْجَيْشِ جَرَّارُ» شبه قريب: الألوية في الجزء الأول أو الثالث، و«جَرَّارُ» بعد جار ومجرور في آخرهما. فالقصيدة تدور على قالب واحد للصفات."
  connection: "ثم تصفه بالقوة: عبل الذراعين، تُخشى بديهته، له سلاحان أنياب وأظفار."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "جَوْوَابُ قَا / صِيَتِنْ / جَزْزَازُ نَا / صِيَتِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — عَقْقَادُ أَلْ / وِيَتِنْ / لِلْخَيْلِ جَرْ / رَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الشطرين فصارت «فعِلن»، فصار كل جزء مرصّع «مستفعلن فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "في مقطع «خاتمة الصفات». وهو عند العَسْكَرِيّ ثالث الأبيات التي ينقدها، بعد البيت 36 وبيت «فعّال سامية» الذي ليس في رواية ثَعْلَب [@sinaatayn، ص378]. ولا شرح له في الشرح المنسوب إلى ثَعْلَب."
