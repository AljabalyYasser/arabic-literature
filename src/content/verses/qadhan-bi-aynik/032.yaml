first: "فِي جَوْفِ رَمْسٍ مُقِيمٌ قَدْ تَضَمَّنَهُ"
second: "فِي رَمْسِهِ مُقْمَطِرَّاتٌ وَأَحْجَارُ"
meaning: "صار مقيمًا في جوف قبر احتواه، وفي قبره صخور عظيمة متراكبة وحجارة. وفي الشرح عن أبي عمرو: «مقمطرات: صخور عظام، والأحجار صغار» [@diwan-khansa، ص390]."
vocabulary:
  - term: "رَمْسٍ"
    text: "قبر. في الشرح: «الرمس: القبر، ويقال: ارمس هذا الحديث؛ أي ادفنه، والروامس: الرياح الدوافن تدفن الآثار والمعالم» [@diwan-khansa، ص390]. وفي اللسان: «وأصل الرمس: الستر والتغطية» [@lisan، ج6 ص101]."
  - term: "تَضَمَّنَهُ"
    text: "احتواه وصار هو في ضمنه."
  - term: "مُقْمَطِرَّاتٌ"
    text: "في الشرح أربعة أقوال: «وقال ابن الأعرابي: مقمطرات: دواه. وقال أبو عمرو: مقمطرات: صخور عظام، والأحجار صغار. وقال غيره: مقمطرات: شداد صلاب، ويقال: يوم قمطرير وقماطر: إذا كان شديدا. وقال غيره: المقمطرات: الأكفان، يقال: قمطروه في أكفانه» [@diwan-khansa، ص390]. وفي اللسان: «واقمطرّ عليه الشيء: تزاحم» [@lisan، ج5 ص116]."
syntax:
  - "«مُقِيمٌ» خبر لمبتدأ محذوف، أي هو مقيم، و«فِي جَوْفِ رَمْسٍ» متعلق به وقُدّم عليه."
  - "جملة «قَدْ تَضَمَّنَهُ» في موضع الصفة لـ«رَمْسٍ»، والفاعل ضمير الرمس، والهاء لصخر."
  - "«فِي رَمْسِهِ مُقْمَطِرَّاتٌ» جملة اسمية: «مُقْمَطِرَّاتٌ» مبتدأ مؤخر، و«فِي رَمْسِهِ» خبر مقدم، و«أَحْجَارُ» معطوف عليه."
morphology:
  - "«مُقْمَطِرّ» اسم فاعل من «اقْمَطَرَّ» على «افْعَلَلَّ»، وجُمع جمع مؤنث سالمًا «مُقْمَطِرّات»."
  - "«مُقِيم» اسم فاعل من «أَقَامَ»، أصله «مُقْوِم» نُقلت كسرة الواو إلى القاف فقُلبت ياءً."
rhetoric:
  thesis: "بيت القبر وحده بين الصفات: الرجل الذي كان يغير ويجوب البلاد صار «مُقِيمًا»."
  devices:
    - title: "«مُقِيمٌ»"
      text: "اختارت كلمة الإقامة لمن وصفته بالغارات والأسفار، فالكلمة تحمل مفارقة مُرّة: إقامته الآن لا رحيل بعدها."
    - title: "تكرار «رَمْس»"
      text: "«فِي جَوْفِ رَمْسٍ» ثم «فِي رَمْسِهِ»، فالقبر يُذكر مرتين في بيت واحد، وتضيق الدائرة: من القبر إلى ما في القبر، إلى الصخور فوقه."
    - title: "تعدد المعنى"
      text: "اختلف الرواة في «مُقْمَطِرَّاتٌ» بين الصخور والدواهي والشدائد والأكفان [@diwan-khansa، ص390]، والمعاني كلها تجتمع في الصورة: ثقل يجثم على الميت."
  connection: "ثم تعود إلى كرمه: طلق اليدين، ذو فجر، فليبكه الفقير والرفقة الضالة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "فِي جَوْفِ رَمْ / سِنْ مُقِي / مُنْ قَدْ تَضَمْ / مَنَهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — فِي رَمْسِهِي / مُقْمَطِرْ / رَاتُنْ وَأَحْ / جَارُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "جاء الحشو تامًّا في الشطرين: «مستفعلن فاعلن مستفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والخَبْن حذف الثاني الساكن [@atiq، ص46]. والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "مقطع «القبر». ويرويه أبو الفَرَج، وينقل تفسير أبي عمرو نفسه: «مقمطرات: صخور عظام، والأحجار صغار» [@aghani-dk، ج15 ص81، 83]. ويذكر المحقق أن قول أبي عمرو في الشرح «منقول عن ابن السكيت» [@diwan-khansa، ص390]."
variants:
  - reading: "فِي جَوْفِ لَحْدٍ مُقِيمٌ قَدْ تَضَمَّنَهُ"
    status: "رواية يذكرها المحقق"
    note: "في نسختين من رواية ابن السِّكِّيت [@diwan-khansa، ص389]. واللَّحد: الشقّ في جانب القبر."
  - reading: "أَمْسَى مُقِيمًا بِرَمْسٍ قَدْ تَضَمَّنَهُ / مِنْ فَوْقِهِ مُقْمَطِرَّاتٌ وَأَحْجَارُ"
    status: "رواية يذكرها المحقق عن القالي"
    note: "في كتاب «البارع» لأبي علي القالي [@diwan-khansa، ص389]."
