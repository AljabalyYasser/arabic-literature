first: "تَبْكِي خُنَاسٌ عَلَى صَخْرٍ وَحَقَّ لَهَا"
second: "إِذْ رَابَهَا الدَّهْرُ إِنَّ الدَّهْرَ ضَرَّارُ"
meaning: "تبكي خُناس على صخر، ومن حقها أن تبكي، فقد أصابها الدهر بما أفزعها، والدهر كثير الإضرار بالناس."
vocabulary:
  - term: "حَقَّ لَهَا"
    text: "وجب لها وكان من حقها، أي يحقّ لها البكاء."
  - term: "رَابَهَا"
    text: "أصابها بما يقلقها ويفزعها. والرَّيْب في اللغة الشك والتهمة، ويقال: «وقد رابني الأمر، وأرابني» [@lisan، ج1 ص442]."
  - term: "ضَرَّارُ"
    text: "كثير الضُّرّ، من «ضَرَّهُ يَضُرّه ضَرّاً» [@lisan، ج4 ص482]."
syntax:
  - "«عَلَى صَخْرٍ» متعلق بـ«تَبْكِي». و«وَحَقَّ لَهَا» جملة معترضة أو حالية، وفاعل «حَقَّ» ضمير البكاء المفهوم من «تبكي»."
  - "«إِذْ رَابَهَا الدَّهْرُ» «إذ» ظرف للزمن الماضي فيه معنى التعليل، متعلق بـ«تَبْكِي» أو بـ«حَقَّ»: تبكي لأن الدهر رابها."
  - "«إِنَّ الدَّهْرَ ضَرَّارُ» جملة مستأنفة تعلّل ما قبلها، و«الدَّهْرَ» اسم «إنّ»، و«ضَرَّارُ» خبرها."
morphology:
  - "«ضَرَّار» على «فَعّال»، صيغة مبالغة تدل على كثرة الفعل وتكراره."
  - "«رَابَ» فعل أجوف أصله «رَيَبَ»، قُلبت الياء ألفًا لتحركها وانفتاح ما قبلها."
rhetoric:
  thesis: "تحتج لبكائها: هو حق لها، والجاني هو الدهر."
  devices:
    - title: "التكرار"
      text: "أعادت صدر البيت السابق «تَبْكِي خُنَاسٌ» بلفظه، وأعادت «الدَّهْرُ» مرتين في العجز. فالبيت قائم على الترديد، وهو في الرثاء نداء يتكرر."
    - title: "الحكمة في آخر البيت"
      text: "ختمت بجملة عامة «إِنَّ الدَّهْرَ ضَرَّارُ» تصلح لكل مصاب. فانتقلت من حالها الخاص إلى قانون عام، وهو ما ستبني عليه البيت التالي: «لَا بُدَّ مِنْ مِيتَةٍ»."
    - title: "تشخيص الدهر"
      text: "في «رَابَهَا الدَّهْرُ» جعلت الدهر فاعلًا يصيب ويفزع، كأنه عدو. وسيعود الدهر فاعلًا في البيتين 14 و21، فهو خصمها في القصيدة كلها."
  connection: "ثم تقرر أن الموت لا بد منه، وأن الدهر يتقلب بأهله."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "تَبْكِي خُنَا / سُنْ عَلَى / صَخْرِنْ وَحَقْ / قَ لَهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — إِذْ رَابَهَدْ / دَهْرُ إِنْ / نَدْ دَهْرَ ضَرْ / رَارُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "جاء الحشو تامًّا في الشطرين: «مستفعلن فاعلن مستفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والخَبْن حذف الثاني الساكن [@atiq، ص46]. والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يختم مقطع السؤال والبكاء (1–5) بتعليل البكاء، ويمهّد لحكمة الموت في البيت 6."
variants:
