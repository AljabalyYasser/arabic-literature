first: "وَمُطْعِمُ الْقَوْمِ شَحْمًا عِنْدَ مَسْغَبِهِمْ"
second: "وَفِي الْجُدُوبِ كَرِيمُ الْجَدِّ مِيسَارُ"
meaning: "يطعم القوم الشحم، وهو أطيب اللحم، حين يجوعون، وفي سنوات القحط كريم الحظ، كثير المال والعطاء. ويقول المحقق: «كريم الجد: كريم العطاء، والميسار: الكثير الفضل» [@diwan-khansa، ص388]."
vocabulary:
  - term: "مَسْغَبِهِمْ"
    text: "جوعهم. «والسَّغْبة: الجوع، وقيل: هو الجوع مع التعب» [@lisan، ج1 ص468]."
  - term: "الْجُدُوبِ"
    text: "جمع جَدْب. «الجَدْبُ: المَحْل نقيض الخِصْب» [@lisan، ج1 ص254]، أي انقطاع المطر والمرعى."
  - term: "الْجَدِّ"
    text: "الحظ. «والجَدّ: البخت والحظوة» [@lisan، ج3 ص107]."
  - term: "مِيسَارُ"
    text: "كثير اليسار، أي المال والسعة، من «اليُسْر»."
syntax:
  - "«وَمُطْعِمُ الْقَوْمِ» معطوف على الأخبار قبله، و«الْقَوْمِ» مضاف إليه وهو المفعول الأول في المعنى، و«شَحْمًا» مفعول ثان، لأن «أطعم» يتعدى إلى مفعولين."
  - "«عِنْدَ مَسْغَبِهِمْ» ظرف متعلق بـ«مُطْعِمُ». و«وَفِي الْجُدُوبِ» متعلق بـ«مِيسَارُ»، و«كَرِيمُ الْجَدِّ» و«مِيسَارُ» خبران آخران."
morphology:
  - "«مَسْغَب» مصدر ميمي على «مَفْعَل» من «سَغِبَ»."
  - "«مُطْعِم» اسم فاعل من «أَطْعَمَ»، و«مِيسَار» على «مِفْعال» للمبالغة، و«جُدُوب» جمع «جَدْب» على «فُعُول»."
rhetoric:
  thesis: "تعود إلى الإطعام في الجوع، وهو أكثر ما تكرره من صفاته: البيت 15، والبيت 16، والبيت 25، وهذا البيت."
  devices:
    - title: "الكناية"
      text: "«شَحْمًا» تعني أجود الطعام وأغلاه، فالشحم في البادية علامة السمن والخصب. فإطعام الشحم في المجاعة يعني أنه يعطي خير ما عنده حين يكون أعزّ ما يكون."
    - title: "المقابلة"
      text: "قابلت بين «الْجُدُوبِ» و«مِيسَارُ»: الناس في جدب وهو في يسار، أي أن يُسره يظهر حين يعمّ العسر."
    - title: "الجناس"
      text: "بين «الْجُدُوبِ» و«الْجَدِّ» جناس ناقص، وهو تشابه اللفظين في أكثر الحروف مع اختلاف المعنى، فالكلمتان تتجاوران على اختلاف ما بينهما: القحط والحظ."
  connection: "ثم تقول ما كان لها هي: كان خالصتي من الناس، فلما أصيب لم يبق للعيش حاجة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "وَمُطْعِمُلْ / قَوْمِ شَحْ / مَنْ عِنْدَ مَسْ / غَبِهِمْ = متفعلن / فاعلن / مستفعلن / فعِلن — وَفِلْ جُدُو / بِ كَرِي / مُلْ جَدْدِ مِي / سَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الشطرين فصارت «متفعلن»، و«فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "في مقطع «العفة والقرى والنسب». ولا شرح له في الشرح المنسوب إلى ثَعْلَب، ولم نجده عند غير ثَعْلَب من مصادرنا."
