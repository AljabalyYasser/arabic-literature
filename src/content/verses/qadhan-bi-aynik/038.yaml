first: "عَبْلُ الذِّرَاعَيْنِ قَدْ تُخْشَى بَدِيهَتُهُ"
second: "لَهُ سِلَاحَانِ أَنْيَابٌ وَأَظْفَارُ"
meaning: "غليظ الذراعين قويّهما، يخشى الناس مفاجأته وأول ما يبدر منه، كأنه وحش له سلاحان من أنياب وأظفار. وفي الشرح: «العبل: الغليظ الألواح، الكثير العصب. والبديهة والبداهة: ما يبادَه به؛ أي يفاجئ» [@diwan-khansa، ص392]."
vocabulary:
  - term: "عَبْلُ"
    text: "ضخم غليظ. «العبل: الضخم من كل شيء» [@lisan، ج11 ص420]. والألواح في قول الشارح عظام البدن العريضة."
  - term: "بَدِيهَتُهُ"
    text: "مفاجأته. «البدْه والبُدْه والبديهة والبداهة: أول كل شيء وما يفجأ منه» [@lisan، ج13 ص475]."
syntax:
  - "«عَبْلُ الذِّرَاعَيْنِ» خبر لمبتدأ محذوف، والإضافة لفظية."
  - "«قَدْ تُخْشَى بَدِيهَتُهُ» جملة خبر ثان، و«تُخْشَى» مضارع مبني للمجهول، و«بَدِيهَتُهُ» نائب فاعل، و«قد» مع المضارع هنا للتحقيق."
  - "«لَهُ سِلَاحَانِ» «سِلَاحَانِ» مبتدأ مؤخر، و«لَهُ» خبر مقدم، والضمير لصخر، و«أَنْيَابٌ وَأَظْفَارُ» بدل من «سِلَاحَانِ»."
morphology:
  - "«عَبْل» صفة مشبهة على «فَعْل»، و«بَدِيهَة» على «فَعِيلة»."
  - "«تُخْشَى» مضارع «خَشِيَ» مبنيًّا للمجهول، قُلبت ياؤه ألفًا لتحركها وانفتاح ما قبلها."
rhetoric:
  thesis: "صورة البيت 10 تعود، لكن السلاحين هنا لصخر نفسه لا للنمر ولا للحرب."
  devices:
    - title: "الاستعارة المكنية"
      text: "في «لَهُ سِلَاحَانِ أَنْيَابٌ وَأَظْفَارُ» جعلت لصخر أنيابًا وأظفارًا، فشبّهته بالأسد أو النمر ولم تذكر المشبه به، وأبقت شيئًا من لوازمه. وهذه هي الاستعارة المكنية: يُحذف المشبه به ويُذكر ما يدل عليه."
    - title: "صورتان لبيت واحد"
      text: "عجز هذا البيت هو عجز البيت 10 إلا الضمير: هناك «لَهَا سِلَاحَانِ» وهنا «لَهُ سِلَاحَانِ». وينبه المحقق على أن هذا البيت «روي في القصيدة ذاتها بصورة أخرى»، هي البيت 10 [@diwan-khansa، ص392]. وفي الأغاني والكامل يُروى البيت 10 نفسه بـ«لَهُ سِلَاحَانِ» [@aghani-dk، ج15 ص80]؛ [@kamil، ج4 ص40]. فالأقرب أن الرواة حفظوا للعجز صدرين، فدخلت الصورتان معًا في رواية ثَعْلَب. وهذا مثال واضح على ما قاله أبو عُبَيْدة من أن الناس زادوا في مراثيها."
  connection: "ثم تختم القصيدة بالكرم: لا يمنع السائل خير ماله، ولا يجاوزه سارٍ في الليل."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "عَبْلُذْ ذِرَا / عَيْنِ قَدْ / تُخْشَى بَدِي / هَتُهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — لَهُو سِلَا / حَانِ أَنْ / يَابُنْ وَأَظْ / فَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. ومُدّت هاء «لَهُ» فصارت «لَهُو» لتتم «متفعلن»."
context: "في مقطع «خاتمة الصفات». نعرضه في موضعه كما جاء في رواية ثَعْلَب، ونقرؤه صورة ثانية للبيت 10 دخلت الرواية."
