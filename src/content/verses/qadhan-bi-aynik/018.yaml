first: "جَلْدٌ جَمِيلُ الْمُحَيَّا كَامِلٌ وَرِعٌ"
second: "وَلِلْحُرُوبِ غَدَاةَ الرَّوْعِ مِسْعَارُ"
meaning: "هو قويّ صبور، حسن الوجه، تامّ الخصال، متحرّج عن القبيح؛ وهو للحروب في صباح الفزع مُوقِد يُشعلها."
vocabulary:
  - term: "جَلْدٌ"
    text: "قويّ صلب. «والجَلَد: القوة والشدة» [@lisan، ج3 ص125]."
  - term: "الْمُحَيَّا"
    text: "الوجه."
  - term: "وَرِعٌ"
    text: "«والوَرِع، بكسر الراء: الرجل التقي المتحرج» [@lisan، ج8 ص388]، أي الذي يكفّ نفسه عما لا يليق."
  - term: "الرَّوْعِ"
    text: "الفزع. «والرَّوْع: الفزع» [@lisan، ج8 ص135]."
  - term: "مِسْعَارُ"
    text: "مُوقِد الحرب. في اللسان: «والمِسْعَرُ والمِسْعارُ: ما سُعِرَتْ به» النار، و«يقال: رجل مِسْعَرُ حرب إذا كان يؤرّثها أي تحمى به الحرب» [@lisan، ج4 ص365]."
syntax:
  - "«جَلْدٌ» خبر لمبتدأ محذوف، أي هو جلد، وما بعده أخبار متعددة بلا عطف: «جَمِيلُ الْمُحَيَّا»، «كَامِلٌ»، «وَرِعٌ»."
  - "«جَمِيلُ الْمُحَيَّا» صفة مشبهة أضيفت إلى فاعلها في المعنى، أي جميلٌ محيّاه."
  - "«وَلِلْحُرُوبِ» متعلق بـ«مِسْعَارُ»، و«غَدَاةَ الرَّوْعِ» ظرف زمان متعلق به أيضًا، و«مِسْعَارُ» خبر آخر."
morphology:
  - "«مِسْعَار» على «مِفْعال»، وهي صيغة اسم الآلة، استُعملت وصفًا للرجل مبالغة: كأنه الأداة التي تُحرَّك بها النار."
  - "«جَلْد» صفة مشبهة على «فَعْل»، و«وَرِع» على «فَعِل»."
rhetoric:
  thesis: "تبدأ سلسلة الصفات التي تملأ ما بقي من القصيدة، فتسرد خصاله سردًا متقطعًا كأنها تعدّها عدًّا."
  devices:
    - title: "تقطيع الأجزاء"
      text: "قطّعت الصدر أربع صفات متجاورة بلا عطف: «جَلْدٌ / جَمِيلُ الْمُحَيَّا / كَامِلٌ / وَرِعٌ». وهذا تقسيم بلا سجع، فإذا اتفقت أواخر الأجزاء في السجع صار ترصيعًا، كما يقول ابن رَشِيق: «وإذا كان تقطيع الأجزاء مسجوعاً أو شبيهاً بالمسجوع فذلك هو الترصيع عند قدامة» [@ibn-rashiq، ج2 ص26]. وسيأتي الترصيع التام في البيتين التاليين."
    - title: "الاستعارة"
      text: "في «لِلْحُرُوبِ ... مِسْعَارُ» جعلت الحرب نارًا وجعلته الأداة التي تُسعَّر بها. فهو لا يدخل الحرب فحسب، بل يوقدها."
    - title: "المقابلة"
      text: "الصدر لصفاته في السلم: الجلد والجمال والكمال والورع، والعجز لصفته في الحرب. وهو التقسيم نفسه الذي في البيتين 8 و15."
  connection: "ثم تزيد الصفات وتسجعها: حلو الحلاوة، فصل المقالة، فاشي الجمالة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "جَلْدُنْ جَمِي / لُلْ مُحَيْ / يَا كَامِلُنْ / وَرِعُنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — وَلِلْحُرُو / بِ غَدَا / ةَرْ رَوْعِ مِسْ / عَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن»، و«فاعلن» بعدها فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "أول مقطع «الصفات» (18–21)، وبه تبدأ المرحلة الثالثة من القراءة. والشرح المنسوب إلى ثَعْلَب لا يشرح شيئًا من الأبيات 18–24 إلا ما سيأتي في البيت 25 [@diwan-khansa، ص387–388]."
variants:
  - reading: "جَلْدٌ جَمِيلٌ مُخِيلٌ بَارِعٌ ذَرِعٌ / وَفِي الْحُرُوبِ إِذَا لَاقَيْتَ مِسْعَارُ"
    status: "رواية يذكرها المحقق"
    note: "يذكر المحقق أنها رواية لسان العرب وتاج العروس في مادة (ذرع)، و«الذّرِع: الحسن العشرة والمخالطة» [@diwan-khansa، ص387]. ويذكر أن نسخة من رواية ابن السِّكِّيت تروي بعد البيت 31 «سَهْلٌ جَمِيلٌ جَوَادٌ بَارِعٌ وَرِعٌ» بالعجز نفسه [@diwan-khansa، ص389]."
