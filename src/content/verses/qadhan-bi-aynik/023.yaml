first: "فَبِتُّ سَاهِرَةً لِلنَّجْمِ أَرْقُبُهُ"
second: "حَتَّى أَتَى دُونَ غَوْرِ النَّجْمِ أَسْتَارُ"
meaning: "فقضيت الليل ساهرة أرقب النجم، حتى حالت دون مغيبه ستور، فلم أره يغيب، أي طال الليل حتى انتهى بحجاب يحجبه."
vocabulary:
  - term: "أَرْقُبُهُ"
    text: "أرصده وأنتظره."
  - term: "غَوْرِ النَّجْمِ"
    text: "مغيبه. «وغارت الشمس تغور غيارا وغؤورا وغوّرت: غربت، وكذلك القمر والنجوم» [@lisan، ج5 ص35]."
  - term: "أَسْتَارُ"
    text: "حُجُب، جمع سِتْر. ويقول المحقق: «والمقصود: الظلمات»، ويرى أن النجم قد يكون أخاها: «ولعل المقصود بالنجم أخاها، وغوره: موته، والأستار: صفائح قبره» [@diwan-khansa، ص388]."
syntax:
  - "«بِتُّ» فعل ناقص من أخوات «كان»، والتاء اسمه، و«سَاهِرَةً» خبره."
  - "«لِلنَّجْمِ» متعلق بـ«سَاهِرَةً»، أي ساهرة من أجل النجم، وجملة «أَرْقُبُهُ» حال ثانية."
  - "«حَتَّى» حرف غاية، و«أَسْتَارُ» فاعل «أَتَى» مؤخر، و«دُونَ غَوْرِ النَّجْمِ» ظرف متعلق بـ«أَتَى»."
morphology:
  - "«بِتُّ» أصله «بَيِتُّ» من «باتَ يبيتُ»، حُذفت العين عند الإسناد إلى التاء وكُسرت الفاء لأنها يائية."
  - "«غَوْر» مصدر «غارَ يغورُ»، و«سَاهِرَة» اسم فاعل مؤنث."
rhetoric:
  thesis: "ليلة الخبر: سهر طويل ونجم يُرقب ولا يُرى أفوله."
  devices:
    - title: "السهر ورعي النجم"
      text: "مراقبة النجوم في الليل صورة قديمة للأرق في الشعر العربي، والساهر لا يجد ما يشغله إلا السماء. وفي «سَاهِرَةً لِلنَّجْمِ أَرْقُبُهُ» جعلت النجم رفيقها الوحيد في الليلة."
    - title: "تكرار «أَسْتَارُ»"
      text: "القافية هنا «أَسْتَارُ» كما في البيت 3 «وَدُونَهُ مِنْ جَدِيدِ التُّرْبِ أَسْتَارُ». ففي البيت 3 ستور التراب بينها وبين صخر، وهنا ستور بينها وبين النجم. ومن هنا ذهب المحقق إلى أن النجم صخر وأن الأستار صفائح قبره [@diwan-khansa، ص388]، وهو تأويل لا يذكره الشرح."
  connection: "ثم تعود إلى صفاته: العفة، فلم تره جارة يمشي بساحتها لريبة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "فَبِتْتُ سَا / هِرَتَنْ / لِنْنَجْمِ أَرْ / قُبُهُو = متفعلن / فعِلن / مستفعلن / فعِلن — حَتْتَى أَتَى / دُونَ غَوْ / رِنْ نَجْمِ أَسْ / تَارُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» بعدها فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يختم مقطع «النعي والسهر». ولا شرح له في الشرح المنسوب إلى ثَعْلَب، ويذكر المحقق أن في نسخة من رواية ابن السِّكِّيت «حتى أرى دون...» [@diwan-khansa، ص388]."
