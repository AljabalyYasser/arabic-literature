first: "حُلْوٌ حَلَاوَتُهُ فَصْلٌ مَقَالَتُهُ"
second: "فَاشٍ جُمَالَتُهُ لِلْعَظْمِ جَبَّارُ"
meaning: "حلو المعشر في حلاوته، قوله فصلٌ يقطع الخلاف، إبله كثيرة منتشرة في المرعى، يجبر العظم المكسور، أي يُصلح حال من انكسر من الفقراء والمنكوبين."
vocabulary:
  - term: "فَصْلٌ مَقَالَتُهُ"
    text: "قوله حاسم صادق. «وقول فصل: حق ليس بباطل» [@lisan، ج11 ص521]."
  - term: "فَاشٍ"
    text: "منتشر كثير."
  - term: "جُمَالَتُهُ"
    text: "إبله. في اللسان: «وقيل الجَمالة الطائفة من الجمال ... وكذلك الجَمالة والجُمالة» [@lisan، ج11 ص125]."
  - term: "لِلْعَظْمِ جَبَّارُ"
    text: "يجبر العظم المكسور. «والجَبْر: خلاف الكسر، جبر العظم والفقير واليتيم يجبره جبرا» [@lisan، ج4 ص114]، فاللفظ يُستعمل في العظم وفي الفقير معًا."
syntax:
  - "«حُلْوٌ» خبر لمبتدأ محذوف، و«حَلَاوَتُهُ» فاعل لـ«حُلْوٌ» لأن الصفة المشبهة تعمل عمل فعلها، أي حلت حلاوتُه."
  - "وكذلك «فَصْلٌ مَقَالَتُهُ»: «مَقَالَتُهُ» مرفوع بـ«فَصْلٌ» وهو مصدر وُصف به، و«فَاشٍ جُمَالَتُهُ»: «جُمَالَتُهُ» فاعل اسم الفاعل «فَاشٍ»."
  - "«جَبَّارُ» خبر آخر، و«لِلْعَظْمِ» متعلق به وقُدّم عليه."
morphology:
  - "«فَاشٍ» اسم فاعل من «فَشَا يَفْشُو»، منقوص حُذفت ياؤه مع التنوين."
  - "«حَلَاوَة» مصدر على «فَعَالة»، و«مَقَالَة» مصدر ميمي على «مَفْعَلة»، و«جَبَّار» صيغة مبالغة على «فَعّال»."
rhetoric:
  thesis: "بيت مرصَّع: ثلاثة أجزاء تنتهي بـ«ـالَتُهُ»، ثم جزء رابع يخرج عن السجع."
  devices:
    - title: "الترصيع"
      text: "سجعت أواخر الأجزاء الثلاثة الأولى: «حَلَاوَتُهُ / مَقَالَتُهُ / جُمَالَتُهُ»، وكل جزء صفة وفاعلها. وهذا ما يسمّيه قُدامة الترصيع، وتفصيله في البيت التالي."
    - title: "نقد العَسْكَرِيّ"
      text: "يورد أبو هلال العَسْكَرِيّ هذا البيت بلفظ «فاش حمالته» في أبيات يقدّمها بقوله «فمن ذلك ما روى أنه للخنساء»، ويقول فيه: «وهذا مثل ما قبله» [@sinaatayn، ص378]، أي مثل البيت 37 الذي قال فيه: «آخر هذا البيت لا يجرى مع ما قبله، وإذا قسته بأوله وجدته فاترا باردا». فالأجزاء الثلاثة المسجوعة توقظ في الأذن إيقاعًا، ثم يأتي «لِلْعَظْمِ جَبَّارُ» على غير نسقها فيخيب ما انتظرته الأذن. وهو يرى أن الترصيع إذا توالى في أبيات كثيرة «دلّ على التكلّف» [@sinaatayn، ص377]."
    - title: "جناس الاشتقاق"
      text: "في «حُلْوٌ حَلَاوَتُهُ» جاءت الصفة وفاعلها من أصل واحد، وهذا يسمّى جناس الاشتقاق. وفيه تأكيد للصفة، ولكنه لا يزيد معنى، وربما كان مما حمل العَسْكَرِيّ على نقد البيت."
    - title: "الكناية"
      text: "«لِلْعَظْمِ جَبَّارُ» يُفهم منها أنه يصلح ما انكسر من أحوال الناس، كما يجبر المجبِّر العظم. وفي اللسان أن الجبر يكون للعظم والفقير واليتيم [@lisan، ج4 ص114]."
  connection: "ثم يأتي أتمّ الأبيات ترصيعًا: حمّال ألوية، هبّاط أودية، شهّاد أندية."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "حُلْوُنْ حَلَا / وَتُهُو / فَصْلُنْ مَقَا / لَتُهُو = مستفعلن / فعِلن / مستفعلن / فعِلن — فَاشِنْ جُمَا / لَتُهُو / لِلْعَظْمِ جَبْ / بَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الشطرين فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. وكل جزء مسجوع يملأ تفعيلتين تمامًا: «حُلْوٌ حَلَاوَتُهُ» = مستفعلن فعِلن."
context: "من الأبيات الأربعة التي ينقدها العَسْكَرِيّ مع البيتين 36 و37 وبيت ليس في رواية ثَعْلَب [@sinaatayn، ص378]. ولا شرح له في الشرح المنسوب إلى ثَعْلَب."
