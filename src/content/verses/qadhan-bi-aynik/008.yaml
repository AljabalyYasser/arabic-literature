first: "صُلْبُ النَّحِيزَةِ وَهَّابٌ إِذَا مَنَعُوا"
second: "وَفِي الْحُرُوبِ جَرِيءُ الصَّدْرِ مِهْصَارُ"
meaning: "صلب الطبع، كثير العطاء حين يمسك الناس عن العطاء، وفي الحروب جريء القلب يكسر أقرانه كما يكسر الأسد فريسته."
vocabulary:
  - term: "النَّحِيزَةِ"
    text: "الطبيعة. «والنَّحِيزَةُ: الطبيعة» [@lisan، ج5 ص415]. وأصلها، كما يقول المحقق، «طريقة من الرمل سوداء ممتدة» [@diwan-khansa، ص380]."
  - term: "وَهَّابٌ"
    text: "كثير الهبة والعطاء."
  - term: "جَرِيءُ الصَّدْرِ"
    text: "شجاع القلب. وبهذا اللفظ فسّر المُبَرِّد «السبنتى» في البيت 10: «وهو الجريء الصدر، وأصله في النمر» [@kamil، ج4 ص41]."
  - term: "مِهْصَارُ"
    text: "شديد الكسر لمن يلقاه. في اللسان: «الهَصْرُ: الكسر»، و«أسد هُصُور وهَصّار وهَيْصَر وهَيْصار ومِهْصار»، وكلها بمعنى أنه «يكسر ويميل» [@lisan، ج5 ص264]."
syntax:
  - "«صُلْبُ النَّحِيزَةِ» خبر لمبتدأ محذوف، أي هو صلب النحيزة، و«وَهَّابٌ» خبر ثان."
  - "«إِذَا مَنَعُوا» ظرف فيه معنى الشرط، وجوابه محذوف دلّ عليه «وَهَّابٌ»، والواو في «مَنَعُوا» للناس عامة."
  - "«وَفِي الْحُرُوبِ» متعلق بـ«جَرِيءُ»، و«جَرِيءُ الصَّدْرِ» و«مِهْصَارُ» خبران آخران للمبتدأ المحذوف."
morphology:
  - "«مِهْصَار» على «مِفْعال»، صيغة مبالغة، وهي من أوصاف الأسد في اللسان [@lisan، ج5 ص264]."
  - "«النَّحِيزَة» على «فَعِيلة»، و«جَرِيء» على «فَعِيل» من «جَرُؤَ»، و«وَهَّاب» على «فَعّال»."
rhetoric:
  thesis: "صفتان تجمعان السيد: الكرم في السلم، والبأس في الحرب، كل واحدة في شطر."
  devices:
    - title: "المقابلة"
      text: "قابلت بين «وَهَّابٌ» و«مَنَعُوا»: يعطي حين يمنع الناس، فكرمه يظهر في وقت الشدة. وقسمت البيت قسمين: الصدر لأخلاقه في قومه، والعجز لصفته «فِي الْحُرُوبِ»."
    - title: "الاستعارة"
      text: "«مِهْصَارُ» صفة يوصف بها الأسد، فوصفته بها ولم تذكر الأسد، فكأنه أسد يكسر أقرانه. وهي تمهيد للنمر في البيت 10."
    - title: "الكناية"
      text: "«جَرِيءُ الصَّدْرِ» كناية عن الشجاعة، لأن الصدر موضع القلب."
  connection: "ثم تنادي صخرًا باسمه: هو الذي يرد الماء الذي يخافه الناس."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "صُلْبُنْ نَحِي / زَةِ وَهْ / هَابُنْ إِذَا / مَنَعُو = مستفعلن / فعِلن / مستفعلن / فعِلن — وَفِلْ حُرُو / بِ جَرِي / ءُصْ صَدْرِ مِهْ / صَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الصدر فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن»، و«فاعلن» بعدها فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يكمل صفة السيد المفقود في البيت 7، ويختم مقطع «الموت سنّة». ولا شرح له في الشرح المنسوب إلى ثَعْلَب."
