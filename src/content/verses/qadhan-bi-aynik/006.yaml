first: "لَا بُدَّ مِنْ مِيتَةٍ فِي صَرْفِهَا غِيَرٌ"
second: "وَالدَّهْرُ فِي صَرْفِهِ حَوْلٌ وَأَطْوَارُ"
meaning: "لا مفرّ من الموت، وفي تقلّبه تغيّرُ أحوال الناس؛ والدهر في تقلّبه ينقل أهله من حال إلى حال. وفي الشرح: «حَوْل؛ أي يحول؛ أي يتقلب بأهله. وأطوار؛ أي طورا كذا وطورا كذا» [@diwan-khansa، ص380]."
vocabulary:
  - term: "مِيتَةٍ"
    text: "الموت، والمراد هيئته وطريقته: كل ميتة أيًّا كانت."
  - term: "صَرْفِهَا"
    text: "تقلّبها وتصرّفها. ويقول المحقق: «صرفها: تصرفها» [@diwan-khansa، ص380]."
  - term: "غِيَرٌ"
    text: "تغيّر الأحوال. «الغِيَرُ: من تغيّر الحال، وهو اسم بمنزلة القِطَع والعنب» [@lisan، ج5 ص40]."
  - term: "حَوْلٌ وَأَطْوَارُ"
    text: "تحوّل وتنقّل من طور إلى طور. وفي الأغاني: «حول وأطوار، أي تحول وتقلب وتصرف» [@aghani-dk، ج15 ص82]."
syntax:
  - "«لا» نافية للجنس، و«بُدَّ» اسمها مبني على الفتح، و«مِنْ مِيتَةٍ» متعلق بخبرها المحذوف، والتقدير: لا بدّ من ميتة كائن."
  - "«فِي صَرْفِهَا غِيَرٌ» جملة في موضع الصفة لـ«مِيتَةٍ»: «غِيَرٌ» مبتدأ مؤخر، و«فِي صَرْفِهَا» خبر مقدم."
  - "«وَالدَّهْرُ فِي صَرْفِهِ حَوْلٌ» «الدَّهْرُ» مبتدأ، و«حَوْلٌ» مبتدأ ثان مؤخر خبره «فِي صَرْفِهِ»، والجملة خبر «الدَّهْرُ»."
morphology:
  - "«مِيتَة» على «فِعْلة» بكسر الفاء، وهي صيغة الهيئة، والفرق بينها وبين «مَيْتة» بالفتح أن تلك للمرة."
  - "«أَطْوَار» جمع «طَوْر» على «أَفْعال». و«حَوْل» مصدر «حال يحول» إذا تغيّر."
rhetoric:
  thesis: "تنتقل من بكائها إلى حكمة عامة: الموت ثابت، والدهر لا يثبت."
  devices:
    - title: "الموازنة بين الشطرين"
      text: "في الصدر «فِي صَرْفِهَا» للميتة، وفي العجز «فِي صَرْفِهِ» للدهر، فالشطران مبنيان على لفظ واحد، كأن الموت والدهر وجهان لشيء واحد."
    - title: "المقابلة"
      text: "قابلت بين «لَا بُدَّ»، وهو الثابت الذي لا يتخلف، وبين «غِيَرٌ» و«حَوْلٌ وَأَطْوَارُ»، وهي التبدّل الدائم. فالثابت الوحيد في الدنيا هو التغيّر الذي ينتهي بالموت."
    - title: "الحكمة"
      text: "البيت كله قول عام يصلح لكل ميت. وبه يدخل الرثاء باب العزاء: ما أصاب صخرًا يصيب كل أحد."
  connection: "ثم تنتقل من العام إلى الخاص: كان فيكم سيد يسودكم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "لَا بُدْدَ مِنْ / مِيتَتِنْ / فِي صَرْفِهَا / غِيَرُنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — وَدْدَهْرُ فِي / صَرْفِهِي / حَوْلُنْ وَأَطْ / وَارُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "جاء الحشو تامًّا في الشطرين: «مستفعلن فاعلن مستفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والخَبْن حذف الثاني الساكن [@atiq، ص46]. والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "أول مقطع «الموت سنّة» (6–8). ويرويه أبو الفرج بلفظه ثالثَ أبيات القصيدة عنده [@aghani-dk، ج15 ص80]."
