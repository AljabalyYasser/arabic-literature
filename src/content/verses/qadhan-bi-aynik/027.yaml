first: "قَدْ كَانَ خَالِصَتِي مِنْ كُلِّ ذِي نَسَبٍ"
second: "فَقَدْ أُصِيبَ فَمَا لِلْعَيْشِ أَوْطَارُ"
meaning: "كان هو الذي اخترته لنفسي من بين أهلي وأقاربي جميعًا، وقد أصيب، فلم يبق لي في العيش حاجة أطلبها. ويقول المحقق: «خالصتي: الذي اخترته لنفسي وخلص لي وده» [@diwan-khansa، ص388]."
vocabulary:
  - term: "خَالِصَتِي"
    text: "المختصّ بي دون غيري. وفي اللسان: «ويقال: هذا الشيء خالصة لك أي خالص لك خاصة» [@lisan، ج7 ص27]."
  - term: "ذِي نَسَبٍ"
    text: "صاحب قرابة."
  - term: "أَوْطَارُ"
    text: "حاجات، جمع وَطَر. «الوَطَر كل حاجة كان لصاحبها فيها همّة» [@lisan، ج5 ص285]."
syntax:
  - "«كَانَ» واسمها ضمير صخر، و«خَالِصَتِي» خبرها، و«مِنْ كُلِّ ذِي نَسَبٍ» متعلق بـ«خَالِصَتِي»: خالصتي من بينهم."
  - "«فَقَدْ أُصِيبَ» الفاء عاطفة تفيد التعقيب، و«أُصِيبَ» فعل مبني للمجهول نائب فاعله ضمير صخر."
  - "«فَمَا لِلْعَيْشِ أَوْطَارُ» الفاء للسببية، و«ما» نافية، و«أَوْطَارُ» مبتدأ مؤخر، و«لِلْعَيْشِ» خبر مقدم."
morphology:
  - "«خَالِصَة» اسم فاعل مؤنث وُصف به رجل، والتاء فيه للمبالغة كتاء «راوية» و«علّامة»."
  - "«أَوْطَار» جمع «وَطَر» على «أَفْعال»، و«أُصِيبَ» ماضٍ مبني للمجهول من «أصاب»."
rhetoric:
  thesis: "البيت الوحيد في هذا المقطع الذي تتكلم فيه عن نفسها: صخر عندها ليس سيد القوم فحسب، بل أقرب الناس إليها."
  devices:
    - title: "«خَالِصَتِي»"
      text: "اختارت لفظًا يدل على الصفاء والاختصاص، وأضافته إلى نفسها، فصار صخر شيئًا خالصًا لها من بين الأقارب كلهم. وهذا يذكّر بأن صخرًا أخوها لأبيها، ومع ذلك كان أخصّ الناس بها."
    - title: "المبالغة"
      text: "«فَمَا لِلْعَيْشِ أَوْطَارُ» نفي عام: لا حاجة في العيش كله، لا حاجة لها وحدها. فموته أفرغ الحياة من معناها."
    - title: "تكرار «قَدْ»"
      text: "«قَدْ كَانَ» في الصدر و«فَقَدْ أُصِيبَ» في العجز: الأولى تحقق ما مضى، والثانية تحقق المصيبة، والبيت معلّق بين يقينين."
  connection: "ثم تعود إلى صورته: مثل الرمح الرديني، كأنه تحت بُرده سِوار."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "قَدْ كَانَ خَا / لِصَتِي / مِنْ كُلْلِ ذِي / نَسَبِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — فَقَدْ أُصِي / بَ فَمَا / لِلْعَيْشِ أَوْ / طَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "في مقطع «العفة والقرى والنسب»، وهو وقفة شخصية بين صفات الكرم وصفات الشباب. ولا شرح له في الشرح المنسوب إلى ثَعْلَب."
