  - reading: "كَأَنَّهُ تَحْتَ طَيِّ الْبُرْدِ أُسْوَارُ"
    status: "ضبط الأغاني"
    note: "بضم الهمزة [@aghani-dk، ج15 ص81]، وهي لغة في الإسوار."
