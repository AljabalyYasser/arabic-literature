first: "مِثْلُ الرُّدَيْنِيِّ لَمْ تَنْفَدْ شَبِيبَتُهُ"
second: "كَأَنَّهُ تَحْتَ طَيِّ الْبُرْدِ إِسْوَارُ"
meaning: "هو مثل الرمح الرديني في استقامته وصلابته، لم تنقضِ شبابته بعد، وإذا لفّ بُرده عليه بدا تحته كأنه سِوار من ذهب أو فضة، دقيق الخصر لامع. وفي الشرح: «ثم أخبرت أنه لطيف كأنه إسوار؛ أي قليل اللحم كأنه إسوار من ذهب أو فضة في حسنه وضمره» [@diwan-khansa، ص389]."
vocabulary:
  - term: "الرُّدَيْنِيِّ"
    text: "الرمح. في الشرح: «الرديني: الرمح منسوب إلى ردينة؛ امرأة كانت تقوم الرماح» [@diwan-khansa، ص389]. وفي اللسان: «وردينة: اسم امرأة، والرماح الردينية منسوبة إليها» [@lisan، ج13 ص178]."
  - term: "شَبِيبَتُهُ"
    text: "شبابه. «والاسم الشبيبة، وهو خلاف الشيب» [@lisan، ج1 ص480]. وفي الشرح: «وقالوا: شبيبته: أول شبابه» [@diwan-khansa، ص389]."
  - term: "الْبُرْدِ"
    text: "ثوب مخطط يُلتحف به."
  - term: "إِسْوَارُ"
    text: "السوار. في اللسان أن «الإسوار لغة في السوار»، فيما نقله ابن بري عن أبي عمرو بن العلاء [@lisan، ج4 ص387]. وفي الشرح: «أي كأنه إسوار من لطافة بطنه وهيفه» [@diwan-khansa، ص389]، والهَيَف ضمور البطن."
syntax:
  - "«مِثْلُ» خبر لمبتدأ محذوف، أي هو مثل الرديني. وجملة «لَمْ تَنْفَدْ شَبِيبَتُهُ» حال من الضمير المحذوف، أو صفة."
  - "«كَأَنَّهُ ... إِسْوَارُ» «كأنّ» واسمها وخبرها، و«تَحْتَ طَيِّ الْبُرْدِ» ظرف متعلق بمعنى التشبيه."
morphology:
  - "«الرُّدَيْنِيّ» اسم منسوب إلى «رُدَيْنة» بياء النسب المشددة."
  - "«شَبِيبَة» على «فَعِيلة»، و«طَيّ» مصدر «طَوَى يطوي»، أصله «طَوْي» أُدغمت الواو في الياء."
rhetoric:
  thesis: "صورة الجسد بعد صور الأخلاق: فتى طويل مستقيم ضامر، في شباب لم ينقضِ."
  devices:
    - title: "التشبيه"
      text: "في البيت تشبيهان: «مِثْلُ الرُّدَيْنِيِّ» للقامة والاستقامة والصلابة، و«كَأَنَّهُ ... إِسْوَارُ» للضمور واللمعان. والشرح يفسّر الثاني على الضمور «من لطافة بطنه وهيفه»، ويضيف «يقول: كأنه حين اتّزر ببرده فطواه عليه محتبكا؛ لأن المؤتزر يطوي حواشي إزاره بحقوه» [@diwan-khansa، ص389]، والحِقو الخصر."
    - title: "«لَمْ تَنْفَدْ شَبِيبَتُهُ»"
      text: "تذكّر بأنه مات شابًّا، فالرمح لم يبلَ والسوار لم يصدأ. ورثاء من مات في شبابه أشد وقعًا."
  connection: "ثم تصف وجهه: جهم على أعدائه، تضيء صورته الليل، وآباؤه طوال أحرار."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "مِثْلُرْ رُدَيْ / نِيْيِ لَمْ / تَنْفَدْ شَبِي / بَتُهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — كَأَنْنَهُو / تَحْتَ طَيْ / يِلْ بُرْدِ إِسْ / وَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يرويه أبو الفَرَج [@aghani-dk، ج15 ص81] وابن قُتَيْبة [@ibn-qutayba، ج1 ص335]. وفي الأغاني من تفسيره: «أي هو معصوب البدن ليس بمهبّج منحلّ» [@aghani-dk، ج15 ص82]، أي مشدود البدن غير منتفخ ولا مسترخٍ."
