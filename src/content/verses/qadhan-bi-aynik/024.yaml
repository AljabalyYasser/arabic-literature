first: "لَمْ تَرَهُ جَارَةٌ يَمْشِي بِسَاحَتِهَا"
second: "لِرِيبَةٍ حِينَ يُخْلِي بَيْتَهُ الْجَارُ"
meaning: "لم تره امرأة من جيرانه يمشي في فناء بيتها لأمر مريب حين يغيب زوجها ويترك البيت خاليًا. فهو عفيف لا يطمع في حرمة جاره."
vocabulary:
  - term: "جَارَةٌ"
    text: "امرأة من الجيران."
  - term: "بِسَاحَتِهَا"
    text: "بفناء دارها. «السّاحة: الناحية، وهي أيضاً فضاء يكون بين دور الحي» [@lisan، ج2 ص492]."
  - term: "لِرِيبَةٍ"
    text: "لأمر يُتّهم به. «والرَّيْب والرِّيبة: الشك، والظِّنّة، والتهمة» [@lisan، ج1 ص442]."
  - term: "يُخْلِي بَيْتَهُ الْجَارُ"
    text: "يغيب الجار، أي زوج الجارة، فيترك بيته خاليًا."
syntax:
  - "«لَمْ تَرَهُ» فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف الألف، والهاء مفعول به، و«جَارَةٌ» فاعل."
  - "جملة «يَمْشِي بِسَاحَتِهَا» حال من الهاء في «تَرَهُ»، و«لِرِيبَةٍ» متعلق بـ«يَمْشِي»."
  - "«حِينَ» ظرف مضاف إلى جملة «يُخْلِي بَيْتَهُ الْجَارُ»، و«الْجَارُ» فاعل «يُخْلِي»، و«بَيْتَهُ» مفعوله."
morphology:
  - "«تَرَ» من «رأى»، والأصل في مضارعه «يَرْأَى»، لكن العرب التزمت حذف همزته في الكلام: «يرى». وفي الأغاني «لم ترأه» على الأصل [@aghani-dk، ج15 ص81]."
  - "«رِيبَة» على «فِعْلة»، و«يُخْلِي» مضارع «أَخْلَى» على «أَفْعَلَ»."
rhetoric:
  thesis: "تنتقل من صفات الحرب والسيادة إلى صفة أخلاقية في الحي: عفته مع جاراته."
  devices:
    - title: "الكناية"
      text: "لم تقل إنه عفيف، بل نفت عنه ما يفعله غير العفيف: أن يمشي في ساحة جارته حين يغيب زوجها. وهذه هي الكناية كما يحدّها عبد القاهر الجُرْجانيّ: أن يُترك اللفظ الموضوع للمعنى ويُذكر ما هو «تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "«جَارَةٌ» و«الْجَارُ»"
      text: "افتتحت البيت بالجارة وختمته بالجار، فالحرمة محفوظة بين طرفي البيت. والكلمتان من أصل واحد، وفي ذلك جناس اشتقاق."
    - title: "دقة القيد"
      text: "قيّدت بـ«لِرِيبَةٍ» و«حِينَ يُخْلِي بَيْتَهُ الْجَارُ»، فالمنفي ليس المرور بساحة الجيران، وهو مما لا بد منه، بل المرور في الغيبة ولأمر مريب."
  connection: "ثم تذكر كرمه: لا يأكل خفية في بيته، بل يبرز بالصحن للناس."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "لَمْ تَرَهُو / جَارَتُنْ / يَمْشِي بِسَا / حَتِهَا = مستعلن / فاعلن / مستفعلن / فعِلن — لِرِيبَتِنْ / حِينَ يُخْ / لِي بَيْتَهُلْ / جَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الطَّيُّ، وهو حذف الرابع الساكن [@atiq، ص47]، «مستفعلن» الأولى من الصدر فصارت «مستعلن». ودخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. وعلى رواية الأغاني «لَمْ تَرْأَهُ» تأتي التفعيلة تامة: «لَمْ تَرْ / أَهُو» = مستفعلن."
context: "أول مقطع «العفة والقرى والنسب» (24–31). ويختم به المُبَرِّد ما اختاره من القصيدة [@kamil، ج4 ص40]، ويرويه ابن قُتَيْبة [@ibn-qutayba، ج1 ص335]. وفي الأغاني هو أول ستة أبيات أخرى بعد البيت 17، وقبلها: «غنّى في هذين البيتين الأولين ابن سريج، من رواية يونس» [@aghani-dk، ج15 ص81]، أي أن هذا البيت والذي بعده غُنّيا."
