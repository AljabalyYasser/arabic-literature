first: "وَإِنَّ صَخْرًا لَتَأْتَمُّ الْهُدَاةُ بِهِ"
second: "كَأَنَّهُ عَلَمٌ فِي رَأْسِهِ نَارُ"
meaning: "وإن صخرًا ليقتدي به الأدلاء الذين يهدون الناس، كأنه جبل مشهور على رأسه نار تُرى من بعيد. قال البَغْداديّ: «أي تجعله الأدلاء إماما والعلم الجبل ... وفي رأسه نار أشد للدلالة والهداية وأشهر في الشرف» [@khizana، ج1 ص433]. وفي الشرح: «أخبرت أنه دليل الأدلاء، وقائد الرؤساء» [@diwan-khansa، ص387]."
vocabulary:
  - term: "تَأْتَمُّ"
    text: "تقتدي وتتخذه إمامًا. في اللسان: «والإمام: كل من ائتم به قوم» [@lisan، ج12 ص24]."
  - term: "الْهُدَاةُ"
    text: "الأدلاء. في الشرح: «وقال غيره: الهداة؛ الأدلاء، وقالوا: الذي يهتدى بهم في الأمور والشرف» [@diwan-khansa، ص387]."
  - term: "عَلَمٌ"
    text: "جبل. في الشرح: «والعلم: الجبل، أي أنه مشهور» [@diwan-khansa، ص386]. وفي اللسان: «والعَلَم: الجبل الطويل»، «وقال اللحياني: العلم الجبل فلم يخص الطويل» [@lisan، ج12 ص420]. واستشهد له المُبَرِّد بقوله تعالى: ﴿وَلَهُ الْجَوَارِ الْمُنْشَآتُ فِي الْبَحْرِ كَالْأَعْلَامِ﴾ [@kamil، ج4 ص41]."
syntax:
  - "«لَتَأْتَمُّ» اللام المزحلقة في خبر «إنّ»، والخبر هنا جملة فعلية: «تَأْتَمُّ» فعل، و«الْهُدَاةُ» فاعله، و«بِهِ» متعلق به."
  - "«كَأَنَّهُ عَلَمٌ» «كأنّ» واسمها الضمير وخبرها «عَلَمٌ»، والجملة حال من صخر أو مستأنفة."
  - "«فِي رَأْسِهِ نَارُ» جملة في موضع الصفة لـ«عَلَمٌ»: «نَارُ» مبتدأ مؤخر، و«فِي رَأْسِهِ» خبر مقدم."
morphology:
  - "«تَأْتَمّ» على «تَفْتَعِل» من «أَمَّ» إذا قصد وتقدّم، ومنه الإمام."
  - "«الْهُدَاة» جمع «هادٍ» على «فُعَلة» مثل «قاضٍ وقُضاة»، وأصلها «هُدَيَة» قُلبت الياء ألفًا لتحركها وانفتاح ما قبلها. و«عَلَم» يُجمع على «أعلام» [@aghani-dk، ج15 ص82]."
rhetoric:
  thesis: "أشهر بيت للخَنْساء وأعلى ما في مقطع التنويه: صخر ليس سيدًا فحسب، بل هو العلامة التي يهتدي بها الهادون أنفسهم."
  devices:
    - title: "الإيغال"
      text: "تمّ المعنى عند «كَأَنَّهُ عَلَمٌ»، ثم زادت في القافية «فِي رَأْسِهِ نَارُ» فأفادت معنى جديدًا. وهذا هو الإيغال، يقول فيه ابن رَشِيق: «وهو ضرب من المبالغة ... إلا أنه في القوافي خاصة لا يعدوها، والحاتمي وأصحابه يسمونه التبليغ، وهو تفعيل من بلوغ الغاية» [@ibn-rashiq، ج2 ص57]، أي أن الشاعر يبلغ بالمعنى غايته في آخر البيت. وينقل عن الأصمعي أن أشعر الناس من «ينقضي كلامه قبل القافية، فإذا احتاج إليها أفاد بها معنى» [@ibn-rashiq، ج2 ص57]. ثم يقول في هذا البيت: «ومن الإيغال الحسن قول الخنساء ... فبالغت في الوصف أشد مبالغة، وأوغلت إيغالاً شديداً بقولها في رأسه نار بعد أن جعلته علماً، وهو الجبل العظيم» [@ibn-rashiq، ج2 ص58]. ويعرّفه البَغْداديّ بأنه «ختم البيت بما يفيد نكته يتم المعنى بدونها»، ويشرحه هنا: «فإن قولها كأنه علم يتم المعنى به ... ثم لما أرادت المبالغة لم تقنع بذلك وأردفته بقولها في رأسه نار فجعلته بعد أن كان علما يشار إليه معلما بعلامة يعرفه كل من يراه» [@khizana، ج1 ص433]. فالجبل يُرى نهارًا، والجبل الذي على رأسه نار يُرى ليلًا ونهارًا."
    - title: "التتميم عند العَسْكَرِيّ"
      text: "يسمّي أبو هلال العَسْكَرِيّ هذا تتميمًا، والتتميم عنده «أن توفى المعنى حظه من الجودة، وتعطيه نصيبه من الصحة؛ ثم لا تغادر معنى يكون فيه تمامه إلا تورده» [@sinaatayn، ص389]. ويقول في البيت: «فقولها: في رأسه نار تتميم عجيب؛ قالوا: لم يستوف أحد هذا المعنى استيفاءها» [@sinaatayn، ص391]."
    - title: "التشبيه وصلته ببيت الأعشى"
      text: "في «كَأَنَّهُ عَلَمٌ فِي رَأْسِهِ نَارُ» صورة مركّبة من جبل ونار، ووجه الشبه الظهور والهداية معًا. ويرى العَسْكَرِيّ أنه «مأخوذ من قول الأعشى»: «وتدفن منه الصالحات وإن يسىء ... يكن ما أساء النار فى رأس كبكبا»، «إلا أنها أخرجته في معرض أحسن من معرض الأعشى، فشهر واستفاض، وخمل معها بيت الأعشى ورذل» [@sinaatayn، ص391]. والشرح المنسوب إلى ثَعْلَب يورد عجز بيت الأعشى في تفسير هذا البيت نفسه: «وكبكب: جبل مطل على عرفات، أي تكون إساءته مشهورة» [@diwan-khansa، ص386–387]. فالصورة واحدة، والأعشى جعلها لشهرة الإساءة، والخَنْساء لشهرة الهداية والشرف. وأما ابن قُتَيْبة فيعدّه «مما سبقت إليه» [@ibn-qutayba، ج1 ص335]."
    - title: "النار"
      text: "النار على الجبل علامة يوقدها العرب ليهتدي بها السائر ليلًا ويقصدها الضيف، فالكلمة تجمع الهداية والكرم معًا، وتصل هذا البيت بصفة القِرى في البيتين 15 و16."
  connection: "ثم تعدّد صفاته في أبيات مقطّعة الأجزاء: جلد جميل كامل ورع."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "وَإِنْنَ صَخْ / رَنْ لَتَأْ / تَمْمُلْ هُدَا / ةُ بِهِي = متفعلن / فاعلن / مستفعلن / فعِلن — كَأَنْنَهُو / عَلَمُنْ / فِي رَأْسِهِي / نَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الشطرين فصارت «متفعلن»، و«فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. ويستقيم الوزن على رواية ثَعْلَب أيضًا: «أَغَرْ / رُ أَبْ / لَجُ تَأْ» = متفعلن / فعِلن."
context: "خاتمة مقطع «وإنّ صخرًا» (15–17)، وثالث القراءات المعتمدة. به سمّى ابن سَلّام القصيدة: «فقالت في صخر كلمتها التي تقول فيها: وإن صخرا لتأتم الهداة به» [@ibn-sallam، ج1 ص210]. وهو البيت الذي أنشدته للنابغة في قبته بعُكاظ، فقال: «والله لولا أن أبا بصير أنشدني آنفًا لقلت إنك أشعر الجن والإنس» [@aghani-dk، ج11 ص6]، وأبو بصير هو الأعشى. والخبر من الأخبار الأدبية التي تُروى حول الشعر، وتفصيله في المرحلة الأولى من مسار الخَنْساء."
variants:
  - reading: "أَغَرُّ أَبْلَجُ تَأْتَمُّ الْهُدَاةُ بِهِ"
    status: "نص ثَعْلَب"
    note: "هذا لفظ المتن، وفي الشرح: «ويروى: وإنّ صخرًا لتأتمّ الهداة به» [@diwan-khansa، ص387]، ويذكر المحقق أنها رواية ابن السِّكِّيت [@diwan-khansa، ص387]. وعدلنا إليها لأنها رواية ابن سَلّام والمُبَرِّد وأبي الفَرَج وابن رَشِيق والعَسْكَرِيّ والبَغْداديّ. وفي تفسير نص ثَعْلَب: «الأبلج؛ البعيد ما بين الحاجبين، الذي ليس بأقرن. وهذا مما يمدح الرجل به. والأغرّ: المشهور» [@diwan-khansa، ص386]."
  - reading: "أَشَمُّ أَبْلَجُ تَأْتَمُّ الْهُدَاةُ بِهِ"
    status: "رواية ابن قُتَيْبة"
    note: "[@ibn-qutayba، ج1 ص335]. الأشمّ: المرتفع الأنف، كناية عن العزة."
