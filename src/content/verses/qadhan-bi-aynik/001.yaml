first: "قَذًى بِعَيْنِكِ أَمْ بِالْعَيْنِ عُوَّارُ"
second: "أَمْ ذَرَّفَتْ أَمْ خَلَتْ مِنْ أَهْلِهَا الدَّارُ"
meaning: "تسأل نفسها: أوقع في عينكِ قذًى، أم أصابها وجع كالرمد، أم هي تسيل بالدمع، أم خلت الدار من أهلها فأنتِ تبكينها؟ وفي الشرح المنسوب إلى ثَعْلَب عن غير صاحبه: «المعنى؛ أي شيء هاج حزنك: عوار بعينيك أم سالت الدموع لخلاء هذه الدار؟» [@diwan-khansa، ص379]. والجواب لا يأتي، لأنها تعرفه: الذي بعينها هو صخر."
vocabulary:
  - term: "قَذًى"
    text: "ما يسقط في العين فيؤذيها. في الشرح: «يقال: قذيت العين تقذى قذى؛ إذا سقط فيها القذى» [@diwan-khansa، ص378–379]. وفي لسان العرب: «القَذى: ما يقع في العين وما ترمي به» [@lisan، ج15 ص172]."
  - term: "عُوَّارُ"
    text: "وجع العين. في الشرح: «العائر والعُوّار: وجع العين كالقذى من الرمد. وقال ابن الأعرابي: العائر: ما عار في العين من الرمد» [@diwan-khansa، ص378]. وفي اللسان عن الليث: «العائرُ غَمَصة تمَضُّ العين كأنما وقع فيها قذًى، وهو العُوّار» [@lisan، ج4 ص615]؛ والغَمَصة: ما يجتمع في مؤق العين."
  - term: "ذَرَّفَتْ"
    text: "سالت بالدمع. في الشرح: «أي مطرت مطراً متتابعاً لا يبلغ أن يكون سيلاً» [@diwan-khansa، ص378]."
  - term: "خَلَتْ مِنْ أَهْلِهَا الدَّارُ"
    text: "رحل عنها أهلها فصارت خالية، وهو موضوع بكاء الأطلال في مطالع القصائد."
syntax:
  - "«قَذًى» مبتدأ، و«بِعَيْنِكِ» خبره، وقبله همزة استفهام محذوفة. قال الشارح: «أراد: أقذى بعينك» [@diwan-khansa، ص378]. ودلّت عليها «أَمْ» بعدها، لأن «أم» المتصلة تعادل همزة الاستفهام."
  - "«عُوَّارُ» مبتدأ مؤخر، و«بِالْعَيْنِ» خبر مقدم. و«ذَرَّفَتْ» فعل فاعله ضمير يعود على العين."
  - "«أَمْ خَلَتْ مِنْ أَهْلِهَا الدَّارُ»: «الدَّارُ» فاعل «خَلَتْ»، و«مِنْ أَهْلِهَا» متعلق به. والجمل الأربع معطوفة بـ«أم»، فهي أربعة احتمالات لسؤال واحد."
morphology:
  - "«قَذًى» مصدر «قَذِيَتْ عينُه تَقْذَى قَذًى»: «وقع فيها القذى أو صار فيها» [@lisan، ج15 ص172–173]."
  - "«عُوَّار» على «فُعّال». و«العائر» اسم على «فاعل» وليس اسم فاعل: «وهو اسم لا مصدر بمنزلة النالج والناعر والباطل، وليس اسم فاعل» [@lisan، ج4 ص615]."
  - "«ذَرَّفَتْ» على «فعّلت» بالتضعيف، وهو يفيد الكثرة. ويقال: «ذَرَفَتِ العينُ الدمعَ ... وذَرَّفَتْه تَذْريفاً ... أَسالَتْه» [@lisan، ج9 ص109]."
rhetoric:
  thesis: "تفتتح الخَنْساء رثاءها بسؤال تعرف جوابه، وتجعل عينها هي الموضوع الأول. فالقصيدة تبدأ من أثر الفقد في الجسد قبل أن تذكر المفقود."
  devices:
    - title: "الاستفهام"
      text: "في «قَذًى بِعَيْنِكِ أَمْ بِالْعَيْنِ عُوَّارُ» أربعة أسئلة متتابعة لا تطلب جوابًا. فالسائلة تعرف سبب بكائها، وإنما تسأل لتعظّم ما بها: كأن دمعها أكثر من أن يكون حزنًا، فلا بد أن في العين علّة."
    - title: "مخاطبة النفس"
      text: "الكاف في «بِعَيْنِكِ» خطاب لامرأة، وهي الشاعرة نفسها. فهي تقف خارج نفسها وتسألها، كما ستسمّي نفسها بعد قليل باسمها «خُنَاسُ» في البيتين 4 و5."
    - title: "«خَلَتْ مِنْ أَهْلِهَا الدَّارُ»"
      text: "هذه جملة من معجم الأطلال الذي تبدأ به القصائد. والخَنْساء تضعها احتمالًا رابعًا ثم تتركه، فالدار التي خلت هنا هي الحي بعد صخر، لا منزل حبيبة رحلت."
    - title: "التصريع"
      text: "اتفق آخر الصدر «عُوَّارُ» وآخر العجز «الدَّارُ» في القافية. والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]، أي أن الصدر يُختم بما يُختم به العجز، وهو من علامات المطلع."
  connection: "ثم تصف الدمع نفسه: إذا خطرت ذكراه صارت عينها فيضًا يسيل على الخدين."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "قَذَنْ بِعَيْ / نِكِ أَمْ / بِلْعَيْنِ عُوْ / وَارُو = متفعلن / فعِلن / مستفعلن / فعْلن — أَمْ ذَرْرَفَتْ / أَمْ خَلَتْ / مِنْ أَهْلِهَدْ / دَارُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» بعدها فصارت «فعِلن». والضَّرْب، وهو آخر تفعيلة في العَجُز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. وجاءت العَرُوض، وهي آخر تفعيلة في الصدر، مقطوعة مثله لأن البيت مصرّع. وعلى رواية «أَقَذًى بِعَيْنِكِ» تزيد الهمزة على الوزن، ولذلك جعلها ابن رَشِيق من الخَزْم، وهو حرف يُزاد في أول البيت «إذا سقط لم يفسد المعنى، ولا أخل به ولا بالوزن» [@ibn-rashiq، ج1 ص141–142]."
context: "مطلع القصيدة. وبه سمّاها السُّلَمِيّ حين ردّ على أبي عُبَيْدة رثاءً رواه لها في صخر: «ليست هذه في صخر، هذه إنما رثت بها معاوية أخاها، وبنو مرة قتلته. ولكنها قالت في صخر»، ثم أنشد: «قذى بعينك أم بالعين عوّار» [@aghani-dk، ج15 ص80]. وهو أول القراءات الثلاث التي عدلنا فيها عن لفظ ثَعْلَب إلى رواية يذكرها شرحه."
variants:
  - reading: "مَا هَاجَ حُزْنَكِ أَمْ بِالْعَيْنِ عُوَّارُ"
    status: "نص ثَعْلَب"
    note: "هذا صدر البيت في متن النشرة، وبعده في الشرح: «ويروى: قذى بعينك أم بالعين عوار» [@diwan-khansa، ص378]. وعدلنا إلى هذه لأنها رواية الأغاني [@aghani-dk، ج15 ص80]، ولأن المحقق يذكر أنها في نسخ رواية ابن السِّكِّيت [@diwan-khansa، ص378]."
  - reading: "أَمْ أَقْفَرَتْ إِذْ خَلَتْ مِنْ أَهْلِهَا الدَّارُ"
    status: "رواية الأغاني والعقد"
    note: "[@aghani-dk، ج15 ص80]؛ [@iqd، ج3 ص224]. أقفرت: خلت من الناس."
  - reading: "أَقَذًى بِعَيْنِكِ أَمْ بِالْعَيْنِ عُوَّارُ"
    status: "رواية العقد والعمدة"
    note: "[@iqd، ج3 ص224]؛ [@ibn-rashiq، ج1 ص142]. وعند ابن رَشِيق في العجز «أم أوحشت إذ خلت من أهلها الدار»."
