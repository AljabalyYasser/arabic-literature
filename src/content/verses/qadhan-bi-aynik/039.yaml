first: "لَا يَمْنَعُ الْقَوْمَ إِنْ سَالُوهُ خُلْعَتَهُ"
second: "وَلَا يُجَاوِزُهُ بِاللَّيْلِ مَرَّارُ"
meaning: "لا يمنع الناس إذا سألوه أنفس ماله، ولا يمرّ به سارٍ في الليل إلا نزل عنده فأكرمه. ويقول المحقق: «خُلعته: ثوبه، وخِلْعته: خيار ماله، لا يجاوزه بالليل مرار: أي لا يمر به ضيف إلا أكرمه وأنعم عليه» [@diwan-khansa، ص392]."
vocabulary:
  - term: "خُلْعَتَهُ"
    text: "خيار ماله. «والخُلعة: خيار المال»، «وخُلعة المال وخِلعته: خياره. قال أبو سعيد: وسمي خيار المال خلعة وخلعة لأنه يخلع قلب الناظر إليه» [@lisan، ج8 ص79]. وتطلق «الخِلعة» أيضًا على الثوب يخلعه الرجل على غيره [@lisan، ج8 ص76]."
  - term: "مَرَّارُ"
    text: "كثير المرور، والمراد السائر في الليل."
syntax:
  - "«يَمْنَعُ» يتعدى إلى مفعولين: «الْقَوْمَ» الأول، و«خُلْعَتَهُ» الثاني، وفصل بينهما الشرط «إِنْ سَالُوهُ»، وجوابه محذوف دلّ عليه ما قبله."
  - "«وَلَا يُجَاوِزُهُ بِاللَّيْلِ مَرَّارُ» «مَرَّارُ» فاعل، والهاء مفعول به، و«بِاللَّيْلِ» متعلق بالفعل."
morphology:
  - "«سَالُوهُ» من «سَأَلَ» بتخفيف الهمزة ألفًا، وهي في النشرة «سَأَلُوهُ» بالهمز."
  - "«خُلْعَة» على «فُعْلة»، و«مَرَّار» على «فَعّال» للمبالغة من «مَرَّ»."
rhetoric:
  thesis: "تختم القصيدة بالكرم في صورتين: العطاء لمن سأل، والقِرى لمن مرّ ليلًا."
  devices:
    - title: "الكناية"
      text: "«وَلَا يُجَاوِزُهُ بِاللَّيْلِ مَرَّارُ» كناية عن الضيافة: لا يستطيع السائر ليلًا أن يتجاوز بيته، لأنه يدعوه ويقريه. والليل يربط البيت بالنار على رأس العَلَم في البيت 17، فالسائر يهتدي إلى ناره ثم لا يتجاوزه."
    - title: "النفي المزدوج"
      text: "بنت البيت على نفيين: «لَا يَمْنَعُ» و«لَا يُجَاوِزُهُ». فالكرم يُثبت بنفي ضده: لا منع ولا تجاوز."
    - title: "الخاتمة"
      text: "لا تعود القصيدة في آخرها إلى البكاء الذي بدأت به، بل تنتهي بصخر حيًّا في صفاته: يعطي ويُقري. وهي في رواية ثَعْلَب تنتهي هنا، وتختلف الروايات في عدد أبياتها كما في مدخل القصيدة."
  connection: "آخر القصيدة في رواية ثَعْلَب."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "لَا يَمْنَعُلْ / قَوْمَ إِنْ / سَالُوهُ خُلْ / عَتَهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — وَلَا يُجَا / وِزُهُو / بِلْلَيْلِ مَرْ / رَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن»، و«فاعلن» بعدها فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. وبهمز «سَأَلُوهُ» كما في النشرة تصير التفعيلة الثالثة «سَ أَ لُو هُ» ولا تستقيم، فخُففت الهمزة: «سَالُوهُ»."
context: "آخر القصيدة. ولا شرح له في الشرح المنسوب إلى ثَعْلَب، ولم نجده عند غير ثَعْلَب من مصادرنا."
