first: "قَدْ كَانَ فِيكُمْ أَبُو عَمْرٍو يَسُودُكُمُ"
second: "نِعْمَ الْمُعَمَّمُ لِلدَّاعِينَ نَصَّارُ"
meaning: "تخاطب قومها: كان فيكم أبو عمرو سيدًا عليكم، فنِعم السيد المعمَّم كان، كثير النصرة لمن يدعوه إلى العون."
vocabulary:
  - term: "أَبُو عَمْرٍو"
    text: "كنية لم يقف عندها الشرح، ولم نجد في مصادرنا ما يعيّن صاحبها. والسياق سياق سيد فقده القوم، وبعده بيت واحد تنادي صخرًا باسمه."
  - term: "الْمُعَمَّمُ"
    text: "السيد. في لسان العرب: «والمُعَمَّم السيد الذي يقلّده القوم أمورهم ويلجأ إليه العوام» [@lisan، ج12 ص427]."
  - term: "لِلدَّاعِينَ"
    text: "لمن يدعوه مستغيثًا يطلب النصرة."
  - term: "نَصَّارُ"
    text: "كثير النصرة، من «نصَره على عدوه ينصُره ونصَره ينصُره نصْراً» [@lisan، ج5 ص210]."
syntax:
  - "«قَدْ كَانَ فِيكُمْ أَبُو عَمْرٍو» «أَبُو عَمْرٍو» اسم «كان» مرفوع بالواو لأنه من الأسماء الخمسة، و«فِيكُمْ» خبرها مقدم، وجملة «يَسُودُكُمُ» حال من «أبو عمرو»."
  - "«نِعْمَ الْمُعَمَّمُ» «نِعْمَ» فعل ماض جامد للمدح، و«الْمُعَمَّمُ» فاعله، والمخصوص بالمدح محذوف دلّ عليه السياق، والتقدير: نعم المعمّم هو."
  - "«نَصَّارُ» خبر لمبتدأ محذوف، أي هو نصّار، و«لِلدَّاعِينَ» متعلق به وقُدّم عليه."
morphology:
  - "«الْمُعَمَّم» اسم مفعول من «عَمَّم» بالتضعيف، أي أُلبس العمامة، ومنه في اللسان: «قد عَمَّمْناك أمرنا أي ألزمناك» [@lisan، ج12 ص427]."
  - "«نَصَّار» على «فَعّال» للمبالغة. و«الدَّاعِين» جمع «داعٍ» اسم فاعل من «دعا»، حُذفت لامه في المفرد المنوّن ورُدّت في الجمع ثم حُذفت لالتقاء الساكنين."
rhetoric:
  thesis: "تذكّر القوم بما فقدوا، فالمصيبة مصيبتهم لا مصيبتها وحدها."
  devices:
    - title: "الالتفات إلى القوم"
      text: "في «فِيكُمْ ... يَسُودُكُمُ» انتقلت من الحديث عن نفسها إلى خطاب قومها بضمير الجمع، فصار الرثاء شهادة يُشهد عليها السامعون."
    - title: "الكناية"
      text: "في «الْمُعَمَّمُ» جعلت العمامة علامة السيادة، فذكرت ما يلزم السيد ولم تقل السيد. وهذا ما يسمّيه عبد القاهر الجُرْجانيّ الكناية، كقولهم «طويل النجاد» يريدون طويل القامة [@dalail، ص66]."
    - title: "المدح بـ«نِعْمَ»"
      text: "«نِعْمَ» صيغة تجمع المدح كله في كلمة، ثم خصّت المدح بصفة واحدة هي النصرة: «لِلدَّاعِينَ نَصَّارُ»."
  connection: "ثم تفصّل صفاته: صلب الطبع، كريم حين يبخل الناس، جريء في الحرب."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "قَدْ كَانَ فِي / كُمْ أَبُو / عَمْرِنْ يَسُو / دُكُمُو = مستفعلن / فاعلن / مستفعلن / فعِلن — نِعْمَلْ مُعَمْ / مَمُ لِدْ / دَاعِينَ نَصْ / صَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. وحُرّكت ميم الجمع في «يَسُودُكُمُ» بالضم ومُدّت «مُو»، فتمّت بها «فعِلن»."
context: "البيتان 7–8 في سيد القوم المفقود، بين حكمة الموت في البيت 6 ونداء صخر في البيت 9. ولم يشرحهما الشرح المنسوب إلى ثَعْلَب بشيء [@diwan-khansa، ص380]."
