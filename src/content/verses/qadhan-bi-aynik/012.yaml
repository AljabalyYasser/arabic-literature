first: "تَرْتَعُ مَا رَتَعَتْ حَتَّى إِذَا ادَّكَرَتْ"
second: "فَإِنَّمَا هِيَ إِقْبَالٌ وَإِدْبَارُ"
meaning: "ترعى الناقة ما دامت غافلة عن ولدها، فإذا تذكرته لم يبق منها إلا الإقبال والإدبار، لا تقرّ في مكان. وفي الشرح: «أخبرت أنها قلقة تقبل وتدبر من شدة ما بها من العلز على ولدها» [@diwan-khansa، ص384]، والعَلَز: الرِّعدة والقلق."
vocabulary:
  - term: "تَرْتَعُ"
    text: "ترعى. في الشرح: «ترتع: ترعى، وهي رتعتها» [@diwan-khansa، ص384]. وفي اللسان: «الرَّتْعُ: الأكل والشرب رغدا في الريف» [@lisan، ج8 ص112]."
  - term: "ادَّكَرَتْ"
    text: "تذكّرت. قال البَغْداديّ: «واذكرت أي تذكرت ولدها وأصله اذتكرت» [@khizana، ج1 ص432]."
  - term: "إِقْبَالٌ وَإِدْبَارُ"
    text: "مجيء وذهاب لا يهدأ."
syntax:
  - "«تَرْتَعُ» فعل فاعله ضمير العجول. و«مَا رَتَعَتْ» «ما» مصدرية ظرفية، أي مدة رتوعها."
  - "«حَتَّى» ابتدائية، و«إِذَا ادَّكَرَتْ» شرط، وجوابه «فَإِنَّمَا هِيَ إِقْبَالٌ»، والفاء رابطة للجواب لأنه جملة اسمية."
  - "«هِيَ» مبتدأ، و«إِقْبَالٌ» خبره، وهو مصدر أُخبر به عن ذات. قال سِيبَوَيْه: «فجعلها الإقبال والإدبار، فجاز على سعة الكلام، كقولك: نهارك صائم وليلك قائم» [@sibawayh، ج1 ص337]. وذكر البَغْداديّ فيه ثلاثة توجيهات: «أحدها كونه مجازا عقليا ... والثاني أن المصدر في تأويل اسم الفاعل ... والثالث أنه على تقدير مضاف محذوف أي ذات إقبال» [@khizana، ج1 ص431]."
morphology:
  - "«ادَّكَرَتْ» على «افْتَعَلَتْ» من «ذَكَر»، أصلها «اذْتَكَرَتْ»: قُلبت تاء الافتعال دالًا بعد الذال، ثم قُلبت الذال دالًا وأُدغمت فيها."
  - "«إِقْبَال» و«إِدْبَار» مصدرا «أَقْبَلَ» و«أَدْبَرَ» على «إِفْعال»."
rhetoric:
  thesis: "أشهر أبيات القصيدة عند النحاة والبلاغيين: ناقة صارت حركة خالصة من شدة القلق."
  devices:
    - title: "المجاز الحُكْمي"
      text: "في «فَإِنَّمَا هِيَ إِقْبَالٌ وَإِدْبَارُ» جعلت الناقة نفسها إقبالًا وإدبارًا. ويضرب عبد القاهر الجُرْجانيّ هذا البيت مثلًا لما «طريق المجاز فيه الحكم»: «وذاك أنها لم ترد بالإقبال والإدبار غير معناهما، فتكون قد تجوّزت في نفس الكلمة، وإنما تجوّزت في أن جعلتها لكثرة ما تقبل وتدبر، ولغلبة ذاك عليها واتصاله منها، وإنه لم يكن لها حال غيرها، كأنها قد تجسمت من الإقبال والإدبار» [@dalail، ص300–301]. والمجاز الحُكْمي، ويسمّى العقلي، يكون في نسبة الكلام لا في معنى الكلمة: الكلمتان على معناهما، والتجوّز في جعل أحدهما هو الآخر."
    - title: "ردّ تقدير المضاف"
      text: "كان بعض النحاة يقدّرون في البيت مضافًا محذوفًا، أي «ذات إقبال وإدبار»، ومنهم المُبَرِّد إذ أجاز «أن تكون أرادت ذات إقبال وإدبار، فحذفت المضاف وأقامت المضاف إليه مقامه» [@kamil، ج1 ص228]. ويرفض عبد القاهر ذلك، لأننا إذا قدّرناه «أفسدنا الشعر على أنفسنا ... وإلى كلام عامّيّ مرذول» [@dalail، ص302]. فالمبالغة كلها في أن الناقة صارت هي الحركة."
    - title: "المقابلة"
      text: "قابلت بين حالين: «تَرْتَعُ مَا رَتَعَتْ» حال الغفلة والسكون، و«إِقْبَالٌ وَإِدْبَارُ» حال الذكرى والاضطراب. والذكرى وحدها هي التي تفصل بينهما."
  connection: "ثم تقول إنها لا تسمن أبدًا ولو رعت في أرض خصبة، فما هي إلا حنين."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "تَرْتَعُ مَا / رَتَعَتْ / حَتْتَى إِذَدْ / دَكَرَتْ = مستعلن / فعِلن / مستفعلن / فعِلن — فَإِنْنَمَا / هِيَ إِقْ / بَالُنْ وَإِدْ / بَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الطَّيُّ، وهو حذف الرابع الساكن [@atiq، ص47]، «مستفعلن» الأولى من الصدر فصارت «مستعلن». ودخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "أقدم شاهد على القصيدة كلها: يستشهد به سِيبَوَيْه [@sibawayh، ج1 ص337]، ويجعله البَغْداديّ «الشاهد السبعون» في الخزانة [@khizana، ج1 ص431]. وقال المُبَرِّد حين رواه: «وكذلك فإنما هي إقبال وإدبار، وقد شرحنا كيف مذهبه في النحو» [@kamil، ج4 ص41]."
variants:
  - reading: "تَرْتَعُ مَا غَفَلَتْ حَتَّى إِذَا ادَّكَرَتْ"
    status: "رواية الكامل والخزانة"
    note: "[@kamil، ج4 ص40]؛ وفي الخزانة: «وروى ترتع ما غفلت» [@khizana، ج1 ص432]. وعند ابن قُتَيْبة: «تَرْتَعُ مَا غَفَلَتْ حَتَّى إِذَا ذَكَرَتْ» [@ibn-qutayba، ج1 ص335]."
  - reading: "تَرْعَى إِذَا نَسِيَتْ حَتَّى إِذَا ادَّكَرَتْ"
    status: "رواية العقد"
    note: "[@iqd، ج3 ص224]."
  - reading: "فَإِنَّمَا هُوَ إِقْبَالٌ وَإِدْبَارُ"
    status: "رواية ابن الأعرابي"
    note: "في الشرح: «ويروى: فإنما هو إقبال وإدبار أي؛ فإنما فعلها إقبال وإدبار» [@diwan-khansa، ص384]. ونسبها البَغْداديّ إلى ابن الأعرابي فيما رواه الأخفش [@khizana، ج1 ص432]."
