first: "يَا صَخْرُ وَرَّادُ مَاءٍ قَدْ تَنَاذَرَهُ"
second: "أَهْلُ الْمَوَارِدِ مَا فِي وِرْدِهِ عَارُ"
meaning: "يا صخر، أنت الذي يرد الماء الذي حذّر الناسُ بعضُهم بعضًا من وروده لصعوبته وهوله، حتى لا يُعاب أحد إن عجز عنه. وفي الشرح: «أراد: ما في ترك ورده عار؛ أي ليس يعيّر أحد أن يعجز عنه من صعوبة ورده» [@diwan-khansa، ص380]. والماء عند المُبَرِّد هو الموت: «تعني الموت، أي لإقدامه على الحرب» [@kamil، ج4 ص41]."
vocabulary:
  - term: "وَرَّادُ"
    text: "كثير الورود، والورود إتيان الماء للشرب."
  - term: "تَنَاذَرَهُ"
    text: "أنذر بعضهم بعضًا منه. في الأغاني: «قد تناذره، أي أنذر بعضهم بعضا هوله وصعوبته» [@aghani-dk، ج15 ص82]. وفي اللسان: «وتَناذَر القوم: أنذر بعضهم بعضا» [@lisan، ج5 ص201]."
  - term: "أَهْلُ الْمَوَارِدِ"
    text: "الذين يردون المياه، والموارد جمع مَوْرِد، وهو موضع الماء الذي يُستقى منه."
  - term: "عَارُ"
    text: "عيب يُعيَّر به."
syntax:
  - "«يَا صَخْرُ» منادى علم مفرد مبني على الضم. و«وَرَّادُ مَاءٍ» خبر لمبتدأ محذوف، أي أنت ورّاد ماء."
  - "«قَدْ تَنَاذَرَهُ أَهْلُ الْمَوَارِدِ» جملة في موضع الصفة لـ«مَاءٍ»."
  - "«مَا فِي وِرْدِهِ عَارُ» «ما» نافية، و«عَارُ» مبتدأ مؤخر، و«فِي وِرْدِهِ» خبر مقدم. وفي الكلام مضاف محذوف، قال الشارح: «أراد: ما في ترك ورده عار» [@diwan-khansa، ص380]."
morphology:
  - "«تَنَاذَرَ» على «تَفاعَل»، وهي صيغة تدل على المشاركة: أنذر كلٌّ منهم الآخر."
  - "«وَرَّاد» على «فَعّال» للمبالغة، و«وِرْد» مصدر «وَرَد»، و«مَوَارِد» جمع «مَوْرِد» على «مَفْعِل» اسم مكان."
rhetoric:
  thesis: "أول نداء لصخر باسمه، ومعه أول صورة لشجاعته: يُقدم على ما يخافه الناس كلهم."
  devices:
    - title: "النداء"
      text: "في «يَا صَخْرُ» تخاطبه بعد أن تحدثت عنه، فيصير حاضرًا كأنه يسمع. والنداء هنا للحسرة، لا لطلب الإقبال."
    - title: "الاستعارة"
      text: "«وَرَّادُ مَاءٍ» ظاهرها ورود الماء، والمراد عند المُبَرِّد الموت والحرب: «تعني الموت، أي لإقدامه على الحرب» [@kamil، ج4 ص41]. فالماء المخوف هو موارد الهلاك التي يتحاماها الناس."
    - title: "الحذف"
      text: "في «مَا فِي وِرْدِهِ عَارُ» حُذف المضاف «ترك»، فبدا الكلام كأنه ينفي العار عن الورود، وهو ينفيه عن ترك الورود. ويشبّهه الشارح بقول المُرَقِّش: «ليس على طول الحياة ندم»، أي «ليس على فوت طول الحياة ما يندم عليه» [@diwan-khansa، ص380–381]. ويذكر المحقق أن هذا الشرح «منقول عن ابن السكيت» [@diwan-khansa، ص380]."
  connection: "ثم تصف مشيه إلى الحرب: مشي النمر بأنيابه وأظفاره."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "يَا صَخْرُ وَرْ / رَادُ مَا / ءِنْ قَدْ تَنَا / ذَرَهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — أَهْلُلْ مَوَا / رِدِ مَا / فِي وِرْدِهِي / عَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يفتتح مقطع «ورّاد الماء» (9–10). وبه يبدأ المُبَرِّد ما اختاره منها: «فمما ندر من شعر الخنساء قولها ترثي صخراً: يا صخر وراد ماء» [@kamil، ج4 ص40]."
