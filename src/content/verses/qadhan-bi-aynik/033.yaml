first: "طَلْقُ الْيَدَيْنِ بِفِعْلِ الْخَيْرِ ذُو فَجَرٍ"
second: "ضَخْمُ الدَّسِيعَةِ بِالْخَيْرَاتِ أَمَّارُ"
meaning: "مبسوط اليدين بالمعروف، يتفجر عطاؤه تفجرًا، عظيم الخُلق والقدر يحتمل ما يُحمَّل، يأمر بالخيرات. وفي الشرح: «أي هو مطلق اليدين بالخير، ذو فجرات؛ ينفجر بالمعروف» [@diwan-khansa، ص390]."
vocabulary:
  - term: "طَلْقُ الْيَدَيْنِ"
    text: "سخيّ مبسوط اليدين بالعطاء."
  - term: "ذُو فَجَرٍ"
    text: "كثير العطاء. في الشرح: «وقال غيره: يقال إنه لذو فجرات؛ إذا كان معطاء وهّابا» [@diwan-khansa، ص391]. وفي الأغاني: «ذو فجر: يتفجر بالمعروف» [@aghani-dk، ج15 ص83]."
  - term: "ضَخْمُ الدَّسِيعَةِ"
    text: "في الشرح: «أي عظيم الخلق والخطر، المحتمل لما حُمّل، والدسيع: الخلق العظيم الشريف، وأصل ذلك من دسع البعير بجرّته؛ إذا أفاض بها وقصع بها» [@diwan-khansa، ص390–391]. والجِرّة ما يجترّه البعير من جوفه. وفي الأغاني: «والدسيعة: العطاء» [@aghani-dk، ج15 ص83]."
  - term: "أَمَّارُ"
    text: "كثير الأمر."
syntax:
  - "«طَلْقُ الْيَدَيْنِ» خبر لمبتدأ محذوف، والإضافة لفظية، و«بِفِعْلِ الْخَيْرِ» متعلق بـ«طَلْقُ»."
  - "«ذُو فَجَرٍ» خبر ثان مرفوع بالواو لأنه من الأسماء الخمسة، و«ضَخْمُ الدَّسِيعَةِ» خبر ثالث، و«أَمَّارُ» خبر رابع، و«بِالْخَيْرَاتِ» متعلق به."
morphology:
  - "«طَلْق» صفة مشبهة على «فَعْل». و«فَجَر» مصدر من «فَجَرَ» الماء إذا بعثه فانبعث."
  - "«أَمَّار» على «فَعّال» للمبالغة، و«خَيْرَات» جمع «خَيْرة» جمع مؤنث سالمًا."
rhetoric:
  thesis: "بعد القبر تعود إلى الكرم، لتقول من يبكيه في البيتين التاليين."
  devices:
    - title: "الاستعارة"
      text: "في «ذُو فَجَرٍ» جعلت عطاءه ماءً ينفجر من الأرض، وهو ما يقوله الشرح: «ينفجر بالمعروف» [@diwan-khansa، ص390]. والصورة تجعل الكرم طبعًا يفيض لا تكلّفًا."
    - title: "الكناية"
      text: "«طَلْقُ الْيَدَيْنِ» كناية عن السخاء، لأن اليد المبسوطة يد معطية."
    - title: "تكرار «الخير»"
      text: "«بِفِعْلِ الْخَيْرِ» في الصدر و«بِالْخَيْرَاتِ» في العجز، وبين البيت والبيت 30 تتكرر «ضَخْمُ الدَّسِيعَةِ». فالقصيدة في هذا الموضع تعيد صفات الكرم كأنها تدور حوله."
  connection: "ثم تدعو من فقده إلى البكاء: ليبكه المقتر الذي أفنى الدهر ماله."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "طَلْقُلْ يَدَيْ / نِ بِفِعْ / لِلْ خَيْرِ ذُو / فَجَرِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — ضَخْمُدْ دَسِي / عَةِ بِلْ / خَيْرَاتِ أَمْ / مَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الشطرين فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "أول مقطع «من يبكيه» (33–35). ويرويه أبو الفَرَج بلفظه [@aghani-dk، ج15 ص81]."
variants:
  - reading: "فَخْمُ الدَّسِيعَةِ بِالْخَيْرَاتِ أَمَّارُ"
    status: "رواية يذكرها المحقق"
    note: "في حاشية نسخة دار الكتب بخط العاصمي [@diwan-khansa، ص390]. والفخم: العظيم القدر."
