first: "وَرُفْقَةٌ حَارَ هَادِيهِمْ بِمَهْلَكَةٍ"
second: "كَأَنَّ ظُلْمَتَهَا فِي الطُّخْيَةِ الْقَارُ"
meaning: "وليبكه أيضًا جماعة مسافرين تحيّر دليلهم في مفازة مهلكة، ظلمتها في ليلة الغيم كأنها القار في سوادها. وفي الشرح: «[والمعنى]: حجب النجوم الغيم فاشتدت الظلمة وتحير الهادي» [@diwan-khansa، ص391]."
vocabulary:
  - term: "رُفْقَةٌ"
    text: "جماعة يترافقون في السفر. في الشرح: «يقال: رُفقة ورِفقة، مثل رُحلة ورِحلة» [@diwan-khansa، ص391]. وفي اللسان: «والرفاقة والرُّفقة والرِّفقة واحد: الجماعة المترافقون في السفر» [@lisan، ج10 ص120]."
  - term: "هَادِيهِمْ"
    text: "دليلهم الذي يهديهم الطريق."
  - term: "مَهْلَكَةٍ"
    text: "مفازة يهلك فيها السالك. في الشرح: «ويقال: مَهلُكة ومَهلَكة» [@diwan-khansa، ص391]. وفي اللسان: «والمَهْلَكة والمَهلِكة والمَهْلُكة: المفازة لأنه يُهلك فيها كثيرا» [@lisan، ج10 ص505]."
  - term: "الطُّخْيَةِ"
    text: "الظلمة مع الغيم. في الشرح: «والطُّخية: من الطخاء وهو الغيم الرقيق الذي يواري النجوم فيتحير الهادي»، و«قال أبو عبيدة: يقال ما في السماء طخاء؛ أي ظلمة» [@diwan-khansa، ص391]. وفي اللسان: «وأصل الطخاء والطخية الظلمة والغيم» [@lisan، ج15 ص5]."
  - term: "الْقَارُ"
    text: "الزفت الأسود. «القير والقار: لغتان ... وهو شيء أسود تطلى به الإبل والسفن» [@lisan، ج5 ص124]."
syntax:
  - "«وَرُفْقَةٌ» معطوف على «مُقْتِرٌ» في البيت السابق، فهو فاعل ثان لـ«لِيَبْكِهِ»: ليبكه مقتر، وليبكه رفقة."
  - "جملة «حَارَ هَادِيهِمْ» صفة لـ«رُفْقَةٌ»، و«بِمَهْلَكَةٍ» متعلق بـ«حَارَ»."
  - "«كَأَنَّ ظُلْمَتَهَا ... الْقَارُ» «ظُلْمَتَهَا» اسم «كأنّ»، والضمير للمهلكة، و«الْقَارُ» خبرها، و«فِي الطُّخْيَةِ» متعلق بمحذوف حال."
morphology:
  - "«مَهْلَكَة» اسم مكان على «مَفْعَلة» من «هَلَكَ»، وفيها ثلاث لغات في حركة اللام [@lisan، ج10 ص505]."
  - "«هَادِي» اسم فاعل من «هَدَى»، ثبتت ياؤه لإضافته إلى الضمير."
rhetoric:
  thesis: "الباكي الثاني: المسافر الضائع في الليل. وهو يعيد إلى القصيدة صورة البيت 17 مقلوبة."
  devices:
    - title: "صدى البيت 17"
      text: "في البيت 17 كان «الْهُدَاةُ» يأتمّون بصخر «كَأَنَّهُ عَلَمٌ فِي رَأْسِهِ نَارُ»، وهنا «حَارَ هَادِيهِمْ» في ظلمة كالقار. فصخر كان النور الذي يهتدي به الأدلاء، فلما مات بقي الدليل حائرًا والليل بلا نار."
    - title: "التشبيه"
      text: "في «كَأَنَّ ظُلْمَتَهَا فِي الطُّخْيَةِ الْقَارُ» شبّهت سواد الليل الغائم بالقار، وهو أشد ما يعرفون سوادًا، فالظلمة كثيفة كأنها تُلمس."
    - title: "تراكم أسباب الضياع"
      text: "جمعت في بيت واحد مفازة مهلكة، وليلًا، وغيمًا يحجب النجوم، ودليلًا حائرًا. فكل ما يهتدي به المسافر قد غاب."
  connection: "ثم تختم بأبيات مرصّعة في صفاته: حامي الحقيقة، محمود الخليقة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "وَرُفْقَتُنْ / حَارَ هَا / دِيهِمْ بِمَهْ / لَكَتِنْ = متفعلن / فاعلن / مستفعلن / فعِلن — كَأَنْنَ ظُلْ / مَتَهَا / فِطْ طُخْيَتِلْ / قَارُو = متفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الشطرين فصارت «متفعلن»، و«فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "خاتمة مقطع «من يبكيه»، وآخر الأبيات السبعة عشر التي يرويها أبو الفَرَج، وفي تفسيره: «الطخية، من الطخاء، وهو الغيم الرقيق الذي يواري النجوم فيتحير الهادي» [@aghani-dk، ج15 ص81، 83]. ويذكر المحقق أن قول أبي عُبَيْدة في الشرح «منقول عن ابن السكيت» [@diwan-khansa، ص391]."
