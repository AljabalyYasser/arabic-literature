first: "وَإِنَّ صَخْرًا لَوَالِينَا وَسَيِّدُنَا"
second: "وَإِنَّ صَخْرًا إِذَا نَشْتُو لَنَحَّارُ"
meaning: "إن صخرًا لَوليُّ أمرنا وسيدنا، وإنه إذا أقمنا في الشتاء وقلّ الطعام لكثير النحر للإبل يطعم الناس. وفي الشرح: «أي ينحر في شدة الزمان والبرد، فيُطعِم» [@diwan-khansa، ص386]."
vocabulary:
  - term: "لَوَالِينَا"
    text: "الذي يلي أمرنا ويقوم به."
  - term: "نَشْتُو"
    text: "ندخل في الشتاء ونقيم فيه. في اللسان: «ويقال: شتونا الصمّان أي أقمنا بها في الشتاء» [@lisan، ج14 ص421]."
  - term: "نَحَّارُ"
    text: "كثير نحر الإبل للضيفان والجائعين. وإنما خصّت الشتاء، قال البَغْداديّ: «لأن النحر في الشتاء لأن الإطعام فيه أشد مؤنة» [@khizana، ج1 ص433]."
syntax:
  - "«إِنَّ» حرف توكيد، و«صَخْرًا» اسمها، و«لَوَالِينَا» خبرها، واللام لام الابتداء تأخرت إلى الخبر لأنها لا تجتمع مع «إنّ» في أول الكلام، وتسمّى اللام المزحلقة. و«سَيِّدُنَا» معطوف على الخبر."
  - "في العجز: «إِذَا نَشْتُو» ظرف فيه معنى الشرط متعلق بـ«نَحَّارُ»، وقُدّم على الخبر «لَنَحَّارُ»."
morphology:
  - "«وَالِي» اسم فاعل من «وَلِيَ»، وثبتت ياؤه لأنه مضاف غير منوّن."
  - "«نَحَّار» على «فَعّال» للمبالغة. و«نَشْتُو» مضارع «شَتَا يَشْتُو» من الأفعال الواوية."
rhetoric:
  thesis: "بعد المثل يعود اسم صخر مؤكَّدًا، كأنها تعلنه على الناس."
  devices:
    - title: "التكرار للتنويه"
      text: "كررت «وَإِنَّ صَخْرًا» في صدر البيت وعجزه، وستكررها في البيتين التاليين. ويمثّل ابن رَشِيق بهذه الأبيات لتكرار الاسم «على سبيل التنويه به، والإشارة إليه بذكر، إن كان في مدح»، ويرى في ذلك «تنويه به، وإشارة بذكره، وتفخيم له في القلوب والأسماع» [@ibn-rashiq، ج2 ص74]. أي أن ترديد الاسم يرفع صاحبه ويثبّته في الأذن."
    - title: "التوكيد"
      text: "في كل شطر توكيدان: «إنّ» واللام في الخبر. فالكلام يُلقى كأن في السامعين من ينكره، وهي تردّ على الموت نفسه."
    - title: "الولاية والقِرى"
      text: "جمعت في الصدر منزلته في قومه «وَالِينَا وَسَيِّدُنَا»، وفي العجز كرمه «نَحَّارُ». وكذا تصنع في البيت التالي: الإقدام في الصدر والإطعام في العجز."
  connection: "ثم تكرر اسمه مرتين أخريين: مقدام إذا ركبوا، عقّار إذا جاعوا."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "وَإِنْنَ صَخْ / رَنْ لَوَا / لِينَا وَسَيْ / يِدُنَا = متفعلن / فاعلن / مستفعلن / فعِلن — وَإِنْنَ صَخْ / رَنْ إِذَا / نَشْتُو لَنَحْ / حَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الشطرين فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يفتتح مقطع «وإنّ صخرًا» (15–17)، وهو ثاني القراءات الثلاث المعتمدة. والمُبَرِّد وأبو الفَرَج يرويانه بـ«لوالينا» [@kamil، ج4 ص40]؛ [@aghani-dk، ج15 ص81]. وقال البَغْداديّ في روايته «لمولانا وسيدنا»: «قيل إذا اجتمع المولى والسيد قدم المولى كما هنا» [@khizana، ج1 ص433]."
variants:
  - reading: "وَإِنَّ صَخْرًا لَكَافِينَا وَسَيِّدُنَا"
    status: "نص ثَعْلَب"
    note: "هذا لفظ المتن، وفي الشرح: «ويروى: لوالينا وسيدنا» [@diwan-khansa، ص385–386]. ويذكر المحقق أن «لوالينا» في نسخ رواية ابن السِّكِّيت، وأنها «الرواية المتداولة في كتب الأدباء» [@diwan-khansa، ص385]."
  - reading: "وَإِنَّ صَخْرًا لَمَوْلَانَا وَسَيِّدُنَا"
    status: "رواية العمدة والخزانة"
    note: "[@ibn-rashiq، ج2 ص74]؛ [@khizana، ج1 ص433]."
  - reading: "وَإِنَّ صَخْرًا لَحَامِينَا وَسَيِّدُنَا"
    status: "رواية يذكرها البَغْداديّ"
    note: "[@khizana، ج1 ص433]."
  - reading: "فَإِنَّ صَخْرًا لَوَالِينَا وَسَيِّدُنَا"
    status: "رواية الأغاني"
    note: "[@aghani-dk، ج15 ص81]."
