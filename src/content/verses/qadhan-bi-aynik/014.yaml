first: "يَوْمًا بِأَوْجَدَ مِنِّي يَوْمَ فَارَقَنِي"
second: "صَخْرٌ وَلِلدَّهْرِ إِحْلَاءٌ وَإِمْرَارُ"
meaning: "ليست تلك الناقة في أي يوم بأشدّ حزنًا مني يوم فارقني صخر؛ والدهر يأتي بالحلو مرة وبالمرّ مرة. وفي الشرح: «يقال: ما أحلى وما أمرّ؛ أي ما أتى بحلوة ولا بمرّة. أي الدهر يأتي بمحبة ومشقة» [@diwan-khansa، ص385]."
vocabulary:
  - term: "بِأَوْجَدَ"
    text: "بأشدّ وَجْدًا، والوَجْد الحزن. قال البَغْداديّ: «وقولها بأوجد مني أي بأشد مني وجدا» [@khizana، ج1 ص433]."
  - term: "إِحْلَاءٌ وَإِمْرَارُ"
    text: "إتيان بالحلو وإتيان بالمرّ. في الأغاني: «يقال: ما أحلى ولا أمرّ، أي ما أتى بحلوة ولا مرة. والمعنى أن الدهر يأتي بالمشقة والمحبة» [@aghani-dk، ج15 ص82]. وقال البَغْداديّ: «أي سرور وحزن» [@khizana، ج1 ص433]."
syntax:
  - "«بِأَوْجَدَ» خبر «ما» النافية في البيت 11 «فَمَا عَجُولٌ»، والباء زائدة لتوكيد النفي، فهو مجرور لفظًا منصوب محلًّا، وعلامة جره الفتحة لأنه ممنوع من الصرف للوصفية ووزن الفعل."
  - "«يَوْمًا» ظرف متعلق بـ«أَوْجَدَ»، و«مِنِّي» متعلق به أيضًا، و«يَوْمَ فَارَقَنِي صَخْرٌ» ظرف مضاف إلى الجملة الفعلية، و«صَخْرٌ» فاعل «فَارَقَ»."
  - "«وَلِلدَّهْرِ إِحْلَاءٌ وَإِمْرَارُ» جملة مستأنفة: «إِحْلَاءٌ» مبتدأ مؤخر، و«لِلدَّهْرِ» خبر مقدم."
morphology:
  - "«أَوْجَد» اسم تفضيل على «أَفْعَل» من «وَجَدَ» بمعنى حزن."
  - "«إِحْلَاء» و«إِمْرَار» مصدران على «إِفْعال» من «أَحْلَى» و«أَمَرَّ»، أي جاء بالحلو وجاء بالمرّ."
rhetoric:
  thesis: "هنا يُغلق المثل الذي بدأ في البيت 11: كل ما وُصف من حزن الناقة دون حزنها."
  devices:
    - title: "التشبيه المنفي"
      text: "بنت المثل كله على النفي «فَمَا عَجُولٌ ... بِأَوْجَدَ مِنِّي». فالمشبَّه به، وهو أوضح ما يعرف العرب من الحزن، يُنفى أن يبلغ حزنها، فيصير حزنها هو الأصل الذي يقاس عليه."
    - title: "تأخير الخبر"
      text: "أخّرت خبر «ما» ثلاثة أبيات، فبقي السامع معلّقًا يسمع صفات الناقة ولا يدري إلى أين ينتهي الكلام، حتى جاء «بِأَوْجَدَ مِنِّي» واسم «صَخْرٌ» في أول العجز."
    - title: "الطباق"
      text: "جمعت بين «إِحْلَاءٌ» و«إِمْرَارُ»، وختمت البيت بحكمة عن الدهر كما ختمت البيت 5. ولكن الحلو هنا يذكّر بما مضى، والمرّ بما هي فيه."
  connection: "ثم تبدأ التنويه باسمه: «وَإِنَّ صَخْرًا» ثلاث مرات."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "يَوْمَنْ بِأَوْ / جَدَ مِنْ / نِي يَوْمَ فَا / رَقَنِي = مستفعلن / فعِلن / مستفعلن / فعِلن — صَخْرُنْ وَلِدْ / دَهْرِ إِحْ / لَاءُنْ وَإِمْ / رَارُو = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الصدر فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "خاتمة مقطع «العَجُول» (11–14). ويروي الأبيات 11–14 معًا أبو الفَرَج والبَغْداديّ [@aghani-dk، ج15 ص80–81]؛ [@khizana، ج1 ص432]."
