first: "فَقُلْتُ لَمَّا رَأَيْتُ الدَّهْرَ لَيْسَ لَهُ"
second: "مُعَاتِبٌ وَحْدَهُ يُسْدِي وَنَيَّارُ"
meaning: "فلما رأيت أن الدهر لا يعاتبه أحد، وأنه وحده ينسج الأمور ويحلّها كما يشاء، قلتُ ما في البيت التالي: لقد نعى إليّ ابنُ نَهيك أخًا أثق به."
vocabulary:
  - term: "مُعَاتِبٌ"
    text: "من يعاتبه ويلومه. والمعاتبة في اللسان: «مخاطبة الإدلال وكلام المدلين أخلاءهم» [@lisan، ج1 ص577]، أي لوم المحبّ الذي يرجو أن يُرجَع إليه."
  - term: "يُسْدِي"
    text: "يمدّ السَّدى، وهو خيوط الثوب الطولية. «والسَّدى المعروف: خلاف لحمة الثوب، وقيل: أسفله، وقيل: ما مدّ منه»، و«تقول منه: أسديت الثوب» [@lisan، ج14 ص375]."
  - term: "نَيَّارُ"
    text: "يجعل للثوب نِيرًا، أي لُحمة، وهي الخيوط العرضية. ويقول المحقق ناقلًا عن حاشية «أنيس الجلساء»: «أسدى الثوب: أقام سداه؛ أي ما مد من خيوطه. ونيّر الثوب: إذا جعل له نيرا؛ أي لحمة، استعارت ذلك لنقض الأمور وإبرامها» [@diwan-khansa، ص387]. وفي اللسان: «ويقال: لستَ في هذا الأمر بمُنِير ولا مُلْحِم» [@lisan، ج5 ص246]، أي لا يد لك في نسجه."
syntax:
  - "«لَمَّا» ظرف بمعنى «حين» فيه معنى الشرط، وجوابه «قُلْتُ» المتقدم عليه. و«الدَّهْرَ» مفعول «رَأَيْتُ»، وجملة «لَيْسَ لَهُ مُعَاتِبٌ» في موضع الحال منه أو المفعول الثاني."
  - "«وَحْدَهُ» حال. و«يُسْدِي» خبر لمبتدأ محذوف، أي هو يسدي، و«نَيَّارُ» معطوف عليه، وهو اسم عُطف على فعل لأنه في معناه: يسدي وينير."
  - "مقول القول لا يأتي في هذا البيت، والظاهر عندنا أنه البيت 22: «لَقَدْ نَعَى ابْنُ نَهِيكٍ لِي أَخَا ثِقَةٍ»."
morphology:
  - "«يُسْدِي» مضارع «أَسْدَى» على «أَفْعَلَ»، من السَّدى. و«نَيَّار» صيغة مبالغة على «فَعّال» من النِّير."
  - "«مُعَاتِب» اسم فاعل من «عاتَبَ» على «فاعَلَ»، وهي صيغة المشاركة."
rhetoric:
  thesis: "تقطع سرد الصفات لتعود إلى الدهر: هو الفاعل الوحيد، ولا أحد يحاسبه."
  devices:
    - title: "الاستعارة"
      text: "في «يُسْدِي وَنَيَّارُ» جعلت الدهر حائكًا: يمدّ الخيوط الطولية ثم يُدخل فيها العرضية، فيصنع الثوب كله وحده. والمراد أنه يُبرم الأمور وينقضها كما يشاء، وهو ما يذكره المحقق [@diwan-khansa، ص387]."
    - title: "«لَيْسَ لَهُ مُعَاتِبٌ»"
      text: "العتاب يكون بين الأحبة وفيه رجاء، فنفيُه يعني أن الدهر لا يُرجى، ولا يُستعطف، ولا يُسأل عما فعل. وهو ختام لحديث الدهر الذي بدأ في البيتين 5 و6."
    - title: "عطف الاسم على الفعل"
      text: "قالت «يُسْدِي» بالفعل ثم «نَيَّارُ» بصيغة المبالغة، فالإسداء فعل يتجدد، والإنارة صفة ثابتة فيه. ولعل القافية ألجأت إليه، لكنه يجعل الهدم في آخر البيت أثقل من البناء."
  connection: "ثم يأتي ما قالته: نعى إليّ ابن نهيك أخًا أثق به."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "فَقُلْتُ لَمْ / مَا رَأَيْ / تُدْ دَهْرَ لَيْ / سَ لَهُو = متفعلن / فاعلن / مستفعلن / فعِلن — مُعَاتِبُنْ / وَحْدَهُو / يُسْدِي وَنَيْ / يَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الشطرين فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "خاتمة مقطع «الصفات» وجسر إلى خبر النعي. ولا شرح له في الشرح المنسوب إلى ثَعْلَب، والتفسير الذي في حاشية المحقق منقول عن «أنيس الجلساء» [@diwan-khansa، ص387]."
