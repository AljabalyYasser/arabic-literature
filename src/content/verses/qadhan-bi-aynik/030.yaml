first: "مُوَرَّثُ الْمَجْدِ مَيْمُونٌ نَقِيبَتُهُ"
second: "ضَخْمُ الدَّسِيعَةِ فِي الْعَزَّاءِ مِغْوَارُ"
meaning: "ورث المجد عن آبائه، مبارك النفس موفّق فيما يحاول، عظيم العطاء، كثير الغارات على أعدائه في السنة الشديدة. ويقول المحقق: «الدسيعة: العطية، والعزاء: الشدة» [@diwan-khansa، ص389]."
vocabulary:
  - term: "مَيْمُونٌ نَقِيبَتُهُ"
    text: "مبارك النفس. «والنقيبة النفس»، «ورجل ميمون النقيبة: مبارك النفس، مظفّر بما يحاول» [@lisan، ج1 ص768]."
  - term: "ضَخْمُ الدَّسِيعَةِ"
    text: "عظيم العطاء. «والدَّسيعة: العطية. يقال: فلان ضخم الدسيعة» [@lisan، ج8 ص85]. وفي الأغاني: «والدسيعة: العطاء» [@aghani-dk، ج15 ص83]. ويفسرها الشرح في البيت 33 حيث تتكرر."
  - term: "الْعَزَّاءِ"
    text: "السنة الشديدة. «والعزّاء: السنة الشديدة» [@lisan، ج5 ص377]."
  - term: "مِغْوَارُ"
    text: "كثير الغارة. «والمغوار: المبالغ في الغارة»، «ورجل مغوار بيّن الغوار: مقاتل كثير الغارات على أعدائه» [@lisan، ج5 ص36]."
syntax:
  - "«مُوَرَّثُ الْمَجْدِ» خبر لمبتدأ محذوف، و«الْمَجْدِ» مضاف إليه وهو في المعنى نائب الفاعل: وُرِّث المجد."
  - "«مَيْمُونٌ نَقِيبَتُهُ» «نَقِيبَتُهُ» نائب فاعل لاسم المفعول «مَيْمُونٌ»، لأنه يعمل عمل فعله المبني للمجهول."
  - "«ضَخْمُ الدَّسِيعَةِ» و«مِغْوَارُ» خبران آخران، و«فِي الْعَزَّاءِ» متعلق بـ«مِغْوَارُ»."
morphology:
  - "«مُوَرَّث» اسم مفعول من «وَرَّثَ» على «فَعَّلَ»، و«مَيْمُون» اسم مفعول من «يَمَنَ»."
  - "«نَقِيبَة» و«دَسِيعَة» على «فَعِيلة»، و«الْعَزَّاء» على «فَعْلاء»، و«مِغْوَار» على «مِفْعال»."
rhetoric:
  thesis: "النسب والكرم والغزو في بيت واحد: ما ورثه، وما في نفسه، وما يعطيه، وما يفعله في الشدة."
  devices:
    - title: "«مُوَرَّثُ الْمَجْدِ»"
      text: "بنت الصفة على المفعول: المجد وُرِّث له، فهو لم يصنعه وحده بل تسلّمه من آباء أحرار كما قالت في البيت السابق، ثم زاد عليه بعطائه وغاراته."
    - title: "المقابلة"
      text: "«ضَخْمُ الدَّسِيعَةِ» عطاء لقومه، و«مِغْوَارُ» غارة على أعدائه، وكلاهما «فِي الْعَزَّاءِ»: في السنة الشديدة يعطي هؤلاء ويغير على أولئك."
    - title: "التكرار في القصيدة"
      text: "تتكرر «ضَخْمُ الدَّسِيعَةِ» بلفظها في البيت 33. ويبدو أن العبارة كانت من صفات السيد المحفوظة، تعود إليها الشاعرة."
  connection: "ثم تختم النسب: فرع من فرع كريم غير مخلوط، شديد العزيمة، فخّار عند الجمع."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "مُوَرْرَثُلْ / مَجْدِ مَيْ / مُونُنْ نَقِي / بَتُهُو = متفعلن / فاعلن / مستفعلن / فعِلن — ضَخْمُدْ دَسِي / عَةِ فِلْ / عَزْزَاءِ مِغْ / وَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "في مقطع «العفة والقرى والنسب». ولا شرح له في الشرح المنسوب إلى ثَعْلَب في موضعه."
