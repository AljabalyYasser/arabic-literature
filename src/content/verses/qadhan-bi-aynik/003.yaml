    note: "[@aghani-dk، ج15 ص80]. ثكلت: فقدت. لكن الأغاني يفسّر بعدها «الوله» [@aghani-dk، ج15 ص82]، فكأن تفسيره على رواية «ولهت»."
  - reading: "وَدُونَهُ مِنْ جَدِيدِ الْأَرْضِ أَسْتَارُ"
    status: "رواية العقد"
    note: "وصدره عنده «فَالْعَيْنُ تَبْكِي عَلَى صَخْرٍ وَحَقَّ لَهَا»، فهو يجمع صدر البيت 5 وعجز هذا البيت [@iqd، ج3 ص224]."
