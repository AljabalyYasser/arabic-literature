first: "تَبْكِي لِصَخْرٍ هِيَ الْعَبْرَى وَقَدْ وَلِهَتْ"
second: "وَدُونَهُ مِنْ جَدِيدِ التُّرْبِ أَسْتَارُ"
meaning: "تبكي صخرًا، فهي الباكية التي لا يجف دمعها، وقد ذهب الحزن بعقلها، وبينها وبينه ستور من تراب القبر الجديد."
vocabulary:
  - term: "الْعَبْرَى"
    text: "في الشرح: «العبرى: التي لا تجف عينها من الدموع قيل لها عبرى؛ لهملان دموعها» [@diwan-khansa، ص379]. وفي الأغاني: «يقال امرأة عبرى وعابر. والعبرة: سخنة العين» [@aghani-dk، ج15 ص82]."
  - term: "وَلِهَتْ"
    text: "من الوَلَه. في الشرح: «الوله: ما يصيب الرجل والمرأة من شدة الجزع عند المصيبة»، و«الواله: التي قد شفّها الحزن على ولدها، والواله أيضا: المشتاق» [@diwan-khansa، ص379–380]. وفي اللسان: «الوَلَهُ: الحزن، وقيل: هو ذهاب العقل والتحير من شدة الوجد أو الحزن أو الخوف» [@lisan، ج13 ص561]."
  - term: "جَدِيدِ التُّرْبِ"
    text: "في الشرح: «وجديد الترب: ما أثير من باطن الأرض» [@diwan-khansa، ص379]، أي التراب الذي حُفر للقبر فظهر."
  - term: "أَسْتَارُ"
    text: "جمع سِتْر، وهو كل ما يحجب. في الشرح: «اللبس سِتر، والتراب ستر، وما يقيه ستر. وقال: الأستار: صفيح وتراب» [@diwan-khansa، ص380]."
syntax:
  - "«تَبْكِي» فعل مضارع فاعله ضمير الشاعرة، و«لِصَخْرٍ» متعلق به. و«هِيَ الْعَبْرَى» جملة من مبتدأ وخبر، مستأنفة تصف الباكية."
  - "«وَقَدْ وَلِهَتْ» جملة حالية، الواو واو الحال، و«قد» تحقق أن الوله وقع."
  - "«وَدُونَهُ ... أَسْتَارُ» جملة حالية ثانية: «أَسْتَارُ» مبتدأ مؤخر، و«دُونَهُ» ظرف خبر مقدم، و«مِنْ جَدِيدِ التُّرْبِ» بيان للأستار تقدّم عليها."
morphology:
  - "«الْعَبْرَى» على «فَعْلَى»، ويقال للمرأة «عبرى وعابر» [@aghani-dk، ج15 ص82]."
  - "«أَسْتَار» جمع «سِتْر» على «أَفْعال»."
  - "«وَلِهَتْ» من «وَلِهَ يَوْلَهُ»، ومنه «امرأة وَلْهَى ووالهٌ ووالِهَةٌ ومِيلاهٌ: شديدة الحزن على ولدها» [@lisan، ج13 ص561]."
rhetoric:
  thesis: "أول مرة يُذكر فيها اسم صخر، ويأتي ومعه القبر: البكاء من جهة، والتراب الجديد من الجهة الأخرى."
  devices:
    - title: "الكناية"
      text: "في «وَدُونَهُ مِنْ جَدِيدِ التُّرْبِ أَسْتَارُ» لم تقل إنه دُفن، بل ذكرت ما يلزم الدفن: ترابًا جديدًا يحجبه. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود، فيومئ به إليه» [@dalail، ص66]."
    - title: "«جَدِيدِ التُّرْبِ»"
      text: "وصف التراب بالجِدّة يجعل القبر حديث العهد، فالمصيبة قريبة والجرح لم يندمل."
    - title: "الحديث عن النفس بضمير الغائبة"
      text: "في «تَبْكِي ... هِيَ الْعَبْرَى» تتحدث عن نفسها كأنها امرأة أخرى تنظر إليها، تمهيدًا لتسمية نفسها «خُنَاسُ» في البيتين التاليين."
  connection: "ثم تقول إن هذا البكاء لا ينقطع ما دامت حية."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "تَبْكِي لِصَخْ / رِنْ هِيَلْ / عَبْرَى وَقَدْ / وَلِهَتْ = مستفعلن / فاعلن / مستفعلن / فعِلن — وَدُونَهُو / مِنْ جَدِي / دِتْ تُرْبِ أَسْ / تَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يسمّي المرثيّ أول مرة. ويرى ابن الأعرابي أن مثل العجول في البيت 11 موضعه بعد هذا البيت، ففي الشرح أنه «روى هذا البيت بعد قوله: تبكي لصخر...» [@diwan-khansa، ص382]."
