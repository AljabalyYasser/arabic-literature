first: "مَشْيَ السَّبَنْتَى إِلَى هَيْجَاءَ مُضْلِعَةٍ"
second: "لَهَا سِلَاحَانِ أَنْيَابٌ وَأَظْفَارُ"
meaning: "يمشي إلى الحرب الشديدة مشي النمر الجريء، حربٍ لها سلاحان من أنياب وأظفار. والضمير في «لَهَا» على نص ثَعْلَب يعود على الحرب، فكأنها وحش آخر يلقاه النمر؛ وفي الأغاني والكامل «لَهُ سلاحان»، فالسلاحان للنمر."
vocabulary:
  - term: "السَّبَنْتَى"
    text: "النمر. في الشرح: «السبندى والسبنتى: النمر» [@diwan-khansa، ص381]. وقال المُبَرِّد: «والسبنتى والسبندى واحد، وهو الجريء الصدر، وأصله في النمر» [@kamil، ج4 ص41]. وفي اللسان: «والسَّبَنْتَى: النمر، ويشبه أن يكون سمي به لجرأته؛ وقيل: السبنتى الأسد» [@lisan، ج2 ص39]."
  - term: "هَيْجَاءَ"
    text: "الحرب. في الشرح: «والهيجاء: تمد وتقصر» [@diwan-khansa، ص381]. وفي اللسان: «والهيج والهياج والهيجا والهيجاء: الحرب، بالمد والقصر، لأنها موطن غضب» [@lisan، ج2 ص395]."
  - term: "مُضْلِعَةٍ"
    text: "شديدة ثقيلة. في الشرح: «والمضلعة: الشديدة، يقال: أضلعني الأمر، وأقمّني؛ إذا لم أضبطه وأثقلني» [@diwan-khansa، ص381]. وفي اللسان: «وداهية مُضْلِعة: تثقل الأضلاع وتكسرها» [@lisan، ج8 ص225]."
syntax:
  - "«مَشْيَ» مفعول مطلق لفعل محذوف، والتقدير: يمشي مشيَ السبنتى، وهو متصل بما قبله: يرد الماء المخوف ماشيًا إليه هذا المشي."
  - "«هَيْجَاءَ» مجرورة بـ«إلى» وعلامة جرها الفتحة لأنها ممنوعة من الصرف لألف التأنيث الممدودة، و«مُضْلِعَةٍ» صفتها."
  - "«لَهَا سِلَاحَانِ» «سِلَاحَانِ» مبتدأ مؤخر، و«لَهَا» خبر مقدم، و«أَنْيَابٌ وَأَظْفَارُ» بدل من «سِلَاحَانِ»، بدل مفصَّل من مجمَل."
morphology:
  - "«السَّبَنْتَى» ألفه للإلحاق لا للتأنيث، قال صاحب اللسان: «والياء للإلحاق لا للتأنيث، ألا ترى أن الهاء تلحقه والتنوين، ويقال: سبنتاة وسبنداة» [@lisan، ج2 ص39]."
  - "«مُضْلِعَة» اسم فاعل من «أَضْلَعَ» الرباعي. و«أَنْيَاب» جمع «ناب»، و«أَظْفَار» جمع «ظُفُر»، كلاهما على «أَفْعال»."
rhetoric:
  thesis: "تجعل صخرًا نمرًا يمشي إلى الحرب، وتجعل الحرب وحشًا مثله، فالقتال بين ضاريين."
  devices:
    - title: "التشبيه"
      text: "في «مَشْيَ السَّبَنْتَى» شبّهت مشيه إلى الحرب بمشي النمر، وحذفت أداة التشبيه، فجاء المشبّه به مفعولًا مطلقًا: يمشي مشيَ النمر. واختارت النمر لما في اسمه من الجرأة [@lisan، ج2 ص39]."
    - title: "التفصيل بعد الإجمال"
      text: "قالت «سِلَاحَانِ» ثم فصّلت «أَنْيَابٌ وَأَظْفَارُ»، فالعدد يشوّق إلى المعدود، والمعدود سلاح الوحش لا سلاح الرجال."
    - title: "تشخيص الحرب"
      text: "على نص ثَعْلَب «لَهَا» تعود على «هَيْجَاءَ»، فالحرب نفسها حيوان مفترس بأنياب وأظفار. وعلى رواية «لَهُ» تبقى الصورة للنمر، وهي أقرب إلى المعنى الظاهر."
  connection: "ثم تضرب مثلًا لحزنها: ناقة فقدت ولدها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "مَشْيَسْ سَبَنْ / تَى إِلَى / هَيْجَاءَ مُضْ / لِعَتِنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — لَهَا سِلَا / حَانِ أَنْ / يَابُنْ وَأَظْ / فَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "يكمل صورة صخر في البيت 9. وعجزه يعود بلفظه تقريبًا في البيت 38 «لَهُ سِلَاحَانِ أَنْيَابٌ وَأَظْفَارُ»، وينبه المحقق على أن البيت 38 «روي في القصيدة ذاتها بصورة أخرى» هي هذا البيت [@diwan-khansa، ص392]."
