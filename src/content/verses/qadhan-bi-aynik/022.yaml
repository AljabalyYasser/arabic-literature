first: "لَقَدْ نَعَى ابْنُ نَهِيكٍ لِي أَخَا ثِقَةٍ"
second: "كَانَتْ تُرَجَّمُ عَنْهُ قَبْلُ أَخْبَارُ"
meaning: "لقد جاءني ابن نَهيك بخبر موت أخٍ كنت أثق به وأعتمد عليه، وكانت الأخبار عنه من قبلُ ظنونًا يتناقلها الناس. ويقول المحقق: «أرادت أنه نعى أخاها الذي يعتمد عليه ويوثق به»، و«ترجّم عنه أخبار: أي تذكر على سبيل الظن والتخمين، ليس على سبيل اليقين» [@diwan-khansa، ص388]."
vocabulary:
  - term: "نَعَى"
    text: "أخبر بالموت. «والنَّعْيُ: خبر الموت، وكذلك النَّعِيّ» [@lisan، ج15 ص334]."
  - term: "ابْنُ نَهِيكٍ"
    text: "الرجل الذي حمل إليها الخبر، ولا يسمّيه الشرح ولا من رأينا من الرواة."
  - term: "أَخَا ثِقَةٍ"
    text: "أخًا يُوثق به ويُعتمد عليه. والثقة «مصدر قولك وثق به يثق» [@lisan، ج10 ص371]."
  - term: "تُرَجَّمُ"
    text: "تُقال ظنًّا بلا يقين، من الرَّجْم بمعنى القول بالظن، كما يفسّره المحقق [@diwan-khansa، ص388]."
syntax:
  - "«لَقَدْ» اللام لتوكيد الخبر، و«قد» للتحقيق. و«ابْنُ نَهِيكٍ» فاعل «نَعَى»، و«لِي» متعلق به، و«أَخَا» مفعول به منصوب بالألف لأنه من الأسماء الخمسة، و«ثِقَةٍ» مضاف إليه."
  - "«كَانَتْ تُرَجَّمُ عَنْهُ قَبْلُ أَخْبَارُ» «أَخْبَارُ» اسم «كان» مؤخر، وجملة «تُرَجَّمُ عَنْهُ» خبرها مقدم، و«قَبْلُ» ظرف مبني على الضم لأنه قُطع عن الإضافة لفظًا ونُوي معناها: قبلَ ذلك."
  - "والجملة كلها، فيما نرى، مقول القول في «فَقُلْتُ» في البيت 21."
morphology:
  - "«تُرَجَّم» مضارع مبني للمجهول من «رَجَّم» على «فَعَّلَ»، والتضعيف للتكثير: ظنون كثيرة."
  - "«نَعَى» فعل ماض ناقص يائي، مضارعه «يَنْعَى»."
rhetoric:
  thesis: "تنتقل من صفات صخر إلى لحظة الخبر: حين صار الظن يقينًا."
  devices:
    - title: "المقابلة بين الظن واليقين"
      text: "في الصدر «نَعَى»، وهو الخبر القاطع، وفي العجز «تُرَجَّمُ عَنْهُ قَبْلُ أَخْبَارُ»، وهي ظنون. فالبيت يحكي انقطاع الرجاء: كانت الأخبار تترجّح بين الحياة والموت، ثم جاء النعي فأنهى الترجّح."
    - title: "الكناية"
      text: "لم تسمّه، بل قالت «أَخَا ثِقَةٍ»، فذكرت أخصّ ما فقدته منه: الثقة والاعتماد."
  connection: "ثم تصف ليلة النعي: باتت تسهر ترقب النجم حتى حجبته الأستار."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "لَقَدْ نَعَبْ / نُ نَهِي / كِنْ لِي أَخَا / ثِقَتِنْ = متفعلن / فعِلن / مستفعلن / فعِلن — كَانَتْ تُرَجْ / جَمُ عَنْ / هُو قَبْلُ أَخْ / بَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الأولى من الشطرين فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "أول مقطع «النعي والسهر» (22–23). والأخبار المرجَّمة قبل النعي تناسب ما يرويه أبو الفَرَج من أن صخرًا مرض من طعنته «قريبًا من حول» قبل أن يموت [@aghani-dk، ج15 ص78]."
