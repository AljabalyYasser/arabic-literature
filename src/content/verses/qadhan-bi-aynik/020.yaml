first: "حَمَّالُ أَلْوِيَةٍ هَبَّاطُ أَوْدِيَةٍ"
second: "شَهَّادُ أَنْدِيَةٍ لِلْجَيْشِ جَرَّارُ"
meaning: "يحمل رايات الحرب فهو قائد الجيوش، وينزل الأودية التي يتحاماها الناس، ويحضر مجالس القوم برأيه، ويقود جيشًا كثيرًا ثقيل السير من كثرته."
vocabulary:
  - term: "أَلْوِيَةٍ"
    text: "جمع لواء، وهو الراية. «واللواء: العلم، والجمع ألوية وألويات»، و«اللواء: الراية ولا يمسكها إلا صاحب الجيش» [@lisan، ج15 ص266]."
  - term: "هَبَّاطُ"
    text: "كثير الهبوط، أي النزول. «وهَبَط هُبوطاً: نزل» [@lisan، ج7 ص421]."
  - term: "أَنْدِيَةٍ"
    text: "جمع نادٍ ونَدِيّ، وهو مجلس القوم. «الجوهري: النَّدِيّ، على فعيل، مجلس القوم ومتحدثهم، وكذلك الندوة والنادي» [@lisan، ج15 ص315]."
  - term: "جَرَّارُ"
    text: "يقود جيشًا جرّارًا. «وعسكر جرّار: كثير، وقيل: هو الذي لا يسير إلا زحفا لكثرته»، وعن الأصمعي: «كتيبة جرّارة أي ثقيلة السير» [@lisan، ج4 ص130]."
syntax:
  - "«حَمَّالُ أَلْوِيَةٍ» خبر لمبتدأ محذوف، أي هو حمّال ألوية، وما بعده أخبار متتابعة بلا عطف."
  - "صيغ المبالغة «حَمَّالُ» و«هَبَّاطُ» و«شَهَّادُ» أُضيفت إلى ما هو مفعول في المعنى: يحمل الألوية، ويهبط الأودية، ويشهد الأندية."
  - "«لِلْجَيْشِ» متعلق بـ«جَرَّارُ»، وقُدّم عليه."
morphology:
  - "«حَمَّال» و«هَبَّاط» و«شَهَّاد» و«جَرَّار» كلها على «فَعّال»، فالأجزاء الأربعة من وزن واحد."
  - "«أَلْوِيَة» و«أَوْدِيَة» و«أَنْدِيَة» كلها جموع على «أَفْعِلَة»: الأولى جمع «لِواء»، والثانية جمع «وادٍ»، والثالثة جمع «نَدِيّ»."
rhetoric:
  thesis: "أتمّ أبيات القصيدة ترصيعًا: ثلاثة أجزاء على وزن واحد وسجع واحد، تُقرع كالطبل في سرد صفات القائد."
  devices:
    - title: "الترصيع"
      text: "الترصيع عند قُدامة بن جعفر «أن يتوخى فيه تصيير مقاطع الأجزاء في البيت على سجع أو شبيه به أو من جنس واحد في التصريف» [@naqd-al-shir، ص11]. والأجزاء هي قطع البيت، ومقاطعها أواخرها؛ فالمعنى أن يقسم الشاعر بيته أقسامًا متساوية، ويجعل أواخرها متفقة في الحرف الأخير أو في الوزن الصرفي. ويعرّفه العَسْكَرِيّ بقوله: «وهو أن يكون حشو البيت مسجوعا، وأصله من قولهم: رصّعت العقد، إذا فصّلته» [@sinaatayn، ص375]، أي جعلت بين حبّاته فواصل منتظمة. وفي هذا البيت يجتمع الأمران: «حَمَّالُ أَلْوِيَةٍ / هَبَّاطُ أَوْدِيَةٍ / شَهَّادُ أَنْدِيَةٍ» ثلاثة أجزاء، كل جزء «فَعّال» مضاف إلى «أَفْعِلَة»، وكلها تنتهي بـ«ـيَةٍ». وكل جزء يملأ تفعيلتين من البسيط تمامًا، فحدود السجع هي حدود الوزن. ثم يأتي الجزء الرابع «لِلْجَيْشِ جَرَّارُ» على وزن «فَعّال» نفسه، ولكن بلا سجع، لأن القافية تفرض «ـارُ»."
    - title: "حدود الترصيع عند النقاد"
      text: "يرى قُدامة أن الترصيع «إنما يحسن إذا اتفق له في البيت موضع يليق به ... ولا هو أيضاً إذا تواتر واتصل في الأبيات كلها بمحمود، فإن ذلك إذا كان، دل على تعمل وأبان عن تكلف» [@naqd-al-shir، ص13]. ويقول ابن رَشِيق بعد أن ينقل رأي قُدامة: «وللقدماء من هذا النوع، إلا أنهم لا يكثرون منه كراهة التكلف» [@ibn-rashiq، ج2 ص27]. وسيأتي نقد العَسْكَرِيّ للبيتين 36 و37 من هذا الباب."
    - title: "ألفاظ مشتركة مع أبي المُثَلَّم"
      text: "الأجزاء الثلاثة نفسها في بيت لأبي المُثَلَّم الهُذَلِيّ يرثي صخر الغَيّ، وهو المثال الذي اختاره قُدامة للترصيع: «هَبَّاطُ أوْدِيَةٍ حَمَّالُ ألْوِيَة ... شَهَّادُ أَنْدِيَةٍ سِرْحَانُ فِتْيَانِ» [@naqd-al-shir، ص14]، ويرويه ابن رَشِيق كذلك [@ibn-rashiq، ج2 ص27]. ويروي العَسْكَرِيّ لتأبط شرًّا: «حمال ألوية شهاد أنديه ... هبّاط أودية جوّال آفاق» [@sinaatayn، ص376]. فالألفاظ ألفاظ تداولها شعراء الجاهلية في صفة السيد، وفي ثلاث قصائد بالبحر نفسه، ولا نعرف من سبق إليها. وهذه المسألة يبحثها النقاد باسم «الأخذ والمواردة»: هل أخذ الشاعر من غيره، أم توارد الشاعران على لفظ مشترك؟"
  connection: "ثم تقطع السرد بقولها: لما رأيت الدهر لا يعاتبه أحد، يسدي وحده وينير."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "حَمْمَالُ أَلْ / وِيَتِنْ / هَبْبَاطُ أَوْ / دِيَتِنْ = مستفعلن / فعِلن / مستفعلن / فعِلن — شَهْهَادُ أَنْ / دِيَتِنْ / لِلْجَيْشِ جَرْ / رَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الشطرين فصارت «فعِلن»، فصار كل جزء مرصّع «مستفعلن فعِلن»، والأجزاء متساوية في الوزن. والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "قلب مقطع «الصفات»، وهو مثال الموقع على الترصيع. ولا شرح له في الشرح المنسوب إلى ثَعْلَب. ويذكر المحقق أن للخَنْساء في الديوان نفسه مثل هذا، كقولها في قصيدة أخرى: «حمّال ألوية شهاد أنجية، قطاع أودية»، ويحيل إلى ص156 من النشرة [@diwan-khansa، ص387]. فهي تعود إلى هذه الألفاظ في أكثر من رثاء."
