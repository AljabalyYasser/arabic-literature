first: "لِيَبْكِهِ مُقْتِرٌ أَفْنَى حَرِيبَتَهُ"
second: "دَهْرٌ وَحَالَفَهُ بُؤْسٌ وَإِقْتَارُ"
meaning: "ليبكِ صخرًا الفقيرُ الذي أفنى الدهر ماله الذي يعيش به، ولازمه البؤس وضيق العيش، لأن صخرًا كان ملجأه. ويقول المحقق: «الحريبة: ما يتعيش به الإنسان من المال، حالفه: لازمه، الإقتار: ضيق العيش» [@diwan-khansa، ص391]."
vocabulary:
  - term: "مُقْتِرٌ"
    text: "فقير. «وأقتر الرجل: افتقر» [@lisan، ج5 ص70]."
  - term: "حَرِيبَتَهُ"
    text: "ماله الذي يعيش به، كما يفسرها المحقق [@diwan-khansa، ص391]. وفي اللسان: «وقيل: حريبة الرجل: ماله» [@lisan، ج1 ص303]."
  - term: "حَالَفَهُ"
    text: "لازمه كأنه عقد معه حلفًا. «وقد حالفه أي عاهده» [@lisan، ج9 ص53]."
  - term: "إِقْتَارُ"
    text: "ضيق العيش، مصدر «أقتر»."
syntax:
  - "«لِيَبْكِهِ» اللام لام الأمر، و«يَبْكِ» مضارع مجزوم بها وعلامة جزمه حذف الياء، والهاء مفعول به، و«مُقْتِرٌ» فاعل."
  - "جملة «أَفْنَى حَرِيبَتَهُ دَهْرٌ» صفة لـ«مُقْتِرٌ»، و«دَهْرٌ» فاعل «أَفْنَى» مؤخر. وجملة «وَحَالَفَهُ بُؤْسٌ» معطوفة عليها، و«إِقْتَارُ» معطوف على «بُؤْسٌ»."
morphology:
  - "«مُقْتِر» اسم فاعل من «أَقْتَرَ» على «أَفْعَلَ»، أي صار ذا قَتْر وضيق. وضبطته النشرة «مُقَتِّرٌ» بالتشديد، وهو اسم فاعل من «قَتَّرَ» أي ضيّق على عياله في النفقة، ولا يستقيم به الوزن ولا يناسب المعنى، فالمراد الفقير لا البخيل."
  - "«حَرِيبَة» على «فَعِيلة»، و«إِقْتَار» مصدر «أَقْتَرَ» على «إِفْعال»."
rhetoric:
  thesis: "من صفات الميت إلى من يبكيه: أول الباكين الفقير الذي فقد سنده."
  devices:
    - title: "الأمر بالبكاء"
      text: "«لِيَبْكِهِ» أمر غرضه الندب وإظهار الحسرة، فهي تعدّد من خسر بموته، وتجعل الفقراء شهودًا على كرمه."
    - title: "تشخيص البؤس"
      text: "في «حَالَفَهُ بُؤْسٌ» جعلت البؤس رجلًا عقد مع الفقير حلفًا فلا يفارقه، وفي «أَفْنَى حَرِيبَتَهُ دَهْرٌ» يعود الدهر فاعلًا كما في البيتين 5 و21."
    - title: "«مُقْتِرٌ» و«إِقْتَارُ»"
      text: "افتتحت البيت بالمقتر وختمته بالإقتار، والكلمتان من أصل واحد، فالفقر يحيط بالبيت من أوله إلى آخره كما يحيط بصاحبه."
  connection: "ثم تذكر باكيًا آخر: الرفقة التي ضل دليلها في مفازة مظلمة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "لِيَبْكِهِي / مُقْتِرُنْ / أَفْنَى حَرِي / بَتَهُو = متفعلن / فاعلن / مستفعلن / فعِلن — دَهْرُنْ وَحَا / لَفَهُو / بُؤْسُنْ وَإِقْ / تَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الأولى من العجز فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. وبضبط النشرة «مُقَتِّرٌ» تصير التفعيلة «مُ قَتْ تِ رُنْ» فلا تستقيم «فاعلن»، ولذلك ضبطناه «مُقْتِرٌ»."
context: "في مقطع «من يبكيه». ولا شرح له في الشرح المنسوب إلى ثَعْلَب، ولم نجده عند غير ثَعْلَب من مصادرنا."
