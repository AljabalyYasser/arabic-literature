first: "حَامِي الْحَقِيقَةِ مَحْمُودُ الْخَلِيقَةِ مَهْـ"
second: "ـدِيُّ الطَّرِيقَةِ نَفَّاعٌ وَضَرَّارُ"
meaning: "يحمي ما يجب على الرجل أن يحميه من أهل وحرمة، محمود الطبع، مستقيم الطريقة كأنه هُدي إليها، ينفع أولياءه ويضرّ أعداءه."
vocabulary:
  - term: "حَامِي الْحَقِيقَةِ"
    text: "الحقيقة ما يحقّ على الرجل أن يحميه. وفي اللسان: «والحقيقة ما يصير إليه حق الأمر ووجوبه»، و«العرب تقول: فلان يسوق الوسيقة وينسل الوديقة ويحمي الحقيقة» [@lisan، ج10 ص52]، فالعبارة من صفات السيد التي كانت العرب تقولها."
  - term: "الْخَلِيقَةِ"
    text: "الطبيعة والخُلق."
  - term: "مَهْدِيُّ الطَّرِيقَةِ"
    text: "مستقيم السيرة. والمهديّ في اللسان: «الذي قد هداه الله إلى الحق» [@lisan، ج15 ص354]."
syntax:
  - "«حَامِي الْحَقِيقَةِ» خبر لمبتدأ محذوف، وما بعده أخبار متتابعة بلا عطف إلا «نَفَّاعٌ وَضَرَّارُ»."
  - "«مَحْمُودُ الْخَلِيقَةِ» و«مَهْدِيُّ الطَّرِيقَةِ» اسما مفعول أُضيفا إلى نائب الفاعل في المعنى: محمودةٌ خليقتُه، مهديةٌ طريقتُه."
morphology:
  - "«مَهْدِيّ» اسم مفعول من «هَدَى»، أصله «مَهْدُوي»: اجتمعت الواو والياء وسبقت إحداهما بالسكون فقُلبت الواو ياءً وأُدغمت، وكُسر ما قبلها."
  - "«حَامِي» اسم فاعل منقوص، ثبتت ياؤه للإضافة. و«نَفَّاع» و«ضَرَّار» على «فَعّال»."
rhetoric:
  thesis: "تبدأ خاتمة الصفات بأحسن أبياتها ترصيعًا عند العَسْكَرِيّ."
  devices:
    - title: "الترصيع"
      text: "ثلاثة أجزاء متساوية تنتهي بـ«ـيقَةِ»: «حَامِي الْحَقِيقَةِ / مَحْمُودُ الْخَلِيقَةِ / مَهْدِيُّ الطَّرِيقَةِ»، ثم جزء رابع «نَفَّاعٌ وَضَرَّارُ». والترصيع عند قُدامة «أن يتوخى فيه تصيير مقاطع الأجزاء في البيت على سجع أو شبيه به أو من جنس واحد في التصريف» [@naqd-al-shir، ص11]، وعند العَسْكَرِيّ «أن يكون حشو البيت مسجوعا» [@sinaatayn، ص375]، أي أن يُقسم البيت أقسامًا تتفق أواخرها كما تتفق أواخر الفقرات في النثر المسجوع."
    - title: "حكم العَسْكَرِيّ"
      text: "يرى أبو هلال أن الترصيع «إذا اتفق في موضع من القصيدة أو موضعين كان حسنا، فإذا كثر وتوالى دلّ على التكلّف»، ثم يمثّل بأبيات «ما روى أنه للخنساء»، أولها هذا البيت، ويقول: «هذا البيت جيد» [@sinaatayn، ص377–378]. ونرى أن سبب استحسانه أن الجزء الرابع، وإن خرج عن السجع، جاء بلفظين متقابلين على وزن واحد «نَفَّاعٌ وَضَرَّارُ»، فلم يهبط الإيقاع كما هبط في البيت التالي."
    - title: "الطباق"
      text: "«نَفَّاعٌ وَضَرَّارُ» ضدان على صيغة واحدة. و«ضَرَّار» هي الكلمة التي وصفت بها الدهر في البيت 5، فصخر يملك ما يملكه الدهر: النفع والضر معًا."
    - title: "صلة بأبي المُثَلَّم"
      text: "«حَامِي الْحَقِيقَةِ» أول جزء في بيت لأبي المُثَلَّم الهُذَلِيّ في رثاء صخر الغَيّ: «حامِى الحقيقةِ نَسَّالُ الْوَدِيقَةِ مِعْ ... تَاقُ الوَسِيقَةِ جَلْدٌ غَيْرُ ثُنْيَانِ» [@naqd-al-shir، ص14]، وفيه التدوير نفسه. وهذا مع ما في البيت 20 من باب «الأخذ والمواردة»."
  connection: "ثم بيت مرصّع آخر: جوّاب قاصية، جزّاز ناصية، عقّاد ألوية."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "حَامِلْ حَقِي / قَةِ مَحْ / مُودُلْ خَلِي / قَةِ مَهْ = مستفعلن / فعِلن / مستفعلن / فعِلن — دِيْيُطْ طَرِي / قَةِ نَفْ / فَاعُنْ وَضَرْ / رَارُو = مستفعلن / فعِلن / مستفعلن / فعْلن"
  note: "البيت مدوَّر، والتدوير أن تشترك كلمة بين الصدر والعجز، فـ«مَهْـ» آخر الصدر و«ـدِيُّ» أول العجز. وبه صار الجزء المرصّع الثالث «مَهْدِيُّ الطَّرِيقَةِ» يعبر الحدّ بين الشطرين، وكذلك يرويه العَسْكَرِيّ «مه ... دىّ الطريقة» [@sinaatayn، ص378]. ودخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى من الشطرين فصارت «فعِلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]."
context: "أول مقطع «خاتمة الصفات» (36–39). وفي العقد يأتي بعد البيت 17 مباشرة، آخرَ ما يرويه ابن عبد ربه منها [@iqd، ج3 ص224]. وعند العَسْكَرِيّ يتبعه بيت ليس في رواية ثَعْلَب: «فعّال سامية ورّاد طامية ... للمجد نامية تعنيه أسفار»، ويقول فيه: «هذا البيت ردىء لتبرىء بعض ألفاظه من بعض» [@sinaatayn، ص378]، أي لأن ألفاظه متنافرة لا يأتلف بعضها مع بعض."
