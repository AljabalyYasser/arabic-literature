first: "تَبْكِي خُنَاسٌ فَمَا تَنْفَكُّ مَا عَمَرَتْ"
second: "لَهَا عَلَيْهِ رَنِينٌ وَهْيَ مِفْتَارُ"
meaning: "تبكي خُناس، ولا تزال ما بقيت حية تصيح عليه صياح الباكية، وقد أضعفها الحزن وكسرها."
vocabulary:
  - term: "خُنَاسٌ"
    text: "هي الخَنْساء نفسها. قال البَغْداديّ: «ويقال لها خناس أيضا بضم الخاء» [@khizana، ج1 ص434]. وفي اللسان: «وخَنْساءُ وخُناسُ وخُناسى، كله: اسم امرأة» [@lisan، ج6 ص73]."
  - term: "تَنْفَكُّ"
    text: "مع النفي «ما تنفك»: لا تزال."
  - term: "مَا عَمَرَتْ"
    text: "ما عاشت، مدة عمرها."
  - term: "رَنِينٌ"
    text: "«والرَّنِينُ: الصياح عند البكاء» [@lisan، ج13 ص187]."
  - term: "مِفْتَارُ"
    text: "ضعيفة منكسرة. من «الفَتْرة: الانكسار والضعف» [@lisan، ج5 ص43]. ويقول المحقق: «مفتار: أصابها فترة؛ أي ضعف وانكسار» [@diwan-khansa، ص379]."
syntax:
  - "«مَا تَنْفَكُّ» «ما» نافية، و«تَنْفَكُّ» فعل ناقص من أخوات «كان»، يفيد مع النفي الاستمرار، واسمه ضمير خُناس، وخبره جملة «لَهَا عَلَيْهِ رَنِينٌ»."
  - "«مَا عَمَرَتْ» «ما» مصدرية ظرفية، والتقدير: مدة عُمرها."
  - "«وَهْيَ مِفْتَارُ» جملة حالية. وسُكّنت الهاء في «وَهْيَ» بعد الواو، وهو جائز في الكلام والشعر."
  - "«خُنَاسٌ» علم مؤنث حقه ألا يُنوّن، قال البَغْداديّ: «غير منصرف للعدل والتأنيث» [@khizana، ج1 ص434]؛ وقد نُوّن هنا للوزن، وهو صرف ما لا ينصرف ضرورةً."
morphology:
  - "«مِفْتَار» على «مِفْعال»، صيغة مبالغة يستوي فيها المذكر والمؤنث، فلم تلحقه التاء وهو وصف لامرأة."
  - "«رَنِين» على «فَعِيل»، مصدر «رَنَّ يَرِنُّ»: «وقد رَنَّ يَرِنّ رَنِينًا» [@lisan، ج13 ص187]."
rhetoric:
  thesis: "تسمّي نفسها وتجعل حزنها عمرًا كاملًا: البكاء لا ينتهي إلا بانتهاء حياتها."
  devices:
    - title: "الالتفات"
      text: "خاطبت نفسها في البيت الأول «بِعَيْنِكِ»، ثم تحدثت عنها بضمير الغائبة، ثم سمّتها هنا «خُنَاسُ». والالتفات هو الانتقال في الحديث عن شخص واحد من الخطاب إلى الغيبة أو من التكلم إلى غيره. وبه تنظر الشاعرة إلى نفسها كما ينظر إليها الناس."
    - title: "التكرار"
      text: "بدأت البيت بـ«تَبْكِي» كما بدأت البيت السابق، وستبدأ به التالي أيضًا، فالفعل يتردد في ثلاثة أبيات متوالية كأنه النحيب نفسه."
    - title: "«مَا عَمَرَتْ»"
      text: "لم تحدّ بكاءها بوقت، بل بعمرها كله، فالحزن صار صفة لها لا حالًا عارضة."
  connection: "ثم تقول إن هذا البكاء حقها، لأن الدهر أصابها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الراء المضمومة، وقبلها ألف: «ـارُ»"
  scansion: "تَبْكِي خُنَا / سُنْ فَمَا / تَنْفَكْكُ مَا / عَمَرَتْ = مستفعلن / فاعلن / مستفعلن / فعِلن — لَهَا عَلَيْ / هِي رَنِي / نُنْ وَهْيَ مِفْ / تَارُو = متفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن». والعَرُوض، وهي آخر تفعيلة في الصدر، مخبونة «فعِلن»، والضَّرْب، وهو آخر تفعيلة في العجز، مقطوع «فعْلن»، والقَطْع حذف آخر الوتد المجموع وتسكين ما قبله [@atiq، ص48]. وتنوين «خُنَاسٌ» يصنع المقطع الطويل «سُنْ» الذي يحتاجه الوزن."
context: "في هذا البيت والذي بعده تسمّي الشاعرة نفسها، فيعرف القارئ أن الباكية هي القائلة. ولم يقف الشرح عند هذا البيت إلا بما سبق من تفسير الوله."
