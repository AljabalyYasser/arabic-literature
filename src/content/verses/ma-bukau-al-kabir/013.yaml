explained: false
first: حُرَّةٌ طَفْلَةُ الْأَنَامِلِ تَرْتَـ
second: ـبُّ سُخَامًا تَكُفُّهُ بِخِلَالِ
vocabulary:
- term: حُرَّةٌ
  text: '«والحُرَّةُ: الْكَرِيمَةُ مِنَ النِّسَاءِ» [@lisan، ج4 ص182].'
- term: طَفْلَةُ الْأَنَامِلِ
  text: 'ليّنة الأصابع: «وَيُقَالُ: جَارِيَةٌ طَفْلةٌ إِذا كَانَتْ رَخْصةً» [@lisan، ج11 ص401].'
- term: تَرْتَبُّ
  text: 'تصلح شعرها وتتعهده: «والمرأَةُ تَرْتَبُّ الشعَر بالدُّهْن» [@lisan، ج1 ص404].'
- term: سُخَامًا
  text: 'شعرًا ليّنًا: «والسُّخامُ مِنَ الشَّعَرِ وَالرِّيشِ وَالْقُطْنِ والخَزِّ وَنَحْوِ ذَلِكَ: اللَّيِّنُ الحَسَن» [@lisan، ج12 ص283].'
- term: تَكُفُّهُ بِخِلَالِ
  text: 'تجمعه بعود: «والخِلال: الْعُودُ الَّذِي يُتَخَلَّل بِهِ، وَمَا خُلَّ بِهِ الثَّوْبُ أَيضاً» [@lisan، ج11 ص214].'
