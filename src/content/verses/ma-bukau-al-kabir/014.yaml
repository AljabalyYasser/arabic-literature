explained: false
first: وَكَأَنَّ السُّمُوطَ عَكَّفَهَا السِّلْـ
second: ـكُ بِعِطْفَيْ جَيْدَاءَ أُمِّ غَزَالِ
vocabulary:
- term: السُّمُوطَ
  text: 'القلائد: «والسِّمْطُ: الخَيْطُ مَا دَامَ فِيهِ الخَرَزُ» [@lisan، ج7 ص322].'
- term: عَكَّفَهَا السِّلْكُ
  text: 'نظمها الخيط: «وعُكِّفَ النظمُ: نُضِّدَ فِيهِ الجوهرُ»، وفي البيت: «أَي حَبَسها وَلَمْ يَدَعْها تَتَفَرَّقُ» [@lisan، ج9 ص255].'
- term: بِعِطْفَيْ جَيْدَاءَ أُمِّ غَزَالِ
  text: بجانبي عنق ظبية طويلة العنق لها ولد.
