explained: false
first: غَيْرُ مِيلٍ وَلَا عَوَاوِيرَ فِي الْهَيْـ
second: ـجَا وَلَا عُزَّلٍ وَلَا أَكْفَالِ
vocabulary:
- term: مِيلٍ
  text: جمع أَمْيَل، وهو الذي لا يستوي على السرج.
- term: عَوَاوِيرَ
  text: '«والعُوّار أَيضاً: الضَّعِيفُ الْجَبَانُ السَّرِيعُ الْفِرَارِ كالأَعْور، وَجَمْعُهُ عَوَاوِيرُ» [@lisan، ج4 ص616].'
- term: عُزَّلٍ
  text: '«والعُزُل والأَعْزَلُ: الَّذِي لَا سِلاحَ مَعَهُ» [@lisan، ج11 ص442].'
- term: أَكْفَالِ
  text: '«والكِفْل: الَّذِي لَا يُثْبَتُ عَلَى ظُهُورِ الْخَيْلِ» [@lisan، ج11 ص589].'
