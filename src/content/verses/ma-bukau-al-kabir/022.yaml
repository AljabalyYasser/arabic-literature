first: فَوْقَ دَيْمُومَةٍ تَغَوَّلُ بِالسَّفْـ
second: ـرِ قِفَارٍ إِلَّا مِنَ الْآجَالِ
vocabulary:
- term: دَيْمُومَةٍ
  text: 'فلاة لا ماء فيها: «وَالْجَدَّاءُ: الَّتِي لَا مَاءَ بِهَا، وَكَذَلِكَ الدَّيْمُومَةُ» [@lisan، ج3 ص285].'
- term: تَغَوَّلُ بِالسَّفْرِ
  text: 'تتلوّن بالمسافرين فتضلّهم: «والتَّغَوُّل: التَّلَوُّن» [@lisan، ج11 ص507].'
- term: الْآجَالِ
  text: '«والإِجْلُ، بِالْكَسْرِ: الْقَطِيعُ مِنْ بَقْرِ الْوَحْشِ، وَالْجَمْعُ آجَال» [@lisan، ج11 ص11].'
