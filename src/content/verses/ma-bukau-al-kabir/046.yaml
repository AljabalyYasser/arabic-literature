explained: false
first: يَهَبُ الْجِلَّةَ الْجَرَاجِرَ كَالْبُسْـ
second: ـتَانِ تَحْنُو لِدَرْدَقٍ أَطْفَالِ
vocabulary:
- term: الْجِلَّةَ
  text: '«والجِلَّةُ: المَسَانُّ مِنَ الإِبل» [@lisan، ج6 ص131].'
- term: الْجَرَاجِرَ
  text: «الجَراجِرُ والجَراجِبُ الْعِظَامُ مِنَ الإِبل» [@lisan، ج4 ص132].
- term: كَالْبُسْتَانِ
  text: كالنخل في كثرتها، و«البستان النخل» كما يقول المحقق [@diwan-asha، ص45، الحاشية].
- term: لِدَرْدَقٍ
  text: '«والدَّرْدَقُ: صِغَارُ الإِبل وَالنَّاسِ» [@lisan، ج10 ص96].'
