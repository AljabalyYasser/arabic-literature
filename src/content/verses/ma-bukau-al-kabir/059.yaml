first: مُلْبَسَاتٌ مِثْلَ الرَّمَادِ مِنَ الْكُرْ
second: رَةِ مِنْ خَشْيَةِ النَّدَى وَالطِّلَالِ
vocabulary:
- term: مُلْبَسَاتٌ
  text: مغطّاة.
- term: الْكُرَّةِ
  text: «الكُرّة البَعَرُ العَفِنُ تُجْلَى بِهِ الدُّروع» [@lisan، ج5 ص137].
- term: النَّدَى وَالطِّلَالِ
  text: البلل والمطر الخفيف، تُحفظ منهما الدروع لئلا تصدأ.
