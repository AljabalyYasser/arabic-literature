first: فَرْعُ نَبْعٍ يَهْتَزُّ فِي غُصُنِ الْمَجْـ
second: ـدِ غَزِيرُ النَّدَى شَدِيدُ الْمِحَالِ
vocabulary:
- term: فَرْعُ نَبْعٍ
  text: 'غصن من شجرة كريمة الأصل: «النَّبعُ شَجَرُ القِسِيّ» [@lisan، ج1 ص764].'
- term: الْمِحَالِ
  text: 'الكيد والقوة، وفي اللسان في البيت: «أَي شَدِيدُ الْمَكْرِ» [@lisan، ج11 ص619].'
