explained: false
first: لَاحَهُ الصَّيْفُ وَالصِّيَالُ وَإِشْفَا
second: قٌ عَلَى صَعْدَةٍ كَقَوْسِ الضَّالِ
vocabulary:
- term: لَاحَهُ
  text: غيّره وأضمره.
- term: وَالصِّيَالُ
  text: مصاولة الفحول.
- term: وَإِشْفَاقٌ
  text: خوف وحذر.
- term: صَعْدَةٍ
  text: 'أتان طويلة، والصعدة في الأصل «الْقَنَاةُ الْمُسْتَوِيَةُ تَنْبُتُ كَذَلِكَ» [@lisan، ج3 ص255]، ويقول المحقق: «وهي كذلك الأتان الطويلة الظهر، على التشبيه بالقناة المستوية» [@diwan-asha، ص43، الحاشية].'
- term: كَقَوْسِ الضَّالِ
  text: كقوس من شجر الضال، وهو السِّدْر البري.
