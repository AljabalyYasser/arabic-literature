first: وَشُيُوخٍ حَرْبَى بِشَطَّيْ أَرِيكٍ
second: وَنِسَاءٍ كَأَنَّهُنَّ السَّعَالِي
vocabulary:
- term: حَرْبَى
  text: 'شديدو الغضب، من «حَرِبَ الرَّجلُ، بِالْكَسْرِ، يَحْرَبُ حَرَباً: اشْتَدَّ غَضَبُه» [@lisan، ج1 ص304].'
- term: بِشَطَّيْ أَرِيكٍ
  text: بجانبي أريك، وهو موضع.
- term: السَّعَالِي
  text: 'الغيلان، قال أبو حاتم: «يُرِيدُ فِي سُوءَ حَالِهِنَّ حِينَ أُسِرْنَ» [@lisan، ج11 ص336].'
