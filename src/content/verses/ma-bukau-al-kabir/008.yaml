explained: false
first: وَادِّلَاجٍ بَعْدَ الْمَنَامِ وَتَهْجِيـ
second: ـرٍ وَقُفٍّ وَسَبْسَبٍ وَرِمَالِ
vocabulary:
- term: وَادِّلَاجٍ
  text: '«وادَّلَجُوا: سَارُوا اللَّيْلَ كُلَّهُ» [@lisan، ج2 ص272].'
- term: وَتَهْجِيرٍ
  text: سير في الهاجرة، وهي شدة الحر نصف النهار.
- term: وَقُفٍّ
  text: ما ارتفع من الأرض وغلظ.
- term: وَسَبْسَبٍ
  text: '«السَّبْسَبُ: القَفْرُ والمَفازة» [@lisan، ج1 ص460].'
