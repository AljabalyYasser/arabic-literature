first: وَاسْتُحِثَّ الْمُغَيِّرُونَ مِنَ الْقَوْ
second: مِ وَكَانَ النِّطَافُ مَا فِي الْعَزَالِي
vocabulary:
- term: الْمُغَيِّرُونَ
  text: '«والمُغَيِّر: الَّذِي يُغَيِّر عَلَى بَعيره أَداتَه لِيُخَفِّفَ عَنْهُ ويُريحه» [@lisan، ج5 ص40].'
- term: النِّطَافُ
  text: بقايا الماء.
- term: الْعَزَالِي
  text: '«والعَزْلاء: مَصَبُّ الْمَاءِ مِنَ الرَّاوِيَةِ والقِرْبةِ فِي أَسفلها» [@lisan، ج11 ص443].'
