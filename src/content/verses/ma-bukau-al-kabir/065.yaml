first: فَخْمَةً يَلْجَأُ الْمُضَافُ إِلَيْهَا
second: وَرِعَالًا مَوْصُولَةً بِرِعَالِ
vocabulary:
- term: فَخْمَةً
  text: كتيبة ضخمة.
- term: الْمُضَافُ
  text: '«والمُضَاف: المُلْجَأُ المُحْرَجُ المُثْقَلُ بِالشَّرِّ» [@lisan، ج9 ص211].'
- term: وَرِعَالًا
  text: '«والرَّعْلَة: القَطِيع أَو القِطْعة مِنَ الْخَيْلِ لَيْسَتْ بِالْكَثِيرَةِ» [@lisan، ج11 ص286].'
