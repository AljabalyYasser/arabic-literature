- term: عَنْتَرِيسٌ
  text: ناقة صلبة شديدة.
- term: الْمُصَلْصِلِ
  text: 'حمار الوحش الكثير النهيق: «وحِمَارٌ صُلْصُلٌ وصُلاصِلٌ وصَلْصَالٌ ومُصَلْصِلٌ: مُصَوِّت» [@lisan، ج11 ص379].'
- term: الْجَوَّالِ
  text: الكثير التجوال.
