first: "دِمْنَةٌ قَفْرَةٌ تَعَاوَرَهَا الصَّيْـ"
second: "ـفُ بِرِيحَيْنِ مِنْ صَبًا وَشَمَالِ"
meaning: "هي دمنة خالية من أهلها، تتداولها في الصيف ريحان: الصَّبا مرة والشمال مرة، حتى محتا معالمها. فكيف تجيب من يسألها؟"
vocabulary:
  - term: "دِمْنَةٌ"
    text: "أثر الدار: «دِمْنةُ الدَّارِ: أَثَرُها. والدِّمْنة: آثارُ النَّاسِ وَمَا سَوَّدوا» [@lisan، ج13 ص157]."
  - term: "قَفْرَةٌ"
    text: "خالية لا أنيس بها."
  - term: "تَعَاوَرَهَا"
    text: "تداولتها، يقول الأزهري: «وَمَعْنَى تعاوَرت الرياحُ رَسْمَ الدَّارِ أَي تَداوَلَتْه، فمرَّةً تَهُبُّ جَنوباً وَمَرَّةً شَمالًا»، وأنشد البيت [@lisan، ج4 ص619]."
  - term: "صَبًا وَشَمَالِ"
    text: "ريحان: الصَّبا تهب «مِنْ نَاحِيَةِ الْمَشْرِقِ» [@lisan، ج4 ص271]، والشَّمال تهب من جهة الشمال."
syntax:
  - "«دِمْنَةٌ» خبر لمبتدأ محذوف تقديره: هي دمنةٌ، أو تلك دمنةٌ، والضمير للأطلال. و«قَفْرَةٌ» صفة أولى."
  - "«تَعَاوَرَهَا الصَّيْفُ» جملة فعلية في محل رفع صفة ثانية لـ«دِمْنَةٌ»: «تَعَاوَرَ» ماضٍ، والهاء مفعول به، و«الصَّيْفُ» فاعل."
  - "«بِرِيحَيْنِ» متعلق بـ«تَعَاوَرَ»، و«مِنْ صَبًا وَشَمَالِ» في موضع الصفة لـ«رِيحَيْنِ»، و«مِنْ» لبيان الجنس."
morphology:
  - "«تَعَاوَرَ» على «تَفَاعَلَ» من العارية، وهو وزن يدل على التناوب: أن يفعل هذا مرة وذاك مرة."
  - "«صَبًا» اسم مقصور أصله «صَبَو»، نُوّن فحُذفت ألفه لالتقاء الساكنين، وتُكتب ألفه في الأصل ألفًا لأنها عن واو."
  - "«رِيحَيْن» مثنى «رِيح»، وياؤها منقلبة عن واو لسكونها بعد كسرة، وأصلها من «روح»."
rhetoric:
  thesis: "البيت جواب السؤال الذي ختم به المطلع: لا تردّ الدار السؤال لأنها لم تعد دارًا، بل أثرًا تتقاذفه الرياح."
  devices:
    - title: "حذف المبتدأ"
      text: "بدأ البيت بالخبر «دِمْنَةٌ» وحذف المبتدأ، فلم يقل «هي دمنة». ويقرر عبد القاهر الجُرْجانيّ أن هذا الحذف سنّة الشعراء في وصف الديار، فيذكر قول الشاعر «دارٌ لِمَرْوةَ إذْ أَهْلي وأَهلُهُمُ» ويقول: «كأنه قال: تلك دارٌ»، ثم يقول: «وهذه طريقةٌ مستمرَّةٌ لهم إذا ذكروا الديار والمنازل» [@dalail، ص146–147]. والحذف هنا يقدّم صورة الدار نفسها بلا تمهيد، كأن الشاعر يشير إليها."
    - title: "إسناد الفعل إلى الزمان"
      text: "في «تَعَاوَرَهَا الصَّيْفُ» جعل الصيف هو الذي يتداول الدار، والذي يتداولها في الحقيقة ريحاه. وهذا ما يسميه عبد القاهر المجاز في الحكم: «أن يكون التجوز في حكم يجري على الكلمة فقط، وتكون الكلمة متروكة على ظاهرها»، ومثاله عنده: «نهارك صائم وليلك قائم» [@dalail، ص293]. فالصيف مستعمل في معناه، والتجوّز في نسبة الفعل إليه."
    - title: "الطباق"
      text: "«صَبًا وَشَمَالِ» ريحان من جهتين مختلفتين، والطباق: الجمع بين الشيء وما يقابله. فالدار تتقاذفها الجهات حتى لا يبقى لها أثر ثابت."
  connection: "ثم يصرف نفسه عن ذكرى جُبَيْرة: «لَاتَ هَنَّا ذِكْرَى جُبَيْرَةَ»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "دِمْنَتُنْ قَفْ / رَتُنْ تَعَا / وَرَهَصْصَيْ = فاعلاتن / متفع لن / فعلاتن — فُ بِرِيحَيْ / نِ مِنْ صَبَنْ / وَشَمَالِي = فعلاتن / متفع لن / فعلاتن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص98]، «مستفع لن» في الشطرين، والعروضَ والضرب، و«فاعلاتن» الأولى من العجز. والبيت مدوّر: انقسمت كلمة «الصَّيْفُ» بين الشطرين، فـ«الصَّيْـ» آخر الصدر و«ـفُ» أول العجز."
context: "البيت الثاني من الوقفة على الأطلال، وبه تنتهي، ثم يبدأ المقطع الثاني بذكر جُبَيْرة. وفي لسان العرب «دِمْنة قَفْزة، تاوَرها» بالزاي، وهو خطأ في الطبع [@lisan، ج4 ص619]، والصواب «قَفْرَةٌ تَعَاوَرَهَا» كما في الديوان والجمهرة [@diwan-asha، ص39] [@jamhara، ص202]."
