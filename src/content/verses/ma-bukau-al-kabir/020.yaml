first: لَمْ تَعَطَّفْ عَلَى حُوَارٍ وَلَمْ يَقْـ
second: ـطَعْ عُبَيْدٌ عُرُوقَهَا مِنْ خُمَالِ
vocabulary:
- term: حُوَارٍ
  text: ولد الناقة.
- term: عُبَيْدٌ ... مِنْ خُمَالِ
  text: '«والخُمَال: دَاءٌ يأْخذ فِي مَفَاصِلِ الإِنسان وَقَوَائِمِ الْخَيْلِ وَالشَّاءِ والإِبل تَظْلَع مِنْهُ، ويُداوَى بِقَطْعِ العِرْق»، «وعُبَيْدٌ: بَيْطار» [@lisan، ج11 ص222].'
