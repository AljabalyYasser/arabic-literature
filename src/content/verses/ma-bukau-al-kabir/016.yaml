explained: false
first: بَاكَرَتْهَا الْأَغْرَابُ فِي سِنَةِ النَّوْ
second: مِ فَتَجْرِي خِلَالَ شَوْكِ السَّيَالِ
vocabulary:
- term: الْأَغْرَابُ
  text: 'الأقداح: «والغَرْبُ: القَدَح، وَالْجَمْعُ أَغْراب» [@lisan، ج1 ص644].'
- term: فِي سِنَةِ النَّوْمِ
  text: في أول النعاس.
- term: شَوْكِ السَّيَالِ
  text: 'يعني الأسنان، و«السَّيَال، بِالْفَتْحِ: شَجَرٌ لَهُ شَوْكٌ أَبيض» [@lisan، ج11 ص352].'
