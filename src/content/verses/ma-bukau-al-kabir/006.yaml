first: رُبَّ خَرْقٍ مِنْ دُونِهَا يُخْرِسُ السَّفْـ
second: ـرَ وَمِيلٍ يُفْضِي إِلَى أَمْيَالِ
vocabulary:
- term: خَرْقٍ
  text: «والخرق الأَرض الواسعة» [@lisan، ج6 ص138].
- term: يُخْرِسُ السَّفْرَ
  text: يُسكت المسافرين من هوله.
- term: وَمِيلٍ
  text: '«والمِيلُ مِنَ الأَرض: قدْرُ منتهَى مدِّ الْبَصَرِ» [@lisan، ج11 ص639].'
