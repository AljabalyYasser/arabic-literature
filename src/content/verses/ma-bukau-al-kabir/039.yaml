first: عِنْدَهُ الْحَزْمُ وَالتُّقَى وَأَسَا الصَّرْ
second: عِ وَحَمْلٌ لِمُضْلِعِ الْأَثْقَالِ
vocabulary:
- term: الْحَزْمُ
  text: ضبط الأمر.
- term: وَأَسَا الصَّرْعِ
  text: 'ومداواة الصرع. وفي رواية اللسان «وأَسا الشَّقِّ»، قال: «أَرَادَ: وَعِنْدَهُ أَسْوُ الشَّقِّ، فَجَعَلَ الْوَاوَ أَلفاً مَقْصُورَةً» [@lisan، ج14 ص34].'
- term: لِمُضْلِعِ الْأَثْقَالِ
  text: '«وحِمْلٌ مُضْلِعٌ: مُثْقِلٌ للأَضْلاعِ» [@lisan، ج8 ص225].'
