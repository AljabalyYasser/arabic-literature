first: مِنْ سَرَاةِ الْهِجَانِ صَلَّبَهَا الْعُضْـ
second: ـضُ وَرَعْيُ الْحِمَى وَطُولُ الْحِيَالِ
vocabulary:
- term: سَرَاةِ الْهِجَانِ
  text: 'خيار الإبل: «وسَراةُ الْمَالِ: خِياره»، «والهِجانُ: الخِيارُ مِنْ كُلِّ شيءٍ» [@lisan، ج1 ص527].'
- term: الْعُضُّ
  text: '«العُضُّ: عَلَفُ أَهل الأَمصار مِثْلُ القَتِّ وَالنَّوَى» [@lisan، ج7 ص189].'
- term: الْحِيَالِ
  text: ألّا تحمل.
