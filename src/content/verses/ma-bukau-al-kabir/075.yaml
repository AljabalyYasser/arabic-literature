first: "لَنْ تَزَالُوا كَذَلِكُمْ ثُمَّ لَا زِلْـ"
second: "ـتَ لَهُمْ خَالِدًا خُلُودَ الْجِبَالِ"
meaning: "لن تزالوا، أنت وجندك، على هذه الحال من الغلبة والعطاء، ثم أبقاك الله لقومك باقيًا بقاء الجبال."
vocabulary:
  - term: "لَنْ تَزَالُوا"
    text: "لن تبرحوا، أي ستبقون."
  - term: "كَذَلِكُمْ"
    text: "على هذه الحال التي وصفها: نصرًا وغنيمة وعطاء."
  - term: "لَا زِلْتَ"
    text: "دعاء: أدام الله بقاءك."
  - term: "خُلُودَ الْجِبَالِ"
    text: "بقاءً كبقاء الجبال، وهي أثبت ما يرون."
syntax:
  - "«لَنْ» حرف نصب ونفي واستقبال، و«تَزَالُوا» مضارع ناقص منصوب بحذف النون، والواو اسمه. و«كَذَلِكُمْ»: الكاف حرف جر، و«ذَلِكُمْ» اسم إشارة مبني في محل جر، والجار والمجرور في محل نصب خبر «تَزَالُوا»."
  - "«ثُمَّ» حرف عطف. و«لَا» نافية يُراد بها الدعاء، و«زِلْتَ» ماضٍ ناقص، والتاء اسمه، و«خَالِدًا» خبره منصوب، و«لَهُمْ» متعلق بـ«خَالِدًا»."
  - "«خُلُودَ» مفعول مطلق مبيّن للنوع منصوب، و«الْجِبَالِ» مضاف إليه."
morphology:
  - "«زَالَ يَزَالُ» فعل ناقص لا يعمل إلا بعد نفي أو نهي أو دعاء، كما هنا بعد «لَنْ» و«لَا». وهو غير «زَالَ يَزُولُ» التام بمعنى ذهب."
  - "«خُلُود» مصدر «خَلَدَ يَخْلُدُ» على «فُعُول»، و«خَالِد» اسم فاعل منه."
  - "«ذَلِكُمْ»: «ذَا» اسم إشارة، واللام للبعد، والكاف حرف خطاب، والميم علامة الجمع، لأنه يخاطب جماعة."
rhetoric:
  thesis: "خاتمة بالدعاء: بعد أن عدّد كرم الممدوح وحروبه وأسراه، يطلب له البقاء، فتنتهي القصيدة على الثبات بعد أن بدأت بديار لم يبق منها إلا أثر."
  devices:
    - title: "الدعاء بصيغة الخبر"
      text: "«لَا زِلْتَ ... خَالِدًا» ماضٍ يُراد به الدعاء، و«لَنْ تَزَالُوا كَذَلِكُمْ» خبر يُراد به الرجاء. فلا يطلب الشاعر بقاءه طلبًا، بل يقرره كأنه واقع."
    - title: "الالتفات"
      text: "«لَنْ تَزَالُوا» يخاطب جماعة، ثم «لَا زِلْتَ لَهُمْ» يخاطب الممدوح وحده ويجعل قومه غائبين. والالتفات: الانتقال في الكلام من خطاب إلى خطاب أو من خطاب إلى غيبة. وبه يرتفع الممدوح فوق قومه: هم باقون بحاله، وهو باقٍ لهم."
    - title: "التشبيه"
      text: "«خَالِدًا خُلُودَ الْجِبَالِ» شبّه بقاءه ببقاء الجبال، وجاء التشبيه بالمفعول المطلق بلا أداة. ووجه الشبه هنا صفة واحدة ظاهرة هي الثبات والبقاء، فهو تشبيه لا تمثيل على تفريق عبد القاهر الجُرْجانيّ بينهما: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]؛ والتمثيل عنده ما كان وجه الشبه فيه صورة منتزعة من أمور عدة."
    - title: "حسن الخاتمة"
      text: "يقول ابن رَشِيق: «وخاتمة الكلام أبقى في السمع، وألصق بالنفس؛ لقرب العهد بها؛ فإن حسنت حسن، وإن قبحت قبح» [@ibn-rashiq، ج1 ص217]. وقد ختم الأَعْشَى بالدعاء، وهو أنسب ما يُختم به المدح."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "لَنْ تَزَالُو / كَذَالِكُمْ / ثُمْمَ لَا زِلْ = فاعلاتن / متفع لن / فاعلاتن — تَ لَهُمْ خَا / لِدَنْ خُلُو / دَلْجِبَالِي = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص98]، «مستفع لن» في الشطرين، و«فاعلاتن» الأولى من العجز. والعروض والضرب تامّان «فاعلاتن». والبيت مدوّر: «زِلْـ» آخر الصدر و«ـتَ» أول العجز."
context: "آخر القصيدة في الديوان. أما في الجمهرة فرُوي «لَنْ يَزَالُوا»، وليس هو آخرها هناك: بعده فيها أبيات من القصيدة نفسها بترتيب آخر، ثم أبيات ليست في الديوان في الشيب والصبا والصيد والشراب [@jamhara، ص227–235]."
variants:
