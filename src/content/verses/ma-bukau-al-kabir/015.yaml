first: وَكَأَنَّ الْخَمْرَ الْعَتِيقَ مِنَ الْإِسْـ
second: ـفِنْطِ مَمْزُوجَةً بِمَاءٍ زُلَالِ
vocabulary:
- term: الْإِسْفِنْطِ
  text: '«الإِسْفِنْطُ والإِسْفَنْطُ: المُطَيَّبُ مِنْ عَصِيرِ الْعِنَبِ، وَقِيلَ: هُوَ مِنْ أَسماء الْخَمْرِ» [@lisan، ج7 ص255].'
- term: زُلَالِ
  text: عذب صافٍ.
