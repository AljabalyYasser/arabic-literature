explained: false
first: وَلَقَدْ شُبَّتِ الْحُرُوبُ فَمَا غُمْـ
second: ـمِرْتَ فِيهَا إِذْ قَلَّصَتْ عَنْ حِيَالِ
vocabulary:
- term: فَمَا غُمِّرْتَ
  text: 'لم تكن فيها غُمْرًا، و«الغُمْرُ: الجاهلُ» [@lisan، ج1 ص242].'
- term: قَلَّصَتْ عَنْ حِيَالِ
  text: «أَي لَقِحَت بَعْدَ أَن كَانَتْ حَائِلًا» [@lisan، ج7 ص82]، يشبّه الحرب بناقة حملت بعد أن كانت لا تحمل.
