vocabulary:
- term: دَانَ الرِّبَابَ
  text: 'أذلّها: «هُوَ دانَ الربابَ يَعْنِي أَذلها» [@lisan، ج13 ص169]. «والرِّبابُ: أَحْياء ضَبّةَ» [@lisan، ج1 ص403].'
- term: الدِّينَ
  text: الطاعة.
- term: دِرَاكًا
  text: متتابعة.
- term: وَصِيَالِ
  text: ومصاولة.
