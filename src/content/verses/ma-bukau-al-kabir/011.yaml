second: ـصِي إِلَيَّ الْأَمِيرَ ذَا الْأَقْوَالِ
vocabulary:
- term: تَعْصِي إِلَيَّ الْأَمِيرَ ذَا الْأَقْوَالِ
  text: تعصي فيّ من يأمرها، والأمير هنا عند المحقق «صاحب السلطان الذي يملك أن يأمرها وينهاها، يقصد زوجها» [@diwan-asha، ص39، الحاشية].
