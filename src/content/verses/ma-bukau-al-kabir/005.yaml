first: تَرْتَعِي السَّفْحَ فَالْكَثِيبَ فَذَاقَا
second: رٍ فَرَوْضَ الْقَطَا فَذَاتَ الرِّئَالِ
vocabulary:
- term: تَرْتَعِي
  text: ترعى.
- term: السَّفْحَ ... ذَاتَ الرِّئَالِ
  text: 'مواضع ترعى فيها؛ وقال صاحب اللسان في السفح هنا: «هُوَ اسْمُ مَوْضِعٍ بِعَيْنِهِ» [@lisan، ج2 ص486]، و«ذاتُ الرِّئَالِ رَوْضَةٌ» [@lisan، ج11 ص262].'
