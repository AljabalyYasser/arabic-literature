first: وَالْمَكَاكِيكَ وَالصِّحَافَ مِنَ الْفِضْـ
second: ـضَةِ وَالضَّامِزَاتِ تَحْتَ الرِّجَالِ
vocabulary:
- term: وَالْمَكَاكِيكَ
  text: '«والمَكُّوكُ: طاسٌ يُشْرَبُ بِهِ» [@lisan، ج10 ص491].'
- term: وَالصِّحَافَ
  text: القصاع.
- term: وَالضَّامِزَاتِ
  text: 'الإبل الساكنة تحت راكبها لا ترغو: «الناقَةُ الضامزَة الَّتِي لَا تَجْتَرُّ» [@lisan، ج1 ص678].'
