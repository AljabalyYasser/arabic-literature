explained: false
first: وَعَسِيرٍ أَدْمَاءَ حَادِرَةِ الْعَيْـ
second: ـنِ خَنُوفٍ عَيْرَانَةٍ شِمْلَالِ
vocabulary:
- term: وَعَسِيرٍ
  text: 'وناقة صعبة: «والعَسِيرُ مِنِ الإِبل، عِنْدَ الْعَرَبِ: الَّتِي اعْتُسِرت فرُكِبَت وَلَمْ تَكُنْ ذُلِّلَت» [@lisan، ج4 ص566].'
- term: حَادِرَةِ الْعَيْنِ
  text: «وَنَاقَةٌ حادِرَةُ الْعَيْنَيْنِ إِذا امتلأَتا نِقْياً وَاسْتَوَتَا وَحَسُنَتَا» [@lisan، ج4 ص173].
- term: خَنُوفٍ عَيْرَانَةٍ شِمْلَالِ
  text: نشيطة، تشبه العَيْر، وهو حمار الوحش، في صلابتها، سريعة.
