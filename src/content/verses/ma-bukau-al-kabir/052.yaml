first: هَٰؤُلَى ثُمَّ هَٰؤُلَى كُلًّا اعْطَيْـ
second: ـتَ نِعَالًا مَحْذُوَّةً بِمِثَالِ
vocabulary:
- term: هَٰؤُلَى
  text: هؤلاء، بالقصر.
- term: نِعَالًا مَحْذُوَّةً بِمِثَالِ
  text: نعالًا مقطوعة على قدر، أي جزاءً على قدر الجرم. ويقول المحقق إنه «يشير بذلك الى ايقاع الممدوح ببني محارب حين أحمى لهم الأحجار وسيرهم عليها فتساقط لحم أقدامهم» [@diwan-asha، ص47، الحاشية].
