explained: false
first: تَقْطَعُ الْأَمْعَزَ الْمُكَوْكِبَ وَخْدًا
second: بِنَوَاجٍ سَرِيعَةِ الْإِيغَالِ
vocabulary:
- term: الْأَمْعَزَ
  text: '«والأَمْعَزُ والمَعْزاءُ: الأَرض الحَزْنَةُ الغليظةُ ذَاتُ الْحِجَارَةِ» [@lisan، ج5 ص411].'
- term: الْمُكَوْكِبَ
  text: '«وَيُقَالُ للأَمْعَزِ إِذا توَقَّدَ حَصاه ضَحاءً: مُكَوْكِبٌ» [@lisan، ج1 ص721].'
- term: وَخْدًا
  text: '«الوَخْدُ: ضَرْبٌ مِنْ سَيْرِ الإِبل، وَهُوَ سَعَةُ الخَطْو فِي الْمَشْيِ» [@lisan، ج3 ص453].'
- term: بِنَوَاجٍ
  text: «أَي بقوائمَ سِراعٍ» [@lisan، ج15 ص306].
- term: الْإِيغَالِ
  text: '«والإِيغالُ: السَّير السريعُ» [@lisan، ج11 ص733].'
