first: "مَا بُكَاءُ الْكَبِيرِ بِالْأَطْلَالِ"
second: "وَسُؤَالِي فَهَلْ تَرُدُّ سُؤَالِي"
meaning: "ما بال شيخ كبير يبكي على آثار الديار ويسألها عن أهلها؟ وهل تجيب الأطلال من يسألها؟ يلوم نفسه على الوقوف وقد كبر، ويقرر أن الديار لا تردّ جوابًا. وكذلك يلخّص المحقق البيتين الأولين: «فيم وقوف الرجل الكبير يبكي ويتساءل بالأطلال»، «وهو يعلم أن الدمنة القفرة التي تعبث بها رياح الصيف لا ترد السؤال» [@diwan-asha، ص38]."
vocabulary:
  - term: "بُكَاءُ"
    text: "مصدر «بكى يبكي»."
  - term: "الْكَبِيرِ"
    text: "الشيخ الذي كبرت سنّه، يعني نفسه."
  - term: "بِالْأَطْلَالِ"
    text: "عند الأطلال، وهي آثار الديار الباقية: «والطَّلَل: مَا شَخَص مِنْ آثَارِ الدِّيَارِ، والرَّسْمُ مَا كَانَ لاصِقاً بالأَرض» [@lisan، ج11 ص406]."
  - term: "تَرُدُّ سُؤَالِي"
    text: "تجيب عنه."
syntax:
  - "«مَا» اسم استفهام مبني في محل رفع مبتدأ، و«بُكَاءُ» خبره، وهو مضاف و«الْكَبِيرِ» مضاف إليه، من إضافة المصدر إلى فاعله. و«بِالْأَطْلَالِ» متعلق بالمصدر «بُكَاءُ»، والباء بمعنى «عند»."
  - "«وَسُؤَالِي» معطوف على «بُكَاءُ» مرفوع بضمة مقدرة على ما قبل ياء المتكلم، والياء في المعنى فاعل المصدر: أي سؤالي إياها."
  - "«فَهَلْ تَرُدُّ سُؤَالِي»: الفاء تعطف ما بعدها على ما قبلها وتفرّعه عليه، و«هَلْ» حرف استفهام معناه هنا النفي، و«تَرُدُّ» مضارع مرفوع فاعله ضمير مستتر يعود على الأطلال، و«سُؤَالِي» مفعول به."
morphology:
  - "«بُكَاء» مصدر على «فُعَال»، وهو وزن يكثر في الأصوات كالصُّراخ والدُّعاء، ومثله «سُؤَال» من «سأل»."
  - "«الْكَبِير» صفة مشبهة على «فَعِيل» من «كَبِرَ» إذا أسنّ."
  - "«الْأَطْلَال» جمع «طَلَل» على «أَفْعَال»، ويُجمع أيضًا على «طُلُول»."
rhetoric:
  thesis: "مطلع يقف على الأطلال كما يقف الشعراء قبله، لكنه وقوف شيخ يلوم نفسه: يسأل الديار، ثم يعلم أنها لا تجيب. فالبيت يبدأ بالسؤال وينتهي بالسؤال نفسه، كأن الصوت يرتد إلى صاحبه."
  devices:
    - title: "الاستفهام للتعجب والإنكار"
      text: "«مَا بُكَاءُ الْكَبِيرِ» لا ينتظر جوابًا، بل يتعجب من بكاء شيخ على الديار وينكره على نفسه. و«فَهَلْ تَرُدُّ سُؤَالِي» استفهام معناه النفي: إنها لا تردّ. وهو أبلغ من النفي الصريح لأنه يترك السامع يجيب."
    - title: "الحديث عن النفس بلفظ الغائب"
      text: "«الْكَبِيرِ» هو الشاعر نفسه، لكنه يذكره بصفته لا بضمير المتكلم، كأنه رجل آخر يراه من بعيد؛ فيصير اللوم لومًا لسنّه: ما يحسن هذا بمن كبر."
    - title: "ردّ العجز على الصدر"
      text: "ختم البيت بـ«سُؤَالِي» وهي الكلمة التي بدأ بها عجزه «وَسُؤَالِي». وهذا ما يسميه ابن رَشِيق التصدير، وهو عنده «أن يرد أعجاز الكلام على صدوره، فيدل بعضه على بعض» [@ibn-rashiq، ج2 ص3]. والعجز: الشطر الثاني، والصدر: الشطر الأول. وتكرار الكلمة هنا يجعل السؤال يرجع بلا جواب."
    - title: "التصريع"
      text: "ختم الصدر بـ«بِالْأَطْلَالِ» على قافية العجز «سُؤَالِي». والتصريع عند ابن رَشِيق «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. والعروض آخر تفعيلة في الصدر، والضرب آخر تفعيلة في العجز."
  connection: "ثم يصف الدار التي يسألها: دمنة قفرة تتداولها رياح الصيف."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "مَا بُكَاءُلْ / كَبِيرِ بِلْ / أَطْلَالِي = فاعلاتن / متفع لن / فالاتن — وَسُؤَالِي / فَهَلْ تَرُدْ / دُ سُؤَالِي = فعلاتن / متفع لن / فعلاتن"
  note: "وزن الخفيف «فاعلاتن مستفع لن فاعلاتن» في كل شطر [@atiq، ص98]. ودخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفع لن» في الشطرين فصارت «متفع لن»، و«فاعلاتن» الأولى والأخيرة من العجز فصارت «فعلاتن». ودخل العروضَ التشعيثُ، وهو «حذف العين من فاعلاتن» فتصير «فالاتن» [@atiq، ص98]، وأكثر ما يكون في الضرب، «ويقل في غيرها» [@atiq، ص99]. والبيت مصرّع."
context: "مطلع القصيدة. والوقوف على الديار سنّة القصيدة قبله، ويعلّلها ابن رَشِيق بأنهم «كانوا قديما أصحاب خيام: ينتقلون من موضع إلى آخر؛ فلذلك أول ما تبدأ أشعارهم بذكر الديار» [@ibn-rashiq، ج1 ص226]. ويقول في المطالع: «فإن الشعر قفل أوله مفتاحه، وينبغي للشاعر أن يجود ابتداء شعره؛ فإنه أول ما يقرع السمع» [@ibn-rashiq، ج1 ص218]. وأنشد ابن قُتَيْبة صدر هذا البيت حين ذكر مدح الأَعْشَى للأَسْوَد بن المُنْذِر [@ibn-qutayba، ج1 ص251–252]. وعنوانها في الديوان: «قال الأعشى يمدح الأسود بن المنذر اللخمي» [@diwan-asha، ص39]."
variants:
  - reading: "وَسُؤَالِي وَمَا تَرُدُّ سُؤَالِي"
    status: "رواية الجمهرة"
    note: "[@jamhara، ص202]. والنفي فيها صريح بـ«ما»، وفي الديوان بالاستفهام."
