explained: false
first: لَاتَ هَنَّا ذِكْرَى جُبَيْرَةَ أَوْ مَنْ
second: جَاءَ مِنْهَا بِطَائِفِ الْأَهْوَالِ
vocabulary:
- term: لَاتَ هَنَّا
  text: 'ليس هذا حين ذلك ولا موضعه: «فلاتَ هَنَّتْ أَي لَيْسَ ذَا موضعَ ذَلِكَ وَلَا حِينَه» [@lisan، ج15 ص484].'
- term: جُبَيْرَةَ
  text: اسم امرأة.
- term: بِطَائِفِ الْأَهْوَالِ
  text: 'بطيفها وما يجلبه من الأهوال، قال الفراء: «الطَّائِفُ والطَّيْف سَوَاءٌ، وَهُوَ مَا كَانَ كالخَيال وَالشَّيْءُ يُلِمّ بِكَ» [@lisan، ج9 ص225].'
