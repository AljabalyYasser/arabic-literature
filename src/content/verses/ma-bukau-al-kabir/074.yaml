first: قَسَمَا الطَّارِفَ التَّلِيدَ مِنَ الْغُنْـ
second: ـمِ فَآبَا كِلَاهُمَا ذُو مَالِ
vocabulary:
- term: الطَّارِفَ التَّلِيدَ
  text: 'المال القديم صار عندهما جديدًا: «والطَّرِيفُ والطَّارِفُ مِنَ الْمَالِ: المُسْتَحْدثُ، وَهُوَ خِلافُ التَّالِد والتَّلِيدِ» [@lisan، ج9 ص214].'
- term: فَآبَا
  text: فرجعا.
