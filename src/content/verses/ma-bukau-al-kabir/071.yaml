first: "رُبَّ رِفْدٍ هَرَقْتَهُ ذَلِكَ الْيَوْ"
second: "مَ وَأَسْرَى مِنْ مَعْشَرٍ أَقْتَالِ"
meaning: "كم من قدح ضخم أرقته ذلك اليوم، وكم من أسرى أخذتهم من قوم أعداء. ويرى المحقق أن إراقة الرِّفْد كناية عن الموت: «الرفد القدح الضخم، يكنى باراقة الرفد عن الموت» [@diwan-asha، ص49، الحاشية]، فالمعنى: كم من رجل قتلته، وكم من أسير أخذته."
vocabulary:
  - term: "رِفْدٍ"
    text: "قدح ضخم: «عَنِ الرِّفْدِ، وَهُوَ القَدَح الضَّخْمُ» [@lisan، ج13 ص433]."
  - term: "هَرَقْتَهُ"
    text: "أرقته وصببته."
  - term: "ذَلِكَ الْيَوْمَ"
    text: "يوم غارته الذي يصفه في الأبيات السابقة."
  - term: "مَعْشَرٍ"
    text: "جماعة وقوم."
  - term: "أَقْتَالِ"
    text: "أعداء: «الأَقْتَال: الأَعداء، وَاحِدُهُمْ قِتْل وَهُمُ الأَقْران» [@lisan، ج11 ص551]. ويفسرهم المحقق بأنهم «أصحاب ترات» [@diwan-asha، ص49، الحاشية]، أي أصحاب دماء وثأر."
syntax:
  - "«رُبَّ» حرف جر شبيه بالزائد، و«رِفْدٍ» مجرور لفظًا مرفوع محلًّا على الابتداء، وجملة «هَرَقْتَهُ» في محل جر صفة له، والخبر محذوف أو الجملة هي الخبر."
  - "«ذَلِكَ» اسم إشارة مبني في محل نصب، و«الْيَوْمَ» بدل منه منصوب، والظرف متعلق بـ«هَرَقْتَهُ»."
  - "«وَأَسْرَى» معطوف على «رِفْدٍ»، فهو مجرور بـ«رُبَّ» تقديرًا، وعلامة جره الفتحة المقدرة لأنه اسم مقصور ممنوع من الصرف. و«مِنْ مَعْشَرٍ» في موضع الصفة لـ«أَسْرَى»، و«أَقْتَالِ» صفة لـ«مَعْشَرٍ»."
morphology:
  - "«هَرَقْتَ» من «هَرَاقَ يُهَرِيقُ» بمعنى «أَرَاقَ»، والهاء فيه بدل من همزة «أَفْعَلَ»."
  - "«أَسْرَى» جمع «أَسِير» على «فَعْلَى»، وهو جمع يكثر فيما أصاب صاحبه مكروه، كقتيل وقتلى وجريح وجرحى."
  - "«أَقْتَال» جمع «قِتْل» على «أَفْعَال»."
rhetoric:
  thesis: "بيت يجمع حصاد الغارة في سطر: دماء أُريقت وأسرى سيقوا. وهو أول بيت في الخاتمة التي تعدّ غنائم يومه قبل الدعاء له."
  devices:
    - title: "الكناية"
      text: "«رِفْدٍ هَرَقْتَهُ» على قول المحقق كناية عن القتل: لا يذكر الموت، بل قدحًا يُراق ما فيه، فتصير الحياة شرابًا يُسكب. والكناية أن تريد معنى فتذكر ما يلزمه ويدل عليه. ويحتمل في قراءتنا أن يكون الرفد عطاء القوم ورزقهم، أراقه الممدوح بالغارة عليهم."
    - title: "«رُبَّ» للتكثير"
      text: "«رُبَّ» أصلها للتقليل، ومجيئها في الفخر والمدح يكون للتكثير؛ فالمعنى: ما أكثر ما أرقت، وما أكثر من أسرت."
    - title: "الإشارة إلى المعهود"
      text: "«ذَلِكَ الْيَوْمَ» يشير إلى يوم لا يسميه، كأنه معروف لا يحتاج إلى اسم، فيعظم بالإشارة."
  connection: "ثم يمضي في تعداد ما أصاب: «وَشُيُوخٍ حَرْبَى بِشَطَّيْ أَرِيكٍ وَنِسَاءٍ كَأَنَّهُنَّ السَّعَالِي»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "رُبْبَ رِفْدِنْ / هَرَقْتَهُو / ذَالِكَلْيَوْ = فاعلاتن / متفع لن / فاعلاتن — مَ وَأَسْرَى / مِنْ مَعْشَرِنْ / أَقْتَالِي = فعلاتن / مستفع لن / فالاتن"
  note: "أُشبعت هاء «هَرَقْتَهُ» فنُطقت «هَرَقْتَهُو». ودخل الخَبْن «مستفع لن» في الصدر و«فاعلاتن» الأولى من العجز، والخبن حذف الثاني الساكن. ودخل الضربَ التشعيثُ، وهو «حذف العين من فاعلاتن» فتصير «فالاتن» [@atiq، ص98]، وأكثر ما يحدث في «تفعيلة الضرب» [@atiq، ص99]. والبيت مدوّر: «الْيَوْ» آخر الصدر و«مَ» أول العجز."
context: "هذا البيت أصرح ما في القصيدة بذكر الأسرى، وقد مدحه قبل بـ«فَكُّ الْأَسْرَى مِنَ الْأَغْلَالِ» (40). فإذا صحّ ما يذكره المحقق من أن الأَعْشَى أنشده القصيدة يسأله أسرى قومه [@diwan-asha، ص38]، فالبيتان يجتمعان في قراءتنا على الطلب دون تصريح: يذكر أسراه، ويذكر أنه يفك الأسرى."
variants:
  - reading: "رُبَّ رِفْدٍ هَرَقْتَهُ ذَلِكَ الْيَوْمَ وَأَسْرَى مِنْ مَعْشَرٍ ضُلَّالِ"
    status: "رواية الجمهرة"
    note: "[@jamhara، ص226]. «ضُلَّال» مكان «أَقْتَال»، فيصف الأسرى بالضلال لا بالعداوة."
