first: فَاذْهَبِي مَا إِلَيْكِ أَدْرَكَنِي الْحِلْـ
second: ـمُ عَدَانِي عَنْ ذِكْرِكُمْ أَشْغَالِي
vocabulary:
- term: فَاذْهَبِي مَا إِلَيْكِ
  text: 'اشتغلي بنفسك: «وَإِذَا قَالُوا: اذْهَبْ إلَيْكَ، فَمَعْنَاهُ اشْتَغِلْ بنَفْسك وأَقْبِلْ عَلَيْهَا» [@lisan، ج15 ص435].'
- term: الْحِلْمُ
  text: الأناة والعقل.
- term: عَدَانِي
  text: صرفني.
