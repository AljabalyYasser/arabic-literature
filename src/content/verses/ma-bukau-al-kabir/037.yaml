first: "لَا تَشَكَّيْ إِلَيَّ وَانْتَجِعِي الْأَسْـ"
second: "ـوَدَ أَهْلَ النَّدَى وَأَهْلَ الْفَعَالِ"
meaning: "يقول لناقته التي أضناها السفر: لا تشكي إليّ تعبك، واقصدي الأَسْوَد بن المُنْذِر، فهو أهل الكرم وأهل الفعل الحسن، وعنده ينتهي تعبك."
vocabulary:
  - term: "لَا تَشَكَّيْ"
    text: "لا تتشكّي، يخاطب ناقته، وقد قال قبل: «وَتَرَاهَا تَشْكُو إِلَيَّ» (33)."
  - term: "وَانْتَجِعِي"
    text: "واقصدي طالبةً الخير. وأصل الانتجاع طلب المرعى: «التَّنَجُّعُ والانْتِجاعُ والنُّجْعة: طَلبُ الكلإِ ومَساقِطِ الغَيْثِ»، ثم قيل: «وانْتَجَعْنا فُلَانًا إِذا أَتيناه نطلُبُ مَعْرُوفه» [@lisan، ج8 ص347]."
  - term: "الْأَسْوَدَ"
    text: "الأَسْوَد بن المُنْذِر اللَّخْميّ، أخو النُّعْمان ملك الحِيرة، وهو الممدوح [@diwan-asha، ص38]."
  - term: "النَّدَى"
    text: "الكرم والجود."
  - term: "الْفَعَالِ"
    text: "الفعل الحسن، و«الفَعال، بِالْفَتْحِ: الْكَرَمُ» [@lisan، ج11 ص528]."
syntax:
  - "«لَا» ناهية، و«تَشَكَّيْ» مضارع مجزوم بها وعلامة جزمه حذف النون، وياء المخاطبة فاعل. و«إِلَيَّ» جار ومجرور متعلق به."
  - "«وَانْتَجِعِي» الواو عاطفة، و«انْتَجِعِي» فعل أمر مبني على حذف النون، والياء فاعل، و«الْأَسْوَدَ» مفعول به."
  - "«أَهْلَ النَّدَى» بدل من «الْأَسْوَدَ» منصوب، أو منصوب على المدح بفعل محذوف تقديره: أمدح أهلَ الندى. و«وَأَهْلَ الْفَعَالِ» معطوف عليه."
morphology:
  - "«تَشَكَّيْ» أصله «تَتَشَكَّيْنَ» على «تَتَفَعَّلِينَ»، حُذفت إحدى التاءين تخفيفًا، وحُذفت النون للجزم."
  - "«انْتَجِعِي» أمر من «انْتَجَعَ» على «افْتَعَلَ» من «نَجَعَ»، والمصدر الانتجاع."
  - "«الْفَعَال» بفتح الفاء اسم للفعل الحسن، أما «الفِعال» بالكسر فجمع «فِعْل»."
rhetoric:
  thesis: "بيت التخلص: به يخرج الشاعر من وصف الرحلة إلى المدح، فالناقة التي شكت التعب في الأبيات السابقة يوجّهها إلى الممدوح، فيصير تعب الطريق ثمنًا يستحق به العطاء."
  devices:
    - title: "التخلص"
      text: "«وَانْتَجِعِي الْأَسْوَدَ» هي اللحظة التي يدخل فيها المدح. يقول ابن رَشِيق: «والعادة أن يذكر الشاعر ما قطع من المفاوز، وما أنضى من الركاب، وما تجشم من هول الليل وسهره، وطول النهار وهجيره، وقلة الماء وغؤوره، ثم يخرج إلى مدح المقصود؛ ليوجب عليه حق القصد، وذمام القاصد، ويستحق منه المكافأة» [@ibn-rashiq، ج1 ص226]. والخروج عنده «أن تخرج من نسيب إلى مدح أو غيره بلطف تحيل، ثم تتمادى فيما خرجت إليه» [@ibn-rashiq، ج1 ص234]، «ومن الناس من يسمي الخروج تخلصا وتوسلا» [@ibn-rashiq، ج1 ص236]. وقد صنع الأَعْشَى ذلك كله: ذكر الفلوات والناقة المتعبة، ثم خرج إلى الأَسْوَد ومضى في مدحه إلى آخر القصيدة."
    - title: "التكرار"
      text: "«لَا تَشَكَّيْ إِلَيَّ» بدأ بها البيت السابق «لَا تَشَكَّيْ إِلَيَّ مِنْ أَلَمِ النِّسْعِ»، ثم أعادها هنا. ففي الأولى ينهاها عن الشكوى من ألمها، وفي الثانية يجعل النهي نفسه بابًا إلى الممدوح: لا تشكي، فأمامك من ينهي تعبك."
    - title: "الاستعارة"
      text: "«انْتَجِعِي» أصلها طلب الكلأ ومساقط الغيث، فاستعارها لطلب معروف الممدوح، فصار الأَسْوَد كالأرض الممطرة تقصدها الإبل. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. وقد كثر هذا الاستعمال حتى ذكره صاحب اللسان معنى من معاني الكلمة [@lisan، ج8 ص347]."
    - title: "مخاطبة الناقة"
      text: "«لَا تَشَكَّيْ ... وَانْتَجِعِي» يخاطب الناقة كما يخاطب إنسانًا يشكو إليه، فيجعل لها لسانًا وشكوى، ويجيبها بالوعد."
  connection: "ثم يصف الأَسْوَد: «فَرْعُ نَبْعٍ يَهْتَزُّ فِي غُصُنِ الْمَجْدِ»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "لَا تَشَكْكَيْ / إِلَيْيَ وَنْ / تَجِعِلْأَسْ = فاعلاتن / متفع لن / فعلاتن — وَدَ أَهْلَنْ / نَدَى وَأَهْ / لَلْفَعَالِي = فعلاتن / متفع لن / فاعلاتن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص98]، «مستفع لن» في الشطرين، والعروضَ، و«فاعلاتن» الأولى من العجز، وجاء الضرب تامًّا «فاعلاتن». والبيت مدوّر: «الْأَسْـ» آخر الصدر و«ـوَدَ» أول العجز."
context: "البيت 37 هو الحد بين قسمي القصيدة: قبله الأطلال وجُبَيْرة والناقة (1–36)، وبعده المدح (37–75). وعلى صيغته جاء بعده قول ذي الرُّمَّة الذي أنشده صاحب اللسان شاهدًا على هذا المعنى: «فقلتُ لصَيْدَحَ: انْتَجِعِي بِلالا» [@lisan، ج8 ص347]."
variants:
  - reading: "لَا تَشَكَّيْ إِلَيَّ وَانْتَجِعِي الْأَسْوَدَ أَهْلَ النَّدَى شَدِيدُ الْمِحَالِ"
    status: "رواية الجمهرة"
    note: "[@jamhara، ص217]. وفيها «شديد المحال» مكان «وأهل الفعال»، وهي عجز البيت التالي في الديوان: «غَزِيرُ النَّدَى شَدِيدُ الْمِحَالِ»."
