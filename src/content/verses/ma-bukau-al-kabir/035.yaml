explained: false
first: أَثَّرَتْ فِي جَنَاجِنٍ كَإِرَانِ الْـ
second: ـمَيْتِ عُولِينَ فَوْقَ عُوجٍ رِسَالِ
vocabulary:
- term: جَنَاجِنٍ
  text: '«والجَناجِنُ: عِظامُ الصَّدْرِ» [@lisan، ج13 ص100].'
- term: كَإِرَانِ الْمَيْتِ
  text: 'كالنعش: «الإِرانُ خشبٌ يُشدُّ بَعْضُهُ إِلَى بَعْضٍ تُحْمَل فِيهِ الْمَوْتَى» [@lisan، ج13 ص14].'
- term: عُولِينَ
  text: رُفعن.
- term: عُوجٍ رِسَالِ
  text: 'قوائم معوجّة طوال: «أَي قَوَائِمُ طِوال» [@lisan، ج11 ص283].'
