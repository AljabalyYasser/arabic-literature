first: "أَنْتَ خَيْرٌ مِنْ أَلْفِ أَلْفٍ مِنَ الْقَوْ"
second: "مِ إِذَا مَا كَبَتْ وُجُوهُ الرِّجَالِ"
meaning: "أنت خير من ألف ألف رجل، حين تتغير وجوه الرجال من الفزع في ساعة الشدة: فضلك يظهر حين يضعف غيرك."
vocabulary:
  - term: "أَلْفِ أَلْفٍ"
    text: "ألف مضروب في ألف، يريد الكثرة التي لا تُحصى."
  - term: "الْقَوْمِ"
    text: "الرجال."
  - term: "كَبَتْ"
    text: "تغيّرت: «وكَبَا لونُه: كَمَد. وكَبَا وجهُه: تَغيّر» [@lisan، ج15 ص215]. وأصل الكَبْو السقوط على الوجه: «كَبا لوَجْهِهِ يَكْبُو كَبْواً سَقَطَ» [@lisan، ج15 ص213]. ويقول المحقق: «كبا الوجه تغير لونه من الفزع» [@diwan-asha، ص47، الحاشية]."
syntax:
  - "«أَنْتَ» ضمير منفصل مبني في محل رفع مبتدأ، و«خَيْرٌ» خبره، و«مِنْ أَلْفِ» متعلق به، و«أَلْفٍ» الثانية مضاف إليه، و«مِنَ الْقَوْمِ» في موضع الصفة للعدد."
  - "«إِذَا» ظرف لما يستقبل من الزمان فيه معنى الشرط، و«مَا» زائدة للتوكيد، وجملة «كَبَتْ وُجُوهُ الرِّجَالِ» في محل جر بإضافة «إِذَا» إليها: «كَبَتْ» ماضٍ، و«وُجُوهُ» فاعله، و«الرِّجَالِ» مضاف إليه."
  - "جواب «إِذَا» محذوف يدل عليه صدر البيت، والتقدير: إذا كبت وجوه الرجال فأنت خير من ألف ألف."
morphology:
  - "«خَيْر» اسم تفضيل أصله «أَخْيَر»، حُذفت همزته لكثرة الاستعمال، ومثله «شَرّ»."
  - "«كَبَتْ» ماضٍ من «كَبَا يَكْبُو» الناقص الواوي، حُذفت ألفه لالتقائها ساكنةً بتاء التأنيث الساكنة."
  - "«وُجُوه» جمع «وَجْه» على «فُعُول»، و«الرِّجَال» جمع «رَجُل» على «فِعَال»."
rhetoric:
  thesis: "بيت المدح الأشهر في القصيدة: يقيس الممدوح بالعدد، ثم يقيّد التفضيل بساعة الشدة، فيصير الثناء ثناءً على ثباته حين يضطرب غيره."
  devices:
    - title: "المبالغة"
      text: "«خَيْرٌ مِنْ أَلْفِ أَلْفٍ» عدد لا يُراد حقيقته بل الكثرة. والمبالغة عند ابن رَشِيق باب «الناس فيها مختلفون: منهم من يؤثرها، ويقول بتفضيلها، ويراها الغاية القصوى في الجودة» [@ibn-rashiq، ج2 ص53]. والأَعْشَى يقيّدها بقوله «إِذَا مَا كَبَتْ وُجُوهُ الرِّجَالِ»: فلا يجعله خيرًا منهم في كل حال، بل في الحال التي يُمتحن فيها الرجال، فيقرّب المبالغة من التصديق."
    - title: "الكناية"
      text: "«كَبَتْ وُجُوهُ الرِّجَالِ» كناية عن الفزع والهزيمة: لا يذكر الخوف نفسه، بل أثره في الوجوه. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. فتغيّر الوجه تابع للخوف، فذكره ودلّ به عليه."
    - title: "تأخير الشرط"
      text: "قدّم الحكم «أَنْتَ خَيْرٌ» وأخّر شرطه «إِذَا مَا كَبَتْ»، فيسمع السامع التفضيل مطلقًا أولًا، ثم يأتي القيد فيزيده قوة: إنما يُعرف فضله حيث يسقط غيره."
  connection: "ثم يذكر عُدّته التي يأبى بها أن يحتكم عليه أحد: «وَلِمِثْلِ الَّذِي جَمَعْتَ مِنَ الْعُدَّةِ تَأْبَى حُكُومَةَ الْمُقْتَالِ»."
prosody:
  meter: "البحر الخفيف"
  rhyme: "الرَّوِيّ اللام المكسورة"
  scansion: "أَنْتَ خَيْرُنْ / مِنْ أَلْفِ أَلْ / فِنْ مِنَلْقَوْ = فاعلاتن / مستفع لن / فاعلاتن — مِ إِذَا مَا / كَبَتْ وُجُو / هُرْرِجَالِي = فعلاتن / متفع لن / فاعلاتن"
  note: "جاءت «مستفع لن» في الصدر تامة، وفي العجز مخبونة «متفع لن»، ودخل الخبن «فاعلاتن» الأولى من العجز. والخَبْن حذف الثاني الساكن [@atiq، ص98]. والعروض والضرب تامّان «فاعلاتن». والبيت مدوّر: «الْقَوْ» آخر الصدر و«مِ» أول العجز."
context: "هذا البيت وصدر المطلع كل ما أنشده ابن قُتَيْبة من القصيدة، قال: «وكان يفد أيضا على ملوك الحيرة، ويمدح الأسود بن المنذر، أخا النعمان، وفيه يقول فى قصيدته»، ثم أنشد [@ibn-qutayba، ج1 ص251–252]. فهو عنده عنوان مدحه للأَسْوَد. وقال محققه أحمد شاكر في الحاشية إن المطلع «صدر قصيدة عالية رائعة ٩٧ بيتا، جعلها صاحب جمهرة أشعار العرب معلقة الأعشى» [@ibn-qutayba، ج1 ص252، الحاشية]."
variants:
  - reading: "أَنْتَ خَيْرٌ مِنْ أَلْفِ أَلْفٍ مِنَ النَّاسِ إِذَا مَا كَبَتْ وُجُوهُ الرِّجَالِ"
    status: "رواية ابن قُتَيْبة"
    note: "[@ibn-qutayba، ج1 ص252]. وفي المطبوع منه «إذ ما» مكان «إذا ما»، ولا يستقيم بها الوزن. وفي الجمهرة كرواية الديوان [@jamhara، ص221]."
