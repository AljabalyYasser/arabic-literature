first: مُلْمِعٍ لَاعَةِ الْفُؤَادِ إِلَى جَحْـ
second: ـشٍ فَلَاهُ عَنْهَا فَبِئْسَ الْفَالِي
vocabulary:
- term: مُلْمِعٍ
  text: أتان استبان حملها في ضرعها.
- term: لَاعَةِ الْفُؤَادِ
  text: '«يُقَالُ: أَتانٌ لاعةُ الفُؤادِ إِلى جَحْشِها، قَالَ الأَصمعي: أَي لائعةُ الفواد، وَهِيَ الَّتِي كأَنها وَلْهى مِنَ الفَزَعِ» [@lisan، ج8 ص328].'
- term: فَلَاهُ
  text: فطمه.
