first: وَالْبَغَايَا يَرْكُضْنَ أَكْسِيَةَ الْإِضْـ
second: ـرِيجِ وَالشَّرْعَبِيَّ ذَا الْأَذْيَالِ
vocabulary:
- term: وَالْبَغَايَا
  text: 'الإماء: «وَقَالَ أَبو عُبَيْدٍ: البَغَايا الإِماءُ»، وفي البيت: «أَراد: ويَهَبُ البَغَايَا لأَن الْحُرَّةَ لَا تُوهَبُ» [@lisan، ج14 ص77].'
- term: يَرْكُضْنَ
  text: يضربن بأرجلهن أذيال ثيابهن في مشيهن.
- term: الْإِضْرِيجِ
  text: 'ثوب من خزّ مصبوغ: «وإِضْرِيج: مُتَضَرِّج بِالْحُمْرَةِ أَو الصُّفرة»، «وَقِيلَ: لَا يَكُونُ الإِضْريجُ إِلَّا مِنْ خَزٍّ» [@lisan، ج2 ص313].'
- term: وَالشَّرْعَبِيَّ
  text: ضرب من الثياب.
