explained: false
first: ظَبْيَةٌ مِنْ ظِبَاءِ وَجْرَةَ أَدْمَا
second: ءُ تَسَفُّ الْكَبَاثَ تَحْتَ الْهَدَالِ
vocabulary:
- term: وَجْرَةَ
  text: موضع تكثر فيه الظباء.
- term: أَدْمَاءُ
  text: «والأُدْمُ مِنَ الظِّباء بيضٌ تَعْلوهُنّ جُدَدٌ فيهنَّ غُبْرة» [@lisan، ج12 ص11].
- term: تَسَفُّ الْكَبَاثَ
  text: 'تأكل ثمر الأراك: «الكَبَاثُ، بِالْفَتْحِ: نضيجُ ثَمَرِ الأَراك» [@lisan، ج2 ص178].'
- term: الْهَدَالِ
  text: '«والهَدال: مَا تَهَدَّل مِنَ الأَغصان» [@lisan، ج11 ص692].'
