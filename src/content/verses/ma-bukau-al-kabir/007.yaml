explained: false
first: وَسِقَاءٍ يُوكَى عَلَى تَأَقِ الْمَلْـ
second: ـءِ وَسَيْرٍ وَمُسْتَقَى أَوْشَالِ
vocabulary:
- term: يُوكَى
  text: 'يُشدّ رأسه بالوِكاء: «يُقَالُ: أَوْكَيْتُ السِّقاء أُوكيه إِيكاء، فَهُوَ مُوكًى» [@lisan، ج15 ص406].'
- term: تَأَقِ الْمَلْءِ
  text: 'شدة الامتلاء: «والتأَق: الامْتِلاء» [@lisan، ج10 ص32].'
- term: أَوْشَالِ
  text: '«الوَشَل، بِالتَّحْرِيكِ: الماءُ الْقَلِيلُ يَتَحَلَّب مِنْ جَبَلٍ أَو صخْرة» [@lisan، ج11 ص725].'
