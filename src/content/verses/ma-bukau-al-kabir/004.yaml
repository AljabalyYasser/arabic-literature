first: حَلَّ أَهْلِي بَطْنَ الْغَمِيسِ فَبَادَوْ
second: لَى وَحَلَّتْ عُلْوِيَّةً بِالسِّخَالِ
vocabulary:
- term: بَطْنَ الْغَمِيسِ فَبَادَوْلَى
  text: 'موضعان: «وبَادَوْلَى وبَادُولَى، بِالْفَتْحِ وَالضَّمِّ: مَوْضِعٌ» [@lisan، ج11 ص50].'
- term: عُلْوِيَّةً
  text: في العالية، وهي أعالي نجد.
- term: بِالسِّخَالِ
  text: '«والسِّخَال: مَوْضِعٌ أَو مَوَاضِعُ» [@lisan، ج11 ص332].'
