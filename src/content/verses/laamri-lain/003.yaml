explained: false
first: "فَإِنْ يَكُ نَوْءٌ مِنْ سَحَابٍ أَصَابَهُ"
second: "فَقَدْ كَانَ يَعْلُو فِي اللِّقَاءِ وَيَظْفَرُ"
vocabulary:
  - term: "نَوْءٌ"
    text: "«والنَّوْءُ: النَّجْمُ إِذَا مَالَ للمَغِيب» [@lisan، ج1 ص175]. «وَكَانَتِ الْعَرَبُ تُضِيفُ الأَمْطار والرِّياح والحرَّ وَالْبَرْدَ إِلَى السَّاقِطِ مِنْهَا» [@lisan، ج1 ص175]. يريد الصاعقة التي أحرقته."
  - term: "اللِّقَاءِ"
    text: "الحرب."
