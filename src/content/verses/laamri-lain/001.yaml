explained: false
first: "لَعَمْرِي لَئِنْ كَانَ الْمُخَبِّرُ صَادِقًا"
second: "لَقَدْ رُزِئَتْ فِي حَادِثِ الدَّهْرِ جَعْفَرُ"
vocabulary:
  - term: "الْمُخَبِّرُ"
    text: "الذي جاءه بخبر موت أخيه."
  - term: "رُزِئَتْ"
    text: "أُصيبت بمصيبة."
  - term: "جَعْفَرُ"
    text: "بنو جعفر بن كلاب، رهط لَبِيد وأَرْبَد. وفي الشرح الذي ينقله المحقق عن التِّبْرِيزِيّ: «لئن صدق المخبر لقد رزئت قبيلتي به» [@diwan-labid، ص167]."
sources:
