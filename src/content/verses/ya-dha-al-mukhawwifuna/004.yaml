explained: false
first: "إِنَّا إِذَا عَضَّ الثِّقَا"
second: "فُ بِرَأْسِ صَعْدَتِنَا لَوَيْنَا"
vocabulary:
  - term: "الثِّقَافُ"
    text: "«خَشَبَةٌ تسوَّى بِهَا الرِّمَاحُ» [@lisan، ج9 ص20]."
  - term: "صَعْدَتِنَا"
    text: "الصَّعْدة: القناة المستوية."
  - term: "لَوَيْنَا"
    text: "التوينا على الثقاف فلم نستقم له: إذا أراد أحد أن يقوّمنا بالقهر أبينا."
