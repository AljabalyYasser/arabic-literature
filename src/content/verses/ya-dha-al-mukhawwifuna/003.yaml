first: "هَلَّا عَلَى حُجْرِ بْنِ أُمْـ"
second: "ـمِ قَطَامِ تَبْكِي لَا عَلَيْنَا"
vocabulary:
  - term: "حُجْرِ بْنِ أُمِّ قَطَامِ"
    text: "يقول محقق الأغاني: «هو أبو امرئ القيس، وإنما نسبه إلى أمه سخرية به» [@aghani-dk، ج22 ص83، الحاشية]. يقول: ابكِ أباك إن شئت، ولا تبكِ علينا."
