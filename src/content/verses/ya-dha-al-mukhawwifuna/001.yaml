first: "يَا ذَا المُخَوِّفُنَا بِقَتْـ"
second: "ـلِ أَبِيهِ إِذْلَالًا وَحَيْنَا"
vocabulary:
  - term: "المُخَوِّفُنَا"
    text: "الذي يخوّفنا ويتوعدنا، يخاطب امرأ القيس."
  - term: "إِذْلَالًا وَحَيْنَا"
    text: "إذلالًا لنا وإهلاكًا، والحَيْن: الهلاك."
