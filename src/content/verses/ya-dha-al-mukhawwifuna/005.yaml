explained: false
first: "نَحْمِي حَقِيقَتَنَا وَبَعْـ"
second: "ـضُ القَوْمِ يَسْقُطُ بَيْنَ بَيْنَا"
vocabulary:
  - term: "حَقِيقَتَنَا"
    text: "«مَا يَحِقّ عَلَيْهِ أَنْ يَحْمِيه» [@lisan، ج10 ص52]."
  - term: "بَيْنَ بَيْنَا"
    text: "«وَقَالُوا: بَين بَين، يُرِيدُونَ التَّوَسُّط كَمَا قَالَ عَبيد بْنُ الأَبرص» [@lisan، ج13 ص66]: فبعض القوم لا هو مع هؤلاء ولا مع أولئك."
