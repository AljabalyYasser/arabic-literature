first: "فَتُوسِعُ أَهْلَهَا أَقِطًا وَسَمْنًا"
second: "وَحَسْبُكَ مِنْ غِنًى شِبَعٌ وَرِيُّ"
meaning: "فتعطي أهلها من الأقط والسمن ما يكفيهم ويفيض، وحسب الإنسان من الغنى أن يشبع ويروى."
vocabulary:
  - term: "فَتُوسِعُ أَهْلَهَا"
    text: "تعطيهم عطاءً واسعًا، أي تُكثر لهم."
  - term: "أَقِطًا"
    text: "«الأقط: شىء يصنع من اللبن المخيض على هيئة الجبن» [@diwan-imru-al-qais، ص137]، أي لبن مجفّف."
  - term: "حَسْبُكَ"
    text: "كافيك."
  - term: "شِبَعٌ وَرِيُّ"
    text: "الشِّبَع امتلاء البطن من الطعام، والرِّيّ ذهاب العطش."
context: "خاتمة المقطوعة، وعجزها مثل سائر. يقول المَيْدانيّ في المثل «حسبك من غنى شبع وريّ»: «أي اقْنَعْ من الغنى بما يُشْبِعك ويُرْوِيك وجُدْ بما فَضَلَ، وهذا المثل لامرئ القيس» [@maydani، ج1 ص195]. وفي معناه عند أبي عُبَيْد وجهان: «أحدهما يقول: أعْطِ كلَّ ما كان لك وراء الشبع والري، والآخر: القَنَاعة باليسير»، ورجّح الأول بقول امرئ القَيْس في شعر آخر: «وَلَوْ أنما أَسْعَى لأدْنى معيشةٍ» [@maydani، ج1 ص196]. وبهذا البيت الآخر نفسه قوّى الأعلم إنكار الأَصْمَعِيّ للمقطوعة: كيف يرضى بالقليل من قال إنه لا يسعى لأدنى معيشة [@diwan-imru-al-qais، ص137]؟ فالحجة واحدة، استعملها أبو عُبَيْد في تفسير المثل، والأعلم في الشك في نسبته."
syntax:
  - "«فَتُوسِعُ» الفاء عاطفة على «أرنّت» قبلها، والفاعل ضمير يعود على المعزى، و«أَهْلَهَا» مفعول به."
  - "«أَقِطًا وَسَمْنًا» منصوبان على التمييز، أي توسعهم من جهة الأقط والسمن، ويجوز أن يكونا مفعولًا ثانيًا على معنى: تعطيهم أقطًا وسمنًا واسعًا."
  - "«وَحَسْبُكَ» الواو استئنافية، و«حسبُ» مبتدأ مضاف إلى الكاف، و«مِنْ غِنًى» متعلق به، و«شِبَعٌ» خبر، و«رِيُّ» معطوف عليه."
morphology:
  - "«تُوسِع» مضارع «أوسع» على «أفعل»، يقال: أوسعه عطاءً، أي أكثر له."
  - "«غِنًى» مصدر «غَنِيَ يغنى»، مقصور منوّن."
  - "«شِبَع» اسم لما يُشبع، و«رِيّ» مصدر «رَوِيَ يروى»، أصله «رِوْي» فقُلبت الواو ياءً وأُدغمت."
rhetoric:
  thesis: "بيت ينتهي بحكمة تقوم بنفسها، فخرج العجز من القصيدة وصار مثلًا."
  devices:
    - title: "الالتفات إلى «حسبك»"
      text: "كان الكلام عن المعزى وأهلها بضمير الغائب، ثم التفت إلى المخاطب: «وَحَسْبُكَ». والخطاب ليس لشخص بعينه، بل لكل سامع، فصار الحكم عامًّا يصلح أن يُتمثّل به. ولهذا حفظه الناس مثلًا وإن نسوا المقطوعة."
    - title: "الإيجاز في «شبع وريّ»"
      text: "اختصر حاجة الإنسان كلها في كلمتين: الطعام والشراب. وهو إيجاز يُحفظ لقصره، وفيه ما جعل أبا عُبَيْد يقرؤه قراءتين: ما وراء الشبع والريّ يُعطى، أو ما دونهما يُقنع به [@maydani، ج1 ص196]."
    - title: "تذييل الوصف بالحكمة"
      text: "الصدر خبر عن المعزى، والعجز حكم عام يؤكد ما قبله. فبعد أن وصف ما تعطيه المعزى ختم بأن هذا القدر كافٍ. والجملة الثانية مستقلة بمعناها لا تحتاج إلى ما قبلها، وهذا سرّ سيرورتها."
  connection: "آخر المقطوعة."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الياء المضمومة المشددة"
  scansion: "فَتُوسِعُ أَهْ / لَهَا أَقِطَنْ / وَسَمْنَنْ = مفاعَلَتن / مفاعَلَتن / فعولن — وَحَسْبُكَ مِنْ / غِنَنْ شِبَعُنْ / وَرِيْيُو = مفاعَلَتن / مفاعَلَتن / فعولن"
  note: "جاءت التفعيلتان الأوليان تامتين «مفاعَلَتن» في الشطرين، والعروض والضرب مقطوفان «فعولن»، والقَطْف «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]."
variants:
  - reading: "فَتَمْلَأُ بَيْتَنَا أَقِطًا وَسَمْنًا"
    status: "رواية المَيْدانيّ"
    note: "«فتملأ بيتنا أقطا وسمنا» [@maydani، ج1 ص196]، فالكلام فيها عن الشاعر وأهله، وفي الديوان عن أهل المعزى."
