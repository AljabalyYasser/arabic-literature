explained: false
first: "وَجَادَ لَهَا الرَّبِيعُ بِوَاقِصَاتٍ"
second: "فَآرَامٍ وَجَادَ لَهَا الْوَلِيُّ"
vocabulary:
  - term: "جَادَ لَهَا الرَّبِيعُ"
    text: "«أى أتى بمطر جود، وهو الغزير» [@diwan-imru-al-qais، ص136]، أي سقى مراعيها."
  - term: "بِوَاقِصَاتٍ"
    text: "«موضع» [@diwan-imru-al-qais، ص136]."
  - term: "فَآرَامٍ"
    text: "«علامات فى الطريق، واحدها إرم؛ يريد مواضع الأعلام فيها» [@diwan-imru-al-qais، ص136]."
  - term: "الْوَلِيُّ"
    text: "«مطر يلى الوسمى» [@diwan-imru-al-qais، ص136]، والوسميّ أول مطر الربيع، فالوليّ ما يليه."
sources:
