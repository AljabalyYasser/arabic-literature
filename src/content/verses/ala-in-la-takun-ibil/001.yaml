first: "أَلَا إِنْ لَا تَكُنْ إِبِلٌ فَمِعْزًى"
second: "كَأَنَّ قُرُونَ جِلَّتِهَا الْعِصِيُّ"
meaning: "إن لم تكن لنا إبل فلنا معزى، كبارها طوال القرون كأن قرونها العصيّ. يقول الأعلم: «إن لا يكن غنى وكثرة مال فبلغة من العيش تغنى عن ذلك» [@diwan-imru-al-qais، ص136]."
vocabulary:
  - term: "أَلَا"
    text: "حرف يُفتتح به الكلام للتنبيه."
  - term: "إِنْ لَا"
    text: "«إنْ» الشرطية و«لا» النافية، أي: إن لم. وتُكتب أيضًا «إلّا» موصولة."
  - term: "إِبِلٌ ... فَمِعْزًى"
    text: "«وذكر الإبل لأنها أفضل أموالهم وأنفسها، والمعزى أدناها وأقلها» [@diwan-imru-al-qais، ص136]. والمِعْزى المَعْز."
  - term: "جِلَّتِهَا"
    text: "كبارها، «والجلة: جمع جليل، وهو المسن من الغنم وغيرها» [@diwan-imru-al-qais، ص136]."
  - term: "الْعِصِيُّ"
    text: "جمع عصا."
context: "مطلع المقطوعة، وفيه حكمها كله: الإبل مال الأشراف، والمعزى مال الفقراء، والشاعر يقنع بالأدنى. ولهذا أنكرها الأَصْمَعِيّ على امرئ القَيْس: «امرؤ القيس ملك، ولا أراه يقول هذا» [@diwan-imru-al-qais، ص137]. ويرويه المَيْدانيّ مع البيت الرابع في أصل المثل «حسبك من غنى شبع وريّ»، ويقول إن امرأ القَيْس قاله «يذكر معزى كانت له» [@maydani، ج1 ص195]."
syntax:
  - "«أَلَا» حرف استفتاح. و«إِنْ» حرف شرط، و«لَا» نافية، و«تَكُنْ» فعل الشرط مجزوم، وهي تامة بمعنى «توجد»، و«إِبِلٌ» فاعلها."
  - "«فَمِعْزًى»: الفاء رابطة لجواب الشرط، و«معزًى» خبر لمبتدأ محذوف، والتقدير: فمالُنا معزًى، أو فاعل لفعل محذوف: فتكن معزًى. والجواب كله محذوف إلا هذه الكلمة."
  - "«كَأَنَّ قُرُونَ جِلَّتِهَا الْعِصِيُّ»: «قرونَ» اسم «كأنّ»، و«جلّتها» مضاف إليه، و«العصيُّ» خبرها. والجملة صفة لـ«معزى»."
morphology:
  - "«مِعْزًى» منوّن، لأن ألفه ليست ألف تأنيث، فهو مصروف."
  - "«جِلَّة» جمع «جليل» على «فِعْلة»."
  - "«العِصِيّ» جمع «عصا»، وأصله «عُصُوو» على «فُعُول»، قُلبت الواوان ياءين وأُدغمتا، ثم كُسرت الصاد للياء، وكُسرت العين إتباعًا، ويقال «العُصِيّ» بالضم أيضًا."
rhetoric:
  thesis: "بيت قناعة: يضع أشرف المال وأدناه في شطر واحد، ويختار الأدنى."
  devices:
    - title: "المقابلة بين الإبل والمعزى"
      text: "في «إِبِلٌ فَمِعْزًى» يجمع طرفي المال عند العرب، كما يقول الأعلم: الإبل «أفضل أموالهم وأنفسها، والمعزى أدناها وأقلها» [@diwan-imru-al-qais، ص136]. فالمعنى: إن فاتني الأعلى رضيت بالأدنى."
    - title: "الحذف في «فمعزى»"
      text: "جواب الشرط كلمة واحدة، والمحذوف يفهمه السامع: فعندنا معزى، أو فلتكن معزى. وهو الحذف الذي يقول فيه عبد القاهر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]. فالاختصار يوافق المعنى: رضًا سريع لا يطيل الكلام في الفقد."
    - title: "التشبيه في «كأن قرون جلتها العصيّ»"
      text: "شبّه قرون كبار المعزى بالعصيّ في طولها واستقامتها. والشبه فيه حسّيّ ظاهر، يُدرك «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» كما يقول عبد القاهر في التشبيه [@asrar، ص90]. وطول القرون دليل كِبَر الأسنان، فالمعزى قليلة القدر لكنها جيدة في جنسها."
  connection: "ثم يصف مرعاها: «وجاد لها الربيع بواقصات»، فالمعزى التي رضي بها في خصب."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الياء المضمومة المشددة"
  scansion: "أَلَا إِنْ لَا / تَكُنْ إِبِلُنْ / فَمِعْزَنْ = مفاعلْتن / مفاعَلَتن / فعولن — كَأَنْنَ قُرُو / نَ جِلْلَتِهَلْ / عِصِيْيُو = مفاعَلَتن / مفاعَلَتن / فعولن"
  note: "دخل العصب التفعيلة الأولى من الصدر فصارت «مفاعلْتن»، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]. والعروض والضرب مقطوفان «فعولن»، وهما كذلك في الوافر التام."
