first: وَلَكِنَّا نَهَكْنَا الْقَوْمَ ضَرْبًا
second: عَلَى الْأَثْبَاجِ مِنْهُمْ وَالنُّحُورِ
vocabulary:
- term: نَهَكْنَا
  text: «أجهدناهم» [@qali، ج2 ص133].
- term: الْأَثْبَاجِ
  text: «الأوساط، واحدها ثَبَج» [@qali، ج2 ص133]، وهو ما بين الكاهل والظهر.
- term: النُّحُورِ
  text: جمع نَحْر، وهو أعلى الصدر.
