explained: false
first: كَأَنَّا غُدْوَةً وَبَنِي أَبِينَا
second: بِجَنْبِ عُنَيْزَةٍ رَحَيَا مُدِيرِ
vocabulary:
- term: بَنِي أَبِينَا
  text: يعني بكرًا، فبَكْر وتَغْلِب ابنا وائِل.
- term: عُنَيْزَةٍ
  text: 'موضع التقت فيه بَكْر وتَغْلِب [@iqd، ج6 ص75]؛ وقال ابن قُتَيْبة: «يوم عنيزة، وتكافؤوا فيه» [@ibn-qutayba، ج1 ص290].'
- term: رَحَيَا مُدِيرِ
  text: حجرا الرحى يديرهما رجل؛ و«رَحَيَا» مثنى رَحًى [@lisan، ج14 ص312].
