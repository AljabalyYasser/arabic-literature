explained: false
first: كَوَاكِبُهَا زَوَاحِفُ لَاغِبَاتٌ
second: كَأَنَّ سَمَاءَهَا بِيَدَيْ مُدِيرِ
vocabulary:
- term: زَوَاحِفُ
  text: كالّة «لا تقدر على النهوض» [@qali، ج2 ص130]، واحدها زاحف، وهو «المُعْيِي» [@lisan، ج9 ص131].
- term: لَاغِبَاتٌ
  text: مُتعَبات، من اللُّغوب وهو التعب والإعياء.
- term: بِيَدَيْ مُدِيرِ
  text: 'قال القالي: «يريد أن سماءها أثقل من أن يديرها مدير، فهو إذا تكلّف إدارتها لم يقدر عليها» [@qali، ج2 ص131].'
