first: "عَلَى أَنْ لَيْسَ عَدْلًا مِنْ كُلَيْبٍ"
second: "إِذَا طُرِدَ الْيَتِيمُ عَنِ الْجَزُورِ"
meaning: "قتلتُ همّامًا، على أنه لا يعدل كُلَيْبًا حين يُدفع اليتيم عن لحم الجزور في أيام الشدة؛ فكُلَيْب كان يطعمه يومئذ."
vocabulary:
  - term: "عَدْلًا"
    text: "مساويًا. قال الفَرّاء: «العَدْل: ما عادل الشيء من غير جنسه، والعِدْل: المِثْل» [@murtada، ج1 ص124، الحاشية]."
  - term: "الْجَزُور"
    text: "البعير يُنحر ويُقسم لحمه."
  - term: "طُرِدَ الْيَتِيمُ عَنِ الْجَزُورِ"
    text: "دُفع عن لحمها لضعفه، وذلك في أيام الجدب حين يشتد الناس على الطعام."
syntax:
  - "«عَلَى أَنْ»: «على» حرف جر يفيد الاستدراك، بمعنى: مع أنّ. و«أنْ» مخففة من الثقيلة، واسمها ضمير الشأن محذوف، وجملة «ليس عدلًا...» خبرها، كقوله تعالى: «وَأَنْ لَيْسَ لِلْإِنْسَانِ إِلَّا مَا سَعَى». والمصدر المؤول مجرور بـ«على»."
  - "«لَيْسَ»: فعل ناقص، واسمه ضمير يعود على القتيل المذكور قبله، و«عَدْلًا» خبرها، و«مِنْ كُلَيْبٍ» متعلق بـ«عدلًا»."
  - "«إِذَا»: ظرف فيه معنى الشرط، وجوابه محذوف يدل عليه ما قبله."
  - "«طُرِدَ الْيَتِيمُ»: ماض مبني للمجهول ونائب فاعل. و«عَنِ الْجَزُورِ» متعلق بـ«طُرد»."
morphology:
  - "«عَدْل»: مصدر وُصف به، فيُطلق على الواحد والجمع."
  - "«الْجَزُور»: على «فَعُول»، من «جَزَر» إذا نحر."
  - "«الْيَتِيم»: صفة على «فَعِيل»."
rhetoric:
  thesis: "هذا البيت لازمة: يكرر المُهَلْهِل صدره مرة بعد مرة، ويغيّر عَجُزه كل مرة. فكلما ذكر مقامًا من مَقامات كُلَيْب، ختمه بأن قتيل بَكْر لا يعدله."
  devices:
    - title: "التكرار"
      text: "في رواية القالِيّ سبعة أبيات تبدأ كلها بـ«على أن ليس عدلًا من كُلَيْب»، وفي كل عَجُز مقام: إطعام اليتيم، وحماية الجار، وشدة الشتاء، والخوف على الثغور، والشدائد، وفزع النساء المخبّآت، وإعلان الأسرار [@qali، ج2 ص132]. قال ابن رَشِيق: «وأولى ما تكرر فيه الكلام باب الرثاء؛ لمكان الفجيعة وشدة القرحة التي يجدها المتفجع» [@ibn-rashiq، ج2 ص76]. واستشهد الشريف المُرْتَضَى بهذه الأبيات على التكرار الحسن، لأن ما يُقرن بالعبارة المكررة يختلف كل مرة [@murtada، ج1 ص123–124]."
    - title: "الكناية"
      text: "«إذا طُرد اليتيم عن الجزور» كناية عن زمن الجدب والشح، وعن كرم كُلَيْب فيه. لم يقل: كان كُلَيْب كريمًا، بل ذكر الموقف الذي يظهر فيه الكرم."
    - title: "معنى اللازمة"
      text: "إذا لم يكن في بَكْر من يعدل كُلَيْبًا، فلن يكفي الثأرَ قتيل. وهذا هو المعنى الذي حمله وفد تَغْلِب حين طلب من مُرّة بن ذُهْل أول ما طلب: «تحيي لنا كُلَيْبًا» [@iqd، ج6 ص72]."
  connection: "ويتبعه ستة أبيات أخرى بالصدر نفسه."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "عَلَى أَنْ لَيْ / سَ عَدْلَنْ مِنْ / كُلَيْبِنْ = مفاعلْتن / مفاعلْتن / فعولن — إِذَا طُرِدَلْ / يَتِيمُ عَنِلْ / جَزُورِي = مفاعلَتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ تفعيلتي الصدر، وسلم العَجُز [@atiq، ص54]."
context: "يأتي بعد قوله: «وهمّام بن مُرّة قد تركنا / عليه القَشْعَمَيْن من النسور»، وهمّام أخو جَسّاس. وفي حاشية أمالي المُرْتَضَى: «يعني: ليس همّام عدلًا من كُلَيْب» [@murtada، ج1 ص124، الحاشية]. ويختلف الرواة في عدد أبيات هذه اللازمة: سبعة عند القالِيّ، وثمانية عند المُرْتَضَى، وبيت واحد في «الأغاني» و«العقد» [@aghani، ج5 ص58] [@iqd، ج6 ص75]."
variants:
  - reading: "إِذَا طُرِدَ اللَّئِيمُ عَنِ الْجَزُورِ"
    status: "نسخة"
    note: "في حاشية أصل أمالي المُرْتَضَى [@murtada، ج1 ص124، الحاشية]. والمشهور «اليتيم»، وبه يستقيم المدح."
