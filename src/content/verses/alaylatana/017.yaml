first: عَلَى أَنْ لَيْسَ عَدْلًا مِنْ كُلَيْبٍ
second: إِذَا رَجَفَ الْعِضَاهُ مِنَ الدَّبُورِ
vocabulary:
- term: رَجَفَ
  text: «تحرّك حركة شديدة» [@qali، ج2 ص132].
- term: الْعِضَاهُ
  text: «كل شجر له شوك، واحدها عِضَة» [@qali، ج2 ص132].
- term: الدَّبُورِ
  text: "الريح الغربية، وهي تقابل الصَّبا، و«الصَّبا: ريحٌ مَعْرُوفَةٌ تُقابل الدَّبُور» [@lisan، ج14 ص451]."
