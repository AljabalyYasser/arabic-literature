first: فِدًى لِبَنِي الشَّقِيقَةِ يَوْمَ جَاءُوا
second: كَأُسْدِ الْغَابِ لَجَّتْ فِي زَئِيرِ
vocabulary:
- term: فِدًى
  text: أي نفسي فداء لهم.
- term: الْغَابِ
  text: جمع غابة، وهي الشجر الملتفّ الذي تأوي إليه الأسود.
- term: لَجَّتْ
  text: تمادت وألحّت.
- term: زَئِيرِ
  text: صوت الأَسَد.
