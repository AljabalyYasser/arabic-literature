first: "أَلَيْلَتَنَا بِذِي حُسُمٍ أَنِيرِي"
second: "إِذَا أَنْتِ انْقَضَيْتِ فَلَا تَحُورِي"
meaning: "يا ليلتنا في ذي حُسُم، أضيئي وانتهي إلى الصبح، فإذا انقضيتِ فلا ترجعي. ليلة طويلة يسهرها المُهَلْهِل بعد مقتل أخيه كُلَيْب، فيتمنى أن تنتهي، وألا تعود مثلها أبدًا."
vocabulary:
  - term: "ذِي حُسُمٍ"
    text: "موضع [@qali، ج2 ص130]."
  - term: "أَنِيرِي"
    text: "أضيئي، من «أنار» إذا أضاء. أي: صيري صبحًا."
  - term: "تَحُورِي"
    text: "ترجعي. يقال: «ما له لا حار إلى أهله»، أي لا رجع إليهم [@qali، ج2 ص130]."
syntax:
  - "«أَلَيْلَتَنَا»: الهمزة حرف نداء للقريب، و«لَيْلَتَ» منادى منصوب لأنه مضاف، و«نا» مضاف إليه."
  - "«بِذِي حُسُمٍ»: متعلق بمحذوف صفة لليلة، أي: ليلتنا الكائنة بذي حُسُم. و«ذي» مجرور بالياء لأنه من الأسماء الخمسة، و«حُسُمٍ» مضاف إليه."
  - "«أَنِيرِي»: فعل أمر مبني على حذف النون، والياء فاعل."
  - "«إِذَا»: ظرف لما يُستقبل من الزمان فيه معنى الشرط. و«أَنْتِ» ضمير منفصل فاعل لفعل محذوف يفسّره «انْقَضَيْتِ»، والأصل: إذا انقضيتِ؛ فلما حُذف الفعل انفصل الضمير، كما في قوله تعالى: «قُلْ لَوْ أَنْتُمْ تَمْلِكُونَ»."
  - "«فَلَا تَحُورِي»: الفاء رابطة لجواب الشرط، و«لا» ناهية، و«تَحُورِي» مضارع مجزوم بحذف النون، والياء فاعل."
morphology:
  - "«أَنِيرِي» من «أَنَارَ» على «أَفْعَلَ»، وأصله من النور: «أَنْوِرِي»، نُقلت كسرة الواو إلى النون، ثم قُلبت الواو ياء لسكونها بعد كسر."
  - "«تَحُورِي» من «حار يحور»، أجوف واوي. ومنه «الحَوْر» بمعنى النقصان والرجوع، وفي الدعاء: «نعوذ بالله من الحَوْر بعد الكَوْر»، أي من النقصان بعد الزيادة [@qali، ج2 ص130]."
  - "«انْقَضَيْتِ» على «انْفَعَلَ» من «قَضَى»، ناقص يائي."
rhetoric:
  thesis: "يفتتح القصيدة بنداء الليل كأنه إنسان يسمع، فيأمره أن يضيء وينهاه أن يعود. وبذلك يدل على طول ليلته بعد مقتل كُلَيْب دون أن يقول: طال ليلي."
  devices:
    - title: "نداء الليلة"
      text: "نادى الليلة بالهمزة، وهي لنداء القريب، فكأنها حاضرة معه لا تفارقه. ثم خاطبها بالأمر «أنيري» والنهي «لا تحوري»، كما يخاطب إنسانًا يعقل."
    - title: "الكناية عن طول الليل"
      text: "لم يصرّح بأن الليل طويل، بل طلب منه أن ينير، أي أن ينتهي إلى الصبح. وهذه هي الكناية عند عبد القاهر: أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. فمن يطلب من الليل أن ينتهي فقد طال عليه."
    - title: "التصريع"
      text: "جعل آخر الصدر «أنيري» على قافية العَجُز «تحوري»، كما يُصنع في مطالع القصائد."
  connection: "ثم يبيّن لماذا طال ليله: «فَإِنْ يَكُ بِالذَّنَائِبِ طَالَ لَيْلِي»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "أَلَيْ لَتَنَا / بِذِي حُسُمِنْ / أَنِيرِي = مفاعلَتن / مفاعلَتن / فعولن — إِذَا أَنْتِنْ / قَضَيْتِ فَلَا / تَحُورِي = مفاعلْتن / مفاعلَتن / فعولن"
  note: "سلمت تفعيلتا الصدر، ودخل العَصْبُ، وهو تسكين الخامس، أولى تفعيلتي العَجُز [@atiq، ص54]. والبيت مصرّع."
context: "مطلع رائيته في رثاء كُلَيْب [@qali، ج2 ص129]. وقد صارت ليلته هذه مثلًا للّيل الطويل."
