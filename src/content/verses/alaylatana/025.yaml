explained: false
first: فَلَا وَأَبِي جَلِيلَةَ مَا أَفَأْنَا
second: مِنَ النَّعَمِ الْمُؤَبَّلِ مِنْ بَعِيرِ
vocabulary:
- term: جَلِيلَةَ
  text: 'قال القالي: «أخت كليب، وكانت تحت جسّاس قاتل كليب» [@qali، ج2 ص133]. وفي «الأغاني» أنها «جليلة بنت مرة أخت جساس»، وكانت «تحت كليب» [@aghani، ج5 ص67].'
- term: أَفَأْنَا
  text: «رجعنا» [@qali، ج2 ص133]، أي ما رددنا إلينا ولا أخذنا.
- term: النَّعَمِ
  text: «الإبل خاصة» [@qali، ج2 ص133].
- term: الْمُؤَبَّلِ
  text: 'قال الأَصْمَعِيّ: «المؤبّلة: التي للقِنية»، وقال غيره: «المؤبّلة: الجماعة من الإبل» [@qali، ج2 ص133].'
