first: كَأَنَّ رِمَاحَهُمْ أَشْطَانُ بِئْرٍ
second: بَعِيدٍ بَيْنُ جَالَيْهَا جَرُورِ
vocabulary:
- term: أَشْطَانُ
  text: «الحبال، واحدها شَطَن» [@qali، ج2 ص132].
- term: بَيْنُ جَالَيْهَا
  text: 'البَيْن هنا «الوصل» [@qali، ج2 ص132]، أي ما بين جانبيها. و«جال البئر وجولها: ناحيتها وما يحبس الماء منها» [@qali، ج2 ص133].'
- term: جَرُورِ
  text: من الآبار «البعيدة القعر»، «وهي التي يُستقى منها على بعير» [@lisan، ج4 ص126].
