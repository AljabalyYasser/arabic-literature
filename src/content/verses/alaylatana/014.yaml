first: "هَتَكْتُ بِهِ بُيُوتَ بَنِي عُبَادٍ"
second: "وَبَعْضُ الْقَتْلِ أَشْفَى لِلصُّدُورِ"
meaning: "بقتل بُجَيْر هتكت بيوت بني عُبَاد، رهط الحارِث بن عُبَاد، فأذللتهم وكشفت سترهم. ثم يقول: من القتل ما هو أشفى لغيظ الصدور من غيره."
vocabulary:
  - term: "هَتَكْتُ"
    text: "الهتك: خرق الستر عمّا وراءه."
  - term: "بَنِي عُبَادٍ"
    text: "رهط الحارِث بن عُبَاد من بَكْر."
  - term: "أَشْفَى"
    text: "أكثر شفاء. والشفاء هنا ذهاب الغيظ من الصدر."
syntax:
  - "«هَتَكْتُ»: فعل وفاعل. و«بِهِ» متعلق به، والباء للسببية، والضمير لبُجَيْر."
  - "«بُيُوتَ»: مفعول به، و«بَنِي» مضاف إليه مجرور بالياء لأنه ملحق بجمع المذكر السالم، و«عُبَادٍ» مضاف إليه."
  - "«وَبَعْضُ الْقَتْلِ أَشْفَى»: الواو استئنافية. «بعضُ» مبتدأ، و«القتل» مضاف إليه، و«أشفى» خبر مرفوع بضمة مقدرة على الألف."
  - "«لِلصُّدُورِ»: متعلق بـ«أشفى». واسم التفضيل هنا مجرد من «أل» والإضافة، والمفضَّل عليه محذوف: أشفى من غيره."
morphology:
  - "«أَشْفَى»: اسم تفضيل على «أَفْعَل» من «شفى»، ناقص يائي، أصله «أَشْفَيُ»، قُلبت الياء ألفًا لتحركها وانفتاح ما قبلها."
  - "«الصُّدُور»: جمع «صدر» على «فُعُول»."
  - "«بُيُوت»: جمع «بيت» على «فُعُول»."
rhetoric:
  thesis: "ينتقل من الخبر إلى الحكمة: بعد أن ذكر ما صنع، يجعله قاعدة عامة يحتج بها."
  devices:
    - title: "الكناية"
      text: "«هتكت بيوتهم» كناية عن إذلالهم وفضحهم؛ فالبيت في الجاهلية حرمة وستر، ومن هُتك بيته فقد ذلّ."
    - title: "الحكمة في العَجُز"
      text: "جملة «وبعض القتل أشفى للصدور» تامة بنفسها، تصلح أن تُقال في غير هذا الموضع، فهي حكمة تختم الخبر وتعلّله."
    - title: "حذف المفضَّل عليه"
      text: "لم يقل: أشفى من ماذا. فبقي الباب مفتوحًا: أشفى من الدية، ومن الصلح، ومن قتل من لا شأن له."
  connection: "ثم يذكر قتيله الثاني: «وهمّام بن مُرّة قد تركنا / عليه القَشْعَمَيْن من النسور»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "هَتَكْتُ بِهِي / بُيُوتَ بَنِي / عُبَادِنْ = مفاعلَتن / مفاعلَتن / فعولن — وَبَعْضُلْ قَتْ / لِ أَشْفَى لِصْ / صُدُورِي = مفاعلْتن / مفاعلْتن / فعولن"
  note: "سلم الصدر، ودخل العَصْبُ تفعيلتي العَجُز [@atiq، ص54]."
context: "بنو عُبَاد أهل بيت الحارِث بن عُبَاد، وكانوا قد اعتزلوا الحرب، فقتل المُهَلْهِل بُجَيْرًا منهم [@aghani، ج5 ص53]."
variants:
  - reading: "وَبَعْضُ الْغَشْمِ أَشْفَى لِلصُّدُورِ"
    status: "رواية الأغاني"
    note: "والغَشْم: الظلم. وفي هذه الرواية يعترف الشاعر بأن ما صنعه ظلم، ثم يقول إنه يشفي غيظه [@aghani، ج5 ص47، ص58]."
