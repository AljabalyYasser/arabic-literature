first: "فَلَوْلَا الرِّيحُ أُسْمِعَ أَهْلُ حَجْرٍ"
second: "صَلِيلَ الْبَيْضِ تُقْرَعُ بِالذُّكُورِ"
meaning: "لولا أن الريح حملت الصوت بعيدًا، لسمع أهل حَجْر صوت الخُوَذ تضربها السيوف. وحَجْر بلدة باليمامة بعيدة عن موضع المعركة [@qali، ج2 ص134]."
vocabulary:
  - term: "حَجْر"
    text: "«قصبة اليمامة» [@qali، ج2 ص134]، أي أكبر بلدانها."
  - term: "صَلِيل"
    text: "الصوت [@qali، ج2 ص134]، ويُقال لصوت الحديد إذا ضُرب."
  - term: "الْبَيْض"
    text: "«خُوَذ الحرب» [@deif، ج1 ص367]، واحدتها بَيْضة."
  - term: "الذُّكُور"
    text: "«أجود السيوف وأيبسها وأشدها» [@deif، ج1 ص367]. وقال القالِيّ: «السيوف التي عُملت من حديد غير أنيث» [@qali، ج2 ص134]."
syntax:
  - "«فَلَوْلَا»: حرف امتناع لوجود. و«الرِّيحُ» مبتدأ خبره محذوف وجوبًا، تقديره: موجودة."
  - "«أُسْمِعَ»: جواب «لولا»، ماض مبني للمجهول. وجاء بلا لام، والأكثر أن يقترن جواب «لولا» الماضي المثبت باللام، ويجوز حذفها."
  - "«أَهْلُ»: نائب فاعل، وهو المفعول الأول في الأصل، و«حَجْرٍ» مضاف إليه. و«صَلِيلَ» مفعول ثانٍ، و«الْبَيْضِ» مضاف إليه."
  - "«تُقْرَعُ»: مضارع مبني للمجهول، ونائب الفاعل ضمير يعود على البَيْض، والجملة في محل نصب حال. و«بِالذُّكُورِ» متعلق بـ«تُقرع»."
morphology:
  - "«أُسْمِعَ»: ماض مبني للمجهول من «أَسْمَعَ» على «أفعل»، وهو يتعدى إلى مفعولين."
  - "«صَلِيل»: مصدر على «فَعِيل»، وهو وزن يكثر في الأصوات، كالهدير والزئير والفحيح [@qali، ج2 ص132]."
  - "«الذُّكُور»: جمع «ذَكَر» على «فُعُول»."
rhetoric:
  thesis: "أشهر أبيات القصيدة وأكثرها إثارة للنقاد القدماء: أهذا كذب أم شعر؟"
  devices:
    - title: "الغلو"
      text: "قال أبو العباس الأحول: «أول كذب سُمع في الشعر هذا» [@qali، ج2 ص134]. وعدّ ابن قُتَيْبة المُهَلْهِل من أجله «أحد الشعراء الكذبة» [@ibn-qutayba، ج1 ص288]، وجعله المَرْزُوقِيّ من الغلو الذي فيه «سرف مستنكر، وخروج عن القصد مستهجن» [@marzuqi-hamasa، ص137]."
    - title: "خير الشعر أكذبه؟"
      text: "وقف عبد القاهر عند هذه المسألة: من قال «خير الشعر أصدقه» آثر ما يقبله العقل، ومن قال «أكذبه» رأى أن صنعة الشاعر تتسع «حيث يعتمد الاتساع والتخييل»، ويذهب بالقول «مذهب المبالغة والإغراق». ثم رجّح عبد القاهر الأول، لأن «ما كان العقل ناصره، والتحقيق شاهده، فهو العزيز جانبه» [@asrar، ص271–273]."
    - title: "التقريب بـ«لولا»"
      text: "ومع ذلك احتاط الشاعر لمبالغته: لم يقل «سمع أهل حَجْر»، بل علّق السماع على غياب الريح. فجعل للمستحيل علة تقرّبه من الإمكان."
  connection: "وبه تنتهي القصيدة في رواية القالِيّ."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "فَلَوْلَرْ رِي / حُ أُسْمِعَ أَهْ / لُ حَجْرِنْ = مفاعلْتن / مفاعلَتن / فعولن — صَلِيلَلْ بَيْ / ضِ تُقْرَعُ بِذْ / ذُكُورِي = مفاعلْتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ الأولى من الصدر والأولى من العَجُز [@atiq، ص54]."
context: "يروي أبو الفَرَج أنه قاله في يوم عُنَيْزة، أول أيام الحرب [@aghani، ج5 ص46]. وحَجْر عند القالِيّ «قصبة اليمامة»، وهو يذكر أن ديار القوم كانت بالجزيرة، بعيدًا عنها [@qali، ج2 ص134]."
variants:
  - reading: "فَلَوْلَا الرِّيحُ أُسْمِعَ مَنْ بِحَجْرٍ"
    status: "رواية الأغاني"
    note: "والمعنى واحد [@aghani، ج5 ص46، ص58]."
  - reading: "صَلِيلَ الْبِيضِ تُقْرَعُ بِالذُّكُورِ"
    status: "ضبط آخر"
    note: "بكسر الباء، أي السيوف البيض، كذا ضُبط في «الأغاني» [@aghani، ج5 ص46]. ونتبع تفسير شوقي ضيف: البَيْض الخُوَذ."
