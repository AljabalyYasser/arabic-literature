first: عَلَى أَنْ لَيْسَ عَدْلًا مِنْ كُلَيْبٍ
second: إِذَا بَرَزَتْ مُخَبَّأَةُ الْخُدُورِ
vocabulary:
- term: مُخَبَّأَةُ الْخُدُورِ
  text: المرأة المصونة المستورة في خدرها. والخُدور جمع خِدْر، وهو الستر يُمدّ للمرأة في ناحية البيت.
