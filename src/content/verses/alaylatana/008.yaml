explained: false
first: كَوَاكِبَ لَيْلَةٍ طَالَتْ وَغَمَّتْ
second: فَهَذَا الصُّبْحُ رَاغِمَةً فَغُورِي
vocabulary:
- term: غَمَّتْ
  text: 'أظلمت واشتدّ كربها؛ من «غَمَمْتُ الشيءَ إذا غطّيته»، و«الغَمّ والغُمّة: الكرب» [@lisan، ج12 ص441–442].'
- term: رَاغِمَةً
  text: ذليلة مُكرَهة، على رغمكِ.
- term: غُورِي
  text: غيبي واغربي.
