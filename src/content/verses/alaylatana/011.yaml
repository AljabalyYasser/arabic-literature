first: بِيَوْمِ الشَّعْثَمَيْنِ لَقَرَّ عَيْنًا
second: وَكَيْفَ لِقَاءُ مَنْ تَحْتَ الْقُبُورِ
vocabulary:
- term: الشَّعْثَمَيْنِ
  text: 'قال القالي: «الشعثمان: موضع معروف» [@qali، ج2 ص131]. وفي «العقد» أنهما رجلان من بَكْر قُتلا يوم واردات: «شعثم وعبد شمس ابنا معاوية بن عامر بن ذهل بن ثعلبة» [@iqd، ج6 ص74–75].'
- term: لَقَرَّ عَيْنًا
  text: لَسُرّ ورضي.
