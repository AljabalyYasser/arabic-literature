first: قَتِيلٌ مَا قَتِيلُ الْمَرْءِ عَمْرٍو
second: وَجَسَّاسُ بْنُ مُرَّةَ ذُو ضَرِيرِ
vocabulary:
- term: جَسَّاسُ بْنُ مُرَّةَ
  text: قاتل كليب. وفي «العقد» أن جسّاسًا طعن كليبًا، «وطعنه عَمْرو ابن الحارِث من خلفه» [@iqd، ج6 ص71]، فلعله عَمْرو المذكور في الصدر.
- term: ذُو ضَرِيرِ
  text: '«يقال: إنه لذو ضرير، أي ذو مشقة على العدو» [@qali، ج2 ص133]. وقال الأَصْمَعِيّ: «إنه لذو ضرير على الشيء والشدة إذا كان ذا صبر عليه ومقاساة» [@lisan، ج4 ص485].'
