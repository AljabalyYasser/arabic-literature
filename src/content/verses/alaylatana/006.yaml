explained: false
first: كَأَنَّ النَّجْمَ إِذْ وَلَّى سُحَيْرًا
second: فِصَالٌ جُلْنَ فِي يَوْمٍ مَطِيرِ
vocabulary:
- term: النَّجْمَ
  text: «الثريّا» [@qali، ج2 ص130].
- term: سُحَيْرًا
  text: قُبيل السَّحَر، والسَّحَر آخر الليل قبيل الصبح.
- term: فِصَالٌ
  text: جمع فَصِيل، وهو ولد الناقة إذا فُصل عن أمه.
- term: فِي يَوْمٍ مَطِيرِ
  text: 'قال القالي: «إنما شبّهها بالفصال في يوم مطير لبطئها، وذلك أن الفصيل يخاف الزلق فلا يسرع» [@qali، ج2 ص130].'
