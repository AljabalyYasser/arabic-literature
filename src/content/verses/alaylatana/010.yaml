first: "فَلَوْ نُبِشَ الْمَقَابِرُ عَنْ كُلَيْبٍ"
second: "فَيُخْبَرَ بِالذَّنَائِبِ أَيُّ زِيرِ"
meaning: "ليت القبور تُنبش عن كُلَيْب، فيُخبَر وهو في قبره بالذَّنائِب أيّ رجل صار أخوه الذي كان يسميه «زير النساء»."
vocabulary:
  - term: "نُبِشَ"
    text: "حُفر عنه وكُشف."
  - term: "زِير"
    text: "«يقال: هو زير نساء... إذا كان يتحدث إليهن، ويطلبهن، ويتبعهن» [@qali، ج2 ص131]."
syntax:
  - "«فَلَوْ»: الفاء استئنافية، و«لو» حرف فيه معنى التمني."
  - "«نُبِشَ الْمَقَابِرُ»: ماض مبني للمجهول ونائب فاعل. ولم يؤنث الفعل لأن «المقابر» جمع تكسير، يجوز معه التذكير والتأنيث. و«عَنْ كُلَيْبٍ» متعلق بـ«نُبش»."
  - "«فَيُخْبَرَ»: منصوب بـ«أن» مضمرة بعد فاء السببية الواقعة في جواب التمني، كقوله تعالى: «فَلَوْ أَنَّ لَنَا كَرَّةً فَنَكُونَ مِنَ الْمُؤْمِنِينَ». ونائب الفاعل ضمير يعود على كُلَيْب."
  - "«أَيُّ زِيرِ»: قال القالِيّ: «والخبر محذوف، كأنه قال: أيّ زير أنا» [@qali، ج2 ص131]. فـ«أيّ» اسم استفهام خبر مقدم، و«زيرٍ» مضاف إليه، و«أنا» مبتدأ محذوف. والجملة في موضع نصب بـ«يُخبَر»."
morphology:
  - "«الْمَقَابِر» جمع «مَقْبُرة» على «مفاعل»."
  - "«يُخْبَرَ» مضارع مبني للمجهول من «أَخْبَرَ» على «أفعل»."
  - "«نُبِشَ» ماض مبني للمجهول من «نَبَشَ»."
rhetoric:
  thesis: "يعود المُهَلْهِل إلى اللقب الذي كان أخوه يعيّره به، «زير النساء»، فيقلبه فخرًا: لو استطاع كُلَيْب أن يعلم، لعرف أيّ رجل صار ذلك الزِّير."
  devices:
    - title: "الاستفهام للتعظيم"
      text: "«أيّ زير» ليس سؤالًا ينتظر جوابًا، بل تعجب وتعظيم: أيّ زيرٍ عظيم أنا! فالكلمة التي كانت تنقص من قدره صارت على لسانه فخرًا."
    - title: "التمني المستحيل"
      text: "يتمنى ما لا يكون: أن ينبش القبر ويُخبَر الميت. وهذا ما يجعل الفخر حزينًا؛ فالذي يريد أن يسمع الخبر لن يسمعه."
    - title: "الحذف"
      text: "حذف «أنا» بعد «أيّ زير»، فترك السامع يكمل الجملة، وصار التعجب أقوى. وحذف جواب «لو»، فلم يقل ما الذي كان سيكون لو علم كُلَيْب."
  connection: "ثم يذكر يومًا أقرّ عينه: «بيوم الشَّعْثَمَيْن لقرّ عينًا»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "فَلَوْ نُبِشَلْ / مَقَابِرُ عَنْ / كُلَيْبِنْ = مفاعلَتن / مفاعلَتن / فعولن — فَيُخْبَرَ بِذْ / ذَنَائِبِ أَيْ / يُ زِيرِي = مفاعلَتن / مفاعلَتن / فعولن"
  note: "سلمت التفعيلات كلها من العَصْب [@atiq، ص54]."
context: "كان المُهَلْهِل كثير الحديث إلى النساء، فكان كُلَيْب يسميه «زير النساء»، «فذلك قوله: ولو نُبش المقابر عن كُلَيْب» [@aghani، ج5 ص61]. ويروي ابن عبد رَبِّه أنه بعد مقتل أخيه «ترك النساء والغزل، وحرّم القمار والشراب» [@iqd، ج6 ص71]."
variants:
  - reading: "فَيَعْلَمَ بِالذَّنَائِبِ أَيُّ زِيرِ"
    status: "رواية الأغاني"
    note: "والمعنى واحد [@aghani، ج5 ص58]."
  - reading: "لَأُخْبِرَ بِالذَّنَائِبِ أَيُّ زِيرِ"
    status: "رواية العقد"
    note: "وفيها جاء جواب «لو» ظاهرًا [@iqd، ج6 ص75]."
