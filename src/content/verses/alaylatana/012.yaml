first: "وَإِنِّي قَدْ تَرَكْتُ بِوَارِدَاتٍ"
second: "بُجَيْرًا فِي دَمٍ مِثْلِ الْعَبِيرِ"
meaning: "تركت بُجَيْرًا بن الحارِث بن عُبَاد صريعًا في موضع واردات، غارقًا في دم أحمر كالزعفران."
vocabulary:
  - term: "وَارِدَات"
    text: "«موضع سُمّيت به موقعة حدثت فيه بين بَكْر وتَغْلِب في حرب البَسُوس» [@deif، ج1 ص367]."
  - term: "بُجَيْر"
    text: "ابن الحارِث بن عُبَاد، ويقال ابن أخيه [@aghani، ج5 ص52]."
  - term: "الْعَبِير"
    text: "الزعفران [@deif، ج1 ص367]."
syntax:
  - "«وَإِنِّي»: «إنّ» حرف توكيد ونصب، والياء اسمها. وجملة «قد تركت» في محل رفع خبرها."
  - "«بِوَارِدَاتٍ»: متعلق بـ«تركت». وهو علم على موضع بلفظ جمع المؤنث السالم، فنُوّن كما نُوّن «عرفات» في قوله تعالى: «فَإِذَا أَفَضْتُمْ مِنْ عَرَفَاتٍ»."
  - "«بُجَيْرًا»: مفعول به. و«فِي دَمٍ» متعلق بمحذوف حال منه."
  - "«مِثْلِ»: صفة لـ«دمٍ» مجرورة، ولا تتعرف بالإضافة، فصح أن تكون صفة للنكرة. و«الْعَبِيرِ» مضاف إليه."
morphology:
  - "«وَارِدَات» جمع «واردة»، اسم فاعل مؤنث من «وَرَدَ»."
  - "«بُجَيْر» على صيغة التصغير «فُعَيْل»."
  - "«العَبِير» على «فَعِيل»."
rhetoric:
  thesis: "أول القتلى الذين يعدّهم في القصيدة: بُجَيْر. وقتله هو الذي أدخل الحارِث بن عُبَاد الحرب."
  devices:
    - title: "التوكيد بـ«إنّ» و«قد»"
      text: "أكّد الخبر مرتين، كأنه يرد على من يشك فيه. قال عبد القاهر إن المتكلم لا يحتاج إلى «إنّ» في خبر ليس للمخاطب ظن في خلافه، «وإنما تحتاج إليها إذا كان له ظن في الخلاف»، و«تراها تزداد حسنًا إذا كان الخبر بأمر يبعد مثله في الظن» [@dalail، ص325]. وقتل ابن الحارِث، وأهله معتزلون الحرب، أمر بعيد في الظن."
    - title: "تشبيه الدم بالطيب"
      text: "شبّه الدم بالعبير في لونه، فصارت صورة القتل صورة طيب. وهي صورة الثائر الذي يرى في دم خصمه شفاء، وسيصرّح بذلك بعد بيتين: «وبعض القتل أشفى للصدور»."
  connection: "ثم يصف مصرع قتيل آخر: «ينوء بصدره والرمح فيه»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "وَإِنْنِي قَدْ / تَرَكْتُ بِوَا / رِدَاتِنْ = مفاعلْتن / مفاعلَتن / فعولن — بُجَيْرَنْ فِي / دَمِنْ مِثْلِلْ / عَبِيرِي = مفاعلْتن / مفاعلْتن / فعولن"
  note: "دخل العَصْبُ الأولى من الصدر، والأولى والثانية من العَجُز [@atiq، ص54]."
context: "قتل المُهَلْهِل بُجَيْرًا يوم واردات وقال: «بُؤْ بشِسْع نعل كُلَيْب»، فخرج الحارِث بن عُبَاد إلى الحرب بعد أن كان معتزلًا [@aghani، ج5 ص47، ص52]."
variants:
