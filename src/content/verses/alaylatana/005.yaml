explained: false
first: كَأَنَّ الْجَدْيَ فِي مَثْنَاةِ رِبْقٍ
second: أَسِيرٌ أَوْ بِمَنْزِلَةِ الْأَسِيرِ
vocabulary:
- term: الْجَدْيَ
  text: «نجم في السماء يقال له الجَدْي قريب من القطب تُعرف به القبلة»، وأصل الجَدْي «الذكر من أولاد المعز» [@lisan، ج14 ص135].
- term: مَثْنَاةِ
  text: 'حبل. قال القالي: «المثناة: الحبل، والمثناة هاهنا عندي: المثنيّ»، والمعنى: «كأن الجدي قد شُدّ بحبل مثنيّ فهو أحكم لشدّه» [@qali، ج2 ص130].'
- term: رِبْقٍ
  text: 'الرِّبْق: «حبل فيه عدّة عُرًى تُشدّ به البَهْم» [@lisan، ج10 ص113]، أي صغار الغنم.'
