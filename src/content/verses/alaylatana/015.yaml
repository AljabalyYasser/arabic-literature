first: وَهَمَّامَ بْنَ مُرَّةَ قَدْ تَرَكْنَا
second: عَلَيْهِ الْقَشْعَمَيْنِ مِنَ النُّسُورِ
vocabulary:
- term: هَمَّامَ بْنَ مُرَّةَ
  text: أخو جسّاس قاتل كليب «لأمه وأبيه»، قُتل يوم واردات [@iqd، ج6 ص74–75].
- term: الْقَشْعَمَيْنِ
  text: مثنى قَشْعَم، وهو «الهرم من النسور» [@qali، ج2 ص132].
