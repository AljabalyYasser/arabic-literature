first: يَنُوءُ بِصَدْرِهِ وَالرُّمْحُ فِيهِ
second: وَيَخْلِجُهُ خِدَبٌّ كَالْبَعِيرِ
vocabulary:
- term: يَنُوءُ
  text: «ينهض» [@qali، ج2 ص131]، أي يحاول النهوض مُثقَلًا.
- term: يَخْلِجُهُ
  text: '«يجذبه»، «ويُروى: ويأطره، أي يثنيه ويعطفه» [@qali، ج2 ص132].'
- term: خِدَبٌّ
  text: «الضخم» [@qali، ج2 ص132].
