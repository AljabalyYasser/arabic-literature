first: "كَأَنَّ كَوَاكِبَ الْجَوْزَاءِ عُوذٌ"
second: "مُعَطَّفَةٌ عَلَى رُبَعٍ كَسِيرِ"
meaning: "كأن نجوم الجوزاء نوق ولدت حديثًا، عطفت على فصيل مكسور، فهي لا تتركه، وهو لا يقدر على النهوض [@qali، ج2 ص130]. فالنجوم باقية في مكانها لا تسير، والليل لا ينقضي."
vocabulary:
  - term: "الْجَوْزَاء"
    text: "جماعة من النجوم معروفة عند العرب."
  - term: "عُوذٌ"
    text: "«الحديثات النتاج، واحدتها عائذ، وإنما قيل لها عُوذ لأن أولادها تعوذ بها» [@qali، ج2 ص130]، أي تلجأ إليها."
  - term: "رُبَعٍ"
    text: "«ما نُتج في الربيع» [@qali، ج2 ص130] من الإبل."
  - term: "كَسِيرِ"
    text: "مكسور."
syntax:
  - "«كَأَنَّ»: حرف تشبيه ونصب. و«كَوَاكِبَ» اسمها منصوب، و«الْجَوْزَاءِ» مضاف إليه."
  - "«عُوذٌ»: خبر «كأنّ» مرفوع."
  - "«مُعَطَّفَةٌ»: صفة لـ«عُوذ»، و«عَلَى رُبَعٍ» متعلق بها، و«كَسِيرِ» صفة لـ«رُبَع»."
morphology:
  - "«عُوذ» جمع «عائذ» على «فُعْل»، كحائل وحُول."
  - "«مُعَطَّفَة» اسم مفعول من «عَطَّفَ»، والتضعيف للتكثير: عُطفت عليه عطفًا شديدًا."
  - "«كَسِير» فعيل بمعنى مفعول: مكسور. و«رُبَع» على «فُعَل»."
rhetoric:
  thesis: "صورة من قلب البادية لليل الذي لا يتحرك: نجوم الجوزاء نوق تحيط بفصيل مكسور، لا تتركه ولا يقدر هو على القيام، فهي باقية في مكانها."
  devices:
    - title: "التشبيه المركب"
      text: "ليس المقصود أن كل نجم يشبه ناقة، بل الهيئة كلها: جماعة تحيط بواحد عاجز، فتلازمه ولا تبرح. وهذا ما يسميه عبد القاهر التشبيه المركب: صورة واحدة تؤخذ من أشياء مجتمعة، ولو فرّقتها لذهب الشبه [@asrar، ص192–194]."
    - title: "تعليل الصورة"
      text: "لم يكتفِ بأن النجوم لا تتحرك، بل جاء بعلة لسكونها من عالم الإبل: الأم لا تترك صغيرها المكسور. فصار ثبات النجوم أمرًا مفهومًا لا غريبًا."
    - title: "من بيئته"
      text: "أخذ الشاعر صورته من الإبل التي يعيش معها؛ فالسماء عنده مرعى، ونجومها نوق وفصلان."
  connection: "ويمضي في أبيات بعده يشبّه نجومًا أخرى بأسير مشدود، وبفصال تمشي متمهلة في يوم مطير."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "كَأَنْنَ كَوَا / كِبَلْ جَوْزَا / ءِ عُوذُنْ = مفاعلَتن / مفاعلْتن / فعولن — مُعَطْطَفَتُنْ / عَلَى رُبَعِنْ / كَسِيرِي = مفاعلَتن / مفاعلَتن / فعولن"
  note: "دخل العَصْبُ التفعيلة الثانية من الصدر، وسلم العَجُز [@atiq، ص54]."
context: "بعد أن طلب من الليلة أن تنقضي، يصف نجومها في خمسة أبيات: كلها ثابتة لا تسير [@qali، ج2 ص130]."
