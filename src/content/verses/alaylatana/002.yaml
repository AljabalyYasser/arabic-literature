first: "فَإِنْ يَكُ بِالذَّنَائِبِ طَالَ لَيْلِي"
second: "فَقَدْ أَبْكِي مِنَ اللَّيْلِ الْقَصِيرِ"
meaning: "إن طال ليلي اليوم بالذَّنائِب، حيث قُتل كُلَيْب ودُفن، فقد كنت أيام حياته أشكو قصر الليل. قال القالِيّ: «يقول: إن كان طال ليلي بهذا الموضع لقتل أخي، فقد كنت أستقصر الليل وهو حيّ» [@qali، ج2 ص130]."
vocabulary:
  - term: "الذَّنَائِب"
    text: "الموضع الذي قُتل فيه كُلَيْب، وفيه قبره [@aghani، ج5 ص44]."
  - term: "أَبْكِي مِنَ اللَّيْلِ الْقَصِيرِ"
    text: "أشكو قصره، لأنه كان ليل أُنس ينقضي سريعًا."
syntax:
  - "«فَإِنْ»: الفاء استئنافية، و«إن» حرف شرط جازم."
  - "«يَكُ»: مضارع ناقص مجزوم، أصله «يكن». واسمه ضمير الشأن محذوف، وجملة «طال ليلي» خبره."
  - "«بِالذَّنَائِبِ»: متعلق بـ«طال»."
  - "«فَقَدْ أَبْكِي»: الفاء رابطة للجواب لاقترانه بـ«قد». والجواب في المعنى محذوف، تقديره: فلا عجب؛ والمذكور علة له، كما في قوله تعالى: «إِنْ يَسْرِقْ فَقَدْ سَرَقَ أَخٌ لَهُ مِنْ قَبْلُ»."
  - "«مِنَ اللَّيْلِ»: متعلق بـ«أبكي»، و«من» للتعليل: أبكي بسبب الليل القصير. و«القصيرِ» صفة لليل."
morphology:
  - "«يَكُ»: مجزوم «يكون». حُذفت الواو لالتقاء الساكنين فصار «يكنْ»، ثم حُذفت النون تخفيفًا، وهو جائز في «يكن» المجزوم إذا لم يلِه ساكن."
  - "«طَالَ»: أجوف واوي، أصله «طَوَلَ»، قُلبت الواو ألفًا لتحركها وانفتاح ما قبلها."
  - "«الْقَصِيرِ»: صفة مشبهة على «فعيل»."
rhetoric:
  thesis: "يجعل الليل مقياس الحزن: الليلة التي تطول اليوم كانت تقصر أيام كُلَيْب."
  devices:
    - title: "الطباق"
      text: "بين «طال» و«القصير». فالبيت قائم على المقابلة بين ليل الحزن الطويل وليل الأنس القصير."
    - title: "الحذف"
      text: "حذف جواب الشرط وأقام علته مكانه: لا عجب أن يطول ليلي، فقد كنت أشكو قصره. قال عبد القاهر في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "المكان شاهدًا"
      text: "قال «بالذَّنائِب» ولم يقل «بعد كُلَيْب»؛ فاسم الموضع الذي قُتل فيه أخوه ودُفن يكفي ليستحضر الفجيعة."
  connection: "ثم يصف هذه الليلة ونجومها التي لا تتحرك."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الراء المكسورة"
  scansion: "فَإِنْ يَكُ بِذْ / ذَنَائِبِ طَا / لَلَيْلِي = مفاعلَتن / مفاعلَتن / فعولن — فَقَدْ أَبْكِي / مِنَلْ لَيْلِلْ / قَصِيرِي = مفاعلْتن / مفاعلْتن / فعولن"
  note: "سلم الصدر من الزحاف، ودخل العَصْبُ تفعيلتي العَجُز [@atiq، ص54]."
context: "ذكر في المطلع ذا حُسُم، وهنا الذَّنائِب، وفيها قبر كُلَيْب [@aghani، ج5 ص44]."
