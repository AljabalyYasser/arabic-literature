explained: false
first: أَلَا اعْتَزِلِينِي الْيَوْمَ خَوْلَةُ أَوْ غُضِّي
second: فَقَدْ نَزَلَتْ حَدْبَاءُ مُحْكَمَةُ الْعَضِّ
vocabulary:
- term: خَوْلَةُ
  text: 'منادى حُذف حرف ندائه: يا خَوْلة. وينقل محققا الديوان عن طبعة قازان أن العبدي «حين سجنه للقتل، بعث إليه بجارية يقال لها خولة، فأبى أن يقبلها» [@diwan-tarafa، ص166، الحاشية].'
- term: غُضِّي
  text: كُفّي واخفضي صوتك؛ «وكل شيء كففته فقد غضضته» [@lisan، ج7 ص197].
- term: حَدْبَاءُ مُحْكَمَةُ الْعَضِّ
  text: 'داهية شديدة لا تُفلت ما عضّته. يقال: «سنة حدباء: شديدة، شبهت بالدابة الحدباء» [@lisan، ج1 ص301].'
