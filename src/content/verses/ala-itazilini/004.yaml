explained: false
first: فَأَقْسَمْتُ عِنْدَ النُّصْبِ إِنِّي لَمَيِّتٌ
second: بِمَتْلَفَةٍ لَيْسَتْ بِغَرْبٍ وَلَا خَفْضِ
vocabulary:
- term: النُّصْبِ
  text: «ما نُصب فعُبد من دون الله تعالى» [@lisan، ج1 ص759].
- term: مَتْلَفَةٍ
  text: '«والمتلفة: القفر؛ قال طرفة أو غيره: بمتلفة ليست بطلح ولا حمض» [@lisan، ج9 ص18].'
- term: غَرْبٍ
  text: '«الوهدة المنخفضة» في تفسير محققَي الديوان [@diwan-tarafa، ص170، الحاشية].'
- term: خَفْضِ
  text: لين العيش ودعته.
