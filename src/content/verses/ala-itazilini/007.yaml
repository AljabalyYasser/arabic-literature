first: وَتُلْبِسُ قَوْمًا بِالْمُشَقَّرِ وَالصَّفَا
second: شَآبِيبَ مَوْتٍ تَسْتَهِلُّ وَلَا تُغْضِي
vocabulary:
- term: شَآبِيبَ
  text: «جمع شؤبوب، وهو الدفعة من المطر» [@lisan، ج1 ص480].
- term: تَسْتَهِلُّ
  text: تنصبّ؛ «هلّ السحاب إذا أمطر بشدة» [@lisan، ج11 ص701].
- term: لَا تُغْضِي
  text: 'لا تسكن ولا تكفّ، من «أغضيت: سكتّ» [@lisan، ج15 ص128].'
