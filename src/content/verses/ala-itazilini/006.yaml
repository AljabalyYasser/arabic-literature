explained: false
first: سَتَصْبَحُكَ الْغَلْبَاءُ تَغْلِبُ غَارَةً
second: هُنَالِكَ لَا يُنْجِيكَ عَرْضٌ مِنَ الْعَرْضِ
vocabulary:
- term: سَتَصْبَحُكَ
  text: ستأتيك صباحًا.
- term: الْغَلْبَاءُ
  text: '«وكانت تَغْلِب تسمى الغلباء» [@lisan، ج1 ص653]. والأغلب: الغليظ الرقبة، «وهم يصفون أبدًا السادة بغلظ الرقبة وطولها» [@lisan، ج1 ص652].'
- term: عَرْضٌ مِنَ الْعَرْضِ
  text: 'العَرْض: «الجيش الضخم مشبه بناحية الجبل»، والعَرْض أيضًا: الجبل وسفحه [@lisan، ج7 ص175].'
