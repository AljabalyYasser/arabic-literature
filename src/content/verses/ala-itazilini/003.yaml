first: "أَبَا مُنْذِرٍ أَفْنَيْتَ فَاسْتَبْقِ بَعْضَنَا"
second: "حَنَانَيْكَ بَعْضُ الشَّرِّ أَهْوَنُ مِنْ بَعْضِ"
meaning: "يا أبا منذر، قد أفنيت منا كثيرًا فأبقِ بعضنا، ترفّق بنا، فبعض الشر أخف من بعض."
vocabulary:
  - term: "أَفْنَيْتَ"
    text: "أهلكت."
  - term: "اسْتَبْقِ"
    text: "أبقِ، واطلب بقاء."
  - term: "حَنَانَيْكَ"
    text: "تحنّنًا بعد تحنّن، أي ترفّق بنا [@diwan-tarafa، ص53، الحاشية]."
  - term: "أَهْوَنُ"
    text: "أيسر وأخف."
syntax:
  - "«أبا منذر» منادى محذوف الأداة. و«أفنيت» مفعوله محذوف: أفنيتنا أو أفنيت منا."
  - "«فاستبقِ» فعل أمر مبني على حذف الياء، والفاء واقعة في جواب شرط مقدّر: إذ أفنيت فاستبق."
  - "«حنانيك» مصدر مثنى منصوب بفعل محذوف، والتثنية للتكرار لا للعدد: تحنّن علينا تحنّنًا بعد تحنّن."
  - "«بعضُ الشر» مبتدأ ومضاف إليه، و«أهون» خبره، و«من بعض» متعلق بـ«أهون»."
morphology:
  - "«حنانَيْك» مثنى «حنان» مضافًا إلى الكاف، حُذفت نونه للإضافة، ولا يُستعمل إلا منصوبًا مضافًا."
  - "«اسْتَبْقِ» على «استفعل» من «بقي»، والسين والتاء للطلب."
  - "«أهْوَن» اسم تفضيل من «هان» على «أفعل»."
rhetoric:
  thesis: "آخر ما يُنسب إليه: لا يطلب النجاة لنفسه، بل يطلب من الملك ألا يفني قومه كلهم. وعجزه صار مثلًا."
  devices:
    - title: "المثل"
      text: "«بعض الشر أهون من بعض» مثل في «مجمع الأمثال»، «يضرب عند ظهور الشرين بينهما تفاوت»، «وهذا كقولهم: إن من الشر خيارا» [@maydani، ج1 ص94]."
    - title: "الطباق والتكرار"
      text: "«أفنيت» و«فاستبق»: الإفناء والإبقاء. وكرر «بعض» ثلاث مرات: «بعضنا»، «بعض الشر»، «من بعض». فالبيت كله موازنة بين أجزاء."
    - title: "الأمر بمعنى الرجاء"
      text: "«فاستبق» أمر لفظًا، لكنه من المقتول إلى الملك رجاء لا أمر. ولعل هذا ما عناه ابن رَشِيق بقوله: «على أن في بيت طَرَفَة بعض الضراعة» [@ibn-rashiq، ج1 ص194]، أي شيئًا من التذلل."
  connection: "ثم يقسم أنه هالك، ويتوعد قاتليه بغارة من تَغْلِب."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الضاد المكسورة"
  scansion: "أَبَا مُنْ / ذِرِنْ أَفْنَيْ / تَ فَسْتَبْ / قِ بَعْضَنَا = فعولن / مفاعيلن / فعولن / مفاعلن — حَنَانَيْ / كَ بَعْضُشْ شَرْ / رِ أَهْوَ / نُ مِنْ بَعْضِي = فعولن / مفاعيلن / فعولُ / مفاعيلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلة الثالثة من العَجُز [@atiq، ص29]. والعَرُوض «مفاعلن» مقبوضة كعادة الطويل، أما الضرب في هذه القصيدة فصحيح «مفاعيلن»، وهو أحد أضرب الطويل الثلاثة [@atiq، ص28–29]."
context: "قال ابن رَشِيق إن طَرَفَة قاله «لما أيقن بالموت» [@ibn-rashiq، ج1 ص194]. وقال الميداني: «هذا من قول طَرَفَة بن العبد حين أمر النعمان بقتله» [@maydani، ج1 ص94]. والنعمان بن المنذر ملك الحيرة من سنة 580 إلى 602م، وعَمْرو بن هند من 554 إلى 569م [@deif، ج1 ص45]؛ وطَرَفَة قُتل في ملك عَمْرو كما تُجمع رواياته. فذكر النعمان عند الميداني وهم، أو أن البيت قيل في غير هذه القصة."
