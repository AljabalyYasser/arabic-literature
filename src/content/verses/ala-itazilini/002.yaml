first: "أَبَا مُنْذِرٍ كَانَتْ غُرُورًا صَحِيفَتِي"
second: "وَلَمْ أُعْطِكُمْ بِالطَّوْعِ مَالِي وَلَا عِرْضِي"
meaning: "يا أبا منذر، كانت الصحيفة التي حملتها خدعة، ولم أعطكم مالي ولا عرضي طائعًا. أي أنه لم يسلّم نفسه للقتل عن رضا، بل خُدع."
vocabulary:
  - term: "أَبَا مُنْذِرٍ"
    text: "كنية الملك الذي يخاطبه، وهو عند محقق الديوان عَمْرو بن هند [@diwan-tarafa، ص53، الحاشية]."
  - term: "غُرُورًا"
    text: "خداعًا."
  - term: "صَحِيفَتِي"
    text: "الكتاب الذي حمله إلى عامل البحرين، وفيه الأمر بقتله [@ibn-al-anbari، ص125، ص127]."
  - term: "عِرْضِي"
    text: "ما يصونه المرء من نفسه وحسبه."
syntax:
  - "«أبا منذر» منادى بحرف نداء محذوف، منصوب بالألف لأنه من الأسماء الخمسة."
  - "«كانت» فعل ناقص، و«صحيفتي» اسمها مؤخر، و«غرورًا» خبرها مقدم."
  - "«بالطوع» متعلق بـ«أعطكم»، و«مالي» مفعول به ثانٍ، و«عرضي» معطوف عليه، و«لا» زائدة لتأكيد النفي."
morphology:
  - "«غُرُور» مصدر «غرّ» بمعنى خدع، وقع خبرًا للمبالغة: الصحيفة نفسها خدعة."
  - "«أُعْطِ» مضارع «أعطى» مجزوم بـ«لم» بحذف الياء."
rhetoric:
  thesis: "بيت يعترف فيه الشاعر بأنه خُدع، ويرد التهمة عن نفسه: لم يسلّم ماله ولا عرضه طوعًا."
  devices:
    - title: "الإخبار بالمصدر"
      text: "لم يقل «كانت صحيفتي خادعة»، بل «كانت غرورًا»، فجعل الصحيفة هي الخديعة نفسها. والإخبار بالمصدر من المبالغة."
    - title: "النداء بالكنية"
      text: "نادى الملك بكنيته «أبا منذر» لا باسمه ولا بلقبه، فالخطاب مباشر، كأن الملك حاضر يسمعه."
  connection: "ثم يطلب منه أن يبقي بعضهم: «حنانيك بعض الشر أهون من بعض»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الضاد المكسورة"
  scansion: "أَبَا مُنْ / ذِرِنْ كَانَتْ / غُرُورَنْ / صَحِيفَتِي = فعولن / مفاعيلن / فعولن / مفاعلن — وَلَمْ أُعْ / طِكُمْ بِطْطَوْ / عِ مَالِي / وَلَا عِرْضِي = فعولن / مفاعيلن / فعولن / مفاعيلن"
  note: "لم يدخل القَبْض حشو البيت. والعَرُوض «مفاعلن» مقبوضة كعادة الطويل، أما الضرب في هذه القصيدة فصحيح «مفاعيلن»، وهو أحد أضرب الطويل الثلاثة [@atiq، ص28–29]."
context: "ينسبه ابن رَشِيق مع البيت التالي إلى طَرَفَة «لما أيقن بالموت». وقد عدّه في الشعراء الذين يستوي شعرهم «في رويته وبديهته سواء عند الأمن والخوف؛ لقدرته، وسكون جأشه وقوة غريزته»، ثم استدرك بعد أن أورد البيتين: «على أن في بيت طَرَفَة بعض الضراعة» [@ibn-rashiq، ج1 ص193–194]. والضراعة: الخضوع والتذلل."
