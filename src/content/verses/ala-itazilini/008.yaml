explained: false
first: تَمِيلُ عَلَى الْعَبْدِيِّ فِي حَدِّ أَرْضِهِ
second: وَكَعْبُ بْنُ سَهْلٍ تَخْتَرِمْهُ عَنِ الْمَحْضِ
vocabulary:
- term: الْعَبْدِيِّ
  text: المنسوب إلى عبد القيس. وكان عامل عَمْرو بن هند على البحرين وهجر «فيما يزعمون رَبِيعة بن الحارِث العبدي، وهو الذي كتب إليه في شأن طَرَفَة والمتلمس» [@ibn-al-anbari، ص123]. ويقول محققا الديوان إنه «عامل الملك الذي حبس طرفة للقتل، أو أنه أراد به «عبد عمرو» الذي وشى به إلى عمرو بن هند» [@diwan-tarafa، ص170، الحاشية].
- term: كَعْبُ بْنُ سَهْلٍ
  text: 'لم نجد له خبرًا، ويقول محققا الديوان: «لعله ممن حرضوا عمرو بن هند على قتله» [@diwan-tarafa، ص170، الحاشية].'
- term: تَخْتَرِمْهُ
  text: تستأصله؛ «اخترمهم الدهر... أي اقتطعهم واستأصلهم» [@lisan، ج12 ص172].
- term: الْمَحْضِ
  text: اللبن الخالص «لم يخالطه ماء» [@lisan، ج7 ص227].
