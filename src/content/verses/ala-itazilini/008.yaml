explained: false
first: تَمِيلُ عَلَى الْعَبْدِيِّ فِي جَوِّ دَارِهِ
second: وَعَوْفَ بْنَ سَعْدٍ تَخْتَرِمْهُ عَنِ الْمَحْضِ
vocabulary:
- term: الْعَبْدِيِّ
  text: المنسوب إلى عبد القيس. وكان عامل عَمْرو بن هند على البحرين وهجر «فيما يزعمون رَبِيعة بن الحارِث العبدي، وهو الذي كتب إليه في شأن طَرَفَة والمتلمس» [@ibn-al-anbari، ص123]. وعند محقق الديوان أنه عبد عَمْرو بن بشر [@diwan-tarafa، ص54، الحاشية].
- term: جَوِّ دَارِهِ
  text: 'داخلها؛ «وجوّ كل شيء: بطنه وداخله» [@lisan، ج14 ص157].'
- term: تَخْتَرِمْهُ
  text: تستأصله؛ «اخترمهم الدهر... أي اقتطعهم واستأصلهم» [@lisan، ج12 ص172].
- term: الْمَحْضِ
  text: اللبن الخالص «لم يخالطه ماء» [@lisan، ج7 ص227]. وفسّره محقق الديوان بصدق الودّ [@diwan-tarafa، ص54، الحاشية].
