first: "فَطَارَ بِقِحْفِ ابْنَةِ الجِنِّ ذُو"
second: "سَفَاسِقَ قَدْ أَخْلَقَ المِحْمَلَا"
vocabulary:
  - term: "بِقِحْفِ ابْنَةِ الجِنِّ"
    text: "بعظم رأس الغول، «القحف: العظم الذي فوق الدماغ» [@lisan، ج9 ص275]."
  - term: "ذُو سَفَاسِقَ"
    text: "السيف؛ يقول محقق «الشعر والشعراء»: «ذو سفاسق: هو السيف، وهي طرائقه التي يقال لها الفرند» [@ibn-qutayba، ج1 ص303]."
  - term: "أَخْلَقَ المِحْمَلَا"
    text: "أبلى حمالته لطول صحبته."
