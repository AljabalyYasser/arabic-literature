first: إِذَا اللَّيْلُ أَدْجَى وَاكْفَهَرَّ ظَلَامُهُ
second: وَصَاحَ مِنَ الأَفْرَاطِ بُومٌ جَوَاثِمُ
vocabulary:
- term: أَدْجَى وَاكْفَهَرَّ
  text: أظلم واشتدّت ظلمته.
- term: الأَفْرَاطِ
  text: 'رؤوس الآكام: «والفَرْط: رأْس الأَكَمَة وَشَخْصُهَا، وَجَمْعُهُ أَفْراط» [@lisan، ج7 ص370].'
- term: جَوَاثِمُ
  text: لاطئة بالأرض.
