first: تَقُولُ سُلَيْمَى لا تَعَرَّضْ لِتَلْفَةٍ
second: وَلَيْلُكَ عَنْ لَيْلِ الصَّعالِيكِ نائِمُ
vocabulary:
- term: سُلَيْمَى
  text: سَلْمى، وكانت «بنت سيدهم وعن رأيها كانوا يصدرون» [@qali، ج2 ص121].
- term: لا تَعَرَّضْ لِتَلْفَةٍ
  text: لا تعرّض نفسك للهلاك.
- term: الصَّعالِيكِ
  text: الفقراء الذين يعيشون بالغارات.
