- term: المَذَاكِي
  text: الخيل التي تمّت أسنانها وقوّتها.
- term: الصَّلَادِمُ
  text: '«الصِّلْدِمُ والصُّلادِمُ: الشَّدِيدُ الحافرِ» [@lisan، ج12 ص342].'
