explained: false
first: فَإِنَّ حَرِيمًا إِنْ رَجا أَنْ أَرُدَّها
second: وَيَذْهَبَ مالِي يا ابْنَةَ القَيْلِ حالِمُ
vocabulary:
- term: حَرِيمًا
  text: حَرِيم المُراديّ الذي أغار على إبله.
- term: أَرُدَّها
  text: أرد الإبل التي غنمتها منه.
- term: القَيْلِ
  text: الملك من ملوك اليمن، يخاطب سَلْمى.
- term: حالِمُ
  text: واهم كمن يرى رؤيا في نومه.
sources:
- source: qali
