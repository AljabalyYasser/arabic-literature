first: إِذا جَرَّ مَوْلانا عَلَيْنا جَرِيرَةً
second: صَبَرْنا لَها إِنّا كِرامٌ دَعائِمُ
vocabulary:
- term: مَوْلانا
  text: ابن عمنا أو حليفنا.
- term: جَرِيرَةً
  text: جناية يُطالَب بها قومه.
- term: دَعائِمُ
  text: سادة يقوم بهم أمر القوم.
