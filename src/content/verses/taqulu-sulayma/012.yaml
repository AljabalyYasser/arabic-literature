first: "إِذَا كَلَّ أَمْهَيْتُهُ بِالصَّفَا"
second: "فَحَدَّ وَلَمْ أَرَهُ صَيْقَلَا"
vocabulary:
  - term: "كَلَّ"
    text: "نبا وضعف حدّه."
  - term: "أَمْهَيْتُهُ"
    text: "أحددته، «الممهى المحدّد، من أمهيت الحديدة» [@lisan، ج12 ص565]."
  - term: "فَحَدَّ"
    text: "صار حادّاً."
  - term: "صَيْقَلَا"
    text: "صانعاً يجلو السيوف."
