first: غَمُوضٌ إِذَا عَضَّ الكَرِيهَةَ لَمْ يَدَعْ
second: لَهُ طَمَعًا طَوْعُ اليَمِينِ مُلَازِمُ
vocabulary:
- term: غَمُوضٌ
  text: يغيب في ما يضربه.
- term: الكَرِيهَةَ
  text: الحرب، أو الضربة في شدّتها.
- term: طَوْعُ اليَمِينِ
  text: منقاد لليد التي تحمله.
