explained: false
first: "لَقَدْ بَالَيْتُ مَظْعَنَ أُمِّ أَوْفَى"
second: "وَلَكِنْ أُمُّ أَوْفَى لَا تُبَالِي"
vocabulary:
  - term: "بَالَيْتُ"
    text: "من المبالاة [@sharh-thalab-zuhayr، ص257]. يقول الأَعْلَم: «ولمّا ظعنت باليتُ مظعنها، واهتممت لفراقها» [@diwan-zuhayr، ص166]."
  - term: "مَظْعَنَ"
    text: "«مظعنها: مسيرها، من قولك: ظعنت تظعن ظعنًا» [@sharh-thalab-zuhayr، ص257]."
