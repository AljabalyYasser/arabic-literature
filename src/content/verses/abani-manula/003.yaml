    text: "ينقل المحققان عن المرزوقي أن المراد: «هوّني عليك الأمر وانقبضي منزوية عنهم» [@mufaddaliyyat، ص352، الحاشية]."
  - term: "سَرْبَهَا"
    text: "السَّرْب: الإبل وما رعي من المال [@mufaddaliyyat، ص352، الحاشية]."
  - term: "حُلُولُ"
    text: "الجماعات [@mufaddaliyyat، ص352، الحاشية]، أي جماعات نازلة."
