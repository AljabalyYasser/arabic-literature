explained: false
first: "فَإِذَا فَزِعْتُ عَدَتْ بِبَزِّي نَهْدَةٌ"
second: "جَرْدَاءُ مُشْرِفَةُ الْقَذَالِ دَؤُولُ"
vocabulary:
  - term: "فَزِعْتُ"
    text: "أجبت وأغثت [@mufaddaliyyat، ص352، الحاشية]."
  - term: "بِبَزِّي"
    text: "البَزّ: السلاح [@mufaddaliyyat، ص352، الحاشية]."
  - term: "نَهْدَةٌ"
    text: "الضخمة [@mufaddaliyyat، ص352، الحاشية]، يعني فرسه."
  - term: "جَرْدَاءُ"
    text: "القصيرة الشعر [@mufaddaliyyat، ص352، الحاشية]."
  - term: "مُشْرِفَةُ الْقَذَالِ"
    text: "يريد عنقها، وذلك مدح في الخيل [@mufaddaliyyat، ص352، الحاشية]."
  - term: "دَؤُولُ"
    text: "التي تدأل في مشيها، وهو مثل مشي المثقل بحمل قد أثقله [@mufaddaliyyat، ص352، الحاشية]."
