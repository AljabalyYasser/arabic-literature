first: "وَبَنُو أُمَيَّةَ كُلُّهُمْ أُمَرَاؤُهَا"
second: "وَبَنُو رِيَاحٍ إِنْ تُدُبِّرَ قِيلُ"
vocabulary:
  - term: "قِيلُ"
    text: "القيل والقال والقول واحد [@mufaddaliyyat، ص352، الحاشية]."
  - term: "إِنْ تُدُبِّرَ"
    text: "أي نُظر في عاقبته وتُفُكّر فيها [@mufaddaliyyat، ص352، الحاشية]. والبيت تهكّم: كلهم أمراء أصحاب رأي."
