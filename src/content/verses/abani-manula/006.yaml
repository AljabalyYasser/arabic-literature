explained: false
first: "شَوْهَاءُ مِرْكَضَةٌ إِذَا طَأْطَأْتُهَا"
second: "مَرَطَى إِذَا ابْتَلَّ الْحِزَامُ نَسُولُ"
vocabulary:
  - term: "شَوْهَاءُ"
    text: "الحسنة الخلق الكاملة حسنًا، وهو من الأضداد [@mufaddaliyyat، ص352، الحاشية]."
  - term: "مِرْكَضَةٌ"
    text: "التي تركض الأرض بقوائمها إذا عدت [@mufaddaliyyat، ص352، الحاشية]."
  - term: "طَأْطَأْتُهَا"
    text: "أرسلت من لجامها لتسرع [@mufaddaliyyat، ص352، الحاشية]."
  - term: "مَرَطَى"
    text: "التي تمرط السير كأنها تقطعه لسرعتها، أو هو ضرب من العدو فوق التقريب [@mufaddaliyyat، ص352، الحاشية]."
  - term: "إِذَا ابْتَلَّ الْحِزَامُ"
    text: "إذا عرقت من الجري."
  - term: "نَسُولُ"
    text: "التي تنسل في السير، أي تسرع [@mufaddaliyyat، ص352، الحاشية]."
