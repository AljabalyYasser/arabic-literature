explained: false
first: "حَلَقٌ أَحَلُّوهَا الْفَضَاءَ كَأَنَّهُمْ"
second: "مِنْ بَيْنِ مَنْبِجَ وَالْكَثِيبِ قُيُولُ"
vocabulary:
  - term: "حَلَقٌ"
    text: "جمع حَلْقة [@mufaddaliyyat، ص352، الحاشية]، أي جماعات."
  - term: "قُيُولُ"
    text: "جمع قَيْل، وهو الملك أو الرئيس دون الملك. ويقول المرزوقي فيما ينقل المحققان إن الكلام فيه تهكّم، وكأنهم «قيول من مقاول حمير» [@mufaddaliyyat، ص352، الحاشية]."
