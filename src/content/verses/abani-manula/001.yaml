explained: false
first: "أَبَنِي مَنُولَةَ قَدْ أَطَعْتَ سَرَاتَكُمْ"
second: "لَوْ كَانَ عَنْ حَرْبِ الصَّدِيقِ سَبِيلُ"
vocabulary:
  - term: "مَنُولَةَ"
    text: "بالنون، وبنو منولة: ظالم ومازن وشَمْخ أولاد فَزارة بن ذُبْيان، ومنولة أمهم [@mufaddaliyyat، ص352، الحاشية]. وروايتها عند أبي عِكْرِمة «مثولة» بالثاء، ويقول المحققان إنهما لم يجدا ما يؤيدها [@mufaddaliyyat، ص352، الحاشية]."
  - term: "قَدْ أَطَعْتَ سَرَاتَكُمْ"
    text: "يخاطب نفسه: لقد كنت أطيع سادتكم، أي رؤساءكم، لو وجدت مفرًّا من حرب أصدقائه، كما يقول المحققان في عرض القصيدة [@mufaddaliyyat، ص352، الحاشية]."
  - term: "حَرْبِ الصَّدِيقِ"
    text: "أراد بالصديق بني اللقيطة من فزارة [@mufaddaliyyat، ص352، الحاشية]، وهم الذين يُعدّ لقتالهم في آخرها."
