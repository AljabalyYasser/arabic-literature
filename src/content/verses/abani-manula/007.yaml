    text: "حِصْن ومالك ومعاوية ووَرْد وشَريك، بنو حُذَيْفة بن بدر الفزاري، واللقيطة لقب أمهم [@mufaddaliyyat، ص353، الحاشية]."
  - term: "شَلِيلُ"
    text: "الدرع [@mufaddaliyyat، ص353، الحاشية]."
