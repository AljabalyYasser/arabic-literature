explained: false
first: "وَمُجَرِّبُ النَّجَدَاتِ لَيْسَ بِنَاكِلٍ"
second: "عَنْهُ إِذَا لَاقَى الْقَبِيلَ قَبِيلُ"
vocabulary:
  - term: "وَمُجَرِّبُ النَّجَدَاتِ"
    text: "عطف على «رمحي»، يريد بذلك نفسه. والنجدات: الشدائد، الواحدة نجدة [@mufaddaliyyat، ص353، الحاشية]."
  - term: "بِنَاكِلٍ"
    text: "بجبان يرجع عن قِرنه."
  - term: "الْقَبِيلَ"
    text: "الجماعة من الناس، من الثلاثة فصاعدًا، وربما أُطلق على القبيلة [@mufaddaliyyat، ص353، الحاشية]."
