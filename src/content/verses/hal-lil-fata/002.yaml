explained: false
first: "قَدْ رَجَّلُونِي وَمَا رُجِّلْتُ مِنْ شَعَثٍ"
second: "وَأَلْبَسُونِي ثِيَابًا غَيْرَ أَخْلَاقِ"
vocabulary:
  - term: "رَجَّلُونِي"
    text: "سرّحوا شعري، و«الترجيل: مشط الشعر وإرساله» [@lisan، ج6 ص265]."
  - term: "شَعَثٍ"
    text: "يقول محققا «المفضليات»: «الشعث: تفرق الشعر وانتفاشه» [@mufaddaliyyat، ص300، الحاشية]. أي لم يكن شعري مشعّثًا فيحتاج إلى ترجيل، وإنما فعلوه لأني ميت."
  - term: "أَخْلَاقِ"
    text: "يقول المحققان: «الأخلاق: الممزقة البالية» [@mufaddaliyyat، ص300، الحاشية]، يعني الكفن الجديد."
