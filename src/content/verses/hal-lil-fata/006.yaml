explained: false
first: "كَأَنَّنِي قَدْ رَمَانِي الدَّهْرُ عَنْ عُرُضٍ"
second: "بِنَافِذَاتٍ بِلَا رِيشٍ وَأَفْوَاقِ"
vocabulary:
  - term: "عَنْ عُرُضٍ"
    text: "من حيث لا يبالي، كقولهم: «يضربون الناس عن عرض أي عن شق وناحية لا يبالون من ضربوا» [@lisan، ج7 ص177]."
  - term: "بِنَافِذَاتٍ"
    text: "يقول محقق التِّبْرِيزِيّ: «والنافذات: السهام النافذة» [@tabrizi-ikhtiyarat، ج3 ص1290، الحاشية]."
  - term: "وَأَفْوَاقِ"
    text: "جمع فُوق، وهو من السهم «موضع الوتر منه» [@lisan، ج10 ص319]. فسهام الدهر لا ريش لها ولا أفواق، أي لا تُرى ولا يُعرف راميها."
