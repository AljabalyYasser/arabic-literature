explained: false
first: "وَأَرْسَلُوا فِتْيَةً مِنْ خَيْرِهِمْ حَسَبًا"
second: "لِيُسْنِدُوا فِي ضَرِيحِ التُّرْبِ أَطْبَاقِي"
vocabulary:
  - term: "لِيُسْنِدُوا"
    text: "«أي: أرسلوهم، ليحفروا قبرا» [@tabrizi-ikhtiyarat، ج3 ص1291]، فيضعوه فيه."
  - term: "ضَرِيحِ"
    text: "الشقّ في القبر، و«الضريح والضريحة: ما كان في وسطه» [@lisan، ج3 ص388]."
  - term: "أَطْبَاقِي"
    text: "يقول محققا «المفضليات»: «الأطباق: المفاصل، واحدها طبق» [@mufaddaliyyat، ص300، الحاشية]، يريد جسده."
