first: "وَرَفَّعُونِي وَقَالُوا أَيُّمَا رَجُلٍ"
second: "وَأَدْرَجُونِي كَأَنِّي طَيُّ مِخْرَاقِ"
vocabulary:
  - term: "وَأَدْرَجُونِي"
    text: "لفّوني في الكفن، و«أدرج الميت في الكفن والقبر: أدخله» [@lisan، ج2 ص269]."
  - term: "طَيُّ مِخْرَاقِ"
    text: "«يعني بطيّ المخراق: المئزر الذي يلويه الصبيان، يضرب بعضهم به بعضا» [@tabrizi-ikhtiyarat، ج3 ص1291]."
