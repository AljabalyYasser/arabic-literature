first: "إِذَا حَاصَ عَيْنَيْهِ كَرَى النَّوْمِ لَمْ يَزَلْ"
second: "لَهُ كَالِئٌ مِنْ قَلْبِ شَيْحَانَ فَاتِكِ"
vocabulary:
  - term: "حَاصَ عَيْنَيْهِ"
    text: "أطبقهما كأنما خاطهما، وفي رواية القالي «خاط» [@qali، ج2 ص138]."
  - term: "كَالِئٌ"
    text: "حارس."
  - term: "شَيْحَانَ"
    text: "«والشيحان: الحادّ في كل أمر» [@qali، ج2 ص138]."
  - term: "فَاتِكِ"
    text: "الجريء [@lisan، ج10 ص472]."
