explained: false
first: "يَرَى الوَحْشَةَ الأُنْسَ الأَنِيسَ وَيَهْتَدِي"
second: "بِحَيْثُ اهْتَدَتْ أُمُّ النُّجُومِ الشَّوَابِكِ"
vocabulary:
  - term: "الوَحْشَةَ"
    text: "الخلوة في القفر."
  - term: "أُمُّ النُّجُومِ"
    text: "المجرّة، يدل عليه قولهم «وحوّلت المجرّة» في شرح بيت ذي الرُّمّة «إذا حوّلت أمّ النجوم الشوابك» [@lisan، ج11 ص194]."
  - term: "الشَّوَابِكِ"
    text: "المشتبكة، «وشبكت النجوم واشتبكت وتشابكت: دخل بعضها في بعض» [@lisan، ج10 ص447]."
