first: "وَيَجْعَلُ عَيْنَيْهِ رَبِيئَةَ قَلْبِهِ"
second: "إِلَى سَلَّةٍ مِنْ حَدِّ أَخْلَقَ صَائِكِ"
vocabulary:
  - term: "رَبِيئَةَ قَلْبِهِ"
    text: "طليعته، «والربيئة: الطليعة» [@lisan، ج1 ص82]."
  - term: "سَلَّةٍ"
    text: "سلّ السيف من غمده."
  - term: "أَخْلَقَ صَائِكِ"
    text: "سيف أملس لزق به الدم، «الصائق والصائك اللازق» [@lisan، ج10 ص208]."
