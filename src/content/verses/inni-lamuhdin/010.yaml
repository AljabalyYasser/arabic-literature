first: "إِذَا طَلَعَتْ أُولَى العَدِيِّ فَنَفْرُهُ"
second: "إِلَى سَلَّةٍ مِنْ صَارِمِ الغَرْبِ بَاتِكِ"
vocabulary:
  - term: "أُولَى العَدِيِّ"
    text: "أوائل «الجماعة الذين يعدون في الحرب» [@qali، ج2 ص138]."
  - term: "فَنَفْرُهُ"
    text: "ففزعه ونهوضه."
  - term: "صَارِمِ الغَرْبِ"
    text: "سيف قاطع الحدّ."
  - term: "بَاتِكِ"
    text: "قاطع، «البتك: القطع» [@lisan، ج10 ص395]."
