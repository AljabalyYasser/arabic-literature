explained: false
first: أَلَا أَبْلِغَا عَبْدَ الضَّلَالِ رِسَالَةً
second: وَقَدْ يُبْلِغُ الْأَنْبَاءَ عَنْكَ رَسُولُ
vocabulary:
- term: عَبْدَ الضَّلَالِ
  text: 'يريد عبد عَمْرو بن بِشْر، ونسبه إلى الضلال، كما يقول الأعلم، لأنه «وشى به إلى عمرو بن هند» [@diwan-tarafa، ص90]. وعنوان القصيدة عنده: «وقال أيضا في عبد عمرو بن بشر بن مرثد» [@diwan-tarafa، ص89].'
