first: وَأَنْتَ عَلَى الْأَقْصَى صَبًا غَيْرُ قَرَّةٍ
second: تَذَاءَبُ مِنْهَا مُرْزِغٌ وَمُسِيلُ
vocabulary:
- term: الْأَقْصَى
  text: البعيد.
- term: صَبًا
  text: ريح الصَّبا، وهي ريح لينة.
- term: قَرَّةٍ
  text: باردة.
- term: تَذَاءَبُ
  text: '«وتذأبت الريح وتذاءبت: اختلفت، وجاءت من هنا وهنا» [@lisan، ج1 ص378].'
- term: مُرْزِغٌ وَمُسِيلُ
  text: مطر يُحدث الوحل، ومطر يُسيل الأودية.
