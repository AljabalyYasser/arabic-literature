explained: false
first: فَأَصْبَحْتَ فَقْعًا نَابِتًا بِقَرَارَةٍ
second: تَصَوَّحُ عَنْهُ وَالذَّلِيلُ ذَلِيلُ
vocabulary:
- term: فَقْعًا
  text: كمأة بيضاء تنبت في الأرض المطمئنة، يُضرب بها المثل في الذلّ.
- term: بِقَرَارَةٍ
  text: '«والقرارة والقرار: ما قر فيه الماء» [@lisan، ج5 ص85].'
- term: تَصَوَّحُ
  text: 'تتشقق عنه وتيبس؛ «تصوح البقل وصوح: تم يبسه» [@lisan، ج2 ص519].'
