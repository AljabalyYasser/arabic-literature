explained: false
first: "أَلَا لَسْتُ فِي شَيْءٍ فَرُوحًا مُعَاوِيَا"
second: "وَلَا المُشْفِقَاتُ إِذْ تَبِعْنَ الحَوَازِيَا"
vocabulary:
  - term: "لَسْتُ فِي شَيْءٍ"
    text: "«كلام يائس مما يرجى أو يحذر» [@tabrizi-ikhtiyarat، ج3 ص1156]، أي لا أملك من أمري شيئًا."
  - term: "فَرُوحًا"
    text: "يقول محققا «المفضليات»: «فروح: كثير الفرح» [@mufaddaliyyat، ص261، الحاشية]. وفي رواية المَرْزُوقيّ «فرُوحَنْ»، أي امضِ يا معاوية [@tabrizi-ikhtiyarat، ج3 ص1155–1156]."
  - term: "مُعَاوِيَا"
    text: "رفيقه، «يقال له معاوية» [@ibn-qutayba، ج1 ص408]، ناداه مرخّمًا بحذف التاء."
  - term: "الحَوَازِيَا"
    text: "«وهن: الكواهن. الواحدة حازية» [@tabrizi-ikhtiyarat، ج3 ص1156]، و«الحازي: الذي ينظر في الأعضاء وفي خيلان الوجه يتكهن» [@lisan، ج14 ص174]. والمعنى عند التِّبْرِيزِيّ: «إني لا أقدر أن أدفع عني شيئا كتب علي، وكذا النساء المشفقات، إذ تبعن الكواهن يسألنهم، لا يغنين عمن أشفقن عليه شيئا» [@tabrizi-ikhtiyarat، ج3 ص1157]."
