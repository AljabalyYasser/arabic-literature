explained: false
first: "كَفَى حَزَنًا أَنْ يَرْحَلَ الحَيُّ غُدْوَةً"
second: "وَأُصْبِحَ فِي أَعْلَى إِلَاهَةَ ثَاوِيَا"
vocabulary:
  - term: "إِلَاهَةَ"
    text: "«وهي قارة بالسماوة» [@tabrizi-ikhtiyarat، ج3 ص1154]. ويروي ابن بَرِّيّ «ألاهة» بضم الهمزة، ويقول: «وهي مغارة سماوة كلب» [@lisan، ج13 ص471]."
  - term: "ثَاوِيَا"
    text: "«مقيما» [@tabrizi-ikhtiyarat، ج3 ص1159]، يعني مدفونًا."
