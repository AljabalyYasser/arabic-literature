explained: false
first: "فَطَأْ مُعْرِضًا إِنَّ الحُتُوفَ كَثِيرَةٌ"
second: "وَإِنَّكَ لَا تُبْقِي بِمَالِكَ بَاقِيَا"
vocabulary:
  - term: "فَطَأْ مُعْرِضًا"
    text: "«يخاطب صاحبه أو نفسه. يقول: أقدم على ما يعرض لك، واركب ما يعطيك ظهره، عالما أن أنواع المكاره كثيرة» [@tabrizi-ikhtiyarat، ج3 ص1158]."
  - term: "الحُتُوفَ"
    text: "«الحتف: الموت، وجمعه حتوف» [@lisan، ج9 ص38]."
  - term: "لَا تُبْقِي بِمَالِكَ بَاقِيَا"
    text: "«يريد: أن المال لا يحرسك، ولا يدفع مكروها عنك» [@tabrizi-ikhtiyarat، ج3 ص1158]."
