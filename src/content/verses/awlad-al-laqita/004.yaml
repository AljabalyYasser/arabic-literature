explained: false
first: "مَتَى تَقْرَؤُوهَا تَهْدِكُمْ مِنْ ضَلَالِكُمْ"
second: "وَتُعْرَفْ إِذَا مَا فُضَّ عَنْهَا الْخَوَاتِمُ"
vocabulary:
  - term: "تَقْرَؤُوهَا"
    text: "يعني الصحيفة. يقول: متى تروا هذه الطعنة تردعكم عن الظلم والتعدي، وجعلها كالصحيفة في بيانها [@mufaddaliyyat، ص354، الحاشية]."
  - term: "فُضَّ عَنْهَا الْخَوَاتِمُ"
    text: "كُسرت أختامها، كما تُفضّ الرسالة المختومة فتُقرأ."
