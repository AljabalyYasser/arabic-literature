first: "وَأَقْسَمَ يَأْتِي خُطَّةَ الضَّيْمِ طَائِعًا"
second: "بَلَى سَوْفَ تَأْتِيهَا وَأَنْفُكَ رَاغِمُ"
vocabulary:
  - term: "أَقْسَمَ يَأْتِي"
    text: "أي أقسم لا يأتي، وحذف حرف النفي مع القسم كثير [@mufaddaliyyat، ص354، الحاشية]."
  - term: "خُطَّةَ الضَّيْمِ"
    text: "الأمر الذي فيه ذلّ."
  - term: "رَاغِمُ"
    text: "ذليل ملصق بالرَّغام، وهو التراب [@mufaddaliyyat، ص354، الحاشية]."
