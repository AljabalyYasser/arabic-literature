first: "وَإِنَّ قَتِيلًا بِالْهَبَاءَةِ فِي اسْتِهِ"
second: "صَحِيفَتُهُ إِنْ عَادَ لِلظُّلْمِ ظَالِمُ"
meaning: "يقول لبني بدر: إن قتيلكم بالهباءة، وهو عمّهم حَمَل بن بدر، طُعن في استه، أي في دبره، عند فتحة الشرج، فبقيت الطعنة في ذلك الموضع كأنها صحيفة مكتوبة، أي رسالة يقرؤها كل ظالم يعود إلى الظلم، فيعرف ما جزاؤه. يقول المحققان إن القتيل حمل بن بدر، «قتل يوم الهباءة هو وإخوته»، قتلته عبس، و«طعن في ذلك الموضع من جسده»، و«عبر عن الطعنة بالصحيفة، كأنها وسم» [@mufaddaliyyat، ص353، الحاشية]. فالبيت يعيّرهم بأن عمّهم قُتل أشنع قتلة، مطعونًا في دبره، ويجعل هذا العار نفسه كتاب إنذار لهم."
vocabulary:
  - term: "الْهَبَاءَةِ"
    text: "«موضع به يوم من أيامهم» [@mufaddaliyyat، ص353، الحاشية]، قُتل فيه حُذَيْفة وحَمَل ابنا بدر."
  - term: "قَتِيلًا"
    text: "هو حَمَل بن بدر الفزاري، عمّ بني اللقيطة [@mufaddaliyyat، ص353، الحاشية]."
  - term: "اسْتِهِ"
    text: "الاسْت: المؤخرة، والمراد هنا الدبر، أي فتحة الشرج. في اللسان: «والاست العجز، وقد يراد بها حلقة الدبر» [@lisan، ج13 ص495]."
  - term: "صَحِيفَتُهُ"
    text: "«الصحيفة: التي يكتب فيها» [@lisan، ج9 ص186]، وأراد بها الطعنة، كأنها وسم أو كتاب مكتوب على جسده [@mufaddaliyyat، ص353، الحاشية]."
  - term: "إِنْ عَادَ لِلظُّلْمِ ظَالِمُ"
    text: "إن رجع ظالم إلى الظلم، فتلك صحيفته التي تنذره."
context: "قلب القطعة. في البيتين الأولين يقول إن بني اللقيطة يهجونه وهو لا يلتفت إليهم، ثم يضربهم في هذا البيت بمقتل عمّهم، وهي الضربة التي أعدّ لها. ويقول المحققان إنه يعيّرهم في القصيدة «بما كان من مقتل حمل بن بدر بأفحش قتلة»، وإنه روي «أنهم مثلوا به في يوم الهباءة ووضعوا لسانه في موضع من جسمه، كما أشار إلى ذلك صاحب العقد» [@mufaddaliyyat، ص353، الحاشية]. ثم يبني على كلمة «صحيفته» الأبيات الثلاثة بعده: تُقرأ، وتُفضّ عنها الخواتم، ويسألون عنها فوارس داحس."
syntax:
  - "«إِنَّ» حرف توكيد ونصب، و«قَتِيلًا» اسمها منصوب، و«بِالْهَبَاءَةِ» جار ومجرور متعلق بـ«قتيلًا»، أي قُتل بالهباءة."
  - "«فِي اسْتِهِ» جار ومجرور خبر مقدّم، و«صَحِيفَتُهُ» مبتدأ مؤخر، والجملة الاسمية «في استه صحيفته» في محل رفع خبر «إنّ». وقدّم الخبر لأن الموضع هو موضع العار الذي يريد أن يبدأ به."
  - "«إِنْ عَادَ لِلظُّلْمِ ظَالِمُ» جملة شرط، «ظالمُ» فاعل «عاد»، وجواب الشرط محذوف يدل عليه ما قبله: إن عاد ظالم إلى الظلم فهذه صحيفته. ويجوز أن تكون الجملة صفة للصحيفة في المعنى: صحيفة تُنذر من يعود."
morphology:
  - "«اسْت» همزتها همزة وصل، وأصلها «سَتَه» على «فَعَل»، كما في اللسان، والدليل أن جمعها «أستاه» [@lisan، ج13 ص495]. ولذلك تسقط همزتها في الدرج: «فِي اسْتِهِ» تُنطق «فِسْتِهِ»."
  - "«صَحِيفَة» على «فعيلة»، وجمعها «صحائف وصحف» [@lisan، ج9 ص186]."
  - "«قَتِيل» على «فعيل» بمعنى «مفعول»، أي مقتول."
  - "«ظَالِم» اسم فاعل من «ظلم»."
rhetoric:
  thesis: "هجاء فاحش يقوم على صورة واحدة: الطعنة في الدبر كتاب. فالشاعر لا يقول إن حملًا قُتل ذليلًا، بل يجعل جرحه في أقبح موضع رسالة مختومة، ويبني عليها ما بعدها."
  devices:
    - title: "الاستعارة في «صحيفته»"
      text: "سمّى الطعنة «صحيفة». والاستعارة عند عبد القاهر «أن يكون للفظ أصل في الوضع اللغوي معروف»، «ثم يستعمله الشاعر أو غير الشاعر في غير ذلك الأصل، وينقله إليه نقلا غير لازم، فيكون هناك كالعارية» [@asrar، ص30]. فالصحيفة أصلها ما يُكتب فيه، ونقلها الشاعر إلى الجرح، لأن الجرح في ذلك الموضع يحكي خبر صاحبه كما تحكي الصحيفة، ويبقى أثره كما تبقى الكتابة. ويقول المحققان: «كأنها وسم» [@mufaddaliyyat، ص353، الحاشية]، والوسم العلامة تُكوى في جلد البعير."
    - title: "التصريح بالعضو"
      text: "«فِي اسْتِهِ»: لا يكنّي الشاعر ولا يلمّح، بل يسمّي الدبر باسمه. والطعن في الدبر أشنع ما يُعيَّر به مقتول، لأنه لا يصيب إلا من ولّى ظهره أو أُخذ على غِرّة، فهو يعيّرهم بالذلّ والفرار معًا. وهذه قراءتنا، ولا يفصّلها المحققان."
    - title: "التهكّم"
      text: "«إِنْ عَادَ لِلظُّلْمِ ظَالِمُ»: يجعل العار موعظة. فالصحيفة التي يُكتب فيها العهد والأمر صارت إنذارًا لبني بدر أنفسهم: هذا ما يلقاه الظالم. ويقول المحققان في القصيدة كلها: «وهو تهكم بارع وإذلال قاتل» [@mufaddaliyyat، ص353، الحاشية]."
  connection: "ثم يمضي في الاستعارة: متى قرأتم هذه الصحيفة هدتكم من ضلالكم، وعُرف ما فيها إذا فُضّت عنها الخواتم."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المضمومة"
  scansion: "وَإِنْنَ / قَتِيلَنْ بِلْ / هَبَاءَ / تِفِسْتِهِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — صَحِيفَ / تُهُو إِنْ عَا / دَلِظْظُلْ / مِظَالِمُو = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبضُ، وهو حذف الخامس الساكن، «فعولن» في التفعيلتين الأولى والثالثة من الصدر، والأولى من العَجُز، فصارت «فعولُ»، وهو زحاف غير لازم [@atiq، ص29]. و«مفاعلن» في العروض والضرب مقبوضة، و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]. وتسقط همزة الوصل في «اسْتِهِ»، ويقصر حرف المد في «فِي» قبل الساكن، فتُنطق «فِسْتِهِي»."
