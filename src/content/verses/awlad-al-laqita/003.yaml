explained: false
first: "وَإِنَّ قَتِيلًا بِالْهَبَاءَةِ فِي اسْتِهِ"
second: "صَحِيفَتُهُ إِنْ عَادَ لِلظُّلْمِ ظَالِمُ"
vocabulary:
  - term: "الْهَبَاءَةِ"
    text: "موضع، به يوم من أيامهم [@mufaddaliyyat، ص353، الحاشية]."
  - term: "قَتِيلًا"
    text: "هو حَمَل بن بدر، من بني فزارة، قُتل يوم الهباءة هو وإخوته، قتله بنو عبس [@mufaddaliyyat، ص353، الحاشية]."
  - term: "فِي اسْتِهِ صَحِيفَتُهُ"
    text: "الاسْت: الدُّبُر، أي فتحة الشرج. يقول: طُعن حمل في دبره، فبقي أثر الطعنة هناك كأنه كتاب مكتوب. وفي حاشية المحققين: طُعن في ذلك الموضع من جسده، فعبّر عن الطعنة بالصحيفة، كأنها وسم [@mufaddaliyyat، ص353، الحاشية]."
  - term: "إِنْ عَادَ لِلظُّلْمِ ظَالِمُ"
    text: "تلك الطعنة كتاب يقرؤه كل ظالم يعود إلى الظلم، فيرتدع."
