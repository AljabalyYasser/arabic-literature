explained: false
first: "فَإِنْ تَسْأَلُوا عَنْهَا فَوَارِسَ دَاحِسٍ"
second: "يُنَبِّئْكَ عَنْهَا مِنْ رَوَاحَةَ عَالِمُ"
vocabulary:
  - term: "فَوَارِسَ دَاحِسٍ"
    text: "داحس والغبراء فرسان سُمّي بهما يوم من أيامهم معروف بين عبس وذبيان [@mufaddaliyyat، ص354، الحاشية]، وفوارس داحس: العبسيون [@mufaddaliyyat، ص353، الحاشية]."
  - term: "يُنَبِّئْكَ عَنْهَا مِنْ رَوَاحَةَ عَالِمُ"
    text: "يخبرك بخبر تلك الصحيفة عالم من بني رَواحة، وهم من فوارس داحس. وفي الأصمعيات «فوارس دارم» [@asmaiyyat، ص211]."
