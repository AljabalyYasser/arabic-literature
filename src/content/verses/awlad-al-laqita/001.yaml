first: "أَلَمْ يَنْهَ أَوْلَادَ اللَّقِيطَةِ عِلْمُهُمْ"
second: "بِزَبَّانَ إِذْ يَهْجُونَهُ وَهْوَ نَائِمُ"
vocabulary:
  - term: "أَوْلَادَ اللَّقِيطَةِ"
    text: "بنو حذيفة بن بدر الفزاري، كما في القصيدة السابقة [@mufaddaliyyat، ص353، الحاشية]."
  - term: "وَهْوَ نَائِمُ"
    text: "يقول: يهجونه وهو لا يعبأ بهم ولا يلتفت إليهم [@mufaddaliyyat، ص353، الحاشية]."
