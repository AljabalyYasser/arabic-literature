first: "يُطِيفُونَ بِالْأَعْشَى وَصُبَّ عَلَيْهِمُ"
second: "لِسَانٌ كَصَدْرِ الْهُنْدُوَانِيِّ صَارِمُ"
vocabulary:
  - term: "يُطِيفُونَ بِالْأَعْشَى"
    text: "يدورون حوله ويلوذون به. ولا يقول المحققان من الأعشى هنا، وفي الأصمعيات «يطوفون» [@asmaiyyat، ص211]."
  - term: "الْهُنْدُوَانِيِّ"
    text: "السيف المصنوع من حديد الهند."
  - term: "صَارِمُ"
    text: "قاطع."
