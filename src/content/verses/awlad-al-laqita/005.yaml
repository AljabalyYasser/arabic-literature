explained: false
first: "لَدَى مَرْبَطِ الْأَفْرَاسِ عِنْدَ أَبِيكُمُ"
second: "حَذَاكُمْ بِهَا صُلْبُ الْعَدَاوَةِ حَازِمُ"
vocabulary:
  - term: "مَرْبَطِ الْأَفْرَاسِ"
    text: "الإشارة إلى حَمَل بن بدر، صاحب الغبراء، كما يقول المحققان في عرض القصيدة [@mufaddaliyyat، ص353، الحاشية]."
  - term: "حَذَاكُمْ"
    text: "أعطاكم [@mufaddaliyyat، ص354، الحاشية]."
  - term: "صُلْبُ الْعَدَاوَةِ حَازِمُ"
    text: "عدوّ شديد العداوة، حازم في أمره، يعني الطاعن من عبس."
