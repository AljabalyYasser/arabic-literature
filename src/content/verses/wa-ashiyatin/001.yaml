explained: false
first: وَعَاشِيَةٍ رَاحَتْ بِطَانًا ذَعَرْتُهَا
second: بِسَوْطِ قَتِيلٍ وَسْطَهَا يُتَسَيَّفُ
vocabulary:
- term: وَعَاشِيَةٍ
  text: '«العاشية: الراعية ليلا من الإبل» [@aghani-dk، ج20 ص377، الحاشية].'
- term: رَاحَتْ بِطَانًا
  text: عادت إلى مباركها في المساء ممتلئة البطون من المرعى.
- term: ذَعَرْتُهَا
  text: أفزعتُها وطردتها.
- term: يُتَسَيَّفُ
  text: «أي يضرب بالسيف» [@maydani، ج2 ص10].
