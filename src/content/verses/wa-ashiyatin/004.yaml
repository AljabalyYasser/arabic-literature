first: وَبَاتُوا يَظُنُّونَ الظُّنُونَ وَصُحْبَتِي
second: إِذَا مَا عَلَوْا نَشْزًا أَهَلُّوا وَأَوْجَفُوا
vocabulary:
- term: نَشْزًا
  text: «مرتفعا من الأرض» [@aghani-dk، ج20 ص378، الحاشية].
- term: أَهَلُّوا
  text: رفعوا أصواتهم.
- term: وَأَوْجَفُوا
  text: «أي حملوها على الوجيف، وهو ضرب من السير» [@maydani، ج2 ص10]، يعني الإبل المطرودة.
