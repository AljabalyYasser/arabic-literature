explained: false
first: فَبَاتَ لَهَا أَهْلٌ خَلَاءٌ فِنَاؤُهُمْ
second: وَمَرَّتْ بِهِمْ طَيْرٌ فَلَمْ يَتَعَيَّفُوا
vocabulary:
- term: خَلَاءٌ فِنَاؤُهُمْ
  text: خلت ساحة بيتهم من الإبل.
- term: فَلَمْ يَتَعَيَّفُوا
  text: '«أي لم يزجروا الطير فيعلموا من جملتها أيقتل هذا أو يسلم» [@maydani، ج2 ص10]. والعِيافة: التفاؤل والتشاؤم بأسماء الطير وأصواتها ومرّها.'
