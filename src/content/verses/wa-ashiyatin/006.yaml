first: وَحَتَّى رَأَيْتُ الجُوعَ بِالصَّيْفِ ضَرَّنِي
second: إِذَا قُمْتُ تَغْشَانِي ظِلَالٌ فَأُسْدِفُ
vocabulary:
- term: بِالصَّيْفِ
  text: «خص الصيف دون الشتاء لأن بالصيف لا يكاد يجوع أحد لكثرة اللبن» [@maydani، ج2 ص10].
- term: فَأُسْدِفُ
  text: «يريد أدور فأدخل في السدفة وهي الظلمة، يعني يظلم بصرى من شدة الجوع» [@maydani، ج2 ص10].
