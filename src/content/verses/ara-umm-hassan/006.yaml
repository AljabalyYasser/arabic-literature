explained: false
first: فَإِنِّي لَمُسْتَافُ البِلَادِ بِسُرْبَةٍ
second: فَمُبْلِغُ نَفْسِي عُذْرَهَا أَوْ مُطَوِّفُ
vocabulary:
- term: لَمُسْتَافُ البِلَادِ
  text: 'قال ابن السِّكِّيت: «لمستاف من المسافة، أي: أنا سالك بُعدها» [@diwan-urwa، ص51].'
- term: بِسُرْبَةٍ
  text: بجماعة من الخيل.
- term: فَمُبْلِغُ نَفْسِي عُذْرَهَا أَوْ مُطَوِّفُ
  text: فإما أن أبلغ العذر فلا يلومني أحد، وإما أن أظل أطوف في طلب الغنى.
sources:
- source: diwan-urwa
  loc: ص51
