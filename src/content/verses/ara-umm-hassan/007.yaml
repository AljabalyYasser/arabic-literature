explained: false
first: رَأَيْتُ بَنِي لُبْنَى عَلَيْهِمْ غَضَاضَةٌ
second: بُيُوتُهُمُ وَسْطَ الحُلُولِ التَّكَنُّفُ
vocabulary:
- term: بَنِي لُبْنَى
  text: 'قال ابن السِّكِّيت: «بنو لبنى ليسوا بأهل غنى ولا يسر، فإذا جاوروا قومًا نزلوا ناحية كما ينزل الفقير في كنيف من شجر» [@diwan-urwa، ص51].'
- term: غَضَاضَةٌ
  text: '«وقوله: عليهم غضاضة، أي: يغضّون أبصارهم من الحياء من الناس» [@diwan-urwa، ص51].'
- term: التَّكَنُّفُ
  text: نزولهم في الكُنُف، وهي الحظائر.
sources:
- source: diwan-urwa
  loc: ص51
