first: "عَلَوْتُمْ مُلُوكَ النَّاسِ فِي الْمَجْدِ وَالتُّقَى"
second: "وَغَرْبِ نَدًى مِنْ عُرْوَةِ الْعِزِّ يَسْتَقِي"
vocabulary:
  - term: "غَرْبِ نَدًى"
    text: "الغَرْب: الدلو العظيمة، وأضافها إلى الندى، أي الكرم، مجازًا، كما يقول محققا الأصمعيات [@asmaiyyat، ص166]. يريد عطاء غزيرًا يُستقى من عزّهم."
