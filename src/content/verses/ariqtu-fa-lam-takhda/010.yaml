explained: false
first: "تُنَاخُ طَلِيحًا مَا تُرَاعُ مِنَ الشَّذَا"
second: "وَلَوْ ظَلَّ فِي أَوْصَالِهَا الْعَلُّ يَرْتَقِي"
vocabulary:
  - term: "طَلِيحًا"
    text: "معيية من السفر."
  - term: "الشَّذَا"
    text: "الأذى، أو ذباب أزرق يقع على الدواب، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص165]."
  - term: "الْعَلُّ"
    text: "القُراد، كما ينقل محققا الأصمعيات [@asmaiyyat، ص166]. يريد أنها من الإعياء لا تنفر من الذباب ولو دبّ القراد في مفاصلها."
