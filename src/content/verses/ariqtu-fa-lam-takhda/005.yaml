explained: false
first: "كَأَنَّ حَصَى الْمَعْزَاءِ عِنْدَ فُرُوجِهَا"
second: "نَوَادِي رَحًى رَضَّاخَةٍ لَمْ تُدَقِّقِ"
vocabulary:
  - term: "الْمَعْزَاءِ"
    text: "الأرض الصلبة الكثيرة الحصى."
  - term: "فُرُوجِهَا"
    text: "ما بين قوائمها."
  - term: "نَوَادِي رَحًى رَضَّاخَةٍ"
    text: "ما يتطاير من الرحى وهي ترضخ النوى، أي تكسره ولا تطحنه ناعمًا، كما يفسّرها محققا الأصمعيات [@asmaiyyat، ص165]. يريد أن الحصى يتطاير من تحت أخفافها لشدة سيرها."
sources:
  - source: "asmaiyyat"
    loc: "ص165"
