explained: false
first: "أُنِيخَتْ بِجَوٍّ يَصْرُخُ الدِّيكُ عِنْدَهَا"
second: "وَبَاتَتْ بِقَاعٍ كَادِئِ النَّبْتِ سَمْلَقِ"
vocabulary:
  - term: "بِجَوٍّ"
    text: "جَوّ: اسم اليمامة، وإنما تصيح الديكة في المدن، كما يقول محققا الأصمعيات [@asmaiyyat، ص165]."
  - term: "قَاعٍ"
    text: "أرض مستوية."
  - term: "كَادِئِ النَّبْتِ"
    text: "نبته قليل بطيء، أصابه البرد أو العطش، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص165]."
  - term: "سَمْلَقِ"
    text: "أرض مستوية جرداء لا شجر فيها."
sources:
  - source: "asmaiyyat"
    loc: "ص165"
