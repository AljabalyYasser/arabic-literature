explained: false
first: "كَأَنَّ نَضِيحَ الْبَوْلِ مِنْ قُبْلِ حَاذِهَا"
second: "مَلَابُ عَرُوسٍ أَوْ مَلَادِغُ أَزْرَقِ"
vocabulary:
  - term: "نَضِيحَ الْبَوْلِ"
    text: "رشاشه."
  - term: "قُبْلِ حَاذِهَا"
    text: "مقدَّم الحاذ، والحاذ ما يقع عليه الذَّنَب من الفخذين، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص165]."
  - term: "مَلَابُ عَرُوسٍ أَوْ مَلَادِغُ أَزْرَقِ"
    text: "المَلاب نوع من الطيب، والملادغ مواضع اللدغ، والأزرق الذباب الأزرق [@asmaiyyat، ص165]. يشبّه بقع البول اليابس على فخذيها بأثر الطيب أو بآثار لدغ الذباب."
