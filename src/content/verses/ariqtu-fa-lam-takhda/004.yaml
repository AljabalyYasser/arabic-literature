explained: false
first: "تَرَى أَوْ تَرَاءَى عِنْدَ مَعْقِدِ غَرْزِهَا"
second: "تَهَاوِيلَ مِنْ أَجْلَادِ هِرٍّ مُعَلَّقِ"
vocabulary:
  - term: "تَرَاءَى"
    text: "تتكلّف النظر."
  - term: "غَرْزِهَا"
    text: "الغَرْز للناقة مثل الحزام للفرس."
  - term: "تَهَاوِيلَ مِنْ أَجْلَادِ هِرٍّ"
    text: "أشياء مخيفة كأنها جسم هِرّ. ويقول محققا الأصمعيات: يريد كأن هرًّا عُلّق عند معقد حزامها ينشب فيها أظفاره، فهي تنفر وتسرع [@asmaiyyat، ص165]."
sources:
