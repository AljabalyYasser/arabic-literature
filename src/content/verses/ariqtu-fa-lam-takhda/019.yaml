first: "فَلَا أَنَا مَوْلَاهُمْ وَلَا فِي صَحِيفَةٍ"
second: "كَفَلْتُ عَلَيْهِمْ وَالْكَفَالَةُ تَعْتَقِي"
vocabulary:
  - term: "مَوْلَاهُمْ"
    text: "حليفهم أو وليّهم."
  - term: "صَحِيفَةٍ"
    text: "عهد مكتوب."
  - term: "تَعْتَقِي"
    text: "تحبس صاحبها، يريد أن الكفالة تحبس الكفيل على الوفاء بما كفل، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص166]."
