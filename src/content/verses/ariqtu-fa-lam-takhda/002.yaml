explained: false
first: "تَبِيتُ الْهُمُومُ الطَّارِقَاتُ يَعُدْنَنِي"
second: "كَمَا تَعْتَرِي الْأَهْوَالُ رَأْسَ الْمُطَلَّقِ"
vocabulary:
  - term: "الطَّارِقَاتُ"
    text: "التي تأتي ليلًا."
  - term: "يَعُدْنَنِي"
    text: "يعاودنني."
  - term: "الْمُطَلَّقِ"
    text: "الملدوغ يسكن وجعه ثم يعاوده، يقال: طُلِّق السليم، أي الملدوغ، إذا «رجعت إليه نفسه وسكن وجعه بعد العداد، فهو مطلق» [@lisan، ج10 ص231]. والعِداد: عودة الوجع في وقته. ويستشهد صاحب اللسان بهذا البيت."
