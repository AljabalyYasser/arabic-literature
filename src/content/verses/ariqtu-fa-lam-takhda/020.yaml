first: "وَظَنِّي بِهِ أَنْ لَا يُكَدِّرَ نِعْمَةً"
second: "وَلَا يَقْلِبَ الْأَعْدَاءَ مِنْهُ بِمَعْبَقِ"
vocabulary:
  - term: "يَقْلِبَ"
    text: "يردّ ويصرف."
  - term: "بِمَعْبَقِ"
    text: "من قولهم عَبِق بالمكان إذا لزمه وأقام به، يريد أنه لا يدع لأعدائه مستقرًّا، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص166]."
