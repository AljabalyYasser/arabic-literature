explained: false
first: "وَقَدْ تَخِذَتْ رِجْلِي لَدَى جَنْبِ غَرْزِهَا"
second: "نَسِيفًا كَأُفْحُوصِ الْقَطَاةِ الْمُطَرِّقِ"
vocabulary:
  - term: "تَخِذَتْ"
    text: "اتخذت."
  - term: "نَسِيفًا"
    text: "أثرًا تركه ركض رجله بجنب الناقة حين انحصّ عنه الوبر، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص165]."
  - term: "أُفْحُوصِ الْقَطَاةِ"
    text: "«والأفحوص: مجثم القطاة لأنها تفحصه» [@lisan، ج7 ص63]، أي الحفرة التي تجثم فيها القطاة على بيضها."
  - term: "الْمُطَرِّقِ"
    text: "التي حان خروج بيضها، ويقول محققا الأصمعيات إنها رُويت بفتح الراء وبكسرها، وإن الكسر أصح [@asmaiyyat، ص165]."
