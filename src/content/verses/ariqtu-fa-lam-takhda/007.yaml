explained: false
first: "وَقَدْ ضَمُرَتْ حَتَّى الْتَقَى مِنْ نُسُوعِهَا"
second: "عُرَى ذِي ثَلَاثٍ لَمْ تَكُنْ قَبْلُ تَلْتَقِي"
vocabulary:
  - term: "ضَمُرَتْ"
    text: "هزلت من طول السفر."
  - term: "نُسُوعِهَا"
    text: "سيور رحلها [@asmaiyyat، ص165]."
  - term: "عُرَى"
    text: "جمع عُرْوة، وهي الحلقة التي يُشدّ فيها السير. يريد أنها هزلت حتى التقت أطراف السيور التي لم تكن تلتقي حين كانت سمينة."
sources:
