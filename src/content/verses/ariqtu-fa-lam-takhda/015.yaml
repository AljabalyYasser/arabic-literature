explained: false
first: "أَحَقًّا أَبَيْتَ اللَّعْنَ أَنَّ ابْنَ فَرْتَنَا"
second: "عَلَى غَيْرِ إِجْرَامٍ بِرِيقِي مُشَرِّقِي"
vocabulary:
  - term: "أَبَيْتَ اللَّعْنَ"
    text: "تحية الملوك في الجاهلية: «كلمة كانت العرب تحيي بها ملوكها في الجاهلية» [@lisan، ج13 ص387]، أي أبيتَ أن تأتي ما تُلعن عليه."
  - term: "ابْنَ فَرْتَنَا"
    text: "«ابن فرتنى وابن ترنى يقالان للئيم» [@lisan، ج13 ص322]، أي ابن الأمة. يريد رجلًا وشى به عند الملك."
  - term: "بِرِيقِي مُشَرِّقِي"
    text: "يُغصّني بريقي، من الشَّرَق، وهو بالماء والريق كالغصص بالطعام، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص166]."
