explained: false
first: "تَرُوحُ وَتَغْدُو مَا يُحَلُّ وَضِينُهَا"
second: "إِلَيْكَ ابْنَ مَاءِ الْمُزْنِ وَابْنَ مُحَرِّقِ"
vocabulary:
  - term: "وَضِينُهَا"
    text: "الوَضِين بمنزلة الحزام [@asmaiyyat، ص166]، أي تسير إليه ليل نهار لا يُحلّ عنها رحلها."
  - term: "ابْنَ مَاءِ الْمُزْنِ وَابْنَ مُحَرِّقِ"
    text: "يقول محققا الأصمعيات: ابن ماء المزن يعني ابن ماء السماء، وهو اسم أم المُنْذِر الأكبر، ومُحَرِّق هو الحارث بن عمرو بن عَدِيّ [@asmaiyyat، ص166]. فهو ينسب الملك إلى بيت ملوك الحِيرة."
sources:
