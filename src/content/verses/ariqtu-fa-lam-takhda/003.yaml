explained: false
first: "وَنَاجِيَةٍ عَدَّيْتُ مِنْ عِنْدِ مَاجِدٍ"
second: "إِلَى وَاحِدٍ مِنْ غَيْرِ سُخْطٍ مُفَرِّقِ"
vocabulary:
  - term: "نَاجِيَةٍ"
    text: "ناقة سريعة."
  - term: "عَدَّيْتُ"
    text: "صرفتها وجاوزت بها."
  - term: "إِلَى وَاحِدٍ"
    text: "إلى رجل لا مثيل له، كأنه وحده، كما يفسّرها محققا الأصمعيات [@asmaiyyat، ص164]. ويروي ابن قُتَيْبة «إلى واجد»، أي غني [@ibn-qutayba، ج1 ص387]."
  - term: "مِنْ غَيْرِ سُخْطٍ مُفَرِّقِ"
    text: "لم يترك الأول عن غضب يفرّق بينهما."
