explained: false
first: "وَأَنْتَ عَمُودُ الدِّينِ مَهْمَا تَقُلْ يُقَلْ"
second: "وَمَهْمَا تَضَعْ مِنْ بَاطِلٍ لَا يُلَحَّقِ"
vocabulary:
  - term: "الدِّينِ"
    text: "السلطان والملك، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص166]."
  - term: "مَهْمَا تَضَعْ مِنْ بَاطِلٍ لَا يُلَحَّقِ"
    text: "ما تُسقطه من شيء وتبطله لا يُلحق بعد، كما يفسّره محققا الأصمعيات [@asmaiyyat، ص166]، فكلمته هي النافذة."
