explained: false
first: "فَإِنْ يُتْهِمُوا أُنْجِدْ خِلَافًا عَلَيْهِمُ"
second: "وَإِنْ يُعْمِنُوا مُسْتَحْقِبِي الْحَرْبِ أُعْرِقِ"
vocabulary:
  - term: "يُتْهِمُوا … أُنْجِدْ"
    text: "يأتوا تِهامة … آتي نَجْدًا، كما يفسّرهما محققا الأصمعيات [@asmaiyyat، ص166]."
  - term: "يُعْمِنُوا … أُعْرِقِ"
    text: "يأتوا عُمان … آتي العراق. يريد أنه يأخذ في غير طريقهم، فلا شأن له بهم."
  - term: "مُسْتَحْقِبِي الْحَرْبِ"
    text: "حاملي عبئها، كأنهم جعلوها حقيبة خلفهم [@asmaiyyat، ص166]."
sources:
