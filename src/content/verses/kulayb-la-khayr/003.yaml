first: "نَعَى النُّعَاةُ كُلَيْبًا لِي فَقُلْتُ لَهُمْ"
second: "مَالَتْ بِنَا الْأَرْضُ أَوْ زَالَتْ رَوَاسِيهَا"
meaning: "جاءني الناعون بخبر موت كُلَيْب، فقلت لهم: مالت بنا الأرض، أو زالت جبالها الثابتة."
vocabulary:
  - term: "نَعَى"
    text: "أخبر بالموت. و«النُّعاة»: الذين يحملون خبر الموت، واحدهم ناعٍ."
  - term: "رَوَاسِيهَا"
    text: "جبالها الثوابت، واحدتها راسية، من «رسا» إذا ثبت."
syntax:
  - "«نَعَى النُّعَاةُ كُلَيْبًا»: فعل وفاعل ومفعول به. و«لِي» متعلق بـ«نعى»."
  - "«فَقُلْتُ لَهُمْ»: الفاء عاطفة، والجملة معطوفة على «نعى»."
  - "«مَالَتْ بِنَا الْأَرْضُ»: فعل وفاعل، و«بنا» متعلق بـ«مالت». والجملة في محل نصب مقول القول."
  - "«أَوْ زَالَتْ رَوَاسِيهَا»: «أو» حرف عطف، و«رواسيها» فاعل «زالت» مرفوع بضمة مقدرة على الياء، والهاء مضاف إليه."
morphology:
  - "«النُّعَاة» جمع «ناعٍ» على «فُعَلة»، كقاضٍ وقُضاة، وأصله «نُعَيَة»، قُلبت الياء ألفًا لتحركها وانفتاح ما قبلها."
  - "«رَوَاسِي» جمع «راسية» على «فواعل»."
  - "«مَالَتْ» أجوف يائي من الميل، و«زَالَتْ» أجوف واوي من الزوال."
rhetoric:
  thesis: "لم يصف حزنه، بل روى ما قاله ساعة سمع الخبر: كأن الخبر زلزال."
  devices:
    - title: "الاستعظام"
      text: "جعل موت كُلَيْب حادثة في الكون: الأرض تميل، والجبال تزول. وهذا ما يطلبه ابن رَشِيق في رثاء السادة: أن يكون «ظاهر التفجع، بيّن الحسرة، مخلوطًا بالتلهف والأسف والاستعظام، إن كان الميت ملكًا أو رئيسًا كبيرًا» [@ibn-rashiq، ج2 ص147]."
    - title: "حكاية القول"
      text: "نقل كلامه بلفظه: «فقلت لهم...»، فنقل السامع إلى تلك اللحظة، كأنه حاضر حين جاء الناعي."
    - title: "«أو» بين صورتين"
      text: "جاء بصورتين يصف بهما هول الخبر، ولم يختر إحداهما: كأنه لا يدري أيهما أصدق في وصف ما وقع عليه."
  connection: "ثم يعدّد صفات كُلَيْب: «الحزم والعزم كانا من صنيعته»."
prosody:
  meter: "البحر البسيط"
  rhyme: "القافية «ـيها»"
  scansion: "نَعَنْ نُعَا / ةُ كُلَيْ / بَنْ لِي فَقُلْ / تُ لَهُمْ = متفعلن / فعِلن / مستفعلن / فعِلن — مَالَتْ بِنَلْ / أَرْضُ أَوْ / زَالَتْ رَوَا / سِيهَا = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ «مستفعلن» و«فاعلن» الأوليين من الصدر. والعروض مخبونة «فعِلن»، والضرب مقطوع «فعْلن» [@atiq، ص48]."
context: "يأتي بعد بيت يمدح فيه كُلَيْبًا: «كُلَيْبُ أيُّ فتى عزٍّ ومكرمة / تحت السقائف إذ يعلوك سافيها» [@iqd، ج6 ص73]."
