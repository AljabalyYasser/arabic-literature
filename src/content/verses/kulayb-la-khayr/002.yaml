first: كُلَيْبُ أَيُّ فَتَى عِزٍّ وَمَكْرُمَةٍ
second: تَحْتَ السَّقَائِفِ إِذْ يَعْلُوكَ سَافِيهَا
vocabulary:
- term: السَّقَائِفِ
  text: جمع سَقِيفة، وهي «كل خشبة عريضة كاللوح أو حجر عريض يستطاع أن يُسقَّف به قُترة أو غيرها» [@lisan، ج9 ص156]، يعني ما سُقف به قبره.
- term: سَافِيهَا
  text: 'ما تسفيه الريح عليها من التراب؛ يقال: «تراب سافٍ: مَسْفيّ» [@lisan، ج14 ص389].'
