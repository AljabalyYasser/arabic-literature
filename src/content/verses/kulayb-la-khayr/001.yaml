first: "كُلَيْبُ لَا خَيْرَ فِي الدُّنْيَا وَمَنْ فِيهَا"
second: "إِذْ أَنْتَ خَلَّيْتَهَا فِيمَنْ يُخَلِّيهَا"
meaning: "يا كُلَيْب، لا خير في الدنيا ولا في أهلها، بعد أن تركتها ومضيت مع من يتركونها، أي مع الموتى."
vocabulary:
  - term: "خَلَّيْتَهَا"
    text: "تركتها."
  - term: "فِيمَنْ يُخَلِّيهَا"
    text: "في جملة الذين يتركونها، وهم الموتى."
syntax:
  - "«كُلَيْبُ»: منادى بحرف نداء محذوف، مبني على الضم لأنه علم مفرد."
  - "«لَا خَيْرَ»: «لا» نافية للجنس، و«خيرَ» اسمها مبني على الفتح، و«فِي الدُّنْيَا» متعلق بمحذوف خبرها."
  - "«وَمَنْ فِيهَا»: «مَن» اسم موصول معطوف على «الدنيا» في محل جر، و«فيها» متعلق بمحذوف صلة الموصول."
  - "«إِذْ»: ظرف للزمن الماضي، فيه معنى التعليل، مضاف إلى الجملة بعده. و«أنت» مبتدأ، وجملة «خلّيتها» خبره."
  - "«فِيمَنْ»: «في» حرف جر، و«مَن» اسم موصول، والجار والمجرور متعلق بمحذوف حال من التاء في «خلّيتها». وجملة «يخلّيها» صلة."
morphology:
  - "«خَلَّيْتَ» على «فَعَّلْتَ» من «خلا»، ناقص واوي. والتضعيف للتعدية: خلا المكان، وخلّيته."
  - "«يُخَلِّي» مضارع «خلّى»، على «يُفَعِّل»."
  - "«الدُّنْيَا» على «فُعْلى»، مؤنث «الأدنى»: اسم تفضيل غلبت عليه الاسمية."
rhetoric:
  thesis: "يبدأ بالنداء كأن كُلَيْبًا حاضر يسمع، ثم ينفي الخير عن الدنيا كلها لأنه غاب عنها."
  devices:
    - title: "حذف حرف النداء"
      text: "قال «كُلَيْبُ» ولم يقل «يا كُلَيْب»، فكأن أخاه قريب منه لا يحتاج إلى أن يرفع له صوته."
    - title: "النفي العام"
      text: "«لا» النافية للجنس تنفي الخير كله، لا بعضه. ثم عطف «ومن فيها» فنفاه عن الناس أيضًا: لا شيء ولا أحد يعوّض كُلَيْبًا."
    - title: "التصدير"
      text: "جعل قافية البيت «يخلّيها» من لفظ «خلّيتها» في أثنائه. وهذا ما سماه ابن رَشِيق التصدير: «أن يرد أعجاز الكلام على صدوره، فيدل بعضه على بعض»، ومن أقسامه ما وافق آخرُ كلمة في البيت بعضَ ما فيه [@ibn-rashiq، ج2 ص3]. والمعنى في التكرار: أن موت كُلَيْب واحد من سنّة عامة، فكل الناس يخلّون الدنيا."
  connection: "ثم يمدحه: «كُلَيْبُ أيُّ فتى عزٍّ ومكرمة»."
prosody:
  meter: "البحر البسيط"
  rhyme: "القافية «ـيها»"
  scansion: "كُلَيْبُ لَا / خَيْرَ فِدْ / دُنْيَا وَمَنْ / فِيهَا = متفعلن / فاعلن / مستفعلن / فعْلن — إِذْ أَنْتَ خَلْ / لَيْتَهَا / فِيمَنْ يُخَلْ / لِيهَا = مستفعلن / فاعلن / مستفعلن / فعْلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن، «مستفعلن» الأولى فصارت «متفعلن». والضرب مقطوع «فعْلن»، وجاءت العَرُوض مثله لأن البيت مصرّع [@atiq، ص46–48]."
context: "يرويها ابن عبد رَبِّه بعد خبر مقتل كُلَيْب واستعداد المُهَلْهِل للحرب [@iqd، ج6 ص73]."
