explained: false
first: تَرَى الرِّمَاحَ بِأَيْدِينَا فَنُورِدُهَا
second: بِيضًا وَنُصْدِرُهَا حُمْرًا أَعَالِيهَا
vocabulary:
- term: نُورِدُهَا
  text: نُدخلها في الأعداء، كما تُورَد الإبل الماء.
- term: نُصْدِرُهَا
  text: نُخرجها بعد أن رويت، كما تُصدَر الإبل عن الماء.
sources:
- source: iqd
  loc: ج6 ص73
