explained: false
first: يُهَزْهِزُونَ مِنَ الْخَطِّيِّ مُدْمَجَةً
second: كُمْتًا أَنَابِيبُهَا زُرْقًا عَوَالِيهَا
vocabulary:
- term: الْخَطِّيِّ
  text: 'الرماح، نسبة إلى الخَطّ، وهو «أرض يُنسب إليها الرماح الخطية»، قيل: هو «خطّ عُمان» [@lisan، ج7 ص290].'
- term: مُدْمَجَةً
  text: محكمة ملساء، من «أدمج الحبلَ إذا أحكم فتله» [@lisan، ج2 ص275].
- term: كُمْتًا أَنَابِيبُهَا
  text: الكُمْتة «لون بين السواد والحمرة» [@lisan، ج2 ص81]، والأنبوب «ما بين العقدتين في القصب والقناة» [@lisan، ج1 ص747].
- term: زُرْقًا عَوَالِيهَا
  text: عوالي الرماح «أسنّتها» [@lisan، ج15 ص87]، ووصفها بالزرقة لصفاء حديدها ولمعانه.
