first: "خَلَّتْ سَبِيلَ أَتِيٍّ كَانَ يَحْبِسُهُ"
second: "وَرَفَّعَتْهُ إِلَى السِّجْفَيْنِ فَالنَّضَدِ"
meaning: "فتحت الوليدة طريق مجرى ماء كان محبوسًا، ومضت بحفره حتى بلغت به مقدّم الخيمة حيث الستران ومتاع البيت المنضود. قال التِّبْرِيزِيّ: «أي خلت الأمة سبيل الماء في الأتي تحفرها، ورفعته: ليس يريد به علت، وإنما معناه قدَّمته وبلغت به، كما تقول: ارتفع القوم إلى السلطان» [@tabrizi-ashr، ص310]. وللأَعْلَم تفسير آخر: «والمعنى أن الماء لما كثر وعجز النؤي [عنه] خافت على بيتها، فخلت سبيله في البيت، وسهلت مسلكه؛ لينفذ ويتجاوز البيت» [@diwan-nabigha، ص16]."
vocabulary:
  - term: "أَتِيٍّ"
    text: "«النهر الصغير» [@tabrizi-ashr، ص310]. وعند الأَعْلَم: «سيل يأتي من بلد إلى بلد، والأتي: مجرى الماء، يقال: أت لمائك، أي هيئ له مجرى، وهو الذي أراد النابغة» [@diwan-nabigha، ص15]."
  - term: "رَفَّعَتْهُ"
    text: "قدّمته وبلغت به، لا من العلوّ [@tabrizi-ashr، ص310]."
  - term: "السِّجْفَيْنِ"
    text: "«ستران رقيقان يكونان في مُقدَّم البيت» [@tabrizi-ashr، ص310]. وفي اللسان عن الأَصْمَعِيّ: «السجفان اللذان على الباب»، ثم قال بعد إنشاد البيت: «هما مصراعا الستر يكونان في مقدم البيت» [@lisan، ج9 ص144]."
  - term: "النَّضَدِ"
    text: "«ما نُضد من متاع البيت» [@tabrizi-ashr، ص310]، وعند الأَعْلَم: «وهو أوعيتهم وجلال تمرهم، ينضد بعضها على بعض» [@diwan-nabigha، ص16]."
context: "آخر صورة الوليدة: بعد أن سوّت النؤي فتحت للماء مجراه، فاكتمل وصف النؤي في ثلاثة أبيات (3–5). وبهذا البيت ينتهي الحديث عن آثار الدار، ليختم البيت التالي بخلوّها."
syntax:
  - "«خَلَّتْ» فاعله ضمير الوليدة، و«سَبِيلَ» مفعول به، و«أَتِيٍّ» مضاف إليه."
  - "«كَانَ يَحْبِسُهُ» جملة في موضع جر صفة لـ«أَتِيٍّ». واسم «كان» ضمير مستتر لم يُذكر صاحبه، والأقرب أنه النؤي، أي: كان النؤي يحبس الماء، وعلى تفسير الأَعْلَم بالكنس يكون ما سدّ المجرى من مدر."
  - "«وَرَفَّعَتْهُ» معطوف على «خَلَّتْ»، والهاء للأتيّ، و«إِلَى السِّجْفَيْنِ» متعلق به، و«فَالنَّضَدِ» معطوف بالفاء."
morphology:
  - "«خَلَّتْ» من «خَلَّى» على «فعَّل»، حُذفت ألفه لاتصاله بتاء التأنيث الساكنة."
  - "«أَتِيّ» على «فَعِيل» من «أتى»، لأنه سيل يأتي من موضع إلى موضع."
  - "«رَفَّعَ» على «فعَّل»، وهو هنا التقديم شيئًا بعد شيء، لا الرفع إلى أعلى. قال الأَعْلَم: «وهو من قولك: ارتفع إلي [فلان]، أي تقدم إلي، وارفعه إلى الأمير، أي قدمه، وليس من ارتفاع العلو» [@diwan-nabigha، ص16]. و«السِّجْفَيْن» مثنى «سِجْف»."
rhetoric:
  thesis: "يبلغ الوصف داخل الخيمة: الستران والمتاع المنضود. فالشاعر لا يصف الخراب وحده، بل يدخل من آثاره إلى ما كان من حياة البيت."
  devices:
    - title: "الكناية في «السِّجْفَيْنِ فَالنَّضَدِ»"
      text: "ذكر الستر والمتاع المنضود، وأراد بهما البيت المسكون العامر. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود»، فيومئ به إليه [@dalail، ص66]. فالستر والمتاع تالٍ للبيت المأهول، يدل عليه دون أن يسمّيه."
    - title: "الفعل «رَفَّعَتْهُ»"
      text: "اختار «رَفَّعَتْهُ» بالتشديد، ومعناه التقديم والتبليغ لا العلو كما نبّه التِّبْرِيزِيّ والأَعْلَم، فيُفهم منه أنها مضت بالحفر قليلًا قليلًا حتى بلغت مقدم البيت."
  connection: "ثم يعود من هذا الماضي إلى الحاضر: أصبحت الدار خالية، ورحل أهلها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "خَلْلَتْ سَبِي / لَ أَتِيْ / يِنْ كَانَ يَحْ / بِسُهُو = مستفعلن / فعِلن / مستفعلن / فعِلن — وَرَفْفَعَتْ / هُ إِلَسْ / سِجْفَيْنِ فَنْ / نَضَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]."
