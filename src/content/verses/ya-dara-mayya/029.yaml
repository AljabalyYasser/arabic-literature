first: "يَحُفُّهُ جَانِبَا نِيقٍ وَتُتْبِعُهُ"
second: "مِثْلَ الزُّجَاجَةِ لَمْ تُكْحَلْ مِنَ الرَّمَدِ"
meaning: "كان الحمام يمرّ بين جانبي جبل يحيطان به، وهي تُتبعه عينًا صافية كالزجاجة لم يصبها رمد قط. وجعل الحمام في مضيق ليكون عدّه أصعب، قال الأَصْمَعِيّ فيما نقله التِّبْرِيزِيّ: «إذا كان الحمام بين جانبي نيق كان أشد لعدده؛ لأنه يتكاثف ويكون بعضه فوق بعض، وإذا كان في موضع واسع كان أسهل لعدده» [@tabrizi-ashr، ص316–317]. وقال الأَعْلَم: «أي عينها صافية كصفاء الزجاجة»، و«لم تُكحل من الرمد»: «أي لم يصبها رمدٌ فتُكحَل، ويحتمل أن يريد أنها كحلت بغير رمد؛ لزينة أو نحوه» [@diwan-nabigha، ص24]."
vocabulary:
  - term: "يَحُفُّهُ"
    text: "«يكون في ناحيته» [@tabrizi-ashr، ص316]، وعند الأَعْلَم: «أي يُحيط به من جانبيه» [@diwan-nabigha، ص24]."
  - term: "نِيقٍ"
    text: "«أعلى الجبل» [@tabrizi-ashr، ص316]."
  - term: "وَتُتْبِعُهُ"
    text: "تجعل عينها تتبعه، أي تلاحقه بنظرها."
  - term: "مِثْلَ الزُّجَاجَةِ"
    text: "قال التِّبْرِيزِيّ: «وقوله (مثل الزجاجة) يعني عينها» [@tabrizi-ashr، ص317]."
  - term: "لَمْ تُكْحَلْ مِنَ الرَّمَدِ"
    text: "«أي لم ترمد فتكحل» [@tabrizi-ashr، ص317]. والرَّمَد: وجع العين، وكانوا يداوونه بالكحل."
context: "يصف حال الرؤية: الحمام في مضيق يتراكب بعضه على بعض ويسرع، والعين التي رأته صافية. فبهذا يعظم عمل الفتاة، لأنها عدّت ما يصعب عدّه. وعندها ينقل التِّبْرِيزِيّ قول أبي عُبَيْدة: «وهي عين اليمامة، وزرقاء اليمامة» [@tabrizi-ashr، ص317]. وهو من أبيات الفتاة التي يقول شَوْقي ضَيْف إنها «واضحة الانتحال» [@deif، ج1 ص280]. ونقل عبد القاهر الجُرْجانيّ عجزه عن النَّمَريّ شاهدًا على نفي الشيء بنفي سببه [@dalail، ص567]. وهو البيت الثالث والثلاثون عند الأَعْلَم."
syntax:
  - "«يَحُفُّهُ جَانِبَا نِيقٍ»: «يَحُفُّ» فعل مضارع، والهاء مفعول به يعود إلى الحمام، و«جَانِبَا» فاعل مرفوع بالألف لأنه مثنى، وحُذفت نونه للإضافة، و«نِيقٍ» مضاف إليه. والجملة صفة لحمام أو حال منه."
  - "«وَتُتْبِعُهُ مِثْلَ الزُّجَاجَةِ»: الواو للحال أو للعطف، و«تُتْبِعُ» فعل مضارع فاعله ضمير الفتاة، والهاء مفعول أول، و«مِثْلَ» مفعول ثان، وهو صفة لموصوف محذوف، أي عينًا مثل الزجاجة."
  - "«لَمْ تُكْحَلْ مِنَ الرَّمَدِ» صفة لـ«مِثْلَ الزُّجَاجَةِ»، أي للعين، و«مِنَ الرَّمَدِ» متعلق بـ«تُكْحَلْ»، و«من» للتعليل."
morphology:
  - "«تُتْبِعُ» مضارع «أَتْبَعَ» على «أفعل»، يتعدى إلى مفعولين: أتبعتُه الشيءَ، أي جعلتُ الشيء يتبعه."
  - "«تُكْحَلْ» مضارع «كُحِلَ» مبني للمجهول، مجزوم بـ«لم»."
  - "«جَانِبَا» مثنى «جانب»، وأصله «جانبان»، حُذفت النون للإضافة."
rhetoric:
  thesis: "يجمع في بيت واحد صعوبة المرئيّ وصفاء الرائي: الحمام متراكب مسرع في مضيق، والعين لم يصبها داء قط. فالإصابة في العدّ ثمرة عين سليمة، وهي الصورة التي يريدها لحكم النُّعْمان: نظر سليم لا يكدّره قول الوشاة."
  devices:
    - title: "التشبيه في «مِثْلَ الزُّجَاجَةِ»"
      text: "حذف المشبّه، وهو العين، وأبقى المشبّه به مع أداته، فقال: تتبعه مثل الزجاجة. والجامع الصفاء والشفوف. وهو تشبيه ظاهر الشبه، من النوع الذي يقول فيه عبد القاهر الجُرْجانيّ إنه يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "نفي السبب في «لَمْ تُكْحَلْ مِنَ الرَّمَدِ»"
      text: "ظاهره نفي الكحل، والمراد نفي الرمد نفسه، أي لم ترمد قط فتحتاج إلى كحل. وعلى هذا حمله النَّمَريّ فيما نقله عبد القاهر الجُرْجانيّ: «قال ومثله قول النابغة: مثل الزجاجة، لم تكحل من الرمد أي: لم ترمد فتكحل منه» [@dalail، ص567]. ويذكر الأَعْلَم وجهًا ثانيًا: أنها كُحلت لغير رمد، لزينة [@diwan-nabigha، ص24]."
  connection: "ثم يقول إنهم عدّوا الحمام فوجدوه كما حسبت، تسعًا وتسعين."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "يَحُفْفُهُو / جَانِبَا / نِيقِنْ وَتُتْ / بِعُهُو = متفعلن / فاعلن / مستفعلن / فعِلن — مِثْلَزْ زُجَا / جَةِ لَمْ / تُكْحَلْ مِنَرْ / رَمَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «يَحُفُّهُ» و«وَتُتْبِعُهُ»."
