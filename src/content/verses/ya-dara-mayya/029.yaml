    status: "رواية الأَعْلَم، وهو البيت 33 عنده"
    note: "بلفظ نصّنا، وهو عنده قبل «قالت ألا ليتما» (البيت 28 عندنا) [@diwan-nabigha، ص24]. وفي نسخة الشاملة للتِّبْرِيزِيّ «جَانِباً» بالتنوين، و«مِثْلِ» بالجر، و«مِنْ الرَّمَدٍ» بالتنوين، وكلها أخطاء في الطبع: فـ«جانبا» مثنى مضاف، و«مثل» مفعول به منصوب، وهو بالنصب عند الأَعْلَم."
