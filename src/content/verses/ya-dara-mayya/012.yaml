first: "فَارْتَاعَ مِنْ صَوْتِ كَلَّابٍ فَبَاتَ لَهُ"
second: "طَوْعُ الشَّوَامِتِ مِنْ خَوْفٍ وَمِنْ صَرَدِ"
meaning: "ففزع الثور من صوت صائد معه كلابه، فبات من الخوف ومن البرد الشديد في حال تسرّ أعداءه الشامتين. هذا على رواية الرفع في «طَوْعُ»، وفيها قولان نقلهما التِّبْرِيزِيّ: «قال الأصمعي: المعنى فبات له [ما] أطاع شوامته من الخوف، وقال أبو عبيدة: المعنى فبات له ما يُسر الشوامت» [@tabrizi-ashr، ص312]. وعلى الرواية الأخرى الشوامت هي القوائم، والمعنى: بات قائمًا على قوائمه لا يرقد [@tabrizi-ashr، ص312]."
vocabulary:
  - term: "ارْتَاعَ"
    text: "«فزع» [@tabrizi-ashr، ص312]."
  - term: "كَلَّابٍ"
    text: "«وهو الصائد ذو الكلاب» [@diwan-nabigha، ص18]."
  - term: "الشَّوَامِتِ"
    text: "جمع شامت، وهو الذي يفرح بمصيبة غيره. ويقال للقوائم أيضًا: «والشوامت: قوائم الدابة، وهو اسم لها، واحدتها شامتة. قال أبو عمرو: يقال لا ترك الله له شامتة أي قائمة» [@lisan، ج2 ص51]."
  - term: "صَرَدِ"
    text: "«والصرد: شدة البرد» [@diwan-nabigha، ص18]."
context: "يدخل الصائد وكلابه، فتبدأ الحركة بعد ليلة البرد. قال شَوْقي ضَيْف: «ولم يلبث أن ذعر ذعرا شديدا إذ سمع صوت قانص يهتف بكلابه» [@deif، ج1 ص296]."
syntax:
  - "«فَارْتَاعَ» الفاء عاطفة، والفاعل ضمير الثور، و«مِنْ صَوْتِ» متعلق به، و«كَلَّابٍ» مضاف إليه."
  - "«فَبَاتَ لَهُ طَوْعُ الشَّوَامِتِ»: الهاء في «له» قال فيها التِّبْرِيزِيّ: «عائدة على الكلاب، وإن شئت على الصوت» [@tabrizi-ashr، ص312]. وفي إعراب «طوع» قال الأَعْلَم: «ومن رفع فعلى أنه اسم (بات)، وخبره في قوله: (له)، ويكون أيضا اسم (بات) مضمرا فيها، والجملة في موضع خبرها» [@diwan-nabigha، ص18]."
  - "«مِنْ خَوْفٍ وَمِنْ صَرَدِ» متعلقان بـ«بات»، و«من» فيهما للتعليل."
morphology:
  - "«ارْتَاعَ» على «افتعل» من الرَّوْع، وهو الفزع."
  - "«كَلَّاب» على «فعّال»، صيغة لصاحب الشيء الملازم له: صاحب الكلاب."
  - "«الشَّوَامِت» جمع «شامتة» على «فواعل»."
rhetoric:
  thesis: "بيت اختلف فيه القدماء، وكل قراءاته تنتهي إلى معنى واحد: ليلة شقاء. فإما أنه بات في حال يفرح بها أعداؤه، وإما أنه بات واقفًا على قوائمه لا ينام من الخوف والبرد."
  devices:
    - title: "الكناية في «طَوْعُ الشَّوَامِتِ»"
      text: "على تفسير أبي عُبَيْدة، لم يقل: بات في شقاء، بل قال: بات له ما يسرّ الشامتين، فدلّ على شدة حاله بفرح أعدائه بها. ونقل الأَعْلَم في معناه دعاء العرب: «اللهم لا تطيعن في شامتا، أي لا تنزل بي ما يحبه ويسره» [@diwan-nabigha، ص18]. وهذا ما يسميه عبد القاهر الجُرْجانيّ كناية: لا يذكر المعنى «باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود»، فيومئ به إليه [@dalail، ص66]."
    - title: "اللفظ المحتمل"
      text: "كلمة «الشَّوَامِتِ» تحتمل الأعداء والقوائم معًا، فالبيت يقبل صورتين: ثور يسخر منه الدهر، وثور واقف طوال الليل. ولم يرجّح التِّبْرِيزِيّ بينهما."
    - title: "الجمع بين علتين"
      text: "«مِنْ خَوْفٍ وَمِنْ صَرَدِ»: علة من داخله وعلة من خارجه، الفزع من الصائد والبرد من السماء، فاجتمع عليه الأمران."
  connection: "ثم يرسل الصائد كلابه عليه، فتمضي به قوائمه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَرْتَاعَ مِنْ / صَوْتِ كَلْ / لَابِنْ فَبَا / تَ لَهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — طَوْعُشْشَوَا / مِتِ مِنْ / خَوْفِنْ وَمِنْ / صَرَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "طَوْعَ الشَّوَامِتِ مِنْ خَوْفٍ وَمِنْ صَرَدِ"
    status: "رواية اللسان"
    note: "بالنصب خبرًا لـ«بات»، والشوامت القوائم، وبها ينشده صاحب اللسان، ثم يقول: «ويروى: طوع الشوامت، بالرفع» [@lisan، ج2 ص51]. وقال الأَعْلَم: «ومن نصب (طوع الشوامت) فعلى خبر (بات)، واسمها مضمر فيها» [@diwan-nabigha، ص18]. وهي التي يعنيها التِّبْرِيزِيّ بقوله: «ومن يروى هذه الرواية فالشوامت عنده القوائم... أي فبات قائما» [@tabrizi-ashr، ص312]."
