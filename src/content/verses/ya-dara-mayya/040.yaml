first: "إِذًا فَعَاقَبَنِي رَبِّي مُعَاقَبَةً"
second: "قَرَّتْ بِهَا عَيْنُ مَنْ يَأْتِيكَ بِالْحَسَدِ"
meaning: "إن كنت فعلت ما يقولون، فليعاقبني ربي عقابًا يرضى به الحاسد الذي يحمل إليك الوشاية ويفرح. فهو دعاء ثان على نفسه بعد الدعاء بشلل اليد، قال البَغْداديّ: «وقوله: إذن فعاقبني ربي الخ هذا دعاء آخر على نفسه» [@khizana، ج5 ص74]. ولم يشرح التِّبْرِيزِيّ هذا البيت، فهو عنده بعد البيت السابق بلا كلام [@tabrizi-ashr، ص319]."
vocabulary:
  - term: "مُعَاقَبَةً"
    text: "عقابًا."
  - term: "قَرَّتْ ... عَيْنُ"
    text: "سُرّ وفرح. وفي اللسان في أصلها قولان: «معناه بردت وانقطع بكاؤها واستحرارها بالدمع فإن للسرور دمعة باردة وللحزن دمعة حارة، وقيل: هو من القرار، أي رأت ما كانت متشوقة إليه فقرت ونامت» [@lisan، ج5 ص86]."
  - term: "مَنْ يَأْتِيكَ بِالْحَسَدِ"
    text: "من ينقل إليك عني ما يحمله عليه حسده، أي الواشي."
context: "ثالث أبيات القسم والبراءة (37–41)، وهو من البيتين اللذين ليسا في رواية الأَعْلَم (40 و41). يورده محقق الديوان فيما جمعه في آخره من الشعر المنسوب إلى النابِغة، عن «العِقْد الثَّمِين» و«التَّوْضِيح والبَيان»، ويقول: «سبق ذكر البيتين في الديوان صفحة ٢٥ برواية أخرى» [@diwan-nabigha، ص229]. أما ابن رَشِيق فيرويه في أبيات الاعتذار بعد «مَا قُلْتُ مِنْ سَيِّئٍ مِمَّا أُتِيتَ بِهِ» وقبل «إِلَّا مَقَالَةَ أَقْوَامٍ شَقِيتُ بِهَا» [@ibn-rashiq، ج2 ص177]، ويرويه شَوْقي ضَيْف بعدهما [@deif، ج1 ص287]، ويستشهد به البَغْداديّ مع البيت السابق [@khizana، ج8 ص449]. فالبيت في رواية التِّبْرِيزِيّ وعند ابن رَشِيق وشَوْقي ضَيْف، ويختلف موضعه عندهم. وفيه يحيل الشاعر التهمة على الحاسد، وهذا ما يجعله ابن رَشِيق من حق المعتذر: «ويحيل الكذب على الناقل والحاسد» [@ibn-rashiq، ج2 ص176]."
syntax:
  - "«إِذًا» حرف جواب وجزاء، و«فَعَاقَبَنِي» الفاء رابطة لما في «إذًا» من معنى الشرط، و«عَاقَبَ» فعل ماض أُريد به الدعاء، والنون للوقاية، والياء مفعول به، و«رَبِّي» فاعل. قال البَغْداديّ بعد أن جعل «فلا رفعت» جملة دعائية وقعت جزاءً: «وكذا الحال في البيت الثاني» [@khizana، ج8 ص450]، أي هذا البيت."
  - "«مُعَاقَبَةً» مفعول مطلق منصوب، وجملة «قَرَّتْ بِهَا عَيْنُ مَنْ...» نعت له: «قَرَّتْ» فعل ماض، و«بِهَا» متعلق به، و«عَيْنُ» فاعل، و«مَنْ» اسم موصول مضاف إليه."
  - "«يَأْتِيكَ» صلة «مَنْ»: فعل مضارع، والفاعل ضمير يعود على «مَنْ»، والكاف مفعول به. و«بِالْحَسَدِ» متعلق بـ«يَأْتِي»، والباء للتعدية، أي يجيئك بالحسد."
morphology:
  - "«عَاقَبَ» على «فاعَلَ»، ومصدره «مُعَاقَبَة» على «مُفاعَلة»."
  - "«قَرَّتْ» من «قَرَّ يَقَرُّ»، وفي اللسان: «وقرت عينه تقر؛ هذه أعلى عن ثعلب، أعني فعلت تفعل» [@lisan، ج5 ص86]، أي بكسر العين في الماضي وفتحها في المضارع."
  - "«إِذًا» تُنطق «إِذَنْ»."
rhetoric:
  thesis: "يجعل حَكَمَ عقوبته عدوَّه: فالعقاب الذي يدعو به على نفسه ليس عقابًا يرضاه هو، بل عقابًا يرضى به الحاسد نفسه، وهو أشدّ الناس طلبًا للأذى. وفي ذكر الحاسد يحيل الشاعر التهمة كلها على من نقلها."
  devices:
    - title: "المبالغة في «قَرَّتْ بِهَا عَيْنُ مَنْ يَأْتِيكَ بِالْحَسَدِ»"
      text: "لم يقدّر العقوبة بمقدار، بل بأثرها في نفس عدوه: عقوبة تكفي الحاسد حتى تهدأ عينه. وهذا أبلغ من أن يصف شدّتها، لأن الحاسد لا يرضى بالقليل."
    - title: "الكناية في «مَنْ يَأْتِيكَ بِالْحَسَدِ»"
      text: "الكناية أن يريد المتكلم معنى فلا يذكره بلفظه بل بما يلزمه. فلم يقل: الواشي أو الكاذب، بل وصفه بالباعث على فعله، فصار الخبر الذي حمله إلى الملك حسدًا لا خبرًا. وهو تطبيق لقول ابن رَشِيق في المعتذر: «ويحيل الكذب على الناقل والحاسد» [@ibn-rashiq، ج2 ص176]."
    - title: "صدى البيت 25"
      text: "في أبيات سُلَيْمان قال الإله: «وَمَنْ عَصَاكَ فَعَاقِبْهُ مُعَاقَبَةً» (البيت 25)، وهنا يقول: «فَعَاقَبَنِي رَبِّي مُعَاقَبَةً». فاللفظ نفسه يعود، لكن الشاعر يضع نفسه موضع العاصي إن كان كاذبًا. وهذه قراءتنا لتكرار اللفظ."
  connection: "ثم يقول إن هذا القسم إنما هو ليبرأ من قول قُذف به، أحرق كبده."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِذَنْ فَعَا / قَبَنِي / رَبْبِي مُعَا / قَبَتَنْ = متفعلن / فعِلن / مستفعلن / فعِلن — قَرْرَتْ بِهَا / عَيْنُ مَنْ / يَأْتِيكَ بِلْ / حَسَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية من الصدر فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "قَرَّتْ بِهَا عَيْنُ مَنْ يَأْتِيكَ بِالْفَنَدِ"
    status: "رواية شَوْقي ضَيْف"
    note: "[@deif، ج1 ص287]، والفَنَد الكذب. وموضعه عنده بعد «إِلَّا مَقَالَةَ أَقْوَامٍ شَقِيتُ بِهَا»، أما ابن رَشِيق فيرويه بالحسد بعد البيت 39 مباشرة [@ibn-rashiq، ج2 ص177]."
  - reading: "إِذًا فَعَاقَبَنِي رَبِّي مُعَاقَبَةً / قَرَّتْ بِهَا عَيْنُ مَنْ يَأْتِيكَ بِالْحَسَدِ"
    status: "ليس في رواية الأَعْلَم"
    note: "لا يرويه الأَعْلَم، ويورده المحقق في الشعر المنسوب [@diwan-nabigha، ص229]. وفي نسخة الشاملة للتِّبْرِيزِيّ «إذا» و«بأتيك»، وهما خطآن في الطبع صوابهما «إِذًا» و«يَأْتِيكَ» [@tabrizi-ashr، ص319]، وبالصواب ينشده البَغْداديّ [@khizana، ج8 ص449]."
