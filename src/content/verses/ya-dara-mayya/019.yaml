first: "قَالَتْ لَهُ النَّفْسُ إِنِّي لَا أَرَى طَمَعًا"
second: "وَإِنَّ مَوْلَاكَ لَمْ يَسْلَمْ وَلَمْ يَصِدِ"
meaning: "حدّثته نفسه: لا أرى مطمعًا في هذا الثور، وصاحبك لم ينجُ ولم يصد. فانصرف واشق عن الثور. قال الأَعْلَم: «أي حدثت واشقا نفسه باليأس من الثور أو من صاحبه. وقوله: (وإن مولاك) يعني الكلب المقتول» [@diwan-nabigha، ص20]."
vocabulary:
  - term: "قَالَتْ لَهُ النَّفْسُ"
    text: "حدّثته نفسه. قال التِّبْرِيزِيّ: «وقوله: (قالت له النفس) تمثيل، أي حدَّثته نفسه بهذا» [@tabrizi-ashr، ص314]."
  - term: "طَمَعًا"
    text: "مطمعًا، أي أملًا في الظفر بالثور."
  - term: "مَوْلَاكَ"
    text: "«المولى: الناصر» [@tabrizi-ashr، ص314]. وعند الأَعْلَم: «والمولى: ابن العم هنا، والصاحب، وقيل: أراد بالمولى رب الكلب؛ أي قتلت كلابه فلم يسلم ولم يصد» [@diwan-nabigha، ص20]."
  - term: "لَمْ يَصِدِ"
    text: "لم يصطد شيئًا."
context: "نهاية قصة الثور (9–19): انتصر الثور، وقُتل كلب، وانسحب الآخر. وبعده يعود الشاعر إلى ناقته وإلى غرضه. قال شَوْقي ضَيْف عن مسار القصيدة: «فإنك تراه يخرج من النسيب إلى وصف ناقته خروجا تسنده المناسبة، حتى إذا أتم هذا الوصف قال: فتلك تبلغني النعمان» [@deif، ج1 ص298]."
syntax:
  - "«قَالَتْ لَهُ النَّفْسُ» جواب «لمّا» في البيت السابق، و«النَّفْسُ» فاعل، و«لَهُ» متعلق بـ«قالت»."
  - "«إِنِّي لَا أَرَى طَمَعًا» في موضع نصب مقول القول: «إنّ» واسمها ياء المتكلم، وجملة «لَا أَرَى طَمَعًا» خبرها، و«طَمَعًا» مفعول به."
  - "«وَإِنَّ مَوْلَاكَ لَمْ يَسْلَمْ وَلَمْ يَصِدِ» معطوفة على ما قبلها داخلة في مقول القول، و«مَوْلَاكَ» اسم «إنّ» منصوب بفتحة مقدرة، وجملة «لَمْ يَسْلَمْ» خبرها، و«وَلَمْ يَصِدِ» معطوفة عليها."
morphology:
  - "«يَصِدِ» مضارع «صَادَ يَصِيدُ»، فعل أجوف، جُزم بـ«لم» فسكنت داله فالتقى ساكنان، فحُذفت الياء: «لم يَصِدْ»، ثم كُسرت الدال للقافية."
  - "«مَوْلَى» على «مَفْعَل» من «الوَلْي» وهو القرب، ولذلك يقع على الناصر وابن العم والصاحب."
  - "«طَمَع» مصدر «طَمِعَ»، وُضع موضع ما يُطمع فيه."
rhetoric:
  thesis: "يجعل للكلب نفسًا تحاوره وتحسب العاقبة، فيختم القصة بقرار عاقل لا بهزيمة مذلة: لا طمع، والصاحب قُتل، فالانصراف أولى. ويرى شَوْقي ضَيْف أن الثور والكلاب صاروا في هذا الوصف كالبشر، فالكلاب «طامعة تتربص»، ثم «تحدثه نفسه بأنه يطمع في غير طائل» [@deif، ج1 ص296]."
  devices:
    - title: "«قَالَتْ لَهُ النَّفْسُ»"
      text: "يسميه التِّبْرِيزِيّ «تمثيل» [@tabrizi-ashr، ص314]، ويريد به أن الكلام مجاز يصوّر ما في نفس الكلب كأنه قول مسموع، لا أنه قول حقيقي. وهذا غير «التمثيل» الذي يخصّه عبد القاهر الجُرْجانيّ بالتشبيه الذي يُحتاج فيه إلى تأوّل، ويقول فيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. فالكلمة عند القدماء أوسع منها عند عبد القاهر."
    - title: "الحوار الداخلي"
      text: "جعل الشاعر نفس الكلب متكلّمة، والكلب سامعًا، فصار التردد بين الإقدام والإحجام حوارًا. وهذا من أبلغ ما في القصة: الحيوان يفكر قبل أن يفرّ."
    - title: "الإيجاز في «لَمْ يَسْلَمْ وَلَمْ يَصِدِ»"
      text: "نفيان يلخصان المعركة كلها: الكلب الأول لم ينجُ بنفسه، ولم ينل الصيد. فخسر الأمرين، وبهذا يحسم واشق قراره."
  connection: "ثم يعود من الثور إلى الناقة: «فتلك تبلغني النعمان»، فيخرج إلى غرض القصيدة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "قَالَتْ لَهُنْ / نَفْسُ إِنْ / نِي لَا أَرَى / طَمَعَنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — وَإِنْنَ مَوْ / لَاكَ لَمْ / يَسْلَمْ وَلَمْ / يَصِدِي = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]."
