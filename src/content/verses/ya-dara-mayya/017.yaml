first: "فَظَلَّ يَعْجُمُ أَعْلَى الرَّوْقِ مُنْقَبِضًا"
second: "فِي حَالِكِ اللَّوْنِ صَدْقٍ غَيْرِ ذِي أَوَدِ"
meaning: "فظل الكلب يعضّ أعلى القرن الذي نفذ فيه، منقبضًا من الألم، يعضّ في قرن شديد السواد، صلب، مستقيم لا عوج فيه. قال الأَعْلَم: «أي ظل الكلب يمضغ أعلى الروق حيث أنفذه به، فهو يعض في حالك اللون، يعني القرن»، و«منقبضا، أي قد تقبض الكلب واجتمع في القرن لما يجد من الوجع» [@diwan-nabigha، ص20]."
vocabulary:
  - term: "يَعْجُمُ"
    text: "«يمضغ» [@tabrizi-ashr، ص314]. وفي اللسان: «والعجم: عض شديد بالأضراس دون الثنايا» [@lisan، ج12 ص390]."
  - term: "الرَّوْقِ"
    text: "«القرن» [@tabrizi-ashr، ص314]."
  - term: "مُنْقَبِضًا"
    text: "متقبّضًا مجتمعًا على نفسه من الألم [@diwan-nabigha، ص20]."
  - term: "حَالِكِ اللَّوْنِ"
    text: "«الحالك: الشديد السواد» [@tabrizi-ashr، ص314]."
  - term: "صَدْقٍ"
    text: "«الصلب» [@tabrizi-ashr، ص314]."
  - term: "أَوَدِ"
    text: "«العوج» [@tabrizi-ashr، ص314]."
context: "خاتمة مشهد ضُمْران. يقول شَوْقي ضَيْف: «فكنت ترى الكلب من وهلته يعلك أعلى القرن وما خرج منه متقبضا متألما إلى أن لفظ أنفاسه» [@deif، ج1 ص296]. وفاعل «ظلّ» عند الأَعْلَم الكلب، وفي اللسان بعد إنشاد الصدر: «أي يعض أعلى قرنه وهو يقاتله» [@lisan، ج12 ص390]."
syntax:
  - "«فَظَلَّ» فعل ماض ناقص، واسمه ضمير الكلب، وجملة «يَعْجُمُ» في موضع نصب خبره. و«أَعْلَى» مفعول به منصوب بفتحة مقدرة، و«الرَّوْقِ» مضاف إليه. و«مُنْقَبِضًا» حال من فاعل «يعجم»."
  - "«فِي حَالِكِ اللَّوْنِ» متعلق بـ«يعجم»، و«حَالِكِ» صفة لموصوف محذوف هو القرن، و«صَدْقٍ» صفة ثانية، و«غَيْرِ» صفة ثالثة مضافة إلى «ذِي»، و«ذِي» مضاف إلى «أَوَدِ»."
morphology:
  - "«يَعْجُم» مضارع «عَجَم» على «فعَل يفعُل»."
  - "«مُنْقَبِض» اسم فاعل من «انقبض» على «انفعل»، وهو بناء المطاوعة: قُبض فانقبض."
  - "«حَالِك» اسم فاعل من «حَلَك»، و«صَدْق» صفة على «فَعْل»، و«أَوَد» مصدر «أَوِدَ» إذا اعوجّ."
rhetoric:
  thesis: "صورتان متقابلتان في بيت واحد: كلب منقبض يتلوّى، وقرن صلب مستقيم لا ينثني. فالضعف والألم في الصدر، والصلابة في العجز."
  devices:
    - title: "حذف الموصوف"
      text: "في «فِي حَالِكِ اللَّوْنِ صَدْقٍ غَيْرِ ذِي أَوَدِ» حذف القرن وذكر صفاته الثلاث، فصار السامع يرى السواد والصلابة والاستقامة قبل أن يسمّي الشيء. وعبد القاهر الجُرْجانيّ يرى في الحذف ما يجعل «ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "المقابلة بين الصدر والعجز"
      text: "«مُنْقَبِضًا» في آخر الصدر صفة الكلب، و«غَيْرِ ذِي أَوَدِ» في آخر العجز صفة القرن: الأول ينثني ويتقبض، والثاني لا ينثني. فالبيت يضع الضحية والسلاح متقابلين."
  connection: "ثم يرى الكلب الآخر واشق مصرع صاحبه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَظَلْلَ يَعْ / جُمُ أَعْ / لَرْرَوْقِ مُنْ / قَبِضَنْ = متفعلن / فعِلن / مستفعلن / فعِلن — فِي حَالِكِلْ / لَوْنِ صَدْ / قِنْ غَيْرِ ذِي / أَوَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية منه فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
