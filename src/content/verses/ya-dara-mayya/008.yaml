first: "مَقْذُوفَةٍ بِدَخِيسِ النَّحْضِ بَازِلُهَا"
second: "لَهُ صَرِيفٌ صَرِيفَ الْقَعْوِ بِالْمَسَدِ"
meaning: "ناقة كأنها رُميت باللحم رميًا لكثرة لحمها وتراكبه، ولنابها صوت حين تحكّه كصوت البكرة يجري عليها الحبل. قال الأَعْلَم: «أي لعظم خلقها وتراكب لحمها، كأنها قد رميت باللحم رميا» [@diwan-nabigha، ص16]."
vocabulary:
  - term: "مَقْذُوفَةٍ"
    text: "«أي مرمية باللحم» [@tabrizi-ashr، ص311]، وكذلك في اللسان [@lisan، ج9 ص277]."
  - term: "دَخِيسِ"
    text: "«والدَّخيس والدِّخاس: الذي قد دخل بعضه في بعض من كثرته» [@tabrizi-ashr، ص311]. وفي اللسان: «ودخيس اللحم مكتنزه» [@lisan، ج6 ص77]."
  - term: "النَّحْضِ"
    text: "«اللحم، وهو جمع نحضة» [@tabrizi-ashr، ص311]."
  - term: "بَازِلُهَا"
    text: "نابها. قال الأَعْلَم: «وبازلها: نابها حين بزل اللحم، أي شقه وخرج» [@diwan-nabigha، ص16–17]، وهو ناب الناقة إذا اكتملت سنّها."
  - term: "صَرِيفٌ"
    text: "صوت الناب إذا حكّ بعضه ببعض. قال التِّبْرِيزِيّ: «والصريف من الإناث من شدة الإعياء، ومن الذكور من النشاط» [@tabrizi-ashr، ص311]."
  - term: "الْقَعْوِ"
    text: "«ما يضم البكرة إذا كان خشبا، فإذا كان حديدا فهو خُطَّاف» [@tabrizi-ashr، ص311]، وقال الأَعْلَم: «وقيل: القعو البكرة بعينها» [@diwan-nabigha، ص17]. والبكرة: الخشبة المستديرة التي يجري عليها حبل الدلو."
  - term: "الْمَسَدِ"
    text: "«الحبل» [@diwan-nabigha، ص17]."
context: "يكمل صفة الناقة التي بدأها في البيت السابق، فيصف جسمها بعد قوتها: لحم مكتنز، وناب يصرف. ثم يشبهها في البيت التالي بالثور الوحشي."
syntax:
  - "«مَقْذُوفَةٍ» صفة ثانية لـ«عَيْرَانَةٍ» في البيت السابق، مجرورة، و«بِدَخِيسِ» متعلق بها، و«النَّحْضِ» مضاف إليه."
  - "«بَازِلُهَا لَهُ صَرِيفٌ»: «بَازِلُهَا» مبتدأ، و«لَهُ» خبر مقدم، و«صَرِيفٌ» مبتدأ مؤخر، والجملة خبر «بازلها»، والجملة الكبرى صفة ثالثة للناقة."
  - "«صَرِيفَ الْقَعْوِ» منصوب على المصدر. قال الأَعْلَم: «ونصب صريف القعو على تقدير المصدر؛ كأنه قال: بازلها يصرف صريفا مثل صريف القعو، والرفع على تقدير: له صريف مثل صريف القعو» [@diwan-nabigha، ص17]. و«بِالْمَسَدِ» متعلق بـ«صريف»."
morphology:
  - "«مَقْذُوفَة» اسم مفعول من «قَذَف»، و«دَخِيس» على «فَعِيل» بمعنى المتداخل."
  - "«بَازِل» اسم فاعل من «بَزَل» إذا شقّ، صار اسمًا للناب."
  - "«صَرِيف» مصدر على «فَعِيل»، وهو بناء كثير في الأصوات."
rhetoric:
  thesis: "صورة ناقة تُرى وتُسمع: كتلة لحم مكتنز، وصوت ناب. والصوت عند الأَعْلَم علامة نشاط لا تعب، فالناقة قوية تصلح لرحلة طويلة."
  devices:
    - title: "الاستعارة في «مَقْذُوفَةٍ»"
      text: "القذف الرمي بقوة، فكأن اللحم رُمي عليها من خارج حتى تراكم، وهذا ما يقوله الأَعْلَم: «كأنها قد رميت باللحم رميا» [@diwan-nabigha، ص16]. والاستعارة عند عبد القاهر الجُرْجانيّ تكون في الاسم وفي الفعل: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]، وهي هنا في اسم مفعول مشتق من الفعل."
    - title: "تشبيه الصوت بالصوت"
      text: "في «صَرِيفَ الْقَعْوِ بِالْمَسَدِ» شبّه صوت نابها بصريف البكرة حين يجري عليها الحبل، بلا أداة تشبيه، بل بالمصدر المنصوب. وهو تشبيه في أمر يُدرك بالحس، فلا يحتاج إلى تأويل."
    - title: "صريف النشاط"
      text: "اختلف اللغويون في صريف الناقة: أهو من التعب أم من النشاط؟ ويحسم الأَعْلَم الأمر في هذا البيت: «وذكر أهل اللغة أن الصريف في الفحول من النشاط [وفي الإناث من الإعياء، وبيت النابغة لا يحتمل إلا النشاط]» [@diwan-nabigha، ص17]، لأن الشاعر يمدح ناقته، فلا يصفها بالإعياء."
  connection: "ثم يشبّه ناقته وهو عليها في الهاجرة بثور وحشي منفرد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "مَقْذُوفَتِنْ / بِدَخِي / سِنْنَحْضِ بَا / زِلُهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — لَهُو صَرِي / فُنْ صَرِي / فَلْقَعْوِ بِلْ / مَسَدِي = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية من الصدر فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]. وأُشبعت هاء «لَهُ» لأنها بين متحركين."
variants:
  - reading: "لَهُ صَرِيفٌ صَرِيفُ الْقَعْوِ بِالْمَسَدِ"
    status: "رواية الأَعْلَم"
    note: "بالرفع، وهي في نص الأَعْلَم [@diwan-nabigha، ص16]، ويذكرها التِّبْرِيزِيّ: «ويروى (له صَرِيفٌ صَرِيفُ القعو) على البدل، والنصب أجود» [@tabrizi-ashr، ص311]. وفي نسخة الشاملة «بَالمسد» بفتح الباء، وهو خطأ في الطبع."
