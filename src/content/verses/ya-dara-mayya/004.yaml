first: "رَدَّتْ عَلَيْهِ أَقَاصِيهِ وَلَبَّدَهُ"
second: "ضَرْبُ الْوَلِيدَةِ بِالْمِسْحَاةِ فِي الثَّأَدِ"
meaning: "ردّت الأمة الشابة على النؤي ما تباعد من ترابه، وسوّته وأحكمته بضربها بالمسحاة في التراب الندي. قال الأَعْلَم: «أي ردت الأمة على النؤي ما تباعد من ترابه وشذ منه؛ لئلا يصل إليهم الماء»، و«معنى لبده سكنه بشدة» [@diwan-nabigha، ص15]."
vocabulary:
  - term: "أَقَاصِيهِ"
    text: "أطرافه البعيدة. «وأقاصيه: ما شَذَّ منه» [@tabrizi-ashr، ص310]."
  - term: "لَبَّدَهُ"
    text: "«ولبده: سكنه، أي سكنه حفر الوليدة» [@tabrizi-ashr، ص310]، أي رصّه وألصق بعضه ببعض."
  - term: "الْوَلِيدَةِ"
    text: "«الأمة الشابة، وإنما خص الوليدة لأنها أشد ضربا للنؤي» [@diwan-nabigha، ص15]."
  - term: "الْمِسْحَاةِ"
    text: "أداة من حديد يُجرف بها الطين والتراب."
  - term: "الثَّأَدِ"
    text: "«الموضع الندى التراب» [@tabrizi-ashr، ص310]، وعند الأَعْلَم: «المكان الندي، وهو مصدر وضع موضع الصفة» [@diwan-nabigha، ص15]."
context: "يمضي في وصف النؤي، فيستحضر من الماضي صورة الأمة وهي تعمل فيه. ويرى شَوْقي ضَيْف أنه يطيل هذا الوصف «ليظهر قدرته الخيالية»، فالنؤي «حفرته جارية في أرض صلبة، وما زالت ترد أتربته على حوافيه» [@deif، ج1 ص294]."
syntax:
  - "«رَدَّتْ» فعل ماض، وفاعله ضمير الوليدة، وهي لم تُذكر إلا في العجز. قال التِّبْرِيزِيّ: «فقد أضمر ما لم يجر ذكره، أراد رَدَّت عليه الأمة، إلا أن هذا جائز كثير إذا عُرف معناه» [@tabrizi-ashr، ص310]. و«عَلَيْهِ» متعلق به، والضمير للنؤي."
  - "«أَقَاصِيهِ» مفعول به منصوب بفتحة مقدرة على الياء، وحقها أن تظهر، لكنه أسكنها. قال التِّبْرِيزِيّ: «فكان يجب أن تفتح الياء، إلا إنه يجوز إسكانها في الضرورة، لأنه يسكن في الرفع والخفض، فأجرى النصب مجراهما» [@tabrizi-ashr، ص310]."
  - "«وَلَبَّدَهُ ضَرْبُ الْوَلِيدَةِ»: «ضَرْبُ» فاعل «لَبَّدَ»، وهو مصدر مضاف إلى فاعله «الْوَلِيدَةِ». و«بِالْمِسْحَاةِ» و«فِي الثَّأَدِ» متعلقان بـ«ضرب»."
morphology:
  - "«أَقَاصِي» جمع «أَقْصَى» على «أفاعِل». وتسكين يائه في موضع النصب ضرورة، وعلّته عند الأَعْلَم أنه «جاز ذلك تشبيها بالألف؛ لأنها لا تكون إلا ساكنة، والياء أختها في المد واللين، فحملت عند الضرورة عليها» [@diwan-nabigha، ص15]."
  - "«لَبَّدَ» على «فعَّل» للتكثير والمبالغة: ضربه مرة بعد مرة حتى تلبّد."
  - "«الْمِسْحَاة» اسم آلة على «مِفْعَلة» من «سَحَا» إذا جرف، قُلبت واوها ألفًا. و«الثَّأَد» مصدر وُصف به المكان كما يقول الأَعْلَم."
rhetoric:
  thesis: "مشهد من الماضي في قلب الخراب: الدار خالية الآن، لكن الشاعر يرى فيها يد الأمة تعمل، فيصير النؤي الباقي أثرًا لحياة كانت، لا مجرد تراب."
  devices:
    - title: "الإضمار قبل الذكر"
      text: "في «رَدَّتْ» يأتي الفعل بضمير فاعل لم يُذكر صاحبه، ثم يظهر في العجز «الْوَلِيدَةِ». فيبقى السامع لحظة يسأل: من ردّت؟ ثم يأتيه الجواب. وقد أجازه التِّبْرِيزِيّ لأنه «جائز كثير إذا عُرف معناه» [@tabrizi-ashr، ص310]."
    - title: "إسناد الفعل إلى سببه"
      text: "في «وَلَبَّدَهُ ضَرْبُ الْوَلِيدَةِ» لم يقل: ولبّدته الوليدة، بل أسند التلبيد إلى ضربها. فصار الفعل نفسه، ضرب المسحاة المتكرر، هو الذي يُرى ويُسمع."
    - title: "اختيار الوليدة"
      text: "لم يقل: الأمة، بل «الْوَلِيدَةِ»، وهي الأمة الشابة، لأنها كما يقول الأَعْلَم «أشد ضربا للنؤي» [@diwan-nabigha، ص15]. فالكلمة تحمل القوة التي يحتاجها التلبيد."
  connection: "ويتم البيت التالي عمل الوليدة: فتحت مجرى الماء وبلغت به مقدم الخيمة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "رَدْدَتْ عَلَيْ / هِ أَقَا / صِيهِي وَلَبْ / بَدَهُو = مستفعلن / فعِلن / مستفعلن / فعِلن — ضَرْبُلْ وَلِي / دَةِ بِلْ / مِسْحَاةِ فِثْ / ثَأَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، والعروض والضرب مخبونان [@atiq، ص48]. وأُشبعت هاء «أَقَاصِيهِ» فصارت «هِي» ليستقيم الوزن، وأُسكنت ياؤه في موضع النصب للضرورة كما سبق."
variants:
  - reading: "رُدَّتْ عَلَيْهِ أَقَاصِيهِ وَلَبَّدَهُ"
    status: "رواية ذكرها التِّبْرِيزِيّ، ورجّحها"
    note: "بالبناء للمجهول، فتكون «أقاصيه» نائب فاعل مرفوعًا، والضمة تُسكَّن في الياء بلا ضرورة. قال التِّبْرِيزِيّ: «ويروى (رُدَّت عليه أقاصيه) وهذه الرواية أجود» [@tabrizi-ashr، ص310]، وقال الأَعْلَم: «ويروى: ردت عليه ولا ضرورة حينئذ» [@diwan-nabigha، ص15]. ويذكر محقق الديوان أن البَطَلْيَوْسِيّ يرويها بضم الراء وفتحها [@diwan-nabigha، ص235]."
