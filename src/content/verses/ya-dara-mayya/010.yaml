first: "مِنْ وَحْشِ وَجْرَةَ مَوْشِيٍّ أَكَارِعُهُ"
second: "طَاوِي الْمَصِيرِ كَسَيْفِ الصَّيْقَلِ الْفَرَدِ"
meaning: "هذا الثور من وحش وَجْرة، في قوائمه نقط وخطوط سود، ضامر البطن، أبيض لامع كسيف صقله الصيقل لا نظير له. قال الأَعْلَم: «وقوله: كسيف الصيقل، يريد أن الثور أبيض لماع كالسيف» [@diwan-nabigha، ص17]."
vocabulary:
  - term: "وَجْرَةَ"
    text: "فلاة. قال التِّبْرِيزِيّ: «خَصَّ وحش وجرة لأنها فلاة، يقال: أن فيها ستين ميلا، والوحش يكثر بها، ويقال: إنها قليلة الشرب فيها» [@tabrizi-ashr، ص312]. وعند الأَعْلَم: «وهي ستون ميلا، وماؤها قليل؛ فبطون وحشها طاوية لقلة شربها الماء» [@diwan-nabigha، ص17]."
  - term: "مَوْشِيٍّ أَكَارِعُهُ"
    text: "«الموشي: الذي فيه ألوان مختلفة» [@tabrizi-ashr، ص312]، وعند الأَعْلَم: «أي بقوائمه نقط سود وخطوط» [@diwan-nabigha، ص17]. والأكارع: القوائم."
  - term: "طَاوِي الْمَصِيرِ"
    text: "«أي ضامره، والمصير: المعا، وجمعه مصران، وجمع مصران مصارين» [@tabrizi-ashr، ص312]."
  - term: "الصَّيْقَلِ"
    text: "الذي يصقل السيوف ويجلوها."
  - term: "الْفَرَدِ"
    text: "قال التِّبْرِيزِيّ: «أي ليس له نظير» [@tabrizi-ashr، ص312]. وفي اللسان عن ابن السِّكِّيت: «الفرد والفرد، بالفتح والضم، أي هو منقطع القرين لا مثل له في جودته. قال: ولم أسمع بالفرد إلا في هذا البيت» [@lisan، ج3 ص332]. وفسّره ابن قُتَيْبة تفسيرًا آخر: «أراد بالفرد: أنه مسلول من غمده» [@ibn-qutayba، ج1 ص169]، وذكر الأَعْلَم القولين [@diwan-nabigha، ص17]."
context: "يرسم صورة الثور بعد أن ذكره، ثلاث صفات: الموطن، والقوائم، والبطن، ثم تشبيه يجمعها. وهو من الأبيات التي أخذها النقاد عليه: قال ابن قُتَيْبة: «قالوا: وقد سبق في صفة الثور إلى معنى لم يحسن فيه» [@ibn-qutayba، ج1 ص168]، ثم أنشد هذا البيت وقال: «وأخذه الطرماح فأحسن»، و«كان الأصمعي يستحسن قول الطرماح» [@ibn-qutayba، ج1 ص169]. وقول الطِّرِمّاح في الثور: «يَبْدُو وَتُضْمِرُهُ الْبِلَادُ كَأَنَّهُ / سَيْفٌ عَلَى شَرَفٍ يُسَلُّ وَيُغْمَدُ» [@ibn-qutayba، ج1 ص169]."
syntax:
  - "«مِنْ وَحْشِ» جار ومجرور متعلق بمحذوف صفة لـ«مُسْتَأْنِسٍ» في البيت السابق، و«وَجْرَةَ» مضاف إليه مجرور بالفتحة لأنه ممنوع من الصرف للعلمية والتأنيث."
  - "«مَوْشِيٍّ» صفة ثانية مجرورة، و«أَكَارِعُهُ» نائب فاعل لاسم المفعول «موشيّ»، لأنه يعمل عمل فعله المبني للمجهول."
  - "«طَاوِي الْمَصِيرِ» صفة ثالثة، وهي إضافة لفظية لا تفيد تعريفًا. و«كَسَيْفِ» متعلق بمحذوف صفة رابعة، و«الصَّيْقَلِ» مضاف إليه، و«الْفَرَدِ» صفة لـ«سيف» مجرورة."
morphology:
  - "«مَوْشِيّ» اسم مفعول من «وَشَى»، أصله «مَوْشُوي» فقُلبت الواو ياء وأُدغمت في الياء."
  - "«طَاوِي» اسم فاعل من «طَوِيَ» إذا ضمر بطنه. و«الْمَصِير» واحد جمعه «مُصْران»، وجمع الجمع «مصارين» كما نقل التِّبْرِيزِيّ."
  - "«الْفَرَد» على «فَعَل»، ويقال «الفُرُد» بضمتين كما نقل ابن السِّكِّيت."
rhetoric:
  thesis: "صورة بصرية: نقط سود على القوائم، وبياض لامع على الجسم كبياض السيف المصقول. وقد اختلف القدماء في كلمة القافية «الْفَرَدِ»: أهي «لا نظير له» أم «مسلول من غمده»؟ فمن فهمها على الثاني عاب البيت لأن اللفظ لا يؤدي المعنى."
  devices:
    - title: "التشبيه بالسيف"
      text: "في «كَسَيْفِ الصَّيْقَلِ» شبّه الثور بالسيف في البياض واللمعان. وهو عند عبد القاهر الجُرْجانيّ من التشبيه الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل»، كالتشبيه «من جهة اللّون» [@asrar، ص90]. وزاد الصيقل لأن السيف المصقول أشد لمعانًا."
    - title: "ما أُخذ على «الْفَرَدِ»"
      text: "يرى أبو هِلال العَسْكَرِيّ أن النابِغة «أساء» في هذا البيت، لأنه «أراد بالفرد أنه مسلول من غمده، فلم يبن بقوله» عن سلّه «بيانا واضحا»، ويجعل بيت الطِّرِمّاح «غاية في حسن الوصف» [@sinaatayn، ص85]. فالطِّرِمّاح صوّر الثور يظهر ويختفي في الأرض كسيف يُسلّ ويُغمد، فأدى الحركة بلفظ صريح، أما «الفرد» فكلمة تحتمل معاني."
    - title: "الكناية في «طَاوِي الْمَصِيرِ»"
      text: "ذكر ضمور المصير، أي الأمعاء، وأراد ضمور البطن، كما يقول الأَعْلَم: «والمصير: المعى، وكنى به عن البطن» [@diwan-nabigha، ص17]. وضمور البطن علامة السرعة في وصف الحيوان."
  connection: "ثم يذكر ليلته: سحابة ليلية تسوق عليه ريح الشمال بَرَدًا."
