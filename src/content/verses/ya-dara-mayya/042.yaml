first: "مَهْلًا فِدَاءٌ لَكَ الْأَقْوَامُ كُلُّهُمُ"
second: "وَمَا أُثَمِّرُ مِنْ مَالٍ وَمِنْ وَلَدِ"
meaning: "تمهّل في أمري ولا تعجل عليّ، فداؤك الناس جميعًا، وكل ما أجمعه وأنمّيه من مال وولد. قال الأَعْلَم: «أي تَثَبَّتْ في أمري ولا تعجل عليّ»، وقال في «أُثَمِّرُ»: «أي أُكثّر وأُصلح، يقال: ثَمَّرَ اللهُ مالَه، أي كثّره» [@diwan-nabigha، ص26]. وقال التِّبْرِيزِيّ في «فداء»: «والمعنى الأقوام كلهم يفدونك فداء» [@tabrizi-ashr، ص320]."
vocabulary:
  - term: "مَهْلًا"
    text: "تمهّلْ وتأنَّ. قال البَغْداديّ: «وقوله: مهلا بمعنى أمهل وتأن» [@khizana، ج6 ص182]."
  - term: "فِدَاءٌ"
    text: "ما يُبذل لافتداء غيره ووقايته، أي هم يُبذلون عنك."
  - term: "الْأَقْوَامُ"
    text: "الناس على اختلاف قبائلهم."
  - term: "أُثَمِّرُ"
    text: "«أثمر: اجمع» [@tabrizi-ashr، ص320]، أي أجمع وأنمّي. وقال البَغْداديّ: «وأثمر: أجمع وأصلح. يقال: ثمر فلان ماله إذا أصلحه وجمعه» [@khizana، ج6 ص182]."
context: "أول بيتي الاستعطاف (42–43): بعد القسم والبراءة يتحول الشاعر من النفي إلى الرجاء. وهو البيت الثاني والأربعون عند الأَعْلَم أيضًا، لكنه عنده يأتي بعد «أُنْبِئْتُ أَنَّ أَبَا قَابُوسَ أَوْعَدَنِي» (البيت 48 عندنا)، فيكون «مَهْلًا» جوابًا مباشرًا للوعيد، وكذلك ترتيبه عند شَوْقي ضَيْف [@deif، ج1 ص287]. وهو من الأبيات التي يروي ابن قُتَيْبة أن النابِغة دسّها إلى النُّعْمان، وهي عنده الثانية بعد بيت الوعيد [@ibn-qutayba، ج1 ص165]. ويقول شَوْقي ضَيْف في هذا الموضع: «وسرعان ما يعود إلى الاستعطاف، فالناس جميعا من غساسنة وغير غساسنة فداء النعمان، بل إنه ليفديه بماله وولده» [@deif، ج1 ص287]، ويرى أن هذا التذلل «حسن تأتّ لا صغار نفس ولا مهانة، ولا طلبا لعصافير النعمان كما قال أبو عمرو بن العلاء» [@deif، ج1 ص286]، وهذا رأيه، أما أبو عَمْرو بن العَلاء فيقول فيما ينقله الأَعْلَم إن النابِغة كان آمنًا لو أقام في أرضه، «ولكنه تذكَّر ما كان يعطيه، فلم يصبر فأتاه» [@diwan-nabigha، ص29]."
syntax:
  - "«مَهْلًا» مفعول مطلق لفعل محذوف تقديره: أَمْهِلْ مهلًا."
  - "«فِدَاءٌ لَكَ الْأَقْوَامُ» «فِدَاءٌ» خبر مقدم، و«الْأَقْوَامُ» مبتدأ مؤخر، و«لَكَ» متعلق بـ«فِدَاءٌ». ونقل البَغْداديّ عن الزَّمَخْشَرِيّ: «فداءٌ بالرفع على أنه خبر الأقوام» [@khizana، ج6 ص182]. وهذا التركيب معروف في الدعاء، يذكره سِيبَوَيْه في المصادر المرفوعة: «ومن هذا الباب: فِداءٌ لك أبى وأمّى» [@sibawayh، ج1 ص332]. و«كُلُّهُمُ» توكيد للأقوام."
  - "«وَمَا أُثَمِّرُ» قال البَغْداديّ: «وقوله: وما أثمر معطوفة على الأقوام وهي موصولة والعائد محذوف أي: أثمره»، ثم قال: «ومن للبيان» [@khizana، ج6 ص182]، أي «مِنْ مَالٍ وَمِنْ وَلَدِ» بيان لـ«ما»."
morphology:
  - "«مَهْل» مصدر «مَهَلَ»، يقال: مَهْلًا، أي رِفْقًا."
  - "«فِدَاء» مصدر «فَدَى يَفْدِي»، ويُمدّ ويُقصر إذا كُسرت فاؤه، ونقل البَغْداديّ عن صاحب الصِّحاح: «الفدا إذا كسر أوله يمد ويقصر وإذا فتح فهو مقصور» [@khizana، ج6 ص181]."
  - "«أُثَمِّرُ» مضارع «ثَمَّرَ» على «فَعَّلَ»، والتضعيف للتكثير."
  - "«الْأَقْوَام» جمع «قَوْم» على «أَفْعال»."
rhetoric:
  thesis: "بعد أن حلف ونفى، لا يكتفي بالبراءة، بل يدخل في عفو الملك. وأول كلمة في البيت «مَهْلًا»: لا يطلب العفو صراحة، بل يطلب التمهّل، أي أن يُنظر في أمره قبل العقاب. ثم يبذل الفداء، فيبدأ بالناس جميعًا وينتهي بأعزّ ما عنده: ماله وولده."
  devices:
    - title: "التضرع بعد الحجة"
      text: "يقول ابن رَشِيق إن حق المعتذر إلى الملوك «أن يلطف برهانه مدمجاً في التضرع والدخول تحت عفو الملك» [@ibn-rashiq، ج2 ص176]. فالقسم في الأبيات 37–41 هو البرهان، وهذا البيت هو التضرع. ويرى شَوْقي ضَيْف أن النابِغة «كان فاتحا لباب الاعتذار على مصراعيه» [@deif، ج1 ص292]، وهذا الجمع بين الحلف والتذلل من أوضح ما يدل عليه."
    - title: "الترقي في «الْأَقْوَامُ كُلُّهُمُ / وَمَا أُثَمِّرُ مِنْ مَالٍ وَمِنْ وَلَدِ»"
      text: "الترقي أن يبدأ المتكلم بالأدنى ثم يصعد إلى الأعلى. فالناس كلهم فداء يسهل بذله لأنهم غيره، ثم يصعد إلى ما يملكه، ثم إلى الولد، وهو أعزّ ما يُفدى به. فكلما تقدم البيت اقترب الفداء من نفس الشاعر."
  connection: "ثم يرجوه ألا يرميه بما لا طاقة له به، ولو اجتمع حوله الأعداء يتعاونون عليه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "مَهْلَنْ فِدَا / ءُنْ لَكَلْ / أَقْوَامُ كُلْ / لُهُمُو = مستفعلن / فاعلن / مستفعلن / فعِلن — وَمَا أُثَمْ / مِرُ مِنْ / مَالِنْ وَمِنْ / وَلَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى و«فاعلن» الثانية من العجز، فصارتا «متفعلن» و«فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الميم في «كُلُّهُمُ» فتصير «كُلُّهُمُو»."
variants:
  - reading: "مَهْلًا فِدَاءً لَكَ الْأَقْوَامُ كُلُّهُمُ"
    status: "رواية الأَعْلَم، وهو البيت 42 عنده، ووجه ذكره التِّبْرِيزِيّ"
    note: "بالنصب [@diwan-nabigha، ص26]. قال التِّبْرِيزِيّ: «ويروى (فداء) على المصدر، والمعنى الأقوام كلهم يفدونك فداء» [@tabrizi-ashr، ص320]. ونقل البَغْداديّ عن الزَّمَخْشَرِيّ أن النصب «على أنه مصدر لفعله وهو ليفدك الأقوام» [@khizana، ج6 ص182]."
  - reading: "مَهْلًا فِدَاءِ لَكَ الْأَقْوَامُ كُلُّهُمُ"
    status: "رواية ذكرها الأَعْلَم والتِّبْرِيزِيّ، وأنشدها الأَصْمَعِيّ منوّنة «فِدَاءٍ»"
    note: "بالكسر على البناء، بمعنى الأمر: ليفدِك الأقوام. قال التِّبْرِيزِيّ: «ويروى (فداء) بمعنى ليفدك، فبناه كما بنى الأمر نحو دَرَاكِ وتَرَاكِ لأنه بمعنى أدرك واترك» [@tabrizi-ashr، ص320]. وقال الأَعْلَم: «ويروى: «فداءِ لك» بكسر الهمز؛ وإنما جاز ذلك لأنها كثرت في الاستعمال، ووقعت موقع فِعْلِ الدعاء، فبُنِيَتْ ودخلها التنوين مع البناء» [@diwan-nabigha، ص26]. وفي اللسان: «ومن العرب من يكسر فداء، بالتنوين، إذا جاور لام الجر خاصة فيقول فداء لك لأنه نكرة، يريدون به معنى الدعاء؛ وأنشد الأصمعي للنابغة» ثم البيت [@lisan، ج15 ص150]. وعليه استشهد به البَغْداديّ: «على أن فداء اسم فعل منقول من المصدر» [@khizana، ج6 ص181]."
