first: "وَقَفْتُ فِيهَا أَصِيلًا كَيْ أُسَائِلَهَا"
second: "عَيَّتْ جَوَابًا وَمَا بِالرَّبْعِ مِنْ أَحَدِ"
meaning: "وقفت في الدار عشيًّا لأسألها عن أهلها، فعجزت عن الجواب، وليس في المنزل أحد يجيب عنها. قال التِّبْرِيزِيّ: «فمن روى أصيلا أراد عشيا»، وقال في «عيّت جوابًا»: «أي عيت أن تجيب» [@tabrizi-ashr، ص308–309]. وفي شرح الأَعْلَم أنه «مر بالدار عشيا قصيرا، فوقف فيها وسألها عن أهلها؛ توجعا وتذكرا» [@diwan-nabigha، ص14]."
vocabulary:
  - term: "أَصِيلًا"
    text: "عشيًّا [@tabrizi-ashr، ص308]. و«الأصيل ما بعد الظهر إلى الغروب» [@khizana، ج4 ص6]."
  - term: "أُسَائِلَهَا"
    text: "أسألها، والمفاعلة هنا للتكرار: يعيد عليها السؤال."
  - term: "عَيَّتْ"
    text: "عجزت. «يقال: عييت بالأمر؛ إذا لم تعرف وجهه» [@tabrizi-ashr، ص309]."
  - term: "الرَّبْعِ"
    text: "«منزل القوم؛ وكأنه سمي بذلك لإقامتهم فيه زمن الربيع» [@diwan-nabigha، ص14]."
context: "يكمل المطلع: نادى الدار في البيت الأول، وهنا يقف بها ويسألها فلا تجيب، فيمهّد للاستثناء في البيت التالي. وهذا البيت والذي قبله والذي بعده شاهد سِيبَوَيْه [@sibawayh، ج2 ص320–321]."
syntax:
  - "«وَقَفْتُ» فعل وفاعل، و«فِيهَا» متعلق به. و«أَصِيلًا» ظرف زمان منصوب."
  - "«كَيْ أُسَائِلَهَا»: «كي» حرف مصدري ينصب المضارع، واللام قبلها مقدرة، أي: لكي أسائلها. والمصدر المؤول في موضع جر باللام المقدرة، متعلق بـ«وقفت»."
  - "«عَيَّتْ جَوَابًا» جملة مستأنفة، كأن سائلًا سأل: فما أجابت؟ و«جَوَابًا» قال فيه التِّبْرِيزِيّ: «منصوب على المصدر، أي عيت أن تجيب» [@tabrizi-ashr، ص309]."
  - "«وَمَا بِالرَّبْعِ مِنْ أَحَدِ»: الواو للحال، و«مَا» نافية، و«بِالرَّبْعِ» خبر مقدم، و«أَحَدِ» مبتدأ مؤخر مجرور لفظًا بـ«من» الزائدة مرفوع محلًّا. قال التِّبْرِيزِيّ: «ومِنْ: زائدة» [@tabrizi-ashr، ص309]. وزيادتها تفيد استغراق النفي: لا أحد البتة."
morphology:
  - "«أَصِيل» على «فَعِيل». وفي روايته الأخرى «أُصَيْلانًا» خلاف: يجعله الأَعْلَم «تصغير أصيل» [@diwan-nabigha، ص14]، ويحكي التِّبْرِيزِيّ قولين: أنه تصغير «أُصْلان» جمع أصيل، أو أنه اسم مفرد على «فُعْلان» مثل «غُفْران» ثم صُغّر، ويقول: «وهذا القول الصحيح، والأول خطأ؛ لأن أُصلاناً لا يجوز أن يصغر، إلا أن يُرد إلى أقل العدد، وهو حكم كل جمع كثير» [@tabrizi-ashr، ص309]. أي إن جمع الكثرة لا يُصغَّر على لفظه."
  - "و«أُصَيْلال» عند صاحب اللسان «على البدل أبدلوا من النون لاما» [@lisan، ج11 ص17]، أي إنها «أُصَيْلان» نفسها قُلبت نونها لامًا."
  - "«أُسَائِل» مضارع «سَاءَلَ» على «فاعَلَ». و«عَيَّتْ» أصله «عَيِيَتْ» من «عَيِيَ»، أُدغمت الياء في الياء."
rhetoric:
  thesis: "سؤال لا جواب له: يسأل الدار، والدار لا تنطق، ولا أحد فيها ينطق عنها. فالبيت يقيم خرابها بنفيين: عجزها عن الجواب، وخلوها من الناس."
  devices:
    - title: "تشخيص الدار"
      text: "في «أُسَائِلَهَا» و«عَيَّتْ جَوَابًا» يعامل الدار معاملة إنسان يُسأل فيعجز. وهذا ما يسميه عبد القاهر الجُرْجانيّ الاستعارة التي لا يُذكر فيها المشبه به، بل يُعطى المشبه شيئًا من خصائصه، كما في بيت لَبِيد «بيد الشمال زمامها»: «وذلك أنه جعل للشمال يداً، ومعلوم أنه ليس هناك مُشار إليه يمكن أن تُجْرَى اليد عليه» [@asrar، ص45]. وكذلك الدار هنا: جعل لها العيّ، والعيّ لا يكون إلا لمن يتكلم."
    - title: "دلالة التصغير في «أُصَيْلانًا»"
      text: "في رواية الأَعْلَم «أُصَيْلانًا» يحمل التصغير معنى: «وإنما صغره ليدل على [قصر] الوقت، وأنه لشدة حزنه وتوجعه لم يمنعه ضيق الوقت وقصره من الوقوف بالدار، والسؤال عن أهلها» [@diwan-nabigha، ص14]. فالوقت ضيق، ومع ذلك وقف."
    - title: "النفي المستغرق"
      text: "«وَمَا بِالرَّبْعِ مِنْ أَحَدِ»: زيادة «من» تجعل النفي عامًّا لا يستثني أحدًا، ثم يستثني الشاعر في البيت التالي ما ليس من الناس، فيكون الاستثناء نفسه شاهدًا على الخراب."
  connection: "ثم يستثني من هذا النفي ما بقي في الدار: محابس الخيل والنؤي."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَقَفْتُ فِي / هَا أَصِي / لَنْ كَيْ أُسَا / ئِلَهَا = متفعلن / فاعلن / مستفعلن / فعِلن — عَيْيَتْ جَوَا / بَنْ وَمَا / بِرْرَبْعِ مِنْ / أَحَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن». والعروض والضرب مخبونان «فعِلن» [@atiq، ص48]."
variants:
  - reading: "وَقَفْتُ فِيهَا أُصَيْلَانًا أُسَائِلُهَا"
    status: "رواية الأَعْلَم"
    note: "هي رواية الأَصْمَعِيّ في نسخة الأَعْلَم [@diwan-nabigha، ص14]، وبها أنشد سِيبَوَيْه [@sibawayh، ج2 ص321]، ويذكرها التِّبْرِيزِيّ: «ويروى (أصيلانا)» [@tabrizi-ashr، ص308]. وسقطت فيها «كي» فرُفع الفعل، وجملة «أُسَائِلُهَا» حال. ويذكر محقق الديوان «وقفت فيها أصيلا كي أسائلها» رواية للتِّبْرِيزِيّ دون ابن السِّكِّيت والبَطَلْيَوْسِيّ [@diwan-nabigha، ص235]."
  - reading: "وَقَفْتُ فِيهَا أُصَيْلَالًا أُسَائِلُهَا"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "يذكرها التِّبْرِيزِيّ مع «أصيلانا» [@tabrizi-ashr، ص308]، وبها ينشده صاحب اللسان [@lisan، ج11 ص17]."
  - reading: "وَقَفْتُ فِيهَا طَوِيلًا كَيْ أُسَائِلَهَا"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "قال التِّبْرِيزِيّ: «ومن روى طويلا جاز أن يكون معناه وقوفا طويلا، ويجوز أن يكون معناه وقتا طويلا» [@tabrizi-ashr، ص308]."
