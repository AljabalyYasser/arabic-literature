first: "فَلَا لَعَمْرُ الَّذِي قَدْ زُرْتُهُ حِجَجًا"
second: "وَمَا هُرِيقَ عَلَى الْأَنْصَابِ مِنْ جَسَدِ"
meaning: "لا، وحقِّ البيت الذي زرته سنين متتابعة، وحقِّ ما أُريق من دم على حجارة الذبائح. هذا أول القسم، وجوابه يأتي في البيت 39: ما أتيت بشيء تكرهه. قال البَغْداديّ: «أقسم بالبيت الذي زاره في سنين متعددة وهو البيت الحرام» [@khizana، ج5 ص73]. وقال التِّبْرِيزِيّ: «هُريق وأريق واحد، والأنصاب: حجارة كانت الجاهلية تنصبها وتذبح عندها، والجسد هنا: الدم» [@tabrizi-ashr، ص319]."
vocabulary:
  - term: "لَعَمْرُ"
    text: "قَسَم بحياة الشيء أو بقائه. وفي اللسان: «فإذا أقسموا فقالوا: لعمرك فتحوا لا غير»، و«يرفعونه بالابتداء ويضمرون الخبر كأنه قال: لعمرك قسمي أو يميني» [@lisan، ج4 ص601]."
  - term: "حِجَجًا"
    text: "سنين، قال البَغْداديّ: «وحججاً: جمع حجة بكسر المهملة فيهما وبعدها جيم وهي السنة» [@khizana، ج5 ص73]."
  - term: "هُرِيقَ"
    text: "أُريق وصُبّ، والهاء فيه بدل من الهمزة (انظر الصرف)."
  - term: "الْأَنْصَابِ"
    text: "حجارة كانوا ينصبونها ويذبحون عندها [@tabrizi-ashr، ص319]، وعند الأَعْلَم: «حجارة كانوا يذبحون عليها العتائر لآلهتهم» [@diwan-nabigha، ص25]. والعتائر ذبائح كانوا يتقربون بها."
  - term: "جَسَدِ"
    text: "الدم، وفي اللسان: «الجوهري: الجسد الدم؛ قال النابغة: وما هريق على الأنصاب من جسد» [@lisan، ج3 ص121]، وعند الأَعْلَم: «والجَسَد: الدم اللازق» [@diwan-nabigha، ص25]."
context: "أول أبيات القسم والبراءة (37–41): بعد المدح وتعداد العطايا يحلف الشاعر على براءته. وهو البيت السابع والثلاثون عند الأَعْلَم أيضًا. وعنده تبدأ الأبيات التي يجعلها ابن رَشِيق مثالًا لأعلى الاعتذار، فهو يقول: «وأجل ما وقع في الاعتذار من مشهورات العرب قصائد النابغة الثلاث: إحداهن: يا دار مية بالعلياء فالسند يقول فيها»، ثم ينشد هذا البيت وما بعده [@ibn-rashiq، ج2 ص177]. وهو من الأبيات التي يروي ابن قُتَيْبة أن النابِغة دسّها إلى النُّعْمان حين عاد مع الفَزاريَّيْن، فلما سمعها النُّعْمان «أقسم بالله إنه لشعر النابغة» [@ibn-qutayba، ج1 ص166]. ويصف شَوْقي ضَيْف هذا الموضع بأن الشاعر «يقسم له بأيمانه الوثنية المغلظة أنه برئ مما يتّهم به من غدر» [@deif، ج1 ص287]."
syntax:
  - "«فَلَا» في «لا» الداخلة على القسم قولان ينقلهما البَغْداديّ: «قيل نافية منفيّها محذوف أي: ليس الأمر كما زعموا وقيل: زائدة توطئة لنفي جواب القسم» [@khizana، ج5 ص73]. والفاء استئنافية."
  - "«لَعَمْرُ الَّذِي» اللام لام الابتداء، و«عَمْرُ» مبتدأ خبره محذوف وجوبًا، قال البَغْداديّ: «وعمر مبتدأ محذوف الخبر وجوبا أي: قسمي» [@khizana، ج5 ص73]. و«الَّذِي» اسم موصول مضاف إليه، وجملة «قَدْ زُرْتُهُ» صلته، و«حِجَجًا» ظرف زمان منصوب."
  - "«وَمَا هُرِيقَ» «ما» اسم موصول معطوف على «الَّذِي»، قال البَغْداديّ: «وما معطوف على الذي وكذا قوله والمؤمن» [@khizana، ج5 ص73]. وجملة «هُرِيقَ» صلته، و«عَلَى الْأَنْصَابِ» متعلق بـ«هُرِيقَ»، و«مِنْ جَسَدِ» بيان لـ«ما»."
  - "وجواب القسم لا يأتي إلا في البيت 39 «مَا إِنْ أَتَيْتُ بِشَيْءٍ أَنْتَ تَكْرَهُهُ»، ففصل بينهما البيت 38 كله، وهو تكملة للمقسَم به."
morphology:
  - "«عَمْر» بفتح العين لغة في «عُمْر»، والقسم لا يكون إلا بالفتح كما في اللسان [@lisan، ج4 ص601]."
  - "«هُرِيقَ» ماضي «هَرَاقَ» المبني للمجهول، وأصله «أَرَاقَ»، أُبدلت الهمزة هاء، قال البَغْداديّ: «هريق بمعنى أريق والهاء بدل من الهمزة» [@khizana، ج5 ص73]. وفي اللسان: «وأصل هراق أراق يريق إراقة» [@lisan، ج10 ص366]."
  - "«حِجَج» جمع «حِجّة» على «فِعَل»، و«الْأَنْصَاب» جمع «نُصُب» على «أَفْعال»."
rhetoric:
  thesis: "بعد أن عدّد نِعَم الملك، يحلف على أنه لم يكفرها. ويختار للقسم أقدس ما يعرفه: البيت الحرام والدماء المقرّبة إلى الآلهة. ثم يضيف إلى المقدّس فعله هو: «قَدْ زُرْتُهُ حِجَجًا»، فالحالف رجل حجّ البيت سنين، فيمينه يمين رجل يعرف حرمة ما يحلف به."
  devices:
    - title: "القسم بدل الحجة"
      text: "يقول ابن رَشِيق في باب الاعتذار: «فإن إتيان المعتذر من باب الاحتجاج وإقامة الدليل خطأ، لا سيما مع الملوك وذوي السلطان، وحقه أن يلطف برهانه مدمجاً في التضرع والدخول تحت عفو الملك» [@ibn-rashiq، ج2 ص176]. فالنابِغة هنا لا يجادل الملك ولا يبرهن، بل يحلف، واليمين برهان لا يُناقَش."
    - title: "الكناية عن الموصوف في «الَّذِي قَدْ زُرْتُهُ حِجَجًا»"
      text: "لم يسمّ البيت، بل دلّ عليه بما يلزمه: أنه يُزار سنة بعد سنة. والكناية عند عبد القاهر الجُرْجانيّ «أن يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة» [@dalail، ص66]، بل بمعنى يتبعه. وفي هذا التعريف بالموصول تعظيم، كأن البيت لا يحتاج إلى اسم."
    - title: "تأخير جواب القسم"
      text: "يمدّ القسم على بيتين (37–38)، ولا يأتي الجواب إلا في البيت 39. فيبقى السامع، وهو الملك، معلّقًا بالمقسَم به حتى يعظم في نفسه، ثم يأتي النفي بعد ذلك ثقيلًا."
  connection: "ثم يتمّ القسم بالله الذي آمن الطير العائذة بالحرم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَلَا لَعَمْ / رُلْلَذِي / قَدْ زُرْتُهُو / حِجَجَنْ = متفعلن / فاعلن / مستفعلن / فعِلن — وَمَا هُرِي / قَ عَلَلْ / أَنْصَابِ مِنْ / جَسَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «زُرْتُهُ» فتصير «زُرْتُهُو» ليستقيم الوزن."
variants:
  - reading: "فَلَا لَعَمْرُ الَّذِي مَسَّحْتُ كَعْبَتَهُ"
    status: "رواية الأَعْلَم، وهو البيت 37 عنده، وبها ينشده ابن قُتَيْبة وابن رَشِيق"
    note: "قال الأَعْلَم: «أي أتيت بيته وطُفْتُ به، والكعبة: كل بيت مربّع؛ وبه سُمّيت الكعبة» [@diwan-nabigha، ص25]. وبها ينشده ابن قُتَيْبة [@ibn-qutayba، ج1 ص166] وابن رَشِيق [@ibn-rashiq، ج2 ص177] وشَوْقي ضَيْف [@deif، ج1 ص286]. فـ«الَّذِي» على هذه الرواية ربّ البيت لا البيت. ويقول محقق الديوان: «ابن السكيت والتبريزي: فلا لعمر الذي قد زرته حججا» [@diwan-nabigha، ص235]، وبها ينشده البَغْداديّ [@khizana، ج5 ص73]."
  - reading: "وَمَا أُرِيقَ عَلَى الْأَنْصَابِ مِنْ جَسَدِ"
    status: "رواية ابن قُتَيْبة"
    note: "بالهمزة في موضع الهاء [@ibn-qutayba، ج1 ص166]، والمعنى واحد."
