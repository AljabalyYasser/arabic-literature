first: "وَالسَّاحِبَاتِ ذُيُولَ الْمِرْطِ فَنَّقَهَا"
second: "بَرْدُ الْهَوَاجِرِ كَالْغِزْلَانِ بِالْجَرَدِ"
meaning: "ويهب الجواري اللواتي يجررن أذيال ثيابهن الطويلة، نعّمهن أنهن يقضين حرّ الظهيرة في الظل البارد، فهن كالغزلان في أرض مكشوفة لا شجر فيها. قال التِّبْرِيزِيّ: «وعنى بالساحبات الجواري، وفنقها: طيب عيشها» [@tabrizi-ashr، ص318]، وقال الأَعْلَم في «بَرْدُ الْهَوَاجِرِ»: «أي هي في الهواجر في موضع بارد؛ فلا يؤذيها وهج الشمس» [@diwan-nabigha، ص22]."
vocabulary:
  - term: "السَّاحِبَاتِ"
    text: "اللواتي يجررن، من سَحَبَ الثوبَ إذا جرّه على الأرض، والمراد الجواري."
  - term: "الْمِرْطِ"
    text: "في اللسان: «والمرط كساء من خز أو صوف أو كتان» [@lisan، ج7 ص401]، وكانت النساء يلتحفن به."
  - term: "فَنَّقَهَا"
    text: "نعّمها. وفي اللسان: «وفَنَّقَهُ غَيْرُهُ تَفْنِيقاً وفَانَقهُ بِمَعْنًى أَي نَعّمه» [@lisan، ج10 ص312]."
  - term: "الْهَوَاجِرِ"
    text: "جمع هاجِرة، وهي نصف النهار في شدة الحر."
  - term: "الْجَرَدِ"
    text: "«والجرد: الموضع الذي لا ينبت» [@tabrizi-ashr، ص318]، وعند الأَعْلَم: «أرض جرداء لا شجر فيها ولا نبات» [@diwan-nabigha، ص23]."
context: "ثالث أبيات العطايا (32–36): بعد الإبل يذكر الجواري. وهذا هو المعنى الذي يلخصه شَوْقي ضَيْف حين يقول إنه مدح النُّعْمان بما وهبه «من قطعان الإبل والخيل ومن الجوارى المنعّمات» [@deif، ج1 ص286]. وهو البيت الثلاثون عند الأَعْلَم، وروايته فيه «وَالرَّاكِضَاتِ ذُيُولَ الرَّيْطِ فَانَقَهَا» (انظر الروايات). وفي البيت انتقال من صورة الإبل السمينة في المرعى إلى صورة النساء المنعّمات في الظل، وكلتاهما صورة رفاهية: فما يهبه النُّعْمان ليس كثيرًا فحسب، بل هو في أحسن حال."
syntax:
  - "«وَالسَّاحِبَاتِ» الواو عاطفة، و«السَّاحِبَاتِ» معطوف على «الْمِائَةَ» في البيت السابق، منصوب بالكسرة لأنه جمع مؤنث سالم، وهو صفة لموصوف محذوف، أي الجواري الساحبات."
  - "«ذُيُولَ الْمِرْطِ» مفعول به لاسم الفاعل «السَّاحِبَاتِ» منصوب، و«الْمِرْطِ» مضاف إليه. وأفرد «الْمِرْطِ» وأراد الجنس، أي ذيول مروطهن."
  - "«فَنَّقَهَا بَرْدُ الْهَوَاجِرِ» جملة حالية: «فَنَّقَ» فعل ماض، والهاء مفعول به، و«بَرْدُ» فاعل، و«الْهَوَاجِرِ» مضاف إليه. والضمير في «فَنَّقَهَا» ضمير الواحدة يعود على «السَّاحِبَاتِ»، والعرب تعيد ضمير الواحدة المؤنثة على جمع المؤنث."
  - "«كَالْغِزْلَانِ» جار ومجرور متعلق بمحذوف حال ثانية من «السَّاحِبَاتِ»، و«بِالْجَرَدِ» متعلق بمحذوف حال من «الْغِزْلَانِ»، أي كائنة بالجرد."
morphology:
  - "«السَّاحِبَات» جمع «ساحِبة»، اسم فاعل من «سَحَبَ» على «فاعِلة»."
  - "«فَنَّقَ» على «فَعَّلَ»، والتضعيف للتعدية، ومثله «فانَقَ» على «فاعَلَ» في رواية الأَعْلَم، والمعنى واحد كما في اللسان [@lisan، ج10 ص312]."
  - "«الْهَوَاجِر» جمع «هاجِرة» على «فَوَاعِل»، و«الْغِزْلَان» جمع «غَزال» على «فِعْلان»."
rhetoric:
  thesis: "يجعل النعمة ظاهرة في هيئة الجواري: ثياب طويلة تُسحب على الأرض، وحياة لا يمسّها حرّ الهاجرة. ثم يشبههن بالغزلان، ويختار للغزلان أرضًا جرداء، فلا يستر محاسنهن شيء."
  devices:
    - title: "الكناية في «السَّاحِبَاتِ ذُيُولَ الْمِرْطِ»"
      text: "الكناية أن يريد المتكلم معنى فلا يذكره بلفظه بل بما يلزمه. فسحب الذيل يلزمه طول الثوب، وطول الثوب يلزمه الترف وأن صاحبته لا تخدم ولا تعمل، كما يقول الأَعْلَم في رواية «الراكضات»: «يعني الجواري يركُضن بأرجلهن مآخر الرَّيط، لسبوغه عليهن، وتبخترهن فيه» [@diwan-nabigha، ص22]."
    - title: "التشبيه في «كَالْغِزْلَانِ بِالْجَرَدِ»"
      text: "ذكر الأَعْلَم وجه الشبه: «ثم شبّههن بالغزلان في طول الأعناق، وضُمْر الخصور، وحُسن العيون»، ثم علّل اختيار المكان: «وإنما خصّه لأن الغزلان إذا كانت به بدت محاسنها للناظر، ولم يحجبها عنه شيء» [@diwan-nabigha، ص22–23]. وهذا ما يسميه عبد القاهر الجُرْجانيّ التفصيل في التشبيه: «أنَّ معك وصفين أو أوصافاً، فأنت تنظر فيها واحداً واحداً، وتَفْصِل بالتأمّل بعضها من بعض» [@asrar، ص166]. فالشاعر لم يكتف بالغزلان، بل وضعها في أرض مكشوفة لتتم الصورة."
  connection: "ثم يذكر الخيل تسرع في أعنّتها كالطير الهاربة من البرد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَسْسَاحِبَا / تِ ذُيُو / لَلْمِرْطِ فَنْ / نَقَهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — بَرْدُلْ هَوَا / جِرِ كَلْ / غِزْلَانِ بِلْ / جَرَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، وسائر الحشو تام. والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "وَالرَّاكِضَاتِ ذُيُولَ الرَّيْطِ فَانَقَهَا"
    status: "رواية الأَعْلَم، وهو البيت 30 عنده"
    note: "قال: «والرَّيط: الملاحف البيض. ومعنى «فانقها»: نعّم عيشها» [@diwan-nabigha، ص22]. ويذكر التِّبْرِيزِيّ «الراكضات»: «ويروى (الراكضات)» [@tabrizi-ashr، ص318]، وبها ينشده صاحب اللسان مع «فَنَّقَها»: «والمرأة تركض ذيولها برجليها إذا مشت» [@lisan، ج7 ص159]. وفي نسخة الشاملة للتِّبْرِيزِيّ «بالجَرَدْ» بسكون الدال، والقافية مكسورة، فهو خطأ في الطبع."
  - reading: "أَنَّقَهَا"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«ويروى (أنقها) أي أعطاها ما يعجبها» [@tabrizi-ashr، ص318]."
  - reading: "زَيَّنَهَا"
    status: "رواية ابن السِّكِّيت"
    note: "يقول محقق الديوان عند البيت 30 من رواية الأَعْلَم: «ابن السكيت: زينها» [@diwan-nabigha، ص235]."
