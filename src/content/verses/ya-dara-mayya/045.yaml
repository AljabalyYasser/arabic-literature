first: "يَمُدُّهُ كُلُّ وَادٍ مُزْبِدٍ لَجِبٍ"
second: "فِيهِ حُطَامٌ مِنَ الْيَنْبُوتِ وَالْخَضَدِ"
meaning: "يزيد ماءَ الفرات كلُّ وادٍ يصبّ فيه، كثير الزبد شديد الصخب، يحمل ما تكسّر من شجر الينبوت وأغصان النبت. قال الأَعْلَم: «أي يزيد فيه ويُقوّيه»، وقال في «لَجِبٍ»: «المصوِّت؛ لشِدّة جَرْيه وقوة سَيْله» [@diwan-nabigha، ص27]. فالفرات في هذه الحال لا يجري بمائه وحده، بل تجتمع فيه السيول من كل جهة."
vocabulary:
  - term: "يَمُدُّهُ"
    text: "يزيده ماءً."
  - term: "مُزْبِدٍ"
    text: "كثير الزبد، أي مضطرب الماء."
  - term: "لَجِبٍ"
    text: "«واللجب: ذو الصوت» [@tabrizi-ashr، ص321]."
  - term: "حُطَامٌ"
    text: "ما تكسّر وتفتّت."
  - term: "الْيَنْبُوتِ"
    text: "«ضرب من النبت» [@tabrizi-ashr، ص321]. وفي اللسان عن أبي حَنِيفة الدِّينَوَريّ: «الينبوت ضربان أحدهما هذا الشوك القصار الذي يسمى الخروب»، ثم قال: «وهي التي ذكرها النابغة» [@lisan، ج2 ص97]."
  - term: "الْخَضَدِ"
    text: "«ما ثني وكسر من النبت» [@tabrizi-ashr، ص321]. وفي اللسان: «والخضد: ما تكسر وتراكم من البردي وسائر العيدان الرطبة» [@lisan، ج3 ص162]."
context: "ثاني أبيات الفرات (44–47): بعد صورة النهر وأمواجه يذكر مصدر قوته، الأودية التي تصبّ فيه. وهو البيت الخامس والأربعون عند الأَعْلَم. ولا تزال الجملة معلّقة، فالشاعر يزيد صورة الفرات عظمة قبل أن يأتي بالخبر في البيت 47. وهذا ما يصفه شَوْقي ضَيْف حين يقول إن الفرات في صورة النابِغة «ينساب حاملا ما يقتلعه من الأشجار والنباتات» [@deif، ج1 ص288]."
syntax:
  - "جملة «يَمُدُّهُ كُلُّ وَادٍ» في موضع نصب حال ثانية من «الْفُرَاتُ» في البيت 44: «يَمُدُّ» فعل مضارع، والهاء مفعول به، و«كُلُّ» فاعل، و«وَادٍ» مضاف إليه مجرور بكسرة مقدّرة على الياء المحذوفة."
  - "«مُزْبِدٍ» و«لَجِبٍ» نعتان لـ«وَادٍ»."
  - "«فِيهِ حُطَامٌ» جملة نعت ثالث لـ«وَادٍ»: «فِيهِ» جار ومجرور متعلق بمحذوف خبر مقدم، و«حُطَامٌ» مبتدأ مؤخر. و«مِنَ الْيَنْبُوتِ» متعلق بمحذوف نعت لـ«حُطَامٌ»، و«وَالْخَضَدِ» معطوف على «الْيَنْبُوتِ»."
morphology:
  - "«يَمُدُّ» مضارع «مَدَّ» المضعّف على «فَعَلَ يَفْعُلُ»."
  - "«وَادٍ» اسم منقوص، أصله «وادِيٌ»، حُذفت ياؤه في الرفع والجر وعُوّض عنها التنوين."
  - "«مُزْبِد» اسم فاعل من «أَزْبَدَ» على «مُفْعِل»، و«لَجِب» صفة مشبهة على «فَعِل»."
  - "«حُطَام» على «فُعال»، وهو بناء يكثر لما تكسّر من الشيء، كالفُتات والرُّفات."
  - "«يَنْبُوت» على «يَفْعُول»، والياء فيه زائدة."
rhetoric:
  thesis: "يكبّر الصورة خطوة بعد خطوة: النهر وحده عظيم، ثم تصبّ فيه الأودية كلها، صاخبة، تجرف الشجر. فالسامع يرى قوة تجمع كل شيء ولا يقف أمامها شيء، وهذه القوة كلها ستُنفى أن تبلغ جود الملك."
  devices:
    - title: "العموم في «كُلُّ وَادٍ»"
      text: "لم يقل: تمدّه الأودية، بل «كُلُّ وَادٍ»، فلا يبقى وادٍ إلا وهو يصبّ فيه. وهذه مبالغة في سعة النهر، وكلما عظم المشبه به عظم ما فُضّل عليه."
    - title: "اجتماع الصوت والصورة في «مُزْبِدٍ لَجِبٍ»"
      text: "«مُزْبِدٍ» صفة تُرى، و«لَجِبٍ» صفة تُسمع، فالسيل يُدرك بالعين والأذن معًا. وهذا من تفصيل الصورة الذي يصفه شَوْقي ضَيْف في هذه الأبيات [@deif، ج1 ص288]."
    - title: "دلالة «حُطَامٌ مِنَ الْيَنْبُوتِ وَالْخَضَدِ»"
      text: "ذكر ما يحمله السيل ليدل على قوته: فالماء الذي يقتلع الشجر ويكسره ماء جارف. فهو يصف القوة بأثرها لا بذاتها."
  connection: "ثم يصف الملّاح الذي يتمسّك بسكّان سفينته خوفًا من هول النهر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "يَمُدْدُهُو / كُلْلُ وَا / دِنْ مُزْبِدِنْ / لَجِبِنْ = متفعلن / فاعلن / مستفعلن / فعِلن — فِيهِي حُطَا / مُنْ مِنَلْ / يَنْبُوتِ وَلْ / خَضَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «يَمُدُّهُ» فتصير «يَمُدُّهُو»، وكسرة الهاء في «فِيهِ» فتصير «فِيهِي»."
variants:
  - reading: "يَمُدُّهُ كُلُّ وَادٍ مُتْرَعٍ لَجِبٍ / فِيهِ رُكَامٌ مِنَ الْيَنْبُوتِ وَالْخَضَدِ"
    status: "رواية الأَعْلَم، وهو البيت 45 عنده، والروايتان يذكرهما التِّبْرِيزِيّ"
    note: "قال التِّبْرِيزِيّ: «ويروى (كل واد مترع) ويروى (فيه ركام) والمترع: المملوء»، و«الرُّكام: المتكاثف» [@tabrizi-ashr، ص321]. وقال الأَعْلَم: «والرُّكام: ما تراكم بعضه على بعض، أي تراكب» [@diwan-nabigha، ص27]. وفي اللسان «مُتْرَع» مع «حُطَام» [@lisan، ج2 ص97]، و«رُكام» في موضع آخر [@lisan، ج3 ص162]، وبالروايتين ينشده شَوْقي ضَيْف: «يمدّه كلّ واد مترع لجب / فيه ركام من الينبوت والخضد» [@deif، ج1 ص287]."
