first: "كَأَنَّ رَحْلِي وَقَدْ زَالَ النَّهَارُ بِنَا"
second: "بِذِي الْجَلِيلِ عَلَى مُسْتَأْنِسٍ وَحَدِ"
meaning: "كأن رحلي، وقد انتصف النهار علينا ونحن بموضع ينبت فيه الثُّمام، مشدود على ثور وحشي منفرد يتلفّت بعينيه حذرًا. يريد أن ناقته في الهاجرة، حين تتعب الإبل، نشيطة حادة كهذا الثور. قال الأَعْلَم: «فيقول: كأن رحلي على ثور مستأنس منفرد؛ لنشاط ناقته وحدتها في وقت إعياء الإبل وكلالها» [@diwan-nabigha، ص17]."
vocabulary:
  - term: "رَحْلِي"
    text: "الرحل ما يُشدّ على ظهر البعير للركوب، وأراد به ناقته، كما قال البَغْداديّ: «الرحل: الناقة» [@khizana، ج3 ص187]."
  - term: "زَالَ النَّهَارُ بِنَا"
    text: "«معناه انتصف، و(بنا) بمعنى علينا» [@tabrizi-ashr، ص311]."
  - term: "الْجَلِيلِ"
    text: "«الثُّمام، أي بموضع فيه ثُمام» [@tabrizi-ashr، ص311]، والثُّمام نبت. فـ«ذو الجليل» موضع يُعرف بهذا النبت."
  - term: "مُسْتَأْنِسٍ"
    text: "«الناظر بعينه، ومنه (إني آنست نارا) أي أبصرت» [@tabrizi-ashr، ص311]. وفي اللسان: «والاستئناس في كلام العرب النظر. يقال: اذهب فاستأنس هل ترى أحدا؟» [@lisan، ج6 ص15]. وعند الأَعْلَم: «ثور يخاف الأنيس، وقيل: هو الذي يرفع رأسه؛ هل يرى شخصا؟» [@diwan-nabigha، ص17]."
  - term: "وَحَدِ"
    text: "المنفرد. وفي اللسان عن اللَّيْث: «الوحد المنفرد، رجل وحد وثور وحد» [@lisan، ج3 ص450]."
context: "أول التشبيه الطويل الذي يملأ الأبيات 9–19: الناقة كالثور الوحشي، ثم يمضي في قصة الثور حتى يكاد ينسى الناقة. قال شَوْقي ضَيْف: «ثم أخذ في تشبيهها بثور وحشي، ودفعه ذلك إلى وصف صائد وأكلبه وما نشب بينها وبين هذا الثور من عراك» [@deif، ج1 ص295]."
syntax:
  - "«كَأَنَّ» حرف تشبيه ونصب، و«رَحْلِي» اسمها، وخبرها «عَلَى مُسْتَأْنِسٍ» في العجز."
  - "«وَقَدْ زَالَ النَّهَارُ بِنَا» جملة حالية معترضة بين اسم «كأنّ» وخبرها. و«بِنَا» بمعنى «علينا» عند التِّبْرِيزِيّ، ونقل الأَعْلَم قولًا آخر: «وقيل: في معنى عنا، والمعنى زال النهار عنا، وكلا القولين حسن» [@diwan-nabigha، ص17]."
  - "«بِذِي الْجَلِيلِ» جار ومجرور متعلق بمحذوف حال، أي: ونحن بذي الجليل. و«وَحَدِ» صفة لـ«مُسْتَأْنِسٍ»."
morphology:
  - "«مُسْتَأْنِس» اسم فاعل من «استأنس» على «استفعل»، والمعنى هنا النظر لا الأُنس."
  - "«وَحَد» على «فَعَل» صفة بمعنى المنفرد، قال الأَعْلَم: «وقد يقال: فرد وفرد، وواحد ووحد» [@diwan-nabigha، ص17]."
  - "«زَالَ» من الزوال، وهو هنا ميل الشمس عن وسط السماء."
rhetoric:
  thesis: "يبدأ أطول تشبيه في القصيدة. والمشبه به ليس ثورًا ساكنًا، بل ثور في قصة: ليلة برد، وصائد، وكلاب، ومعركة. فالشبه بين الناقة والثور لا يُرى بالعين، بل يُستخلص من القصة كلها: القوة والصبر والنجاة."
  devices:
    - title: "التمثيل"
      text: "يفرّق عبد القاهر الجُرْجانيّ بين نوعين من التشبيه: أن يكون الشبه «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل»، أو أن يكون «محصّلاً بضرب من التأوّل» [@asrar، ص90]، ويسمي الثاني تمثيلًا، ويقول: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. وتشبيه الناقة بـ«مُسْتَأْنِسٍ وَحَدِ» من الثاني: لا تشبه الناقة الثور في شكله، بل في نشاطه وحدّته، وهذا لا يُدرك إلا بتأمل القصة التي تليه."
    - title: "اختيار الوقت"
      text: "في «وَقَدْ زَالَ النَّهَارُ بِنَا» اختار ساعة الهاجرة، و«السير في نصف النهار صعب شديد من أجل الهاجرة» كما يقول الأَعْلَم [@diwan-nabigha، ص17]. فنشاط الناقة في الساعة التي تتعب فيها الإبل أبلغ في مدحها."
    - title: "اختيار «وَحَدِ»"
      text: "وصف الثور بالانفراد، قال الأَعْلَم: «وإنما وصف الثور بالانفراد؛ لأن ذلك أشد لفزعه» [@diwan-nabigha، ص17]. والفزع يزيده سرعة، والسرعة هي ما يريده للناقة."
  connection: "ثم يذكر من أين هذا الثور، ويرسم صورته: قوائم موشّاة، وبطن ضامر، وبياض كالسيف."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَأَنْنَ رَحْ / لِي وَقَدْ / زَالَنْنَهَا / رُ بِنَا = متفعلن / فاعلن / مستفعلن / فعِلن — بِذِلْجَلِي / لِ عَلَى / مُسْتَأْنِسِنْ / وَحَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "يَوْمَ الْجَلِيلِ عَلَى مُسْتَأْنِسٍ وَحَدِ"
    status: "رواية الأَعْلَم"
    note: "في نص الأَعْلَم، وفسّره: «أي يوم مرورنا [بالجليل]، وسيرنا على موضعه» [@diwan-nabigha، ص17]. ويذكر محقق الديوان أن ابن السِّكِّيت والتِّبْرِيزِيّ يرويان «بذي الجليل» [@diwan-nabigha، ص235]."
  - reading: "بِذِي الْجَلِيلِ عَلَى مُسْتَوْجِسٍ وَحَدِ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "قال: «ويروى (على مُستوجس) وهو الذي قد أوجس في نفسه الفزع فهو ينظر» [@tabrizi-ashr، ص311]."
