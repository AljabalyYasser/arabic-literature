first: "هَذَا لِأَبْرَأَ مِنْ قَوْلٍ قُذِفْتُ بِهِ"
second: "طَارَتْ نَوَافِذُهُ حَرًّا عَلَى كَبِدِي"
meaning: "هذا القسم إنما أقسمته لأتبرأ من قول رُميت به، نفذت كلماته فيّ كما ينفذ الجرح، فوقع حرّها على كبدي. قال التِّبْرِيزِيّ: «(النوافذ) تمثيل، من قولهم: جُرح نافذ، أي قالوا قولا صار حره على كبدي وشقيتُ بهم» [@tabrizi-ashr، ص320]، وقال البَغْداديّ: «أي: هذا القسم لأجل أن أتبرأ مما اتهمت به» [@khizana، ج5 ص74]."
vocabulary:
  - term: "لِأَبْرَأَ"
    text: "لأتخلّص وأتنصّل."
  - term: "قُذِفْتُ بِهِ"
    text: "رُميت به واتُّهمت."
  - term: "نَوَافِذُهُ"
    text: "جمع نافذة، أي ما ينفذ منه في الجسد كالجرح النافذ، والمراد كلماته الجارحة، وهو عند التِّبْرِيزِيّ «تمثيل، من قولهم: جُرح نافذ» [@tabrizi-ashr، ص320]."
  - term: "حَرًّا"
    text: "حرارة وألمًا."
  - term: "كَبِدِي"
    text: "الكبد، ويجعلها الشعراء موضع الحرقة والألم الباطن."
context: "آخر أبيات القسم والبراءة (37–41)، وهو يفسّر القسم كله: إنما حلف ليبرأ. وليس البيت في رواية الأَعْلَم، وفي موضعه عنده بيت آخر هو الأربعون فيها: «إِلَّا مَقَالَةَ أَقْوَامٍ شَقِيتُ بِهَا / كَانَتْ مَقَالَتُهُمْ قَرْعًا عَلَى الْكَبِدِ» [@diwan-nabigha، ص25]. ويقول محقق الديوان عند هذا البيت الأربعين: «موضعه في ابن السكيت: هذا لأبرأ من قول قذفت به / طارت نوافذه حرًّا على كبدي. وهو البيت الحادي والأربعون في التبريزي» [@diwan-nabigha، ص236]. فالبيتان بمعنى واحد تقريبًا: قول قيل فيه فأوجع كبده، ويختلف لفظهما، وكلمة «الكبد» في القافية فيهما. ويورد المحقق هذا البيت أيضًا مع البيت 40 في الشعر المنسوب، عن «العِقْد الثَّمِين» و«التَّوْضِيح والبَيان» [@diwan-nabigha، ص229]. أما ابن رَشِيق وشَوْقي ضَيْف فيرويان بيت الأَعْلَم لا هذا البيت [@ibn-rashiq، ج2 ص177] [@deif، ج1 ص287]."
syntax:
  - "«هَذَا» اسم إشارة مبتدأ، والإشارة إلى القسم وما فيه من دعاء، كما فسّره البَغْداديّ [@khizana، ج5 ص74]. و«لِأَبْرَأَ» اللام لام التعليل، و«أَبْرَأَ» مضارع منصوب بـ«أن» مضمرة بعدها، والمصدر المؤول مجرور باللام، والجار والمجرور متعلق بمحذوف خبر المبتدأ، أي هذا كائن لأبرأ."
  - "«مِنْ قَوْلٍ» متعلق بـ«أَبْرَأَ»، وجملة «قُذِفْتُ بِهِ» نعت لـ«قَوْلٍ»: «قُذِفْتُ» ماض مبني للمجهول، والتاء نائب فاعل، و«بِهِ» متعلق به."
  - "«طَارَتْ نَوَافِذُهُ» جملة نعت ثان لـ«قَوْلٍ»: «طَارَتْ» فعل ماض، و«نَوَافِذُهُ» فاعل. و«حَرًّا» تمييز منصوب، أي طار حرّها، أو حال مؤوّلة، أي حارّة. و«عَلَى كَبِدِي» متعلق بـ«طَارَتْ»."
morphology:
  - "«أَبْرَأَ» مضارع «بَرِئَ يَبْرَأُ» على «فَعِلَ يَفْعَلُ»، ومصدره البراءة."
  - "«نَوَافِذ» جمع «نافِذة» على «فَوَاعِل»، من «نَفَذَ» إذا خرق الشيء وخرج من الجهة الأخرى."
  - "«قُذِفْتُ» ماضي «قَذَفَ» المبني للمجهول على «فُعِلَ»."
rhetoric:
  thesis: "يختم القسم بكشف غايته: ليس الحلف تملّقًا، بل دفعًا لتهمة أحرقت قلبه. ويصوّر القول الذي قيل فيه سلاحًا نافذًا أصاب كبده، فيصير الشاعر هو المجروح لا الجاني، ويطلب من الملك أن يرى جرحه."
  devices:
    - title: "الاستعارة في «طَارَتْ نَوَافِذُهُ»"
      text: "يسمي التِّبْرِيزِيّ هذا تمثيلًا، وهو في اصطلاح عبد القاهر الجُرْجانيّ استعارة. والاستعارة عنده «أن يكون للَّفظ أصلٌ في الوضع اللغوي معروفٌ»، «ثم يستعمله الشاعر أو غير الشاعر في غير ذلك الأصل، وينقله إليه نقلاً غيرَ لازمٍ، فيكون هناك كالعارِيَّة» [@asrar، ص30]. فالنوافذ في أصلها الجراح التي تخرق الجسد، والطيران للسهام، فنقل الشاعر الأمرين إلى الكلام: كلمات الوشاة سهام طارت إليه ونفذت في كبده."
    - title: "اختيار «الكبد»"
      text: "جعل موضع الإصابة الكبد، وهو في الشعر موضع الحرقة والألم الباطن، فالجرح ليس في الجلد بل في الداخل. وبهذه الكلمة نفسها يختم بيت الأَعْلَم «قَرْعًا عَلَى الْكَبِدِ»، فالروايتان تتفقان على موضع الألم."
  connection: "ثم يطلب من النُّعْمان المهلة: فداء لك الناس كلهم، وما أجمع من مال وولد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "هَاذَا لِأَبْ / رَأَ مِنْ / قَوْلِنْ قُذِفْ / تُ بِهِي = مستفعلن / فعِلن / مستفعلن / فعِلن — طَارَتْ نَوَا / فِذُهُو / حَرْرَنْ عَلَى / كَبِدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، وسائر الحشو تام. والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع كسرة الهاء في «بِهِ» فتصير «بِهِي»، وضمة الهاء في «نَوَافِذُهُ» فتصير «نَوَافِذُهُو»."
variants:
  - reading: "إِلَّا مَقَالَةَ أَقْوَامٍ شَقِيتُ بِهَا / كَانَتْ مَقَالَتُهُمْ قَرْعًا عَلَى الْكَبِدِ"
    status: "رواية الأَعْلَم في موضع هذا البيت، وهو البيت 40 عنده، وبها ينشده ابن رَشِيق وشَوْقي ضَيْف"
    note: "قال الأَعْلَم: «نَصَبها على الاستثناء المنقطع، والمعنى: ما قلتُ شيئاً مما أتوكَ به عنّي، لكنهم قالوا مقالةً شَقِيتُ بها عندك»، وقال في «قَرْعًا عَلَى الْكَبِدِ»: «فكأنها قَرَعَتْ كبدي بذلك» [@diwan-nabigha، ص25]. فهو عنده متصل بالبيت 39 على رواية «مَا قُلْتُ مِنْ سَيِّئٍ»: ما قلت شيئًا، إلا أنهم قالوا. وبه ينشده ابن رَشِيق [@ibn-rashiq، ج2 ص177] وشَوْقي ضَيْف، وفسّر القرع بالضرب [@deif، ج1 ص287]."
  - reading: "طَارَتْ نَوَافِذُهُ حَرَّى عَلَى كَبِدِي"
    status: "رواية «العِقْد الثَّمِين» و«التَّوْضِيح والبَيان» عند محقق الديوان، وبها ينشده البَغْداديّ"
    note: "بـ«حَرَّى» في موضع «حَرًّا» [@diwan-nabigha، ص229]، وكذلك في الخزانة [@khizana، ج5 ص73]، وفي موضع آخر منها «حرا» [@khizana، ج8 ص450]. والحَرَّى مؤنث الحَرّان، أي الحارّة."
