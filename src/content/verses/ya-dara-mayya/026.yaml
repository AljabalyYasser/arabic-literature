first: "إِلَّا لِمِثْلِكَ أَوْ مَنْ أَنْتَ سَابِقُهُ"
second: "سَبْقَ الْجَوَادِ إِذَا اسْتَوْلَى عَلَى الْأَمَدِ"
meaning: "لا تُضمر غيظًا إلا لمن هو مثلك في حالك، أو لمن تسبقه بفضلك سبق الفرس الكريم حين يبلغ الغاية قبل غيره. قال التِّبْرِيزِيّ: «أي لمثلك في حالك أو لمن فضلك عليه كفضل السابق على المُصلي أي ليس بينك وبينه في الفضل والشرف إلا يسير» [@tabrizi-ashr، ص315]. والمُصَلِّي الفرس الذي يجيء ثانيًا في السباق، ورأسه عند صَلا السابق، أي عند مؤخّره. فالمعنى: لا يستحق غضبك إلا نظيرك أو من يقاربك، أما من دونك، كالشاعر، فليس أهلًا لأن تحقد عليه."
vocabulary:
  - term: "الْجَوَادِ"
    text: "الفرس الكريم السريع."
  - term: "اسْتَوْلَى"
    text: "«استولى عليه: إذا غلب عليه» [@tabrizi-ashr، ص315–316]. وفي اللسان عن ابن الأَعْرابيّ: «العرب لا تقول استولى على الشيء حتى يكون له مضاد فأيهما غلب فقد استولى»، ثم ينشد البيت [@lisan، ج14 ص414]."
  - term: "الْأَمَدِ"
    text: "«الغاية» [@tabrizi-ashr، ص316]، وعند الأَعْلَم: «الغاية التي يُجرى إليها» [@diwan-nabigha، ص21]."
context: "آخر أبيات سُلَيْمان، وأغمضها. قال الأَعْلَم: «أكثر أهل اللغة لا يعرف معنى البيت». ثم نقل، فيما أكمله المحقق بين معقوفين من نسخة أخرى، أن الأَصْمَعِيّ قال: «ليس هذا موضع هذا البيت»، وأن المازِنيّ قال: «إنما موضعه بعد قوله: فلم أُعرِّض أبيت اللعن بالصفد»، وهو البيت 49 عندنا. ونقل عن ابن الأَعْرابيّ: «زعم النابغة أن الله تبارك وتعالى قال هذا لسليمان، وحُكي عنه أيضًا أنه قال: لا أدري ما معناه، وإنما أراد النابغة حضّ النعمان على أن يقعد عنه، ولا يُضمر له حقدًا؛ لأنه ليس له مثله ولا قريبًا منه» [@diwan-nabigha، ص21]. فعلى الأول البيت من كلام الإله لسُلَيْمان، وعلى قول المازِنيّ هو من كلام الشاعر للنعمان. وعنده يقول محقق الديوان: «إلى هذا البيت تتفق جميع الروايات ترتيبا واحدا، وبعده يختلف ترتيب الأبيات» [@diwan-nabigha، ص235]. وهو آخر ما يرى شَوْقي ضَيْف أنه أقحم في حديث سُلَيْمان [@deif، ج1 ص279]."
syntax:
  - "«إِلَّا لِمِثْلِكَ» استثناء من النهي في البيت السابق «وَلَا تَقْعُدْ عَلَى ضَمَدِ»، أي لا تقعد على ضمد لأحد إلا لمثلك. و«لِمِثْلِكَ» جار ومجرور متعلق بـ«تَقْعُدْ» المفهوم، والكاف مضاف إليه."
  - "«أَوْ مَنْ أَنْتَ سَابِقُهُ»: «مَنْ» اسم موصول معطوف على «مِثْلِكَ» في محل جر، وجملة «أَنْتَ سَابِقُهُ» صلته: «أَنْتَ» مبتدأ، و«سَابِقُهُ» خبره."
  - "«سَبْقَ الْجَوَادِ» مفعول مطلق مبيّن للنوع منصوب بـ«سَابِق»، أي تسبقه سبقًا مثل سبق الجواد. و«إِذَا اسْتَوْلَى عَلَى الْأَمَدِ» ظرف متعلق بـ«سَبْقَ»."
morphology:
  - "«سَابِق» اسم فاعل من «سَبَقَ» على «فاعل»، عمل عمل فعله فأضيف إلى مفعوله."
  - "«اسْتَوْلَى» على «استفعل» من «الوَلْي»، وهو القرب والملك."
  - "«سَبْق» مصدر «سَبَقَ» على «فَعْل»."
rhetoric:
  thesis: "البيت يشرح لماذا لا يليق بالملك أن يحقد: لأن الحقد لا يكون إلا بين المتقاربين، والملك لا يقاربه أحد. فهو، على قول ابن الأَعْرابيّ، حثّ للنعمان أن يترك الغضب على النابِغة، مكسوًّا بثوب المديح."
  devices:
    - title: "التشبيه في «سَبْقَ الْجَوَادِ»"
      text: "المفعول المطلق المبيّن للنوع يحمل تشبيهًا محذوف الأداة: تسبقه سبقًا كسبق الفرس الكريم. وجعل لحظة السبق «إِذَا اسْتَوْلَى عَلَى الْأَمَدِ»، أي ساعة يبلغ الغاية، فالفضل لا يُقاس في أول الشوط بل عند نهايته."
    - title: "الإيجاز في «أَوْ مَنْ أَنْتَ سَابِقُهُ»"
      text: "لم يقل: أو من هو دونك بقليل، بل جعل الفارق بينهما فارق السابق والمصلّي في الحلبة، وهو فارق يسير ظاهر، فدلّ بالصورة على المقدار."
  connection: "ثم يرجع إلى خطاب النُّعْمان: احكم كحكم فتاة الحي."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِلْلَا لِمِثْ / لِكَ أَوْ / مَنْ أَنْتَ سَا / بِقُهُو = مستفعلن / فعِلن / مستفعلن / فعِلن — سَبْقَلْ جَوَا / دِ إِذَسْ / تَوْلَى عَلَلْ / أَمَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]، وسائر التفعيلات تامة. وتسقط همزة الوصل في «اسْتَوْلَى» في الدرج."
