first: "سَرَتْ عَلَيْهِ مِنَ الْجَوْزَاءِ سَارِيَةٌ"
second: "تُزْجِي الشَّمَالُ عَلَيْهِ جَامِدَ الْبَرَدِ"
meaning: "جاءته ليلًا سحابة ممطرة من نوء الجوزاء، تسوق عليه ريح الشمال حبّات البَرَد الصلبة، فبات ليلة سوء. قال التِّبْرِيزِيّ: «قوله (سرت عليه من الجوزاء سارية) كمعنى قولهم (مطرنا بنوء كذا)، وتُزجي: تسوق، وجامد البرد: ما صلب منه» [@tabrizi-ashr، ص312]."
vocabulary:
  - term: "سَرَتْ"
    text: "جاءت ليلًا، والسُّرى: سير الليل."
  - term: "الْجَوْزَاءِ"
    text: "نجم كانت العرب تنسب إلى غروبه مطرًا، وهو ما يسمونه النَّوْء. قال الأَعْلَم: «يريد أن السحابة كانت من نوء الجوزاء؛ وإنما خص الجوزاء لأن نوءها يكون في البرد الشديد؛ لأنها تطلع في أشد الحر وتسقط في أشد البرد» [@diwan-nabigha، ص18]."
  - term: "سَارِيَةٌ"
    text: "«السارية السحابة التي تسري ليلا، وجمعها السواري؛ ومنه قول النابغة» [@lisan، ج14 ص382]."
  - term: "تُزْجِي"
    text: "«تسوق» [@tabrizi-ashr، ص312]. وفي اللسان: «زجاه وأزجاه ساقه سوقا لينا؛ وبه فسر بعضهم قول النابغة» [@lisan، ج14 ص355]."
  - term: "الشَّمَالُ"
    text: "ريح الشمال، وهي أبرد الرياح. قال الأَعْلَم: «وإنما خص الشمال لشدة بردها» [@diwan-nabigha، ص18]."
  - term: "جَامِدَ الْبَرَدِ"
    text: "«ما صلب منه» [@tabrizi-ashr، ص312]."
context: "يصف ليلة الثور قبل المعركة: مطر وبرد وريح باردة. وللأَعْلَم في ذلك تعليل: «فيصف أن الثور بات مبيت سوء؛ فذلك أنشط له وأحد لدفعه» [@diwan-nabigha، ص18]، أي إن ما قاساه في الليل يزيده حدّة حين يلقى الكلاب في الصباح."
syntax:
  - "«سَرَتْ» فعل ماض، و«عَلَيْهِ» متعلق به، والهاء للثور. و«مِنَ الْجَوْزَاءِ» متعلق بـ«سرت»، أي من نوئها. و«سَارِيَةٌ» فاعل مؤخر."
  - "«تُزْجِي الشَّمَالُ... جَامِدَ الْبَرَدِ» جملة في موضع رفع صفة لـ«سَارِيَةٌ». و«الشَّمَالُ» فاعل «تُزْجِي»، و«جَامِدَ» مفعول به، وهو مضاف إلى «الْبَرَدِ»، من إضافة الصفة إلى موصوفها: البَرَد الجامد."
morphology:
  - "«سَارِيَة» اسم فاعل من «سَرَى»، غلب على السحابة التي تأتي ليلًا. وفي رواية الأَعْلَم «أسرت»، قال: «يقال: سرى وأسرى، إذا جاء ليلا؛ فجمع بين اللغتين، فقال: (أسرت) ثم قال: (سارية) فبناها على (سرت)» [@diwan-nabigha، ص18]."
  - "«تُزْجِي» مضارع «أَزْجَى» على «أفعل»."
  - "«جَامِد» اسم فاعل من «جَمَد»، و«البَرَد» حبّ الثلج الذي ينزل من السحاب."
rhetoric:
  thesis: "كل تفصيل في البيت يزيد البرد: سحابة ليل، ونوء الجوزاء الذي يكون في أشد البرد، وريح الشمال، وبَرَد جامد. فالشاعر يجمع على الثور كل ما يقسو به الليل، ليظهر صبره ثم قوته."
  devices:
    - title: "جناس الاشتقاق"
      text: "في «سَرَتْ... سَارِيَةٌ» جاء بكلمتين من أصل واحد: الفعل واسم الفاعل. فيتردد معنى الليل في البيت مرتين، ويقوى الإحساس بطول السُّرى."
    - title: "اختيار التفاصيل"
      text: "خصّ «الْجَوْزَاءِ» لأن نوءها في أشد البرد، وخصّ «الشَّمَالُ» لشدة بردها، كما يقول الأَعْلَم [@diwan-nabigha، ص18]. فاختيار النجم والريح ليس زينة، بل وصف دقيق لليلة قاسية."
    - title: "إضافة الصفة إلى الموصوف"
      text: "قال «جَامِدَ الْبَرَدِ» ولم يقل: البرد الجامد. فقدّم الصفة وأضافها، فصارت الصلابة هي ما يقع على الثور أولًا."
  connection: "ثم يفزع الثور في هذه الحال من صوت صائد معه كلابه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "سَرَتْ عَلَيْ / هِ مِنَلْ / جَوْزَاءِ سَا / رِيَتُنْ = متفعلن / فعِلن / مستفعلن / فعِلن — تُزْجِشْشَمَا / لُ عَلَيْ / هِ جَامِدَلْ / بَرَدِي = مستفعلن / فعِلن / متفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من الصدر والثالثة من العجز فصارتا «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]. وفي نسخة الشاملة «مِنْ الجوزاء» بسكون النون، والصواب «مِنَ» كما يقتضي الوزن واللغة."
variants:
  - reading: "أَسْرَتْ عَلَيْهِ مِنَ الْجَوْزَاءِ سَارِيَةٌ"
    status: "رواية الأَعْلَم"
    note: "في نص الأَعْلَم وشرحه [@diwan-nabigha، ص18]. ويذكر محقق الديوان أن ابن السِّكِّيت والتِّبْرِيزِيّ يرويان «سرت عليه» [@diwan-nabigha، ص235]."
