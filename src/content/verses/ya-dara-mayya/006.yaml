first: "أَضْحَتْ خَلَاءً وَأَضْحَى أَهْلُهَا احْتَمَلُوا"
second: "أَخْنَى عَلَيْهَا الَّذِي أَخْنَى عَلَى لُبَدِ"
meaning: "صارت الدار خالية، ورحل أهلها بعد أن حمّلوا إبلهم، وأفسدها الدهر الذي أفسد لُبَدًا، أطول النسور عمرًا. قال الأَعْلَم: «أي أمست الدار خالية من أهلها لما احتملوا عنها إلى مياههم»، و«أخنى عليها» أي «أفسد عليها الدهر الذي أفسد على لبد وهرمه وأفناه» [@diwan-nabigha، ص16]."
vocabulary:
  - term: "خَلَاءً"
    text: "«المكان الذي لا شيء به» [@khizana، ج4 ص8]."
  - term: "احْتَمَلُوا"
    text: "«حملوا جمالهم وارتحلوا» [@khizana، ج4 ص8]."
  - term: "أَخْنَى عَلَيْهَا"
    text: "قال التِّبْرِيزِيّ: «فيه قولان؛ أحدهما: أن المعنى أتى عليها، والقول الآخر - وهو الجيد -: أن المعنى أفسد؛ لأن الخنا الفساد والنقصان» [@tabrizi-ashr، ص310]. وفي اللسان: «وأخنى: أفسد» [@lisan، ج14 ص245]."
  - term: "لُبَدِ"
    text: "«آخر نسور لقمان بن عاد، وهو النسر السابع من نسوره، وكان قد عمر أربعمائة عام، وهو الذي يضرب به المثل؛ فيقال: أتى أبد على لبد» [@diwan-nabigha، ص16]. وفي اللسان أن لُقْمان خُيّر بين أشياء منها «بقاء سبعة أنسر كلما أهلك نسر خلف بعده نسر، فاختار النسور» [@lisan، ج3 ص385]، «فكان آخر نسوره يسمى لبدا» [@lisan، ج3 ص386]."
context: "خاتمة الوقوف على الدار (1–6). يقول شَوْقي ضَيْف: «وقد ختم نسيبه بإظهار هذه الدار التي رحل عنها أهلها بمظهر بال، فقد جرت الأيام عليها أذيال البلى والعفاء، كما جرتها من قبل على لبد نسر لقمان المشهور بطول عمره وطول سلامته» [@deif، ج1 ص294]. والبيت شاهد عند النحويين في خبر «أضحى» [@khizana، ج4 ص5]."
syntax:
  - "«أَضْحَتْ» فعل ماض ناقص، اسمه ضمير يعود إلى الدار، و«خَلَاءً» خبره."
  - "«وَأَضْحَى أَهْلُهَا احْتَمَلُوا»: «أَهْلُهَا» اسم «أضحى»، وجملة «احْتَمَلُوا» في موضع خبرها. وفيه خلاف: قال التِّبْرِيزِيّ: «أراد قد احتملوا» [@tabrizi-ashr، ص310]، فقدّر «قد». أما البَغْداديّ فاستشهد به «على أن خبر أضحى يجوز أن يكون فعلا ماضيا بدون قد»، وقال: «ولا تقدر قد كما ذهب إليه ابن مالك خلافا للمبرد» [@khizana، ج4 ص5]."
  - "«أَخْنَى عَلَيْهَا الَّذِي» جملة مستأنفة، و«الَّذِي» اسم موصول فاعل «أخنى»، وجملة «أَخْنَى عَلَى لُبَدِ» صلته."
morphology:
  - "«خَلَاء» مصدر «خلا» وُصف به المكان، فلا يُثنّى ولا يُجمع."
  - "«احْتَمَلُوا» على «افتعل» من «حمل»: حملوا أمتعتهم على الإبل."
  - "«أَخْنَى» على «أفعل» من «الخَنا»، وهو الفساد."
  - "«لُبَد» على «فُعَل»، قال البَغْداديّ: «وهو منصرف لأنه ليس بمعدول» [@khizana، ج4 ص8]، أي إنه ليس كـ«عُمَر» المعدول عن «عامر»."
rhetoric:
  thesis: "يختم الوقوف بحكم عام: ما أصاب الدار هو ما يصيب كل شيء، حتى النسر الذي ضُرب به المثل في طول البقاء. فالخراب لا يُنسب إلى حادث بعينه، بل إلى الدهر."
  devices:
    - title: "التكرار والتوازي"
      text: "في الصدر «أَضْحَتْ... وَأَضْحَى»: جملتان متوازيتان، الدار خلت وأهلها رحلوا، وهما وجهان لحادث واحد. وفي العجز «أَخْنَى... أَخْنَى»: الفعل نفسه لما أصاب الدار ولما أصاب لُبَدًا، فيتساويان في المصير."
    - title: "الموصول بدل الاسم"
      text: "لم يسمّ الدهر، بل قال «الَّذِي أَخْنَى عَلَى لُبَدِ». فالموصول يعرّف الفاعل بفعله المشهور، والسامع يفهم أنه الدهر كما فسره الأَعْلَم [@diwan-nabigha، ص16]. وهذا قريب مما يسميه عبد القاهر الجُرْجانيّ الكناية، أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود»، فيومئ به إليه [@dalail، ص66]."
    - title: "التلميح"
      text: "التلميح أن يشير الشاعر إلى قصة معروفة دون أن يرويها. ففي «لُبَدِ» إشارة إلى نسور لُقْمان، يكفي اسم آخرها ليستحضر السامع القصة كلها: من عاش أطول عمر أدركه الفناء أيضًا."
  connection: "ثم يصرف نفسه عن هذا الخراب الذي لا رجعة له، ويشد رحله على ناقته."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَضْحَتْ خَلَا / ءَنْ وَأَضْ / حَى أَهْلُهَحْ / تَمَلُو = مستفعلن / فاعلن / مستفعلن / فعِلن — أَخْنَى عَلَيْ / هَلْلَذِي / أَخْنَى عَلَى / لُبَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "العروض والضرب مخبونان «فعِلن»، والخَبْن حذف الثاني الساكن [@atiq، ص46، ص48]. وتسقط همزة الوصل في «احْتَمَلُوا» في الدَّرْج فتتصل بما قبلها: «أَهْلُهَحْتَمَلُوا»."
variants:
  - reading: "أَمْسَتْ خَلَاءً وَأَمْسَى أَهْلُهَا احْتَمَلُوا"
    status: "رواية الأَعْلَم"
    note: "هي في نص الأَعْلَم وشرحه [@diwan-nabigha، ص16]، وبها ينشده صاحب اللسان في مادة «خنا» [@lisan، ج14 ص245]، وشَوْقي ضَيْف [@deif، ج1 ص294]."
  - reading: "أَضْحَتْ قِفَارًا وَأَضْحَى أَهْلُهَا احْتَمَلُوا"
    status: "رواية يذكرها محقق الديوان"
    note: "يقول المحقق: «فيما عدا الأعلم: أضحت قفارا وأضحى أهلها احتملوا» [@diwan-nabigha، ص235]. أما نسخة الشاملة للتِّبْرِيزِيّ ففيها «خلاء»، وكذلك أنشده البَغْداديّ [@khizana، ج4 ص5]، فأثبتناه."
