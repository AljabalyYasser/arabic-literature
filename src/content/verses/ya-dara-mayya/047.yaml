first: "يَوْمًا بِأَجْوَدَ مِنْهُ سَيْبَ نَافِلَةٍ"
second: "وَلَا يَحُولُ عَطَاءُ الْيَوْمِ دُونَ غَدِ"
meaning: "ليس الفُرات في يوم فيضانه بأجود من النُّعْمان عطاءً زائدًا على ما يجب، والنُّعْمان إذا أعطى اليوم لم يمنعه ذلك أن يعطي غدًا. وبهذا البيت تتم الجملة التي بدأت في البيت 44، قال الأَعْلَم: «قوله: «يومًا بأجودَ منه» مُتَّصِلٌ بقوله: «فما الفُرات»» [@diwan-nabigha، ص27]. وقال التِّبْرِيزِيّ في معنى العجز: «أن أعطى اليوم لم يمنعه ذلك أن يُعطى في الغد» [@tabrizi-ashr، ص321]."
vocabulary:
  - term: "سَيْبَ"
    text: "«السَّيب: العطاء» [@tabrizi-ashr، ص321]."
  - term: "نَافِلَةٍ"
    text: "«والنافلة: الزيادة» [@tabrizi-ashr، ص321]، وعند الأَعْلَم: «والنافلة: الفَضْل، وكلُّ شيء ليس بواجب وتطوّع به فهو نافلة» [@diwan-nabigha، ص27]."
  - term: "يَحُولُ"
    text: "يمنع ويحجز، وفي اللسان: «أي لا يحول عطاء اليوم دون عطاء غد» [@lisan، ج11 ص188]."
context: "آخر أبيات الفُرات (44–47)، وفيه الخبر الذي أُخّر ثلاثة أبيات. وهو البيت السابع والأربعون عند الأَعْلَم، وبعده عنده «هَذَا الثَّنَاءُ فَإِنْ تَسْمَعْ بِهِ حَسَنًا» (البيت 49 عندنا)، فيتصل الختام عنده بصورة الفُرات، أما عند التِّبْرِيزِيّ فيفصل بينهما بيت الوعيد «أُنْبِئْتُ أَنَّ أَبَا قَابُوسَ أَوْعَدَنِي». ويقول شَوْقي ضَيْف في هذه الأبيات إن النابِغة «نفى أن يكون الفرات فى فيضانه أكرم من النعمان وأكثر سيبا» [@deif، ج1 ص288]."
syntax:
  - "«يَوْمًا» ظرف زمان متعلق بـ«أَجْوَدَ»، أي في يوم من أيام فيضانه."
  - "«بِأَجْوَدَ» الباء حرف جر زائد، و«أَجْوَدَ» خبر «ما» في البيت 44 مجرور لفظًا بالفتحة لأنه ممنوع من الصرف، منصوب محلًّا. وفي اللسان عن ابن بَرِّيّ: «وخبر ما النافية في بيت بعده» [@lisan، ج4 ص529]. و«مِنْهُ» متعلق بـ«أَجْوَدَ»، والضمير للنعمان."
  - "«سَيْبَ» تمييز منصوب، و«نَافِلَةٍ» مضاف إليه."
  - "«وَلَا يَحُولُ عَطَاءُ الْيَوْمِ دُونَ غَدِ» جملة معطوفة في المعنى على المدح: «لا» نافية، و«يَحُولُ» مضارع، و«عَطَاءُ» فاعل، و«الْيَوْمِ» مضاف إليه، و«دُونَ» ظرف مكان متعلق بـ«يَحُولُ»، و«غَدِ» مضاف إليه على تقدير مضاف محذوف، قال الأَعْلَم: «والتقدير: لا يَحُولُ عَطاؤه في اليوم دون عطائه في غد» [@diwan-nabigha، ص27]. وقال التِّبْرِيزِيّ في إضافة العطاء إلى اليوم: «وأضاف إلى الظرف على السعة؛ لأنه ليس حق الظروف أن يضاف إليها» [@tabrizi-ashr، ص321]، أي الأصل: العطاء في اليوم."
morphology:
  - "«أَجْوَد» اسم تفضيل على «أَفْعَل» من «جادَ يَجُودُ»، ممنوع من الصرف للوصفية ووزن الفعل."
  - "«سَيْب» على «فَعْل»، وفي اللسان: «السَّيْبُ: العَطاءُ، والعُرْفُ، والنافِلةُ»، وفيه أن «سَيْبًا» في الدعاء قد يراد به «مَطَراً سَائِبًا أَي جَارِيًا» [@lisan، ج1 ص477]، فالكلمة تجمع العطاء والماء الجاري، وهذا يلائم المقارنة بالفُرات."
  - "«نَافِلَة» على «فاعِلة» من «نَفَلَ»."
  - "«غَد» أصله «غَدْو»، حُذفت لامه."
rhetoric:
  thesis: "تتم المقارنة: الفُرات في يوم فيضانه ليس بأجود من النُّعْمان. ثم يضيف الشاعر صفة لا يملكها النهر: الدوام. فالفيضان يوم ثم ينحسر، وعطاء الملك لا يقطعه ما سبقه. وهذه المقابلة قراءتنا للبيت."
  devices:
    - title: "تأخير الخبر والتضمين"
      text: "التضمين عند ابن رَشِيق «أن تتعلق القافية أو لفظة مما قبلها بما بعدها»، وهو عنده من عيوب الشعر، ثم يقول: «وكلما كانت اللفظة المتعلقة بالبيت الثاني بعيدة من القافية كان أسهل عيبا» [@ibn-rashiq، ج1 ص171]. وفي الأبيات 44–47 تعلّق «فَمَا الْفُرَاتُ» في أول البيت 44 بخبره في البيت 47. ولم يذكر ابن رَشِيق هذا الموضع، وعلى حدّه تكون اللفظة المتعلقة هنا في أبعد مكان من القافية. وفائدة التأخير أن السامع يبقى ينتظر الحكم بينما تكبر صورة النهر أمامه، فإذا جاء «بِأَجْوَدَ مِنْهُ» جاء بعد أن بلغ المشبه به غايته."
    - title: "المبالغة في «سَيْبَ نَافِلَةٍ»"
      text: "اختار النافلة، وهي ما يُعطى تطوّعًا، لا العطاء الواجب. قال الأَعْلَم: «وإنما خصَّ النافلة ليبالغ في المدح؛ لأنه إذا أكثر من غير الواجب فهو أجدر أن يُكثر من الواجب» [@diwan-nabigha، ص27]."
    - title: "المقابلة بين «يَوْمًا» و«عَطَاءُ الْيَوْمِ دُونَ غَدِ»"
      text: "النهر يُقاس بيوم واحد من أيامه، والملك يُمدح بأن يومه لا يمنع غده. فالمقابلة تنقل المدح من الكثرة إلى الدوام."
  connection: "ثم يذكر الوعيد الذي بلغه من أبي قابوس، ولا قرار لأحد على زئير الأسد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "يَوْمَنْ بِأَجْ / وَدَ مِنْ / هُ سَيْبَ نَا / فِلَتِنْ = مستفعلن / فعِلن / متفعلن / فعِلن — وَلَا يَحُو / لُ عَطَا / ءُلْيَوْمِ دُو / نَ غَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، في «فاعلن» الثانية من الشطرين فصارت «فعِلن»، وفي «مستفعلن» الثالثة من الصدر والأولى من العجز فصارتا «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]."
