first: "فَعَدِّ عَمَّا تَرَى إِذْ لَا ارْتِجَاعَ لَهُ"
second: "وَانْمِ الْقُتُودَ عَلَى عَيْرَانَةٍ أُجُدِ"
meaning: "اصرف نفسك عما ترى من خراب الدار، فما مضى لا يرجع، وارفع خشب رحلك على ناقة صلبة كالحمار الوحشي، محكمة الخَلْق. قال التِّبْرِيزِيّ: «فعدِّ عمَّا ترى: أي جُزه وانصرف عنه، إذ كان لا رجوع له، يعني ما ترى من خراب الدور» [@tabrizi-ashr، ص310–311]. وقال الأَعْلَم: «وانم القتود، أي عالها وارفعها على هذه الناقة؛ وهذا لتسلو عما أنت فيه» [@diwan-nabigha، ص16]."
vocabulary:
  - term: "فَعَدِّ"
    text: "اصرف نفسك وجاوِز. «أي جُزه وانصرف عنه» [@tabrizi-ashr، ص310–311]."
  - term: "ارْتِجَاعَ"
    text: "رجوع، أي لا يعود ما مضى."
  - term: "وَانْمِ"
    text: "ارفع. وفي اللسان: «ونميت الشيء على الشيء: رفعته عليه. وكل شيء رفعته فقد نميته؛ ومنه قول النابغة» [@lisan، ج15 ص342]."
  - term: "الْقُتُودَ"
    text: "«خشب الرحل، وهو للجمع الكثير، وفي القليل أقتاد، وحكى بعض أهل اللغة أن الواحد قتد» [@tabrizi-ashr، ص311]. وعند الأَعْلَم: «ولا واحد لها عند أكثر أهل اللغة، وقال أبو عمرو الشيباني: واحدها قتد» [@diwan-nabigha، ص16]."
  - term: "عَيْرَانَةٍ"
    text: "«المشبهة بالعير لصلابة خُفها وشدته» [@tabrizi-ashr، ص311]، والعَيْر: حمار الوحش. وعند الأَعْلَم: «ناقة تشبه العير في القوة والنشاط» [@diwan-nabigha، ص16]."
  - term: "أُجُدِ"
    text: "«التي عظم فقارها، وقالوا: هي الموثقة الخلق» [@tabrizi-ashr، ص311]. وقال الأَعْلَم: «وهي التي عظام فقارها [عظم] واحد، يقال: بنيان مؤجد؛ إذا كان مرصوصا بعضه إلى بعض» [@diwan-nabigha، ص16]. والفَقار: عظام الظهر."
context: "هذا هو الخروج من الوقوف على الدار إلى الرحلة. والخروج عند النقاد الانتقال من غرض إلى غرض في القصيدة، وقد جعل له ابن رَشِيق بابًا سماه «باب المبدأ والخروج والنهاية»، ونقل فيه عن أحد الحذاق أنه اشتهر بـ«حسن الفواتح والخواتم ولطف الخروج إلى المدح والهجاء» [@ibn-rashiq، ج1 ص217]. ويرى شَوْقي ضَيْف أن النابِغة هنا «يخرج من النسيب إلى وصف ناقته خروجا تسنده المناسبة» [@deif، ج1 ص298]، أي إن الانتقال له سبب في الكلام: الدار لا ترجع، فلا يبقى إلا الرحيل."
syntax:
  - "«فَعَدِّ» فعل أمر مبني على حذف حرف العلة، والفاعل ضمير المخاطب، يخاطب به نفسه. و«عَمَّا»: «عن» و«ما» الموصولة، وجملة «تَرَى» صلتها، والعائد محذوف: عما تراه."
  - "«إِذْ لَا ارْتِجَاعَ لَهُ»: «إذ» للتعليل، و«لا» نافية للجنس، و«ارْتِجَاعَ» اسمها مبني على الفتح، و«لَهُ» متعلق بمحذوف خبرها."
  - "«وَانْمِ» فعل أمر مبني على حذف الياء، و«الْقُتُودَ» مفعول به، و«عَلَى عَيْرَانَةٍ» متعلق به، و«أُجُدِ» صفة لـ«عَيْرَانَةٍ»."
morphology:
  - "«عَدِّ» أمر من «عَدَّى» على «فعَّل»، بمعنى صرف وجاوز. و«انْمِ» أمر من «نَمَى يَنْمِي»."
  - "«ارْتِجَاع» مصدر «ارتجع» على «افتعل» من الرجوع."
  - "«عَيْرَانَة» على «فَعْلانة»، صفة مأخوذة من «العَيْر» للتشبيه به. و«أُجُد» على «فُعُل»."
rhetoric:
  thesis: "بيت الانتقال: يغلق باب الدار بحكم قاطع «لَا ارْتِجَاعَ لَهُ»، ويفتح باب الرحلة بأمر «وَانْمِ الْقُتُودَ». ويقرأ الأَعْلَم الرحلة هنا علاجًا للحزن: «وهذا لتسلو عما أنت فيه» [@diwan-nabigha، ص16]."
  devices:
    - title: "الخروج"
      text: "في «فَعَدِّ عَمَّا تَرَى» ينتقل من غرض إلى غرض بجملة واحدة، ويعلّل الانتقال بـ«إِذْ لَا ارْتِجَاعَ لَهُ»، فلا يبدو الانتقال قفزًا، بل نتيجة لما سبق. وهذا ما يسميه شَوْقي ضَيْف خروجًا «تسنده المناسبة» [@deif، ج1 ص298]."
    - title: "مخاطبة النفس"
      text: "في «فَعَدِّ» و«وَانْمِ» يأمر الشاعر نفسه كأنها رجل آخر. فيصير الحزن والعزم حوارًا بين اثنين: واحد يقف على الدار، وآخر يأمره بالرحيل."
    - title: "التشبيه في الصفة"
      text: "في «عَيْرَانَةٍ» تشبيه مطوي في كلمة واحدة: لم يقل كأنها عير، بل اشتق لها صفة من اسم العير. فالكلمة نفسها تحمل التشبيه بحمار الوحش في الصلابة والنشاط."
  connection: "ثم يكمل صفة الناقة: لحمها المكتنز، وصريف نابها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَعَدْدِ عَمْ / مَا تَرَى / إِذْ لَرْتِجَا / عَ لَهُو = متفعلن / فاعلن / مستفعلن / فعِلن — وَنْمِلْ قُتُو / دَ عَلَى / عَيْرَانَتِنْ / أُجُدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتسقط همزة الوصل في «لَا ارْتِجَاعَ» فتُنطق «لَرْتِجَاعَ»."
