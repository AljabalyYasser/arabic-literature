first: "قَالَتْ أَلَا لَيْتَمَا هَذَا الْحَمَامُ لَنَا"
second: "إِلَى حَمَامَتِنَا وَنِصْفُهُ فَقَدِ"
meaning: "قالت الفتاة حين رأت الحمام: ليت هذا الحمام لنا، مضمومًا إلى حمامتنا، ومعه نصفه، فحسبي ذلك. فهي تعدّ في لحظة: ما رأته، ونصفه، وحمامتها، فيكون المجموع مئة كما يتبيّن في البيتين 30 و31. و«قد» بمعنى حسب، قال التِّبْرِيزِيّ: «وقَدِ: بمعنى حسب» [@tabrizi-ashr، ص316]، وقال الأَعْلَم: «أي حَسْبي» [@diwan-nabigha، ص24]."
vocabulary:
  - term: "لَيْتَمَا"
    text: "«ليت» للتمني، ودخلت عليها «ما» (انظر النحو)."
  - term: "إِلَى حَمَامَتِنَا"
    text: "مع حمامتنا. قال التِّبْرِيزِيّ في قولها في الرجز «إلى حمامتيه»: «أي مع حمامتيه» [@tabrizi-ashr، ص317]."
  - term: "فَقَدِ"
    text: "فحسب، أي فيكفيني."
context: "قول الفتاة، وهو قلب الحكاية. ويروي التِّبْرِيزِيّ قولها رجزًا: «لَيْتَ الحَمَامَ لِيَهْ ... إلى حَمَامَتِيَهْ / وَنِصْفَهُ قَدِيَهْ ... تمَّ الحَمَامُ مِيَهْ» [@tabrizi-ashr، ص317]، ومثله عند الأَعْلَم [@diwan-nabigha، ص24]، ورواه الأَصْمَعِيّ بلفظ القطا في خبر بنت الخُسّ [@diwan-nabigha، ص23]. فالنابِغة نظم في البيت ما يُروى من قولها. وهو من الأبيات التي يقول شَوْقي ضَيْف إنها «واضحة الانتحال» [@deif، ج1 ص280]. وقد استشهد به سِيبَوَيْه منسوبًا إلى النابِغة الذُّبْيانيّ [@sibawayh، ج2 ص137]. وهو البيت الرابع والثلاثون عند الأَعْلَم."
syntax:
  - "«قَالَتْ» فعل ماض، والفاعل ضمير الفتاة، وما بعده مقول القول. و«أَلَا» حرف استفتاح وتنبيه."
  - "«لَيْتَمَا هَذَا الْحَمَامُ لَنَا» بالرفع: «ما» كافّة كفّت «ليت» عن العمل، فما بعدها مبتدأ وخبر: «هَذَا» مبتدأ، و«الْحَمَامُ» بدل منه، و«لَنَا» خبره. قال التِّبْرِيزِيّ: «وإذا رفعته تكون كافة لليت عن العمل، ويصير ما بعدها مبتدأ وخبرا، كما تقول: إنما زيدٌ منطلق» [@tabrizi-ashr، ص316]. وقال سِيبَوَيْه: «وأما ليتما زيدا منطلقٌ فإن الإلغاء فيه حسن، وقد كان رؤبة ابن العجاج ينشد هذا البيت رفعا» [@sibawayh، ج2 ص137]، وجعل لرفعه وجهين: «على أن يكون بمنزلة قول من قال: مثلا ما بَعوضةٌ، أو يكون بمنزلة قوله: إنما زيدٌ منطلقٌ» [@sibawayh، ج2 ص138]، أي أن تكون «ما» موصولة والمبتدأ محذوفًا، أو كافّة."
  - "«إِلَى حَمَامَتِنَا» متعلق بمحذوف حال، أي مضمومًا إلى حمامتنا. و«وَنِصْفُهُ» معطوف على «الْحَمَامُ» مرفوع مثله."
  - "«فَقَدِ» الفاء رابطة، و«قَدْ» اسم بمعنى «حسب» مبتدأ خبره محذوف، أي فحسبي ذلك، وكُسرت داله للقافية."
morphology:
  - "«لَيْتَمَا» مركبة من «ليت» و«ما» الحرفية."
  - "«قَدْ» هنا اسم لا حرف، مبني على السكون، ويقال: قَدْني وقَدِي، أي حسبي، كما في قولها «قَدِيَهْ» والهاء فيه للسكت."
  - "«نِصْف» على «فِعْل»، و«حَمَامَة» واحدة «حمام»."
rhetoric:
  thesis: "البيت يحكي سرعة الفتاة: لم تعدّ الحمام واحدًا واحدًا، بل أدركت عدده بنظرة، ثم صاغت حسابها تمنّيًا يحمل الجواب في طيّه. فالحكمة التي يطلبها الشاعر من النُّعْمان إدراك للحقيقة بنظرة صادقة، لا تتبّع لأقوال الوشاة."
  devices:
    - title: "الحساب المضمر في التمني"
      text: "صاغت المسألة الحسابية في صورة أمنية: «لَيْتَمَا هَذَا الْحَمَامُ لَنَا... وَنِصْفُهُ»، فالسامع يُدعى إلى أن يحسب بنفسه، ولا يُعطى العدد إلا في البيتين 30 و31، فتبقى الحكاية مشوّقة."
    - title: "الإيجاز في «فَقَدِ»"
      text: "كلمة واحدة تختم الأمنية وتعلن أن العدد تمّ، كأنها تقول: ولا أريد زيادة، لأن الحساب صار مئة كاملة."
  connection: "ثم يصف موضع الحمام وعين الفتاة التي رأته."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "قَالَتْ أَلَا / لَيْتَمَا / هَاذَلْ حَمَا / مُ لَنَا = مستفعلن / فاعلن / مستفعلن / فعِلن — إِلَى حَمَا / مَتِنَا / وَنِصْفُهُو / فَقَدِي = متفعلن / فعِلن / متفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، في العجز كله: «مستفعلن» الأولى والثالثة صارتا «متفعلن»، و«فاعلن» الثانية صارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «وَنِصْفُهُ» فتصير «وَنِصْفُهُو» ليستقيم الوزن."
variants:
  - reading: "قَالَتْ أَلَا لَيْتَمَا هَذَا الْحَمَامَ لَنَا / إِلَى حَمَامَتِنَا وَنِصْفَهُ فَقَدِ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "بالنصب، و«ما» زائدة و«ليت» عاملة: «وكذلك نصفَه ونصفُه، فإذا نصبته تكون ما زائدة» [@tabrizi-ashr، ص316]. وفي نسخة الشاملة «الحَمَامَُ» بفتحة وضمة معًا، فأثبتنا الرفع لأنه رواية الأَعْلَم [@diwan-nabigha، ص24] وإنشاد رؤبة عند سِيبَوَيْه [@sibawayh، ج2 ص137]. ويقول البَغْداديّ: «وقد روي هذا البيت بالوجهين والإلغاء أكثر» [@khizana، ج10 ص251]."
  - reading: "قَالَتْ أَلَا لَيْتَمَا هَذَا الْحَمَامُ لَنَا / إِلَى حَمَامَتِنَا أَوْ نِصْفُهُ فَقَدِ"
    status: "رواية البَغْداديّ"
    note: "بـ«أو» في موضع الواو [@khizana، ج10 ص251]."
  - reading: "فَيَا لَيْتَمَا هَذَا الْحَمَامُ لَنَا"
    status: "رواية ابن السِّكِّيت"
    note: "يقول محقق الديوان: «ابن السكيت: فياليتما» [@diwan-nabigha، ص235]، وهو عنده عند البيت 34 من رواية الأَعْلَم، أي هذا البيت."
  - reading: "قَالَتْ أَلَا لَيْتَمَا هَذَا الْحَمَامُ لَنَا / إِلَى حَمَامَتِنَا وَنِصْفُهُ فَقَدِ"
    status: "رواية الأَعْلَم، وهو البيت 34 عنده"
    note: "بلفظ نصّنا، وهو عنده بعد «يحفه جانبا نيق» (البيت 29 عندنا) لا قبله [@diwan-nabigha، ص24]."
