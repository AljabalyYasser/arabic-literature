    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«ويروى (تنزع)» [@tabrizi-ashr، ص318]. وفي اللسان: «ونَزَعَتِ الْخَيْلُ تَنْزِعُ: جَرَتْ طِلْقاً»، وينشده: «والخيْلَ تَنْزِعُ قُبًّا فِي أَعِنَّتِها» [@lisan، ج8 ص352]، والقُبّ الضامرة البطون."
  - reading: "وَالْخَيْلَ تَمْزَعُ رَهْوًا فِي أَعِنَّتِهَا"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«ويروى (رهوا) والرهو: الساكن» [@tabrizi-ashr، ص318]، فالمعنى على هذه الرواية أنها تسرع في سكون لا اضطراب فيه."
  - reading: "وَالْخَيْلُ"
    status: "إنشاد ردّه ابن بَرِّيّ"
    note: "بالرفع، وقال ابن بَرِّيّ إن صوابه النصب لأنه معطوف على «الْمِائَةَ» [@lisan، ج1 ص640]."
  - reading: "وَالْخَيْلَ تَمْزَعُ غَرْبًا فِي أَعِنَّتِهَا / كَالطَّيْرِ تَنْجُو مِنَ الشُّؤْبُوبِ ذِي الْبَرَدِ"
    status: "رواية الأَعْلَم، وهو البيت 31 عنده"
    note: "بلفظ نصّنا [@diwan-nabigha، ص23]. وفي نسخة الشاملة للتِّبْرِيزِيّ «الشُّؤْبُوبُ» بالضم، وهو خطأ في الطبع لأنه مجرور بـ«من»."
