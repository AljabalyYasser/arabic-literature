first: "وَالْخَيْلَ تَمْزَعُ غَرْبًا فِي أَعِنَّتِهَا"
second: "كَالطَّيْرِ تَنْجُو مِنَ الشُّؤْبُوبِ ذِي الْبَرَدِ"
meaning: "ويهب الخيل تمرّ مسرعة في أعنّتها بحدّة ونشاط، كأنها طير تفرّ من دفعة مطر فيها بَرَد. قال الأَعْلَم: «يقول: هو يَهَبُ المائةَ المِعْكاءَ، ويَهَبُ الراكضات، ويهب الخيل»، ثم قال: «وشبّه الخيلَ به في سرعتها بطير أصابها مطر شديد فيه بَرَدٌ؛ فهي تنجو وتسرع إلى مواضع تقيها من المطر والبرد» [@diwan-nabigha، ص23]."
vocabulary:
  - term: "تَمْزَعُ"
    text: "«تمر مرا سريعا» [@tabrizi-ashr، ص318]. وفي اللسان: «المَزْعُ: شِدَّةُ السَّيْرِ» وينشد البيت [@lisan، ج8 ص335]."
  - term: "غَرْبًا"
    text: "«أي حدة» [@tabrizi-ashr، ص318]، وعند الأَعْلَم: «والغَرْب: الحِدّة والنشاط» [@diwan-nabigha، ص23]. وفي اللسان: «وغَرْبُ الفَرَسِ: حِدَّتُه، وأَوَّلُ جَرْيِه» [@lisan، ج1 ص640]."
  - term: "أَعِنَّتِهَا"
    text: "جمع عِنان، وهو سير اللجام الذي يمسكه الفارس."
  - term: "الشُّؤْبُوبِ"
    text: "قال التِّبْرِيزِيّ: «والشؤبؤب: السحاب العظيم القطر القليل العرض» [@tabrizi-ashr، ص318]، وقال: «ولا يقال لها شؤبوبة حتى يكون فيها برد» [@tabrizi-ashr، ص319]. وعند الأَعْلَم: «دفعة المطر وشدّته» [@diwan-nabigha، ص23]."
  - term: "الْبَرَدِ"
    text: "حبّ الثلج الذي ينزل مع المطر."
context: "رابع أبيات العطايا (32–36): بعد الإبل والجواري يذكر الخيل. وهو البيت الحادي والثلاثون عند الأَعْلَم، وبه يختم الأَعْلَم أبيات العطايا، ثم تأتي عنده أبيات فتاة الحي. والطير والمطر هنا يذكّران ببيت الثور في الليلة الباردة: «سَرَتْ عَلَيْهِ مِنَ الْجَوْزَاءِ سَارِيَةٌ / تُزْجِي الشَّمَالُ عَلَيْهِ جَامِدَ الْبَرَدِ» (البيت 11)، فالبَرَد الذي صبر عليه الثور هناك تفرّ منه الطير هنا، وسرعة الفرار هي وجه الشبه."
syntax:
  - "«وَالْخَيْلَ» معطوف على «الْمِائَةَ» في البيت 33، منصوب، أي ويهب الخيل. وفي اللسان أنشده بالرفع، ثم نقل قول ابن بَرِّيّ: «صواب إنشاده: والخيلَ، بالنصب، لأنه معطوف على المائة» [@lisan، ج1 ص640]."
  - "«تَمْزَعُ» فعل مضارع، والفاعل ضمير الخيل، والجملة حال من «الْخَيْلَ». و«غَرْبًا» مفعول لأجله أو حال مؤوّلة، أي ذات غرب، أو مفعول مطلق معنوي، أي تمزع مزعًا شديدًا. و«فِي أَعِنَّتِهَا» متعلق بمحذوف حال، أي وهي في أعنّتها."
  - "«كَالطَّيْرِ» جار ومجرور متعلق بمحذوف حال ثانية من «الْخَيْلَ». وجملة «تَنْجُو» حال من «الطَّيْرِ»، و«مِنَ الشُّؤْبُوبِ» متعلق بـ«تَنْجُو»، و«ذِي الْبَرَدِ» نعت لـ«الشُّؤْبُوبِ» مجرور بالياء لأنه من الأسماء الخمسة."
morphology:
  - "«تَمْزَعُ» مضارع «مَزَعَ» على «فَعَلَ يَفْعَلُ»، وفُتحت عينه في المضارع لأن لامه حرف حلق. وفي اللسان: «مَزَعَ البعيرُ فِي عَدْوِه يَمْزَعُ مَزْعاً: أَسْرَع فِي عَدْوه، وَكَذَلِكَ الفرسُ» [@lisan، ج8 ص335]."
  - "«أَعِنَّة» جمع «عِنان» على «أَفْعِلة»، وأصلها «أَعْنِنَة»، أُدغمت النونان."
  - "«الشُّؤْبُوب» على «فُعْلُول»، وجمعه «شآبيب»."
rhetoric:
  thesis: "يختم وصف العطايا بالحركة: بعد الإبل الساكنة في المرعى والجواري الساكنات في الظل، تأتي الخيل مسرعة. والصورة تجمع القوة والانقياد معًا: سريعة حادّة، لكنها في أعنّتها، أي مروّضة تطيع."
  devices:
    - title: "تشبيه الحركة بالحركة في «كَالطَّيْرِ تَنْجُو»"
      text: "لم يشبّه الخيل بالطير في الشكل، بل في هيئة الحركة: اندفاع خائف إلى ملجأ. ويقول عبد القاهر الجُرْجانيّ: «اعلم أن مما يزدادُ به التشبيهُ دقّةً وسِحْرَاً، أن يجيء في الهيئات التي تقع على الحركات» [@asrar، ص180]. وقيّد الطير بأنها تنجو من مطر فيه برد، فليست سرعتها سرعة عادية، بل سرعة الفزع، وهذا ما فسّره الأَعْلَم [@diwan-nabigha، ص23]."
    - title: "المقابلة في «غَرْبًا فِي أَعِنَّتِهَا»"
      text: "يجمع بين الحدّة والضبط: الغرب حدّة الجري، والأعنّة تمسكها. فالخيل التي يهبها لا هي بطيئة ولا هي جامحة."
  connection: "ثم يختم العطايا بالنوق المذللة المشدودة عليها رحال الحِيرة الجديدة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلْخَيْلَ تَمْ / زَعُ غَرْ / بَنْ فِي أَعِنْ / نَتِهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — كَطْطَيْرِ تَنْ / جُو مِنَشْ / شُؤْبُوبِ ذِلْ / بَرَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية من الصدر فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
