first: "وَمَنْ عَصَاكَ فَعَاقِبْهُ مُعَاقَبَةً"
second: "تَنْهَى الظَّلُومَ وَلَا تَقْعُدْ عَلَى ضَمَدِ"
meaning: "ومن عصاك فعاقبه عقابًا يردع الظالم عن ظلمه، ولا تبق على غيظ تُضمره. فالعقاب عنده يقع ثم ينتهي، ولا يتحول إلى حقد مقيم. قال الأَعْلَم: «أي لا تنطوي على حقد وغضب إلا لمن هو مثلك في الناس، أو قريب منك» [@diwan-nabigha، ص21]، فوصله بالبيت التالي."
vocabulary:
  - term: "مُعَاقَبَةً"
    text: "عقابًا."
  - term: "الظَّلُومَ"
    text: "الكثير الظلم."
  - term: "ضَمَدِ"
    text: "«الحقد» [@tabrizi-ashr، ص315]. وعند الأَعْلَم: «الذلّ والغيظ والحقد، وقيل: هو الظلم، وقيل: هو شدّة الغضب والحقد» [@diwan-nabigha، ص21]. وفي اللسان تفريق دقيق: «الضَّمَد أَن يَغْتَاظَ عَلَى مَنْ يَقْدِر عَلَيْهِ، والغيظُ أَن يَغتاط عَلَى مَنْ يَقْدِرُ عَلَيْهِ وَمَنْ لَا يقدِرُ» [@lisan، ج3 ص265]."
context: "آخر خطاب الإله لسُلَيْمان، وفيه الشق الثاني من ميزان الحكم. وهو أشهر أبيات سُلَيْمان، يعدّه ابن قُتَيْبة فيما سار من شعر النابِغة: «ومما يتمثّل به أيضا من شعره» ثم ينشده، ويفسّر الضمد بقوله: «وهو الذلّ والهوان» [@ibn-qutayba، ج1 ص161]. والبيت من الأبيات التي يرى شَوْقي ضَيْف أنها أقحمت على القصيدة [@deif، ج1 ص279]، وهذا رأيه، أما ابن قُتَيْبة فرواه للنابِغة وعدّه من أمثاله."
syntax:
  - "«وَمَنْ عَصَاكَ» الواو عاطفة، و«مَنْ» اسم شرط مبتدأ، و«عَصَاكَ» فعل الشرط، والكاف مفعول به. و«فَعَاقِبْهُ» جواب الشرط مقترن بالفاء لأنه أمر."
  - "«مُعَاقَبَةً» مفعول مطلق منصوب، وجملة «تَنْهَى الظَّلُومَ» صفة له، و«الظَّلُومَ» مفعول به."
  - "«وَلَا تَقْعُدْ عَلَى ضَمَدِ» معطوفة على «فَعَاقِبْهُ»: «لا» ناهية، و«تَقْعُدْ» مجزوم بها، و«عَلَى ضَمَدِ» متعلق به."
morphology:
  - "«مُعَاقَبَة» مصدر «عاقَبَ» على «مُفاعَلة»، وهو المصدر القياسي لـ«فاعَلَ»."
  - "«الظَّلُوم» صيغة مبالغة على «فَعُول» من «ظَلَمَ»."
  - "«ضَمَد» مصدر «ضَمِدَ يَضْمَدُ» على «فَعَل». قال التِّبْرِيزِيّ: «يقال: ضمد يضمد ضمدا فهو ضمد» [@tabrizi-ashr، ص315]."
rhetoric:
  thesis: "يرسم للعقاب حدًّا: هو للردع لا للتشفي. ومعنى اللسان يجعل البيت أدقّ: الضمد غيظ القادر على من تحت يده، فالنهي موجّه إلى الملك الذي يقدر، وهذا بعينه ما يرجوه النابِغة من النُّعْمان."
  devices:
    - title: "الكناية في «وَلَا تَقْعُدْ عَلَى ضَمَدِ»"
      text: "الكناية أن يريد المتكلم معنى فلا يذكره بلفظه بل بما يلزمه، وهي عند عبد القاهر الجُرْجانيّ أن المتكلم «لا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود، فيومئ به إليه» [@dalail، ص66]. فالقعود على الشيء ملازمته، والمراد: لا تُضمر حقدًا بعد العقاب، وبهذا فسّره الأَعْلَم: «أي لا تنطوي على حقد» [@diwan-nabigha، ص21]."
    - title: "المقابلة"
      text: "يقابل هذا البيت سابقه: «وَمَنْ عَصَاكَ فَعَاقِبْهُ» مقابل «فَمَنْ أَطَاعَ فَأَعْقِبْهُ»، فتمّ الميزان."
    - title: "التوكيد بالمصدر في «فَعَاقِبْهُ مُعَاقَبَةً»"
      text: "أكّد الفعل بمصدره من لفظه، ثم وصف المصدر بغايته «تَنْهَى الظَّلُومَ»، فصار التوكيد تحديدًا لنوع العقاب لا تكرارًا."
  connection: "ثم يستثني من النهي عن الحقد: إلا لمن هو مثلك، أو من سبقته سبق الجواد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَمَنْ عَصَا / كَ فَعَا / قِبْهُو مُعَا / قَبَتَنْ = متفعلن / فعِلن / مستفعلن / فعِلن — تَنْهَظْ ظَلُو / مَ وَلَا / تَقْعُدْ عَلَى / ضَمَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية في الشطرين فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
