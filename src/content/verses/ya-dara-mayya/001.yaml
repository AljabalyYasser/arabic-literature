first: "يَا دَارَ مَيَّةَ بِالْعَلْيَاءِ فَالسَّنَدِ"
second: "أَقْوَتْ وَطَالَ عَلَيْهَا سَالِفُ الْأَبَدِ"
meaning: "ينادي دار مَيّة التي كانت بالعَلْياء ثم السَّنَد، ثم يقول عنها: خلت من أهلها، ومرّ عليها دهر طويل. والنداء هنا توجّع لا طلب جواب، كما يقول الأَعْلَم: «إنما قال: \"يا دار مية بالعلياء\" توجعا منه؛ لأنه كان معها، مقيما بها في سرور ونعمة، زمن مرتبعهم، ثم انقضى ذلك؛ فجعل يخاطبها توجعا منه لما رأى من تغيرها، وتذكرا لما عهده منها» [@diwan-nabigha، ص14]. وجعل الدار في موضع مرتفع لأنها كذلك عنده «لم يضرها السيل، ولا انهال عليها الرمل» [@diwan-nabigha، ص14]."
vocabulary:
  - term: "مَيَّةَ"
    text: "اسم امرأة يذكرها في نسيبه، ولا يقول الشارحان من هي. وتعود في مطلع قصيدته الأخرى «أَمِنْ آلِ مَيَّةَ رَائِحٌ أَوْ مُغْتَدِ» [@diwan-nabigha، ص89]."
  - term: "الْعَلْيَاءِ"
    text: "«مكان مرتفع من الأرض» [@tabrizi-ashr، ص308]. أما صاحب اللسان فيجعلها والسَّنَد اسمين لموضعين: «والسند: بلد معروف في البادية؛ ومنه قوله: يا دار مية بالعلياء فالسند والعلياء: اسم بلد آخر» [@lisan، ج3 ص223]."
  - term: "السَّنَدِ"
    text: "«سند الوادي في الجبل، وهو ارتفاعه حيث يسند فيه أي يصعد» [@tabrizi-ashr، ص308]."
  - term: "أَقْوَتْ"
    text: "«خلت من أهلها» [@tabrizi-ashr، ص308]."
  - term: "سَالِفُ الْأَبَدِ"
    text: "«والسالف: الماضي، والأبد: الدهر» [@tabrizi-ashr، ص308]. فسالف الأبد: ما مضى من الدهر."
context: "مطلع القصيدة، وهو أول شعر النابِغة في رواية الأَصْمَعِيّ، وفي رأسه عند الأَعْلَم أنه قالها «يمدح النعمان بن المنذر، ويعتذر إليه مما بلغه عنه فيما وشى به بنو قريع في أمر المتجردة» [@diwan-nabigha، ص14]. وقد بدأ الاعتذار بما يبدأ به الشعراء: الوقوف على الدار، فلا يظهر غرضه إلا في البيت 20. واستشهد سِيبَوَيْه بهذا البيت والبيتين بعده، فقال: «وعلى هذا أنشدت بنو تميم قول النابغة الذبياني» [@sibawayh، ج2 ص320–321]، ونقل البَغْداديّ أنهم «ألحقوها لجودتها بالمعلقات السبع» [@khizana، ج4 ص5]."
syntax:
  - "«يَا دَارَ» منادى مضاف منصوب، و«مَيَّةَ» مضاف إليه مجرور بالفتحة لأنه ممنوع من الصرف للعلمية والتأنيث."
  - "«بِالْعَلْيَاءِ» جار ومجرور متعلق بمحذوف حال من الدار، أي: كائنة بالعلياء. و«فَالسَّنَدِ» معطوف عليه بالفاء، وهي تفيد الترتيب: الدار ممتدة من العلياء إلى السند."
  - "«أَقْوَتْ» فعل ماض، والتاء للتأنيث، والفاعل ضمير يعود إلى الدار، والجملة مستأنفة. و«وَطَالَ عَلَيْهَا سَالِفُ الْأَبَدِ» معطوفة عليها، و«سَالِفُ» فاعل «طَالَ»، مضاف إلى «الْأَبَدِ»."
  - "وفي المنادى قولان ينقلهما البَغْداديّ عن «الأغاني»: قول الأَصْمَعِيّ «يريد يا أهل دار مية»، على حذف المضاف، وقول آخر: «نادى الديار لا أهلها أسفا عليها» [@khizana، ج4 ص5–6]."
morphology:
  - "«الْعَلْيَاءِ» على «فَعْلاء» من العلوّ، والأصل فيها الواو. قال ابن السِّكِّيت: «قال (بالعلياء) فجاء بالياء لأنه بناها على عليت» [@tabrizi-ashr، ص308]، أي أخذها من «عَلِيَ» بالياء لا من «عَلا» بالواو."
  - "«أَقْوَتْ» من «أَقْوَى» على «أَفْعَلَ»، وهو هنا للصيرورة: صارت قَواءً، أي خلاءً."
  - "«سَالِف» اسم فاعل من «سَلَفَ» إذا مضى."
rhetoric:
  thesis: "مطلع على عادة الجاهليين، يبدأ بالنداء ثم يلتفت عن المخاطَب إلى الحديث عنه. والمطلع عند ابن رَشِيق أول ما يُحكم به على الشاعر: «فإن الشعر قفل أوله مفتاحه، وينبغي للشاعر أن يجود ابتداء شعره؛ فإنه أول ما يقرع السمع» [@ibn-rashiq، ج1 ص218]. ونقل أبو عُبَيْدة قول من يفضّل النابِغة على الشعراء: «وأجودهم مقاطع، وأحسنهم مطالع» [@ibn-qutayba، ج1 ص166]. ويرى شَوْقي ضَيْف أن في هذا النسيب «قدرة بارعة على الوصف، ولكن ليس فيه عاطفة قوية» [@deif، ج1 ص294]."
  devices:
    - title: "نداء ما لا يسمع"
      text: "في «يَا دَارَ مَيَّةَ» ينادي دارًا لا تسمع ولا تجيب، فالنداء لا يطلب إقبالًا بل يُظهر الحسرة، وهو ما يسميه الأَعْلَم توجعًا [@diwan-nabigha، ص14]. ومن قال مع الأَصْمَعِيّ إن المراد «أهل دار مية» [@khizana، ج4 ص5] جعل الكلام على حذف المضاف، والأول أقرب إلى حال الشاعر الذي يعلم أن لا أحد فيها."
    - title: "الالتفات"
      text: "الالتفات أن ينتقل المتكلم من الخطاب إلى الغيبة أو العكس. فهو يخاطب الدار في «يَا دَارَ»، ثم يتحدث عنها غائبة في «أَقْوَتْ». قال الأَعْلَم: «وقال: \"أقوت\" ولم يقل: \"أقويت\"»، لأن من عادتهم أن «يخاطبوا الشيء ثم يتركوا خطابه، ويكنوا عنه»، ومثّل له بقوله تعالى: «حتى إذا كنتم في الفلك وجرين بهم» [@diwan-nabigha، ص14]. فكأنه نادى الدار، فلما لم تجب التفت إلى نفسه يصف خرابها."
    - title: "التصريع"
      text: "ختم الصدر بـ«فَالسَّنَدِ» على قافية العجز «الْأَبَدِ». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. والعروض آخر تفعيلة في الصدر، والضرب آخر تفعيلة في العجز، وبه يعرف السامع قافية القصيدة من بيتها الأول."
  connection: "ثم يذكر وقوفه بها عشيًّا يسائلها فلا تجيب."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "يَا دَارَ مَيْ / يَةَ بِلْ / عَلْيَاءِ فَسْ / سَنَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن — أَقْوَتْ وَطَا / لَ عَلَيْ / هَا سَالِفُلْ / أَبَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن». والعروض والضرب مخبونان «فعِلن»، وهي صورة البسيط التام المشهورة [@atiq، ص48]. والبيت مصرّع. وتُمدّ كسرة الدال في الإنشاد حتى تصير ياء: «يا دار مية بالعلياء فالسندي»، قال صاحب اللسان: «فوصل كسرة الدال بالياء، والخليل يسميها ياء الترنم، يمد بها القوافي» [@lisan، ج15 ص491]. وهذه الياء هي الوَصْل، وحركة الرويّ التي يبدأ منها هي المَجْرى [@lisan، ج14 ص141]. ويذكر ابن رَشِيق أن ناسًا كثيرًا من بني تميم ينشدونها بالتنوين بدل الياء: «فينشد قول النابغة: يا دار مية بالعلياء فالسند منوناً إلى آخر القصيدة» [@ibn-rashiq، ج2 ص311]."
