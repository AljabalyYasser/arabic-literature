first: "وَلَا أَرَى فَاعِلًا فِي النَّاسِ يُشْبِهُهُ"
second: "وَمَا أُحَاشِي مِنَ الْأَقْوَامِ مِنْ أَحَدِ"
meaning: "لا أرى في الناس من يفعل الخير فيشبه النُّعْمان في فعله، ولا أستثني من ذلك أحدًا من الأقوام. قال التِّبْرِيزِيّ: «المعنى: ولا أرى فاعلا يفعل الخير يشبهه، ومعنى (وما أحاشي) وما أستثنى، كما تقول: حاشى فلانا» [@tabrizi-ashr، ص314]. وقال الأَعْلَم: «أي لا أرى أحدًا يفعل فعلًا كريمًا يُشبهه في فعله»، و«ولا أحاشي»: «أي لا أستثني فأقول: حاشا فلانًا فهو يشبهه في فعل الخير» [@diwan-nabigha، ص20]."
vocabulary:
  - term: "فَاعِلًا"
    text: "من يفعل الخير والكرم، فالمفعول محذوف يُفهم من المقام، كما في شرح التِّبْرِيزِيّ [@tabrizi-ashr، ص314]."
  - term: "أُحَاشِي"
    text: "أستثني، أي أقول: حاشا فلانًا. وفي اللسان: «ويقال: حاشى لفلان وحاشى فلانا وحاشى فلان» [@lisan، ج14 ص181]."
  - term: "الْأَقْوَامِ"
    text: "جمع قوم، أي الناس على اختلاف قبائلهم."
context: "أول المدح بعد الخروج: ينفي أن يكون في الناس شبيه للنعمان، ثم يستثني في البيت التالي سُلَيْمان وحده. ومن هنا يبدأ ما يشكّ فيه شَوْقي ضَيْف، فهو يورد هذا البيت والخمسة بعده ثم يقول: «وواضح أنه يسترسل فى الحديث عن سليمان كأنه من أهل الكتب السماويه وقد كان وثنيّا على مذهب قومه، وبحق رأى طه حسين أن الأبيات أقحمت على المعلقة إقحاما» [@deif، ج1 ص279]. وهذا رأيه، أما القدماء فرووا الأبيات كلها للنابِغة، واستشهد النحاة بهذا البيت: فالكوفيون يحتجّون به على أن «حاشا» فعل، لأنه تصرّف منه المضارع «أحاشي» [@khizana، ج3 ص404]."
syntax:
  - "«وَلَا أَرَى» الواو عاطفة، و«لا» نافية، و«أَرَى» فعل مضارع، والفاعل ضمير المتكلم. و«فَاعِلًا» مفعول به، و«فِي النَّاسِ» متعلق بمحذوف صفة له، وجملة «يُشْبِهُهُ» صفة ثانية."
  - "«وَمَا أُحَاشِي» معطوفة على ما قبلها، و«مِنَ الْأَقْوَامِ» متعلق بـ«أُحَاشِي». و«مِنْ أَحَدِ»: «من» زائدة لتأكيد النفي، و«أَحَدِ» مفعول به منصوب محلًّا مجرور لفظًا. قال التِّبْرِيزِيّ: «و (من) زائدة في قوله (من أحد)» [@tabrizi-ashr، ص314]."
  - "وتقول في الاستثناء بها: «حاشا فلانًا» و«حاشا فلانٍ»، قال التِّبْرِيزِيّ: «وإن شئت خفضت، إلا أن النصب أجود؛ لأنه قد اشتق منه فعل» [@tabrizi-ashr، ص314]، يريد هذا الفعل «أُحاشي» نفسه."
morphology:
  - "«أُحَاشِي» مضارع «حَاشَى يُحَاشِي» على «فاعَلَ»، مأخوذ من كلمة الاستثناء «حاشا». ويقول البصريون إنه ليس تصرّفًا من «حاشا»، بل فعل صيغ من لفظها كما يقال «بسمل» و«هلّل» إذا قال: بسم الله، ولا إله إلا الله [@khizana، ج3 ص404]."
  - "«فَاعِل» اسم فاعل من «فَعَلَ»."
  - "«الْأَقْوَام» جمع تكسير لـ«قوم» على «أفعال»."
rhetoric:
  thesis: "مدح بالنفي: لا ينسب إلى النُّعْمان صفة، بل ينفي أن يكون له شبيه، فيصير المدح أوسع من كل صفة. ثم يمهد بنفي الاستثناء «وَمَا أُحَاشِي» لاستثناء واحد عظيم في البيت التالي، فيكون وقعه أقوى."
  devices:
    - title: "حذف المفعول في «فَاعِلًا»"
      text: "لم يقل: فاعلًا للخير أو للكرم، فترك المفعول ليذهب السامع فيه كل مذهب، وفسّره التِّبْرِيزِيّ بالخير والأَعْلَم بالفعل الكريم. وعبد القاهر الجُرْجانيّ يجعل هذا الحذف أبلغ من الذكر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "النفي المؤكد في «مِنْ أَحَدِ»"
      text: "«من» الزائدة تجعل النفي شاملًا لكل فرد، فلا يبقى في الأقوام واحد مستثنى، حتى يأتي الاستثناء الوحيد بعده."
  connection: "ثم يستثني سُلَيْمان الذي أمره الإله أن يقوم في الناس ويمنعهم من الخطأ."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلَا أَرَى / فَاعِلَنْ / فِنْنَاسِ يُشْ / بِهُهُو = متفعلن / فاعلن / مستفعلن / فعِلن — وَمَا أُحَا / شِي مِنَلْ / أَقْوَامِ مِنْ / أَحَدِي = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى في الشطرين فصارت «متفعلن». والعروض والضرب مخبونان «فعِلن» [@atiq، ص48]."
