first: "يَظَلُّ مِنْ خَوْفِهِ الْمَلَّاحُ مُعْتَصِمًا"
second: "بِالْخَيْزُرَانَةِ بَعْدَ الْأَيْنِ وَالنَّجَدِ"
meaning: "يظل الملّاح، من خوفه من الفُرات في فيضانه، متمسّكًا بسُكّان سفينته، بعد أن أعياه التعب وأخذه العرق والكرب. قال الأَعْلَم: «أي من خوف الفُرات؛ لاضطراب أمواجه، وشدّة هَوْله. والمعتصم: المستمسك. والخَيْزُرانة ها هنا: سُكّان السفينة» [@diwan-nabigha، ص27]. والسُّكّان الخشبة التي في مؤخّر السفينة تُدار بها."
vocabulary:
  - term: "الْمَلَّاحُ"
    text: "صاحب السفينة الذي يسيّرها."
  - term: "مُعْتَصِمًا"
    text: "«المستمسك» [@diwan-nabigha، ص27]."
  - term: "بِالْخَيْزُرَانَةِ"
    text: "سُكّان السفينة، وفيها أقوال: قال التِّبْرِيزِيّ: «والخيزرانة: كل ما ثُنى»، ثم قال: «وقالوا: أراد بالخيزرانة المردى» [@tabrizi-ashr، ص321]، والمِرْدِيّ خشبة يُدفع بها المركب. وقال الأَعْلَم: «وقيل: هي المِرْدِيّ، وهو أيضًا من أعواد المركب. وكل خشبة ناعمة لينة فهي خيزرانة» [@diwan-nabigha، ص27]. وفي اللسان: «والخيزرانة: السكان؛ قال النابغة يصف الفرات وقت مده»، ثم: «أبو عبيد: الخيزران السكان، وهو كوثل السفينة» [@lisan، ج4 ص238]، والكَوْثَل مؤخّرها."
  - term: "الْأَيْنِ"
    text: "«الإعياء» [@tabrizi-ashr، ص321]، وعند الأَعْلَم: «الفترة والإعياء» [@diwan-nabigha، ص27]."
  - term: "النَّجَدِ"
    text: "«العرق من الكرب» [@tabrizi-ashr، ص321]، وعند الأَعْلَم: «العَرَق والكرب، وقد نَجِدَ يَنْجَدُ نَجَدًا» [@diwan-nabigha، ص27]."
context: "ثالث أبيات الفُرات (44–47)، وفيه تُرى قوة النهر في خوف الإنسان منه. وهو البيت السادس والأربعون عند الأَعْلَم. ويقول شَوْقي ضَيْف في هذه الصورة إن الفُرات «ليعصف بكل ما عليه حتى لنرى الملاح معتصما فى مركبه بسكّانها يخشى الغرق» [@deif، ج1 ص288]. ولا يزال خبر «فَمَا الْفُرَاتُ» مؤخّرًا إلى البيت التالي."
syntax:
  - "جملة «يَظَلُّ ... مُعْتَصِمًا» في موضع نصب حال من «الْفُرَاتُ» في البيت 44، والضمير في «خَوْفِهِ» يعود إليه."
  - "«يَظَلُّ» فعل مضارع ناقص من أخوات «كان»، و«الْمَلَّاحُ» اسمه مؤخّر، و«مُعْتَصِمًا» خبره. و«مِنْ خَوْفِهِ» متعلق بـ«مُعْتَصِمًا»، و«مِن» للتعليل، و«خَوْف» مصدر مضاف إلى مفعوله، أي من خوف الملّاحِ الفُراتَ."
  - "«بِالْخَيْزُرَانَةِ» متعلق بـ«مُعْتَصِمًا». و«بَعْدَ» ظرف زمان متعلق به أيضًا، و«الْأَيْنِ» مضاف إليه، و«وَالنَّجَدِ» معطوف عليه."
morphology:
  - "«الْمَلَّاح» على «فَعَّال»، وهو بناء للحِرَف كالنجّار والحدّاد."
  - "«مُعْتَصِم» اسم فاعل من «اعْتَصَمَ» على «افْتَعَلَ»، أي طلب العصمة، وهي الحفظ."
  - "«النَّجَد» مصدر «نَجِدَ يَنْجَدُ» على «فَعِلَ يَفْعَلُ» كما ضبطه الأَعْلَم [@diwan-nabigha، ص27]."
  - "«يَظَلُّ» مضارع «ظَلَّ» المضعّف، وأصله «يَظْلَلُ»، نُقلت فتحة اللام الأولى إلى الظاء وأُدغمت."
rhetoric:
  thesis: "يقيس قوة النهر بخوف أعرف الناس به: الملّاح الذي يعيش عليه. فإذا كان الملّاح نفسه يتمسّك بخشبة سفينته بعد أن أعياه الصراع، فما بال غيره. والصورة تنتقل من الطبيعة إلى الإنسان، فيصير الهول محسوسًا."
  devices:
    - title: "الدلالة على القوة بأثرها"
      text: "لم يقل إن الفُرات عظيم القوة، بل وصف الملّاح خائفًا متشبثًا. فالقوة تُعرف بما تفعله في الناس، وهذا أبلغ من وصفها مباشرة. وهو آخر خطوة في تفصيل الصورة الذي ذكره شَوْقي ضَيْف [@deif، ج1 ص288]."
    - title: "التدرّج في «بَعْدَ الْأَيْنِ وَالنَّجَدِ»"
      text: "الاعتصام بالخيزرانة يأتي بعد التعب والعرق، فالملّاح قاوم أولًا حتى أعيا، ثم لم يبق له إلا أن يتمسك. فالبيت يحكي معركة كاملة في كلمات قليلة: مقاومة، ثم إعياء، ثم تشبّث."
  connection: "ثم يأتي الخبر الذي انتظرته الجملة كلها: ليس الفُرات في هذه الحال بأجود من النُّعْمان، الذي لا يمنع عطاءُ يومه عطاءَ غده."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "يَظَلْلُ مِنْ / خَوْفِهِلْ / مَلْلَاحُ مُعْ / تَصِمَنْ = متفعلن / فاعلن / مستفعلن / فعِلن — بِلْخَيْزُرَا / نَةِ بَعْ / دَلْأَيْنِ وَنْ / نَجَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "بِالْخَيْسَفُوجَةِ مِنْ جَهْدٍ وَمِنْ رَعَدِ"
    status: "رواية أبي عُبَيْدة"
    note: "قال التِّبْرِيزِيّ: «وروى أبو عبيدة (بالخيسفوجة من جهد ومن رعد)»، و«(الخيسفوجة) قيل: هو السكان» [@tabrizi-ashr، ص321]. فالمعنى قريب، والفرق في اسم السكّان، وفي آخر العجز: «مِنْ جَهْدٍ» في موضع «بَعْدَ الْأَيْنِ»."
  - reading: "يَظَلُّ مِنْ خَوْفِهِ الْمَلَّاحُ مُعْتَصِمًا / بِالْخَيْزُرَانَةِ بَعْدَ الْأَيْنِ وَالنَّجَدِ"
    status: "رواية الأَعْلَم، وهو البيت 46 عنده"
    note: "بلفظ نصّنا [@diwan-nabigha، ص27]، وكذلك عند شَوْقي ضَيْف [@deif، ج1 ص287]. وفي نسخة الشاملة للتِّبْرِيزِيّ «المَلاَحُ» بلا تشديد و«بالخَيْزُارَنَةِ»، وهما خطآن في الطبع."
