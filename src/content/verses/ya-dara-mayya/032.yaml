first: "أَعْطَى لِفَارِهَةٍ حُلْوٍ تَوَابِعُهَا"
second: "مِنَ الْمَوَاهِبِ لَا تُعْطَى عَلَى نَكَدِ"
meaning: "لا أرى في الناس أحدًا أكثر منه عطاءً للناقة الكريمة، تتبعها مواهب سهلة لا مطل فيها ولا مِنّة، فهو لا يعطي عطاءً نَكِدًا يضيق به. فالبيت متصل بالبيت 21، قال التِّبْرِيزِيّ: «أي لا أرى فاعلا في الناس يشبهه أعطى لفارهة» [@tabrizi-ashr، ص318]، وقال الأَعْلَم: «قوله: «أعطى لفارهة» مردود على قوله: «ولا أرى فاعلا أعطى لفارهة منه»» [@diwan-nabigha، ص22]. ففي «أَعْطَى» معنى التفضيل: أكثر عطاءً منه، لا الفعل الماضي."
vocabulary:
  - term: "أَعْطَى"
    text: "أكثر عطاءً، اسم تفضيل (انظر الصرف)."
  - term: "فَارِهَةٍ"
    text: "قال الأَعْلَم: «والفارهة: الناقة الكريمة، أو العطية الحسنة» [@diwan-nabigha، ص22]. وفي اللسان قول آخر: «قال ابن سيده: إنما يعني بالفارهة القينة وما يتبعها من المواهب» [@lisan، ج13 ص521]، والقَيْنة الجارية المغنّية."
  - term: "تَوَابِعُهَا"
    text: "«ما تبعها من المطايا» [@diwan-nabigha، ص22]، أي ما يعطيه معها."
  - term: "حُلْوٍ"
    text: "سهلة طيبة، قال الأَعْلَم: «أي مُتيسِّرة هيِّنة» [@diwan-nabigha، ص22]."
  - term: "نَكَدِ"
    text: "«الضِّيق والعُسر» [@diwan-nabigha، ص22]. وفي اللسان: «والنُّكْدُ والنَّكْد: قِلْةُ العَطاء وأَن لَا يَهْنَأَه مَن يُعْطاه» [@lisan، ج3 ص427]."
context: "أول أبيات العطايا (32–36) عند التِّبْرِيزِيّ، وفيها يعدّد ما يهبه النُّعْمان: الناقة الكريمة، والمئة من الإبل، والجواري، والخيل، والنوق المذللة برحالها. وهو يعود بالكلام إلى البيت 21 «وَلَا أَرَى فَاعِلًا فِي النَّاسِ يُشْبِهُهُ»، فكل ما بينهما، من حديث سُلَيْمان (22–26) وحديث فتاة الحي (27–31)، اعتراض طويل يرجع بعده إلى الجملة الأولى. وهذا البيت هو السابع والعشرون عند الأَعْلَم، فأبيات العطايا عنده تلي أبيات سُلَيْمان مباشرة، وأبيات الفتاة بعدها. ويلخّص شَوْقي ضَيْف هذا الموضع بقوله إن النابِغة حين انتهت به ناقته إلى النُّعْمان «أخذ يمدحه بكرمه الفياض وما وهبه من قطعان الإبل والخيل ومن الجوارى المنعّمات» [@deif، ج1 ص286]."
syntax:
  - "«أَعْطَى» اسم تفضيل نعت لـ«فَاعِلًا» في البيت 21، والمفضَّل عليه محذوف، أي أعطى منه، كما قدّره الأَعْلَم [@diwan-nabigha، ص22]. ولم يُنوَّن لأنه على وزن «أَفْعَل» صفةً، فهو ممنوع من الصرف."
  - "«لِفَارِهَةٍ» اللام فيه لتقوية العامل، لأن اسم التفضيل لا ينصب المفعول به بنفسه، فوصل إليه باللام. و«فَارِهَةٍ» صفة لموصوف محذوف، أي ناقة فارهة."
  - "«حُلْوٍ تَوَابِعُهَا» «حُلْوٍ» نعت لـ«فَارِهَةٍ» مجرور، و«تَوَابِعُهَا» فاعل له مرفوع، وهو نعت سببي، أي فارهة حَلَت توابعها. ويروى بالرفع، قال التِّبْرِيزِيّ: «ويروى (حلوٌ توابعها) على الابتداء والخبر، والمبتدأ والخبر في موضع جر» [@tabrizi-ashr، ص318]، أي «تَوَابِعُهَا» مبتدأ مؤخر و«حُلْوٌ» خبره المقدم، والجملة نعت لـ«فَارِهَةٍ»."
  - "«مِنَ الْمَوَاهِبِ» جار ومجرور متعلق بمحذوف حال من «تَوَابِعُهَا» أو بيان لها. وجملة «لَا تُعْطَى عَلَى نَكَدِ» نعت ثان لـ«فَارِهَةٍ»: «لا» نافية، و«تُعْطَى» مضارع مبني للمجهول، ونائب الفاعل ضمير الفارهة، و«عَلَى نَكَدِ» متعلق بمحذوف حال."
morphology:
  - "«أَعْطَى» اسم تفضيل على «أَفْعَل» مأخوذ من «أَعْطَى» الرباعي، والقياس أن يُبنى التفضيل من الثلاثي، فهو من الشاذ. وفي اللسان، فيما نقله عن «المُحْكَم» في «أَجْوَب» بمعنى أسرع إجابة: «وهو عندي من باب أعطى لفارهة»، ثم: «وما زاد على الفعل الثلاثي لا يبنى منه أفعل من كذا، إلا في أحرف جاءت شاذة» [@lisan، ج1 ص284]."
  - "«فَارِهَة» اسم فاعل مؤنث من «فَرُهَ» إذا حَسُن وجاد."
  - "«تَوَابِع» جمع «تابِعة» على «فَوَاعِل»، و«مَوَاهِب» جمع «مَوْهِبة» على «مَفَاعِل»."
  - "«تُعْطَى» مضارع «أُعْطِيَ» المبني للمجهول، وألفه منقلبة عن ياء."
rhetoric:
  thesis: "يبدأ تعداد العطايا بأكرمها: الناقة الفارهة. ثم لا يكتفي بكثرة العطاء حتى يصف طريقته: سهل لا يتبعه مطل ولا مِنّة، ولا يُعطى بضيق نفس. فالكرم عنده في الكمية والطريقة معًا."
  devices:
    - title: "الاعتراض الطويل والرجوع إلى البيت 21"
      text: "الاعتراض أن يُدخل المتكلم في أثناء كلامه كلامًا آخر ثم يعود إلى الأول. فـ«أَعْطَى» وصف لـ«فَاعِلًا» في البيت 21، وقد فصلت بينهما عشرة أبيات عند التِّبْرِيزِيّ، وخمسة عند الأَعْلَم. فالسامع يُستدعى إلى الجملة التي بدأ بها المدح، فيكتمل نفي الشبيه بتعداد العطايا."
    - title: "حذف المفضَّل عليه في «أَعْطَى لِفَارِهَةٍ»"
      text: "لم يقل: أعطى منه، لأن المقام يدل عليه، فالذي يُفضَّل عليه هو كل فاعل في الناس. وعبد القاهر الجُرْجانيّ يجعل مثل هذا الحذف أبلغ من الذكر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "الاحتراس في «لَا تُعْطَى عَلَى نَكَدِ»"
      text: "الاحتراس أن يُؤتى في الكلام بما يدفع عنه وهمًا. فبعد أن ذكر كثرة العطاء دفع أن يكون عطاءً تتبعه منّة أو ضيق، وعلى هذا فسّر الأَعْلَم «حُلْوٍ تَوَابِعُهَا»: هي متيسرة هيّنة، لا مطل فيها ولا امتنان."
  connection: "ثم يذكر أكبر عطاياه من الإبل: المئة الأبكار السمان."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَعْطَى لِفَا / رِهَتِنْ / حُلْوِنْ تَوَا / بِعُهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — مِنَلْ مَوَا / هِبِ لَا / تُعْطَى عَلَى / نَكَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان «فعِلن» [@atiq، ص48]."
