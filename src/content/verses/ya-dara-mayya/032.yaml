    note: "قال التِّبْرِيزِيّ: «ويروى (على حسد)» [@tabrizi-ashr، ص318]، وفسّرها الأَعْلَم: «أي لا تعطى ونفسك تتبع العَطِيّةَ وترغب فيها» [@diwan-nabigha، ص22]، أي لا يعطي وهو يحسد من يعطيه. ويقول محقق الديوان: «ابن السكيت: لا تعطى على حسد» [@diwan-nabigha، ص235]. وبها ينشده صاحب اللسان [@lisan، ج13 ص521]."
