first: "فَبَثَّهُنَّ عَلَيْهِ وَاسْتَمَرَّ بِهِ"
second: "صُمْعُ الْكُعُوبِ بَرِيئَاتٌ مِنَ الْحَرَدِ"
meaning: "فأرسل الصائد كلابه على الثور مفرّقة، ومضت بالثور قوائم لطيفة المفاصل سليمة من كل عيب. قال التِّبْرِيزِيّ: «بثهن: فرقهن... واستمر به: أي استمرت به قوائمه» [@tabrizi-ashr، ص312–313]، وقال الأَعْلَم: «أي بث الصائد الكلاب على الثور... أي نهض بالثور قوائم صمع الكعوب، أي لسن برهلات المفاصل» [@diwan-nabigha، ص18]."
vocabulary:
  - term: "بَثَّهُنَّ"
    text: "«فرقهن» [@tabrizi-ashr، ص312]، أي أطلق الكلاب من جهات مختلفة."
  - term: "اسْتَمَرَّ بِهِ"
    text: "مضت به ونفذت. «أي استمرت به قوائمه» [@tabrizi-ashr، ص312–313]."
  - term: "صُمْعُ الْكُعُوبِ"
    text: "«والصُّمع: الضوامر، الواحدة صمعاء» [@tabrizi-ashr، ص312]. وفي اللسان: «والصمع في الكعوب: لطافتها واستواؤها» [@lisan، ج8 ص207]."
  - term: "الْكُعُوبِ"
    text: "«جمع كعب وهو المفصل من العظام، وكل مفصل من العظام كعب عند العرب» [@tabrizi-ashr، ص313]."
  - term: "الْحَرَدِ"
    text: "«وأصل الحرد استرخاء عصب في يد البعير من شدة العقال، وربما كان خلقة، وإذا كان به نفض يديه وضرب بهما الأرض ضربا شديدا» [@tabrizi-ashr، ص313]."
context: "يبدأ الصيد: الكلاب تنطلق، والثور يعدو. وفي البيت التالي يلتقي أول الكلاب بالثور."
syntax:
  - "«فَبَثَّهُنَّ» الفاء عاطفة، والفاعل ضمير الكلّاب المذكور في البيت السابق، و«هُنَّ» مفعول به يعود إلى الكلاب، ولم تُذكر صراحة بل فُهمت من «كَلَّابٍ». و«عَلَيْهِ» متعلق به، والهاء للثور."
  - "«وَاسْتَمَرَّ بِهِ صُمْعُ الْكُعُوبِ»: «صُمْعُ» فاعل «استمرّ»، وهو صفة لموصوف محذوف تقديره: قوائم، كما قدّره التِّبْرِيزِيّ والأَعْلَم. و«الْكُعُوبِ» مضاف إليه، و«بَرِيئَاتٌ» صفة ثانية، و«مِنَ الْحَرَدِ» متعلق بها."
morphology:
  - "«صُمْع» جمع «صَمْعاء» على «فُعْل»، كحُمْر جمع حمراء."
  - "«بَرِيئَات» جمع «بريئة» على «فَعِيلة» جمع مؤنث سالمًا."
  - "«اسْتَمَرَّ» على «استفعل» من المرور، والسين والتاء فيه للمبالغة في المضيّ."
rhetoric:
  thesis: "بيت سريع الحركة: الصائد يرسل، والثور ينطلق. والبطل في العجز ليس الثور كله، بل قوائمه: لطيفة، مستوية، سليمة."
  devices:
    - title: "الحذف"
      text: "حذف في «فَبَثَّهُنَّ» ذكر الكلاب وأضمرها، وحذف في «صُمْعُ الْكُعُوبِ» الموصوف «قوائم». والسامع يقدّرهما من السياق. وهذا عند عبد القاهر الجُرْجانيّ من مواضع البلاغة: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]، فيمضي الكلام سريعًا كسرعة الصيد نفسه."
    - title: "استعارة «الْحَرَدِ»"
      text: "الحرد داء في يد البعير، فنقله إلى الثور، قال الأَعْلَم: «فاستعاره للثور، أي ليس بقوائمه عيب، ولم يرد الحرد بعينه» [@diwan-nabigha، ص18]. وهذا ما يسميه عبد القاهر الجُرْجانيّ الاستعارة غير المفيدة، وهي نقل اسم وُضع لجنس من الحيوان إلى جنس آخر: «فإذا استعمل الشاعر شيئاً منها في غير الجنس الذي وُضِع له، فقد استعاره منه ونقله عن أصله وجَازَ به موضعَه» [@asrar، ص30]."
  connection: "ثم يتقدم الكلب ضُمْران، فيلقى طعنة الثور."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَبَثْثَهُنْ / نَ عَلَيْ / هِ وَسْتَمَرْ / رَ بِهِي = متفعلن / فعِلن / متفعلن / فعِلن — صُمْعُلْكُعُو / بِ بَرِي / ئَاتُنْ مِنَلْ / حَرَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى والثالثة من الصدر فصارتا «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]."
