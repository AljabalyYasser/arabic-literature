    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«ويروى (إذ قال المليك له)» [@tabrizi-ashr، ص315]."
  - reading: "قُمْ فِي الْبَرِيَّةِ فَازْجُرْهَا عَلَى الْفَنَدِ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«ويروى (فازجرها على الفند)» [@tabrizi-ashr، ص315]. وفي نسخة الشاملة «عَنْ الفَنَدِ» بسكون النون، والصواب كسرها لالتقاء الساكنين."
