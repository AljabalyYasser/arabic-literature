first: "إِلَّا سُلَيْمَانَ إِذْ قَالَ الْإِلَٰهُ لَهُ"
second: "قُمْ فِي الْبَرِيَّةِ فَاحْدُدْهَا عَنِ الْفَنَدِ"
meaning: "لا يشبه النُّعْمانَ أحد إلا سُلَيْمان، حين قال له الإله: قم في الخلق فامنعهم من الخطأ. قال الأَعْلَم: «استثناء من القوم المنفيّ عنهم شَبَهُ النعمان»، و«احدُدْها»: «أي امنعها»، و«قم في البريّة»: «أي انظر في مصالحها واجتهد في إرشادها» [@diwan-nabigha، ص20–21]. فالشبه بين الرجلين في الملك والقيام على الناس بالحكم."
vocabulary:
  - term: "سُلَيْمَانَ"
    text: "سُلَيْمان بن داوُد عليهما السلام، وإنما خصّه من الأنبياء، كما يقول البَغْداديّ، «لأنه كان له الملك مع النبوة» [@khizana، ج3 ص405]."
  - term: "الْبَرِيَّةِ"
    text: "الخلق."
  - term: "فَاحْدُدْهَا"
    text: "فامنعها. قال التِّبْرِيزِيّ: «والحد: المنع» [@tabrizi-ashr، ص315]، ومنه قيل للسجّان حدّاد لأنه يمنع [@khizana، ج3 ص405]."
  - term: "الْفَنَدِ"
    text: "«الخطأ» [@tabrizi-ashr، ص315]، وفي اللسان: «والفَنَدُ: الخطأُ في الرأي والقول» [@lisan، ج3 ص338]. وقال الأَعْلَم: «الخطأ في القول والفعل وغير ذلك؛ مما يُفنَّد صاحبه عليه ويُلام» [@diwan-nabigha، ص21]."
context: "الاستثناء الوحيد من نفي البيت السابق، وبه تبدأ أبيات سُلَيْمان والجن (22–26)، وهي ما يرى شَوْقي ضَيْف، تبعًا لطه حسين، أنه «أقحم» على القصيدة، لأن الشاعر يتحدث عن سُلَيْمان «كأنه من أهل الكتب السماويه وقد كان وثنيّا على مذهب قومه» [@deif، ج1 ص279]. أما القدماء فرووها للنابِغة، وفهمها البَغْداديّ على أن النابِغة جعل الملك المقرون بالنبوة غاية التشبيه: «يريد: لا يشبهه أحد ممن أوتي الملك إلا سليمان النبي» [@khizana، ج3 ص405]."
syntax:
  - "«إِلَّا سُلَيْمَانَ» قال التِّبْرِيزِيّ: «(إلا سليمان) في موضع نصب على البدل من موضع أحد، وإن شئت على الاستثناء» [@tabrizi-ashr، ص315]. و«أحد» في البيت السابق مجرور لفظًا بـ«من» الزائدة منصوب محلًّا، فأُبدل منه على محله."
  - "«إِذْ» ظرف لما مضى، والبَغْداديّ يجعلها للتعليل [@khizana، ج3 ص405]. و«قَالَ الْإِلَٰهُ لَهُ» جملة في محل جر بالإضافة إليها."
  - "«قُمْ فِي الْبَرِيَّةِ فَاحْدُدْهَا عَنِ الْفَنَدِ» مقول القول: «قُمْ» فعل أمر، و«فَاحْدُدْهَا» معطوف عليه بالفاء، والضمير مفعول به يعود إلى البرية، و«عَنِ الْفَنَدِ» متعلق به."
morphology:
  - "«احْدُدْ» أمر من «حَدَّ يَحُدُّ»، فُكّ فيه التضعيف لأن الدال الثانية ساكنة، وهي لغة أهل الحجاز، ولو أدغم لقال: «حُدَّها»."
  - "«الْبَرِيَّة» على «فَعِيلة» من «بَرَأ اللهُ الخلقَ»، تُركت همزتها في الاستعمال."
  - "«الْإِلَٰه» على «فِعَال» بمعنى مفعول، أي المعبود."
rhetoric:
  thesis: "يرفع الممدوح إلى درجة لا يشاركه فيها إلا ملك نبي، ثم يمضي في وصف سُلَيْمان وسلطانه، فكل ما يُقال عن سُلَيْمان في الأبيات التالية يعود مدحًا على النُّعْمان."
  devices:
    - title: "الاستثناء بعد النفي العام"
      text: "نفى في البيت السابق كل شبيه بـ«مِنْ أَحَدِ»، ثم استثنى في «إِلَّا سُلَيْمَانَ» واحدًا، فصار الاستثناء أعظم مدح: ليس للنعمان نظير إلا ملك نبي."
    - title: "الحوار المنقول في «قَالَ الْإِلَٰهُ لَهُ»"
      text: "ينقل خطاب الإله لسُلَيْمان بصيغة الأمر «قُمْ... فَاحْدُدْهَا»، فيصير الملك تكليفًا بالحكم والإصلاح، وهو ما يريد أن يراه في النُّعْمان. قال ابن الأَعْرابيّ: «زعم النابغة أن الله تبارك وتعالى قال هذا لسليمان» [@diwan-nabigha، ص21]."
  connection: "ثم يتمّ الخطاب: وذلّل الجن يبنون تَدْمُر."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِلْلَا سُلَيْ / مَانَ إِذْ / قَالَلْ إِلَا / هُ لَهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — قُمْ فِلْبَرِيْ / يَةِ فَحْ / دُدْهَا عَنِلْ / فَنَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان «فعِلن» [@atiq، ص48]. وتُشبَع ضمة الهاء في «لَهُ»."
variants:
