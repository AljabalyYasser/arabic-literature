first: "الْوَاهِبُ الْمِائَةَ الْأَبْكَارَ زَيَّنَهَا"
second: "سَعْدَانُ تُوضِحَ فِي أَوْبَارِهَا اللِّبَدِ"
meaning: "هو الذي يهب المئة من الإبل الفتيّة، سمّنها نبت السَّعْدان في مراعي تُوضِح وحسّن منظرها، فتلبّد وبرها لأنها مرسلة في المرعى لا تُركب. قال الأَعْلَم: «يعني أنه يهب المائة من الإبل»، وقال في آخر البيت: «يريد أنها إبل سائمة مُهمَلة في المرعى، لا تُستعمَل ظهورها؛ فأوبارها مُتلبِّدة لذلك» [@diwan-nabigha، ص22]. والسائمة الراعية."
vocabulary:
  - term: "الْأَبْكَارَ"
    text: "جمع بِكْر، وفي اللسان: «والبِكْرُ: النَّاقَةُ الَّتِي وَلَدَتْ بَطْنًا وَاحِدًا، وَالْجَمْعُ أَبْكارٌ»، و«والبِكْرُ: الفَتِيُّ مِنَ الإِبل» [@lisan، ج4 ص79]، فهي إبل شابّة في أول قوتها."
  - term: "سَعْدَانُ"
    text: "قال التِّبْرِيزِيّ: «والسَّعدان: نبت تسمن عليه الإبل وتغزر ألبانها ويطيب لحمها» [@tabrizi-ashr، ص318]. وقال الأَعْلَم: «نبت من أنجع ما ترعاه الإبل، ومنه قيل: «مرعًى ولا كالسعدان»» [@diwan-nabigha، ص22]، وهو مثل يقال في الشيء الحسن يفضله غيره، وفي اللسان أن المراد به «أن السعدان من أفضل مراعيهم» [@lisan، ج3 ص216]."
  - term: "تُوضِحَ"
    text: "«اسم موضع» [@tabrizi-ashr، ص318]، وعند الأَعْلَم: «موضع بالحمى، وكانت إبل الملوك ترعاه؛ فلذلك ذكره» [@diwan-nabigha، ص22]."
  - term: "أَوْبَارِهَا"
    text: "جمع وَبَر، وهو شعر الإبل."
  - term: "اللِّبَدِ"
    text: "قال التِّبْرِيزِيّ: «واللبد: ما تلبَّد من الوبر، الواحدة لبدة» [@tabrizi-ashr، ص318]، أي ما تداخل منه والتصق بعضه ببعض."
context: "ثاني أبيات العطايا (32–36): بعد الناقة الواحدة الكريمة يذكر المئة. وهو البيت الثامن والعشرون عند الأَعْلَم. والمئة من الإبل عطية الملوك، وفي خبر يرويه ابن قُتَيْبة عن ابن الكَلْبيّ عن حَسّان بن ثابِت أن النُّعْمان أعطى النابِغة على قصيدة أنشده إياها «مائة ناقة من الإبل السود، فيها رعاؤها» [@ibn-qutayba، ج1 ص163]، وهو خبر أدبي يتفق رواته على جوهره، والقصيدة فيه غير هذه. ويبدأ البيت بـ«الْوَاهِبُ» مرفوعًا، فهو خبر لمبتدأ محذوف، أي هو الواهب، و«الْمِائَةَ» مفعوله، وعليها تُعطف أوائل الأبيات الثلاثة التالية: «وَالسَّاحِبَاتِ»، «وَالْخَيْلَ»، «وَالْأُدْمَ»، فكلها مما يهبه."
syntax:
  - "«الْوَاهِبُ» خبر لمبتدأ محذوف تقديره «هو»، يعود إلى النُّعْمان."
  - "«الْمِائَةَ» مفعول به لاسم الفاعل «الْوَاهِبُ»، وعمل لأنه مقترن بـ«أل». و«الْأَبْكَارَ» نعت لها منصوب. وفي اللسان أن ابن بَرِّيّ استدل بنصبها على نصب «الْخَيْلَ» في البيت 35: «صواب إنشاده: والخيلَ، بالنصب، لأنه معطوف على المائة من قوله» ثم أنشد هذا البيت [@lisan، ج1 ص640]."
  - "«زَيَّنَهَا سَعْدَانُ تُوضِحَ» جملة في موضع نصب حال من «الْمِائَةَ»: «زَيَّنَ» فعل ماض، والهاء مفعول به، و«سَعْدَانُ» فاعل، و«تُوضِحَ» مضاف إليه مجرور بالفتحة لأنه ممنوع من الصرف للعلمية ووزن الفعل."
  - "«فِي أَوْبَارِهَا» جار ومجرور متعلق بـ«زَيَّنَهَا»، و«اللِّبَدِ» نعت لـ«أَوْبَارِهَا» مجرور على حذف مضاف، كما قدّره الأَعْلَم: «التقدير يريد أوبارها ذات اللِّبَد» [@diwan-nabigha، ص22]."
morphology:
  - "«الْوَاهِب» اسم فاعل من «وَهَبَ» على «فاعِل»."
  - "«الْأَبْكَار» جمع «بِكْر» على «أَفْعال»."
  - "«تُوضِح» اسم موضع على وزن المضارع «تُفْعِل» من «أَوْضَحَ»، ولذلك مُنع من الصرف."
  - "«اللِّبَد» جمع «لِبْدة» على «فِعَل»، كما قال الأَعْلَم: «واللِّبد: جمع لِبْدَة» [@diwan-nabigha، ص22]."
  - "«سَعْدَان» على «فَعْلان»، والألف والنون فيه زائدتان."
rhetoric:
  thesis: "ينتقل من الواحدة إلى المئة، ثم لا يذكر عددًا مجردًا بل يرسم الإبل نفسها: فتيّة سمينة، ترعى أنجع النبت في حمى الملوك، ووبرها متلبد من الراحة. فالعطية تُرى قبل أن تُعدّ، وقيمتها في صفتها لا في عددها وحده."
  devices:
    - title: "الإسناد المجازي في «زَيَّنَهَا سَعْدَانُ تُوضِحَ»"
      text: "النبت لا يزيّن حقيقة، وإنما تسمن الإبل حين ترعاه فتحسن. فأسند الفعل إلى سببه. ويسمي عبد القاهر الجُرْجانيّ هذا المجاز الحُكْمي، ويقول إنه «أن يكونَ التجوُّزُ في حُكْم يَجْري على الكلمة فقط، وتكونَ الكلمةُ متروكةً على ظاهرِها» [@dalail، ص293]، ويمثّل بقول الفَرَزْدَق «سقتها خروق»، فالتجوّز عنده ليس في الفعل نفسه «ولكنْ في أن أسْنَدَها إِلى الخُروق» [@dalail، ص294]. وكذلك «زَيَّنَهَا» هنا على حقيقته، والمجاز في إسناده إلى السعدان."
    - title: "الكناية في «فِي أَوْبَارِهَا اللِّبَدِ»"
      text: "الكناية أن يريد المتكلم معنى فلا يذكره بلفظه بل بما يلزمه. فتلبّد الوبر يدل على أن الإبل لم تُركب ولم تُحمَّل، أي هي مرفّهة مصونة، وهذا ما استخرجه الأَعْلَم من اللفظ [@diwan-nabigha، ص22]. فهي إبل الملوك، يهبها الملك وهي في أحسن حالها."
  connection: "ثم يذكر من عطاياه الجواري المنعّمات يسحبن ذيول ثيابهن."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "اَلْوَاهِبُلْ / مِئَةَلْ / أَبْكَارَ زَيْ / يَنَهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — سَعْدَانُ تُو / ضِحَ فِي / أَوْبَارِهَلْ / لِبَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، وسائر الحشو تام. والعروض والضرب مخبونان [@atiq، ص48]. و«الْمِائَةَ» تُكتب بألف لا تُنطق، وتُقرأ «مِئَة»."
variants:
  - reading: "الْوَاهِبُ الْمِائَةِ الْأَبْكَارِ"
    status: "وجه في الإعراب تدل عليه نسخة الشاملة للتِّبْرِيزِيّ"
    note: "فيها «المِائَةَِ الأبْكَارَِ» بفتحة وكسرة معًا، أي الوجهان: النصب على المفعولية، والجر على إضافة اسم الفاعل إلى ما بعده. وأثبتنا النصب لأنه رواية الأَعْلَم في البيت وفي شرحه [@diwan-nabigha، ص22–23]، ولأن ابن بَرِّيّ بنى عليه نصب «الْخَيْلَ» [@lisan، ج1 ص640]."
  - reading: "الْوَاهِبُ الْمِائَةَ الْمِعْكَاءَ زَيَّنَهَا"
    status: "رواية الأَعْلَم، وهو البيت 28 عنده"
    note: "قال: «والمعكاء: الغلاظ السِّمان الشِّداد، وهو اسم لا يُثنَّى ولا يُجمع» [@diwan-nabigha، ص22]. وفي اللسان عن ابن السِّكِّيت: «المِعْكَاءُ، عَلَى مِفْعالٍ، الإِبلُ الْمُجْتَمِعَةُ» [@lisan، ج15 ص82]."
  - reading: "الْوَاهِبُ الْمِائَةَ الْجُرْجُورَ زَيَّنَهَا"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«ويروى (المائة الجرجور) والجرجور: الضخام، ويكون للواحد والجمع على لفظ واحد» [@tabrizi-ashr، ص318]."
  - reading: "يُوضِحُ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "بالياء في موضع «تُوضِحَ»: «ومن روى (يوضح) بالياء فإنه يذهب إلى أن معناه يبين، وهو فعل» [@tabrizi-ashr، ص318]، أي يظهر أثر السعدان في أوبارها. وبها فسّره ابن السِّكِّيت في اللسان: «ويُوضِحُ: يُبَيِّنُ فِي أَوْبارِها إِذَا رُعِيَ» [@lisan، ج15 ص82]."
  - reading: "فِي الْأَوْبَارِ ذِي اللِّبَدِ"
    status: "رواية ذكرها التِّبْرِيزِيّ"
    note: "«ويروى (في الأوبار ذي اللبد)» [@tabrizi-ashr، ص318]، وفيها «ذي» التي قدّرها الأَعْلَم في روايتنا."
