first: "وَالْمُؤْمِنِ الْعَائِذَاتِ الطَّيْرَ يَمْسَحُهَا"
second: "رُكْبَانُ مَكَّةَ بَيْنَ الْغَيْلِ وَالسَّعَدِ"
meaning: "وحقِّ الله الذي آمن الطير اللاجئة إلى الحرم، فلا تُصاد ولا تُنفَّر، يمرّ بها ركبان مكة بين الغَيْل والسَّعَد فلا يهيجونها. قال الأَعْلَم: «يعني الله تبارك وتعالى أَمَّنها أن تُهاج أو تُصاد في الحَرَم»، وقال في «يَمْسَحُهَا»: «أي يمرّون عليها، لا يهيجها أحد ولا ينفّرها» [@diwan-nabigha، ص25]. وقال التِّبْرِيزِيّ: «العائذات: ما عاذ بالبيت من الطير» [@tabrizi-ashr، ص319]."
vocabulary:
  - term: "الْمُؤْمِنِ"
    text: "الذي يعطي الأمان، والمراد الله. ونقل البَغْداديّ عن أبي عليّ الفارِسيّ: «والمؤمن هو الله سبحانه وهو اسم فاعل من آمن» [@khizana، ج5 ص72]."
  - term: "الْعَائِذَاتِ"
    text: "اللاجئات المستجيرات. قال البَغْداديّ: «قال ثعلب: أراد بالعائذات الحمام لما عاذت بمكة والتجأت إليها حرم قتلها وآمنها من أن تضام» [@khizana، ج5 ص73]."
  - term: "يَمْسَحُهَا"
    text: "يمرّون بها ويقربون منها، فلا تفرّ لأنها آمنة [@diwan-nabigha، ص25]."
  - term: "رُكْبَانُ مَكَّةَ"
    text: "الراكبون القاصدون إلى مكة."
  - term: "الْغَيْلِ"
    text: "عند الأَصْمَعِيّ: الماء، قال التِّبْرِيزِيّ: «والغَيْل بفتح الغين: الماء، وإنما يعني النابغة ما كان يخرج من أبي قُبيس» [@tabrizi-ashr، ص319]، وأبو قُبَيْس جبل مكة. وعند الأَعْلَم: «الشَّجر الملتفّ» [@diwan-nabigha، ص25]."
  - term: "السَّعَدِ"
    text: "موضع، وهو عند أبي عُبَيْدة مع الغِيل «أجمتان كانتا بين مكة ومنى» [@tabrizi-ashr، ص319]، والأَجَمة الشجر الكثيف الملتفّ. وعند الأَعْلَم: «و«الغَيْل»: الشَّجر الملتفّ، وكذلك «السَّعَد»» [@diwan-nabigha، ص25]."
context: "ثاني أبيات القسم: يتمّ به المقسَم به، فيحلف بالبيت وبالدماء ثم بربّ الحرم. وهو البيت الثامن والثلاثون عند الأَعْلَم أيضًا، وينشده ابن رَشِيق بعد البيت السابق في أبيات الاعتذار [@ibn-rashiq، ج2 ص177]. ويقول البَغْداديّ عند هذا البيت إن القصيدة «أحسن شعره ولهذا ألحقوها بالقصائد المعلقات» [@khizana، ج5 ص72]. وفي قافيته تصحيح اعتمدناه في نص القصيدة: ففي نسخة الشاملة للتِّبْرِيزِيّ «بين الغيل والسند»، وشرحه نفسه يدور على «السَّعَد»، وهي كذلك عند الأَعْلَم، و«السَّنَد» قافية البيت الأول. وتكرار كلمة القافية بلفظها ومعناها في قصيدة واحدة يسمى الإِيطاء، وهو من عيوب القافية عند ابن رَشِيق [@ibn-rashiq، ج1 ص164]."
syntax:
  - "«وَالْمُؤْمِنِ» معطوف على «الَّذِي» في البيت السابق، مجرور، قال البَغْداديّ: «وما معطوف على الذي وكذا قوله والمؤمن»، ثم قال: «وزعم من لم يطلع على البيت الأول أن الواو واو القسم» [@khizana، ج5 ص73]، أي أن من قرأ هذا البيت وحده ظن الواو حرف قسم، وهي عاطفة."
  - "«الْعَائِذَاتِ» مفعول به لاسم الفاعل «الْمُؤْمِنِ» منصوب بالكسرة، أو مجرور بإضافة «الْمُؤْمِنِ» إليه. و«الطَّيْرَ» بدل منه، قال الأَعْلَم: «ونصب «الطَّيرَ» على البدل من العائذات؛ لأنها مفعولة بالمؤمن» [@diwan-nabigha، ص25]. ويشرح البَغْداديّ أصل التركيب: «على أن العائذات كان في الأصل نعتاً لطير فلما تقدم وكان صالحا لمباشرة العامل أعرب بمقتضى العامل وصار المنعوت بدلا منه فالطير بدل من العائذات وهو منصوب إن كان العائذات منصوبا بالكسرة على أنه مفعول به للمؤمن ومجرور إن كان العائذات مجرورا بإضافة المؤمن إليه» [@khizana، ج5 ص71]، فأصل الكلام: والمؤمنِ الطيرَ العائذاتِ."
  - "«يَمْسَحُهَا رُكْبَانُ مَكَّةَ» قال البَغْداديّ: «وجملة: يمسحها ركبان مكة حال من الطير» [@khizana، ج5 ص74]. و«رُكْبَانُ» فاعل، و«مَكَّةَ» مضاف إليه مجرور بالفتحة لأنه ممنوع من الصرف. و«بَيْنَ» ظرف مكان متعلق بـ«يَمْسَحُهَا»، و«الْغَيْلِ» مضاف إليه، و«السَّعَدِ» معطوف عليه."
morphology:
  - "«الْمُؤْمِن» اسم فاعل من «آمَنَ» على «مُفْعِل»، أي أعطى الأمان، وليس من الإيمان بمعنى التصديق."
  - "«الْعَائِذَات» جمع «عائِذة»، اسم فاعل من «عاذَ يَعُوذُ» الأجوف، قُلبت عينه همزة في اسم الفاعل."
  - "«الطَّيْر» قال البَغْداديّ: «جمع طائر مثل صحب وصاحب وقد يقع على الطير الواحد وجمعه طيور وأطيار» [@khizana، ج5 ص74]."
  - "«رُكْبَان» على «فُعْلان»، جمع للراكبين."
rhetoric:
  thesis: "يختم المقسَم به بأعظمه: ربّ الحرم الذي آمن حتى الطير. وفي اختيار الطير «الْعَائِذَاتِ» لطف: فالنابِغة نفسه عائذ بالنُّعْمان يطلب الأمان، والصورة التي يحلف بها صورة أمانٍ يُعطى لمن لجأ. وهذه قراءتنا للبيت."
  devices:
    - title: "الكناية عن الموصوف في «الْمُؤْمِنِ الْعَائِذَاتِ»"
      text: "لم يذكر اسم الله، بل دلّ عليه بفعل من أفعاله يعرفه السامعون: تأمين الطير في الحرم. وبهذا فسّره الأَعْلَم [@diwan-nabigha، ص25] والبَغْداديّ [@khizana، ج5 ص72]. فالقسم يقع بصفة الأمان نفسها، وهي ما يطلبه الحالف."
    - title: "تقديم الصفة على الموصوف في «الْعَائِذَاتِ الطَّيْرَ»"
      text: "قدّم الصفة فصارت هي المفعول، وصار الموصوف بدلًا منها كما بيّن البَغْداديّ. فأول ما يسمعه السامع معنى اللجوء، ثم يعرف بعده من اللاجئ. ويجعل عبد القاهر الجُرْجانيّ من التقديم نوعًا يغيّر حكم الكلمة: «ولكنْ على أنْ تَنقُلَ الشيءَ عن حُكْمٍ إِلى حكمٍ»، فيكون لها «إِعراباً غيرَ إِعرابهِ» [@dalail، ص106]، ويقول في باب التقديم كله إنك تجد الشعر يروقك ثم تنظر فتجد السبب «أن قُدِّم فيه شيءٌ، وحُوِّل اللفظُ عن مكانٍ إلى مكان» [@dalail، ص106]."
    - title: "الصورة في «يَمْسَحُهَا رُكْبَانُ مَكَّةَ»"
      text: "يجعل الأمان مرئيًّا: الركبان يمرّون بالطير ويقربون منها حتى يكادوا يلمسونها، وهي لا تفرّ."
  connection: "ثم يأتي جواب القسم: ما أتيت بشيء تكرهه، وإلا فشُلّت يدي."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَلْمُؤْمِنِلْ / عَائِذَا / تِطْطَيْرَ يَمْ / سَحُهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — رُكْبَانُ مَكْ / كَةَ بَيْ / نَلْغَيْلِ وَسْ / سَعَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "بَيْنَ الْغِيلِ وَالسَّعَدِ"
    status: "رواية أبي عُبَيْدة، وأنكرها الأَصْمَعِيّ"
    note: "قال التِّبْرِيزِيّ: «وروى أبو عبيدة (بين الغيل والسَّعَدِ) بكسر الغين وقال: هما أجمتان كانتا بين مكة ومنى، وأنكر الأصمعي هذه الرواية، وقال: إنما الغِيل بكسر الغين الغيضة» [@tabrizi-ashr، ص319]، والغَيْضة الشجر الملتفّ. ويقول محقق الديوان: «ابن السكيت والتبريزي: بين الغيل والسَّعَد» [@diwan-nabigha، ص235]."
  - reading: "بَيْنَ الْغَيْلِ وَالسَّنَدِ"
    status: "في نسخة الشاملة للتِّبْرِيزِيّ، وفي العُمْدة والخِزانة كما طُبعا"
    note: "هي كذلك في متن التِّبْرِيزِيّ مع أن شرحه على «السَّعَد» [@tabrizi-ashr، ص319]، وكذلك هي في العمدة [@ibn-rashiq، ج2 ص177]، وفي الخزانة، وفسّرها البَغْداديّ: «والسند بفتحتين: ما قابلك» [@khizana، ج5 ص74]. وأثبتنا «السَّعَد» لأنها رواية الأَعْلَم [@diwan-nabigha، ص25] وابن السِّكِّيت، ولأن «السَّنَد» قافية البيت الأول، فتكرارها إيطاء."
  - reading: "تَمْسَحُهَا"
    status: "رواية ابن رَشِيق، وبها فسّره الأَعْلَم"
    note: "بالتاء [@ibn-rashiq، ج2 ص177]، وكذلك هي في شرح الأَعْلَم: «وقوله: «تَمْسَحُها»» مع أنها في البيت عنده بالياء [@diwan-nabigha، ص25]. والتذكير على لفظ «الرُّكْبان» جمعًا، والتأنيث على معنى الجماعة."
