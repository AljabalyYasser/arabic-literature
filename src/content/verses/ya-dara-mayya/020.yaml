first: "فَتِلْكَ تُبْلِغُنِي النُّعْمَانَ إِنَّ لَهُ"
second: "فَضْلًا عَلَى النَّاسِ فِي الْأَدْنَى وَفِي الْبَعَدِ"
meaning: "فتلك الناقة التي شبّهها بالثور القوي هي التي توصله إلى النُّعْمان، فإن للنعمان فضلًا على الناس قريبهم وبعيدهم. قال التِّبْرِيزِيّ: «فتلك: يعني ناقته التي شبَّهها بهذا الثور» [@tabrizi-ashr، ص314]، وقال الأَعْلَم: «أي تلك الناقة التي تشبه هذا الثور في قوته ونشاطه تُبلغني النعمان، وهو اسم الملك» [@diwan-nabigha، ص20]. ويحتمل الفضل عنده وجهين: «يحتمل أن يريد التفضّل على القريب والبعيد، ويحتمل أن يريد الرِّفعة؛ إذ هو يفضل جميع الناس» [@diwan-nabigha، ص20]، أي إحسانه يعمّ الناس، أو مكانته فوقهم جميعًا."
vocabulary:
  - term: "تُبْلِغُنِي"
    text: "توصلني، من «أَبْلَغَه المكان» إذا أوصله إليه."
  - term: "النُّعْمَانَ"
    text: "النُّعْمان بن المُنْذِر، ملك الحِيرة، وهو أبو قابُوس في البيت 48 [@tabrizi-ashr، ص322]."
  - term: "الْأَدْنَى"
    text: "الأقرب."
  - term: "الْبَعَدِ"
    text: "البعيد. قال التِّبْرِيزِيّ: «و (البعد) قيل: إنه مصدر يستوي فيه لفظ الواحد والاثنين والجمع والمذكر والمؤنث، وقيل: إنه جمع باعد كما يقال خادم وخدم، ومعنى (في الأدنى وفي البعد) كمعنى القريب والبعيد» [@tabrizi-ashr، ص314]. وفي اللسان عن أبي نصر: «في القريب والبعيد» [@lisan، ج3 ص91]."
context: "هذا البيت هو الخروج: انتهت قصة الثور في البيت 19، ويعود الشاعر بكلمة «فَتِلْكَ» إلى ناقته، ثم يجعلها تحمله إلى النُّعْمان، فيظهر غرض القصيدة لأول مرة. والخروج أن ينتقل الشاعر من قسم من القصيدة إلى قسم بعده. ويمثّل شَوْقي ضَيْف بهذا الموضع لحسن تخلص النابِغة: «فإنك تراه يخرج من النسيب إلى وصف ناقته خروجا تسنده المناسبة، حتى إذا أتم هذا الوصف قال: فتلك تبلغني النعمان» [@deif، ج1 ص298]. وبه يبدأ مدح النُّعْمان الذي يمتد إلى البيت 36، ثم الاعتذار."
syntax:
  - "«فَتِلْكَ» الفاء استئنافية، و«تِلْكَ» اسم إشارة مبتدأ، والإشارة إلى الناقة. وجملة «تُبْلِغُنِي النُّعْمَانَ» خبره، و«تُبْلِغُ» يتعدى إلى مفعولين: ياء المتكلم و«النُّعْمَانَ»."
  - "«إِنَّ لَهُ فَضْلًا» جملة مستأنفة تبيّن سبب قصده إليه: «لَهُ» جار ومجرور متعلق بمحذوف خبر «إنّ» مقدّم، و«فَضْلًا» اسمها مؤخّر. وبهذا الضبط هي عند الأَعْلَم [@diwan-nabigha، ص20]، وفي نسخة الشاملة للتِّبْرِيزِيّ «أن» بلا همزة، وهو من أخطاء الطبع."
  - "«عَلَى النَّاسِ» متعلق بـ«فَضْلًا»، و«فِي الْأَدْنَى وَفِي الْبَعَدِ» بدل مما قبله يفصّله، أي على الناس قريبهم وبعيدهم."
morphology:
  - "«تُبْلِغُ» مضارع «أَبْلَغَ» على «أفعل»، والهمزة فيه للتعدية: بَلَغَ المكانَ، وأَبْلَغَه غيرُه."
  - "«الْأَدْنَى» اسم تفضيل على «أَفْعَل» من «دَنَا يَدْنُو»، وأصل ألفه واو، ثم صارت ياء لأنها رابعة."
  - "«الْبَعَد» على «فَعَل»، وفيه وجهان عند التِّبْرِيزِيّ: مصدر يستوي فيه المفرد والجمع، أو جمع «باعد» كـ«خادم وخَدَم» [@tabrizi-ashr، ص314]."
rhetoric:
  thesis: "يجعل الناقة جسرًا بين قسمي القصيدة: هي التي شبّهها بالثور الذي غلب الكلاب، وهي نفسها التي تبلغه الملك. فقوة الثور وصبره صارا قوة الرحلة إلى النُّعْمان. ثم يبدأ المدح بأعمّ صفة: فضل يشمل الناس كلهم."
  devices:
    - title: "حسن التخلص في «فَتِلْكَ»"
      text: "اسم الإشارة للبعيد يجمع ما سبق كله: الناقة والثور ومعركته، ثم يحوّله إلى خدمة الغرض الجديد. فلم يقطع الوصف قطعًا، بل وصله بالممدوح، وهذا ما مدحه شَوْقي ضَيْف [@deif، ج1 ص298]."
    - title: "الطباق في «الْأَدْنَى» و«الْبَعَدِ»"
      text: "الطباق الجمع بين الضدين في الكلام. جمع القريب والبعيد ليدل على أن الفضل لا يترك أحدًا، فذكر الطرفين يغني عن ذكر كل من بينهما."
  connection: "ثم يقول إنه لا يرى في الناس من يشبهه في فعل الخير، ولا يستثني أحدًا."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَتِلْكَ تُبْ / لِغُنِنْ / نُعْمَانَ إِنْ / نَ لَهُو = متفعلن / فعِلن / مستفعلن / فعِلن — فَضْلَنْ عَلَنْ / نَاسِ فِلْ / أَدْنَى وَفِلْ / بَعَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية من الصدر فصارت «فعِلن». والعروض والضرب مخبونان «فعِلن» [@atiq، ص48]. وتُشبَع ضمة الهاء في «لَهُ» فتصير «لَهُو» ليستقيم الوزن."
