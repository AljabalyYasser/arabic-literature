first: "إِلَّا أَوَارِيَّ لَأْيًا مَا أُبَيِّنُهَا"
second: "وَالنُّؤْيَ كَالْحَوْضِ بِالْمَظْلُومَةِ الْجَلَدِ"
meaning: "ليس في الدار أحد، إلا محابس الخيل، لا أتبيّنها إلا بعد بطء وجهد لأن أثرها قد خفي، وإلا النؤي، وهو حاجز التراب حول الخيمة، باقيًا كأنه حوض في أرض صلبة. قال التِّبْرِيزِيّ: «والمعنى بَعْدَ بطء أسْتَبِينها» [@tabrizi-ashr، ص309]، وقال الأَعْلَم: «ليس في الدار شيء إلا محابس الخيل، قد خفي أثرها؛ فلا أتبينها إلا بعد بطء وجهد» [@diwan-nabigha، ص15]."
vocabulary:
  - term: "أَوَارِيَّ"
    text: "«والأواريّ والأواخيّ واحد، وهي التي تحبس بها الخيل» [@tabrizi-ashr، ص309]، وعند الأَعْلَم: «محابس الخيل ومرابطها، واحدها آريّ» [@diwan-nabigha، ص15]."
  - term: "لَأْيًا"
    text: "«والَّلأْي: البُطْء، يقال: الْتَأَتْ عليه حَاجَتُه» [@tabrizi-ashr، ص309]."
  - term: "أُبَيِّنُهَا"
    text: "أتبيّنها، وفي اللسان بعد إنشاد البيت: «يعني أتبينها» [@lisan، ج13 ص67]."
  - term: "النُّؤْيَ"
    text: "«حاجز من تراب يعمل حول البيت والخيمة، لئلا يصل إليها الماء» [@tabrizi-ashr، ص309]."
  - term: "الْمَظْلُومَةِ"
    text: "الأرض التي حُفر فيها حيث لا يُحفر. قال التِّبْرِيزِيّ: «وأصل الظُّلم وضع الشيء في غير موضعه، فالمظلومة: الأرض التي قد حفر فيها في غير موضع الحفر» [@tabrizi-ashr، ص309]. وفي اللسان عن ابن السِّكِّيت: «يعني أرضا مروا بها في برية فتحوضوا حوضا سقوا فيه إبلهم وليست بموضع تحويض» [@lisan، ج12 ص376]."
  - term: "الْجَلَدِ"
    text: "«الأرض الغليظة الصلبة من غير حجارة» [@tabrizi-ashr، ص309]."
context: "يستثني مما نفاه في البيت السابق «وما بالربع من أحد» ما بقي من آثار الحياة: أوتاد الخيل وحاجز التراب. ويرى شَوْقي ضَيْف أنه هنا «يطيل في وصفه ليظهر قدرته الخيالية»، وأنه «قد أبدع في تسمية الأرض التي لم تحفر بالمظلومة، وهو أول من أعطاها هذا الاسم، كأنه أحس إزاء الصخر الذي لا يحرث ولا يزرع بضرب من الظلم» [@deif، ج1 ص294]. والبيت من شواهد النحويين في الاستثناء المنقطع."
syntax:
  - "«إِلَّا أَوَارِيَّ»: استثناء منقطع، أي استثناء من غير جنس المستثنى منه، فالأواري ليست من «أحد». والنصب فيه لغة أهل الحجاز، والرفع على البدل من موضع «أحد» لغة تميم: أنشده سِيبَوَيْه بالرفع وقال: «وعلى هذا أنشدت بنو تميم قول النابغة الذبياني»، ثم قال: «وأهل الحجاز ينصبون» [@sibawayh، ج2 ص320–321]. ورجّح التِّبْرِيزِيّ النصب: «ويروى (إلاّ أَوَارِيُّ) والنصب أجود» [@tabrizi-ashr، ص309]. وقال البَغْداديّ: «إلا أواري بالنصب لأنه استثناء منقطع. والنؤي معطوف عليه» [@khizana، ج4 ص6]."
  - "«أَوَارِيَّ» منصوب بالفتحة بلا تنوين، لأنه ممنوع من الصرف على صيغة منتهى الجموع."
  - "«لَأْيًا» منصوب على الظرف، أي بعد لأي، و«مَا» زائدة، وجملة «أُبَيِّنُهَا» صفة لـ«أَوَارِيَّ». ويقال كما ينقل البَغْداديّ: «فعل كذا بعد لأي أي: بعد شدة» [@khizana، ج4 ص7]."
  - "«وَالنُّؤْيَ» معطوف على «أَوَارِيَّ» منصوب، و«كَالْحَوْضِ» جار ومجرور في موضع الحال من النؤي، و«بِالْمَظْلُومَةِ» متعلق بمحذوف صفة للحوض، و«الْجَلَدِ» صفة للمظلومة."
morphology:
  - "«أَوَارِيّ» جمع «آرِيّ» على «أفاعِيل»، و«الأواري هي الأواخي جمع آري وآخية بالمد والتشديد فيهما» [@khizana، ج4 ص6]."
  - "«أُبَيِّن» مضارع «بَيَّنَ» على «فعَّل»، وهو هنا لازم بمعنى «تبيَّن»."
  - "«الْمَظْلُومَة» اسم مفعول من «ظَلَم»، و«لَأْي» مصدر «لأَى» إذا أبطأ."
rhetoric:
  thesis: "بعد النفي العام يأتي الاستثناء فلا يُخرج من النفي إنسانًا، بل أوتادًا وترابًا. فالاستثناء يؤكد الخلاء بدل أن ينقضه، والتشبيه يعيد إلى النؤي صورته بعد أن كاد يمّحي."
  devices:
    - title: "الاستثناء المنقطع"
      text: "في «إِلَّا أَوَارِيَّ» لا يستثني من «أحد» واحدًا من الناس، بل شيئًا من غير جنسهم. فكأنه يقول: لا أحد فيها، وكل ما فيها أوتاد وحاجز تراب. وهذا أبلغ في وصف الخراب من نفي مجرد."
    - title: "التشبيه بالحوض"
      text: "في «كَالْحَوْضِ» شبّه النؤي بالحوض، و«شبهه بالحوض في استدارته» كما يقول الأَعْلَم، وجعله في أرض صلبة لأن الحفر فيها «ليس بسهل، فلم يعمق النؤي، فهو أشبه له بالحوض» [@diwan-nabigha، ص15]. وهو عند عبد القاهر الجُرْجانيّ من التشبيه الذي يكون «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل»، كأن «يشبَّه الشيء إذا استدار بالكرة في وجه، وبالحلقة في وجه آخر» [@asrar، ص90]، أي تشبيه في الشكل تدركه العين، لا تمثيل يحتاج إلى تأمل."
    - title: "«الْمَظْلُومَةِ»"
      text: "وصف الأرض بأنها مظلومة لأنها حُفرت في غير موضع الحفر، والظلم في أصل اللغة «وضع الشيء في غير موضعه» [@tabrizi-ashr، ص309]. وصاحب اللسان يجعلها استعمالًا معروفًا: «يقال: ظلمت الحوض إذا عملته في موضع لا تعمل فيه الحياض» [@lisan، ج12 ص376]، أما شَوْقي ضَيْف فيراها من ابتكار النابِغة [@deif، ج1 ص294]."
  connection: "ثم يصف كيف أصلحت الأمة هذا النؤي وسوّته."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "إِلْلَا أَوَا / رِيْيَ لَأْ / يَنْ مَا أُبَيْ / يِنُهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — وَنْنُؤْيَ كَلْ / حَوْضِ بِلْ / مَظْلُومَتِلْ / جَلَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "العروض والضرب مخبونان «فعِلن»، والخَبْن حذف الثاني الساكن [@atiq، ص46، ص48]، وسائر التفعيلات تامة."
variants:
  - reading: "إِلَّا أَوَارِيُّ لَأْيًا مَا أُبَيِّنُهَا / وَالنُّؤْيُ كَالْحَوْضِ بِالْمَظْلُومَةِ الْجَلَدِ"
    status: "رواية سِيبَوَيْه عن بني تميم"
    note: "بالرفع على البدل من موضع «أحد» [@sibawayh، ج2 ص321] [@khizana، ج4 ص6]، ويذكرها التِّبْرِيزِيّ ويرجّح النصب [@tabrizi-ashr، ص309]. وفي نسخة الشاملة للتِّبْرِيزِيّ «والنؤيَُ» بفتحة وضمة معًا، فاخترنا النصب ليوافق «أَوَارِيَّ»."
  - reading: "إِلَّا الْأَوَارِيَّ لَأْيًا مَا أُبَيِّنُهَا / وَالنُّؤْيُ كَالْحَوْضِ بِالْمَظْلُومَةِ الْجَلَدِ"
    status: "رواية الأَعْلَم"
    note: "بالألف واللام في «الأواري»، ورفع «النؤي» على الابتداء، أي: وليس بها إلا النؤي [@diwan-nabigha، ص15]. وبها ينشده صاحب اللسان عن ابن السِّكِّيت [@lisan، ج12 ص376]، أما محقق الديوان فيذكر أن ابن السِّكِّيت والتِّبْرِيزِيّ يرويان «إلا أواريَّ» [@diwan-nabigha، ص235]."
  - reading: "إِلَّا أَوَارِيَّ مَا إِنْ لَا أُبَيِّنُهَا"
    status: "رواية الفَرّاء"
    note: "قال البَغْداديّ: «على أن الفراء أنشده بالجمع بين ثلاثة أحرف نافية والرواية: لأيا ما أبينها» [@khizana، ج4 ص121]، ونقل عن الفَرّاء: «والنصب في هذا النوع المختلف من كلام أهل الحجاز والاتباع من كلام تميم» [@khizana، ج4 ص122]."
