first: "وَخَيِّسِ الْجِنَّ إِنِّي قَدْ أَذِنْتُ لَهُمْ"
second: "يَبْنُونَ تَدْمُرَ بِالصُّفَّاحِ وَالْعُمُدِ"
meaning: "وتمام ما قاله الإله لسُلَيْمان: وذلّل الجن واستعملهم، فإني قد أذنت لهم أن يبنوا مدينة تَدْمُر بالحجارة العريضة وأعمدة الرخام. قال الأَعْلَم: «أي ذلِّلهم، ومنه سُمّي السجن مُخيَّسًا» [@diwan-nabigha، ص21]."
vocabulary:
  - term: "خَيِّسِ"
    text: "«ذلل» [@tabrizi-ashr، ص315]، والمُخَيَّس: السجن، لأنه يذلّ من فيه [@diwan-nabigha، ص21]."
  - term: "تَدْمُرَ"
    text: "«مدينة بالشام، فيها بناءٌ لسليمان بن داود، عليهما السلام» [@diwan-nabigha، ص21]، وفي اللسان: «وتدمر: مدينة بالشام» وينشد البيت [@lisan، ج4 ص291]."
  - term: "الصُّفَّاحِ"
    text: "«جمع صُفاحة، وهي حجارة رقاق عراض» [@tabrizi-ashr، ص315]."
  - term: "الْعُمُدِ"
    text: "جمع عمود، وهي عند الأَعْلَم «أساطين الرخام، وهي السَّواري» [@diwan-nabigha، ص21]، والأساطين والسواري: الأعمدة."
context: "تتمة خطاب الإله لسُلَيْمان، وفيه أعجب ما في ملكه: الجن تعمل له. والبيت من الأبيات التي يرى شَوْقي ضَيْف أنها أقحمت على القصيدة [@deif، ج1 ص279]، وقد استشهد به صاحب اللسان منسوبًا إلى النابِغة [@lisan، ج4 ص291]."
syntax:
  - "«وَخَيِّسِ الْجِنَّ» معطوف على «قُمْ» في البيت السابق، فهو داخل في مقول القول: «خَيِّسْ» فعل أمر كُسرت سينه لالتقاء الساكنين، و«الْجِنَّ» مفعول به."
  - "«إِنِّي قَدْ أَذِنْتُ لَهُمْ» جملة تعليلية مستأنفة: «إنّ» واسمها ياء المتكلم، وجملة «قَدْ أَذِنْتُ لَهُمْ» خبرها."
  - "«يَبْنُونَ تَدْمُرَ» جملة حالية من ضمير «لَهُمْ»، أي أذنت لهم بانين، أو هي بيان لما أذن فيه. و«تَدْمُرَ» مفعول به ممنوع من الصرف للعلمية والتأنيث. و«بِالصُّفَّاحِ» متعلق بـ«يَبْنُونَ»، و«وَالْعُمُدِ» معطوف عليه."
morphology:
  - "«خَيِّسْ» أمر من «خَيَّسَ» على «فَعَّلَ»، والتضعيف فيه للتكثير والتعدية: خاس الشيءُ إذا ذلّ، وخيّسه غيره."
  - "«الصُّفَّاح» جمع «صُفَّاحة» على «فُعَّال»، فهو اسم جنس جمعي يُفرق بينه وبين واحده بالتاء."
  - "«الْعُمُد» جمع «عمود» على «فُعُل»، ويجمع أيضًا على «عَمَد»، وبه هو عند الأَعْلَم [@diwan-nabigha، ص21]."
rhetoric:
  thesis: "يكبّر صورة سُلَيْمان بأعجب ما في سلطانه، وهو تسخير الجن للبناء، وكل ذلك يرفع النُّعْمان الذي جُعل شبيهه الوحيد. وبذكر تَدْمُر، المدينة الشامية القريبة من ديار العرب، يقرّب الصورة من سامعيه."
  devices:
    - title: "الإيجاز في «إِنِّي قَدْ أَذِنْتُ لَهُمْ»"
      text: "جملة قصيرة تعلّل الأمر «خَيِّسِ الْجِنَّ»، فتجعل تسخيرهم إذنًا من الإله لا قهرًا من سُلَيْمان وحده، فيبقى الملك تكليفًا كما في البيت السابق."
    - title: "الصورة الحسية في «بِالصُّفَّاحِ وَالْعُمُدِ»"
      text: "لم يقل: يبنون بناء عظيمًا، بل سمّى مادة البناء: حجارة عريضة وأعمدة، فرأى السامع البناء بعينه."
  connection: "ثم يتمّ الخطاب بالثواب والعقاب: من أطاع فكافئه، ومن عصى فعاقبه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَخَيْيِسِلْ / جِنْنَ إِنْ / نِي قَدْ أَذِنْ / تُ لَهُمْ = متفعلن / فاعلن / مستفعلن / فعِلن — يَبْنُونَ تَدْ / مُرَ بِصْ / صُفْفَاحِ وَلْ / عُمُدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر فصارت «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان «فعِلن» [@atiq، ص48]."
variants:
  - reading: "يَبْنُونَ تَدْمُرَ بِالصُّفَّاحِ وَالْعَمَدِ"
    status: "رواية الأَعْلَم واللسان"
