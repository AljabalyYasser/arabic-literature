first: "فَمَنْ أَطَاعَ فَأَعْقِبْهُ بِطَاعَتِهِ"
second: "كَمَا أَطَاعَكَ وَادْلُلْهُ عَلَى الرَّشَدِ"
meaning: "وتمام الخطاب لسُلَيْمان: من أطاعك فجازه على طاعته بقدر ما أطاعك، وأرشده إلى طريق الصواب. وفي اللسان أن «أعقبه خيرًا»: «أي عوّضه وأبدله»، ثم ينشد البيت شاهدًا على هذا المعنى [@lisan، ج1 ص617]."
vocabulary:
  - term: "فَأَعْقِبْهُ"
    text: "فجازه وعوّضه. قال صاحب اللسان: «فأعقبه خيرا أي عوضه وأبدله. وهو بمعنى قوله» وينشد البيت [@lisan، ج1 ص617]."
  - term: "وَادْلُلْهُ"
    text: "وأرشده، من الدلالة على الطريق."
  - term: "الرَّشَدِ"
    text: "الرُّشد، أي الهدى والصواب. قال الأَعْلَم: «يقال: رُشْد ورَشَد، كما يقال: بُخْل وبَخَل، وشُغْل وشَغَل، ومثله كثير» [@diwan-nabigha، ص21]."
context: "تتمة خطاب الإله لسُلَيْمان (22–25)، وفيه نصف ميزان الحكم: الثواب للمطيع، ويأتي العقاب للعاصي في البيت التالي. والنابِغة يعرض على النُّعْمان، من طريق سُلَيْمان، صورة الملك الذي يجازي الطاعة، وهو يعدّ نفسه من المطيعين. والبيت من أبيات سُلَيْمان التي يرى شَوْقي ضَيْف أنها أقحمت على القصيدة [@deif، ج1 ص279]."
syntax:
  - "«فَمَنْ أَطَاعَ» الفاء للتفريع، و«مَنْ» اسم شرط مبتدأ، و«أَطَاعَ» فعل الشرط. و«فَأَعْقِبْهُ» جواب الشرط مقترن بالفاء لأنه أمر، والهاء مفعول به، و«بِطَاعَتِهِ» متعلق به، والباء للسببية أو المقابلة."
  - "«كَمَا أَطَاعَكَ»: «ما» مصدرية، والمصدر المؤول مجرور بالكاف، والجار والمجرور متعلق بمحذوف صفة لمصدر محذوف، أي إعقابًا مثل طاعته لك."
  - "«وَادْلُلْهُ عَلَى الرَّشَدِ» معطوفة على جواب الشرط، و«عَلَى الرَّشَدِ» متعلق بـ«ادْلُلْ»."
morphology:
  - "«أَعْقِبْ» أمر من «أَعْقَبَ» على «أفعل»: أتبعه بشيء يكون عقبه، ومنه العُقْبى والعاقبة. وفي نسخة الشاملة للتِّبْرِيزِيّ «فَأَعْقَبْهُ» بفتح القاف، وهو خطأ في الطبع، لأن الكلام أمر، وهو في اللسان بكسرها [@lisan، ج1 ص617]."
  - "«ادْلُلْ» أمر من «دَلَّ يَدُلُّ»، فُكّ فيه التضعيف لسكون اللام الثانية، كما في «احْدُدْ» في البيت 22."
  - "«الرَّشَد» مصدر على «فَعَل»، ويقال «الرُّشْد» على «فُعْل»، والوزنان كثيران في مصادر واحدة [@diwan-nabigha، ص21]."
rhetoric:
  thesis: "يجعل الطاعة سببًا للجزاء والهداية معًا، فالملك العادل لا يكتفي بأن يكافئ المطيع بالمال، بل يدلّه على الرشد. وفي ذلك تعريض لطيف: النابِغة يطيع، فهو أهل لأن يُعقَب بطاعته."
  devices:
    - title: "المقابلة بين «فَمَنْ أَطَاعَ» و«وَمَنْ عَصَاكَ»"
      text: "المقابلة أن يُؤتى بمعنيين أو أكثر ثم بما يقابلها على الترتيب. فهذا البيت يبدأ بـ«فَمَنْ أَطَاعَ» وجزائه، والبيت التالي يبدأ بـ«وَمَنْ عَصَاكَ» وجزائه، فيقوم الحكم على ميزان متساوي الكفتين."
    - title: "التعريض"
      text: "التعريض أن يقول المتكلم كلامًا ظاهره في شيء وهو يريد به شيئًا آخر. فالخطاب لسُلَيْمان في الظاهر، وهو في الحقيقة دعوة للنعمان أن يكافئ الشاعر المطيع."
  connection: "ثم يأتي الشق الآخر من الميزان: من عصاك فعاقبه عقابًا يردع الظالم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَمَنْ أَطَا / عَ فَأَعْ / قِبْهُو بِطَا / عَتِهِي = متفعلن / فعِلن / مستفعلن / فعِلن — كَمَا أَطَا / عَكَ وَدْ / لُلْهُو عَلَرْ / رَشَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى و«فاعلن» الثانية في الشطرين، فصارتا «متفعلن» و«فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «فَأَعْقِبْهُ» و«وَادْلُلْهُ»."
variants:
  - reading: "فَمَنْ أَطَاعَكَ فَانْفَعْهُ بِطَاعَتِهِ"
    status: "رواية الأَعْلَم"
    note: "«فمن أطاعك فانفعه بطاعته» [@diwan-nabigha، ص21]، وبها يورده شَوْقي ضَيْف [@deif، ج1 ص279]."
  - reading: "وَمَنْ أَطَاعَ فَأَعْقِبْهُ بِطَاعَتِهِ"
    status: "رواية ابن السِّكِّيت واللسان"
    note: "يقول محقق الديوان: «ابن السكيت والتبريزي: ومن أطاع فأعقبه» [@diwan-nabigha، ص235]، وبالواو هو في اللسان [@lisan، ج1 ص617]، أما نسخة الشاملة للتِّبْرِيزِيّ فبالفاء."
