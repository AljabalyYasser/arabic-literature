first: "هَا إِنَّ تَا عِذْرَةٌ إِلَّا تَكُنْ نَفَعَتْ"
second: "فَإِنَّ صَاحِبَهَا قَدْ تَاهَ فِي الْبَلَدِ"
meaning: "ها هي ذي القصيدة عذرٌ أقدّمه إليك، فإن لم ينفع هذا العذر فصاحبه ضائع حائر في البلاد لا يدري أين يذهب. قال التِّبْرِيزِيّ: «تا: بمعنى هذه»، و«ومعنى انها عذرة أي أن هذه القصيدة عُذْر، أي ذات عذر» [@tabrizi-ashr، ص322]. وقال الأَعْلَم: «أي هذه معذرةٌ إليك، وتبرُّؤٌ مما وُشِيتُ به عندك» [@diwan-nabigha، ص28]. وفي «قَدْ تَاهَ فِي الْبَلَدِ» قولان ينقلهما البَغْداديّ: «وقال شارح ديوانه: معناه لا أفارق بلدك ما دمت ساخطاً علي»، ثم قال: «والمعنى عندي: إن لم تقبل عذري وترضى علي فإني أختل حتى إني أضل في البلدة التي أنا فيها لما أنا فيه من عظم الدهشة الحاصلة لي من وعيدك» [@khizana، ج5 ص460]."
vocabulary:
  - term: "هَا"
    text: "حرف تنبيه، وفي اللسان عن أبي الهَيْثَم: «ها تنبيه تفتتح العرب بها الكلام بلا معنى سوى الافتتاح، تقول: هذا أخوك، ها إن ذا أخوك؛ وأنشد النابغة» ثم البيت [@lisan، ج15 ص475]."
  - term: "تَا"
    text: "اسم إشارة للمؤنث بمعنى «هذه»، وفي اللسان: «الجوهري: تا اسم يشار به إلى المؤنث مثل ذا للمذكر» [@lisan، ج15 ص445]."
  - term: "عِذْرَةٌ"
    text: "عُذْر واعتذار، قال التِّبْرِيزِيّ: «وعِذْرَة وعُذْرى ومَعْذُرَة واحد» [@tabrizi-ashr، ص322]."
  - term: "تَاهَ"
    text: "ضلّ وتحيّر، ونقل البَغْداديّ عن «المِصْباح»: «وتاه: الإنسان في المفازة يتيه تيهاً: ضل عن الطريق» [@khizana، ج5 ص460]."
  - term: "الْبَلَدِ"
    text: "الأرض والبلاد."
context: "آخر القصيدة عند التِّبْرِيزِيّ، وهو آخرها عند الأَعْلَم أيضًا، والتاسع والأربعون عنده [@diwan-nabigha، ص28]، وقال البَغْداديّ: «وهذا البيت آخر قصيدة للنابغة الذبياني مدح بها النعمان بن المنذر ملك الحيرة واعتذر إليه فيها مما افتري عليه» [@khizana، ج5 ص459]. ويقول ابن رَشِيق في خاتمة القصيدة: «وأما الانتهاء فهو قاعدة القصيدة، وآخر ما يبقى منها في الأسماع، وسبيله أن يكون محكماً: لا تمكن الزيادة عليه، ولا يأتي بعده أحسن منه، وإذا كان أول الشعر مفتاحاً له وجب أن يكون الآخر قفلاً عليه» [@ibn-rashiq، ج1 ص239]. والخاتمة هنا تسمّي القصيدة كلها باسمها: عذر. ونقل أبو عُبَيْدة قول من يفضّل النابِغة إنه «أجودهم مقاطع، وأحسنهم مطالع» [@ibn-qutayba، ج1 ص166]، والمطالع أوائل الشعر، والمقاطع، فيما نفهم، أواخره. ويقول شَوْقي ضَيْف إن الشاعر يقول هنا إنه «إن لم يقبل اعتذاره ألقى به فى مهاوى النكد والهم» [@deif، ج1 ص288]."
syntax:
  - "«هَا» حرف تنبيه، و«إِنَّ» حرف توكيد ونصب، و«تَا» اسم إشارة اسمها مبني في محل نصب، و«عِذْرَةٌ» خبرها مرفوع. وفصل «إنّ» بين «ها» واسم الإشارة، وأصله: إنّ هاتا. قال البَغْداديّ: «على أنّ الفصل بين ها وبين تا بإنّ وهي غير قسم وغير ضمير مرفوع منفصل قليل» [@khizana، ج11 ص195]، أي أن الشائع أن يُفصل بينهما بضمير، كقولهم: ها أنا ذا."
  - "«إِلَّا» مركبة من «إِنْ» الشرطية و«لا» النافية، أُدغمت النون في اللام. و«تَكُنْ» فعل الشرط مجزوم، واسمها ضمير يعود على العذرة، وجملة «نَفَعَتْ» خبرها."
  - "«فَإِنَّ صَاحِبَهَا قَدْ تَاهَ» الفاء رابطة لجواب الشرط لأنه جملة اسمية، و«صَاحِبَهَا» اسم «إنّ»، وجملة «قَدْ تَاهَ» خبرها، و«فِي الْبَلَدِ» متعلق بـ«تَاهَ». قال البَغْداديّ: «وقوله: إن صاحبها أي: صاحب العذرة ويعني به نفسه» [@khizana، ج5 ص460]."
morphology:
  - "«عِذْرَة» على «فِعْلة»، وفي اللسان: «وشاهد العذرة مثل الركبة والجلسة قول النابغة» ثم البيت [@lisan، ج4 ص545]."
  - "«تَاهَ» فعل أجوف، يقال: «تاه يتيه» و«تاه يتوه»، كما نقل البَغْداديّ عن «المِصْباح»: «وتاه يتوه توهاً لغة» [@khizana، ج5 ص460]."
  - "«تَا» من أسماء الإشارة للمؤنث، ومنها «تِيكَ» و«تِلْكَ» [@lisan، ج15 ص445]."
  - "«صَاحِب» اسم فاعل من «صَحِبَ»."
rhetoric:
  thesis: "يختم بما يجعل القصيدة كلها فعلًا واحدًا: هذه عذر. ثم يضع أمام الملك ما يترتب على رفضها: شاعر تائه بلا مأوى. فالقصيدة التي بدأت بدار خالية لا يُجيب فيها أحد تنتهي بصاحبها تائهًا في البلاد إن لم يُقبل عذره، وهذه قراءتنا لما بين المطلع والخاتمة."
  devices:
    - title: "حسن الانتهاء"
      text: "حسن الانتهاء أن يختم الشاعر قصيدته ببيت يحكم إغلاقها، وهو ما يسميه ابن رَشِيق «قفلًا» [@ibn-rashiq، ج1 ص239]، ويقول في موضع آخر: «وخاتمة الكلام أبقى في السمع، وألصق بالنفس؛ لقرب العهد بها» [@ibn-rashiq، ج1 ص217]. والبيت هنا لا يحتمل بعده كلامًا: فقد سمّى القصيدة، وبيّن غايتها، وترك الأمر للملك."
    - title: "الإشارة في «هَا إِنَّ تَا»"
      text: "يشير إلى القصيدة نفسها كأنها شيء حاضر يقدّمه بيده، ويقدّم حرف التنبيه «هَا» ليلفت الملك إليه. قال البَغْداديّ: «ها للتنبيه وتا: اسم إشارة لما ذكره في قصيدته من يمينه على أنه لم يأت بشيء يكرهه» [@khizana، ج5 ص460]، وعند التِّبْرِيزِيّ الإشارة إلى القصيدة كلها [@tabrizi-ashr، ص322]."
    - title: "الكناية في «قَدْ تَاهَ فِي الْبَلَدِ»"
      text: "الكناية أن يريد المتكلم معنى فلا يذكره بلفظه بل بما يلزمه. فالتيه في البلاد يلزمه فقد المأوى والأمان، والمراد: إن لم تقبلني ضعت. وفسّره البَغْداديّ بالدهشة من الوعيد حتى يضلّ في البلدة التي هو فيها [@khizana، ج5 ص460]، فالعجز يعود إلى بيت الوعيد «وَلَا قَرَارَ عَلَى زَأْرٍ مِنَ الْأَسَدِ»."
  connection: "وبه تنتهي القصيدة عند التِّبْرِيزِيّ وعند الأَعْلَم، وقد بدأت بنداء دار مَيّة الخالية، وانتهت بالشاعر يقدّم عذره ويخشى أن يضيع."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "هَا إِنْنَ تَا / عِذْرَتُنْ / إِلْلَا تَكُنْ / نَفَعَتْ = مستفعلن / فاعلن / مستفعلن / فعِلن — فَإِنْنَ صَا / حِبَهَا / قَدْ تَاهَ فِلْ / بَلَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى و«فاعلن» الثانية من العجز، فصارتا «متفعلن» و«فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "هَا إِنَّ ذِي عِذْرَةٌ إِلَّا تَكُنْ نَفَعَتْ / فَإِنَّ صَاحِبَهَا مُشَارِكُ النَّكَدِ"
    status: "رواية الأَعْلَم، وهو البيت 49 عنده، والروايتان يذكرهما التِّبْرِيزِيّ"
    note: "قال التِّبْرِيزِيّ: «ويروى (فإن صاحبها مشارك النكد)»، و«ويروى (إن ذي عذرة)» [@tabrizi-ashr، ص322]. وقال الأَعْلَم: «والنَّكَد: العُسْر وقلّة الجدّ» [@diwan-nabigha، ص28]، والجَدّ الحظ، أي فإن صاحبها شريك الشقاء وسوء الحظ. وبها ينشده شَوْقي ضَيْف [@deif، ج1 ص288]."
  - reading: "إِنَّهَا عِذْرَةٌ"
    status: "رواية ذكرها التِّبْرِيزِيّ، ونحوها رواية أبي عُبَيْدة"
    note: "«ويروى (إنها عذرة)» [@tabrizi-ashr، ص322]. وقال البَغْداديّ: «وروى أبو عبيدة: وإن ها عذرة فلا شاهد فيه على روايته» [@khizana، ج5 ص459]، أي لا فصل فيها بين «ها» واسم الإشارة، فالهاء فيها ضمير لا حرف تنبيه."
  - reading: "إِنْ لَمْ تَكُنْ نَفَعَتْ"
    status: "رواية البَغْداديّ"
    note: "بها ينشده [@khizana، ج5 ص459]، ثم قال: «وَقَوله: إن لم تكن نفعت روى أيضا: إلا تكن نفعت» [@khizana، ج5 ص460]. وفي نسخة الشاملة للتِّبْرِيزِيّ «ها أن تاعذرة»، وصوابه «هَا إِنَّ تَا عِذْرَةٌ»."
