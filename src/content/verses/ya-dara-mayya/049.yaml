first: "هَذَا الثَّنَاءُ فَإِنْ تَسْمَعْ لِقَائِلِهِ"
second: "فَمَا عَرَضْتُ أَبَيْتَ اللَّعْنَ بِالصَّفَدِ"
meaning: "هذا ثنائي عليك، فإن أصغيت إلى قائله فاعلم أني لم أقله لأطلب به عطاءك، أبيتَ اللعن. فالمدح كله، من نفي الشبيه إلى الفُرات، اعتذار لا استجداء. قال الأَعْلَم في رواية «فلم أُعَرِّض»: «أي لم أمدحك تعرُّضًا لمعروفك، لكن اعتذارًا إليك، وإقرارًا بفضلك» [@diwan-nabigha، ص27]."
vocabulary:
  - term: "الثَّنَاءُ"
    text: "المدح."
  - term: "تَسْمَعْ لِقَائِلِهِ"
    text: "تُصغِ إليه وتقبل منه، والقائل الشاعر نفسه."
  - term: "عَرَضْتُ"
    text: "لمّحت وطلبت من طرف خفي، والرواية الأخرى «أُعَرِّضْ» (انظر الروايات)."
  - term: "أَبَيْتَ اللَّعْنَ"
    text: "قال التِّبْرِيزِيّ: «ومعنى (أبيت اللعن) أي أبيت أن تأتي شيئا تُلعن عليه» [@tabrizi-ashr، ص322]. وقال الأَعْلَم: «هي تحيةٌ كانوا يُحيُّون بها الملوكَ» [@diwan-nabigha، ص27]."
  - term: "الصَّفَدِ"
    text: "«الصفد: العطاء، قال الأصمعي: لا يكون الصفد ابتداء، إنما يكون بمنزلة المكافأة» [@tabrizi-ashr، ص322]، وعند الأَعْلَم: «العَطاء جزاءً» [@diwan-nabigha، ص27]. فهو العطاء الذي يُجزى به المادح على مدحه."
context: "أول بيتي الختام (49–50): يسمّي ما سبق كله «ثناء»، ثم ينفي عنه طلب الجزاء. وهو البيت الثامن والأربعون عند الأَعْلَم، وهو عنده بعد أبيات الفُرات مباشرة، فالإشارة في «هَذَا الثَّنَاءُ» إلى صورة الفُرات قريبة. وعند هذا البيت يضع المازِنيّ البيت 26 فيما ينقله الأَعْلَم: «إنما موضعه بعد قوله: «فلم أعرِّض – أبيتَ اللعنَ – بالصَّفَد» «إلا لمثلك أو من أنت سابقه»» [@diwan-nabigha، ص21]، فيتصل الاستثناء على قوله بـ«فلم أعرّض»، فلا يكون البيت 26 من كلام الإله لسُلَيْمان. ويقول شَوْقي ضَيْف إن النابِغة يقول هنا إنه «قدم له هذا الثناء لا يبغى به نواله، وإنما يبغى رضاه» [@deif، ج1 ص288]. أما أبو عَمْرو بن العَلاء فيرى أن النابِغة عاد إلى النُّعْمان لأنه «تذكَّر ما كان يعطيه، فلم يصبر فأتاه» [@diwan-nabigha، ص29]، فهو يقرأ عودته على خلاف ما يقوله البيت."
syntax:
  - "«هَذَا الثَّنَاءُ» «هَذَا» اسم إشارة مبتدأ، و«الثَّنَاءُ» خبره، والإشارة إلى ما سبق من المدح."
  - "«فَإِنْ تَسْمَعْ لِقَائِلِهِ» الفاء استئنافية، و«إِنْ» شرطية جازمة، و«تَسْمَعْ» فعل الشرط مجزوم، و«لِقَائِلِهِ» متعلق به، و«سَمِعَ له» بمعنى أصغى إليه وقَبِل منه."
  - "«فَمَا عَرَضْتُ ... بِالصَّفَدِ» جواب الشرط مقترن بالفاء لأنه منفي بـ«ما»، و«بِالصَّفَدِ» متعلق بـ«عَرَضْتُ». والمعنى: إن تقبل هذا الثناء فاعلم أني لم أقصد به العطاء."
  - "«أَبَيْتَ اللَّعْنَ» جملة دعائية معترضة بين الفعل ومتعلَّقه لا محل لها: «أَبَيْتَ» فعل وفاعل، و«اللَّعْنَ» مفعول به."
morphology:
  - "«الثَّنَاء» اسم من «أَثْنَى عليه» إذا مدحه، وهمزته منقلبة عن ياء."
  - "«قَائِل» اسم فاعل من «قَالَ» الأجوف، قُلبت عينه همزة."
  - "«أَبَيْتَ» من «أَبَى يَأْبَى»، ومضارعه بفتح العين على «فَعَلَ يَفْعَلُ» مع أن عينه ولامه ليستا من حروف الحلق."
  - "«الصَّفَد» اسم، والفعل منه «أَصْفَدَ» إذا أعطى، قال التِّبْرِيزِيّ: «يقال: أصفدته أصفده إصفادا؛ إذا أعطيته، والاسم الصفد» [@tabrizi-ashr، ص322]. وفي اللسان: «الصَّفَدُ والصَّفْدُ: العَطاءُ، وَقَدْ أَصْفَدَهُ» [@lisan، ج3 ص256]."
rhetoric:
  thesis: "بعد المدح الطويل يحمي الشاعر مدحه من أن يُظن طلبًا. فلو ظن الملك أن الثناء ثمن لعطاء لصغر الاعتذار، فجعل الثناء شهادة بالفضل لا سؤالًا. وفي وسط هذا النفي يحيّي الملك بتحية الملوك، فيجمع البيت بين الإجلال والتعفف."
  devices:
    - title: "الاحتراس في «فَمَا عَرَضْتُ ... بِالصَّفَدِ»"
      text: "الاحتراس أن يُؤتى في الكلام بما يدفع عنه وهمًا. فالمدح الكثير قد يوهم أن صاحبه يطلب الجزاء، فدفع ذلك بنفي صريح، وعلى هذا فسّره الأَعْلَم: «لكن اعتذارًا إليك، وإقرارًا بفضلك» [@diwan-nabigha، ص27]."
    - title: "الاعتراض في «أَبَيْتَ اللَّعْنَ»"
      text: "الاعتراض أن يُدخل المتكلم في أثناء كلامه جملة ليست من أصله. فأدخل تحية الملوك بين الفعل وما يتعلق به، فالخطاب كله يجري في حضرة الملك وبأدبه."
    - title: "الإشارة في «هَذَا الثَّنَاءُ»"
      text: "اسم الإشارة يجمع ما سبق من المدح كله ويعرضه على الملك دفعة واحدة، كما جمعت «فَتِلْكَ» في البيت 20 وصف الناقة والثور."
  connection: "ثم يختم القصيدة: هذه القصيدة عذر، فإن لم تنفع فصاحبها تائه في البلاد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "هَاذَثْ ثَنَا / ءُ فَإِنْ / تَسْمَعْ لِقَا / ئِلِهِي = مستفعلن / فعِلن / مستفعلن / فعِلن — فَمَا عَرَضْ / تُ أَبَيْ / تَلْلَعْنَ بِصْ / صَفَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع كسرة الهاء في «لِقَائِلِهِ» فتصير «لِقَائِلِهِي». والوزن يقتضي «عَرَضْتُ» بالتخفيف، فلو شُدّدت الراء لانكسر البيت."
variants:
  - reading: "هَذَا الثَّنَاءُ فَإِنْ تَسْمَعْ بِهِ حَسَنًا / فَلَمْ أُعَرِّضْ أَبَيْتَ اللَّعْنَ بِالصَّفَدِ"
    status: "رواية ذكرها التِّبْرِيزِيّ، وهي رواية الأَعْلَم، والبيت 48 عنده"
    note: "قال التِّبْرِيزِيّ: «ويروى: فإن تَسْمَعْ به حسنا ... فلم أعَرِّضْ أبيتَ اللّعْنَ بالصَّفَد» [@tabrizi-ashr، ص322]. وقال الأَعْلَم: «وقوله: «فإنْ تسمع به حَسَنًا»، أي تسمع بسماعه إيّاك قولًا حسنًا» [@diwan-nabigha، ص27]. وبها ينشده شَوْقي ضَيْف [@deif، ج1 ص288]. وفي نسخة الشاملة للتِّبْرِيزِيّ «أَبَيْنتَ اللّعْنَ»، وهو خطأ في الطبع."
