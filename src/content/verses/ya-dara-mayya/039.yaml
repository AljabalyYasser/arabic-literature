first: "مَا إِنْ أَتَيْتُ بِشَيْءٍ أَنْتَ تَكْرَهُهُ"
second: "إِذًا فَلَا رَفَعَتْ سَوْطِي إِلَيَّ يَدِي"
meaning: "ما فعلت شيئًا تكرهه، ولو فعلت لشُلّت يدي حتى لا أقدر على رفع سوطي. هذا جواب القسم الذي بدأ في البيت 37، ثم يدعو على نفسه إن كان كاذبًا. قال التِّبْرِيزِيّ في آخر البيت: «أي شلَّتْ» [@tabrizi-ashr، ص319]، وقال الأَعْلَم: «يقول: إذًا فشُلَّتْ يَدِي حتى لا أُطيق رَفْعَ السَّوط، وإنما خصَّ السَّوطَ؛ لأنه خفيف المحمل مع كثرة احتياجه إليه، لحثّ المطيّ في السفر، والنهوض إلى الغارة، ونحو ذلك» [@diwan-nabigha، ص25]. فالسوط أخفّ ما تحمله اليد، والعجز عنه عجز تام."
vocabulary:
  - term: "مَا إِنْ"
    text: "«ما» للنفي، و«إن» زائدة تؤكده (انظر النحو)."
  - term: "إِذًا"
    text: "حرف جواب وجزاء، أي إن كان الأمر كذلك."
  - term: "سَوْطِي"
    text: "السوط ما يُضرب به من جلد مضفور، يحثّ به الراكب مطيّته."
context: "جواب القسم الذي بدأ في البيتين 37–38، قال الأَعْلَم في رواية «مَا قُلْتُ مِنْ سَيِّئٍ»: «جواب قوله: «فلا لعمر الذي مسّحت كعبته»» [@diwan-nabigha، ص25]، ومثله عند البَغْداديّ [@khizana، ج8 ص451]. وهو البيت التاسع والثلاثون عند الأَعْلَم أيضًا. وهو من الأبيات الأربعة التي يروي ابن قُتَيْبة أن النابِغة دسّها إلى النُّعْمان، فعرف أنها شعره فأمّنه [@ibn-qutayba، ج1 ص166]. وهنا يطبّق النابِغة ما يجعله ابن رَشِيق حق المعتذر إلى الملوك: «ولا يعترف بما لم يجنه خوف تكذيب سلطانه أو رئيسه، ويحيل الكذب على الناقل والحاسد» [@ibn-rashiq، ج2 ص176]، فهو ينفي الذنب نفيًا قاطعًا، ثم يحيل في البيتين التاليين على الحاسد والقاذف. ويقول شَوْقي ضَيْف إنه «يستنزل غضب ربه عليه إن كان غير صادق، ولتشلّ يده إن كان ما يقول الوشاة صحيحا» [@deif، ج1 ص287]."
syntax:
  - "«مَا» نافية، و«إِنْ» زائدة للتوكيد. قال التِّبْرِيزِيّ: «(إنْ) هنا توكيد إلا أنها تكف (ما) عن العمل، كما أن (ما) تكف أن عن العمل في قولك: إنما زيد منطلق» [@tabrizi-ashr، ص319]. وقال البَغْداديّ: «وما نافية وإن زيدت بعدها للتوكيد. وبه استشهد ابن هشام في المغني» [@khizana، ج8 ص451]."
  - "«أَتَيْتُ» فعل وفاعل، و«بِشَيْءٍ» متعلق به، وجملة «أَنْتَ تَكْرَهُهُ» نعت لـ«شَيْءٍ»: «أَنْتَ» مبتدأ، وجملة «تَكْرَهُهُ» خبره. والجملة كلها جواب القسم لا محل لها."
  - "«إِذًا فَلَا رَفَعَتْ سَوْطِي إِلَيَّ يَدِي» «إذًا» حرف جواب وجزاء، والفاء رابطة. قال البَغْداديّ: «على أن إذن إذا كانت للشرط في المستقبل. جاز دخول الفاء في جزائها كما في جزاء إن كما في البيت كأنه قال: إن أتيت بشيء فلا رفعت»، ثم قال: «فجملة فلا رفعت إلخ جملة دعائية وقعت جزاء» [@khizana، ج8 ص450]. و«لا» نافية للدعاء، و«رَفَعَتْ» فعل ماض لفظًا مستقبل معنًى لأنه دعاء، و«سَوْطِي» مفعول به، و«إِلَيَّ» متعلق بـ«رَفَعَتْ»، و«يَدِي» فاعل مؤخر."
morphology:
  - "«إِذًا» تُكتب بالألف وتُنطق بالنون الساكنة «إِذَنْ»، ولذلك تُقطَّع في الوزن «إِذَنْ»."
  - "«رَفَعَتْ» ماض أُريد به الدعاء، والعرب تجعل الماضي في الدعاء كقولهم: لا فضّ الله فاك."
  - "«تَكْرَهُهُ» مضارع «كَرِهَ يَكْرَهُ» على «فَعِلَ يَفْعَلُ»."
rhetoric:
  thesis: "بعد القسم الطويل يأتي الجواب قصيرًا حاسمًا: ما فعلت. ثم يربطه بعقوبة يدعو بها على نفسه، فيصير الصدق مرهونًا بيده التي يعيش بها. والمعتذر لا يجادل في التهمة، بل يحلف وينفي، كما يريد ابن رَشِيق."
  devices:
    - title: "الكناية في «فَلَا رَفَعَتْ سَوْطِي إِلَيَّ يَدِي»"
      text: "أراد: شُلّت يدي، فلم يقله بلفظه، بل ذكر ما يلزم الشلل: العجز عن رفع السوط، وهو أخف ما يُحمل. قال البَغْداديّ: «أراد به: شلت يدي» [@khizana، ج8 ص451]. ويقول عبد القاهر الجُرْجانيّ في أمثلة الكناية: «فقد أرادوا في هذا كُله، كما تَرى، معنًى، ثمَّ لم يَذْكُروه بلفظِه الخاصِّ به، ولكنّهُم تَوصَّلوا إِليه بِذِكْر معنًى آخر مِنْ شأنِه أن يَرْدُفَه في الوجود» [@dalail، ص66]. واختيار السوط له معنى عند الأَعْلَم: الرجل لا يستغني عنه في السفر والغارة، فالشلل الذي يدعو به على نفسه يقطعه عن حياة الفارس كلها."
    - title: "التوكيد في «مَا إِنْ»"
      text: "زاد «إن» بعد «ما» فقوّى النفي، كما قال التِّبْرِيزِيّ: «(إنْ) هنا توكيد» [@tabrizi-ashr، ص319]. فالنفي ليس نفيًا عاديًّا، بل نفي من يحلف."
  connection: "ثم يزيد الدعاء على نفسه: إذًا فليعاقبني ربي عقابًا تقرّ به عين الحاسد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "مَا إِنْ أَتَيْ / تُ بِشَيْ / ءِنْ أَنْتَ تَكْ / رَهُهُو = مستفعلن / فعِلن / مستفعلن / فعِلن — إِذَنْ فَلَا / رَفَعَتْ / سَوْطِي إِلَيْ / يَ يَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «تَكْرَهُهُ»."
variants:
  - reading: "مَا قُلْتُ مِنْ سَيِّئٍ مِمَّا أُتِيتَ بِهِ"
    status: "رواية الأَعْلَم، وهو البيت 39 عنده، وبها ينشده ابن رَشِيق وشَوْقي ضَيْف"
    note: "[@diwan-nabigha، ص25] [@ibn-rashiq، ج2 ص177] [@deif، ج1 ص287]. أي ما قلت شيئًا سيئًا مما نُقل إليك عني. ويقول محقق الديوان: «وفى التبريزى: ما إن أتيت بشىء أنت تكرهه» [@diwan-nabigha، ص235]."
  - reading: "مَا إِنْ نَدِيتُ بِشَيْءٍ أَنْتَ تَكْرَهُهُ"
    status: "رواية ابن السِّكِّيت"
    note: "يقول محقق الديوان: «ابن السكيت: ما إن نديت بشىء أنت تكرهه» [@diwan-nabigha، ص235]. وفي اللسان: «وما نديت بشيء تكرهه»، أي ما أصابني منه شيء، وينشد البيت [@lisan، ج15 ص314]."
  - reading: "مَا إِنْ بَدَأْتُ بِشَيْءٍ أَنْتَ تَكْرَهُهُ"
    status: "رواية ابن قُتَيْبة"
    note: "[@ibn-qutayba، ج1 ص166]. وفي نسخة الشاملة للتِّبْرِيزِيّ «ما أن» و«بِشْيءِ» و«إذا» و«إلى يدي»، وكلها أخطاء طبع صحّحناها بالشرح والوزن وبنص الأَعْلَم."
