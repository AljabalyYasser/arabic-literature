first: "فَحَسَّبُوهُ فَأَلْفَوْهُ كَمَا حَسَبَتْ"
second: "تِسْعًا وَتِسْعِينَ لَمْ تَنْقُصْ وَلَمْ تَزِدِ"
meaning: "فعدّوا الحمام فوجدوه كما حسبت: تسعًا وتسعين، لم ينقص واحدة ولم يزد. وتفسير ذلك أن الحمام الذي رأته كان ستًّا وستين، فإذا أضيف إليه نصفه، وهو ثلاث وثلاثون، صار تسعًا وتسعين، ثم تتمّ المئة بحمامتها في البيت التالي. قال التِّبْرِيزِيّ: «وكان الحمام الذي رأته ستة وستين»، ثم قال: «وقولها (إلى حمامتيه) أي مع حمامتيه؛ فيكون سبعة وستين، ونصف ما رأته ثلاثة وثلاثون، فيكون مائة كما قالت» [@tabrizi-ashr، ص317]. وقال الأَعْلَم: «يقول: حسبوا القطا وضمّوا إليه نصفه، فألفوه تسعًا وتسعين، كما حسبت» [@diwan-nabigha، ص24]."
vocabulary:
  - term: "فَحَسَّبُوهُ"
    text: "فعدّوه، والتشديد للتكثير، أي عدّوه عدًّا دقيقًا."
  - term: "فَأَلْفَوْهُ"
    text: "«وجدوه» [@tabrizi-ashr، ص317]."
  - term: "حَسَبَتْ"
    text: "عدّت."
context: "خاتمة الامتحان: يتحقق القوم من قول الفتاة فيجدونه صادقًا. وبه يصح التشبيه الذي بدأ في البيت 27: الحكم الحكيم هو الذي يثبت عند الفحص. وهو من أبيات الفتاة التي يقول شَوْقي ضَيْف إنها «واضحة الانتحال» [@deif، ج1 ص280]. وهو البيت الخامس والثلاثون عند الأَعْلَم."
syntax:
  - "«فَحَسَّبُوهُ» الفاء عاطفة، و«حَسَّبُوا» فعل ماض، والواو فاعل يعود إلى قوم الفتاة المفهومين من السياق، والهاء مفعول به يعود إلى الحمام. و«فَأَلْفَوْهُ» معطوف عليه."
  - "«كَمَا حَسَبَتْ»: «ما» مصدرية، والمصدر المؤول مجرور بالكاف، والجار والمجرور متعلق بمحذوف حال من الهاء، أي فوجدوه مطابقًا لحسابها."
  - "«تِسْعًا وَتِسْعِينَ» مفعول ثان لـ«أَلْفَى»، وهو من أفعال القلوب بمعنى «وجد» ينصب مفعولين، و«تِسْعِينَ» معطوف منصوب بالياء لأنه ملحق بجمع المذكر السالم. وجملتا «لَمْ تَنْقُصْ وَلَمْ تَزِدِ» حال مؤكدة."
morphology:
  - "«حَسَّبُوا» من «حَسَّبَ» على «فَعَّلَ»، والتضعيف للتكثير. و«حَسَبَتْ» من «حَسَبَ يَحْسُبُ» بمعنى عدّ، أما «حَسِبَ يَحْسَبُ» فبمعنى ظنّ."
  - "«أَلْفَوْا» ماضي «أَلْفَى» على «أفعل»، أصله «أَلْفَيُوا»، حُذفت الياء لالتقاء الساكنين بعد قلبها ألفًا."
  - "«تَزِدِ» مضارع «زَادَ» الأجوف، جُزم بـ«لم» فحُذفت ياؤه لالتقاء الساكنين، ثم كُسرت داله للقافية."
rhetoric:
  thesis: "البيت يغلق الحكاية بالتحقق: ما قالته الفتاة بنظرة أكّده العدّ بالتأني. وهذا بعينه ما يرجوه الشاعر: أن يُفحص أمره فيظهر صدقه."
  devices:
    - title: "الاحتراس في «لَمْ تَنْقُصْ وَلَمْ تَزِدِ»"
      text: "الاحتراس أن يُؤتى في الكلام بما يدفع عنه وهمًا. فبعد «كَمَا حَسَبَتْ» قد يظن السامع أنها قاربت العدد، فنفى النقص والزيادة معًا، فصارت الإصابة تامة."
    - title: "الجناس في «فَحَسَّبُوهُ» و«حَسَبَتْ»"
      text: "الجناس أن تتفق كلمتان في الحروف أو أكثرها ويختلف معناهما أو وزنهما. فالفعلان من أصل واحد: حسابها هي بنظرة، وتحسيبهم هم بالعدّ، فالتقى الفعلان على النتيجة نفسها."
  connection: "ثم يتمّ العدد مئة بحمامتها، ويصف سرعتها في الحساب."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَحَسْسَبُو / هُ فَأَلْ / فَوْهُو كَمَا / حَسَبَتْ = متفعلن / فعِلن / مستفعلن / فعِلن — تِسْعَنْ وَتِسْ / عِينَ لَمْ / تَنْقُصْ وَلَمْ / تَزِدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى و«فاعلن» الثانية من الصدر، فصارتا «متفعلن» و«فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «فَأَلْفَوْهُ»."
