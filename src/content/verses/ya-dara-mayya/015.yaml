first: "شَكَّ الْفَرِيصَةَ بِالْمِدْرَى فَأَنْفَذَهَا"
second: "شَكَّ الْمُبَيْطِرِ إِذْ يَشْفِي مِنَ الْعَضَدِ"
meaning: "طعن الثور فريصة الكلب بقرنه فأنفذه فيها، كما يطعن البيطار الدابة حين يداويها من داء العَضُد. قال التِّبْرِيزِيّ: «أي شك فريصة الكلب بقرنه» [@tabrizi-ashr، ص313]، وقال الأَعْلَم: «وشبه نفوذ القرن للفريصة ودخولها فيه بطعن البيطار، إذا داوى الإبل من العضد؛ وإنما خص الفريصة لأنها مقتل» [@diwan-nabigha، ص19]."
vocabulary:
  - term: "شَكَّ"
    text: "طعن فانتظم، قال الأَعْلَم: «أي انتظمها» [@diwan-nabigha، ص19]."
  - term: "الْفَرِيصَةَ"
    text: "«المضغة التي تُرعد من الدابة عند البيطار» [@tabrizi-ashr، ص313]. وعند الأَعْلَم: «موضع عقب الفارس، وقيل: هي بضعة في مرجع الكتف» [@diwan-nabigha، ص19]."
  - term: "الْمِدْرَى"
    text: "«ويريد بالمدرى قرن الثور» [@tabrizi-ashr، ص313]. والمدرى في الأصل حديدة يُحكّ بها الرأس، قال صاحب اللسان عن اللَّيْث: «ويقال مدرى، بغير هاء، ويشبه قرن الثور به» [@lisan، ج14 ص255]."
  - term: "الْمُبَيْطِرِ"
    text: "البيطار، وفي اللسان: «والمبيطر، معالج الدواب» [@lisan، ج4 ص69]."
  - term: "الْعَضَدِ"
    text: "«داء يأخذ في العضد، يقال: عضد يعضد عضدا» [@tabrizi-ashr، ص313]. وعند الأَعْلَم: «داء ووجع في العضد؛ من ثقل حمل أو غيره» [@diwan-nabigha، ص19]."
context: "ذروة المعركة: الطعنة القاتلة. يقول شَوْقي ضَيْف: «أهوى فيه الثور على خصمه بقرنيه، ولم يلبث أن طعنه بأحدهما طعنة نجلاء، نفذت إلى ظاهر صدره» [@deif، ج1 ص296]."
syntax:
  - "«شَكَّ» فعل ماض، فاعله ضمير الثور، و«الْفَرِيصَةَ» مفعول به، والألف واللام فيها عوض عن الضمير: فريصته، أي فريصة الكلب. و«بِالْمِدْرَى» متعلق بـ«شكّ»."
  - "«فَأَنْفَذَهَا» معطوف بالفاء التي تفيد التعقيب: طعن فأنفذ في الحال."
  - "«شَكَّ الْمُبَيْطِرِ» مفعول مطلق مبيّن للنوع، أي: شكًّا مثل شكّ المبيطر. و«إِذْ» ظرف لما مضى، وجملة «يَشْفِي» في موضع جر بإضافته إليها، و«مِنَ الْعَضَدِ» متعلق بـ«يشفي»."
morphology:
  - "«الْمِدْرَى» اسم آلة على «مِفْعَل» من «دَرَى»، ويقال «مِدْراة» بالهاء كما في اللسان."
  - "«الْمُبَيْطِر» اسم فاعل من «بَيْطَرَ» على «فَيْعَلَ»."
  - "«أَنْفَذَ» على «أفعل» للتعدية، من «نَفَذَ»."
rhetoric:
  thesis: "طعنة الثور ليست طعنة عمياء، بل طعنة حاذق يعرف أين يضرب، كالبيطار الذي يعرف موضع الداء. واختار الفريصة لأنها مقتل."
  devices:
    - title: "تشبيه الحركة بالحركة"
      text: "في «شَكَّ الْمُبَيْطِرِ» شبّه نفاذ القرن في الكلب بنفاذ أداة البيطار في الدابة حين يداويها. والتشبيه عند عبد القاهر الجُرْجانيّ قد يكون في الهيئة، «ويدخل في الهيئةِ حالُ الحركات في أجسامها، كتشبيه الذاهب على الاستقامة بالسَّهم السديد» [@asrar، ص90]. فالمشبه والمشبه به حركة طعن واحدة: دقيقة، نافذة، في موضع بعينه."
    - title: "تكرار «شَكَّ»"
      text: "بدأ الصدر بـ«شَكَّ» وبدأ العجز بـ«شَكَّ»، فالفعل والمصدر بلفظ واحد، فتتصل الطعنة بما شُبّهت به، ولا يحتاج السامع إلى أداة تشبيه."
    - title: "المفارقة في «إِذْ يَشْفِي»"
      text: "البيطار يطعن ليشفي، والثور يطعن ليقتل. فالتشبيه يجمع بين فعلين متشابهين في الصورة متضادين في الغاية، وهذا يزيد الطعنة قسوة."
  connection: "ثم يصف القرن خارجًا من الجنب الآخر للكلب، كأنه سفّود شواء."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "شَكْكَلْفَرِي / صَةَ بِلْ / مِدْرَى فَأَنْ / فَذَهَا = مستفعلن / فعِلن / مستفعلن / فعِلن — شَكْكَلْمُبَيْ / طِرِ إِذْ / يَشْفِي مِنَلْ / عَضَدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "طَعْنَ الْمُبَيْطِرِ إِذْ يَشْفِي مِنَ الْعَضَدِ"
    status: "رواية الأَعْلَم"
    note: "في نص الأَعْلَم [@diwan-nabigha، ص19]، وبها ينشده صاحب اللسان في مادة «بطر» [@lisan، ج4 ص69]. ويذكر محقق الديوان أن ابن السِّكِّيت والتِّبْرِيزِيّ يرويان «شك المبيطر» [@diwan-nabigha، ص235]."
