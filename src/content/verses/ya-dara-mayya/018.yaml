first: "لَمَّا رَأَى وَاشِقٌ إِقْعَاصَ صَاحِبِهِ"
second: "وَلَا سَبِيلَ إِلَى عَقْلٍ وَلَا قَوَدِ"
meaning: "لما رأى الكلب الآخر واشق صاحبه ضُمْران مقتولًا في مكانه، ورأى أنه لا سبيل إلى أخذ دية له ولا إلى قتل قاتله به... والجواب في البيت التالي: حدّثته نفسه باليأس. قال الأَعْلَم في العجز: «ضرب هذا مثلا، يعني أن صاحبه قتل - وهو ضمران - فلم يقتل به ولم يود» [@diwan-nabigha، ص20]."
vocabulary:
  - term: "وَاشِقٌ"
    text: "«اسم كلب» [@tabrizi-ashr، ص314]، وهو كلب آخر للصائد."
  - term: "إِقْعَاصَ"
    text: "«الموت الوحي، وأصله من القُعاص، وهو داء يأخذ الغنم لا يُلبثها حتى تموت» [@tabrizi-ashr، ص314]. والوَحِيّ: السريع."
  - term: "عَقْلٍ"
    text: "«غرم الدية» [@diwan-nabigha، ص20]، أي دفع المال عوضًا عن القتيل."
  - term: "قَوَدِ"
    text: "«قتل النفس بالنفس» [@diwan-nabigha، ص20]، أي القصاص."
context: "يبدأ ختام القصة بالكلب الثاني. ويرى شَوْقي ضَيْف أن الشاعر أعطى الحيوان نفوس البشر: «وهذا الوصف أكثر حيوية من النسيب السابق، لما بث النابغة في الحيوان من حياة الإنسان وعواطفه وقلقه وطمعه ويأسه»، فواشق «ينظر أخوه واشق فيرى أن القصاص غير ممكن» [@deif، ج1 ص296]."
syntax:
  - "«لَمَّا» ظرف بمعنى «حين» فيه معنى الشرط، وجوابه «قَالَتْ لَهُ النَّفْسُ» في البيت التالي."
  - "«رَأَى وَاشِقٌ»: «وَاشِقٌ» فاعل منوّن، فهو علم مصروف. و«إِقْعَاصَ» مفعول به، و«صَاحِبِهِ» مضاف إليه، والمصدر مضاف إلى مفعوله: أقعص الثورُ صاحبَه."
  - "«وَلَا سَبِيلَ إِلَى عَقْلٍ وَلَا قَوَدِ»: الواو للحال، و«لا» نافية للجنس، و«سَبِيلَ» اسمها مبني على الفتح، و«إِلَى عَقْلٍ» متعلق بمحذوف خبرها، و«وَلَا قَوَدِ» معطوف، و«لا» الثانية زائدة لتأكيد النفي."
morphology:
  - "«إِقْعَاص» مصدر «أَقْعَصَ» على «أفعل»: قتله مكانه."
  - "«وَاشِق» على «فاعل»، صار علمًا على الكلب."
  - "«عَقْل» مصدر «عَقَلَ القتيلَ» إذا أدى ديته، و«قَوَد» مصدر «قاد القاتلَ بالقتيل»."
rhetoric:
  thesis: "يدخل الشاعر عالم الكلاب بلغة القبيلة: الدية والقصاص. فالكلب المقتول له ثأر، وصاحبه يحسب حسابه كما يحسب الرجل في الجاهلية: هل يُدرك الثأر أم لا؟"
  devices:
    - title: "التشخيص بلغة القبيلة"
      text: "في «وَلَا سَبِيلَ إِلَى عَقْلٍ وَلَا قَوَدِ» استعار للكلاب أحكام الدماء بين القبائل. ويقول الأَعْلَم: «ضرب هذا مثلا» [@diwan-nabigha، ص20]، أي إن الكلام ليس على حقيقته، بل يجعل مقتل الكلب كمقتل رجل لا يُثأر له."
    - title: "«صَاحِبِهِ»"
      text: "لم يقل: الكلب الآخر، بل «صَاحِبِهِ»، فجعل بين الكلبين صحبة كصحبة الرجال، فيصير موقف واشق موقف رجل يرى رفيقه صريعًا."
    - title: "التضمين"
      text: "جواب «لَمَّا» لا يأتي في هذا البيت بل في الذي يليه. والتضمين عند ابن رَشِيق «أن تتعلق القافية أو لفظة مما قبلها بما بعدها» [@ibn-rashiq، ج1 ص171]، أي ألا يتم معنى البيت إلا بالبيت التالي. وهو هنا يُبقي السامع معلقًا: ماذا يفعل واشق؟"
  connection: "والجواب في البيت التالي: حدّثته نفسه أن لا مطمع."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "لَمْمَا رَأَى / وَاشِقُنْ / إِقْعَاصَ صَا / حِبِهِي = مستفعلن / فاعلن / مستفعلن / فعِلن — وَلَا سَبِي / لَ إِلَى / عَقْلِنْ وَلَا / قَوَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من العجز فصارت «متفعلن»، و«فاعلن» الثانية منه فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
