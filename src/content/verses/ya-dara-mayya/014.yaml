first: "فَهَابَ ضُمْرَانُ مِنْهُ حَيْثُ يُوزِعُهُ"
second: "طَعْنَ الْمُعَارِكِ عِنْدَ الْمُحْجَرِ النَّجُدِ"
meaning: "فخاف الكلب ضُمْران من الثور، حيث يغريه صاحبه به، طعنةَ المقاتل الشجاع إذا أُلجئ إلى موضع لا مهرب منه. وعلى هذا يفسره صاحب اللسان: «وفاعل يوزعه مضمر يعود على صاحبه أي يغريه صاحبه، وطعن منصوب بهاب، والنجد نعت المعارك ومعناه الشجاع» [@lisan، ج8 ص390]. وقال التِّبْرِيزِيّ: «وضمران: اسم كلب ويوزعه: يغريه، وقوله (منه) أي من الثور» [@tabrizi-ashr، ص313]."
vocabulary:
  - term: "ضُمْرَانُ"
    text: "«اسم كلب» [@tabrizi-ashr، ص313]. وفي ضبطه وجهان: رواه الأَصْمَعِيّ فيما رواه ابن السِّكِّيت «ضَمْران» بالفتح، «ورواه أبو عبيد ضُمران، وهو اسم كلب في الروايتين معا»، وقال الجَوْهَرِيّ إنه في شعر النابِغة «اسم كلبة» [@lisan، ج4 ص493]."
  - term: "يُوزِعُهُ"
    text: "«يغريه» [@tabrizi-ashr، ص313]. وفي اللسان: «وأوزعته بالشيء: أغريته فأوزع به، فهو موزع به أي مغرى به؛ ومنه قول النابغة» [@lisan، ج8 ص390]."
  - term: "الْمُعَارِكِ"
    text: "«المقاتل، والمعركة: موضع الحرب» [@diwan-nabigha، ص19]."
  - term: "الْمُحْجَرِ"
    text: "الذي أُلجئ إلى موضع لا يخرج منه، وعند الأَعْلَم: «الملجأ المدرك» [@diwan-nabigha، ص19]."
  - term: "النَّجُدِ"
    text: "«الشجاع، وهو من نعت المعارك» [@diwan-nabigha، ص19]."
context: "أول الكلاب يلقى الثور. ويرى شَوْقي ضَيْف أن المعركة هنا صارت «وكأنها معركة آدمية، فالثور يطعن طعن الرجل المدافع عن عرينه وحماه» [@deif، ج1 ص296]."
syntax:
  - "«فَهَابَ ضُمْرَانُ مِنْهُ»: «ضُمْرَانُ» فاعل مرفوع بلا تنوين، لأنه ممنوع من الصرف للعلمية وزيادة الألف والنون. و«مِنْهُ» متعلق بـ«هاب»، والهاء للثور."
  - "«حَيْثُ يُوزِعُهُ»: «حيث» ظرف مكان مبني على الضم، والجملة بعده في موضع جر بالإضافة. وفاعل «يُوزِعُهُ» ضمير الصائد، والهاء لضُمْران."
  - "«طَعْنَ الْمُعَارِكِ» مفعول به لـ«هاب»، كما قال صاحب اللسان. و«عِنْدَ الْمُحْجَرِ» ظرف متعلق بـ«طعن»، و«النَّجُدِ» صفة لـ«الْمُعَارِكِ» فُصل بينهما بالظرف، أو صفة لـ«الْمُحْجَرِ» على قول آخر في اللسان: «وإن جعلته نعتا للمحجر فهو من النجد وهو العرق» [@lisan، ج8 ص390]."
  - "وعلى رواية الرفع «طَعْنُ الْمُعَارِكِ» يكون «طعنُ» فاعل «يوزعه». قال التِّبْرِيزِيّ: «ومن رفع (طعن المعارك) رفعه بقوله يوزعه» [@tabrizi-ashr، ص313]."
morphology:
  - "«يُوزِع» مضارع «أَوْزَع» على «أفعل»، بمعنى أغرى."
  - "«الْمُعَارِك» اسم فاعل من «عارَك» على «فاعَل»، والمفاعلة فيه تدل على المشاركة في القتال."
  - "«الْمُحْجَر» اسم مفعول من «أَحْجَرَ»، أي أُلجئ إلى جُحر أو مضيق. و«النَّجُد» صفة على «فَعُل»."
rhetoric:
  thesis: "الثور الهارب يصير مقاتلًا: حين يُحاصَر يطعن طعن الفارس الشجاع. والشاعر يصف الكلاب والثور بلغة الحرب: معارِك، ومُحجَر، ونَجُد."
  devices:
    - title: "التشبيه بالمقاتل"
      text: "في «طَعْنَ الْمُعَارِكِ... النَّجُدِ» شبّه طعن الثور بقرنه بطعن الفارس الشجاع، ولم يذكر أداة تشبيه، بل أضاف الطعن إلى المعارك. فيصير الثور في عين السامع فارسًا، وهذا ما يسميه شَوْقي ضَيْف معركة آدمية [@deif، ج1 ص296]."
    - title: "اختيار «الْمُحْجَرِ»"
      text: "المقاتل المحاصر أشد قتالًا لأنه لا يجد مهربًا. فاختار للثور هذه الحال: الكلاب تحيط به، فلا يبقى له إلا أن يطعن."
    - title: "«فَهَابَ» في رواية التِّبْرِيزِيّ"
      text: "بدأ بخوف الكلب لا بشجاعته: صاحبه يغريه وهو يهاب. فيظهر الثور مهيبًا قبل أن يطعن."
  connection: "ثم يطعنه الثور بقرنه فينفذ فيه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَهَابَ ضُمْ / رَانُ مِنْ / هُ حَيْثُ يُو / زِعُهُو = متفعلن / فاعلن / متفعلن / فعِلن — طَعْنَلْ مُعَا / رِكِ عِنْ / دَلْمُحْجَرِنْ / نَجُدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى والثالثة من الصدر فصارتا «متفعلن»، و«فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "وَكَانَ ضُمْرَانُ مِنْهُ حَيْثُ يُوزِعُهُ"
    status: "رواية الأَصْمَعِيّ"
    note: "قال التِّبْرِيزِيّ: «وروى الأصمعي (وكان ضمران منه)» [@tabrizi-ashr، ص313]، وهي في نص الأَعْلَم، وفسّرها: «يقول: كان ضمران من الثور بالموضع الذي يغريه به صاحبه، كما تقول: أنا لك من هذا الأمر حيث تحب»، و«وقيل: المعنى: وكان ضمران منه، أي طعنه الثور فنظمه في قرنه، فكأنه من الثور» [@diwan-nabigha، ص19]. ويذكر محقق الديوان أن ابن السِّكِّيت والتِّبْرِيزِيّ يرويان «فهاب ضمران» [@diwan-nabigha، ص235]."
  - reading: "طَعْنُ الْمُعَارِكِ عِنْدَ الْمُحْجَرِ النَّجُدِ"
    status: "ضبط نسخة الشاملة للتِّبْرِيزِيّ"
    note: "بالرفع فاعلًا لـ«يوزعه»، وقد ذكر التِّبْرِيزِيّ هذا الوجه بقوله «ومن رفع» [@tabrizi-ashr، ص313]، فدلّ على أن متنه بالنصب، وبالنصب هو عند الأَعْلَم [@diwan-nabigha، ص19] وفي اللسان [@lisan، ج8 ص390]، فأثبتناه."
  - reading: "طَعْنَ الْمُعَارِكِ عِنْدَ الْمَحْجِرِ النَّجُدِ"
    status: "رواية اللسان"
    note: "بفتح الميم وكسر الجيم [@lisan، ج8 ص390]."
