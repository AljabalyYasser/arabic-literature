first: "فَكَمَّلَتْ مِائَةً فِيهَا حَمَامَتُهَا"
second: "وَأَسْرَعَتْ حِسْبَةً فِي ذَلِكَ الْعَدَدِ"
meaning: "فأتمّت الفتاة بحمامتها مئة كاملة، وكانت سريعة الحساب في ذلك العدد. قال الأَعْلَم في «وأسرعت حِسبةً»: «أي أسرعت في حساب القطا مع طيرانه وتراكبه، فكان ذلك كحكم هذه؛ إذ صدقت في عدده على هذه الحال» [@diwan-nabigha، ص24]، فجعل السرعة مع الصدق هي وجه الشبه بين حكم الفتاة وما يرجوه من حكم النُّعْمان."
vocabulary:
  - term: "فَكَمَّلَتْ"
    text: "فأتمّت. وفي اللسان: «ويقال: هذا المكمِّل عشرين والمكمِّل مائة» وينشد البيت [@lisan، ج11 ص598]."
  - term: "حِسْبَةً"
    text: "قال الأَصْمَعِيّ: «الحسبة: الجهة التي يحسب منها، وهي مثل اللبسة والجلسة، فقال: أسرعت أخذا في تلك الجهة، ويقال: ما أسرع حسبته، أي حسابه» [@tabrizi-ashr، ص317]. وفي اللسان: «وحَسَبَه أيضًا حِسْبةً: مثل القِعْدة والرِّكْبة» وينشد البيت [@lisan، ج1 ص313]."
context: "آخر أبيات الفتاة (27–31): يتمّ العدد مئة، ويُختم المثل بصفة السرعة. وبعده يعود الشاعر عند التِّبْرِيزِيّ إلى عطايا النُّعْمان، أما عند الأَعْلَم فهذا البيت هو السادس والثلاثون، وبعده أبيات القسم، لأن أبيات العطايا عنده قبل أبيات الفتاة. وهو من الأبيات التي يقول شَوْقي ضَيْف إنها «واضحة الانتحال»، ثم يقبل ما سواها: «ونحن بعد ذلك نصحح بقية المعلقة» [@deif، ج1 ص280]."
syntax:
  - "«فَكَمَّلَتْ مِائَةً» الفاء عاطفة، و«كَمَّلَتْ» فعل ماض فاعله ضمير الفتاة، و«مِائَةً» مفعول به. وجملة «فِيهَا حَمَامَتُهَا» صفة لـ«مِائَةً»: «فِيهَا» خبر مقدم، و«حَمَامَتُهَا» مبتدأ مؤخر."
  - "«وَأَسْرَعَتْ» معطوفة على «كَمَّلَتْ»، و«حِسْبَةً» تمييز منصوب، أي أسرعت من جهة الحساب، أو مفعول مطلق مبيّن للنوع. و«فِي ذَلِكَ الْعَدَدِ» متعلق بـ«أَسْرَعَتْ»، و«الْعَدَدِ» بدل من اسم الإشارة."
morphology:
  - "«كَمَّلَتْ» من «كَمَّلَ» على «فَعَّلَ»، والتضعيف للتعدية."
  - "«حِسْبَة» على «فِعْلة» بكسر الفاء، وهي للهيئة، قال الأَعْلَم: «والحِسبة مثل الجِلسة والرِّكبة، وهي هيئة الفعل. والحَسبة – بالفتح – المرّة الواحدة» [@diwan-nabigha، ص24]. والفرق بين الوزنين: «فِعْلة» لهيئة الفعل، و«فَعْلة» لمرّة واحدة منه."
  - "«مِائَة» تُكتب بألف لا تُنطق، وتُقرأ «مِئَة»."
rhetoric:
  thesis: "يختم المثل بأمرين معًا: التمام في «فَكَمَّلَتْ مِائَةً» والسرعة في «وَأَسْرَعَتْ حِسْبَةً». فالحكم الذي يطلبه من النُّعْمان صادق كامل، ثم هو سريع لا يتأخر، وفي ذلك استعجال لطيف لعفو الملك."
  devices:
    - title: "ردّ العجز على الصدر في المعنى"
      text: "بدأت الحكاية في البيت 27 بقوله «وَاحْكُمْ كَحُكْمِ فَتَاةِ الْحَيِّ»، وتنتهي هنا بإصابتها التامة، فيعود السامع إلى الطلب الأول وقد رأى برهانه."
    - title: "الإشارة في «ذَلِكَ الْعَدَدِ»"
      text: "اسم الإشارة للبعيد يجمع ما سبق كله: ما رأته، ونصفه، وحمامتها، فيكتفي به عن إعادة الأرقام."
  connection: "ثم يعود إلى النُّعْمان وعطاياه: أعطى الناقة الكريمة والمواهب التي لا مِنّة فيها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَكَمْمَلَتْ / مِئَتَنْ / فِيهَا حَمَا / مَتُهَا = متفعلن / فعِلن / مستفعلن / فعِلن — وَأَسْرَعَتْ / حِسْبَتَنْ / فِي ذَالِكَلْ / عَدَدِي = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى في الشطرين فصارت «متفعلن»، و«فاعلن» الثانية من الصدر فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
