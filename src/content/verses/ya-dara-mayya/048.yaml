first: "أُنْبِئْتُ أَنَّ أَبَا قَابُوسَ أَوْعَدَنِي"
second: "وَلَا قَرَارَ عَلَى زَأْرٍ مِنَ الْأَسَدِ"
meaning: "أُخبرت أن أبا قابوس، وهو النُّعْمان، يتوعّدني، ولا يستقرّ أحد ولا يطمئن وهو يسمع زئير الأسد. قال الأَعْلَم: «أبو قابوس هو النُّعمان بن المنذر. ومعنى «أَوْعَدَني» هدّدني»، ثم قال: «يقول: وَعِيدُ النُّعمانِ لا تستقرّ معه نفسي ولا تطمئنّ؛ هَيْبَةً له، كما لا تطيق ولا تسكن على زئير الأسد» [@diwan-nabigha، ص26]."
vocabulary:
  - term: "أُنْبِئْتُ"
    text: "أُخبرت."
  - term: "أَبَا قَابُوسَ"
    text: "«أبو قابوس: النعمان بن المنذر» [@tabrizi-ashr، ص322]. وقال البَغْداديّ: «وقابوس معرب كاوس على وزن طاوس: اسم ملك من ملوك العجم» [@khizana، ج5 ص459]."
  - term: "أَوْعَدَنِي"
    text: "هدّدني. قال البَغْداديّ: «وأوعد بالألف لا يكون إلا في الشر بمعنى هددني» [@khizana، ج5 ص459]."
  - term: "قَرَارَ"
    text: "استقرار وسكون."
  - term: "زَأْرٍ"
    text: "صوت الأسد، قال الأَعْلَم: «وزَأْرُ الأسدِ وزئيرُه: صوتُه ووَعيدُه» [@diwan-nabigha، ص26]."
context: "بيت الوعيد، وقد سار مثلًا. وهو عند التِّبْرِيزِيّ قبل الختام، أما عند الأَعْلَم فهو البيت الحادي والأربعون، بعد أبيات القسم وقبل «مَهْلًا فِدَاءٌ لَكَ» [@diwan-nabigha، ص26]، وكذلك يرتّبه شَوْقي ضَيْف [@deif، ج1 ص287]، وبه يختم ابن رَشِيق ما اختاره من أبيات الاعتذار [@ibn-rashiq، ج2 ص177]، وهو أول الأبيات التي يروي ابن قُتَيْبة أن النابِغة دسّها إلى النُّعْمان حين عاد [@ibn-qutayba، ج1 ص165]. وقد صار مثلًا، قال ابن قُتَيْبة: «وممّا يتمثل به من شعره» ثم أنشده، وقال: «تمثّل به الحجّاج بن يوسف حين سخط عليه عبد الملك بن مروان» [@ibn-qutayba، ج1 ص158]، أي استشهد به الحَجّاج حين غضب عليه الخليفة عبد المَلِك بن مَرْوان، كما استشهد به النابِغة في غضب النُّعْمان. ويقول شَوْقي ضَيْف إن النابِغة هنا «يصور نفسه ضعيفا أمام النعمان وقوته وبطشه، ويمثله أسدا جائعا يزأر، وقد وقع منه موقع الفريسة» [@deif، ج1 ص287]."
syntax:
  - "«أُنْبِئْتُ» فعل ماض مبني للمجهول، و«أَنْبَأَ» يتعدى إلى ثلاثة مفاعيل: التاء نائب الفاعل، وهي المفعول الأول في الأصل، و«أَنَّ» وما بعدها سدّت مسدّ المفعولين الآخرين."
  - "«أَبَا قَابُوسَ» اسم «أنّ» منصوب بالألف لأنه من الأسماء الخمسة، و«قَابُوسَ» مضاف إليه مجرور بالفتحة، وفي اللسان: «وقابوس لا ينصرف للعجمة والتعريف» [@lisan، ج6 ص168]. وجملة «أَوْعَدَنِي» خبر «أنّ»."
  - "«وَلَا قَرَارَ عَلَى زَأْرٍ مِنَ الْأَسَدِ» الواو استئنافية، و«لا» نافية للجنس، و«قَرَارَ» اسمها مبني على الفتح، و«عَلَى زَأْرٍ» متعلق بمحذوف خبرها، و«مِنَ الْأَسَدِ» متعلق بمحذوف نعت لـ«زَأْرٍ». والجملة عامة لا يُذكر فيها الشاعر ولا الملك، ولذلك صلحت مثلًا."
morphology:
  - "«أُنْبِئْتُ» ماضي «أَنْبَأَ» المبني للمجهول على «أُفْعِلَ»، ومثله «نُبِّئْتُ» من «نَبَّأَ» على «فُعِّلَ» في الرواية الأخرى، وكلاهما بمعنى أُخبرت."
  - "«أَوْعَدَ» على «أَفْعَلَ» من الوعد، وهو بالهمزة للشرّ وحده كما قال البَغْداديّ [@khizana، ج5 ص459]."
  - "«زَأْر» مصدر «زَأَرَ»، قال التِّبْرِيزِيّ: «ويقال: زَأَرَ الأسد يزئر يزأر زأراً وزئيراً» [@tabrizi-ashr، ص322]، فمضارعه بالكسر والفتح، ومصدره «زَأْر» و«زَئِير»."
  - "«قَرَار» مصدر «قَرَّ» على «فَعَال»."
rhetoric:
  thesis: "في الشطر الأول خبر: بلغني وعيدك. وفي الشطر الثاني حكم عام: لا يستقرّ أحد على زئير الأسد. فالشاعر لا يقول إنه خائف، بل يترك الصورة تقوله، ويجعل الملك أسدًا في الوقت نفسه، فيمدحه بالقوة وهو يشكو منها. وهذا ما يريده ابن رَشِيق من المعتذر: أن يعرف «كيف يأخذ بقلب المعتذر إليه، وكيف يمسح أعطافه» [@ibn-rashiq، ج2 ص176]."
  devices:
    - title: "التمثيل في «وَلَا قَرَارَ عَلَى زَأْرٍ مِنَ الْأَسَدِ»"
      text: "قال البَغْداديّ: «وهذا تمثيل لغضبه» [@khizana، ج5 ص460]. والتمثيل عند عبد القاهر الجُرْجانيّ تشبيه يُحتاج في وجه الشبه إلى تأوّل، وله أثر خاص إذا جاء بعد المعنى: «أن التمثيل إذا جاءَ في أعقاب المعاني، أو بَرَزَتْ هي باختصار في مَعرِضه، ونُقِلت عن صُوَرها الأصلية إلى صورته، كساها أُبَّهةً». ثم يذكر أثره في الاعتذار خاصة: «وإن كان اعتذاراً، كان إلى القَبُول أقرب، وللقلوب أخْلَب، وللسَّخائم أسلّ، ولغَرْب الغَضَبْ أفلَّ» [@asrar، ص115]. والسخائم الأحقاد، وأسلّ لها أي أشدّ انتزاعًا لها، وغَرْب الغضب حدّته، وأفلّ له أي أشدّ كسرًا له. فالمعنى الذي في الشطر الأول، خوفي من وعيدك، جاء بعده تمثيل يصوّره، فصار الاعتذار أقرب إلى أن يُقبل."
    - title: "المثل"
      text: "المثل قول موجز يسير بين الناس فيُقال في كل حال تشبه حاله الأولى. وقد صار هذا البيت كذلك، فعدّه ابن قُتَيْبة مما يُتمثّل به، وتمثّل به الحَجّاج [@ibn-qutayba، ج1 ص158]. والذي جعله صالحًا لذلك عجزه العام: لا يذكر النُّعْمان ولا النابِغة، بل كل خائف أمام كل قويّ."
    - title: "المدح في ثنايا الشكوى"
      text: "جعل الملك أسدًا ولم يقل: كالأسد، فطوى التشبيه في الصورة. ففي الشكوى من الوعيد اعتراف بهيبة الملك، وهذا مدح يرضيه وهو يسمع الاعتذار."
  connection: "ثم يختم: هذا ثناء لا يطلب به عطاء، فإن سمعه الملك فما عرّض بطلب الصِّلة."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أُنْبِئْتُ أَنْ / نَ أَبَا / قَابُوسَ أَوْ / عَدَنِي = مستفعلن / فعِلن / مستفعلن / فعِلن — وَلَا قَرَا / رَ عَلَى / زَأْرِنْ مِنَلْ / أَسَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية في الشطرين فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]."
variants:
  - reading: "نُبِّئْتُ أَنَّ أَبَا قَابُوسَ أَوْعَدَنِي"
    status: "رواية ذكرها التِّبْرِيزِيّ، وبها ينشده ابن قُتَيْبة وابن رَشِيق والبَغْداديّ وصاحب اللسان"
    note: "«ويروى (نُبِّئْتُ)» [@tabrizi-ashr، ص322]، وبها ينشده ابن قُتَيْبة [@ibn-qutayba، ج1 ص158] وابن رَشِيق [@ibn-rashiq، ج2 ص177] وصاحب اللسان [@lisan، ج6 ص168]. وقال البَغْداديّ: «نبئت بالبناء للمفعول بمعنى أخبرت. وروى أنبئت» [@khizana، ج5 ص459]."
  - reading: "أُنْبِئْتُ أَنَّ أَبَا قَابُوسَ أَوْعَدَنِي / وَلَا قَرَارَ عَلَى زَأْرٍ مِنَ الْأَسَدِ"
    status: "رواية الأَعْلَم، وهو البيت 41 عنده"
    note: "بلفظ نصّنا [@diwan-nabigha، ص26]، وكذلك عند شَوْقي ضَيْف [@deif، ج1 ص287]. وفي نسخة الشاملة للتِّبْرِيزِيّ «أن» بلا تشديد و«أو عَدَنِي» مفصولة، وهما خطآن في الطبع."
