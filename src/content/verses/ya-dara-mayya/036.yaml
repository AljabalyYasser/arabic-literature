first: "وَالْأُدْمَ قَدْ خُيِّسَتْ فُتْلًا مَرَافِقُهَا"
second: "مَشْدُودَةً بِرِحَالِ الْحِيرَةِ الْجُدُدِ"
meaning: "ويهب النوق البيض، قد ذُلّلت بالركوب فصارت سهلة الانقياد، مرافقها بائنة عن جنوبها فلا تجرحها في سيرها، وعليها رحال الحِيرة الجديدة مشدودة، فهي عطية تامة تُركب لساعتها. قال التِّبْرِيزِيّ: «الأدم: النوق، وخُيِّست: ذُلّلت» [@tabrizi-ashr، ص319]، وقال الأَعْلَم: «والحيرة: مدينة النُّعمان، وإليها تُنسب الرِّحال» [@diwan-nabigha، ص22]."
vocabulary:
  - term: "الْأُدْمَ"
    text: "قال الأَعْلَم: «الأُدْم من الإبل: البيض، ومن النساء: السُّمْر» [@diwan-nabigha، ص22]، والواحدة أَدْماء."
  - term: "خُيِّسَتْ"
    text: "«ذُلِّلت بالركوب» [@diwan-nabigha، ص22]. وفي اللسان أن الإبل المخيَّسة «التي لم تُسَرَّح، ولكنها خُيِّست للنحر أو القسم»، وينشد البيت [@lisan، ج6 ص75]."
  - term: "فُتْلًا"
    text: "جمع فَتْلاء، قال الأَعْلَم: «التي بانت مرافقها عن آباطها، فلا يُصيبها ضاغط ولا حازّ»، ثم فسّر ذلك: «وهو جرح يُصيب كراكرها، إذا صكّتها مرافقُها» [@diwan-nabigha، ص22]، والكِرْكِرة صدر البعير الذي يبرك عليه."
  - term: "مَرَافِقُهَا"
    text: "جمع مِرْفَق، وهو موصل الذراع بالعضد."
  - term: "الْحِيرَةِ"
    text: "«مدينة النُّعمان» [@diwan-nabigha، ص22]."
  - term: "الْجُدُدِ"
    text: "الجديدة، جمع جديد."
context: "آخر أبيات العطايا (32–36) عند التِّبْرِيزِيّ، وبه يتم التعداد: الناقة الكريمة، والمئة، والجواري، والخيل، ثم النوق المذللة المرحولة. وهو البيت التاسع والعشرون عند الأَعْلَم، فهو عنده قبل الجواري والخيل. وفي ذكر «الْحِيرَةِ» عودة إلى الملك نفسه بعد أن ابتعد بالوصف إلى المراعي: فالرحال صناعة مدينة النُّعْمان. وبعده يبدأ القسم، فينتقل الشاعر من ذكر نعمة الملك عليه إلى الحلف على أنه لم يكفر هذه النعمة."
syntax:
  - "«وَالْأُدْمَ» معطوف على «الْمِائَةَ» في البيت 33، منصوب، أي ويهب الأُدْم."
  - "«قَدْ خُيِّسَتْ» جملة حالية من «الْأُدْمَ»: «قد» حرف تحقيق، و«خُيِّسَتْ» ماض مبني للمجهول، ونائب الفاعل ضمير الأدم."
  - "«فُتْلًا» حال ثانية من «الْأُدْمَ»، و«مَرَافِقُهَا» فاعل لـ«فُتْلًا» لأنه صفة مشبهة تعمل عمل فعلها، أي فُتِلت مرافقها، فهي حال سببية: الوصف للمرافق، وصاحب الحال الأُدْم."
  - "«مَشْدُودَةً» حال ثالثة، و«بِرِحَالِ» متعلق به، و«الْحِيرَةِ» مضاف إليه، و«الْجُدُدِ» نعت لـ«رِحَالِ» مجرور."
morphology:
  - "«الْأُدْم» جمع «آدَم» للمذكر و«أَدْماء» للمؤنث على «فُعْل»، وهو قياس جمع «أفعل فعلاء» في الألوان."
  - "«فُتْل» جمع «فَتْلاء» على «فُعْل»، كما يقول محقق الديوان في حاشيته: «جمع فتلاء» [@diwan-nabigha، ص22]."
  - "«خُيِّسَتْ» ماضي «خَيَّسَ» المبني للمجهول على «فُعِّلَ»، والتضعيف للتكثير."
  - "«الْجُدُد» جمع «جَدِيد» على «فُعُل». قال التِّبْرِيزِيّ: «ويقال: جُدُد وجُدَد، والضم أجود لأنه الأصل، ولئلا يُشكل بجمع جُدَّة» [@tabrizi-ashr، ص319]، والجُدّة الطريقة، وجمعها جُدَد."
rhetoric:
  thesis: "يختم العطايا بما يربط الهبة بصاحبها: نوق مذللة عليها رحال الحِيرة. فالعطية لا تحتاج إلى شيء بعدها، والرحال تحمل اسم مدينة الملك، فكأن النابِغة يذكّر النُّعْمان بأن ما يصل إلى الناس من خير يصل من الحِيرة."
  devices:
    - title: "الكناية في «فُتْلًا مَرَافِقُهَا»"
      text: "الكناية أن يريد المتكلم معنى فلا يذكره بلفظه بل بما يلزمه. فبُعد المرفق عن الجنب يلزمه ألا يجرح البعير نفسه في السير، وهذا يلزمه القوة على السفر الطويل. وقد بيّن الأَعْلَم هذا اللزوم: إذا صكّت المرافق الكراكر جرحتها، «فربما امتنعت من السير لذلك» [@diwan-nabigha، ص22]. فالشاعر يمدح النوق بصفة خِلْقية، والمراد صبرها على الرحلة."
    - title: "التتميم في «مَشْدُودَةً بِرِحَالِ الْحِيرَةِ الْجُدُدِ»"
      text: "التتميم أن يُزاد في الكلام ما يكمّل معناه. فلم يكتف بأنها مذللة قوية، بل جعلها مرحولة برحال جديدة من صنع الحِيرة، فالعطية تامة لا ينقصها شيء."
  connection: "ثم يقسم بالبيت الذي حجّه سنين وبالدماء المهراقة على الأنصاب."
