  scansion: "وَلْأُدْمَ قَدْ / خُيْيِسَتْ / فُتْلَنْ مَرَا / فِقُهَا = مستفعلن / فاعلن / مستفعلن / فعِلن — مَشْدُودَتَنْ / بِرِحَا / لِلْحِيرَتِلْ / جُدُدِي = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية من العجز فصارت «فعِلن». والعروض والضرب مخبونان [@atiq، ص48]."
