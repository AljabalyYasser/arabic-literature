first: "وَاحْكُمْ كَحُكْمِ فَتَاةِ الْحَيِّ إِذْ نَظَرَتْ"
second: "إِلَى حَمَامٍ سِرَاعٍ وَارِدِ الثَّمَدِ"
meaning: "كن حكيمًا مصيب الرأي كفتاة الحي حين نظرت إلى سرب من الحمام مسرع يرد ماء قليلًا، فعدّته في لحظة وأصابت. والحكم هنا الحكمة لا القضاء، قال التِّبْرِيزِيّ: «أي كن حكيما كفتاة الحي إذ أصابت وجعلت الشيء في موضعه، وهي لم تحكم بشيء، إنما قالت قولا فأصابت فيه، ومعناه كُن في أمري حكيما، ولا تقبل ممن سعى بي» [@tabrizi-ashr، ص316]. وكذلك حكى يعقوب بن السِّكِّيت عن الرواة أن معنى البيت: «كُنْ حَكِيماً كَفَتَاةِ الْحَيِّ أَي إِذا قُلْتَ فأَصِبْ كَمَا أَصابت هَذِهِ المرأَة، إِذ نظَرَتْ إِلى الحمامِ فأَحْصَتْها ولم تُخْطِئ عَدَدَهَا» [@lisan، ج12 ص141–142]."
vocabulary:
  - term: "فَتَاةِ الْحَيِّ"
    text: "قال أبو عُبَيْدة: «وهي عين اليمامة، وزرقاء اليمامة» [@tabrizi-ashr، ص317]، وعند الأَعْلَم عن الأَصْمَعِيّ أنها بنت الخُسّ (انظر السياق)."
  - term: "سِرَاعٍ"
    text: "مسرعة، جمع سريعة."
  - term: "الثَّمَدِ"
    text: "«الماء القليل» [@tabrizi-ashr، ص316]."
context: "بعد أبيات سُلَيْمان يعود إلى خطاب النُّعْمان بفعل أمر: احكم. وبه تبدأ أبيات فتاة الحي والحمام (27–31). وفي الفتاة روايتان عند الأَعْلَم: «وحُكي عن الأصمعي أنه سمع قومًا من أهل البادية يحدّثون أن بنت الخُسّ كانت قاعدة في جوارٍ، فمرّ بها قطا واردة في مَضِيق من الجبل»، و«[وحكي عن أبي عبيدة] أن هذه زرقاء اليمامة، كانت من بقية طَسْم وجَدِيس، وكانت ترى من مسيرة ثلاثة أيام» [@diwan-nabigha، ص23]. وزَرْقاء اليَمامة في أخبار العرب امرأة حادّة البصر، وأخبار طَسْم وجَدِيس من قصص الأمم البائدة، تُروى ولا تُقرأ تاريخًا. ويقول شَوْقي ضَيْف في هذه الأبيات الخمسة: «وهى أبيات واضحة الانتحال» [@deif، ج1 ص280]، والانتحال عنده أن تُصنع الأبيات وتُنسب إلى الشاعر، وهذا رأيه، أما القدماء فرووها للنابِغة، وشرحها الأَصْمَعِيّ وأبو عُبَيْدة. وهذا البيت هو الثاني والثلاثون عند الأَعْلَم، فأبيات الفتاة عنده بعد أبيات العطايا، لا قبلها كما عند التِّبْرِيزِيّ."
syntax:
  - "«وَاحْكُمْ» الواو عاطفة، و«احْكُمْ» فعل أمر، والفاعل ضمير المخاطب. و«كَحُكْمِ» جار ومجرور متعلق بمحذوف صفة لمصدر محذوف، أي حكمًا كحكم فتاة الحي، و«فَتَاةِ» مضاف إليه، و«الْحَيِّ» مضاف إليه."
  - "«إِذْ نَظَرَتْ» ظرف لما مضى متعلق بـ«حُكْمِ»، والجملة بعده في محل جر بالإضافة. و«إِلَى حَمَامٍ» متعلق بـ«نَظَرَتْ»."
  - "«سِرَاعٍ» صفة لـ«حَمَامٍ»، و«وَارِدِ الثَّمَدِ» صفة ثانية، أُفردت لأن «حمام» اسم جنس لفظه مفرد، وجُمعت الأولى على المعنى."
morphology:
  - "«سِرَاع» جمع «سريع» و«سريعة» على «فِعَال»."
  - "«وَارِد» اسم فاعل من «وَرَدَ الماءَ» إذا أتاه ليشرب، وأضيف إلى مفعوله."
  - "«حَمَام» اسم جنس جمعي، واحده «حمامة»، وتقع الحمامة عند العرب على الذكر والأنثى."
rhetoric:
  thesis: "ينتقل من صورة الملك النبي إلى صورة امرأة من الناس، فيطلب من النُّعْمان حكمة تنفذ إلى الحقيقة بنظرة صادقة، كما نفذت عين الفتاة إلى عدد الحمام. والمراد، كما قال التِّبْرِيزِيّ: لا تقبل قول من سعى بي، وانظر في أمري بعينك."
  devices:
    - title: "التشبيه في «كَحُكْمِ فَتَاةِ الْحَيِّ»"
      text: "يشبّه حكم الملك المرجوّ بإصابة الفتاة، والجامع بينهما صدق النظر. وهو عند عبد القاهر الجُرْجانيّ من التشبيه الذي يُحتاج فيه إلى تأوّل، لأن الشبه بين عدّ الطيور وحكم الملك ليس في صورة ظاهرة، بل في معنى يُستخرج، فهو من النوع الثاني عنده: «أحدهما أن يكون من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل، والآخر أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]."
    - title: "الإشارة إلى خبر معروف"
      text: "لم يحكِ الشاعر قصة الفتاة كاملة، بل اكتفى بـ«فَتَاةِ الْحَيِّ»، فهو يعتمد على أن السامع يعرف الخبر، فيستدعيه بكلمتين. وهذا أوجز من القصّ."
  connection: "ثم يصف كيف كان الحمام: بين جانبي جبل، وعينها صافية كالزجاج."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "وَحْكُمْ كَحُكْ / مِ فَتَا / تِلْحَيْيِ إِذْ / نَظَرَتْ = مستفعلن / فعِلن / مستفعلن / فعِلن — إِلَى حَمَا / مِنْ سِرَا / عِنْ وَارِدِثْ / ثَمَدِي = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الثانية من الصدر فصارت «فعِلن»، و«مستفعلن» الأولى من العجز فصارت «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]. وتسقط همزة الوصل في «وَاحْكُمْ» فتتصل الحاء بالواو."
variants:
  - reading: "احْكُمْ كَحُكْمِ فَتَاةِ الْحَيِّ إِذْ نَظَرَتْ / إِلَى حَمَامٍ شِرَاعٍ وَارِدِ الثَّمَدِ"
    status: "رواية الأَعْلَم، وهو البيت 32 عنده"
    note: "بلا واو في أوله، و«شِراع» بالشين المعجمة، وفسّرها: «والشِّراع: القاصدة إلى الماء» [@diwan-nabigha، ص23–24]. ويذكر محقق الديوان أن ابن السِّكِّيت والتِّبْرِيزِيّ يرويان «إلى حمام سراع» [@diwan-nabigha، ص235]. وفي اللسان الروايتان: «سراع» عن الأزهري [@lisan، ج12 ص141]، و«شراع» في رواية الأَصْمَعِيّ [@lisan، ج12 ص159]."
