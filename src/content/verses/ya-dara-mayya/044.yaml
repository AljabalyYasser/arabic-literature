    status: "رواية الأَعْلَم، وهو البيت 44 عنده"
    note: "[@diwan-nabigha، ص26]. ويذكر محقق الديوان أن التِّبْرِيزِيّ يروي «ترمي أواذيه» [@diwan-nabigha، ص236]. وينشده شَوْقي ضَيْف بصدر الأَعْلَم وعجز التِّبْرِيزِيّ: «فما الفرات إذا هبّ الرياح له / ترمى أواذيّه العبرين بالزّبد» [@deif، ج1 ص287]."
