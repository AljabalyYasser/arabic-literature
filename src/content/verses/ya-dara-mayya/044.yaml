first: "فَمَا الْفُرَاتُ إِذَا جَاشَتْ غَوَارِبُهُ"
second: "تَرْمِي أَوَاذِيُّهُ الْعِبْرَيْنِ بِالزَّبَدِ"
meaning: "فليس نهر الفُرات، حين تفور أمواجه العالية وتقذف أمواجُه شاطئيه بالزبد، بأكرم من النُّعْمان. والجملة لا تتم في هذا البيت، فخبرها «بِأَجْوَدَ مِنْهُ» في البيت 47، قال الأَعْلَم: «يقول: ليس هذا النهر في أكمل أحواله بأجود منك» [@diwan-nabigha، ص26]. وقال التِّبْرِيزِيّ: «جاشت: فارت، والغوارب: ما علا منه، الواحد غارب، والأواذي: الأمواج» [@tabrizi-ashr، ص320]."
vocabulary:
  - term: "الْفُرَاتُ"
    text: "النهر المعروف بالعراق."
  - term: "جَاشَتْ"
    text: "«فارت» [@tabrizi-ashr، ص320]، أي ارتفعت واضطربت."
  - term: "غَوَارِبُهُ"
    text: "أعالي موجه، قال الأَعْلَم: «والغَوارب: الأمواج، وغارب كل جسم: ما ارتفع منه وعلا» [@diwan-nabigha، ص26]."
  - term: "أَوَاذِيُّهُ"
    text: "أمواجه، وفي اللسان: «والأواذي: الأمواج، واحدها آذي» [@lisan، ج4 ص530]."
  - term: "الْعِبْرَيْنِ"
    text: "«والعبران: الشطان» [@tabrizi-ashr، ص321]، أي الشاطئان. وفي اللسان: «وعبر الوادي وعبره؛ الأخيرة عن كراع: شاطئه وناحيته» [@lisan، ج4 ص529]."
  - term: "بِالزَّبَدِ"
    text: "الرغوة البيضاء على الماء المضطرب، قال الأَعْلَم: «والزَّبَد: ما يطرحه الوادي، إذا جاش ماؤه، واضطربت أمواجه» [@diwan-nabigha، ص26]."
context: "أول أبيات الفُرات (44–47)، وهي جملة واحدة تمتد أربعة أبيات: يبدأ بنفي «فَمَا الْفُرَاتُ»، ثم يصف النهر في فيضانه ثلاثة أبيات، ولا يأتي الخبر «بِأَجْوَدَ مِنْهُ» إلا في البيت 47. وهو البيت الرابع والأربعون عند الأَعْلَم أيضًا. ويقول شَوْقي ضَيْف إن النابِغة بعد الاستعطاف «يخرج من ذلك إلى مديحه»، ثم يقول في الصورة كلها: «وقد بدأ فشبهه بالفرات فى كرمه، ثم أخذ يصف الفرات فى ارتفاع فيضانه، وعمد إلى تفصيل الصورة، حتى يبرزها وحتى يظهر مقدرته الفنية فى دقة التصوير» [@deif، ج1 ص287–288]، ويرى أن النابِغة «دائما يحاول» أن يخترع مثل هذه الصورة «ليدل على براعته» [@deif، ج1 ص288]."
syntax:
  - "«فَمَا الْفُرَاتُ» الفاء استئنافية، و«ما» نافية تعمل عمل «ليس»، و«الْفُرَاتُ» اسمها مرفوع، وخبرها «بِأَجْوَدَ» في البيت 47، والباء فيه زائدة. قال ابن بَرِّيّ فيما ينقله اللسان: «وخبر ما النافية في بيت بعده» [@lisan، ج4 ص529]."
  - "«إِذَا جَاشَتْ غَوَارِبُهُ» «إذا» ظرف لما يستقبل من الزمان متعلق بمعنى التفضيل في «أَجْوَدَ»، وجملة «جَاشَتْ غَوَارِبُهُ» في محل جر بالإضافة: «جَاشَتْ» فعل ماض، و«غَوَارِبُهُ» فاعل."
  - "«تَرْمِي أَوَاذِيُّهُ الْعِبْرَيْنِ بِالزَّبَدِ» جملة في موضع نصب حال من «الْفُرَاتُ»: «تَرْمِي» فعل مضارع، و«أَوَاذِيُّهُ» فاعل، و«الْعِبْرَيْنِ» مفعول به منصوب بالياء لأنه مثنى، و«بِالزَّبَدِ» متعلق بـ«تَرْمِي»."
morphology:
  - "«جَاشَتْ» من «جاشَ يَجِيشُ» الأجوف اليائي، وأصل ألفه ياء."
  - "«غَوَارِب» جمع «غارِب» على «فَوَاعِل»."
  - "«أَوَاذِيّ» جمع «آذِيّ» على «فَوَاعِيل»، وهو الموج."
  - "«الْعِبْرَيْن» مثنى «عِبْر» على «فِعْل»."
rhetoric:
  thesis: "يجعل الفُرات في أعظم أحواله مقياسًا للجود، ثم ينفي أن يبلغ جود النُّعْمان. فالتشبيه هنا مقلوب الاتجاه: لا يقول إن الملك كالفُرات، بل إن الفُرات ليس بأجود منه. ثم يطيل وصف النهر حتى يمتلئ الذهن بعظمته، فيكون نفي تفوقه على الملك أبلغ."
  devices:
    - title: "التشبيه المنفي في «فَمَا الْفُرَاتُ ... بِأَجْوَدَ مِنْهُ»"
      text: "التشبيه أن يُلحق شيء بشيء في صفة. وهنا لا يُلحق الملك بالفُرات، بل يُفضَّل عليه، فيصير المشبه به هو الأدنى. ولذلك يحتاج الشاعر أن يعظّم الفُرات أولًا، فيصفه في فيضانه لا في هدوئه، كما قال الأَعْلَم: «في أكمل أحواله» [@diwan-nabigha، ص26]."
    - title: "تفصيل الصورة"
      text: "لم يكتف بذكر الفُرات، بل ذكر فوران أمواجه، وارتفاع أعاليها، وقذفها الزبد على الشاطئين. ويقول عبد القاهر الجُرْجانيّ إن التشبيه كلما دخله التفصيل احتاج إلى تأمل أكثر: «وكلّماكان أوغل في التفصيل، كانت الحاجةُ إلى التوقُّف والتذكُّر أكثر، والفقرُ إلى التأمّل والتمهُّل أشدّ» [@asrar، ص161]. وهذا ما يسميه شَوْقي ضَيْف «تفصيل الصورة» في هذا الموضع [@deif، ج1 ص288]."
    - title: "الاستعارة في «غَوَارِبُهُ»"
      text: "الغارب في الأصل من البعير، وفي اللسان: «والغارب: الكاهل من الخف، وهو ما بين السنام والعنق» [@lisan، ج1 ص644]، ثم قيل لأعلى كل شيء، كما قال الأَعْلَم: «وغارب كل جسم: ما ارتفع منه وعلا» [@diwan-nabigha، ص26]. فأمواج الفُرات العالية كظهور إبل مرتفعة، وهي صورة يعرفها أهل البادية."
  connection: "ثم يصف الأودية التي تمدّه، مملوءة صاخبة، تحمل ما تكسّر من النبت."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "فَمَلْ فُرَا / تُ إِذَا / جَاشَتْ غَوَا / رِبُهُو = متفعلن / فعِلن / مستفعلن / فعِلن — تَرْمِي أَوَا / ذِيْيُهُلْ / عِبْرَيْنِ بِزْ / زَبَدِي = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى و«فاعلن» الثانية من الصدر، فصارتا «متفعلن» و«فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «غَوَارِبُهُ»، وتسقط همزة الوصل في «الْعِبْرَيْنِ» فتتصل لامها بهاء «أَوَاذِيُّهُ»."
