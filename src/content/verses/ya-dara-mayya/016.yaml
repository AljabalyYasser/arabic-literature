first: "كَأَنَّهُ خَارِجًا مِنْ جَنْبِ صَفْحَتِهِ"
second: "سَفُّودُ شَرْبٍ نَسُوهُ عِنْدَ مُفْتَأَدِ"
meaning: "كأن قرن الثور، وهو خارج من الجنب الآخر للكلب، سفّود شواء لقوم يشربون، تركوه عند موضع النار حتى نضج ما فيه. قال الأَعْلَم: «يعني أن الثور طعن الكلب فخرج قرنه من الجنب الآخر، ثم ذهب به، فبقي الثور وحده، وليس معه أحد؛ فشبه القرن منتظما للكلب بسفود فيه شواء قد ترك ليس عنده أحد» [@diwan-nabigha، ص19]."
vocabulary:
  - term: "صَفْحَتِهِ"
    text: "جانبه، والضمير للكلب: «والضمير في صفحته راجع إلى ضمران وهو اسم كلب» [@khizana، ج3 ص186]."
  - term: "سَفُّودُ"
    text: "«الحديدة التي يشوى بها الكباب» [@khizana، ج3 ص186]."
  - term: "شَرْبٍ"
    text: "«قوم يشربون، واحدهم شارب، مثل تاجر وتجر، وزائر وزور، وصاحب وصحب» [@diwan-nabigha، ص19]."
  - term: "نَسُوهُ"
    text: "تركوه. قال الأَعْلَم: «أي تركوه حتى نضج ما فيه»، و«والنسيان في كلام العرب: الترك» [@diwan-nabigha، ص19]."
  - term: "مُفْتَأَدِ"
    text: "«المشتوى» [@tabrizi-ashr، ص313]. وفي اللسان: «والمفتأد: موضع الوقود» [@lisan، ج3 ص328]."
context: "أشهر صور القصيدة في معركة الثور، وهو من شواهد النحويين في الحال، أورده البَغْداديّ وذكر أن القصيدة «أضافها أبو جعفر احمد بن محمد بن إسماعيل النحوي» إلى المعلقات [@khizana، ج3 ص186]."
syntax:
  - "«كَأَنَّهُ»: الهاء اسم «كأنّ»، وهي للقرن. قال التِّبْرِيزِيّ: «الهاء من (كأنه) تعود على المدرى، وخارجا: حال، والخبر سَفُّود شرب» [@tabrizi-ashr، ص313]."
  - "«خَارِجًا» حال من الهاء. وفي عاملها نقل البَغْداديّ عن أبي عَلِيّ الفارِسِيّ: «العامل في خارجا ما في كأن من معنى الفعل»، ولا يصح أن يعمل فيها معنى التشبيه وحده «لتقدم الحال وهي لا تتقدم على ما يعمل فيها من المعاني» [@khizana، ج3 ص186]. أي إن «كأنّ» فيها معنى «أُشبّه»، فهي التي تنصب الحال المتقدمة على الخبر."
  - "«سَفُّودُ شَرْبٍ» خبر «كأنّ» مرفوع، و«شَرْبٍ» مضاف إليه. وجملة «نَسُوهُ» صفة لـ«سفّود»، و«عِنْدَ مُفْتَأَدِ» ظرف متعلق بـ«نسوه»."
morphology:
  - "«سَفُّود» على «فَعُّول»."
  - "«شَرْب» اسم جمع لـ«شارب» على «فَعْل»، كصَحْب جمع صاحب."
  - "«نَسُوهُ» أصله «نَسِيُوهُ»، حُذفت الياء وضُمّ ما قبل الواو."
  - "«مُفْتَأَد» اسم مكان على «مُفْتَعَل» من «افتأد» إذا اشتوى، وأصله من «الفَأْد»، وهو الشيّ."
rhetoric:
  thesis: "صورة مركبة من أشياء كثيرة: قرن نافذ، وكلب منتظم عليه، وسفّود فيه لحم، وشاربون غابوا. والتفصيل الأخير «نَسُوهُ» يحمل معنى زائدًا: بقي الثور وحده كسفّود تركه أصحابه، كما يقول الأَعْلَم."
  devices:
    - title: "التشبيه المركب"
      text: "لم يشبه القرن وحده بالسفّود، بل شبّه هيئة القرن وقد انتظم الكلب بهيئة سفّود عليه لحم. وهذا عند عبد القاهر الجُرْجانيّ تشبيه في الهيئة التي تجمع أكثر من شيء: «وكذلك التشبيه من جهة الهيئة»، ومنه ما يجمع «الصُّورة واللون معاً، كتشبيه الثُّريّا بعنقود الكَرْم المنوَّر» [@asrar، ص90]."
    - title: "التفصيل الزائد «نَسُوهُ»"
      text: "يكفي السفّود ليتم الشبه في الصورة، لكنه زاد «نَسُوهُ عِنْدَ مُفْتَأَدِ». فالسفّود المنسيّ يبقى على النار حتى ينضج ما فيه، والشرب غائبون. ويقرؤه الأَعْلَم إشارة إلى أن الثور بقي وحده، ليس معه أحد [@diwan-nabigha، ص19]."
    - title: "تقديم الحال"
      text: "قدّم «خَارِجًا» على خبر «كأنّ»، فجعل لحظة خروج القرن من الجنب الآخر أول ما يقع عليه النظر، قبل أن يأتي التشبيه."
  connection: "ثم يصف الكلب على القرن: يعضّه منقبضًا من الألم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَأَنْنَهُو / خَارِجَنْ / مِنْ جَنْبِ صَفْ / حَتِهِي = متفعلن / فاعلن / مستفعلن / فعِلن — سَفْفُودُ شَرْ / بِنْ نَسُو / هُ عِنْدَ مُفْ / تَأَدِي = مستفعلن / فاعلن / متفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى من الصدر والثالثة من العجز فصارتا «متفعلن». والعروض والضرب مخبونان [@atiq، ص48]. وفي نسخة الشاملة للتِّبْرِيزِيّ «خارجاُ» بضمة بعد الألف، وهو خطأ في الطبع، والتِّبْرِيزِيّ نفسه يقول: «وخارجا: حال» [@tabrizi-ashr، ص313]."
