first: "لَا تَقْذِفَنِّي بِرُكْنٍ لَا كِفَاءَ لَهُ"
second: "وَلَوْ تَأَثَّفَكَ الْأَعْدَاءُ بِالرِّفَدِ"
meaning: "لا ترمني بقوة لا يقوم لها أحد، ولو أحاط بك أعدائي من كل جانب كما تحيط الأثافي بالقدر، يتعاونون عليّ ويسعون بي عندك. قال التِّبْرِيزِيّ: «الكِفَاء: المثل»، و«تأثفك الأعداء»: «احتوشوك فصاروا منك موضع الأثافي من القدر، ومعنى (بالرفد) أي يتعاونون علىَّ ويسعون بي عندك» [@tabrizi-ashr، ص320]. وللبيت عند الأَعْلَم معنيان: الأول «أي لا ترمنّي بنفسك؛ فإنه لا مِثْلَ لك»، والأعداء «على هذا أعداء النابغة»، والثاني: «لا ترمنّي بما لا أطيق منك، ولا يقوم إليه أحد، ولا يكافئك فيه أعداؤك، ولو أحاطوا بك متعاونين عليك» [@diwan-nabigha، ص26]."
vocabulary:
  - term: "تَقْذِفَنِّي"
    text: "ترميني."
  - term: "بِرُكْنٍ"
    text: "الركن جانب الشيء الأقوى، قال الأَعْلَم: «وإنما ذكر الركن كناية عن الشدّة والقوّة؛ لأنه موضعها» [@diwan-nabigha، ص26]."
  - term: "كِفَاءَ"
    text: "مِثْل ونظير. وفي اللسان: «تقول: ما لي به قبل ولا كفاء أي ما لي به طاقة على أن أكافئه» [@lisan، ج1 ص139]."
  - term: "تَأَثَّفَكَ"
    text: "أحاطوا بك كالأثافي، وهي الحجارة الثلاثة التي توضع عليها القدر. وفي اللسان: «أي ترافدوا حولك متضافرين علي وأنت النار بينهم» [@lisan، ج14 ص114]. وفيه قول آخر عن أبي زَيْد: «تأثفك الأعداء أي اتبعوك وألحوا عليك ولم يزالوا بك يغرونك بي» [@lisan، ج14 ص113]."
  - term: "بِالرِّفَدِ"
    text: "بالتعاون، قال البَغْداديّ: «بكسر ففتح: جمع رفدة بكسر فسكون أي: يرفد بعضهم بعضا يتعاونون بالنمائم علي ويسعون بي عندك» [@khizana، ج6 ص183]."
context: "ثاني بيتي الاستعطاف (42–43)، وهو البيت الثالث والأربعون عند الأَعْلَم أيضًا. بعد أن طلب المهلة وبذل الفداء، يطلب ألا يُرمى بما لا يطيق. ويفسّره شَوْقي ضَيْف على المعنى الثاني عند الأَعْلَم: «ويقول له لا ترمنى بما لا أطيق منك، وأنت الذى لا يستطيع الأعداء مهما تآزروا أن يثبتوا له» [@deif، ج1 ص287]. وللبيت مكان في كتب الصرف، فقد قال البَغْداديّ عند البيت السابق: «وبعد هذا البيت بيت يورده علماء التصريف في كتبهم» [@khizana، ج6 ص183]، لأن «تَأَثَّفَكَ» يُحتج به في أصل كلمة «الأُثْفِيّة» (انظر الصرف)."
syntax:
  - "«لَا تَقْذِفَنِّي» «لا» ناهية، و«تَقْذِفَ» فعل مضارع مبني على الفتح لاتصاله بنون التوكيد الثقيلة، في محل جزم، والياء مفعول به، وأصله «تَقْذِفَنَّنِي» فحُذفت إحدى النونات تخفيفًا."
  - "«بِرُكْنٍ» متعلق بـ«تَقْذِفَ»، وجملة «لَا كِفَاءَ لَهُ» نعت لـ«رُكْنٍ»: «لا» نافية للجنس، و«كِفَاءَ» اسمها مبني على الفتح، و«لَهُ» متعلق بمحذوف خبرها."
  - "«وَلَوْ تَأَثَّفَكَ الْأَعْدَاءُ» الواو حالية، و«لو» وصلية تفيد أن ما قبلها ثابت حتى في هذه الحال، وجوابها محذوف يدل عليه ما قبلها، أي ولو تأثّفك الأعداء فلا تقذفني. و«تَأَثَّفَ» فعل ماض، والكاف مفعول به، و«الْأَعْدَاءُ» فاعل، و«بِالرِّفَدِ» متعلق بـ«تَأَثَّفَ» أو حال، أي متعاونين."
morphology:
  - "«تَأَثَّفَ» على «تَفَعَّلَ»، والهمزة فيه فاء الكلمة. ويحتج به من يجعل الهمزة أصلية في «أُثْفِيَّة»، قال البَغْداديّ: «فقوله: تأثفك وزنه تفعلك لا يصح فيه غيره ولو كان من ثفيت القدر لقال تثفاك. ومعناه صار أعدائي حولك كالأثافي تظافراً» [@khizana، ج2 ص316]."
  - "«الرِّفَد» جمع «رِفْدة» على «فِعَل»، كما في اللسان: «والرفد: جمع رفدة» [@lisan، ج9 ص4]."
  - "«كِفَاء» مصدر «كافَأَ» على «فِعَال»، ومعناه المماثلة والمكافأة."
  - "«الْأَعْدَاء» جمع «عَدُوّ» على «أَفْعال»."
rhetoric:
  thesis: "يجعل غضب الملك قوة لا تُقاوم، فهو لا يطلب أن يُعفى لأنه قوي، بل لأنه ضعيف أمام قوة لا مثل لها. ثم يضع الأعداء حول الملك كالأثافي حول القدر، فيرى الملك نفسه محاطًا بالوشاة، ويرى أن غضبه صنيعهم."
  devices:
    - title: "الكناية في «بِرُكْنٍ لَا كِفَاءَ لَهُ»"
      text: "الكناية عند عبد القاهر الجُرْجانيّ «أن يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة» [@dalail، ص66]، بل بمعنى يلزمه. فالركن جانب البناء الذي يقوم عليه، فذكره وأراد القوة، كما قال الأَعْلَم: «كناية عن الشدّة والقوّة» [@diwan-nabigha، ص26]."
    - title: "الاستعارة في «تَأَثَّفَكَ»"
      text: "الاستعارة أن يُنقل اللفظ من معناه الأصلي إلى معنى يشبهه. فالأثافي ثلاثة أحجار تحيط بالقدر من جوانبها، فجعل الأعداء أثافي حول الملك، ويزيد اللسان الصورة تمامًا: «وأنت النار بينهم» [@lisan، ج14 ص114]، أي هم يحيطون به ليوقدوا غضبه. فكلمة واحدة تحمل صورة كاملة: إحاطة، وتعاون، ونار تُشعل."
    - title: "احتمال المعنيين في «الْأَعْدَاءُ»"
      text: "يجوز أن يكونوا أعداء الشاعر يحرّضون الملك عليه، أو أعداء الملك لا يقدرون على مقاومته، وقد ذكر الأَعْلَم الوجهين [@diwan-nabigha، ص26]. وعلى الوجهين يخدم البيت الاعتذار: في الأول يحيل الشاعر غضب الملك على الوشاة، وفي الثاني يعظّم قوة الملك."
  connection: "ثم يخرج إلى المدح: ما الفُرات في فيضانه، وقد علت أمواجه ورمت شاطئيه بالزبد."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "لَا تَقْذِفَنْ / نِي بِرُكْ / نِنْ لَا كِفَا / ءَ لَهُو = مستفعلن / فاعلن / مستفعلن / فعِلن — وَلَوْ تَأَثْ / ثَفَكَلْ / أَعْدَاءُ بِرْ / رِفَدِي = متفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى و«فاعلن» الثانية من العجز، فصارتا «متفعلن» و«فعِلن». والعروض والضرب مخبونان [@atiq، ص48]. وتُشبَع ضمة الهاء في «لَهُ» فتصير «لَهُو»."
variants:
  - reading: "وَإِنْ تَأَثَّفَكَ الْأَعْدَاءُ بِالرِّفَدِ"
    status: "رواية الأَعْلَم، وهو البيت 43 عنده، وبها ينشده صاحب اللسان والبَغْداديّ وشَوْقي ضَيْف"
    note: "بـ«إن» في موضع «لو» [@diwan-nabigha، ص26] [@lisan، ج9 ص4] [@khizana، ج2 ص316] [@deif، ج1 ص287]. ويذكر محقق الديوان «ولو تأثفك» رواية للتِّبْرِيزِيّ [@diwan-nabigha، ص236]. وفي نسخة الشاملة للتِّبْرِيزِيّ «لاَ تَقْذِفَنَّي» و«لاَ كِفَاَء»، وهما خطآن في الضبط."
