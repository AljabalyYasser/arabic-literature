first: أَلَمْ أُنْضِ الْمَطِيَّ بِكُلِّ خَرْقٍ
second: أَمَقِّ الطُّولِ لَمَّاعِ السَّرَابِ
vocabulary:
- term: أُنْضِ
  text: أُهزل، من «أنضى البعيرَ» إذا أتعبه بالسير حتى هزل.
- term: الْمَطِيَّ
  text: الإبل التي تُركب.
- term: خَرْقٍ
  text: فلاة واسعة.
- term: أَمَقِّ الطُّولِ
  text: بعيد الطول.
