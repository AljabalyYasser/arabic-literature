vocabulary:
- term: فَبَعْضَ اللَّوْمِ
  text: 'أي: دعي بعض لومك وأقلّي منه.'
- term: عَاذِلَتِي
  text: 'التي تلومني، والمعنى: يا عاذلتي.'
- term: انْتِسَابِي
  text: نسبي وكرم أصلي.
