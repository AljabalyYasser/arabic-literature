first: "وَأَعْلَمُ أَنَّنِي عَمَّا قَرِيبٍ"
second: "سَأَنْشَبُ فِي شَبَا ظُفْرٍ وَنَابِ"
meaning: "وأنا أعلم أني بعد قليل سأعلق في حدّ أظفار الموت وأنيابه [@deif، ج1 ص259–260]."
vocabulary:
  - term: "عَمَّا قَرِيبٍ"
    text: "بعد قليل."
  - term: "أَنْشَبُ"
    text: "أعلق [@deif، ج1 ص259]."
  - term: "شَبَا"
    text: "شبا كل شيء: حدّه [@deif، ج1 ص259]."
syntax:
  - "«أَنَّنِي» «أنّ» واسمها ياء المتكلم، والنون الثانية نون الوقاية، وجملة «سَأَنْشَبُ» خبرها. و«أنّ» وما بعدها سدّت مسدّ مفعولي «أعلم»."
  - "«عَمَّا قَرِيبٍ» «عَنِ» حرف جر، و«ما» زائدة، و«قَرِيبٍ» مجرور، والجار والمجرور متعلق بـ«سَأَنْشَبُ»؛ ومثله في القرآن: ﴿عَمَّا قَلِيلٍ لَيُصْبِحُنَّ نَادِمِينَ﴾ [المؤمنون: 40]."
  - "«فِي شَبَا ظُفْرٍ» متعلق بـ«أنشب»، و«نابٍ» معطوف على «ظُفْرٍ»."
morphology:
  - "«أنشَب» مضارع «نَشِب» اللازم، بمعنى علِق."
  - "«ظُفْر» بسكون الفاء لغة في «ظُفُر»."
  - "«شَبَا» اسم مقصور، واحده «شَباة»."
rhetoric:
  thesis: "بعد أن رأى آباءه يسقطون، ينتقل إلى اليقين بمصيره: الموت وحش ينتظره بمخالبه وأنيابه."
  devices:
    - title: "الاستعارة المكنية"
      text: "شبّه الموت بسبُع ضارٍ، فحذفه وأبقى من لوازمه الظفر والناب. قال شوقي ضيف: «فالموت يفتح فاه، وأظفاره وأنيابه توشك أن تفترسه افتراسًا» [@deif، ج1 ص260]. وهو الضرب الذي يجعل فيه الشاعر «للشيء الشيء ليس له»، كما يقول عبد القاهر الجُرْجانيّ [@dalail، ص67]: فليس للموت ظفر ولا ناب."
    - title: "التوكيد"
      text: "أكّد يقينه بـ«أعلم»، ثم بـ«أنّ»، ثم بالسين في «سَأَنْشَبُ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "وَأَعْلَمُ أَنْ / نَنِي عَمْمَا / قَرِيبِنْ = مفاعلتن / مفاعلْتن / فعولن — سَأَنْشَبُ فِي / شَبَا ظُفْرِنْ / وَنَابِي = مفاعلتن / مفاعلْتن / فعولن"
  note: "لو قُرئت «ظُفُرٍ» بضم الفاء لجاءت التفعيلة «مفاعلتن» تامة، والوزن مستقيم في الحالين، لأن العَصْب جائز في حشو الوافر [@atiq، ص54]."
variants:
  - reading: "وَأَعْلَمُ أَنَّنِي عَمَّا قَلِيلٍ"
    status: "رواية شوقي ضيف"
    note: "كذا ينشده [@deif، ج1 ص259]، والمعنى واحد."
