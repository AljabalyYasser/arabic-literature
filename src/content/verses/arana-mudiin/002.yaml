first: "عَصَافِيرٌ وَذِبَّانٌ وَدُودٌ"
second: "وَأَجْرَأُ مِنْ مُجَلِّحَةِ الذِّئَابِ"
meaning: "نحن في ضعفنا كالعصافير والذباب والدود، ونحن مع ذلك أجرأ من الذئاب المصمِّمة على فرائسها. يقول شوقي ضيف: يرى الناس «ضعافًا كالعصافير والذباب والدود، ومع ذلك يسقطون على أطماعهم كالذئاب الضارية» [@deif، ج1 ص260]."
vocabulary:
  - term: "ذِبَّانٌ"
    text: "جمع ذُباب."
  - term: "مُجَلِّحَةِ الذِّئَابِ"
    text: "المصمِّمة التي لا ترجع عما تريد [@deif، ج1 ص259]."
syntax:
  - "«عَصَافِيرٌ» خبر لمبتدأ محذوف تقديره «نحن»، و«ذِبَّانٌ» و«دُودٌ» معطوفان عليه."
  - "«وَأَجْرَأُ» معطوف على «عَصَافِيرٌ»، فهو خبر ثانٍ: ونحن أجرأ. و«مِنْ مُجَلِّحَةِ» متعلق بـ«أجرأ»."
  - "«مُجَلِّحَةِ الذِّئَابِ» من إضافة الصفة إلى الموصوف، أي: الذئاب المجلِّحة."
morphology:
  - "«عَصَافِير» جمع «عُصْفُور» على صيغة منتهى الجموع «فعاليل»، وحقه المنع من الصرف. لكنه نُوّن هنا لإقامة الوزن، وصرف الممنوع من الصرف من الضرورات الجائزة للشاعر."
  - "«أجرأ» اسم تفضيل على «أفعل» من «جَرُؤ»، ممنوع من الصرف."
  - "«مُجَلِّحَةِ» اسم فاعل من «جلّح» المضعّف."
rhetoric:
  thesis: "البيت يجمع النقيضين في الإنسان: ضعف العصفور والذبابة والدودة، وجرأة الذئب. فالمخلوق الضعيف الذي يُخدع بالطعام يقتحم الأخطار كأنه لا يموت."
  devices:
    - title: "التشبيه البليغ"
      text: "حذف المبتدأ وأداة التشبيه ووجه الشبه: «(نحن) عصافير وذبان ودود»، فجعل الناس هذه الكائنات نفسها."
    - title: "الحذف"
      text: "لم يقل «نحن عصافير»، بل حذف المبتدأ وبدأ بالخبر مباشرة، فصار البيت حكمًا يُلقى دفعة واحدة. يقول عبد القاهر الجُرْجانيّ في الحذف: «فإنك ترى به ترك الذكر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "المفارقة"
      text: "قابل ضعف الشطر الأول بجرأة الشطر الثاني. قال الجاحِظ في معنى البيت: «فكأنه يخبر عن ضعف طباع الإنسان» [@hayawan، ج5 ص127]."
    - title: "التدرّج"
      text: "نزل من الطائر إلى الحشرة إلى الدود، ثم قفز إلى الذئب، فكان التناقض أشدّ وقعًا."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "عَصَافِيرُنْ / وَذِبْبَانُنْ / وَدُودُنْ = مفاعلْتن / مفاعلْتن / فعولن — وَأَجْرَأُ مِنْ / مُجَلْلِحَتِذْ / ذِئَابِي = مفاعلتن / مفاعلتن / فعولن"
  note: "دخل العَصْبُ تفعيلتي الصدر [@atiq، ص54]. ولا يستقيم الوزن إلا بتنوين «عَصَافِيرٌ»."
context: "أنشده الجاحِظ مع صدر البيت الأول في معنى «المسحَّر»، لكنه نسبه إلى لَبِيد [@hayawan، ج5 ص127]، وهو في ديوان امرئ القَيْس [@diwan-imru-al-qais، ص78] وعند شوقي ضيف [@deif، ج1 ص259]. ومثل هذا الاضطراب في النسبة كثير في الشعر الجاهلي."
