first: "أَرَانَا مُوضِعِينَ لِأَمْرِ غَيْبٍ"
second: "وَنُسْحَرُ بِالطَّعَامِ وَبِالشَّرَابِ"
meaning: "نحن نسرع كل يوم إلى أمر غائب عنا، هو الموت، ونُخدع عنه ونتلهّى بالطعام والشراب [@deif، ج1 ص259]."
vocabulary:
  - term: "مُوضِعِينَ"
    text: "مسرعين [@deif، ج1 ص259]، من «أوضع البعيرَ» إذا حمله على السير السريع."
  - term: "لِأَمْرِ غَيْبٍ"
    text: "يريد الموت المغيَّب [@deif، ج1 ص259]."
  - term: "نُسْحَرُ"
    text: "نتلهّى ونُخدع [@deif، ج1 ص259]. والمسحَّر: المخدَّع [@hayawan، ج5 ص127]."
syntax:
  - "«أَرَانَا» فعل مضارع، وفاعله ضمير مستتر تقديره «أنا»، و«نا» مفعوله الأول، و«مُوضِعِينَ» مفعوله الثاني إن كانت الرؤية علمية، أو حال إن كانت بصرية."
  - "«لِأَمْرِ غَيْبٍ» متعلق بـ«مُوضِعِينَ»، و«غَيْبٍ» مضاف إليه، أي: لأمر مغيَّب."
  - "«وَنُسْحَرُ» فعل مضارع مبني للمجهول، والواو حالية، والجملة في موضع الحال: نسرع إلى الموت ونحن مخدوعون عنه."
morphology:
  - "«مُوضِعِينَ» جمع «مُوضِع»، اسم فاعل من الرباعي «أوضع»."
  - "«نُسحَر» مضارع «سُحِر» المبني للمجهول، من السِّحر بمعنى الخداع. وقال قوم: هو من السَّحْر، وهو الرئة، أي: نُغذَّى بالطعام والشراب [@hayawan، ج5 ص127]."
  - "«غَيْبٍ» مصدر «غاب» وُصف به."
rhetoric:
  thesis: "مطلع بلا أطلال ولا نسيب: يبدأ الشاعر بالحقيقة الكبرى مباشرة. الناس كلهم مسافرون مسرعون إلى الموت، يلهيهم الطعام والشراب عن الطريق."
  devices:
    - title: "الكناية"
      text: "«أمر غيب» كناية عن الموت [@deif، ج1 ص259]."
    - title: "الاستعارة"
      text: "صوّر الحياة سفرًا حثيثًا، والناس ركبًا «مُوضِعِينَ» يسرعون بإبلهم نحو غاية لا يرونها."
    - title: "الطباق"
      text: "بين إسراعهم إلى الموت وتلهّيهم عنه بالطعام والشراب؛ فهم يعجلون إلى ما يغفلون عنه."
  connection: "ثم يقول ما نحن: «عَصَافِيرٌ وَذِبَّانٌ وَدُودٌ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "أَرَانَا مُو / ضِعِينَ لِأَمْ / رِ غَيْبِنْ = مفاعلْتن / مفاعلتن / فعولن — وَنُسْحَرُ بِطْ / طَعَامِ وَبِشْ / شَرَابِي = مفاعلتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر، ويدخل حشوَه العَصْب، وهو تسكين الخامس، فتصير «مفاعلَتن» «مفاعلْتن» [@atiq، ص54]. وقد دخل التفعيلة الأولى هنا."
context: "مطلع مقطوعة يرويها الأَصْمَعِيّ عن أبي عَمْرو بن العلاء، ويعدّها شوقي ضيف من أوثق شعره [@deif، ج1 ص246]، ويرى أنها «تصور حزنه على آبائه وما تجمّع عليه من البلاء» [@deif، ج1 ص258–259]."
