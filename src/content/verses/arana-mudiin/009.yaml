first: "وَقَدْ طَوَّفْتُ فِي الْآفَاقِ حَتَّى"
second: "رَضِيتُ مِنَ الْغَنِيمَةِ بِالْإِيَابِ"
meaning: "طفت في نواحي الأرض أطلب ملكي وثأري، حتى صرت أرضى من كل ما طلبته بأن أرجع سالمًا. وقد صار عجزه مثلًا «يُضرب عند القناعة بالسلامة» [@maydani، ج1 ص295]."
vocabulary:
  - term: "طَوَّفْتُ"
    text: "أكثرت الطواف والتنقل."
  - term: "الْآفَاقِ"
    text: "جمع أُفُق، وهو الناحية من الأرض."
  - term: "الْإِيَابِ"
    text: "الرجوع."
syntax:
  - "«قد» حرف تحقيق، و«طَوَّفْتُ» فعل وفاعل، و«فِي الْآفَاقِ» متعلق به."
  - "«حَتَّى» حرف ابتداء يفيد الغاية، والجملة بعدها «رضيت...» استئنافية لا محل لها."
  - "«مِنَ الْغَنِيمَةِ» متعلق بـ«رَضِيتُ»، و«مِنَ» فيه للبدل: رضيت بالإياب بدلًا من الغنيمة. و«بِالْإِيَابِ» متعلق بـ«رَضِيتُ» أيضًا."
morphology:
  - "«طَوَّفْتُ» على «فعّلت»، والتضعيف للتكثير."
  - "«الإياب» مصدر «آب يؤوب»، وأصله «إِواب»، قُلبت الواو ياء لانكسار ما قبلها، كما في «قيام» و«صيام»."
  - "«الْغَنِيمَةِ» فعيلة بمعنى مفعولة: ما يُغنم."
rhetoric:
  thesis: "بيت يلخّص حياة امرئ القَيْس بعد مقتل أبيه: طواف طويل بين القبائل والملوك، ونهاية لا يطلب فيها إلا الرجوع سالمًا."
  devices:
    - title: "المثل السائر"
      text: "قال المَيْدانيّ: «أول من قاله امرؤ القَيْس بن حُجْر في بيت له... يُضرب عند القناعة بالسلامة» [@maydani، ج1 ص295]. وعدّه ابن قُتَيْبة مما يُتمثّل به من شعره [@ibn-qutayba، ج1 ص114]."
    - title: "المفارقة"
      text: "جعل الإياب، وهو أقل ما يُطلب من سفر، غنيمةً يُرضى بها."
    - title: "صورة الخيبة"
      text: "قال شوقي ضيف: «وها هو اليوم يطوف في الآفاق وراء مجده المضيّع، فلا يظفر إلا بالخيبة واليأس القاتل» [@deif، ج1 ص260]."
  connection: "ثم يلتفت إلى آبائه: «أَبَعْدَ الْحَارِثِ الْمَلِكِ ابْنِ عَمْرٍو»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "وَقَدْ طَوْوَفْ / تُ فِلْ ءَافَا / قِ حَتْتَى = مفاعلْتن / مفاعلْتن / فعولن — رَضِيتُ مِنَلْ / غَنِيمَةِ بِلْ / إِيَابِي = مفاعلتن / مفاعلتن / فعولن"
  note: "دخل العَصْبُ تفعيلتي الصدر، وسلمت تفعيلتا العَجُز [@atiq، ص54]."
context: "يأتي بعد بيتين يتذكر فيهما أيام قوته: يُهزل الإبل في الفلوات، ويركب في الجيش الكثيف فيغنم [@deif، ج1 ص259]."
