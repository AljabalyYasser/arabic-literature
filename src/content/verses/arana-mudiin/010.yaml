first: "أَبَعْدَ الْحَارِثِ الْمَلِكِ ابْنِ عَمْرٍو"
second: "وَبَعْدَ الْخَيْرِ حُجْرٍ ذِي الْقِبَابِ"
meaning: "أبعد جدي الحارِث بن عَمْرو الملك، وبعد أبي حُجْر الخيّر صاحب القباب... والكلام يتم في البيت التالي: أأرجو من الدهر لينًا؟ [@deif، ج1 ص260]."
vocabulary:
  - term: "الْحَارِثِ"
    text: "جده الحارِث بن عَمْرو، ملّكه قُباذ ملك فارس على العرب [@ibn-qutayba، ج1 ص116]."
  - term: "حُجْرٍ"
    text: "أبوه، ملك بني أَسَد الذين قتلوه [@ibn-qutayba، ج1 ص107]."
  - term: "الْقِبَابِ"
    text: "الخيام الكبيرة [@deif، ج1 ص259]."
syntax:
  - "الهمزة للاستفهام الإنكاري، و«بعدَ» ظرف منصوب متعلق بالفعل «أُرَجِّي» في أول البيت التالي؛ فلا يتم معنى هذا البيت إلا بالذي بعده."
  - "«الْمَلِكِ» نعت للحارث، و«ابْنِ عَمْرٍو» نعت ثانٍ."
  - "«الْخَيْرِ» مضاف إليه، و«حُجْرٍ» بدل منه، و«ذِي الْقِبَابِ» نعت لحُجْر، و«ذِي» مجرور بالياء لأنه من الأسماء الخمسة."
morphology:
  - "«الْخَيْرِ» هنا صفة بمعنى الخيّر الكثير الخير."
  - "«الْقِبَابِ» جمع «قُبّة» على «فِعال»."
  - "تُكتب ألف «ابْنِ» هنا لأنه لم يقع بين علمين متصلين، ففصلت «الْمَلِكِ» بينه وبين «الْحَارِثِ»."
rhetoric:
  thesis: "يستدعي الشاعر آباءه بأسمائهم وألقابهم: الحارِث الملك، وحُجْر الخيّر ذو القباب. فالبيت قائمة موتى من بيت الملك، تمهّد لسؤال مرير في البيت التالي."
  devices:
    - title: "الاستفهام الإنكاري"
      text: "«أبعدَ...؟» أي: لا ينبغي أن أرجو شيئًا بعدهم."
    - title: "التضمين"
      text: "علّق البيت بما بعده، وهو ما يسميه ابن رَشِيق التضمين: «أن تتعلق القافية أو لفظة مما قبلها بما بعدها». ويعدّه عيبًا، «وكلما كانت اللفظة المتعلقة بالبيت الثاني بعيدة من القافية كان أسهل عيبًا» [@ibn-rashiq، ج1 ص171]. واللفظة هنا «بعدَ» في أول البيت، فهو أسهل التضمين."
    - title: "التكرار"
      text: "كرّر «بعد» مرتين، فعدّد مصيبتين متتاليتين."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "أَبَعْدَلْ حَا / رِثِلْ مَلِكِبْ / نِ عَمْرِنْ = مفاعلْتن / مفاعلتن / فعولن — وَبَعْدَلْ خَيْ / رِ حُجْرِنْ ذِلْ / قِبَابِي = مفاعلْتن / مفاعلْتن / فعولن"
  note: "همزة «ابْنِ» همزة وصل تسقط في النطق، فتتصل الكاف بالباء: «مَلِكِبْ نِ». ودخل العَصْبُ ثلاث تفعيلات [@atiq، ص54]."
context: "قُتل جده الحارِث أو توفي سنة 528م ([~528])، ومنذ ذلك انتقضت القبائل على أبيه وأعمامه [@deif، ج1 ص243]."
