first: "كَمَا لَاقَى أَبِي حُجْرٌ وَجَدِّي"
second: "وَلَا أَنْسَى قَتِيلًا بِالْكُلَابِ"
meaning: "كما لقي أبي حُجْر وجدي الحارِث مصيرهما، ولا أنسى عمي القتيل يوم الكُلاب [@deif، ج1 ص259–260]."
vocabulary:
  - term: "الْكُلَابِ"
    text: "بضم الكاف: ماء للعرب، كان عنده يومان مشهوران [@ibn-qutayba، ج1 ص123، الحاشية]."
  - term: "قَتِيلًا بِالْكُلَابِ"
    text: "عمه شُرَحْبِيل بن الحارِث [@deif، ج1 ص259]، وكان قاتله أخوه مَعْدِي كَرِب بن الحارِث [@ibn-qutayba، ج1 ص123]."
syntax:
  - "الكاف حرف جر للتشبيه، و«ما» مصدرية، والمصدر المؤول مجرور بالكاف، والجار والمجرور متعلق بـ«سَأَنْشَبُ» في البيت السابق: سأنشب كما لاقى أبي."
  - "«أَبِي» فاعل «لَاقَى» مرفوع بضمة مقدرة على ما قبل ياء المتكلم، و«حُجْرٌ» بدل منه، و«جدّي» معطوف على «أَبِي». ومفعول «لَاقَى» محذوف، أي: كما لاقى ذلك أبي."
  - "«قَتِيلًا» مفعول به لـ«أَنْسَى»، و«بِالْكُلَابِ» متعلق بمحذوف نعت له."
morphology:
  - "«لَاقَى» على «فاعَل» من «لقي»."
  - "«قتيل» فعيل بمعنى مفعول، أي مقتول."
  - "«أَنْسَى» مضارع «نسي»، معتل الآخر بالألف."
rhetoric:
  thesis: "خاتمة المقطوعة تعدّ ثلاثة قتلى من أهله: أباه وجده وعمه، ثم لا يبقى إلا هو. فالبيت يضع الشاعر في آخر سلسلة من الموت."
  devices:
    - title: "التشبيه"
      text: "جعل مصيره المنتظر كمصير أبيه وجده، فالموت عنده ميراث في البيت."
    - title: "الاستدراك بالتذكّر"
      text: "بعد أن ذكر الأب والجد قال «وَلَا أَنْسَى»، فأضاف العم؛ والنفي هنا يؤكد أن ذكراه حاضرة."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "كَمَا لَاقَى / أَبِي حُجْرُنْ / وَجَدْدِي = مفاعلْتن / مفاعلْتن / فعولن — وَلَا أَنْسَى / قَتِيلَنْ بِلْ / كُلَابِي = مفاعلْتن / مفاعلْتن / فعولن"
  note: "دخل العَصْبُ التفعيلات الأربع [@atiq، ص54]."
context: "بهذا البيت تنتهي المقطوعة. ويرى شوقي ضيف أنها «رائعة لأنها تصور لنا إحساسه بعبث الكفاح ضد المنذر» [@deif، ج1 ص260]."
