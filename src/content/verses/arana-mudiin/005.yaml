first: إِلَى عِرْقِ الثَّرَى وَشَجَتْ عُرُوقِي
second: وَهَذَا الْمَوْتُ يَسْلُبُنِي شَبَابِي
vocabulary:
- term: عِرْقِ الثَّرَى
  text: 'أصل الأرض. قيل: يعني إسماعيل بن إبراهيم عليهما السلام [@lisan، ج10 ص243]. ويرى شوقي ضيف أنه يشير به إلى آبائه الذين ماتوا [@deif، ج1 ص259].'
- term: وَشَجَتْ
  text: اشتبكت واتصلت [@lisan، ج2 ص398].
