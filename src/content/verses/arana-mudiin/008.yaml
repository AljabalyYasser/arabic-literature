explained: false
first: وَأَرْكَبْ فِي اللُّهَامِ الْمَجْرِ حَتَّى
second: أَنَالَ مَآكِلَ الْقُحَمِ الرِّغَابِ
vocabulary:
- term: اللُّهَامِ
  text: الجيش الكثير، كأنه يلتهم ما يلقاه.
- term: الْمَجْرِ
  text: الكثير العدد.
- term: مَآكِلَ الْقُحَمِ
  text: 'المآكل هنا الغنائم [@deif، ج1 ص259]. والقُحَم: «الأمور العظام التي لا يركبها كل أحد» [@lisan، ج12 ص463].'
- term: الرِّغَابِ
  text: الواسعة الكثيرة.
