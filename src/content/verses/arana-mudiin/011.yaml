first: "أُرَجِّي مِنْ صُرُوفِ الدَّهْرِ لِينًا"
second: "وَلَمْ تَغْفُلْ عَنِ الصُّمِّ الْهِضَابِ"
meaning: "أأرجو من حوادث الدهر لينًا، وهي لم تغفل عن الجبال الصمّ الصلبة؟ يريد آباءه: «وماذا يرجو بعد هذه الصخور الصُّمّ من آبائه وقد واراها التراب» [@deif، ج1 ص260]."
vocabulary:
  - term: "صُرُوفِ الدَّهْرِ"
    text: "حوادثه ونوائبه."
  - term: "الصُّمِّ"
    text: "المُصْمَتة، يريد الجبال [@deif، ج1 ص259]."
  - term: "الْهِضَابِ"
    text: "الصلبة [@deif، ج1 ص259]، وهي في الأصل جمع هَضْبة، وهي الجبل المنبسط."
syntax:
  - "«أُرَجِّي» فعل مضارع مرفوع بضمة مقدرة، وهو الذي يتعلق به «أَبَعْدَ» في البيت السابق، والاستفهام منسحب عليه: أأرجّي بعدهم؟"
  - "«لِينًا» مفعول به، و«مِنْ صُرُوفِ الدَّهْرِ» متعلق بـ«أُرَجِّي»."
  - "«وَلَمْ تَغْفُلْ» الواو حالية، وفاعل «تَغْفُلْ» ضمير يعود إلى «صُرُوفِ الدَّهْرِ». و«عَنِ الصُّمِّ» متعلق بـ«تَغْفُلْ»، و«الْهِضَابِ» بدل من «الصُّمِّ»."
morphology:
  - "«أُرَجِّي» مضارع «رجّى» المضعّف، والتضعيف يفيد كثرة الرجاء وإلحاحه."
  - "«الصُّمِّ» جمع «أصمّ» و«صمّاء» على «فُعْل»، كـ«حُمْر» جمع «أحمر»."
  - "«الْهِضَابِ» جمع «هَضْبة» على «فِعال»."
rhetoric:
  thesis: "جواب السؤال في البيت السابق، في صورة سؤال آخر: كيف يلين الدهر لي وقد حطّم من هم أصلب مني؟"
  devices:
    - title: "الاستعارة التصريحية"
      text: "صرّح بالجبال الصمّ وأراد آباءه الملوك، بجامع الصلابة والمنعة؛ ولذلك يسميهم شوقي ضيف «هذه الصخور الصُّمّ من آبائه» [@deif، ج1 ص260]. وهذا هو الضرب الأول من الاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]؛ فهو يجعل الآباء جبالًا، ولا يقول: آبائي كالجبال."
    - title: "التشخيص"
      text: "جعل للدهر صروفًا لا تغفل، كأنه عدو متيقظ يتربّص بالناس."
  connection: "ثم يتيقن مصيره: «وَأَعْلَمُ أَنَّنِي عَمَّا قَرِيبٍ / سَأَنْشَبُ فِي شَبَا ظُفْرٍ وَنَابِ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الباء المكسورة"
  scansion: "أُرَجْجِي مِنْ / صُرُوفِدْ دَهْ / رِ لِينَنْ = مفاعلْتن / مفاعلْتن / فعولن — وَلَمْ تَغْفُلْ / عَنِصْ صُمْمِلْ / هِضَابِي = مفاعلْتن / مفاعلْتن / فعولن"
  note: "دخل العَصْبُ تفعيلات الحَشْو الأربع كلها [@atiq، ص54]."
