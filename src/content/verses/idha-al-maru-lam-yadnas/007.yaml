first: "رَسَا أَصْلُهُ تَحْتَ الثَّرَى وَسَمَا بِهِ"
second: "إِلَى النَّجْمِ فَرْعٌ لَا يُنَالُ طَوِيلُ"
vocabulary:
  - term: "رَسَا"
    text: "ثبت ورسخ."
  - term: "الثَّرَى"
    text: "التراب النديّ تحت وجه الأرض."
  - term: "النَّجْمِ"
    text: "يريد نجوم السماء عامة، أو الثريا."
