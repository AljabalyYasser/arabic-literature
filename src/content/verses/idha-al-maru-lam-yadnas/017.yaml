first: "وَمَا أُخْمِدَتْ نَارٌ لَنَا دُونَ طَارِقٍ"
second: "وَلَا ذَمَّنَا فِي النَّازِلِينَ نَزِيلُ"
vocabulary:
  - term: "أُخْمِدَتْ"
    text: "أُطفئت."
  - term: "نَارٌ"
    text: "نار الضيافة، توقد ليلًا ليهتدي بها الضيف."
  - term: "طَارِقٍ"
    text: "الضيف يأتي ليلًا."
  - term: "نَزِيلُ"
    text: "ضيف نازل."
