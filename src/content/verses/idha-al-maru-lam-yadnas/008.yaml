first: "وَإِنَّا لَقَوْمٌ مَا نَرَى الْقَتْلَ سُبَّةً"
second: "إِذَا مَا رَأَتْهُ عَامِرٌ وَسَلُولُ"
vocabulary:
  - term: "سُبَّةً"
    text: "عارًا يُسبّ به صاحبه."
  - term: "عَامِرٌ وَسَلُولُ"
    text: "قبيلتان، «يُرِيدُ عامرَ بْنَ صَعْصَعة، وسَلُول بْنَ مُرَّة بْنِ صَعْصَعَةَ» [@lisan، ج11 ص343]."
