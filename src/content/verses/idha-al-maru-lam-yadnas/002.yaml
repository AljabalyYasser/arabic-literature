vocabulary:
  - term: "لَمْ يَحْمِلْ عَلَى النَّفْسِ ضَيْمَهَا"
    text: "لم يحمل نفسه على ما تكره وتشقّ عليه من المكارم. والضَّيْم: الظلم والمشقّة."
  - term: "الثَّنَاءِ"
    text: "المدح."
