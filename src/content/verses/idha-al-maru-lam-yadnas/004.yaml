explained: false
first: "وَمَا قَلَّ مَنْ كَانَتْ بَقَايَاهُ مِثْلَنَا"
second: "شَبَابٌ تَسَامَى لِلْعُلَى وَكُهُولُ"
vocabulary:
  - term: "بَقَايَاهُ"
    text: "من بقي من أهله بعد من مات أو قُتل."
  - term: "تَسَامَى"
    text: "تتسامى، أي ترتفع وتطلب العلا."
  - term: "وَكُهُولُ"
    text: "جمع كَهْل، وهو من جاوز الشباب."
sources:
