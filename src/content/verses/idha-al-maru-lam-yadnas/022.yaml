explained: false
first: "فَإِنَّ بَنِي الدَّيَّانِ قُطْبٌ لِقَوْمِهِمْ"
second: "تَدُورُ رَحَاهُمْ حَوْلَهُمْ وَتَجُولُ"
vocabulary:
  - term: "بَنِي الدَّيَّانِ"
    text: "سادة بني الحارث بن كعب. قال التِّبْرِيزيّ: «والديان هو يزيد بن قطن بن زياد بن الحارث الأصغر» [@tabrizi-hamasa، نشرة فرايتاغ ص54]."
  - term: "قُطْبٌ"
    text: "الحديدة في وسط الرحى يدور عليها حجرها الأعلى؛ يقول: عليهم يدور أمر قومهم."
