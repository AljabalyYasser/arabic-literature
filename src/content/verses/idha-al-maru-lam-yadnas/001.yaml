explained: false
first: "إِذَا الْمَرْءُ لَمْ يَدْنَسْ مِنَ اللُّؤْمِ عِرْضُهُ"
second: "فَكُلُّ رِدَاءٍ يَرْتَدِيهِ جَمِيلُ"
vocabulary:
  - term: "يَدْنَسْ"
    text: "يتلطّخ ويتّسخ."
  - term: "اللُّؤْمِ"
    text: "الخِسّة ودناءة الطبع، وهو ضد الكرم."
  - term: "عِرْضُهُ"
    text: "ما يُمدح به الرجل ويُذمّ من نفسه وحسبه."
  - term: "فَكُلُّ رِدَاءٍ يَرْتَدِيهِ جَمِيلُ"
    text: "أي لا يضرّه ما لبس من ثوب خَلَق إذا سلم عرضه."
sources:
  - source: "tabrizi-hamasa"
    loc: "ج1 ص28"
    url: "https://shamela.ws/book/6907/27"
