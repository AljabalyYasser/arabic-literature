explained: false
first: "وَأَيَّامُنَا مَشْهُورَةٌ فِي عَدُوِّنَا"
second: "لَهَا غُرَرٌ مَعْلُومَةٌ وَحُجُولُ"
vocabulary:
  - term: "وَأَيَّامُنَا"
    text: "وقائعنا في الحرب."
  - term: "غُرَرٌ ... وَحُجُولُ"
    text: "جمع غُرّة، وهي البياض في جبهة الفرس، وحِجْل، وهو البياض في قوائمه؛ يقول: أيامنا مشهورة بين الأيام كالفرس الأغرّ المحجّل بين الخيل."
sources:
  - source: "tabrizi-hamasa"
    loc: "ج1 ص30"
