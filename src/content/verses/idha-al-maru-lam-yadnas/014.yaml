first: "فَنَحْنُ كَمَاءِ الْمُزْنِ مَا فِي نِصَابِنَا"
second: "كَهَامٌ وَلَا فِينَا يُعَدُّ بَخِيلُ"
vocabulary:
  - term: "الْمُزْنِ"
    text: "السحاب، وماؤه أصفى الماء."
  - term: "نِصَابِنَا"
    text: "أصلنا."
  - term: "كَهَامٌ"
    text: "الكليل الذي لا يقطع من السيوف، ويراد به الضعيف."
