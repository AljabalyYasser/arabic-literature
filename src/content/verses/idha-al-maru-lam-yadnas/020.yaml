first: "مُعَوَّدَةٌ أَلَّا تُسَلَّ نِصَالُهَا"
second: "فَتُغْمَدَ حَتَّى يُسْتَبَاحَ قَبِيلُ"
vocabulary:
  - term: "نِصَالُهَا"
    text: "شفارها."
  - term: "فَتُغْمَدَ"
    text: "فتُردّ إلى أغمادها."
  - term: "يُسْتَبَاحَ قَبِيلُ"
    text: "تُستحلّ جماعة من الناس فتُقتل وتُسبى."
