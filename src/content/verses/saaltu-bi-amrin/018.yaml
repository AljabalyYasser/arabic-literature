first: "وَخَرْقٍ تَجَاوَزْتَ مَجْهُولَهُ"
second: "بِوَجْنَاءَ حَرْفٍ تَشَكَّى الْكَلَالَا"
vocabulary:
  - term: "خَرْقٍ"
    text: "الموضع ينخرق فيمضي في الفلاة [@sukkari-hudhaliyyin، ص586]."
  - term: "وَجْنَاءَ"
    text: "الغليظة، مشتقة من الوجين، وهو الموضع الغليظ [@sukkari-hudhaliyyin، ص586]."
  - term: "حَرْفٍ"
    text: "ضامر [@sukkari-hudhaliyyin، ص586]."
  - term: "الْكَلَالَا"
    text: "الإعياء [@sukkari-hudhaliyyin، ص586]."
