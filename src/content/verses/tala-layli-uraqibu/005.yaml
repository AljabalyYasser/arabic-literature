explained: false
first: "لَا أَرَى الْمَوْتَ يَسْبِقُ الْمَوْتَ شَيْءٌ"
second: "نَغَّصَ الْمَوْتُ ذَا الْغِنَى وَالْفَقِيرَا"
vocabulary:
  - term: "يَسْبِقُ الْمَوْتَ شَيْءٌ"
    text: "لا يفوته شيء. وأعاد لفظ «الموت» ثلاث مرات مكان الضمير، وبه استشهد سيبويه على إعادة الظاهر موضع المضمر، كما يذكر البغدادي [@khizana، ج1 ص380]."
  - term: "نَغَّصَ"
    text: "كدّر، و«نَغَّصَ عَلَيْهِ عَيْشَه تَنْغِيصاً أَي كَدَّرَه» [@lisan، ج7 ص99]. ويشرحه البغدادي بأن خوف الموت ينغّص على الغني لذته بغناه، وعلى الفقير سعيه في طلب الغنى [@khizana، ج1 ص380–381]."
