explained: false
first: "وَمَبْضُوعَةٍ فِي رَأْسِ نِيقٍ شَظِيَّةٍ"
second: "بِطَوْدٍ تَرَاهُ بِالسَّحَابِ مُكَلَّلَا"
vocabulary:
  - term: "وَمَبْضُوعَةٍ"
    text: "الواو واو رُبَّ، أي: ورُبّ مبضوعة. وفي اللسان: «يَعْنِي قَوساً بضَعها أَي قطعَها» [@lisan، ج8 ص13]، وفيه: «ومَبْضُوعة منْ رأْسِ فَرْعٍ شَظِيّة»."
  - term: "نِيقٍ"
    text: "أعلى موضع في الجبل."
  - term: "شَظِيَّةٍ"
    text: "قطعة من عود، يعني العود الذي تُصنع منه القوس."
  - term: "بِطَوْدٍ"
    text: "الطَّوْد: الجبل العظيم."
  - term: "مُكَلَّلَا"
    text: "يحيط به السحاب كالإكليل."
