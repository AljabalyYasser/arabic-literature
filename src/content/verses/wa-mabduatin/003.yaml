first: "وَأَبْصَرَ أَلْهَابًا مِنَ الطَّوْدِ دُونَهَا"
second: "تَرَى بَيْنَ رَأْسَيْ كُلِّ نِيقَيْنِ مَهْبِلَا"
vocabulary:
  - term: "أَلْهَابًا"
    text: "«واللِّهْبُ، بِالْكَسْرِ: الفُرْجَة والهوَاء بَيْنَ الجبَلين، وَفِي الْمُحْكَمِ: مَهْواةُ مَا بَيْنَ كُلِّ جَبَلَيْنِ» [@lisan، ج1 ص744]."
  - term: "مَهْبِلَا"
    text: "«والمهبل المهواة» [@simt، ج1 ص493]."
