explained: false
first: "وَقَدْ أَكَلَتْ أَظْفَارَهُ الصَّخْرُ كُلَّمَا"
second: "تَعَايَا عَلَيْهِ طُولُ مَرْقًى تَوَصَّلَا"
vocabulary:
  - term: "أَكَلَتْ أَظْفَارَهُ الصَّخْرُ"
    text: "قال الجاحظ: «فجعل النحت والتّنقّص أكلا» [@hayawan، ج5 ص12]، أي أن الصخر أبرى أظفاره."
  - term: "تَعَايَا عَلَيْهِ"
    text: "أعجزه وأعياه."
  - term: "مَرْقًى"
    text: "موضع الرُّقِيّ، أي الصعود."
  - term: "تَوَصَّلَا"
    text: "تحيّل حتى وصل."
