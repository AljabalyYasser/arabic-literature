explained: false
first: "فَأَشْرَطَ فِيهَا نَفْسَهُ وَهْوَ مُعْصِمٌ"
second: "وَأَلْقَى بِأَسْبَابٍ لَهُ وَتَوَكَّلَا"
vocabulary:
  - term: "أَشْرَطَ فِيهَا نَفْسَهُ"
    text: "قال البَكْريّ: «وأشرط فيها نفسه: جعلها علماً للهلاك وأشراط الساعة علاماتها» [@simt، ج1 ص493]، أي خاطر بنفسه."
  - term: "مُعْصِمٌ"
    text: "«أَيْ وَهُوَ مُعْتَصِمٌ بالحبْل الَّذِي دَلَّاه» [@lisan، ج12 ص404]."
  - term: "بِأَسْبَابٍ"
    text: "بحبال، جمع سبب."
