explained: false
first: "فَمَا زَالَ حَتَّى نَالَهَا وَهْوَ مُعْصِمٌ"
second: "عَلَى مَوْطِنٍ لَوْ زَلَّ عَنْهُ تَفَصَّلَا"
vocabulary:
  - term: "نَالَهَا"
    text: "بلغ الشظية."
  - term: "لَوْ زَلَّ عَنْهُ"
    text: "قال البَكْريّ: «هكذا الصواب لو زلّ عنه: عن الموطن وهو الموضع الذي صار إليه. ورواية أبي علي … لو زال عنها لا وجه لها» [@simt، ج1 ص492–493]."
  - term: "تَفَصَّلَا"
    text: "تقطّعت أعضاؤه."
sources:
