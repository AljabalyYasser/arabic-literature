first: "وَتَأَيَّبْتُ عَلَيْهِ ثَانِيًا"
second: "يَتَّقِينِي بِتَلِيلٍ ذِي خُصَلْ"
vocabulary:
  - term: "وَتَأَيَّبْتُ"
    text: "يرويه صاحب اللسان «وتأيَّيْتُ»، ويقول: «والتَّأَيِّي: التَّنَظُّر والتُّؤَدة. يُقَالُ: تَأَيَّا الرجلُ يَتَأَيَّا تَأَيِّياً إِذَا تأَنى فِي الأَمر» [@lisan، ج14 ص63]."
  - term: "ثَانِيًا"
    text: "ثانيًا عنانه."
  - term: "بِتَلِيلٍ"
    text: "«والتَّلِيل: العُنُق؛ قَالَ لَبِيدٌ» [@lisan، ج11 ص79]، والخُصَل: خُصَل الشعر."
