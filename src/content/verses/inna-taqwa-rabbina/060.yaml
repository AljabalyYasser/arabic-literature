explained: false
first: "فَخْمَةً ذَفْرَاءَ تُرْتَى بِالْعُرَى"
second: "قُرْدُمَانِيًّا وَتَرْكًا كَالْبَصَلْ"
vocabulary:
  - term: "ذَفْرَاءَ"
    text: "«وكَتِيبَة ذَفْرَاءُ أَي أَنها سَهِكَةٌ مِنَ الْحَدِيدِ وصَدَئِهِ» [@lisan، ج4 ص307]."
  - term: "تُرْتَى"
    text: "تُشدّ: «ورَتَوْتُه: ضَمَمْته» [@lisan، ج14 ص308]."
  - term: "قُرْدُمَانِيًّا"
    text: "«القُرْدُمانيُّ والقُرْدُمانِيَّة: سِلاح مُعدّ كَانَتِ الفُرس والأَكاسرة تَدَّخِرُهُ» [@lisan، ج12 ص475]، وهو هنا الدروع."
  - term: "تَرْكًا"
    text: "خُوَذ الحديد: «والتَّرِيكةُ: بَيْضَةُ الْحَدِيدِ للرأْس»، «وَهِيَ التَّرْكة أَيضاً، وَجَمْعُهَا تَرْكٌ» [@lisan، ج10 ص406]."
