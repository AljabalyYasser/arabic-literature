explained: false
first: "بَيْنَ إِرْقَاصٍ وَعَدْوٍ صَادِقٍ"
second: "ثُمَّ إِقْدَامٍ إِذَا النِّكْسُ نَكَلْ"
vocabulary:
  - term: "إِرْقَاصٍ"
    text: "يقول المحقق: «الإرقاص: حمل الإبل على الخبب» [@diwan-labid، ص192]."
  - term: "النِّكْسُ"
    text: "يقول المحقق: «والنكس: الرجل الضعيف» [@diwan-labid، ص192]."
  - term: "نَكَلْ"
    text: "جبن: «يُقَالُ: نَكَلَ عَنِ الْعَدُوِّ وَعَنِ الْيَمِينِ يَنْكُلُ، بِالضَّمِّ، أَي جَبُنَ» [@lisan، ج11 ص677]."
