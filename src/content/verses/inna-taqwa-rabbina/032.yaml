explained: false
first: "يَلْمِسُ الْأَحْلَاسَ فِي مَنْزِلِهِ"
second: "بِيَدَيْهِ كَالْيَهُودِيِّ الْمُصَلْ"
vocabulary:
  - term: "يَلْمِسُ"
    text: "«واللمس: الطّلب» [@khizana، ج3 ص371]."
  - term: "الْأَحْلَاسَ"
    text: "«والأحلاس: جمع حلْس بِالْكَسْرِ وَهُوَ كسَاء رَقِيق يكون على ظهر الْبَعِير تَحت رَحْله» [@khizana، ج3 ص371]."
  - term: "كَالْيَهُودِيِّ الْمُصَلْ"
    text: "المُصَلّي، وخُفّفت للقافية: «قَالَ الطوسي فِي شَرحه كَأَنَّهُ يَهُودِيّ يُصَلِّي فِي جَانب يسْجد على جَبينه» [@khizana، ج3 ص371]."
