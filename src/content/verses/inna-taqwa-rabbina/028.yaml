explained: false
first: "وَمَجُودٍ مِنْ صُبَابَاتِ الْكَرَى"
second: "عَاطِفِ النُّمْرُقِ صَدْقِ الْمُبْتَذَلْ"
vocabulary:
  - term: "وَمَجُودٍ"
    text: "«والمجود: الَّذِي جاده النعاس وألح عَلَيْهِ حَتَّى أَخذه فَنَامَ» [@khizana، ج3 ص368]."
  - term: "صُبَابَاتِ الْكَرَى"
    text: "«فَإِن الْكرَى النّوم وصبابته بَقِيَّته» [@khizana، ج3 ص369]."
  - term: "عَاطِفِ النُّمْرُقِ"
    text: "«يُرِيد: عطف نمرقته وثناها فَنَامَ. والنمرقة مُثَلّثَة النُّون: الوسادة والطنفسة فَوق الرحل» [@khizana، ج3 ص369]."
  - term: "صَدْقِ الْمُبْتَذَلْ"
    text: "«أَي: جلد قوي لَا يُغير عِنْد ابتذاله نَفسه» [@khizana، ج3 ص369]."
