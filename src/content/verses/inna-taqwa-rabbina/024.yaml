explained: false
first: "وَاضْبِطِ اللَّيْلَ إِذَا طَالَ السُّرَى"
second: "وَتَدَجَّى بَعْدَ فَوْرٍ وَاعْتَدَلْ"
vocabulary:
  - term: "اضْبِطِ اللَّيْلَ"
    text: "يقول المحقق: «أي اضبط ما تحتاج إلى ضبطه بالليل واحذر أن تضل الطريق أو تند الإبل» [@diwan-labid، ص180]."
  - term: "تَدَجَّى"
    text: "أظلم: «وَكَذَلِكَ أَدْجَى وتَدجَّى اللَّيْلُ؛ قَالَ لَبِيدٌ» [@lisan، ج14 ص249]."
  - term: "فَوْرٍ"
    text: "يقول المحقق: «الفور أن تفور الظلمة في أول الليل وإذا مضت قطعة من الليل سكنت فورة الظلمة واعتدل الليل» [@diwan-labid، ص180]."
