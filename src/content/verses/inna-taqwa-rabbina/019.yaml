explained: false
first: "فَإِذَا جُوزِيتَ قَرْضًا فَاجْزِهِ"
second: "إِنَّمَا يَجْزِي الْفَتَى لَيْسَ الْجَمَلْ"
vocabulary:
  - term: "قَرْضًا"
    text: "«وَالْقَرْض هُنَا: مَا سلف من إِحْسَان أَو إساءة» [@khizana، ج9 ص300]."
  - term: "لَيْسَ الْجَمَلْ"
    text: "«لَيْسَ» هنا بمعنى «لا»: «وَقَدْ تَجِيءُ لَيْسَ بِمَعْنَى لَا وَلَا بِمَعْنَى لَيْسَ؛ وَمِنْ ذَلِكَ قَوْلُ لَبِيدٍ» [@lisan، ج15 ص469]. ومعنى الشطر عند البغدادي: «أَن الَّذِي يَجْزِي بِمَا يُعَامل بِهِ من حسن أَو قَبِيح هُوَ الْإِنْسَان لَا الْبَهِيمَة» [@khizana، ج9 ص301]."
