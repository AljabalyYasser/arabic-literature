first: "فَلَقَدْ أُعْوِصُ بِالْخَصْمِ وَقَدْ"
second: "أَمْلَأُ الْجَفْنَةَ مِنْ شَحْمِ الْقُلَلْ"
vocabulary:
  - term: "أُعْوِصُ بِالْخَصْمِ"
    text: "«وَقَالَ الطوسي: أعوص: أركب بِهِ الْأَمر العويص أَي: الشَّديد» [@khizana، ج9 ص299]."
  - term: "الْجَفْنَةَ"
    text: "«والجفنة بِفَتْح الْجِيم: الْقَصعَة» [@khizana، ج9 ص299]."
  - term: "الْقُلَلْ"
    text: "«وَأَرَادَ بالقلل الأسنمة» [@khizana، ج9 ص299]، والواحدة قُلّة، وقلة كل شيء أعلاه."
