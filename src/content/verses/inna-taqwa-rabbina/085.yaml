first: "مُدْمِنٌ يَجْلُو بِأَطْرَافِ الذُّرَى"
second: "دَنَسَ الْأَسْؤُقِ بِالْعَضْبِ الْأَفَلْ"
vocabulary:
  - term: "يَجْلُو بِأَطْرَافِ الذُّرَى"
    text: "يقول المحقق: «هذا رجل يعرقب الإبل لينحرها ثم يمسح ذرى أسنمتها بسيفه ليجلو ما عليه من دم الأسؤق» [@diwan-labid، ص198]."
  - term: "الْأَسْؤُقِ"
    text: "جمع ساق."
  - term: "الْعَضْبِ"
    text: "السيف القاطع، من «العَضْبُ: الْقَطْعُ» [@lisan، ج1 ص609]."
  - term: "الْأَفَلْ"
    text: "المثلوم: «وَسَيْفٌ فَلِيل مَفْلُول وأَفَلُّ أَي مُنْفَلٌّ» [@lisan، ج11 ص530]."
