explained: false
first: "تَسْلُبُ الْكَانِسَ لَمْ يُوأَرْ بِهَا"
second: "شُعْبَةَ السَّاقِ إِذَا الظِّلُّ عَقَلْ"
vocabulary:
  - term: "الْكَانِسَ"
    text: "«والكَانِسُ: الظَّبْيُ يَدْخُلُ فِي كِناسِهِ» [@lisan، ج6 ص198]، وهو ملجؤه في الشجر من الحر."
  - term: "لَمْ يُوأَرْ بِهَا"
    text: "لم يشعر بها حتى دخلت عليه. وفي اللسان على رواية «لَمْ يُورَأْ بِهَا»: «كأَنَّ ناقَته لَمْ تُضِئْ للظَّبْيِ الكانِس، وَلَمْ تَبِنْ لَهُ» [@lisan، ج1 ص194]."
  - term: "شُعْبَةَ السَّاقِ"
    text: "الغصن من ساق الشجرة الذي يستظل به الظبي."
  - term: "عَقَلْ"
    text: "«وعَقَلَ الظِّلُّ يَعْقِل إِذا قَامَ قَائِمُ الظَّهِيرة» [@lisan، ج11 ص465]، أي في أشد الحر."
