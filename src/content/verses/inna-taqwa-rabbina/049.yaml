explained: false
first: "وَكَأَنِّي مُلْجِمٌ سُوذَانِقًا"
second: "أَجْدَلِيًّا كَرُّهُ غَيْرُ وَكَلْ"
vocabulary:
  - term: "سُوذَانِقًا"
    text: "«سوذق: السَّوْذَق والسَّوْذَنِيق والسُّوذانِق: الصَّقر، وَقِيلَ الشَّاهِينُ؛ قَالَ لَبِيدٌ» [@lisan، ج10 ص171]."
  - term: "أَجْدَلِيًّا"
    text: "منسوبًا إلى الأجدل: «والأَجْدَل: الصَّقْر» [@lisan، ج11 ص103]."
  - term: "وَكَلْ"
    text: "«الوَكَل: الَّذِي يَكِلُ أَمره إِلى غَيْرِهِ» [@lisan، ج11 ص734]."
