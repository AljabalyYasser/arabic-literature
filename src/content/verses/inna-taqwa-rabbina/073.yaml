explained: false
first: "رَقَمِيَّاتٍ عَلَيْهَا نَاهِضٌ"
second: "تُكْلِحُ الْأَرْوَقَ مِنْهُمْ وَالْأَيَلْ"
vocabulary:
  - term: "رَقَمِيَّاتٍ"
    text: "«والرَّقَمِيَّاتُ: سِهَامٌ تُنْسَبُ إِلى مَوْضِعٍ بِالْمَدِينَةِ» [@lisan، ج12 ص251]."
  - term: "نَاهِضٌ"
    text: "ريش فرخ النسر: «والناهِضُ: الفرْخُ الَّذِي استَقَلَّ للنُّهوضِ» [@lisan، ج7 ص245]."
  - term: "تُكْلِحُ"
    text: "«الكُلُوحُ: تَكَشُّرٌ فِي عُبوس» [@lisan، ج2 ص574]."
  - term: "الْأَرْوَقَ ... وَالْأَيَلْ"
    text: "«رَوِقَ يَرْوَقُ رَوَقاً فَهُوَ أَرْوَقُ إِذا طَالَتْ أَسنانه» [@lisan، ج10 ص135]، و«التَّهْذِيبُ: الأَيَلُّ الْقَصِيرُ الأَسنان» [@lisan، ج11 ص740]."
