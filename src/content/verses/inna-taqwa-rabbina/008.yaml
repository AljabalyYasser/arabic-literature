explained: false
first: "وَإِذَا حَرَّكْتُ غَرْزِي أَجْمَرَتْ"
second: "أَوْ قَرَا بِي عَدْوُ جَوْنٍ قَدْ أَبَلْ"
vocabulary:
  - term: "غَرْزِي"
    text: "«والغَرْزُ: رِكابُ الرحْل» [@lisan، ج5 ص386]."
  - term: "أَجْمَرَتْ"
    text: "«وأَجْمَرَ الرجلُ والبعيرُ: أَسرع وَعَدَا، وَلَا تَقُلْ أَجمز، بِالزَّايِ؛ قَالَ لَبِيدٍ» [@lisan، ج4 ص148]. ويرويه صاحب اللسان «أَوْ قِرابي» [@lisan، ج4 ص148]."
  - term: "جَوْنٍ"
    text: "حمار وحشي داكن اللون، و«الجَوْنُ: الأَسْوَدُ اليَحْمُوميُّ» [@lisan، ج13 ص101]."
  - term: "أَبَلْ"
    text: "استغنى بالرَّطْب عن الماء: «وأَبَلَتِ الإِبلُ والوحشُ تَأْبِلُ وتَأْبُلُ أَبْلًا وأُبُولًا وأَبِلَتْ وتَأَبَّلَتْ: جَزَأَتْ عَنِ الْمَاءِ بالرُّطْب؛ وَمِنْهُ قَوْلُ لَبِيدٍ» [@lisan، ج11 ص5]."
