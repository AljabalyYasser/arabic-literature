first: "فَانْتَضَلْنَا وَابْنُ سَلْمَى قَاعِدٌ"
second: "كَعَتِيقِ الطَّيْرِ يُغْضِي وَيُجَلْ"
meaning: "تبارينا بالكلام وتفاخرنا، والنعمانُ جالس يرقبنا كالبازي: يُطرق مرة، ويرمي ببصره مرة كما ينظر الصقر إلى صيده. وفي اللسان: «ابْنُ سَلْمَى: النُّعْمَانُ، وإِنما ذَكَرَ مَقَامَتَهُ مَعَ الرَّبِيعِ بَيْنَ يَدَيِ النُّعْمَانِ» [@lisan، ج10 ص236]."
vocabulary:
  - term: "فَانْتَضَلْنَا"
    text: "تفاخرنا: «وانْتَضَلَ القومُ إِذا تفاخَروا؛ قَالَ لَبِيدٌ» [@lisan، ج11 ص666]. وأصل المناضلة المراماة بالسهام."
  - term: "ابْنُ سَلْمَى"
    text: "النعمان بن المنذر، وسلمى أمه [@lisan، ج10 ص236]."
  - term: "عَتِيقِ الطَّيْرِ"
    text: "«وعَتيقُ الطَّيْرِ: الْبَازِي» [@lisan، ج10 ص236]."
  - term: "يُغْضِي"
    text: "يُطبق جفنيه: «وأَغْضَى عَنْهُ طَرْفَه: سَدَّه أَو صَدَّهُ» [@lisan، ج15 ص128]."
  - term: "يُجَلْ"
    text: "أي «ويُجَلِّي»، و«والبازِي يُجَلِّي إِذا آنَسَ الصيدَ فَرَفَعَ طرْفَه ورأْسَه. وجَلَّى بِبَصَرِهِ تَجْلِيَةً إِذا رَمَى بِهِ كَمَا يَنْظُرُ الصَّقْرُ إِلى الصَّيْدِ» [@lisan، ج14 ص151]."
context: "قلب مقامات الشاعر عند النعمان (68–77). يقول ابن قُتَيْبة: «ويستجاد له قوله فى النعمان، يصف نظره وشرّته»، وينشد هذا البيت وثلاثة بعده [@ibn-qutayba، ج1 ص275]. والمقامة التي يذكرها صاحب اللسان هي خبر لبيد غلامًا مع الربيع بن زياد عند النعمان، حين دخل مع وفد بني عامر فوجده يتغدى ومعه الربيع، فقام يرتجز فيه [@ibn-al-anbari، ص507]. ويصل البيت بين الفخر باللسان (68–72) ووصف مجلس الملك (75–77)."
syntax:
  - "الفاء عاطفة، و«انْتَضَلْنَا» فعل وفاعل، والواو في «وَابْنُ» حالية، و«ابْنُ» مبتدأ، و«سَلْمَى» مضاف إليه ممنوع من الصرف، و«قَاعِدٌ» خبر، والجملة حال."
  - "«كَعَتِيقِ» جار ومجرور في موضع خبر ثان أو حال من الضمير في «قاعد»، و«الطَّيْرِ» مضاف إليه."
  - "جملة «يُغْضِي» حال من «عتيق الطير» تبيّن وجه الشبه، و«وَيُجَلْ» معطوف عليها، وأصله «يُجَلِّي» حُذفت ياؤه وسُكّن للقافية."
morphology:
  - "«انْتَضَلَ» على «افْتَعَلَ» من «النَّضْل»، للمشاركة: تناضل القوم."
  - "«يُغْضِي» مضارع «أَغْضَى» على «أَفْعَلَ»."
  - "«يُجَلْ» من «جَلَّى» على «فَعَّلَ»، و«أَي ويُجَلِّي» كما في اللسان [@lisan، ج14 ص151]."
  - "«عَتِيق» على «فَعِيل»، ومنه قول ابن الأعرابي: «كلُّ شَيْءٍ بَلَغَ النِّهَايَةَ فِي جودةٍ أَو رَدَاءَةٍ أَو حُسْنٍ أَو قُبْحٍ، فَهُوَ عَتيقٌ» [@lisan، ج10 ص236]."
rhetoric:
  thesis: "صورة الملك الحَكَم: صامت يرقب المتفاخرين كما يرقب البازي صيده."
  devices:
    - title: "التمثيل"
      text: "«كَعَتِيقِ الطَّيْرِ يُغْضِي وَيُجَلْ»: الشبه ليس في لون أو هيئة ثابتة، بل في حال مركبة تتعاقب: سكون وجلوس، ثم إغضاء، ثم رمي بالبصر. وهذا ما يخصه عبد القاهر الجُرْجانيّ باسم التمثيل، وهو عنده أخص من التشبيه: «فكل تمثيلٍ تشبيهٌ، وليس كلّ تشبيهٍ تمثيلاً» [@asrar، ص95]. ووجه الشبه هنا لا يُفهم من كلمة واحدة، بل من الجملتين معًا."
    - title: "الطباق"
      text: "«يُغْضِي وَيُجَلْ»: إطباق الجفن ورفع البصر، ضدان يرسمان انتباه الملك المتقطع."
    - title: "النسبة إلى الأم"
      text: "«وَابْنُ سَلْمَى»: سمّى النعمان بأمه ولم يذكر اسمه، فاكتفى بنسبة يعرفها السامعون."
  connection: "ثم يصف المجلس: الوصفاء قيام، معهم أباريق الخمر."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "فَنْتَضَلْنَا / وَبْنُ سَلْمَى / قَاعِدُنْ = فاعلاتن / فاعلاتن / فاعلن — كَعَتِيقِطْ / طَيْرِ يُغْضِي / وَيُجَلْ = فعِلاتن / فاعلاتن / فعِلن"
  note: "سلم الصدر من الزحاف، ودخل الخَبْنُ التفعيلةَ الأولى من العجز والضربَ [@atiq، ص79–80]."
