explained: false
first: "تَرْزُمُ الشَّارِفُ مِنْ عِرْفَانِهِ"
second: "كُلَّمَا لَاحَ بِنَجْدٍ وَاحْتَفَلْ"
vocabulary:
  - term: "تَرْزُمُ"
    text: "يقول المحقق: «ترزم: تصوّت وتحن» [@diwan-labid، ص185]."
  - term: "الشَّارِفُ"
    text: "«والشارِفُ مِنَ الإِبل: المُسِنُّ والمُسِنَّةُ» [@lisan، ج9 ص173]."
  - term: "احْتَفَلْ"
    text: "«وَطَرِيقٌ مُحْتَفِل أَي ظَاهِرٌ مُسْتَبِين، وَقَدِ احْتَفَل أَي اسْتَبَانَ، واحْتَفَلَ الطريقُ: وَضَح؛ قَالَ لَبِيدٌ يَصِفُ طَرِيقًا» [@lisan، ج11 ص158]."
