first: "وَمَقَامٍ ضَيِّقٍ فَرَّجْتُهُ"
second: "بِمَقَامِي وَلِسَانِي وَجَدَلْ"
meaning: "ورُبّ موقف حرج في الخصومة والمفاخرة، يضيق فيه الكلام على أصحابه، وسّعته وخرجت منه بثباتي فيه، وببياني وحجتي."
vocabulary:
  - term: "مَقَامٍ ضَيِّقٍ"
    text: "موقف حرج في المنازعة بالكلام، يعسر فيه القول والثبات."
  - term: "فَرَّجْتُهُ"
    text: "كشفت ضيقه وأوسعته."
  - term: "جَدَلْ"
    text: "مخاصمة بالحجة، وسُكّن للقافية."
context: "أول أبيات مقامات الشاعر عند الملوك (68–77): يفخر بلسانه بعد أن فخر بقومه وأيامهم (57–67). وجواب البيت في الذي بعده: «لَوْ يَقُومُ الْفِيلُ أَوْ فَيَّالُهُ ... زَلَّ عَنْ مِثْلِ مَقَامِي». ويورد ابن قُتَيْبة البيتين معًا تحت قوله: «وممّا يعاب له من هذه القصيدة» [@ibn-qutayba، ج1 ص273]، والعيب الذي يذكره في البيت الثاني، فهذا البيت يُقرأ معه."
syntax:
  - "الواو واو «رُبّ»، و«مَقَامٍ» مجرور لفظًا بـ«رُبّ» المحذوفة، مرفوع محلًّا على الابتداء، و«ضَيِّقٍ» نعته."
  - "جملة «فَرَّجْتُهُ» في محل رفع خبر المبتدأ."
  - "«بِمَقَامِي» جار ومجرور متعلق بـ«فرّجته»، و«وَلِسَانِي» و«وَجَدَلْ» معطوفان عليه."
morphology:
  - "«مَقَام» على «مَفْعَل» من «قام»، وأصله «مَقْوَم»، نقلت فتحة الواو إلى القاف فقُلبت ألفًا."
  - "«ضَيِّق» على «فَيْعِل» من «ضاق»."
  - "«فَرَّجَ» على «فَعَّلَ»، والتضعيف للتكثير والمبالغة."
  - "«جَدَل» مصدر «جَدِلَ» على «فَعَل»."
rhetoric:
  thesis: "فخر بالبيان: يخرج من أضيق المواقف بثباته ولسانه وحجته."
  devices:
    - title: "الاستعارة"
      text: "«وَمَقَامٍ ضَيِّقٍ فَرَّجْتُهُ»: الضيق والتفريج صفتان للأمكنة، فجعل الموقف الحرج مكانًا ضيقًا يُوسَّع. وهي الاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الجناس"
      text: "«وَمَقَامٍ ... بِمَقَامِي»: كرر اللفظ بمعنيين: الأول الموقف نفسه، والثاني قيامه هو فيه وثباته. فالمقام الذي ضاق على غيره اتسع بمقامه هو. وهذا من قراءتنا."
    - title: "الترقّي"
      text: "«بِمَقَامِي وَلِسَانِي وَجَدَلْ»: رتّب أسباب الغلبة من الحضور والثبات، إلى اللسان، إلى الحجة."
  connection: "ثم يأتي الجواب في البيت التالي: لو قام مقامه الفيل أو صاحبه لزلّ عنه."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "وَمَقَامِنْ / ضَيْيِقِنْ فَرْ / رَجْتُهُو = فعِلاتن / فاعلاتن / فاعلن — بِمَقَامِي / وَلِسَانِي / وَجَدَلْ = فعِلاتن / فعِلاتن / فعِلن"
  note: "دخل الخَبْنُ التفعيلةَ الأولى من الصدر، والتفعيلتين الأوليين من العجز، والضربَ فصار «فعِلن» [@atiq، ص79–80]."
