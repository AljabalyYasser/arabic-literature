first: "مَنْ هَدَاهُ سُبُلَ الْخَيْرِ اهْتَدَى"
second: "نَاعِمَ الْبَالِ وَمَنْ شَاءَ أَضَلْ"
meaning: "من هداه الله طرق الخير اهتدى، فعاش حسن الحال مطمئنًّا، ومن شاء الله أضلّه. وهو معنى قوله تعالى «يُضِلُّ مَنْ يَشَاءُ وَيَهْدِي مَنْ يَشَاءُ»، وبه يقرنه صاحب اللسان [@lisan، ج11 ص391]."
vocabulary:
  - term: "سُبُلَ"
    text: "طرق، جمع سبيل."
  - term: "نَاعِمَ الْبَالِ"
    text: "حسن الحال: «والبَالُ: الْحَالُ والشأْن» [@lisan، ج11 ص74]."
  - term: "أَضَلْ"
    text: "«وأَضَلَّه: جَعَلَهُ ضَالًّا» [@lisan، ج11 ص391]، وخُفّفت اللام المشددة للقافية."
context: "ثالث الأبيات التي أنشدها للقرّاء ثم قال: «أستغفر الله» [@aghani-dk، ج15 ص372]. وفي زمنه خلاف. فصاحب اللسان يقول: «قَالَ لَبِيدٌ هَذَا فِي جاهِلِيَّته فَوَافَقَ قَوْلُهُ التَّنْزِيلَ الْعَزِيزَ» [@lisan، ج11 ص391]، ويردّه المحقق إحسان عباس: «وهذا كلام موهم لأن القصيدة قيلت بعد موت أربد وكان لبيد قد أسلم» [@diwan-labid، ص174]. وجعل بعضهم البيتين الأول والثالث دليلًا على أن لبيدًا كان يقول بالجبر، فينقل البغدادي عن الشريف المرتضى: «وَمِمَّنْ قيل أَنه على مَذْهَب الْجَبْر من الْمَشْهُورين لبيد بن ربيعَة العامري»، ثم ردَّه المرتضى بأن البيت «يحْتَمل أَن يكون مصروفاً إِلَى بعض الْوُجُوه الَّتِي يتَأَوَّل عَلَيْهَا الضلال وَالْهدى الْمَذْكُورَان فِي الْقُرْآن» [@khizana، ج3 ص373]. وبهذا البيت تُختم المقدمة الدينية، ثم تبدأ الرحلة."
syntax:
  - "«مَنْ» اسم شرط في محل رفع مبتدأ، و«هَدَاهُ» فعل ماض فاعله ضمير يعود على الله، والهاء مفعوله الأول، و«سُبُلَ» مفعول ثان، و«الْخَيْرِ» مضاف إليه، و«اهْتَدَى» جواب الشرط."
  - "«نَاعِمَ» حال من فاعل «اهتدى»، و«الْبَالِ» مضاف إليه."
  - "«وَمَنْ شَاءَ أَضَلْ»: «مَنْ» موصول في محل نصب مفعول به مقدم لـ«أَضَلْ»، وجملة «شَاءَ» صلته، وفاعل الفعلين ضمير يعود على الله؛ والتقدير: وأضلّ من شاء إضلاله."
morphology:
  - "«اهْتَدَى» على «افْتَعَلَ»، مطاوع «هَدَى»: هداه فاهتدى."
  - "«أَضَلّ» على «أَفْعَلَ» من «ضَلَّ»، والهمزة للتعدية."
  - "«سُبُل» جمع «سَبِيل» على «فُعُل»."
rhetoric:
  thesis: "الهدى والضلال بمشيئة الله، والمهتدي ينال طمأنينة الحال."
  devices:
    - title: "المقابلة"
      text: "«مَنْ هَدَاهُ ... اهْتَدَى» في مقابل «مَنْ شَاءَ أَضَلْ»: قابل الهداية بالإضلال، فقسم الناس قسمين في بيت واحد. والمقابلة: أن يؤتى بمعنيين أو أكثر ثم بما يقابلها على الترتيب."
    - title: "الاشتقاق"
      text: "«هَدَاهُ ... اهْتَدَى»: فعل ومطاوعه من مادة واحدة، فالهداية من الله والاهتداء أثرها في العبد."
    - title: "الحذف"
      text: "«وَمَنْ شَاءَ أَضَلْ»: حذف مفعول المشيئة، أي من شاء إضلاله. ويرى عبد القاهر الجُرْجانيّ أن المشيئة تأتي كثيرًا «موقوفةٌ غيرُ مُعدَّاةٍ إلى شيءٍ»، ويقول: «إلاَّ أَنَّ البلاغةَ في أن يُجاءَ به كذلك محذوفاً» [@dalail، ص164]؛ فالحذف يجعل المشيئة نفسها هي المقصودة لا متعلَّقها."
    - title: "الإيجاز"
      text: "«نَاعِمَ الْبَالِ»: حال من كلمتين اختصرت ثمرة الهداية كلها، ولم يذكر في المقابل حال الضالّ، فترك القارئ يقدّره."
  connection: "ثم ينتقل من الحكمة إلى الرحلة: أرض واسعة قطعها على ناقة قوية."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "مَنْ هَدَاهُو / سُبُلَلْ خَيْ / رِهْتَدَى = فاعلاتن / فعِلاتن / فاعلن — نَاعِمَلْ بَا / لِ وَمَنْ شَا / ءَ أَضَلْ = فاعلاتن / فعِلاتن / فعِلن"
  note: "سلمت العروض هنا «فاعلن»، ودخل الخَبْنُ الضربَ فصار «فعِلن»، والتفعيلةَ الثانية في الشطرين فصارت «فعِلاتن» [@atiq، ص79–80]."
