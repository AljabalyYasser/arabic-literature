explained: false
first: "مِنْ نَسَا النَّاشِطِ إِذْ ثَوَّرْتُهُ"
second: "أَوْ رَئِيسِ الْأَخْدَرِيَّاتِ الْأُوَلْ"
vocabulary:
  - term: "نَسَا"
    text: "«هُوَ عِرْقُ النَّسَا» [@lisan، ج15 ص322]، عرق في الفخذ."
  - term: "النَّاشِطِ"
    text: "«والناشِطُ: الثَّوْر الوحْشِيّ الَّذِي يَخْرُجُ مِنْ بَلَدٍ إِلى بَلَدٍ» [@lisan، ج7 ص413]."
  - term: "الْأَخْدَرِيَّاتِ"
    text: "يقول المحقق: «الأخدريات: أتن الوحش، ورئيسها: الأخدري: حمار الوحش» [@diwan-labid، ص189]."
