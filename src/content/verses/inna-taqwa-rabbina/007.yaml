explained: false
first: "وَتَصُكُّ الْمَرْوَ لَمَّا هَجَّرَتْ"
second: "بِنَكِيبٍ مَعِرٍ دَامِي الْأَظَلْ"
vocabulary:
  - term: "تَصُكُّ الْمَرْوَ"
    text: "تضرب الحجارة؛ يقول المحقق: «المرو: حجارة بيض براقة» [@diwan-labid، ص176]."
  - term: "هَجَّرَتْ"
    text: "سارت في الهاجرة، وهي شدة الحر."
  - term: "نَكِيبٍ"
    text: "«الْجَوْهَرِيُّ: النَّكِيبُ دائرةُ الحافِر، والخُفِّ؛ وأَنشد بَيْتَ لَبِيدٍ» [@lisan، ج1 ص773]."
  - term: "مَعِرٍ"
    text: "«مَعِرَ الظُّفُرُ يَمْعَرُ مَعَراً، فَهُوَ مَعِرٌ: نَصَلَ مِنْ شَيْءٍ أَصابه؛ قَالَ لَبِيدٌ» [@lisan، ج5 ص180]."
  - term: "الْأَظَلْ"
    text: "«والأَظَلُّ: مَا تحتَ الْمَنَاسِمِ» [@lisan، ج7 ص5]، والمنسم طرف خف البعير، وخُفّفت اللام للقافية."
