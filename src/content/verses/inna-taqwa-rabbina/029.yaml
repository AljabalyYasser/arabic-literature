explained: false
first: "قَالَ هَجِّدْنَا فَقَدْ طَالَ السُّرَى"
second: "وَقَدَرْنَا إِنْ خَنَى دَهْرٍ غَفَلْ"
vocabulary:
  - term: "هَجِّدْنَا"
    text: "«يُقَال: هجده إِذا نَومه أَي: دَعْنَا ننام وَهُوَ المُرَاد هُنَا» [@khizana، ج3 ص369]."
  - term: "السُّرَى"
    text: "«والسرى بِالضَّمِّ: سير عَامَّة اللَّيْل» [@khizana، ج3 ص369]."
  - term: "قَدَرْنَا"
    text: "«أَي: وقدرنا على وُرُود المَاء وَذَلِكَ إِذا قربوا مِنْهُ» [@khizana، ج3 ص369]."
  - term: "خَنَى دَهْرٍ"
    text: "«والخنى بِفَتْح الْمُعْجَمَة وَالْقصر: الآفة وَالْفساد أَي: إِن غفل عَنَّا فَسَاد الدَّهْر فَلم يعقنا» [@khizana، ج3 ص369]."
