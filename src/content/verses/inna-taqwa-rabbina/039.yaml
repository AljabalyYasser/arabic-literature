explained: false
first: "ثُمَّ أَصْدَرْنَاهُمَا فِي وَارِدٍ"
second: "صَادِرٍ وَهْمٍ صُوَاهُ قَدْ مَثَلْ"
vocabulary:
  - term: "وَارِدٍ صَادِرٍ"
    text: "طريق: «وَطَرِيقٌ صادِرٌ: مَعْنَاهُ أَنه يَصْدُر بِأَهْله عَنِ الْمَاءِ. ووارِدٌ: يَرِدُهُ بِهم؛ قَالَ لَبِيدٌ يَذْكُرُ ناقَتَيْن» [@lisan، ج4 ص448]."
  - term: "وَهْمٍ"
    text: "يقول المحقق: «الوهم: الطريق الواسع» [@diwan-labid، ص185]."
  - term: "صُوَاهُ"
    text: "أعلامه: «الصُّوَى مَا غَلُظَ مِنَ الأَرض وَارْتَفَعَ وَلَمْ يَبْلُغ أَن يَكُونَ جَبَلًا» [@lisan، ج14 ص472]. ويقول المحقق: «أعلام حجارة منصوبة في الفيافي يستدل بها على الطريق» [@diwan-labid، ص185]."
  - term: "مَثَلْ"
    text: "انتصب، ويقول المحقق: «ويروى: كالمثل ومعناه الماثل» [@diwan-labid، ص185]."
