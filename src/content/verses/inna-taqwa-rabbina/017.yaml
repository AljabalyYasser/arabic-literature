explained: false
first: "أَوْ نَهَتْهُ فَأَتَاهُ رِزْقُهُ"
second: "فَاشْتَوَى لَيْلَةَ رِيحٍ وَاجْتَمَلْ"
vocabulary:
  - term: "أَوْ نَهَتْهُ"
    text: "«أَي: رب غُلَام نهته أمه عَن السُّؤَال منا حَيَاء أَو قنوعاً فَبَعَثنَا إِلَيْهِ بِمَا اشتوى واجتمل» [@khizana، ج9 ص299]."
  - term: "لَيْلَةَ رِيحٍ"
    text: "«أَي: لَيْلَة برد من الشتَاء» [@khizana، ج9 ص299]، وهي ليالي الجدب."
  - term: "اجْتَمَلْ"
    text: "«واجتمل: اتخذ الْجَمِيل بِفَتْح الْجِيم وَهُوَ الشَّحْم الْمُذَاب» [@khizana، ج9 ص299]."
