explained: false
first: "فَتَوَلَّوْا فَاتِرًا مَشْيُهُمُ"
second: "كَرَوَايَا الطِّبْعِ هَمَّتْ بِالْوَحَلْ"
vocabulary:
  - term: "فَتَوَلَّوْا"
    text: "ينقل المحقق عن ابن السِّيد: «يصف قوماً خاصمهم بين يدي النعمان بن المنذر فغلبهم، فانصرفوا مغلوبين» [@diwan-labid، ص196]."
  - term: "رَوَايَا"
    text: "«والرَّاوِيَةُ المَزادة فِيهَا الْمَاءُ، وَيُسَمَّى الْبَعِيرُ رَاوِيَة» [@lisan، ج14 ص346]."
  - term: "الطِّبْعِ"
    text: "«والطِّبْعُ، بِالْكَسْرِ: النَّهْرُ، وَجَمْعُهُ أَطباع، وَقِيلَ: هُوَ اسْمُ نَهْرٍ بِعَيْنِهِ؛ قَالَ لَبِيدٌ» [@lisan، ج8 ص233]."
