first: "لَوْ يَقُومُ الْفِيلُ أَوْ فَيَّالُهُ"
second: "زَلَّ عَنْ مِثْلِ مَقَامِي وَزَحَلْ"
meaning: "لو قام الفيل أو صاحبه الذي يسوسه في مثل مقامي ذلك لزلّ عنه وتنحّى. و«زَحَلَ الشيءُ عَنْ مَقامه يَزْحَلُ زَحْلًا وزُحُولًا وتَزَحْوَلَ، كِلَاهُمَا: زَلَّ عَنْ مَكَانِهِ» [@lisan، ج11 ص302]."
vocabulary:
  - term: "فَيَّالُهُ"
    text: "صاحب الفيل وسائسه."
  - term: "زَحَلْ"
    text: "تنحّى عن مكانه [@lisan، ج11 ص302]."
context: "جواب البيت السابق، وهو موضع العيب الذي يذكره ابن قُتَيْبة بعد قوله: «وممّا يعاب له من هذه القصيدة»: «وقالوا: ليس للفيّال من الخطابة والبيان، ولا من القوّة، ما يجعله مثلا لنفسه! وإنما ذهب إلى أنّ الفيل أقوى البهائم، فظنّ أن فيّاله أقوى الناس!»، ثم يتأوّله ابن قُتَيْبة نفسه: «وأنا أراه أراد بقوله: لو يقوم الفيل أو فيّاله مع فيّاله، فأقام «أو» مقام الواو» [@ibn-qutayba، ج1 ص273]. وينقل المحقق عن السُّكَّري في شرح ديوان كعب: «توهم لبيد أن فيال الفيل لما كان يقدر على تصريفه وسياسته أنه أشد الأشياء»، ويرى المحقق أن البيت «مما عيب على لبيد لظنه القوة الهائلة في صاحب الفيل» [@diwan-labid، ص194]. فالعيب عند النقاد في المعنى لا في اللفظ: مقياس القوة الذي اختاره لا يصلح لمقام البيان."
syntax:
  - "«لَوْ» حرف شرط غير جازم، و«يَقُومُ» مضارع بمعنى الماضي بعدها، و«الْفِيلُ» فاعل، و«أَوْ فَيَّالُهُ» معطوف عليه، والهاء مضاف إليه."
  - "«زَلَّ» جواب «لو» جاء بلا لام، و«عَنْ مِثْلِ» متعلق به، و«مَقَامِي» مضاف إليه، و«وَزَحَلْ» معطوف على «زلّ»."
  - "و«أو» عند ابن قُتَيْبة بمعنى الواو: الفيل مع فيّاله [@ibn-qutayba، ج1 ص273]."
morphology:
  - "«فَيَّال» على «فَعَّال» من «الفِيل»، وهو بناء أصحاب الحِرَف والصنائع."
  - "«زَلَّ» مضعّف، و«زَحَلَ» على «فَعَلَ»."
rhetoric:
  thesis: "مبالغة في الثبات: أقوى المخلوقات وصاحبه لا يثبتان حيث ثبت الشاعر."
  devices:
    - title: "المبالغة بالفرض"
      text: "«لَوْ يَقُومُ الْفِيلُ»: افترض ما لا يقع ليقيس به ثباته، واختار الفيل لأنه أقوى ما يعرفه السامع من البهائم."
    - title: "عيب المعنى عند ابن قُتَيْبة"
      text: "«أَوْ فَيَّالُهُ»: عطف الفيّال على الفيل كأنه نظيره في القوة، وهذا ما أنكره النقاد كما يرويه ابن قُتَيْبة، لأن القوة التي تصلح لمقام الخصومة قوة البيان، والفيّال لا يُعرف بها [@ibn-qutayba، ج1 ص273]."
    - title: "التوكيد بالمترادف"
      text: "«زَلَّ ... وَزَحَلْ»: فعلان متقاربان، الثاني يؤكد الأول ويزيده بيان الابتعاد عن المكان."
  connection: "ثم يسمّي المقام: كان عند النعمان، بين فاثور أُفاق والدَّحْل."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "لَوْ يَقُومُلْ / فِيلُ أَوْ فَيْ / يَالُهُو = فاعلاتن / فاعلاتن / فاعلن — زَلْلَ عَنْ مِثْ / لِ مَقَامِي / وَزَحَلْ = فاعلاتن / فعِلاتن / فعِلن"
  note: "سلم الصدر من الزحاف، ودخل الخَبْنُ التفعيلةَ الثانية من العجز والضربَ [@atiq، ص79–80]."
variants:
  - reading: "زَاحَ عَنْ مِثْلِ مَقَامِي وَزَحَلْ"
    status: "رواية شَمِر في اللسان"
    note: "«زاحَ وزاخَ، بِالْحَاءِ وَالْخَاءِ، بِمَعْنًى وَاحِدٍ إِذا تَنَحَّى» [@lisan، ج2 ص470]."
  - reading: "زَاخَ عَنْ مِثْلِ مَقَامِي وَزَحَلْ"
    status: "رواية في اللسان"
    note: "ويفرّق أبو الهيثم بينهما: «وأَما زَاخَ، بِالْخَاءِ، فَهُوَ بِمَعْنَى جَارَ لا غير» [@lisan، ج3 ص23]."
