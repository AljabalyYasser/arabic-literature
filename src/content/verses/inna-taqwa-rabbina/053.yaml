explained: false
first: "فَهْوَ شَحَّاجٌ مُدِلٌّ سَنِقٌ"
second: "لَاحِقُ الْبَطْنِ إِذَا يَعْدُو زَمَلْ"
vocabulary:
  - term: "شَحَّاجٌ"
    text: "«والمِشْحَجُ والشَّحَّاج: الْحِمَارُ الوحشيُّ، صِفة غَالِبَةٌ» [@lisan، ج2 ص305]، من شحيجه وهو صوته."
  - term: "سَنِقٌ"
    text: "«أَبو عُبَيْدٍ: السَّنِقُ الشَّبْعان كالمُتَّخِم» [@lisan، ج10 ص165]."
  - term: "لَاحِقُ الْبَطْنِ"
    text: "ضامره."
  - term: "زَمَلْ"
    text: "يقول المحقق: «زمل: عدا وأسرع معتمداً في أحد شقيه رافعاً جنبه الآخر» [@diwan-labid، ص189]."
