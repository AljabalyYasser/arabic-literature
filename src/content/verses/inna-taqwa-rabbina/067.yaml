first: "ثُمَّ أَنْعَمْنَا عَلَى سَيِّدِهِمْ"
second: "بَعْدَمَا أَطْلَعَ نَجْدًا وَأَبَلْ"
vocabulary:
  - term: "أَنْعَمْنَا عَلَى سَيِّدِهِمْ"
    text: "مننّا عليه وأطلقناه. يقول المحقق: «لا أدري كيف كان ذلك فإن أخبار الأيام لا تشير إلى شيء منه» [@diwan-labid، ص193]."
  - term: "أَبَلْ"
    text: "يقول المحقق: «أبل: ذهب في الأرض» [@diwan-labid، ص193]."
