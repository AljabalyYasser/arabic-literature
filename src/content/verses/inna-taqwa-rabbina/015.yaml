first: "وَلَقَدْ تَحْمَدُ لَمَّا فَارَقَتْ"
second: "جَارَتِي وَالْحَمْدُ مِنْ خَيْرِ خَوَلْ"
vocabulary:
  - term: "جَارَتِي"
    text: "«جارتي فَاعل تحمد» [@khizana، ج9 ص299]: تحمدني جارتي إذا فارقتني."
  - term: "خَوَلْ"
    text: "«والخول بِفَتْح الْخَاء الْمُعْجَمَة: الْعَطِيَّة» [@khizana، ج9 ص299]."
