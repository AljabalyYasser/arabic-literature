explained: false
first: "فَهَرَقْنَا لَهُمَا فِي دَاثِرٍ"
second: "لِضَوَاحِيهِ نَشِيشٌ بِالْبَلَلْ"
vocabulary:
  - term: "لَهُمَا"
    text: "للناقتين: ناقته وناقة صاحبه."
  - term: "دَاثِرٍ"
    text: "يقول المحقق: «الداثر: الدارس والموصوف محذوف وهو هنا الحوض» [@diwan-labid، ص184]."
  - term: "لِضَوَاحِيهِ"
    text: "نواحيه، و«ضواحي الحوض نواحيه» كما يقول المحقق [@diwan-labid، ص184]."
  - term: "نَشِيشٌ"
    text: "«نَشَّ الماءُ يَنِشُّ نَشًّا ونَشِيشاً ونَشَّشَ: صَوَّتَ عِنْدَ الغلَيان» [@lisan، ج6 ص352]."
