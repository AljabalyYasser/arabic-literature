explained: false
first: "إِنْ تَرَيْ رَأْسِيَ أَمْسَى وَاضِحًا"
second: "سُلِّطَ الشَّيْبُ عَلَيْهِ فَاشْتَعَلْ"
vocabulary:
  - term: "وَاضِحًا"
    text: "أبيض من الشيب، من «الوَضَحُ: بياضُ الصُّبْحِ والقمرُ والبَرَصُ والغرةُ والتحجيلُ فِي الْقَوَائِمِ» [@lisan، ج2 ص634]."
  - term: "فَاشْتَعَلْ"
    text: "وفي الديوان نقلًا عن الخزانة: «وشبه انتشار الشيب باشتعال النار في سرعة الالتهاب» [@diwan-labid، ص177]."
