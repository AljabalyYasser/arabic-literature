first: "فَمَتَى أَهْلِكْ فَلَا أَحْفِلُهُ"
second: "بَجَلِي الْآنَ مِنَ الْعَيْشِ بَجَلْ"
vocabulary:
  - term: "أَحْفِلُهُ"
    text: "أباليه؛ يقول المحقق: «حفلت كذا وكذا أي باليت به؛ والحفل: المبالاة» [@diwan-labid، ص197]."
  - term: "بَجَلِي"
    text: "«وبَجَلِي كَذَا وبَجَلِي أَي حَسْبي؛ قَالَ لَبِيدٌ» [@lisan، ج11 ص45]."
