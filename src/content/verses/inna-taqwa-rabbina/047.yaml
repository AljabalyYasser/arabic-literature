explained: false
first: "يَطْرُدُ الزُّجَّ يُبَارِي ظِلَّهُ"
second: "بِأَسِيلٍ كَالسِّنَانِ الْمُنْتَخَلْ"
vocabulary:
  - term: "الزُّجَّ"
    text: "«والزُّجُّ: النَّعَامُ، الْوَاحِدَةُ زَجَّاءُ، وأَزَجُّ لِلذَّكَرِ، وَهُوَ الْبَعِيدُ الخَطْوِ؛ قَالَ لَبِيدٌ» [@lisan، ج2 ص286]."
  - term: "بِأَسِيلٍ"
    text: "بخدّ أسيل طويل."
  - term: "الْمُنْتَخَلْ"
    text: "المختار المصفّى: «نَخَلَ الشيءَ يَنْخُلُه نَخْلًا وتَنَخَّلَه وانْتَخَلَه: صَفَّاه واختارَه» [@lisan، ج11 ص651]."
