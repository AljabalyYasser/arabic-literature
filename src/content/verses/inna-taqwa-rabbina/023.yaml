first: "غَيْرَ أَنْ لَا تَكْذِبَنْهَا فِي التُّقَى"
second: "وَاخْزُهَا بِالْبِرِّ لِلَّهِ الْأَجَلْ"
meaning: "إلا أنك لا تكذب نفسك في أمر التقوى، بل سُسْها وامنعها هواها بالبرّ والطاعة لله الأجلّ. يقول ابن قُتَيْبة: «قول «اخزها»: سسها» [@ibn-qutayba، ج1 ص272]، وفي الخزانة: «واخزها بالمعجمتين: أَمر من خزاه يخزوه خزواً إِذا ساسه وقهره» [@khizana، ج9 ص304]."
vocabulary:
  - term: "اخْزُهَا"
    text: "سُسْها وكُفّها عن هواها، وأصله في رياضة الدابة: «وخَزا الدَّابَّةَ خَزْواً: ساسَها وراضَها»، و«والخَزْوُ: كفُّ النَّفْسِ عَنْ هِمَّتِها وصَبْرُها عَلَى مُرِّ الْحَقِّ» [@lisan، ج14 ص226]."
  - term: "التُّقَى"
    text: "التقوى."
  - term: "الْأَجَلْ"
    text: "الأعظم جلالًا، «وَالْأَجَل: أفعل تَفْضِيل» [@khizana، ج9 ص304]، وخُفّفت لامه للقافية."
context: "استثناء يحدّ الحكمة التي قبله: كذب النفس بالأمل محمود في أمر الدنيا، أما في التقوى فلا. ويرويه ابن قُتَيْبة مع البيت السابق في ما «يستجاد له» [@ibn-qutayba، ج1 ص272]، فهما عنده وحدة واحدة. وبهما تنتهي حكمة القصيدة، ثم يعود الشاعر إلى السرى والرحلة. وفي البيتين يلتقي ما يصفه المحقق في هذه القصيدة بأن فيها «خلط الروح الدينية بصور الجاهلية» [@diwan-labid، المقدمة ص27]: حكمة العمل الجاهلية يقيّدها أمر التقوى."
syntax:
  - "«غَيْرَ» منصوبة على الاستثناء، وهو كما يقول البغدادي «اسْتثِْنَاء من قَوْله: اكذب النَّفس» [@khizana، ج9 ص304]."
  - "«أَنْ» مخففة من الثقيلة أو تفسيرية، و«لَا» ناهية، و«تَكْذِبَنْهَا» مضارع مبني على الفتح لاتصاله بنون التوكيد الخفيفة في محل جزم، و«ها» مفعول به، و«فِي التُّقَى» متعلق به. ودخول نون التوكيد يرجّح أن «لا» ناهية، لأن النون تلحق الطلب."
  - "«وَاخْزُهَا» فعل أمر مبني على حذف حرف العلة، و«ها» مفعول به، «وَالْبَاء مُتَعَلقَة بِهِ وَللَّه مُتَعَلق بِالْبرِّ» [@khizana، ج9 ص304]، و«الْأَجَلْ» نعت للفظ الجلالة مجرور، سكن للقافية."
morphology:
  - "«اخْزُ» أمر من «خَزَا يَخْزُو»، ناقص واوي، حذفت لامه في الأمر."
  - "«الأَجَلّ» على «أَفْعَل» تفضيل من «جَلَّ»، وأصله «أَجْلَل» أدغمت لامه."
  - "«التُّقَى» مصدر على «فُعَل» بمعنى التقوى، وتاؤه مبدلة من واو «وَقَى»."
rhetoric:
  thesis: "الأمل يُمنَح للنفس في الدنيا، أما في أمر الله فلا مخادعة، بل سياسة لها بالبرّ."
  devices:
    - title: "الاحتراس"
      text: "«غَيْرَ أَنْ لَا تَكْذِبَنْهَا فِي التُّقَى»: دفع به ما قد يُفهم من البيت السابق من إطلاق الكذب على النفس في كل شيء. والاحتراس: أن يُؤتى في الكلام بما يدفع توهُّم غير المراد."
    - title: "الاستعارة في الفعل"
      text: "«وَاخْزُهَا»: الخزو في أصله سياسة الدابة ورياضتها، كما في اللسان [@lisan، ج14 ص226]، فاستعاره للنفس، فصارت مطيّة تُراض. ويقرر عبد القاهر الجُرْجانيّ أن الاستعارة تقع في الفعل كما تقع في الاسم: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]."
    - title: "التوكيد"
      text: "«تَكْذِبَنْهَا»: نون التوكيد في النهي تشدّد المنع، فالأمر في التقوى حاسم لا رخصة فيه."
  connection: "ثم يعود إلى الرحلة: يضبط الليل إذا طال السرى."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "غَيْرَ أَنْ لَا / تَكْذِبَنْهَا / فِتْتُقَى = فاعلاتن / فاعلاتن / فاعلن — وَخْزُهَا بِلْ / بِرْرِ لِلْلَا / هِلْأَجَلْ = فاعلاتن / فاعلاتن / فاعلن"
  note: "سلمت التفعيلات كلها من الزحاف، والعروض والضرب محذوفان: «فاعلن» [@atiq، ص79–80]. والحذف: إسقاط السبب الخفيف من آخر «فاعلاتن» فتصير «فاعلا» وتُنقل إلى «فاعلن»."
