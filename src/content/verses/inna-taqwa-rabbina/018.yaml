explained: false
first: "مِنْ شِوَاءٍ لَيْسَ مِنْ عَارِضَةٍ"
second: "بِيَدَيْ كُلِّ هَضُومٍ ذِي نَزَلْ"
vocabulary:
  - term: "عَارِضَةٍ"
    text: "«والعارضة: النَّاقة الَّتِي أَصَابَهَا كسر أَو عرض فنحرت» [@khizana، ج9 ص299]، أي ينحرون الصحيحة لا ما أصابته علة."
  - term: "هَضُومٍ"
    text: "«والهضوم بِفَتْح الْهَاء وَضم الْمُعْجَمَة: الْفَتى الَّذِي يهتضم مَاله يقطع مِنْهُ وَيكسر» [@khizana، ج9 ص299]."
  - term: "نَزَلْ"
    text: "«والنزل بِفَتْح النُّون وَالزَّاي: الْمَعْرُوف وَالْخَيْر» [@khizana، ج9 ص299]."
