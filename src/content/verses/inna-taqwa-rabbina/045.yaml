explained: false
first: "سَاهِمُ الْوَجْهِ شَدِيدٌ أَسْرُهُ"
second: "مُغْبَطُ الْحَارِكِ مَحْبُوكُ الْكَفَلْ"
vocabulary:
  - term: "سَاهِمُ الْوَجْهِ"
    text: "يقول المحقق: «أي محمول على كريهة الجري» [@diwan-labid، ص187]."
  - term: "أَسْرُهُ"
    text: "خَلْقه: «والأَسْرُ: شِدَّة الخَلْقِ» [@lisan، ج4 ص19]."
  - term: "مُغْبَطُ الْحَارِكِ"
    text: "مرتفعه: «فَرَسٌ مُغْبَطُ الكاثِبة إِذا كَانَ مُرْتَفِعَ المِنْسَجِ، شُبِّهَ بِصَنْعَةِ الْغَبِيطِ» [@lisan، ج7 ص361]؛ «وَقِيلَ الحارِكُ عَظْمٌ مُشْرِفٌ مِنْ جَانِبَيِ الْكَاهِلِ» [@lisan، ج10 ص410]."
  - term: "مَحْبُوكُ"
    text: "«والمَحْبُوك: المُحْكَمُ الْخَلْقِ» [@lisan، ج10 ص408]."
