explained: false
first: "قَدْ تَجَاوَزْتُ وَتَحْتِي جَسْرَةٌ"
second: "حَرَجٌ فِي مِرْفَقَيْهَا كَالْفَتَلْ"
vocabulary:
  - term: "جَسْرَةٌ"
    text: "ناقة ماضية: «وجَمَلٌ جَسْرٌ وَنَاقَةٌ جَسْرَة ومُتَجاسِرَة: مَاضِيَةٌ» [@lisan، ج4 ص136]."
  - term: "حَرَجٌ"
    text: "«والحَرَجُ مِنَ الإِبل: الَّتِي لَا تُركب وَلَا يَضْرِبُهَا الْفَحْلُ لِيَكُونَ أَسمن لَهَا إِنما هِيَ مُعَدَّةٌ؛ قَالَ لَبِيدٌ» [@lisan، ج2 ص235]."
  - term: "كَالْفَتَلْ"
    text: "«والفَتَل أَيضاً: اندِماج فِي مِرْفق النَّاقَةِ وبُيُون عَنِ الْجَنْبِ» [@lisan، ج11 ص515]، أي أن مرفقيها بائنان عن جنبيها."
