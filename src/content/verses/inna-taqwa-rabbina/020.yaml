explained: false
first: "أَعْمِلِ الْعِيسَ عَلَى عِلَّاتِهَا"
second: "إِنَّمَا يُنْجِحُ أَصْحَابُ الْعَمَلْ"
vocabulary:
  - term: "أَعْمِلِ"
    text: "«أعمل: أَمر من الإعمال وَهُوَ الإشغال» [@khizana، ج9 ص303]."
  - term: "الْعِيسَ"
    text: "«والعيس: الْإِبِل الْبيض» [@khizana، ج9 ص303]."
  - term: "عِلَّاتِهَا"
    text: "«والعلات بِالْكَسْرِ: الْحَالَات جمع عِلّة بِمَعْنى الْحَالة» [@khizana، ج9 ص303]."
