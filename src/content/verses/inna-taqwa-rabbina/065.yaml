explained: false
first: "فَصَلَقْنَا فِي مُرَادٍ صَلْقَةً"
second: "وَصُدَاءٍ أَلْحَقَتْهُمْ بِالثَّلَلْ"
vocabulary:
  - term: "صَلَقْنَا"
    text: "صحنا وأغرنا؛ ينقل المحقق عن الكسائي: «الصلقة: الصياح» [@diwan-labid، ص193]."
  - term: "مُرَادٍ وَصُدَاءٍ"
    text: "قبيلتان من اليمن: «وصُداء، مَمْدُودٌ: حَيٌّ مِنَ اليَمَنِ» [@lisan، ج1 ص108]."
  - term: "الثَّلَلْ"
    text: "«ابْنُ سِيدَهْ: الثَّلَل، بِالتَّحْرِيكِ، الْهَلَاكُ» [@lisan، ج11 ص90]."
