explained: false
first: "فَوَرَدْنَا قَبْلَ فُرَّاطِ الْقَطَا"
second: "إِنَّ مِنْ وِرْدِيَ تَغْلِيسَ النَّهَلْ"
vocabulary:
  - term: "فُرَّاطِ الْقَطَا"
    text: "«وفرّاط القطا: أوائلها وَهُوَ جمع فارط» [@khizana، ج3 ص372]، والقطا مشهور بالتبكير إلى الماء."
  - term: "مِنْ وِرْدِيَ"
    text: "«أَي: من عادتي» [@khizana، ج3 ص372]."
  - term: "تَغْلِيسَ"
    text: "«والتغليس: السّير بِغَلَس وَهُوَ ظلمَة آخر اللَّيْل» [@khizana، ج3 ص372]."
  - term: "النَّهَلْ"
    text: "«والنهل: الشربة الأولى» [@khizana، ج3 ص372]."
