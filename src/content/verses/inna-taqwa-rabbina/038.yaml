explained: false
first: "عَافَتَا الْمَاءَ فَلَمْ نُعْطِنْهُمَا"
second: "إِنَّمَا يُعْطِنُ مَنْ يَرْجُو الْعَلَلْ"
vocabulary:
  - term: "عَافَتَا"
    text: "«عَافَ الشيءَ يَعَافه عَيْفاً وعِيافةً وعِيافاً وعَيَفاناً: كَرِهه فَلَمْ يَشْربه» [@lisan، ج9 ص260]."
  - term: "نُعْطِنْهُمَا"
    text: "«وأَعْطَنَها: سَقَاهَا ثُمَّ أَناخها وَحَبَسَهَا عِنْدَ الْمَاءِ فَبَرَكَتْ بَعْدَ الْوُرُودِ لِتَعُودَ فَتَشْرَبَ؛ قَالَ لَبِيدٌ» [@lisan، ج13 ص286]."
  - term: "الْعَلَلْ"
    text: "«العَلُّ والعَلَلُ: الشَّرْبةُ الثَّانِيَةُ» [@lisan، ج11 ص467]."
