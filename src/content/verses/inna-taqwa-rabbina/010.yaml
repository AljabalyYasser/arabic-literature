first: "يُسْئِدُ السَّيْرَ عَلَيْهَا رَاكِبٌ"
second: "رَابِطُ الْجَأْشِ عَلَى كُلِّ وَجَلْ"
vocabulary:
  - term: "يُسْئِدُ السَّيْرَ"
    text: "«الْجَوْهَرِيُّ: الإِسآد الإِغْذاذُ فِي السَّيْرِ وأَكثر مَا يُسْتَعْمَلُ ذَلِكَ فِي سَيْرِ اللَّيْلِ؛ وَقَالَ لَبِيدٌ» [@lisan، ج3 ص201]."
  - term: "رَابِطُ الْجَأْشِ"
    text: "«وَرَجُلٌ رَابِطُ الجَأْشِ ورَبِيطُ الجأْشِ أَي شَدِيدُ الْقَلْبِ» [@lisan، ج7 ص303]."
