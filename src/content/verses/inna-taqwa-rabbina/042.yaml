first: "وَلَقَدْ يَعْلَمُ صَحْبِي كُلُّهُمْ"
second: "بِعَدَانِ السِّيفِ صَبْرِي وَنَقَلْ"
vocabulary:
  - term: "بِعَدَانِ السِّيفِ"
    text: "موضع على ساحل البحر؛ وفي اللسان: «والعدانُ: أَرض بِعَيْنِهَا مِنْ ذَلِكَ؛ وأَما قَوْلُ لَبِيدِ بْنِ رَبِيعَةَ الْعَامِرِيِّ» [@lisan، ج13 ص280]."
  - term: "نَقَلْ"
    text: "«أَبو عُبَيْدٍ: النَّقَل المُناقَلة فِي المنطِق» [@lisan، ج11 ص676]، أي مراجعة الكلام."
