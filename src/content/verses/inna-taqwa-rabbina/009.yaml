explained: false
first: "بِالْغُرَابَاتِ فَزَرَّافَاتِهَا"
second: "فَبِخِنْزِيرٍ فَأَطْرَافِ حُبَلْ"
vocabulary:
  - term: "الْغُرَابَاتِ ... حُبَلْ"
    text: "مواضع. يقول المحقق: «الغرابات: إكام سود» و«الحبَل: موضع باليمامة» [@diwan-labid، ص176]."
  - term: "فَزَرَّافَاتِهَا"
    text: "ما دنا منها: «زَرَفَ إِلَيْهِ يَزْرِفُ زُرُوفاً وزَريفاً: دَنَا؛ وَقَوْلُ لَبِيدٌ ... عَنَى بِذَلِكَ مَا قَرُبَ مِنْهَا» [@lisan، ج9 ص133]."
  - term: "فَبِخِنْزِيرٍ"
    text: "«وَخِنْزِيرٌ: مَوْضِعُ ذَكَرَهُ لَبِيدٌ» [@lisan، ج4 ص260]."
