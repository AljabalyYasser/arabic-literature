explained: false
first: "رَابِطُ الْجَأْشِ عَلَى فَرْجِهِمُ"
second: "أَعْطِفُ الْجَوْنَ بِمَرْبُوعٍ مِتَلْ"
vocabulary:
  - term: "فَرْجِهِمُ"
    text: "ثغرهم وموضع المخافة منهم: «الفَرْجُ: الخَلَلُ بَيْنَ الشَّيْئَيْنِ» [@lisan، ج2 ص341]."
  - term: "الْجَوْنَ"
    text: "فرسه."
  - term: "بِمَرْبُوعٍ"
    text: "بعنان مفتول من أربع قُوى، من قولهم في الوتر: «جَعَلَهُ مَفْتُولًا مِنْ أَربع قُوًى»، وأنشد صاحب اللسان البيت [@lisan، ج8 ص100]."
  - term: "مِتَلْ"
    text: "«والمِتَلُّ: الشَّدِيدُ. ورُمْحٌ مِتَلٌّ: يُتَلُّ بِهِ أَي يُصْرع بِهِ، وَقِيلَ: قَوِيٌّ مُنْتَصِبٌ غَلِيظٌ؛ قَالَ لَبِيدٌ» [@lisan، ج11 ص78]."
