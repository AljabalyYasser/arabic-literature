explained: false
first: "فَتَدَلَّيْتُ عَلَيْهِ قَافِلًا"
second: "وَعَلَى الْأَرْضِ غَيَايَاتُ الطَّفَلْ"
vocabulary:
  - term: "فَتَدَلَّيْتُ"
    text: "نزلت من مرقبي؛ يقول المحقق: «أراد أنه نزل من مربائه، ولا يكون التدلي إلا من علو إلى استفال» [@diwan-labid، ص189]."
  - term: "غَيَايَاتُ"
    text: "«والغيَايَةُ: ظِلُّ الشمسِ بالغَداةِ والعَشيِّ، وَقِيلَ: هُوَ ضَوْءُ شُعاعِ الشَّمْسِ وَلَيْسَ هُوَ نَفْسَ الشُّعاعِ؛ قَالَ لَبِيدٌ» [@lisan، ج15 ص144]."
  - term: "الطَّفَلْ"
    text: "يقول المحقق: «والطفل: حين تهم الشمس بالوجوب وتدنو للغروب» [@diwan-labid، ص189]."
