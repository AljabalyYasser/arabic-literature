explained: false
first: "يَذْعَرُ الْبَرْكَ فَقَدْ أَفْزَعَهُ"
second: "نَاهِضٌ يَنْهَضُ نَهْضَ الْمُخْتَزَلْ"
vocabulary:
  - term: "يَذْعَرُ"
    text: "يخيف: «الذُّعْرُ، بِالضَّمِّ: الخَوْفُ والفَزَعُ» [@lisan، ج4 ص306]."
  - term: "الْبَرْكَ"
    text: "الإبل الباركة."
  - term: "نَهْضَ الْمُخْتَزَلْ"
    text: "ينقل المحقق عن ابن قتيبة: «ناهض هو الممدوح، نهض المختزل أي غير مستوٍ لأنه قد شرب وسكر»، و«المختزل: المقطوع السنام» [@diwan-labid، ص198]."
