first: "يَتَّقِي الْأَرْضَ بِدَفٍّ شَاسِفٍ"
second: "وَضُلُوعٍ تَحْتَ صُلْبٍ قَدْ نَحَلْ"
vocabulary:
  - term: "يَتَّقِي الْأَرْضَ"
    text: "«أَي: يتجافى عَنْهَا» [@khizana، ج3 ص369]."
  - term: "بِدَفٍّ"
    text: "«والدف بِفَتْح الدَّال: الْجنب» [@khizana، ج3 ص369]."
  - term: "شَاسِفٍ"
    text: "«والشاسف بِتَقْدِيم الْمُعْجَمَة على الْمُهْملَة: الْيَابِس ضمراً وهزالاً» [@khizana، ج3 ص370]."
