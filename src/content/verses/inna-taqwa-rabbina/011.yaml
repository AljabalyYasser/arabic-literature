explained: false
first: "حَالَفَ الْفَرْقَدَ شِرْكًا فِي السُّرَى"
second: "خَلَّةً بَاقِيَةً دُونَ الْخُلَلْ"
vocabulary:
  - term: "الْفَرْقَدَ"
    text: "نجم يهتدى به في السرى، وهما فرقدان، «وَرُبَّمَا قَالَتِ الْعَرَبُ لَهُمَا الفَرْقد؛ قَالَ لَبِيدٌ» [@lisan، ج3 ص334]."
  - term: "شِرْكًا"
    text: "شريكًا، يقول المحقق: «الشِّرك: الشريك، والحصة والنصيب» [@diwan-labid، ص176]."
  - term: "خَلَّةً"
    text: "خصلة: «والخَلَّة: كالخَصْلة» [@lisan، ج11 ص216]. ويقول المحقق إن في نسخة «خُلّة» «بمعنى الصديق» [@diwan-labid، ص176]."
