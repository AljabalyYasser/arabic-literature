first: "أَحْمَدُ اللَّهَ فَلَا نِدَّ لَهُ"
second: "بِيَدَيْهِ الْخَيْرُ مَا شَاءَ فَعَلْ"
meaning: "أحمد الله، ولا مثيل له ولا نظير، والخير كله في يده، يفعل ما يشاء."
vocabulary:
  - term: "نِدَّ"
    text: "المثل: «والنِّدُّ، بِالْكَسْرِ: الْمِثْلُ وَالنَّظِيرُ، وَالْجَمْعُ أَندادٌ» [@lisan، ج3 ص420]."
  - term: "بِيَدَيْهِ"
    text: "في قدرته وملكه، واليد تُذكر ويراد بها القدرة."
context: "ثاني الأبيات الثلاثة التي أنشدها لبيد للقرّاء في مسجد الكوفة [@aghani-dk، ج15 ص372]. بعد التقوى في المطلع يأتي الحمد والتوحيد، فتكتمل للقصيدة مقدمة دينية من ثلاثة أبيات قبل أن ينتقل إلى الرحلة. ولفظ «بِيَدَيْهِ الْخَيْرُ» قريب من قوله تعالى «بِيَدِكَ الْخَيْرُ»، وهذا من قراءتنا؛ ويرى المحقق إحسان عباس أن القصيدة كلها «قيلت بعد موت أربد وكان لبيد قد أسلم» [@diwan-labid، ص174]."
syntax:
  - "«أَحْمَدُ» مضارع مرفوع، وفاعله ضمير مستتر تقديره «أنا»، ولفظ الجلالة مفعول به."
  - "«فَلَا نِدَّ لَهُ»: «لا» نافية للجنس، و«نِدَّ» اسمها مبني على الفتح، و«لَهُ» جار ومجرور متعلق بمحذوف خبرها."
  - "«بِيَدَيْهِ» جار ومجرور متعلق بمحذوف خبر مقدم، وعلامة جره الياء لأنه مثنى، وحذفت نونه للإضافة، و«الْخَيْرُ» مبتدأ مؤخر."
  - "«مَا» شرطية في موضع نصب مفعول به لـ«شَاءَ»، و«فَعَلْ» جواب الشرط، والتقدير: ما شاء أن يفعله فعله. ويجوز أن تكون موصولة مفعولًا مقدمًا لـ«فَعَلْ»."
morphology:
  - "«أَحْمَدُ» مضارع «حَمِدَ» مسند إلى المتكلم."
  - "«نِدّ» على «فِعْل»، وجمعه «أنداد»."
  - "«يَدَيْه» مثنى «يَد»، وهي ثنائية اللفظ حذفت لامها."
rhetoric:
  thesis: "حمد وتوحيد: لا مثل لله، والخير كله في قدرته، ومشيئته نافذة."
  devices:
    - title: "التقديم"
      text: "«بِيَدَيْهِ الْخَيْرُ»: قدّم الخبر على المبتدأ، فأفاد أن الخير بيده لا بيد غيره، على أصل العناية الذي يردّ إليه عبد القاهر الجُرْجانيّ التقديم: «كأنَّهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أَعْنى» [@dalail، ص107]."
    - title: "المجاز"
      text: "«بِيَدَيْهِ»: اليد آلة الأخذ والعطاء، فعبّر بها عن القدرة والملك، وذكر المثنى للمبالغة في السعة."
    - title: "نفي الجنس"
      text: "«فَلَا نِدَّ لَهُ»: لم يقل «ليس له ندّ»، بل جاء بـ«لا» النافية للجنس فنفى كل مثيل نفيًا عامًّا، وهو أقوى صيغ النفي."
    - title: "الحذف"
      text: "«مَا شَاءَ فَعَلْ»: حذف مفعول المشيئة، والتقدير ما شاء فعله. ويرى عبد القاهر أن مجيء المشيئة «موقوفةٌ غيرُ مُعدَّاةٍ إلى شيءٍ، كثيرٍ شائعٍ»، وأن البلاغة فيه: «إلاَّ أَنَّ البلاغةَ في أن يُجاءَ به كذلك محذوفاً» [@dalail، ص164]."
  connection: "ثم يجعل الهدى والضلال بمشيئته في البيت التالي."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "أَحْمَدُلْلَا / هَ فَلَا نِدْ / دَ لَهُو = فاعلاتن / فعِلاتن / فعِلن — بِيَدَيْهِلْ / خَيْرُ مَا شَا / ءَ فَعَلْ = فعِلاتن / فاعلاتن / فعِلن"
  note: "دخل الخَبْنُ التفعيلةَ الثانية من الصدر والأولى من العجز، فصارتا «فعِلاتن»، والعروضَ والضربَ المحذوفين فصارتا «فعِلن» [@atiq، ص79–80]."
