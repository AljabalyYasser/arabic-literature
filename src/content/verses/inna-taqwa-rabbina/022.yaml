first: "وَاكْذِبِ النَّفْسَ إِذَا حَدَّثْتَهَا"
second: "إِنَّ صِدْقَ النَّفْسِ يُزْرِي بِالْأَمَلْ"
meaning: "إذا حدّثت نفسك فمنّها ولا تصارحها بالموت والخيبة، لأن مصارحتها بذلك تقتل الأمل. يقول ابن قُتَيْبة: «اكذب النفس أن تعدها الخبر وتمنّيها إيّاه، وإذا صدقها فقال لها مصيرك إلى الهلكة والزوال أزرى ذلك بأمله» [@ibn-qutayba، ج1 ص272]. وفي الخزانة: «يَعْنِي إِذا حدثت نَفسك بِالْمَوْتِ لم تعمر شَيْئا وَلم تؤثل مَالا وَفَسَد عَلَيْك عيشك فأزرى ذَلِك بأملك» [@khizana، ج9 ص303]."
vocabulary:
  - term: "اكْذِبِ النَّفْسَ"
    text: "حدّثها بما يُنشّطها من الظفر، ولا تصدقها بما يثبّطها."
  - term: "حَدَّثْتَهَا"
    text: "من قولهم: حدّث نفسه بكذا، وفي الخزانة: «فَإِنَّهُ يُقَال: حدث نَفسه بِكَذَا كَمَا يَقُولُونَ: حدثته بِهِ نَفسه» [@khizana، ج9 ص303]."
  - term: "يُزْرِي"
    text: "ينقص ويهوّن: «والإزراء بِتَقْدِيم الْمُعْجَمَة على الْمُهْملَة: النَّقْص» [@khizana، ج9 ص303]."
context: "من أشهر أبيات القصيدة، وبه تبلغ الحكمة التي بدأت بخطاب العاذلة (12) ذروتها بعد الأمر بالعمل والرحيل (20–21). يقول ابن قُتَيْبة: «ويستجاد له قوله»، وينشد البيت والذي بعده [@ibn-qutayba، ج1 ص272]. وجرى شطره الأول مثلًا، فينقل البغدادي عن الزمخشري: «هَذَا المصراع مثل يضْرب فِي الْحَث على الجسارة»، أي أن تحدّث نفسك بالظفر إذا هممت بأمر لتُقدم، ولا تحدثها بالخيبة فتقعد [@khizana، ج9 ص303]. ويروي المحقق أن بشّار بن بُرْد سُئل عن أشعر بيت قالته العرب فقال إن تفضيل بيت واحد على الشعر كله شديد، «ولكن أحسن لبيد في قوله» هذا البيت [@diwan-labid، ص180]."
syntax:
  - "«اكْذِبِ» فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، و«النَّفْسَ» مفعول به."
  - "«إِذَا» ظرف لما يستقبل فيه معنى الشرط، وجملة «حَدَّثْتَهَا» في محل جر بإضافته إليها، وجوابه محذوف دلّ عليه ما قبله."
  - "«إِنَّ صِدْقَ النَّفْسِ يُزْرِي بِالْأَمَلْ»: «صِدْقَ» اسم «إنّ»، و«النَّفْسِ» مضاف إليه، وجملة «يُزْرِي» خبرها، و«بِالْأَمَلْ» متعلق بـ«يزري». والجملة تعليل للأمر قبلها."
morphology:
  - "«حَدَّثَ» على «فَعَّلَ»، يتعدى إلى المفعول بنفسه وإلى الثاني بالباء: حدّثت نفسي بكذا."
  - "«يُزْرِي» مضارع «أَزْرَى» على «أَفْعَلَ»، ومصدره «الإزراء»."
  - "«صِدْق» مصدر «صَدَقَ» على «فِعْل»، و«الأَمَل» مصدر «أَمَلَ» على «فَعَل»."
rhetoric:
  thesis: "حكمة في العمل: من حدّث نفسه بالموت والفشل قعد، ومن منّاها بالظفر مضى."
  devices:
    - title: "الطباق"
      text: "«وَاكْذِبِ ... صِدْقَ»: جمع الكذب والصدق في بيت واحد، وقلب المألوف: الكذب هنا مأمور به، والصدق مذموم، لأنهما في حديث المرء نفسه لا في حديثه الناس."
    - title: "تشخيص النفس"
      text: "«وَاكْذِبِ النَّفْسَ إِذَا حَدَّثْتَهَا»: جعل النفس صاحبًا يُحاوَر فيُصدَق أو يُكذَب، فصار الإنسان اثنين: متكلمًا وسامعًا. وهذا من قراءتنا."
    - title: "«إنّ» في موضع التعليل"
      text: "«إِنَّ صِدْقَ النَّفْسِ»: جاءت الجملة بعد الأمر بلا فاء، فربطتها «إنّ» به. ويقول عبد القاهر الجُرْجانيّ في «إنّ» إذا جاءت على هذا الوجه إنها تغني غناء الفاء: «فأنتَ تَرى الكلامَ بها مستأنفًا غير مستأنف، ومقطوعًا موصولاً معاً» [@dalail، ص273]."
    - title: "إرسال المثل"
      text: "الشطر الأول تام المعنى قصير اللفظ، فصلح أن يُضرب مثلًا، وهو ما ذكره الزمخشري [@khizana، ج9 ص303]."
  connection: "ثم يستثني من هذا الكذب أمرًا واحدًا: التقوى."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "وَكْذِبِنْنَفْ / سَ إِذَا حَدْ / دَثْتَهَا = فاعلاتن / فعِلاتن / فاعلن — إِنْنَ صِدْقَنْ / نَفْسِ يُزْرِي / بِلْأَمَلْ = فاعلاتن / فاعلاتن / فاعلن"
  note: "دخل الخَبْنُ التفعيلةَ الثانية من الصدر فصارت «فعِلاتن»، وسلمت العروض والضرب «فاعلن» [@atiq، ص79–80]."
