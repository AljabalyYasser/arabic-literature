explained: false
first: "وَعَلَاهُ زَبَدُ الْمَحْضِ كَمَا"
second: "زَلَّ عَنْ ظَهْرِ الصَّفَا مَاءُ الْوَشَلْ"
vocabulary:
  - term: "الْمَحْضِ"
    text: "«المَحْضُ: اللبنُ الخالِصُ بِلَا رَغْوة» [@lisan، ج7 ص227]؛ ويرى المحقق أنه أراد العرق: «أي أن العرق انساب على متنه» [@diwan-labid، ص188]."
  - term: "الصَّفَا"
    text: "الصخر الأملس."
  - term: "الْوَشَلْ"
    text: "«الوَشَل، بِالتَّحْرِيكِ: الماءُ الْقَلِيلُ يَتَحَلَّب مِنْ جَبَلٍ أَو صخْرة» [@lisan، ج11 ص725]."
