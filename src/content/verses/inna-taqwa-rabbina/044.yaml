first: "وَلَقَدْ أَغْدُو وَمَا يَعْدَمُنِي"
second: "صَاحِبٌ غَيْرُ طَوِيلِ الْمُحْتَبَلْ"
vocabulary:
  - term: "صَاحِبٌ"
    text: "فرسه: «يَعْنِي فَرَسًا أَي مَا يَفْقِدُني فَرَسِي، يَقُولُ: لَيْسَ مَعِي أَحدٌ غيرُ نَفْسي وفرَسي» [@lisan، ج12 ص393]."
  - term: "الْمُحْتَبَلْ"
    text: "«أَي غَيْرُ طَوِيلِ الأَرساغ، وإِذا قَصُرت أَرساغه كَانَ أَشدّ. والمُحْتَبَل مِنَ الدَّابَّةِ: رُسْغُها لأَنه مَوْضِعُ الحَبْل» [@lisan، ج11 ص137]."
