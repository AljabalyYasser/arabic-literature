explained: false
first: "قَلَّمَا عَرَّسَ حَتَّى هِجْتُهُ"
second: "بِالتَّبَاشِيرِ مِنَ الصُّبْحِ الْأُوَلْ"
vocabulary:
  - term: "عَرَّسَ"
    text: "«والتعريس: النُّزُول فِي آخر اللَّيْل للاستراحة وَالنَّوْم» [@khizana، ج3 ص370]."
  - term: "هِجْتُهُ"
    text: "«وهجته: أيقظته من النّوم» [@khizana، ج3 ص370]."
  - term: "التَّبَاشِيرِ ... الْأُوَلْ"
    text: "«والتباشير: أَوَائِل الصُّبْح»، و«الأول صفة التباشير وَهُوَ بِضَم الْهمزَة وَفتح الْوَاو جمع أولى» [@khizana، ج3 ص370]."
