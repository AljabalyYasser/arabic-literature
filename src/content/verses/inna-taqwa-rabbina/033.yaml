explained: false
first: "يَتَمَارَى فِي الَّذِي قُلْتُ لَهُ"
second: "وَلَقَدْ يَسْمَعُ قَوْلِي حَيَّهَلْ"
vocabulary:
  - term: "يَتَمَارَى"
    text: "«التماري فِي الشَّيْء والامتراء فِيهِ: المجادلة وَالشَّكّ فِيهِ» [@khizana، ج3 ص372]."
  - term: "حَيَّهَلْ"
    text: "«وحيهل: أَي: أسْرع وَأعجل» [@khizana، ج3 ص372]، «فإِنما سَكَّنَهُ لِلْقَافِيَةِ» [@lisan، ج11 ص708]."
