explained: false
first: "يُغْرِقُ الثَّعْلَبَ فِي شِرَّتِهِ"
second: "صَائِبُ الْجِذْمَةِ فِي غَيْرِ فَشَلْ"
vocabulary:
  - term: "الثَّعْلَبَ"
    text: "«وثَعْلَبُ الرُّمْحِ: مَا دَخَلَ فِي جُبَّةِ السِّنان مِنْهُ» [@lisan، ج1 ص238]؛ أي إذا طُعنت عليه الطريدة غاب الرمح فيها."
  - term: "شِرَّتِهِ"
    text: "نشاطه وحدّته."
  - term: "الْجِذْمَةِ"
    text: "السرعة: «وسارَ وأَجْذمَ السيرَ: أَسرع فِيهِ؛ قَالَ لَبِيدٌ» [@lisan، ج12 ص88]. ويذكر المحقق أن الجذمة السوط عند بعضهم [@diwan-labid، ص188]."
