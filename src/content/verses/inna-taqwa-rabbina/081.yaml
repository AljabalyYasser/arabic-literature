    text: "شديد المرارة: «ومَقِرَ الشيءُ، بِالْكَسْرِ، يَمْقَرُ مَقَراً أَي صَارَ مُرًّا» [@lisan، ج5 ص183]."
  - term: "الْأَدْنَيْنَ"
    text: "الأقربين."
