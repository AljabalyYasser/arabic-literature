explained: false
first: "بِأَجَشِّ الصَّوْتِ يَعْبُوبٍ إِذَا"
second: "طَرَقَ الْحَيَّ مِنَ الْغَزْوِ صَهَلْ"
vocabulary:
  - term: "أَجَشِّ الصَّوْتِ"
    text: "«وفرسٌ أَجَشّ الصّوتِ: فِي صَهِيله جَشَش؛ قَالَ لَبِيدٌ» [@lisan، ج6 ص274]، أي غلظ."
  - term: "يَعْبُوبٍ"
    text: "«واليَعْبوبُ: الفَرَسُ الطويلُ السَّرِيعُ؛ وَقِيلَ: الكَثير الجَرْيِ» [@lisan، ج1 ص574]."
  - term: "طَرَقَ"
    text: "أتى ليلًا."
