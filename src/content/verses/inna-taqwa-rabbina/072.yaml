explained: false
first: "فَرَمَيْتُ الْقَوْمَ رِشْقًا صَائِبًا"
second: "لَيْسَ بِالْعُصْلِ وَلَا بِالْمُقْثَعِلْ"
vocabulary:
  - term: "رِشْقًا"
    text: "«الرَّشْق: الرَّمْيُ» [@lisan، ج10 ص116]؛ وينقل المحقق عن ابن السِّيد: «الرشق بكسر الراء أن ترمى سهام كثيرة دفعة» [@diwan-labid، ص195]."
  - term: "الْعُصْلِ"
    text: "المعوجّة، كما ينقل المحقق [@diwan-labid، ص195]."
  - term: "بِالْمُقْثَعِلْ"
    text: "يرى المحقق أنه «لعله تصحيف عن المقتعل» [@diwan-labid، ص195]، وفي اللسان: «والمُقْتَعَلُ: السَّهْمُ الَّذِي لَمْ يُبْرَ بَرْياً جَيِّدًا؛ قَالَ لَبِيدٌ» [@lisan، ج11 ص560]."
