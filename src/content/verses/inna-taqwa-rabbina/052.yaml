explained: false
first: "يَلْمُجُ الْبَارِضَ لَمْجًا فِي النَّدَى"
second: "مِنْ مَرَابِيعِ رِيَاضٍ وَرِجَلْ"
vocabulary:
  - term: "يَلْمُجُ"
    text: "«اللَّمْجُ: الأَكلُ بأَطرافِ الفمِ»، و«قَالَ لَبِيدٌ يَصِفُ عَيراً» [@lisan، ج2 ص358]."
  - term: "الْبَارِضَ"
    text: "«البارِض: أَول مَا يَظْهَرُ مِنْ نَبْتِ الأَرض» [@lisan، ج7 ص116]."
  - term: "مَرَابِيعِ"
    text: "يقول المحقق: «والمرابيع: الأمطار التي تجيء في أول الربيع» [@diwan-labid، ص189]."
  - term: "رِجَلْ"
    text: "«قَالَ أَبو حَنِيفَةَ: الرِّجَل تَكُونُ فِي الغِلَظ واللِّين وَهِيَ أَماكن سَهْلَةٌ تَنْصَبُّ إِليها الْمِيَاهُ فتُمْسكها» [@lisan، ج11 ص274]."
