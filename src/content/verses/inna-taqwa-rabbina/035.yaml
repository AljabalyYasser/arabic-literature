first: "طَامِيَ الْعَرْمَضِ لَا عَهْدَ لَهُ"
second: "بِأَنِيسٍ بَعْدَ حَوْلٍ قَدْ كَمَلْ"
vocabulary:
  - term: "طَامِيَ"
    text: "«طَمَا الماءُ يَطْمُو طُمُوًّا ويَطْمِي طُمِيّاً: ارْتَفَعَ وعَلا» [@lisan، ج15 ص15]. ويقول المحقق إنه صفة لموصوف محذوف: «تقديره ماء أو غدير أو منهل» [@diwan-labid، ص184]."
  - term: "الْعَرْمَضِ"
    text: "«العَرْمَضُ والعِرْماضُ: الطُّحْلُبُ» [@lisan، ج7 ص187]."
