explained: false
first: "أَحْكَمَ الْجِنْثِيُّ مِنْ عَوْرَاتِهَا"
second: "كُلَّ حِرْبَاءٍ إِذَا أُكْرِهَ صَلْ"
vocabulary:
  - term: "الْجِنْثِيُّ"
    text: "الزرّاد صانع الدروع عند ابن قُتَيْبة كما ينقل المحقق [@diwan-labid، ص192]، وقيل السيف، وفي اللسان: «السيفُ بِعَيْنِهِ» [@lisan، ج2 ص129]."
  - term: "عَوْرَاتِهَا"
    text: "فتوقها، كما يقول المحقق [@diwan-labid، ص192]."
  - term: "حِرْبَاءٍ"
    text: "«والحِرْباءُ: مِسْمارُ الدِّرْع، وَقِيلَ: هُوَ رأْسُ المِسْمارِ فِي حَلْقةِ الدِّرْع» [@lisan، ج1 ص306]."
  - term: "صَلْ"
    text: "صوّت، من الصليل."
