explained: false
first: "كُلَّ يَوْمٍ مَنَعُوا جَامِلَهُمْ"
second: "وَمُرِنَّاتٍ كَآرَامِ تُبَلْ"
vocabulary:
  - term: "جَامِلَهُمْ"
    text: "يقول المحقق: «الجامل: الحيّ العظيم»، وإن في اللسان «حاملهم» [@diwan-labid، ص192]."
  - term: "مُرِنَّاتٍ"
    text: "نساء صائحات: «رَنَّت تَرِنُّ رَنيناً ورَنَّنَتْ تَرْنيناً وتَرْنِيَة وأَرَنَّتْ: صَاحَتْ» [@lisan، ج13 ص187]."
  - term: "آرَامِ تُبَلْ"
    text: "ظباؤه البيض، و«وتُبَل: اسْمُ وَادٍ؛ قَالَ لَبِيدٌ» [@lisan، ج11 ص76]."
