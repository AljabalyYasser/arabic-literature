first: "فِي قُرُومٍ سَادَةٍ مِنْ قَوْمِهِ"
second: "نَظَرَ الدَّهْرُ إِلَيْهِمْ فَابْتَهَلْ"
vocabulary:
  - term: "قُرُومٍ"
    text: "سادة، وأصل القَرْم الفحل من الإبل."
  - term: "فَابْتَهَلْ"
    text: "يقول المحقق: «ابتهل: سبّح، أو وقف متضرعاً، أي أنه وقف معجباً وهو ينظر إليهم» [@diwan-labid، ص198]."
