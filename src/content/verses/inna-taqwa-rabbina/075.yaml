explained: false
first: "وَالْهَبَانِيقُ قِيَامٌ مَعَهُمْ"
second: "كُلُّ مَحْجُومٍ إِذَا صُبَّ هَمَلْ"
vocabulary:
  - term: "الْهَبَانِيقُ"
    text: "«الهُبْنقُ والهُبْنُوق والهَبَيْنَقُ والهَبْنيق: الوَصِيفُ؛ قَالَ لَبِيدٌ» [@lisan، ج10 ص365]."
  - term: "مَحْجُومٍ"
    text: "إبريق مسدود الفم؛ ينقل المحقق عن ابن قتيبة: «محجوم: إبريق عليه فدام»، ويرويه صاحب اللسان «ملثوم» [@diwan-labid، ص196]."
  - term: "هَمَلْ"
    text: "فاض."
