explained: false
first: "رَاسِخُ الدِّمْنِ عَلَى أَعْضَادِهِ"
second: "ثَلَمَتْهُ كُلُّ رِيحٍ وَسَبَلْ"
vocabulary:
  - term: "الدِّمْنِ"
    text: "«الصِّحَاحُ: الدِّمْن البَعر؛ قَالَ لَبِيدٌ» بهذا البيت [@lisan، ج13 ص158]."
  - term: "أَعْضَادِهِ"
    text: "جوانبه؛ يقول المحقق: «وقيل عضده: جانباه والجمع أعضاد» [@diwan-labid، ص184]."
  - term: "ثَلَمَتْهُ ... وَسَبَلْ"
    text: "كسرت حرفه كل ريح ومطر؛ يقول المحقق: «ثلمته: كسرته أو كسرت حرفه. السَّبَل: المطر المسبل» [@diwan-labid، ص184]."
