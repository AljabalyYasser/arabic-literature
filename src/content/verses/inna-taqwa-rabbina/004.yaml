explained: false
first: "وَرَقَاقٍ عُصَبٍ ظُلْمَانُهُ"
second: "كَحَزِيقِ الْحَبَشِيِّينَ الزُّجَلْ"
vocabulary:
  - term: "رَقَاقٍ"
    text: "«والرَّقاق، بِالْفَتْحِ: الأَرض السَّهلةُ المُنبسِطة المُستوِية الليِّنةُ الترابِ» [@lisan، ج10 ص123]."
  - term: "ظُلْمَانُهُ"
    text: "ذكور النعام فيه؛ يقول المحقق: «الظُّلمان (بكسر الظاء وضمها) جمع ظليم وهو ذكر النعام» [@diwan-labid، ص174]."
  - term: "حَزِيقِ"
    text: "«الأَصمعي: الحَزِيقُ الْجَمَاعَةُ مِنَ النَّاسِ؛ قَالَ لَبِيدٌ» بهذا البيت [@lisan، ج10 ص47]."
  - term: "الزُّجَلْ"
    text: "«والزُّجْلَة، بِالضَّمِّ: الجماعةُ مِنَ النَّاسِ، وَقِيلَ: هِيَ الْقِطْعَةُ مِنَ كُلِّ شَيْءٍ، وَجَمْعُهَا زُجَل؛ قَالَ لَبِيدٌ» [@lisan، ج11 ص302]."
