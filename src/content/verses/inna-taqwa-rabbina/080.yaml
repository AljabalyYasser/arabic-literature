first: "وَأَرَى أَرْبَدَ قَدْ فَارَقَنِي"
second: "وَمِنَ الْأَرْزَاءِ رُزْءٌ ذُو جَلَلْ"
meaning: "وأرى أخي أربد قد فارقني بالموت، والمصائب درجات، ومنها مصيبة عظيمة، وهي هذه."
vocabulary:
  - term: "أَرْبَدَ"
    text: "أربد بن قيس: «وكان أربد بن قيس أخا لبيد بن ربيعة لأمه» [@aghani-dk، ج17 ص58]."
  - term: "الْأَرْزَاءِ ... رُزْءٌ"
    text: "«والرُّزْءُ: المُصِيبةُ» [@lisan، ج1 ص86]، وجمعه أرزاء."
  - term: "جَلَلْ"
    text: "«والجَلَل: الشَّيْءُ الْعَظِيمُ وَالصَّغِيرُ الهَيِّن، وَهُوَ مِنَ الأَضداد فِي كَلَامِ الْعَرَبِ» [@lisan، ج11 ص117]، وهو هنا العظيم."
context: "أول ذكر لأربد في القصيدة، وبه يتحول الكلام بعد ملل الحياة (78–79) إلى رثاء الأخ (80–85). وأربد مات بصاعقة بعد رجوعه من وفد بني عامر على النبي صلى الله عليه وسلم: «فأرسل الله عليه وعلى جمله صاعقةً فأحرقتهما» [@aghani-dk، ج17 ص58]. وهذا البيت هو حجة المحقق إحسان عباس في تاريخ القصيدة: «وهذا كلام موهم لأن القصيدة قيلت بعد موت أربد وكان لبيد قد أسلم» [@diwan-labid، ص174]. وللبيد في أربد مراث أخرى، منها «بَلِينَا وَمَا تَبْلَى النُّجُومُ الطَّوَالِعُ» [@diwan-labid، ص168]."
syntax:
  - "«وَأَرَى» مضارع، فاعله ضمير المتكلم، و«أَرْبَدَ» مفعول به ممنوع من الصرف للعلمية ووزن الفعل."
  - "جملة «قَدْ فَارَقَنِي» في محل نصب، مفعولًا ثانيًا إن كانت «أرى» بمعنى أعلم، أو حالًا إن كانت بصرية؛ والنون في «فارقني» للوقاية والياء مفعول به."
  - "«وَمِنَ الْأَرْزَاءِ» جار ومجرور متعلق بمحذوف خبر مقدم، و«رُزْءٌ» مبتدأ مؤخر، و«ذُو» نعته مرفوع بالواو لأنه من الأسماء الخمسة، و«جَلَلْ» مضاف إليه سُكّن للقافية."
morphology:
  - "«أَرْبَد» على «أَفْعَل»، ولذلك مُنع من الصرف."
  - "«فَارَقَ» على «فاعَلَ»."
  - "«أَرْزَاء» جمع «رُزْء» على «أَفْعَال»."
  - "«جَلَل» على «فَعَل»، من الأضداد."
rhetoric:
  thesis: "الفقد في آخر العمر: يرى الشاعر أخاه قد مضى، فيضع مصيبته في أعلى درجات المصائب."
  devices:
    - title: "الكناية"
      text: "«قَدْ فَارَقَنِي»: لم يقل «مات»، بل ذكر الفراق وهو لازم الموت. وعبد القاهر الجُرْجانيّ يحدّ الكناية بأن يريد المتكلم معنى فلا يذكره بلفظه، «ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود» [@dalail، ص66]."
    - title: "التذييل"
      text: "«وَمِنَ الْأَرْزَاءِ رُزْءٌ ذُو جَلَلْ»: عقّب الخبر الخاص بجملة عامة تجري مجرى الحكمة، فرفع مصيبته إلى سنن الدهر. والتذييل: أن يُتبع الكلام بجملة تؤكد معناه."
    - title: "التنكير والأضداد"
      text: "«رُزْءٌ ذُو جَلَلْ»: نكّر الرزء للتعظيم، ثم وصفه بالجلل، وهو من الأضداد، فدلّ السياق على العظيم دون الهيّن."
  connection: "ثم يصف أربد: مرّ على أعدائه، حلو على أقاربه كالعسل."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "وَأَرَى أَرْ / بَدَ قَدْ فَا / رَقَنِي = فعِلاتن / فعِلاتن / فعِلن — وَمِنَلْ أَرْ / زَاءِ رُزْءُنْ / ذُو جَلَلْ = فعِلاتن / فاعلاتن / فاعلن"
  note: "دخل الخَبْنُ تفعيلات الصدر كلها، والتفعيلةَ الأولى من العجز، وسلم الضرب «فاعلن» [@atiq، ص79–80]."
