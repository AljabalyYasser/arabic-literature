explained: false
first: "لَمْ أَقِلْ إِلَّا عَلَيْهِ أَوْ عَلَى"
second: "مَرْقَبٍ يَفْرَعُ أَطْرَافَ الْجَبَلْ"
vocabulary:
  - term: "لَمْ أَقِلْ"
    text: "لم أنم القائلة، و«الْقَائِلَةُ: الظَّهِيرة» [@lisan، ج11 ص577]."
  - term: "مَرْقَبٍ"
    text: "«والمَرْقَبُ والمَرْقَبةُ: الموضعُ المُشْرِفُ، يَرْتَفِعُ عَلَيْهِ الرَّقِيبُ» [@lisan، ج1 ص425]."
  - term: "يَفْرَعُ"
    text: "يعلو، من «فَرْعُ كُلِّ شَيْءٍ: أَعْلاه» [@lisan، ج8 ص246]."
