first: "وَلَدَى النُّعْمَانِ مِنِّي مَوْطِنٌ"
second: "بَيْنَ فَاثُورِ أُفَاقٍ فَالدَّحَلْ"
vocabulary:
  - term: "فَاثُورِ أُفَاقٍ فَالدَّحَلْ"
    text: "مواضع: «وَفَاثُورٌ: مَوْضِعٌ؛ عَنْ كُرَاعٍ؛ قَالَ لَبِيدٌ» [@lisan، ج5 ص45]. وينقل المحقق عن ابن السِّيد: «فاثور أفاق فالدحل موضعان. وهذا هو يوم الإفاقة ومقام لبيد فيه» [@diwan-labid، ص194]."
