  - reading: "إِنَّ تَقْوَى رَبِّنَا خَيْرُ النَّفَلْ"
    status: "رواية أبي عُبَيْدة"
    note: "يقول البغدادي: «قَوْله: خير نفل هَذِه رِوَايَة الْأَصْمَعِي وروى أَبُو عُبَيْدَة: خير النَّفْل» [@khizana، ج3 ص373]."
