first: "إِنَّ تَقْوَى رَبِّنَا خَيْرُ نَفَلْ"
second: "وَبِإِذْنِ اللَّهِ رَيْثِي وَعَجَلْ"
meaning: "تقوى الله خير ما يُعطاه الإنسان ويغنمه، وكل ما أفعله، أبطأتُ فيه أو عجلت، فهو بإذن الله. وفي الخزانة عن شرح الطُّوسِيّ: «وَالنَّفْل: الْفضل والعطية»، و«والريث مصدر رثت أريث: إِذا أَبْطَأت» [@khizana، ج3 ص373]."
vocabulary:
  - term: "نَفَلْ"
    text: "العطية والزيادة: «وَالنَّفْل: الْفضل والعطية كَذَا قَالَ الطوسي» [@khizana، ج3 ص373]. وفي اللسان: «النَّفَل، بِالتَّحْرِيكِ: الغنيمةُ والهبةُ؛ قَالَ لَبِيدٌ» [@lisan، ج11 ص670]. ومنه النافلة في الصلاة، لأنها زيادة على الفرض [@khizana، ج3 ص373]."
  - term: "رَيْثِي"
    text: "بطئي: «الرَّيْثُ: الإِبْطاءُ» [@lisan، ج2 ص157]."
  - term: "بِإِذْنِ اللَّهِ"
    text: "بأمره ومشيئته. وينقل البغدادي عن الشريف المرتضى أنه يحتمل أن يريد «بِعِلْمِهِ» [@khizana، ج3 ص373]."
context: "مطلع القصيدة، وليس فيه وقوف على الأطلال ولا نسيب، بل حكم ديني يبدأ به الشاعر كلامه. وهو أول الأبيات الثلاثة التي يروي أبو الفَرَج أن لبيدًا أنشدها في مسجد الكوفة جوابًا لرسول القرّاء الأشراف حين سألوه عن أشعر العرب، فذكر امرأ القيس ثم طَرَفة ثم قال: «صاحب المِحْجَن حيث يقول»، وأنشد هذه الأبيات، «يعني نفسه. ثم قال: أستغفر الله» [@aghani-dk، ج15 ص372]. ويروي ابن الأنباري بإسناده أن عمر بن الخطاب «كان يأمر برواية قصيدة لبيد: إن تقوى ربنا خير نفل» [@ibn-al-anbari، ص510]. فالمطلع هو الذي سُمّيت به القصيدة في الأخبار."
syntax:
  - "«إِنَّ» حرف توكيد ونصب، و«تَقْوَى» اسمها منصوب بفتحة مقدرة على الألف، و«رَبِّنَا» مضاف إليه، و«خَيْرُ» خبر «إنّ»، و«نَفَلْ» مضاف إليه مجرور، وسُكّن للقافية."
  - "«وَبِإِذْنِ اللَّهِ» جار ومجرور متعلق بمحذوف خبر مقدم، و«رَيْثِي» مبتدأ مؤخر مرفوع بضمة مقدرة على ما قبل ياء المتكلم، و«وَعَجَلْ» معطوف عليه، والتقدير: وعجلي."
morphology:
  - "«تَقْوَى» اسم من «اتَّقَى»، وأصله من «وَقَى يَقِي»، والتاء فيه مبدلة من الواو."
  - "«نَفَل» على «فَعَل»، وجمعه «أنفال»، وبه سميت سورة الأنفال."
  - "«رَيْث» مصدر «رَاثَ يَرِيثُ» إذا أبطأ، أجوف يائي؛ و«عَجَل» مصدر «عَجِلَ يَعْجَلُ»."
rhetoric:
  thesis: "يفتتح القصيدة بالتقوى لا بالديار: هي أنفس العطايا، والإنسان في سرعته وبطئه يمضي بإذن الله."
  devices:
    - title: "التشبيه البليغ"
      text: "«تَقْوَى رَبِّنَا خَيْرُ نَفَلْ»: جعل التقوى غنيمة وعطاء، فذكر الطرفين وحذف الأداة ووجه الشبه. وليس هذا استعارة عند عبد القاهر الجُرْجانيّ، لأن الاستعارة عنده «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]، وهنا المشبه مذكور مخبَر عنه."
    - title: "التقديم"
      text: "«وَبِإِذْنِ اللَّهِ رَيْثِي»: قدّم الخبر الجار والمجرور على المبتدأ، فصار المعنى أن ريثه وعجله بإذن الله لا بغيره. ويردّ عبد القاهر التقديم إلى العناية، ناقلًا قول سيبويه: «كأنَّهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أَعْنى» [@dalail، ص107]. والأهم هنا إذن الله."
    - title: "الطباق"
      text: "«رَيْثِي وَعَجَلْ»: جمع البطء والعجلة، وهما ضدان، فاستغرق بهما أحوال الإنسان في سعيه كلها. والطباق: الجمع بين معنيين متضادين."
  connection: "ثم يحمد الله الذي لا نِدّ له، والخير بيده."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ اللام الساكنة"
  scansion: "إِنْنَ تَقْوَى / رَبْبِنَا خَيْ / رُ نَفَلْ = فاعلاتن / فاعلاتن / فعِلن — وَبِإِذْنِلْ / لَاهِ رَيْثِي / وَعَجَلْ = فعِلاتن / فاعلاتن / فعِلن"
  note: "وزن الرمل التام «فاعلاتن فاعلاتن فاعلن» في كل شطر، وعَرُوضه وضربه محذوفان: «فاعلن». ودخل الخَبْنُ، وهو حذف الثاني الساكن، العروضَ والضرب فصارتا «فعِلن»، والتفعيلةَ الأولى من العجز فصارت «فعِلاتن»، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79–80]. والقافية مقيدة: رويّها لام ساكنة، والبيت مصرّع، اتفق آخر شطريه في القافية: «نَفَلْ» و«عَجَلْ»."
variants:
  - reading: "وَبِإِذْنِ اللَّهِ رَيْثِي وَالْعَجَلْ"
