explained: false
first: "يَرْهَبُ الْعَاجِزُ مِنْ لُجَّتِهِ"
second: "فَيُدَعِّي فِي مَبِيتٍ وَمَحَلْ"
vocabulary:
  - term: "لُجَّتِهِ"
    text: "معظم ظلمة الليل."
  - term: "فَيُدَعِّي"
    text: "يقيم ويبقى؛ يقول المحقق: «يدعّي: يبقى وهو من قولهم دعّى في الضرع أي أبقى فيه قليلاً من اللبن» [@diwan-labid، ص181]، و«ودَاعِيَة اللَّبَنِ: مَا يُترك فِي الضَّرْع ليَدْعُو مَا بَعْدَهُ» [@lisan، ج14 ص259]. ويرويه صاحب اللسان «فيُدَنِّي»، ويقول: «والمُدَنِّي مِنَ النَّاسِ الضَّعِيفُ الَّذِي إِذا آوَاهُ الليلُ لَمْ يَبْرَحْ ضَعْفًا» [@lisan، ج14 ص275]."
