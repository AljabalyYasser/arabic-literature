explained: false
first: "إِذَا احْتَمَلُوا رَأْسِي وَفِي الرَّأْسِ أَكْثَرِي"
second: "وَغُودِرَ عِنْدَ المُلْتَقَى ثَمَّ سَائِرِي"
vocabulary:
  - term: "غُودِرَ"
    text: "تُرك؛ «والمغادرة: الترك» [@lisan، ج5 ص8]."
  - term: "المُلْتَقَى"
    text: "موضع القتال حيث يلتقي الجمعان، وهو المعركة في حاشية محقق شرح الحماسة للتبريزي: «وتركوا باقي بدني في المعركة» [@tabrizi-hamasa، ج1 ص188، الحاشية]."
  - term: "سَائِرِي"
    text: "باقيّ، أي بقية جسدي؛ «والسائر بمعنى الباقي» [@tabrizi-hamasa، ج1 ص188، الحاشية]."
