explained: false
first: "عَزَلْتُ اللَّاتَ وَالعُزَّى جَمِيعًا"
second: "كَذَلِكَ يَفْعَلُ الجَلْدُ الصَّبُورُ"
vocabulary:
  - term: "اللَّاتَ وَالعُزَّى"
    text: "صنمان، «أن اللات صنم كان لثقيف، والعزى صنم كان لقريش وبني كنانة» [@lisan، ج5 ص378]. ويقول محققو السيرة: «وكانت العزى نخلات مجتمعة» [@ibn-hisham، ج1 ص226، الحاشية]."
  - term: "الجَلْدُ"
    text: "القوي الصابر على الشدة؛ «الجلد القوة والصبر» [@lisan، ج3 ص125]."
