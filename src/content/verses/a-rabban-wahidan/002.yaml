first: "عَزَلْتُ اللَّاتَ وَالعُزَّى جَمِيعًا"
second: "كَذَلِكَ يَفْعَلُ الجَلْدُ الصَّبُورُ"
vocabulary:
  - term: "اللَّاتَ وَالعُزَّى"
    text: "صنمان من أعظم أصنام العرب، كانت اللات لثقيف بالطائف. ويقول محققو السيرة: «وكانت العزى نخلات مجتمعة» [@ibn-hisham، ج1 ص226، الحاشية]."
  - term: "الجَلْدُ"
    text: "القوي الصابر على الشدة."
