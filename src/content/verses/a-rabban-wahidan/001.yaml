first: "أَرَبًّا وَاحِدًا أَمْ أَلْفَ رَبٍّ"
second: "أَدِينُ إِذَا تُقُسِّمَتِ الأُمُورُ"
vocabulary:
  - term: "أَدِينُ"
    text: "أعبد وأطيع، من الدِّين بمعنى الطاعة."
  - term: "إِذَا تُقُسِّمَتِ الأُمُورُ"
    text: "إذا وُزّعت الأمور على الأرباب، فجُعل لكل صنم شأن من شؤون الناس."
