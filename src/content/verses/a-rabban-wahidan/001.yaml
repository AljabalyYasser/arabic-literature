explained: false
first: "أَرَبًّا وَاحِدًا أَمْ أَلْفَ رَبٍّ"
second: "أَدِينُ إِذَا تُقُسِّمَتِ الأُمُورُ"
vocabulary:
  - term: "أَدِينُ"
    text: "أعبد وأطيع، من الدِّين بمعنى الطاعة؛ «والدين الطاعة، وقد دنته ودنت له أي أطعته» [@lisan، ج13 ص169]."
  - term: "إِذَا تُقُسِّمَتِ الأُمُورُ"
    text: "إذا وُزّعت الأمور على الأرباب، فجُعل لكل صنم شأن من شؤون الناس؛ و«تقسموا الشيء واقتسموه وتقاسموه: قسموه بينهم» [@lisan، ج12 ص478]."
