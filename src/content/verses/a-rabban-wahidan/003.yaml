explained: false
first: "فَلَا العُزَّى أَدِينُ وَلَا ابْنَتَيْهَا"
second: "وَلَا صَنَمَيْ بَنِي عَمْرٍو أَزُورُ"
vocabulary:
  - term: "ابْنَتَيْهَا"
    text: "صنمان يُجعلان ابنتين للعُزّى، ولم نجد في مصادرنا من يسمّيهما."
  - term: "صَنَمَيْ بَنِي عَمْرٍو"
    text: "يقول محققو السيرة: «كذا في الأصول: يريد قبيل أبيه»، وإن رواية «كتاب الأصنام» لابن الكَلْبيّ «بني غنم» [@ibn-hisham، ج1 ص226، الحاشية]، وهي رواية «الأغاني» [@aghani-dk، ج3 ص125]."
