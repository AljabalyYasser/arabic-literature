explained: false
first: "وَلَا هُبَلًا أَدِينُ وَكَانَ رَبًّا"
second: "لَنَا فِي الدَّهْرِ إِذْ حِلْمِي يَسِيرُ"
vocabulary:
  - term: "هُبَلًا"
    text: "صنم قريش، يقول محققو السيرة: «وهبل (كصرد): صنم لهم» [@ibn-hisham، ج1 ص226، الحاشية]."
  - term: "إِذْ حِلْمِي يَسِيرُ"
    text: "حين كان عقلي قليلًا، يعني صباه قبل أن يعرف الحق."
