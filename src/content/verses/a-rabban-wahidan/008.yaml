explained: false
first: "وَبَيْنَا المَرْءُ يَعْثُرُ ثَابَ يَوْمًا"
second: "كَمَا يَتَرَوَّحُ الغُصْنُ المَطِيرُ"
vocabulary:
  - term: "يَعْثُرُ"
    text: "يزلّ ويضعف. وفي نسخة من نسخ السيرة «يفتر»، أي يسكن بعد حدّته، كما يقول محققوها [@ibn-hisham، ج1 ص227، الحاشية]."
  - term: "ثَابَ"
    text: "«رجع» [@ibn-hisham، ج1 ص227، الحاشية]، أي عاد إلى قوته."
  - term: "يَتَرَوَّحُ الغُصْنُ المَطِيرُ"
    text: "يقول محققو السيرة: «يتروح: يهتز ويخضر، وينبت ورقه بعد سقوطه» [@ibn-hisham، ج1 ص227، الحاشية]. والمَطِير: الذي أصابه المطر."
