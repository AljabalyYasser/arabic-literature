explained: false
first: "مَا زِلْتُ أَرْمُقُهُمْ حَتَّى إِذَا هَبَطَتْ"
second: "أَيْدِي الرِّكَابِ بِهِمْ مِنْ رَاكِسٍ فَلَقَا"
vocabulary:
  - term: "أَرْمُقُهُمْ"
    text: "«ألحظهم وأنظر إليهم، حزنًا لفراقهم» [@diwan-zuhayr، ص65]."
  - term: "الرِّكَابِ"
    text: "الإبل التي يُرحل عليها [@diwan-zuhayr، ص65]."
  - term: "رَاكِسٍ"
    text: "اسم واد [@diwan-zuhayr، ص65]."
  - term: "فَلَقَا"
    text: "المطمئن من الأرض بين جبلين [@diwan-zuhayr، ص65]."
