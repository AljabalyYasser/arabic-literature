first: "وَفَارَقَتْكَ بِرَهْنٍ لَا فِكَاكَ لَهُ"
second: "يَوْمَ الْوَدَاعِ فَأَمْسَى الرَّهْنُ قَدْ غَلِقَا"
meaning: "رحلت عنك أسماء وقلبك رهن عندها لا يُفتكّ، فلما مضى يوم الوداع صار الرهن لها لا يعود إليك، كما يصير الرهن ملكًا للمرتهن إذا مضى أجله ولم يُفكّ."
vocabulary:
  - term: "بِرَهْنٍ"
    text: "عند الأعلم: «أراد بالرهن: قلبه، أي: ذهبت به وارتهنته، فلا يُفكّ أبدًا» [@diwan-zuhayr، ص63]."
  - term: "فِكَاكَ"
    text: "ما يُخلَّص به الرهن. وفي الشرح المنسوب إلى ثَعْلَب: «يقال: هلمّ فكاكَ رهنك» [@sharh-thalab-zuhayr، ص38]."
  - term: "غَلِقَا"
    text: "صار للمرتهن. وفي اللسان: «وغَلِقَ الرَّهْنُ فِي يَدِ الْمُرْتَهِنِ يَغْلق غَلَقاً وغُلُوقاً، فَهُوَ غَلِقٌ، اسْتَحَقَّهُ الْمُرْتَهِنُ، وَذَلِكَ إِذَا لَمْ يُفْتَكّ فِي الْوَقْتِ الْمَشْرُوطِ» [@lisan، ج10 ص292]."
context: "يتم صورة البيت الأول: ما «علق» به القلب صار رهنًا. والأعلم يجعله مثلًا: «وهذا مثل، ضربه لذهابها بقلبه، واستيلائها عليه» [@diwan-zuhayr، ص63]. ويستشهد به ابن منظور على غلق الرهن ويقول: «يَعْنِي أَنَّهَا ارْتَهَنَتْ قَلْبَهُ وَرَهَنَتْ بِهِ» [@lisan، ج10 ص292]."
syntax:
  - "«وَفَارَقَتْكَ»: فعل ماض والتاء للتأنيث، والفاعل ضمير أسماء، والكاف مفعول به. انتقل من الحديث عن «القلب» في البيت الأول إلى خطاب نفسه."
  - "«بِرَهْنٍ» متعلق بـ«فارقتك»، والباء للمصاحبة: فارقتك ومعها رهن. وجملة «لَا فِكَاكَ لَهُ» صفة لـ«رهن»، و«لا» نافية للجنس، و«فكاك» اسمها مبني على الفتح، و«له» خبرها."
  - "«يَوْمَ الْوَدَاعِ» ظرف متعلق بـ«فارقتك». و«فَأَمْسَى الرَّهْنُ قَدْ غَلِقَا»: «أمسى» فعل ناقص بمعنى صار، و«الرهن» اسمها، وجملة «قد غلقا» خبرها."
morphology:
  - "«فَارَقَتْ» على «فاعَلَتْ» من «فرق»، وهو بناء المشاركة: الفراق يقع بين اثنين."
  - "«فِكَاك» مصدر على «فِعال» من «فكّ»، و«الْوَدَاع» اسم على «فَعال» من «ودّع»."
  - "«غَلِقَ» لازم على «فَعِلَ»، ومصدره الغَلَق والغُلُوق [@lisan، ج10 ص292]."
rhetoric:
  thesis: "العشق دَيْن خاسر: قلب رُهن فلم يُفكّ في أجله، فصار ملكًا لمن أخذه."
  devices:
    - title: "الاستعارة في «بِرَهْنٍ»"
      text: "«بِرَهْنٍ لَا فِكَاكَ لَهُ»: سمّى قلبه رهنًا ولم يذكر القلب، فهي استعارة، وهي عند عبد القاهر: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. ووجه الشبه أن القلب محبوس عند غير صاحبه، لا يعود إليه إلا بفكاك لا يملكه."
    - title: "عُرف جاهلي في الصورة"
      text: "«فَأَمْسَى الرَّهْنُ قَدْ غَلِقَا»: بنى الصورة على عُرف معروف يذكره الأعلم: «وكان أهل الجاهلية إذا ارتهن الرجل منهم رهنًا إلى أجل، فأتى الأجل ولم يفكّ الرهن صاحبه، استوجبه المرتهن عوضًا من حقّه، ولم يكن لصاحبه أن يفكّه أبدًا. فلذلك ضرب به زهير المثل» [@diwan-zuhayr، ص63]. فـ«يوم الوداع» هو الأجل الذي مضى."
    - title: "النفي المستغرق"
      text: "«لَا فِكَاكَ لَهُ»: نفى جنس الفكاك كله بـ«لا» النافية للجنس، ثم أكّده العجز بالغلق، فاجتمع على الرهن نفي الخلاص وثبوت الملك."
  connection: "ثم يذكر ما أغلق الرهن: أخلفته ما وعدت، فوهن الحبل بينهما."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "وَفَارَقَتْ / كَبِرَهْ / نِنْلَافِكَا / كَلَهُو = متفعلن / فعِلن / مستفعلن / فعِلن — يَوْمَلْوَدَا / عِفَأَمْ / سَرْرَهْنُقَدْ / غَلِقَا = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "أُشبعت ضمة الهاء في «لَهُ» فصارت «لَهُو». ودخل الخبنُ «مستفعلن» الأولى في الصدر و«فاعلن» في الشطرين [@atiq، ص46]، والعروض والضرب مخبونان [@atiq، ص48]."
