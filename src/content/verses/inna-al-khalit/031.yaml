first: "يَطْعَنُهُمْ مَا ارْتَمَوْا حَتَّى إِذَا اطَّعَنُوا"
second: "ضَارَبَ حَتَّى إِذَا مَا ضَارَبُوا اعْتَنَقَا"
meaning: "ما دام الأقران يترامون بالنبل من بعيد فهو يدخل عليهم فيطاعنهم بالرمح، فإذا تطاعنوا بالرماح ضاربهم بالسيف، فإذا تضاربوا بالسيوف اعتنق قرنه: هو أبدًا أقرب منهم إلى العدو بمرتبة. وفي الشرح المنسوب إلى ثَعْلَب: «وإنما أراد أن يخبر أنه أقربهم إلى القتال» [@sharh-thalab-zuhayr، ص51]."
vocabulary:
  - term: "ارْتَمَوْا"
    text: "تراموا بالنبل. يقول الأعلم: «إذا ارتمى الناس في الحرب بالنبل دخل هو تحت الرمي، فجعل يطاعنهم» [@diwan-zuhayr، ص77]."
  - term: "اطَّعَنُوا"
    text: "تطاعنوا بالرماح."
  - term: "اعْتَنَقَا"
    text: "التزم قرنه. وفي اللسان: «وَقِيلَ: المُعَانقة فِي الْمَوَدَّةِ والاعْتِناقُ فِي الْحَرْبِ»، واستشهد بهذا البيت [@lisan، ج10 ص272]."
context: "من أشهر أبيات القصيدة، وهو آخرها في رواية الأصمعي. قال ابن قُتَيْبة: «ويستحسن قوله» وأنشده [@ibn-qutayba، ج1 ص140]، وجعله مما سبق إليه زهير: «ومما سبق إليه زهير فلم ينازع فيه» [@ibn-qutayba، ج1 ص148]، ثم قال: «فجمع فى بيت واحد صنوف القتال» [@ibn-qutayba، ج1 ص149]. أما ابن رَشِيق فيجعله أخذًا خفيًّا من بيت المُهَلْهِل «أنبضوا معجس القسي»: «وأما النظر والملاحظة فمثل قول مهلهل»، ثم: «نظر إليه زهير بقوله» [@ibn-rashiq، ج2 ص287]. والنظر والملاحظة عنده: «فإن تساوى المعنيان دون اللفظ وخفي الأخذ فذلك النظر والملاحظة» [@ibn-rashiq، ج2 ص282]. فالبيت عند الأول سبق، وعند الثاني أخذ."
syntax:
  - "«يَطْعَنُهُمْ مَا ارْتَمَوْا»: «ما» مصدرية ظرفية، والتقدير: مدة ارتمائهم، أي ما داموا يترامون."
  - "«حَتَّى إِذَا اطَّعَنُوا ضَارَبَ»: «حتى» ابتدائية، و«إذا» ظرف شرط، وجملة «اطّعنوا» في موضع جر بإضافة «إذا» إليها، و«ضارب» جوابها. ومثلها «حَتَّى إِذَا مَا ضَارَبُوا اعْتَنَقَا»، و«ما» زائدة بعد «إذا»."
  - "فاعل «يطعنهم» و«ضارب» و«اعتنق» ضمير الممدوح، وفاعل «ارتموا» و«اطّعنوا» و«ضاربوا» ضمير الأقران، فالبيت يتناوب بين فعلهم وفعله."
morphology:
  - "«ارْتَمَوْا» على «افْتَعَلُوا» من «رمى»، و«اطَّعَنُوا» على «افْتَعَلُوا» من «طعن»، أصلها «اطْتَعَنوا» قُلبت تاء الافتعال طاءً وأُدغمت في الطاء. وصيغة الافتعال هنا للمشاركة: رمى بعضهم بعضًا، وطعن بعضهم بعضًا."
  - "«ضَارَبَ» و«ضَارَبُوا» على «فاعَلَ» للمشاركة، و«اعْتَنَقَ» على «افْتَعَلَ» من «عنق»."
  - "«يَطْعَنُ» بفتح العين كما ضبطه الأعلم، وفي اللسان: «طَعَنه بالرُّمْحِ يَطْعُنه ويَطْعَنُه طَعْناً» [@lisan، ج13 ص265]."
rhetoric:
  thesis: "الشجاعة سُلّم: كلما اقترب الأقران مرتبة كان هرم قد سبقهم إلى التي بعدها."
  devices:
    - title: "التدرج في مراتب القتال"
      text: "«ارْتَمَوْا ... اطَّعَنُوا ... ضَارَبُوا ... اعْتَنَقَا»: رتب أحوال الحرب من الأبعد إلى الأقرب: النبل، ثم الرمح، ثم السيف، ثم العناق. وجعل الممدوح في كل مرتبة أقرب منهم بواحدة. وهذا ما رآه ابن قتيبة حين قال: «فجمع فى بيت واحد صنوف القتال» [@ibn-qutayba، ج1 ص149]. ويشرحه الأعلم: «يصف أنه يزيد عليهم، في كلّ حال، من أحوال الحرب» [@diwan-zuhayr، ص77]."
    - title: "تكرار «ضَارَبَ» بين الفعلين"
      text: "جاء «ضارب» مرة فعلًا له ومرة «ضاربوا» فعلًا لهم: ما كان فعله في الدرجة الثانية صار فعلهم في الثالثة، فسبقهم إلى العناق. فلفظ البيت نفسه يتقدم كما يتقدم الفارس."
    - title: "النظر والملاحظة"
      text: "يرى ابن رشيق أن زهيرًا «نظر» في هذا البيت إلى بيت المهلهل [@ibn-rashiq، ج2 ص287]. والمعنى المشترك أن يلقى الفارس فعل عدوه بما هو أشد منه. لكن المهلهل وقف عند التهدد قبل القتال، وزهير مضى بالمعنى في مراتب القتال كلها."
  connection: "ثم يضيف إلى الشجاعة البلاغة: «هذا، وليس كمن يعيا بخطته»، وهو بيت من غير رواية الأصمعي."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "يَطْعَنُهُمْ / مَرْتَمَوْ / حَتْتَى إِذَطْ / طَعَنُو = مستعلن / فاعلن / مستفعلن / فعِلن — ضَارَبَحَتْ / تَى إِذَا / مَاضَارَبُعْ / تَنَقَا = مستعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الطيّ «مستفعلن» الأولى في الشطرين فصارت «مستعلن» [@atiq، ص47]. وتسقط همزة الوصل في «ارتموا» و«اطّعنوا» و«اعتنقا»."
