first: "هُوَ الْجَوَادُ فَإِنْ يَلْحَقْ بِشَأْوِهِمَا"
second: "عَلَى تَكَالِيفِهِ فَمِثْلُهُ لَحِقَا"
meaning: "هرم هو الفرس السابق في هذا السباق: فإن أدرك غاية أبيه وجده على ما يتكلفه من المشقة، فليس ذلك عجيبًا، لأن مثله يلحق."
vocabulary:
  - term: "الْجَوَادُ"
    text: "الفرس السابق، ويقال أيضًا للكريم. وفي الشرح المنسوب إلى ثَعْلَب: «الجواد: هرم» [@sharh-thalab-zuhayr، ص49]."
  - term: "بِشَأْوِهِمَا"
    text: "بغايتهما في السباق. وفي الشرح المنسوب إلى ثعلب: «يطلب شأوهما: سبقهما» [@sharh-thalab-zuhayr، ص49]."
  - term: "تَكَالِيفِهِ"
    text: "«تكاليفه: شدّته. الواحدة تكلفة» [@sharh-thalab-zuhayr، ص49]."
context: "يكمل صورة البيت السابق: كان فيه «شأو» السباق، وهنا يصرّح بالفرس. يقول الأعلم: «أي: الممدوح بمنزلة الجواد من الخيل، في مسابقة أبويه، فإن لحق بهما وساواهما، على ما يتكلّف من الشدّة والمشقّة، فمثله لحق ذلك، لكرمه وجودته» [@diwan-zuhayr، ص74]. والبيت الذي بعده يتم القسمة: «أو يسبقاه»، فإن سبقاه فلهما فضل التقدم."
syntax:
  - "«هُوَ الْجَوَادُ»: مبتدأ وخبر، وتعريف الخبر بـ«ال» يجعله الجواد الكامل في جنسه."
  - "«فَإِنْ يَلْحَقْ»: «إنْ» شرطية جزمت «يلحقْ». و«بِشَأْوِهِمَا» متعلق به، و«عَلَى تَكَالِيفِهِ» متعلق به أيضًا، و«على» بمعنى «مع»: مع ما يتكلفه."
  - "«فَمِثْلُهُ لَحِقَا»: الفاء رابطة لجواب الشرط لأنه جملة اسمية، و«مثله» مبتدأ، وجملة «لحقا» خبره، والألف للإطلاق."
morphology:
  - "«الْجَوَاد» صفة على «فَعَال» من «جاد يجود»."
  - "«تَكَالِيف» جمع «تكلفة» على «تَفاعيل» [@sharh-thalab-zuhayr، ص49]، من «كلّف» على «فعّل»."
  - "«يَلْحَقْ» مضارع «لَحِقَ» على «فَعِلَ يَفْعَلُ»، و«لَحِقَا» ماضيه في القافية."
rhetoric:
  thesis: "الكرم سباق، والممدوح فرس أصيل: لحاقه بالسابقين متوقع من جوهره."
  devices:
    - title: "التشبيه بلا أداة في «هُوَ الْجَوَادُ»"
      text: "جعل هرمًا هو الجواد، ولم يقل «كالجواد»، فحذف الأداة ووجه الشبه، وهو أقوى التشبيه. والأعلم يردّه إلى أصله: «الممدوح بمنزلة الجواد من الخيل» [@diwan-zuhayr، ص74]. وفي اللفظ معنيان معًا: الجواد الفرس السابق، والجواد الرجل الكريم، وكلاهما مراد في المدح."
    - title: "التعليل بالطبع"
      text: "«فَمِثْلُهُ لَحِقَا»: لم يقل «فقد لحق»، بل جعل اللحاق من شأن أمثاله، فصار الحكم صفة ثابتة لا حادثة. والأعلم يعلّله: «لكرمه وجودته» [@diwan-zuhayr، ص74]."
    - title: "الاحتراس بـ«عَلَى تَكَالِيفِهِ»"
      text: "لم يجعل اللحاق سهلًا، بل ذكر المشقة التي يتكلفها، فيعظم الأب والجد، ويعظم الابن الذي يحتمل المشقة ليلحق بهما."
  connection: "ثم يأخذ الاحتمال الآخر: أن يسبقاه، فلهما فضل ما قدّما."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "هُوَلْجَوَا / دُفَإِنْ / يَلْحَقْبِشَأْ / وِهِمَا = متفعلن / فعِلن / مستفعلن / فعِلن — عَلَى تَكَا / لِيفِهِي / فَمِثْلُهُو / لَحِقَا = متفعلن / فاعلن / متفعلن / فعِلن"
  note: "أُشبعت كسرة الهاء في «تَكَالِيفِهِ» وضمتها في «فَمِثْلُهُ». ودخل الخبن أكثر تفعيلات البيت [@atiq، ص46]."
