explained: false
first: "دَانِيَةً لِشَرَوْرَى أَوْ قَفَا أَدَمٍ"
second: "تَسْعَى الْحُدَاةُ عَلَى آثَارِهِمْ حِزَقَا"
vocabulary:
  - term: "لِشَرَوْرَى أَوْ قَفَا أَدَمٍ"
    text: "شرورى وأدم: «موضعان أو جبلان» [@diwan-zuhayr، ص66]."
  - term: "الْحُدَاةُ"
    text: "السائقون للإبل [@diwan-zuhayr، ص66]."
  - term: "حِزَقَا"
    text: "جماعات، واحدتها حِزْقة. ويقول الأعلم: «وإنما جعل الحداة جماعات ليخبر بكثرة القوم، وعجلتهم في السير» [@diwan-zuhayr، ص66]."
