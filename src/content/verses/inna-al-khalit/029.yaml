first: "وَلَيْسَ مَانِعَ ذِي قُرْبَى وَذِي نَسَبٍ"
second: "يَوْمًا وَلَا مُعْدِمًا مِنْ خَابِطٍ وَرَقَا"
vocabulary:
  - term: "مُعْدِمًا مِنْ خَابِطٍ وَرَقَا"
    text: "لا يمنع طالب المعروف معروفه. والخابط عند الأعلم «طالب المعروف»، والورق «المعروف»، وأصله أن الرجل يضرب الشجر ليسقط ورقه فيعلفه ماشيته، و«المعدم»: المانع [@diwan-zuhayr، ص76–77]."
