first: "لَوْ نَالَ حَيٌّ مِنَ الدُّنْيَا بِمَنْزِلَةٍ"
second: "أُفْقَ السَّمَاءِ لَنَالَتْ كَفُّهُ الْأُفُقَا"
meaning: "لو بلغ أحد من الأحياء بمنزلته في الدنيا أفق السماء، لبلغت كفّ هَرِم ذلك الأفق: لو كانت المكانة ترفع صاحبها إلى السماء لكان هو أول من يبلغها."
vocabulary:
  - term: "بِمَنْزِلَةٍ"
    text: "بمكانة ورتبة. وفي الشرح المنسوب إلى ثَعْلَب: «بمَكْرُمةٍ» (انظر الروايات)."
  - term: "أُفْقَ"
    text: "في اللسان: «الأُفْق والأُفُق مِثْلُ عُسْر وعسُر: مَا ظَهَرَ مِنْ نَوَاحِي الفَلَك وأَطراف الأَرض» [@lisan، ج10 ص5]."
context: "آخر القصيدة عند الأَعْلَم، وليس من رواية الأَصْمَعِيّ: قال بعد البيت 32: «وهذا البيت عن غير الأصمعيّ، ويتلوه بيت آخر، عن غيره أيضًا، وهو قوله» [@diwan-zuhayr، ص77]، ثم أورد هذا البيت ولم يشرحه. وفي الشرح المنسوب إلى ثَعْلَب يأتي البيتان بعد قوله «آخرها» تحت «ومن غير هذه الرواية»، لكنه يقول تحت هذا البيت: «رواه الأصمعي»، فيعلّق المحقق: «كذا في الأصل. والأصمعي لم يرو هذا البيت أيضًا. انظر شرح الأعلم ص77» [@sharh-thalab-zuhayr، ص51]. وبه يمثّل شَوْقِي ضَيْف لطريقة زهير في المدح."
syntax:
  - "«لَوْ نَالَ حَيٌّ»: «لو» حرف امتناع لامتناع، و«نال» فعل الشرط، و«حيّ» فاعله. و«مِنَ الدُّنْيَا» متعلق بمحذوف صفة لـ«منزلة» تقدمت عليها فصارت حالًا، و«بِمَنْزِلَةٍ» متعلق بـ«نال»، والباء للسببية."
  - "«أُفْقَ السَّمَاءِ» مفعول به لـ«نال». و«لَنَالَتْ كَفُّهُ الْأُفُقَا» جواب «لو»، واللام واقعة في جوابها، و«كفه» فاعل، و«الأفقا» مفعول به، والألف للإطلاق."
morphology:
  - "«أُفْق» و«أُفُق» لغتان [@lisan، ج10 ص5]، وقد جمعهما البيت: سكّن الفاء في الصدر وحرّكها في القافية."
  - "«حَيّ» صفة على «فَعْل» من «حيي»، أصلها «حَيْيٌ» أُدغمت الياء في الياء."
  - "«مَنْزِلَة» على «مَفْعِلَة» من «نزل»، اسم للمكان ثم للرتبة."
rhetoric:
  thesis: "مبالغة محتاطة: يرفع الممدوح إلى السماء، لكنه يعلّق ذلك على شرط ممتنع."
  devices:
    - title: "«لو» تحفظ المبالغة"
      text: "«لَوْ نَالَ حَيٌّ ... لَنَالَتْ كَفُّهُ»: لم يقل إن هرمًا بلغ السماء، بل قال إنه يبلغها لو بلغها أحد. يرى شوقي ضيف أن زهيرًا «كان إذا أحس إزاء صفة من الصفات أو معنى من المعانى بأنه يكاد يخرج عن حدّه أحاطه بما يجعل قوله مقبولا»، فيقدّم «لو» ونحوها «حتى لا يتجاوز القصد» [@deif، ج1 ص313]، ويقول بعد إنشاد هذا البيت: «فهو لا يطلق القول فى مثل هذين المعنيين إطلاقا» [@deif، ج1 ص314]. وهذا يلتقي بقول عمر في زهير: «ولا يمدح الرجل إلا بما فيه» [@ibn-sallam، ج1 ص63]، ويقابل حكم أهل النظر عند ابن سَلّام: «وأشدهم مبالغة في المدح» [@ibn-sallam، ج1 ص64]."
    - title: "الكف في «لَنَالَتْ كَفُّهُ»"
      text: "لم يقل «لناله هو»، بل جعل الكف هي التي تنال، والكف في المدح آلة العطاء، فكأن الذي يرفعه إلى السماء يده المعطية."
    - title: "رد العجز على الصدر"
      text: "«أُفْقَ السَّمَاءِ ... الْأُفُقَا»: ذكر الأفق في أول العجز ثم ختم به البيت. ورد العجز على الصدر أن يُعاد في آخر البيت لفظ ورد قبله، فيستقر المعنى في القافية على الكلمة التي هي غايته."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "لَوْنَالَحَيْ / يُنْمِنَدْ / دُنْيَابِمَنْ / زِلَتِنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — أُفْقَسْسَمَا / ءِلَنَا / لَتْكَفْفُهُلْ / أُفُقَا = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "سُكّنت الفاء في «أُفْق» في الصدر، ولو حُرّكت لانكسر الوزن، وجاءت محرّكة في القافية. ودخل الخبن «فاعلن» الأولى في العجز [@atiq، ص46]."
