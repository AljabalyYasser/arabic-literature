first: "وَأَخْلَفَتْكَ ابْنَةُ الْبَكْرِيِّ مَا وَعَدَتْ"
second: "فَأَصْبَحَ الْحَبْلُ مِنْهَا وَاهِنًا خَلَقَا"
vocabulary:
  - term: "وَاهِنًا خَلَقَا"
    text: "ضعيفًا باليًا. يقول الأَعْلَم إنها لما أخلفته وعدها علم «أنّ حبل وصلها قد وهن وأخلق. والواهن: الضعيف» [@diwan-zuhayr، ص64]."
