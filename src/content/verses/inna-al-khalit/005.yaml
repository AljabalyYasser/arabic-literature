explained: false
first: "بِجِيدِ مُغْزِلَةٍ أَدْمَاءَ خَاذِلَةٍ"
second: "مِنَ الظِّبَاءِ تُرَاعِي شَادِنًا خَرِقَا"
vocabulary:
  - term: "مُغْزِلَةٍ"
    text: "ظبية معها غزالها، و«خصّ المغزلة لأنّ عنقها أشدّ انتصابًا وامتدادًا، لحذرها على غزالها» [@diwan-zuhayr، ص64]."
  - term: "أَدْمَاءَ"
    text: "البيضاء [@diwan-zuhayr، ص64]."
  - term: "خَاذِلَةٍ"
    text: "«التي خذلت القطيع، وأقامت على ولدها» [@diwan-zuhayr، ص64]."
  - term: "شَادِنًا خَرِقَا"
    text: "الشادن: الصغير الذي اشتد وقوي على المشي، والخرق: اللاصق بالأرض الذي لا يدري أين يأخذ من صغره [@diwan-zuhayr، ص64]."
sources:
