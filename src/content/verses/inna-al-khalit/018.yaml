first: "الْقَائِدَ الْخَيْلَ مَنْكُوبًا دَوَابِرُهَا"
second: "قَدْ أُحْكِمَتْ حَكَمَاتِ الْقِدِّ وَالْأَبَقَا"
vocabulary:
  - term: "مَنْكُوبًا دَوَابِرُهَا"
    text: "يقود الخيل في الغزو ويبعد بها حتى تُنكب دوابرها، «أي: تأكلها الأرض، وتؤثّر فيها. و«الدوابر»: أواخر الحوافر» [@diwan-zuhayr، ص73]."
  - term: "حَكَمَاتِ الْقِدِّ وَالْأَبَقَا"
    text: "الحَكَمة ما يكون على الأنف من الرسن، والقِدّ ما قُطع من الجلد، والأبق شبه الكتان، ويقال هو القِنَّب. أراد: حكمات القد وحكمات الأبق [@diwan-zuhayr، ص73]."
sources:
