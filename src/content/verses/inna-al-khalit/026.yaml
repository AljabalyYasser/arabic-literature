explained: false
first: "فَضْلَ الْجِيَادِ عَلَى الْخَيْلِ الْبِطَاءِ فَلَا"
second: "يُعْطِي بِذَلِكَ مَمْنُونًا وَلَا نَزِقَا"
vocabulary:
  - term: "فَضْلَ الْجِيَادِ"
    text: "«أي: فضل الناس فضل الجياد على البطاء من الخيل» [@diwan-zuhayr، ص75]."
  - term: "مَمْنُونًا"
    text: "مقطوعًا، ويكون أيضًا من المنّ: يمنّ بما يعطي فيكدّره [@diwan-zuhayr، ص75–76]."
  - term: "نَزِقَا"
    text: "الذي يُبطئ بعد الجري، أو يعطي ما عنده ثم يكفّ [@diwan-zuhayr، ص75]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص75–76"
    url: "https://archive.org/details/3917pdf/page/n75/mode/1up"
status: "review"
