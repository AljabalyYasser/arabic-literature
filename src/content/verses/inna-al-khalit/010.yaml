explained: false
first: "كَأَنَّ عَيْنَيَّ فِي غَرْبَيْ مُقَتَّلَةٍ"
second: "مِنَ النَّوَاضِحِ تَسْقِي جَنَّةً سُحُقَا"
vocabulary:
  - term: "غَرْبَيْ"
    text: "مثنى غَرْب، وهو «الدلو العظيمة» [@diwan-zuhayr، ص67]. شبّه عينيه بدلوين يفيض منهما الماء."
  - term: "مُقَتَّلَةٍ"
    text: "ناقة «ذُلّلت بكثرة العمل» [@diwan-zuhayr، ص66]."
  - term: "النَّوَاضِحِ"
    text: "جمع ناضح وناضحة، «وهو البعير يُستقى عليه» [@diwan-zuhayr، ص66]."
  - term: "جَنَّةً سُحُقَا"
    text: "الجنة: البستان، وأراد بها النخل، والسُّحُق جمع سَحوق، وهي النخلة الطويلة التي ذهب جريدها صُعُدًا [@diwan-zuhayr، ص66–67]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص66–67"
    url: "https://archive.org/details/3917pdf/page/n66/mode/1up"
status: "review"
