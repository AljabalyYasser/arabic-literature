first: "إِنَّ الْخَلِيطَ أَجَدَّ الْبَيْنَ فَانْفَرَقَا"
second: "وَعُلِّقَ الْقَلْبُ مِنْ أَسْمَاءَ مَا عَلِقَا"
meaning: "إن الذين كانوا يجاوروننا في الدار جدّوا في الرحيل فتفرّقوا، وتعلّق قلبي من حب أَسْماء بما تعلّق به ولا فكاك له منه. والخليط هنا قوم أسماء الراحلون."
vocabulary:
  - term: "الْخَلِيطَ"
    text: "عند الأَعْلَم: «المخالط لهم في الدار. ويكون واحدًا وجمعًا» [@diwan-zuhayr، ص63]. وفي الشرح المنسوب إلى ثَعْلَب: «وهم الذين يخالطونك» [@sharh-thalab-zuhayr، ص38]."
  - term: "أَجَدَّ الْبَيْنَ"
    text: "«أي: اجتهد في البين وحقّقه. وأصله من الجِدّ. والبين: الفراق» [@diwan-zuhayr، ص63]."
  - term: "فَانْفَرَقَا"
    text: "«انقطع وتفرّق» [@diwan-zuhayr، ص63]."
  - term: "عُلِّقَ"
    text: "أصابته العَلاقة، وهي الحب اللازم. وفي الشرح المنسوب إلى ثعلب: «ويقال: بفلانٍ عَلاقةٌ من فلانة، وعَلَقٌ من فلانة» [@sharh-thalab-zuhayr، ص38]."
context: "مطلع القصيدة، وهي في مدح هَرِم بن سِنان كما في رأسها عند الأعلم [@diwan-zuhayr، ص63] وفي الشرح المنسوب إلى ثعلب [@sharh-thalab-zuhayr، ص38]. يبدأ بالفراق على سنة القصيدة الجاهلية، ويسمي صاحبته أسماء، ثم يسميها في البيت الثالث «ابنة البكري». والنسيب كله ستة عشر بيتًا قبل أن ينتقل إلى المدح في البيت 17."
syntax:
  - "«إِنَّ الْخَلِيطَ أَجَدَّ الْبَيْنَ»: «الخليط» اسم «إنّ»، وجملة «أجدّ البين» خبرها، و«البين» مفعول به. و«فَانْفَرَقَا» معطوف بالفاء على «أجدّ»، والألف للإطلاق."
  - "«وَعُلِّقَ الْقَلْبُ»: فعل مبني للمجهول، و«القلب» نائب الفاعل، و«مِنْ أَسْمَاءَ» متعلق به، و«أسماء» ممنوعة من الصرف فجُرّت بالفتحة."
  - "«مَا عَلِقَا»: «ما» اسم موصول في موضع نصب، وهو المفعول الثاني لـ«عُلِّق»، وجملة «علقا» صلته. والتقدير عند الأعلم: «عُلِّق قلبُه من حبّ أسماء ما علقه» [@diwan-zuhayr، ص63]."
morphology:
  - "«أَجَدَّ» على «أَفْعَلَ» من الجِدّ، وجدّ وأجدّ بمعنى: «قد جدّ فلانٌ في أمره وأجدّ، إذا أخذ فيه، فهو جادٌّ ومُجِدٌّ» [@sharh-thalab-zuhayr، ص38]."
  - "«انْفَرَقَ» على «انْفَعَلَ» من «فرق»، وهو بناء المطاوعة: فرّقه البين فانفرق."
  - "«عُلِّقَ» على «فُعِّلَ» مبنيًّا للمجهول، و«عَلِقَ» في القافية على «فَعِلَ» من المادة نفسها."
rhetoric:
  thesis: "قلب يبقى حيث رحل الخليط: في الصدر حركة الراحلين، وفي العجز ثبات القلب عند من رحلت."
  devices:
    - title: "الإبهام للمبالغة"
      text: "«مَا عَلِقَا»: لم يقل كم علق قلبه ولا بماذا، بل أبهمه بـ«ما». قال الأعلم: «وفي قوله «ما علق» مبالغة، لما في لفظه من الإبهام»، وجعله نظير قوله تعالى ﴿فَغَشِيَهُمْ مِنَ الْيَمِّ مَا غَشِيَهُمْ﴾ [@diwan-zuhayr، ص63]. فالمبهم يترك للسامع أن يقدّر أعظم ما يقدر."
    - title: "الجناس في «وَعُلِّقَ ... مَا عَلِقَا»"
      text: "كرر المادة في أول العجز وآخره بصيغتين. والجناس: أن يتفق اللفظان أو يتقاربا ويختلف المعنى أو الصيغة. فالأولى فعل وقع على القلب، والثانية ما وقع فيه القلب، فيُحاط العجز بالتعلق من طرفيه."
    - title: "التصريع"
      text: "«فَانْفَرَقَا» و«عَلِقَا»: اتفق آخر الشطرين في الوزن والرويّ، وهو التصريع، ويكون في المطالع غالبًا."
  connection: "ثم يعطي هذا التعلق صورته: فارقته برهن لا فكاك له."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "إِنْنَلْخَلِي / طَأَجَدْ / دَلْبَيْنَفَنْ / فَرَقَا = مستفعلن / فعِلن / مستفعلن / فعِلن — وَعُلْلِقَلْ / قَلْبُمِنْ / أَسْمَاءَمَا / عَلِقَا = متفعلن / فاعلن / مستفعلن / فعِلن"
  note: "وزن البسيط «مستفعلن فاعلن مستفعلن فاعلن» في كل شطر، و«العروض مخبونة، أي حذف ثانيها الساكن، والضرب: إما مخبون مثلها، وإما مقطوع» [@atiq، ص48]، وهو هنا مخبون «فعِلن». ودخل الخبنُ «فاعلن» الأولى في الصدر و«مستفعلن» الأولى في العجز، والخبن: «حذف الثاني الساكن» [@atiq، ص46]."
