first: "يَطْلُبُ شَأْوَ امْرَأَيْنِ قَدَّمَا حَسَنًا"
second: "نَالَا الْمُلُوكَ وَبَذَّا هَذِهِ السُّوَقَا"
meaning: "يسعى هَرِم أن يبلغ غاية رجلين سبقاه، هما أبوه وجده، قدّما من الفعل الحسن ما بلغا به منزلة الملوك، وفاقا به سائر الناس."
vocabulary:
  - term: "شَأْوَ"
    text: "عند الأَعْلَم: «الطَّلَق من الجري. والشأو أيضًا: الغاية» [@diwan-zuhayr، ص74]."
  - term: "امْرَأَيْنِ"
    text: "مثنى امرئ. وأراد بهما الأعلم «أباه وجدّه» [@diwan-zuhayr، ص74]."
  - term: "بَذَّا"
    text: "غلبا وفاقا: «ويقال: «بذّه» إذا غلبه وفاقه» [@diwan-zuhayr، ص74]."
  - term: "السُّوَقَا"
    text: "جمع سُوقة. وفي اللسان: «السُّوقةُ مِنَ النَّاسِ: الرَّعِيَّةُ ومَنْ دُونَ الملِك»، وجمعها «السُّوَق، وَقِيلَ أَوساطهم»، واستشهد بهذا البيت [@lisan، ج10 ص170]."
context: "أول أبيات المدح بالآباء: يجعل كرم هرم ميراثًا يطلب أن يلحق به. يقول الأعلم: «أي: يعارضهما بفعله، ويسعى سعيهما في المكارم» [@diwan-zuhayr، ص74]. والبيت من الأبيات 19–24 التي يرى المحقق أن الأَصْمَعِيّ لم يروها (انظر النص)، وفي الشرح المنسوب إلى ثَعْلَب يُقدَّم بقوله «وروى أيضًا» [@sharh-thalab-zuhayr، ص48]."
syntax:
  - "«يَطْلُبُ» فعل مضارع فاعله ضمير هرم، والجملة استئناف في وصفه. و«شَأْوَ امْرَأَيْنِ» مفعول به ومضاف إليه."
  - "جملة «قَدَّمَا حَسَنًا» صفة لـ«امرأين»، و«حسنًا» مفعول به، وهو صفة لموصوف محذوف: فعلًا حسنًا."
  - "جملة «نَالَا الْمُلُوكَ» صفة ثانية لـ«امرأين»، و«وَبَذَّا هَذِهِ السُّوَقَا» معطوفة عليها، و«هذه» مفعول به، و«السوقا» بدل منه."
morphology:
  - "«امْرَأَيْنِ» مثنى «امرئ»، وهمزته همزة وصل تسقط في الدرج: «شَأْوَمْرَأَيْنِ»."
  - "«السُّوَق» جمع «سُوقة» على «فُعَل» [@lisan، ج10 ص170]. و«الْمُلُوك» جمع «مَلِك» على «فُعُول»."
  - "«بَذَّ» فعل ماض مضعف على «فَعَلَ»، وأصله «بَذَذَ»."
rhetoric:
  thesis: "المجد الموروث حلبة سباق: الأب والجد في المقدمة، والابن يطلبهما."
  devices:
    - title: "الاستعارة في «شَأْوَ»"
      text: "«يَطْلُبُ شَأْوَ امْرَأَيْنِ»: الشأو عدو الفرس وغايته، فأجرى لفظ السباق على طلب المكارم ولم يصرح بالتشبيه. وهذه الاستعارة عند عبد القاهر: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. وهي تمهد للبيت التالي الذي يصرّح بالفرس: «هو الجواد»."
    - title: "المدح بالآباء"
      text: "«امْرَأَيْنِ»: لم يسمّهما، والأعلم يفسرهما بالأب والجد [@diwan-zuhayr، ص74]. فمدح الابن يمرّ بمدح من قبله، ويصير سعيه وفاءً لميراث."
    - title: "المقابلة بين «الْمُلُوكَ» و«السُّوَقَا»"
      text: "جمع طرفي الناس: نالا الملوك فساوياهم، وبذّا السوقة فعلوهم. وهو ما يشرحه الأعلم: «سبق أبواه أوساط الناس، وساويا الملوك، فهو يطلب سبقهما، وذلك شديد» [@diwan-zuhayr، ص74]."
  connection: "ثم يحكم على هذا السباق: هو الجواد، فإن لحقهما فمثله يلحق."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "يَطْلُبُشَأْ / وَمْرَأَيْ / نِقَدْدَمَا / حَسَنَنْ = مستعلن / فاعلن / متفعلن / فعِلن — نَالَلْمُلُو / كَوَبَذْ / ذَاهَاذِهِسْ / سُوَقَا = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الطيّ، وهو «حذف الرابع الساكن» [@atiq، ص47]، «مستفعلن» الأولى في الصدر فصارت «مستعلن»، والخبنُ الثانية فصارت «متفعلن» [@atiq، ص46]."
variants:
  - reading: "يَطْلُبُ شَأْوَ امْرَأَيْنِ قَدَّمَا حَسَبًا"
    status: "في نسخة من الشرح المنسوب إلى ثعلب"
    note: "يقول المحقق إن الكلمة في النسخة «س» بالباء والنون وفوقها «معًا» [@sharh-thalab-zuhayr، ص48]."
  - reading: "يَطْلُبُ شَأْوَ امْرَأَيْنِ نَالَ سَعْيُهُمَا ... سَعْيَ الْمُلُوكِ"
    status: "رواية في الشرح المنسوب إلى ثعلب"
    note: "يذكرها بـ«ويروى»، ولا يتم البيت في المطبوع [@sharh-thalab-zuhayr، ص48–49]."
