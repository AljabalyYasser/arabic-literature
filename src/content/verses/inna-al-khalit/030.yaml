explained: false
first: "لَيْثٌ بِعَثَّرَ يَصْطَادُ الرِّجَالَ إِذَا"
second: "مَا كَذَّبَ اللَّيْثُ عَنْ أَقْرَانِهِ صَدَقَا"
vocabulary:
  - term: "عَثَّرَ"
    text: "اسم موضع [@diwan-zuhayr، ص77]."
  - term: "كَذَّبَ"
    text: "«أي: لم يصدق الحملة. ويقال: كذّب الرجل عن كذا، إذا رجع عنه» [@diwan-zuhayr، ص77]."
  - term: "أَقْرَانِهِ"
    text: "جمع قِرْن، وهو «الصاحب في القتال» [@diwan-zuhayr، ص77]."
sources:
