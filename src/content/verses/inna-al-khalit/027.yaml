first: "قَدْ جَعَلَ الْمُبْتَغُونَ الْخَيْرَ فِي هَرِمٍ"
second: "وَالسَّائِلُونَ إِلَى أَبْوَابِهِ طُرُقَا"
meaning: "كثر قصد طالبي المعروف والسائلين إلى هرم وتردّدهم على بابه، حتى صارت لهم إلى أبوابه طرق مسلوكة."
vocabulary:
  - term: "الْمُبْتَغُونَ"
    text: "«الطالبون» [@diwan-zuhayr، ص76]."
  - term: "فِي هَرِمٍ"
    text: "«أي: عند هرم، أو من هرم» [@diwan-zuhayr، ص76]."
  - term: "طُرُقَا"
    text: "جمع طريق. يقول الأَعْلَم: «قد جعل طلّاب المعروف عند هرم طرقًا إلى أبوابه، لكثرة تردّدهم عليه، وقصودهم إليه» [@diwan-zuhayr، ص76]."
context: "أشهر أبيات القصيدة. قال الأَصْمَعِيّ فيما ينقل الأعلم: «هذا بيت القصيد» [@diwan-zuhayr، ص76]، وفي الشرح المنسوب إلى ثَعْلَب: «هذا بيت القصيدة» [@sharh-thalab-zuhayr، ص46]، أي البيت الذي تقوم عليه القصيدة وتُعرف به. ويروي ابن سَلّام أن قُدامة بن موسى، وكان «من علماء أهل المدينة»، كان يقدّم زهيرًا، فلما سئل أيّ شعره أعجب إليه أنشد هذا البيت والذي بعده [@ibn-sallam، ج1 ص63–64]. ويروي أن سَعِيد بن العاص سأل الحُطَيْئة: «فمن أشعر العرب؟»، فقال: «الذي يقول» وأنشد هذا البيت [@ibn-sallam، ج1 ص121]."
syntax:
  - "«قَدْ جَعَلَ الْمُبْتَغُونَ»: «جعل» بمعنى صنع واتخذ، و«المبتغون» فاعله، و«الْخَيْرَ» مفعول به لـ«المبتغون» لأنه اسم فاعل عامل: الذين يبتغون الخير."
  - "«فِي هَرِمٍ» متعلق بـ«جعل»، و«في» بمعنى «عند» كما يفسرها الأعلم. و«وَالسَّائِلُونَ» معطوف على «المبتغون»."
  - "«طُرُقَا» مفعول به لـ«جعل»، و«إِلَى أَبْوَابِهِ» متعلق بمحذوف صفة له قُدّمت عليه فصارت حالًا: طرقًا إلى أبوابه."
morphology:
  - "«الْمُبْتَغُونَ» جمع «مُبْتَغٍ»، اسم فاعل من «ابتغى» على «افتعل» من «بغى»: طلب. وأصله «مُبْتَغِيُون»، حُذفت الياء لالتقاء الساكنين بعد تسكينها."
  - "«السَّائِلُونَ» جمع «سائل» على «فاعِل»، قُلبت عينه همزة."
  - "«طُرُق» جمع «طريق» على «فُعُل»، و«أَبْوَاب» جمع «باب» على «أَفْعال»."
rhetoric:
  thesis: "الكرم يُرى أثره على الأرض: طرق تشقها أقدام القاصدين إلى باب واحد."
  devices:
    - title: "الكناية عن الكرم"
      text: "«جَعَلَ الْمُبْتَغُونَ ... إِلَى أَبْوَابِهِ طُرُقَا»: لم يقل إنه كريم، بل ذكر ما يلزم الكرم: كثرة القاصدين حتى تصير لهم طرق. وهذه الكناية التي يصفها عبد القاهر بأن المتكلم «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود»، فيومئ به إليه [@dalail، ص66]."
    - title: "الجمع في «أَبْوَابِهِ» و«طُرُقَا»"
      text: "جمع الأبواب والطرق: لبيته أبواب كثيرة، ولكل باب طريق. فالجمع يكثّر القاصدين ويوسّع البيت معًا، فلا يزدحم الناس على باب واحد."
    - title: "بيت القصيد"
      text: "قول الأصمعي «هذا بيت القصيد» [@diwan-zuhayr، ص76] حكم على البيت بأنه قلب القصيدة. وفيه ما وصف به أهل النظر شعر زهير عند ابن سلّام: «وأجمعهم لكثير من المعنى فى قليل من المنطق» [@ibn-sallam، ج1 ص64]: الكرم كله في صورة واحدة."
  connection: "ثم يقول إن هذا الكرم لا يتغير بتغير حاله: إن تلقه على علاته."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "قَدْجَعَلَلْ / مُبْتَغُو / نَلْخَيْرَفِي / هَرِمِنْ = مستعلن / فاعلن / مستفعلن / فعِلن — وَسْسَائِلُو / نَإِلَى / أَبْوَابِهِي / طُرُقَا = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "دخل الطيّ «مستفعلن» الأولى في الصدر فصارت «مستعلن» [@atiq، ص47]، ودخل الخبن «فاعلن» الأولى في العجز [@atiq، ص46]. وأُشبعت كسرة الهاء في «أَبْوَابِهِ»."
