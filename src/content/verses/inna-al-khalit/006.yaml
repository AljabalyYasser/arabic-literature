explained: false
first: "كَأَنَّ رِيقَتَهَا بَعْدَ الْكَرَى اغْتُبِقَتْ"
second: "مِنْ طَيِّبِ الرَّاحِ لَمَّا يَعْدُ أَنْ عَتُقَا"
vocabulary:
  - term: "الْكَرَى"
    text: "النوم. يقول الأعلم: «ماء فمها طيّب بعد الكرى، على أنّ الأفواه تتغيّر في ذلك الوقت» [@diwan-zuhayr، ص65]."
  - term: "اغْتُبِقَتْ"
    text: "سُقيت الغَبوق، وهو شرب العشيّ، واستعاره الشاعر هنا لليل [@diwan-zuhayr، ص65]."
  - term: "لَمَّا يَعْدُ أَنْ عَتُقَا"
    text: "لم يتجاوز الشراب أن صار عتيقًا إلى أن يفسد ويتغير [@diwan-zuhayr، ص65]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص64–65"
    url: "https://archive.org/details/3917pdf/page/n64/mode/1up"
