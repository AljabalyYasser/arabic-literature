explained: false
first: "أَغَرُّ أَبْيَضُ فَيَّاضٌ يُفَكِّكُ عَنْ"
second: "أَيْدِي الْعُنَاةِ وَعَنْ أَعْنَاقِهَا الرِّبَقَا"
vocabulary:
  - term: "أَغَرُّ أَبْيَضُ"
    text: "بيّن الكرم مشهوره «كأنّ في وجهه غرّة»، ويكون أيضًا: نقي من العيوب [@diwan-zuhayr، ص75]."
  - term: "فَيَّاضٌ"
    text: "«الكثير العطاء، بمنزلة النهر الكثير الفيض» [@diwan-zuhayr، ص75]."
  - term: "الْعُنَاةِ"
    text: "جمع عانٍ، «وهو الأسير» [@diwan-zuhayr، ص75]."
  - term: "الرِّبَقَا"
    text: "جمع رِبْقة، وهو حبل فيه حلق تُجعل فيها رؤوس صغار الغنم لئلا ترضع أمهاتها، «فاستعارها هنا للأغلال» [@diwan-zuhayr، ص75]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص74–75"
    url: "https://archive.org/details/3917pdf/page/n74/mode/1up"
status: "review"
