first: "بَلِ اذْكُرَنْ خَيْرَ قَيْسٍ كُلِّهَا حَسَبًا"
second: "وَخَيْرَهَا نَائِلًا وَخَيْرَهَا خُلُقَا"
meaning: "دع ما كنت فيه، واذكر خير قيس كلها: أكرمها حسبًا، وأكثرها عطاءً، وأحسنها خُلُقًا، يعني هَرِم بن سِنان."
vocabulary:
  - term: "بَلِ اذْكُرَنْ"
    text: "عند الأعلم: «أضرب بـ«بل» عمّا كان فيه، وأمر نفسه بالأخذ في وصف الممدوح. وهذا من عادتهم» [@diwan-zuhayr، ص72]."
  - term: "قَيْسٍ"
    text: "قيس عَيْلان، وهي عند الأعلم «قبيلة» [@diwan-zuhayr، ص189]. ويقول محقق الشرح المنسوب إلى ثعلب إنها «قبيلة من مضر كبيرة جدًّا. ومنها قبيلة الممدوح» [@sharh-thalab-zuhayr، ص169]."
  - term: "نَائِلًا"
    text: "عطاءً، من نال ينول."
context: "مفصل القصيدة: به ينتقل من النسيب ووصف الظعائن والسانية (1–16) إلى مدح هرم. وتقديم المدح بـ«بل» يراه الأعلم «من عادتهم» [@diwan-zuhayr، ص72]. وفي الشرح المنسوب إلى ثَعْلَب يأتي بعد هذا البيت مباشرة «وذاك أحزمهم رأيًا» (25 هنا)، ثم «فضل الجياد» (26)، ثم «قد جعل المبتغون» (27) [@sharh-thalab-zuhayr، ص46]."
syntax:
  - "«بَلِ»: حرف إضراب، أضرب به عما قبله. وكُسرت لامه لالتقاء الساكنين، لأن همزة «اذكرن» همزة وصل تسقط في الدرج."
  - "«اذْكُرَنْ»: فعل أمر مبني على الفتح لاتصاله بنون التوكيد الخفيفة، والفاعل ضمير المخاطب، يخاطب نفسه. و«خَيْرَ قَيْسٍ» مفعول به ومضاف إليه، و«كُلِّهَا» توكيد لـ«قيس»، وأنّث الضمير لأنه أراد القبيلة."
  - "«حَسَبًا» و«نَائِلًا» و«خُلُقًا» تمييز يبيّن الجهة التي هو فيها خير، و«وَخَيْرَهَا» في الموضعين معطوف على «خيرَ قيس»."
morphology:
  - "«اذْكُرَنْ» أمر من «ذكر» مؤكد بالنون الخفيفة: «اذكُرْ» ثم «اذكُرَنْ»."
  - "«خَيْر» اسم تفضيل حُذفت همزته، وأصله «أخير»، ولذلك يضاف إلى ما هو بعضه: «خير قيس»."
  - "«نَائِل» على «فاعِل» من «نال ينول»، قُلبت عينه همزة، ويُستعمل اسمًا للعطاء."
rhetoric:
  thesis: "انتقال معلن من الغزل إلى المدح، ثم مدح بالتفضيل المطلق في ثلاث جهات."
  devices:
    - title: "الإضراب بـ«بل»"
      text: "«بَلِ اذْكُرَنْ»: قطع الكلام قبله ولم يمهّد للمدح بصلة، كأنه يرد نفسه عن الإطالة في النسيب. وهذا انتقال مكشوف يعلنه الشاعر، بخلاف التخلص الذي يُخفي الانتقال فيصل الغرض بالغرض. والأعلم يراه طريقة معروفة: «وهذا من عادتهم» [@diwan-zuhayr، ص72]."
    - title: "التكرار والتقسيم"
      text: "«خَيْرَ قَيْسٍ ... وَخَيْرَهَا ... وَخَيْرَهَا»: كرر «خير» ثلاث مرات، وجعل لكل مرة تمييزًا: الحسب، والنائل، والخلق. فالبيت ثلاثة أحكام متوازية، يحسم كل منها جهة من جهات الفضل: ما ورثه، وما يعطيه، وما هو عليه."
    - title: "التوكيد"
      text: "«اذْكُرَنْ» بنون التوكيد، و«كُلِّهَا» توكيد لـ«قيس»: أكّد الأمر وأكّد العموم، فلا يبقى في قيس من يفضل هرمًا."
  connection: "ثم يأخذ في وصفه: يقود الخيل في الغزو حتى تُنكب حوافرها."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "بَلِذْكُرَنْ / خَيْرَقَيْ / سِنْكُلْلِهَا / حَسَبَنْ = متفعلن / فاعلن / مستفعلن / فعِلن — وَخَيْرَهَا / نَائِلَنْ / وَخَيْرَهَا / خُلُقَا = متفعلن / فاعلن / متفعلن / فعِلن"
  note: "دخل الخبن «مستفعلن» الأولى في الشطرين والثانية في العجز فصارت «متفعلن» [@atiq، ص46]. وتسقط همزة الوصل في «اذكرن»."
