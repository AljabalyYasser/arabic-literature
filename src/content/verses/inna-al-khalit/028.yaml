first: "إِنْ تَلْقَ يَوْمًا عَلَى عِلَّاتِهِ هَرِمًا"
second: "تَلْقَ السَّمَاحَةَ مِنْهُ وَالنَّدَى خُلُقَا"
meaning: "إن لقيت هرمًا في أي حال كان، حتى في قلة ماله، وجدت الجود والكرم طبعًا فيه لا تكلفًا."
vocabulary:
  - term: "عَلَى عِلَّاتِهِ"
    text: "على كل حال. وفي اللسان: «وقولُهم: عَلَى عِلَّاتِه أَي عَلَى كُلِّ حَالٍ» [@lisan، ج11 ص471]. ويخصها الأَعْلَم بحال العسر: «إن تلقه، على قلّة مال أو عُدْم، تجده سمحًا كريمًا» [@diwan-zuhayr، ص76]."
  - term: "السَّمَاحَةَ"
    text: "الجود والبذل عن طيب نفس."
  - term: "النَّدَى"
    text: "الكرم والعطاء."
  - term: "خُلُقَا"
    text: "طبعًا وسجية."
context: "يُروى مع البيت السابق في كل موضع: أنشده قُدامة بن موسى معه [@ibn-sallam، ج1 ص64]، وكذلك ابن قُتَيْبة [@ibn-qutayba، ج1 ص138]. وفيه يسمي هرمًا بعد أن ذكره في البيت السابق. والمعنى نفسه في قصيدة أخرى لزهير يستشهد بها ابن مَنْظُور: «الجَوَادَ، عَلَى عِلَّاتِهِ، هَرِم» [@lisan، ج11 ص471]."
syntax:
  - "«إِنْ تَلْقَ»: «إن» شرطية جزمت «تلقَ» بحذف حرف العلة، و«يَوْمًا» ظرف زمان، و«عَلَى عِلَّاتِهِ» حال من «هرمًا» تقدمت عليه، و«هَرِمًا» مفعول به."
  - "«تَلْقَ السَّمَاحَةَ»: جواب الشرط مجزوم بحذف الألف، و«السماحة» مفعول به، و«منه» متعلق بـ«تلق»، و«وَالنَّدَى» معطوف على «السماحة»، و«خُلُقَا» حال منهما: تجدهما طبعًا فيه."
morphology:
  - "«تَلْقَ» مضارع «لَقِيَ» على «فَعِلَ يَفْعَلُ»، حُذفت ألفه للجزم."
  - "«عِلَّات» جمع «عِلّة» جمع مؤنث سالمًا."
  - "«السَّمَاحَة» مصدر على «فَعَالة» من «سَمُحَ»، و«خُلُق» على «فُعُل»."
rhetoric:
  thesis: "الكرم عند هرم طبع لا ظرف: لا يتغير بقلة المال ولا بكثرته."
  devices:
    - title: "تقديم «عَلَى عِلَّاتِهِ»"
      text: "قدّم الحال الصعبة على صاحبها «هرمًا»، فسبق ذكرُ العسر ذكرَ الرجل، كأن السامع يُسأل: أتلقاه كريمًا حتى في عسره؟ ثم يأتي الجواب. وتقديم ما يُعنى به أصل يقرره عبد القاهر: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "الاستدلال بالأصعب على الأسهل"
      text: "يقول الأعلم بعد أن يفسر البيت: «فكيف به، وهو على غير تلك الحال؟» [@diwan-zuhayr، ص76]. إذا كان سمحًا في العسر فهو في اليسر أسمح، فذكر أصعب الحالين ليدل على الأخرى."
    - title: "«خُلُقَا» في القافية"
      text: "ختم البيت بأن السماحة فيه طبع، وهو مدح بما يثبت في الرجل لا بما يعرض له. وهذا ما وصف به عمر شعر زهير: «ولا يمدح الرجل إلا بما فيه» [@ibn-sallam، ج1 ص63]."
  connection: "ثم يذكر من يعطيهم: ذا القربى والنسب، والغريب الذي يطلب معروفه."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ القاف المفتوحة، تتبعها ألف الإطلاق"
  scansion: "إِنْتَلْقَيَوْ / مَنْعَلَى / عِلْلَاتِهِي / هَرِمَنْ = مستفعلن / فاعلن / مستفعلن / فعِلن — تَلْقَسْسَمَا / حَةَمِنْ / هُووَنْنَدَى / خُلُقَا = مستفعلن / فعِلن / مستفعلن / فعِلن"
  note: "أُشبعت كسرة الهاء في «عِلَّاتِهِ» وضمتها في «مِنْهُ». ودخل الخبن «فاعلن» الأولى في العجز [@atiq، ص46]."
variants:
  - reading: "مَنْ يَلْقَ يَوْمًا عَلَى عِلَّاتِهِ هَرِمًا ... يَلْقَ السَّمَاحَةَ مِنْهُ وَالنَّدَى خُلُقَا"
    status: "رواية الشرح المنسوب إلى ثَعْلَب وابن سلّام"
    note: "وفي الشرح: «وروى الأصمعي: «إن تلق يومًا»» [@sharh-thalab-zuhayr، ص50]، وهي رواية الأعلم. وبـ«من يلق» يرويه ابن سَلّام [@ibn-sallam، ج1 ص64]."
  - reading: "يَلْقَ السَّمَاحَةَ فِيهِ وَالنَّدَى خُلُقَا"
    status: "رواية ابن قتيبة"
    note: "[@ibn-qutayba، ج1 ص138]."
