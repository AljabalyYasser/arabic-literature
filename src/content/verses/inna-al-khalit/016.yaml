explained: false
first: "يَخْرُجْنَ مِنْ شَرَبَاتٍ مَاؤُهَا طَحِلٌ"
second: "عَلَى الْجُذُوعِ يَخَفْنَ الْغَمَّ وَالْغَرَقَا"
vocabulary:
  - term: "شَرَبَاتٍ"
    text: "جمع شَرَبة، وهي «حويض كهيأة المعلف، يُتّخذ عند أصل النخلة، فيملأ ماء» [@diwan-zuhayr، ص72]."
  - term: "طَحِلٌ"
    text: "«أخضر يضرب إلى الغبرة، لكثرة ما يمكث فيه الماء» [@diwan-zuhayr، ص72]."
  - term: "يَخَفْنَ الْغَمَّ وَالْغَرَقَا"
    text: "يرى الأَعْلَم أنه توهّم أن الضفادع تخرج خوف الغرق «فغلط»، وينقل أنه أراد أن يخبر بكثرة الماء [@diwan-zuhayr، ص72]."
sources:
