explained: false
first: "فَلَا تَبْعَدَنْ إِنَّ الْمَنِيَّةَ مَوْعِدٌ"
second: "وَكُلُّ امْرِئٍ يَوْمًا بِهِ الْحَالُ زَائِلُ"
vocabulary:
  - term: "فَلَا تَبْعَدَنْ"
    text: "«أي لا تهلكن»، «وإنما دعا له بألّا يبعد وهو قد بعد؛ تحزّنًا منه لفقده، وهو كلام كثر استعمالهم له، حتى جرى مجرى المثل» [@diwan-nabigha، ص120]."
  - term: "بِهِ الْحَالُ زَائِلُ"
    text: "«أراد بالحال ها هنا حال الموت» [@diwan-nabigha، ص120]."
sources:
