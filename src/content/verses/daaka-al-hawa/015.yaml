explained: false
first: "يَسِيرُ بِهَا النُّعْمَانُ تَغْلِي قُدُورُهُ"
second: "تَجِيشُ بِأَسْبَابِ الْمَنَايَا الْمَرَاجِلُ"
vocabulary:
  - term: "تَغْلِي قُدُورُهُ"
    text: "«هذا مثلٌ ضربه لشدّة حربه، وقوته على العدوّ» [@diwan-nabigha، ص118]."
  - term: "تَجِيشُ"
    text: "«يرتفع زبدُها، ويشتدّ غليُها» [@diwan-nabigha، ص118]."
  - term: "الْمَرَاجِلُ"
    text: "«القُدُور من نحاس كانت أو من حجارة، واحدها مِرْجَل» [@diwan-nabigha، ص118]."
sources:
  - source: "diwan-nabigha"
    loc: "ص118"
