explained: false
first: "وَرَبِّ بَنِي الْبَرْشَاءِ ذُهْلٍ وَقَيْسِهَا"
second: "وَشَيْبَانَ حَيْثُ اسْتَبْهَلَتْهَا الْمَنَاهِلُ"
vocabulary:
  - term: "وَرَبِّ"
    text: "واو القسم: يقسم بربّ هذه القبائل، وجواب القسم في البيت التالي «لَقَدْ عَالَنِي»."
  - term: "بَنِي الْبَرْشَاءِ ذُهْلٍ وَقَيْسِهَا وَشَيْبَانَ"
    text: "«شيبان وذُهْل وقيس بنو ثعلبة»، والبرشاء أمّهم، كانت لها ضرّة «فألقت إحداهما على وجه الأخرى نارًا، وقطعت تلك يدَ هذه؛ فصارت إحداهما جذماءَ بقطعها، والأخرى برشاءَ بأثر النار» [@diwan-nabigha، ص117]."
  - term: "اسْتَبْهَلَتْهَا الْمَنَاهِلُ"
    text: "أهملتها المياه وتركتها حرّة، «ومعنى «استبهلتها» أخرجتها وفاضت بها»، «والمناهل: المشارب؛ يريد أن النعمان كان يُغير عليهم، حيثما حلّوا من مواضع المياه» [@diwan-nabigha، ص117]. وفي اللسان: «وأبهل الوالي رعيته واستبهلها إذا أهملها» [@lisan، ج11 ص71]."
