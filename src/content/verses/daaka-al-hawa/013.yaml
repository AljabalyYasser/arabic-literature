explained: false
first: "فَلَا يَهْنِئُ الْأَعْدَاءَ مَصْرَعُ مَلْكِهِمْ"
second: "وَمَا عَتَقَتْ مِنْهُ تَمِيمٌ وَوَائِلُ"
vocabulary:
  - term: "فَلَا يَهْنِئُ الْأَعْدَاءَ"
    text: "دعاء على الأعداء ألّا يفرحوا بموته."
  - term: "مَصْرَعُ مَلْكِهِمْ"
    text: "موت ملكهم، يعني النُّعْمان، وكان يغزوهم."
  - term: "وَمَا عَتَقَتْ مِنْهُ"
    text: "«معطوف على قوله: «مصرع»»، والمعنى: «أي لا يهنئ الأعداءَ موتُ النعمان وعِتقُ تميم ووائل منه»، «وذلك أنه كان يغزوهم، فلما مات نجوا منه وعتقوا» [@diwan-nabigha، ص118]."
  - term: "تَمِيمٌ وَوَائِلُ"
    text: "قبيلتان كان النعمان يغزوهما."
sources:
