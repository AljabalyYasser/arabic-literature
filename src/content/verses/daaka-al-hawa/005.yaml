explained: false
first: "مُوَثَّقَةِ الْأَنْسَاءِ مَضْبُورَةِ الْقَرَا"
second: "نَعُوبٍ إِذَا كَلَّ الْعِتَاقُ الْمَرَاسِلُ"
vocabulary:
  - term: "مُوَثَّقَةِ الْأَنْسَاءِ"
    text: "«الأنساء: جمع نَسا، وهو عِرْق يخرج من أصل العَجُز حتى يصير إلى الخُفّ» [@diwan-nabigha، ص116]، «يريد أن نَساها قصير مُوَتَّر، وذلك مما يُوصَف به الخيلُ والإبل» [@diwan-nabigha، ص116]."
  - term: "مَضْبُورَةِ الْقَرَا"
    text: "«أي شديدة الظَّهر، والمضبورة: المجموعة الخَلْق بعضه إلى بعض» [@diwan-nabigha، ص116]."
  - term: "نَعُوبٍ"
    text: "«التي تنعب في سيرها، أي تمدّ عنقها، وتستعين به عند شدّة السير» [@diwan-nabigha، ص116]."
  - term: "الْعِتَاقُ الْمَرَاسِلُ"
    text: "«والعِتاق: كرام الإبل. والمراسل: اللواتي يَسِرْن سيرًا سهلًا في سرعة» [@diwan-nabigha، ص116]."
sources:
