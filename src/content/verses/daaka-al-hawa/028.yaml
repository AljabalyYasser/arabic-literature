explained: false
first: "وَيُنْبِتُ حَوْذَانًا وَعَوْفًا مُنَوِّرًا"
second: "سَأُتْبِعُهُ مِنْ خَيْرِ مَا قَالَ قَائِلُ"
vocabulary:
  - term: "وَيُنْبِتُ"
    text: "«أي يُنبت هذا المطر الذي دعا للقبر به» [@diwan-nabigha، ص121]."
  - term: "حَوْذَانًا وَعَوْفًا"
    text: "«ضربان من النبت طيّبا الرائحة» [@diwan-nabigha، ص121]."
  - term: "مُنَوِّرًا"
    text: "مُزهرًا."
  - term: "سَأُتْبِعُهُ"
    text: "«أي سأُثني عليه بخير القول، وأذكره بأجمل الذِّكر» [@diwan-nabigha، ص121]."
