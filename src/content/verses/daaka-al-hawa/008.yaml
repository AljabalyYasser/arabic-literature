explained: false
first: "أَضَرَّ بِجَرْدَاءِ النُّسَالَةِ سَمْحَجٍ"
second: "يُقَلِّبُهَا إِذْ أَعْوَزَتْهُ الْحَلَائِلُ"
vocabulary:
  - term: "بِجَرْدَاءِ النُّسَالَةِ"
    text: "«أي أضرّ بأتانٍ قصيرة الشعر. والنُّسالة: ما نسل من شعرها وتساقط» [@diwan-nabigha، ص117]، والأتان أنثى الحمار."
  - term: "سَمْحَجٍ"
    text: "«الطويلة الظهر» [@diwan-nabigha، ص117]."
  - term: "يُقَلِّبُهَا"
    text: "«يُصرّفها كيف يشاء» [@diwan-nabigha، ص117]."
  - term: "أَعْوَزَتْهُ الْحَلَائِلُ"
    text: "«أي أعجزته الأُتُن، ولم يكن له غير هذه الأتان. والحلائل: جمع حَليلة، وهي امرأة الرجل» [@diwan-nabigha، ص117]."
sources:
  - source: "diwan-nabigha"
    loc: "ص117"
