explained: false
first: "بَكَى حَارِثُ الْجَوْلَانِ مِنْ فَقْدِ رَبِّهِ"
second: "وَحَوْرَانُ مِنْهُ مُوحِشٌ مُتَضَائِلُ"
vocabulary:
  - term: "حَارِثُ الْجَوْلَانِ"
    text: "«جبل في الجولان، وهو موضع بالشام» [@diwan-nabigha، ص121]."
  - term: "مِنْ فَقْدِ رَبِّهِ"
    text: "«أي النعمان» [@diwan-nabigha، ص121]، فهو ربّ تلك الأرض وملكها."
  - term: "وَحَوْرَانُ"
    text: "«بالشام أيضًا» [@diwan-nabigha، ص121]."
  - term: "مُوحِشٌ مُتَضَائِلُ"
    text: "خالٍ حزين، و«المتضائل: المتصاغر المتداخل» [@diwan-nabigha، ص122]."
