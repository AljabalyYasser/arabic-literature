explained: false
first: "قُعُودًا لَهُ غَسَّانُ يَرْجُونَ أَوْبَهُ"
second: "وَتُرْكٌ وَرَهْطُ الْأَعْجَمِينَ وَكَابُلُ"
vocabulary:
  - term: "قُعُودًا لَهُ غَسَّانُ"
    text: "«يريد أنهم كانوا مستشرفين إليه، راجين لحياته» [@diwan-nabigha، ص122]، أي جالسين ينتظرونه."
  - term: "أَوْبَهُ"
    text: "رجوعه."
  - term: "غَسَّانُ"
    text: "«قبيلة النعمان بن الحارث، وهو ماء بالشام نزلوه فسُمّوا به» [@diwan-nabigha، ص122]."
  - term: "وَتُرْكٌ وَرَهْطُ الْأَعْجَمِينَ وَكَابُلُ"
    text: "أمم من العجم، «ووصف في البيت أن العرب والعجم كانوا يؤمّلونه، ويرجون خيره» [@diwan-nabigha، ص122]. وكابل بلد في بلاد العجم."
sources:
