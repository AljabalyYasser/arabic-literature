explained: false
first: "يَحُثُّ الْحُدَاةَ جَالِزًا بِرِدَائِهِ"
second: "يَقِي حَاجِبَيْهِ مَا تُثِيرُ الْقَنَابِلُ"
vocabulary:
  - term: "يَحُثُّ الْحُدَاةَ"
    text: "«أي يُعجلهم ويأمرهم بشدّة السَّوْق، والحُداة: الذين يسوقون الإبل» [@diwan-nabigha، ص119]."
  - term: "جَالِزًا بِرِدَائِهِ"
    text: "«أي عاصبًا رأسه بردائه؛ يقال: جلز الرجل رأسه، إذا عصَبه وشدّه» [@diwan-nabigha، ص119]."
  - term: "يَقِي حَاجِبَيْهِ"
    text: "«أراد يقي وجهه» [@diwan-nabigha، ص119]."
  - term: "مَا تُثِيرُ الْقَنَابِلُ"
    text: "الغبار الذي تثيره الخيل، «والقنابل يعني جماعة الخيل، واحدها قنبلة» [@diwan-nabigha، ص119]."
sources:
