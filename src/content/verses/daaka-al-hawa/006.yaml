explained: false
first: "كَأَنِّي شَدَدْتُ الرَّحْلَ حِينَ تَشَذَّرَتْ"
second: "عَلَى قَارِحٍ مِمَّا تَضَمَّنَ عَاقِلُ"
vocabulary:
  - term: "تَشَذَّرَتْ"
    text: "«أي تلوّت وتصعّبت، لحِدّة نفسها ونشاطها» [@diwan-nabigha، ص116]."
  - term: "قَارِحٍ"
    text: "«حمار قد قرح» [@diwan-nabigha، ص116]، يعني حمارًا وحشيًّا، «وخصّ القارح؛ لأنه أصلب من غيره وأشدّ» [@diwan-nabigha، ص116]."
  - term: "مِمَّا تَضَمَّنَ عَاقِلُ"
    text: "من وحش هذا الموضع، و«عاقل: اسم جبل» [@diwan-nabigha، ص116]."
sources:
  - source: "diwan-nabigha"
    loc: "ص116"
