explained: false
first: "أَبَى غَفْلَتِي أَنِّي إِذَا مَا ذَكَرْتُهُ"
second: "تَحَرَّكَ دَاءٌ فِي فُؤَادِيَ دَاخِلُ"
vocabulary:
  - term: "أَبَى غَفْلَتِي"
    text: "«أي أبى أن أغفل عن موت النعمان، وأسلو عنه» [@diwan-nabigha، ص119]."
  - term: "دَاءٌ فِي فُؤَادِيَ دَاخِلُ"
    text: "حزن دخل قلبي، «فاشتدّ ما أجد في قلبي من الداء الداخل فيه» [@diwan-nabigha، ص119]."
