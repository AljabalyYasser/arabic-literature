explained: false
first: "لَقَدْ عَالَنِي مَا سَرَّهَا وَتَقَطَّعَتْ"
second: "لِرَوْعَاتِهَا مِنِّي الْقُوَى وَالْوَسَائِلُ"
vocabulary:
  - term: "عَالَنِي"
    text: "«أي فدحني وشقّ عليّ، وهو بالعين غير معجمة» [@diwan-nabigha، ص118]."
  - term: "مَا سَرَّهَا"
    text: "«ما سرّ هؤلاء من موت النعمان» [@diwan-nabigha، ص118]، يعني القبائل المذكورة في البيت السابق."
  - term: "لِرَوْعَاتِهَا"
    text: "«أي لرَوْعات منيّة النعمان»، «والرَّوْعات جمع رَوْعة؛ من راعه الشيءُ، إذا أفزعه» [@diwan-nabigha، ص118]."
  - term: "الْقُوَى وَالْوَسَائِلُ"
    text: "«أي قُوّتي وإسنادي إليه. والوسائل: أسباب المودّة التي كانت بينهما» [@diwan-nabigha، ص118]."
sources:
  - source: "diwan-nabigha"
    loc: "ص118"
