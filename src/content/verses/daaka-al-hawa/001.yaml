explained: false
first: "دَعَاكَ الْهَوَى وَاسْتَجْهَلَتْكَ الْمَنَازِلُ"
second: "وَكَيْفَ تَصَابِي الْمَرْءِ وَالشَّيْبُ شَامِلُ"
vocabulary:
  - term: "اسْتَجْهَلَتْكَ الْمَنَازِلُ"
    text: "حملتك على الجهل والصبا، يقول الأَعْلَم: «لمّا رأيتَ منازل سُعْدى فعرفتَها، حرّكت منك ما كان ساكنًا، وذكرتَ بعض ما نسيتَ، وحمَلتْك على الجهل والصِّبا» [@diwan-nabigha، ص115]."
  - term: "تَصَابِي الْمَرْءِ"
    text: "«أي كيف أخذه في حدّ الصبا، والشوق» [@diwan-nabigha، ص115]."
  - term: "وَالشَّيْبُ شَامِلُ"
    text: "«والشيبُ قد شمل شعرَه وعمّه» [@diwan-nabigha، ص115]."
sources:
