explained: false
first: "وَقَفْتُ بِرَبْعِ الدَّارِ قَدْ غَيَّرَ الْبِلَى"
second: "مَعَارِفَهَا وَالسَّارِيَاتُ الْهَوَاطِلُ"
vocabulary:
  - term: "بِرَبْعِ الدَّارِ"
    text: "«الرَّبْع: موضع نزولهم؛ وأصله من التربُّع في الربيع» [@diwan-nabigha، ص115]."
  - term: "الْبِلَى"
    text: "«تقادُم العهد» [@diwan-nabigha، ص115]."
  - term: "مَعَارِفَهَا"
    text: "«ما تُعرَف به الدار، مثل النُّؤْي والأثافيّ والوَتِد» [@diwan-nabigha، ص115]."
  - term: "وَالسَّارِيَاتُ الْهَوَاطِلُ"
    text: "«والساريات: سحاب يُمطر ليلًا. والهواطل: اللواتي يهطلن، والهَطِل: مطرٌ ليس بالشديد ولا باللّيّن» [@diwan-nabigha، ص115]."
sources:
