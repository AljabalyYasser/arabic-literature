explained: false
first: "سَقَى الْغَيْثُ قَبْرًا بَيْنَ بُصْرَى وَجَاسِمٍ"
second: "بِغَيْثٍ مِنَ الْوَسْمِيِّ قَطْرٌ وَوَابِلُ"
vocabulary:
  - term: "بُصْرَى وَجَاسِمٍ"
    text: "«هما موضعان بالشام» [@diwan-nabigha، ص121]."
  - term: "الْوَسْمِيِّ"
    text: "«أول المطر؛ لأنه يَسِمُ الأرضَ بالنبات، وإنما خصّ الوسميّ؛ لأنه أحلى المطر موقعًا من النفوس» [@diwan-nabigha، ص121]."
  - term: "وَوَابِلُ"
    text: "«والوابل: أشدّ المطر» [@diwan-nabigha، ص121]."
sources:
