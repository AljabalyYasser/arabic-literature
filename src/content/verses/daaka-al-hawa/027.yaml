explained: false
first: "وَلَا زَالَ رَيْحَانٌ وَمِسْكٌ وَعَنْبَرٌ"
second: "عَلَى مُنْتَهَاهُ دِيمَةٌ ثُمَّ هَاطِلُ"
vocabulary:
  - term: "عَلَى مُنْتَهَاهُ"
    text: "«أي على قبره. وجعله منتهًى للصّيّب لا يجاوزه» [@diwan-nabigha، ص121]، والصيّب المطر."
  - term: "دِيمَةٌ"
    text: "«المطر السائل الدائم» [@diwan-nabigha، ص121]."
  - term: "هَاطِلُ"
    text: "«مطر بين الشديد واللّين» [@diwan-nabigha، ص121]."
