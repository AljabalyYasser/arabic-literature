explained: false
first: "فَآبَ مُصَلُّوهُ بِعَيْنٍ جَلِيَّةٍ"
second: "وَغُودِرَ بِالْجَوْلَانِ حَزْمٌ وَنَائِلُ"
vocabulary:
  - term: "فَآبَ مُصَلُّوهُ"
    text: "فيه قولان عند الأَعْلَم: «رجع أول القوم ممّن كان معه بخبرٍ ليس بيّن، ثم جاء الآخرون وهم المصلّون»، «وإنما أخذه من السابق أو المصلّي»؛ و«قال أبو عبيدة: مُصلّوه يعني أصحاب الصلاة، وهم الرهبان، وأهل الدين منهم» [@diwan-nabigha، ص121]. «والمُصَلِّي من الخيل: الذي يجيء بعد السابق» [@lisan، ج14 ص466]."
  - term: "بِعَيْنٍ جَلِيَّةٍ"
    text: "«أي بخبر صادق أنه قد مات» [@diwan-nabigha، ص121]."
  - term: "وَغُودِرَ بِالْجَوْلَانِ"
    text: "«أي دُفن وتُرِك. والجولان: موضع بالشام» [@diwan-nabigha، ص121]."
  - term: "حَزْمٌ وَنَائِلُ"
    text: "«أي رجل ذو حزم ونائل. والنائل: العطاء» [@diwan-nabigha، ص121]."
