explained: false
first: "فَإِنْ تَحْيَ لَا أَمْلَلْ حَيَاتِي وَإِنْ تَمُتْ"
second: "فَمَا فِي حَيَاةٍ بَعْدَ مَوْتِكَ طَائِلُ"
vocabulary:
  - term: "لَا أَمْلَلْ حَيَاتِي"
    text: "«يقول إذا حَييتَ لم أملَل الحياة لما أدركه من الخير والنعمة» [@diwan-nabigha، ص120]."
  - term: "طَائِلُ"
    text: "خير ونفع، «وإن متّ فما في الحياة من خير بعدك ولا نفع» [@diwan-nabigha، ص120]."
sources:
