explained: false
first: "فَخَرَّتْ نَحُوصٌ ذَاتُ جَحْشٍ فَتِيَّةٌ"
second: "قَدِ اكْتَنَزَتْ لَحْمًا وَقَدْ طَبَّقَتْ شَحْمَا"
vocabulary:
  - term: "نَحُوصٌ"
    text: "أتان وحشية، كما يشرحها المحقق [@diwan-hutayah، ص399]."
  - term: "اكْتَنَزَتْ"
    text: "في شرح المحقق: «امتلأت» [@diwan-hutayah، ص399]."
  - term: "طَبَّقَتْ شَحْمَا"
    text: "«أى امتلأت حين عمّها الشحم» [@diwan-hutayah، ص399]."
