    text: "قطيع من حُمُر الوحش، ويشرحها المحقق بالأتان [@diwan-hutayah، ص399]."
  - term: "مِسْحَلِهَا"
    text: "«الحمار الوحشىّ» [@diwan-hutayah، ص399]."
