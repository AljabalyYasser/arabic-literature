first: "فَبَيْنَا هُمُ عَنَّتْ عَلَى الْبُعْدِ عَانَةٌ"
second: "قَدِ انْتَظَمَتْ مِنْ خَلْفِ مِسْحَلِهَا نَظْمَا"
vocabulary:
