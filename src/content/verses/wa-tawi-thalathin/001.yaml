explained: false
first: "وَطَاوِي ثَلَاثٍ عَاصِبِ الْبَطْنِ مُرْمِلٍ"
second: "بِبَيْدَاءَ لَمْ يَعْرِفْ بِهَا سَاكِنٌ رَسْمَا"
vocabulary:
  - term: "طَاوِي ثَلَاثٍ"
    text: "في شرح المحقق: «الطاوى: الجائع. ثلاثٍ: أى ثلاث ليال» [@diwan-hutayah، ص397]."
  - term: "عَاصِبِ الْبَطْنِ"
    text: "«الذى يتعصّب بالخِرَق، ويشدّها على بطنه من الجوع» [@diwan-hutayah، ص397]."
  - term: "مُرْمِلٍ"
    text: "«محتاج» [@diwan-hutayah، ص397]."
  - term: "رَسْمَا"
    text: "«ما بقى بالأرض من آثار الدار» [@diwan-hutayah، ص397]."
