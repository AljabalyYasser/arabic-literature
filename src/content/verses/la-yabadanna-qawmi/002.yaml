first: "النَّازِلُونَ بِكُلِّ مُعْتَرَكٍ"
second: "وَالطَّيِّبُونَ مَعَاقِدَ الأُزْرِ"
vocabulary:
  - term: "مُعْتَرَكٍ"
    text: "موضع القتال [@khizana، ج5 ص48]."
  - term: "النَّازِلُونَ"
    text: "يقول البغدادي: «يعني أنهم ينزلون عن الخيل عند ضيق المعترك فيقاتلون على أقدامهم» [@khizana، ج5 ص49]، ولا ينزل في ذلك الموضع إلا أهل البأس."
  - term: "الطَّيِّبُونَ مَعَاقِدَ الأُزْرِ"
    text: "المعاقد: مواضع عقد الإزار على الوسط، والأُزْر جمع إزار. وطيبها كناية عن العفة، يقول البغدادي: «أرادت أنهم أعفاء في فروجهم» [@khizana، ج5 ص50]، أي لا يحلّون أُزُرهم لامرأة لا تحلّ لهم."
