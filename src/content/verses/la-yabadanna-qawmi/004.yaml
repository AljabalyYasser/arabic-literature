explained: false
first: "قَوْمٌ إِذَا رَكِبُوا سَمِعْتَ لَهُمْ"
second: "لَغَطًا مِنَ التَّأْيِيهِ وَالزَّجْرِ"
vocabulary:
  - term: "لَغَطًا"
    text: "«الجلبة» [@qali، ج2 ص158]، أي أصواتًا مختلطة."
  - term: "التَّأْيِيهِ"
    text: "الصياح بالخيل والإبل لتُقبل، قال القالِيّ: «يقال: أيهت به تأييها إذا صحت به» [@qali، ج2 ص158]."
  - term: "الزَّجْرِ"
    text: "الصياح بالدابة لتسرع."
sources:
