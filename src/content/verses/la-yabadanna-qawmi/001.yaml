explained: false
first: "لَا يَبْعَدَنْ قَوْمِي الَّذِينَ هُمُ"
second: "سُمُّ العُدَاةِ وَآفَةُ الجُزْرِ"
vocabulary:
  - term: "لَا يَبْعَدَنْ"
    text: "دعاء للميت ألا يهلك ولا يُنسى، والعرب تقوله لمن مات. ويرى ابن السِّيد، فيما ينقله البغدادي، أنها لما دعت لهم «ببقاء الذكر بعد موتهم صاروا كالموجودين» [@khizana، ج5 ص47]، ولذلك قالت «هم» لا «كانوا»."
  - term: "العُدَاةِ"
    text: "الأعداء، والعداة «جمع عاد كقضاة جمع قاض» [@khizana، ج5 ص47]."
  - term: "الجُزْرِ"
    text: "جمع جَزُور، وهي «الناقة التي تنحر» [@khizana، ج5 ص47]. فهم سمّ يقتل أعداءهم، وآفة تفني إبلهم لكثرة ما ينحرون منها للضيفان."
