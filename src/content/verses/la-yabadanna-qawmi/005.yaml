first: "وَالخَالِطِينَ نَحِيتَهُمْ بِنُضَارِهِمْ"
second: "وَذَوِي الغِنَى مِنْهُمْ بِذِي الفَقْرِ"
vocabulary:
  - term: "نَحِيتَهُمْ"
    text: "«الخامل الساقط الذكر» [@khizana، ج5 ص53]."
  - term: "بِنُضَارِهِمْ"
    text: "النُّضار: «الخالص النسب العزيز الشهير» [@khizana، ج5 ص53]. يقول البغدادي: «إنهم خلطوا خاملهم برفيعهم وفقيرهم بغنيهم» [@khizana، ج5 ص53]."
