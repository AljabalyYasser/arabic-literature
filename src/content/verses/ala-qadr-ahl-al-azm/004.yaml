first: وَيَطلُبُ عِندَ الناسِ ما عِندَ نَفسِهِ
second: وَذلِكَ ما لا تَدَّعيهِ الضَراغِمُ
level: full
meaning: يقيس سيف الدولة الناس على ما يجده في نفسه من شجاعة وبأس، فيطلب منهم مستوى بالغًا من الإقدام؛ ويبالغ المتنبي حتى يقول إن الأسود نفسها لا تدعي بلوغ هذا المقدار.
vocabulary:
  - term: الضراغم
    text: جمع ضرغم، وهو الأسد؛ واستحضاره هنا لاستدعاء أقصى صورة مألوفة للشجاعة والقوة.
  - term: ما عند نفسه
    text: ما استقر في نفسه من الشجاعة والهمة والبأس، لا مجرد شيء مادي «عنده».
syntax:
  - المقابلة بين «عند الناس» و«عند نفسه» تبني الجملة على معيارين متواجهين.
  - "اسم الإشارة «ذلك» يلخص ما سبق كله ويجعله موضوع الحكم التالي: مستوى لا تدعيه الضراغم."
morphology:
  - «تدّعيه» من «ادّعى»؛ وفي الصيغة معنى نسبة الشيء إلى النفس والمطالبة به، وهو أنسب من مجرد «تفعله» لأن البيت يتحدث عن جرأة لا تزعمها حتى الأسود.
  - "«الضراغم» جمع «ضِرغام»، وهو الأسد. اختيار الجمع لا المفرد يرفع سقف المقارنة: حتى جنس الأسود في جمعه لا يدّعي ذلك."
  - التكرار الصرفي في «عند الناس / عند نفسه» ليس اشتقاقًا، لكنه يثبت وحدة البنية التي يقارن داخلها بين الخارج والذات.
rhetoric:
  thesis: "قوة البيت في بناء معيار مستحيل تقريبًا: سيف الدولة لا يطلب من الناس الحد المعتاد، بل يطلب منهم نسخة من القوة التي يجدها في نفسه."
  devices:
    - title: تناظر الموضعين
      text: «عند الناس / عند نفسه» تضع الخارج والداخل في ميزان واحد. المشكلة ليست في أن الناس لا يعملون، بل في أن المقياس الذي يقيسهم به الممدوح مأخوذ من نفسه الاستثنائية.
    - title: الأسد كحد أقصى
      text: الضراغم ليست وصفًا عابرًا؛ إنها معيار ثقافي للشجاعة. فإذا كانت الأسود لا تدعي ذلك، فالمبالغة ترفع الممدوح فوق النموذج الحيواني الذي اعتادت العربية اتخاذه غاية في البأس.
    - title: الإبهام ثم التفسير
      text: "«ما عند نفسه» عبارة عامة لا تفصل الصفات واحدة واحدة. يأتي «الضراغم» ليحدد جهة القراءة: الشجاعة والبأس في المقام الحربي."
    - title: إغلاق المقطع الأول
      text: "بهذا البيت تكتمل الحجة: عظمة الهمة → عظمة الفعل → عجز الجيوش → معيار لا تبلغه الأسود. بعد ذلك يستطيع الشاعر الانتقال إلى صورة حسية للحرب."
  connection: "البيتان الخامس والسادس لا يواصلان المدح بالتقرير، بل يقدمان دليلًا تصويريًا قاسيًا على كثرة الوقائع والقتلى: النسور وسلاح سيف الدولة."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: البيت أقل اعتمادًا على التقابل الصريح من سابقه، لكنه يحتفظ بتناظر «عند... عند...» ثم ينتهي بكلمة ثقيلة الدلالة «الضراغم».
context: خاتمة المقطع الذي يطبق حكمة المطلع على سيف الدولة قبل الانتقال إلى مشاهد الحرب.
