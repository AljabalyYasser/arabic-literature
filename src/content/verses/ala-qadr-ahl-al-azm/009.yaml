first: بَناها فَأَعلى وَالقَنا تَقرَعُ القَنا
second: وَمَوجُ المَنايا حَولَها مُتَلاطِمُ
level: full
meaning: يبني سيف الدولة قلعة الحدث ويرفع بناءها في اللحظة نفسها التي تتقارع فيها رماح المسلمين والروم، والموت يحيط بالمكان من كل جهة. لا يفصل المتنبي فعل البناء عن القتال؛ بل يجعل القلعة ترتفع وسط المعركة نفسها.
vocabulary:
  - term: فأعلى
    text: أي رفع بناءها وأعلاه؛ والضمير المفهوم يعود إلى القلعة.
  - term: القنا
    text: الرماح؛ واللفظة تكررت في الشطر لتصوير اصطدام رماح الفريقين.
  - term: المنايا
    text: جمع منية، أي الموت.
  - term: متلاطم
    text: يضرب بعضه بعضًا؛ وأصله من تلاطم أمواج البحر.
syntax:
  - الفاعل في «بناها» و«فأعلى» ضمير يعود إلى سيف الدولة، والهاء إلى قلعة الحدث.
  - "جملة «والقنا تقرع القنا» حالية في المعنى؛ فهي تصف ظرف البناء: البناء جارٍ والرماح تتقارع في الوقت نفسه."
  - في «القنا تقرع القنا» تكررت اللفظة نفسها فاعلًا ومفعولًا، فاختصر التركيب طرفي القتال في أداة واحدة مشتركة بينهما.
  - «موج المنايا» مبتدأ، و«متلاطم» خبره، و«حولها» متعلق بالخبر؛ فيحيط الموت بالقلعة نحويًا كما يحيط بها في الصورة.
morphology:
  - «المنايا» جمع «منية»، وصيغة الجمع تحول الموت من حادثة مفردة إلى كثرة منتشرة حول المكان.
  - «متلاطم» اسم فاعل من «تلاطم» على وزن تفاعل، وصيغة التفاعل تحمل معنى اصطدام بعض الموج ببعض.
  - الفعلان «بنا» و«أعلى» يحركان الصورة إلى أعلى، في مقابل «المنايا» التي تضيق حول البناء من الجهات.
rhetoric:
  thesis: "يبني البيت مفارقته الكبرى من اجتماع فعلين متضادين في المشهد: البناء الذي يقيم الحياة والعمران، والموت الذي يطوق المكان. ومن هذا التضاد تنشأ صورة سيف الدولة وهو يرفع القلعة لا بعد انقضاء الخطر، بل في قلبه."
  devices:
    - title: البناء في قلب الهدم
      text: "«بناها فأعلى» يقابل معنويًا «موج المنايا». الصورتان متزامنتان: يد تبني، وحرب تهدم الأرواح. لذلك يصبح البناء نفسه دليل شجاعة، لا مجرد عمل عمراني."
    - title: استعارة البحر للموت
      text: جعل للمنايا «موجًا متلاطمًا». يشرح الواحدي أن كثرة المنايا شُبهت بالبحر حين تتلاطم أمواجه؛ فالموت ليس نقاطًا متفرقة، بل وسطًا هائجًا يحيط بالقلعة.
    - title: تكرار القنا
      text: في «القنا تقرع القنا» تتكرر الكلمة على طرفي الفعل، وكأن الرماح نفسها ملأت مساحة الشطر. لا يحتاج الشاعر إلى تسمية الجيشين؛ اصطدام الأداة بالأداة يكفي لتجسيد المواجهة.
    - title: زمنان في لحظة واحدة
      text: الماضي في «بناها» لا يجعل الحرب حدثًا منتهيًا، لأن الحال «والقنا تقرع القنا» يعيد المشهد إلى لحظة وقوعه. هكذا تُروى النتيجة ويُستحضر زمن الإنجاز معًا.
  connection: "بعد أن جعل البناء قائمًا وسط بحر المنايا، ينتقل البيت التالي إلى تشخيص القلعة نفسها: كانت مضطربة كالمجنون، ثم صارت جثث الأعداء عليها بمنزلة التمائم التي أذهبت ذلك الاضطراب."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: توالي القاف والنون في «القنا تقرع القنا» يضيف صلابة صوتية إلى مشهد اصطدام الرماح، ثم تمتد عبارة «موج المنايا» بما يلائم اتساع الصورة البحرية.
context: يواصل البيت لوحة الحدث بعد السقي والدم، لكنه ينقل مركز الصورة من لون القلعة إلى فعل إعادة بنائها أثناء القتال.
