first: هَلِ الحَدَثُ الحَمراءُ تَعرِفُ لَونَها
second: وَتَعلَمُ أَيُّ الساقِيَينِ الغَمائِمُ
level: full
meaning: "يخاطب المتنبي قلعة الحدث كأنها كائن واعٍ، ويسألها هل تعرف لونها بعد أن احمرت بدماء القتال، وهل تستطيع أن تميز أي ساقييها هو الغمام؛ لأن لها ساقيًا آخر سيكشفه البيت التالي: الجماجم والدماء."
vocabulary:
  - term: الحدث
    text: ثغر وقلعة على الحدود مع الروم، ارتبطت الواقعة بإعادة بنائها في عهد سيف الدولة.
  - term: الحمراء
    text: يشرح الشراح الحمرة بما سال في الوقعة من الدماء.
  - term: الساقيين
    text: "اثنان يسقيان القلعة في الصورة: الغمام، ثم ما يكشفه البيت التالي من الجماجم/الدماء."
syntax:
  - الاستفهام بـ«هل» موجه إلى غير عاقل في الأصل، وهو جزء من تشخيص القلعة.
  - في «أي الساقيين الغمائم» تأخير للمعلومة الثانية؛ لا يصرح الشاعر بالساقي المقابل داخل البيت، بل يجعل البيت التالي يجيب.
morphology:
  - «الساقيين» مثنى «ساقٍ» منصوب/مجرور بالياء، وإفراد أحدهما بالذكر «الغمائم» يترك الثاني معلقًا حتى البيت التالي.
  - «الغمائم» جمع «غمامة»، ومقابلتها لاحقًا بـ«الجماجم» تقوم كذلك على تقارب وزني وصوتي بين جمعين، من غير أن يكون ذلك غاية الصورة.
  - الفعلان «تعرف» و«تعلم» مضارعان من أفعال الإدراك، وإسنادهما إلى المكان هو الذي يفتح باب التشخيص.
rhetoric:
  thesis: الصورة لا تكتمل داخل هذا البيت وحده؛ فالمتنبي يصنع سؤالًا معلقًا ثم يجعل البيت التالي يقدم العنصر المحذوف، وبذلك يرتبط البيتان تركيبًا وتخييلًا.
  devices:
    - title: تشخيص المكان
      text: «تعرف» و«تعلم» أفعال وعي. بإسنادهما إلى القلعة تتحول الحدث من جدار وموقع عسكري إلى شاهد حي على ما جرى فيها.
    - title: اللون بوصفه ذاكرة
      text: السؤال «تعرف لونها» لا يصف الحمرة فقط؛ بل يوحي بأن شدة الدم بدلت هيئة المكان حتى صار كأنه يراجع ذاكرته القديمة.
    - title: الإضمار والتشويق
      text: يذكر «الغمائم» أحد الساقيين ويسكت عن الآخر. هذا النقص متعمد لأن «الجماجم» ستأتي في البيت التالي، فينشأ تعليق بين بيتين لا يستقيم تفسير أحدهما بمعزل عن الآخر.
    - title: الاستفهام لا طلب الجواب
      text: القلعة لن تجيب. وظيفة السؤال إحياء المشهد وإدخال المكان في فعل الشهادة على الوقعة، لا تحصيل معلومة مجهولة.
  connection: "البيت الثامن يحل السؤال: كان الغمام يسقي القلعة قبل مجيء سيف الدولة، فلما دنا صار لها سقي آخر هو الدم الذي تمثله الجماجم."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: وقفة الاستفهام في منتصف اللوحة تغير النبرة من التقرير إلى المخاطبة، فتنعش الحركة السردية قبل جواب البيت التالي.
context: بداية لوحة «الحدث الحمراء»، وهي انتقال من أثر الحرب في الطير إلى المكان الذي وقعت فيه الحرب نفسها.
