first: تُفَدّي أَتَمُّ الطَيرِ عُمرًا سِلاحَهُ
second: نُسورُ الفَلا أَحداثُها وَالقَشاعِمُ
level: full
meaning: يتخيل المتنبي النسور، صغيرها ومسنها، وهي تفدي سلاح سيف الدولة؛ لأن كثرة ما يوقعه السلاح من قتلى تكفيها مؤنة طلب الطعام. فبدل أن يصف كثرة القتل مباشرة، يصور أثره في الطير التي تقتات من الجثث.
vocabulary:
  - term: أتم الطير عمرًا
    text: أطول الطير عمرًا في سياق البيت، وقد ناقش ابن سيده اختيار «أتم» من جهة اللغة والوزن.
  - term: أحداثها
    text: صغار النسور وحديثها سنًا.
  - term: القشاعم
    text: المسان من النسور.
  - term: تفدي
    text: "تقول: جعلنا أنفسنا فداءً لك؛ وهو تخييل يجعل النسور كأنها ناطقة بالشكر."
syntax:
  - «أتم الطير عمرًا» هو المسند إليه في «تفدي»، و«عمرًا» تمييز يوضح جهة التمام.
  - «نسور الفلا» تفسير لأتم الطير، ثم «أحداثها والقشاعم» تفصيل لطرفي العمر؛ وقد ناقش ابن سيده أوجه البدل في هذا التركيب.
morphology:
  - «أتمّ» اسم تفضيل من «تمّ»، و«عمرًا» تمييز يبين جهة التمام. وقد وقف ابن سيده عند هذا الاختيار لأن المتوقع في العمر «أطول»، وربطه بما يستقيم معه الوزن.
  - «أحداث» جمع «حدث» بمعنى صغير السن، في مقابل «القشاعم» وهي المسان من النسور؛ فالمعجم الصرفي نفسه يقسم الطير إلى طرفي العمر.
  - «تفدي» من الفداء، وإسنادها إلى الطير ينقل فعلًا إنسانيًا إراديًا إلى النسور، وهو أساس التشخيص في الصورة.
rhetoric:
  thesis: "هذا البيت ينقلنا من مديح مباشر إلى تصوير أثر الحرب. البلاغة هنا في زاوية الرؤية: الشاعر لا يرينا المقتولين أولًا؛ يرينا كائنات تعيش على نتيجة القتل."
  devices:
    - title: قلب زاوية الوصف
      text: بدل قول «كثر قتلاه»، يجعل النسور هي المتكلمة المستفيدة من السلاح. النتيجة أبلغ لأن القارئ يستنتج كثرة القتلى من أثرها، لا من تصريح الشاعر بها.
    - title: تشخيص النسور
      text: الفعل «تفدي» من أفعال الكائن العاقل المتكلم، فنُقلت النسور إلى مقام من يشكر السلاح ويفديه. هذا التشخيص يزيد غرابة الصورة وقسوتها في آن واحد.
    - title: استيعاب طرفي العمر
      text: «أحداثها والقشاعم» يجمع الصغار والمسان، أي إن أثر الحرب بلغ كل النسور. التقابل العمري هنا وسيلة للمبالغة في الشمول.
    - title: دقة اختيار «أتم»
      text: وقف ابن سيده عند «أتم» لأنها ليست اللفظة المتوقعة مع العمر مثل «أطول»، وناقش توجيهها وصلتها بما يستقيم معه الوزن. يتصل هنا الاختيار المعجمي بالبناء العروضي للبيت، فلا تُفهم اللفظة بمعزل عن صياغتها الشعرية.
  connection: "البيت السادس يفسر الصورة ويذهب بها أبعد: حتى ضعف مخالب النسور لا يضرها، لأن أسياف سيف الدولة تقوم مقام وسيلة الصيد."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: اختيار «أتم» بدل «أطول» ناقشه ابن سيده من جهة سلامة الوزن؛ وهي ملاحظة تصل المعجم بالعروض وتبين أثر الوزن في إمكانات الصياغة.
context: بداية مقطع تصوير آثار الحرب من خلال النسور، بعد أربعة أبيات كانت أقرب إلى الحكمة والمدح المباشر.
