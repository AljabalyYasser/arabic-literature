first: وَما ضَرَّها خَلقٌ بِغَيرِ مَخالِبٍ
second: وَقَد خُلِقَت أَسيافُهُ وَالقَوائِمُ
level: full
meaning: لا يضر النسور — ولا سيما صغارها ومسانها الضعيفة — أن تكون بلا مخالب قوية للصيد، ما دامت أسياف سيف الدولة تكثر لها الجثث. و«القوائم» هنا جمع قائم السيف؛ أي مقبضه، لا قوائم الحيوان.
vocabulary:
  - term: المخالب
    text: ما تصيد به الجوارح وتمسك الفريسة.
  - term: القوائم
    text: جمع قائم السيف؛ أي مقبضه. هذه دلالة لغوية مهمة لأن القراءة الحديثة قد تتوهم الأرجل.
  - term: خلق بغير مخالب
    text: أي كونها مخلوقة من غير مخالب قوية مفترسة؛ والبيت يبني على صورة النسور في البيت السابق.
syntax:
  - "يمكن فهم «ما» على النفي، ويذكر الشراح إمكان حمل العبارة على معنى الاستفهام الإنكاري: ما الذي كان سيضرها لو خُلقت بلا مخالب؟"
  - "جملة «وقد خلقت أسيافه والقوائم» حالية تعلل انتفاء الضرر: السلاح قائم بوظيفة توفير القوت."
morphology:
  - «مخالب» جمع «مِخلب»، وهو اسم آلة من الخلب/الأخذ، فدلالته مرتبطة بوظيفة الصيد والإمساك.
  - «أسياف» جمع «سيف»، و«القوائم» جمع «قائم» في معنى قائم السيف أي مقبضه؛ ولا يصح هنا حملها على قوائم الحيوان.
  - البناء للمجهول في «خُلقت» يوجه الانتباه إلى هيئة الخِلقة نفسها لا إلى فاعل الخلق، لأن المقارنة منصبة على الأداة الطبيعية في مقابل السلاح.
rhetoric:
  thesis: "البيت لا يضيف صورة جديدة منفصلة، بل يكمل منطق الصورة السابقة: النسور لا تحتاج أدوات الصيد لأن الحرب نفسها صارت أداة إطعامها."
  devices:
    - title: المفارقة القاسية
      text: المخلب، وهو أداة طبيعية للصيد، يصبح غير ضروري لأن سيف الإنسان يؤدي الوظيفة على نطاق أكبر. هكذا يتحول المدح الحربي إلى صورة لا تخفي عنف الحرب.
    - title: السبب بعد النتيجة
      text: "في البيت السابق رأينا النسور تفدي السلاح، وهنا نعرف السبب: السلاح أغناها عن الصيد. هذا الربط يجعل البيتين وحدة تصويرية واحدة لا بيتين مستقلين."
    - title: دقة اللفظ «القوائم»
      text: المقصود مقابض السيوف، لا أرجل الحيوان. وعلى هذا المعنى تقوم المقابلة بين أداة الصيد الطبيعية «المخالب» وبين السلاح المصنوع «الأسياف والقوائم»؛ فإذا أسيء فهم اللفظة اختلت الصورة كلها.
    - title: المدح بطريق الأثر
      text: "لا يقول: سيف الدولة كثير القتل. يجعل أثر سلاحه في نظام غذاء النسور دليلًا على كثرة الوقائع. هذه طريقة تصويرية غير مباشرة أقوى من التقرير."
  connection: "بعد اكتمال صورة النسور، ينتقل البيت السابع إلى مركز الواقعة نفسه: قلعة الحدث، فيسألها عن لونها كأنها كائن يتذكر."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: التقابل بين «مخالب» و«أسيافه والقوائم» يضع أداة صيد الحيوان بإزاء أداة قتل الإنسان، وهو تقابل دلالي يدعم الصورة أكثر من كونه مجرد محسن لفظي.
context: البيت الثاني من لوحة النسور، ووظيفته تفسير الصورة السابقة وتكثيف دلالة كثرة القتلى.
