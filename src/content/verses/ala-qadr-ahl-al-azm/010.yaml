first: وَكانَ بِها مِثلُ الجُنونِ فَأَصبَحَت
second: وَمِن جُثَثِ القَتلى عَلَيها تَمائِمُ
level: full
meaning: كانت قلعة الحدث في اضطراب دائم بسبب هجمات الروم والفتنة المحيطة بها، فشبه المتنبي حالها بالجنون. وبعد انتصار سيف الدولة وتعليق جثث القتلى على أسوارها، جعل تلك الجثث بمنزلة التمائم التي أزالت عنها جنونها؛ أي أوقفت الفتنة وأعادت إليها الأمن.
vocabulary:
  - term: مثل الجنون
    text: شبه اضطراب القلعة واضطراب أحوالها بالجنون.
  - term: جثث
    text: أجساد القتلى.
  - term: تمائم
    text: جمع تميمة؛ ما كان يُعلّق اتقاءً للآفة أو طلبًا للحفظ، واستعملها الشاعر هنا في صورة ساخرة قاسية.
syntax:
  - "يذكر البرقوقي أن «مثل» اسم «كان»، والتقدير: كان بها شيء مثل الجنون."
  - «فأصبحت» تامة في توجيه البرقوقي؛ أي دخلت في الصباح أو صارت إلى حال جديدة، ثم جاءت جملة «عليها تمائم» لتصور هذه الحال.
  - شبه الجملة «من جثث القتلى» يبين مادة تلك «التمائم»؛ فهي ليست حروزًا حقيقية بل جثث الأعداء المعلقة.
morphology:
  - «تمائم» جمع «تميمة»، والجمع يوافق كثرة الجثث ويحول مفردة ذات دلالة وقائية إلى صورة جماعية تحيط بالقلعة.
  - «جثث» جمع «جثة»، وهو لفظ أهدأ وأقل إيحاءً بالتعفن من «جيف»؛ ولهذا تكتسب الرواية المنقولة عن تصحيح سيف الدولة دلالة أسلوبية أيضًا.
  - «فأصبحت» تنقل الحالة من زمن ممتد في «كان» إلى تحول وقع بعد النصر، فيتجسد الانتقال من الاضطراب إلى السكون.
rhetoric:
  thesis: البيت يبني استعارة ممتدة للقلعة بوصفها جسدًا أصابه الجنون ثم عولج بتمائم. والمفارقة أن «دواء» القلعة ليس شيئًا رحيمًا، بل جثث من تسببوا في اضطرابها.
  devices:
    - title: تشخيص القلعة
      text: "بعد أن جعلها في البيتين السابقين تعرف لونها وتُسقى، يضيف إليها هنا مرضًا نفسيًا: «مثل الجنون». تتراكم بذلك صفات الكائن الحي حتى تصبح القلعة شخصية داخل القصيدة."
    - title: استعارة العلاج
      text: الجثث تتحول إلى «تمائم» أذهبت الجنون. يشرح الواحدي والبرقوقي أن الفتنة سكنت بعد هزيمة الروم، فصارت صورة التميمة طريقة شعرية لتحويل النتيجة العسكرية إلى شفاء للمكان.
    - title: المفارقة بين الحفظ والموت
      text: التميمة تُعلَّق طلبًا للحفظ، أما المعلق هنا فجثث قتلى. يلتقي رمز الوقاية بأثر الموت، فتتولد صورة صادمة تجعل أمن القلعة قائمًا على هزيمة من هاجموها.
    - title: من «كان» إلى «أصبحت»
      text: "التقابل الزمني بين الحال القديمة والتحول الجديد هو العمود الخفي للبيت: اضطراب مستمر أولًا، ثم انقلاب في حال القلعة بعد تدخل سيف الدولة."
  connection: "بعد شفاء القلعة من «جنونها»، يوسع المتنبي المشهد في البيت الحادي عشر: لم يعد الخصم الروم وحدهم، بل الدهر نفسه الذي طرد القلعة من أهلها، وسيف الدولة يردها عليه."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: ينتهي البيت بـ«تمائم»، وهي كلمة تستجيب لقافية الميم وتعيد في الوقت نفسه صورة التعليق المادي على الأسوار، فيلتقي الروي بوظيفة الصورة.
context: خاتمة لوحة بناء القلعة بعد القتال، وفيها تتحول الحدث من مكان مضطرب إلى مكان استعاد أمنه.
variants:
  - reading: ومن جثث القتلى
    status: المعتمد هنا
    note: ينقل البرقوقي عن المتنبي أنه أنشد أولًا «ومن جيف القتلى»، فاقترح سيف الدولة «ومن جثث القتلى»، فقبل المتنبي التصحيح. تُعرض الرواية هنا كما نقلها الشرح، لا بوصفها حكمًا على تاريخ جميع نسخ الديوان.
