first: وَتَعظُمُ في عَينِ الصَغيرِ صِغارُها
second: وَتَصغُرُ في عَينِ العَظيمِ العَظائِمُ
level: full
meaning: الأمور الصغيرة تبدو كبيرة لمن صغر قدره وهمته، بينما يرى العظيم الأعمال العظيمة دون مستوى ما يستطيع الإقدام عليه. المتنبي ينقلنا من مقدار الفعل في نفسه إلى مقدار الفعل في عين من يقدّره.
vocabulary:
  - term: الصغير
    text: ليس المراد صغر السن، بل صغر القدر والهمة في سياق البيت.
  - term: العظيم
    text: عظيم القدر والهمة.
  - term: صغارها / العظائم
    text: صغار الأمور وعظائمها، والضمير عائد إلى الأعمال والأحوال المفهومة من السياق.
syntax:
  - «صغارها» فاعل «تعظم» مؤخر، و«العظائم» فاعل «تصغر» مؤخر؛ تقديم الفعل يجعل التحول في الرؤية هو بداية كل شطر.
  - تكرار «في عين» يربط الحكم بزاوية الإدراك لا بحجم الشيء وحده.
  - "الشطران متقابلان نحويًا ودلاليًا: تعظم/تصغر، الصغير/العظيم، صغارها/العظائم."
morphology:
  - تدور ألفاظ «تعظم، العظيم، العظائم» على مادة عظم، وألفاظ «تصغر، الصغير، صغارها» على مادة صغر؛ وهذا الاشتقاق يبني قطبي البيت من الجذر نفسه.
  - «العظائم» جمع «عظيمة» بمعنى الأمور الجليلة، و«صغارها» جمع «صغيرة» مضاف إلى الضمير العائد إلى الأمور/الأفعال المفهومة من السياق.
  - المضارعان «تعظم» و«تصغر» يمنحان الحكم صفة التكرر والاستمرار، فيلائم ذلك صيغة الحكمة العامة.
rhetoric:
  thesis: هذا البيت مثال واضح على أن البلاغة ليست مجرد تسمية «طباق». قوته في شبكة كاملة من التقابل والاشتقاق وترتيب الكلمات تجعل الفكرة تُرى وهي تنقلب أمام القارئ.
  devices:
    - title: مقابلة كاملة
      text: «تعظم / تصغر» و«الصغير / العظيم» و«صغارها / العظائم»؛ ثلاث طبقات من التضاد تعمل في وقت واحد، ولذلك يبدو الشطر الثاني كمرآة تقلب الشطر الأول.
    - title: اشتقاق متكرر
      text: يدور الشطر الأول حول مادة الصغر، والثاني حول مادة العظم، فتتردد الجذور نفسها في الفعل والاسم والصفة. هذا يجعل اللغة نفسها تجسّد عملية التكبير والتصغير.
    - title: العين بوابة الحكم
      text: لم يقل «عند الصغير» بل «في عين الصغير». ينقل الحكم إلى مشهد الرؤية، فيصبح اختلاف المقادير اختلافًا في البصيرة والقدرة على التقدير.
    - title: التدرج الحجاجي
      text: "بعد أن قرر البيت الأول أن عظمة الفعل تتناسب مع عظمة الفاعل، يقرر هذا البيت أن العظيم نفسه لا يتهيب العظائم. وهكذا يمهد نفسيًا لقول: «يكلف سيف الدولة الجيش همه»."
  connection: البيت الثالث سيترك الحكمة العامة لأول مرة ويسمي سيف الدولة مباشرة، فيتحول الكلام من قاعدة إلى تطبيق.
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: "التناظر الشديد بين الشطرين يصنع إيقاعًا داخليًا فوق إيقاع البحر: تعظم/تصغر، الصغير/العظيم، صغارها/العظائم."
context: ثاني مقدمة الحكمة، وهو الجسر الأخير قبل الانتقال إلى الممدوح بالاسم.
