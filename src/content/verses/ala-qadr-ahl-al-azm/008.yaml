first: سَقَتها الغَمامُ الغُرُّ قَبلَ نُزولِهِ
second: فَلَمّا دَنا مِنها سَقَتها الجَماجِمُ
level: full
meaning: قبل نزول سيف الدولة بالحدث كانت الغيوم تسقيها بالمطر، فلما اقترب ووقعت المعركة صار الدم المسفوك من القتلى بمنزلة سقي آخر. يجعل المتنبي «الجماجم» هي الساقي ليكثف فظاعة المشهد وكثرة القتل.
vocabulary:
  - term: الغمام الغر
    text: السحب البيض أو المشرقة، واللفظة تمهد لمفارقة ما يقابلها من دماء الحرب.
  - term: نزوله
    text: نزول سيف الدولة بالموضع، لا نزول المطر؛ والضمير يعود إلى سيف الدولة في سياق الشراح.
  - term: الجماجم
    text: رؤوس القتلى؛ وجعلها الشاعر ساقية كناية تصويرية عن كثرة الدم المسفوك في الوقعة.
syntax:
  - "الشطران مبنيان على الفعل نفسه «سقتها»، مع فاعلين مختلفين: الغمام ثم الجماجم."
  - "«قبل نزوله / فلما دنا منها» يبني تقابلًا زمنيًا واضحًا: قبل حضور سيف الدولة وبعد اقترابه."
morphology:
  - «الغُرّ» جمع «أغرّ/غراء» بحسب الموصوف، ودلالته البياض أو الإشراق؛ ولذلك يحمل لونًا مضادًا للحمرة الدموية التي تحيط بالمشهد.
  - «الجماجم» جمع «جمجمة»، وجاء الجمع ليجعل ما يفترض أنه بقايا أفراد كتلةً مشهدية تقوم مقام الساقي الثاني.
  - "تكرار «سقتها» بصيغة الماضي مع اختلاف الفاعل يثبت الصيغة ويبدل مادتها: ماء الغمام أولًا، ثم الدم الذي تدل عليه الجماجم."
rhetoric:
  thesis: هذا البيت جواب فني عن سؤال البيت السابق، ويقوم على تحويل فعل طبيعي رحيم — سقي الغمام — إلى صورة حرب دموية تحتفظ بالفعل نفسه وتبدل الفاعل.
  devices:
    - title: تكرار الفعل وتبديل الفاعل
      text: «سقتها... سقتها» يثبت الفعل نفسه، لكن «الغمام» يتحول إلى «الجماجم». من هذا التبديل وحده ينشأ الصدام بين الطبيعة والحرب.
    - title: تقابل زمني
      text: «قبل نزوله» في مقابل «فلما دنا منها». وصول سيف الدولة هو نقطة التحول التي تنقسم عندها صورة المكان إلى ما قبل المعركة وما بعدها.
    - title: صورة السقي الدامي
      text: السقي في الأصل إحياء بالماء، لكن الشاعر يجعله هنا بالدم. هذه المفارقة تغير القيمة الشعورية للفعل دون أن تغير لفظه، فيصبح أكثر قسوة وأشد بقاء في الذاكرة.
    - title: اكتمال الصورة بين بيتين
      text: «الجماجم» هي العنصر الذي أخفاه البيت السابع عند قوله «أي الساقيين الغمائم». لذلك يكتمل البناء التخييلي والنحوي للبيت السابق هنا، ويغدو البيتان لوحة واحدة.
  connection: بعد هذه الصورة يواصل المتنبي وصف بناء القلعة وسط اصطدام الرماح، وينقل «المنايا» إلى صورة موج متلاطم؛ فتتسع اللوحة من السقي واللون إلى حركة المعركة كلها.
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: التوازي بين الشطرين يرسخ المقابلة، بينما الفاء في «فلما» تسرّع التحول من الزمن الهادئ إلى زمن القتال.
context: جواب مباشر عن سؤال البيت السابع، وخاتمة لوحة اللون والسقي قبل الانتقال إلى صورة البناء والرماح والمنايا.
