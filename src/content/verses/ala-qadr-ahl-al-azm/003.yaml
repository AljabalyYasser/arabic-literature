first: يُكَلِّفُ سَيفُ الدَولَةِ الجَيشَ هَمَّهُ
second: وَقَد عَجَزَت عَنهُ الجُيوشُ الخَضارِمُ
level: full
meaning: يحمّل سيف الدولة جيشه أعمالًا على قدر همته هو، وهي همة يبالغ المتنبي في رفعها حتى يجعل الجيوش العظيمة الكثيرة عاجزة عن بلوغ مداها.
vocabulary:
  - term: همّه
    text: ما تتجه إليه همته من الغزو والعمل الكبير.
  - term: الخضارم
    text: جمع خضرم؛ الكثير العظيم من كل شيء. يشرح الواحدي اللفظة بهذا المعنى.
syntax:
  - "«سيف الدولة» فاعل «يكلف»، و«الجيش» مفعوله الأول، و«همّه» المفعول الثاني: يكلف الجيش ما تقتضيه همته."
  - "الجملة الثانية حالية في أثرها: وهو يكلف جيشه ذلك مع أن جيوشًا عظيمة قد عجزت عنه."
morphology:
  - "«يكلّف» فعل مزيد بالتضعيف من «كلِف/كلّف»، وفي التضعيف معنى التعدية: يجعل الجيش متحملًا لما يريده همّه."
  - «الخضارم» جمع «خِضْرَم»، ويستعمل في الكثير العظيم؛ فصيغة الجمع نفسها تعزز معنى كثرة الجيوش التي عجزت.
  - «همّه» مصدر أُسند إليه فعل التكليف على سبيل المجاز، فصار المعنى النفسي كأنه قوة فاعلة مستقلة.
rhetoric:
  thesis: "هنا يبدأ التطبيق الفعلي للحكمة: لا يقول المتنبي إن سيف الدولة عظيم فقط؛ بل يعيد صياغة معنى البيت الأول في صورة عملية فيها قائد وجيش ومهمة تتجاوز الطاقة المعتادة."
  devices:
    - title: من التجريد إلى المشهد
      text: "انتقلنا من «أهل العزم» المجهولين إلى اسم محدد: سيف الدولة. هذا التحول يمنع المقدمة من أن تبقى حكمة معلقة ويجعلها جزءًا من بنية المدح."
    - title: مفارقة المفرد والجمع
      text: جيش واحد يكلّفه سيف الدولة همته، ثم «الجيوش» بالجمع تعجز عن تلك الهمة. الفرق العددي يخدم المبالغة في رفع معيار الممدوح.
    - title: جعل الهمة تكليفًا
      text: الهمة معنى نفسي، لكن البيت يجعلها شيئًا يُحمَّل على الجيش. بهذا تتحول صفة داخلية في القائد إلى عبء عملي يقيس طاقة الرجال.
    - title: المبالغة الوظيفية
      text: "المبالغة هنا ليست منفصلة عن الحجة؛ إنها تجيب عن السؤال الذي صنعه المطلع: ما صورة «العزائم على قدر أهل العزم»؟ هذه هي الصورة."
  connection: "البيت الرابع سيكشف نتيجة أخرى لعظمة المعيار عند سيف الدولة: إنه يطلب من الناس ما يجده في نفسه، ولذلك يبدو طلبه فوق طاقة البشر."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: تكرار الجيم والشين والخاء والضاد في «الجيش / الجيوش / الخضارم» يمنح الشطر الثاني ثقلاً صوتيًا يلائم معنى الكثرة والعظمة، من غير أن نجعل الصوت وحده دليل المعنى.
context: أول ذكر مباشر لسيف الدولة في القصيدة. عنده تنتقل المقدمة من الحكمة إلى المدح الحربي.
variants:
  - reading: الجيوش الخضارم
    status: المعتمد هنا
    note: الواحدي يصرح بأن هذه الرواية هي الصحيحة عنده، وينبه إلى رواية أخرى ربطت «الخضارم» بالبحور.
