first: طَريدَةُ دَهرٍ ساقَها فَرَدَدتَها
second: عَلى الدينِ بِالخَطّيِّ وَالدَهرُ راغِمُ
level: full
meaning: يصوّر المتنبي قلعة الحدث كأن الدهر طاردها حين سلط عليها الروم حتى خربت وخرجت من يد المسلمين، ثم يخاطب سيف الدولة بأنه ردها إلى أهل الدين برماحه، في تحدٍّ للدهر نفسه وإذلال له.
vocabulary:
  - term: طريدة
    text: المطرودة أو التي يطاردها غيرها.
  - term: الخطي
    text: الرماح، منسوبة إلى الخط؛ وهو موضع اشتهر بورود الرماح إليه.
  - term: راغم
    text: ذليل مقهور؛ من الرغام وهو التراب، وأصل التعبير إلصاق الأنف بالرغام.
syntax:
  - «طريدة دهر» خبر لمبتدأ محذوف تقديره «هي»؛ أي القلعة طريدة دهر.
  - "الفاعل في «ساقها» هو الدهر المفهوم من الإضافة، والفاعل في «رددتها» ضمير المخاطب؛ فيتعاقب الفعلان بين خصمين: الدهر وسيف الدولة."
  - "جملة «والدهر راغم» حالية تثبت نتيجة الرد: وقع الفعل والدهر في حال ذل وقهر."
morphology:
  - «طريدة» على وزن فعيلة بمعنى المفعول؛ أي مطرودة، وهو بناء يلائم نقل القلعة من الجماد إلى كائن يُطارَد.
  - «الخطي» صفة منسوبة استعملت استعمال الاسم للرماح، فاختزلت أداة استعادة القلعة في لفظة واحدة ذات حمولة حربية.
  - «راغم» اسم فاعل من «رغم»، لكنه هنا يدل على حال المقهور؛ فالدهر شُخص خصمًا له هيئة وذلة.
rhetoric:
  thesis: يتجاوز المدح هنا حدود الواقعة العسكرية؛ فالمتنبي يحول التاريخ نفسه إلى خصم. القلعة طريدة، والدهر يطارد، وسيف الدولة يعكس اتجاه الحركة ويرد الطريدة إلى أهلها.
  devices:
    - title: تشخيص الدهر
      text: الدهر يسوق ويطارد ثم يُرغم. هذه الأفعال تمنحه إرادة الخصم، فيرتفع انتصار سيف الدولة من غلبة الروم إلى غلبة القوة التي تُنسب إليها تقلبات الأيام.
    - title: حركتان متعاكستان
      text: "«ساقها» ثم «فرددتها»: الفعل الأول يبعد القلعة، والثاني يعيدها. يقوم البيت على انعكاس اتجاه الحركة، وهو المعادل التركيبي لفكرة استرداد الثغر."
    - title: من الروم إلى الزمن
      text: "لم يعد العدو مذكورًا بالاسم؛ ذاب في «الدهر». هذا التوسيع يضخم الفعل المدحي: ما أصلحه الممدوح ليس خسارة عسكرية عابرة، بل أثرًا من آثار الزمان."
    - title: الختام بـ«راغم»
      text: "بعد سلسلة الأفعال لا يكتفي الشاعر بإعادة القلعة؛ يثبت حال الخصم في النهاية: الدهر نفسه ذليل. الكلمة الأخيرة تجعل نتيجة البيت انتصارًا معنويًا على الزمن."
  connection: "البيت الثاني عشر سيبني مباشرة على هذا التشخيص، فيستبدل «الدهر» بـ«الليالي» ويحوّل العلاقة معها إلى حساب أخذ وغرم: سيف الدولة يأخذ من الزمن ولا يرده، أما الزمن فإذا أخذ منه شيئًا فعليه أن يغرم."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: التتابع الحركي «ساقها / رددتها» يمنح البيت اتجاهين متعاكسين داخل الوزن نفسه، ثم تستقر الحركة عند قافية «راغم» التي تحسم الصراع.
context: بعد تصوير القلعة وجثث الأعداء ينتقل المتنبي إلى مستوى تجريدي أعلى، فيجعل استرداد الحدث مواجهة مع الدهر.
