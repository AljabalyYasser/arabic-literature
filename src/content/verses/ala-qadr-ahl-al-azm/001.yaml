first: عَلى قَدرِ أَهلِ العَزمِ تَأتي العَزائِمُ
second: وَتَأتي عَلى قَدرِ الكِرامِ المَكارِمُ
level: full
meaning: "يجعل المتنبي مقدار الفعل تابعًا لمقدار صاحبه: فكلما عظمت الهمة عظمت الأمور التي يعزم صاحبها عليها، وكلما عظم كرم الإنسان عظمت مكارمه. البيت ليس حكمة مستقلة فحسب؛ بل قاعدة سيبني عليها مدح سيف الدولة في الأبيات التالية."
vocabulary:
  - term: العزم
    text: قوة القصد والثبات على الأمر.
  - term: العزائم
    text: الأمور التي يُعزم عليها؛ أي الأعمال والمقاصد الكبيرة.
  - term: المكارم
    text: الأفعال والخصال التي يظهر بها الكرم والفضل.
syntax:
  - تقدّم شبه الجملة «على قدر أهل العزم» على الفعل «تأتي»، فصار معيار التناسب أول ما تستقبله الأذن.
  - "البناء النحوي في الشطرين متوازٍ: شبه جملة + فعل + فاعل، مع إعادة ترتيب يسيرة في الشطر الثاني تمنع الرتابة وتحفظ التوازي."
  - «العزائم» و«المكارم» فاعلان للفعل «تأتي»، وفي الإسناد حركة تجعل المعاني المجردة كأنها أشياء تقبل بحسب أقدار أصحابها.
morphology:
  - «العزائم» جمع «عزيمة»، وهي من مادة عزم؛ فالجمع يعيد معنى العزم في صورة الأعمال والقرارات التي تصدر عنه.
  - «المكارم» جمع «مكرمة»، من مادة كرم. اقتران «الكرام» بـ«المكارم» اشتقاقيًا يجعل الصفة في أصحابها كأنها تفيض إلى أفعالهم.
  - تجاور مادتي «عزم» و«كرم» في صيغ متقاربة جزء من إحكام البيت، وليس مجرد تشابه صوتي.
rhetoric:
  thesis: بلاغة البيت في أنه يحول المديح من ادعاء مباشر إلى قاعدة تبدو عامة ومحكمة، ثم يترك الأبيات التالية تثبت أن سيف الدولة هو المثال الذي تنطبق عليه.
  devices:
    - title: التقديم وبناء المعيار
      text: افتتاح الشطر بـ«على قدر» يضع فكرة القياس والتناسب في المركز. لو قيل «تأتي العزائم على قدر أهل العزم» لبقي المعنى، لكن قوة الافتتاح بوصفه قاعدة ستضعف.
    - title: الموازنة التركيبية
      text: «أهل العزم / العزائم» تقابلها «الكرام / المكارم». التوازي لا يزين الصوت فقط؛ بل يوحي بأننا أمام قانون له صورتان تؤكد إحداهما الأخرى.
    - title: الاشتقاق ووحدة الفكرة
      text: التقارب بين «العزم / العزائم» وبين «الكرام / المكارم» يجعل الصفة وأثرها متجاورين لفظًا ومعنى؛ كأن العزيمة ثمرة العزم، والمكرمة ثمرة الكرم.
    - title: صيغة الحكمة
      text: "لا يذكر سيف الدولة بعد. هذا التأخير مقصود بنائيًا: يثبت المعيار أولًا، ثم يقدّم الممدوح في البيت الثالث بوصفه برهانًا حيًا عليه."
  connection: "البيت الثاني سيضيف عنصرًا آخر إلى هذه القاعدة: ليست عظمة الفعل وحدها مرتبطة بعظمة صاحبه، بل حتى تقدير الأفعال يتغير باختلاف قدر الناظر إليها."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: الإيقاع الطويل المسترسل يلائم افتتاحًا تقريريا ذا نبرة عالية، بينما تكرار البنية النحوية داخل البيت يمنحه تماسكًا أشبه بصياغة المثل.
context: مطلع القصيدة. وظيفته تأسيس المعيار الذي ستُقاس به أفعال سيف الدولة في وقعة الحدث.
