first: تُفيتُ اللَيالي كُلَّ شَيءٍ أَخَذتَهُ
second: وَهُنَّ لِما يَأخُذنَ مِنكَ غَوارِمُ
level: full
meaning: "يبلغ المتنبي بالمبالغة حدًّا يجعل سيف الدولة أقوى من تقلبات الزمن: ما يأخذه هو من الليالي يجعلها تفقده ولا تستطيع استرداده، أما ما تأخذه الليالي منه فهي كالغارم الذي يلزمه أن يرده ويؤدي بدله."
vocabulary:
  - term: تفيت
    text: "من أفات الشيءَ: جعله يفوت صاحبه ولا يدركه. الفاعل هنا ضمير المخاطب؛ أي أنت يا سيف الدولة تجعل الليالي تفقد ما أخذته منها."
  - term: الليالي
    text: كناية عن الزمن وحوادثه وتقلباته.
  - term: غوارم
    text: جمع غارمة؛ أي مؤدية لما لزمها من غرم ودين.
syntax:
  - في القراءة المعتمدة «أخذته» بالتاء، ففاعل «تفيت» ضمير المخاطب، و«الليالي» مفعول أول، و«كل شيء» مفعول ثان؛ لأن «تفيت» هنا متعدية إلى مفعولين.
  - التاء في «أخذته» للمخاطب؛ أي الشيء الذي أخذته أنت من الليالي. والهاء تعود إلى «كل شيء».
  - «وهن» مبتدأ يعود إلى الليالي، و«غوارم» خبره؛ أما «لما يأخذن منك» فيبين ما يلزمهن غرمه لك.
  - "هذا الإعراب جزء من المعنى لا مسألة منفصلة عنه: إذا جعلت الليالي فاعلة في صدر البيت اختل تقابل الأخذ والغرم الذي يقوم عليه العجز."
morphology:
  - "«تفيت» مضارع «أفات»، وصيغة الإفعال تعدّي معنى الفوت إلى مفعول: تجعل غيرك يفوته الشيء."
  - «غوارم» جمع «غارمة» من الغرم، وهو أداء ما يلزم من دين أو تبعة؛ فالمعجم المالي يدخل في تصوير الصراع مع الزمن.
  - "الفعلان «أخذته / يأخذن» من مادة واحدة، لكن اختلاف الفاعل في كل موضع يقلب ميزان القوة: أخذ الممدوح ثابت له، وأخذ الليالي مردود عليها بالغرم."
rhetoric:
  thesis: "يبني البيت عالمًا مقلوبًا أمام الممدوح: الزمن الذي اعتاد الشعراء الشكوى من سلبه يصبح هو المدين، وسيف الدولة هو الطرف الذي يأخذ ولا يُسترد منه. المبالغة لا تقوم على وصف القوة فقط، بل على قلب قانون الزمن نفسه."
  devices:
    - title: تشخيص الليالي
      text: الليالي تأخذ وتغرم وتفقد ما أُخذ منها. تتحول الأيام إلى طرف في معاملة له حقوق وديون، فيستمر تشخيص الدهر الذي بدأ في البيت السابق لكن بصورة جديدة.
    - title: قلب العلاقة مع الزمن
      text: المألوف أن الزمن يسلب الإنسان ولا يعيد. هنا يصبح سيف الدولة هو الذي يسلب الزمن، فإذا سلبه الزمن شيئًا كان عليه أن يؤدي الغرم. هذه المفارقة هي مركز المدح.
    - title: تكرار الأخذ مع تبدل الفاعل
      text: «أخذته» ثم «يأخذن» يعيدان الفعل نفسه في اتجاهين متعاكسين. الأول قوة للممدوح، والثاني دين على الليالي؛ ومن هذا التناظر ينشأ إحكام الحجة.
    - title: النحو يحمي البلاغة
      text: الخلاف بين «أخذته» و«أخذنه» ليس شكليًا؛ فالقراءة بالتاء تجعل المخاطب فاعل الأخذ في الصدر وتحفظ انقلاب ميزان القوة. ولهذا شدد التبريزي وابن القطاع، كما ينقل البرقوقي، على فساد القراءة بالنون في المعنى والإعراب.
  connection: "بعد أن جعل إرادة سيف الدولة تتغلب على الدهر والليالي، ينتقل البيت التالي إلى صورة لغوية شديدة الذكاء: ما ينويه فعلًا مضارعًا يصير ماضيًا قبل أن تلحقه الجوازم، أي إن سرعة الإنجاز تسبق حتى منطق النحو."
prosody:
  meter: البحر الطويل
  rhyme: الروي ميم مضمومة
  note: "تكرار مادة «أخذ» بين الشطرين يربطهما صوتيًا ودلاليًا، بينما تأتي «غوارم» في القافية لتضع الحكم النهائي: الليالي هي الملزمة بالدفع."
context: "امتداد مباشر للبيت السابق: من إذلال الدهر عند استرداد القلعة إلى تصوير علاقة سيف الدولة بالزمن كله على أنها علاقة غلبة ودين."
variants:
  - reading: أخذته — بالتاء
    status: المعتمد هنا
    note: ينقل البرقوقي عن التبريزي وابن القطاع ترجيح هذه القراءة، ويروي ابن القطاع بسندٍ أن المتنبي صححها بنفسه لمن قرأ «أخذنه». وهي التي يستقيم معها أن يكون سيف الدولة فاعل الأخذ وأن تكون «الليالي» مفعولًا أول لـ«تفيت».
  - reading: أخذنه — بالنون
    status: رواية مردودة عند التبريزي وابن القطاع
    note: بحسب شرح البرقوقي، تجعل هذه القراءة الليالي فاعلة في موضع يفسد معه بناء المفعولين ويضعف التقابل مع قوله «وهن لما يأخذن منك غوارم».
