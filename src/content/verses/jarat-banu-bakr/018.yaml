first: فَاحْتَلَّ أَوْزَارَهُمُ أَزْرُهُ
second: بِرَأْيِ مَحْمُودٍ عَلَيْهِمْ شَفِيقْ
vocabulary:
- term: أَوْزَارَهُمُ
  text: 'أثقالهم؛ «وأوزار الحرب وغيرها: الأثقال والآلات» [@lisan، ج5 ص282].'
- term: أَزْرُهُ
  text: قوّته وظهره؛ «الأزر القوة، والأزر الظهر» [@lisan، ج4 ص18].
