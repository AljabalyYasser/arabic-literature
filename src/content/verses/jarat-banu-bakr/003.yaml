explained: false
first: جِنَايَةً لَمْ يَدْرِ مَا كُنْهُهَا
second: جَانٍ وَلَمْ يُصْبِحْ لَهَا بِالْخَلِيقْ
vocabulary:
- term: جِنَايَةً
  text: ذنبًا يُؤاخَذ به.
- term: كُنْهُهَا
  text: حقيقتها ومبلغها؛ و«كنه كل شيء قدره ونهايته وغايته» [@lisan، ج13 ص536].
- term: بِالْخَلِيقْ
  text: بالجدير، أي لم يكن أهلًا لها.
