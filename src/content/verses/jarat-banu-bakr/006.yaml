first: "مَنْ شَاءَ وَلَّى النَّفْسَ فِي مَهْمَهٍ"
second: "ضَنْكٍ وَلَكِنْ مَنْ لَهُ بِالْمَضِيقْ"
meaning: "من شاء ساق نفسه إلى مفازة ضيقة، ولكن من يضمن له الخروج من الضيق إذا دخله؟"
vocabulary:
  - term: "وَلَّى النَّفْسَ"
    text: "وجّهها وساقها."
  - term: "مَهْمَهٍ"
    text: "«المفازة البعيدة»، وقال الليث: «الفلاة بعينها لا ماء بها ولا أنيس» [@lisan، ج13 ص542]."
  - term: "ضَنْكٍ"
    text: "ضيّق."
  - term: "مَنْ لَهُ بِالْمَضِيقْ"
    text: "من يكفل له الخروج من الضيق؟"
syntax:
  - "«مَنْ» اسم شرط مبتدأ، و«شَاءَ» فعل الشرط ومفعوله محذوف: من شاء ذلك، و«وَلَّى» جواب الشرط."
  - "«ضَنْكٍ» نعت لـ«مَهْمَهٍ» في آخر الصدر، فالنعت في أول العَجُز، وهذا من اتصال الشطرين."
  - "«وَلَكِنْ مَنْ لَهُ بِالْمَضِيقْ»: «مَنْ» اسم استفهام مبتدأ، و«لَهُ» خبره، و«بِالْمَضِيقْ» متعلق بمحذوف: من يتكفل له بالمضيق؟ والاستفهام بمعنى النفي: لا أحد."
morphology:
  - "«مَهْمَه» جمعه «مَهامِه» [@lisan، ج13 ص542]."
  - "«الْمَضِيق» على «مَفْعِل» من «ضاق يضيق»، اسم للمكان الضيق."
  - "«ضَنْك» مصدر وُصف به، والوصف بالمصدر يدل على شدة الصفة، كأن المفازة هي الضيق نفسه."
rhetoric:
  thesis: "حكمة في بيت: الدخول في الشر سهل، والخروج منه هو الصعب. وهي هنا وعيد لقتلة كُلَيْب: دخلتم الحرب بأيديكم، فمن يخرجكم منها؟"
  devices:
    - title: "المقابلة بين «شاء» و«من له»"
      text: "صدر البيت إرادة مطلقة: «من شاء»، وعجزه عجز مطلق: «من له». وبين الإرادة والعَجُز تقع الحرب كلها."
    - title: "المفازة صورة للحرب"
      text: "لم يذكر الحرب، بل رسم مفازة ضيقة يدخلها المرء باختياره ولا يملك الخروج منها. فالسامع يفهم الحرب من الصورة."
    - title: "شاهد «أحد البغاة»"
      text: "روى ابن قُتَيْبة البيت بلفظ آخر: «من شاء دلّى النفس في هوّة»، فصارت البئر مكان المفازة، وجعله مع بيت «قل لبني حصن يردّونه» شاهدًا على أن المُهَلْهِل «أحد البغاة» [@ibn-qutayba، ج1 ص288–289]."
  connection: "ثم يأتي بصورة أخرى للمعنى نفسه: ركوب البحر مهلكة ما لم يكن له مخرج."
prosody:
  meter: "البحر السريع"
  rhyme: "الرَّوِيّ القاف الساكنة، فهي قافية مقيّدة"
  scansion: "مَنْشَاءَوَلْ / لَنْنَفْسَفِي / مَهْمَهِنْ = مستفعلن / مستفعلن / فاعلن — ضَنْكِنْوَلَا / كِنْمَنْلَهُو / بِلْمَضِيقْ = مستفعلن / مستفعلن / فاعلاتْ"
  note: "وزن السريع: «مستفعلن مستفعلن فاعلن» في الصدر [@atiq، ص86]. وضرب هذه القصيدة «فاعلاتْ» بسكون التاء، وهو الضرب «المطوي الموقوف» [@atiq، ص87–88]."
context: "من أول القصيدة، بعد أن يقول إن بني بَكْر جاروا ولم يعدلوا، ويخاطب «الجاني على قومه». والجمهرة وحدها تروي القصيدة كاملة [@jamhara، ص459]."
