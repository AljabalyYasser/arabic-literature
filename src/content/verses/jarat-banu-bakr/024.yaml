first: وَاسْتَسْعَرُوا مِنْ حَرْبِنَا مَأْتَمًا
second: أَثَابَهُمْ نِيرَانَ حَرْبٍ عَقُوقْ
vocabulary:
- term: اسْتَسْعَرُوا
  text: أوقدوا وأشعلوا.
- term: مَأْتَمًا
  text: جماعة يجتمعون في مصيبة؛ و«المأتم كل مجتمع من رجال أو نساء في حزن أو فرح» [@lisan، ج12 ص3].
- term: أَثَابَهُمْ
  text: جازاهم.
