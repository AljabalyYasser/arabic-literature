first: ذَاكَ وَقَدْ عَنَّ لَهُمْ عَارِضٌ
second: كَجُنْحِ لَيْلٍ فِي سَمَاءٍ بَرُوقْ
vocabulary:
- term: عَنَّ
  text: ظهر واعترض.
- term: عَارِضٌ
  text: سحاب يعترض في الأفق، يريد جيشًا كثيفًا.
- term: جُنْحِ لَيْلٍ
  text: طائفة من الليل.
- term: بَرُوقْ
  text: كثيرة البرق.
