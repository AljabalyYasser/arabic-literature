explained: false
first: تَلْمَعُ لَمْعَ الطَّيْرِ رَايَاتُهُ
second: عَلَى أَوَاذِي لُجِّ بَحْرٍ عَمِيقْ
vocabulary:
- term: لَمْعَ الطَّيْرِ
  text: خفقان الطير بأجنحتها، من «لمع الطائر بجناحيه إذا خفق بهما» [@lisan، ج8 ص327].
- term: أَوَاذِي
  text: أمواج؛ «الآذي موج البحر، والجمع الأواذي» [@lisan، ج14 ص27].
- term: لُجِّ
  text: معظم الماء.
