explained: false
first: حَلَّتْ رِكَابُ الْبَغْيِ فِي وَائِلٍ
second: فِي رَهْطِ جَسَّاسٍ ثِقَالِ الْوُسُوقْ
vocabulary:
- term: رِكَابُ
  text: «الإبل التي يسار عليها، واحدتها راحلة، ولا واحد لها من لفظها» [@lisan، ج1 ص430].
- term: وَائِلٍ
  text: أبو القبيلتين بَكْر وتَغْلِب.
- term: جَسَّاسٍ
  text: جسّاس بن مُرّة الشَّيْباني، أخو امرأة كُلَيْب [@iqd، ج6 ص70] وقاتلُه [@iqd، ج6 ص72].
- term: ثِقَالِ الْوُسُوقْ
  text: ثقال الأحمال، والوسوق جمع وَسْق؛ «والأصل في الوسق الحمل» [@lisan، ج10 ص379].
