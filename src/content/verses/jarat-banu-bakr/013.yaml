explained: false
first: وَجَمْعُ هَمْدَانَ لَهُ لَجْبَةٌ
second: وَرَايَةٌ تَهْوِي هُوِيَّ الْأَنُوقْ
vocabulary:
- term: لَجْبَةٌ
  text: 'جلبة وصياح، من «اللجب: الصوت والصياح والجلبة» [@lisan، ج1 ص735].'
- term: هُوِيَّ
  text: انقضاض وإسراع؛ «وهوى يهوي هويًّا إذا أسرع في السير» [@lisan، ج15 ص371].
- term: الْأَنُوقْ
  text: '«الرخمة، وقيل: ذكر الرخم» [@lisan، ج10 ص10].'
