first: كَمَنْ تَعَدَّى بَغْيُهُ قَوْمَهُ
second: طَارَ إِلَى رَبِّ اللِّوَاءِ الْخَفُوقْ
vocabulary:
- term: تَعَدَّى بَغْيُهُ قَوْمَهُ
  text: جاوزهم ظلمُه إلى غيرهم.
- term: رَبِّ اللِّوَاءِ
  text: صاحب الراية وقائد القوم.
- term: الْخَفُوقْ
  text: المضطرب الذي تحرّكه الريح.
