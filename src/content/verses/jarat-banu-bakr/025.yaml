explained: false
first: لَا يَرْقَأُ الدَّهْرَ لَهَا عَاتِكٌ
second: إِلَّا عَلَى أَنْفَاسِ نَجْلَا تَفُوقْ
vocabulary:
- term: يَرْقَأُ
  text: يسكن وينقطع، من رَقَأَ الدمُ إذا جفّ وانقطع.
- term: عَاتِكٌ
  text: 'يريد الدم فيما يظهر، من قولهم: «وأحمر عاتك: شديد الحمرة» [@lisan، ج10 ص464].'
- term: نَجْلَا
  text: نجلاء، أي طعنة واسعة؛ «وطعنة نجلاء أي واسعة بينة النجل» [@lisan، ج11 ص647].
- term: تَفُوقْ
  text: 'تشهق، من الفُواق؛ «ويقال للإنسان تشخص الريح في صدره: فاق يفوق فواقًا» [@lisan، ج10 ص320].'
