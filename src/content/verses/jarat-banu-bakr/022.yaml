first: "قُلْ لِبَنِي ذُهْلٍ يَرُدُّونَهُ"
second: "أَوْ يَصْبِرُوا لِلصَّيْلَمِ الْخَنْفَقِيقْ"
meaning: "قل لبني ذُهْل: عليهم أن يعيدوا إلينا كُلَيْبًا حيًّا، وإلا فليصبروا لداهية تستأصلهم."
vocabulary:
  - term: "بَنِي ذُهْلٍ"
    text: "من بَكْر بن وائِل، ومنهم جَسّاس قاتل كُلَيْب، فهو «جساس بن مرة بن ذهل بن شيبان» [@aghani، ج5 ص40]."
  - term: "يَرُدُّونَهُ"
    text: "يعيدونه حيًّا."
  - term: "الصَّيْلَمِ"
    text: "الداهية. قال ابن مَنْظُور: «والصيلم: الداهية لأنها تصطلم»، أي تستأصل [@lisan، ج12 ص340]."
  - term: "الْخَنْفَقِيقْ"
    text: "الداهية أيضًا [@ibn-qutayba، ج1 ص288، الحاشية]."
syntax:
  - "«قُلْ» فعل أمر، و«لِبَنِي ذُهْلٍ» متعلق به، وجملة «يَرُدُّونَهُ» مقول القول."
  - "«أَوْ يَصْبِرُوا»: الفعل منصوب بـ«أنْ» مضمرة بعد «أو» التي بمعنى «إلا»، ولذلك حُذفت نونه: يردّونه، إلا أن يصبروا."
  - "«لِلصَّيْلَمِ» متعلق بـ«يَصْبِرُوا»، و«الْخَنْفَقِيقْ» نعت له، وهما بمعنى واحد."
morphology:
  - "«الصَّيْلَم» على «فَيْعَل» من «صلم» إذا قطع واستأصل [@lisan، ج12 ص340]."
  - "«يَرُدُّونَهُ» مضارع «ردّ» المضعّف، والواو فاعل، والهاء تعود على كُلَيْب."
rhetoric:
  thesis: "بيت يطلب المستحيل عمدًا: أن يعيد القتلة كُلَيْبًا حيًّا. فالشرط الذي لا يُستطاع إعلان لحرب لا تنتهي."
  devices:
    - title: "التعجيز"
      text: "طلب منهم ما لا يقدرون عليه ليقول إن الصلح مستحيل. وهكذا فهمه ابن قُتَيْبة: «أمرهم أن يردوا كليبا وقد قتل، وأعلمهم أنه لا يرضى بشيء غير ذلك» [@ibn-qutayba، ج1 ص289]."
    - title: "«أحد البغاة»"
      text: "من أجل هذا البيت عدّ ابن قُتَيْبة المُهَلْهِل «أحد البغاة» [@ibn-qutayba، ج1 ص288]: رجل يطلب ثأرًا لا يرضيه شيء، فتطول الحرب بطلبه. وقارن هذا بقوله في رائيته: «كأنا غدوة وبني أبينا / بجنب عنيزة رحيا مدير»، حيث يسوّي بين الفريقين."
    - title: "لفظان لمعنى واحد"
      text: "«الصيلم الخنفقيق»: كلمتان للداهية، فتضاعف الوعيد بتضاعف اللفظ، ووقعت الثانية في القافية ثقيلة غريبة كالداهية نفسها."
  connection: "ثم يذكر ما صنعوا: سفكوا دمًا حرامًا، وانتهكوا حرمته."
prosody:
  meter: "البحر السريع"
  rhyme: "الرَّوِيّ القاف الساكنة، فهي قافية مقيّدة"
  scansion: "قُلْلِبَنِي / ذُهْلِنْيَرُدْ / دُونَهُو = مستعلن / مستفعلن / فاعلن — أَوْيَصْبِرُو / لِصْصَيْلَمِلْ / خَنْفَقِيقْ = مستفعلن / مستفعلن / فاعلاتْ"
  note: "دخل الطيّ «مستفعلن» الأولى فصارت «مستعلن»، والطي حذف الرابع الساكن [@atiq، ص87]. والضرب «فاعلاتْ» بسكون التاء، وهو المطوي الموقوف [@atiq، ص87–88]."
context: "من آخر القصيدة، بعد أن مدح كُلَيْبًا قائدًا يوم خَزازى. ويروي ابن قُتَيْبة البيت بلفظ «قل لبني حصن» [@ibn-qutayba، ج1 ص288]، وقال محققه أحمد شاكر إن في الجمهرة «لبني ذهل» [@ibn-qutayba، ج1 ص288، الحاشية]."
