explained: false
first: مُضْطَلِعًا بِالْأَمْرِ يَسْمُو لَهُ
second: فِي يَوْمِ لَا يَنْسَاغُ حَلْقٌ بِرِيقْ
vocabulary:
- term: مُضْطَلِعًا بِالْأَمْرِ
  text: قويًّا عليه؛ «فلان مضطلع بهذا الأمر أي قوي عليه» [@lisan، ج8 ص228].
- term: لَا يَنْسَاغُ حَلْقٌ بِرِيقْ
  text: 'لا يسهل على الحلق ابتلاع الريق من شدة الهول؛ من «ساغ الشراب في الحلق يسوغ سوغًا وسواغًا: سهل مدخله في الحلق» [@lisan، ج8 ص435].'
