first: إِذْ أَقْبَلَتْ حِمْيَرُ فِي جَمْعِهَا
second: وَمَذْحِجٌ كَالْعَارِضِ الْمُسْتَحِيقْ
vocabulary:
- term: حِمْيَرُ
  text: قبيلة من اليمن، وكذلك مذحج، وهمدان في البيت التالي.
- term: الْعَارِضِ
  text: «السحاب المطل يعترض في الأفق» [@lisan، ج7 ص174].
