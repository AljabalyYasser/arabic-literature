explained: false
first: "دَانٍ مُسِفٌّ فُوَيْقَ الأَرْضِ هَيْدَبُهُ"
second: "يَكَادُ يَدْفَعُهُ مَنْ قَامَ بِالرَّاحِ"
vocabulary:
  - term: "دَانٍ مُسِفٌّ"
    text: "قريب، أسفّ من الأرض أي دنا منها. يصف سحابًا. يقول محقق ابن قُتَيْبة: «المسف: الذى قد أسف على الأرض، أى: دنا منها» [@ibn-qutayba، ج1 ص203، الحاشية]."
  - term: "هَيْدَبُهُ"
    text: "«هَيْدَبِ السَّحابِ، وَهُوَ مَا تَدَلى مِنْ أَسافله إِلى الأَرض» [@lisan، ج1 ص781]."
  - term: "بِالرَّاحِ"
    text: "بالكفّ، جمع راحة. ويقول محقق ابن قُتَيْبة في البيت: «يقول: يكاد القائم يمسكه براحته» [@ibn-qutayba، ج1 ص203، الحاشية]."
