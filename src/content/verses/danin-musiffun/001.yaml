explained: false
first: "دَانٍ مُسِفٌّ فُوَيْقَ الأَرْضِ هَيْدَبُهُ"
second: "يَكَادُ يَدْفَعُهُ مَنْ قَامَ بِالرَّاحِ"
vocabulary:
  - term: "دَانٍ مُسِفٌّ"
    text: "قريب، أسفّ من الأرض أي دنا منها. يصف سحابًا."
  - term: "هَيْدَبُهُ"
    text: "«هَيْدَبِ السَّحابِ، وَهُوَ مَا تَدَلى مِنْ أَسافله إِلى الأَرض» [@lisan، ج1 ص781]."
  - term: "بِالرَّاحِ"
    text: "بالكفّ، جمع راحة."
