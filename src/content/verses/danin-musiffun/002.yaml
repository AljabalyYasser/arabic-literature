first: "كَأَنَّمَا بَيْنَ أَعْلَاهُ وَأَسْفَلِهِ"
second: "رَيْطٌ مُنَشَّرَةٌ أَوْ ضَوْءُ مِصْبَاحِ"
vocabulary:
  - term: "رَيْطٌ مُنَشَّرَةٌ"
    text: "مُلاءات بيضاء منشورة، جمع رَيْطة؛ يشبّه بها البرق في السحاب. ويقول أبو الفَرَج: «البيت الثانى من هذه الأبيات ليس من رواية ابن حبيب ولا الأصمعى» [@aghani-dk، ج11 ص71]."
