explained: false
first: "فَلَمْ أُفْسِدْ بَنِيكَ وَلَمْ أُقَرِّبْ"
second: "إِلَيْكَ مِنَ الْمُلِمَّاتِ الْكِبَارِ"
vocabulary:
  - term: "فَلَمْ أُفْسِدْ بَنِيكَ"
    text: "تصف نفسها بالعفاف وكرم الولادة: «لم ألد بنيك ذوي نقص وعاهة، وإنّما هم أشراف وفرسان» [@diwan-zuhayr، ص176]."
  - term: "الْمُلِمَّاتِ"
    text: "«ما ألمّ بالإنسان ممّا يكرهه، ويشقّ عليه» [@diwan-zuhayr، ص176]."
sources:
