first: يَجِدِ النِّسَاءَ حَوَاسِرًا يَنْدُبْنَهُ
second: يَبْكِينَ قَبْلَ تَبَلُّجِ الْأَسْحَارِ
vocabulary:
- term: يَنْدُبْنَهُ
  text: يبكينه ويعدّدن محاسنه.
- term: تَبَلُّجِ الْأَسْحَارِ
  text: 'إضاءة آخر الليل بطلوع الفجر. قال أبو الفَرَج: يندبنه في ذلك الوقت «لأنه وقت الغارة» [@aghani-dk، ج17 ص178].'
