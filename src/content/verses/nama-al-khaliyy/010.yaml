explained: false
first: وَمَسَاعِرًا صَدَأُ الْحَدِيدِ عَلَيْهِمُ
second: فَكَأَنَّمَا طُلِيَ الْوُجُوهُ بِقَارِ
vocabulary:
- term: مَسَاعِرًا
  text: '«جمع مسعر، وهو موقد نار الحرب» [@aghani-dk، ج17 ص197، الحاشية]؛ و«مِسْعَر الحرب: موقدها» [@lisan، ج4 ص365].'
- term: صَدَأُ الْحَدِيدِ
  text: وسخه، من طول لبس الدروع والمغافر.
- term: بِقَارِ
  text: 'القار: الزِّفت، وهو أسود.'
