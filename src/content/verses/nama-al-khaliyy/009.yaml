explained: false
first: وَمُجَنَّبَاتٍ مَا يَذُقْنَ عَذُوفَةً
second: يَقْذِفْنَ بِالْمُهَرَاتِ وَالْأَمْهَارِ
vocabulary:
- term: مُجَنَّبَاتٍ
  text: 'خيلًا تُقاد إلى جنب الإبل في الغزو؛ «المجنّبات: الخيل تُجنَّب إلى الإبل» [@lisan، ج5 ص185].'
- term: عَذُوفَةً
  text: 'شيئًا يؤكل. قال أبو الفَرَج: «العذوف والعدوف واحد، وهو ما أكلته» [@aghani-dk، ج17 ص197]؛ ويقال: «ما ذاق عدفًا ولا عدوفًا ... أي شيئًا، والذال المعجمة في كل ذلك لغة» [@lisan، ج9 ص235].'
- term: بِالْمُهَرَاتِ وَالْأَمْهَارِ
  text: 'المُهْر: ولد الفرس، والأنثى مُهْرة، وجمعها مُهَرات [@lisan، ج5 ص185]؛ أي تُلقي الحوامل منها أولادها إناثًا وذكورًا من شدة السير.'
