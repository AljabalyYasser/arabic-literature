second: تَرْجُو النِّسَاءُ عَوَاقِبَ الْأَطْهَارِ
vocabulary:
- term: عَوَاقِبَ الْأَطْهَارِ
  text: 'ما بعد طُهر المرأة من حيضها، أي أن يقربهن أزواجهن. وفي الخبر أن امرأته كانت قد طهرت تلك الليلة فدنت منه، فقال: «إليكِ! قد حدث أمر» [@aghani-dk، ج17 ص196].'
