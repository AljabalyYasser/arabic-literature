first: "أَفَبَعْدَ مَقْتَلِ مَالِكِ بْنِ زُهَيْرٍ"
second: "تَرْجُو النِّسَاءُ عَوَاقِبَ الْأَطْهَارِ"
meaning: "أبعد أن قُتل مالك بن زُهَيْر تنتظر النساء أن يأتيهن أزواجهن إذا طهرن من الحيض؟ لا، فقد شُغل الرجال بالحرب والثأر عن نسائهم."
vocabulary:
  - term: "عَوَاقِبَ الْأَطْهَارِ"
    text: "ما يعقب طُهر المرأة من حيضها، وهو أن يجامعها زوجها. فالعرب تأتي النساء في أطهارهن، و«النساء إنما يؤتين في أطهارهن لا في حيضهن» كما في «لسان العرب» [@lisan، ج1 ص131]. وفي الخبر أن امرأة الرَّبِيع كانت قد طهرت تلك الليلة فدنت منه، فقال: «إليكِ! قد حدث أمر» [@aghani-dk، ج17 ص196]."
  - term: "تَرْجُو"
    text: "تنتظر وتأمل."
context: "قلب القصيدة، وفيه خبرها كله: يروي أبو الفَرَج عن أبي عُبَيْدة أن حُذَيْفة بن بدر أرسل جارية تنظر ما يصنع الرَّبِيع ليلة بلغه مقتل مالك، فرأته يهزّ رمحه ثم يضطجع، «وكانت قد طهرت تلك الليلة، فدنت منه، فقال: إليك! قد حدث أمر»، ثم قال القصيدة [@aghani-dk، ج17 ص196]. فالبيت جواب لامرأته قبل أن يكون حكمًا على النساء جميعًا. وهو في «النَّقائِض» بلفظه [@naqaid، ج1 ص255]، وفي «الحماسة» البيت الثالث [@tabrizi-hamasa، ج1 ص412]. وكان من شأن العرب أن يهجر الرجل النساء حتى يدرك ثأره. وفي معناه قول النابغة «والمحصنات عوازب الأطهار»، يقول صاحب اللسان: «يريد أنهم آثروا الغزو على أطهار نسائهم» [@lisan، ج1 ص598]."
syntax:
  - "«أَفَبَعْدَ»: الهمزة للاستفهام الإنكاري، والفاء عاطفة على ما سبق، وتأخرت عن الهمزة لأن للهمزة الصدارة. و«بعدَ» ظرف متعلق بـ«ترجو» مقدَّم عليه."
  - "«مَقْتَلِ» مضاف إليه، و«مالكِ» مضاف إليه، و«بنِ» صفة لمالك، و«زهيرٍ» مضاف إليه."
  - "«تَرْجُو النِّسَاءُ عَوَاقِبَ الْأَطْهَارِ»: فعل مضارع، و«النساءُ» فاعل، و«عواقبَ» مفعول به، و«الأطهارِ» مضاف إليه."
morphology:
  - "«مَقْتَل» مصدر ميمي على «مَفْعَل» من «قتل»، بمعنى القتل."
  - "«عَوَاقِب» جمع «عاقبة» على «فواعل»، و«الأطهار» جمع «طُهْر» على «أفعال»."
  - "«ابن» تُحذف همزته في الخط إذا وقع بين علمين صفة للأول، كما في «مالكِ بنِ زهير»."
rhetoric:
  thesis: "إعلان الحرب بلغة البيت: لا قرب من النساء بعد مالك."
  devices:
    - title: "الاستفهام الإنكاري"
      text: "«أَفَبَعْدَ ... تَرْجُو» سؤال لا يطلب جوابًا، بل ينكر أن يكون للنساء رجاء بعد هذا القتل. فالجواب معروف: لا، والحرب أولى."
    - title: "الكناية في «عواقب الأطهار»"
      text: "لم يذكر الجماع باسمه، بل ذكر ما يتلوه في الوجود: طهر المرأة من حيضها، ثم ما يعقبه. وهذا ما يسمّيه عبد القاهر كناية: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. والمعنى المكنيّ عنه: لن يقرب الرجال نساءهم حتى يدركوا ثأر مالك."
    - title: "تقديم الظرف"
      text: "قدّم «بَعْدَ مَقْتَلِ مَالِكِ بْنِ زُهَيْرٍ» على الفعل، لأن القتل هو الأمر الذي يُبنى عليه كل شيء، فجاء أولًا. يقول عبد القاهر في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]. وذكر اسم القتيل كاملًا بنسبه يزيد الفاجعة ثقلًا."
  connection: "ثم يقول إن العاقل لا يرى بعد قتله إلا الحرب: «ما إن أرى في قتله لذوي الحجا / إلا المطيّ تُشدّ بالأكوار»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الراء المكسورة، يتبعها وصل بالياء"
  scansion: "أَفَبَعْدَ مَقْ / تَلِ مَالِكِبْ / نِ زُهَيْرِنْ = متَفاعلن / متَفاعلن / متَفاعلْ — تَرْجُنْنِسَا / ءُ عَوَاقِبَلْ / أَطْهَارِي = متْفاعلن / متَفاعلن / متْفاعلْ"
  note: "في العَروض عيب: عروض الكامل التام تأتي «متفاعلن» تامة، وهي هنا «متفاعلْ»، نقص آخرها حرف. وهذا ما يسمّيه بعض الرواة إقواء، يقول ابن قُتَيْبة: «سمّى إقواء لأنّه نقص من عروضه قوّة»، ثم يذكر هذا البيت ويقول: «ولو كان «بن زهيرة» لاستوى البيت» [@ibn-qutayba، ج1 ص97]. ويسمّيه الخليل «المقعد»، وفي اللسان: «والمقعد من الشعر: ما نقصت من عروضه قوة» [@lisan، ج3 ص363]، وفي حاشية محققي «الأغاني»: «فى هذا الشطر عيب يسمى القطع» [@aghani-dk، ج17 ص196، الحاشية]. وفي أول العجز الإضمار «متْفاعلن»، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، والضرب مقطوع مضمر «متْفاعلْ» كسائر القصيدة."
