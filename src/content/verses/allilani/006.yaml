first: وَفَتًى يَضْرِبُ الْكَتِيبَةَ بِالسَّيْـ
second: ـفِ إِذَا كَانَتِ السُّيُوفُ عِصِيَّا
vocabulary:
- term: الْكَتِيبَةَ
  text: الجماعة من الجيش.
- term: إِذَا كَانَتِ السُّيُوفُ عِصِيَّا
  text: 'إذا صار الناس يضربون بالسيوف كما يضربون بالعصيّ؛ قال الجاحظ: «ويقولون إعتصى بالسيف، إذا جعل السيف عصاه» [@bayan، ج3 ص53].'
