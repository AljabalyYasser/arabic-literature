first: أَبْلِغِ الْحَارِثَ بْنَ ظَالِمٍ الرِّعْـ
second: ـدِيدَ وَالنَّاذِرَ النُّذُورَ عَلَيَّا
vocabulary:
- term: الرِّعْدِيدَ
  text: 'الجبان الذي يرتعد خوفًا. وفي رواية سِيبَوَيْه: المُوعِدَ، أي الذي يتوعّد [@sibawayh، ج3 ص129].'
- term: النَّاذِرَ النُّذُورَ عَلَيَّا
  text: الذي نذر أن يقتلني.
