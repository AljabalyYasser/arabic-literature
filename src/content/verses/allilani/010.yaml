first: أَنَّمَا يَقْتُلُ النِّيَامَ وَلَا يَقْـ
second: ـتُلُ يَقْظَانَ ذَا سِلَاحٍ كَمِيَّا
vocabulary:
- term: أَنَّمَا يَقْتُلُ
  text: في كتاب سِيبَوَيْه «أنما تقتل» بتاء الخطاب [@aghani-dk، ج11 ص121، الحاشية].
- term: كَمِيَّا
  text: '«الكمي: الشجاع المتكمي في سلاحه، لأنه كمى نفسه أي سترها بالدرع والبيضة» [@aghani-dk، ج11 ص121، الحاشية].'
