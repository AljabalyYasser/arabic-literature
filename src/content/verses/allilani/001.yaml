first: عَلِّلَانِي وَعَلِّلَا صَاحِبِيَّا
second: وَاسْقِيَانِي مِنَ الْمُرَوَّقِ رِيَّا
vocabulary:
- term: عَلِّلَانِي
  text: اسقياني مرة بعد مرة، والخطاب لاثنين على عادة العرب.
- term: صَاحِبِيَّا
  text: صاحبَيَّ، مثنى صاحب، وزيدت الألف للقافية.
- term: الْمُرَوَّقِ
  text: '«المروق من الشراب: المصفى» [@aghani-dk، ج11 ص121، الحاشية].'
