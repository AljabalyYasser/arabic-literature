first: مِنْ سُمُوطِ الْمَرْجَانِ فُصِّلَ بِالشَّذْ
second: رِ فَأَحْسِنْ بِحَلْيِهِنَّ حُلِيَّا
vocabulary:
- term: فُصِّلَ بِالشَّذْرِ
  text: فُرّق بين حبّاته بالشَّذْر، وهو قطع صغار من الذهب أو الخرز.
- term: فَأَحْسِنْ بِحَلْيِهِنَّ
  text: ما أحسن حليهنّ! صيغة تعجب.
