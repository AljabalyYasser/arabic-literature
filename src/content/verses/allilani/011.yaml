explained: false
first: وَمَعِي شِكَّتِي مَعَابِلُ كَالْجَمْـ
second: ـرِ وَأَعْدَدْتُ صَارِمًا مَشْرَفِيَّا
vocabulary:
- term: شِكَّتِي
  text: '«والشكة: السلاح» [@aghani-dk، ج11 ص122، الحاشية].'
- term: مَعَابِلُ
  text: «جمع معبلة (بكسر الميم) وهي نصل طويل عريض» [@aghani-dk، ج11 ص122، الحاشية].
- term: صَارِمًا مَشْرَفِيَّا
  text: 'سيفًا قاطعًا؛ «والمشرفي من السيوف: المنسوب إلى المشارف، وهي قرى من أرض اليمن، وقيل من بلاد العرب تدنو من الريف» [@aghani-dk، ج11 ص122، الحاشية].'
