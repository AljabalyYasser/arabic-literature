first: "أَنْتَ الْأَمِينُ الَّذِي مِنْ بَعْدِ صَاحِبِهِ"
second: "أَلْقَتْ إِلَيْكَ مَقَالِيدَ النُّهَى الْبَشَرُ"
vocabulary:
