first: "لَمْ يُؤْثِرُوكَ بِهَا إِذْ قَدَّمُوكَ لَهَا"
second: "لَكِنْ لِأَنْفُسِهِمْ كَانَتْ بِهَا الْأُثَرُ"
vocabulary:
