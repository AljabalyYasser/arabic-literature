first: "وَلَا تَرِدُوا إِلَّا فُضُولَ نِسَائِكُمْ"
second: "إِذَا ارْتَمَلَتْ أَعْقَابُهُنَّ مِنَ الدَّمِ"
meaning: "إن قبلتم الدية فلا تأتوا الماء إلا بعد نسائكم، فتشربوا ما فضل منهن، وقد جئن الماء يغسلن عنهن دم الحيض الذي سال حتى لطّخ أعقابهن. يفسّر القالِيّ «ارتملت» بقوله: «التطخت يعني إذا حضن» [@qali، ج2 ص226]. فهي تضع الرجال الذين يأخذون الدية دون النساء الحُيَّض: يأتون الماء آخر الناس، ويشربون فضلة الماء الذي غسلت فيه النساء دم حيضهن. وهذا أقسى ما تعيّر به امرأةٌ رجال قومها."
vocabulary:
  - term: "تَرِدُوا"
    text: "تأتوا الماء لتشربوا."
  - term: "فُضُولَ نِسَائِكُمْ"
    text: "ما يبقى من الماء بعد أن يرده نساؤكم."
  - term: "ارْتَمَلَتْ"
    text: "تلطخت بالدم، وفي اللسان: «رمله بالدم فترمل وارتمل أي تلطخ» [@lisan، ج11 ص295]. ويقول القالِيّ: «التطخت يعني إذا حضن» [@qali، ج2 ص226]."
  - term: "أَعْقَابُهُنَّ"
    text: "مؤخّر أقدامهن. تريد أن دم الحيض سال على سيقانهن حتى بلغ أعقابهن."
context: "خاتمة القطعة. بعد أن قالت «فمشّوا بآذان النعام المصلّم»، تبلغ بالتعيير غايته، فتنزل الرجال الذين يقبلون الدية دون النساء. وهي في خبرها تريد أن تحمل أخاها عَمْرًا على الثأر، فأغار على بني مازِن بعد قولها، كما في حكاية [«كبشة وعَمْرو»](/stories/kabsha-wa-amr/)."
syntax:
  - "«لا» ناهية، و«تردوا» فعل مضارع مجزوم بحذف النون، والواو فاعل."
  - "«إلا» أداة حصر، و«فضولَ» مفعول به، و«نسائكم» مضاف إليه."
  - "«إذا» ظرف لما يُستقبل متضمن معنى الشرط، وجملة «ارتملت أعقابهن» في محل جر بالإضافة، وجوابه محذوف يدل عليه ما قبله."
  - "«من الدم» متعلق بـ«ارتملت»."
morphology:
  - "«ارتملت» على «افتعلت» من «رَمَل»، أي تلطّخت."
  - "«فضول» جمع «فَضْل»، وهو الزيادة والبقية."
  - "«أعقاب» جمع «عَقِب» على «أفعال»."
rhetoric:
  thesis: "أقسى صور التعيير: الرجل الذي يقبل الدية يصير دون النساء الحُيَّض."
  devices:
    - title: "الكناية في «إلا فضولَ نسائكم»"
      text: "كناية عن الذل. فالرجال كانوا يردون الماء أولًا، والنساء بعدهم؛ فمن تأخر حتى يشرب فضلة النساء فقد صار في أدنى منزلة. ولم تقل «أنتم أذلاء»، بل ذكرت ما يلزم عنه الذل، وهذا معنى الكناية عند عبد القاهر: «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "التصريح في «إذا ارتملت أعقابهن من الدم»"
      text: "تذكر دم الحيض صريحًا، وهو مما يُستقذر، لتبلغ بالتعيير أقصاه: لا يكفي أن يتأخروا عن النساء، بل عن النساء في أقذر أحوالهن. والتصريح هنا مقصود، ولا يُفهم البيت إلا به."
    - title: "النهي على سبيل التهكم"
      text: "«ولا تردوا» نهي في الظاهر، وهو في المعنى تهكم وتحريض: هي لا تريد أن يفعلوا ذلك، بل أن يأنفوا منه فيثأروا. وكذلك «فمشّوا» في البيت قبله."
  connection: "آخر القطعة."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "وَلَاتَ / رِدُوإِلْلَا / فُضُولَ / نِسَائِكُمْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — إِذَرْتَ / مَلَتْ أَعْقَا / بُهُنْنَ / مِنَدْدَمِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "وزن الطويل «فعولن مفاعيلن فعولن مفاعلن» في كل شطر، والعَرُوض والضرب مقبوضتان «مفاعلن» كما يلزم في الطويل [@atiq، ص29]. ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» الأولى والثالثة في الشطرين فصارت «فعولُ» [@atiq، ص29]."
