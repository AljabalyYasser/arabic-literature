explained: false
first: "وَأَرْسَلَ عَبْدُ اللَّهِ إِذْ حَانَ يَوْمُهُ"
second: "إِلَى قَوْمِهِ لَا تَعْقِلُوا لَهُمُ دَمِي"
vocabulary:
  - term: "حَانَ يَوْمُهُ"
    text: "حضر موته."
  - term: "لَا تَعْقِلُوا لَهُمُ دَمِي"
    text: "لا تأخذوا منهم العَقْل، وهو الدية، بدل دمي. وهي تتكلم على لسان أخيها المقتول."
sources:
