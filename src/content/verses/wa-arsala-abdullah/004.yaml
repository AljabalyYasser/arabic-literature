explained: false
first: "فَإِنْ أَنْتُمُ لَمْ تَثْأَرُوا وَاتَّدَيْتُمُ"
second: "فَمَشُّوا بِآذَانِ النَّعَامِ المُصَلَّمِ"
vocabulary:
  - term: "اتَّدَيْتُمُ"
    text: "قبلتم الدية."
  - term: "فَمَشُّوا"
    text: "امشوا، والتضعيف للتكثير."
  - term: "النَّعَامِ المُصَلَّمِ"
    text: "المصلَّم: المقطوع الأذنين، والنعام لا آذان ظاهرة لها. أي امشوا أذلّاء كأن آذانكم مجدوعة."
sources:
  - source: "tabrizi-hamasa"
    loc: "ج1 ص72"
    url: "https://shamela.ws/book/6907/71"
