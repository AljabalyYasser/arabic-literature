explained: false
first: "وَدَعْ عَنْكَ عَمْرًا إِنَّ عَمْرًا مُسَالِمٌ"
second: "وَهَلْ بَطْنُ عَمْرٍو غَيْرُ شِبْرٍ لِمَطْعَمِ"
vocabulary:
  - term: "مُسَالِمٌ"
    text: "يريد الصلح ويقبل الدية."
  - term: "شِبْرٍ لِمَطْعَمِ"
    text: "بطنه شبر يملؤه قليل الطعام، فما حاجته إلى إبل الدية؟"
