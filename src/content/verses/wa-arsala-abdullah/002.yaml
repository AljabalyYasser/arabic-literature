explained: false
first: "وَلَا تَأْخُذُوا مِنْهُمْ إِفَالًا وَأَبْكُرًا"
second: "وَأُتْرَكَ فِي بَيْتٍ بِصَعْدَةَ مُظْلِمِ"
vocabulary:
  - term: "إِفَالًا"
    text: "«جمع أفيل وهي صغار أولاد الإبل» [@qali، ج2 ص226]."
  - term: "أَبْكُرًا"
    text: "جمع بَكْر، وهو الفتيّ من الإبل. تحقّر الدية فتجعلها صغار الإبل."
  - term: "بَيْتٍ بِصَعْدَةَ مُظْلِمِ"
    text: "القبر، في موضع يقال له صَعْدة؛ تجعله مظلمًا لأن صاحبه لم يُثأر له."
sources:
