first: "كَأَنَّ مَزَاحِفَ الْحَيَّاتِ فِيهِ"
second: "قُبَيْلَ الصُّبْحِ آثَارُ السِّيَاطِ"
meaning: "كأن آثار زحف الحيات عند هذا الماء، قبيل الفجر، آثار السياط على الجلد. أي إن الحيات تأتي الماء ليلًا، فتترك على الطين خطوطًا ملتوية متقاطعة تشبه ما تتركه السياط من خطوط على ظهر المضروب. وفي «لسان العرب»: «ومَزَاحِفُ الحَيّاتِ: آثَارُ انْسِيابها ومَواضعُ مَدَبِّها» [@lisan، ج9 ص130]. ويقول الشرح المطبوع مع القصيدة: «هذا بيت القصيدة، ما أحسن ما وصف» [@sukkari-hudhaliyyin، ص1273]. و«قبيل الصبح» يجعل الصورة في أول الضوء، حين تُرى الآثار ولم تمحها الأقدام بعد."
vocabulary:
  - term: "مَزَاحِفَ الْحَيَّاتِ"
    text: "«آثَارُ انْسِيابها ومَواضعُ مَدَبِّها» [@lisan، ج9 ص130]."
  - term: "السِّيَاطِ"
    text: "جمع سَوْط."
context: "من مشهد الماء المهجور (25–32)، وهو مع البيت 25 ما ينشده ابن قُتَيْبة بعد حكم الأصمعي في الطائية [@ibn-qutayba، ج2 ص647]، وينشده صاحب «لسان العرب» شاهدًا للمزاحف [@lisan، ج9 ص130]. وقبله البعوض حول الماء، وبعده شربه منه وسيفه معه."
syntax:
  - "«كَأَنَّ مَزَاحِفَ الْحَيَّاتِ»: «كأن» حرف تشبيه ونصب، و«مزاحفَ» اسمها منصوب، و«الحيات» مضاف إليه."
  - "«فِيهِ»: جار ومجرور متعلق بمحذوف حال من المزاحف، والضمير للماء."
  - "«قُبَيْلَ الصُّبْحِ»: ظرف زمان منصوب متعلق بمحذوف حال، و«الصبح» مضاف إليه."
  - "«آثَارُ السِّيَاطِ»: «آثار» خبر كأن مرفوع، و«السياط» مضاف إليه."
morphology:
  - "«مَزَاحِف» جمع «مَزْحَف» على «مفاعل»، اسم مكان أو مصدر ميمي من «زحف»."
  - "«قُبَيْل» تصغير «قَبْل» على «فُعَيْل»، والتصغير هنا للتقريب: قبيل الصبح بقليل."
  - "«السِّيَاط» جمع «سَوْط» على «فِعال»، قُلبت الواو ياءً لانكسار ما قبلها."
rhetoric:
  thesis: "يرسم آثار الحيات حول الماء قبيل الفجر كأنها آثار سياط، فيدلّ على وحشة المكان وعلى أنه رآه بعينه."
  devices:
    - title: "التشبيه في «كَأَنَّ مَزَاحِفَ الْحَيَّاتِ ... آثَارُ السِّيَاطِ»"
      text: "شبّه أثرًا بأثر: خطوط ملتوية على الطين بخطوط السياط على الجلد. والوجه هيئة تُرى بالعين، فهو من الضرب الذي يكون عند عبد القاهر «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]. ومن جودته أن المشبّه أثر حركة غابت، وكذلك المشبّه به."
    - title: "التصغير في «قُبَيْلَ الصُّبْحِ»"
      text: "حدد الساعة بدقة: قبل الفجر بقليل، حين تُرى الآثار ولم تُطمس، فصار البيت شهادة من رآها في ساعتها. وهذه قراءتنا."
  connection: "ثم يقول: «شَرِبْتُ بِجَمِّهِ وَصَدَرْتُ عَنْهُ / وَأَبْيَضُ صَارِمٌ ذَكَرٌ إِبَاطِي»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الطاء المكسورة، والقافية مطلقة بالياء"
  scansion: "كَأَنْنَ مَزَا / حِفَلْحَيْيَا / تِ فِيهِي = مفاعَلَتن / مفاعَلْتن / فعولن — قُبَيْلَصْصُبْ / حِ آثَارُسْ / سِيَاطِي = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن»، والعروض والضرب «فعولن» مقطوفتان [@atiq، ص54]. ودخل العَصْب، وهو «تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، الثانية من الصدر والأوليين من العجز."
