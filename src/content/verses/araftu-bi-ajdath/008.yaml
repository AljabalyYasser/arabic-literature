first: "أَبِيتُ عَلَى مَعَارِيَ فَاخِرَاتٍ"
second: "بِهِنَّ مُلَوَّبٌ كَدَمِ الْعِبَاطِ"
meaning: "أبيت ليلي على أجساد عارية فاخرة، عليها طيب أحمر كدم الذبائح الصحيحة. أي يقضي الليل مع النساء يتمتع بأجسادهن المكشوفة المطلية بالطيب. يقول الشرح المطبوع مع القصيدة: «يقول: أبيت أتعلل «بمعاريها»، والواحد «معرى»، وهو مثل قولك: «بت ليلتي في اللهو»، تريد: على اللهو» [@sukkari-hudhaliyyin، ص1268]. والتعلّل بالمرأة في «لسان العرب» اللهو بها [@lisan، ج11 ص470]. والمعاري ما يتعرّى من الجسد، ويذكر صاحب اللسان عن ابن سيده: «والمَعَارِي الفُرُش، وَقِيلَ: إنَّ الشَّاعِرَ عَناها، وَقِيلَ: عَنى أَجْزاءَ جِسْمِها» [@lisan، ج15 ص47]. فعلى القول الأول يبيت على فرش فاخرة، وعلى الثاني يبيت على أجساد النساء العارية، وتشبيه الطيب بالدم يرجّح الأجساد، لأن الطيب يكون على الجلد. والملوّب الملطّخ بالملاب، وهو ضرب من الطيب أحمر كالخلوق، وحمرته على البشرة كدم الذبيحة الصافي."
vocabulary:
  - term: "مَعَارِيَ"
    text: "جمع مَعْرًى، وهو ما يتعرّى من الجسد، والشرح يقول: «والواحد «معرى»» [@sukkari-hudhaliyyin، ص1268]. وفي «لسان العرب»: «ومَعَارِي الْمَرْأَةِ: مَا لَا بُدَّ لَهَا مِنْ إظْهاره» [@lisan، ج15 ص47]."
  - term: "مُلَوَّبٌ"
    text: "في الشرح: «الملوّب»، الملاب [@sukkari-hudhaliyyin، ص1268]. وفي «لسان العرب»: «وشيءٌ مُلَوَّبٌ أَي مُلَطَّخٌ بِهِ»، و«والمَلابُ: ضَرْبٌ مِنَ الطِّيبِ، فَارِسِيٌّ؛ زَادَ الْجَوْهَرِيُّ: كالخَلُوقِ» [@lisan، ج1 ص746]."
  - term: "الْعِبَاطِ"
    text: "«جماعة العبيط، و«العبيط»، ما ذبح أو نحر من غير مرض، فدمه صاف» [@sukkari-hudhaliyyin، ص1268]."
context: "من أبيات اللهو (6–12)، بعد أن ذكر نساء لها بهن في شبابه. وبعده أن الناس يسمّونهن «ظِبَاءُ تَبَالَةَ»، ثم الخمر. والبيت غزل حسي صريح في مبيت الرجل مع النساء على أجسادهن، فنشرحه شرحًا تامًّا."
syntax:
  - "«أَبِيتُ عَلَى مَعَارِيَ»: «أبيت» فعل مضارع تام بمعنى أقضي الليل، وفاعله ضمير المتكلم، و«على معاريَ» جار ومجرور متعلق به، وعلامة جر «معاري» الفتحة لأنه ممنوع من الصرف."
  - "«فَاخِرَاتٍ»: صفة لمعاري مجرورة بالكسرة."
  - "«بِهِنَّ مُلَوَّبٌ»: «بهن» جار ومجرور خبر مقدم، و«ملوّبٌ» مبتدأ مؤخر، والجملة في محل جر صفة ثانية لمعاري."
  - "«كَدَمِ الْعِبَاطِ»: جار ومجرور متعلق بمحذوف صفة لملوّب، و«العباط» مضاف إليه."
morphology:
  - "«مَعَارِي» جمع «مَعْرًى» على «مفاعل»، من العُرْي."
  - "«مُلَوَّب» اسم مفعول من «لوّب» على «مُفَعَّل»، أي مطليّ بالملاب."
  - "«العِبَاط» جمع «عَبِيط» على «فِعال»."
  - "«فَاخِرَات» جمع مؤنث سالم لـ«فاخرة» اسم فاعل."
rhetoric:
  thesis: "صورة حسية صريحة لليالي اللهو: أجساد النساء عارية، وعليها طيب أحمر."
  devices:
    - title: "التشبيه في «كَدَمِ الْعِبَاطِ»"
      text: "شبّه حمرة الطيب على الأجساد بدم الذبيحة التي نُحرت صحيحة فدمها صاف. ووجه الشبه اللون، وهو من الضرب الذي يكون عند عبد القاهر «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "الدم في الغزل"
      text: "صورة الدم في وسط اللهو تسبق ما سيأتي في القصيدة من الضرب «فِي الْجَمَاجِمِ» والطعن. فالشاعر نفسه الذي يبيت على المعاري يشبّه طيبها بدم الذبائح. وهذه قراءتنا."
  connection: "ثم يقول إن الناس يصفونهن: «يُقَالُ لَهُنَّ مِنْ كَرَمٍ وَحُسْنٍ / ظِبَاءُ تَبَالَةَ الْأُدْمُ الْعَوَاطِي»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الطاء المكسورة، والقافية مطلقة بالياء"
  scansion: "أَبِيتُ عَلَى / مَعَارِيَ فَا / خِرَاتِنْ = مفاعَلَتن / مفاعَلَتن / فعولن — بِهِنْنَ مُلَوْ / وَبُنْ كَدَمِلْ / عِبَاطِي = مفاعَلَتن / مفاعَلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن»، والعروض والضرب «فعولن» مقطوفتان [@atiq، ص54]. وفتح الياء في «معاريَ» وهو مجرور ضرورة، يقول صاحب اللسان: «فإنما نصب الياء لأنه أجراها مجرى الحرف الصحيح في ضرورة الشعر، ولم ينون لأنه لا ينصرف، ولو قال معار لم ينكسر البيت ولكنه فر من الزحاف» [@lisan، ج15 ص47]، أي لو قال «معارٍ» لصارت التفعيلة معصوبة، وبقيت موزونة."
