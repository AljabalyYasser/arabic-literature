first: "وَوَجْهٍ قَدْ طَرَقْتُ أُمَيْمَ صَافٍ"
second: "أَسِيلٍ غَيْرِ جَهْمٍ ذِي حَطَاطِ"
meaning: "ورُبّ وجه يا أميمة أتيته ليلًا، صافي البشرة، أسيل الخد، ليس غليظًا ولا فيه بثور. يعني امرأة طرقها، أي جاءها ليلًا خفية عشيقًا، فذكر وجهها وأراد صاحبته. والشرح المطبوع مع القصيدة يفسّر صفاته: صافٍ يريد صافي البشرة، والأسيل السهل الذي «لم يكثر لحمه حتى يتبثر»، و«الحطاط» البثر [@sukkari-hudhaliyyin، ص1270–1271]. فهو يعدّ على أميمة التي أعرضت عنه امرأة جميلة استقبلته ليلًا."
vocabulary:
  - term: "طَرَقْتُ"
    text: "أتيت ليلًا، وهو إتيان العاشق خفية."
  - term: "أَسِيلٍ"
    text: "سهل «لم يكثر لحمه حتى يتبثر» [@sukkari-hudhaliyyin، ص1270–1271]."
  - term: "حَطَاطِ"
    text: "البثر [@sukkari-hudhaliyyin، ص1271]."
  - term: "جَهْمٍ"
    text: "الغليظ الكريه، وقد نفاه عن الوجه."
context: "بعد أبيات الضيف والعطاء (13–19) يعود إلى سلسلة «رب»: «وَوَجْهٍ»، ثم «وَعَادِيَةٍ» (21)، ثم «وَمَاءٍ» (25). ويضعه أبو زيد القُرَشيّ بعد أبيات الخمر مباشرة [@jamhara، ص480]. والبيت غزل حسي في زيارة امرأة ليلًا، فنشرحه شرحًا تامًّا."
syntax:
  - "«وَوَجْهٍ»: الواو واو رب، و«وجهٍ» مجرور لفظًا بـ«رب» المحذوفة."
  - "«قَدْ طَرَقْتُ»: «قد» حرف تحقيق، و«طرقت» فعل وفاعل، ومفعوله محذوف يعود على الوجه، أي طرقته."
  - "«أُمَيْمَ»: منادى مرخّم بحذف حرف النداء، أصله «يا أميمة»، مبني على الضم المقدر أو على الفتح على لغة من ينتظر المحذوف."
  - "«صَافٍ أَسِيلٍ غَيْرِ جَهْمٍ»: صفات لوجه مجرورة، و«صافٍ» مجرور بكسرة مقدرة على الياء المحذوفة، و«جهمٍ» مضاف إليه."
  - "«ذِي حَطَاطِ»: «ذي» صفة لجهم مجرورة بالياء لأنها من الأسماء الخمسة، و«حطاط» مضاف إليه."
morphology:
  - "«أُمَيْم» ترخيم «أُمَيْمة» بحذف التاء."
  - "«صَافٍ» اسم فاعل من «صفا» على «فاعل»، منقوص."
  - "«أَسِيل» صفة مشبهة على «فعيل»."
rhetoric:
  thesis: "يذكر لأميمة وجه امرأة طرقها ليلًا، ويصفه بالنقاء ونفي العيب."
  devices:
    - title: "ذكر الوجه في «وَوَجْهٍ»"
      text: "ذكر الوجه وأراد المرأة صاحبته، فجعل الوجه هو الذي يُطرق ويُزار، لأن الوجه هو ما يراه ويذكره. وهذه قراءتنا."
    - title: "النداء في «أُمَيْمَ»"
      text: "يقطع وصف المرأة الأخرى بنداء أميمة نفسها في وسط الصدر، فيذكّرها وهي معرضة بأن غيرها استقبلته. والنداء نفسه يتكرر في البيت 25 «وَمَاءٍ قَدْ وَرَدْتُ أُمَيْمَ». وهذه قراءتنا."
    - title: "الإثبات ثم النفي في «صَافٍ أَسِيلٍ غَيْرِ جَهْمٍ»"
      text: "أثبت صفتين للحسن، ثم نفى صفتين للقبح، فأحاط بالوجه من الجهتين. وهذه قراءتنا."
  connection: "ثم ينتقل من الطروق إلى الغارة: «وَعَادِيَةٍ وَزَعْتُ لَهَا حَفِيفٌ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الطاء المكسورة، والقافية مطلقة بالياء"
  scansion: "وَوَجْهِنْ قَدْ / طَرَقْتُ أُمَيْ / مَ صَافِنْ = مفاعَلْتن / مفاعَلَتن / فعولن — أَسِيلِنْ غَيْ / رِ جَهْمِنْ ذِي / حَطَاطِي = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن»، والعروض والضرب «فعولن» مقطوفتان [@atiq، ص54]. ودخل العَصْب، وهو «تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، الأولى من الصدر والأوليين من العجز."
variants:
