explained: false
first: "كَوَشْمِ الْمِعْصَمِ الْمُغْتَالِ عُلَّتْ"
second: "نَوَاشِرُهُ بِوَشْمٍ مُسْتَشَاطِ"
vocabulary:
  - term: "الْوَشْمِ"
    text: "أن يُغرز الذراع بالإبرة ثم يُحشى نَؤورًا [@sukkari-hudhaliyyin، ص1266–1267]."
  - term: "الْمِعْصَمِ"
    text: "موضع السوار من الذراع [@sukkari-hudhaliyyin، ص1266–1267]."
  - term: "الْمُغْتَالِ"
    text: "الممتلئ الريّان [@sukkari-hudhaliyyin، ص1266–1267]."
  - term: "نَوَاشِرُهُ"
    text: "عصبه الذي في باطن الذراع [@sukkari-hudhaliyyin، ص1266–1267]."
  - term: "عُلَّتْ"
    text: "وُشمت مرة بعد مرة، وهو مثل [@sukkari-hudhaliyyin، ص1266–1267]."
