first: "وَخَرْقٍ تَحْسِرُ الرُّكْبَانُ فِيهِ"
second: "بَعِيدِ الْغَوْلِ أَغْبَرَ ذِي نِيَاطِ"
vocabulary:
  - term: "خَرْقٍ"
    text: "فلاة بعيدة واسعة [@sukkari-hudhaliyyin، ص1275]."
  - term: "الْغَوْلِ"
    text: "البُعد [@sukkari-hudhaliyyin، ص1275]."
  - term: "تَحْسِرُ"
    text: "تكلّ ركابهم وتسقط من الإعياء [@sukkari-hudhaliyyin، ص1275]."
  - term: "ذِي نِيَاطِ"
    text: "بعيد، كأنه من بعده قد عُلّق ببلد آخر [@sukkari-hudhaliyyin، ص1275]."
