explained: false
first: "كَلَوْنِ الْمِلْحِ ضَرْبَتُهُ هَبِيرٌ"
second: "يُتِرُّ الْعَظْمَ سَقَّاطٌ سُرَاطِي"
vocabulary:
  - term: "هَبِيرٌ"
    text: "يهبر اللحم، أي يقطعه [@sukkari-hudhaliyyin، ص1273]."
  - term: "يُتِرُّ الْعَظْمَ"
    text: "يطيّره [@sukkari-hudhaliyyin، ص1273]."
  - term: "سَقَّاطٌ"
    text: "يقطع الضريبة حتى يسقط خلفها [@sukkari-hudhaliyyin، ص1273]."
  - term: "سُرَاطِي"
    text: "يسترط ما ضرب، أي يلتهمه [@sukkari-hudhaliyyin، ص1273]."
