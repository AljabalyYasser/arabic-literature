first: "عَرَفْتُ بِأَجْدُثٍ فَنِعَافِ عِرْقٍ"
second: "عَلَامَاتٍ كَتَحْبِيرِ النِّمَاطِ"
meaning: "عرفت في أجدث ثم في نعاف عرق آثار دار، كأنها نقوش البُسُط الموشّاة. وأجدث ونعاف عرق «قال أبو سعيد: هي مواضع»، والنماط جمع نمط، والتحبير «كتنقيش» [@sukkari-hudhaliyyin، ص1266]. فالآثار الباقية من الدار خطوط وألوان على الأرض تشبه نقش الثياب."
vocabulary:
  - term: "أَجْدُثٍ ... نِعَافِ عِرْقٍ"
    text: "مواضع، فيما يقول أبو سعيد في الشرح المطبوع مع القصيدة [@sukkari-hudhaliyyin، ص1266]."
  - term: "تَحْبِيرِ"
    text: "تنقيش [@sukkari-hudhaliyyin، ص1266]."
  - term: "النِّمَاطِ"
    text: "جمع نَمَط [@sukkari-hudhaliyyin، ص1266]، وهي البسط والثياب الموشاة."
context: "مطلع الطائية التي قال فيها الأَصْمَعِيّ: «ولم تقل كلمة على الطاء أجود من قصيدته» [@ibn-qutayba، ج2 ص647]. ويرويها أبو زيد القُرَشيّ بهذا المطلع [@jamhara، ص477]. والقصيدة تبدأ بالرسوم (1–2)، ثم بالشيب وإعراض أميمة (3–5)."
syntax:
  - "«عَرَفْتُ بِأَجْدُثٍ»: «عرفت» فعل وفاعل، و«بأجدث» جار ومجرور متعلق به، والباء بمعنى «في»."
  - "«فَنِعَافِ عِرْقٍ»: الفاء عاطفة، و«نعافِ» معطوف على «أجدث» مجرور، و«عرق» مضاف إليه."
  - "«عَلَامَاتٍ»: مفعول به لعرفت، منصوب بالكسرة لأنه جمع مؤنث سالم."
  - "«كَتَحْبِيرِ النِّمَاطِ»: جار ومجرور متعلق بمحذوف صفة لعلامات، و«النماط» مضاف إليه."
morphology:
  - "«أَجْدُث» على «أَفْعُل»، وهو من أوزان جموع القلة، صار علمًا على موضع."
  - "«عَلَامَات» جمع مؤنث سالم لـ«علامة»."
  - "«تَحْبِير» مصدر «حبّر» على «تفعيل»."
  - "«النِّمَاط» جمع «نَمَط» على «فِعال»."
rhetoric:
  thesis: "مطلع طللي قصير: يعرف آثار الدار في مواضع يسمّيها، ويشبهها بنقش البسط."
  devices:
    - title: "التشبيه في «كَتَحْبِيرِ النِّمَاطِ»"
      text: "شبّه آثار الدار بنقش البسط، ووجه الشبه خطوط وألوان تُرى بالعين، فهو تشبيه من الضرب الذي يكون عند عبد القاهر «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]."
    - title: "تسمية المواضع في «بِأَجْدُثٍ فَنِعَافِ عِرْقٍ»"
      text: "يسمّي موضعين متصلين بالفاء، فيرسم الطريق الذي مرّ فيه وعرف الآثار. وهذه قراءتنا."
  connection: "ثم يزيد التشبيه في البيت 2: «كَوَشْمِ الْمِعْصَمِ الْمُغْتَالِ عُلَّتْ / نَوَاشِرُهُ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الطاء المكسورة، والقافية مطلقة بالياء"
  scansion: "عَرَفْتُ بِأَجْ / دُثِنْ فَنِعَا / فِ عِرْقِنْ = مفاعَلَتن / مفاعَلَتن / فعولن — عَلَامَاتِنْ / كَتَحْبِيرِنْ / نِمَاطِي = مفاعَلْتن / مفاعَلْتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر. والعَرُوض والضَّرْب «فعولن»، دخلهما القَطْف، وهو «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب، وهو «تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلتين الأوليين من العجز."
