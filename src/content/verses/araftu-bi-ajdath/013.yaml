first: "فَلَا وَاللهِ نَادَى الْحَيُّ ضَيْفِي"
second: "هُدُوًّا بِالْمَسَاءَةِ وَالْعِلَاطِ"
vocabulary:
  - term: "نَادَى"
    text: "أي لا ينادي الحي ضيفي بعد هدوء بالمساءة [@sukkari-hudhaliyyin، ص1269]."
  - term: "الْعِلَاطِ"
    text: "يقال: علطه بشرّ، أي ترك عليه مثل علاط البعير، وهو الوسم [@sukkari-hudhaliyyin، ص1269]."
