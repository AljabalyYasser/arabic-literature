first: "وَمَاءٍ قَدْ وَرَدْتُ أُمَيْمَ طَامٍ"
second: "عَلَى أَرْجَائِهِ زَجَلُ الْغَطَاطِ"
meaning: "ورُبّ ماء يا أميمة وردته، قد ارتفع وطما لأن أحدًا لا يرده، وعلى نواحيه صياح القطا. والطامي في الشرح المطبوع مع القصيدة «الذي قد ترك حتى طما وعلا» [@sukkari-hudhaliyyin، ص1272]، وفي «لسان العرب»: «وَالطَّامِي الْمُرْتَفِعُ، وأَرجاؤه نَوَاحِيهِ. والغَطاطُ ضربٌ مِنَ الْقَطَا» [@lisan، ج6 ص300]. فهو ماء في فلاة مهجورة، لا يرده إلا هو والطير والسباع، وفي ذلك فخر بجرأته على المواضع التي يتجنبها الناس."
vocabulary:
  - term: "طَامٍ"
    text: "المرتفع، الذي تُرك حتى طما وعلا [@sukkari-hudhaliyyin، ص1272] [@lisan، ج6 ص300]."
  - term: "أَرْجَائِهِ"
    text: "نواحيه [@lisan، ج6 ص300]."
  - term: "زَجَلُ"
    text: "الصوت، كما في الشرح [@sukkari-hudhaliyyin، ص1272]."
  - term: "الْغَطَاطِ"
    text: "«ضربٌ مِنَ الْقَطَا» [@lisan، ج6 ص300]، والشرح يذكر أن القطا ثلاثة أنواع، منها الغطاط [@sukkari-hudhaliyyin، ص1272]."
context: "هذا البيت هو الذي أنشده ابن قُتَيْبة بعد حكم الأصمعي في الطائية: «ولم تقل كلمة على الطاء أجود من قصيدته التى يقول فيها»، ثم أتبعه بالبيت 29 [@ibn-qutayba، ج2 ص647]. وبه يبدأ مشهد الماء المهجور (25–32): السباع، والذئب الذي يزجره، والبعوض، وآثار الحيات، ثم شربه وسيفه معه."
syntax:
  - "«وَمَاءٍ»: الواو واو رب، و«ماءٍ» مجرور لفظًا بـ«رب» المحذوفة."
  - "«قَدْ وَرَدْتُ»: «قد» حرف تحقيق، و«وردت» فعل وفاعل، ومفعوله محذوف، أي وردته."
  - "«أُمَيْمَ»: منادى مرخّم بحذف حرف النداء، أصله «يا أميمة»."
  - "«طَامٍ»: صفة لماء مجرورة بكسرة مقدرة على الياء المحذوفة."
  - "«عَلَى أَرْجَائِهِ زَجَلُ الْغَطَاطِ»: «على أرجائه» جار ومجرور خبر مقدم، و«زجلُ» مبتدأ مؤخر، و«الغطاط» مضاف إليه، والجملة في محل جر صفة ثانية لماء."
morphology:
  - "«طَامٍ» اسم فاعل من «طما يطمو» على «فاعل»، منقوص حُذفت ياؤه مع التنوين."
  - "«أَرْجَاء» جمع «رَجًا» على «أفعال»."
  - "«زَجَل» مصدر على «فَعَل»."
rhetoric:
  thesis: "يبدأ مشهد الماء المهجور: ماء طامٍ لا يرده الناس، وحوله أصوات الطير."
  devices:
    - title: "الكناية في «طَامٍ»"
      text: "لم يقل إن الماء مهجور، بل وصفه بالارتفاع، وهو يلزم الهجر: لا يرده أحد فيبقى حتى يعلو، كما يقول الشرح «الذي قد ترك حتى طما وعلا» [@sukkari-hudhaliyyin، ص1272]. والكناية عند عبد القاهر أن يجيء المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "الصوت في «زَجَلُ الْغَطَاطِ»"
      text: "يجعل أول ما يلقاه عند الماء صوتًا لا إنسانًا، فالمكان خالٍ إلا من الطير. وهذه قراءتنا."
  connection: "ثم يقول: «قَلِيلٍ وِرْدُهُ إِلَّا سِبَاعًا / يَخِطْنَ الْمَشْيَ كَالنَّبْلِ الْمِرَاطِ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الطاء المكسورة، والقافية مطلقة بالياء"
  scansion: "وَمَائِنْ قَدْ / وَرَدْتُ أُمَيْ / مَ طَامِنْ = مفاعَلْتن / مفاعَلَتن / فعولن — عَلَى أَرْجَا / ئِهِي زَجَلُلْ / غَطَاطِي = مفاعَلْتن / مفاعَلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن»، والعروض والضرب «فعولن» مقطوفتان [@atiq، ص54]. ودخل العَصْب، وهو «تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، الأولى من الشطرين."
