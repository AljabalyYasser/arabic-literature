first: "وَأَكْسُو الْحُلَّةَ الشَّوْكَاءَ خِدْنِي"
second: "وَبَعْضُ الْخَيْرِ فِي حُزَنٍ وِرَاطِ"
vocabulary:
  - term: "الشَّوْكَاءَ"
    text: "الجديدة [@sukkari-hudhaliyyin، ص1270]."
  - term: "وِرَاطِ"
    text: "جمع وَرْطة، وهي الموضع يقع فيه الرجل فلا يقدر أن يخرج منه. يقول: بعض الخير لا يخرج سهلًا، وخيره هو يخرج سهلًا [@sukkari-hudhaliyyin، ص1270]."
