first: "لَهَوْتُ بِهِنَّ إِذْ مَلَقِي مَلِيحٌ"
second: "وَإِذْ أَنَا فِي الْمَخِيلَةِ وَالشَّطَاطِ"
meaning: "تمتعت بهن عشيقاتٍ أيام كان كلامي الليّن المتملّق يعجبهن، وأيام كنت في خيلاء الشباب وحسن القامة. أي كان يغويهن بحلاوة لسانه وجمال هيئته. والمَلَق في الشرح: «لين كلامي، وهو التملق»، والشطاط: «حسن القوام»، والمخيلة: «الخيلاء» [@sukkari-hudhaliyyin، ص1267]. ويفسّر الشرح شطاطه بأنه «طوله قبل أن يكبر فيتقبض جلده، ويحدودب ظهره»، فالبيت يقابل الشيخ الذي صار إليه في البيتين 3–4."
vocabulary:
  - term: "مَلَقِي"
    text: "«لين كلامي، وهو التملق» [@sukkari-hudhaliyyin، ص1267]."
  - term: "الْمَخِيلَةِ"
    text: "«الخيلاء» [@sukkari-hudhaliyyin، ص1267]."
  - term: "الشَّطَاطِ"
    text: "«حسن القوام» [@sukkari-hudhaliyyin، ص1267]."
context: "من أبيات اللهو (6–12)، يكمل البيت 6 ويعلّل ظفره بالنساء. والأبيات غزل حسي صريح، فنشرحها شرحًا تامًّا."
syntax:
  - "«لَهَوْتُ بِهِنَّ»: فعل وفاعل، و«بهن» متعلق به."
  - "«إِذْ مَلَقِي مَلِيحٌ»: «إذ» ظرف لما مضى من الزمان مبني على السكون في محل نصب متعلق بلهوت، وهو مضاف إلى الجملة الاسمية بعده: «ملقي» مبتدأ مرفوع بضمة مقدرة، والياء مضاف إليه، و«مليح» خبر."
  - "«وَإِذْ أَنَا فِي الْمَخِيلَةِ وَالشَّطَاطِ»: الواو عاطفة، و«إذ» معطوف على «إذ» الأولى، و«أنا» مبتدأ، و«في المخيلة» خبر، و«والشطاط» معطوف على المخيلة."
morphology:
  - "«مَلَق» مصدر «مَلِق» على «فَعَل»."
  - "«مَلِيح» صفة مشبهة على «فعيل»."
  - "«المَخِيلَة» مصدر على «مَفْعِلة» من «خال يخيل»، بمعنى الخيلاء."
  - "«الشَّطَاط» مصدر على «فَعال»."
rhetoric:
  thesis: "يعلّل ظفره بالنساء بلين كلامه وحسن قامته في شبابه."
  devices:
    - title: "التكرار في «لَهَوْتُ بِهِنَّ»"
      text: "يبدأ البيت بلفظ البيت السابق نفسه، فيربط البيتين ويُلحّ على الذكرى. وهذه قراءتنا."
    - title: "التقسيم في «إِذْ ... وَإِذْ»"
      text: "قسم زمن الشباب ظرفين: ظرف للسانه «إذ ملقي مليح»، وظرف لهيئته «وإذ أنا في المخيلة والشطاط». فسبب الظفر شيئان: ما يقوله وما يُرى منه. وهذه قراءتنا."
  connection: "ثم يصف ليالي ذلك اللهو: «أَبِيتُ عَلَى مَعَارِيَ فَاخِرَاتٍ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الطاء المكسورة، والقافية مطلقة بالياء"
  scansion: "لَهَوْتُ بِهِنْ / نَ إِذْ مَلَقِي / مَلِيحُنْ = مفاعَلَتن / مفاعَلَتن / فعولن — وَإِذْ أَنَ فِلْ / مَخِيلَةِ وَشْ / شَطَاطِي = مفاعَلَتن / مفاعَلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن»، والعروض والضرب «فعولن» مقطوفتان، والقطف «تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. وجاءت «مفاعلتن» في الحشو سالمة كلها. وألف «أنا» تسقط في النطق."
