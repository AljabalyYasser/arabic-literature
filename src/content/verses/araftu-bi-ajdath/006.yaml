first: "فَحُورٍ قَدْ لَهَوْتُ بِهِنَّ وَحْدِي"
second: "نَوَاعِمَ فِي الْمُرُوطِ وَفِي الرِّيَاطِ"
meaning: "فإن أعرضتِ عني يا أميمة، فرُبّ نساء حُور العيون قد لهوت بهن وحدي، ناعمات في أكسيتهن وملاحفهن. واللهو بالنساء هنا الاستمتاع بهن عشيقاتٍ: مغازلتهن والخلوة بهن ومعاشرتهن، و«وحدي» أي لم يشركه فيهن أحد، أو كان يخلو بهن منفردًا. و«الحور» عند الشارح: «الشديدة بياض الحدقة الشديدة سوادها» [@sukkari-hudhaliyyin، ص1267]. فهو يرد على إعراض أميمة بأن نساءً أجمل منها لم يعرضن عنه."
vocabulary:
  - term: "حُورٍ"
    text: "جمع حوراء، وهي «الشديدة بياض الحدقة الشديدة سوادها» [@sukkari-hudhaliyyin، ص1267]."
  - term: "لَهَوْتُ بِهِنَّ"
    text: "تمتعت بهن عشيقًا، وفي «لسان العرب»: «وتَعَلَّلْت بالمرأَة تَعَلُّلًا: لَهَوْت بِهَا» [@lisan، ج11 ص470]."
  - term: "الْمُرُوطِ ... الرِّيَاطِ"
    text: "ضربان من الثياب والملاحف، يصفهن بالنعمة في لباسهن."
context: "قبله البيت 5: «فَإِمَّا تُعْرِضِنَّ أُمَيْمَ عَنِّي / وَيَنْزِعْكِ الْوُشَاةُ أُولُو النِّبَاطِ». فهذا البيت جواب الشرط: إن أعرضتِ فقد كان لي غيرك. وهو أول أبيات اللهو (6–12)، وهي غزل حسي صريح، فنشرحها شرحًا تامًّا."
syntax:
  - "«فَحُورٍ»: الفاء رابطة لجواب الشرط «فإما تعرضن» في البيت السابق، و«حورٍ» مجرور لفظًا بـ«رب» المحذوفة."
  - "«قَدْ لَهَوْتُ بِهِنَّ»: «قد» حرف تحقيق، و«لهوت» فعل وفاعل، و«بهن» متعلق به. والجملة خبر «رب»."
  - "«وَحْدِي»: حال منصوبة بفتحة مقدرة، والياء مضاف إليه."
  - "«نَوَاعِمَ فِي الْمُرُوطِ وَفِي الرِّيَاطِ»: «نواعمَ» صفة لحور مجرورة بالفتحة لأنها ممنوعة من الصرف، و«في المروط» متعلق بنواعم، و«وفي الرياط» معطوف عليه."
morphology:
  - "«حُور» جمع «حَوْراء» على «فُعْل»."
  - "«نَوَاعِم» جمع «ناعمة» على «فواعل»، صيغة منتهى الجموع."
  - "«المُرُوط» جمع «مِرْط» على «فُعول»، و«الرِّيَاط» جمع «رَيْطة» على «فِعال»."
rhetoric:
  thesis: "يرد على إعراض أميمة بذكر نساء حسان لها بهن في شبابه."
  devices:
    - title: "«رُبّ» المحذوفة بعد الفاء في «فَحُورٍ»"
      text: "جعل إعراضها شرطًا وجوابه ماضيه مع غيرها، فالمعنى: إن تعرضي فلست أول امرأة عرفت. ثم صارت «رب» المحذوفة نمط القصيدة كلها: «وَوَجْهٍ»، «وَعَادِيَةٍ»، «وَمَاءٍ». وهذه قراءتنا."
    - title: "الاستئثار في «وَحْدِي»"
      text: "كلمة واحدة في آخر الصدر تجعل اللهو خلوةً لا يشركه فيها أحد، وهي فخر بالظفر. وهذه قراءتنا."
  connection: "ثم يكرر الفعل نفسه في أول البيت التالي: «لَهَوْتُ بِهِنَّ إِذْ مَلَقِي مَلِيحٌ»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الطاء المكسورة، والقافية مطلقة بالياء"
  scansion: "فَحُورِنْ قَدْ / لَهَوْتُ بِهِنْ / نَ وَحْدِي = مفاعَلْتن / مفاعَلَتن / فعولن — نَوَاعِمَ فِلْ / مُرُوطِ وَفِرْ / رِيَاطِي = مفاعَلَتن / مفاعَلَتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن»، والعروض والضرب «فعولن» مقطوفتان [@atiq، ص54]. ودخل العَصْب، وهو «تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر."
variants:
  - reading: "فَحُورٍ قَدْ لَهَوْتُ بِهِنَّ عِينٍ"
    status: "رواية يذكرها الشرح المطبوع مع القصيدة"
    note: "«ويروى: «لهوت بهن عين»»، والعين عنده «البقر الضخام»، ثم يقول: «وإنما شبه البقر بالنساء» [@sukkari-hudhaliyyin، ص1267]، أي شبّه النساء ببقر الوحش في سعة العيون."
  - reading: "فَحُورٌ قَدْ لَهَوْتُ بِهِنَّ حِينًا"
    status: "رواية «جمهرة أشعار العرب»"
    note: "[@jamhara، ص478]."
