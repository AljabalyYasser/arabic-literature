first: "وَمَا فَقَدَ الْمَاضُونَ مِثْلَ مُحَمَّدٍ"
second: "وَلَا مِثْلُهُ حَتَّى الْقِيَامَةِ يُفْقَدُ"
meaning: "لم يفقد الذين مضوا من الناس مثل محمد، ولن يُفقد مثله إلى يوم القيامة."
vocabulary:
  - term: "الْمَاضُونَ"
    text: "الذين مضوا من الأمم والأجيال."
syntax:
  - "«الْمَاضُونَ» فاعل «فَقَدَ»، و«مِثْلَ» مفعول به."
  - "«وَلَا مِثْلُهُ … يُفْقَدُ» «مِثْلُهُ» مبتدأ، وجملة «يُفْقَدُ» خبره، و«حَتَّى الْقِيَامَةِ» متعلق بـ«يُفْقَدُ»."
morphology:
  - "«الْمَاضُونَ» جمع «مَاضٍ» جمع مذكر سالمًا، حُذفت لامه."
  - "«يُفْقَدُ» مضارع «فَقَدَ» المبني للمجهول."
rhetoric:
  thesis: "البيت الذي يختاره شوقي ضَيْف من المرثية شاهدًا على ما فيها من المعاني الإسلامية."
  devices:
    - title: "المقابلة بين الماضي والمستقبل"
      text: "الصدر للماضين، والعجز إلى القيامة، فيستغرق البيت الزمان كله."
    - title: "التكرار بالاشتقاق"
      text: "«فَقَدَ … يُفْقَدُ»: الفعل نفسه في الماضي والمضارع، و«مِثْلَ … مِثْلُهُ» في الشطرين."
  connection: "ثم يبدأ بالمفاضلة: أعفّ وأوفى وأقرب نائلًا."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـدُو»"
  scansion: "وَمَا فَ / قَدَلْ مَاضُو / نَ مِثْلَ / مُحَمْمَدِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — وَلَا مِثْ / لُهُو حَتْتَلْ / قِيَامَ / ةِ يُفْقَدُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
context: "يقول شوقي ضَيْف: «وله مراث فى الرسول الكريم تتضح فيها المعانى الإسلامية اتضاحا على نحو ما يلقانا فى مرثيته التى رواها أبو زيد الأنصارى»، ثم يروي هذا البيت [@deif، ج2 ص83]."
