first: "وَلَا تَمْتَحِي الْآيَاتُ مِنْ دَارِ حُرْمَةٍ"
second: "بِهَا مِنْبَرُ الْهَادِي الَّذِي كَانَ يَصْعَدُ"
meaning: "ولا تزول العلامات من دار لها حرمة، فيها منبر الهادي الذي كان يصعده."
vocabulary:
  - term: "تَمْتَحِي … الْآيَاتُ"
    text: "«تمتحى: تَزُول. والآيات: العلامات» [@ibn-hisham، ج2 ص666، الحاشية]."
  - term: "حُرْمَةٍ"
    text: "ما لا يحل انتهاكه، فهي دار محترمة."
  - term: "الْهَادِي"
    text: "الذي يهدي الناس، يعني الرسول صلى الله عليه وسلم."
syntax:
  - "«وَلَا تَمْتَحِي الْآيَاتُ» معطوفة على ما قبلها، و«الْآيَاتُ» فاعل."
  - "«بِهَا مِنْبَرُ الْهَادِي» جملة اسمية في محل جر صفة لـ«دَارِ حُرْمَةٍ»."
  - "«الَّذِي كَانَ يَصْعَدُ» صفة لـ«الْهَادِي»، والعائد محذوف، أي: يصعده."
morphology:
  - "«تَمْتَحِي» مضارع «امْتَحَى» على «افْتَعَلَ»، لغة في «انْمَحَى»."
  - "«مِنْبَر» اسم آلة على «مِفْعَل» من «نَبَرَ»، أي ارتفع."
rhetoric:
  thesis: "يعلّل البيت الأول: الرسم لا يعفو لأنه رسم الرسالة لا رسم سكنى."
  devices:
    - title: "التورية في «الآيات»"
      text: "الآيات في لغة الطلل العلامات، كما في الحاشية. وفي هذه الدار تذكّر أيضًا بآيات الوحي التي كانت تُتلى فيها، فتحمل الكلمة المعنيين."
    - title: "حذف العائد"
      text: "«الَّذِي كَانَ يَصْعَدُ» ولم يقل «يصعده»: يجعل الصعود صفة ثابتة للهادي، ويستقيم الوزن."
  connection: "ثم يعدّد معالم الدار: المصلّى والمسجد والحجرات."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـدُو»"
  scansion: "وَلَا تَمْ / تَحِلْ آيَا / تُ مِنْ دَا / رِ حُرْمَتِنْ = فعولن / مفاعيلن / فعولن / مفاعلن — بِهَا مِنْ / بَرُلْ هَادِلْ / لَذِي كَا / نَ يَصْعَدُو = فعولن / مفاعيلن / فعولن / مفاعلن"
sources:
