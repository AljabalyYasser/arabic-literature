first: "بِطَيْبَةَ رَسْمٌ لِلرَّسُولِ وَمَعْهَدُ"
second: "مُنِيرٌ وَقَدْ تَعْفُو الرُّسُومُ وَتَهْمَدُ"
meaning: "في طيبة، أي المدينة، أثر باقٍ للرسول ومنزل كان يُعهد فيه، وهو منير مع أن الآثار تدرس وتبلى. يبدأ المرثية بالطلل كما يبدأ الجاهليون، ولكن الطلل هنا منير لا يدرس."
vocabulary:
  - term: "طَيْبَةَ"
    text: "«طيبَة: اسْم مَدِينَة النَّبِي صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ» [@ibn-hisham، ج2 ص666، الحاشية]."
  - term: "رَسْمٌ"
    text: "«والرسم: مَا بَقِي من آثَار الدَّار» [@ibn-hisham، ج2 ص666، الحاشية]."
  - term: "مَعْهَدُ"
    text: "المكان الذي يُعهد فيه الشيء، أي يُعرف ويُلقى."
  - term: "تَعْفُو … تَهْمَدُ"
    text: "«وَتَعْفُو: تدرس وتتغير. وتهمد: تبلى» [@ibn-hisham، ج2 ص666، الحاشية]."
syntax:
  - "«بِطَيْبَةَ» جار ومجرور متعلق بمحذوف خبر مقدم، و«رَسْمٌ» مبتدأ مؤخر، و«مَعْهَدُ» معطوف عليه."
  - "«مُنِيرٌ» صفة لـ«مَعْهَدُ» أو للرسم والمعهد معًا، وجاء في أول العجز فهو مدوّر المعنى."
  - "«وَقَدْ تَعْفُو الرُّسُومُ» الواو حالية أو اعتراضية، و«قَدْ» مع المضارع للتقليل أو التكثير."
morphology:
  - "«طَيْبَةُ» ممنوعة من الصرف للعلمية والتأنيث، فجُرّت بالفتحة."
  - "«مَعْهَد» اسم مكان على «مَفْعَل» من «عَهِدَ»."
rhetoric:
  thesis: "مطلع على سنّة الطلل، ولكنه ينقضها: الرسوم تعفو، وهذا الرسم منير."
  devices:
    - title: "الطلل المقلوب"
      text: "الشاعر الجاهلي يقف على رسم دارس. وحسّان يقف على رسم «منير»، ثم يذكر القاعدة «وقد تعفو الرسوم وتهمد» ليبيّن أن هذا الرسم خارج عليها."
    - title: "الجناس"
      text: "«رَسْمٌ لِلرَّسُولِ»: يجمع بين لفظين متقاربين في الحروف، فيصير الرسم رسم الرسول."
  connection: "ثم يفسّر لماذا لا تمحى آياته: فيها منبره."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـدُو»"
  scansion: "بِطَيْبَ / ةَ رَسْمُنْ لِرْ / رَسُولِ / وَمَعْهَدُو = فعولُ / مفاعيلن / فعولُ / مفاعلن — مُنِيرُنْ / وَقَدْ تَعْفُرْ / رُسُومُ / وَتَهْمَدُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
context: "يقول ابن إسحاق: «وَقَالَ حَسَّانُ بْنُ ثَابِتٍ يَبْكِي رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، فِيمَا حَدَّثَنَا ابْنُ هِشَامٍ، عَنْ أَبِي زَيْدٍ الْأَنْصَارِيِّ» [@ibn-hisham، ج2 ص666]."
