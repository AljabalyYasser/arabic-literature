first: "بِهَا حُجُرَاتٌ كَانَ يَنْزِلُ وَسْطَهَا"
second: "مِنَ اللَّهِ نُورٌ يُسْتَضَاءُ وَيُوقَدُ"
meaning: "في هذه الدار حجرات كان ينزل وسطها نورٌ من الله، يُستضاء به ويوقد. والحجرات مساكن الرسول، والنور الذي ينزل بينها كناية عن الوحي."
vocabulary:
  - term: "حُجُرَاتٌ"
    text: "«الحجرات: جمع حجرَة. يعْنى مساكنه صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ» [@ibn-hisham، ج2 ص666، الحاشية]."
  - term: "يُسْتَضَاءُ"
    text: "يُطلب منه الضوء."
syntax:
  - "«بِهَا حُجُرَاتٌ» خبر مقدم ومبتدأ مؤخر."
  - "«كَانَ يَنْزِلُ وَسْطَهَا … نُورٌ» جملة في محل رفع صفة لـ«حُجُرَاتٌ»، و«نُورٌ» فاعل «يَنْزِلُ»، تأخر إلى العجز."
  - "«يُسْتَضَاءُ وَيُوقَدُ» جملتان في محل رفع صفة لـ«نُورٌ»."
morphology:
  - "«حُجُرَات» جمع «حُجْرَة» جمع مؤنث سالمًا، وتُضم الجيم إتباعًا لضمة الحاء."
  - "«يُسْتَضَاءُ» مضارع «اسْتَضَاءَ» على «اسْتَفْعَلَ» للطلب، مبني للمجهول."
rhetoric:
  thesis: "قلب البيت الطللي: الطلل الجاهلي فيه نار الحيّ، وهنا نور ينزل من السماء."
  devices:
    - title: "تأخير الفاعل"
      text: "«كَانَ يَنْزِلُ وَسْطَهَا» ثم ينتظر القارئ الفاعل إلى العجز: «مِنَ اللَّهِ نُورٌ». فالتأخير يجعل النور مفاجأة البيت."
    - title: "النور الموقد"
      text: "«يُسْتَضَاءُ وَيُوقَدُ»: يصف النور بما توصف به النار، والنار في الشعر الجاهلي علامة الكرم والحيّ العامر. فدار الرسول عامرة بنور لا بنار."
  connection: "ثم يصف المعارف التي لم تطمس، ووقوفه عليها."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـدُو»"
  scansion: "بِهَا حُ / جُرَاتُنْ كَا / نَ يَنْزِ / لُ وَسْطَهَا = فعولُ / مفاعيلن / فعولُ / مفاعلن — مِنَلْ لَا / هِ نُورُنْ يُسْ / تَضَاءُ / وَيُوقَدُو = فعولن / مفاعيلن / فعولُ / مفاعلن"
sources:
