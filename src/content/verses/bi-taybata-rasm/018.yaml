first: "وَهَلْ عَدَلَتْ يَوْمًا رَزِيَّةُ هَالِكٍ"
second: "رَزِيَّةَ يَوْمٍ مَاتَ فِيهِ مُحَمَّدُ"
meaning: "وهل ساوت مصيبةُ هالكٍ يومًا مصيبةَ اليوم الذي مات فيه محمد؟ استفهام جوابه النفي: لا مصيبة تعدلها."
vocabulary:
  - term: "عَدَلَتْ"
    text: "ساوت وماثلت."
  - term: "رَزِيَّةُ"
    text: "المصيبة العظيمة."
  - term: "هَالِكٍ"
    text: "ميت."
syntax:
  - "«هَلْ» حرف استفهام بمعنى النفي."
  - "«رَزِيَّةُ هَالِكٍ» فاعل «عَدَلَتْ» ومضاف إليه، و«رَزِيَّةَ يَوْمٍ» مفعول به."
  - "«مَاتَ فِيهِ مُحَمَّدُ» جملة في محل جر صفة لـ«يَوْمٍ»."
morphology:
  - "«رَزِيَّة» على «فَعِيلَة» من «رَزَأَ»، خُففت الهمزة ياء ثم أُدغمت."
  - "«هَالِك» اسم فاعل من «هَلَكَ»."
rhetoric:
  thesis: "أشهر أبيات المرثية، يقيس كل مصيبة بهذه المصيبة."
  devices:
    - title: "رد العجز على الصدر"
      text: "«رَزِيَّةُ هَالِكٍ … رَزِيَّةَ يَوْمٍ»: تتكرر الكلمة في آخر الصدر وأول العجز، وتختلف حركتها: الأولى فاعل والثانية مفعول، فيتقابل الطرفان في الميزان."
    - title: "الاستفهام الإنكاري"
      text: "لم يقل «لا تعدلها رزية»، بل سأل، فيشارك السامعُ في الجواب."
    - title: "ختم البيت بالاسم"
      text: "آخر كلمة «مُحَمَّدُ»، وهي القافية، فيقع الاسم في موضع الوقف."
  connection: "ثم يذكر ما انقطع بموته: الوحي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـدُو»"
  scansion: "وَهَلْ عَ / دَلَتْ يَوْمَنْ / رَزِيْيَ / ةُ هَالِكِنْ = فعولُ / مفاعيلن / فعولُ / مفاعلن — رَزِيْيَ / ةَ يَوْمِنْ مَا / تَ فِيهِ / مُحَمْمَدُو = فعولُ / مفاعيلن / فعولُ / مفاعلن"
sources:
