explained: false
first: أَدَّتِ الصَّنْعَةُ فِي أَمْتُنِهَا
second: فَهْيَ مِنْ تَحْتُ مُشِيحَاتُ الْحُزُمْ
vocabulary:
- term: الصَّنْعَةُ
  text: حسن القيام على الخيل؛ من «صنع فرسه إذا قام بعلفه وتسمينه» [@lisan، ج8 ص210].
- term: أَمْتُنِهَا
  text: ظهورها، جمع مَتْن.
- term: مُشِيحَاتُ الْحُزُمْ
  text: 'مرتفعة مواضع الأحزمة لضمورها؛ قال ابن الأعرابي في البيت: «يقول: جدّ ارتفاعها في الحزم» [@lisan، ج2 ص501].'
