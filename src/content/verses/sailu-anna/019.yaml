first: قُدُمًا تَنْضُو إِلَى الدَّاعِي إِذَا
second: خَلَّلَ الدَّاعِي بِدَعْوَى ثُمَّ عَمّ
vocabulary:
- term: قُدُمًا
  text: متقدّمة.
- term: تَنْضُو
  text: 'تسبق وتتقدّم؛ «نضا الفرس الخيل نُضيًّا: سبقها وتقدّمها» [@lisan، ج15 ص330].'
- term: خَلَّلَ
  text: خصّ بدعوته قومًا؛ «وخلّل، بالتشديد، أي خصّص» [@lisan، ج11 ص216].
