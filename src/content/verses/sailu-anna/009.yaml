first: وَتَفَرَّعْنَا مِنِ ابْنَيْ وَائِلٍ
second: هَامَةَ الْعِزِّ وَخُرْطُومَ الْكَرَمْ
vocabulary:
- term: تَفَرَّعْنَا
  text: 'علونا؛ «وتفرّع فلان القوم: علاهم» [@lisan، ج8 ص247].'
- term: ابْنَيْ وَائِلٍ
  text: بَكْر وتَغْلِب ابنا وائِل.
- term: هَامَةَ
  text: الرأس، وأعلى الشيء.
- term: خُرْطُومَ
  text: الأنف [@lisan، ج12 ص173]، والمراد أعلى الكرم وأشرفه.
