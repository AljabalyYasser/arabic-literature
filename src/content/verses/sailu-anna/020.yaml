first: بِشَبَابٍ وَكُهُولٍ نُهُدٍ
second: كَلُيُوثٍ بَيْنَ عِرِّيسِ الْأَجَمْ
vocabulary:
- term: نُهُدٍ
  text: ضخام أشدّاء، جمع نَهْد؛ و«النهد في نعت الخيل الجسيم المشرف» [@lisan، ج3 ص429].
- term: عِرِّيسِ
  text: الشجر الملتفّ، «وهو مأوى الأَسَد» [@lisan، ج6 ص136].
- term: الْأَجَمْ
  text: جمع أَجَمة، وهي الشجر الكثير الملتفّ.
