first: وَقَنًا جُرْدٍ وَخَيْلٍ ضُمَّرٍ
second: شُزَّبٍ مِنْ طُولِ تَعْلَاكِ اللُّجُمْ
vocabulary:
- term: قَنًا
  text: رماح.
- term: ضُمَّرٍ
  text: ضوامر البطون، جمع ضامر.
- term: شُزَّبٍ
  text: جمع شازب، وهو «الضامر اليابس» [@lisan، ج1 ص494].
- term: تَعْلَاكِ اللُّجُمْ
  text: 'مضغها اللُّجُم؛ من «علك الشيء يعلكه: مضغه ولجلجه» [@lisan، ج10 ص470].'
