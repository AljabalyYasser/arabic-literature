first: يَوْمَ تُبْدِي الْبِيضُ عَنْ أَسْوُقِهَا
second: وَتَلُفُّ الْخَيْلُ أَعْرَاجَ النَّعَمْ
vocabulary:
- term: الْبِيضُ
  text: النساء الحرائر.
- term: أَسْوُقِهَا
  text: جمع ساق.
- term: تَلُفُّ
  text: تجمع وتضمّ.
- term: أَعْرَاجَ
  text: 'جمع عَرْج، وهو «الكثير من الإبل» عند أبي زيد، وقيل: من خمسمائة إلى ألف [@lisan، ج2 ص322].'
