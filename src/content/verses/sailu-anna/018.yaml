first: خُلُجُ الشَّدِّ مُلِحَّاتٌ إِذَا
second: شَالَتِ الْأَيْدِي عَلَيْهَا بِالْجِذَمْ
vocabulary:
- term: خُلُجُ الشَّدِّ
  text: 'تجذب العَدْو جذبًا؛ «الأخلج: الطويل من الخيل الذي يخلج الشدّ خلجًا أي يجذبه» [@lisan، ج2 ص260].'
- term: شَالَتِ
  text: ارتفعت.
- term: الْجِذَمْ
  text: 'السياط؛ «والجِذْمة: السوط» [@lisan، ج12 ص87].'
