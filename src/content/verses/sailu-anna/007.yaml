first: نُقُلٌ لِلشَّحْمِ فِي مَشْتَاتِنَا
second: نُحُرٌ لِلنِّيبِ طُرَّادُ الْقَرَمْ
vocabulary:
- term: نُقُلٌ
  text: جمع ناقل.
- term: مَشْتَاتِنَا
  text: شتائنا؛ «الشتاء، وهو المَشْتى والمَشْتاة» [@lisan، ج14 ص421].
- term: لِلنِّيبِ
  text: 'النِّيب: النوق المسنّة، جمع ناب.'
- term: الْقَرَمْ
  text: «شدة الشهوة إلى اللحم» [@lisan، ج12 ص473].
