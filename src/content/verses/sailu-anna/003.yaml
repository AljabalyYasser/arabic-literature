first: أَجْدَرُ النَّاسِ بِرَأْسٍ صِلْدِمٍ
second: حَازِمِ الْأَمْرِ شُجَاعٍ فِي الْوَغَمْ
vocabulary:
- term: رَأْسٍ
  text: سيّد يرأس القوم.
- term: صِلْدِمٍ
  text: صُلب شديد، وأصله في الفرس «الشديد الحافر» [@lisan، ج12 ص342].
- term: الْوَغَمْ
  text: '«الذَّحْل والتِّرة»، أي الثأر، وقيل: الحقد الثابت في الصدور [@lisan، ج12 ص641].'
