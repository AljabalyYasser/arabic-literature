explained: false
first: وَتَفَرَّى اللَّحْمُ مِنْ تَعْدَائِهَا
second: وَالتَّغَالِي فَهْيَ قُبٌّ كَالْعَجَمْ
vocabulary:
- term: تَفَرَّى
  text: انشقّ؛ «أفريت الشيء شققته فانفرى وتفرّى أي انشقّ» [@lisan، ج15 ص153].
- term: تَعْدَائِهَا
  text: عَدْوها.
- term: التَّغَالِي
  text: 'من «تغالى لحم الدابة» «إذا ارتفع وذهب، وقيل: إذا انحسر عند التضمير» [@lisan، ج15 ص134].'
- term: قُبٌّ كَالْعَجَمْ
  text: ضوامر البطون، جمع أقبّ وقبّاء، صلبة كالعَجَم، وهو النوى.
