explained: false
first: تَتَّقِي الْأَرْضَ بِرُحٍّ وُقُحٍ
second: وُرُقٍ يَقْعَرْنَ أَنْبَاكَ الْأَكَمْ
vocabulary:
- term: رُحٍّ
  text: حوافر عريضة، جمع أَرَحّ؛ «الأرحّ الحافر العريض» [@lisan، ج2 ص446].
- term: يَقْعَرْنَ
  text: يقلعن من الأصل؛ من «قعرت النخلة إذا قلعتها من أصلها» [@lisan، ج5 ص109].
- term: أَنْبَاكَ
  text: جمع نَبَكة، وهي «أكمة محدّدة الرأس» [@lisan، ج10 ص497].
