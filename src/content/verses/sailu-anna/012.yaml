explained: false
first: بِحُسَامَاتٍ تَرَاهَا رُسَّبًا
second: فِي الضَّرِيبَاتِ مُتِرَّاتِ الْعُصُمْ
vocabulary:
- term: حُسَامَاتٍ
  text: سيوف قاطعة.
- term: رُسَّبًا
  text: 'تغيب فيما تضربه؛ «وسيف رَسَب ورَسُوب: ماضٍ يغيب في الضريبة» [@lisan، ج1 ص418].'
- term: الضَّرِيبَاتِ
  text: ما يُضرب بالسيف.
- term: مُتِرَّاتِ
  text: قاطعات؛ «ضرب فلان يد فلان بالسيف فأترّها ... أي قطعها» [@lisan، ج4 ص90].
