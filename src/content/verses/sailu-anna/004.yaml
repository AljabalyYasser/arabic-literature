first: كَامِلٍ يَحْمِلُ آلَاءَ الْفَتَى
second: نَبَهٍ سَيِّدِ سَادَاتٍ خِضَمّ
vocabulary:
- term: آلَاءَ
  text: النِّعَم، والمراد خصال الفتى الكريمة.
- term: نَبَهٍ
  text: شريف مشهور؛ «ورجل نَبَه ونَبيه إذا كان معروفًا شريفًا» [@lisan، ج13 ص547].
- term: خِضَمّ
  text: «السيد الحمول الجواد المِعطاء الكثير المعروف والعطية» [@lisan، ج12 ص183].
