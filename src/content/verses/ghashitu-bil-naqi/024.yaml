first: "فَأَنْقَذَهَا مِنْ غَمْرَةِ الْمَوْتِ أَنَّهَا"
second: "رَأَتْ أَنَّهَا إِنْ تَنْظُرِ النَّبْلَ تُقْصَدِ"
vocabulary:
