    text: "«أي: إن تنتظر أصحاب النبل أن يجيئوا» [@diwan-zuhayr، ص185]."
  - term: "تُقْصَدِ"
    text: "«تُقتل. يقال: رماه فأقصده، إذا أصاب مقتله» [@diwan-zuhayr، ص185]."
