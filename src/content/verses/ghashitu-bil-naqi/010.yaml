explained: false
first: "وَتَلْوِي بِرَيَّانِ الْعَسِيبِ تُمِرُّهُ"
second: "عَلَى فَرْجِ مَحْرُومِ الشَّرَابِ مُجَدَّدِ"
vocabulary:
  - term: "بِرَيَّانِ الْعَسِيبِ"
    text: "تضرب بذنبها يمنة ويسرة، والعسيب عظم الذنب، والريّان الغليظ الممتلئ [@diwan-zuhayr، ص180]."
  - term: "مَحْرُومِ الشَّرَابِ مُجَدَّدِ"
    text: "أراد بالمحروم خِلْفها، أي ضرعها: «هي ناقة لم تحمل، فلا لبن لخلفها»، والمجدّد: المقطوع اللبن [@diwan-zuhayr، ص180]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص180"
    url: "https://archive.org/details/3917pdf/page/n180/mode/1up"
