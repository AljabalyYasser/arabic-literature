first: "كَخَنْسَاءَ سَفْعَاءِ الْمَلَاطِمِ حُرَّةٍ"
second: "مُسَافِرَةٍ مَزْؤُودَةٍ أُمِّ فَرْقَدِ"
meaning: "ناقتي في نشاطها وحدّتها كبقرة وحشية قصيرة الأنف، في خديها سواد مُشرَب بحمرة، كريمة الأصل، تنتقل من أرض إلى أرض مذعورة، ولها ولد صغير."
vocabulary:
  - term: "كَخَنْسَاءَ"
    text: "عند الأَعْلَم: «يعني: بقرة قصيرة الأنف» [@diwan-zuhayr، ص181]. وفي الشرح المنسوب إلى ثَعْلَب: «والخَنَس: تأخّر الأنف في الرأس» [@sharh-thalab-zuhayr، ص163]."
  - term: "سَفْعَاءِ الْمَلَاطِمِ"
    text: "السفعاء: السوداء في حمرة، والملاطم: الخدان [@diwan-zuhayr، ص181]. وفي الشرح المنسوب إلى ثعلب: «والسَّفَع: سواد في حمرة» [@sharh-thalab-zuhayr، ص163]."
  - term: "حُرَّةٍ"
    text: "«وحرّة: كريمة عتيقة» [@sharh-thalab-zuhayr، ص163]."
  - term: "مُسَافِرَةٍ"
    text: "«أي: خارجة من أرض إلى أرض» [@diwan-zuhayr، ص181]."
  - term: "مَزْؤُودَةٍ"
    text: "مذعورة [@diwan-zuhayr، ص181]. وفي الشرح المنسوب إلى ثعلب: «وزُئِد الرجل فهو مزؤود أي: مذعور. والاسم منه الزُّؤد» [@sharh-thalab-zuhayr، ص163]."
  - term: "أُمِّ فَرْقَدِ"
    text: "«و«الفرقد»: ولد البقرة» [@diwan-zuhayr، ص181]."
context: "يبدأ به أطول مقاطع القصيدة: يشبّه ناقته بالبقرة الوحشية، ثم يترك الناقة ويمضي مع البقرة ستة عشر بيتًا (12–27): سلاحها وأذناها وعيناها، ثم خروجها إلى المرعى وافتراس السباع ولدها، ثم مطاردة الرماة وكلابهم ونجاتها. وهذا الخروج من وصف إلى وصف يتصل به يسمى الاستطراد. يقول شَوْقِي ضَيْف إن لزهير في هذه الدالية قطعة «يصف بقرة وحشية شبه بها ناقته فى سرعتها» [@deif، ج1 ص322]، ويرى أنه يعرضها أولًا «بهيئة جسدها وهيئة نفسها، لنستعد إلى ما سيفجؤها من كوارث» [@deif، ج1 ص324]."
syntax:
  - "«كَخَنْسَاءَ»: الكاف حرف تشبيه، والجار والمجرور في موضع نصب حال من ضمير الناقة في البيت السابق «تبادر أغوال العشي»: تبادر كأنها خنساء. و«خنساء» صفة لموصوف محذوف، أي بقرة خنساء، ممنوعة من الصرف فجُرّت بالفتحة."
  - "«سَفْعَاءِ الْمَلَاطِمِ» صفة لـ«خنساء»، وجُرّت بالكسرة لأنها أضيفت. و«حُرَّةٍ» و«مُسَافِرَةٍ» و«مَزْؤُودَةٍ» صفات بعدها."
  - "«أُمِّ فَرْقَدِ» صفة أخيرة مجرورة، وهي التي تبني عليها الأبيات التالية قصة الولد الذي ستفقده."
morphology:
  - "«خَنْسَاء» و«سَفْعَاء» على «فَعْلاء»، مؤنث «أَفْعَل» للألوان والعيوب: أخنس وخنساء، وأسفع وسفعاء، ولذلك مُنعتا من الصرف."
  - "«الْمَلَاطِم» جمع «مَلْطِم» على «مَفاعِل»، وهو موضع اللطم من الوجه. ويقول المحقق في جمعه وللبقرة خدّان: «الخدّان ملطمان، وجمعهما بما حولهما» [@diwan-zuhayr، ص181]."
  - "«مَزْؤُودَة» اسم مفعول على «مَفْعُولة» من «زأد»، والفعل منه مبني للمجهول «زُئِد»، والمصدر الزُّؤد [@sharh-thalab-zuhayr، ص163]."
rhetoric:
  thesis: "تشبيه يفتح قصة: الناقة تُشبَّه بالبقرة، ثم تأخذ البقرة القصيدة لنفسها."
  devices:
    - title: "التشبيه"
      text: "«كَخَنْسَاءَ»: شبه الناقة بالبقرة الوحشية، ووجه الشبه عند الأعلم: «في نشاطها، وحدّتها» [@diwan-zuhayr، ص181]، وعند ضيف «فى سرعتها» [@deif، ج1 ص322]. والشبه هنا من الصنف الذي يكون عند عبد القاهر «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]: سرعة تُرى بالعين."
    - title: "الاستطراد"
      text: "لم يقف عند وجه الشبه، بل حشد للبقرة صفاتها: لونها، وكرمها، وسفرها، وذعرها، وولدها. وآخر الصفات «أُمِّ فَرْقَدِ» بذرة القصة كلها: ولد صغير تتركه فتفترسه السباع (16–18)."
    - title: "تتابع الصفات بلا عاطف"
      text: "«سَفْعَاءِ ... حُرَّةٍ مُسَافِرَةٍ مَزْؤُودَةٍ أُمِّ فَرْقَدِ»: خمس صفات متتابعة بلا واو، فتُرسم البقرة دفعة واحدة. وترتيبها من الظاهر إلى الباطن: لون الخد، ثم الأصالة، ثم الحركة، ثم الخوف، ثم سببه."
  connection: "ثم يصف سلاحها: قرنين يُتّقى بمثلهما العدو."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَخَنْسَا / ءَسَفْعَاءِلْ / مَلَاطِ / مِحُرْرَتِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — مُسَافِ / رَتِنْ مَزْؤُو / دَتِنْ أُمْ / مِفَرْقَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "دخل القبض «فعولن» الثانية في الصدر والأولى في العجز [@atiq، ص29]، والعروض والضرب مقبوضان [@atiq، ص29–30]."
