explained: false
first: "فَجَالَتْ عَلَى وَحْشِيِّهَا وَكَأَنَّهَا"
second: "مُسَرْبَلَةٌ فِي رَازِقِيٍّ مُعَضَّدِ"
vocabulary:
  - term: "وَحْشِيِّهَا"
    text: "«الجانب الذي لا يُركب منه، وهو الأيمن» [@diwan-zuhayr، ص184]."
  - term: "رَازِقِيٍّ مُعَضَّدِ"
    text: "الرازقي ثوب أبيض، والمعضّد المخطّط، «شبّه البقرة به، في بياضها، وتخطيط قوائمها» [@diwan-zuhayr، ص184]."
sources:
