explained: false
first: "وَثِقْلٌ عَلَى الْأَعْدَاءِ لَا يَضَعُونَهُ"
second: "وَحَمَّالُ أَثْقَالٍ وَمَأْوَى الْمُطَرَّدِ"
vocabulary:
  - term: "لَا يَضَعُونَهُ"
    text: "لا يقدرون على إلقائه عنهم. يقول الأَعْلَم: «شدّته عليهم ثابتة، لا ينفصلون منها» [@diwan-zuhayr، ص188]."
  - term: "الْمُطَرَّدِ"
    text: "«المطرود من عشيرته» [@diwan-zuhayr، ص188]."
