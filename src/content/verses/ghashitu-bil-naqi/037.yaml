first: "سَبَقْتَ إِلَيْهَا كُلَّ طَلْقٍ مُبَرِّزٍ"
second: "سَبُوقٍ إِلَى الْغَايَاتِ غَيْرِ مُجَلَّدِ"
meaning: "سبقتَ إلى تلك الغاية كلّ كريم ماضٍ بيّن الفضل، سبّاق إلى الغايات، يبلغها عفوًا دون أن يُضرب ويُجلد."
vocabulary:
  - term: "طَلْقٍ"
    text: "عند الأَعْلَم: «الماضي البيّن الفضل. ويقال: رجل طلق اليدين، إذا كان معطاء» [@diwan-zuhayr، ص189]."
  - term: "مُبَرِّزٍ"
    text: "«الذي سبق الناس إلى الكرم والخير» [@diwan-zuhayr، ص189]."
  - term: "غَيْرِ مُجَلَّدِ"
    text: "«أي: ينتهي إلى الغايات من غير أن يُجلد ويُضرب» [@diwan-zuhayr، ص189]."
context: "جواب البيت السابق: «إذا ابتدرت قيس ...» ثم «سبقتَ إليها». يقول الأعلم: «يسوَّد من سبق إليها، فأنت السابق إليها» [@diwan-zuhayr، ص189]. وهو ثاني الأبيات التي أنشدها عمر في خبر ابن عَبّاس [@aghani-dk، ج10 ص291]، ويرويه ابن قُتَيْبة بعد قول عمر [@ibn-qutayba، ج1 ص138]."
syntax:
  - "«سَبَقْتَ إِلَيْهَا»: جواب «إذا» في البيت السابق، والتاء فاعل، والخطاب لهرم. و«كُلَّ طَلْقٍ» مفعول به ومضاف إليه."
  - "«مُبَرِّزٍ» و«سَبُوقٍ» و«غَيْرِ مُجَلَّدِ» صفات لـ«طلق» مجرورة، و«إِلَى الْغَايَاتِ» متعلق بـ«سبوق»."
morphology:
  - "«مُبَرِّز» اسم فاعل من «برّز» على «فعّل»، و«مُجَلَّد» اسم مفعول من «جلّد» على «فعّل» للتكثير: يُجلد مرة بعد مرة."
  - "«سَبُوق» صيغة مبالغة على «فَعُول» من «سبق»، و«طَلْق» صفة على «فَعْل»."
rhetoric:
  thesis: "الممدوح يسبق السابقين أنفسهم، ويسبقهم بلا عناء."
  devices:
    - title: "الاستعارة من الخيل"
      text: "«طَلْقٍ مُبَرِّزٍ سَبُوقٍ ... غَيْرِ مُجَلَّدِ»: صفات خيل السباق أجراها على الرجال. يقول الأعلم إنه «ضرب هذا مثلًا»، واستعاره «من الفرس الجواد الذي يسبق إلى الغاية عفوًا، من غير أن يُجهد ويُضرب» [@diwan-zuhayr، ص189]."
    - title: "الالتفات"
      text: "«سَبَقْتَ»: كان يتحدث عن هَرِم بضمير الغائب («أليس بفيّاض يداه غمامة»)، ثم خاطبه. والالتفات: الانتقال من الغيبة إلى الخطاب أو العكس. وموضعه هنا لحظة الفوز نفسها، فكأن الشاعر يحيّيه وهو يبلغ الغاية."
    - title: "تعظيم المسبوقين"
      text: "«كُلَّ طَلْقٍ مُبَرِّزٍ سَبُوقٍ»: لم يجعل منافسيه ضعافًا، بل وصفهم بالسبق والفضل، فيعظم الفوز عليهم. ويشرح البيت التالي ذلك: فضله على السراع لا على البطاء."
  connection: "ثم يمثّل هذا السبق بصورة كاملة: فضل الجواد الذي يسبق عفوُه جهدَ السراع."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "سَبَقْتَ / إِلَيْهَاكُلْ / لَطَلْقِنْ / مُبَرْرِزِنْ = فعولُ / مفاعيلن / فعولن / مفاعلن — سَبُوقِنْ / إِلَلْغَايَا / تِغَيْرِ / مُجَلْلَدِي = فعولن / مفاعيلن / فعولُ / مفاعلن"
  note: "دخل القبض «فعولن» الأولى في الصدر والثانية في العجز [@atiq، ص29]."
variants:
  - reading: "سَبُوقٍ إِلَى الْغَايَاتِ غَيْرِ مُخَلَّدِ"
    status: "رواية ابن قتيبة"
    note: "ويذكر ابن قتيبة أنه يروى أيضًا «غَيْرِ مُبَلَّدِ»، ويفسر المخلَّد هنا بالمبطئ [@ibn-qutayba، ج1 ص138]. ويقول محقق الشرح المنسوب إلى ثَعْلَب إن «مخلّد» في النسخة «س» [@sharh-thalab-zuhayr، ص169]."
  - reading: "سَبُوقٍ إِلَى الْغَايَاتِ غَيْرِ مُزَنَّدِ"
    status: "رواية الأغاني"
    note: "في خبر عمر [@aghani-dk، ج10 ص291]."
