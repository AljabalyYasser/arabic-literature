first: "غَشِيتُ دِيَارًا بِالنَّقِيعِ فَثَهْمَدِ"
second: "دَوَارِسَ قَدْ أَقْوَيْنَ مِنْ أُمِّ مَعْبَدِ"
meaning: "أتيتُ ديارًا بالنقيع فثهمد قد درست آثارها، وخلت من أُمّ مَعْبَد وأهلها."
vocabulary:
  - term: "غَشِيتُ"
    text: "أتيتُ وقصدتُ."
  - term: "النَّقِيعِ فَثَهْمَدِ"
    text: "«النقيع وثهمد»: «مكانان» [@diwan-zuhayr، ص177]. وفي اللسان: «ثَهْمَدُ: مَوْضِعٌ» [@lisan، ج3 ص106]."
  - term: "دَوَارِسَ"
    text: "جمع دارسة، وهي التي عفت آثارها وبليت."
  - term: "أَقْوَيْنَ"
    text: "عند الأَعْلَم: «أقفرن وذهب منهنّ أهلهنّ» [@diwan-zuhayr، ص177]. وفي اللسان: «وأَقْوَتِ الدارُ إِذا خَلَتْ مِنْ أَهلها» [@lisan، ج15 ص211]."
context: "مطلع القصيدة. يبدأ بالأطلال على سنة الجاهليين، ويسمي صاحبة الديار أم معبد ولا يعود إليها بعد هذا البيت، فالأطلال ثلاثة أبيات ثم ينهض إلى ناقته. والقصيدة ليست في رواية الأَصْمَعِيّ، وفي رأسها عند الأعلم أنها في مدح هَرِم، «عن أبي عمرو والمفضّل» [@diwan-zuhayr، ص177]."
syntax:
  - "«غَشِيتُ دِيَارًا»: فعل وفاعل ومفعول به. و«بِالنَّقِيعِ» متعلق بمحذوف صفة لـ«ديارًا»، و«فَثَهْمَدِ» معطوف عليه بالفاء التي تفيد الترتيب في المكان: ديار تمتد من موضع إلى موضع."
  - "«دَوَارِسَ» صفة ثانية لـ«ديارًا» منصوبة بالفتحة بلا تنوين لأنها ممنوعة من الصرف. وجملة «قَدْ أَقْوَيْنَ» صفة ثالثة، و«مِنْ أُمِّ مَعْبَدِ» متعلق بـ«أقوين»."
morphology:
  - "«غَشِيتُ» من «غَشِيَ يَغْشَى» على «فَعِلَ يَفْعَلُ»."
  - "«دَوَارِس» جمع «دارسة» على «فَواعِل»، وهي صيغة منتهى الجموع فمُنعت من الصرف."
  - "«أَقْوَيْنَ» على «أَفْعَلْنَ» من «القَواء»، وهو الأرض الخالية [@lisan، ج15 ص211]، والهمزة فيه للصيرورة: صارت قَواءً."
rhetoric:
  thesis: "مطلع طللي قصير: الشاعر يأتي الديار فيجدها خالية، ومن الخلو تبدأ الرحلة."
  devices:
    - title: "تسمية المواضع"
      text: "«بِالنَّقِيعِ فَثَهْمَدِ»: يسمي موضعين متصلين بالفاء، على سنة المطالع الجاهلية في تعيين الديار بأسمائها، فيصير الطلل مكانًا معروفًا لا صورة عامة."
    - title: "التصريع"
      text: "«فَثَهْمَدِ» و«مَعْبَدِ»: اتفق آخر الشطرين في الوزن والرويّ، وهو التصريع، وبه تُعرف القافية من أول بيت."
    - title: "اختزال النسيب في «أُمِّ مَعْبَدِ»"
      text: "لم يقل «من أهلها»، بل ذكر أم معبد وحدها، فصار خلو الديار خلوّها منها، ثم لا يذكرها بعد. فالمرأة في هذا المطلع علامة على المكان أكثر منها موضوعًا للغزل، والقصيدة تمضي سريعًا إلى الناقة ثم إلى الممدوح."
  connection: "ثم يصف ما بقي في الديار: رياح تلزمها كل عشية، وعيدان الخيام."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "غَشِيتُ / دِيَارَنْبِنْ / نَقِيعِ / فَثَهْمَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — دَوَارِ / سَقَدْ أَقْوَيْ / نَمِنْ أُمْ / مِمَعْبَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "وزن الطويل «فعولن مفاعيلن فعولن مفاعيلن» في كل شطر، و«عروض الطويل تأتي مقبوضة دائمًا» [@atiq، ص29]، والضرب هنا «مقبوضًا كذلك» [@atiq، ص30]، أي «مفاعلن». ودخل القبضُ، وهو حذف الخامس الساكن، «فعولن» مرتين في الصدر ومرة في العجز فصارت «فعولُ» [@atiq، ص29]. والبيت مصرّع، وأُشبعت كسرة الرويّ."
