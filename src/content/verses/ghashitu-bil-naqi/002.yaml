explained: false
first: "أَرَبَّتْ بِهَا الْأَرْوَاحُ كُلَّ عَشِيَّةٍ"
second: "فَلَمْ يَبْقَ إِلَّا آلُ خَيْمٍ مُنَضَّدِ"
vocabulary:
  - term: "أَرَبَّتْ"
    text: "«أي: أقامت بها ولزمتها» [@diwan-zuhayr، ص177]."
  - term: "آلُ خَيْمٍ مُنَضَّدِ"
    text: "الآل جمع آلة، وهو عود له شعبتان يُعرض عليه عود آخر ثم يُلقى عليه الثُّمام فيُستظلّ به، والمنضّد «المجعول بعضه فوق بعض» [@diwan-zuhayr، ص177]."
sources:
