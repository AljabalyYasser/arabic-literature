explained: false
first: "تَاللَّهِ قَدْ عَلِمَتْ سَرَاةُ بَنِي"
second: "ذُبْيَانَ عَامَ الْحَبْسِ وَالْأَصْرِ"
vocabulary:
  - term: "سَرَاةُ"
    text: "«جمع سريّ» [@diwan-zuhayr، ص116]، أي الأشراف."
  - term: "الْحَبْسِ وَالْأَصْرِ"
    text: "«و«الحبس والأصر» والأزل واحد، وهو أن يُحدق العدوّ بالقوم، فيحبسوا أموالهم، ولا يخرجوها إلى الرعي، خشية أن يُغار عليها» [@diwan-zuhayr، ص116]."
sources:
