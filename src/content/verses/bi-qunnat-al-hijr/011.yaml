first: "وَيَقِيكَ مَا وُقِّيَ الْأَكَارِمُ مِنْ"
second: "حُوبٍ تُسَبُّ بِهِ وَمِنْ غَدْرِ"
vocabulary:
  - term: "وُقِّيَ الْأَكَارِمُ"
    text: "«يقول: ليس بفحّاش ولا غادر. فهو يقيك السبّ والغدر، وكلّ ما يُوقّى الأكارم» [@diwan-zuhayr، ص118]."
  - term: "حُوبٍ"
    text: "«الإثم» [@diwan-zuhayr، ص118]."
