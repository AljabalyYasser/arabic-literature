explained: false
first: "وَيَقِيكَ مَا وَقَّى الْأَكَارِمَ مِنْ"
second: "حُوبٍ تُسَبُّ بِهِ وَمِنْ غَدْرِ"
vocabulary:
  - term: "مَا وَقَّى الْأَكَارِمَ"
    text: "ما حمى الكرام. «يقول: ليس بفحّاش ولا غادر. فهو يقيك السبّ والغدر» [@diwan-zuhayr، ص118]. «ويروى «وُقِيَ الأكارمُ»» [@diwan-zuhayr، ص118]، أي إن الأكارم «وُقوا أن يُسبّوا، فيقيك ذلك أنت أيضًا» [@diwan-zuhayr، ص119]."
  - term: "حُوبٍ"
    text: "«الإثم» [@diwan-zuhayr، ص118]."
