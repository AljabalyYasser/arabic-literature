explained: false
first: "دَعْ ذَا وَعَدِّ الْقَوْلَ فِي هَرِمٍ"
second: "خَيْرِ الْبُدَاةِ وَسَيِّدِ الْحَضْرِ"
vocabulary:
  - term: "دَعْ ذَا وَعَدِّ الْقَوْلَ"
    text: "«أي: دع ما أنت فيه من وصف الديار، وعدّ القول في مدح هرم» [@diwan-zuhayr، ص115]، أي اصرفه إليه."
  - term: "خَيْرِ الْبُدَاةِ وَسَيِّدِ الْحَضْرِ"
    text: "«أي: خير أهل البدو، و[سيد أهل] الحضر». «والمعنى أنه خير من حضر وغاب» [@diwan-zuhayr، ص115]. وفي إنشاد حماد عند أبي الفرج: «خَيْرِ الْكُهُولِ وَسَيِّدِ الْحَضْرِ» [@aghani-dk، ج6 ص91]."
