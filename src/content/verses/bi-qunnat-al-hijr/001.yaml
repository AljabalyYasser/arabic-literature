explained: false
first: "لِمَنِ الدِّيَارُ بِقُنَّةِ الْحِجْرِ"
second: "أَقْوَيْنَ مِنْ حِجَجٍ وَمِنْ شَهْرِ"
vocabulary:
  - term: "قُنَّةِ الْحِجْرِ"
    text: "«القنّة»: «أعلى الجبل. وأراد بها هنا: ما أشرف من الأرض». و«الحجر»: «موضع بعينه، وهو حجر اليمامة» [@diwan-zuhayr، ص114]."
  - term: "أَقْوَيْنَ"
    text: "«خلون وأقفرن» [@diwan-zuhayr، ص114]."
  - term: "مِنْ حِجَجٍ وَمِنْ شَهْرِ"
    text: "«و«الحجج»: السنون». «ومعنى «من» ههنا كمعنى منذ»، «ويروى: «من دهر»» [@diwan-zuhayr، ص114]. وفي الشرح المنسوب إلى ثَعْلَب: «وَمِنْ دَهْرِ»، وأبو عمرو: «من حجج ومن شهر»، وأبو عبيدة: «مذ حجج ومذ شهر» [@sharh-thalab-zuhayr، ص76]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص114"
    url: "https://archive.org/details/3917pdf/page/n114/mode/1up"
    note: "من الأبيات 1–3 المختلف فيها: في خبر يرويه أبو الفرج أن حمادًا الراوية أقرّ للمهدي بأنه قائل ما يسبق «دع ذا» (انظر مدخل النص)."
