    text: "«يريد: برزت إليه. وحروف الجرّ قد يبدل بعضها من بعض» [@diwan-zuhayr، ص119]."
  - term: "ضَافِي الْخَلِيقَةِ طَيِّبِ الْخُبْرِ"
    text: "«أي: واسع الخلق»، «أي: حسن المخبر، جميله» [@diwan-zuhayr، ص119]."
