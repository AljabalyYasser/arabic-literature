explained: false
first: "مُتَصَرِّفٍ لِلْمَجْدِ مُعْتَرِفٍ"
second: "لِلنَّائِبَاتِ يُرَاحُ لِلذِّكْرِ"
vocabulary:
  - term: "مُتَصَرِّفٍ لِلْمَجْدِ"
    text: "«أي: يتصرّف في كلّ باب من الخير، لاكتساب المجد» [@diwan-zuhayr، ص119]."
  - term: "مُعْتَرِفٍ"
    text: "«الصابر. أي: يصبر لما نابه من الأمر، ويحتمله» [@diwan-zuhayr، ص119]."
  - term: "يُرَاحُ لِلذِّكْرِ"
    text: "«أي: يهشّ ويخفّ ويطرب، لأن يفعل فعلًا كريمًا، يُذكر به» [@diwan-zuhayr، ص119]."
sources:
