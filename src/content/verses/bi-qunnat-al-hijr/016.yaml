explained: false
first: "وَلَأَنْتَ أَشْجَعُ حِينَ تَتَّجِهُ الْـ"
second: "ـأَبْطَالُ مِنْ لَيْثٍ أَبِي أَجْرِي"
vocabulary:
  - term: "تَتَّجِهُ الْأَبْطَالُ"
    text: "«أي: يواجه بعضهم بعضًا في الحرب» [@diwan-zuhayr، ص120]."
  - term: "أَبِي أَجْرِي"
    text: "«و«الأجري»: جمع جرو، وهو ولد الأسد. وإنما جعل الليث ذا أجر، لأنّ ذلك أجرأ [له] وأعدى على ما يريده» [@diwan-zuhayr، ص120]."
