explained: false
first: "لَعِبَ الزَّمَانُ بِهَا وَغَيَّرَهَا"
second: "بَعْدِي سَوَافِي الْمُورِ وَالْقَطْرِ"
vocabulary:
  - term: "لَعِبَ الزَّمَانُ"
    text: "وفي الشرح المنسوب إلى ثَعْلَب: «لَعِبَ الرِّيَاحُ بِهَا»، وقبله: «وروى أبو عبيدة والأصمعيّ» [@sharh-thalab-zuhayr، ص76]."
  - term: "سَوَافِي الْمُورِ وَالْقَطْرِ"
    text: "«و«السوافي»: جمع سافية، وهي الريح الشديدة التي تسفي التراب، أي: تطيره. و«المور»: التراب» [@diwan-zuhayr، ص115]. «وعطف «القطر» على «المور» لقرب جواره منه، وحقّه أن يعطف على السوافي» [@diwan-zuhayr، ص115]."
sources:
