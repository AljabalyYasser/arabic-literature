explained: false
first: "قَفْرًا بِمُنْدَفَعِ النَّحَائِتِ مِنْ"
second: "ضَفْوَى أُولَاتِ الضَّالِ وَالسِّدْرِ"
vocabulary:
  - term: "قَفْرًا"
    text: "خالية."
  - term: "مُنْدَفَعِ النَّحَائِتِ"
    text: "النحائت: «آبار معروفة. وليس كلّ الآبار تسمّى النحائت» [@diwan-zuhayr، ص115]. والمندفع: حيث يندفع الماء أو الوادي."
  - term: "ضَفْوَى"
    text: "«موضع». «و«النحائت وضفوى» من بلاد غطفان» [@diwan-zuhayr، ص115]."
  - term: "أُولَاتِ الضَّالِ وَالسِّدْرِ"
    text: "«ومعناه: ذوات الضال». «والضال: السدر البرّيّ» [@diwan-zuhayr، ص115]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص115"
    url: "https://archive.org/details/3917pdf/page/n115/mode/1up"
    note: "من الأبيات 1–3 المختلف فيها: في خبر يرويه أبو الفرج أن حمادًا الراوية أقرّ للمهدي بأنه قائل ما يسبق «دع ذا» (انظر مدخل النص)."
