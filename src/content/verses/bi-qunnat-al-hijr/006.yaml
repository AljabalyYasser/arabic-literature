explained: false
first: "أَنْ نِعْمَ مُعْتَرَكُ الْجِيَاعِ إِذَا"
second: "خَبَّ السَّفِيرُ وَسَابِئُ الْخَمْرِ"
vocabulary:
  - term: "مُعْتَرَكُ الْجِيَاعِ"
    text: "«أي: موضع اجتماعهم ومزدحمهم. وأصله في الحرب، فاستعاره هنا» [@diwan-zuhayr، ص116]."
  - term: "خَبَّ السَّفِيرُ"
    text: "«أي: إذا اشتدّ الزمان وتحاتّ ورق الشجر، فسارت به الريح». «والسفير: الورق تسفره الريح، أي: تطيره» [@diwan-zuhayr، ص116]. والخبب: ضرب من العدو."
  - term: "سَابِئُ الْخَمْرِ"
    text: "«مشتريها. ولا يستعمل إلا في الخمر خاصّة». «وإنما وصفه بسباء الخمر، في شدّة الزمان، ليدلّ على كرمه وتناهي جوده» [@diwan-zuhayr، ص116]."
sources:
