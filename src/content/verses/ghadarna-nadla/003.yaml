explained: false
first: "تَذَاءَبَ وَرْدٌ عَلَى إِثْرِهِ"
second: "وَأَدْرَكَهُ وَقْعُ مُرْدٍ خَشِبْ"
vocabulary:
- term: "تَذَاءَبَ"
  text: "أتاه من كل جهة: «التذاؤب الإتيان من كل وجه، وأصله في الذئب، إذا حذر من وجه أتى من» آخر [@diwan-antara، ص294]."
- term: "وَرْدٌ"
  text: "هو «ورد بن حابس» [@diwan-antara، ص294]."
- term: "مُرْدٍ خَشِبْ"
  text: "سيف مُهلك صقيل: «والمردي المهلك»، «والخشب هنا الصقيل الماضي، وأصله الذي طبع ولم يصنع» [@diwan-antara، ص294]."
sources:
- source: "diwan-antara"
  loc: "ص294"
