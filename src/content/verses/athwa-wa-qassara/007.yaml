explained: false
first: "يَلْوِينَنِي دَيْنِي النَّهَارَ وَأَجْتَزِي"
second: "دَيْنِي إِذَا وَقَذَ النُّعَاسُ الرُّقَّدَا"
vocabulary:
  - term: "يَلْوِينَنِي دَيْنِي"
    text: "يمطُلنني حقّي: «قَالَ أَبو عُبَيْدٍ: اللَّيُّ هُوَ المَطْل» [@lisan، ج15 ص263]، وفيه البيت برواية «وأَقْتَضِي»."
  - term: "وَقَذَ النُّعَاسُ الرُّقَّدَا"
    text: "صرعهم النعاس: «وَقَذه يَقِذُه وَقْذاً: ضَرَبَهُ حَتَّى استَرْخى» [@lisan، ج3 ص519]. يقول: يمنعنني حقي نهارًا، ويقضينه ليلًا إذا نام الناس."
