explained: false
first: "ضَمِنَتْ لَنَا أَعْجَازُهُنَّ قُدُورَنَا"
second: "وَضُرُوعُهُنَّ لَنَا الصَّرِيحَ الأَجْرَدَا"
vocabulary:
  - term: "أَعْجَازُهُنَّ"
    text: "مآخيرهن، وهي أسمن ما فيها."
  - term: "الصَّرِيحَ"
    text: "اللبن الخالص: «الصَّرَحُ والصَّرِيحُ ...: المَحْضُ الخالصُ مِنْ كُلِّ شَيْءٍ» [@lisan، ج2 ص509]."
  - term: "الأَجْرَدَا"
    text: "الصافي. قال شوقي ضَيْف: «الصريح: اللبن الخالص. الأجرد: الصافى» [@deif، ج1 ص334]."
