explained: false
first: "وَكَأَنَّهَا ذُو جُدَّةٍ غِبَّ السُّرَى"
second: "أَوْ قَارِحٌ يَتْلُو نَحَائِصَ جُدَّدَا"
vocabulary:
  - term: "ذُو جُدَّةٍ"
    text: "حمار وحش في ظهره خطّ. يقول المحقق: «الجدة (بضم الجيم) العلامة والخطة في ظهر حمار الوحش» [@diwan-asha، ص265]."
  - term: "غِبَّ السُّرَى"
    text: "بعد سير الليل."
  - term: "قَارِحٌ"
    text: "الحمار المسنّ القويّ: «والقارحُ مِنْ ذِي الْحَافِر» بمنزلة البازل من الإبل [@lisan، ج2 ص559]."
  - term: "نَحَائِصَ"
    text: "«النَّحُوص: الأَتان الوحشيةُ الْحَائِلُ» [@lisan، ج7 ص95]، أي التي لم تحمل."
