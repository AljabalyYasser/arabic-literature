explained: false
first: "وَشِمِلَّةٍ حَرْفٍ كَأَنَّ قُتُودَهَا"
second: "جَلَّلْتُهُ جَوْنَ السَّرَاةِ خَفَيْدَدَا"
vocabulary:
  - term: "شِمِلَّةٍ حَرْفٍ"
    text: "ناقة خفيفة صلبة. «والحَرْفُ: النَّاقَةُ» الضامرة الصلبة [@lisan، ج3 ص221]."
  - term: "قُتُودَهَا"
    text: "«والقَتَدُ والقِتْدُ ...: خَشَبُ الرَّحْلِ» [@lisan، ج3 ص342]."
  - term: "جَوْنَ السَّرَاةِ"
    text: "أسود الظهر: «الجَوْنُ: الأَسْوَدُ اليَحْمُوميُّ» [@lisan، ج13 ص101]، و«سَرَاةِ كلِّ شَيْءٍ» أعلاه [@lisan، ج14 ص378]."
  - term: "خَفَيْدَدَا"
    text: "الظليم السريع: «والخَفَيْفَدُ والخَفَيْدَدُ: السَّرِيعُ» [@lisan، ج3 ص163]. يقول: كأني وضعت رحلها على ظليم أسود الظهر."
