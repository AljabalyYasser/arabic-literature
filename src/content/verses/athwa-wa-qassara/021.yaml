first: "وَكَأَنَّهُ هِقْلٌ يُبَارِي هِقْلَةً"
second: "رَمْدَاءَ فِي خِيطٍ نَقَانِقَ أَرْمَدَا"
vocabulary:
  - term: "هِقْلٌ ... هِقْلَةً"
    text: "«الهِقْلُ: الفتيُّ مِنَ النَّعام» [@lisan، ج11 ص700]، والهقلة أنثاه."
  - term: "رَمْدَاءَ"
    text: "رمادية اللون."
  - term: "خِيطٍ نَقَانِقَ"
    text: "جماعة من ذكور النعام، و«والنَّقْنَقُ: الظَّلِيمُ» [@lisan، ج10 ص360]."
