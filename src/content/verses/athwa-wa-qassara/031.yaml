explained: false
first: "مَا بَيْنَ عَانَةَ وَالفُرَاتِ كَأَنَّمَا"
second: "حَشَّ الغُوَاةُ بِهَا حَرِيقًا مُوقَدَا"
vocabulary:
  - term: "عَانَةَ"
    text: "بلد على الفرات: «وعانَةُ: قَرْيَةٌ مِنْ قُرى» الجزيرة [@lisan، ج13 ص300]."
  - term: "حَشَّ"
    text: "أوقد: «وحَشَّ النارَ يَحُشُّها حَشّاً: جَمَعَ إِليها مَا تَفَرَّقَ مِنَ الْحَطَبِ، وَقِيلَ: أَوقدها» [@lisan، ج6 ص284]."
