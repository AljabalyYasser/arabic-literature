explained: false
first: "وَإِذَا يَلُوثُ لُغَامَهُ بِسَدِيسِهِ"
second: "ثَنَّى فَهَبَّ هِبَابُهُ وَتَزَيَّدَا"
vocabulary:
  - term: "يَلُوثُ لُغَامَهُ"
    text: "يدير زبده، من «ولاثَ الشيءَ لَوْثاً: أَداره مَرَّتَيْنِ» [@lisan، ج2 ص186]، و«ولُغَام الْبَعِيرِ: زَبَدُه» [@lisan، ج12 ص545]."
  - term: "سَدِيسِهِ"
    text: "السن التي قبل الناب: «والسَّدِيس: السِّنُّ الَّتِي» [@lisan، ج6 ص104] بعد الرَّباعية."
  - term: "هِبَابُهُ"
    text: "«والهِبابُ: النَّشاطُ» [@lisan، ج1 ص778]."
  - term: "تَزَيَّدَا"
    text: "أسرع في سيره، والتزيد من مراتب السير: «ثُمَّ العَنَقُ، ثُمَّ التَزَيُّدُ» [@lisan، ج1 ص760]."
