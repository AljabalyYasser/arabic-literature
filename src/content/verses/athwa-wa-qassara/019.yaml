explained: false
first: "وَعُذَافِرٍ سَدَسٍ تَخَالُ مَحَالَهُ"
second: "بُرْجًا تُشَيِّدُهُ النَّبِيطُ القَرْمَدَا"
vocabulary:
  - term: "عُذَافِرٍ"
    text: "جمل عظيم شديد: «جَمَلٌ عُذافِرٌ وعَذَوْفَرٌ» [@lisan، ج4 ص555]."
  - term: "سَدَسٍ"
    text: "في سنته الثامنة. يقول المحقق: «السدس قبل البازل في نحو الثامنة من عمره» [@diwan-asha، ص265]."
  - term: "مَحَالَهُ"
    text: "فقار ظهره: «والمَحالة: الفَقارة» [@lisan، ج11 ص620]."
  - term: "النَّبِيطُ"
    text: "قوم من العجم بسواد العراق."
  - term: "القَرْمَدَا"
    text: "«القَرْمَد: كُلُّ مَا طُلِيَ بِهِ؛ زَادَ الأَزهري: للزينة كالجَصِّ» [@lisan، ج3 ص352]."
