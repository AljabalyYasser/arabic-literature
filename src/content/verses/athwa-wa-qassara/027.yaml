explained: false
first: "إِلَّا كَخَارِجَةَ المُكَلِّفِ نَفْسَهُ"
second: "وَابْنَيْ قَبِيصَةَ أَنْ أَغِيبَ وَيَشْهَدَا"
vocabulary:
  - term: "كَخَارِجَةَ"
    text: "قال أبو سعيد فيما ينقل اللسان: «أَراد: كَخَيْرَجَانَ مَلِكِ فَارِسَ، فَسَمَّاهُ خَارِجَةَ» [@lisan، ج3 ص346]. ويقول المحقق: «أما خارجة وابنا قبيصة فنحن لا نعرفهما» [@diwan-asha، ص267]."
  - term: "أَنْ أَغِيبَ وَيَشْهَدَا"
    text: "أن يحضر حين أغيب. وفي البيتين تقديم وتأخير، والتقدير عند المحقق: إلا كخارجة المكلّف نفسه أن أغيب ويشهد، وابنَي قبيصة أن يأتياك برهنهم [@diwan-asha، ص267]."
