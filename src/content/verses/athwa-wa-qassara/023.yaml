explained: false
first: "أَذْهَبْتُهُ بِمَهَامِهٍ مَجْهُولَةٍ"
second: "لَا يَهْتَدِي بُرْتٌ بِهَا أَنْ يَقْصِدَا"
vocabulary:
  - term: "مَهَامِهٍ"
    text: "«والمَهْمَهُ: المفازةُ الْبَعِيدَةُ، وَالْجَمْعُ المَهامِهُ» [@lisan، ج13 ص542]."
  - term: "بُرْتٌ"
    text: "«يُقَالُ لِلدَّلِيلِ الْحَاذِقِ البُرْتُ والبِرْتُ» [@lisan، ج2 ص10]، وفيه البيت برواية «أَدْأَبْتُهُ»."
