first: "جَعَلَ الإِلَٰهُ طَعَامَنَا فِي مَالِنَا"
second: "رِزْقًا تَضَمَّنَهُ لَنَا لَنْ يَنْفَدَا"
meaning: "جعل الله طعامنا في إبلنا، رزقًا كفله لنا لا ينقطع، فلا ننتظر زرعًا كما تنتظر إياد. وفي حاشية شوقي ضَيْف: «المال هنا: الإبل» [@deif، ج1 ص334]."
vocabulary:
  - term: "الإِلَٰهُ"
    text: "«الإِلَهُ: اللَّهُ عَزَّ وَجَلَّ، وَكُلُّ مَا اتُّخِذَ مِنْ دُونِهِ مَعْبُودًا إلَهٌ عِنْدَ مُتَّخِذِهِ» [@lisan، ج13 ص467]."
  - term: "مَالِنَا"
    text: "إبلنا: «وأَكثر مَا يُطلق الْمَالُ عِنْدَ الْعَرَبِ عَلَى الإِبل لأَنها كَانَتْ أَكثر أَموالهم» [@lisan، ج11 ص636]."
  - term: "تَضَمَّنَهُ"
    text: "كفله: «ضَمِنَ الشيءَ وَبِهِ ضَمْناً وضَمَاناً: كَفَل بِهِ» [@lisan، ج13 ص257]."
  - term: "يَنْفَدَا"
    text: "يفنى: «نَفِدَ الشيءُ نَفَداً ونَفاداً: فَنِيَ وذهَب» [@lisan، ج3 ص424]."
context: "قلب المقابلة: بعد إياد التي تنتظر الحصاد، يذكر قومه الذين طعامهم في إبلهم. يقول شوقي ضَيْف: «أما هم فما لهم الإبل التى لا تنفد» [@deif، ج1 ص334]. وذكر «الإله» هنا لا يدل على دين بعينه، فالكلمة في اللسان تقع على الله وعلى كل معبود. ويرى شوقي ضَيْف أن الأَعْشَى «لم يكن نصرانيّا، إنما كان وثنيّا على دين آبائه» [@deif، ج1 ص339]."
syntax:
  - "«جَعَلَ» بمعنى صيّر، و«الإِلَٰهُ» فاعل، و«طَعَامَنَا» مفعول به أول، و«فِي مَالِنَا» جار ومجرور في موضع المفعول الثاني."
  - "«رِزْقًا» حال من «طعامنا»، أي: جعله فيها رزقًا. ويجوز أن يكون هو المفعول الثاني، و«في مالنا» متعلقًا به."
  - "جملة «تَضَمَّنَهُ لَنَا» صفة لـ«رزقًا»، وفاعلها ضمير يعود على «الإله». وجملة «لَنْ يَنْفَدَا» صفة ثانية، و«لن» حرف نفي ونصب واستقبال، والألف للإطلاق."
morphology:
  - "«الإِلَٰه» على «فِعَال» بمعنى مفعول، أي المعبود."
  - "«تَضَمَّنَ» على «تَفَعَّلَ»، من الضمان."
  - "«يَنْفَدُ» مضارع «نَفِدَ» على «فَعِلَ يَفْعَلُ»."
rhetoric:
  thesis: "فخر بالرزق المكفول: قوم الشاعر لا يعملون في الأرض، فطعامهم يمشي معهم. والبيت جواب البيت 33: هناك زرع يُنتظر، وهنا إبل حاضرة."
  devices:
    - title: "الإجمال ثم التفصيل"
      text: "قال هنا «طَعَامَنَا فِي مَالِنَا» مجملًا، ثم فصّله في البيتين التاليين: إبل كالهضاب تُنحر للضيف، وأعجاز تملأ القدور، وضروع تسقي اللبن الخالص. فالسامع يعرف الحكم أولًا، ثم يرى صورته."
    - title: "المقابلة"
      text: "بين «طَعَامَنَا فِي مَالِنَا» وقوله في إياد «تَنْظُرُ حَبَّهَا أَنْ يُحْصَدَا». والمقابلة: أن يؤتى بمعنيين ثم بما يقابلهما. فرزق إياد مؤجل ينتظر الحصاد، ورزق قومه حاضر مكفول «لَنْ يَنْفَدَا»."
  connection: "ثم يصف هذه الإبل: ضخمة كالهضاب، تُنحر بسيوفهم، ولا يجرؤ أحد على طردها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المفتوحة، موصولة بألف الإطلاق"
  scansion: "جَعَلَ لْإِلَا / هُ طَعَامَنَا / فِي مَالِنَا = متَفاعلن / متَفاعلن / مُتْفاعلن — رِزْقَنْ تَضَمْ / مَنَهُو لَنَا / لَنْ يَنْفَدَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، ثلاث تفعيلات فصارت «مُتْفاعلن». وأُشبعت ضمة الهاء في «تَضَمَّنَهُ» فصارت «تَضَمَّنَهُو»."
