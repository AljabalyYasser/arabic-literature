first: "أَثْوَى وَقَصَّرَ لَيْلَةً لِيُزَوَّدَا"
second: "فَمَضَتْ وَأَخْلَفَ مِنْ قُتَيْلَةَ مَوْعِدَا"
meaning: "أقام الشاعر ليلة، وكفّ فيها عن سفره ليتزوّد من لقاء قُتَيْلة قبل الرحيل، فانقضت الليلة ولم تأتِ، فوجد موعدها خُلفًا. ويتحدث عن نفسه بضمير الغائب. وفي اللسان في قوله «فمضت»: «أَي مَضَتِ اللَّيْلَةُ» [@lisan، ج9 ص94]."
vocabulary:
  - term: "أَثْوَى"
    text: "أقام: «وأَثْوَيت بِالْمَكَانِ: لُغَةٌ فِي ثَوَيْت» [@lisan، ج14 ص125]، و«الثَّواءُ: طولُ المُقام» [@lisan، ج14 ص125]."
  - term: "قَصَّرَ"
    text: "كفّ عن السفر وانتهى عنه: «قَصَرَ عَنِ الأَمر يَقْصُر قُصُوراً وأَقْصَر وقَصَّرَ وتَقَاصَر، كُلُّهُ: انْتَهَى» [@lisan، ج5 ص98]. ويقول المحقق: «قصر توانى» [@diwan-asha، ص263]."
  - term: "لِيُزَوَّدَا"
    text: "ليُعطى الزاد: «الزَّوْد: تأْسيس الزَّادِ وَهُوَ طَعَامُ السَّفَرِ وَالْحَضَرِ جَمِيعًا» [@lisan، ج3 ص198]، وزاده هنا لقاء صاحبته."
  - term: "أَخْلَفَ ... مَوْعِدَا"
    text: "وجد موعدها غير منجَز: «وأَخْلَفَه: وجدَ مَوْعِدَه خُلْفاً» [@lisan، ج9 ص94]، وأنشد صاحب اللسان هذا البيت."
  - term: "قُتَيْلَةَ"
    text: "اسم صاحبته، وتعود في البيت العاشر، وهي أيضًا صاحبة القصيدة 29 في الديوان."
context: "مطلع القصيدة، وأول مقطع الغزل (1–12) الذي ينتهي بسؤال قُتَيْلة وجواب الشاعر. وعنوانها في الديوان: «وقال الأعشى لكسرى حين أراد منهم رهائن، لما أغار الحارث بن وعلة على بعض السواد» [@diwan-asha، ص263]، فالغزل هنا مقدمة لرسالة وعيد. وفي اللسان أن أبا عُبَيْد روى البيت «عَنْ أَبي عُبَيْدَةَ أَنه أَنشده قَوْلَ الأَعشى» [@lisan، ج14 ص126]، وهذا يوافق ما ينقله شوقي ضَيْف من أن القصيدة من رواية أبي عُبَيْدة البصري [@deif، ج1 ص340]."
syntax:
  - "«أَثْوَى» فعل ماض، وفاعله ضمير مستتر يعود على الشاعر. والجملة خبر لا استفهام في رواية أبي عُبَيْدة: «قَالَ شِمْرٌ: أَثْوَى عَنْ غَيْرِ اسْتِفْهَامٍ وَإِنَّمَا يُرِيدُ الْخَبَرَ» [@lisan، ج14 ص126]. و«قَصَّرَ» معطوف عليه."
  - "«لَيْلَةً» ظرف زمان منصوب متعلق بـ«قصّر». و«لِيُزَوَّدَا» اللام للتعليل، والفعل مضارع مبني للمجهول منصوب بـ«أن» مضمرة بعد اللام، ونائب الفاعل ضمير الشاعر، والألف للإطلاق، وهي الألف التي تُمدّ بها حركة الرَّوِيّ في آخر البيت."
  - "«فَمَضَتْ» فاعله ضمير يعود على الليلة، والفاء للتعقيب: انقضت الليلة عقب انتظاره."
  - "«وَأَخْلَفَ مِنْ قُتَيْلَةَ مَوْعِدَا»: فاعل «أخلف» ضمير الشاعر، و«موعدًا» مفعول به، و«من قتيلة» متعلق بـ«أخلف»، و«قُتَيْلَة» مجرورة بالفتحة لأنها ممنوعة من الصرف للعلمية والتأنيث."
morphology:
  - "«أَثْوَى» على «أَفْعَلَ» من الثَّواء، وهي و«ثَوَى» بمعنى. قال أبو منصور الأزهري: «وَالرِّوَايَتَانِ تَدُلَّانِ عَلَى أَن ثَوَى وأَثْوَى مَعْنَاهُمَا أَقام» [@lisan، ج14 ص126]."
  - "«قَصَّرَ» على «فَعَّلَ». و«يُزَوَّدُ» مضارع «زَوَّدَ» المبني للمجهول، من الزاد."
  - "«قُتَيْلَة» على صيغة التصغير «فُعَيْلة». و«مَوْعِد» على «مَفْعِل» من وَعَدَ."
rhetoric:
  thesis: "مطلع يبدأ بخيبة: ليلة اقتُطعت من السفر للقاء لم يتم. وهو غزل في قصيدة غرضها الوعيد، على عادة القصيدة الجاهلية في تقديم الغزل بين يدي غرضها."
  devices:
    - title: "الالتفات"
      text: "في «أَثْوَى ... وَقَصَّرَ ... وَأَخْلَفَ» يتحدث الشاعر عن نفسه بضمير الغائب، ثم يعود إلى ضمير المتكلم في البيت الثالث «حِينَ شِبْتُ هَجَرْنَنِي». والالتفات: الانتقال في الكلام من الغيبة إلى الخطاب أو التكلم، أو العكس. فكأنه ينظر إلى نفسه من بعيد في ليلة الخيبة، ثم يتكلم بلسانه حين يشكو هجر الغواني."
    - title: "الاستعارة"
      text: "في «لِيُزَوَّدَا» جعل لقاء الحبيبة زادًا يتزوده المسافر. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. فلم يقل: أردت لقاءها كأنه زاد، بل أعار اللقاء اسم الزاد، فصار الوداع طعام الطريق."
    - title: "التصريع"
      text: "ختم الصدر بـ«لِيُزَوَّدَا» على قافية العجز «مَوْعِدَا». والتصريع عند ابن رَشِيق: «ما كانت عروض البيت فيه تابعة لضربه: تنقص بنقصه، وتزيد بزيادته» [@ibn-rashiq، ج1 ص173]. والعَرُوض آخر تفعيلة في الصدر، والضَّرْب آخر تفعيلة في العَجُز."
  connection: "ثم يمضي لحاجته وقد صار حبلها باليًا، بعد أن ظن أنه لن يُحرم وصلها."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المفتوحة، موصولة بألف الإطلاق"
  scansion: "أَثْوَى وَقَصْ / صَرَ لَيْلَتَنْ / لِيُزَوْوَدَا = مُتْفاعلن / متَفاعلن / متَفاعلن — فَمَضَتْ وَأَخْ / لَفَ مِنْ قُتَيْ / لَةَ مَوْعِدَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "وزن الكامل «متَفاعلن» ست مرات. ودخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلة الأولى من الصدر فصارت «مُتْفاعلن». والعَرُوض والضَّرْب تامّان «متَفاعلن»، والبيت مصرّع."
variants:
  - reading: "أَثَوَى وَقَصَّرَ لَيْلَةً لِيُزَوَّدَا"
    status: "رواية ابن الأعرابي"
    note: "بهمزة الاستفهام: «وَرَوَاهُ ابْنُ الأَعرابي أَثَوَى عَلَى الِاسْتِفْهَامِ» [@lisan، ج14 ص126]، أي: أثَوَى ليلة؟ والمعنى عندئذ سؤال الشاعر نفسه."
  - reading: "أَثْوَى وَقَصَّرَ لَيْلَهُ لِيُزَوَّدَا"
    status: "رواية في اللسان"
    note: "هكذا أنشده صاحب اللسان مرتين، في رواية أبي عُبَيْدة وفي موضع آخر [@lisan، ج14 ص125–126]، أي قصّر ليلته كلها."
  - reading: "فَمَضَى وَأَخْلَفَ مِنْ قُتَيْلَةَ مَوْعِدَا"
    status: "رواية ابن بَرِّيّ"
    note: "قال: «وَيُرْوَى فَمَضَى، قَالَ: وَقَوْلُهُ فَمَضَى الضَّمِيرُ يَعُودُ عَلَى الْعَاشِقِ» [@lisan، ج9 ص94]، أي مضى الشاعر لسفره. وفي موضع آخر من اللسان: «ومَضَى وأَخْلَفَ» [@lisan، ج14 ص125]."
