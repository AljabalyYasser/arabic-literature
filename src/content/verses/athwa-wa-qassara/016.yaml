first: "أَوْ صَعْلَةٌ بِالقَارَتَيْنِ تَرَوَّحَتْ"
second: "رَبْدَاءُ تَتَّبِعُ الظَّلِيمَ الأَرْبَدَا"
vocabulary:
  - term: "صَعْلَةٌ"
    text: "نعامة صغيرة الرأس."
  - term: "القَارَتَيْنِ"
    text: "موضع، والقارة: «الجُبَيْلُ الصَّغِيرُ» [@lisan، ج5 ص121]."
  - term: "رَبْدَاءُ ... الأَرْبَدَا"
    text: "«الرَّبداءُ السَّوْدَاءُ» [@lisan، ج3 ص170]، والأربد الذكر في لونه غبرة."
  - term: "الظَّلِيمَ"
    text: "«والظَّلِيمُ: الذكَرُ» من النعام [@lisan، ج12 ص379]."
