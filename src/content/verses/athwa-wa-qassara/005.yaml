explained: false
first: "بَلْ لَيْتَ شِعْرِي هَلْ أَعُودَنْ نَاشِئًا"
second: "مِثْلِي زُمَيْنَ أَحُلُّ بُرْقَةَ أَنْقَدَا"
vocabulary:
  - term: "لَيْتَ شِعْرِي"
    text: "ليتني أعلم."
  - term: "نَاشِئًا"
    text: "غلامًا حدثًا: «غلامٌ ناشِئٌ وَجَارِيَةٌ ناشِئةٌ» [@lisan، ج1 ص171]."
  - term: "زُمَيْنَ أَحُلُّ بُرْقَةَ أَنْقَدَا"
    text: "زمنَ كنت أنزل بُرقة أنقد، وهي موضع. وفي اللسان: «زُمَيْنَ هَنا بِبُرْقةِ أَنْقَدا» [@lisan، ج15 ص485]."
