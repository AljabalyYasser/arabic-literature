first: "وَمَضَى لِحَاجَتِهِ وَأَصْبَحَ حَبْلُهَا"
second: "خَلَقًا وَكَانَ يَظُنُّ أَنْ لَنْ يُنْكَدَا"
vocabulary:
  - term: "خَلَقًا"
    text: "باليًا: «وَقَدْ خَلُق الثَّوْبُ» إذا بلي [@lisan، ج10 ص89]، أي انقطع وصلها."
  - term: "يُنْكَدَا"
    text: "يُحرم ويُمنع، من «ونَكِدَ الرجلُ نَكَداً» إذا قلّ خيره؛ والنَّكَد: «الشؤْمُ واللؤْمُ» [@lisan، ج3 ص427]."
