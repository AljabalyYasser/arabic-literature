vocabulary:
  - term: "عَلَى مَا خَيَّلَتْ"
    text: "على ما شبّهت لنا أنفسنا، أي على كل حال: «عَلَى مَا خَيَّلت أَي مَا شَبَّهَتْ يَعْنِي عَلَى غَرَر مِنْ غَيْرِ يَقِينٍ» [@lisan، ج11 ص227]."
