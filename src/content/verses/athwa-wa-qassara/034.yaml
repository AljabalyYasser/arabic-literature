first: "قَوْمًا يُعَالِجُ قُمَّلًا أَبْنَاؤُهُمْ"
second: "وَسَلَاسِلًا أُجُدًا وَبَابًا مُؤْصَدَا"
meaning: "يصف إيادًا: قوم يشتغل أبناؤهم بمعالجة القمل، وتقيدهم سلاسل محكمة، وتُغلق دونهم الأبواب. وفي تلخيص المحقق: «خاملين يقطعون الوقت فى معالجة القمل المنتشر فى أبدانهم، وقد أوثقوا بالسلاسل، وغلقت دونهم الأبواب» [@diwan-asha، ص266]."
vocabulary:
  - term: "يُعَالِجُ"
    text: "يزاول: «وعالَج الشيءَ مُعالجة وَعِلَاجًا: زَاوَلَهُ» [@lisan، ج2 ص327]."
  - term: "قُمَّلًا"
    text: "في اللسان: «والقُمَّلُ: صِغار الذَّرِّ والدَّبى»، ثم «وَقِيلَ: القُمَّل دَوَابُّ صِغَارٌ مِنْ جِنْسِ القِرْدان إِلَّا أَنها أَصغر مِنْهَا، وَاحِدَتُهَا قُمَّلة، تَرْكَبُ الْبَعِيرَ عِنْدَ الهُزال»، وعلى هذا أنشد البيت، ثم قال: «وَقِيلَ: القُمَّل قَمْل النَّاسِ وَلَيْسَ بِشَيْءٍ» [@lisan، ج11 ص569]. والقِرْدان: دويبات تعلق بالإبل. أما المحقق فيفسره بقمل الأبدان."
  - term: "أُجُدًا"
    text: "محكمة وثيقة، من «مُقَوًّى وَثِيقٌ مُحْكَمٌ»، ويقال للناقة: «وأُجُدٌ: مُتصلة الفَقار» [@lisan، ج3 ص70]."
  - term: "مُؤْصَدَا"
    text: "مغلقًا: «وآصَدَه: أَغْلَقَه، فَهُوَ مُوصَدٌ» [@lisan، ج3 ص460]."
context: "البيت الثاني من مقطع الفخر على إياد (33–37)، وفيه يكمل صورتها قبل أن ينتقل إلى قومه. ولم ينشده شوقي ضَيْف مع الأبيات 33 و35–37 حين استشهد بها [@deif، ج1 ص334]."
syntax:
  - "«قَوْمًا» منصوب، ولعله على إضمار فعل تقديره «أعني» أو «أذمّ»، أو هو بدل من محل «كَمَنْ» في البيت السابق لأنه خبر «ليس». والنصب بفعل مضمر طريقة عربية يذكرها عبد القاهر: «وكما يضمرون المبتدأ فيرفعون، قد يضمرون الفعل فينصبون» [@dalail، ص147]."
  - "«يُعَالِجُ قُمَّلًا أَبْنَاؤُهُمْ» جملة صفة لـ«قومًا»، و«أبناؤهم» فاعل مؤخر، و«قُمَّلًا» مفعول به مقدم عليه."
  - "«وَسَلَاسِلًا» و«وَبَابًا» معطوفان على «قُمَّلًا»، فأبناؤهم يعالجون السلاسل والأبواب أيضًا. و«أُجُدًا» صفة لـ«سلاسل»، و«مُؤْصَدَا» صفة لـ«بابًا»، والألف للإطلاق."
morphology:
  - "«سَلَاسِل» جمع «سِلْسِلَة» على «فَعَالِل»، وهي صيغة ممنوعة من الصرف، ونُوّنت هنا «سَلَاسِلًا» لإقامة الوزن، وهو ما يسمى صرف الممنوع من الصرف للضرورة."
  - "«قُمَّل» على «فُعَّل». و«أُجُد» على «فُعُل» وصفًا."
  - "«مُؤْصَد» اسم مفعول من «آصَدَ» على «أَفْعَلَ»، ويقال من «أَوْصَدَ»: «مُوصَد» [@lisan، ج3 ص460]."
rhetoric:
  thesis: "صورة ساخرة لإياد: لا خيل ولا غارة، بل أبناء مشغولون بالقمل محبوسون وراء السلاسل والأبواب. وهي نقيض ما سيقوله عن إبل قومه التي «لن تُطرد»."
  devices:
    - title: "الكناية"
      text: "في «سَلَاسِلًا أُجُدًا وَبَابًا مُؤْصَدَا» يذكر القيد والباب المغلق، فيدل بهما على حياة الحبس والإقامة والذل. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]. ويأخذه المحقق على ظاهره: «وقد أوثقوا بالسلاسل» [@diwan-asha، ص266]."
    - title: "الجمع بين المختلفات"
      text: "عطف «سَلَاسِلًا» و«بَابًا» على «قُمَّلًا» تحت فعل واحد «يُعَالِجُ»، فجمع الحقير والثقيل في شغل واحد، وفي هذا الجمع سخرية: حياتهم كلها معالجة لما يؤذي ويحبس."
  connection: "ثم يقابلهم بقومه: «جَعَلَ الإِلَٰهُ طَعَامَنَا فِي مَالِنَا»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المفتوحة، موصولة بألف الإطلاق"
  scansion: "قَوْمَنْ يُعَا / لِجُ قُمْمَلَنْ / أَبْنَاؤُهُمْ = مُتْفاعلن / متَفاعلن / مُتْفاعلن — وَسَلَاسِلَنْ / أُجُدَنْ وَبَا / بَنْ مُؤْصَدَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، ثلاث تفعيلات فصارت «مُتْفاعلن». وتنوين «سَلَاسِلًا» أقام التفعيلة الأولى من العَجُز «متَفاعلن»، ولو مُنعت من الصرف لانكسر الوزن."
variants:
  - reading: "قَوْمًا تُعَالِجُ قُمَّلًا أَبْنَاؤُهُمْ"
    status: "رواية اللسان"
    note: "بالتاء [@lisan، ج11 ص569]، على تأنيث الجمع."
