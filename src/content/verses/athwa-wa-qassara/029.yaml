explained: false
first: "كَلَّا يَمِينَ اللَّهِ حَتَّى تُنْزِلُوا"
second: "مِنْ رَأْسِ شَاهِقَةٍ إِلَيْنَا الأَسْوَدَا"
vocabulary:
  - term: "شَاهِقَةٍ"
    text: "«والشاهِقُ: الْجَبَلُ الْمُرْتَفِعُ» [@lisan، ج10 ص192]."
  - term: "الأَسْوَدَا"
    text: "في اللسان: «والأَسودُ: عَلَمٌ فِي رأْس جَبَلٍ»، وأنشد البيت [@lisan، ج3 ص231]. ويقول المحقق: «الأسود هو أخو الحوفزان، كان في يد كسرى في رهن قيس بن مسعود» [@diwan-asha، ص267]."
