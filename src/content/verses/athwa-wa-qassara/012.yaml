explained: false
first: "أَمْ غَابَ رَبُّكَ فَاعْتَرَتْكَ خَصَاصَةٌ"
second: "فَلَعَلَّ رَبَّكَ أَنْ يَعُودَ مُؤَيَّدَا"
vocabulary:
  - term: "رَبُّكَ"
    text: "سيدك: «وربُّ كلِّ شيءٍ: مالِكُه» [@lisan، ج1 ص399]."
  - term: "خَصَاصَةٌ"
    text: "«والخَصَاصةُ والخَصَاصاءُ والخَصَاصُ: الفقرُ وسوءُ الْحَالِ» [@lisan، ج7 ص25]."
  - term: "مُؤَيَّدَا"
    text: "مقوًّى منصورًا: «الأَيْدُ والآدُ جَمِيعًا: الْقُوَّةُ» [@lisan، ج3 ص76]."
