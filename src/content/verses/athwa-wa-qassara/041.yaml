explained: false
first: "فِي عَارِضٍ مِنْ وَائِلٍ إِنْ تَلْقَهُ"
second: "يَوْمَ الهِيَاجِ يَكُنْ مَسِيرُكَ أَنْكَدَا"
vocabulary:
  - term: "عَارِضٍ"
    text: "جيش كالسحاب المعترض: «والعَرْضُ والعارِضُ: السَّحابُ الَّذِي» يعترض في الأفق [@lisan، ج7 ص174]."
  - term: "وَائِلٍ"
    text: "بكر بن وائل، قوم الشاعر."
  - term: "الهِيَاجِ"
    text: "«وَيَوْمُ الهِياج: يَوْمُ الْقِتَالِ» [@lisan، ج2 ص395]."
  - term: "أَنْكَدَا"
    text: "أشأم: «النَّكَدُ: الشؤْمُ واللؤْمُ» [@lisan، ج3 ص427]."
