first: "مَنْ مُبْلِغٌ كِسْرَى إِذَا مَا جَاءَهُ"
second: "عَنِّي مَآلِكَ مُخْمِشَاتٍ شُرَّدَا"
meaning: "من يحمل عني إلى كسرى، إذا بلغه، رسائل تخدش كما تخدش الأظفار، تسير في الناس لا يردّها شيء؟ وفي تلخيص المحقق: «من يبلغ عنى (كسرى) إذا جاءه، رسائل تخمش الوجوه، وتذهب مشهورة فى كل مكان، فتجرى على كل لسان» [@diwan-asha، ص266]."
vocabulary:
  - term: "مُبْلِغٌ"
    text: "موصل، اسم فاعل من «أَبْلَغَ»."
  - term: "كِسْرَى"
    text: "لقب ملوك الفرس."
  - term: "مَآلِكَ"
    text: "رسائل: «والأَلوك والمَأْلَكة والمَأْلُكة: الرِّسَالَةُ» [@lisan، ج10 ص392]."
  - term: "مُخْمِشَاتٍ"
    text: "خادشات، من «الخَمْشُ: الخدْشُ فِي الْوَجْهِ وَقَدْ يُسْتَعْمَلُ فِي سَائِرِ الْجَسَدَ» [@lisan، ج6 ص299]. ويقول المحقق: «مخمشات مغضبات» [@diwan-asha، ص265]."
  - term: "شُرَّدَا"
    text: "سائرة لا تُردّ، من «شَرَدَ البعيرُ وَالدَّابَّةُ يَشْرُدُ شَرْداً وشِراداً وشُروداً: نَفَرَ» [@lisan، ج3 ص236]. ويقول المحقق: «شرد أى تأتى فى كل مكان لشهرتها وذيوعها، وأصله من الناقة الشرود» [@diwan-asha، ص265]."
context: "أول خطاب كسرى في القصيدة، وبه يبدأ غرضها. يقول المحقق في تلخيصه: «ثم ينتقل من حديث الصحراء، فيوجه خطابه إلى (كسرى) قائلا» [@diwan-asha، ص266]. وسببه في عنوان القصيدة أن كسرى أراد منهم رهائن [@diwan-asha، ص263]، وفي مقدمة المحقق لخبر ذي قار: «وكان كسرى قد طلب من بكر أن يسلموا حلقة النعمان، ويقدموا مائة غلام يكونون رهنا بما يحدث سفهاؤهم فى السواد» [@diwan-asha، ص262]. والحَلْقة: السلاح. وما يلي هذا البيت مضمون الرسالة: الإباء والوعيد."
syntax:
  - "«مَنْ» اسم استفهام مبتدأ، و«مُبْلِغٌ» خبره. والاستفهام لا ينتظر جوابًا، بل هو طلب لرسول، ومعناه: ليت أحدًا يبلغ."
  - "«مُبْلِغٌ» اسم فاعل عمل عمل فعله «أَبْلَغَ» فنصب مفعولين: «كِسْرَى» الأول، و«مَآلِكَ» الثاني، وهو منصوب بالفتحة بلا تنوين لأنه ممنوع من الصرف على صيغة «مَفاعِل». و«عَنِّي» متعلق بـ«مُبْلِغ»."
  - "«إِذَا مَا جَاءَهُ» جملة شرطية معترضة بين المفعولين، و«ما» زائدة للتوكيد، وجوابها محذوف يدل عليه ما قبله."
  - "«مُخْمِشَاتٍ» و«شُرَّدَا» صفتان لـ«مَآلِكَ»؛ و«مُخْمِشَاتٍ» منصوبة بالكسرة لأنها جمع مؤنث سالم."
morphology:
  - "«مَآلِك» جمع «مَأْلُكَة» على «مَفَاعِل»، من الأَلُوك وهو الرسالة."
  - "«مُخْمِشَات» جمع «مُخْمِشَة»، اسم فاعل من «أَخْمَشَ» على «أَفْعَلَ»، من الخَمْش."
  - "«شُرَّد» جمع «شارِد» على «فُعَّل»، كراكِع ورُكَّع."
rhetoric:
  thesis: "هنا يخلص الشاعر إلى غرضه. والتخلّص: الانتقال من مقدمة القصيدة إلى غرضها. وينتقل بلا تمهيد من صحراء الناقة إلى ملك الفرس، فيخاطبه بلسان قبيلته لا بلسان مادح."
  devices:
    - title: "صيغة الرسالة"
      text: "«مَنْ مُبْلِغٌ ... عَنِّي مَآلِكَ» مفتتح معروف لرسائل الوعيد، وبه افتتح الأَعْشَى رسالته إلى يَزِيد بن مُسْهِر في «ودّع هُرَيْرَة»: «أبلغ يزيد بنى شيبان مألكة» [@deif، ج1 ص350]. فهو لا يكلّم كسرى وجهًا لوجه، بل يرسل إليه كلامًا يسير في الناس، فيصير الوعيد علنيًّا."
    - title: "الاستعارة"
      text: "في «مُخْمِشَاتٍ» جعل الرسائل أظفارًا تخدش، وفي «شُرَّدَا» جعلها إبلًا نافرة لا تُمسك. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. فالكلام يؤذي كما يؤذي الخدش، ويذيع كما تذهب الناقة الشرود في البلاد."
  connection: "ومضمون الرسالة في البيت التالي: «آلَيْتُ لَا نُعْطِيهِ مِنْ أَبْنَائِنَا رُهُنًا»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المفتوحة، موصولة بألف الإطلاق"
  scansion: "مَنْ مُبْلِغُنْ / كِسْرَى إِذَا / مَا جَاءَهُو = مُتْفاعلن / مُتْفاعلن / مُتْفاعلن — عَنْنِي مَآ / لِكَ مُخْمِشَا / تِنْ شُرْرَدَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، خمس تفعيلات من ست فصارت «مُتْفاعلن»، وهذا يثقل البيت بالمقاطع الطويلة كأنه وقع الوعيد. وأُشبعت ضمة الهاء في «جَاءَهُ» فصارت «جَاءَهُو»."
