first: "لَسْنَا كَمَنْ جَعَلَتْ إِيَادٌ دَارَهَا"
second: "تَكْرِيتَ تَنْظُرُ حَبَّهَا أَنْ يُحْصَدَا"
meaning: "لسنا مثل إياد التي اتخذت تكريت دارًا، فهي مقيمة تنتظر زرعها أن يُحصد. يقول شوقي ضَيْف: «وواضح أنه يصرح بأن إيادا تعتمد على الزراعة والحصاد، أما هم فما لهم الإبل التى لا تنفد» [@deif، ج1 ص334]."
vocabulary:
  - term: "إِيَادٌ"
    text: "قبيلة من العرب."
  - term: "تَكْرِيتَ"
    text: "«وتَكْريتُ: أَرضٌ» [@lisan، ج2 ص78]، وأنشد صاحب اللسان البيت."
  - term: "تَنْظُرُ"
    text: "تنتظر: «والنَّظَرُ: الِانْتِظَارُ» [@lisan، ج5 ص216]."
  - term: "حَبَّهَا"
    text: "زرعها: «والحَبُّ: الزرعُ، صَغِيرًا كَانَ أَو كَبِيرًا» [@lisan، ج1 ص293]."
context: "يبدأ مقطع الفخر بالإبل (33–37)، وفيه يقابل الشاعر بين قومه وإياد. يقول المحقق: «ويهاجم الأعشى قبيلة (إياد) التى يضطرها موقعها فى أطراف الجزيرة إلى ممالأة الفرس، فينفيهم عن العرب، ويشبههم بالأنباط»، ثم يقول: «وهذا يصور احتقار العرب - والأعراب منهم خاصة - لأصحاب الصناعة والزراعة» [@diwan-asha، ص266]. وفي مقدمته لخبر ذي قار يذكر أن إيادًا كانت في جيش كسرى، يقودها مع قضاعة «خالد بن يزيد البهرانى» [@diwan-asha، ص262]. ويقرأ شوقي ضَيْف الأبيات من جهة أخرى، فيرى أن قبيلة الأَعْشَى، مع استقرارها باليمامة، كانت تنزع إلى البداوة، «ولعل ذلك ما جعل الأعشى يهجو إيادا فى بعض شعره بأنها تعتمد على الزراعة» [@deif، ج1 ص334]."
syntax:
  - "«لَسْنَا» ليس واسمها الضمير «نا»، و«كَمَنْ» جار ومجرور في محل نصب خبرها."
  - "«مَنْ» اسم موصول، قال الجوهري: «وَهُوَ فِي اللَّفْظِ وَاحِدٌ وَيَكُونُ فِي مَعْنَى الْجَمَاعَةِ» [@lisan، ج13 ص419]، ويقصد به هنا القبيلة."
  - "وفي البيت إشكال: «إِيَادٌ» فاعل «جَعَلَتْ»، فلا يبقى في الصلة ضمير يعود على «مَنْ». ورواه الجوهري «كَمَنْ حَلَّتْ إِيَادٍ» بالجر، فجعل «إيادٍ» بدلًا من «مَنْ»، وقال: «فأَنث فِعْلَ مَنْ لأَنه حَمَلَهُ عَلَى الْمَعْنَى لَا عَلَى اللَّفْظِ»، ثم عابه: «وَالْبَيْتُ رَدِيءٌ لأَنه أَبدل مِنْ قَبْلِ أَن يَتِمَّ الِاسْمُ» [@lisan، ج13 ص419]، أي أبدل من الموصول قبل أن تتم صلته. وقدّره ابن جِنِّيّ برفع «إيادٌ» على فعل محذوف: «كمن حلّت، حلّت إيادٌ دارها»، قال: «فَدَلَّ حَلَّتْ فِي الصِّلَةِ عَلَى حَلَّتْ هَذِهِ الَّتِي نَصَبَتْ دارَها» [@lisan، ج2 ص78]. وعلى تقديره يُقرأ نص الديوان: لسنا كالقبيلة التي جعلت، جعلت إيادٌ دارها تكريت."
  - "«جَعَلَتْ» بمعنى صيّرت تنصب مفعولين: «دَارَهَا» و«تَكْرِيتَ»، و«تكريتَ» ممنوعة من الصرف للعلمية والتأنيث."
  - "«تَنْظُرُ حَبَّهَا أَنْ يُحْصَدَا» جملة حال من «إياد»، و«حَبَّهَا» مفعول به، والمصدر المؤول «أَنْ يُحْصَدَ» بدل اشتمال منه، أي: تنتظر حصاد زرعها. والألف للإطلاق."
morphology:
  - "«تَنْظُرُ» مضارع «نَظَرَ» بمعنى انتظر."
  - "«يُحْصَدُ» مضارع «حَصَدَ» مبني للمجهول."
  - "«حَبّ» اسم جنس، واحدته حَبّة."
rhetoric:
  thesis: "بيت فخر بطريق النفي: يمدح قومه بأنهم ليسوا كإياد، فيرسم صورة المقيم الذي ينتظر الأرض لتطعمه، ثم يرسم صورة قومه في الأبيات التالية: إبل تطعمهم وسيوف تحميها."
  devices:
    - title: "الكناية"
      text: "في «تَنْظُرُ حَبَّهَا أَنْ يُحْصَدَا» لم يقل: إياد زرّاع مقيمون ضعفاء، بل ذكر انتظار الحصاد فدلّ به على ذلك كله. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]. فانتظار الحصاد يلزمه البقاء في مكان واحد والتعلق بالأرض، وهذا عند البدوي نقيض العزة."
    - title: "نفي المشابهة"
      text: "«لَسْنَا كَمَنْ» يبدأ الفخر بنفي الشبه، فيُحضر صورة الآخر قبل صورة القوم، ليقيس السامع هذه بتلك."
  connection: "ثم يزيد إيادًا وصفًا: قوم يعالج أبناؤهم القمل، وعليهم سلاسل وأبواب مغلقة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المفتوحة، موصولة بألف الإطلاق"
  scansion: "لَسْنَا كَمَنْ / جَعَلَتْ إِيَا / دُنْ دَارَهَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن — تَكْرِيتَ تَنْ / ظُرُ حَبْبَهَا / أَنْ يُحْصَدَا = مُتْفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، الأولى والثالثة من كل شطر فصارتا «مُتْفاعلن»."
