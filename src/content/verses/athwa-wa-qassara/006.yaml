explained: false
first: "إِذْ لِمَّتِي سَوْدَاءُ أَتْبَعُ ظِلَّهَا"
second: "دَدَنًا قَعُودَ غَوَايَةٍ أَجْرِي دَدَا"
vocabulary:
  - term: "لِمَّتِي"
    text: "«واللِّمَّة: شَعْرُ الرأْس» [@lisan، ج12 ص551]."
  - term: "دَدَنًا ... دَدَا"
    text: "«الدَّدُ اللَّهْوُ وَاللَّعِبُ» [@lisan، ج13 ص151]، والدَّدَن لغة فيه."
  - term: "قَعُودَ غَوَايَةٍ"
    text: "مقيمًا على الغواية. يقول المحقق: «أطلق المصدر وأراد اسم الفاعل، أي قاعدا في الغواية» [@diwan-asha، ص263]."
