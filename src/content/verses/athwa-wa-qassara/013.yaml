first: "رَبِّي كَرِيمٌ لَا يُكَدِّرُ نِعْمَةً"
second: "وَإِذَا يُنَاشَدُ بِالمَهَارِقِ أَنْشَدَا"
meaning: "جواب الشاعر عن أسئلة قُتَيْلة: أذللتَ نفسك؟ أم افتقرت؟ أم غاب سيدك؟ فيقول: سيدي كريم، لا يُتبع نعمته بما يكدّرها، وإذا سُئل بالصحف أجاب وأعطى. هكذا فسّره أبو عُبَيْد، قال: «يَعْنِي النُّعْمَانَ بْنَ الْمُنْذِرِ إِذا سُئِلَ بكَتْبِ الجَوائِز أَعْطى» [@lisan، ج3 ص422]، أي إذا جاءه السائل بكتاب عطاء أمضاه. وفي تلخيص المحقق: «سيدي كريم لا يشوب نعمته كدر ولا نكد، إذا نوشد بما في الكتب أجاب» [@diwan-asha، ص264]."
vocabulary:
  - term: "رَبِّي"
    text: "سيدي: «وربُّ كلِّ شيءٍ: مالِكُه» [@lisan، ج1 ص399]. وهو «ربّك» الذي سألت عنه قُتَيْلة في البيت السابق: «أَمْ غَابَ رَبُّكَ»."
  - term: "لَا يُكَدِّرُ"
    text: "لا يُفسد صفاءها: «الكَدَرُ: نَقِيضُ الصَّفَاءِ» [@lisan، ج5 ص134]."
  - term: "يُنَاشَدُ"
    text: "يُسأل ويُستحلف: «ونَشَدْتُ فُلَانًا أَنْشُدُه نَشْداً إِذا قُلْتَ لَهُ نَشَدْتُك اللَّهَ أَي سأَلتك بِاللَّهِ» [@lisan، ج3 ص422]."
  - term: "بِالمَهَارِقِ"
    text: "بالصحف: «والمُهْرَقُ: الصَّحِيفَةُ الْبَيْضَاءُ يُكْتَبُ فِيهَا، فَارِسِيٌّ مُعَرَّبٌ، وَالْجَمْعُ المَهارق»، و«وَقِيلَ: المُهْرَق ثَوْبُ حَرِيرٍ أَبيض يُسْقَى الصمغَ ويُصْقَلُ ثُمَّ يُكْتُبُ فِيهِ»، وقال الأزهري في هذا البيت: «أَرَادَ بالمَهارق الصَّحَائِفَ» [@lisan، ج10 ص368]."
  - term: "أَنْشَدَا"
    text: "أجاب السائل إلى طلبه، أي أعطى، كما في تفسير أبي عُبَيْد [@lisan، ج3 ص422]."
context: "جواب الشاعر عن أسئلة قُتَيْلة في الأبيات 10–12، وبه ينتهي مقطع الغزل، ثم يصف ناقته. وعليه يدور الخلاف في دين الأعشى. يذكر شوقي ضَيْف أن لويس شيخو زعم أنه كان نصرانيًّا، واستدل هو وبعض المستشرقين بهذا البيت، ويشرح استدلالهم: «والمهارق هنا الصحف الدينية. فكأنه يعترف بأنه نصرانى، ترتّل لربه الأناشيد الكنسية». ثم يردّه: «غير أن هذا ليس حتما، فقد تكون لدى الوثنيين من الجاهليين مهارق كانوا يتلون فيها بعض أدعيتهم. وقد يكون البيت دخيلا على القصيدة»، ويرجّح أن راوي الديوان النصراني «هو الذى أدخل هذا البيت فى القصيدة» [@deif، ج1 ص338]. وهذا الراوي عنده يحيى أو يونس بن متى، وقد «كان نصرانيا معمرا» [@deif، ج1 ص340]. أما محقق الديوان فيرى فيه أن الممدوح متديّن: «وفى البيت اشارة الى أن هذا الممدوح متدين بأحد الأديان السماوية» [@diwan-asha، ص265]. ولهذا البيت وحده جعلنا القصيدة «راجحة» لا «ثابتة»."
syntax:
  - "«رَبِّي كَرِيمٌ» مبتدأ وخبر، و«رَبِّي» مضاف إلى ياء المتكلم. وجملة «لَا يُكَدِّرُ نِعْمَةً» خبر ثانٍ، و«نِعْمَةً» مفعول به."
  - "«وَإِذَا يُنَاشَدُ ... أَنْشَدَا» جملة شرطية معطوفة على الخبر: «إذا» ظرف لما يُستقبل فيه معنى الشرط، و«يُنَاشَدُ» مضارع مبني للمجهول، ونائب الفاعل ضمير «ربي»، و«أَنْشَدَا» جواب الشرط، والألف للإطلاق."
  - "«بِالمَهَارِقِ» جار ومجرور متعلق بـ«يُنَاشَد»، والباء للاستعانة: يُسأل بالصحف. وعلى رواية «تُنُوشِدَ فِي المَهَارِقِ» تكون «في» للظرفية: إذا سُئل فيما كُتب في الصحف."
morphology:
  - "«يُكَدِّرُ» مضارع «كَدَّرَ» على «فَعَّلَ»، من الكَدَر."
  - "«يُنَاشَدُ» مضارع «نَاشَدَ» على «فَاعَلَ» مبنيًّا للمجهول. ويروى «تُنُوشِدَ» على «تُفُوعِلَ»، قال أبو عُبَيْد: «وَقَوْلُهُ تُنُوشِدَ هُوَ فِي مَوْضِعِ نُشِدَ أَي سُئِلَ» [@lisan، ج3 ص422]."
  - "«المَهَارِق» جمع «مُهْرَق» على «مَفَاعِل»، وهو لفظ «فَارِسِيٌّ مُعَرَّبٌ» [@lisan، ج10 ص368]، والمعرَّب: لفظ أعجمي أدخلته العرب في كلامها."
  - "«أَنْشَدَ» على «أَفْعَلَ»، من مادة «يُنَاشَد» نفسها."
rhetoric:
  thesis: "جواب قصير يردّ على ثلاثة أسئلة: لم يذلّ ولم يفتقر، لأن سيده كريم يعطي إذا سُئل. والسياق يرجّح عندنا قول أبي عُبَيْد إن «الرب» هنا سيد من الناس، لأن قُتَيْلة سألته قبله: «أَمْ غَابَ رَبُّكَ ... فَلَعَلَّ رَبَّكَ أَنْ يَعُودَ مُؤَيَّدَا»، والذي يغيب ثم يعود منصورًا إنسان. وهذه قراءتنا للسياق، لا نقل عن أحد."
  devices:
    - title: "الاستعارة"
      text: "في «لَا يُكَدِّرُ نِعْمَةً» جعل النعمة ماءً صافيًا، ونفى عنها ما يكدّر الماء، يريد أنه لا يُتبع عطاءه منًّا ولا قطعًا. والاستعارة هنا في الفعل، وعبد القاهر الجُرْجانيّ يقول: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]."
    - title: "حذف المفعول"
      text: "في «أَنْشَدَا» لم يذكر ما يعطيه، فترك العطاء مطلقًا بلا حدّ. ويقول عبد القاهر في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "الجناس"
      text: "بين «يُنَاشَدُ» و«أَنْشَدَا»، وهما من مادة واحدة. والجناس: أن تتشابه كلمتان في لفظهما. فالسؤال والإجابة من جذر واحد، كأن الإجابة صدى السؤال لا تتأخر عنه."
  connection: "ثم يدع قُتَيْلة، ويصف ناقته التي يقطع بها الفلاة (14–23)."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المفتوحة، موصولة بألف الإطلاق"
  scansion: "رَبْبِي كَرِي / مُنْ لَا يُكَدْ / دِرُ نِعْمَتَنْ = مُتْفاعلن / مُتْفاعلن / متَفاعلن — وَإِذَا يُنَا / شَدُ بِلْمَهَا / رِقِ أَنْشَدَا = متَفاعلن / متَفاعلن / متَفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، التفعيلتين الأوليين من الصدر فصارتا «مُتْفاعلن». والعَرُوض والضَّرْب تامّان «متَفاعلن»."
variants:
  - reading: "وَإِذَا تُنُوشِدَ فِي المَهَارِقِ أَنْشَدَا"
    status: "رواية أبي عُبَيْد في اللسان"
    note: "أنشده كذلك وفسّره بالنعمان بن المنذر [@lisan، ج3 ص422]. وفي موضع آخر من اللسان: «فَإِذَا تُنُوشِد فِي المَهارِق أَنْشَدا» [@lisan، ج10 ص368]."
