explained: false
first: "فَاقْعُدْ عَلَيْكَ التَّاجُ مُعْتَصِبًا بِهِ"
second: "لَا تَطْلُبَنَّ سَوَامَنَا فَتَعَبَّدَا"
vocabulary:
  - term: "مُعْتَصِبًا"
    text: "شادًّا التاج على رأسك: «والعِصابة: الْعِمَامَةُ، وكلُّ مَا يُعَصَّبُ بِهِ الرأْسُ» [@lisan، ج1 ص602]."
  - term: "سَوَامَنَا"
    text: "إبلنا الراعية: «والسَّوَامُ والسائمةُ بِمَعْنًى: وَهُوَ الْمَالُ الرَّاعِي» [@lisan، ج12 ص311]."
  - term: "فَتَعَبَّدَا"
    text: "فتتخذنا عبيدًا."
