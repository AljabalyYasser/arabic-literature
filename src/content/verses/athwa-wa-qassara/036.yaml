first: "مِثْلَ الهِضَابِ جَزَارَةً لِسُيُوفِنَا"
second: "فَإِذَا تُرَاعُ فَإِنَّهَا لَنْ تُطْرَدَا"
meaning: "إبلنا ضخمة كالهضاب، نذبحها بسيوفنا، فإذا أغار عليها مغير ليفزعها لم يقدر على طردها. يقول شوقي ضَيْف: «وهى إبل ضخمة كالهضاب، يعقرونها لضيوفهم، ولا يلم بها من يروعها أو يغير عليها خوفا من بسالتهم» [@deif، ج1 ص334]."
vocabulary:
  - term: "الهِضَابِ"
    text: "جمع هَضْبة: «الهَضْبَةُ: كلُّ جَبَلٍ خُلِقَ مِنْ صخرةٍ واحدةٍ» [@lisan، ج1 ص784]."
  - term: "جَزَارَةً"
    text: "ذبحًا. قال شوقي ضَيْف: «جزارة: مصدر جزره أى ذبحه» [@deif، ج1 ص334]، وفي اللسان: «والجَزْرُ: نَحْرُ الجَزَّارِ الجَزُورَ» [@lisan، ج4 ص134]."
  - term: "تُرَاعُ"
    text: "تُفزع: «ورَوْعةً: أَفْزَعَه بِكَثْرَتِهِ أَو جَمَالِهِ» [@lisan، ج8 ص136]."
  - term: "تُطْرَدَا"
    text: "تُساق غنيمة. والطرد: سَوق الإبل في الغارة."
context: "البيت الرابع من مقطع الفخر بالإبل (33–37)، وفيه يجمع الكرم والبأس. وقد أنشده شوقي ضَيْف مع 33 و35 و37 شاهدًا على بداوة قوم الأَعْشَى [@deif، ج1 ص334]."
syntax:
  - "«مِثْلَ الهِضَابِ» حال منصوبة من «مالنا» في البيت السابق، أي الإبل."
  - "«جَزَارَةً» مصدر منصوب، والأقرب أنه حال بمعنى «مُعَدّةً للجِزارة»، أو مفعول لأجله. و«لِسُيُوفِنَا» متعلق به، واللام لتقوية عمل المصدر في معموله."
  - "«فَإِذَا تُرَاعُ فَإِنَّهَا لَنْ تُطْرَدَا»: «إذا» ظرف شرطي، و«تُرَاعُ» مضارع مبني للمجهول، ونائب الفاعل ضمير الإبل. وجملة «فإنها لن تطردا» جواب الشرط، واقترنت بالفاء لأنها جملة اسمية. والألف للإطلاق."
morphology:
  - "«الهِضَاب» جمع «هَضْبَة» على «فِعَال»."
  - "«جَزَارَة» مصدر على «فَعَالة» من جَزَرَ."
  - "«تُرَاعُ» مضارع «رَاعَ يَرُوعُ» مبنيًّا للمجهول، أصله «تُرْوَعُ»، نُقلت فتحة الواو إلى الراء ثم قُلبت ألفًا."
  - "«تُطْرَدُ» مضارع «طَرَدَ» مبني للمجهول."
rhetoric:
  thesis: "بيت واحد يحمل الكرم في صدره والبأس في عجزه: الإبل تُذبح للضيف بأيدي أصحابها، ولا يأخذها عدو بالقوة."
  devices:
    - title: "التشبيه"
      text: "في «مِثْلَ الهِضَابِ» شبّه الإبل بالهضاب في ضخامتها وارتفاعها. وهو تشبيه في الهيئة، وعبد القاهر الجُرْجانيّ يقسم الشبه قسمين: «أحدهما أن يكون من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل، والآخر أن يكون الشبه محصّلاً بضرب من التأوّل» [@asrar، ص90]. وهذا من الأول: ضخامة تُرى بالعين."
    - title: "الكناية"
      text: "في «جَزَارَةً لِسُيُوفِنَا» لم يقل إنهم كرماء، بل ذكر نحر الإبل بالسيوف فدلّ به على كثرة الضيافة، وفي «لَنْ تُطْرَدَا» لم يقل إنهم شجعان، بل ذكر أن إبلهم لا تؤخذ. والكناية عند عبد القاهر أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
  connection: "ثم يختم الفخر بها: أعجازها تملأ قدورهم، وضروعها تسقيهم اللبن الخالص."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الدال المفتوحة، موصولة بألف الإطلاق"
  scansion: "مِثْلَ لْهِضَا / بِ جَزَارَتَنْ / لِسُيُوفِنَا = مُتْفاعلن / متَفاعلن / متَفاعلن — فَإِذَا تُرَا / عُ فَإِنْنَهَا / لَنْ تُطْرَدَا = متَفاعلن / متَفاعلن / مُتْفاعلن"
  note: "دخل الإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، الأولى من الصدر والأخيرة من العَجُز فصارتا «مُتْفاعلن». والضَّرْب مضمر، وهو جائز في الكامل التام."
