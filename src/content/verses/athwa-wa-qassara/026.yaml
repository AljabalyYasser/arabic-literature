explained: false
first: "حَتَّى يُفِيدَكَ مِنْ بَنِيهِ رَهِينَةً"
second: "نَعْشٌ وَيَرْهَنَكَ السِّمَاكُ الفَرْقَدَا"
vocabulary:
  - term: "نَعْشٌ"
    text: "«وبَناتُ نَعْشٍ: سبعةُ كَواكبَ: أَربعة مِنْهَا نَعْش لأَنها مُربّعة، وثلاثةٌ بَناتُ نَعْشٍ» [@lisan، ج6 ص355]."
  - term: "السِّمَاكُ الفَرْقَدَا"
    text: "نجوم: «والسِّماكانِ: نَجْمَانِ» [@lisan، ج10 ص443]، «والفَرْقدانِ: نَجْمَانِ» [@lisan، ج3 ص334]. أي لن نعطيك رهينة حتى تعطيك النجوم أبناءها رهائن، وذلك محال."
