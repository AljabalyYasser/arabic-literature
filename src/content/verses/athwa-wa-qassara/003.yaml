first: "وَأَرَى الغَوَانِيَ حِينَ شِبْتُ هَجَرْنَنِي"
second: "أَنْ لَا أَكُونَ لَهُنَّ مِثْلِي أَمْرَدَا"
vocabulary:
  - term: "الغَوَانِيَ"
    text: "جمع غانية، وهي الحسناء من النساء."
  - term: "أَمْرَدَا"
    text: "«والأَمْرَدُ: الشابُّ الَّذِي بلغَ خُرُوجَ لِحْيته وطَرَّ شَارِبُهُ وَلَمْ تَبْدُ لِحْيَتُهُ» [@lisan، ج3 ص401]."
