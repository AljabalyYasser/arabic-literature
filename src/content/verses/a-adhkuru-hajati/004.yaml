explained: false
first: "تُبَارِي الرِّيحَ مَكْرُمَةً وَجُودًا"
second: "إِذَا مَا الْكَلْبُ أَجْحَرَهُ الشِّتَاءُ"
vocabulary:
  - term: "تُبَارِي الرِّيحَ"
    text: "تجاريها وتسابقها، أي يفيض جودك كما تهب الريح، يقال: «فُلَانٌ يُبَارِي الريحَ سَخاءً» [@lisan، ج14 ص72]."
  - term: "أَجْحَرَهُ الشِّتَاءُ"
    text: "ألجأه البرد إلى جحره، فلا يخرج. «وأَجْحَرَهُ إِلى كَذَا: أَلجأَه» [@lisan، ج4 ص118]. وذلك وقت الجدب حين يعزّ القِرى. ويقول محققو «الأغاني» إن أكثر الأصول: «مَكْرُمَةً وَمَجْدًا» [@aghani-dk، ج8 ص328، الحاشية]."
