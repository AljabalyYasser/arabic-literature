first: "إِذَا أَثْنَى عَلَيْكَ الْمَرْءُ يَوْمًا"
second: "كَفَاهُ مِنْ تَعَرُّضِهِ الثَّنَاءُ"
meaning: "إذا مدحك أحد يومًا أغناه مدحُه عن أن يتعرض لك بالسؤال، لأنك تعطيه دون أن يطلب. فالثناء عليك يقوم مقام المسألة. وبهذا فسّره سفيان بن عُيَيْنة: «يكفينا من مسألتك أن نُثْنِىَ عليك ونسكت حتى تأتىَ على حاجتنا» [@aghani-dk، ج8 ص331]."
vocabulary:
  - term: "أَثْنَى عَلَيْكَ"
    text: "مدحك."
  - term: "تَعَرُّضِهِ"
    text: "تصدّيه لك بالسؤال، وفسّره سفيان بالمسألة [@aghani-dk، ج8 ص331]."
  - term: "الثَّنَاءُ"
    text: "المدح."
context: "بيت الحكمة في القصيدة، وهو قلبها: فيه يقول الشاعر صراحة ما فعله في المطلع، فقد أثنى ولم يسأل. وهو البيت الذي اختاره سفيان بن عُيَيْنة مع المطلع ليفسّر به حديثًا في أن أفضل الدعاء الثناء على الله، ثم قال: «فهذا مخلوقٌ يُنْسَب إلى الجود قيل له: يكفينا من مسألتك أن نُثْنِىَ عليك ونسكت حتى تأتىَ على حاجتنا، فكيف بالخالق!» [@aghani-dk، ج8 ص330–331]. ويجعله أبو تمّام قبل «تباري الريح» [@tabrizi-hamasa، ج2 ص373]."
syntax:
  - "«إِذَا» ظرف لما يستقبل من الزمان، متضمن معنى الشرط، و«أثنى» فعل ماض هو فعل الشرط، و«عليك» متعلق به، و«المرءُ» فاعل، و«يومًا» ظرف زمان."
  - "«كَفَاهُ» فعل ماض، والهاء مفعول به، والجملة جواب «إذا» لا محل لها من الإعراب."
  - "«مِنْ تَعَرُّضِهِ» جار ومجرور متعلق بـ«كفاه» على معنى: أغناه عن تعرضه، والهاء مضاف إليه، و«الثناءُ» فاعل «كفاه» مؤخر."
morphology:
  - "«أَثْنَى» على «أَفْعَلَ» من «ثنى»، والألف منقلبة عن الياء."
  - "«تَعَرُّض» مصدر «تَعَرَّضَ» على «تَفَعُّل»."
  - "«الثَّنَاء» اسم على «فَعال» من «ثنى»، وهمزته منقلبة عن الياء لتطرفها بعد ألف زائدة."
rhetoric:
  thesis: "يجعل المدح عملة تكفي وحدها: من مدح الكريم قضى حاجته. فالبيت ثناء على ابن جُدْعان، وتذكير له في الوقت نفسه بأن الشاعر قد أدى ما عليه."
  devices:
    - title: "التصدير في «أَثْنَى ... الثَّنَاءُ»"
      text: "يرد في القافية لفظ من أول البيت، فيُعلم آخره من أوله. وهو عند ابن رَشِيق التصدير: «أن يرد أعجاز الكلام على صدوره، فيدل بعضه على بعض، ويسهل استخراج قوافي الشعر» [@ibn-rashiq، ج2 ص3]."
    - title: "الكناية في «كَفَاهُ مِنْ تَعَرُّضِهِ الثَّنَاءُ»"
      text: "لا يقول إن الممدوح يعطي من مدحه، بل يقول إن المدح يغني عن السؤال، فيُفهم العطاء مما يلزم عنه. وهي الكناية كما يحدّها عبد القاهر الجُرْجانيّ: أن يجيء المتكلم «إلى معنى هو تاليهِ ورِدْفُه في الوجود، فيومئ به إليهِ، ويجعلهُ دليلاً عليه» [@dalail، ص66]."
    - title: "الحكمة العامة في «الْمَرْءُ»"
      text: "يقول «المرء» لا «الشاعر» ولا «أنا»، فيصير البيت قاعدة في الممدوح تصدق على كل قاصد. وهي قراءتنا."
  connection: "بعده البيت 6: إذا خلّفت عبد الله فاعلم أن القوم لا يجزونك بمثله، فينتقل من الممدوح إلى الموازنة بينه وبين غيره."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف"
  scansion: "إِذَا أَثْنَى / عَلَيْكَلْ مَرْ / ءُ يَوْمَنْ = مُفاعَلْتُن / مُفاعَلْتُن / فَعُولُن — كَفَاهُو مِنْ / تَعَرْرُضِهِثْ / ثَنَاءُو = مُفاعَلْتُن / مُفاعَلَتُن / فَعُولُن"
  note: "التفعيلتان الأوليان في الصدر والأولى في العجز معصوبة «مُفاعَلْتُن». وتُشبع ضمة الهاء في «كَفَاهُ» فتُنطق «كَفَاهُو» ليستقيم الوزن."
