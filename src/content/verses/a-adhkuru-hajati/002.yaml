explained: false
first: "وَعِلْمُكَ بِالْأُمُورِ وَأَنْتَ قَرْمٌ"
second: "لَكَ الْحَسَبُ الْمُهَذَّبُ وَالسَّنَاءُ"
vocabulary:
  - term: "قَرْمٌ"
    text: "«والقَرْمُ مِنَ الرِّجَالِ: السَّيِّدُ الْمُعَظَّمُ» [@lisan، ج12 ص473]. وفي «الحماسة»: «وَعِلْمُكَ بِالْحُقُوقِ وَأَنْتَ فَرْعٌ» [@tabrizi-hamasa، ج2 ص372]."
  - term: "الْمُهَذَّبُ"
    text: "المصفّى من العيب."
  - term: "السَّنَاءُ"
    text: "«والسَّنَاءُ مِنَ الرِّفْعة» [@lisan، ج14 ص403]."
