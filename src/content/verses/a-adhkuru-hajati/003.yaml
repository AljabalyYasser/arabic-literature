explained: false
first: "كَرِيمٌ لَا يُغَيِّرُهُ صَبَاحٌ"
second: "عَنِ الْخُلُقِ السَّنِيِّ وَلَا مَسَاءُ"
vocabulary:
  - term: "السَّنِيِّ"
    text: "الرفيع، «والسَّنِيُّ: الرَّفيعُ» [@lisan، ج14 ص403]. ويروي ابن سَلّام: «عَنِ الْخُلُقِ الْكَرِيمِ» [@ibn-sallam، ج1 ص265]، وأبو تمّام: «خَلِيلٌ لَا يُغَيِّرُهُ صَبَاحٌ / عَنِ الْخُلُقِ الْجَمِيلِ» [@tabrizi-hamasa، ج2 ص372]."
