first: "أَأَذْكُرُ حَاجَتِي أَمْ قَدْ كَفَانِي"
second: "حَيَاؤُكَ إِنَّ شِيمَتَكَ الْحَيَاءُ"
meaning: "أأذكر لك حاجتي التي جئت من أجلها، أم يغنيني عن ذكرها حياؤك؟ فإن الحياء طبعك، ومن كان الحياء طبعه استحيا أن يُحوج قاصده إلى السؤال. والحاجة هنا دَيْن ركبه، كما في خبر أبي الفَرَج: «كلابُ غُرَماءَ نبحتنى ونهشتنى» [@aghani-dk، ج8 ص327]."
vocabulary:
  - term: "حَاجَتِي"
    text: "ما جئت أطلبه، ولا يسمّيه."
  - term: "كَفَانِي"
    text: "أغناني عن ذكرها."
  - term: "شِيمَتَكَ"
    text: "«الشِّيمةُ: الخُلُقُ. والشِّيمةُ: الطَّبِيعَةُ» [@lisan، ج12 ص329]."
  - term: "الْحَيَاءُ"
    text: "الاستحياء، أي أن يمنعه خلقه من أن يرى سائلًا يذلّ بالسؤال."
context: "مطلع القصيدة ومفتاحها: جاء أمية يذكّر ابن جُدْعان بوعده أن يقضي دينه، فبدأ بسؤال لا يسأل. ويجعل ابن رَشِيق هذه الأبيات أول أمثلة الاقتضاء، وهو طلب الشاعر حاجته من ممدوحه، ويقول: «فمن أحسن الاقتضاء على ما تخيرته، ونحوت إليه قول أمية بن أبي الصلت لعبد الله بن جدعان» [@ibn-rashiq، ج2 ص158]. وبه يبدأ كل من رواها: ابن سَلّام وأبو تمّام وأبو الفَرَج، وأنشده سفيان بن عُيَيْنة شاهدًا على أن الثناء يغني عن المسألة [@aghani-dk، ج8 ص331]."
syntax:
  - "«أَأَذْكُرُ» الهمزة للاستفهام، و«أذكرُ» فعل مضارع مرفوع، وفاعله ضمير مستتر تقديره أنا، و«حاجتي» مفعول به."
  - "«أَمْ» حرف عطف معادل للهمزة، يُطلب به تعيين أحد الأمرين."
  - "«قَدْ كَفَانِي حَيَاؤُكَ» «قد» حرف تحقيق، و«كفى» فعل ماض، والنون للوقاية، والياء مفعول به، و«حياؤُك» فاعل مؤخر."
  - "«إِنَّ شِيمَتَكَ الْحَيَاءُ» جملة مستأنفة تعلّل ما قبلها: «شيمتَك» اسم «إنّ»، و«الحياءُ» خبرها."
morphology:
  - "«حاجة» اسم على «فاعَلة» من «حَوَج»، قُلبت الواو ألفًا."
  - "«الحياء» مصدر «حَيِيَ يَحْيا» على «فَعال»، وهمزته منقلبة عن الياء لتطرفها بعد ألف زائدة."
  - "«شِيمة» على «فِعْلة» من «شيم»."
rhetoric:
  thesis: "سؤال يُغني عن السؤال: الشاعر يعرض حاجته في صورة تردد، فيجعل الممدوح هو الذي يكمل الطلب بكرمه. فإن ذكر حاجته فقد طلب، وإن سكت فقد شهد للممدوح بأن حياءه يكفيه."
  devices:
    - title: "الاستفهام في «أَأَذْكُرُ حَاجَتِي أَمْ قَدْ كَفَانِي»"
      text: "لا يريد الجواب، بل يريد التلطف في الطلب: يذكّر بالحاجة في صورة من يستحيي أن يذكرها. وهو ما سماه ابن رَشِيق الاقتضاء اللطيف، وقال: «فالاقتضاء طلب حاجة، وباب التلطيف فيه أجود» [@ibn-rashiq، ج2 ص158]."
    - title: "الكناية في «قَدْ كَفَانِي حَيَاؤُكَ»"
      text: "لا يقول: ستعطيني، بل يذكر ما يلزم عنه العطاء، وهو حياء الممدوح. وهذه هي الكناية عند عبد القاهر الجُرْجانيّ: «أن يُريد المتكلمُ إثباتَ معنًى من المَعاني، فلا يذكُرُه باللّفظِ الموضوعِ له في اللُّغة، ولكنْ يَجيءُ إلى معنى هو تاليهِ ورِدْفُه في الوجود»، «فيومئ به إليهِ» [@dalail، ص66]."
    - title: "«إِنَّ» في «إِنَّ شِيمَتَكَ الْحَيَاءُ»"
      text: "جملة جاءت بلا عاطف تعلّل ما قبلها، وربطتها «إنّ» به. ويقول عبد القاهر إنّ من شأن «إنّ» إذا جاءت على هذا الوجه «أَن تُغْني غَناء الفاءِ العاطِفةِ» [@dalail، ص273]، فكأنه قال: فإن شيمتك الحياء."
    - title: "رد العجز على الصدر في «حَيَاؤُكَ ... الْحَيَاءُ»"
      text: "يبدأ العجز بالحياء وينتهي به، فيستقر المعنى في القافية. وهو التصدير عند ابن رَشِيق: «أن يرد أعجاز الكلام على صدوره، فيدل بعضه على بعض» [@ibn-rashiq، ج2 ص3]."
  connection: "يتمّ السؤال في البيت التالي: ويكفيني أيضًا «عِلْمُكَ بِالْأُمُورِ»، فيعطف على الحياء صفة ثانية."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف"
  scansion: "أَأَذْكُرُ حَا / جَتِي أَمْ قَدْ / كَفَانِي = مُفاعَلَتُن / مُفاعَلْتُن / فَعُولُن — حَيَاؤُكَ إِنْ / نَ شِيمَتَكَلْ / حَيَاءُو = مُفاعَلَتُن / مُفاعَلَتُن / فَعُولُن"
  note: "في التفعيلة الثانية من الصدر سُكّن الخامس المتحرك فصارت «مُفاعَلْتُن»، وهذا العَصْب، وهو كثير في الوافر."
