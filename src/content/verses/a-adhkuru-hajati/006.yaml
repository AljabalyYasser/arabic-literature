first: "إِذَا خَلَّفْتَ عَبْدَ اللَّهِ فَاعْلَمْ"
second: "بِأَنَّ الْقَوْمَ لَيْسَ لَهُمْ جَزَاءُ"
vocabulary:
  - term: "خَلَّفْتَ عَبْدَ اللَّهِ"
    text: "تركته خلفك وقصدت غيره."
  - term: "لَيْسَ لَهُمْ جَزَاءُ"
    text: "لا يجزون من قصدهم ولا يكافئون مادحهم كما يكافئ ابن جُدْعان."
