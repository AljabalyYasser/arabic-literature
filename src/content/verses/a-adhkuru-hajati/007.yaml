first: "فَأَرْضُكَ كُلُّ مَكْرُمَةٍ بَنَاهَا"
second: "بَنُو تَيْمٍ وَأَنْتَ لَهُمْ سَمَاءُ"
meaning: "كل مكرمة بناها قومك بنو تَيْم هي لك بمنزلة الأرض، وأنت لهم بمنزلة السماء: أنت فوقهم، ومنك ينزل الخير الذي يحيي ما بنوه، كما ينزل المطر من السماء على الأرض فيحييها."
vocabulary:
  - term: "مَكْرُمَةٍ"
    text: "فعل كريم يُحمد صاحبه."
  - term: "بَنُو تَيْمٍ"
    text: "قوم ابن جُدْعان من قريش، فهو «عبد الله بن جُدْعان بن عمرو بن كعب بن سعد بن تَيْم بن مُرّة بن كعب بن لؤي بن غالب» [@aghani-dk، ج8 ص327]."
context: "بعد الموازنة بين ابن جُدْعان وغيره يرفعه فوق قومه أنفسهم. وهو من الأبيات الثلاثة التي يرويها ابن سَلّام [@ibn-sallam، ج1 ص265]، فهو من أقدم ما بقي من القصيدة، ويختم به ابن سَلّام روايته. ومنه تخرج الأبيات الأخيرة: السماء ظاهرة لكل ناظر."
syntax:
  - "«فَأَرْضُكَ» الفاء استئنافية، و«أرضُ» خبر مقدم مضاف، والكاف مضاف إليه، و«كلُّ مكرمةٍ» مبتدأ مؤخر ومضاف إليه. ويجوز أن يكون «أرضُك» مبتدأ و«كلُّ» خبره، والمعنى واحد."
  - "«بَنَاهَا بَنُو تَيْمٍ» فعل ومفعول وفاعل مرفوع بالواو لأنه ملحق بجمع المذكر السالم، والجملة نعت لـ«مكرمة»."
  - "«وَأَنْتَ لَهُمْ سَمَاءُ» الواو حالية، و«أنت» مبتدأ، و«سماءُ» خبره، و«لهم» متعلق بمحذوف حال، والجملة في محل نصب حال."
morphology:
  - "«مَكْرُمة» على «مَفْعُلة» من «كرم»."
  - "«سَمَاء» على «فَعال» من «سمو»، وهمزتها منقلبة عن الواو لتطرفها بعد ألف زائدة."
rhetoric:
  thesis: "صورة واحدة تجمع القوم وسيدهم: هم الأرض التي يُبنى عليها، وهو السماء التي يُرجى منها. فالمديح هنا ليس لابن جُدْعان وحده، بل لقبيلته من خلاله."
  devices:
    - title: "التشبيه البليغ في «فَأَرْضُكَ كُلُّ مَكْرُمَةٍ» و«وَأَنْتَ لَهُمْ سَمَاءُ»"
      text: "حذف أداة التشبيه ووجهه، فجعل المكارم أرضًا وجعل الممدوح سماء. ولم يستعر، لأنه ذكر الطرفين معًا: المكارم والأرض، والممدوح والسماء. والاستعارة عند عبد القاهر الجُرْجانيّ أن «تَدعَ أنْ تُفْصحَ بالتشبيهِ وتُظْهرَه، وتجيءَ إلى اسمِ المشبَّه بهِ فتعُيِرَه المِشبَّةَ وتُجْرِيَه عليه» [@dalail، ص67]، وهنا ذكر المشبّه نفسه، فهو تشبيه لا استعارة."
    - title: "الطباق بين «أَرْضُكَ» و«سَمَاءُ»"
      text: "يجمع الضدين في بيت واحد، أوله وآخره، فيستوعب ما بينهما: لا مكرمة في قومه إلا وهو فوقها."
    - title: "وجه الشبه المضمر"
      text: "لا يقول الشاعر بأي شيء الممدوح سماء، ويترك القارئ يستنتج: علوّه، ومطره الذي يحيي الأرض، أي عطاؤه. وهذا ما يفسّر به أبو تمّام الصورة إذ يروي «وَأَنْتَ لَهَا سَمَاءُ» [@tabrizi-hamasa، ج2 ص373]، فالسماء للمكارم لا للقوم. والتفسير قراءتنا."
  connection: "يكمل البيتان الأخيران الصورة: أبرز الله فضله عليهم كما تبرز السماء لمن ينظر إليها، وهل تخفى السماء؟"
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة، وقبلها ألف الرِّدْف"
  scansion: "فَأَرْضُكَ كُلْ / لُ مَكْرُمَتِنْ / بَنَاهَا = مُفاعَلَتُن / مُفاعَلَتُن / فَعُولُن — بَنُو تَيْمِنْ / وَأَنْتَ لَهُمْ / سَمَاءُو = مُفاعَلْتُن / مُفاعَلَتُن / فَعُولُن"
  note: "التفعيلة الأولى من العجز معصوبة «مُفاعَلْتُن»."
