first: "فَإِنَّ الْحَقَّ مَقْطَعُهُ ثَلَاثٌ"
second: "يَمِينٌ أَوْ نِفَارٌ أَوْ جِلَاءُ"
meaning: "الحقّ يُفصل فيه بواحدة من ثلاث: يمينٍ يحلفها المطلوب، أو منافرةٍ إلى حَكَم يقضي بين الخصمين، أو بيانٍ ينكشف به الأمر فيُقضى به. قال الأعلم: «يريد: ثلاث خصال، يَنفُذ بكلّ واحدة منها» [@diwan-zuhayr، ص138]. ويفسّره ابن قُتَيْبة: «يعنى: يمينا أو منافرة إلى حاكم يقطع بالبيّنات أو جلاء، وهو بيان وبرهان يجلو به الحقّ وتتّضح الدعوى» [@ibn-qutayba، ج1 ص140]."
vocabulary:
  - term: "مَقْطَعُهُ"
    text: "ما يُفصل به. وفي لسان العرب: «ومَقْطَعُ الحقِّ: مَا يُقْطَعُ بِهِ الْبَاطِلُ، وَهُوَ أَيضاً مَوْضِعُ التِقاءِ الحُكْمِ، وَقِيلَ: هُوَ حَيْثُ يُفْصَلُ بَيْنَ الخُصومِ بِنَصِّ الْحُكْمِ» [@lisan، ج8 ص282]."
  - term: "نِفَارٌ"
    text: "«أي: تنافُرٌ إلى رجلٍ حاكم، يتبيّن حُجج الخصوم، ويحكم بينهم» [@diwan-zuhayr، ص138]. وفي اللسان عن ابن سِيدَه: «وكأَنما جَاءَتِ المُنافَرَةُ فِي أَوّل مَا اسْتُعْمِلَتْ أَنهم كَانُوا يسأَلون الْحَاكِمَ: أَيُّنا أَعَزُّ نَفَراً؟» [@lisan، ج5 ص226]."
  - term: "جِلَاءُ"
    text: "«وهو: أن ينكشف الأمر وينجلي، فيُعلم، فيُقضى به لصاحبه، دون خصامٍ ولا يمين» [@diwan-zuhayr، ص138]."
context: "يأتي بعد أن عدّد ما قد يجيب به القوم (37–39): أنهم بُراء، أو أنهم وفَوا، أو أنهم أبَوا، فيضع لهم القاعدة التي يُحتكم إليها. وهو أشهر أبيات القصيدة، ينقل فيه ابن قُتَيْبة عن «بعض الرواة»: «لو أن زهيرا نظر فى رسالة عمر بن الخطّاب إلى أبى موسى الأشعرى ما زاد على ما قال» [@ibn-qutayba، ج1 ص140]. ويقول ابن رَشِيق: «وقيل: إن عمر بن الخطاب كان يتعجب من قول زهير»، «وسمي زهير قاضي الشعراء بهذا البيت» [@ibn-rashiq، ج1 ص55]. ويروي أبو هلال العَسْكَرِيّ أن عمر «كان يعجب أيضا بهذا البيت ويقول: لو أدركت زهيرا لولّيته القضاء لمعرفته» [@sinaatayn، ص342]. وكلها أخبار بلا إسناد، فدرجتها: منسوب، خبر أدبي نشأ حول البيت."
syntax:
  - "«فَإِنَّ الْحَقَّ مَقْطَعُهُ ثَلَاثٌ»: «الحقّ» اسم «إنّ»، و«مَقْطَعُهُ ثَلَاثٌ» جملة اسمية من مبتدأ وخبر في موضع خبر «إنّ». والفاء تعليلية: يعلّل بها ما عدّده من أجوبتهم، أي إنما يُنظر في قولكم لأن الحقّ يُقطع بإحدى ثلاث."
  - "«يَمِينٌ أَوْ نِفَارٌ أَوْ جِلَاءُ»: بدل من «ثلاث» مرفوع، و«أو» للتقسيم."
morphology:
  - "«مَقْطَع» على «مَفْعَل» من «قطع»، يكون مصدرًا ميميًّا واسم مكان، وابن منظور يذكر المعنيين: «مَا يُقْطَعُ بِهِ الْبَاطِلُ» و«مَوْضِعُ التِقاءِ الحُكْمِ» [@lisan، ج8 ص282]."
  - "«نِفَارٌ» مصدر «نافَرَ» على «فِعَال»، مثل قاتل قتالًا، والمفاعلة فيه بين خصمين. و«جِلَاءُ» على «فِعَال» من «جلا الأمرُ» إذا انكشف."
  - "«يَمِين» على «فَعِيل»."
rhetoric:
  thesis: "حكمة في القضاء تأتي في وسط الهجاء: لا يُقطع الحقّ إلا بيمين أو حُكم أو بيان."
  devices:
    - title: "صحة التقسيم"
      text: "«ثَلَاثٌ: يَمِينٌ أَوْ نِفَارٌ أَوْ جِلَاءُ»: يذكر عددًا ثم يستوفيه. وهذا ما يسمّيه قُدامة بن جعفر «صحة التقسيم»: «وهي أن يبتدئ الشاعر فيضع أقساماً فيستوفيها، ولا يغادر قسماً منها» [@naqd-al-shir، ص46]. وبهذا البيت والذي بعده يمثّل أبو هلال العسكري لصحة القسمة [@sinaatayn، ص342]. ويقول ابن رشيق: «وهذه الثلاث على الحقيقة هي مقاطع الحق كما قال، على أنه جاهلي، وقد وكدها الإسلام» [@ibn-rashiq، ج1 ص56]."
    - title: "الحكمة في موضع الحِجاج"
      text: "لم يقل لهم: أدّوا الحقّ، بل وضع القاعدة العامة، فصار البيت مثلًا يُستشهد به خارج القصيدة، كما فعل ابن قتيبة وأبو هلال وابن رشيق. وهذا من الصفة التي وصف بها أهلُ النظر زهيرًا عند ابن سَلّام: «وأكثرهم أمثالا فى شعره» [@ibn-sallam، ج1 ص64]."
  connection: "ثم يردّ القاعدة عليهم: فهذه مقاطع كلّ حقّ، وكلّها لكم شفاء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَإِنْنَلْ حَقْ / قَ مَقْطَعُهُو / ثَلَاثُنْ = مفاعلْتن / مفاعلتن / فعولن — يَمِينُنْ أَوْ / نِفَارُنْ أَوْ / جِلَاءُو = مفاعلْتن / مفاعلْتن / فعولن"
  note: "دخل العَصْب التفعيلة الأولى من الصدر والأوليين من العجز فصارت «مفاعلْتن»، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]. وأُشبعت ضمّة الهاء في «مَقْطَعُهُ»."
variants:
  - reading: "يَمِينٌ أَوْ نِفَارٌ أَوْ جَلَاءُ"
    status: "بفتح الجيم، في لسان العرب"
    note: "أنشده ابن منظور شاهدًا على قوله: «والجَلاءُ، بِالْفَتْحِ وَالْمَدِّ: الأَمرُ الجَلِيُّ»، ثم قال: «أَراد الْبَيِّنَةَ وَالشُّهُودَ، وَقِيلَ: أَراد الإِقرار» [@lisan، ج14 ص150]. والكسر رواية الأعلم."
  - reading: "أَدَاءٌ أَوْ نِفَارٌ أَوْ جِلَاءُ"
    status: "رواية ابن رشيق"
    note: "[@ibn-rashiq، ج1 ص55]، وقال بعد تفسيرها: «ويروي يمين أو نفار» [@ibn-rashiq، ج1 ص56]."
