explained: false
first: "فَصَرِّمْ حَبْلَهَا إِذْ صَرَّمَتْهُ"
second: "وَعَادَى أَنْ تُلَاقِيَهَا الْعَدَاءُ"
vocabulary:
  - term: "فَصَرِّمْ حَبْلَهَا"
    text: "«أي: اقطع ما بينك وبينها، من سبب العشق، إذ قطعته بمفارقتها لك» [@diwan-zuhayr، ص126]."
  - term: "وَعَادَى أَنْ تُلَاقِيَهَا الْعَدَاءُ"
    text: "«أي: منَع وصرَف من لقائها أمرٌ شاغل» [@diwan-zuhayr، ص126]. و«العَداء» «هنا: المنع، ويكون في غير هذا: الظّلم والجَور» [@diwan-zuhayr، ص127]."
sources:
