first: "تَنَازَعَهَا الْمَهَا شَبَهًا وَدُرُّ الْـ"
second: "ـنُّحُورِ وَشَاكَهَتْ فِيهَا الظِّبَاءُ"
meaning: "تقاسمت صاحبتَه ثلاثةٌ في الشبه: أخذت منها بقرُ الوحش حسنَ العينين، وأخذ الدرُّ المعلّق على النحور صفاءها وملاحتها، وأشبهتها الظباء في طول العنق. وهذا تفسير الأَعْلَم: «أي: فيها من المها شبَهٌ وهو حُسن العينين، وفيها من الدُّرّ شبه وذلك صفاؤه وملاحته، وأشبهتها الظّباء في طول العنق» [@diwan-zuhayr، ص126]."
vocabulary:
  - term: "تَنَازَعَهَا"
    text: "تجاذبتها، كلٌّ يأخذ منها نصيبًا. قال الأعلم: «وأصل المنازعة: مجاذبة الدّلو. فضُربت مثلًا لكلّ ما أُخذ فيه، وتُشُبِّث به» [@diwan-zuhayr، ص126]."
  - term: "الْمَهَا"
    text: "«بقر الوحش» [@diwan-zuhayr، ص126]، والواحدة مهاة."
  - term: "دُرُّ النُّحُورِ"
    text: "الدُّرّ: «اللآلئ العظام» كما يقول المحقق [@diwan-zuhayr، ص126]. «وخصّ «درّ النّحور» لأنّه أملح ما يكون إذا تُقُلِّد» [@diwan-zuhayr، ص126]."
  - term: "شَاكَهَتْ"
    text: "«ومعنى «شاكهت» وشاكلت وشابهت واحد» [@diwan-zuhayr، ص126]."
context: "بعد رحيل آل ليلى وطول مطالبته لها (5–9) يصفها في ثلاثة أبيات: هذا البيت يجمع الأوصاف الثلاثة، والبيتان بعده يفسّرانها. وهو البيت الذي يقول فيه ابن قُتَيْبة: «وشبّه زهير امرأة فى الشعر بثلاثة أوصاف فى بيت واحد»، ثم ينشده والبيتين بعده، ويقول بينهما: «ثم قال ففسّر» [@ibn-qutayba، ج1 ص139–140]."
syntax:
  - "«تَنَازَعَهَا الْمَهَا شَبَهًا»: «تنازع» فعل ماضٍ، والضمير «ها» مفعول به مقدّم يعود على صاحبته، و«المها» فاعل، و«شَبَهًا» تمييز، أي: تنازعوها من جهة الشبه."
  - "«وَدُرُّ النُّحُورِ»: معطوف على «المها» فهو فاعل ثانٍ للفعل نفسه، و«النحور» مضاف إليه."
  - "«وَشَاكَهَتْ فِيهَا الظِّبَاءُ»: جملة معطوفة، و«الظباء» فاعل «شاكهت»، و«فيها» متعلّق بالفعل. وجاء «تنازع» بلا تاء التأنيث و«شاكهت» بها، والفاعل في الموضعين جمع لغير العاقل، فيجوز فيه الوجهان، وقد جمعهما البيت."
morphology:
  - "«تَنَازَعَ» على «تَفَاعَلَ» من «نزع»، وهو بناء المشاركة: أن يأخذ كلّ واحد بطرف. ومنه قول الأعلم إن أصل المنازعة «مجاذبة الدّلو» [@diwan-zuhayr، ص126]."
  - "«الْمَهَا» جمع «مَهَاة»، كما يقول المحقق [@diwan-zuhayr، ص125]، و«الظِّبَاءُ» جمع «ظَبْي» على «فِعَال»."
  - "«شَاكَهَتْ» على «فَاعَلَتْ» من «شكه»، بمعنى شابهت."
rhetoric:
  thesis: "امرأة تتقاسمها ثلاثة أشياء جميلة، كلٌّ يأخذ منها صفة."
  devices:
    - title: "التشبيه المتعدد"
      text: "«الْمَهَا ... وَدُرُّ النُّحُورِ ... الظِّبَاءُ»: ثلاثة تشبيهات في بيت واحد، كلٌّ منها مستقلّ عن الآخر: العينان من المها، والصفاء من الدرّ، والعنق من الظباء. وهذا ما يسمّيه عبد القاهر الجُرْجانيّ «التشبيه المتعدِّد»، ويفرّقه عن المركّب، فهو «تشبيه شيئين بشيئين ضربةً واحدةً، إلاّ أن أحدهما لا يداخل الآخر في الشَّبه» [@asrar، ص192]. فلو فرّقت التشبيهات لبقي كلٌّ منها صحيحًا وحده، وهذا ما فعله زُهَيْر نفسه في البيتين بعده."
    - title: "الاستعارة في «تَنَازَعَهَا»"
      text: "جعل المها والدرّ والظباء كأنها قوم يتجاذبون شيئًا واحدًا، كلٌّ يريده لنفسه، وأصل الكلمة عند الأعلم «مجاذبة الدّلو» [@diwan-zuhayr، ص126]. والاستعارة: أن يُنقل اللفظ عن معناه الأصلي إلى معنى يشبهه، وهي هنا في الفعل، وعبد القاهر يقول: «اعلم أن كل لفظة دخلتها الاستعارة المفيدة، فإنها لا تخلو من أن تكونَ اسماً أو فعلاً» [@asrar، ص44]. فالجمال حظٌّ يُتنازع عليه."
    - title: "الإجمال ثم التفسير"
      text: "يجمع الأوصاف هنا ثم يفسّرها في البيتين بعده، ولذلك قال ابن قتيبة بعد إنشاده: «ثم قال ففسّر» [@ibn-qutayba، ج1 ص140]. وقُدامة بن جعفر يسمّي هذا «صحة التفسير»: «وهي أن يضع الشاعر معاني يريد أن يذكر أحوالها في شعره الذي يصنعه، فإذا ذكرها أتى بها من غير أن يخالف معنى ما أتى به منها، ولا يزيد أو ينقص» [@naqd-al-shir، ص48]. وقد فسّر زهير الثلاثة ولم يزد عليها: الظبية في البيت 11، والمها والدرّ في البيت 12."
  connection: "ثم يفسّر الشبه الأول: ما فوق العقد منها، أي عنقها، من ظبية أدماء."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "تَنَازَعَهَلْ / مَهَا شَبَهَنْ / وَدُرْرُنْ = مفاعلتن / مفاعلتن / فعولن — نُحُورِ وَشَا / كَهَتْ فِيهَظْ / ظِبَاءُو = مفاعلتن / مفاعلْتن / فعولن"
  note: "البيت مُدَوَّر، أي انقسمت كلمة «النُّحُور» بين شطريه، فأداة التعريف آخر الصدر. ودخل العَصْب التفعيلة الثانية من العجز فصارت «مفاعلْتن»، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]."
