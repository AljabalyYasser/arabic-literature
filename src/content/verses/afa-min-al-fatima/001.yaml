first: "عَفَا مِنْ آلِ فَاطِمَةَ الْجِوَاءُ"
second: "فَيُمْنٌ فَالْقَوَادِمُ فَالْحِسَاءُ"
meaning: "خلت مواضع آل فاطمة في الجِواء ويُمْن والقَوادم والحِساء من أهلها، فتغيّرت بعدهم. وتقدير الكلام عند الأَعْلَم: «عفا من آل فاطمة منازلُهم بهذه المواضع. أي: خلَت منهم، فتغيّرت بعدهم» [@diwan-zuhayr، ص122–123]."
vocabulary:
  - term: "عَفَا"
    text: "خلا ودرَس: «أي: خلَت منهم، فتغيّرت بعدهم» [@diwan-zuhayr، ص123]."
  - term: "الْجِوَاءُ"
    text: "«ما انحدر من الأرض. والجواء أيضًا: جمع جَوّ. وهو ههنا موضع بعينه» [@diwan-zuhayr، ص122]."
  - term: "فَيُمْنٌ فَالْقَوَادِمُ فَالْحِسَاءُ"
    text: "مواضع: «و«القوادم» في بلاد غطفان. وكذلك «يُمْنٌ والحِساء»» [@diwan-zuhayr، ص122]."
context: "مطلع القصيدة، وهي في هجاء آلِ بيتٍ من كَلْب من بني عُلَيْم بن جَناب، لم يردّوا على جارٍ لهم من بني عبد الله بن غَطَفان ما خسره عندهم في القمار. وهذا البيت هو الذي يرويه أبو الفَرَج بعد الخبر بقوله: «والذي هجاهم به قوله» [@aghani-dk، ج10 ص310]. ويفتتح زُهَيْر الهجاء بما تُفتتح به القصائد الطوال: الديار الخالية، ثم الظعائن والصاحبة، ثم الناقة والحمار الوحشي، ثم مجلس الشراب، ولا يذكر القوم إلا في البيت 35. وصاحبته هنا «آل فاطمة»، وفي البيت 5 «آل ليلى»."
syntax:
  - "«عَفَا ... الْجِوَاءُ»: فعل ماضٍ وفاعله، وتقدّم بينهما الجارّ والمجرور «مِنْ آلِ فَاطِمَةَ» متعلّقًا بالفعل، أي: خلا الجواء من آل فاطمة."
  - "«فَيُمْنٌ فَالْقَوَادِمُ فَالْحِسَاءُ»: معطوفات على «الجواء» بالفاء، فهي مرفوعة مثله، والفاء تفيد الترتيب، فكأنه يعدّ المواضع واحدًا بعد واحد. ويستمرّ العطف في البيتين بعده: «فَذُو هَاشٍ»، «فَذِرْوَةُ»."
  - "«فَاطِمَةَ» ممنوعة من الصرف للعلمية والتأنيث، فجُرّت بالفتحة. و«يُمْنٌ» منصرف فنُوِّن."
morphology:
  - "«عَفَا» ماضٍ ثلاثي معتلّ الآخر بالواو (عفا يعفو)، وهو هنا لازم بمعنى خلا ودرس، ويأتي متعديًا كما في البيت بعده «عَفَتْهَا الرِّيحُ»."
  - "«الْجِوَاءُ» على «فِعَال»، وهو عند الأَعْلَم يأتي اسمًا لما انحدر من الأرض، وجمعًا لـ«جَوّ»، وهو هنا «موضع بعينه» [@diwan-zuhayr، ص122]."
  - "«الْقَوَادِمُ» على «فَوَاعِل»، وهو بناء جمع، جُعل هنا اسمَ موضع."
rhetoric:
  thesis: "هجاء يبدأ بنسيب تامّ: ديار خلت، تُعدّ مواضعها واحدًا بعد واحد، قبل أن يُذكر الخصم."
  devices:
    - title: "الحذف في «عَفَا ... الْجِوَاءُ»"
      text: "الذي عفا في الحقيقة منازلُ آل فاطمة بهذه المواضع، كما قدّره الأعلم [@diwan-zuhayr، ص122–123]، فحذف «المنازل» وأسند العفاء إلى أسماء المواضع نفسها، فصار المكان كله خاليًا. ويقول عبد القاهر الجُرْجانيّ في الحذف: «فإنك ترى به ترك الذِّكْر أفصح من الذكر، والصمت عن الإفادة أزيد للإفادة» [@dalail، ص146]."
    - title: "تعداد المواضع"
      text: "«الْجِوَاءُ ... فَيُمْنٌ فَالْقَوَادِمُ فَالْحِسَاءُ»: أربعة مواضع في بيت واحد، ثم أربعة أخرى في البيتين بعده («فَذُو هَاشٍ فَمِيثُ عُرَيْتِنَاتٍ»، «فَذِرْوَةُ فَالْجِنَابُ»)، وكلها عند الأعلم مواضع وأرَضون بأعيانها [@diwan-zuhayr، ص122–123]. فكثرة الأسماء توسّع رقعة الخراب، والعطف بالفاء ينقل العين من موضع إلى الذي يليه."
    - title: "التصريع"
      text: "«الْجِوَاءُ» و«الْحِسَاءُ»: اتفق آخر الشطرين في الوزن والرويّ، وهو التصريع، ويكون في المطالع غالبًا."
  connection: "ثم يتمّ تعداد المواضع، ويذكر ما عفّاها بعد صاحبه: الريح والمطر."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "عَفَا مِنْ آ / لِ فَاطِمَتَلْ / جِوَاءُو = مفاعلْتن / مفاعلتن / فعولن — فَيُمْنُنْ فَلْ / قَوَادِمُ فَلْ / حِسَاءُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "وزن الوافر «مفاعلتن مفاعلتن فعولن» في كل شطر، و«فعولن» في آخر الشطر أصلها «مفاعلتن» دخلها القَطْف، «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]. ودخل العَصْب التفعيلة الأولى من كل شطر فصارت «مفاعلْتن»، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]. وأُشبعت ضمّة الهمزة في «الْجِوَاءُ» و«الْحِسَاءُ»."
