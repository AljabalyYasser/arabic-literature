explained: false
first: "سَتَأْتِي آلَ حِصْنٍ حَيْثُ كَانُوا"
second: "مِنَ الْمَثُلَاتِ بَاقِيَةٌ ثِنَاءُ"
vocabulary:
  - term: "الْمَثُلَاتِ"
    text: "«جمع مَثُلة، وهو أن يُمثَّل بالإنسان، أي: يُسَبّ ويُنكَّل به» [@diwan-zuhayr، ص142]."
  - term: "بَاقِيَةٌ ثِنَاءُ"
    text: "«أي: تبقى على الدّهر، وتُروى. و«الثِّناء»: أن تُثنّى وتُردَّد مرّةً بعد مرّة» [@diwan-zuhayr، ص142]."
