first: "فَآضَ كَأَنَّهُ رَجُلٌ سَلِيبٌ"
second: "عَلَى عَلْيَاءَ لَيْسَ لَهُ رِدَاءُ"
vocabulary:
  - term: "فَآضَ كَأَنَّهُ رَجُلٌ سَلِيبٌ"
    text: "«أي: رجع وصار كأنّه رجلٌ عُريان، واقفٌ على شرَفٍ من الأرض، لا رداء عليه. وصفه بالاندماج والضُّمْر، وذكر أنّه قد ألقى وبره الحوليّ في آخر الصّيف» [@diwan-zuhayr، ص133]."
