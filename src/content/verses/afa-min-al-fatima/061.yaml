first: "فَإِنْ تَدَعُوا السَّوَاءَ فَلَيْسَ بَيْنِي"
second: "وَبَيْنَكُمُ بَنِي حِصْنٍ بَقَاءُ"
meaning: "فإن تركتم العدل يا بني حصن، فلن يُبقي بعضنا على بعض. قال الأعلم: «يقول: إن تتركوا العدل فلا بقاءَ بيني وبينكم. أي: لا يُبقي بعضُنا على بعض» [@diwan-zuhayr، ص146]."
vocabulary:
  - term: "تَدَعُوا"
    text: "تتركوا، كما في تفسير الأعلم: «إن تتركوا العدل» [@diwan-zuhayr، ص146]."
  - term: "السَّوَاءَ"
    text: "«العدل» [@diwan-zuhayr، ص145]. وفي الشرح المنسوب إلى ثَعْلَب: «والسَّواء: العَدْلُ. ومنه قوله عزّ وجلّ: ﴿إلى كلمةِ سَواءٍ﴾» [@sharh-thalab-zuhayr، ص74]."
  - term: "بَقَاءُ"
    text: "«أي: لا يُبقي بعضُنا على بعض» [@diwan-zuhayr، ص146]."
context: "أول الخاتمة. طلب منهم في البيت قبله «سُنَّةً لَا عَيْبَ فِيهَا»، أي: «جيئونا بسُنّة ليس فيها عيب، حتّى نبرأ وتبرؤوا» [@diwan-zuhayr، ص145]، وهنا يضع البديل إن رفضوا. ويسمّيهم «بني حصن» كما سمّاهم في البيت 35 «آل حصن»."
syntax:
  - "«فَإِنْ تَدَعُوا السَّوَاءَ»: «إن» شرطية، و«تدعوا» فعل الشرط مجزوم بحذف النون، والواو فاعل، و«السواءَ» مفعول به."
  - "«فَلَيْسَ بَيْنِي وَبَيْنَكُمُ ... بَقَاءُ»: الفاء رابطة لجواب الشرط، و«بقاءُ» اسم «ليس» مؤخّر، والظرف «بيني وبينكم» خبرها مقدّم، والجملة في محلّ جزم جواب الشرط."
  - "«بَنِي حِصْنٍ»: منادى بحرف نداء محذوف، منصوب بالياء لأنه ملحق بجمع المذكر السالم، معترض بين خبر «ليس» واسمها."
morphology:
  - "«تَدَعُوا» مضارع «وَدَعَ» بمعنى ترك، حُذفت فاؤه كما تُحذف في «يَعِد» و«يَصِل»."
  - "«السَّوَاء» على «فَعَال» بمعنى العدل، و«بَقَاء» مصدر «بَقِيَ» على «فَعَال»، وهمزته منقلبة عن ياء."
rhetoric:
  thesis: "عرض أخير: العدل أو القطيعة."
  devices:
    - title: "الشرط"
      text: "«فَإِنْ تَدَعُوا ... فَلَيْسَ ... بَقَاءُ»: يضع الخيار في صيغة شرط وجواب، فيجعل القطيعة نتيجة فعلهم هم لا فعله. وفي البيت قبله عرض العدل، وفي هذا جزاء تركه."
    - title: "الكناية في «فَلَيْسَ بَيْنِي وَبَيْنَكُمُ ... بَقَاءُ»"
      text: "لم يذكر الهجاء ولا الحرب، بل نفى البقاء، وفسّره الأعلم بأنه «لا يُبقي بعضُنا على بعض» [@diwan-zuhayr، ص146]، أي يذهب كلٌّ منهما في الآخر إلى آخر ما يستطيع. وهذه الكناية التي يجيء فيها المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]."
    - title: "النداء المعترض «بَنِي حِصْنٍ»"
      text: "يسمّيهم في وسط الجملة، بين «بيني وبينكم» و«بقاء»، فيقع اسمهم في الموضع الذي يفصل بين الطرفين."
  connection: "ثم يصف ما يبقى بعد ذهاب البقاء: قَذَع بين الفريقين، وقوم أساؤوا إلى أنفسهم."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَإِنْ تَدَعُسْ / سَوَاءَ فَلَيْ / سَ بَيْنِي = مفاعلتن / مفاعلتن / فعولن — وَبَيْنَكُمُو / بَنِي حِصْنِنْ / بَقَاءُو = مفاعلتن / مفاعلْتن / فعولن"
  note: "سقطت واو «تدعوا» في النطق لالتقاء الساكنين، وأُشبعت ضمّة الميم في «وَبَيْنَكُمُ». ودخل العَصْب التفعيلة الثانية من العجز، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]."
variants:
  - reading: "فَإِنْ تُرِكَ السَّوَاءُ فَلَيْسَ بَيْنِي"
    status: "رواية أبي عمرو"
    note: "في الشرح المنسوب إلى ثعلب: «أبو عمرو: «فإن تُرِكَ السَّواءُ»» [@sharh-thalab-zuhayr، ص74]. والقصيدة هناك ستة وستون بيتًا، وهذا البيت فيها الرابع والستون."
