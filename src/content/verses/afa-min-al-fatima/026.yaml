explained: false
first: "يُفَضِّلُهُ إِذَا اجْتَهَدَا عَلَيْهِ"
second: "تَمَامُ السِّنِّ مِنْهُ وَالذَّكَاءُ"
vocabulary:
  - term: "يُفَضِّلُهُ"
    text: "«أي: يُفضّل الحمارَ على الأتان، إذا اجتهدا في سيرهما على الوَعْث، أنّه أتمّ سنًّا منها» [@diwan-zuhayr، ص132]."
  - term: "الذَّكَاءُ"
    text: "«انتهاء السّنّ وأقصاه. ويقال: الذّكاء هنا: حِدّة القلب» [@diwan-zuhayr، ص132]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص132–133"
    url: "https://archive.org/details/3917pdf/page/n132/mode/1up"
