explained: false
first: "فَأَمَّا مَا فُوَيْقَ الْعِقْدِ مِنْهَا"
second: "فَمِنْ أَدْمَاءَ مَرْتَعُهَا الْخَلَاءُ"
vocabulary:
  - term: "مَا فُوَيْقَ الْعِقْدِ"
    text: "«يعني: عنقها، لأنّ موضع العقد: النَّحر، وفوقه العنق. وصغّر «فوق» لتقارب ما بين العنق والعقد» [@diwan-zuhayr، ص126]."
  - term: "أَدْمَاءَ"
    text: "«الظّبية البيضاء» [@diwan-zuhayr، ص126]."
  - term: "مَرْتَعُهَا الْخَلَاءُ"
    text: "«الخلاء»: «الموضع الخالي. وإنما خصّ الظّبية به، لأنه أراد أنها إذا تفرّدت تجزع، فتتشوّف، وتمدّ عنقها. وذلك أحسن لها» [@diwan-zuhayr، ص126]."
