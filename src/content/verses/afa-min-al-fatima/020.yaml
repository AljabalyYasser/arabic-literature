explained: false
first: "فَأَوْرَدَهَا حِيَاضَ صُنَيْبِعَاتٍ"
second: "فَأَلْفَاهُنَّ لَيْسَ بِهِنَّ مَاءُ"
vocabulary:
  - term: "فَأَوْرَدَهَا"
    text: "«أي: أورد الحمارُ الأتانَ. فأضمرها، ولم يَجرِ لها ذكر، لأنّ ذِكره الحمار يدلّ عليها، إذ كان لا يكاد يخلو منها» [@diwan-zuhayr، ص130]."
  - term: "حِيَاضَ صُنَيْبِعَاتٍ"
    text: "«و«صُنَيبعات»: اسم أرض. وأراد بـ«الحياض»: مناقع الماء، ولم يُرِد حياضًا محتفَرة» [@diwan-zuhayr، ص130]."
sources:
