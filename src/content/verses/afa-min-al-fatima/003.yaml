explained: false
first: "فَذِرْوَةُ فَالْجِنَابُ كَأَنَّ خُنْسَ الـ"
second: "ـنِّعَاجِ الطَّاوِيَاتِ بِهَا الْمُلَاءُ"
vocabulary:
  - term: "فَذِرْوَةُ فَالْجِنَابُ"
    text: "«أرضان» [@diwan-zuhayr، ص123]."
  - term: "خُنْسَ النِّعَاجِ"
    text: "النعاج: «إناث البقر»، والخُنْس: «جمع خَنْساء، وهي القصيرة الأنف. وبذلك تُوصف البقر» [@diwan-zuhayr، ص123]."
  - term: "الطَّاوِيَاتِ"
    text: "«الضّامرات البطون» [@diwan-zuhayr، ص123]."
  - term: "الْمُلَاءُ"
    text: "«أرديةُ الحرير، شبّه البقر بها لبياضها» [@diwan-zuhayr، ص123]."
