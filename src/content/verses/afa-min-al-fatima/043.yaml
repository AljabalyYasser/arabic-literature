first: "جِوَارٌ شَاهِدٌ عَدْلٌ عَلَيْكُمْ"
second: "وَسِيَّانِ الْكَفَالَةُ وَالتَّلَاءُ"
vocabulary:
  - term: "جِوَارٌ شَاهِدٌ عَدْلٌ عَلَيْكُمْ"
    text: "«يقول: قد كان هذا الرجل جارًا لكم، وجواره بيّن مشهور، فهو شاهد عليكم أنّكم أصحابه» [@diwan-zuhayr، ص139]."
  - term: "سِيَّانِ"
    text: "«أي: مِثلان» [@diwan-zuhayr، ص139]."
  - term: "التَّلَاءُ"
    text: "«الحَوالة. أي: من كفل لك كفالةً، ومن جعل لك» [@diwan-zuhayr، ص139] «حَوالةً من ذمّة، فقد وجب حقٌّ بهذين جميعًا» [@diwan-zuhayr، ص140]."
