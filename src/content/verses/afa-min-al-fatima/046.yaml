second: "دَعَاهُ الصَّيْفُ وَانْقَطَعَ الشِّتَاءُ"
vocabulary:
  - term: "دَعَاهُ الصَّيْفُ"
    text: "«وكانوا يتجاورون في الشّتاء لشدّة الزّمان، وعدم الخِصب، وكثرة غارة بعضهم على بعض. فإذا أقبل الصّيف رجع كلّ جارٍ إلى أهله ومَحضَره» [@diwan-zuhayr، ص140]."
