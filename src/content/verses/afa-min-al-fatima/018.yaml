explained: false
first: "تَرَبَّعَ صَارَةً حَتَّى إِذَا مَا"
second: "فَنَى الدُّحْلَانُ عَنْهُ وَالْإِضَاءُ"
vocabulary:
  - term: "تَرَبَّعَ صَارَةً"
    text: "«تربّع»: «أي: أقام في الرّبيع. و«صارة»: موضع» [@diwan-zuhayr، ص129]."
  - term: "فَنَى"
    text: "«أراد: فَنِيَ، ففتح ما قبل الياء فانقلبت ألفًا، وهي لغة لطيّئ» [@diwan-zuhayr، ص129]."
  - term: "الدُّحْلَانُ"
    text: "«جمع دَحْل، وهي البئر الجيّدة الموضع من الكلأ» [@diwan-zuhayr، ص130]."
  - term: "الْإِضَاءُ"
    text: "«الغُدران» [@diwan-zuhayr، ص130]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص129–130"
    url: "https://archive.org/details/3917pdf/page/n129/mode/1up"
status: "review"
