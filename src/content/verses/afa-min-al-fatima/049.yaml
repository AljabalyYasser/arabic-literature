explained: false
first: "لَقَدْ زَارَتْ بُيُوتَ بَنِي عُلَيْمٍ"
second: "مِنَ الْكَلِمَاتِ آنِيَةٌ مِلَاءُ"
vocabulary:
  - term: "بَنِي عُلَيْمٍ"
    text: "«من كلب، وهو عُلَيم بن جَناب» [@diwan-zuhayr، ص141]."
  - term: "الْكَلِمَاتِ"
    text: "«يعني: قصائد الهجو. والعرب تسمّي القصيدة كلمة» [@diwan-zuhayr، ص141]."
  - term: "آنِيَةٌ مِلَاءُ"
    text: "«أي: مملوءةٌ شرًّا من الهجاء. وضرب الآنية مثلًا» [@diwan-zuhayr، ص141]."
sources:
