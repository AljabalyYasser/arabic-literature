first: "وَتُوقَدْ نَارُكُمْ شَرَرًا وَيُرْفَعْ"
second: "لَكُمْ فِي كُلِّ مَجْمَعَةٍ لِوَاءُ"
meaning: "ويشتهر أمركم في الناس كنارٍ يتطاير شررها، ويُرفع لغدركم لواء في كل مجمع. قال الأعلم: «أي: يظهر أمركم في الناس، وينتشر خبركم»، وهي «ليست بنار حرب، إنّما هي نار شُهرة، يطير لها شرر في الناس» [@diwan-zuhayr، ص146]."
vocabulary:
  - term: "شَرَرًا"
    text: "«وضرب الشّرر مثلًا لما ينتشر عنهم، ويُشهر من أمرهم» [@diwan-zuhayr، ص146]."
  - term: "مَجْمَعَةٍ"
    text: "المحفل يجتمع فيه الناس، ففي تفسير الأعلم: «أي: يظهر أمركم في المحافل ويُشهر غدركم» [@diwan-zuhayr، ص146]."
  - term: "لِوَاءُ"
    text: "«واللّواء: البَنْد» [@diwan-zuhayr، ص146]."
context: "خاتمة القصيدة في رواية الأعلم. وفي الشرح المنسوب إلى ثَعْلَب يأتي آخرًا بعد قوله: «[وروى الأصمعيّ بعده]» [@sharh-thalab-zuhayr، ص74]. ثم يروي الأعلم عن الأصمعي ما كان بعد القصيدة: «فلمّا بلغهم قول زهير بعثوا إليه بالإبل، وأرسلوا إلى زهير يُخبرونه خبر صاحبه، ويعتذرون إليه. ولاموه على ما فرط منه. فأرسل إليهم زهير: والله لقد فعلتُ وعجلتُ، وايمُ الله لا أهجو أهل بيت من العرب، أبدًا» [@diwan-zuhayr، ص146]. فالوعيد الذي تنتهي به القصيدة ردّ المال إلى صاحبه."
syntax:
  - "«وَتُوقَدْ» و«وَيُرْفَعْ»: فعلان مضارعان مبنيان للمجهول مجزومان، معطوفان على «وَتُلْفَوْا» في البيت قبله، وكلها معطوفة على جواب الشرط «فَلَيْسَ بَيْنِي وَبَيْنَكُمُ ... بَقَاءُ» في البيت 61، لأن جملة الجواب المقرونة بالفاء في محلّ جزم."
  - "«نَارُكُمْ» نائب فاعل «توقد»، و«شَرَرًا» تمييز محوّل عن نائب الفاعل، أي: يوقد شررُ ناركم، كما في قوله تعالى ﴿وَاشْتَعَلَ الرَّأْسُ شَيْبًا﴾."
  - "«لِوَاءُ» نائب فاعل «يُرفع» مؤخّر، و«لَكُمْ» و«فِي كُلِّ مَجْمَعَةٍ» متعلّقان بالفعل."
morphology:
  - "«تُوقَدْ» مضارع «أَوْقَدَ» على «أَفْعَلَ» مبنيًّا للمجهول، وفاؤه واو ظهرت في المضارع."
  - "«مَجْمَعَة» على «مَفْعَلَة»، اسم مكان من «جمع»: موضع اجتماع الناس."
  - "«لِوَاء» على «فِعَال» من «لوى»، وهمزته منقلبة عن الياء."
rhetoric:
  thesis: "الهجاء نار تُشهر صاحبها، ولواء غدر يُرفع فوق رأسه."
  devices:
    - title: "الاستعارة في «وَتُوقَدْ نَارُكُمْ شَرَرًا»"
      text: "الشهرة نار، والأخبار المتطايرة عنهم شررها. والأعلم يجعلها «نار شُهرة» لا «نار حرب»، ويقول: «والنار يُضرب بها المثل في الشّهرة»، وينشد للأعشى «يَكُنْ مَا أَسَاءَ النَّارَ فِي رَأْسِ كَبْكَبَا» [@diwan-zuhayr، ص146]. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الكناية في «وَيُرْفَعْ لَكُمْ فِي كُلِّ مَجْمَعَةٍ لِوَاءُ»"
      text: "لم يقل: سيُعرف غدركم، بل ذكر علامته: لواء يُرفع لهم في المحافل. والأعلم يربطه بالحديث: «وجاء في الحديث «لكلّ غادرٍ لواءٌ يوم القيامة»» [@diwan-zuhayr، ص146]. وهي الكناية التي يجيء فيها المتكلم «إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]: اللواء يتبع الغدر، فذِكره يدلّ عليه."
    - title: "الختام بالصورة"
      text: "يختم القصيدة بصورتين للشهرة: نار ترى من بعيد، ولواء يُرفع في كل مجمع. فيبقى في سمع المهجوّ آخر ما يقال فيه: أن أمره سيُعرف في كل مكان."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَتُوقَدْ نَا / رُكُمْ شَرَرَنْ / وَيُرْفَعْ = مفاعلْتن / مفاعلتن / فعولن — لَكُمْ فِي كُلْ / لِ مَجْمَعَتِنْ / لِوَاءُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "دخل العَصْب التفعيلة الأولى من كل شطر فصارت «مفاعلْتن»، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]."
