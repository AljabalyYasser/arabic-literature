first: "فَذَلِكُمُ مَقَاطِعُ كُلِّ حَقٍّ"
second: "ثَلَاثٌ كُلُّهُنَّ لَكُمْ شِفَاءُ"
meaning: "فهذه الثلاث هي التي يُقطع بها كلّ حقّ، وفي كل واحدة منها شفاء لكم من الشكّ والخصومة. قال الأعلم: «أي: فذلكم المقطع، الذي هو الثّلاث، مقاطعُ كلّ حقّ. وجعل تبيين الحقّ «شفاء» من الالتباس والشّكّ» [@diwan-zuhayr، ص138–139]."
vocabulary:
  - term: "مَقَاطِعُ"
    text: "جمع «مَقْطَع»: ما يُفصل به الحقّ، وقد مرّ في البيت قبله [@lisan، ج8 ص282]."
  - term: "شِفَاءُ"
    text: "«وجعل تبيين الحقّ «شفاء» من الالتباس والشّكّ» [@diwan-zuhayr، ص139]."
context: "يكرّر قاعدة البيت السابق ويوجّهها إليهم. ويستشهد أبو هلال العَسْكَرِيّ بالبيتين معًا على صحة القسمة [@sinaatayn، ص342]. وبعد هذا يلين القول: «فَلَا مُسْتَكْرَهُونَ لِمَا مَنَعْتُمْ»، قال الأعلم: «فليّن لهم القول — كما ترى — بعد توعّده لهم، ليستميلهم بذلك» [@diwan-zuhayr، ص139]."
syntax:
  - "«فَذَلِكُمُ»: «ذا» اسم إشارة مبتدأ، واللام للبعد، و«كم» حرف خطاب للجماعة. قال الأعلم: «قوله «فذلكم» مردود إلى قوله «مقطعه ثلاث»» [@diwan-zuhayr، ص138]."
  - "«مَقَاطِعُ كُلِّ حَقٍّ»: خبر المبتدأ، و«كلّ» مضاف إليه، و«حقّ» مضاف إليه."
  - "«ثَلَاثٌ»: بدل من «مقاطع». و«كُلُّهُنَّ لَكُمْ شِفَاءُ» جملة اسمية صفة لـ«ثلاث»: «كلّهنّ» مبتدأ، و«شفاء» خبره، و«لكم» متعلّق بـ«شفاء»."
morphology:
  - "«مَقَاطِع» جمع «مَقْطَع» على «مَفَاعِل»، صيغة منتهى الجموع، وهي ممنوعة من الصرف."
  - "«شِفَاء» مصدر «شفى» على «فِعَال»، وهمزته منقلبة عن الياء لتطرّفها بعد ألف زائدة."
rhetoric:
  thesis: "يعيد القاعدة ويجعلها دواءً لهم لا قيدًا عليهم."
  devices:
    - title: "الاستعارة في «شِفَاءُ»"
      text: "جعل تبيّن الحقّ شفاءً، كأن الشكّ والخصومة مرض، وهو ما يقوله الأعلم: «وجعل تبيين الحقّ «شفاء» من الالتباس والشّكّ» [@diwan-zuhayr، ص139]. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "التكرار"
      text: "«مَقْطَعُهُ ثَلَاثٌ» في البيت قبله، ثم «مَقَاطِعُ كُلِّ حَقٍّ ثَلَاثٌ» هنا: يكرّر اللفظ والعدد ليثبّت القاعدة، ثم يزيد «كُلُّهُنَّ لَكُمْ شِفَاءُ»، فتنتقل القاعدة من العموم إلى المخاطبين."
    - title: "الالتفات في «فَذَلِكُمُ ... لَكُمْ»"
      text: "تحدّث عنهم بضمير الغائب في الأبيات 37–39 («وَإِمَّا أَنْ يَقُولُوا»)، ثم خاطبهم هنا. والالتفات: الانتقال من الغيبة إلى الخطاب أو العكس، وهو هنا يجعل القاعدة موجّهة إلى وجوههم."
  connection: "ثم يلين لهم القول: لا يُكرهون على ما منعوا، ولا يُعطون إلا عن طيب نفس."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَذَالِكُمُو / مَقَاطِعُ كُلْ / لِ حَقْقِنْ = مفاعلتن / مفاعلتن / فعولن — ثَلَاثُنْ كُلْ / لُهُنْنَ لَكُمْ / شِفَاءُو = مفاعلْتن / مفاعلتن / فعولن"
  note: "أُشبعت ضمّة الميم في «فَذَلِكُمُ» فصارت «ذلكمو» لتتمّ «مفاعلتن». ودخل العَصْب التفعيلة الأولى من العجز، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]."
