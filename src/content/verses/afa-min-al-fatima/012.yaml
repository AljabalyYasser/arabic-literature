first: "وَأَمَّا الْمُقْلَتَانِ فَمِنْ مَهَاةٍ"
second: "وَلِلدُّرِّ الْمَلَاحَةُ وَالصَّفَاءُ"
vocabulary:
  - term: "الْمُقْلَتَانِ فَمِنْ مَهَاةٍ"
    text: "المقلتان: «العينان. شبّه عينيها بعيني المهاة، في شدّة ابيضاض بياضها واسوداد سوادها. وذلك هو الحَوَر» [@diwan-zuhayr، ص126]. والمها: «بقر الوحش» [@diwan-zuhayr، ص126]."
  - term: "وَلِلدُّرِّ الْمَلَاحَةُ وَالصَّفَاءُ"
    text: "«وشبّه ملاحتها وصفاءها بملاحة الدُّرّة وصفائها» [@diwan-zuhayr، ص126]."
