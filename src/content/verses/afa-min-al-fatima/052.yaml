explained: false
first: "فَلَمْ أَرَ مَعْشَرًا أَسَرُوا هَدِيًّا"
second: "وَلَمْ أَرَ جَارَ بَيْتٍ يُسْتَبَاءُ"
vocabulary:
  - term: "هَدِيًّا"
    text: "«الرجل ذو الحُرمة، وهو المستجير بالقوم ما لم يُجَر أو يأخذ عهدًا»، «وسُمّي هديًّا على معنى أنّ له حرمةً، مثل حرمة الهدي الذي يُهدى إلى البيت الحرام» [@diwan-zuhayr، ص142]."
  - term: "يُسْتَبَاءُ"
    text: "«أي: تُؤخذ امرأته. وكان هذا الرجل قد قامر على أهله وماله، فقُمِر، وأُخذت منه امرأته وماله» [@diwan-zuhayr، ص142]."
sources:
