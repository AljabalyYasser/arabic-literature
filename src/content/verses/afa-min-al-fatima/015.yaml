explained: false
first: "كَأَنَّ الرَّحْلَ مِنْهَا فَوْقَ صَعْلٍ"
second: "مِنَ الظِّلْمَانِ جُؤْجُؤُهُ هَوَاءُ"
vocabulary:
  - term: "صَعْلٍ مِنَ الظِّلْمَانِ"
    text: "«شبّه الناقة، في سرعتها، بالظَّليم. فكأنّ رحلها فوقه. و«الصَّعْل»: الصغير الرأس، وبذلك يُوصف الظّليم» [@diwan-zuhayr، ص127]. والظِّلمان جمع ظليم، «وهو ذكر النعام» كما يقول المحقق [@diwan-zuhayr، ص127]."
  - term: "جُؤْجُؤُهُ هَوَاءُ"
    text: "«أي: صدره خالٍ، كأنه لا قلب له. وإنما أراد أنه ليس له عقل» [@diwan-zuhayr، ص127]."
sources:
