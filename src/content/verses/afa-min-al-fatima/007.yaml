explained: false
first: "تَحَمَّلَ أَهْلُهَا مِنْهَا فَبَانُوا"
second: "عَلَى آثَارِ مَنْ ذَهَبَ الْعَفَاءُ"
vocabulary:
  - term: "تَحَمَّلَ"
    text: "«أي: ترحّلوا من هذه المواضع التي وصف» [@diwan-zuhayr، ص124]."
  - term: "عَلَى آثَارِ مَنْ ذَهَبَ الْعَفَاءُ"
    text: "العفاء: الدُّروس، وهو دعاء على الدار. «يقول: مَن ذهب لم آسَ عليه، ولم أُشفق لذهابه، فعلى آثاره الدّروس»، ثم قال: «وإنما دعا عليها ضجرًا، لما يقاسي من الشوق إلى أهلها» [@diwan-zuhayr، ص124]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص124"
    url: "https://archive.org/details/3917pdf/page/n124/mode/1up"
status: "review"
