first: "غَصِصْتَ بِنِيئِهَا فَبَشِمْتَ عَنْهَا"
second: "وَعِنْدَكَ لَوْ أَرَدْتَ لَهَا دَوَاءُ"
vocabulary:
  - term: "غَصِصْتَ بِنِيئِهَا فَبَشِمْتَ عَنْهَا"
    text: "«أي: هذا المال الذي أخذته كمضغةٍ نيئة، غصِصت بها وبشِمت عنها، وعندك لها دواء. ودواؤها أن تردّ هذا المال إلى أهله» [@diwan-zuhayr، ص144]. وبشِم: «تخِم أو سئم» كما يقول المحقق [@diwan-zuhayr، ص143]."
