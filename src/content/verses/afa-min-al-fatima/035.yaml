first: "وَمَا أَدْرِي وَسَوْفَ إِخَالُ أَدْرِي"
second: "أَقَوْمٌ آلُ حِصْنٍ أَمْ نِسَاءُ"
meaning: "لا أدري، وأظنّني سأدري: أرجالٌ آلُ حصن أم نساء؟ يسأل سؤال من لا يعرف، وهو يعرف. قال الأَعْلَم: «يقول: ما أدري: أرجالٌ آلُ حصنٍ أم نساء؟»، ثم قال: «وإنما يهزأ بهم ويتوعّدهم» [@diwan-zuhayr، ص136]."
vocabulary:
  - term: "إِخَالُ"
    text: "أظنّ. وفي لسان العرب: «وَتَقُولُ فِي مُسْتَقْبَلِهِ: إِخالُ، بِكَسْرِ الأَلف، وَهُوَ الأَفصح، وَبَنُو أَسد يَقُولُونَ أَخَالُ، بِالْفَتْحِ، وَهُوَ الْقِيَاسُ» [@lisan، ج11 ص226]."
  - term: "قَوْمٌ"
    text: "«و«القوم»: الرّجال دون النساء، على هذا. وقد يقع القوم على الرّجال والنساء» [@diwan-zuhayr، ص136]."
  - term: "آلُ حِصْنٍ"
    text: "«وبنو «حصن» هؤلاء: من كلب» [@diwan-zuhayr، ص136]، أي من بني عُلَيْم، لا آل حِصْن بن حُذَيْفة الفَزارِيّ."
context: "هنا يبلغ زُهَيْر خصومه بعد أربعة وثلاثين بيتًا من النسيب والوصف، فيبدأ الهجاء بسؤال لا بشتيمة. ويرى شوقي ضيف أن زهيرًا «فيما صح من هذا الهجاء لا يوغل فى الاقذاع وهتك الأعراض إيغال أستاذه أوس والجاهليين من حوله، بل يبقى على مهجوه وعلى نفسه، عامدا إلى السخرية»، ثم ينشد هذا البيت والذي بعده [@deif، ج1 ص317]. وآل حصن هنا من كلب كما يقول الأعلم، وليسوا آل حِصْن بن حُذَيْفة الذي مدحه زهير في قصيدته [«صَحَا الْقَلْبُ عَنْ سَلْمَى وَأَقْصَرَ بَاطِلُهْ»](/texts/saha-al-qalb-batiluh/). وفي لسان العرب أنه «يُرِيدُ حِصْنَ بنَ حُذَيْفَةَ الفزاريَّ» [@lisan، ج13 ص121]، وهو خلط بين الرجلين، فالخبر عند الأعلم وأبي الفَرَج في بني عُلَيْم من كلب [@diwan-zuhayr، ص122] [@aghani-dk، ج10 ص310]."
syntax:
  - "«وَمَا أَدْرِي»: «ما» نافية، و«أدري» فعل مضارع، وجملة الاستفهام في العجز في موضع نصب مفعول به لـ«أدري»، وقد عُلِّق عنها الفعل. والتعليق: أن يمنع ما له الصدارة، كالاستفهام، فعلَ القلب من العمل في اللفظ، فيعمل في المحلّ."
  - "«وَسَوْفَ إِخَالُ أَدْرِي»: جملة معترضة، و«إِخَالُ» متوسّطة بين «سوف» والفعل «أدري» لا تعمل، كأنه قال: وسوف أدري فيما أظنّ."
  - "«أَقَوْمٌ آلُ حِصْنٍ أَمْ نِسَاءُ»: الهمزة للاستفهام، و«قومٌ» خبر مقدّم، و«آلُ حصن» مبتدأ مؤخّر، و«أم» معادلة للهمزة، و«نساءُ» معطوف على «قوم»."
morphology:
  - "«أَدْرِي» مضارع «دَرَى» معتلّ الآخر بالياء."
  - "«إِخَالُ» مضارع «خال» بمعنى ظنّ. والقياس فيه فتح الهمزة «أَخال»، والكسر عند ابن منظور «الأَفصح»، و«الْكَسْرُ أَكثر اسْتِعْمَالًا» [@lisan، ج11 ص226]."
  - "«قَوْمٌ» اسم جمع لا واحد له من لفظه، و«نِسَاءُ» جمع لا مفرد له من لفظه، ومفرده في المعنى «امرأة»."
rhetoric:
  thesis: "يشتم القوم بسؤال: يتظاهر بأنه لا يعرف أهم رجال أم نساء."
  devices:
    - title: "التشكك"
      text: "«وَمَا أَدْرِي ... أَقَوْمٌ آلُ حِصْنٍ أَمْ نِسَاءُ»: التشكك أن يُظهر الشاعر الشكّ في أمر يعرفه. وبهذا البيت والذي بعده يبدأ ابن رَشِيق «باب التشكك»، ويقول فيه: «وهو من ملح الشعر وطرف الكلام، وله في النفس حلاوة وحسن موقع»، ثم يقول بعد إنشادهما: «فقد أظهر أنه لم يعلم أنهم رجال أم نساء، وهذا أملح من أن يقول: هم نساء، وأقرب إلى التصديق» [@ibn-rashiq، ج2 ص66]."
    - title: "السخرية في «وَسَوْفَ إِخَالُ أَدْرِي»"
      text: "الاعتراض يزيد الاستهزاء، كأنه سيبحث في أمرهم بحثًا جادًّا. قال الأعلم: «أي: سأبحث عن حقيقة أمرهم، حتّى أتبيّنها. وإنما يهزأ بهم ويتوعّدهم» [@diwan-zuhayr، ص136]. ويسمّي شوقي ضيف هذا «سخرية مرة، تحمل كل ما يريد من وصفهم بالجبن» [@deif، ج1 ص317]."
    - title: "المقابلة بين «قَوْمٌ» و«نِسَاءُ»"
      text: "«قوم» هنا الرجال وحدهم كما يقول الأعلم [@diwan-zuhayr، ص136]، فوضعها في مقابل «نساء» يُخرج النساء منها، ويجعل السؤال بين الرجولة وعدمها."
  connection: "ثم يأخذ بالاحتمال الثاني ويرتّب عليه حكمه: إن كانوا نساء فليُزفّوا إلى الأزواج."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "وَمَا أَدْرِي / وَسَوْفَ إِخَا / لُ أَدْرِي = مفاعلْتن / مفاعلتن / فعولن — أَقَوْمُنْ آ / لُ حِصْنِنْ أَمْ / نِسَاءُو = مفاعلْتن / مفاعلْتن / فعولن"
  note: "دخل العَصْب التفعيلة الأولى من الصدر والأوليين من العجز فصارت «مفاعلْتن»، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]."
