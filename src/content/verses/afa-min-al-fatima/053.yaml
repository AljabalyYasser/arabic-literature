explained: false
first: "وَجَارُ الْبَيْتِ وَالرَّجُلُ الْمُنَادِي"
second: "أَمَامَ الْحَيِّ عَقْدُهُمَا سَوَاءُ"
vocabulary:
  - term: "الْمُنَادِي"
    text: "«المُجالِس. وهو من النّادي والنَّديّ، وهما المجلس» [@diwan-zuhayr، ص143]."
  - term: "أَمَامَ الْحَيِّ"
    text: "«لأنّ مجالسهم كانت أمام الحيّ، لئلّا يسمع النساء كلامهم، ويطّلعن على تدبيرهم» [@diwan-zuhayr، ص143]."
  - term: "عَقْدُهُمَا سَوَاءُ"
    text: "«يقول: من جاور قومًا ومن جالسهم فحقّهما سواء، وذمّتهما واحدة» [@diwan-zuhayr، ص143]."
