first: "لَقَدْ طَالَبْتُهَا وَلِكُلِّ شَيْءٍ"
second: "وَإِنْ طَالَتْ لَجَاجَتُهُ انْتِهَاءُ"
vocabulary:
  - term: "وَإِنْ طَالَتْ لَجَاجَتُهُ انْتِهَاءُ"
    text: "«أي: لكلّ شيء غاية ينتهي إليها، وإن طالت لَجاجةُ الإنسان في ذلك الشيء. وضرب هذا مثلًا لطول مطالبته، وتتبّعه هذه المرأة، ورجوعِ نفسه عنها» [@diwan-zuhayr، ص125]."
