first: "وَجَارٍ سَارَ مُعْتَمِدًا إِلَيْكُمْ"
second: "أَجَاءَتْهُ الْمَخَافَةُ وَالرَّجَاءُ"
vocabulary:
  - term: "أَجَاءَتْهُ"
    text: "«أي: صيّرته إليكم، وجاء به نحوكم، مخافتُه من غيركم ورجاؤه لكم» [@diwan-zuhayr، ص140]."
  - term: "مُعْتَمِدًا"
    text: "«القاصد» كما يقول المحقق [@diwan-zuhayr، ص140]."
