explained: false
first: "فَشَجَّ بِهَا الْأَمَاعِزَ فَهْيَ تَهْوِي"
second: "هُوِيَّ الدَّلْوِ أَسْلَمَهَا الرِّشَاءُ"
vocabulary:
  - term: "فَشَجَّ بِهَا الْأَمَاعِزَ"
    text: "«فجعل يعلو بالأتان «الأماعز» وهي: حُزون الأرض الكثيرة الحصى» [@diwan-zuhayr، ص131]."
  - term: "تَهْوِي"
    text: "«تُسرع» [@diwan-zuhayr، ص131]."
  - term: "أَسْلَمَهَا الرِّشَاءُ"
    text: "«و«الرِّشاء»: الحبل. شبّه سرعة الأتان، وانقضاضها في عدوها، بالدّلو إذا انتُزعت ملأى، فانقطع حبلها وأسلمها» [@diwan-zuhayr، ص131]."
