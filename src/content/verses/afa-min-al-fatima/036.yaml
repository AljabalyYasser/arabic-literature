first: "فَإِنْ قَالُوا النِّسَاءُ مُخَبَّآتٍ"
second: "فَحُقَّ لِكُلِّ مُحْصَنَةٍ هِدَاءُ"
meaning: "فإن قالوا: نحن النساء المخبّآت في الخدور، فقد حقّ أن تُزفّ كلّ واحدة منهنّ إلى زوج. قال الأعلم: «أي: إن قال بنو حصن: نحن النساء اللواتي يختبئن في الخدور والحِجال، فينبغي أن يُزوَّجن من الرّجال إذًا، ويُهدَين إلى أزواجهنّ» [@diwan-zuhayr، ص136]. ثم بيّن مراده: «وإنما يريد: إن كانوا رجالًا فسيُوفون بعهدهم، ويُبقون على أعراضهم، وإن كانوا نساء فمن شِيَم النساء الغدر وقلّة الوفاء» [@diwan-zuhayr، ص137]."
vocabulary:
  - term: "مُخَبَّآتٍ"
    text: "مستورات في الخدور، وهنّ عند الأعلم «النساء اللواتي يختبئن في الخدور والحِجال» [@diwan-zuhayr، ص136]."
  - term: "مُحْصَنَةٍ"
    text: "«ذات الزّوج، وهي أيضًا: البِكر؛ لأنّ الإحصان يكون بها، فتُوصف بما يؤول إليه أمرها» [@diwan-zuhayr، ص136–137]."
  - term: "هِدَاءُ"
    text: "«زِفاف العروس إلى زوجها» [@diwan-zuhayr، ص136]."
context: "جواب السؤال في البيت قبله على أحد وجهيه. وبهذين البيتين يستشهد ابن رَشِيق في «باب التشكك» [@ibn-rashiq، ج2 ص66]، وشوقي ضيف في سخرية زُهَيْر، ويقول: «فهن نساء خبّئن فى الخدور، وينبغى أن يزوّجن. وهى سخرية مرة، تحمل كل ما يريد من وصفهم بالجبن. وكان يجد فى مثلها ما يكفيه عن الإقذاع المفحش» [@deif، ج1 ص317]. والإقذاع: الفحش في الهجاء."
syntax:
  - "«فَإِنْ قَالُوا»: «إن» شرطية، و«قالوا» فعل الشرط في محلّ جزم. و«النِّسَاءُ» خبر لمبتدأ محذوف تقديره «نحن»، كما في تفسير الأعلم، والجملة مقول القول."
  - "«مُخَبَّآتٍ» حال منصوبة بالكسرة لأنها جمع مؤنث سالم. وهي عند الأعلم حال مؤكِّدة: «ونصبَ «مخبّآت» على الحال المؤكَّد بها، لأنّه إذا ذكر «النساء» فقد دلّ على التخبئة، إذ كان ذلك من شأنهنّ. ثم أكّده بذكر الحال» [@diwan-zuhayr، ص137]. والحال المؤكِّدة: التي لا تأتي بمعنى جديد، بل تؤكّد ما فُهم من الكلام قبلها."
  - "«فَحُقَّ»: الفاء رابطة لجواب الشرط، و«حُقَّ» فعل ماضٍ مبنيّ للمجهول بمعنى وجب، و«هِدَاءُ» نائب فاعله مؤخّر، و«لِكُلِّ مُحْصَنَةٍ» متعلّق به."
morphology:
  - "«مُخَبَّآتٍ» جمع «مُخَبَّأة»، اسم مفعول من «خَبَّأ» على «فَعَّلَ» بالتضعيف، وهو بناء التكثير: مستورات سترًا بعد ستر."
  - "«مُحْصَنَةٍ» اسم مفعول من «أَحْصَنَ» على «أَفْعَلَ»: التي أُحصنت بزوج."
  - "«هِدَاءُ» مصدر على «فِعَال» من «هدى العروسَ إلى زوجها»."
rhetoric:
  thesis: "يأخذ بالاحتمال الأدنى ويمضي فيه إلى آخره: إن كانوا نساء فليُزفّوا."
  devices:
    - title: "الكناية في «فَحُقَّ لِكُلِّ مُحْصَنَةٍ هِدَاءُ»"
      text: "لم يقل إنهم جبناء أو غادرون، بل ذكر ما يلزم من كونهم نساء: أن يُزفّوا إلى الرجال. وهذه الكناية التي يصفها عبد القاهر الجُرْجانيّ بأن المتكلم «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. فالمعنى المسكوت عنه، أنهم لا يصلحون للحرب ولا للوفاء، يصل إلى السامع من طريق صورة مضحكة."
    - title: "السخرية في «فَإِنْ قَالُوا النِّسَاءُ»"
      text: "يضع الجواب على ألسنتهم، كأنهم هم الذين يقولون إنهم نساء. وهذا ما يسمّيه شوقي ضيف «سخرية»، ويرى أن تلميذ زهير الحُطَيْئة أخذها عنه: «وقد استعار منه تلميذه هذه الأداة أداة السخرية فأشاعها فى أهاجيه» [@deif، ج1 ص317]."
    - title: "التوكيد بالحال «مُخَبَّآتٍ»"
      text: "الحال لا تزيد معنى على «النساء»، فالأعلم يقول إن ذكر النساء «فقد دلّ على التخبئة» [@diwan-zuhayr، ص137]. لكنها تثبّت الصورة: نساء مستورات في الخدور، لا رجال في الميدان."
  connection: "ثم يعدّد الأجوبة الأخرى التي قد يجيب بها بنو مَصاد من بني حصن."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الهمزة المضمومة"
  scansion: "فَإِنْ قَالُنْ / نِسَاءُ مُخَبْ / بَآتِنْ = مفاعلْتن / مفاعلتن / فعولن — فَحُقْقَ لِكُلْ / لِ مُحْصَنَتِنْ / هِدَاءُو = مفاعلتن / مفاعلتن / فعولن"
  note: "سقطت واو «قالوا» في النطق لالتقاء الساكنين، فصارت «قالُنْ نِسا». ودخل العَصْب التفعيلة الأولى من الصدر فصارت «مفاعلْتن»، والعصب: «هو تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]."
variants:
  - reading: "فَإِنْ تَكُنِ النِّسَاءُ مُخَبَّآتٍ"
    status: "رواية ابن رشيق"
    note: "[@ibn-rashiq، ج2 ص66]. وعلى هذه الرواية لا يضع الجواب على ألسنتهم، بل يفترضه هو."
