explained: false
first: "فَلَا مُسْتَكْرَهُونَ لِمَا مَنَعْتُمْ"
second: "وَلَا تُعْطُونَ إِلَّا أَنْ تَشَاءُوا"
vocabulary:
  - term: "فَلَا مُسْتَكْرَهُونَ"
    text: "«أي: أنتم لا مستكرَهون على ما منعتم من الوفاء بالجوار، وتأدية مال هذا الرجل. إنّما تُعطون — إن أعطيتم — عن طيب نفس. فليّن لهم القول — كما ترى — بعد توعّده لهم، ليستميلهم بذلك» [@diwan-zuhayr، ص139]."
