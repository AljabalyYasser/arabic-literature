explained: false
first: "وَإِمَّا أَنْ يَقُولُوا قَدْ أَبَيْنَا"
second: "فَشَرُّ مَوَاطِنِ الْحَسَبِ الْإِبَاءُ"
vocabulary:
  - term: "قَدْ أَبَيْنَا"
    text: "«أي: أبينا أن نُخلّي الأسارى الذين في أيدينا» [@diwan-zuhayr، ص138]، ويقول المحقق: «وليس فيما مضى من ذكر للأسارى» [@diwan-zuhayr، ص138]."
  - term: "فَشَرُّ مَوَاطِنِ الْحَسَبِ الْإِبَاءُ"
    text: "الإباء: «المنع». «يقول: للحسب موطن عطيّة، وموطن حِلم، فشرّ مواطنه وخصاله أن يُسأل صاحبه خيرًا، فيأبى أن يفعله، وحقًّا فيأبى أن يعطيه» [@diwan-zuhayr، ص138]."
sources:
