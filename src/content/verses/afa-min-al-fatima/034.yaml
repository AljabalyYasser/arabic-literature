first: "تَمَشَّى بَيْنَ قَتْلَى قَدْ أُصِيبَتْ"
second: "نُفُوسُهُمُ وَلَمْ تُهْرَقْ دِمَاءُ"
vocabulary:
  - term: "تَمَشَّى بَيْنَ قَتْلَى"
    text: "«أي: تمشّى الخمرُ بين سُكارى، قد صرعتهم، فكأنّهم قتلى» [@diwan-zuhayr، ص136]."
  - term: "قَدْ أُصِيبَتْ نُفُوسُهُمُ"
    text: "«أي: أذهبت الخمرُ عقولهم وقواهم. فكأنّ نفوسهم مُصابة» [@diwan-zuhayr، ص136]."
