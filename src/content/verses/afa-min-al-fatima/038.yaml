explained: false
first: "وَإِمَّا أَنْ يَقُولُوا قَدْ وَفَيْنَا"
second: "بِذِمَّتِنَا فَعَادَتُنَا الْوَفَاءُ"
vocabulary:
  - term: "وَإِمَّا أَنْ يَقُولُوا"
    text: "يعدّد ما قد يجيبون به: «يقول: إمّا أن يكونوا نساء، وإمّا أن يقولوا: نحن بُراء ممّا قذفتمونا به، وإمّا أن يقولوا: نفي بما عندنا، وإمّا أن يقولوا: نأبى ذلك ونمنعه. وهذا كلّه توعّد منه واستخفاف» [@diwan-zuhayr، ص137]."
sources:
