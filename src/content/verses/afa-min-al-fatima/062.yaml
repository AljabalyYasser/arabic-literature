first: "وَيَبْقَى بَيْنَنَا قَذَعٌ وَتُلْفَوْا"
second: "إِذًا قَوْمًا بِأَنْفُسِهِمْ أَسَاءُوا"
vocabulary:
  - term: "قَذَعٌ"
    text: "«القبيح من القول. يقال: أقذع فلانٌ لفلان، إذا قال له قولًا قبيحًا» [@diwan-zuhayr، ص146]."
  - term: "وَتُلْفَوْا ... أَسَاءُوا"
    text: "«أي: تُلفَوا مسيئين إلى أنفسكم بما تعرّضتم له من الهجاء والشّتم» [@diwan-zuhayr، ص146]."
