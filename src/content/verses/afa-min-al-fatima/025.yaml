explained: false
first: "يُغَرِّدُ بَيْنَ خُرْمٍ مُفْضِيَاتٍ"
second: "صَوَافٍ لَمْ تُكَدِّرْهَا الدِّلَاءُ"
vocabulary:
  - term: "يُغَرِّدُ"
    text: "«يرفع صوته، ويردّده نشاطًا» [@diwan-zuhayr، ص132]."
  - term: "خُرْمٍ مُفْضِيَاتٍ"
    text: "«و«الخُرْم»: غُدرانٌ قد انخرم بعضها إلى بعض، فسال هذا في هذا. و«المُفضِيات»: التي أفضى بعضها إلى بعض» [@diwan-zuhayr، ص132]."
  - term: "لَمْ تُكَدِّرْهَا الدِّلَاءُ"
    text: "«أي: ليست بآبار يُستقى منها، فتكدّرها الدِّلاء، إنما هي غُدران بقفر لا أنيس به» [@diwan-zuhayr، ص132]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص132"
    url: "https://archive.org/details/3917pdf/page/n132/mode/1up"
