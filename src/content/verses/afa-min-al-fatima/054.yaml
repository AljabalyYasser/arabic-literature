explained: false
first: "أَبَى الشُّهَدَاءُ عِنْدَكَ مِنْ مَعَدٍّ"
second: "فَلَيْسَ لِمَا تَدِبُّ لَهُ خَفَاءُ"
vocabulary:
  - term: "أَبَى الشُّهَدَاءُ"
    text: "«أي: أبى الذين حولك، من معدّ ممّن شهد الأمر، أن يُخفي على الناس، أي: هو أمر بيّن» [@diwan-zuhayr، ص143]."
  - term: "لِمَا تَدِبُّ لَهُ خَفَاءُ"
    text: "«أي: الأمر أبينُ من أن يخفى، لصحّة دلائله» [@diwan-zuhayr، ص143]. وتدِبّ: «تمشي كالحيّة، أي: تختِل وتحتال» كما يقول المحقق [@diwan-zuhayr، ص142]."
