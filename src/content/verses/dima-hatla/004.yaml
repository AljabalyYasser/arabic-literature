explained: false
first: وَتَرَى الشَّجْرَاءَ فِي رَيِّقِهَا
second: كَرُءُوسٍ قُطِعَتْ فِيهَا الْخُمُرْ
vocabulary:
- term: الشَّجْرَاءَ
  text: '«الشجر، وقيل: اسم لجماعة الشجر» [@lisan، ج4 ص395].'
- term: رَيِّقِهَا
  text: 'أول مطرها؛ «وريّق كل شيء أفضله وأوّله، تقول: ريّق الشباب وريّق المطر» [@lisan، ج10 ص136].'
- term: الْخُمُرْ
  text: جمع خِمار، وهو ما تغطي به المرأة رأسها.
