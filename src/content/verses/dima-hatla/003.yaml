explained: false
first: وَتَرَى الضَّبَّ خَفِيفًا مَاهِرًا
second: ثَانِيًا بُرْثُنَهُ مَا يَنْعَفِرْ
vocabulary:
- term: مَاهِرًا
  text: 'حاذقًا في السباحة، فالمطر «أخرج الضبّ من جحره، فعام في الماء ماهرًا في سباحته» [@lisan، ج13 ص50]. وقيل: «مسرعًا في عدوه» [@deif، ج1 ص257].'
- term: بُرْثُنَهُ
  text: البُرْثُن «مثل الإصبع» [@lisan، ج13 ص50].
- term: مَا يَنْعَفِرْ
  text: «لا يصيب براثنه التراب، وهو العَفَر» [@lisan، ج13 ص50].
