first: "دِيمَةٌ هَطْلَاءُ فِيهَا وَطَفٌ"
second: "طَبَقُ الْأَرْضِ تَحَرَّى وَتَدِرّ"
meaning: "هذا مطر دائم ساكن، غزير الهطل، سحابه دانٍ من الأرض مسترخٍ لكثرة مائه، يغطي الأرض كلها، يتعمّد مواضعها ويقيم فيها، ويصب ماءه. وهو البيت الذي أنشده ذو الرُّمَّة حين فضّل وصف امرئ القَيْس للمطر: «بل قول امرئ القَيْس أجود» [@ibn-sallam، ج1 ص94]."
vocabulary:
  - term: "دِيمَةٌ"
    text: "«المطر الدائم في سكون» [@ibn-qutayba، ج1 ص112، الحاشية]. وفي اللسان أنها من «الدوام والاقتصاد» [@lisan، ج12 ص214]."
  - term: "هَطْلَاءُ"
    text: "كثيرة الهطل، أي كثيرة المطر [@deif، ج1 ص256، الحاشية]."
  - term: "وَطَفٌ"
    text: "الوطف في السحاب: أن تسترخي جوانبه لكثرة مائه، فيدنو من الأرض [@lisan، ج9 ص358]. وقال محقق ابن قُتَيْبة: «الغزارة مع الاسترخاء» [@ibn-qutayba، ج1 ص112، الحاشية]."
  - term: "طَبَقُ الْأَرْضِ"
    text: "غطاء لها، يغشاها كلها. قال ابن مَنْظُور: «والماء طبق للأرض أي غشاء» [@lisan، ج10 ص210]."
  - term: "تَحَرَّى"
    text: "أصلها «تتحرّى»: تتعمّد المواضع. وفي اللسان: «وتحرّى فلان بالمكان أي تمكّث»، أي أقام، وأنشد البيت [@lisan، ج14 ص174]."
  - term: "تَدِرّ"
    text: "تصب ماءها، من درّت السماء بالمطر."
syntax:
  - "«ديمةٌ» خبر لمبتدأ محذوف، تقديره: هي ديمة، أو: هذه ديمة. فالقطعة تبدأ بالموصوف مباشرة، كأن المطر حاضر أمام السامع."
  - "«هطلاءُ» صفة لديمة، ممنوعة من التنوين لأنها على «فَعْلاء». و«فيها وطفٌ» جملة اسمية صفة ثانية: «فيها» خبر مقدم، و«وطفٌ» مبتدأ مؤخر."
  - "«طبقُ الأرضِ» خبر ثانٍ أو صفة ثالثة، وهو مصدر يُراد به اسم الفاعل: مُطْبِقة على الأرض. وفي رواية في اللسان «طَبَّقَ الأرضَ» فعلًا ماضيًا [@lisan، ج12 ص214]."
  - "«تَحَرَّى» فعل مضارع، و«تَدِرّ» معطوف عليه، والجملتان صفتان أخريان للديمة."
morphology:
  - "«ديمة» على «فِعْلة» من دام يدوم، وأصلها «دِوْمة»، قُلبت الواو ياء لسكونها وانكسار ما قبلها، كما في «ميزان» من الوزن."
  - "«تَحَرَّى» أصلها «تَتَحَرَّى» على «تتفعّل»، حُذفت إحدى التاءين تخفيفًا، وهو حذف جائز في المضارع المبدوء بتاءين، كقوله تعالى «تَنَزَّلُ الْمَلَائِكَةُ»."
  - "«تَدِرّ» مضارع «درّ» المضعّف، وأصلها «تَدْرِرُ»، أُدغمت الراء في الراء. ويروى «تَدُرّ» بضم الدال [@lisan، ج14 ص174]، ويقال: درّ يدِرّ ويدُرّ."
rhetoric:
  thesis: "بيت يرسم المطر في لحظة واحدة من ثلاث جهات: دوامه، وغزارته، وقربه من الأرض، ثم يمنحه إرادة: فهو «يتحرّى» مواضعه كأنه يقصدها."
  devices:
    - title: "تتابع الصفات"
      text: "خمس صفات في بيت واحد بلا حرف عطف بين أكثرها: ديمة، هطلاء، فيها وطف، طبق الأرض، تحرّى وتدرّ. فالبيت يقدم المطر كما يراه الناظر: صفة بعد صفة، حتى يغطي الأفق."
    - title: "الاستعارة في «تحرّى»"
      text: "التحرّي فعل من له قصد: أن يتوخى الشيء ويعمد إليه. فجعل للمطر قصدًا يختار به مواضعه، فصار كائنًا يعرف أين ينزل ويقيم. وهذا عند عبد القاهر الضرب الثاني من الاستعارة: أن تجعل «للشيء الشيء ليس له»، كما جعل لَبِيد للريح الشمال يدًا [@dalail، ص67]. وهذه قراءتنا للفعل، ويفسره اللسان بالتمكث في المكان، وهو قريب منها."
    - title: "حكم ذي الرُّمَّة"
      text: "قدّم ذو الرُّمَّة هذه القطعة على ما قاله عَبِيد وأوس وعبد بني الحَسْحاس في المطر [@ibn-sallam، ج1 ص92–94]. وذو الرُّمَّة نفسه عند ابن سَلّام «أحسن الإسلاميين تشبيها» [@ibn-sallam، ج1 ص55]، فحكمه حكم صاحب صنعة."
  connection: "ثم يصف ما يصنعه هذا المطر بالأرض: «تُخْرِجُ الْوَدَّ إِذَا مَا أَشْجَذَتْ»."
prosody:
  meter: "البحر الرمل"
  rhyme: "الرَّوِيّ الراء الساكنة"
  scansion: "دِيمَتُنْ هَطْ / لَاءُ فِيهَا / وَطَفُنْ = فاعلاتن / فاعلاتن / فعِلن — طَبَقُلْ أَرْ / ضِ تَحَرْرَى / وَتَدِرْ = فعلاتن / فعلاتن / فعِلن"
  note: "الرمل التام عَرُوضه محذوفة: «فاعلن» [@atiq، ص80]، ودخلها هنا الخَبْن فصارت «فعِلن»، وكذلك الضرب. والخبن حذف الثاني الساكن، وهو «الزحاف المستحسن في الرمل» [@atiq، ص79]."
context: "مطلع القطعة، وهو البيت الذي يرويه ابن قُتَيْبة وحده في خبر ذي الرُّمَّة [@ibn-qutayba، ج1 ص112]، ويرويه ابن سَلّام مع بقيتها [@ibn-sallam، ج1 ص94]. ويرى شوقي ضيف أن القطعة كلها «تلتقي في كثير من معانيها وصورها» بقسم المطر في آخر المعلقة [@deif، ج1 ص256]."
