explained: false
first: رَاحَ تَمْرِيهِ الصَّبَا ثُمَّ انْتَحَى
second: فِيهِ شُؤْبُوبُ جَنُوبٍ مُنْفَجِرْ
vocabulary:
- term: رَاحَ
  text: «عاد بالمطر في آخر النهار» [@deif، ج1 ص257].
- term: تَمْرِيهِ
  text: 'تستدرّ ماءه؛ «والريح تُنتج السحاب: تمريه حتى يخرج قطره» [@lisan، ج2 ص374].'
- term: الصَّبَا
  text: ريح تهبّ من مطلع الشمس، والجَنوب ريح تقابل الشمال.
- term: شُؤْبُوبُ
  text: «الدفعة من المطر» [@lisan، ج1 ص479].
