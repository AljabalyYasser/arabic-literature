first: "فَضَّلَهُ فَوْقَ أَقْوَامٍ وَمَجَّدَهُ"
second: "مَا لَمْ يَنَالُوا وَإِنْ جَادُوا وَإِنْ كَرُمُوا"
vocabulary:
  - term: "مَا لَمْ يَنَالُوا"
    text: "«يريد: فضّله على غيره ما لم ينالوا، من فضله، وكريم فعله، وإن كان المفضول جوادًا كريمًا» [@diwan-zuhayr، ص111]، وما لم ينالوه يفسّره البيت التالي."
