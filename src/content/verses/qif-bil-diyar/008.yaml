explained: false
first: "كَأَنَّ عَيْنِي وَقَدْ سَالَ السَّلِيلُ بِهِمْ"
second: "وَعَبْرَةٌ مَا هُمُ لَوْ أَنَّهُمْ أَمَمُ"
vocabulary:
  - term: "سَالَ السَّلِيلُ بِهِمْ"
    text: "«أي: ساروا فيه سيرًا سريعًا، لمّا انحدروا فيه. والسليل: واد بعينه» [@diwan-zuhayr، ص103]."
  - term: "وَعَبْرَةٌ مَا هُمُ"
    text: "«أي: هم عبرة لي. وحقيقته: هم سبب بكائي وفيض عبرتي. و«ما» زائدة» [@diwan-zuhayr، ص103]."
  - term: "أَمَمُ"
    text: "«القصد والقرب»: «لو كانوا قصدًا لكنت أزورهم، ولكن بعدوا» [@diwan-zuhayr، ص103]."
