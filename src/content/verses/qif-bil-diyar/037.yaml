explained: false
first: "كَالْهِنْدُوَانِيِّ لَا يُخْزِيكَ مَشْهَدُهُ"
second: "وَسْطَ السُّيُوفِ إِذَا مَا تُضْرَبُ الْبُهَمُ"
vocabulary:
  - term: "كَالْهِنْدُوَانِيِّ"
    text: "«يقول: هذا الممدوح، في مضائه وقطعه للأمور، كالسيف الهندوانيّ. وهو منسوب إلى الهند على غير قياس» [@diwan-zuhayr، ص113]."
  - term: "الْبُهَمُ"
    text: "«جمع بُهمة، وهو البطل الشجاع الذي لا يُدرى من أين يؤتى في القتال» [@diwan-zuhayr، ص113]."
sources:
