explained: false
first: "قَوْدُ الْجِيَادِ وَإِصْهَارُ الْمُلُوكِ وَصَبْـ"
second: "ـرٌ فِي مَوَاطِنَ لَوْ كَانُوا بِهَا سَئِمُوا"
vocabulary:
  - term: "قَوْدُ الْجِيَادِ"
    text: "«تبيين لقوله «ما لم ينالوا»» [@diwan-zuhayr، ص112]."
  - term: "إِصْهَارُ الْمُلُوكِ"
    text: "«أي: مصاهرة الملوك. يقال: صاهر فلانًا وأصهر إليه» [@diwan-zuhayr، ص112]."
  - term: "لَوْ كَانُوا بِهَا سَئِمُوا"
    text: "وصفه «بالصبر في مواطن الحرب وغيرها، مما يسأم فيه غيره، ولا يصبر عليه» [@diwan-zuhayr، ص112]."
