explained: false
first: "صَدَّتْ صُدُودًا عَنِ الْأَشْوَالِ وَاشْتَرَفَتْ"
second: "قُبْلًا تَقَلْقَلُ فِي أَعْنَاقِهَا الْجِذَمُ"
vocabulary:
  - term: "الْأَشْوَالِ"
    text: "«بقايا الماء في القرب والأسقية» [@diwan-zuhayr، ص108]: عرضوا عليها الماء فصدّت عنه."
  - term: "اشْتَرَفَتْ قُبْلًا"
    text: "«أي: رفعت رؤوسها وشخوصها». «و«القبل»: جمع أقبل وقبلاء. وهي التي تنظر بمآخر أعينها، لعزّة أنفسها» [@diwan-zuhayr، ص108]."
  - term: "الْجِذَمُ"
    text: "«قطع من جلود، كالسياط. يريد أنّ في أعناقها قلائد من سيور» [@diwan-zuhayr، ص108]."
