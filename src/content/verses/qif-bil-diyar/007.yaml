explained: false
first: "عَوْمَ السَّفِينِ فَلَمَّا حَالَ دُونَهُمُ"
second: "فِنْدُ الْقُرَيَّاتِ فَالْعِتْكَانُ فَالْكَرَمُ"
vocabulary:
  - term: "عَوْمَ السَّفِينِ"
    text: "«يقول: لمّا شطّوا جعلوا يسيرون في البرّ سير السفين في الماء». «وإنما قصد إلى تشبيه الإبل، وما عليها من الهوادج والمتاع، بالسفين المحمّلة» [@diwan-zuhayr، ص102]."
  - term: "فِنْدُ الْقُرَيَّاتِ"
    text: "«الفند: رأس الجبل. والقريّات: موضع. وكذلك «العتكان والكرم»» [@diwan-zuhayr، ص103]."
  - term: "فَلَمَّا حَالَ دُونَهُمُ"
    text: "«وحذف جواب «لمّا»، لأنّ في سياق كلامه ما يدلّ عليه»: لما غابوا وراء هذه المواضع رد نظره عنهم وبكى [@diwan-zuhayr، ص103]."
