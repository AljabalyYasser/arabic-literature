explained: false
first: "قَدْ أَبْدَأَتْ قُطُفًا فِي الْمَشْيِ مُنْشَزَةَ الْـ"
second: "ـأَكْتَافِ تَنْكُبُهَا الْحِزَّانُ وَالْأَكَمُ"
vocabulary:
  - term: "قُطُفًا"
    text: "«جمع قَطوف، وهو الذي ينفض يديه في سيره، ويقارب خطوه» [@diwan-zuhayr، ص107]."
  - term: "مُنْشَزَةَ الْأَكْتَافِ"
    text: "«المرتفعة الشاخصة. يعني: أنّ كواهلها مرتفعة مشرفة» [@diwan-zuhayr، ص107]."
  - term: "الْحِزَّانُ وَالْأَكَمُ"
    text: "«جمع حَزيز، وهو الغليظ من الأرض. و«الأكم»: ما ارتفع من الأرض» [@diwan-zuhayr، ص107]."
sources:
