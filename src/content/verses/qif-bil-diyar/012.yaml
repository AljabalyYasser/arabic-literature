first: "إِنَّ الْبَخِيلَ مَلُومٌ حَيْثُ كَانَ وَلَـ"
second: "ـكِنَّ الْجَوَادَ عَلَى عِلَّاتِهِ هَرِمُ"
vocabulary:
  - term: "عَلَى عِلَّاتِهِ"
    text: "«أي: على ما ينوبه، من قلّة ذات يد وعوز» [@diwan-zuhayr، ص104]. وفي الشرح المنسوب إلى ثَعْلَب: «على عسره ويسره» [@sharh-thalab-zuhayr، ص119]."
  - term: "هَرِمُ"
    text: "«اسم الممدوح» [@diwan-zuhayr، ص104]: هَرِم بن سِنان."
