explained: false
first: "وَآخَرِينَ تَرَى الْمَاذِيَّ عُدَّتَهُمْ"
second: "مِنْ نَسْجِ دَاوُدَ أَوْ مَا أَوْرَثَتْ إِرَمُ"
vocabulary:
  - term: "الْمَاذِيَّ"
    text: "«الدروع السهلة اللينة الصافية» [@diwan-zuhayr، ص109]."
  - term: "إِرَمُ"
    text: "«أمّة قديمة. ويقال: هي عاد. وإنما يريد أنها دروع قديمة متوارثة. والعرب تنسب كلّ قديم إلى عاد» [@diwan-zuhayr، ص109]."
