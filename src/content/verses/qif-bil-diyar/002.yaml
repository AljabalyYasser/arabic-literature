explained: false
first: "لَا الدَّارُ غَيَّرَهَا بَعْدِي الْأَنِيسُ وَلَا"
second: "بِالدَّارِ لَوْ كَلَّمَتْ ذَا حَاجَةٍ صَمَمُ"
vocabulary:
  - term: "الْأَنِيسُ"
    text: "الناس. «أي: لم ينزلها بعدي أنيس، فيغيّروا ما يعرف منها» [@diwan-zuhayr، ص101]. ومن روى «بُعْدُ الْأَنِيسِ»، كما في الشرح المنسوب إلى ثَعْلَب، فالمعنى: «لم يغيّرها بُعد الأنيس قطّ، ولكن الأرواح والديم» [@sharh-thalab-zuhayr، ص116]."
  - term: "صَمَمُ"
    text: "«ولا بها صمم عن تحيّتي ... ولكنها لم تكلّمني، ولا ردّت جوابي» [@diwan-zuhayr، ص101]."
