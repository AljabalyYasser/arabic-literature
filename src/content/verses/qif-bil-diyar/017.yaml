explained: false
first: "تَنْبِذُ أَفْلَاءَهَا فِي كُلِّ مَنْزِلَةٍ"
second: "تَنْتِخُ أَعْيُنَهَا الْعِقْبَانُ وَالرَّخَمُ"
vocabulary:
  - term: "أَفْلَاءَهَا"
    text: "أولادها، جمع فِلْو، وهو ولد الفرس."
  - term: "تَنْبِذُ أَفْلَاءَهَا"
    text: "«يقول: تُلقي أولادها من الجهد ودؤوب السير، فتقع عليها العقبان والرخم» [@diwan-zuhayr، ص106]."
  - term: "تَنْتِخُ"
    text: "«أي: تنزعها وتستخرجها. والمنقاش يُسمّى المنتاخ» [@diwan-zuhayr، ص106]."
sources:
