first: "يَنْزِعُ إِمَّةَ أَقْوَامٍ ذَوِي حَسَبٍ"
second: "مِمَّا تُيَسَّرُ أَحْيَانًا لَهُ الطُّعَمُ"
vocabulary:
  - term: "يَنْزِعُ إِمَّةَ أَقْوَامٍ"
    text: "«يعني: الممدوح ينزع نعم أعدائه لنفسه. ووصف أعداءه بالحسب والشرف، ليدلّ على علوّ همّته» [@diwan-zuhayr، ص112]."
  - term: "مِمَّا تُيَسَّرُ"
    text: "«أي: ربّما تيسّر» [@diwan-zuhayr، ص112]."
  - term: "الطُّعَمُ"
    text: "«الغنائم. والواحدة طُعمة. وكلّ ما يرزقه الإنسان فهو طعمة» [@diwan-zuhayr، ص112]."
sources:
