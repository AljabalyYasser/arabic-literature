explained: false
first: "تَخْطُو عَلَى رَبِذَاتٍ غَيْرِ فَائِرَةٍ"
second: "تُحْذَى وَتُعْقَدُ فِي أَرْسَاغِهَا الْخَدَمُ"
vocabulary:
  - term: "رَبِذَاتٍ"
    text: "قوائم «ربذات» «وهي: السريعة الرفع والوضع، الخفيفة» [@diwan-zuhayr، ص107]."
  - term: "فَائِرَةٍ"
    text: "«المنتشرة». «أي: ليست بمنتشرة العصب» [@diwan-zuhayr، ص107]."
  - term: "تُحْذَى ... الْخَدَمُ"
    text: "«ومعنى «تحذى»: تنعل». «و«الخدم»: السيور التي تُشدّ بها نعال الإبل، كالخلاخل». «وإنما يصف أنها تدأب في السير، حتى تحفى، فتنعل كما تنعل الإبل» [@diwan-zuhayr، ص107]."
sources:
