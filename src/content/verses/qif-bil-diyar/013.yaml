explained: false
first: "هُوَ الْجَوَادُ الَّذِي يُعْطِيكَ نَائِلَهُ"
second: "عَفْوًا وَيُظْلَمُ أَحْيَانًا فَيَظَّلِمُ"
vocabulary:
  - term: "نَائِلَهُ"
    text: "عطاءه."
  - term: "عَفْوًا"
    text: "«أي: يعطيك ما سألته سهلًا، بلا مطل، ولا تعب» [@diwan-zuhayr، ص105]."
  - term: "يُظْلَمُ أَحْيَانًا فَيَظَّلِمُ"
    text: "«أي: يُطلب منه في غير موضع الطلب، وفي غير وقته. فيحتمل ذلك، لكرمه وجوده». «وقوله «فيظّلم» أي: يحتمل الظلم». ويقال فيه «يَطَّلِم» بالطاء أيضًا، «والبيت يروى على الوجهين» [@diwan-zuhayr، ص105]."
