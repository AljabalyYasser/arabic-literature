explained: false
first: "هُمْ يَضْرِبُونَ حَبِيكَ الْبَيْضِ إِذْ لَحِقُوا"
second: "لَا يَنْكُصُونَ إِذَا مَا اسْتُلْحِمُوا وَحَمُوا"
vocabulary:
  - term: "حَبِيكَ الْبَيْضِ"
    text: "«طرائقه. والواحدة حبيكة» [@diwan-zuhayr، ص109]. والبيض: خُوَذ الحديد."
  - term: "لَا يَنْكُصُونَ"
    text: "«أي: لا يرجعون منهزمين» [@diwan-zuhayr، ص109]."
  - term: "اسْتُلْحِمُوا وَحَمُوا"
    text: "«استلحموا» «أي: أُدركوا». «ومعنى «حموا»: اشتدّ غضبهم. وأصله من حمي النار، وهو اشتداد لهبها» [@diwan-zuhayr، ص109]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص109"
    url: "https://archive.org/details/3917pdf/page/n109/mode/1up"
