first: "وَمِنْ ضَرِيبَتِهِ التَّقْوَى وَيَعْصِمُهُ"
second: "مِنْ سَيِّئِ الْعَثَرَاتِ اللَّهُ وَالرَّحِمُ"
vocabulary:
  - term: "ضَرِيبَتِهِ"
    text: "طبعه: «يقول: من خليقته، وما جُبل عليه، تقوى الله عزّ وجلّ» [@diwan-zuhayr، ص113]."
  - term: "الْعَثَرَاتِ ... وَالرَّحِمُ"
    text: "«ويعصمه من أن يقع في هلكة اللهُ، وصلةُ الرحم» [@diwan-zuhayr، ص113]."
