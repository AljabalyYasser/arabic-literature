explained: false
first: "فَاسْتَبْدَلَتْ بَعْدَنَا دَارًا يَمَانِيَةً"
second: "تَرْعَى الْخَرِيفَ فَأَدْنَى دَارِهَا ظَلِمُ"
vocabulary:
  - term: "تَرْعَى الْخَرِيفَ"
    text: "«أي: ترعى ما ينبت عن مطر الخريف» [@diwan-zuhayr، ص104]."
  - term: "ظَلِمُ"
    text: "«اسم موضع. يقول: أدنى منازلها إلينا منزلها بهذا الموضع» [@diwan-zuhayr، ص104]. وفي الشرح المنسوب إلى ثَعْلَب: «وظَلِم: جبل، وقيل: موضع، ومعدن» [@sharh-thalab-zuhayr، ص119]."
