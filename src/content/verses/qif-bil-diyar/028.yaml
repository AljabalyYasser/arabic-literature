explained: false
first: "شَدُّوا جَمِيعًا وَكَانَتْ كُلُّهَا نُهَزًا"
second: "تَحْشِكُ دِرَّاتِهَا الْأَرْسَانُ وَالْجِذَمُ"
vocabulary:
  - term: "شَدُّوا جَمِيعًا"
    text: "«أي: حملوا على النعم، مغيرين عليه» [@diwan-zuhayr، ص110]."
  - term: "نُهَزًا"
    text: "«جمع نُهزة. أي: كلّ شيء يمرّون به فهو نُهزة [لهم] يأخذونه» [@diwan-zuhayr، ص110]."
  - term: "تَحْشِكُ دِرَّاتِهَا"
    text: "«أي: تستخرجها وتستوفيها. و«الدرّات»: دفعات الجري» [@diwan-zuhayr، ص110]."
  - term: "الْأَرْسَانُ وَالْجِذَمُ"
    text: "«و«الأرسان» هنا: قطع من جلود، يُضرب بها. و«الجذم»: السياط» [@diwan-zuhayr، ص110]."
sources:
