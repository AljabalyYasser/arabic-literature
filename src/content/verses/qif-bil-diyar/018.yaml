explained: false
first: "فَهْيَ تَبَلَّغُ بِالْأَعْنَاقِ يُتْبِعُهَا"
second: "خَلْجُ الْأَجِرَّةِ فِي أَشْدَاقِهَا ضَجَمُ"
vocabulary:
  - term: "تَبَلَّغُ بِالْأَعْنَاقِ"
    text: "«أي: تمدّ أعناقها، لأنها مقرونة بالإبل مجنوبة خلفها» [@diwan-zuhayr، ص106]."
  - term: "خَلْجُ الْأَجِرَّةِ"
    text: "«و«الخلج»: الجذب» [@diwan-zuhayr، ص106]. «و«الأجرّة»: حبال من جلود، واحدها جرير» [@diwan-zuhayr، ص107]."
  - term: "ضَجَمُ"
    text: "«الميل» [@diwan-zuhayr، ص107]."
