explained: false
first: "يَقْسِمُ ثُمَّ يُسَوِّي الْقَسْمَ بَيْنَهُمُ"
second: "مُعْتَدِلُ الْحُكْمِ لَا هَارٍ وَلَا هَشِمُ"
vocabulary:
  - term: "هَارٍ"
    text: "«الهائر الضعيف. وأصله من قولهم: تهوّر الجرف وانهار، إذا تساقط» [@diwan-zuhayr، ص111]."
  - term: "هَشِمُ"
    text: "«السريع الانكسار. ضربه مثلًا للممدوح. أي: ليس بضعيف البنية والرأي» [@diwan-zuhayr، ص111]."
sources:
