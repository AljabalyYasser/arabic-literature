explained: false
first: "يَنْزِعْنَ إِمَّةَ أَقْوَامٍ لِذِي كَرَمٍ"
second: "بَحْرٍ يَفِيضُ عَلَى الْعَافِينَ إِذْ عَدِمُوا"
vocabulary:
  - term: "إِمَّةَ"
    text: "«النعمة والحالة الحسنة» [@diwan-zuhayr، ص110]."
  - term: "الْعَافِينَ"
    text: "«و«العافي»: الذي يأتيك يطلب ما عندك» [@diwan-zuhayr، ص110]."
  - term: "لِذِي كَرَمٍ بَحْرٍ"
    text: "«أي: تنزع الخيل نعم أقوام لذي كرم، وهو الممدوح». «وجعله «بحرًا» لكثرة عطائه» [@diwan-zuhayr، ص110]."
