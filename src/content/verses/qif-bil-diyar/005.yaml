explained: false
first: "فَلَا لُكَانُ إِلَى وَادِي الْغِمَارِ فَلَا"
second: "شَرْقِيُّ سَلْمَى فَلَا فَيْدٌ فَلَا رِهَمُ"
vocabulary:
  - term: "لُكَانُ ... رِهَمُ"
    text: "«لكان وفيد ورهم»: مواضع. و«سلمى»: جبل» [@diwan-zuhayr، ص102]."
  - term: "فَلَا"
    text: "«وأدخل «لا» زائدة، لتأكيد النفي الذي في قوله «غير مقوية»» [@diwan-zuhayr، ص102]: كانت هذه المواضع كلها عامرة بأهلها."
