first: "فَإِنَّهُمْ أَفْضَلُ الْأَحْيَاءِ كُلِّهِمُ"
second: "إِنْ جَدَّ بِالنَّاسِ جِدُّ الْقَوْلِ أَوْ شَمَعُوا"
vocabulary:
  - term: "شَمَعُوا"
    text: "«شمعوا: هزلوا. وأصل الشمع: الطَّرب وَاللَّهْو، وَمِنْه جَارِيَة شموع، إِذا كَانَت كَثِيرَة الطَّرب» [@ibn-hisham، ج2 ص565، الحاشية]."
