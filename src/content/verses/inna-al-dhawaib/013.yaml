first: "كَأَنَّهُمْ فِي الْوَغَى وَالْمَوْتُ مُكْتَنِعٌ"
second: "أُسْدٌ بِحَلْيَةَ فِي أَرْسَاغِهَا فَدَعُ"
vocabulary:
  - term: "مُكْتَنِعٌ … حَلْيَةَ … فَدَعُ"
    text: "«مكتنع: دَان. وَحلية: مأسدة بِالْيمن. والأرساغ: جمع رسغ، وَهُوَ مَوضِع الْقَيْد من الرجل. وفدع: اعوجاج إِلَى نَاحيَة» [@ibn-hisham، ج2 ص565، الحاشية]."
