first: "إِنْ كَانَ فِي النَّاسِ سَبَّاقُونَ بَعْدَهُمُ"
second: "فَكُلُّ سَبْقٍ لِأَدْنَى سَبْقِهِمْ تَبَعُ"
meaning: "إن كان في الناس من يسبق غيره إلى المكارم بعد هؤلاء، فكل سبق لهم تابع لأدنى سبق هؤلاء، أي أقل سبقهم يتقدم على أعظم سبق غيرهم."
vocabulary:
  - term: "سَبَّاقُونَ"
    text: "كثيرو السبق إلى الفضائل."
  - term: "تَبَعُ"
    text: "تابع، يستوي فيه الواحد والجمع."
syntax:
  - "«إِنْ كَانَ» شرط، و«سَبَّاقُونَ» اسم «كان» مؤخر، و«فِي النَّاسِ» خبرها مقدم."
  - "«فَكُلُّ سَبْقٍ … تَبَعُ» جملة اسمية في جواب الشرط، والفاء رابطة لأنها جملة اسمية."
  - "«لِأَدْنَى سَبْقِهِمْ» متعلق بـ«تَبَعُ»."
morphology:
  - "«سَبَّاق» صيغة مبالغة على «فَعَّال»."
  - "«أَدْنَى» اسم تفضيل من «دَنَا»، ومعناه هنا الأقل."
rhetoric:
  thesis: "بيت المفاضلة: لا يقول إنهم يسبقون الناس، بل يقول إن أدنى سبقهم فوق كل سبق."
  devices:
    - title: "جناس الاشتقاق"
      text: "«سَبَّاقُونَ … سَبْقٍ … سَبْقِهِمْ»: يكرر الأصل الواحد ثلاث مرات، فيصير البيت كله سباقًا."
    - title: "المبالغة بالتسليم"
      text: "يسلّم أولًا بأن في الناس سباقين، ثم يجعل سبقهم تابعًا لأقل سبق هؤلاء، فالتسليم يقوي المدح."
  connection: "ثم يصف قوتهم: ما هدموه لا يُرقع."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـعُو»"
  scansion: "إِنْ كَانَ فِي / نْنَاسِ سَبْ / بَاقُونَ بَعْ / دَهُمُو = مستفعلن / فاعلن / مستفعلن / فَعِلن — فَكُلْلُ سَبْ / قِنْ لِأَدْ / نَى سَبْقِهِمْ / تَبَعُو = متفعلن / فاعلن / مستفعلن / فَعِلن"
