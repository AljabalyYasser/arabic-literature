first: "أَهْدَى لَهُمْ مِدْحَتِي قَلْبٌ يُؤَازِرُهُ"
second: "فِيمَا أُحِبُّ لِسَانٌ حَائِكٌ صَنَعُ"
meaning: "أهدى إليهم مدحتي قلبٌ يعينه، فيما أحب، لسانٌ يحسن نسج القول ويجيده. فالمدح من القلب، واللسان صانع ماهر يعين القلب."
vocabulary:
  - term: "مِدْحَتِي"
    text: "مدحي، والمِدْحة: القصيدة في المدح."
  - term: "يُؤَازِرُهُ"
    text: "يعينه ويقوّيه."
  - term: "حَائِكٌ"
    text: "ناسج، من حياكة الثوب، استعاره لصانع الشعر."
  - term: "صَنَعُ"
    text: "«صنع: يحسن القَوْل ويجيده» [@ibn-hisham، ج2 ص565، الحاشية]. وفي اللسان: «وَرَجُلٌ صَنَعُ اللسانِ ولِسانٌ صَنَعٌ، يُقَالُ ذَلِكَ لِلشَّاعِرِ»، ويستشهد بالبيت [@lisan، ج8 ص210]."
syntax:
  - "«أَهْدَى» فعل ماض، و«مِدْحَتِي» مفعول به مقدم، و«قَلْبٌ» فاعل مؤخر."
  - "«يُؤَازِرُهُ … لِسَانٌ» جملة في محل رفع صفة لـ«قَلْبٌ»، و«لِسَانٌ» فاعل «يُؤَازِرُ»."
  - "«حَائِكٌ صَنَعُ» صفتان لـ«لِسَانٌ»."
morphology:
  - "«صَنَعٌ» صفة على «فَعَل»، بمعنى الحاذق."
  - "«يُؤَازِرُ» مضارع «آزَرَ» على «فَاعَلَ»، من الأَزْر، وهو القوة."
rhetoric:
  thesis: "الشاعر يصف آلته: قلب يصدق، ولسان يصنع."
  devices:
    - title: "الاستعارة في «حائك»"
      text: "جعل اللسان حائكًا ينسج الكلام كما يُنسج الثوب. وهذا من أقدم ما قيل في الشعر صناعة."
    - title: "تقديم المفعول"
      text: "«أَهْدَى لَهُمْ مِدْحَتِي قَلْبٌ»: قدّم المدحة وأخّر القلب، فجاء الفاعل في آخر الصدر مفاجأة: ليس هو المهدي، بل قلبه."
  connection: "ثم يختم بأنهم أفضل الأحياء في الجدّ والهزل."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـعُو»"
  scansion: "أَهْدَى لَهُمْ / مِدْحَتِي / قَلْبُنْ يُؤَا / زِرُهُو = مستفعلن / فاعلن / مستفعلن / فَعِلن — فِيمَا أُحِبْ / بُ لِسَا / نُنْ حَائِكُنْ / صَنَعُو = مستفعلن / فَعِلن / مستفعلن / فَعِلن"
variants:
  - reading: "أَهْدَى لَهُمْ مِدَحِي قَلْبٌ يُؤَازِرُهُ فِيمَا أَرَادَ لِسَانٌ حَائِكٌ صَنَعُ"
    status: "رواية أخرى"
    note: "بهذا اللفظ يرويه ابن منظور [@lisan، ج8 ص210]، وشوقي ضَيْف [@deif، ج2 ص79]."
