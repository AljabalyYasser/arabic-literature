first: "إِنَّ الذَّوَائِبَ مِنْ فِهْرٍ وَإِخْوَتِهِمْ"
second: "قَدْ بَيَّنُوا سُنَّةً لِلنَّاسِ تُتَّبَعُ"
meaning: "إن السادة من قريش، أبناء فهر، وإخوتهم قد بيّنوا للناس طريقة يتبعونها. ويريد بالسادة من قريش المهاجرين، وبإخوتهم قومه الأنصار، ويقول شوقي ضَيْف إنه قالها «مادحا للمهاجرين مدحا رائعا» [@deif، ج2 ص79]."
vocabulary:
  - term: "الذَّوَائِبَ"
    text: "«الذوائب: السَّادة. وَأَصله من ذوائب الْمَرْأَة، وَهِي غدائرها الَّتِي تعلو الرَّأْس» [@ibn-hisham، ج2 ص564، الحاشية]."
  - term: "فِهْرٍ"
    text: "فهر بن مالك، جدّ قريش، فبنو فهر هم قريش."
  - term: "سُنَّةً"
    text: "طريقة وسيرة تُتّبع."
syntax:
  - "«إِنَّ الذَّوَائِبَ» «إنّ» واسمها، و«مِنْ فِهْرٍ» متعلق بمحذوف حال، و«وَإِخْوَتِهِمْ» معطوف على «فِهْرٍ»."
  - "«قَدْ بَيَّنُوا سُنَّةً» جملة فعلية في محل رفع خبر «إنّ»."
  - "«تُتَّبَعُ» جملة في محل نصب صفة لـ«سُنَّةً»، و«لِلنَّاسِ» متعلق بـ«بَيَّنُوا»."
morphology:
  - "«الذَّوَائِبُ» جمع «ذُؤَابَة» على «فَعَائِل»، قُلبت الألف الزائدة همزة في الجمع."
  - "«تُتَّبَعُ» مضارع «اتَّبَعَ» المبني للمجهول، على «افْتَعَلَ»، قُلبت فاؤه تاء وأُدغمت في تاء الافتعال."
rhetoric:
  thesis: "مطلع بلا طلل ولا غزل: يبدأ الجواب بالمقصود، لأنه رد في مجلس على شاعر وفد تميم."
  devices:
    - title: "الاستعارة في «الذوائب»"
      text: "الذؤابة ما علا من شعر الرأس، فاستعارها للسادة لأنهم أعلى القوم."
    - title: "الجمع بين الفريقين"
      text: "«مِنْ فِهْرٍ وَإِخْوَتِهِمْ»: يجمع المهاجرين والأنصار في مطلع واحد، فلا يفخر بقومه وحدهم كما فخر الزبرقان بقومه."
  connection: "ثم يصف من يرضى بهم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـعُو»"
  scansion: "إِنْنَذْ ذَوَا / ئِبَ مِنْ / فِهْرِنْ وَإِخْ / وَتِهِمْ = مستفعلن / فَعِلن / مستفعلن / فَعِلن — قَدْ بَيْيَنُو / سُنْنَتَنْ / لِنْنَاسِ تُتْ / تَبَعُو = مستفعلن / فاعلن / مستفعلن / فَعِلن"
context: "يقول ابن إسحاق إن الزِّبْرِقان بن بدر قام فقال في الفخر بقومه، فلما فرغ قال رسول الله صلى الله عليه وسلم: «قُمْ يَا حَسَّانُ، فَأَجِبْ الرَّجُلَ فِيمَا قَالُ. فَقَامَ حَسَّانٌ، فَقَالَ» [@ibn-hisham، ج2 ص564]. ويروي أبو الفَرَج القصيدة في خبر وفد تميم بإسناد إلى محمد بن الضحّاك عن أبيه [@aghani-dk، ج4 ص146–148]."
