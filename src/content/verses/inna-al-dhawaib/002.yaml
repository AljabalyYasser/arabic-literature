first: "يَرْضَى بِهِمْ كُلُّ مَنْ كَانَتْ سَرِيرَتُهُ"
second: "تَقْوَى الْإِلٰهِ وَكُلَّ الْخَيْرِ يَصْطَنِعُ"
meaning: "يرضى بهؤلاء السادة كل من كان باطنه تقوى الله، ومن يصنع الخير كله. وفي رواية أبي زيد: يرضى بهذه السنة كل تقيّ، ويرضى بالأمر الذي شرعوه."
vocabulary:
  - term: "سَرِيرَتُهُ"
    text: "ما يُسرّه في نفسه، أي باطنه."
  - term: "يَصْطَنِعُ"
    text: "يصنع ويتخذ."
syntax:
  - "«كُلُّ» فاعل «يَرْضَى»، و«مَنْ» اسم موصول مضاف إليه."
  - "«كَانَتْ سَرِيرَتُهُ تَقْوَى الْإِلٰهِ» صلة الموصول: «سَرِيرَتُهُ» اسم «كان»، و«تَقْوَى» خبرها."
  - "«وَكُلَّ الْخَيْرِ يَصْطَنِعُ» «كُلَّ» مفعول به مقدم لـ«يَصْطَنِعُ»، والجملة معطوفة على جملة الصلة."
morphology:
  - "«يَصْطَنِعُ» مضارع «اصْطَنَعَ» على «افْتَعَلَ»، قُلبت تاء الافتعال طاء لمجاورة الصاد."
  - "«سَرِيرَة» على «فَعِيلَة» من «سَرَّ»."
rhetoric:
  thesis: "يجعل الرضا بهم علامة على صلاح الباطن."
  devices:
    - title: "تقديم المفعول"
      text: "«وَكُلَّ الْخَيْرِ يَصْطَنِعُ»: قدّم «كُلَّ الْخَيْرِ» على فعله ليقع عليه الاهتمام."
    - title: "روايتان"
      text: "رواية ابن إسحاق «يَرْضَى بِهِمْ» تمدح الرجال، ورواية أبي زيد «يَرْضَى بِهَا» تعود على «سُنَّةً» في البيت قبله، فتربط البيتين."
  connection: "ثم يصف فعلهم في الحرب والسلم."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ العين المضمومة، وبعدها واو تنشأ من إشباع الضمة: «ـعُو»"
  scansion: "يَرْضَى بِهِمْ / كُلْلُ مَنْ / كَانَتْ سَرِيـ / رَتُهُو = مستفعلن / فاعلن / مستفعلن / فَعِلن — تَقْوَلْ إِلَا / هِ وَكُلْ / لَلْخَيْرِ يَصْ / طَنِعُو = مستفعلن / فَعِلن / مستفعلن / فَعِلن"
variants:
  - reading: "يَرْضَى بِهَا كُلُّ مَنْ كَانَتْ سَرِيرَتُهُ تَقْوَى الْإِلٰهِ وَبِالْأَمْرِ الَّذِي شَرَعُوا"
    status: "رواية أبي زيد"
    note: "يقول ابن هشام: «أَنْشَدَنِي أَبُو زَيْدٍ» البيت بهذا اللفظ [@ibn-hisham، ج2 ص565]. ويقول محققو السيرة إن رواية الشطر الثاني في الديوان: «تقوى الْإِلَه وبالأمر الّذي شرعوا» [@ibn-hisham، ج2 ص564، الحاشية]. وبهذه الرواية يرويه شوقي ضَيْف [@deif، ج2 ص79]."
