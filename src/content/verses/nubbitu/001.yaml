explained: false
first: نُبِّئْتُ أَنَّ النَّارَ بَعْدَكَ أُوقِدَتْ
second: وَاسْتَبَّ بَعْدَكَ يَا كُلَيْبُ الْمَجْلِسُ
vocabulary:
- term: نُبِّئْتُ
  text: أُخبرت.
- term: النَّارَ
  text: 'نار القِرى، يوقدها الكريم ليهتدي إليها الضيف. وكان كُلَيْب «لا توقد نار مع ناره» [@iqd، ج6 ص70].'
- term: اسْتَبَّ
  text: تسابّ، أي سبّ بعضهم بعضًا.
- term: الْمَجْلِسُ
  text: 'أهل المجلس؛ «قال الأصمعى: المجلس الناس، وأنشد بيت مهلهل» [@qali، ج1 ص95].'
