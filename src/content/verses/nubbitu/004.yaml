explained: false
first: تَبْكِي عَلَيْكَ وَلَسْتُ لَائِمَ حُرَّةٍ
second: تَأْسَى عَلَيْكَ بِعَبْرَةٍ وَتَنَفَّسُ
vocabulary:
- term: حُرَّةٍ
  text: امرأة كريمة الأصل.
- term: تَأْسَى
  text: 'تحزن؛ «وأسي على مصيبته، بالكسر، يأسى أسى، مقصور، إذا حزن» [@lisan، ج14 ص35].'
- term: عَبْرَةٍ
  text: دمعة.
- term: وَتَنَفَّسُ
  text: وتتنفّس من الحزن، فحُذفت إحدى التاءين.
