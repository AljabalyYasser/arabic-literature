explained: false
first: "اللهَ فَاتَّقِهِ وَأَوْفِ بِنَذْرِهِ"
second: "وَإِذَا حَلَفْتَ مُمَارِيًا فَتَحَلَّلِ"
vocabulary:
  - term: "مُمَارِيًا"
    text: "في حاشية المحققين: «مماريا: مجادلا» [@mufaddaliyyat، ص384، الحاشية]."
  - term: "فَتَحَلَّلِ"
    text: "اخرج من يمينك. في اللسان: «تَحَلَّل فُلَانٌ مِنْ يَمِينِهِ إِذا خَرَجَ مِنْهَا بِكَفَّارَةٍ أَو حِنْث يُوجِبُ الْكَفَّارَةَ» [@lisan، ج11 ص169]."
