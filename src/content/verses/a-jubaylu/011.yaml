first: "وَإِذَا أَتَتْكَ مِنَ الْعَدُوِّ قَوَارِصٌ"
second: "فَاقْرُصْ كَذَاكَ وَلَا تَقُلْ لَمْ أَفْعَلِ"
vocabulary:
  - term: "قَوَارِصٌ ... فَاقْرُصْ"
    text: "القوارص: الكلام القبيح، كما في البيت السادس. أي إذا آذاك العدو بكلامه فردّ عليه بمثله، ولا تنكر أنك فعلت."
