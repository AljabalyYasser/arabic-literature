first: "دَارُ الْهَوَانِ لِمَنْ رَآهَا دَارَهُ"
second: "أَفَرَاحِلٌ عَنْهَا كَمَنْ لَمْ يَرْحَلِ"
vocabulary:
  - term: "دَارُ الْهَوَانِ"
    text: "في حاشية المحققين: «يقول: من أقام في دار الهوان فهي داره، وليس من لم يقم فيها وأنف كمن احتمل الضيم وأقام» [@mufaddaliyyat، ص385، الحاشية]."
