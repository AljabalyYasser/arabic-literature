explained: false
first: "أَجُبَيْلُ إِنَّ أَبَاكَ كَارَبَ يَوْمُهُ"
second: "فَإِذَا دُعِيتَ إِلَى الْعَظَائِمِ فَاعْجَلِ"
vocabulary:
  - term: "أَجُبَيْلُ"
    text: "في حاشية المحققين: «جبيل: ابنه» [@mufaddaliyyat، ص384، الحاشية]. والهمزة للنداء."
  - term: "كَارَبَ يَوْمُهُ"
    text: "في حاشية المحققين: «كارب: قرب ودنا. أو «كارب يومه»، بوزن اسم الفاعل، أي قريب» [@mufaddaliyyat، ص384، الحاشية]. ويومه: يوم موته."
  - term: "الْعَظَائِمِ"
    text: "الأمور الجسام."
