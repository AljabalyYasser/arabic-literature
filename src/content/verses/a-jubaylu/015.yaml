explained: false
first: "وَاسْتَأْنِ حِلْمَكَ فِي أُمُورِكَ كُلِّهَا"
second: "وَإِذَا عَزَمْتَ عَلَى الْهَوَى فَتَوَكَّلِ"
vocabulary:
  - term: "وَاسْتَأْنِ"
    text: "في حاشية المحققين: «استأن: من الأناة» [@mufaddaliyyat، ص385، الحاشية]. أي تمهّل ولا تتعجّل الغضب."
  - term: "عَزَمْتَ عَلَى الْهَوَى"
    text: "قطعت أمرك على ما تريد وتهوى."
  - term: "فَتَوَكَّلِ"
    text: "اعتمد على الله وامضِ."
