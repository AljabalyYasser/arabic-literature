explained: false
first: "وَإِذَا لَقِيتَ الْبَاهِشِينَ إِلَى النَّدَى"
second: "غُبْرًا أَكُفُّهُمُ بِقَاعٍ مُمْحِلِ"
vocabulary:
  - term: "الْبَاهِشِينَ إِلَى النَّدَى"
    text: "في حاشية المحققين: «الباهش: الفرح. يريد الذين يأتونه يلتمسون جداه ونائله» [@mufaddaliyyat، ص385، الحاشية]. والندى: العطاء."
  - term: "غُبْرًا أَكُفُّهُمُ"
    text: "فقراء لا شيء في أيديهم."
  - term: "بِقَاعٍ مُمْحِلِ"
    text: "بأرض مجدبة لا نبات فيها."
