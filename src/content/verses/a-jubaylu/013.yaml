first: "وَإِذَا لَقِيتَ الْقَوْمَ فَاضْرِبْ فِيهِمُ"
second: "حَتَّى يَرَوْكَ طِلَاءَ أَجْرَبَ مُهْمَلِ"
vocabulary:
  - term: "طِلَاءَ أَجْرَبَ"
    text: "في حاشية المحققين: «يريد: حتى يتقوك ويتحاموك كما يتحامون الأجرب وطلاءه» [@mufaddaliyyat، ص385، الحاشية]. والطلاء: القطران يُطلى به البعير الأجرب."
  - term: "مُهْمَلِ"
    text: "متروك لا يُقرَب."
