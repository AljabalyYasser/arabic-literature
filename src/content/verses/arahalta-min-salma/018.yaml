explained: false
first: "وَإِذَا تَهِيجُ الرِّيحُ مِنْ صُرَّادِهَا"
second: "ثَلْجًا يُنِيخُ النِّيبَ بِالْجَعْجَاعِ"
vocabulary:
  - term: "صُرَّادِهَا"
    text: "«والصُّرَّاد: غيم رقيق لا ماء فيه» [@lisan، ج12 ص338]، وهو بارد."
  - term: "النِّيبَ"
    text: "مسانّ إناث الإبل، واحدها ناب [@mufaddaliyyat، ص62، الحاشية]."
  - term: "بِالْجَعْجَاعِ"
    text: "الجعجاع موضع البروك. يريد أن الإبل لا تبرح مباركها من شدة البرد، وخصّ النيب لأنها أصبر من الفتيّة على البرد [@mufaddaliyyat، ص62، الحاشية]."
