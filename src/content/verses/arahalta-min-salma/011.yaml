explained: false
first: "وَكَأَنَّ غَارِبَهَا رُبَاوَةُ مَخْرِمٍ"
second: "وَتَمُدُّ ثِنْيَ جَدِيلِهَا بِشِرَاعِ"
vocabulary:
  - term: "غَارِبَهَا"
    text: "ما بين السنام والعنق [@mufaddaliyyat، ص62، الحاشية]."
  - term: "رُبَاوَةُ مَخْرِمٍ"
    text: "الرَّباوة، بتثليث الراء، الرَّبوة المرتفعة، والمخرم منقطع الغلظ من الجبل حيث استرقّ [@mufaddaliyyat، ص62، الحاشية]."
  - term: "ثِنْيَ جَدِيلِهَا"
    text: "الجديل الزمام، وثِنْيه ما انثنى منه باليد [@mufaddaliyyat، ص62، الحاشية]."
  - term: "بِشِرَاعِ"
    text: "أراد عنقًا طويلة، فشبّهها بشراع السفينة، وأراد به الدَّقَل، وهو الذي يسمّيه البحّارة الصاري، والعرب تفعل ذلك تجوّزًا، كما في حاشية المحققين [@mufaddaliyyat، ص62، الحاشية]."
