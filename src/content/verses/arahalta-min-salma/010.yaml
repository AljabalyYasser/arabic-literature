first: "وَإِذَا تَعَاوَرَتِ الْحَصَى أَخْفَافُهَا"
second: "دَوَّى نَوَادِيهِ بِظَهْرِ الْقَاعِ"
vocabulary:
  - term: "تَعَاوَرَتِ"
    text: "تبادلت أو تناوبت، أي تقاذفت أخفافها الحصى [@mufaddaliyyat، ص62، الحاشية]."
  - term: "دَوَّى"
    text: "صوّت [@mufaddaliyyat، ص62، الحاشية]."
  - term: "نَوَادِيهِ"
    text: "ما أسرع من الحصى وتقدّم [@mufaddaliyyat، ص62، الحاشية]."
  - term: "الْقَاعِ"
    text: "ما استوى من الأرض [@mufaddaliyyat، ص62، الحاشية]."
