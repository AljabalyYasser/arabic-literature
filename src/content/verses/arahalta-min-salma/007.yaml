explained: false
first: "فَتَسَلَّ حَاجَتَهَا إِذَا هِيَ أَعْرَضَتْ"
second: "بِخَمِيصَةٍ سُرُحِ الْيَدَيْنِ وَسَاعِ"
vocabulary:
  - term: "فَتَسَلَّ حَاجَتَهَا"
    text: "اسْلُ عنها وعن ذكرها إذا هي أعرضت [@mufaddaliyyat، ص61، الحاشية]."
  - term: "بِخَمِيصَةٍ"
    text: "بناقة ضامرة البطن [@mufaddaliyyat، ص61، الحاشية]."
  - term: "سُرُحِ الْيَدَيْنِ"
    text: "منسرحة الضَّبْعين في المشي، أي سهلة حركة اليدين [@mufaddaliyyat، ص61، الحاشية]."
  - term: "وَسَاعِ"
    text: "واسعة الخطو في سيرها [@mufaddaliyyat، ص61، الحاشية]."
