explained: false
first: "صَكَّاءَ ذِعْلِبَةٍ إِذَا اسْتَدْبَرْتَهَا"
second: "حَرَجٍ إِذَا اسْتَقْبَلْتَهَا هِلْوَاعِ"
vocabulary:
  - term: "صَكَّاءَ"
    text: "أصلها صفة للنعامة، لتقارب ركبتيها يصكّ بعضها بعضًا، فشبّه بها ناقته [@mufaddaliyyat، ص61، الحاشية]."
  - term: "ذِعْلِبَةٍ"
    text: "سريعة [@mufaddaliyyat، ص61، الحاشية]."
  - term: "حَرَجٍ"
    text: "جسيمة طويلة على وجه الأرض [@mufaddaliyyat، ص61، الحاشية]."
  - term: "هِلْوَاعِ"
    text: "مستخفّة كأنها تفزع من النشاط، والهلع الخفّة [@mufaddaliyyat، ص61، الحاشية]."
