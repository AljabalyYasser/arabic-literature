explained: false
first: "أَنْتَ الْوَفِيُّ فَمَا تُذَمُّ وَبَعْضُهُمْ"
second: "تُودِي بِذِمَّتِهِ عُقَابُ مَلَاعِ"
vocabulary:
  - term: "تُذَمُّ"
    text: "تُعاب، من الذمّ."
  - term: "تُودِي بِذِمَّتِهِ"
    text: "تذهب بعهده لجاره."
  - term: "عُقَابُ مَلَاعِ"
    text: "ملاعِ، كقطامِ، اسم مكان تُنسب إليه العقبان. والمعنى في حاشية المحققين: أنت تفي بذمتك ولا يُطمع في جارك، وغيرك يُهدر جواره كأنما ذهبت به عقاب [@mufaddaliyyat، ص63، الحاشية]."
