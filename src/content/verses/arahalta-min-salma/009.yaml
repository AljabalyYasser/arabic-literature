explained: false
first: "وَكَأَنَّ قَنْطَرَةً بِمَوْضِعِ كُورِهَا"
second: "مَلْسَاءَ بَيْنَ غَوَامِضِ الْأَنْسَاعِ"
vocabulary:
  - term: "كُورِهَا"
    text: "الكُور الرَّحل بخشبه وأداته [@mufaddaliyyat، ص61، الحاشية]."
  - term: "قَنْطَرَةً"
    text: "شبّه جنبيها في انتفاخهما بالقنطرة [@mufaddaliyyat، ص61، الحاشية]."
  - term: "الْأَنْسَاعِ"
    text: "جمع نِسْع، وهو السير يُشدّ به الرحل [@mufaddaliyyat، ص61، الحاشية]."
  - term: "غَوَامِضِ"
    text: "الغموض دخول الأنساع في الجلد. والإبل تسترخي جلودها فتغيب فيها الأنساع، وهذه ناقة لا تغمض الأنساع في ظهرها ولا سنامها، فهي ملساء الظهر [@mufaddaliyyat، ص61، الحاشية]."
