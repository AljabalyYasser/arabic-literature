first: "أَحْلَلْتَ بَيْتَكَ بِالْجَمِيعِ وَبَعْضُهُمْ"
second: "مُتَفَرِّقٌ لِيَحُلَّ بِالْأَوْزَاعِ"
vocabulary:
  - term: "بِالْجَمِيعِ"
    text: "بمجتمع الناس. يقول في حاشية المحققين: إذا نزلت شدة الزمان نزلتَ في مجمع الناس، حيث يأتيك السُّؤّال والضيفان [@mufaddaliyyat، ص63، الحاشية]."
  - term: "بِالْأَوْزَاعِ"
    text: "المتفرّقين، أي ينزل غيرك بعيدًا عن الناس لئلا يقصده أحد [@mufaddaliyyat، ص63، الحاشية]."
