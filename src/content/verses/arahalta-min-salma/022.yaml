first: "وَلَأَنْتَ أَشْجَعُ فِي الْأَعَادِي كُلِّهَا"
second: "مِنْ مُخْدِرٍ لَيْثٍ مُعِيدِ وِقَاعِ"
vocabulary:
  - term: "مُخْدِرٍ"
    text: "الأسد الذي اتخذ الأجمة خِدرًا، أي عرينًا، أراد: من ليث مخدر، فقدّم النعت [@mufaddaliyyat، ص63، الحاشية]."
  - term: "مُعِيدِ وِقَاعِ"
    text: "المعيد الذي يفعل الشيء مرة بعد مرة، والوقاع جمع وقعة، كوقعة الحرب، أي هو كثير الافتراس [@mufaddaliyyat، ص63، الحاشية]."
