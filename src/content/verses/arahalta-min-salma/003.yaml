explained: false
first: "إِذْ تَسْتَبِيكَ بِأَصْلَتِيٍّ نَاعِمٍ"
second: "قَامَتْ لِتَفْتِنَهُ بِغَيْرِ قِنَاعِ"
vocabulary:
  - term: "تَسْتَبِيكَ"
    text: "تأسرك فتجعلك كالسبي لها، من السبي [@mufaddaliyyat، ص61، الحاشية]."
  - term: "بِأَصْلَتِيٍّ"
    text: "بخدّ ناعم حسن [@mufaddaliyyat، ص61، الحاشية]."
  - term: "قِنَاعِ"
    text: "ما تغطي به المرأة رأسها، أي كشفت وجهها لتفتنه."
