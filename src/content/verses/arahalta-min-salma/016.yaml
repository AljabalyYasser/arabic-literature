explained: false
first: "تَرِدُ الْمِيَاهَ فَمَا تَزَالُ غَرِيبَةً"
second: "فِي الْقَوْمِ بَيْنَ تَمَثُّلٍ وَسَمَاعِ"
vocabulary:
  - term: "تَرِدُ الْمِيَاهَ"
    text: "تنزل على المياه مع الركبان، حيث يجتمع الناس."
  - term: "غَرِيبَةً"
    text: "لا تزال تأتي قومًا على مياههم وليست من قول شعرائهم، فهي غريبة لذلك [@mufaddaliyyat، ص62، الحاشية]."
  - term: "تَمَثُّلٍ وَسَمَاعِ"
    text: "ينشدها الناس متمثّلين بها، ويسمعونها."
