explained: false
first: "أَوْ صَوْبُ غَادِيَةٍ أَدَرَّتْهُ الصَّبَا"
second: "بِبَزِيلِ أَزْهَرَ مُدْمَجٍ بِسَيَاعِ"
vocabulary:
  - term: "صَوْبُ غَادِيَةٍ"
    text: "ماء سحابة تنشأ غدوة، وهو مرفوع عطفًا على «عانيّة»، أي كأن ريقها خمر أو ماء مطر [@mufaddaliyyat، ص61، الحاشية]."
  - term: "أَدَرَّتْهُ الصَّبَا"
    text: "استخرجت ماءه ريح الصَّبا، وخصّها لأنها لينة تأتي بسهولة، فهو أصفى لمائها [@mufaddaliyyat، ص61، الحاشية]."
  - term: "بِبَزِيلِ أَزْهَرَ"
    text: "البزيل ما بُزل، أي ثُقب إناؤه فخرج منه، والأزهر الأبيض، أراد دنًّا أبيض، ونقل المحققان عن الأصمعي أنه ربما قيل للإبريق أزهر [@mufaddaliyyat، ص61، الحاشية]."
  - term: "مُدْمَجٍ بِسَيَاعِ"
    text: "مطليّ بالسياع، وهو الطين، وكل ما لطخته على شيء فقد أدمجته [@mufaddaliyyat، ص61، الحاشية]."
