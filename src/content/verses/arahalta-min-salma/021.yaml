explained: false
first: "وَكَأَنَّ بُلْقَ الْخَيْلِ فِي حَافَاتِهِ"
second: "يَرْمِي بِهِنَّ دَوَالِيَ الزُّرَّاعِ"
vocabulary:
  - term: "بُلْقَ الْخَيْلِ"
    text: "الخيل التي في ألوانها سواد وبياض. شبّه أمواج الخليج بها، لأن الموجة إذا ارتفعت كان ظهرها أبيض، فإذا انقلبت اسودّ بطنها [@mufaddaliyyat، ص63، الحاشية]."
  - term: "دَوَالِيَ الزُّرَّاعِ"
    text: "الدوالي جمع دالية، وهي آلة للسقي، أي يرمي الخليج بموجه دوالي الزرّاع [@mufaddaliyyat، ص63، الحاشية]."
