explained: false
first: "وَإِذَا أَطَفْتَ بِهَا أَطَفْتَ بِكَلْكَلٍ"
second: "نَبِضِ الْفَرَائِصِ مُجْفَرِ الْأَضْلَاعِ"
vocabulary:
  - term: "أَطَفْتَ بِهَا"
    text: "درت حولها تتأمّلها [@mufaddaliyyat، ص62، الحاشية]."
  - term: "بِكَلْكَلٍ"
    text: "بصدر [@mufaddaliyyat، ص62، الحاشية]."
  - term: "نَبِضِ الْفَرَائِصِ"
    text: "الفرائص جمع فريصة، وهي لحمة في مرجع الكتف، ونبضها شدة حركتها، وصف الناقة بذلك لشدة فؤادها وحدّتها [@mufaddaliyyat، ص62، الحاشية]."
  - term: "مُجْفَرِ الْأَضْلَاعِ"
    text: "واسعها، كالجَفْر، وهو البئر العظيمة [@mufaddaliyyat، ص62، الحاشية]."
