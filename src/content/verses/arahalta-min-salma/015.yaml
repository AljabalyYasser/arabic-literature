explained: false
first: "فَلَأُهْدِيَنَّ مَعَ الرِّيَاحِ قَصِيدَةً"
second: "مِنِّي مُغَلْغَلَةً إِلَى الْقَعْقَاعِ"
vocabulary:
  - term: "مَعَ الرِّيَاحِ"
    text: "تذهب كل مذهب [@mufaddaliyyat، ص62، الحاشية]."
  - term: "مُغَلْغَلَةً"
    text: "يتغلغل بها الناس لحسنها، ويسلكون بها كل غامض [@mufaddaliyyat، ص62، الحاشية]، أي تبلغ البعيد."
  - term: "الْقَعْقَاعِ"
    text: "القعقاع بن مَعْبَد بن زُرارة التميمي، الممدوح."
