explained: false
first: "مِنْ غَيْرِ مَقْلِيَةٍ وَإِنَّ حِبَالَهَا"
second: "لَيْسَتْ بِأَرْمَامٍ وَلَا أَقْطَاعِ"
vocabulary:
  - term: "مَقْلِيَةٍ"
    text: "بُغض، أي رحلت عنها لا عن بغض لها [@mufaddaliyyat، ص61، الحاشية]."
  - term: "حِبَالَهَا"
    text: "ما بينكما من مودة، وفي حاشية المحققين: ما احتبلته من مودة [@mufaddaliyyat، ص61، الحاشية]."
  - term: "بِأَرْمَامٍ وَلَا أَقْطَاعِ"
    text: "يقال حبل أرمام وحبل أقطاع إذا كان قطعًا موصولة [@mufaddaliyyat، ص61، الحاشية]، أي بالية متقطعة. يريد أن مودتها له ما زالت متينة."
