explained: false
first: حَسِبْتَ أَبَا قَابُوسَ أَنَّكَ سَالِمٌ
second: وَلَمَّا تُصِبْ ذُلًّا وَأَنْفُكَ رَاغِمُ
vocabulary:
- term: أَبَا قَابُوسَ
  text: «كنية النعمان» [@mufaddaliyyat، ص312، الحاشية]. وزعم الأَصْمَعِيّ أن هذا البيت ليس من القصيدة، وأن الغلام المقتول عمّ النعمان لا ابنه [@mufaddaliyyat، ص311، الحاشية].
- term: وَلَمَّا تُصِبْ ذُلًّا
  text: ولم تلقَ ذُلًّا بعدُ.
- term: رَاغِمُ
  text: ذليل، كأن أنفه أُلصق بالرَّغام وهو التراب.
