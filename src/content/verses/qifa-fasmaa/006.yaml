explained: false
first: فَتَكْتُ بِهِ كَمَا فَتَكْتُ بِخَالِدٍ
second: وَكَانَ سِلَاحِي تَجْتَوِيهِ الْجَمَاجِمُ
vocabulary:
- term: فَتَكْتُ
  text: قتلته غِيلةً على غِرّة.
- term: خَالِدٍ
  text: خالد بن جعفر بن كلاب العامري [@mufaddaliyyat، ص312، الحاشية]، قتله الحارِث وهو في جوار الملك.
- term: تَجْتَوِيهِ
  text: «لا يوافقها» [@mufaddaliyyat، ص312، الحاشية]؛ من «اجتويت البلد إذا كرهت المقام فيه» [@lisan، ج14 ص158].
- term: الْجَمَاجِمُ
  text: عظام الرؤوس.
