explained: false
first: فَإِنْ تَكُ أَذْوَادٌ أُصِبْنَ وَصِبْيَةٌ
second: فَهَذَا ابْنُ سَلْمَى رَأْسُهُ مُتَفَاقِمُ
vocabulary:
- term: أَذْوَادٌ
  text: 'جمع ذَوْد، وهو «للقطيع من الإبل الثلاث إلى التسع، وقيل: ما بين الثلاث إلى العشر» [@lisan، ج3 ص168]. يريد إبل جارة له أُغير عليها [@mufaddaliyyat، ص312، الحاشية].'
- term: ابْنُ سَلْمَى
  text: ابن الملك؛ «كان في حجر سنان بن أبي حارثة، وسلمى امرأة سنان، وهي أخت الحرث بن ظالم» [@mufaddaliyyat، ص312، الحاشية]. وفي «العقد» أن سلمى امرأة سنان «من بني غنم بن دودان بن أسد» [@iqd، ج6 ص15].
- term: مُتَفَاقِمُ
  text: «غير ملتئم، يشير إلى أنه قتله» [@mufaddaliyyat، ص312، الحاشية]؛ من قولهم «فقم الشيء اتسع» [@lisan، ج12 ص457].
