first: قِفَا فَاسْمَعَا أُخْبِرْكُمَا إِذْ سَأَلْتُمَا
second: مُحَارِبُ مَوْلَاهُ وَثَكْلَانُ نَادِمُ
vocabulary:
- term: مُحَارِبُ مَوْلَاهُ
  text: 'يعني نفسه؛ قال أبو الفرج: «يعني الحارِث نفسه. ومولاه: سنان» [@aghani-dk، ج11 ص108]، وهو سِنان بن أبي حارثة المُرّيّ، وكان ابن الملك في حجره.'
- term: ثَكْلَانُ نَادِمُ
  text: 'الملك الذي قُتل ابنه؛ قال المحققان: «يعني الملك النعمان بن المنذر» [@mufaddaliyyat، ص312، الحاشية]، وفي «الأغاني»: «يعني الأسود لأنه قتل ابنه شرحبيل» [@aghani-dk، ج11 ص108].'
