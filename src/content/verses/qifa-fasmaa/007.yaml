explained: false
first: أَخُصْيَيْ حِمَارٍ بَاتَ يَكْدِمُ نَجْمَةً
second: أَتَأْكُلُ جِيرَانِي وَجَارُكَ سَالِمُ
vocabulary:
- term: أَخُصْيَيْ حِمَارٍ
  text: '«أراد: يا خصيي حمار؛ يخاطب النعمان، يصغّره بذلك» [@mufaddaliyyat، ص313، الحاشية].'
- term: يَكْدِمُ
  text: يعضّ بمقدَّم فمه.
- term: نَجْمَةً
  text: 'واحدة النَّجْم، وهو من النبات ما لا ساق له؛ وقيل: هي الثَّيِّلة، «وهي شجرة خضراء» تمتد على وجه الأرض [@lisan، ج12 ص568].'
