explained: false
first: بَدَأْتُ بِهَذِي ثُمَّ أَثْنِي بِهَذِهِ
second: وَثَالِثَةٌ تَبْيَضُّ مِنْهَا الْمَقَادِمُ
vocabulary:
- term: أَثْنِي
  text: أُتبعها بثانية.
- term: وَثَالِثَةٌ
  text: 'قال المحققان: «يريد بالأولى قتل خالد بن جعفر، وبالثانية قتل ابن النعمان، وبالثالثة قتل النعمان، يتوعده» [@mufaddaliyyat، ص313، الحاشية].'
- term: الْمَقَادِمُ
  text: مقاديم الوجه، «ما استقبلت منه كالناصية»، يعني شيب الناصية من هول الضربة [@mufaddaliyyat، ص313، الحاشية].
