explained: false
first: عَلَوْتُ بِذِي الْحَيَّاتِ مَفْرِقَ رَأْسِهِ
second: وَهَلْ يَرْكَبُ الْمَكْرُوهَ إِلَّا الْأَكَارِمُ
vocabulary:
- term: ذِي الْحَيَّاتِ
  text: سيفه؛ يقال للسيف إذا كان فيه صورة حية «ذو الحيات»، «وكان في سيف الحرث صورة حيتين» [@mufaddaliyyat، ص312، الحاشية].
- term: مَفْرِقَ رَأْسِهِ
  text: وسط الرأس حيث يُفرَق الشعر.
- term: يَرْكَبُ الْمَكْرُوهَ
  text: يُقدم على الأمر الشاق الذي يكرهه الناس.
