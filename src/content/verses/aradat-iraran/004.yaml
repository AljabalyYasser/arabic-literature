explained: false
first: "وَإِلَّا فَسِيرِي مِثْلَ مَا سَارَ رَاكِبٌ"
second: "تَجَشَّمَ خِمْسًا لَيْسَ فِي سَيْرِهِ أَمَمْ"
vocabulary:
  - term: "تَجَشَّمَ"
    text: "تكلّف على مشقة."
  - term: "خِمْسًا"
    text: "«من أظماء الإبل، وهو أن ترد الإبل الماء اليوم الخامس» [@ibn-qutayba، ج1 ص415، الحاشية]."
  - term: "أَمَمْ"
    text: "«القرب والقصد» [@ibn-qutayba، ج1 ص415، الحاشية]؛ أي فارقيني فراقًا بعيدًا شاقًّا."
