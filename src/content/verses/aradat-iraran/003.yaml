first: "وَإِنْ كُنْتِ تَهْوَيْنَ الْفِرَاقَ ظَعِينَتِي"
second: "فَكُونِي لَهُ كَالذِّئْبِ ضَاعَتْ لَهُ الْغَنَمْ"
vocabulary:
  - term: "ظَعِينَتِي"
    text: "امرأتي."
  - term: "كَالذِّئْبِ ضَاعَتْ لَهُ الْغَنَمْ"
    text: "أي أسيئي إليه كما يفتك الذئب بغنم لا راعي لها، فيكون ذلك سبب الفراق."
