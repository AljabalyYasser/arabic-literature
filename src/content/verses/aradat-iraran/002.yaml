first: "فَإِنْ كُنْتِ مِنِّي أَوْ تُرِيدِينَ صُحْبَتِي"
second: "فَكُونِي لَهُ كَالسَّمْنِ رُبَّتْ لَهُ الْأَدَمْ"
vocabulary:
  - term: "كَالسَّمْنِ رُبَّتْ لَهُ الْأَدَمْ"
    text: "الأَدَم: جمع أديم، وهو الجلد يُتخذ وعاء. ينقل محقق ابن قُتَيْبة عن اللسان: «كونى لولدى عرارا كسمن رب أديمه، أى طلى برب التمر، لأن النحى إذا أصلح بالرب طابت رائحته ومنع السمن من أن يفسد طعمه أو ريحه» [@ibn-qutayba، ج1 ص415، الحاشية]."
