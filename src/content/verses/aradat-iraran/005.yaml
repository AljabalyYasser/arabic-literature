explained: false
first: "وَإِنَّ عِرَارًا إِنْ يَكُنْ ذَا شَكِيمَةٍ"
second: "تُقَاسِينَهَا مِنْهُ فَمَا أَمْلِكُ الشِّيَمْ"
vocabulary:
  - term: "شَكِيمَةٍ"
    text: "«شدة النفس والأنفة والإباء، وأصله من شكيمة اللجام» [@ibn-qutayba، ج1 ص415، الحاشية]."
  - term: "الشِّيَمْ"
    text: "الطباع، جمع شِيمة؛ أي لا أقدر على تغيير طبعه."
