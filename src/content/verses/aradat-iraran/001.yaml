first: "أَرَادَتْ عِرَارًا بِالْهَوَانِ وَمَنْ يُرِدْ"
second: "عِرَارًا لَعَمْرِي بِالْهَوَانِ فَقَدْ ظَلَمْ"
vocabulary:
  - term: "عِرَارًا"
    text: "ابنه عِرار، بكسر العين، كما يضبطه محقق ابن قُتَيْبة [@ibn-qutayba، ج1 ص415، الحاشية]."
  - term: "بِالْهَوَانِ"
    text: "بالإذلال والإهانة."
