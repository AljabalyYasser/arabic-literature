explained: false
first: "أَعَاذِلُ مَنْ لَا يُصْلِحِ النَّفْسَ خَالِيًا"
second: "عَنِ الْحَيِّ لَا يَرْشُدْ لِقَوْلِ الْمُفَنِّدِ"
vocabulary:
  - term: "خَالِيًا عَنِ الْحَيِّ"
    text: "منفردًا بعيدًا عن أعين الناس."
  - term: "الْمُفَنِّدِ"
    text: "اللائم الذي ينسب صاحبه إلى ضعف الرأي."
