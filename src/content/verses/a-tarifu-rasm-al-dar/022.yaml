explained: false
first: "إِذَا أَنْتَ فَاكَهْتَ الرِّجَالَ فَلَا تَلَعْ"
second: "وَقُلْ مِثْلَ مَا قَالُوا وَلَا تَتَزَيَّدِ"
vocabulary:
  - term: "فَاكَهْتَ"
    text: "مازحت وحادثت."
  - term: "فَلَا تَلَعْ"
    text: "فلا تخفّ ولا تُكثر من المزاح، قال صاحب اللسان: «وَقَالَ اللِّحْيَانِيُّ: وَلَعَ يَلَعُ أَي اسْتخَفَّ» [@lisan، ج8 ص410]."
  - term: "لَا تَتَزَيَّدِ"
    text: "لا تزد على ما قالوا."
