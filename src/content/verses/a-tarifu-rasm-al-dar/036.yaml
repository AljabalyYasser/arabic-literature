first: "إِذَا مَا تَكَرَّهْتَ الْخَلِيقَةَ لِامْرِئٍ"
second: "فَلَا تَغْشَهَا وَاخْلُدْ سِوَاهَا بِمَخْلَدِ"
vocabulary:
  - term: "الْخَلِيقَةَ"
    text: "الخُلُق والطبع."
  - term: "لَا تَغْشَهَا"
    text: "لا تأتِها."
  - term: "اخْلُدْ سِوَاهَا بِمَخْلَدِ"
    text: "الزم خلقًا غيرها، من «خلد بالمكان» إذا أقام به."
