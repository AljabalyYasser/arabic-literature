first: "فَيَا لَكَ مِنْ شَوْقٍ وَطَائِفِ عَبْرَةٍ"
second: "كَسَتْ جَيْبَ سِرْبَالِي إِلَى غَيْرِ مُسْعِدِ"
vocabulary:
  - term: "طَائِفِ عَبْرَةٍ"
    text: "ما يطوف بالعين ويغشاها من الدمع."
  - term: "جَيْبَ سِرْبَالِي"
    text: "فتحة قميصي عند العنق."
  - term: "مُسْعِدِ"
    text: "من يُسعدك فيبكي معك."
