first: "أَتَعْرِفُ رَسْمَ الدَّارِ مِنْ أُمِّ مَعْبَدِ"
second: "نَعَمْ وَرَمَاكَ الشَّوْقُ قَبْلَ التَّجَلُّدِ"
meaning: "أتعرف آثار دار أم مَعْبَد؟ نعم عرفتها، وما كدت أعرفها حتى أصابك الشوق كما يصيب السهم، قبل أن تتمكن من الصبر وتتماسك."
vocabulary:
  - term: "رَسْمَ الدَّارِ"
    text: "ما بقي من آثارها لاصقًا بالأرض بعد رحيل أهلها، و«رَسْمُ الدَّارِ: مَا كَانَ مِنْ آثَارِهَا لَاصِقًا بالأَرض» [@lisan، ج12 ص241]."
  - term: "أُمِّ مَعْبَدِ"
    text: "امرأة يذكرها الشاعر، ولا نعرف عنها شيئًا."
  - term: "التَّجَلُّدِ"
    text: "تكلّف الجَلَد، وهو الصبر والقوة على الشدة، و«التَّجَلُّد: تَكَلُّفُ الجَلادة» [@lisan، ج3 ص126]."
context: "مطلع القصيدة، وبه يذكرها ابن سَلّام وابن قُتَيْبة بين غرر عَدِيّ [@ibn-sallam، ج1 ص141] [@ibn-qutayba، ج1 ص220]. وهو مطلع تقليدي على عادة القصيدة الجاهلية: وقوف على دار امرأة، لكنه لا يطول، فبعد بيتين في البكاء تأتي العاذلة، ثم ينتقل الشاعر إلى ما يريده حقًّا: الموت والحكمة."
syntax:
  - "«أَتَعْرِفُ» الهمزة للاستفهام، و«تعرف» مضارع مرفوع، والفاعل ضمير المخاطب، و«رَسْمَ» مفعول به، و«الدَّارِ» مضاف إليه."
  - "«مِنْ أُمِّ مَعْبَدِ» جار ومجرور متعلق بمحذوف حال من «الدار»، أي: الدارِ الكائنةِ من أم معبد، و«معبد» مضاف إليه."
  - "«نَعَمْ» حرف جواب، و«وَرَمَاكَ الشَّوْقُ» الواو عاطفة، و«رمى» فعل ماض، والكاف مفعول به مقدم، و«الشوقُ» فاعل، و«قَبْلَ» ظرف زمان متعلق بـ«رمى»، و«التجلّد» مضاف إليه."
morphology:
  - "«التَّجَلُّد» مصدر «تَجَلَّدَ» على «تَفَعُّل»، وهو بناء التكلّف: أن يُظهر المرء جلدًا ليس فيه."
  - "«رَمَاكَ» من «رَمَى يَرْمِي»، ناقص يائي، قُلبت ياؤه ألفًا في الماضي."
rhetoric:
  thesis: "يسأل نفسه ويجيب في الحال، فلا يترك للسؤال وقتًا. والجواب «نعم» تتبعه الإصابة فورًا: المعرفة والشوق وقعا معًا، والصبر لم يصل بعد."
  devices:
    - title: "الاستعارة في «رَمَاكَ الشَّوْقُ»"
      text: "جعل الشوق راميًا يصيب بسهمه، ولم يذكر الرامي ولا السهم، بل ذكر الرمي وحده. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]. فالشوق يأتي فجأة كالسهم، ويصيب قبل أن يرى صاحبه."
    - title: "التجريد في «أَتَعْرِفُ ... نَعَمْ»"
      text: "يخاطب نفسه كأنها شخص آخر، ثم يجيب عنها. وهي عادة شعراء الأطلال، ويجعل بها الحوار داخل نفس واحدة."
    - title: "«قَبْلَ التَّجَلُّدِ»"
      text: "لم يقل إن الشوق غلب صبره، بل قال إنه سبقه: فالصبر يحتاج إلى وقت يتكلّفه فيه المرء، والشوق لا يحتاج. وهي قراءتنا."
    - title: "التصريع"
      text: "اتفاق آخر الشطرين في الرويّ: «مَعْبَدِ» و«التَّجَلُّدِ»."
  connection: "يصف في البيت التالي أثر هذا الشوق: «ظَلِلْتُ بِهَا أُسْقَى الْغَرَامَ كَأَنَّمَا سَقَتْنِي النَّدَامَى»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة، والقافية مطلقة موصولة بالياء"
  scansion: "أَتَعْرِ / فُ رَسْمَدْدَا / رِ مِنْ أُمْ / مِ مَعْبَدِي = فعولُ / مفاعيلن / فعولن / مفاعلن — نَعَمْ وَ / رَمَاكَشْشَوْ / قُ قَبْلَتْ / تَجَلْلُدِي = فعولُ / مفاعيلن / فعولن / مفاعلن"
  note: "في أول الشطرين «فعولُ» مكان «فعولن»: سقط الخامس الساكن، وهو القَبْض. و«مفاعلن» في آخر الشطرين لازمة في هذا الضرب، وجاءت العروض مثلها للتصريع."
