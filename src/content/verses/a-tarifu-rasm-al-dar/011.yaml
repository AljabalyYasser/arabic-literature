explained: false
first: "ذَرِينِي فَإِنِّي إِنَّمَا لِيَ مَا مَضَى"
second: "أَمَامِيَ مِنْ مَالِي إِذَا خَفَّ عُوَّدِي"
vocabulary:
  - term: "مَا مَضَى أَمَامِيَ مِنْ مَالِي"
    text: "ما أنفقته وقدّمته قبل موتي."
  - term: "خَفَّ عُوَّدِي"
    text: "انصرف عني زوّاري في مرضي، أي متُّ. والعُوَّد: جمع عائد، وهو زائر المريض."
