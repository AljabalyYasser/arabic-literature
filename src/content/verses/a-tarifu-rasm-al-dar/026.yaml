explained: false
first: "وَرَاجِي أُمُورٍ جَمَّةٍ لَنْ يَنَالَهَا"
second: "سَتَشْعَبُهُ عَنْهَا شَعُوبُ لِمُلْحَدِ"
vocabulary:
  - term: "جَمَّةٍ"
    text: "كثيرة."
  - term: "سَتَشْعَبُهُ عَنْهَا شَعُوبُ"
    text: "ستصرفه عنها المنيّة. قال صاحب اللسان: «تَقُولُ: شَعَبَتْهم الْمَنِيَّةُ أَي فرَّقَتْهم، وَمِنْهُ سُمِّيَتِ الْمَنِيَّةُ شَعُوبَ» [@lisan، ج1 ص501]."
  - term: "لِمُلْحَدِ"
    text: "إلى لحد، أي قبر."
