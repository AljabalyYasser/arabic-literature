first: "عَنِ الْمَرْءِ لَا تَسْأَلْ وَسَلْ عَنْ قَرِينِهِ"
second: "فَكُلُّ قَرِينٍ بِالْمُقَارِنِ يَقْتَدِي"
meaning: "إذا أردت أن تعرف رجلًا فلا تسأل عنه هو، بل اسأل عن صاحبه الذي يلازمه، لأن كل صاحب يقتدي بمن يصاحبه ويتشبه به، فمن عرفت صاحبه عرفته."
vocabulary:
  - term: "قَرِينِهِ"
    text: "صاحبه الذي يقارنه ويلازمه."
  - term: "بِالْمُقَارِنِ"
    text: "بمن يصاحبه."
  - term: "يَقْتَدِي"
    text: "يتّبع ويتشبّه."
context: "أشهر أبيات القصيدة، وقد صار مثلًا. يرويه لعَدِيّ ابن قُتَيْبة في «عيون الأخبار»، وابن عبد رَبِّه، والعسكري، والمَيْدانيّ، والمَرْزُبانيّ [@uyun-al-akhbar، ج3 ص91] [@iqd، ج2 ص230] [@askari-amthal، ج2 ص252] [@maydani، ج2 ص218] [@marzubani، ص250]. ويذكر المَيْدانيّ حديث النبي صلى الله عليه وسلم في أن المرء بخليله، ثم يقول: «وقريب منه بيت عَدِىّ بن زيد» [@maydani، ج2 ص219]. لكنه يُروى أيضًا في معلقة طَرَفَة في «الجمهرة» نفسها وفي ديوانه [@jamhara، ص341] [@diwan-tarafa، ص32]، ويقول المَيْدانيّ في موضع آخر إن المثل «مأخوذ من قول طرفة» [@maydani، ج2 ص427]، ويختم التِّبْرِيزيّ معلقة طَرَفَة ببيتين «وقيل: إنهما لعدي بن زيد»، هذا أحدهما [@tabrizi-ashr، ص101]. فهو مختلف فيه بينهما، والأكثر على أنه لعَدِيّ. وفي قصيدته يقع في وسط وصايا الصحبة، بعد البيتين في الرجل الذي لا يُرجى منه خير."
syntax:
  - "«عَنِ الْمَرْءِ» جار ومجرور متعلق بـ«تسأل» مقدَّم عليه، و«لَا» ناهية، و«تَسْأَلْ» مضارع مجزوم بها."
  - "«وَسَلْ» فعل أمر، و«عَنْ قَرِينِهِ» متعلق به."
  - "«فَكُلُّ» الفاء للتعليل، و«كلّ» مبتدأ، و«قرينٍ» مضاف إليه، و«بِالْمُقَارِنِ» متعلق بـ«يقتدي»، وجملة «يَقْتَدِي» خبر المبتدأ."
morphology:
  - "«سَلْ» أمر من «سَأَلَ»: نُقلت حركة الهمزة إلى السين وحُذفت، فاستُغني عن همزة الوصل، والأصل «اسْأَلْ»."
  - "«قَرِين» على «فَعِيل» بمعنى «مُفاعِل»: الصاحب، و«الْمُقَارِن» اسم فاعل من «قَارَنَ»، و«يَقْتَدِي» مضارع «اقْتَدَى» على «افْتَعَلَ»."
rhetoric:
  thesis: "يقلب طريقة المعرفة المعتادة: لا تعرف الرجل بالسؤال عنه، بل بالسؤال عمّن حوله. والشطر الثاني يعلّل الأول بحكم عام، فصار البيت كله صالحًا للتمثل به في كل موضع."
  devices:
    - title: "المقابلة في «لَا تَسْأَلْ وَسَلْ»"
      text: "نهي وأمر بالفعل نفسه في شطر واحد، والفرق في المسؤول عنه وحده: المرء أم قرينه. فقرّب بين الفعلين ليبرز الفرق بين المفعولين."
    - title: "التقديم في «عَنِ الْمَرْءِ لَا تَسْأَلْ»"
      text: "قدّم المسؤول عنه على الفعل، لأنه موضع النهي: لا عن المرء نفسه. وعبد القاهر الجُرْجانيّ يقول في التقديم: «كأنهم يقدمون الذي بيانه أهم لهم، وهم ببيانه أعنى» [@dalail، ص107]."
    - title: "التذييل في «فَكُلُّ قَرِينٍ بِالْمُقَارِنِ يَقْتَدِي»"
      text: "التذييل: أن يُختم الكلام بجملة عامة تؤكد معناه وتصلح أن تستقل بنفسها. فالشطر الثاني حكم يجري مجرى المثل، وبه صار البيت سائرًا."
    - title: "الجناس في «قَرِينٍ» و«الْمُقَارِنِ»"
      text: "لفظان من أصل واحد، فيرنّ الشطر بمعنى الاقتران في لفظه نفسه."
  connection: "يتبعه بوصية في المجالسة: «إِذَا أَنْتَ فَاكَهْتَ الرِّجَالَ فَلَا تَلَعْ»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "عَنِلْمَرْ / ءِ لَا تَسْأَلْ / وَسَلْ عَنْ / قَرِينِهِي = فعولن / مفاعيلن / فعولن / مفاعلن — فَكُلْلُ / قَرِينِنْ بِلْ / مُقَارِ / نِ يَقْتَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "القَبْض في «فعولُ» الأولى والثالثة من العجز، وتُشبع كسرة «قَرِينِهِ» في الوزن."
