first: "إِذَا مَا امْرُؤٌ لَمْ يَرْجُ مِنْكَ هَوَادَةً"
second: "فَلَا تَرْجُهَا مِنْهُ وَلَا دَفْعَ مَشْهَدِ"
vocabulary:
