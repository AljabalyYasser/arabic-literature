explained: false
first: "أَعَاذِلُ قَدْ لَاقَيْتُ مَا يَزَعُ الْفَتَى"
second: "وَطَابَقْتُ فِي الْحِجْلَيْنِ مَشْيَ الْمُقَيَّدِ"
vocabulary:
  - term: "يَزَعُ"
    text: "يكفّ ويردع."
  - term: "الْحِجْلَيْنِ"
    text: "القيدين، والحِجْل في الأصل الخلخال."
  - term: "طَابَقْتُ"
    text: "قاربت بين خطاي كما يمشي المقيّد."
