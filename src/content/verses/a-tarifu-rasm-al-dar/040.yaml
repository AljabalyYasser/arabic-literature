first: "سَأَكْسِبُ مَجْدًا أَوْ تَقُومَ نَوَائِحٌ"
second: "عَلَيَّ بِلَيْلٍ نَادِبَاتِي وَعُوَّدِي"
vocabulary:
  - term: "أَوْ تَقُومَ"
    text: "إلا أن تقوم."
  - term: "نَادِبَاتِي"
    text: "النساء يعدّدن محاسني بعد موتي."
  - term: "عُوَّدِي"
    text: "من كانوا يعودونني في مرضي."
