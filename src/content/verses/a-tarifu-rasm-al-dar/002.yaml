explained: false
first: "ظَلِلْتُ بِهَا أُسْقَى الْغَرَامَ كَأَنَّمَا"
second: "سَقَتْنِي النَّدَامَى شَرْبَةً لَمْ تُصَرَّدِ"
vocabulary:
  - term: "أُسْقَى الْغَرَامَ"
    text: "يُسقى الولوعَ والعذاب، وفي نص «الجمهرة» عندنا «أسفي»، وهو تصحيف."
  - term: "لَمْ تُصَرَّدِ"
    text: "لم تُقلَّل، أي شربة وافية؛ والتصريد: التقليل في السقي."
