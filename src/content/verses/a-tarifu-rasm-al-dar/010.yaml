first: "أَعَاذِلُ مَا يُدْرِيكِ أَنَّ مَنِيَّتِي"
second: "إِلَى سَاعَةٍ فِي الْيَوْمِ أَوْ فِي ضُحَى الْغَدِ"
meaning: "يا عاذلتي، ما الذي يُعلمك أن موتي مؤجل؟ لعله في ساعة من يومي هذا، أو في ضحى الغد. فإذا كان الموت قريبًا هكذا، فلا معنى للومك إياي على الإنفاق."
vocabulary:
  - term: "أَعَاذِلُ"
    text: "يا عاذلة، أي يا لائمة، وحذف آخر الاسم للتحبب والتخفيف."
  - term: "مَا يُدْرِيكِ"
    text: "ما يُعلمك؟ أي: لا علم لك."
  - term: "مَنِيَّتِي"
    text: "موتي المقدّر."
  - term: "ضُحَى الْغَدِ"
    text: "ارتفاع النهار من يوم غد."
context: "هذا البيت والثلاثة بعده هي ما يختاره ابن قُتَيْبة من القصيدة، ويقول قبلها: «وفيها يقول» [@ibn-qutayba، ج1 ص220]. وهي قلب الجواب على العاذلة: بعد أن احتج للّهو بأنه من لذة الفتى، يحتج للإنفاق بقرب الموت، ثم يقول في البيت التالي إن ماله الحقيقي هو ما قدّمه قبل موته."
syntax:
  - "«أَعَاذِلُ» الهمزة حرف نداء للقريب، و«عاذلُ» منادى مرخّم من «عاذلة»، مبني على الضم على لغة من لا ينتظر المحذوف."
  - "«مَا» اسم استفهام في محل رفع مبتدأ، وجملة «يُدْرِيكِ» خبره، والكاف مفعول به أول، و«أَنَّ مَنِيَّتِي إِلَى سَاعَةٍ» في تأويل مصدر سدّ مسدّ المفعول الثاني."
  - "«إِلَى سَاعَةٍ» متعلق بمحذوف خبر «أنّ»، أي: مؤجّلة إلى ساعة، و«فِي الْيَوْمِ» صفة لـ«ساعة»، و«أَوْ فِي ضُحَى الْغَدِ» معطوف عليه."
morphology:
  - "«عاذِل» اسم فاعل من «عَذَلَ»، وأصله هنا «عاذلة»، فحُذفت التاء في النداء، وهذا هو الترخيم."
  - "«يُدْرِي» مضارع «أَدْرَى» على «أَفْعَل»، و«مَنِيَّة» على «فَعِيلَة» بمعنى «مفعولة»: الموت المقدَّر."
rhetoric:
  thesis: "يرد اللوم بسؤال لا جواب له: من يعرف ساعة موته؟ وحين يعجز اللائم عن الجواب يسقط لومه كله، لأن الحرص على المال لا يصح إلا لمن يضمن الغد."
  devices:
    - title: "الاستفهام الإنكاري في «مَا يُدْرِيكِ»"
      text: "لا يسأل عمّا تعرفه، بل ينفي أن تعرف شيئًا: لا يدريكِ أحد. والسؤال أقوى من النفي، لأنه يحمّلها عبء الجواب."
    - title: "الترخيم في «أَعَاذِلُ»"
      text: "الترخيم: حذف آخر المنادى. ويبدأ الشاعر بـ«أعاذل» سبعة أبيات من القصيدة، فصار النداء المرخّم لازمة يبني عليها جوابه، فيه لين وإصرار معًا."
    - title: "التقريب في «فِي الْيَوْمِ أَوْ فِي ضُحَى الْغَدِ»"
      text: "لم يقل: قد يأتي موتي يومًا ما، بل حدّد أقرب وقتين: اليوم، وضحى الغد. فجعل الموت على مسافة ساعات لا سنين. وهي قراءتنا."
  connection: "يبني على هذا البيت جوابه: «ذَرِينِي فَإِنِّي إِنَّمَا لِيَ مَا مَضَى أَمَامِيَ مِنْ مَالِي»، أي ما أنفقته قبل موتي."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "أَعَاذِ / لُ مَا يُدْرِي / كِ أَنْنَ / مَنِيْيَتِي = فعولُ / مفاعيلن / فعولُ / مفاعلن — إِلَى سَا / عَتِنْ فِلْيَوْ / مِ أَوْ فِي / ضُحَلْغَدِي = فعولن / مفاعيلن / فعولن / مفاعلن"
  note: "القَبْض في «فعولُ» الأولى والثالثة من الصدر، و«مفاعلن» في العروض والضرب لازمة."
