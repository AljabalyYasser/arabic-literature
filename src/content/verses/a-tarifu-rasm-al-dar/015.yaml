first: "كَفَى زَاجِرًا لِلْمَرْءِ أَيَّامُ دَهْرِهِ"
second: "تَرُوحُ لَهُ بِالْوَاعِظَاتِ وَتَغْتَدِي"
meaning: "تكفي الإنسانَ أيامُ عمره رادعًا عن الغيّ، فهي تأتيه في المساء وفي الصباح بما يعظه من حوادث: موت قريب، وزوال نعمة، وتقلّب حال. فلا يحتاج إلى واعظ غيرها."
vocabulary:
  - term: "زَاجِرًا"
    text: "رادعًا يمنع من الخطأ."
  - term: "بِالْوَاعِظَاتِ"
    text: "بالحوادث التي تعظ."
  - term: "تَغْتَدِي"
    text: "تأتي غُدوة، أي في أول النهار."
context: "بعد أن انتهى من العاذلة في البيت 14، يبدأ بهذا البيت قسم الوصايا: لم يعد يرد على امرأة، بل يعظ مخاطَبًا عامًّا. فالبيت جسر بين الدفاع عن نفسه وتعليم غيره، ويجعل الأيام هي المعلّم الأول قبل وصاياه."
syntax:
  - "«كَفَى» فعل ماض، و«زَاجِرًا» تمييز منصوب، و«لِلْمَرْءِ» متعلق بـ«زاجرًا»، و«أَيَّامُ» فاعل «كفى» مؤخر، و«دَهْرِهِ» مضاف إليه."
  - "جملة «تَرُوحُ لَهُ» في محل نصب حال من «أيام»، و«بِالْوَاعِظَاتِ» متعلق بـ«تروح»، و«تَغْتَدِي» معطوفة على «تروح»."
morphology:
  - "«زَاجِر» اسم فاعل من «زَجَرَ»، و«الْوَاعِظَات» جمع «واعظة»، اسم فاعل مؤنث من «وَعَظَ»، وهو صفة لموصوف محذوف: الحوادث الواعظات."
  - "«تَغْتَدِي» مضارع «اغْتَدَى» على «افْتَعَلَ» من «غَدَا»."
rhetoric:
  thesis: "يُخرج الوعظ من فم الشاعر إلى الأيام نفسها: لست أنا من يعظك، بل الأيام. وبهذا تصير وصاياه التالية تفسيرًا لما تقوله الأيام."
  devices:
    - title: "الاستعارة في «أَيَّامُ دَهْرِهِ تَرُوحُ لَهُ بِالْوَاعِظَاتِ»"
      text: "جعل الأيام إنسانًا يروح ويغدو على المرء ومعه مواعظ يحملها إليه، ولم يذكر الإنسان، بل ذكر من صفاته الرواح والغدوّ والوعظ. والاستعارة عند عبد القاهر الجُرْجانيّ: «أن تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "الطباق بين «تَرُوحُ» و«تَغْتَدِي»"
      text: "المساء والصباح: أي في كل وقت، فلا يمرّ يوم بلا موعظة."
    - title: "«كَفَى زَاجِرًا»"
      text: "«كفى» تعني أنه لا حاجة إلى غيره، فمن لم تزجره الأيام لن يزجره شيء. والتمييز «زاجرًا» يحدد جهة الكفاية."
  connection: "يبني عليها الوصية الأولى: «فَنَفْسَكَ فَاحْفَظْهَا عَنِ الْغَيِّ وَالرَّدَى»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ الدال المكسورة"
  scansion: "كَفَى زَا / جِرَنْ لِلْمَرْ / ءِ أَيْيَا / مُ دَهْرِهِي = فعولن / مفاعيلن / فعولن / مفاعلن — تَرُوحُ / لَهُو بِلْوَا / عِظَاتِ / وَتَغْتَدِي = فعولُ / مفاعيلن / فعولُ / مفاعلن"
  note: "القَبْض في «فعولُ» الأولى والثالثة من العجز، وتُشبع ضمة «لَهُ» في الوزن: «لَهُو»."
