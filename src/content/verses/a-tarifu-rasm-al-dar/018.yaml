first: "وَإِنْ كَانَتِ النَّعْمَاءُ عِنْدَكَ لِامْرِئٍ"
second: "فَمِثْلًا بِهَا فَاجْزِ الْمُطَالِبَ وَازْدَدِ"
vocabulary:
