explained: false
first: "تَعَلَّمَنْ هَا لَعَمْرُ اللَّهِ ذَا قَسَمًا"
second: "فَاقْدِرْ بِذَرْعِكَ وَانْظُرْ أَيْنَ تَنْسَلِكُ"
vocabulary:
  - term: "تَعَلَّمَنْ هَا ... ذَا قَسَمًا"
    text: "«أي: اعلم. وها: تنبيه. وأراد: هذا ما أقسم به. ففرق بين «ذا» و«ها» بقوله «لعمر الله»» [@diwan-zuhayr، ص89]."
  - term: "فَاقْدِرْ بِذَرْعِكَ"
    text: "«أي: قدّر بخطوك. والذرع: قدر الخطو. وهذا مثل. والمعنى: لا تكلّف نفسك ما لا تطيق منّي» [@diwan-zuhayr، ص89]."
  - term: "تَنْسَلِكُ"
    text: "«والانسلاك: الدخول في الأمر. وأصله من سلوك الطريق» [@diwan-zuhayr، ص89]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص88–89"
    url: "https://archive.org/details/3917pdf/page/n88/mode/1up"
