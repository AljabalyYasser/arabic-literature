    text: "«أي: مصطادًا» [@diwan-zuhayr، ص81]."
  - term: "قُمْرًا"
    text: "«حمر الوحش البيض البطون» [@diwan-zuhayr، ص81]."
  - term: "الْقِيعَانُ وَالنَّبَكُ"
    text: "«و«القيعان»: بطون الأرض. و«النبك»: جمع نبكة، وهي رابية من طين» [@diwan-zuhayr، ص81–82]."
