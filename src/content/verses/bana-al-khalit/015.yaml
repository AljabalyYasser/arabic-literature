explained: false
first: "أَهْوَى لَهَا أَسْفَعُ الْخَدَّيْنِ مُطَّرِقٌ"
second: "رِيشَ الْقَوَادِمِ لَمْ يُنْصَبْ لَهُ الشَّبَكُ"
vocabulary:
  - term: "أَهْوَى لَهَا أَسْفَعُ الْخَدَّيْنِ"
    text: "«يقول: أهوى لهذه القطاة صقر أسفع الخدّين، ليأخذها» … «و«السفعة»: سواد يضرب إلى الحمرة» [@diwan-zuhayr، ص84]. وأهوى لها: «انقضّ عليها» كما يقول المحقق [@diwan-zuhayr، ص83]."
  - term: "مُطَّرِقٌ رِيشَ الْقَوَادِمِ"
    text: "«أي: ريشه بعضه على بعض، ليس بمنتشر، فهو أعتق له. و«القوادم»: ريش مقدّم الجناح» [@diwan-zuhayr، ص84]."
  - term: "لَمْ يُنْصَبْ لَهُ الشَّبَكُ"
    text: "«يعني: أنه وحشيّ، لم يؤخذ ولم يذلّل» [@diwan-zuhayr، ص84]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص83–84"
