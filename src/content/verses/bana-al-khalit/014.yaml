explained: false
first: "جُونِيَّةٌ كَحَصَاةِ الْقَسْمِ مَرْتَعُهَا"
second: "بِالسِّيِّ مَا تُنْبِتُ الْقَفْعَاءُ وَالْحَسَكُ"
vocabulary:
  - term: "جُونِيَّةٌ"
    text: "«فالقطا ضربان: جونيّ وكدريّ. فالجونيّ ما كان في لونه سواد، وهو أشدّ القطا طيرانًا» [@diwan-zuhayr، ص83]."
  - term: "كَحَصَاةِ الْقَسْمِ"
    text: "«هي حصاة، إذا قلّ الماء عند المسافرين وضعوها في القدح، وصبّوا عليها الماء حتّى يغمرها، ليقسم بينهم بالسويّة» … «فشبّه القطاة بها، في شدّتها، واجتماع خلقها» [@diwan-zuhayr، ص83]."
  - term: "بِالسِّيِّ"
    text: "«موضع» [@diwan-zuhayr، ص83]."
  - term: "الْقَفْعَاءُ وَالْحَسَكُ"
    text: "«و«القفعاء»: بقلة من أحرار البقل. و«الحسك»: ثمر النفل» [@diwan-zuhayr، ص83]، والنفل نبت."
sources:
