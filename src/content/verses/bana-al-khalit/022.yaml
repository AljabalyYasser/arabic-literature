explained: false
first: "مُكَلَّلٍ بِأُصُولِ النَّبْتِ تَنْسُجُهُ"
second: "رِيحٌ خَرِيقٌ لِضَاحِي مَائِهِ حُبُكُ"
vocabulary:
  - term: "مُكَلَّلٍ بِأُصُولِ النَّبْتِ"
    text: "«يقول: هو ماء دائم لا ينقطع، فالنبت قد كلّله، وأحاط به» [@diwan-zuhayr، ص85]."
  - term: "رِيحٌ خَرِيقٌ تَنْسُجُهُ"
    text: "«و«الخريق»: الشديدة. ومعنى «تنسجه»: تمرّ عليه» [@diwan-zuhayr، ص85]."
  - term: "لِضَاحِي مَائِهِ حُبُكُ"
    text: "«و«الضاحي»: ما ضحى للشمس من الماء، أي: برز وظهر. و«الحبك»: طرائق الماء» [@diwan-zuhayr، ص85–86]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص85–86"
    url: "https://archive.org/details/3917pdf/page/n85/mode/1up"
status: "review"
