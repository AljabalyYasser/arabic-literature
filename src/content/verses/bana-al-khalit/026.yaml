explained: false
first: "فَلَنْ يَقُولُوا بِحَبْلٍ وَاهِنٍ خَلَقٍ"
second: "لَوْ كَانَ قَوْمُكَ فِي أَسْبَابِهِ هَلَكُوا"
vocabulary:
  - term: "وَاهِنٍ خَلَقٍ"
    text: "«و«الواهن»: الضعيف. وجعله «خلقًا» ليكون أوهن له» [@diwan-zuhayr، ص87]، والخلق: البالي."
  - term: "فِي أَسْبَابِهِ"
    text: "«أي: في أسباب ذلك الحبل» [@diwan-zuhayr، ص87]، والأسباب: الحبال."
sources:
