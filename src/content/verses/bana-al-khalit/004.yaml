explained: false
first: "ضَحَّوْا قَلِيلًا قَفَا كُثْبَانِ أَسْنُمَةٍ"
second: "وَمِنْهُمُ بِالْقَسُومِيَّاتِ مُعْتَرَكُ"
vocabulary:
  - term: "ضَحَّوْا"
    text: "«أي: رعوا الضحاء. والضحاء للإبل: بمنزلة الغداء للناس» [@diwan-zuhayr، ص79]."
  - term: "قَفَا كُثْبَانِ أَسْنُمَةٍ"
    text: "«يعني: خلفها. و«أسنمة»: جبل قريب من فلج. والكثبان: أكداس الرمل» [@diwan-zuhayr، ص79]."
  - term: "بِالْقَسُومِيَّاتِ مُعْتَرَكُ"
    text: "«و«القسوميّات»: مواضع عادلة عن طريق فلج ذات اليمين. و«المعترك»: موضع نزولهم وإناختهم. وأصله في الحرب، فاستعاره هنا» [@diwan-zuhayr، ص79]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص79"
