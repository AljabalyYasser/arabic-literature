explained: false
first: "كَأَنَّهَا مِنْ قَطَا الْأَجْبَابِ حَلَّأَهَا"
second: "وِرْدٌ وَأَفْرَدَ عَنْهَا أُخْتَهَا الشَّرَكُ"
vocabulary:
  - term: "الْأَجْبَابِ"
    text: "«جمع جبّ، وهو كلّ بئر لم تطو» [@diwan-zuhayr، ص83]، أي لم تُبنَ جدرانها بالحجارة."
  - term: "حَلَّأَهَا وِرْدٌ"
    text: "«و«الورد»: قوم يردون الماء. ومعنى «حلّأها»: طردها عن الماء» [@diwan-zuhayr، ص83]."
  - term: "وَأَفْرَدَ عَنْهَا أُخْتَهَا الشَّرَكُ"
    text: "«أي: أخذت أختها بالشرك، ففزعت لذلك، فكان أسرع لها. والمعنى: كأنّ هذه الفرس، في خفّتها وسرعتها، قطاة من قطا الأجباب، هذه صفتها» [@diwan-zuhayr، ص83]."
sources:
