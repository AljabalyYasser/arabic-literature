explained: false
first: "وَصَاحِبِي وَرْدَةٌ نَهْدٌ مَرَاكِلُهَا"
second: "جَرْدَاءُ لَا فَحَجٌ فِيهَا وَلَا صَكَكُ"
vocabulary:
  - term: "وَصَاحِبِي وَرْدَةٌ"
    text: "«أي: الذي أصاحبه، وأستعمله في الصيد، فرس وردة اللون» [@diwan-zuhayr، ص82]."
  - term: "نَهْدٌ مَرَاكِلُهَا"
    text: "«و«النهد»: الغليظ الضخم» [@diwan-zuhayr، ص82]، والمراكل: حيث يضربها الفارس بعقبيه من جنبيها."
  - term: "جَرْدَاءُ"
    text: "«القصيرة الشعر» [@diwan-zuhayr، ص82]."
  - term: "فَحَجٌ ... صَكَكُ"
    text: "«و«الفحج»: تباعد ما بين العرقوبين والفخذين. و«الصكك»: اصطكاك العرقوبين في الدوابّ، وفي الناس: اصطكاك الركبتين» [@diwan-zuhayr، ص82]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص82"
    url: "https://archive.org/details/3917pdf/page/n82/mode/1up"
status: "review"
