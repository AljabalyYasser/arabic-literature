explained: false
first: "بَانَ الْخَلِيطُ وَلَمْ يَأْوُوا لِمَنْ تَرَكُوا"
second: "وَزَوَّدُوكَ اشْتِيَاقًا أَيَّةً سَلَكُوا"
vocabulary:
  - term: "الْخَلِيطُ"
    text: "«الأصحاب المخالطون في الدار. ويكون واحدًا وجمعًا، وهو ههنا جمع» [@diwan-zuhayr، ص78]."
  - term: "وَلَمْ يَأْوُوا"
    text: "«ومعناه: لم يرحموا ولم يرقّوا. يقال: أويت له، إذا رققت له ورحمته» [@diwan-zuhayr، ص78]."
  - term: "أَيَّةً سَلَكُوا"
    text: "«أي: أيّة وجهة سلكوا» [@diwan-zuhayr، ص78]، «وأراد: أيّة جهة. فحذف المضاف إليه» [@diwan-zuhayr، ص79]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص78–79"
    url: "https://archive.org/details/3917pdf/page/n78/mode/1up"
