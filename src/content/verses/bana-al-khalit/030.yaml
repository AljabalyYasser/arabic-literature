first: "طَابَتْ نُفُوسُهُمُ عَنْ حَقِّ خَصْمِهِمُ"
second: "مَخَافَةَ الشَّرِّ فَارْتَدُّوا لِمَا تَرَكُوا"
vocabulary:
  - term: "فَارْتَدُّوا لِمَا تَرَكُوا"
    text: "«أي: لمّا أوذوا بالهجاء دفعوا الحقّ إلى صاحبه، وارتدّوا إلى إعطاء ما كانوا تركوه ومنعوه، من الحقّ، مخافة من الشرّ، وإبقاء على أعراضهم» [@diwan-zuhayr، ص88]."
