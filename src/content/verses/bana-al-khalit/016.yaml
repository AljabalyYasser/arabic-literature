explained: false
first: "لَا شَيْءَ أَسْرَعُ مِنْهَا وَهْيَ طَيِّبَةٌ"
second: "نَفْسًا بِمَا سَوْفَ يُنْجِيهَا وَتَتَّرِكُ"
vocabulary:
  - term: "وَهْيَ طَيِّبَةٌ نَفْسًا"
    text: "«وهي طيّبة النفس، واثقة بما عندها من شدّة الطيران، الذي ينجيها من الصقر» [@diwan-zuhayr، ص84]."
  - term: "وَتَتَّرِكُ"
    text: "«أي: لا تخرج أقصاه، لثقتها بنفسها في أنّ الصقر لا يدركها» [@diwan-zuhayr، ص84]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص83–84"
    url: "https://archive.org/details/3917pdf/page/n83/mode/1up"
status: "review"
