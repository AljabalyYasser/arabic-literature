first: "حَتَّى إِذَا مَا هَوَتْ كَفُّ الْوَلِيدِ لَهَا"
second: "طَارَتْ وَفِي كَفِّهِ مِنْ رِيشِهَا بِتَكُ"
vocabulary:
  - term: "هَوَتْ كَفُّ الْوَلِيدِ لَهَا"
    text: "«يقول: وقعت هذه القطاة بموضع، لمّا أخطأها الصقر، فهوت كفّ الغلام لها ليأخذها، فأفلتته» [@diwan-zuhayr، ص85]."
  - term: "بِتَكُ"
    text: "«القطع» [@diwan-zuhayr، ص85]، أي قطع من ريشها."
