explained: false
first: "مُقْوَرَّةٌ تَتَبَارَى لَا شَوَارَ لَهَا"
second: "إِلَّا الْقُطُوعُ عَلَى الْأَنْسَاعِ وَالْوُرُكُ"
vocabulary:
  - term: "مُقْوَرَّةٌ"
    text: "«أي: ضامرة» [@diwan-zuhayr، ص81]."
  - term: "تَتَبَارَى"
    text: "«يعارض بعضها بعضًا في السير» [@diwan-zuhayr، ص81]."
  - term: "لَا شَوَارَ لَهَا"
    text: "«و«الشّوار»: المتاع. يقول: لا متاع لهذه القلص إلا القطوع، لأنّ أصحابها مخفّون مسرعون، ليلحقوا بالقوم» [@diwan-zuhayr، ص81]."
  - term: "الْقُطُوعُ ... الْأَنْسَاعِ وَالْوُرُكُ"
    text: "«و«القطوع»: الطنافس التي يوطّأ بها الرحل. و«الأنساع»: حزم الرحال. و«الورك»: جمع وراك، وهو قطع أو ثوب، يشدّ على مورك الرحل» [@diwan-zuhayr، ص81]. والطنافس: البُسُط."
sources:
  - source: "diwan-zuhayr"
    loc: "ص80–81"
