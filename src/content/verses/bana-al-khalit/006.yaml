explained: false
first: "يَغْشَى الْحُدَاةُ بِهِمْ وَعْثَ الْكَثِيبِ كَمَا"
second: "يُغْشِي السَّفَائِنَ مَوْجَ اللُّجَّةِ الْعَرَكُ"
vocabulary:
  - term: "الْحُدَاةُ"
    text: "سائقو الإبل."
  - term: "وَعْثَ الْكَثِيبِ"
    text: "«يصف أنهم اختصروا الطريق، وركبوا «وعث» الرمل، وهو: اللّيّن الذي تغرق فيه [قوائم] الماشية» [@diwan-zuhayr، ص80]."
  - term: "اللُّجَّةِ الْعَرَكُ"
    text: "«و«اللجّة»: معظم الماء. و«العرك»: جمع عركيّ، وهو النوتيّ. شبّه حمل الحداة الإبل على صعب الرمل، باقتحام النواتية لجّة البحر بالسفن» [@diwan-zuhayr، ص80]. والنوتيّ: الملّاح."
sources:
