explained: false
first: "مَا إِنْ يَكَادُ يُخَلِّيهِمْ لِوِجْهَتِهِمْ"
second: "تَخَالُجُ الْأَمْرِ إِنَّ الْأَمْرَ مُشْتَرَكُ"
vocabulary:
  - term: "لِوِجْهَتِهِمْ"
    text: "«جهتهم، وطريقتهم التي سلكوها ذاهبين» [@diwan-zuhayr، ص79]."
  - term: "تَخَالُجُ الْأَمْرِ"
    text: "«يعني: اختلافهم في الرأي، وتنازعهم فيه» [@diwan-zuhayr، ص79]."
  - term: "إِنَّ الْأَمْرَ مُشْتَرَكُ"
    text: "«فأمرهم مشترك بينهم، لم يتّفقوا فيه على رأي واحد. فاختلافهم هذا هو الذي حبسهم إلى الظهيرة» [@diwan-zuhayr، ص79]."
sources:
