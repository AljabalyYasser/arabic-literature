explained: false
first: "ثُمَّ اسْتَمَرَّتْ إِلَى الْوَادِي فَأَلْجَأَهَا"
second: "مِنْهُ وَقَدْ طَمِعَ الْأَظْفَارُ وَالْحَنَكُ"
vocabulary:
  - term: "فَأَلْجَأَهَا مِنْهُ"
    text: "«أي: عاودها الصقر، فنهضت إلى الوادي، فأنجاها من الصقر، لأنّ فيه شجرًا. فلجأت إليه واعتصمت به» [@diwan-zuhayr، ص85]."
  - term: "الْأَظْفَارُ وَالْحَنَكُ"
    text: "«و«الحنك»: المنقار. و«الأظفار»: مخالب الصقر» [@diwan-zuhayr، ص85]."
sources:
