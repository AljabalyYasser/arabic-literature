explained: false
first: "مَرًّا كِفَاتًا إِذَا مَا الْمَاءُ أَسْهَلَهَا"
second: "حَتَّى إِذَا ضُرِبَتْ بِالسَّوْطِ تَبْتَرِكُ"
vocabulary:
  - term: "مَرًّا كِفَاتًا"
    text: "«أي: تمرّ هذه الفرس مرًّا سريعًا. والكفات والكفت: القبض. يقال: انكفت في حاجته، أي: انقبض فيها وأسرع» [@diwan-zuhayr، ص82]."
  - term: "إِذَا مَا الْمَاءُ أَسْهَلَهَا"
    text: "«أي: تسرع في عدوها، إذا عرقت فأسهلها العرق، فكيف بها قبل ذلك؟» [@diwan-zuhayr، ص82]."
  - term: "تَبْتَرِكُ"
    text: "«أي: تجتهد في العدو» [@diwan-zuhayr، ص82]."
sources:
