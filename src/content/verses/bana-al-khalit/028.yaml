explained: false
first: "ارْدُدْ يَسَارًا وَلَا تَعْنُفْ عَلَيْهِ وَلَا"
second: "تَمْعَكْ بِعِرْضِكَ إِنَّ الْغَادِرَ الْمَعِكُ"
vocabulary:
  - term: "يَسَارًا"
    text: "«يريد: غلامه، وكان الحارث قد أسره» [@diwan-zuhayr، ص88]."
  - term: "تَعْنُفْ"
    text: "«و«العنف»: فعل الشيء على غير وجهه، والتجاوز فيه» [@diwan-zuhayr، ص88]."
  - term: "تَمْعَكْ بِعِرْضِكَ ... الْمَعِكُ"
    text: "«المعك: المطل. و«المعك»: المطول. يقول: لا تمطلني بيسار، فمطلك غدر. وكلّما مطلتني لحق ذلك بعرضك. وإنما يتوعّده بالهجو» [@diwan-zuhayr، ص88]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص88"
    url: "https://archive.org/details/3917pdf/page/n88/mode/1up"
status: "review"
