explained: false
first: "فَزَلَّ عَنْهَا وَأَوْفَى رَأْسَ مَرْقَبَةٍ"
second: "كَمَنْصِبِ الْعِتْرِ دَمَّى رَأْسَهُ النُّسُكُ"
vocabulary:
  - term: "فَزَلَّ عَنْهَا"
    text: "«أي: زلّ الصقر عن القطاة» [@diwan-zuhayr، ص86]."
  - term: "مَرْقَبَةٍ"
    text: "«المكان المرتفع، حيث يرقب الرقيب» [@diwan-zuhayr، ص86]."
  - term: "كَمَنْصِبِ الْعِتْرِ"
    text: "«أي: كأنّ الصقر، مما به من الدم، الحجر الذي يعتر عليه، وهو المنصب. والعتر: ذبح كان يذبح في رجب» [@diwan-zuhayr، ص86]."
  - term: "النُّسُكُ"
    text: "«جمع نسيكة» [@diwan-zuhayr، ص86]، وهي الذبيحة. ويقول الأعلم: «وإنما شبّه زهير الصقر بالحجر المدمّى، إشارة إلى كثرة ما يصيد، فهو مخضوب بدماء الصيد» [@diwan-zuhayr، ص87]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص86–87"
    url: "https://archive.org/details/3917pdf/page/n86/mode/1up"
status: "review"
