explained: false
first: "كَمَا اسْتَغَاثَ بِسَيْءٍ فَزُّ غَيْطَلَةٍ"
second: "خَافَ الْعُيُونَ فَلَمْ يُنْظَرْ بِهِ الْحَشَكُ"
vocabulary:
  - term: "فَزُّ غَيْطَلَةٍ"
    text: "«و«الفزّ»: ولد البقرة» … «و«الغيطلة»: شجر ملتفّ. قال الأصمعيّ: كأنّ أمّه أرضعته في شجر ملتفّ. وقال أبو عبيدة: الغيطلة: البقرة» [@diwan-zuhayr، ص86]، يعني بقرة الوحش."
  - term: "بِسَيْءٍ"
    text: "«ما يكون في الضرع من اللبن، قبل نزول الدرّة» [@diwan-zuhayr، ص86]."
  - term: "خَافَ الْعُيُونَ فَلَمْ يُنْظَرْ بِهِ الْحَشَكُ"
    text: "«أي: خاف أن يراه الناس، فتعجّل ما في الضرع من السيء، ولم ينتظر اجتماع الدرّة. و«الحشك»: دفع الدرّة وحفلها» [@diwan-zuhayr، ص86]."
sources:
