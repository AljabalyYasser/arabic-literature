explained: false
first: "دُونَ السَّمَاءِ وَفَوْقَ الْأَرْضِ قَدْرُهُمَا"
second: "عِنْدَ الذُّنَابَى فَلَا فَوْتٌ وَلَا دَرَكُ"
vocabulary:
  - term: "دُونَ السَّمَاءِ وَفَوْقَ الْأَرْضِ"
    text: "«يقول: لم يحلّقا في السماء، فيغيبا عن العين، ولم يطيرا على الأرض، هما بين هذين» [@diwan-zuhayr، ص84]."
  - term: "عِنْدَ الذُّنَابَى"
    text: "«و«الذنابى»: الذنب. أي: قاربها الصقر، فصار عند ذنبها» [@diwan-zuhayr، ص84]."
  - term: "فَلَا فَوْتٌ وَلَا دَرَكُ"
    text: "«أي: لم تفته فوتًا بعيدًا، ولم يدركها فيصطادها» [@diwan-zuhayr، ص84]."
sources:
