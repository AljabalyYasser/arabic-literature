explained: false
first: "رَدَّ الْقِيَانُ جِمَالَ الْحَيِّ فَاحْتَمَلُوا"
second: "إِلَى الظَّهِيرَةِ أَمْرٌ بَيْنَهُمْ لَبِكُ"
vocabulary:
  - term: "الْقِيَانُ"
    text: "«الإماء. وكلّ أمة: قينة، مغنّية كانت أو غير مغنّية» [@diwan-zuhayr، ص79]."
  - term: "رَدَّ ... جِمَالَ الْحَيِّ"
    text: "«يعني: ردّوا الجمال من المرعى، لمّا أرادوا الرحيل» [@diwan-zuhayr، ص79]."
  - term: "فَاحْتَمَلُوا إِلَى الظَّهِيرَةِ"
    text: "«أي: طالت رحلتهم إلى وقت الظهيرة، لاختلاطهم، وكثرتهم، واختلاف آرائهم» [@diwan-zuhayr، ص79]."
  - term: "لَبِكُ"
    text: "«المختلط. يقال: لبكت عليه الأمر، إذا خلطته عليه» [@diwan-zuhayr، ص79]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص78–79"
    url: "https://archive.org/details/3917pdf/page/n78/mode/1up"
status: "review"
