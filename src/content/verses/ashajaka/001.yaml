first: أَشَجَاكَ الرَّبْعُ أَمْ قِدَمُهْ
second: أَمْ رَمَادٌ دَارِسٌ حُمَمُهْ
vocabulary:
- term: أَشَجَاكَ
  text: أأحزنك؟ من «شجاه» إذا أحزنه.
- term: الرَّبْعُ
  text: المنزل ودار الإقامة.
- term: دَارِسٌ
  text: عافٍ ذهبت معالمه.
- term: حُمَمُهْ
  text: 'الحُمَم: «الرماد والفحم وكل ما احترق من النار» [@lisan، ج12 ص157].'
