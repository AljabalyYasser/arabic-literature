explained: false
first: وَعَذَارِيكُمْ مُقَلِّصَةٌ
second: فِي ذَعَاعِ النَّخْلِ تَجْتَرِمُهْ
vocabulary:
- term: عَذَارِيكُمْ
  text: فتياتكم الأبكار.
- term: مُقَلِّصَةٌ
  text: 'مشمّرة ثيابها؛ «وتقلّص هو: تشمّر» [@lisan، ج7 ص80].'
- term: ذَعَاعِ النَّخْلِ
  text: «ما تفرّق من النخل» [@lisan، ج8 ص98].
- term: تَجْتَرِمُهْ
  text: 'تقطع ثمره؛ «وجرم النخل والتمر ... واجترمه: صرمه» [@lisan، ج12 ص90].'
