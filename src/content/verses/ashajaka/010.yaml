explained: false
first: وَعَذَارِيكُمْ مُقَلِّصَةٌ
second: فِي دُعَاعِ النَّخْلِ تَجْتَرِمُهْ
vocabulary:
- term: عَذَارِيكُمْ
  text: فتياتكم الأبكار.
- term: مُقَلِّصَةٌ
  text: 'مشمّرة ثيابها؛ «وتقلّص هو: تشمّر» [@lisan، ج7 ص80].'
- term: دُعَاعِ النَّخْلِ
  text: 'الدُّعاع عند الأعلم «نبت سوء يأكلونه، وأراد به هنا: رديء التمر» [@diwan-tarafa، ص84].'
- term: تَجْتَرِمُهْ
  text: 'تقطع ثمره؛ «وجرم النخل والتمر ... واجترمه: صرمه» [@lisan، ج12 ص90].'
