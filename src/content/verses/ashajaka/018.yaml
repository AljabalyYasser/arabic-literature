explained: false
first: وَقِتَالٍ لَا يُغِبُّكُمُ
second: فِي جَمِيعٍ جَحْفَلٍ لَهِمُهْ
vocabulary:
- term: لَا يُغِبُّكُمُ
  text: لا يترككم يومًا؛ من «أغبّ القوم» إذا «جاء يومًا وترك يومًا» [@lisan، ج1 ص636].
- term: جَمِيعٍ
  text: جيش مجتمع.
- term: جَحْفَلٍ
  text: الجيش الكثير.
- term: لَهِمُهْ
  text: 'من «لَهِم الشيءَ» إذا ابتلعه بمرة؛ و«جيش لُهام: كثير يلتهم كل شيء» [@lisan، ج12 ص554].'
