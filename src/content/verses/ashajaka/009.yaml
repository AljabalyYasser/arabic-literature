first: أَنْتُمُ نَخْلٌ نُطِيفُ بِهِ
second: فَإِذَا مَا جَزَّ نَصْطَرِمُهْ
vocabulary:
- term: نُطِيفُ بِهِ
  text: نطوف حوله.
- term: جَزَّ
  text: 'حان قطع ثمره؛ «وجَزَّ النخلُ وأَجَزَّ: حان أن يُجَزَّ أي يُقطع ثمره» [@lisan، ج5 ص321].'
- term: نَصْطَرِمُهْ
  text: نقطع ثمره ونجنيه.
