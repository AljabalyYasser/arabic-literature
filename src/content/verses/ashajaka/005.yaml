explained: false
first: فَالْكَثِيبُ مُعْشِبٌ أُنُفٌ
second: فَتَنَاهِيهِ فَمُرْتَكَمُهْ
vocabulary:
- term: الْكَثِيبُ
  text: التلّ من الرمل.
- term: أُنُفٌ
  text: 'لم يُرْعَ بعد؛ «وروضة أُنُف، بالضم: لم يرعها أحد» [@lisan، ج9 ص14].'
- term: تَنَاهِيهِ
  text: أطرافه حيث ينتهي.
- term: مُرْتَكَمُهْ
  text: حيث يتراكم رمله؛ «وارتكم الشيء وتراكم إذا اجتمع» [@lisan، ج12 ص251].
