first: وَالْقَرَارُ بَطْنُهُ غَدَقٌ
second: زَيَّنَتْ جَلْهَاتِهِ أَكَمُهْ
vocabulary:
- term: الْقَرَارُ
  text: المستقرّ المطمئن من الأرض.
- term: غَدَقٌ
  text: كثير الماء.
- term: جَلْهَاتِهِ
  text: نواحيه؛ «الجلهتان ناحيتا الوادي وحرفاه إذا كانت فيهما صلابة» [@lisan، ج13 ص486].
- term: أَكَمُهْ
  text: تلاله، جمع أَكَمة.
