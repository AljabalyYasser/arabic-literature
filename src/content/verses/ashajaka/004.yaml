first: جَعَلَتْهُ حَمَّ كَلْكَلِهَا
second: لِرَبِيعٍ دِيمَةٌ تَثِمُهْ
vocabulary:
- term: حَمَّ
  text: 'معظم؛ «وحَمُّ الشيء: معظمه» [@lisan، ج12 ص153].'
- term: كَلْكَلِهَا
  text: صدرها.
- term: دِيمَةٌ
  text: مطر يدوم أيامًا في سكون.
- term: تَثِمُهْ
  text: 'تضربه وتدقّه؛ «والمطر يثم الأرض وَثْمًا: يضربها» [@lisan، ج12 ص629].'
