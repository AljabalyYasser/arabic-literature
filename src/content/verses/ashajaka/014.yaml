explained: false
first: أَخَذَ الْأَزْلَامَ مُقْتَسِمًا
second: فَأَتَى أَغْوَاهُمَا زُلَمُهْ
vocabulary:
- term: الْأَزْلَامَ
  text: 'القداح التي كانوا يستقسمون بها في الجاهلية: إن خرج قدح الأمر مضى الرجل لما عزم عليه، «وإن خرج قدح النهي قعد عما أراده» [@lisan، ج12 ص270].'
- term: مُقْتَسِمًا
  text: مستقسمًا بها، أي يطلب بها معرفة ما قُسم له.
- term: أَغْوَاهُمَا
  text: أشدّهما إضلالًا.
- term: زُلَمُهْ
  text: قِدْحه، واحد الأزلام.
