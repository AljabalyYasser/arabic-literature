first: كَسُطُورِ الرَّقِّ رَقَّشَهُ
second: بِالضُّحَى مُرَقِّشٌ يَشِمُهْ
vocabulary:
- term: الرَّقِّ
  text: جلد رقيق يُكتب فيه.
- term: رَقَّشَهُ
  text: 'زيّنه بالخط والنقط؛ و«الرقش والترقيش: الكتابة والتنقيط» [@lisan، ج6 ص305].'
- term: يَشِمُهْ
  text: ينقشه، من الوَشْم.
