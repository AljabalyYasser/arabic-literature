explained: false
first: رِزُّهُ قَدِّمْ وَهَبْ وَهَلَا
second: ذِي زُهَاءٍ جَمَّةٍ بُهَمُهْ
vocabulary:
- term: رِزُّهُ
  text: 'صوته؛ «والرِّزّ، بالكسر: الصوت» [@lisan، ج5 ص353].'
- term: قَدِّمْ وَهَبْ وَهَلَا
  text: 'أصوات تُزجر بها الخيل؛ و«هلا: زجر للخيل» [@lisan، ج15 ص363].'
- term: زُهَاءٍ
  text: 'عدد كثير؛ «وزُهاء الشيء وزِهاؤه: قدره» [@lisan، ج14 ص363].'
- term: بُهَمُهْ
  text: فرسانه الشجعان، جمع بُهْمة.
