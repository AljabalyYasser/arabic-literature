first: "إِذَا كَانَ الشِّتَاءُ فَأَدْفِئُونِي"
second: "فَإِنَّ الشَّيْخَ يَهْدِمُهُ الشِّتَاءُ"
vocabulary:
  - term: "فَأَدْفِئُونِي"
    text: "«سخنوني لأدفأ»، أي دثّروني بالثياب [@khizana، ج7 ص382]."
  - term: "يَهْدِمُهُ"
    text: "يسقطه كما يسقط البناء؛ فهذا الفصل «يضعف قوة الشيخ ويهدم عمره» [@khizana، ج7 ص382–383]."
