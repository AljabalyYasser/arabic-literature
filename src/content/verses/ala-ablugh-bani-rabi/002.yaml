first: "بِأَنِّي قَدْ كَبِرْتُ وَدَقَّ عَظْمِي"
second: "فَلَا تَشْغَلْكُمُ عَنِّي النِّسَاءُ"
vocabulary:
  - term: "وَدَقَّ عَظْمِي"
    text: "صار دقيقًا، خلاف غلظ، ويُروى «وَرَقَّ جِلْدِي» [@khizana، ج7 ص381]."
  - term: "عَنِّي"
    text: "يقول البغدادي: «أي: عن تفقد ... أموري وإصلاحها» [@khizana، ج7 ص381–382]."
