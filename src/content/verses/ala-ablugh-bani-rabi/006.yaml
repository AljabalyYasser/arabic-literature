explained: false
first: "إِذَا عَاشَ الْفَتَى مِئَتَيْنِ عَامًا"
second: "فَقَدْ ذَهَبَ اللَّذَاذَةُ وَالْفَتَاءُ"
vocabulary:
  - term: "مِئَتَيْنِ عَامًا"
    text: "والقياس أن يقول: مِئَتَيْ عَامٍ، بالإضافة، فأثبت النون ونصب ما بعدها ضرورة؛ ويقول الأعلم فيما ينقله البغدادي: «الشاهد فيه إثبات النون في مائتين في ضرورة ونصب ما بعدها» [@khizana، ج7 ص380]."
  - term: "وَالْفَتَاءُ"
    text: "الشباب، «والفتاء: مصدر لفتى» [@khizana، ج7 ص380]."
