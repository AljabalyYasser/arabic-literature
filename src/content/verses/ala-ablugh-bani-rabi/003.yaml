explained: false
first: "فَإِنَّ كَنَائِنِي لَنِسَاءُ صِدْقٍ"
second: "وَمَا أَلَّى بَنِيَّ وَمَا أَسَاءُوا"
vocabulary:
  - term: "كَنَائِنِي"
    text: "«جمع كنة بالفتح والتشديد وهي امرأة الابن والأخ» [@khizana، ج7 ص382]."
  - term: "وَمَا أَلَّى"
    text: "«أي: ما أبطؤوا وما قصروا» [@khizana، ج7 ص382]. ويروي أبو حاتم عن أبي عمرو الشيباني أنه سئل عنها فقال: «أبطؤوا» [@khizana، ج7 ص382]."
