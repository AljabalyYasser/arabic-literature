first: "لَهُ رَتَبٌ عَالٍ عَلَى النَّاسِ كُلِّهِمْ"
second: "تَقَاصَرَ عَنْهُ سَوْرَةُ الْمُتَطَاوِلِ"
vocabulary:
  - term: "رَتَبٌ … سَوْرَةُ"
    text: "«الرتب: مَا ارْتَفع من الأَرْض وَعلا. وَيُرِيد بِهِ هُنَا الشّرف وَالْمجد. وَالسورَة (بِفَتْح السِّين) : الوثبة. (وبضم السِّين) : الْمنزلَة» [@ibn-hisham، ج2 ص306، الحاشية]."
