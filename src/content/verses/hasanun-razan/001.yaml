explained: false
first: "حَصَانٌ رَزَانٌ مَا تُزَنُّ بِرِيبَةٍ"
second: "وَتُصْبِحُ غَرْثَى مِنْ لُحُومِ الْغَوَافِلِ"
vocabulary:
  - term: "حَصَانٌ رَزَانٌ … تُزَنُّ … غَرْثَى"
    text: "«الحصان: العفيفة. والرزان: الْمُلَازمَة موضعهَا، الَّتِي لَا تتصرف كثيرا. وَمَا تزن: أَي مَا تتهم. وغرثى: جائعة» [@ibn-hisham، ج2 ص306، الحاشية]."
  - term: "غَرْثَى مِنْ لُحُومِ الْغَوَافِلِ"
    text: "«أَي خميصة الْبَطن من لُحُوم النَّاس: أَي اغتيابهم» [@ibn-hisham، ج2 ص307، الحاشية]. وفي شرح صحيح مسلم: «معناه لا تغتاب الناس، لأنها لو اغتابتهم شبعت من لحومهم» [@muslim، ج4 ص1934، الحاشية]."
