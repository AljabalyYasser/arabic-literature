first: وَوَطِئْتَنَا وَطْئًا عَلَى حَنَقٍ
second: وَطْءَ الْمُقَيَّدِ نَابِتَ الْهَرْمِ
vocabulary:
- term: وَطِئْتَنَا
  text: 'أخذتنا أخذًا شديدًا؛ «والوطأة: الأخذة الشديدة» [@lisan، ج1 ص197].'
- term: حَنَقٍ
  text: غيظ.
- term: الْمُقَيَّدِ
  text: البعير المشدود بالقيد.
- term: الْهَرْمِ
  text: «ضرب من الحمض فيه ملوحة، وهو أذله وأشده انبساطًا على الأرض» [@lisan، ج12 ص607].
