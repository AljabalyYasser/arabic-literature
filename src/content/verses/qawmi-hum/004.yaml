first: أَنْ يَأْبُرُوا نَخْلًا لِغَيْرِهِمُ
second: وَالشَّيْءُ تَحْقِرُهُ وَقَدْ يَنْمِي
vocabulary:
- term: يَأْبُرُوا
  text: 'يُلقّحوا ويُصلحوا. قال ثعلب في البيت: «المعنى أنهم قد حالفوا أعداءهم ليستعينوا بهم على قوم آخرين، وزمن الإبار زمن تلقيح النخل وإصلاحه» [@lisan، ج4 ص3].'
- term: يَنْمِي
  text: يزيد ويكبر.
