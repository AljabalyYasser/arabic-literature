explained: false
first: فَلَئِنْ عَفَوْتُ لَأَعْفُوَنْ جَلَلًا
second: وَلَئِنْ سَطَوْتُ لَأُوهِنَنْ عَظْمِي
vocabulary:
- term: جَلَلًا
  text: 'أمرًا عظيمًا. والجَلَل من الأضداد، يكون للعظيم وللهيّن، وهو هنا العظيم: «والجَلَل: الأمر العظيم»، وأورد صاحب «اللسان» هذا البيت عليه [@lisan، ج11 ص118].'
- term: سَطَوْتُ
  text: بطشتُ وانتقمت.
- term: لَأُوهِنَنْ عَظْمِي
  text: لأُضعِفنّ عظمي، أي نفسي، لأن قومه منه.
sources:
