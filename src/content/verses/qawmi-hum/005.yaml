first: وَزَعَمْتُمُ أَنْ لَا حُلُومَ لَنَا
second: إِنَّ الْعَصَا قُرِعَتْ لِذِي الْحِلْمِ
vocabulary:
- term: حُلُومَ
  text: عقول، جمع حِلْم.
- term: إِنَّ الْعَصَا قُرِعَتْ لِذِي الْحِلْمِ
  text: 'مثل: قد يُنبَّه الحليم إذا غفل. وذو الحلم عند الجاحِظ عامر بن الظَّرِب العَدْواني، حَكَم العرب في الجاهلية، «لما أسنّ واعتراه النسيان، أمر ابنته أن تقرع بالعصا إذا هو فهّ عن الحكم» [@bayan، ج3 ص26].'
