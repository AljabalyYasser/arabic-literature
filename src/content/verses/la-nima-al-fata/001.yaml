explained: false
first: لَنِعْمَ الْفَتَى تَعْشُو إِلَى ضَوْءِ نَارِهِ
second: طَرِيفُ بْنُ مَلْءٍ لَيْلَةَ الْجُوعِ وَالْخَصَرْ
vocabulary:
- term: تَعْشُو إِلَى
  text: تقصدها ليلًا؛ و«عشا إلى النار» ضدّ «عشا عنها»، «من باب الميل إلى الشيء والميل عنه» [@lisan، ج15 ص58].
- term: طَرِيفُ بْنُ مَلْءٍ
  text: رجل من طيئ يمدحه الشاعر، بحسب مقدمة القطعة في الديوان.
- term: الْخَصَرْ
  text: شدّة البرد.
