explained: false
first: لَنِعْمَ الْفَتَى تَعْشُو إِلَى ضَوْءِ نَارِهِ
second: طَرِيفُ بْنُ مَالٍ لَيْلَةَ الْجُوعِ وَالْخَصَرْ
vocabulary:
- term: تَعْشُو إِلَى
  text: تقصدها ليلًا؛ و«عشا إلى النار» ضدّ «عشا عنها»، «من باب الميل إلى الشيء والميل عنه» [@lisan، ج15 ص58].
- term: طَرِيفُ بْنُ مَالٍ
  text: طَرِيف بن مالك [@diwan-imru-al-qais، ص142]، حذف الكاف من «مالك» في غير النداء، وبه استشهد سِيبَوَيْه [@sibawayh، ج2 ص254].
- term: الْخَصَرْ
  text: شدّة البرد.
