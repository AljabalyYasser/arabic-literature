explained: false
first: إِذَا الْبَازِلُ الْكَوْمَاءُ رَاحَتْ عَشِيَّةً
second: تُلَاوِذُ مِنْ صَوْتِ الْمُبِسِّينَ بِالشَّجَرْ
vocabulary:
- term: الْبَازِلُ
  text: الناقة التي طلع نابها، وذلك في تاسع سنيها.
- term: الْكَوْمَاءُ
  text: العظيمة السنام.
- term: تُلَاوِذُ
  text: تلوذ وتستتر.
- term: الْمُبِسِّينَ
  text: 'الذين يدعونها للحلب، من «أَبَسَّ بالناقة: دعاها للحلب» [@lisan، ج6 ص27].'
