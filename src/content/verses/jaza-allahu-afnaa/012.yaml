explained: false
first: "وَأَجْرَدَ كَالسِّرْحَانِ يَضْرِبُهُ النَّدَى"
second: "وَمَحْبُوكَةً كَالسِّيدِ شَقَّاءَ صِلْدِمَا"
vocabulary:
  - term: "وَأَجْرَدَ"
    text: "يقول محققا «المفضليات»: «عطف على «خارجيا»، وهو الفرس القصير الشعر» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "كَالسِّرْحَانِ"
    text: "يقول محققا «المفضليات»: «الذئب» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "يَضْرِبُهُ النَّدَى"
    text: "يقول محققا «المفضليات»: «يصيبه المطر فهو يسرع إلى مأواه» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "وَمَحْبُوكَةً"
    text: "يقول محققا «المفضليات»: «الفرس التي حبك خلقها، أي فتل فتلا شديدا» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "كَالسِّيدِ"
    text: "يقول محققا «المفضليات»: «الذئب» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "صِلْدِمَا"
    text: "يقول محققا «المفضليات»: «الصلبة» [@mufaddaliyyat، ص66، الحاشية]."
