first: "أَمَا تَعْلَمُونَ اليَوْمَ حِلْفَ عُرَيْنَةٍ"
second: "وَحِلْفًا بِصَحْرَاءِ الشَّطُونِ وَمُقْسَمَا"
vocabulary:
  - term: "عُرَيْنَةٍ"
    text: "يقول محققا «المفضليات»: «هم بنو عرينة بن نذير بن قسر» [@mufaddaliyyat، ص68، الحاشية]."
  - term: "الشَّطُونِ"
    text: "يقول محققا «المفضليات»: «موضع» [@mufaddaliyyat، ص68، الحاشية]."
  - term: "وَمُقْسَمَا"
    text: "يقول محققا «المفضليات»: «مكان القسم، أو مصدر ميمي منه. أراد الشاعر بذلك تحذير قومه عاقبة الفرقة» [@mufaddaliyyat، ص68، الحاشية]."
