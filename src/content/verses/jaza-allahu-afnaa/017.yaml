first: "أَثَعْلَبَ لَوْ كُنْتُمْ مَوَالِيَ مِثْلِهَا"
second: "إِذًا لَمَنَعْنَا حَوْضَكُمْ أَنْ يُهَدَّمَا"
vocabulary:
  - term: "أَثَعْلَبَ"
    text: "يقول محققا «المفضليات»: «أراد: أثعلبة، فرخم، وهم بنو ثعلبة بن سعد بن ذبيان» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "مَوَالِيَ"
    text: "يقول محققا «المفضليات»: «الأولياء» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "حَوْضَكُمْ"
    text: "يقول محققا «المفضليات»: «أراد به هنا العز» [@mufaddaliyyat، ص66، الحاشية]."
