first: "صَفَائِحَ بُصْرَى أَخْلَصَتْهَا قُيُونُهَا"
second: "وَمُطَّرِدًا مِنْ نَسْجِ دَاوُدَ مُبْهَمَا"
vocabulary:
  - term: "صَفَائِحَ"
    text: "يقول محققا «المفضليات»: «سيوف عريضة» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "بُصْرَى"
    text: "يقول محققا «المفضليات»: «بلد تنسب إليه جياد السيوف» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "قُيُونُهَا"
    text: "يقول محققا «المفضليات»: «القين: الحداد والصيقل» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "وَمُطَّرِدًا"
    text: "يقول محققا «المفضليات»: «المتتابع الذي ليس فيه اختلاف» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "مُبْهَمَا"
    text: "يقول محققا «المفضليات»: «الذي لا ثلم فيه ولا خرق» [@mufaddaliyyat، ص66، الحاشية]."
