    text: "يقول محققا «المفضليات»: «القطع المكسرة من الرماح» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "خَبَارًا"
    text: "يقول محققا «المفضليات»: «الأرض اللينة فيها جحور» [@mufaddaliyyat، ص66، الحاشية]."
  - term: "تَجَشُّمَا"
    text: "يقول محققا «المفضليات»: «حمل النفس على المشقة وما تكره» [@mufaddaliyyat، ص66، الحاشية]."
