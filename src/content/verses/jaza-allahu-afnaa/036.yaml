first: "وَقَالُوا تَبَيَّنْ هَلْ تَرَى بَيْنَ ضَارِجٍ"
second: "وَنِهْيِ أَكُفٍّ صَارِخًا غَيْرَ أَعْجَمَا"
vocabulary:
