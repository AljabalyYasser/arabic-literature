    text: "يقول محققا «المفضليات»: «المغيث» [@mufaddaliyyat، ص69، الحاشية]."
  - term: "أَعْجَمَا"
    text: "يقول محققا «المفضليات»: «ما لا ينطق» [@mufaddaliyyat، ص69، الحاشية]."
