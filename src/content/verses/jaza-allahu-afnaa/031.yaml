first: "أَقِيمِي إِلَيْكِ عَبْدَ عَمْرٍو وَشَايِعِي"
second: "عَلَى كُلِّ مَاءٍ وَسْطَ ذُبْيَانَ خُيِّمَا"
vocabulary:
  - term: "عَبْدَ عَمْرٍو"
    text: "يقول محققا «المفضليات»: «عبد عمرو وعدوان: ابنا سهم بن مرة، وهم الذين نكصوا عنه» [@mufaddaliyyat، ص68، الحاشية]."
  - term: "خُيِّمَا"
    text: "يقول محققا «المفضليات»: «بالبناء لما لم يسم فاعله» [@mufaddaliyyat، ص68، الحاشية]."
