first: "مَوَالِي مَوَالِينَا الوِلَادَةُ مِنْهُمُ"
second: "وَمَوْلَى اليَمِينِ حَابِسًا مُتَقَسَّمَا"
vocabulary:
  - term: "مَوَالِي مَوَالِينَا ... وَمَوْلَى اليَمِينِ"
    text: "يقول محققا «المفضليات»: «قسم مواليه قسمين، موالي القرابة وهم بنو عمه، وموالي اليمين وهم حلفاؤه» [@mufaddaliyyat، ص65، الحاشية]."
  - term: "حَابِسًا مُتَقَسَّمَا"
    text: "يقول محققا «المفضليات»: «حالان من اليمين» [@mufaddaliyyat، ص65، الحاشية]."
