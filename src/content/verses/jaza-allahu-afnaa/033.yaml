    text: "يقول محققا «المفضليات»: «يعني عدوان بن سهم بن مرة» [@mufaddaliyyat، ص68، الحاشية]."
  - term: "مَا أَدَقَّ وَأَلْأَمَا"
    text: "يقول محققا «المفضليات»: «ما أدقهم وألأمهم. الدقة هنا: الخسة» [@mufaddaliyyat، ص68، الحاشية]."
