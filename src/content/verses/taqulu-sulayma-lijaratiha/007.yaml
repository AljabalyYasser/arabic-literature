explained: false
first: "عَلَى شَيْمِ نَارٍ تَنَوَّرْتُهَا"
second: "فَبِتُّ لَهَا مُدْبِرًا مُقْبِلَا"
vocabulary:
  - term: "شَيْمِ نَارٍ"
    text: "النظر إلى نار من بعيد، يقال: «شمت البرق» إذا نظرت إليه [@lisan، ج12 ص330]."
  - term: "تَنَوَّرْتُهَا"
    text: "نظرت إليها من بعيد."
  - term: "مُدْبِرًا مُقْبِلَا"
    text: "أذهب وأجيء متحيّراً."
