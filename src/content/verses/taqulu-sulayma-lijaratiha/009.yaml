first: "وَطَالَبْتُهَا بُضْعَهَا فَالْتَوَتْ"
second: "بِوَجْهٍ تَهَوَّلَ فَاسْتَغْوَلَا"
meaning: "فطلبتُ من الغول أن تمكّنني من نفسها، أي أن أجامعها، فأعرضت عني ولوت وجهها، وإذا وجهها يتلوّن في صورة مفزعة حتى صار وجه غول."
vocabulary:
  - term: "طَالَبْتُهَا"
    text: "طلبت منها وألححت في الطلب، على «فاعلت» الدالة على تكرار الطلب."
  - term: "بُضْعَهَا"
    text: "جماعها وفرجها، «البُضْعُ: النكاح؛ عن ابن السكيت. والمُباضَعةُ: المُجامَعةُ»، ويقال: ملك فلان بُضع فلانة «وهو كناية عن موضع الغِشْيان» [@lisan، ج8 ص14]."
  - term: "فَالْتَوَتْ"
    text: "انصرفت وأعرضت، يقال: «لويت عن هذا الأمر إذا التويت عنه» [@lisan، ج15 ص265]."
  - term: "تَهَوَّلَ"
    text: "أخذ صورة مخيفة، من الهَوْل وهو «المخافة من الأمر لا يدري ما يهجم عليه منه» [@lisan، ج11 ص711]، ويقال: «وتَهَوَّلَ للناقة تَهَوُّلاً: تشبَّه لها بالسبُع» [@lisan، ج11 ص712]."
  - term: "فَاسْتَغْوَلَا"
    text: "صار وجه غول، و«التَّغَوُّل: التَّلَوُّن»، و«تَغَوَّلت الغُول: تَخَيَّلَتْ وتَلَوَّنَتْ» [@lisan، ج11 ص507]."
context: "من قصيدة يروي فيها تأبّط شرًّا لقاءه الغول، وقد قدّم لها ابن قُتَيْبَة بقوله: «وذكر فى شعره أنه لقى الغول فقتلها، وجعل يصفها» [@ibn-qutayba، ج1 ص302]. بات الشاعر في الصحراء يتبع نارًا، فأصبح والغول جارته، فنادى «فيا جارتا أنت ما أهولا». ثم يأتي هذا البيت: يطلب منها ما يطلبه الرجل من المرأة، فتنكشف له صورتها المفزعة، وبعده يتحداها «فقلت لها يا انظري كي تري»، ثم يقتلها بسيفه. ويروي صاحب «الأغاني» هذا البيت مع البيت الذي قبله وبيت آخر من القصيدة [@aghani-dk، ج21 ص128]. والبيت صريح في طلب الجماع، وقد أثبتناه بتمامه وشرحناه كما يُشرح غيره."
syntax:
  - "«وطالبتُها» فعل وفاعل ومفعول، والواو عاطفة على ما قبلها."
  - "«بُضعَها» مفعول ثانٍ منصوب على نزع الخافض، والأصل: طالبتها ببُضعها."
  - "«فالتوتْ» الفاء للتعقيب: كان الإعراض بعد الطلب مباشرة."
  - "«بوجهٍ» متعلق بـ«التوت»، وجملة «تهوّل» صفة لـ«وجه»، و«فاستغولا» معطوفة عليها، وفاعلهما ضمير يعود على الوجه، والألف في آخره للإطلاق."
morphology:
  - "«استغول» على «استفعل» للتحوّل: صار غولًا، كما يقال: استحجر الطين إذا صار حجرًا."
  - "«تهوّل» على «تفعّل» للتكلّف والتشبّه: تكلّف الهول وتشبّه بما يُفزع، كما في «تهوّل للناقة» [@lisan، ج11 ص712]."
  - "«بُضع» على «فُعْل»، و«التوت» على «افتعلت» من «لوى»."
rhetoric:
  thesis: "يعامل الشاعر الغول كما يعامل امرأة يرغب فيها، فيطلب جسدها بلا خوف. وجوابها أن تكشف وجهها الحقيقي. فالبيت يجمع بين الجرأة والسخرية: الصعلوك لا يهاب حتى ما يهابه الناس جميعًا."
  devices:
    - title: "الكناية في «بُضعها»"
      text: "لم يذكر الفعل باسمه الصريح، بل ذكر البُضع، وهو في كلام العرب «كناية عن موضع الغِشْيان» [@lisan، ج8 ص14]. والكناية عند عبد القاهر أن يريد المتكلم إثبات معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه وردفه في الوجود» [@dalail، ص66]."
    - title: "الاشتقاق من الغول"
      text: "«فاستغولا» في هذا البيت، و«أغولا» في البيت الذي بعده، و«الغول» في البيت الذي قبله: ثلاث كلمات من أصل واحد. فإذا استغول وجهها قال إنه هو كان «لها أغولا»، أي أشد منها. وهذه قراءتنا."
    - title: "التحوّل في الصورة"
      text: "«تهوّل فاستغولا» فعلان متتابعان بالفاء، يصوّران الوجه وهو يتغير أمام الشاعر من وجه امرأة إلى وجه غول، وهو ما تقوله العرب في الغول: إنها «تَخَيَّلَتْ وتَلَوَّنَتْ» [@lisan، ج11 ص507]."
  connection: "ثم يتحداها: «فقلت لها يا انظري كي تري»، فتولّي، فيكون هو أشد منها."
prosody:
  meter: "بحر المتقارب"
  rhyme: "الرَّوِيّ اللام المفتوحة، وبعدها ألف الإطلاق، فهي لامية"
  scansion: "وَ طَا لَبْ / تُ هَا بُضْ / عَ هَا فَلْ / تَ وَتْ = فعولن / فعولن / فعولن / فعَلْ — بِ وَجْ هِنْ / تَ هَوْ وَ / لَ فَسْ تَغْ / وَ لَا = فعولن / فعولُ / فعولن / فعَلْ"
  note: "وزن المتقارب «فعولن» ثماني مرات. والعروض والضرب محذوفان «فعَلْ»، والحذف «حذف السبب الخفيف من آخر فعولن» [@atiq، ص121]. ودخل القبض، وهو «حذف الخامس الساكن، أي النون من فعولن فتصبح فعولُ» [@atiq، ص121]، التفعيلة الثانية من العجز «تَهَوْوَ». وسقطت همزة الوصل في «فالتوت» و«فاستغولا» في الدَّرْج."
variants:
  - reading: "فَطَالَبْتُهَا بُضْعَهَا فَالْتَوَتْ / عَلَيَّ وَحَاوَلْتُ أَنْ أَفْعَلَا"
    status: "رواية الأغاني"
    note: "[@aghani-dk، ج21 ص128]. وفسّر محققه البضع بقوله: «والبضع: الفرج»، فالمعنى فيها: أعرضت عني وأنا أحاول أن أفعل."
