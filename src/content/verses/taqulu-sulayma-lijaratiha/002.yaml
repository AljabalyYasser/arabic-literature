explained: false
first: "لَهَا الوَيْلُ مَا وَجَدَتْ ثَابِتًا"
second: "أَلَفَّ اليَدَيْنِ وَلَا زُمَّلَا"
vocabulary:
  - term: "لَهَا الوَيْلُ"
    text: "دعاء عليها."
  - term: "أَلَفَّ اليَدَيْنِ"
    text: "عاجزاً، و«ألفّ: عاجز، لا يقوم بحرب ولا ضيف» [@ukbari-lamiyya، ص80]."
  - term: "زُمَّلَا"
    text: "كسلان، «والزُّمَّل: الكسلان» [@lisan، ج11 ص311]."
