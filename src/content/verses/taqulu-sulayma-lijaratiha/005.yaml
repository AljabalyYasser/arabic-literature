explained: false
first: "وَأَدْهَمَ قَدْ جُبْتُ جِلْبَابَهُ"
second: "كَمَا اجْتَابَتِ الكَاعِبُ الخَيْعَلَا"
vocabulary:
  - term: "أَدْهَمَ"
    text: "ليل أسود."
  - term: "جُبْتُ جِلْبَابَهُ"
    text: "قطعت ظلامه، «وجاب المفازة والظلمة جوباً واجتابها: قطعها» [@lisan، ج1 ص285]."
  - term: "الكَاعِبُ"
    text: "الفتاة التي نهد ثديها."
  - term: "الخَيْعَلَا"
    text: "«الخيعل قميص لا كُمّي له» [@lisan، ج11 ص210]."
