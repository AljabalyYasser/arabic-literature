explained: false
first: "لَقَدْ ضَمِنَتْ بَنُو بَدْرِ بْنِ عَمْرٍو"
second: "وَلَا يُوفِي بِبِسْطَامٍ قَتِيلُ"
vocabulary:
  - term: "ضَمِنَتْ"
    text: "تحمّلت دمه."
  - term: "بَنُو بَدْرِ بْنِ عَمْرٍو"
    text: "من بني ضبّة قوم قاتله، وفي «النَّقائِض»: «بنو زيد بن عمرو» [@naqaid، ج2 ص410]."
  - term: "وَلَا يُوفِي بِبِسْطَامٍ قَتِيلُ"
    text: "لا يكون قتيل كفئًا لدم بِسْطام."
