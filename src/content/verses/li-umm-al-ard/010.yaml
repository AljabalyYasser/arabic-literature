explained: false
first: "بِمِطْعَامٍ إِذَا الأَشْوَالُ رَاحَتْ"
second: "إِلَى الحُجُرَاتِ لَيْسَ لَهَا فَصِيلُ"
vocabulary:
  - term: "مِطْعَامٍ"
    text: "كثير الإطعام."
  - term: "الأَشْوَالُ"
    text: "يقول محققا «الأصمعيات»: «جمع شول، وهي الإبل التي شالت ألبانها، أي ارتفعت» [@asmaiyyat، ص38، الحاشية]، أي جفّت في الجدب."
  - term: "الحُجُرَاتِ"
    text: "حظائر الإبل."
  - term: "فَصِيلُ"
    text: "ولد الناقة. لا فصيل لها لأنها لم تلد في سنة الجدب."
