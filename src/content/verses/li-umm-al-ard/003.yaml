explained: false
first: "أَجِدَّكَ لَنْ تَرَاهُ وَلَنْ تَرَاهُ"
second: "تَخُبُّ بِهِ عُذَافِرَةٌ ذَمُولُ"
vocabulary:
  - term: "أَجِدَّكَ"
    text: "أجادٌّ أنت؟ يستفهم متوجعًا."
  - term: "تَخُبُّ"
    text: "يقول محققا «الأصمعيات»: «تسير الخبب، وهو ضرب من السير» [@asmaiyyat، ص37، الحاشية]."
  - term: "عُذَافِرَةٌ"
    text: "يقول محققا «الأصمعيات»: «الشديدة الضخمة، أراد ناقة» [@asmaiyyat، ص37، الحاشية]."
  - term: "ذَمُولُ"
    text: "السريعة."
