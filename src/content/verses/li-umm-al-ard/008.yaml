explained: false
first: "وَخَرَّ عَلَى الأَلَاءَةِ لَمْ يُوَسَّدْ"
second: "كَأَنَّ جَبِينَهُ سَيْفٌ صَقِيلُ"
vocabulary:
  - term: "الأَلَاءَةِ"
    text: "يقول محققا «الأصمعيات»: «شجرة من شجر الرمل» [@asmaiyyat، ص37، الحاشية]."
  - term: "لَمْ يُوَسَّدْ"
    text: "لم توضع تحت رأسه وسادة، أي مات في العراء."
  - term: "صَقِيلُ"
    text: "مجلوّ لامع."
