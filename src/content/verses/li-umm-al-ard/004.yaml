explained: false
first: "حَقِيبَةُ رَحْلِهِ بَدَنٌ وَسَرْجٌ"
second: "تُعَارِضُهُ مُرَبَّبَةٌ ذَؤُولُ"
vocabulary:
  - term: "حَقِيبَةُ رَحْلِهِ"
    text: "ما يُشدّ خلف الرحل من متاع."
  - term: "بَدَنٌ"
    text: "يقول محققا «الأصمعيات»: «الدرع القصيرة، وكانوا يجعلون الدروع وراء رحالهم في الحقائب ليلبسوها عند الحرب» [@asmaiyyat، ص37، الحاشية]."
  - term: "مُرَبَّبَةٌ"
    text: "يقول محققا «الأصمعيات»: «التي يغذونها في بيوتهم، يعني الفرس» [@asmaiyyat، ص37، الحاشية]، تسير إلى جنب ناقته."
  - term: "ذَؤُولُ"
    text: "سريعة في خفة."
