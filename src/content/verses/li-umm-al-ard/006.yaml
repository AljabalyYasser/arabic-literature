explained: false
first: "لَكَ المِرْبَاعُ مِنْهَا وَالصَّفَايَا"
second: "وَحُكْمُكَ وَالنَّشِيطَةُ وَالفُضُولُ"
vocabulary:
  - term: "المِرْبَاعُ"
    text: "يقول محققا «الأصمعيات»: «ربع الغنيمة، كان الرئيس يأخذه في الجاهلية» [@asmaiyyat، ص37، الحاشية]."
  - term: "الصَّفَايَا"
    text: "يقول محققا «الأصمعيات»: «جمع صفية، وهي ما كان يصطفيه الرئيس لنفسه من خيار الغنيمة» [@asmaiyyat، ص37، الحاشية]."
  - term: "حُكْمُكَ"
    text: "ما تحكم به لنفسك."
  - term: "النَّشِيطَةُ"
    text: "يقول محققا «الأصمعيات»: «ما أصابه الجيش في طريقه قبل الغارة من فرس أو ناقة» [@asmaiyyat، ص37، الحاشية]."
  - term: "الفُضُولُ"
    text: "يقول محققا «الأصمعيات»: «ما فضل فلم ينقسم نحو الإداوة والسكين» [@asmaiyyat، ص37، الحاشية]."
