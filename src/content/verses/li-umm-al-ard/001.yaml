explained: false
first: "لِأُمِّ الأَرْضِ وَيْلٌ مَا أَجَنَّتْ"
second: "غَدَاةَ أَضَرَّ بِالحَسَنِ السَّبِيلُ"
vocabulary:
  - term: "لِأُمِّ الأَرْضِ وَيْلٌ"
    text: "تعجب وتوجّع، كأن الأرض أمّ يُدعى عليها بالويل لأنها ضمّت مثله."
  - term: "أَجَنَّتْ"
    text: "«سترت» كما يفسّرها محققا «الأصمعيات» [@asmaiyyat، ص36، الحاشية]."
  - term: "أَضَرَّ بِالحَسَنِ السَّبِيلُ"
    text: "يقول محققا «الأصمعيات»: «أضر به: دنا منه. الحسن: كثيب بنجد في بلاد بني ضبة في الموضع الذي قتل فيه بسطام» [@asmaiyyat، ص36، الحاشية]."
