explained: false
first: "رَأَيْتُ ذَوِي الْحَاجَاتِ حَوْلَ بُيُوتِهِمْ"
second: "قَطِينًا بِهَا حَتَّى إِذَا نَبَتَ الْبَقْلُ"
vocabulary:
  - term: "قَطِينًا"
    text: "«والقطين أيضًا: الساكن في الدار، النازل فيها. وأراد به ههنا: الساكن» [@diwan-zuhayr، ص42]."
  - term: "حَتَّى إِذَا نَبَتَ الْبَقْلُ"
    text: "«يعني: أنّ الفقراء يلزمون بيوت هؤلاء القوم، يعيشون في أموالهم، حتى يُخصب الناس، وينبت البقل» [@diwan-zuhayr، ص42]."
