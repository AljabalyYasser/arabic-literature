explained: false
first: "وَهَلْ يُنْبِتُ الْخَطِّيَّ إِلَّا وَشِيجُهُ"
second: "وَتُغْرَسُ إِلَّا فِي مَنَابِتِهَا النَّخْلُ"
vocabulary:
  - term: "الْخَطِّيَّ"
    text: "«الرمح، نسبه إلى الخطّ. وهي جزيرة بالبحرين ترفأ إليها سفن الرماح» [@diwan-zuhayr، ص44]. وترفأ: ترسو."
  - term: "وَشِيجُهُ"
    text: "«والوشيج: القنا الملتفّ في منبته. واحدته وشيجة» [@diwan-zuhayr، ص44]."
  - term: "إِلَّا فِي مَنَابِتِهَا النَّخْلُ"
    text: "«ولا تغرس النخل إلا بحيث تنبت وتصلح، وكذلك لا يولد الكرام إلا في موضع كريم» [@diwan-zuhayr، ص44]."
sources:
