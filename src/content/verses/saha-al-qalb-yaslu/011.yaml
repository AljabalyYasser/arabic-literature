first: "بِلَادٌ بِهَا نَادَمْتُهُمْ وَأَلِفْتُهُمْ"
second: "فَإِنْ تُقْوِيَا مِنْهُمْ فَإِنَّهُمَا بَسْلُ"
vocabulary:
