    text: "يعني مُحجَّرًا وجزع الحسا: «إن خلتا من هؤلاء القوم فهما حرام عليّ، لا أقربهما» [@diwan-zuhayr، ص34]."
  - term: "بَسْلُ"
    text: "«و«البسل»: الحرام» [@diwan-zuhayr، ص34]."
