explained: false
first: "عَلَيْهَا أُسُودٌ ضَارِيَاتٌ لَبُوسُهُمْ"
second: "سَوَابِغُ بِيضٌ لَا تُخَرِّقُهَا النَّبْلُ"
vocabulary:
  - term: "ضَارِيَاتٌ"
    text: "معتادة على الصيد والافتراس."
  - term: "لَبُوسُهُمْ"
    text: "«ما يلبسه الإنسان ... وأراد به الدروع» [@diwan-zuhayr، ص36]."
  - term: "سَوَابِغُ بِيضٌ"
    text: "«و«السوابغ»: الكاملة. وأراد بـ«البيض» أنها صقيلة لم تصدأ» [@diwan-zuhayr، ص36]."
