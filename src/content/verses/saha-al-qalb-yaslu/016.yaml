explained: false
first: "إِذَا لَقِحَتْ حَرْبٌ عَوَانٌ مُضِرَّةٌ"
second: "ضَرُوسٌ تُهِرُّ النَّاسَ أَنْيَابُهَا عُصْلُ"
vocabulary:
  - term: "لَقِحَتْ"
    text: "«أي: حملت. ومعناه: اشتدّت وقويت» [@diwan-zuhayr، ص36]."
  - term: "عَوَانٌ"
    text: "«الحرب التي ليست بأولى، وهي الحرب التي قوتل فيها مرّة بعد مرّة» [@diwan-zuhayr، ص36]."
  - term: "مُضِرَّةٌ"
    text: "في الشرح المنسوب إلى ثَعْلَب عن أبي عمرو بن العلاء: «قال زهير: «حرب مضرّة» ولو كان إليّ لقلت: «حرب مُصِرّة» أي: تعتزم وتمضي» [@sharh-thalab-zuhayr، ص88]."
  - term: "ضَرُوسٌ"
    text: "«العضوض السيّئة الخلق» [@diwan-zuhayr، ص36]."
  - term: "تُهِرُّ النَّاسَ"
    text: "«أي: تصيّرهم يهرّونها، أي يكرهونها» [@diwan-zuhayr، ص36]."
  - term: "عُصْلُ"
    text: "«الكالحة المعوجّة»، «لأنّ ناب البعير إنما يعصل إذا أسنّ» [@diwan-zuhayr، ص36]."
sources:
