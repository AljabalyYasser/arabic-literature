first: "قُضَاعِيَّةٌ أَوْ أُخْتُهَا مُضَرِيَّةٌ"
second: "يُحَرَّقُ فِي حَافَاتِهَا الْحَطَبُ الْجَزْلُ"
vocabulary:
  - term: "قُضَاعِيَّةٌ أَوْ أُخْتُهَا مُضَرِيَّةٌ"
    text: "«نسب الحرب إلى قضاعة. ويقال: قضاعة بن معدّ، ومضر بن نزار بن معدّ. فلذلك قال «أو أختها مضرية»» [@diwan-zuhayr، ص36]."
  - term: "حَافَاتِهَا"
    text: "جوانبها."
  - term: "الْجَزْلُ"
    text: "«ما غلظ من الحطب» [@diwan-zuhayr، ص36]."
