explained: false
first: "وَفِيهِمْ مَقَامَاتٌ حِسَانٌ وُجُوهُهُمْ"
second: "وَأَنْدِيَةٌ يَنْتَابُهَا الْقَوْلُ وَالْفِعْلُ"
vocabulary:
  - term: "مَقَامَاتٌ"
    text: "«المجالس. سمّيت بذلك، لأنّ الرجل كان يقوم في المجلس، فيحضّ على الخير، ويصلح بين الناس. وأراد بالمقامات أهلها» [@diwan-zuhayr، ص42]."
  - term: "أَنْدِيَةٌ"
    text: "«جمع نديّ، وهو المجلس والمتحدَّث» [@diwan-zuhayr، ص42]."
  - term: "يَنْتَابُهَا"
    text: "«أي: يقصدها» [@diwan-zuhayr، ص42]."
