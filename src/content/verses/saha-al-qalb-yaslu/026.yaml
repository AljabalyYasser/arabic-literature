explained: false
first: "بِلَادٌ بِهَا عَزُّوا مَعَدًّا وَغَيْرَهَا"
second: "مَشَارِبُهَا عَذْبٌ وَأَعْلَامُهَا ثَمْلُ"
vocabulary:
  - term: "عَزُّوا مَعَدًّا"
    text: "«أي: غلبوها في العزّ، وظهروا عليها» [@diwan-zuhayr، ص39]."
  - term: "أَعْلَامُهَا ثَمْلُ"
    text: "«و«الأعلام»: الجبال. و«الثَّمْل»: التي يقام فيها» [@diwan-zuhayr، ص39]، أي يطيب فيها المقام."
sources:
