first: "يَحُشُّونَهَا بِالْمَشْرَفِيَّةِ وَالْقَنَا"
second: "وَفِتْيَانِ صِدْقٍ لَا ضِعَافٌ وَلَا نُكْلُ"
vocabulary:
  - term: "يَحُشُّونَهَا"
    text: "«يوقدونها. وهذا مثل، وإنما يريد: يقوّون الحرب ويهيّجونها كما تُحشّ النار وتقوّى» [@diwan-zuhayr، ص37]."
  - term: "الْمَشْرَفِيَّةِ"
    text: "«السيوف» [@diwan-zuhayr، ص37]."
  - term: "نُكْلُ"
    text: "«الجبناء. واحدهم ناكل» [@diwan-zuhayr، ص37]."
