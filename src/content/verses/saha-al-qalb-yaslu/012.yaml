explained: false
first: "إِذَا فَزِعُوا طَارُوا إِلَى مُسْتَغِيثِهِمْ"
second: "طِوَالَ الرِّمَاحِ لَا ضِعَافٌ وَلَا عُزْلُ"
vocabulary:
  - term: "فَزِعُوا"
    text: "هنا بمعنى أغاثوا: «أي: أغاثوا مستصرخًا مستغيثًا بهم» [@diwan-zuhayr، ص35]."
  - term: "طِوَالَ الرِّمَاحِ"
    text: "كناية عن القوة: «لأنّ الرمح الطويل الكامل لا يكاد يستعمله إلا الكامل الخَلق الشديد القوة» [@diwan-zuhayr، ص35]."
  - term: "عُزْلُ"
    text: "«جمع أعزل. وهو الذي لا سلاح معه» [@diwan-zuhayr، ص35]."
