first: "تَأَوَّبَنِي ذِكْرُ الْأَحِبَّةِ بَعْدَمَا"
second: "هَجَعْتُ وَدُونِي قُلَّةُ الْحَزْنِ فَالرَّمْلُ"
vocabulary:
