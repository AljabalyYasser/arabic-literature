    text: "«أي: أتاني مع الليل» [@diwan-zuhayr، ص33]."
  - term: "هَجَعْتُ"
    text: "نمت ليلًا."
  - term: "قُلَّةُ الْحَزْنِ"
    text: "«و«القلّة»: أعلى الجبل. و«الحزن»: ما غلظ من الأرض» [@diwan-zuhayr، ص33]."
