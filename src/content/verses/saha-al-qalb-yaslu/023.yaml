explained: false
first: "هُمُ جَدَّدُوا أَحْكَامَ كُلِّ مُضِلَّةٍ"
second: "مِنَ الْعُقْمِ لَا يُلْفَى لِأَمْثَالِهَا فَصْلُ"
vocabulary:
  - term: "مُضِلَّةٍ"
    text: "«حرب تُضلّ الناس، أو يُضلّ فيها، فلا يوجد من يفصل أمرها» [@diwan-zuhayr، ص39]."
  - term: "الْعُقْمِ"
    text: "«الحروب الشديدة. واحدتها عقيم. وأصل العقيم: التي لا تلد» [@diwan-zuhayr، ص39]، كأنها تهلك أهلها فلا تخلّف أحدًا."
  - term: "لَا يُلْفَى"
    text: "لا يوجد."
