first: "وَلَسْتُ بِلَاقٍ بِالْحِجَازِ مُجَاوِرًا"
second: "وَلَا سَفَرًا إِلَّا لَهُ مِنْهُمُ حَبْلُ"
vocabulary:
  - term: "سَفَرًا"
    text: "«أراد: ولا صاحب سفر، فحذف لعلم السامع» [@diwan-zuhayr، ص39]. وفي الشرح المنسوب إلى ثَعْلَب: «وسَفْر: قوم على سفر»، «ويروى: «بالحجاز مسافرًا، ولا سفرًا»» [@sharh-thalab-zuhayr، ص91]."
  - term: "حَبْلُ"
    text: "«العهد والذمّة» [@diwan-zuhayr، ص39]."
