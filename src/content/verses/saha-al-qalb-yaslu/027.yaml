first: "هُمُ خَيْرُ حَيٍّ مِنْ مَعَدٍّ عَلِمْتُهُمْ"
second: "لَهُمْ نَائِلٌ فِي قَوْمِهِمْ وَلَهُمْ فَضْلُ"
vocabulary:
  - term: "نَائِلٌ فِي قَوْمِهِمْ"
    text: "عطاء، «يعني: أنهم يصلون الرحم، وينعطفون على القرابة» [@diwan-zuhayr، ص40]."
  - term: "فَضْلُ"
    text: "«أي: تفضّل على غير قومهم، ونوافل لا تجب عليهم» [@diwan-zuhayr، ص40]."
