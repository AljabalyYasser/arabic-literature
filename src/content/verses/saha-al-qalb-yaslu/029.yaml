first: "رَأَى اللَّهُ بِالْإِحْسَانِ مَا فَعَلَا بِكُمْ"
second: "فَأَبْلَاهُمَا خَيْرَ الْبَلَاءِ الَّذِي يَبْلُو"
vocabulary:
  - term: "رَأَى اللَّهُ بِالْإِحْسَانِ"
    text: "«يقول: رأى الله فعلهما حسنًا»، وهو عند الأعلم «يحتمل أن يكون دعاء، ويحتمل أن يكون خبرًا» [@diwan-zuhayr، ص40]. وروى أبو عمرو: «جَزَى اللَّهُ بِالْإِحْسَانِ» [@sharh-thalab-zuhayr، ص91]."
  - term: "فَأَبْلَاهُمَا خَيْرَ الْبَلَاءِ"
    text: "«أي: صنع الله بهما خير الصنع، الذي يبتلي به عباده». «وإنما قال «خير البلاء» لأنّ الله تعالى يُبلي بالخير والشرّ» [@diwan-zuhayr، ص40]."
