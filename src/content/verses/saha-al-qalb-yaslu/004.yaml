explained: false
first: "وَكُلُّ مُحِبٍّ أَحْدَثَ النَّأْيُ عِنْدَهُ"
second: "سُلُوَّ فُؤَادٍ غَيْرَ حُبِّكِ مَا يَسْلُو"
vocabulary:
  - term: "النَّأْيُ"
    text: "البعد."
  - term: "غَيْرَ حُبِّكِ مَا يَسْلُو"
    text: "«يقول: كلّ محبّ إذا نأى سلا، ولستُ أنا كذلك». وقد قال «صحا» في أول القصيدة، فيذكر الأعلم فيه قولين: «قال بعضهم: رجع فأكذب نفسه»، «وقال بعضهم: لم يكذب نفسه، وإنما هو متعلق بقوله «وقد كنت من سلمى»» [@diwan-zuhayr، ص32]، أي إن حبه لم يسلُ في تلك السنين الثماني."
sources:
