explained: false
first: "هُمُ ضَرَبُوا عَنْ فَرْجِهَا بِكَتِيبَةٍ"
second: "كَبَيْضَاءِ حَرْسٍ فِي طَوَائِفِهَا الرَّجْلُ"
vocabulary:
  - term: "فَرْجِهَا"
    text: "«و«الفرج» والثغر واحد. وهو الموضع الذي يُتّقى منه العدوّ» [@diwan-zuhayr، ص38]."
  - term: "كَبَيْضَاءِ حَرْسٍ"
    text: "«و«حرس»: جبل. و«بيضاؤه»: شمراخ منه طويل، شبّه الكتيبة به في عظمها» [@diwan-zuhayr، ص38]. والشمراخ: رأس الجبل."
  - term: "طَوَائِفِهَا الرَّجْلُ"
    text: "«والطوائف: النواحي. والرَّجْل: الرجّالة» [@diwan-zuhayr، ص38]، أي المشاة."
sources:
  - source: "diwan-zuhayr"
    loc: "ص38"
    url: "https://archive.org/details/3917pdf/page/n38/mode/1up"
