explained: false
first: "سَعَى بَعْدَهُمْ قَوْمٌ لِكَيْ يُدْرِكُوهُمُ"
second: "فَلَمْ يَفْعَلُوا وَلَمْ يُلِيمُوا وَلَمْ يَأْلُوا"
vocabulary:
  - term: "لَمْ يُلِيمُوا"
    text: "«أي: لم يأتوا ما يلامون عليه، حين لم يبلغوا منزلة هؤلاء، لأنها أعلى من أن تُبلغ» [@diwan-zuhayr، ص44]."
  - term: "لَمْ يَأْلُوا"
    text: "«أي: لم يقصّروا في السعي بجميل الفعل» [@diwan-zuhayr، ص44]."
