explained: false
first: "إِذَا السَّنَةُ الشَّهْبَاءُ بِالنَّاسِ أَجْحَفَتْ"
second: "وَنَالَ كِرَامَ الْمَالِ فِي الْجَحْرَةِ الْأَكْلُ"
vocabulary:
  - term: "السَّنَةُ الشَّهْبَاءُ"
    text: "«يعني: البيضاء من الجدب، لكثرة الثلج، وعدم النبات» [@diwan-zuhayr، ص41]."
  - term: "أَجْحَفَتْ"
    text: "«أضرّت بهم وأهلكت أموالهم» [@diwan-zuhayr، ص41]."
  - term: "نَالَ كِرَامَ الْمَالِ ... الْأَكْلُ"
    text: "«أي: أنهم لا يجدون لبنًا، فينحرون الإبل» [@diwan-zuhayr، ص41]."
  - term: "الْجَحْرَةِ"
    text: "«السنة الشديدة البرد، التي تُجحر الناس في البيوت» [@diwan-zuhayr، ص41]."
sources:
  - source: "diwan-zuhayr"
    loc: "ص41"
