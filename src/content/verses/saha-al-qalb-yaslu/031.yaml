first: "فَأَصْبَحْتُمَا مِنْهَا عَلَى خَيْرِ مَوْطِنٍ"
second: "سَبِيلُكُمَا فِيهِ وَإِنْ أَحْزَنُوا سَهْلُ"
vocabulary:
  - term: "عَلَى خَيْرِ مَوْطِنٍ"
    text: "«لما نلتما من الحمد وشرف المنزلة» [@diwan-zuhayr، ص41]."
  - term: "أَحْزَنُوا"
    text: "«أي: وقعوا في أمر شديد، وأصله من الحَزْن، وهو ما غلظ من الأرض» [@diwan-zuhayr، ص41]."
