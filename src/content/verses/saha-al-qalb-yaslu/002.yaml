explained: false
first: "وَقَدْ كُنْتُ مِنْ سَلْمَى سِنِينَ ثَمَانِيًا"
second: "عَلَى صِيرِ أَمْرٍ مَا يَمُرُّ وَمَا يَحْلُو"
vocabulary:
  - term: "عَلَى صِيرِ أَمْرٍ"
    text: "«أي: على طرف أمر ومنتهاه، وما يصير إليه» [@diwan-zuhayr، ص31]."
  - term: "مَا يَمُرُّ وَمَا يَحْلُو"
    text: "«لم يكن الأمر الذي بيني وبينها مرًّا فأيأس منه، ولا حلوًا فأرجوه» [@diwan-zuhayr، ص31]: لا هي تقطعه فييأس، ولا تصله فيهدأ."
sources:
