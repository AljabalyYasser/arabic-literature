explained: false
first: "تَجِدْهُمْ عَلَى مَا خَيَّلَتْ هُمْ إِزَاءَهَا"
second: "وَإِنْ أَفْسَدَ الْمَالَ الْجَمَاعَاتُ وَالْأَزْلُ"
vocabulary:
  - term: "عَلَى مَا خَيَّلَتْ"
    text: "«أي: على ما شبّهت. ومعناه: على كلّ حال» [@diwan-zuhayr، ص37]."
  - term: "إِزَاءَهَا"
    text: "«أي: الذين يقومون بها، أي: تجدهم مدبّريها والسائسين لها» [@diwan-zuhayr، ص37]."
  - term: "الْجَمَاعَاتُ وَالْأَزْلُ"
    text: "«وإنما أراد بـ«الجماعات»: أن يجتمعوا في مكان واحد، من أجل الحرب، ولا تخرج إبلهم للرعي». «و«الأزل»: أن يُحبس المال، ولا يُرسل للرعي. والمال عند العرب الإبل» [@diwan-zuhayr، ص37]."
