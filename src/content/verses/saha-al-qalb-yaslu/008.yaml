first: "إِلَى مَعْشَرٍ لَمْ يُورِثِ اللُّؤْمَ جَدُّهُمْ"
second: "أَصَاغِرَهُمْ وَكُلُّ فَحْلٍ لَهُ نَجْلُ"
vocabulary:
  - term: "لَمْ يُورِثِ اللُّؤْمَ جَدُّهُمْ"
    text: "«أي: كان جدهم كريمًا، فأورثهم الكرم» [@diwan-zuhayr، ص33]."
  - term: "نَجْلُ"
    text: "«و«النجل»: الولد والنسل بمعنى واحد». وبه «ضرب لذلك مثلًا»: «إذا كان الفحل جوادًا كان نسله كذلك» [@diwan-zuhayr، ص33]."
