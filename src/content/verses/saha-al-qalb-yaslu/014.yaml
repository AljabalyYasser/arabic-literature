explained: false
first: "وَإِنْ يُقْتَلُوا فَيُشْتَفَى بِدِمَائِهِمْ"
second: "وَكَانُوا قَدِيمًا مِنْ مَنَايَاهُمُ الْقَتْلُ"
vocabulary:
  - term: "فَيُشْتَفَى بِدِمَائِهِمْ"
    text: "«أي: هم أشراف، فإذا قُتلوا رضي القاتل بهم، وشفى نفسه بدمائهم» [@diwan-zuhayr، ص35]."
  - term: "مِنْ مَنَايَاهُمُ الْقَتْلُ"
    text: "«أي: هم أهل حروب، فلا يموتون على فرشهم» [@diwan-zuhayr، ص35]."
