first: "فَإِنْ تُقْوِيَا مِنْهُمْ فَإِنَّ مُحَجَّرًا"
second: "وَجِزْعَ الْحِسَا مِنْهُمْ إِذًا قَلَّمَا يَخْلُو"
vocabulary:
  - term: "مُحَجَّرًا"
    text: "«موضع» [@diwan-zuhayr، ص34]."
  - term: "جِزْعَ الْحِسَا"
    text: "«الجزع: منعطف الوادي». والحِسا «جمع حِسْي»، وهو ماء يُحفر عنه الرمل، «وقصره ضرورة». «ويروى: «وجزع الحشا»» [@diwan-zuhayr، ص34]."
