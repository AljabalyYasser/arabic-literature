explained: false
first: "وَرَأَوْا عُقَابَهُمُ المُدِلَّةَ أَصْبَحَتْ"
second: "نُبِذَتْ بِأَفْضَحَ ذِي مَخَالِبَ جَهْضَمِ"
vocabulary:
  - term: "عُقَابَهُمُ"
    text: "الراية، وكانت راية بني تميم على صورة العقاب، وراية بني أسد على صورة الأسد [@tabrizi-ikhtiyarat، ج3 ص1450]."
  - term: "المُدِلَّةَ"
    text: "التي تُدلّ على الأقران [@tabrizi-ikhtiyarat، ج3 ص1450]."
  - term: "بِأَفْضَحَ ... جَهْضَمِ"
    text: "رُميت بعلامتنا الأسدية، والفُضحة: شُهبة تعلوها حمرة، والجهضم: القوي الشديد [@tabrizi-ikhtiyarat، ج3 ص1450]."
