first: "زَيَّافَةٍ بِالرَّحْلِ صَادِقَةِ السُّرَى"
second: "خَطَّارَةٍ تَهِصُ الحَصَى بِمُثَلَّمِ"
vocabulary:
  - term: "زَيَّافَةٍ"
    text: "تزيف في مشيتها وعليها الرحل [@tabrizi-ikhtiyarat، ج3 ص1446]."
  - term: "تَهِصُ الحَصَى بِمُثَلَّمِ"
    text: "لصلابة مناسمها إذا وطئت الأرض تكسر الحصى وتدقّه [@tabrizi-ikhtiyarat، ج3 ص1446]، والمثلّم: الخفّ قد ثلمته الحجارة."
