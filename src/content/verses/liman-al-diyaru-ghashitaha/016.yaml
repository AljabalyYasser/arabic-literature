first: "أَقْصَدْنَ حُجْرًا قَبْلَ ذَلِكَ وَالقَنَا"
second: "شَرَعٌ إِلَيْهِ وَقَدْ أَكَبَّ عَلَى الفَمِ"
meaning: "وقتلت رماحنا حُجْرًا قبل ذلك، والرماح مُشرَعة إليه، وقد سقط على وجهه."
vocabulary:
  - term: "أَقْصَدْنَ"
    text: "قتلن [@tabrizi-ikhtiyarat، ج3 ص1451]، والإقصاد أن يصيب الرمح أو السهم المقتل. والنون للرماح أو للخيل."
  - term: "حُجْرًا"
    text: "«يعني حجر بن الحارث الملك بن عمرو، وقتله بنو أسد، وهو أبو امرئ القيس» [@tabrizi-ikhtiyarat، ج3 ص1451]."
  - term: "شَرَعٌ"
    text: "مُشرَعة مهيّأة للطعن، يقال: رماح شَرَعٌ، أي قد تهيأت للطعن [@tabrizi-ikhtiyarat، ج3 ص1451]."
  - term: "أَكَبَّ عَلَى الفَمِ"
    text: "سقط لوجهه [@tabrizi-ikhtiyarat، ج3 ص1451]."
context: "في آخر الفخر بيوم النِّسار يذكّر بِشْر خصومه بأن بني أسد قتلوا من هو أعظم منهم: حُجْر بن الحارث الكندي، الملك الذي كان على بني أسد، أبو امرئ القَيْس. وقتل بني أسد لحُجْر هو الذي أخرج امرأ القَيْس إلى طلب الثأر، والخبر في صفحة [امرئ القيس](/people/imru-al-qais/). وفي البيت الذي بعده يتمّ المشهد: «ينوي محاولة القيام وقد مضت فيه مخارص كل لدن لهذم»."
syntax:
  - "«أقصدْنَ» فعل ماض، ونون النسوة فاعل يعود على الرماح أو الخيل في الأبيات قبله، و«حُجرًا» مفعول به."
  - "«قبلَ» ظرف زمان منصوب، مضاف إلى «ذلك»، والإشارة إلى يوم النسار."
  - "الواو في «والقنا» واو الحال، و«القنا» مبتدأ مرفوع بضمة مقدرة، و«شَرَعٌ» خبره، و«إليه» متعلق بـ«شرع»."
  - "الواو في «وقد أكبّ» واو الحال، والجملة حال من «حجرًا»، و«على الفم» متعلق بـ«أكبّ»."
morphology:
  - "«أقصدن» ماض «أقصد» على «أفعل»، من القصد، والإقصاد: القتل في الحال."
  - "«القنا» جمع «قناة» اسم جنس جمعي، وهي الرمح."
  - "«شَرَع» مصدر وُصف به، فيستوي فيه الواحد والجمع."
  - "«أكبّ» ماض على «أفعل» من «كبّ»، وهو من الأفعال القليلة التي يكون الثلاثي منها متعديًا «كبّه» والمزيد لازمًا «أكبّ»."
rhetoric:
  thesis: "الفخر بقتل ملك: أعظم ما يفخر به بنو أسد أنهم قتلوا حُجْرًا، وبِشْر يذكره ليقول لتميم وعامر إن من قتل الملوك لا يهاب القبائل."
  devices:
    - title: "التصوير بالحال"
      text: "جملتان حاليتان ترسمان المشهد: الرماح مشرعة إليه، وهو ساقط على وجهه. فالقتل لا يُذكر خبرًا، بل يُرى صورة: ملك منكبّ على فمه والرماح فوقه."
    - title: "الإذلال في «أكبّ على الفم»"
      text: "لم يقل «سقط» بل «أكبّ على الفم»، وفيه إذلال: الملك الذي كان الناس يقولون له «أبيت اللعن» سقط على وجهه في التراب. وهذه قراءتنا."
    - title: "الإشارة إلى خبر معروف"
      text: "ذكر حجرًا باسمه وحده بلا نسب ولا لقب، لأن السامعين يعرفون الخبر كله. وفي رواية أخرى «أقصدن كعبًا»، وهو كعب بن ربيعة [@tabrizi-ikhtiyarat، ج3 ص1451]، فيصير البيت عن رجل من بني عامر لا عن الملك."
  connection: "ثم يصف حجرًا يحاول القيام وقد مضت فيه الأسنة."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "أَقْصَدْنَحُجْ / رَنْ قَبْلَذَا / لِكَوَلْقَنَا = متْفاعلن / متْفاعلن / متفاعلن — شَرَعُنْ إِلَيْ / هِوَقَدْ أَكَبْ / بَعَلَلْفَمِي = متفاعلن / متفاعلن / متفاعلن"
  note: "الكامل «متفاعلن متفاعلن متفاعلن»، والإضمار «تسكين الثاني المتحرك» [@atiq، ص59] في التفعيلتين الأوليين من الصدر، والعجز تامّ على الأصل. و«ذلك» تُنطق «ذالك» بالألف."
