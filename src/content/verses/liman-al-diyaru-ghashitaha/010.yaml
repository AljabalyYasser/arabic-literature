explained: false
first: "كُنَّا إِذَا نَعَرُوا لِحَرْبٍ نَعْرَةً"
second: "نَشْفِي صُدَاعَهُمُ بِرَأْسٍ مِصْدَمِ"
vocabulary:
  - term: "نَعَرُوا"
    text: "صاحوا بشعارهم، وقيل: هاجوا واجتمعوا [@tabrizi-ikhtiyarat، ج3 ص1447]."
  - term: "نَشْفِي صُدَاعَهُمُ"
    text: "كناية عن مداواة دائهم وإزالة الكِبْر عن رؤوسهم [@tabrizi-ikhtiyarat، ج3 ص1448]."
  - term: "بِرَأْسٍ مِصْدَمِ"
    text: "الرأس: الرئيس، والمِصْدَم: الذي من عادته أن يصدم ويكسر [@tabrizi-ikhtiyarat، ج3 ص1448]."
