first: "وَلَقَدْ خَبَطْنَ بَنِي كِلَابٍ خَبْطَةً"
second: "أَلْصَقْنَهُمْ بِدَعَائِمِ المُتَخَيَّمِ"
vocabulary:
  - term: "خَبَطْنَ"
    text: "الخبط: الضرب، يريد دُسن بني كلاب بن ربيعة بن عامر [@tabrizi-ikhtiyarat، ج3 ص1452]."
  - term: "أَلْصَقْنَهُمْ بِدَعَائِمِ المُتَخَيَّمِ"
    text: "ألجأنهم إلى الالتصاق بدعائم البيوت المضروبة [@tabrizi-ikhtiyarat، ج3 ص1452]."
