first: "غَضِبَتْ تَمِيمٌ أَنْ تُقَتَّلَ عَامِرٌ"
second: "يَوْمَ النِّسَارِ فَأُعْقِبُوا بِالصَّيْلَمِ"
meaning: "غضبت تميم لأننا قتلنا بني عامر يوم النِّسار، فجاءت تنصرهم، فكانت عاقبة غضبها الداهية التي استأصلتها."
vocabulary:
  - term: "عَامِرٌ"
    text: "بنو عامر بن صعصعة، من هوازن، وكانوا مع تميم على بني أسد وحلفائهم يوم النِّسار."
  - term: "يَوْمَ النِّسَارِ"
    text: "يوم من أيام العرب، استعانت فيه بنو سعد بن ضبة بأسد وطيئ على يربوع من تميم وعلى هوازن، كما يقول محقق شرح التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1379]. والنِّسار اسم الموضع."
  - term: "فَأُعْقِبُوا"
    text: "كانت عاقبتهم، يقال: أعقبه الله بكذا، أي جعله عاقبة أمره."
  - term: "الصَّيْلَمِ"
    text: "الداهية، وهو «فيعل» من الصَّلْم، وهو القطع، أي المصطلمة لجماعتهم [@tabrizi-ikhtiyarat، ج3 ص1447]."
context: "بعد المطلع والغزل والناقة يبدأ الفخر بيوم النِّسار: «سائل تميمًا في الحروب وعامرًا، وهل المجرَّب مثل من لم يعلم» (8)، ثم هذا البيت الذي يلخص اليوم كله. وقد أورده ابن عبد ربه في أخبار يوم النِّسار [@iqd، ج6 ص99]. وانظر [أيام العرب](/path/1/ayyam-al-arab/)."
syntax:
  - "«غضبت» فعل ماض، والتاء للتأنيث لأن «تميم» قبيلة، و«تميمٌ» فاعل."
  - "«أن تُقتَّل عامرٌ» «أن» مصدرية ناصبة، و«تُقتَّل» مضارع مبني للمجهول منصوب، و«عامرٌ» نائب فاعل، والمصدر المؤول في محل جر بلام محذوفة، أي: لأن تُقتَّل. ويقول التِّبْرِيزِيّ: يريد لأن تُقتل أو بأن تُقتل [@tabrizi-ikhtiyarat، ج3 ص1447]."
  - "«يومَ» ظرف زمان منصوب متعلق بـ«تُقتَّل»، مضاف إلى «النسار»."
  - "الفاء في «فأُعقبوا» للسببية، والفعل مبني للمجهول، والواو نائب فاعل يعود على تميم بمعنى القوم، و«بالصيلم» متعلق به."
morphology:
  - "«تُقَتَّل» مضارع «قتّل» على «فعّل»، والتضعيف للتكثير: قتلٌ كثير متتابع."
  - "«أُعقِبوا» ماض مبني للمجهول من «أعقب» على «أفعل»، من العاقبة."
  - "«الصيلم» على «فَيْعَل» من «صلم»، والياء زائدة."
rhetoric:
  thesis: "البيت قصة يوم النِّسار في سطر: غضب، ثم عاقبة. تميم دخلت الحرب لتنصر حلفاءها، فخرجت منها مقطوعة."
  devices:
    - title: "التهكم"
      text: "يروى «فأُعتبوا بالصيلم»، أي أُرضوا، فيكون الكلام تهكمًا: طلبوا الرضا بغضبهم فأُرضوا بالداهية. ويذكر التِّبْرِيزِيّ هذه الرواية ويقول إن «أُعتبوا» معناه أُرضوا [@tabrizi-ikhtiyarat، ج3 ص1447]."
    - title: "المقابلة بين السبب والنتيجة"
      text: "الشطر الأول سبب «غضبت تميم»، والثاني نتيجة «فأُعقبوا بالصيلم»، والفاء بينهما تجعل الهلاك جزاءً مباشرًا للغضب. فالغضب الذي يُفترض أن يكون قوة صار سبب الهلاك. وهذه قراءتنا."
    - title: "التضعيف في «تُقتَّل»"
      text: "لم يقل «تُقتل» بل «تُقتَّل»، فدلّ بالتضعيف على كثرة القتلى من بني عامر."
  connection: "ثم يقول: «كنا إذا نعروا لحرب نعرة نشفي صداعهم برأس مصدم»."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة"
  scansion: "غَضِبَتْ تَمِي / مُنْ أَنْ تُقَتْ / تَلَعَامِرُنْ = متفاعلن / متْفاعلن / متفاعلن — يَوْمَنْ نِسَا / رِفَأُعْقِبُو / بِصْصَيْلَمِي = متْفاعلن / متفاعلن / متْفاعلن"
  note: "الكامل «متفاعلن متفاعلن متفاعلن»، والإضمار، وهو «تسكين الثاني المتحرك» [@atiq، ص59]، في الثانية من الصدر وفي الأولى والثالثة من العجز."
