first: "وَصَلَقْنَ كَعْبًا قَبْلَ ذَلِكَ صَلْقَةً"
second: "بِقَنًا تَعَاوَرُهُ الأَكُفُّ مُقَوَّمِ"
vocabulary:
  - term: "صَلَقْنَ"
    text: "الصَّلْق: رفع الصوت، أي أوقعنا بهم وقعة لها في الناس صوت وذكر، وقيل: الضرب على الشيء اليابس [@tabrizi-ikhtiyarat، ج3 ص1453]."
  - term: "تَعَاوَرُهُ الأَكُفُّ"
    text: "تتداوله الأيدي لاطّراده واستوائه [@tabrizi-ikhtiyarat، ج3 ص1453]."
