explained: false
first: "فَظَلِلْتَ مِنْ فَرْطِ الصَّبَابَةِ وَالهَوَى"
second: "طَرِفًا فُؤَادُكَ مِثْلَ فِعْلِ الأَيْهَمِ"
vocabulary:
  - term: "طَرِفًا"
    text: "الطَّرِف عند أبي عبيدة: البعير الذي يستطرف المرعى، فضربه مثلًا لفؤاده، يريد: تولّه فصار يأخذ في كل ناحية [@tabrizi-ikhtiyarat، ج3 ص1445]."
  - term: "الأَيْهَمِ"
    text: "قالوا: الأياهم ثلاثة: الجمل الصَّؤول، والسيل، والليل [@tabrizi-ikhtiyarat، ج3 ص1445]."
