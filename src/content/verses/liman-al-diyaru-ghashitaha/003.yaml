first: "دَارٌ لِبَيْضَاءِ العَوَارِضِ طَفْلَةٍ"
second: "مَهْضُومَةِ الكَشْحَيْنِ رَيَّا المِعْصَمِ"
vocabulary:
  - term: "العَوَارِضِ"
    text: "عوارض الأسنان، وقيل: مقدّم الفم، والمراد أنها نقيّة الثغر [@tabrizi-ikhtiyarat، ج3 ص1444]."
  - term: "طَفْلَةٍ"
    text: "الرَّخْصة الناعمة [@tabrizi-ikhtiyarat، ج3 ص1444]."
  - term: "مَهْضُومَةِ الكَشْحَيْنِ"
    text: "خميصة البطن، و«الرَّيّا»: الممتلئة [@tabrizi-ikhtiyarat، ج3 ص1444]."
