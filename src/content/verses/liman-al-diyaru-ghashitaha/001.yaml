first: "لِمَنِ الدِّيَارُ غَشِيتَهَا بِالأَنْعُمِ"
second: "تَبْدُو مَعَارِفُهَا كَلَوْنِ الأَرْقَمِ"
meaning: "لمن هذه الديار التي أتيتها بالأنعم؟ تظهر آثارها الباقية مرقّطة، كأنها جلد الحية الرقطاء."
vocabulary:
  - term: "غَشِيتَهَا"
    text: "أتيتها ونزلت بها."
  - term: "الأَنْعُمِ"
    text: "موضع معروف، ويروى «بالأنعَم» بضم العين وفتحها [@tabrizi-ikhtiyarat، ج3 ص1443]."
  - term: "مَعَارِفُهَا"
    text: "ما يُعرف من آثارها، ويروى «معالمها»، وهي آثارها وعلاماتها مثل النؤي والأواري [@tabrizi-ikhtiyarat، ج3 ص1443]."
  - term: "الأَرْقَمِ"
    text: "الحية التي في جلدها نقط سود وبيض. شبّه آثار الديار ولُمَعها برقم الحيات، بياض على ظهور سود [@tabrizi-ikhtiyarat، ج3 ص1443]."
context: "مطلع القصيدة 99، وهي من أشهر قصائده في يوم النِّسار، ورواها صاحب «جمهرة أشعار العرب» في مجمهراته [@jamhara، ص399]. يقف بها على الديار، ثم يذكر المرأة التي رحلت مع قومها، ثم يتسلّى بناقته، ثم يفخر بنصر بني أسد على تميم وعامر يوم النِّسار. ويقول محقق شرح التِّبْرِيزِيّ إن صاحبي «الجمهرة» و«منتهى الطلب» ألحقا بآخرها المفضلية المئة لاشتراكهما في الوزن والقافية [@tabrizi-ikhtiyarat، ج3 ص1443]."
syntax:
  - "«لِمن» جار ومجرور خبر مقدم، و«مَن» اسم استفهام، و«الديارُ» مبتدأ مؤخر."
  - "جملة «غشيتَها» في محل نصب حال من «الديار»، أو صفة لها على تقدير: الديار التي غشيتها."
  - "«بالأنعم» جار ومجرور متعلق بـ«غشيت»."
  - "جملة «تبدو معارفها» حال ثانية، و«معارفُها» فاعل «تبدو»، و«كلون الأرقم» في موضع الحال من «المعارف»، كأنه قال: مرقّمةً كرقم الحية، كما يقول المَرْزُوقِيّ فيما ينقله التِّبْرِيزِيّ [@tabrizi-ikhtiyarat، ج3 ص1443]."
morphology:
  - "«الديار» جمع «دار» على «فِعال»، وأصلها «دِوار» قُلبت الواو ياء لانكسار ما قبلها."
  - "«غشيت» ماض من «غشي يغشى» ناقص يائي، من باب «فعِل يفعَل»."
  - "«معارف» جمع «مَعْرِف» على «مفاعل»، وهو موضع المعرفة، أي ما يُعرف به المكان."
  - "«الأرقم» على «أفعل»، صفة من الرَّقْم، وهو النقش والتنقيط، صارت اسمًا للحية."
rhetoric:
  thesis: "مطلع على الطلل بسؤال لا ينتظر جوابًا، وصورة واحدة تحمل الخراب: الأرض صارت جلد حية، فيها بقع سود من آثار النار والبيوت على أرض فاتحة."
  devices:
    - title: "الاستفهام"
      text: "«لمن الديار» سؤال يعرف الشاعر جوابه، يقصد به التحسر والتنبيه إلى أن الديار تغيّرت حتى صار يسأل عنها. وهو من افتتاحات الطلل المألوفة."
    - title: "التشبيه"
      text: "شبّه آثار الديار في سوادها على الأرض بنقوش الأرقم. ويقول التِّبْرِيزِيّ إنه شبّه شامات الديار ولُمَع آثارها برقم الحيات [@tabrizi-ikhtiyarat، ج3 ص1443]. والحية في الصورة توحي بالخلاء والوحشة: الديار التي كانت مأهولة صار يسكنها ما يسكن القفر. وهذه قراءتنا للظلّ الذي يتركه المشبّه به."
    - title: "الالتفات"
      text: "«غشيتَها» بتاء الخطاب، يخاطب الشاعر نفسه، كما في كثير من مطالع الجاهليين."
    - title: "التصريع"
      text: "ختم الصدر بـ«الأنعمِ» على قافية العجز «الأرقمِ»."
  connection: "ثم يقول إن ريح الصبا لعبت بها فتنكّرت إلا بقية نؤيها المتهدم."
prosody:
  meter: "البحر الكامل"
  rhyme: "الرَّوِيّ الميم المكسورة، فهي ميمية"
  scansion: "لِمَنِدْدِيَا / رُغَشِيتَهَا / بِلْأَنْعُمِي = متفاعلن / متفاعلن / متْفاعلن — تَبْدُو مَعَا / رِفُهَا كَلَوْ / نِلْأَرْقَمِي = متْفاعلن / متفاعلن / متْفاعلن"
  note: "الكامل «متفاعلن متفاعلن متفاعلن»، و«يدخله كثيرًا زحاف الإضمار، وهو تسكين الثاني المتحرك» [@atiq، ص59]، فتصير «متْفاعلن». والعروض والضرب تامّتان، والبيت مصرّع، وتُشبع كسرة الميم في آخر الشطرين."
