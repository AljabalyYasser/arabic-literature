explained: false
first: "لَوْلَا تُسَلِّي الهَمَّ عَنْكَ بِجَسْرَةٍ"
second: "عَيْرَانَةٍ مِثْلِ الفَنِيقِ المُكْدَمِ"
vocabulary:
  - term: "لَوْلَا"
    text: "بمعنى هلّا، للحثّ والتحضيض [@tabrizi-ikhtiyarat، ج3 ص1446]."
  - term: "جَسْرَةٍ"
    text: "الناقة تجسُر على السير والهول فلا تقف [@tabrizi-ikhtiyarat، ج3 ص1446]."
  - term: "المُكْدَمِ"
    text: "الغليظ، وقيل: من الكَدْم، وهو العض [@tabrizi-ikhtiyarat، ج3 ص1446]."
