first: "نَعْلُو القَوَانِسَ بِالسُّيُوفِ وَنَعْتَزِي"
second: "وَالخَيْلُ مُشْعَلَةُ النُّحُورِ مِنَ الدَّمِ"
vocabulary:
  - term: "القَوَانِسَ"
    text: "جمع قَوْنَس، وهو أعلى البيضة من الحديد."
  - term: "نَعْتَزِي"
    text: "ينتسب كل منا إلى أبيه في القتال."
  - term: "مُشْعَلَةُ النُّحُورِ"
    text: "ملطّخة الصدور بالدماء السائلة عليها، وقيل: كأنما أُشعلت فيها نار [@tabrizi-ikhtiyarat، ج3 ص1448]."
