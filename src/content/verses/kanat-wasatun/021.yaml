first: "لَوْ أَنَّ كُلَّ مَعَدٍّ كَانَ شَارَكَنَا"
second: "فِي يَوْمِ ذِي قَارَ مَا أَخْطَاهُمُ الشَّرَفُ"
meaning: "لو أن العرب كلها شاركتنا يوم ذي قار لنال كل قبيلة منها شرف ذلك اليوم. أي أن الشرف الذي نالته بكر فيه عظيم يتسع للعرب جميعًا، لكنهم لم يشاركوا فخصّنا وحدنا. ويشرحه محقق الديوان: «فلو أن هذا الشرف الكبير قد قسم على قبائل (معد) جميعا لظفر كل رجل منه بمقدار» [@diwan-asha، ص346]."
vocabulary:
  - term: "مَعَدٍّ"
    text: "العرب من ولد معدّ بن عدنان، وفي حاشية المحقق أن معدًّا «جد عرب الشمال من قبائل ربيعة ومضر جميعا» [@diwan-asha، ص347، الحاشية]. وبكر، قوم الأَعْشَى، من ربيعة."
  - term: "ذِي قَارَ"
    text: "الموضع الذي كانت عنده الوقعة بين بكر وجيش كسرى."
  - term: "مَا أَخْطَاهُمُ"
    text: "ما فاتهم ولا تجاوزهم."
context: "يأتي في الديوان بعد صفة الهزيمة: «وخيل بكر فما تنفكّ تطحنهم / حتى تولّوا وكاد اليوم ينتصف»، فهو خلاصة الفخر بعد القتال. وأبو الفَرَج يبدأ به الأبيات التي يرويها للأعشى في ذي قار، فيجعله مطلعًا [@aghani-dk، ج24 ص80]. ويوم ذي قار يوم انتصرت فيه بكر بن وائل على جيش لكسرى، وخبره في قسم [«أيام العرب»](/path/1/ayyam-al-arab/). والفخر بأن الشرف كان لبكر وحدها يدل على أن قبائل العرب الأخرى لم تشهده."
syntax:
  - "«لَوْ» حرف امتناع لامتناع. و«أنّ» حرف توكيد، و«كلَّ معدٍّ» اسمها، وجملة «كان شاركنا» في محل رفع خبرها، و«كان» ناقصة اسمها ضمير يعود على «كلّ»، وجملة «شاركنا» خبرها. والمصدر المؤول من «أنّ» واسمها وخبرها فاعل لفعل محذوف، تقديره: لو ثبت أن كل معد شاركنا."
  - "«فِي يَوْمِ ذِي قَارَ» متعلق بـ«شاركنا». و«ذي» مضاف إليه مجرور بالياء لأنه من الأسماء الخمسة، و«قارَ» مضاف إليه مجرور بالفتحة."
  - "«مَا أَخْطَاهُمُ الشَّرَفُ» جواب «لو»، و«ما» نافية، والأكثر أن يأتي جواب «لو» المنفي بـ«ما» بلا لام كما هنا. و«أخطاهم» فعل ومفعول به، و«الشرفُ» فاعل مؤخر."
morphology:
  - "«شَارَكَ» على «فاعَلَ»، وهو للمشاركة بين اثنين فأكثر."
  - "«قارَ» ممنوع من الصرف هنا، على أنه اسم بقعة، فجُرّ بالفتحة، وبهذا يستقيم الوزن."
  - "«أَخْطَأ» على «أفعل»، وخُفّفت همزته فصارت «أخطا»، وتخفيف الهمزة كثير في الشعر."
rhetoric:
  thesis: "فخر بالقلة: الشرف أكبر من أن تحمله قبيلة واحدة، ومع ذلك حملته بكر وحدها."
  devices:
    - title: "الفرض بـ«لو»"
      text: "يفرض ما لم يقع: أن العرب كلها شاركت. والغرض إثبات عكسه: أنها لم تشارك، فالشرف كله لبكر. فـ«لو» هنا تمدح بكرًا بذمّ الغائبين ذمًّا خفيًّا، وهذه قراءتنا."
    - title: "الاستعارة في «ما أخطاهم الشرف»"
      text: "جعل الشرف كالسهم يُرمى فيصيب أو يخطئ، فلو كانوا هناك لأصابهم. وهي من الاستعارة التي يقول فيها عبد القاهر: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وفي القصيدة نفسها ذكر النُّشّاب في البيت 19، فالصورة قريبة من جو المعركة."
    - title: "التقديم في «كل معد»"
      text: "بدأ بـ«كُلَّ مَعَدٍّ» فجمع العرب كلها في أول البيت، ثم حصر الشرف في «نا» من «شاركنا»: فالكلمة الصغيرة في آخر الصدر تقابل الكلمة الكبيرة في أوله."
  connection: "ثم يعود إلى صفة الجيش: «لمّا أتونا كأنّ الليل يقدمهم / مُطبِق الأرض يغشاها بهم سَدَف»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الفاء المضمومة"
  scansion: "لَوْ أَنْنَ كُلْ / لِمَعَدْ / دِنْ كَانَ شَا / رَكَنَا = مستفعلن / فعِلن / مستفعلن / فعِلن — فِي يَوْمِ ذِي / قَارَ مَا / أَخْطَاهُمُشْ / شَرَفُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «فاعلن» الأولى في الصدر فصارت «فعِلن». والعروض مخبونة «فعِلن»، والضرب مخبون مثلها [@atiq، ص48]."
