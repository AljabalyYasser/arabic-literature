first: "إِذَا أَمَالُوا إِلَى النُّشَّابِ أَيْدِيَهُمْ"
second: "مِلْنَا بِبِيضٍ فَظَلَّ الْهَامُ يُخْتَطَفُ"
meaning: "إذا مدّ الفرس أيديهم إلى السهام ليرمونا من بعيد، ملنا عليهم بالسيوف، فظلت الرؤوس تُخطف عن أجسادها."
vocabulary:
  - term: "أَمَالُوا ... أَيْدِيَهُمْ"
    text: "مدّوها، والضمير لجند كسرى في البيت 17."
  - term: "النُّشَّابِ"
    text: "السهام، «والنشاب: النبل، واحدته نشابة» [@lisan، ج1 ص757]."
  - term: "بِبِيضٍ"
    text: "بسيوف بيض لامعة، وفي حاشية المحقق: «البيض السيوف» [@diwan-asha، ص347، الحاشية]."
  - term: "الْهَامُ"
    text: "الرؤوس، «جمع هامة وهى الرأس» كما في حاشية المحقق [@diwan-asha، ص347، الحاشية]."
  - term: "يُخْتَطَفُ"
    text: "يُؤخذ بسرعة، و«الخطف: الاستلاب، وقيل: الخطف الأخذ في سرعة واستلاب» [@lisan، ج9 ص75]."
context: "من الجزء الذي يفخر فيه الشاعر بيوم ذي قار (17–25): صبّحت كتائب بكر جند كسرى بالحِنْو، وفيهم سادة الأعاجم في آذانهم الأقراط، ثم هذا البيت في صفة القتال، وبعده: «وخيل بكر فما تنفكّ تطحنهم / حتى تولّوا وكاد اليوم ينتصف». وهذا الجزء هو الذي يقدّر محقق الديوان أن أبا عُبَيْدة رأى فيه شعر نابغة بني شيبان مختلطًا بشعر الأَعْشَى [@diwan-asha، ص344]. ويحتج المحقق بهذا البيت على قصيدة أخرى في ذي قار يقاتل فيها قوم الأَعْشَى بالنُّشّاب، فيقول إنها تناقضه، ويجعل ذلك من أسباب تردده في نسبتها [@diwan-asha، ص334]. وفي «الأغاني» و«العقد» يأتي البيت بعد «لو أن كل معد كان شاركنا» [@aghani-dk، ج24 ص81] [@iqd، ج6 ص116]."
syntax:
  - "«إِذَا» ظرف لما يُستقبل من الزمان فيه معنى الشرط، وهو هنا لحكاية ما كان يتكرر يومئذ. و«أَمَالُوا» فعل الشرط وفاعله، و«أَيْدِيَهُمْ» مفعول به، و«إِلَى النُّشَّابِ» متعلق بـ«أمالوا»."
  - "«مِلْنَا» جواب الشرط، و«بِبِيضٍ» متعلق به، والباء للمصاحبة أو للاستعانة، و«بيض» صفة لموصوف محذوف تقديره: بسيوف بيض."
  - "«فَظَلَّ الْهَامُ يُخْتَطَفُ»: الفاء عاطفة تفيد التعقيب، و«ظلّ» فعل ناقص، و«الهامُ» اسمها، وجملة «يُختطف» في محل نصب خبرها."
morphology:
  - "«أَمَالُوا» ماض «أمال» على «أفعل» من «مال يميل»، أي جعلها تميل."
  - "«مِلْنَا» ماض «مال يميل» أُسند إلى «نا» فحُذفت عينه لالتقاء الساكنين، وكُسرت الميم لأن العين ياء."
  - "«النُّشّاب» اسم جنس على «فُعّال»، واحدته «نُشّابة» [@lisan، ج1 ص757]."
  - "«يُخْتَطَف» مضارع مبني للمجهول من «اختطف» على «افتعل»، وفيه معنى المبالغة في الخطف."
rhetoric:
  thesis: "مقابلة بين قتالين: قتال من بعيد بالسهام، وقتال من قريب بالسيوف، والغلبة للثاني."
  devices:
    - title: "المقابلة في «أمالوا» و«ملنا»"
      text: "الفعلان من مادة واحدة: «أَمَالُوا» أيديهم إلى السهام، و«مِلْنَا» نحن بالسيوف. فميلهم إلى الرمي يقابله ميلنا إلى الضرب، وهما في الشطرين متقابلان، فيقع الجواب على لفظ الشرط نفسه."
    - title: "الكناية في «بِبِيضٍ»"
      text: "لم يذكر السيوف، بل ذكر صفتها: البياض واللمعان. والعرب تسمّي السيوف بيضًا حتى صار الوصف اسمًا لها. وهو من ترك الذكر الذي يقول فيه عبد القاهر: «فإنك ترى به ترك الذِّكْر أفصح من الذكر» [@dalail، ص146]."
    - title: "الاستعارة في «الهام يختطف»"
      text: "الخطف أخذ الشيء بسرعة كما يخطف الطائر، فجعل الرؤوس تُخطف عن الأجساد، أي تسقط بالضرب سريعًا وكثيرًا. وفي رواية «الأغاني» «يُقْتَطَفُ»، فتكون الرؤوس كالثمر يُقطف [@aghani-dk، ج24 ص81]. والصورتان من التي يقول فيها عبد القاهر: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]."
    - title: "«ظلّ» والاستمرار"
      text: "«فَظَلَّ الْهَامُ يُخْتَطَفُ»: «ظلّ» تدل على الدوام في النهار، والمضارع «يختطف» يجعل الفعل يتكرر أمام السامع. وفي البيت التالي «وكاد اليوم ينتصف»، فالقتل متصل من الصباح إلى الظهر."
  connection: "ثم يقول: «وخيل بكر فما تنفكّ تطحنهم / حتى تولّوا وكاد اليوم ينتصف»."
prosody:
  meter: "البحر البسيط"
  rhyme: "الرَّوِيّ الفاء المضمومة"
  scansion: "إِذَا أَمَا / لُو إِلَنْ / نُشْشَابِ أَيْ / دِيَهُمْ = متفعلن / فاعلن / مستفعلن / فعِلن — مِلْنَا بِبِي / ضِنْ فَظَلْ / لَلْهَامُ يُخْ / تَطَفُو = مستفعلن / فاعلن / مستفعلن / فعِلن"
  note: "دخل الخَبْنُ، وهو حذف الثاني الساكن [@atiq، ص46]، «مستفعلن» الأولى في الصدر فصارت «متفعلن». والعروض مخبونة «فعِلن»، والضرب مخبون مثلها [@atiq، ص48]."
