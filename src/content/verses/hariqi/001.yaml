explained: false
first: "هَرِيقِي مِنْ دُمُوعِكِ وَاسْتَفِيقِي"
second: "وَصَبْرًا إِنْ أَطَقْتِ وَلَنْ تُطِيقِي"
vocabulary:
- term: "هَرِيقِي"
  text: "صُبّي. في الشرح المنسوب إلى ثَعْلَب: «يقال: أرقتُ وهرقتُ وأهرقتُ» [@diwan-khansa، ص62]."
- term: "وَاسْتَفِيقِي"
  text: "كُفّي عن البكاء. في الشرح: «أي أمسكي وأفيقي» [@diwan-khansa، ص62]."
sources:
