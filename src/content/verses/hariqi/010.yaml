explained: false
first: "فَذَاكَ الرُّزْءُ عَمْرَكَ لَا كُبُنٌّ"
second: "عَظِيمُ الرَّأْسِ يَحْلُمُ بِالنَّعِيقِ"
vocabulary:
- term: "الرُّزْءُ"
  text: "في الشرح: «الرُّزء: المصيبة العظيمة» [@diwan-khansa، ص71]."
- term: "عَمْرَكَ"
  text: "قسم، أي: أُقسم بحياتك."
- term: "كُبُنٌّ"
  text: "في الشرح: «والكُبُنّ: الثقيل النائم أبدًا، والكُباس والكُبُنّ واحد» [@diwan-khansa، ص71]."
- term: "بِالنَّعِيقِ"
  text: "صياح الراعي بغنمه. في الشرح: «والنعيق: أن ينعق بالغنم ضأنها ومعزها لتريع إليه» [@diwan-khansa، ص71]."
sources:
- source: "diwan-khansa"
  loc: "ص70–71"
  url: "https://archive.org/details/3318pdf_202001/page/n69/mode/1up"
status: "review"
