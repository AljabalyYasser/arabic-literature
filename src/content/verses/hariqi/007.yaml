first: "وَإِذْ تَتَحَاكَمُ الرُّؤَسَاءُ فِينَا"
second: "لَدَى أَبْيَاتِنَا وَذَوُو الْحُقُوقِ"
vocabulary:
- term: "تَتَحَاكَمُ الرُّؤَسَاءُ فِينَا"
  text: "في الشرح: «أي يتحاكمون عندنا من أجله، أي: إليه كان يرقى المتحاكمون» [@diwan-khansa، ص68]."
- term: "وَذَوُو الْحُقُوقِ"
  text: "في الشرح: «وذوو الحقوق يطلبون حقوقهم، يتخاصمون فيطلبون حقوقهم» [@diwan-khansa، ص68]."
