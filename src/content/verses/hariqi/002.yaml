explained: false
first: "بِعَاقِبَةٍ فَإِنَّ الصَّبْرَ خَيْرٌ"
second: "مِنَ النَّعْلَيْنِ وَالرَّأْسِ الْحَلِيقِ"
vocabulary:
- term: "بِعَاقِبَةٍ"
  text: "في آخر الأمر. في الشرح: «بعاقبة: بآخرة» [@diwan-khansa، ص63]."
- term: "النَّعْلَيْنِ وَالرَّأْسِ الْحَلِيقِ"
  text: "من فعل النساء في المصيبة. في الشرح: «كنّ يضربن وجوههن بالنعال عند المصيبة ويحلقن رؤوسهن» [@diwan-khansa، ص63]. وعند المُبَرِّد: «تأويل النعلين أن المرأة كانت إذا أصيبت بحميم جعلت في يديها نعلين»، تصفق بهما وجهها وصدرها [@kamil، ج4 ص46]."
