explained: false
first: "مِنْهَا الصَّبُوحُ الَّذِي يَتْرُكُنِي"
second: "لَيْثَ عِفِرِّينَ وَالْمَالُ كَثِيرْ"
vocabulary:
  - term: "الصَّبُوحُ"
    text: "خمر الصباح، «وهو شرب الغداة» [@ibn-al-anbari، ص371]."
  - term: "لَيْثَ عِفِرِّينَ"
    text: "يُضرب به المثل في الشجاعة: «إِنه لأَشْجَعُ مِنْ لَيْثِ عِفِرِّينَ، قَالَ أَبو عَمْرٍو: هُوَ الأَسد، وَقَالَ الأَصمعي هُوَ دَابَّةٌ مِثْلُ الحِرْباء تتعرَّض لِلرَّاكِبِ» [@lisan، ج2 ص188]."
  - term: "وَالْمَالُ كَثِيرْ"
    text: "يخيّل إليه سكره أنه غني."
