explained: false
first: "الزِّقُّ مُلْكٌ لِمَنْ كَانَ لَهُ"
second: "وَالْمُلْكُ مِنْهُ طَوِيلٌ وَقَصِيرْ"
vocabulary:
  - term: "الزِّقُّ"
    text: "وعاء الخمر من الجلد: «والزِّقّ مِنَ الأُهُبِ: كلُّ وَعَاءٍ اتُّخِذَ لِشَرَابٍ وَنَحْوِهِ» [@lisan، ج10 ص143]."
  - term: "وَالْمُلْكُ مِنْهُ طَوِيلٌ وَقَصِيرْ"
    text: "يفسّره محققا «الأصمعيات» بأن الخمر لشاربها كالمُلك، تتفاوت مُدده [@asmaiyyat، ص153]: يطول ما بقي في الزِّق شيء، ويقصر إذا فرغ."
