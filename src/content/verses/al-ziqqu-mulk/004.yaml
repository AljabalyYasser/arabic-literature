explained: false
first: "قَاتَلَكِ اللَّهُ مِنْ مَشْرُوبَةٍ"
second: "لَوْ أَنَّ ذَا مِرَّةٍ عَنْكِ صَبُورْ"
vocabulary:
  - term: "قَاتَلَكِ اللَّهُ"
    text: "دعاء على الخمر يقال تعجبًا لا قصدًا."
  - term: "مِرَّةٍ"
    text: "قوة وعقل: «والمِرَّةُ الْقُوَّةُ وَشِدَّةُ الْعَقْلِ أَيضاً» [@lisan، ج5 ص168]."
  - term: "لَوْ أَنَّ ذَا مِرَّةٍ عَنْكِ صَبُورْ"
    text: "ليت صاحب العقل والقوة يصبر عنك، وهو لا يصبر."
