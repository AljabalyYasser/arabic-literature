explained: false
first: "فَأَوَّلَ اللَّيْلِ لَيْثٌ خَادِرٌ"
second: "وَآخِرَ اللَّيْلِ ضِبْعَانٌ عَثُورْ"
vocabulary:
  - term: "خَادِرٌ"
    text: "مقيم في عرينه؛ قال ابن الأَنْبارِيّ: «أسد خادر ومخدر، أي في أجمة مثل الخدر» [@ibn-al-anbari، ص37]."
  - term: "ضِبْعَانٌ"
    text: "ذكر الضباع: «وَالذَّكَرُ ضِبْعانٌ» [@lisan، ج8 ص217]."
  - term: "عَثُورْ"
    text: "كثير العِثار، يتعثر في مشيه مما فعلت به الخمر، كما يفسّره محققا «الأصمعيات» [@asmaiyyat، ص153]."
