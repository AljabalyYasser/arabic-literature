explained: false
first: "وَتَقْتَالُ النُّسُوعَ بِجَوْزِ قَرْمٍ"
second: "مُوَاشِكَةً إِذَا مَا اليَوْمُ صَامَا"
vocabulary:
  - term: "تَقْتَالُ"
    text: "تحتكم عليها: «واقْتَالَ عَلَيْهِمُ: احْتَكَم» [@lisan، ج11 ص576]."
  - term: "قَرْمٍ"
    text: "فحل: «والقَرْمُ: الْفَحْلُ الَّذِي يُتْرَكُ» للضراب [@lisan، ج12 ص473]، أي بوسط كوسط الفحل في ضخامته."
  - term: "مُوَاشِكَةً"
    text: "«وَنَاقَةٌ مُواشِكة: سَرِيعَةٌ» [@lisan، ج10 ص514]."
  - term: "صَامَا"
    text: "«وصامَ النهارُ صَوماً إِذَا اعْتَدَلَ وقامَ قائمُ الظَّهِيرَةِ» [@lisan، ج12 ص351]."
