explained: false
first: "إِذَا مَا الآثِمَاتُ وَنَيْنَ حَطَّتْ"
second: "عَلَى العِلَّاتِ تَجْتَرِعُ الإِكَامَا"
vocabulary:
  - term: "الآثِمَاتُ"
    text: "الإبل المبطئات. يقول المحقق: «الآثمات التي لا تصدق السير» [@diwan-asha، ص233]."
  - term: "الإِكَامَا"
    text: "جمع أَكَم، والأَكَمة التل: «وَجَمْعُ الأَكَمِ إِكامٌ» [@lisan، ج12 ص20]. وتجترعها: تقطعها كأنها تبتلعها."
