explained: false
first: "تَخَيَّرَهَا أَخُو عَانَاتَ شَهْرًا"
second: "وَرَجَّى أَوْلَهَا عَامًا فَعَامَا"
vocabulary:
  - term: "أَخُو عَانَاتَ"
    text: "تاجر من عانة: «وعانَةُ: قَرْيَةٌ مِنْ قُرى» الجزيرة، و«وَرُبَّمَا قَالُوا عاناتٌ» [@lisan، ج13 ص300]."
  - term: "أَوْلَهَا"
    text: "ما يؤول إليه من ربحها. وفي اللسان «ورَجَّى خَيرَها» [@lisan، ج13 ص300] و«ورَجَّى بِرَّها» [@lisan، ج4 ص53]."
