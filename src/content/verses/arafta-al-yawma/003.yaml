first: "وَيَوْمَ الخَرْجِ مِنْ قَرْمَاءَ هَاجَتْ"
second: "صِبَاكَ حَمَامَةٌ تَدْعُو حَمَامًا"
vocabulary:
  - term: "يَوْمَ الخَرْجِ"
    text: "يوم نشأ السحاب، من قولهم: «وخَرج لَهُ خُروجٌ حَسَنٌ، وَذَلِكَ أَوَّلَ مَا يَنْشَأُ» [@lisan، ج1 ص171]."
  - term: "قَرْمَاءَ"
    text: "موضع. يقول المحقق: «قرماء موضع باليمامة» [@diwan-asha، ص231]."
