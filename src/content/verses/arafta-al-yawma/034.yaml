explained: false
first: "كَفَاهُ الحَرْبَ إِذْ لَقِحَتْ إِيَاسٌ"
second: "فَأَعْلَى عَنْ نَمَارِقِهِ فَقَامَا"
vocabulary:
  - term: "لَقِحَتْ"
    text: "هاجت بعد سكون، من لقاح الناقة: «ولَقِحت الحربُ» [@lisan، ج9 ص301]."
  - term: "نَمَارِقِهِ"
    text: "«النُّمْرُقُ والنُّمْرُقة والنِّمْرِقة، بِالْكَسْرِ: الْوِسَادَةُ، وَقِيلَ: وِسَادَةٌ صَغِيرَةٌ» [@lisan، ج10 ص361]. وأعلى عنها: قام عنها."
