explained: false
first: "مُفَرَّجَةً يَئِطُّ النِّسْعُ فِيهَا"
second: "أَطِيطَ السَّمْهَرِيَّةِ أَنْ تُقَامَا"
vocabulary:
  - term: "يَئِطُّ النِّسْعُ ... أَطِيطَ"
    text: "يصوّت السير الذي يُشد به الرحل. «والأُطُّ والأَطِيطُ: نَقِيضُ صَوْتِ المَحامِل والرِّحال» [@lisan، ج7 ص256]، و«النِّسْعُ: سَيْرٌ يُضْفَرُ عَلَى هَيْئَةِ أَعِنَّةِ النِّعالِ تُشَدُّ بِهِ الرِّحالُ» [@lisan، ج8 ص352]."
  - term: "السَّمْهَرِيَّةِ"
    text: "الرماح: «السَّمْهَرِيُّ: الرُّمْحُ الصَّلِيبُ العُودِ» [@lisan، ج4 ص381]. و«أن تُقاما»: حين تقوَّم على النار فتصوّت."
