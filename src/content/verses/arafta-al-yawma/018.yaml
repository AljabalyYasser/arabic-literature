explained: false
first: "مُشَعْشَعَةً كَأَنَّ عَلَى قَرَاهَا"
second: "إِذَا مَا صَرَّحَتْ قِطَعًا سَهَامَا"
vocabulary:
  - term: "مُشَعْشَعَةً"
    text: "ممزوجة بالماء، من «وشَعْشَعَ الشَّرابَ شَعْشَعَةً» إذا مزجه [@lisan، ج8 ص182]."
  - term: "قَرَاهَا"
    text: "ظهرها: «والقَرَا: الظَّهْرُ» [@lisan، ج15 ص176]."
  - term: "صَرَّحَتْ"
    text: "«وصَرَّحَتِ الخَمْر تَصْرِيحًا: انْجَلَى زَبَدُها فَخَلَصَتْ» [@lisan، ج2 ص510]."
  - term: "سَهَامَا"
    text: "«والسَّهامُ: لُعاب الشَّيْطَانِ» [@lisan، ج12 ص310]، وهو ما يُرى في شدة الحر كأنه خيوط، شبّه به ما يلمع على سطح الخمر."
