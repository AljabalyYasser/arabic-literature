first: "عَرَفْتَ اليَوْمَ مِنْ تَيَّا مُقَامًا"
second: "بِجَوٍّ أَوْ عَرَفْتَ لَهَا خِيَامًا"
vocabulary:
  - term: "تَيَّا"
    text: "إشارة إلى صاحبته، وأصلها اسم إشارة مصغّر: «وتَيّا تَصْغِيرُهُ» أي تصغير «تا» [@lisan، ج14 ص106]."
  - term: "جَوٍّ"
    text: "«وجوٌّ: اسْمُ الْيَمَامَةِ» [@lisan، ج14 ص159]."
