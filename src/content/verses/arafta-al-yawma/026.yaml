first: "لَيَلْتَمِسَنْ بِلَادَكُمُ بِمَجْرٍ"
second: "يُثِيرُ بِكُلِّ بَلْقَعَةٍ قَتَامَا"
vocabulary:
  - term: "بِمَجْرٍ"
    text: "بجيش عظيم: «المَجْرُ، بِالتَّسْكِينِ، الْجَيْشُ الْعَظِيمُ» [@lisan، ج5 ص159]."
  - term: "بَلْقَعَةٍ"
    text: "أرض قفر خالية."
  - term: "قَتَامَا"
    text: "«والقَتَمُ والقَتامُ: الغُبار» [@lisan، ج12 ص461]."
