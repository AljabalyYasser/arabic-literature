first: "وَبَيْضَاءِ الْمَعَاصِمِ إِلْفِ لَهْوٍ"
second: "خَلَوْتُ بِشَكْرِهَا لَيْلًا تَمَامَا"
meaning: "ورُبّ امرأة بيضاء المعاصم، معتادة على اللهو، خلوتُ بفرجها ليلة كاملة، أي قضيت الليل كله أجامعها. والشَّكْر هو الفرج: «والشَّكْرُ: فَرْجُ المرأَة وَقِيلَ لَحْمُ فَرْجِهَا»، «وَقِيلَ: الشَّكْرُ بُضْعُها» [@lisan، ج4 ص427]، ويقول المحقق: «الشكر (بفتح الشين) النكاح والفرج» [@diwan-asha، ص233]. ولخّص المحقق البيت هكذا: «ولكم خلوت ليلة كاملة بمضاجعة بيضاء المعاصم صاحبة لهو لعوب» [@diwan-asha، ص232]. فالبيت لا يكني: سمّى العضو باسمه، ثم جعل الليل كله له."
vocabulary:
  - term: "وَبَيْضَاءِ"
    text: "الواو واو رُبَّ، أي: ورُبّ امرأة بيضاء."
  - term: "الْمَعَاصِمِ"
    text: "جمع مِعْصم: «والمعصم: موضع السوار من اليد» [@lisan، ج12 ص408]."
  - term: "إِلْفِ لَهْوٍ"
    text: "معتادة اللهو، يقول المحقق: «الالف لهو معتادة ذلك» [@diwan-asha، ص233]. وفي اللسان: «والإلف: الذي تألفه» [@lisan، ج9 ص11]. واللهو هنا لهو الرجال بالنساء، و«قَدْ يُكَنَّى باللَّهْوِ عَنِ الْجِمَاعِ» [@lisan، ج15 ص259]."
  - term: "بِشَكْرِهَا"
    text: "بفرجها، ويُروى بفتح الشين وكسرها: «وَرُوِيَ بِالْوَجْهَيْنِ بَيْتُ الأَعشى: خَلَوْتُ بِشِكْرِها وشَكرها» [@lisan، ج4 ص427]."
  - term: "تَمَامَا"
    text: "كاملًا من أوله إلى آخره."
syntax:
  - "«وَبَيْضَاءِ»: الواو واو رُبَّ، و«بيضاءِ» مجرور لفظًا بـ«رُبَّ» المحذوفة، مرفوع محلًّا على الابتداء، وهو ممنوع من الصرف، وجُرّ بالكسرة لأنه مضاف إلى «المعاصم»."
  - "«إِلْفِ لَهْوٍ»: نعت لـ«بيضاء» مجرور مثله، مضاف إلى «لهو»."
  - "«خَلَوْتُ بِشَكْرِهَا»: الجملة في محل رفع خبر المبتدأ المجرور برُبّ، أو في محل جر نعت له والخبر محذوف. و«بشكرها» متعلق بـ«خلوت»."
  - "«لَيْلًا»: ظرف زمان منصوب متعلق بـ«خلوت»، و«تَمَامَا» نعت له، والألف للإطلاق."
morphology:
  - "«بَيْضَاء» مؤنث «أَبْيَض» على «فَعْلاء»، ممنوعة من الصرف لألف التأنيث الممدودة."
  - "«مَعَاصِم» جمع «مِعْصَم» على «مَفاعِل»، اسم لموضع السوار."
  - "«إِلْف» على «فِعْل» من «أَلِفَ»، يستوي فيه المذكر والمؤنث."
  - "«شَكْر» على «فَعْل»، ويقال «شِكْر» بالكسر، وجمعه «شِكار» كما في اللسان: «والشِّكارُ: فُرُوجُ النِّسَاءِ، وَاحِدُهَا شَكْرٌ» [@lisan، ج4 ص427]."
rhetoric:
  thesis: "يختم الأَعْشَى أبيات الخمر (16–22) بلذة أخرى: امرأة قضى معها ليلة كاملة. وهو آخر ما يذكره من ملذّاته قبل أن ينتقل فجأة إلى المدح، فيجتمع في القصيدة ما كان يجمعه في حياته: الخمر والنساء."
  devices:
    - title: "المجاز المرسل في «بِشَكْرِهَا»"
      text: "قال «خلوت بشكرها» ولم يقل: خلوت بها، فذكر العضو وأراد صاحبته ومقصده منها. والمجاز المرسل أن يُطلق اسم الشيء على ما يتصل به، كالجزء على الكل. وهذا أصرح من الكناية: المقصود مذكور باسمه."
    - title: "الكناية في «بَيْضَاءِ الْمَعَاصِمِ»"
      text: "لم يقل إنها مترفة لا تعمل، بل وصف بياض معاصمها، والمعصم لا يبيضّ إلا إذا صانته صاحبته عن الشمس والعمل. والكناية عند عبد القاهر الجُرْجانيّ أن يريد المتكلم معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]، كما مثّل له بقولهم «نؤوم الضحى»، و«المرادُ أنها مُتْرفةٌ مخَدْومة» [@dalail، ص66]."
    - title: "«لَيْلًا تَمَامَا»"
      text: "ختم البيت بطول المدة: ليلة كاملة، لا ساعة مختلسة. ففي «ودّع هريرة» يخالس الزوج غفلته، وفي «رحلت سمية» يرصد غفلة المحاذر، أما هنا فلا رقيب ولا خوف. وهذه الموازنة قراءتنا."
  connection: "ثم ينتقل بلا تمهيد إلى خطاب أعداء ممدوحه: «حلفت لكم على ما قد نعيتم»."
prosody:
  meter: "البحر الوافر"
  rhyme: "الرَّوِيّ الميم المفتوحة، وبعدها ألف الإطلاق"
  scansion: "وَبَيْضَاءِلْ / مَعَاصِمِ إِلْ / فِ لَهْوِنْ = مفاعلْتن / مفاعلتن / فعولن — خَلَوْتُ بِشَكْ / رِهَا لَيْلَنْ / تَمَامَا = مفاعلتن / مفاعلْتن / فعولن"
  note: "دخل العَصْب، وهو «تسكين الحرف الخامس، وهو هنا اللام في مفاعلتن» [@atiq، ص54]، التفعيلة الأولى من الصدر والثانية من العجز. والعروض والضرب «فعولن»، وأصلها «مفاعلتن» دخلها القطف، «وهو تسكين الخامس المتحرك: اللام، وحذف السبب الخفيف من آخر التفعيلة» [@atiq، ص54]."
context: "آخر أبيات اللهو في القصيدة، بعد الخمر التي جُلبت من عانة (16–22). وبعده يقول المحقق: «وبعد هذا الحديث الطويل، الذى تنقل فيه الشاعر بين ذكريات شبابه، ينتقل فجأة، وبغير تقديم، إلى المدح» [@diwan-asha، ص232]. وأنشد صاحب اللسان البيت شاهدًا على «الشَّكْر» بمعنى الفرج، ومعه حديث «نهى عن شكر البغيّ»، أي عن ثمن فرجها، وهو أجر الزانية [@lisan، ج4 ص427]."
