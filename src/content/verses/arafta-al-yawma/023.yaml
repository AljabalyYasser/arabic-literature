explained: false
first: "وَبَيْضَاءِ الْمَعَاصِمِ إِلْفِ لَهْوٍ"
second: "خَلَوْتُ بِشَكْرِهَا لَيْلًا تَمَامَا"
vocabulary:
  - term: "وَبَيْضَاءِ"
    text: "الواو واو رُبَّ، أي: ورُبّ امرأة بيضاء."
  - term: "الْمَعَاصِمِ"
    text: "جمع مِعْصم: «والمعصم: موضع السوار من اليد» [@lisan، ج12 ص408]."
  - term: "إِلْفِ لَهْوٍ"
    text: "معتادة اللهو، يقول المحقق: «الالف لهو معتادة ذلك» [@diwan-asha، ص233]. وفي اللسان: «والإلف: الذي تألفه» [@lisan، ج9 ص11]."
  - term: "بِشَكْرِهَا"
    text: "بفرجها: «والشكر: فرج المرأة وقيل لحم فرجها»، ويُروى بالفتح والكسر: «وروي بالوجهين بيت الأعشى: خلوت بشكرها وشكرها» [@lisan، ج4 ص427]. ويقول المحقق: «الشكر (بفتح الشين) النكاح والفرج» [@diwan-asha، ص233]."
  - term: "تَمَامَا"
    text: "كاملًا."
