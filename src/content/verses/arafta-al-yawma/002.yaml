first: "فَهَاجَتْ شَوْقَ مَحْزُونٍ طَرُوبٍ"
second: "فَأَسْبَلَ دَمْعَهُ فِيهَا سِجَامًا"
vocabulary:
  - term: "طَرُوبٍ"
    text: "«الطَّرَبُ: الفَرَح والحُزْنُ؛ عَنْ ثَعْلَبٍ» [@lisan، ج1 ص557]، وهو هنا الحزن، لأنه «محزون»."
  - term: "سِجَامًا"
    text: "سائلًا منصبًّا، من «سَجَمَتِ الْعَيْنُ الدَّمْعَ» [@lisan، ج12 ص280]."
