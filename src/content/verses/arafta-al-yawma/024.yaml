first: "حَلَفْتُ لَكُمْ عَلَى مَا قَدْ نَعَيْتُمْ"
second: "بِرَأْسِ العَيْنِ إِنْ نَفَضَ السَّقَامَا"
vocabulary:
  - term: "عَلَى مَا قَدْ نَعَيْتُمْ"
    text: "على من نعيتم من قتلاكم، أي أخبرتم بموتهم. وفي تلخيص المحقق: «إنى أقسم لكم بمن قتل من رجالكم فى (رأس العين)» [@diwan-asha، ص232]."
  - term: "رَأْسِ العَيْنِ"
    text: "موضع."
