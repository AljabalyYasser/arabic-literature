explained: false
first: "وَأَدْكَنَ عَاتِقٍ جَحْلٍ سِبَحْلٍ"
second: "صَبَحْتُ بِرَاحِهِ شَرْبًا كِرَامَا"
vocabulary:
  - term: "أَدْكَنَ"
    text: "زقّ لونه أغبر: «الدَّكْن والدَّكَن والدُّكْنة: لَوْنُ الأَدْكن كَلَوْنِ الخَزِّ الَّذِي يضربُ إِلى الغُبرة بَيْنَ الْحُمْرَةِ وَالسَّوَادِ» [@lisan، ج13 ص157]."
  - term: "عَاتِقٍ"
    text: "قديم الخمر: «وَقَدْ عَتَقَت الخمرُ وعَتَّقَها» [@lisan، ج10 ص237]."
  - term: "جَحْلٍ"
    text: "«والجَحْل: الزِّق» [@lisan، ج11 ص101]."
  - term: "سِبَحْلٍ"
    text: "ضخم: «والسِّبَحْل، عَلَى وَزْنِ الهِجَفِّ: الضَّخْم» [@lisan، ج11 ص323]."
  - term: "صَبَحْتُ ... شَرْبًا"
    text: "سقيت صباحًا جماعة يشربون. يقول المحقق: «الشرب (بفتح الشين) جماعة الشاربين» [@diwan-asha، ص233]."
