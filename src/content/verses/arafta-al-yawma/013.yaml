first: "تَشُقُّ اللَّيْلَ وَالسَّبَرَاتِ عَنْهَا"
second: "بِأَتْلَعَ سَاطِعٍ يُشْرِي الزِّمَامَا"
vocabulary:
  - term: "السَّبَرَاتِ"
    text: "«والسَّبَراتُ: جَمْعُ سَبْرَة، وَهِيَ الغَداةُ البارِدَة» [@lisan، ج4 ص341]."
  - term: "بِأَتْلَعَ"
    text: "بعنق طويل: «والأَتْلَعُ والتَّلِعُ والتَّلِيعُ: الطويلُ، وَقِيلَ: الطويلُ العُنُقِ» [@lisan، ج8 ص35]."
