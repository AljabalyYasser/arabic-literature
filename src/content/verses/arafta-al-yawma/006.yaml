first: "أَرَاكَ كَبِرْتَ وَاسْتَحْدَثْتَ خُلْقًا"
second: "وَوَدَّعْتَ الكَوَاعِبَ وَالمُدَامَا"
vocabulary:
  - term: "الكَوَاعِبَ"
    text: "جمع كاعب، وهي الجارية حين يبدو ثديها: «وكَعَبَتِ الجاريةُ، تَكْعُبُ وتَكْعِبُ» [@lisan، ج1 ص719]."
  - term: "المُدَامَا"
    text: "«والمُدامُ والمُدامَةُ: الْخَمْرُ» [@lisan، ج12 ص214]."
