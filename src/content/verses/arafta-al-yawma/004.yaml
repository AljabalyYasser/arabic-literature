explained: false
first: "وَهَلْ يَشْتَاقُ مِثْلُكَ مِنْ رُسُومٍ"
second: "عَفَتْ إِلَّا الأَيَاصِرَ وَالثُّمَامَا"
vocabulary:
  - term: "الأَيَاصِرَ"
    text: "«والإِصارُ والأَيْصَر: الْحَشِيشُ الْمُجْتَمِعُ» [@lisan، ج4 ص23]."
  - term: "الثُّمَامَا"
    text: "«والثُّمام: نَبْتٌ ضَعِيفٌ لَهُ خُوصٌ أَو شَبِيهٌ بالخُوص» [@lisan، ج12 ص81]، يُسدّ به خصاص البيوت، فلم يبق من الديار إلا هذا."
