explained: false
first: "وَقَدْ أَقْرِي الهُمُومَ إِذَا اعْتَرَتْنِي"
second: "عُذَافِرَةً مُضَبَّرَةً عُقَامَا"
vocabulary:
  - term: "أَقْرِي الهُمُومَ"
    text: "أجعل الناقة قِرًى لهمومي، من «وقَرى الضَّيْفَ قِرًى وقَراء: أَضافَه» [@lisan، ج15 ص179]، أي أدفع الهم بالرحلة."
  - term: "عُذَافِرَةً"
    text: "«العُذافِرةُ النَّاقَةُ الشَّدِيدَةُ الأَمِينةُ الوَثِيقة الظَّهِيرةُ» [@lisan، ج4 ص555]."
  - term: "مُضَبَّرَةً"
    text: "مجتمعة الخلق: «وَنَاقَةٌ مُضَبَّرة الخَلْق» [@lisan، ج4 ص479]."
  - term: "عُقَامَا"
    text: "لا تلد، فهي أقوى: «ورجلٌ عَقيمٌ وعَقامٌ: لَا يُولَد لَهُ» [@lisan، ج12 ص413]."
