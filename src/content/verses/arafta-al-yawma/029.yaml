explained: false
first: "تُبَارِي ظِلَّ مُطَّرِدٍ مُمَرٍّ"
second: "إِذَا مَا هُزَّ أَرْعَشَ وَاسْتَقَامَا"
vocabulary:
  - term: "مُطَّرِدٍ"
    text: "رمح مستقيم، من «وأَمرٌ مُطَّردٌ: مُسْتَقِيمٌ» [@lisan، ج3 ص268]."
  - term: "مُمَرٍّ"
    text: "مفتول صلب، من «وأَمْرَرْتُ الحبلَ أُمِرُّه» إذا فتلته [@lisan، ج5 ص169]."
  - term: "أَرْعَشَ"
    text: "اضطرب، من الارتعاش: «إِذا اضْطرب وارْتَعَدَ» [@lisan، ج6 ص99]."
