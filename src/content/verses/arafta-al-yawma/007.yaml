explained: false
first: "فَإِنْ تَكُ لِمَّتِي يَا قَتْلُ أَضْحَتْ"
second: "كَأَنَّ عَلَى مَفَارِقِهَا ثَغَامَا"
vocabulary:
  - term: "لِمَّتِي"
    text: "«واللِّمَّة: شَعْرُ الرأْس» [@lisan، ج12 ص551]."
  - term: "يَا قَتْلُ"
    text: "يريد صاحبته، ناداها مرخَّمًا، أي بحذف آخر الاسم."
  - term: "ثَغَامَا"
    text: "«الثَّغام، بِالْفَتْحِ: نَبْت عَلَى شَكْل الحَلِيِّ» [@lisan، ج12 ص77]، ونَوره أبيض، فشبّه به شيبه."
