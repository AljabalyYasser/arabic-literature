explained: false
first: "إِذَا مَا رُعْتَهَا بِالزَّجْرِ أَجَّتْ"
second: "أَجِيجَ مُصَلَّمٍ يَزْفِي نَعَامَا"
vocabulary:
  - term: "رُعْتَهَا"
    text: "أفزعتها، من «وراعَه الشيءُ ... أَفْزَعَه» [@lisan، ج8 ص136]."
  - term: "أَجَّتْ أَجِيجَ"
    text: "أسرعت إسراع الظليم: «وأَجَّ الظَّليمُ يَئِجُّ ويَؤُجُّ» [@lisan، ج2 ص206]."
  - term: "مُصَلَّمٍ"
    text: "الظليم: «يُقَالُ لِلنَّعَامِ مُصَلَّمٌ لأَنها لَا آذانَ لَهَا» [@lisan، ج12 ص340]."
  - term: "يَزْفِي"
    text: "ينشر جناحيه: «وزَفَى الظَّلِيمُ زَفْياً إِذا نَشر» جناحيه [@lisan، ج14 ص357]."
