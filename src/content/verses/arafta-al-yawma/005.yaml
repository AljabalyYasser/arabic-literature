explained: false
first: "وَقَدْ قَالَتْ قُتَيْلَةُ إِذْ رَأَتْنِي"
second: "وَقَدْ لَا تَعْدَمُ الحَسْنَاءُ ذَامَا"
vocabulary:
  - term: "ذَامَا"
    text: "عيبًا. «الذَّامُ والذَّيْم: العَيْبُ» [@maydani، ج2 ص213]. والشطر مثل: «وَفِي الْمَثَلِ: لَا تَعْدَمُ الحَسْناءُ ذَامًا» [@lisan، ج12 ص223]، أي إن الحسناء تعيب الناس ولها عيبها. وينشد ابن بَرِّيّ الشطر نفسه في بيت لأنس بن نُواس المحاربيّ [@lisan، ج12 ص223]."
