first: "قِفَا نَبْكِ مِنْ ذِكْرَى حَبِيبٍ وَعِرْفَانِ"
second: "وَرَسْمٍ عَفَتْ آيَاتُهُ مُنْذُ أَزْمَانِ"
vocabulary:
  - term: "عِرْفَانِ"
    text: "«أى ما عرف من علامات الدار، فدعاه إلى الوقوف والبكاء» في شرح الأعلم [@diwan-imru-al-qais، ص89]."
  - term: "عَفَتْ آيَاتُهُ"
    text: "«أى تغيرت ودرست علامته» [@diwan-imru-al-qais، ص89]."
