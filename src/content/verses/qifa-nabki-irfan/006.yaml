first: "فَإِمَّا تَرَيْنِي فِي رِحَالَةِ جَابِرٍ"
second: "عَلَى حَرَجٍ كَالْقَرِّ تَخْفِقُ أَكْفَانِي"
meaning: "فإن تريني اليوم محمولًا على خشبات جابر، على سرير كهودج النساء، وثيابي تضطرب في الريح كأنها أكفان، فاعلمي أني طالما كررت وراء المكروب وفككت الأسير. وجواب الشرط في البيت التالي."
vocabulary:
  - term: "فَإِمَّا"
    text: "«إنْ» الشرطية ومعها «ما» الزائدة."
  - term: "رِحَالَةِ جَابِرٍ"
    text: "الرِّحالة في الأصل مركب من جلد كالسرج: «والرحالة سرج من جلود ليس فيه خشب» [@lisan، ج11 ص275]. وهي هنا في شرح الأعلم: «خشبات كان يحمل عليها امرؤ القيس وكان مريضا، وهى الحرج»، وجابر «من بنى تغلب» [@diwan-imru-al-qais، ص90]. وفي اللسان أن جابرًا «اسم رجل نجار» [@lisan، ج11 ص279]."
  - term: "حَرَجٍ"
    text: "سرير من خشب يُحمل عليه المريض أو الميت، وهو الذي سمّاه رحالة. ويحتمل عند الأعلم أن يريد: ميتًا محمولًا «على الحرج، وهو نعش النصارى» [@diwan-imru-al-qais، ص90]."
  - term: "كَالْقَرِّ"
    text: "«القر: مركب من مراكب النساء كالهودج» [@diwan-imru-al-qais، ص90]."
  - term: "تَخْفِقُ أَكْفَانِي"
    text: "تضطرب ثيابي في الريح، «أى ثيابى؛ فصير ثيابه أكفانا لمرضه» [@diwan-imru-al-qais، ص90]."
context: "هذا البيت هو الذي ربط به الرواة القصيدة بآخر أيامه. يقول ابن قُتَيْبة، بعد خبر الحلة المسمومة وتقرّح جسده في طريقه من بلاد الروم: «وكان يحمله جابر بن حنى التغلبى، فذلك قوله» [@ibn-qutayba، ج1 ص110]. وبهذا الخبر نفسه يردّ شوقي ضيف القصيدة، لأنها «تذكر خشبات كان يحمل عليها فى مرضه، فهى تتصل بقصة رحلته إلى قيصر» [@deif، ج1 ص246]. وفي القصيدة هو شطر الشرط، وجوابه في البيت السابع: «فيا ربّ مكروب كررت وراءه»، فالرجل المحمول يذكّر من تراه ضعيفًا بماضيه فارسًا."
syntax:
  - "«إمّا» أصلها «إنْ» الشرطية أُدغمت في «ما» الزائدة للتوكيد."
  - "«تَرَيْنِي» فعل الشرط مجزوم بحذف النون، والأصل «تَرَيْنَ» لخطاب المؤنثة، والياء فاعل، والنون الباقية نون الوقاية، والياء الأخيرة مفعول به. والخطاب لامرأة."
  - "«فِي رِحَالَةِ جَابِرٍ» متعلق بمحذوف حال من ياء المتكلم، أي: محمولًا في رحالة جابر. و«عَلَى حَرَجٍ» بدل من الجار والمجرور قبله، يفسّر الرحالة."
  - "«كَالْقَرِّ» صفة لـ«حرج». وجملة «تَخْفِقُ أَكْفَانِي» حال ثانية، و«أكفاني» فاعل «تخفق»."
  - "وجواب الشرط في البيت التالي مقرونًا بالفاء: «فيا ربّ مكروب...»، فلا يتم معنى البيت إلا به. وهذا ما يسمّى التضمين: أن يتعلق البيت بما بعده فلا يستقل بمعناه."
morphology:
  - "«رِحالة» على «فِعالة»، ويُجمع على «رحائل»."
  - "«حَرَج» على «فَعَل»."
  - "«أكفان» جمع «كَفَن» على «أفعال»."
  - "«تَخْفِق» مضارع «خفق يخفِق»، أي اضطرب وتحرّك."
rhetoric:
  thesis: "صورة الفارس الملك وقد صار محمولًا على خشبات، يرسمها ليمحوها في البيت التالي بذكر ماضيه."
  devices:
    - title: "الاستعارة في «رحالة جابر»"
      text: "سمّى الخشبات التي يُحمل عليها «رحالة»، وهي مركب الفارس على فرسه. يقول صاحب اللسان: «إنما أراد به الحرج وليس ثم رحالة في الحقيقة، هذا كما يقال جاء فلان على ناقة الحذاء، يعنون النعل» [@lisan، ج11 ص279]. فهو يعير المشبه اسم المشبه به كما يقول عبد القاهر: «تجيء إلى اسم المشبه به فتعيره المشبه» [@dalail، ص67]. وفي الاستعارة سخرية مرّة: الفارس لا يزال على «رحالة»، لكنها خشبات المرض."
    - title: "التشبيه في «كالقرّ»"
      text: "شبّه الحرج الذي يُحمل عليه بالقَرّ، وهو هودج النساء. والوجه بيّن: خشب يُحمل على الأكتاف أو الإبل وراكبه لا يمشي. وهو تشبيه عبد القاهر الذي يُدرك الشبه فيه «من جهة أمرٍ بيّنٍ لا يحتاج إلى تأوّل» [@asrar، ص90]. وفيه أن الملك المقاتل يُحمل كما تُحمل النساء، وهذه قراءتنا."
    - title: "تسمية الثياب «أكفانًا»"
      text: "في «تَخْفِقُ أَكْفَانِي» سمّى ثيابه أكفانًا لما تؤول إليه، يقول الأعلم: «فصير ثيابه أكفانا لمرضه» [@diwan-imru-al-qais، ص90]. فهو يرى موته قبل أن يقع."
    - title: "الشرط المعلّق"
      text: "يبدأ البيت بـ«فإمّا»، ولا يأتي الجواب إلا في البيت التالي. فيبقى القارئ مع صورة الضعف بيتًا كاملًا، ثم يأتيه الجواب بماضي القوة: «فيا ربّ مكروب كررت وراءه». والمقابلة بين البيتين هي معنى المقطوعة."
  connection: "وجواب الشرط في البيت السابع: «فيا ربّ مكروب كررت وراءه / وعانٍ فككت الغلّ عنه ففدّاني»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ النون المكسورة، يتبعها وصل بالياء"
  scansion: "فَإِمْمَا / تَرَيْنِي فِي / رِحَالَ / تِ جَابِرِنْ = فعولن / مفاعيلن / فعولُ / مفاعلن — عَلَى حَ / رَجِنْ كَلْقَرْ / رِ تَخْفِ / قُ أَكْفَانِي = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "دخل القبض «فعولن» الثانية في الصدر، والأولى والثانية في العجز، فصارت «فعولُ» [@atiq، ص29]. والعروض مقبوضة «مفاعلن»، والضرب صحيح «مفاعيلن»."
