explained: false
first: "ذَكَرْتُ بِهَا الْحَيَّ الْجَمِيعَ فَهَيَّجَتْ"
second: "عَقَابِيلَ سُقْمٍ مِنْ ضَمِيرٍ وَأَشْجَانِ"
vocabulary:
  - term: "الْحَيَّ الْجَمِيعَ"
    text: "«المجتمعون زمن مرتبعهم» [@diwan-imru-al-qais، ص89]، أي أيام كانوا نازلين معًا."
  - term: "عَقَابِيلَ"
    text: "«البقايا، ولا واحد لها، ويقال: هى وجع فى الفؤاد» [@diwan-imru-al-qais، ص89]."
  - term: "مِنْ ضَمِيرٍ"
    text: "مما أضمره في نفسه، «أى كنت أنطوى على ما بقى من سقمى لفراقهم إلى أن هيجته الدار فأظهرته» [@diwan-imru-al-qais، ص89]."
  - term: "أَشْجَانِ"
    text: "أحزان."
sources:
  - source: "diwan-imru-al-qais"
    loc: "ص89"
