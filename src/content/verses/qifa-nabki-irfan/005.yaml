first: "إِذَا الْمَرْءُ لَمْ يَخْزُنْ عَلَيْهِ لِسَانَهُ"
second: "فَلَيْسَ عَلَى شَيْءٍ سِوَاهُ بِخَزَّانِ"
meaning: "إذا لم يحفظ الإنسان لسانه، فيكتم به سرّه، فلن يحفظ شيئًا غيره، لا سرّ غيره ولا غير ذلك. يقول الأعلم: «إذا كان المرء لا يحفظ سره فهو أحرى ألا يحفظ سر غيره» [@diwan-imru-al-qais، ص90]."
vocabulary:
  - term: "يَخْزُنْ"
    text: "يحفظ ويكتم. وأصل الخزن في المال: «خزن الشيء يخزنه خزنا واختزنه: أحرزه وجعله في خزانة» [@lisan، ج13 ص139]، وفي شرح الأعلم: «يستر ويحفظ» [@diwan-imru-al-qais، ص90]."
  - term: "عَلَيْهِ"
    text: "على نفسه، أي يحبس لسانه عنده فلا يطلقه بما يضرّه."
  - term: "لِسَانَهُ"
    text: "أراد ما يقوله اللسان، أي السر، قال الأعلم: «وكنى باللسان عن السر الذى يحفظه ويذيعه» [@diwan-imru-al-qais، ص90]."
  - term: "بِخَزَّانِ"
    text: "بكثير الحفظ لما يُستودع."
context: "يأتي البيت في الديوان بعد أن بكى على الرسم وسالت دموعه في ردائه، وقبل أن يصف نفسه مريضًا محمولًا. فكأنه يعتذر عن دموع أظهرت ما كان «ينطوي» عليه في البيت الثالث، أو يقرر أن من لا يملك نفسه لا يُؤتمن. وهذه قراءتنا لموضعه. وعند ابن قُتَيْبة يأتي بعد البيتين 6 و7 [@ibn-qutayba، ج1 ص110]. ثم انفصل البيت عن قصيدته فصار مثلًا في كتمان السر: يرويه المُبَرِّد لامرئ القَيْس في باب حفظ السر، بعد قول عمرو بن العاص فيمن أفشى سره إلى صديقه فأذاعه: «أنا كنت أحق بصيانته» [@kamil، ج2 ص228]، وهو معنى البيت نفسه."
syntax:
  - "«إذا» ظرف لما يُستقبل من الزمان، فيه معنى الشرط. و«الْمَرْءُ» فاعل لفعل محذوف يفسّره ما بعده، والتقدير: إذا لم يخزن المرءُ، لأن «إذا» لا يليها إلا فعل في مذهب البصريين."
  - "«لَمْ يَخْزُنْ» فعل مضارع مجزوم بـ«لم»، وفاعله ضمير يعود على المرء، و«لِسَانَهُ» مفعول به. و«عَلَيْهِ» متعلق بـ«يخزن»، أي يحفظه على نفسه."
  - "«فَلَيْسَ» الفاء رابطة لجواب الشرط، لأن الجواب جملة فعلها جامد، واسم «ليس» ضمير يعود على المرء."
  - "«عَلَى شَيْءٍ» متعلق بـ«خزّان»، و«سِوَاهُ» صفة لـ«شيء»، أي على شيء غيرِه. و«بِخَزَّانِ» الباء زائدة لتوكيد النفي، و«خزّان» خبر «ليس» مجرور لفظًا منصوب محلًّا."
morphology:
  - "«يَخْزُن» مضارع «خَزَن» من باب «نَصَر يَنْصُر»، ومصدره «الخَزْن»."
  - "«خَزّان» صيغة مبالغة على «فَعّال» من الخزن، أي كثير الحفظ."
  - "«سِوَى» اسم بمعنى «غير»، يضاف إلى ما بعده، وهو هنا مضاف إلى الضمير."
rhetoric:
  thesis: "حكمة في كتمان السر، مبنية على قياس: من عجز عن حفظ نفسه فهو عن حفظ غيره أعجز."
  devices:
    - title: "الكناية في «لسانه»"
      text: "لم يقل «سرّه»، بل قال «لسانه»، لأن السرّ يخرج من اللسان. يقول الأعلم: «وكنى باللسان عن السر» [@diwan-imru-al-qais، ص90]. وهذه الكناية كما يصفها عبد القاهر: المتكلم يريد معنى «فلا يذكره باللفظ الموضوع له في اللغة، ولكن يجيء إلى معنى هو تاليه ورِدْفه في الوجود» [@dalail، ص66]. فحفظ اللسان يلزم منه حفظ السر."
    - title: "الاستعارة في «يخزن» و«خزّان»"
      text: "الخزن في أصله للمال يُحرز في الخزانة [@lisan، ج13 ص139]. فجعل الكلام كنزًا يُحبس، والرجل خازنًا عليه. وهي الاستعارة التي يحدّها عبد القاهر بأن «تريد تشبيه الشيء بالشيء، فتدع أن تفصح بالتشبيه وتظهره، وتجيء إلى اسم المشبه به فتعيره المشبه وتجريه عليه» [@dalail، ص67]."
    - title: "ردّ العجز على الصدر"
      text: "«يَخْزُنْ» في الصدر و«خَزَّانِ» في آخر العجز من مادة واحدة، فيعود آخر البيت على أوله، ويستقر الحكم في القافية. وهو جناس اشتقاق."
    - title: "القياس بالأولى"
      text: "الشرط وجوابه حجة صغيرة: من لم يحفظ ما هو عليه، أي نفسه ولسانه، فليس بحافظ لما هو لغيره. وبهذا فسّره الأعلم: «فهو أحرى ألا يحفظ سر غيره» [@diwan-imru-al-qais، ص90]. ولهذا الإحكام صار البيت مثلًا مستقلًّا عن قصيدته."
  connection: "ثم يلتفت إلى امرأة تراه مريضًا محمولًا: «فإما تريني في رحالة جابر»."
prosody:
  meter: "البحر الطويل"
  rhyme: "الرَّوِيّ النون المكسورة، يتبعها وصل بالياء"
  scansion: "إِذَلْمَرْ / ءُ لَمْ يَخْزُنْ / عَلَيْهِ / لِسَانَهُو = فعولن / مفاعيلن / فعولُ / مفاعلن — فَلَيْسَ / عَلَى شَيْئِنْ / سِوَاهُ / بِخَزْزَانِي = فعولُ / مفاعيلن / فعولُ / مفاعيلن"
  note: "دخل القبض، وهو حذف الخامس الساكن، «فعولن» الثانية في الصدر، والأولى والثانية في العجز، فصارت «فعولُ» [@atiq، ص29]. والعروض مقبوضة «مفاعلن» كسائر الطويل، والضرب صحيح «مفاعيلن» كبقية القصيدة."
