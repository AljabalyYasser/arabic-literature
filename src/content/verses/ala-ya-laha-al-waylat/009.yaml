explained: false
first: "لَقَدْ صَبَرَتْ لِلْمَوْتِ كَعْبٌ وَحَافَظَتْ"
second: "كِلَابٌ وَمَا أَنْتُمْ هُنَاكَ لِمَنْ رَأَى"
vocabulary:
  - term: "كَعْبٌ ... كِلَابٌ"
    text: "بطنان من بني عامر بن صَعْصَعة، خصوم أبيها يوم جَبَلة: كعب بن ربيعة [@lisan، ج1 ص720]، وكلاب بن ربيعة [@lisan، ج4 ص608]. تشهد لهما بالثبات، وتنفي أن تكون عَبْس قد قاتلت."
  - term: "حَافَظَتْ"
    text: "حمت ما يجب عليها أن تحميه."
