explained: false
first: "لَقَدْ ضَرَبُوا وَجْهًا عَلَيْهِ مَهَابَةٌ"
second: "وَمَا تَحْفِلُ الصُّمُّ الجَنَادِلُ مَنْ رَدَى"
vocabulary:
  - term: "تَحْفِلُ"
    text: "تبالي."
  - term: "الصُّمُّ الجَنَادِلُ"
    text: "الصخور الصلبة."
  - term: "رَدَى"
    text: "يقول محققو «الأغاني»: «وردى هنا: رمى» [@aghani-dk، ج11 ص145، الحاشية]. أي لا تبالي الحجارة الصمّ بمن رمى بها، وكذلك الميت لا يحس بضربهم، فلا فخر لهم فيه."
