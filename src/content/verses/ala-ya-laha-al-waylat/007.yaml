explained: false
first: "لِيَجْزِيَهُمْ بِالقَتْلِ قَتْلًا مُضَعَّفًا"
second: "وَمَا فِي دِمَاءِ الحُمْسِ يَا مَالُ مِنْ بَوَا"
vocabulary:
  - term: "مُضَعَّفًا"
    text: "مضاعفًا."
  - term: "الحُمْسِ"
    text: "في اللسان: «والحمس: قريش لأنهم كانوا يتشددون في دينهم وشجاعتهم فلا يطاقون» [@lisan، ج6 ص56]. وكان من الحُمْس قبائل غير قريش، ويظهر أنها تعني بني عامر."
  - term: "يَا مَالُ"
    text: "يا مالك، بحذف آخر الاسم في النداء."
  - term: "بَوَا"
    text: "يقول محققو «الأغاني»: «البواء (بالمد، وقصر هنا للشعر): السواء والتكافؤ؛ يقال فلان بواء فلان إذا كان كفؤه إذا قتل به» [@aghani-dk، ج11 ص145، الحاشية]. أي ليس في دمائهم كفء لدم لَقِيط."
