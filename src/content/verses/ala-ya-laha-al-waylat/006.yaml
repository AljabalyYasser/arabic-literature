explained: false
first: "فَإِنْ تُعْقِبِ الأَيَّامُ مِنْ عَامِرٍ يَكُنْ"
second: "عَلَيْهِمْ حَرِيقًا لَا يُرَامُ إِذَا سَمَا"
vocabulary:
  - term: "تُعْقِبِ الأَيَّامُ مِنْ عَامِرٍ"
    text: "تأتي الأيام بالعاقبة من بني عامر، أي بالثأر منهم."
  - term: "لَا يُرَامُ"
    text: "لا يُطاق ولا يُقترب منه."
  - term: "سَمَا"
    text: "ارتفع."
sources:
