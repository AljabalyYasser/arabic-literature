explained: false
first: "غَدَرْتُمْ وَلَكِنْ كُنْتُمُ مِثْلَ خُضَّبٍ"
second: "أَصَابَ لَهَا القَنَّاصُ مِنْ جَانِبِ الشَّرَى"
vocabulary:
  - term: "خُضَّبٍ"
    text: "يقول محققو «الأغاني»: «الخضب: النعام. والظليم الخاضب: الذي احمرت ساقاه من أكل الربيع» [@aghani-dk، ج11 ص145، الحاشية]. فهم في فرارهم كالنعام إذا رأت الصائد."
  - term: "أَصَابَ"
    text: "«سقط ونزل ضد أصعد» [@aghani-dk، ج11 ص145، الحاشية]."
  - term: "الشَّرَى"
    text: "«موضع» [@aghani-dk، ج11 ص145، الحاشية]."
