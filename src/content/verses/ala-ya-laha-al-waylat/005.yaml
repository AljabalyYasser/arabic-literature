first: "فَمَا ثَأْرُهُ فِيكُمْ وَلَكِنَّ ثَأْرَهُ"
second: "شُرَيْحٌ وَأَرْدَتْهُ الأَسِنَّةُ إِذْ هَوَى"
vocabulary:
  - term: "شُرَيْحٌ"
    text: "شُرَيْح بن الأحوص من بني عامر، وفي رواية أبي عُبَيْدة: «وأما العلماء فلا يشكون أن شريحا قتله» [@aghani-dk، ج11 ص144]."
  - term: "أَرْدَتْهُ"
    text: "أهلكته."
  - term: "هَوَى"
    text: "سقط."
