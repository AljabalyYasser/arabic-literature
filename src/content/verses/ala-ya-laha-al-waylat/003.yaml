first: "فَلَوْ أَنَّكُمْ كُنْتُمْ غَدَاةَ لَقِيتُمُ"
second: "لَقِيطًا صَبَرْتُمْ لِلْأَسِنَّةِ وَالقَنَا"
vocabulary:
  - term: "صَبَرْتُمْ"
    text: "ثبتّم. وجواب «لو» محذوف، يقدّره محققو «الأغاني»: «أي لأصابكم منا القتل الذريع» [@aghani-dk، ج11 ص145، الحاشية]."
  - term: "القَنَا"
    text: "الرماح."
