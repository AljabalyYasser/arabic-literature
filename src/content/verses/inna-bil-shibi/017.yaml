first: "فَاحْتَسَوْا أَنْفَاسَ نَوْمٍ فَلَمَّا"
second: "هَوَّمُوا رُعْتَهُمُ فَاشْمَعَلُّوا"
vocabulary:
  - term: "احْتَسَوْا أَنْفَاسَ نَوْمٍ"
    text: "ناموا نوماً قليلاً."
  - term: "هَوَّمُوا"
    text: "غلبهم النعاس."
  - term: "اشْمَعَلُّوا"
    text: "تفرّقوا مسرعين، «واشمعلّوا إذا بادروا فيه وتفرّقوا» [@lisan، ج11 ص372]."
