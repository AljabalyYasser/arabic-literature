explained: false
first: "وَبِمَا أَبْرَكَهَا فِي مُنَاخٍ"
second: "جَعْجَعٍ يَنْقَبُ فِيهِ الأَظَلُّ"
vocabulary:
  - term: "أَبْرَكَهَا"
    text: "أناخ إبله."
  - term: "جَعْجَعٍ"
    text: "أرض متطامنة غليظة، «الجعجع والجفجف من الأرض المتطامن» [@lisan، ج9 ص30]."
  - term: "يَنْقَبُ فِيهِ الأَظَلُّ"
    text: "يتقرّح فيه باطن خفّ البعير."
