first: "شَامِسٌ فِي القُرِّ حَتَّى إِذَا مَا"
second: "ذَكَتِ الشِّعْرَى فَبَرْدٌ وَظِلُّ"
vocabulary:
  - term: "شَامِسٌ فِي القُرِّ"
    text: "كالشمس في البرد، يدفأ به من حوله."
  - term: "ذَكَتِ الشِّعْرَى"
    text: "اتّقد الحرّ بطلوع الشعرى."
  - term: "فَبَرْدٌ وَظِلُّ"
    text: "فهو لهم برد وظل."
