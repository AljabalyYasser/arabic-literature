explained: false
first: "وَعِتَاقُ الطَّيْرِ تَغْدُو بِطَانًا"
second: "تَتَخَطَّاهُمْ فَمَا تَسْتَقِلُّ"
vocabulary:
  - term: "عِتَاقُ الطَّيْرِ"
    text: "جوارحها، و«عتاق الطير العقبان» عند ابن الأعرابي [@lisan، ج1 ص621]."
  - term: "بِطَانًا"
    text: "ممتلئة البطون."
  - term: "مَا تَسْتَقِلُّ"
    text: "لا تقدر على الطيران من الشِّبَع."
