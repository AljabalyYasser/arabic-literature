first: "خَلَّفَ العِبْءَ عَلَيَّ وَوَلَّى"
second: "أَنَا بِالعِبْءِ لَهُ مُسْتَقِلُّ"
vocabulary:
  - term: "العِبْءَ"
    text: "الحمل الثقيل، يعني الثأر."
  - term: "مُسْتَقِلُّ"
    text: "حامل له، يقال: «أقلّ الشيء يقلّه واستقلّه يستقلّه إذا رفعه وحمله» [@lisan، ج11 ص565]."
