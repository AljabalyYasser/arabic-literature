explained: false
first: "إِنَّ بِالشِّعْبِ الَّذِي دُونَ سَلْعٍ"
second: "لَقَتِيلًا دَمُهُ مَا يُطَلُّ"
vocabulary:
  - term: "بِالشِّعْبِ"
    text: "بالطريق في الجبل."
  - term: "سَلْعٍ"
    text: "جبل بالمدينة [@lisan، ج15 ص193]، ويذكر الأَسَد عن ياقوت أن سلعًا أيضًا «جبل في ديار هذيل» [@asad، ص460، الحاشية]."
  - term: "مَا يُطَلُّ"
    text: "لا يُهدر بلا ثأر [@lisan، ج11 ص405]."
