explained: false
first: "مُسْبِلٌ فِي الحَيِّ أَحْوَى رِفَلٌّ"
second: "وَإِذَا يَغْزُو فَسِمْعٌ أَزَلُّ"
vocabulary:
  - term: "مُسْبِلٌ"
    text: "مرخٍ ثوبه."
  - term: "أَحْوَى"
    text: "في شفتيه سمرة."
  - term: "رِفَلٌّ"
    text: "يجرّ ثوبه، «ورفل في ثيابه يرفل إذا أطالها وجرّها متبختراً» [@lisan، ج11 ص292]."
  - term: "سِمْعٌ أَزَلُّ"
    text: "«والسِّمْع الأزلّ الذئب الأرسح يتولد بين الذئب والضبع» [@lisan، ج11 ص309]."
