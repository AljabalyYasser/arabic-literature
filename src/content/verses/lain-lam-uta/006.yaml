explained: false
first: "مَعَاذَ اللهِ يَرْضَعُنِي حَبَرْكَى"
second: "قَصِيرُ الشِّبْرِ مِنْ جُشَمِ بْنِ بَكْرِ"
vocabulary:
- term: "حَبَرْكَى"
  text: "في الشرح: «والحبركى: القصير الرِّجلين» [@diwan-khansa، ص372]. وعند القالِيّ: «الحبركي: القصير الرجلين الطويل الظهر» [@qali، ج2 ص162]."
- term: "قَصِيرُ الشِّبْرِ"
  text: "قليل الخير. عند القالِيّ: «والشّبر: الخير والعطاء» [@qali، ج2 ص162]."
- term: "جُشَمِ بْنِ بَكْرِ"
  text: "رهط دُرَيْد. في الشرح: «وجُشَم: رهط دريد» [@diwan-khansa، ص372]."
