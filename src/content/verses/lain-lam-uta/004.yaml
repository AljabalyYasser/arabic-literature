explained: false
first: "أَتُكْرِهُنِي هُبِلْتَ عَلَى دُرَيْدٍ"
second: "وَقَدْ أَصْفَحْتُ سَيِّدَ آلِ بَدْرِ"
vocabulary:
- term: "هُبِلْتَ"
  text: "دعاء عليه بالموت، من قولهم: «هَبِلَتْهُ أُمُّه: ثَكِلَتْه» [@lisan، ج11 ص686]."
- term: "أَصْفَحْتُ"
  text: "رددتُ. في الشرح المنسوب إلى ثَعْلَب: «يقال: أصفحتُ الرجل: رددته. ويقال: أصفحه عن حاجته: ردّه» [@diwan-khansa، ص372]."
