explained: false
first: "بِأَنَّ الْمَرْءَ لَمْ يُخْلَقْ حَدِيدًا"
second: "وَلَا هَضْبًا تَوَقَّلَهُ الْوِبَارُ"
vocabulary:
  - term: "هَضْبًا"
    text: "«الهَضْبُ: الجبلُ» [@aghani-dk، ج2 ص151]."
  - term: "تَوَقَّلَهُ"
    text: "صعد فيه. وفي «الأغاني»: «تَوَقَّاهُ» [@aghani-dk، ج2 ص151]."
  - term: "الْوِبَارُ"
    text: "«جمع وَبْر» [@aghani-dk، ج2 ص151]، وهي دويبة صغيرة تسكن الجبال."
