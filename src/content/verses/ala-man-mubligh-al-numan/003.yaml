explained: false
first: "وَلَكِنْ كَالشِّهَابِ سَنَاهُ يَخْبُو"
second: "وَحَادِي الْمَوْتِ عَنْهُ مَا يَحَارُ"
vocabulary:
  - term: "الشِّهَابِ"
    text: "«السراج» [@aghani-dk، ج2 ص151]."
  - term: "سَنَاهُ"
    text: "ضوؤه."
  - term: "يَخْبُو"
    text: "«يَطْفَأ» [@aghani-dk، ج2 ص151]."
  - term: "حَادِي الْمَوْتِ"
    text: "سائقه، كحادي الإبل الذي يسوقها بالغناء."
  - term: "مَا يَحَارُ"
    text: "لا يتردد ولا يرجع."
