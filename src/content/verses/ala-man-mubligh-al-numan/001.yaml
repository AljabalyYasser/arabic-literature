first: "أَلَا مَنْ مُبْلِغُ النُّعْمَانِ عَنِّي"
second: "عَلَانِيَةً وَمَا يُغْنِي السِّرَارُ"
vocabulary:
  - term: "السِّرَارُ"
    text: "المسارّة، أي الكلام في السر؛ يقول: لا ينفعني الآن أن أُسرّ إليه. وفي «الأغاني»: «عَلَانِيَةً فَقَدْ ذَهَبَ السِّرَارُ» [@aghani-dk، ج2 ص151]."
