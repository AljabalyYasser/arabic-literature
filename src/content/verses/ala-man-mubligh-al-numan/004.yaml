first: "فَهَلْ مِنْ خَالِدٍ إِمَّا هَلَكْنَا"
second: "وَهَلْ بِالْمَوْتِ يَا لَلنَّاسِ عَارُ"
vocabulary:
  - term: "إِمَّا هَلَكْنَا"
    text: "إن هلكنا، و«ما» زائدة."
  - term: "يَا لَلنَّاسِ"
    text: "استغاثة يُنادى بها الناس ليشهدوا."
