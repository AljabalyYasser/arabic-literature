explained: false
first: "يَخْرُجْنَ مِنْهَا وَقَدْ بُلَّتْ رَحَائِلُهَا"
second: "بِالْمَاءِ يَرْكُضُهَا الْمُرْدُ الْغَطَارِيفُ"
vocabulary:
- term: "رَحَائِلُهَا"
  text: "«والرحائل جمع رحالة وهي مثل الرحل وكانت الرحايل سروج العرب» [@diwan-antara، ص271]."
- term: "بُلَّتْ ... بِالْمَاءِ"
  text: "يعني العرق والدم: «يخرجن من الغارة وقد بلت رحائلها بالعرق والدم» [@diwan-antara، ص271]."
- term: "الْمُرْدُ"
  text: "الشبان الذين لم تنبت لحاهم بعد [@diwan-antara، ص271]."
- term: "الْغَطَارِيفُ"
  text: "«والغطاريف الأسخياء» [@diwan-antara، ص271]، وأصل الغِطْرِيف «البازي فاستعير للرجل» [@diwan-antara، ص272]."
sources:
- source: "diwan-antara"
  loc: "ص271–272"
  url: "https://archive.org/details/3562pdf/page/n276/mode/1up"
status: "review"
