explained: false
first: "تَنْسَى بَلَائِي إِذَا مَا غَارَةٌ لَقِحَتْ"
second: "تَخْرُجُ مِنْهَا الطُّوَالَاتُ السَّرَاعِيفُ"
vocabulary:
- term: "تَنْسَى"
  text: "استفهام حُذفت همزته: «أراد أتنسى، فحذف» [@diwan-antara، ص271]."
- term: "لَقِحَتْ"
  text: "«ومعنى لقحت اشتدت وعظمت وأصله في الناقة اذا حملت» [@diwan-antara، ص271]. وهي في الطبعة بفتح القاف، وضبطناها بالكسر كما في لسان العرب: «ولَقِحت الحربُ كِشَافاً عَلَى الْمِثْلِ» [@lisan، ج9 ص301]."
- term: "الطُّوَالَاتُ السَّرَاعِيفُ"
  text: "«والطوالات جمع طوالة من الخيل، والسراعيف جمع سرعوفة وهي الجرادة» [@diwan-antara، ص271]، أي الخيل الطويلة الخفيفة كالجراد."
