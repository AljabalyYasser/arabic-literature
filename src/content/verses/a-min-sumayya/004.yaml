  text: "قال الأَعْلَم: «يخبر عن نفسه ويعترف لأبيه بالعبودية، لأنه كان ابن أمة، وقال هذا قبل أن يدعيه أبوه ويعتقه ويلحقه بنسبه» [@diwan-antara، ص271]."
