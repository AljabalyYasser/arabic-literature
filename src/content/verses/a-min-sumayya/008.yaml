explained: false
first: "لَا شَكَّ لِلْمَرْءِ أَنَّ الدَّهْرَ ذُو خَلَفٍ"
second: "فِيهِ تَفَرَّقُ ذُو إِلْفٍ وَمَأْلُوفُ"
vocabulary:
- term: "ذُو خَلَفٍ"
  text: "يذهب فيه شيء ويجيء آخر مكانه، من قولهم: «وخَلَفَتِ الفاكهةُ بعضُها بَعْضًا خَلَفاً وخِلْفَةً إِذَا صَارَتْ خَلَفاً مِنَ الأُولى» [@lisan، ج9 ص86]."
- term: "تَفَرَّقُ ذُو إِلْفٍ وَمَأْلُوفُ"
  text: "يتفرّق فيه الأليف ومن يألفه، و«الإِلْف: الأَلِيفُ» [@lisan، ج9 ص11]. و«تَفَرَّقُ» أصلها تَتَفَرَّق."
