explained: false
first: "قَدْ أَطْعَنُ الطَّعْنَةَ النَّجْلَاءَ عَنْ عُرُضٍ"
second: "تَصْفَرُّ كَفُّ أَخِيهَا وَهْوَ مَنْزُوفُ"
vocabulary:
- term: "النَّجْلَاءَ"
  text: "«والنجلاء الواسعة» [@diwan-antara، ص272]."
- term: "عَنْ عُرُضٍ"
  text: "«أي أعترض القرن فأطعنه» [@diwan-antara، ص272]، والقِرْن: النظير في الحرب."
- term: "كَفُّ أَخِيهَا"
  text: "«يعني صاحب الطعنة»، وخصّ الكفّ «لأنها أسرع أعضاء الميت اصفرارا» [@diwan-antara، ص272]."
- term: "مَنْزُوفُ"
  text: "«والمنزوف الذي نزف دمه، ولم يبق منه شيء» [@diwan-antara، ص272]."
sources:
- source: "diwan-antara"
  loc: "ص272"
