explained: false
first: "أَمِنْ سُمَيَّةَ دَمْعُ الْعَيْنِ تَذْرِيفُ"
second: "لَوْ أَنَّ ذَا مِنْكِ قَبْلَ الْيَوْمِ مَعْرُوفُ"
vocabulary:
- term: "سُمَيَّةَ"
  text: "امرأة أبيه، وقيل: سُهَيّة [@aghani-dk، ج8 ص237]."
- term: "تَذْرِيفُ"
  text: "«التذريف سيلان الدمع وهو مصدر وضعه موضع الصفة» [@diwan-antara، ص270]: أي دمع العين ذارف."
- term: "لَوْ أَنَّ ذَا مِنْكِ قَبْلَ الْيَوْمِ مَعْرُوفُ"
  text: "تمنٍّ، قال الأَعْلَم: «أي ليتني عرفت منها هذا البكاء والإشفاق علي قبل اليوم» [@diwan-antara، ص270]."
