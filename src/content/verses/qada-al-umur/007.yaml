explained: false
first: "وَشَهِدْتُ أَنْجِيَةَ الْأُفَاقَةِ عَالِيًا"
second: "كَعْبِي وَأَرْدَافُ الْمُلُوكِ شُهُودُ"
vocabulary:
  - term: "أَنْجِيَةَ"
    text: "«من المناجاة، واحدها نجي» [@diwan-labid، ص35]، أي مجالس القوم يتشاورون."
  - term: "الْأُفَاقَةِ"
    text: "«موضع» [@diwan-labid، ص35]."
  - term: "عَالِيًا كَعْبِي"
    text: "«فلجت عليهم» [@diwan-labid، ص35]، أي غلبتهم."
  - term: "أَرْدَافُ الْمُلُوكِ"
    text: "«الذين هم دونهم. ردف الملك: الذي معه لا يفارقه» [@diwan-labid، ص35]."
sources:
  - source: "diwan-labid"
    loc: "ص35"
