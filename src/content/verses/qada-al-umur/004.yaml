first: "خَلَّوْا ثِيَابَهُمُ عَلَى عَوْرَاتِهِمْ"
second: "فَهُمُ بِأَفْنِيَةِ الْبُيُوتِ هُمُودُ"
vocabulary:
  - term: "خَلَّوْا ثِيَابَهُمُ"
    text: "«شدوها بالأخلة حين أيقنوا بالموت والهلاك» [@diwan-labid، ص34]. والأَخِلّة: جمع خِلال، وهو العود يُشدّ به الثوب."
  - term: "أَفْنِيَةِ الْبُيُوتِ"
    text: "«ساحاتها» [@diwan-labid، ص34]."
  - term: "هُمُودُ"
    text: "«موتى» [@diwan-labid، ص34]."
