date: "2026-10-07"
title: "ثلاثة مسارات جديدة: زهير والنابغة وعنترة"
text: "اكتملت بها مسارات أعلام التكوين الثمانية. لكل منهم حياته وأخباره بدرجاتها، وقصيدته الأم مشروحة بيتًا بيتًا (معلقة زهير، و«يا دار مية» للنابغة، ومعلقة عنترة)، ثم قصائد أخرى تُقرأ كاملة: إحدى عشرة لزهير، وتسع للنابغة، وسبع لعنترة. وفي آخر مسار عنترة فصل عما بقي له من شعر وما زادته عليه السيرة الشعبية."
