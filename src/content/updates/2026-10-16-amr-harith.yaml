date: "2026-10-16"
title: "معلقتا عمرو بن كلثوم والحارث بن حلزة كاملتين"
text: "قراءة عميقة لكل بيت في المعلقتين على رواية ابن الأنباري: نونية عمرو بن كلثوم في فخر تغلب، وهمزية الحارث بن حلزة في الدفاع عن بكر، وكلتاهما قيلت في الخصومة نفسها بين يدي عمرو بن هند. ومعهما صفحتا الشاعرين، وخبر الخصومة، ومقتل عمرو بن هند، و«ألهى بني تغلب عن كل مكرمة»."
