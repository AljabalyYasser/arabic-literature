date: "2026-10-19"
title: "النثر الجاهلي، والحكماء، وأصحاب الأمثال، وقضية الانتحال"
text: "اكتملت قضايا العصر الجاهلي الخمس. النثر الجاهلي: الخطابة والوصايا والأمثال وسجع الكهّان، ولماذا نسبة النثر أضعف من نسبة الشعر. ومعه مجموعتان: الحكماء والخطباء والوصايا (قسّ بن ساعدة، وأكثم بن صيفي، وأمامة بنت الحارث ووصيتها، وضمرة و«تسمع بالمعيدي»، وذو الإصبع العدواني، وشعراء الحكمة في المفضليات)، وأصحاب الأمثال تسعة أمثال بحكاياتها. وقضية الانتحال: ما قاله ابن سلّام في الشعر الموضوع، وحمّاد وخلف، ومرجليوث وطه حسين والرد عليهما، وكيف يحكم الموقع على نسبة النص."
