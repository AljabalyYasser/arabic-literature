date: "2026-10-16"
title: "في صفحة كل شاعر: يُنسب إليه وليس له"
text: "أبيات يلقاها القارئ باسم الشاعر ولا تثبت له، مع ما وجدناه في ديوانه والمصادر القديمة: «سيذكرني قومي إذا الخيل أقبلت» لأبي فراس لا لعنترة، و«لقد أسمعت لو ناديت حيًّا» لعبد الرحمن بن الحكم لا لدريد، و«ولست بخالع درعي وسيفي» لا نجدها للمهلهل في شيء من مصادره. عشرون بيتًا ومقطوعة لتسعة شعراء. ومعها قراءة جديدة لبيت طرفة «إذا القوم قالوا من فتى» بجوار بيت متمم بن نويرة، و«لكل شاعر حالته» في موضوع المعلقات."
