date: "2026-10-17"
title: "حاتم وأمية، والكرم والوفاء، والحنفاء وأهل القرى"
text: "اكتمل بها الأعلام المهمون في العصر الجاهلي. حاتم الطائي و«أماويّ» وأخبار جوده، وأمية بن أبي الصلت وشعره بدرجاته وما اختلط منه بشعر أبيه وابنه. ومجموعة الكرم والوفاء: السموأل وأدراع امرئ القيس، وعمرو بن شأس وابنه عرار، وكعب بن مامة. ومجموعة الحنفاء وأهل القرى: زيد بن عمرو بن نفيل وورقة، وقيس بن الخطيم، وأبو قيس بن الأسلت، ومالك بن العجلان وحرب سمير. ومعها أربعة مداخل في مجموعة الحيرة، منها أبو الصلت الثقفي ومدحته في سيف بن ذي يزن."
