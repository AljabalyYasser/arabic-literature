date: "2026-10-17"
title: "فحول المفضليات: علقمة وعبيد وبشر وأوس بن حجر"
text: "أربعة أعلام بصفحاتهم ونصوصهم: علقمة الفحل وروائعه الثلاث، ومعها خبر فكاكه أخاه شأسًا وحكومة أم جندب بينه وبين امرئ القيس. وعبيد بن الأبرص و«أقفر من أهله ملحوب» وخبر يوم البؤس. وبشر بن أبي خازم ومفضلياته، وخبر هجائه أوس بن حارثة وعفوه عنه. وأوس بن حجر رأس الطبقة الثانية وراوية زهير، ومرثيته في فضالة، ووصفه القوس، ورائيته في المطر التي يتنازعها هو وعبيد."
