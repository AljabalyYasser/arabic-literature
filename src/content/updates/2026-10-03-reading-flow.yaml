date: "2026-10-03"
title: "قراءة متصلة لا تنقطع"
text: "الحكايات والمفاهيم والأعلام داخل الفصول تنفتح الآن في مكانها، والإحالة تُظهر كتابها وموضعه دون مغادرة الصفحة. وفي كل فصل فهرس يتبعك وأنت تقرأ، وشريط يريك موضعك من الطريق، وإذا خرجت إلى صفحة أخرى أعادك زر إلى السطر الذي كنت عنده."
links:
