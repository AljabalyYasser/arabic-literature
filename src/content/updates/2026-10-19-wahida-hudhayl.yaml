date: "2026-10-19"
title: "أصحاب الواحدة، وشعراء هذيل، وديوان طفيل"
text: "مجموعتان من وجوه العصر الجاهلي. أصحاب الواحدة والمقلّون المحكمون: الحصين بن الحمام، والأسود بن يعفر و«نام الخليّ»، ويتيمة سويد بن أبي كاهل كاملة، والمسيّب بن علس، والحادرة، وسلامة بن جندل، والمثقّب العبدي، وثعلبة بن صعير، ومعهم سبع مفضّليات. وشعراء هذيل، مقابَلةً بشرح السكري: أبو خراش، وأبو كبير ولاميّته، والمتنخّل ومرثيته في ابنه أثيلة، وصخر الغيّ، وعمرو ذو الكلب. ودخل سجلَّ المصادر ديوانُ طفيل الغنوي برواية الأصمعي، ومعجم البلدان لشرح الأماكن."
