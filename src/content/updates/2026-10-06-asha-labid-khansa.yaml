date: "2026-10-06"
title: "ثلاثة مسارات جديدة: الأعشى ولبيد والخنساء"
text: "صار لكل منهم مسار كامل: حياته وأخباره بدرجاتها، وقصيدته الأم مشروحة بيتًا بيتًا («ودّع هريرة»، ومعلقة لبيد، ورائية الخنساء في صخر)، ثم قصائد أخرى تُقرأ كاملة. وفي مسار الخنساء قسم يعرّفك بصخر قبل أن تقرأ رثاءها له."
