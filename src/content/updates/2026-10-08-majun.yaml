date: "2026-10-08"
title: "قسم جديد في كل عصر: المجون، قصصه وأشعاره"
text: "أول أقسامه في العصر الجاهلي: خمر الحيرة والبادية، وليالي امرئ القيس والأعشى والنابغة والمنخّل، ونوادر المجّان، وأحكام النقاد القدماء فيها. وصارت الأبيات الصريحة تُعرض في قصائدها بشرح واضح، وتجمعها هذه الصفحة."
