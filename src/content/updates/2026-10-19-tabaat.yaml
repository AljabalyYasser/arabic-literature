date: "2026-10-19"
title: "ديوانا امرئ القيس وطرفة على طبعتي الأعلم"
text: "قوبلت قصائد امرئ القيس وطرفة في الموقع بطبعتي رواية الأصمعي وشرح الأعلم المعتمدتين: تحقيق أبي الفضل إبراهيم لديوان امرئ القيس، وتحقيق درية الخطيب ولطفي الصقال لديوان طرفة. أُخذت قراءة الطبعة حيث خالفتها نصوصنا وذُكرت القديمة، وقوبلت معلقة امرئ القيس بيتًا بيتًا برواية الأعلم. وأُعيد النظر في درجات قصائد طرفة على قاعدة الموقع: ما في رواية الأصمعي صار «ثابتًا»، و«سائلوا عنّا» «مختلف فيها». ونُقلت إحالات الأغاني إلى طبعة دار الكتب، وإحالات المرزوقي إلى تحقيق أمين وهارون. وصارت أبيات منفردة في صفحتي أيام العرب وحياة امرئ القيس تُقرأ في قارئ الأبيات بشرحها الكامل، ودخلت مفضّلية المسيّب بن علس."
