date: "2026-10-08"
title: "قصائد مشهورة أُضيفت بعد مراجعة الشهرة"
text: "راجعنا ما يقرؤه الموقع لكل شاعر كتبناه بما حفظته المختارات القديمة وما خصّه النقاد بالذكر، فأضفنا اثنتي عشرة قصيدة كانت غائبة، منها «ليس الجمال بمئزر» لعمرو بن معديكرب، و«أحار بن عمرو» لامرئ القيس، و«رحلت سمية» للأعشى، وأبياتًا مشهورة في مواضعها بدرجات نسبتها."
