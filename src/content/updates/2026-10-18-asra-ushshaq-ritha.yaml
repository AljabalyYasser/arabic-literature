date: "2026-10-18"
title: "الأسرى، والعشاق، والرثاء والشواعر"
text: "ثلاث مجموعات من وجوه العصر الجاهلي. الأسرى وقصائد الساعة الأخيرة: عبد يغوث و«ألا لا تلوماني» وقد شُدّ لسانه، وصخر بن عمرو و«أرى أم صخر»، وأفنون والكاهن. والعشاق: المرقشان، والمنخّل، وعبد الله بن العجلان الذي مات عشقًا، وخزيمة والقارظان، ومسافر بن أبي عمرو، والسليك بن مجمّع وأبيات «روّيت من دمها الثرى» ونسبتها. والرثاء والشواعر: الخرنق، وجليلة، ودختنوس و«الصيف ضيعت اللبن»، وأعشى باهلة ومرثيته في المنتشر، وابن عنمة، وكبشة."
