date: "2026-10-18"
title: "أوائل الشعر، والمعمّرون، ووصّافو الخيل"
text: "ثلاث مجموعات أخرى من وجوه العصر الجاهلي. أوائل الشعر وأخبار البدايات: كيف بدأ الشعر عند ابن سلّام، وعُفَيرة بنت عبّاد وقصة طسم وجديس، وأجداد القبائل الذين يروي لهم ابن سلّام «قديم الشعر». والمعمّرون: عمرو بن قميئة و«رمتني بنات الدهر»، وزهير بن جناب، وعبد المسيح بن بقيلة ومحاورته خالدًا، والمستوغر، والربيع بن ضبع. ووصّافو الخيل: أبو دؤاد الإيادي وخبر «جار كجار أبي دؤاد» برواياته الثلاث، وطفيل الغنوي، والأسعر الجعفي."
