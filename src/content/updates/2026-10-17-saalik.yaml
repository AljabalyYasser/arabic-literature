date: "2026-10-17"
title: "الصعاليك: الشنفرى وتأبط شرًّا وعروة بن الورد"
text: "صفحات الصعاليك الثلاثة الكبار ونصوصهم: تائية الشنفرى، ولامية العرب ودرجتها والخلاف في نسبتها إلى خلف الأحمر، ومفضلية تأبط شرًّا الأولى وقطعتا الغول، و«أقلّي عليّ اللوم» لعروة. ومعهم صفحة مجموعة الصعاليك: الصعلكة ظاهرةً، والسليك بن السلكة، وقيس بن الحدادية، وأبو الطمحان القيني، وعمرو بن براقة. وصار بيت عروة «تغافلت حتى يستر البيت جانبه» بجوار بيت عنترة «وأغض طرفي»."
