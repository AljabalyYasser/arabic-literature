date: "2026-10-17"
title: "في بلاط الحيرة: عدي بن زيد ولقيط بن يعمر والمتلمس"
text: "صفحة عدي بن زيد شاعر الحيرة: إحدى عشرة قصيدة وقطعة، منها «أرواح مودّع أم بكور» و«أبلغ النعمان» من حبسه، وأخباره مع كسرى، وحبسه وموته، وهند بنت النعمان. ومعه صفحة مجموعة «في بلاط الحيرة والملوك»: لقيط بن يعمر و«يا دار عمرة» وإنذاره إيادًا، والمتلمس صاحب الصحيفة، وأبو قردودة ونهيه عن منادمة الملوك، وجذيمة الأبرش وقصة الزبّاء وقصير، والممزق العبدي، وغيلان بن سلمة وجوابه لكسرى."
