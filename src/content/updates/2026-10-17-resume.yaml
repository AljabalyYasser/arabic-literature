date: "2026-10-17"
title: "أكمل من حيث وقفت"
text: "صار الموقع يتذكر آخر ما قرأته وموضعك فيه: الفصل أو النص أو البيت أو الحكاية، والقسم الذي وقفت عنده. فإذا عدت بعد يوم أو أيام وجدت في رأس الصفحة الرئيسية رابطًا يعيدك إلى الموضع نفسه، وفي أسفل أول صفحة تفتحها زرًّا يفعل ذلك. والحفظ في متصفحك وحده، بلا حساب ولا تسجيل."
