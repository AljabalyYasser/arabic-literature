date: "2026-10-03"
title: "أيام العرب: من البسوس إلى ذي قار"
text: "أربعة أيام جديدة في قضية «أيام العرب»، بأخبارها ورواياتها وشعرها: شعب جبلة، والفجار التي شهدها النبي ﷺ صغيرًا، والكلاب الثاني، وذو قار."
